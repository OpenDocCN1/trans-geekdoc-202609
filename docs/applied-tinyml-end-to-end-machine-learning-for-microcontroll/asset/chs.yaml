  \n材料近似成本为 $330。\n\n### 用例：跌倒检测\n\n检测跌倒事件在多个领域有许多安全应用，包括工业监控、可穿戴技术和事故预防。跌倒的特征是由于重力物体物体加速度，可以使用分析加速度计和陀螺仪数据的技术来识别。\n\
  \n#### 工人检测\n\n问题：大型建筑公司希望实现一种能够检测工人在施工现场是否绊倒或跌倒的系统。该系统能够快速响应并提供现场医疗团队的援助。所有工人被要求穿一件可以容纳运行\
  \ `TinyML` 模型的小型设备的背心。该系统需要电池供电（至少持续一天），并能够与工头办公室进行无线通信，以便在发生跌倒时提醒他们。该系统应能够支持数百个设备，每个工人一个。\n\
  \n解决方案：建议的解决方案涉及使用微控制器运行运动分类模型。该模型接收来自安装在可穿戴设备（如背心、别针、帽子或腕带）上的加速度计数据。`TinyML` 分类模型能够检测设备何时处于跌倒状态，并立即向网络发送消息报告事件。当收到跌倒消息时，连接到可穿戴设备的声音警报和灯光警报都将被激活。\n\
  \n下图显示了建议的解决方案及其组件之间的连接：\n\n![](img/figure_3_17.png)\n\n图 3.17：解决方案概念（工人跌倒检测）\n\n\
  \n\n为了收集自由落体训练数据集，我们利用一个配备了 `Edge Impulse` 数据采集客户端的数据采集设备，并在一个不同形状和重量的多个物体上安装了一组加速度计（三轴），然后让它们在受控环境中进行自由落体。此外，我们还请了一位专业舞者（在其身上安装了加速度计）在工作室内模拟自由落体。不出所料的是，我们发现加速度与质量无关。然而，某些力（例如自由落体期间的旋转）会产生离心加速度，也会被加速度计检测到。当静止物体位于平坦表面上时，加速度计读数将显示两个分量为零，但其中一个将显示接近\
  \ `9.81m/s²` 重力加速度的数值，这是地球上的重力加速度。当该物体处于自由落体状态时，所有读数都归零。这是加速度计物理实现的一种特定特性；并不意味着加速度消失了。然而，这对于检测自由落体非常有用，因为我们正在使用的神经网络将观察到指向地中心的轴上从重力加速度过渡到零的曲线形状。该监督学习数据集的标签为：`Free\
  \ fall simple`、`free fall spinning`、`free fall throw` 和 `Static`。\n\n以下系列图片了代表不同自由落体场景的样本：简单自由落体、抛掷自由落体旋转自由落体。此外，还展示了一个静态物体的图用于对比：\n\
  \n![](img/figure_3.18.png)\n\n图 3.18：简单（垂直）自由落体\n\n*   `free fall simple` 样本：`Z`\
  \ 方向的加速度（`accZ`）显示为 `-9.81m/s²`，代表地球重力加速度。要注意 `Z` 加加速度在自由落体期间是如何接近零的。\n\n![](img/figure_3.19.png)\n\
  \n图 3.19：抛物线抛掷和自由落体\n\n`free fall throw` 样本（由于重力作用具有水平和垂直分量的抛物线轨迹）。注意 `accY` 如何显示表征抛掷的加速度和加速度，这与\
  \ `accZ` 上的自由落体分量无关。\n\n![](img/figure_3.20.png)\n\n图 3.20：旋转自由落体\n\n*   `free fall\
  \ spinning` 样本：`Y` 轴加速度（`accY`）受物体旋转影响，而 `Z` 轴加速度独立代表自由落体。\n\n![](img/figure_3.21.png)\n\
  \n图 3.21：静止物体（无自由落体）\n\n*   静态物体样本：`accX` 和 `accY` 为零，而 `accZ` 显示恒定的重力引力。\n\n图 3.22\
  \ 显示了训练、测试和验证数据集的配置。数据集分为两类：`Freefall` 和 `Other`。每个类由不同的数据子组组成。在 `Freefall` 类中，我们采集了\
  \ 30 秒的垂直自由落体、30 秒的抛掷自由落体和 30 秒的旋转自由落体。在 `Other` 类中，数据集包含了任何非自由落体的运动，例如站立、行走和跑步（各\
  \ 30 秒）。然后将整个数据集划分为三部分：70% 用于训练数据集，20% 用于测试数据集，10% 用于验证数据集。\n\n![](img/figure_3.22.png)\n\
  \n图 3.22：训练、测试和验证数据集（工人跌倒检测）\n\n## 处理\n\n原始加速度计数据用于从每个窗口生成 39 个特征。在自由落体事件期间，会从一个轴带有重力的静止状态突然变为另一个所有加速度读数降为零的静止状态。至关重要的是，加速度在自由落体事件期间并没有真正消失；零加速度读数是因为传感器的电子和机械元件在自由落体期间缺乏参考点。当所有读数达到零时，神经网络会识别出自由落体事件。这种从一个静止状态到另一个状态的转换发生在大约\
  \ 30ms 的小窗口内。由于我们的样本长度为 500ms，且我们的处理块以约 100ms 为分块提取 39 个特征，很有可能其中许多分块指示的是静止事件，而不是从静态状态到自由落体状态的切换，而这正是我们想要通过模型检测的。为了解决这个问题，处理窗口需要覆盖整个事件。我们将处理窗口调整为\
  \ 500ms 并运行处理块以获得下面的聚类图。显示两个类在一起的下部聚类包含了自由落体、行走和跑步样本。这是合理的，因为行走和跑步运动类似于带有自由落体分量的倒立摆。尽管如此，正如你所看到的，模型可以毫无问题地区分它们。\n\
  \n图 3.23 显示了相似的运动被聚类在一起。注意所有的自由落体事件都是分组在一起的，而 `Other` 类别形成了三个不同的聚类。这是因为 `Other`\
  \ 类别包含了站立、行走和跑步事件，它们非常不同。然而，为了此用例的目的，它们被归类在同一类中。\n\n![](img/figure_3.23.png)\n\n\
  图 3.23：自由落体与其他事件的聚类图\n\n## 模型\n\n从处理块获得的特征以 `0.001` 的学习率输入到三全层模型中，运行 40 个轮次（epochs）。这产生了\
  \ `96.4%` 的准确率和 `0.16` 的损失，这是在第 33 轮次达到的。我们尝试过运行 60 个轮次的训练，但没有变化；在第 33 轮次时达到了相同的准确率。始终检查你是否使用了足够的训练周期或是否本可以使用更少的周期是非常重要的。我们将学习率修改为\
  \ `0.002`（更快）时，准确率在半的训练周期内（约 16 次）就收敛到了 96%。从这里我们可以学到，数据质量和模型架构对准确率的影响大于轮次数和学习率。训练周期和学习率直接关系到训练模型所需的资源和时间。\n\
  \n接下来的图显示了训练数据如何在不同阶段（训练、验证和测试）分布和使用，每个阶段经历的步骤，以及每个阶段末尾的相关结果：\n\n![](img/figure_3.24.png)\n\
  \n图 3.24：训练、验证、测试和部署阶段（工人跌倒检测）\n\n## 系统实现\n\n下面的图显示了包含三个主要区块及其之间连接的连接图。此外，它还显示了它们的输入、输出和电源：\n\
  \n![](img/figure_3.25.png)\n\n图 3.25：连接图（工人跌倒检测）\n\n区块 1 是采集区块，利用两个微控制器。第一个微控制器是\
  \ `Arduino Nano 33 BLE Sense`，它通过其三个加速度计（`X`、`Y`、`Z`）采集自由落体运动。加速度数据随后发送到嵌入处理块，并输入运行在\
  \ `Arduino` 微控制器上的 `TinyML` 模型。分类过程大约需要 1ms 并占用 1.4k RAM。如果检测到自由落体，`Arduino` 会向\
  \ `NRF52840 Dongle` 发送事件。然后 dongle 准备两条消息：一个用于开启灯光警报，另一个用于触发声音警报，并通过网格网络发送这些消息。\n\
  \n\n\n\n模块 2（即执行器模块）使用 `NRF52840 Dongle` 通过网格网络接收来自 `Block 1` 的消息。它订阅了 `Block 1`\
  \ 发送用于灯光警报的通道。接收到消息后，它将消息负载发送给控制 `NeoPixel` 灯的 `Arduino`。`Arduino` 读取负载，该负载包含一个为预设时间设置警报灯的命令。\n\
  \n模块 3 是另一个执行器模块，同样依赖于一个 `NRF52840 Dongle` 来接收来自 `Block 1` 的消息。在这种情况下，消息指示了要播放哪条轨道以及播放多长时间。随后，dongle\
  \ 将命令发送到连接在轨道播放器机翼上的 `feather`，由它通过连接到其输出端的 `4 Ohm 3W` 扬声器播放预选的警报音轨。\n\n### 源代码\
