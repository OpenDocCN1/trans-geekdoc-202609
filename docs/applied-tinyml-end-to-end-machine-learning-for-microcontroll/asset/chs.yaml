  \ 2`（温度预测）\n\n### 材料清单\n材料清单考虑了 3 个带有恒温器的房间和一个显示单元：\n\n| 描述 | 数量 | 单价 | 总价 |\n|\
  \ --- | --- | --- | --- |\n| `Arduino Nano 33 BLE` | 4 | $30 | $120 |\n| `NRF52840\
  \ Dongle` | 4 | $12 | $48 |\n| `OLED Display` | 1 | $10 | $10 |\n| `Dial/Button`\
