  \n材料的估计成本为 $159。\n\n#### 用例：声音异常\n\n检测异常不需要是一个二值事件，相反，你可以先对事件进行分类，然后使用专门的分类模型来确定该事件是否为异常。以下用例展示了一个先对事件分类然后进行针对性异常检测的系统实现。\n\
  \n##### 机器声音异常\n\n**问题定义：** 一家专门制造汽车配件的小作坊拥有一台切割铝件的 CNC 铣床。工作间所有主注意到，经验操作员可以通过机器在切割材料时发出的声音判断机器是否正常。然而，由于工作间是\
  \ 24*7 小时运行的，不可能让操作员一直守在机器旁。为了防止材料损失，工作间希望找到一种方法在声音不正常时自动关闭机器，以便操作员进行检查。\n\n**解决方案：**\
  \ 在机器附近放置一个麦克风以捕捉实时声音。声音将发送到设备上的声音分类模型进行分类。声音样本还将由异常评分函数进行分析，以确定其是否偏离了典型的运行声音。如果得分超过设定的限制，`MCU`\
  \ 将向开关发送消息以关闭机器并告警操作员。下图所示了一个阐明麦克风和机器紧急开关之间闭环连接的概念图：\n\n```\n![](img/figure_8.17.png)\n\
  ```\n\n图 8.17：概念图（声音异常）\n\n### 数据采集\n\n为了训练模型，我们通过录制正常情况下的机器生成了一个数据集。录音包含了所有被视为正常的已知状态。考虑了以下标状态：机器切割材料\
  \ A、机器切割材料 B、机器空载运行`Figure 8.18` 显示训练集包含每个状态十分钟的数据。由于我们不是训练分类模型来识别异常，因此不需要异常声音。\n\
  \n```\n![](img/figure_8.18.png)\n```\n\n图 8.18：训练集（声音异常）\n\n## 处理\n\n音频信号被分为一秒一段，每段包含\
  \ 50 帧。每帧代表 50 帧的持续时间。（此处重复内容已按要求处理）。\n\n\n\n\n\n该实现由三个 `Block` 组成。第一个 `Block` 负责监听和处理机器声音以判断是否存在异常，而第二个\
  \ `Block` 则在检测到异常情况时关闭机器。第三个 `Block` 在发生异常时为操作员生成视觉和听觉告警。下图显示了 `Blocks` 之间的连接关系：\n\
  \n![](img/figure_8.21.png)\n\n图 8.21：连接图（声音异常）\n\n`Block 1` 使用集成麦克风的 `Arduino Nano\
  \ 33 BLE Sense` 实现。声音被采集后发送到微控制器，微控制器运行 `TinyML` 分类模型以确定声音样本所属的类别。紧接着，`K-means`\
  \ 函数为样本分配一个异常分。如果异常分超过预设阈值，设备将发送一条消息宣布异常。网络通信通过 `NRF52840 Dongle` 实现，该适配器通过 `UART`\
  \ 与主微控制器通信。`Block 1`充当 `BLE Mesh Server`，向专门用于异常检测消息的通道发布内容。\n\n机器的 `Block 2` 监控异常消息并使用继电器开关关闭机器以避免锁定。它还有一个开启/关闭开关，允许操作员手动启用或禁用异常检测关机。该\
  \ `Block` 使用 `Arduino Nano 33` 板板配合 `NRF52840 Dongle` 来接收网络消息。\n\n`Block 3`（可选，图中未显示）负责通知操作员异常事件。它监听由\
  \ `Block 1` 发出的异常消息，并在检测到异常时激活灯光和声音告警。该 `Block` 使用 `Arduino Nano 33` 板板通过 `I2C`\
  \ 协议与告警灯通信。它通过其 `I2S` 输出产生声音，并直接从从级电源放大。`Block 3` 采用采用 `NRF52840 Dongle` 来订阅 Mesh\
  \ 网络中的异常通知通道。\n\n### 源代码](#contents.xhtml#sc4_299a)\n\n`Block one` 中实现的逻辑包括采集声音、提取特征以及对声音进行分类。根据类别，样本被发送到专门的异常检测模型。参考下表：\n\
