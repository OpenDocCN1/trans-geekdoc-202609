  \n\n\n所提出的解决方案是一个音高分类器，用于识别识别大钢琴的七个不同音符（A3, B3, C3, D3, E3, F3, G3）。乐器控制灯光道具的音乐段落是一首完整的歌曲。这首歌是一系列低速音符，它们一个接一个地播放。麦克风将在音乐开始前放置在钢琴附近。声音分类将在音乐表演期间在设备上进行。一旦识别出音符，该模块将把音符转换为预定义的十六进制颜色，并将其作为消息发布到专用网络通道，如下图所示：\n\
  \n\n\n控制 RGB 灯光的每个模块都订阅了该通道，将接收到的颜色并生成信号，以控制其连接的 `NeoPixel` 灯带中每个独立寻址的 `RGB` 灯。\n\
  \n虽然灯光效果不需要极其精确（这里可能会丢失某些音乐音符），但灯光随音乐变化的效果是必要的。设计者希望变化时间不少于一秒。这种变化速率允许模块与低功耗无线网格网络进行可靠通信。\n\
  \n\n为了捕获训练数据集，乐器中的每个音符将在现场演出场所典型的多种环境情况下播放。训练数据将包含以下元素：背景中正在演奏的人和其他乐器，以及一个安静的房间。该意图是泛化乐器演奏时的条件，同时创建一个能够学习识别乐器特定声音并忽略其他所有内容的模型，如图所示：\n\
  \n\n\n\n我们使用 `spectrogram`（频谱图）处理模块从乐器声波中获取特征，因为它是恒定频率的声音。注意不同音高是如何聚类的，某些聚比其他的更近。在图\
  \ 2.27 中，`Other`（其他）标签距离乐器音高簇非常远：\n\n\n\n\n我们正在使用专门处理声音的分类模型 `CNN`，正如本章开头所述（图 2.11）。它包含两个\
  \ `1D` 卷积层、两个各为 0.25 的丢弃层，以及一个输出端由 `Softmax` 函数激活的密集层。为了用从乐器获取的 4,800 个样本训练此模型，我们在\
  \ 0.005 的学习率下运行了 100 个 epoch，批量大小为 32。在该模型训练的早期迭代中，我们使用了 `MFE` 处理器但结果不佳。一旦切换到 `spectrogram`，模型的准确率提高到了\
