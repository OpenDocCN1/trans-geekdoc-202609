  \ 结论\n\n本章介绍了一种传统回归的替代方法，并展示了深度学习的三种不同应用。第一个涉及替换传统系统，第二个侧于通过预测将响应式设备转换为主动设备，第三个探索了如何将回归应用于非数值。在下一章中，你将学习什么是异常检测及其应用。\n\
