  2. 声音经过处理并转换为特征。\n\n3. 模型输出被发送到异常检测函数。\n\n4. `K-means` 函数确定特定类别下样本的异常分。如果发生异常，将向网络发送一条带有告警的消息。\
  \ |\n\n表 8.6：`Block 1` 的伪代码（声音异常）\n\n### 网络](#contents.xhtml#sc4_300a)\n\n为了在高风险环境中避免使用多余的电缆，无线网络是一个可行的方案。在此用例中，使用了无线网格网络（mesh\
  \ network）。只有当 `Block 1` 检测到异常时，消息才会发布到 `Block 2` 订阅的通道。一旦消息通过 `Block 2` 验证，紧急开关就会激活。参考下表：\n\
