  \n材料估计成本为 $947。\n\n## 用例：剖面分析 (Profiling)\n\n传感器融合的一个极佳用例是用推断读数增强现有读数。当物理上无法在特定位置放置传感器（例如，测量火箭发动机内部的温度）或安装过多传感器在经济上不可行时，这种方法可能是必要的。\n\
  \n## 商业建筑中的温度剖面分析\n\n### 问题定义\n\n一家最近翻修的商业建筑所有者希望在实施新的暖、通风和空调 (`HVAC`) 系统之前，为每个楼创建一个温度剖面。他们需要详细了解建筑每个楼的温度分布来实现这一目标。该项目的\
  \ `HVAC` 设计师邀请您的专业知识来安装临时无线传感器网络。这些传感器应该帮助捕捉全面的温度剖面，显示楼图上的温度分布以及其在一天中随时间的变化率。\n\n\
  鉴于这是一个临时设置，在部署传感器网络时保持成本效益至关重要。主要的挑战是在不安装过数量传感器的情况下，为每层楼创建一个具有代表性的温度剖面。传感器的数量及其在楼图中的位置必须仔细考虑。一方面，我们不需要在每个角落和缝隙都放置传感器，因为传感器融合允许我们推断未测量区域的数据。另一方面，传感器融合无法在没有输入的情况下生成数据，因此在每个被剖析的空间中，至少必须有一个或两个传感器捕捉温度变化。\n\
  \n下图说明了该用例中正在开发的概念：在位置的不同区域放置多个传感器，以及一个生成推断读数的传感器融合模块 `Block`：\n\n![](img/figure_6.8.png)\n\
  \n图 6.8：概念图（温度剖面分析）\n\n解决方案：解决方案涉及安装一个无线传感器网络，捕捉每个楼的温度数据。为每个楼层创建独立设置有两个优点。第一个是传感器融合算法将更简单，因为它不需要处理和管理来自不同楼层的数据。通常，空气处理单元独立控制每个楼层，因此每个楼层一个温度剖面是有意义的。第二个原因是，低功耗传感器网络难以穿过厚实的混凝土板。每楼层的独立设置消除了这个问题。一旦我们有了某楼层的设置，就可以根据需要在许多楼层上复制。每个温度传感器将战略性地放置，代表一个温度区域。例如，一个传感器将放在窗边，另一个放在厨房，另一个放在入口。\n\
  \n传感器融合解决方案的分析部分使用卡尔曼滤波（Kalman filter）来估计每个区域的实际温度变化率。\n\n### 数据采集\n\n获取同一楼层的多次读数带来了一个有趣的挑战，即保持所有设备同步到同一时间戳。微控制器没有用于精确长时间计时的专用实时时钟\
  \ (`RTC`)；相反，它们有计时器。这些计时器计算来自 `MCU` 的机器周期数并推断一秒的长度。问题在于这充其只是一个近似；时间经常会偏移，因为微控制器正在使用其核心执行其他任务。每个微控制器都添加了一个名为\
  \ `RTC` 的专用时钟作为外设来解决这个问题。实时时钟使用专用晶体以高精度测量时间的流逝，并且通常带有集成电池，即使在微控制器重位或关闭时也能跟踪时间。一旦安装了\
  \ `RTCs`，您需要确保所有 `RTCs` 具有的时间和日期。为了实现这一点，其中一个传感器每分钟广播一次时间戳。其余传感器将根据该时间戳更新它们的 `RTC`。\n\
  \n每个传感器将其原始读数和时间戳存储在 `SD 卡` 上，以便在温度剖面完成后进行分析。训练集由来自建筑楼层六个不同区域的 1008 小时的读数。参考下图：\n\
  \n![](img/figure_6.9.png)\n\n图 6.9：训练集（温度剖面分析）\n\n## 处理\n\n在此用例中，我们将使用卡尔曼滤波来计算测量区域的真实温度（记住传感器是有噪声的）和温度变化率。温度变化率高的区域无法容易保持温度。相反，温度变化率低的区域表明该空间温度不会剧烈波动。分析并不试图解释为什么会这样；它只是显示了这种情况正在发生。更深入的热力学分析（这超出了本书的范围）可能会揭示附近的窗户、隔热、地板材料或空间形状可能导致温度波动的根本原因。\n\
  \n传感器融合算法的工作原理如下：\n\n\n\n\n\n1. 我们使用多输入卡尔曼滤波器将每个传感器读取值与其相邻读取值结合起来。这种方法的的原理是对每个读取值进行一次预测，并根据参与聚合的传感器数量进行相应次数的修正。这样，每个传感器都独立贡献以计算真实的温度状态。图\
  \ 6.10 显示了原始读取值。输出是一个代表给定空间修正温度的单一时间序列。我们将该时间序列输入到下一步。参考下图：\n\n![](img/figure_6.10.png)\n\
  \n图 6.10：多传感器输入（温度分析）\n\n2. 使用上一步的输出，我们通过确定温度随时间变化的导数来计算温度变化率。这是通过计算当前温度与预测温度之间的差，并除以这两个状态之间的时间间隔来实现。该过程使用了卡尔曼滤波器，其中状态转移矩阵包含了将变化率预测转换为当前状态的微分方程，然后使用最新的测量值进行修正。图\
  \ 6.11 展示了第一阶段融合（融合 1）的输出及其导数（融合 2）。导数的物理含义是房间保持温度的能力。工程师利用这些信息来设计 HVAC（暖空调）设备并进行建筑改进。\n\
  \n![](img/figure_6.11.png)\n\n图 6.11：融合的温度与变化率（温度分析）\n\n## 系统实现\n\n参考下图：\n\n![](img/figure_6.12.png)\n\
  \n图 6.12：连接图（温度分析）\n\n此用例通过多个数据采集单元实现，这些单元之间通过相互通信以交换温度读取值。这种协作实现了本地传感器融合，并将聚合的数据保存到\
  \ SD 卡中。\n\n每个单元都有一个温度传感器和一个用于数据记录的 SD 卡模块，通过 `I2C` 协议连接到主微控制器板。主脚本中的定时器触发对传感器的计划温度读取。此外，通过通用异步收发发器（`UART`）集成了一个次级微控制器\
  \ `NRF52840`，以便在收集到原始温度数据后立即进行发布。\n\n此外，该次级微控制器设置为接收来自相邻传感器的更新，并将任何新数据转发给主微控制器。这些输入数据随后被存储在循环缓冲区中，传感器融合算法利用该缓冲区来计算最新的温度及其变化率。\n\
  \n### 源代码\n\n在下表中，主要组件是用于捕获并持有数据的数据处理组件，以及执行多传感器卡尔曼滤波的传感器融合组件：\n\n|  c:tinyml\\\
