  \ 函数进行归一化。\n\n\n\n\n- [特征提取是开发任何机器学习或深度学习模型最重要的步骤之一](https://medium.com/@MuhyEddin/feature-extraction-is-one-of-the-most-important-steps-in-developing-any-machine-learning-or-deep-94cf33a5dd46)\n\
