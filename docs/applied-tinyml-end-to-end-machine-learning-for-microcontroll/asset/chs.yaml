  \ 的处理\n\n此用例演示了基于 `MEF` 的处理模块的应用，该模块忽略了信号中任何对人类语音感知不重要的特征。\n\n### 在商业场所检测嘈杂的人员\n\
  \n**问题定义**：一家人气餐厅的所有板担心排队等待的顾客可能太吵，会对同一栋楼的邻居造成干扰。老板希望经理在外面等候的顾客产生的噪音过大时能接收到一个视觉信号。噪音检测器应该忽略其他街道声音，例如经过的大型卡车。\n\
  \n**解决方案**：解决方案由一个数据采集模块组成，该模块捕捉餐厅外的声音，并对其进行处理和分类，以判断顾客是在说话还是在大声喧。为了实现这一点，模块不仅需要检测人类对话，还需要检测其音量水平。一旦模块检测到事件，它就会向警报灯发送命令，餐厅经理可以看到该灯光并采取补救措施。请参考下图：\n\
  \n![](img/figure_2_30_NEW.png)\n\n图 2.30：显示数据采集模块和警报组件的解决方案概念\n\n### 数据采集\n\n数据集主要由两类数据组成：`Noisy\
  \ people` 和 `traffic noises`。`noisy people` 的原始数据集创建于网上找到的派对和酒吧录音。问题在于，它并没有反映人们在特定去这家餐厅排队时大声的真实声音。幸运的是，我们可以去餐厅直接从源头录制所需的声音来训练模型。第二类模型使用汽车经过的音频样本进行训练。在实际位置，麦克风的位置、声音强度以及车辆类型及其模式都非常不同。因此，我们还采集了餐厅外的交通声音样本。需要强调的一点是，你的模型好取决于你提供的数据。在用例的剩余部分中，我们将使用第一版数据（从在线视频中采集的较差数据），以便让你看到它在整个系统中的效果。请参考下图：\n\
  \n![](img/figure_2.31.png)\n\n图 2.31：数据采集事实（噪音检测）\n\n## 处理\n\n我们正在使用 `MEF` 处理，因为需要检测人类感知。注意：使用的数据捕自于路口人们的在线视频。由于这些数据最初是为了不同的目的创建的，导致处理性能不佳。\n\
  \n| 备注 |\n| --- |\n| 使用的数据捕自于路口人们的在线视频。 |\n\n![](img/figure_2.32.png)\n\n图 2.32：聚类图\n\
  \n## 模型\n\n在本章开头介绍的专门用于声音的 `CNN` 分类模型用于区分大声的人和街道噪音。该模型使用两个具有 `8` 和 `16` 个滤波器（`3x3`）的\
  \ `convolutional layers` 来识别特定特征，`ReLU` 激活函数消除负值，两个步长为 `two` 的 `MaxPooling layers`\
  \ 用于压缩样本大小，两个 `dropout layers` 用于减少过拟合，以及结尾由 `Softmax` 函数激活的 `dense layer` 将结果归一化为概率分布。有趣的是，虽然验证过程显示准确率为\
  \ `93.2%`，但当针对测试数据运行时，准确率大幅下降到 `47.32%`。在分析混淆矩阵后，我们发现嘈杂人员的声音经常与街道噪音混淆。\n\n解决此问题的方法是从安装所在地采集更高质量的数据。我们的测试表明，这样做我们可以在实际情况下获得超过\
  \ `90%` 的准确率。请参考下图：\n\n![](img/figure_2.33.png)\n\n图 2.33：训练、验证、测试和现场部署统计数据\n\n\
  ## 系统实现\n\n解决方案由通过 `BLE mesh network` 连接的两种类型的模块组成。第一类是采集模块（`Block 1` 和 `Block 2`），它们放置在需要检测噪音事件的商业场所的不同位置。第二类是中央模块（`Block\
  \ 3`），它订阅采集模块并跟踪它们的状态。一旦任何模块发布了噪音事件，中央模块就会激活视觉警报，如图所示：\n\n![](img/figure_2_34_NEW.png)\n\
  \n\n\n\n\n# 图 2.34：连接图（噪声检测）\n\n模块 1 和 2（采集模块）是相同的。它们使用了两个块微控制器板。第一个是 `Arduino Nano\
  \ 33 BLE`，用于从麦克风采集数据、对其进行处理并运行 `TinyML` 模型。第二个是 `NRF52840 Dongle`，用于从 `Arduino`\
  \ 获取推理结果，将其进行缓存并发布到网格网络中供其他节点使用。\n\n模块 3（执行器模块）也使用了两个微控制器。第一个是 `NRF52840 Dongle`，用于接收网络消息；第二个是\
  \ `Arduino 33 BLE`，用于将接收到的信息转换为 Hex 颜色并向 `NeoPixels` 发送命令切换到该颜色。\n\n## 源码\n\n参考下表：\n\
