  \ 3。\n\n# 第 8 章 异常检测\n\n## 引言\n\n异常检测是一种用于分析数据以识别与预期不同模式的技术。在 TinyML 系统中，这些异常模式（被称为异常、离群值或例外）可能由于硬件故障、系统干扰或新且未知的环境状况引起。异常检测对于边缘设备特别有用，因为实时检测和立即解决至关重要。为了检测异常，可以使用统计、机器学习或深度学习方法来构建理解系统行为的模型。图\
  \ 8.1 展示了一种基于距离的异常检测方法。在多个参数定义行为的多维空间中，相似的数据点往往形成一个类。异常被识别为偏离该类的点，其距离大到足以与正常模式分离。距离也被称为异常评分。\n\
  \n![](img/figure_8.1.png)\n\n图 8.1: 异常评分\n\n## 结构\n\n涵盖主题：\n\n- 异常类型\n- 精确率与召回率\n\
  - 距离计算\n- 特征重要性\n- K-means 聚类与异常检测\n- 案例：运动\n- 案例：声音\n- 案例：时间\n\n## 目标\n\n本章的目标是介绍异常的概念、它们是什么以及如何检测。在本章结束时，你将学习异常的类型、其背后的原理以及在实时场景中标记这些异常的实现细节。你还将理解精确率和召回率之间的区别、计算距离的不同方法，以及如何确定关注哪些特征来发现异常。\n\
  \n### 异常类型\n\n异常可分为两类：单变量异常和多变量异常。单变量异常可以通过单个变量进行检测。相反，多变量异常需要同时分析多个相关变量。例如，一个家庭的用电量看起来正常，但如果考虑到季节等额外因素显示在不需要加热或制冷的日子里用电过量，它可能是不常的。\n\
  \n图 8.2 展示了不同维度上的异常。每个维度代表一个有助于判断是否存在异常的变量。\n\n![](img/figure_8.2.png)\n\n图 8.2:\
  \ 单变量与多变量异常\n\n\n\n\n异常可以通过两种主要方法进行检测：距离法和统计法。距离法涉及测量正常读数与目标点之间的间隔，间隔越大，发生异常的概率越高。另一方面，统计法从数据中计算概率分布，并将低概率的点识别为异常。下图是这两种类型异常的抽象表示。\n\
  \n![](img/figure_8.3.png)\n\n图 8.3：基于距离和统计的异常检测\n\n除了单变量和多变量异常外，还有第三类异常被称为**集体异常（collective\
  \ anomalies）**。这些异常的特征不是单一的数据点，而是一段时间内的一系列点。例如，考虑一个通常每天发生一次的事件突然开始频繁发生。虽然由于单次发生从孤立角度来看并不是异常的，但其频率和模式表明存在异常。这种集体性突显了异常行为的另一个方面，关注的是事件的异常聚合，而非孤立事件。\n\
  \n## 精确率与召回率\n\n在异常检测领域，平衡召回率和精确率至关重要。过度强调其中一个可能会对另一个一个产生负面影响。例如，如果你使用 `TinyML`\
  \ 应用通过嵌入式摄像头进行缺陷检测，高召回率系统会检测出所有真实的异常，但可能将非缺陷物品误判为异常。在避免缺陷输出至关的情况下，这种方法非常有用，即使这意味着要放弃一些好的物品。另一方面，高精确率系统可确保被标记的物品确实有缺陷，但可能会漏掉一些缺陷。[图\
  \ 8.4]显示了这两种情况。在高召回率低精确率的图中，所有正样本（蓝色三角形）都在异常阈值之内，代价是包含了异常（白色三角形）。在低召回率高精确率的图中，异常阈值仅包含正样本而没有异常，代价是遗漏了一些正样本。\n\
  \n![](img/figure_8.4.png)\n\n图 8.4：高召回率低精确率对比低召回率高精确率\n\n在 `TinyML` 的实际应用中，异常检测通常与分类模型一起使用。最初，分类器尝试将数据分类到已知模式。然而，由于分类器的固有设计，它们会将即使是不熟悉的模式也分配给某一类。这就是异常检测发挥至关作用的地方。它评估数据并分配异常评分，指示偏离既有类别的程度。如果此分超过特定阈值，系统将覆盖初始分类并将数据重新标记为异常。这种协同方法确保了系统能够识别已知模式，并擅长标记新的、可能重大的偏差。\n\
  \n## 距离计算\n\n计算距离是衡量数据点偏离正常模式或预期行为的关键工具。通过确定特定数据点与数据集其余部分之间的距离，我们可以将异常识别为那些与大多数数据显著偏离的点。这种量化有助于异常检测算法系统地评估单个数据点的唯一性或异常性，从而能够识别潜在异常。此外，距离度量提供了一种减少高维数据维度的方法，从而使其更容易可视化和理解复杂数据集。\n\
  \n在计算距离时，有必要测量数据点与预期行为或参考分布之间的偏差或差异。用于计算距离的技术取决于数据类型和正在使用的异常检测算法。以下是计算距离的一些常用方法：\n\
  \n*   `Euclidean distance`（欧几里得距离）：这是一种简单的指标，用于计算 n 维空间中两点之间的直线距离。它对数值数据特别有用。在二维空间\
  \ [图 8.5] 中中，点 `(x1, y1)` 和 `(x2, y2)` 之间的欧几里得距离计算为 `√((x2 - x1)² + (y2 - y1)²)`。该指标假设特征是独立且等权重的。参考下图：\n\
  \n![](img/figure_8.5.png)\n\n图 8.5：欧几里得距离\n\n*   `Mahalanobis distance`（马哈诺比距离）：这是欧几里得距离的推广形式，考虑了特征之间的相关性和不同的标度。当数据不是球形或特征相关时，它特别有用。马哈诺比距离\
  \ [图 8.6] 的计算方法为：点到分布中心的距离除以该分布在每个维度上的离散程度。\n\n![](img/figure_8.6.png)\n\n图 8.6：马哈诺比距离\n\
  \n*   `Manhattan distance (city Block distance)`（曼哈顿距离/街区距离）：该指标通过累加坐标之间的绝对差之和来计算两点之间的距离（如\
  \ [图 8.7] 所示）。它在处理非连续数据或存在网格结构（如图像或文本数据）时非常有用。\n\n![](img/figure_8.7.png)\n\n图 8.7：曼哈顿距离\n\
  \n距离度量的选择取决于数据的性质、底层分布以及异常检测任务的具体要求。不同的算法和方法可能利用不同的距离度量来有效地检测异常。\n\n## 特征重要性\n\n\
  确定特征的重要性对于检测异常至关重要，因为它有助于识别区分数据集中正常和异常行为的最影响最大的属性。通过了解哪些特征对检测异常贡献最大，更容易选择最相关的属性，从而降低计算复杂度并提高检测准确性。此外，理解特征重要性有助于解释和检测到的异常，为驱动异常行为的底层因素提供见解。此过程通过关注关键特征优化异常检测模型，并通过排除无关属性增强其鲁棒性，最终导致更有效高效的异常检测系统。[图\
  \ 8.8] 是 Edge Impulse 的示例截图，显示了按特征重要性排序的特征列表：\n\n![](img/figure_8.8.png)\n\n图 8.8：特征重要性示例（来源：Edge\
  \ Impulse）\n\n## K-means 聚类与异常检测\n\nK-means 聚类是一种无监督聚类技术，将相似的数据点分组到预定义的簇中。虽然它不是专门为检测异常设计的，但可以通过计算到质心的距离将\
  \ K-means 聚类调整用于此目的。在使用 K-means 将数据聚类后，异常可以被识别为远离所有簇质心的数据点。如果一个数据点距离任何簇质心都很远，它可能被视为异常。异常检测的敏感性受所用距离度量（如欧几里得距离）的影响。[图\
  \ 8.9] 是 K-mean 聚类的输出示例。每个圆形区域簇。不在簇内的样本被视为异常。\n\n![](img/figure_8.9.png)\n\n图 8.9：K-means\
  \ 聚类（来源：Edge Impulse）\n\n## 检测异常的步骤\n\n\n\n为了系统地检测异常，我们评估给定信息偏离正常情况的程度。这涉及将将数据绘制在多维空间中，并测量其到最近簇的距离。让我们来看此异常检测过程的关键步骤：\n\
  \n1. 从显示名义行为的参考数据中，使用 `k-means` 创建定义其空间的簇。计算每个簇的质心（图 8.10）。\n\n![](img/figure_8.10.png)\n\
  \n图 8.10：计算质心的过程\n\n2. 对每个新数据点进行评估。计算它到每个簇质心的距离（图 8.11）。\n\n![](img/figure_8.11.png)\n\
  \n图 8.11：距离计算\n\n3. 通过选择最短距离并与异常阈值进行比较，确定该数据点是否为异常。如果距离大于阈值，则你找到了异常。\n\n### 用例：运动异常\n\
  \n异常检测的一个流行用例是向系统或用户提供即时反馈，以指示某些情况出现问题。这可以扩展到导航系统、控制系统、制造业、人体工程学或任何可以从实时修正中受益的过程。\n\
  \n### 划船机异常\n\n**问题定义：** 健身房希望通过跟踪训练过程中产生的定量指标来监控运动员的表现。划船机是健身房里常用的机器之一，但也经常被误用，这可能导致运动效果降低和受伤。健身房老板希望为用户提供即时反馈，而无需教练。\n\
  \n**解决方案：** 为了解决这个问题，将在划船机手柄上安装一个小型加速度陀螺仪。该设备将检测运动员是否错误地使用机器，并向用户前面的状态灯发送无线消息。如果机器使用正确，则没有指示。然而，如果一次划行无效，红色指示灯将亮起，提示运动员纠正姿态。下图描绘了该解决方案组件的原理图：\n\
  \n![](img/figure_8.12.png)\n\n图 8.12：概念图（运动异常）\n\n### 数据采集\n\n我们在划船机的管状手柄内部安装了一个`Inertial\
  \ Measurement Unit`来收集数据。该设备具有一个`Logger`，可以捕获来自六个不同读取的时间序列：来自加速度计和陀螺仪的 `X`、`Y` 和\
  \ `Z` 轴。我们与五位运动员合作并收集了 40 分钟的数据，每位运动员执行相同的序列，从 50%开始，每分钟增加 10%。我们拍摄了每位运动员的视频，以便将每次划行与其标签（正常与缺陷）进行交叉引用。数据被分为三个子集：70%\
  \ 是训练集，20% 是测试集，10% 是验证集，如图所示：\n\n![](img/figure_8.13.png)\n\n图 8.13：训练数据集（运动异常）\n\
  \n## 处理\n\n数据集被分为 1000ms 的样本，每个样本包含六个时间序列，每个时间序列有 13 个特征。这使得每个样本共有 78 个特征。在 13 个特征中，有\
  \ 8 个描述谱功率，另外 5 个是 `RMS`、`kurtosis`、`spectral kurtosis`、`skewness` 和 `spectral skewness`。异常检测模型与分类模型协同工作。图\
  \ 8.14 中的簇图显示了演示正确使用划船机的样本簇。注意，我们没有错误使用机器的样本。那将由异常检测模型检测。\n\n![](img/figure_8.14.png)\n\
  \n图 8.14：簇图（运动异常）\n\n## 模型\n\n使用分类模型来识别“正确”和“错误”两类。它涉及两个密集层，第一层有 20 个参数，第二层有 10\
  \ 个参数。每层输出端都有一个 `ReLU` 函数。在第二层输出处，我们有一个 `SoftMax` 激活层将输出转换为概率。（注：源文本中的冗余句子已压缩以提高清晰）。\n\
  \n## 系统实现\n\n实现包含两个部分：运动跟踪器和状态通知器，如 图 8.16 所示。第一个部分位于划船机手柄内部，而后者连接在向用户显示机器指标的屏幕上。\n\
  \n![](img/figure_8.16.png)\n\n图 8.16：连接图（运动异常）\n\n第一个部分使用由小型 600MHa 电池供电的 `Arduino\
  \ Nano 33 BLE` 实现。Arduino 加速度计和陀螺仪的读取值并将其发送到微控制器。微控制器包含了用于识别两个类别（正确和错误）的模型。一个函数读取模型输出并使用\
  \ `k-means` 函数计算异常评分。如果异常评分超过预设阈值，MCU 向连接到 Arduino 上的次级控制器发布事件。次级 MCU 是一个 `NRF52840`\
  \ 令牌，向网网发送状态消息。微控制器中实现了一个外部天线，以便信号逃离划船机手柄构成的金属笼。\n\n### 源代码\n\n需要编程到第一个部分的程序是一个无限循环，持续采集加速度计读取值并对其进行分类，然后计算异常评分。如果评分足够，第一个部分将发布警报消息。参考下表：\n\
  \n| c:tinyml_8_1 | 代码位置：Arduino Nano 33 BLE @ 部分 1 |\n| --- | --- |\n| ![](img/table_8.1.png)\
  \ | 采集数据、处理数据、分类运动、生成异常评分。伪代码\n\n```\n1. 设备采集加速度计读取值。\n2. 读取值转换为 39 个特征。\n3. 模型对特征进行分类。\n\
  ```\n\n\n\n4. 计算异常得分。如果存在异常，将向网格网络发送一条消息。\n\n#### 表 8.1：模块 1 的伪代码（运动异常）\n\n| 模块(s)\
  \ | 动作 | 通道 |\n| --- | --- | --- |\n| 1 | 发布到 | CH1 |\n| 2 | 订阅 | CH1 |\n\n####\
  \ 表 8.2：网络配置（运动异常）\n\n#### 耗分析\n\n用例的性质要求异常检测组件（`Block 1`）必须由电池供电，因为它位于划船手柄内部。这些组件使用无线网格网络，其中数据生产者（异常检测）向数据消费者（告警组件）订阅的通道发布消息。使用网格网络似乎有些过度设计，但它允许系统升级。一个升级示例是创建一个中央节点，它可以检测课程期间同时使用的所有划船机的异常情况。\n\
