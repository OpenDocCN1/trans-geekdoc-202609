  . 在处理模块中，对图像进行缩放和重塑。生成的特征被发送到模型 3\\. `TinyML` 模型运行推理并返回识别对象的数组。4\\. 跟踪算法检查每个对象。5\\\
  . 跟踪算法检查是否满足了将跟踪事件视为计数的条件。如果满足，则声明计数事件。 |\n\n表 5.6: 伪代码（人数计数）\n\n### 网络\n\n人数计数设备必须安装在战略位置，网络配置为具有与安装了人数计数器的门数量相同的通道。设备将计数发布到分配给其对应门的通道。虽然多个通道并非严格必须（因为所有门都可以顺利地通过同一个通道发送计数），但为每个门设置一个专用通道可以更容易故障排除并识别计数的来源。\n\
