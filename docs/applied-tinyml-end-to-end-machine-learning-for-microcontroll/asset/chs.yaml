  \ MFCC 处理\n\n在模型需要识别人类语言的情况下，使用基于 MFCC 处理来提取特征。\n\n## 语音激活开关\n\n问题定义：一家老年人护理机构发现患者通过语音指令开关灯非常有用。问题在于这些设备需要网络连接且修复起来复杂。\n\
  \n解决方案：语音命令由带有麦克风的采集模块捕。采集模块识别两个命令：“开”和“关”。一旦识别到命令，模块将向开关发送消息以开启或关闭，如图所示：\n\n```\n\
  images/figure_35.png\n```\n\n### 数据采集\n\n训练集由 4 类组成：开灯、关灯、噪声和未知。开灯和关灯的样本来自 20 名不同的志愿者。他们被要求以不同的速度、语调和音高重复语音命令。背景中的噪声是典型的家庭环境，如大声电视、他人交谈、音乐和厨房声，这些在录制不同样本时存在。噪声类的样本包含背景音但没有语音命令。未知类是随机声音的集合，如喇叭、汽车等。参考下图：\n\
  \n```\nimages/figure_36.png\n```\n\n## 处理\n\n此用例选择的处理模块是 MFCC 算法，因为其倒谱和动态特征专门设计用于表征人类语言。注意观察开灯和关灯的语音命令类在特征聚类图中定义非常清晰。这种可视化是声音样本的二维表示。在此类图中，水平距离比垂直距离更重要。两个聚类在水平方向上分散，在垂直方向上非常接近。你需要考虑到，即使\
  \ `TinyML` 模型可以识别簇的边界，如果发出语音命令的人说话方式使得两种命令比训练数据更相似，我们可能会得到更多的假阳性和假阴性。参考下图：\n\n```\n\
  images/figure_37.png\n```\n\n处理时间约为 0.2 秒。预期的耗时间较长，因为我们正在使用 MFCC，这是步骤最多的专业化处理。\n\
  \n## 模型\n\n\n\n\n我们使用了在本章开头介绍的专门用于口语的分类模型。需要提到，介绍该模型的原始白皮书（参见本书末尾的参考文献）侧重于 `CNNs`\
  \ 和 `MFCCs`，这非常适合此用例。通过重塑函数将数据转换为 13x50 的矩阵。一个具有 8 个滤波器、卷积大小为 3 的 1D 卷积层的输出通过 `ReLU`\
  \ 函数进行激活。然后，将特征输入到 `MaxPooling` 层以选择其最具代表性的值，在此过程中将其尺寸减小一半。对特征应用 `dropout` 函数，通过在训练期间随机且临时地移除特征来减少过拟合，从而创建新的路径以以不同的方式解决相同的问题。紧接着，我们应用第二个\
  \ 1D 卷积层以及相似的 `MaxPooling` 和 `dropout` 函数。最后，我们找到一个全连接层，帮助模型构建输入与标记输出之间关系的函数。最后一个阶段是\
  \ `Softmax` 函数，帮助我们归一化输出。验证期间的准确率为 89.7%，但在训练期间下降到 73.58%。为了使之成为可行的产品，我们需要达到 90%\
  \ 以上。问题是：模型应该适应每一种说话模式，还是用户应该在发出语音命令时适应特定的语速和语调？虽然前者是理想的，但后者并不不方便，并且反映了人们与类似 `Alexa`\
  \ 的设备交互的方式。尝试记住你是如何与商业语音激活助手交流的。你这样做时总是使用相同的语速和语调吗？\n\n下图显示了用于训练、验证和测试模型的数据划分：\n\
  \n![](img/figure_2.38.png)\n\n图 2.38：训练、验证、测试和现场部署统计（语音激活）\n\n运行一个样本通过处理和推理阶段的推理时间约为\
  \ 0.2 秒。这足够短，可以使模型每秒至少运行五个样本。这允许语音命令在不起作用时重复执行，而不会引起处理积压。\n\n## 系统实现\n\n该实现由一个获取声音样本并发布\
  \ `on` 或 `off` 命令的模块，以及实施所需的所需的现成蓝牙开关组成。虽然这个示例假设所有开关会同时开启或关闭，但要为每个开关实现不同的激活词并不复杂。请参考下图：\n\
  \n![](img/figure_2_39_NEW.png)\n\n图 2.39：连接图（语音激活）\n\n模块 1（采集模块）使用两个微控制器：第一个是 `Arduino\
  \ Nano 33 BLE Sense`，用于从麦克风采集数据、处理数据并运行 `TinyML` 模型。第二个是 `NRF52840 Dongle`，用于从 `Arduino`\
  \ 获取推理结果、将其缓存并发布到网格网络供其他节点使用。\n\n模块 2 和 3 是现成的 BLE 网格开关，负责处理高电压（120v，220v）的复杂性和风险。它们像任何其他构建块一样遵循\
  \ BLE-mesh 网络划分和配置协议。它们直接从电源线获取能量。\n\n模块 1 积极监听语音命令，当检测到有效的语音命令时，它向模块 2 和 3 发送 `on`\
  \ 或 `off` 命令。\n\n### 源代码\n\n参考以下逻辑：\n\n1. `Arduino Nano 33 BLE Sense` 从麦克风捕获数据，进行处理并运行\
