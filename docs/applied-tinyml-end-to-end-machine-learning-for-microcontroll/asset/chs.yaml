  \ `Processing` 函数。2. 声波被切成小窗口，转换为频率，转换为 `MFE`，展平，并发送到 `TinyML` 模型运行。3. `TinyML`\
  \ 模型使用提供的数据运行推理并返回结果数组。结果被发送到 `post-processing` 函数。4. `post-processing` 函数检测人员对话、持续时间和音量级。这三个因素的组合决定了是否应该发布警报消息。如果是，则通知主脚本。5.\
  \ 主脚本获取消息并通过 `UART` 发送到网络微控制器。 |\n\n表 2.6：伪代码（噪声检测）\n\n### 网络\n\n这三个模块使用 `BLE` 网格网络来发送和接收消息。每个采集模块发布到不同的通道。模块\
  \ 3 订阅了每一个通道。这是必要的，因为模块 3 必须知道是哪个模块发送了消息，以便跟踪其状态。通过这样做，警报灯的颜色可以根据检测到噪声事件的区域而不同。参考下表：\n\
