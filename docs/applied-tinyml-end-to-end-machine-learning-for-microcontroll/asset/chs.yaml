  \n![](img/fm1.png)\n\n# 第 3 章 运动分类\n\n## 引言\n运动分类是指利用传感器数据（通常来自加速度计或陀螺仪），通过算法自动识别和分类不同类型的物理运动的过程。运动分类涉及捕捉运动数据（如加速度或方向的变化），并使用机器学习模型将这些模式归类为预定义的类别，如步行、跑步、跳跃或其他复杂的运动。运动分类广泛应用于等领域：健身追踪器的活动识别、医疗保健中的跌倒检测、智能设备的手势控制，甚至是机器人领域（在这些领域中，机器必须解释人类动作或自主分析自身的运动）。其目标是创建能够根据从数据中学学习到的模式准确预测运动类型的模型。\n\
  \n## 结构\n本章涵盖了以下主题：\n* 从加速度计采集训练数据\n* 从加速度计提取特征\n* 创建分类模型\n* 用例：正确姿势检测\n* 用例：自由落体检测\n\
  * 用例：运动剖面分析\n\n## 目标\n在本章中，你将探索运动分类所需的关键数据，以及从这些信息中提取有意义特征的技术。你将学习如何使用处理后的数据训练运动分类模型，并实现一个运动分类模型的真实案例。每一步都将引导你完成从原始传感器数据转换为能够准确识别和分类各种类型运动的功能性机器学习模型的过程。\n\
  \n## 从加速度计采集训练数据\n采集运动数据并使用其训练模型的基本原理非常简单：你将加速度计阵列固定在一个正在执行你想学习运动的物体上，在不同条件下采集同一运动的许多样本，并使用该数据集来训练模型；然后，将训练好的模型加载到微控制器中，并向其发送实时加速度读数；之后，微控制器读取并处理运动信号，并识别何时发生了动作。为了训练一个能够识别特定运动的模型，你首先需要采集运动数据。这一过程涉及通过加速度计记录运动，并对数据进行标记以供监督学习。然而，采集运动数据面临若干挑战。其中一个挑战是将特定运动与其他不相关的运动隔离开。这可以在受控环境中完成，即根据命令触发运动，但在许多情况下，很难分离运动，特别是当运动是不可预测的或非常短时。\n\
  \n标记加速度计的时间序列数据可能同样复杂，特别是当事件是不可预测且连续的。例如，当尝试为一个识别鲁莽驾驶的模型采集数据时，很难标记突然的停止。\n\n## 从加速度计提取特征\n\
  除了采集数据，还需要从数据中提取特征。可以将加速度计的三个轴 `x`、`y`、`z` 的时间序列压缩为特征。对于每个轴，可以使用：\n* 谱功率 (spectral\
  \ power)\n* 均方根 (root mean square)\n* 峰度 (kurtosis)\n* 偏度 (skewness)\n\n以下列表显示了使用的频带：\n\
  * 1.95 Hz - 5.86 Hz\n* 5.86 Hz - 9.77 Hz\n* 9.77 Hz - 13.67 Hz\n* 13.67 Hz - 17.58\
  \ Hz\n* 17.58 Hz - 21.48 Hz\n* 21.48 Hz - 25.39 Hz\n* 25.39 Hz - 29.3 Hz\n* 29.3\
  \ Hz - 33.2 Hz\n\n## 谱功率\n以下图展示了功率在频率上的分布（随时间变化的）：\n\n![](img/figure_1.png)\n图 3.1：频率能量级示例（红色：x，绿色：y，蓝色：z）\n\
  \n频带跨越到 33.2 Hz 的原因是因为采集频率为 66.5 Hz。根据奈奎斯特-香农采样定理，你的采样率至少是你想要捕捉的频率的两倍。换句话说，你只能捕捉并完全重建（在\
  \ DTF 的帮助下）小于采样率一半的频率。你可以捕捉的最高频率被称为带宽。我们将带宽分为八等部分，每部分宽 3.91 Hz。我们可以将其分为任意数量的部分。如果我们这样做，只需要调整神经网络的输入层，使其具有与谱功率特征数量相同的输入。目标是计算每个频带包含的功率。如果我们不分频，我们可以告诉神经网络信号的完整功率，但我们已经通过\
  \ `均方根` 特征计算曲线下的面积来实现这一点。在这种情况下，我们希望更具体。显示跨频率的功率分布有助于我们更好地理解和表征信号，知道在哪些频率下身体发生了显著运动。为了做到，我们将读数相乘（因此是平方），以避免负数在平均时相互抵消。我们的操作与计算整个信号的\
  \ `RMS` 时所做的是相同的，但在这种情况下，是针对特定分频率信号的。如果保持现状，信号将无法对齐。高频频带会错误地显示出具有更多功率，尽管它们的水平较低。原因是由于高频，能量在水平上被压缩，由于底座较小，显示为更高的垂直柱。为了进行归一化处理，我们将每个频带的功率除以其频率。现在，我们拥有每个频带的归一化功率表征，并将其输入网络。参考以下图：\n\
  \n\n\n\n\n| 注意：高频率下的 RMS 显示较高，是因为分区的基部较小，尽管样本中的功率是相同的。 |\n\n![](img/figure_3.2.png)\n\
  \n图 3.2：不同频率下的 RMS\n\n### 峰度 (Kurtosis)\n\n峰度表示分布的尾部厚度，而偏度显示了曲线相对于正态分布向左或向右倾斜。\n\
  \n峰度可以解释为数据中异常值的程度。如果你的数据中有许多异常值，意味着你的加速度计捕捉到了大量突然且瞬时的剧烈运动。确定这些运动是噪声还是你想要捕捉的现象的一部分至关重要。\n\
  \n不同类型的峰度及其形状特征如图 3.3 所示。正峰度比正态分布高，且尾部更薄；而负峰度比正态分布低，且尾部更厚。\n\n![](img/figure_3.3.png)\n\
  \n图 3.3：正峰度、零峰度和负峰度\n\n谱峰度（Spectral kurtosis）与时域中的尾部性相似，它涉及频域数据中是否存在异常频率。异常频率意味着一种并不频繁发生的事件，但当它发生时，其表现出与通常显著不同的频率。为了说明谱峰度，考虑一个销售人员，通常每月卖一件商品，但偶尔会在一天内卖出三件。这些事件之间的频率明显不同，但此类情况非常罕见。如果这些不常见的日子几乎从不发生（一生一次），就会导致负峰度，也称为薄尾。如果这些发生是不确定的，但预计会偶尔发生，则导致零峰度，因为即使正态分布也包含异常值。然而，如果它们发生的频率比正常高，就会导致正峰度，也称为厚尾。当应用于加速度计数据时，尽管时间尺度是以毫秒而非月和年衡量的，但核心概念是相同的。\n\
  \n下面的热图（图 3.4）显示了关于频率和窗口长度的谱峰度。对于给定的频率和水平，正谱峰度表示异常值异常值更为常见。\n\n![](img/figure_3.4.png)\n\
  \n图 3.4：谱峰度热图（频率对比电平）\n\n### 偏度 (Skewness)\n\n为了从运动的角度理解偏度的物理意义，请考虑物体的运动范围。在正态分布中，大多数样本属于运动范围的中间部分，极值样本较少。现在，想象一种情况，大多数运动属于范围的顶部。这说明了负偏度。相反，如果大多数样本属于运动的低端范围，那么你就具有正偏。\n\
  \n下面的图显示了具有负偏和正偏的正态分布：\n\n![](img/figure_3.5.png)\n\n图 3.5：负偏对比正偏\n\n谱偏度（Spectral\
  \ skewness）的概念与普通偏度不同。它表示频率分布倾向于更多向低频或高频倾斜，而留下了中值频率。这可以解释为身体正在进行重复的快速运动（如高振动）或重复的缓慢运动（如摆动），而大多数运动发生在中间频率。\n\
  \n通过检查频率频率图，可以很容易理解频率分布的偏度，如下幅图所示：\n\n![](img/figure_3.6.png)\n\n图 3.6：频率分布中的正偏\n\
  \n### 创建分类模型\n\n用于分类运动的 TinyML 模型架构包含一个具有 39 个神经元的输入层、两个由 `ReLU` 函数激活的尺寸为 20 和 10\
  \ 的隐藏密集层，以及一个根据分类事件所需数量类别的输出层。\n\n第一层是全连接密集层，所有 39 个特征都连接到 20 个神经元的隐藏层。`L1` 正则化函数（`delta=0.00001`），也称为\
  \ `Lasso Regression`，有助于通过消除不重要的特征来防止特征很多的情况下过拟合。这是重要的，因为具有大量特征的模型往往会过拟合 (7)。\n\n\
  使用 `ReLU` 激活是为了向神经网络引入非线性。在运动中需要非线性的原因是，不仅需要显示位置变化有多快，还要显示位置变化率的变化率有多快（这不是拼写错误）。线性函数只能显示变化率，但要显示变化率的变化率，就需要非线性函数。\n\
  \n下面的图阐释了输入层、密集层以及正则化函数和 `ReLU` 函数：\n\n![](img/figure_3.7.png)\n\n图 3.7：输入层、密集层、L1\
  \ 正则化函数和 ReLU 激活函数\n\n第二个密集层通过将 `ReLU` 函数的 20 个输出连接到 10 个神经元的层来压缩输出。之后，输出经过 `L1`\
  \ 正则化（`delta=0.0001`），然后通过第二个 `ReLU` 激活函数。多个 `ReLU` 激活函数有助于创建更准确的回归曲线，允许模型具有更好的泛化能力。\n\
  \n图 3.8 显示了第二个密集层以及正则化和 `ReLU` 函数：\n\n![](img/figure_3.8.png)\n\n图 3.8：密集层、L1 正则化函数和\
  \ ReLU 函数\n\n网络中的最后一层是分类层。它接收来自第二层的输出并转换为一组数字，每个数字代表一类。高数值表示对象可能属于该类。这些数字没有归一化，因此它们会通过\
  \ `SoftMax` 激活函数，该函数将结果归一化并转换为概率分布。该分布作为模型的输出。\n\n图 3.9 显示了分类层接收第二个 `ReLU` 的输出并产生由\
  \ `SoftMax` 函数归一化的结果。在这里，`C` 代表类的数量。后处理算法识别集合中的最大数字并根据特定条件宣布分类结果。这些条件包括判断是否存在明显的获胜者，以及一系列连续的分类事件是否都指向同一个获胜者。这一过程对于确保结果的稳定性至关重要。\n\
  \n![](img/figure_3.9.png)\n\n图 3.9：密集分类层和 Softmax 函数\n\n### 用例：正确使用检测\n\n此用例演示了如何应用运动分类来区分正常的振动和旋转与指示故障或使用不当的旋转。通过分析加速度计和陀螺仪的传感器数据，系统可以识别与预期操作行为对应的模式，并检测可能指示磨损、结构性问题或误用的异常情况。\n\
  \n### 工具使用跟踪器\n\n\n\n\n\n### 问题定义\n一个工具制造商请求协助设计一个 TinyML 模型，用以检测人员是否正确地使用工具。他们计划将此模型集成到各种电动工具中。初始关注点是一个手持电钻。该模型应该能够识别所有方向（垂直、水平、倾斜等）的正确和不正确的工具操作。工具制造商希望，当钻头穿入材料的角度保持一致时，模型能向操作者发出警报。\n\
  \n### 解决方案\n所提的解决方案涉及在手持电动工具上安装一个小型微控制器。该微控制器运行一个 TinyML 模型，可以识别电钻的使用方式是否得当。正确的动作是直线运动，而任何与钻头未对齐的振荡运动都被认为是不准确的。安装在电动工具上的微控制器通过方向性\
  \ LED 在工作表面上投射红光，为操作者提供视觉指示。此外，还有一个次级微控制器负责将钻孔事件事件发布到网状网络中。\n\n下图展示了所提解决方案的原理图：\n\
  \n![](img/figure_3.10.png)\n\n图 3.10：解决方案概念图（工具使用跟踪器）\n\n一个听觉警报和一个视觉指示器连接到无线网状网络中的钻孔消息。如果接收到不正确使用的消息，扬声器将播放声音，警报灯将闪烁间性视觉信号。无论使用工具的角度如何，该解决方案都能正常运行。\n\
  \n### 数据采集\n我们为这一特定目的选择了一个手持电钻。钻头的设计旨在按照与其纵轴相同的方向切割材料。尝试以任何其他方向切割材料都会导致钻头和电钻内部部件的损坏。工具的一种常见不正确用法是试图通过圆锥形在孔周围移动电钻来扩大已钻好的孔。另一种常见的不正确用法是尝试以之字形移动电钻来切割材料。为了收集数据集，我们在三种不同的材料（木材、纸和铝材）上钻了约\
  \ 600 个孔。每种材料按四种不同的方向进行钻孔：水平（90º）、从下往上（360º）、从上向下（180º）和倾斜（45º）。一半的孔是以与钻头方向一致的恒定角度钻的（标记为正确钻），另一半的孔是在使用圆锥和之字形运动的同时，将钻头进入材料，且移动角度并非恒定与表面法线对齐。\n\
  \n以下图显示了电钻正确和不正确使用时沿三个轴方向的加速度采样：\n\n![](img/figure_3.11.png)\n\n图 3.11：正确钻孔期间加速度读取采样\n\
  \n*   正确钻孔：此图说明了材料正被垂直穿透。负加速度（`accY`）代表与钻头对齐的重引力，锯齿线是由电钻的振动引起的。\n\n![](img/figure_3.12.png)\n\
  \n图 3.12：不正确钻孔期间加速度读取采样\n\n*   不正确钻孔：加速度计（`accY`）显示由于引力产生的负加速度，而 `accX` 和 `accZ`\
  \ 显示在 `XZ` 平面上的圆锥形振荡运动，垂直于钻轴，周期约为 500 ms，或频率为 2Hz。\n\n下图显示了训练数据集的特征，该数据集包含了各种材料中正确和不正确钻孔实例的样本：\n\
  \n![](img/figure_3.13.png)\n\n图 3.13：训练、测试和验证数据集（工具使用跟踪器）\n\n## 处理\n三个输入轴的数据以 62.5Hz\
