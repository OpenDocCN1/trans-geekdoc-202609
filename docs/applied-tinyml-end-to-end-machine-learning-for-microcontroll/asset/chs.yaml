  \n# 第 7 章 深度学习回归\n\n## 介绍\n\n深度学习回归是一种机器学习技术，它使用深度神经网络来预测连续值。在这种方法中，算法学习将输入数据映射到连续输出（例如实数），而不是将数据分类为不同的类别。\n\
  \n这种技术的命名与其与传统回归方法（如线性回归或多项式回归）的相似性相似。这些方法通过一组数据样本建立数学方程，将独立变量（`X`）转换为因变量（`Y`）。\n\
  \n图 7.1 展示了执行回归时涉及的三个步骤。首先，我们获取一个代表我们想要建模的行为的训练数据集。接下来，我们生成一个捕获并编码该行为的模型。最后，我们使用训练好的模型来推断新的数据点。\n\
  \n![](img/figure_7.1.png)\n\n图 7.1: 回归\n\n## 结构\n\n本章涵盖以下主题：\n\n*   非线性\n*   为回归准备数据\n\
  *   训练回归模型\n*   用例：控制\n*   用例：预测\n*   用例：估计\n\n## 目标\n\n本章的主要目标是帮助你理解深度学习回归如何从数据创建系统。我们将通过教导一个温室控制器管理环境、预测未来条件，并根据图像确定一个物的权重来演示这一概念。\n\
  \n## 非线性\n\n在深度学习回归中，每个神经元执行输入的加权和，加上偏置，并将结果通过激活函数（通常是线性整流单元 `ReLU`）。加权和本身是线性的，但激活函数引入了非线性，使得网络能够捕捉复杂的关系。理解这一点的有助于比喻是一个链：虽然每个链环都是直的，但整个链可以呈现任何形状（如图\
  \ 7.2 所示）。\n\n![](img/figure_7.2.png)\n\n图 7.2: 非线性函数\n\n训练过程涉及多次将数据通过网络。每次传递，神经元的权重和偏置都会进行调整，以减少预测值与实际值之间的差异。这种迭代过程类似于完善一个复杂的方程。结果是一个训练好的网络，能够将输入映射到输出。\n\
  \n![](img/figure_7.3.png)\n\n图 7.3: 训练过程\n\n## 输入与输出\n\n深度学习模型不仅限于单个输出。它可以设计为同时产生多个输出，对于控制场景特别有利。例如，温室的深度学习回归模型可以通过分析温度、湿度光照等因素同时调整照明、风扇和供水。这种多输出能力能够以更集成、响应的方式管理复杂系统。\n\
  \n让我们查看下表，以说明基于输入输出的回归类型：\n\n| 一对一回归 | ![](img/table_7.1.png) |\n| --- | --- |\n\
  | 多一对回归 | ![](img/table_7.1(1).png) |\n| 多对多回归 | ![](img/table_7.1(2).png) |\n\n\
  表 7.1: 基于输入输出的回归类型\n\n### 为回归准备数据\n\n深度学习回归模型可以处理多种数据类型，包括时间序列、形状、图像和声波。然而，在使用这些多样化的输入之前，必须将它们转换为与密集神经网络兼容的数值格式。如果生成的特征处于不同的数量级，你应该对其进行缩放。机器学习中的缩放是指调整值的范围或分布。这一步至关重要，因为它确保了特征对分析的贡献相等，防止数量较大的特征主导模型的决策过程。缩放可以增强模型的稳定性并提高算法的整体性能。\n\
  \n\n\n\n\n一旦数据完成缩放，有两种主要方法来表示这些特征。\n\nA) 作为单个值：每个数字都被视为一个值，例如整数或归一化的浮点数。这种方法更简单，可以减少维度，并且效果良好。\n\
  \nB) 作为位级表示。在这种方法中，每个数字被拆解为单独的二进制特征（0 和 1）。这种方法保留了数据的细粒度细节，并允许模型捕捉位层面的关系，这对于某些应用（如加密或基于哈希的数据）可能关重要。\n\
  \n无论选择哪种表示方式，将特征归一化或缩放到一个相似的范围（例如 `0` 到 `1` 或 `-1` 到 `1`）都是至关重要的，以确保模型高效运行并避免数值不稳定。准备数据需要将所有输入变量转换为矩阵，该矩阵的每行包含所有的输入值。每行都成为一个训练样本。然后，你为每行标记相应的解决方案。解决方案可以是一个单一数字（用于一对一或多对一回归），也可以是一个向量（用于一对多或多对多的回归）。\n\
  \n## 训练回归模型\n\n深度学习回归模型与面向分类的模型有显著区别。关键区别在于，输出不是产生类别概率，而是连续的数值。因此，在输出层之后不需要应用任何额外的变换来归一化值。模型直接生成与训练期间使用的标签值范围一致的数值预测。\n\
  \n通常使用均方误差来确定训练期间的回归误差。在深度学习回归中，网络中最关键的层是全连接层。作为优化过程的一部分，你可以包含更多的隐藏层或使它们变得更宽。参考下图：\n\
  \n![](img/figure_7.5.png)\n\n图 7.5：回归深度神经网络\n\n在传统的回归模型中，由于变量之间关系的复杂性，管理多个输入和输出往往面临巨大挑战。然而，在深度学习回归方法中，这种复杂性容易管理得多。需要增加网络输入层神经元的数量以适应多个输入。每个额外的神经元都可以处理一个额外的特征。同样，输出层的神经元数量也得到了扩展以处理多个输出。这些神经元中的每一个都负责生成所需的输出之一。这种简单直接的可扩展性是深度学习回归的关键优势之一，使其成为处理复杂多维数据的灵活且强大的工具。\n\
  \n## 用例：控制\n\n控制的一种新颖方法是使用深度学习回归根据一组输入来确定控制指标。模型预先通过示例进行训练，这些示例展示了在特定输入下输出应如何表现，类似于通过示例进行教学。在传统的控制系统中，这些知识被编码为显式规则（例如，“如果……，那么……”）。然而，这些系统在没有预定义规则的情况下，往往难以处理边界情况或不可预见的场景。相比之下，深度学习回归从其训练数据中泛化，允许它推断模式并对新输入进行预测，包括一些边界情况。虽然这种方法减少了对手动创建规则的依赖，但其有效性取决于训练数据的质量和多样性。\n\
  \n## 温室控制\n\n**问题定义：** 运营水培农场的团队正启动一项心大勃勃的项目，旨在改进他们的种植实践。他们的目标是在农场的各个方面实现自动化，包括灌溉、照明、空气通风和室内温度控制。农场已经配备了多个光、温度和湿度传感器。\n\
  \n为了实现这种自动化，团队正在探索一种创新方法，以尽量减少对大量编码和数学建模的需求。他们希望开发一个能够通过观察手动操作来学习管理这些环境因素的系统。挑战在于这些环境因素的可能设置组合数量巨大，使得手动教系统每一个可能的场景是不切行的。\n\
  \n理想的解决方案是一个能够根据有限示例进行学习和适应的系统。该系统可以通过从这些示例中学习，在类似的情况下外推并做出明智决策。尽管具有这种自动决策能力，团队仍强调了保持控制的重要性。他们打算建立预定义的限制，以防止系统做出可能危害农场的调整。\n\
  \n此外，团队希望获得有关系统计划操作的实时通知。此功能将允许他们在监控系统决策时进行干预，特别是当他们认为其他方法可能更好时。整合这些功能将实现运营自动化，并确保团队保留监督。\n\
  \n**解决方案：** 系统由传感器组组成，捕捉水培农场每个区域的环境状况。每个传感器组读取温度、相对湿度 (`RH`）和环境光。此外，系统还可以捕捉影响区域读数的执行器位置和状态，即窗户是否打开、风扇是否运行、灯光是否开启以及灌溉系统是否运行（见图\
  \ 7.6）：\n\n![](img/figure_7.6.png)\n\n图 7.6：概念图（温室控制）\n\n需要强调的是，执行器与每个传感器组测量的区域指标之间并不是\
  \ `1:1` 的关系。相反，你可以将此问题视为一个黑盒，执行器是输入，区域指标是输出。模型将执行深度学习回归，能够根据输入输出区域指标。\n\n相反，模型将执行深度学习回归，输出执行器设置以获得一组期望的指标读数。由于温室是一个动态系统（随时间变化），我们不依赖绝对测量值，而是依赖变化率。也就是说，当执行器配置为特定设置时，回归将输出变化率（指标变化有多快）。\n\
  \n使用控制函数的辅助功能将帮助系统根据回归输出建立通往目标状态的路径。\n\n### 数据采集\n\n对于此用例，我们需要捕捉环境内的因果关系，为创建回归模型生成足够的数据。传感器和编码器捕捉负责外部空气和光线的执行器状态。同时，一组环境传感器测量水培农场每个感兴趣区域的指标，如温度、`RH`\
  \ 和环境光水平。\n\n\n\n\n\n目标是在运行良好的一天中捕捉 3300 个因果关系示例（这成为正样本）。每个示例将包含六个变量：`Temperature`（温度）、`Window\
  \ Status`（窗户状态）、`Relative Humidity`（相对湿度）、`Fan Status`（风扇状态）、`Ambient Light Conditions`（环境光条件）和\
  \ `Light Status`（光状态）。理想情况下，我们应该拥有良好和糟糕糟糕天的样本，以便系统从多样化的示例中学习。为了做到这一点，你可以故意制造问题，并在采集输入输出指标时让专家操作员修复现场。参考下图：\n\
  \n![](img/figure_7.7.png)\n\n训练集（温室控制）\n\n系统受三类执行器的影响：\n\n* `Ceiling window`：该执行器通过开启和关闭允许新鲜空气和阳光进入室内空间。窗户的位置影响多个传感器，包括\
  \ `temperature` 和 `RH`（通过引入外部空气）以及 `ambient light`（通过让阳光进入）。\n* `Fans`：一组风扇促进空气循环，传感器通过智能开关检测每个风扇的状态。为了简单起见，我们假设风扇速度保持恒定。风扇主要影响\
  \ `temperature` 和 `RH` 的读数。\n* `Interior lights`：这些 LED 灯由智能开关控制，报告其开启/关闭状态。与其他执行器不同，照明不会影响\
  \ `temperature` 或 `RH` 的读数。\n\n系统以低频率运行，每 30 秒读取一次数据即可。`temperature` 和 `light` 持续小于一分钟的变化对于此用例来说是无关。\n\
  \n每个区域生成三个时间序列：一个用于 `temperature`，一个用于 `RH`，一个用于 `ambient light`。因此，需要聚合的时间序列总数是区域数量的三倍。\n\
  \n在执行器端，每个被跟踪的设备生成一个状态时间序列。例如，如果风扇开启，时间序列的每次读取将显示值为 `1`；如果风扇关闭，则显示为 `0`。\n\n所有时间序列数据都发送到中央聚合设备，在该处进行回归过程。为了确保所有设备的数据同步，每个设备都配备了实时时钟\
  \ (`RTC`)。主 `RTC` 定期向其他设备广播同步消息，通常每分钟一次。这种同步确保所有设备将其 `RTC` 与广播的时间戳对齐。因此，每个记录的数据点在所有设备上都有一致的时间戳，保持了整个系统的精确同步。\n\
  \n## 处理\n\n一旦所有数据到达了处理回归的聚合设备，我们需要对其进行轻微处理以简化计算。步骤如下：\n\n1. 确保所有时间序列的频率相同。如果频率不同，我们可以运行一个简单的重采样步骤。注意检测数据中的显著间隙。如果是那样，你也可以使用回归模型对这些值进行外推或预测，但这超出了本用例的范范围。\n\
  2. 归一化数据。当所有数据都处于同一数量级时，深度学习网络的效果更好。\n3. 剔除离群值。你可以使用 `Kalman filter`（传感器融合）或为该类型的读数设置最大值最小值，并替换任何超出限制的读数。\n\
  \n图 7.8 显示了深度学习模型如何根据特征组织相似的输入样本。彼此靠近的数据点表示模型认为它们具有相似的特征属性，这可能导致相似的回归解决方案。\n\n![](img/figure_7.8.png)\n\
  \n聚类图（温室控制）\n\n## 模型\n\n我们希望回归模型回答的问题是：给定系统的当前状态，如果我们修改输入（或保持不变），系统在下一步的状态将是什么？\n\
  \n在此语境下，系统指的是水培农场中的一个区域。系统状态代表该区域的 `temperature`、`RH` 和 `light conditions`。输入包括可能影响系统未来状态的任何因素，例如窗户、风扇、灯的状态、环境温度、光条件以及系统的当前状态。下一步指的是再次获取系统读数的预测点。通过回归，我们的目标是预测这种状态。\n\
  \n此外，我们可以从相反的角度来看问题：给定系统的当前状态，如果我们想让系统在下一步接近目标状态，我们需要调整哪些输入？\n\n该回归模型并没有提供通往目的地的完整路径，但每次迭代都能帮助向前一步。过程包括运行回归模型以确定下一步，执行建议的操作，然后根据更新的状态重新运行模型。这种步进的方法确保了系统对扰动或外部因素保持响应。\n\
  \n理解如何操作输入以实现输出是非常用的，这类似于学会驾驶。然而，就像汽车需要地图或 GPS 引导一样，该模型也需要引导框架。为了实现这一点，我们将回归模型与传统的控制算法（如比例积分微分\
  \ `PID` 控制器）结合。在这种设置，`PID` 函数为每个指标定义一个目标（设定值），计算当前状态与目标之间的距离，并确定最小化误差所需的修正。回归模型将这些修正转换为针对执行器的特定操作，使系统能够一步步实现其目标。\n\
  \n为了做出准确的建议，分析指标随时间变化的方向和速度至关重要。这是通过计算变化率来实现的，即将当前指标值减去前一个值，然后除以两次测量之间的时间。该计算提供了指标随时间变化的速率和方向。\n\
  \n这引发了一个重要问题：模型应该使用系统的绝对值还是变化率进行训练？答案是两者都有。绝对值将模型锚定在初始状态，而变化率将其锚定在从那时起的行为上。输入数据越多样、丰富，模型性能越好。\n\
  \n深度神经网络全连接层的输入特征由时间序列数据组成，包括来自环境传感器（`temperature`、`RH`、环境光）和执行器（窗户、风扇、灯）的读数。这些特征还包括它们随时间的变化率（导数）。数据相对于目标输出进行了标记。因此，当系统的当前条件和下一步期望的变化率作为输入提供时，模型将输出一组指令，指定调整哪些执行器以实现预期结果。\n\
  \n\n\n\n\n深度学习回归模型使用 20-10 密集网络，展现了强强大的性能，验证集损失低至 0.07，测试准确率高达 98.64%。低损失表明该模型有效地最小化了验证集上预测值与实际值之间的误差，而高测试准确率则表明该模型对未见数据具有良好的泛化能力。验证集损失与测试准确率之间的这种平衡表明模型没有过拟合，并已有效地学习了数据中的底层模式。该架构似乎适用于该问题，数据集可能为准确预测所需的输入-输出关系提供了足够的覆盖。请参考下图：\n\
  \n![](img/figure_7_9_NEW.png)\n\n图 7.9: 训练、验证和测试指标（温室控制）\n\n## 系统实现\n\n实现由两种不同类型的构建块（Blocks）组成。第一个是数据采集块（acquisition\
  \ Block），用于采集温度、`RH` 和光照。水培农场中有多少区域，就有多少 `acquisition Block`。第二个是聚合器块（aggregator\
  \ Block），它接收来自所有 `acquisition Block` 的数据，并执行深度学习回归和 `PID control` 迭代。其余的块是执行器块（actuator\
  \ Blocks），用于控制灯、风扇和窗户位置。完整的设置如图所示：\n\n![](img/figure_7.10.png)\n\n图 7.10: 连接图（温室控制）\n\
  \n`acquisition Block` 使用 `Arduino Nano 33 BLE Sense` 构建，该板上集成了温度传感器、`RH` 传感器和光强传感器。该块使用\
  \ `NRF52840 Dongle` 作为次级微控制器板，负责所有的网络功能，将数据发送到 `aggregator` 并更新 `RTC`。\n\n### 源代码\n\
  \n`Block 1` 主要承担两个功能：从三个不同的传感器（温度、相对湿度环境光照）采集数据，并在将数据发送到 `aggregator` 之前去除数据噪声。伪代码如下表所示：\n\
