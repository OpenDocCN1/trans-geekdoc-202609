  2. 获取电子天平的读取值。\n3. 算法对两个测量值进行归一化处理，并将两个读取值发送到 `Comparison` 函数。\n4. 算法比较测量值并确定是否存在显著重量差异（冲突）。\n\
  5. 如果存在冲突，则激活警报灯。 |\n\n表 7.18: 模块 2 的伪代码（重量估算）\n\n### 网络\n\n无线网格网络实现了两个模块之间的通信。负责采集图像和推断产品重量的模块\
  \ 1 向比较模块订阅的通道发布消息。\n\n| 模块(s) | 操作 | 通道 |\n| --- | --- | --- |\n| 1 | 发布到 | CH1\
