  \ 4.16：材料清单（元件分类）\n\n材料估算成本（一个摄像头，一个触觉套件）：$175\n\n## 结论\n\n在本章中，我们探讨了使图像分类工作的元素，包括准备图像、提取特征、将其输入卷积网络，以及将结果转换为识别最可能类别的统计分布，这被称为分类结果。\n\
  \n在微控制器上运行图像分类引入了一系列新的解决方案，其中检测到的事件不是物理现象（如温度），而是形状或运动的存在。\n\n\n\n\n\n跟踪是指在序列视频帧中识别同一个物体。物体所经过的路径被称为轨迹（track）。为了识别物体，我们使用目标检测模型（如在前一章中讨论的那样）；为了跨帧跟踪物体，我们使用跟踪模型。\n\
  \n图 5.1 通过视觉化地表示物体的路径，展示了跟踪的原理。这条路径允许模型根据之前的读取结果预测物体的下一个位置。当捕获到新帧时，模型会在预测区域内搜索物体。例如，如果路径是直的，模型预期物体将沿直线移动；如果路径是弯的，模型预计物体将沿着曲线移动。\n\
  \n![](img/figure_5.1.png)\n\n图 5.1：下一个位置的预测\n\n跟踪的工作原理非常直观。它首先使用一组规则或模型猜测物体未来的所在位置。然后，它查看下一帧并调整其初始猜测，使其更符合实际发生的情况。\n\
  \n### 需要考虑的事项](#contents.xhtml#sc3_163a)\n\n以下内容是非常困难的，因为我们可能无法直接访问正在跟踪的对象。我们必须依赖雷达或摄像头，而不是像\
  \ `GPS` 这样的内置传感器。目标是通过结合不同类型的传感器信息，获取关于物体位置的最优图像。\n\n跟踪中最大的挑战之一是确保我们跟踪的是正确的物体，而不是被附近的其他物体欺骗（假阳性），或未能检测到物体（假阴性）。`TinyML`\
  \ 目标检测模型的准确性在这一方面起着至关重要的作用。\n\n当我们无法控制物体时，预测它的下一个去向尤为困难。我们必须考虑各种因素，比如它的移动速度、方向的变化，甚至是风力等意外因素。当情况不符合预期时，我们的跟踪工具会结合数学计算、推断性猜测和智能纠正。\n\
  \n### 同时跟踪多个物体](#contents.xhtml#sc2_164a)\n\n在跟踪多个物体时，我们需要将每个物体分配到不同的轨迹，为新检测到的物体创建新轨迹，并在物体离开帧范围时删除轨迹。\n\
  \n#### 分配](#contents.xhtml#sc3_165a)\n\n我们必须确保将正确的传感器数据匹配到正确的物体，特别是当它们靠得很近难以区分时。\n\
  \n这种确定哪条数据属于哪个物体的谜题被称为数据关联问题（data association problem），它对于确保复杂场景下的准确跟踪至关重要。为了保持灵活性，我们正在跟踪的物体数量可能会发生。新物体可能会出现，旧物体可能会消失，这要求我们不断调整跟踪设置。\n\
  \n分配是基于跟踪模型对物体应该所在位置的预测。模型计算每个物体属于每个轨迹的概率，并根据最可能的选项对其进行分配。\n\n图 5.2 显示了分配挑战的视觉化示例，其中有两个物体正在被跟踪（圆形），由三角形表示的新读取值属于\
  \ `track B`，因为它位于预测空间 `B` 内部：\n\n![](img/figure_5.2.png)\n\n图 5.2：轨迹分配\n\n#### 轨迹维护](#contents.xhtml#sc3_166a)\n\
  \n轨迹维护涉及观察、将观测结果与物体进行匹配，以及维护一份我们正在跟踪物体的最新列表。它保持轨迹处于健康状态。如果一条轨迹在几帧内没有与任何物体关联，那么可能是时候消除它了。\n\
  \n观察下图，该轨迹是如何出现了一系列匹配缺失的：\n\n![](img/figure_5.3.png)\n\n图 5.3：轨迹维护\n\n如果出现了一个无法与现有轨迹关联的新物体，可能就是创建新轨迹的时机。如下所示：\n\
  \n![](img/figure_5.4.png)\n\n图 5.4：轨迹创建\n\n然而，我们不能随心所欲地消除和创建轨迹；有时轨迹没有获得关联是因为模型在几帧内未能识别出该物体。在其他情况下，障碍物临时遮挡了物体（视觉上被阻塞）。另一方面，如果模型错误地识别了某些东西，最佳选择是在创建轨迹之前等待几次有效识别。\n\
  \n#### 门控（Gating）](#contents.xhtml#sc3_167a)\n\n优化轨迹维护（即节省内存和计算能力）的策略被称为门控（gating）。它就像在我们跟踪的每个物体周围建立一个围栏。只有围栏内的数据会被考虑，帮助我们关注靠近的物体并忽略其他部分。\n\
  \n看下图，感兴趣区域周围有一个矩形。物体将在该区域内被跟踪：\n\n![](img/figure_5.5.png)\n\n图 5.5：门控\n\n#### 应用](#contents.xhtml#sc3_168a)\n\
  \n一旦我们的系统能够识别物体并创建可靠的轨迹，我们就可以此开启许多应用。以下列出了其中几个：\n\n*   **计数**：我们可以通过检测轨迹与预设区域或边界的交点来计数物体。例如，我们可以计算传送带上输送了多少物体。\n\
  *   **检测事件**：通过跟踪轨迹，我们可以检测物体何时进入区域或跨越边界。例如，我们可以检测球员何时跨越球场边界。\n*   **计时**：我们可以计算物体在帧中停留的时间。例如，我们可以跟踪汽车在停车场内停留了多久。\n\
  \n### 用例：物体计数](#contents.xhtml#sc2_169a)\n\n跟踪的一个非常有实用的应用是对移动物体计数。这需要一个既准确又能快速检测被计数物体的专用分类模型。该模型提供物体在帧中的位置，跟踪算法利用这些位置为每个移动物体分配轨迹。然后，可以设置条件来触发计数（例如当物体跨越边界时），让跟踪系统输出实时计数。\n\
  \n#### 传送带计数](#contents.xhtml#sc3_170a)\n\n**问题定义**：位于长岛市的一家工厂生产一系列烘焙产品。虽然他们的生产经理有一套根据线末箱子数量计算物体数量的流程，但检测到物体在生产线过程中会丢失、掉落在侧或被员工移除。生产经理希望对生产阶段的物体进行计数，以了解损耗情况并制定减少损耗的方案。\n\
  \n**解决方案**：为了解决这个问题，生产经理正在考虑实施一种新策略：在生产线的关键点对物体计数。这种方法将提供定量指标和对生产流程的详细见解，从而识别出损失率较高的阶段。该计划涉及在生产线的关键间隔处安装摄像头。这些摄像头负责计算通过每个生产阶段的物体。下图显示了该解决方案的概念图：\n\
  \n![](img/figure_5.6.png)\n\n图 5.6：概念图（传送带计数）\n\n\n\n\n由于此解决方案将安装在食品设施内，设备将封装在一个透明的气密容器中。这是无线和由电池供电的传感器网络的理想用例。该设备由一个向微控制器发送帧图像的数字摄像头组成。微控制器将提取帧特征并将其输入到对象识别模型，该模型配有一个跟踪算法，用于跟踪物体并在物体跨越传送带上的预设限值时增加计数。该特定设备的计数将传递给负责无线通信的次级控制器。次级\
  \ MCU 将计数封装并发布到发送该设备计数的通道。位于生产线不同位置的所有设备计数将由一个中央 MCU 无线接收，该 MCU 在显示器上显示所有计数，以便操作人员和生产经理根据可用数据做出决策。\n\
  \n### 数据采集\n\n在理想条件下，生产线在受控环境中运行，光照保持一致，物体以预测的速度移动，且形状均匀。然而，现实场景通常有所不同。一个为传送带物体计数准备良好的良好的训练集，应该考虑到正常状态以及边缘情况，例如重叠的物体或不同方向的物体。从与摄像头最终位置相似的位置和角度采集训练集至关重要。\n\
  \n普通摄像头以约每秒 25 帧的速度获取数据。在训练集中包含所有帧可能是没有必要的，因为移动的物体在通过传送带时看起来看起来是一样的。更好的方法是创建一个具有不同位置、方向、光照条件和分组的物体集合。这样模型就能学习如何从各种场景中识别物体。无论模型用在生产线的哪个位置，使用相同的物体针对不同的背景对其进行训练都是至关重要的。这种训练将帮助模型学习独立于背景来识别物体。如果未来传送带（背景）的纹理或颜色由于原因发生变化，模型仍然可以工作。由于我们使用了迁移学习，因此不需要从头开始训练模型。然而，我们仍然需要大约\
  \ 500 张同一类的图像来创建一个稳定的模型。在接下来的图中，我们展示了创建一个具有平衡数量普通情况和边缘情况的数据集：\n\n![](img/figure_5.7.png)\n\
  \n图 5.7: 训练集（传送带计数）\n\n## 处理\n\n为生产线计数系统准备图像从将图像调整为正方形比例开始。这一初始步骤确保正方形涵盖整个传送带的宽度，这对于准确计数至关重要。消除图像中的潜在噪声源也至关重要，例如路过的人员或移动的风扇，因为这些可能会影响系统的准确性。\n\
  \n在初始调整之后，图像尺寸被缩小到更易管理的尺寸，通常每边约为 96 像素。这种缩小对于处理效率至关重要。然而，如果训练模型的结果不尽人意，可能需要考虑更大的尺寸，例如\
  \ `160x160` 或 `320x320` 像素，以提高准确性。\n\n此设置中的最终考虑因素是是否使用彩色图像。虽然彩色图像可以提供额外的细节，但由于它们包含三个颜色通道，它们也增加了计算负载。将图像转换为灰度对于大多数应用程序都是有益的，因为它将特征减少到三分之一，需要的更少的计算能力。除非传送带上计数的物体具有对于区分至关重要的独特颜色特征，否则这种简化将特别有效。在特定颜色属性对于区分产品至关重要，或者多个计数器跟踪不同物体的情景中，保持颜色信息变得必要的。接下来的聚类图显示了数据集中不同样本分组：\n\
  \n![](img/figure_5.8.png)\n\n图 5.8: 聚类图（传送带计数）\n\n## 模型\n\n多个计数设备正部署在整个生产线上，以实现生产线计数系统最高水平的准确性，并最大限度地减少与误将浪费视为漏计相关的问题。这种设置允许对计数进行比较以确保准确性。然而，此过程中的一个重大挑战是确保模型能够足够快地处理帧，以跟上生产线的节奏。\n\
  \n为了有效应对这些挑战，实施了多种策略。让我们详细查看它们：\n\n* 模型使用涵盖各种现实情况、光照情况和产品方向的高质量数据进行训练。\n* 使用量化的\
  \ `8-bit` 版本模型以优化处理速度。\n* 模型通过利用最小可能的帧大小和通道数来使用最少必要的特征，以确保在验证阶段准确性保持高水平。\n* 计数系统模型的基础构建在\
  \ `MobileNetV2` 架构之上，该架构以在移动和嵌入式视觉中的高效有效著称。\n* 此外，系统采用更快更多物体（FOMO）算法来准确为识别的物体生成坐标。\n\
  \n这些策略和技术的结合确保了计数系统能够快速准确地运行，满足了处理帧的速度需求以及计数高准确性的迫切要求。\n\n`图 5.9` 显示了在训练、验证、测试和部署传送带计数模型期间获得的指标。注意样本集的\
  \ `70/10/20` 划分。此外，注意特征数量（27,648）、训练周期数量（60）以及验证和测试阶段 F1 分数（97.5%）与准确率（98.86%）之间的差异。高\
  \ F1 分数准确率可能反映了过拟合，但测试也显示高分表明具有一致性且没有偏差。请注意，只有真实的部署才能显示模型的真实精度。\n\n![](img/figure_5.9.png)\n\
  \n图 5.9: 训练、验证和测试指标（传送带计数）\n\n## 系统实现\n\n生产线计数系统设计为双区块架构，以确保传送带上物体的高效准确计数，最终在下图中所示的显著\
  \ LED 显示器上显示结果：\n\n![](img/figure_5.10.png)\n\n图 5.10: 连接图（传送带计数）\n\n\n\n\n\n该系统的第一个模块专注于视频捕获和处理。它利用了\
  \ `Arduino Nicla Vision`，这是一种强大的设备，能够从输送带上捕捉视频并将这些视频帧处理为特征。这些特征随后用于在同一设备上训练和运行 `卷积神经网络\
  \ (CNN)`，以生成物体计数。除了视频处理能力外，该模块还包含一个处理无线网络通信的次级微控制器。主视频处理单元与次级通信单元之间的通信通过 `通用异步收发器\
  \ (UART)` 实现。处理后，次级单元将计数发布到 `蓝牙低功耗 (BLE) 网网网络`，并将每个计数分配到与其计数器对应的特定通道。这种设置允许构建一个可扩展的系统，多个计数器可以同时向聚合器传输数据。\n\
  \n系统的第二个模块围绕数据聚合和显示展开。它采用了一个配备了次级微控制器（`NRF52840`）的 `Arduino Nano 33 BLE`，用于接收来自生产线各处计数器的计数。通过订阅每个计数器的唯一通道，`Arduino`\
  \ 能够收集并比较来自不同源的计数以建立总数。这个最终确定的计数显示在 4 位 7 段 LED 显示器上，并随着新计数的产生而更新。与显示器的连接通过 `集成电路\
  \ (I2C)` 实现，这是一种串行通信协议，允许多个设备与 `Arduino` 通信。\n\n鉴于系统部署在工厂环境中，那里的电源随处可见，计数系统的两个模块都由连接到电网的\
  \ `5V` 电源供电。这些电源确保系统能够无间断地运行，在实时制造环境中提供可靠且准确的计数结果。\n\n### 源代码\n\n`Table 5.1` 展示了处理输送带上物体跟踪和计数的程序的伪代码。该过程被分为四个阶段：捕获图像、提取其特征、运行分类以及执行跟踪算法。\n\
  \n| `c:tinyml_5_1` || 代码位置：Arduino Nano 33 BLE @ 模块 1 |\n| --- | --- |\n| ![](img/table_5.1.png)\
  \ || 捕获视频帧、分类物体、跟踪和计数。伪代码 1. 摄像头从输送带捕捉视频帧。帧被发送到处理模块。2. 在处理模块中，对图像进行缩放和重塑。生成的特征被发送到模型。3.\
  \ TinyML 模型使用提供的数据运行推理并返回已识别物体的数组。该数组被发送到跟踪算法。4. 跟踪算法检查每个识别出的项目是否足够靠近上一步中识别的物体。如果匹配成功，则新项目将获得与旧项目相同的\
  \ ID。通过这种方式，ID 持续存在并进行跟踪。5. 计数算法检查被跟踪的物体是否跨越了预设的线。如果检查结果为正，则声明一个计数事件。计数的增加被发送到次级\
  \ MCU，以便在网格网络中发布事件。 |\n\n表 5.1：伪代码（输送带计数）\n\n### 网络\n\n此用例中的两个组件通过 `pub/sub 网格网络`\
  \ 进行无线连接。由于该设施处理食品，无线通信是至关重要的。计数组件被封装在一个绝缘透明箱内，并进行实时通信。\n\n| 组件 | 操作 |\n| --- |\
  \ --- |\n| 1 | 发布到 `CH1` |\n| 2 | 订阅 `CH1` |\n\n表 5.2：网络配置\n\n### 功耗分析\n\n计数组件被封装在一个绝缘透明箱内，并进行实时通信。鉴于系统部署在工厂环境中，那里的电源随处可见，计数系统的两个模块都由连接到电网的\
  \ `5V` 电源供电。\n\n| 电源 | 设备 | 潜在功耗 | 注释 |\n| --- | --- | --- | --- |\n| `P1` | `Arduino\
  \ Nicla Vision` | | |\n| `P1` | `NRF52840` | | |\n\n表 5.3：模块 1 的功耗分析\n\n系统的第二个模块围绕数据聚合和显示展开。它采用了一个配备了次级微控制器（`NRF52840`）的\
  \ `Arduino Nano 33 BLE`，用于接收来自生产线各处计数器的计数。\n\n| 电源 | 设备 | 潜在功耗 | 注释 |\n| --- | ---\
  \ | --- | --- |\n| `P2` | `NRF52840` | | |\n| `P2` | `Arduino Nano 33 BLE` | | |\n\
  \n表 5.4：模块 2 的功耗分析\n\n### 物料清单\n\n此物料清单显示了包含两个模块 1 组件和一个段显示器的概念验证近似成本：\n\n| 描述 |\
  \ 数量 | 单价 | 总价 |\n| --- | --- | --- | --- |\n| `Arduino Nicla Vision` | 2 | $85\
  \ | $170 |\n| `Arduino Nano 33 BLE` | 1 | $30 | $30 |\n| `NRF52840 Dongle` | 3 |\
  \ $12 | $36 |\n| 大七段显示器 | 1 | $90 | $90 |\n| 1A @5v 电源 | 2 | $10 | $20 |\n\n表 5.5：物料清单（输送带计数）\n\
  \n材料约为 $346。\n\n### 用例：人数计数\n\n一个非常有用的应用是同时跟踪多个不同的物体。复杂性不仅在于根据轨迹预测物体的下一个位置（如之前的用例所示），还在于确保物体在整个轨迹中保持不变。这是通过使用能够为每个分类物体生成唯一\
  \ ID 的多分类模型实现的，跟踪算法利用该 ID 一致地链接其轨迹。\n\n### 超市的人数计数\n\n问题定义：一家著名的超市连锁面临着影响客户满意度的挑战；结账寄存处的等待时间过长。这一问题被认为是导致向购物者提供的服务质量下降的关键因素。超市管理团队正在探索一种新方法来优化结账流程。\n\
  \n建议的解决方案包括密切监控进入和离开商店的客户流量。通过准确计算进入商店和离开的人数，管理层可以获得客户流量模式的宝贵见解。这些数据对于估计商店商店内的总人数至关重要。\n\
  \n\n\n\n了解店内的大致客流量对于确定所需开启的收银台数量至关重要。目标是让顾客人数与活跃结账通道数之间保持比例关系。通过实现这种平衡，超市旨在显著缩短收银台的等待时间，从而提升顾客的购物体验并提高整体服务质量。实施这套顾客计数系统将使超市能够根据实时流量调整结账运营，从而提供更高效、更满意的服务。\n\
  \n### 解决方案\n该解决方案由一组安装在每个出入口门门框上的摄像头组成。摄像头安装在门框的最高处，指向地板，覆盖几平方米的区域。摄像头使用广角镜头以便在短焦距内覆盖更远的距离。摄像头将视频帧发送到微控制器。`MCU`\
  \ 处理这些视频帧并运行人员分类模型。嵌入式跟踪算法利用其结果来计算通过门口的人数。结果通过无线方式发送到辅助微控制器，再将计数发送到中央微控制器，由该控制器接收超市所有摄像头的计数数据。中央\
  \ `MCU` 的主要工作是分析所有数据并得出超市内的人官方人数。根据这些信息，将显示实时人数，以便楼层经理决定是否开启更多收银台。正如下所示：\n\n![](img/figure_5.11.png)\n\
  \n图 5.11：概念图（人员计数）\n\n### 数据采集\n在获取用于训练人员识别模型的数据时，您应该考虑模型在实际场景中使用时会遇到的特定条件。在摄像头安装在入口门框上的情况下，需要识别的物体（人类）将从俯视视角被观察。使用来自不同视角（例如，全身视图）的图片训练模型可能会产生意料之外的结果。针对这一用例，我们从安装在门框上的摄像头中获取了训练集。此外，模型还应该经过训练以识别穿着不同季节衣物的人。穿简单衬衫的人可能与戴帽子、大衣或围巾的人看起来不同。如果你使用的由于视角原因显示了不同大小人物的镜头，请在训练数据集中提供足够的样本，以教导模型如何识别他们。例如，让摄像头指向街道；视频帧将包含在最近的人行道上行走的人以及从人行道穿过街道的人。\n\
  \n数据采集过程还需要兼顾跟踪算法。对于这一用例，由于摄像头安装在门框的高处，其位置角度可以防止人们互相遮挡。\n\n最重要的是，采集的帧必须与门框本身对齐，因为计数算法将使用一条平行于门框的虚拟线来创建边界，一旦物体（人类）跨越该线将进行计数。\n\
  \n该用例的训练集是在纽约市的一个商业空间获取的。该办公室有一个独特的入口，员工和客户通过它进出。门位于街道平面。为了避免捕捉到路人，摄像头指向空间内部。摄像头与门成约\
  \ 30 度角，覆盖约 2x2 米的区域。我们在一天的不同时间采集了 5 段每段 15 分钟的视频。然后，我们将视频传输到 `Final Cut Pro`，其中对帧进行了剪辑和尺寸调整。结果是五个\
  \ 25FPS 的序列，即 112,500 帧。并不是所有的视频帧对训练都有帮助，因为许多帧没有行人经过。在排除这些帧后，我们保留了显示行人的视频帧子集。我们专注于人员的多样性，而不是同人在不同位置行走。数据集包含\
  \ 600 帧，具有数百种单独行走或结群行走的人员组合。下图展示了这些人员的划分：\n\n![](img/figure_5.12.png)\n\n图 5.12：训练数据集（人员计数）\n\
  \n## 处理\n从帧中提取特征是直接的。首先，处理函数将图像裁剪为正方形格式并将其调整为 90x90 像素。正如上一节所示，这是在准备视频以获取训练数据集时使用\
  \ `Final Cut Pro` 完成的。你不需要使用专门的视频软件来完成这一操作。特征将被输入到我们将训练的卷积神经网络的全连接输入端。为了扩充数据，我们通过翻转（水平和垂直）和镜像处理创建了新样本。该过程将生成\
  \ 8,100 个特征，每个像素一个。\n\n图 5.13 在聚类图中仅显示了一个聚类。将来将模型扩展到特殊类别（如儿童或轮椅）将非常有趣。\n\n![](img/figure_5.13.png)\n\
  \n图 5.13：聚类图（人员计数）\n\n## 模型\n本例中使用的模型基于 `MobileNet V2`，这是一种用于内存和 CPU 最小设备的常用物体识别模型。为了在我们的特定用例中重用\
  \ `MobileNet V2`，我们依赖于一种称为迁移学习的技术，即移除负责识别特定物体的层，并将其替换为能够识别和分类我们用例的层。此外，使用 `FOMO`\
  \ 算法通过质心来指示检测到的物体的位置，这节省了大量内存并使模型运行更快，因为不需要推理物体覆盖的区域，只需要推理其在帧中的位置。\n\n图 5.14 展示了该用例的关键指标。样本集被分为三个部分：70%\
  \ 用于训练，10% 用于验证，20% 用于测试。验证期间 95.6% 的 F1 分数表明模型在验证集上表现良好。然而，测试期间 86.67% 的准确率明显低于验证期间的\
  \ F1 分数，这可能表明模型对新数据的泛化能力不佳。这种差异可能是由于过拟合或数据不平衡造成的。为了缓解这一点，我们可以增加数据集的大小并提高其多样性。\n\n\
  ![](img/figure_5.14.png)\n\n图 5.14：训练、验证和测试指标（人员计数）\n\n## 系统实现\n该解决方案由两个模块实现：第一个模块负责计数，第二个模块负责显示计数。模块之间无线连接并独立供电，如下方的图所示：\n\
  \n![](img/figure_5.15.png)\n\n图 5.15：连接图（人员计数）\n\n有两种类型的模块，如下所示：\n\n\n\n\n*   第一个是数据采集模块（Block），其中包含摄像头、运行人数计数算法的微控制器，以及一个负责将计数增量通信给无线局域网中其他设备的次级微控制器。\n\
  *   第二个模块（Block）包含一个微控制器，负责接收来自超市每个扇门的人数增量，并将其传递给主微控制器，由主控制器计算空间内的总人数。第二个模块通过一个小型\
  \ OLED 显示器向超市经理汇报计数结果。\n\n我们使用了 `Arduino Nicla`，这是一种低功耗且紧凑的设备，以其能够采集高质量视频、运行本地机器学习模型以及执行诸如人数计数的人体跟踪等自定义功能而闻名。\n\
  \n模型获取自 `Edge Impulse`，并在那里进行训练和测试。跟踪和计数算法使用 `MicroPython` 配合 `OpenMV IDE` 编写。一旦发生计数事件，`Arduino\
  \ Nicla` 会将计数增量发送给次级微控制器（`NRF52840 dongle`），并发布到 `BLE Mesh Network` 中。该 `Mesh Network`\
  \ 被配置为具有与安装了人数计数器的门数量相同的通道。设备将计数发布到分配给其对应门的通道上。门计数器并不记录当天的总数；它们只报告过去 10 秒内进入和离开的人数。我们将其称为\
  \ `count increment`（计数增量）。\n\n我们使用 `NRF52840 dongle` 作为第二个模块来获取所有传入的计数。该 dongle\
  \ 订阅了门用于发送计数增量的通道。虽然多个通道并非严格必须（因为所有门都可以顺利地通过同一个通道发送计数），但为每个门设置一个专用通道可以更容易故障故障并识别计数的来源。一旦接收到\
  \ `count increment`，dongle 将其发送给主微控制器（一个 `Arduino BLE 33`）。`Arduino` 在内存的数组中跟踪所有的门计数，并将其存储在通过\
  \ `I2C` 连接的非易失性 `SD card` 中。如果 `Arduino` 必须重置，初始化函数将从 `SD card` 中读取最新计数。用于通信总数的\
  \ `OLED display` 通过 `I2C` 接口连接到 `Arduino`。它每 10 秒刷新一次，显示所有门的总和。\n\n### 源代码\n\n表\
  \ 5.6 中的伪代码显示了数据变换的 5 个阶段。第一个是原始图像采集，第二个是特征提取，第三个是分类运行，第四个包括为识别出的对象分配跟踪，最后一个是检查是否满足了将跟踪事件视为计数的条件。\n\
