  \ 订阅自 | CH1, CH2 |\n\n表 2.7：网络配置（噪声检测）\n\n## 功率分析\n\n由于这是永久性安装，建议所有模块都连接到永久电源；但如果有必要，且假设日光充足并我们提供了大电池，采集模块可以使用太阳能供电。我们需要进行一些调整，例如减少推理频率以及模块发送到中心模块的消息数量。\n\
