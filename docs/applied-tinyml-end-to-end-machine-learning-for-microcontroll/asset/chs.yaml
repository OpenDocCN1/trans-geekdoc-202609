  \ Nano 33 BLE Sense` | `0.032A` | `<1A` | Arduino 将负责温度、回归以及控制加热和冷却单元。 |\n| `P1`\
  \ | `NRF52Dongle` | `0.04mA` | `3mA` |  Dongle 负责发布和接收来自网络的消息。 |\n\n表 7.14：电源分析，`Block\
  \ 1`（温度预测）\n\n类似于 `Block 1`，UI 设备（`Block 2`）需要安装在盒子。虽然可以使用电池供电，但由于需要频繁充电，对恒温器使用电池是不现实的。\n\
