  \ `Setpoint` 命令。2. 将 `Setpoint` 加载到 `volatile memory` 中供 `PID function` 使用以计算控制命令。3.\
  \ 此外，`setpoint` 被保存到永久内存（`SD Card`）中以防断电。 |\n\n表 7.12：`Block 1` 获取设定点的伪代码（温度预测）\n\
  \n### 网络\n假设有 3 个带有独立恒温器的房间。可以合理假设在所有组件之间铺设电缆是不现实的。因此，无线网络是最佳选择。多个组件之间的相互通信使得异步通信变得很有必要。我们使用无线网格网络（wireless\
  \ mesh network），其中多个组件之间进行通信。恒温器在各自的通道上发布状态。UI 设备负责显示指标并获取设定点。\n\n| Block(s) | 操作\
  \ | 通道 |\n| --- | --- | --- |\n| `1a,1b,1c` | 发布 | `CH1,CH2,CH3` |\n| `2` | 订阅 |\
  \ `CH1,CH2,CH3` |\n| `2` | 发布 | `CH4` |\n| `1a,1b,1c` | 订阅 | `CH4` |\n\n表 7.13：网络配置（温度预测）\n\
  \n### 电源分析\n`1a`, `1b` 和 `1c` 的电源来自安装的盒子。这与通常由电池供电的恒温器不同，因为需要运行回归模型并与 UI 设备进行无线通信。\n\
