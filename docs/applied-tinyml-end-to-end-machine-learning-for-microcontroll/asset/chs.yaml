  \ | 2 | $30 | $60 |\n\n表 3.17：物料清单（汽车驾驶风格跟踪器）\n\n材料的估计成本为 $211。\n\n## 结论 (#contents.xhtml#sc2_119a)\n\
  \n运动分类对于检测传统传感器无法检测的事件非常有用。运动分类和独立运行的小型电池供电 ML 模型与那些由于偏远或不断移动而无法负担永久互联网连接的系统非常契合。由于尺寸减小和运动部件减少，实现成本相对较低，使得包含数百个分类器（例如：工人跌倒检测）的解决方案成为可能，它们都可以独立检测事件。低功耗网网络和\
  \ LTE-M 等技术与运动分类实现共享低能低数据的设计原则，实现了更复杂的解决方案。\n\n在下一章中，我们将探索图像分类，这是计算机视觉的一项基础任务，使机器能够识别并分类图像中的物体。读者将学习在节节应用于声音和运动分类的卷积神经网络（CNN）最初是如何为图像识别设计的。\n\
  \n## 参考文献 (#contents.xhtml#sc2_120a)\n\n*   [`www.quora.com/Why-is-the-Nyquist-Shannon-sampling-rate-exactly-2-times-the-maximum-frequency-Where-is-the-proof-for-that-constant-2`](https://www.quora.com/Why-is-the-Nyquist-Shannon-sampling-rate-exactly-2-times-the-maximum-frequency-Where-is-the-proof-for-that-constant-2)\n\
  *   [`github.com/jeandeducla/ML-Time-Series`](https://github.com/jeandeducla/ML-Time-Series)\n\
  *   [`towardsdatascience.com/over-fitting-and-regularization-64d16100f45c`](https://towardsdatascience.com/over-fitting-and-regularization-64d16100f45c)\n\
  *   [https://www.adafruit.com/product/3436] 带放大器的 Music Maker FeatherWing - MP3\
  \ OGG WAV MIDI 合器播放器 - 立体 3W 放大器\n\n\n\n\n训练目标识别模型可能是具有挑战性且耗时的，因为这既需要大型且多样化的数据集来准确地学习和区分特征，还需要强大的计算能力来实现一个稳定且可靠的模型。幸运的是，通过将已训练神经网络的特定层替换为用于分类不同物体的新层，可以复用已经训练好的\
  \ `Neural Networks`。这种过程被称为 `Transfer Learning`（迁移学习），它允许你使用较少的图像集为你的需求训练模型，因为你只需要训练特定层，而不是从头开始训练整个网络。在大多数情况下，你只需要一部智能手机就可以为每个类别拍摄大约\
  \ 100 张图像（一个类别是你想要识别的物体类型）。像 `Edge Impulse` 这样的工具提供了基于网页的客户端，会自动帮助你拍摄照片并将其上传到云端。你也可以使用任何相机收集图像，并将其直接加载到执行处理和训练的任何计算机上。\n\
  \n## 从图像中提取特征\n\n对于任何在计算机上处理过图像的人来说，从图像中提取特征的过程可能很熟悉。第一步是将图像裁剪成正方形（1:1）；这可能看起来是没必要的，因为所有相机返回的都是矩形，但将其调整为正方形形状有助于简化计算，创建输入的一致性，并允许复用预训练模型。第二步是将图像调整为较小的尺寸（例如，`96x96`、`160x160`\
  \ 或 `320x320` 像素）。虽然在图像尺寸缩小过程中会丢失细节和纹理数据，但图像的形状和轮廓应该仍然清晰勾勒。`Neural Networks` 主要通过轮廓学习如何识别物体。正如示例所示，即使在\
  \ `96x96` 的图像中，你仍然可以识别火红雀：\n\n![](img/figure_4.1.png)\n\n图 4.1：同一图像不同尺寸的版本\n\n接下来的（可选）步骤是判断颜色对于用例分类是否必不可。如果是（例如，你想根据颜色对鸟进行分类），你需要将彩色图像发送到神经网络。彩色图像特征的数量等于像素总数乘以通道数。彩色图像有三个通道（红、绿、蓝）。然而，在大多数颜色无关的情况下，你可以通过将图像转换为灰度来减少特征数量。在这种情况下，特征的数量是图像中的像素总数。每个像素用\
  \ `0` 到 `255`（`8bits`）之间的数字表示其亮度。\n\n图像中通道数、维度和特征总数之间的关系如下表所示：\n\n| 图像类型 | 通道 |\
  \ 维度 | 总像素或特征 |\n| :--- | :--- | :--- | :--- |\n| 彩色图像 | `3` | `320x320` | 102400\
  \ |\n| 彩色图像 | `3` | `160x160` | 25600 |\n| 彩色图像 | `3` | `96x96` | 9216 |\n| 灰度图像\
  \ | `1` | `320x320` | 102400 |\n| 灰度图像 | `1` | `160x160` | 25600 |\n| 灰度图像 | `1`\
  \ | `96x96` | 9216 |\n\n表 4.1：通道数、维度与特征总数之间的关系\n\n最后一步是将像素发送到神经网络。这是因为我们已经将所有图像调整为预定的尺寸，以便用于神经网络处理阶段。\n\
  \n## 图像分类\n\n将过滤器应用于 `Feature Map`（特征图）的过程被称为 `convolution`（卷积）。`convolution` 以类似于长乘法的方式让过滤器通过\
  \ `Feature Map` 的所有部分，生成一个新的 `Modified Map`（修改后的映射）。\n\n\n\n到目前，我们可以提取特征、对其进行归一化，并使其非线性化。下一步是对这些特征进行分类。我们将专门的\
  \ `Feature Map`（特征图）连接到一层全连接层来实现这一目标。换句话说，图中的每个特征都被分配了一个输入神经元。每个神经元将以相同的方式连接到下一层，并为这些连接中的每一个分配一个随机权重。通过反向传播算法，我们将所有已标记的样本通过整个流水线（特征提取和分类），以获得一个误差分，该分数告诉我们我们离正确推断物体还有多远。这将提示我们需要修改哪些权重以减少下一次运行的误差。我们对所有训练集重复执行此过程，通常进行几十个训练周期。如果我们看到误差在下降，说明我们走在了正确的道路上；我们将继续运行训练周期，直到误差不再变化。在这一点上，我们达到了稳定版本的模型。我们本应该从训练集中分离出一小部分样本，用于验证模型。由于模型从未见过验证样本，它将为我们提供模型真实准确率的良好参考。\n\
  \n到目前，我们描述了一个用于图像分类的经典卷积神经网络。然而，这些模型的大小通常为几兆字节，且训练成本昂贵。它们无法放入像微控制器这样高度受限的系统中。此外，为每个用例创建一个模型并投入大量资源是毫无意义的。有许多不同的技术可以降低模型的训练成本、大小和处理需求。第一种被称为\
  \ `Transfer Learning`（迁移学习）。正如你所学到的，基础滤波器提取线条和曲线等特征，而更高级的滤波器提取形状、物体和特定类别。这里的技巧是重用识别基本几何特征和形状的层，并仅专注于在最后的专门化层上训练模型。由于我们只训练最后几层，我们可以为每个类别使用较小的训练集（约\
  \ 100 张图像），而不是数百万图像。减少模型大小和内存需求的技术被称为 `depth wise-separable convolution`（深度可分离卷积）。`DSC`\
  \ 通过将操作拆分为两个更简单的卷积来降低卷积的复杂度。一种被称为 `depthwise convolution`（深度卷积），另一种被称为 `pointwise\
  \ convolution`（逐点卷积）。前者通过对每个输入通道应用单个过滤器来执行轻量级过滤。后者负责通过在每个输入通道上运行 `1x1 convolutions`\
  \ 来计算线性组合来构建新特征。结果与普通卷积返回的特征数量相同，但使用 `DSC` 执行速度快九倍（它仅使用传统卷积层约 11% 的计算能力）。提出这种架构的模型是由\
  \ Google 创建的 `MobileNetV1`。这非常重要，因为它让图像分类对于微控制器应用变得触手可及。\n\n最终，`MobileNetV2` 发布并带有进一步的优化，即\
  \ `inverted residuals`（反转残差）和 `linear bottlenecks`（线性瓶颈）。它们共同工作以优化内存效率，而内存在微控制器中也是极其有限的。\n\
  \n## 用例：手势检测\n\n手势识别是通过计算机视觉识别动态或静态身体动作（特别是手势或动作）的过程。系统解释肢体语言或手部的含义，使其能够理解传达意图或信息的手势。这项技术通常用于需要交互或语义理解的应用程序，例如解释手语、识别命令或检测如挥手之类的动作。\n\
  \n### 使用手势解锁门\n\n**问题定义：** 一位锁具制造商正在设计一种新型非接触式产品，该产品在用户向摄像头展示一系列手势时解锁门。如果序列正确，锁会将锁舌移动到允许用户开门的位置。摄像头和门锁不能直接接线，因为门需要在门框上自由运行。因此，摄像头和锁之间需要一个无线连接。\n\
  \n**解决方案：** 嵌入墙墙中的摄像头将捕捉站在门前的人的连续图像流。连接到同一设备中摄像头输入的模型将处理这些图像。\n\n\n\n\n所有样本显示的都是左手；然而，通过使用数据增强，图片被翻转并显示为右手。数据增强通过展示同一类别的多种变体，帮助模型具有更好的泛化能力。\n\
  \n## 处理\n\n来自摄像头的图像被裁剪为正方形比例，并缩小至 `48x48` 像素。在验证过程中，我们发现如果使用图像的彩色版本，模型显示出更高的准确率。这提供了共\
  \ `48x48x3 = 6,912` 个特征，并将它们发送到模型的输入层。注意 `Figure 4.6` 中，不同手势的簇是被清晰地定义的。然而，食指和另外两个手势非常接近。这是因为这两个手势的形状与食指相同，只是多了一个手指。在图表的顶部，你可以看到小拇指和“牛角”手势之间存在相同的情况，它们的形状相似。`ok`\
  \ 和 `fist`（拳）手势定义清晰，并与其他任何类别隔离开，因为它们具有非常特定且特征性。\n\n![](img/figure_4.6.png)\n图 4.6\
  \ 聚类图（手势检测）\n\n## 模型\n\n该模型使用 420 张图像进行训练，达到了 `90.2%` 的准确率。模型的第一版本使用了一半的图像进行训练，但仅实现了\
  \ `60%` 的准确率。这表明了在训练集中拥有足够的高质量数据的重要性。另一个极大影响准确率的因素是 `Learning Rate`（学习率）。在第一个版本中，我们使用了\
  \ `0.05`，但它从未收敛。相反，即使我们将训练周期增加到 `120` 次，误差验证误差仍然在 `0.3` 到 `0.08` 之间波动。我们花费了最多 `8`\
  \ 次迭代来调整超参数，以便在验证中实现超过 `90%` 的准确率。在 `Arduino Nicla Vision (Cortex M7 480MHZ)` 中的推理时间为\
  \ `22ms`。这允许每秒处理约 `45` 帧。后处理阶段将根据每帧中高于 `0.8` 分数的结果创建一个计数，如果某个类别在每一秒内出现在超过 `90%`\
  \ 的帧中，则声明一次识别，如下图所示：\n\n![](img/figure_4.7.png)\n图 4.7：训练、验证、测试和生产模型指标（手势检测）\n\n\
  ## 系统实现\n\n如图所示，应用程序由两个构建块组成：\n\n![](img/figure_4.8.png)\n图 4.8：连接图（手势检测）\n\n* \
  \  第一个是采集块，包含两个微控制器板。第一个是 `Arduino Nicla Vision`，带有 `Cortex M7 480MHZ` MCU，负责图像捕获并运行\
  \ `TinyML` 模型。如果手势被正向识别，它将其存储在 `buffer` 中，用于跟踪事件的顺序。它预先程序化了一个较小的授权序列数组。程序持续监控事件\
  \ `buffer` 是否包含授权序列之一。如果是的话，`Arduino Nicla Vision` 将向第二个微控制器板发送一个带有 `Open-Door`（开门）命令的消息，该板是负责网络的\
  \ `NRF52840 Dongle`。`Dongle` 通过发布到门命令的专用通道，以 `Mesh Network`（网状网络）消息的形式发送命令。\n\n\
  *   第二个块订阅了门命令专用通道，通过其 `NRF52840Dongle` 接收来自块 1 的消息，并将其发送到 `Arduino Nano 33` 进行进一步处理。`Arduino\
  \ Nano` 如何处理 `Open Door` 命令。它在连接到 `NPN` 三极管基极的引脚上输出 `1`。三极管的作用像一个门，允许电流通过。\n\n\n\
  \n\n\n### 问题定义\n纽约的一家酒店前台帮助客客办理入住、预订机场接送、购买剧院门票以及推荐行程等。为了改进服务，他们需要一种能够立即检测到任何站在前台前的人的方法。这将帮助员工中断在大堂周围正在进行的任何工作，并立即接待客人。这将确保提供最佳的服务。作为解决方案的一部分，客户建议可以使用触感感手环对员工进行静音呼叫。\n\
  \n### 解决方案\n作为解决方案的一部分，将放置一个摄像头，其位置可以捕捉靠近前台的人，而不会检测到背景中经过的人。摄像头将它捕获的每一帧发送到一个处理块（Block），以判断图像中是否存在脸。如果检测到脸，将向\
  \ `Haptic pins` 发送消息。\n\n下图显示了最相关的组件和信息流：脸、摄像头、无线通信和触感针执行器：\n\n![](img/figure_4.9.png)\n\
  \n图 4.9：概念图（人员检测器）\n\n`haptic pins` 是电池供电设备，前台工作人员将其装入口袋或别在夹克上。这类似于基于声音的报警器，不同之处它是静音的，只有佩戴别针的人员才能感知。`haptic\
  \ pin` 有一个微控制器，能够订阅 `Mesh Network` 消息，以及一个小电池，为微控制器控制的触感电机供电。针的电池应至少持续 8 小时。\n\n\
  ### 数据采集\n对于此用例，我们使用了名为 `The Images of Groups Dataset` 的现有数据集，由 A. Gallagher, T.\
  \ Chen 为 2009 年 IEEE 计算机视觉与模式识别会议创建。我们使用 `Edge Impulse Labeling queue` 手动标记了脸部。\n\
  \n使用单个标签训练模型被称为 `Unary Classification`（元分类）或 `Class-Modeling`，这非常常见。目标是通过从仅包含该类对象的数据集中学习，从其他中识别出特定类的对象。这比训练多分类模型更困难，因为不同类别之间没有比较点。使用了\
  \ 400 张脸部图像来训练模型。参考下图：\n\n![](img/figure_4.10.png)\n\n图 4.10：训练数据集（人员检测器）\n\n##\
  \ 处理\n作为处理过程的一部分，我们将图像裁剪为正方形比例，并将其缩调整为 `96x96` 像素。虽然我们最初将脸部图像转换为灰度模式，但我们发现保持彩色（`RGB`）可以提高模型的准确性。不同的肤色可能有助于模型从背景中区分脸。每张图像的特征数量为\
  \ `96x96x3 = 27,648`。注意图中的代表单个类的样本如何一起显示在一个簇（cluster）中。模型将在簇周围创建一个限制，并将其内部的所有内容归类为脸。这与异常检测的工作原理非常相似。你将在后续章节中看到更多相关内容。\n\
  \n图中 `Unary Classification` 的聚类图仍然是验证所有样本都相互相互接近并形成一个簇的有用方法：\n\n![](img/figure_4.11.png)\n\
  \n图 4.11：聚类图（人员检测器）\n\n## 模型\n使用的模型是 `MobileNetV2`。输入层在它的输入层中接收 `27,648` 个特征。该模型以\
  \ `90` 个轮次（epochs）进行训练，学习率为 `0.001`，批次大小（batch size）为 `32`。训练此模型的原始数据集包含带有多个脸的样本。模型衡量成功的方法是比较找到的脸的数量与样本中标记的脸的数量。例如，如果模型找到了\
  \ `6` 张脸中的 `3` 张，则认为该特定样本的准确率为 `50%`。然而，因为项目的目标是检测前台前的人，而不是检测脸的数量……（注：此处原文后半部分存在重复和逻辑乱码，已按要求翻译原文内容）。\n\
