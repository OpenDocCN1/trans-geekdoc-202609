    +   B. Blockchain


    The equity of blockchain in the CLOUDITY system is to improve the security of
    data by checking every change data of the SCM from the decentralized database.
    The full blockchain mechanism defined as follows:


    +   1) Set up Ethereum Node


    Ethereum is a network. The way to create Ethereum is set up Ethereum node. One
    of the many applications which can be used to create node is Geth.


    +   2) Create Smart Contract


    Contracts are floating databases that can be used by all the participants at a
    particular address. The address is the contact point to the actual database. Smart
    contracts are written in a language called Solidity, which is compiled through
    an online compiler is RemixDE.


    +   3) Create Distributed Application


    Distributed Application (DAPP) is the application used to upload data from to
    a Smart contract. DAPP is built to store data on the blockchain network.

    The advantages of these methods are: (1) making a flexible system, (2) increasing
    the data collection, (3) increasing transparency in user, (4) decentralized data,
    and protecting product histories from the early today.


    F. 2. SELAT (Service Level Architecture)


    +   b) Service Integration (SI)


    SI integration provides services by the CSPs.


    +   c) Service Provisioning (SP)


    Resources can be of two types. It is proactive or reactive. The user wants, the
    balancer will be the one who manages the migration and registration. The SCM uses
    resources from many CSPs based on the requirements.


    +   d) Event Management (EM)


    EM consists of two modules: (1) Monitoring, a module that regularly verifies QoS
    and SLAs as that and (2) Alarm, a module that notifies the user when the resource
    limit has hit, then the user can take the next step.


    +   e) Security


    Security is used to record all activities that have logged. It authentication
    methods allows limit user access rights. It is regularly checking data in a decentralized
    database.


    +   f) Management Operation Console (MO)


    MO is an interface of use. Users can operate feature in feature using SELAT.


    +   g) Authentication Service (AS)


    AS is used to authenticate the user who will access the accounts and services
    in SELAT. Thus, only registered users can access the services.


    +   h) Service Audit (SA)


    SA is linked to the user''s account.


    +   i) Access Control (AC)


    AC controls the rights of the user to access (access over resources).


    +   j) Cloud Provider Services (CSP)


    +   a) Asset Discovery


    SELAT provider contacts CSPs to receive new assets information by checking. SELAT
    is allowed to receive information by checking the asset discovery of CSP.


    +   b) Reusable Assets


    Reusable assets are CSP''s main assets. SELAT architecture saves the reusable
    assets in the database, so SELAT does not check the data periodically.


