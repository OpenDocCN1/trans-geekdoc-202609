    **Keywords —** Cloudity, Cloud as a Service, Smart Contracts, Supply Chain Management


    # 1. INTRODUCTION


    Setting up to use Excel to manage data of the current level in supply chain systems
    [1]. This conventional supply chain management system is insecure, ineffective,
    and susceptible to human errors. It ought to require an automated system that
    needs less human intervention. Currently, a higher mechanism is needed to manipulate
    the data chain emerges through the usage of an internet server or a digital server
    hosted [1]


    Setting up and hosting locations at local cloud servers are not the best. It is
    because there are many technical aspects to consider, such as scaling, load balancing,
    and flexibility. Therefore, cloud provides a solution. The cloud providers offer
    to serve users with cheaper services. However, this means users might have to
    pay for services that they do not need [2]. Problem is resource generation. Fragmentation
    is a problem of sharing data between providers [3]. Also, vendor lock-in is a
    big problem on supply chain providers side [4]. It is a condition where users
    are stuck with one vendor because the very high cost to another vendor.


    The proposed supply chain management (SCM) system receives and saves data in a
    centralized database. A centralized database is a database which is saving data
    at a single


    In this paper, we present a cloud-based supply chain management system using CLOUDITY
    and SELAT to solve the mentioned problems. The SELAT system acts as a broker between
    users and CSP. It will select the most suitable CSPs with lowest price and highest
    capacity. CLOUDITY uses the concept of Blockchain to improve the data security
    by checking data in a decentralized system [1]. It uses a peer-to-peer network
    to ensure data integrity and security [8]. We design a CLOUDITY system which can
    solve several cases: resource provisioning, service selection, authentication,
    and access.


    The rest of this paper is organized as follows: Section 2 explains the detailed
    method of proposed system. Section 4 describes the design of this proposed system.
    Section 6 summarizes this paper and work.


    # 2. RELATED WORKS


    Cloud service management is a main agent of cloud architectures. It can be extended
    to act as a service broker between cloud consumers and service providers (CSP).
    A lot of research conducted to creates third-party cloud architecture for the
    most suitable cloud services based on user requirements [10]. However, these works
    did not consider a platform composed of multiple CSPs with different service capabilities.
