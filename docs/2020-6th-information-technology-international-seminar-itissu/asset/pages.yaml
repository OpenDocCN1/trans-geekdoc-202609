    30 data with 40 data with blockchain is 12. This proves that blockchain requires
    a longer processing time.


    # VI. CONCLUSION AND FUTURE WORK


    The PROPOSED cloudy system introduced a cloud-based supply chain mechanism which
    utilizes the SELAT architecture in blockchain to make companies to exchange information
    securely. The SELAT architecture functions as a connector between servers and
    CSPS. The blockchain system shows that data can be securely stored and retrieved.
    It shows the proposed system can improve the security of data modification by
    getting data in the blockchain system. However, the blockchain system could improve
    its security of operation. It increases performance. In future, we believe that
    applying a blockchain in another web application would improve its security. However,
    it could decrease the performance in stored data from the server'
