  md: '# III. METHODOLOGY


    The proposed CLOUD system contains main parts: (1) the S system, (2) the SELAT
    system, (3) the Blockchain system, and (4) various CSPs. First, the main company
    builds a system which can be deployed together with other retailers in the supply
    chain. The SELAT system can select the most suitable CSPs with the lowest price
    and highest capability requirements.


    ![](img/f3828bbe916f4d9adeaf9c243ad9fbec_1_0.png)


    In the process, SELAT CSP recommendation lists items to the users. The users must
    select the most suitable CSP from the recommendation, then the SELAT system gives
    a request to the selected CSP and the system manages the initial servers. Mentioned
    Blockchain also applies to create the connection, which the SELAT system uses
    a protocol to communicate with the Blockchain system. The global CLOUD system
    architecture is illustrated in Fig. 1.


    develops a system architecture for recommendation cloud services based on user
    requirements JAGGO. It connects several connected blocks between cloud resources
    and users. We assume JAGGO to develop own architecture called (SELAT Market) for
    managing supply chain actors with various CSPs which provides SELAT system Supply
    Chain management requirements.


    The blockchain system is a peer-to-peer network which connects several blocks
    each other through the Internet. Blockchain permits for booking, receiving, and
    validating records in the database. [12]. However no record can be changed once
    published. Each block is linked to each other without any difference in code.
    The above-mentioned mechanism causes the blockchain system is immutable to the
    modification of data [13]. However, the blockchain chain must be centralized [14].
    However, the supply chain management (SCM) system has a different database from
    other i.e. components which makes it difficult to access each other. Presently,
    many data stored in the database becomes more accessible. It is because: (1) Volume:
    there is a huge data volume in order to process and save; (2) Veracity: Veracity
    are the requirements for the data used in decision making. Many data stored in
    financial analytics means that the data flows more quickly; etc [14]. A cloud
    approach can make data accessible, using the Blockchain to improve data security
    in the cloud [15].


    # A. Selective Market (SELAT) system


    One research [8] provides architecture for offering cloud services as a service.
    We modify JAGGO to create a new architecture called Selective Market (system).
    It functions to select CSPs with the lowest price and highest capability based
    on user requirements. The difference between SELAT and JAGGO is system. SELAT
    equips with the Blockchain system for its selection mechanism. SELAT provides
    a list of CSP recommendations to users to fulfill the user''s request. Fig. 2
    illustrates the architecture of the SELAT system.


    Users act as users to connect with cloud providers. First, users make a request
    for cloud services. The users send a request which contains specifications, budget
    for cloud service system. SELAT gives several CSP recommendations which fulfills
    the user''s request. The last, user selects one CSP in the recommendation list.
    Upon the selection, the user selects CSP. The SELAT system is divided into three
    main parts, which are illustrated as follows:


    +   1) Cloud Controller


    The SELAT services are for supply chain management (SCM). Initially, SCM system
    sends request to the most suitable cloud service provider to the host


    +   2) SELAT Cloud Controller


    +   a) Service Catalog (SC)

    SCM system works as follows: (1) In order to get aspects from CSPs, SCM gives
    a request to Ads; (2) Ads receive some aspects from CSPs; and (3) SC displays
    the aspects information informed about the assignment details.


    Communication between JAGGO and SELAT needs a data management model. A research
    was conducted by [16] introduces a prototype modeling functions as a cloud service,
    sensing the user''s vital value using sensors for microcontrollers. Meanwhile,
    the microcontrollers send the data to fetch devices alternately. Using this model,
    we can collect SCM system logs and send them to the SELAT system. In the future,
    we can apply several containers to improve CLOUD system. Container engines worked
    because of portability and efficiency. The container can be portable because it
    visualizes the operating system instead of hardware [17].'
