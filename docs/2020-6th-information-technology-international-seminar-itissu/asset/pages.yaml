    **Abstract —** Supply chain management (SCM) is a main requirement for manufacturers
    and companies to operate. There are many techniques to manage supply chains, such
    as using Excel. However, that technique is ineffective, insecure, and susceptible
    to human errors. In this paper, we propose SELAT (Relative Market) and Blockchain
    system. We modify JUGO to develop SELAT as a connector between users and cloud
    providers security. CLOUDITY can solve several cases: resource provisioning, service
    selection, authentication, and access. Also, it improves the data security by
    checking every changes of the supply chain management system using CLOUDITY.


