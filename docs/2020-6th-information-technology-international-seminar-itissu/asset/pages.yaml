    # V. EXPERIMENTAL RESULT


    In this section we achieved several results from a different condition. The result
    of an experimental display shown in Fig. 4. Result was grouped into two groups.


    # A. Different Data Server


    Table I shows the details of the experiments carried out on the condition of number
    of different servers. Using different servers to get the results that displayed
    has the same as that on each server. If data modification occurs on not used,
    then the value on server is not used. However, using an unequal amount of data
    will result in different error conditions on the first server even then the first
    server may have a modification. It was modified because the blockchain was checked
    by one on every server before delivering. Thus, blockchain could not handle it.


    # B. Same Data Server


    Table II shows the experiments'' details under the same number of servers that
    have modification and do not have same time. Using the same number of servers
    that have modification and not have modification data is not successful. It happened
    because the blockchain was checked by one by one on every server before delivering.
    On the performance, the load time from the server becoming longer. It happened
    because the system needs to be checking on every connected server before deploying
    the data to the blockchain to improve its security.


