  md: '# Phony News Detection using Machine Learning and Deep-Learning Techniques


    # V. EXPERIMENTS AND RESULTS


    Google Collaboratory, which is an open-source notebook with a Tesla K80 GPU backend,
    is used for training various machine learning and deep learning models.


    For experiments, both LSTM and BI-LSTM classifiers used the Sigmoid activation
    function, Adam optimizer,0.3 dropout value. We applied glove embedding with 300
    dimension and pre-embedding to make sentence length. We have chosen 40 embedding
    vector features. Binary cross-entropy loss is used in the experiment settings.
    We trying different combinations to get results.


    LSTM achieved maximum accuracy of 63% while in the machine classifier, the Multinave-Bayes
    classifier achieved 60%.


    Table 1 represents the comparison of our proposed method with the state of the
    art.


    # TABLE 1: COMPARISON OF METHODS


    | Method | SVM | CNN | LSTM |

    |---|---|---||}{

    | [17] | 0.56 | 0.58 | 0.54 |

    | [11] Proposed method | 0.57 | 0.60 | 0.63 |


    ![](img/a91a3aadf9ebfcab11621bf60a064f4a_4_0.png)


    Fig. 6: Results of Deep-learning Classifier

    Fig. 6 represents the performance of the deep-learning classifier.


    # VI. CONCLUSION AND FUTURE


    In this paper, we have applied machine learning and deep-learning approaches on
    the LIAR dataset. To perform better than the state of the art methods, we applied
    POS tagging and Glove embedding in the deep learning model. We achieved the highest
    of 63% accuracy by using the LSTM model. In future, we can apply transforms by
    six-layers to enhance the performance of the model. There is a scope to add other
    user profile features to also increase accuracy.


