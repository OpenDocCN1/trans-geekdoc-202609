    # K. CNN


    CNN is a derivative of a feedforward neural network. This can be applied to face
    recognition and image classification. CNN worked well for sentiment analysis research.
    A convolutional neural network is applied to extract important features from the
    text or images by a series of the convolutional layer.


    # IV. PROPOSED FRAMEWORK


    For preposing, we use the NLTK library to manage stop words and to stemming. We
    applied snowball stemmer to convert the word of a sentence into its root form.
    We also remove punctuation, symbols, and keep only alphabets. Dataset is converted
    to lower case for processing. We remove the duplicate names using the duplicate()
    function removes rows from the data and to root name, null() function is used
    in the implementation. The proposed dataset is divided into 80:20 training and
    testing ratios based on the experimental results.


    We merged the training and validation dataset for experiments, and the testing
    dataset is used for computing accuracy.


    Fig. 3 represents our proposed framework. In this work, the NLTK POS tagger is
    applied to assign a tag to each word of the content of the statement. After pos
    tagging, each word is assigned with one tag. Then we apply word embedding. The
    word of remaining POS tags that do not appear in POS tags of the news content
    are made zero vector.


    300-dimensional Global embedding for our work. The embeddings are sorted in alphabetical
    order before passing to the LSTM, bi-directional LSTM, and CNN.


