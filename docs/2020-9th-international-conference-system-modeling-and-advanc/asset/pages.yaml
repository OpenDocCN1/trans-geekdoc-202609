  md: '# C. Naive Bayes Algorithm


    It is a probabilistic classifier based on the assumption of feature independence.
    It applied the Bayes theorem. In the paper [13] also adopted a machine learning
    approach for covert detection. They applied the Bayes classifier, which considers
    each statement of news as an independent feature.


    We apply the Bayes theorem in the following


    ```

    P(c|x) = \frac{P(x|c)P(c)}{P(x)}$

    ```


    Where c is a class and x is a descriptor vector.


    P(c|x) is a posteriori probability of event x, P(c) is the prior of c.


    # D. Linear SVM Classifier


    Support vector classifier uses lines or hyperplane to divide the data into classes
    to solve the classification or regression problem. It is described mathematically
    as


    ```

    $y = f(x) = \sum(w_ix_i)$

    ```


    Here, x is coordinates, and w is what determines the slope of a straight line.


    # E. Logistic Regression


    We applied Logistic Regression for next events. It is a classification algorithm.
    Logistic regression is used when the dependent variable categorical.


    ```

    $P = \frac{1}{1+e^{-(w^Tx+b)}}$

    ```


    Here, P is the probability of i, and e is the base of the natural logarithm, b,
    and m are model parameters.


    By using ratio


    ```

    $\frac{P}{1-P} = \exp(w^Tx+b)$

    ```


    (P) value always lies in 0 to 1, in the case of odd, odd can take the range from
    0 to infinity. Odd is defined as the ratio of an event that will occur to the
    probability of an event that will not occur.


    # F. Random Forest


    Random forest is a supervised algorithm that uses ensemble learning to create
    a forest. This algorithm could be applied in classification, regression, and others.
    This algorithm works well on large datasets.


    ```

    $ft_i = \frac{1}{n} \sum_{j=1}^{n} f_{ij}$

    ```


    ```

    $norm_i = \frac{1}{n} \sum_{j=1}^{n} f_{ij}$

    ```


    ```

    $RFT_i = \sqrt{\sum (ft_i - norm_i)^2}$

    ```


    # G. Decision Tree Classifier


    A decision tree can be used to perform the task of classification or regression.
    It works well for both


    Phony News Detection using Machine Learning and Deep-Learning Techniques


    categorical and numerical data. In our experiments, we used Gini impurity resulted
    in 94% accuracy.


    Gini is used to compute the probability of inaccurate classification of an observation.
    Gini can be represented by a mathematical notation as follows


    ```

    $G(z) = P(i) \log P(i) + (1-P(i)) \log(1-P(i))$

    ```


    Where P(i) represents the probability of classification as the training data.


    # H. Deep Learning Model


    The Deep learning is used to automatically extract significant features for extraction.
    In the paper [14] adopted deep learning techniques for stance detection. They
    have adopted the RNN model for features. Bi-LSTM achieved the best results. In
    the future, sentiment analysis can lead to enhance performance. In the paper [15]
    also applied deep learning techniques to differentiate between synthetic and semantic
    relationship between words. They concluded that the deep-learning model performed
    well on large datasets. A new model was proposed by authors in paper [16] CNN
    for fake news detection. They used explicit and latent features, and in the future,
    more features can be adopted to enhance the performance of the model.Authors [18]
    used CNN and LSTM to compute the reliability of news. Visual features with embedded
    text and headings are used for experiments.


    # I. LSTM


    It is a type of neural network which is used when the context becomes reliable
    to predict the future outcome. RNN used output as a next layer having several
    layers. Here, Output depends on context such as under any story, and there is
    a need to know about events, etc. There are several domains RNN plays a significant
    role like next word prediction, video captioning, stock market prediction, Time-series
    prediction, sentiment analysis, and classification can process a sequence of data
    that has memory.


    In the case of RNN, during backpropagation, the gradient vanishes or explodes.
    In the case of exploding gradients, weight can be reduced, but using gradient,
    there is no way to update the weights and biases. To overcome these limitations,
    LSTM is used. LSTM does not read all input. LSTM uses the context of selective
    reader, selective and selective forget. GRU is a special class of LSTM that has
    no forget.


    Fig. 2 represents the LSTM architecture using GRU. Here x is the input layer,
    and y is the output layer.'
