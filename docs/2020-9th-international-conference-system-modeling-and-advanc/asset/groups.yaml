    # # Phony News Detection using Machine Learning and Deep-Learning Techniques


    Sonal Garg¹ and Dilip Kumar Sharma²¹GL University Mathura, India

    E-mail: sonal.garg@gl.ac.in, dilip.sharma@gl.ac.in.


    **Abstract—** The proliferation of misleading news stories on social media has
    brought a big challenge due to its potential to create an adverse impact on human-being.
    Existing lexical-variant features are unable to detect counterfeit news. Most
    of the state use small datasets containing a limited number of training data.
    In this paper, we evaluate machine learning and deep learning techniques. LIAR
    is a predominant dataset of 12836 short notes from different sources, including
    social media. The proposed framework shows significant improvement in terms of
    accuracy in comparison to the existing state of the art algorithm.


    **Keywords—** Fake news, Machine-learning, Natural language processing, LSTM.


    # ## I. INTRODUCTION


    Today is a era. There are a massive amount of data generated every day on social
    media. So, there is a possibility that generated content may be misinformation
    or a rumor. It can be intentionally or unintentionally. To detect the fake news
    in real-life is a very challenging task. In general, we can define fake news as
    "an article that is intentionally and verifiably false[19]. There are various
    forms of fake news like misinformation, hoaxes, satires, and biased news. People
    share the news based on their beliefs on the digital platform. It is difficult
    to detect fake news because it is written with the motive of deceiving people.


    There is the varied definition of Fake news. Authors in paper [8] define fake
    news as "an article that is intentionally and verifiably false. Of several types
    fake news like satire, clickbait, biased content, fabricated news, propaganda,
    and hoaxes, and more. Fake news can be identified as of different kinds like fake
    news, false video, faked images, etc. Moreover, these false stories need to be
    handled. This problem residing in the deep web and acts as a volcano which needs
    to be tended. This is not easy as it would need a lot amount of research and development.
    By the end of 2020, more than 2180 Iranians consumed methanol to prevent this


    coma caused by consuming alcohol. As a result, 900 were admitted to the Intensive
    Care Unit (I.C.U.), and 296 died [9]. The enormous amount of data that exists
    on the internet may work as a refuge for such fake news from its detection and
    being quarantined.


    In this work, the proposed model extracted features using Bag of words and tf-idf
    from LIAR dataset. We use news content as the main feature, but we also consider
    profile information for state and affinity affiliation. We proposed a label for
    importance: True, Monthly and half-true to False, barely-true, to make false dataset.
    We also add POS and Globe embedding to ensure the existing results use our various
    classes, including Deep Learning (DL) models: LSTM, CNN and Naive Bayes, Machine
    learning models. We improve the accuracy by 3% by using the LIAR[10] dataset.


    # ## II. Motivation


    There are much work to do in this area:


    +   - Knowingly and Unknowing the truth of information, people on social-media
    share it.

    - No specific definition is available for fake or real news. So, no one can understand
    understand the reality of the text.

    - Challenging task of research with techniques like method and deep learning technique,
    there are some gaps.

    - It is difficult to develop an automatic fake detection system to be able to
    differentiate between real news and fake news.


    This paper is divided into several sections, Section 2 is a Literature review,
    Section 3 is deals with the proposed framework, Section 4 is connected with Experiments
    and Results, and Section 5 represents a Conclusion and also possible future.


