    # VI. 结论与展望


    在本文中，我们在 LIAR 数据集上应用了机器学习和深度学习方法。为了优于先进方法，我们在深度学习模型中应用了 POS 标记和 Glove 嵌入。使用 LSTM
    模型实现了 63% 的最高准确率。未来，我们可以应用六层变换来增强模型性能。还有添加其他用户特征以提高准确率的空间。


