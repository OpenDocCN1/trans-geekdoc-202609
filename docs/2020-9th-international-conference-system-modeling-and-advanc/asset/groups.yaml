    # 基于机器学习和深度学习技术的虚假新闻检测


    Sonal Garg¹ 和 Dilip Kumar Sharma²¹GL University, Mathura, 印度

    电子邮箱: sonal.garg@gl.ac.in, dilip.sharma@gl.ac.in.


    **摘要—** 社交媒体上误导性新闻报道的泛滥对人类可能产生负面影响，这带来了巨大的挑战。现有的词汇变体特征无法检测伪造新闻。大多数研究使用包含有限训练数据的小型数据集。在本文中，我们评估了机器学习和深度学习技术。LIAR
    是一个主要的数据集，包含来自不同来源（包括社交媒体）的 12836 条短笔记。与现有的先进算法相比，提出的框架在准确率方面有了显著提高。


    **关键词—** 虚假新闻、机器学习、自然语言处理、LSTM。


    ## I. 引言


    如今是一个数据时代。社交媒体每天产生海量数据。因此，生成的内容可能是虚假信息或谣言。这可能是故意的也可能是无意的。在现实生活中检测虚假新闻是一项极具挑战性的任务。通常，我们可以将虚假新闻定义为“一种故意且可证实的虚假文章[19]”。虚假新闻有多种形式，如误导信息、骗局、讽刺和偏见新闻。人们在数字平台上根据自己的信仰分享新闻。检测虚假新闻很困难，因为它们的编写初衷是为了欺骗人们。


    虚假新闻有多种定义。文献[8]的作者将虚假新闻定义为“一种故意且可证实的虚假文章”。虚假新闻有多种类型，如讽刺、点击诱、偏见内容、虚构新闻、宣传和骗局等。虚假新闻可以被分为不同的种类，如虚假新闻、虚假视频、伪造图像等。此外，这些虚假故事需要被处理。这个问题存在深网上，像一个需要维护的火山。这并不容易，因为需要大量的研发。2020年底，有超过2180伊朗人饮用甲醇，结果导致900人进入重症监护室（ICU），296人死亡[9]。互联网上存在的巨大数据可能成为此类虚假新闻逃避检测和隔离的避风港。


    在这工作中，提出的模型使用词袋模型（Bag of words）和tf-idf从LIAR数据集中提取特征。我们使用新闻内容作为主要特征，但也考虑了用于状态和亲和关系的个人信息。我们提出了一个重要性标签：从“真实的”、“月度的”、“半真的”到“虚假的”、“几乎真实的”，以构建虚假数据集。我们还添加了POS和全局嵌入（Globe
    embedding），以确保现有结果使用我们的各种类别，包括深度学习（DL）模型：LSTM、CNN和朴素贝叶斯，以及机器学习模型。通过使用LIAR[10]数据集，我们将准确率提高了3%。


    ## II. 动机


    该领域仍有许多工作要做：


    - 人们在社交媒体上分享信息时，无论是知情还是不知情的虚真假。

    - 对于虚假新闻或真实新闻没有特定的定义。因此，没有人能理解文本的真相。

    - 使用方法和深度学习技术等手段进行研究具有挑战性，目前存在一些空白。

    - 开发一个自动的虚假检测系统来区分真实新闻和虚假新闻是困难的。


    本文分为几个部分：第2节是文献综述，第3节介绍所提出的框架，第4节涉及实验与结果，第5节代表结论以及未来的展望。


    ## III. 文献综述


    许多研究人员正在利用多标签数据集解决虚假新闻检测的挑战。过去的研究表明，制作一个虚假新闻分类器并不容易。


    文献[1]的作者提出了一种虚假新闻多标签分类的方法。他们通过人工提取特征来消除无关特征。可靠性也被用于分配具有相似属性的多个类别标签。多分类问题被简化为二分类问题。我们使用了LIAR数据集。


    多种类型的虚假新闻，如讽刺、点击诱、偏见内容、虚构新闻、宣传和骗局等。虚假新闻可以被分为不同的种类，如虚假新闻、虚假视频、伪造图像等。此外，这些虚假故事需要被处理。这个问题存在深网上，像一个需要维护的火山。这并不容易，因为需要大量的研发。2020年底，有超过2180伊朗人饮用甲醇以防止饮酒导致的昏迷。结果900人进入重症监护室（ICU），296人死亡[9]。互联网上存在的巨大数据可能成为此类虚假新闻逃避检测和隔离的避风港。


    在这工作中，提出的模型使用词袋模型和tf-idf从LIAR数据集中提取特征。我们使用新闻内容作为主要特征，但也考虑了用于状态和亲和关系的个人信息。我们提出了一个重要性标签：从“真实的”、“月度的”、“半真的”到“虚假的”、“几乎真实的”，以构建虚假数据集。我们还添加了POS和全局嵌入，以确保现有结果使用我们的各种类别，包括深度学习（DL）模型：LSTM、CNN和朴素贝叶斯，以及机器学习模型。通过使用LIAR[10]数据集，我们将准确率提高了3%。多分类问题被简化为二分类问题。我们使用了LIAR数据集。


