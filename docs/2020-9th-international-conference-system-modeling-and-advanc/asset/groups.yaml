    # V. 实验与结果


    Googleatory 是一个开源笔记本，用于各种机器学习和深度学习模型。实验中，LSTM 和 BI-LSTM 分类器都使用了 Sigmoid 激活函数、Adam
    优化器和 dropout 值。我们应用了 300 维的 glove 嵌入来处理句子长度。实验设置中使用交叉熵损失。尝试不同的组合以获得结果。LSTM 达到了
    63% 的最高准确率，而机器学习分类器朴贝叶斯分类器达到了 60%。表 1 表示我们提出的方法与先进方法的比较。


