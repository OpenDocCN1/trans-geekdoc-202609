    # C. 朴贝叶斯算法


    这是一种基于特征独立假设的概率分类器。它应用了贝叶斯定理。论文 [13] 也采用了机器学习方法进行隐蔽检测。他们应用了贝叶斯分类器，将新闻的每条声明视为一个独立的特征。


    我们在下文中应用了贝叶斯定理：


    ```

    P(c|x) = \frac{P(x|c)P(c)}{P(x)}

    ```


    其中 c 是类别，x 是描述向量。


    P(c|x) 是事件 x 的后验概率，P(c) 是 c 的先验概率。


    # D. 线性 SVM 分类器


    支持向量分类器使用直线或超平面将数据划分为类别，以解决分类或回归问题。其数学描述为：


    ```

    $y = f(x) = \sum(w_ix_i)$

    ```


    在这里，x 是坐标，w 是决定直线斜率的参数。


    # E. 逻辑回归


    我们将逻辑回归用于预测后续事件。它是一种分类算法。当因变量为分类变量时，使用逻辑回归。


    ```

    $P = \frac{1}{1+e^{-(w^Tx+b)}}$

    ```


    在这里，P 是 i 的发生概率，e 是自然对数的底，b 和 m 是模型参数。


    通过使用比率


    ```

    $\frac{P}{1-P} = \exp(w^Tx+b)$

    ```


    (P) 值始终处于 0 到 1 之间；在某些情况下，几率范围可以从 0 到无穷大。几率定义为发生事件概率与不发生事件概率的比值。


    # F. 随机森林


    随机森林是一种使用集成学习创建森林的监督算法。该算法可以应用于分类、回归等领域。该算法在大数据集上表现良好。


    ```

    $ft_i = \frac{1}{n} \sum_{j=1}^{n} f_{ij}$

    ```


    ```

    $norm_i = \frac{1}{n} \sum_{j=1}^{n} f_{ij}$

    ```


    ```

    $RFT_i = \sqrt{\sum (ft_i - norm_i)^2}$

    ```


    # G. 决策树分类器


    决策树可用于执行分类或回归任务。它在利用机器学习和深度学习技术的虚假新闻检测的分类和数值数据方面表现良好。在我们的实验中，我们使用的 Gini 纯度达到了
    94% 的准确率。


    Gini 用于计算观察值分类不准确的概率。Gini 用以下数学符号表示：


    ```

    $G(z) = P(i) \log P(i) + (1-P(i)) \log(1-P(i))$

    ```


    其中 P(i) 代表训练数据中分类的概率。


    # H. 深度学习模型


    深度学习被用于自动提取显著特征。论文 [14] 采用了深度学习技术进行立场检测。他们采用 RNN 模型提取特征。Bi-LSTM 取得了最佳结果。未来，情感分析可以进一步提升性能。论文
    [15] 也应用了深度学习技术来区分词汇之间的合成关系和语义关系。他们得出深度学习模型在大数据集上表现良好。作者在论文 [16] 中提出了一种用于虚假新闻检测的新模型
    CNN。他们使用了显式特征和潜在特征，未来可以采用更多特征来增强模型性能。作者 [18] 使用 CNN 和 LSTM 计算新闻的可靠性。实验使用了带有嵌入文本和标题的视觉特征。


    # I. LSTM


    这是一种神经网络，当上下文变得可靠以预测未来结果时使用。RNN 将输出作为具有若干层的下一层。在这里，输出取决于上下文（例如在任何故事下），并且需要了解这些。RNN
    在多个领域发挥作用，如预测词、视频字幕、股市预测、序列预测、情感分析和分类。


    在 RNN 的情况下，反向传播过程中梯度可能会消失或爆炸。在梯度爆炸的情况下，权重可能会减小。为了克服这些限制，使用了 LSTM。LSTM 不读取所有输入，LSTM
    使用上下文进行记忆。GRU 是 LSTM 的一种特殊类型，没有记忆功能。图 2 展示了使用 GRU 的 LSTM 架构。这里 x 是输入层，y 是输出层。第9届系统建模与研究趋势国际会议，2020年12月4日，工程科学学院，Mahaveer
    University, Moradabad, India


    ![](img/a91a3aadf9ebfcab11621bf60a04f4a_3_0)


    # K. CNN


    CNN 是馈神经网络的变体。它可以应用于人脸识别和图像分类。CNN 在情感分析方面表现良好。卷积神经网络用于从文本或图像中提取重要特征。


    # IV. 提出的框架


    对于预处理，我们使用 NLTK 库来管理停用词和词干提取。我们应用 snowball stemmer 将句子转换为词根形式。我们还去除了标点、符号，只保留字母。将数据集转换为小写。使用
    `duplicate()` 函数删除数据中的重复行。根据实验结果，提出的数据集被分为 80:20 的训练和测试比例。


    我们合并了训练和验证数据集进行实验。在工作中，使用 NLTK POS 标记器对内容的每个词分配标签。POS 标记后，每个词被分配了一个标签。未出现在新闻内容的
    POS 标记被变为零向量。我们的工作使用了 300 维全局嵌入。在传递双向 LSTM 和 CNN 之前，嵌入按字母顺序排序。


