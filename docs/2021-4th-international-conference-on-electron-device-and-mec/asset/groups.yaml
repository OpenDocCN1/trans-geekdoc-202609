    # I. INTRODUCTION


    Daishobao (Kuaibo) is a regional newspaper in Hangzhou, Zhejiang Province. HuaTaiMei
    is a company registered in Hangzhou. On July 24th, 2013, Kuaibo signed a contract
    with sole license to HuaTai. This contract granted it the right to publish the
    post articles on the internet by Kuaibo and the right to sue for damages in cases.


    In 2019, the People''s Court issued a guidance on digital evidence. The guidance
    explicitly lists forms of digital evidence and rules for how to check whether
    the digital evidence is factual.


    HuaTaiMei v Tongdao Development case before the new guidance. However, the decision
    in the case continues to shed light on how Blockchain could be used as evidence
    even now. It is worth noting how the court handled the case.


    In 2017, jurists also wrote an article, and the court ruling was also published
    on July 24th. On the same day, the article was re-posted on the internet. Tongdao
    Development (TDD), a company with headquarters in Shenzhen, Guangdong Province,
    is the registered owner of the website.


    The court considered three factors: the credentials of the evidence storage platform,
    the reliability of the tools, and the trustworthiness of the blockchain-based
    evidence. The reasoning is similar to what people say when giving an answer. Can
    the person be trusted? Does they have adequate tools? Will the person deliver
    the product?


    The re-posting was without HuaTai''s permission. HuaTai claimed that TDD had infringed
    on its intellectual property rights and sued for damages. The case was handled
    by Hangzhou Internet Court on March 15th, 2018.


    The first court looked at what company operated the evidence storage platform.
    Its shareholders were different from HuaTai, and its operations independent of
    HuaTai''s and Kuaibo''s as a third-party digital evidence storage platform [2]


    ## II. PROTOCOL


    ### A. Preservation Protocol

    Preservation protocol serves hash evidence function code generated by evidence
    submitted by the Client. The Evidence Protocol is described below and illustrated
    in Figure 1.


    1) Initialization

    Client and Server can generate different ID to themselves, to comply with legal
    requirements, the Client needs to fetch its current location (LOC) by a legal
    server, pre-shared secret with a legal server. Formally, the initialization proceeds
    as follows:


    - Client holds evidence identification $ID_c$ and $LC$.

    - Server holds identification $ID_s$ and pre-set evidence validity period (VP).

    - Client holds the evidence data (ED) to be preserved in blockchain.

    - Client and Server share a secret: $K_c$.

    - Client (C) generates a random value $R_c$ and sends $M_c$ to Server (S) via
    HTTPS channel:

    ```

    $M_1 = (ID_C, R_C, ED, LOC)$

    ```

    - S generates a random value $R_s$ and sends $M_s$ to C via no proof and locking
    (nsb) channel:

    ```

    $M_2 = (ID_s, R_s)$

    ```

    - C computes $D_c$ and sends $M_s$ to S via no proof and locking (nsb) channel:

    ```

    $D_C = Trunc(Hash(K_C || R_C))$

    $R_C = ID_C || ID_D || ED || LOC$

    ```

    - Upon receiving $M_s$, C shares $K_c''$ shared with identified $ID_s$ and verifies
    $D_c$:

    ```

    $H = Hash(K_c'' \parallel R_c \parallel ID_c \parallel ID_s \parallel ED \parallel
    LC_c)$

    ```

    - Preservation Stage

    If verified, the timestamp (TS) from the National Time Service Center (NTSC):

    - $NTSC \rightarrow TS$

    - S computes evidence verification (ET):

    - $ET = TS + VP$

    - S generates evidence mark (EM), which can be evidence verification counter.

    - S stores the evidence on blockchain:

    ```

    $S \rightarrow Blockchain: \{EM, ID_C, ID_s, TS, ET, LC, R_C, R_s\}$

    ```

    - S sends $M_s$ to C via HTTPS channel:

    ```

    $S \rightarrow C_m = EM$

    ```


    Figure 1. Preservation Protocol


    ### B. Verification Protocol

    Verification protocol enables to confirm whether the evidence is legally recorded
    on blockchain. The Verification Protocol is described below and illustrated in
    Figure 2.


    1) Initialization

    In general, some entity (legal or illegal) wants to prove that he/she is holding
