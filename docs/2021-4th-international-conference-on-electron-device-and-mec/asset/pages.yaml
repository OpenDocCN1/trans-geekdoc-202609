    **Abstract**-HuaTaiMei v Tongdao Development case was handled by Hangzhou Internet
    Court on March 15th, 2018. The court ruled in favor of HuaTai and awarded monetary
    damages of 4,000 RMB. This is seen one of the vanguard cases for the use of Blockchain
    as a form of digital evidence. The case was certified with verified wireless secret
    communication scheme to meet legal requirement, ensure that digital evidence is
    securely stored on the blockchain and the device is activated by relevant department
    lead.


    The court ruled in favor of HuaTai and awarded monetary damages of 4,000 RMB.


    This is seen one of the vanguard cases for the use of Blockchain as a form of
    digital evidence.


    The Civil Procedure Law in China allows for use of digital evidence. as any evidence
    used should be factual, related to the case and acquired in a lawful manner. many
    were reluctant to accept digital evidence, as could be difficult to prove that
    the digital evidence is factual.


    **Keywords-blockchain; electronic evidence; judicial forensics; out-of-band chatbot**


    # I. INTRODUCTION


    Daishobao (Kuaibo) is a regional newspaper in Hangzhou, Zhejiang Province. HuaTaiMei
    is a company registered in Hangzhou. On July 24th, 2013, Kuaibo signed a contract
    with sole license to HuaTai. This contract granted it the right to publish the
    post articles on the internet by Kuaibo and the right to sue for damages in cases.


    In 2019, the People''s Court issued a guidance on digital evidence. The guidance
    explicitly lists forms of digital evidence and rules for how to check whether
    the digital evidence is factual.


    HuaTaiMei v Tongdao Development case before the new guidance. However, the decision
    in the case continues to shed light on how Blockchain could be used as evidence
    even now. It is worth noting how the court handled the case.


    In 2017, jurists also wrote an article, and the court ruling was also published
    on July 24th. On the same day, the article was re-posted on the internet. Tongdao
    Development (TDD), a company with headquarters in Shenzhen, Guangdong Province,
    is the registered owner of the website.


    The court considered three factors: the credentials of the evidence storage platform,
    the reliability of the tools, and the trustworthiness of the blockchain-based
    evidence. The reasoning is similar to what people say when giving an answer. Can
    the person be trusted? Does they have adequate tools? Will the person deliver
    the product?


    The re-posting was without HuaTai''s permission. HuaTai claimed that TDD had infringed
    on its intellectual property rights and sued for damages. The case was handled
    by Hangzhou Internet Court on March 15th, 2018.


    The first court looked at what company operated the evidence storage platform.
    Its shareholders were different from HuaTai, and its operations independent of
    HuaTai''s and Kuaibo''s as a third-party digital evidence storage platform [2]'
