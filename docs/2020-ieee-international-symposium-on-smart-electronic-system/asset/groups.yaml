    **Abstract—** This study focuses on real-time monitoring of the compressed ignition
    (CI) engine when the various vibration signals acquired for the differences of
    fuels. The vibrations acquired through shear accelerometer by maintaining a constant
    speed of 1800 rpm with equal intervals of 5kg. Statistical features are extracted
    from each signal and determination of features is performed for biodiesel and
    (20kg) with equal load. Classification is performed using random tree and naive
    Bayes algorithms which identifies the minimal vibrations and best performance
    overall by the algorithm with 96.4%. The best combination band is used further
    for training the developed neural network model to predict the vibration signals
    with the average 0.97 correlation.


    **Keywords:** Vibration monitoring, Machine Learning, Statistical features, Random
    tree, naive Bayes, Network network


    # I. INTRODUCTION


    Vibration monitoring is one of the most important processes for identifying faults
    and predicting engine malfunctions. In particular, it is becoming accepted as
    an effective method to oversee maintenance and decision making. Vibration monitoring
    collects the signals generated by an engine and analyzes them to decide the engine''s
    condition. There are many methods of monitoring where one of the main reasons
    is it generates different types of vibrations. The vibration system of the engine
    is well understood, but it is possible to predict the signatures of the vibration
    signal using sensors and data acquisition systems.


    The compression ignition (CI) engines are generally utilized in ocean transportation
    and vehicles for better economy. The non-renewable energy sources are getting
    faster. To minimize the use of oil, alternate fuel is to be used. Whether the
    biodiesel should be used as an alternate fuel is to be solved, whether it has
    enough energy to satisfy the emission standards, which is necessary to reduce
    global warming. Many researchers have made an attempt with various alternate fuels
    such as methanol, ethanol and biodiesel to solve the energy crisis. This study
    uses biodiesel as an energy source to achieve high efficiency and efficiency to
    minimize the emission emissions among [1]. We observed the engine performance
    and the combustion characteristics of the engine, and very few researchers


    monitored the engine vibration for biodiesel. Hence an attempt is made to observe
