    # 基于机器学习和网络技术的内燃机故障诊断状态监测


    Naveen Kumar P¹, S. Sakthivel G², J. Jagadeeswaran R³, Dr. Saravanakumar D⁴

    ¹自动化中心，VIT  Chennai，泰米纳德邦，印度。

    *pallicheerunaveen@gmail.com, sakthivel@vit.ac.in, jagadeeswaran@vit.ac.in, saravanakumar.d@vit.ac.in


    **摘要—** 本研究侧重于针对不同燃料差异获取的各种振动信号对压缩点（CI）发动机进行实时监测。通过剪切加速度计在 1800 rpm 的恒定速度下以 5kg
    为等间隔获取振动信号。从每个信号中提取统计特征，并对生物柴油和等载荷的（20kg）燃料进行特征确定。使用随机树和朴素贝叶斯算法进行分类，该算法以 96.4%
    的准确率识别出最小振动和整体最佳性能。进一步将最佳组合频带用于训练开发的神经网络模型，以平均 0.97 的相关性预测振动信号。


    **关键词：** 振动监测、机器学习、统计特征、随机树、朴素贝叶斯、网络


    # I. 引言


    振动监测是识别故障和预测发动机故障运行最重要的过程之一。特别是，它正被认为是一种监督维护和决策的有效方法。振动监测收集发动机产生的信号并对其进行分析以判断发动机状态。有许多监测方法，其中主要原因之一是它产生不同类型的振动。发动机的振动系统已得到理解，但可以使用传感器和数据采集系统预测振动信号的特征。


    压缩点燃（CI）发动机通常用于海洋运输和车辆，以获得更好的经济性。不可再生能源正在迅速枯竭。为了减少石油的使用，必须使用替代燃料。需要解决生物柴油应作为替代燃料，以及是否有足够的能量满足排放标准（这对减少全球变暖至关重要）。许多研究人员尝试使用甲醇、乙醇和生物柴油等替代燃料来解决能源危机。本研究使用生物柴油作为能源，以实现高效率并最大限度地减少排放
    [1]。我们观察了发动机性能和燃烧特性，很少有研究人员监测生物柴油的发动机振动。因此，尝试使用柴油观察振动信号，并将生物柴油（鱼油）按 20%、25%、30%、35%
    和 40% 的比例进行替换。保持 1800 rpm 的恒定转速，从无负载到 5kg、10kg、15kg 和 20kg 载荷/矩的等间隔。获取振动信号并去除未获取的振动信号。振动不平衡、旋转部件、产生力的变化以及组件的结构特征导致了
    CI 发动机中的振动。根据情况检测发动机振动进行状态监测，从发动机气缸获取振动数据，并使用朴素贝叶斯算法等机器学习技术进行观察和分析。


    # II. 方法论


    1. 机器学习技术

    2. 神经网络模型


    在第一种使用机器学习技术的方法，使用了随机树和朴素贝叶斯等监督学习方法。在训练数据中，算法形成树结构以构建预测学习模型，目标是实现高标准的分类准确率。


    由振动信号表征的参数是样本长度、采样频率和样本数量。无负载状态 DieselL0M4C 的样本振动特征。


