    2. Neural network model


    In the first method using machine learning techniques, the supervised learning
    method like a random tree and naive Bayes are used. In the training data, the
    algorithms form the tree structure to build a predictive learning model the goal
    is to achieve the high standards of classification accuracy.


    The parameters which characterized by the vibration signal are Sample Length,
