    the proportion of 20%, 25%, 30%, 35%, and 40%. Constant keep speed of 1800 rpm
    with no load to full in equal intervals of 5kg, 10kg, 15kg, and 20kg load/torque.
    The vibration signals are acquired and data is removed from unacquired vibration
    signals. The vibration unbalancing and rotation parts, variation of the generation
    forces, and structural characteristics of the assemblies causing vibrations in
    CI engines. Engine vibrations are detected according to the condition, condition
    monitoring is done where the vibration data is captured from the engine cylinder
    and where it is observed and analyzed by machine-learning-techniques like and
    naive Bayes algorithms.


    # II. METHODOLOGY


