    # VI. CONCLUSION


    The details of experimental values v/s predicted values are shown in fig 5(a),
    5(b), 5(c), 5(d) and 5(e).


    The fault analysis of engine is one of the best methods to achieve the results
    of identifying the faults based on the classification through the machine learning
    approach. Decision tree classification accuracy of 95.6 % with 470 classified
    instances of 500 Where the Bayes classifier provides a better classification accuracy
    98 % than random forest algorithm with 490 classified instances of 500. Based
    on the machine learning B25 blend combination is identified as the best fuel blend
    The selected blend neural network is developed and it is trained and the results
    show the predicted average correlation coefficient value of 0.92 for M4, M07 for
    M8, M09 for M12, M07 for M4B8C3.2, and for M7C24.8 for the combinations of 2-4-4,
    2-12-5, 15-15-5 and 2-4-5 respectively.'
