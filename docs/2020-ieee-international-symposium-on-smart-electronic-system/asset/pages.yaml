    # III. MACHINE LEARNING TECHNIQUES


    From the captured data for different running conditions with a change of fuels
    and load condition, the vibration signals obtained and data will be used for the
    learning process. It is observed that variation in the signals for each load condition,
    it is clearly we can classify by the classifiers. Decision Trees are a standard
    and efficient way of representing the information from an algorithm; a decision
    tree used for generating the classification rules through the nodes where each
    branch is connected to the nodes are the classification attributes.


    # 3.1 Random Tree Algorithm


    Random Tree are the ensemble of learning methods for classification that operate
    by building a number of random trees at training by giving the number of nodes
    to tree and selecting by ordering all possible. Increased trees, which can be
    generated using a stochastic growth rule, gives a classification. Taking the most
    votes over all the leaves and nodes in the tree is selected. The method of the
    discrete creates from trees is the output. Random Forest is selecting random subsets
    of variables for each tree and using the most voting output as the overall arrangement
    of the classification [6].


    # 3.2 Na Bayes Algorithm


    It is of the supervised which uses the Bayes theorem and assumption of features
    are done independently upon one another. This is used to identify the binary-class
    classifier problems. It is easy to understand and describe using binary input
    values. For the training model, the learning will be fast [7]. The probabilities
    are the representation.


    +   1. Class probability


    +   2. Conditional probability


    The class probabilities are so divided by the total number of instances. The conditional
    probability is for each attribute value is divided by instances in each class.


