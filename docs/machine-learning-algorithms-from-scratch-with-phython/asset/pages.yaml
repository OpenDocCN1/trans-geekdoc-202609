  md: '# # Welcome


    *Welcome to Machine Learning Algorithms From Scratch.* This is your guide to learning
    the details of machine learning algorithms by implementing them from scratch in
    Python. You will discover how to load data, evaluate models and implement a suite
    of top machine learning algorithms using step-by-step tutorials and sample code.


    Machine learning algorithms do have a lot of math and theory under the covers,
    but you do not need to know why algorithms work to be able to implement them and
    apply them to achieve real and valuable results. From an applied perspective,
    machine learning is a shallow field and a motivated developer can quickly pick
    it up and start making very real and impactful contributions. This is my goal
    for you and this book is your ticket to that outcome.


    # ## Implement Machine Learning Algorithms


    Most developers that I know (myself included) learn best by implementing. It is
    our preferred learning style and it is the reason that I created this book. This
    section lists the benefits of implementing machine learning algorithms from scratch,
    some benefits from extending your own implementations as well as some limitations
    to this approach to learning.


    # ### Implementation Benefits


    Machine learning is all about algorithms and there are so many algorithms that
    it can feel overwhelming. Really, there are probably only 10 algorithms that if
    understood will unlock the field for you. An approach that you can use to get
    a handle on machine learning algorithms is to implement them from scratch. This
    will give you a deep understanding of how the algorithm works and all of the micro-decision
    points within the method that can be parameterized or modified to tune it to a
    specific problem. The benefits of implementing algorithms from scratch are:


    +   - **Understanding:** You will gain a deep appreciation for how the algorithm
    works. You will begin to understand how the mathematical description of the method
    relates to vectors and matrices of numbers that your code operates on. You will
    also know how all of the parameters are used, their effects and even have insights
    into how it could be further parameterized to specialize it for a problem.


    +   - **Starting Point:** Your implementation will provide the basis for more
    advanced extensions and even an operational system that uses the algorithm. Your
    deep knowledge of the algorithm and your implementation can give you advantages
    of knowing the space and time complexity of your own code over using an opaque
    off-the-shelf library.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '+   - Ownership: The implementation is your own giving you confidence with
    the method and ownership over how it is realized as a system. It is no longer
    just a machine learning algorithm, but a method that is now in your toolbox.


    # ## Implementation Extensions


    Once you have implemented an algorithm you can explore making improvements to
    the implementation. Some examples of improvements you could explore include:


    +   - Experimentation: You can expose many of the micro-decisions you made in
    the algorithms implementation as parameters and perform studies on variations
    of those parameters. This can lead to new insights and disambiguation of code
    that you can share and promote.


    +   - Optimization: You can explore opportunities to make the implementation more
    efficient by using tools, libraries, different languages, different data structures,
    patterns and internal algorithms. Knowledge you have of algorithms and data structures
    for classical computer science can be very beneficial in this type of work.


    +   - Specialization: You may explore ways of making the algorithm more specific
    to a problem. This can be required when creating production systems and is a valuable
    skill. Making an algorithm more problem specific can also lead to increases in
    efficiency (such as running time) and efficacy (such as accuracy or other performance
    measures).


    +   - Generalization: Opportunities can be created by making a specific algorithm
    more general. Programmers (like mathematicians) are uniquely skilled in abstraction
    and you may be able to see how the algorithm could be applied to more general
    cases of a class of problem or other problems entirely.


    # ## Implementation Limitations


    Developers and engineers often learn best by implementing, but implementing machine
    learning algorithms is not the place to start for everyone.


    +   - Slow for Beginners. Often, practitioners will make more progress and progress
    faster by learning how to apply machine learning algorithms to predictive modeling
    problems. Implementing algorithms is a second step for learning how to get more
    out of each algorithm by discovering how they work and how the parameters affect
    their behavior.


    +   - Speed and Correctness. Algorithms that you use to solve business problems
    need to be fast and correct. And this can be very hard to do for beginners. The
    implementations developed for learning purposes are almost certainly going to
    be too slow or too fragile for use in operations (that includes all examples in
    this book). Use implementations for learning and efficient code libraries for
    production systems.


    # ## Book Organization


    This book is divided into 6 main parts:'
  merge: -1
  img_proc: true
- pgno: 8
  md: '+   1. **Introduction**. Welcomes you to the book and clearly lays out what
    to expect and your learning outcomes (you are here).

    +   2. **Data Preparation**. Tutorials for loading and preparing data, evaluating
    model predictions, estimating model skill and developing a baseline for model
    performance.

    +   3. **Linear Algorithms**. Tutorials on linear machine learning algorithms
    such as linear regression, multivariate linear regression, logistic regression
    and the Perceptron algorithm.

    +   4. **Nonlinear Algorithms**. Tutorials on nonlinear machine learning algorithms
    such as Naive Bayes, k-Nearest Neighbors, Learning Vector Quantization, Backpropagation
    and Decision Trees.

    +   5. **Ensemble Algorithms**. Tutorials on ensemble machine learning algorithms
    such as Bootstrap Aggregation, Random Forest and Stacked Generalization.

    +   6. **Conclusions**. A review of how far you have come and resources for getting
    help and further reading.


    There are a few ways you can read this book. You can dip into the tutorials as
    your need or interests motivate you. Alternatively, you can work through the book
    end-to-end and take advantage of how the tutorials build in complexity and range.
    I recommend the latter approach. To get the very most from this book, I recommend
    taking each tutorial and building upon them. Attempt to improve the results, apply
    the method to a similar but different problem, and so on. I share a number of
    extension ideas for you to consider in each tutorial.


    Write up what you tried or learned and share it on your blog, social media or
    send me an email at jason@MachineLearningMastery.com. This book is what you make
    of it and by putting in a little extra, you can quickly become a true force in
    machine learning algorithms.


    # Tutorial Structure


    A tutorial-based approach is used throughout the book. It is conversational rather
    than formal and focuses on the ideas, the code needed to implement those ideas,
    and the results to expect. All tutorials in this book follow a carefully designed
    6-part structure. This structure can be summarized as follows:


    +   1. Overview

    +   2. Description

    +   3. Tutorial

    +   4. Case Study

    +   5. Extensions

    +   6. Review'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# ## Overview


    This is a short section that summarizes the tutorial. You will discover exactly
    what you will know after completing the tutorial.


    # ## Description


    This section describes both the technique and problem that you will be applying
    it to. It will not describe the theory behind why the technique works. Instead,
    it focuses on the salient details regarding how the technique works. This includes
    points relevant to implementing it from scratch.


    Also included in this section is a summary of the problem that the technique will
    be evaluated on, if relevant. Not all tutorials will have a problem description:
    only those tutorials on a given machine learning algorithm. Only standard well-known
    machine learning problems are used as they are freely accessible and known best
    results are available for comparison.


    # ## Tutorial


    The tutorial is the steps to complete to go from just an idea to a fully working
    implementation. Each tutorial was designed with three principles in mind:


    +   1. **Procedural:** Tutorials are procedural, meaning that they are presented
    as a recipe of discrete steps intended to be completed in order.

    +   2. **Standalone:** Tutorials are standalone, meaning that all code needed
    to run the example is available within the tutorial, even if this involves repetition.

    +   3. **Consistent:** Tutorials are consistent, meaning that the same routines
    developed earlier in the book are used again and again to load data and evaluate
    algorithms.


    A summary of the steps in the tutorial is provided followed by the numbered steps
    of each part of the procedure. Code was designed to be modular and broken down
    into many small functions that can be understood and tested as standalone units.
    A procedural rather than object-oriented approach was used in all code examples.
    Clever Python tricks and advanced use of lambdas and list comprehensions were
    kept to a minimum in favor of for-loops. This was done intentionally for 3 reasons:


    +   - To be kind to Python novices.

    +   - To be understandable as almost pseudocode, a large benefit of Python.

    +   - To be readily adaptable for use in other other languages and environments.


    If you have advanced Python skills and you can see more efficient ways to structure
    the code, please share your ideas with me and we can put them on the ML Mastery
    blog. I would love to see what you come up with.


    **Disclaimer:** All the code in this book is for education and demonstration only.
    Code is not intended for use in production systems or operational environments.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Case Study


    Each algorithm tutorial ends with a complete code listing of a fully working case
    study on a real-world predictive modeling problem. This is to show you how to
    use the technique in practice, often leveraging techniques introduced earlier
    in the book such as data loading, data preparation and algorithm evaluation. This
    is to ensure that even if small copy-paste errors were made during the execution
    of the tutorial or steps were skipped, that you always have a reference version
    of the tutorial to run and use as a template for your own work. A sample output
    is also provided from executing the example, again so that you have reference
    for comparison.


    # Extensions


    This section lists ideas to extend the example in the tutorial. This may include
    additional implementation concerns to make the technique more robust or generally
    applicable. It may also include usage heuristics for the technique to ensure you
    can get more out of its application to new problems. Please try some of the extension
    ideas. Even email me and share your experiences; we can put them to the ML Mastery
    blog.


    # Review


    Tutorials end with a summary of the principles and skills that you learned. This
    helps to reinforce and remind you of your progress through the book and keep you
    highly motivated.


    # Requirements For This Book


    # Python


    You do not need to be a Python expert, but it would be helpful if you have or
    know how to install and setup a Python environment. You are expected to know some
    basic Python syntax. If you are a programmer from another language like Java or
    C#, there is a Python crash course in the appendix to bring you up to speed quickly.


    The tutorials assume that you have Python 2.7 installed and working. I have not
    tested the code with a Python 3 environment, but my students tell me that the
    code works with little or no modification. You may have a Python environment on
    your workstation or laptop, it may be in a VM or a Docker instance that you run,
    or it may be a server instance that you can configure in the cloud.


    # Machine Learning


    You do not need to be a machine learning expert, but it would be helpful if you
    knew how to navigate a small machine learning problem. Concepts and techniques
    are described at the beginning of each tutorial, but only briefly enough to give
    you context. Additional resources are listed for you to learn more on each concept
    introduced. There are resources to go into these topics in more detail at the
    end of the book, but some knowledge of these areas might make things easier for
    you.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# # Your Outcomes From Reading This Book


    This book will lead you from being a developer who is interested in machine learning
    algorithms to a machine learning developer that knows how to implement a suite
    of machine learning algorithms and techniques from scratch in Python. Specifically,
    you will know:


    +   - How to load from CSV files and prepare data for modeling.

    +   - How to select algorithm evaluation metrics and resampling techniques for
    a test harness.

    +   - How to develop a baseline expectation of performance for a given problem.

    +   - How to implement and apply a suite of linear machine learning algorithms.

    +   - How to implement and apply a suite of advanced nonlinear machine learning
    algorithms.

    +   - How to implement and apply ensemble machine learning algorithms to improve
    performance.


    From this outcome you will:


    +   - Know how top machine learning algorithms work internally.

    +   - Know how to better configure machine learning algorithms in order to get
    the most out of them.

    +   - Know the myriad of micro-decisions that a machine learning library has hidden
    from you in practice.

    +   - Know how you might begin to develop your own custom machine learning algorithm
    implementations.


    # ## What This Book is Not


    This book solves a specific problem of getting you, a developer, up to speed on
    how to implement top machine learning algorithms from scratch in Python. This
    book was not intended to be everything to everyone and it is very important to
    calibrate your expectations. Specifically:


    +   - **This is not a machine learning textbook.** We will not be getting into
    the theory or mathematical description of machine learning algorithms as this
    is not required to implement algorithms from scratch. You are also expected to
    have some familiarity with machine learning basics, or be able to pick them up
    yourself.

    +   - **This is not an applications book.** We will be using real-world problems
    as case studies, but we will not linger on the best practices for working through
    machine learning problems end-to-end.

    +   - **This is not a Python programming book.** We will not be spending a lot
    of time on Python syntax and programming (e.g. basic programming tasks in Python).
    You are expected to already be familiar with Python or a developer who can pick
    up a new C-like language relatively quickly.


    Resources are provided in the final chapter if you are interested in focusing
    on one of these related areas.'
