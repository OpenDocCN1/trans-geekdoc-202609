  md: '# Chapter 15


    # Backpropagation


    The backpropagation algorithm is the classical feedforward artificial neural network.
    It is the technique still used to train large deep learning networks. In this
    tutorial, you will discover how to implement the backpropagation algorithm from
    scratch with Python. After completing this tutorial, you will know:


    +   - How to forward-propagate an input to calculate an output.

    +   - How to backpropagate error and train a network.

    +   - How to apply the backpropagation algorithm to a real-world predictive modeling
    problem.


    Let''s get started.


    # 15.1 Description


    This section provides a brief introduction to the Backpropagation Algorithm and
    the Wheat Seeds dataset that we will be using in this tutorial.


    # 15.1.1 Backpropagation Algorithm


    The Backpropagation algorithm is a supervised learning method for multilayer feedforward
    networks from the field of Artificial Neural Networks. Feedforward neural networks
    are inspired by the information processing of one or more neural cells, called
    a neuron. A neuron accepts input signals via its dendrites, which pass the electrical
    signal down to the cell body. The axon carries the signal out to synapses, which
    are the connections of a cell''s axon to other cell''s dendrites.


    The principle of the backpropagation approach is to model a given function by
    modifying internal weightings of input signals to produce an expected output signal.
    The system is trained using a supervised learning method where the error between
    the system''s output and a known expected output is presented to the system and
    used to modify its internal state.


    Technically, the backpropagation algorithm is a method for training the weights
    in a multilayer feedforward neural network. As such, it requires a network structure
    to be defined of one or more layers where one layer is fully connected to the
    next layer. A standard network structure'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'is one input layer, one hidden layer, and one output layer. Backpropagation
    can be used for both classification and regression problems, but we will focus
    on classification in this tutorial.


    In classification problems, best results are achieved when the network has one
    neuron in the output layer for each class value. For example, a 2-class or binary
    classification problem with the class values of A and B. These expected outputs
    would have to be transformed into binary vectors with one column for each class
    value. Such as [1, 0] and [0, 1] for A and B respectively. This is called a one
    hot encoding.


    # 15.1.2 Wheat Seeds Dataset


    In this tutorial we will use the Wheat Seeds Dataset. This dataset involves the
    prediction of the species of wheat seeds. The baseline performance on the problem
    is approximately 28%. You can learn more about it in Appendix A, Section A.10.
    Download the dataset and save it into your current working directory with the
    filename `seeds_dataset.csv`. The dataset is in tab-separated format, so you must
    convert it to CSV using a text editor or a spreadsheet program.


    # 15.2 Tutorial


    This tutorial is broken down into 6 parts:


    +   1. Initialize Network.

    +   2. Forward-Propagate.

    +   3. Backpropagate Error.

    +   4. Train Network.

    +   5. Predict.

    +   6. Wheat Seeds Case Study.


    These steps will provide the foundation that you need to implement the backpropagation
    algorithm from scratch and apply it to your own predictive modeling problems.


    # 15.2.1 Initialize Network


    Let’s start with something easy: the creation of a new network ready for training.
    Each neuron has a set of weights that need to be maintained. One weight for each
    input connection and an additional weight for the bias. We will need to store
    additional properties for a neuron during training, therefore we will use a dictionary
    to represent each neuron and store properties by names such as `weights` for the
    weights.


    A network is organized into layers. The input layer is really just a row from
    our training dataset. The first real layer is the hidden layer. This is followed
    by the output layer that has one neuron for each class value. We will organize
    layers as arrays of dictionaries and treat the whole network as an array of layers.
    It is good practice to initialize the network weights to small random numbers.
    In this case, will use random numbers in the range of 0 to 1.'
