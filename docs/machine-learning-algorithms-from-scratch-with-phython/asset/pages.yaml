  md: "The performance of high variance machine learning algorithms like unpruned\
    \ decision trees can be improved by training many trees and taking the average\
    \ of their predictions. Results are often better than a single decision tree.\
    \ Another benefit of bagging in addition to improved performance is that the bagged\
    \ decision trees cannot overfit the problem. Trees can continue to be added until\
    \ a maximum in performance is achieved.\n\n# 16.1.2 Sonar Dataset\n\nIn this tutorial\
    \ we will use the Sonar Dataset. This dataset involves the discrimination between\
