- pgno: 46
  md: '# Chapter 5


    # Baseline Models


    It is important to establish baseline performance on a predictive modeling problem.
    A baseline provides a point of comparison for the more advanced methods that you
    evaluate later. In this tutorial, you will discover how to implement baseline
    machine learning algorithms from scratch in Python.


    After completing this tutorial, you will know:


    +   - How to implement the random prediction algorithm.

    +   - How to implement the zero rule prediction algorithm.


    Let''s get started.


    # 5.1 Description


    There are many machine learning algorithms to choose from. Hundreds in fact. You
    must know whether the predictions for a given algorithm are good or not. But how
    do you know? The answer is to use a baseline prediction algorithm. A baseline
    prediction algorithm provides a set of predictions that you can evaluate as you
    would any predictions for your problem, such as classification accuracy or RMSE.


    The scores from these algorithms provide the required point of comparison when
    evaluating all other machine learning algorithms on your problem. Once established,
    you can comment on how much better a given algorithm is as compared to the naive
    baseline algorithm, providing context on just how good a given method actually
    is. The two most commonly used baseline algorithms are:


    +   - Random Prediction Algorithm.

    +   - Zero Rule Algorithm.


    When starting on a new problem that is more difficult than a conventional classification
    or regression problem, it is a good idea to first devise a random prediction algorithm
    that is specific to your prediction problem. Later you can improve upon this and
    devise a zero rule algorithm. Let''s implement these algorithms and see how they
    work.'
  merge: -1
  img_proc: true
