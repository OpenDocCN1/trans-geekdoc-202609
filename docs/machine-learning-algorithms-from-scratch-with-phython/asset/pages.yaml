  md: "First the total number of training records is calculated from the counts stored\
    \ in the summary statistics. This is used in the calculation of the probability\
    \ of a given class or P(class) as the ratio of rows with a given class of all\
    \ rows in the training data.\n\nNext, probabilities are calculated for each input\
    \ value in the row using the Gaussian probability density function and the statistics\
    \ for that column and of that class. Probabilities are multiplied together as\
    \ they accumulated. This process is repeated for each class in the dataset. Finally\
    \ a dictionary of probabilities is returned with one entry for each class.\n\n\
    ```\n```python\n# Calculate the probabilities of predicting each class for a given\
    \ row\ndef calculate_class_probabilities(summaries, row):\n    total_rows = sum([summaries[label][0][2]\
    \ for label in summaries])\n    probabilities = dict()\n    for class_value, class_summaries\
    \ in summaries.iteritems():\n        probabilities[class_value] = summaries[class_value][0][2]/float(total_rows)\n\
    \        for i in range(len(class_summaries)):\n            mean, stdev, count\
    \ = class_summaries[i]\n            probabilities[class_value] *= calculate_probability(row[i],\
    \ mean, stdev)\n    return probabilities\n```\n```\n\nListing 12.16: Function\
    \ To Calculate the Probabilities for Each Class.\n\nLet’s tie this together with\
    \ an example on the contrived dataset. The example below first calculates the\
    \ summary statistics by class for the training dataset, then uses these statistics\
    \ to calculate the probability of the first record belonging to each class.\n\n\
    ```\n```python\n# Example of calculating class probabilities\nfrom math import\
    \ sqrt\nfrom math import pi\nfrom math import exp\n\n# Split the dataset by class\
    \ values, returns a dictionary\ndef separate_by_class(dataset):\n    separated\
    \ = dict()\n    for i in range(len(dataset)):\n        vector = dataset[i]\n \
    \       class_value = vector[-1]\n        if (class_value not in separated):\n\
    \            separated[class_value] = list()\n        separated[class_value].append(vector)\n\
    \    return separated\n\n# Calculate the mean of a list of numbers\ndef mean(numbers):\n\
    \    return sum(numbers)/float(len(numbers))\n\n# Calculate the standard deviation\
    \ of a list of numbers\ndef stdev(numbers):\n    avg = mean(numbers)\n    variance\
    \ = sum([(x-avg)**2 for x in numbers]) / float(len(numbers)-1)\n    return sqrt(variance)\n\
    \n# Calculate the mean, stdev and count for each column in a dataset\ndef summarize_dataset(dataset):\n\
    \    summaries = [(mean(column), stdev(column), len(column)) for column in zip(*dataset)]\n\
    \    del(summaries[-1])\n    return summaries\n```\n```"
