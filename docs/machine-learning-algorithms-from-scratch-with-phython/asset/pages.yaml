    \ the Train/Test Split.\n\n# 6.2.2 Cross-Validation Algorithm Test Harness\n\n\
    Cross-validation is a resampling technique that provides more reliable estimates\
    \ of algorithm performance on unseen data. It requires the creation and evaluation\
    \ of k models on different subsets of your data, and as such is more computationally\
    \ expensive. Nevertheless, it is the gold standard for evaluating machine learning\
    \ algorithms.\n\nAs in the previous section, we need to create a function that\
    \ ties together the resampling method, the evaluation of the algorithm on the\
    \ dataset and the performance calculation method. Unlike above, the algorithm\
    \ must be evaluated on different subsets of the dataset many times. This means\
    \ we need additional loops within our `evaluate_algorithm()` function.\n\nBelow\
    \ is a function that implements algorithm evaluation with cross-validation. First,\
    \ the dataset is split into n folds groups called folds. Next, we loop giving\
    \ each fold an opportunity to be held out of training and used to evaluate the\
    \ algorithm. A copy of the list of folds is created and the held out fold is removed\
    \ from this list. Then the list of folds is flattened into one long list of rows\
    \ to match the algorithms expectation of a training dataset. This is done using\
    \ the `sum()` function.\n\nOnce the training dataset is prepared the rest of the\
    \ function within this loop is as above. A copy of the test dataset (the fold)\
    \ is made and the output values are cleared to avoid accidental cheating by algorithms.\
    \ The algorithm is prepared on the train dataset and makes predictions on the\
    \ test dataset. The predictions are evaluated and stored in a list. Unlike the\
    \ train-test algorithm test harness, a list of scores is returned, one for each\
    \ cross-validation fold."
