    # ### 9.1.1 Logistic Regression


    Logistic regression is named for the function used at the core of the method,
    the logistic function. Logistic regression uses an equation as the representation,
    very much like linear regression. Input values (X) are combined linearly using
    weights or coefficient values to predict an output value (y). A key difference
    from linear regression is that the output value being modeled is a binary value
    (0 or 1) rather than a numeric value.


    ```

    yhat = \frac{e^{b0+b1 \times x1}}{1 + e^{b0+b1 \times x1}}

    ```


    This can be simplified as:


    ```

    yhat = \frac{1.0}{1.0 + e^{-(b0+b1 \times x1)}}

    ```


    Where e is the base of the natural logarithms (Euler''s number), yhat is the predicted
    output, b0 is the bias or intercept term and b1 is the coefficient for the single
    input value (x1). The'
