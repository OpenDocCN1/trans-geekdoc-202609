  md: "+   2. k-fold Cross-Validation Split.\n\n+   3. How to Choose a Resampling\
    \ Method.\n\nThese steps will provide the foundations you need to handle resampling\
    \ your dataset to estimate algorithm performance on new data.\n\n# 3.2.1 Train\
    \ and Test Split\n\nThe train and test split is the easiest resampling method.\
    \ As such, it is the most widely used. The train and test split involves separating\
    \ a dataset into two parts:\n\n+   1. Training Dataset.\n\n+   2. Test Dataset.\n\
    \nThe training dataset is used by the machine learning algorithm to train the\
    \ model. The test dataset is held back and is used to evaluate the performance\
    \ of the model. The rows assigned to each dataset are randomly selected. This\
    \ is an attempt to ensure that the training and evaluation of a model is objective.\n\
    \nIf multiple algorithms are compared or multiple configurations of the same algorithm\
    \ are compared, the same train and test split of the dataset should be used. This\
    \ is to ensure that the comparison of performance is consistent or apples-to-apples.\
    \ We can achieve this by seeding the random number generator the same way before\
    \ splitting the data, or by holding the same split of the dataset for use by multiple\
    \ algorithms. We can implement the train and test split of a dataset in a single\
    \ function.\n\nBelow is a function named `train_test_split()` to split a dataset\
    \ into a train and test split. It accepts two arguments: the dataset to split\
    \ as a list of lists and an optional split percentage. A default split percentage\
    \ of 0.6 or 60% is used. This will assign 60% of the dataset to the training dataset\
    \ and leave the remaining 40% to the test dataset. A 60/40 for train/test is a\
    \ good default split of the data.\n\nThe function first calculates how many rows\
    \ the training set requires from the provided dataset. A copy of the original\
    \ dataset is made. Random rows are selected and removed from the copied dataset\
    \ and added to the train dataset until the train dataset contains the target number\
    \ of rows. The rows that remain in the copy of the dataset are then returned as\
    \ the test dataset. The `randrange()` function from the random model is used to\
    \ generate a random integer in the range between 0 and the size of the list.\n\
    \n```\n# Split a dataset into a train and test set\ndef train_test_split(dataset,\
    \ split=0.60):\n    train = list()\n    train_size = split * len(dataset)\n  \
    \  dataset_copy = list(dataset)\n    while len(train) < train_size:\n        index\
    \ = randrange(len(dataset_copy))\n        train.append(dataset_copy.pop(index))\n\
    return train, dataset_copy\n```\n\nListing 3.1: Function To Split a Dataset."
