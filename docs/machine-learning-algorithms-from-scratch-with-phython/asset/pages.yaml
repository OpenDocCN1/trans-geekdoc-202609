    # 12.2.5 Class Probabilities


    Now it is time to use the statistics calculated from our training data to calculate
    probabilities for new data. Probabilities are calculated separately for each class.
    This means that we first calculate the probability that a new piece of data belongs
    to the first class, then calculate probabilities that it belongs to the second
    class, and so on for all the classes. The probability that a piece of data belongs
    to a class is calculated as follows:


    P(class|data) = P(X|class) × P(class) (12.5)


    You may note that this is different from the Bayes Theorem described above. The
    division have been removed to simplify the calculation. This means that the result
    is no longer strictly a probability of the data belonging to a class. The value
    is still maximized, meaning that the calculation for the class that results in
    the largest value is taken as the prediction. This is a common implementation
    simplification as we are often more interested in the class prediction rather
    than the probability.


    The input variables are treated separately, giving the technique it''s name naive.
    For the above example where we have 2 input variables, the calculation of the
    probability that a row belongs to the first class 0 can be calculated as:


    P(class = 0|X1,X2) = P(X1|class = 0) × P(X2|class = 0) × P(class = 0) (12.6)


    Now you can see why we need to separate the data by class value. The Gaussian
    Probability Density function in the previous step is how we calculate the probability
    of a real value like X1 and the statistics we prepared are used in this calculation.
    Below is a function named calculate_class_probabilities() that ties all of this
    together. It takes a set of prepared summaries and a new row as input arguments.'
