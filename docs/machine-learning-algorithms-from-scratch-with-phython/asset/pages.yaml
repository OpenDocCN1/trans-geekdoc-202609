    \n# 16.2 Tutorial\n\nThis tutorial is broken down into 2 parts:\n\n+   - Bootstrap\
    \ Resample.\n+   - Sonar Case Study.\n\nThese steps provide the foundation that\
    \ you need to implement and apply bootstrap aggregation with decision trees to\
    \ your own predictive modeling problems.\n\n# 16.2.1 Bootstrap Resample\n\nLet's\
    \ start off by getting a strong idea of how the bootstrap method works. We can\
    \ create a new sample of a dataset by randomly selecting rows from the dataset\
    \ and adding them to a new list. We can repeat this for a fixed number of rows\
    \ or until the size of the new dataset matches a ratio of the size of the original\
    \ dataset.\n\nWe can allow sampling with replacement by not removing the row that\
    \ was selected so that it is available for future selections. Below is a function\
    \ named `subsample()` that implements this procedure. The `randrange()` function\
    \ from the random module is used to select a random row index to add to the sample\
    \ each iteration of the loop. The default size of the sample is the size of the\
    \ original dataset.\n\n```\n# Create a random subsample from the dataset with\
    \ replacement\ndef subsample(dataset, ratio=1.0):\n    sample = list()\n    n_sample\
    \ = round(len(dataset) * ratio)\n    while len(sample) < n_sample:\n        index\
    \ = randrange(len(dataset))\n        sample.append(dataset[index])\n    return\
    \ sample\n```\n\nListing 16.1: Function To Make a Subsample of a Dataset.\n\n\
    We can use this function to estimate the mean of a contrived dataset. First, we\
    \ can create a dataset with 20 rows and a single column of random numbers between\
    \ 0 and 9 and calculate the"
