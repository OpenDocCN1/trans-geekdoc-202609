- pgno: 96
  md: "+   1. Loop over each epoch.\n+   2. Loop over each row in the training data\
    \ for an epoch.\n+   3. Loop over each weight and update it for a row in an epoch.\n\
    \nAs you can see, we update each weight for each row in the training data, each\
    \ epoch. Weights are updated based on the error the model made. The error is calculated\
    \ as the difference between the expected output value and the prediction made\
    \ with the candidate weights.\n\nThere is one weight for each input attribute,\
    \ and these are updated in a consistent way. For example:\n\n$w(t + 1) = w(t)\
    \ + \\text{learning rate} \\times (expected(t) - predicted(t)) \\times x(t)$ (10.6)\n\
    \nThe bias is updated in a similar way, except without an input as it is not associated\
    \ with a specific input value:\n\n$bias(t + 1) = bias(t) + \\text{learning rate}\
    \ \\times (expected(t) - predicted(t))$ (10.7)\n\nNow we can put all of this together.\
