- pgno: 111
  md: "Now that we know how to find the best split points in a dataset or list of\
    \ rows, let's see how we can use it to build out a decision tree.\n\n# 11.2.3\
    \ Build a Tree\n\nCreating the root node of the tree is easy. We call the above\
    \ `get_split()` function using the entire dataset. Adding more nodes to our tree\
    \ is more interesting. Building a tree may be divided into 3 main parts:\n\n+\
    \   1. Terminal Nodes.\n+   2. Recursive Splitting.\n+   3. Building a Tree.\n\
    \n# Terminal Nodes\n\nWe need to decide when to stop growing a tree. We can do\
    \ that using the depth and the number of rows that the node is responsible for\
    \ in the training dataset.\n\n+   • **Maximum Tree Depth**. This is the maximum\
    \ number of nodes from the root node of the tree. Once a maximum depth of the\
    \ tree is met, we must stop adding new nodes. Deeper trees are more complex and\
    \ are more likely to overfit the training data.\n+   \n+   • **Minimum Node Records**.\
    \ This is the minimum number of training patterns that a given node is responsible\
    \ for. Once at or below this minimum, we must stop splitting and adding new nodes.\
    \ Nodes that account for too few training patterns are expected to be too specific\
    \ and are likely to overfit the training data.\n\nThese two approaches will be\
    \ user-specified arguments to our tree building procedure. There is one more condition;\
    \ it is possible to choose a split in which all rows belong to one group. In this\
    \ case, we will be unable to continue splitting and adding child nodes as we will\
    \ have no records to split on one side or another.\n\nNow we have some ideas of\
    \ when to stop growing the tree. When we do stop growing at a given point, that\
    \ node is called a terminal node and is used to make a final prediction. This\
    \ is done by taking the group of rows assigned to that node and selecting the\
    \ most common class value in the group. This will be used to make predictions.\
    \ Below is a function named `to_terminal()` that will select a class value for\
    \ a group of rows. It returns the most common output value in a list of rows.\n\
    \n```\n# Create a terminal node value\ndef to_terminal(group):\n    outcomes =\
    \ [row[-1] for row in group]\n    return max(set(outcomes), key=outcomes.count)\n\
    ```\n\nListing 11.9: Function To Create a Terminal Node."
  merge: -1
  img_proc: true
- pgno: 112
  md: "# Recursive Splitting\n\nWe know how and when to create terminal nodes; now\
    \ we can build our tree. Building a decision tree involves calling the above developed\
    \ `get_split()` function over and over again on the groups created for each node.\
    \ New nodes added to an existing node are called child nodes. A node may have\
    \ zero children (a terminal node), one child (one side makes a prediction directly)\
    \ or two child nodes. We will refer to the child nodes as left and right in the\
    \ dictionary representation of a given node.\n\nOnce a node is created, we can\
    \ create child nodes recursively on each group of data from the split by calling\
    \ the same function again. Below is a function that implements this recursive\
    \ procedure. It takes a node as an argument as well as the maximum depth, minimum\
    \ number of patterns in a node and the current depth of a node. You can imagine\
    \ how this might be first called passing in the root node and the depth of 1.\
    \ This function is best explained in steps:\n\n+   1. Firstly, the two groups\
    \ of data split by the node are extracted for use and deleted from the node. As\
    \ we work on these groups the node no longer requires access to these data.\n\
    +   \n+   2. Next, we check if either left or right group of rows is empty and\
    \ if so we create a terminal node using what records we do have.\n+   \n+   3.\
    \ We then check if we have reached our maximum depth and if so we create a terminal\
    \ node.\n+   \n+   4. We then process the left child, creating a terminal node\
    \ if the group of rows is too small, otherwise creating and adding the left node\
    \ in a depth first fashion until the bottom of the tree is reached on this branch.\n\
    +   \n+   5. The right side is then processed in the same manner, as we rise back\
    \ up the constructed tree to the root.\n\n```\n```python\n# Create child splits\
    \ for a node or make terminal\ndef split(node, max_depth, min_size, depth):\n\
    \    left, right = node['groups']\n    del(node['groups'])\n    # check for a\
    \ no split\n    if not left or not right:\n        node['left'] = node['right']\
    \ = to_terminal(left + right)\n        return\n    # check for max depth\n   \
    \ if depth >= max_depth:\n        node['left'], node['right'] = to_terminal(left),\
    \ to_terminal(right)\n        return\n    # process left child\n    if len(left)\
    \ <= min_size:\n        node['left'] = to_terminal(left)\n    else:\n        node['left']\
    \ = get_split(left)\n        split(node['left'], max_depth, min_size, depth+1)\n\
    \    # process right child\n    if len(right) <= min_size:\n        node['right']\
    \ = to_terminal(right)\n    else:\n        node['right'] = get_split(right)\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 113
  md: "```\nsplit(node['right'], max_depth, min_size, depth+1)\n```\n\nListing 11.10:\
    \ Function To Create Split Points Recursively.\n\n# Building a Tree\n\nWe can\
    \ now put all of the pieces together. Building the tree involves creating the\
    \ root node and calling the `split()` function that then calls itself recursively\
    \ to build out the whole tree. Below is the small `build_tree()` function that\
    \ implements this procedure.\n\n```\n```python\n# Build a decision tree\ndef build_tree(train,\
    \ max_depth, min_size):\n    root = get_split(train)\n    split(root, max_depth,\
    \ min_size, 1)\n    return root\n```\n```\n\nListing 11.11: Function To Create\
    \ a Decision Tree.\n\nWe can test out this whole procedure using the small dataset\
    \ we contrived above. Below is the complete example. Also included is a small\
    \ `print_tree()` function that recursively prints out nodes of the decision tree\
    \ with one line per node. Although not as striking as a real decision tree diagram,\
    \ it gives an idea of the tree structure and decisions made throughout.\n\n```\n\
    ```python\n# Example of building a tree\n\n# Split a dataset based on an attribute\
    \ and an attribute value\ndef test_split(index, value, dataset):\n    left, right\
    \ = list(), list()\n    for row in dataset:\n        if row[index] < value:\n\
    \            left.append(row)\n        else:\n            right.append(row)\n\
    \    return left, right\n\n# Calculate the Gini index for a split dataset\ndef\
    \ gini_index(groups, classes):\n    # count all samples at split point\n    n_instances\
    \ = float(sum([len(group) for group in groups]))\n    # sum weighted Gini index\
    \ for each group\n    gini = 0.0\n    for group in groups:\n        size = float(len(group))\n\
    \        # avoid divide by zero\n        if size == 0:\n            continue\n\
    \        score = 0.0\n        # score the group based on the score for each class\n\
    \        for class_val in classes:\n            p = [row[-1] for row in group].count(class_val)\
    \ / size\n            score += p * p\n        # weight the group score by its\
    \ relative size\n        gini += (1.0 - score) * (size / n_instances)\n    return\
    \ gini\n```\n```"
