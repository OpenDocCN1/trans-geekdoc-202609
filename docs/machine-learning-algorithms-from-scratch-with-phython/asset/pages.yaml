    \nThe random prediction algorithm is easy to implement and fast to run, but we\
    \ could do better as a baseline.\n\n# 5.2.2 Zero Rule Algorithm\n\nThe Zero Rule\
    \ Algorithm is a better baseline than the random algorithm. It uses more information\
    \ about a given problem to create one rule in order to make predictions. This\
    \ rule is different depending on the problem type. Let's start with classification\
    \ problems, predicting a class label.\n\n# Classification\n\nFor classification\
    \ problems, the one rule is to predict the class value that is most common in\
    \ the training dataset. This means that if a training dataset has 90 instances\
    \ of class 0 and 10 instances of class 1 that it will predict 0 and achieve a\
    \ baseline accuracy of 90/100 or 90%.\n\nThis is much better than the random prediction\
    \ algorithm that would only achieve 82% accuracy on average. For details on how\
    \ this is estimate for random search is calculated, see below:\n\n```\n= ((0.9\
    \ x 0.9) + (0.1 x 0.1)) x 100\n= 82%\n(5.1)\n```\n\nBelow is a function named\
    \ zero_rule_algorithm_classification() that implements this for the classification\
    \ case.\n\n```\n# zero rule algorithm for classification\ndef zero_rule_algorithm_classification(train,\
    \ test):\n    output_values = [row[-1] for row in train]\n    prediction = max(set(output_values),\
    \ key=output_values.count)\n    predicted = [prediction for i in range(len(test))]\n\
    \    return predicted\n```"
