  md: "Running the example produces the following output. First, the dataset is printed\
    \ in a list-of-lists format, then the min and max for each column is printed in\
    \ the format column1: min,max and column2: min,max. For example:\n\n```\n[[50,\
    \ 30], [20, 90]]\n[[20, 50], [30, 90]]\n```\n\n# Listing 2.4: Output of Example\
    \ Calculating the Min and Max Values.\n\nOnce we have estimates of the maximum\
    \ and minimum allowed values for each column, we can now normalize the raw data\
    \ to the range 0 and 1. The calculation to normalize a single value for a column\
    \ is:\n\nscaled value = \\(\\frac{value - min}{max - min}\\) (2.1)\n\nBelow is\
    \ an implementation of this in a function called normalize_dataset() that normalizes\
    \ values in each column of a provided dataset.\n\n```\n# Rescale dataset columns\
    \ to the range 0-1\ndef normalize_dataset(dataset, minmax):\n    for row in dataset:\n\
    \        for i in range(len(row)):\n            row[i] = (row[i] - minmax[i][0])\
    \ / (minmax[i][1] - minmax[i][0])\n```\n\n# Listing 2.5: Function To Normalize\
    \ a Dataset.\n\nWe can tie this function together with the dataset_minmax() function\
    \ and normalize the contrived dataset.\n\n```\n# Find the min and max values for\
    \ each column\ndef dataset_minmax(dataset):\n    minmax = list()\n    for i in\
    \ range(len(dataset[0])):\n        col_values = [row[i] for row in dataset]\n\
    \        value_min = min(col_values)\n        value_max = max(col_values)\n  \
    \      minmax.append([value_min, value_max])\n    return minmax\n\n# Rescale dataset\
    \ columns to the range 0-1\ndef normalize_dataset(dataset, minmax):\n    for row\
    \ in dataset:\n        for i in range(len(row)):\n            row[i] = (row[i]\
    \ - minmax[i][0]) / (minmax[i][1] - minmax[i][0])\n\n# Contrive small dataset\n\
    dataset = [[50, 30], [20, 90]]\nprint(dataset)\n# Calculate min and max for each\
    \ column\nminmax = dataset_minmax(dataset)\nprint(minmax)\n# Normalize columns\n\
    normalize_dataset(dataset, minmax)\nprint(dataset)\n```\n\n# Listing 2.6: Example\
    \ of Normalize the Contrived Dataset."
