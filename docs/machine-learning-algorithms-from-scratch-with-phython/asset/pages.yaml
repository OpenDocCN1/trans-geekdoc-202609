    # A.3  Wine Quality Dataset


    The Wine Quality Dataset involves predicting the quality of white wines on a scale
    given chemical measures of each wine. It is a multiclass classification problem,
    but could also be framed as a regression problem. The number of observations for
    each class is not balanced. There are 4,898 observations with 11 input variables
    and 1 output variable. The variable names are as follows:


    +   1. Fixed acidity.

    +   2. Volatile acidity.

    +   3. Citric acid.

    +   4. Residual sugar.

    +   5. Chlorides.

    +   6. Free sulfur dioxide.

    +   7. Total sulfur dioxide.

    +   8. Density.

    +   9. pH.

    +   10. Sulphates.'
  merge: -1
  img_proc: true
