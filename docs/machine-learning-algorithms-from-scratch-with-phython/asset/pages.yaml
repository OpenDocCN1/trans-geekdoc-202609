    # 7.2.1 Calculate Mean and Variance


    The first step is to estimate the mean and the variance of both the input and
    output variables from the training data. The mean of a list of numbers can be
    calculated as:


    \(mean(x) = \frac{\sum_{i=1}^n x_i}{count(x)}\)


    Below is a function named mean() that implements this behavior for a list of numbers.'
