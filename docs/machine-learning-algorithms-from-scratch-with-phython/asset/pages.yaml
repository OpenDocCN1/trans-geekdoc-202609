  md: '# Chapter 11


    # Classification and Regression Trees


    Decision trees are a powerful prediction method and extremely popular. They are
    popular because the final model is so easy to understand by practitioners and
    domain experts alike. The final decision tree can explain exactly why a specific
    prediction was made, making it very attractive for operational use.


    Decision trees also provide the foundation for more advanced ensemble methods
    such as bagging, random forests and gradient boosting. In this tutorial, you will
    discover how to implement the Classification And Regression Tree algorithm from
    scratch with Python. After completing this tutorial, you will know:


    +   - How to calculate and evaluate candidate split points in a data.

    +   - How to arrange splits into a decision tree structure.

    +   - How to apply the classification and regression tree algorithm to a real
    problem.


    Let''s get started.


    # 11.1 Descriptions


    This section provides a brief introduction to the Classification and Regression
    Tree algorithm and the Banknote dataset used in this tutorial.


    # 11.1.1 Classification and Regression Trees


    Classification and Regression Trees or CART for short is an acronym introduced
    by Leo Breiman to refer to Decision Tree algorithms that can be used for classification
    or regression predictive modeling problems. We will focus on using CART for classification
    in this tutorial. The representation of the CART model is a binary tree. This
    is the same binary tree from algorithms and data structures, nothing too fancy
    (each node can have zero, one or two child nodes).


    A node represents a single input variable (X) and a split point on that variable,
    assuming the variable is numeric. The leaf nodes (also called terminal nodes)
    of the tree contain an output variable (y) which is used to make a prediction.
    Once created, a tree can be navigated with a new row of data following each branch
    with the splits until a final prediction is made.'
