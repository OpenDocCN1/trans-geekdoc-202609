    1.94946466557\n1.55914393855\n0.535628072194\n4.85094018699\n2.59283375995\n4.21422704263\n\
    6.52240998823\n4.985585538245\n```\n\nListing 14.4: Sample Output of Calculating\
    \ Euclidean Distance.\n\nNow it is time to use the distance calculation to locate\
    \ the best matching unit within a dataset.\n\n# 14.2.2 Best Matching Unit\n\n\
    The Best Matching Unit or BMU is the codebook vector that is most similar to a\
    \ new piece of data. To locate the BMU for a new piece of data within a dataset\
    \ we must first calculate the distance between each codebook to the new piece\
    \ of data. We can do this using our distance function above. Once distances are\
    \ calculated, we must sort all of the codebooks by their distance to the new data.\
    \ We can then return the first or most similar codebook vector.\n\nWe can do this\
    \ by keeping track of the distance for each record in the dataset as a tuple,\
    \ sort the list of tuples by the distance (in descending order) and then retrieve\
    \ the BMU. Below is a function named get_best_matching_unit() that implements\
    \ this.\n\n```\n# Locate the best matching unit\ndef get_best_matching_unit(codebooks,\
    \ test_row):\n    distances = list()\n    for codebook in codebooks:\n       \
    \ dist = euclidean_distance(codebook, test_row)\n        distances.append((codebook,\
    \ dist))\n    distances.sort(key=lambda tup: tup[1])\n    return distances[0][0]\n\
    ```"
