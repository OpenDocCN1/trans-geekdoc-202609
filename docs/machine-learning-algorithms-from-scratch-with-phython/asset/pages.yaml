    # ### 3.2.3 How to Choose a Resampling Method


    The gold standard for estimating the performance of machine learning algorithms
    on new data is *k*-fold cross-validation. When well-configured, *k*-fold cross-validation
    gives a robust estimate of performance compared to other methods such as the train
    and test split. The downside of cross-validation is that it can be time-consuming
    to run, requiring *k* different models to be trained and evaluated. This is a
    problem if you have a very large dataset or if you are evaluating a model that
    takes a long time to train.


    The train and test split resampling method is the most widely used. This is because
    it is easy to understand and implement, and because it gives a quick estimate
    of algorithm performance. Only a single model is constructed and evaluated. Although
    the train and test split method can give a noisy or unreliable estimate of the
    performance of a model on new data, this becomes less of a problem if you have
    a very large dataset.


    Large datasets are those in the hundreds of thousands or millions of records,
    large enough that splitting it in half results in two datasets that have nearly
    equivalent statistical properties. In such cases, there may be little need to
    use *k*-fold cross-validation as an evaluation of the algorithm and a train and
    test split may be just as reliable.


    # ## 3.3 Extensions


    In this tutorial, we have looked at the two most common resampling methods. There
    are other methods you may want to investigate and implement as extensions to this
    tutorial. For example:


    +   - **Repeated Train and Test.** This is where the train and test split is used,
    but the process is repeated many times.

    +   - **LOOCV or Leave One Out Cross-Validation.** This is a form of *k*-fold
    cross-validation where the value of *k* is fixed at 1.

    +   - **Stratification.** In classification problems, this is where the balance
    of class values in each group is forced to match the original dataset.'
