  md: '# Chapter 8


    # Multivariate Linear Regression


    The core of many machine learning algorithms is optimization. Optimization algorithms
    are used by machine learning algorithms to find a good set of model parameters
    given a training dataset. The most common optimization algorithm used in machine
    learning is stochastic gradient descent. In this tutorial, you will discover how
    to implement stochastic gradient descent to optimize a linear regression algorithm
    from scratch with Python.


    After completing this tutorial, you will know:


    +   - How to estimate linear regression coefficients using stochastic gradient
    descent.

    +   - How to make predictions for multivariate linear regression.

    +   - How to implement linear regression with stochastic gradient descent to make
    predictions on new data.


    Let''s get started.


    # 8.1 Description


    In this section, we will describe linear regression, the stochastic gradient descent
    technique and the Wine Quality dataset used in this tutorial.


    # 8.1.1 Multivariate Linear Regression


    Linear regression is a technique for predicting a real value. Confusingly, these
    problems where a real value is to be predicted are called regression problems.
    Linear regression is a technique where a straight line is used to model the relationship
    between input and output values. In more than two dimensions, this straight line
    may be thought of as a plane or hyperplane.


    Predictions are made as a combination of the input values to predict the output
    value. Each input attribute (x) is weighted using a coefficient (b), and the goal
    of the learning algorithm is to discover a set of coefficients that results in
    good predictions (y).


    $y = b0 + b1 \times x1 + b2 \times x2 + ...$ (8.1)


    Coefficients can be found using stochastic gradient descent.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 8.1.2 Stochastic Gradient Descent


    Gradient Descent is the process of minimizing a function following the slope or
    gradient of that function. In machine learning, we can use a technique that evaluates
    and updates the coefficients every iteration called stochastic gradient descent
    to minimize the error of a model on our training data.


    The way this optimization algorithm works is that each training instance is shown
    to the model one at a time. The model makes a prediction for a training instance,
    the error is calculated and the model is updated in order to reduce the error
    for the next prediction. This process is repeated for a fixed number of iterations.


    This procedure can be used to find the set of coefficients in a model that result
    in the smallest error for the model on the training data. Each iteration, the
    coefficients (b) in machine learning language are updated using the equation:


    ```

    b = b - learning rate x error x x (8.2)

    ```


    Where b is the coefficient or weight being optimized, learning rate is a learning
    rate that you must configure (e.g. 0.01), error is the prediction error for the
    model on the training data attributed to the weight, and x is the input value.


    # 8.1.3 Wine Quality Dataset


    In this tutorial we will use the Wine Quality Dataset. This dataset involves the
    prediction of white Wine Quality. The baseline RMSE on the problem is approximately
    0.148 quality points. You can learn more about it in Appendix A, Section A.3.
    Download the dataset and save it into your current working directory with the
    filename winequality-white.csv. You must remove the header information from the
    file and convert the semicolon character (;) separator to the comma character
    (,) to meet CSV format.


    # 8.2 Tutorial


    This tutorial is broken down into 3 parts:


    +   1. Making Predictions.

    +   2. Estimating Coefficients.

    +   3. Wine Quality Case Study.


    This will provide the foundation you need to implement and apply linear regression
    with stochastic gradient descent on your own predictive modeling problems.


    # 8.2.1 Making Predictions


    The first step is to develop a function that can make predictions. This will be
    needed both in the evaluation of candidate coefficient values in stochastic gradient
    descent and after the model is finalized and we wish to start making predictions
    on test data or new data. Below is a function named predict() that predicts an
    output value for a row given a set of coefficients.'
