- pgno: 14
  md: '# Chapter 1


    # Load Data From CSV


    You must know how to load data before you can use it to train a machine learning
    model. When starting out, it is a good idea to stick with small in-memory datasets
    using standard file formats like comma separated value (.csv). In this tutorial
    you will discover how to load your data in Python from scratch, including:


    +   - How to load a CSV file.

    +   - How to convert strings from a file to floating point numbers.

    +   - How to convert class values from a file to integers.


    Let’s get started.


    # 1.1  Description


    # 1.1.1  Comma Separated Values


    The standard file format for small datasets is Comma Separated Values or CSV.
    In its simplest form, CSV files are comprised of rows of data. Each row is divided
    into columns using a comma (,). In this tutorial, we are going to practice loading
    two different, standard machine learning datasets in CSV format.


    # 1.1.2  Pima Indians Diabetes Dataset


    In this tutorial we will use the Pima Indians Diabetes Dataset. This dataset involves
    the prediction of the onset of diabetes within 5 years. The baseline performance
    on the problem is approximately 65%. You can learn more about it in Appendix A,
    Section A.4. Download the dataset and save it into your current working directory
    with the filename `pima-indians-diabetes.csv`.


    # 1.1.3  Iris Flower Species Dataset


    In this tutorial we will also use the Iris Flower Species Dataset. This dataset
    involves the prediction of iris flower species. The baseline performance on the
    problem is approximately 26%. You can learn more about it in Appendix A, Section
    A.7. Download the dataset and save it into your current working directory with
    the filename `iris.csv`.'
  merge: -1
  img_proc: true
