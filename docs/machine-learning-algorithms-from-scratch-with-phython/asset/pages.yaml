  md: "# 14.2.4  Ionosphere Case Study\n\nIn this section, we will apply the Learning\
    \ Vector Quantization algorithm to the Ionosphere dataset. The first step is to\
    \ load the dataset and convert the loaded data to numbers that we can use with\
    \ the Euclidean distance calculation. For this we will use the helper function\
    \ `load_csv()` to load the file, `str_column_to_float()` to convert string numbers\
    \ to floats and `str_column_to_int()` to convert the class column to integer values.\n\
    \nWe will evaluate the algorithm using *k*-fold cross-validation with 5 folds.\
    \ This means that \\(\\frac{351}{5}=70.2\\) or just over 70 records will be in\
    \ each fold. We will use the helper functions `evaluate_algorithm()` to evaluate\
    \ the algorithm with cross-validation and `accuracy_metric()` to calculate the\
    \ accuracy of predictions. The complete example is listed below.\n\n```\n```python\n\
    # LVQ for the Ionosphere Dataset\nfrom random import seed\nfrom random import\
    \ randrange\nfrom csv import reader\nfrom math import sqrt\n\n# Load a CSV file\n\
    def load_csv(filename):\n    dataset = list()\n    with open(filename, 'r') as\
    \ file:\n        csv_reader = reader(file)\n        for row in csv_reader:\n \
    \           if not row:\n                continue\n            dataset.append(row)\n\
    \    return dataset\n\n# Convert string column to float\ndef str_column_to_float(dataset,\
    \ column):\n    for row in dataset:\n        row[column] = float(row[column].strip())\n\
    \n# Convert string column to integer\ndef str_column_to_int(dataset, column):\n\
    \    class_values = [row[column] for row in dataset]\n    unique = set(class_values)\n\
    \    lookup = dict()\n    for i, value in enumerate(unique):\n        lookup[value]\
    \ = i\n    for row in dataset:\n        row[column] = lookup[row[column]]\n  \
    \  return lookup\n\n# Split a dataset into k folds\ndef cross_validation_split(dataset,\
    \ n_folds):\n    dataset_split = list()\n    dataset_copy = list(dataset)\n  \
    \  fold_size = int(len(dataset) / n_folds)\n    for _ in range(n_folds):\n   \
    \     fold = list()\n        while len(fold) < fold_size:\n            index =\
    \ randrange(len(dataset_copy))\n            fold.append(dataset_copy.pop(index))\n\
    ```\n```"
