  md: '# Chapter 13


    # *k*-Nearest Neighbors


    A simple but powerful approach for making predictions is to use the most similar
    historical examples to the new data. This is the principle behind the *k*-Nearest
    Neighbors algorithm. In this tutorial you will discover how to implement the *k*-Nearest
    Neighbors algorithm from scratch with Python. After completing this tutorial you
    will know:


    +   - How to calculate the similarity between two pieces of data.

    +   - How to make a prediction using the most similar historical records.

    +   - How to use *k*-Nearest Neighbors for both classification and regression
    problems.


    Let’s get started.


    # 13.1  Description


    This section will provide a brief background on the *k*-Nearest Neighbors algorithm
    that we will implement in this tutorial and the Abalone dataset to which we will
    apply it.


    # 13.1.1  *k*-Nearest Neighbors


    The *k*-Nearest Neighbors algorithm or KNN for short is a very simple technique.
    The entire training dataset is stored. When a prediction is required, the *k*-most
    similar records to a new record from the training dataset are then located. From
    these neighbors, a summarized prediction is made. Similarity between records can
    be measured many different ways. A problem or data-specific method can be used.
    Generally, with tabular data, a good starting point is the Euclidean distance.


    Once the neighbors are discovered, the summary prediction can be made by returning
    the most common outcome or taking the average. As such, KNN can be used for classification
    or regression problems. There is no model to speak of other than holding the entire
    training dataset. Because no work is done until a prediction is required, KNN
    is often referred to as a lazy learning method.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "# ## 13.1.2 Abalone Dataset\n\nIn this tutorial we will use the Abalone Dataset.\
    \ This dataset involves the prediction of the age of abalone. The baseline performance\
    \ on the problem is approximately 16% or an RMSE of approximately 3.2 rings. You\
    \ can learn more about it in Appendix A, Section A.8. Download the dataset and\
    \ save it into your current working directory with the filename abalone.csv.\n\
    \n# ## 13.2 Tutorial\n\nThis tutorial is broken down into 5 parts:\n\n+   1. Euclidean\
    \ Distance.\n+   2. Get Neighbors.\n+   3. Make Predictions.\n+   4. Abalone Case\
    \ Study as Classification.\n+   5. Abalone Case Study as Regression.\n\nThese\
    \ steps will teach you the fundamentals of implementing and applying the k-Nearest\
    \ Neighbors algorithm for classification and regression predictive modeling problems.\n\
    \n# ## 13.2.1 Euclidean Distance\n\nThe first step needed is to calculate the\
    \ distance between two rows in a dataset. Rows of data are mostly made up of numbers\
    \ and an easy way to calculate the distance between two rows or vectors of numbers\
    \ is to draw a straight line. This makes sense in 2D or 3D and scales nicely to\
    \ higher dimensions. We can calculate the straight line distance between two vectors\
    \ using the Euclidean distance measure. It is calculated as the square root of\
    \ the sum of the squared differences between the two vectors.\n\n![](img/eb4f6b07d6861add2c4caceda6f4837f_140_0.png)\n\
    \nWhere x1 is the first row of data, x2 is the second row of data and i is the\
    \ index to a specific column as we sum across all columns. With Euclidean distance,\
    \ the smaller the value, the more similar two records will be. A value of 0 means\
    \ that there is no difference between two records. Below is a function named euclidean_distance()\
    \ that implements this in Python.\n\n```\n# calculate the Euclidean distance between\
    \ two vectors\ndef euclidean_distance(row1, row2):\n    distance = 0.0\n    for\
    \ i in range(len(row1)-1):\n        distance += (row1[i] - row2[i])**2\n    return\
    \ sqrt(distance)\n```\n\nListing 13.1: Function To Calculate the Euclidean Distance\
    \ Between Rows."
