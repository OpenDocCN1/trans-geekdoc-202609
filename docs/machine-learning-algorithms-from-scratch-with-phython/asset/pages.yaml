  md: '# # Appendix B


    # # Python Crash Course


    When getting started in Python you need to know a few key details about the language
    syntax to be able to read and understand Python code. This includes:


    +   - Assignment.

    +   - Flow Control.

    +   - Data Structures.

    +   - Functions.


    We will cover each of these topics in turn with small standalone examples that
    you can type and run. Remember, whitespace has meaning in Python.


    # ## B.1 Assignment


    As a programmer, assignment and types should not be surprising to you.


