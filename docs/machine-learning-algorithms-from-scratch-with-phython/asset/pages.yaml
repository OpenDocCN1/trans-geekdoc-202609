  md: "# ## 1.2 Tutorial\n\nThis tutorial is divided into 3 parts:\n\n+   1. Load\
    \ a file.\n+   2. Load a file and convert Strings to Floats.\n+   3. Load a file\
    \ and convert Strings to Integers.\n\nThese steps will provide the foundations\
    \ you need to handle loading your own data.\n\n# ### 1.2.1 Load CSV File\n\nThe\
    \ first step is to load the CSV file. We will use the csv module that is a part\
    \ of the standard library. The reader() function in the csv module takes a file\
    \ as an argument.\n\nWe will create a function called load_csv() to wrap this\
    \ behavior that will take a filename and return our dataset. We will represent\
    \ the loaded dataset as a list of lists. The first list is a list of observations\
    \ or rows, and the second list is the list of column values for a given row. Below\
    \ is the complete function for loading a CSV file.\n\n```\n```python\n# Load a\
    \ CSV file\ndef load_csv(filename):\n    file = open(filename, \"r\")\n    lines\
    \ = reader(file)\n    dataset = list(lines)\n    return dataset\n```\n```\n\n\
    Listing 1.1: Function for loading a CSV.\n\nWe can test this function by loading\
    \ the Pima Indians dataset. Taking a peek at the first 5 rows of the raw data\
