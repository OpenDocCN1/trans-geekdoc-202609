    # Listing 15.12: Sample Output from Backpropagate Error Through a Network.


    Now let’s use the backpropagation of error to train the network.


    # 15.2.4  Train Network


    The network is trained using stochastic gradient descent. Gradient descent was
    introduced and described in Section 8.1.2. The procedure involves multiple iterations
    of exposing a training dataset to the network and for each row of data forward-propagating
    the inputs, backpropagating the error and updating the network weights. This part
    is broken down into two sections:


    +   1. Update Weights.

    +   2. Train Network.


    # Update Weights


    Once errors are calculated for each neuron in the network via the backpropagation
    method above, they can be used to update weights. Network weights are updated
    as follows:


    $$weight = weight + learning\_rate \times error \times input$$  (15.6)


    Where weight is a given weight, learning_rate is a parameter that you must specify,
    error is the error calculated by the backpropagation procedure for the neuron
    and input is the input value that caused the error. The same procedure can be
    used for updating the bias weight, except there is no input term, or input is
    the fixed value of 1.0.


    Learning rate controls how much to change the weight to correct for the error.
    For example, a value of 0.1 will update the weight 10% of the amount that it possibly
    could be updated. Small learning rates are preferred that cause slower learning
    over a large number of training iterations. This increases the likelihood of the
    network finding a good set of weights across all layers rather than the fastest
    set of weights that minimize error (called premature convergence).


    Below is a function named update_weights() that updates the weights for a network
    given an input row of data, a learning rate and assume that a forward and backward
    propagation have already been performed. Remember that the input for the output
    layer is a collection of outputs from the hidden layer.'
