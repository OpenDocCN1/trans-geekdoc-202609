  md: 'A difficulty of this method is that even though deep trees are constructed,
    the bagged trees that are created are very similar. In turn, the predictions made
    by these trees are also similar, and the high variance we desire among the trees
    trained on different samples of the training dataset is diminished.


    This is because of the greedy algorithm used in the construction of the trees
    selecting the same or similar split points. The tutorial tried to re-inject this
    variance by constraining the sample size used to train each tree. A more robust
    technique is to constrain the features that may be evaluated when creating each
    split point. This is the method used in the Random Forest algorithm.


    # ## 16.3 Extensions


