  md: "mean value. We can then make bootstrap samples of the original dataset, calculate\
    \ the mean, and repeat this process until we have a list of means. Taking the\
    \ average of these sample means should give us a robust estimate of the mean of\
    \ the entire dataset.\n\nThe complete example is listed below. Each bootstrap\
    \ sample is created as a 10% sample of the original 20 observation dataset (or\
    \ 2 observations). We then experiment by creating 1, 10, 100 bootstrap samples\
    \ of the original dataset, calculate their mean value, then average all of those\
    \ estimated mean values.\n\n```\n```python\n# Example of subsampling a dataste\n\
    from random import seed\nfrom random import randrange\n\n# Create a random subsample\
    \ from the dataset with replacement\ndef subsample(dataset, ratio=1.0):\n    sample\
    \ = list()\n    n_sample = round(len(dataset) * ratio)\n    while len(sample)\
    \ < n_sample:\n        index = randrange(len(dataset))\n        sample.append(dataset[index])\n\
    \    return sample\n\n# Calculate the mean of a list of numbers\ndef mean(numbers):\n\
    \    return sum(numbers) / float(len(numbers))\n\n# Test subsampling a dataset\n\
    seed(1)\n# True mean\ndataset = [[randrange(10)] for i in range(20)]\nprint('True\
    \ Mean: %.3f' % mean([row[0] for row in dataset]))\n# Estimated means\nratio =\
    \ 0.10\nfor size in [1, 10, 100]:\n    sample_means = list()\n    for i in range(size):\n\
    \        sample = subsample(dataset, ratio)\n        sample_mean = mean([row[0]\
    \ for row in sample])\n        sample_means.append(sample_mean)\n    print('Samples=%d,\
    \ Estimated Mean: %.3f' % (size, mean(sample_means)))\n```\n```\n\n# Listing 16.2:\
    \ Example of Subsampling a Dataset.\n\nRunning the example prints the original\
