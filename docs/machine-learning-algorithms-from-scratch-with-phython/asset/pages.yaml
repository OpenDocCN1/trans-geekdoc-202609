  md: '# Chapter 3


    # Algorithm Evaluation Methods


    The goal of predictive modeling is to create models that make good predictions
    on new data. We don’t have access to this new data at the time of training, so
    we must use statistical methods to estimate the performance of a model on new
    data. This class of methods is called resampling methods, as they are resampling
    your available training data. In this tutorial, you will discover how to implement
    resampling methods from scratch in Python. After completing this tutorial, you
    will know:


    +   - How to implement a train and test split of your data.

    +   - How to implement a *k*-fold cross-validation split of your data.


    Let’s get started.


    # 3.1  Description


    The goal of resampling methods is to make the best use of your training data in
    order to accurately estimate the performance of a model on new unseen data. Accurate
    estimates of performance can then be used to help you choose which set of model
    parameters to use or which model to select.


    Once you have chosen a model, you can train for final model on the entire training
    dataset and start using it to make predictions. There are two common resampling
    methods that you can use:


    +   - A train and test split of your data.

    +   - *k*-fold cross-validation.


    In this tutorial, we will look at using each and when to use one method over the
    other.


    # 3.2  Tutorial


    This tutorial is divided into 3 parts:


    +   1. Train and Test Split.'
  merge: -1
  img_proc: true
