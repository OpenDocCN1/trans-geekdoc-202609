  md: "These tests show that there is great opportunity to refine the implementation\
    \ to avoid unnecessary splits. This is left as an extension. Now that we can create\
    \ a decision tree, let's see how we can use it to make predictions on new data.\n\
    \n# 11.2.4 Make a Prediction\n\nMaking predictions with a decision tree involves\
    \ navigating the tree with the specifically provided row of data. Again, we can\
    \ implement this using a recursive function, where the same prediction routine\
    \ is called again with the left or the right child nodes, depending on how the\
    \ split affects the provided data. We must check if a child node is either a terminal\
    \ value to be returned as the prediction, or if it is a dictionary node containing\
    \ another level of the tree to be considered.\n\nBelow is the predict() function\
    \ that implements this procedure. You can see how the index and value in a given\
    \ node is used to evaluate whether the row of provided data falls on the left\
    \ or the right of the split.\n\n```\n```python\n# Make a prediction with a decision\
    \ tree\ndef predict(node, row):\n    if row[node['index']] < node['value']:\n\
    \        if isinstance(node['left'], dict):\n            return predict(node['left'],\
    \ row)\n        else:\n            return node['left']\n    else:\n        if\
    \ isinstance(node['right'], dict):\n            return predict(node['right'],\
    \ row)\n        else:\n            return node['right']\n```\n```\n\nListing 11.16:\
    \ Function To Make a Prediction With a Decision Tree.\n\nWe can use our contrived\
    \ dataset to test this function. Below is an example that uses a hard-coded decision\
    \ tree with a single node that best splits the data (a decision stump). The example\
    \ makes a prediction for each row in the dataset.\n\n```\n```python\n# Example\
    \ of making predictions\n\n# Make a prediction with a decision tree\ndef predict(node,\
    \ row):\n    if row[node['index']] < node['value']:\n        if isinstance(node['left'],\
    \ dict):\n            return predict(node['left'], row)\n        else:\n     \
    \       return node['left']\n    else:\n        if isinstance(node['right'], dict):\n\
    \            return predict(node['right'], row)\n        else:\n            return\
