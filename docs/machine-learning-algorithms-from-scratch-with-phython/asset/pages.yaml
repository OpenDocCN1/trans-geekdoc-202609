  md: '# 1.3 Extensions


    You learned how to load CSV files and perform basic data conversions. Data loading
    can be a difficult task given the variety of data cleaning and conversion that
    may be required from problem to problem. There are many extensions that you could
    make to make these examples more robust to new and different data files. Below
    are just a few ideas you can consider researching and implementing yourself:


    +   - Detect and remove empty lines at the top or bottom of the file.

    +   - Detect and handle missing values in a column.

    +   - Detect and handle rows that do not match expectations for the rest of the
    file.

    +   - Support for other delimiters such as pipe (|) or white space.

    +   - Support more efficient data structures such as arrays.


    Two libraries you may wish to use in practice for loading CSV data are NumPy and
    Pandas. NumPy offers the `loadtxt()` function for loading data files as NumPy
    arrays. Pandas offers the `read_csv()` function that offers a lot of flexibility
    regarding data types, file headers and more.


    # 1.4 Review


    In this tutorial, you discovered how you can load your machine learning data from
    scratch in Python. Specifically, you learned:


    +   - How to load a CSV file into memory.

    +   - How to convert string values to floating point values.

    +   - How to convert a string class value into an integer encoding.


    # 1.4.1 Further Reading


    +   - Section 13.1, CSV File Reading and Writing, *The Python Standard Library*
    https://docs.python.org/2/library/csv.html

    +   - CSV file format in RFC 4180: Common Format and MIME Type for Comma-Separated
    Values (CSV) https://tools.ietf.org/html/rfc4180


    # 1.4.2 Next


    In the next tutorial, you will discover how to rescale your machine learning data
    for algorithms that weight input values.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Chapter 2


    # Scale Machine Learning Data


    Many machine learning algorithms expect data to be scaled consistently. There
    are two popular methods that you should consider when scaling your data for machine
    learning. In this tutorial, you will discover how you can rescale your data for
    machine learning. After reading this tutorial you will know:


    +   - How to normalize your data from scratch.

    +   - How to standardize your data from scratch.

    +   - When to normalize as opposed to standardize data.


    Let''s get started.


    # 2.1 Description


    Many machine learning algorithms expect the scale of the input and even the output
    data to be equivalent. It can help in methods that weight inputs in order to make
    a prediction, such as in linear regression and logistic regression. It is practically
    required in methods that combine weighted inputs in complex ways such as in artificial
    neural networks and deep learning.


    # 2.1.1 Pima Indians Diabetes Dataset


    In this tutorial we will use the Pima Indians Diabetes Dataset. This dataset involves
    the prediction of the onset of diabetes within 5 years. The baseline performance
    on the problem is approximately 65%. You can learn more about it in Appendix A,
    Section A.4. Download the dataset and save it into your current working directory
    with the filename pima-indians-diabetes.csv.


    # 2.2 Tutorial


    This tutorial is divided into 3 parts:


    +   1. Normalize Data.

    +   2. Standardize Data.'
