    \ Contrived Dataset.\n\nThis is our first step; next we need to put these values\
    \ to use in calculating the covariance.\n\n# 7.2.2 Calculate Covariance\n\nThe\
    \ covariance of two groups of numbers describes how those numbers change together.\
    \ Covariance is a generalization of correlation. Correlation describes the relationship\
    \ between two groups of numbers, whereas covariance can describe the relationship\
    \ between two or more groups of numbers. Additionally, covariance can be normalized\
    \ to produce a correlation value. Nevertheless, we can calculate the covariance\
    \ between two variables as follows:\n\n\\(covariance = \\sum_{i=1}^{n} ((x_i -\
    \ mean(x)) \\times (y_i - mean(y)))\\) (7.5)\n\nBelow is a function named covariance()\
    \ that implements this statistic. It builds upon the previous step and takes the\
    \ lists of x and y values as well as the mean of these values as arguments.\n\n\
    ```\n# Calculate covariance between x and y\ndef covariance(x, mean_x, y, mean_y):\n\
    \    covar = 0.0\n    for i in range(len(x)):\n        covar += (x[i] - mean_x)\
    \ * (y[i] - mean_y)\n    return covar\n```\n\nListing 7.6: Function To Calculate\
