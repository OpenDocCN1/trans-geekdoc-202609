    # A.2  Swedish Auto Insurance Dataset


    The Swedish Auto Insurance Dataset involves predicting the total payment for all
    claims in thousands of Swedish Kronor, given the total number of claims. It is
    a regression problem. It is comprised of 63 observations with 1 input variable
    and 1 output variable. The variable names are as follows:


    +   1. Number of claims.

    +   2. Total payment for all claims in thousands of Swedish Kronor.


    The baseline performance of predicting the mean value is an RMSE of approximately
    72.251 thousand Kronor. A sample of the first 5 rows is listed below.


