  md: '# Chapter 10


    # Perceptron


    The Perceptron algorithm is the simplest type of artificial neural network. It
    is a model of a single neuron that can be used for two-class classification problems
    and provides the foundation for later developing much larger networks. In this
    tutorial, you will discover how to implement the Perceptron algorithm from scratch
    with Python. After completing this tutorial, you will know:


    +   - How to train the network weights for the Perceptron.

    +   - How to make predictions with the Perceptron.

    +   - How to implement the Perceptron algorithm for a real-world classification
    problem.


    Let''s get started.


    # 10.1 Description


    This section provides a brief introduction to the Perceptron algorithm and the
    Sonar dataset to which we will later apply it.


    # 10.1.1 Perceptron Algorithm


    The Perceptron is inspired by the information processing of a single neural cell
    called a neuron. A neuron accepts input signals via its dendrites, which pass
    the electrical signal down to the cell body. In a similar way, the Perceptron
    receives input signals from examples of training data that we weight and combined
    in a linear equation called the activation.


    ```

    activation = bias + \sum_{i=1}^{n} weight_i \times x_i

    ```


    The activation is then transformed into an output value or prediction using a
    transfer function, such as the step transfer function.


    ```

    prediction = 1.0 IF activation >= 0.0 ELSE 0.0

    ```


    In this way, the Perceptron is a classification algorithm for problems with two
    classes (0 and 1) where a linear equation (like a line or hyperplane) can be used
    to separate the two'
  merge: -1
  img_proc: true
- pgno: 93
  md: "classes. It is closely related to linear regression and logistic regression\
    \ that make predictions in a similar way (e.g. a weighted sum of inputs). The\
    \ weights of the Perceptron algorithm must be estimated from your training data\
    \ using stochastic gradient descent.\n\n# 10.1.2 Stochastic Gradient Descent\n\
    \nThe Perceptron algorithm uses gradient descent to update the weights. Gradient\
    \ descent was introduced and described in Section 8.1.2. Each iteration of gradient\
    \ descent, the weights (**w**) are updated using the equation:\n\n$w = w + \\\
    text{learning rate} \\times (expected - predicted) \\times x$ (10.3)\n\nWhere\
    \ **w** is weight being optimized, **learning rate** is a learning rate that you\
    \ must configure (e.g. 0.01), (**expected** - **predicted**) is the prediction\
    \ error for the model on the training data attributed to the weight and **x**\
    \ is the input value.\n\n# 10.1.3 Sonar Dataset\n\nIn this tutorial we will use\
    \ the Sonar Dataset. This dataset involves the discrimination between mines and\
    \ rocks. The baseline performance on the problem is approximately 53%. You can\
    \ learn more about it in Appendix A, Section A.5. Download the dataset and save\
    \ it into your current working directory with the filename sonar.all-data.csv.\n\
    \n# 10.2 Tutorial\n\nThis tutorial is broken down into 3 parts:\n\n+   1. Making\
    \ Predictions.\n+   2. Training Network Weights.\n+   3. Sonar Case Study.\n\n\
    These steps will give you the foundation to implement and apply the Perceptron\
    \ algorithm to your own classification predictive modeling problems.\n\n# 10.2.1\
    \ Making Predictions\n\nThe first step is to develop a function that can make\
    \ predictions. This will be needed both in the evaluation of candidate weight\
    \ values in stochastic gradient descent, and after the model is finalized and\
    \ we wish to start making predictions on test data or new data. Below is a function\
    \ named `predict()` that predicts an output value for a row given a set of weights.\
    \ The first weight is always the bias as it is standalone and not responsible\
    \ for a specific input value.\n\n```\n# Make a prediction with weights\ndef predict(row,\
    \ weights):\n    activation = weights[0]\n    for i in range(len(row)-1):\n  \
    \      activation += weights[i + 1] * row[i]\n```"
