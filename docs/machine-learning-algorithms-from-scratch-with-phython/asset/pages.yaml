  md: "# 3. When to Normalize and Standardize.\n\nThese steps will provide the foundations\
    \ you need to handle scaling your own data.\n\n# 2.2.1 Normalize Data\n\nNormalization\
    \ can refer to different techniques depending on context. Here, we use normalization\
    \ to refer to rescaling an input variable to the range between 0 and 1. Normalization\
    \ requires that you know the minimum and maximum values for each attribute.\n\n\
    This can be estimated from training data or specified directly if you have deep\
    \ knowledge of the problem domain. You can easily estimate the minimum and maximum\
    \ values for each attribute in a dataset by enumerating through the values. The\
    \ snippet of code below defines the `dataset_minmax()` function that calculates\
    \ the min and max value for each attribute in a dataset, then returns an array\
    \ of these minimum and maximum values.\n\n```\n```python\n# Find the min and max\
    \ values for each column\ndef dataset_minmax(dataset):\n    minmax = list()\n\
    \    for i in range(len(dataset[0])):\n        col_values = [row[i] for row in\
    \ dataset]\n        value_min = min(col_values)\n        value_max = max(col_values)\n\
    \        minmax.append([value_min, value_max])\n    return minmax\n```\n```\n\n\
    Listing 2.1: Function To Calculate the Min and Max Values For a Dataset.\n\nWe\
    \ can contrive a small dataset for testing as follows:\n\n```\n```\nx1 x2\n50\
    \ 30\n20 90\n```\n```\n\nListing 2.2: Small Contrived Dataset.\n\nWith this contrived\
    \ dataset, we can test our function for calculating the min and max for each column.\n\
    \n```\n```python\n# Find the min and max values for each column\ndef dataset_minmax(dataset):\n\
    \    minmax = list()\n    for i in range(len(dataset[0])):\n        col_values\
    \ = [row[i] for row in dataset]\n        value_min = min(col_values)\n       \
    \ value_max = max(col_values)\n        minmax.append([value_min, value_max])\n\
    \    return minmax\n\n# Contrive small dataset\ndataset = [[50, 30], [20, 90]]\n\
    print(dataset)\n# Calculate min and max for each column\nminmax = dataset_minmax(dataset)\n\
    print(minmax)\n```\n```\n\nListing 2.3: Example Calculating the Min and Max Values\
    \ of a Contrived Dataset."
