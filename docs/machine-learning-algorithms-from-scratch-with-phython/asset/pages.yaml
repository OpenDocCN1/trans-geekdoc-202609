    \ + l_rate * error\n            for i in range(len(row)-1):\n                weights[i\
    \ + 1] = weights[i + 1] + l_rate * error * row[i]\n    return weights\n```\n\n\
    # Listing 18.3: Functions To Train and Make Predictions with a Perceptron Model.\n\
    \nThe perceptron_model() function specifies both a learning rate and number of\
    \ training epochs as default parameters. Again, these parameters were chosen with\
    \ a little bit of trial and error, but were not tuned on the dataset. We now have\
    \ implementations for both submodels; let's look at implementing the aggregator\
    \ model. For more on the Perceptron algorithm see Chapter 10.\n\n# Aggregator\
    \ Model: Logistic Regression\n\nLike the Perceptron algorithm, Logistic Regression\
    \ uses a set of weights, called coefficients, as the representation of the model.\
    \ And like the Perceptron algorithm, the coefficients are learned by iteratively\
    \ making predictions on the training data and updating them.\n\nBelow are the\
    \ helper functions for implementing the logistic regression algorithm. The logistic_regression_model()\
    \ function is used to train the coefficients on the training dataset and logistic_regression_predict()\
    \ is used to make a prediction for a row of data.\n\n```\n# Make a prediction\
    \ with coefficients\ndef logistic_regression_predict(model, row):\n    yhat =\
    \ model[0]\n    for i in range(len(row)-1):\n        yhat += model[i + 1] * row[i]\n\
    \    return 1.0 / (1.0 + exp(-yhat))\n\n# Estimate logistic regression coefficients\
    \ using stochastic gradient descent\ndef logistic_regression_model(train, l_rate=0.01,\
    \ n_epoch=5000):\n    coef = [0.0 for i in range(len(train[0]))]\n    for epoch\
    \ in range(n_epoch):\n        for row in train:\n            yhat = logistic_regression_predict(coef,\
    \ row)\n            error = row[-1] - yhat\n            coef[0] = coef[0] + l_rate\
    \ * error * yhat * (1.0 - yhat)\n            for i in range(len(row)-1):\n   \
    \             coef[i + 1] = coef[i + 1] + l_rate * error * yhat * (1.0 - yhat)\
    \ * row[i]\n    return coef\n```\n\n# Listing 18.4: Functions To Train and Make\
    \ Predictions with a Logistic Regression Model."
