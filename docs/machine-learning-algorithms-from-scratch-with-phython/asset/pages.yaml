  md: '# # Chapter 14


    # # Learning Vector Quantization


    A limitation of k-Nearest Neighbors is that you must keep a large database of
    training examples in order to make predictions. The Learning Vector Quantization
    algorithm addresses this by learning a much smaller subset of patterns that best
    represent the training data. In this tutorial, you will discover how to implement
    the Learning Vector Quantization algorithm from scratch with Python. After completing
    this tutorial, you will know:


    +   - How to learn a set of codebook vectors from a training data set.

    +   - How to make predictions using learned codebook vectors.

    +   - How to apply Learning Vector Quantization to a real predictive modeling
    problem.


    Let''s get started.


    # ## 14.1 Description


    This section provides a brief introduction to the Learning Vector Quantization
    algorithm and the Ionosphere classification problem that we will use in this tutorial


    # ### 14.1.1 Learning Vector Quantization


    The Learning Vector Quantization (LVQ) algorithm is a lot like k-Nearest Neighbors.
    Predictions are made by finding the best match among a library of patterns. The
    difference is that the library of patterns is learned from training data, rather
    than using the training patterns themselves.


    The library of patterns is called codebook vectors and each pattern is called
    a codebook. The codebook vectors are initialized to randomly selected values from
    the training dataset. Then, over a number of epochs, they are adapted to best
    summarize the training data using a learning algorithm. The learning algorithm
    shows one training record at a time, finds the best matching unit among the codebook
    vectors and moves it closer to the training record if they have the same class,
    or further away if they have different classes.


    Once prepared, the codebook vectors are used to make predictions using the k-Nearest
    Neighbors algorithm where k=1. The algorithm was developed for classification
    predictive modeling problems, but can be adapted for use with regression problems.'
  merge: -1
  img_proc: true
- pgno: 154
  md: "# ### 14.1.2 Ionosphere Dataset\n\nIn this tutorial we will use the Ionosphere\
    \ Dataset. This dataset involves the prediction of structure in the atmosphere.\
    \ The baseline performance on the problem is approximately 64%. You can learn\
    \ more about it in Appendix A, Section A.9. Download the dataset and save it into\
    \ your current working directory with the filename ionosphere.csv.\n\n# ## 14.2\
    \ Tutorial\n\nThis tutorial is broken down into 4 parts:\n\n+   1. Euclidean Distance.\n\
    +   2. Best Matching Unit.\n+   3. Training Codebook Vectors.\n+   4. Ionosphere\
    \ Case Study.\n\nThese steps will lay the foundation for implementing and applying\
    \ the LVQ algorithm to your own predictive modeling problems.\n\n# ### 14.2.1\
    \ Euclidean Distance\n\nThe first step needed is to calculate the distance between\
    \ two rows in a dataset. We will use Euclidean distance, first introduced in Chapter\
    \ 13. The calculation of Euclidean distance can be summarized as:\n\n\\( distance\
    \ = \\sqrt{\\sum_{i=1}^{n}(x1_i - x2_i)^2} \\) (14.1)\n\nWhere x1 is the first\
    \ row of data, x2 is the second row of data and i is the index for a specific\
    \ column as we sum across all columns. With Euclidean distance, the smaller the\
    \ value, the more similar two records will be. A value of 0 means that there is\
    \ no difference between two records. Below is a function named euclidean_distance()\
    \ that implements this in Python.\n\n```\n# calculate the Euclidean distance between\
    \ two vectors\ndef euclidean_distance(row1, row2):\n    distance = 0.0\n    for\
    \ i in range(len(row1)-1):\n        distance += (row1[i] - row2[i])**2\n    return\
    \ sqr(distance)\n```\n\nListing 14.1: Function To Calculate the Euclidean Distance\
    \ Between Rows.\n\nYou can see that the function assumes that the last column\
    \ in each row is an output value which is ignored from the distance calculation.\
    \ We can test this distance function with a small contrived classification dataset.\
    \ We will use this dataset a few times as we construct the elements needed for\
    \ the LVQ algorithm."
