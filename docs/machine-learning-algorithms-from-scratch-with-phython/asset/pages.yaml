  md: "This is an exhaustive and greedy algorithm. We will use a dictionary to represent\
    \ a node in the decision tree as we can store data by name. When selecting the\
    \ best split and using it as a new node for the tree we will store the index of\
    \ the chosen attribute, the value of that attribute by which to split and the\
    \ two groups of data split by the chosen split point.\n\nEach group of data is\
    \ its own small dataset of just those rows assigned to the left or right group\
    \ by the splitting process. You can imagine how we might split each group again,\
    \ recursively as we build out our decision tree. Below is a function named `get_split()`\
    \ that implements this procedure. You can see that it iterates over each attribute\
    \ (except the class value) and then each value for that attribute, splitting and\
    \ evaluating splits as it goes. The best split is recorded and then returned after\
    \ all checks are complete.\n\n```\n# Select the best split point for a dataset\n\
    def get_split(dataset):\n    class_values = list(set(row[-1] for row in dataset))\n\
    \    b_index, b_value, b_score, b_groups = 999, 999, 999, None\n    for index\
    \ in range(len(dataset[0])-1):\n        for row in dataset:\n            groups\
    \ = test_split(index, row[index], dataset)\n            gini = gini_index(groups,\
    \ class_values)\n            if gini < b_score:\n                b_index, b_value,\
    \ b_score, b_groups = index, row[index], gini, groups\n    return {'index':b_index,\
    \ 'value':b_value, 'groups':b_groups}\n```\n\n# Listing 11.5: Function To Find\
    \ the Best Split Point in a Dataset.\n\nWe can contrive a small dataset to test\
