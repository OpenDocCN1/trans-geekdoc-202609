  md: "# 7.2.4 Make Predictions\n\nThe simple linear regression model is a line defined\
    \ by coefficients estimated from training data. Once the coefficients are estimated,\
    \ we can use them to make predictions. The equation to make predictions with a\
    \ simple linear regression model is as follows:\n\n```\ny = b0 + b1 x\n```\n\n\
    Below is a function named simple_linear_regression() that implements the prediction\
    \ equation to make predictions on a test dataset. It also ties together the estimation\
    \ of the coefficients on training data from the steps above. The coefficients\
    \ prepared from the training data are used to make predictions on the test data,\
    \ which are then returned.\n\n```\ndef simple_linear_regression(train, test):\n\
    \    predictions = list()\n    b0, b1 = coefficients(train)\n    for row in test:\n\
    \        yhat = b0 + b1 * row[0]\n        predictions.append(yhat)\n    return\
    \ predictions\n```\n\nListing 7.12: Function To Run Simple Linear Regression.\n\
    \nLet's pull together everything we have learned and make predictions for our\
    \ simple contrived dataset. As part of this example, we will also add in a function\
    \ to manage the evaluation of the predictions called evaluate_algorithm() and\
    \ another function to estimate the Root Mean Squared Error of the predictions\
    \ called rmse_metric(). The full example is listed below.\n\n```\n# Example of\
    \ Standalone Simple Linear Regression\nfrom math import sqrt\n\n# Calculate root\
    \ mean squared error\ndef rmse_metric(actual, predicted):\n    sum_error = 0.0\n\
    \    for i in range(len(actual)):\n        prediction_error = predicted[i] - actual[i]\n\
    \        sum_error += (prediction_error ** 2)\n    mean_error = sum_error / float(len(actual))\n\
    \    return sqrt(mean_error)\n\n# Evaluate regression algorithm on training dataset\n\
    def evaluate_algorithm(dataset, algorithm):\n    test_set = list()\n    for row\
    \ in dataset:\n        row_copy = list(row)\n        row_copy[-1] = None\n   \
    \     test_set.append(row_copy)\n    predicted = algorithm(dataset, test_set)\n\
    \    print(predicted)\n    actual = [row[-1] for row in dataset]\n    rmse = rmse_metric(actual,\
    \ predicted)\n    return rmse\n\n# Calculate the mean value of a list of numbers\n\
    def mean(values):\n    return sum(values) / float(len(values))\n```"
