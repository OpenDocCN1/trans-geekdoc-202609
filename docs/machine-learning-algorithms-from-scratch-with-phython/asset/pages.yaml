    results.

    +   - **Bag Another Algorithm.** Other algorithms can be used with bagging. For
    example, a *k*-nearest neighbor algorithm with a low value of *k* will have a
    high variance and is a good candidate for bagging.

    +   - **Regression Problems.** Bagging can be used with regression trees. Instead
    of predicting the most common class value from the set of predictions, you can
    return the average of the predictions from the bagged trees. Experiment on regression
    problems.


