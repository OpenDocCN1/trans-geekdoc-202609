    \ Sample Output Summarizing a Dataset by Class.\n\nThere is one more piece we\
    \ need before we start calculating probabilities.\n\n# 12.2.4 Gaussian Probability\
    \ Density Function\n\nCalculating the probability or likelihood of observing a\
    \ given real-value like X1 is difficult. One way we can do this is to assume that\
    \ X1 values are drawn from a distribution, such as a bell curve or Gaussian distribution.\n\
    \nA Gaussian distribution can be summarized using only two numbers: the mean and\
    \ the standard deviation. Therefore, with a little math, we can estimate the probability\
    \ of a given value. This piece of math is called a Gaussian Probability Distribution\
    \ Function (or Gaussian PDF) and can be calculated as:\n\n$$probability(x)=\\\
    frac{1}{\\sqrt{2\\times PI\\times standard\\_deviation}}\\times e^{-\\frac{(x-mean(x))^2}{2\\\
    times standard\\_deviation^2}} \\tag{12.4}$$\n\nBelow is a function that implements\
    \ this. I tried to split it up to make it more readable.\n\n```\n```python\n#\
    \ Calculate the Gaussian probability distribution function for x\ndef calculate_probability(x,\
    \ mean, stdev):\n    exponent = exp(-((x-mean)**2 / (2 * stdev**2 )))\n    return\
    \ (1 / (sqrt(2 * pi) * stdev)) * exponent\n```\n```\n\nListing 12.13: Function\
