    \ load empty lines from data files and add them\nto our list of rows. We can overcome\
    \ this by adding rows of data one at a time to our dataset\nand skipping empty\
    \ rows. Below is the updated example with this new improved version of the\n`load_csv()`\
    \ function.\n\n```\n```python\n# Example of loading Pima Indians CSV dataset\n\
