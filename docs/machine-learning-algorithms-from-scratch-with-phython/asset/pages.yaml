    such as Manhattan distance and Minkowski distance.

    +   - **Multiple-Pass LVQ.** The codebook vectors may be updated by multiple training
    runs. Experiment by training with large learning rates followed by a large number
    of epochs with smaller learning rates to fine tune the codebooks.

    +   - **Update More BMUs.** Experiment with selecting more than one BMU when training
    and pushing and pulling them away from the training data.

