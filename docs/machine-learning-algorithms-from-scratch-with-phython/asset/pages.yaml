  md: "```\n```python\n# Update network weights with error\ndef update_weights(network,\
    \ row, l_rate):\n    for i in range(len(network)):\n        inputs = row[:-1]\n\
    \        if i != 0:\n            inputs = [neuron['output'] for neuron in network[i\
    \ - 1]]\n        for neuron in network[i]:\n            for j in range(len(inputs)):\n\
    \                neuron['weights'][j] += l_rate * neuron['delta'] * inputs[j]\n\
    \            neuron['weights'][-1] += l_rate * neuron['delta']\n```\n```\n\nListing\
    \ 15.13: Function To Update Weights in a Network.\n\nNow that we know how to update\
    \ network weights, let’s see how we can do it repeatedly.\n\n# Train Network\n\
    \nAs mentioned, the network is updated using stochastic gradient descent. This\
    \ involves first looping for a fixed number of epochs and within each epoch updating\
    \ the network for each row in the training dataset.\n\nBecause updates are made\
    \ for each training pattern, this type of learning is called online learning.\
    \ If errors were accumulated across an epoch before updating the weights, this\
    \ is called batch learning or batch gradient descent. Below is a function that\
    \ implements the training of an already initialized neural network with a given\
    \ training dataset, learning rate, fixed number of epochs and an expected number\
    \ of output values.\n\nThe expected number of output values is used to transform\
    \ class values in the training data into a one hot encoding. That is a binary\
    \ vector with one column for each class value to match the output of the network.\
    \ This is required to calculate the error for the output layer. You can also see\
    \ that the sum squared error between the expected output and the network output\
    \ is accumulated each epoch and printed. This is helpful to create a trace of\
    \ how much the network is learning and improving each epoch.\n\n```\n```python\n\
    # Train a network for a fixed number of epochs\ndef train_network(network, train,\
    \ l_rate, n_epoch, n_outputs):\n    for epoch in range(n_epoch):\n        sum_error\
