- pgno: 49
  md: "# Listing 5.4: Function To Make Zero Rule Classification Predictions.\n\nThe\
    \ function makes use of the max() function with the key attribute, which is a\
    \ little clever. Given a list of class values observed in the training data, the\
    \ max() function takes a set of unique class values and calls the count on the\
    \ list of class values for each class value in the set. The result is that it\
    \ returns the class value that has the highest count of observed values in the\
    \ list of class values observed in the training dataset.\n\nIf all class values\
    \ have the same count, then we will choose the first class value observed in the\
    \ dataset. Once we select a class value, it is used to make a prediction for each\
    \ row in the test dataset. Below is a worked example with a contrived dataset\
    \ that contains 4 examples of class 0 and 2 examples of class 1. We would expect\
    \ the algorithm to choose the class value 0 as the prediction for each row in\
    \ the test dataset.\n\n```\n# Example of Zero Rule Classification Predictions\n\
    from random import seed\n\n# zero rule algorithm for classification\ndef zero_rule_algorithm_classification(train,\
    \ test):\n    output_values = [row[-1] for row in train]\n    prediction = max(set(output_values),\
    \ key=output_values.count)\n    predicted = [prediction for i in range(len(test))]\n\
    \    return predicted\n\nseed(1)\ntrain = [['0'], ['0'], ['0'], ['0'], ['1'],\
    \ ['1']]\ntest = [[None], [None], [None], [None]]\npredictions = zero_rule_algorithm_classification(train,\
    \ test)\nprint(predictions)\n```\n\n# Listing 5.5: Example of Zero Rule Classification\
    \ Predictions.\n\nRunning this example makes the predictions and prints them to\
    \ screen. As expected, the class value of 0 was chosen and predicted.\n\n```\n\
    ['0', '0', '0', '0']\n```\n\n# Listing 5.6: Example Output From Making Zero Rule\
    \ Classification Predictions.\n\n# Regression\n\nRegression problems require the\
    \ prediction of a real value. A good default prediction for real values is to\
    \ predict the central tendency. This could be the mean or the median. A good default\
    \ is to use the mean (also called the average) of the output value observed in\
    \ the training data.\n\nThis is likely to have a lower error than random prediction\
    \ which will return any observed output value. Below is a function to do that\
    \ named zero_rule_algorithm_regression(). It works by calculating the mean value\
    \ for the observed output values.\n\nmean = \\frac{\\sum_{i=1}^n value_i}{count(values)}\
    \ (5.2)\n\nOnce calculated, the mean is then predicted for each row in the training\
    \ data."
