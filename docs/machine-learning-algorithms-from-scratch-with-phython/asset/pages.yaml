  md: '# Chapter 6


    # Algorithm Test Harnesses


    We cannot know which algorithm will be best for a given problem. Therefore, we
    need to design a test harness that we can use to evaluate different machine learning
    algorithms. In this tutorial, you will discover how to develop a machine learning
    algorithm test harness from scratch in Python. After completing this tutorial,
    you will know:


    +   - How to implement a train-test algorithm test harness.

    +   - How to implement a k-fold cross-validation algorithm test harness.


    Let''s get started.


    # 6.1 Description


    A test harness provides a consistent way to evaluate machine learning algorithms
    on a dataset. It involves 3 elements:


    +   1. The resampling method to split-up the dataset.

    +   2. The machine learning algorithm to evaluate.

    +   3. The performance measure by which to evaluate predictions.


    The loading and preparation of a dataset is a prerequisite step that must have
    been completed prior to using the test harness. The test harness must allow for
    different machine learning algorithms to be evaluated, whilst the dataset, resampling
    method and performance measures are kept constant. In this tutorial, we are going
    to demonstrate the test harnesses with a real dataset.


    # 6.1.1 Pima Indians Diabetes Dataset


    In this tutorial we will use the Pima Indians Diabetes Dataset. This dataset involves
    the prediction of the onset of diabetes within 5 years. The baseline performance
    on the problem is approximately 65%. You can learn more about it in Appendix A,
    Section A.4. Download the dataset and save it into your current working directory
    with the filename pima-indians-diabetes.csv.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "# 6.2 Tutorial\n\nThis tutorial is broken down into two main sections:\n\n\
    +   1. Train-Test Algorithm Test Harness.\n+   2. Cross-Validation Algorithm Test\
    \ Harness.\n\nThese test harnesses will give you the foundation that you need\
    \ to evaluate a suite of machine learning algorithms on a given predictive modeling\
    \ problem.\n\n# 6.2.1 Train-Test Algorithm Test Harness\n\nThe train-test split\
    \ is a simple resampling method that can be used to evaluate a machine learning\
    \ algorithm. As such, it is a good starting point for developing a test harness.\
    \ We can assume the prior development of a function to split a dataset into train\
    \ and test sets and a function to evaluate the accuracy of a set of predictions.\n\
    \nWe need a function that can take a dataset and an algorithm and return a performance\
    \ score. Below is a function named evaluate_algorithm() that achieves this. It\
    \ takes 3 fixed arguments including the dataset, the algorithm function and the\
    \ split percentage for the train-test split.\n\nFirst, the dataset is split into\
    \ train and test elements. Next, a copy of the test set is made and each output\
    \ value is cleared by setting it to the None value to prevent the algorithm from\
    \ cheating accidentally.\n\nThe algorithm provided as a parameter is a function\
    \ that expects the train and test datasets on which to prepare and then make predictions.\
    \ The algorithm may require additional configuration parameters. This is handled\
    \ by using the variable arguments *args in the evaluate_algorithm() function and\
    \ passing them on to the algorithm function.\n\nThe algorithm function is expected\
    \ to return a list of predictions, one for each row in the training dataset. These\
    \ are compared to the actual output values from the unmodified test dataset by\
    \ the accuracy_metric() function. Finally, the accuracy is returned.\n\n```\n\
    # Evaluate an algorithm using a train/test split\ndef evaluate_algorithm(dataset,\
    \ algorithm, split, *args):\n    train, test = train_test_split(dataset, split)\n\
    \    test_set = list()\n    for row in test:\n        row_copy = list(row)\n \
    \       row_copy[-1] = None\n        test_set.append(row_copy)\n    predicted\
    \ = algorithm(train, test_set, *args)\n    actual = [row[-1] for row in test]\n\
    \    accuracy = accuracy_metric(actual, predicted)\n    return accuracy\n```\n\
    \nListing 6.1: Function To Evaluate An Algorithm Using a Train/Test Split.\n\n\
    The evaluation function does make some strong assumptions, but they can easily\
    \ be changed if needed. Specifically, it assumes that the last row in the dataset\
    \ is always the output value. A different column could be used. The use of the\
    \ accuracy_metric() assumes that the problem is a classification problem, but\
    \ this could be changed to mean squared error for regression problems."
