  md: "The sample standard deviation is calculated as the mean difference from the\
    \ mean value. This can be calculated as:\n\nstandard deviation = \\(\\sqrt{\\\
    frac{\\sum_{i=1}^n (x_i - mean(x))^2}{count(x) - 1}}\\) (12.3)\n\nYou can see\
    \ that we square the difference between the mean and a given value, calculate\
    \ the average squared difference from the mean, then take the square root to return\
    \ the units back to their original value. Below is a small function named `standard_deviation()`\
    \ that calculates the standard deviation of a list of numbers. You will notice\
    \ that it calculates the mean. It might be more efficient to calculate the mean\
    \ of a list of numbers once and pass it to the `standard_deviation()` function\
    \ as a parameter. You can explore this optimization if you're interested later.\n\
    \n```\n```python\nfrom math import sqrt\n\n# Calculate the standard deviation\
    \ of a list of numbers\ndef stdev(numbers):\n    avg = mean(numbers)\n    variance\
    \ = sum([(x-avg)**2 for x in numbers]) / float(len(numbers)-1)\n    return sqrt(variance)\n\
    ```\n```\n\n# Listing 12.6: Function To Calculate the Standard Deviation of a\
    \ List of Numbers.\n\nWe require the mean and standard deviation statistics to\
    \ be calculated for each input attribute or each column of our data. We can do\
    \ that by gathering all of the values for each column into a list and calculating\
    \ the mean and standard deviation on that list. Once calculated, we can gather\
    \ the statistics together into a list or tuple of statistics. Then, repeat this\
    \ operation for each column in the dataset and return a list of tuples of statistics.\n\
    \nBelow is a function named `summarize_dataset()` that implements this approach.\
    \ It uses some Python tricks to cut down on the number of lines required.\n\n\
    ```\n```python\n# Calculate the mean, stdev and count for each column in a dataset\n\
    def summarize_dataset(dataset):\n    summaries = [(mean(column), stdev(column),\
    \ len(column)) for column in zip(*dataset)]\n    del(summaries[-1])\n    return\
    \ summaries\n```\n```\n\n# Listing 12.7: Function To Summarize Each Column in\
    \ a Dataset.\n\nThe first trick is the use of the `zip()` function that will aggregate\
