  md: '# Appendix A


    # Standard Datasets


    The key to getting good at applied machine learning is practicing on lots of different
    datasets. This is because each problem is different, requiring subtly different
    data preparation and modeling methods. In this appendix, you will discover a suite
    of standard machine learning datasets that you can use for practice. These are
    the datasets used throughout the book.


    # A.1 Overview


    # A.1.1 A structured Approach


    Each dataset is summarized in a consistent way. This makes them easy to compare
    and navigate for you to practice a specific data preparation technique or modeling
    method. The aspects that you need to know about each dataset are:


    +   - **Name**: How to refer to the dataset.

    +   - **Problem Type**: Whether the problem is regression or classification.

    +   - **Inputs and Outputs**: The numbers and known names of input and output
    features.

    +   - **Performance**: Baseline performance for comparison using the Zero Rule
    algorithm, as well as best known performance (if known).

    +   - **Sample**: A snapshot of the first 5 rows of raw data.

    +   - **Links**: Where you can download the dataset and learn more.


    # A.1.2 Standard Datasets


    Below is a list of the datasets we''ll cover. Each dataset is small enough to
    fit into memory and review in a spreadsheet. All datasets are comprised of tabular
    data and no (explicitly) missing values.


    +   1. Swedish Auto Insurance Dataset.

    +   2. Wine Quality Dataset.'
  merge: -1
  img_proc: true
