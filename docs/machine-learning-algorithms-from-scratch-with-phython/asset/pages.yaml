    \ 0.48333333333333334, 1.0]\n```\n```\n\n# Listing 2.9: Example Output of Normalizing\
    \ the Diabetes Dataset.\n\n# 2.2.2 Standardize Data\n\nStandardization is a rescaling\
    \ technique that refers to centering the distribution of the data on the value\
    \ 0 and the standard deviation to the value 1. Together, the mean and the standard\
    \ deviation can be used to summarize a normal distribution, also called the Gaussian\
    \ distribution or bell curve.\n\nIt requires that the mean and standard deviation\
    \ of the values for each column be known prior to scaling. As with normalizing\
    \ above, we can estimate these values from training data, or use domain knowledge\
    \ to specify their values. Let's start with creating functions to estimate the\
    \ mean and standard deviation statistics for each column from a dataset. The mean\
    \ describes the middle or central tendency for a collection of numbers. The mean\
    \ for a column is calculated as the sum of all values for a column divided by\
    \ the total number of values.\n\n![](img/eb4f6b07d6861add2c4caceda6f4837f_25_0.png)\n\
    \nThe function below named column_means() calculates the mean values for each\
    \ column in the dataset.\n\n```\n```python\n# calculate column means\ndef column_means(dataset):\n\
    \    means = [0 for i in range(len(dataset[0]))]\n    for i in range(len(dataset[0])):\n\
    \        col_values = [row[i] for row in dataset]\n        means[i] = sum(col_values)\
    \ / float(len(dataset))\n    return means\n```\n```\n\n# Listing 2.10: Function\
    \ To Calculate Means For Each Column in a Dataset.\n\nThe standard deviation describes\
    \ the average spread of values from the mean. It can be calculated as the square\
    \ root of the sum of the squared difference between each value and the mean and\
    \ dividing by the number of values minus 1.\n\n![](img/eb4f6b07d6861add2c4caceda6f4837f_25_1.png)"
