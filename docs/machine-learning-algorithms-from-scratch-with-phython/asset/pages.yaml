  md: '# Chapter 12


    # Naive Bayes


    We can use probability to make predictions. Perhaps the most widely used example
    is called the Naive Bayes algorithm. Not only is it straightforward to understand,
    but it also achieves surprisingly good results. In this tutorial you will discover
    how to implement the Naive Bayes algorithm from scratch in Python. After completing
    this tutorial you will know:


    +   - How to calculate the probabilities required by the Naive Bayes algorithm.

    +   - How to implement the Naive Bayes algorithm from scratch.

    +   - How to apply Naive Bayes to a real-world predictive modeling problem.


    Let''s get started.


    # 12.1 Descriptions


    This section provides a brief overview of the Naive Bayes algorithm and the Iris
    flowers dataset that we will use in this tutorial.


    # 12.1.1 Naive Bayes


    Bayes'' Theorem provides a way that we can calculate the probability of a piece
    of data belonging to a given class, given our prior knowledge. Bayes'' Theorem
    is stated as:


    $P(class|data) = \frac{P(data|class) \times P(class)}{P(data)}$ (12.1)


    Where P(class|data) is the probability of class given the provided data. Naive
    Bayes is a classification algorithm for binary (two-class) and multiclass classification
    problems. It is called Naive Bayes or idiot Bayes because the calculations of
    the probabilities for each class are simplified to make their calculations tractable.


    Rather than attempting to calculate the probabilities of each attribute value,
    they are assumed to be conditionally independent given the class value. This is
    a very strong assumption that is most unlikely in real data, i.e. that the attributes
    do not interact. Nevertheless, the approach performs surprisingly well on data
    where this assumption does not hold.'
  merge: -1
  img_proc: true
