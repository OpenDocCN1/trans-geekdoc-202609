    \ [\n0.4494910647887381, 0.6515929727272763]}]]\nrow = [1, 0, None]\noutput =\
    \ forward_propagate(network, row)\nprint(output)\n```\n\n# Listing 15.7: Example\
    \ of Forward-Propagating an Input Through a Network.\n\nRunning the example propagates\
    \ the input pattern [1, 0] and produces an output value that is printed. Because\
    \ the output layer has two neurons, we get a list of two numbers as output. The\
    \ actual output values are just nonsense for now, but next, we will start to learn\
    \ how to make the weights in the neurons more useful.\n\n```\n[0.6629970129852887,\
    \ 0.7253160725279748]\n```\n\n# Listing 15.8: Sample Output from Forward-Propagate\
    \ Input Through a Network.\n\n# 15.2.3 Backpropagate Error\n\nThe backpropagation\
    \ algorithm is named for the way in which weights are trained. Error is calculated\
    \ between the expected outputs and the outputs forward-propagated from the network.\
    \ These errors are then propagated backward through the network from the output\
    \ layer to the hidden layer, assigning blame for the error and updating weights\
    \ as they go. The math for backpropagating error is rooted in calculus, but we\
    \ will remain high level in this section and focus on what is calculated and how\
    \ rather than why the calculations take this particular form. This part is broken\
    \ down into two sections.\n\n+   1. Transfer Derivative.\n+   2. Error Backpropagation."
