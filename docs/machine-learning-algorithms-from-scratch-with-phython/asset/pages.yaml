    \n# 11.2.2 Create Split\n\nA split is comprised of an attribute in the dataset\
    \ and a value. We can summarize this as the index of an attribute to split and\
    \ the value by which to split rows on that attribute. This is just a useful shorthand\
    \ for indexing into rows of data. Creating a split involves three parts, the first\
    \ we have already looked at which is calculating the Gini score. The remaining\
    \ two parts are:\n\n+   1. Splitting a Dataset.\n+   2. Evaluating All Splits.\n\
    \nLet's take a look at each.\n\n# Splitting a Dataset\n\nSplitting a dataset means\
    \ separating a dataset into two lists of rows given the index of an attribute\
    \ and a split value for that attribute. Once we have the two groups, we can then\
    \ use our Gini score above to evaluate the cost of the split. Splitting a dataset\
    \ involves iterating over each row, checking if the attribute value is below or\
    \ above the split value and assigning it to the left or right group respectively.\
    \ Below is a function named test_split() that implements this procedure.\n\n```\n\
    # Split a dataset based on an attribute and an attribute value\ndef test_split(index,\
    \ value, dataset):\n    left, right = list(), list()\n    for row in dataset:\n\
    \        if row[index] < value:\n            left.append(row)\n        else:\n\
    \            right.append(row)\n    return left, right\n```\n\nListing 11.4: Function\
    \ To Split a Dataset Based on a Split Point.\n\nNot much to it. Note that the\
    \ right group contains all rows with a value at the index above or equal to the\
    \ split value.\n\n# Evaluating All Splits\n\nWith the Gini function above and\
    \ the test split function we now have everything we need to evaluate splits. Given\
    \ a dataset, we must check every value on each attribute as a candidate split,\
    \ evaluate the cost of the split and find the best possible split we could make.\
    \ Once the best split is found, we can use it as a node in our decision tree."
