    # A.5 Sonar Dataset


    The Sonar Dataset involves the prediction of whether or not an object is a mine
    or a rock given the strength of sonar returns at different angles. It is a binary
    (2-class) classification problem. The number of observations for each class is
    not balanced. There are 208 observations with 60 input variables and 1 output
    variable. The variable names are as follows:


    +   1. Sonar returns at different angles

    +   2. ...

    +   3. Class (M for mine and R for rock)


    The baseline performance of predicting the most prevalent class is a classification
    accuracy of approximately 53%. Top results achieve a classification accuracy of
    approximately 88%. A sample of the first 5 rows is not provided as it is too large
    to fit on the page.


    +   - Download: https://goo.gl/FXFWwF

    +   - More Information: https://goo.gl/JMF2Iv

    +   - Top Results: https://goo.gl/3wNAjv


    # A.6 Banknote Dataset


    The Banknote Dataset involves predicting whether a given banknote is authentic
    given a number of measures taken from a photograph. It is a binary (2-class) classification
    problem. The number of observations for each class is not balanced. There are
    1,372 observations with 4 input variables and 1 output variable. The variable
    names are as follows:


    +   1. Variance of Wavelet Transformed image (continuous).

    +   2. Skewness of Wavelet Transformed image (continuous).

    +   3. Kurtosis of Wavelet Transformed image (continuous).

    +   4. Entropy of image (continuous).'
