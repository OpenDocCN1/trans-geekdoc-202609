    \ with the Authors:\n\n**[https://discord.bpbonline.com](https://discord.bpbonline.com)**\n\
    \n![](images/Discord.png)\n\n# [CHAPTER 8  \n\n**BigchainDB**](#toc.xhtml#zc08)\n\
    \n## [Introduction](#toc.xhtml#zh91)\n\nIn this chapter, we will look at BigchainDB\
    \ as an open-source database software that provides blockchain features such as\
    \ decentralization, immutability, and peer-to-peer ownership, and database features\
    \ such as high transaction rate, low latency, indexing, and querying.\n\n## [Structure](#toc.xhtml#zh92)\n\
    \nWe will cover the following topics in this chapter:\n\n• Introduction to BigchainDB\n\
    \n• BigchainDB features\n\n• BigchainDB use cases\n\n• Running a BigchainDB node\n\
    \n## [Objectives](#toc.xhtml#zh93)\n\nAfter studying this chapter, you will be\
    \ able to learn the basics of BigchainDB, how BigchainDB works as a database and\
    \ the underlying workings of the same. You will also understand how to run a BigchainDB\
    \ node. Let us get started.\n\n## [Introduction to BigchainDB](#toc.xhtml#zh94)\n\
    \nBigchainDB is a scalable, blockchain-inspired database designed to provide the\
    \ benefits of decentralized systems—such as immutability, transparency, and decentralized\
    \ control—while offering the capacity and performance characteristics of traditional\
    \ databases.\n\nIt combines aspects of blockchain technology with distributed\
    \ database architecture, allowing for decentralized Applications (DApps) to be\
    \ built on top of it.\n\n## [BigchainDB features](#toc.xhtml#zh95)\n\nBigchainDB\
    \ provides blockchain features such as:\n\n• Decentralization: No central authority\
    \ and ownership.\n\n• Immutability: Data cannot be altered once written in the\
    \ BigchainDB.\n\n• Peer\\-to\\-peer network: BigchainDB provides test and live\
    \ networks.\n\nBigchainDB provides database features such as:\n\n• Low latency:\
    \ Fast response time due to low latency network calls.\n\n• Indexing: Data ingestion\
    \ into the Blockchain.\n\n• Querying: Finding data in the chain.\n\n• High transaction\
    \ rate: Fast in terms of indexing and querying.\n\nYou can see the BigchainDB\
    \ characteristics in the following table:\n\n|  || Typical blockchain || Typical\
    \ distributed database || BigchainDB |\n\n| --- | --- | --- | --- |\n\n| Decentralization\
    \ || ✓ ||  || ✓ |\n\n| BFT || ✓ ||  || ✓ |\n\n| Immutability || ✓ ||  || ✓ |\n\
    \n| Ownership of assets || ✓ ||  || ✓ |\n\n| High transaction rate ||  || ✓ ||\
    \ ✓ |\n\n| Low latency ||  || ✓ || ✓ |\n\n| Indexing and querying of structured\
    \ data ||  || ✓ || ✓ |\n\nTable 8.1: BigchainDB characteristics\n\nAs you can\
    \ see, BigchainDB is a club of blockchain and distributed databases to provide\
    \ a solution that is a need of the hour.\n\nLet us go through each of the features\
    \ of BigchainDB.\n\n### [Decentralization](#toc.xhtml#zs58)"
