    \ we are accessing the hello.html file using the domain name. The domain name,\
    \ in turn, looks out for the IP address of the server and picks up the file from\
    \ the server.\n\nIn the IPFS, we use content addressing. Let us look at an example:\n\
    \nhttps://ipfs.io/QmXoypizjW3WknFiJnKLwHCnL72vedxjQkDDP1mXWo6uco/hello.html\n\n\
    As you can see here, we access the content by the hash. Hash represents the file\
    \ and not the location where the file is stored. It is the responsibility of the\
    \ IPFS network to collect the bits and pieces of the file and deliver them to\
    \ the user.\n\nLet us understand how IPFS works in the following sections.\n\n\
    ## [Working of Interplanetary File System](#toc.xhtml#zh75)\n\nIPFS is a distributed\
    \ peer-to-peer storage network. In IPFS, content is accessed from peers spread\
    \ across the world. Peers in IPFS can relay information, store information, or\
    \ do both.\n\nIPFS works by forming a network using independent peers. These peers\
    \ store and relay files information asked by the users.\n\nIPFS uses the following\
    \ important modules to make the network work:\n\n• Content-based addressing\n\n\
    • Directed acyclic graph (DAG)\n\n• Distributed hash table (DHT)\n\nLet us explore\
    \ these modules in detail.\n\n### [Content-based addressing](#toc.xhtml#zs48)\n\
    \nIPFS uses content-based addressing to identify data by what is in it, rather\
    \ than by where it is located."
