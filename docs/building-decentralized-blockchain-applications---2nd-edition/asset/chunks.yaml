    # 第 6 章 星际文件系统


    ## 引言


    在本章中，我们将学习星际文件系统（IPFS），它是一种用于存储、访问和共享文件的分布式系统。IPFS 有一个野心勃勃的目标，是将现有的中心化互联网变为分布式互联网。它旨在取代
    `HTTP` 成为互联网共享文件的默认协议。我们还将学习如何安装和配置 IPFS，并使用 IPFS 构建全栈应用程序。


    ## 结构


    在本章中，我们将学习以下：


    - 星际文件系统简介

    - 星际文件系统的工作原理

    - 安装和配置星际文件系统

    - 在 IPFS 中托管静态网站

    - 使用 IPFS 构建全栈应用程序

    - IPFS 集群 (IPFS Cluster)


    ## 目标


    学习本章后，你应该能够理解 IPFS 的核心概念、IPFS 协议的工作原理，以及使用 IPFS 构建应用程序。让我们开始吧。


    ## 星际文件系统简介


    根据 IPFS 官方网站：


    IPFS 是一个用于存储和访问文件、网站、应用程序和数据的分布式系统。


    IPFS 为开发者提供了在分布式平台上存储数据的平台。有一些诸如 `OrbitDB` 的项目（我们将在将在章节中学习它），在 `IPFS` 之上提供了数据库解决方案。由于
    `IPFS` 的分布式特性，它是去中心化应用（DApp）开发的首选。在上一章中，我们学习了使用 `Ethereum` 构建应用程序并使用 `Swarm` 作为存储解决方案。`IPFS`
    使用基于内容的寻址而不是基于位置的寻址来访问文件。因此，基于位置的寻址是我们使用的；目前，我们使用域名或 IP 地址访问内容。


    考虑这个示例：


    `https://abc.com/hello.html`


    在这里，我们使用域名访问 `hello.html` 文件。域名反过来查找服务器的 IP 地址并从服务器获取文件。


    在 `IPFS` 中，我们使用内容寻址。让我们来看一个例子：


    `https://ipfs.io/QmXoypizjW3WknFiJnKLwHCnL72vedxjQkDDP1mXWo6uco/hello.html`


    如你所见，我们通过哈希访问内容。哈希代表文件，而不是存储文件的位置。`IPFS` 网络负责收集文件的比特并交付给用户。


    让我们在接下来的章节中了解 `IPFS` 如何工作。


    ## 星际文件系统的工作原理


    IPFS 是一个分布式点对存储网络。在 `IPFS` 中，内容从世界各地的节点访问。`IPFS` 中的节点可以中继信息、存储信息或两者兼顾。


    `IPFS` 使用以下重要模块来使网络运行：


    - 内容寻址

    - 有向无环图 (DAG)

    - 分布式哈希表 (DHT)


    让我们详细探讨这些模块。


    ### 内容寻址


    IPFS 使用基于内容的方法来识别数据，而不是根据其位置。


    '
- fmt: '

    Looking for an item by content is something we already do. For example, when you
    look for a piece of cloth, you often ask for it by the color or type; that is
    content addressing because you are asking for what it is.


    If you were using location addressing to find that cloth, you would ask for it
    by where it is: I want the t-shirt that is on the second rack, three pieces of
    cloth away from the left. If someone moved that cloth, you would be out of luck!


    This is how we access content on the internet. For example,


    * `/Users/Alice/Documents/project_paper.doc`

    * `C:/Users/Joe/My/Documents/presentation.ppt`


    IPFS, in turn, generates the Content Identifier (`CID`), which is also referred
    to as the hash.


    Content addressing by using a hash is widely used to connect data in distributed
    systems. You can see the hash-based content addressed in the Git to the cryptocurrencies.
    It is everywhere.


    However, the underlying data structures in these systems are not always interoperable.
    Every system uses a different set of data sets and structures. To tackle such
    issues, IPFS developed Interplanetary Linked Data (`IPLD`), which acts as a data
    model for content addressing. IPLD acts as a translation layer between different
    types of data sets used by the different systems. So, IPFS uses content addressing
    using the hash, and IPLD performs the data sets translation, if required, to enable
    smooth transition of data from one system to another.


    ### Directed acyclic graph


    IPFS uses a `DAG` to store the content. It uses Merkle DAG, which is hashing together
    leaf nodes to form a parent node. We studied the Merkle tree in Chapter 1, Introduction
    to Blockchain and Decentralizd Network.


    `DAG` is a graph in which edges have direction and cycles are not allowed.


    For example, a linked list like `A|B|C` is an instance of a `DAG` where `A` references
    `B`, and so on. We say that `B` is a child or a descendant of `A`, and node `A`
    has a link to `B`. Similarly, `A` is a parent of `B`.


    In `DAG`, nodes that are not children to any other node are referred to as root
    nodes.


    A Merkle DAG is a `DAG` where each node has an identifier (hash or `CID`), and
    this is the result of hashing the node''s contents with the `SHA-256` function.
    Merkle DAG node is immutable. Any change in the node, in turn, creates a different
    Merkle DAG.


    IPFS builds the Merkle DAG tree of the content by splitting the content into blocks.
    Each of these blocks is then associated with `CID` and then hashed together from
    the leaf node to form a Merkle DAG tree.


    So, IPFS provides content-based addressing using hash and Merkle DAG links, which
    hash together to form content. Let us learn about the next and last module, DHT.


    ### Distributed hash table


    A hash table is a set of key-value pairs, and a distributed hash table is where
    the table is distributed across the different peers in the network.


    The main advantages of DHTs are decentralization, fault tolerance, and scalability.
    Due to this, the hash table can span across millions of nodes, and data availability
    is higher due to the distributed nature of data.


    IPFS has a separate library called `libp2p`, which deals with distributed hash
    tables and peer networking.


    IPFS uses `DHT` to find the current location of the content and peers. Once the
    content is found, IPFS connects to the content and downloads it to your system.
    Once these blocks are downloaded, you can calculate the hash and verify the authenticity
    of the content.


    `libp2p` also handles peer-to-peer networking and connection multiplexing. Connection
    multiplexing allows `libp2p` to use a single connection for multiple services.


    We will learn more about `DHT` in the coming section. Now, let us install IPFS
    in our system in the following sections.


    ### Installing and configuring Interplanetary File System


    Let us install IPFS in our system and become a peer through the following steps:


    1. Navigate to the official IPFS website at `https://dist.ipfs.io/-go-ipfs` and
    download the IPFS package for your system. As shown in the following figure, select
    your operating system to download the correct version of IPFS:


    ![](images/Figure_6.1.png)


    2. Once you have downloaded the package, extract or unzip it and switch to the
    extracted folder. The following command installs the IPFS in your system:


    ```

    cd go-ipfs

    ./install.sh

    ```


    3. Once IPFS installed, you can verify it by running the following command:


    ```

    ipfs help

    ```


    It should print the IPFS commands in the Terminal, as shown in the following screenshot:


    ![](images/Figure_6.2.png)


    Now, let us run IPFS in our system:


    4. Run this command on your Terminal:


    ```

    ipfs init

    ```


    It will initialize the repository and create the required files in your system
    to run the IPFS.


    5. Start the IPFS daemon. To do so, run this command:


    ```

    ipfs daemon

    ```


    This command will start the IPFS in a daemon (background process) mode. You should
    see the message in your Terminal, as follows:


    ![](images/Figure_6.3.png)


    6. Now, navigate to `http://localhost:5001/webui`; you should see the admin screen,
    as follows:


    ![](images/Figure_6.4.png)


    In the admin screen, you can see the NODE INFO, such as Peer ID, VERSION, NETWORK
    TRAFFIC charts, and DISTRIBUTION OF PEERS.


    7. Now, visit the Peers page; you should be able to see the peer distribution
    across the world. It should look like the following screenshot, but the peer''s
    number may vary:


    ![](images/Figure_6.5.png)


    You can see the peers and their IDs scattered across the world. Now you are also
    a peer, and you can access any documents you like (only if you have the `CID`
    or hash of the file).


    Let us quickly add a file and try to access it using the IPFS commands.


    8. Run this command to add a file in the IPFS network:


    ```

    ipfs add <path of the file>

    ```


    This command will generate the hash of the content on the screen if executed successfully:


    ![](images/Figure_6.6.png)


    9. Now, copy the hash and access it using the browser:


    `localhost:8080/ipfs/<hash of the file>`


    You should see the file in your browser like the following figure:


    ![](images/Figure_6.7.png)


    You can also access it from anywhere using the global IPFS gateway. Visit the
    following URL:


    `https://ipfs.io/ipfs/QmZPG1xjGVvmtpWvxBFZC42GWuRisdM8dm6KwSAusAEUUL`


    10. You can replace the hash with your file hash and share it with anyone in the
    world. You do not need to become a peer to access the file hosted on IPFS.


    11. You can use the following command to access or download the file from the
    command line:


    ```

    ipfs get <hash of the file>

    ```


    After execution of this command, you should be able to view the downloaded file
    in the file system.


    We will learn more about the command line of IPFS in the next section.


    ### Interplanetary File System command line


    IPFS provides a command line utility for developers to perform IPFS actions using
    a command prompt or Terminal.


    To check the list of available IPFS commands, run this in your Terminal:


    ```

    ipfs --h

    ```


    It will print all the available commands in your Terminal screen like the following
    figure:


    ![](images/Figure_6.8.png)


    There are two types of IPFS commands:


    * Offline: These commands can be executed without running an IPFS instance.

    * Online: These commands require an IPFS node running in your system.


    You can check all the command details on the IPFS official website: `https://docs.ipfs.io/reference/api/cli/`


    Now, let us learn how to configure IPFS running in your system or in a cloud server
    to meet your application requirements.


    ### Configuring Interplanetary File System node


    IPFS stores the configuration in a file located at the home folder location of
    any operating system. The configuration is stored as a JavaScript Object Notation
    (JSON) file. You can view the file at `~/.ipfs/config`.


    Open the file in your editor to view the contents. Let us understand the key aspects
    of the configuration.


