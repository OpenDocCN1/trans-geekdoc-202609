- fmt: "\nOcean Protocol can be used in a variety of applications. Here are a few\
    \ examples:\n\n- Autonomous vehicles: Manufacturers of autonomous cars require\
    \ lots of data to train the artificial intelligence program that drives the car.\
    \ Organizations assume that they need at least 500 million to 1 billion miles\
    \ driven records to train the algorithm, so that it can drive safely on roads\
    \ and make accurate decisions. Ocean Protocol can be used to develop a marketplace\
    \ where individual drivers can submit their data and get paid for it. Car manufacturers\
    \ can use the data to train the algorithms.\n\n- Medical research: Tons of researchers\
    \ require data to finish their research. At the time of writing this book, we\
    \ are dealing with the COVID-19 pandemic, and almost every biotechnology company\
    \ is on a deadline to develop a vaccine to make humans immune to this virus.\n\
    \nThe only way researchers can figure this out is by using data, which can help\
    \ researchers make effective decisions. Ocean Protocol aims exactly toward situations\
    \ like this, where people who own data get paid for sharing it privately with\
    \ researchers.\n\n- Global datastore: Ocean Protocol can be used to build a global\
    \ data store where almost all data related to technology, science, virology, and\
    \ medicines are available and developers can easily use it to build/train algorithms.\n\
    \nLet us understand how Ocean Protocol works.\n\n## Workings of Ocean Protocol\n\
    \nThere are three main actors in the protocol. They are as follows:\n\n- Data\
    \ providers: If you own some data and want to sell it, you are a data provider.\
    \ A data provider is a legal custodian of data. For example, you might be using\
    \ a fitness watch, or know someone who uses a fitness watch. They use a watch\
    \ for a specific period, say a month, and that generates numerous data about the\
    \ body, such as sleep time, heartbeats, and so on.\n\nNow, suppose you want to\
    \ sell this data. First, you need to generate and upload the data to some service,\
    \ such as `Google Drive`, `Dropbox`, and so on.\n\nOnce you have the free link\
    \ of the data, you can hook it up with Ocean Protocol and place it in the marketplace.\
    \ Ocean Protocol never stores your actual data; it stores the metadata of your\
    \ records and puts it in the marketplace. Ocean Protocol handles the security\
    \ of the metadata so that there is no breach of privacy.\n\n- Data marketplace:\
    \ Once you are ready to sell the data, so you can list it in the third-party data\
    \ marketplace built using Ocean Protocol. The data marketplace then lists your\
    \ data, and it is ready for the consumer.\n\n- Data consumers: A data consumer\
    \ is an entity that uses your data to build their applications, train their algorithms,\
    \ and so on. Ocean Protocol manages the data and ensures that the consumer has\
    \ paid the amount listed in the metadata.\n\nOnce a customer has paid the amount,\
    \ they will have access to the data, and the provider will be paid an amount in\
    \ cryptocurrency.\n\nFor detailed information, you can visit the ocean Protocol\
    \ official website. Link to the official ocean website: `https://oceanprotocol.com/`\n\
    \nLet us understand the ocean Protocol architecture.\n\n## Ocean Protocol architecture\n\
    \nThe Ocean Protocol architecture diagram, by the Ocean Protocol team, can be\
    \ seen in the following figure:\n\n![](images/Figure_11.1.png)\n\nOcean Protocol\
    \ consists of the following layers:\n\n- Layer 1: Foundation blockchain layer\n\
    - Layer 2: The middle layer\n- Layer 3: The application layer\n- Layer 4: Wallets\n\
    \nLet us look at them in detail:\n\n- Layer 1: Layer one consists of the robust\
    \ blockchain layer and Ocean Protocol smart contracts that can be executed on\
    \ any Ethereum blockchain and other compatible networks.\n\n- Layer 2: Layer 2\
    \ consists of high-level libraries and protocols to deal with the frontend and\
    \ smart contracts tiers.\n\nHere are the libraries that are used in the middle\
    \ layer:\n\n  - `Ocean.js`: It is a JavaScript library that interacts with ocean\
    \ protocol components. `Ocean.js` provides a rich set of functionalities to developers.\n\
    \n  - `Ocean.py`: It is a Python library for the Python developer community and\
    \ data scientists. It also provides a rich set of functionalities.\n\n- Layer\
    \ 3: Layer 3 consists of the ecosystem of DApps, marketplace and applications.\
    \ The Ocean Market is a hub where data enthusiasts trade the value of the data.\n\
    \n- Layer 4: This is the top layer that consists of Web3 Wallets. This acts as\
    \ a gateway to the Ocean ecosystem.\n\n## Conclusion\n\nIn this chapter, we learned\
    \ that Ocean Protocol is a revolutionary software that allows users to own their\
    \ data and give access to those they trust. It allows users to publish their data\
    \ and earn incentives once it is consumed. It also brings back control of the\
    \ data where it belongs—with you, the user.\n\n**Join our book’s Discord space**\n\
    \nJoin the book’s Discord Workspace for Latest updates, Offers, Tech happenings\
    \ around the world, New Release and Sessions with the Authors:\n\n**[https://discord.bpbonline.com](https://discord.bpbonline.com)**\n\
