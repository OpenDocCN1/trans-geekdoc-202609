    \ creates a peer and connects to other peers. We will use the Node.js framework\
    \ and js-libp2p.\n\nLet us create a new node project through the following steps:\n\
    \n1. Create a new folder and navigate to the folder using Command Prompt or Terminal:\n\
    \n$ npm init --y\n\n2. Install the libp2p library and the required dependencies.\
    \ Run the following command in the Terminal:\n\n$ npm install --save libp2p libp2p-websockets\
    \ libp2p-secio\n\n$ npm install --save libp2p-mplex libp2p-bootstrap\n\n3. Once\
    \ installed, create a new file and name it app.js. Copy pastes the following code:\n\
    \nconst Libp2p = require('libp2p')\n\nconst WebSockets = require('libp2p-websockets')\n\
    \nconst SECIO = require('libp2p-secio')\n\nconst MPLEX = require('libp2p-mplex')\n\
    \nconst Bootstrap = require('libp2p-bootstrap')\n\n// peers addresses\n\nconst\
    \ bootstrapMultiaddrs = \\[\n\n'/dns4/ams-1.bootstrap.libp2p.io/tcp/443/wss/p2p/QmSoLer265NRgSp2LA3dPaeykiS1J6DifTC88f5uVQKNAd',\
    \ '/dns4/lon-1.bootstrap.libp2p.io/tcp/443/wss/p2p/QmSoLMeWqB7YGVLJN3pNLQpmmEk35v6wYtsMGLzSr5QBU3'\n\
    \n\\]\n\nasync function startNode() {\n\nconst node = await Libp2p.create({\n\n\
    modules: {\n\ntransport: \\[WebSockets\\],\n\nconnEncryption: \\[SECIO\\],\n\n\
    streamMuxer: \\[MPLEX\\],\n\npeerDiscovery: \\[Bootstrap\\]\n\n },\n\nconfig:\
    \ {\n\npeerDiscovery: {\n\nautoDial: true,\n\n\\[Bootstrap.tag\\]: {\n\nenabled:\
    \ true,\n\nlist: bootstrapMultiaddrs\n\n }\n\n }\n\n }\n\n })\n\nnode.on('peer:discovery',\
    \ (peer) => {\n\nconsole.log('Discovered %s', peer.id.toB58String())\n\n})\n\n\
    node.on('peer:connect', (peer) => {\n\nconsole.log('Connected to %s', peer.id.toB58String())\n\
    \n})\n\n // start libp2p\n\nawait node.start()\n\n}\n\nstartNode()\n\nLet us understand\
    \ the code:\n\na. From line 1 to 5, we imported all the required modules with\
    \ libp2p.\n\nb. Then, we stored two peer addresses that are already running libp2p\
    \ (or IPFS), and we want to connect to those peers.\n\nc. In the next line, we\
    \ declared a function to contain all the working code and created a new libp2p\
    \ instance:\n\nconst node = await Libp2p.create({\n\nmodules: {\n\ntransport:\
    \ \\[WebSockets\\],\n\nconnEncryption: \\[SECIO\\],\n\nstreamMuxer: \\[MPLEX\\\
    ],\n\npeerDiscovery: \\[Bootstrap\\]\n\n },\n\nconfig: {\n\npeerDiscovery: {\n\
    \nautoDial: true,\n\n\\[Bootstrap.tag\\]: {\n\nenabled: true,\n\nlist: bootstrapMultiaddrs\n\
    \n }\n\n}\n\n }\n\n })\n\nAs you can see, we included all the modules we need\
    \ in the modules object, such as transport, encryption, peer discovery, and so\
    \ on.\n\nIn the config object, we included the peers addresses to connect with.\n\
    \nd.In the next two lines, we added two event listeners to listen for the events\
    \ that are fired on pub/sub communication channels.\n\ne.In the last line, we\
    \ started our node.\n\n4. Run the program using the following command to view\
    \ the output of the code:\n\n$ node app.js\n\nIt should display the following\
    \ output:\n\n![](images/Figure_6.15.png)\n\nIt means our peer is now connecting\
    \ to other peers using libp2p code.\n\nLibp2p has other configuration parameters\
    \ as well. You can check it out at the following link:\n\nhttps://github.com/libp2p/js-libp2p/blob/master/doc/CONFIGURATION.md\n\
    \nLibp2p is the core module of IPFS, and we just studied how to use it as an independent\
    \ module.\n\n## [Conclusion](#toc.xhtml#zh80)\n\nIn this chapter, we explored\
    \ IPFS and its working. Then, we moved to IPFS installation and configuring it\
    \ in our local system. We also studied the various concepts related to IPFS.,\
    \ and then developed two important applications using IPFS to get a deeper understanding\
    \ of IPFS and its usage. Finally, we moved to the libp2p framework to learn the\
    \ core component of IPFS and its ecosystem.\n\nIn the upcoming chapter, we will\
    \ learn about various decentralized database software.\n\n## [References](#toc.xhtml#zh81)\n\
    \n1.https://ipfs.io/\n\n2.https://docs.ipfs.io/\n\n3.https://www.cs.cmu.edu/~dga/15-744/S07/lectures/16-dht.pdf\n\
    \n4.https://www.cs.umd.edu/~mwh/papers/gpads.pdf\n\n5.https://github.com/libp2p/js-libp2p"
