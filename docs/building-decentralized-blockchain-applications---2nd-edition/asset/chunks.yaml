  trans: "\n\n身份管理是管理用户特定数据（如凭据、角色、访问管理等）时最关键的用例之一。\n\n身份盗是当今的一个主要问题；我们必须确保人类或机器的身份是安全且防篡的。\n\
    \n身份管理系统产生海量数据。由于这种大规模的数据生成，我们需要一个能够根据数据量进行扩展的数据库。\n\nBigchainDB 具有去中心化、用于快速查询和索引的本地\
    \ `MongoDB` 节点以及不可变性等特性，这使得 BigchainDB 成为身份管理系统的天然选择。\n\n## 物联网\n\n物联网（IoT）是物理对象的数字化表示，这些对象与网络通信并周期性地向网络注入数据。IoT\
    \ 设备可以是任何物体，其数据摄取可以产生数字节级的数据。为了处理如此量的信息，我们需要一个高吞吐量、快速、防篡且能提供快速结果的系统。这正是 BigchainDB\
    \ 大显身手之处。\n\n## 数据治理\n数据治理始终是一个具有争议的问题。在印度、美国和英国等民主国家，由于各种原因，人们产生的数据一直是政府和其他机构的关注焦点。要在不让人们感到自己被监控的情况下实施数据治理，除了区块链外没有其他解决方案。\n\
    \nBigchainDB 可用于处理此类大量数据，同时允许政府监控资产转移并在必要时采取行动。\n\n## 审计追踪\n审计追踪是系统或系统网络中执行的每一个操作的记录。BigchainDB\
    \ 可用于审计追踪，因为它们天然契合。\n\n审计追踪用于银行、供应链、公用事业市场、访问控制等领域。由于大量数据的产生和记录的性质，BigchainDB\
    \ 可用于存储、管理和查询审计追踪记录。\n\n让我们继续，在您的本地系统中设置 BigchainDB 节点。\n\n## 运行 BigchainDB 节点\n\
    BigchainDB 需要在您的系统中运行 `MongoDB` 实例。因此，在安装和运行 BigchainDB 之前，我们需要在系统中安装并配置 `MongoDB`：\n\
    \n1. 访问 `MongoDB` 官方网站，根据您拥有的操作系统下载软件。\n\n2. 一旦安装了 `MongoDB`，使用以下命令运行 `MongoDB`\
    \ 守护进程：\n\n```\nmongod --dbpath=.\n```\n\n如果您想将数据存储在不同的位置，可以更改 `dbpath` 变量的路径。\n\
    \n3. 一旦 `MongoDB` 开始运行，我们可以使用以下命令在系统中安装 BigchainDB：\n\n```bash\nsudo pip3 install\
    \ bigchaindb\n```\n\n4. 安装后，您可以运行以下命令启动 BigchainDB 服务器：\n\n```bash\nbigchaindb\
    \ -y configure mongodb\n```\n\n5. 启动 BigchainDB 服务器：\n\n```bash\nbigchaindb start\n\
    ```\n\n6. 现在，导航到 `http://localhost:9984` 以验证 BigchainDB 的安装。\n\n您应该得到以下响应：\n\n\
    ```json\n{\n  \"api\": {\n    \"v1\": {\n      \"assets\": \"/api/v1/assets/\"\
    ,\n      \"docs\": \"https://docs.bigchaindb.com/projects/server/en/v1.2.0/http-client-server-api.html\"\
    ,\n      \"outputs\": \"/api/v1/outputs/\",\n      \"statuses\": \"/api/v1/statuses/\"\
    ,\n      \"streams\": \"ws://localhost:9985/api/v1/streams/valid_transactions\"\
    ,\n      \"transactions\": \"/api/v1/transactions/\"\n    }\n  },\n  \"docs\"\
    : \"https://docs.bigchaindb.com/projects/server/en/v1.2.0/\",\n  \"keyring\":\
    \ [\n    \"6qHyZew94NMmUTYyHnkZsB8cxJYuRNEiEpXHe1ih9QX3\",\n    \"AdDuyrTyjrDt935YnFu4VBCVDhHtY2Y6rcy7x2TFeiRi\"\
    \n  ],\n  \"public_key\": \"NC8c8rYcAhyKVpx1PCV65CBmyq4YUbLysy3Rqrg8L8mz\",\n\
    \  \"software\": \"BigchainDB\",\n  \"version\": \"1.2.0\"\n}\n```\n\nBigchainDB\
    \ 已成功安装在您的系统中。\n\n## 结论\nBigchainDB 是一种强大且充满前景的软件，它可以结合区块链和传统数据库的优点，这正是当务之急。我们学习了\
    \ BigchainDB 的特性及其各种用例。我们研究了如何为本地开发设置简单的 BigchainDB 节点。\n\n在下一章，我们将学习另一个名为 Ties.DB\
    \ 的区块链数据库。\n\n**加入我们书籍的 Discord 空间**\n\n加入书籍的 Discord 工作空间以获取最新更新、优惠、全球科技动态、新发布以及与作者的互动：\n\
    \n[`discord.bpbonline.com`](https://discord.bpbonline.com)\n\n![](img/Discord.png)\n\
    \n# 第 9 章 Amazon 量账本数据库\n\n## 引言\nAmazon Quantum Ledger Database (Amazon QLDB)\
    \ 是一个全托管的 Amazon 账本数据库。Amazon QLDB 为账本中的信息提供中心信任权威所有权。Amazon QLDB 为您的应用程序的所有更改提供透明、不可变且经过加密验证的事务日志。\n\
    \n| 注意：此服务已停止。 |\n\n## 结构\n在本章中，我们将涵盖以下主题：\n\n- Amazon Ledger Database\n- Amazon\
    \ Ledger Database 的特性\n- Amazon Ledger Database 用例\n- 使用 Amazon Ledger Database\n\
    - Amazon Ledger Database 驱动程序\n\n## 目标\n学习本章后，你将能够学习 QLDB 的基础知识、如何在 AWS 控制台中中使用它以及如何使用驱动程序。\n\
    \n让我们从引言开始。\n\n## Amazon 量账本数据库\n如前所述，QLDB 是一个全托管的账本数据库。作为开发者，你无需担心数据库的安装、配置和管理。Amazon\
    \ 会为你处理一切。\n\n与我们在前面的章节中介绍的其他去中心化数据库不同，QLDB 是中心化拥有的，这意味着一个或一组机构拥有所有权；因此，它被归类为私有数据库。\n\
    \nAmazonQLDB 提供了一个不可变的数据库，因此数据一旦写入就无法修改。如果需要修改，则创建一个新记录，并保留旧新记录的历史记录，以便人们验证更改。\n\
    \nAmazonQLDB 作为云服务在 AWS 控制台中可用。因此，你按需付费。\n\nAmazonQLDB 使用类 SQL 语言的查询语言来对数据进行操作。对于想要使用具有区块链功能的不可变数据库的大量开发者来说，这是一个受欢迎的举措，但由于学习曲线的存在，可能会被放弃。\n\
    \nAmazonQLDB 还为 Java、NET、JavaScript 和 Python 等编程语言提供了驱动程序。\n\n在下一节中，我们将学习更多关于\
    \ QLDB 的特性。\n\n## Amazon 量账本数据库的特性\nAmazonQLDB 提供以下特性：\n\n- 账本数据库：传统数据库中的事务通常存储在数据库和表中。数据库维护事务的状态，并在发生错误或回滚时采取行动。\n\
    \n事务日志是结构化查询语言（SQL）数据库系统的核心组件。它在系统故障、灾难恢复或数据复制期间重放事务起着重要作用。\n\n在传统数据库系统中，事务日志不是不可变的，用于事务失败或回滚。\n\
    \n在 Amazon QLDB 中，账本结构上类似于事务日志，是数据库的核心组件。账本是一个不可变的、追加的数据结构，存储了事务数据以及相关的元数据。\n\n"
- fmt: "\nThe ledger manages data like a SQL database; you can create a table and\
    \ store your information inside the table.\n\n- **Immutable**: Amazon QLDB is\
    \ an immutable database that stores the records of all changes to the data that\
    \ cannot be altered or modified in any case.\nOnce the data is committed and the\
    \ history of the change is recorded in the system, there are no APIs or administration-level\
    \ features available that can change the historical records.\n\n- **Cryptographically\
    \ secure**: Amazon QLDB stores data in the blocks that are chained together with\
    \ a cryptographically hashing function similar to blockchains. This hashing function\
    \ ensures transactional data integrity using a cryptographic verification method.\n\
    For each transactional record, the QLDB provides a digest—a hash value that points\
    \ to the full hash chain as of a point in time, along with the Merkle audit proof.\n\
    \n- **SQL compatible query language**: Amazon QLDB provides a SQL compatible query\
    \ language. It shrinks the learning curve of developers. Any database programmer\
    \ familiar with the SQL can use Amazon QLDB in a short period. Amazon QLDB achieves\
    \ this using `PartiQL` as its query language and `Amazon Ion` as its document-oriented\
    \ data model.\n`PartiQL` is an open-source, SQL compatible query language. You\
    \ can use `PartiQL` to insert, query, and manage your data with traditional SQL\
    \ operators.\nYou can refer to it on the PartiQL Project homepage (https://partiql.org/).\n\
    `Amazon Ion` is similar to JSON, with more Amazon-centric features.\n\n- **High\
    \ availability**: Amazon QLDB is serverless and runs on the cloud, and it is highly\
    \ available using the battle-tested AWS Global Infrastructure.\nAmazon automatically\
    \ replicates the data across various AWS regions to support the availability and\
    \ integrity of the data.\n\n- **Enterprise-grade**: Amazon QLDB meets the ACID\
    \ properties.\n\n## Amazon Quantum Ledger Database use cases\n\n- **Finance**:\
    \ Banks and financial institutions run on a ledger to keep track of credit and\
    \ debit. Instead of building a complex ledger from scratch, we can use Amazon\
    \ QLDB and focus on the business part instead of handling the technical aspects\
    \ of the ledger.\n- **Manufacturing**: Manufacturing companies work on a supply\
    \ chain system. Numerous parties are involved in the chain to produce and manufacture\
    \ a simple item. A ledger database can play a key role in such a system to record\
    \ transactions and historical records to avoid conflict and keep track of money,\
    \ goods, and so on in the system.\n- **Insurance**: Insurance companies can use\
    \ the QLDB ledger to perform transparent claim resolution and store the transaction\
    \ history. Ledger databases can also store audit records and play a major role\
    \ in conflict resolution between insurance companies and individuals.\n- **Payroll\
    \ systems**: Payroll systems record the history of transactions such as salaries\
    \ paid, insurance claims, and performance history. These records can be systematically\
    \ maintained using QLDB and a ledger, and companies can stay transparent with\
    \ the ownership of the records with the employees and other stakeholders.\n- **Supply\
    \ chain**: Supply chain management is among the most tedious tasks ever. There\
    \ has to be a revolution in technology to support the wide audience playing a\
    \ key role in the chain.\nWith the QLDB ledger, all the supply chain records can\
    \ be stored as a history of the data with the proper changes records made by various\
    \ parties. Parties in the supply chain often access data like the item's location,\
    \ the shipping details, who handles the shipment, and such. Amazon QLDB can play\
    \ a major role in this field.\n\n## Using Amazon Quantum Ledger Database\n\nTo\
    \ use Amazon QLDB, you need to have an AWS account. Create a new account on AWS\
    \ if you do not have it already. Perform the following steps:\n\n1. Click on the\
    \ following link to create a new account in AWS:\nhttps://aws.amazon.com/account/\n\
    ![](images/Figure_9.1.png)\n\n2. Search for `QLDB` and click on it. You should\
    \ see a screen similar to the one shown here:\n![](images/Figure_9.2.png)\n\n\
    3. Click on the `Create ledger` button.\n\n4. Provide the name of the ledger and\
    \ click on the `Create` button. Once the ledger is created, it should be listed\
    \ in the ledger screen:\n![](images/Figure_9.3.png)\n\n5. Click on your ledger\
    \ name and then click on the `Query editor` from the left menu. It should open\
    \ a screen similar to the following figure:\n![](images/Figure_9.4.png)\n\n6.\
    \ Now, run this query to create a new table in the ledger:\n```\nCREATE TABLE\
    \ users\n```\n\n7. Paste the query in the query editor and click on the `Run`\
    \ button. It should create a new table.\n\n8. Now, let us add some information\
    \ to the table. Copy and paste the following query:\n```\nINSERT into users VALUE\
    \ {'id': 1, 'name': 'Shahid', 'location': 'Mumbai'}\n```\n\n9. Now, fetch some\
    \ information from our table. Run the following query to fetch records:\n```\n\
    select * from users\n```\nIt will return the information present in the table.\n\
    \n10. Let us perform the update query and observe the changes in the QLDB. Run\
    \ the following query to update the record:\n```\nUPDATE users as u SET u.name='ShahidShaikh'\
    \ where u.id=1\n```\n\n11. Upon the successful query execution, it will return\
    \ the ID of the document. Copy the ID.\n\nLet us query the changes and see the\
    \ history of the record through the following steps:\n\n1. To retrieve the history\
    \ of the record, we use the `history()` syntax. Here is the query:\n```\nselect\
    \ * from history(users) as h where h.metadata.id='id from the update'\n```\nThis\
    \ query should return the history of changes made toward the document.\nHere is\
    \ the output:\n![](images/Figure_9.5.png)\n\n2. Similarly, you can delete the\
    \ record from the ledger. Copy/paste and run the following query:\n```\nDELETE\
    \ from users as u where u.id=1\n```\nSimilarly, if you run the history query,\
    \ you will see the deleted record as well.\n\n## Amazon Quantum Ledger Database\
    \ drivers\n\nAmazon QLDB provides the drivers for the following programming languages:\n\
    - Java\n- Python\n- Node.js\n- .NET\n\nAdditionally, you need the AWS SDK to bring\
    \ the common functionality required for integration with QLDB. Let us install\
    \ the SDK for Node.js:\n\n1. Create a new folder and switch to it using the Terminal:\n\
    ```bash\nmkdir qldbtest && cd qldbtest\n```\n\n2. Create a `package.json` file\
    \ using the `npm init` command:\n```bash\nnpm init -y\n```\n\n3. Install the `QLDB`\
    \ driver using the following command:\n```bash\nnpm install amazon-qldb-driver-nodejs@1.0.0\
    \ --save\n```\n\n4. Install the dependencies drivers:\n```bash\nnpm install aws-sdk\
    \ --save\nnpm install ion-js@4.0.0 --save\nnpm install jsbi@3.1.2 --save\n```\n\
    \n5. Once the driver is installed, we can perform the connection. Refer to the\
    \ following sample:\n```javascript\nconst qldb = require('amazon-qldb-driver-nodejs');\n\
    \nconst main = function() {\n  const driver = new qldb.QldbDriver('quick-start',\
    \ {});\n};\n\nmain();\n```\nWe are connecting to the default QLDB ledger that\
    \ does not require any configuration. We have not made a connection to our QLDB\
    \ ledger database. You can refer to the documentation page for more information\
    \ about the drivers and visit the following link: https://docs.aws.amazon.com/qldb/latest/developerguide/getting-started-driver.html\n\
    \n## Conclusion\n\nAmazon QLDB is a promising database with an enterprise-grade\
    \ solution. Amazon QLDB can be used to develop many applications. In the next\
    \ chapter, we will learn about the decentralized application already making it\
    \ into the mainstream.\n\n**Join our book’s Discord space**\n\nJoin the book’s\
    \ Discord Workspace for Latest updates, Offers, Tech happenings around the world,\
    \ New Release and Sessions with the Authors:\n"
  raw: 'The ledger manages data like a SQL database; you can create a table and store
    your information inside the table.


    • Immutable: Amazon QLDB is an immutable database that stores the records of all
    changes to the data that cannot be altered or modified in any case.


    Once the data is committed and the history of the change is recorded in the system,
    there are no APIs or administration-level features available that can change the
    historical records.


    • Cryptographically secure: Amazon QLDB stores data in the blocks that are chained
    together with a cryptographically hashing function similar to blockchains. This
    hashing function ensures transactional data integrity using a cryptographic verification
    method.


    For each transactional record, the QLDB provides a digest—a hash value that points
    to the full hash chain as of a point in time, along with the Merkle audit proof.


    • SQL compatible query language: Amazon QLDB provides a SQL compatible query language.
    It shrinks the learning curve of developers. Any database programmer familiar
    with the SQL can use Amazon QLDB in a short period. Amazon QLDB achieves this
    using PartiQL as its query language and Amazon Ion as its document-oriented data
    model.


    PartiQL is an open-source, SQL compatible query language. You can use PartiQL
    to insert, query, and manage your data with traditional SQL operators.


    You can refer to it on the PartiQL Project homepage (https://partiql.org/).


    Amazon Ion is similar to JSON, with more Amazon-centric features.


    • High availability: Amazon QLDB is serverless and runs on the cloud, and it is
    highly available using the battle-tested AWS Global Infrastructure.


    Amazon automatically replicates the data across various AWS regions to support
    the availability and integrity of the data.


    • Enterprise-grade: Amazon QLDB meets the atomicity, consistency, isolation, and
    durability (ACID) properties. With this, Amazon QLDB is enterprise-grade and can
    be used with the production systems with almost zero faults.


    ## [Amazon Quantum Ledger Database use cases](#toc.xhtml#zh104)


    Amazon QLDB can play a vital role in the following domains:


    • Finance: Banks and financial institutions run on a ledger to keep track of credit
    and debit transactions. Instead of building a complex ledger from scratch, we
    can use Amazon QLDB and focus on the business part instead of handling the technical
    aspects of the ledger.


    • Manufacturing: Manufacturing companies work on a supply chain system. Numerous
    parties are involved in the chain to produce and manufacture a simple item. A
    ledger database can play a key role in such a system to record transactions and
    historical records to avoid conflict and keep track of money, goods, and so on
    in the system.


    • Insurance: Insurance companies can use the QLDB ledger to perform transparent
    claim resolution and store the transaction history. Ledger databases can also
    store audit records and play a major role in conflict resolution between insurance
    companies and individuals.


    • Payroll systems: Payroll systems record the history of transactions such as
    salaries paid, insurance claims, and performance history. These records can be
    systematically maintained using QLDB and a ledger, and companies can stay transparent
    with the ownership of the records with the employees and other stakeholders.


    • Supply chain: Supply chain management is among the most tedious tasks ever.
    There has to be a revolution in technology to support the wide audience playing
    a key role in the chain.


    With the QLDB ledger, all the supply chain records can be stored as a history
    of the data with the proper changes records made by various parties. Parties in
    the supply chain often access data like the item''s location, the shipping details,
    who handles the shipment, and such. Amazon QLDB can play a major role in this
    field.


    ## [Using Amazon Quantum Ledger Database](#toc.xhtml#zh105)


    To use Amazon QLDB, you need to have an AWS account. Create a new account on AWS
    if you do not have it already. Perform the following steps:


    1\. Click on the following link to create a new account in AWS:


    https://aws.amazon.com/account/


    ![](images/Figure_9.1.png)


    2\. Search for QLDB and click on it. You should see a screen similar to the one
    shown here:


    ![](images/Figure_9.2.png)


    3\. Click on the Create ledger button.


    4\. Provide the name of the ledger and click on the Create button. Once the ledger
    is created, it should be listed in the ledger screen:


    ![](images/Figure_9.3.png)


    5\. Click on your ledger name and then click on the Query editor from the left
    menu. It should open a screen similar to the following figure:


    ![](images/Figure_9.4.png)


    6\. Now, run this query to create a new table in the ledger:


    CREATE TABLE users


    7\. Paste the query in the query editor and click on the Run button. It should
    create a new table.


    8\. Now, let us add some information to the table. Copy and paste the following
    query:


    INSERT into users VALUE {''id'': 1, ''name'': ''Shahid'', ''location'': ''Mumbai''}


    9\. Now, fetch some information from our table. Run the following query to fetch
    records:


    select \* from users


    It will return the information present in the table.


    10\. Let us perform the update query and observe the changes in the QLDB. Run
    the following query to update the record:


    UPDATE users as u SET u.name=''ShahidShaikh'' where u.id=1


    11\. Upon the successful query execution, it will return the ID of the document.
    Copy the ID.


    Let us query the changes and see the history of the record through the following
    steps:


    1\. To retrieve the history of the record, we use the history() syntax. Here is
    the query:


    select \* from history(users) as h where h.metadata.id=''id from the update query''


    This query should return the history of changes made toward the document identified
    using the ID.


    Here is the output:


    ![](images/Figure_9.5.png)


    2\. Similarly, you can delete the record from the ledger. Copy/paste and run the
    following query:


    DELETE from users as u where u.id=1


    Similarly, if you run the history query, you will see the deleted record as well
    in the history log.


    ## [Amazon Quantum Ledger Database drivers](#toc.xhtml#zh106)


    Amazon QLDB provides the drivers for the following programming languages:


    • Java


    • Python


    • Node.js


    • .NET


    Additionally, you need the Amazon SDK to bring the AWS common functionality required
    for integration with the QLDB.


    Let us install the SDK for Node.js:


    1\. Create a new folder and switch to it using the Terminal:


    $ mkdir qldbtest && cd qldbtest


    2\. Create a package. Json file using the npm init command:


    $ npm init –y


    3\. Install the QLDB driver using the following command:


    $ npm install amazon-qldb-driver-nodejs@1.0.0 –save


    4\. Install the dependencies drivers:


    $ npm install aws-sdk --save


    $ npm install ion-js@4.0.0 --save


    $ npm install jsbi@3.1.2 –save


    5\. Once the driver is installed, we can perform the connection. Refer to the
    following sample:


    const qldb = require(''amazon-qldb-driver-nodejs'');


    const main = function() {


    const driver = new qldb.QldbDriver(''quick-start'', {});


    });


    main();


    We are connecting to the default QLDB ledger that does not require any additional
    configuration. We have not made a connection to our QLDB ledger database. You
    can refer to the documentation page for more information about the drivers and
    visit the following link: https://docs.aws.amazon.com/qldb/latest/developerguide/getting-started-driver.htmlmentioned


    ## [Conclusion](#toc.xhtml#zh107)


    Amazon QLDB is a promising database with an enterprise-grade solution. Amazon
    QLDB can be used to develop many applications that require a ledger: virtually
    every major application.


    In the next chapter, we will learn about the decentralized application already
    making it into the mainstream.


    **Join our book’s Discord space**


    Join the book’s Discord Workspace for Latest updates, Offers, Tech happenings
    around the world, New Release and Sessions with the Authors:'
