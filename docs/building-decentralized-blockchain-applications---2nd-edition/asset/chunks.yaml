    共识是网络中所有方同意的规则集。在本节中，我们将介绍不同类型的共识算法。在接下来的章节中，我们将详细介绍以下共识算法：


    - 工作证明 (Proof of Work)

    - 权益证明 (PoS)

    - 拜占庭容错 (BFT)


    工作证明是由中本聪（Satoshi Nakamoto）为比特币加密货币创建的共识机制。让我们详细了解所有它们。


    ## 工作证明

    工作证明是一种共识机制，其中必须产生生成困难但验证容易的数据。


    比特币使用工作证明，并要求矿工生成一个小于目标值的哈值。在比特币中，矿工必须产生一个以特定数量的 0 开头的哈值。例如，如果目标是 10，矿工必须产生一个开头的
    0 的个数少于 10 的哈值。


    这听起来很简单，但使用 `SHA-256` 函数生成它极其困难。一旦生成了符合目标的哈值，其他人都可以使用生成该哈值时采用的目标进行验证。因此，它是易于验证但难以生成的。


    为了防止垃圾信息和拒绝服务攻击，工作证明要求矿工投入大量资金来构建执行挖矿的基础设施，并获得系统的奖励。


    这种难度也确保了虚假交易不会冲击系统，因为用恶意交易填充系统需要花费大量的时间和资金。相反，人们将挖矿并赚大钱！


    ## 权益证明

    工作证明是一种稳健的共识机制，但它消耗大量的计算和能量。生成区块的能量成本如此高，以这些能量可以供应整个城市的运行。


    工作证明面临扩展性问题。为了解决这些扩展性问题，全球的工程师同意采用另一种被称为 PoS 的共识形式。


    在工作证明中，当区块即将被挖矿时，网络中的每个矿工都尝试生成哈值以获得奖励。最终，成千上万矿工中只有一个矿工会获得哈值和奖励，这反过来浪费了其他矿工的努力。


    在权益证明中，矿工（即验证者）根据各种权益被选中，例如随机性、挖掘的区块数量等。因此，网络选择矿工并要求他们挖掘区块，这给了每个人一个公平的机会，同时节省了其他矿工的努力。


    在 PoS 中，权益可以是货币、排名或权益本身。当验证者试图作弊并在网络中添加坏区块或损坏区块时，权益将被罚没（slashed），或者对矿工收取罚款。


    通常情况下，可以随机进行。系统从网络中随机选取验证者并将区块分配给他们。


    网络分配一个公式，当新区块准备好挖矿时，它可以决定矿工。


    PoS 简单且节省了大量的计算工作。世界上第二流行的加密货币以太坊已经从工作证明切换到了基于 PoS 的共识算法。


    让我们来了解另一种流行的共识机制，即 BFT。


    ## 拜占庭容错

    BFT 是分布式系统中的一种共识机制，即使网络中的节点未能响应或响应错误信息，也能达成共识。


    BFT 确保即使在网络受到攻击或发生某些技术问题的情况下，系统仍运行并执行其功能。


    到为止，我们学习了区块链及其组件。在下一节中，让我们学习加密货币，它凭借技术和金融方法创造了革命。


    ## 比特币

    比特币是世界上第一个点点电子现金系统。比特币提供了匿名性、透明性，并且没有依赖于货币等第三方系统来交换价值。


    中本聪在 2009 年发明了比特币，它被誉为本世纪最重要的发明之一。


    比特币的发明是为了解决当前商业系统中基于信任的依赖。我们作为人信任银行、政府和联邦储备部来保护资金，并为普通人提供了一个使用纸币进行交易和交换的平台。


    由于这些基于信任的模型，经济控制权掌握在少数人手中，他们可以将其恶意目的。


    然而，当时没有替代方案，你必须去银行处理你的财务需求。这时，比特币作为一种全新的更好的替代方案出现了。


    要交易比特币，不需要任何银行或政府的批准。你可以使用电脑或手机向同伴发送资金。就如此简单。


    在本节中，我们将深入学习比特币是如何运作的，每笔交易是如何形成并添加到区块中的，以及它是如何不仅仅解决我们的货币问题的。


    | 注意：我强烈建议读者打印出中本聪编写的比特币白皮书并仔细阅读。你可以从此处下载论文：`https://bitcoin.org/bitcoin.pdf`
    |


    ## 比特币如何工作

    比特币是中本聪在 2009 年创建的一个点点电子支付系统。比特币允许我们向世界上的任何人发送资金，而不需要银行等中央机构来发行账户或处理支付。


    比特币的创建是针对当前金融系统的解决方案，在当前系统中，少数大公司和银行控制着金融世界和全球交易处理。


    它集中了金融和商业的控制权，并迫使人们信任银行能够负责任。


    正如中本聪在《P2P 基础》中所说：

    必须信任中央银行不会贬低货币，但法币的历史充满了对信任的背叛。


    由于这个信任问题，一场巨大的金融危机在 2007 年底影响了世界。这场危机启发了中本聪创建比特币。


    比特币是一个计算机程序。你可以下载预编译好的版本，也可以从 `GitHub` 下载源代码并自行编译。一旦在你的电脑上运行比特币程序，你就成了网络的一部分；你是一个节点！


    一旦你的计算机成为网络的一部分，该程序将连接到运行相同程序的计算机。连接后，计算机将开始共享文件并尝试相互同步，这个文件无非区块链。一旦你的计算机与区块链文件同步，你就可以提交交易。


