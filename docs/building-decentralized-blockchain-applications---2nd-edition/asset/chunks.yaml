  trans: "\n\n账本管理数据的方式类似于 SQL 数据库；你可以创建一个表并在表内部存储你的信息。\n\n- **不可变性**：Amazon QLDB\
    \ 是一种不可变数据库，它存储所有数据更改的记录，这些记录在任何情况下都无法更改或修改。\n一旦数据提交且更改历史在系统中被记录，就没有可用的 API 或管理级功能可以更改历史记录。\n\
    \n- **加密安全性**：Amazon QLDB 将数据存储在块中，这些块通过类似于区块链的加密哈希函数连接在一起。该哈希函数使用加密验证方法确保事务数据的完整性。\n\
    对于每条事务记录，QLDB 都提供了一个摘要（digest）——这是一个指向特定时间点完整哈希链的哈希值，以及 Merkle 审计证明。\n\n- **SQL\
    \ 兼容查询语言**：Amazon QLDB 提供了一种兼容 SQL 的查询语言。它缩短了开发者的学习曲线。任何熟悉 SQL 的数据库程序员都可以在短时间内使用\
    \ Amazon QLDB。Amazon QLDB 使用 `PartiQL` 作为其查询语言，使用 `Amazon Ion` 作为其面向文档的数据模型来实现这一点。\n\
    `PartiQL` 是一个开源的兼容 SQL 的查询语言。你可以使用 `PartiQL` 通过传统的 SQL 运算符来插入、查询和管理你的数据。\n你可以在\
    \ PartiQL 项目主页（https://partiql.org/）参考它。\n`Amazon Ion` 类似于 JSON，具有更多以 Amazon 为中心的特征。\n\
    \n- **高可用性**：Amazon QLDB 是无服务器的并运行在云端，使用经过测试的 AWS 全球基础设施实现高可用性。\nAmazon 自动在各个\
    \ AWS 区域之间复制数据，以支持数据的可用性和完整性。\n\n- **企业级**：Amazon QLDB 符合 ACID 属性。\n\n## Amazon\
    \ Quantum Ledger Database 用场景\n\n- **金融**：银行和金融机构运行账本以跟踪贷方和贷方。与其从头开始构建复杂的账本，不如使用\
    \ Amazon QLDB 并专注于业务部分，而不是处理账本的技术性方面。\n- **制造业**：制造公司在供应链系统中工作。链中涉及许多方，以生产和制造一个简单的物品。账本数据库可以在此类系统中发挥关键作用，记录交易和历史记录，以避免冲突并跟踪系统中的资金、货物等。\n\
    - **保险**：保险公司可以使用 QLDB 账本进行透明的理赔解决并存储交易历史。账本数据库还可以存储审计记录，并在保险公司与个人之间的冲突解决中发挥主要作用。\n\
    - **薪资系统**：薪资系统记录交易历史，如支付的薪水、保险理赔和绩效历史。这些记录可以使用 QLDB 和账本进行系统化维护，公司可以在记录的所有权上对员工和其他利益相关者保持透明。\n\
    - **供应链**：供应链管理是迄今以来最乏味的任务之一。必须有技术革命来支持在链中发挥关键作用的广泛群体。\n通过 QLDB 账本，所有的供应链记录都可以作为数据历史进行存储，并带有由各方所做的适当更改记录。供应链中的各方经常访问诸如物品位置、运输详情、谁处理货运等数据。Amazon\
    \ QLDB 在该领域可以发挥主要作用。\n\n## 使用 Amazon Quantum Ledger Database\n\n要使用 Amazon QLDB，你需要一个\
    \ AWS 账户。如果你还没有账户，请在 AWS 上创建一个新账户。执行以下步骤：\n\n1. 点击以下链接在 AWS 中创建新账户：\nhttps://aws.amazon.com/account/\n\
    ![](img/Figure_9.1.png)\n\n2. 搜索 `QLDB` 并点击它。你应该看到一个与此处类似的屏幕：\n![](img/Figure_9.2.png)\n\
    \n3. 点击 `Create ledger`（创建账本）按钮。\n\n4. 提供账本名称并点击 `Create`（创建）按钮。一旦创建账本，它应该列在账本屏幕上：\n\
    ![](img/Figure_9.3.png)\n\n5. 点击你的账本名称，然后从左菜单点击 `Query editor`（查询编辑器）。它将打开一个与下图类似的屏幕：\n\
    ![](img/Figure_9.4.png)\n\n6. 现在，运行此查询在账本创建一个新表：\n```\nCREATE TABLE users\n```\n\
    \n7. 将查询粘贴到查询编辑器中并点击 `Run` 按钮。这将创建一个新表。\n\n8. 现在，让我们表中添加一些信息。复制并粘贴以下查询：\n```\n\
    INSERT into users VALUE {'id': 1, 'name': 'Shahid', 'location': 'Mumbai'}\n```\n\
    \n9. 现在，从我们的表中获取一些信息。运行以下查询来获取记录：\n```\nselect * from users\n```\n它将返回表中存在的信息。\n\
    \n10. 让我们执行更新查询并观察 QLDB 中的变化。运行以下查询来更新记录：\n```\nUPDATE users as u SET u.name='ShahidShaikh'\
    \ where u.id=1\n```\n\n11. 查询成功执行后，它将返回文档的 ID。复制 ID。\n\n让我们通过以下步骤查询更改并查看记录的历史：\n\
    \n1. 要检索记录的历史，我们使用 `history()` 语法。查询如下：\n```\nselect * from history(users) as\
    \ h where h.metadata.id='id from the update'\n```\n此查询应该返回对文档所做更改的历史。\n以下是输出：\n\
    ![](img/Figure_9.5.png)\n\n2. 同样，你可以从账本中删除记录。复制/粘贴并运行以下查询：\n```\nDELETE from users\
    \ as u where u.id=1\n```\n同样，如果你运行历史查询，你也将看到被删除的记录。\n\n## Amazon Quantum Ledger\
    \ Database 驱动程序\n\nAmazon QLDB 为以下编程语言提供了驱动程序：\n- Java\n- Python\n- Node.js\n\
    - .NET\n\n此外，你还需要 AWS SDK 来引入与 QLDB 集成所需的通用功能。让我们安装 Node.js 的 SDK：\n\n1. 创建新文件夹并使用终端切换过去：\n\
    ```bash\nmkdir qldbtest && cd qldbtest\n```\n\n2. 使用 `npm init` 命令创建 `package.json`\
    \ 文件：\n```bash\nnpm init -y\n```\n\n3. 使用以下命令安装 `QLDB` 驱动程序：\n```bash\nnpm install\
    \ amazon-qldb-driver-nodejs@1.0.0 --save\n```\n\n4. 安装依赖驱动：\n```bash\nnpm install\
    \ aws-sdk --save\nnpm install ion-js@4.0.0 --save\nnpm install jsbi@3.1.2 --save\n\
    ```\n\n5. 一旦驱动驱动程序，我们就可以连接。参考以下示例：\n```javascript\nconst qldb = require('amazon-qldb-driver-nodejs');\n\
    \nconst main = function() {\n  const driver = new qldb.QldbDriver('quick-start',\
    \ {});\n};\n\nmain();\n```\n我们正在连接到不需要任何配置的默认 QLDB 账本。我们还没有连接到我们的 QLDB 账本数据库。你可以参考驱动程序页面获取更多信息，并访问以下链接：https://docs.aws.amazon.com/qldb/latest/developerguide/getting-started-driver.html\n\
    \n## 结论\n\nAmazon QLDB 是一个具有企业级解决方案的有前景的数据库。Amazon QLDB 可用于许多应用程序。在下一章中，我们将学习已经进入主流的去中心化应用程序。\n\
