    is not shared with anyone and is only used within the network. Private blockchains
    do not use any consensus to solve conflict issues as it is predefined in the system.
    Only selected peers can insert a block in the network.


    We have studied the blockchain and its types; now, let us understand the history
    of blockchain.


    ## [History of blockchain](#toc.xhtml#zh06)


    The core principles of blockchain—distributed computing, cryptography, decentralization,
    and consensus algorithms—are not new. They have been around since the 90s and
    are taught in computer science classes all around the world.


    So, one may ask, why distributed ledgers technology and blockchain came into existence
    in 2009.


    Well, to find the answer to this, we must understand how our banking system works.
    Banks are the central authority that own your money and keeps a record of every
    transaction you make.


    There was a time when paper currency was printed based on the number of natural
    resources one country possesses, mainly gold and silver. It is unlikely that we
    find gold and silver mines every day, so the supply was limited, and hence, the
    value of the currency.


    The paper currency you currently hold is printed based on credit without the backing
    of natural resources such as gold and silver. This move allows federal banks to
    print as much money as they want.


    Remember Figure 1.1. That is the time when this economic model failed and when
    banks closed like small shops. That was the 2008 global recession.


    So, where is the problem?


    Satoshi thinks it is the central authority of the banks. Satoshi had a vision
    of the currency being supported globally and transferred anywhere without a bank.
    This vision later became Bitcoin.


    However, is Bitcoin the first cryptocurrency ever?


    The first work on cryptocurrency can be traced back to 1991 by Stuart Haber and
    W. Scott Stornetta. This duo wanted to develop a cryptographically secured document
    timestamp system, where the document cannot be altered once stored in the system.


    They used the Merkle tree concept to store and track the documents in the system.
    The major work that leads to the development of the first Blockchain is the development
    of hashcash—Proof of Work algorithm.


    Hashcash was developed to prevent spams in the computing system. Later on, Hal
    Finney developed a reusable Proof of Work algorithm using hashcash.


    Satoshi Nakamoto, in 2008, combined Merkle trees and reusable Proof of Work algorithm
    with building his blockchain to support the working of a new cryptocurrency.


    The first-ever Bitcoin transaction was done on 12 January 2009 by Satoshi Nakamoto,
    where he sent 50 Bitcoins to Hal Finney.


    Bitcoin transactions have since reached their high to around $20000, as you can
    see in this graph:


    ![](images/Figure_1.2.png)


    At the time of writing this book, no one knew who Satoshi was—the creator of Bitcoin
    and blockchain.


    Now, let us understand the components of the blockchain system.


    ## [Blockchain core components](#toc.xhtml#zh07)


    Blockchain consists of the following core components:


    • Node: Computer within the system.'
