    # 第 10 章


    **DTube**


    ## 引言](#toc.xhtml#zh108)


    在本章中，我们将学习 `DTube`，它是 YouTube 的去中心化版本。它是由网络和对点而不是中心权威管理的视频托管服务。`DTube` 允许内容创作者在不显示广告的情况下赚加密货币。因此，不存在现有服务中常见的跟踪、隐私问题和审核机制。


    ## 结构](#toc.xhtml#zh109)


    在本章中，我们将学习以下内容：


    • `DTube` 简介

    • `DTube` 特性

    • `DTube` 架构

    • `DTube` 的原理


    ## 目标](#toc.xhtml#zh110)


    阅读本章后，你将学习 `DTube` 的基础知识并理解其功能。你还将学习运行 `DTube` 的技术，即去中心化视频托管服务。


    ## DTube 简介](#toc.xhtml#zh111)


    `DTube` 是世界上第一个去中心化的视频托管服务。它为内容创作者和观众提供了一个无广告且公平的平台。


    你可以点击以下 `DTube` 网站访问它：https://d.tube/。


    该网站外观如下：


    ![](img/IMG_10_01.png)


    `DTube` 运行在 `Steem` 区块链上，并将内容存储在星际文件系统 (`IPFS`) 上。我们在第 6 章“星际文件系统”中详细学习过 `IPFS`；让我们简单了解一下
    `Steem` 区块链。


    ### Steem 区块链](#toc.xhtml#zs70)


    `Steem` 是一个社交区块链网络，允许用户创建内容并在不显示广告的情况下获得报。`Steem` 铸造其加密货币，并将其与通过点赞或评论参与内容的创作者及用户共享。


    它还允许开发者在 `Steem` 区块链之上构建应用程序。


    点击链接访问网站了解更多：https://steem.com/。


    `DTube` 使用 `IPFS` 存储内容。它还展示了分布式文件存储服务的力量，该服务在视频托管服务等应用中可以发挥重要作用。


    作为用户，你可以在 `DTube` 上创建账户并观看视频。你可以对视频点赞、评论，并因这些互动获得加密货币。


    让我们来看看 `DTube` 的一些特性。


    ## DTube 特性](#toc.xhtml#zh112)


    `DTube` 为消费者和内容创作者提供以下特性：


    • 内容所有权归创作者。

    • 零审核和零审查。

    • 付款基于内容的互动情况。

    • 根据互动情况向内容消费者付费。

    • 零交易费用。

    • 使用 `IPFS` 进行去中心化内容存储。

    • 频道创建、订阅和提醒与 YouTube 类似。

    • 由于与 YouTube 功能相似，学习曲线极低。


    现在，让我们了解 `DTube` 的架构。


    ## DTube 架构](#toc.xhtml#zh113)


    `DTube` 采用多种技术来运行网站，其架构由以下技术组成：


    • 前端：`JavaScript Meteor` 框架。

    • 分布式区块链数据库：`Avalon`

    • 媒体存储：`Steem`


    ... (其余文本遵循相似逻辑)


