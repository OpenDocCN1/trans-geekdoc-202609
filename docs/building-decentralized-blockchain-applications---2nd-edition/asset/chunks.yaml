    # Dedicated to


    My parents

    and

    My wife and daughter


    # About the Author


    Shahid Shaikh is a software architect with over a decade of experience working
    with emerging technologies. He is the author of four books and an active contributor
    to open-source projects. He specializes in blockchain, distributed systems, and
    software architecture.


    Beyond software engineering, he is a vintage bike enthusiast, often riding his
    classic Royal Enfield to various destinations. He is also deeply interested in
    carbon-free energy generation, space technologies, and quantum computing.


    # About the Reviewers


    ❖ Gowtham Paramasivam is a distinguished Software Engineer with over 8 years of
    experience in the IT and blockchain industry. With a strong foundation in software
    development, he has honed his expertise in designing and implementing innovative
    solutions across diverse technology stacks. His work spans multiple domains, reflecting
    his adaptability and commitment to delivering cutting-edge, efficient systems.


    Throughout his career, Gowtham has been instrumental in architecting and delivering
    impactful projects, ranging from decentralized finance (DeFi) platforms to enterprise-grade
    applications. His expertise extends to smart contract development, distributed
    systems, and seamless integration of blockchain technologies with traditional
    infrastructures. As a team leader, he has successfully overseen cross-functional
    teams, ensuring projects meet business goals while maintaining the highest standards
    of quality and performance.


    ❖ Subhasish Goswami is a blockchain researcher and developer with deep expertise
    in smart contract development, decentralized applications, and blockchain security.
    Having worked with the early blockchain team at WazirX and the blockchain research
    team at Siemens, he currently works with Superform Labs, building multi chain
    applications, His research work has contributed to the field of blockchain technology,
    particularly in areas of oracle design, transaction analysis, and smart contract
    security.


    His expertise spans smart contract development, blockchain architecture, and decentralized
    systems, making him well-qualified to evaluate technical content in the blockchain
    domain.


    # Acknowledgement


    I would like to express our sincere gratitude to all those who contributed to
    the completion of this book.


    First and foremost, I extend my heartfelt appreciation to my family and friends
    for their unwavering support and encouragement throughout this journey. Their
    love and encouragement have been a constant source of motivation.


    I am immensely grateful to BPB Publications for their guidance and expertise in
    bringing this book to fruition. Their support and assistance were invaluable in
    navigating the complexities of the publishing process.


    I would also like to acknowledge the reviewers, technical experts, and editors
    who provided valuable feedback and contributed to the refinement of this manuscript.
    Their insights and suggestions have significantly enhanced the quality of the
    book.


    Last but not least, I want to express my gratitude to the readers who have shown
    interest in this book. Your support and encouragement have been deeply appreciated.


    Thank you to everyone who has played a part in making this book a reality.


    # Preface


    Bitcoin, upon its inception in 2008, took the financial world by storm. It became
    the first alternative to the debt-based paper currency. Bitcoin is powered by
    the underlying technology that shocked the technology world. The core technology
    was named blockchain - immutable proof of records linked together in a chain and
    distributed across every peer in the world.


    This simple yet powerful concept opens a new branch in the computing world. Blockchain
    is being conceptualized to be used in sectors like supply chains, medical records,
    and land records.


    I ventured into blockchain and cryptocurrency in early 2015. To learn more about
    it, I joined one of India’s largest crypto exchanges and helped them build and
    scale their infrastructure. I gained treasure knowledge while working on the exchange.


    One of the branches of blockchain is the decentralized application. This is the
    new set of applications that offer alternatives to the traditional client/server
    model of web development. Using this approach, developers can build next-generation
    applications with the core blockchain technology.


    Decentralized applications are slowly venturing into real-world applications,
    and this was my motivation to author this book—to provide in-depth information
    and knowledge about blockchain and decentralized applications to the readers.
    This book, "Building Decentralized Blockchain Applications, Second Edition" is
    your comprehensive guide to unlocking the power of decentralized applications
    (DApps). Whether you are a seasoned engineer or a curious newcomer, this book
    equips you with the knowledge and tools to embark on your next DApp development
    journey.


    [Chapter 1](#chap01.xhtml#c01) discusses blockchain and explains the core technologies
    that power the blockchain. We will also learn about Bitcoin and how it works in
    depth.


    [Chapter 2](#chap02.xhtml#c02) looks at the Ethereum and smart contracts in detail.
    The smart contract is the turing complete programming language to build the application
    that can be executed on the Ethereum blockchain.


    [Chapter 3](#chap03.xhtml#c03) helps you learn about the core engine of blockchain
    technology which is the consensus algorithms. You will learn different types of
    consensus algorithms and their pros and cons. You will also get a complete idea
    of the challenges faced by each algorithm and the potential solutions.


    [Chapter 4](#chap04.xhtml#c04) focuses on blockchain scaling challenges which
    is very important for the current ecosystem. The scaling of blockchain is the
    core problem that almost every platform faces. You will learn about various challenges
    and solutions related to scaling blockchain platforms.


    [Chapter 5](#chap05.xhtml#c05) helps you learn about blockchain interoperability
    and how to use them to build decentralized applications. Blockchain interoperability
    allows different blockchain platforms to communicate and pass data to each other,
    and this is crucial for building next-generation decentralized applications.


    [Chapter 6](#chap06.xhtml#c06) helps you learn about interplanetary file systems
    and how to use them to build decentralized applications. IPFS is a ground breaking
    technology to build next-generation blockchain applications.

