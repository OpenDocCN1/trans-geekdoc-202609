  trans: "\n你应该能看到你从系统中选择的一张图片。查看地址栏；它就是 IPFS 网关路径：\n\n![](img/Figure_6.13.png)\n\n\
    13. 你刚刚构建了一个使用 IPFS 作为网络和存储的端到端 DApp。\n\n此应用使用了后端系统框架、`Node.js` 等最新技术，并通过 Ajax\
    \ 与前端进行通信。\n\n要部署此应用程序，你需要将应用程序部署在服务器上并连接到 IPFS 网关。你可以使用 Infura 提供的托管 IPFS 网关，正如我们在第一章《区块链与去中心化网络简介》中讨论的那样。到目前，我们学习了如何在我们的机器上运行单个\
    \ IPFS 节点，但单个 IPFS 节点不足以维持数据冗余和可用性。这是因为，嗯，故障会发生。如果一个节点失败且数据没有复制到另一个节点怎么办？这将导致数据丢失，无法实现冗余网络。为了解决这种场景，IPFS\
    \ 引入了 IPFS Cluster。\n\n## IPFS Cluster\n\n`IPFS Cluster` 是一个运行在 IPFS 节点旁边的分布式程序，它通过向其他节点分配和固定（pin）数据来维护数据冗余和可用性。\n\
    \n为了更好地理解 IPFS Cluster，让我们看看 IPFS Cluster 文档团队提供的架构图：\n\n![](img/Figure_6.14.png)\n\
    \n如前所述，`IPFS Cluster` 程序与运行在你系统中的 IPFS 节点进行通信。`IPFS Cluster` 使用 IPFS 节点的 HTTP\
    \ API 进行通信，该节点默认运行在 `5001` 端口。\n\n`IPFS Cluster` 形成了自己的由运行集群程序的节点组成的网络，且不会与 IPFS\
    \ 网络产生干扰。`IPFS Cluster` 节点维护全局数据共识，以保持数据冗余和可用性。\n\n你可以访问 IPFS Cluster 官方项目页面下载该程序并在你的系统中运行。\n\
    \nIPFS Cluster 首页：`https://cluster.ipfs.io/`\n\nIPFS 和 IPFS Cluster 的核心组件之一是一个名为\
    \ `libp2p` 的模块。正如我们在第一章《区块链与去中心化网络简介》中所学习的样，`libp2p` 管理节点并提供了一个构建分布式应用程序的框架。\n\
    \n既然我们已经详细讨论并学习了 IPFS，现在是深入探索 `libp2p` 并理解 IPFS 核心组件的完美时机。\n\n### libp2p\n\n`libp2p`\
    \ 是一个库、规范和协议，帮助开发者构建点等点网络应用。\n\n`libp2p` 由以下组件组成：\n\n- 传输层协议：`libp2p` 传输层协议是 `libp2p`\
    \ 的核心。该层确保数据从一个节点传输到另一个节点。`libp2p` 的传输层协议每天都在演进，未来会有更多协议被 `libp2p` 支持。\n- 端到端加密：`libp2p`\
    \ 传输层可以配置为使用最新版本的 `TLS`（即 `v1.2`）进行安全的端到端加密。`TLSv1.3` 正在开发中。\n- 身份模块：该模块确保节点使用公钥加密与正确的节点进行通信和数据交换，并对在网络中发送和接收的数据进行身份检查。\n\
    - 路由：在点等点网络中，拥有一个能够识别并连接其他节点而无需记住地址的系统是重要的。由于没有中央系统来查找节点信息，`libp2p` 提供了一种路由机制，请求节点提供网络地址信息，如果他们没有，则请求其他节点获取相同信息。\n\
    - 内容发现：`libp2p` 允许我们根据哈希定位内容，并使用分布式哈希表通过哈希或 `CID` 查找内容。\n- 消息模块：在点等点网络中，节点通信是关键。`libp2p`\
    \ 提供了一个发布/订阅（也称为 `pub/sub`）通信模块，帮助节点进行实时通信。\n\n`libp2p` 提供了 Java、`C++`、`Go` 和\
    \ `JavaScript` 的软件开发包。让我们使用服务器端 JavaScript 结合 `libp2p` 构建一个简单的应用程序。\n\n我们将构建一个创建一个节点并连接到其他节点的简单应用程序。我们将使用\
    \ `Node.js` 框架和 `js-libp2p`。\n\n让我们通过以下步骤创建一个新的节点项目：\n\n1. 创建新文件夹并使用命令提示符或终端进入该文件夹：\n\
    `$ npm init --y`\n\n2. 安装 `libp2p` 库和所需的依赖。在终端中运行以下命令：\n`$ npm install --save\
    \ libp2p libp2p-websockets libp2p-secio`\n`$ npm install --save libp2p-mplex libp2p-bootstrap`\n\
    \n3. 安装完成后，创建一个新文件并命名为 `app.js`。复制粘贴以下代码：\n\n```javascript\nconst Libp2p = require('libp2p')\n\
    const WebSockets = require('libp2p-websockets')\nconst SECIO = require('libp2p-secio')\n\
    const MPLEX = require('libp2p-mplex')\nconst Bootstrap = require('libp2p-bootstrap')\n\
    \n// peers addresses\nconst bootstrapMultiaddrs = [\n  '/dns4/ams-1.bootstrap.libp2p.io/tcp/443/wss/p2p/QmSoLer265NRgSp2LA3dPaeykiS1J6DifTC88f5uVQKNAd',\
    \ '/dns4/lon-1.bootstrap.libp2p.io/tcp/443/wss/p2p/QmSoLMeWqB7YGVLJN3pNLQpmmEk35v6wYtsMGLzSr5QBU3'\n\
    ]\n\nasync function startNode() {\n  const node = await Libp2p.create({\n    modules:\
    \ {\n      transport: [WebSockets],\n      connEncryption: [SECIO],\n      streamMuxer:\
    \ [MPLEX],\n      peerDiscovery: [Bootstrap]\n    },\n    config: {\n      peerDiscovery:\
    \ {\n        autoDial: true,\n        [Bootstrap.tag]: {\n          enabled: true,\n\
    \          list: bootstrapMultiaddrs\n        }\n      }\n    }\n  })\n\n  node.on('peer:discovery',\
    \ (peer) => {\n    console.log('Discovered %s', peer.id.toB58String())\n  })\n\
    \n  node.on('peer:connect', (peer) => {\n    console.log('Connected to %s', peer.id.toB58String())\n\
    \  })\n  // start lib2p\n  await node.start()\n}\n\nstartNode()\n```\n\n让我们理解这段代码：\n\
    \na. 从第 1 行到第 5 行，我们导入了所有 `libp2p`模块。\nb. 然后，我们存储了已经在运行 `libp2p`（或 IPFS）的两个节点地址，并想要与它们连接。\n\
    c. 在下一行，我们定义了一个函数来包含所有代码并创建一个新的 `libp2p` 实例：\n```javascript\nconst node = await\
    \ Libp2p.create({\n  modules: {\n    transport: [WebSockets],\n    connEncryption:\
    \ [SECIO],\n    streamMuxer: [MPLEX],\n    peerDiscovery: [Bootstrap]\n  },\n\
    \  config: {\n    peerDiscovery: {\n      autoDial: true,\n      [Bootstrap.tag]:\
    \ {\n        enabled: true,\n        list: bootstrapMultiaddrs\n      }\n    }\n\
    \  }\n})\n```\n正如你看到的，我们在 `modules` 对象中包含了我们需要的所有模块，如传输、加密、发现等。\n在 `config` 对象中，我们包含了要连接的节点地址。\n\
    d. 在接下来两行中，我们添加了两个事件监听器来监听在 pub/sub 通道上触发的事件。\ne. 最后，我们启动了节点。\n\n4. 使用以下命令运行程序以查看输出：\n\
    `$ node app.js`\n\n它应该显示如下输出：\n\n![](img/Figure_6.15.png)\n\n这意味着我们的节点现在通过 `libp2p`\
    \ 代码连接到其他节点。\n\n## 总结\n\n在本章中，我们探索了 IPFS 及其工作原理。然后，我们转向 IPFS 在本地系统中的安装和配置。我们还学习了与\
    \ IPFS 的各种概念，并使用 IPFS 开发了两个重要的应用程序，以深入理解 IPFS 及其用法。最后，我们转向 `libp2p` 框架，学习 IPFS\
    \ 及其生态系统的核心组件。\n\n在接下来的章节中，我们将学习各种去中心化数据库软件。\n\n"
