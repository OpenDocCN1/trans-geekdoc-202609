    \ the server and you will see blocks popping up in the terminal.\n\n### [Limitations\
    \ of Tendermint Core](#toc.xhtml#zs36)\n\nSome of the key limitations of Tendermint\
    \ Core are:\n\n• Centralization: Tendermint Core works with a fixed set of validators\
    \ and changing the validators requires the hard fork. This leads to not true but\
    \ partial centralization of the network.\n\n• Scalability: Tendermint Core uses\
    \ PBFT, hence it inherits the communication overhaul problem which would come\
    \ up whenever we are scaling the network. More number of nodes equals more communications\
    \ which results in the high latency.\n\n• Resource requirements: Tendermint Core\
    \ uses more computation power and network bandwidth due to the use of PBFT consensus.\
    \ This can add up in the cost of the running the operation.\n\nTendermint Core\
    \ is improving and the community is trying to solve problems as they go. This\
    \ is one of the key exciting projects in the blockchain and decentralized space.\n\
    \n## [Conclusion](#toc.xhtml#zh52)\n\nIn this chapter, we studied various consensus\
    \ algorithms and their limitations. We studied how different consensus algorithms\
    \ are designed for different problems. The best takeaway is that we need to identify\
    \ the problem in the network and use the consensus algorithm which best fits the\
    \ problem.\n\nIn the next chapter, we are going to study the scaling challenges\
    \ blockchain and decentralized applications are facing and how we can solve them\
    \ using different techniques.\n\n**Join our book’s Discord space**\n\nJoin the\
    \ book’s Discord Workspace for Latest updates, Offers, Tech happenings around\
    \ the world, New Release and Sessions with the Authors:\n\n**[https://discord.bpbonline.com](https://discord.bpbonline.com)**\n\
    \n![](images/Discord.png)\n\n# [CHAPTER 4  \n\n**Blockchain Scaling Challenges**](#toc.xhtml#zc04)\n\
    \n## [Introduction](#toc.xhtml#zh53)\n\nBlockchain was built to accommodate the\
    \ world’s first cryptocurrency, i.e. Bitcoin. Bitcoin aimed to become an alternative\
    \ mode of payment owned by the people for the people.\n\nThe sole purpose was\
    \ to introduce an alternative to the current centralized mode of payment. However,\
    \ the minute Bitcoin and other cryptocurrencies got together on a centralized\
    \ exchange, and people started trading and making money, things started to change\
    \ and attracted tons of people. This led to the crypto boom and the user size\
    \ of the crypto grew by more than 100x.\n\nDespite its innovative potential, blockchain\
    \ encounters significant challenges in efficiently handling large-scale loads.\
    \ These challenges manifest in various issues, notably heavy transaction fees,\
    \ prolonged transaction durations, and systemic performance degradation.\n\nThe\
    \ decentralized nature of blockchain nodes, operating within peer-to-peer networks\
    \ distributed globally, introduces complexities such as heightened latency due\
    \ to geographic dispersion, extended transaction processing times attributable\
    \ to consensus algorithms like Proof of Work (PoW), and escalating network propagation\
    \ delays with the expansion of the peer-to-peer network.\n\nAs engineers, addressing\
    \ these scaling challenges becomes imperative, necessitating the development of\
    \ tailored solutions to enhance blockchain's operational efficacy.\n\nIn this\
    \ interesting and important chapter, we are going to discuss and learn about various\
    \ scaling techniques in Blockchain technology.\n\n## [Structure](#toc.xhtml#zh54)\n\
    \nIn this chapter, we will address the following topics:\n\n• Blockchain scalability\
    \ challenges\n\n• Sharding\n\n• Layer 2 approach\n\n• Lightning networks\n\n•\
    \ Use cases and applications\n\n## [Objectives](#toc.xhtml#zh55)\n\nThe objective\
    \ is to address and learn the scalability challenges inherent in blockchain technology,\
    \ aiming to enhance its utility and accessibility. Leveraging scaling techniques\
    \ like sharding and layer 2 approaches such as Lightning Networks are pivotal\
    \ strategies. Sharding entails the segmentation of the network into smaller, manageable\
    \ segments, bolstering transaction throughput and diminishing latency. Meanwhile,\
    \ layer 2 solutions like Lightning Networks facilitate off-chain transactions,\
    \ effectively reducing congestion on the primary blockchain. These initiatives\
    \ pave the way for a myriad of applications spanning decentralized finance (DeFi),\
    \ supply chain management, digital identity verification, and voting systems,\
    \ fostering innovation and operational efficiency across diverse sectors.\n\n\
    ## [Blockchain scalability challenges](#toc.xhtml#zh56)\n\nThe consensus algorithms\
    \ such as PoW became a bottleneck in the rapidly growing blockchain industry.\
    \ PoW consensus algorithms could not handle the transaction demand, resulting\
    \ in slow transactions and high transaction fees.\n\nPeer-to-peer network growth\
    \ also resulted in slower transaction and response time because the entire network\
    \ and chain had to be updated, and propagation took time as every peer differed\
    \ in latency, bandwidth, and network strength.\n\nEach blockchain platform operates\
    \ in isolation resulting in creating data silos limiting their potential. Blockchain\
    \ platforms lack standardization and compatibility. Thus, interoperability between\
    \ blockchain networks is one of the key problem areas.\n\nMalicious code detection\
    \ is one of the key challenges in the smart contract platform. Smart contracts\
    \ are self-executing code, and malicious code results in serious issues such as\
    \ loss of funds and theft.\n\nLet us study some of the scaling challenges:\n\n\
    • Network latency: Transactions in decentralized systems require consensus from\
    \ multiple nodes, which can lead to longer confirmation times and slower transaction\
    \ processing.\n\n• Limited throughput: Decentralized networks have a limited capacity\
    \ for the number of transactions that can be processed per second, resulting in\
    \ slow confirmation times during periods of high network usage.\n\n• Gas fees:\
    \ As the network becomes congested, the cost of executing smart contracts (in\
    \ the form of gas fees) can become prohibitively expensive, making the platform\
    \ less accessible for small transactions.\n\n• Resource intensity: Decentralized\
    \ systems often require high computational power and storage resources, which\
    \ can be a barrier to scalability.\n\n• Scalability bottlenecks: Some smart contract\
    \ platforms may be limited by scalability bottlenecks in their underlying infrastructure,\
    \ such as the number of nodes participating in the network."
