    ## 4. Closing/settling the channel


    Participants can close the state channel at any time by submitting the latest
    agreed-upon state to the blockchain. The blockchain verifies the final state,
    and the distribution of assets is settled according to the latest, state agreed-upon
    by the participants. This gets synchronized with the mainchain as well.


    State channels are used in the micropayment where payments are not high in volume.
    Since state channels are often used in payments, there is a special design of
    state channels exclusively for payments.


    We will discuss about payment channels in the coming section.


    ### Payment channels


    Payment channels are a specific type of state channel used in blockchain networks
    to enable fast and scalable transactions, particularly for micropayments.


    These channels allow participants to conduct a series of off-chain transactions
    between themselves, reducing the need for every transaction to be recorded on
    the main blockchain.


    Payment channels offer benefits such as low transaction fees, increased transaction
    throughput, and reduced latency.


    Here is how a payment channel works:


    1. **Opening a payment channel**: Two parties decide to transact with each other
    frequently and opt to open a payment channel. This involves creating a multi-signature
    wallet (usually a `2-of-2` or `2-of-3` multi-sig address) on the blockchain. The
    opening transaction is recorded on the blockchain, establishing the initial state
    of the channel.

    2. **Off-chain transactions**: Once the payment channel is open, the two parties
    can conduct off-chain transactions between themselves without broadcasting each
    transaction to the blockchain. Each off-chain transaction is signed by both parties
    involved in the channel.

    3. **Updating the channel state**: Over time, the participants may engage in multiple
    transactions within the payment channel. The net effect of these transactions
    is continuously updated in real-time within the channel. Both parties must agree
    on the new state of the channel after each transaction. The latest agreed-upon
    state is reflected in the most recent signed transaction.

    4. **Closing the payment channel**: At any point, either party can choose to close
    the payment channel. To do this, they broadcast the latest signed transaction
    to the blockchain. The closing transaction reflects the final state of the payment
    channel, including the net outcome of all the off-chain transactions. It is then
    confirmed on the blockchain, and the channel is considered closed.

    5. **Settling balances**: Once the closing transaction is confirmed on the blockchain,
    the final balances are settled. The blockchain''s smart contract ensures the funds
    are distributed according to the most recent agreed-upon state within the payment
    channel.


    This is how payment channels operate in the blockchain. They inherit majority
    of the working methodology from state channel but exclusively for payments.


    In the next section, we are going to learn about the sidechains.


    ### Sidechains


    As the name suggests, sidechains are a concept in blockchain technology that involves
    the creation of separate blockchains that can operate alongside the main blockchain
    (mainchain), and both chains are connected with each other.


    Please refer to the following figure:


    ![](images/Figure_4.4.png)


    The idea is to enable the efficient transfer of assets or data between the mainchain
    and the sidechain, making the transfer secure, interoperable, and secure.


    Let us discuss some important properties of sidechains:


    - **Parallel chains**: Sidechains run in parallel to the main blockchain but have
    their own set of rules and features. They are independent blockchains, as you
    can see in the preceding figure, and can have different consensus mechanisms,
    governance structures, and block generation times.

    - **Two-way pegging**: This is a mechanism by which sidechains are often connected
    to the mainchain. It allows assets to be transferred from the mainchain to the
    sidechain and vice versa.

    - **Interoperability**: Sidechains aim to bring interoperability between multiple
    blockchain networks using different mechanisms. This is one of the key design
    and architecture goals of sidechains. Users should be able to move assets or data
    seamlessly between the mainchain and various sidechains, enabling more flexibility
    and scalability.


    When different systems collaborate, there is always a chance of security risks.
    This emphasizes the importance of closely examining security details. Due to interconnectivity
    and data exchange, security of sidechains is crucial, as any vulnerabilities could
    impact the overall security of the entire network.


    Two-way pegging and consensus mechanisms must be carefully designed to prevent
    attacks and ensure the integrity of the interconnected blockchains.


    `Bitcoin Liquid Network` is an example of a sidechain designed to facilitate faster
    and confidential transactions between exchanges. Another example is the `Rootstock
    (RSK)` sidechain for the Bitcoin network, which enables the execution of smart
    contracts on the Bitcoin blockchain.


    In summary, sidechains offer a way to extend the functionality of a blockchain
    network by creating separate chains with specific features, allowing for experimentation,
    scalability, and interoperability while maintaining a connection to the main blockchain.


    ### Plasma framework


    Plasma is a framework for scaling blockchain networks by creating hierarchical
    structures of interconnected sidechains, also known as child chains. It was proposed
    by Joseph Poon and Vitalik Buterin in a whitepaper in 2017.


    The primary goal of the plasma framework is to enhance the scalability and efficiency
    of blockchain systems.


    Please refer to the following figure:


    ![](images/Figure_4.5.png)


    Here are the key components and concepts of the plasma framework:


    - **Root chain (Mainchain)**: The mainchain, also referred to as the root chain,
    serves as the primary blockchain with its consensus mechanism (e.g., `PoW` or
    `Proof of Stake (PoS)`). It is responsible for the overall security of the plasma
    framework.

    - **Child chains (Plasma chains)**: Child chains are individual blockchains that
    operate independently but are connected to the root chain. Each child chain can
    have its own rules, consensus mechanism, and features. These chains handle transactions
    and smart contracts, providing a way to scale the transaction throughput.

    - **Plasma operator**: The entity responsible for managing the child chain is
    known as the `plasma operator`. The operator creates the child chain, validates
    transactions, and periodically submits a summary of the child chain''s state to
    the root chain.

    - **Plasma smart contracts**: Plasma introduces the concept of smart contracts
    that govern the relationship between the root chain and the child chains. These
    smart contracts define the rules for depositing assets into the child chain, transferring
    assets within the child chain, and exiting assets from the child chain back to
    the root chain.

    - **Exit mechanism**: Participants in the child chain can exit and withdraw their
    assets to the root chain if they believe that the child chain is misbehaving.
    The exit mechanism ensures that users can reclaim their assets on the root chain
    in case of disputes or malfunctions on the child chain.

    - **Challenge period**: Plasma introduces a challenging period during which participants
    can challenge any malicious or incorrect behavior on the child chain. If a challenge
    is successful, the malicious actor may lose their deposited funds.

    - **Mass exits**: To prevent denial of service (Dos) attacks, plasma allows for
    mass exits where multiple users can exit the child chain simultaneously in the
    event of a significant issue.

