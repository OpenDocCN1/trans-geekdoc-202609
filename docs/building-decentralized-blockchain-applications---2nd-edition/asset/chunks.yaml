    # Decentralized Databases


    # CHAPTER 7


    # OrbitDB, a Peer-to-peer Distributed Database


    ## Introduction


    OrbitDB is a peer-to-peer, serverless, distributed database built on top of IPFS.
    We have studied about Interplanetary File System (IPFS) in detail in the last
    chapter. In this chapter, we will learn about OrbitDB and how to use it to build
    decentralized applications (DApps).


    ## Structure


    We will cover the following topics in this chapter:


    • Introduction to OrbitDB

    • Installing OrbitDB

    • OrbitDB data models

    • Building DApps using OrbitDB

    • Technologies


    ## Objectives


    After studying this chapter, you will be able to use OrbitDB to build DApps, you
    will also learn how to use IPFS and OrbitDB together to build DApps. Let us get
    started.


    ## Introduction to OrbitDB


    Here is the definition according to the OrbitDB project page:


    OrbitDB is a serverless, distributed, peer-to-peer database. OrbitDB uses IPFS
    as its data storage and IPFS Pubsub to automatically sync databases with peers.
    It’s an eventually consistent database that uses CRDTs for conflict-free database
    merges, making OrbitDB an excellent choice for decentralized apps (DApps), blockchain
    applications and offline-first web applications.


    That is a very technical definition. Let us break it down further to understand
    better:


    • OrbitDB is serverless, which means you do not need to maintain a database server
    when using OrbitDB, unlike other database software. It is provided as a module
    for various programming languages.

    • OrbitDB is distributed; it is designed as a peer-to-peer database with no centralized
    server.

    • OrbitDB uses IPFS as a storage system. OrbitDB acts as a layer between the IPFS
    and the programming interface.

    • OrbitDB is a peer-to-peer database, and to synchronize the changes in the peer
    to other peers, it uses IPFS publish/subscribe (pub/sub) system to communicate
    with other peers.

    • OrbitDB uses the eventual consistency model; it is the consistency model in
    which the latest updated version of the data item is returned to the user, maintaining
    the availability and consistency of data. To achieve this eventual consistency,
    OrbitDB uses Conflict-free Replicated Data Types (CRDTs).

    • OrbitDB is packaged as a Node.js library. JavaScript was chosen because of its
    popularity and ubiquity in the programming community and for its interoperability
    with the JavaScript implementation of IPFS, called `js-IPFS`.


    Let us move on to the installation of OrbitDB.


    ## Installing OrbitDB


    OrbitDB is a serverless application, so you do not need to run a server as we
    do for other databases like MySQL.


    Let us install OrbitDB in our application through the following steps:


    1. Here is the command to install OrbitDB and IPFS in our project:


    ```

    npm install @orbitdb/core @orbitdb/liftoff helia

    ```


    The `liftoff` module will help us quickly spin the OrbitDB database.


    2. Once installed, you can use the following code to connect to the IPFS and create
    an OrbitDB data store:


    ```javascript

    import { createOrbitDB } from ''@orbitdb/core''

    import { DefaultLibp2pOptions } from ''@orbitdb/liftoff''


    const libp2p = createLibp2p({ ...DefaultLibp2pOptions })

    const ipfs = await createHelia({ libp2p })

    console.log(''Connected to IPFS'');

    const orbitdb = await createOrbitDB({ ipfs })

    console.log(''OrbitDB instance created.'')

    const db1 = await orbitdb.open(''db1'')

    await db1.add(''hello world!'')

    console.log(await db1.all())

    ```


    3. Upon execution of the preceding program, you should get the following output:


    ```bash

    $ node app.js

    $ Connected to IPFS

    $ OrbitDB instance created.

    $ hello world!

    ```


    4. Now, we can create a new database or load an existing database and use it to
    build our DApps.


    Before we move towards building our application, we should learn the data models
    offered by OrbitDB.


    ## OrbitDB data models


    OrbitDB is a multi-model database and provides various types of databases for
    different types of data models; here are the following data models:


    • Events

    • Documents

    • Key-value

    • Indexed key-value


    Let us look at each data model in brief.


    ### Events


    It is an immutable and append only data model used to store traversable records.
    One of the use cases for such types of data models is a message queue where messages
    are stored in the order and traversed back to the starting index, record by record.


    The events model is an immutable data store, so data cannot be altered once it
    is written.


    To create a events store, refer to the following code:


    ```javascript

    const db = await orbitdb.open(''users'');

    const hash = await db.add({ name: ''John'' });

    // to return all logs

    const allRecords = db.iterator({ limit: -1 }).collect().map((e) =>e.payload.value);

    console.log(allRecords); // prints all the logs

    // return only specific record

    const record = db.get(hash).map((e) =>e.payload.value);

    console.log(record); // prints specific log

    ```


    Let us look over the next data model.


    ### Documents


    As the name suggests, it is a document-based data model where we can store custom
    documents and index them using custom fields. If you are familiar with MongoDB
    or Elasticsearch, this data model will be very useful for you.


    You can use the document data model to build custom database applications, blogs,
    e-commerce applications, and so on.


    We will also use the document data model to build our DApps in the upcoming section.


    Let us look at the example code:


    ```javascript

    const db = await orbitdb.open(''users'',{type: ‘documents’});

    // add new record

    const hash = await db.put({ _id: ''hash of the record'', name: ''Shahid'', followers:
    500, following:120, profilePicture: ‘hash of the image probably IPFS’ });

    // fetch the record

    const profile = db.get(''hash of the record'');

    // delete the record

    const hash = await db.del(''hash of the record'');

    // fetch all the record

    const allProfiles = db.get('''');

    ```


    You can run the custom query to fetch the documents, just like we do in other
    databases. Check out the following example:


    ```javascript

    const all = db.query((doc) =>doc.followers>= 500);

    // should returns all the users who have followers equal to or more 500

    ```


    The documents data model is quite useful and generic and can be shaped to support
    any application.


    Let us learn about the next data model, key-value.


    ### Key-value


    The key-value store, as the name suggests, lets you store data in the key-value
    format. The usage of the key-value data store is vast and can be used in the range
    of applications.


    Let us look at an example:


    ```javascript

    const db = await orbitdb.open(''users'', { type: ‘key-value’ });

    // add new key value data

    const hash = await db.put(''1'', { name: ''Shahid'' });

    // You can also do the above operation using a set() function

    const hash = await db.set(''1'', { name: ''Shahid'' });

    // fetch the information using the key

    const value = db.get(''1'');

    console.log(value); // prints the data i.e {name: ‘Shahid’}

    // delete the data using the key

    const hash = await db.del(''1'');

    ```


    The indexed key-value database is similar to key-value but adds an index to the
    database for faster queries.


    Let us build a DApps.


    ## Building DApps using OrbitDB


    Let us build our full-fledged DApps using OrbitDB and IPFS. We will build an email
    software that runs on a peer-to-peer network; let us call it DECENTRALIZED MAIL
    (Dmail).


    Before we go into the application’s technical aspects, let us see how it looks.


    Here is the home page of our application:


    ![](images/Figure_7.1.png)


    Here is the Inbox page where users can read their emails:


    ![](images/Figure_7.2.png)

