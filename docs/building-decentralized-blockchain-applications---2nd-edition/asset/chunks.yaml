  trans: "\n\n{\"id\":1,\"jsonrpc\":\"2.0\",\"result\":\"EthereumJS TestRPC/v2.8.0/ethereum-js\"\
    }\n\n如果你使用的是 `Geth` 或 `Infura`，结果可能会有所不同。你可以在 Ethereum 的 GitHub wiki 中查看所有命令：https://github.com/ethereum/wiki/wiki/JSON-RPC#json-rpc-methods。\n\
    \n让我们再次进行一次 RPC 调用。这次，我们将要求 RPC 服务器返回最新的区块号。\n\n这里是该命令。请将其复制并粘贴到你的 `Terminal`\
    \ 中：\n\n```bash\ncurl -X POST -H \"Content-Type: application/json\" --data \\\n\
    \n '{\"jsonrpc\":\"2.0\",\"method\":\"eth\\_blockNumber\",\"params\":\\[\\],\"\
    id\":1}' \\\n\n http://localhost:7545\n```\n\n这应该返回以下输出：\n\n![](img/Figure_2.9.png)\n\
    \n你可以通过在 `Terminal` 中运行以下命令，将十六进制的 `0x0` 转换为十进制：\n\n```bash\n$ echo $((0x0))\n\
    $ 0\n```\n\n你应该尝试其他命令并与 RPC 交互，以掌握以太坊链函数和方法的用法。我们将在接下来的章节中使用这些函数来编写我们的智能合约。\n\n\
    到目前为止，我们详细学习了以太坊，并学会了如何成为以太坊网络的节点；我们还查看了 Ethereum RPC 调用以及如何使用与其交互。\n\n在下一节中，我们将学习智能合约和\
    \ Solidity 语言。\n\n## 智能合约与 Solidity 语言 (#toc.xhtml#zh35)\n\n智能合约运行在以太坊虚拟机（EVM）上的程序，负责管理以太坊状态账户的行为。\n\
    \n让我们理解以下定义：\n\n- **计算机程序**：智能合约与其他任何程序一样都是计算机程序。`contract` 一词本身没有法律含义。\n- **不可变性\
    \ (Immutable)**：智能合约一旦部署，就无法更改，这符合区块链的基本标准，即不可变性。任何更改必须使用新的版本号重新部署。\n- **VM 上下文\
    \ (VM context)**：智能合约在限制的执行环境中运行。如果需要，智能合约可以访问其状态、交易上下文以及有关最新区块的信息。\n- **去中心化计算机\
    \ (Decentralized computer)**：虚拟机运行在世界各地的节点上并共享相同的状态，因此整个系统像单台计算机一样运行。\n\n智能合约通常用\
    \ Solidity 编程语言编写。\n\nSolidity 是一种面向对象的高级语言，用于实现以太坊的智能合约程序。\n\nSolidity 深度受到 `C++`、`Python`\
    \ 和 `JavaScript` 的启发，如果你在职业生涯中使用过其中任何一种编程语言，你会觉得它很熟悉。Solidity 是静态类型（这意味着类型在编译期间进行检查），并支持继承、库和用户定义类型。\n\
    \n在本节中，我们将学习 Solidity 项目和数据类型，并用用 Solidity 开发一个程序。\n\nSolidity 是一门高级语言，但在 Solidity\
    \ 编译器的帮助下，它将其代码转换为机器级可执行代码，这些编译器通常被称为 `solc`。\n\n你可以通过多种方式在计算机上安装 Solidity 编译器。安装编译器的简单方法是使用节点包管理器，即\
    \ `npm`。\n\n假设你的机器已安装了 `Node.js`，你可以在终端运行此命令来安装 Solidity 编译器：\n\n```bash\nsudo\
    \ npm install -g solc\n```\n\n此命令将在你的机器上安装 Solidity 编译器。安装完成后，你可以通过运行以下命令进行验证：\n\
    \n```bash\n$ solcjs -h\n```\n\n此命令将打印与 Solidity 编译器相关的选项，如下所示：\n\n![](img/Figure_2.10.png)\n\
    \n你可以访问 Solidity 官方网站查看详细的安装说明：https://solidity.readthedocs.io/en/latest/installing-solidity.html。\n\
    \n让我们来看 Solidity 编程语言的数据类型。我们可以在一个章节中涵盖 Solidity 的所有细节，但将解释你开始编写 Solidity 程序或智能合约所需的必备知识。\n\
    \n## Solidity 数据类型 (#toc.xhtml#zh36)\n\nSolidity 的一些基本数据类型如下：\n\n- **布尔值 (Boolean)**：布尔值；持有\
    \ true 或 false。\n- **整数 (Integer)**：有符号整数 (`int`) 和无符号整数 (`uint`) 被声明为 256 位的整数值。然而，我们可以以\
    \ 8 位为增量提供大小后缀。例如，`int8`、`int16` 到 `uint256`。\n- **定点数 (Fixed point)**：定点数，用 `fixedMxN`\
    \ 或 `ufixedMxN` 声明，其中 `M` 是以 8 位为增量的位大小，`N` 是小数点后的位数。例如，`ufixed32x2` 意味着大小为 32\
    \ 位且有两个小数点的无符号定点数。\n- **地址 (Address)**：它是一种 20 字节的以太坊地址类型。`Address payable` 是一个提供额外成员进行传输和发送的类型，它是可以发送以太坊的地址。\n\
    - **数组 (Arrays)**：分为两种类型：\n    - 固定类型是使用 `bytes1` 和 `bytes32` 声明的固定大小数组。\n   \
    \ - 动态数组的大小可变。它们用 `bytes` 或 `string` 声明。\n- **枚举 (Enum)**：它是用于离散值的用户定义类型。\n- **结构体\
    \ (Struct)**：它是一种用户定义的数据容器，类似于 `C++` 中的结构体。\n- **映射 (Mapping)**：它是一个通过键映射到值的哈希查找表。\n\
    \n这些是处理数据的基本类型。还有一些帮助你开始编写 Solidity 程序或智能合约的必备知识。\n\n这些是基础类型。\n\n| 注意：`wei` 是以太坊的最小单位。\
    \ |\n| --- |\n\n让我们查看合约的结构以了解编写合约。\n\n## 合约结构 (#toc.xhtml#zh37)\n\n每个 Solidity\
    \ 合约可以包含以下：\n\n- 状态变量\n- 函数\n- 函数修饰器\n- 事件\n- 结构体\n- 枚举\n\n合约还可以继承其他良好的合约。让我们详细了解合约结构。\n\
    \n### 状态变量 (#toc.xhtml#zs24)\n\n状态变量是持久存储在合约中的变量。使用我们学习的类型声明状态变量。\n\n考虑以下示例：\n\
    \n```solidity\npragma solidity 0.4.0;\ncontract SimpleStorage {\n    uint storedData;\
    \ // 状态变量\n}\n```\n\n### 函数 (#toc.xhtml#zs25)\n\n函数包含代码并通过程序调用。函数具有 `public`、`private`\
    \ 等可见性。它们接受参数并返回变量。\n\n参考以下示例：\n\n```solidity\npragma solidity >=0.4.0 <0.7.0;\n\
    contract SimpleAuction {\n    function sayHello() payable { // 函数\n}\n}\n```\n\
    \n### 函数修饰器 (#toc.xhtml#zs26)\n\n函数修饰器可以以声明式方式更改函数的行为。例如，我们可以使用修饰器在执行函数之前执行条件代码。\n\
    \n### 事件 (#toc.xhtml#zs27)\n\n正如名称所示，它提供了发布和订阅事件的功能。事件允许程序员编写模块化的代码库。\n\n### 结构体\
    \ (#toc.xhtml#zs28)\n\n结构体（struct）是定义用户生成数据结构的方法。\n\n看看这个示例：\n\n```solidity\n\
    pragma solidity 0.4.0;\ncontract UserInfo {\n    struct User { // 结构体\n      \
    \  uint Id;\n        byte32 name;\n        address delegate;\n    }\n}\n```\n\n\
    ### 枚举 (#toc.xhtml#zs29)\n\n枚举数据类型允许开发者在 Solidity 中创建自己的类型。\n\n考虑以下示例：\n\n```solidity\n\
    pragma solidity 0.4.0;\ncontract Purchase {\n    enumUserStatus { Active, Pending,\
    \ Inactive } // 枚举\n}\n```\n\n## 编写第一个 Solidity 程序 (#toc.xhtml#zh38)\n\n让我们编写第一个智能合约，通过阅读之前的示例代码可以解决你的疑问。\n\
    \n你的机器上必须安装以下内容：\n\n- `Node.js`\n- `Hardhat`\n- `Solc`\n\n你可以选择任何喜欢的代码编辑器，但强烈建议使用\
    \ Visual Studio Code (VS Code) 编辑器。\n\n你可以通过以下链接从官方网站下载编辑器：https://code.visualstudio.com/\n\
    \n"
- fmt: "\nIf you are using `VS Code`, it is recommended to install the `Solidity`\
    \ extension. The steps to be taken are as follows:\n\n1. To install, click on\
    \ the `Extension` icon in the `VS Code` left bar and search for `solidity`.\n\
    2. Click on the `Install` button, and you are good to go.\n3. Assuming that you\
    \ have `Node.js` installed, here is the process to install `Hardhat`.\n\n`Hardhat`\
    \ is an Ethereum development framework suit, and it makes writing and deploying\
    \ smart contracts easy and developer-friendly. Now, refer to the following steps:\n\
    \n1. Run the following command to install `Truffle` in your machine:\n```bash\n\
    npm install --save-dev hardhat\n```\n2. Once it is installed, we can move ahead\
    \ with the project.\n3. Create a new folder and navigate to it using the command\
    \ line. Run this command to create a new `Hardhat` project.\n4. To create a folder:\n\
    ```bash\nmkdir solidityDemo\ncd solidityDemo\n```\n5. Then, run the following\
    \ command:\n```bash\nnpx hardhat init\n```\nIt should provide the following output\
    \ in the Terminal:\n\n![](images/Picture_2.11.png)\n\nNow, open the project in\
    \ your code editor. The structure of the project is as follows:\n\n- `contracts`\n\
    - `ignition`\n- `test`\n- `artifacts`\n- `hardhat-config.js`\n\nThe `contracts`\
    \ folder stores the code written in `Solidity`. The `ignition` folders contain\
    \ the scripts to deploy contracts. The `hardhat-config.js` contains configuration\
    \ options; we do not need to touch that file for our project.\n\nSwitch to the\
    \ `contracts` folder and you should see `Lock.sol` file and content should be\
    \ similar to the following:\n\n```solidity\npragma solidity ^0.8.24;\n\ncontract\
    \ Lock {\n    uint public unlockTime;\n    address payable public owner;\n   \
    \ event Withdrawal(uint amount, uint when);\n    constructor(uint _unlockTime)\
    \ payable {\n        require(\n            block.timestamp < _unlockTime,\n  \
    \          \"Unlock time should be in the future\"\n        );\n        unlockTime\
    \ = _unlockTime;\n        owner = payable(msg.sender);\n    }\n    function withdraw()\
    \ public {\n        // Uncomment this line, and the import of \"hardhat/console.sol\"\
    , to print a log in your terminal\n        // console.log(\"Unlock time is %o\
    \ and block timestamp is %o\", unlockTime, block.timestamp);\n        require(block.timestamp\
    \ >= unlockTime, \"You can't withdraw yet\");\n        require(msg.sender == owner,\
    \ \"You aren't the owner\");\n        emit Withdrawal(address(this).balance, block.timestamp);\n\
    \        owner.transfer(address(this).balance);\n    }\n}\n```\n\nLet us understand\
    \ the program before moving ahead:\n\n1. The first line tells the compiler which\
    \ version of `solidity` to use, it is important. Change the version of `solc`\
    \ to your version if it is different from `0.8.24`, as shown above.\n2. The second\
    \ line declares a new `contract` and inside it contains different functions of\
    \ the contract.\n3. Let us compile this program by running this command:\n```bash\n\
    npx hardhat compile\n```\nIt should return the following output in the console:\n\
    \n![](images/Figure_2.12.png)\n\n4. Now, let us deploy the contract. In a new\
    \ terminal window, run this command to run a local Ethereum node to deploy smart\
    \ contract.\n```bash\nnpx hardhat node\n```\n5. Now, let us deploy the compiled\
    \ contract to the local blockchain node. Run the following command to deploy it.\
    \ Do Ensure that you add `localhost` value in the network parameter.\n```bash\n\
    npx hardhat ignition deploy ./ignition/modules/Lock.js --network localhost\n```\n\
    It will deploy our smart contract in blockchain and return the transaction ID.\
    \ This command should print something like this at your end:\n\n![](images/Figure_2.13.png)\n\
    \nYou have successfully created, compiled, and deployed a smart contract in Ethereum\
    \ blockchain.\n\nWe have covered `Solidity` in brief in this section. It will\
    \ help you gain experience in the static type language with state management.\n\
    \nIn the next section, we will learn about the `DApps` framework by Ethereum.\n\
    \n# Decentralized Applications using Ethereum\n\nIn this section, we will explore\
    \ `DApp` development using the Ethereum platform. A `DApp` built with Ethereum\
    \ is an application that executes smart contracts in the backend and hosts frontend\
    \ in the decentralized network.\n\nIn a nutshell, a `DApp` using Ethereum is composed\
    \ of the following:\n\n- **Frontend**: `HTML`, `CSS`, `JavaScript`, and static\
    \ files\n- **Backend**: Smart contracts, blockchain\n\nAn application may require\
    \ more than just smart contracts, and Ethereum provides the following projects\
    \ to cover these needs:\n\n- **Swarm**: Decentralized storage network.\n- **Whisper**:\
    \ Dynamic communication protocol.\n- **Smart contracts**: Turing complete programming\
    \ language and interface:\n\n![](images/Figure_2.14.png)\n\nConsider the following\
    \ aspect of an application that may be decentralized:\n\n- Frontend\n- Backend\n\
    - Storage\n- Communication\n- Name resolution\n\nEach of these aspects can be\
    \ somewhat centralized or decentralized. For example, frontend can run as an independent\
    \ centralized server, while backend is a smart contract running on blockchain.\
    \ Storage can be used as decentralized, while name resolution can be a centralized\
    \ service.\n\nAt this moment, there is no hard and fast rule that all aspects\
    \ of the application must be decentralized. You must use blockchain to put business\
    \ logic in check with decentralization, and the rest can mix up with centralized\
    \ service to improve user experience. Again, it is not necessary either.\n\nLet\
    \ us check out the advantages of the `DApps`:\n\n- **Resiliency**: Business logic\
    \ of the application is written in the smart contract, which, in turn, executes\
    \ in blockchain. Unlike an application deployed on a centralized server, a `DApp`\
    \ will have no downtime due to the network strength.\n- **Transparency**: Any\
    \ interaction with `DApp` is stored in the blockchain. Anyone can check that in\
    \ the chain and be sure about the code. `DApp` code, execution, and result are\
    \ completely transparent with zero censorship.\n- **Censorship resistance**: As\
    \ long as the network is up, anyone can access and use the application running\
    \ on the chain. There is no stopping, censorship, and permission required to access\
    \ the application. It is necessary right now, since, everything in the tech world\
    \ is getting censored.\n- **Trustless system**: Unlike in centralized applications\
    \ where users trust companies to store their data in the safest possible way,\
    \ everything is end-to-end cryptographically secured in `DApps`.\n- **Security**:\
    \ Due to the use of end-to-end cryptography, `DApps` are secure and solid. Nothing\
    \ can be accessed, except by human error, as machines and networks do not leak\
    \ any data.\n- **No single point of failure**: Due to the decentralized nature\
    \ of the application, there is no single point of failure present in the system.\
    \ Unless there is a node in the network alive, the application will work.\n- **Payment**:\
    \ Since `DApps` runs on top of the Ethereum blockchain, there is no need to perform\
    \ third-party payment integration. Payment is facilitated in the crypto coins\
    \ and recorded in the chain.\n\nAs you can see, `DApp` points to some of the core\
    \ issues that we are facing right now. Censorship, financial frauds, documents\
    \ tampering, and elections rigging are some of the common issues currently being\
    \ faced. `DApps` and blockchain address these issues and help us evolve to the\
    \ next version of the Web, that is Web 3.0—internet by the people, for the people.\n\
    \nLet us look at the development stack of `DApps`.\n\n# DApps stack\n\nThe `DApps`\
    \ stack in Ethereum comprises of the following:\n\n- Frontend (`HTML`, `CSS`,\
    \ `JavaScript`)\n- Smart contracts\n- Data storage (`IPFS` and `Swarm Bee`)\n\
    - Decentralized message communication (`Whisper`)\n\nLet us understand them in\
    \ detail.\n\n## Frontend\n\nThe frontend of `DApps` can be written in the standard\
    \ technologies that have been used over the decades to build websites and applications.\n\
    \nUnlike the backend, where one needs to understand how Ethereum works and write\
    \ code in `Solidity`, the frontend can be written in `HTML`, `CSS`, and `JavaScript`,\
    \ which are widely used to build web applications.\n\nThis allows traditional\
    \ web developers to use familiar technologies and tools, frameworks, and libraries.\
    \ The communication to blockchain can be carried out via API or RPC calls.\n"
  raw: 'If you are using VS Code, it is recommended to install the Solidity extension.
    The steps to be taken are as follows:


    1. To install, click on the Extension icon in the VS Code left bar and search
    for solidity.


    2. Click on the Install button, and you are good to go.


    3. Assuming that you have Node.js installed, here is the process to install Hardhat.


    Hardhat is an Ethereum development framework suit, and it makes writing and deploying
    smart contracts easy and developer-friendly. Now, refer to the following steps:


    1. Run the following command to install Truffle in your machine:


    $ npm install –-save-dev hardhat


    2. Once it is installed, we can move ahead with the project.


    3. Create a new folder and navigate to it using the command line. Run this command
    to create a new Hardhat project.


    4. To create a folder:


    $ mkdir solidityDemo


    $ cd solidityDemo


    5. Then, run the following command:


    $ npx hardhat init


    It should provide the following output in the Terminal:


    ![](images/Picture_2.11.png)


    Now, open the project in your code editor. The structure of the project is as
    follows:


    contracts


    ignition


    test


    artifacts


    hardhat-config.js


    The contracts folder stores the code written in Solidity. The ignition folders
    contain the scripts to deploy contracts. The hardhat-config.js contains configuration
    options; we do not need to touch that file for our project.


    Switch to the contracts folder and you should see Lock.sol file and content should
    be similar to the following:


    pragma solidity ^0.8.24;


    contract Lock {


    uint public unlockTime;


    address payable public owner;


    event Withdrawal(uint amount, uint when);


    constructor(uint \_unlockTime) payable {


    require(


    block.timestamp < \_unlockTime,


    "Unlock time should be in the future"


    );


    unlockTime = \_unlockTime;


    owner = payable(msg.sender);


    }


    function withdraw() public {


    // Uncomment this line, and the import of "hardhat/console.sol", to print a log
    in your terminal


    // console.log("Unlock time is %o and block timestamp is %o", unlockTime, block.timestamp);


    require(block.timestamp >= unlockTime, "You can''t withdraw yet");


    require(msg.sender == owner, "You aren''t the owner");


    emit Withdrawal(address(this).balance, block.timestamp);


    owner.transfer(address(this).balance);


    }


    }


    Let us understand the program before moving ahead:


    1. The first line tells the compiler which version of solidity to use, it is important.
    Change the version of solc to your version if it is different from 0.8.24, as
    shown above.


    2. The second line declares a new contract and inside it contains different functions
    of the contract.


    3. Let us compile this program by running this command:


    $ npx hardhat compile


    It should return the following output in the console:


    ![](images/Figure_2.12.png)


    4. Now, let us deploy the contract. In a new terminal window, run this command
    to run a local Ethereum node to deploy smart contract.


    $ npx hardhat node


    5. Now, let us deploy the compiled contract to the local blockchain node. Run
    the following command to deploy it. Do ensure that you add localhost value in
    the network parameter.


    $ npx hardhat ignition deploy ./ignition/modules/Lock.js --network localhost


    It will deploy our smart contract in blockchain and return the transaction ID.
    This command should print something like this at your end:


    ![](images/Figure_2.13.png)


    You have successfully created, compiled, and deployed a smart contract in Ethereum
    blockchain.


    We have covered Solidity in brief in this section. It will help you gain experience
    in the static type language with state management.


    In the next section, we will learn about the DApps framework by Ethereum.


    ## [Decentralized Applications using Ethereum](#toc.xhtml#zh39)


    In this section, we will explore DApp development using the Ethereum platform.
    A DApp built with Ethereum is an application that executes smart contracts in
    the backend and hosts frontend in the decentralized network.


    In a nutshell, a DApp using Ethereum is composed of the following:


    • Frontend: HTML, CSS, JavaScript, and static files


    • Backend: Smart contracts, blockchain


    An application may require more than just smart contracts, and Ethereum provides
    the following projects to cover these needs:


    • Swarm: Decentralized storage network.


    • Whisper: Dynamic communication protocol.


    • Smart contracts: Turing complete programming language and interface:


    ![](images/Figure_2.14.png)


    Consider the following aspect of an application that may be decentralized:


    • Frontend


    • Backend


    • Storage


    • Communication


    • Name resolution


    Each of these aspects can be somewhat centralized or decentralized. For example,
    frontend can run as an independent centralized server, while backend is a smart
    contract running on blockchain. Storage can be used as decentralized, while name
    resolution can be a centralized service.


    At this moment, there is no hard and fast rule that all aspects of the application
    must be decentralized. You must use blockchain to put business logic in check
    with decentralization, and the rest can mix up with centralized service to improve
    user experience. Again, it is not necessary either.


    Let us check out the advantages of the DApps:


    • Resiliency: Business logic of the application is written in the smart contract,
    which, in turn, executes in blockchain. Unlike an application deployed on a centralized
    server, a DApp will have no downtime due to the network strength.


    • Transparency: Any interaction with DApp is stored in the blockchain. Anyone
    can check that in the chain and be sure about the code. DApp code, execution,
    and result are completely transparent with zero censorship.


    • Censorship resistance: As long as the network is up, anyone can access and use
    the application running on the chain. There is no stopping, censorship, and permission
    required to access the application. It is necessary right now, since, everything
    in the tech world is getting censored.


    • Trustless system: Unlike in centralized applications where users trust companies
    to store their data in the safest possible way, everything is end-to-end cryptographically
    secured in DApps.


    • Security: Due to the use of end-to-end cryptography, DApps are secure and solid.
    Nothing can be accessed, except by human error, as machines and networks do not
    leak any data.


    • No single point of failure: Due to the decentralized nature of the application,
    there is no single point of failure present in the system. Unless there is a node
    in the network alive, the application will work.


    • Payment: Since DApps runs on top of the Ethereum blockchain, there is no need
    to perform third-party payment integration. Payment is facilitated in the crypto
    coins and recorded in the chain.


    As you can see, DApp points to some of the core issues that we are facing right
    now. Censorship, financial frauds, documents tampering, and elections rigging
    are some of the common issues currently being faced. DApps and blockchain address
    these issues and help us evolve to the next version of the Web, that is, Web 3.0—internet
    by the people, for the people.


    Let us look at the development stack of DApps.


    ## [DApps stack](#toc.xhtml#zh40)


    The DApps stack in Ethereum comprises of the following:


    • Frontend (HTML, CSS, JavaScript)


    • Smart contracts


    • Data storage (IPFS and Swarm Bee)


    • Decentralized message communication (Whisper)


    Let us understand them in detail.


    ### [Frontend](#toc.xhtml#zs30)


    The frontend of DApps can be written in the standard technologies that have been
    used over the decades to build websites and applications.


    Unlike the backend, where one needs to understand how Ethereum works and write
    code in Solidity, the frontend can be written in HTML, CSS, and JavaScript, which
    are widely used to build web applications.


    This allows traditional web developers to use familiar technologies and tools,
    frameworks, and libraries. The communication to blockchain can be carried out
    via API or RPC calls.'
