    \ keys.senderPublicKey, keys.privateKey);\n\nreturn result;\n\n}\n\ncatch(e) {\n\
    \nconsole.log(e);\n\nreturn null;\n\n}\n\n}\n\nmodule.exports = decryptEmail;\n\
    ```\n\n在解密部分，我们正在使用与电子邮件相关的公钥以及接收者的 `privateKey` 来解密邮件。这样一来，你只能读取与你的公钥相关的电子邮件。这反过来使得数据非常安全，并且不容易被拦截。\n\
    \n让我们来看服务器代码。打开 `index.js` 文件并查看代码。\n\n首先，按照惯例，我们导入了所有需要的模块：\n\n```javascript\n\
    const express = require(\"express\");\n\nconst bodyParser = require(\"body-parser\"\
    );\n\nconst redis = require(\"redis\");\n\nconst session = require(\"express-session\"\
    );\n\nconst redisStore = require(\"connect-redis\")(session);\n\nconst cookieParser\
    \ = require(\"cookie-parser\");\n\nconst app = express();\n\nconst client = redis.createClient();\n\
    \nconst router = express.Router();\n\nconst db = require(\"./db\");\n```\n\n为了确保应用程序的安全，我们使用会话（sessions）在浏览器中安全地维护用户数据。\n\
    \n为了在服务器上存储会话信息，我们使用了 `Redis`，这是一个键值存储器。我们使用 `Redis` 而不是 `OrbitDB` 中的会话存储的原因是因为其点对点的特性。\n\
    \n我们不希望将一个用户的会话共享给其他节点。如果这样做，黑客可能会劫持会话并从中获取关键信息。\n\n`Redis` 运行在每个节点上，并仅为连接到节点的用户维护会话。这里是我们使用\
    \ `Redis` 作为会话存储的代码：\n\n```javascript\n// session middleware\n\napp.use(\n\nsession({\n\
    secret: \"some-random-words\",\nstore: new redisStore({\nhost: \"localhost\",\n\
    port: 6379,\nclient: client,\nttl: 10000\n}),\nsaveUninitialized: false,\nresave:\
    \ false\n});\n);\n```\n\n`Redis` 默认运行在 `6379` 端口。如果你更改了它，请同步修改代码中。\n\n一旦用户执行了登录操作，我们只需使用以下代码为该请求设置会话：\n\
    \n```javascript\n// set session\n\nreq.session.key = {\nuserId: response.data.userId,\n\
    email: response.data.email,\npublicKey: response.data.publicKey\n };\n```\n\n\
    我们存储了 `userId`、`email` 地址和 `publicKey` 等信息，以便在每个请求中识别用户。\n\n要检查请求是否设置了会话，我们通过检查会话键是否存在：\n\
    \n```javascript\nif (req.session.key) {\n// 用户已登录\n} else {\n// 用户无效，重定向到登录页面\n\
    }\n```\n\n所有的前端代码都放在 `view` 文件夹中。代码库非常简单；我们使用简单的 JavaScript 进行 API 调用并更改屏幕。\n\n\
    你可以使用以下命令运行程序：\n\n```\nnode index.js\n```\n\n你应该能看到与下方截图类似的终端屏幕：\n\n![](img/Figure_7.5.png)\n\
    \n如果你是第一次运行，由于创世节点（genesis peer）操作，你会收到不同的控制台消息。\n\n如果你在本地机器运行，请在浏览器导航到 `localhost:3000`；如果在服务器上运行，请访问服务器地址。\n\
    \n如果你的屏幕与我们之前在本节开头展示的相似，将会有帮助。这个应用程序的一个有趣之处是，只有当双方都参与了联系人共享操作时，才能发送和接收电子邮件。\n\n\
