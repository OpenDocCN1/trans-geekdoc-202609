    \ in your Terminal:\n\n$ ipfs --h\n\nIt will print all the available commands\
    \ in your Terminal screen like the following figure:\n\n![](images/Figure_6.8.png)\n\
    \nThere are two types of IPFS commands:\n\n• Offline: These commands can be executed\
    \ without running an IPFS instance.\n\n• Online: These commands require an IPFS\
    \ node running in your system.\n\nYou can check all the command details on the\
    \ IPFS official website: https://docs.ipfs.io/reference/api/cli/\n\nNow, let us\
    \ learn how to configure IPFS running in your system or in a cloud server to meet\
    \ your application requirements.\n\n### [Configuring Interplanetary File System\
    \ node](#toc.xhtml#zs52)\n\nIPFS stores the configuration in a file located at\
    \ the home folder location of any operating system. The configuration is stored\
    \ as a JavaScript Object Notation (JSON) file. You can view the file at ~/.ipfs/config.\n\
    \nOpen the file in your editor to view the contents. Let us understand the key\
    \ aspects of the configuration.\n\n#### [Addresses](#toc.xhtml#za06)"
