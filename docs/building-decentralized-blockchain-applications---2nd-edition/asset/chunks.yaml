    \ first Solidity program, and any doubts you have will be cleared by going through\
    \ the preceding example code.\n\n## [Writing our first Solidity program](#toc.xhtml#zh38)\n\
    \nLet us write our first smart contract. You must have the following things installed\
    \ in your machine:\n\n• Node.js\n\n• Hardhat\n\n• Solc\n\nYou can choose the code\
    \ editor of your choice, but it is highly recommended that you use Visual Studio\
    \ Code (VS Code) editor.\n\nYou can download the editor from the official website\
    \ through the following link: https://code.visualstudio.com/"
