  trans: '

    以太坊还开发了一个名为 `web3.js` 的 JavaScript 库，用于将 DApp 的前端与后端打包。


    `Web3.js` 为传统的 Web 开发人员提供了一种简单熟悉的方法来构建可以通过浏览器与区块链通信的去中心化应用。


    让我们来看看后端，即智能合约栈。


    ### 智能合约


    在 DApps 中，智能合约用于编写应用程序的业务逻辑和相关函数。你可以将智能合约看作是传统应用程序中的服务端（即后端）。


    开发者必须记住，在智能合约中执行的任何计算以太坊来说都是昂贵的，应该尽可能保持简洁。因此，识别应用程序中需要在去中心化平台上运行的各个至关重要：


    • 智能合约允许你构建此类应用程序：其中智能合约网络相互调用并传递数据，在此过程中读取和写入它们的状态变量。


    • 智能合约架构设计中需要注意的一个大点是，合约一旦部署就无法更改代码。


    • 如果智能合约编写了可用的 `self-destruct` 操作码，则可以删除它，但除此之外，代码无法以任何方式进行更改。


    • 另一个需要注意的大点是 DApps 的体积应该尽可能轻量。一个巨大的智能合约执行起来可能花费过多的以太坊，导致效率低下。


    • 作为开发者，你应该只将业务逻辑保留在智能合约中。存储可以通过中心化服务处理，也可以使用 `Swarm` 或 `IPFS`。


    让我们审视一下存储栈，并了解如何将存储部分与智能合约分离，从而避免构建一个在区块链上运行成本昂贵的巨大合约。


    ### 存储


    由于执行合约的成本很高，智能合约不是存储或处理照片、视频等大量数据的良好选择。


    因此，DApps 应该利用离链数据存储服务，这意味着它们将以太坊链上的大量数据存储在数据存储平台上。


    数据存储平台可以是中心化的（例如，Amazon 或 Azure 等典型的云数据库），也可以是去中心化的，存储在如 `IPFS` 或以太坊自身的 `Swarm`
    平台等 P2P 网络上。


    去中心化 P2P 网络存储是存储和分图像、视频和普通文件等静态资源等大型资源的理想选择。


    让我们看看写本书时可用的去中心化 P2P 存储的选项。


    #### IPFS


    `IPFS` 是一个用于存储和共享内容的去中心化 P2P 网络。`IPFS` 是 Protocol Labs 团队的项目，并使用内容寻址；因此，唯一的哈希值可以识别网络中的每个文件。你可以使用网络中任何节点的哈希值检索文件。


    `IPFS` 旨在取代 `HTTP` 协议用于 Web 的标准内容分发。`IPFS` 有一个网络，任何人都可以成为其中的一部分，就像比特币或以太坊一样。


    在下一章中，我们将深入学习 `IPFS`。让我们来看看下一个去中心化 P2P 网络存储。


    #### Swarm Bee


    `Swarm Bee` 是以太坊基金会的项目。它是一个内容寻址 P2P 存储系统，与 `IPFS` 非常相似，允许你使用网络托管并访问网站。


    让我们运行一个简单的 `Swarm Bee` 实例并亲自检查。


    你可以从以下链接对应所需操作系统的官网下载 `Bee`：`https://docs.ethswarm.org/docs/bee/installation/install`


    上述文档链接中提到了不同操作系统的下载和安装说明。对于 Mac，安装命令使用 `homebrew`。请确保你的 Mac 机器上安装了 `homebrew`。


    这里是安装命令。


    ```bash

    brew tap ethersphere/tap

    brew install swarm-bee

    ```


    如果你想从默认配置运行 `bee`，可以使用以下命令：


    ```bash

    brew services start swarm-bee

    ```


    我们也可以使用 `Swarm Desktop` 在我们的机器上轻松运行它进行测试。


    前往 `https://www.ethswarm.org/build/desktop` 并下载适用于你操作系统的 `Swarm Bee` 桌面版。


    一旦安装并运行 `Swarm Bee Desktop`，你可以通过浏览器导航到 `localhost:3054/dashboard` 来访问 `Swarm
    Bee` 网关。


    你应该能看到如下图类似的屏幕：


    ![](img/Figure_2.15.jpeg)


    为了上传文件并访问它们，我们需要连接钱包来获取加密货币 `xBZZ` 或 `DAI` 并使用它们。IMG。


    如果你进入 `Settings`（设置），我们可以发现它连接的区块链，也可以将其更改为自定义区块链节点：


    ![](img/Figure_2.16.png)


    `Swarm Bee` 已准备就绪，可以作为去中心化文件存储系统使用。


    好了，让我们访问 DApps 栈中的最后部分。


    ## 去中心化消息通信协议


    任何分布式应用中的关键组件之一都是进程间通信。应用程序必须能够通过某种媒介与其他实例通信，在维护状态的同时交换数据。


    在传统应用程序中，消息队列和进程间通道是处理此类通信的方法。这些消息队列本质上是中心化的，为系统了另一个单点故障。


    在 DApps 中，通信是通过 P2P 消息协议完成的。写本书时，DApps 最显著且广泛接受的通信协议是 `Waku` - `https://waku.org/about/`。


    以太坊还提供了一种名为以太坊命名服务 (`ENS`) 的服务。开发者可以使用 `ENS` 将基于哈希的资源指向像 DNS 那样更易读的名字。


    ## 结论


    在本章中，我们详细探讨了以太坊。我们学习了愿景、平台以及如何使用以太坊。我们还学习以太坊的不同部分，如 `EVM` 和智能合约，并构建了一个简单的应用程序来查看智能合约是如何工作的。我们查看了使用以太坊构建
    DApps，并探索了构建 DApp 所需各种协议。


    在下一章中，我们将深入学习 `IPFS`。我们将构建一个使用 `IPFS` 的应用程序并部署它，以查看它的实时运行情况。

    '
