    然后，我们检查此节点是否为初始节点，即系统中的第一个节点。我们通过加载 `dbaddress.js` 文件来检查这一点。如果该文件存在，我们就加载文件中写入的数据库：\n\
    \n```javascript\nfs.access(filePath, fs.F_OK, async (err) => {\n  if(err) {\n\
