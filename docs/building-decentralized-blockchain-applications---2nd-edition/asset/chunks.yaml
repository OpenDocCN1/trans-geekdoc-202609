    2 个比特币。第一个输出将用接收者的密钥锁定，以便他们解锁它。第二个输出是你的钱，因此它将再次用你的凭据锁定，以供将来使用。


    简而言之，当一个新交易形成时，整个金额都包含在交易负载中。剩余的所有部分将作为输出发送回给你。


    因此，这种基于图的输入和输出结构提供了比特币的所有权历史。


    ### 费用


    比特币中的每笔交易都会以比特币的形式向矿工支付一定金额的费用。交易输出的剩余部分也与费用相关，并支付给矿工作为他们工作的报酬。


    通常情况下，通过增加丰厚的费用，矿工有很大概率从内存池中选取你的交易并将其添加到下一个区块。然而，这完全是可选的。如果你当时没有支付费用，可能需要一些时间，但你的交易将由遍世界各地的矿工挖掘。


    这里是与交易相关的费用。你也可以检查矿工奖励，在更新本书时该奖励为 3.125 个比特币：


    ![](img/Figure_1.11.png)


    | 注意：交易的剩余部分也将作为费用支付给矿工。假设你想向某人支付 5 个比特币，而你的钱包里大约 10 个比特币，如果你不在交易的输出部分申领剩余的 5
    个比特币，它们将支付给矿工。这是不可退的，因为区块链是不可篡变的！因此，在程序化构建交易负载之前请反复检查。 |


    | --- |


    ### 重量


    如其名，它指的是交易的大小，即其权重。在引入权重之后，交易负载是通过将验证部分放在负载末尾来形成的，而不是像我们之前那样放在每个输入中。


    ### UTXO


    当形成一个新交易并生成一个新输出时，被花费或发送给其他用户的输出不能再次被花费。然而，留下的或未花费的输出可以在未来的交易中使用。


    这些未花费的输出被称为 UTXO。


    UTXO 用于计算特定用户的余额，并验证他们是否有足够的金额进行花费。UTXO 是形成新交易和防止双花费的关键部分。


    这些是涉及比特币交易的关键因素。


    我们希望你理解了这些概念以及为了让比特币和区块链变成现在这样进行技术更改的原因。在下一节中，我们将讨论构建基于区块链技术分支应用的独特方法之一——去中心化应用（DApps）。


    ## 区块链与去中心化


    加密货币是区块链的一个子集，就像互联网的电子邮件。


    正如我们在之前的章节中所学的，区块链是一个基于点点共识的计算机网络。每台计算机相互通信并交换数据。


    因为它没有涉及中央机构。


    ### 去中心化应用


    加密货币是区块链的一个子集，就像互联网的电子邮件。


    正如我们在之前的章节中所学的，区块链是一个基于点点共识的计算机网络。每台计算机相互通信并交换数据。


    因为它没有涉及中央机构。


    ### 去中心化应用的工作


    想象你有 5 个比特币，你想给朋友发送 3 个比特币。在这里，你持有的 5 个比特币是你的输出，它被拆分为两个输出。其中一个价值 3 个比特币，另一个价值
    2 个比特币。第一个输出将用接收者的密钥锁定，以便他们解锁它。第二个输出是你的钱，因此它将再次用你的凭据锁定，以供将来使用。


    ### DApps 协议


    比特币使用区块链来存储实际货币，基本上于此。比特币之后的下一个大事件是以太坊，它引入了被称为智能合约的东西。


