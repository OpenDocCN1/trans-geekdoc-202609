    \n });\n\n});\n\nIn the first route, we are delivering the home page to the user.\
    \ We will look over that code in a moment.\n\nIn the next route, we are trying\
    \ to upload the file in our system. Once the file is uploaded locally, we are\
    \ reading the file and converting it in the buffer and then adding it into IPFS\
    \ using the function we wrote earlier.\n\n7. Once IPFS returns us the hash of\
    \ the file, we are returning it to the user in a hyperlink so that the user can\
    \ view it in the browser.\n\n| Note: Change this line to your custom IPFS host\
    \ and port if you have made any changes. |\n\n| --- |\n\nlet link = \\`http://localhost:8080/ipfs/${response\\\
    [0\\].hash}\\`;\n\n8. Now, let us look at the last piece of HTML code. Create\
    \ a new file and name it index.html, and copy paste the following code:\n\n<html>\n\
    \n<head>\n\n<title>File upload using IPFS</title>\n\n</head>\n\n<body>\n\n<h1>File\
    \ upload system using IPFS</h1>\n\n<form id=\"uploadForm\"\n\nenctype=\"multipart/form-data\"\
    \n\naction=\"/api/photo\"\n\nmethod=\"post\">\n\n<input type=\"file\" name=\"\
    userPhoto\" />\n\n<input type=\"submit\" value=\"Upload Image\" name=\"submit\"\
    ><br />\n\n<span id = \"status\"></span>\n\n</form>\n\n</body>\n\n<script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\n\
    <script src=\"http://cdnjs.cloudflare.com/ajax/libs/jquery.form/3.51/jquery.form.min.js\"\
    ></script>\n\n<script>\n\n $(document).ready(function() {\n\n $('#uploadForm').submit(function()\
    \ {\n\n $(\"#status\").empty().text(\"File is uploading...\");\n\n$(this).ajaxSubmit({\n\
    \nerror: function(xhr) {\n\nstatus('Error: ' + xhr.status);\n\n},\n\nsuccess:\
    \ function(response) {\n\n $(\"#status\").empty().html(response);\n\n}\n\n});\n\
    \nreturn false;\n\n}); \n\n});\n\n</script>\n\n</html>\n\nIn the preceding code,\
    \ we have included jQuery and jQuery form library from the official content delivery\
    \ network (CDN).\n\n9. We have created a form that submits the file data in a\
    \ multipart format to the API we have created in app.js:\n\n<form id=\"uploadForm\"\
    \n\nenctype=\"multipart/form-data\"\n\naction=\"/api/photo\"\n\nmethod=\"post\"\
    >\n\n<input type=\"file\" name=\"userPhoto\" />\n\nNotice the action attribute\
    \ and input name. It must be the same as the API route and multer file section\
    \ attribute.\n\nIn the JavaScript code, we are listening to the response from\
    \ the server and printing the output. We are also using AJAX to upload files to\
    \ avoid page refresh.\n\n10. It is time to run the code. Run the following command\
    \ in the Terminal/Command Prompt:\n\n$ node app.js\n\nYour Terminal should print\
    \ a message saying:\n\nWorking on port 3000\n\nIt means the app is running successfully.\
    \ Navigate to localhost:3000 to view the application. It should look like this:\n\
    \n![](images/Figure_6.11.png)\n\n11. Now, select a file from your system and hit\
    \ the Upload Image button. You should see a response like this:\n\n![](images/Figure_6.12.png)\n\
    \n12. Now, click on the here to view the image in the IPFS network."
