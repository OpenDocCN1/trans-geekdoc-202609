  raw: "**[https://discord.bpbonline.com](https://discord.bpbonline.com)**\n\n![](images/Discord.png)\n\
    \n# [CHAPTER 10  \n\n**DTube**](#toc.xhtml#zc10)\n\n## [Introduction](#toc.xhtml#zh108)\n\
    \nIn this chapter, we will learn about DTube, a decentralized version of YouTube.\
    \ It is a video hosting service managed by the network and peers instead of a\
    \ centralized authority. DTube allows content creators to earn cryptocurrency\
    \ without showing ads. So, there are no tracking, privacy concerns, and moderations\
    \ that we have in the existing services.\n\n## [Structure](#toc.xhtml#zh109)\n\
    \nIn this chapter, we will learn the following:\n\n• Introduction to DTube\n\n\
    • Features of DTube\n\n• DTube architecture\n\n• Workings of DTube\n\n## [Objective](#toc.xhtml#zh110)\n\
    \nAfter reading this chapter, you will learn the basics of DTube and understand\
    \ the features of DTube. You will also learn the technologies that run DTube,\
    \ that is, decentralized video hosting service.\n\n## [Introduction to DTube](#toc.xhtml#zh111)\n\
    \nDTube is the world’s first decentralized video hosting service. It is an ad-free\
    \ and fair platform for content creators and viewers.\n\nYou can visit DTube by\
    \ clicking on the following DTube website: https://d.tube/.\n\nThe website looks\
    \ like the following figure:\n\n![](images/IMG_10_01.png)\n\nDTube runs on the\
    \ Steem blockchain and stores content on Interplanetary File System (IPFS). We\
    \ have studied IPFS in detail in Chapter 6, Interplanetary File System; let us\
    \ understand the Steem blockchain in a nutshell.\n\n### [Steem blockchain](#toc.xhtml#zs70)\n\
    \nSteem is a social blockchain network that allows users to create content and\
    \ get paid for it without showing ads. Steem mints its cryptocurrency coin and\
    \ shares it with the content creator and users who engage with the content via\
    \ upvotes or comments.\n\nIt also allows developers to build their applications\
    \ on top of Steem blockchain.\n\nClick the following link to visit the website\
    \ and learn more about it: https://steem.com/.\n\nDTube uses IPFS to store content.\
    \ It also shows the power of distributed file storage service that can play a\
    \ major role in applications, like video hosting services.\n\nAs a user, you can\
    \ create an account on DTube and watch videos. You can upvote videos, comment\
    \ on them, and earn cryptocurrency for that engagement.\n\nLet us check out some\
    \ features of DTube.\n\n## [Features of DTube](#toc.xhtml#zh112)\n\nDTube has\
    \ the following features for consumers and content creators:\n\n• Content ownership\
    \ to the content creator.\n\n• Zero moderation and censorship.\n\n• Payment is\
    \ based on the engagement on the content.\n\n• Payment to content consumers based\
    \ on engagement.\n\n• Zero transaction fees.\n\n• Decentralized content storage\
    \ using IPFS.\n\n• Channel creation, subscription, and alerts are similar to YouTube.\n\
    \n• Minimal learning curve due to features similarity with YouTube.\n\nNow, let\
    \ us understand the architecture of DTube.\n\n## [DTube architecture](#toc.xhtml#zh113)\n\
    \nDTube employs multiple technologies to make the site work, and the architecture\
    \ consists of the following technologies:\n\n• Frontend: JavaScript Meteor framework.\n\
    \n• Distributed blockchain database: Avalon\n\n• Media storage: Steem and IPFS.\n\
    \nLet us learn, in brief, about the architecture components of DTube:\n\n• Frontend:\
    \ DTube frontend is built on HTML, CSS, and JavaScript. It uses a popular JavaScript\
    \ framework called Meteor to build single page applications (SPAs)\n\n• Distributed\
    \ blockchain database: DTube uses a distributed database called Avalon. It is\
    \ a database built for blockchain-based applications, specifically for social\
    \ networking applications like DTube.\n\n• Media storage:\n\n○ DTube uses IPFS\
    \ and Steem to manage storage. It uses IPFS to store content in the network and\
    \ Steem to record the engagement on the content created by the user.\n\n○ Let\
    \ us understand how DTube works.\n\n## [Workings of DTube](#toc.xhtml#zh114)\n\
    \nIn DTube, you can create an account and watch videos, just like on YouTube.\n\
    \nThe only difference here is that you do not see ads. As a content consumer,\
    \ if you upvote a video and become part of the conversation in the comments, you\
    \ are paid based on how valuable your contribution to the content is.\n\nYou can\
    \ create your channel, upload your content, and get paid based on how good your\
    \ content is and how many people are engaged in the form of views, votes, and\
    \ comments.\n\nYou might ask where the cryptocurrency is coming from. Well, Steem\
    \ blockchain mints new Steem coins every 24 hours to distribute to the network.\n\
    \nDTube uses Avalon blockchain to store the content uploaded to the site. Along\
    \ with Avalon blockchain, it uses IPFS to store static files, such as videos,\
    \ photos, features, and images.\n\nDTube has its coin called DTube Coin (DTC).\
    \ Avalon blockchain mints DTC every day to distribute it to the users, and it\
    \ is called a reward pool.\n\nContent creators are paid based on the engagement\
    \ on the content, and engagement, such as page views, votes, and comments decide\
    \ the payments in the form of DTC.\n\nIn a nutshell, this is how DTube works.\
    \ DTube is an open-source project, and you can check out the source code at the\
    \ DTube GitHub: https://github.com/dtube.\n\n## [Conclusion](#toc.xhtml#zh115)\n\
    \nIn this chapter, we learned that DTube is an extremely interesting and user-friendly\
    \ decentralized application. It uses technologies we are already familiar with\
    \ and provides a safe and content-focused alternative to YouTube.\n\nIn the next\
    \ chapter, we will learn about the Ocean Protocol—a decentralized marketplace\
    \ to exchange data.\n\n**Join our book’s Discord space**\n\nJoin the book’s Discord\
    \ Workspace for Latest updates, Offers, Tech happenings around the world, New\
    \ Release and Sessions with the Authors:\n\n**[https://discord.bpbonline.com](https://discord.bpbonline.com)**\n\
    \n![](images/Discord.png)\n\n# [CHAPTER 11  \n\n**Ocean Protocol**](#toc.xhtml#zc11)\n\
    \n## [Introduction](#toc.xhtml#zh116)\n\nIn this chapter, we learn about Ocean\
    \ Protocol as a decentralized data exchange protocol developed for information\
    \ exchange by people and to earn cryptocurrency to either sell or consume data.\
    \ Ocean Protocol developed a decentralized way to buy/sell data with a focus on\
    \ privacy. We will also look at its use cases and workings.\n\n## [Structure](#toc.xhtml#zh117)\n\
    \nIn this chapter, we will cover the following topics:\n\n• Introduction to Ocean\
    \ Protocol\n\n• Use cases of Ocean Protocol\n\n• Workings Ocean Protocol\n\n•\
    \ Ocean Protocol architecture\n\n## [Objectives](#toc.xhtml#zh118)\n\nAfter reading\
    \ this chapter, you will be able to understand the basics of Ocean Protocol and\
    \ learn how Ocean Protocol works.\n\n## [Introduction to Ocean Protocol](#toc.xhtml#zh119)\n\
    \nYou probably think of real estate, stocks, oil, and water as the largest assets\
    \ in the market. \n\nHowever, the biggest asset in the world right now is data.\
    \ As the saying goes: Data is the new oil.\n\nBut who owns data? I guess you already\
    \ know the answer. It is Google, Facebook, and other so-called free services that\
    \ own the data generated by you. They use this data to train their algorithms\
    \ or, worse, manipulate voters during elections (You can read about the Cambridge\
    \ Analytica scandal in the 2016 elections of United States, to get in-depth information).\n\
    \nThese large conglomerates do not share this data with parties that need it.\
    \ For example, a cancer researcher can use such data to perform a predictive analysis.\
    \ It is almost impossible to find as much data as these companies possess.\n\n\
    Ocean Protocol is developed to tackle this problem. It provides a secure and privacy-focused\
    \ platform to exchange data with monetary benefits. Data owners can share data\
    \ by keeping the privacy, and data consumers can access data after paying the\
    \ owner the requested amount in cryptocurrency.\n\nYou can use Ocean Protocol\
    \ to set up your marketplace that enables users to buy/sell data. Ocean Protocol\
    \ will manage the security and privacy of the transaction.\n\nLet us learn about\
    \ the features of the Ocean Protocol.\n\n## [Use cases of Ocean Protocol](#toc.xhtml#zh120)"
