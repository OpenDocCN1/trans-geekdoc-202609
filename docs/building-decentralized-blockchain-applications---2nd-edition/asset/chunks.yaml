    As in the preceding screenshot, the `IPFS Stack` is divided into three subset
    layers:


    • Networking layer

    • Data definition and naming layer

    • Data layer


    Let us look at each sub stack in brief.


    ## Networking layer


    One of the core challenges in the decentralized web is the peer-to-peer network,
    and designing the protocols that work in a peer-to-peer network in parallel to
    the centralized system.


    The `libpeer-to-peer` project addresses this challenge with protocols labs. `libpeer-to-peer`
    provides the modular stack that one can use to build a peer-to-peer network in
    conjunction with existing protocols such as `WebRTC` or any new transport layer
    protocols.


    So, `libpeer-to-peer` is transported agnostics.


    The features of `libpeer-to-peer` are:


    • `libpeer-to-peer` is a modular networking stack. You can use all of it or use
    part of the stack to build your application.

    • `libpeer-to-peer` provides transport and peer-to-peer protocols to build large,
    robust, and scalable network applications.

    • `libpeer-to-peer` is transport protocol agnostics. It can work with `TCP`, `UDP`,
    `WebRTC`, `WebSockets`, and `UDP`.

    • `libpeer-to-peer` offers several modules such as transport interface, discovery,
    distributed hash lookup, peer discovery, and routing.

    • `libpeer-to-peer` offers built-in encryption to prevent eavesdropping.

    • `libpeer-to-peer` offers built-in roaming features so that your service can
    switch networks without any intervention and loss of packets.


    `libpeer-to-peer` is the solution upon which the networking layer of peer-to-peer
    can be built.


    ## Data definition and naming layer


    Content addressing through hashes is widely used in a distributed system. We use
    hash-based content addressing in `Git`, `cryptocurrencies`, and so on. The same
    is also used in peer–to-peer networking.


    `IPLD` provides a unified namespace for all hash-based protocols. Using `IPLD`,
    data can be traversed across various protocols to explore and view the data spread
    across a peer-to-peer network.


    `IPNS` is a system to create a mutable address for the contents stored on `IPFS`.
    The reason why they are mutable is because the addresses of the content change
    every time the content changes.


    ## Data layer


    The topmost layer in the stack is the data layer. The `IPFS` is the peer-to-peer
    hypermedia protocol. `IPFS` provides a way to store and retrieve data across a
    peer-to-peer network.


    It uses `IPNS` and `libpeer-to-peer` to create, name, and distribute content across
    a peer-to-peer network.


    Anyone can become an `IPFS` peer and start looking for the content using hashes.
    An `IPFS` peer does not need to store all the data, they only need to store the
    data created by them, or the data they have searched for in the past.


    The features of `IPFS` include the following:


    • `IPFS` provides peer-to-peer hypermedia protocols for web 3.0.

    • `IPFS` can work with existing protocols and browsers. It gives a smooth transition
    from centralized web to web 3.0.

    • `IPFS` uses `libpeer-to-peer` to support peer-to-peer networking.

    • `IPFS` data is cryptographically secure.

    • `IPFS` can save tons of bandwidth in streaming services.


    `IPFS` is under development, and there are some great applications built by developers
    that are running on top of the `IPFS`. One of the applications of our choice is
    `DTube`.


    It is a decentralized version of YouTube with a built-in incentive and reward
    feature provided by `Steem` blockchain.


    `IPFS` is also trying to solve the incentive issue. We cannot expect every person
    connected to the internet to act as a peer. To provide an incentive to those who
    participate and contribute value to the network, `IPFS` has created a coin called
    `Filecoin`, which can be paid to peers in the network by the user.


    Other projects that we will learn about in the upcoming chapters are as follows:


    • `OrbitDB`: Peer-to-peer database

    • `Amazon QLDB`: Distributed immutable database

    • `Ocean Protocol`: Data exchange protocol


    These protocols provide the capability a developer needs to build a next-generation
    `DApps`. We will learn about these protocols in detail in the upcoming chapters.


    ## Conclusion


    We explored the blockchain and its basic components in this chapter. We also studied
    `Bitcoin` and its working in detail, along with the way it handles double spending
    issues and so on. We then moved to `DApps` and understood the protocols and frameworks
    required to build `DApps` in brief.


    In the next chapter, we will learn about `Ethereum` and its working in detail.
    We will also learn about the `Ethereum` protocols for `DApps`.


