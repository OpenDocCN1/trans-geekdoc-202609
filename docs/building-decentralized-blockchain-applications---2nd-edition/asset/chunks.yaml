  trans: "\n用户可以在以下屏幕上编写新邮件，就像使用 Gmail 或任何基于网页的电子邮件应用程序一样：\n\n![](img/Figure_7.3.png)\n\
    \n在这里，用户可以检查联系人并添加/删除：\n\n![](img/Figure_7.4.png)\n\n## 技术\n\n以下是我们的技术栈：\n\n-\
    \ 前端：HTML, CSS, JavaScript 和 jQuery\n- 后端：OrbitDB, IPFS\n- 中间层：Node.js\n\n我们使用\
    \ `Node.js` 来处理 API 系统，以便前端与数据库通信，并使用 `OrbitDB` 文档存储数据模型存储用户信息和邮件信息。让我们来看看应用程序的架构。\n\
    \n### 架构\n\n我们正在构建一个点对点的电子邮件应用程序。在这种方法中，我们在每个节点之间共享同一个数据库。为了实现这一点，我们首先需要在初始节点（genesis\
    \ peer）中创建一个数据库，所有其他节点必须复制相同的数据库。\n\n一旦创建了初始节点和数据库，另一个节点就可以复制数据库，更改将使用我们之前学习过的\
    \ `IPFS` 发布/订阅（pub/sub）技术进行同步。\n\n我们的邮件技术与传统的电子邮件系统也有所不同。在传统系统中，我们使用`简单邮件传输协议\
    \ (SMTP)`来发送和接收邮件。\n\n在我们的系统中，我们使用 `IPFS` 发布/订阅来同步更改，以便所有人拥有相同的数据副本，因此发送/接收的邮件将保持同步。\n\
    \n在传统系统中，如果你有任何人的电子邮件地址，就可以向其发送邮件。在我们的系统中，你只能向已添加到联系人且你拥有其公钥的用户发送邮件。\n\n我们使用接收者的公钥和发送者的私钥对邮件进行加密，以确保极其安全。只有持有正确私钥的接收方才能解密邮件并查看内容。\n\
    \n这是一个点对系统中非常重要的概念，因为任何人都可以成为网络的一部分并查看你的数据。必须确保它是安全的且不易访问的。\n\n`Node.js` 服务器处理我们的前端，而节点本身处理与数据库的其余通信。让我们来看以下项目目录：\n\
    \n- `package.json`:包含所有所需的包。\n- `node_modules`:包含项目所需模块的文件夹。\n- `orbitdb`: 数据库文件的文件夹。\n\
    - `views`: 包含前端文件的文件夹。\n- `utils`: 包含应用程序中可复用代码的文件夹。\n- `dbaddress.js`:包含数据库地址的文件。\n\
    - `index.js`: 包含服务器代码。\n- `db.js`: 包含数据库相关的代码。\n\n让我们理解接下来的代码。由于代码库很大，并不是所有内容都已粘贴在这里。我们将理解重要的代码片段以及如何运行程序。对于本章中未解释的代码的任何疑问，读者可以联系作者。\n\
    \n首先，让我解释一下我们如何在初始节点中创建数据库并处理多个节点之间的发布/订阅。打开 `db.js` 文件并查看以下代码。我们正在导入处理数据库所需的所需的模块：\n\
    \n```javascript\nconst IPFS = require('ipfs-api');\nconst OrbitDB = require('orbitdb');\n\
    const uuid = require('uuid/v4');\nconst bcrypt = require('bcrypt');\nconst fs\
    \ = require('fs');\nconst Identities = require('orbit-db-identity-provider');\n\
    ```\n\n我们创建了一个名为 `loadDB()` 的函数，在其中我们添加了建立数据库连接并将其加载到内存中的必要代码：\n\n```javascript\n\
    async function loadDB() {\n………...\n}\n```\n\n为了启用发布/订阅以便我们的节点能够相互通信，我们在 `IPFS`\
    \ 配置中传递了以下参数：\n\n```javascript\nEXPERIMENTAL: {\n  pubsub: true\n},\nrelay: {\n\
