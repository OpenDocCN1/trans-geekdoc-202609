    - **Nethermind**: 使用 `C#` 和 `.Net` 框架编写。

    - **Besu**: 使用 `Java` 语言编写。

    - **Erigon**: 使用 `Go` 语言编写。

    - **Reth**: 使用 `Rust` 语言编写。

    - **EthereumJS**: 使用 `TypeScript` 编写，在编写本书时尚处于测试阶段。


    我们将学习一个最常用的客户端之一——`Geth`，它也算是一种官方的以太坊客户端，因为以太坊基金会负责管理它。


    在我们的机器上运行这些客户端之前，让我们先了解以太坊网络的类型以及我们应该使用哪一种。


    ## 以太坊网络


    以太坊网络分为两类：


    - **主网 (Mainnet)**（也称为全节点）：处理真实以太坊（即货币）的活跃网络。

    - **测试网 (Testnet)**：为研究设计的测试网络。


    如前所示，`testnet` 最适合开发，而 `mainnet` 是实际的 P2P 网络。


    在你的机器上运行 `mainnet` 会产生硬件资源成本和带宽消耗。不建议在本地机器上运行它。你可以在 `testnet` 节点上完成你需要做的一切。


    我们还可以使用像 `Ganache` 这样的私有区块链或像 `Infura` 这样的云客户端供应商。我们将在章中也会学习它们。


    现在，让我们在机器上安装并运行 `Geth`。


    ## 安装 Geth


    `Geth` 是用 `Go` 语言开发的以太坊客户端，由以太坊基金会积极维护，因此被认为是以太坊客户端的官方实现。通常，每个基于以太坊的区块链都会运行着一个
    `Geth` 实例。


    让我们看看在系统上运行 Ubuntu 时如何安装 `Geth`。如果你使用的是 Windows 或 macOS，可以使用以下链接进行安装：


    - Windows 安装指南：`https://geth.ethereum.org/downloads/`

    - Mac 安装指南：`https://geth.ethereum.org/docs/install-and-build/installing-geth#install-on-macos-via-homebrew`


    让我们在本地系统中安装、打开终端并克隆仓库。


    以下是命令：


    ```bash

    git clone https://github.com/ethereum/go-ethereum.git

    ```


    在你的系统中下载并安装 `Geth` 可能需要一些时间，如下图所示：


    ![](img/Figure_2.3.png)


    下载完成后，你需要切换到目录并运行这些命令：


    ```bash

    make geth

    ```


    从源码构建 `Geth` 需要一些时间。安装完成后，可执行文件将存放在 `go-ethereum` 文件夹内的 `/build/bin` 文件夹中。


    你也可以直接从网站下载构建包并在电脑上运行。要下载构建文件，请访问以太坊 Geth 下载页面 `https://geth.ethereum.org/downloads/`
    并下载适用于你操作系统的版本。


    一旦你完成了源码构建或下载解压，进入文件夹并运行此命令来检查 `Geth` 版本：


    ```bash

    ./geth version

    ```


    它应该打印如下所示的 `Geth` 版本详情：


    ![](img/Figure_2.4.png)


    你看到的信息可能与前面的图片略有不同，但报告格式应该如所示。


    现在我们已经成功下载了 `Geth`，让我们了解一下可以用它做什么。首先，让我们同步区块链并成为公共测试网中的一个节点（peer）。


    ## 同步测试网区块链


    我们已经学习过每个节点在区块链网络中都有一个完整的链副本。要成为节点，必须首先从网络中的其他节点获取区块链副本。这被称为同步（synchronization）或
    `sync`，该操作将区块链数据从创世区块复制到最新区块。


    以下是启动同步过程的命令：


    ```bash

    ./geth --testnet --syncmode "fast"

    ```


    理解命令参数：


    - `--testnet`: 意味着我们需要同步测试网数据，其尺寸比 `mainnet` 小。

    - `--syncmode`: 选择我们可以用于同步链的各种模式。在 `fast` 模式下，`Geth` 不验证每一个区块，这缩短了同步链的时间。


    然而，取决于你的网络连接带宽，同步整个链可能需要一天。


    运行命令后，你应该会在控制台中看到以下内容：


    ![](img/Figure_2.5.png)


    要检查同步状态，你可以查看终端并找到等待值（pending values）。这些是在我们的机器成为以太坊测试网节点之前需要同步的区块数量。


    让我们看看如何安装一个名为 `Ganache` 的私有区块链软件，它是专为开发目的设计的。


    ## 安装 Ganache


    `Ganache` 是一个允许你快速启动个人以太坊区块链的软件，用于运行测试和执行智能合约而无需成为节点。


    在本书更新时，`Ganache` 已被弃用。我们在这里保留这部分是为了理解，但不建议你使用它。你可以直接跳到 Infura 部分，或者阅读它以获取知识。


    要下载 `Ganache`，请访问官方网站下载软件：`https://www.trufflesuite.com/ganache`。下载软件后，解压并在你的系统中运行它。


    `Ganache` 运行起来像这样：


    ![](img/Figure_2.6.png)


    `Ganache` 提供了多个带有测试以太坊的钱包，以便你进行测试。你可以检查区块和交易状态。


    `Ganache` 还有一个 CLI 包，我们可以安装它以命令行模式与 Ganache 远程调用 (RPC) 服务器交互。让我们看看 Infura 服务来如何使用它。


    ## Infura


    `Infura` 是一个第三方以太坊和 IPFS API 提供者。你可以使用 Infura 基础设施免费运行你的应用程序。Infura 处理所有的同步和基础设施，而你作为开发者，可以专注于代码。Infura
    网站如下：


    ![](img/Figure_2.7.png)


    要使用 Infura 服务，你需要使用电子邮件地址创建账户。创建账户后，你可以登录 Infura 仪表板，它列出了你创建的项目以及其他详情。如下图所示：


    ![](img/Figure_2.8.png)


    如前幅图片所示，已经创建了一个项目。你可以点击 CREATE NEW PROJECT 按钮创建你的项目。给你的项目起一个合适的名称，Infura 会在后台为项目创建一个测试网和主网。


    项目创建后，你可以查看所有详情，例如用于连接到节点的对端点、项目 ID 和密钥。


    你可以使用这些凭据与 Infura 网络交互。请确保安全。在下一节中，我们将简要查看以太坊客户端提供的 JSON-RPC API。


    ## JSON 远程调用 API


    以太坊客户端提供了应用程序接口和一组 RPC 命令，这些命令被编码为 JavaScript 对象表示法 (JSON)。我们将其称为 JSON-RPC API。


    JSON-RPC API 是一个接口，允许我们编写使用以太坊客户端作为以太坊网络和区块链网关的程序。我们可以通过在任选编程语言中构建 RPC 客户端与 JSON-RPC
    服务器交互，也可以直接调用 HTTP 端点。


    首先，让我们向以太坊 RPC 端点进行简单的 HTTP 调用并看看它是否有效。以下是返回客户端版本的命令：


    ```bash

    curl -X POST -H "Content-Type: application/json" --data \

    ''{"jsonrpc":"2.0","method":"web3_clientVersion","params":[],"id":1}'' \

    http://localhost:7545

    ```


    在前面的命令中，我们向运行在端口 7545 的 RPC 服务器发送 JSON-RPC 调用。


