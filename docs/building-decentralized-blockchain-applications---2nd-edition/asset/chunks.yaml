    Bitcoin, a peer-to-peer system, must handle scenarios where two nodes submit the
    same transaction simultaneously. Without a central authority, it resolves this
    by employing a robust mechanism to maintain the integrity of its decentralized
    network. This issue is critical and groundbreaking; let us explore how Bitcoin
    effectively addresses it.


    Bitcoin solved this problem by introducing a memory pool. The memory pool is a
    buffer that every node must maintain. Memory pool contains the transactions that
    are later written to the blockchain.


    When a node submits a new block, it is broadcast throughout the network.


    ![](images/Figure_1.6.png)


    When a new block is submitted to the network, every node must accept that as a
    correct transaction and remove any conflicting transactions from their memory
    pool.


    ![](images/Figure_1.7.png)


    As a result, no chance of double spending can occur because it will not persist
    in the network if it is already been added in the block.


    This double spending issue is groundbreaking and opens the way for many other
    projects such as Ripple cryptocurrency, which works with the current finance system
    but offers a solution to the double spending.


    Now, let us look over the technical aspects of Bitcoin.


    ### Blocks


    Block is the data structure that holds transactions in an immutable form. Bitcoin
    stores users transactions in the blocks, and later form a chain to build a blockchain
    network.


    As we discussed in the previous sections, the block is generated by the miner
    by the process of mining. The mining process requires a consensus algorithm to
    reach the agreement in the network.


    Block consists of the block header, which is used by the miner to generate the
    hash. Block header consists of the following:


    • Version: The version of the block.

    • Previous block hash: Hash of the last identified block, thus forming a chain.

    • Merkle root: Hash of all the transactions in the block.

    • Time: Timestamp.

    • Bits: Hexadecimal version of the target value.

    • Nonce: It is a 32 bit random whole number that is adjusted by the miners, so
    that it becomes a valid number to be used to provide the hash of the block that
    should be less than the target hash.


    The first two fields are self-explanatory, and we have already discussed them
    in the previous sections. Let us learn about the Merkle tree.


    ### Merkle tree


    Merkle tree is the data structure in which every leaf node is labeled with the
    cryptographic hash of the data, and every non-leaf node is labeled with the hash
    of its child nodes, forming a tree to the root with one hash value.


    As you can see in the following figure, Hash `0-0` and Hash `0-1` is the hash
    value of data block `L1` and `L2`. Later, Hash `0-0` and `0-1` will be hashed
    together to form `Hash 0` and so on until we reach a root hash:


    ![](images/Figure_1.8.png)


    Using a Merkle tree, we can generate a hash of a long series of data in a compact
    and secure format.


    Bitcoin uses the Merkle tree to store transactions in a hashed format:


    ![](images/Figure_1.9.png)


    As shown in the preceding figure, the Merkle root contains transactions that are
    hashed together in a way the binary tree is formed.


    Merkle tree is formed by hashing the transaction IDs (`TXIDs`) in a pair. `TXIDs`
    are used if needed, and we can perform a recheck using the `TXID` in a tree.


    To generate a Merkle tree, we take a pair of `TXID` and hash them twice using
    the `SHA-256` algorithm. The resulting hash is then hashed with another hashed
    pair twice to generate a single hash. This goes on till we generate a root hash.


    Merkle trees are best suited for applications such as Bitcoin, where the size
    of the data matters. Due to the use of the Merkle tree, the block size is retained
    to 1 MB max in Bitcoin.


    | Tip: Learn in-depth about the Merkle trees; it is one of the most frequently
    asked questions on Facebook, Amazon, Apple, Netflix, Google (FAANG) companies.
    Start from here: http://www.mit.edu/~rio/merkle.pdf |

    | --- |


    Let us learn about the next field in the block header—bits.


    ### Bits


    Bits is the field in the block header that stores the target value in the compact.
    Target is the value that is required for the miner to generate the block hash
    that is less than the target. We studied it in the blockchain core concepts section.


    Let us look at an example. This is what a target value looks like:


    `0x00000000000000000696f400000000000000000000000000000000000000000`


    Storing such long values will require size, and the target will keep changing
    in the future.


    To solve this, the target is compacted, and it looks like this in the block header
    field:


    `0x180696f4`


    It is easy to store and takes less space.


    Here is how to decode a bit. It is divided into 2 parts. The first 2 bits after
    `0x` represent the number of 0s in the target value, and the remaining values
    are appended after 0. The rest of the field is then filled with 0s till it reaches
    48 bits.


    So, `0x180696f4` value can be written as:


    `0x----18 times zero---0696f4---rest zeros----`


    This way, we can decode the bits. In the next section, we will be looking at the
    field.


    ### Nonce


    The `nonce` is the field in the block header that is used by the miner to generate
    the hash. Bitcoin uses Proof of Work consensus. In Proof of Work, target value
    starts with several 0s, and it is really difficult to get such a hash.


    When the lucky number or `nonce` is found, a hash is generated. Miner announces
    the block in the network, and every other node verifies and makes a copy of it.


    So, `nonce` plays a crucial role in Bitcoin mining. We have studied about the
    block and important block header fields, so let us move ahead and learn about
    Bitcoin transactions.


    ### Transactions


    When someone tries to transfer Bitcoin from one account to another, a new transaction
    is formed and added to the block by the miner.


    The transaction contains data that is required for proper transfer. Transaction
    data consists of the amount that the user wants to send, account information such
    as from and to addresses, transaction information required for the network such
    as `TXIDs`, and so on.


    Transaction in Bitcoin contains the following information:


    • The `TXID` is also referred widely as `TXID`.

    • Transaction data such as input, output, and so on.

    • Fees

    • Weight

    • Unspent transaction output (`UTXO`)


    Let us learn about each of them in brief.


    ### TXID


    `TXID` is a 32 bytes hexadecimal number that is referred to as `TXID` and used
    to identify the transaction in Bitcoin.


    `TXID` is generated by hashing the transaction data twice using the `SHA-256`
    algorithm.


    Satoshi Nakamoto sent the first-ever Bitcoin transaction to Hal Finney, and the
    ID of the transaction is this:


    `f4184fc596403b9d638783cf57adfe4c75c605f6356fbc91338530e9831e916`


    You can still view this transaction in the blockchain explorer:


    https://www.blockchain.com/btc/tx/f4184fc596403b9d638783cf57adfe4c75c605f6356fbc91338530e9831e916:


    ![](images/Figure_1.10.png)


    Let us look over the transaction data required to form transaction payload.


    ### Transaction data


    Transaction data contains the information required to form input and output. In
    Bitcoin, when you send someone a few coins, you unlock a few outputs that are
    required and lock them again with the keys of the receiver so that only they can
    lock it.


    This may sound confusing, but you will get clarity in the coming paragraph.


    Let us take an example:

