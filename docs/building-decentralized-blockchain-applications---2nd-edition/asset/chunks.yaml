  trans: "\n\n - **交易**：价值的实际交易，区块链的最小单元。\n - **区块**：一种数据结构，交易以 Merkle Tree（默克尔树）格式存储。\n\
    \ - **链**：按特定顺序排列的区块。\n - **矿工**：执行交易和区块验证的特定节点。\n - **共识**：网络达成共识的机制。\n\n简而言之，区块链的工作原理分为六个步骤：\n\
    \n1. 节点在网络中提交交易。\n2. 矿工获取交易并将其保留在内存池中。\n3. 矿工将交易添加到区块中。\n4. 矿工提交区块并在网络中竞争寻找区块的哈希值（如果共识基于工作量证明系统）。\n\
    5. 一旦找到了正确的哈希值，区块就会提交到网络中。\n6. 其他所有节点验证该哈希值，如果 51% 的节点验证并发现哈希值正确，则网络达成共识，区块变得不可篡改。\n\
    \n让我们简要了解每个组件。\n\n### 节点\n\n网络中的每个参与者都称为节点。节点是运行着加入区块链网络所需软件的计算机。\n\n加入并参与网络确实需要互联网连接。它可以是一台简单的计算机、笔记本电脑，也可以是一个巨大的数据中心。\n\
    \n在公链区块链中，任何人都可以成为节点加入网络。节点的数量对于使系统更安全且难以攻击至关重要。\n\n### 交易\n\n交易是区块链的基本构建区块。它由节点生成并提交到链中，随后被矿工获取并添加到区块中。\n\
    \n交易包含以下信息：\n\n- ID（哈希）\n- 地址（哈希）\n- 接收者（哈希）\n- 金额：要发送的加密货币数量\n- 手续费：发送交易的费用\n\
    - 签名哈希：发送者生成的哈希\n\n根据加密货币的不同，可能会有更多信息，但上述信息是强制性的。\n\n| 注意：我想指出的一点是，这里没有存储用户信息。这是因为区块链保证了匿名性，除了地址（同样是一个哈希）外，不存储任何关于发送者的信息。\
    \ |\n| --- |\n\n### 区块\n\n区块是一种存储大量交易并将其提交到区块链进行验证的数据结构。如果验证成功，区块将变为不可篡改。\n\n\
    矿工节点生成区块。矿工节点从内存池中获取交易并生成一个区块。这个区块也被称为候选区块。\n\n每个区块包含以下内容：\n\n- 区块头：包含版本、上一个区块、时间和目标值。\n\
    - 随机数（Nonce）：用于生成哈希时考虑的数字。\n- 交易：以 Merkle Tree 格式列出的交易列表。\n\n比特币使用这种区块结构。其他区块链平台的结构大体上相似。你可能会发现某些平台不使用随机数，而某些平台在区块头和交易中使用不同的数据嵌套方式。\n\
    \n区块头包含关键信息，如版本号、上一个区块哈希、时间戳、目标值等。\n\n区块通过对区块头进行哈希处理并添加到链中，并希望数据小于目标值。\n\n目标值是通过难度值决定的。难度是一个决定矿工挖掘区块所需时间的数字。在比特币网络上，这个时间应该大约在\
    \ 10 分钟左右。\n\n随机数是矿工用于生成符合目标值的哈希的数字。矿工通过增加随机数的值来满足所需的目标值。\n\n一旦找到哈希值，区块就会被挖出并提交到链中。每个区块都与上一个区块链接，形成如下所示的链：\n\
    \n![](img/Figure_1.3.jpg)\n\n### 链\n\n链是通过密码学连接在一起并在每个节点共享的区块。每个节点维护链的最新副本，形成一个由强大、可靠且一致的节点组成的网络。\n\
    \n链由区块组成。正如之前看到的，区块包含交易。每个交易都与账户关联，形成账本。通过链，可以确定特定地址的账本信息并验证交易。\n\n由于链分布于网络，因此欺诈。如果有人尝试从他们的机器添加伪区块，网络将验证并拒绝该区块。要接管网络，必须控制网络中\
    \ 51% 的节点（节点的哈希率/计算能力）。\n\n这也称为 51% 攻击。\n\n| 提示：51% 攻击是一种分布式攻击，攻击者试图通过感染和控制 51%\
    \ 节点的哈希算力来尝试控制区块链网络。对于像比特币这样的网络，这几乎是不可能的，但对于较小的网络是可以实现的。 |\n| --- |\n\n链通过以下步骤在网络节点间共享：\n\
    \n1. 新交易被广播到所有节点。\n2. 每个节点将新交易收集到一个区块中。\n3. 每个节点致力于为其区块寻找困难的工作量证明（PoW）。\n4. 当节点找到工作量证明时，它将区块广播给所有节点。\n\
    5. 只有当区块中的所有交易有效且未被花费时，节点才接受该区块。\n6. 节点通过创建下一个区块（使用接受区块的哈希）来表达其接受。\n\n对于大多数工作量证明系统，这些步骤是非常相同的。\n\
    \n链以二进制格式存储在节点上。根据操作系统和链网络，默认存储在以下位置（以比特币链为例）：\n\n- Linux: `/home/[username]/.bitcoin/blocks/`\n\
    - Windows: `C:\\Users\\[username]\\AppData\\Roaming\\Bitcoin\\`\n- Mac: `~/Library/Application\
    \ Support/Bitcoin/`\n\n你可以根据链配置将其存储在不同的位置。\n\n让我们继续学习矿工。\n\n### 矿工\n\n矿工是执行向链中添加新区块并添加用户交易的节点。\n\
    \n矿工通过执行深度哈希计算来完成这一过程，在比特币的情况下大约需要 10 分钟。\n\n这种计算消耗大量的计算能力，因此需要支付矿工费用以使其能够盈利运行。每当矿工成功将区块插入链中时，系统都会奖励他们激励。\n\
    \n挖矿过程始于从内存池中获取交易以构建候选区块。\n\n候选区块包含区块头。矿工通过将区块头传递给 `SHA256` 函数来尝试计算哈希。\n\n| 提示：SHA-256\
    \ 是根据输入生成哈希的函数。 |\n| --- |\n\n返回的哈希应该小于系统当前定义的目标值。如果不是，矿工就会增加 `nonce` 并重新计算哈希。这个过程将持续进行直到找到正确的哈希值。\n\
    \n"
- fmt: '

    The consensus is the set of rules agreed by all parties of the network. There
    are different types of consensus algorithms we are going to cover the following
    in this section. We will cover more about the following consensus algorithms in
    the coming chapters:


    - Proof of Work

    - PoS

    - Byzantine Fault Tolerance (BFT)


    Proof of Work is the original consensus mechanism created by Satoshi Nakamoto
    for the Bitcoin cryptocurrency. Let us understand all of them in detail.


    ## Proof of Work

    Proof of Work is a consensus mechanism in which one must produce data that is
    difficult to generate but easy to verify.


    Bitcoin uses Proof of Work and asks miners to generate the hash, which is less
    than the target number. In Bitcoin, the miner must produce a hash that starts
    with certain 0s. For example, if the target is 10, a miner must produce hash starts
    with beginning with 0s that are less than 10.


    It sounds simple, but it is extremely difficult to generate using the `SHA-256`
    function. Once a hash that satisfies the target is generated, all the others can
    verify using the target that was used to generate the hash. So, it is easy to
    verify but hard to generate.


    To prevent spams and denial of service attacks, Proof of Work asks miners to invest
    a ton of money to build an infrastructure to perform mining, and they are rewarded
    by the system.


    This difficulty also ensures that the false transaction does not flood the system
    because it will take lots of time and money to flood the system with the bad transaction.
    Instead, one will mine and earn some good money!


    ## Proof of Stake

    Proof of Work is a solid consensus mechanism, but it consumes a lot of computing
    power and energy. The energy cost to generate my blocks is so high that one can
    power an entire city with that energy.


    Proof of Work is faced with scaling issues. To solve these scaling issues, engineers
    across the world agreed to another form of consensus that is called PoS.


    In Proof of Work, when the block is about to be mined, every miner in the network
    tries to generate the hash to earn the reward. Ultimately, only one miner among
    thousands will get the hash and the reward, which in turn, wastes the efforts
    of other miners.


    In PoS, the miner aka validator is chosen based on various stakes such as random,
    several blocks mined, and so on. So, the network chooses the miner and asks them
    to mine the block, giving everyone a fair chance plus saving the effort of other
    miners.


    In PoS, the stake could be money, ranking, or stake itself. When a validator tries
    to cheat and add a bad or corrupted block in the network, the stake is slashed,
    or a penalty is charged against the miner.


    In general, it can be done randomly. The system picks up random validators from
    the network and assigns them the block.


    The network assigns a formula using which it can decide the miner when a new block
    is ready to mine.


    PoS is simple and saves lots of computational effort. Ethereum, the second most
    popular cryptocurrency in the world made a switch to PoS-based consensus algorithm
    from Proof of Work.


    Let us understand another popular consensus mechanism, that is BFT.


    ## Byzantine Fault Tolerance

    BFT is a consensus mechanism in a distributed system, wherein consensus is reached
    even if the nodes in the network fail to respond or respond with incorrect information.


    BFT ensures that the system is up and running and performing its function even
    if the network is under attack or some technical issue occurs.


    So far, we have studied the blockchain and its components. In the next section,
    let us learn about cryptocurrency, which created the revolution with its technology
    and approach to finance.


    ## Bitcoin

    Bitcoin is the world''s first peer-to-peer electronic cash system. Bitcoin offers
    anonymity, transparency, and there is no third-party dependent system to exchange
    value such as money.


    Satoshi Nakamoto invented Bitcoin in 2009, and it has been hailed as one of the
    most important inventions of the century.


    Bitcoin was invented to solve trust-based dependency in the current commerce system.
    We as people trust banks, governments, and federal reserves to safeguard money
    and provide a platform for the common man to trade and exchange using the paper
    currency.


    Due to these trust-based models, the control of the economy is in the hands of
    a few people, who can use it for malicious purposes.


    However, there was no alternative, and you had to go to the bank to handle your
    financial needs. Then, Bitcoin arrived as a new and better alternative.


    To trade in Bitcoin, you do not need any bank or government approval. You can
    send money to your peers using your computer or mobile. It is as simple as that.


    In this section, we will learn in-depth about how Bitcoin works, how each transaction
    is formed and added to the block, and how it has done more than just solve our
    money problems.


    | Note: I highly recommend our readers to print out the Bitcoin whitepaper written
    by Satoshi and give it a thorough read. You can download the paper from: `https://bitcoin.org/bitcoin.pdf`
    |


    ## How Bitcoin works

    Bitcoin is a peer-to-peer electronic payment system created in 2009 by Satoshi
    Nakamoto. Bitcoin allows us to send money to anyone in the world, without the
    need for a central authority such as banks to issue accounts or process payments.


    Bitcoin was created as a solution to the current financial system, where a marginal
    number of large corporations and banks control the financial world and the processing
    of transactions across the world.


    It centralizes the control of finance and commerce and forces people to trust
    the banks to act responsibly.


    As Satoshi said in the P2P Foundation:

    The central bank must be trusted not to debase the currency, but the history of
    fiat currencies is full of breaches of trust.


    Due to this trust issue, a major financial crisis affected the world at the end
    of 2007. This crisis inspired Satoshi to create Bitcoin.


    Bitcoin is a computer program. You can download it precompiled, or you can download
    the source code from `GitHub` and compile it yourself. Once you run the Bitcoin
    program on your computer, you become part of the network; you are a peer!


    Once your computer becomes a part of the network, the program will connect to
    other computers running the same program. Once connected, computers will start
    sharing a file and try to sync the files with each other, this file is nothing
    but a Blockchain. Once your computer is up to date with the blockchain files,
    you can start submitting the transaction.


    | Note: It may raise a question: does everyone need to run the Bitcoin program
    to send or receive Bitcoin? Well, no. You can download a Bitcoin wallet and start
    making Bitcoin transactions. Those who wish to become a peer or miners in the
    network need to run the Bitcoin program as shown in the following figure: |


    | --- |


    ![](images/Figure_1.4.png


    Once your computer is synced with the latest copy of the blockchain, you are good
    to go. You can now submit transactions, mine the blocks, read the blockchain,
    and do whatever you wish to do.


    When a new transaction is submitted in the blockchain, it is broadcast across
    the network. Every node then makes a copy of that transaction and adds it to their
    memory pool.


    In the Bitcoin network, at around 10 minutes of interval, one of the miners will
    mine a new block and broadcast it across the network. Every node will then update
    its blockchain, and the network will be up to date. This is illustrated in the
    following figure:


    ![](images/Figure_1.5.png


    This peer-to-peer nature of the system creates a trust-free, electronic cash system
    that runs with the solid consensus mechanism.


    Before we proceed ahead with the technical aspects of Bitcoin, let us understand
    one of the key issues that Bitcoin solved—double spending.


    ### Double spending problem

