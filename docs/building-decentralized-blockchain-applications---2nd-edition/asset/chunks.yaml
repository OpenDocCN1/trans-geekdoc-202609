    ### Fees


    Every transaction in the Bitcoin pays some amount of money in the form of Bitcoin
    to the miner. The remainder of the transaction output is also associated with
    the fees and paid to the miner for the work they do.


    Generally, by adding lucrative fees, there is a high chance that a miner will
    pick your transaction from the memory pool to add into the next block. However,
    this is completely optional. If you do not pay the fee at that moment, it may
    take some time, but your transaction will be mined by some miners scattered across
