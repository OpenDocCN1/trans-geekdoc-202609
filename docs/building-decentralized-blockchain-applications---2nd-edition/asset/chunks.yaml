    \n## Technologies\n\nHere is our technology stack:\n\n- Frontend: HTML, CSS, JavaScript,\
    \ and jQuery\n- Backend: OrbitDB, IPFS\n- Middle layer: Node.js\n\nWe are using\
    \ `Node.js` to handle the API system so that the frontend can communicate with\
    \ the database, and the `OrbitDB` document store data model to store users information\
    \ and email information. Let us look over the architecture of the application.\n\
    \n### Architecture\n\nWe are building a peer-to-peer email application. In this\
    \ approach, we are sharing the same database across every peer. To do that, we\
    \ first need to create a database in a genesis peer, and all other peers have\
    \ to copy the same database.\n\nOnce the genesis peer and database are created,\
    \ another peer can copy the same database and changes will be synchronized using\
    \ the `IPFS` pub/sub technique that we studied earlier.\n\nOur email technology\
    \ is also a little different from traditional email systems. In a traditional\
    \ system, we use the `Simple Mail Transfer Protocol (SMTP)` to send and receive\
    \ emails.\n\nIn our system, we use the `IPFS` pub/sub to synchronize changes so\
    \ that everyone has the same copy of the data, so the emails sent/received will\
    \ be synchronized. \n\nIn a traditional system, you can send emails to anyone\
    \ if you have their email address. In our system, you can only send emails to\
    \ users added in your contacts, and whose public key you have.\n\nWe encrypt the\
    \ email using the public key of the receiver and private key of the sender to\
    \ make it ultra-secure. Only the receipt with the proper private key can decrypt\
    \ the email and view the content.\n\nIt is a very important concept in a peer-to-peer\
    \ system, where anyone can become a part of the network and view your data. One\
    \ must ensure that it is secure and not easy to access.\n\nThe `Node.js` server\
    \ handles our frontend, and the node itself handles the rest of the communication\
