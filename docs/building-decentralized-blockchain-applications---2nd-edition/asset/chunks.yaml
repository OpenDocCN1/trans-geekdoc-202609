    To address scalability, these are some of the widely adopted approaches:


    - `Sharding`: A sharding solution would divide the network into smaller sub-networks,
    allowing each sub-network to process transactions in parallel, improving overall
    throughput.

    - `Layer 2 scaling solutions`: This involves adding a layer on top of the main
    blockchain network to handle a larger volume of transactions, such as `state channels`
    and `plasma`.

    - `Lightning Network`: `Lightning Network` is a layer 2 payment protocol built
    on top of the Bitcoin blockchain. It enables faster and cheaper transactions by
    allowing users to make off-chain payments directly between each other without
    broadcasting every transaction to the network.

    - `Optimizing consensus algorithms`: This involves improving the existing consensus
    algorithms or developing new ones that are more efficient and scalable. We studied
    about consensus algorithms in detail in the Chapter 3, `Blockchain Consensus Algorithm`.

    - `Hybrid systems`: Combining centralized and decentralized systems to take advantage
    of the strengths of both, thereby improving scalability and security, for example
    cryptocurrency exchange.

    - `Interoperability`: Developing protocols and standards for decentralized systems
    to exchange information and assets, enabling them to work together seamlessly.


    ## Sharding


    `Sharding` is a scaling technique used in blockchain networks to improve scalability
    and performance by dividing the network into smaller, more manageable parts called
    `shards`.


    Each shard operates independently, processing its own transactions and smart contracts.
    `Sharding` is designed to address the limitations of traditional blockchain networks
    that process all transactions in a linear manner, leading to potential bottlenecks.


    As you can see in the following figure, the network consists of 1000 nodes and
    is trying to process the transactions. In `sharding`, the transactions are divided
    into multiple sets of smaller units (as shown in the figure, each `shard` consists
    of 100 nodes) and they manage the transaction assigned to them:


    ![](images/Figure_4.1.jpg)


    This improves the efficiency of the network. If done properly, it can be improved
    to achieve more than 10x performance in transaction handling.


    `Shards` process transactions independently, reducing the contention for resources
    often occurring in non-sharded networks. Nodes within a `shard` are responsible
    for validating and reaching consensus on transactions within that `shard`.


    `Shards` need to communicate with each other when a transaction involves parties
    from different `shards`. This requires mechanisms for cross-shard communication.
    Inter-shard communication can be achieved through protocols that enable secure
    and efficient transfer of information between `shards`.


    ### Advantages of sharding


    Let us learn and understand the advantages of using `sharding` in the blockchain
    network:


    - `Optimal throughput increase`: `Sharding` significantly increases the throughput
    of the blockchain network. With multiple `shards` processing transactions simultaneously,
    the overall capacity of the network is enhanced. Throughput also scales with the
    number of `shards`, allowing the network to handle a larger number of transactions
    per second.

    - `Reduced latency`: `Sharding` reduces transaction confirmation time by distributing
    the workload across multiple `shards`. Transactions processed in different `shards`
    can occur simultaneously, leading to lower latency as compared to non-sharded
    networks.

    - `Horizontal scaling`: `Sharding` is a key technique for achieving horizontal
    scalability in blockchain networks. As the network grows, additional `shards`
    can be added to accommodate the increased transaction volume. The ability to scale
    horizontally is crucial for blockchain networks aiming to support a large and
    diverse user base.


    `Sharding` offers some crucial advantages, but it comes with its own challenges.
    Let us have a look at it:


    - `Security`: Ensuring the data is secure across different `shards` is a crucial
    challenge. As the network is spanned across `shards`, security must be maintained.

    - `Consensus across shards`: As the network size increases, `shard` count will
    increase. To ensure integrity, `shards` must communicate.

    - `Cross-shard communication`: `Shards` need to communicate with each other to
    ensure consistency. Ethereum 2.0 network uses `sharding` heavily to handle scaling
    challenges. Now, let us explore the `layer 2` approach and how it helps.


    ## Layer 2 approach


    `Layer 2 scaling solutions` are approaches designed to address scalability in
    blockchain networks by moving some processing off the main blockchain. These solutions
    aim to improve throughput, reduce latency, and minimize congestion on the primary
    blockchain. By handling transactions offline, `layer 2` solutions can significantly
    enhance performance.


    Please refer to the following figure:


    ![](images/Figure_4.2.jpg)


    As you can observe in the 4.2, `layer 2` system works by performing settlement
    offline, and there are different ways we can achieve the same. Some of them are:


    - `State channels`: They are off-chain channels where multiple transactions can
    be settled without involving the mainblockchain.

    - `Payment channels`: They are similar to `state channels` but exclusively designed
    for payments.

    - `Sidechains`: These are separate chains with interoperability with the mainchain,
    and assets can move between chains.

    - `Plasma`: It is a framework for creating a scalable blockchain, often referred
    to as child chains, which are connected to the mainchain.

    - `Rollups`: It is a concept where summaries of all transactions are submitted
    to the blockchain and not all transactions.


    Let us discuss these `layer 2` techniques in detail.


    ### State channels


    `State channels` are a `layer 2 scaling solution` designed to address challenges
    in blockchain networks by enabling off-chain transactions. These channels allow
    participants to conduct multiple transactions privately, off the main blockchain,
    and only settle the final state on the blockchain when necessary. `State channels`
    are particularly useful for use cases involving frequent and rapid transactions
    between a set of participants.


    Please refer the following figure:


    ![](images/Figure_4.3.jpg)


    `State channels` operate in the following manner:


    1. `Opening a state channel`: The network peers who want to ensure collaboration
    and share data with each other need to first open a `state channel`. The process
    to open a `state channel` is by creating a multi-signatory wallet between the
    participants. Once the `state channel` is created, it is recorded in the blockchain.

    2. `Off-chain transactions`: Once the `state channel` is open, participants can
    conduct a series of off-chain transactions between themselves without involving
    the main blockchain. Each off-chain transaction updates the state of the channel
    and is recorded similarly to how it is recorded in the mainchain.

    3. `State channel updates`: As the transactions get settled in the-chain, the
    `state channel` created by the participants is updated. These updates are off-chain
    updates and do not sync with the mainchain yet.

