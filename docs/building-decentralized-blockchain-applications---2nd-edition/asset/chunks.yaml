    ## [Blockchain and decentralization](#toc.xhtml#zh11)


    Cryptocurrency is a small subset of the blockchain, like the email of the internet.


    As we studied in the previous sections, blockchain is a peer-to-peer consensus-based
    network of computers. Each computer communicates with each other and exchanges
    data.


    As there is no central authority involved in the working of blockchain, this approach
    is called the decentralized approach.


    After the huge success of blockchain technology in supporting the most crucial
    and important factor of human beings—money—engineers and technology gurus started
    wondering about the usage of Blockchain in other aspects of computing, such as
    e-commerce, hospitals, property holdings, and others.


    The blockchain that is built to support Bitcoin cannot support such a wide range
    of data due to various reasons. Hence, it is best to build a new blockchain-based
    system using the core technology behind the blockchain built by Satoshi: Decentralization,
    peer-to-peer, consensus, anonymous.


    This movement is also referred to as decentralized Web or Web 3.0, as most of
    these technologies will first be implemented on the internet.


    In this section, we will learn about the following:


    • DApps


    • How does it work


    • DApps technologies


    ## [Decentralized application](#toc.xhtml#zh12)


    Generally, applications work on client and server models, so there is a central
    authority that serves those clients. As opposed to that, DApps run on a peer-to-peer-based
    network.


    DApps are already present in the market, such as torrent and Tor network. The
    key change here is the data storage on the blockchain network, which, in turn,
    makes it immutable, fraud-proof, and anonymous.


    The DApps makes communication with the blockchain deal with data. Rest everything
    should be the same, such as the user interface, development approach, and so on.


    The frontend of the DApps should look and work like a traditional application.
    The business logic, however, involves cryptography and blockchain to deal with
    data generated by the application.


    This is how a traditional application stack looks:


    ![](images/Figure_1.12.png)


    Here is how a DApps stack looks like:


    ![](images/Figure_1.13.png)


    The change is in the business layer and the data layer, and we will understand
    the technologies being developed and used to build the business and data layer
    for the DApps in the next section.


    ## [Working of decentralized applications or DApps](#toc.xhtml#zh13)


    Let us learn by example.


    Imagine you have an application installed on your phone, and it works like Instagram,
    where you can share your photos with the world.


    In general, when you upload a new photo in the application, it uploads your image
    in a storage, makes an entry in the database, and updates the newsfeed so that
    everyone who follows you can see the post.


    Simple, right?


    Let us do the same with the help of the blockchain.


    So, here, you will upload the image in the application, and it will be stored
    in decentralized storage such as the Interplanetary File System (IPFS). The storage
    will provide you with a hash, which is the identifier for the object.


    Now, the hash would be added in the Blockchain to make a permanent entry of the
    photo, and then the newsfeed would be updated so that the people who follow you
    can see the content.


    In DApps, every action is recorded in the chain, and even the delete action would
    be recorded in the chain. As mentioned earlier, you will not store actual photos
    in the blockchain; instead, you will store the action, and action is immutable.


    So far you have studied what the DApps is and how it works, let us understand
    the technologies and protocols to build the DApps.


    ## [DApps protocols](#toc.xhtml#zh14)


    Bitcoin uses the blockchain to store the actual coins, and that is pretty much
    it. The next big thing after Bitcoin is Ethereum, which introduced something called
    smart contracts.


    Smart contracts are programs that are executed on the Ethereum blockchain. This
    invention opened the path for the next-generation DApps.


    Ethereum saw this opportunity, and they developed a complete set of tools and
    protocols required to build DApps on the Ethereum ecosystem.


    As you can see in the following figure, Ethereum suits consist of Swarm, which
    acts as storage for the Ethereum applications, and Whisper to perform communications
    between the applications:


    ![](images/Figure_1.14.jpg)


    You can develop Ethereum applications using the web3.js framework. This complete
    ecosystem is supported by the Ethereum foundation.


    The only drawback is the ecosystem itself, and you are restricted from developing
    and running it in the Ethereum ecosystem.


    The next protocol that we will learn is completely open-sourced and can be used
    to develop DApps using a mix of the technology stack.


    The next protocol is a project by the protocol.ai team, which is called the IPFS
    Stack. First, let us look at the stack:


    ![](images/Figure_1.15.jpg)'
