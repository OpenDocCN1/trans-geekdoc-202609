    # 献给


    我的父母

    以及

    我的妻子和女儿


    # 关于作者


    Shahid Shaikh 是一位软件架构师，拥有十余年的新兴技术工作经验。他是四本书的作者，也是开源项目的活跃贡献者。他专长区块链、分布式系统和软件架构。


    除了软件工程，他还是复古摩托车爱好者，经常骑着他的经典皇家恩菲尔（Royal Enfield）往往各地。他对无碳发电、太空技术和量子计算也有深厚兴趣。


    # 关于评审员


    ❖ Gowtham Paramasivam 是一位卓越的软件工程师，在 IT 和区块链行业拥有 8 年以上的经验。凭借软件开发领域的深厚基础，他完善了在跨多种技术栈设计和实现创新解决方案方面的专业知识。他的工作横跨多个领域，反映了他的适应能力以及对交付尖端、高效系统的承诺。


    在职业生涯中，Gowtham 在架构和交付具有影响力的项目方面发挥了关键作用，范围从去中心化金融（DeFi）平台到企业级应用。他的专业知识扩展到智能合约开发、分布式系统以及区块链技术与传统基础设施的无缝集成。作为团队负责人，他成功监督了跨职能团队，确保项目在满足业务目标的同时维持最高质量和性能标准。


    ❖ Subhasish Goswami 是一位区块链研究员和开发者，在智能合约开发、去中心化应用和区块链安全方面具有深厚的专业知识。他曾于 WazirX 的早期区块链团队和西门子的区块链研究团队工作，目前在
    Superform Labs 工作构建多链应用。他的研究工作对区块链技术领域做出了贡献，特别是在预言机设计、交易分析和智能合约安全领域。


    他的专业知识涵盖智能合约开发、区块链架构和分布式系统，使他完全能够评估区块链领域的技术内容。


    # 致谢


    我想向所有对完成这本书做出贡献的人表示诚挚的谢意。


    首先，我对我的家人和朋友在这段旅程中提供的坚定支持和鼓励表示由衷的感谢。他们的爱和鼓励是我不断的动力源泉。


    我非常感谢 BPB Publications 在本书成书过程中提供的指导和专业知识。他们的支持和帮助在应对复杂的出版流程方面是无价的。


    我还感谢评审员、技术专家和编辑，他们提供了宝贵的反馈并对手稿的完善做出了贡献。他们的见解和建议显著提高了书的质量。


    最后但同样重要，我想向对这本书感兴趣的读者表示感谢。你们的支持和鼓励我们深表感谢。


    感谢每一位让这本书成为现实的参与者。


    # 前言


    比特币在 2008 年诞生之初席卷了金融界。它成为基于债务的纸质货币的首种替代方案。比特币由令科技界震惊的技术驱动。这项核心技术被命名为区块链——它是以链形式链接的不可篡改的记录，并分布在世界的每个节点上。


    这个简单而强大的概念在计算世界开辟了一个新分支。区块链正被构想用于供应链、医疗记录和土地记录等领域。


    我在 2015 年初进入了区块链和加密货币领域。为了更多地了解它，我加入了印度最大的加密交易所之一，并帮助他们构建和扩展了基础设施。在交易所工作期间，我积累了宝贵的知识。


    区块链的一个分支是去中心化应用。这是一组新的应用，为 Web 开发中传统的客户端/服务器模型提供了替代方案。使用这种方法，开发者可以利用核心区块链技术构建下一代应用。


    去中心化应用正在缓慢进入现实世界，这就是我编写这本书的初衷——为读者提供关于区块链和去中心化应用的深度信息和知识。这本书《构建去中心化区块链应用，第二版》是你解锁去中心化应用（DApps）力量的全面指南。无论你是资深工程师还是好奇的新手，这本书都将为你提供开启下一次
    DApp 开发之旅所需的知识和工具。


    第 1 章 讨论了区块链并解释了驱动区块链的核心技术。我们还将深入学习比特币以及它是如何工作运行的。


    第 2 章 详细介绍了以太坊和智能合约。智能合约是一种图灵完备的编程语言，用于构建可以在以太坊区块链上执行的应用。


    第 3 章 帮助你了解区块链的核心引擎共识算法。你将学习不同共识算法及其优缺点。你还将对每个算法所面临的挑战和潜在解决方案有一个全面的了解。


    第 4 章 关注区块链扩展挑战，这对于当前的生态系统非常重要。区块链的扩展是几乎每个平台都面临的核心问题。你将学习与区块链平台扩展相关的各种挑战和解决方案。


    第 5 章 帮助你了解区块链互操作性以及如何利用它们构建去中心化应用。区块链互操作允许不同的区块链平台相互通信并传递数据，这对于构建下一代去中心化应用至关重要。


    第 6 章 帮助你了解星际文件系统以及如何利用它们构建去中心化应用。IPFS 是构建下一代区块链应用的一种突破性技术。


