    在比特币问世后，当世界意识到区块链在金融之外的力量时，以太坊成为了首选，并且表现良好。让我们简要学习比特币和以太坊之间的区别。


    # 比特币与以太坊


    以太坊曾与比特币许多许多元素，例如 P2P 网络、用于维护无冲突状态的工作量证明共识算法、用于支持网络激励和实用支付的加密货币（如 Ether）、钱包以及数字签名。


    现在，在本书更新时，以太坊已经从工作量证明共识转向了权益证明算法，这标志着两个平台之间发生了根本性的变化和差异。


    然而，以太坊在设计和目的上与比特币不同。比特币的设计是为了支持全球加密货币系统，而以太坊被设计为一个可编程的虚拟机（`VM`），能够在区块链上执行程序。


    比特币支持脚本形式的简单代码执行，并支持普通的 if/else 语句，而以太坊支持图灵完的编程语言。


    简而言之，比特币限于加密货币，而以太坊是一个开放且通用的图灵完 `VM`。


    以太坊凭借其通用的编程语言和广泛的软件开发包，允许全球的开发者构建他们的应用程序。其中著名的应用之一是 CryptoKitties。


    CryptoKitties 是一个运行在以太坊区块链上的游戏，允许玩家在区块链上购买、繁养和出售虚拟猫。它非常受欢迎，并让世界有了对区块链能力的视角。


    以太坊的范围非常广泛，允许开发者编写应用程序，而无需自己创建区块链和网络。开发者可以专注于构建应用，而网络基础设施、状态管理和代码执行则由以太坊网络处理。


    让我们学习一下以太坊的历史，以理解这个神奇项目背后的原因。


    # 以太坊的历史


    所有伟大的创新都在解决大问题，以太坊也不例外。以太坊发明时，人们已经意识到比特币模型的广泛应用，并正尝试超越加密货币。


    尽管这并非易事，开发者们面临着一个需要一套新协议和工具的问题。他们要么在比特币之上构建新的应用程序，要么启动一个新的区块链（对于每一个应用程序来说这都是非常困难的）。


    如果开发者选择在比特币模型之上构建，他们将面临问题，主要是技术上的问题，因为比特币是为了支持加密货币而开发的，要超越它需要巨大的努力，并且可能导致链的分叉。


    对于那些在使用区块链时需要更多自由和灵活性的项目，新的区块链是唯一的选择。但这意味着大量的工作：启动所有基础设施元素、开发、团队建设、测试等。


    2013 年 12 月，俄罗斯裔加拿大程序员兼比特币爱好者维塔尼·布特林（Vitalik Buterin）发表了一篇论文，提出了图灵完通用区块链的想法：


    ![](img/Figure_2.1.jpg)


    这是以太坊白皮书（黄皮）的链接（建议大家都阅读一遍）：`https://ethereum.github.io/yellowpaper/paper.pdf`。


    以太坊背后的想法是设计一种可编程的通用区块链，以便世界上的人都能编写程序并运行在区块链上，而无需开发 P2P 网络、区块链、共识算法等底层机制。


    2015 年 7 月，第一个以太坊区块被挖出。它标志着通用世界计算机开始工作的日期。接下来的图标记了第一笔以太坊交易：


    ![](img/Figure_2.2.png)


    以太坊已成为世界上最大的区块链网络，并为一组新的应用程序——去中心化应用（`DApps`）开辟了道路。


    在下一节中，让我们学习以太坊区块链的组件。


    # 以太坊的组件


    在以太坊，以下组件起着重要作用：


    - P2P 网络：以太坊像比特币一样运行在主网网络，默认可以通过你计算机上的 `30303` 端口访问。以太坊 P2P 网络使用名为 `ÐΞVp2p Wire
    Protocol` 的协议通信。

    - 共识机制：以太坊使用权益证明共识算法。

    - 交易：以太坊交易包含网络信息，以及发送者、接收者、金额和有效负载。

    - 状态机：这是以太坊独特且重要的组件。以太坊的状态转换由 `Ethereum VM` 管理，这是一个执行由智能合约程序生成的字节码的虚拟机。

    - 数据结构：以太坊状态也本地存储在每个节点中。以太坊默认使用数据库（也称为 `LevelDB`），其中包含 Merkle 格式的交易和系统状态。

    - 客户端：以太坊提供了多个客户端软件，例如 `go-ethereum`（也称为 `Geth`）和 `Parity`（已弃用）。


    在下一节中，我们将观察以太坊从通用区块链到 `DApps` 的转变。


    # 以太坊与 DApps


    以太坊项目的启动是为了构建一种通用的区块链，这种区块链可以为各种用途进行编程。以太坊的愿景迅速扩大，成为一个编程和托管 `DApps` 的平台。


    `DApps` 展示了比智能合约更广泛的视角。一个 `DApp` 至少包含智能合约和一个 Web 用户界面。更广泛地说，`DApp` 是构建在开放、去中心化的
    P2P 网络和基础设施之上的 Web 应用程序。


    `DApp` 至少包含以下内容：


    - 区块链上的智能合约。

    - Web 前端用户界面。


    此外，许多 `DApps` 还其他去中心化组件，例如：


    - 去中心化（P2P）存储协议和平台，如星际文件系统（`IPFS`）和 `Swarm`。

    - 去中心化（P2P）消息协议和平台，如 `libp2p` 和 `Whisper`。


    `DApps` 的理念和起源旨在将万维网（`WWW`）推向下一个进化阶段，将去中心化协议引入 Web 应用程序的各个方面。描述这种演变的术语是 Web 3.0，意味着
    Web 的第三个版本。`WWW` 不受中央权威控制。


    在下一节中，我们将详细探索以太坊 `DApps` 的功能。


    让我们从智能合约开发开始。在编写智能合约之前，我们必须了解以太坊客户端，即在你的系统中运行区块链或使用免费第三方服务。


    # 以太坊客户端


    以太坊提供了客户端软件来成为网络节点。你可以下载并安装这些客户端来成为节点，并执行查询区块链、执行交易、执行智能合约等操作。


    有多个开源版本的以太坊客户端，如果它们符合以太坊参考规范和标准通信协议，就可以相互操作。虽然由不同的团队和个人开发这些客户端，但它们都通过标准通信协议进行通信。


    在编写本书时，有六种不同编程语言编写的六种主要的以太坊协议实现，如下：


    - `Geth`：使用 Go 语言编写。


    '
- fmt: '

    - **Nethermind**: Written in `C#` and `.Net` framework.

    - **Besu**: Written in `Java` programming language.

    - **Erigon**: Written in `Go` programming language.

    - **Reth**: Written in `Rust` programming language.

    - **EthereumJS**: Written in `TypeScript` is in beta at the time of writing this
    book.


    We will learn about one of the most used clients—`Geth`—which is also a sort of
    official Ethereum client, as the Ethereum foundation manages it.


    Before running these clients in our machine, let us understand the types of Ethereum
    networks and which one we should use.


    ## Ethereum networks


    Ethereum networks are classified into two types:


    - **Mainnet** (also known as full node): Live network handling real ethers, that
    is, money.

    - **Testnet**: Test network designed for research and development.


    As shown earlier, `testnet` is best suited for development purposes, while `mainnet`
    is the actual P2P network.


    Running a `mainnet` in your machine incurs hardware resources cost and bandwidth.
    It is not recommended to run one in your local machine. You can do almost everything
    you need to do with the `testnet` node.


    We can also use a private blockchain like `Ganache` or a cloud-based client-provider
    such as `Infura`. We will learn about them also in this chapter.


    So, let us install and run `Geth` in our machine.


    ## Installing Geth


    `Geth` is the Ethereum client developed in `Go` language that is actively developed
    by the Ethereum Foundation, so it is considered the official implementation of
    the Ethereum client. Generally, every Ethereum-based blockchain will have its
    `Geth` instance running.


    Let us look at how to install `Geth` when you are running Ubuntu in your system.
    If you are using Windows or macOS, you can use the following links for installation:


    - Installation instruction for Windows: `https://geth.ethereum.org/downloads/`

    - Installation instruction For Mac: `https://geth.ethereum.org/docs/install-and-build/installing-geth#install-on-macos-via-homebrew`


    Let us install, open a terminal, and clone the repository in your local system.


    Here is the command:


    ```bash

    git clone https://github.com/ethereum/go-ethereum.git

    ```


    It may take some time to download and install `Geth` in your system as shown in
    the following figure:


    ![](images/Figure_2.3.png)


    Once it is downloaded, you need to switch to the directory and run these commands:


    ```bash

    make geth

    ```


    It will take some time to build `Geth` from the source. Once installed, the executable
    files will be placed in the `/build/bin` folder inside the `go-ethereum` folder.


    You can also directly download the build package from the website and run it on
    your computer. To download the build files, visit the Ethereum Geth downloads
    page at `https://geth.ethereum.org/downloads/` and download the version suitable
    for your operating system.


    Once you are done building it from source or downloading and unzipping it, go
    to the folder and run this command to check the `Geth` version:


    ```bash

    ./geth version

    ```


    It should print the `Geth` version details like this:


    ![](images/Figure_2.4.png)


    You may see slightly different information than shown in the preceding image,
    but the report format should look as shown.


    Now that we have successfully downloaded the `Geth`, let us understand what we
    can do with it. First, let us synchronize the blockchain and become a peer in
    the public testnet network.


    ## Synchronizing the testnet blockchain


    We have studied that every peer has a copy of the complete chain in a blockchain
    network. To become a peer, one must first get a copy of the blockchain from the
    other peers in the network. It is called synchronization or `sync`, and this operation
    copies the blockchain data from the genesis block to the recent block.


    Here is the command to start the synchronization process:


    ```bash

    ./geth --testnet --syncmode "fast"

    ```


    Understand the command parameters:


    - `--testnet`: This means we need to only sync the testnet data, which is smaller
    in size than `mainnet`.

    - `--syncmode`: This selects various modes that we can use to sync the chain.
    In the `fast` mode, `Geth` does not validate every block, which reduces the time
    to sync the chain.


    However, syncing the whole chain may take a day depending on your internet connection
    bandwidth.


    You should see the following in the console after running the command:


    ![](images/Figure_2.5.png)


    To check sync status, you can check the terminal and find the pending values.
    Those are the number of blocks that are required to sync before our machine can
    become a peer in the Ethereum testnet network.


    Let us see how to install a private blockchain software called `Ganache`, that
    is specially designed for development purposes.


    ## Installing Ganache


    `Ganache` is a software that allows you to quickly fire up a personal Ethereum
    blockchain that can be used to run tests and execute smart contracts without becoming
    a peer.


    At the time of updating the book, `Ganache` was deprecated. We are keeping this
    part here for the understanding but not recommend you to use it. You can skip
    this to Infura section or read it out for the knowledge.


    To download `Ganache`, visit the official website and download the software form:
    `https://www.trufflesuite.com/ganache`. Once you have downloaded the software,
    unzip it, and run it in your system.


    `Ganache` looks like this upon running:


    ![](images/Figure_2.6.png)


    `Ganache` provides multiple test wallets with test Ethers so that you can perform
    a test. You can check the block and transaction status.


    `Ganache` also has a CLI package that we can install to interact with the Ganache
    Remote Call (RPC) server in a command-line mode. Let us look at the Infura service
    to use it.


    ## Infura


    `Infura` is a third-party Ethereum and IPFS API provider. You can use Infura infrastructure
    to run your applications for free. Infura handles all the synchronization and
    infrastructure, while you, as a developer, can focus on the code. The Infura website
    is as follows:


    ![](images/Figure_2.7.png)


    To use Infura services, you need to create your account using an email address.
    Once your account is created, you can log in to the Infura dashboard, which lists
    the projects you have created along with other details. It looks as shown in the
    following figure:


    ![](images/Figure_2.8.png)


    As you can see in the preceding image, a project has already been created. You
    can create your project by clicking on the button called CREATE NEW PROJECT. Give
    your project a proper name, and Infura will create a test and mainnet network
    for your project behind the scenes.


    Once your project is created, you can view all the details such as the peer endpoint
    you can use to connect to your peer, and project ID and secret.


    You can use the credentials to interact with the Infura network. Ensure that it
    is safe. In the next section, we will take a brief look at the JSON-RPC API provided
    by the Ethereum clients.


    ## JSON Remote Call API


    Ethereum clients provide an application programming interface and a set of RPC
    commands, which are encoded as JavaScript Object Notation (JSON). We refer to
    this as the JSON-RPC API.


    The JSON-RPC API is an interface that allows us to write programs that use an
    Ethereum client as a gateway to an Ethereum network and blockchain. We can interact
    with JSON-RPC server either by building an RPC client in a programming language
    of your choice, or we can directly call the HTTP endpoint.


    First, let us make a simple HTTP call to the Ethereum RPC endpoint and see if
    it works. Here is the command that will return the client version:


    ```bash

    curl -X POST -H "Content-Type: application/json" --data \

    ''{"jsonrpc":"2.0","method":"web3_clientVersion","params":[],"id":1}'' \

    http://localhost:7545

    ```


    In the preceding command, we are sending the JSON-RPC call to the RPC server running
    at port 7545.


    It should return the following output in the Terminal:

