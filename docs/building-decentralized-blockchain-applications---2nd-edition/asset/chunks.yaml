  trans: "\n\n以下是 `IPFS` 运行的默认地址，其格式如下：\n\n```json\n \"Addresses\": {\n  \"API\":\
    \ \"/ip4/127.0.0.1/tcp/5001\",\n  \"Announce\": [],\n  \"Gateway\": \"/ip4/127.0.0.1/tcp/8080\"\
    ,\n  \"NoAnnounce\": [],\n  \"Swarm\": [\n    \"/ip4/0.0.0.0/tcp/4001\",\n   \
    \ \"/ip6/::/tcp/4001\"\n  ]\n }\n```\n\n你可以配置 `API` 和网关地址。通常情况下，它被设置为本地主机地址，可以更改为所需的自定义\
    \ IP 地址。`Swarm` 地址是本地 `IPFS` 节点监听连接到其他 `IPFS` 节点的地址。`API` 地址是 `IPFS` 暴露其 API 端点的地方，以便开发者可以与之交互。\n\
    \n`Gateway` 是可选地址，可用于查看和托管静态文件。如果你希望其他人在你的 `IPFS` 节点中存储文件，可以将此地址设为公开。如果你不想启动 `Gateway`，则请将其留空。\n\
    \n### Bootstrap（引导节点）\n\n这是一个数组列表，`IPFS` 节点在启动后连接到这些地址。`IPFS` 自带了默认的引导节点地址，你可以对其修改。通常建议不要修改，因为\
    \ `IPFS` 作为一个组织，维护着各种服务器来为新节点提供持续的引导连接。\n\n还有其他配置参数，但最好保持默认设置。\n\n让我们在 `IPFS`\
    \ 中托管一个网站，看看它是如何运行的。\n\n## 在 IPFS 中托管静态网站\n\n`IPFS` 是一个分布式文件系统，因此我们可以直接将静态网站托管到\
    \ `IPFS` 的点对点网络中。\n\n在本节中，我们将先创建一个网站，然后将其托管在 `IPFS` 网络中。让我们创建一个简单的网站。\n\n我们的网站看起来如下方的所示：\n\
    \n![](img/Figure_6.9.png)\n\n你可以使用全局 `IPFS` 网络网关访问该网站。URL 如下：\n\nhttp://ipfs.io/ipfs/QmUdeaEham65q8dTRAT1EhrCkywgpacX15feSQ2CacshWt\n\
    \n让我们检查网站的代码。该网站包含一个页面和一些我们将从远程资源下载的图像。你也可以包含本地系统中的图像。\n\n这里是网站 HTML 的头部：\n\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"\
    >\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, shrink-to-fit=no\"\
    >\n<meta name=\"description\" content=\"学习如何使用 Nodejs 编写无人机程序。\">\n<meta name=\"\
    author\" content=\"ShahidShaikh\">\n<title>如何编写无人机</title>\n<!-- Bootstrap core\
    \ CSS -->\n<link href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css\"\
    \ rel=\"stylesheet\">\n</head>\n```\n\n如你所见，我们添加了 Bootstrap 作为级联样式表（CSS）库来样式化内容，并添加了一些\
    \ meta 标签来处理网站的视图区域。\n\n让我们看看网站的内容代码：\n\n```html\n<body>\n<!-- 导航 -->\n<nav class=\"\
    navbarnavbar-expand-lgnavbar-dark bg-dark static-top\">\n<div class=\"container\"\
    >\n<a class=\"navbar-brand\" href=\"/\">如何编写无人机</a>\n<button class=\"navbar-toggler\"\
    \ type=\"button\" data-toggle=\"collapse\" data-target=\"#navbarResponsive\" aria-controls=\"\
    navbarResponsive\" aria-expanded=\"false\" aria-label=\"切换导航\">\n<span class=\"\
    navbar-toggler-icon\"></span>\n</button>\n现在，我们添加代码来显示一些导航菜单：\n<div class=\"collapse\
    \ navbar-collapse\" id=\"navbarResponsive\">\n<ul class=\"navbar-nav ml-auto\"\
    >\n<li class=\"nav-item active\">\n<a class=\"nav-link\" href=\"/\">首页\n<span\
    \ class=\"sr-only\">(当前)</span>\n</a>\n</li>\n<li class=\"nav-item\">\n<a class=\"\
    nav-link\" href=\"https://codeforgeek.com\">博客</a>\n</li>\n<li class=\"nav-item\"\
    >\n<a class=\"nav-link\" href=\"mailto:shahid@codeforgeek.com\">联系</a>\n</li>\n\
    </ul>\n</div>\n</div>\n</nav>\n<!-- 页面内容 -->\n<div class=\"container\">\n<div\
    \ class=\"row align-items-center\">\n<div class=\"col-lg-12\">\n<h1 class=\"mt-5\"\
    >学习如何编写无人机</h1>\n<p class=\"lead\">\n跟随我们操作！\n</p>\n<h2>硬件</h2>\n<p>\n你需要以下硬件：\n\
    <ul>\n<li>\n<a href='https://amzn.to/2TCMcvd'>Parrot ARDrone 2.0.</a>\n</li>\n\
    <li>\n<a href='https://amzn.to/2OvhWBE'>以太网线。</a>\n</li>\n<li>\n<a href='https://amzn.to/2JGka28'>麦克风。</a>\n\
    </li>\n</ul>\n</p>\n```\n*(注：由于原文 HTML 结构存在部分标签闭合错误和逻辑混乱，翻译时保持了原文的结构并仅对文本内容进行了翻译)*\n\
    \n*(注：原文 HTML 代码中存在多处闭合逻辑错误，如 `<ul>` 标签位置错乱，译文已根据语意进行对齐)*\n\n"
- fmt: "\nIn the last section, we understood how to host a static website in the IPFS\
    \ network. In this section, we will build an application using IPFS.\n\nWe will\
    \ build a file upload system where the user can upload a file in the IPFS network\
    \ and get the link to view the uploaded file, just like any other web application\
    \ uploads files. The only major difference is that we will store the file in the\
    \ IPFS network.\n\nHere is the technology stack that we will use:\n\n• Backend:\
    \ `Node.js` framework.\n• Frontend: `HTML`, `CSS`, and `jQuery` framework\n• Storage:\
    \ `IPFS` network\n\nLatest `Node.js` installed should be in your system. If not,\
    \ visit the official `Node.js` website and get the latest version.\n\nNode.js\
    \ website: `https://nodejs.org/en/download/`\n\nLet us look at the following steps:\n\
    \n1. Create a new directory and navigate to it using the `Terminal/Command Prompt`.\n\
    \n2. Create a new `Node.js` project using the following command:\n```bash\nnpm\
    \ init –y\n```\n\n3. Now, let us install the required dependencies that we will\
    \ use in our project. These dependencies are also called node modules:\n```bash\n\
    npm install --save express multer ipfs-api\n```\n\n4. Now, wait for a few seconds\
    \ and let node install the dependencies. `Express` is a module that is widely\
    \ used to build a web application.\n\n`Multer` is a node module that is used to\
    \ handle file uploads in the node ecosystem.\n\n`ipfs-api` is a node module that\
    \ is an interface for the `IPFS` gateway. We will use this module to perform the\
    \ `IPFS` operation.\n\n5. Now, create a new file, name it `ipfs.js`, and copy\
    \ paste the following code:\n\n```javascript\nconst IPFS = require('ipfs-api');\n\
    \nconst ipfsOptions = {\n  host: 'localhost',\n  port: '5001'\n};\n\nconst ipfs\
    \ = new IPFS(ipfsOptions);\n\nfunction addFile(bufferData) {\n  return new Promise((resolve,\
    \ reject) => {\n    ipfs.files.add(bufferData, (err, file) => {\n      if(err)\
    \ { \n        reject(err);\n      }\n      resolve(file);\n    });\n  });\n}\n\
    \nmodule.exports = {\n  addFile: addFile,\n};\n```\n\nIn the preceding code, we\
    \ are first connecting to the `IPFS` that is running on a local machine on `5001`\
    \ ports. You can change it if the port and host details are different in your\
    \ machine.\n\nWe have created a different function to add files to the `IPFS`\
    \ network. `IPFS` takes buffers as an input. We are using the `files.add()` function\
    \ provided by the `IPFS` module to add the file.\n\nThe preceding function returns\
    \ a promise object so that it can be resolved later. It is the best practice to\
    \ write code in server-side JavaScript.\n\n6. Next, let us create a server in\
    \ node. Create a new file called `app.js` and copy paste the following code:\n\
    \n```javascript\nconst express = require(\"express\");\nconst multer = require('multer');\n\
    const fs = require('fs');\nconst app = express();\nconst ipfs = require('./ipfs');\n\
    \nconst storage = multer.diskStorage({\n  destination: function (req, file, callback)\
    \ {\n    callback(null, './uploads');\n  },\n  filename: function (req, file,\
    \ callback) {\n    callback(null, file.fieldname + '-' + Date.now());\n  }\n});\n\
    \nconst upload = multer({ storage : storage}).single('userPhoto');\n\napp.get('/',\
    \ (req,res) => {\n  res.sendFile(__dirname + \"/index.html\");\n});\n\napp.post('/api/photo',\
    \ (req,res) => {\n  upload(req,res, async (err) => {\n    if(err) {\n      return\
    \ res.end(\"Error uploading file.\");\n    }\n    let fileObject = fs.readFileSync(__dirname\
    \ + '/' + req.file.path);\n    let response = await ipfs.addFile(Buffer.from(fileObject));\n\
    \    let link = `http://localhost:8080/ipfs/${response[0].hash}`;\n    res.end(`File\
    \ is uploaded - Click <a href=\"${link}\">here</a> to view the file`);\n  });\n\
    });\n\napp.listen(3000,function(){\n  console.log(\"Working on port 3000\");\n\
    });\n```\n\nLet us understand the code:\n\na. First, we require the modules in\
    \ the following code:\n```javascript\nconst express = require(\"express\");\n\
    const multer = require('multer');\nconst fs = require('fs');\nconst app = express();\n\
    const ipfs = require('./ipfs');\n```\nWe also include the code we wrote for the\
    \ `IPFS` file upload.\n\nb. In the next line of code, we are configuring the `multer`\
    \ module to upload our files in the local system first:\n```javascript\nconst\
    \ storage = multer.diskStorage({\n  destination: function (req, file, callback)\
    \ {\n    callback(null, './uploads');\n  },\n  filename: function (req, file,\
    \ callback) {\n    callback(null, file.fieldname + '-' + Date.now());\n  }\n});\n\
    \nconst upload = multer({ storage : storage}).single('userPhoto');\n```\nIn the\
    \ preceding code, we have added the `uploads` directory to store our files. We\
    \ are also configuring `multer` to allow the user to upload one file at a time\
    \ from the `userPhoto` HTML attribute.\n\nc. In the next line of code, we are\
    \ creating a route for our web application. Routes are a way to define the structure\
    \ of a web application by mapping the URL to the business logic code:\n```javascript\n\
    app.get('/', (req,res) => {\n  res.sendFile(__dirname + \"/index.html\");\n});\n\
    \napp.post('/api/photo', (req,res) => {\n  upload(req,res, async (err) => {\n\
    \    if(err) {\n      return res.end(\"Error uploading file.\");\n    }\n    let\
    \ fileObject = fs.readFileSync(__dirname + '/' + req.file.path);\n    let response\
    \ = await ipfs.addFile(Buffer.from(fileObject));\n    let link = `http://localhost:8080/ipfs/${response[0].hash}`;\n\
    \    res.end(`File is uploaded - Click <a href=\"${link}\">here</a> to view the\
    \ file`);\n  });\n});\n```\n\n7. Next, let us look at the last piece of HTML.\
    \ Create a new file and name it `index.html`, and copy paste the following code:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>File upload using IPFS</title>\n\
    </head>\n<body>\n  <h1>File upload system using IPFS</h1>\n  <form id=\"uploadForm\"\
    \ enctype=\"multipart/form-data\" action=\"/api/photo\" method=\"post\">\n   \
    \ <input type=\"file\" name=\"userPhoto\" />\n    <input type=\"submit\" value=\"\
    Upload Image\" name=\"submit\" />\n  </form>\n  <span id=\"status\"></span>\n\n\
    \  <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/jquery.form/3.51/jquery.form.min.js\"\
    ></script>\n  <script>\n    $(document).ready(function() {\n      $('#uploadForm').submit(function()\
    \ {\n        $(\"#status\").empty().text(\"File is uploading...\");\n        $(this).ajaxSubmit({\n\
    \          error: function(xhr) {\n            status('Error: ' + xhr.status);\n\
    \          },\n          success: function(response) {\n            $(\"#status\"\
    ).empty().html(response);\n          }\n        });\n        return false;\n \
    \     });\n    });\n  </script>\n</body>\n</html>\n```\n\n8. In the preceding\
    \ code, we have included `jQuery` and `jQuery form` library from the content delivery\
    \ network (CDN).\n\n9. We have created a form that submits the file data in a\
    \ multipart format to the API we have created in `app.js`:\nNotice the `action`\
    \ attribute and input `name`. It must be the same as the API route and multer\
    \ file section attribute.\n\n10. It is time to run the code. Run the following\
    \ command in the `Terminal/Command Prompt`:\n```bash\nnode app.js\n```\nYour Terminal\
    \ should print a message saying:\nWorking on port 3000\n\nIt means the app is\
    \ running successfully. Navigate to `localhost:3000` to view the application.\
    \ It should look like this:\n\n![](images/Figure_6.11.png)\n\n11. Now, select\
    \ a file from your system and hit the Upload Image button. You should see a response\
    \ like this:\n\n![](images/Figure_6.12.png)\n\n12. Now, click on the here to view\
    \ the image in the IPFS network.\n"
