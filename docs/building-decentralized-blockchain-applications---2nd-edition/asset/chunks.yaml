- fmt: '

    Blockchain is distributed, which means each computer running the program contains
    a copy of the entire blockchain. It improves the reliability of the data across
    the network.


    Blockchain is peer-to-peer based, and there is no central server required. Anyone
    with a computer and an internet connection can become a part of the network.


    The distributed ledger was built for Bitcoin to handle the money aspect of the
    system. Ledger is a financial recording system containing the credit and debit
    of a particular person or account. While banks have a central ledger, blockchain
    provides distributed ledger spread across thousands of machines.


    Blockchain was built by Satoshi Nakamoto—a pseudonym for the programmer who built
    the Bitcoin, the first cryptocurrency ever. Blockchain was built to remove the
    trust factor from the system and allow computers to send or receive money.


    Blockchain is linked using cryptographic functions. Each block in a chain knows
    the address of the previous block till the genesis block.


    | Tip: The genesis block is the first block that is not mined but hardcoded in
    the system. You can check the genesis block code here:`https://sourceforge.net/p/bitcoin/code/133/tree/trunk/main.cpp#l1613`
    |

    | --- |


    Blockchain stores the blocks that consist of transactions. Once the entry is made
    in the blockchain, it cannot be reversed, so, it is immutable. In the upcoming
    section, we will learn how the entry of blocks is done in the chain.


    The key characteristics of blockchain are as follows:


    - **Immutability**: One of the key characteristics of the blockchain is immutability.
    Once data is submitted in the chain and has been confirmed by 51% of the peers
    in the network, you can never alter it.

    - **Cryptographic**: Blockchain is cryptographically secure and uses asymmetric
    cryptography, where only an intended party with the key can decrypt and see the
    data.

    - **Decentralization**: Blockchain is decentralized, which means there is no central
    authority controlling the network. It is controlled by the participants of the
    network.

    - **Provenance**: Blockchain provides the record of ownership. So, it supports
    true provenance.

    - **Anonymity**: Blockchain provides true anonymity to the end user. No user information
    such as name, IP, and location is stored in the chain, ensuring zero chances of
    censorship and tracking.

    - **Transparency**: Blockchain provides true anonymity to the end user. No private
    user information such as name, IP, and location is stored in the chain, ensuring
    zero chances of censorship and tracking. Blockchain ensures the transparency by
    maintaining the anonymity of the user information.


    Before we proceed further, let us look at the types of blockchain.


    ## Types of blockchain


    Blockchain was meant to be a public ledger. However, due to corporations not wanting
    to share their data with the public, some blockchains are intended to serve corporate
    entities.


    Blockchain, in a nutshell, can be divided into three groups:


    - Public blockchain

    - Federated (or consortium) blockchain

    - Private blockchain


    Let us learn about them in brief.


    ### Public blockchain


    A public blockchain, as the name suggests, is public, so, anyone can join the
    blockchain network to read the data and write to it.


    The Bitcoin network is among the first few public blockchains in the world. You
    might be wondering how it is secure if it is completely open to the public.


    A public blockchain such as Bitcoin has a consensus mechanism that ensure that
    the network is secure, and data is valid across every peer connected to the system.
    The second part is the encryption mechanism used by Bitcoin is asymmetric, so
    it needs the key of the sender and receiver both to decrypt the data, which makes
    it secure and fraud-proof.


    The consensus mechanisms used by the public blockchain can vary between multiple
    consensus algorithms such as `Proof of Work`, `Proof of Stake (PoS)`, etc. We
    will learn and understand more about the consensus algorithm in the coming chapter.


    ### Federated or consortium blockchain


    Federated blockchains are shared blockchain among various federations or entities.
    In simple words, instead of going public, the blockchain is only shared among
    a few organizations.


    Every read and write operation can be done only using the permissions granted
    by the authorities. As it has fewer peers, a federated blockchain is fast and
    efficient as compared to a public blockchain.


    A federated blockchain does not mandatorily require any consensus algorithm to
    handle conflict issues as all the peers in the blockchain network are identified.
    However, we can use a consensus algorithm in the federated blockchain as well.


    ### Private blockchain


    Private blockchain, as the name suggests, is used only by the organization. It
    is not shared with anyone and is only used within the network. Private blockchains
    do not use any consensus to solve conflict issues as it is predefined in the system.
    Only selected peers can insert a block in the network.


    We have studied the blockchain and its types; now, let us understand the history
    of blockchain.


    ## History of blockchain


    The core principles of blockchain—distributed computing, cryptography, decentralization,
    and consensus algorithms—are not new. They have been around since the 90s and
    are taught in computer science classes all around the world.


    So, one may ask, why distributed ledgers technology and blockchain came into existence
    in 2009.


    Well, to find the answer to this, we must understand how our banking system works.
    Banks are the central authority that own your money and keeps a record of every
    transaction you make.


    There was a time when paper currency was printed based on the number of natural
    resources one country possesses, mainly gold and silver. It is unlikely that we
    find gold and silver mines every day, so the supply was limited, and hence, the
    value of the currency.


    The paper currency you currently hold is printed based on credit without the backing
    of natural resources such as gold and silver. This move allows federal banks to
    print as much money as they want.


    Remember Figure 1.1. That is the time when this economic model failed and when
    banks closed like small shops. That was the 2008 global recession.


    So, where is the problem?


    Satoshi thinks it is the central authority of the banks. Satoshi had a vision
    of the currency being supported globally and transferred anywhere without a bank.
    This vision later became Bitcoin.


    However, is Bitcoin the first cryptocurrency ever?


    The first work on cryptocurrency can be traced back to 1991 by Stuart Haber and
    W. Scott Stornetta. This duo wanted to develop a cryptographically secured document
    timestamp system, where the document cannot be altered once stored in the system.


    They used the `Merkle tree` concept to store and track the documents in the system.
    The major work that leads to the development of the first Blockchain is the development
    of `hashcash`—Proof of Work algorithm.


    `hashcash` was developed to prevent spams in the computing system. Later on, Hal
    Finney developed a reusable `Proof of Work` algorithm using `hashcash`.


    Satoshi Nakamoto, in 2008, combined `Merkle trees` and reusable `Proof of Work`
    algorithm with building his blockchain to support the working of a new cryptocurrency.


    The first-ever Bitcoin transaction was done on 12 January 2009 by Satoshi Nakamoto,
    where he sent 50 Bitcoins to Hal Finney.


    Bitcoin transactions have since reached their high to around $20000, as you can
    see in this graph:


    ![](images/Figure_1.2.png)


    At the time of writing this book, no one knew who Satoshi was—the creator of Bitcoin
    and blockchain.


    Now, let us understand the components of the blockchain system.


    ## Blockchain core components


    Blockchain consists of the following core components:


    - **Node**: Computer within the system.

