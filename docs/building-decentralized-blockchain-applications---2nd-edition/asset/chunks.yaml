    # Structure


    In this chapter, we will cover the following topics related to consensus algorithms:


    • Proof of Work consensus

    • Proof of Stake algorithm

    • Delegated Proof of Stake

    • Fault tolerance algorithms

    • Practical Byzantine Fault Tolerance consensus algorithm

    • Tendermint Core


    # Objectives


    After studying this chapter, you should be able to understand consensus algorithm(s)
    and its usage and different types of Algorithms and their applications.


    Let us start with the first consensus algorithm called Proof of Work (PoW).


    ## Proof of Work consensus


    PoW is one of the fundamental consensus algorithms to perform validation in the
    decentralized network. We have briefly covered the PoW consensus algorithm in
    Chapter 1, Introduction to Blockchain and Decentralized Network, and in this section,
    we will cover it in detail.


    As the name suggests, PoW requires proof of the computational effort to prove
    to other participants that the work is legitimate. PoW was invented by Moni Naor
    and Cynthia Dwork in 1993 to prevent denial of service (DoS) attacks by validating
    and requiring some work from the service requester (work means computational effort).


    PoW algorithm was re-invented by Satoshi Nakamoto in the Bitcoin whitepaper where
    Satoshi explained the concept of consensus and how we can validate transactions
    in the decentralized network.


    Let us begin with the working of PoW consensus algorithm in detail. At this point,
    we assume you have read Chapter 1, Introduction to Blockchain and Decentralized
    Network, and understood the basic terminologies of decentralized networks and
    cryptography.


    Bitcoin transactions are stored and assembled in an entity called block. Each
    block contains transactions, and every node contains a copy of the block. Now,
    to submit the block to the main chain, each node must perform a mining activity,
    where they need to find the hash lower than the target hash set by the network.


    One finds the hash through a random algorithm, which is executed by the Bitcoin
    program. The key role in this process is played by hardware strength, as a faster
    CPU or GPU can randomize quicker than a normal computer.


    The problem is directly related to the hardware strength of the network. The higher
    the power of the network, the more difficult the problem, thus ensuring fair participation
    in the network.


    The minted block in the Bitcoin blockchain network is shown in the following figure.
    Notice the nonce and the difficulty. Due to the powerful network, the difficulty
    is also increased proportionally:


    ![](images/Figure_3.1.png)


    Upon successful mining, the miner will produce a number using which other nodes
    can verify if the hash is correct or not. Once it is validated, the block is submitted
    to the network, and miner earns some bitcoin for their effort. When writing this,
    3.125 Bitcoin (~68000 US dollars) was the reward for successful mining.


    Here is one sample of the GPU lined together and the Bitcoin mining program running
    on the computer:


    ![](images/Figure_3.2.jpg)


    While PoW consensus algorithm ensures a strict validation of the transactions
    and blocks, it also presents some serious challenges.


    ### Proof of Work challenges and limitations


    PoW has the following challenges:


    • 51% attack: This is the only security risk Bitcoin and PoW possess, where if
    one owns 51% of the nodes, they can control the network. However, it becomes a
    challenging and cost-intensive.

    • Efficiency: PoW is inefficient and takes time to compute.

    • Hardware and resource consumption: PoW requires heavy hardware such as GPUs.


    To overcome these challenges and provide faster settlement, a Proof of Stake (PoS)
    algorithm was developed.


    ## Proof of Stake algorithm


    PoW is not the only consensus algorithm. PoS is another consensus algorithm used
    in many blockchain networks like Ethereum. It does not require heavy computational
    power like PoW but instead uses the stake of coins to secure the network.


    In PoS, validators are chosen based on the amount of coins they hold and stake.
    The more coins one stakes, the higher the probability of being selected as a validator.
    This mechanism is more energy-efficient than PoW but has its own set of challenges.


    • Security: PoS is not as secure as PoW because the validator can corrupt the
    network with malicious intentions.

    • Adaptability and testing: PoS is not widely tested with scale. It sometimes
    fails when there is network congestion. own• Centralization of validators: There
    is a huge risk involved with malicious validators to form a group and control
    the network.


    ## Delegated Proof of Stake


    Due to the randomness of validator selection and centralization problems that
    may arise, we have a tweaked version of the algorithm called Delegated Proof of
    Stake (DPoS).


    DPoS is the tweaked version of PoS consensus where the validator is selected based
    on the voting and election combined with the collateral stake mechanism. This
    approach is much faster than PoW.


    To select a validator who is going to validate the next block in the network,
    the nodes in the network stake their coins to nodes whom they want to become validators.
    The node with the highest number of coins staked by the users wins the election
    and validates the next block as well as earns transaction fees. The transaction
    fees earned by the validator are then distributed to the nodes who supported it
    based on the stake coins they deposited during the election process.

    '
