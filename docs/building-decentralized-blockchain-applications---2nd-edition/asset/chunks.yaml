- fmt: "\nIdentity management is one of the most critical use cases when it comes\
    \ to managing user-specific data, such as credentials, roles, access management,\
    \ and so on.\n\nIdentity theft is a major concern today; we must ensure that the\
    \ identity of a human or a machine is secure and temper-proof.\n\nIdentity management\
    \ systems generate tons of data. Due to this large-scale data generation, we need\
    \ a database that can scale according to the volume of the data.\n\nBigchainDB\
    \ has characteristics like decentralization, local `MongoDB` node for fast query\
    \ and indexing, and immutability that makes BigchainDB a natural fit for identity\
    \ management systems.\n\n## Internet of Things\n\nInternet of Things (IoT) is\
    \ the digital representation of physical objects that communicate with the network\
    \ and inject data in the network in a periodic manner. IoT devices can be anything,\
    \ and their data ingestion can generate petabytes of data. To handle this amount\
    \ of information, we need a high throughput, fast, tamper-resistant system that\
    \ can also provide quick results. That is where BigchainDB comes in.\n\n## Data\
    \ governance\nData governance is always a controversial issue. In a democratic\
    \ country like India, USA, and UK, the data generated by people is always the\
    \ concern for governments and other agencies due to various reasons. To bring\
    \ data governance into effect without making people feel that they are being monitored,\
    \ there is no other solution than the blockchain.\n\nBigchainDB can be used to\
    \ handle such a large amount of data while allowing the government to watch over\
    \ assets transfer and take action when necessary.\n\n## Audit trails\nAudit trails\
    \ are the records of every action being performed in the system or network of\
    \ systems. BigchainDB can be used on audit trails as they are a natural fit.\n\
    \nAudit trails are used in banking, supply chain, utility market, access control,\
    \ and so on. Due to a large amount of data generation and the nature of the record,\
    \ BigchainDB can be used to store, manage, query audit trails records.\n\nLet\
    \ us proceed and set up the BigchainDB node in your local system.\n\n## Running\
    \ a BigchainDB node\nBigchainDB requires a `MongoDB` instance running in your\
    \ system. So before installing and running BigchainDB, we need to install and\
    \ configure `MongoDB` in our system:\n\n1. Visit the official website of `MongoDB`\
    \ and download the software according to the operating system you have.\n\n2.\
    \ Once `MongoDB` is installed, run the `MongoDB` daemon process using the following\
    \ command:\n\n```\nmongod --dbpath=.\n```\n\nYou can change the path of the `dbpath`\
    \ variable if you want to store the data at different locations.\n\n3. Once `MongoDB`\
    \ is running, we can install the BigchainDB in our system using the following\
    \ command:\n\n```bash\nsudo pip3 install bigchaindb\n```\n\n4. After installation,\
    \ you can run the following command to start the BigchainDB server:\n\n```bash\n\
    bigchaindb -y configure mongodb\n```\n\n5. Start the BigchainDB server:\n\n```bash\n\
    bigchaindb start\n```\n\n6. Now, navigate to `http://localhost:9984` to verify\
    \ the BigchainDB installation.\n\nYou should get the following response:\n\n```json\n\
    {\n  \"api\": {\n    \"v1\": {\n      \"assets\": \"/api/v1/assets/\",\n     \
    \ \"docs\": \"https://docs.bigchaindb.com/projects/server/en/v1.2.0/http-client-server-api.html\"\
    ,\n      \"outputs\": \"/api/v1/outputs/\",\n      \"statuses\": \"/api/v1/statuses/\"\
    ,\n      \"streams\": \"ws://localhost:9985/api/v1/streams/valid_transactions\"\
    ,\n      \"transactions\": \"/api/v1/transactions/\"\n    }\n  },\n  \"docs\"\
    : \"https://docs.bigchaindb.com/projects/server/en/v1.2.0/\",\n  \"keyring\":\
    \ [\n    \"6qHyZew94NMmUTYyHnkZsB8cxJYuRNEiEpXHe1ih9QX3\",\n    \"AdDuyrTyjrDt935YnFu4VBCVDhHtY2Y6rcy7x2TFeiRi\"\
    \n  ],\n  \"public_key\": \"NC8c8rYcAhyKVpx1PCV65CBmyq4YUbLysy3Rqrg8L8mz\",\n\
    \  \"software\": \"BigchainDB\",\n  \"version\": \"1.2.0\"\n}\n```\n\nBigChainDB\
    \ is successfully installed in your system.\n\n## Conclusion\nBigchainDB is a\
    \ powerful and promising software that can bring the best of both the worlds:\
    \ Blockchain and traditional databases; which is the need of the hour. We studied\
    \ the features of BigchainDB and its various use cases. We also studied how to\
    \ set up a simple BigchainDB node for local development.\n\nIn the next chapter,\
    \ we will study another blockchain-based database called Ties.DB.\n\n**Join our\
    \ book’s Discord space**\n\nJoin the book’s Discord Workspace for Latest updates,\
    \ Offers, Tech happenings around the world, New Release and Sessions with the\
    \ Authors:\n\n[https://discord.bpbonline.com](https://discord.bpbonline.com)\n\
    \n![](images/Discord.png)\n\n# CHAPTER 9 Amazon Quantum Ledger Database\n\n##\
    \ Introduction\nAmazon Quantum Ledger Database (Amazon QLDB) is a fully managed\
    \ Amazon ledger database. Amazon QLDB offers central trusted authority ownership\
    \ to the information present in the ledger. Amazon QLDB provides a transparent,\
    \ immutable, and cryptographically verifiable transaction log of all your application\
    \ changes.\n\n| Note: This service has been discontinued. |\n\n## Structure\n\
    In this chapter, we will cover the following topics:\n\n- Amazon Ledger Database\n\
    - Features of Amazon Ledger Database\n- Amazon Ledger Database use cases\n- Using\
    \ Amazon Ledger Database\n- Amazon Ledger Database drivers\n\n## Objectives\n\
    After studying this chapter, you will be able to learn the basics of QLDB, how\
    \ to use it in the AWS console, and how to use drivers.\n\nLet us get started\
    \ with the introduction.\n\n## Amazon Quantum Ledger Database\nAs stated earlier,\
    \ QLDB is a fully managed ledger database. As a developer, you do not have to\
    \ worry about the installation, configuration, and administration of the database.\
    \ Amazon handles everything for you.\n\nUnlike other decentralized databases we\
    \ covered in the earlier chapters, QLDB is centrally owned, which means a single\
    \ or group of authorities has ownership; hence, it is categorized as a private\
    \ database.\n\nAmazonQLDB provides an immutable database, so data cannot be modified\
    \ once written. If a modification is needed, a new record is created, and history\
    \ is maintained with the old and new records so that one can verify the changes.\n\
    \nAmazonQLDB is available in the AWS console as a cloud service. Hence, you pay\
    \ for what you use.\n\nAmazonQLDB uses SQL-like query language to perform operations\
    \ on the data. It is a welcome move for a large set of developers who want to\
    \ use the immutable database with blockchain functionality, but it gets passed\
    \ on due to the learning curve.\n\nAmazonQLDB also provides drivers for programming\
    \ languages such as Java, .NET, JavaScript, and Python.\n\nIn the next section,\
    \ we will learn more about the features of QLDB.\n\n## Features of Amazon Quantum\
    \ Ledger Database\nAmazonQLDB provides the following features:\n\n- Ledger database:\
    \ A transaction in a traditional database is generally stored in the database\
    \ and tables. The database maintains the state of the transaction and takes action\
    \ in case of an error or rollback.\n\nThe transaction log is a core component\
    \ of the Structured Query Language (SQL) database systems. It plays an important\
    \ role in replaying transactions in the event of system failure, disaster recovery,\
    \ or data replication.\n\nIn traditional database systems, transaction logs are\
    \ not immutable and serve a purpose in terms of transaction failure or rollback.\n\
    \nIn Amazon QLDB, the ledger, structurally similar to a transaction log, is the\
    \ core component of the database. The ledger is an immutable, append-only data\
    \ structure that stores the transaction data, along with the associated metadata.\n"
