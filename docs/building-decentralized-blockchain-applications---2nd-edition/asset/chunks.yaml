    \n## [Conclusion](#toc.xhtml#zh90)\n\nOrbitDB is one of the key projects in the\
    \ decentralized application space. The development of this project is crucial\
    \ for decentralized movement and to make developers transition to the new development\
    \ stack with a little learning curve. We studied about OrbitDB and the various\
    \ data models offered by it. We also learned about the OrbitDB installation and\
    \ how to use it in your project. Moving forward, we built an end-to-end application\
    \ using OrbitDB as a database and IPFS as a file system.\n\nIn the next chapter,\
    \ we will learn about another popular database that runs on top of the blockchain—BigchainDB.\n\
