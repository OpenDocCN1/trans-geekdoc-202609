    \n[Index](#index.xhtml#c12)\n\n# [CHAPTER 1  \n\n**Introduction to Blockchain\
    \ and Decentralized Network**](#toc.xhtml#zc01)\n\n## [Introduction](#toc.xhtml#zh01)\n\
    \nIn this chapter, we will learn about blockchain as a cryptographically secure\
    \ chain of records linked together and replicated across several peers around\
    \ the world. Blockchain works with various underlying technologies such as immutable\
    \ Merkle tree, hashing, decentralized networking, replication, and so on.\n\n\
    ## [Structure](#toc.xhtml#zh02)\n\nIn this chapter, we will cover the following\
    \ topics:\n\n• Introduction to blockchain\n\n• Types of blockchain\n\n• History\
    \ of blockchain\n\n• Blockchain core components\n\n• Consensus \n\n• Bitcoin\n\
    \n• Bits\n\n• Blockchain and decentralization\n\n• Decentralized application\n\
    \n• Working of decentralized applications or DApps\n\n• DApps protocols\n\n• Networking\
    \ layers\n\n• Data definition and naming layer\n\n• Data layer\n\n## [Objectives](#toc.xhtml#zh03)\n\
    \nAfter reading this chapter, you should be able to understand how a blockchain\
    \ works and the types of blockchain present. You will also understand decentralization\
    \ and how a consensus is reached in a decentralized network.\n\n## [Introduction\
    \ to blockchain](#toc.xhtml#zh04)\n\nThe Times 03 January 2009 Chancellor on brink\
    \ of second bailout for banks:\n\n![](images/Figure_1.1.jpg)\n\nOn 3 January 2009,\
    \ Satoshi Nakamoto mined the first-ever block of Bitcoin—a peer-to-peer decentralized\
    \ cryptocurrency—and added the headline of The Times as a message in the block.\n\
    \nYou might be wondering why this message is the first phrase of the book? This\
    \ is because the message is marked in history as the day when a revolution in\
    \ the century-old finance industry began.\n\nIn this chapter, we will study, in\
    \ brief, the history of blockchain and Bitcoin. We will also dive into the secret\
    \ life of Satoshi Nakamoto, the creator of blockchain, and distributed ledger\
    \ technology and Bitcoin.\n\nWe will also learn about the different types of blockchain\
    \ and their uses. We will look at how Bitcoin works in-depth and how this decentralized\
    \ network manages the most important thing in history—money.\n\nHowever first,\
    \ let us understand the basics of blockchain in brief.\n\n### [Knowing blockchain](#toc.xhtml#zs01)\n\
    \nBlockchain is an immutable, peer-to-peer, distributed ledger containing the\
    \ records in a format called blocks that are linked together using cryptography,\
    \ and hence the name blockchain."
