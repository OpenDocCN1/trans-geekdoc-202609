    \ that deal with various aspects of the application, such as log-in, signup, creating\
    \ an email, and reading an email. Let us see how we create an email and read an\
    \ email using a public and private key combination.\n\nFirst, let us look at the\
    \ code that generates the public and private key pairs. In the `utils` folder,\
    \ check the code in `genkey.js`:\n\n```javascript\nconst crypto = require('asymmetric-crypto');\n\
    \nfunction generateKeys() {\n  let pair = crypto.keyPair(); \n  return {\n   \
    \ privateKey: pair.secretKey,\n    publicKey: pair.publicKey\n  }\n}\nmodule.exports\
    \ = generateKeys;\n```\n\nWe are using the `asymmetric-crypto` node module to\
    \ create a new pair of public and private keys on a random basis. We can also\
    \ create a public and private key pair by using the input seeds.\n\nWe are using\
    \ the same module to encrypt and decrypt the email. You can check the code placed\
    \ in the `utils` folder:\n\n```javascript\nconst crypto = require('asymmetric-crypto');\n\
    \nfunction encryptEmail(data, pair) {\n  try {\n    let encryptedEmail = crypto.encrypt(data,\
    \ pair.publicKey, pair.privateKey);\n    return encryptedEmail;\n  }\n  catch(e)\
    \ {\n    console.log('error occurred in encrypting email');\n    return null;\
    \ \n  }\n}\nmodule.exports = encryptEmail;\n```\n\nHere, we are using the public\
    \ and private key pair passed to the function to encrypt the data, which is our\
    \ email.\n\nWe are also performing the decryption of emails using the following\
    \ code:\n\n```javascript\nconst crypto = require('asymmetric-crypto');\n\nfunction\
    \ decryptEmail(emailData, keys) {\n  try {\n```\n"
