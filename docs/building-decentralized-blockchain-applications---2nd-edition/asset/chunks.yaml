    \ contacts database is ready.')\n});\nuserEmailsDb.events.on('ready', () => {\n\
    \  console.log('user emails database is ready.')\n});\n```\n\nIn the end, we are\
    \ calling our function when the server starts loading the database:\n\n```javascript\n\
