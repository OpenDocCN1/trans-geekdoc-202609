    \ () => {\n  console.log('user contacts database is ready.')\n});\nuserEmailsDb.events.on('ready',\
    \ () => {\n  console.log('user emails database is ready.')\n});\n```\n\n最后，当服务器加载数据库时，我们调用我们的函数：\n\
    \n```javascript\n// 加载数据库\nloadDB();\n```\n\n一旦创建了数据库，`dbaddress.js` 文件或数据库地址就可以与其他节点共享，以便它们成为网络的一部分。这就是我们为应用程序创建和加载\
    \ `OrbitDB` 数据库的方式。\n\n`db.js` 文件中还有其他处理应用程序各个方面的函数，例如登录、注册、创建邮件和读取邮件。让我们来看看如何使用公钥和私钥组合来创建邮件和读取邮件。\n\
    \n首先，让我们生成公钥和私钥对的代码。在 `utils` 文件夹中，查看 `genkey.js` 代码：\n\n```javascript\nconst\
    \ crypto = require('asymmetric-crypto');\n\nfunction generateKeys() {\n  let pair\
    \ = crypto.keyPair(); \n  return {\n    privateKey: pair.secretKey,\n    publicKey:\
    \ pair.publicKey\n  }\n}\nmodule.exports = generateKeys;\n```\n\n我们使用 `asymmetric-crypto`\
    \ node 模块随机生成新的公私钥对。我们也可以通过输入种子创建公钥私钥对。\n\n我们使用同一个模块对邮件进行加密和解密。你可以检查放在 `utils`\
    \ 文件夹中的代码：\n\n```javascript\nconst crypto = require('asymmetric-crypto');\n\n\
    function encryptEmail(data, pair) {\n  try {\n    let encryptedEmail = crypto.encrypt(data,\
    \ pair.publicKey, pair.privateKey);\n    return encryptedEmail;\n  }\n  catch(e)\
    \ {\n    console.log('加密邮件时发生错误');\n    return null; \n  }\n}\nmodule.exports\
    \ = encryptEmail;\n```\n\n在这里，我们使用传递给函数的公私钥对对数据进行加密，数据就是我们的邮件。\n\n我们还使用以下代码执行邮件的解密：\n\
    \n```javascript\nconst crypto = require('asymmetric-crypto');\n\nfunction decryptEmail(emailData,\
    \ keys) {\n  try {\n```\n"
