    # CHAPTER 6 Interplanetary File System


    ## Introduction


    In this chapter, we will learn about the Interplanetary File System (IPFS), as
    a distributed system to store, access, and share files. IPFS has an ambitious
    goal to turn the existing centralized internet to distributed internet. it aims
    to replace `HTTP` as a default protocol to share files over the internet. We will
    also learn about how to install and configure IPFS and build a full-stack application
    using IPFS.


    ## Structure


    In this chapter, we will learn the following:


    - Introduction to Interplanetary File System

    - Working of Interplanetary File System

    - Installing and configuring Interplanetary File System

    - Hosting a static website in IPFS

    - Building a full-stack application using IPFS

    - IPFS Cluster


    ## Objectives


    After studying this chapter, you should be able to understand IPFS core concepts
    and working of IPFS protocol, and the use of IPFS to build the application. Let
    us get started.


    ## Introduction to Interplanetary File System


    According to the IPFS official website:


    IPFS is a distributed system for storing and accessing files, websites, applications,
    and data.


    IPFS provides a platform for developers to store data on distributed platforms.
    There are projects such as `OrbitDB` (we will learn about it in the upcoming chapters),
    that provide database solutions on top of `IPFS`. Due to the distributed nature
    of `IPFS`, it is the first choice for decentralized application (DApp) development.
    In the previous chapter, we studied building applications using `Ethereum` and
    used `Swarm` as a storage solution. `IPFS` uses content-based addressing instead
    of location-based addressing to access files. So, location-based addressing is
    what we will use; currently, we use domain names or IP addresses to access the
    content.


    Consider this example:


    `https://abc.com/hello.html`


    Here, we are accessing the `hello.html` file using the domain name. The domain
    name, in turn, looks out for the IP address of the server and picks up the file
    from the server.


    In the `IPFS`, we use content addressing. Let us look at an example:


    `https://ipfs.io/QmXoypizjW3WknFiJnKLwHCnL72vedxjQkDDP1mXWo6uco/hello.html`


    As you can see here, we access the content by the hash. Hash represents the file
    and not the location where the file is stored. It is the responsibility of the
    `IPFS` network to collect the bits and pieces of the file and deliver them to
    the user.


    Let us understand how `IPFS` works in the following sections.


    ## Working of Interplanetary File System


    IPFS is a distributed peer-to-peer storage network. In `IPFS`, content is accessed
    from peers spread across the world. Peers in `IPFS` can relay information, store
    information, or do both.


    `IPFS` works by forming a network using independent peers. These peers store and
    relay files information asked by the users.


    `IPFS` uses the following important modules to make the network work:


    - Content-based addressing

    - Directed acyclic graph (DAG)

    - Distributed hash table (DHT)


    Let us explore these modules in detail.


    ### Content-based addressing


    IPFS uses content-based addressing to identify data by what is in it, rather than
    by where it is located.

