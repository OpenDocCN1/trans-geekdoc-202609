  trans: "\n\n如果你正在使用 `VS Code`，建议安装 `Solidity` 扩展。操作步骤如下：\n\n1. 要安装，点击 `VS Code`\
    \ 左侧栏的 `Extension`（扩展）图标并搜索 `solidity`。\n2. 点击 `Install`（安装）按钮即可开始。\n3. 假设你已经安装了\
    \ `Node.js`，这里是安装 `Hardhat` 的流程。\n\n`Hardhat` 是一个以太坊开发框架，它让编写和部署智能合约变得简单且对开发者友好。现在，参考以下步骤：\n\
    \n1. 运行以下命令在你的机器上安装 `Truffle`：\n```bash\nnpm install --save-dev hardhat\n```\n\
    2. 一旦完成，我们就可以继续项目。\n3. 创建新文件夹并使用命令行进入该文件夹。运行此命令创建一个新的 `Hardhat` 项目。\n4. 创建文件夹：\n\
    ```bash\nmkdir solidityDemo\ncd solidityDemo\n```\n5. 然后，运行以下命令：\n```bash\nnpx\
    \ hardhat init\n```\n它应该会在终端中输出以下内容：\n\n![](img/Picture_2.11.png)\n\n现在，在你的代码编辑器中打开项目。项目的结构如下：\n\
    \n- `contracts`\n- `ignition`\n- `test`\n- `artifacts`\n- `hardhat-config.js`\n\
    \n`contracts` 文件夹存储用 `Solidity` 编写的代码。`ignition` 文件夹包含部署合约的脚本。`hardhat-config.js`\
    \ 包含配置选项；我们的项目不需要修改该文件。\n\n切换到 `contracts` 文件夹，你应该看到 `Lock.sol` 文件，其内容应该如下：\n\n\
    ```solidity\npragma solidity ⁰.8.24;\n\ncontract Lock {\n    uint public unlockTime;\n\
    \    address payable public owner;\n    event Withdrawal(uint amount, uint when);\n\
    \    constructor(uint _unlockTime) payable {\n        require(\n            block.timestamp\
    \ < _unlockTime,\n            \"Unlock time should be in the future\"\n      \
    \  );\n        unlockTime = _unlockTime;\n        owner = payable(msg.sender);\n\
    \    }\n    function withdraw() public {\n        // 注消此行，以及导入 \"hardhat/console.sol\"\
    ，以便在终端中打印日志\n        // console.log(\"Unlock time is %o and block timestamp is\
    \ %o\", unlockTime, block.timestamp);\n        require(block.timestamp >= unlockTime,\
    \ \"You can't withdraw yet\");\n        require(msg.sender == owner, \"You aren't\
    \ the owner\");\n        emit Withdrawal(address(this).balance, block.timestamp);\n\
    \        owner.transfer(address(this).balance);\n    }\n}\n```\n\n在继续之前，让我们理解一下这个程序：\n\
    \n1. 第一行告诉编译器应该使用哪个版本的 `solidity`，这非常重要。如果 `solc` 版本与 `0.8.24` 不同，请如上所示将版本更改为你的版本。\n\
    2. 第二行声明了一个新的 `contract`（合约），并在其内部包含了合约的不同函数。\n3. 让我们通过运行此命令来编译此程序：\n```bash\n\
    npx hardhat compile\n```\n它应该在控制台中返回以下输出：\n\n![](img/Figure_2.12.png)\n\n4. 现在，让我们部署该合约。在新的终端窗口中，运行此命令以运行本地以太坊节点来部署智能合约。\n\
    ```bash\nnpx hardhat node\n```\n5. 现在，让我们将编译后的合约部署到本地区块链节点。运行以下命令进行部署。确保你在网络参数中添加了\
    \ `localhost` 值。\n```bash\nnpx hardhat ignition deploy ./ignition/modules/Lock.js\
    \ --network localhost\n```\n它将在区块链中部署我们的智能合约并返回交易 ID。此命令在你的终端上应该显示如下内容：\n\n![](img/Figure_2.13.png)\n\
    \n你已成功在以太坊区块链上创建、编译并部署了一个智能合约。\n\n在本节中我们简要介绍了 `Solidity`。它将帮助你获得具有状态管理的静态类型语言的经验。\n\
    \n在下一节中，我们将学习基于以太坊的 `DApps` 框架。\n\n# 使用以太坊的去中心化应用\n\n在本节中，我们将探索使用以太坊平台进行 `DApp`\
    \ 开发。以太坊构建的 `DApp` 是在后端执行智能合约并在去中心化网络中托管前端的应用。\n\n简而言之，使用以太坊的 `DApp` 由以下部分组成：\n\
    \n- **前端**：`HTML`、`CSS`、`JavaScript` 和静态文件\n- **后端**：智能合约、区块链\n\n一个应用可能不仅需要智能合约，以太坊提供了以下项目来满足这些需求：\n\
    \n- **Swarm**：去中心化存储网络。\n- **Whisper**：动态通信协议。\n- **Smart contracts**：图灵完备的编程语言和接口：\n\
    \n![](img/Figure_2.12.png)\n\n考虑以下去中心化的应用方面：\n\n- 前端\n- 后端\n- 存储\n- 通信\n- 名称解析\n\
    \n由于应用是去中心化的，这些方面可能不需要去中心化服务器。目前，`DApps` 可以使用去中心化服务。\n\n让我们来看看 `DApps` 的优势：\n\n\
    - **韧性**：`DApps` 运行在区块链上，不像部署在中心化服务器的应用，它不会宕机。\n- **透明性**：`DApps` 存储在区块链上，任何人都可以检查。`DApps`\
    \ 代码、执行和结果完全透明的。\n- **抗审查性**：只要网络运行，任何人都可以访问并使用 `DApps`。这不需要许可。\n- **无信任系统**：与用户信任公司存储数据的中心化应用不同，`DApps`\
    \ 使用端到端加密是安全的。\n- **安全性**：由于使用了端到端加密，`DApps` 是安全且可靠的。除了人为错误外，机器不会泄露数据。\n- **无单点故障**：由于应用的去中心化，系统中不存在单点故障。除非网络节点节点，否则应用就可以运行。\n\
    - **支付**：由于 `DApps` 运行在以太坊区块链之上，不需要集成第三方支付。支付通过加密货币实现并记录在链上。\n\n如你所示，`DApp` 指出了我们目前面临的一些核心问题。审查、财务欺诈、文档篡改和选举舞弊是一些常见问题。`DApps`\
    \ 和区块链解决了这些问题，并帮助我们进化到 Web 的下一个版本，即 Web 3.0——属于人民的互联网。\n\n# DApps 栈\n\n以太坊的 `DApps`\
    \ 栈包含以下内容：\n\n- 前端 (`HTML`、`CSS`、`JavaScript`)\n- 智能合约\n- 数据存储 (`IPFS` 和 `Swarm`)\n\
    - 去中心化消息通信 (`Whisper`)\n\n让我们详细了解它们。\n\n## 前端\n\n`DApps` 的前端可以使用几十年年来用于构建网站和应用程序的标准技术编写。\n\
    \n与需要理解以太坊如何工作并使用 `Solidity` 编写代码的后端不同，前端允许传统的 Web 开发者使用熟悉的技术、工具、框架和库。与区块链的通信可以通过\
    \ API 或 RPC 调用完成。\n\n"
