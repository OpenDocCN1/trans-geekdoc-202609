  raw: "[Chapter 7](#chap07.xhtml#c07)  introduces the first decentralized database\
    \ of this book— OrbitDB. It is a serverless peer-to-peer decentralized database\
    \ software that runs on top of IPFS. OrbitDB provides easy-to-use APIs to help\
    \ developers integrate and build applications. \n\n[Chapter 8](#chap08.xhtml#c08)\
    \  discusses the BigchainDB—a blockchain-based database. BigchainDB is an asset-focused\
    \ database that provides all the blockchain features, along with modern database\
    \ capabilities such as indexing, querying, and processing. \n\n[Chapter 9](#chap09.xhtml#c09)\
    \  reviews the Amazon Quantum Ledger Database—QLDB. Amazon QLDB is a cloud-based\
    \ database solution that offers ledger-based record management. \n\n[Chapter 10](#chap10.xhtml#c10)\
    \  introduces the DTube—a decentralized version of YouTube. We will look at how\
    \ DTube works and its architecture, along with how we can use it to host and share\
