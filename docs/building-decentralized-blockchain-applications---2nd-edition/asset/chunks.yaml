    如之前的截图所示，`IPFS Stack` 分为三个子层：


    • 网络层

    • 数据定义与命名层

    • 数据层


    让我们简要介绍一下每个子栈。


    ## 网络层


    去中心化网络的核心挑战之一是点对点网络，以及设计在点对点网络中与中心化系统并行运行的协议。


    `libpeer-to-peer` 项目通过协议实验室（protocols labs）解决了这一挑战。`libpeer-to-peer` 提供了一个模块化的堆栈，人们可以使用它结合现有协议（如
    `WebRTC`）或任何新的传输层协议来构建点对点网络。


    因此，`lib-to-peer` 是与传输无关的。


    `libpeer-to-peer` 的特性包括：


    • `libpeer-to-peer` 是一个模块化的网络栈。你可以使用它的全部，也可以使用该栈的部分来构建你的应用程序。

    • `libpeer-to-peer` 提供了传输和点对点协议，用于构建大型、健壮且可扩展的网络应用程序。

    • `libpeer-to-peer` 与传输协议无关。它可以与 `TCP`、`UDP`、`WebRTC`、`WebSockets` 和 `UDP` 一工作。

    • `libpeer-to-peer` 提供了多个模块，如传输接口、发现、分布式哈希查找、节点发现和路由。

    • `libpeer-to-peer` 提供了内置加密以防止窃听。

    • `libpeer-to-peer` 提供了内置漫游功能，使得你的服务可以在没有任何干预且不丢包的情况下切换网络。


    `libpeer-to-peer` 是构建点对点网络层的基础性解决方案。


    ## 数据定义与命名层


    通过哈希进行的内容寻址（Content addressing）在分布式系统中被广泛使用。我们在 `Git`、`加密货币`等使用了基于哈希的内容寻址。这种方法也同样用于点对点网络中。


    `IPLD` 为所有基于哈希的协议提供了统一的命名空间。使用 `IPLD`，可以跨越各种协议遍历数据，以探索和查看分布在点对点网络中的数据。


    `IPNS` 是一个为存储在 `IPFS` 的内容创建可变地址的系统。它们之所以是可变的，是因为内容每次发生变化时，其地址也会发生变化。


    ## 数据层


    栈的最顶层是数据层。`IPFS` 是点对点多媒体协议。`IPFS` 提供了一种跨越点对点网络存储和检索数据的方法。


    它使用 `IPNS` 和 `libpeer-to-peer` 在点对点网络中创建、命名和发布内容。


    任何人都可以成为 `IPFS` 节点并开始使用哈希查找内容。`IPFS` 节点不需要存储所有数据，它们只需要存储自己创建的数据，或者它们过去搜索过的数据。


    `IPFS` 的特性包括：


    • `IPFS` 为 Web 3.0 提供了点对点多媒体协议。

    • `IPFS` 可以与现有的协议和浏览器配合。它实现了从中心化 Web 到 Web 3.0 的平滑过渡。

    • `IPFS` 使用 `libpeer-to-peer` 支持点对点网络。

    • `IPFS` 数据是加密安全的。

    • `IPFS` 可以在流媒体服务中节省大量带宽。


    `IPFS` 正在开发中，开发者已经构建了一些运行在 `IPFS` 之上的优秀应用。我们选择的应用之一是 `DTube`。


    它是 YouTube 的去中心化版本，带有由 `Steem` 区块链提供的内置激励和奖励功能。


    `IPFS` 也试图解决激励问题。我们不能期望每个连接互联网的人都充当节点。开发者在 `IPFS` 之上构建了一些很棒的应用。我们选择的应用之一包括：


    • OrbitDB: 点对点数据库

    • Ocean Protocol: 分布式数据库

    • Filecoin: 数据交换协议

    '
- fmt: '

    After the introduction of Bitcoin, Ethereum was the way to go when the world realized
    the power of blockchain beyond finance, and it serves well. Let us learn briefly
    about difference between Bitcoin and Ethereum.


    # Bitcoin and Ethereum


    Ethereum used to share many common elements with Bitcoin such as a P2P network,
    proof of work consensus algorithm to maintain conflict-free state, cryptocurrencies
    such as Ether to support incentive and utility payment in the network, wallets,
    and digital signature.


    Now, at the time of updating this book, Ethereum has moved away from proof of
    work consensus to proof of stake algorithm which draws a fundamental shift and
    different in both of the platforms.


    However, Ethereum differs from Bitcoin in design and purpose. While Bitcoin is
    designed to support the global cryptocurrency system, Ethereum is designed as
    a programmable virtual machine (`VM`) capable of executing programs on the blockchain.


    Bitcoin supports simple code execution in the form of scripts that support normal
    if/else statements, and Ethereum supports Turing complete programming language.


    In short, Bitcoin is limited to cryptocurrency, Ethereum is an open and general-purpose
    Turing complete `VM`.


    Ethereum, with its general-purpose programming language and a wide range of software
    development kit, allows developers across the globe to build their applications.
    One of the famous applications is CryptoKitties.


    CryptoKitties is a game that runs on Ethereum blockchain that allows players to
    buy, breed, and sell virtual cats on the blockchain. It is extremely popular and
    gave the world a bird-eye view of the capability of the blockchain.


    Ethereum''s scope is wide and allows developers to write their applications without
    the need of creating a blockchain and network by themselves. Developers can focus
    on building applications, while network infrastructure, state management and code
    execution are handled by the Ethereum network.


    Let us learn a little about the history of Ethereum to understand the reason behind
    the invention of this amazing project.


    # History of Ethereum


    All great innovations solve big problems, and Ethereum is no exception. Ethereum
    was invented at a time when people recognized the widespread application of the
    Bitcoin model, and were trying to move beyond cryptocurrency.


    Though it was not easy, developers faced a problem that required a new set of
    protocols and tools. They had to either build a new application on top of Bitcoin
    or start a new blockchain (it is a hard thing to do for every single application).


    If developers choose to build on top of the Bitcoin model, they face issues, mainly
    technical, because Bitcoin is developed to support cryptocurrency, and to move
    beyond it requires an immense amount of effort and probably a fork in the chain.


    For projects that needed more freedom and flexibility while using blockchain,
    a new blockchain was the only option. But that meant a lot of work: Bootstrapping
    all the infrastructure elements, development, team building, testing, and so on.


    In December 2013, Vitalik Buterin, a Russian\-Canadian programmer and Bitcoin
    enthusiast, published a paper that coined the idea of Turing complete general-purpose
    blockchain:


    ![](images/Figure_2.1.jpg)


    Here is the link to the Ethereum white (yellow) paper (it is recommended that
    all of you read it once): `https://ethereum.github.io/yellowpaper/paper.pdf`.


    The idea behind Ethereum was to design a general-purpose blockchain that is programmable
    so that anyone around the world can program the applications and run it on the
    blockchain without developing the underlying mechanisms of P2P networks, blockchains,
    consensus algorithms, and so on.


    In July 2015, the first Ethereum block was mined. It marks the date for the general-purpose
    world computer to begin its work. The following figure marking the first Ethereum
    transaction:


    ![](images/Figure_2.2.png)


    Ethereum has grown to become the largest blockchain network in the world and has
    opened ways for a new set of applications—decentralized applications (`DApps`).


    In the next section, let us learn about the components of Ethereum blockchain.


    # Components of Ethereum


    In Ethereum, the following components play important roles:


    - P2P network: Ethereum, like Bitcoin, runs on the mainnet network that is accessible
    by default at port `30303` on your computer. Ethereum P2P network communicates
    with each other using a protocol called `ÐΞVp2p Wire Protocol`.

    - Consensus mechanism: Ethereum uses a proof of stake consensus algorithm.

    - Transactions: Ethereum transactions include information about the network, along
    with the sender, recipient, value, and payload.

    - State machine: This is a unique and important component of the Ethereum. Ethereum
    state transitions are managed by `Ethereum VM`, a `VM` that executes bytecode
    generated by programs called smart contracts.

    - Data structure: Ethereum state is also locally stored in each node. Ethereum
    by default uses the database (also called `LevelDB`), which contains the transactions
    and system state in a Merkle tree format.

    - Clients: Ethereum provides several client software, such as `go-ethereum` also
    called `Geth` and `Parity` (deprecated).


    In the next section, we will look at the transition of Ethereum from a general-purpose
    blockchain to `DApps`.


    # Ethereum and DApps


    Project Ethereum was started as a means to build a general-purpose blockchain
    that could be programmed for a variety of uses. Ethereum''s vision swiftly expanded
    to become a platform for programming and hosting `DApps`.


    `DApps` portray a wider perspective than smart contracts. A `DApp` is, at the
    minimum, a smart contract, and a web user interface. More broadly, a `DApp` is
    a web application that is developed on top of open, decentralized, P2P network
    and infrastructure.


    A `DApp` is composed of at least the following:


    - Smart contracts on a blockchain.

    - A web frontend user interface.


    Also, many `DApps` include other decentralized components, such as:


    - A decentralized (P2P) storage protocol and platform such as Interplanetary File
    System (`IPFS`) and `Swarm`.

    - A decentralized (P2P) messaging protocol and platform such as `libp2p` and `Whisper`.


    The idea and origin of `DApps` is aimed to take the World Wide Web (`WWW`) to
    its next evolutionary stage, introducing decentralization with P2P protocols into
    every aspect of web application. The term used to describe this evolution is Web
    3.0, meaning the third version of the web. The `WWW` controlled by no central
    authority.


    In the next section, we will explore the capability of Ethereum `DApps` in detail.


    Let us start with the development of smart contracts. Before writing the smart
    contracts, we must learn about Ethereum clients, that is, running blockchain in
    your system or using free third-party services.


    # Ethereum clients


    Ethereum provides client software to become a peer in the network. You can download
    and install these clients to become a peer and perform operations such as querying
    the blockchain, performing transactions, executing smart contracts, and so on.


    There are different open-source versions of Ethereum client, and they interoperate
    if they comply with Ethereum reference specifications and standard communication
    protocols. While different teams and people develop these clients, they all communicate
    through the standard communication protocol.


    Ethereum is an open-source and community-driven project licensed under LGPL v3.0.
    It is free to download and can be used for any purpose. Due to these clear specifications
    and licensing, different projects are independently developed by the people and
    companies around the world.


    At the time of writing this book, there are six main implementations of the Ethereum
    protocol written in six different programming languages, as follows:


    - `Geth`: Written in Go programming language.

    '
