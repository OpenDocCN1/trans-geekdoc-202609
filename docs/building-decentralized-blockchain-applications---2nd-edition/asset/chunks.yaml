    # 结构


    在本章中，我们将涵盖以下与共识算法相关的主题：


    • 工作证明（Proof of Work）共识

    • 权益证明（Proof of Stake）算法

    • 委托权益证明（Delegated Proof of Stake）

    • 容错算法

    • 实用性拜占庭容错（Practical Byzantine Fault Tolerance）共识算法

    • Tendermint Core


    # 目标


    学习本章后，你应该能够理解共识算法及其用途，以及不同类型的算法及其。


    让我们从第一个名为工作证明（PoW）的共识算法开始。


    ## 工作证明共识


    PoW 是去中心化网络中执行验证的基础共识算法之一。我们在第一章《区块链与去中心化网络简介》中简要介绍了 PoW 共识算法，在本节中，我们将对其进行详细介绍。


    正如名称所示，PoW 需要计算努力的证明来向其他参与者证明该工作是合法的。PoW 由 Moni Naor 和 Cynthia Dwork 于 1993 年发明，旨在通过验证并要求服务请求者提供某些工作（工作指计算努力）来防止拒绝服务（DoS）攻击。


    PoW 算法由中本聪（Satoshi Nakamoto）在比特币白皮书中重新发明，他在书中解释了共识的概念以及我们如何在去中心化网络中验证交易。


    让我们详细开始 PoW 共识算法的工作原理。此时，我们假设你已经阅读了第一章《区块链与去中心化网络简介》，并理解了去中心化网络和密码学的基本术语。


    比特币交易存储并组合在一个名为“区块”的实体中。每个区块包含交易，每个节点都包含一个区块的副本。现在，为了将区块提交到主链，每个节点必须执行挖掘活动，它们需要找到一个低于网络设置的目标哈希值的哈希。


    人们通过比特币程序执行的随机算法找到哈希值。在这个过程中，硬件强度起着关键作用，因为更更快的 CPU 或 GPU 比普通计算机能更快地进行随机化。


    这个问题与网络的硬件强度直接相关。网络的功率越高，问题就越困难，从而确保了网络的公平参与。


    比特币区块链网络中铸造的区块如图所示。请注意随机数（nonce）和难度。由于强大的网络，难度也按比例增加：


    ![](img/Figure_3.1.png)


    挖掘成功后，矿工将产生一个数字，其他节点可以通过该数字验证哈希是否正确。一旦通过验证，区块将被提交到网络，矿工将为他们的努力赢得一些比特币。在写此时，3.125
    比特币（约 68000 美元）是成功挖掘的奖励。


    这是一个连接在一起的 GPU 以及在计算机上运行的比特币挖掘程序的示例：


    ![](img/Figure_3.2.jpg)


    虽然 PoW 共识算法确保了交易和区块的严格验证，但它也面临一些严峻的挑战。


    ### 工作证明的挑战与局限性


    PoW 面临以下挑战：


    • 51%攻击：这是比特币和 PoW 唯一的安全风险，如果一个人拥有 51% 的节点，就可以控制网络。然而，这变得具有挑战性和成本高昂。

    • 效率：PoW 效率低下，且计算需要时间。

    • 硬件和资源消耗：PoW 需要如 GPU 等重型硬件。


    为了克服这些挑战并提供更快的结算，开发了权益证明（PoS）算法。


    ## 权益证明算法


    PoW 并不是唯一的共识算法。PoS 是用于以太坊等许多区块链网络的另一种共识算法。它不需要像 PoW 那样的强大计算能力，而是使用代币的质押来保护网络。


    在 PoS 中，验证者根据他们持有和质押的币数量被选择。质押币越多，被选为验证者的概率就越高。这种机制比 PoW 更节能，但也有自己的一系列挑战。


    • 安全性：PoS 没有 PoW 安全，因为验证者可能会出于恶意破坏网络。

    • 适应性和测试：PoS 尚未经过大规模的测试。当网络拥塞时，它有时会失败。

    • 验证者中心化：恶意验证者形成一个小组并控制网络存在巨大风险。


    ## 委托权益证明


    由于验证者选择的随机性和可能出现的中心化问题，我们对算法进行了变体，称为委托权益证明（DPoS）。


    DPoS 是 PoS 共识的变体，其中验证者通过投票和选举结合抵押质押机制选出。这种方法比 PoW 快得多。


    为了选择验证网络中下一个区块的验证者，网络中的节点将他们的代币质押给他们想要成为验证者的节点。用户质押代币数量最多的节点赢得选举，并验证下一个区块同时赚取交易费。验证者赚取的交易费将根据他们在选举过程中存的质押币分发给支持他们的节点。


    '
- fmt: "\nDPoS solves some critical problem(s) but also offers some limitation and\
    \ challenges, we have listed some of the crucial challenges in the next section.\n\
    \nThe limitations of DPoS are:\n\n- Centralized nature: Due to the user’s participation\
    \ in the validator election, staking their coins to pick new validator is a technical\
    \ concern of centralized approval. A group of users can and always select a set\
    \ of validators of their choice.\n- Security: The limitation listed previously\
    \ becomes a security concern as a malicious delegate can perform a security breach.\
    \ The validator can also perform 51% attack and take over network.\n\n## Fault\
    \ tolerant algorithms\n\nFault tolerance is the key aspect of blockchain and distributed\
    \ systems. In order to ensure robustness and reliability of the system in the\
    \ event of failure, the system is able to handle it gracefully.\n\nIn the context\
    \ of the blockchain and decentralized system, the fault tolerance is the responsibility\
    \ of the consensus algorithm to ensure that the system is up and running without\
    \ data corruption.\n\nThere are two widely adopted consensus algorithms used for\
    \ fault tolerance mechanism:\n\n- Practical Byzantine Fault Tolerance (`PBFT`)\
    \ consensus algorithm\n- Tendermint Core consensus algorithm\n\nBefore we discuss\
    \ these two algorithms, let us first understand the Byzantine Generals problem.\n\
    \nThe Byzantine Generals problem was introduced in 1982 as a logical dilemma that\
    \ explains how a group of Byzantine Generals may have communication problems when\
    \ trying to agree on their next move in the war. Refer to the following figure:\n\
    \n![](images/Figure_3.4.jpg)\n\nThe problem assumes that each general has its\
    \ own army and that each army group is situated in different locations around\
    \ the location they intend to attack. The generals need to agree on either attacking\
    \ or retreating, depending upon the assessment of the situation.\n\nThe generals\
    \ need to agree on the consensus in order to execute a common decision so that\
    \ there is no dispute and army is not confused.\n\nTherefore, we may consider\
    \ the following requirements:\n\n- Each general has to decide: attack or retreat\
    \ (yes or no).\n- After the decision is made, it cannot be changed.\n- All generals\
    \ have to agree on the same decision and execute it in a synchronized manner.\n\
    \nThe aforementioned communication problems are related to the fact that one general\
    \ is only able to communicate with another through messages, which are forwarded\
    \ by a courier. Consequently, the central challenge of the Byzantine Generals\
    \ problem is that the messages can get somehow delayed, destroyed or lost.\n\n\
    In addition, even if a message is successfully delivered, one or more generals\
    \ may choose (for whatever reason) to send a fraudulent message to confuse the\
    \ other generals, leading to a total failure.\n\nIf we apply the dilemma to the\
    \ context of blockchains, each general represents a network node, and the nodes\
    \ need to reach a consensus on the current state of the system. To put it in another\
    \ way, the majority of participants within a distributed network have to agree\
    \ and execute the same action to avoid complete failure.\n\nTherefore, the only\
    \ way to achieve consensus in these types of distributed systems is by having\
    \ at least two third or more reliable and honest network nodes. This means that\
    \ if the majority of the network decides to act maliciously, the system is susceptible\
    \ to failures and attacks.\n\nThe Byzantine Fault Tolerance (`BFT`) is a system’s\
    \ ability to continue the operation in the event of a node failure or if some\
    \ of the nodes act maliciously.\n\nThere are different ways to achieve `BFT` in\
    \ your system. In the blockchain system, consensus algorithm such as `PoW` achieve\
    \ `BFT` using mining and synchronization of nodes with the full data after a block\
    \ is submitted successfully. `PoS` achieve the `BFT` by locking the wallet of\
    \ validator with the stake coins and ensuring it is not released until the operation\
    \ is completed.\n\n## Practical Byzantine Fault Tolerance consensus algorithm\n\
    \nOne of the key requirements of the `BFT` is that system or nodes of the network\
    \ needs to be in the synchronous state. This leads to performance issues especially\
    \ in the decentralized system where nodes are distributed across geolocations\
    \ and latency of the network is still high, resulting in the slower response compared\
    \ to traditional web2.0 client/server model.\n\nThe other key requirement is that\
    \ in the event of the byzantine fault present in the system, the system needs\
    \ to figure out a way to work. `PBFT` algorithm is designed for such a use case,\
    \ and we are going to learn it in this section.\n\n### Working of Practical Byzantine\
    \ Fault Tolerance Algorithm\n\n`PBFT` uses machine state replication by assigning\
    \ one node as primary and another node as secondary. `PBFT` is designed to work\
    \ in the asynchronous state and can work even when nodes are down or there is\
    \ a malicious node in the network.\n\nNodes in a network running `PBFT` algorithm\
    \ are assigned primary or leader node and secondary or backup nodes. Here, any\
    \ node can become primary or secondary, and all of it works in a sequential manner.\n\
    \nThe idea behind this node assignment is to achieve a consensus in the network\
    \ by using the majority node. The `PBFT` can function as long as the count of\
    \ malicious nodes or nodes that are not responding is lower than honest nodes\
    \ or nodes working in the system. Following is the `PBFT` sequence figure: \n\n\
    ![](images/Figure_3.5.jpg)\n\nHere are the four phases in which the `PBFT` assigns\
    \ leader and backup nodes:\n\n1. The client sends a request to the primary or\
    \ leader node.\n2. The leader node broadcasts the request to all the secondary\
    \ nodes.\n3. The primary and secondary nodes perform the service requested by\
    \ the client and sends a response.\n4. The request is served when client receives\
    \ the response from different nodes with the same result. The replies should be\
    \ `m+1` where `m` is the maximum number of malicious nodes allowed.\n\nOne of\
    \ the key limitations with the `PBFT` is the efficiency issue. `PBFT` is efficient\
    \ when the network is small because it uses lots of communication to perform the\
    \ leader selection and maintain the system’s reliability. Once the network is\
    \ large enough, the latency increases along with it. The communication overhead\
    \ problem is a key scaling challenge when implementing `PBFT` in the network.\n\
    \nOne of the famous platforms that uses `PBFT` is `Tendermint`. We are going to\
    \ learn about it in the next section.\n\n## Tendermint Core\n\n`Tendermint Core`\
    \ is the `PBFT` consensus engine that powers many blockchain networks and projects.\
    \ `Tendermint` provides secure and consistent replication of an application state\
    \ across multiple nodes in a network. `Tendermint Core` is often used as the underlying\
    \ consensus layer for blockchain platforms and distributed ledger systems. `Cosmos`\
    \ network is one of the popular blockchain platform network that uses `Tendermint\
    \ Core` as the consensus engine.\n"
