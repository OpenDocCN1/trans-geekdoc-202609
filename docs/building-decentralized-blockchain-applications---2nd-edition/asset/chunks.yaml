    \ the programming interface.\n\n• OrbitDB is a peer-to-peer database, and to synchronize\
    \ the changes in the peer to other peers, it uses IPFS publish/subscribe (pub/sub)\
    \ system to communicate with other peers.\n\n• OrbitDB uses the eventual consistency\
    \ model; it is the consistency model in which the latest updated version of the\
    \ data item is returned to the user, maintaining the availability and consistency\
    \ of data. To achieve this eventual consistency, OrbitDB uses Conflict-free Replicated\
    \ Data Types (CRDTs).\n\n• OrbitDB is packaged as a Node.js library. JavaScript\
    \ was chosen because of its popularity and ubiquity in the programming community\
    \ and for its interoperability with the JavaScript implementation of IPFS, called\
    \ js-IPFS.\n\nLet us move on to the installation of OrbitDB.\n\n## [Installing\
    \ OrbitDB](#toc.xhtml#zh86)\n\nOrbitDB is a serverless application, so you do\
    \ not need to run a server as we do for other databases like MySQL.\n\nLet us\
    \ install OrbitDB in our application through the following steps:\n\n1. Here is\
    \ the command to install OrbitDB and IPFS in our project:\n\nnpm install @orbitdb/core\
    \ @orbitdb/liftoff helia\n\nThe liftoff module will help us quickly spin the OrbitDB\
    \ database.\n\n2. Once installed, you can use the following code to connect to\
    \ the IPFS and create an OrbitDB data store:\n\nimport { createOrbitDB } from\
    \ '@orbitdb/core'\n\nimport { DefaultLibp2pOptions } from '@orbitdb/liftoff'\n\
    \nconst libp2p = createLibp2p({ ...DefaultLibp2pOptions })\n\nconst ipfs = await\
    \ createHelia({ libp2p })\n\nconsole.log('Connected to IPFS');\n\nconst orbitdb\
    \ = await createOrbitDB({ ipfs })\n\nconsole.log('OrbitDB instance created.')\n\
    \nconst db1 = await orbitdb.open('db1')\n\nawait db1.add('hello world!')\n\nconsole.log(await\
    \ db1.all())\n\n3. Upon execution of the preceding program, you should get the\
    \ following output:\n\n$ node app.js\n\n$ Connected to IPFS\n\n$ OrbitDB instance\
    \ created.\n\n$ hello world!\n\n4. Now, we can create a new database or load an\
    \ existing database and use it to build our DApps.\n\nBefore we move towards building\
    \ our application, we should learn the data models offered by OrbitDB.\n\n## [OrbitDB\
    \ data models](#toc.xhtml#zh87)\n\nOrbitDB is a multi-model database and provides\
    \ various types of databases for different types of data models; here are the\
    \ following data models:\n\n• Events\n\n• Documents\n\n• Key-value\n\n• Indexed\
    \ key-value\n\nLet us look at each data model in brief.\n\n### [Events](#toc.xhtml#zs54)\n\
    \nIt is an immutable and append only data model used to store traversable records.\
    \ One of the use cases for such types of data models is a message queue where\
    \ messages are stored in the order and traversed back to the starting index, record\
    \ by record.\n\nThe events model is an immutable data store, so data cannot be\
    \ altered once it is written.\n\nTo create a events store, refer to the following\
    \ code:\n\nconstdb = await orbitdb.open('users');\n\nconst hash = await db.add({\
    \ name: 'John' });\n\n// to return all logs\n\nconst allRecords = db.iterator({\
    \ limit: -1 }).collect().map((e) =>e.payload.value);\n\nconsole.log(allRecords);\
    \ // prints all the logs\n\n// return only specific record\n\nconst record = db.get(hash).map((e)\
    \ =>e.payload.value);\n\nconsole.log(record); // prints specific log\n\nLet us\
    \ look over the next data model.\n\n### [Documents](#toc.xhtml#zs55)\n\nAs the\
    \ name suggests, it is a document-based data model where we can store custom documents\
    \ and index them using custom fields. If you are familiar with MongoDB or Elasticsearch,\
    \ this data model will be very useful for you.\n\nYou can use the document data\
    \ model to build custom database applications, blogs, e-commerce applications,\
    \ and so on.\n\nWe will also use the document data model to build our DApps in\
    \ the upcoming section.\n\nLet us look at the example code:\n\nconst db = await\
    \ orbitdb.open('users',{type: ‘documents’});\n\n// add new record\n\nconst hash\
    \ = await db.put({ \\_id: 'hash of the record', name: 'Shahid', followers: 500,\
    \ following:120, profilePicture: ‘hash of the image probably IPFS’ });\n\n// fetch\
    \ the record\n\nconst profile = db.get('hash of the record');\n\n// delete the\
    \ record\n\nconst hash = await db.del('hash of the record');\n\n// fetch all the\
    \ record\n\nconst allProfiles = db.get('');\n\nYou can run the custom query to\
    \ fetch the documents, just like we do in other databases. Check out the following\
    \ example:\n\nconst all = db.query((doc) =>doc.followers>= 500);\n\n// should\
    \ returns all the users who have followers equal to or more than 500\n\nThe documents\
    \ data model is quite useful and generic and can be shaped to support any application.\n\
    \nLet us learn about the next data model, key-value.\n\n### [Key-value](#toc.xhtml#zs56)\n\
    \nThe key-value store, as the name suggests, lets you store data in the key-value\
    \ format. The usage of the key-value data store is vast and can be used in the\
    \ range of applications.\n\nLet us look at an example:\n\nconstdb = await orbitdb.open('users',\
    \ { type: ‘key-value’ });\n\n// add new key value data\n\nconst hash = await db.put('1',\
    \ { name: 'Shahid' });\n\n// You can also do the above operation using a set()\
    \ function\n\nconst hash = await db.set('1', { name: 'Shahid' });\n\n// fetch\
    \ the information using the key\n\nconst value = db.get('1');\n\nconsole.log(value);\
    \ // prints the data i.e {name: ‘Shahid’}\n\n// delete the data using the key\n\
    \nconst hash = await db.del('1');\n\nThe indexed key-value database is similar\
    \ to key-value but adds an index to the database for faster queries.\n\nLet us\
    \ build a DApps using OrbitDB.\n\n## [Building DApps using OrbitDB](#toc.xhtml#zh88)\n\
    \nLet us build our full-fledged DApps using OrbitDB and IPFS. We will build an\
    \ email software that runs on a peer-to-peer network; let us call it DECENTRALIZED\
    \ MAIL (Dmail).\n\nBefore we go into the application’s technical aspects, let\
    \ us see how it looks.\n\nHere is the home page of our application:\n\n![](images/Figure_7.1.png)\n\
    \nHere is the Inbox page where users can read their emails:\n\n![](images/Figure_7.2.png)"
