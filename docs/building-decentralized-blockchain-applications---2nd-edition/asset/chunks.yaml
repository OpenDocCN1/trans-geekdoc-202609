- fmt: "\n **Transaction**: Actual transaction of value, the smallest component of\
    \ the blockchain.\n- **Block**: It is a data structure where transactions are\
    \ stored in a Merkle tree format.\n- **Chain**: A sequence of blocks in a specific\
    \ order.\n- **Miners**: Specific nodes that perform the transaction and block\
    \ validation.\n- **Consensus**: A mechanism through which networks reach the agreement.\n\
    \nIn a nutshell, here is how a Blockchain works in six steps:\n\n1. Node submits\
    \ the transaction in the network.\n2. Miners pick up the transaction and keep\
    \ it in the memory pool.\n3. Miners add the transaction in the block.\n4. Miners\
    \ submit the block and compete in the network to find the hash of the block (if\
    \ consensus is based on Proof of Work system).\n5. Once the proper hash is found,\
    \ the block is submitted to the network.\n6. Every other node verifies the hash,\
    \ and if 51% of the nodes verify and find the hash to be correct, the network\
    \ reaches consensus, and the block becomes immutable.\n\nLet us understand each\
    \ component in brief.\n\n### Node\n\nEach participant in the network is called\
    \ a node. A node is a computer running the software required to join the blockchain\
    \ network.\n\nIt does require an internet connection to join and participate in\
    \ the network. It can be a simple computer, laptop, or a huge data center.\n\n\
    In a public blockchain, anyone can become a node and join the network. The number\
    \ of nodes is important to make the system more secure and hard to attack.\n\n\
    ### Transaction\n\nThe transaction is the basic building block of the blockchain.\
    \ It is generated by the node and submitted in the chain, which is later picked\
    \ up by the miner and added in the block.\n\nThe transaction consists of the following\
    \ information:\n\n- ID (hash)\n- Address (hash)\n- Receiver (hash)\n- Amount:\
    \ Amount to send in crypto\n- Fees: Fees to send the transaction\n- Signed hash:\
    \ Hash generated by the sender\n\nThere is little more information depending on\
    \ the cryptocurrency, but the preceding information is mandatory.\n\n| Note: One\
    \ thing I want to point out here is that there is no user information stored.\
    \ This is because blockchain promises anonymity, so no information about the sender\
    \ is stored except their address, which is again a hash. |\n| --- |\n\n### Block\n\
    \nBlock is a data structure that stores a bunch of transactions and submits it\
    \ to the blockchain for validation. If validation is successful, the block becomes\
    \ immutable.\n\nThe miner node generates blocks. Miner node picks up transactions\
    \ from the memory pool and generates a block. This block is also called candidate\
    \ block.\n\nEvery block consists of the following:\n\n- Block header: Contains\
    \ version, last block, time, and target.\n- Nonce: Number to consider for hash\
    \ generation.\n- Transactions: List of transactions in a Merkle tree format.\n\
    \nBitcoin uses this block structure. More or less the structure is similar in\
    \ the other blockchain platforms. You may find some platforms not using nonce\
    \ while some uses different nesting of data in the headers and transactions.\n\
    \nBlock header consists of critical information such as version number, last block\
    \ hash, timestamp, target number, and so on.\n\nThe block is added in the chain\
    \ by hashing the block header and hoping that data is less than the target number.\n\
    \nThe target number is decided using the difficulty number. Difficulty is a number\
    \ that decides the time taken by the miner to mine the block. It should be there\
    \ around 10 minutes on the Bitcoin network.\n\nA nonce is a number that is used\
    \ by the miner to generate the hash to meet the target number. The nonce is incremented\
    \ by the miner to meet the required target value.\n\nOnce the hash is found, the\
    \ block is mined and submitted to the chain. Each block is linked with the previous\
    \ block, forming the chain as seen in the following figure:\n\n![](images/Figure_1.3.jpg)\n\
    \n### Chain\n\nThe chain is the blocks linked together using cryptography and\
    \ shared across every node. Each node maintains the latest copy of the chain,\
    \ forming a network of strong, reliable, and consistent nodes.\n\nThe chain consists\
    \ of blocks. Blocks contain transactions, as you saw earlier. Each transaction\
    \ is associated with the account, forming the ledger. Using the chain, one can\
    \ determine the ledger information of a particular address and verify the transactions.\n\
    \nSince the chain is distributed across the network, there is no chance of fraud.\
    \ If someone tries to add a false block from their machine, the network will verify\
    \ and reject the block. To take over the network, one must have 51% control of\
    \ the node (hashing/computing power of the node) in the network.\n\nIt is also\
    \ called a 51% attack.\n\n| Tip: 51% attack is the distributed attack in which\
    \ attackers try to control the blockchain network by infecting and controlling\
    \ hashing power of 51% of the nodes. It is nearly impossible for the network,\
    \ such as Bitcoin, but it can be implemented for smaller networks. |\n| --- |\n\
    \nThe chain is shared across the nodes in the network in the following steps:\n\
    \n1. New transactions are broadcasted to all nodes.\n2. Each node collects new\
    \ transactions into a block.\n3. Each node works on finding a difficult Proof\
    \ of Work for its block.\n4. When a node finds Proof of Work, it broadcasts the\
    \ block to all nodes.\n5. Nodes accept the block only if all transactions in it\
    \ are valid and not already spent.\n6. Nodes express their acceptance of the block\
    \ by working on creating the next block in the chain, using the hash of the accepted\
    \ block as the previous hash.\n\nThese steps are mostly the same for most of the\
    \ proof of the work-based system.\n\nThe chain is stored in the binary format\
    \ on the nodes. Depending on the operating system and chain network, it is stored\
    \ at the following location by default, and we are taking the Bitcoin chain as\
    \ an example:\n\n- Linux: `/home/[username]/.bitcoin/blocks/`\n- Windows: `C:\\\
    Users\\[username]\\AppData\\Roaming\\Bitcoin\\`\n- Mac: `~/Library/Application\
    \ Support/Bitcoin/`\n\nYou can, of course, store it at different locations based\
    \ on the chain configuration.\n\nLet us proceed to learn about miners.\n\n###\
    \ Miners\n\nMiners are the nodes that perform the process to add a new block in\
    \ the chain, adding the transactions sent by the user.\n\nMiners do this process\
    \ by performing a deep level of hash calculations that takes around 10 minutes\
    \ in the case of Bitcoin.\n\nThis calculation costs a lot of computing power,\
    \ so it is required to pay the miners to run the operation in the surplus profit.\
    \ Every time a miner performs a successful block insertion in the chain, the system\
    \ rewards them with an incentive.\n\nThe mining process begins with building a\
    \ new candidate block by picking up the transactions from the memory pool.\n\n\
    The candidate block contains the block header. Miners try to calculate the hash\
    \ by passing the block header to the `SHA256` function.\n\n| Tip: SHA-256 is the\
    \ hash function used to generate a hash-based on the input. |\n| --- |\n\nThe\
    \ hash returned should be lower than the target value defined by the system at\
    \ that moment. If not, the miner increments the `nonce` and calculates the hash\
    \ again. This process continues until the correct hash is found.\n\nThe mining\
    \ process is energy-dominant, so it requires lots of electricity to perform the\
    \ hash calculations. Miners also collect the transaction fee provided in each\
    \ transaction, plus the mining reward generated by the system.\n\nLet us learn\
    \ how consensus is being achieved in the blockchain network.\n"
  raw: '• Transaction: Actual transaction of value, the smallest component of the
    blockchain.


    • Block: It is a data structure where transactions are stored in a Merkle tree
    format.


    • Chain: A sequence of blocks in a specific order.


    • Miners: Specific nodes that perform the transaction and block validation.


    • Consensus: A mechanism through which networks reach the agreement.


    In a nutshell, here is how a Blockchain works in six steps:


    1. Node submits the transaction in the network.


    2. Miners pick up the transaction and keep it in the memory pool.


    3. Miners add the transaction in the block.


    4. Miners submit the block and compete in the network to find the hash of the
    block (if consensus is based on Proof of Work system).


    5. Once the proper hash is found, the block is submitted to the network.


    6. Every other node verifies the hash, and if 51% of the nodes verify and find
    the hash to be correct, the network reaches consensus, and the block becomes immutable.


    Let us understand each component in brief.


    ### [Node](#toc.xhtml#zs05)


    Each participant in the network is called a node. A node is a computer running
    the software required to join the blockchain network.


    It does require an internet connection to join and participate in the network.
    It can be a simple computer, laptop, or a huge data center.


    In a public blockchain, anyone can become a node and join the network. The number
    of nodes is important to make the system more secure and hard to attack.


    ### [Transaction](#toc.xhtml#zs06)


    The transaction is the basic building block of the blockchain. It is generated
    by the node and submitted in the chain, which is later picked up by the miner
    and added in the block.


    The transaction consists of the following information:


    • ID (hash)


    • Address (hash)


    • Receiver (hash)


    • Amount: Amount to send in crypto


    • Fees: Fees to send the transaction


    • Signed hash: Hash generated by the sender


    There is little more information depending on the cryptocurrency, but the preceding
    information is mandatory.


    | Note: One thing I want to point out here is that there is no user information
    stored. This is because blockchain promises anonymity, so no information about
    the sender is stored except their address, which is again a hash. |


    | --- |


    ### [Block](#toc.xhtml#zs07)


    Block is a data structure that stores a bunch of transactions and submits it to
    the blockchain for validation. If validation is successful, the block becomes
    immutable.


    The miner node generates blocks. Miner node picks up transactions from the memory
    pool and generates a block. This block is also called candidate block.


    Every block consists of the following:


    • Block header: Contains version, last block, time, and target.


    • Nonce: Number to consider for hash generation.


    • Transactions: List of transactions in a Merkle tree format.


    Bitcoin uses this block structure. More or less the structure is similar in the
    other blockchain platforms. You may find some platforms not using nonce while
    some uses different nesting of data in the headers and transactions.


    Block header consists of critical information such as version number, last block
    hash, timestamp, target number, and so on.


    The block is added in the chain by hashing the block header and hoping that data
    is less than the target number.


    The target number is decided using the difficulty number. Difficulty is a number
    that decides the time taken by the miner to mine the block. It should be there
    around 10 minutes on the Bitcoin network.


    A nonce is a number that is used by the miner to generate the hash to meet the
    target number. The nonce is incremented by the miner to meet the required target
    value.


    Once the hash is found, the block is mined and submitted to the chain. Each block
    is linked with the previous block, forming the chain as seen in the following
    figure:


    ![](images/Figure_1.3.jpg)


    ### [Chain](#toc.xhtml#zs08)


    The chain is the blocks linked together using cryptography and shared across every
    node. Each node maintains the latest copy of the chain, forming a network of strong,
    reliable, and consistent nodes.


    The chain consists of blocks. Blocks contain transactions, as you saw earlier.
    Each transaction is associated with the account, forming the ledger. Using the
    chain, one can determine the ledger information of a particular address and verify
    the transactions.


    Since the chain is distributed across the network, there is no chance of fraud.
    If someone tries to add a false block from their machine, the network will verify
    and reject the block. To take over the network, one must have 51% control of the
    node (hashing/computing power of the node) in the network.


    It is also called a 51% attack.


    | Tip: 51% attack is the distributed attack in which attackers try to control
    the blockchain network by infecting and controlling hashing power of 51% of the
    nodes. It is nearly impossible for the network, such as Bitcoin, but it can be
    implemented for smaller networks. |


    | --- |


    The chain is shared across the nodes in the network in the following steps:


    1. New transactions are broadcasted to all nodes.


    2. Each node collects new transactions into a block.


    3. Each node works on finding a difficult Proof of Work for its block.


    4. When a node finds Proof of Work, it broadcasts the block to all nodes.


    5. Nodes accept the block only if all transactions in it are valid and not already
    spent.


    6. Nodes express their acceptance of the block by working on creating the next
    block in the chain, using the hash of the accepted block as the previous hash.


    These steps are mostly the same for most of the proof of the work-based system.


    The chain is stored in the binary format on the nodes. Depending on the operating
    system and chain network, it is stored at the following location by default, and
    we are taking the Bitcoin chain as an example:


    • Linux:


    /home/\[username\]/.bitcoin/blocks/


    • Windows:


    C:\\Users\\\[username\]\\AppData\\Roaming\\Bitcoin\\


    • Mac:


    ~/Library/Application Support/Bitcoin/


    You can, of course, store it at different locations based on the chain configuration.


    Let us proceed to learn about miners.


    ### [Miners](#toc.xhtml#zs09)


    Miners are the nodes that perform the process to add a new block in the chain,
    adding the transactions sent by the user.


    Miners do this process by performing a deep level of hash calculations that takes
    around 10 minutes in the case of Bitcoin.


    This calculation costs a lot of computing power, so it is required to pay the
    miners to run the operation in the surplus profit. Every time a miner performs
    a successful block insertion in the chain, the system rewards them with an incentive.
    In the case of Bitcoin, it is 3.125 Bitcoin per successful block at the time of
    updating this book.


    The mining process begins with building a new candidate block by picking up the
    transactions from the memory pool.


    The candidate block contains the block header. Miners try to calculate the hash
    by passing the block header to the SHA-256 function.


    | Tip: SHA-256 is the hash function used to generate a hash-based on the input.
    |


    | --- |


    The hash returned should be lower than the target value defined by the system
    at that moment. If not, the miner increments the nonce and calculates the hash
    again. This process continues until the correct hash is found. Hash is a CPU intensive
    process, so most miners use advanced CPUs to perform this job.


    The mining process is energy-dominant, so it requires lots of electricity to perform
    the hash calculations. Miners also collect the transaction fee provided in each
    transaction, plus the mining reward generated by the system.


    Let us learn how consensus is being achieved in the blockchain network.


    ## [Consensus](#toc.xhtml#zh08)'
