    transactions between a set of participants.


    Please refer the following figure:


    ![](images/Figure_4.3.jpg)


    State channels operate in the following manner:


    1. Opening a state channel: The network peers who wants to ensure collaboration
    and share data with each other needs to first open a state channel. The process
    to open a state channel is by creating a multi-signatory wallet between the participants.


    Once the state channel is created, it is recorded in the blockchain.


    2. Off-chain transactions: Once the state channel is open, participants can conduct
    a series of off-chain transactions between themselves without involving the main
    blockchain.


    Each off-chain transaction updates the state of the channel and is recorded similarly
    to how it is recorded in the mainchain.


    3. State channel updates: As the transactions get settled in the off-chain, the
    state channel created by the participants is updated. These updates are off-chain
    updates and do not sync with the mainchain yet.'
