    # CHAPTER 4: Blockchain Scaling Challenges


    ## Introduction


    Blockchain was built to accommodate the world’s first cryptocurrency, i.e. Bitcoin.
    Bitcoin aimed to become an alternative mode of payment owned by the people for
    the people.


    The sole purpose was to introduce an alternative to the current centralized mode
    of payment. However, the minute Bitcoin and other cryptocurrencies got together
    on a centralized exchange, and people started trading and making money, things
    started to change and attracted tons of people. This led to the crypto boom and
    the user size of the crypto grew by more than 100x.


    Despite its innovative potential, blockchain encounters significant challenges
    in efficiently handling large-scale loads. These challenges manifest in various
    issues, notably heavy transaction fees, prolonged transaction durations, and systemic
    performance degradation.


    The decentralized nature of blockchain nodes, operating within peer-to-peer networks
    distributed globally, introduces complexities such as heightened latency due to
    geographic dispersion, extended transaction processing times attributable to consensus
    algorithms like Proof of Work (`PoW`), and escalating network propagation delays
    with the expansion of the peer-to-peer network.


    As engineers, addressing these scaling challenges becomes imperative, necessitating
    the development of tailored solutions to enhance blockchain''s operational efficacy.


    In this interesting and important chapter, we are going to discuss and learn about
    various scaling techniques in Blockchain technology.


    ## Structure


    In this chapter, we will address the following topics:


    • Blockchain scalability challenges

    • Sharding

    • Layer 2 approach

    • Lightning networks

    • Use cases and applications


    ## Objectives


    The objective is to address and learn the scalability challenges inherent in blockchain
    technology, aiming to enhance its utility and accessibility. Leveraging scaling
    techniques like sharding and layer 2 approaches such as Lightning Networks are
    pivotal strategies. Sharding entails the segmentation of the network into smaller,
    manageable segments, bolstering transaction throughput and diminishing latency.
    Meanwhile, layer 2 solutions like Lightning Networks facilitate off-chain transactions,
    effectively reducing congestion on the primary blockchain. These initiatives pave
    the way for a myriad of applications spanning decentralized finance (`DeFi`),
    supply chain management, digital identity verification, and voting systems, fostering
    innovation and operational efficiency across diverse sectors.


    ## Blockchain scalability challenges


    The consensus algorithms such as `PoW` became a bottleneck in the rapidly growing
    blockchain industry. `PoW` consensus algorithms could not handle the transaction
    demand, resulting in slow transactions and high transaction fees.


    Peer-to-peer network growth also resulted in slower transaction and response time
    because the entire network and chain had to be updated, and propagation took time
    as every peer differed in latency, bandwidth, and network strength.


    Each blockchain platform operates in isolation resulting in creating data silos
    limiting their potential. Blockchain platforms lack standardization and compatibility.
    Thus, interoperability between blockchain networks is one of the key problem areas.


    Malicious code detection is one of the key challenges in the smart contract platform.
    Smart contracts are self-executing code, and malicious code results in serious
    issues such as loss of funds and theft.


    Let us study some of the scaling challenges:


    • Network latency: Transactions in decentralized systems require consensus from
    multiple nodes, which can lead to longer confirmation times and slower transaction
    processing.

    • Limited throughput: Decentralized networks have a limited capacity for the number
    of transactions that can be processed per second, resulting in slow confirmation
    times during periods of high network usage.

    • Gas fees: As the network becomes congested, the cost of executing smart contracts
    (in the form of gas fees) can become prohibitively expensive, making the platform
    less accessible for small transactions.

    • Resource intensity: Decentralized systems often require high computational power
    and storage resources, which can be a barrier to scalability.

    • Scalability bottlenecks: Some smart contract platforms may be limited by scalability
    bottlenecks in their underlying infrastructure, such as the number of nodes participating
    in the network.

