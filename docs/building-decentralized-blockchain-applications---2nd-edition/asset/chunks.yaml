    Ethereum also developed a JavaScript library called `web3.js`, which is used to
    bundle the frontend with the backend of the DApp.


    `Web3.js` provides an easy and familiar way for traditional web developers to
    build decentralized apps that can communicate with the blockchain via the browser.


    Let us look at the backend, that is, smart contracts stack.


    ### Smart contracts


    In DApps, smart contracts are used to write the business logic and related functions
    of your application. You can think of a smart contract replacing a server-side
    (aka backend) layer in a traditional application.


    Developers must keep in mind that any computation executed in a smart contract
    is expensive in terms of ethers and should be kept to a minimum. So, it is important
    to identify the aspects of the application that need to run on a decentralized
    platform:


    • Smart contracts let you build applications in which a network of smart contracts
    call and pass data between each other, reading and writing their state variables
    as they go.


    • A major point to note in the smart contract architecture design is the inability
    to change the code of a contract once it is deployed.


    • A smart contract can be deleted if it is programmed with an available `self-destruct`
    opcode, but other than that, the code cannot be changed in any way.


    • Another major point to note is that the size of DApps should be as light as
    possible. A large smart contract may cost way too much ethers to execute, making
    it inefficient.


    • As a developer, you should only keep business logic in the smart contract. Storage
    can be either dealt with centralized services or using `Swarm` or `IPFS`.


    Let us look over the storage stack and understand how to keep the storage part
    away from the smart contract so that we avoid building a very large contract that
    costs a fortune to run in the blockchain.


    ### Storage


    Due to high costs to execute contracts, smart contracts are not a good option
    for storing or processing large amounts of data such as photos, videos, and so
    on.


    So, DApps should utilize off-chain data storage services, meaning they store the
    bulky data of the Ethereum chain on a data storage platform.


    The data storage platform can be centralized (for example, a typical cloud database
    like Amazon or Azure), or the data can be decentralized, stored on a P2P network
    such as the `IPFS` or Ethereum''s own `Swarm` platform.


    Decentralized P2P network storage is ideal for storing and distributing large
    assets such as images, videos, and static resources such as normal files.


    Let us look over the options we have at the time of writing this book to use as
    decentralized P2P storage.


    #### IPFS


    `IPFS` is a decentralized P2P network to store and share content. `IPFS` is a
    project by the protocol labs team and uses content addressing; so, a unique hash
    identifies each file added in the network. You can retrieve the file using the
    hash from any node in the network.


    `IPFS` aims to replace the `HTTP` protocol for standard content delivery for the
    Web. `IPFS` has a network, and anyone can become a part of it, just like in Bitcoin
    or Ethereum.


    In the next chapter, we will learn about `IPFS` in-depth. Let us check our next
    decentralized P2P network storage.


    #### Swarm Bee


    `Swarm Bee` is a project by Ethereum Foundation. It is a content-addressable P2P
    storage system very similar to `IPFS`, and it allows you to host and access a
    website using the network.


    Let us run a simple `Swarm Bee` instance and check it for ourselves.


    You can download `Bee` from the official website for your desired operating system
    from the following link: `https://docs.ethswarm.org/docs/bee/installation/install`


    The download and installation instruction for different operating systems are
    mentioned in the documentation link mentioned above. For Mac, the installation
    commands use `homebrew`. Please make you have `homebrew` installed in your Mac
    machine.


    Here is the installation command.


    ```bash

    brew tap ethersphere/tap

    brew install swarm-bee

    ```


    If you want to run `bee` from the default configuration, then you can use the
    following command:


    ```bash

    brew services start swarm-bee

    ```


    We can also use `Swarm Desktop` to run it easily in our machine for testing.


    Head over to `https://www.ethswarm.org/build/desktop` and download the `Swarm
    Bee` desktop for your operating system.


    Once the `Swarm Bee Desktop` is installed and running, you can visit the `Swarm
    Bee` gateway from the browser by navigating to `localhost:3054/dashboard`.


    You should see a screen similar to the following figure:


    ![](images/Figure_2.15.jpeg)


    In order to upload the files and access it, we need to connect our wallet to fund
    cryptocurrency `xBZZ` or `DAI` and use it. IMG.


    If you go to `Settings`, we can find out the blockchain it is connected to and
    this can be changed to custom blockchain nodes as well:


    ![](images/Figure_2.16.png)


    `Swarm Bee` is production ready and can be used as a decentralized file storage
    system.


    Alright, let us visit the last part in the DApps stack.


    ## Decentralized message communications protocols


    One of the crucial components in any distributed application is inter-process
    communication. The application must be able to communicate with other instances
    via some medium to exchange data back and forth while maintaining the state.


    In conventional applications, message queues and inter-process channels were the
    way to handle such communications. These message queues are central in nature
    and introduce another single point of failure in the system.


    In DApps, communication is done via the P2P messaging protocol. At the time of
    writing this book, the most notable and widely accepted communication protocol
    for DApps is the `Waku` - `https://waku.org/about/`.


    Ethereum also provides a service called Ethereum Name Service (`ENS`). Developers
    can use `ENS` to point the hash-based resources to more friendly-readable names
    like we do in DNS.


    ## Conclusion


    In this chapter, we have explored Ethereum in detail. We studied the vision and
    platform and how one can use Ethereum. We also studied various parts of Ethereum,
    such as `EVM` and smart contracts, and we built a simple application to see how
    smart contracts work. We looked at building DApps using Ethereum, and we explored
    the various protocols that are required to build a DApp.


    In the next chapter, we will learn about `IPFS` in-depth. We will build an application
    that uses `IPFS` and deploy it to see how it works in real-time.

    '
