- fmt: '

    Plasma framework is still evolving and going through incremental changes. Scalability
    is a tough problem to solve and require lots of experimentation. Plasma framework
    carry a potential to become a good solution to the blockchain scalability problem
    in the near future.


    In the coming section, we will understand about rollups and how it works.


    ## Rollups


    Rollups is an aggregation technique where multiple transactions are bundled or
    rollup in a single batch to process on the mainchain. Rollups are a scaling solution
    designed to enhance scalability and reduce transaction costs by moving some processing
    off-chain while maintaining the security and decentralization of the mainchain.


    There are two main types of rollups:


    • Optimistic rollups

    • Zero-knowledge (ZK) rollups


    Let us discuss them in detail.


    ### Optimistic rollups


    In optimistic rollups, the transaction data and computation are conducted off-chain
    in a separate layer called the rollup chain. Only the transaction''s outcome,
    along with cryptographic proof, is submitted to the mainchain.


    Optimistic rollups assume that the off-chain computation is correct. The mainchain
    validators initially accept the transaction without validating the entire computation.
    This speeds up the process and reduces on-chain congestion.


    However, there is a challenge period during which anyone can raise a dispute if
    they believe that a transaction is fraudulent. Validators then need to validate
    the entire computation. If the transaction is found to be correct, the challenger
    loses a security deposit. If it is fraudulent, the submitter loses their deposit.


    Optimistic Ethereum is an example of optimistic rollups implemented on the Ethereum
    blockchain. It aims to improve scalability by handling most transactions off-chain
    and submitting only the essential information to the Ethereum mainchain.


    ### Zero-knowledge rollups


    In ZK-rollups, the transaction data and the computation are kept off-chain, but
    the cryptographic proof is submitted to the mainchain. This proof provides a zero-knowledge
    succinct argument that the off-chain computation was done correctly without revealing
    any details.


    Unlike optimistic rollups, ZK-rollups do not require a challenge period because
    the cryptographic proof ensures the correctness of the computation. This leads
    to faster finality and reduces the potential for disputes. They provide privacy
    benefits as the off-chain computation details are not exposed. Users can retain
    a higher level of privacy while still benefiting from the security and scalability
    advantages. Loopring and ZKsync are examples of projects implementing ZK-rollups
    on Ethereum, aiming to improve scalability and reduce transaction fees.


    In summary, both optimistic rollups and ZK-rollups are solutions that leverage
    off-chain processing to enhance blockchain scalability. They strike a balance
    between efficiency and security, offering different trade-offs in terms of assumptions,
    dispute resolution mechanisms, and privacy features. These rollup solutions play
    a crucial role in addressing the scalability challenges faced by blockchain networks.


    ## Lightning Network


    The Bitcoin Lightning Network is a layer 2 scaling solution as we studied in the
    earlier section. It is designed to address the scalability issues of the Bitcoin
    blockchain. It enables faster and cheaper transactions by facilitating off-chain
    payment channels.


    The Lightning Network builds on top of the existing Bitcoin blockchain and allows
    users to conduct transactions off-chain, reducing congestion and fees on the mainchain.
    Participants open payment channels between each other. These channels are like
    off-chain channels where users can transact without interacting with the main
    Bitcoin blockchain.


    Opening a payment channel involves creating a multi-signature wallet (2-of-2 or
    2-of-3) between the participants, and the channel''s initial state is recorded
    on the Bitcoin blockchain. Once a payment channel is established, users can transact
    with each other off-chain. They can send and receive payments without needing
    to broadcast every transaction to the mainchain.


    Lightning Network channels support bi-directional payments. Users can send payments
    back and forth as long as the channel''s balance allows it. The net effect of
    these transactions is updated in real-time within the payment channel.


    Users can close the payment channel at any time by broadcasting the latest transaction
    state to the Bitcoin blockchain. This finalizes the transactions and settles the
    balances. The final state is enforced by the underlying smart contract on the
    Bitcoin blockchain.


    The benefits of the lightning network are as follows:


    • Scalability: The Lightning Network significantly increases the transaction throughput
    by allowing users to conduct numerous off-chain transactions without congesting
    the main Bitcoin blockchain.

    • Reduced fees: Off-chain transactions on the Lightning Network are faster and
    incur lower fees compared to on-chain transactions.

    • Instant transactions: Transactions within the Lightning Network are nearly instant,
    providing a quick and efficient way for users to transact.

    • Microtransactions: The Lightning Network enables microtransactions, allowing
    users to send and receive small amounts of Bitcoin economically.


    | Note: Lightning Network is an opt-in solution, and users can choose whether
    to use it for their transactions. While it offers scalability benefits, it also
    introduces new considerations, such as the need for users to manage channels and
    liquidity effectively. The Lightning Network continues to evolve, contributing
    to the ongoing development of the Bitcoin ecosystem. |

    | --- |


    ## Use cases and applications


    Now, let us understand the use cases of fast and scalable blockchain:


    • Payments and microtransactions: Decentralized payment networks can handle a
    large number of transactions per second, making them suitable for micropayments
    and other low-value transactions.

    • Supply chain management: Decentralized systems can track the origin, movement,
    and destination of goods in a supply chain, reducing the time and costs associated
    with traditional supply chain management.

    • Digital identity: Decentralized systems can provide secure and scalable digital
    identity solutions, enabling individuals to control and manage their personal
    information.

    • DeFi: DeFi applications such as exchanges, lending platforms, and stablecoins
    can benefit from scalability to handle the large volume of transactions in the
    DeFi ecosystem.

    • Gaming: Decentralized gaming platforms can use scalability solutions to handle
    large numbers of players and transactions, enabling fast and secure gaming experiences.

    • Data management: Decentralized systems can be used to store and manage large
    amounts of data, such as medical records, in a secure and scalable manner.

    • Decentralized autonomous organizations: Decentralized autonomous organizations
    (DAO) can use scalability solutions to handle a large number of members, votes,
    and transactions in a secure and transparent manner.


    ## Conclusion


    We studied various blockchain scaling challenges and problems blockchain systems
    are facing right now. We also studied various techniques and approaches both matured
    and experimental and how they can be applied to handle scalability issues. Blockchain
    systems are evolving and getting more and more load as we write this chapter,
    without scaling solutions in place, Blockchain systems will not be able to cope
    up with the demand. Hence, solving scalability problem is the key issue in the
    blockchain community.


    In the next chapter, we are going to learn blockchain interoperability and how
    it can be useful in scaling blockchain systems.


    **Join our book’s Discord space**

