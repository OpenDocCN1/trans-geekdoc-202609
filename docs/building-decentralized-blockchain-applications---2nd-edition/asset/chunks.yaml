  trans: '


    DPoS 解决了一些关键问题，但也带来了一些局限性和挑战，我们在下一节中列出了一些关键的挑战。


    DPoS 的局限性在于：


    - 中心化本质：由于用户参与验证者选举，通过质押代币来选择新验证者在技术上存在中心化审批的担忧。一组用户可以并且总是选择他们喜欢的一组验证者。

    - 安全性：上述局限性会变成安全问题，因为恶意代理人可能会实施安全破坏。验证者还可以执行 51% 攻击并接管网络。


    ## 容错算法


    容错是区块链和分布式系统的关键方面。为了确保系统在发生故障时的健壮性和可靠性，系统能够优雅地处理故障。


    在区块链和去中心化系统中，容错是共识算法的责任，以确保系统运行且不发生数据损坏。


    有两种广泛用于容错机制的共识算法：


    - 实用拜占庭容错（`PBFT`）共识算法

    - Tendermint Core 共识算法


    在讨论这两种算法之前，让我们先了解一下拜占庭将问题。


    拜占庭将问题提出于 1982 年，是一个逻辑困境，解释了一组拜占庭将在试图对战争下一步行动达成一致时可能遇到的通信问题。参考下图：


    ![](img/Figure_3.4.jpg)


    该问题假设每个将都有自己的军队，并且每个军队组位于他们计划攻击的位置周围的不同位置。将们需要根据对形势的评估对进攻或撤退达成一致。


    将们需要达成共识以执行共同决策，这样就不会产生争议，军队也不会混乱。


    因此，我们可能考虑以下要求：


    - 每个将都必须决定：进攻或撤退（是或否）。

    - 决策做出后，不可更改。

    - 所有将必须对相同的决策达成一致并以同步的方式执行。


    上述通信问题与一个事实有关：一个将只能通过信使转发的消息与另一个将进行通信。因此，拜占庭将问题的核心挑战是消息可能会以某种方式被延迟、破坏或丢失。


    此外，即使消息成功送达，一个或多个将也可能（出于任何原因）发送虚假消息来扰乱其他将，导致彻底失败。


    如果我们将这一困境应用于区块链背景，每个将代表一个网络节点，节点需要对系统的当前状态达成共识。换句话说，分布式网络中的大多数参与者必须同意并执行相同的操作，以避免完全失败。


    因此，在这类分布式系统中实现共识的唯一方法是至少拥有三分之一或更多可靠且诚实的网络节点。这意味着如果网络大多数节点决定采取恶意行动，系统将容易受到故障和攻击。


    拜占庭容错（`BFT`）是系统在节点故障或某些节点采取恶意行为时继续运行的能力。


    在系统中实现 `BFT` 有不同的方法。在区块链系统中，如 `PoW` 等共识算法通过挖掘以及在区块成功提交后与全量数据的同步来实现 `BFT`。`PoS`
    通过用质押代币锁定验证者的钱包来实现 `BFT`，并确保在操作完成之前不释放。


    ## 实用拜占庭容错共识算法


    `BFT` 的关键要求之一是系统或网络节点需要处于同步状态。这导致了性能问题，特别是在去中心化系统中，节点分布在不同的地理位置，网络延迟仍然很高，导致响应比传统的
    web2.0 客户端/服务器模型更慢。


    另一个关键要求是，在系统存在拜占庭故障的情况下，系统需要找到一种工作的方法。`PBFT` 算法专为此类用例设计，我们将在本节中学习它。


    ### 实用拜占庭容错算法的工作原理


    `PBFT` 通过分配一个节点为主节点（primary），另一个节点为备用节点（secondary）来实现机器状态复制。`PBFT` 设计用于异步状态下工作，即使在节点宕机或网络中存在恶意节点的情况下工作。


    运行 `PBFT` 算法的网络节点被分配为主/领导节点和从/备份节点。在这里，任何节点都可以成为主或备用，且它们都以顺序方式工作。


    这种节点分配背后的思想是通过使用多数节点在网络中实现共识。只要恶意节点或不响应节点的数量低于系统中的诚实节点或工作节点，`PBFT` 就可以运行。以下是 `PBFT`
    序列图：


    ![](img/Figure_3.5.jpg)


    以下是 `PBFT` 分配主节点和备份节点的四个阶段：


    1. 客户端向主节点或领导节点发送请求。

    2. 领导节点向所有备用节点广播请求。

    3. 主节点和备用节点执行客户端请求的服务并发送响应。

    4. 当客户端收到来自不同节点的具有相同结果的响应时，请求被处理。回复应为 `m+1`，其中 `m` 是允许的最大恶意节点数量。


    `PBFT` 的关键局限之一是效率问题。当网络较小时，`PBFT` 是高效的，因为它使用了大量的通信来执行领导选择并维护系统的可靠性。一旦网络足够大，延迟也会随之增加。在网络中实现
    `PBFT` 时，通信开销问题是一个关键扩展挑战。


    使用 `PBFT` 的著名平台之一是 `Tendermint`。我们将在下一节中学习它。


    '
- fmt: '

    Tendermint Core uses an Application Blockchain Interface (`ABCI`) to separate
    the consensus engine logic from the application logic. This allows developers
    to implement their blockchain application logic while using Tendermint Core for
    consensus. Due to this design choice, several blockchain projects use the Tendermint
    Core as the blockchain engine.


    Due to `ABCI`, Tendermint Core is language agnostic, and it supports state machines
    in any programming language.


    Tendermint Core can be used in the variety of applications area such as identity
    services, gaming, asset management, etc.


    ### Setting up Tendermint Core


    Let us set up a simple Tendermint Core in your machine. We are assuming that you
    have an Ubuntu Linux machine running with you, if not, you can download the pre-compiled
    binaries directly from the GitHub repository with your choice of operating system.
    Tendermint is also available in the Docker image. Please refer to the following
    link for the same:


    https://github.com/tendermint/tendermint/releases


    Now, open the terminal in the Ubuntu and paste the following command to install
    Tendermint Core:


    ```bash

    curl -L https://git.io/fFfOR | bash

    source ~/.profile

    ```


    The link in the command contains the installation commands and instructions. Wait
    for the installation to complete.


    Once the installation is complete, we can initiate the Tendermint Core using the
    following command:


    ```bash

    tendermint init

    ```


    This will create some files in the `$HOME` location. Please note these files will
    support single machine node network.


    Now, let us start the Tendermint server:


    ```bash

    tendermint node --proxy_app=kvstore

    ```


    This command will initialize the server and you will see blocks popping up in
    the terminal.


    ### Limitations of Tendermint Core


    Some of the key limitations of Tendermint Core are:


    • Centralization: Tendermint Core works with a fixed set of validators and changing
    the validators requires the hard fork. This leads to not true but partial centralization
    of the network.


    • Scalability: Tendermint Core uses `PBFT`, hence it inherits the communication
    overhaul problem which would come up whenever we are scaling the network. More
    number of nodes equals more communications which results in the high latency.


    • Resource requirements: Tendermint Core uses more computation power and network
    bandwidth due to the use of `PBFT` consensus. This can add up in the cost of the
    running the operation.


    Tendermint Core is improving and the community is trying to solve problems as
    they go. This is one of the key exciting projects in the blockchain and decentralized
    space.


    ## Conclusion


    In this chapter, we studied various consensus algorithms and their limitations.
    We studied how different consensus algorithms are designed for different problems.
    The best takeaway is that we need to identify the problem in the network and use
    the consensus algorithm which best fits the problem.


    In the next chapter, we are going to study the scaling challenges blockchain and
    decentralized applications are facing and how we can solve them using different
    techniques.


    **Join our book’s Discord space**


    Join the book’s Discord Workspace for Latest updates, Offers, Tech happenings
    around the world, New Release and Sessions with the Authors:


    [https://discord.bpbonline.com](https://discord.bpbonline.com)


