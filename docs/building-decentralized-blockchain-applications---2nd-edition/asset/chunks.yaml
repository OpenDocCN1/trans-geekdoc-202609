  trans: '


    Ocean Protocol 可用于多种应用。以下是几个示例：


    - 自动驾驶汽车：自动驾驶汽车制造商需要大量数据来训练驱动汽车的人工智能程序。这些机构假设他们至少需要 5 亿到 10 亿英里的行驶记录来训练算法，以便其能够在道路上安全行驶并做出准确决策。Ocean
    Protocol 可用于开发一个市场，让个人驾驶员可以在那里提交自己的数据并获得报酬。汽车制造商可以使用这些数据来训练算法。


    - 医学研究：大量的研究人员需要数据来完成他们的研究。在编写此书时，我们正在应对 COVID-19 疫情，几乎每家生物技术公司都面临截止日期，需要开发出疫苗使人类对这种病毒产生免疫。


    研究人员解决问题的唯一方法是使用数据，数据可以帮助研究人员做出有效的决策。Ocean Protocol 的目标正是针对这种情况：拥有数据的人通过与研究人员私下共享数据来获得报。


    - 全球数据存储：Ocean Protocol 可用于构建全球数据存储库，其中提供了几乎与技术、科学、病毒学和医学相关的所有数据，开发者可以轻松地使用它们来构建/训练算法。


    让我们了解 Ocean Protocol 是如何工作的。


    ## Ocean Protocol 的工作原理


    协议中有三个主要参与者。它们如下：


    - 数据提供者：如果你拥有某些数据并想出售它们，你就是数据提供者。数据提供者是数据的合法托管人。例如，你可能正在使用运动手表，或者认识有人在使用运动手表。他们会佩戴手表持续一段时间（比如一个月），这会产生许多关于身体的大量数据，例如睡眠时间、心率等。


    现在，假设你想出售这些数据。首先，你需要生成并将数据上传到某些服务中，例如 `Google Drive`、`Dropbox` 等。


    一旦你获得了数据的免费链接，你就可以将其接入 Ocean Protocol 并将其置于市场中。Ocean Protocol 绝不会存储你的实际数据；它存储你的记录的元数据并将其放入市场。Ocean
    Protocol 处理元数据的安全性，以确保没有隐私泄露。


    - 数据市场：一旦你准备好出售数据，就可以将其列在使用 Ocean Protocol 构建的第三方数据市场上。随后，数据市场会列出你的数据，然后它就为消费者准备就绪。


    - 数据消费者：数据消费者是使用你的数据来构建他们的应用程序、训练算法等的实体。Ocean Protocol 管理数据并确保消费者已支付元数据中列出的金额。


    一旦客户支付了金额，他们将获得数据的访问权限，提供者将获得加密货币支付。


    欲需详细信息，可以访问 Ocean Protocol 官方网站。官方网站的链接：`https://oceanprotocol.com/`


    让我们了解 ocean Protocol 的架构。


    ## Ocean Protocol 架构


    由 Ocean Protocol 团队制作的 Ocean Protocol 架构图所示：


    ![](img/Figure_11.1.png)


    Ocean Protocol 由以下部分组成：


    - 第 1 层：基础层

    - 第 2 层：中间层

    - 第 3 层：应用层

    - 第 4 层：钱包


    让我们详细看看它们：


    - 第 1 层：基础层，包含了区块链核心和智能合约。

    - 第 2 层：中间层，包含了与以太坊兼容的区块链库。

    - 第 3 层：应用层，包含了 DApps 生态系统。

    - 第 4 层：钱包。


    `Ocean.js`：一个与以太坊交互的 JavaScript 库。


    `Ocean.py`：一个为 Python 开发者提供的库，提供了丰富的功能。


    - 第 3 层：应用层，包含了 DApps 市场和应用程序。

    - 第 4 层：钱包。这是顶层，包含了用于访问区块链的网关。


    ## 结论


    在本章中，我们了解到 Ocean Protocol 是一种革命性的软件，它允许用户拥有数据并通过与研究人员私下共享数据来获得激励。它允许用户访问数据并确保隐私保护。

