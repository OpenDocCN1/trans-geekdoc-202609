  trans: "\n\n在上一节中，我们了解了如何在 IPFS 网络中托管静态网站。在本节中，我们将使用 IPFS 构建一个应用程序。\n\n我们将构建一个文件上传系统，用户可以在系统中向\
    \ IPFS 网络中上传文件，并获取查看该上传文件的链接，就像其他任何 Web 应用程序上传文件一样。唯一的主要的区别在于，我们将文件存储在 IPFS 网络中。\n\
    \n以下是我们将使用的技术栈：\n\n• 后端：`Node.js` 框架。\n• 前端：`HTML`、`CSS` 和 `jQuery` 框架。\n• 存储：`IPFS`\
    \ 网络\n\n你的系统中应该安装了最新的 `Node.js`。如果没有，请访问 `Node.js` 官方网站获取最新版本。\n\nNode.js 网站：`https://nodejs.org/en/download/`\n\
    \n让我们来看以下步骤：\n\n1. 创建一个新目录并使用 `Terminal/Command Prompt`（终端/命令提示符）进入该目录。\n\n2.\
    \ 使用以下命令创建一个新的 `Node.js` 项目：\n```bash\nnpm init –y\n```\n\n3. 现在，让我们安装项目所需的依赖项。这些依赖项也被称为\
    \ node modules：\n```bash\nnpm install --save express multer ipfs-api\n```\n\n\
    4. 现在，等待几秒钟让 node 安装依赖。`Express` 是一个用于构建 Web 应用程序的常用模块。\n\n`Multer` 是一个在 node\
    \ 生态系统中处理文件上传的 node 。\n\n`ipfs-api` 是 `IPFS` 网关接口的 node 。我们将使用该模块来执行 `IPFS` 操作。\n\
    \n5. 现在，创建一个新文件，命名为 `ipfs.js`，并粘贴以下代码：\n\n```javascript\nconst IPFS = require('ipfs-api');\n\
    \nconst ipfsOptions = {\n  host: 'localhost',\n  port: '5001'\n};\n\nconst ipfs\
    \ = new IPFS(ipfsOptions);\n\nfunction addFile(bufferData) {\n  return new Promise((resolve,\
    \ reject) => {\n    ipfs.files.add(bufferData, (err, file) => {\n      if(err)\
    \ { \n        reject(err);\n      }\n      resolve(file);\n    });\n  });\n}\n\
    \nmodule.exports = {\n  addFile: addFile,\n};\n```\n\n在前面的代码中，我们首先连接到本地机器 `5001`\
    \ 端口运行的 `IPFS`。如果你的机器上的端口和主机详情不同，可以进行修改。\n\n我们创建了一个不同的函数来向 `IPFS` 网络添加文件。`IPFS`\
    \ 接收 buffer 作为输入。我们正在使用 `IPFS` 模块提供的 `files.add()` 函数来添加文件。\n\n前面的函数返回一个 promise\
    \ 对象以便稍后解析。在服务器端 JavaScript 中编写代码是最佳实践。\n\n6. 接下来，在 node 中创建一个服务器。创建一个名为 `app.js`\
    \ 的文件并粘贴以下代码：\n\n```javascript\nconst express = require(\"express\");\nconst multer\
    \ = require('multer');\nconst fs = require('fs');\nconst app = express();\nconst\
    \ ipfs = require('./ipfs');\n\nconst storage = multer.diskStorage({\n  destination:\
    \ function (req, file, callback) {\n    callback(null, './uploads');\n  },\n \
    \ filename: function (req, file, callback) {\n    callback(null, file.fieldname\
    \ + '-' + Date.now());\n  }\n});\n\nconst upload = multer({ storage : storage}).single('userPhoto');\n\
    \napp.get('/', (req,res) => {\n  res.sendFile(__dirname + \"/index.html\");\n\
    });\n\napp.post('/api/photo', (req,res) => {\n  upload(req,res, async (err) =>\
    \ {\n    if(err) {\n      return res.end(\"Error uploading file.\");\n    }\n\
    \    let fileObject = fs.readFileSync(__dirname + '/' + req.file.path);\n    let\
    \ response = await ipfs.addFile(Buffer.from(fileObject));\n    let link = `http://localhost:8080/ipfs/${response[0].hash}`;\n\
    \    res.end(`File is uploaded - Click <a href=\"${link}\">here</a> to view the\
    \ file`);\n  });\n});\n\napp.listen(3000,function(){\n  console.log(\"Working\
    \ on port 3000\");\n});\n```\n\n让我们来理解这些代码：\n\na. 首先，在接下来的代码中引入了模块：\n```javascript\n\
    const express = require(\"express\");\nconst multer = require('multer');\nconst\
    \ fs = require('fs');\nconst app = express();\nconst ipfs = require('./ipfs');\n\
    ```\n我们还包含了为 `IPFS` 文件上传编写的代码。\n\nb. 在接下来的代码行代码中，我们正在配置 `multer` 模块以便将文件首先上传到本地系统：\n\
    ```javascript\nconst storage = multer.diskStorage({\n  destination: function (req,\
    \ file, callback) {\n    callback(null, './uploads');\n  },\n  filename: function\
    \ (req, file, callback) {\n    callback(null, file.fieldname + '-' + Date.now());\n\
    \  }\n});\n\nconst upload = multer({ storage : storage}).single('userPhoto');\n\
    ```\n在前面的代码中，我们添加了 `uploads` 目录来存储文件。我们还在配置 `multer` 允许用户每次从 `userPhoto` HTML\
    \ 上传一个文件。\n\nc. 在接下来的代码行中，我们通过创建路由来定义 Web 应用程序，映射到业务逻辑：\n```javascript\napp.get('/',\
    \ (req,res) => {\n  res.sendFile(__dirname + \"/index.html\");\n});\n\napp.post('/api/photo',\
    \ (req,res) => {\n  upload(req,res, async (err) => {\n    if(err) {\n      return\
    \ res.end(\"Error uploading file.\");\n    }\n    let fileObject = fs.readFileSync(__dirname\
    \ + '/' + req.file.path);\n    let response = await ipfs.addFile(Buffer.from(fileObject));\n\
    \    let link = `http://localhost:8080/ipfs/${response[0].hash}`;\n    res.end(`File\
    \ is uploaded - Click <a href=\"${link}\">here</a> to view the file`);\n  });\n\
    });\n```\n\n7. 接下来，让我们看看最后的 HTML。创建一个文件并命名为 `index.html`，粘贴以下代码：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title>File upload using IPFS</title>\n</head>\n\
    <body>\n  <h1>File upload system using IPFS</h1>\n  <form id=\"uploadForm\" enctype=\"\
    multipart/form-data\" action=\"/api/photo\" method=\"post\">\n    <input type=\"\
    file\" name=\"userPhoto\" />\n    <input type=\"submit\" value=\"Upload Image\"\
    \ name=\"submit\" />\n  </form>\n  <span id=\"status\"></span>\n\n  <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
    \  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/jquery.form/3.51/jquery.form.min.js\"\
    ></script>\n  <script>\n    $(document).ready(function() {\n      $('#uploadForm').submit(function()\
    \ {\n        $(\"#status\").empty().text(\"File is uploading...\");\n        $(this).ajaxSubmit({\n\
    \          error: function(xhr) {\n            status('Error: ' + xhr.status);\n\
    \          },\n          success: function(response) {\n            $(\"#status\"\
    ).empty().html(response);\n          }\n        });\n        return false;\n \
    \     });\n    });\n  </script>\n</body>\n</html>\n```\n\n8. 在前面的代码中，我们从内容交付网络（CDN）引入了\
    \ `jQuery` 和 `jquery form` 库。\n\n9. 我们创建了一个表单，以 multipart 格式将文件数据提交到我们在 `app.js`\
    \ 中创建的 API：\n注意 `action` 属性和输入 `name`。它们必须与 API 路由和 multer 文件部分属性一致。\n\n10. 现在是运行代码的时间了。在\
    \ `Terminal/Command Prompt` 中运行以下命令：\n```bash\nnode app.js\n```\n你的终端应该打印一条消息：\n\
    Working on port 3000\n\n这意味着程序运行成功。访问 `localhost:3000` 查看该应用程序。它看起来像这样：\n\n![](img/Figure_6.11.png)\n\
    \n11. 现在，从你的系统中选择一个文件并点击“Upload Image”按钮。你应该看到像这样的响应：\n\n![](img/Figure_6.12.png)\n\
    \n12. 现在，点击“here”在 IPFS 网络中查看图片。\n\n"
- fmt: "\nYou should see an image you have selected from your system. Look at the\
    \ address bar; it is the IPFS gateway path:\n\n![](images/Figure_6.13.png)\n\n\
    13. You have just built an end-to-end DApp using IPFS as a network and storage.\n\
    \nThis app uses the latest technologies such as backend system framework, `Node.js`,\
    \ and communicates to the frontend via Ajax.\n\nTo deploy this application, you\
    \ need to deploy the application on a server and connect to the IPFS gateway.\
    \ You can use the hosted IPFS gateway provided by Infura, as discussed in Chapter\
    \ 1, Introduction to Blockchain and Decentralizd Network. As of now, we have studied\
    \ about running single IPFS nodes in our machine, but a single IPFS peer is not\
    \ enough to maintain data redundancy and availability. This is because, well,\
    \ failure happens. What if one node fails and data is not replicated to another\
    \ node? It will result in data loss, so not the redundant network. To tackle such\
    \ a scenario, IPFS introduced the IPFS Cluster.\n\n## IPFS Cluster\n\n`IPFS Cluster`\
    \ is a distributed program that runs alongside IPFS peers and allocates and pins\
    \ data to other peers to maintain data redundancy and availability.\n\nTo understand\
    \ IPFS Clusters better, let us look at the architecture figure provided by the\
    \ IPFS Cluster documentation team:\n\n![](images/Figure_6.14.png)\n\nAs mentioned\
    \ earlier, the `IPFS Cluster` program communicates with IPFS peers running in\
    \ your system. `IPFS Cluster` communicates using the HTTP API of the IPFS peer,\
    \ which is running by default on the `5001` port.\n\n`IPFS Cluster` forms its\
    \ own network of peers that are running the cluster program and does not interfere\
    \ with the IPFS network. `IPFS Cluster` peers maintain global data consensus in\
    \ order to maintain the data redundancy and availability.\n\nYou can check out\
    \ the IPFS Cluster official project page to download the program and run it in\
    \ your system.\n\nIPFS Cluster home page: `https://cluster.ipfs.io/`\n\nOne of\
    \ the core components of the IPFS and IPFS Cluster is a module called `libp2p`.\
    \ As we studied in Chapter 1, Introduction to Blockchain and Decentralized Network,\
    \ `libp2p` manages peers and provides a framework to build distributed applications.\
    \ \n\nSince we have already discussed and learned IPFS in detail, it is the perfect\
    \ time to explore `libp2p` in depth and understand the core components of IPFS.\n\
    \n### libp2p\n\n`libp2p` is a library, specification, and protocol that helps\
    \ developers build a peer-to-peer network application.\n\n`libp2p` consists of\
    \ the following components:\n\n- Transport layer protocol: `libp2p` transport\
    \ layer protocol is the core of the `libp2p`. This layer ensures data transmission\
    \ from one peer to another. The transport layer protocol of `libp2p` is evolving\
    \ every day, and there will be more protocols in the future that will be supported\
    \ by the `libp2p`.\n- End-to-end encryption: `libp2p` transport layers can be\
    \ configured to use a secure end-to-end encryption using the latest version of\
    \ `TLS`, i.e., `v1.2`. `TLSv1.3` is under development.\n- Identity module: This\
    \ module ensures that peer is communicating and exchanging data with the correct\
    \ peer using public-key cryptography to perform an identity check on the data\
    \ sent and received in the network.\n- Routing: In the peer-to-peer network, it\
    \ is essential to have a system to identify and connect to other peers without\
    \ having to remember the address. Since there is no central system to look for\
    \ the peer information, `libp2p` provides a routing mechanism to ask peers to\
    \ provide the network address information, and if they do not have it, ask other\
    \ peers to fetch the same.\n- Content discovery: `libp2p` allows us to locate\
    \ content-based on the hash and uses the distributed hash table to look up content\
    \ using the hash or `CID`.\n- Messaging module: In a peer-to-peer network, peer\
    \ communication is the key. `libp2p` provides a publish/subscribe, also called\
    \ a `pub/sub`, communication module to help peers communicate in real-time.\n\n\
    `libp2p` provides software development kits in Java, `C++`, `Go`, and `JavaScript`.\
    \ Let us build a simple application using server-side JavaScript using `libp2p`.\n\
    \nWe will build a simple application that creates a peer and connects to other\
    \ peers. We will use the `Node.js` framework and `js-libp2p`.\n\nLet us create\
    \ a new node project through the following steps:\n\n1. Create a new folder and\
    \ navigate to the folder using Command Prompt or Terminal:\n`$ npm init --y`\n\
    \n2. Install the `libp2p` library and the required dependencies. Run the following\
    \ command in the Terminal:\n`$ npm install --save libp2p libp2p-websockets libp2p-secio`\n\
    `$ npm install --save libp2p-mplex libp2p-bootstrap`\n\n3. Once installed, create\
    \ a new file and name it `app.js`. Copy pastes the following code:\n\n```javascript\n\
    const Libp2p = require('libp2p')\nconst WebSockets = require('libp2p-websockets')\n\
    const SECIO = require('libp2p-secio')\nconst MPLEX = require('libp2p-mplex')\n\
    const Bootstrap = require('libp2p-bootstrap')\n\n// peers addresses\nconst bootstrapMultiaddrs\
    \ = [\n  '/dns4/ams-1.bootstrap.libp2p.io/tcp/443/wss/p2p/QmSoLer265NRgSp2LA3dPaeykiS1J6DifTC88f5uVQKNAd',\
    \ '/dns4/lon-1.bootstrap.libp2p.io/tcp/443/wss/p2p/QmSoLMeWqB7YGVLJN3pNLQpmmEk35v6wYtsMGLzSr5QBU3'\n\
    ]\n\nasync function startNode() {\n  const node = await Libp2p.create({\n    modules:\
    \ {\n      transport: [WebSockets],\n      connEncryption: [SECIO],\n      streamMuxer:\
    \ [MPLEX],\n      peerDiscovery: [Bootstrap]\n    },\n    config: {\n      peerDiscovery:\
    \ {\n        autoDial: true,\n        [Bootstrap.tag]: {\n          enabled: true,\n\
    \          list: bootstrapMultiaddrs\n        }\n      }\n    }\n  })\n\n  node.on('peer:discovery',\
    \ (peer) => {\n    console.log('Discovered %s', peer.id.toB58String())\n  })\n\
    \n  node.on('peer:connect', (peer) => {\n    console.log('Connected to %s', peer.id.toB58String())\n\
    \  })\n  // start libp2p\n  await node.start()\n}\n\nstartNode()\n```\n\nLet us\
    \ understand the code:\n\na. From line 1 to 5, we imported all the modules with\
    \ `libp2p`.\nb. Then, we stored two peer addresses that are already running `libp2p`\
    \ (or IPFS), and we want to connect to them.\nc. In the next line, we declared\
    \ a function to contain all the code and created a new `libp2p` instance:\n```javascript\n\
    const node = await Libp2p.create({\n  modules: {\n    transport: [WebSockets],\n\
    \    connEncryption: [SECIO],\n    streamMuxer: [MPLEX],\n    peerDiscovery: [Bootstrap]\n\
    \  },\n  config: {\n    peerDiscovery: {\n      autoDial: true,\n      [Bootstrap.tag]:\
    \ {\n        enabled: true,\n        list: bootstrapMultiaddrs\n      }\n    }\n\
    \  }\n})\n```\nAs you can see, we included all the modules we need in the `modules`\
    \ object, such as transport, encryption, peer discovery, and so on.\nIn the `config`\
    \ object, we included the peers addresses to connect with.\nd. In the next two\
    \ lines, we added two event listeners to listen for the events that are fired\
    \ on pub/sub channels.\ne. In the last line, we started our node.\n\n4. Run the\
    \ program using the following command to view the output:\n`$ node app.js`\n\n\
    It should display the following output:\n\n![](images/Figure_6.15.png)\n\nIt means\
    \ our peer is now connecting to other peers using `libp2p` code.\n\n## Conclusion\n\
    \nIn this chapter, we explored IPFS and its working. Then, we moved to IPFS installation\
    \ and configuring it in our local system. We also studied the various concepts\
    \ related to IPFS., and then developed two important applications using IPFS to\
    \ get a deeper understanding of IPFS and its usage. Finally, we moved to the `libp2p`\
    \ framework to learn the core component of IPFS and its ecosystem.\n\nIn the upcoming\
    \ chapter, we will learn about various decentralized database software.\n"
