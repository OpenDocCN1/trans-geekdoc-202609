    });\n```\n\nIf the file does not exist, we assume that it is a genesis node. We\
    \ are then creating the new databases and writing the address of each database\
    \ in the `dbaddress.js` file:\n\n```javascript\nuserDb = await orbitdb.create('email.user',\
    \ 'docstore',{\n  accessController: {\n    write: ['*']\n  } \n});\nuserContactsDb\
    \ = await orbitdb.create('email.user.contacts','docstore', {\n  accessController:\
    \ {\n    write: ['*']\n  } \n});\nuserEmailsDb = await orbitdb.create('email.user.data',\
    \ 'docstore', {\n  accessController: {\n    write: ['*']\n  } \n});\nlet fileContents\
    \ = {\n  \"user\": userDb.address.toString(),\n  \"contacts\": userContactsDb.address.toString(),\n\
    \  \"emails\": userEmailsDb.address.toString()\n}\n// write the db file\nfs.writeFileSync(filePath,\
    \ JSON.stringify(fileContents));\n```\n\nIf the file exists, we are making the\
    \ connection to the database using the `open()` function provided by `OrbitDB`.\
    \ We pass the database address as a parameter to the function:\n\n```javascript\n\
    let fileData = fs.readFileSync(filePath, 'utf-8');\nlet config = JSON.parse(fileData);\n\
    console.log('Databases exists, loading them');\nuserDb = await orbitdb.open(config.user);\n\
    userContactsDb = await orbitdb.open(config.contacts);\nuserEmailsDb = await orbitdb.open(config.emails);\n\
    ```\n\nTo load the database in memory, we are using:\n\n```javascript\nuserDb.load();\n\
    userContactsDb.load();\nuserEmailsDb.load();\n```\n\nOnce the databases are ready,\
    \ we are assigning an event to each. In our codebase, we are adding more listeners:\n\
