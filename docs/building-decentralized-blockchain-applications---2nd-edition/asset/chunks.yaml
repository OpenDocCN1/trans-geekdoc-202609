    # CHAPTER 2: Ethereum, Smart Contracts, and DApps


    ## Introduction


    `Ethereum` is a revolution in the crypto world. There is no denying that. The
    introduction of smart contracts programs allowed developers to build their own
    cryptocurrency or apps and host it on blockchain, was a great move and a major
    success.


    ## Structure


    In this chapter, we will learn about `Ethereum` in-depth and cover the following
    topics:


    • Introduction to `Ethereum`

    • `Bitcoin` and `Ethereum`

    • History of `Ethereum`

    • Components of `Ethereum`

    • `Ethereum` and `DApps`

    • `Ethereum` clients

    • `Ethereum` networks

    • Installing `Geth`

    • Synchronizing the testnet blockchain

    • Installing `Ganache`

    • `Infura`

    • `JSON Remote Procedure Call API`

    • Smart contracts and `Solidity` language

    • `Solidity` data types

    • Contract structure

    • Writing our first `Solidity` program

    • Decentralized Applications using `Ethereum`

    • `DApps` stack

    • Decentralized message communications protocols


    ## Objectives


    We will dive in-depth on each topic and cover all the details required to program
    the smart contract and build applications that are running on the `Ethereum` blockchain.
    We will learn the idea behind `Ethereum` and how it is different from `Bitcoin`.


    ## Introduction to Ethereum


    `Ethereum` is an open-source, peer-to-peer (`P2P`), globally distributed public
    computing infrastructure that runs programs called smart contracts and maintains
    the system''s state changes using the blockchain and cryptocurrency called `ether`.


    That is a lot to take in one statement. The breakdown is as follows:


    • Open-source: `Ethereum` is an open-source project. Anyone can participate and
    contribute to the codebase of `Ethereum`. Here is the codebase repository—https://github.com/ethereum.

    • P2P: `Ethereum` runs on a decentralized P2P network like `Bitcoin`. There is
    no central authority to manage the conflict. Conflict is managed using consensus.
    We will learn about the consensus of `Ethereum` in the upcoming sections.

    • Globally distributed infrastructure: `Ethereum` executes smart contracts on
    a public computing infrastructure formed using the P2P network. Think of it like
    a supercomputer but not in one place!

    • Smart contracts: Smart contracts are programs that are executed on the `Ethereum`
    public distributed infrastructure. We will learn and code smart contracts in the
    upcoming sections.

    • Blockchain: `Ethereum` uses blockchain to store the system''s state and changes
    to maintain a conflict-free, transparent, and decentralized system.

    • Ether: `Ether` is a native token used to charge the incentive for executing
    the programs on the network. It is also used to reward validators for helping
    validate the blocks in the network.

