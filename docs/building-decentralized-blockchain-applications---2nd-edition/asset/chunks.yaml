    # 去中心化数据库


    # 第 7 章


    # OrbitDB，一种点对点分布式数据库


    ## 引言


    OrbitDB 是一个构建在 IPFS 之上的点对点、无服务器、分布式数据库。在上一一个章节中，我们已经详细学习了星际文件系统（IPFS）。在本章中，我们将学习
    OrbitDB 以及如何使用它来构建去中心化应用（DApps）。


    ## 结构


    我们将在本章中涵盖以下主题：


    • OrbitDB 简介

    • 安装 OrbitDB

    • OrbitDB 数据模型

    • 使用 OrbitDB 构建 DApps

    • 技术栈


    ## 目标


    学习本章后，你将能够使用 OrbitDB 构建 DApps，你还将学习如何将 IPFS 和 OrbitDB 结合使用来构建 DApps。让我们开始吧。


    ## OrbitDB 简介


    以下是根据 OrbitDB 项目页面的定义：


    OrbitDB 是一个无服务器、分布式、点对点的数据库。OrbitDB 使用 IPFS 作为其数据存储，并使用 IPFS Pubsub 与节点自动同步数据库。它是一个最终一致性数据库，使用
    CRDTs 进行无冲突的数据库合并，使得 OrbitDB 成为去中心化应用（DApps）、区块链应用程序和优先 Web Web 应用程序的极选择。


    这是一个非常技术性的定义。让我们进一步拆解以更好地理解：


    • OrbitDB 是无服务器的，这意味着在使用 OrbitDB 时，你不需要像其他数据库软件那样维护数据库服务器。它作为各种编程语言模块提供。

    • OrbitDB 是分布式的；它被设计为没有中央服务器的点对点数据库。

    • OrbitDB 使用 IPFS 作为存储系统。OrbitDB 充当 IPFS 和编程接口之间的层。

    • OrbitDB 是一个点对点数据库，为了将节点中的更改同步到其他节点，它使用 IPFS 发布/订阅（pub/sub）系统与其他节点通信。

    • OrbitDB 使用最终一致性模型；该模型会将数据项的最新更新版本返回给用户，从而保持数据的可用性和一致性。为了实现这种最终一致性，OrbitDB 使用了无冲突复制数据类型（CRDTs）。

    • OrbitDB 被封装为 Node.js 库。选择 JavaScript 是因为因为它在编程社区中的流行和无不在，以及它与 IPFS 的 JavaScript
    实现（称为 `js-IPFS`）的互操作性。


    让我们继续安装 OrbitDB。


    ## 安装 OrbitDB


    OrbitDB 是一个无服务器应用程序，所以你不需要像运行 MySQL 等其他数据库那样运行服务器。


    让我们通过以下步骤在我们的应用程序中安装 OrbitDB：


    1. 这是在我们的项目中安装 OrbitDB 和 IPFS 的命令：


    ```

    npm install @orbitdb/core @orbitdb/liftoff helia

    ```


    `liftoff` 模块将帮助我们快速启动 OrbitDB 数据库。


    2. 安装完成后，你可以使用以下代码连接到 IPFS 并创建一个 OrbitDB 数据存储器：


    ```javascript

    import { createOrbitDB } from ''@orbitdb/core''

    import { DefaultLibp2pOptions } from ''@orbitdb/liftoff''


    const libp2p = createLibp2p({ ...DefaultLibp2pOptions })

    const ipfs = await createHelia({ libp2p })

    console.log(''Connected to IPFS'');

    const orbitdb = await createOrbitDB({ ipfs })

    console.log(''OrbitDB instance created.'')

    const db1 = await orbitdb.open(''db1'')

    await db1.add(''hello world!'')

    console.log(await db1.all())

    ```


    3. 执行上述代码后，你会看到：


    ```

    Connected to IPFS

    OrbitDB instance created.

    [ { value: ''hello world!'' } ]

    ```


    4.  现在，我们可以使用 OrbitDB 在我们的应用程序中打开数据存储。

