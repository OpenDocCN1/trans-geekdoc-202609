    \n</p>\n\n<h2>Connect to drone</h2>\n\n<p>\n\n Connect the battery in the drone\
    \ and it will boot the drone system. <br>\n\n Check your WiFi connection. You\
    \ should an access point naming similar to one shown in the screenshot below.<br><br>\n\
    \n<img src='https://image.codeforgeek.com/wp-content/uploads/2019/03/Drone-wifi-access-point.png?resize=352%2C264&ssl=1'><br><br>\n\
    \n Connect to the WiFi network. <br>Once connected, open up the terminal and try\
    \ to do a telnet to 192.168.1.1 – this is the IP address of the drone. <br><br>\n\
    \n<img src=\"https://image.codeforgeek.com/wp-content/uploads/2019/03/Telnet-drone.png?resize=640%2C259&ssl=1\"\
    ><br><br>\n\n</p>\n\n<h2>Programming the drone</h2>\n\n<p>\n\n Let’s code our\
    \ app. First, create a new folder and switch to it using the terminal. <br><br>\n\
    \n<code>\n\nmkdir drone && cd drone\n\n</code><br>\n\n Create a new Node project\
    \ using the following command.<br><br>\n\n<code>\n\nnpm init --y\n\n</code><br>\n\
    \n Let’s install the required dependency.<br><br>\n\n<code>\n\nnpm install --save\
    \ ar-drone\n\n</code><br>\n\n Here is the code. <br><br>\n\n<script src=\"https://gist.github.com/codeforgeek/514ee981176e344ea4e871f0407b9fed.js\"\
    ></script>\n\n</p>\n\n<h2>Running the code</h2>\n\n<p>\n\n Connect to the drone\
    \ WiFi and run the code using the following command.\n\n<br><br>\n\n<code>node\
    \ app.js</code>\n\nand see the drone fly and follow the commands as mentioned\
    \ in the code.\n\n</p>\n\n<p>\n\nNow, we add some basic styling to the page for\
    \ the users:\n\n  Here is the small demo.<br>\n\n<style>.embed-container { position:\
    \ relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%;\
    \ } .embed-container iframe, .embed-container object, .embed-container embed {\
    \ position: absolute; top: 0; left: 0; width: 100%; height: 100%; }</style><div\
    \ class='embed-container'><iframesrc='https://www.youtube.com/embed/97yUXCds3tY'frameborder='0'\
    \ allowfullscreen></iframe></div>\n\n</p>\n\n</div>\n\n</div>\n\n</div>\n\n<!--\
    \ Bootstrap core JavaScript -->\n\n<script src=\"vendor/jquery/jquery.min.js\"\
    ></script>\n\n<script src=\"vendor/bootstrap/js/bootstrap.bundle.min.js\"></script>\n\
    \n</body>\n\n</html>\n\nWe have added the jQuery library in the footer of the\
    \ page to avoid loading the library during the initial page load. This trick improves\
    \ the speed of the website.\n\nThe preceding code is a bit lengthy, but just go\
    \ through it and understand the syntaxes. It is basic HTML code with standard\
    \ tags.\n\nCopy, paste and save the code in an index.html file, and place it inside\
    \ the folder.\n\nNow, open your Terminal, navigate to the folder that contains\
    \ the code, and run the following this command to host the website in the IPFS:\n\
    \n$ ipfs add -r <folder name>\n\nThe preceding command will add the file present\
    \ in the folder in a recursive manner. You should receive multiple hashes in your\
    \ Terminal, and you need to access the index.html file, which is an entry point\
    \ of the website, as illustrated in the following screenshot:\n\n![](images/Figure_6.10.png)\n\
    \nIf you are adding multiple files of the website, you shall receive multiple\
    \ hashes. To access the website, use the hash of index.html.\n\nThis is how you\
    \ can deploy a static website in the IPFS network. In the next section, we will\
    \ learn to build and use IPFS in the backend system.\n\n## [Building a full-stack\
    \ app using IPFS](#toc.xhtml#zh78)"
