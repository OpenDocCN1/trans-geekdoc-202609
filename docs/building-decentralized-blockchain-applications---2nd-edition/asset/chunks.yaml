  trans: '

    通过内容查找项目是我们已经在做的事情。例如，当你寻找一块布料时，你通常根据颜色或类型来索要它；这就是内容寻址，因为你询问的是它是什么。


    如果你使用位置寻址来寻找那块布，你将根据它的位置来索要：我想要第二个架子上的、距离左侧三块布的 T 恤。如果有人移动了那块布，你就没戏了！


    这就是我们在互联网上访问内容的方式。例如，


    * `/Users/Alice/Documents/project_paper.doc`

    * `C:/Users/Joe/My/Documents/presentation.ppt`


    IPFS 反而生成内容标识符（`CID`），它也被称为哈希值。


    使用哈希的内容寻址广泛用于连接分布式系统中的数据。你可以从 Git 到加密货币中看到基于哈希的内容寻址。它无处不在。


    然而，这些系统中的底层数据结构并不总是互操作的。每个系统都使用不同的数据集和结构。为了解决这些问题，IPFS 开发了星际链接数据（`IPLD`），它作为内容寻址的数据模型。IPLD
    充当不同系统使用的不同类型数据集之间的翻译层。因此，IPFS 使用基于哈希的内容寻址，并在需要时 IPLD 执行数据集翻译，以实现数据从一个系统到另一个系统的平滑过渡。


    ### 有向无环图


    IPFS 使用 `DAG` 来存储内容。它使用 Merkle DAG，通过将叶子节点哈希化来形成父节点。我们在第一章《区块链与去中心化网络简介》中学习过 Merkle
    树。


    `DAG` 是一种边具有方向且不允许环的图。


    例如，像 `A|B|C` 这样的链表是 `DAG` 的实例，其中 `A` 引用 `B`，依此类推。我们说 `B` 是 `A` 的子节点或后代，节点 `A`
    有指向 `B` 的链接。同样，`A` 是 `B` 的父节点。


    在 `DAG` 中，不是任何其他节点的子节点被称为根节点。


    Merkle DAG 是一种 `DAG`，其中每个节点都有一个标识符（哈希或 `CID`），这是使用 `SHA-256` 函数对节点内容进行哈希处理的结果。Merkle
    DAG 节点是不可变的。节点的任何更改反都会创建一个不同的 Merkle DAG。


    IPFS 通过将内容拆分为块来构建内容的 Merkle DAG 树。这些块中的每一个与 `CID` 联，然后从叶子节点开始哈希在一起形成 Merkle DAG
    树。


    因此，IPFS 提供了使用哈希和 Merkle DAG 链接的内容寻址，这些链接通过哈希组合形成内容。让我们学习下一个也是最后一个模块：DHT。


    ### 分布式哈希表


    哈希表是一组键值对，而分布式哈希表是将表分布在网络中不同的对等节点上。


    DHT 的主要优势是去中心化、容错性和可扩展性。由于这一点，哈希表可以跨越数百万个节点，由于数据的分布式特性，数据可用性更高。


    IPFS 有一个名为 `libp2p` 的独立库，处理分布式哈希表和对等网络。


    IPFS 使用 `DHT` 来查找内容和节点的当前位置。一旦找到内容，IPFS 就会连接到内容并将其下载到你的系统。一旦下载了这些块，你计算哈希并验证内容的真实性。


    `libp2p` 还处理对等网络连接和连接复用。连接复用允许 `libp2p` 使用单个连接处理多个服务。


    我们将在接下来的章节中学习更多关于 `DHT` 的知识。现在，让我们在后续章节的系统中安装 IPFS。


    ### 安装和配置星际文件系统


    让我们通过以下步骤在我们的系统中安装 IPFS 并成为一个对等节点：


    1. 导航到 IPFS 官方网站 `https://dist.ipfs.io/-go-ipfs` 并下载适用于你系统的 IPFS 程序包。如图所示，选择你的操作系统以下载正确版本的
    IPFS：


    ![](img/Figure_6.1.png)


    2. 一旦下载了包，将其解压或解压缩包并切换到解压后的文件夹。以下命令在你的系统中安装 IPFS：


    ```

    cd go-ipfs

    ./install.sh

    ```


    3. 一旦安装了 IPFS，你可以运行以下命令来验证它：


    ```

    ipfs help

    ```


    它应该在终端中打印 IPFS 命令，如下截图所示：


    ![](img/Figure_6.2.png)


    现在，让我们在我们的系统中运行 IPFS：


    4. 在你的终端上运行此命令：


    ```

    ipfs init

    ```


    它将初始化仓库并在你的系统中创建运行 IPFS 所需的文件。


    5. 启动 IPFS 守护进程。要这样做，运行此命令：


    ```

    ipfs daemon

    ```


    此命令将以守护进程（后台进程）模式启动 IPFS。你应该会在终端中看到如下所示的消息：


    ![](img/Figure_6.3.png)


    6. 现在，导航到 `http://localhost:5001/webui`；你应该能看到管理界面，如下：


    ![](img/Figure_6.4.png)


    在管理界面中，你可以看到节点信息（NODE INFO），如 Peer ID、版本、网络流量图表和节点分布（DISTRIBUTION OF PEERS）。


    7. 现在，访问 Peers 页面；你应该能够看到全球范围内的节点分布。它看起来像下面的截图，但节点数量可能会变化：


    ![](img/Figure_6.5.png)


    你可以看到遍布世界各地的对等节点及其 ID。现在你也是一个对等节点，你可以访问任何你喜欢的文档（前提是你拥有文件的 `CID` 或哈希值）。


    让我们快速添加一个文件并尝试使用 IPFS 命令访问它。


    8. 运行此命令在 IPFS 网络中添加文件：


    ```

    ipfs add <path of the file>

    ```


    如果执行成功，此命令将在屏幕上生成内容的哈希值：


    ![](img/Figure_6.6.png)


    9. 现在，复制哈希并使用浏览器访问它：


    `localhost:8080/ipfs/<hash of the file>`


    你应该会在浏览器中看到该文件，如下所示：


    ![](img/Figure_6.7.png)


    你也可以使用全局 IPFS 网关从任何地方访问。访问以下 URL：


    `https://ipfs.io/ipfs/QmZPG1xjGVvmtpWvxBFZC42GWuRisdM6`


    10. 你可以将哈希替换为你的文件哈希并与任何人共享。你不需要成为对等节点即可访问 IPFS 上的文件。


    11. 你可以使用以下命令从命令行访问文件：


    ```

    ipfs get <hash of the file>

    ```


    执行此命令后，你应该能够在文件系统中看到下载的文件。


    我们将在下一节中学习更多关于 IPFS 命令行。


    ### 星际文件系统命令行


    IPFS 提供了一个命令行工具，供开发者使用命令行提示符或终端执行 IPFS 操作。


    要检查可用命令列表，请在终端运行：


    ```

    ipfs --h

    ```


    它将在你的终端屏幕上打印所有可用命令，如下：


    ![](img/Figure_6.8.png)


    IPFS 命令分为两种：


    * 离线：可以在不运行 IPFS 实例的情况下执行。

    * 在线：需要你的系统中运行着 IPFS 节点。


    你可以在 IPFS 官方网站查看所有命令详情：`https://docs.ipfs.io/reference/api/cli/`


    现在，让我们学习如何配置在系统或云服务器上运行的 IPFS 以满足你的应用程序需求。


    ### 配置星际文件系统节点


    IPFS 将配置存储在任何操作系统主目录下的文件中。配置以 JavaScript 对象表示法（JSON）文件格式存储。你可以在 `~/.ipfs/config`
    查看该文件。


    在编辑器中打开该文件查看内容。让我们了解配置的关键方面。


    #### 地址

