    BigchainDB is a decentralized database. BigchainDB uses `Tendermint` to achieve
    decentralization and reach consensus between various peers. `Tendermint` is a
    consensus software, using which we can develop and build secure decentralized
    software with `BFT` consensus.


    To perform fast indexing and querying, each BigchainDB node runs and manages its
    own local `MongoDB` instance. `MongoDB` is a popular NoSQL database. The communication
    between nodes is achieved using `Tendermint` protocols.


    BigchainDB is a decentralized database, which means there should be no central
    point of failure. To achieve that, `BigchainDB` node is a self-owned and self-operated
    entity. Since there is no single owner of the network, if one node fails, other
    nodes will maintain the network.


    BigchainDB nodes can be and are located in many geographical places across the
    globe. The local legal jurisdiction and cloud providers work differently in every
    country, so an issue with one node or collective nodes in a country of concern
    (such as China or North Korea) does not affect them all.


    Due to this decentralization, even if a node stops responding to requests and
    eventually fail, the rest of the network will continue to operate. In fact, up
    to one-third of the BigchainDB nodes can fail, and the rest of the network will
    still work.


    ### Immutability


    BigchainDB is an immutable database, which means information cannot be altered
    or erased once added successfully in a BigchainDB network. At least not without
    investing great computing/hashing power, which is very difficult and time and
    money-consuming. If some data somehow manages to get changed or erased, that is
    detectable in the network and results in a great level of data integrity and fault
    tolerance.


    BigchainDB does not provide any `API` that allows us to change or modify the existing
    data. It is one of the approaches used by BigchainDB to maintain data immutability.


    In BigchainDB, every node has a full copy of all the data in a locally managed
    `MongoDB` database instance. Hence, there is no single `MongoDB` database as a
    point of failure, just like we handle data in Bitcoin or other decentralized systems.


    If one or more BigchainDB nodes are corrupted or destroyed due to various reasons,
    the other nodes would not be affected and will still have a copy of all the data
    that can be later used to rebuild the corrupted node.


    To maintain the integrity of the data up to the standard, all the transactions
    in BigchainDB are cryptographically signed. After a transaction is stored, changing
    its data will change the signature, which can be easily detected due to signature
    mismatch.


    ### Owner-controlled assets


    BigchainDB stores and exchanges information in the form of assets. Assets could
    be anything ranging from currency to house to simple chairs.


    BigchainDB has in-built support for owner-controlled assets, that is, only the
    owner (or owners) of an asset can transfer it to other entities. The owners are
    typically users with a set of private keys. Owner-controlled assets cannot be
    transferred by anyone else, not even by the node operator.


    There is only one built-in asset in blockchains like Bitcoin or Ethereum, but
    BigchainDB lets users create as many exclusive assets as they need. Users cannot
    create assets that appear to be already present in the network, maintaining the
    ownership of assets and the integrity of the existing data.


    BigchainDB always validates every transaction to ensure that it is not trying
    to transfer a value that was already transferred by another transaction; that
    is, it prevents double spending.


    ### High transaction rate


    BigchainDB provides a high transaction rate. As mentioned in the introduction
    section, BigchainDB runs on the `Tendermint`, so the performance stats are very
    much the same.


    `Tendermint` processes thousands of transactions per second in a distributed network.


    ### Low latency and fast finality


    BigchainDB provides low latency; that is, it adds new blocks in the network instantly.
    BigchainDB claims that they usually take only a few seconds (or less) for a transaction
    to be included in a new block, which is impressive.


    Once a block is added in the BigchainDB network, it is replicated across the peers;
    once done, there is no way it can be changed or revoked.


    ### Indexing and querying structured data


    As mentioned in the introduction section earlier, each node in a BigchainDB network
    has its own local `MongoDB` database instance. Each node has access to the full
    power of `MongoDB` for indexing and querying the stored data (transactions, assets,
    metadata, and blocks, all of which are JSON objects).


    The data ownership goes to the node owner, and they are free to decide how much
    of that data they want to expose to external users. For example, one node owner
    might decide to index geospatial and geographical data and offer optimized geospatial
    queries via an `API`. In contrast, another operator might decide to offer a `GraphQL
    API`. It is totally up to the node owners.


    `MongoDB`, being a NoSQL database, is very powerful in terms of storing information
    and querying it.


    Let us explore the use cases of BigchainDB.


    ## BigchainDB use cases


    BigchainDB is immutable, decentralized database software that can serve a large
    number of use cases. BigchainDB can be used wherever there is a need for decentralized,
    immutable information representing any digital assets.


    There are many industry sectors and organizations that can directly benefit from
    BigchainDB features. In this section, we will cover a few BigchainDB use cases.


    ### Supply chain


    In a typical supply chain network, multiple parties are collaborating and exchanging
    information, goods, and assets.


    The supply chain is a huge network of buyers and sellers, and they generate tons
    of data in the form of invoices, payment records, goods information, and so on.
    One of the major challenges faced by supply chain network is the security of information
    passing through between various entities.


    As mentioned in the preceding paragraph about the data generation capability of
    the supply chain, when the size of the chain grows, data grows exponentially.
    With data growth, the complexity of the systems grows as well.


    To handle the size of the data supply chain generated while maintaining transparency
    and security of assets, we need a system like blockchain with immutable data stores
    that cannot be modified by anyone except the owner of the asset.


    One of the core concerns with the decentralized database or blockchain technologies
    is latency. Due to the widespread use of the network, databases running on decentralized
    systems may take time to respond. That is where BigchainDB shines, bringing along
    its query capabilities and high throughput performance.


    BigchainDB can be used in a supply chain use case to tackle the various issues
    we discussed, mainly, data management and security. BigchainDB can handle large
    amounts of data while letting users run run-time queries.


    ### Intellectual property rights management


    Blockchain proves to be the key solution for intellectual property rights management.
    For example, consider an artist creating art: Be it musical, or painting, or anything
    else.


    Blockchain technology, in general, has several features that can be used to provide
    proof to artists claims over their assets. Once an art asset is registered on
    a blockchain with proper attribution, it can be used to prove the ownership of
    the IP rights.


    One of the common events that occur in the IP is the sale and transfer of the
    assets from one owner to another based on various agreements. BigchainDB can be
    used to record assets, and transfer them between users.


    ### Identity

