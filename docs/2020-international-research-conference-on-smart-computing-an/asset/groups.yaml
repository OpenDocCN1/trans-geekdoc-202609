    # B. Q-learning approaches


    Q-learning is one of the simplest and powerful way for agent learning algorithms
    to learn optimal actions in a controllable Markovian environment [43]. Some of
    Q-learning approaches have been proposed in the area of traffic enhancement in
    the mobile ad networks.


    +   - Boyandan and Littman have proposed a Q-learning algorithm for packet routing
    by embedding the reinforcement learning module in each node. They have tested
    the algorithm using a network that consists of 36 nodes and the article can find
    optimal routing without considering the network topology or the traffic patterns
    previously [19].


    The Q-MAP algorithm is a mesh-based on multicast routing scheme for mobile ad
    networks with multi-agent Q-learning. It is well adapted to dynamic topology and
    scaled distributed agents, handling the scalability and tolerance of faults effectively.
    Because of this, its results ensure better utilization of the resources in wireless
    ad networks [20].


    An authentication mechanism based on Q learning has been introduced in early research
    work, called TQS (Trust and Quality learning). The protocol detects the malicious
    nodes over the AODV (Ad Hoc On-Demand Distance Vector) routing protocol by historical
    behavior of data transfer. TQS is especially focused on detecting the black hole
    attack which helps to improve the trust evaluation by quality learning.


    # C. Dual reinforcement learning


    Dual reinforcement learning implies the concepts of DQN (Deep Q-Network) and Double
    Q learning algorithms, based on Q-learning and the reward function of dual reinforcement
    learning uses the optimal Q of the next state and value as well. This is a bit
    complex than the Q-learning algorithms. This Double reinforcement learning avoids
    over-estimation by separating the operation of actions selection and evaluations
    of actions [44]. Shaish Kumar et al. have done analysis on DQR (Dual Reinforcement
    Q-routing) and found that DQ-Routing can sustain higher networks than DQN and
    non-adaptive-shortest-path routing [45].


    # D. TPOT-RL


    Team-partitioned, opaque- reinforcement learning (TPOT-RL) is a distributed reinforcement
    learning technique that has been applied within multi-agent domains. This has
    achieved good results in maintaining the best routing, while minimizing the security
    and the efficiency of data sharing in the network. The implementation of TPOT-RL
    is not trivial but requires additional communication cost [21].


    # E. Collaborative RL


    SAMPLE is a Collaborative Reinforcement based approach that has been applied in
    a novel routing protocol. It is also originated from Q-Learning and it presented
    a reinforcement learning algorithm which is designed to adapt to dynamic topology.
    SAMPLE optimizes the routing behavior by learning the variations of the network
    properties from routing agents. This is a Q-learning based function which is very
    similar to the mechanism of the Ant Colony Optimization. This approach allows
    low cost and tolerance to topology changes [22].


