    # 应用机器学习增强移动自组织网络信任的综述


    G. M. Linarajirasa*

    软件工程系

    计算与技术学院

    斯里兰卡凯拉尼亚大学

    madushikhani@gmail.com


    S. R. Liyange

    软件工程系

    计算与技术学院

    斯里兰卡凯拉尼亚大学

    sidath@kln.ac.lk


    **摘要：** 移动自组织网络（MANETs）在日益网络化的世界中起着至关重要的作用，在许多领域都有广泛应用，包括军事、社会、车载自组织网络（VANETs）和其他智能系统。由于移动自组织网络的动态特性，它们经常面临各种恶意攻击。多年来，人们开发了各种信任机制以确保
    MANET 环境中的可靠性和信任。在所提出的解决方案中，机器学习的应用取得了成效。基于此，本文介绍了移动自组织网络基于信任的方法综述。本研究的重点在于分类和评估现有的信任机制，并为该领域的未来研究提供指导。


    **关键词：** 机器学习、恶意攻击、移动自组织网络（MANET）、信任、车载自组织网络（VANET）


    ## I. 引言


    由于移动设备、笔记本电脑、数字设备和其他物联网（IoT）的使用，无线通信机制在近几年中变得越来越流行。移动自组织网络是无线网络的一种类型，该领域的研究人员对其进行了广泛研究。


    但 MANETs 中的主要问题是安全问题，由于其脆弱性，在数据传输方面面临一些挑战。由于无线线路物理保护有限、自主行为、移动性以及缺乏中心化基础设施，MANETs
    的安全实现更具挑战性 [1]。


    此外，信任水平取决于路由机制以及移动性模型。目前定义了一组移动性模型；随机点移动模型是 MANETs 中常用的模型。


    在 MANETs 背景下定义了特定的路由协议，例如 AODV（按需自组织路由协议）、OLSR（优化链路状态路由协议）、DSDV（目的序列距离矢量路由协议）、用于移动自组织网络的
    Batman 协议 [2]。


    尽管有许多路由机制，但由于这些网络具有脆弱性，数据可能会丢失或被篡改，确认通过 MANET 传输数据的安全性是一个主要问题。由于信任是建立可靠通信机制的主要组成部分，已经有了许多工作来增强
    MANETs 的安全性。


    本文通过对 MANETs 中现有信任增强进行批判性分析，提供了一定的比较分析，并特别关注机器学习方法，为未来的研究路径提供构思路。


