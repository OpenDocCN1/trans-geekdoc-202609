    been proposed by Yan Lindsay et al. some types of trust models have been proposed
    by them, which are the entropy-based model and the probabilistic trust model.
    Direct trust propagation is calculated in the entropy-based model and the probability
    of the multi-agent trust dissemination are calculated in the probabilistic model
    using the probability values[16].


