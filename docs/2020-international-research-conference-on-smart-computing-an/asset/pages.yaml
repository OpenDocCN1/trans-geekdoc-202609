    **Abstract:** Mobile adhoc networks (MANETs) play a vital role in the increasingly
    networked world where they have many applications in plenty including military,
    society, Vehicular Adhoc Networks (VANETs), and other intelligent systems. By
    the dynamic nature of mobile adhoc networks, they are often dejected to the various
    malicious attacks. Over the years, various trust mechanisms have been developed
    to ensure reliability and trust in MANET environment. Over the proposed solutions,
    Machine learning applications have yielded results. Based on this, a survey of
    trust-based approaches for mobile adhoc networks are presented. The focus of this
    study is to classify and evaluate the existing trust mechanisms and provide guidance
    for future research in the area.


    **Keywords:** Machine learning, Malicious attacks, Mobile adhoc Network (MANET),
    Trust, Vehicular Adhoc Network (VANET)


    # I. INTRODUCTION


    Because of the use of mobile devices, laptops, digital devices, and other IoT
    (Internet of Things), wireless communication mechanisms have become popular through
    the recent years. Mobile Adhoc Networks are one of the used class of wireless
    networks which have been extensively examined by the researchers in the area.


    But the major problem in MANETs is the security issue since it has some challenges
    in data transmission because of its vulnerabilities. By having wireless lines
    limited physical protection, autonomous behavior, mobility and lack of centralized
    infrastructure, the security of MANETs is more challenging to achieve[1].


    Also, level of trust varies upon the routing mechanism as well as the mobility
    models. There are set of mobility models defined Random Point Mobility Model is
    the most used model in MANETs.


    Specific routing protocols are defined in the context of MANETs such as AODV (On-hoc
    Demand- Trust), OLSR (Optimized Link State Routing), DSDV (Detection-Sequence-Direction-Source),
    Batman Protocol To Mobile Adhoc network[2].


    Although there are a lot of routing mechanisms, confirming the security of transferring
    data through a MANET, is a major problem due to the vulnerable nature of these
    networks where data can be missed or compromised. Since Trust is the major component
    that relies


    upon establishing reliable communication presents which have been done to enhancing
    the security of MANETs.


    This paper is a given comparative analysis through a critical analysis upon existing
    trust enhancement in MANETs and specifically focuses on the machine learning approaches
    and provides an idea for future research pathways.


    Section II provides an idea about Trust in the context of MANETs and also some
    description of basic MANETs. The challenges are as presented above with guidelines
    selecting suitable trust for MANETs based on trust properties. Machine Learning
    approaches for MANET trust are described in section IV and difference between
    the machine learning techniques from different perspectives. Section V gives a
    summary of the presented work and the future directions for researchers in the
    area.


    ![](img/f0d0bbd2b97f426c83fb011cd6b02a6d_0_0.png)


    # II. TRUST IN MANETS


    Trust is one of the most essential factors when providing security services. In
    the context of MANETs Trust can be declared as a characteristic which determines
    the accuracy of data received and transfer through specific node in the perspective
    of the other nodes[4]. Hence, a Trust Management mechanism is needed to establish
    security in a MANET by creating reliable trust which can be divided into several
    phases including classification of trust, discretion of trust, aggregation of
    trust, prediction and application of trust[4][5]. Figure 2 shows the primitive
    steps of the process of establishing trust in MANETs.'
