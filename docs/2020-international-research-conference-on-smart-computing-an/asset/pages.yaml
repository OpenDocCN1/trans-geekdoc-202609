    # A. Challenges in MANETs


    Establishing or building security services in MANETs is more challenging since
    these hoc networks have a considerable amount of vulnerabilities in the wired
    networks.


    +   a) Wireless ad hoc


    MANETs do not have a central infrastructure or any other fixed infrastructure.
    Because of the lack of such infrastructures, nodes in hoc networks replace the
    router, client and server. Also, the need to communicate through multi-hops and
    data packets needs to be travelling through different mobile nodes arriving at
    their destination. These may cause problems arise alike from mobility and the
    loss of data by travelling through malicious nodes [7].


    +   b) Unreliability of wireless links


    Since connectivity is based on wireless links, MANETs are more susceptible to
    malicious attacks such as eavesdropping, flooding, flushing, black-hole, wormhole
    attack. Because having lower bandwidth than wired networks and not having capacity
    to make an attack, attackers can exploit these features and cause a threat to
    the all mobile hoc environment [7].


    +   c) Mobility and dynamic network topology


    MANETs are consisting of a set of autonomous and highly mobile nodes where a new
    node/node can connect and existing nodes join or leave the network. As a result
    of this, MANETs have a changing topology. Because of such a dynamic, if security
    occurs, it is difficult to identify the responsibility of nodes for such malicious
    attack [6][7].


    +   d) Energy and bandwidth restriction


    Fig. 3. Challenges in MANETs


    # B. Trust properties of MANETs


    The following characteristics can be illustrated as the trust properties considering
    the unreliable and random nature of establishing communication links in MANETs.


    +   a) Dynamicity


    Due to constantly changing and the temptation of mobile MANET trust cannot be
    static, and it has to be dynamic which is changing [5][8].


    +   b) Subjectivity


    MANET trust is subjective because one of node have different values concerning
    another node where with the different experiences where the network is highly
    dynamic [5][8].


    +   c) Not Transitively In


    Trust in MANETs is not transitive which means having different trust values; node
    A, node B and node C where A A trust B and C; it does not ensure the expression
    A trust C. To use the trust of a trust, a node must consider the direct and indirect
    trust from the other nodes.


    +   d) Asymmetry


    When the heterogeneous Mobile hoc network environment trust is asymmetrical and
    not equal due to different capabilities such as with high computational power
    or battery capacity it is not going to trust another node of low capacities, but
    in a very manner node where having capabilities is enough to give trust with high
    capabilities [5][8].


    +   e) Context dependency


    MANET trust depends on context, which means different types of trust can be established
    considering energy consumption, selfish behavior, computational power or efficiency,
    the frequency of malicious attacks, etc such [5][8].


