    # A. Supervised learning approaches


    Support Vector Machines are one of the supervised learning algorithms which are
    widely utilized in clustering and classification purposes as cluster and classify
    the mobile nodes in a ad network into two classes as clusters and members has
    been proposed. The first classification is then done by making an SVM classifier
    to learn the results of the WCA (Weighted Clustering) reduces the time of clustering
    of VANETs, especially when the mobile nodes increase [27].


    +   An application of classification uses SVM vector machines to cluster and classify
    the mobile nodes in a ad network into two classes as clusters and members has
    been proposed.


    +   SVM best two approaches called SMART and SVM have been proposed upon mobile
    ad for trust automation and misbehavior detection. The advantages are performing
    well as the proposed mechanisms in the area, a larger fraction of adversaries.
    Furthermore, they are more resilient when the nodes are highly as well as detect
    mobile nodes that after their time behavior over [41].


    CEAP is a multi-decision intelligence model that models the nature of VANET (Vehicular
    Ad Hoc Networks). Vehicles are classified into smart and misbehavior vehicles
    by analyzing the data exchange between two vehicles using SVM and they proposed
    a routing protocol called VAN-QoS OLSR over the OLSR (Optimized Link State protocol)
    [42].'
