    **摘要—** EasyTalk 旨在帮助听障和言语障碍人士与他人进行交流。但并非所有人都能理解手语，因此需要一种翻译工具。斯里兰卡手语与听障及言语障碍者密切相关。该项目提供了
    EasyTalk 这一手语翻译器，它可以将斯里兰卡手语转换为文本和音频形式，并进行口语翻译，这将使交流困难的人士受益。在第一个组件中，手势检测器（Gesture
    Detector）使用预训练模型捕捉手手势。图像分类器对检测到的手进行分类。文本和语音生成器为检测到的手势生成输出。最后，文本到手语转换器负责将英文文本转换为手语。它能够以卓越的准确性翻译并产生结果。这可以实现该国家不同残障人士之间高效且有效的沟通。


    听障和言语障碍群体无法向普通人表达他们的感受。这个特殊群体需要手语来进行交流。遗憾的是，普通人并不了解手语，正如这个特殊群体不了解口语一样。在普通人与言语困难者之间建立沟通桥梁是不容忽视的。


    全球有 2.5 亿到 3 亿的人患有听力和语言障碍。如上述段所示，手语已被引入供人们与他人交流。手语并不是通用的，每个国家都有自己的手语。正因如此，可以使用手势、手部和动作、面部表情和动作来代替口头交流。手语不是通用的，且随国家而异，但也存在相似的手语。所有国家都有自己的手语，例如斯里兰卡手语、美国手语、英国手语。大多数时候，这些手语对于听障人士并不熟悉，他们无法与普通人交流。


    **关键词—** 机器学习、图像处理、分辨率无关识别、卷积网络、自然语言处理、实时翻译、语义分析、文本语音。


    # I. 引言


    沟通是全人类日常生活中最重要的方面。马尔可曾说：“沟通是人之间一种非常有意义的互动。具体来说，它是人类之间感知和理解意义的方式。”地球上的每种生物都有其独特的方式进行相互交流。人类的沟通通过各种类型的群体进行，通过信息流和相互理解，成为个人与群体之间的桥梁。人类总是使用语言将信息从一个人传递给另一个人。但最好的例子是那些无法通过口头交流的人，他们通常被称为听障和言语障碍群体，斯里兰卡也有一种独特的手语。当普通人对斯里兰卡手语（SSL）缺乏正确理解时，问题就会出现。在那里，双方都拒绝友好友好地交流，因为他们无法理解对方想说什么。为了解决这个问题并在普通人与言语及听障人士之间建立沟通桥梁，斯里兰卡发明了一些翻译器，特别是针对听力及言语系统的活动。最近的大多数发明表明，普通人能够从中获得最大收益。此外，他们还可以使用翻译器将斯里兰卡语翻译成自然语音或手语，这有助于通过单一引擎发现这两种翻译模式。


    通过 Nidhida 学习语言。该系统由三个主要部分组成，即3D 监控、动作跟踪和语音识别。使用 Nidhida，听障儿童可以根据输入的片段获得 2D 虚拟形象动画。该系统使用通过图像视频识别手语和特征的方法。由于整个系统中使用了不同的模型，听障儿童可以自我激励，分享他们的学习能力。


    本研究聚焦于一种基于斯里兰卡手语的实时翻译器，可以将斯里兰卡手语转换为文本或其他格式（如英文文本斯里兰卡语）。研究的目标是在斯里兰卡普通人与听/言障人士之间建立沟通纽带，同时为他们提供自学语言指南。


    # II. 背景与文献综述


    全球范围内与手语相关的搜索正在进行。中文、美国手语、锡语 [1] 是其中一些。手语检测有两种。一种是基于图像视觉的，另一种是基于设备的 [2]。特征识别、特征提取、处理和分类是由于预处理消除了无关元素。感兴趣区域（ROI），图像特征将进行提取并使用深度学习进行分类。


    考虑到基于设备的手识别，Gibson 和 Perez 使用 Kinect 传感器开发的斯里语系统 [5]。该系统使用实时色彩深度和动作跟踪技术。动态时间规整（DTW）算法被用于该系统以解释手势。他们使用了
    K 折验证方法。这种方法在测试模拟中证明了 90% 的平均准确率。Ahmed 及其团队使用了使用 Microsoft Kinect 的程序 [6]。他们使用了支持向量机（SVM）算法，并与之前的努力进行了比较。他们方法使用带有径基函数（RBF）内核的
    SVM 比线性内核具有更高的准确率。Deep 团队提出了一种使用动作跟踪的系统，在 520 个样本的数据集上获得了 99% 的准确率 [7]。


    分类器显示出 98% 的准确率。Nidhida Ridma [9] 是一位斯里兰卡翻译人员，为带有设备的听障儿童实施了该系统。由于这是一个基于游戏的学习系统，听障儿童通过
    Sandabha [11] 学习要容易得多。其主要目的是通过斯里兰卡听障应用程序提供许多任务、活动和新思想，帮助使用系统的听障用户的知识和教育。


    # III. 方法论


    ## A. 手势检测器


    该组件将实现在 TensorFlow 模型训练器上，并使用 RNN（递归卷积神经网络）。对于训练，每个斯里兰卡语言字母表 ([1]) 对应三张图像，总共 247
    张。首先，为类别创建一个映射。感兴趣的系统只有一个类别：无。


    为了实现成功的模型检测，训练后的图像被分为训练集和测试集，并使用标注工具以 Pascal VOC 格式进行标注，以获取可扩展的标记


