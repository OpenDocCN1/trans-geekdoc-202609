    |---|---|---|---||

    | welcome | welcome back | welcome back | 80 |

    | howaeroy | how are you | How are you | 78 |

    | Thisthisym | This is him | This is mine | 85 |

    | goodmorning | Good morning | Good morning | 80 |


    第二个主功能是“将英语转换为手语”（SL kan GIF）。这也是子功能之一——“命名句子识别”和“将符号显示为 GIF”。这种方法基于自然语言处理（NLP）。通过
    NLP，可以将文本翻译为更小的单元（单词或子词）。因此，EasyTalk 擅长翻译如“How are you?”之类的句子以及“Peter”之类的特定单词，将文本转换为手语更加经济高效，且翻译快速方便。


