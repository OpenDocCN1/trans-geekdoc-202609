    如上段所述，该系统有两个主要功能。第一个是“将斯里兰卡手语转换为文本/语音”。该主功能由三个子功能组成，即“手部检测”、“文本-音频生成”以及在 TensorFlow
    模型上使用 Faster RCNN 训练的手势检测。在成功训练后，模型被用于各种场景的测试。来自网络摄像头的输入流引导模型在任何复杂背景下检测手部，并显示最佳结果。Faster
    RCNN 的主要功能不仅是对图像进行分类，还能在实时流中检测多个物体（类别）。这被认为是即使在低分辨率下也能检测手部的最重要因素。此外，模型还通过网络摄像头的实时视频进行了测试。Faster
    RCNN 能够在上述场景下以高准确率检测出手部。


    ![](img/a307ac1d43b84fbb9357717d2a312dde_4_0.png)


    图4. 复杂背景下的手势识别


    下表 II 表示了数据采集组件在不同场景下手部图像检测的准确率。


    EasyTalk 的第二个组件是分类分类。，CNN 模型使用 26 个类别进行训练，每个类别有 250 张图像。在数据集中，85% 的样本用于训练，15%
    的样本用于测试。为了获得更好的训练效果，epochs 设置为 50，并使用每个类别的 38 个样本进行测试。


    # 各类别准确率


    # 表 II 手势检测准确率


    | 类别 | 准确率 (%) | 类别 | 准确率 (%) |

    |---|---|---|--|

    | A | 100 | N | 97 |

    | B | 100 | O | 97 |

    | C | 97 | P | 95 |

    | D | 100 | Q | 100 |

    | E | 100 | R | 92 |

    | F | 97 | S | 95 |

    | G | 100 | T | 97 |

    | H | 100 | U | 95 |

    | J | 95 | W | 100 |

    | K | 100 | X | 95 |

    | L | 100 | Y | 97 |

    | M | 95 | Z | 100 |


    | 测试场景 | 测试次数 | 平均检测准确率 (%) |

    |---|---|---||

    | 手部检测 复杂背景 | 20 | 93 |

    | 手部检测 - 明亮环境 | 20 | 92 |

    | 手部检测 黑暗环境 | 20 | 89 |

    | 来自大手掌的手势 | 20 | 95 |

    | 手部检测 翻转手部 | 20 | 87 |


    模型在测试阶段的准确率为 97%。即使对于手势，也存在一些细微的差异，这会在实时操作中产生问题。例如，“I”和“J”的符号相似，很难通过正向摄像头进行检测。识别方面的主要问题在于文本和音频生成部分，即用于将斯里兰卡手语转换为文本/音频的第
    3 个子功能。


    根据表 II 所示，模型在所有测试场景下的检测准确率为 91%。这远高于 80% 的准确率限制，被认为是该组件的最优方案。识别出的组件将作为图像帧发送到下一个组件，以匹配文本进行分类和翻译。与斯里兰卡手语翻译相比，证明
    EasyTalk 可以以高准确率处理手部。与其通过网络摄像头捕捉整个图像，EasyTalk 只专注于在相应场景下锁定手部图像。


    在这里，应用程序识别字母的单词段，并正确对每个部分进行深度检查。该定理用于识别字母集合中的单词段。再次，检查拼写错误的过程最终会生成用户喜欢的格式的文本。表
    IV 表示了文本和音频生成器的输出准确率。该组件在大多数场景下的准确率均高于 80%。这远高于 75% 的准确率限制，被认为是该组件的最优方案。


    此前考虑使用 Mask RCNN 来训练和检测网络摄像头流的手部。它是使用 500 张图像的数据集训练的。其主要缺点是 Mask RCNN 在检测图像流时性能较差。为了避免这种情况，在考虑速度后，决定使用
    Faster RCNN。


    # 各输入准确率


