    # V. CONCLUSION AND FUTURE WORKS


    In Sri Lanka, there is a lack of sign language tools compared to the users who
    need them and support of them during day-to-day communicating. This research paper
    describes how EasyTalk can be used in communication purposes translating Sri Lankan
    Sign Languages to text/audio formats as well as translating English to sign language.


    First, to detect the hands, Faster RCNN model based is trained and translates
    to show identified hands in a verbal language. This API can be used in future
    developments which are related to the sign languages. Developers do not have to
    build


    classification model from building. They can use this API with a valid data set.
    The Text and Voice Generator assists to identify the words segment from alphabets
    of then convert word to speak them. The applied NLP API and sign language. Also
    the implementation of a reverse engine can be used by the ordinary people to translate
    verbs into Sri Lankan language. This translator does convert the sign by user
    input GIFs of images using Semantic Analysis.


