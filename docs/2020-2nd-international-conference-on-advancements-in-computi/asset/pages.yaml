    **Abstract—** EasyTalk is designed to help hearing-paired and inarticulate people
    communicate with others. But not all are aware of sign language and a translation
    is needed. The Sri Lankan Sign Language is tightly bound to the hearing-paired
    and inarticulate. The project provides EasyTalk, a sign language translator which
    into text and audio forms as well as verbal language translation Sri Lankan Sign
    Language would benefit those who have difficulty in communicating. In the first
    component, Gesture Detector captures hand gestures using pre-trained models. Image
    classifier classifies the detected hands. The Text and Voice generator produces
    the output for detected signs. Finally, Text to Sign language converter works
    on converting an English text into sign language. It can then translate and produce
    results with superior accuracy. This can result in efficient and effective communication
    between the differently-abled people in the country.


    hearing-paired and inarticulate community can''t express their feelings with ordinary
    people. This special community needs sign language for communication purposes.
    Unfortunately, ordinary people are unaware of sign language as same as this special
    community unaware of verbal language. building a communication bridge between
    the ordinary and the people who have difficulty or to speak cannot be ignored.

    More than 250 to 300 million people around the world are with hearing and speaking
    disabilities. As mentioned in the above paragraph, sign language has introduced
    to people to communicate with others. Sign language is not universal and each
    country has its own sign language. Because of this, hand signs, gestures and movements
    of the hand, facial expressions, and movements can be used instead of oral communication.
    Sign language is not universal and varies with each country, there are also similar
    sign languages. All the countries have their own sign language such as Sri Lankan
    Sign Language[]. American Sign Language, British Sign Language. Most of the time
    these sign languages are not familiar to hearing and speaking disabilities cannot
    communicate with ordinary people.


    **Keywords—** machine learning, image processing, resolution independent recognition,
    convolutional networks, natural language processing, real-time translation, semantic
    analysis, text speech.


