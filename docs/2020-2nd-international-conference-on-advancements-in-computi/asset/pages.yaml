    # D. Text to Sign Converter


    Text to Sign Converter is used as a Sri Lankan Learning material for ordinary
    people. Through this component, users can get the relevant hand in real-time to
    convert text into sign language for verbs. Converting text with the support of
    various libraries in NLP[12] and semantic analysis [13]. More importantly, NLP
    is used to analyze, manipulate, and generate human language and Semantic Analysis
    is used to create a Graphical Interface Format (GIF) images using selected hands.
    The system design for this component is shown in Fig. 1.


    If there is any similar word, the system will get the relevant hand from the system
    database and refer back to the backend. Otherwise, the word will split into an
    array of characters and pass that to the system database. Once selects the relevant
    characters for the characters, system will consider them to order the characters
    back to the backend. After fully, using Semantic Analysis the system will generate
    GIF images for each word in the input and displays them to the user.


    # IV. RESULTS AND DISCUSSION


    This section details the experiment results conducted on building and making better
    communication between the ordinary people and hearing-impaired or visually impaired
    by introducing a translator for Sri Lankan Language in Lanka is the main objective
    of this research. High accuracy of the results to enable the users to understand
    the translation while dealing the loopholes in which a simple system was organized
    to recognize the knowledge level among Sri Lankan Language users to collect their
    suggestions and ideas about the sign language translators. The results of the
