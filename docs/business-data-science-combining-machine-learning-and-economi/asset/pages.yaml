  md: '![](img/315929ad4bddd26368466d02e06e2385_318_0.png)


    # ## Text as Data


    The modern business environment generates vast quantities of raw unstructured
    text. As the costs of storage drop and as more conversations and records move
    to digital platforms, we accumulate massive corpora that track communications,
    including customer conversations, product descriptions or reviews, news, comments,
    blogs, and tweets. For business decision-makers, this provides an opportunity
    to dive into customer relationships and understand marketplaces. The information
    in text is a rich complement to the more structured variables contained in a traditional
    transaction or customer database.


    Social scientists have also woken up to the potential of such data and recent
    years have seen an explosion in studies that make use of text as data. See Gentzkow
    et al. [2017] for an overview. In finance, text from financial news, social media,
    and company filings is used to predict asset price movements and study the causal
    impact of new information. In macroeconomics, text is used to forecast variation
    in inflation and unemployment and estimate the effects of policy uncertainty.
    In media economics, text from news and social media is used to study the drivers
    and effects of political slant. In marketing, text from advertisements and product
    reviews is used to study consumer decision-making. In the political economy, text
    from politicians'' speeches is used to study the dynamics of political agendas
    and debate.


    To analyze text, you need to transform it into data that can be input to numeric
    regression and factorization algorithms. This is almost always done'
  merge: -1
  img_proc: true
- pgno: 319
  md: "by mapping from the raw text to counts of words or phrases. We will begin this\
    \ chapter by outlining the process of *tokenization*, results of which are (very)\
    \ high-dimensional *x* matrices. These text matrices can be incorporated into\
    \ your analyses via methods we’ve already covered in this book (e.g., via lasso\
    \ regression). Indeed, working with text data is a great way to get more familiar\
    \ with modern statistical learning techniques. It is messy but also interpretable\
    \ (words have known meanings) and is high dimensional in a way that stumps classical\
    \ statisticians: as you accumulate more text data, the size of the vocabulary—your\
    \ model dimension—will also grow. You are never in the statistician’s safe space\
    \ of having many more observations than variables.\n\nWe will also cover a number\
    \ of text-specific techniques, including topic modeling and multinomial inverse\
    \ regression. However, the main message of this chapter is that with some standard\
    \ data science tools you can tap into the information contained in messy unstructured\
    \ text and use text as data in your business decisions.\n\n# TOKENIZATION\n\n\
    Raw text—the language that humans read—is an incredibly rich object. It is much\
    \ more than a sum of words. Meaning is built from ordered *sequences* of words\
    \ that refer to each other, often separated across sentences or paragraphs. However,\
    \ the vast majority of text analyses will ignore this complexity and rely solely\
    \ on *counts* for language *tokens*: words, phrases, or other basic elements.\
    \ Fortunately, a huge amount of information is contained in these simple counts.\
    \ The lesson of the past 30 years has been that, for prediction and classification\
    \ with text, it is difficult to make effective use of any statistics other than\
    \ simple word counts. This is quickly changing with the commoditization of deep\
    \ learning techniques (see **Chapter 10**). However, for data science and business\
    \ analytics the bulk of text-as-data applications will continue to incorporate\
    \ word and phrase counts for the foreseeable future—token-based learning is just\
    \ too fast and effective to be made redundant, especially when you don’t have\
    \ a huge number of documents to train against.\n\nConsider a little Shakespeare:\n\
    \n> *All the world’s a stage,*  \n*and all the men and women merely players;*\
    \  \n*they have their exits and their entrances,*  \n*and one man in his time\
    \ plays many parts . . .*"
  merge: -1
  img_proc: true
- pgno: 320
  md: 'Powerful and poetic. What the data scientist sees is more pedestrian. For example,
    we might just count some key terms and represent the snippet as a numeric vector
    $x$:


    world stage men women play exit entrance time

    1 1 2 1 2 1 1 1


    This is the *bag-of-words* representation of text. More precisely, the bag-of-words
    representation treats documents as if they were constructed by randomly drawing
    words with-replacement from a bucket containing the fixed vocabulary. By summarizing
    a document in terms of word counts, we are throwing away all information relevant
    to any more complex processes of document construction. The advantage of this
    approach is its simplicity: you can characterize relationships between language
    and outside variables (e.g., authorship or sentiment) by building a model for
    word probabilities.


    There are many possible algorithms for going from raw text to a summary token-count
    vector $x$. A basic recipe first removes the following:


    +   Overly common or rare words

    Isolated punctuation (, but not `:-)`) and numbers

    Common suffixes like $s$ or $ing$


    You then count the remaining tokens (words or other elements separated by whitespace).
    The reason for doing the pruning before counting is computational and statistical
    efficiency: you want to only store and model the tokens that are important for
    the task at hand.


    You should strive for a light touch in each of these steps. Since you''re going
    to be using regularization and selection techniques in your text models, you don''t
    need to be overly worried about including too many tokens. Words that are junk
    for one purpose might be crucial for another. For example, overly common words
    like $if$ or $but$ are called *stop words*; the frequency of $the$ in a document
    likely says little about the author''s sentiment, so in many applications it can
    be dropped. However, in other applications these common words can indicate a specific
    author''s writing style. The classic work of Mosteller and Wallace [1963] uses
    counts for common words to classify authorship for disputed federalist papers.²
    Similarly, punctuation is probably fine for removal when analyzing news articles
    or literature, but it provides important signals on meaning and sentiment in online
    corpora such as Twitter:`:-`).


    Exclusion of rare words is a necessary evil—these words are likely rich in meaning
    (they are rare and hence not generic) but you observe so few of them'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'that you cannot hope to learn much about their meaning. As you accumulate more
    data, you can keep words that are more rare. Culling rare words is also an effective
    way to reduce the cost of computation. We will typically remove all words that
    are not in at least $N$ documents, where $N$ is some intuitive minimum threshold.
    It is good practice to make sure that the results don''t change if you make small
    adjustments to this threshold.


    Stemming is the process of cutting words to their root—for example, tax from taxing,
    taxes, taxation, or taxable. When you remove simple suffixes, such as s and ing,
    you are doing a sort of basic stemming. Many more sophisticated options are available,
    such as the Porter stemmer for English. However, these tools are often overly
    aggressive. They reduce words with distinct meaning to a shared root. As we advised
    for the rare and common token removal, it is best to avoid cutting too much and
    let the statistical learning tools sort through any extra vocabulary elements.


    There are many other possible tokenization steps beyond those listed here. See
    Gentzkow et al. [2017] or the text [3] by Jurafsky and Martin [2009] for more
    thorough reviews. One common strategy is to count $n$-grams, or combinations of
    $n$ words, rather than single “unigrams” (what we''ve been counting thus far).
    For example, the Shakespeare bigrams include world . stage, stage . men, men .
    women, and women . play. Our knowledge of natural language leads us to expect
    such bigrams to be useful—very . good and very . bad are very different. However,
    moving from unigrams to bigrams massively increases vocabulary dimension. In practice,
    it is seldom worth the computational effort.


    I often use Python to parse documents. Figure 8.1 shows one of my simple text
    cleaners. Python, especially Python 3, makes it really easy to work with non-ASCII
    character sets (e.g., including foreign language or emoticons). There is also
    a large ecosystem of tools built on top of Python that facilitate tokenization
    and text analysis (e.g., gensim). If you are working with a lot of raw text, you
    will likely want to add Python programming to your repertoire.'
  merge: -1
  img_proc: true
- pgno: 322
  md: "```\n```py\nimport re\n\ncontractions = re.compile(r\"'| -|\\\"\"\n# all non\
    \ alphanumeric\nsymbols = re.compile(r'(\\W+)', re.U)\n# single character removal\n\
    singles = re.compile(r'(\\s\\S\\s)', re.I|re.U)\n# separators (any whitespace)\n\
    seps = re.compile(r'\\s+')\n\n# cleaner (order matters)\ndef clean(text):\n  \
    \  text = text.lower()\n    text = contractions.sub('', text)\n    text = symbols.sub(r'\
    \ \\1 ', text)\n    text = singles.sub(' ', text)\n    text = seps.sub(' ', text)\n\
    \    return text\n```\n```\n\nFIGURE 8.1: A basic tokenizer function written in\
    \ Python. The `re.compile` lines each create text objects that are searched for\
    \ and removed in the `clean (text)` function. This function will return a stream\
    \ of standardized tokens separated by whitespace.\n\nIt is also possible to use\
    \ R for tokenization. Despite being a little clumsy for exotic characters and\
    \ Unicode, the `tm` library wraps together a number of useful functions for text\
    \ analysis and parsing. File input with `tm` works via reader functions: you use\
    \ `tm` tools to define a function that scans through documents and reads their\
    \ content into R. For example, we can create a reader for `pdf` files and apply\
    \ it to the lecture slides from my big data course (available via the book's website)."
  merge: -1
  img_proc: true
