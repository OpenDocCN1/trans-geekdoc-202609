- pgno: 333
  md: '# **ALGORITHM 22** PCA for Big Sparse Data


    As a practical aside, note that `prcomp` converts x here from sparse to dense
    matrix storage. For really big text DTMs, which will be very sparse, this will
    cause you to run out of memory. A big data strategy for PCA is to first calculate
    the covariance matrix for x and then obtain PC rotations as the *eigenvalues*
    of this covariance matrix. The first step can be done using sparse matrix algebra.


    ```

    ```text

    > xm <- colMeans(x)

    > xx <- crossprod(x) # X''X

    > xvar <- xx/nrow(x) - tcrossprod(xm) # covariance matrix

    ```

    ```


    The rotations are then available as `eigen(xvar, symmetric=TRUE)$vec`. There are
    also approximate PCA algorithms available for fast factorization on big data.
    See, for example, the *irlba* package for R.


    The approach of using PCA to factorize text was common before the 2000s. Versions
    of this algorithm were referred to under the label *latent semantic analysis*.
    However, this changed with the introduction of *topic modeling*, also known as
    Latent Dirichlet Allocation₆ (LDA), by Blei et al. in 2003. These authors pointed
    out that the squared error loss (i.e., Gaussian model) implied by PCA is inappropriate
    for analysis of sparse word-count data. Instead, they proposed you take the bag-of-words
    representation seriously and model token counts as realizations from a *multinomial*
    distribution. That is, they proposed topic models as a multinomial factor model.


    Topic models are built on a simple document generation process:


    +   - For each word, pick a “topic” $k$. This topic is *defined* through a probability
    vector over words, say, $\theta_k$ with probability $\theta_{kj}$ for each word
    $j$.

    - Then draw the word according to the probabilities encoded in $\theta_k$ .


    After doing this over and over for each word in the document, you have proportion
    $\omega_{i1}$ from topic 1, $\omega_{i2}$ from topic 2, and so on.


    This basic generation process implies that the full vector of word counts, $x_i$,
    has a *multinomial factor distribution*:


    $$\mathbf{x}_{i} \sim \mathrm{MN}(\omega_{i1}\boldsymbol{\theta}_{1} + \ldots
    + \omega_{ik}\boldsymbol{\theta}_{k}, m_{i}). \tag{8.1}$$'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'Here, $m_{i}=\sum_{j} x_{i j}$ is the total document length and, for example,
    the probability of word $j$ in document $i$ will be $\sum_{k} \omega_{i k} \theta_{k
    j}$.


    Recall our PCA factor model:


    ```

    $\mathbb{E}\left[\boldsymbol{x}_{i}\right]=v_{i 1} \boldsymbol{\varphi}_{1}+\ldots
    v_{i k} \boldsymbol{\varphi}_{k} .$(8.2)

    ```


    The analogous topic model representation, implied by Equation 8.1, is


    ```

    $\mathbb{E}\left[\frac{\boldsymbol{x}_{i}}{m_{i}}\right]=\omega_{i 1} \boldsymbol{\theta}_{1}+\ldots+\omega_{i
    k} \boldsymbol{\theta}_{k} .$(8.3)

    ```


    such that topic score $\omega_{i k}$ is like PC score $v_{i k}$ and $\theta_{k}$
    topic probabilities are like rotations $\varphi_{k}$. The distinction is that
    the multinomial in Equation 8.1 implies a different loss function—a multinomial
    deviance—than the sums of squared errors that PCA minimizes. Also, $\omega_{i}$
    and $\theta_{k}$ are probabilities so that all of these vectors are forced to
    sum to 1. Note that we condition on document length here so that topics are driven
    by relative rather than absolute term usage.


    Topic models have been adopted instead of PCA for text because they tend to lead
    to more easily interpretable factorization. Interpretation remains subjective
    and messy, but a large industry of exploratory analysis has grown up around mostly
    plausible interpretations of fitted topic models. There are many extensions of
    the original framework (e.g., “dynamic” models $^{7}$ where topics are allowed
    to change slowly in time), but the classic topic model remains a dominant tool
    for unsupervised dimension reduction for text.


    Topic model estimation is a difficult and computationally intensive task—the optimization
    problem involved is much harder than that solved during PCA. However, this is
    a problem that many have worked on and there are plenty of efficient algorithms
    available. If you are working in Python, the gensim library implements the fast
    and memory-efficient stochastic gradient descent (SGD) routine of Hoffman et al.
    [2013], which streams data during estimation rather than loading it into memory
    as a block. $^{8}$ For R users, the maptpx package $^{9}$ implementing the algorithm
    from Taddy [2012] is a fast and stable option for data that is not too big to
    fit in memory.


    To work with maptpx, you need first to migrate your sparse matrices from the Matrix
    to slam package formats. Fortunately, slam has a function to facilitate this.
    Once we have the DTM in the correct format, we just give it to the topics function
    from maptpx along with a specified K, the number of topics:'
  merge: -1
  img_proc: true
- pgno: 335
  md: '```

    x <- as.simple_triplet_matrix(we8thereCounts)

    tpc <- topics(x,K=10)

    ```


    Here, we’ve fit a ten-topic model. You can also give `topics` a range of $K$ values
    and let it choose the best number using a *Bayes factor* (BF) criterion that is
    closely related to the BIC. The BF is proportional to the *posterior model probability*
    approximated by $\exp[-\mathrm{BIC}]$, so whereas you want to minimize the BIC,
    you will want to maximize the BF.


    ```

    > tpcs <- topics(x,K=5*(1:5))

    Estimating on a 6166 document collection.

    Fit and Bayes Factor Estimation for K = 5 ... 25

    log BF( 5 ) = 86639.7

    log BF( 10 ) = 99317.15

    log BF( 15 ) = 13398.18

    log BF( 20 ) = -55807.93

    > dim(tpcs$omega)

    [1] 6166   10

    ```


    Given $K$ of 5, 10, 15, 20, or 25, `topics` chooses$_{10}$ the BF maximizing $K=10$.
    I have generally advised against putting too much faith in this sort of selection
    for unsupervised models. However, since topic models are so expensive to fit,
    it is convenient to have a fast search strategy. In my experience, the BF maximization
    in `maptpe` finds $K$ that will perform well for a variety of downstream tasks,
    although it does sometimes tend to select $K$ smaller than we would like for storytelling
    purposes. If you are going to use the topics as inputs to a lasso regression,
    analogous to the lasso PCR, then you can use a larger $K$ and let the lasso choose
    the ones it needs.


    Interpretation for topics proceeds the same as for PCA; you work from bottom up
    and top down to build a narrative. Bottom up, you look at “top” words for each
    topic. For this to work, you need to take care in how you order words when looking
    at the “top.” Ordering words by topic probability, $\theta_{ki}$, will yield top
    words that are common in topic $k$ but, potentially, also common in other topics
    (especially when you’ve cut only a small set of stop words). Instead, the `summary`
    function in `maptpe` orders words by *lift*—the probability of word $j$ in topic
    $k$ divided by its aggregate probability:


    $\mathrm{lift}_{jk} = \theta_{jk} / \bar{q}_{j}$'
  merge: -1
  img_proc: true
