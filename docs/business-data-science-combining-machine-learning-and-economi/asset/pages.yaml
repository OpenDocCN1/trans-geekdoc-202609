    # # MULTINOMIAL LOGISTIC REGRESSION


    We’ve established that good classification starts from good probability models.
    For binary classification, you can use a binary logistic regression to build your
    probability models. In *multiclass* problems, where the response is one of K “categories,”
    you can build a similar generalized linear model formulation.


    First, we need to rewrite the multiclass response as the length-K binary vector
    $y_{i}=[0,1,\dots,0]$, where $y_{ik}=1$ if response $i$ is class $k$. Then, following
    the generic linear model formulation of Equation 2.1, from way back in **Chapter
    2**, we need to model the following:


    ```

    $$\mathbb {E} [ \mathbf { y } _ { i } | \mathbf { x } _ { i } ] = \mathbf { p
    } ( y _ { i k } = 1 | \mathbf { x } _ { i } ) = f ( \mathbf { x } _ { i } ^ {
    \prime } \mathbf { B } ) \text { for } k = 1 \ldots K .$$

    ```


    Here, $B = [ \boldsymbol { \beta } _ { 1 } \cdots \boldsymbol { \beta } _ { K
    } ]$ is a *matrix* with columns of coefficients for each outcome class. The extension
    of logistic regression that works nicely for this purpose is *multinomial logistic
    regression*, with probability modeled as


    ```

    $$\mathbf { p } ( \mathbf { y } _ { j } = 1 | \mathbf { x } ) = \mathbf { p }
    _ { j } ( \mathbf { x } ) = { \frac { e ^ { \mathbf { x } ^ { \prime } \boldsymbol
    { \beta } _ { j } } } { \sum _ { k = 1 } ^ { K } e ^ { \mathbf { x } ^ { \prime
    } { \boldsymbol { \beta } } _ { k } } } } .$$

    ```


    The link function here, $e _ { j } / \sum _ { k } e _ { k }$, is the multinomial
    logit. In ML it is often called a *softmax* function, and it is the most common
    way to translate from real values (e.g., $\mathbf { x } _ { i } ^ { \prime } \boldsymbol
    { \beta } _ { k }$) to probabilities. You might see it elsewhere specified with
    denominator $1 + \sum _ { k } e ^ { \mathbf { x } ^ { \prime } { \boldsymbol {
    \beta } } _ { k } }$, which corresponds to setting a “reference” outcome class
    where $\boldsymbol { \beta } _ { j } = \mathbf { 0 }$. As was the case for factor
    reference levels, this is an artifact of maximum likelihood estimation (you need
    to restrict the space of variables to get a well-defined maximum), and the issue
    disappears with regularization.


    For multinomial distributions, the likelihood is simple. Given probabilities $p
    _ { i k }$ for $y _ { i k } = 1$, the probability of the observed data is proportional
    to'
