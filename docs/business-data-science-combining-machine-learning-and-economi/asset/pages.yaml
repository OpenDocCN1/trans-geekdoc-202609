  md: 'A more subtle issue is that of *autocorrelation*. Consider the residuals for
    the passenger regression shown in **Figure 2.15**. There appears to be stickiness
    in the series: when residuals are high in one month, they are often high the next
    month. The errors appear correlated in time, such that $\varepsilon_{t}$ is related
    to $\varepsilon_{t-1}$. That relationship violates our basic *independence* assumption,
    which holds that $\varepsilon_i \perp\!\perp \varepsilon_j$ for all $j \neq i$.


    ![](img/315929ad4bddd26368466d02e06e2385_99_0.png)


    FIGURE 2.15: Log-count residuals from our passenger regression.


    This phenomenon is called *autocorrelation*: correlation with yourself. Time-series
    data is simply a collection of observations gathered over time. For example, suppose
    $y_1 \dots y_T$ are weekly sales, daily temperatures, or five-minute stock returns.
    In each case, you might expect what happens at time $t$ to be correlated with
    time $t - 1$. For example, suppose you measure temperatures daily for several
    years. Which would work better as an estimate for today''s temperature:


    +   - The average of the temperatures from the previous year?

    - The temperature on the previous day?


    In most cases, yesterday''s temperature is most informative. That means you view
    the *local* dependence as more important than the broad annual pattern.


    You can summarize dependence with an autocorrelation function (ACF) that tracks
    “lag-$l$” correlations:


    $\mathrm{acf}(l) = \mathrm{cor}(\varepsilon_t, \varepsilon_{t-l}).$


    (2.32)'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Figure 2.16 shows the ACF for our airline regression residuals. It confirms
    our visual inspection of the residual time series: there is significant dependence.
    The correlation between $y_{t}$ and $y_{t-1}$ is around 0.8, which is pretty huge.


    ![](img/315929ad4bddd26368466d02e06e2385_100_0.png)


    FIGURE 2.16: ACF for the residual time series shown in Figure 2.15. Note that
    acf (0) = 1 because this is the correlation between $y_{t}$ and itself. The dashed
    lines are heuristics for “big” correlations.


    How do you model this type of data? Consider a simple cumulative error process:


    ```

    $$ \begin{aligned} y_{1} & = \varepsilon_{1}, \\ y_{2} & = \varepsilon_{1}+\varepsilon_{2},
    \\ y_{3} & = \varepsilon_{1}+\varepsilon_{2}+\varepsilon_{3}+\ldots \end{aligned}
    $$

    ```


    Each $y_{t}$ is a function of every previous observation all the way back to time
    zero. Fortunately,


    ```

    $$ y_{t}=\sum_{i=1}^{t} \varepsilon_{i}=y_{t-1}+\varepsilon_{t} $$

    ```


    so all you need to know to predict at $t$ is what happened at $t-1$. More specifically,
    in this process we have $\mathbb{E}[y_{t} | y_{t-1}]=y_{t-1}$. This is called
    a random walk model for $y_{t}$ : the expectation of what will happen is always
    what happened most recently.


    Random walks are one version of a general autoregressive (AR) model. In an autoregressive
    model of order 1, the following holds:'
