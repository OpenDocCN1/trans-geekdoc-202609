    More generally, the tools facilitating distributed computing are rapidly improving.
    One prominent system is Spark, a layer built on top of Hadoop that makes it easier
    to incorporate machine learning and statistical algorithms (especially iterative
    algorithms that need to touch the data repeatedly). Spark tries to organize the
    process so that results and data can stay “in memory” on each machine until you
    are done (instead of writing to hard disk, which is really slow). More recently,
    even friendlier layers are being built on top of Spark. For example, SparkR facilitates
    the use of R as a front end to a Spark cluster of distributed machines, and companies
    like Microsoft offer cloud computing platforms that will organize your data storage
    and allow you to interact with it through a web-based R server.


    A full technical guide to Spark or Hadoop is beyond the scope of this text, but
    there is abundant training material available, and you need to be broadly aware
    of how data distribution works if you are going to interact with big data. The
    new mantra of scaling is always “build out, not up.” In other words, focus on
    more machines, not just faster machines. Fortunately, all of this is getting closer
    to the nonein gineering mainstream and easier to use every day. The best practices
    that you learn in this text—how to think about model building, prediction, causation,
    and validation—will keep you safe when modeling even if the data is distributed
    across the globe.


