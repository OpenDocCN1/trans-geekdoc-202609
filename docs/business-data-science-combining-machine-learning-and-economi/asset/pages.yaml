    The 90% CI for the probability that Edmonton scored is 52% to 53%.


    In this example, we were able to use sample splitting to get a confidence interval
    for a predicted value, $\hat{y} = e^{x^{\top}\hat{\beta}}/(1+e^{x^{\top}\hat{\beta}})$,
    where the vector of covariates $\boldsymbol{x}$ includes only the preselected
    *subset* of variables from the full input space, $\boldsymbol{x}$. In the first
    stage we select a set of useful covariates, and in the second stage we quantify
    uncertainty for regression conditional on use of these specific covariates. As
    Economist Guido Imbens says in this context, we have “moved the goal posts.” This
    is justified because the model selection outcome (determining which coefficients
    are zero or nonzero) is not the primary object of interest—it is a *nuisance*
    that we can treat as given when we deploy the fitted prediction model. Sample
    splitting is *not* appropriate for quantifying uncertainty about individual coefficients
    that are subject to model selection. For example, if some $\hat{\beta}$ coefficient
    on $x_{ij}$ is set to zero in the presample lasso, then sample splitting doesn’t
    give you any way to quantify the uncertainty about this decision.


    Sample splitting is a great method for dealing with high-dimensional controls
    because the effects of these controls are *nuisance functions*. They are not the
    primary object of interest; you just want to remove them from estimates of the
    treatment effect in a conditional ignorability model. The *Orthogonal MLs* framework
    of Chernozhukov et al. [2017a] provides a general recipe for use of sample splitting
    with high-dimensional controls. Their approach is easy to apply in the context
    of the LTE model in Equation 6.2: the nuisance functions are the expectations
    for treatment and response given controls, $\mathbb{E}[d|x]$ and $\mathbb{E}[y|x]$,
    and after estimating each of these on an auxiliary sample, you can use out-of-sample
    residuals as the basis for the treatment effect estimation. They also provide
    a clever *cross-fitting* algorithm'
  merge: -1
  img_proc: true
- pgno: 245
  md: "that allows you to use all of your data in the final treatment effect estimation\
    \ (instead of throwing half away, like we did in the sample splitting earlier).\
    \ The full algorithm, which is a sort of cross validation adapted for estimation\
    \ rather than prediction goals, is outlined in Algorithm 15.\n\n# **ALGORITHM\
    \ 15**  Orthogonal ML for LTE\n\nSplit the data into $K$ random and roughly equally\
    \ sized folds.\n\n+   i. *Nuisance estimation:* For $k = 1 \\dots K$:\n\t- Use\
    \ your ML tools of choice to fit the prediction functions,\n\n```\n$$\\hat{\\\
    mathbb{E}}_{k}[d | \\boldsymbol{x}] \\text{ and } \\hat{\\mathbb{E}}_{k}[y | \\\
    boldsymbol{x}],$$\n```\n\n```\n(6.9)\n```\n\nusing all data *except* for the $k$th\
    \ fold.\n\n+   - Calculate out-of-sample residuals for these fitted prediction\
    \ functions on the $k$th fold:\n\n```\n$$\\vec{d}_{i} = d_{i} - \\hat{\\mathbb{E}}_{k}[d_{i}\
    \ | \\boldsymbol{x}] \\text{ and } \\vec{y}_{i} = y_{i} - \\hat{\\mathbb{E}}_{k}[y_{i}\
    \ | \\boldsymbol{x}] \\text{ for } i \\text{ in fold } k.$$\n```\n\n```\n(6.10)\n\
    ```\n\n+   ii. *Treatment effect inference:* Collect all of the OOS residuals\
    \ from the nuisance stage, and use OLS to fit the regression:\n\n```\n$$\\mathbb{E}[\\\
    vec{y} | \\vec{d}] = \\alpha + \\vec{d}\\gamma.$$\n```\n\n```\n(6.11)\n```\n\n\
    The resulting $\\hat{\\gamma}$ estimate can be paired with heteroskedastic consistent\
    \ standard errors (via vcovHC) to obtain a confidence interval for the treatment\
    \ effect.\n\nA function to execute Algorithm 15 takes in two arbitrary regression\
    \ models, for fitting each of $\\mathbb{E}_{k}[d | x]$ and $\\mathbb{E}_{k}[y\
    \ | x]$, and outputs the results of the final residuals-on-residuals regression:"
