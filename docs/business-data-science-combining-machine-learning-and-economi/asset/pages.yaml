    ```

    > sort(samp_b) [1:10]

    [1] 1 1 2 2 4 4 5 7 8 9

    ```


    Figure 1.4 shows the resulting bootstrap estimate of the sampling distribution.
    We see that it matches closely with the theoretical Gaussian sampling distribution
    that is implied by the central limit theorem (and the bootstrap standard deviation
    of 80 matches the theoretical standard error). This makes sense: we have a large
    sample ($n = 10,000$) and are targeting a simple statistic ($\bar{x}$), so the
    CLT applies and the theoretical distribution is correct. The advantage of the
    bootstrap is that it will work in many settings where this theory is unavailable
    or incorrect.'
