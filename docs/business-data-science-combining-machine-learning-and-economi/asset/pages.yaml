  md: 'Recall the simple stylized loan example from earlier, where you loan \$100
    and are paid \$125 in the case of repayment (but lose \$100 in default). With
    $ p $ the probability of default, the expected loss will be negative (i.e. you
    will expect to make a profit) if the following is true:


    ```

    $$-25 \cdot (1 - p) + 100 \cdot p < 0 \quad\quad p < \frac{25}{125} = \frac{1}{5}$$

    ```


    Hence, the cutoff for a no-loan versus loan decision would be at $ p = 0.2 $.


    Applying this $ p = 0.2 $ rule with the German credit model and data, we find
    in-sample estimates of the FPR and FNR. The results show a false positive rate
    of 0.61 (so that 61% of the people who you denied loans would have paid you back)
    and a false negative rate of 0.07 (only 7% of your loans will end in default).


    ```

    ## false positive rate

    > sum( (pred < rule) [default == 0] ) / sum( pred > rule)

    [1] 0.6059744

    ## false negative rate

    > sum( (pred < rule) [default == 1] ) / sum( pred > rule)

    [1] 0.07744108

    ```


    For comparison, a $ p = 0.5 $ cutoff yields FPR = 0.32, FNR = 0.25. Our derived
    decision rule leads to far more false positives than negatives because you’ve
    put a higher cost on defaults.


    In the case of FPR and FNR, your errors are normalized by the number of examples
    that you’ve classified a certain way (e.g., false positives over the number *classified*
    as positive). Another common summary for classification errors instead normalizes
    against the number of *true* examples in each class:


    *sensitivity*: proportion of true $ y = 1 $ classified as such.


    *specificity*: proportion of true $ y = 0 $ classified as such.


    A rule is sensitive if it predicts $ \hat{y} = 1 $ for most $ y = 1 $ observations.
    It is specific if it predicts $ \hat{y} = 0 $ for most $ y = 0 $ observations.
    In the German credit example, our $ p = 0.2 $ cutoff rule is sensitive (92%) but
    not specific (only 39%).'
