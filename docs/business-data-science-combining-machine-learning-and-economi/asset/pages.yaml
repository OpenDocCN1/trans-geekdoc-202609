    RANDOM FORESTS ARE A BIG DATA TECHNIQUE. It just might not seem that way when
    fitting them on your laptop. Without making use of parallelization, the sequential
    fitting of trees will take a long time. However, forests are all about big data!
    They work on massive distributed datasets and can be deployed on industrial scale.
    You just need to make use of the parallel and'
  merge: -1
