  md: '![](img/315929ad4bddd26368466d02e06e2385_361_0.png)


    Moving to an example with real-valued response (i.e., a “regression tree”), we
    consider predicting $projected\ engagement$ (PE) from $ratings$ and $genre$. Recall
    that PE measures how much a viewer is able to recall from the show in a post-viewing
    survey. To make our life easy when plotting, we’ll create our own design matrix
    by turning it into a group of numeric variables (otherwise the `text` function
    gives funny labels for our factor input, genre).


    ```

    ```

    > x <- as.data.frame(model.matrix(PE ~ Genre + GRP, data=nb), [-1])

    > names (x) <- c("reality", "comedy", "GRP")

    > nbtree <- tree(nb$PE ~ ., data=x, mincut=1)

    ```

    ```


    Figure 9.3 shows the results. Since the input space is so simple here (one continuous
    input and one factor input), we can visualize the response surface. Figure 9.3
    illustrates the translation from the dendogram to the predicted $\hat{y}$ values
    for each show. Note the automatic interaction detection; for example, the relationship
    between GRP and PE depends upon genre.'
