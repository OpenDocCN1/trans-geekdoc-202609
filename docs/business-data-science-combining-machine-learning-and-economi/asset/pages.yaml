  md: 'that users spend on various websites. That is, we seek to predict consumption
    from browser history. We will use a log-linear model,


    $$ \log(\mathrm{spend}) = \alpha + \boldsymbol{\beta}'' \boldsymbol{x} + \varepsilon.
    \tag{3.5} $$


    Here, $x$ is the vector of site-visit percentages. This model could, for example,
