- pgno: 262
  md: 'Turning to HTE modeling, we will consider the bag-of-words representation of
    the UPC description text as a source of heterogeneity. 19 Recall that if you have
    run an experiment and have randomized treatments HTE modeling is as easy as running
    the regression in Equation 6.12. We don''t have an experiment here, but we learned
    earlier that orthogonal ML yields treatment residuals, $\mathbf{\tilde{d}}_i$,
    that are essentially random under the conditional ignorability assumption. The
    response residuals, $\tilde{y}_i$, have also had the effect of the controls removed.
    Hence, after running Algorithm 15, we can obtain HTE estimates for covariates
    $\mathbf{x}$ by running the regression


    $\mathbb{E}[\tilde{y}_i|\mathbf{\tilde{d}}_i,\mathbf{x}_i]=\alpha+\tilde{\mathbf{d}}_i''\gamma_0+(\tilde{\mathbf{d}}_i\times\mathbf{x}_i)''\mathbf{\gamma}\tag{6.17}$


    and calculating the HTEs for each observation as in Equation 6.13. 20


    Note that, despite our reuse of $\mathbf{x}$ notation, the sources of heterogeneity
    don''t need to be the same as the full set of controls. Indeed, it is typical
    to use only a subset of the full controls as potential sources for heterogeneity.
    21


    To fit the regression in Equation 6.17, we create a design matrix that includes
    the bag-of-words matrix plus an intercept for $\gamma_0$.


    ```

    > xhte <- cBind(BASELINE=1, descr[ wber$UPC, ])

    ```


    We then use gamlr to fit an AICc lasso for the regression in Equation 120.


    ```

    > dm1hte <- gam1r(x=xhte[ss,]*resids$dtil,

    + y=resids$ytil,

    + free=1, standardize=FALSE)

    ```


    All we''ve done here is replace the OLS step from the end of Algorithm 15 with
    a lasso regression that interacts residuals with covariates. The resulting elasticities
    are plotted in Figure 6.3, and we can print some of the largest sources of heterogeneity.'
  merge: -1
  img_proc: true
