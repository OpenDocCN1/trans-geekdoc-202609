  md: 'digital marketing in other cases, especially when the advertiser is not well
    known or would not occur in the organic results.


    If the clustered standard errors are unintuitive, note that you can get a similar
    result by *controlling* for the DMA-specific revenue levels in the regression
    mean equation itself. That is, you replace Equation 5.13 with a model including
    DMA-specific intercepts (i.e., what economists would call “DMA fixed effects”):


    $\mathbb{E}[y_{it}] = \alpha_i + d_{it}\beta_d + t\beta_t + \gamma d_{it}. \qquad\qquad\qquad\qquad\qquad\qquad
    (5.14)$


    Since we’re now assuming independence conditional upon the DMA-specific levels,
    the usual regression standard errors apply.


    ```

    > dmareg <- glm(y ~ dma + d*t, data=semavg)

    > summary(dmareg)$coef[“d: t”,]


    Estimate Std. Error t value Pr(>|t|)

    -0.006586852 0.005571899 -1.182155571 0.238493640

    ```


    The estimates for $\gamma$ and its standard errors are practically unchanged from
    our earlier regression analysis using clustered standard errors.


    Our derivation and analysis here should convince you that the diff-in-diff procedure
    is just an example of applied regression modeling. However, the estimator is often
    presented in an alternative formulation that takes advantage of the *pairing*
    between pre- and post-treatment observations. In this form, you would first calculate
    the sample of pre-post *differences* for each DMA:


    $r_i = y_{i1} - y_{i0} \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad
    (5.15)$


    You then collect the average difference for the treated and control groups, say
    $-r_1$ and $-r_0$, and use the difference between these averages as the ATE estimate,
    as shown here:


    $\hat{\gamma} = \bar{r}_1 - \bar{r}_0 \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad
    (5.16)$


    This routine is the source of the “difference in differences” name. Independence
    between DMAs implies independence for each $r_i$, and you can apply the usual
    formula to get the standard error for a difference in means: $\text{se}(\hat{\gamma})
    = \text{se}(\bar{r}_1) + \text{se}(\bar{r}_0)$.'
