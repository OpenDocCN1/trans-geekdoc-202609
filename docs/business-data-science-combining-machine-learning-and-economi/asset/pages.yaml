  md: 'N = total # tests, $N_0$ = # that are Null.


    Say $R(u)$ is total to $p$-value $\le u$, & $r(u)$ is # Null to $p \le u$.


    A cut-off equivalent to BH is


    $$u^* = Max\left\{u: u \le q\frac{R(u)}{N}\right\}$$


    and thus $\frac{1}{R(u^*)} \le \frac{q}{Nu^*}.$


    $$\Rightarrow\text{ FDF in }\frac{r(u^*)}{R(u^*)} \le q\frac{r(u^*)}{Nu^*}\text{
    \& Expectation }q\frac{N_0}{N}$$


    FIGURE 1.12: Proof that the FDR (i.e., expected FD proportion, or FDP) for the
    BH procedure is less than $q$.


    One of the main points of this chapter is that you make many decisions whenever
    you interact with data. Life is not resolvable into single tests, and the problem
    of multiplicity will be ever-present. We introduced multiplicity with a story
    about how given $a$ ($p$-value cutoffs) can lead to big FDR: $a \rightarrow q(a)$.
    With the BH procedure, we’ve reversed the mapping. BH is a recipe for the $a$
    ($q$) that will give you whatever FDR $q$ you want: $q \rightarrow a(q)$. In either
    case, FDR is *the* way to summarize risk when you have many tests. You’ll never
    think about testing the same again!


    FOR A LARGER FDR EXAMPLE, we’ll consider an application in statistical genetics.
    The approach known as GWAS, for “genome-wide association studies,” involves scanning
    large DNA sequences for association with disease. The hope is that a number of
    DNA locations can be identified as promising for exploration and lab experimentation.
    Since this experimentation is expensive, it is crucial that you understand the
    FDR—in this case, the expected failure rate for further exploration—when reporting
    the list of promising locations.'
