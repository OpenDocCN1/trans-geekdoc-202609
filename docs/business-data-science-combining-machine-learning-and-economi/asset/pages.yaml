  md: 'introduces *variability* in our resamples: in this example, without-replacement
    sampling would *always* yield the set $\{1, 2, 3, 4, 5\}$.


    # **ALGORITHM 1** The Nonparametric Bootstrap


    Given data $\{z_i\}_{i=1}^n$, for $b = 1 \dots B$:


    +   • Resample *with-replacement* $n$ observations $\{z_i^b\}_{i=1}^n$.


    +   • Calculate your estimate, say, $\hat{\beta}_b$, using this resampled set.


    Then $\{\hat{\beta}_b\}_{b=1}^B$ is an approximation to the sampling distribution
    for $\hat{\beta}$.


    The resulting “bootstrap sample” can be used for all of the same purposes as your
    usual theoretical sampling distribution. For example, an approximate standard
    error—the standard deviation of your sampling distribution—can be approximated
    by the standard deviation of this bootstrap sample:


    ```

    $$\operatorname{se}(\hat{\beta}) \approx \operatorname{sd}(\hat{\beta}_b) = \sqrt{\frac{1}{B}
    \sum_b (\hat{\beta}_b - \hat{\beta})^2}$.\tag{1.3}$$

    ```


    Here, $\hat{\beta}$ (without subscript) is the estimated parameter you get using
    the full original sample. So long as the estimator is *unbiased*, which means
    that $\mathbb{E}[\hat{\beta}] = \beta$, then you can use this standard error to
    build your usual 95% confidence interval:


    ```

    $$\beta \in \hat{\beta} \pm 2\operatorname{sd}(\hat{\beta}_b).\tag{1.4}$$

    ```


    Revisiting our online spending example, we can write a simple bootstrap for the
    sampling distribution.'
