  md: "We can identify these 25 significant signals and rerun glm on only those variables,\
    \ yielding a much more parsimonious model.\n\n```\n```R\n> signif <- which (pvals\
    \ <= 0.0122)\n> head (signif) # first 5 of 25\nSIG2 SIG17 SIG19 SIG20 SIG22 SIG24\n\
    2   17    19    20    22    24\n> cutvar <- c(\"FAIL\", names (signif)) # the\
    \ keepers\n> cut <- glm(FAIL ~ ., data=SC[,cutvar], family=\"binomial\")\n> 1\
    \ - cut$deviance/cut>null.deviance # new in-sample R2\n[1] 0.1811822\n```\n```\n\
    \nNotice that the *cut* model, using only 25 signals, has $R^2_{cut}=0.18$. This\
    \ is much smaller than the *full* model's $R^2_{full}=0.56$. In general, the *in-sample*\
    \ $R^2$ *always increases with more covariates*. This in-sample $R^2$ is exactly\
    \ what MLE $\\hat{\\beta}$ is fit to maximize, so if you give glm more knobs to\
    \ turn (more $\\hat{\\beta}_k$'s), then it will be able to get you a tighter fit.\
    \ This is exactly why we don't care about IS $R^2$—it can be made to look arbitrarily\
    \ good just by adding junk variables to the design. The real question is, how\
    \ well does each model predict *new* data?\n\nOf course, you can't know about\
    \ performance on unseen data because you don't have it. However, you can mimic\
    \ the experience of predicting on unseen data by evaluating your models on data\
    \ that was left out of the training sample. Algorithm 4 details the experiment.\n\
    \n# ALGORITHM 4 K-Fold Out-of-Sample (OOS) Validation\n\n+   Given a dataset of\
    \ $n$ observations, $\\{[\\mathbf{x}_i, y_i]\\}_{i=1}^n$:  \n* Split the data\
    \ into $K$ evenly sized random subsets (*folds*).  \n* For $k = 1 \\dots K$: \
    \ \n\t- Fit the coefficients $\\hat{\\beta}$ using all but the $k$th fold of data.\
    \  \n\t- Record $R^2$ on the left-out $k$th fold.\n\nThis will yield a sample\
    \ of $K$ OOS $R^2$ values. This sample is an *estimate* of the distribution of\
    \ your model's predictive performance on new data."
