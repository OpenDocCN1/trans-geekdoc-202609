    A CV routine is possible here: for each $K$, fit the mixture on part of the data
    and evaluate the deviance on the left-out sample for the fitted *unconditional*
    likelihood in Equation 7.1.2. It will be necessary to use a deviance built from
    the unconditional likelihood because you don''t know $k_f$ for left-out $x_f$.


    However, since $K$-means is computationally expensive, it is usually impractical
    to run a full CV experiment. It is more common to use an information criterion
    for selecting the number of clusters. The full in-sample deviance for $K$-means—for
    the model in Equation 7.5—is the sum of squares, $\sum_i\sum_j (x_{ij} - \hat{\mu}_{k_{ij}})^2$.
    The number of degrees of freedom is equal to the number of parameters in the cluster
    centers: $K \times p$. With these two facts, the usual AIC/AICc and BIC formulas
    apply. For example, Figure 7.6 shows the BIC surface for the protein data country
    clustering—it selects $K = 2$.


    ![](img/315929ad4bddd26368466d02e06e2385_285_0.png)


    FIGURE 7.6: BIC for $K$ in the protein-consumption clustering example.


    However, you should beware: all of these tools—from CV to BIC—are less reliable
    here than in regression. The CV routine will have trouble with the instability
    of the model fit as a function of $K$ (this is like forward stepwise regression,
    where CV does poorly) while the AIC/AICc/BIC rely upon theoretical approximations
    that are less valid here for mixtures than they are for the regression models.
    If you are going to use anything, there is some evidence that the BIC works well
    for mixtures,4 and I''d trust it before the others. But I still don''t trust it
    much at all. For example, Figure 7.6 shows the'
