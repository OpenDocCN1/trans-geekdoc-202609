- pgno: 167
  md: 'The `gamlr` package doesn’t include the estimation routine in Equation 4.7.
    Instead, it feeds into an efficient parallel computing strategy called distributed
    multinomial regression (DMR) that is described in the next section. In the meantime,
    we can fit your multinomial logistic regressions using the `glmnet` package with
    the `family = "multinomial"` flag. `glmnet` and `gamlr` use almost the exact syntax,
    but there are small differences. Both have detailed help documentation.


    We’ll illustrate on the forensic glass data from our investigation of K-NN algorithms.
    As for `gamlr`, `glmnet` works with sparse matrices. The design matrix includes
    all of the chemical composition variables interacting with the refractive index.


    ```

    ```r

    library(glmnet)

    xfgl <- sparse.model.matrix(type~.*RI, data=fgl [, -1])

    ```

    ```


    We can then call `cv.gamlr` to minimize Equation 4.7 and run a CV experiment.


    ```

    ```r

    gtype <- fgl$type

    glassfit <- cv.glmnet(xfgl, gtype, family="multinomial")

    ```

    ```


    The `cv.glmnet` object is similar to the `cv.gamlr` object. You can plot the OOS
    deviance results across folds, as in Figure 4.7. We see that the lowest OOS deviance
    is around 2.0 and the null model deviance is around 3.0, implying a rough $R^2$
    of around 1/3. Figure 4.8 shows the lasso paths. In Figure 4.8 we see that there
    is a separate path plot for each glass type—in other words, for each $\beta_k$.
    However, in the model specification there is a single $\lambda$ across all classes.
    From Figure 4.7, the CV-min rule selects path slices at $\log \lambda \approx
    -6$.'
