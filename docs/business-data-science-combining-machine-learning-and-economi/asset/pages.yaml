    `ca1` and `ca2` are also interesting. These are essentially the first two principal
    component scores for each member in PCA of their voting record. The model used
    is slightly different but closely related to the roll-calling voting PCA example
    in Chapter 7.


    Under the assumption that the average beliefs of someone''s constituents provide
    a signal on their own beliefs (or at least how they portray their beliefs), we
    can use `repshare` as a surrogate for ideology and partisanship. For example,
    Tom Price (R GA) says the term `death.tax` often (28 times), and he is from a
    congressional district that voted 70% for Bush in 2004. William Jefferson (D LA)
    says `estate.tax` often (32 times), and his district voted strongly against Bush
    (24%). If this pattern repeats itself (it does), we''d model `death.tax` as a
    Republican term and `estate.tax` as a Democratic term.


