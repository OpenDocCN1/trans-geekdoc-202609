- pgno: 232
  md: 'The first line of the system in Equation 6.2 looks like a generic linear regression—a
    reduced-form model where $\beta_j$ represents average change in $y$ with $x_j$
    but without any worry about causation. The difference—what makes Equation 105
    structural— is that the relationships between $\varepsilon$ and $x$ and $d$ are
    fully specified. The second line of Equation 6.2 states that $x$ contains all
    of the variables that influence both $d$ and $y$, such that the conditional ignorability
    assumption holds and $y$ can be interpreted *causally*. That is, $y$ represents
    change in $y$ where $d$ moves *independent* of all other influences.


    When $x$ is simple and low dimensional—say, with dimension $p \ll n$—you don’t
    need to worry about estimating the second line of Equation 6.2. Under conditional
    ignorability, a large $n$ and small $p$ implies that standard OLS regression estimates
    for $\mathbb{E}[y \mid d, x] = dy + x^T \beta$ will recover the correct causally
    interpretable $\hat{Y}$. Looking at our earlier explanation of the mechanics of
    regression controls, in OLS this happens because we are “identifying” $y$ as the
    effect of $v$ on $y$. That is the reason for this common practical advice: “If
    you need to adjust for confounders, just include them in the regression.” The
    vast majority of observational studies—in economics, medicine, business, or elsewhere—make
    do with such standard regression techniques. Logistic regression doesn’t have
    the same mechanical “regression on residuals” interpretation as OLS, but it works
    in roughly the same way: if you want to control for a confounder, you just add
    it as an input.


    Problems start arising only when you have so many variables to control for that
    the assumption of $n \gg p$ no longer applies. In that setting, you need to be
    much more careful about how you go about estimation. Unfortunately, it is almost
    always the case that you have many confounders! There are a vast number of possible
    external influences in almost any observational study. The *only* reason that
    analysts are able to use low-dimensional OLS techniques is because they have *selected*—through
    the basis of intuition, experience, and a variety of subjective tools—a smaller
    dimensional $x$ that contains the “important” confounders.


    In practice, you have no way to know whether this is the right set of confounders.
    Hand-picking of controls is massively time-consuming, unstable, and hard to replicate.
    Results will always be subject to skepticism around the analyst’s choices and
    motivations. Thus, almost all treatment effect estimation problems are high-dimensional
    problems when viewed from a high level, and we already know that standard OLS
    regression techniques are an imperfect tool for high-dimensional problems. You
    will need to adapt the ML tools, like lasso and CV, for causal inference under
    the conditional ignorability model.'
