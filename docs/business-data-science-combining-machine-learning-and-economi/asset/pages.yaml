    ![](img/315929ad4bddd26368466d02e06e2385_161_0.png)


    FIGURE 4.4: IS fit for the credit lasso.


    A classification rule, or cutoff, is the probability p at which you predict $\hat{y}f$=
    0 for pf ≤ p and $\hat{y}f$ = 1 for pf > p. As mentioned at the outset, any such
    rule will have two types of errors associated with it: false positives, where
    $\hat{y}$ = 1 but y = 0, and false negatives, where $\hat{y}$ = 0 but y = 1. These
    can be converted into *rates*:


    False Positive Rate = expected # false positives / # classified positive


    False Negative Rate = expected # false negatives / # classified negative


    These are similar to the false discovery rates that we studied in the context
    of hypothesis testing.'
