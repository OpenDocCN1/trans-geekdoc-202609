- pgno: 292
  md: 'discussion of factor variance, we can summarize the PC scores as a series of
    variance maximizations as in Algorithm 18.


    # ALGORITHM 18 Principal Components Analysis


    Set $\tilde{\mathbf{X}}^1 = \mathbf{X}$, your $n \times p$ data matrix. Then,
    for $k = 1 \ldots \min(n, p)$,


    +   Find

    \begin{equation}\begin{split}\boldsymbol{\varphi}_{k} = \argmax_{\boldsymbol{\varphi}_{k}}
    \big[ \operatorname{Var}(\tilde{\mathbf{X}}^{k}\boldsymbol{\varphi}_{k}) = \operatorname{var}\{v_{k1},
    \ldots, v_{kn}\} \big],\end{split}\tag{7.10}\end{equation}

    where

    \begin{equation}\begin{split}\boldsymbol{v}_{k i} = \boldsymbol{\varphi}_{k}^{\prime}\mathbf{x}_{i}
    = \sum_{j=1}^{p}x_{ij}\varphi_{k j} \text{ and } \sum_{j=1}^{p}\varphi_{k j}^{2}
    = 1.\end{split}\end{equation}


    +   Update rows of $\tilde{\mathbf{X}}^{k}$ via $\tilde{\mathbf{x}}_{i}^{k+1}
    = \tilde{\mathbf{x}}_{i}^{k} - \boldsymbol{v}_{k i} \times \boldsymbol{\varphi}_{k}^{\prime}$


    There are many ways to run PCA in R. After trying many different versions with
    my MBA classes, the most robust seems to be `prcomp(x, scale=TRUE)`. The `scale=TRUE`
    argument here is important: since you''re working with fitting the $x_{ij}$ directly,
    as in *K*-means and *K* nearest neighbor, it is good to scale the data so that
    you are working in terms of standard deviations of $x_j$ rather than in some other
    arbitrary units. To illustrate, we''ll apply this to the protein consumption data:


    ```

    ```

    > pcfood <- prcomp(food, scale=TRUE)

    > round(pcfood$rotation, 1)

    ```

    | | PC1 | PC2 | PC3 | PC4 | PC5 | PC6 | PC7 | PC8 | PC9 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | RedMeat | -0.3 | -0.1 | -0.3 | -0.6 | 0.3 | -0.5 | 0.2 | 0.0 | 0.2 |

    | WhiteMeat | -0.3 | -0.2 | 0.6 | 0.0 | -0.3 | -0.1 | 0.0 | 0.0 | 0.6 |

    | Eggs | -0.4 | 0.0 | 0.2 | -0.3 | 0.1 | 0.4 | -0.4 | -0.5 | -0.3 |

    | Milk | -0.4 | -0.2 | -0.4 | 0.0 | -0.2 | 0.6 | 0.5 | 0.1 | 0.2 |

    | Fish | -0.1 | 0.6 | -0.3 | 0.2 | -0.3 | -0.1 | -0.1 | -0.4 | 0.3 |

    | Cereals | 0.4 | -0.2 | 0.1 | 0.0 | 0.2 | 0.1 | 0.4 | -0.7 | 0.2 |

    | Starch | -0.3 | 0.4 | 0.2 | 0.3 | 0.7 | 0.1 | 0.2 | 0.1 | 0.1 |

    | Nuts | 0.4 | 0.1 | -0.1 | -0.3 | 0.2 | 0.4 | -0.4 | 0.2 | 0.5 |

    | Fr.Veg | 0.1 | 0.5 | 0.4 | -0.5 | -0.2 | 0.1 | 0.4 | 0.1 | -0.2 |

    ```'
