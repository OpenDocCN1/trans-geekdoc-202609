- pgno: 225
  md: 'Instrumental variable analysis is a big topic. Models of this type are dominant
    in applied econometrics. The "mostly harmless" text of Angrist and Pischke [2009]
    is a great reference that goes deeper into these analysis frameworks. For example,
    they carefully detail the theory on how to interpret $\hat{\gamma}$ in the common
    scenario where the regressions of Algorithm 13 are only approximations to the
    true relationships between $z$, $p$, and $y$.${}^{18}$ Those looking for a deeper
    understanding of IV analysis can start with that text and also the texts by Imbens
    and Rubin [2015] and Morgan and Winship [2015].


    Instrumental Variables methodology originated in the 1930s and 1940s, with work
    by Jan Tinbergen and Trygve Haavelmo (and others) on measurement of the parameters
    of economic systems. At the same time as statisticians such as Fisher were developing
    the rules of randomized experimentation, these economists were trying to understand
    how to do social science in settings where randomization is impossible (e.g.,
    they could not randomize the income of individuals in an economy). Due to this
    heritage, econometric theory is often focused on IV setups where the instruments,
    z, are not explicitly randomized. The exclusion structure in Figure 5.8 can hold
    without randomized instruments—you just need the instrument to be *independent*
    of the response conditional on the treatment. In demand analysis, analysts sometimes
    claim that factors affecting the supplier''s *cost* of goods is an instrument
    for the sales *price*. For example, weather conditions in the North Atlantic (making
    it easier or harder to fish) have been proposed as instruments for the price of
    fish in New York City.${}^{19}$ IV analysis with weather instruments can be used
    to infer the treatment effect of price on sales.


    These non-randomized-instrument examples are open to questions around the validity
    of the instrument. Is it really that the weather at sea is far enough removed
    from the weather in NYC to not directly affect fish sales? The answer in this
    case is probably yes, so long as you condition on the right things, and the cited
    Angrist et al. paper is a nice example of demand analysis. But this criticism
    has led practitioners to view IV analysis with skepticism (and rightly so: some
    IV analyses are bonkers). This skepticism is misplaced in cases where the instrument
    has been explicitly randomized, as in the intent-to-treat exercise. When the instruments
    are explicit randomized, you have a clear view of all of the dependencies involved
    and can be much more confident that the IV model and exclusion structure hold
    true. IV analysis in such settings is essentially as robust and interpretable
    as the results from a partially randomized experiment.


    As a final point on the importance of IV models and analysis, note that when you
    are on the *inside* of a firm—especially on the inside of a modern technology
    firm—*explicitly randomized instruments are everywhere*. As'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'discussed at the beginning of this chapter, the algorithms and processes used
    by firms are constantly being randomized. This is the pervasive strategy of AB
    experimentation. But it is often the case that decision-makers want to understand
    the effects of policies that are not themselves randomized but are rather downstream
    of the things being AB tested. For example, suppose an algorithm is used to predict
    the credit-worthiness of potential borrowers and assign loans. Even if the process
    of loan assignment is never itself randomized, if the parameters in the machine
    learning algorithms used to score credit are AB tested, then those experiments
    can be used as instruments for the loan assignment treatment. Such “ upstream
    randomization” is extremely common, and IV analysis is your key tool for doing
    causal inference in that setting.


    +   1. See the text by Morgan and Winship [2015] for discussion on the relationship
    between causal modeling and counterfactual analysis. In the context of business
    decision-making, you can usually focus on counterfactual “what if?” questions
    without getting lost in deeper philosophical issues of causation.


    +   2. This and the next chapter provide a relatively brief primer on counterfactual
    analysis. See Imbens and Rubin [2015] for a much more comprehensive overview of
    these topics by two of the leading thinkers in the area.


    +   3. This idea is formalized in the do-calculus of Pearl [2009].


    +   4. Amy Finkelstein, Sarah Taubman, Bill Wright, Mira Bernstein, Jonathan Gruber,
    Joseph P. Newhouse, Heidi Allen, Katherine Baicker, and Oregom Health Study Group.
    The Oregon health insurance experiment: Evidence from the first year. The Quarterly
    Journal of Economics, 127(3):1057–1106, 2012.


    +   5. Wei Wang, David Rothschild, Sharad Goel, and Andrew Gelman. High-frequency
    polling with nonrepresentative data. In Political Communication in Real Time,
    Routledge, 2016.


    +   6. David A Freedman. On regression adjustments in experiments with several
    treatments. The Annals of Applied Statistics, 2:176–196, 2008.


    +   7. Matt Taddy, Matt Gardner, Liyun Chen, and David Draper. Nonparametric Bayesian
    analysis of heterogeneous treatment effects in digital experimentation. Journal
    of Business and Economic Statistics, 2016a.


    +   8. The notion of independence between observations plays an important role
    in causal inference, and it is formalized as SUTVA: the stable unit treatment
    value assumption. See Imbens and Rubin [2015] for detail on this topic.


    +   9. If you have within household variation in covariates and collapse those
    via averaging, you end up with a version of the instrumental variables setup that
    we discuss in a later section.


    +   10. See Imbens and Rubin [2015] for a detailed treatment of potential outcomes
    modeling by two of the leading thinkers in this area.'
