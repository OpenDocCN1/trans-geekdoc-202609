    Finally, the usual testing procedure is to choose a cutoff $\alpha$ for your $p$-value
    $p$ and conclude “significance” (a true nonzero regression coefficient) for $p
    < \alpha$. This is justified as giving only $\alpha$ probability of a false positive
    (concluding a real regression relationship where none exists). For example, in
    a regression, you might conclude that $\beta \neq 0$ only if its $p$-value is
    less than the accepted risk of a false discovery for each coefficient. If your
    tolerance for this risk is 1%, implying $\alpha = 0.01$, then for the online spending
    regression you’d conclude a nonzero bandwidth effect ($2_{\mathrm{e}-16}$ is $2/10^{16}$,
    or practically zero) but decide to keep $\beta_{\text {anychildren }} = 0$ in
    your working model.


    THE PROBLEM OF MULTIPLICITY breaks this seemingly simple relationship between
    $p$-values and reliability. Under the usual testing procedure, $\alpha$ is for
    a single test. If you repeat many tests, about $\alpha \times 100\%$ of the true-null
    signals (e.g., regression coefficients that correspond to nonexistent relationships)
    should erroneously pop up as significant. This can lead to strange results when
    you are looking for rare true signals in a haystack of spurious noise.


    Imagine a regression estimation problem where 5 out of 100 coefficients have a
    real relationship with the result. We would say here that the true coefficient
    set is sparse: most of the $\beta_{j}$ are zero. In the best-case scenario, when
    you run hypothesis tests, you find all of these five true signals (i.e., there
    are no false negatives). Let’s assume you do find all five and test the remaining
    95 with an $\alpha = 0.05$ significance cutoff. In that case, you expect that
    you will erroneously conclude significance for 5% of the useless 95 variables,
    leading you to include $4.75 \approx 5$ spurious regressors in the final'
