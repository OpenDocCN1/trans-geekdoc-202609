  md: '```

    ```r

    > resids <- P$doc_any_12m - predict( stage2,

    +   newdata=data.frame(numhh=P$numhh, phat=P$medicaid))

    > meat <- Diagonal(x=resids^2)

    > bread <- stage2$x%%solve(t(stage2$x)%%stage2$x)

    > sandwich <- t(bread)%%meat%%bread

    > print( segam <- sqrt(sandwich[2,2]) )

    [1] 0.02112

    ```

    ```


    We get a standard error of 0.021, which implies a 90% CI for the treatment effect
    of Medicaid on increased PCP visitation probability of between 17 and 25 percentage
    points:


    ```

    ```r

    > coef(stage2)["phat"] + c(-2,2)*segam

    [1] 0.1703514 0.2548427

    ```

    ```


    We have now done a step-by-step execution of Algorithm 13 and construction of
    the standard errors. Fortunately, in the future you can also just call functions
    that will go through all of the IV analysis steps for you and provide the correct
    standard errors. The same `AER` package that we’ve used for robust and clustered
    standard errors provides an `ivreG` function for IV analysis. The syntax is basically
    the same as for `glm` and `lm`, except that you use a pipe, `|`, to separate the
    first and second stage inputs.


    ```

    ```r

    > library(AER)

    > aenv <- ivreg(doc_any_12m ~ medicaid + numhh | selected + numhh, data=P)

    ```

    ```


    In the previous example, the policy/treatment $p$ is the `medicaid` indicator.
    It is listed before the pipe, along with the `numhh` covariates, as the input
    of primary interest. After the pipe, you list all of your instruments (we have
    only one, $z$, the `selected` flag) and again the covariates that you need to
    control for because they are connected with imperfect randomization.[^17] The
    summary results correspond to an IV analysis for the effect of Medicaid on PCP
    visitation:'
