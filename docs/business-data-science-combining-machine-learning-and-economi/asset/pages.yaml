  md: 'but since I wrote the gamlr software, it has the advantage of providing for
    special features covered in this book (e.g., corrected AIC and distributed multinomial
    regression).


    The glimnet package is also an excellent option for lasso estimation. Both gamlr
    and glimnet use similar syntax and use similar optimization routines (coordinate
    descent). The difference is in what they can do beyond the lasso: gamlr offers
    diminishing bias penalization, like the log penalty in Figure 3.4 (see also Figure
    3.7), while glimnet provides for the elastic net of that same figure.


    ![](img/315929ad4bddd26368466d02e06e2385_123_0.png)


