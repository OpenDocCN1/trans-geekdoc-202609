    # ◆ UNCERTAINTY QUANTIFICATION FOR THE LASSO


    At the beginning of Chapter 1, we discussed how there are two high-level approaches
    to dealing with uncertainty about model parameters. You can, as we did in that
    chapter, attempt to quantify the uncertainty around parameter estimates and use
    this uncertainty in your decision-making process. Alternatively, you can do as
    we have in this chapter and use regularization to denoise your estimates without
    doing an explicit accounting of uncertainty. That is, you use procedures that
    give reliable point estimates in the presence of uncertainty by shrinking toward
    the safe null hypothesis. Rather than the classical dichotomy between estimation
    and testing, your decision-making around whether a variable is zero or nonzero
    has been incorporated into a single optimization objective.


    In this section, we introduce a hyrid scenario: you have used the lasso to perform
    high-dimensional analysis but then need to provide some measure of the uncertainty
    around the lasso estimates. This will be relevant, for example,'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'if the analysis goals are more complex than basic prediction, if you have asymmetric
    losses for over- and underestimation, or if the audience expects to see something
    like a confidence interval around any results.


    Uncertainty quantification for tools like the lasso is not easy. The presence
    of a penalty term wreaks havoc with the usual estimators for sampling distributions
    and standard errors. Moreover, it is impossible to accurately quantify uncertainty
    for very high-dimensional objects: you can build marginal intervals for a single
    $\beta_j$, not a joint interval for the full vector $\boldsymbol{\beta}$. However,
    there are a couple of tools that you can use to get good approximations to frequentist
    uncertainty after lasso estimation. We will discuss two here: the parametric bootstrap
    and subsampling. Refer also to **Chapter 6** for the method of sample splitting.


    You need to look beyond the uncertainty quantification methods of **Chapter 1**
    because these fail for the lasso. First, there are no good theoretical standard
    errors available for lasso estimates. The CLT-based results that we rely upon
    for MLE regression are invalid for estimation under penalization and in high dimensions.
    Second, the nonparametric bootstrap will not work well in scenarios where you
    are doing model selection. To see why this happens, imagine executing one fold
    of a cross-validation routine on a bootstrap sample. Since the observations have
    been resampled *with-replacement*, you are likely to have some of the same observations
    in both the training sample and in the left-out fold. This makes prediction seem
    easier than it would be in reality since the same (unpredictable) random noise
    is in both your training and validation fold. As a result, the bootstrapped CV
    routine will tend to select a smaller penalty than it would on the full sample.
    That is, the bootstrap samples will be overfit relative to the actual estimator,
    and thus they cannot be used to quantify uncertainty for this estimator.


    However, the alternative *parametric* bootstrap algorithm can be made to work
    with the lasso. Recall that, instead of sampling from the data for each bootstrap
    sample, the parametric bootstrap generates *new* observations from an estimate
    of your assumed data-generating process. Because these are new unrepeated observations,
    the overfit described earlier will not occur.


    For the parametric bootstrap, you might not want to sample from the full sample
    lasso fit. One way to think about your decision to use regularization is that
    you are trading variance for bias: you push the coefficients toward zero so that
    they are more stable and move around less with random noise. However, in an ideal
    world, the model generating simulated data in your parametric bootstrap should
    be an *unbiased* estimate of the true data generating process. In low dimensions,
    you can just simulate from the MLE fitted model (most theory on parametric bootstrapping
    assumes such a'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'scenario). However, in high-dimensional problems the MLE can be a bad model
    estimate (or it may not even exist, in the case that you have more parameters
    than observations). In practice, I recommend simulating from a model that is fit
    with less bias than the full sample lasso but is not actually a zero bias estimate.
    There is no hard rule for how to do this, but a guideline that has worked for
    me in practice is to take the full sample AICc or CV-min selected penalty—say,
    $\hat{\lambda}$—and fit the model for data generation using a penalty that is
    around 25% its size, say, $\overline{\lambda} \approx \hat{\lambda}/4$. However,
    you should consider sensitivity to this choice in real applications and compare
    to, for example, the alternative subsampling procedure discussed in a moment.


    Again, because the lasso is a biased estimator, you should target confidence intervals
    directly rather than via standard error estimates. This parallels the discussion
    of the CI bootstrap in Algorithm 2: you want to quantify how the bootstrap estimates
    differ from the original estimator and if they are biased high or low. The full
    procedure is detailed in Algorithm 9.


    # **ALGORITHM 9** Parametric Bootstrap for Lasso Confidence Intervals


    You have data $\{[\mathbf{x}_i, y_i]\}_{i=1}^{n}$ and full sample lasso coefficient
    estimate $\hat{\boldsymbol{\beta}}$ under penalty $\hat{\lambda}$ (selected via,
    e.g., AICc or CV-min rules).


    Obtain low/no penalty estimates $\overline{\boldsymbol{\beta}}$ via either likelihood
    maximization (for low dimensions) or lasso with a smaller penalty, $\overline{\lambda}
    \approx \hat{\lambda}/4$. Then, for $b=1\dots B$:


    +   Generate $n$ response observations $\{y_{i}^{b}\}_{i=1}^{n}$ from the fitted
    regression model parameterized by $\overline{\boldsymbol{\beta}}$ and with sample
    covariates, $\{\mathbf{x}_{i}\}_{i=1}^{n}$. For example, in linear regression,
    generate


    $$ y_{i}^{b} \sim \mathrm{N} \left(\mathbf{x}_{i}^{\prime} \overline{\boldsymbol{\beta}},
    \overline{\sigma}^{2}\right), \tag{3.8} $$


    where $\overline{\sigma}^{2}$ is the variance of the residuals corresponding to
    the $\overline{\boldsymbol{\beta}}$ fit.


    +   Obtain your bootstrap coefficient estimate, $\overline{\boldsymbol{\beta}}_{b}$,
    on data $\{[\mathbf{x}_{i}, y_{i}]\}_{i=1}^{n}$ with the same penalty selection
    algorithm as when estimating $\hat{\boldsymbol{\beta}}$.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'To get the $\alpha\%$ CI for a function of the coefficients—say, $f(\beta)$—you
    then calculate the $\alpha/2$ and $1-\alpha/2$ percentiles of the errors $\{f(\hat{\beta}_b)-f(\hat{\boldsymbol{\beta}})\}_{b=1}^{B}$—say,
    $\alpha/2$ and $t_{1-\alpha/2}$—and set your interval as follows:


    ```

    $[f(\hat{\boldsymbol{\beta}})-t_{1-\alpha/2}, f(\hat{\boldsymbol{\beta}})-t_{\alpha/2}].
    \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad
    (3.9)$

    ```


    Recall our hockey example. From the right panel of Figure 3.11, you can see that
    the AICc selected penalty weight is $\hat{\lambda} \approx \exp[-9]$. We’ll run
    a parametric bootstrap with simulation from the model fit for a smaller penalty
    on this same path, $\hat{\lambda} \approx \exp[-11.25]$. To generate from this
    fitted model, we first obtain the binomial probabilities corresponding to this
    $\hat{\boldsymbol{\beta}}$.


    ```

    > log(nhlreg$lambda[61])

    > Q1open <- drop(predict(nhlreg, x, select=61, type=" response"))

    ```


    We can then use the rbinom function to generate new 0/1 response values indicating
    whether each goal was scored by the away or home team in the bootstrap sample.


    We’ll run Algorithm 9 for a relatively small set of iterations, $B = 100$, due
    to the time cost in running each lasso fit.


    ```

    > Bhat <- coef(nhlreg)

    > Bparboot <- sparseMatrix(dims=c(nrow(Bhat),0),i={},j={})

    > B <- 100

    > for(b in 1:B){

    +   yb <- rbinom(nrow(x), Q1open, size=1)

    +   fitb <- gamlr(x, yb,

    +       free=1:(ncol(config)+ncol(team)),

    +       family="binomial", standardize=FALSE)

    +   Bparboot <- cbind(Bparboot, coef(fitb)) }

    ```


    The resulting matrix $B_{\text{parboot}}$ is a $p \times B$ sample of $\hat{\boldsymbol{\beta}}_{b}$
    coefficient estimates (those obtained under AICc penalty selection). You can obtain
    a 90% interval for any specific coefficient here by applying the formula in Equation
    3.9. For example, perhaps you want to know the 90% CI for the goal odds multiplier'
  merge: -1
  img_proc: true
