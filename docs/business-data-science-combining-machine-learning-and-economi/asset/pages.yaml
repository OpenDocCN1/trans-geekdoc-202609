    -0.482 0.630 returns[1: (n- 1)] -0.0144411 0.0225321 -0.641 0.522


    This property is implied by the series being a random walk: the differences between
    $y_t$ and $y_{t-1}$ are independent. If you have a random walk, you should perform
    this returns transformation to obtain something that is easier to model.


    For AR(1) terms larger than one, life is more complicated. This case results in
    what is called an exploding series because the $y_t$ values move exponentially
    far from $y_1$. For example, Figure 2.21 shows how quickly the observations diverge
    even for $\beta_1 = 1.02$, very close to one. Since these series explode, they
    are useless for modeling and prediction. If you run a regression and find such
    an AR(1) term, you are likely missing a trend variable that needs to be included
    in your regression.'
