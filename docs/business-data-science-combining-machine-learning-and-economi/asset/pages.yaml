    ![](img/315929ad4bddd26368466d02e06e2385_105_1.png)


    FIGURE 2.24: A stationary series with $\beta_1 = -0.8$. It is possible to have
    negatively correlated AR(1) series, but you will see these far less often in practice.


    An important property of stationary series is mean reversion. Think about shifting
    both $y_t$ and $y_{t-1}$ by their mean $\mu$:


    ```

    $$ y_t - \mu = \beta_1 \left( y_{t-1} - \mu \right) + \varepsilon_t. $$

    ```


    Since $|\beta_1| < 1$, $y_t$ is expected to be closer to $\mu$ than $y_{t-1}$.
    Mean reversion is common, and you can use it to predict future behavior.


    It is also possible to expand the AR idea to higher lags:


    ```

    $$ AR(p) : Y_t = \beta_0 + \beta_1 \ Y_{t-1} + \dots \beta_p Y_{t-p} + \varepsilon.
    $$

    ```'
