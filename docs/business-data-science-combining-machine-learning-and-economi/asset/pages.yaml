- pgno: 115
  md: '# REGULARIZATION PATHS


    How do you build sets of models? With any realistic input dimension, it is impossible
    to simply catalog all possible models. For example, if you have a regression setting
    with $p$ potential covariates, there are $2^{p}$ different models possible depending
    upon whether each covariate is included. With just 20 covariates, this implies
    already more than 1 million candidate models.


    This section introduces the crucial idea of *regularization*: penalizing model
    complexity in such a way that you can enumerate a list of promising candidate
    models, ranging from simple to complex.


    One common but crude approach to model selection is based upon *p*-values.


    +   - Run the full MLE regression using $\text{g}_{\text{lm}}$, yielding *p*-values
    on each candidate input''s coefficient.

    - Then rerun glm using only those inputs whose *p*-values are below some $\alpha$
    threshold.


    Going further, one could use a sequence of $\alpha$ thresholds—perhaps corresponding
    to FDR rates as implied by the Benjamini–Hochberg FDR control algorithm—to generate
    a sequence of models. These models could then be compared in the sort of out-of-sample
    experiment you did earlier for semiconductors.


    This common practice is a *bad* idea for a couple of reasons:


    +   - When you have *multicollinearity*—correlation between inputs—the *p*-values
    for all of these variables will be large (they will look insignificant) even if
    any one of the variables provides a useful signal on the response. You will end
    up including none because you don''t know which one of them should be included.

    - The *p*-values are based on an overfit model. For example, in the semiconductor
    analysis, the *p*-values are estimated from a model that does far worse than $y-$
    in prediction tasks. If you use these *p*-values, you will be building a set of
    candidate models on the foundation of a terrible regression fit. When $p > n$,
    there is no full model because glm will fail to converge.


    This general approach—looking at a full model fit and then cutting it down to
    size—is sometimes called *backward stepwise regression*. You should avoid it.


    A better solution is to proceed in the opposite direction, building from simplicity
    to complexity in a *forward stepwise regression*, as laid out in'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Algorithm 5.


    # **ALGORITHM 5** Forward Stepwise Regression


    +   * Fit all univariate models. Choose that with the highest in-sample $R2$ and
    put that variable—say, $x_s$—in your model.


    +   * Fit all bivariate models including $x_s$


    ```

    $y \sim \beta_s x_s + \beta_j x_j \quad \forall j \neq s$,

    ```


    and add $x_j$ from the one with highest $R2$ to your model.


    +   * Repeat: given current inclusion set of variables $S$, represented by the
    vector $xS$, fit all models,


    ```

    $y \sim \beta_s'' x_S + \beta_j x_j \quad \forall j \notin S$,

    ```


    and again add $j$ to $S$ for the $x_j$ that maximizes in-sample $R2$.


    You can either keep going until reaching a predetermined level of complexity or
    stop when some model selection rule (e.g., R uses the AIC that you will study
    later in this chapter) is lower for the current model than for any of the models
    that add one variable.


    Algorithm 5 is our first example of a *greedy* search strategy. We proceed myopically,
    at each point adding the next iteration of complexity that seems most useful given
    the current search state. Despite not optimizing for *global* properties of the
    search path, greedy algorithms are fast and stable, and they play a prominent
    role in many ML strategies.


    You will soon see that this specific forward stepwise procedure is a bit naive
    and that it can be improved upon dramatically via modern regularization ideas.
    But the general approach of proceeding forward in your search, from simplicity
    to complexity, is useful for a number of reasons. One big advantage is stability.
    A backward scheme is *unstable* because if you jitter the data slightly (or get
    a slightly different sample) the full complexity model can change dramatically
    (because it is overfit) and thus your entire search path of candidate models will
    change. In contrast, simple univariate or null models will remain roughly the
    same under data resampling, such that our *forward* search path is always starting
    in the same place.'
  merge: -1
  img_proc: true
- pgno: 117
  md: "R provides the `step()` function to execute this stepwise routine. You give\
    \ a starting point, called the `null` model, and a biggest possible model, called\
    \ the `scope`. Using our semiconductors for an example:\n\n```\n```\n> null <-\
    \ glm(FAIL~1, data=SC)\n> # forward stepwise: it takes a long time!\n> system.time\
    \ (fwd <- step (null, scope=formula(full), dir=\"forward\") )\n... \nStep:  AIC=92.59\n\
    FAIL ~ SIG2\n... \n \n   user  system elapsed\n151.66  12.58   97.88\n> length(coef(fwd))\n\
    [1] 69\n```\n```\n\nThis procedure enumerated 70 models, ranging from a univariate\
    \ model including only $SIG_2$ up to a model with 68 input signals (plus the intercept).\
    \ The algorithm stopped at 68 because the AIC score for that model was lower (better)\
    \ than any of the AIC scores for models with 69 inputs.³ The greedy search procedure\
    \ stopped when it thought it had found the best model, making the assumption that\
    \ since the AIC is not getting any better when moving from 68 to 69 inputs it\
    \ will not improve with 70+ inputs.\n\nNotice that this `step()` procedure is\
    \ *very slow*: on my laptop, it required 98 seconds to run for this small semiconductor\
    \ dataset. This is true in general for any subset selection algorithm that enumerates\
    \ candidate models by applying maximum likelihood estimation for subsets of coefficients\
    \ (with the rest set to zero). Subset selection is slow because adding one variable\
    \ to a regression can lead to large changes to the coefficients fit for all of\
    \ the other variables. Thus, each model must be fit from scratch.\n\nA related\
    \ (but massively important) issue with subset selection is its *instability*.\
    \ Since the fitted models are completely different across different candidate\
    \ subsets, the quality of out-of-sample performance will differ dramatically.\
    \ You can easily make a small mistake in selection (say, including 69 rather than\
    \ 68 covariates) that leads to a massive change in predictive ability. Moreover,\
    \ if you jitter the data slightly and there is a small change in the path—for\
    \ example, the fifth variable to be included changes—then the"
  merge: -1
