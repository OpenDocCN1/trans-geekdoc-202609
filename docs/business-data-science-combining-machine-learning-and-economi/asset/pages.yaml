  md: 'sometimes significantly outperform $\mathrm{glmint}$ in such experiments, and
    you can attribute this to the use of class-specific $\lambda_{k}$ penalties.


    ![](img/315929ad4bddd26368466d02e06e2385_177_0.png)


    FIGURE 4.11: OOS performance for dmr and glmnet on a 20-fold experiment using
