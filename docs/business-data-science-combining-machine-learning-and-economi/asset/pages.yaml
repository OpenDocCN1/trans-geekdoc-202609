    The last line of code here makes NA the reference level for all of the categorical
    variables in x.


    You can take a similar approach with numeric variables: every missing dimension
    of an observation is flagged with an additional dummy indicator specific to the
    missing variable. But you need also to impute the missing numeric value so that
    it is not empty in the data matrix (which would cause problems for the optimization
    routines in the estimation procedure). There are a bunch of different ways that
    you can choose to impute the missing entries—missing data imputation, or guessing
    what the missing values would have been, is an interesting regression problem
    in its own right. Two simple approaches that work well for most problems are zero
    and mean imputation. In the former, which I recommend for sparse variables (those
    that are mostly zero), you replace missing values with zero. In the latter, you
    replace the missing values with the mean of the nonmissing entries.$^{10}$


    Looking at the OHIE covariates, there are only four numeric variables. The first
    (smk_avg_mod_12m) is sparse, and the others are dense.'
