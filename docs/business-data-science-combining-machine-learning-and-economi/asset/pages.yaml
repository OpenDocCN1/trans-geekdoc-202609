  md: '![](img/315929ad4bddd26368466d02e06e2385_388_0.png)


    FIGURE 9.17: Basic stationary GP fit to the motorcycle data (mean and 95% prediction
    interval).


    The models we’ve fit here are the simplest form of GPs. There are plenty of extensions,
    for example, to allow for different correlation structures or error variances
    in different parts of the input space (for example, note that true motorcycle
    variances are much smaller at early time points and that the homoskedastic error
    structure yields too-wide uncertainty bounds in this region). The t reed Gaussian
    process27 (TGP) algorithm is one that should appeal to readers of this chapter—it
    combines trees with GPs by using CART partitioning with a GP regression model
    at each leaf node. This allows you to get away with using shallower trees (since
    the GPs can model structure at the leaves) and hence leading to more stable prediction
    rules. The t g p package for R implements these TGP models, and you can look to
    Gramacy [2007] and Gramacy and Taddy [2010] for lengthy vignettes illustrating
    its capabilities.'
