    # TOPIC MODELS


    Text is super high dimensional, and there is often abundant *unlabeled* text available.
    For these reasons, unsupervised factor modeling is a popular and useful strategy
    with text data. You can fit a factor model to a giant corpus and use these factors
    for supervised learning on a subset of labeled documents. The unsupervised dimension
    reduction facilitates the supervised learning.


    To study text factorization, we''ll switch from politics to restaurants. We have
    6166 reviews, with an average length of 90 words per review, from the now-defunct
    travel website `we8there.com`. A useful feature of these reviews is that they
    contain both text and a multidimensional rating on *overall* experience, *atmosphere*,
    *food*, *service*, and *value*. Each aspect is rated on a five-point scale, with
    1 indicating terrible and 5 indicating excellent. As an example, one user submitted
    a glowing review for Waffle House #1258 in Bossier City, Louisiana:'
