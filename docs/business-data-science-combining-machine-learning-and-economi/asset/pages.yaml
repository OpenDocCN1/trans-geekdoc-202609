  md: 'Here, N(·) denotes the *multivariate normal* distribution. Even more commonly,
    this is simplified to assume that each element of x is *independent* from each
    other and has the same variance, such that the covariance matrix is written as


    ![](img/315929ad4bddd26368466d02e06e2385_279_0.png)


    The probability distribution in Equation 7.3 then becomes the product of univariate
    normal distributions on each dimension, and the full mixture model is


    ![](img/315929ad4bddd26368466d02e06e2385_279_1.png)


    Estimation for this model leads to the K-Means method in Algorithm 17, which involves
    repeated steps of squared error minimization.


    The K-means algorithm is a common way to estimate cluster memberships across K
    components. It seeks to maximize the likelihood implied by Equation 7.5 by alternatively
    estimating component means mu_hat_k and updating memberships k_i so that x_i is
    close to mu_hat_ki. The least-squares step in Algorithm 17 minimizes the (conditional)
    deviance corresponding to the independent normal mixture model in Equation 7.5.\u0001
    If you feed K-means a set of x_i values, it will return the allocations k_i and
    the *centers* mu_hat_k. Figure 7.2 shows an example state of convergence for 3-means
    clustering of two-dimensional x, and Figure 7.3 shows the 4-means clustering of
    the galaxy data from Figure 7.1.'
