  md: "sentiment (e.g., by hand-labeling the tweets using human readers). An unsupervised\
    \ analysis will use all of the tweets to break the content into *topics*, and\
    \ then you can easily sort these topics by sentiment on the subset of labeled\
    \ tweets.\n\nIn this chapter, we’ll explore different methods of *factorization*—tools\
    \ that break the expectation for each $x$ into the sum of a small number of factors.\
    \ We’ll start with unsupervised factorization and finish by adding $y$ and considering\
    \ supervised factor modeling. As always, we set up the problem with the goal of\
    \ minimizing an out-of-sample deviance.\n\n# # CLUSTERING\n\nCluster analysis\
    \ is used to collect similar observations into groups. For example:\n\n+   - To\
    \ break a corpus of documents into topics\n- To segment shoppers by preferences\
    \ or price sensitivity\n- To group voters according to the issues that drive their\
    \ votes\n- To find music listeners who tend to like the same genres or bands\n\
    \nClustering works by representing data as the output of a *mixture distribution*.\
    \ You assume that each observed $x_i$ is drawn from one of $K$ different *mixture\
    \ components*, the probability distributions $p_k(x)$ for $k = 1 . . . K$. The\
    \ properties of these component distributions, especially their means, define\
    \ the clusters.\n\nEven if the individual components are simple, their mixture\
    \ can yield all sorts of complicated distributions. If you don’t know the generating\
    \ component $k$, then the *unconditional* (i.e., marginal) distribution for $x$\
    \ is\n\n```\n$p(x) = \\pi_1p_1(x) + ... \\pi_Kp_K(x).$ \n\n(7.1)\n```\n\nHere,\
    \ $\\pi_k$ is the probability for component $k$ in the population. This mixture\
    \ distribution can have multiple modes, as in **Figure 7.1**, for each of the\
    \ underlying components."
