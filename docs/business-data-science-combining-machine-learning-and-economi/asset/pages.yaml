    \ of 26 capital letters, is not spam.\n\nLogistic regression is easy in R: you\
    \ use the `glm` command as you would for linear regression, except that the response\
    \ is now binary and you add the argument `family='binomial'`. The response variable\
    \ can take a number of forms: numeric ($0/1$), logical (**TRUE**/**FALSE**), factor\
    \ (e.g., *win/lose*), or even a two-column binary matrix. In the email data, we\
    \ have $y = 1$ for spam and $y = 0$ for important emails.\n\n```\n```r\n> spammy\
    \ <- glm(spam ~ ., data=email, family='binomial')\n```\n```\n\nNote that the formula\
    \ “$y \\sim .$” is shorthand for “regress $y$ on to all variables in the data.”\
    \ Take a look at one of the large positive coefficients in our fit:\n\n```\n```r\n\
    > coef(spammy)[\"word_free\"]\n word_free\n 1.542706\n> exp(1.542)\n[1] 4.673929\n\
    ```\n```\n\nThus, the *odds* that an email is spam increase almost 5 times if\
    \ that email contains the word *free*. On the other hand, we see next that if\
    \ the email contains the word *george*, the odds of it being spam drop by a factor\
    \ larger than 300.\n\n```\n```r\n> coef(spammy)[\"word_george\"]\n word_george\n\
    \ -5.779841\n> 1/exp(-5.78)\n[1] 323.7592\n```\n```\n\nThis is an old dataset\
    \ collected from the inbox of a guy named George. Spammers were not very sophisticated\
    \ in the 1990s, so emails containing your name were most likely not spam.\n\n\
    When you run the spam regression, R warns that `fitted probabilities numerically\
    \ 0 or 1 occurred`. You need not worry: this just says that the regression is\
    \ able to fit some data points *exactly*—for example, a spam email"
