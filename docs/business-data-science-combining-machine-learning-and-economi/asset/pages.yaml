- pgno: 171
  md: 'Once you get familiar with these pairwise odds comparisons, model interpretation
    is the same as for any other generalized linear model. For example, in the fitted
    regression, the $\mathrm{Mg}$ interaction coefficient is estimated as $\hat{\beta}_{\mathrm{wInNF,\
    RI:Mg}}=-0.05$ for $\mathrm{wInF}$ and 0 for $\mathrm{wInP}$. Thus, the multiplicative
    effect of a unit extra Mg on odds of nonfloat glass over float glass is itself
    multiplied by the following for each unit increase in RI:


    $\mathrm{exp}\left[\hat{\beta}_{\mathrm{wInF,\ RI:Mg}}-\hat{\beta}_{\mathrm{wInF,\
    RI:Mg}}\right]=e^{-0.05} \approx 0.95.$


    From earlier, the odds of float over nonfloat glass are multiplied by 0.66 for
    each unit increase in Mg at a refractive index of zero. This multiplier becomes
    $0.66 \cdot 0.955 \approx 0.51$ at $\mathrm{RI}=5$ and $0.66 \cdot 1.055 \approx
    0.84$ at $\mathrm{RI}=-5$.


    A common question when learning about the multinomial logit is “How do the odds
    for one class against all others change with x?” Unfortunately, this relationship
    is nonlinear:


    $\log \left[\frac{p_k}{1-p_k}\right]=\log \left[\frac{p_k}{\sum_{j \neq k} p_j}\right]=\mathbf{x}^{\prime}
    \boldsymbol{\beta}_k-\log \sum_{j \neq k} e^{\mathbf{x}^{\prime} \boldsymbol{\beta}_j}$.
    (4.9)


    There is no fixed relationship for, say, the effect of a unit change in one covariate.
    You need to calculate the probabilities at two different input locations and do
    an explicit comparison.


    Once you work with logistic multinomial models a bit, you will get familiar with
    the idea of $e x^{\prime} \beta_k$ acting as an intensity for each class. Each
    of these intensities battle against each other to determine the probabilities
    across potential classes. This interpretation forms the basis for the algorithm
    that is covered in the next section.


    # DISTRIBUTED MULTINOMIAL REGRESSION


    If you went and ran the regressions in the previous section, or other multinomial
    logits, you might have noticed that multinomial regression can be slow. This is
    because, compared to the linear and logistic lassos, you now have $K$ times more
    coefficients since everything needs to be repeated $K$ times. A computational
    bottleneck occurs because the deviance for each $\hat{\beta}_k$ depends on all
    of the other category coefficients through the logit link:


    $\rho_k=e^{\mathbf{x}^{\prime} \hat{\beta}_k} / \sum_j e^{\mathbf{x}^{\prime}
    \hat{\beta}_j}$.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Through a well-known relationship between Poisson and multinomial distributions,
    it turns out that multinomial logistic regression coefficients will be—for all
    practical purposes—similar to those that we can get through *independent* estimation
    for each of the log-linear equations:


    $$\mathbb{E}[y_{ik} | \boldsymbol{x_i}] = \exp(\boldsymbol{x_i}^{\prime}\boldsymbol{\beta_k}).
    \qquad (4.10)$$


    The trick is that we need to estimate the coefficients in Equation 4.10 using
    a Poisson distribution likelihood, rather than the Gaussian distributions (squared
    error loss) that we’ve previously used with log linear models. That is, we will
    assume that


    $$y_{ik} \sim \text{Poisson} \left( \exp[\boldsymbol{x_i}^{\prime}\boldsymbol{\beta_k}]
    \right). \qquad (4.11)$$


    This leads to the Poisson deviance objective,


    $$\text{dev} ( \boldsymbol{\beta_k} ) \propto \sum_{i=1}^{n} \exp ( \boldsymbol{x_i}^{\prime}\boldsymbol{\beta_k}
    ) - y_{i} ( \boldsymbol{x_i}^{\prime}\boldsymbol{\beta_k} ). \qquad (4.12)$$


    Adding lasso penalty regularization, we can then estimate regression coefficients
    by minimizing a penalized deviance:


    $$\hat{\boldsymbol{\beta}_k} = \text{argmin} \left\{ \sum_{i=1}^{n} \exp \left(
    \boldsymbol{x_i}^{\prime}\boldsymbol{\beta_k} \right) - y_{i} \left( \boldsymbol{x_i}^{\prime}\boldsymbol{\beta_k}
    \right) + \lambda_k \sum_{j} \left| \beta_{kj} \right| \right\}. \qquad (4.13)$$


    The Poisson distribution is used for *count* data: $y \in \{0, 1, 2, \ldots\}$.
    When you *know* that $y_{ik} \in \{0, 1\}$, this is a misspecified (i.e., incorrect)
    model. However, researcher₂ has demonstrated that the two models are practically
    interchangeable, especially for prediction purposes. Use of Equation 4.13 to estimate
    multinomial logit parameters is what we refer to as *distributed multinomial regression*
    (DMR). This Poisson approximation scheme can even lead to *improved* prediction
    in a lasso setting because it allows you to validate and select a different λk
    for each outcome class.


    The biggest advantage of using DMR is that you can now estimate each $\hat{\beta_k}$
    in *parallel*. To “compute in parallel” is to do many calculations at the same
    time on different *processors*. Scientific supercomputers have long used parallelism
    for massive speed, but since the early 2000s it has become standard to have many
    processor “cores” on consumer machines. Even small'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'mobile devices, like a phone, will have two to four cores. This parallelization
    is the key to modern computing, and you are likely already taking advantage of
    it. For example, you can run multiple applications at the same time on a laptop,
    and digital videos run on special graphical processing units (GPUs) that contain
    thousands of tiny cores for massive parallelization.⁸


    R’s parallel library makes it easy to take advantage of multiple cores. You can
    do detectCores() to see how many you have The parallel library works by organizing
    clusters of processors, which we can create with the makeCluster command.⁹


    ```

    > library(parallel)

    > detectCores()

    [1] 4

    > cl <- makeCluster(4)

    > cl

    socket cluster with 4 nodes on host ‘localhost’

    ```


    There is a large ecosystem of R functions that are designed to work with these
    clusters for parallel computing. For example, see the parLapply function for a
    parallel alternative to the usual for loops. As good practice, you can do stopCluster(cl)
    when you’re done with your parallel computing to ensure that these processors
    are freed up for other tasks.


    The dmr function in the distrom library implements our DMR parallel estimation
    strategy for multinomial logistic regression. You give dmr a parallel cluster
    object, and it will outsource gamlr runs for the Poisson lasso regressions of
    Equation 4.13 to each of the available cores. It is simply a faster way to fit
    multinomial logistic regression. Since dmr is based on gamlr, the syntax will
    be familiar. You just call dmr(cl, covars, counts, . . .) where


    +   * cl is a parallel cluster,

    * covars is x,

    * counts is y, and

    * . . . are any additional arguments to gamlr.


    You can also call dmr with the option cv=TRUE, in which case it runs cv.gamlr
    for each of the Poisson regressions. Note that we will be validating on Poisson
    rather than multinomial OOS deviance in this case.'
  merge: -1
  img_proc: true
