    Athey and Imbens describe CV algorithms for pruning CTs. However, as was the case
    with CART, CTs are unstable prediction rules, and CV selection for tree depth
    is not advisable (it will yield different trees on different samples and give
    high-variance results). Instead, for many real applications, you can do as we
    have here: fit a single shallow tree that gives you a handful of the largest sources
    of heterogeneity. You might want to know the best way to partition your customers
    into, say, four segments of differing sensitivity to marketing. In that case,
    you don''t need to worry about overfit and can simply fit a shallow four-leaf
    tree.


    For more complex HTE modeling, you should look beyond single CTs and make use
    of a forest algorithm. Athey et al. [2017b] detail a generalized random forest
    (GRF) framework that includes ensembles of CTs and they provide the `grf` package
    for implementation of these methods. As was the case for RFs, GRFs are most appropriate
    when the input dimension (here, the'
