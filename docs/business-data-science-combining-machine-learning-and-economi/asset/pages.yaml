- pgno: 288
  md: 'shared across all observations. They are coefficients for regression of $x_{ij}$
    onto $v_i$. Note the connection between this factor model and the K-means representation
    in Algorithm 17. The mixture mean equation is equivalent to Equation 7.6 if you
    set $\mu_k = \varphi_k$ with $v_{ik} = 1$ and $v_{ij} = 0$ for $j \neq k$. The
    K-means representation is a factor model where the factor scores are forced to
    be a binary vector. That is, it is a factor model where you can load on only a
    single factor. In contrast, a general factor model allows for mixed membership.
    In the protein consumption example, K-means forced every country in a cluster
    to have the same expected diet. In contrast, a full factor model would have each
    country consuming a mix of shared underlying diets. For example, Greece could
    be similar to Italy in some dimensions and closer to Turkey in others.


    HOW DO YOU ESTIMATE A FACTOR MODEL? You need to regress x onto v, which would
    be easy except that the v are latent: you don''t know them and they need to be
    estimated. It turns out that there are a number of fast ways to estimate the model
    in Equation 7.6 using tools from linear algebra; indeed, it is easier to estimate
    a general factor model than to run K-means for the restricted clustering model.
    Without getting into the algebraic details, we''ll describe a few heuristics for
    thinking about factor estimation. You can then make use of R''s capable factorization
    functions.


    Consider the following greedy algorithm. Suppose you want to find the first dimension
    of factors, $v_1 = [v_{11}, \dots, v_{n1}]$, where we use superscript "1" to differentiate
    this from $v_1$, all factors for the first observation. We can write a system
    of equations for this single factor model,


    ```

    $$

    \begin{array}{c}

    \mathbb{E}[x_{i1} | v_{i1}] = \varphi_{i1} v_{i1} \\

    \vdots \\

    \mathbb{E}[x_{ip} | v_{i1}] = \varphi_{i1} v_{i1},

    \end{array}

    $$


    for $i = 1, \dots, n$.

    ```


    Now, the problem is to find $v_1$ and $\varphi_1$ that minimize the average sum
    squared error across all dimensions. Conveniently, this problem has a simple closed-form
    solution.$^6$ And, after solving for $v_1$ and $\varphi_1$, you can proceed iteratively:
    calculate residuals $x_{ij} - \varphi_{j1} v_{i1}$ and then find $v_2$ to minimize
    a similar sum squared error criterion for these residuals. The process repeats
    until the residuals are all zero, which will happen after min($p$, $n$) steps
    (i.e., when you have as many factors as either dimensions or observations, whichever
    comes first).'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'This procedure is called principal component analysis (PCA). The result of
    PCA is a set of rotations \( \Phi = [\varphi_1 \cdot \cdot \cdot \varphi_k] \).
    These can be used to obtain the factor scores \( v_i \) for any observed \( x_i
    \). The specific greedy algorithm shown previously is not actually used in practice—there
    are more efficient procedures—but the intuition is solid. We’re repeatedly fitting
    both \( \varphi_k \) and latent \( v_k \) to minimize deviance across dimensions
    \( j = 1 \cdot \cdot \cdot p \) and observations \( i = 1 \cdot \cdot \cdot n
    \), for the model


    ```

    \( \tilde{x}_{ij}^k \sim \mathbf{N}\left(v_{ik} \varphi_{kj}, \sigma_k^2\right)
    \)      (7.8)

    ```


    where


    ```

    \( \tilde{x}_{ij}^k = \tilde{x}_{ij}^{k-1} - v_{ik-1} \varphi_{k-1j} \)

    ```


    is the residual after fitting \( k - 1 \) factors, starting from \( \widetilde{\mathbf{X}}^1
    = \mathbf{X} \). You can think about PCA as repeatedly fitting regression onto
    the best possible factors to explain current residuals.


    Another way to build intuition around PCA is to understand what it is doing visually
    in low dimensions. Consider the two-dimensional data plotted in Figure 7.8. The
    line is the OLS fit for \( x_2 \) on \( x_1 \) (or vice versa; it’s the same line).
    This line has a length spanning the range of observed data, and each data point
    can be mapped to a location on the line that is closest to its location in \(
    [x_1, x_2] \) coordinates. The slope of the line is defined by loadings \( \varphi_1
    \), and each point’s mapped location on the line is its factor score, \( v_{i1}
    \).'
  merge: -1
  img_proc: true
- pgno: 290
  md: '![](img/315929ad4bddd26368466d02e06e2385_290_0.png)


    FIGURE 7.8: Illustration of PCA for two-dimensional data. PCA is equivalent to
    finding the line that fits through $x_1$ and $x_2$ and seeing where each observation
    is closest to on the line.


    In finding this first PCA *direction*, we’ve projected from 2D onto a 1D axis.
    The next step of the algorithm would iterate, taking the residuals in $x_1$ and
    $x_2$ with respect to this line and repeating the projection procedure. If you
    take those residuals and regress one dimension on the other, you get the new line
    (PC2) in Figure 7.9. Since we have only two dimensions, this is where the algorithm
    stops. There is a 1:1 mapping from $[x_1, x_2]$ to the new factor space $[v_1,
    v_2]$—every point can be perfectly re-created from its PC1 and PC2 factor scores.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '![](img/315929ad4bddd26368466d02e06e2385_291_0.png)


    FIGURE 7.9: Two-factor PCA representation of the data from Figure 7.8.


    Figure 7.9 shows that PCA has rotated the axes of the data, moving from the original
    coordinates to a space where most of the data variation is spread along the first
    coordinate and there is little spread along the second coordinate. Indeed, this
    is the point of PCA: it looks for projections from multivariate $x$ that will
    have high variance. The resulting $v_{ik}$ will be spread out along the longest
    line possible—for example, along the first PC1 direction in Figures 7.8 and 7.9.
    The resulting principal components will be ordered by the variance of the fitted
    projection so that $\text{var}(v_{1i}) > \text{var}(v_{2i}) \dots \text{var}(v_{pi})$.
    You can summarize most of the variation in the data by keeping track of only the
    first $K << p$ components. That is, you fit enough components to perfectly re-create
    the original data but then use only the first several—enough to explain the dominant
    directions of variation in $x_i$.


    After you’ve fit your rotations $\Phi = [\varphi_1 \cdots \varphi_K]$, the $k$th
    principal component score for observation $i$ is fast and easy to obtain as


    ```

    $$v_{ki} = \mathbf{x}''_{i}\varphi_{k} = \sum_{j=1}^{p} \varphi_{kj} x_{ij} \quad
    (7.9)$$

    ```


    Typical practice is to keep $\Phi$ and use Equation 7.10 to recover the PC scores
    for any $x_i$ as needed.$^{2}$ Combining this equation with the previous'
