  md: '# # NEAR-EXPERIMENTAL DESIGNS


    There are several common scenarios where a randomized $AB$ trial is impossible
    but you can nonetheless recover causal treatment effect estimates under a small
    set of additional assumptions. $^{11}$ Maybe you introduce a new product/treatment
    to only a portion of the markets—for example, the United States but not Canada.
    These are different places, but if you can model the pretreatment differences
    between them, there is a hope to build a causal interpretation around post-treatment
    changes. Or, perhaps only individuals with income less than a fixed threshold
    receive some form of social assistance. This is a nonrandom sample, but you might
    assume that those people who barely miss out on the social program (i.e., they
    made slightly too much money) are otherwise comparable to those who barely qualified
    and use these two groups as treatment and control samples.


    The first example mentioned allows for a *difference-in-difference* (diff-in-diff)
    analysis, and the latter is a setting for *regression discontinuity* (RD) estimation.
    There are many other near-experimental setups, but variations on these two cover
    a large proportion of business applications. We’ll look at two applications from
    Internet marketing to illustrate each framework.


    A DIFF-IN-DIFF ANALYSIS applies when you have two groups whose pretreatment differences
    can be isolated and modeled so that post-treatment differences are the basis for
    causal estimates of the treatment effect. The framework consists of nothing more
    than some basic regression modeling along with strong assumptions about treatment
    independence. The canonical example has two markets, say, Canada and the United
    States, with only one receiving some sort of sales promotion, say, free shipping
    in the United States. You can model the trend in sales in both countries before
    and after treatment—free shipping—is rolled out in the United States. If sales
    grow in the United States relative to Canada after treatment, then you have a
    positive treatment effect *if you assume that this difference is not because of
    external shocks that hit only one of the two countries*. This last assumption
    is the Achilles heel of diff-in-diff analysis, and there is no way to get around
    it. For this reason, diff-in-diff results are only as reliable as the two groups
    are truly comparable.


    Our diff-in-diff example is taken from the paper by Blake et al. [2014], $^{12}$
    researchers from eBay who studied the effect of search engine marketing (SEM).
    *Sponsored or paid* search refers to the advertisements and links that you see
    around web search results on, for example, Google. Figure 5.1 shows an example
    web page returned after search, dominated by paid search results.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The research question is simple: “What is the effect of paid search advertising?”
    Or, to turn it around, what would happen to sales revenue if eBay stopped paying
    for SEM? Since a big website like eBay will show up anyway in the organic results
    (e.g., see Zappos in both organic and paid results in Figure 5.1), do they get
    any benefit from also appearing in sponsored slots? And how big is the benefit?
    Is it worth the cost?


    ![](img/315929ad4bddd26368466d02e06e2385_200_0.png)


    FIGURE 5.1: SEM around search results on Google. Almost everything in the screenshot
    is “sponsored”—it has been paid for and has not risen *organically* through Google’s
    relevance metrics. The only organic results are the bottom two listings in the
    main column, first for Zappos and second for Nordstrom.


    Questions about marketing ROI are generally tough to answer. The sponsored results
    get clicked and lead to conversions, but you have no idea if'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'these users would have followed the organic result if there was no sponsored
    option. And you can’t compare the pages where eBay ads don’t appear to those where
    they do: the ads appear with the searches that eBay and Google think are most
    likely to lead to clicks. That is, the pages where ads don’t appear will expect
    to see fewer clicks on eBay links for search-relevance reasons independent of
    the presence or absence of sponsored results.


    Blake et al. managed to convince the powers at eBay to run a large-scale experiment
    where SEM was turned off for a portion of users. This created a unique opportunity
    to measure the treatment effect of paid search (for a single company), something
    that had never before been reliably measured. In particular, eBay stopped bidding
    on any AdWords (the marketplace through which Google SEM is sold) for 65 of the
    210 “designated market areas” (DMA) in the United States for the eight weeks following
    May 22, 2012. These DMAs are viewed as roughly independent markets around metropolitan
    centers ranging from Boston to Los Angeles. Google guesses the DMA on a browser
    and eBay can track users by their shipping address, allowing for DMA-specific
    treatment assignment and response tracking.


    The data are shown in Figure 5.2.13 The top line corresponds to those DMAs that
    are never treated (SEM is always on), and the bottom line is for those where SEM
    was turned off on May 22 (marked with the dashed vertical). This was not a fully
    randomized trial. That is immediately clear from the difference between treatment
    and control DMAs before May 22. It turns out that not all DMAs were eligible for
    treatment (e.g., the largest markets were excluded) and that there was an attempt
    to “match” DMAs across treatment and control that didn’t result in balanced revenues.
    Clearly, you can’t just look at $\bar{y}_{B} - \bar{y}_{A}$ to estimate the ATE:
    there is a big difference even before group $B$ is treated.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/315929ad4bddd26368466d02e06e2385_202_0.png)


    FIGURE 5.2: Average “revenue” for treatment and control DMAs. The dashed line
    is May 22, when SEM (bidding on AdWords) was turned off for the treatment group.


    However, this is a great setting for a diff-in-diff analysis. We have no reason
    to think that there was anything other than the SEM turnoff that would cause the
    relative difference between treatment and control group DMAs to change after May
    22. Thus, if SEM works, the revenue difference between treatment and control groups
    should be larger after May 22. This pre-post comparison across groups is the logic
    underlying a diff-in-diff analysis.


    Here we will focus on differences in log revenue because we anticipate that the
    treatment and control groups are related on percentage scale. The treatment DMAs
    have about 38% of the revenue of the control DMAs when SEM is on for both. Figure
    5.3 shows the log difference between average revenues in each group (this is the
    log of the ratio of the top line over the bottom line from Figure 5.2). There
    does appear to be an increase in the log difference following May 22. Is it real
    (i.e., statistically significant), and what are the implications for the return
    on investment for SEM?'
