  img_proc: true
- pgno: 358
  md: 'The classification and regression tree (CART) algorithm of Breiman et al. [1984]
    is the dominant method for fitting trees. It proceeds by iteratively choosing
    splits to minimize “node impurities.”


    # **ALGORITHM 23 CART**


    For each node, beginning with the root containing the full sample:


    +   1. Determine the single error minimizing split for this data sample—location
    $x_{ij}$ that minimizes the loss across children, as in Equation 9.1.

    2. Split this parent node into the left and right children.

    3. Apply steps 1 and 2 to each child node.


    This continues *recursively* until you reach a leaf node of some prespecified
    minimum size (e.g., stop splitting when there are fewer than, say, 10 observations
    in each leaf).


    > In addition to leaf size, many implementations include alternative stopping
    rules around a minimum loss improvement. I find it simple and transparent to use
    the single leaf-size stopping rule.


    To fit CART trees, you can use the `tree` library in R. The syntax is essentially
    the same as for `glm`.


    ```

    `mytree = tree ( y ~ x1 + x2 + x3 ... , data=mydata )`

    ```


    There are a few other useful arguments, all of which adjust the stopping rules.


    +   *   `mincut` is the minimum size for a new child.

    *   `mindev` is the minimum (proportion) deviance improvement for proceeding with
    a new split.


    In many applications, you will want to lower `mindev` from its default of `mindev
    = 0.01`, which stops splitting if there is a less than 1% improvement in loss.
    This is an overly high bar for many applications. I often use `mindev = 0` so
    that leaf size is the only stopping rule. To understand the results, you can call
    `print`, `summarize`, and `plot` (with `text` to get something readable) on the
    fitted object.'
  merge: -1
  img_proc: true
