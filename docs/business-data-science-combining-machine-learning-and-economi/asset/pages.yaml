  md: 'FIGURE 2.11: Estimated sampling distributions for the wind coefficient in our
    airquality regression. HC denotes the heteroskedastic consistent procedure, and
    vanilla refers to the usual results that rely upon homoskedasticity.


    All of the uncertainty estimators discussed so far—all of those shown in Figure
    2.11—assume independence between observations. The HC procedure, for example,
    keeps zeros on the off diagonals in $\hat{\boldsymbol{\Sigma}}$. There are additional
    procedures and tools you can use in the case of dependence between observations.
    Sandwhich estimators that allow for dependence, sometimes called clustered standard
    errors, will be discussed in Chapter 5; these techniques are commonly used when
    estimating treatment effects in randomized controlled trials. You can also deal
    with dependency by modeling it in your regression, making the dependence between
    observations explicit by including them in each other’s mean functions. In the
    next section, we discuss how to model such dependence in the specific context
    of spatial and temporal processes.


    # ## SPACE AND TIME


    Much of the material in this book is focused on independent observations. For
    example, independence was key in our development of deviance and likelihood in
    the previous section. However, many events that occur geographically near to each
    other, or one after the other, can be dependent. For example, maybe sales are
    always higher in spring/summer, or when one restaurant has a busy night, the neighboring
    restaurants also gain traffic from those who couldn’t get a table. In this section
    we''ll figure out how to deal with such information.


    Fortunately, the main tricks for working with space-time dependence fit within
    a standard regression framework. You simply include the variables behind dependence
    in your set of inputs, controlling for trends in time (e.g., month) and space
    (e.g., regional location) and for auto-regression, which is dependence between
    neighboring outcomes.


    Traditional statistics texts spend a large amount of time carefully hand-building
    these trend and autoregressive effects. Fortunately, the regularization and model
    selection material of later chapters lets us simply include a huge set of possible
    space/time variables and rely upon the data to tell us what works best. Thus,
    the remainder of this section will focus on helping you'
