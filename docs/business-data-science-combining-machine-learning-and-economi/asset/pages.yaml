    $\begin{array}{l} \mathbb{E}[y_{i}(d) \mid r=-\varepsilon] \approx \mathbb{E}[y_{i}(d)
    \mid r=0] \approx \mathbb{E}[y_{i}(d) \mid r=\varepsilon]. \end{array} \tag{5.19}$


    With all of these pieces in place, you can estimate the causal effect of treatment
    by fitting regression models on either side of the threshold and comparing their
    predictions at $r=0$. For example, we will usually estimate separate linear regressions
    within some distance $\delta$ of the threshold:


    $\begin{array}{c} \mathbb{E}[y_{i} \mid r_{i},-\delta<r_{i}<0]=\alpha_{0}+\beta_{0}r_{i},\\
    \mathbb{E}[y_{i} \mid r_{i}, 0<r_{i}<\delta]=\alpha_{1}+\beta_{1}r_{i}, \end{array}
    \tag{5.20}$


    Here, the first regression will have $d_{i}=0$ and the second $d_{i}=1$. The treatment
    effect estimate at $r_{i}=0$ is then


    $\mathbb{E}[y_{i}(1)-y_{i}(0) \mid r_{i}=0]=\alpha_{1}-\alpha_{0}. \tag{5.21}$


    This gives you a *conditional* ATE for those subjects whose $r_{i}$ is close to
    zero. The estimated treatment effect corresponds to the gap between potential
    outcomes at the jump in Figure 5.4. You will learn nothing about the fact that
    this gap closes (and potential outcomes even cross) away from this threshold;
    in an RD design, you learn about the treatment effect only at the threshold. This
    is a limitation, but so long as you are aware that you are getting a conditional
