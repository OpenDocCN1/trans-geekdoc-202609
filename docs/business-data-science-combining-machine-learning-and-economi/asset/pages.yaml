    All of the lines in Figure 2.5 have the same slope. In economic terms, the model
    assumes that consumers of the three brands have the same price sensitivity. This
    seems unrealistic: money is less of an issue for Tropicana customers than it is
    for the average Dominick’s consumer. You can build this information into your
    regression by having log price interact with brand.


    An interaction term is the coefficient on the product of two inputs:


    ```

    E[y|x] = ... + βkxk + βjxj + xjxkβjk.  (2.13)

    ```


    In this equation, the effect of a unit increase in xj is βj + xkβjk such that
    it depends upon xk. Interactions are central to scientific and business questions.
    For example:


    +   - Does gender change the effect of education on wages?

    - Do patients recover faster when taking drug X?

    - How does consumer price sensitivity change across brands?


    In each case here, you want to know whether one variable modulates the effect
    of another. You don’t want to know whether women earn less than men (they do:
    just take a simple difference in averages). Rather, you want to know whether they
    are being compensated unequally despite having the same levels'
