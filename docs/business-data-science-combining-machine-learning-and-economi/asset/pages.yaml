  md: 'additional “2SLS” line is a fit that was able to recover the correct price/sales
    relationship from observational data. The analysis behind this line took advantage
    of the available instruments $z$, the random variation in prices.


    ![](img/315929ad4bddd26368466d02e06e2385_219_0.png)


    **FIGURE 5.9:** Illustration of the cartoon demand system. On the left, prices
    were determined endogenously (jointly) with the unobserved demand shocks. On the
    right, prices are determined randomly independent of demand. The two lines labeled
    OLS are OLS fit to each dataset. On the left you also see the 2SLS fit line, which
    matches up closely to the counterfactual OLS fit on the right.


    TWO-STAGE LEAST SQUARES (2SLS) is a simple procedure for recovering causal effects
    from IV variation. Recall the regression equation in Equation 5.23, and take expectation
    of both sides of this equation after conditioning upon the instrument $z$. For
    now, we’ll ignore the covariates $x$ so that $y = g(p) + e$. Taking the conditional
    expectation yields


    $\mathbb{E}[y \mid z] = \mathbb{E}[g(p) \mid z] + \mathbb{E}[e \mid z] = \mathbb{E}[g(p)
    \mid z]. \tag{5.25}$


    This is because $e$ is independent of $z$ (a key feature of an IV) and so $\mathbb{E}[e
    \mid z] = \mathbb{E}[e] = 0$ under the standard assumption of zero-mean errors.
    Thus, given $z$, $y$ has conditional distribution with mean equal to the average
    of $g(p)$ given $z$. Note that $p$ is a random variable in this equation. For
    example, with binary treatment, you have


    $\mathbb{E}[g(p) \mid z] = g(0)\mathbb{P}(p = 0 \mid z) + g(1)\mathbb{P}(p = 1
    \mid z). \tag{5.26}$'
