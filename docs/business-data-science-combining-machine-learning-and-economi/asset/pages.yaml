  md: '![](img/315929ad4bddd26368466d02e06e2385_276_0.png)


    # # Factorization


    One way to think about almost everything we do in data science is as dimension
    reduction. We are trying to learn from high-dimensional $x$ some low-dimensional
    summaries that contain the information necessary to make good decisions.


    Dimension reduction can be supervised or unsupervised. In supervised learning,
    an outside "response" variable $y$ dictates the direction of dimension reduction.
    In regression, a high-dimensional $x$ is projected through coefficients $\beta$
    to create the low-dimensional (univariate) summary $\hat{y}$. Chapters 2–4 were
    all about supervised learning.


    In contrast, for unsupervised learning there is no response or outcome. You have
    a high-dimensional $x$, and you try to model it as having been generated from
    a small number of components. You are attempting to simplify $x$ for its own sake.
    Why? As one example, you might have partially observed values and want to predict
    the unknown entries from those you get to see; this is one way to think about
    "recommender engines." For example, suppose $x$ is a vector where each element
    $x_j$ represents the score on 1 to 10 for how much a user liked "movie" $j$. Netflix
    tries to predict $x_j$ for movies that users haven’t seen from those they have
    watched and scored.


    Another common setting is that you really want to predict $y$ from $x$, but you
    have many observations of $x$ without $y$. For example, you might want to predict
    the sentiment of people from the words in their tweets; you will have a massive
    bank of all tweets (many $x$ observations) but for only a small percentage will
    you know whether they are expressing positive or negative'
  merge: -1
  img_proc: true
