    Each tree in a random forest is instead fit to a resample of the data. Figure
    9.8 illustrates this procedure: each bootstrap sample leads to a slightly different
    CART fit as the more heavily weighted observations (those resampled more times)
    pull on the response surface. Figure 9.9 shows how the sampled CART fits accumulate
    and aggregate---for a forest with many trees, the average becomes a smooth (or
    mostly smooth) surface even though the constituent trees all imply jagg ed prediction
    surfaces. We recall here the Bayesian interpretation of a forest as a posterior
    over trees, such that the distribution of bootstrap CART fits is the distribution
    for your “best” tree fit. Notice the adaptive uncertainty bounds in Figure 9.9:
    there is little uncertainty about $\mathbb{E}[y|x]$ at the edges of the time grid,
    but large amounts of uncertainty during the backward-forward acceleration in the
    middle.'
