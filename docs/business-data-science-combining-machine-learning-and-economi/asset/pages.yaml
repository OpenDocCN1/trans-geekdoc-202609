  md: 'algorithms, but we are using it to refer to the full area of active data collection.


    The general problem can be formulated as a reward maximization task. You have
    some policy or “action” function, $d(x_t; \Omega)$, that dictates how the system
    responds to “event” $t$ with characteristics $x_t$. The event could be a customer
    arriving on your website at a specific time, a scenario in a video game, and so
    on. After the event, you observe “response” $y_t$, and the reward is calculated
    as $r(d(x_t; \Omega), y_t)$. During this process you are accumulating data and
    *learning* the parameters $\Omega$, so you can write $\Omega_t$ as the parameters
    used at event $t$. The goal is that this learning converges to some optimal reward-maximizing
    parametrization, say $\Omega^*$, and that this happens after some $T$ events where
    $T$ is not too big—i.e., so that you *minimize regret*:


    ```

    $$\sum_{t=1}^{T}\left[r\left(d\left(x_{t} ; \Omega^{*}\right), y_{t}\right)-r\left(d\left(x_{t}
    ; \Omega_{t}\right), y_{t}\right)\right]. \tag{10.11}$$

    ```


    This is a general formulation. We can map it to some familiar scenarios. For example,
    suppose that the event $t$ is a user landing on your website. You would like to
    show a banner advertisement on the landing page, and you want to show the ad that
    has the highest probability of getting clicked by the user. Suppose that there
    are $J$ different possible ads you can show, such that the action $d_t = d(x_t;
    \Omega_t) \in \{1, \dots, J\}$ is the one chosen for display. The final reward
    is $y_t = 1$ if the user clicks the ad and $y_t = 0$ otherwise. ⁴²


    This specific scenario is a *multi-armed bandit* (MAB) setup, so named by analogy
    to a casino with many slot machines of different pay-out probabilities (the casino
    is the bandit). In the classic MAB (or simply *bandit*) problem, there are no
    covariates associated with each ad and each user, such that you are attempting
    to optimize toward a single ad that has highest click probability across all users.
    That is, $\omega_j = p(y_t = 1 \mid d_t = j)$, the generic click probability for
    ad $j$, and you want to set $d_t$ to the ad with highest $\omega_j$. There are
    many different algorithms for bandit optimization. They use different heuristics
    to balance *exploitation* with *exploration*. A fully exploitive algorithm is
    greedy: it always takes the currently estimated best option without any consideration
    of uncertainty. In the simple advertising example, this implies always converging
    to the first ad that ever gets clicked. A fully exploratory algorithm always randomizes
    the ads, and it will never converge to a single optimum. The trick to bandit learning
    is finding a way to balance between these two extremes.'
