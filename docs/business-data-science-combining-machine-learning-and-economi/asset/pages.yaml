    $\hat{\hat{f}}$ (*white*) = 2/3.


    ![](img/315929ad4bddd26368466d02e06e2385_154_0.png)


    FIGURE 4.1: *K*-NN illustration. The black point is the *x* location where you''d
    like to predict a class label, and the other points have class label denoted by
    color (dark gray, light gray, or white).


    > Since distance is measured on the raw *x* values, units matter. As we did for
    regularization, we will default to using units of *standard deviation* for *K*-NN
    distance calculations. R''s *scale* function can be used to transform from $\bar{\mathbf{x}}_j
    = \mathbf{x}_j / \mathbf{sd}(\mathbf{x}_j)$, which can then be input to a *K*-NN
    algorithm.


    # **ALGORITHM 11** *K* Nearest Neighbors


    Given input vector *xf* where you would like to predict the class label, find
    the *K* nearest neighbors in the dataset of labeled observations, $\{[\mathbf{x}_i,
    \ y_i]\}_{i=1}^{n}$, where nearness is measured in Euclidean distance:


    ```

    $d(\mathbf{x}_i, \mathbf{x}_f) = \sqrt{\sum_{j=1}^{p} (x_{ij} - x_{fj})^2}$

    ```


    This yields a set of the *K* nearest observations with labels:


    ```

    $[x_{i1}, y_{i1}] \ . . . \ [x_{iK}, y_{iK}]$.

    ```'
