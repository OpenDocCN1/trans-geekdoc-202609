    FIGURE 3.6: A Lasso path plot for the browser data. The regularization path algorithm
    proceeds from right to left, with decreasing $\lambda_i$.


    This picture and the underlying path estimation were executed using the gamlr
    package for R. You will use this package heavily; it provides fast and reliable
