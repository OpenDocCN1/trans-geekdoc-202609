  md: 'A classic bandit algorithm, and one that gives solid intuition into RL in general,
    is Thompson sampling.44 Like many tools in RL, Thompson sampling uses Bayesian
    inference to model the accumulation of knowledge over time. The basic idea is
    simple: at any point in the optimization process you have a probability distribution
    over the vector of click rates, $\omega = [\omega_1 \dots \omega_J]$, and you
    want to show each ad $j$ in proportion to the probability that $\omega_j$ is the
    largest click rate. That is, with $y_t = \{y_s\}_{t s=1}$ denoting observed responses
    at time $t$, you want each ad''s selection probability to be equal to the posterior
    probability that it is the best choice:


    $\mathrm{p}\left(d_{t+1}=j\right)=\mathrm{p}\left(\omega_{j}=\max \left\{\omega_{k}\right\}_{k=1}^{J}
    \mid y^{t}\right)$ (10.12)


    Since the probability in Equation 10.12 is tough to calculate in practice (the
    probability of a maximum is not an easy object to analyze), Thompson sampling
    uses Monte Carlo estimation. You draw a sample of ad-click probabilities from
    the posterior distribution at time $t$,


    $\mathbf{w}_{t+1} \sim \mathrm{p}\left(\mathbf{w} \mid y^{t}\right)$ (10.13)


    and set $d_{t+1}=\operatorname{argmax}_{j} w_{t+1, j}$. For example, suppose that
    you have a Beta(1, 1) prior on each ad''s click rate (i.e., a uniform distribution
    between zero and one). At time $t$, the posterior distribution for the $j$th ad''s
    click rate is


    $\mathrm{p}\left(\omega_{j} \mid d^{t}, y^{t}\right)=\text { Beta }\left(1+\sum_{s=1}^{t}
    1_{\left[d_{s}=j\right]} y_{s}, 1+\sum_{s=1}^{t} 1_{\left[d_{s}=j\right]}\left(1-y_{s}\right)\right)$
    (10.14)


    A Thompson sampling algorithm draws $w_{t+1, j}$ from Equation 10.14 for each
    $j$ and then shows the ad with highest sampled click rate.


    Why does this work? Think about scenarios where an ad $j$ would be shown at time
    $t-$ in other words, when the sampled $\omega_{j j}$ is largest. This can occur
    if there is a lot of uncertainty about $\omega_{j}$, in which case high probabilities
    have nontrivial posterior weight, or if the expected value of $\omega_{j}$ is
    high. Thus, Thompson sampling will naturally balance between exploration and exploitation.
    There are many other algorithms for obtaining this balance. For example, Agarwal
    et al. [2014] survey methods that work well in the *contextual* bandit setting
    where you have covariates attached to events (such that action-payoff probabilities
    are event-specific). The options considered include $\epsilon$-greedy search,
    which finds a predicted optimal choice and explores'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'within a neighborhood of that optimum, and a bootstrap-based algorithm that
    is effectively a nonparametric version of Thompson sampling.


    Another large literature looks at so-called Bayesian optimization.$^{45}$ In these
    algorithms, you have an unknown function *r*(*x*) that you’d like to maximize.
    This function is modeled using some type of flexible Bayesian regression model,
    e.g., a Gaussian process. As you accumulate data, you have a posterior over the
    “response surface” *r*(*x*) at all potential input locations. Suppose that, after
    *t* function realizations, you have observed a maximal value *r*_{max}. This is
    your current best option, but you want to continue exploring to see whether you
    can find a higher maximum. The Bayesian optimization update is based on the *expected
    improvement* statistic:


    E[max(0, *r*(*x*) − *r*_{max})].  (10.15)


    This is the posterior expectation of improvement at new location *x*, thresholded
    below at *zero*. The algorithm evaluates Equation 10.15 over a grid of potential
    *x* locations, and you choose to evaluate *r*(*x*_{*t*+1}) at the location *x*_{*t*+1}
    with highest expected improvement. Again, this balances exploitation with exploration:
    the statistic in Equation 10.15 can be high if *r*(*x*) has high variance or a
    high mean (or both).


    These RL algorithms are all described in the language of optimization, but it
    is possible to map many learning tasks to optimization problems. For example,
    the term *active learning* is usually used to refer to algorithms that choose
    data to minimize some estimation variance (e.g., the average prediction error
    for a regression function over a fixed input distribution). Suppose *f*(*x*; Ω)
    is the regression function, attempting to predict response *y*. Then the *action*
    function is simply prediction, *d*(*x*; Ω) = *f*(*x*; Ω), and the optimization
    goal could be to minimize the squared error—i.e., to maximize *r*(*d*(*x*; Ω),
    *y*) = − (*y* − *f*(*x*; Ω))$_{2}$. In this way, active learning problems are
    special cases of the RL framework.


    From a business and economic perspective, RL is interesting (beyond its obvious
    usefulness) for assigning a *value* to new data points. In many settings, the
    rewards can be mapped to actual monetary value (e.g., in the advertising example
    where the website receives revenue-per-click). RL algorithms assign a dollar value
    to data observations. There is a growing literature on markets for data, including
    the “data-is-labor” proposal in Lanier [2014]. It seems useful for future study
    in this area to take account of how currently deployed AI systems assign relative
    data value. As a high-level point, the valuation of data in RL depends upon the
    *action* options and'
  merge: -1
  img_proc: true
- pgno: 415
  md: 'potential *rewards* associated with these actions. The value of data is defined
    only in a specific context.


    The bandit algorithms described earlier are vastly simplified in comparison to
    the type of RL that is deployed as part of a deep learning system. In practice,
    when using RL with complex flexible functions like DNNs, you need to be careful
    to avoid overexploitation and early convergence.46 It is also impossible to do
    a comprehensive search through the super high-dimensional space of possible values
    for the $\Omega$ that parametrizes a DNN. However, approaches such as that in
    van Seijen et al. [2017] and Silver et al. [2017] show that if you impose *structure*
    on the full learning problem, then it can be broken into a number of simple composite
    tasks, each of which is solvable with RL. As we discussed earlier, there is an
    undeniable advantage to having large fixed data assets that you can use to hot-start
    the AI (e.g., data from a search engine or social media platform). But the exploration
    and active data collection of RL is essential when tuning an AI system to be successful
    in specific contexts. These systems are taking actions and setting policy in an
    uncertain and dynamic world. As statisticians, scientists, and economists are
    well aware, without constant experimentation it is not possible to learn and improve.


    # AI IN CONTEXT


    This chapter provided a primer on the key ingredients of AI. We have also been
    pushing some general points. First, the current wave of ML-driven AI should be
    viewed as a new class of products growing up around a new general-purpose technology:
    large-scale, fast, and robust machine learning. AI is not machine learning, but
    general purpose ML—specifically, deep learning—is the electric motor of AI. These
    ML tools are going to continue to get better, faster, and cheaper. Hardware and
    big data resources are adapting to the demands of DNNs, and self-service ML solutions
    are available on all of the major cloud computing platforms. Trained DNNs might
    become a commodity in the near-term future, and the market for deep learning could
    get wrapped up in the larger battle over market share in cloud computing services.


    Second, we are still waiting for true end-to-end business AI solutions that drive
    a real increase in productivity. AI’s current “wins” are mostly limited to settings
    with high amounts of explicit structure, such as board and video games.47 This
    is changing, as companies like Microsoft and Amazon produce semi-autonomous systems
    that can engage with real business problems.48 But'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'there is still much work to be done, and the advances will be made by those
    who can impose structure on these complex business problems. That is, for business
    AI to succeed, you need to combine the GPML and big data with people who know
    the rules of the “game” in their business domain.


    Finally, all of this will have significant implications for the role of science
    in industry. The economists, social scientists, and finance professionals are
    the people who can provide structure and rules around messy business scenarios.
    For example, a good structural econometrician $^{49}$ uses economic theory to
    break a complex question into a set of *measurable* (i.e., identified) equations
    with parameters that can be estimated from data. In many settings, this is *exactly*
    the type of workflow required for AI. The difference is that, instead of being
    limited to basic linear regression, these measurable pieces of the system will
    be modeled via DNNs that can actively experiment and generate their own training
    data. The next generation of economists and business scientists needs to be comfortable
    in knowing how to apply economic theory to obtain such structure and how to translate
    this structure into recipes that can be automated with ML and RL. Just as big
    data led to data science, a discipline combining statistics and computer science,
    moving from business data science to business AI will require interdisciplinary
    pioneers who can combine economics, statistics, and machine learning.


