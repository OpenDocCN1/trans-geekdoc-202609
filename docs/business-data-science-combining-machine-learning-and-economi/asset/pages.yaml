  md: 'to get a new sample of observations, from the same data-generating process,
    what is the probability distribution on the new sample average?" This is what
    is referred to as frequentist uncertainty. It is the sort of uncertainty you have
    seen in basic statistics classes. For example, consider this common description
    of a confidence interval:


    > > The poll predicts that 49% of eligible voters would currently vote yes; this
    number is accurate within ±3 percentage points 19 times out of 20.


    This statement describes how an estimated total vote changes under the thought
    experiment of repeatedly polling a different random set of voters. Similarly,
    the familiar hypothesis-testing logic—"reject if p-value is less than 0.05"—corresponds
    to a rule that rejects a null hypotheses mean μ0 if it falls too far into the
    tails of the sampling distribution in Figure 1.2.


    THE BOOTSTRAP is a computational algorithm for constructing sampling distributions.
    We will use the bootstrap because the theoretical sampling distributions that
    are relied upon for much of classical statistics—Gaussian distributions derived
    from the CLT, as in Figure 1.2—are not valid for the complex settings encountered
    in business data science. The need for a different approach arises mostly because
    there are stages of model building that aren''t considered in the classical formulas
    (e.g., variable selection, computational approximation), and the uncertainty in
    these steps needs to be propagated through to your final analysis. In addition,
    when the number of model parameters is large relative to the number of observations,
    the CLT will give a poor representation of real-world performance.


    Instead of relying on theoretical approximation, the bootstrap uses resampling
    from your current sample to mimic the sampling distribution. Recall our definition
    for the sampling distribution: it is the distribution on an estimator—say, β̂—that
    we get by re-estimating β on each of multiple datasets of size n from the population.
    Figure 1.3 illustrates this process.'
