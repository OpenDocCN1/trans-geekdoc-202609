    2.9


    Therefore, each unit increase in $x$ leads $y$ to be *multiplied* by the factor
    $e^{\beta}.$


    How will you know when variables should be modeled as changing multiplicatively?
    One indicator is everyday language. Be on the lookout for variables whose change
    is usually expressed in percentage rather than absolute terms. For example, these
    are both typically modeled in log space:


    +   - Prices: “*Foreclosed homes sell at a 20% to 30% discount.*”

    - Sales: “*Your y.o.y. sales are up 20% across models.*”


    More generally, variables that are strictly non-negative (e.g., volatility, counts
    of errors or events, rainfall) are often treated as changing linearly on a log
    scale.


    Another common scenario models against each other two variables that *both* move
    multiplicatively. For example, **Figure 2.4** shows the national GDP versus imports
    for several countries. Fitting a line to the left panel would be silly; its slope
    will be entirely determined by small changes in the U.S. values. In contrast,
    the right panel shows that in log space, the GDP and imports follow a neat linear
    relationship.


