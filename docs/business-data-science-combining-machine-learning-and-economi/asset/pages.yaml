  md: 'focus frees them to worry less about the structure of the model on the right
    side of Equation I.2 and allows rapid experimentation on alternative models and
    estimation algorithms. The result is that ML has seen massive success, to the
    point that you can now expect to have available for almost any type of data an
    algorithm that will work out of the box to recognize patterns and give high-quality
    predictions.


    Of course, prediction has its limits. ML algorithms learn to predict a future
    that is mostly like the past. In the previous example, ML will discern what web
    traffic tends to spend more or less money. It will not tell you what *will* happen
    to the spending if you *change* a group of those websites or perhaps make it easier
    for people to browse the web (e.g., by subsidizing broadband). This limitation
    is most explicitly emphasized in the economics literature, where one characterization
    of it is named the *Lucas critique* in honor of Robert Lucas from the University
    of Chicago. Lucas won his Nobel Prize for work in macroeconomics, including work
    that argued against the then common practice of using past correlations of macroeconomic
    variables to guide policy-making (e.g., lower inflation accompanies higher unemployment,
    so you can drop interest rates to create jobs). Instead, he argued that unless
    you model the macroeconomy *structurally*—as derived from an economic theory foundation—then
    you cannot properly understand how individual policy changes will affect the full
    system.


    So, prediction doesn''t solve everything. However, structural analysis relies
    upon having strong prediction capabilities. You need to use domain structure to
    break complicated questions into a bunch of prediction tasks, that is, into a
    bunch of tasks that can be solved with "dumb" off-the-shelf ML tools. Good data
    science is all about figuring out what you can outsource as a prediction task
    and reserving your statistical and economic efforts for the tough structural questions.
    This typically involves a mix of domain knowledge and analysis tools, which is
    what makes the business data scientist such a powerful figure. The ML tools are
    useless for policy-making without an understanding of the business problems, but
    a policy-maker who can deploy ML to solve the many prediction tasks that they
    face will be able to automate and accelerate their decision processes.$^{6}$


    Some of the material in this book will be focused on pure prediction and pattern
    recognition. This is especially true in the earlier chapters on regression, classification,
    and regularization. However, in later chapters you will use these prediction tools
    as parts of more complicated structural analyses, such as understanding subject-specific
    treatment effects, fitting consumer demand functions, or as part of an artificial
    intelligence system. Throughout, we''ll mention the limits of individual tools
    and recommend how'
