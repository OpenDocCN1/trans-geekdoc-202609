    This succeeds despite the fact that naive regression of sales on prices yielded
    a completely different (wrong) model.


    THE OREGON INSURANCE EXPERIMENT, which we looked at to start this chapter, is
    actually an intent-to-treat setup. Although *access* to Medicaid insurance was
    randomized through the state’s lottery, not all of those who became eligible for
    Medicaid took advantage of this and enrolled. For some people the enrollment process
    was just too inconvenient, and others likely had alternative insurance available.
    Thus, the earlier results describe not the treatment effect of enrolling in Medicaid
    but rather the indirect effect of expanded access. We can refine these results
    through an IV analysis.


    As in our earlier analysis of the OHIE, the response of interest is $y_{i}=1$
    if the subject visited a primary care physician (PCP) and $y_{i}=0$ otherwise.
    The treatment of interest was access to Medicaid health insurance. Now, this access
    to insurance will be the instrument $z=1$ for those *selected* for enrollment
    and $z=0$ otherwise. Our new treatment, $p$, is whether the patient actually *enrolls*
    in Medicaid. Since the $z$ is randomized (assigned in a lottery)'
