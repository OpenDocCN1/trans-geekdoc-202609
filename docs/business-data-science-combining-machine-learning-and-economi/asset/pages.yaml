- pgno: 137
  md: "2014 seasons of the National Hockey League (NHL). You can type `?hockey` to\
    \ get details and references to papers on this (obviously super-important) subject.11\n\
    \nThe motivation here is to build an improved version of the player “plus-minus”\
    \ (PM), a common hockey performance metric. The classic PM is a function of goals\
    \ scored while that player is on the ice: the number of goals for his team minus\
    \ the number against. The limits of this approach are obvious: there is no accounting\
    \ for teammates or opponents. In hockey, where players tend to be grouped together\
    \ on “lines” and coaches will “line match” against opponents, a player’s PM can\
    \ be artificially inflated or deflated by the play of his opponents and peers.\n\
    \nCan we build a better performance metric with regression? Consider constructing\
    \ a binary response for every goal, equal to 1 for home-team goals and 0 for away-team\
    \ goals.\n\n```\n> head (goal)\nhomegoal season team.away team.home period differential\
    \ playoffs\n1 0 20022003 DAL EDM 1 0 0\n2 0 20022003 DAL EDM 1 -1 0\n3 1 20022003\
    \ DAL EDM 2 -2 0\n4 0 20022003 DAL EDM 2 -1 0\n5 1 20022003 DAL EDM 3 -2 0\n6\
    \ 1 20022003 DAL EDM 3 -1 0\n```\n\nWe can then regress this onto dummy variables\
    \ indicating who was on the ice, where home-team players get a value of +1 and\
