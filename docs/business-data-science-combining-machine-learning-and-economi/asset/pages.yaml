- pgno: 228
  md: '![](img/315929ad4bddd26368466d02e06e2385_228_0.png)


    # Controls


    Life is easy if you have an experiment. Be it a completely randomized $AB$ trial,
    a near experimental design, or an instrumental variables scenario: explicit randomization
    allows you to model the effect of moving the treatment variable independently
    from the other covariates. This is the key to counterfactual modeling: since you
    will be acting to apply treatment, you need to know how the response changes with
    independent movement in this variable.


    Unfortunately, life doesn’t always give you experiments. In business, it is typical
    that you will be asked to make a decision about future actions based upon historical
    data without the benefit of explicit randomization. Analysis of such data is referred
    to as an observational study. Instead of running an experiment where you get to
    set the treatment, you are stuck observing what happened. In such settings, counterfactual
    estimation depends upon the assumption of conditional ignorability: that you have
    tracked and can control for all confounding co-influences on treatment $d$ and
    response $y$.


    The process of choosing controls is subjective and labor intensive. Applied economics
    discussions are dominated by debates over whether all of the important factors
    have been controlled. Some of this subjectivity and debate is unavoidable: causal
    inference without experiments is hard. But there are basic recipes and best principles
    that will help you stay within the bounds of believability. There are also ways
    that you can use tools from machine learning to help with parts of the process;
    this will be increasingly important as you look to automate and accelerate business
    decision-making.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'This chapter deals with all of the various approaches to counterfactual analysis
    under an assumption of conditional ignorability (CI). In the next section, we
    detail the CI assumption and explain how it works with familiar low-dimensional
    regression models. We then introduce a specific “partial linear” treatment effects
    model and show how ML tools can be used to orthogon alize against high-dimensional
    controls. This technique will be extended for modeling of heterogeneous treatment
    effects, an idea we illustrate in the context of consumer demand estimation. Finally,
    we describe the method of synthetic controls, sometimes referred to as nowcasting
    in the technology industry.


    # CONDITIONAL IGNORABILITY AND LINEAR TREATMENT EFFECTS


    Conditional ignorability (CI) implies that you observe all of the variables that
    influence both the treatment and the response. Whenever you hear a causal statement
    that includes “after controlling for other factors,” there is an implicit assumption
    of conditional ignorability. For example, the following is from The Economist
    on December 23, 2017:


    > A study of 240,000 children in 29 African countries found that, after controlling
    for other factors, those in polygamous families were more likely to die young.


    Unfortunately, conditional ignorability typically requires a leap of faith. In
    most settings, it is unrealistic that you have managed to observe all factors
    influencing both the treatment and the response (both polygamy and child health).
    Instead, you hope that you have controlled for enough of the main factors so that
    your results are believable.


    To make things precise, the CI assumption is often introduced via potential outcomes
    notation. Recall that each individual $i$ has a potential outcome, $y_{i}(d)$,
    corresponding to each treatment status, say, $d=0$ or $d=1$. You don’t observe
    $y_{i}(d)$ for all $d$, only for $d_{i}$: the observed treatment status for observation
    $i$. Conditional ignorability is expressed as


    $\{y_{i}(d) \forall d\} \perp\!\!\perp d_{i} | \boldsymbol{x}_{i}.$ (6.1)


    This says that all of the potential outcomes $y_{i}(d)$ are independent from $d_{i}$
    given the controls $\boldsymbol{x}_{i}$. That is, after conditioning on all of
    the information in $\boldsymbol{x}_{i}$,'
