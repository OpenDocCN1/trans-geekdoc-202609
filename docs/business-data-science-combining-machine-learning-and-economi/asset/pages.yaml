    AS A MORE COMPLEX EXAMPLE, CONSIDER A PC ANALYSIS OF HOW MEMBERS OF THE U.S. CONGRESS
    VOTE. In particular, we are going to look at the Congressional Record for *roll-call
    votes*—those votes where attendance is taken and every individual’s vote is added
    to the Congressional Record. These are archived on the website voterview.com,
    and the R package psci has tools for extracting and manipulating this data. The
    set of votes that we are going to look at come from the 111th Congress covering
    2009 to 2010, the first two years of Barack Obama’s presidency. There were 445
    voting members in the U.S. House of Representatives for this Congress, and we
    have recorded their votes on 1647 questions as $-1$ for nea, $+1$ for yea, and
    0 for those who abstained or were absent. This leads to a large $445 \times 1647$
    matrix with rows $x_{i}$ representing the voting record for politician $i$.


    > You might ask why you would use least-squares to fit models to $\{-1,0,1\}$
    data, as implied by the Gaussian interpretation of PCA in Equation 7.8. Good question!
    In the next chapter, we discuss multimnomial factor models. However, PCA works
    fine in many non-Gaussian settings since it can also be interpreted as simply
    maximizing factor variances, as in Algorithm 18.


    There is intuitive support for a low-dimensional factor structure in this setting.
    Although each of the votes are on different issues, the individual voters are
    aligned upon partisan and ideological axes—e.g., Republican versus Democrat or
    liberal versus conservative. If you believe that all votes'
