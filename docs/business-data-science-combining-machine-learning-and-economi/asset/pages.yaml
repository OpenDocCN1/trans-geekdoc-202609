- pgno: 178
  md: 'parallel but also *distributed*, and the difference between these terms is
    key to large-scale computing.


    # # DISTRIBUTION AND BIG DATA


    An algorithm is *parallel* if it does many computations at once. When each of
    these calculations needs to see all of the same data, the algorithm is merely
    parallel. When each computation is able to work with a subset of the data, the
    algorithm is *distributed*. Parallel computing is good for intensive computation,
    but for true big data you need distributed algorithms. Indeed, the oldest use
    of the term *big data* referred to datasets that were too big to be stored on
    a single machine—thus distributed algorithms were necessary for any analysis.


    The idea behind contemporary big data storage and analysis is to *shard* your
    data into many little pieces on many machines. You then take advantage of massive
    bandwidth to allow communication between these machines during analysis. Systems
    such as Hadoop HDFS, Amazon''s S3 (see Figure 4.12), or Microsoft''s Azure Blob
    Storage split your data into little pieces (e.g., 64KB of a file) that are kept
    wherever is convenient (to protect against data loss, pieces of data are often
    kept in more than one place). As the end user, you interact only with a map of
    where things are.


    ![](img/315929ad4bddd26368466d02e06e2385_178_0.png)


    FIGURE 4.12: An Amazon S3 console, which looks like a standard file browser, but
    the file content is distributed across machines (or even across data centers).'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'This model was originally built around unstructured data, such as text and
    images, that benefited less from being stored locally in a structured database
    with columns and fixed entry sizes. But the distributed storage model is essential
    to cloud computing, and it now provides the underlying logic for a vast proportion
    of the world''s data (especially business data). There are plenty of algorithms
    that have been developed to facilitate statistical analysis on these massive distributed
    datasets. Many fit within a framework known as MapReduce (MR), a simple but powerful
    recipe for algorithms that was popularized in 2004 by researchers at Google.10
    To use MapReduce, you need to be able to specify a key that indexes subgroups
    of data that can be analyzed in isolation.


    # **ALGORITHM 12** MapReduce Framework


    Given a key indexing data to subgroups, you proceed to do the following:


    +   - map: Calculate and sort relevant statistics by key.

    - Partition and pipe the outcome of map so that outcomes with the same key end
    up on the same machine.

    - reduce: Apply a summarization operation within the subgroup defined by each
    key.


    As a simple example, imagine the task of tabulating word occurrence by date across
    a large database of documents (e.g., books, magazines, newspapers). The MapReduce
    routine is applied on the distributed corpus of documents:


    +   - Apply a map operation for each document, extracting the date and counts
    for each word. The mapper outputs multiple lines containing date|word count. Here''s
    an example if the document uses the word “tacos” five times on June 4, 2017:


    ```

    2017/06/04|tacos 5

    ```


    +   - The key in this example is date|word, for example,

    2017/06/04|tacos. The data is sorted and streamed so that each line with the same
    key ends up on the same reducer machine.

    - reduce all lines with the same key using the sum operator, such that the output
    is a single line per key: date|word total. Here''s an example if tacos was used
    501 times across all documents on June 4, 2017:'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'This simple example can be extended into a number of more complex schemes.
    For example, the DMR algorithm is distributed with respect to the response counts:
    each regression need only see $y_{ik}$ for its respective category $k$. In the
    case of txt regression, $k$ refers to a word in a vocabulary. Consider the example
    where you are looking to understand how some time-dependent variables--for example,
    market data or political events--affect language choice. If this is a relatively
    small set of variables, the full design matrix will be small enough to pass among
    many machines. For example, you might have the following reported returns in the
    S&P 500 and VIX financial market indices on each date:


    ```

    $\mathbf{X} = \left[ \begin{array}{ccc} \text{date} & \text{SP500} & \text{VIX}
    \\ 2017/06/02 & 0.0037 & -0.0142 \\ \vdots & \vdots & \vdots \end{array} \right].
    \tag{4.14}$

    ```


    The MapReduce version of DMR is then as follows:


    +   * map and partition exactly as described earlier in the word-count MR so that
    all counts for the same date|word key go to the same machine.

    * Broadcast your set of date-indexed covariates so that every reducer machine
    contains a copy of $X$.

    * reduce using a Poisson regression for the word counts onto the corresponding
