    | anychildren | 0.08216 | 0.03380 | 2.431 | 0.0151 * |


    What do t value and Pr(> | t |) mean? Why the ***? Most readers will recognize
    these as the artifacts of *hypothesis testing*.


    P(event) is how R denotes a probability function that maps from an event to its
    probability. We write this as p(event). We overload notation and use the same
    “p” symbol for both probability mass functions (for discrete events) and for probability
    density functions (for continuous events).


    A hypothesis test is a tool for deciding between two qualitatively different realities.
    One option will be the *null* hypothesis, which should be your “safe bet.” It
    is the status quo or stable option and typically corresponds to setting a parameter
    equal to zero. The *alternative* hypothesis will be a set of possible values.
    When you “reject the null” in favor of the alternative, you will end up working
    with the sample estimate for some parameter.


    The decision between null and alternative hypotheses is based upon a *sample statistic*
    that measures the distance between the null reality and your sampled parameter
    estimates. For a test of the null hypothesis *$\beta$ = 0* versus the alternative
    hypothesis *$\beta$ ≠ 0*, your test statistic is z$\beta$ = $\betâ$ / se($\betâ$).
    It tells you how far away your sample estimate is from zero as measured in standard
    errors (i.e., standard deviations of the sampling distribution). This is what
    is labeled as t value in the regression output, but we’ll call it a z *statistic*.


    A hypothesis test translates this test statistic into a probability called a *p*-value
    that represents how rare, or strange, your sample would be *if* the null hypothesis
    is true. This *p*-value gives you the probability of seeing a larger test statistic
    than what you’ve observed. Or, from another perspective, it is the proportion
    of times that you would wrongly reject your safe null if the test statistic you’ve
    observed is enough to lead you to adopt the alternative.


    In the regression example, the *p*-value is p (*|Z| > |z$\beta$|*) where *Z* ~
    N(0, 1). The normality of Z comes again from the central limit theorem: the standard
    deviation is equal to 1 because we’ve divided by the standard error, and the center
    at 0 is our null hypothesis assumption. As illustrated in *Figure 1.8*, the *p*-value
    measures the probability mass in the tails past your observed test statistic.'
