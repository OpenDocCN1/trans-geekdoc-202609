  md: 'application, you are better off simply throwing away every 15th chip instead
    of using some process based upon your overfit full model.


    ![](img/315929ad4bddd26368466d02e06e2385_114_0.png)


    FIGURE 3.3: OOS $R_2$ for both full (200 signal) and cut (25 signal) semiconductor
    logistic regressions.


    You may have never seen a negative $R_2$ before. If so, it is because you have
    been looking only at in-sample performance. Out-of-sample, negative $R_2$ are
    unfortunately more common than you might expect. In this case, the average OOS
    $R_2$ are $-6.5$ for the full model (or $-650\%$) and a positive $0.09$ for the
    cut model. So, while the cut-model’s performance is lower OOS than IS (about $1/2$),
    it still manages to do $9\%$ better than the null.


    This example is a dramatic demonstration of the basic principle: *all that matters
    is out-of-sample $R_2$*. You don’t care about in-sample $R_2$, because you can
    get better numbers simply by adding junk variables and inducing overfit. Using
    OOS experiments to choose the best model is called *cross validation*. It will
    play a big role in this text, since using data in selection of “the best” model
    is at the core of all modern analytics. But before getting to selection, you first
    need strategies to build good sets of candidate models from which to choose.


    > Note that we’ve cheated here: the full sample was used to choose the 25 variables
    that are in the cut model. A true OOS experiment would have done FDR control *inside*
    the for loop, such that the OOS results are a validation of the end-to-end selection
    procedure. As a general rule, for anything that you do to the data, do it without
    the left-out fold if you want to get an accurate assessment of OOS performance.'
  merge: -1
