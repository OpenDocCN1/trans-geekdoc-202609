  md: 'argument importance="impurity", ranger tracks each $\mathcal{T}_{b}$''s predictive
    performance on the *out-of-bag* sample— the observations that were not included
    in the *bth* resample. These errors are paired with information about which variables
    are split upon in each tree. This yields a `variable.importance` statistic: the
    increase in error that occurs when that variable is *not* used to define tree
    splits. We can sort variables by their importance for our house price example:


    ```

    > sort(car$variable.importance, decreasing=TRUE)

    medianIncome    latitude     longitude    AveOccupancy

    2354.6238        981.3186     932.0298      607.6977


    AveRooms     housingMedianAge    AveBdrms    households

    574.0029     213.4008             166.4089    122.2114


    population

    106.6222

    ```


    The most important variable is median income, followed by geographic location.
    This matches up with the first few splits in the CART tree of Figure 9.11. It
    is a bit surprising that occupancy rates are the next most important input; this
    variable must feature commonly on deep splits in the bootstrap sample trees. However,
    I caution against putting too much weight on variable importance statistics—there
    are lots of things happening in the forest, and it is of limited utility to try
    to interpret the “importance” of a variable without understanding how it acts
    on the response.


    Figure 9.12 shows in-sample residuals for the tree and forest, along with those
    from lasso on a linear design that interacts latitude and longitude with each
    other and with all other inputs. The in-sample residuals are largest for this
    linear model, followed by CART and then by RF. The RF residuals are much smaller
    than for the other two methods—large errors have disappeared apart from a few
    underestimates around Los Angeles and the San Francisco Bay Area. The RF is not
    overfitting; this in-sample fit corresponds to a real out-of-sample improvement
    in predictive performance. Figure 9.13 shows the OOS log errors for each regression,
    and we see that the RFs are a persistent large improvement over the other methods.'
