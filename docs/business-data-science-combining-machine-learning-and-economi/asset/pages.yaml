    of CART: the tree is able to follow a nonlinear mean with highly variable noise
    (e.g., noise at impact is low relative to the noise after whiplash).


    ![](img/315929ad4bddd26368466d02e06e2385_368_0.png)


    FIGURE 9.7: CART fit for the motorcycle data. The dendrogram on the left corresponds
