  md: 'difference-in-means method of treatment effect estimation is generally seen
    as a bad idea for RD designs. It is typical that the response changes with the
    forcing variable independent of treatment—think about all of the RD examples cited
    earlier—and you thus need to control for this effect on either side of the threshold.


    A better approach is to use localized linear regression. That is, you fit an ordinary
    least squares line in a window of $\pm\delta$ on either side of the threshold.
    This is exactly the procedure we previewed earlier in Equation 5.20. With use
    of interaction terms, we can write this system of two regressions as a single
    model:


    ```

    $\begin{array}{r}{\mathbb{E}[y_{i}]=\alpha+\gamma\mathbb{1}_{[r_{i}>0]}+r_{i}\left(\beta_{0}+\beta_{1}\mathbb{1}_{[r_{i}>0]}\right)}\\{=\alpha+\gamma
    d_{i}+r_{i}\left(\beta_{0}+\beta_{1}d_{i}\right).}\end{array}\tag{5.22}$

    ```


    The treatment effect in Equation 5.22 is $\gamma$, equivalent to $\alpha_{1}-\alpha_{0}$
    in the formulation of Equation 5.20. Note again that this assumes specification
    such that the threshold—hence discontinuity—occurs at $r_{i}=0$.


    Also common in the literature is weighted least-squares regression on either side
    of the threshold with weights on observations that are decreasing with distance
    from the threshold. This can make the inferences less sensitive to the choice
    of window size; however, it introduces new parameters to tune (e.g., the decay
    rate in weights), and in practice we don''t see a big advantage to the more complicated
    approach. The Loess smoother in Figure 5.6 is an example of a weighted least-squares
    fit.'
