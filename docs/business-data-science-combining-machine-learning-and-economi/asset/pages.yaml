    +   ◇ WHY DOES THE BH ALGORITHM WORK? The explanation requires a bit of probability
    theory. First, you know that p-values from true null signals are uniformly distributed.
    To see this, consider a random p-value p(Z) corresponding to a test statistic
    Z drawn from the null hypothesis distribution. The cumulative distribution function
    for p(Z) is then p(p(Z) < p(z)) for any p(z) ∈ (0, 1). This implies that


    $$ \mathbf { p } ( \mathbf { p } ( Z ) < \mathbf { p } ( z ) ) = \mathbf { p }
    ( | Z | < | z | ) = \mathbf { p } ( z ) \tag { 1.8 } $$


    such that a null p-value is a random variable U where $ \mathbf { p } ( U < u
    ) = u $. This is the definition of a uniform random variable—in particular, a
    U(0, 1) random variable, with density shown in Figure 1.10.'
