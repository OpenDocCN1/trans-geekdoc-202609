  md: 'The baseline treatment effect is now a 9% increase in PCP visit rates.¹¹ But
    there are large sources of heterogeneity around this value. For example, people
    of Pacific Islander descent have 13% increase as their treatment effect, while
    for Asians the treatment effect is only a 5% increase. And as we will confirm
    in the causal tree reanalysis in **Chapter 9**, income plays a significant role
    in the size of the treatment effect.


    CONSUMER DEMAND ESTIMATION IS A PROMINENT USE-CASE FOR HTE MODELING. It is also
    an area where controlling for confounders is super important. Understanding of
    a full-demand system, including consumer learning and channel switching, requires
    subtle economic modeling. However, in many settings you can aim to recover the
    *local* effects of price changes (i.e., the short-term effects of small changes)
    using fairly basic statistical modeling. In the final example of this section,
    we will combine the orthogonal ML methods with HTE modeling to study short-term
    price elasticities for some consumer goods in grocery stores.


    Price elasticity of demand—say, $\gamma$—is defined as the percentage change in
    quantity sold over percentage change in price when viewing quantity sold as a
    function of price. The famous equation is


    ```

    $$\gamma = \frac{\Delta q}{q} \Bigg/ \frac{\Delta p}{p} = \frac{p}{q}\frac{\Delta
    q}{\Delta p}, \qquad\qquad (6.14)$$

    ```


    with $\Delta$ denoting a fixed amount of change. For continuous functions, elasticity
    at a point is the derivative of quantity with respect to price times price over
    quantity. This elasticity is the key parameter in many demand systems and price
    optimization tasks. For example, with constant elasticity and fixed firm cost-per-unit
    $c$, a heuristic rule of thumb for optimal price $p^{\ast}$ is


    ```

    $$p^{*} = \frac{\gamma}{1 + \gamma}c \qquad\qquad (6.15)$$

    ```


    so that $\gamma/(1+\gamma)$ dictates gross margin.¹²


    Estimating the treatment effect of price on sales is an age-old economic problem.
    Understanding consumer price sensitivity is essential for setting prices and understanding
    markets. It is also a problem where naive ML methods tend to fall short (although
    that doesn''t seem to stop people from using them and getting silly results).
    Both prices and sales respond to a shared, unobserved, factor: consumer demand.
    For example, consider hotel rooms during spring break: the rooms are all sold
    out (sales are high) *and* the'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'prices are super high. It is not the case that sales are high *because* prices
    are high; rather, both prices and sales are functions of the underlying increase
    in holiday demand. But a naïve ML approach that regresses sales on prices can
    result in "upward-sloping demand curves"—unrealistic models where higher prices
    cause higher sales.¹³


    Most analysts are aware that they can’t naïvely rely upon observational studies
    to determine consumer price sensitivity. Whenever possible, it is highly advisable
    to introduce random price variation to help estimation for the causal price effect
    (e.g., see studies involving Dominick’s grocery stores done at the University
    of Chicago in the 1990s¹⁴). But there are many settings where experimentation
    can’t happen or has not happened in the past. In that case, the common last-resort
    solution is a so-called conjoint analysis: asking focus-group members to make
    choices amongst product options using pretend money. However, as you might expect,
    focus groups and funny money are a poor approximation of reality.


    Fortunately, you might be able to use the methods of this chapter to do your demand
    analysis. Consider the LTE model setting: for conditional ignorability to hold,
    you need to have available as controls *x* the universe of variables that can
    potentially affect both prices and sales. Ignoring supply-side issues like stock-outs
    (which should be controlled for if they occur), this *x* is going to consist of
    information relevant to consumer. But, more specifically, only those *demand signals*
    that are known to the price-setter need to be controlled for. It doesn’t matter
    if consumer Joe hears a country song on the radio that makes him think of pick-up
    trucks, causing him to head to his local dealership looking for a truck at any
    price. So long as *the dealership* doesn’t know that Joe’s demand has increased
    and jacked prices, that country song effect is part of an error term on sales
    that is independent of price changes. In more basic terms, conditional ignorability
    in this setting assumes that you know all of the demand signals that determine
    price. If you work for the store that is setting the prices, you should be able
    to collect all of these signals.


    There are a variety of standard structural demand models,¹⁵ and you’ll need to
    use economic modeling if you want to account for all of the complexities of demand
    (e.g., allowing for product competition or elasticities that change with overall
    wealth). But a basic log-log LTE model provides a surprisingly useful platform
    for analysis. Suppose that *qᵤᵢ* is some measure of quantity and *pᵤᵢ* is price
    for product *t* in "transaction" *t* (where *t* can index aggregate sales at a
    specific time and store, across multiple stores, or a single consumer transaction).
    Our LTE demand model is'
  merge: -1
  img_proc: true
- pgno: 257
  md: '$$\begin{gathered}\log q_{it} = \log p_{it}\gamma + {\boldsymbol{x}_{it}}^{\prime}\boldsymbol{\beta}
    + \varepsilon_{it}, \\ \log p_{it} = {\boldsymbol{x}_{it}}^{\prime}\boldsymbol{\tau}
    + v_{it},\end{gathered}\tag{6.16}$$


    with $\varepsilon_{it}\mid p_{it}, x_{it}=0$ and $v_{it}\mid x_{it}=0$ as in Equation
    6.2. Here, $x_{it}$ is the set of demand signals that were known to the price-setter.
    This model is nice because, recalling from Chapter 2, in a log-log model $\gamma$
    is directly interpretable as the percentage change in $q$ per $1\%$ change in
    $p$—that is, $\gamma$ is directly interpretable as the price elasticity of demand
    (hence the choice of notation in Equation 6.14). Moreover, as mentioned earlier,
    it is plausible for firm-side analysts to know all of the demand signals, $x_{it}$.
    The consequence of this is that $\varepsilon \perp v$, as required for conditional
    ignorability. The model defined in Equation 6.16 is then an instance of the LTE
    system from Equation 6.2, and it can be analyzed using the methods of this chapter.


    As an example, we will consider data on sales of beer between 1989 and 1994 at
    Dominick’s stores in the Chicagoland area.16 For each beer unique product code
