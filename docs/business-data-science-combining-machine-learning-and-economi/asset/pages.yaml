  md: 'sample gradient, $\boldsymbol{n}^{-1} \nabla \mathcal{L}(\Omega;\{d_j\}_{j=1}^n)$.
    This variance introduces noise into the optimization updates. As a result, for
    a fixed data sample $n$, the GD algorithm will tend to take far fewer iterations
    than SGD to get to a minimum of the in-sample loss, $\mathcal{L}(\Omega;\{d_i\}_{i=1}^n)$.
    However, in DNN training you don’t really care about the in-sample loss. You want
    to minimize future prediction loss—that is, you want to minimize the *population*
    loss function $\mathbb{E}_{\boldsymbol{d}} \mathcal{L}(\Omega; d)$. And the best
    way to understand the population loss is to see as much data as possible. Thus,
    if the variance of the SGD updates is not too large, it is more valuable to spend
    computational effort streaming through extra data than to spend it on minimizing
    the variance of each individual optimization update.


    This is related to an important high-level point about SGD: the nature of the
    algorithm is such that engineering steps taken to improve *optimization* performance
    will tend to also improve *estimation* performance. The same tweaks and tricks
    that lower the variance of each SGD update will lead to fitted models that generalize
    better when predicting new unseen data. The “train faster, generalize better”
    paper by Hardt, Recht, and Singer$^{35}$ explains this phenomenon within the framework
    of algorithm stability. For SGD to converge in fewer iterations means that the
    gradients on new observations (new mini-batches) are approaching zero more quickly.
    That is, faster SGD convergence means by definition that the model fits are generalizing
    better to unseen data. Contrast this with full-sample GD, for example, for likelihood
    maximization: faster convergence implies only quicker fitting on the current sample,
    potentially overfitting for future data. A reliance on SGD has made it relatively
    easy for deep learning to progress from a scientific to engineering discipline.
    Faster is better, so the engineers tuning SGD algorithms for DNNs can just focus
    on convergence speed.


    On the topic of tuning SGD, real-world performance is sensitive to the choice
    of $C_I$, the projection matrix in Equation 10.8. For computational reasons, this
    matrix is usually diagonal (i.e., it has zeros off of the diagonal) such that
    entries of $C_I$ dictate the *step-size* in the direction of each parameter gradient.
    SGD algorithms have often been studied theoretically under a single step-size,
    such that $C_I = \delta \dot{I}$ where $\delta$ is a scalar and $I$ is the identity
    matrix. Unfortunately, this simple specification will under-perform and even fail
    to converge if $\dot{\delta} t$ is not going toward zero at a precise rate.$^{36}$
    Instead, practitioners make use of algorithms where $C_I = [\delta \dot{t} \ldots
    \delta p] I$, with $p$ the dimension of $\Omega$, and each $\delta \dot{t}$ is
    chosen to approximate $\frac{\partial^2 \mathcal{L}}{\partial \omega_j^2}$, the
    corresponding diagonal element of the Hessian matrix of loss-function second derivatives
    (i.e., what would be used in a Newton’s algorithm). The'
