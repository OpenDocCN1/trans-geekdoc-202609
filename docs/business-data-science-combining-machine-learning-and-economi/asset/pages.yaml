    This specific type of unsupervised pretraining is no longer viewed as central
    to deep learning. However, Hinton’s paper opened many people’s eyes to the potential
    for deep neural networks: models with many layers, each of which may have different
    structure and play a very different role in the overall machinery. That is, a
    demonstration that one *could* train deep networks soon turned into a realization
    that one *should* add depth to models. In the following years, research groups
    began to show empirically and theoretically that depth was important for learning
    efficiently from data.$^{21}$ The *modularity* of a deep network is key: each
    layer of functional structure plays a specific role, and you can swap out layers
    like Lego blocks when moving across data applications. This allows for fast application-specific
    model development and also for *transfer learning* across models. An internal
    layer from a network that has been trained for one type of image recognition problem
    can be used to hot-start a new network for a different computer vision task.


    Deep learning came into the ML mainstream with a 2012 paper by Krizhevsky, Sutskever,
