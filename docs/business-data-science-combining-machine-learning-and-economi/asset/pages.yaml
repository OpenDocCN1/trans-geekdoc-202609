    # ## REGRESSION UNCERTAINTY


    We are interested not just in the point-estimates of the regression parameters
    but also in the *uncertainty* around these estimates. The usual way people quantify
    uncertainty about regression coefficients is to simply trust the standard errors
    output by the software. These “standard” standard errors are OK for many purposes,
    so long as your model is close to representing the true data-generating process.
    However, the standard errors reported by R (and virtually every other software
    package) are sensitive to misspecification. That is, they are constructed using
    a theory that is reliant on the specified regression model being true. For example,
    in the linear regression case, the usual standard errors will be wrong if there
    are heteroskedastic errors—in other words, if there is not a shared $\sigma_2$
    variance for all $\varepsilon_i$. And in both linear and logistic regression,
    the standard error will be incorrect if there is any dependence between observations.


    To get more robust standard errors, you need to make use of *nonparametric* methods
    that account for the possibility that the stated model is not quite a perfect
    fit. As covered in Chapter 1, one useful tool for this is the bootstrap, a strategy
    in which you resample the data (with replacement) and use the uncertainty across
    samples as an estimate of actual sampling variance. You can use a bootstrap to
    *nonparametrically* quantify the uncertainty associated with regression coefficients.
    Figure 2.9, for example, compared parametric and nonparametric uncertainty estimates
    for the coefficient on an indicator for broadband access when predicting online
    spending.


    In the special case of OLS regression—i.e., linear regression—there are also a
    number of theoretical tools you can use to obtain robust standard errors. One
    of the most important and useful is the class of so-called *sandwich* variance
    estimators. Consider a multivariate representation of our linear regression distribution:


    $y \sim N(X\beta, \Sigma). \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad
    (2.28)$'
