  md: '> *Yes. Was it you? It was. The day you decided to remove hoagies from the
    lunch menu, about a year ago, I’m sorry, but it really was you...and not me. Hey...wait...put
    down that pizza peel...try to stay calm...please? [Olive oil container whizzing
    past head] Please! Stop throwing shit at me...everyone breaks up on social media
    these days...or haven’t you heard? Wow, what a Bitch!*


    You can also normalize the SR projections by the length of review, for example,
    reporting $z_ik / m_i$. On this scale, the funniest review is *Holy Mother of
    God*, and the most useful review is *Ask for Nick!*.


    Overall, MNIR is useful for sorting through a large number of related influences
    on text and for categorizing texts according to these factors. It is a complement
    to text regression and topic modeling. In full-scale text analysis applications,
    you will find yourself combining all of these tools as appropriate. For example,
    in Taddy [2013a], I tracked political sentiment on Twitter about candidates in
    the 2012 Republican presidential primaries (plus sentiment about Obama, the incumbent
    president). This work uses topic modeling to factorize a massive bank of unlabeled
    text; I then used this factor representation to guide the selection of tweets
    for labeling by human readers. Once I accumulated the labeled data, I used MNIR
    to model tweet content as a function of both generic sentiment (happy versus sad)
    and sentiment about specific politicians (e.g., support for Romney is not the
    same as being positive in general). The resulting factors are used as input to
    a text regression, along with some raw token counts, to train a model that can
    track subject-specific sentiment on Twitter. The results are shown in **Figure
    8.11**.


    ![](img/315929ad4bddd26368466d02e06e2385_344_0.png)


    FIGURE 8.11: Sentiment about politicians in Twitter traffic during the 2012 Republican
    presidential primaries.'
