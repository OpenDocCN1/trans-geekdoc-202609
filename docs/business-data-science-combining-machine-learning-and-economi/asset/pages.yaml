  md: 'Linear regression is just one instance of the linear modeling framework. Another
    technique (perhaps even more common in practice) is *logistic regression*. This
    strategy is used for modeling *binary response*: a *y* that is either 0 or 1 (true
    or false).


    Binary responses arise from a number of prediction targets:


    +   - Will this person pay their bills or default?

    - Is this a thumbs-up or thumbs-down review?

    - Will the Edmonton Oilers win or lose this game?

    - Is the writer a Republican or Democrat?


    Even when the response of interest is not binary (e.g., revenue), it will sometimes
    be that your decision-relevant information is binary (e.g., profit versus loss)
    and it is simplest to think in these terms.


    Recall the general linear model specification: $\mathbb{E}_v|x=f(x''\beta)$. When
    the response *y* is 0 or 1, the conditional mean becomes


    $\mathbb{E}_v|x=\mathrm{p}(v=1|x)\times 1+\mathrm{p}(v=0|x)\times 0=\mathrm{p}(v=1|x)$.


    Therefore, the expectation you''re modeling is a *probability*. This implies that
    you need to choose the *link function* $f(x''\beta)$ to give values between zero
    and one:


    $\mathrm{p}(v=1|x)=f(\beta_0+\beta_1x_1\dots+\beta_px_p)$.


    Logistic regression uses a *logit* link function:


    $\mathrm{p}(y=1|\mathbf{x})=\frac{e^{x''\beta}}{1+e^{x''\beta}}=\frac{\mathrm{exp}[\beta_0+\beta_1x_1\dots+\beta_px_d]}{1+\mathrm{exp}[\beta_0+\beta_1x_1\dots+\beta_px_d]}$.


    See **Figure 2.8** for a picture of the logit function. To see how this link works,
    consider extreme values for $x''\beta$. At large negative values, $f(-\infty)=0/(1+0)=0$
    and $y=1$ has zero probability. At large positive values, $f(\infty)=\infty/(\infty+1)=1$
    and $y=1$ is guaranteed. Thus, the logit link maps from the "real line" of numbers
    to the [0, 1] space of probabilities.'
  merge: -1
  img_proc: true
