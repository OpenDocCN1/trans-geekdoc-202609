    higher lags. In addition, the need for higher lags sometimes indicates that you
    are missing a more persistent trend or periodicity in the data.


    Finally, what about space? Space is just like time, but with another dimension.
    We''ve already discussed de-trending with geographic effects. To deal with spatial
    auto-dependence, you simply include yₛ for s that is nearby your modeled location.
    For example, you can condition on the average for neighboring states in a map
    or the average of the neighboring pixels in an image. These models are referred
    to as spatial autoregressive (SAR) models, and as in temporal AR you can deal
    with most dependencies by including only the immediate neighbors. We won''t cover
    this technique in detail, but you should explore SAR modeling using, for example,
    the California housing data that we work with in Chapter 9. Also in Chapter 9,
    we outline the Gaussian Process (GP) models that are commonly used for modeling
    spatially dependent data. To model SAR using a GP you simply add "space" (e.g.,
    latitude and longitude) as an input to the GP regression function.


