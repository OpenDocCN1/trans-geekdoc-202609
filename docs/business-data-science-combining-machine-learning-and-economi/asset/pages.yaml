    RD analysis is a common and useful tool in data analysis, and our coverage of
    the topic has been relatively brief. For more detail, you can look to Imbens and
    Lemeuex [2008] and references therein. One particular situation is important to
    flag: it is possible to use similar tools for analysis when the treatment threshold
    is not strict (as we had here) but rather fuzzy: $r_i > 0$ changes the probability
    of treatment, but treatment allocation is not deterministic on either side of
    the threshold. These fuzzy RD designs turn out to be a special case of the instrumental
    variables design that we cover in the next section.


    # ◆ INSTRUMENTAL VARIABLES


    In business and economic systems, you have a large set of inputs that combine
    to generate your outcome of interest. As we’ve highlighted throughout this chapter,
    understanding causation in such systems requires randomization—you need to have
    events that look like experiments. Thus far, we’ve considered analysis around
    the treatment effect of policies that have been themselves randomized. But it
    is common that you want to know the treatment effect for a policy that has not
    been directly randomized but rather'
  merge: -1
