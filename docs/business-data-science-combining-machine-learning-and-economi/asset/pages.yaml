    Thus, the LTE lasso procedure finds no evidence for effect of abortion on murder.


    PROPENSITY MODELS ARE AN ADAPTATION OF THE LTE FRAMEWORK FOR BINARY TREATMENTS.
    In this setting, the second line of the LTE system in Equation 6.2 is replaced
    with a binomial distribution on the treatment equation:


    y=dy+x''β+ε, ε|d, x=0,


    d~Bernoulli(q(x)), q(x)=<sup>e<sup>x</sup>r</sup>/(1+<sup>e<sup>x</sup>r</sup>)</sup>.
    (6.6)


    Thus, d is modeled as having been drawn from a Bernoulli distribution (i.e., a
    coin toss) and the probability that d=1 is a function of x through our familiar
    logistic regression model (there are alternative formulations, but the logit link
    is most common).'
