- pgno: 147
  md: 'repeated observations in with-replacement samples make prediction seem artificially
    easy. In subsampling,$^{12}$ you instead re-estimate your target using $B$ *without-replacement*
    subsamples of size $m$, where $m$ is smaller than the full sample size $n$. Ideally,
    these subsamples have no overlap. For example, you would split the data into something
    like $B = n/m$ folds and obtain parameters on each independent fold. However,
    you need simultaneously $B$ big enough to get a good picture of the sampling distribution
    and $m$ big enough to get estimator behavior that resembles the full sample result.
    For example, in lasso problems, $m$ can’t be so small that all of the coefficients
    are set to zero in the subsample estimates. But perhaps that only happens for
    $m \geq n/5$, and you need more than $B = 5$ subsample estimates to get a reasonable
    confidence interval.


    In practice, you should choose $B$ as big as you have computational time for,$^{13}$
    and choose $m$ as small as possible where your estimation routine still gives
    reasonable-looking point estimates. This latter recommendation is subjective;
    I use $m \approx n/4$ as a rule of thumb, but you will want to move this number
    around to make sure your intervals are not overly sensitive to its value.


    Similarly to the bootstrap algorithms, variability of your estimates across subsets
    can be used to model the sampling variability of your full-sample estimator. But,
    unlike for the nonparametric bootstrap, each subsample estimate is based on roughly
    independent data. And for this reason subsampling works in settings (such as lasso
    estimation and after model selection) where the bootstrap fails.


    The problem with subsampling is that each of your estimates is based on a smaller
    sample than you actually have. For that reason, subsampling algorithms require
    you to assume a *learning rate* that allows you to adjust the size-$m$ sample
    uncertainty for your size-$n$ sample estimate. The learning rate defines how quickly
    your standard errors decrease with the sample size. For example, in the common
    mean-estimation setting you use the sample mean $\bar{x}_n = (1/n) \sum_i x_i$
    as an estimator of the true mean $\mathbb{E}[x]$ (where the $n$ subscript denotes
    dependence on sample size), and this estimator has the standard error


    ```

    $$\text{se}(\bar{x}_n) = \sqrt{\frac{\text{var}(\bar{x})}{n}}. \qquad\qquad (3.10)$$

    ```


    Here, we would say that the learning rate is $\sqrt{n}$ : since var(x) is a constant
    quantity, the standard error is decreasing with the square root of the sample
    size. For example, suppose you have $\bar{x}_m$, the mean of a smaller size-$m$'
  merge: -1
  img_proc: true
- pgno: 148
  md: "sample of $x_i$ values. You can relate uncertainty across the two different\
    \ sample sizes as\n\n\\begin{equation}\\mathrm{se}(\\overline{x}_n) = \\sqrt{\\\
    frac{m}{n}} \\ \\mathrm{se}(\\overline{x}_m). \\tag{3.11}\\end{equation}\n\nIt\
    \ turns out that, for reasons related to the central limit theorem,$^{14}$ a $\\\
    sqrt{n}$ learning rate holds (at least approximately) for a wide variety of estimation\
    \ algorithms. For example, MLEs all have $\\sqrt{n}$ learning rates. The assumption\
    \ of $\\sqrt{n}$ learning becomes more difficult once you add model selection\
    \ and penalization. However, it can be shown$^{15}$ that if your parameter dimension\
    \ is not *too* large,$^{16}$ then the lasso estimates have a $\\sqrt{n}$ learning\
    \ rate. If you are willing to make this assumption, then you can make use of the\
    \ subsampling procedure in Algorithm 10 to obtain nonparametric confidence intervals\
    \ for functions of lasso estimates.\n\n# **ALGORITHM 10** Subsampling CI Under\
    \ $\\sqrt{n}$ Learning\n\nYou have data $Z = \\{z_i\\}_{i=1}^n$ and some full\
    \ sample estimate $\\hat{\\theta}$ that is calculated from this data to approximate\
    \ the population target $\\theta$.\n\nSet a subsample size $m$, where $m$ is no\
    \ larger than $n / 2$. As a default value, use $m = n/4$. Then, for $b = 1 \\\
    dots B$: \n- Draw a without-replacement subsample $Z_b$ of $m$ observations from\
    \ the full sample $Z$.\n- Run your estimation on $Z_b$ to obtain $\\hat{\\theta}_b$,\
    \ the subsample estimate for $\\theta$.\n- Calculate the *error*, $e_b = (\\hat{\\\
    theta}_b - \\hat{\\theta})$.\n\nGiven $\\{e_b\\}_{b=1}^B$, you obtain the $\\\
    alpha\\%$ CI for $\\theta$ by first calculating the $\\alpha / 2$ and $1-\\alpha\
    \ / 2$ percentiles on this sample of errors—say, $ta_{\\alpha/2}$ and $t_{1-\\\
    alpha/2}$—and setting the interval as\n\n\\begin{equation}\\left[ \\hat{\\theta}\
    \ - \\frac{\\sqrt{m}}{\\sqrt{n}}t_{1-\\alpha/2}, \\ \\hat{\\theta} - \\frac{\\\
    sqrt{m}}{\\sqrt{n}}t_{\\alpha/2} \\right]. \\tag{3.12}\\end{equation}"
  merge: -1
  img_proc: true
