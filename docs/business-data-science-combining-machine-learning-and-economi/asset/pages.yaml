    The issue is that the context around loans being given out is not the same across
    different credit histories. Those with good history are able to get big loans
    for riskier projects, while those with terrible history are only able to get small
    loans in scenarios where it is nearly certain they can avoid default. Thus, the
    customers in different history groups have been *selected* into different types
    of loans. There is a correlation between history and default in the data that
    is the opposite of what we would expect as the causal relationship.


    Some of this issue can be fixed by conditioning on the right control variables.
    If you include loan size and scenario as covariates in a regression, that will
    perhaps account for this selection issue and yield the correct causal model. Doing
    this correctly is the subject of Chapter 5. In general, however, it is dangerous
    to make changes to future behavior based on a naive analysis of past data. In
    this case, I’d be confident using this data to analyze the expected default rate
    for a large set of loans that are “on the books” (since those loans are generated
    from the same loan-approval process that generated this'
