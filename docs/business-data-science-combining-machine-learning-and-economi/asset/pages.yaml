- pgno: 231
  md: "Minute Maid and Tropicana. The model attributes the higher sales to these brand\
    \ effects, and we recover the more realistic \\-3.14 elasticity.\n\nMore mechanically,\
    \ *how* does this happen in regression? OLS regression coefficients represent\
    \ the *partial* effect for each input after its correlation with the other inputs\
    \ has been removed. To see this, consider an alternative stagewise control algorithm\
    \ that first regresses $\\log(price)$ onto *brand* and then uses the *residuals*\
    \ as inputs to predict $\\log(sales)$.\n\n```\n> pricereg <- lm(log(price) ~ brand,\
    \ data=oj)\n> phat <- predict(pricereg, newdata=oj)\n> presid <- log(oj$price)\
    \ - phat\n> coef(residfit <- lm(log(sales) ~ presid, data=oj))\n(Intercept)  \
    \       presid\n    9.167864       -3.138691\n```\n\nThe coefficient on *presid*,\
    \ the residuals from regression of log price on brand, is exactly the same as\
    \ what you get on $\\log(price)$ in the multiple linear regression for log sales\
    \ onto this and brand. This is one way that you can understand what OLS is doing:\
    \ it is finding the coefficients on the part of each input that is *independent*\
    \ from the other inputs.\n\nThe previous demonstration suggests a common *structural*\
    \ model for conditional ignorability, the *linear treatment effects* (LTE) model:\n\
    \n$$\n y = d'\\gamma + x'\\beta + \\varepsilon, \\quad \\varepsilon \\mid d, x\
    \ = 0, \\\\\n d = x'\\tau + \\upsilon, \\quad \\upsilon \\mid x = 0.\n$$\n\n(6.2)\n\
    \nHere, *d* is a treatment status variable, *y* is the response of interest, and\
    \ *x* is all of the variables that can influence both *d* and *y* \\- in other\
    \ words, our potential confounders. The conditions after the commas, $\\varepsilon\
    \ \\mid d, x = 0$ and $\\upsilon \\mid x = 0$, encode the conditional ignorability\
    \ assumption. They give you a roadmap for using ML tools to solve this class of\
    \ causal inference problems.\n\nWe will use this LTE model as the basis for most\
    \ of the methods in this chapter. It is a reasonable approximation to reality\
    \ in many business scenarios. It is also well studied as a reduced-form model,\
    \ and you should feel confident in its use under misspecification. The model can\
    \ be extended in a number of ways, for example by having $\\gamma$ change with\
    \ *x* in a heterogeneous treatment effect specification or replacing $x'\\beta$\
    \ and $x'\\tau$ with flexible functions $l(x)$ and $m(x)$ in a \"partially linear\"\
    \ treatment effects model."
