- pgno: 249
  md: '# HETEROGENEOUS TREATMENT EFFECTS


    Thus far, we have ignored a glaringly obvious feature of treatment effects: they
    will be different for different subjects. This phenomenon, where the influence
    of the treatment (i.e., a policy variable that you control) varies as a function
    of who or what is being treated, is referred to as *heterogeneous treatment effects*
    (HTEs). Modern ML tools are making it easier to model HTEs, instead of just looking
    at the ATE average, and these higher-fidelity views into treatment effects are
    having a big impact on business decision-making.


    As a first point to make clear, *heterogeneous treatment effects* exist. You will
    occasionally see a misguided academic testing for heterogeneity, but almost any
    practitioner would agree that their treatment—medicine, advertisement, web service—has
    a different effect on different individuals. For example, people shopping for
    clothing on eBay are more likely to buy when pictures are bigger, while those
    shopping for car parts prefer more items per page with smaller pictures. You don’t
    need to know why this happens for it to be useful in website design. Your task
    is the same as in prediction: you seek to discover patterns that are indexed by
    observable covariates, say, x.


    For randomized treatments—for example, in an AB trial—modeling HTEs is as easy
    as running a regression that interacts the treatment variable with sources of
    heterogeneity. For example, if d has been randomized across subjects, you can
    fit the basic interaction model


    ```

    $\mathbb{E}\left[ y_{i} | \boldsymbol{x}_{i}, d_{i} \right] = \alpha + \boldsymbol{x}_{i}^{''}
    \boldsymbol{\beta} + d_{i} \gamma_{0} + (d_{i} \times \boldsymbol{x}_{i})^{''}
    \boldsymbol{\gamma}$. (6.12)

    ```


    Here, (di × xi)′ is the vector of treatment-covariate interactions [dxi1 . . .
    dxiip], and γ′ = [γ1 . . . γp] are the corresponding regression coefficients.
    The HTE for treatment dA versus dB for any individual subject is then


    ```

    HTEi = E[ yi | xi, dB ] - E[ yi | xi, dA ] = ( γ0 + xi γ′ ) × ( dB - dA ). (6.13)

    ```


    Since d is randomized, you don’t actually need the x/β term here. However, it
    is good practice to include a main-effect adjustment for the sources of treatment
    effect heterogeneity.


    Again, if the di values are randomized such that they are roughly independent
    from the xi values, then you can use your usual regression tools'
  merge: -1
  img_proc: true
