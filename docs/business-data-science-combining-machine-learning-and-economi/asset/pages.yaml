    FIGURE 8.9: Big absolute loadings by aspect rating in the we8there MNIR.


    There is a connection between MNIR and factorization. Recall that, after the PC
    factor model, you obtain the PC scores by projecting the raw $x_{i}$ through the
    loadings $\rho_{k}$. The same operation is used in PLS to map from marginal regressions
    to each PLS direction. A similar logic applies to MNIR: if you want to get a *score*
    for the degree to which text $x_{i}$ is associated with document attribute $k$,
    you can obtain the MNIR projection $z_{ik} = x^{T}\rho_{k} = \sum_{j} x_{ij}\rho_{jk}$.
    These scores will contain *all of the information in* $x_{i}$ *that is relevant
    to* $v_{ik}$. If you know $z_{ik}$, then there is nothing more that $x_{i}$ can
    tell you about aspect $k$. **Figure 8.10** shows scores against true values for
    overall rating; it is clear that $z_{overall}$ is rich with information about
    $Overall$.'
