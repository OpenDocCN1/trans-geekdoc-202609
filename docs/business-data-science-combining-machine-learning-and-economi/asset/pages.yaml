  md: '$p(q|x)=\operatorname{Beta}(a_1=a+x,\ b_1=b+1-x).\qquad\qquad\qquad\qquad(1.12)$


    Updating in this manner over $n$ trials, $an$ can be interpreted as the number
    of observed “successes” and $bn$ the number of observed “failures” out of $n$
    trials. As you run more trials (i.e., you flip the coin more times), these parameters
    grow, and your uncertainty about $q$ decreases. For example, since the mean of
