- pgno: 259
  md: 'This says that sales drop by only 0.7% per every 1% increase. As discussed
    earlier, elasticities greater than $-1$ indicate a good that is practically *inelastic:*
    increased prices are straight profit. This happens when you have goods that are
    massively underpriced, which is unrealistic for *all* beer in a supermarket, or
    when you have done a poor job of estimating elasticities. The latter is almost
    certainly the case here: we have not controlled for any product characteristics
    or time dynamics.


    We can do better. To construct our set of controls $\mathbf{x}$, we first create
    dummy indicator variables for the beer type (UPC), week, and store.


    ```

    coef( margfit <- lm(log (MOVE) ~ lp, data=wber[ss,]))


    (Intercept) lp


    1.0124931 -0.7194031

    ```


    This allows for both sales and price to vary as functions of beer type, transaction
    week, and store.


    However, having completely separate models for every type of beer is poor practice
    (especially in the small $n = 5000$ subsample). If a Bud Light 6-pack of cans
    is modeled as having demand that is completely independent from a Bud Light 12-pack
    of bottles, then we will have little data for modeling each individual beer type.
    Instead, as always with regularization, we should create a regression design that
    allows our models to find a *hierarchy* in the data. If we have a dummy variable
    for “Bud,” another for “Light,” and yet another for “Bud Light,” then the model
    is able to shrink across brands and beer style. The individual beer UPC indicators
    are available to fill in the lowest levels of the hierarchy—for example, if “Bud
    Light 18-pack cans American Flag special edition” behaves differently than every
    other Bud Light product—but for the most part the beers will be modeled as similar
    to their hierarchical siblings.


    All of this hierarchical information is available in retailer databases. But to
    save coding effort—and as an example of how ML with unstructured data can replace
    complicated human taxonomies—we’ll just use the beer descriptions as our source
    of information. In a preview of **Chapter 8**, we use a *bag-of-words* representation
    and tokenize the descriptions into dummy indicators for the presence of each word
    in the beer-description vocabulary.'
