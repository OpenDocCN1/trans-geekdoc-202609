- pgno: 196
  md: 'observations is assumed, and you use for $\overline{\mathbf{x}}$ a diagonal
    matrix with entries $\hat{e}^2_i$, the squared regression residuals. Now, since
    independence within groups is no longer assumed, you have nonzero off-diagonal
    entries of $\hat{e}_i\hat{e}_k$ if observations $i$ and $k$ are from the same
    group (cross-group entries are still zero since those errors are assumed independent).
    This clustering is implemented in the vcovCL function of the AER package. We can
    apply it to the interaction-adjusted regression:


    ```

    library(AER)

    ```

    > sqrt(vcovCL(linadj, cluster = P$household_id) [2,2])

    [1] 0.006589621

    ```


    Note that this is, to the 5th decimal place, the same as the bootstrap standard
    error estimate. The two procedures—clustered SEs and blocked bootstrapping—are
    both attempting to approximate the same target and hence will tend to give similar
    results.


    As a final thought on regression adjustment, why are we using linear regression
    here? There is no great reason for this. Indeed, the response is binary, and from
    earlier chapters, we know that logistic regression is the preferred model in such
    a setting. Linear regression (i.e., OLS) is often used for ATEs because the treatment
    effect is thought of as additive and because steps like regression adjustment
    are easiest in linear models. Moreover, OLS will give a robust estimate for the
    ATE even if the truth is nonlinear and the errors are non-Gaussian. However, it
    often makes more sense to talk about multiplicative effects and, especially if
    you have covariates, a logistic regression might do a better job in real data
    examples at recovering the true conditional mean function.


    Here, we can add `family="binomial"` to our existing regressions to get the logit
    results:


    ```

    ```

    > lgt <- glm(doc_any_12m ~ selected*numhh, data=P, family="binomial")

    ```


    The regression adjustment makes calculating the ATE a bit tricky because the mean
    prediction is no longer the model prediction at mean covariates (i.e., you can’t
    just feed in $\overline{\mathbf{x}}$). So, we need to actually predict over the
    covariate space for each treatment status, take the difference in probabilities
    as our treatment effect, and then average. We can do this by calculating the difference
    in predicted PCP visit probabilities at each `numhh` value and then summing these
    differences with weights equal to the proportion of observations at each `numhh`
    level:'
