- pgno: 236
  md: "What is happening here? **Figure 6.1** makes it clear that both cell phone\
    \ and abortion rates move together, and moreover they have been increasing *quadratically*\
    \ over the sample frame. That is, they are increasing with $t^2$. Murder rates\
    \ have decreased quadratically over time (i.e., they follow a downward curve).\
    \ In the original regression, we didn’t include any other variable (other than\
    \ abortion) that changed in this way, and for this reason any variable with the\
    \ shape of change in **Figure 6.1** shows up as having a significant effect on\
    \ murder.\n\nTo control for such variables, you need control for more flexible\
    \ time trends; you can do this by including different effects for each year, $at$.\
    \ It is also good practice to allow confounder effects to interact with each other\
    \ (e.g., so that there is a different $gun$ effect for high $beer$). Finally,\
    \ we’ll control for my cell phone story by including $phone$ as an input and allowing\
    \ it to interact with state (since we have only aggregate U.S. phone rates, we\
    \ need to allow different effects for each state depending upon their individual\
    \ level of cell phone adoption).$^{6}$ We can again fit this using OLS in R:\n\
    \n```\n```\n> t <- factor (t)\n> interact <- glim(y ~ d + t + phone *s + .^2,\
    \ data=controls)\n> summary (interact)$coeff[\"d\",]\n    Estimate  Std. Error\
    \  t value   Pr(>|t|)\n 0.2764410   0.1779091   1.5538330  0.1208959\n```\n```\n\
    \nSignificance disappears! The direction of the effect also changes—now abortion\
    \ causes *more* murders—but really what is going on is that we’ve added so many\
    \ variables to the model that $n \\simeq p$. We just don’t have enough data to\
    \ get a decent estimate.\n\n```\n```\n> dim(model.matrix(formula(interact), data=controls))\n\
    [1] 624 154\n```\n```\n\nThe point here is not that the *Freakonomics* authors\
    \ are “wrong” or that they’ve made a statistical error. Indeed, in their original\
    \ paper they caution about the weakness we’ve exploited:\n\n> > That abortion\
    \ is only one factor influencing crime . . . points out the caution required in\
    \ drawing any conclusions regarding an abortion-crime link based on time-series\
    \ evidence alone."
  merge: -1
