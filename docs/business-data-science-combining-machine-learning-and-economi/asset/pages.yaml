- pgno: 124
  md: 'The path plot in Figure 3.6 is created by `plot(spending)`. You can also do
    logistic lasso regression through the `family` argument.


    ```

    gam1r(x=SC[, -1], y=SC$FAIL, family="binomial")

    ```


    The default behavior of `gam1r` solves for a sequence of 100 $\lambda_{T}$, ranging
    down to $\lambda_{T}$, which is 1% of the starting point $\lambda_{1}$. There
    are a number of common arguments that you can change as needed:


    +   - `verb=TRUE`: To get a progress printout.

    - `nlambda: T`, the length of your $\lambda$ grid.

    - `lambda.min.ratio` (or `lmr`): $\lambda_{T}/\lambda_{1}$, defines the path end.


    Type `?gam1r` for abundant documentation and help.


    The most difficult part of using `gam1r` (and it’s not hard) is specification
    of the numeric model-matrix. You can use the `model.matrix` command, which is
    called by `glm`. However, `gam1r` (along with `glmnet` and many other ML R packages)
    is able to take advantage of the Matrix library representation for sparse matrices.
    A sparse matrix is one with many zero entries, which is a common scenario in modern
    data analysis. For example, many interacting categorical variables will — when
    represented as 0/1 indicator variables — lead to sparse designs. It is then efficient
    to ignore zero elements in the matrix whenever you can. Packages like `gam1r`
    are able to take advantage of sparse matrix structures for lower storage costs
    and faster computation. This will be essential for practical applications.


    One common sparse representation is a simple triplet matrix (STM) with three key
    elements: the row $i$, column $j$, and entry value $x$. Everything else in the
    matrix is assumed zero. Here’s an example:


    ![](img/315929ad4bddd26368466d02e06e2385_124_0.png)


    The Matrix library provides tools for creating and working with sparse matrices.
    For example, the `sparseMatrix` function lets you create a matrix from these $i,
    j, x$ elements. This is how we built `xweb` for the browser regressions:'
