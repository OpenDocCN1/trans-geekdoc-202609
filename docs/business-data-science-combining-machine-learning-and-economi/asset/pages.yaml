    \ to $\\beta_{1}=1$, and nonzero $\\beta_{0}$ is then referred to as drift. To\
    \ fit the AR(1) model, you need to create lagged versions of your response and\
    \ then include them in the regressions. This usually requires removing the first\
    \ observation from your training data. For example, we can rerun the airline regression\
    \ including an AR(1) term:\n\n```\n> lag <- head(log(passengers), -1) # see help(head)\n\
    > passengers <- passengers [-1]\n> month <- month [ - 1]\n> time <- time [-1]\n\
    > summary(airAR <- glm(log(passengers) ~ time + month + lag))\n    \nlag     \
    \            0.7930716  0.0548993  14.446  < 2e-16 ***\n```\n\nFigure 2.17 shows\
    \ the resulting residuals and their ACF plot. Now, everything looks nice and linear.\
    \ It appears the single lag term solved all of our autocorrelation problems.\n\
    \n![](img/315929ad4bddd26368466d02e06e2385_101_0.png)\n\nFIGURE 2.17: Airline\
    \ residuals after including an AR(1) term.\n\nThe AR(1) model is simple but hugely\
    \ powerful. If you have any suspicion of autocorrelation, it is a good move to\
    \ include lagged response as a covariate. The coefficient on this lag gives you\
    \ important information about the time-series properties:\n\n+   - If $|\\beta_{1}|=1$,\
    \ you have a random walk.\n- If $|\\beta_{1}|>1$, the series explodes.\n- If $|\\\
