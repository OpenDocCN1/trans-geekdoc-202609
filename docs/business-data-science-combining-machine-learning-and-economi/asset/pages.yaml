- pgno: 303
  md: "Introduction). If you want to be able to trade on what the rest of the market\
    \ doesn't know, then you will be looking for signal that is not summarized by\
    \ these dominant factors. In such cases, PCR will not work well. In practice,\
    \ you do not know what scenario you are in until you try both PCR and, say, a\
    \ lasso regression on the raw x inputs.\n\nThe two-stage PCR algorithm is straightforward:\
    \ you run PCA and then run a regression procedure.\n\n```\nmyPCA = prcomp(X, scale=TRUE)\n\
    v = predict(myPCA) [1:K]\nreg = glm(y~., data=as.data.frame(v))\n```\n\nClassically,\
    \ the number of PCs to include in the regression can be selected using a version\
    \ of subset selection where you build, say, p different models using PCs 1 through\
    \ K for K = 1 . . . p. The optimal choice for K is then selected based on an information\
    \ criterion or out-of-sample experimentation. Because the PCs are ordered (by\
    \ their variance) and independent, this works better than subset selection on\
    \ the raw dimensions of $x_i$ (which we've previously warned against).\n\nThis\
    \ PC selection procedure is fine, but in my experience it is both easier and better\
    \ to simply run a lasso regression on the full set of PCs. You can then use the\
    \ usual selection procedures to choose the λ regularization weight. This procedure\
    \ makes it easy to incorporate other information in addition to the PCs. For example,\
    \ one tactic that works well in practice is to put both v and x—both the PCs and\
    \ the raw inputs—into the lasso model matrix. This then allows the regression\
    \ to make use of the underlying factor structure in x and still pick up individual\
    \ $x_{ij}$ signals that are related to y. This hybrid strategy is a solution to\
    \ the disadvantage of PCR mentioned earlier—that it will only pick up dominant\
    \ sources of variation in x.\n\n# ALGORITHM 19 Principal Components (Lasso) Regression\n\
    \nGiven a sample of regression input observations {$x_i$}$_{n=1}$, accompanied\
    \ by output labels $y_i$ for some subset of these observations:\n\n+   1. Fit\
    \ PCA on the full set of $x_i$ inputs to obtain $v_i$ of length min (n, p).  \n\
    2. For the labeled subset, run a lasso regression for $y_i$ on $v_i$ (including\
    \ selection for penalty λ via either CV or AIC)."
