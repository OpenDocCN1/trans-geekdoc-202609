    # FACTOR MODELS AND PCA


    Clustering and mixture modeling are special cases of a more general framework
    for unsupervised dimension reduction: factorization. Given a matrix of high-dimensional
    data $x$, you’d like to reduce this to a function of a few “important” factors.
    You do this by building a linear model for $x$ as a function of these unknown
    factors and then estimating both factors and model at the same time. A factor
    model has


    ```

    $\mathbb{E}[\boldsymbol{x_i}] = \boldsymbol{\varphi_1}\boldsymbol{v_{i1}} + \ldots
    \boldsymbol{\varphi_K}\boldsymbol{v_{iK}}$ (7.6)

    ```


    where $x_i$ and $\varphi_k$ are all length-$p$ vectors, while the $v_{ik}$ are
    univariate scores indicating how observation $i$ loads on factor $k$.


    When you use a $K$ that is much smaller than $p$, factor models provide a parsimonious
    representation for $x$. Each observation $x_i$ is mapped to $K$ factors $v_{i1}$
    . . . $v_{ik}$, and these factors are a low dimensional summary of $x$. Consider
    the nifty example in Figure 7.7. This shows the fitted mapping from vectors of
    genetic SNP information (a high-dimensional $x$) to a 2D factor space. After shading
    by each person’s country of origin, a pattern emerges: the factor representation
    resembles a (tilted) map of Europe. This means that the best two-dimensional summary
    of genetic material simply corresponds to the latitude and longitude—in other
    words, knowing where you are from provides information about your genes. 5'
  merge: -1
  img_proc: true
- pgno: 287
  md: '![](img/315929ad4bddd26368466d02e06e2385_287_0.png)


    FIGURE 7.7: A two-factor representation of genetic sequences taken from Novembre
    et al. [2008]. Each point is an individual''s genetic sequence, shaded by country
    of origin and located in the two-factor reduced dimension space.


    We can expand the model of Equation 7.6 for each individual dimension of x, writing


    ```

    $\mathbb{E}[x_{ij}] = \varphi_{j1} v_{i1} + \ldots \varphi_{jk} v_{ik}, \ j =
    1 \ \ldots \ p.$ (7.7)

    ```


    Equations 7.6 and 7.7 describe the same model. The $v_{ik}$ values are attached
    to each observation; they are like the $x_{ij}$ inputs in regression, except that
    they are now unknown *latent factors* that need to be estimated. The $\varphi_{jk}$
    coefficients are called *loadings* or *rotations*—these are properties of the
    model and are'
