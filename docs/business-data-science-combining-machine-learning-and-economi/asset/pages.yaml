    \ it relies heavily upon the correctness of your assumed data generating process.\
    \ For example, if you are working with a linear lasso, you will need to generate\
    \ new errors from a Gaussian distribution, typically with a constant variance,\
    \ and hence assuming that the model in Equation 3.8 from Algorithm 9 holds *exactly*.\
    \ In practice, you will often use a linear lasso for regression estimation even\
    \ if you don’t believe that this model holds true. As is the case with OLS, linear\
    \ modeling can give good estimates for $\\boldsymbol{\\beta}$ even if, say, the\
    \ errors are heteroskedastic and each observation has its own variance $\\sigma\
    \ i$. However, if you apply the parametric bootstrap under such misspecification,\
    \ it can give you radically inaccurate uncertainty estimates (typically, underestimates).\n\
    \nSUBSAMPLING PROVIDES AN ALTERNATIVE TO BOOTSTRAPPING. The nonparametric bootstrap\
    \ doesn't work with model selection because the"
