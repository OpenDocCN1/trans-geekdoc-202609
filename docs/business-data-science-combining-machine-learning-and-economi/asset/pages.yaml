- pgno: 366
  md: 'Trees seem great. And they are, if you can tame their flexibility and avoid
    overfit. Unfortunately, the CV routine that we just described does not work reliably
    in practice. It suffers from the same instability issues that we highlighted for
    subset selection and forward stepwise regression. When prediction rules are highly
    variable across the model path—here, the iteratively pruned trees—the CV estimates
    of OOS performance will vary dramatically across samples. This means that the
    model choice and predictions will have high variance, leading to a large average
    squared prediction error.


    As we cited in Chapter 3, Leo Breiman6 was among the first to highlight the problems
    of using CV selection on nonstable models. In that regularization chapter, we
    were able to *stabilize* the path of candidate models by adding a penalty on coefficient
    size. This stability is the key to the success of the lasso. However, with tree
    models there are no coefficients to penalize, and we can''t apply this regularization
    strategy.


    The solution to this problem is the technique of *bagging*, for "bootstrap aggregating."
    Recall the bootstrap from Chapter 1: you rerun your algorithm (e.g., regression)
    on multiple with-replacement samples of the data to mimic the sampling uncertainty
    for the full-data fit. Following this logic, the *mean* fit across bootstrap samples
    is then an estimate of the *average* model fit. If you have a procedure that is
    *unbiased* (e.g., on average it will work well) but has high sampling variance,
    then it would follow that the bootstrap mean will be a better model to use than
    the full-sample data fit. This is the premise behind bagging.


    There is also a Bayesian interpretation of bagging based on the Bayesian interpretation
    of the bootstrap (e.g., in Rubin [1988] or Chamberlain and Imbens [2003]). This
    holds that the bootstrap sample is an approximation to the posterior distribution
    for the optimal regression fit and that the bootstrap mean approximates the posterior
    mean.


    *Bagging is thus model averaging, and all of the good stability properties of
    Bayesian inference follow.*


    Bagging works best when the individual models are simple but flexible so that
    you can quickly fit many *unbiased* (but overfit) models. CART trees are a perfect
    candidate. Indeed, the bagging of CART trees is the essence of the celebrated
    *random forests* 12 (RF) algorithm of Breiman [2001]. RFs fit CART trees on with-replacement
    samples of the data, and the resulting prediction rule is the *average* of the
    predictions from each tree in the bootstrap sample.


    These RFs are an industrial workhorse for large-scale flexible regression—they
    require almost no tuning, and nothing performs better out of the box on big data
    prediction problems. Every time that you use the Internet, it is likely'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'that a some portion of your online experience has been tuned using an RF-based
    prediction rule.


    The full RF algorithm fits a variation of CART on each bootstrap sample: instead
    of choosing each greedy split location optimally across all inputs, it chooses
    optimally across a random sample of inputs. Unlike the bagging process, this extra
    randomization does not have a clear theoretical basis or interpretation. However,
    intuitively it provides some amount of extra regularization by forcing the greedy
    splitting algorithm to avoid always splitting variables in a similar order. In
    empirical work, we''ve found that this input randomization is useful in small
    samples (i.e., if $p \approx \sqrt{n}$ or bigger) but that it can damage performance
    if you have large $n$. This would support its interpretation as extra regularization.


    # ALGORITHM 24 Random Forest (RF)


    Suppose $B$ is the bootstrap size (i.e., the number of trees in the forest). For
    $b=1 \ldots B$:


    +   1. Sample with-replacement $n$ observations from the data.

    2. Fit a CART tree---say, $\mathcal{T}_b$---to this sample.


    +   (a) Alternatively, fit randomized CART with input variables for each greedy
    split a random draw from the full input set.


    This results in a set of trees $\mathcal{T}_1 \ldots \mathcal{T}_B$. The forest
    predictions are the average of individual tree predictions. If $\hat{y}_{b}$ is
    the prediction for $x_{f}$ from tree $\mathcal{T}_{b}$, then the random forest
    prediction is $\hat{y}_{f}=\frac{1}{B} \sum_{b} \hat{y}_{f b}$.


    For classification problems, some RF implementations have tree vote on the response
    rather than average. That is, each tree contributes its highest probability response
    class and $\hat{y}$ is the proportion of vote for each class. The bagging theory
    suggests it is preferable to have $\hat{y}$ the average of class probabilities
    $\hat{y}_{b}$.


    To build intuition about random forests, let''s consider a simple one-dimensional
    regression problem. The “motorcycle data” contained in the MASS package are 133
    measurements of acceleration on a motorcycle rider''s helmet in the moments after
    a head-on collision (we assume that this is data from crash-test dummies). As
    a regression problem, input $x$ is time-since-impact and response $y$ is acceleration.
    Figure 9.7 shows the data and CART'
