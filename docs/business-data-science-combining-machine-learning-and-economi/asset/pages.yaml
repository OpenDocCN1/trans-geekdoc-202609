    \ Crosby being on the ice. To translate this to something comparable to the earlier\
    \ logistic regression results, we can consider a baseline probability of around\
    \ 1/2 that any given goal was scored by Pittsburgh rather than their opponents.\
    \ Sid being on the ice moves the *odds* that any given goal was scored by Pittsburgh\
    \ from 0.5/0.5 = 1 to between 0.71/0.29 = 2.45 and 0.79/0.21 = 3.76.\n\nThese\
    \ Sid-caused increases in Pittsburgh’s scoring odds, between 145% and 276%, are\
    \ much larger than the 50% odds increase found in the earlier logistic lasso analysis.\
    \ In this sense, the original results were wrong. Why didn’t the nhlreg lasso\
    \ just “work” for treatment effect estimation? Because Sid is the best player\
    \ on his team, when you don’t fully control for the players he tends to play with\
    \ and against, you will underestimate his effectiveness. This pattern repeats\
    \ itself across players: the earlier lasso regression provides attenuated estimates\
    \ of their player effects because their play is being conflated with that of their\
