    When the covariates encode a mapping into mutually exclusive subgroups (e.g.,
    $x _ { i j } = 1$ if person $i$ is in group $j$), then this procedure is sometimes
    referred to as *post-stratification*.


    The idea behind Equation 5.5 is that adjusting for differences due to covariates
    can reduce the variance in the ATE estimate because of random imbalances across
    groups (e.g., having slightly more men in $A$ than $B$). However, we tend to advise
    against these adjustments unless you have small sample sizes and know of a few
    factors that have a large influence on the response (in which case you should
    consider the sort of blocked design mentioned at the end of this section). David
    Freedman argued that the regression adjustments can introduce strange biases,
    and *we* find that any reduction in variance due to adjustment is vanishingly
    small in large samples. The extra complexity of regression adjustment usually
    is not worth the effort. For a large $AB$ experiment with a perfectly randomized
    design, you can stick with $\widehat { \boldsymbol { A T E } } = \overline { {
    y } } _ { 1 } - \overline { { y } } _ { 0 }$.


