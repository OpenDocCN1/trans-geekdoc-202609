    +   y = 2 + 10*e-3*p + rnorm(length(e),0,.1)

    +   y[y<0] <- 0

    +   return(y) }

    ```

    ```


    For this illustration, the demand shocks will be random and independent.


    ```

    ```r

    > e <- rgamma(100,1,1)

