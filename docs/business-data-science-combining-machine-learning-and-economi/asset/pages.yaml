- pgno: 128
  md: 'instead of Equation 3.4, you minimize –\(2/n)\log LH D(\bm{\beta}+\lambda\Sigma_j\mathbf{sd}(\mathbf{x}_j)|\bm{\beta}_j|.
    This implies that \(\beta_j\)''s penalty is now measured on the scale of 1 standard
    deviation change in \(x_j\) and, for example, switching from meters to feet or
    Fahrenheit to Celsius won''t change your model fit.


    This standardization scaling is the default in `gam1r` (and in most other lasso
    implementations) via the argument `standardize=TRUE`. There are some occasions
    where you instead want `standardize=FALSE`. Most commonly, you might want `standardize=FALSE`
    if you have all indicator variables indicating category membership (such as brand
    or geographic region). In this case, the standardization would put *more* penalty
    on common categories (since sd(xj) will be higher) and less penalty on rare categories,
    which might be undesirable. However, unless you have strong reason to do otherwise,
    you should stick with the default `standardize=TRUE`.


    # # MODEL SELECTION


    As mentioned many times, the lasso is used to obtain paths of promising candidate
    variables. The penalty weight \(\lambda\) is a signal-to-noise filter. *It works
    like the squelch on a VHF radio.* If you turn it all the way up, you don''t hear
    anything. If you turn it all the way down, you hear only static. The key to being
    able to communicate on a radio is finding the sweet spot in the middle where you
    hear the other person''s voice and none of the background noise. It is the same
    for good statistical prediction: you need to find the \(\lambda\) that gives you
    good signal with little noise.


    Given a path of candidate models, you select the best one by asking, “Which model
    does best in predicting unseen data?” Of course, you can''t know this in practice
    since unseen data is unseen. However, you can build a selection recipe around
    the out-of-sample experiments that we''ve already been using to estimate predictive
    performance. The procedure of using such experiments to do model selection is
    called *cross validation* (CV). It follows the basic recipe in Algorithm 7.


    # **ALGORITHM 7** *K*-Fold Cross Validation


    Split the data into *K* random and roughly evenly sized subsets, called *folds*.
    Then, for \(k=1\dots K\):


    +   - Use all data *except* the *k*th fold to train candidate models.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   Record the error rate for predictions from this fitted model on the left-out
    fold.


    The end result will be a sample of OOS errors for each candidate model, and you
    can use these samples to estimated which is best.


    Folding your data in this way guarantees that each observation is left out once
    for validation. Each data point is given a chance to *screw up* a prediction exercise.
    Doing this, rather than randomly sampling overlapping subsets, reduces the variance
    of CV model selection.


    Be careful to not cheat, for example, as we did in the semiconductors example
    at the beginning of this chapter when we selected our 25 cut variables using the
    full data.


    As a rule, if you do something to the data, do it *inside* the CV loop over folds.


    We usually measure the “error rate” as the deviance. But for different applications,
    you might choose to focus on other OOS statistics, such as misclassification rates
    or error quantiles. As a general point, you want the CV scheme to mirror how you
    will actually be applying the model in practice. For example, if you are going
    to be predicting time-series data, then you might want to use only past training
    data to predict future leftout folds.


    A common question is “How do I choose K?” The short answer is that more is better,
    but you shouldn’t waste time, so just use whatever you need. After running CV,
    you will have a distribution of errors associated with each model—say, ℓr1 . .
    . ℓrK for model t. The estimated average error rate is then ℓ̄t (ℓtk)/√K. with
    standard error sd. If these standard errors are too large for you to tell which
    is really the smallest ℓ̄t—for example, if all of the ℓ̄i ± sd(ℓtk) / √K are overlapping—then
    you can increase K to reduce sampling uncertainty. The default for gaml r is nfold=5,
    which is often enough, but you can increase if needed.


    There is a limit on the precision increase with extra folds. The extreme case
    of leave-one-out CV, with K = n, is nice because it has no Monte Carlo error.
    However, it will give bad results if there is even a tiny amount of dependence
    between your observations. Smaller values of K lead to CV that is more robust
    to this type of misspecification.


    CV for the lasso is especially straightforward because the full paths of candidate
    models are easy to estimate. Algorithm 8 outlines the procedure.'
  merge: -1
  img_proc: true
- pgno: 130
  md: "# **ALGORITHM 8** $K$-Fold CV Lasso\n\nBegin by minimizing Equation 3.4 over\
    \ the sequence of penalty weights $\\lambda_{1} > \\lambda_{2} \\ldots > \\lambda_{T}$\
    \ to obtain a path of candidate models $\\hat{\\boldsymbol{\\beta}}_{1} \\ldots\
    \ \\hat{\\boldsymbol{\\beta}}_{T}$. Then, for each of $k=1 \\ldots . K$ folds:\n\
    \n+   - Using this same $\\lambda_{l}$ sequence, fit the lasso path $\\hat{\\\
    boldsymbol{\\beta}}_{1}^{k} \\ldots \\hat{\\boldsymbol{\\beta}}_{T}^{k}$ on all\
    \ data data *except* the $k$th fold, say, fold$k$.\n\n+   - For each $\\hat{\\\
    boldsymbol{\\beta}}_{t}^{k}$, calculate the fitted deviance on left-out data,\n\
    \n```\n$$ e_{t}^{k}=-\\frac{2}{n_{k}} \\sum_{i \\in \\text { fold } k} \\log p\\\
    left(y_{i} \\mid \\boldsymbol{x}_{i}^{\\prime} \\hat{\\boldsymbol{\\beta}}_{t}^{k}\\\
    right), $$\n```\n\nwhere $n_{k}$ is the number of observations in fold$k$.\n\n\
    Set $$ \\overline{e}_{t}=\\frac{1}{K} \\sum_{k} e_{t}^{k} \\text { and } \\operatorname{se}\\\
    left(\\overline{e}_{t}\\right)=\\sqrt{\\frac{1}{(K-1)} \\sum_{k}\\left(e_{t}^{k}-\\\
    overline{e}_{t}\\right)^{2}} $$ as your estimate and sampling error for the OOS\
    \ deviance at each $\\lambda_{t}$. Finally, use the results to choose the “best”\
    \ $\\hat{\\lambda}_{t}$ and use the corresponding full-sample coefficient estimates,\
    \ $\\hat{\\boldsymbol{\\beta}}_{t}$, for your modeling and predictions.\n\nOnce\
    \ again, the procedure is easiest to understand visually. Fortunately, gamlr wraps\
    \ all of Algorithm 8 together in cv.gamlr, which uses the same syntax as the standard\
    \ gamlr function.\n\n```\n```\n    cv.spender <- cv.gamlr(xweb, log(y spend))\n\
    \    plot(cv.spender)\n```\n```\n\nNote that there are two options for $\\lambda$\
    \ selection shown in **Figure 3.8**. The obvious one, called the CV-min rule,\
    \ simply selects the $\\lambda_{t}$ corresponding to the minimum average OOS error.\
    \ The second option, called the CV-1se rule, defines as best the biggest $\\lambda_{t}$\
    \ with average OOS deviance no more than one SE (the se$(\\overline{e}_{t})$)\
    \ from Algorithm 8) away from the minimum. In **Figure 3.8**, this corresponds\
    \ to the right-most dotted line."
  merge: -1
  img_proc: true
- pgno: 131
  md: '![](img/315929ad4bddd26368466d02e06e2385_131_0.png)


    FIGURE 3.8: Cross-validated lasso for the browser data. The blue dots are mean
    OOS errors, and the error bars mark ± 1 standard error. CV-min and CV-1se rules
    are marked with vertical lines.


    For most applications, I recommend using the CV-min rule. This is the best choice
    if you are focused on OOS predictive performance. The CV-1se rule is more *conservative*:
    it hedges toward a simpler model in a reasonable but ad hoc fashion. This should
    be used if you are going to put a lot of weight on interpreting the nonzero $\hat{\beta}_k$,
    for example, as being special or representing some underlying truth. In high dimensions,
    such interpretation should be done with care anyway because multicollinearity
    can make it somewhat arbitrary which coefficients end up nonzero. Hence, I focus
    on predictive performance. However, the CV-1se rule is the default in *glmtr*
    because it is the default in *glmnet* and we don’t want to rock the boat. You
    need to add the flag `select="min"` to get the CV-min selection.


    When you call *coef* on a fitted *cv.glmtr* object, it automatically does the
    selection.'
  merge: -1
  img_proc: true
