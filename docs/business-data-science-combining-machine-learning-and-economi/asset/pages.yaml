  img_proc: true
- pgno: 133
  md: 'There are many information criteria out there: AICc, AIC, BIC, and so on. All
    of these approximate the distance between a fitted model and “the truth” for different
    definitions of truth and using different analytic approximations. Since the IC
    measure a distance, you can apply them in model selection by choosing the model
    with minimum IC.


    The most common is Akaike’s criterion,


    ```

    $$\mathrm{AIC}=\mathrm{deviance}+2df, \qquad\qquad(3.6)$$

    ```


    where the deviance is calculated $in-sample$ and the $df$ are your $model$ degrees
    of freedom.


    For example, the $summary.glm$ output reports the following:


    ```

    `\begin{aligned}\quad&\text{Null deviance:}\quad731.59\text{ on }1476\text{ degrees
    of freedom}\\\quad&\text{Residual deviance:}\quad599.04\text{ on }1451\text{ degrees
    of freedom}\\\quad&\text{AIC:}\quad651.04\end{aligned}`

    ```


    Note again that the degrees of freedom in R output is “degrees of freedom left
    after fit”: $n-df$ in our terminology. Many statistics books recommend the model
    with smallest AIC.


    In an MLE fit, the $df$ is simply the number of parameters in the model. More
    generally, it measures the correlation between $\hat{y}$ and $y$ — how much flexibility
    you have to make the model fit look like the observed data. For deep theoretical
    reasons,${ }^{6}$ the lasso, like for MLE models, has $df$ simply equal to the
    number of nonzero $\hat{\beta}_{j}$ at a given $\lambda$. This is *not* true for
    any other penalization cost function and is yet another advantage of lasso regression
    (for example, with ridge regression all coefficients will be nonzero, but $df$
    will be less than the full model dimensions because the coefficients are shrunk
    toward zero). Hence, one can apply the AIC for lasso penalty selection by calculating
    the full-sample $\mathrm{gam}\lrr$ path and feeding the number of nonzero coefficients
    and the in-sample deviance into Equation 3.6. As usual, R has a function to do
    this.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '> AIC(spender)

    seg1 seg2 seg3 seg4

    10236.678 10221.410 10205.650 10191.269

    ...

    seg97 seg98 seg99 seg100

    9076.301 9083.091 9102.082 9109.330


    However, AIC tends to lead to overfit in high dimensions. It’s common to claim
    the AIC approximation is good for “big $n$,” but in actual fact it is only good
    for big $n$ / $df$. The $2df$ complexity cost is too small when $df$ is large
    relative to $n$, and hence you get a more complex model than you would want for
    optimal prediction. To understand why, you need to dig a bit into what the AIC
    is attempting.


    *The AIC is an estimate for OOS deviance*. It is targeting the same statistic
    that you are estimating in a CV experiment: what your deviance would be on another
    *independent* sample of size $n$. You know that the IS deviance is too small—since
    the model is tuned to this data, the IS errors are an underestimate of the OOS
    errors. Some more deep theory shows that IS minus OOS deviance will be approximately
    equal to $2df$, and this is the basis for Akaike’s AIC. But if you dig a bit deeper,
    in the context of linear regression, the difference between IS and OOS deviance
    is actually equal to $2df\mathbb{E}[\sigma^{2} / \hat{\sigma}^{2}]$ where $\sigma$
    is the true standard deviation of the additive errors and $\hat{\sigma}$ is its
    in-sample analog: the standard deviation of the fitted residuals. Akaike assumed
    that these will be roughly equal, which is true for low-dimensional models but
    will fail when the model is overfit (e.g., if $df \approx n$). Thus, an improved
    approximation to OOS deviance is


    ```

    $$\mathrm{AICc}=\operatorname{deviance}+2 df \mathbb{E}\left[\frac{\sigma^{2}}{\hat{\sigma}^{2}}\right]=\operatorname{deviance}+2
    df \frac{n}{n-d f-1} .$$

    ```


    This is the *corrected AIC*.[^8] It is a massively useful model selection tool.
    It works in linear or logistic regression or for any other generalized linear
    model (fit via MLE or with a lasso penalty). In the majority of examples, it will
    yield a model selection result that is near to the CV-min rule. Indeed, when AICc
    and CV-min disagree, I worry that something weird is going on and trust neither.
    Notice that for big $n$ / $df$, $\mathrm{AICc} \approx$ AIC. So, you should *always*
    use AICc instead of AIC: it works where the AIC doesn’t and gives the same answer
    where it does.'
  merge: -1
  img_proc: true
- pgno: 135
  md: "The gamlr package uses AICc for selection by default. The AICc selected segment\
    \ is marked on the path plot with a vertical line. If you are asking for coefficients\
    \ from a fitted gamlr object, they will be the AICc minimizing choice.\n\n```\n\
    B <- coef(spender) [-1,] \nB[c(which.min(B), which. max(B))] \ncursormania.com\
    \ shopyourbargain.com \n-0.998143 \t 1.294246\n```\n\nBeyond the AIC and its improved\
    \ cousin, the AICc, there is one other commonly used option. The BIC, where $B$\
    \ stands for Bayes, is\n\n$\\mathrm{BIC}=\\mathrm{deviance}+\\log (n) \\times\
    \ df$. (3.7)\n\nThis looks just like AIC but comes from a different place. The\
    \ BIC is attempting to approximate the Bayesian posterior model probability—say,\
    \ p($\\lambda_{l}$ | data)—which is roughly interpreted as the probability that\
    \ $\\lambda_{l}$ is a parameter in the true process that generated the data. This\
    \ is done under a certain prior: your probability that a model is true before\
    \ you saw any data. Basically, while AIC and AICc are trying to optimize prediction,\
    \ the BIC is attempting to get at a “true” model. This leads the BIC to be more\
    \ conservative, and in small to medium-sized samples it behaves much like the\
    \ CV-1se rule. However, in large samples we find that it tends to underfit for\
    \ prediction purposes—it chooses $\\lambda$ that are too big and models that are\
    \ too simple.\n\nFigure 3.9 shows all our OOS error estimates, and Figure 3.10\
    \ shows the corresponding model selection rules. We note that both AIC and AICc\
    \ curves look like the CV curve; however, the AICc selection rule is nearly the\
    \ same as the CV-min rule, while AIC chooses a smaller $\\lambda$ (more complex\
    \ model). In this case, the BIC and CV-1se rules give similar model choices. In\
    \ larger samples, you will see these two diverge with BIC choosing much more simple\
    \ models (and tending to underfit). With all of these selection rules, you get\
    \ a range of answers. As a general rule, if you have time and the answer is important,\
    \ do CV. But AICc is fast and stable, and I tend to use a combination of AICc\
    \ and CV-min selection rules."
  merge: -1
  img_proc: true
