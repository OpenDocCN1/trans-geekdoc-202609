  md: 'The solution is to replace the actual gradients in Equation 10.2 with estimates
    of those gradients based upon a subset of the data. This is the SGD algorithm.
    It has a long history, dating back to the Robbins-Munro$^{32}$ algorithm proposed
    by a couple of statisticians in 1951. In the most common versions of SGD, the
    full-sample gradient is simply replaced by the gradient on a smaller subsample.
    Instead of calculating gradients on the full-sample loss, $\mathcal{L}(\mathbf{\Omega};\{d_i\}_{i=1}^n)$,
    we descend according to subsample calculations,


    \begin{equation} \mathbf{\Omega}_{t+1} = \mathbf{\Omega}_t - C_t \nabla \mathcal{L}(\mathbf{\Omega};
    \{d_{i_b}\}_{b=1}^B)\big|_{\mathbf{\Omega}_t} \tag{10.8}\end{equation}


    Here, $\{d_{i_b}\}_{b=1}^B$ is a *mini-batch* of observations with $B \ll n$.
    The key mathematical result behind SGD is that, so long as the sequence of $C_t$
    matrices satisfy some basic requirements, the SGD algorithm will converge to a
    local optimum whenever $\nabla \mathcal{L}(\mathbf{\Omega}; \{d_{i_b}\}_{b=1}^B)$
    is an *unbiased* estimate of the full sample gradient.$^{33}$ That is, SGD convergence
    relies upon the following:


    \begin{equation} \mathbb{E}\left[\frac{1}{B}\nabla \mathcal{L}\left(\mathbf{\Omega};
    \{d_{i_b}\}_{b=1}^B\right)\right] = \mathbb{E}\left[\frac{1}{n}\nabla \mathcal{L}(\mathbf{\Omega};
    \{d_i\}_{i=1}^n)\right] = \mathbb{E}\nabla \mathcal{L}(\mathbf{\Omega}; d). \tag{10.9}\end{equation}


    Here, the last term refers to *the population* expected gradient—that is, the
    average gradient for observation $d$ drawn from the true data-generating process.


    To understand why SGD is so preferable to GD for machine learning, it helps to
    discuss how computer scientists think about the *constraints* on estimation. Statisticians
    and economists tend to view sample size (i.e., lack of data) as the binding constraint
    on their estimators. In contrast, in many ML applications the data is practically
    unlimited and continues to grow during system deployment. Despite this abundance,
    there is a fixed computational budget (or the need to update in near-real-time
    for streaming data), such that you can execute only a limited number of operations
    when crunching through the data. Thus, in ML, the binding constraint is the amount
    of computation rather than the amount of data.


    SGD trades faster updates for a slower per-update convergence rate. As explained
    in a 2008 paper by Bousquet and Bouteau,$^{34}$ this trade is worthwhile when
    the faster updates allows you to expose your model to more data than would otherwise
    be possible. To see this, note that the mini-batch gradient $B^{-1}\nabla \mathcal{L}(\mathbf{\Omega};\{d_{i_b}\}_{b=1}^B)$
    has a much higher variance than the full-'
