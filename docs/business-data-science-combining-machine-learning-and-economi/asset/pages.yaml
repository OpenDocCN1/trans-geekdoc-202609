    # # Experiments


    Every method we have discussed so far is able to detect patterns in past data.
    These patterns will be useful for predicting the future, assuming that the future
    looks mostly like the past. As the cliché goes, “Correlation is not causation.”
    But correlation might be all that you need. If people who rent the movie Frozen
    also tend to like the movie Sing, then you can reliably use this information for
    future recommendations. Both preferences are likely caused by a third unseen signal—that
    these people have small children who like cartoon musicals—but that doesn’t lessen
    the usefulness of the discovered pattern.


    However, when you are analyzing business and economic systems, you need to dig
    deeper and get at causation. You need to be able to predict a future that will
    be different from the past because you are going to take actions that make it
    different. A decision that changes your product, marketing, or pricing creates
    a new data generating process that can break the correlation patterns that you’ve
    seen in the past. Suppose that you are a hotelier considering offering a discount
    to increase business. This price change is an action, and you need to know how
    sales will change because of that action.


    In the past, hotel room prices have moved up or down according to projections
    of demand. For example, rooms are more expensive over holidays because you anticipate
    higher demand. This will lead to a correlational pattern where prices are high
    when sales are high—during holidays there are no vacancies, and the prices are
    very high. Of course, sales are not high'
  merge: -1
  img_proc: true
- pgno: 184
  md: '*because* prices are high. Rather, the two are (like viewership of *Frozen*
    and *Sing*) codependent upon a third variable—in this case, the underlying demand
    for hotel rooms. If you act to change prices and break the past dependence structure,
    then this correlational pattern disappears.


    Price optimization is a setting that requires *counterfactual* prediction.¹ You
    want to know what will happen to your sales if you charge price *p*₁ instead of
    price *p*₀. There might be a complex chain of causation between price and sales,
    but you don’t really care. You just want to know the counterfactual sales numbers
    for *p*₁ vs *p*₀. The only way to really know this is to move prices independently
    of everything else and see what happens. Most commonly, one could set prices randomly
    to get an estimate of the consumer demand curve. This is the purest form of experimentation—a
    randomized trial—and it is the gold standard for estimating counterfactuals.


    Counterfactual analysis is the focus of this and the next chapter. We start with
    experimentation, moving from simple randomized controlled trials through more
    complicated designs. Every setting in this chapter involves some amount of explicit
    randomization. In contrast, the next chapter deals with *observational studies*
    where you need to create settings that look like experiments by *controlling*
    for confounding influences (e.g., the holiday demand spike in the earlier pricing
    example). Between the two chapters, I hope to provide a primer on the state-of-the-art
    for counterfactual (or causal) analysis.² This type of analysis plays a huge role
    in how data is used in economics and business. The material in these two chapters
    is essential knowledge for anyone hoping to use data to have an impact on strategic
    decisions.


    # RANDOMIZED CONTROLLED TRIALS


    The gold standard for measuring the effect of an action is an experiment. “Try
    it and see what happens” was at the core of the scientific revolution during the
    seventeenth century. It was given the formalism of frequentist statistics in the
    beginning of the twentieth century by Sir Ronald Fisher and his peers. And the
    Internet era has made Fisher’s randomized controlled trials (RCTs)—under the new
    label *AB testing*—an essential part of business optimization.


    The language that we use to discuss counterfactual inference is rooted in experimentation.
    We refer to estimation of a *treatment effect* (TE) even in cases where we do
    not have control of treatment assignment. A “treatment” variable—say, *d*—is a
    special input to your prediction models. It is special'
  merge: -1
