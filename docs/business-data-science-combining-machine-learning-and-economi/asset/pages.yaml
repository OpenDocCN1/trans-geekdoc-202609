    In examples like the glass data classification, the parallelization strategy of
    $\mathrm{dmr}$ gives a useful efficiency boost: if you have four processors, you
    can compute all of the model estimates in about one-fourth the time. However,
    the real advantage for such methods comes when you are fitting multinomial logistic
    regressions for a massive number of outcome classes. In that case, parallelization
    can make the difference between feasibility and impossibility.


    The motivating example behind the development of DMR was in text analysis. As
    we detail in Chapter 7, it is often useful to summarize documents as counts of
    words. A *multinomial inverse regression* model looks to analyze these counts
    as a function of document attributes in a multinomial logistic regression where
    “word” is the outcome class. Using the approximate formulation in Equation 4.10,
    the task is then to estimate $\hat{\boldsymbol{\beta}}_{k}$ for $\mathbb{E}[y_{ik}\mid
    \boldsymbol{x}_{i}] = \mathrm{exp}(\boldsymbol{x}_{i}^{\prime}\hat{\boldsymbol{\beta}}_{k})$
    where $y_{ik}$ is the count for word $k$ in document $i$ and $x_{i}$ are document
    attributes (author, date, etc.). This requires you to fit as many sets of regression
    parameters as there are words. If you are dealing with a vocabulary of, say, 500,000
    words, then such a task would be impossible without large amounts of parallelization.


    We will detail these ideas in more detail in Chapter 7. But they raise the point
    that efficient data management and parallelization is an essential (not just convenient)
    part of modern analysis. It turns out the DMR is not just'
