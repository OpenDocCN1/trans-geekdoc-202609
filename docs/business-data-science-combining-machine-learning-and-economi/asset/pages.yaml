    We can also use Algorithm 15 to re-evaluate the hockey player performance study.
    Recall that in our original analysis we wanted to estimate player effects that
    were not polluted by different on-ice scenarios and team strength. A small set
    of variables was included without penalty (e.g., team indicators), and thus influence
    from those variables is completely removed from the player effects. The individual
    player effects, however, are of too high dimension to be included in the regression
    without penalty. We fit the model with a lasso penalty on all of those player
    coefficients. This is essentially the "naive" treatment effect lasso mentioned
    earlier, and thus each player''s effect estimate has not fully controlled for
    the influence of their line-mates and common opponents.


    Consider Sidney Crosby, the star captain of the Pittsburgh Penguins. The earlier
    lasso regression estimated that his presence on the ice increases by around 50%
    the odds that a goal has been scored by his team (rather than by his opponents).


