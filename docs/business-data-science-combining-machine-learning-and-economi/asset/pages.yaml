    For classification, these probabilities can be combined with decision costs, as
    described in the previous section (things are a bit more complicated for multiclass
    problems, but the logic is unchanged). In the common setting where you have symmetric
    costs, you can just use a *maximum probability rule*: $\hat{k} = \text{argmax}_{k}
    \ { \hat{p}_k : k = 1 \dots K \}$. You get this in R with `apply(probs, 1, which.max)`,
    which gives the maximizing column index for each row of `probs`.


