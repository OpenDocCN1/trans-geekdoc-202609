- pgno: 170
  md: 'FIGURE 4.9: IS fit for the glass multinomial logistic lasso regression. The
    width of each box is proportional to the sample size for that class.


    To get the regression coefficients, we use the familiar `coef` function. As we
    did for `cv.gamlr`, we can add `select="min"` to apply CV-min selection. The raw
    output for `glmnet` is a list with an element for each outcome class, and we do
    some simple formatting to change this into the $p \times K$ matrix B^.


    ```

    ```

    B <- coef(glassfit, select="min")

    B # it''s a list of coefficients, 1 matrix per glass type.

    ## combine into a matrix

    B <- do.call(cbind, B)

    ## annoyingly, column names are dropped

    colnames(B) <- levels(type) # add them back

    ```

    ```


    Interpreting the MN logit coefficients is not straightforward. In binary logistic
    regression, recall that you had a simple interpretation for the $\beta$ values
    as linear effects on the log-odds. However, we''re now comparing across K categories,
    instead of just two, and the log-odds interpretation applies on the *difference*
    between coefficients for any *pair* of classes:


    $$ \log \left( \frac{p_a}{p_b} \right) = \log \left( \frac{e^{x^T \beta_a}}{e^{x^T
    \beta_b}} \right) = x^T [\beta_a - \beta_b]. \tag{4.8} $$


    For example, with a 1-unit increase in $Mg$, the odds of nonfloat over float glass
    drop by around one-third while the odds of nonfloat over container glass *increase*
    by around two-thirds:


    ```

    ```

    exp(B["Mg", "WinNF" ] -B["Mg", "WinF" ])

    0.6633846

    exp(B["Mg", "WinNF" ] -B["Mg", "Con" ])

    1.675311

    ```

    ```


    From this we infer that more $Mg$ makes both float and nonfloat windows more likely
    but that the probability of float glass increases more than the probability for
    nonfloat glass. This makes sense in the context of Figure 4.2.'
