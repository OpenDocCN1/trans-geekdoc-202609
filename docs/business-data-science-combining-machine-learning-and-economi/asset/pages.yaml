- pgno: 354
  md: '![](img/315929ad4bddd26368466d02e06e2385_354_0.png)


    # Nonparametrics


    All of the regressions that we have worked with up until now are parametric. They
    place restrictions on how the inputs can influence the response, for example forcing
    the relationship to act through a linear model. This is called parametric analysis
    because these models have parameters and you fit a model to the data by optimizing
    parameters.


    Nonparametric regression algorithms make fewer assumptions about the relationship
    between x and y. In their purest form, these algorithms will learn the true relationship
    between x and y as you observe more data, regardless of what this truth looks
    like. As you accumulate data, your predictions get arbitrarily close to the truth.
    Such fully nonparametric techniques place no assumptions on the data-generating
    process other than independence between observations. This chapter will introduce
    regression (and classification) trees and forests as fully nonparametric regression
    methods that have found successful application in business data science.


    Recalling what you’ve learned elsewhere in this text, you should expect that the
    flexibility gained through a nonparametric approach will lead to overfit unless
    it is combined with some type of regularization. Unfortunately, penalized-deviance
    and CV-selection do not work for regularization of nonparametric regressions—the
    fitted objects are unstable, and small data jitter will lead to wildly different
    predictive performances. Fortunately, you can both stabilize and regularize with
    a technique called bagging, which when applied to trees leads to random forests.
    This strategy is also sometimes'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'called model averaging; it is a necessary ingredient in practical nonparametrics.


    Bagging is great, but it can help you only so much. When the dimension gets too
    big, the super flexibility of nonparametrics makes it hard to learn anything useful.
    You should be cautious about using fully nonparametric regressions outside of
    settings where you have much more data than dimensions (i.e., you can be nonparametric
    only when $p \ll n$). A good rule of thumb is that you want $p < n/4$. In higher-dimensional
    problems, we instead tend to work with semiparametric methods that combine targeted
    nonparametric flexibility with parametric restrictions that encourage stability
    and dimension reduction. At the end of this chapter we''ll touch briefly on *Gaussian
    processes*, a relatively intuitive semiparametric procedure. And in **Chapter
    10**, on AI, we''ll introduce deep neural networks as a semiparametric method
    that plays a starring role in contemporary ML. However, there are a ton of real
    data applications where $p$ is big but $n$ is much bigger; in these settings,
    you should consider forests and other tree-based methods as your default prediction
    tool.


    # DECISION TREES


    A decision tree is a logical system for mapping from inputs to outcomes. Trees
    are *hierarchical*: you use a series of ordered steps (decision nodes) to come
    to a conclusion.


    Tree-logic uses a series of steps to come to a conclusion. **Figure 9.1** shows
    a simple example for the process of deciding whether to bring an umbrella to work:
    each implies a split on the forecast data available (from either a weather report
    or current conditions), and the final decisions—the *leaf nodes*—are based upon
    rain predictions conditional upon these splits. The tree nodes have a parent –
    child structure: every node except the root (“wake up”) has a parent, and every
    node except the leaves has two children. The trick to building an effective decision
    tree is to have the sequence of decision nodes combine for good final choices.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '![](img/315929ad4bddd26368466d02e06e2385_356_0.png)


    FIGURE 9.1: A cartoon decision tree.


    At the core of a decision tree is a regression model. You have inputs $x$ (forecast,
    current conditions) and an output of interest $y$ (the amount or probability of
    rain). The decision (umbrella?) is made by combining the predictive distribution
    for $y$ with a utility function, for example, on the competing inconveniences
    of carrying an umbrella and getting wet. The trees act like a game of mousetrap.
    You drop your $x$ covariates in at the top, and each decision node bounces you
    either left or right. Finally, you end up in a leaf node that contains the data
    subset defined by these decisions (splits). The following is an example tree structure
    that uses our familiar regression notation:


    ![](img/315929ad4bddd26368466d02e06e2385_356_1.png)


    The *prediction rule* at each leaf—the predicted $\hat{y}$—is the average of the
    sample $y$ values that end up in that leaf. In this example tree, $\hat{y}$ for
    the bottom-left leaf would be the average of all $y_i$ values such that $x_{ik}
    \le 0$ and $x_{ij} \le 2$. For example, if the response is a real number, then
    $\hat{y}$ is just a simple average. If the response is categorical, such that
    each $y_i$ is a vector of zeros and a one'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'indicating the observed category, then the leaf average $-y$ will be the proportion
    of observations in each category for that leaf.


    To build such trees, you need an algorithm that takes previous $[x, y]$ pairs
    and automatically constructs a useful set of splitting rules. The goal will be
    to minimize a *loss function*. The loss functions for trees look the same as the
    *deviance* functions that we''ve been using as objectives for parametric regression
    modeling. For example, if the response is a real number, then you can fit your
    “regression” tree to minimize the sum-squared error $\sum_{i=1}^{n} (y_{i} - \hat{y}_{i})_{2}$.
    For a classification problem, you can fit your tree to minimize the multinomial
    deviance $-\sum_{i=1}^{n} \sum_{k=1}^{K} y_{ik} \log(\hat{y}_{ik})$. As a historical
    quirk, for classification most tree software implementations instead minimize
    “Gini impurity” $\sum_{i=1}^{n} \sum_{k} (1 - \hat{y}_{ik})$, a measure of the
    multinomial variance. You don''t really need to worry about this—both Gini loss
    and multinomial deviance lead to similar fits, and both work fine for classification.


    > In the language of this text, all trees are regression trees—it is just the
    loss function that changes. However, the tree literature tends to use “regression”
    for the specific scenario of real valued outputs. I''ll adopt that lingo here.


    As in any regression estimation, from linear to multinomial models, we are fitting
    regressions to minimize a loss function on the response. However, instead of being
    based on $x\beta$, the predicted $\hat{y}$ are now defined through splitting via
    thresholds on dimensions of $x$. The full space of possible splitting rules is
    impossibly large (all possible orders of all possible splits), so we need an efficient
    search algorithm. As we''ve done previously, we''ll use *greedy* forward search—we''ll
    construct splits sequentially and recursively.


    Given a *parent* node containing data $\{x_{i}, y_{i}\}_{i=1}^{n}$, the optimal
    split is location $x_{ij}$—dimension $j$ on observation $i$—that makes the *child*
    sets as *homogeneous* in response $y$ as possible. These child sets are denoted
    as


    left: $\{\mathbf{x}_{k}, y_{k}: x_{kj} \leq x_{ij}\}$ and right: $\{\mathbf{x}_{k},
    y_{k}: x_{kj} > x_{ij}\}.$


    For a regression tree with squared error loss, this means that you would want
    to minimize the function:


    ```

    $\sum_{k \in \text{left}} (y_{k} - \bar{y}_{\text{left}})^{2} + \sum_{k \in \text{right}}
    (y_{k} - \bar{y}_{\text{right}})^{2}.$ (9.1)

    ```'
