    Neural networks have a long history. Work on these types of models dates back
    to the mid-twentieth century, e.g., including Rosenblatt’s perceptron.$^{15}$
    This early work was focused on networks as models that could mimic the actual
    structure of the human brain. In the late 1980s, advances in algorithms for *training*
    neural networks$^{16}$ opened the potential for these models to act as general
    pattern recognition tools rather than as a toy model of the brain. This led to
    a boom in neural network research, and methods developed during the 1990s are
    at the foundation of much of deep learning today.$^{17}$ However, this boom ended
    in bust. Because of the gap between promised and realized results (and enduring
    difficulties in training networks on massive datasets) from the late 1990s, neural
    networks became just one ML method among many. In applications, they were supplanted
    by more robust tools such as random forests, high-dimensional regularized regression,
    and a variety of Bayesian stochastic process models.


    In the 1990s, one tended to add network complexity by adding *width*. A couple
    of layers (e.g., a single hidden layer was common) with a large number of nodes
    in each layer were used to approximate complex functions. Researchers had established
    that such “wide” learning could approximate arbitrary functions$^{18}$ if you
    were able to train on enough data. The problem, however, was that this turns out
    to be an inefficient way to learn from data. The wide networks are *flexible*,
    but they need a ton of data to tame this flexibility. In this way, the wide nets
    resemble traditional *nonparametric* statistical models like series estimators.
    Indeed, near the end of the 1990s, Radford Neal showed that certain neural networks
    converge toward Gaussian processes, a classical statistical regression model,
    as the number of nodes in a single layer grows toward infinity.$^{19}$ It seemed
    reasonable to conclude that neural networks were just clumsy versions of more
    transparent statistical models.


    What changed? A bunch of things. Two nonmethodological events are of primary importance:
    we got much more data (big data) and computing hardware became much more efficient
    (GPUs). But there was also a crucial methodological development: networks went
    *deep*. This breakthrough is often credited to 2006 work by Geoff Hinton and coauthors$^{20}$
    on a network'
