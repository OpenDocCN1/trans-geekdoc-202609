  md: '![](img/315929ad4bddd26368466d02e06e2385_69_0.png)


    # # Regression


    The vast majority of problems in applied data science require regression modeling.
    That is, you have a *response variable* (y) that you want to model or predict
    as a function of a vector of *inputs* or covariates (x). This chapter introduces
    the basic framework and language of regression. We will build on this material
    throughout the rest of the book.


    # ## LINEAR MODELS


    A basic but powerful regression strategy is to deal in *averages* and *lines*.
    We model the conditional mean for y given x as


    ```

    E[y | x] = f(x′β). (2.1)

    ```


    Here, x = [1, x₁, x₂, ... x_p] is a vector of covariates and β = [β₀, β₁, β₂,
    . . . β_p] are the corresponding coefficients. The *vector* notation, x′β, is
    shorthand for the sum of element-wise products:


    ```

    x′β = β₀ + x₁β₁ + x₂β₂ + ... + x_pβ_p. (2.2)

    ```


    Here, for convenience we have included x₀ = 1 for the intercept (alternatively,
    we sometimes write a = β₀ for an explicit intercept). The symbol E denotes expectation,
    such that E[y | x] is read as “the average for'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'response $y$ given inputs $x$.” The function $f(. )$ denotes any generic function;
    we''ll consider different forms for this “link function” $f$ to account for different
    types of response $y$.


    Regression is all about understanding the conditional probability distribution
    for “$y$ given $x$”, which we write as $\mathrm{p}(y \mid x)$. Figure 2.1 illustrates
    the conditional distribution in contrast to a marginal distribution, which is
    so named because it corresponds to the unconditional distribution for a single
    margin (i.e., column) of a data matrix. While the marginal mean is a simple number,
    the conditional mean is a function (e.g., $x\beta$). The data is distributed randomly
    around these means, and the assumptions you make about this distribution drive
    your estimation and prediction strategies.


    ![](img/315929ad4bddd26368466d02e06e2385_70_0.png)


    ![](img/315929ad4bddd26368466d02e06e2385_70_1.png)


    FIGURE 2.1: Illustration of marginal versus conditional distributions for home
    prices. On the left, all of the home prices are grouped together. On the right,
    home price distributions are broken out by the number of bathrooms.


    The first model that we will work with is the basic linear regression model. This
    is a workhorse of data science. It is fast to fit (in terms of both analyst and
    computational time), it gives reasonable answers in a variety of settings (so
    long as you know how to ask the right questions), and it is easy to interpret
    and understand.


    The model is as follows:


    ```

    $\mathbb{E}[y \mid \boldsymbol{x}]=\boldsymbol{x}^{\prime} \boldsymbol{\beta}=\beta_{0}+x_{1}
    \beta_{1} \ldots+x_{p} \beta_{p}$

    ```


    This corresponds to using a link function $f(z)=z$ in the regression model of
    Equation 2.1. With just one input $x$, you can write the model as $\mathbb{E}[y
    \mid x]=\alpha+$'
