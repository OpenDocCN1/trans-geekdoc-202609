- pgno: 19
  md: 'money storing and manipulating large amounts of data.5 Moreover, a main driver
    of the big volume of data today is the digitization of business and society: we
    shop, talk, share, and live on computers and online. This creates massive amounts
    of data that has little structure, including raw logs of user actions, natural
    text from communications, and (increasingly) image, video, and sensor data. The
    high volume of data is arriving in inherently complex and messy high-dimensional
    formats.


    In previous generations, the end goal of a data engineer would have been to normalize
    this messy data and fit summary statistics into a data table with standardized
    entries. Today, it is unrealistic to expect a fixed table structure to have long-term
    utility. Instead, data engineers work to build pipes of semistructured data: you
    have well-defined variables, but there are a huge (and potentially increasing)
    number of them. Web browser and text data are good examples: you''ll get pipes
    of URLs or words, but as the data grows in volume, you''ll be seeing never-before-visited
    URLs and never-before-spoken words added to your data dimension.


    Analysis for this type of data requires a new toolset. In classical statistics,
    it is common to assume a world where you have data of fixed small dimension and
    increasing volume. This is the basis for, say, the hypothesis testing rules that
    you might have learned in a college statistics course. But these techniques do
    not work when the dimension of the data is big and always growing bigger as you
    get more volume of data. In this more complicated setting, you cannot rely upon
    the standard low-dimensional strategies such as hypothesis testing for each individual
    variable (t-tests) or choosing among a small set of candidate models (F-test).
    You''ll also not be able to rely on standard visualization strategies and diagnostics
    for checking model fit and specification. You need a whole new set of tools that
    are robust in high dimensions: tools that give good answers even if your data
    seem impossibly complex.


    MACHINE LEARNING is the field that thinks about how to automatically build robust
    predictions from complex data. It is closely related to modern statistics, and
    indeed many of the best ideas in ML have come from statisticians (the lasso, trees,
    forests, and so on). But whereas statisticians have often focused on model inference—on
    understanding the parameters of their models (e.g., testing on individual coefficients
    in a regression)—the ML community has been more focused on the single goal of
    maximizing predictive performance. The entire field of ML is calibrated against
    “out-of-sample” experiments that evaluate how well a model trained on one dataset
    will predict new data. And while there is a recent push to build more'
