    \ was only a single dominant ideological factor driving votes. The next biggest\
    \ influence was whether you show up to vote regularly.\n\n# # PRINCIPAL COMPONENT\
    \ REGRESSION (PCR)\n\nNow that you’ve learned how to fit factor models, what are\
    \ they good for? In some settings, as in the previous political science example,\
    \ the factors themselves have clear meaning and can be useful in their own right\
    \ for understanding complex systems. More commonly, unfortunately, the factors\
    \ are of dubious origin or interpretation. However, they can still be useful as\
    \ *inputs* to a regression system. Indeed, this is the primary practical function\
    \ for PCA— as the first stage of principal components regression (PCR).\n\nThe\
    \ concept of PCR is simple: instead of regressing \\( y \\) onto \\( x \\), use\
    \ a lower-dimension set of principal components as covariates. This is a fruitful\
    \ strategy for a few reasons:\n\n+   - PCA reduces dimension, which is usually\
    \ good.\n- The PCs are independent, so you have no multicollinearity and the final\
    \ regression is easy to fit.\n- You might have far more unlabeled \\( x_{i} \\\
    ) than labeled \\([x_{i}, y_{i}]\\) pairs.\n\nThis last point is especially powerful.\
    \ You can use *unsupervised* learning (PCA) on a massive bank of unlabeled data\
    \ and use the results to reduce dimension and facilitate *supervised* learning\
    \ on a smaller set of labeled observations.\n\nThe disadvantage of PCR is that\
    \ PCA will be driven by the *dominant* sources of variation in \\( x \\). If the\
    \ response is connected to these dominant sources of variation, PCR works well.\
    \ If it is more of a “needle in the haystack response,” driven by a small number\
    \ of inputs, then PCR will not work well. For example, in finance it is commonly\
    \ thought that equity returns are driven by a small number of factors (see our\
    \ CAPM discussion in the"
