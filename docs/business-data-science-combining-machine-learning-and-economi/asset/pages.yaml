  md: '$x\beta$ and plot it as in **Figure 2.2**. Here, $\mathbb{E}[y \mid x]$ increases
    by $\beta$ for every unit increase in $x$, and $\alpha$ is the *intercept*: $\alpha
    = \mathbb{E}[y \mid x = 0]$.


    ![](img/315929ad4bddd26368466d02e06e2385_71_0.png)


    FIGURE 2.2: Simple linear regression.


    When estimating a regression model—i.e., when fitting the $\beta$ coefficients
    —you make some assumptions about the full conditional *distribution* beyond its
    center at $\mathbb{E}[y \mid x]$. Linear regression is usually fit for Gaussian
    conditional distributions:


    $y \mid \boldsymbol{x} \sim \mathsf{N}(\boldsymbol{x}^{\prime}\boldsymbol{\beta},\,\sigma^{2})$.                                                                                                    (2.4)


    That is, the distribution for $y$ as a function of $x$ is distributed normally
    around $\mathbb{E}[y \mid x] = \boldsymbol{x}^{\prime}\boldsymbol{\beta}$ with
    *variance* $\sigma^{2}$. The same model is often commonly written with an additive
    error term,


    $y = \boldsymbol{x}^{\prime}\boldsymbol{\beta} + \varepsilon,\;\text{with}\;\varepsilon
    \sim \mathsf{N}(0,\,\sigma^{2}).                                                                            (2.5)


    Equations 2.4 and 2.5 describe the same model.


    As a concrete example, consider sales data for orange juice (OJ) from Dominick’s
    grocery stores. Dominick’s was a Chicago-area chain. This data was collected in
    the 1990s and is publicly available from the Kilts center at the University of
    Chicago’s Booth School of Business. The data include weekly prices and sales (in
    number of cartons “moved”) for three OJ brands —Tropicana, Minute Maid, Dominick’s—at
    83 Chicagoland Stores, as well as an indicator, *feat*, showing whether each brand
    was advertised (in store or flyer) that week.'
