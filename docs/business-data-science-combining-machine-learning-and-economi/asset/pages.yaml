- pgno: 391
  md: '![](img/315929ad4bddd26368466d02e06e2385_391_0.png)


    # Artificial Intelligence


    Throughout this book, we have covered the wide variety of new ways that companies
    are using data to optimize their businesses. Variously called the big data or
    data science revolution, the rise of this type of analysis over the past decade
    has been characterized by massive amounts of data, including unstructured and
    nontraditional data like text and images, and the use of fast and flexible machine
    learning algorithms in analysis.


    With recent improvements in deep neural networks (DNNs) and related methods, application
    of high-performance ML algorithms has become more *automatic* and robust to different
    data scenarios. That has led to the rapid rise of an artificial intelligence (AI)
    that works by combining many ML algorithms together—each targeting a straightforward
    prediction task—to solve complex problems.


    In this final chapter, we will stretch away from today’s business data science
    to describe a framework for thinking about this new ML-driven AI. Having an understanding
    of the pieces that make up these systems and how they fit together is important
    for those who will be building businesses around this technology. Having some
    clear and hype-free definitions around AI should help you understand the requirements
    for successful AI and anticipate the change that it is bringing.


    # WHAT IS AI?'
  merge: -1
  img_proc: true
- pgno: 392
  md: '**Figure 10.1** shows a breakdown of AI into three major and essential pieces.
    A full end-to-end AI solution—what we sometimes call a *system of intelligence*—is
    able to ingest human-level knowledge (e.g., via machine reading and computer vision)
    and use this information to automate and accelerate tasks that were previously
    performed only by humans. It is necessary to have a well-defined task structure
    to engineer against, and in a business setting this structure is provided by business
    and economic domain expertise. You need a massive bank of data to get the system
    up and running and a strategy to continue generating data so that the system can
    respond and learn. Finally, you need machine learning routines that can detect
    patterns in and make predictions from the unstructured data. This section will
    work through each of these pillars, and in later sections we dive in detail into
    deep learning models, their optimization, and data generation.


    ![](img/315929ad4bddd26368466d02e06e2385_392_0.png)


    Notice that we are explicitly separating ML from AI here. This is important: these
    are different but often confused technologies. ML can do fantastic things, but
    it is basically limited to predicting a future that looks mostly like the past.
    These are tools for pattern recognition. In contrast, an AI system is able to
    solve complex problems that have been previously reserved for humans. It does
    this by breaking these problems into a bunch of simple prediction tasks, each
    of which can be attacked by a “dumb” ML algorithm. AI *uses* instances of machine
    learning as components of the larger system. These ML instances need to be organized
    within a structure defined by domain knowledge, and they need to be fed data that
    helps them complete their allotted prediction tasks.


    This is not to downplay the importance of ML in AI. In contrast to earlier attempts
    at AI, the current instance of AI is *ML-driven*. ML algorithms are implanted
    in every aspect of AI, and in this chapter we describe the evolution of machine
    learning toward status as a general-purpose technology. This evolution is the
    main driver behind the current rise of AI. However, ML algorithms are building
    blocks of AI within a larger context.'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'To make these ideas concrete, consider an example AI system from the Microsoft-owned
    company Maluuba that was designed to play (and win!) the video game *Ms. Pac-Man*
    on Atari.1 **Figure 10.2** illustrates the system. The player moves *Ms. Pac-Man*
    on this game “board,” gaining rewards for eating pellets while making sure to
    avoid getting eaten by one of the adversarial “ghosts.” The Maluuba researchers
    were able to build a system that learned how to master the game, achieving the
    highest possible score and surpassing human performance.


    ![](img/315929ad4bddd26368466d02e06e2385_393_0.png)


    FIGURE 10.2: Screenshots of the Maluuba system playing *Ms. Pac-Man*. On the left,
    you see the game board, containing a maze for Ms. Pac-Man and the ghosts. On the
    right, the authors have assigned arrows showing the current direction for Ms.
    Pac-Man that is advised by different locations on the board, each corresponding
    to a distinct deep neural network. The full video is at [https://youtu.be/zOyWMHfJew4](https://youtu.be/zOyWMHfJew4).


    A common misunderstanding of AI imagines that, in a system like Maluuba’s, the
    player of the game *is* a deep neural network. That is, the system works by swapping
    out the human joy-stick operator for an artificial DNN “brain.” That’s not how
    it works. Instead of a single DNN that is tied to the *Ms. Pac-Man* avatar (which
    is how the human player experiences the game), the Maluuba system is broken down
    into 163 component ML tasks. As illustrated in the right panel of **Figure 10.2**,
    the engineers have assigned a distinct DNN routine to each cell of the board.
    In addition, they have DNNs that track the game characters: the ghosts and, of
    course, Ms. Pac-Man herself. The direction that the AI system sends Ms. Pac-Man
    at any point in the game is then chosen through consideration of the advice from
    each of'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'these ML components. Recommendations from the components that are close to
    Ms. Pac-Man''s current board position are weighted more strongly than those of
    currently remote locations. Hence, you can think of the ML algorithm assigned
    to each square on the board as having a simple task to solve: when Ms. Pac-Man
    crosses over this location, which direction should she go next?


    Learning to play a video or board game is a standard way for AI firms to demonstrate
    their current capabilities. The Google Deep-Mind system AlphaGo, which was constructed
    to play the fantastically complex board game Go, is the most prominent of such
    demonstrations. The system was able to surpass human capability, beating the world
    champion, Lee Sedol, four matches to one at a live-broadcast event in Seoul, South
    Korea, in March 2016. Just as Malouba''s system broke Ms. Pac-Man into a number
    of composite tasks, AlphaGo succeeded by breaking Go into an even larger number
    of ML problems: "value networks" that evaluate different board positions and "policy
    networks" that recommend moves. The key point here is that while the composite
    ML tasks can be attacked with relatively generic DNNs, the full combined system
    is constructed in a way that is highly specialized to the structure of the problem
    at hand.


    In Figure 10.1, the first listed pillar of AI is domain structure. This is the
    structure that allows you to break a complex problem into composite tasks that
    can be solved with ML. The reason that AI firms choose to work with games is that
    such structure is explicit: the rules of the game are codified. This exposes the
    massive gap between playing games and a system that could replace humans in a
    real-world business application. To deal with the real world, you need to have
    a theory as to the rules of the relevant game. For example, if you want to build
    a system that can communicate with customers, you might proceed by mapping out
    customer desires and intents in such a way that allows different dialogue-generating
    ML routines for each. Or, for any AI system that deals with marketing and prices
    in a retail environment, you need to be able to use the structure of an economic
    demand system to forecast how changing the price on a single item (which might,
    say, be the job of a single DNN) will affect optimal prices for other products
    and behavior of your consumers (who might themselves be modeled with DNNs).


    The success or failure of an AI system is defined in a specific context, and you
    need to use the structure of that context to guide the architecture of the AI.
    This is a crucial point for businesses hoping to leverage AI and economists looking
    to predict its impact. As we will detail in this section, machine learning in
    its current form has become a general-purpose technology.3 These tools are going
    to get cheaper and faster over time'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'because of innovations in the ML itself and above and below in the AI technology
    stack (e.g., improved software connectors for business systems above, and improved
    computing hardware like GPUs below). ML has the potential to become a cloud computing
    commodity. ${ }^{4}$ In contrast, the domain knowledge necessary to combine ML
    components into an end-to-end AI solution will not be commoditized. Those who
    have expertise that can break complex human business problems into ML-solvable
    components will succeed in building the next generation of business AI—technology
    that can do more than just play games.


    In many of these scenarios, social science will have a role to play. Science is
    about putting structure and theory around phenomena that are observationally incredibly
    complex. Economics, as the social science closest to business, will often be relied
    upon to provide the rules for business AI. And since ML-driven AI relies upon
    measuring rewards and parameters inside its context, \textit{economics} will play
    a key role in bridging between the assumed system and the data signals used for
    feedback and learning. The work will not translate directly. You need to build
    systems that allow for a certain margin of error in the ML algorithms. Those economic
    theories that apply for only a narrow set of conditions—e.g., at a knife''s edge
    equilibrium —will be too unstable for AI. This is why we mention relaxations and
    heuristics in Figure 10.1. There is an exciting future here where social scientists
    can contribute to AI engineering, and both AI and social science will advance
    as we learn what recipes do or do not work for business AI.


    Beyond ML and domain structure, the third pillar of AI in Figure 10.1 is data
    generation. We’re using the term \textit{generation} here, instead of a more passive
    term like \textit{collection}, to highlight that AI systems require an active
    strategy to keep a steady stream of new and useful information flowing into the
    composite learning algorithms. In most AI applications there will be two general
    classes of data: fixed-size data assets that can be used to train the models for
    generic tasks, and data that is actively generated by the system as it experiments
    and improves performance. For example, in learning how to play \textit{Ms. Pac-Man},
    the models could be initialized on a bank of data recording how humans have played
    the game. This is the fixed-size data asset. This initialized system then starts
    to \textit{play} the game of \textit{Ms. Pac-Man}. Recalling that the system is
    broken into a number of ML components, as more games are played, each component
    is able to experiment with possible moves in different scenarios. Since all of
    this is automated, the system can iterate through a massive number of games and
    quickly accumulate a wealth of experience.'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'For business applications, you should not underestimate the advantage of having
    large data assets to initialize AI systems. Unlike board or video games, real-world
    systems need to be able to interpret a variety of extremely subtle signals. For
    example, any system that interacts with human dialogue must be able to understand
    the general domain language before it can deal with specific problems. For this
    reason, firms that have large banks of human interaction data (e.g., social media
    or a search engine) have a technological advantage in conversational AI systems.
    However, this data just gets you started. The context-specific learning starts
    happening when, after this “warm start,” the system begins interacting with real-world
    business events.


    The general framework of ML algorithms actively choosing the data that they consume
    is referred to as reinforcement learning (RL). It is a hugely important aspect
    of ML-driven AI. In some narrow and highly structured scenarios, researchers have
    built “zero-shot” learning systems where the AI is able to achieve high performance
    after starting without any static training data. For example, in subsequent research,
    Google DeepMind has developed the AlphaGoZero system that uses zero-shot learning
    replicate their earlier AlphaGo success. Noting that the RL is happening on the
    level of individual ML tasks, we can update our description of AI as being composed
    of many RL-driven ML components.


    As a complement to the work on reinforcement learning, there is a lot of research
    activity around AI systems that can simulate “data” to appear as though it came
    from a real-world source. This has the potential to accelerate system training,
    replicating the AI successes in video and board games where experimentation is
    virtually costless (just play the game, nobody loses money or gets hurt). Generative
    adversarial networks (GANs) are schemes where one DNN is simulating data and another
    is attempting to discern which data is real and which is simulated. For example,
    in an image-tagging application, one network will generate captions for the image
    while the other network attempts to discern which captions are human versus machine
    generated. If this scheme works well enough, then you can build an image tagger
    while minimizing the number of dumb captions you need to show humans while training.


    Finally, AI is pushing into physical spaces. For example, the Amazon Go concept
    promises a frictionless shopping-checkout experience where cameras and sensors
    determine what you’ve taken from the shelves and charge you accordingly. These
    systems are as data intensive as any other AI application, but they have the added
    need to translate information from a physical to a digital space. They need to
    be able to recognize and track both objects and individuals. Current implementations
    appear to rely on a combination of'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'object-based data sources, via sensor and device networks (i.e., the Internet
    of Things [IoT]) and video data from surveillance cameras. The object-based sensor
    data has the advantage that it is well structured and tied to objects, but the
    video data has the flexibility to look in places and at objects that you didn’t
    know to tag in advance. As computer vision technology advances and as the camera
    hardware adapts and decreases in cost, we should see a shift in emphasis toward
    unstructured video data. We’ve seen similar patterns in AI development, for example,
    as use of raw conversation logs increases with improved machine reading capability.
    This is the progress of ML-driven AI toward general-purpose forms.


    # GENERAL-PURPOSE MACHINE LEARNING


    The piece of AI that gets the most publicity—so much so that it is often confused
    with all of AI—is *general-purpose* machine learning. Regardless of this slight
    overemphasis, it is clear that the recent rise of deep neural networks (DNNs;
    see the “Deep Learning” section) is a main driver behind growth in AI. These DNNs
    have the ability to learn patterns in speech, image, and video data (as well as
    in more traditional structured data) faster, and more automatically, than ever
    before. They provide new ML capabilities and have completely changed the workflow
    of an ML engineer. However, this technology should be understood as a rapid evolution
    of existing ML capabilities rather than as a completely new object.


    As discussed in the introduction and throughout this book, machine learning is
    the field that thinks about how to *automatically* build robust predictions from
    complex data. ML is single-mindedly focused on the goal of maximizing predictive
    performance on new unseen data. This clear focus, and the ability to *test* performance
    through validation on left-out data, has allowed ML to quickly push new levels
    of performance, speed, and automation. The specific ML techniques used include
    lasso regularized regression, tree algorithms and ensembles of trees (e.g., random
    forests), and neural networks. These techniques have found application in business
    problems, under such labels as “data mining” and, more recently, “predictive analytics.”
    Driven by the fact that many policy and business questions require more than just
    prediction, practitioners have added an emphasis on inference and incorporated
    ideas from statistics. Their work, combined with the demands and abundance of
    big data, coalesced together to form the loosely defined field of data science—the
    topic of this book.'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'The push of ML into the general area of business analytics has allowed companies
    to gain insight from high–dimensional and unstructured data. This is only possible
    because the ML tools and recipes have become robust and usable enough that they
    can be deployed by nonexperts in computer science or statistics. That is, they
    can be used by people with a variety of quantitative backgrounds who have domain
    knowledge for their business use case. Similarly, the tools can be used by economists
    and other social scientists to bring new data to bear on scientifically compelling
    research questions. The general usability of these tools has driven their adoption
    across disciplines. They come packaged as quality software and include validation
    routines that allow the user to observe how well their fitted models will perform
    in future prediction tasks.


    The latest generation of ML algorithms, especially the deep learning technology
    that has exploded since around 2012,8 has increased the level of automation in
    the process of fitting and applying prediction models. This new class of ML is
    the general-purpose ML (GPML) that we reference in the rightmost pillar of Figure
    10.1. The first component of GPML is deep neural networks: models made up of layers
    of nonlinear transformation node functions, where the output of each layer becomes
    input to the next layer in the network. We will describe DNNs in more detail below,
    but for now it suffices to say that they make it faster and easier than ever before
    to find patterns in unstructured data. They are also highly modular. You can take
    a layer that is optimized for one type of data (e.g., images) and combine it with
    other layers for other types of data (e.g., text). You can also use layers that
    have been pretrained on one dataset (e.g., generic images) as components in a
    more specialized model (e.g., a specific recognition task).


    Specialized DNN architectures are responsible for the key GPML capability of working
    on human-level data: video, audio, and text. This is essential for AI because
    it allows these systems to be installed on top of the same sources of knowledge
    that humans are able to digest. You don’t need to create a new database system
    (or have an existing standard form) to feed the AI; rather, the AI can live on
    top of the chaos of information generated through business functions. This capability
    helps to illustrate why the new AI, based on GPML, is so much more promising than
    previous attempts at AI. Classical AI relied on hand-specified logic rules to
    mimic how a rational human might approach a given problem.9 This approach is sometimes
    nostalgically referred to as GOFAI, or “good old-fashioned AI.” The problem with
    GOFAI is obvious: solving human problems with logic rules requires an impossibly
    complex cataloging of all possible scenarios and actions. The'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'system designer must to know in advance how to translate complex human tasks
    into deterministic algorithms.


    The new AI doesn’t have this limitation. For example, consider the problem of
    creating a virtual agent that can answer customer questions (e.g., “Why won’t
    my computer start?”). A GOFAI system would be based on hand-coded dialog trees:
    if a user says $X$, answer $Y$, and so on. To install the system, you’d need to
    have human engineers understand and explicitly code for all of the main customer
    issues. In contrast, the new ML-driven AI can simply ingest all of the existing
    customer-support logs and learn to replicate how human agents have answered customer
    questions in the past. The ML allows the system to infer support patterns from
    human conversations. The installation engineer just needs to start the DNN fitting
    routine.


    This gets to the last bit of GPML highlighted in **Figure 10.1**, the tools that
    facilitate model fitting on massive datasets: out-of-sample ($OOS$) validation
    for model tuning, stochastic gradient descent ($SGD$) for parameter optimization,
    and graphical processing units ($GPUs$) and other computer hardware for massively
    parallel optimization. Each of these pieces is essential for the success of large-scale
    GPML. Although they are commonly associated with deep learning and DNNs (especially
    SGD and GPUs), these tools have developed in the context of many different ML
    algorithms. The rise of DNNs over alternative ML modeling schemes is partly because,
    through trial and error, ML researchers have discovered that neural network models
    are especially well suited to engineering within the context of these available
    tools.$^{10}$


    As we’ve covered throughout this book, OOS validation is a basic idea: you choose
    the best model specification by comparing predictions from models estimated on
    data that was not used during the model “training” (fitting). This can be formalized
    as a crossvalidation routine: you split the data into $K$ “folds” and then $K$
    times fit the model on all data but the $K$th fold and evaluate its predictive
    performance (e.g., mean squared error or misclassification rate) on the left-out
    fold. The model with optimal average OOS performance (e.g., minimum error rate)
    is then deployed in practice.


    ML’s wholesale adoption of OOS validation as the arbiter of model quality has
    freed the ML engineer from the need to *theorize* about model quality. Of course,
    this can create frustration and delays when you have nothing other than “guess-and-test”
    as a method for model selection. But, increasingly, the requisite model search
    is not being executed by humans: it is done by additional ML routines. This happens
    either explicitly, in *AutoML* frameworks that use simple auxiliary ML to predict
    OOS performance of the more complex target model, or implicitly by adding flexibility
    to the target$^{11}$'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'model (e.g., making the tuning parameters part of the optimization objective).
    The fact that OOS validation provides a clear target to optimize against—a target
    that, unlike the in-sample likelihood, does not incentivize overfit—facilitates
    automated model tuning. It removes humans from the process of adapting models
    to specific datasets.


    SGD optimization will be less familiar to most readers, but it is a crucial part
    of GPML. This class of algorithms allows models to be fit to data that is observed
    in only small chunks: you can train the model on a stream of data and avoid having
    to do batch computations on the entire dataset. This lets you estimate complex
    models on massive datasets. For subtle reasons, the engineering of SGD algorithms
    also tends to encourage robust and generalizable model fits (i.e., use of SGD
    discourages overfit).


    Finally, the GPUs: specialized computer processors have made massive-scale ML
    a reality, and continued hardware innovation will help push AI to new domains.
    Deep neural network training with stochastic gradient descent involves massively
    parallel computations: many basic operations executed simultaneously across parameters
    of the network. Graphical processing units were devised for calculations of this
    type, in the context of video and computer graphics display where all pixels of
    an image need to be rendered simultaneously, in parallel. Although DNN training
    was originally a side use case for GPUs (i.e., as an aside from their main computer
    graphics mandate), AI applications are now of primary importance for GPU manufacturers.
    Nvidia, for example, is a GPU company whose rise in market value has been driven
    by the rise of AI.


    The technology here is not standing still. GPUs are getting faster and cheaper
    every day. We are also seeing the deployment of new chips that have been designed
    from scratch for ML optimization. For example, field-programmable gate arrays
    (FPGAs) are being used by Microsoft and Amazon in their data centers. These chips
    allow precision requirements to be set dynamically, thus efficiently allocating
    resources to high-precision operations and saving compute effort when you need
    only a few decimal points (e.g., in early optimization updates to the DNN parameters).
    As another example, Google’s tensor processing units (TPUs) are specifically designed
    for algebra with “tensors,” a mathematical object that occurs commonly in ML.12


    One of the hallmarks of a general-purpose technology is that it leads to broad
    industrial changes, both above and below where that technology lives in the supply
    chain. This is what we are observing with the new general-purpose ML. Below, we
    can see that chip makers are changing the type of hardware they create to suit
    these DNN-based AI systems. Above, GPML has led to a new class of ML-driven AI
    products. As we seek more real-world AI'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'capabilities—self-driving cars, conversational business agents, intelligent
    economic marketplaces—domain experts in these areas will need to find ways to
    resolve their complex questions into structures of ML tasks. This is a role that
    economists and business professionals should embrace, where the increasingly user-friendly
    GPML routines become basic tools of their trade.


    # DEEP LEARNING


    We’ve stated that deep neural networks are a key tool in GPML, but what exactly
    are they? And what makes them *deep*? In this section, we will give a high-level
    overview of these models. This is not a user guide. For that, you might want to
    look to the excellent recent textbook [13] by Goodfellow, Bengio, and Courville.
    This is a rapidly evolving area of research, and new types of neural network models
    and estimation algorithms are being developed at a steady clip. The excitement
    in this area, and considerable media and business hype, makes it difficult to
    keep up to date. Moreover, the tendency of ML companies and academies to proclaim
    every incremental change as “completely brand new” has led to messy literature
    that is tough for newcomers to navigate. But there is a general structure to deep
    learning, and a hype-free understanding of this structure should give you insight
    into the reasons for its success.


    Neural networks are simple models. Indeed, their simplicity is a strength because
    basic patterns facilitate fast training and computation. The model has linear
    combinations of inputs that are passed through nonlinear activation functions
    called *nodes* (or, in reference to the human brain, neurons). A set of nodes
    taking different weighted sums of the same inputs is called a *layer*, and the
    output of one layer’s nodes becomes input to the next layer. This structure is
    illustrated in Figure 10.3. Each circle here is a node. Those in the input (furthest
    left) layer typically have a special structure; they are either raw data or data
    that has been processed through an additional set of layers (e.g., convolutions
    as we’ll describe in a moment). The output layer gives the predictions. In a simple
    regression setting, this output could just be $\hat{y}$, the predicted value for
    some random variable *y*, but DNNs can be used to predict all sorts of high-dimensional
    objects. As it is for nodes in input layers, output nodes also tend to take application-specific
    forms.'
