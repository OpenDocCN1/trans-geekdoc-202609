  md: 'This illustrates an important point: *No language is the best for all purposes*.
    You might imagine that you can learn a single programming language and never need
    to figure out any others. Unfortunately, computing technology is too dynamic for
    this to be true. Anyone working with data will need to continue learning and updating
    their computational (and methodological) skills.[1] Thus, when choosing the language
    for this book (and for MBA classes at the University of Chicago), the question
    was simple: What language is best for learning data science? After some thought
    and experimentation, we landed on R.


    R CAN READ ALMOST ANY DATA FORMAT. In this book, you will work mostly with `.csv`
    files containing *comma-separated values*. These are simple text files organized
    like a spreadsheet where the values (cell entries) are separated by commas. See
    the example in **Figure I.5**. The first row is a *header*, with column titles,
    and the remaining rows contain data entries.


    ![](img/315929ad4bddd26368466d02e06e2385_26_0.png)


    **FIGURE I.5**: The top of `pickup.csv`.


    This format of data storage is called a *flat file* because it has only two dimensions:
    data observations (rows) and variables (columns). The data is stored in a simple
    text file, and in general you can choose any type of value *delimiter* (tabs,
    pipes [ | ], and spaces are alternatives to commas). In this book, you will work
    with the `.csv` format because it is common and the default text file representation
    for Microsoft’s Excel software. Indeed, you can open any `.csv` file using Excel,
    and this is what your computer will likely default to using if you double-click
    the file icons.[2]


    Flat files are not a good format for data storage and management. Companies do
    not store their data in flat files. Instead, they typically make use of a mixture
    of storage platforms for both structured and unstructured data. The structured
    data, consisting of well-defined variables, will live in a traditional *relational*
    database containing a number of interconnected tables.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'This is the type of data that you access with a version of Structured Query
    Language (SQL):


    ```

    select apple_id, apple_price from grocerylist

    where apple_col = green

    ```


    The flavor of SQL that you use will depend upon the brand of database you are
    accessing; examples are Microsoft SQL, Oracle, Teradata, or SQLite. It is possible
    to run analysis on the databases themselves, and R has interfaces that allow you
    to pull data directly from the database into your workspace. However, a more typical
    workflow will have data pulled from the database using a SQL query (aggregated
    and sliced according to your specific needs) and then written into a flat file
    for later analysis. Many of the data examples for this text were originally pulled
    from a database in this way.


    Unstructured data, especially large unstructured data, will be stored in a *distributed
    file system* (DFS). These are systems that join together many machines over a
    network. Your data is broken into *blocks* that are stored on different machines,
    and the DFS provides mechanisms for working with such *partitioned* data. In this
    way, the DFS allows you to manipulate data that is far too big to be stored on
    a single computer. These are the systems that facilitate Internet-scale analysis—the
    processing of previously unmanageable amounts of data. One DFS framework that
    you might have heard of is Hadoop. Another heavily used DFS is Amazon’s S3, the
    backbone of storage on Amazon Web Services (AWS).


    This is the true big data. There are a variety of analysis platforms for wrangling
    and analyzing distributed data, the most prominent of which is Spark. When working
    at this scale, you need to make use of specialized algorithms that avoid having
    all of the data in a computer’s *working memory* at a single time. For example,
    the MapReduce framework consists of algorithms that can prepare and group data
    into relatively small chunks (Map) before performing an analysis on each chunk
    (Reduce). We will introduce this sort of *distributed computing* in later chapters,
    and tools such as R spark and Microsoft’s R server are making it relatively easy
    to adapt the methods you learn in this book to distributed computing environments.
    Although this text does not cover distributed computing in detail, almost all
    of the methods we introduce here are *scalable*. In other words, they will work
    quickly even on datasets that occupy a large percentage of your working memory,
    and they do not rely on inherently serial algorithms that are impossible to adapt
    to distribution.'
  merge: -1
  img_proc: true
