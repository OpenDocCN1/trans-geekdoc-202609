    is more varied than it is for R’s core functionality, but if a package has high
    usage, you can be confident that it works as intended.


    You can run R in many ways. There is a dedicated graphical user interface (GUI)
    for whatever operating system you use. This is the program you will work with
    if you access R through the icons that arrive when you download and install R.
    Alternatively, you can operate R through a *notebook* environment like that provided
