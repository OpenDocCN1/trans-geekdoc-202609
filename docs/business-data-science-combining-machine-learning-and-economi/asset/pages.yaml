    # PARTIAL LEAST SQUARES


    In the previous two examples, there was a clear low-dimensional factor structure
    in $x$: ideology in Congress and like-versus-dislike in the TV pilot survey. For
    the TV pilots, these factors were also directly related to the $y$ response of
    interest. *Nature will not always be this nice.* It is common to encounter $x$
    data that has been generated without a clear factor structure, or through some
    messy mix of underlying factors and idiosyncratic shocks. And even when there
    is factor structure in $x$, it will often be that $y$ is not related to the dominant
    sources of variation in $x$. The response is not driven by the first few PCs,
    and it is inefficient to try to estimate $v$ as a middle-man between $y$ and $x$.


    PCR will work only if the dominant directions of variation in $x$ are related
    to $y$. However, the idea of combining inputs into a few factors (or indices)
    that affect $y$ is an appealing framework. This strategy can lead to easier interpretation
    than a high-dimensional lasso onto raw inputs. Is there a way to force factors
    $v$ to be relevant to both $x$ and $y$? The answer is yes; this is referred to
    as *supervised factor modeling*, and it is a useful big data technique.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'There is a big world of supervised factor modeling, and there are several algorithms
    for supervised adaptations of PCA. We’ll consider the simple but powerful method
    of partial least squares (PLS), a supervised factorization strategy that has its
    roots in 1970s chemometrics but has been re-invented many times since.


    To understand PLS, we start with the more basic algorithm of *marginal regression*
    (MR). In this scheme, you simply regress $y$ on to each dimension of $x$ *independently*
    and then use the resulting regression coefficients to map from $x$ to a univariate
    factor $v$. This factor aggregates the *first-order* effect of each input variable
    on $y$. It will be dominated by $x_j$ dimensions that both (1) have a big effect
    on $y$ and (2) move consistently in the same direction with each other (since
    their influence on the factor is additive). That is, marginal regression constructs
    a single factor that is connected both to $y$ and to a dominant direction of variation
    in $x$. It yields a supervised factor.


    # **ALGORITHM 20 Marginal Regression**


    To build a model for prediction of $y$ from $x$:


    +   - Calculate $\varphi = [\varphi_1 \dots \varphi_p]$ where $\varphi_j = \text{cor}(x_j,
    y)/\text{sd}(x_j)$ is the OLS coefficient in a simple univariate regression for
    $y$ on $x_j$.

    - Set $v_i = x^\prime_{i\varphi} = \sum_j x_{ij} \varphi_j$ for each observation
    $i$.

    - Fit the “forward” univariate linear regression $y_i = \alpha + \beta v_i + e_i$.


    Given new $x_f$, you can then predict $\hat{y}_f = \alpha + \beta \times (x^\prime_f\varphi)$.


    One big advantage of MR is computational efficiency. The rise of distributed computing
    has led to a rediscovory of MR because it is easy to code in the MapReduce framework.
    In the Map step, you produce $[x_{ij}, y_i]$ pairs that are indexed by the dimension
    key $j$; the Reduce step then runs univariate OLS for $y$ on $x_j$ and returns
    $\varphi_j$. A second quick MapReduce algorithm is used to calculate $v_i = x^\prime_{i\varphi}$
    and run the forward regression for $y$ on $v$. Another advantage of MR (over,
    say, OLS) is that it works in arbitrarily high dimensions, even if $p \gg n$.
    MR is a strategy for supervised learning in ultra-high dimensions.


    As an example, let’s look at the problem of mapping from chemical properties of
    gasoline to its octane rating—a key measure of quality that determines pricing
    at the pump. In traditional practice, this octane is measured by running the fuel
    in a test engine under different compression'
  merge: -1
  img_proc: true
