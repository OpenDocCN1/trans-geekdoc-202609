  md: '![](img/315929ad4bddd26368466d02e06e2385_14_0.png)


    # # Introduction


    # ## A TALE OF TWO PLOTS


    Consider the graph in Figure I.1. This shows seven years of monthly returns$_{1}$
    for stocks in the S&P 500 index. Each dashed line denotes an individual stock’s
    return series. Their weighted average—the value of the S&P 500—is marked with
    a bold black line. The thin black line shows returns on three-month U.S. treasury
    bills.


    ![](img/315929ad4bddd26368466d02e06e2385_14_1.png)


    FIGURE I.1: A fancy plot: monthly stock returns for members of the S&P 500 and
    their average (the bold line). *What can you learn?*'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'This is a fancy plot. It looks cool, with lots of different lines. It is the
    sort of plot that you might see on a computer screen in a TV ad for some online
    brokerage platform. *If only I had that information, I''d be rich!*


    But what can you actually learn from **Figure I.1**? You can see that returns
    do tend to bounce around near zero.² You can also pick out periods of higher volatility
    (variance) where the S&P 500 changes more from month to month and the individual
    stock returns around it are more dispersed. That''s about it. You don''t learn
    *why* these periods are more volatile or when they will occur in the future. More
    important, you can''t pull out useful information about any individual stock.
    There is a ton of *data* on the graph but little useful information.


    INSTEAD OF PLOTTING RAW DATA, let''s consider a simple *market model* that relates
    individual stock returns to the market average. The capital asset pricing model
    (CAPM) regresses the returns of an individual asset onto a measure of overall
    market returns:


    ```

    r$_{jt}$ = $\alpha$$_j$ + $\beta$$_j$ *m*$_t$ + $\varepsilon$$_{jt}$ (I.1)

    ```


    The *output* *r*$_{jt}$ is equity *j* return at time *t* (actually the excess
    return³). The *input* *m*$_t$ is a measure of the average return—the “market”—at
    time *t*. You can take *m*$_t$ as the return on the S&P 500, which weights companies
    according to their market capitalization (the total value of their stock). Finally,
    $\varepsilon$$_{jt}$ is an *error* that has mean zero and is uncorrelated with
    the market: **E**[*$\varepsilon$$_{jt}$] = 0 and **E**[*m*$_t$, *$\varepsilon$$_{jt}$]
    = 0.


    Equation I.1 is the first regression model in this book. You''ll see many more.
    This is the “simple linear regression” (or ordinary least squares [OLS]) that
    should be familiar to most readers. The Greek letters define a line relating each
    individual equity return to the market, as shown in **Figure I.2** for example.
    A small $\beta$$_j$, near zero, indicates an asset with low market sensitivity.
    In the extreme, fixed-income assets like T-bills have $\beta$$_j$ = 0. On the
    other hand, a $\beta$$_j$ > 1 indicates a stock that is more volatile than the
    market, typically growth and higher-risk stocks. The $\alpha$$_j$ is free money:
    assets with $\alpha$$_j$ > 0 are adding value regardless of wider market movements,
    and those with $\alpha$$_j$ < 0 destroy value.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/315929ad4bddd26368466d02e06e2385_16_0.png)


    FIGURE I.2: A *scatterplot* of equity against market returns, with the fitted
    *regression line* for the model of Equation I.1 shown.


    Figure I.3 represents each stock “ticker” in the two-dimensional space implied
    by the market model’s fit on the seven years of data in Figure I.1. The tickers
    are sized proportional to each firm’s market capitalization. The two CAPM parameters—[α,
    β]—tell us a huge amount about the behavior and performance of individual assets.
    This picture immediately allows you to assess market sensitivity and arbitrage
    opportunities. For example, over this period both Amazon (AMZN) and Microsoft
    (MSFT) have similar market sensitivity, but Amazon has generated much more money
    independent of the overall market. Facebook (FB) exhibits remarkably low market
    sensitivity while generating a large α. Some of the older technology firms, such
    as Oracle (ORCL) and IBM, appear to have destroyed value over this period (negative
    α). Such information can be used to build portfolios that maximize mean returns
    and minimize variance in the face of uncertain future market conditions. It can
    also be used in strategies like pairs-trading,a,d where you find two stocks with
    similar β and buy the higher α while selling (*shorting*) the other.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/315929ad4bddd26368466d02e06e2385_17_0.png)


    FIGURE 1.3: Stocks positioned according to their fitted market model, where $\alpha$
    is money you make regardless of what the market does and $\beta$ summarizes sensitivity
    to market movements. The tickers are sized proportional to market capitalization.
    This plot is an example of the information visualization strategy that I will
    try to emphasize throughout: business data science is all about distilling your
    decision problems into a small number of variables that can be compared in a few
    simple plots.


    CAPM is an old tool in financial analysis, but it serves to illustrate what we
    strive toward in business data science. An interpretable model translates raw
    data into information that is directly relevant to decision-making. The challenge
    in data science is that the data you’ll be working with will be larger and less
    structured (e.g., it will include text and image data). Moreover, CAPM is derived
    from assumptions of efficient market theory, and in many applications you won’t
    have such a convenient simplifying framework on hand. But the basic principles
    remain the same: you want to project the information in your data into a low-dimensional
    space that contains key insights for the decisions you need to make. That is the
    reason for this book: to give you the tools to quickly turn messy data into useful
    information that has direct relevance to business policy.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# BIG DATA AND MACHINE LEARNING


    Big data (BD) and machine learning (ML) are the two forces behind the past decade''s
    revolution in data analysis. They are the two main elements that differentiate
    modern data analysis from its past. If you add BD and ML to statistics, you get
    data science. If you also add some economics and econometrics, plus a focus on
    business-relevant problems and decision-making, you get business data science.
    In this section, we''ll dive into both BD and ML and see why they are such game-changers.


    WHAT DOES IT MEAN FOR DATA TO BE BIG? The term big data has its origin in computer
    engineering. In that context, it refers to data that is so large that it cannot
    be loaded into memory or even stored on a single machine. This is where you need
    tools such as Hadoop and Spark and distributed algorithms that can compute data
    summaries across multiple independent machines. The bigness of the data here is
    primarily driven by n, the number of events or observations being logged. It is
    a big volume of data.


    This type of big—distributed-data-big—certainly plays an important role in business
    data science. In any data-intensive firm there will be data engineers who spend
    much of their job creating the “pipes” that turn the massive distributed raw data
    into digestible aggregations and slices. A business data scientist needs to be
    able to work with these engineers to collaborate in the cooking process—the process
    of deciding what variables to track and how they should be calculated.


    Although this book touches on some distributed data concepts (e.g., MapReduce
    algorithms and scalable computing), we will focus on the analysis layer that uses
    data from these pipes: statistical modeling and inference. There is a different
    notion of big data in this layer: the data dimension is big. This is data of high
    complexity. For example, online browsing behavior data might include visit counts
    across websites, and this yields a high-dimensional dataset (the dimension is
    the number of websites, which is large). As another example, for text analysis,
    the dimension of your models will depend upon the size of the vocabulary—the number
    of unique words in a corpus. And in all of these settings, you will observe the
    data across different people at different times and locations. This creates additional
    dimensions of complexity.


    The two notions of big here—volume and complexity—tend to get wrapped together.
    This is for good reason: you need a large volume of data to learn anything about
