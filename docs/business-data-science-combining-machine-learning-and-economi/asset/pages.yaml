- pgno: 241
  md: 'The treatment probability $q$ is called the *propensity score*. Given an estimate
    of this score—say, $\hat{q}(x)$—there are a variety of treatment effect estimation
    options. Propensity score adjustment fits the linear regression $\mathbb{E}[y
    \mid d, \hat{q}(x)] = \alpha + d\gamma + \hat{q}(x)\varphi$, while propensity
    score weighting estimates $\mathbb{E}[y \mid \hat{q}(x) \mid d] = \alpha + d\gamma$.
    See Imbens and Rubin [2015] for more detail, but both of these will work for estimating
    true $\gamma$ so long as the model in Equation 6.6 is correctly specified. So-called
    doubly robust methods follow either approach but also include $\boldsymbol{x}$
    in these second-stage regressions. I tend to favor a doubly robust procedure that
    closely resembles the LTE lasso of Algorithm 14: First fit a lasso logistic regression
    to estimate


    $\mathbb{E}[d \mid \boldsymbol{x}] = q(\boldsymbol{x}) = \frac{e^{\boldsymbol{x}''\boldsymbol{\tau}}}{1
    + e^{\boldsymbol{x}''\boldsymbol{\tau}}}. \quad \quad \quad \quad \quad \quad
    \quad \quad \quad \quad \quad (6.7)$


    Then follow step 2 of Algorithm 14 and fit a lasso to estimate


    $\mathbb{E}[y \mid \boldsymbol{x}, d] = \hat{q}(\boldsymbol{x})\boldsymbol{\vartheta}
    + d\gamma + \boldsymbol{x}''\boldsymbol{\beta} \quad \quad \quad \quad \quad \quad
    \quad \quad \quad (6.8)$


    with no penalty on $\boldsymbol{\vartheta}$. Propensity score *matching* is a
    related approach, common in medicine, where $\hat{q}(\boldsymbol{x}_{i})$ is estimated
    for each subject and you run a matching algorithm to find pairs of individuals
    $(i_{0}, i_{1})$ where $\hat{q}(\boldsymbol{x}_{i_{0}}) \approx \hat{q}(\boldsymbol{x}_{i_{1}})$
    but $d_{i_{1}} = 1$ while $d_{i_{0}} = 0$. The treatment effect is then estimated
    as the average difference across $n$ matched pairs, $\hat{\gamma} = \frac{1}{n}\sum_{i}(y_{i^{1}}
    - y_{i^{0}})$. Matching is a pain to implement because the matching algorithms
    are computationally expensive for large $n$, and it is unstable because results
    are highly sensitive to how you choose the matching criterion (i.e., how close
    is close enough for a match). However, it has the advantage that it is an easy
    procedure to explain for nonstatisticians: “You have two patients who look identical,
    one gets treatment and the other gets the control ...” You should feel free to
    use such explanations to help build intuition around your results (I do this all
    the time) even if you are actually making use of the regression techniques we
    advocate in this section.


    # ◆ SAMPLE-SPLITTING AND ORTHOGONAL MACHINE LEARNING'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'The LTE lasso and related approaches can give you point estimates of the treatment
    effects, but they don''t come with the nice *inferential* properties (i.e., standard
    errors) that you get from OLS. In **Chapter 3**, we introduced the parametric
    bootstrap and subsampling as methods for uncertainty quantification after model
    selection, and it is possible to adapt versions of those algorithms for use in
    treatment effect estimation. However, in the context of the LTE model, there is
    a nice alternative algorithm for inference: sample splitting.


    In a sample splitting algorithm, you split the sample into, say, two pieces. You
    do model selection on one piece and then, conditional upon that selected model,
    do standard inference on the second piece. For example, with a linear lasso you
    could apply OLS (i.e., fit the MLE) in the second stage using only those covariates
    that had a nonzero selected coefficient in the first-stage lasso regression.


    Recall the hockey example from **Chapter 3**. For every goal, coded as $y = 1$
    for home-team goals and $y = 0$ for away-team goals, we regressed $y$ onto indicators
    for the teams, for the game scenarios (e.g., power plays), and for which players
    were present on the ice. These indicators were signed according to home versus
    away teams so that, for example, a home player on the ice for goal $i$ has $x_{ij}
    = 1$ and an away team player on the ice has $x_{ij} = -1$ (and those off the ice
    are all zeros). We then built a big lasso regression that predicted, given who
    is on the ice, which team scored every goal.


    > Unlike the original analysis of **Chapter 3**, here we will penalize everything
    (including team and on-ice scenario coefficients). This is just to keep the example
    simple; you could also use sample splitting with the former specification.


    To do inference via sample splitting, we first fit a regression model to half
    of the data:


    ```

    ```r

    > library(gamlr)

    > data(hockey) # load the data

    > x <- cBind(config, team, player)

    > y <- goal$homegoal

    > fold <- sample.int(2, nrow(x), replace=TRUE)

    > nhlprereg <- gamlr(x[fold==1,], y[fold==1],

    +   family= "binomial", standardize=FALSE)

    ```

    ```'
  merge: -1
  img_proc: true
