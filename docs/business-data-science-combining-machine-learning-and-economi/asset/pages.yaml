    THE CHOICE OF K IS HIGHLY SUBJECTIVE. There is little information in the data
    on how many clusters there are in reality, and algorithms that automatically select
    K will be sensitive to assumptions about the component probability models. The
    exception to this is if you are using the cluster memberships *downstream* in
    some sort of prediction task, e.g., as inputs to a regression model. In that case,
    you can use the usual CV routines as a referee on the number of clusters. But
    otherwise, everything is descriptive—you are just trying to break the data into
    relatively homogeneous groups. It is wise to try a few K and use the one leading
    to clusters that make sense to you.


    If you choose to ignore this advice, it is possible to use data-based model building
    here. As always, the procedure follows a recipe of model enumeration followed
    by selection:


    +   1. Enumerate models for K_{1}<K_{2}\dots K_{T} clusters.

    2. Use a selection tool to choose the best model for new x.


    The newness of x is key: as always, you want the model to have low out-of-sample
    deviance. In-sample deviance is useless, as you could always get a'
