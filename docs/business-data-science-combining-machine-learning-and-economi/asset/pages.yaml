- pgno: 382
  md: 'dimension of potential sources of heterogeneity) is low relative to the sample
    size (e.g., $p < \sqrt{n}$ is a rule of thumb). For higher-dimensional inputs,
    you can get better results by using lasso-type linear estimators (i.e., interacting
    treatment with other inputs in a linear model, as we did in **Chapter 6** as an
    extension of orthogonal ML). This is also a hot area of research in the ML community
    and there are a variety of *semi-parametric* methods being developed to predict
    HTEs. For example, the framework of Hartford et al. [2017] uses deep neural networks
    to model HTEs in an instrumental variables setting (and can thus also be applied
    to study randomized trials). As causal inference becomes a more important topic
    in ML, expect faster and better HTE prediction algorithms.


    # ## SEMIPARAMETRICS AND GAUSSIAN PROCESSES


    Although this chapter is about nonparametrics, everything we have discussed so
    far makes use of a single technology—trees. This is for good reason; among nonparametric
    regression methods, nothing is faster, is more robust, and performs better off-the-shelf
    than ensembles of trees. But we haven’t even covered the full breadth of tree
    frameworks. The most important alternative class of tree-based algorithms, beyond
    random forests, is built around gradient boosting machines.¹⁶ (GBMs). These GBMs
    make use of the boosting procedure that we introduced in **Chapter 7** as the
    basis for partial least squares. They iteratively estimate a sequence of shallow
    trees, each trained to predict the residuals of the previous tree. This leads
    to a prediction rule that combines many simple (and stable) trees.¹⁷ In practice,
    I have found RFs easier to work with at massive scale than GBMs because of the
    robustness of bagging as a mechanism for avoiding overfit (GBMs require some sort
    of CV to choose when to stop boosting). However, there are many examples of successful
    industrial-scale GBM deployments, and if you find yourself with colleagues who
    favor boosting over forests, you don’t need to worry.


    One class of common alternatives to tree-based methods are *sieve* estimators
    that represent functions via *basis expansions*—sums of approximating functions.
    Sieve estimators remain popular with classical economists and statisticians because
    they are relatively easy to study mathematically. A sieve takes the following
    form:'
  merge: -1
  img_proc: true
- pgno: 383
  md: '$$\mathbb { E } [ \boldsymbol { y } \mid \boldsymbol { x } ] = \sum _ { k =
    1 } ^ { K } { \boldsymbol { \omega } } _ { k } \psi _ { k } ( { \boldsymbol {
    x } } ) . \tag{9.5}$$


    Here, $K$ increases with the amount of data that you have available. For example,
    a polynomial series has $\psi_k(x) = (x'')^k/k!$. *Wavelets* are a class of basis
    functions that satisfy nice mathematical properties; Vidakovic and Mueller [1994]
    provide a user-friendly overview. And *shallow* neural networks (the sort that
    were popular in the 1980s and 90s) can be written as a series estimator like that
    in Equation 9.5.$^{18}$


    One other nonparametric framework of note is that of support vector machines (SVMs).
    These resemble sieves in that they involve basis expansion, but the expansions
    are used as input to discriminant classifiers rather than as function approximations.
    SVM algorithms are interesting theoretically,$^{19}$ but in practice they are
    unstable and difficult to tune. I and others$^{20}$ attribute their sustained
    popularity in some application areas (e.g., finance) to an ignorance of alternatives.
    Again, if you want nonparametric regression and are interested in practical prediction
    performance, trees are your tool.


    However, nonparametric regression is not always (or even often) the best approach
    to prediction. Trees and splines are extremely flexible—with enough data they
    can approximate arbitrarily complex functions. However, this comes at the price
    of *instability*: nonparametric regression methods have very high sampling variance
    and are sensitive to noise in the data. They are susceptible to overfit, and techniques
    such as bagging can only help so much. This is the famous “bias versus variance”
    trade-off: nonparametric regression methods have little or no bias (they can represent
    any functional form), but this inevitably yields high variance estimates.


    As has been mentioned elsewhere, a decent rule of thumb is that you should have
    $p < \sqrt{n}$ for nonparametric regression to be a high-performing option.


    For high-dimensional inputs, a great option is to use the regularized linear regression
    methods emphasized throughout this book. However, there is also a middle ground
    between nonparametrics and linear models. *Semiparametric* methods mix flexible
    function approximation with restrictive domain-specific structure. You might combine
    a flexible mean function approximation with strong distributional assumptions—for
    example, additive $\varepsilon \sim \mathrm{N} (0, \sigma^2)$ errors or a multinomial
    sampling model (e.g., the bag-of-words model for text).


    Much of contemporary ML relies upon semiparametric *kernel* methods that *smooth*
    predictions across observations that are “near” each other. A kernel is'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'a mathematical abstraction for defining distance between two input vectors,
    and you can use domain knowledge to help inform which observations are near or
    far from each other. Thus, in a simple example, $\hat{y}(x_{S})$ and $\hat{y}(x_{I})$
    will be similar if $x_{S}$ and $x_{I}$ are nearby according to the fitted kernel,
    and this kernel can be given application-specific structure.


    In **Chapter 10**, we will describe how contemporary *deep* neural networks are
    semiparametric regression tools. They make use of restrictive kernel smoothing
    on the inputs—e.g., smoothing (“convolution”) across neighboring pixels in images
    or across words that are estimated to be near to each other in meaning. The innovation
    of deep learning is that the outputs of this kernel smoothing, which are typically
    of much lower dimension than the original covariates, are used as inputs something
    that looks like the sieve estimator of Equation 9.5. This combination of restrictive
    dimension reduction with flexible basis expansion has been widely successful.
    It powers much of the modern industrial machine learning.


    > The line between semi- and nonparametrics is fuzzy. There are kernel regression
    algorithms with data-dependent kernels that are as flexible as standard sieves,
    and there are restrictive sieve algorithms that impose high degrees of smoothness.
    In fact, you can draw a theoretical equivalence between almost any sieve estimator
    and a kernel method that gives the same predictions. The distinction we''re drawing
    is on common implementation of these frameworks: ML applications of kernel methods
    typically use domain-specific knowledge to guide the structure of smoothing across
    observations.


    GAUSSIAN PROCESSES (GPs), which are a powerful modeling framework in their own
    right, serve as a more transparent illustration of kernel methods. GPs are relatively
    simple models that smooth predictions across observations according to distances
    between the original inputs—say, $x_{S}$ and $x_{I}$ as earlier. This is in contrast
    to the deep neural network models which first project from raw inputs to low-dimensional
    spaces (think of methods like PCA) and calculated distances in these lower dimensions.
    In the language of modern ML, the GPs are “shallow.”^21 However, these simple
    models are extremely useful and commonly deployed, especially in applications
    involving spatial data or physical systems. We’ll briefly introduce GPs to close
    this chapter; look to Rasmussen and Williams [2006]^22 for a more detailed overview.


    Consider a standard regression setup, with inputs $x$ and response $y$. A Gaussian
    process models the responses at two locations as draws from a multivariate normal
    (i.e., Gaussian) distribution:'
  merge: -1
  img_proc: true
- pgno: 385
  md: '$$\begin{bmatrix} y_s \\ y_t \end{bmatrix}\sim\mathbf{N}\left(\mathbf{0},\sigma^{2}\begin{bmatrix}
    1 & \kappa(\mathbf{x}_{s},\mathbf{x}_{t}) \\ \kappa(\mathbf{x}_{t},\mathbf{x}_{s})
    & 1 \end{bmatrix}\right)\tag{9.6}$$


    Here, $\kappa(\mathbf{x}_{s},\mathbf{x}_{t})$ is the *kernel function*. That is,
    $\kappa(\mathbf{x}_{s},\mathbf{x}_{t})$ defines the *correlation* between the
    corresponding responses, cor($y_{t}, y_{s}$). ${ }^{23}$ For example, the common
    *exponential* kernel function has


    $$\kappa(\mathbf{x}_{s},\mathbf{x}_{t}) = \exp\left[ -\sum_{j} \frac{\left(\mathbf{x}_{s
    j} - \mathbf{x}_{t j}\right)^{2}}{\delta_{j}} \right]\tag{9.7}$$


    Here, correlation decreases with the exponentiated Euclidean distance between
    entries of the input vectors. *Range* parameters, the $\delta_{j}$, allow for
    different units of distance in different input coordinates. The end result is
    a function of smoothly decaying dependence between responses, $y_{t}$ and $y_{s}$,
    as a function of distance between inputs. Note that $\kappa(\cdot,\cdot)$ produces
    values between 0 and 1 (you can''t have negative dependence under this kernel)
    and that $\kappa(x_{i}, x_{i}) = 1$ (the correlation between every observation
    and itself is 1).


    It might seem strange to have a regression method without an explicit mean function:
    the mean in Equation 9.6 is zero, regardless of input coordinates. ${ }^{24}$
    However, the *conditional* distribution for $y_{s}$ given $y_{t}$ will have a
    nonzero mean. Properties of the Gaussian distribution imply that, under the model
    in Equation 9.6, the conditional distribution is


    $$y_{s} \mid y_{t} \sim \mathbf{N}\left( y_{t}\kappa(\mathbf{x}_{s},\mathbf{x}_{t}),\sigma^{2}[1
    - \kappa(\mathbf{x}_{s},\mathbf{x}_{t})^{2}]\right)\tag{9.8}$$


    Here, the distribution for $y_{s}$ is a function of the value of its neighbor,
    $y_{t}$. The mean for $y_{s}$ is a linear function of $y_{t}$, and the conditional
    variance for $y_{s}$ is *smaller* than the unconditional variance, $\sigma^{2}$.
    This is the essence of kernel regression: predictions at new inputs are combinations
    of the existing observations, with combination weights that depend upon the distance
    between new and existing input locations.


    In a full data example, you have $n$ total sample observations—all of which are
    assumed jointly drawn from a multivariate Gaussian. In addition, it is prudent
    ${ }^{25}$ to add a positive *nuggent* $\mathbf{g}$ to diagonals of the covariance
    matrix; otherwise, the rule in Equation 9.8 implies perfect interpolation (zero'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'variance) at already observed $x$ locations. The resulting GP covariance matrix
    is then


    ![](img/315929ad4bddd26368466d02e06e2385_386_0.png)


    Under the multivariate version of the conditioning rule in Equation 9.8, this
    covariance matrix can then be used to combine observed responses, $y$, to predict
    the response at any new input locations.


    To fit GPs in R, you can make use of the `laGP` package.[26] This package was
    developed to implement algorithms for fitting *approximate* GPs on massive datasets
    (which is great, because you can keep using `laGP` as you scale to larger applications)
    but also provides fast and robust routines for fitting standard GPs. Detailed
    examples are provided in Gramacy [2015] and in the package documentation.


    We will illustrate using the motorcycle data from earlier in this chapter. Recall
    that the (univariate) input is the time since crash impact and the response is
    the acceleration of the rider’s helmet.


    ```

    ```R

    library(MASS)

    x <- mcycle[,1,drop=FALSE]

    y <- mcycle[,2]

    ```

    ```


    `laGP` works by first doing some prework to get a rough guess at the kernel parameters,
    the nugget $g$ and the range $\delta$ (which it calls d). We then use these pre-estimates
    to initialize a `newGP`—an in-memory object that exists as part of the back-end
    infrastructure of `laGP` (all coded in C, which is why the package is fast and
    robust).'
