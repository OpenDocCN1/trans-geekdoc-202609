- pgno: 345
  md: 'Before leaving text behind for a bit, here is an important reminder that is
    relevant to any novice text-miner: when you introduce text data, don’t forget
    all that you already know. If you get access to a Twitter feed, don’t just naively
    try to use this data to predict, for example, stock prices. Instead, use the text
    as a complement to the existing trading system—use it to predict residuals. Text
    information is best as part of a larger system. Use it to fill in the pieces you
    don’t know and to automate analysis that is expensive and time-consuming.


    # COLLABORATIVE FILTERING


    At the beginning of this chapter, we were clear that the bag-of-words representation
    is a brutal oversimplification of language. However, we’ve seen that this simple
    framework can facilitate a number of powerful text analysis frameworks. The simplicity
    of the bag-of-words representation leads us to treat text as a series of generic
    counts. This implies that the tools of text analysis we’ve covered in this chapter
    should apply beyond text to any other setting that is centered on count data.


    One important case is that of collaborative filtering: the task of predicting
    a person’s future choices from their and others’ past choices. A well-known example
    is the Netflix problem: Given past movie choices, what should be recommended for
    you to watch tonight? The data here is essentially the same as what you get for
    text: each user has a vector $x_i$ containing 0/1 information for what they have
    watched. we’d like to, for example, find underlying genres that collect movies
    watched by the same people.


    I don’t know what Netflix uses as a collaborative filtering scheme, and I imagine
    that it depends upon movie context (e.g., reviews, actors, content) as well as
    past transaction data. But the creative “genres” that they suggest on their platform
    (e.g., “darkly comedic historical drama”) suggest that they are fitting some sort
    of a topic model and building an ex-post interpretation around the topics.


    Collaborative filtering is far more general than movie recommendation. As Amazon
    says, “People who buy this book also bought . . .” One way to approach the problem
    is to run a ton of logistic lasso regressions—one for each product (movie) on
    to every other product. This is actually not a bad idea, if you have the massive
    computing resources that it requires. A lower fidelity but more computationally
    feasible alternative is the classic data mining strategy of market basket analysis
    (MBA), which searches efficiently through the data for association rules.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'An association rule is a case where the conditional probability of product
    A given you also purchase product B is high—much higher than the unconditional
    probability for product A. For example, perhaps when you buy beer, you need chips
    for the munchies. If you only ever buy chips after beer, then there will be an
    association rule: beer → chips. However, if you always buy chips regardless of
    beer, then the probability of chips will be high, but this is not an association
    rule because beer doesn''t make a difference.


    That''s it. MBA has its own lingo that can confuse outsiders, but this can be
    easily translated into basic probabilities. Suppose that chips are purchased 10%
    of the time in general, but 50% of the time when the consumer grabs beer. You
    then have a beer → chips association rule.


    +   - The **support** for chips is 10%. This is p(chips).

    - The **confidence** of this rule is 50%. This is p(chips|beer).

    - The rule **lift** is 5: 50% is 5 times higher than 10%. This is


    ```

    \frac{\text{p(chips|beer)}}{\text{p(chips)}} = \frac{\text{p(chips,beer)}}{\text{p(beer)p(chips)}}

    ```


    the increase in the joint probability relative to what you''d expect if chips
    and beer were independent.


    Association rules with high lift are most useful because they tell you something
    you don''t already know.


    There''s no deep theory around association rules. You just scan the product pairings
    to find interesting high-lift and high-confidence rules. To illustrate, we''ll
    switch from movies and beer to music. We have data from last.fm, an online radio
    service. For each of 15,000 users, we have the playlist of their recent listening
    session.


    ```

    > head(lastfm)

    ```


    |   | user | artist | sex | country |

    |---|------|--------|-----|---------|

    | 1 | 1    | red hot chili peppers | f | Germany |

    | 2 | 1    | the black dahlia murder | f | Germany |

    | 3 | 1    | goldfrapp | f | Germany |

    | 4 | 1    | dropkick murphys | f | Germany |

    | 5 | 1    | le tigre | f | Germany |'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'To find a set of association rules in R, you can use the apriori function from
    the arules package. There is a whole ecosystem around the arules package, serving
    the world of market basket analysts. To use it, you need to use arules to get
    the data into a certain special basket format, but after these manipulations,
    the package is easy to use. Here, we fit the association rules on the lastfm data
    and return those of high lift and confidence.


    ```

    ```

    > library(arules)

    > playlists <- split(x=lastfm$artist, f=lastfm$user)

    > playlists <- lapply(playlists, unique)

    > playtrans <- as(playlists, "transactions")

    >

    > # find rules with support > .01 & confidence >.5 & length (# artists) <= 3

    > musicrules <- apriori(playtrans,

    +          parameter=list(support=.01, confidence=.5, maxlen=3))

    > inspect(subset(musicrules, subset=lift > 5))

    ```


    ```


    | | lhs | rhs | support | confidence | lift |

    |---|---|---|---|---|---|

    | 1 | {t.i.} | => | {kanye west} | 0.01040000 | 0.5672727 | 8.854413 |

    | 2 | {the pussycat dolls} | => | {rihanna} | 0.01040000 | 0.5777778 | 13.415893
    |

    | 4 | {sonata arctica} | => | {nightwish} | 0.01346667 | 0.5101010 | 8.236292
    |

    | 5 | {judas priest} | => | {iron maiden} | 0.01353333 | 0.5075000 | 8.562992
    |

    | 20 | {led zeppelin, the doors} | => | {pink floyd} | 0.01066667 | 0.5970149
    | 5.689469 |

    | 21 | {pink floyd, the doors} | => | {led zeppelin} | 0.01066667 | 0.5387205
    | 6.802027 |



    We’ve discovered that listeners of Judas Priest are nine times more likely to
    listen to Iron Maiden and that listeners of both Led Zeppelin and The Doors are
    six times more likely to dig Pink Floyd.


    Association rules can give you some useful insights, but they are limited to comparisons
    between pairs or small sets of products. The algorithm also remains fairly slow
    by modern standards. Instead, we can look to our wider toolbox. Topic modeling
    is one tool that is especially useful for collaborative filtering. The multinomial
    response model works well with binary choice data, and once you have fitted topic
    scores you can suggest new products of high probability in whatever topics it
    appears your user favors. This is an example of a standard and robust ML tool
    (topic modeling) having immediate'
  merge: -1
  img_proc: true
