- pgno: 185
  md: 'because it can be changed independently from all other upstream influences
    on the response of interest. The notion of independence is the key statistical
    property of treatments in a causal analysis: we want to know what will happen
    if we act to change the treatment variable(s).


    Treatment variables can be discrete or continuous. For example, the variable in
    a pharmaceutical trial could be $di = 1$ for subjects $i$ who are given a new
    drug and $di = 0$ for those receiving a placebo or control dose. Price is a common
    continuous treatment variable: as a business you decide to “treat” your potential
    customers to price $d$ at time $t$, and they will choose to buy or not buy your
    product at this price. You can also have multiple treatments of all different
    sorts; for example, television marketing campaigns for consumer goods are often
    accompanied by price promotions so that you have a discrete marketing treatment
    (show or don’t show ad) and a continuous price treatment (discount size). We will
    focus our introductory discussion on discrete treatments, but the ideas translate
    to continuous settings and we will cover examples for a variety of scenarios.


    Experiments can be discussed in terms of their design: the scheme through which
    treatment is assigned. Many readers will be familiar with the notion of an AB
    trial, which is Silicon Valley’s label for a completely randomized design wherein
    the experiment subjects are randomly assigned to treatment status. For example,
    you might randomize your website users into groups A and B; those in A, the control
    group, see the current website, and those in B see a new layout.


    On large-scale online platforms, it is difficult to make sure that treatment is
    truly randomly designed. For example, in a website experiment, it could be that
    one of the many entry points to your site leads users only to the control (version
    A) landing page. To check that this is not happening, AB platforms typically run
    AA tests that show the same website in groups A and B. If you see a significant
    difference between groups in an AA trial, then something is likely wrong in your
    randomization.


    The massive advantage of an AB trial is that since treatment is completely randomized,
    it is easy to estimate the average treatment effect (ATE) on the response y. Suppose
    that the treatment variable is $di = 0$ for users i in group A and $di = 1$ for
    those in group B. Then the ATE is the mean difference in response, averaged over
    all other influences on y in your distribution of users, for option B instead
    of A:


    ```

    ATE = E[y | d = 1] - E[y | d = 0]. (5.1)

    ```


    Crucially, for Equation 5.1 to have a causal interpretation, we require that d
    is independent of all other factors that could influence y. In an AB trial, this'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'independence is achieved through randomization. See the end of this section
    for a more flexible formulation of the ATE that makes use of the concept of *potential
    outcomes*.


    When treatment has been randomized, you know that differences between the two
    treatment groups have been caused by their difference in treatment status. Thus,
    estimation for the ATE becomes simply estimation for the difference in means between
    two groups. This is material you learn in your first statistics class. Suppose
    $\bar{y}_0 = \frac{1}{n_0} \sum_{d_i=0} y_i$ and $\bar{y}_1 = \frac{1}{n_1} \sum_{d_i=1}
    y_i$ are the sample means for the $n_0$ and $n_1$ users in groups *A* and *B*,
    respectively. Then your ATE point estimate is


    ```

    $$\widehat{ATE} = \bar{y}_1 - \bar{y}_0. \qquad (5.2)$$

    ```


    Assuming that the users are all *independent* from each other, the standard error
    on this ATE is available through the standard formula:


    ```

    $$\begin{align} \mathrm{se}(\bar{y}_1 - \bar{y}_0) &= \sqrt{\frac{1}{n_0} \overline{\mathrm{var}(y_i
    | d_i=0)} + \frac{1}{n_1} \overline{\mathrm{var}(y_i | d_i=1)}} \\ &= \sqrt{\frac{\sum_{d_i=0}
    (y_i - \bar{y}_0)^2}{n_0 (n_0 - 1)} + \frac{\sum_{d_i=1} (y_i - \bar{y}_1)^2}{n_1
    (n_1 - 1)}} \quad . \qquad (5.3) \end{align}$$

    ```


    Usual central limit theorem arguments imply that the sample means are normally
    distributed for large samples and a 90% confidence interval for the ATE is $\bar{y}_1
    - \bar{y}_0 \pm 2 \mathrm{se}(\bar{y}_1 - \bar{y}_0)$.


    As an example, let’s look beyond web experiments to a large-scale policy experiment.
    In 2008, the state of Oregon gained funding to expand its coverage for Medicaid—the
    U.S. social program that provides health insurance to people who cannot afford
    private insurance. Since demand was (correctly) expected to outstrip supply, the
    state worked with researchers to design a lottery that randomly allocated eligibility
    for Medicaid enrollment among the state’s low-income population. This led to the
    Oregon Health Insurance Experiment (OHIE), a randomized controlled AB trial for
    measuring the treatment effect of Medicaid eligibility.


    There are many outcomes of interest here. Since the people in each treatment group
    were tracked for only 12 months, we don’t get to observe long-term differences
    between the two groups and it is difficult to draw'
