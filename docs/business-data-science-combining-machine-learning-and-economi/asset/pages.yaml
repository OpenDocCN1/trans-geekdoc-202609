    # ## COMPUTATION


    To learn from this book, you need to be able to write and understand computer
    code. I''m not asking you to write object-oriented C++, to build a portable application
    with statically typed Scala, or to engineer production-quality software. You don''t
    need to be a software engineer to work as a business data scientist. But you do
    need to be able to read and write in a high-level *scripting* language—in other
    words, flexible code that can be used to describe recipes for data analysis.


    The ability to interact with computers in this way—by typing commands rather than
    clicking buttons or choosing from a menu—is a basic data analysis skill. Having
    a script of commands allows you to rerun your analyses for new data without any
    additional work. It also allows you to make small changes to existing scripts
    to adapt them for new scenarios. Indeed, making small changes is how I recommend
    you work with the material in this book. The code for every in-text example is
    available online, and you can alter and extend these scripts to suit your data
    analysis needs.


    The languages for data science and machine learning are getting progressively
    "higher level," meaning that you can do more with short statements and that grittier
    programming issues (e.g., memory allocation, data partitioning, optimization)
    are being solved automatically in the background. Some of the most exciting advances
    along these lines are in the area of deep learning, the type of general-purpose
    ML that powers the current rise in artificial intelligence technology (see Chapter
    10). For example, Gluon wraps (i.e., provides higher-level functionality around)
    MXnet, a deep learning framework that makes it easier and faster to build deep
    neural networks. MXnet itself wraps C++, the fast and memory-efficient code that
    is actually compiled for execution. Similarly, Keras is an extension of Python
    that wraps together a number of other deep learning frameworks, such as Google''s
    TensorFlow. These and future tools are creating a world of friendlier interfaces
    for faster and simplified machine learning.


    In the examples for this book, all of your analysis will be conducted in R. This
    is an open-source high-level language for data analysis. R is used widely throughout
    industry, government, and academia. Microsoft produces an official enhanced version
    of R, and it and other companies sell enterprise'
