  md: 'Beyond controlling for the effect of who else is on the ice, we also want to
    control for things unrelated to player ability (crowd, coach, schedule, etc.).
    To this end, we add a “fixed effect” for each team season, $a_{team,season}$.
    In addition, special-teams configurations (e.g., a five-on-four power play) are
    controlled for through $a_{config}$ effects. The full logistic regression model
    is then


    ![](img/315929ad4bddd26368466d02e06e2385_138_0.png)


    We interpret $\beta_j$ as the $j$th player’s partial effect: when a goal is scored
    and player $j$ is on ice, odds are multiplied by $e^{\beta_j}$ that his team scored.
    This is a regression-based improvement on the traditional PM score.


    You can run the model and use CV selection with a call to cv.gamlr.


    ```

    ```

    > x <- cBind(config, team, player) # cBind binds together two sparse matrices

    > y <- goal$homegoal

    > cv.nhlreg <- cv. gamlr(x, y, verb=TRUE, # verb prints progress

    +     free=1: (ncol(config)+ncol(team)), # free denotes unpenalized columns

    +     family="binomial", standardize=FALSE)

    fold 1,2,3,4,5,done.

    ```

    ```


    The cv.gamlr object stores a gamlr object (the full data path fit) as one of its
    entries, and you can plot both the regularization paths and the CV experiment
    as in Figure 3.11:'
