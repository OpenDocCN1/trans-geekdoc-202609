    \n```\n> # with -1 to drop the intercept\n> oj$brand <- naref(oj$brand)\n> xbrand\
    \ <- sparse.model.matrix(~ brand, data=oj)\n> xbrand [c(100,200,300),]\n3 x 4\
    \ sparse Matrix of class \"dgCMatrix\"\n```\n\n            (Intercept) branddominicks\
    \  brandminute.maid  brandtropicana\n100                 1              .    \
    \                .                   1\n200                 1              . \
    \                   1                   .\n300                 1             \
    \ 1                    .                   .\n\n```\n> oj$brand[c(100,200,300)]\n\
    [1] tropicana  minute.maid  dominicks\nLevels: <NA>  dominicks  minute.maid  tropicana\n\
    ```\n\nThe only other thing to recognize with lasso regression designs is that\
    \ size (of the covariates) now matters. Since the $b_k$ values are all penalized\
    \ by the same $\\lambda$, you need to make sure they live on comparable scales.\
    \ For example, $x \\beta$ has the same effect as $(2x) \\beta/2$, but $|\\beta|$\
    \ is twice as much penalty cost as $|\\beta/2|$. The common solution to this is\
    \ to multiply $\\beta_j$ by $sd(x_j)$, the standard deviation of $x_j$, in the\
    \ cost function to standardize across scales. That is,"
