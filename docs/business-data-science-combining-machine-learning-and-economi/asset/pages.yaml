  md: 'Single-nucleotide polymorphisms (SNPs) are paired DNA locations that vary across
    chromosomes. The allele that occurs most often is major (symbolized $A$), and
    the other is minor ($a$). For example, a common SNP summary is minor allele frequency
    (MAF).


    MAF: $AA \rightarrow 0$ $Aa/aa \rightarrow 1$ $aa \rightarrow 2$. \hspace{5em}
    (1.9)


    In this context, a simple GWAS asks the question, “Which SNP MAF distributions
    vary with disease?” Significant dependence between MAF and disease status marks
    that location as promising for exploration.


    Willer et al. [2013] describe meta-analysis of GWAS for cholesterol levels. We’ll
    focus on the “bad” LDL cholesterol. At each of 2.5 million SNPs, they fit the
    simple linear regression


    $\mathbb{E}[LDL] = \alpha + \beta AF \,.$


    Here, AF is allele frequency for the “trait increasing allele” (you can think
    of this as essentially the MAF). Willer et al. have 2.5 million SNP locations,
    implying 2.5 million tests of $\beta \neq 0$ and thus 2.5 million $p$-values.


    This set of $p$-values is plotted in **Figure 1.13**. Recall that $p$-values from
    the null (in this case, $\beta=0$ and no disease–AF association) are uniformly
    distributed. The histogram in **Figure 1.13** looks *almost* uniform, except for
    a small spike near zero of *extra small* $p$-values. The $p$-values in this spike,
    which look smaller than what you’d get from a true null distribution, are the
    only hope for discovery.


