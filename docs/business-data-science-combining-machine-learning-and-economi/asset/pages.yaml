- pgno: 233
  md: '# HIGH-DIMENSIONAL CONFOUNDER

    ADJUSTMENT


    Before diving into specific LTE estimation strategies, we will work through an
    example. In a study that was popularized in the book *Freeconomics*,2 Donohue
    and Levitt argue a controversial thesis: that easier access to abortion *causes*
    decreased crime.3 They have a variety of mechanisms proposed, the most commonly
    cited being that with access to abortion births are postponed until the mother
    is more ready. That is, they posit a causal chain where abortion leads to increased
    family stability, which leads to better upbringings, which leads to fewer criminals.
    Levitt and Donohue produce data analyses to support their claim. They fit regression
    models and find that abortion rates have a negative coefficient for prediction
    of, for example, the per capita murder rate.


    There’s obviously no experiment here. How are the Freakonomists coming up with
    these causal conclusions? The answer is that Levitt and Donohue have made an assumption
    of conditional ignorability after controlling for a basket of confounders. You
    can replicate their analysis by looking at publicly available data.4 They study
    a number of criminal outcome variables, but we’ll focus on the murder rate since
    it is not subject to changes in reporting over time or across states. Suppose
    $y_{st}$ is the logged murder rate in state $s$ in year $t$. The treatment variable
    $d_{st}$ is an effective abortion rate, measured in terms of the number of legal
    abortions per ten live births. The $d_{st}$ variable is constructed to aggregate
    past abortion rates according to their relevance to current criminals.


    The list of confounders, encoded as *xst*, includes the following:


    +   - *prison*: Log number of prisoners per capita

    - *police*: Log number of police per capita

    - *ur*: Current unemployment rate

    - *inc*: Current per capita income

    - *pov*: Current poverty rate

    - *AFDC*: A measure of charitable generosity at year $t - 15$

    - *gun*: A dummy for existence of a concealed weapons law

    - *beer*: The current beer consumption per capita


    This seems like a decent list of things to worry might pollute your causal estimates.
    Are there any others? Sure, but this is what we’ve got available, so we’ll go
    ahead and do the analysis with this list. In addition, we include fixed'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'state effects $a_s$ and a linear time trend $t\delta_t$. These are useful for
    controlling for omitted confounders; for example, state effects control for variables
    that shift both murder and abortion rates for a single state.


    The full regression model is then


    ```

    $$\mathbb{E}[y_{st}] = \alpha_s + t\delta_t + d_{st}\gamma + x''_{st}\boldsymbol{\beta}.
    \qquad (6.3)$$

    ```


    We fit it using OLS:


    ```

    > summary(orig <- glm(y ~ d + t + s + ., data=controls))$coef[''d'',]

    >  Estimate Std. Error t value Pr (>|t|)

    > -2.085088e-01 4.086665e-02 -5.102173e+00 4.592426e-07

    ```


    The result says that abortion has a significant negative effect on the murder
    rate. Since our response is the logged murder rate, the estimated $\hat{\gamma}$
    implies that one more abortion per ten live births (the units of $d$) leads to
    a 19% reduction in the per capita murder rate.


    ```

    > 1 - exp(-2.085088e-01)

    > [1] 0.1882061

    ```


    The effect is statistically significant, with a $p$-value below 0.005.


    > Donohue and Levitt [2001] use fixed-year effects $\alpha_t$ instead of the linear
    trend $\delta t$. This yields a lower $\hat{\gamma} = -0.12$ on this data. These
    controls and others are added in our later analysis.


    Are you skeptical? You probably should be. Consider an alternative story about
    cell phones and murder. I can argue that cell phone use has caused lower murder
    rates. There are a number of mechanisms through with this occurs. For example,
    cell phones lead to faster response by paramedics (it’s easier to call 911) so
    that fewer people die. Or perhaps cell phone usage is a surrogate for the move
    from manual labor to more gentle desk-and-phone jobs (making us weaker and more
    docile). Or maybe cell phones allow difficult conversations to be remote rather
    than in-person (where disagreements can get violent).


    Regardless of the mechanism you prefer, I have the data to back up my thesis.
    I’ve collected cell phone subscription rates by year and can use this variable
    instead of the abortion treatment. My new treatment variable $\texttt{phone}$'
  merge: -1
  img_proc: true
