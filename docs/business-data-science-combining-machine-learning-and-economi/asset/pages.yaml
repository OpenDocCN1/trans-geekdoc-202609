    of the conditional mean (think of this as a moving average). The constant mean
    fits, mu _a and mu _b from earlier, are also shown; you can see that a difference-in-means
    analysis will lead to a biased-large treatment effect estimate whenever y is increasing
    with r on either side of the threshold.

    Finally, any RD analysis is sensitive to the size of the local analysis window.
    We chose δ = 3 here because the moving average (loess) mean estimates on the right
    of Figure 5.6 appear to be mostly linear in this window, but that is just a rough
    eye-ball decision. Moreover, looking at the left of Figure 5.6, there is no clear
    signal from the data that we can use to judge linearity (or anything else: until
    you take a moving average, the noise in this data overwhelms any apparent discontinuity).

    The best practice is to calculate the RD treatment effect estimate for a range
    of windows. Figure 5.7 shows results for this example, and it is typical of what
    you see in other applications. After an initial high-variance region, where the
    window size is too small for you to estimate a reliable linear regression, the
