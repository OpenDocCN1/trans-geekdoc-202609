  md: "We then figure out which columns of $x$ have a nonzero coefficient in this\
    \ `nhlprereg` and fit an *unpenalized* (i.e., MLE) logistic regression on only\
    \ those variables using the second half of the data.\n\n```\n```\n> # the -1 to\
    \ remove the intercept\n> selected <- which(coef(nhlprereg)[1,] != 0)\n> xnotzero\
    \ <- as.data.frame(as.matrix(x[,selected]))\n> nhllme <- glm(y ~ ., data=xnotzero,\n\
    +               subset=which (fold==2), family=binomial)\n```\n```\n\nNow, suppose\
    \ that you want to predict the probability that the home team scored for a given\
    \ goal. For example, look at the first goal in the dataset, from a 2002 game between\
    \ the Dallas Stars and the Edmonton Oilers played in Edmonton, Alberta:\n\n```\n\
    ```\n> x[1,x[1,]!=0]\n```\n\n```text\n              DAL.20022003 EDM.20022003\
    \  ERIC_BREWER  JASON_CHIMERA  ROB_DIMAIO\n[1,]            -1             1  \
    \           1            1           -1\n\n              DERIAN_HATCHER NIKO_KAPANEN\
    \ JERE_LEHTINEN JUSSI_MARKKANEN JANNE_NIINIMAA\n[1,]                -1       \
    \    -1             -1              1            1\n\n              RYAN_SMYTH\
    \  BRIAN_SWANSON  MARTY_TURCO  SERGEI_ZUBOV\n[1,]              1             1\
    \           -1          -1\n```\n```\n\nTo get the home-team score probability\
    \ and the appropriate standard errors, we apply the standard prediction routine\
    \ for `glm`. Since the input design `xnotzero` was selected using different data\
    \ from that used to fit `nhllme`, the standard theory applies out of the box."
