  md: 'Including time as a continuous variable $t$ (i.e., date 1, 2, 3, . . . ) and
    with month $m_{t}$ denoting the calendar month at time $t$, a regression model
    that includes a linear time trend and monthly fixed effects is


    $\begin{array}{l}\log(y_{t})=\alpha+\beta t+\beta m_{t}+\epsilon t.\end{array}$


    We can use $g l m$ to fit this in R, after creating a time variable and factorizing
    the months:


    ```

    month <- factor(airline$Month)

    time <- (year-min(year))*12 + airline$Month

    air <- glm(log(passengers) ~ time + month)

    ```


    Figure 2.14 shows the fitted values for this regression. It seems that the linear
    trend and month effects do a nice job of summarizing the passenger traffic (on
    log scale).


    ![](img/315929ad4bddd26368466d02e06e2385_98_0.png)


    Now de-trending is easy. If your data include dates, then you should create indicator
    variables for, say, each year, month, and day. The most important thing to remember
    is to proceed hierarchically: if you are going to include an effect for may-1981,
    then you should also include broader effects for may and for 1981. This allows
    the model to use the latter effects as baselines, and the may-1981 effect will
    only summarize deviations from this base. In the language of Chapter 3, may-1981
    will be “shrunk” toward baseline levels for may and 1981. The same logic applies
    for space: if you condition on counties, then you should also include broader
    state and region effects.'
