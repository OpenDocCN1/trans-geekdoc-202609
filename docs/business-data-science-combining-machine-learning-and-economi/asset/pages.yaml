    - Population totals and median income

    - Average room/bedroom numbers, home age


    The goal is to predict \( \log(\text{MedVal}) \) for census tracts. This is a
    difficult regression surface to characterize with a linear model: the covariate
    effects change with spatial location, and how they change is certainly nonlinear
    in latitude and longitude. 2


    Figure 9.11 shows the fitted CART model for median home value. Income is dominant,
    with location important for low incomes. The CV pruning routine favors the plotted
    12-leaf tree. We also fit a 200-tree forest, with each tree grown to a minimum
    leaf size of 25 observations (census tracts):


    ![](img/315929ad4bddd26368466d02e06e2385_371_0.png)


    FIGURE 9.11: CART for CA housing. Income and home prices (the leaf labels) are
    expressed in units of $10,000.


    ```

    > carf <- ranger(logMedVal ~ ., data=CAhousing, + write.forest=TRUE, num.tree=200,
    min.node.size=25, importance="impurity")

    ```


    The disadvantage of moving from a tree to a forest is that you lose the single-tree
    interpretability of Figure 9.11. However, there are statistics of “variable importance”
    that can be used to gain some limited insight. With the'
  merge: -1
