  img_proc: true
- pgno: 314
  md: 'The PLS routine in Algorithm 21 involves a number of steps but is really very
    simple. We are just running marginal regression on the residuals after each PLS($k$)
    fit and updating the fitted values. This general procedure of taking a simple
    algorithm and repeatedly applying it to residuals from previous fits is called
    *boosting*. That is, PLS is *boosted marginal regression*. Boosting$^{13}$ is
    a general and powerful machine learning technique. Although we don''t cover it
    in detail in this text (we focus on the related technique of *bagging* in **Chapter
    9**), it is a useful way to add flexibility to simple methods, and you will likely
    encounter it often in your data science travels.


    > *If $p < n$ and you do PLS with $K = p$, then the fitted $\hat{y}$(*k*) will
    be the same as what you would get running OLS for $y$ on $x$. The PLS coefficients
    on each $xj$, available as $\sum \hat{\beta}_{k}x_{kj}$, also match the OLS coefficients.
    Thus, PLS provides a path of models between MR and OLS.*


    Whenever you are boosting, there is a potential for overfit. You should use OOS
    experimentation to select where the boosting should stop---i.e., to select $K$
    for the PLS($K$) prediction model. Unlike with PCR, the $y$ values are used in
    construction of the $v_k$ factors; hence, you can''t simply dump everything into
    *gamlr* and get a valid OOS experiment. In addition, there is no easy way to know
    the degrees of freedom for each PLS($K$) fit, so you can''t apply tools like the
    AICc. You need to run an OOS experiment where PLS is run on a data subset and
    you evaluate predictive performance on a left-out sample.


    The `textir` package in R has a `pls` function for running partial least squares,
    along with the usual utilities of `summary`, `plot`, and so on. We can use this
    to fit PLS for $K \leq 3$ on the gas data:


    ```

    ``` R

    gaspls <- pls(x=nir, y=octane, K=3)

    plot(gaspls)

    ```

    ```


    **Figure 7.21** shows the resulting fitted versus true values. The correlations
    are marked on each plot; we see that after just three iterations of boosting there
    is correlation of 0.99 between $y$ and $\hat{y}_{3i}$.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/315929ad4bddd26368466d02e06e2385_315_0.png)


    FIGURE 7.21: Fitted versus true values for octane PLS regressions with $K \leq
    3$. Note that PLS(1) is just marginal regression, so the leftmost panel is a version
