  md: "for fitting Equation 6.12. For example, with high-dimensional $x$ you can deploy\
    \ lasso methods.\n\nRecall the Oregon Health Insurance Experiment (OHIE) from\
    \ the previous chapter, where we were interested in observing the treatment effect\
    \ of randomly selected eligibility for Medicaid on the probability that someone\
    \ visits a primary-care physician (PCP) at least once a year. The treatment variable\
    \ is $selected$, indicating whether a person’s household was selected for eligibility,\
    \ and the response variable is binary $doc$any$12m$. Enrollment eligibility was\
    \ imperfectly randomized because once anyone from a household was selected, the\
    \ whole household became eligible. We fix this by controlling for $numhh$, the\
    \ size of the household, when estimating the average treatment effect:\n\n```\n\
    ```R\n> lin <- glm(doc_any_12m ~ selected + numhh, data=P)\n> round(summary(lin)$coef[\"\
    selected\",],4)\n\n      Estimate   Std. Error   t value     Pr(>|t|)\n      \
    \ 0.0639      0.0065    9.9006     0.0000\n```\n```\n\nThe resulting ATE is an\
    \ increase in PCP usage between $6\\%$ and $7\\%$.\n\nAs sources of heterogeneity,\
    \ we have available a set of 27 covariates from a survey on subject demographics\
    \ carried out 12 months after the Medicaid lottery. Many of these are categorical;\
    \ for example, $edu$12m is education-level categorization. We can use $gamlr$\
    \ to run a linear lasso regression for the model in Equation 6.12, with the coefficient\
    \ for the main effect of $numhh$ unpenalized to make sure that we have controlled\
    \ for this source of imperfect randomization. However, before finishing this example\
    \ we need to digress on the nasty (but surmountable) problem of missing data.\n\
    \nWE NEED TO DEAL WITH MISSING DATA IN THE SURVEY RESPONSES. We have incomplete\
    \ observations for some subjects. This is an issue that will occur repeatedly\
    \ in practice. The problem is not specific to HTEs or counterfactual modeling—missing\
    \ data is a problem in any large-scale survey analysis (and in plenty of other\
    \ settings). There are many different ways to deal with this problem. We will\
    \ cover here some basic approaches for each of categorical (factor) and numeric\
    \ (numeric or integer) variables.\n\nFor *categorical variables*, you simply treat\
    \ the “missing” observations as a separate category. As described in Chapter 3\
    \ when introducing sparse model matrices, adding a category for NA observations\
    \ is good practice when creating model matrices for the lasso. It forces R to\
    \ have a separate"
