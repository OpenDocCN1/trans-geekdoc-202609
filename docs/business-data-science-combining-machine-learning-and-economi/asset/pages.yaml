    The gap between observed $p$-value order statistics and the null line of slope
    $1/(N + 1)$ gives a measure of how much non-null signal is in the data. But how
    big of a gap is "significant"? The BH algorithm says that if the $p$-values live
    below a line with slope $q/N$, then they can be called significant with an FDR
    that is no larger than $q$. The simple proof for this assumes independence between
    tests and (see Figure 1.12). Unfortunately, independence between tests is an unrealistic
    assumption. For example, it doesn’t hold in the multiple regression example: if
    you remove a variable from the regression, the $p$-values for all other coefficients
    will change. This is a big reason why, in later chapters, we will resort to alternative
    methods such as the lasso for variable selection. In the meantime, you can view
    the BH algorithm as giving you a decent (but often conservative) guess at your
    FDR. If you are handed a stack of $p$-values and little extra context, the BH
    procedure is your go-to method for quantifying the FDR.'
