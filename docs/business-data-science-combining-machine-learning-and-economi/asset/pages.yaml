  md: "command. Recalling the OJ example from earlier, we can redo the indicator variables\
    \ part of the design using this new tool.\n\n```\n```R\n> xbrand <- sparse.model.matrix(~\
    \ brand, data=oj)\n> xbrand[c (100,200,300),]\n```\n```\n\n3 × 4 sparse Matrix\
    \ of class \"dgCMatrix\"\n(Intercept) brandminute.maid brandtropicana\n100 1 .\
    \ 1\n200 1 1 .\n300 1 . .\n\nThis creates the sparse version of the design used\
    \ in Chapter 2. However, we need to be a bit more careful: this is not the right\
    \ design for a lasso regression.\n\nFor MLE regressions, it didn't matter whether\
    \ Domnick's or Tropicana was the reference level of the brand factor. Even though\
    \ one of them will get subsumed into the intercept, you end up with the same predicted\
    \ $\\hat{y}$ values. But, under penalization, factor reference levels now matter!\
    \ Since the penalty rewards $\\hat{\\beta}_{k}$ values closer to (or at) zero,\
    \ you are shrinking every factor coefficient toward the intercept—toward the reference\
    \ level. And it makes a difference whether you push Minute Maid toward Tropicana\
    \ instead of Domnick's.\n\nThe solution is to simply get rid of the reference\
    \ level. Once you add a penalty to the deviation, there is no reason to have only\
    \ $K-1$ coefficients for a K-level factor. If every category level is given its\
    \ own dummy variable, then every factor level effect is shrunk toward a shared\
    \ intercept. You are shrinking toward a shared mean, with only significantly distinct\
    \ effects getting nonzero $\\hat{\\beta}_{k}$. \n\nYou can force R to create separate\
    \ dummies for each level by creating an extra factor level. In particular, the\
    \ following utility functions make NA (R's code for “missing”) the reference level."
  merge: -1
