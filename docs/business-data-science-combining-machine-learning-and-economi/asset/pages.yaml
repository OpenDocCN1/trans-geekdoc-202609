  md: 'Here, \(\mathbf{x}_{i}\boldsymbol{\beta}\) is matrix-vector multiplication
    yielding a vector with elements \(\hat{\boldsymbol{y}}_{i} = \mathbf{x}_{i}^{\prime}\hat{\boldsymbol{\beta}}\),
    the conditional mean in linear regression.11 In our usual homokedastic linear
    regression setup, the conditional variance matrix is \(\Sigma = \sigma^2 I\) (i.e.,
    all zeros except for \(\sigma^2\) along the diagonal), and every observation is
    assumed independent with the same error variance. Leaving \(\Sigma\) unspecified
    in Equation 2.28 allows for generalization of our usual regression setup to scenarios
    with different error structures.


    The sandwich variance estimators are built around the result that, for the model
    in Equation 2.28, the sampling variance of the regression coefficients can be
    written as


    \[\text{var}(\hat{\boldsymbol{\beta}}) = (\mathbf{X}^{\prime}\mathbf{X})^{-1}\mathbf{X}^{\prime}\Sigma\mathbf{X}(\mathbf{X}^{\prime}\mathbf{X})^{-1}.\quad
    (2.29)\]


    This has the error variance, \(\Sigma\), “sandwiched” by the projection \(\mathbf{X}(\mathbf{X}^{\prime}\mathbf{X})^{-1}\).
    To intuit where this comes from, expand the usual OLS formula for estimated coefficients:


    \[\hat{\boldsymbol{\beta}} = (\mathbf{X}^{\prime}\mathbf{X})^{-1}\mathbf{X}^{\prime}\mathbf{y}
    = (\mathbf{X}^{\prime}\mathbf{X})^{-1}\mathbf{X}^{\prime}(\underline{\mathbb{E}}[\mathbf{y}]
    + \boldsymbol{\epsilon}) = \boldsymbol{\beta} + (\mathbf{X}^{\prime}\mathbf{X})^{-1}\mathbf{X}^{\prime}\boldsymbol{\epsilon}.\quad
    (2.30)\]


    Here, \(\mathbf{x}^{\prime}\hat{\boldsymbol{\beta}}\) is the vector of true coefficients
    plus an error term multiplied by this \(\mathbf{X}(\mathbf{X}^{\prime}\mathbf{X})^{-1}\)
    projection. Standard results then have that \(\text{var}(a^{\prime}\boldsymbol{\epsilon})
    = a^{\prime}\Sigma\text{var}(\boldsymbol{\epsilon})a\) for fixed vector \(a\)
    and random \(\boldsymbol{\epsilon}\), yielding Equation 2.29.


    Consider the usual homokedastic model, where \(\Sigma = \sigma^2 I\). In that
    case, Equation 2.29 becomes \(\sigma^2(\mathbf{X}^{\prime}\mathbf{X})^{-1}(\mathbf{X}^{\prime}\mathbf{X})(\mathbf{X}^{\prime}\mathbf{X})^{-1}
    = \sigma_2(\mathbf{X}^{\prime}\mathbf{X})^{-1}\), the standard formula for OLS
    sampling variance (this is the formula R uses to get its standard errors). Moving
    to a more general model, you can use Equation 2.29 to quantify uncertainty in
    the common heteroskedastic scenario where each observation has a different error
    variance. That is, where \(\Sigma = \text{diag}(\sigma^2) = \text{diag}([\sigma_{21},
    \sigma_{22}, \ldots, \sigma_{2n}])\) with a different diagonal entry for each
    observation. The heteroskedastic consistent12 (HC) standard errors are constructed
    by replacing \(\Sigma\) in Equation 2.29 with an estimate that allows for such
    heteroskedasticity:'
