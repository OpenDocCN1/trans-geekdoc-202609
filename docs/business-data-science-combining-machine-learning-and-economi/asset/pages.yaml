    We also run a six-fold CV routine, repeatedly fitting PLS($K$) for $K = 1$ , .
    . . , 10 and evaluating on the left-out fold. The results are shown in Figure
    7.22 and we compare against a lasso for octane regressed onto the raw NIR values.
    PLS performance improves from $K = 1$ to $K = 3$ and flattens for $K > 3$. While
