- pgno: 20
  md: 'transparency into machine learning, wise practitioners avoid assigning structural
    meaning to the parameters of their fitted models. These models are black boxes
    whose purpose is to do a good job in predicting a future that follows the same
    patterns as in past data.


    Prediction is easier than model inference. This has allowed the ML community to
    quickly push forward and work with larger and more complex data. It has also facilitated
    a focus on automation: developing algorithms that will work on a variety of different
    types of data with little or no tuning required. There has been an explosion of
    general-purpose ML tools in the past decade—tools that can be deployed on messy
    data and automatically tuned for optimal predictive performance.


    To make this discussion more concrete, consider the linear regression model


    ```

    $$y _ { i } \approx x _ { i 1 } \beta _ { 1 } + x _ { i 2 } \beta _ { 2 } + \ldots
    x _ { i p } \beta _ { p } .\tag { I . 2 }$$

    ```


    Suppose that you estimate this model using a dataset of $n$ observations, $\{
    \mathbf { x } _ { i } , y _ { i } \} _ { i = 1 } ^ { n }$, to get the $p$ fitted
    parameters $\hat { \boldsymbol { \beta } }$ and predicted response, say, for the
    next observation:


    ```

    $$\hat { y } _ { n + 1 } = \mathbf { x } _ { n + 1 , 1 } \hat { \boldsymbol {
    \beta } } _ { 1 } + \mathbf { x } _ { n + 1 , 2 } \hat { \boldsymbol { \beta }
    } _ { 2 } + \ldots \mathbf { x } _ { n + 1 , p } \hat { \boldsymbol { \beta }
    } _ { p } .\tag { I . 3 }$$

    ```


    For example, each $x _ { i j }$ could be a binary 0/1 indicator for whether web
    browser $i$ visited website $j$, and the response, $y _ { i }$, could be the amount
    of money that user $i$ spends on your e-commerce website. The big data paradigm
    discussed earlier has big $n$ but also big $p$, perhaps even $p > n$. In other
    words, you see a lot of web browsers but also a lot of different websites.


    Both statisticians and machine learners have been studying these “big $p$” problems
    over the past 20 years but with subtly different goals. Statisticians have largely
    concentrated on understanding how close $\hat { \boldsymbol { \beta } }$ from
    Equation I.3 is to the “true” $\beta _ { j }$ from Equation I.2 and on closing
    this “estimation error” gap. This type of model inference is difficult and indeed
    impossible for large $p$ unless you make a ton of assumptions about the way the
    world works. A lot of effort has been spent trying to understand how estimators
    perform in narrow and incredibly difficult scenarios.


    In contrast, the machine learners have been less worried about closing this estimation
    gap. In most settings an ML practitioner wouldn’t want to assume the model in
    Equation I.2 is actually “true.” Instead, the machine learner just wants to make
    $\hat { y } _ { n + 1 }$ as close as possible to the true $y _ { n + 1 }$. This
    single-minded'
  merge: -1
