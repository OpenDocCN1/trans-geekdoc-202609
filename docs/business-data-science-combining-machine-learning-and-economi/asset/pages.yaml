- pgno: 246
  md: "```\n> orthoLTE <- function(x, d, y, dreg, yreg, nfold=2)\n{\n    # randomly\
    \ split data into folds\n    nobs <- nrow(x)\n    foldid <- rep.int(1:nfold,\n\
    \                times = ceiling(nobs/nfold))[sample.int(nobs)]\n    I <- split(1:nobs,\
    \ foldid)\n    # create residualized objects to fill\n    ytil <- dtil <- rep(NA,\
    \ nobs)\n    # run the OOS orthogonalizations\n    cat(\"fold:\")\n    for(b in\
    \ 1:length(I)){\n        dfit <- dreg (x[- I[[b]],], d[-I[[b]]])\n        yfit\
    \ <- yreg(x[- I[[b]],], y[-I[[b]]])\n        dhat <- predict (dfit, x[I[[b]],\
    \ ], type=\"response\")\n        yhat <- predict(yfit, x[I[[b]], ], type=\"response\"\
    )\n        dtil[I[[b]]] <- drop(d[I[[b]]] - dhat)\n        ytil[I[[b]]] <- drop(y[I[[b]]]\
    \ - yhat)\n        cat(b, \" \")\n    }\n    rfit <- lm(ytil ~ dtil)\n    gam\
    \ <- coef(rfit)[2]\n    se <- sqrt(vcovHC(rfit)[2,2])\n    cat(sprintf(\"\\\\\
    ngamma (se) = %g (%g)\\n\", gam, se))\n\n    return( list(gam=gam, se=se, dtil=dtil,\
    \ ytil=ytil))\n}\n```\n\nWe can apply this algorithm to the *Freakonomics* abortion\
    \ and crime analysis. For each of the treatment and response nuisance regressions,\
    \ we apply a CV lasso via `cv.gamlr`. These functions are given as arguments $dreg$\
    \ and $yreg$ to `orthoLTE`, which implements the orthogonal ML procedure of Algorithm\
    \ 15:"
  merge: -1
  img_proc: true
