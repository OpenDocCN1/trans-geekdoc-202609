    This implies a standard deviation around $\sqrt{6462} \approx 80$.


    The ever-important central limit theorem (CLT) states that the average of independent
    random variables becomes normally distributed (i.e., Gaussian or as a “bell curve”)
    if your sample size is “large enough.” Assuming $n=10,000$ is large enough, the
    end result is that the sample average for online spending is normally distributed
    with mean 1946 and standard deviation 80. We write this as $\overline{X} \sim
    \mathrm{N}(1946, 80^{2})$. Figure 1.2 plots the distribution.


    ![](img/315929ad4bddd26368466d02e06e2385_37_0.png)


