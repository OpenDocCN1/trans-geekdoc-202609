- pgno: 295
  md: 'Once you’ve fit all the PC directions, the next question is, how many do you
    need? As it was for the number of clusters in *K*-means, this is not a question
    that is easily answered unless you are using the factors in a downstream prediction
    problem (in which case the usual CV or IC tools apply). As a rough heuristic,
    it is common to look at the variance of each $v_{k}$ and see how quickly it is
    decreasing with $k$. If there is a big drop-off in the variance after a certain
    $k$, then perhaps you only need to keep PC1 through PC$k$. When you summarize
    the fitted `prcomp` object, it prints the running tally of variance across factors:


    ```

    > summary(pcfood)

    ```


    Importance of components:


    | | PC1 | PC2 | PC3 | PC4 | PC5 |

    | Standard deviation | 2.0016 | 1.2787 | 1.0620 | 0.9771 | 0.68106 |

    | Proportion of Variance | 0.4452 | 0.1817 | 0.1253 | 0.1061 | 0.05154 |

    | Cumulative Proportion | 0.4452 | 0.6268 | 0.7521 | 0.8582 | 0.90976 |


    Since the sum of variances will be equal to the total variance across all $x_{ij}$,
    the summary also reports the *proportion* of variance explained by each PC direction.
    Each PC’s contribution to this total variance is decreasing with $k$. You can
    also plot the `prcomp` object to get the *screeplot*, a visual representation
    of the variance for each PC direction.


    You might make judgments about how many PCs are influential based upon these summaries,
    but it is never clear how small the variance needs to be before a PC is not worth
    tracking. For example, in *Figure 7.11*, it appears that the first PC explains
    most of the variation. However, PC2 has a clear interpretation in terms of the
    Mediterranean/Iberian diet. The choice of how many PCs to track will be subjective
    (again, unless the PCs are used as inputs to a prediction task). As recommended
    for clustering, use the PCs that make sense for your exploratory analysis and
    storytelling.'
  merge: -1
  img_proc: true
