    FIGURE 1.15: Posterior density functions for $q_1$, the success probability in
    a series of Bernoulli trials (coin tosses), as a function of the sample size (number
    of tosses) under a $\operatorname{Beta}(1, 1)$ prior. The “true” probability is
    $1/3$.


    As this example illustrates, Bayesian inference is inherently *parametric*: you
    specify a model that depends upon a set of parameters, and the updating formula
