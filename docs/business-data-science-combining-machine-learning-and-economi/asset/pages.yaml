    # # Uncertainty


    The real world is messy. Recognizing this mess will differentiate a sophisticated
    and useful analysis from one that is hopelessly naive. This is especially true
    for highly complicated models, where it becomes tempting to confuse signal with
    noise and hence “overfit.” The ability to deal with this mess and noise is the
    most important skill you need to learn to keep from embarrassing yourself as you
    work and learn with data.


    In any analysis, you have targeted unknowns and untargeted unknowns. The former
    are built into the model as parameters to be estimated, and you use these estimates
    explicitly in your decision-making processes. The latter are variously represented
    as error terms and distributions or, in a fully nonparametric analysis, as an
    unknown data-generating process.1 These untargeted unknowns are a nuisance. You
    don’t care about them directly, but they need to be accounted for if you want
    to infer the targeted parameters. The distinction here is application specific—one
    analyst’s nuisance is another’s target. But it is impossible to accurately model
    everything simultaneously, so you need to choose your targets carefully and treat
    them seriously.


    This chapter introduces the statistician’s concept of uncertainty, the framework
    we use to characterize what you know in terms of probabilities. In much of data
    science and machine learning, we seek to design models that perform well in the
    presence of uncertainty and do so via regularization (see Chapter 3) and other
    model stabilization tools. In other cases, it is necessary to do full accounting
    of uncertainty and assign probability distributions to'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'important parameters. Real-world applications require a mix of both stability
    and uncertainty quantification, and to understand any of these techniques you
    need a clear understanding of the basics of uncertainty.


    Uncertainty quantification is one of the more difficult and abstract subjects
    in data science. Many readers may wish to skip ahead to \textcolor{linkcolor}{Chapters
    2 -- 4} and return once more warmed up.


    # ## FREQUENTIST UNCERTAINTY AND THE BOOTSTRAP


    We need to start by reviewing the basics of *frequentist* uncertainty. This is
    the sort of uncertainty that has been taught in introductory statistics for decades,
    and it is characterized by a thought experiment: “If I were able to see a new
    sample of data, generated by the same processes and scenarios as my current data,
    how would our estimates change?”


    We’ll begin with a simple analysis of the online-spending activity for 10,000
    households over a single year. In addition to their total U.S. dollars spent online,
    each row of the dataset contains some basic information about a single household,
    such as whether they have any children, whether they have access to broadband
    Internet, and their race and ethnicity and region.


    ```

    > browser <- read.csv("web-browsers.csv")

    > dim(browser)

    [1] 10000      7

    > head(browser)

    ```


    | id | anychildren | broadband | hispanic | race | region | spend |

    |:---|:------------|:----------|:---------|:-----|:-------|:------|

    |  1 |           0 |         1 |        0 | white |     MW |   424 |

    |  2 |           1 |         1 |        0 | white |     MW |  2335 |

    |  3 |           1 |         1 |        0 | white |     MW |   279 |

    |  4 |           0 |         1 |        0 | white |     MW |   829 |

    |  5 |           0 |         1 |        0 | white |      S |   221 |

    |  6 |           0 |         1 |        0 | white |     MW |  2305 |


    \textcolor{linkcolor}{Figure 1.1} shows the sample of spend values.'
