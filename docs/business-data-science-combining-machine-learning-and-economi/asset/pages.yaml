  md: 'To give a complete view of deep learning, we need to describe the one algorithm
    that is relied upon for training all of the models: stochastic gradient descent.
    SGD optimization is a twist on gradient descent (GD), the previously dominant
    method for minimizing any function that you can differentiate. Given a minimization
    objective $\mathcal{L}(\Omega)$, where $\Omega$ is the full set of model parameters,
    each iteration of a gradient descent routine updates from current parameters $\Omega_{\mathcal{L}}$
    as follows:


    ```

    $$\Omega_{t+1} = \Omega_{t} - C_{t} \nabla\mathcal{L}|_{\Omega_{t}}.$$

    (10.2)

    ```


    Here, $\nabla\mathcal{L}|_{\Omega_{t}}$ is the gradient of $\mathcal{L}$ evaluated
    at the current parameters, and $C_{t}$ is a projection matrix that determines
    the size of the steps taken in the direction implied by $\nabla\mathcal{L}_{.30}$
    We have the subscript $t$ on $C_{t}$ because this projection can be allowed to
    update during the optimization. For example, Newton''s algorithm uses $C_{t}$
    equal to the matrix of objective second derivatives, $\nabla2\mathcal{L}|_{\Omega_{t}}.$


    It is often stated that neural networks are trained through “backpropagation,”
    which is not quite correct. Rather, they are trained through variants of gradient
    descent. Back-propagation, $^{31}$ or backprop for short, is a method for calculating
    gradients on the parameters of a network. In particular, backprop is just an algorithmic
    implementation of the chain rule from calculus. In the context of the simple neuron
    from Equation 10.1, the gradient calculation for a single weight $\omega_{hj}$
    is


    ```

    $$\frac{\partial\mathcal{L}}{\partial\omega_{hj}} = \sum_{i=1}^{n}\frac{\partial\mathcal{L}}{\partial
    z_{ij}^{h}} \frac{\partial z_{ij}^{h}}{\partial\omega_{hj}} = \sum_{i=1}^{n}\frac{\partial\mathcal{L}}{\partial
    z_{ij}^{h}} z_{ij}^{h-1}[0<\Sigma_{j}\omega_{nj}^{h-1}] .$

    (10.3)

    ```


    Another application of the chain rule can be used to expand $\partial\mathcal{L}/\partial
    z_{ij}^{h}$ as $\partial\mathcal{L}/\partial z_{ij}^{h+1} \times \partial z_{ij}^{h+1}/\partial
    z_{ij}^{h}$, and so on, until you have written the full gradient as a product
    of layer-specific operations. The directed structure of the network lets you efficiently
    calculate all of the gradients by working backward layer by layer, from the response
    down to the inputs. This recursive application of the chain rule and the associated
    computation recipes make up the general backprop algorithm.


    In statistical estimation and ML model-training, $\mathcal{L}$ typically involves
    a loss function that $sums$ across data observations. For example, assuming an
    l2 (ridge) regularization penalty on the parameters, the $minimization$ objective'
