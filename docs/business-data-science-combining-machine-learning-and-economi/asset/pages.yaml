  md: "![](img/315929ad4bddd26368466d02e06e2385_83_0.png)\n\nFIGURE 2.8: A logistic\
    \ link function.\n\nTo interpret the $\\beta$ coefficients, writing $\\mathrm{p}\
    \ = \\mathrm{p}(y = 1 \\mid x)$ and a little algebra shows that\n\n```\n$$ \\\
    log \\bigg[ \\frac { p } { 1 - p } \\bigg] = \\beta _ { 0 } + \\beta _ { 1 } x\
    \ _ { 1 } + . . . + \\beta _ { p } x _ { p } . $$\n```\n\nThus, logistic regression\
    \ is a linear model for log odds. The odds of an event are the probability that\
    \ it happens over the probability that it doesn’t. For example, if an event has\
    \ a 1/4 probability, then its odds are “one in three,” or 1/3. You should get\
    \ used to thinking about uncertainty in terms of odds—much of your modeling will\
    \ occur on this scale. Following the same logic as we had for log linear models\
    \ earlier, $e ^ { \\beta \\mathbf { k } }$ is then interpretable as the multiplicative\
    \ effects for a unit increase in $x \\mathbf { k }$ on the odds for the event\
    \ $y = 1$.\n\nFor our first logistic regression example, we’ll build a filter\
    \ for email “spam”—junk mail that can be ignored. Every time an email arrives,\
    \ your inbox performs binary regression: Is this spam or not spam? We’ll train\
