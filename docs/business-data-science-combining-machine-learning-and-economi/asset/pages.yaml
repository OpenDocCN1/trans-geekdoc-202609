    FIGURE 2.21: An exploding series with AR(1) coefficient \(\beta_1 = 1.02\).


    Finally, the most interesting series have AR(1) terms between \(-1\) and \(1\).
    These series are called *stationary* because \(y_t\) is always pulled back toward
    the mean. These are the most common, and most useful, type of AR series. The past
    matters in a stationary series, but with limited horizon and the autocorrelation
    drops off rapidly (see Figures 2.22, 2.23, and 2.24).


    ![](img/315929ad4bddd26368466d02e06e2385_104_1.png)


