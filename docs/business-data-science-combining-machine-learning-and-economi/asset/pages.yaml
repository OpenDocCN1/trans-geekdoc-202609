- pgno: 63
  md: '# # BAYESIAN INFERENCE


    All of the discussion of uncertainty until now has focused on *frequentist* uncertainty—that
    corresponding to the thought experiment of repeated draws from a hypothetical
    fixed population of outcomes. This is only one of two main types of uncertainty.
    The other is *Bayesian uncertainty*, which characterizes probabilities over models
    and parameters by appealing to the idea of subjective beliefs rather than repeated
    trials.9


    Decision-making on this basis is referred to as *Bayesian inference*. A full treatment
    of Bayesian methods and ideas is beyond the scope of this book. For that, I refer
    you to the now-classic reference of Gelman et al. [2014] as well as the shorter
    primer by Hoff [2009]. However, although we will not deal in detail with explicit
    Bayesian inference, this way of thinking about uncertainty underlies much of what
    we cover in the text. Indeed, compared to frequentism, Bayes plays an as large
    or larger a role in the practice of business data science. Much of contemporary
    machine learning is driven by ideas from Bayesian inference, and formal decision
    theory—quantification of risks and expected rewards—is inherently Bayesian. A
    basic understanding of the Bayesian framework will help you to understand how
    these methods are developed and why they work.


    Bayesian inference is the mathematical framework of beliefs. It formalizes the
    process of “If you believe *A* and you then observe *B*, you should update your
    beliefs to *C*.” This is sometimes referred to as *subjective probability*, but
    you don’t need anyone to hold these specific beliefs for the framework to be valid.
    Rather, Bayesian inference provides a framework for combining *assumptions* (and
    a degree of confidence in those assumptions) with evidence. When those assumptions
    are clear, then Bayesian inference is completely transparent: you know all of
    the inputs to your decision process, and the relative weight placed on data versus
    prior knowledge is explicit.


    Mechanically, Bayesian inference works through a combination of prior distributions
    and likelihoods. As we detail in the next chapter, the likelihood is the probability
    of the data you have observed *given* a fixed set of model parameters—say, p(*X*
    | *Θ*) for data *X* and parameters *Θ* and where | denotes “given” or “conditional
    upon.” The *prior distribution*, π(*Θ*), is the probability distribution over
    *Θ* *before* you have observed any data. This choice of prior is'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'an assumption that you are bringing to your analysis, as is the model that
    defines your likelihood. The *posterior* distribution—the probability distribution
    on your parameters after observing data—is then available via Bayes rule:


    ```

    $$\text{p}(\Theta|X) = \frac{\text{p}(\Theta|X)\pi(\Theta)}{\text{p}(X)} \propto
    \text{p}(\Theta|X)\pi(\Theta). \quad (1.10)$$

    ```


    Here, recall that \propto stands for “proportional to.” The *marginal likelihood*,


    ```

    $$\text{p}(X) = \int \text{p}(\Theta|X)\pi(\Theta)d\Theta,$$

    ```


    is the probability of the data under the assumed likelihood model after averaging
    all possible values of \Theta. Since it doesn’t depend upon \Theta, the nominal
    target of inference, p(X) is mostly a nuisance for Bayesian inference. The computational
    strategy of estimating Equation 1.10 via Markov chain Monte Carlo (MCMC)${}^{10}$
    is a successful attempt to circumvent the need to explicitly calculate p(X). This
    strategy is largely responsible for the explosion of Bayesian inference during
    the 1990s and 2000s.


    A good way to get an intuition for Bayesian inference is to play around with *conjugate
    models*. These are prior and likelihood combinations such that, as you accumulate
    data, the posterior distribution remains in the same family as the prior. The
    mechanics of posterior updating can be written out and made explicit. One intuitive
    example is the beta-binomial model where you have binomial trials with constant
    success probability *q*. The prior distribution for *q* is a beta distribution:


    ```

    $$\pi(q) = \text{Beta}(q; \alpha, \beta) \propto q^{\alpha-1}(1-q)^{\beta-1}\mathbb{1}_{[q
    \in (0,1)]}. \quad (1.11)$$

    ```


    For example, the Beta(1, 1) prior yields \pi(q) = \mathbb{1}_{[q \in (0, 1)]},
    the familiar uniform distribution. Again, note that the \propto symbol means “is
    proportional to” and in Equation 1.11 we are ignoring a normalizing constant that
    ensures $\int_{0}^{1}\pi(q)dq = 1$ for all \alpha, \beta > 0.


    Each binomial realization can be viewed as a combination of Bernoulli trials (e.g.,
    tosses of a weighted coin) where *x* = 1 with probability *q* and *x* = 0 with
    probability 1 − *q*. Under a Beta(*a*, *b*) prior distribution on *q*, the *posterior*
    distribution for *q* after a single Bernoulli realization for *x* becomes'
