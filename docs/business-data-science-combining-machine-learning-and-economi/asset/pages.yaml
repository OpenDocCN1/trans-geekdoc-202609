    # SYNTHETIC CONTROLS


    To conclude this chapter on controls, we will introduce a simple strategy for
    causal inference that is commonly used to evaluate large-scale business policy
    decisions. In this setting, you have a set of *units* of aggregation—for example,
    geographic regions or product classes—and only one or two of these units are treated.
    For example, you might be rolling out a new sales'
  merge: -1
  img_proc: true
- pgno: 267
  md: "strategy but do so only in a single geographic region such as the United States.\
    \ You want to know the causal effect of this new strategy but simply comparing\
    \ pre-and post-treatment U.S. sales could give you biased results. Other influential\
    \ events have occurred over the same time period, including macro-economic shocks\
    \ and changes in the natural sales cycle. You don’t want to conflate the treatment\
    \ effect estimate with the effects of these other contemporaneous changes.\n\n\
    However, what if most of these other events also affect sales across the border\
    \ in Canada (where the new sales strategy has not yet been tried)? You can use\
    \ sales in Canada as a control: if, after the new strategy rollout, sales in the\
    \ United States are growing faster than those in Canada, you have evidence that\
    \ the new strategy is working. Even better, instead of just focusing on Canada,\
    \ you can compare post-treatment sales to a multicountry average that tracks with\
    \ U.S. sales. Each country would be weighted such that the aggregate is, historically,\
    \ a good estimate of U.S. sales. That is, you can use the sales in other, untreated,\
    \ countries to predict what sales would have been in the United States if you\
    \ had not introduced the new strategy. 23\n\nThis is the method of *synthetic\
    \ controls*. 24 Using potential outcomes notation, you have a time series of interest,\
    \ say, the response (sales) on unit (country) *j* at each time *t*, *y* ji (1)\
    \ for the treated outcome and *y* ji (0) for the untreated. You get to observe\
    \ only one of these outcomes at each time point, say, *y* 1t. For notational simplicity,\
    \ let’s say that *j* = 1. Unlike the usual conditional ignorability setting, you\
    \ don’t have the necessary full set of controls, *x* t. However, you *do* have\
    \ the response values for a bunch of related time series—the untreated units *y*\
    \ kt (0) for all *k* ≠ 1. Under the (strong) assumption that these untreated series\
    \ depend upon the same set of underlying unobserved controls as the treated series,\
    \ you can use these other series to predict the untreated counterfactual, *y*\
    \ 1t (0).\n\nSuppose that you introduce the treatment at time *T*. Then, for times\
    \ *t* = 1 . . . *T*, all of the series are untreated. That is, you observe *y*\
    \ it = *y* it (0) for all units *j* = 1 . . . *J*. After time *T*, you observe\
    \ *y* kt = *y* kt (0) for all *k* ≠ 1, and, for the treated series, you observe\
    \ only *y* 1t = *y* 1t (1). The treatment effects of interest are\n\n```\n\\gamma_{1t}\
    \ = y_{1t}(1) - y_{1t}(0), \\text{ for } t > T + 1. \t\t (6.19)\n```\n\nSince\
    \ you observe *y* 1t = *y* 1t (1) for *t* > *T*, to obtain the treatment effect,\
    \ you need “only” estimate the untreated *y* 1t (0). Fortunately, you observe\
    \ a large number of untreated time series. At one time period after *T*, you have\
    \ a mostly complete *J* × (*T* + 1) matrix of untreated values,"
  merge: -1
  img_proc: true
