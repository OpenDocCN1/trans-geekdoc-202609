  md: '# probability density function


    ![](img/315929ad4bddd26368466d02e06e2385_278_0.png)


    FIGURE 7.1: The unconditional distribution for galaxy speeds.


    The data in Figure 7.1 correspond to the estimated speeds of galaxies in space.
    Astronomers are interested in this type of data as it gives them information about
    the history of the universe. The underlying galaxy clusters can be used to help
    the mapping of space. However, all we have here is Figure 7.1—we don''t know the
    underlying cluster memberships. How can they be estimated?


    Suppose you have $K$ possible means for each observed $x_i$,


    ```

    $$\mathbb{E}[\mathbf{x}_i|k_i] = \boldsymbol{\mu}_{k_i}, \ k_i \in \{1 \ ... \
    K\}. \tag{7.2}$$

    ```


    For example, if $k_i = 1$, then $\mathbb{E}[x_{i1}] = \mu_{11}$, $\mathbb{E}[x_{i2}]
    = \mu_{12}$, etc. This is not yet a mixture model; it is just the specification
    for the means. As in regression, you need to complete this specification with
    probability distributions so that you have a deviance to minimize.


    The $K$-means *normal* mixture model is by far the most common foundation for
    clustering:


    ```

    $$\mathfrak{p}_k(\mathbf{x}) = \mathfrak{N}(\mathbf{x}; \boldsymbol{\mu}_k, \boldsymbol{\Sigma}_k).
    \tag{7.3}$$

    ```'
