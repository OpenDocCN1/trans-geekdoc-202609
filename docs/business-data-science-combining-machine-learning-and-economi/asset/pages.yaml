    This sort of reweighting, to map from the sample to the population of interest,
    is a standard step in many statistical analyses. For example, political pollsters
    are always battling to figure out how their sample of potential voters maps to
    the characteristics of the future voting population. An interesting contemporary
    overview of this area by Andrew Gelman and coauthors tackles the problem of using
    abundant survey through nontraditional venues—e.g., via the Microsoft Xbox gaming
    platform—for insight about voting intentions of the wider population. As pollsters’
    recent lack of success demonstrates (e.g., Trump, Brexit), the sample-to-population
    mapping problem is a tricky one.


    For many business settings, this is less of an issue because you are able to sample
    representatively from your customers. In such a setting, it is tough to find a
    treatment effect estimator for randomized designs that will perform better than
    $\overline{Y}_1 - \overline{Y}_0$. However, there are alternatives. Most prominently,
    *regression adjustment* is sometimes advocated as offering a reduced-variance
    version of the $\widehat{\mathrm{ATE}}$ from Equation 5.2. With observable covariates
