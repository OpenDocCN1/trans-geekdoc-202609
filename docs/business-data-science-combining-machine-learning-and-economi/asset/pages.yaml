    > betaMin <- coef(cv.spender, select="min") ## min cv selection

    > cbind (betaFalse, betaMin) c("tvguide.com", "americanexpress.com",)

    2 x 2 sparse Matrix of class "dgCMatrix"

    ```


    | | seg36 | seg49 |

    | :--- | :--- | :--- |

    | tvguide.com | . | -0.0002379178 |

    | americanexpress.com | 0.04230693 | 0.0488043737 |


    We see that time spent on tvguide.com has no loading under the CV-lse rule, but
    a negative signal about total spending under the CV-min rule. Browsers with history
    on americanexpress.com tend to spend more under either selection rule.


    What is the difference between bootstrapping and cross validation? The difference
    is whether you are doing with- or without-replacement sampling. In the last section
    of this chapter, we discuss how the standard nonparametric bootstrap tends to
    underestimate predictive uncertainty, and we describe alternative algorithms that
    can provide uncertainty quantification for the lasso.


    If the CV algorithms and selection rules seem complicated, it might be helpful
    to recall that they are based upon a simple idea: you use errors on left-out data
    to approximate what your predictive errors will be on future observations. The
    curve in Figure 3.8 is an estimate of what the out-of-sample predictive deviance—in
    this case, $(\hat{y}_{f} - y_{f})^{2}$—will be for different values of $\lambda$.
    For example, you can simply read off the graph that, at the CV-min $\hat{\lambda}=\exp[-3.7]$,
    you can expect an out-of-sample $R^{2}$ of around $1-2.5/2.78 \approx 0.10$. The
    1 standard error intervals give a measure of frequentist uncertainty around each
    deviance estimate. If these error bounds are too large for you to decide which
    $\lambda$ is best, then you can simply increase the number of folds to increase
    your sample size of deviance estimates.


    INFORMATION CRITERIA (IC) PROVIDE AN ALTERNATIVE TO CROSS VALIDATION FOR MODEL
    SELECTION. These IC are analytic approximations to the types of OOS errors that
    CV attempts to estimate through a computational experiment. You might want to
    use one of these IC if you don’t have time for a CV experiment (if doing something
    once is expensive, you can’t repeat it K times) or if you don’t like the Monte
    Carlo variation in CV selection (since the folds are random, if you run the algorithm
    multiple times, you will get slightly different answers).'
