- pgno: 237
  md: 'Rather, this example illustrates that whenever your analysis is premised on
    conditional ignorability, you are always susceptible to others introducing additional
    controls until the model is nearly saturated and you can’t measure anything. This
    is the weakness of using OLS—a low-dimensional method—as your regression tool.


    You can better control for confounders by modeling the treatment assignment process.
    That is, you need to take seriously and estimate the second “treatment regression”
    line of the LTE system in Equation 6.2. You can do this using ML tools such as
    the lasso and cross validation. The process involves many of the same ideas from
    how we used regularization to improve predictions in the face of many potential
    inputs. However, the fact that we are now estimating a causal treatment effect
    means that we need to completely rework our model-building recipes around this
    goal. A naive application of ML tools for causal inference can lead to a mess
    of incorrect results.


    Going back to Chapter 3, we’ve followed a simple model-building recipe: use a
    path of penalties to create a set of candidate models and then use predictive
    performance—measured either via cross validation or an information criterion—as
    the metric for choosing the best model among this set. A key characteristic here
    is the focus on unstructured prediction as the basis for model evaluation: you
    are seeking to do the best job forecasting y at new x drawn from the same distribution
    as the inputs in the training sample. That is, you are choosing models to do well
    in predicting new data drawn from p(x, y), the same joint data generating process
    (DGP) that provided the training data (think about the CV algorithm to convince
    yourself of this). However, you now have a special input d, the treatment, and
    you want to know the treatment effect on y when d moves independent of all other
    influences. That is, you no longer want to do a good job predicting ŷ under the
    existing DGP but rather under the DGP that arise when you change d yourself.


    The idea behind structural or counterfactual prediction is to remove from the
    treatment effect estimate, Y̌, the effect of other influences that are correlated
    with d. As in the earlier discussions, these outside influences are called controls
    or confounders, and they can pollute your treatment effect estimate if their effect
    is confused with that of d. Again, this is simple when you have a low-dimensional
    set of potential confounders—you just include them in your regression. But when
    you have a large set of potential confounders, you need to do more modeling work.


    Look back to the LTE system in Equation 6.2. The key to counterfactual estimation
    is to model the second line, the treatment allocation equation for ℰ'
  merge: -1
  img_proc: true
- pgno: 238
  md: '[d | x], in addition to modeling the response equation. In particular, we will
    proceed sequentially by first modeling the treatment allocation and then using
    the fitted values as controls in the second-stage regression.


    See Algorithm 14. In this algorithm, by estimating $\hat{\boldsymbol{d}}$ and
    including it in Equation 6.4, we’ve isolated where $d$ differs *randomly* from
    what is expected given the confounders. These random surprises are like experiments
    in $d$, and in the second step we estimate the effect of these surprise movements
    on $y$. That is, we are using the first “treatment regression” step to construct
    a near-experimental design.


    # ALGORITHM 14 LTE Lasso Regression


    +   i. Use a CV or AICc lasso to estimate $\mathbb{E}[d \mid x] = x^\prime \tau$
    and collect the fitted values $\hat{d}_i = x_i^\prime \hat{\tau}$.

    ii. Use a CV or AICc lasso to estimate


    $\mathbb{E}[y \mid \boldsymbol{x}, \boldsymbol{d}] = \hat{\boldsymbol{d}}\vartheta
    + \boldsymbol{d}\boldsymbol{\gamma} + \boldsymbol{x}\boldsymbol{\beta}$ (6.4)


    with *no penalty* on $\boldsymbol{\vartheta}$ (i.e., you’ve included $\hat{\boldsymbol{d}}$
    unpenalized).

    Then $\hat{\boldsymbol{\gamma}}$ is your estimate for the treatment effect of
    $d$ on $y$.


    To understand how this works, note that a theoretically equivalent (for big $n$)
    algorithm fits step i and then regresses $y$ onto $x$ and the fitted residuals,
    $\hat{v} = \boldsymbol{d} - \hat{\boldsymbol{d}}$. The coefficient on $\hat{v}$
    then provides $\hat{\boldsymbol{\gamma}}$, your treatment effect estimate. To
    see why the effect of $v$ is the same as the *random* effect of $d$, consider
    combining the information from the LTE system of Equation 6.2 into a single response
    equation:


    $\begin{aligned} \mathbb{E} \left[y \mid \boldsymbol{x}, \boldsymbol{d}\right]
    & = \boldsymbol{d} \boldsymbol{\gamma} + \boldsymbol{x} \boldsymbol{\beta} \\
    & = \left(\boldsymbol{x}^{\prime} \boldsymbol{\tau} + \boldsymbol{v}\right) \boldsymbol{\gamma}
    + \boldsymbol{x} \boldsymbol{\beta} \\ & = \boldsymbol{v} \boldsymbol{\gamma}
    + \boldsymbol{x}^{\prime}\left(\boldsymbol{\gamma} \boldsymbol{\tau} + \boldsymbol{\beta}\right).
    \end{aligned}$


    The last line is the *structural* version of the reduced-form regression,

    $\begin{aligned} \mathbb{E}\left[\boldsymbol{y} \mid \boldsymbol{x}, \boldsymbol{d}\right]
    &= \hat{\boldsymbol{v}} \boldsymbol{\gamma} + \boldsymbol{x} \hat{\boldsymbol{\beta}},
    \end{aligned}$ (6.5)'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'where, $\hat{\boldsymbol{\beta}} = \boldsymbol{\gamma}\boldsymbol{\tau} + \boldsymbol{\beta}$.
    Thus $\gamma$ is the same across both models—the effect of $\nu$ on $y$ is the
    same as the structural effect of $d$ on $y$. Controlling for $\hat{d}$ unpenalized
    in Equation 6.4 is essentially the same as estimating the treatment effect of
    residuals $\hat{\nu}$. In both cases, $\hat{\gamma}$ is based on variation in
    $d$ that is orthogonal to $\hat{d}$ (i.e., independent from $\hat{d}$ in the sample).


    Recall the *Freakonomics* abortion example from earlier. Where we left off, we
    had built a large set of controls $x$ consisting of the original Levitt and Donahue
    variables (interacted), state-specific cell phone effects, and time. If we run
    a straight “naïve” lasso onto $d$ and $x$, AICc selects a negative abortion effect.


    ```

    ```r

    > x <- sparse.model.matrix(~ t + phone*s + .^2, data=controls)[,-1]

    > dim(x)

    [1] 624 154


    > ## naïve lasso regression

    > naive <- cv.gamlr(cBind(d,x),y)

    > coef(naive) ["d",] # effect is CV selected <0

    [1] -0.1149923

    ```

    ```


    But if we follow Algorithm 14 and fit the treatment effect regression, the AICc
    lasso selects $d$ as highly predictable given $x$.


    ```

    ```r

    > treat <- cv.gamlr(x, d, lmr=1e-4)

    > dhat <- drop(predict(treat, x, type= "response"))

    > cor(d, dhat) ^2

    [1] 0.9871682

    ```

    ```


    The in-sample $R^2$ is around 99% (see also Figure 6.2) so that there’s almost
    no *independent* movement of abortion rates to measure as effecting crime. There
    is little pseudo-experimental variation. Sure enough, after including $\hat{d}$
    without penalty in the murder lasso regression, the AICc selects zero residual
    effect for $d$.'
