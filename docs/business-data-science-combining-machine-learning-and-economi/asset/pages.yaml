    ```


    Algorithm 15 can be applied to re-estimate the Sid Crosby treatment effect using
    orthogonal ML. Note that this implies a change in the assumed regression model:
    whereas the original logistic regression models a multiplicative effect on the
    odds that Sid''s team (the Penguins) has scored, the LTE specification of Equation
    6.2 models an additive effect on the probability that his team has scored.'
