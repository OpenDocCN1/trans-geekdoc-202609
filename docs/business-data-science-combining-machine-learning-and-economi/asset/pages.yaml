    # MULTINOMIAL INVERSE REGRESSION (MNIR)


    Between text regression and topic modeling, you are now equipped to use text to
    predict some $y$ or to build models for latent unobserved factors in text. Another
    task that comes up often in social science is understanding how text connects
    to a *set* of related covariates. For example, you might want to connect the we8there
    reviews simultaneously to all five aspect ratings, allowing you to determine which
    content is predictive of ratings on, say, atmosphere *separate* from food or service.'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'For such tasks, we can turn to multinomial inverse regression (MNIR)$^{12}$
    to link the text with observable covariates through a multinomial distribution.
    The “inverse” in MNIR comes from the fact that, while text regression usually
    fits a single document attribute as a function of word counts, we are inverting
    the process by regressing the counts on any number of document attributes. Given
    document attributes $v_{i}$ (author characteristics, date, beliefs, sentiment,
    etc.), MNIR follows the familiar generalized linear model framework. Each document
    $x_{i}$ is modeled as arising from a multinomial with a logit link onto a linear
    function of $v_{i}$:


    ```

    $$\boldsymbol{x}_{i}\sim \operatorname{MN}(\boldsymbol{q}_{i}, m_{i})\quad \text{with}\quad
    q_{ij}=\frac{\exp[\alpha_{j}+\boldsymbol{v}_{i}^{\prime}\boldsymbol{\varphi}_{j}]}{\sum_{l=1}^{p}\exp[\alpha_{l}+\boldsymbol{v}_{i}^{\prime}\boldsymbol{\varphi}_{l}]}\quad\quad\quad(8.4)$$

    ```


    This is the same as the multinomial logistic regression introduced in Chapter
    4. Now, the number of outcome categories is the number of tokens in our text vocabulary.
    This can be viewed as a natural extension of topic modeling: we are keeping the
    multinomial model for token counts but replacing unknown topics with known attributes.


    Looking again at the we8there data, we can set $v_{i}$ as the vector of five aspect
    ratings: overall, atmosphere, value, food, and service. The multinomial response
    will be the vector of word counts for each document, $x_{i}$, which implies 2640
    outcome categories. This is far too many dimensions for most multinomial logistic
    regression algorithms (e.g., `glmnet` will hang and then choke). Fortunately,
    as discussed in Chapter 4, the `distrm` package is specifically designed to be
    efficient for these types of massive-response multinomials. It uses a Poisson
    distribution representation of the multinomial to distribute computation for each
    vocabulary element across multiple processors.


    ```

    ```text

    > cl <- makeCluster(detectCores())

    > ## small lambda for a fast example

    > fits <- dmr(cl, we8thereRatings,

    +          we8thereCounts, bins=5)

    ```

    ```'
  merge: -1
  img_proc: true
