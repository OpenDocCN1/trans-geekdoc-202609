  md: "intensive counting of the nearest neighbors, KNN is too expensive to be useful\
    \ in most big data settings.\n\nThus, KNN is much like forward stepwise regression—a\
    \ good idea, giving solid intuition about how you can approach the problem, but\
    \ too crude to be useful in practice. The solution is to move to models for *probabilities*\
    \ and use these as the basis for classification.\n\n# ## PROBABILITY, COST, AND\
    \ CLASSIFICATION\n\nBefore diving deeper into modeling, we need to discuss the\
    \ relationship between probabilities and classification. To introduce the ideas,\
    \ let’s simplify back to binary problems where $y \\in \\{0, 1\\}$. There are\
    \ two ways to be wrong in a binary problem:\n\n+   *   False *positive*: predict\
    \ $\\hat{y}=1$ when $y=0$.\n*   False *negative*: predict $\\hat{y}=0$ when $y=1$.\n\
    \nThere can be different costs associated with each type of error. A doctor might\
    \ place a lower cost on over-treatment than on a missed diagnosis, and the U.S.\
    \ criminal justice system puts a higher cost on punishment of innocents than on\
    \ letting the guilty walk free.\n\nMore generally, *decisions have costs*. To\
    \ make optimal decisions, you need to estimate probabilities on possible outcomes.\
    \ These probabilities are what allow you to assess the *expected loss* associated\
    \ with different actions. Suppose that you know the probabilities of each outcome—say,\
    \ $p_k$ for possible outcomes $k = 1 \\dots K$—and that each outcome $k$ has cost\
    \ $c\\ (a,\\ k)$ under action $a$. Then the expected loss for action $a$ is\n\n\
    ```\n    E[loss(a)] = \\sum_{k} p_k c(a,k).                                  \
    \          (4.1)\n```\n\nFor example, suppose that the action $a$ is that you\
    \ decide to loan $100 to someone under the agreement that they pay you back $125\
    \ next week. If you decide that there is a 10% chance that they *do not* pay you\
    \ back, then the expected loss is $100 \\times 0.1 - 25 \\times 0.9 = -12.5$ (the\
