- pgno: 140
  md: 'The BIC is trying to find \( \lambda \) with the highest probability of having
    the minimum OOS error, which is subtly different than finding the \( \lambda \)
    corresponding to the lowest expected OOS error. For example, if there is more
    uncertainty about OOS error at the \( \lambda \) with minimum expected error,
    then it could be that another value with higher expected error but lower uncertainty
    around this value will have a higher probability of being best. However, on a
    more practical level, the BIC simply tends to mechanically underfit as \( n \)
    gets large.


    The null model here is not just an intercept but rather includes on-ice configuration
    info along with indicators for the team and season. So, the BIC is not saying
    that no players matter but rather that it cannot confidently tell them apart from
    their team''s average level of play in a given season.


    Taking a quick look at the regression, we see that the AICc selects 646 nonzero
    measurable player effects.


    ```

    ```r

    > Baicc <- coef(nhlreg)[colnames(player),]

    > sum(Baicc!=0)

    [1] 646

    ```

    ```


    There are a few things to note here. First, we’ve introduced the `free` argument.
    This denotes columns of the design matrix that we *do not* want penalized. In
    this case, we’re using it to keep the special-teams and team-season variables
    unpenalized—we know that we want them in the model, and so we let them enter without
    restriction.


    Second, notice that we’ve used `standardize=FALSE`. This is one of the special
    cases where all of our penalized variables are on the same scale (player presence
    or absence). Without `standardize=FALSE`, we’d be multiplying the penalty for
    each coefficient (player effect) by that player’s standard deviation in the `player`
    matrix. The players with big standard deviation are guys who play a lot. Players
    with small standard deviation are those who play little (almost all zeros). Hence,
    weighting penalty by standard deviations in this case is exactly what we don’t
    want: a bigger penalty for people with many minutes on ice, a smaller penalty
    for those who seldom play. Indeed, running the regression without `standardize=FALSE`
    leads to a bunch of farm-team players coming up on top.'
  merge: -1
  img_proc: true
