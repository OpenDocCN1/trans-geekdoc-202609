  md: "You can also obtain *nonparametric* standard errors through the use of a bootstrap.\
    \ When you have dependence between observations, you need to use a *blocked* bootstrap\
    \ that resamples on the group rather than individual level. In this case, we resample\
    \ *households* with-replacement while fitting the person-level model for each\
    \ bootstrap sample. The `boot` package can be used to implement this after we\
    \ use `split` to create a map from households to individuals:\n\n```\n```\n> library(boot)\n\
    > n <- nrow(P)\n> hhwho <- split(1:n, $household_id) # rows grouped by HH\n> bootfit\
    \ <- function(hhlist, boothh) {\n+   bootsamp <- unlist(hhwho[boothh])   # map\
    \ from HH sample to rows\n+   coef(glm(doc_any_12m ~ selected*x, data = P, subset=bootsamp))\
    \ [2]\n+ }\n> bs <- boot(names(hhwho), bootfit, 99)\n```\n```\n\nThe standard\
    \ error and confidence intervals are similar to those we found earlier:\n\n```\n\
    ```\n> sd(bs$t)\n[1] 0.006586946\n> quantile(bs$t, c(.05,.95))\n\n    5%     \
    \ 95%\n0.05365116 0.07514728\n```\n```\n\nAs a last note on correlated errors,\
    \ economists often address this issue by using *clustered standard errors*. The\
    \ procedure uses an extension of the Huber–White heteroskedastic consistent (HC)\
    \ variance from [Chapter 2](#chapter-2). Recall that a nonparametric estimate\
    \ for the variance of regression coefficients with regression design matrix $X$\
    \ (now including the intercept and all inputs) is\n\n> $$(\\mathbf{X}^{\\prime}\\\
    ,\\mathbf{X})^{-1}\\mathbf{X}^{\\prime}\\,\\Sigma\\mathbf{X}(\\mathbf{X}^{\\prime}\\\
    ,\\mathbf{X})^{-1}.$$ (5.9)\n\nHere, $\\Sigma$ is a good estimate of the variance\
    \ matrix for the vector of errors across observations, $\\varepsilon$. In the\
    \ HC estimator, independence between"
