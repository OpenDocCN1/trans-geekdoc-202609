- pgno: 87
  md: 'What are these statistics? We need to introduce two complementary concepts:


    +   - *Likelihood* is the probability of your data given parameters. You want
    to make it as big as possible.

    - *Deviance* measures to the distance between data and fit. You want to make it
    as small as possible.


    These two quantities are mirror images of each other, and they are tied together
    through a mathematical relationship:


    ```

    Deviance = -2log[Likelihood] + C. (2.17)

    ```


    More precisely, the deviance is -2 times the difference between log likelihoods
    for your fitted model and for a “fully saturated” model where you have as many
    parameters as observations. The term corresponding to this fully saturated model
    gets wrapped into C, which is a constant we can mostly ignore. We view deviance
    as a cost to be minimized. This is the guiding principle behind the way we estimate
    our models. Ignoring the complexities of model selection and regularization (next
    chapter), and using lhd(β) to denote the likelihood function, our model coefficients
    are fit to achieve


    ```

    β̂ = argmin {- 2/n log lhd(β)}. (2.18)

    ```


    Because of the relationship between deviance and likelihood, this deviance minimization
    strategy is commonly referred to as *maximum likelihood estimation* (MLE).


    Let’s work through an example with linear regression and Gaussian (normal) errors.
    The probability model is y ~ N(x’β, σ²), where the Gaussian probability density
    function is


    ```

    N(x’β, σ²) = 1 / sqrt(2πσ²) exp[- ((y - x’β)²) / (2σ²)]. (2.19)

    ```


    Given n independent observations, the likelihood (i.e., the probability of the
    data) is'
  merge: -1
  img_proc: true
- pgno: 88
  md: '$$\prod_{i=1}^{n} \mathrm{p}\left(y_{i} \mid x_{i}\right)=\prod_{i=1}^{n} \mathrm{N}\left(y_{i}
    ; \mathbf{x}_{i}^{\prime} \boldsymbol{\beta}, \sigma^{2}\right)=\left(2 \pi \sigma^{2}\right)^{-\frac{n}{2}}
    \exp \left[\frac{-1}{2 \sigma^{2}} \sum_{i=1}^{n}\left(y_{i}-\mathbf{x}_{i}^{\prime}
    \boldsymbol{\beta}\right)^{2}\right]. \tag{2.20}$$


    Using Equation 2.17, this leads to the following deviance:


    $$\operatorname{dev}\left(\boldsymbol{\beta}\right) \propto \sum_{i=1}^{n}\left(y_{i}-\mathbf{x}_{i}^{\prime}
    \boldsymbol{\beta}\right)^{2} . \tag{2.21}$$


    Here, the $\infty$ symbol denotes “proportional to”\u2014in other words, ignoring
    multiplicative and additive terms that do not depend upon $\boldsymbol{\beta}$.7


    Looking at Equation 2.21, we see that to minimize the deviance we need to minimize
    the *sum of squared errors*. The deviance minimizing estimates for $\boldsymbol{\beta}$\u2014the
    MLE\u2014are exactly the *least-squares* estimates. Thus, “standard” or normal
    linear regression is a synonym for the common procedure of ordinary least-squares
    (OLS) regression.8


    Given that deviance minimization for a linear regression is the same as least
    squares regression, why bother to introduce the extra concepts of likelihood and
    deviance? It''s because these concepts apply also to alternative probability models\u2014like
    the model behind logistic regression. For binary response with probabilities $p_{i}=\mathrm{p}(y_{i}=1)$,
    the likelihood is


    $$\operatorname{lhd}=\prod_{i=1}^{n} \mathrm{p}\left(y_{i} \mid \mathbf{x}_{i}\right)=\prod_{i=1}^{n}
    p_{i}^{y_{i}}\left(1-p_{i}\right)^{1-y_{i}} . \tag{2.22}$$


    Using our logistic regression equation for $p_{i}$, this becomes


    $$\operatorname{lhd}(\boldsymbol{\beta})=\prod_{i=1}^{n}\left(\frac{\exp \left[\mathbf{x}_{i}^{\prime}
    \boldsymbol{\beta}\right]}{1+\exp \left[\mathbf{x}_{i}^{\prime} \boldsymbol{\beta}\right]}\right)^{y_{i}}\left(\frac{1}{1+\exp
    \left[\mathbf{x}_{i}^{\prime} \boldsymbol{\beta}\right]}\right)^{1-y_{i}} . \tag{2.23}$$


    Taking log and multiplying by \(-2\) gives you the logistic regression deviance:'
