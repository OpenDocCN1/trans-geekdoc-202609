  md: "the potential outcomes across all treatment levels are unrelated to the treatment\
    \ status you have actually been assigned. 1 After assuming the CI condition in\
    \ Equation 6.1, you can control for the factors in x simply by including them\
    \ in your regression model. Life gets more difficult when x has very high dimension\
    \ or if you don't know the form of its influence on d and y, but in later sections\
    \ we will show how tools from ML can be used to help.\n\nConsider the orange juice\
    \ data used in Chapter 2. We regressed OJ unit sales onto prices and other information\
    \ (brand and advertisement) to understand consumer price sensitivities. For purposes\
    \ of illustration, we'll revisit this example while neglecting modeling of the\
    \ brand or ad dependence in price elasticities (i.e., using a more basic model\
    \ than we had in Chapter 2). A simple log-log regression yields an estimated -1.6\
    \ elasticity, such that sales drop by 1.6% for every 1% increase in prices.\n\n\
    ```\n```R\n> basefit <- lm(log(sales) ~ log(price), data=oj)\n> coef(basefit)\n\
    (Intercept)  log(price)\n 10.423422    -1.601307\n```\n```\n\nFor this elasticity\
    \ to be interpreted *causally* under conditional ignorability, we need to assume\
    \ that there are no other factors that jointly influence both price and sales.\
    \ That's clearly false. As a start, we *know* that there are different brands\
    \ of OJ here and some are more valuable than others. For example, we expect Tropicana\
    \ to sell more volume than Dominick's would at the same price point, and the brands\
    \ have been priced according to this expectation. When we *control* for brand\
    \ effect, the elasticity estimate nearly doubles to -3.14.\n\n```\n```R\n> brandfit\
    \ <- lm(log(sales) ~ brand + log(price), data=oj)\n> coef(brandfit)\n(Intercept)\
    \    brandminute.maid    brandtropicana     log(price)\n 10.8288216          0.8701747\
    \          1.5299428          -3.1386914\n```\n```\n\nWhat happened here? The\
    \ premium brands, Minute Maid and Tropicana, had equivalent sales to Dominick's\
    \ at higher price points. So if we don't control for brand, it looks as though\
    \ prices can rise without affecting sales for those observations. This dampens\
    \ the observable relationship between prices and sales and results in the (artificially)\
    \ low elasticity estimate of -1.6. When we include brand in the regression, we\
