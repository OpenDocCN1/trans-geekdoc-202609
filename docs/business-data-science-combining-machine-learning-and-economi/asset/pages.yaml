- pgno: 349
  md: '# WORD EMBEDDING


    We close this chapter with some exciting new methods in natural language processing
    that have come out of work in deep learning. *Word embedding* was originally motivated
    as a technique for dimension reduction on the inputs to a deep neural network.
    As outlined in <u>Chapter 10</u>, such initial dimension reduction is a key part
    of the success of contemporary ML systems. However, word embedding turns out to
    be valuable in its own right: it imposes a spatial structure on words, making
    it possible for those studying language to reason about distances between meanings
    and consider the algebra behind combinations of words in documents.


    In the original deep learning context, embedding layers replace each word with
    a vector value, such that, for example, *hotdog* becomes the location [1, –5,
    0.25] in a three-dimensional embedding space (this is just for illustration; embedding
    spaces are typically of more than 100 dimensions). Compare this to the standard
    “one-hot” or bag-of-words representation, where *hotdog* would be represented
    as a binary vector that is as long as there are words in the vocabulary, say,
    *p*. This binary vector will have *p* – 1 zeros and a one in the *hotdog* dimension.
    The word embedding has translated the language representation from a large binary
    space to a smaller real-valued (and much richer) space.


    The basic idea of word embedding is related to concepts covered in our earlier
    discussions of factor modeling. In those contexts, we looked at ways to “embed”
    documents in a vector space—representing each document *i* either as a vector
    of topic weights *ω*<sub>oi</sub> or as a vector of PCA scores *v*<sub>i</sub>.
    This gives a reduced dimension representation of the document. Instead of *p*-dimensional
    bag-of-words representations, you get *K* << *p* dimensional factor (topic) representations.
    Word embedding takes a similar approach to dimension reduction, but on the words
    themselves rather than on the document as a whole.


    There are a variety of different embedding algorithms—as many as there are different
    architectures for deep neural networks. The most common and general embeddings
    are built around *word co-occurrence matrices*. This includes the popular Glove<sup>13</sup>
    and Word2Vec<sup>14</sup> frameworks. In this class of methods, the first step
    is to define a notion of co-occurrence. For example, in the common skip-gram formulation,
    with a “window size” of *b*, two words co-occur if they appear within the same
    sentence and within *b* words of each other. For a vocabulary size *p*, this leads
    to a sparse *p* × *p* co-occurrence matrix where each [*i*, *j*] entry is the
    number of times that words *i* and *j* co-'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'occur. Call this matrix $C$. A word embedding algorithm seeks to approximate
    $C$ as the product of two lower-dimensional matrices:


    ```

    $$\mathbf{C} \approx \mathbf{U V}^{\prime} .$$

    (8.5)

    ```


    Here, $U$ and $V$ are each $p \times K$ dimensional dense and real valued matrices.
    $K$ is the dimension of the embedding space; hence, $K << p$ and both $U$ and
    $V$ are very tall and thin matrices. Each row of $U$ and of $V$—say, $u_{j}$ and
    $v_{j}$—is then a $K$-dimensional embedding of the $j$th word. The implication
    of Equation 8.3 is


    ```

    $$c_{i j} \approx \boldsymbol{u}_{i}^{\prime} \mathbf{v}_{j} = \sum_{k=1}^{K}
    u_{i k} v_{j k},$$

    (8.6)

    ```


    such that these embeddings summarize the meaning of words inasmuch as their inner
    product—a standard measure of distance in linear algebra—defines how much you
    expect them to co-occur.


    One way to find $U$ and $V$ is to solve Equation 8.5 is through the singular value
    decomposition (SVD). This is a core algorithm in linear algebra that can also
    be used, for example, in finding the eigenvalues and eigenvectors of square symmetric
    matrices (and hence in calculating principal components). In practice, most of
    the software embedding solutions use alternatives to SVD that are designed to
    deal with the high amount of sparsity in $C$ (since most words never co-occur
    in limited windows for standard corpora).


    Under many algorithms, especially when co-occurrence is symmetric, ${}^{15}$ $U$
    and $V$ will be mirror images of each other. Thus, it is standard to take one
    of these vectors—say, $u_{j}$—as the single embedding location for word $j$. As
    mentioned at the outset, these locations were originally viewed as an intermediate
    output—as a processing step for inputs to a deep neural network. However, social
    scientists and linguists have discovered that the space of word locations contains
    rich information about the language of the documents used to train the embedding.
    For example, the Word2Vec authors emphasized the possibility of algebra in the
    embedding space: if you take the vector for Paris, subtract France, and add Italy,
    then you get a location near to the coordinates of the vector for Rome. From a
    data scientific perspective, the word embeddings open up the option of taking
    advantage of word order and context in prediction tasks. As one example, Taddy
    [2015a] describes a simple Bayesian classifier built around word2vec embeddings
    and compares this classifier to other techniques we’ve covered in this chapter.'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'One example that nicely illustrates the potential of embedding is the work
    of Bolukbasi et al. [2016].16 In this work, the authors trained a standard word2vec
    embedding algorithm on the Google News corpora of news articles. They look at
    the differences between established *gender* words (for example, the vector for
    *man* minus the vector for *woman*, or *father* minus *mother*) to establish an
    axis in the embedding space that spans from masculinity to femininity. They then
    calculate the location along this axis for a large number of terms that should
    be gender-neutral. For example, Figure 8.12 shows professional titles that end
    up on the extremes of this male-versus-female axis. It is clear that the embedding
    space has *learned*—from how the words are used in news articles—that these professions
    are stereotypically viewed as female and male occupations.


    ![](img/315929ad4bddd26368466d02e06e2385_351_0.png)


    FIGURE 8.12: Figure taken from Bolukbasi et al. [2016] showing occupational titles
    that are at the extremes of the estimated male-versus-female axis of an embedding
    space trained on Google News.


    Beyond pointing out the chauvinism of journalists, the authors highlight the fact
    that ML algorithms trained on this data will adopt the same biases. The idea of
    bias in AI resulting from bias in training data is an important issue that the
    industry is struggling to grapple with. In this case, they suggest a clever solution:
    you take all of the words that *should* be gender neutral and *subtract* from
    their embedding vectors the estimated gender direction. In the same way that subtracting
    France from Paris got you to a location that was generically associated with “capital
    city,” this algebra should move these occupations to a location that is no longer
    gender biased. Indeed, the authors demonstrate that ML algorithms trained on these
    de-biased vectors do a'
  merge: -1
  img_proc: true
- pgno: 352
