- pgno: 341
  md: 'As in any multivariate regression, these are a *partial effects*: they represent
    the influence of one attribute after controlling for the other attributes. In
    the case of `terrib1 servic`, this term is expected to occur more often if the
    food rating is *high relative to what you''d expect given the other ratings*.
    That is, even though `terrib1 servic` has a negative *marginal* association with
    the food rating (count-to-rating correlation is $-0.1$), it has a positive MNIR
    loading for the food rating because diners will highlight it in a generally negative
    review if the food was not that bad (just, for example, overpriced and slow).


    This is the power of MNIR—you can control for confounds in the same way that you
    do in a standard regression analysis. It allocates language among multiple observable
    influences, similar to how topic models attempt allocate language across multiple
    unobserved topics. **Figure 8.9** shows top loadings by the size of their $|\rho_{kj}|$
    for each aspect *k*. There is a clear sorting of terms to the appropriate aspect
    rating, and the overall ratings are related to summaries of the experience: you
    “plan to return” if the experience was positive and ended up “speaking to the
    manager” if it was overall negative.'
  merge: -1
  img_proc: true
