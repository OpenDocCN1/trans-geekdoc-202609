    As an illustrative example, we’ll consider biopsy data for $n = 97$ prostate cancer
    tumors. After a tumor has been detected, there are many possible treatment options:
    chemotherapy, radiation therapy, surgical removal, or some combination. Biopsy
    information about the tumor is available to help in deciding treatment. The variables
    are:


    +   - Gleason Score ($\text{gleason}$): Microscopic pattern classes

    - Prostate Specific Antigen ($\text{lbsa}$): Protein production

    - Capsular Penetration ($\text{icp}$): Reach of tumor into gland lining

    - Benign Prostatic Hyperplasia Amount ($\text{ibph}$): Size of prostate


    $\text{ipsa}$, $\text{icp}$, and $\text{lbph}$ are all recorded on log scale in
    the data. However, you should convince yourself that it doesn’t matter whether
    the inputs are logged or transformed in any other way that maintains order—you’ll
    get the equivalent CART fit. We also have the patient age as an input, and the
    response to be predicted is the tumor log-volume, $\text{icavol}$ (unlike for
    the inputs, since you’re minimizing squared errors it does affect CART fit if
    you log the response variable).


    This CV pruning procedure is implemented as part of the tree library. We begin
    by fitting a tree using \texttt{mincut=1} and R’s default \texttt{mdev=0.01}.


    ```

    ```

    > ptree(<- tree(icavol ~., data=prostate, mincut=1)

    ```

    ```


    Figure 9.4 shows the overgrown (i.e., overly deep) tree. The cv.tree function
    takes this fitted tree object and executes the CV pruning routine over a specified
    $K$ folds. The resulting object contains OOS deviance for trees of each candidate
    size (number of leaf nodes) along the pruning path (Figure 9.5). In this case,
    we see that the tree of size 3 has the lowest OOS error.'
