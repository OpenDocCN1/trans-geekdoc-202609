  md: 'that can relax common assumptions (e.g., linearity) but still rely upon restrictive
    model structure to facilitate inference in high dimensions (see Chapter 9).


    Bradley Efron$^{12}$ compares Bayesian inference to the parametric bootstrap,
    and this might help give you some intuition around the practical application of
    Bayesian inference. He shows that, under certain common priors, parametric bootstraps
    yield a sampling distribution that looks similar to the corresponding Bayesian
    posterior. Recall from earlier that the parametric bootstrap, like the nonparametric
    bootstrap, uses repeated model fits to quantify uncertainty. However, instead
    of resampling from the original data, the parametric bootstrap first *estimates*
    the model using the full sample and then *simulates* from this fitted model to
    generate data for each model fit. Thus, the parametric bootstrap is quantifying
    uncertainty by simulating from the assumed *parametric* model.


    If this assumed model is incorrect, the parametric bootstrap results can have
    little connection to reality. In contrast, the nonparametric bootstrap, which
    we''ve covered in detail earlier, gives accurate uncertainty quantification for
    the estimation you''ve executed even if your estimators are based on silly assumptions.
    However, the *parametric* bootstrap requires much less data and will "work"—if
    your model is correct—in extremely high dimensions. It is a practical option where
    the more robust procedure is impossible. This same characterization applies to
    many Bayesian procedures.


    Ideally, when making business decisions, everything is nonparametric: you always
    accumulate enough data so that prior beliefs are no longer relevant, and you work
    in a way that is not sensitive to model assumptions. Of course, the reality is
    that every decision involves uncertainty and will be based upon both instinct
    (prior) and data. But in our material on causal and structural inference—Chapters
    5 and 6—we will indeed focus on robust inference that, while not always nonparametric,
    at least has some guarantees of being valid when our models are not quite correct.
    This is a nice property to have, and it is attainable in causal inference settings
    where the target of inference is low dimensional (typically univariate) and we
    have a large amount of sample data.


    Unfortunately, model-free inference is possible only in such data-rich settings—when
    you have many observations (large *n*) and a low-dimensional inference target
    (small *p*). Following from our earlier discussions of the nonparametric bootstrap,
    you will fail in nonparametrics if your *observed* data gives you a poor picture
    of the population distribution. Frequentist inference in general becomes difficult
    in high dimensions, as you have already seen from our discussion of multiple testing
    where the best you can'
