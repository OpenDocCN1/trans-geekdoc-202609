- pgno: 215
  md: 'has been *indirectly* randomized through experiments on variables that influence
    policy selection. These indirect randomizers, or upstream sources of randomization,
    are called *instrumental variables* (IVs). They form the basis for much of applied
    econometrics.


    One intuitive IV example is the “intent-to-treat” setup. Consider a pharmaceutical
    trial that gives some drug to a random sample of patients. This is a completely
    randomized experiment, but the problem is that not every “treated” patient will
    take the drug. It might be that the drug is painful or inconvenient, and often
    people simply forget to take their medication. Thus, you have an experiment that
    randomizes *access* to the drug but is one step removed from actual drug treatment.
    Moreover, people may treat themselves differentially for reasons that are correlated
    with the response: sicker patients might find the drug more painful, or perhaps
    less sick patients are less willing to deal with an inconvenient treatment protocol.
    Thus, treatment is correlated with potentially *unobserved* factors that also
    influence the response, such that you can’t easily control for the relevant differences
    between drug-takers and nontakers.


    Fortunately, IVs provide a way to take this intent-to-treat problem and infer
    the drug’s treatment effect. In this example, the single IV is the randomized
    group assignment (whether or not a subject has access to the drug). You are able
    to take advantage of this randomization by tracking how it changes the *probability*
    that a user takes the drug. If they are not assigned drug access, then the probability
    they take the drug is zero or small (it is possible they obtain the drug through
    alternative means). If they are assigned to the drug access group, then the probability
    they *take* the drug is much higher. An IV analysis models how this *change in
    probabilities* affects the patient outcomes (e.g., survival or other health metrics).
    By connecting the response to portion of treatment that is directly controlled
    by randomization (i.e., the treatment probabilities dictated by the IV), you can
    recover how the response changes that randomized component of treatment status.
    This allows you to model counterfactuals dependent upon whether the patient actually
    takes the drug.


    We’ll use some math to make this more precise. First, we need to explain the general
    problem of *endogeneity*. In the general IV model, you have some treatment variable
    *p* and a response-of-interest *y*. You may or may not have observable covariates
    *x* that directly influence the response, and you always have the *instrument*
    *z* which affects the response *only* through its influence on the treatment.
    In addition, there are *unobserved* factors or errors, say *e*, that have influence
    over both the treatment and response. The graph of this model is shown on the
    left of **Figure 5.8**. This graph makes clear the two crucial'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'features of the instrument $z$: it acts on $y$ only through $p$, and it is
    completely independent from the unobserved error $e$.


    ![](img/315929ad4bddd26368466d02e06e2385_216_0.png)


    **FIGURE 5.8:** Diagram of a simple instrumental variables model. In each, the
    arrows are read as “*start* has a causal impact on *end*.” On the left, $z$ is
    the IV, $p$ is the policy (treatment) variable, $x$ is an observed covariate,
    $y$ is the response, and $e$ is an unobserved variable that affects both treatment
    and response. On the right, you have these variables realized as components of
    the story about an intent-to-treat drug trial.


    The right side of **Figure 5.8** connects these variables to the example of an
    intent-to-treat pharmaceutical trial. The response of interest is time-to-recovery
    and for simplicity you can imagine a single unobserved variable called *disease
    status* that is correlated both with the patients propensity to take the drug
    and with their time to recovery (e.g., suppose patients with more advanced disease
    status take longer to heal and are less likely to take the drug). The instrument
    is randomized drug access (i.e., the patient''s group assignment in the randomized
    controlled trial) and this randomization affects the response only by changing
    the likelihood of the patient taking the drug. Finally, you have the patient''s
    age as an observable covariate—you can use this to model age-dependence in the
    drug''s treatment effect.


    We can write a version of this causal model as a regression:


    ```

    $y = g(x, p) + e$, $\quad \mathrm{cov}(e, p) \neq 0$. $\quad\quad\quad\quad\quad\quad(5.23)$

    ```


    Here, $g(x, p)$ is a *structural* function. We are imagining that this represents
    how $p$ acts causally on $y$ (perhaps also as a function of $x$; if it is easier
    for now, just ignore $x$ everywhere). The important distinction between Equation
    5.23 and the usual regression model is the statement that the error and policy
    are correlated: $\mathrm{cov}(e, p) \neq 0$. This implies that, in contrast to
    the usual statistician''s regression, the error term is *not expected to be zero*
    given the treatment variable: $\mathbb{E}[e \mid p] \neq 0$. That is because the
    “error” influences policy'
