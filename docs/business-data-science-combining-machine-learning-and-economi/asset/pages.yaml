    you have past data from a price setter who was able to execute targeted price
    discrimination—they charged prices that were positively correlated with the demand
    shocks (they are equal to *e* up to a random error *z*):


    ```

    ```r

    > z <- rgamma(100,1,1)

    > p_observed <- e + z

    ```

    ```


    In the second case, imagine that you were able to run an experiment where prices
    are completely randomized:


    ```

    ```r

    > p_ind <- rgamma(100,2,1)

    ```

    ```


    Finally, you feed the demand shocks and both of these sets of prices through the
    sales function:


    ```

    ```r

    y_observed <- yfun(e, p_observed)

    y_counterfactual <- yfun(e, p_counterfactual)

