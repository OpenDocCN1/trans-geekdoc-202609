- pgno: 217
  md: 'selection, and hence policy realization gives you information about the error
    term.


    In this setup we refer to the policy variable as *endogenous* to the response.
    It is jointly determined with the response as a function of unobserved factors
    or errors. In contrast, with *exogenous* errors you have $\operatorname{cov}(e,
    p)=0$, and the usual statistical regression models apply without any further thought.
    In the setting of Equation 5.23, however, applying off-the-shelf regression or
    ML when learning $g(p, x)$ will cause problems. Consider use of regression to
    estimate the noncausal conditional expectation for $y$:


    $$\mathbb { E } [ y | x , p ] = \mathbb { E } [ g ( x , p ) + e | x , p ] = g
    ( x , p ) + \mathbb { E } [ e | p ] . \quad\quad\quad (5.24)$$


    We’re assuming for purposes of illustration that $x$ has no influence on $e$ so
    that $\mathbb { E } [ e | x , p ] = \mathbb { E } [ e | p ]$. This is not necessary
    for any of the methods we’ll discuss, but it makes notation and intuition easier.


    Thus, standard regression techniques here will recover the true structural relationship,
    $g(x, p)$, *plus a bias term*: $\mathbb { E } [ e | p ]$. This issue is referred
    to by economists as “omitted variable bias,” and it haunts them whenever they
    need to work with nonexperimental data.


    Equation 5.24 gets to the heart of what differentiates causal inference from common
    statistical or “predictive” inference. To the machine learner, in a setting where
    you want to predict a future that looks mostly like the past, $\mathbb { E } [
    e | p ]$ is not a bias. Any patterns that help you predict $e$ given $p$ can be
    used to refine future predictions. But in a policy setting you are planning to
    *change* $p$—you are going to change prices or treat with a new drug. This means
    that, in the future, you will have *broken* the relationship between $p$ and $e$.
    The pattern for $\mathbb { E } [ e | p ]$ observed in past data will no longer
    exist, and any inference that confuses this term with $g$ is rightly considered
    a bias. That is, when comparing counterfactual policies $p_{1}$ and $p_{0}$, you
    want to know $g(p_{1}, x)-g(p_{0}, x)$ and adding to this $\mathbb { E } [ e |
    p_{1} ] - \mathbb { E } [ e | p_{0} ]$ will lead to incorrect conclusions and
    poor policy choices.


    A CLASSIC EXAMPLE OF THIS “ENDOGENEITY” PROBLEM OCCURS IN DEMAND ANALYSIS. Consider
    air travel. During holidays and periods of peak demand, two things are true: flights
    are booked, and prices are high. Of course, it is not true that flights are booked
    *because* prices are high. Rather, both prices and sales are responding to changes
    in the underlying consumer demand. Airlines are good at tracking this demand and
    changing ticket prices to maximize profits.'
