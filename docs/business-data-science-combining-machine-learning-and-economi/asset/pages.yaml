- pgno: 207
  md: 'An RD analysis requires an assumption about how the response varies with the
    forcing variable near the treatment threshold. You must assume that if the threshold
    were to move slightly, subjects switching treatment groups will behave similarly
    to those near them in their new treatment group. This is a *continuity* assumption.
    It means that you can look at the relationship between the forcing variable and
    the response on one side of the threshold and extrapolate to the other side.


    Figure 5.4 shows observed (solid) and unobserved (dashed) expected response functions
    for each of two treatment groups. The RD continuity assumption implies the behavior
    that we see around the treatment threshold (where the solid line jumps). Even
    though there is a discontinuity (i.e., a jump) in the observed mean response,
