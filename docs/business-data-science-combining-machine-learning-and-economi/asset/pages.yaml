- pgno: 375
  md: 'heart of nonparametrics. Methods such as trees lead to increasingly complex
    surfaces as you give them more data. The idea of RFs is to take advantage of this
    nonparametric adaptivity while using bootstrap aggregation to avoid overfit. If
    you replace the bootstrapping with subsampling, then you are starving your nonparametric
    learners (the trees) of the data that they need to perform well.


    While working with eBay, a group of us noticed a prediction performance decrease
    because of a switch from full RFs to subsampling forests. This motivated us to
    formalize a simple alternative called *empirical Bayesian forests* ${ }^{10}$
    (EBF; the Bayesian name is due to theory derived from a Bayesian bootstrap, but
    it is not important in practice). The algorithm is based on a simple observation:
    when you have a large dataset, the *tops* (or trunks-the first few splits) of
    the trees in a forest are mostly similar. ${ }^{11}$


    For example, fitting CART to the California housing data down to a minimum leaf
    size of 3500 observations results in the *trunk* shown in Figure 9.14. After fitting
    an RF to the same data, a comparison across trees in the forest shows that they
    all have a trunk structure similar to that of Figure 9.14. In particular, that
    *exact* trunk occurs $62 \%$ of the time. The second most common trunk, occurring
    $28 \%$ of the time, differs only in that it splits on median income again instead
    of on housing median age. Thus, $90 \%$ of the posterior weight is on trees that
    split on income twice and then latitude. Moreover, a striking $100 \%$ of trees
    have first two splits on median income. Figure 9.15 shows the locations of these
    first two splits: each split-location is concentrated around the trunk split in
    Figure 9.14.'
