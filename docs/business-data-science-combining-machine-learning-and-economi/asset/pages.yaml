  md: "# CAUSAL TREES\n\nRandom forests and trees are commonly viewed as pure prediction\
    \ tools—they are supervised ML procedures for predicting a future that is mostly\
    \ like the past. However, trees have recently found application in causal inference\
    \ settings. In particular, it turns out that tree-based models are great tools\
    \ for modeling heterogeneous treatment effects (HTEs; see also Chapter 6).\n\n\
    We’ll focus on a basic setting of binary treatment, $d = 0$ or 1, and assume that\
    \ treatment has been randomized. That is, you are fitting HTEs after a standard\
    \ AB experiment. The conditional average treatment effect (ATE) of interest is\
    \ then the difference between conditional expected response for the treatment\
    \ and control groups given covariates $x$: \n\n$$\\gamma(x) = E[y|d=1, x] - E[y|d=0,\
    \ x]. \\tag{9.2}$$\n\nGiven the results of an AB test, one way to estimate HTEs\
    \ is to simply fit two functions to predict $y$ from $x$—one for the treatment\
    \ group and one for the control group—and use the difference between these two\
    \ fitted predictors as the estimate for $\\gamma(x)$. This is the approach taken\
    \ in, for example, the work of Jennifer Hill [2011]12. For each treatment group,\
    \ Hill fits Bayesian additive regression trees13 (BART), a model that regresses\
    \ $y$ onto a set of shallow trees constructed from $x$. Since this is a fully\
    \ Bayesian regression method, and because the two samples are independent, she\
    \ is able to get a full posterior for $\\gamma(x)$ simply by differencing the\
    \ two BART objects.\n\nAthey and Imbens [2016] show that in many cases you can\
    \ do better in modeling HTEs by targeting them directly rather than looking at\
    \ the difference of two treatment-specific functions. Their causal tree14 (CT)\
    \ framework is a simple extension of the usual CART algorithm. Instead of choosing\
    \ splits to minimize impurity (e.g., the SSE), you choose the tree splits to maximize\
    \ the squared difference between estimated treatment effects in each child node.\
    \ Algorithm 26 outlines the full routine.\n\n# **ALGORITHM 26** Causal Tree (CT)\n\
    \nGiven a set of [$d_i$, $x_i$, $y_i$] observations in node $\\eta$ of a tree,\
    \ the estimated treatment effect is\n\n$$\\hat{\\gamma}_\\eta = \\bar{y}_{\\eta\
    \ 1} - \\bar{y}_{\\eta 0}. \\tag{9.3}$$"
  merge: -1
  img_proc: true
- pgno: 379
  md: 'Here, $\bar{Y}_{\eta d}$ is the sample mean of observations in node $\eta$
    with treatment status $d$. CT uses the same greedy recursive strategy as CART.
    Given a node, you split into left and right children on the variable observation
    $x_{ij}$ that maximizes


    ```

    $\sum_{k \in \text{left}} \hat{\gamma}^2 + \sum_{k \in \text{right}} \hat{\gamma}^2$  (9.4)

    ```


    This splitting continues until you hit a minimum number of observations *from
    each treatment group* in a node; these terminal nodes are the leaves of the causal
    tree.


    Algorithm 26 is more precisely what Athey and Imbens refer to as their *adaptive*
    CT algorithm. Their preferred *honest* version of the estimator uses two samples
    to fit the tree: one for determining the tree splits and a second that is used
    to re-estimate the treatment effects within each leaf *conditional* upon this
    tree structure. This has the advantage that it allows you to derive approximately
    Gaussian sampling distributions around the leaf estimates (either $\hat{\eta}_\eta$
    for CART or $\hat{\eta}_\eta$ for CT).$^{15}$ But beyond this “honest” adaptation,
    CTs follow the same philosophy as CART: very simple leaf estimates are combined
    with partitioning on $x_{i}$ to create complicated surfaces.


    Athey and Imbens [2016] provide the causalTree R package for implementing CTs.
    It is based upon the rpart package, which can be used to fit standard CART models.
    To illustrate the CT algorithm, let’s revisit the Oregon Health Insurance Experiment
    (OHIE) from Chapter 5. Recall that we were interested in observing the treatment
    effect of randomly selected eligibility for Medicaid on the probability that someone
    visits a primary-care physician (PCP) at least once a year. The treatment variable
    is *selected*, indicating whether a person’s household was selected for eligibility,
    the response variable is binary `doc_any_12m`, and for covariates we have a set
    of results from a survey on subject demographics.




    The basic causalTree algorithms are designed for perfectly randomized experiments.
    In the original OHIE analysis, the randomization was corrupted by the fact that
    if anyone from a household was selected, then the whole house was eligible for
    enrollment. It would be best to control for the number'
  merge: -1
  img_proc: true
- pgno: 380
  md: "of people in each household when comparing treatment and control groups, and\
    \ you can do this in the causalTree package using propensity weights (see discussion\
    \ on propensities in Chapter 6). However, controlling for numhh made little difference\
    \ in the original analysis, and for simplicity, here we will treat the randomization\
    \ as perfect. Thus, repeating results from earlier, the overall average treatment\
    \ effect on the probability that a patient sees a doctor in the next 12 months\
    \ is around 0.06 (a six percentage point increase).\n\n```\n```R\n> ybar <- tapply(P$doc_any_12m,\
    \ P$selected, mean)\n> ybar ['1'] - ybar['0']\n      1 \n0.05746606\n```\n```\n\
    \nThe causal tree syntax is similar to that of glm; you provide a regression formula\
    \ and a data frame. You need also to specify a treatment variable (d) and some\
    \ algorithm parameters. Here, we will ask for the causal tree algorithm of Algorithm\
    \ 26 with honest splitting (i.e., sample splitting). In addition, we specify the\
    \ minimum leaf size as 2000 observations. This yields a short tree, with splits\
    \ for a few major sources of heterogeneity.\n\n```\n```R\n> ct <- causalTree(P$doc_any_12m\
    \ ~ ., data=X, treatment=P$selected,\n+                   split.Rule = \"CT\"\
    , split.Honest=TRUE, minsize=1000)\n```\n```\n\nFigure 9.16 shows the resulting\
    \ tree fit. As might be suspected, a number of the splits are on income: hhinc_pctfpl_12m\
    \ is household income as a percentage of the federal poverty line. For example,\
    \ for those who make enough money to be at or above the poverty rate (hhinc_pctfpl_12m>=\
    \ 97), eligibility for Medicaid actually decreases the probability that they see\
    \ a PCP. Possibly, for these subjects Medicaid is replacing a private insurance\
    \ option that makes it easier to visit a doctor. On the other hand, for those\
    \ who make less than 60% of the poverty line, the treatment effect is greater\
    \ than 0.1, and as high as 0.15 for women in small household born after 1966."
