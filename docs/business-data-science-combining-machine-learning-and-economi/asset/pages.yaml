    \ is about 15% smaller than that from OLS.\n\nTHERE IS A HUGE WORLD OF EXPERIMENTAL\
    \ DESIGN. This section only scratches the surface, and there are a number of strategies\
    \ other than complete randomization. For example, when you know in advance that\
    \ external factors have an influence both on the response and on the treatment\
    \ effectiveness, you can reduce the variance of the ATE estimates by randomizing\
    \ within blocks of experimental subjects that share similar properties.\n\nAs\
    \ a famous application, Fisher’s agricultural experiments of the 1920s had the\
    \ problem that variation in growing conditions across fields could be large relative\
    \ to his treatment effects of interest, such as the effect of a fertilizer. The\
    \ solution is a blocked randomized design: split the growing area into fields\
    \ of relative homogeneity and apply each treatment level within subregions of\
    \ each field. The blocked ATE estimate is then the average difference between\
    \ outcomes for the treated subregions. That is, if ykd is some measure of crop\
    \ yield in field k of K under treatment d, then the estimated ATE is"
