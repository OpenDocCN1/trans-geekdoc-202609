    {11} (0) & y _ {12} (0) & \cdots & y _ {1 T} (0) & ? \\( y _ {21} (0) & y _ {22}
    (0) & \cdots & y _ {2 T} (0) & y _ {2 T + 1} (0) \\ \vdots & \vdots & & \vdots
    & \ \\ y _ {J1} (0) & y _ {J2} (0) & \cdots & y _ {J T} (0) & y _ {J T + 1} (0)
    \end{array},\end{array} \tag{6.20}$$

    ```


    and if you look forward to future time points you will continue to miss only the
    first entry for each column.


    Given this available data, a synthetic controls analysis first builds a model
    to predict $y _ {1 t}(0)$ from $\mathrm{y} _ {- 1 t}(0) = [\mathrm{y} _ {2 t}(0)
    \ldots \mathrm{y} _ {J t}(0)]''$. This model is estimated using the fully observed
    data from periods $t \leq T$ and is then used to predict the unobserved control
    values $y _ {1 T + 1}(0), y _ {1 T + 2}(0)$, etc. The original synthetic controls
    work of Abadie and Gardeazabal [2003] uses positive weights summing to one to
    combine the control series when predicting the treatment series. However, you
    should feel free to use whatever regression model works best for prediction in
    your application. Since there are typically many control series $(J)$ relative
    to the number of time periods $(T)$, it will often make sense to use a regularized
    regression like the AICc lasso.


    # **ALGORITHM 16** **Synthetic Controls**


    +   * Build a regression model for $\mathbb{E} \left[ y _ {1 t}(0) | y _ {- 1
    t}(0) \right]$, and estimate this regression using data from time periods $t =
    1 \ldots T$.

    * Use this regression to predict $\hat{y} _ {1 T + 1}(0), \hat{y} _ {1 T + 2}(0)$,
    etc., and estimate the treatment effect at each time point as follows:


    ```

    $$\hat{\boldsymbol {y}} _ {1 T + s} = \boldsymbol {y} _ {1 T + s} (\mathbf {1})
    - \hat{\boldsymbol {y}} _ {1 T + s} (0) .$$

    ```


    To illustrate the approach, we will revisit the data example from Abadie and Gardeazabal
    [2003] concerning the economic costs of terrorism in the Basque region of Spain.
    Beginning with a single killing in the summer of 1968, the terrorist group ETA
    began a campaign of killing and kidnapping that continued, with periodic cease
    fires, until 2010. The violence was high from the late 1970s through the early
    1990s, with a peak of 92 people killed and 13 kidnapped in 1980. Almost 70% of
    the deaths occurred in the Basque country, and Basque business owners were common
    kidnapping targets.


    Abadie and Gardeazabal ask the question: "How much did the ETA campaign harm the
    economy of the Basque country?" In addition to the'
