    # TensorFlow 操作


    我们使用了一些 TensorFlow 操作来理解数据流图。让我们熟悉 TensorFlow 中一些基础的数学操作。


    ```python

    import tensorflow as tf

    import numpy as np

    a = np.array([6, 2])

    b = np.array([1, 4])

    c = tf.multiply(a, b)

    sess = tf.Session()

    sess.run(c)

    ```


    在这个示例中，我们使用了 `tf.multiply()` 操作。当我们运行这段代码时，将得到一个 NumPy 数组作为输出，`array([ 8, ...`。我们也可以提供输入的数据类型，例如
    `a = np.array([6, 2], dtype=np.int32)`，或者使用浮点数据类型，因此输出也会提到数据类型。那么，这个示例中有什么新内容呢？在这个示例中，我们使用
    NumPy 手动初始化了张量。这展示了 NumPy 和 TensorFlow 之间的兼容性。


    为什么我们使用 NumPy 来初始化张量对象？TensorFlow 有多种数据类型选项，如 `float32`、`int32` 等，但在某些情况下（例如复数），使用
    TensorFlow 初始化会稍微困难一些，因此 NumPy 让我们的工作变得更简单。这表明 TensorFlow 中的数据类型与 NumPy 高度相关，或者简单来说是基于
    NumPy 的数据类型。我们可以在终端输入 `tf.int64 == np.int64` 来验证这一观点，并将得到输出 `True`。我们也可以将 NumPy
    数组作为 TensorFlow 的输入。


    ## 张量对象的形状


    张量（Tensor）被定义为具有相同数据类型的数组。这意味着定义一个张量对象，我们需要每个维度的值和数据类型。形状（shape）描述了维度的数量以及每个维度的长度。张可以是列表、元组或
    ND 矩阵。


    让我们理解张量：


    ```python

    import tensorflow as tf

    tensor_object = tf.constant(1, shape=[2, 3])

    print(tensor_object)

    ```


    执行时，它将返回 `Tensor("Const:0", shape=(2, 3),` 输出。这告诉我们节点名为 `Const: 0` 以及其值，`tensor_object`
    的形状为 `[2, 3]`，数据类型为 `int32`。在 TensorFlow 中，张量的形状可以分为两种：静态形状和动态形状。


    ### 静态形状


    静态形状定义为初始化张量对象时确定的形状，或者在执行某些操作获取新张量对象后由 TensorFlow 推出的形状。它通常是列表或元组。TensorFlow
    尝试在操作过程中推断 `z` 张量对象的形状，但当使用未知维度的 placeholder（动态尺寸）时，这会变得困难。


    ### 动态形状


    我们可以说动态形状是在运行时确定的形状。让我们通过一个例子来理解：


    ```python

    import tensorflow as tf

    var1 = tf.placeholder(tf.float32, shape=[6])

    print(var1.get_shape())

    ```


    执行后，它将返回 `(6,)` 作为输出。这是静态形状，输出表示向量的长度。现在，让我们在其他操作中使用 `var1`。


    ```python

    var2, idx = tf.unique(var1)

    print(var2.get_shape())

    ```


    返回 `(None,)` 作为输出。这意味着向量 `var2` 的长度是未知的。由于 `var1` 是未知的且 `var2` 依赖于它，因此长度也是未知的。


    ```python

    sess = tf.Session()

    print(sess.run(var2, feed_dict={var1: [1, 2, 2, 3, 3, 3]}))

    print(sess.run(tf.shape(var2), feed_dict={var1: [1, 2, 2, 3, 3, 3]}))

    ```


    它将返回 `(6,)` 和 `(3,)` 作为输出。我们可以可以看到 var2 的维度发生了变化。


    ## TensorFlow 中的 Session


    Session 可以被定义为一个控制数学操作执行和张量值求值环境（计算图）的对象。我们也可以将其理解为将计算图放置在不同机器（如 CPU 或 GPU）上并提供执行过程。它有助于存储变量的当前值。


    我们主要有两种方式启动 Session：


    1. `sess = tf.Session()`，`sess.run()`，`sess.close()`

    2. `with tf.Session() as sess: sess.run()`


    Session 在执行图时使用资源。如果不再需要，释放这些资源是非常重要的。如果我们使用第一种方法，则必须显式关闭 Session。第二种方法作为上下文管理器，因此
    Session 在退出 with 语句后会自动关闭。另一种方法是交互式 Session（Interactive session），它将自己变为默认 Session，因此在调试或在
    IPython 中编写时非常有用。上述方法被广泛使用。以下是交互 Session 的示例：


    ```python

    import tensorflow as tf

    sess = tf.InteractiveSession()

    a = tf.constant(5.0)

    b = tf.constant(6.0)

    c = a * b

    # 我们可以直接使用 ‘c.eval()'' 而不需要传递 ‘sess’

    print(c.eval())

    sess.close()

    ```


    Session 与交互 Session 的区别在于交互 Session 将自己变为默认 Session，这样我们就可以不显式地调用 `run()` 或 `eval()`
    了。


