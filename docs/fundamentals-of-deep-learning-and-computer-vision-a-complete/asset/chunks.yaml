    # 长短期记忆网络 (LSTM)


    如何解决梯度消失问题？前一节实际上包含了解决方案。让梯度在很长的上下文中传播并不是总是必须的，特别是在训练饱和附近。这意味着，当网络接近收敛时，节点的激活函数处于饱和区域，该区域的梯度很小。在这些情况下，梯度不需要跨越很长的上下文进行传播。相反，短期上下文表示在此时对误差的贡献是主要的。因此，网络应该对记忆什么和遗忘什么进行某些控制。换句话说，网络应该基于输入和隐藏状态进行某些控制，允许梯度从上一个状态传递到当前状态。LSTM
    正是这样做。


    长短期记忆网络（Long Short-Term Memory，通常被称为 `LSTM`）是另一种 RNN 网络，它可以处理数据之间的长期依赖关系。`LSTM`
    的出现是解决梯度消失和爆炸问题的救星。`LSTM` 已用于解决许多实际问题，并成为 RNN 的事实上的标准。与 `RNN` 相比，`LSTM` 的核心思想在于它有几个门结构。这些门允许
    `LSTM` 单元根据输入和输出关注或遗忘输入序列的特定部分。`LSTM` 通过解决这个问题并在自然语言处理许多领域（如语言建模、机器翻译、图像描述、语音识别等）中建立基准而变得非常流行。


    ![](img/image-tylzy8sk.jpg)

    图 5.14: RNN 的简单结构


    图 5.14 展示了 `RNN` 简单结构的概述。它展示了信息如何从上一个时刻流到下一个时刻。在图中，名为 `tanh` 的框代表 `tanh` 函数。`LSTMs`
    也有类似的链式结构，但被称为 `LSTM cell` 的较小构建块具有不同的结构，如图所示。


    ![](img/image-8am3oqbl.jpg)

    图 5.15: LSTM 的简单结构


    从图中可以看出，`RNN` 的单元中只有一个神经网络，但在 `LSTM` 中，有四个不同的神经网络在相互作用。


    ## LSTM 的架构


    `LSTM` 的巧妙之处在于单元状态（cell state），即 `LSTM cell` 的上方的线，如图所示。它与某些线性操作相连，使得信息很容易传递到下一个单元。


    ![](img/image-zrip32y5.jpg)

    图 5.16: 单元状态


    `LSTM cells` 还有图中所示的门，用于决定信息的流。该门（被称为 `forget gate`，遗忘门）由一个 `sigmoid` 层和点乘法操作组成。


    ![](img/image-nfc40rkr.jpg)

    图 5.17: 门的简单架构


    根据 `sigmoid` 层的输出，它允许信息流动。输出值的范围从 0 到 1。当输出值为 0 时，它不允许信息流动；而当输出值为 1 时，它允许所有信息从上一个单元流到下一个。如上所述，`LSTM
    cell` 的第一步是决定是否将信息从上一个 `LSTM cell state` 传递到下一个。作为 `forget gate layer` 的 `sigmoid`
    层已经讨论过了。


    将会有一个作为 `forget gate layer` 的 `sigmoid` 层。`sigmoid` 层的输出决定了保留多少比例之前的单元状态。如果输出为
    0，则单元状态被遗忘；如果为 1，则单元状态被保留。接下来，`LSTM cell` 使用 `tanh` 层来创建一个候选激活状态。然后将此候选状态与 `sigmoid`
    层的输出相乘，并加到之前的单元状态上。这个过程更新了单元状态。


    最后，`output gate`（也是一个 `sigmoid` 层）决定单元状态的哪些部分将传递到隐藏状态。这是通过将单元状态通过 `tanh` 函数并将其乘以
    `output gate` 的输出来实现。


    ![](img/image-e6lz33.jpg)

    图 5.18: LSTM 单元中的遗忘门


    ![](img/image-1a74yy.jpg)

    图 5.19: LSTM 单元中的输入门


    ![](img/image-0derrnn.jpg)

    图 5.20: LSTM 中的单元状态计算


    ![](img/image-ogxe84r0.jpg)

    图 5.21: LSTM 单元中的输出门


    ## LSTM 的变体


    我们到为止讨论的是普通的 `LSTM`。但并不是所有的 `LSTMMs` 都与上述相同。事实上，似乎每篇涉及 `LSTM` 的论文都使用了略有不同的版本。让我们简要看看
    `LSTM` 的另一种形式。


    `门控循环单元`（Gated Recurrent Unit，或 `GRU`）将遗忘门和输入门合并为一个单一的更新门。它还合并了单元状态和隐藏状态，并进行了其他其他更改。生成的模型比标准的
    `LSTM` 模型简单，并且变得越来越流行。


    ![](img/image-zlypl7q1.jpg)

    图 5.22: 门控循环单元


    ![](img/image-x9mzbeo3.jpg)

    图 5.23: 窥视连接 (Peephole connection)


    '
