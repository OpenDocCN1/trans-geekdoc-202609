    ![](image-bl97zs.jpg) Figure 4.7: Without the use of 1 convolution\n\nIt should\
    \ be noted here that pooling layers (discussed in the last chapter) also reduce\
    \ the number of parameters but the number of channels remains unchanged.\n\n##\
    \ Inception module\n\nThe idea behind using the inception module is to use convolutions\
    \ of different sizes to capture information at varied scales. In Figure we see\
    \ that convolutions of different sizes `1 X 1`, `3 X 3`, and `5 X 5` have been\
    \ used to extract all different levels from the previous layer. `1 X 1` convolutions\
    \ in the yellow box in Figure serve the purpose of reducing the computations,\
    \ as discussed previously, by limiting the number of input channels.\n\n![](image-xri22uz.jpg)\
    \ Figure 4.8: Inception module\n\n## Global average pooling layer\n\nIn the architectures\
    \ discussed above and in the previous chapter, fully connected layers are used\
    \ at the end of the network:\n\n![](image-gtfpual.jpg) Figure 4.9: Fully connected\
    \ layer vs global average pooling\n\nAs can be observed from Figure in a fully\
    \ connected case, all inputs are connected to each output, which results in `7\
