    # 结论


    在本章中，我们讨论了线性模型对于线性分离的数据是有效的，但由于其固有的线性，它们在处理具有非线性交互的数据集时会失效，这意味着它们只能识别线性决策边界。在现实世界中，我们通常遇到无法用线性决策边界解决的问题。然后，我们讨论了一种名为前馈神经网络的非线性网络。我们看到了非线性网络如何解决非线性数据。接下来，我们还讨论了前馈神经网络的各种构建模块，例如代价函数（惩罚错误输出）、梯度下降（学习步骤）、激活函数（引入非线性）等。接阶段，我们讨论了如何避免网络中的偏差或方差，或者如何构建泛化能力的网络。最后，我们通过两个例子结束了讨论——一个展示了网络中复杂性的影响，另一个是关于
    MNIST 服装分类。前馈网络有助于解决简单问题，但对于语言翻译、时间序列预测、目标检测等复杂任务，它的表现并不理想。在下一章中，我们将讨论前馈神经网络的扩展，即卷积神经网络（CNN），并将看到
    CNN 如何帮助克服前馈神经网络的局限性。


    # 第 3 章 卷积神经网络


    在上一章中，我们讨论了前馈神经网络，它能够为输入和输出向量之间的非线性映射学习高维、非线性且复杂的函数。在本章中，我们将讨论一类更先进、复杂的神经网络，称为卷积神经网络（CNN）。我们将从讨论前馈神经网络的局限性开始。接下来，我们将讨论
    CNN 的定义和应用，以及我们如何利用 CNN 来克服前馈神经网络的局限性。随后，我们将讨论构建 CNN 所需的基础操作和技术，例如卷积操作、池化函数等。最后，我们将以
    CNN 的端到端架构结束讨论。


    ## 结构

    - 卷积操作

    - 激活层

    - 池化层

    - Dropout（丢弃法）


    ## 目标


    本章的目标是解释 CNN 在处理图像等拓扑数据中的应用，并理解各种先进的 CNN 架构。


    ## CNN 简介


    让我们从前馈神经网络的效率开始。通常，我们会遇到如图像和单词等的数据，其变量数量达到数百或数千。为了理解这一点，让我们考虑一个具有 100 个输入单元的较小神经网络。现在，一个全连接层将会有
    10,000 个权重，如果我们将层数增加到 3 或 4 层，权重将增加到 30,000 到 40,000 个。即使我们应用通用的 dropout 标准（在上章中讨论过），它也不会减少权重的数量。此外，如果我们继续丢弃更多的隐藏单元，会导致欠拟合。对于小型神经网络来说是如此。假设我们使用具有
    1000 个输入单元的神经网络，权重数量将达到数百万。这些大量的变量需要巨大的内存，并最终排除了硬件实现的可能性。由于上述条件，前馈神经网络的实现变得在计算上非常昂贵。此外，如果训练数据有限，可能会面临过拟合问题。


    除了上述的计算局限性外，前馈网络在特征层面也存在局限性。我们知道前馈网络是非结构化网络，不共享参数，因此它对局部失真不稳健。在预处理期间，我们对数据进行归一化并输入网络，但在预处理过程中图像可能会发生平移或旋转变形，由于每个单元使用不同的权重，单元的输出就会失真。其次，在
    CNN 中，参数在输入之间共享，因此变量数量减少了，这变成了一种更高效的技术。神经网络的另一个局限性是它没有利用输入数据的拓扑结构。我们可以以任何顺序输入数据而不会改变输出。但我们知道图像在空间上是相关的，类似于时间序列在时间上是相关的。CNN
    利用了局部特征之间的相关性。我们将在稍后详细讨论 CNN 如何帮助克服前馈神经网络的局限性。


    CNN 广泛应用于具有网格拓扑结构的数据。例如 1D 数据（如时间序列数据，可以被分析为按固定时间间隔采样的 1D 网格）以及多维图像（可以可视化为分层堆叠的
    2D 像素网格）。CNN 在解决实际问题方面表现出了卓越的性能。正如名称所示，CNN 使用了一种不翻转卷积核的数学操作。在数学上，卷积被定义为一种特殊的线性操作。如果我们分析
    CNN，可以看到 CNN 类似于神经网络，这些神经网络在至少一层中使用权重和输入之间的卷积操作（互相关）来代替矩阵乘法。现在，我们将讨论什么是卷积。接下来，我们将形象地讨论，为什么研究人员将注意力从全连接网络转向卷积神经网络。正如之前提到的，CNN
    中使用的卷积操作与工程或数学等领域使用的操作并不完全相同。我们将讨论在神经网络中广泛使用的几种卷积操作变体。我们还将看到如何在一个各种多维数据上使用卷积函数。


