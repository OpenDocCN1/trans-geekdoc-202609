    图 2.16


    图 2.16 展示了具有单隐藏层的前馈神经网络。让我们定义该网络的参数：


    - **权重**：`W1` 和 `W2` 代表每一层的权重矩阵

    - **偏置**：`b1` 和 `b2` 代表每一层的偏置向量

    - **输入单元**：`x` 代表输入数据（`x1`、`x2` 和 `x3`）

    - **隐藏单元**：`h` 代表隐藏层隐藏单元的数量（这里为 `h1`、`h2`、`h3` 和 `h4`）

    - **输出单元**：`O` 代表输出层输出单元的总（在本例中，只有 `O`）


    下标 `0`、`1` 和 `2` 分别代表第 0 层（输入数据）、第 1 层（隐藏层）和第 2 层（输出单元或输出层）。在书中，上表示层数，下标表示层中的位置。例如，`h3`
    表示 `h3` 位于层的位置。


    对于单个神经元，我们将输入到输出的关系写为 `y = f(Wx + b)`。


