- raw: '  Backpropagation    So far, we discussed how to update the parameters of
    the simple neural network, but we haven’t discussed how to compute the gradient
    of the cost function in a complex network. In other words, we have not discussed
    properly how to compute the gradient of the cost function with respect to each
    of the parameters of a network. So, in this section, we will discuss how each
    parameter affects the cost function and how to propagate the error back in the
    neural network to update model parameters.    In feedforward neural networks,
    we take an input x and then information from x flow through hidden layers to produce
    output . As information from x flows forward only, that’s why this process is
    known as forward propagation. Now, once we get the output, we define a J cost
    function, which represents the error between a true y output and predicted output.
    Using the backpropagation algorithm, we feed the information (that’s essentially
    the gradients) from the cost function back to the network. We can assume it as
    a process that uses the feedback mechanism to enhance its performance. In backpropagation,
    we feed information again to the network, but this time in backward direction.
    In other words, we propagate information in backward direction, that’s why this
    technique is known as “backpropagation”. Notice that even in the case of a generalized
    linear model, we carried out backpropagation. So, in general, we can say that
    backpropagation is used to compute the gradient of any function.    Moving forward,
    we will develop an intuitive understanding of backpropagation using the chain
    rule, which will be used recursively to compute the gradient of functions.   
    We will start with a simple example. Let’s define a function as \= \+ To make
    it simple, we will represent this equation into a simpler equation: \= a \* where
    w \+ x is represented by Now, let’s apply the chain rule to find the relation
