    # Deep residual learning framework


    Now we understand that training a network better is not straightforward as adding
    layers to the network. We have a problem called the degradation of training accuracy.
    A deep residual learning framework has been proposed to address this problem.
    As we can recall from previous chapters, every neural network, basically, tries
    to learn a mapping between input `X` and output `Y` with the help of stacked layers.
    In Resets, however, instead of expecting layers to directly fit the underlying
    mapping we explicitly let the layers fit residual mapping Let’s understand what
    the intuition behind using residual mapping is, and how we achieve this through
    skip connections. From above, original mapping function becomes `H(x) = F(x) +
    x` where `F(x)` represents the stacked non-linear layers, and `x` represents the
    identity function (`H(x) = x`). The idea is that it is easier to optimize residual
    mapping function `F(x)` than to optimize `H(x)` using a stack of non-linear layers.
    This prevents neural networks from having to learn identity functions if necessary.
    To model the identity function, skip connections, as shown in Figure, are used
    to explicitly copy weights from earlier layers to later layers.


    ![](image-3johc9yl.jpg

    Figure 4.12: Skip connections used for residual mapping


    ## Two kinds of residual skip connections


    There are two kinds of residual skip connections: When input and output are of
    the same dimensions, the identity connections are used directly as shown below:


    ![](image-p5kd27u3.jpg

    When earlier and later layers have different dimensions, a linear projection is
    performed by the shortcut connections to match the dimensions as shown below:


    ![](image-p4dqw76g.jpg

    Here, we should note that adds an extra set of parameters. To avoid that, we can
    also use zero padding for increasing dimensions. Using these skip connections
    in a plain network, the final ResNet architecture is shown in Figure


    ![](image-vnr0zsy8.jpg

    Figure 4.13: Left: a plain network with 34 parameter layers. Right: a residual
    network with 34 parameter layers


    # Computer vision applications


    In the last section, we discussed different `CNN` architectures that have been
    proposed in the last couple of years and have found their immense use in feature
    extraction for many computer vision applications. Because of all these advancements,
    it has been possible to train extremely deep neural networks and solve so many
    real-life image classification problems with great efficiency. Computer vision
    applications and systems have become much more advanced and involved, and their
    use cases go far beyond just image classification. Object detection and localization
    are two of them. Advancements in object detection and localization have made self-driving
    cars, video surveillance, face detection, robotic systems, and automation in many
    industrial applications possible. The following image shows the difference between
    classification, localization, and object detection:


    ![](image-h5ahuxfb.jpg

    Figure 4.14: Difference between classification, localization, and object detection


    In all such use cases, where we have more than one object in an image, and it
    is required to classify and label them after localizing, object detection and
    localization come into the picture. Instead of just classifying the images into
    appropriate class, we need to detect all the different objects in the image and
    find their locations — create bounding boxes around objects. The last couple of
    years have witnessed the advent of many object detection algorithms, such as `R-CNN`,
    `Fast R-CNN`, `Faster R-CNN`, `SSD`, and `YOLO`. In the next section, we will
    be discussing each of them and their architectures briefly, with a major focus
    on `YOLOv3`. This will be preceded by an overview of general object detection
    framework.


    ## General object detection framework


    The steps in the General object detection framework are as follows:


    1. First of all, the objective is to create and train an appropriate `ConvNet`
    (`CNN`) that classifies the different objects.

    2. The next task is to find the regions of interest (`RoI`) or region proposals
    in the image through a model or an algorithm where objects to be detected are
    expected. Generally, `selective search` algorithm is used to find `RoIs`, which
    is a clustering-based approach that groups pixels and generate `RoIs` based on
    the generated clusters.

    3. Next, we extract features from each of the bounding boxes, pass those features
    in the `ConvNet` created in step 1 for classification, and classify each of the
    bounding boxes into an appropriate class.

    4. In the last step, overlapping bounding boxes are combined into a single bounding
    box, an approach known as non-maximum suppression. The intuitive framework discussed
    above is `R-CNN`. Though it is very slow, it has inspired and helped the evolution
    of advanced object detection algorithms that we will be discussing.


    ## Fast R-CNN


    Fast R-CNN is the immediate descendant of `R-CNN`. Although, it is quite similar
    to `R-CNN`, it improved on its detection speed through two main augmentations,
    as discussed below: Instead of first finding the `RoIs` and then extracting features
    from those bounding boxes, `Fast R-CNN` proposed to first extract features from
    the image and then use the appropriate feature `RoIs` for classification. Thus,
    running one `CNN` over the entire image instead of running 2k `CNNs` for 2k region
    proposals. Instead of creating a separate model for classification, `Fast R-CNN`
    further extended the feature extraction model and included few fully connected
    layers and a `softmax` layer for end-to-end feature extraction and classification.


    ## Faster R-CNN


    Faster R-CNN proposed an alternative to `selective search` algorithm for finding
    region proposals in the form of a neural net. It introduced `Region Proposal Network`
    (`RPN`) for this specific purpose. Now, let’s understand how `RPN` works. After
    generating the feature map through `CNN`, a `3 X 3` sliding window is moved across
    the feature map, which maps the feature map into lower dimension. For each sliding
    window location, multiple possible regions are generated based on `k` default
    bounding boxes, known as `anchor boxes`. For each of these anchor boxes, we output
    an objectness score that tells whether or not the box contains an object and coordinates
    of the box. Once we have these region proposals through `RPN`, they are fed straight
    into the `Fast R-CNN`, discussed earlier.

    '
