- raw: '  Padding    Normally, we increase the stride value if we want less overlap
    between receptive fields or to keep the spatial dimension small. But, what if
    we don’t want to shrink the size of the output matrix after every convolution
    step? Let’s understand how we can keep the size of an input and an output matrix
    same. We saw in Figure and 3.26 that after convolution layer, the size of the
    output matrix gets reduced. The output size is reduced because boundary pixels
    and non-boundary pixels are used differently. In other words, boundary pixels
    are used less than non-boundary pixels in receptive fields. Now, imagine if we
    build a deep convnet, what would be the size of the final output? As we build
    more layers, we will implement more convolutional layers and the output size will
    get reduced. So far, we know that the size of the output is reduced by convolutional
    layer but later on, we will discuss pooling layer which also reduces the size
    of the output matrix significantly. Reduction in the size results in the loss
    of input features meaning loss of information. In deep networks, we want to keep
    as much information about input features as possible so that we can extract low
    level features of input. As output shrinks, we find that the representation of
    input features becomes scarce which leads to high error prone results. Padding
    helps to overcome this problem. Let’s understand how padding helps. We will use
    the example shown in Figure The size of the input matrix is 5 × 5, kernel size
    is 3 × 3, and stride is 1\. Our aim is to keep the output size same as input.
    We can understand “padding” more using Figure 3.28 and Figure Figure 3.28 shows
    the input matrix with zero padding (left) and the kernel (right) and Figure 3.29
    shows the output of convolution operation between the padded input matrix and
    kernel:    ![](image-atelhwpw.jpg)  Figure 3.28: Input matrix (left) and kernel
    (right). Color on borders represents different receptive fields.    ![](image-m8qn4ojs.jpg) 
    Figure 3.29: Each color box represents output of a convolution operation between
    different receptive fields and input matrix.    We can see that the dimensions
    of the output matrix and the input matrix remained the same. We pad the input
    matrix with zeros. After padding, we can keep each pixel of the input image at
    the center of receptive fields during convolution. Hence, each pixel is used with
    equal frequency in receptive fields, which is not possible without padding except
    when the size of kernel is 1 × 1\. When size of a kernel is 1 × 1, we don’t use
    padding because each pixel position acts as a receptive field, so each pixel is
    involved in receptive fields with equal frequency. We can pad additional layers
    with any number, like average of local pixels or maximum of local pixels but generally
    zero is used.    ![](image-on5fhys5.jpg)  Figure 3.30: Example of convolution
    with padding and stride of 2    Figure 3.30 represents another example of convolution
    with padding and stride of 2\. We can see that output matrix shrinks. In the last
    example, we used padding layer of size 1 and stride of 1 but in this example,
    we used padding layer of size 1 with stride of 2\. So, how can we decide the combination
    of padding layer and stride to keep the dimensions of input and output same or
    how can we choose padding layers and stride so that we can get desired dimensions
    of the output?    Let’s start by simple convolution. When we convolve a 4 × 4
    input matrix with 3 × 3 kernel, it produces a 2 × 2 output matrix. That’s because
    there are only 2 × 2 possible positions where 3 × 3 filter can fit into 4 × 4
    input matrix. In general, if we convolve a matrix of size n × n with a kernel
    of size ⨍ × then the dimension of the output will be n – ⨍ \+ 1 × n – ⨍ \+ 1\.
    When we introduce padding and stride, the equation changes. Let’s see the mathematical
    equation for different scenarios. In the following cases, we will use input matrix
    of size n × n and kernel of size ⨍ × We will use notations and O to denote padding,
    strides, input, kernel, and output sizes respectively. The output matrix O will
    also be a square matrix.     No zero padding and unit strides p \= 0, s \= 1),
    also called valid padding:    O \= n – ⨍ \+ 1    Zero padding and unit strides
    (i.e., p \=2 and s \= 1):    O \= – \+ \+ 1    Same or Half padding when we want
    to keep the input and the output dimensions same:    (i.e., n \= O and s \= 1).   
    For any input n and filter ⨍ where ⨍ \= \+ 1, i ∈ N and p \= floor \=    O \=
    n – ⨍ \+ \+ 1 \= n – – 1 \+ \+ 1 \= n    Conversely, given the same conditions,
    and if we know that n \= then we can write:    O \= n \+ – ⨍ \+ 1    ⨍ \= \+ 1
    or p \= – 1)/2,    Since p takes integer values, we can say that when n \= size
    of a filter will be odd.    Full padding \- generally, with convolution either
    output shrinks or dimensions of input and output remain the same using padding
    but when we want to increase the size of an output then we use full padding.   
    For any n and ⨍ and if p \= ⨍ – 1 and s \= 1:    O \= n – ⨍ \+ \+ 1 \= n – ⨍ \+
    – 2 \+ 1 \= n \+ ⨍ – 1     Figure depict the above discussed cases respectively.
    We can see that padding layers, dimensions of input matrices, and filters are
    varying. We discussed different cases in which parameters may have different relationships
    with each other. The parameters used in Figure are according to above discussed
    relationships.    ![](image-9z1hfdo2.jpg)  Figure 3.31: Convolution between input
    matrix of size 4x4 and filter 3x3 with no padding and stride of 1\.    ![](image-mi6gk7y1.jpg) 
    Figure 3.32: Convolution between input matrix of size 5 x 5 and filter 4 x 4 with
    2 layers of padding and stride of 1\.    ![](image-5ivfkshl.jpg)  Figure 3.33:
    Convolution between input matrix of size 5 x 5 and filter 3 x 3 with 1 layer of
    padding and stride of 1\.    ![](image-r8chv59l.jpg)  Figure 3.34: Convolution
    between input matrix of size 4 x 4 and filter 3 x 3 with 2 layers of padding and
    stride of 1\.    So far, we have fixed the number of strides to 1, i.e. kernels
    shift by 1 unit at a time but what if we want the kernels to shift by more than
    1 unit at a time, 2, 3 or more? Mainly in large size images, we may find that
    value of stride is more than 1\. In Figure an example of convolution with stride
    value of 2 and a padding layer has been shown.    Let’s look at another example
    to understand how to convolve input matrix and filter with stride of 2 and no
    zero padding layer.    We will use input matrix of size 7 x 7 and filter of size
    3 x 3 as shown in Figure    ![](image-cqsw3o0a.jpg)  Figure 3.35: Input matrix
    (left) and kernel (right)    Figure 3.36a represents different positions of filter
    or receptive field during convolution. Let’s assume that blank spaces in the output
    matrix are to be filled with 0\. The arrow represents shift of filter in that
    direction.    ![](image-0m7fysmf.jpg)  Figure 3.36a: Convolution with stride 2   
    ![](image-qd6iy0kb.jpg)  Figure 3.36b: Convolution with stride 2    ![](image-qbao5lr6.jpg) 
    Figure 3.36c: Convolution with stride 2    ![](image-nrq90ijg.jpg)  Figure 3.36d:
    Convolution with stride 2    ![](image-4vme6fe3.jpg)  Figure 3.36e: Convolution
    with stride 2    ![](image-ovj3jqed.jpg)  Figure 3.36f: Convolution with stride
    2    ![](image-fu9q09i5.jpg)  Figure 3.36g: Convolution with stride 2    ![](image-4uwa20ws.jpg) 
    Figure 3.36h: Convolution with stride 2    ![](image-qmth5g9d.jpg)  Figure 3.36i:
    Convolution with stride 2    ![](image-9x2lrd8y.jpg)  Figure 3.36j: Final output
    (right) of the convolution operation between Input matrix (left) and filter (center)   
    We have seen 2 examples for stride \= 2, first in Figure 3.30 with a zero padding
    layer and the in Figure 3.36a with no padding layer. Let’s discuss different cases
    where padding p and stride s can have any arbitrary integer value. We will follow
    the same notations as we used in the previous section.     No padding and for
    any and s and when p \= 0:    O \= – \+ 1    For example, as shown in Figure n
    \= 7, ⨍ \= 3, p \= 0, and s \= 2\. When we put all these parameters in the above
    equation, it gives O \= 3, and that is what we got.    For any and    O \= \+
    – \+ 1    For example, as shown in Figure n \= 5, ⨍ \= 3, p \= 1, and s \= 2\.
    When we put all these parameters in the above equation, it gives O \= 3 which
    is same as shown in Figure    Figure and 3.37c depict the above discussed cases
    one by one.    ![](image-d1mhvgc0.jpg)  Figure 3.37a: (No padding and arbitrary
    strides) Convolution between input matrix of size 5 x 5 and filter 3 x 3 with
