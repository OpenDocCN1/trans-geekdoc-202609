    # Bidirectional RNNs


    Alright, we have discussed common architectures of regular RNNs. Now, we will
    discuss another popular variant of RNNs called Bi-directional RNN. Before diving
    into its architecture and implementation, let’s understand the importance of Bi-direcitonal
    RNNs in practical problems such as text summarization or POS tagging.


    A human brain reads the whole corpus of text before summarizing it. Reading the
    whole corpus makes easy for humans to derive latent intent and eventually helps
    to achieve better summarized results.


    In general, a regular RNN model does not provide this feature to a machine. In
    regular RNNs, machine learns sequentially (word by word) from start to end. But
    like the human brain, it would be more beneficial to a machine when it could know
    the future words as well (learns from end to start). Bi-directional RNNs help
    a machine to achieve this feature.


    Consider these two sequences of words “He said, Teddy bears are on sale” and “He
    said, Teddy Roosevelt was a great president”. Suppose our task is to tag names
    in each sentence. We can quickly identify that “Teddy” is the name of a person
    in the second sequence but not in the first because we can read the complete sentence
    and understand context from the latter part of the sentences. But, unidirectional
    RNNs do not provide this capability to a machine. Bi-directional RNNs help a machine
    to understand the context from the end. Figure 5.5 depicts architectural overview
    of Bi-directional RNN model.


    ![](image-u577ctuz.jpg)

    Figure 5.5: Bi-directional RNN


    Bidirectional RNNs are quite popular, especially in language translation and language
    modeling. As they capture dependency on the sequence from both directions so,
    the hidden layer output at instant is dependent on input from instant `t – 1`
    and instant `t \+ 1`. So, for bidirectional RNNs Vanilla (simple) bidirectional
    network can be written as:


    ![](image-z7rfivsw.jpg)

    and Jordan’s bidirectional network can be written as:


    ![](image-4mqxadgc.jpg)


    # Motivation for RNN


    We have briefly discussed earlier how RNN can be useful. In this section, we will
    see more applications of RNNs. RNNs have shown great success in many natural language
    processing tasks. RNNs have been widely used in various domains which require
    sequential or temporal representation. A growing interest in RNNs has been lately
    observed in the computer vision community for video analytics. In this chapter,
    we will discuss how RNNs have been setting new benchmarks for video analytics.
    In the next section, we will discuss some applications of RNNs in natural language
    processing and video analytics domain. We will discuss the application in video
    analytics in great detail towards the end of this chapter.


    # Language modeling


    Given a sequence of words, we want to predict the probability of each word according
    to the previous words. Let’s understand this with a simple example. Suppose, there
    is a need to fill in the blanks in the sentence the color of the sky is \_\_\_\_.
    A human brain can rapidly respond and say that the color of the sky is It It can
    quickly offer blue as an answer because it knows the context of the question.
    A machine doesn’t have that context. In these types of questions, RNN can use
    previous contexts to find an appropriate word. These problems are classified under
    language modeling.


    An RNN based language model can generate word embedding, a latent space representation
    of the words. A language model allows us to predict the probability (likelihood)
    of grammatically and syntactically correct sentences by observing the sentences
    in the dataset. As each sentence consists of `m` words, the probability of the
    sentence the color of the sky is blue would be the probability of blue given the
    color of the sky and so on. Mathematically, this is:


    ![](image-foczdfc.jpg)

    Figure 5.6 depicts a simple architecture of an RNN based language model for the
    above example.

    ![](image-a1fl529.jpg)

    Figure 5.6: Language modeling


    # Machine translation


    Machine translation is an extension of language modeling in which two sequences
    of words are to be mapped. RNNs model the sequential information, where the input
    sequence from source language is mapped to an intermediate representation, which
    is then used to predict the output word in the target language. As shown in Figure
    the key difference is that the network will start producing output only if it
    sees all the inputs, because the first word of output (translated sentences) may
    require information captured from the complete input.


    ![](image-0ffgg1cf.jpg)

    Figure 5.7: Machine translation


    # Captioning


    Together with convolutional neural networks, RNNs have been used as part of a
    model to generate descriptions for unlabeled images. It’s quite amazing how well
    this seems to work. The combined model even aligns the generated words with features
    found in the images. Since videos are a sequence of images, there has been a widespread
    application of RNN for video captioning. We will discuss the latest model in a
    later section. Figure 5.8a shows the example of image captioning. Figure 5.8(a)
    shows an image of a construction worker:


    ![](image-jlbc80e1.jpg)

    Figure 5.8(a): Construction worker in an orange safety vest is working on a road


    Figure 5.8(b) shows an image where we identify different objects present in this
    image:


    ![](image-ozm4soco.jpg)

    Figure 5.8(b): Identifying different objects in the image


    Figure 5.9 shows the typical architecture for image image captioning:


    ![](image-ss42k6w1.jpg)

    Figure 5.9: A simple architecture of Image captioning

    '
