    # Learning Based on Gradients


    Deep Learning algorithms use optimization techniques, minimization or maximization
    of a function to get the optimum solution. In optimization, we generally minimize
    a function to get a stable global minimum. Even to maximize a function, we prefer
    to minimize the negative of that function which is the same as maximizing the
    original function. The function we want to maximize or minimize may be defined
    as cost function, loss function, or error function (or more generally as objective
    function). In this book, cost function, loss function, or error function will
    be used interchangeably, even though some books have specifically defined some
    of these terms.


    Training of the neural network is quite similar to other machine learning algorithms,
    but the computation of the `gradient` is more difficult in nonlinear networks.
    In this section, we will discuss different types of optimization algorithms. In
    linear models, we use a convex function (for a function to be convex, the line
    connecting two points on the graph of the function must lie above the function)
    as an optimization function. The advantage of the convex function is that it converges
    to a very low value with any initial value of `parameters`, but due to nonlinearity
    in the neural network, the associated cost function becomes non-convex and hence,
    cost function does not converge to a very low value. So, we use iterative and
    gradient-based optimization techniques to converge the cost function to a possible
    low value.


    Stochastic gradient descent is an algorithm that is widely practiced as an optimization
    technique in nonlinear networks, but due to the non-convex nature of the loss
    function, it does not ensure global minimum. We will discuss stochastic gradient
    descent algorithm in detail later.


