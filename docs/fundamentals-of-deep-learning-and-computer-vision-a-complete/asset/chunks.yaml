    \ Similarly, we can get an output at `out = 0.596884378`. Now, we will focus on\
    \ the output and compute output at ![](image-owyqc489.jpg). Similarly, for `out\
    \ = 0.77298465`.\n\nNow, we will calculate the error between the predicted and\
    \ true output using the least square function, which is defined as: ![](image-c8ddo208.jpg).\
    \ Let's calculate the error at each output unit as follows: ![](image-w0c3jq8n.jpg).\
    \ Similarly, we can get error at `0.02356026`. Now, total error, `E = 0.298371109`.\n\
    \nSo far, we have calculated the total error in forward propagation. Our aim is\
    \ to predict the output as close to the true output. To achieve this, we need\
