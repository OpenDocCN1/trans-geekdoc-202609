- raw: "  Learning Based on Gradients    Deep Learning algorithms use optimization\
    \ techniques, minimization or maximization of a function to get the optimum solution.\
    \ In optimization, we generally minimize a function to get a stable global minimum.\
    \ Even to maximize a function, we prefer to minimize the negative of that function\
    \ which is the same as maximizing the original function. The function we want\
    \ to maximize or minimize may be defined as cost function, loss function, or error\
    \ function (or more generally as objective function). In this book, cost function,\
    \ loss function, or error function will be used interchangeably, even though some\
    \ books have specifically defined some of these terms.    Training of the neural\
    \ network is quite similar to other machine learning algorithms, but the computation\
    \ of the gradient is more difficult in nonlinear networks. In this section, we\
    \ will discuss different types of optimization algorithms. In linear models, we\
    \ use a convex function (for a function to be convex, the line connecting two\
    \ points on the graph of the function must lie above the function) as an optimization\
    \ function. The advantage of the convex function is that it converges to a very\
    \ low value with any initial value of parameters, but due to nonlinearity in the\
    \ neural network, the associated cost function becomes non-convex and hence, cost\
    \ function does not converge to a very low value. So, we use iterative and gradient-based\
    \ optimization techniques to converge the cost function to a possible low value.\
    \    Stochastic gradient descent is an algorithm that is widely practiced as an\
    \ optimization technique in nonlinear networks, but due to the non-convex nature\
    \ of the loss function, it does not ensure global minimum. We will discuss stochastic\
    \ gradient descent algorithm in detail later.  \n\n  Cost/Loss Functions    In\
    \ this section, we will discuss the common types of loss functions that are used\
    \ to estimate the parameters of the universal approximation function that maps\
    \ input X to output Y and eventually quantifies the performance of the approximated\
    \ model. To get the best approximated model, we estimate the model’s parameters\
    \ such that the loss is minimum.    Maximum likelihood algorithm is the most widely\
    \ practiced algorithm for parameters estimation.    First, we will discuss the\
    \ maximum likelihood principle. Let’s take m sample points from any probability\
    \ distribution where X \\= ….., Next, let’s define our model as such that it determines\
    \ the probability that x\\_i (where i ∈ 1, 2… m}) belongs to distribution P(X)\
    \ having parameters w and Now, we can define the maximum likelihood estimator\
    \ for θ (as mentioned earlier in the chapter, θ is used as a condensed form of\
    \ parameters w and as:    ![](image-69xl3370.jpg)  With the help of equation (7),\
    \ the parameter values, – w and b are estimated such that probability of belonging\
    \ to the distribution P(X) is maximum.    We can see that is a product of multiple\
    \ probabilities, which led to an error in the numerical precision. To avoid any\
    \ numerical precision error, we generally prefer to take the logarithm of , which\
    \ changes the product of probability density to the sum of probability density,\
    \ and hence becomes more convenient to work on. Logarithm is an increasing function\
    \ so it will not change the maximum point of the original function. After taking\
    \ a log of , we can write as:    ![](image-bpoq2yd1.jpg)  Scaling of function\
