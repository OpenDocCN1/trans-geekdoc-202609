    loop  for epoch in range(num\_epochs):  epoch\_cost \= 0\.  num\_minibatches \=
    int(m / minibatch\_size)  for i in range(num\_minibatches):  \# Get next batch
    of training data and labels  minibatch\_X, minibatch\_Y \= train.next\_batch(minibatch\_size)  \#
    Execute optimizer and cost function  \_, minibatch\_cost \= sess.run(\[optimizer,
    cost\], feed\_dict={X: minibatch\_X.T, Y: minibatch\_Y.T})  \# Update epoch cost  epoch\_cost
    += minibatch\_cost / num\_minibatches  \# Print the cost every epoch  if print\_cost
    \== True:  print("Cost after epoch {epoch\_num}: {cost}".format(epoch\_num=epoch,
    cost=epoch\_cost))  costs.append(epoch\_cost)  \# Plot costs  plt.Figure(Figuresize=(16,5))  plt.plot(np.squeeze(costs),
