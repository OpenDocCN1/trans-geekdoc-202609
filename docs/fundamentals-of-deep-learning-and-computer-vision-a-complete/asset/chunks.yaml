- raw: "  Application of RNNs in Image and Video Analytics    Automatically generating\
    \ a description of an image, a problem known as image captioning, has recently\
    \ received a lot of attention in Computer Vision. Image captioning is important\
    \ for many reasons. For example, they can be used for Content-Based Image Retrieval\
    \ (CBIR) and therefore, it can be applied to many areas, including biomedicine,\
    \ commerce, the military, education, digital libraries, web searching and many\
    \ more. The descriptions can include where we are (e.g., street, playground),\
    \ what we wear and importantly what we are doing there. Generating a meaningful\
    \ natural language description of an image requires a level of image understanding\
    \ that goes well beyond image classification and object detection. Mapping from\
    \ the image space to the semantic space is the key challenge. Mapping the space\
    \ between images and language, in our estimation, may resonate with some deeper\
    \ vein of progress. Earlier, this was a difficult task; though images can be easily\
    \ represented as Real vectors, there was no suitable way to capture the semantic\
    \ and syntactic information of the text in a real vector. But with LSTM based\
    \ language modeling, text can now be represented easily in a concise feature representation,\
    \ which captures both the semantic and syntactic substrate. From such language\
    \ models, each word can be mapped to a numeric vector representation.    CNNs\
    \ have been widely used for image representation. The image classification model\
    \ using CNNs have been widely studied, and it has been found that the intermediate\
    \ output of the convolutional layers in such architecture is a feature representation\
    \ of the image with superior discriminatory power, especially related to the supervisory\
    \ signal that it has been exposed to.    The video caption generation or generating\
    \ a textual summary for a video boils down to the task of generating the caption\
    \ for individual frames or frames within the same temporal context. Since video\
    \ frames are nothing but images, image captioning framework can start as a starting\
    \ point for such a problem.    The fundamental idea is to map from the image space\
    \ to text space. So, given an image the feature vector is extracted using a CNN,\
    \ which is passed down to the RNN. Each I is associated with a sequence of words,\
    \ i.e. caption, X \\= …., where T is the length of the caption sequence. So, the\
    \ basic problem of caption generation is finding the probability of word sequence\
    \ given    ![](image-7mm9yvwj.jpg)  All the words are embedded in a fixed size\
    \ embedding matrix of size . This word embedding matrix is learned by the RNN.\
    \ Probability | is given by a where (hidden state) can be defined as:    ![](image-0xycutvi.jpg) \
    \ where S is a nonlinear function.    ![](image-zs32frvy.jpg)  Figure 5.24: Architecture\
    \ for image captioning    As shown in Figure generally a pretrained convolutional\
    \ neural network (may not be pretrained) extracts the features from our input\
    \ image, then the feature vector is linearly transformed to match the input dimension\
    \ of the LSTM network. Finally, the combined network is mimics as a language model\
    \ with features vector as input.  \n\n  Object recognition and captioning in video\
    \    In the field of computer vision, recognition and description of images and\
    \ videos is a fundamental challenge. The object recognition task is more complicated\
    \ in videos than in images, as different frames can refer to different objects,\
    \ making detection more challenging. Ideally, a video model should allow processing\
    \ of variable length input sequences, and also provide for variable length outputs,\
    \ including generation of full length sentence descriptions that go beyond conventional\
    \ one-versus-all prediction tasks. Networks that can play this role is called\
    \ Long-Term Recurrent Convolutional Networks (LRCNs), a class of architectures\
    \ for visual recognition and description which combines convolutional layers and\
    \ long-range temporal recursion. Figure 5.25 shows the architecture of LRCNs.\
    \    ![](image-9j2lomcs.jpg)  Figure 5.25: Long-Term Recurrent Convolutional Networks\
    \ (LRCNs)    In Figure 5.25 CNN (middle-left) extracts features from a variable-length\
    \ visual input (left), those features are fed into a stack of LSTMs networks(middle-right),\
    \ which finally produce a variable-length prediction (right). Both the CNN and\
    \ LSTM weights are shared across time, resulting in a representation that scales\
    \ to arbitrarily long sequences.    All frames with a length T sequence are input\
    \ to one convolutional network. Therefore, ConvNet weights are applied for the\
    \ entire time of the sequence. LRCN learns to predict the video activity class\
    \ at every time step, and generates one label for the entire video clip by averaging\
    \ each label probability.    ![](image-0jqowq7t.jpg)  Figure 5.26: Three variants\
    \ of the LRCN image captioning architecture  \n\n  Video description    In the\
    \ video description the LSTM framework allows us to model the video as a variable\
    \ length input stream. However, due to the limitations of available video description\
    \ datasets, the LSTM input was generated using traditional activity and video\
    \ processing methods, called Conditional Random Fields (CRF) activity recognition.\
    \    Figure 5.27 explores a joint object recognition and captioning framework\
    \ using LSTM and CRF framework. For each architecture, we assume we have predictions\
    \ of activity, tools, objects, and locations present in the video from a CRF based\
    \ on the full video input. In this way, we observe the video as a whole at each\
    \ time step, not incrementally frame by frame.    ![](image-ux9h1w15.jpg)  Figure\
    \ 5.27: Video description    Each frame from the sampled pool of frames from the\
    \ video and the CRF score for the objects are encoded by the LSTM. Basically,\
    \ the Maximum Apriori Posteriori (MAP) estimates of the CRF is used to extract\
    \ the video features.The LSTM decoder layer then tries to build the captioning\
    \ from it.    In figure LSTM is used as a decoder and encoder, and CRF-max method\
    \ is used to generate one-hot vector.    In figure LSTM is used as a decoder and\
    \ full visual input representation is provided at each time step to the LSTM,\
    \ like image captioning.    In figure again LSTM is used as a decoder but the\
    \ probability is used as the input of LSTM not one-hot vector which helps LSTM\
    \ to learn uncertainties.    For more detail, please refer to this paper: Long-term\
    \ Recurrent Convolutional Networks for Visual Recognition and Description by Jeff\
    \ Donahue et al.  "
