    # Graph


    At the core level, TensorFlow uses directed graph, a form of dataflow graph/computational
    graph to implement its algorithms and execute its operations. Dataflow graph and
    computational graph will be used in this book interchangeably. This form of structure
    is suitable for deep learning model which requires chained derivatives. Dataflow
    graph helps to implement complex computation into simpler one, by splitting up
    in nodes. Figure 1.3 represents a trivial example.


    ![](image-540zx76h.jpg)

    ### Figure 1.3

    Above example shows the basic addition using graph. Node is represented as a circle.
    Each node defines single operation or mathematical functions. In this example,
    it takes 2 inputs `X` and `Y` as represented by arrows. When these inputs pass
    through the node which performs an addition operation, it returns output `X +
    Y`. Further, this output can be used as input for another node or it can be the
    final output.


    Nodes and edges are elementary blocks of a graph. Usually, nodes are represented
    by circle or box and arrows represents edges. Mathematical operations are implemented
    at nodes and its value is carried out by edges to other nodes hence in this way
    edges works as a linker between nodes.


    Figure 1.4 shows bit complex and interesting example:


    ![](image-qfe2ejk6.jpg)

    ### Figure 1.4

    As dataflow graph uses a directed graph, the direction of computation is shown
    by the arrow. Let’s understand each operation of the graph step by step:


    - At left, we can see two circles `a` and `b` represents two inputs, `input1`
    and `input2`. These inputs can be from other graph or it can be primary inputs.

    - These two circles pass its corresponding values to the boxes (nodes), `node
    c` and `node d` for further computation. `node c` perform addition operation and
    `node d` execute multiplication.

    - `node c` takes two values `6` and `4` as inputs and after multiplying these
    values it gives `24` as an output result. Alongside, `node d` also takes two values
    `6` and `4` perform addition operation and it gives `10` as an output result.

    - Finally, `node e` takes the output of `node c` and `node d` as inputs and perform
    addition operation and gives `34` as an output result. Output of `node e` can
    be final output, or it could be input for next nodes.


    Let’s see the mathematical interpretations of the computational graph. Here, nodes
    are represented by `a`, `b`, `c`, and `d`:

    - `a = input 1`

    - `b = input 2`

    - `c = a + b`; `d = a * b`

    - And finally, `e = c + d`


    Let’s put the value of `input 1` and `input 2` be `6` and `4`. So, `a = 6` and
    `b = 4`.

    Now, `c = a + b = 6 + 4 = 10`; `d = a * b = 6 * 4 = 24`.

    Finally, `e = c + d = 10 + 24 = 34`.


    Let’s discuss why this nodal approach has been practiced. In this approach, input
    values can be exploited by various mathematical operations, and hence it can be
    used by a large number of nodes in the next layers. Otherwise, each node would
    be isolated.


