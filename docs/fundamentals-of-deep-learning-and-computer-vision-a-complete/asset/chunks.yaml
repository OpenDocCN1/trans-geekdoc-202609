- raw: "  Why RNN?    RNN exploits one of the early and important ideas of statistical\
    \ learning, called parameter sharing across different parts of a model. Parameter\
    \ sharing enables a model to generalize on the varying length of input sequence\
    \ that is not seen during training. Let’s understand the importance of parameter\
    \ sharing with these two sentences, It was raining in the morning and In the morning,\
    \ it was raining. When we feed these two lines in a model and look for weather\
    \ conditions in the morning, we expect raining as an answer, irrespective of the\
    \ position of the word raining in both sentences.    Now, if we pass these sentences\
    \ as inputs to a fully connected neural network, the network will have separate\
    \ parameters for each of the sentences. So, a fully connected neural network needs\
    \ to learn all the rules of a language separately at each position in the sentence,\
    \ resulting in a large complex model with huge number of parameters. On the other\
    \ hand, due to the parameter sharing property, RNN shares the same weights across\
    \ several time steps, resulting in a less complex model and a lesser number of\
    \ parameters. Also, a fully connected feedforward network maps only input to output\
    \ vectors, whereas an RNN maps the entire history of previous inputs to each output.\
    \    We can understand the above statements more using Figure Suppose we have\
    \ a sequential input in the form of Input1, Input2, and Input3, and our objective\
    \ is to establish a relationship among these sequential inputs. Figure 5.3(a)\
    \ depicts a feedforward network in which the input layer receives all the inputs\
    \ at once and passes it to the next hidden layer followed by an activation layer,\
    \ until it reaches the output layer. Each hidden layer has its own weights and\
    \ biases; hence, each layer behaves independently.    ![](image-cx15zxyw.jpg) \
    \ Figure 5.3(a): Feedforward network    But our objective is to establish relationships\
    \ among sequential inputs. How can we achieve that? To start with, we can provide\
    \ inputs at hidden layers also, as shown in Figure But, still each hidden layer\
    \ has its own weights and biases, and due to this, they behave independently and\
    \ hence each hidden layer creates different rules for each of its input.    ![](image-9aybrrl9.jpg) \
