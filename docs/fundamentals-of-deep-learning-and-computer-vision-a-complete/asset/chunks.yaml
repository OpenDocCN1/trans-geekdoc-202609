    /job:local/task:1\"):\n  y2 = x - 66\nwith tf.device(\"/job:local/task:0\"):\n\
    \  y1 = x + 300\ny = y1 + y2\nwith tf.Session(\"grpc://localhost:2222\") as sess:\n\
