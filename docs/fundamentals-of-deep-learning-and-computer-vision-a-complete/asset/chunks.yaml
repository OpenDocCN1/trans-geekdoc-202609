    # Conclusion


    In this chapter, we covered a lot of state-of-the-art techniques and architectures.
    As an extension of the basic `CNN` architecture covered in the last chapter, we
    started with understanding classic CNN architectures like `AlexNet`, `VGGNet`,
    `Inception`, and `ResNet`, along with the different design techniques applied
    in each of them. We also discussed the general object detection framework, and
    how object detection is different from image classification. We understood different
    architectures, such as `R-CNN`, `Fast R-CNN`, `Faster R-CNN`, `SSD`, and `YOLOv3`,
    and how `SSD` and `YOLOv3` are better than the previous ones. In the next and
    the last chapter, we will learn about sequential networks and their different
    applications in real world problems.


    # CHAPTER 5: Sequential Models


    According to some, there’s nothing new beneath the sun. That seems dubious, but
    it is true that every seemingly new thing experienced is, in fact, the product
    of vast and unseen contexts. For example, humans don’t start to think from scratch
    every time new information appears. When, say, reading a book, understanding is
    built upon previous knowledge, either in a macro sense, such as understanding
    the language the words are written in or the tropes of gender, or in the micro
    sense, the context provided by earlier pages in the book being read. One name
    for these is sequential contexts. Even if thoughts seem novel, their novelty is
    born from a string of previous thoughts.


    ## Structure

    `RNN`, `GRU`, `LSTM`, `Image captioning`


    ## Objective


    After reading this chapter, we will learn how to get a semantic description of
    an image using deep recurrent networks and its interesting real-life applications.


    ## RNN


    Traditionally, whenever something was requested from a machine like a computer,
    it started anew each time. For example, when using a calculator, each new sum
    is a surprise to the machine; it has no memory of the previous mathematical habits
    of its users. This isn’t just a problem in simple machines like computers. There
    is a lack of sequential contexts in traditional neural networks, and this is a
    significant drawback, for example, when describing the kind of scenario that is
    happening at every point in a video or the subsequent scene in a video. How then
    to approach these types of problems? Traditional neural networks take all input
    at the same instant; hence, they don’t get any sequential data as an input. Due
    to the lack of structured input sequence, it becomes difficult to find the pattern
    in data and hence, impossible to predict what may come next, for example, prediction
    of a new frame using previous frames. It remains unclear for researchers to find
    how a traditional neural network can be used for sequential data.


    Instead of trudging along with traditional neural networking, researchers shifted
    their focus and proposed a new algorithm called Recurrent Neural commonly known
    as `RNN`. An `RNN` is a class of artificial neural networks, which models data
    that has sequential property. As convolutional network is specialized for processing
    a grid of values such as an image, `RNN` is designed to recognize patterns in
    sequences of data, such as text, genomes, time series data from sensors, stock
    markets, and government agencies. It forms a directed graph, where a connection
    between two nodes can be across time instances.


    If `…` are the data instances, where `xi` is the feature of the instance and `yi`
    is the corresponding label, then mathematically, an `RNN` model can be defined
    as:


    ![](image-v4wxclks.jpg)


    where `z` is `x2`, …, `xi − 1`.


    As evident from equation 5.1, `RNN` uses data from previous instances to return
    the output of data at current instances. Thus, `RNN` can be used for representing
    temporal or sequential information. `RNN` uses loops in the network which helps
    to persist information.


    ![](image-cgvnrgpw.jpg)

    Figure 5.1: Simple RNN with loops


    Figure 5.1 represents a small building block of an `RNN`. As seen in the figure,
    it takes any input `xt` and outputs a value `ht`. The above diagram also contains
    a loop; loops help to pass information in the network from one time-step to the
    next. For example, when reading a sentence, the first word is encountered, and
    then the second, the third and so on. Each word in a sentence represents a time-step.
    Comprehending the meaning of a sentence relies on following the entire sentence
    from the first word to the last and then understanding a relationship between
    them. Similarly, for machines, loops help to pass the information from previous
    time steps to the next time steps.


    Figure 5.2 represents an unrolled diagram of an `RNN` in a chain like structure
    which shows that `RNN` can be used in sequence-like data.


    ![](image-zkrwt9x1.jpg)

    Figure 5.2: An unrolled RNN


    Now, each input, at different time instants can be shown. Each small block represented
    by `A` resembles a simple neuron. Hence, an `RNN` can be described as a collection
    of similar networks connected with each other at different time-steps, passing
    information to the next block.


    In the last few years, `RNNs` have shown incredible improvements in the field
    of speech recognition, time series forecasting, image captioning, sequence classification,
    language translation, and many others.

    '
  trans: '


    # 结论


    在本章中，我们涵盖了许多先进的技术和架构。作为上一章涵盖的基础 `CNN` 架构的扩展，我们从理解经典的 CNN 架构开始，如 `AlexNet`、`VGGNet`、`Inception`
    和 `ResNet`，以及应用于这些模型的不同设计技术。我们还讨论了通用的目标检测框架，以及目标检测与图像分类的区别。我们理解了不同的架构，如 `R-CNN`、`Fast
    R-CNN`、`Faster R-CNN`、`SSD` 和 `YOLOv3`，以及 `SSD` 和 `YOLOv3` 如何优于之前的模型。在下一也是最后一章中，我们将学习序列网络及其在现实世界问题中的不同应用。


    # 第 5 章：序列模型


    某些人认为，日落无新事。这听起来似乎令人怀疑，但事实确实是，经历的每一个看似新奇实际上都是大量且不可见的背景的产物。例如，人类每当新信息出现时，并不是从零开始思考的。比如在读书时，理解是建立在之前的知识之上的，这可能体现在宏观层面（例如理解单词所属的语言或性别刻板印象），也可能体现在微观层面（所读书籍前几页提供的上下文）。这些被称为序列上下文。即使想法看起来很新颖，其新颖性也源于一系列之前的思想。


    ## 结构

    `RNN`, `GRU`, `LSTM`, `Image captioning`


    ## 目标


    在读完本章后，我们将学习如何使用深度循环网络获取图像的语义描述及其在现实生活中的有趣应用。


    ## RNN


    传统上，每当向计算机等机器提出请求时，它每次都会重新开始。例如，使用计算器时，每一个新的加和对机器来说都是意外；它没有对用户之前数学习惯的记忆。这不仅仅是计算机等简单机器中存在的问题。传统神经网络缺乏序列上下文，这是一个巨大的缺点，例如在描述视频中每一点正在发生的场景或视频的后续场景时。那么，如何处理这类问题呢？传统神经网络在同一瞬间刻接收所有输入；因此，它们不会获得序列数据作为输入。由于缺乏结构化的输入序列，很难在数据中找到模式，因此无法预测接下来可能发生什么，例如使用之前的帧预测新帧。对于研究人员来说，如何将传统神经网络用于序列数据仍然不清楚。


    研究人员并没有沿着传统的神经网络步履维艰，而是转移了焦点，提出了一种名为循环神经网络（通常称为 `RNN`）的新算法。`RNN` 是人工神经网络的一类，用于建模具有序列属性的数据。由于卷积网络专门用于处理图像等网格值，`RNN`
    设计用于识别数据序列中的模式，例如文本、基因组、来自传感器的时间序列数据、股票市场和政府机构。它形成了一个有向图，其中节点之间的连接可以跨越时间实例。


    如果 `…` 是数据实例，其中 `xi` 是实例的特征，`yi` 是相应的标签，那么从数学上讲，一个 `RNN` 模型可以定义为：


    ![](img/image-v4wxclks.jpg)


    其中 `z` 是 `x2`, …, `xi − 1`。


    从公式 5.1 可以看出，`RNN` 使用来自之前实例的数据来返回当前实例数据的输出。因此，`RNN` 可用于表示时间或序列信息。`RNN` 在网络中使用循环，有助于持久信息。


    ![](img/image-cgvnrgpw.jpg)

    图 5.1：带有循环的简单 RNN


    图 5.1 代表了 `RNN` 的一个小型构建模块。如图所示，它接收任何输入 `xt` 并输出一个值 `ht`。上面的图还包含一个循环；循环有助于将信息从网络中的一个时间步传递到下一个步骤。例如，在阅读句子时，遇到第一个词，然后是第二个、第三个以此此类推。句子中的每个单词代表一个时间步。理解句子的意义依赖于从第一个单词到最后一个单词跟随句子，然后理解它们之间的关系。同样，对于机器来说，循环有助于将信息从之前的时间步传递到下一个时间步。


    图 5.2 代表了链式结构中 `RNN` 的展开图，显示 `RNN` 可用于类序列数据。


    ![](img/image-zkrwt9x1.jpg)

    图 5.2：展开的 RNN


    现在，可以显示不同时间时刻的每个输入。每个由 `A` 表示的小块类似于一个简单的神经元。因此，`RNN` 可以被描述为一组在不同时间步上相互连接的相似网络集合，并将信息传递给下一个块。


    在过去的几年里，`RNNs` 在语音识别、时间序列预测、图像描述、序列分类、语言翻译以及许多其他领域取得了惊人的进步。


    '
