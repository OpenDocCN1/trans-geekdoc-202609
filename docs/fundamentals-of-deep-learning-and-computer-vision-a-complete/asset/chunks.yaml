    # TensorFlow operation


    We have used some TensorFlow operations to understand dataflow graph. Let’s familiarize
    with some fundamental mathematical operations in TensorFlow.


    ```python

    import tensorflow as tf

    import numpy as np

    a = np.array([6, 2])

    b = np.array([1, 4])

    c = tf.multiply(a, b)

    sess = tf.Session()

    sess.run(c)

    ```


    In this example, we are using `tf.multiply()` operation. When we run this code,
    we will get the NumPy array as an output, `array([ 8, ...`. We can also provide
    data type of input like `a = np.array([6, 2], dtype=np.int32)` or we can use float
    data type, and hence we will get output mentioning data type also. So, what’s
    new in this example? In this example, we have initialized the tensor manually
    using NumPy. This shows the compatibility between NumPy and TensorFlow.


    Why did we use NumPy to initialize tensor object? Okay, TensorFlow has multiple
    data type options like `float32`, `int32` and others but still in some cases like
    for complex number, it is a bit more difficult to initialize it using TensorFlow
    and so NumPy makes our work easier. This also shows that data types in TensorFlow
    is highly related or simply we can say based on data types of NumPy. We can validate
    this argument by writing this line `tf.int64 == np.int64` in a terminal and we
    will get the output `True`. We can use NumPy array also as an input for TensorFlow.


    ## Shape of tensor object


    Tensor is defined as array having the same data type. It means to define a tensor
    object; we need a value of each dimension and data type. The shape describes both
    the number dimensions and length of each dimension. Tensor can either be list,
    tuples or ND matrix.


    Let’s understand a tensor:


    ```python

    import tensorflow as tf

    tensor_object = tf.constant(1, shape=[2, 3])

    print(tensor_object)

    ```


    On execution it will return `Tensor("Const:0", shape=(2, 3),` an output. This
    tells us that node number `Const: 0` and its value, shape of `tensor_object` is
    `[2, 3]` and data type is `int32`. In TensorFlow, tensor can be categorized in
    two shapes, static and dynamic.


    ### Static shape


    Static shape is defined as a shape which is determined while initializing a tensor
    object or shape which is inferred by TensorFlow when new tensor object is obtained
    after certain operations. It is generally list or tuple. TensorFlow tries to infer
    the shape of `z` tensor object during operations but it becomes difficult when
    placeholder is used with unknown dimension (dynamic sizing).


    ### Dynamic shape


    We can say that dynamic shape is a shape which is determined during runtime. Let’s
    understand with an example:


    ```python

    import tensorflow as tf

    var1 = tf.placeholder(tf.float32, shape=[6])

    print(var1.get_shape())

    ```


    Upon execution, this will return `(6,)` as an output. This is the static shape
    and output denoted the length of a vector. Now, let’s use `var1` in other operation.


    ```python

    var2, idx = tf.unique(var1)

    print(var2.get_shape())

    ```


    It return `(None,)` as an output. It means length of vector `var2` is unknown.
    Since `var1` is unknown and `var2` is dependent on hence the length of `var2`
    is unknown. Let’s feed placeholder.


    ```python

    sess = tf.Session()

    print(sess.run(var2, feed_dict={var1: [4, 6, 7, 2, 3, 9]}).shape)

    print(sess.run(var2, feed_dict={var1: [1, 1, 2, 2, 3, 1]}).shape)

    ```


    It will return `(6,)` and `(3,)` as an output. We can see that depending on dimension
    of var2 is changed. This shows that tensor can have static and dynamic shape.


    ```python

    var3 = tf.shape(var2)

    print(sess.run(var3, feed_dict={var1: [4, 6, 7, 2, 3, 9]}))

    ```


    It returns `[6]` and `[3]` as an output. So, `tf.Tensor.get_shape()` is used to
    get static shape and `tf.shape()` is used to get dynamic shape. We can say that
    dynamic shape is also tensor which defines the shape of original tensor.


    ## Session in TensorFlow


    Session can be defined as an object which controls the environment (computational
    graph) for the execution of mathematical operations and evaluation of Tensor values.
    We can also understand it as a technique that places computational graph onto
    different machines like CPUs or GPUs and provides a procedure to execute them.
    It helps to store the current value of variables.


    We start a session mainly in two ways:


    1. `sess = tf.Session()`, `sess.run()`, `sess.close()`

    2. `with tf.Session() as sess: sess.run()`


    Session uses resources while executing graph. It is important to release that
    resource if they are not required. If we are using the first method, then we must
    close the session explicitly. Second method act as a context manager, so session
    gets closed after exiting with statement. There is another method called Interactive
    session, which make itself as default Session and hence useful in debugging or
    while writing in IPython. Above mentioned methods are broadly in use. Following
    is the example of Interactive session:


    ```python

    import tensorflow as tf

    sess = tf.InteractiveSession()

    a = tf.constant(5.0)

    b = tf.constant(6.0)

    c = a * b

    # We can just use ‘c.eval()'' without passing ‘sess’

    print(c.eval())

    sess.close()

    ```


    The only difference between session and an interactive session is that interactive
    session makes itself the default session so that we can call `run()` or `eval()`
    without explicitly calling the session.

