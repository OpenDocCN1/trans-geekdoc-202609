    # Video Classification


    In today’s digital content video, in particular, has become a new way of communication
    between Internet users. Due to the pervasiveness of Internet, video data has been
    generated, published, and spread explosively. This has encouraged the development
    of advanced techniques for a broad range of video understanding applications including
    online advertising, video retrieval, video surveillance, etc. The sheer volume
    of video data has motivated approaches to automatically categorizing video content
    according to classes such as human activities and complex events.


    We know that a video is a sequence of images. `CNN` algorithms are widely used
    in problems related to image and video processing. While discussing `CNNs`, we
    learned how `CNN` extracts latent features from images and how it can be useful.
    `RNNs` allow us to understand the context of a video frame, relative to the frames
    that came in sequence. Combination `CNN - RNN` architecture has shown good results
    in video classification problems. The video classification framework is a broad
    class of video analytics problem, which includes motion tracking, action recognition,
    and video type detection.


    Video classification explores the application of `LSTM` beyond the prediction
    of short snippets related to video or video captioning. It explores the application
    of stacked `CNN` and `LSTM` for video classification. Given a set of videos `V
    = … vn` and label `Yv = …` the video classification problem tries to implement
    the `CNN-LSTM` stacked network to learn what type of frames distinguish one class
    from another. Here the `LSTM`, unlike the captioning problem, doesn’t learn the
    distribution over words; instead, it tries to learn the context of the video frame
    by frame. Alternatively, this is a problem of video understanding; as the previous
    `CNN` layer helps in image processing and feature generation.


    Figure 5.28 depicts a two stream `CNN-LSTM` network for video classification.
    Specifically, the spatial and the short-term motion features are extracted separately
    by two `Convolutional Neural Networks`. The two streams have different functionality.
    One stream has the raw image as input. It captures the spatial features which
    is essential for object detection or recognizing the action in the video frames.
    Action detection is a difficult problem than object detection because, in action
    recognition, a lot of frames need to be summarized to form the action. This is
    where the second stream helps. The second stream has motion feature detection
    using `Shift-CNN` framework. The input are the shift features in the frame, and
    the `CNN` further tracks the object through the shift vector. Finally, `LSTM`
    networks are applied on top of the two features to further model longer-term temporal
    clues.


    ![](image-cgjbimgt.jpg) Figure 5.28: Video classification


    Figure 5.28 depicts that for an input video, two types of features are extracted
    using the `CNN` from spatial frames and stacked motion optical flows respectively.
    The features are separately fed into two sets of `LSTM` networks for long term
    temporal modeling (Left and Right). In addition, we also employ a regularized
    feature fusion network to perform video-level feature fusion and classification
    (Middle). The outputs of the sequence-based `LSTM` and the video-level feature
    fusion network are combined to generate the final prediction.


    ## Conclusion


    In this chapter, we have explored the sequential models (`RNNs/LSTMs`). We have
    discussed why we need `RNNs`, its advantages over other algorithms, such as feedforward
    networks, and `CNNs` and its application. We have also looked into better versions
    of `RNNs`, such as `GRU` and `LSTMs`. In the end, we have also discussed how a
    combined architecture of `CNN` and `RNN` can be useful in problems related to
    images and videos. `RNNs` have been an active research area, it has shown remarkable
    results lately (most of all are using `LSTMs`).


