    # 神经网络简介


    在继续进行之前，让我们观察下面的图，并尝试识别一下它是关于什么的：


    ![](img/image-pa00lh7g.jpg)

    图 2.1：示例图像


    从图中，我们应该能够认出这是一只长颈鹿，尽管它看起来异常肥胖。尽管这些特征呈现的形式与我们生活中以前见过的不同，但我们的大脑能够迅速识别出这些特征和物体。


    ## 我们是如何做到的？


    当我们接触任何物体时，我们都能感觉到它。这是因为有连接到大脑的传感器。人体所有的传感器都充当数据收集器的角色，收集数据并将其传递给大脑进行进一步处理。根据这些信息，大脑做出最终决定，并将相关的指令或信息发送到相应的身体部位。


    神经网络的灵感源于人类大脑及其内部机制。在深入研究之前，我们将先看看人类大脑的工作原理以及它在人工神经网络中的对应关系。要深入地理解大脑的工作原理非常困难，但我们可以获得一个快速的总体概述。人脑由大约
    1000 亿个被称为神经元的神经细胞组成。每个神经元都可以与大型网络中发现的数千个其他神经元相关联。神经元以电化学信号的形式与其他神经元通信。我们所有的每感觉、思想和情感都源于数百万个被称为神经元的小神经细胞。如果没有这些神经元在我们身体范围内工作并传递信息，我们将无法感知或做任何事情——就像数学课上普通的一天一样。


    现在我们已经对大脑的工作原理有了初步概念，我们将开始讨论人工神经网络。


    ## 人工神经网络


    典型的神经网络由许多被称为“单元”的人工神经元组成，这些单元排列在系列层中。一个典型的人工神经网络由不同的层组成，如图：


    ![](img/image-njw5de4f.jpg)

    图 2.2：人工神经网络示例


    - **输入层**：输入层包含接收来自外部世界输入的单元（人工神经元），网络将对这些输入进行学习、识别或其他其他处理。

    - **输出层**：输出层包含对其如何学习某项任务的信息做出响应的单元。

    - **隐藏层**：隐藏层是输入层和输出层之间的单元。隐藏层的作用是将输入转换为输出单元可以某种方式使用的内容。


    我们可以通过不同的方式连接节点并改变数据流方向来创建不同类型的神经网络。每种类型的神经网络都有不同的复杂程度和应用用例。在书中，我们将介绍前馈神经网络及其变体。


    '
