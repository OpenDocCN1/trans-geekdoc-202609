    # Convolution Operation


    In general, convolution is an operation on two functions to produce the third
    function that is typically assumed as a modified version of one of the original
    functions. Let’s try to understand convolution with an example.


    Suppose, we are tracking the position of an object with radar sensor and our sensor
    provides the position of the object as an output, where is a function of time.
    Both variables `x` and `t` are real values; so, we may get a different reading
    from the sensor at any time instant. Let’s assume that the sensor produces noisy
    output. Due to noise in the output, we will get distorted results.


    To reduce the distortion, we will compute the mean of several measurements but
    we may not get an accurate result because we are giving equal weights to the variance
    of each measurement. To reduce the error, we use weighted average in which we
    give more weight to the recent terms. We can also think of it as a system in which
    data points are of varying quality, so the variance of random error will not be
    constant for all data and hence to reduce error, we can provide weights inversely
    proportional to the variance of data.


    To implement this technique, we can use a weight function say, `w(a)` where `a`
    denotes the time period. We can assume `w` as a probability function to get a
    weighted average otherwise output will not be a weighted average. Using this technique,
    we get a new smooth function which estimates the position of the object more accurately.
    Mathematically, we can write this as:


    ![](image-tijyighu.jpg)


    The operation mentioned above is known as the convolution operation. In literature,
    convolution operation is generally represented using an asterisk, `*` as `* \=
    *`.


    ## Discrete Convolution


    Let’s take another example to understand convolution operation. In this example,
    we will see more of a practical convolution problem, i.e. discrete convolution.
    The above example can be used to understand discrete convolution but we will see
    another example.


    Let’s say a tuition teacher decides to take private teaching classes on a course.
    On the first day, a beginner receives a 1-hour lecture to explore and understand
    a course. From the next day onwards, the duration of lecture changes from 1 hour
    to 3 hours for the same student. Now, if we plot this relation between days and
    number of hours, we will get the graph as shown in Figure 3.1.


    ![](image-kcjzctgw.jpg)

    Figure 3.1: Number of hours is changing with each day for one student.


    Suppose, on the first day 2 students join the private tuition. On the second day,
    4 new students, and on the third day, it reaches 6.


    ![](image-2l4ba3pf.jpg)

    Figure 3.2: Number of new students joined at each day


    Figure 3.2 shows the number of new students joined each day. Okay, let’s calculate
    the number of teaching hours on each day. On the first day, there are 2 students
    so the total number of hours will be `2 * 1 = 2`. If we use to denote the total
    number of hours where `d` represents the day, then `\= 2`. The first day is represented
    using number 0 for mathematical convenience.


    Now, on the second day, there are already 2 students from the first day and each
    student will get 3 hours each and 4 new students who joined on the second day.
    On the third day, there are 6 students from the previous day and each student
    will get 3 hours each and 0 new students who joined on the third day.


    Mathematically, we can write this as:

    `2 * 1 = 2`

    `2 * 3 + 4 * 1 = 10`

    `6 * 3 + 0 * 1 = 18`


    The operation mentioned above is known as the convolution operation. In literature,
    convolution operation is generally represented using an asterisk, `*` as `* \=
    *`.


