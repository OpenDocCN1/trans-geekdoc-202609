    # 使用线性模型实现 XOR 函数


    我们将使用单层感知机（线性分类器）来证明 XOR 函数无法通过线性模型实现。


    ![](img/image-1895fofr.jpg) 图 2.6


    让我们定义两个二分类变量，它们的值可以取 1 或 0。XOR 函数在这些变量上执行操作。当 `x1` 和 `x2` 的值相同时，XOR 函数返回 0 作为输出，否则返回
    1。


    我们可以看到，在输入输入值后，XOR 函数会返回某些输出。因此，存在一个通用的 XOR 函数来映射输入和输出。让我们定义这个函数为 `f(x)`。我们可以写成
    `y = f(x)`。现在，让我们将模型定义为 `g(x)`。我们的目标是找到或学习一个由参数 `θ` 构造的通用近似函数 `f''(x)`，使其产生相似的结果。换句话说，我们的目标是学习一个模型，以尽可能地减少
    `y` 和 `f''(x)` 之间的误差。


    让我们看看线性模型的结果。我们的输入点为 `X = [(0, 0), (1, 0), (0, 1), (1, 1)]`，期望输出为 `y = [0, 1,
    1, 0]`。


    图 2.7 展示了图形形式的 XOR 实现。


    让我们定义线性模型 `y = θ(x)` 为：


    ![](img/image-qdka18p2.jpg)


    其中 `w` 和 `b` 是权重和偏置项，它们由参数 `θ` 组成。在本书中，`θ` 被作参数 `w` 和 `x = wx + b` 的压缩形式，两种形式可以互换使用。为了简单起见，`θ`
    可以替换为 `(w, b)`，且 `(x; w, b)` 可以互换。


    我们将使用最小均方法 (LMS) 方法来寻找 `w` 和 `b` 的最优值。将损失函数 `J` 定义为：


    ![](img/image-15002kst.jpg) 或 ![](img/image-1qo8uxp4.jpg) 其中 `m` 是样本数量。


    由于我们的数据集是有限的，我们可以使用 `AX = B` 形式的正规方程以闭式解关于 `w` 和 `b` 进行最小化。


    通过求解上述代价函数，我们得到的 `w` 和 `b` 的值分别为 0 和 0.5。因此，对于每个输入点我们得到 `y = 0.5`。我们可以看到线性模型没有正确分类我们的输入点。让我们理解一下原因。


    ## 线性失败的数学分析


    首先，我们将从数学角度理解为什么线性模型在 XOR 函数上失效。


    ![](img/image-srpwpz2s.jpg) 表 2.1


    表 2.1 表示了期望的输入和输出，但我们为每个输入得到的输出值均为 `y = 0.5`。表 1 的图形表示如图所示。


    让我们使用定义的线性模型为每个输入-输出对写方程：


    ![](img/image-4ig766m3.jpg) 假设 `b = -1` 且 `w = 1`。


    因此，假设我们神经元的权重为 `w0` 和 `w1`。现在，当输入为 (0, 0) 时，XOR 函数输出 0。


    因此，我们的 SLP 神经元必须具有相同的输出。这意味着 `w0*0 + w1*0 - 1 < 0`。即 `-1 < 0`。因此 `0 > -1`。


    XOR 函数在输入 (1,1) 时也输出 0。因此，我们的 SLP 神经元必须满足 `w0*1 + w1*1 - 1 < 0`。


    所以，`w0 + w1 < 1`。


    XOR 函数在输入 (1, 0) 和 (0, 1) 时输出 1。这意味着我们的神经元必须满足：

    `w0*1 + w1*1 + w2*0 >= 0` 且 `w0*1 + w1*0 + w2*1 >= 0`。因此 `w0 + w1 >= 0` 且 `w0
    + w2 >= 0`。


    现在我们对于三个权重 `w0`、`w1` 和 `w2` 有四个不等式，如下如下：

    - `-w0 > 0`

    - `w0 + w1 + w2 < 0`

    - `w0 + w1 >= 0`

    - `w0 + w2 >= 0`


    如果我们将不等式 3 和 4 相加，得到 `2w0 + w1 + w2 >= 0`。现在，如果将不等式 1 加到这个不等式，得到 `w0 + w1 + w2
    >= 0`。但这显然矛盾了不等式 2。因此，没有任何 SLP 神经元能让这四个不等式同时成立。因此，没有任何 SLP 神经元具有与 XOR 函数相同的输出。


    ![](img/image-dbnkbmpu.jpg) 图 2.7 假设绿色点代表类别 1，红色代表 0。图中绿色和红色点代表两个不同的类别。从图中也可以推断出，不存在可以将这两类点的决策边界。XOR
    不是线性可分的，我们之前讨论过线性模型仅对线性可分的数据有效。即使我们将 XOR 扩展到高维，我们也无法使用单层感知机（线性模型）的 2 个输入得到任何解决此问题的决策边界。


    ## 多层感知机 (MLP)


    为了解决这个问题，我们需要引入多层感知机（MLP）。


    ![](img/image-888.jpg) 我们可以通过增加隐藏层来解决 XOR 问题。


    在 MLP 中，输入层接收数据，隐藏层通过非线性激活函数提取特征，输出层给出结果。通过这种方式，模型能够处理非线性可分的数据。


    '
