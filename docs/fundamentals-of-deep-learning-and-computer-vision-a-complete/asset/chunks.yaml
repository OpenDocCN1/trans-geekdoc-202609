- raw: '  Overfitting and Underfitting    Now we understand what the feedforward neural
    network is, the different cost functions that are used to train the network along
    with different approaches to optimize those cost functions, and how the activation
    functions help in introducing no-linearity in neural network.    In any model
    learning, it is very important that the model is able to generalize from the training
    data to make predictions in the future on the data the model has never seen. But,
    in practical problems, either the model is able to learn too well from the training
    data that it even captures the noise and less important details, known as overfitting,
    or the model is not able to learn even the significant details i.e., it is neither
    able to fit the training data nor it is able to generalize for the unseen data,
    known as underfitting.    Ideally, with enough parameters, we can fit any data
    set. The fact that the model is agreeing well with the available training data
    set doesn’t make it a good one. The model should be able to generalize the scenario.
    In deep neural networks, we can have millions of parameters. So, it’s very easy
    for the model to overfit with those many free parameters (weights and biases).
    To train effectively, we should be able to detect when the model overfits.   
    It is not always easy to detect overfitting in a model. The general rule is when
    accuracy on the unforeseen data (test data) is low as compared to the training
    set accuracy, the model is overfitting the training data.    How to prevent overfitting
    in deep neural networks?     Obtaining more data     More the data, the easier
    it is for the model to capture all the significant details and estimate the parameters
    appropriately.    Train/Dev/Test set     In neural networks, there are a lot many
    hyperparameters to play with. Using the test set accuracy to set the hyperparameters
    leads to leaking of the test (unforeseen) data information, due to which the model
    fails miserably in production systems. Since in deep neural networks, we deal
    with millions of data points, it is always recommended to have a separate dev/validation
    set to fine tune the hyperparameters, keeping the test set completely unforeseen.   
    Reduce the size of the network     This approach is not used very often as larger
    networks have the potential to be more powerful than smaller networks.    Regularization:
    It is the most commonly used method for preventing overfitting. It basically adds
    an extra component (penalty term) to the cost function (Eg-4a) or modifies the
    network (Eg-4b), which punishes the model for being too complex and hence the
    model generalizes better. Different regularization techniques are explained below.   
    L1 and L2     Both L1 and L2 add an extra penalty term in the cost function so
    that network is able to learn smaller weights. In case, the penalty term is ,
    and in the case of the penalty term is , where λ is the regularization hyperparameter.
    So, equation (22) becomes,,    ![](image-1x0tnnq0.jpg)   Drop out     In this
    technique, neurons (or nodes) in each layer (except those belonging to the output
    layer) of the network are dropped out (deactivated) with probability which is
    a hyperparameter while training, with its default value usually set to 0.5. It
    is worth noting that all neurons are kept in activated state (no drop out) while
    testing/inferencing.    Early stopping     Many a times, it is observed that with
    the increase in epoch number, though training loss keeps on decreasing, validation
    accuracy stops increasing after a certain epoch. It is not necessary that the
    model received at the end of the training process is the best one that could be
    possibly created. Basically, we interrupt the training process before the model
