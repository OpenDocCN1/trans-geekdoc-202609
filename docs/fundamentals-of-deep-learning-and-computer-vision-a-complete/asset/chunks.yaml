    # 基于梯度的学习


    深度学习算法使用优化技术，通过函数最小化或最大化来获取最优解。在优化中，我们通常通过最小化函数来获得一个稳定的全局最小值。即使为了最大化一个函数，我们也倾向于最小化该函数的负值，这等同于最大化原函数。我们想要最大化或最小化的函数可以定义为代价函数（cost
    function）、损失函数（loss function）或误差函数（或更泛地称为目标函数）。在书中，代价函数、损失函数或误差函数将交替使用，尽管某些书籍专门定义了其中一些术语。


    神经网络的训练与其他机器学习算法非常相似，但在非线性网络中，`gradient`的计算更为困难。在本节中，我们将讨论不同类型的优化算法。在线性模型中，我们使用凸函数（对于一个函数要是凸的，函数图像上两点的连线必须位于函数上方）作为优化函数。凸函数的优势是，无论`parameters`的初始值如何，它都能收敛到一个非常低的值，但由于由于神经网络的非线性特性，相关的代价函数变成了非凸的，因此，代价函数不会收敛到一个非常低的值。所以，我们使用迭代和基于梯度的优化技术来使代价函数收敛到一个可能的低值。


    随机梯度下降是一种在非线性网络中广泛使用的优化技术算法，但由于损失函数的非凸性，它不能保证全局最小值。我们稍后详细讨论随机梯度下降算法。


    ## 代价/损失函数


    在本节中，我们将讨论常用的损失函数类型，这些函数用于估计将输入 `X` 映射到输出 `Y` 的通用近似函数的参数，并量化近似模型的性能。为了获得最佳近似模型，我们估计模型参数使得损失最小化。


    极大似然算法是参数估计中最广泛使用的算法。


    首先，我们将讨论极大似然原理。从任何概率分布中取出 `m` 个样本点，其中 `X` = `…..`，接下来，我们定义模型，使其确定 `x_i`（其中 `i`
    ∈ `1, 2… m`）属于具有参数 `w` 和 `b` 的分布 `P(X)` 的概率。现在，我们可以定义 `θ` 的极大似然估计（如本章前面提到的，`θ`
    用作参数 `w` 和 `b` 的压缩形式且如下）：


    ![](img/image-69xl3370.jpg)


    借助公式 (7) 的帮助，估计参数值 `– w` 和 `b`，使得属于分布 `P(X)` 的概率最大。


    我们可以看到 `L` 是多个概率的乘积，这会导致数值精度上的误差。为了避免任何数值精度误差，我们通常倾向于对 `L` 取对数，将概率密度的乘积变为概率密度的和，因此处理起来更加方便。对数是一个增函数，所以它不会改变原函数的极大点。对
    `L` 取对数后，我们可以写为：


    ![](img/image-bpoq2yd1.jpg)


    函数的缩放不会改变原函数的极大点，因此我们可以除以 `m`（数据点总数），并再次定义 `θ ̂` 为 `L` 的期望或平均值。


    ![](img/image-s933770.jpg)

