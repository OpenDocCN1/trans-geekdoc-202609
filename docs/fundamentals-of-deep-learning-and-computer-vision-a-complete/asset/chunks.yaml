    For j \= 1:n

    ```


    ![](image-4hz3ru3p.jpg)


    Where, `m` is the total number of training examples and `n` is the total number
    of features for each training example.


    ## Neural Network Implementation


    So far, we discussed the cost function and optimization techniques for generalized
    linear models. Let’s implement these techniques for a neural network with a single
    hidden layer.


