    在 `SGD` 中，由于我们为每个训练示例计算梯度，代价函数变为


    我们可以将其写为


    在数学表达上，我们可以将权重的更新规则写为，


    直到收敛：


    ```

    For i \= 1 : m

    For j \= 1 : n

    ```


    ![](img/image-d5w3uw8f.jpg)


    同样，对于偏置值，


    直到收敛，


    ```

    For i \= 1:m

    For j \= 1:n

    ```


    ![](img/image-4hz3ru3p.jpg)


    其中，`m` 是训练示例的样本数，`n` 是每个训练示例的特征总数。


    ## 神经网络实现


    到目前，我们讨论了广义线性模型的代价函数和优化技术。让我们为具有单隐藏层的神经网络实现这些技术。


