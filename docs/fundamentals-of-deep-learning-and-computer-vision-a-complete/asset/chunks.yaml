    # TensorFlow 中的数据流图


    在 TensorFlow 中，程序的执行分为两个步骤：

    1. 设计数据流图

    2. 执行设计的/定义的图


    在第一步中，我们为操作设计架构。我们并不计算任何值，或者说，在定义操作时，我们不会得到这些操作结果的任何输出值。如果我们再次查看图，加法操作被执行了，但这两个输入
    `X` 和 `Y` 并不会产生结果 `X + Y`。因此，在 TensorFlow 中，当我们对任何输入进行加法或乘法时，我们并没有显式地进行加或或乘，而是设计了这些操作。


    为了获得结果，我们必须遵循第二步，即运行图。每个节点将包含所需的操作和张量（tensor）值。这可以总结为：在 TensorFlow 中，我们首先设计所需的操作，然后在第二步中执行设计的图。我们稍后会讨论图的执行。首先，让我们熟悉图的设计。


    ## 图的设计


    让我们在 TensorFlow 中构建第一个图。我们将使用图 1.10 所示的图作为示例：


    ![](img/image-qh4ryl5t.jpg) 图 1.10


    以下是该图在 TensorFlow 中的代码：


    ```python

    import tensorflow as tf

    a = tf.constant(6, name="input1")

    b = tf.constant(4, name="input2")

    c = tf.add(a, b, name="add_c")

    d = tf.multiply(a, b, name="multiply_d")

    e = tf.add(c, d, name="add_e")

    ```


    好的，让我们逐行理解这段代码。


    首先，

    ```python

    import tensorflow as tf

    ```

    这是为程序导入 TensorFlow 库的标准方式，并命名为 `tf` 以方便使用。


    接下来，

    ```python

    a = tf.constant(6, name="input1")

    b = tf.constant(4, name="input2")

    ```

    在这两行中，我们定义了两个输入 `a` 和 `b`。在这里，我们使用了该图中第一个 TensorFlow 操作 `tf.constant()`。该操作接收单个值，并将相同的值作为输出传递给下一层节点进行进一步计算。TensorFlow
    操作将输入值转换为 `Tensor`。我们还为每个操作定义了名称，这将有助于可视化图的设计。我们将在讨论 TensorBoard（TensorFlow 的可视化工具）时了解更多可视化。我们也可以不写名称写代码。


    现在，

    ```python

    c = tf.add(a, b, name="add_c")

    d = tf.multiply(a, b, name="multiply_d")

    ```

    在这两行中，我们又使用了两个 TensorFlow 操作，一个是 `tf.add()`，另一个是 `tf.multiply()`。首先，`tf.add()`
    将接收两个输入并将两个输入的加和作为输出。其次，`tf.multiply()` 将接收两个输入并给出两个输入的乘积作为输出。在这里，我们只为节点定义操作，TensorFlow
    会通过定义节点之间的连接自动将一个节点的输出传输到另一个节点。我们不需要考虑边。


    最后，

    ```python

    e = tf.add(c, d, name="add_e")

    ```

    这是上述图的最后一个节点。与节点 `c` 类似，节点 `e` 也接收两个输入并使用 `tf.add()` 操作相加这些输入，并将此加法的结果作为输出。


    记住，我们之前讨论过 TensorFlow 使用两个步骤来完全执行程序。这是设计过程，或者说是定义过程。当我们把这些行放入 Jupyter Notebook
    或 Python 文件中时，它不会返回任何值。为了得到结果，我们必须使用以下代码行。首先定义 session，然后在 session 中运行最后一个节点。我们稍后会了解。


    '
