    Mathematically, we can write the output of each hidden unit as:


    ![](image-ku8u3ybp.jpg)


    Where `a` is a column vector with a size as that of input vector `X` (in this
    case, (3, 1)), and `a_l^h = f(\sum_{i=1}^{n} W_l^{h,i} a_{l-1}^i + b_l^h)`.


    The above equation can be written in matrix form to get the compact formula, `a_l
    = f(W_l a_{l-1} + b_l)` as:


