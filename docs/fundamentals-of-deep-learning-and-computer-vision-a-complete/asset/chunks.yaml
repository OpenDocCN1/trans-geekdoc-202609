    \  LD\\_max \\= tf.add(LA\\_output, LB\\_output)  LD\\_output \\= tf.multiply(LD\\\
    _max, const)  output \\= tf.add(LC\\_output, LD\\_output)  var\\_1 \\= np.asscalar(np.array(\\\
    [8\\]))  var\\_2 \\= np.asscalar(np.array(\\[6\\]))  initialize\\_operation \\\
