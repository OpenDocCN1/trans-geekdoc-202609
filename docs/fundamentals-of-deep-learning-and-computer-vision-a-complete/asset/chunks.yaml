    # Activation Function


    So far, we discussed network architecture, cost functions, and optimization techniques.
    Now, we will discuss how and what the hidden units should we choose at each layer.
    Earlier, we used the `sigmoid` function as an activation function in hidden units.
    In this section, we will discuss other types of activation functions, but first
    let’s discuss why we need activation functions.


    In linear model, we use a single neuron and feed linear combination of weights
    and inputs to fit the model. Mathematically, we try to predict output `y` as:

    ![](image-6ew1onzc.jpg)

    It produces a linear decision boundary and hence, a linear classifier. Our aim
    is to get a nonlinear classifier. We use a neural network to build a nonlinear
    model, and we know that each neuron in the neural network gets an input similar
    to a generalized linear model.


    We can write the generic equation, using which, the neuron gets the input as:

    ![](image-rgh0ny38.jpg)

    In the linear model, we use the linear function as an activation function. Let’s
    try the linear activation function in a neural network model. Suppose if we use
    the linear activation function in hidden units, and the output unit of neural
    network model, as shown in Figure we know that the inputs of hidden units can
    be written as: `z = X + b` and output at hidden units can be written as `a = f(z)`
    where `f` represents activation function at layer. Since we have assumed that
    `f` is a linear function, so we can write Similarly, for the output layer, we
    can write that ![](image-4zu4vh1o.jpg)where `a = f(z)`. We can see that the neural
    network is outputting the linear function.


    Generalizing this result for multiple layers, we can say that if a linear activation
    function is used for neural network, then no matter how many layers a neural network
    has, it computes a linear function. In other words, we can say that a neural network
    will behave like it has no hidden units. Similarly, we can see that if we change
    the activation function at output layer from linear to sigmoid function, the same
    neural network will behave like the logistic regression model because inputs at
    output unit is a linear linear combination of weights and original inputs. We
    can use linear activation at output units in problems like regression and time
    series prediction, but we should use a different activation function at hidden
    layers.


    So far, we discussed that by using linear activation functions only, we will not
    get nonlinear classifiers. To achieve this objective, it is required to introduce
    non-linearity in the network in the form of activation functions. Now, let’s get
    introduced to some of the widely-practiced nonlinear activation functions used
    in a neural network.


    ## The Sigmoid Function


    ![](image-9ez6szt0.jpg) ![](image-a5dg784c.jpg) Figure 2.17

    Figure 2.17 shows a graph of the sigmoid function. Traditionally, the sigmoid
    function has been used as an activation function in neural networks. It squashes
    a value in range of 0 to 1. It has been used widely in binary classification problems.
    Although the sigmoid function introduces nonlinearity, it has a few drawbacks.
    Let’s look at them.


    *   **Vanishing gradient**: When the output value of hidden units reach either
    0 or 1, gradients become zero due to saturation (slope `f'' = 0`). We know that
    parameters will not updated (We will learn more about back propagation in the
    next section). Due to this problem, extra caution is also required while initializing
    the parameters because if initial values are high, it will saturate.

    *   **Non-zero centered output**: Output at hidden unit generates non-centered
    data, and it creates zig-zag dynamic during gradient descent; hence, leading to
    slower convergence.


    ## The Tanh Function


    The representation for the function is: ![](image-jwmu86je.jpg)

    Tanh is another nonlinear function used as an activation function. It squashes
    a value in the range of –1 to 1. If we analyze it properly, we can see that tanh
    is some shifted version of the sigmoid function. Mathematically, we can write
    it as `tanh(x) = (e^x - e^-x)/(e^x + e^-x)`. Tanh also suffers from the vanishing
    gradient problem, but is preferred over the sigmoid function due to zero-centered
    output.


    ## Relu


    `f = max(0, x)` ![](image-zscora.jpg) Figure 2.19

    Rectified linear units commonly known as `relu`, uses the function above. `relu`
    is easy to optimize due to its similarity with the linear function. The difference
    between the linear function and `relu` is that it outputs zero value when `x`
    is less than or equal to zero. Figure 2.19 depicts the graph of the `relu` function.
    The derivative of `relu` is 1 in half of its domain; meaning, hidden units will
    remain active when `x` is greater than zero. It helps to avoid the problem of
    the vanishing gradient when `x` is greater than zero. In contrast to the sigmoid
    and tanh function, where gradient value decreases when the value of `x` is large,
    the gradient of the `relu` function remains constant and helps in faster convergence.
    Unlike the sigmoid and tanh function, `relu` provides sparse network due to its
    characteristics (outputs 0 when `x ≤ 0`).


    ## Leaky Relu


    `f = max(αx, x)` ![](image-rdl9cu5n.jpg) Figure 2.20

    As mentioned earlier, `leaky relu` tries to fix the dying `relu` problem. It uses
    the function above, where `α` is a very small number. In `relu`, when `x ≤ 0`,
    it returns 0, but in `leaky relu`, it will return the value. We generally keep
    the small value of `α` close to 0.01 or smaller.

