    \ control on what to remember and what to forget. In other words, the network\
    \ should have some control based on the input and the hidden state which lets\
    \ the gradient from previous state pass to the present state. LSTM does exactly\
    \ that.\n\nLong Short-Term Memory, commonly known as `LSTM`, is another kind of\
    \ RNN network, which can handle long-term dependencies between data. `LSTM` stemmed\
    \ out as a saver for the vanishing and exploding gradient problem. `LSTM` has\
    \ been used to solve many practical problems and has become a de facto standard\
    \ for RNNs. The core idea behind `LSTM` is compared to `RNN`; it has several gates.\
    \ This gate allows the `LSTM` cell to focus on or forget a specific part of the\
    \ input sequence depending on the input and output. `LSTM` becomes very popular\
    \ by overcoming this problem and setting benchmarks in a number of fields in natural\
    \ language processing, like language modeling, machine translation, image captioning,\
