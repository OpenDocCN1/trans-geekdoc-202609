  fmt: "\n# Backpropagation\n\nSo far, we discussed how to update the parameters of\
    \ the simple neural network, but we haven’t discussed how to compute the gradient\
    \ of the cost function in a complex network. In other words, we have not discussed\
    \ properly how to compute the gradient of the cost function with respect to each\
    \ of the parameters of a network. So, in this section, we will discuss how each\
    \ parameter affects the cost function and how to propagate the error back in the\
    \ neural network to update model parameters.\n\nIn feedforward neural networks,\
    \ we take an input `x` and then information from `x` flow through hidden layers\
    \ to produce output. As information from `x` flows forward only, that’s why this\
    \ process is known as forward propagation. Now, once we get the output, we define\
    \ a `J` cost function, which represents the error between a true `y` output and\
    \ predicted output. Using the backpropagation algorithm, we feed the information\
    \ (that’s essentially the gradients) from the cost function back to the network.\
    \ We can assume it as a process that uses the feedback mechanism to enhance its\
    \ performance. In backpropagation, we feed information again to the network, but\
    \ this time in backward direction. In other words, we propagate information in\
    \ backward direction, that’s why this technique is known as “backpropagation”.\
    \ Notice that even in the case of a generalized linear model, we carried out backpropagation.\
    \ So, in general, we can say that backpropagation is used to compute the gradient\
    \ of any function.\n\nMoving forward, we will develop an intuitive understanding\
    \ of backpropagation using the chain rule, which will be used recursively to compute\
    \ the gradient of functions.\n\n## Simple Example and Chain Rule\n\nWe will start\
    \ with a simple example. Let’s define a function as `y = f(x)`. To make it simple,\
    \ we will represent this equation into a simpler equation: `y = a * w` where `w\
    \ + x` is represented by `a`. Now, let’s apply the chain rule to find the relation\
    \ between `y` and inputs. First, we will compute the partial derivative of function\
    \ `a = w + x` w.r.t `w` and `x` and then `w` w.r.t `a`.\n\n![](image-5zmq96su.jpg)\
    \ \n\nWe are interested in calculating partial derivatives of `y` with respect\
    \ to `x` and `w`. Now, let’s find the gradient of `y` with respect to each of\
    \ the input.\n\n![](image-y58ein0t.jpg) \n\nNow, we will use numerical values\
    \ to understand the result of partial derivatives. Suppose we choose `w = -3`,\
    \ `x = -1` and `y = 3`. Now, we will see how each of the input values affects\
    \ the function.\n\nWe can see that gradient of `y` with respect to `a` has a positive\
    \ sign. It means that if we increase `a` `y` will increase or if we decrease `a`\
    \ `y` will decrease. In other words, to increase or decrease `y` we will have\
    \ to increase or decrease `a` accordingly with a magnitude of 3. Continuing with\
    \ the above expression, we can write that `dy/da = w`. It means, we can give similar\
    \ arguments to establish a relation between `y` and `w`. Now, since `w` and `x`\
    \ hold a linear relationship (due to the additive nature), both variables will\
    \ behave similarly. Hence, we can say that the relation between `w` and `y` will\
    \ be similar to `dy/dx`. Now, `dy/dw`, as we can see that the gradient of `y`\
    \ with respect to `y` has a negative sign, which means `y` will follow an inverse\
    \ relationship with `y` with a magnitude of 4.\n\n## Numerical Backpropagation\n\
    \nNow that we have discussed the chain rule, let’s understand how backpropagation\
    \ works using actual numbers. Take a look at the following image:\n\n![](image-z5o02mvy.jpg)\n\
    \n### Figure 2.1\n\nFigure 2.1 represents our neural network. For simplicity,\
    \ we will understand backpropagation using a model having 2 inputs, 2 outputs,\
