    # 二维卷积


    在上一节中，我们已经看到了神经元之间的稀疏连接和参数共享如何减少参数数量。卷积提供了上述特征，除了这些，它还利用了等变性（equivariance）特征。我们将详细讨论每一个特征。


    ## 稀疏连接


    卷积神经网络（CNN）使用 `kernel` 实现稀疏连接。在全馈网络中，我们使用输入矩阵和下一层的神经元矩阵通过矩阵乘法来找到输出矩阵。我们使用了两个层级的完整矩阵，且矩阵的大小也很大。如果我们减小其中一个矩阵的大小呢？即，如果我们减小处理图像时使用的
    `kernel` 大小会怎样？


    早些在讨论卷积时，我们已经看到如何进行矩阵卷积。在图中，展示了不翻转卷积核的卷积操作：


    ![](img/image-pz25zzk7.jpg)

    图 3.14：不翻转卷积核的二维卷积


    假设我们有一张像素大小为数千或数百万的图像，并且我们需要找到图像中的边缘。输入矩阵与图像相同。现在，如果我们把 `kernels` 的大小缩小到几十或几百，它将使连接变得稀疏。稀疏连接意味着参数更少，从而减少了内存需求并使计算更高效。


    我们已经看到了 MLP 中如何减少连接；为了完整性，让我们也从数学角度来看卷积。早些时候我们讨论过 MLP，如果输入和输出大小分别为 `m` 和 `n`，那么它至少需要
    `m × n` 个参数，且每个输入的时间复杂度为 `O(m × n)`。如果我们使用较小的 `kernel`，那么输出的数量也会减少，且输出的大小将小于 `n`。现在，如果输入大小为
    `n`，输出大小为 `k`，则需要 `m × k` 个参数，时间复杂度为 `O(m × k)`。我们通常保持 `k` 的值远小于 `m`（输入大小）。


    直观上，我们已经看到了 MLP 中像素之间的稀疏连接。让我们来看看 CNN 的这种情况。图描绘了像素之间的稀疏连接性。首先，我们将使用简单的神经网络架构来讨论这些图，然后将使用矩阵来讨论。让我们逐一理解这些图。


    在图中，上方的图代表 CNN 的实现，下方的图代表 MLP。在下方的图中，我们可以看到一个输入影响了下一层的所有神经元，而在上方的图中，只有 `3` 个神经元受到影响。我们是如何得到上图的？图中展示了卷积；现在只需将输入和
    `kernel` 都替换为 `1 × 3` 的 `kernel`。


    假设我们有一个大小为 `1 × 3` 的 `kernel`，并执行与图中所示的操作。为了理解并使其起见，只使用了输入层的 `1` 个输入。图中显示输入只影响了下一层的
    `3` 个神经元。


    ![](img/image-gll1dyt0.jpg)

    图 3.15：CNN（上）和 MLP（下）的实现。高亮颜色显示受影响的神经元


    为了更清楚，让我们理解 `kernel` 是如何移动的。想象我们把 `kernel` 放在如图所示。`kernel` 用矩形框表示，神经元用圆圈表示。由于
    `kernel` 的大小是 `1 × 3`，它一次不能接受超过 `3` 个输入。输入与 `kernel` 的组合如图所示产生 `output`。


    ![](img/image-boflq83d.jpg)

    图 3.16：像素与卷积核的卷积


    同样，如果我们把 `kernel` 替换为移动了一个位置的 `1 × 3` `kernel` 并如图所示，它将产生 `output`，我们可以类似地说，图描述了
    MLP（下）和 CNN（上）的输出是如何形成的。


    ![](img/image-a9vbjcnn.jpg)

    图 3.17：CNN（上）使用输入和 `kernel` 形成，MLP（下）使用所有输入神经元形成


    所以，通过图我们可以说一个 `kernel` 可以影响下一层的 `3` 个神经元。正如我们所看到的，我们在下一层只得到了 `3` 个输出神经元，因为我们没有像图中那样向输入神经元的左或右扩展
    `kernel`。


    ![](img/image-cptpeptn.jpg)

    图 3.18：下一层中的三个输出


    稍后在讨论填充（padding）时，我们将讨论如何进行卷积。接下来，我们将讨论“参数共享”和“等变性”，在此之前，让我们看看如何使用矩阵（输入和核）进行卷积。这有助于可视化上述特征。现在，我们将讨论输入的卷积，这将有助于剩余特征。作为一个例子，让我们取一个大小为
    `5 × 5` 的输入矩阵和一个大小为 `3 × 3` 的 `kernel`。


    ![](img/image-fba0b0.jpg)

    图 3.19：输入矩阵（左）和卷积核（右）


    如图所示使用逐元素乘法执行卷积。为了得到第一个输出值，图中显示了 `12`。我们可以假设 `kernel` 叠加在输入上。由于 `kernel` 中有 `9`
    个元素，它将与输入矩阵的 `9` 个元素叠加。下标的数字是 `kernel` 的值。下标数字与对应框的值相乘得到输出。像素 `(0, 0)` 的卷积结果在矩阵的右侧。我们可以看到只有一个元素非零，其余的
    `0`，因为在执行操作时假设 `kernel` 大小之外的输入值将与 `0` 相乘。同样，我们可以计算其余像素的位置。


    ![](img/image-5d2kukem.jpg)

    图 3.20：逐元素元素的示例


    图 3.21 显示了输入和卷积核之间的每次卷积步骤。在图像的左上角，输入矩阵和 `kernel` 之间执行逐元素乘法得到第一个输出值 `12`。这显示在右侧矩阵的第一个条目中。矩阵是完整卷积操作的最终输出，但矩阵中的阴影区域表示卷积操作每一步的输出值。同样，为了得到第二个值，将卷积核向移动一列并再次执行逐元素乘法。


    ![](img/image-ws78bdiz.jpg)

    图 3.21：使用输入矩阵和卷积核执行的卷积


    ## 参数共享


    在上面，我们讨论了图像的卷积。现在，让我们讨论剩下的重要特征。我们将从参数共享开始。我们已经讨论了 MLP 中的神经元如何通过成组来共享参数。现在，我们将看看
    CNN。如图所示，在卷积网络中，相同的 `kernel` 与每个位置相乘。因此，与其在每个位置学习 `kernel` 的元素，我们可以在每个位置使用相同参数的
    `kernel`。在讨论稀疏连接时，我们讨论过共享参数的重要性。正如之前提到的与普通的全馈神经网络相比，它减少了内存需求和运行时间。从图形上来说，图和 3.21
    描绘了参数共享是如何工作的。


