    ## 关于作者

    **Nikhil Singh** 是一位资深的数据科学家，目前在伦敦 Proarch IT Solutions Pvt. Ltd 担任首席数据科学家。他拥有为大量全球公司设计并交付复杂的且创新的计算机视觉和自然语言处理（NLP）解决方案的经验。他曾担任多家公司的人工智能顾问，并指导过许多学徒数据科学家。

    您的 LinkedIn 简介：`https://www.linkedin.com/in/nikhil-singh-b953ba122/`


    **Paras Ahuja** 是一位经验的数据科学从业者，目前在海得拉巴的 Reliance Jio 担任首席数据科学家。他在设计和部署专注于计算机视觉、NLP
    和推荐系统的基于深度学习的可扩展解决方案方面拥有丰富经验。他指导和培训了数十名数据科学爱好者和初学者。

