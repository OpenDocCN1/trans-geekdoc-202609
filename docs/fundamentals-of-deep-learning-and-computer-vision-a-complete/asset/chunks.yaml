    ## 池化层 (Pooling layer)


    现在，让我们来理解池化层。池化层与上一章中讨论的前馈网络中的丢弃层（dropout layer）有些相似。它有助于减少像素之间的共同适应，从而减少方差。在池化层中，输出的某些元素根据局部输出的统计被替换为新元素。因此，它有助于对数据进行下采样，最终提高统计效率并减少内存需求。


    目前，我们使用图像作为示例，因此我们将使用“像素”（pixels）一词代替“元素”（elements），而且因为它们大家更熟悉。例如，在平均池化（average
    pooling）中，局部像素被这些局部像素的平均值取代。同样地，在最大池化（max pooling）中，局部像素中的最大值取代了其余局部像素。其他不同类型的池化，例如加权平均池化、归一化池化（norm
    pooling）或随机池化（stochastic pooling）等。图 3.46 展示了最常用的两种变体：最大池化和平均池化。图 3.46 中的左侧矩阵代表输入图像，右上矩阵代表应用
    `max pool` 函数后的输出，右下矩阵代表 `average pooling` 函数的输出。在这个示例中，我们可以认为我们使用了尺寸为 `2 x 2`
    的滤波器以及 `stride = 2`。这些是池化层中的超参数。池化层中的超参数保持固定的，这意味着这些参数在反向传播过程中不会改变，这与卷积层中反向传播过程中变化的权重和偏置不同。


    ![](img/image-k077fj1e.jpg)

    图 3.46: 池化函数后的输出


    池化的主要功能是为输入的微小平移增加不变性，本质上，这意味着池化函数防止由于输入中的微小平移扰动导致输出值的变化。我们可以通过图 ![](img/image-uzz8uued.jpg)
    来理解上述陈述。

    图 3.47: 池化函数的表示


    图中图 a 和 b 描述了池化函数。在图中，使用了步长为 `1` 的 `stride` 和尺寸为 `1 x 3` 的滤波器。图中底部的圆圈代表池化层之前的输出，顶行代表对底部行应用
    `max pool` 函数的输出。现在，图中所有的像素都移动了 `1` 个单位；我们可以将其视为微小的平移扰动。由于像素移动了 `1` 个单位，底部圆圈中的每个值都发生了变化，而上方圆圈只有一半的值发生了变化。这是因为
    `max pool` 层对感受野内像素的最大值敏感，而不是对像素的位置。我们也可以将池化函数视为特征检测器。假设我们需要在图像中寻找猫的眼睛；`max pool`
    层确保如果图像中有猫的眼睛，无论它在什么位置，都能检测到，但有时我们需要保留位置，在这种情况下，池化函数将是不适当的。对于 3D 输入，我们在每一层上应用池化函数，然后堆叠这些层。


    ## CNN 架构 (Architecture of CNN)


    我们已经讨论了 CNN 中使用的典型层。让我们通过图中所示的示例来理解 CNN 架构。图中图中使用了尺寸为 `32 x 32 x 3` 的 RGB 图像。在第一个卷积层中，使用了
    `6` 个尺寸为 `5 x 5 x 3`、步长为 `stride 1` 且无填充的滤波器，然后使用 `ReLU` 函数来引入非线性。它产生了一个尺寸为 `28
    x 28 x 6` 的输出；输出深度为 `6`，是因为使用了 `6` 个尺寸为 `5 x 5 x 3` 的滤波器。下一层是池化层，其中对每个输出使用尺寸为
    `2 x 2`、步长为 `stride 2` 的滤波器，或者我们可以假设使用尺寸为 `2 x 2 x 6`、步长为 `stride 2` 的滤波器；两种假设将产生相同的输出。池化层将尺寸缩小了
    `2` 倍，因此输出尺寸为 `14 x 14 x 6`。再次，下一层是卷积层，其中使用了 `16` 个尺寸为 `5 x 5 x 6`、带有 `ReLU` 非线性、`stride
    1` 且无填充的滤波器，这产生了尺寸为 `10 x 10 x 16` 的输出。之后，实现了一个滤波器尺寸为 `2`、步长为 `stride 2` 的池化层，产生了尺寸为
    `5 x 5 x 16` 的输出。现在，在下一层中，来自第二个池化层的输出被展平（flattened）成一个 `400 x 1` 的向量，即 3D 输出转换为列向量。接下来的
    2 层是全连接层 `FC1` 和 `FC2`，分别具有 `120` 和 `84` 个单元，最后是分类输入图像的 `softmax` 层。展平向量中的所有单元都密集地连接到
    `FC1` 的单元；同样，`FC1` 的所有单元都连接到 `FC2` 的每一个单元。我们可以将展平向量视为 `MLP` 的输入，并将后续层视为 `MLP`
    的隐藏层。


    ### 为什么我们要添加全连接层？ (Why do we add a fully connected layer)


    我们可以这样认为——`CNN` 有助于从图像提取特征，而全连接层有助于将这些特征泛化到输出空间。我们也看到随着层数的增加，图像的尺寸（高和宽）减少了，但通道数（深度）增加了。


    ![](img/image-5pxmpmv.jpg)

    图：一个简单的 CNN 架构


    ## 结论 (Conclusion)


    在本章中，我们探索了 `CNN` 以及 `CNN` 架构的重要构建部分。首先，我们讨论了前馈网络的局限性，例如计算密集型、无法利用像素间的空间关系等，以及
    `CNN` 如何帮助解决这些问题。我们查看了 `CNN` 中的重要操作，例如卷积的应用、卷积的选择、`stride` 和 `padding` 的概念、`max
    pool` 等。随后，我们讨论了如何在每一层执行卷积操作。在最后，我们学习了如何构建一个小型 `CNN` 模型。一旦我们能够让小型模型正常工作，就可以按照相同的原理构建更大更深的模型。在下一章中，我们将讨论各种先进且复杂的
    `CNN` 架构，如 `Alexnet`、`VGG`、`Resnet` 等。


    # 第 4 章 CNN 架构


    在上一章中，我们学习了卷积神经网络及其相关概念。大多数计算机视觉应用都围绕着 `CNN` 架构展开。在本章中，我们将进一步讨论学术界和工业界用于各种计算机视觉应用的
    `CNN` 架构。


    ### 结构 (Structure)

    - AlexNet

    - GoogleNet/Inception

    - VGG16 (OxfordNet)

    - ResNet

    - Fast R-CNN

    - Faster R-CNN

    - SSD

    - YOLO


    ### 目标 (Objective)


    我们将讨论一些流行的网络——`AlexNet`、`VGG`、`Inception`、`ResNet` 以及不同的目标检测算法，如 `R-CNN`、`Fast
    R-CNN`、`Faster R-CNN`、`Single Shot Detector (SSD)` 和 `You Only Look Once (YOLO)`。我们将尝试理解它们的设计以及它们为什么如此有效。此外，在适当的时候，我们将查看之前几章中学的不同概念的应用（激活函数、池化层、`stride`、`padding`、dropout
    正则化、批量归一化等）。许多计算机视觉应用（如图像分类、目标检测和人脸识别）使用这些概念之一作为基础架构。下图展示了 `ILSVRC` 的胜利者：


    ![](img/image-f89lg5m5.jpg)

    图 4.1: ImageNet 大规模视觉识别挑战赛（ILSVRC）冠军。（版权所有 Kaiming He 2016）


