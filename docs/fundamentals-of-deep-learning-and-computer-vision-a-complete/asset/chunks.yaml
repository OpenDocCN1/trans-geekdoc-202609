    # Feedforward Neural Network


    The simplest of all neural networks, the feedforward neural network, moves information
    in one direction only. Data moves from the input nodes to the output nodes, passing
    through hidden nodes (if any). There is no feedback mechanism from output to input;
    hence, the feedforward network is also a form of directed acyclic graph.


    ## Single layer perceptron

    The single layer perceptron is the most basic form of artificial neural network
    that will have input and output layers with no hidden layers. It is a type of
    feedforward neural network with 0 hidden layers.


    ## Multilayer perceptron

    A multilayer perceptron (`MLP`) is a class of feedforward neural network. `MLP`
    consists of three layers—input, output, and one or more than one hidden layer.
    Multilayer perceptrons or feedforward networks are the fundamental and classical
    form of Deep Learning models.


    The term neural network and feedforward network will be used interchangeably in
    this chapter henceforth. So, why did we call it a network? We can assume universal
    or generalized function `F` as a composition of smaller and less complex functions
    like and so on.


    Each layer in the deep network represents a smaller function. Mathematically,
    it can be defined as `F =` and so on, depending on the number of layers; and the
    network can be written as `y = F(x; θ)`, where `x` is an input vector, `θ` is
    a parameter of the general function and `y` is an output vector.


    As we discussed, the main objective of these models is a universal function approximation,
    which essentially means approximating any general function `F` such that it maps
    input and output vectors. Like traditional machine learning algorithms, it learns
    the value of parameters of function `⨍(x; θ)` while mapping input `x` to class
    but with better efficacy and optimally by exploiting the features of the input
    vector.


    Neural network is composed of an input layer, hidden layers, and an output layer.
    Intermediate layers are defined as hidden layers. They are called hidden layers
    because these layers do not get information about the true output value from the
    input data. Learning algorithms use these hidden layers and itself choose an optimum
    value of parameters to approximate function which maps input to output.


    In the above arguments, we defined the approximated function, `F =` and the output,
    `y = F(x; θ)`. The total number of layers in this network is 6, including input
    layer `x` and output layer and the number of hidden layers, which also represents
    the depth of the model, which is That’s how Deep Learning got its name.


    Each layer of network consists of units. Units of hidden layers are called hidden
    units. By adding more layers and hidden units, dimensionality of the network gets
    increased and hence the complexity of the function. Mathematically speaking, each
    layer can be defined as a vector in which a number of units represents elements
    of vector. So, neural network can be interpreted as a composition of multiple
    vectors; alternatively, it can also be interpreted as connections between vector
    and scalar, meaning connections between each element of a vector with each element
    of other vectors. Each unit of layer is parallelly connected to all the units
    of the previous layer.


    Let’s understand the structure of the neural network with an example. Suppose
    the first layer consists of 3 units and the second layer consists of 2 units.
    Each unit of the first layer can be connected to all the units of the second layer.
    Hence, the complete information of the first layer vector will be passed to each
    unit of the second layer vector separately. So, the maximum number of connections
    between first and second layer will be 6. Generalizing the argument, we can say
    that the total number of connections between 2 layers (vectors) having `m` and
    `n` units respectively will be `m*n` (maximum possible connection). We will discuss
    later that the number of connections between layers can also be lesser than the
    maximum value.


    ![](image-qxqk9aob.jpg) Figure 2.3


    Let’s look at the reason behind the idea why the AI community has left the comfortable
    area of linear networks and started focusing on Deep Learning. There are broadly
    two types of models: linear and nonlinear.


    ## Linear models

    Linear models use simple mathematical properties, generally additivity and multiplicity,
    to find the solution. We can observe that these models can fit on linearly separable
    data, and they are simple and easy to use too. A scenario where linear models
    work is shown in Figure Figure 2.4 shows the OR and AND logic functions. Then,
    why have we shifted our focus on other models? The main drawback of a linear model
    is its non-flexible property. Linear models do not provide any relation between
    input data points or between parameters of universal approximation function.


    ![](image-4w2suu7z.jpg) Figure 2.4: Linearly separable logic functions


    ## Nonlinear models

    In the real world, we encounter problems that exhibit non-linear correlations
    among the actions. Figure 2.5 shows the XOR logic function, an example of the
    nonlinear functions. They require complex and nonlinear models. Due to limited
    functionality, like multiplicative scaling and additivity, linear model’s approximated
    function is restricted to linear function. Hence, to use linear models for non-linearity,
    we transformed input data into nonlinear data by using any transformation function
    `T` or using the kernel trick, as in `SVM`, to map data into higher dimensions.
    But these approaches raise a new question: How to decide which transformation
    function will give better results? Depending on the data point and model, each
    of the transformation techniques will give different results.


    ![](image-lxgsyt68.jpg) Figure 2.5: Non-linearly separable logic function


    To overcome this problem, a new technique called Deep Learning was proposed. This
    technique introduces non-linearity into the network. In Deep Learning, we use
    an approximation function `F` with various parameters. While mapping input to
    output, this technique helps us learn the optimum value of the function''s parameters,
    which in turn helps us achieve a generic mapping function that gives better results
    with test data as well. Let’s understand our above discussion with a simple example
    of the XOR function. First, we will see why it is not possible to develop the
    XOR function by a linear model, then we will implement the XOR function using
    a nonlinear model.

    '
