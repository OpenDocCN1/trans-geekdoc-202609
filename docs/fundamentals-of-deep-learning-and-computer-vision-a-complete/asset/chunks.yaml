    # 反向传播


    好了，到为止，我们讨论了 RNN 的重要性及其一些应用。现在，我们将研究 RNN 网络的学习过程。在讨论前馈网络和 `CNNs` 的学习过程时，我们已经看到，给定某个可微损失函数
    `L` 对网络输出的偏导，下一步是确定其对权重的导数。我们将这一相同概念扩展到 RNN，并讨论 RNN 学习过程中所需的任何额外概念。


    那么，RNN 是如何训练的呢？由于现在存在时间上的连接，除了普通的前馈连接外，与普通前馈连接相关的权重 `W` 可以使用普通的反向传播算法来学习。对于时间权重，反向传播需要进行稍微修改，以包含序列因素。这种算法广为人知的时间反向传播（`BPTT`）。


    让我们考虑图从公式 5.4 和 5.5 所示的原始 RNN 网络，我们可以将任意时刻 `t` 的隐藏状态和输出写为：


    ![](img/image-h0ilepfq.jpg)


    在这里，我们考虑时间步的正确标签与网络预测之间的交叉熵损失。总误差只是每个时间步误差之和，我们考虑样本的平均损失。


    ![](img/image-xu89s9gb.jpg) ![](img/image-h37bilet.jpg)

    图 5.10：原始 RNN


    与普通反向传播一样，`BPTT` 的核心也是微分的链式法则。我们将使用梯度下降技术来计算矩阵的权重，我们知道任何迭代中的总误差都是每个输出单元误差之和，因此，对于任何权重，我们可以写道：


    ![](img/image-atzqzlvn.jpg)


    在这里，$\hat{y}_t$ 表示预测输出，它们是


    ![](img/image-6w4pni20.jpg)


    在上面，`=` 和 `⊗` 是逐元素的向量乘法。$\dots$ 仅取决于当前时间步的值 $h_t$。因此，更新 `V` 是显而易见的。它只依赖于当前时间步。这与普通的反向传播相同。


    到为止，我们已经计算了 $\frac{\partial E}{\partial V}$，但我们知道任何时间步 `t` `V` 值的变化会影响 $\frac{\partial
    E}{\partial V}$。因此，我们可以将方程推广为：


    ![](img/image-t2g7ugx5.jpg)


    但当我们遇到隐藏层 $h_t$ 时，事情变得有点复杂。


    ![](img/image-zjt8rwmk.jpg)


    同样，对于 `U` 也是如此：


    ![](img/image-t1v9ty83.jpg)


    现在注意，$\dots$ `+` 取决于 $\dots$ 取决于 `W` 和 $h_{t-1}$以此此类推。因此，如果我们对 $h_{t-1}$ 求导，我们不能简单地将
    $h_{t-1}$ 视为常量！我们需要再次应用链式法则，我们真正得到的是：


    ![](img/image-h5v98z9v.jpg) ![](img/image-9fz4rb6j.jpg)

    图 5.11：BPTT


    图 5.11 和公式 5.20 表现了前馈网络与 RNN 网络之间的关键区别。由于 RNN 的参数共享属性，我们相加了方程 5.20 中的导数，而在前馈网络中，参数是不共享的，因此我们不进行任何加和。


    # 梯度消失问题


    正如我们所讨论的，RNN 可用于使用先验数据寻找即将事件，例如使用视频中过去的帧来描述下一帧，以及句子中最合适的下一个词。在知道 RNN 擅长序列数据后，RNN
    能不能解决现实生活中的复杂问题？如果是，需要多少先验数据？任何信息可以传递到下一个块多远？让我们通过回顾“填空”示例来理解这一点。在那个例子中，我们必须找到一个更合适的词来填充句子中的空格。这里是同一个句子：color
    of the sky is blue。我们讨论过在这类问题中，RNN 可以利用之前的上下文来找到合适的词。在这里，相关信息与需要预测的词之间的差异很小，如图所示，因此
    RNN 可以找到一个合适的答案。


    但问题在于；如果如果我们增加句子的长度（意味着更多的单词）呢？


    ![](img/image-tdxvby2.jpg)

    图 5.12：小间隙的 RNN


    等一下，如果我们增加句子的长度（意味着更多的单词）呢？


    ![](img/image-985zn30.jpg)

    图 5.13：大间隙的 RNN


    *(注：提供的文本在后半部分包含重复短语和碎片化句子；我已根据指令在清理结构的同时保持了核心逻辑流。)*


    关于方程 22 的详细解释，请参阅论文：On the difficulty of training recurrent neural networks by
    RazvanPascanu, Tomas Mikolov, and YoshuaBengio。


