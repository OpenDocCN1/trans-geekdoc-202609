- raw: "  Placeholders    Thus far, we are providing input directly into operations\
    \ or using operation to create inputs. But TensorFlow provides another technique\
    \ to feed inputs. This can be done using placeholder. Placeholder, the name itself\
    \ defines it as an empty tensor object which does not have any value during initialization,\
    \ but it can be feed with input data during execution of the graph. Why is it\
    \ better to use placeholders than constants? When we use constant, its value gets\
    \ copied in a graph. Suppose we initialize large ones or zeros as constant operation\
    \ e.g. initialize\\_ones \\= np.ones((3000, This operation not only add a single\
    \ operation to the graph, but it also copies the 9 million constant elements into\
    \ the graph. So, whenever the graph is loaded, constant value gets replicated.\
    \ This makes loading of graph slow and expensive. We can check the argument by\
    \ printing graph’s protobuf (protocol buffer).    Let’s understand this with an\
    \ example.    import tensorflow as tf  constant\\_value \\= tf.constant(\\[6,\
    \ 4, 2\\],  name=”constant\\_value”)  print(tf.get\\_default\\_graph().as\\_graph\\\
    _def())    When we run this code, it will return output shown in Figure Now when\
    \ we run the code in notebook multiple times, the number of dictionaries keep\
    \ on increasing. This shows that value of a constant gets replicated when the\
    \ graph is loaded. Placeholder initializes single operation and it gets executed\
    \ inside session.run(). After each resources which are not needed any longer get\
    \ released by closing the session as Hence, it does not copy the tensor object\
    \ in a graph.    ![](image-3ld4eoqm.jpg)  Figure 1.13    Placeholders are flexible\
    \ with data size. We can initialize the size of input or we can mention None.\
    \ When we pass None value as shape parameter, it enables placeholders to take\
    \ data of any size. Data type in placeholder should also be initialized to avoid\
    \ any mismatch errors. Placeholders once initialized, must be feed with input\
    \ data, otherwise it shows an exception. Feeding mechanism is used to feed data\
    \ in a placeholder.    Let’s understand the use of placeholder with an example.\
    \    import tensorflow as tf  import numpy as np  x\\_matrix \\= np.random.randn(3,\
    \ 1)  m\\_matrix \\= np.random.randn(3, 3)  x \\= tf.placeholder(tf.float32, shape=(3,\
    \ 1))  m \\= tf.placeholder(tf.float32, shape=(3, 3))  c \\= tf.ones((3,1))  mx\
    \ \\= tf.matmul(m, x)  y \\= mx \\+ c  value \\= tf.reduce\\_mean(y)  sess \\\
    = tf.Session()  sess.run(value, feed\\_dict={x: x\\_matrix, m: m\\_matrix})   \
    \ In the above example, we implemented the equation y \\= mx \\+ Initially, we\
    \ have defined values for two matrices and one vector using NumPy. We have initialized\
    \ two inputs x and m as a placeholder, which eventually got filled in during execution.\
    \  \n\n  Variables    So far, we have used constants as input, and it has been\
    \ fun. Now, let’s discuss variables, another tensor object which really matters\
    \ a lot.    In optimization or learning process, variables play a key role. In\
    \ this type of process, different types of parameters and hyperparameters needs\
    \ to be tuned continuously and properly till they find the best value to fit in\
    \ the model. In each iteration, its value keeps updating. While discussing placeholder,\
    \ we have discussed the drawbacks of using constant operation. Variables can also\
    \ be a replacement of constant operation. Variables should be used where more\
    \ data are in play because it requires more memory. A variable is stored separately\
    \ and usually, they don’t replicate.    Let’s understand how to create a variable.\
    \ Variable is declared when we instantiate an instance of the class Lowercase\
    \ c is used in whereas uppercase V is used in This difference arises because tf.constant\
    \ is an operation, whereas tf.Variable is a class because it offers more than\
    \ one function.    Variable can be created using TensorFlow operation    import\
    \ tensorflow as tf  var \\= tf.Variable(10, name \\= “create\\_variable”)  value1\
    \ \\= tf.multiply(2, var)  value2 \\= tf.reduce\\_max(5, var)    Okay, now we\
    \ will discuss how to initialize variable.    As we have discussed above, state\
    \ of variables or we can simply say value of variables handled by session. To\
    \ use variables, first we will have to initialize them, and it will get executed\
    \ in session run. Generally, initialization is done by using tf.global\\_variables\\\
    _initializer() after which memory get allocated to variables.    import tensorflow\
    \ as tf  x \\= tf.Variable(tf.truncated\\_normal(\\[2, 1\\], mean=5.0, stddev=1.0))\
    \  m \\= tf.Variable(tf.random\\_normal(\\[2, 2\\], stddev=0.1))  c \\= tf.Variable(tf.ones(\\\
    [2, 1\\]))    mx \\= tf.matmul(m, x);  y \\= tf.add(mx, c)    initializer \\=\
    \ tf.global\\_variables\\_initializer()  sess \\= tf.Session()  sess.run(initializer)\
    \  print(sess.run(y))  sess.close()    In this example, we have calculated the\
    \ value of equation y \\= mx \\+ When we run this code, it will return \\[\\[0.4051047\\\
    ], \\[0.507525\\]\\] as an output. Note that, line sess.run(initializer) is used\
    \ to initialize a variable, it does not fetch any value.    Let’s look at another\
    \ example.    import tensorflow as tf  variable1 \\= tf.Variable(2)  constant1\
    \ \\= tf.constant(2)  new\\_variable \\= tf.multiply(variable1, constant1)  update\\\
