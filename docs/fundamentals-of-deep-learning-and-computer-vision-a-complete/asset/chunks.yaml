    layer and see the result:    #begin code  plt.Figure(Figuresize=(16, 32))  \#
    no. of hidden units in hidden layer  hidden\_layer\_dimensions \= \[1, 2, 3, 4,
    5, 20, 30, 50 100\]  for i, nn\_hdim in enumerate(hidden\_layer\_dimensions):  plt.subplot(5,
    2, i+1)  plt.title(''Hidden Layer size %d'' % nn\_hdim)  model \= build\_model(nn\_hdim)  plot\_decision\_boundary(lambda
    x: predict(model, x))  plt.show()    The following Figure depicts the different
    nonlinear decision boundary on varying the number of hidden units in the hidden
    layer.    ![](image-f8zf9cgq.jpg)  Figure 2.25    ![](image-rjkfvrcu.jpg)  Figure
    2.26    ![](image-vmg16wvu.jpg)  Figure 2.27    ![](image-qg4sidlc.jpg)  Figure
    2.28    So far, we discussed the concepts of the feedforward neural network and
    saw how linear and nonlinear models classify data using decision boundary. Now,
    we will implement the neural network for more practical problems. In this example,
    our aim is to classify fashion MNIST using TensorFlow.    Let’s understand what
    are the required libraries:    \# Import required libraries    import numpy as
    np  import matplotlib.pyplot as plt  import tensorflow as tf  fromtensorflow.python.framework
    import ops  fromtensorflow.examples.tutorials.mnist import input\_data    #Download
    fashion mnist dataset and save it in ‘data/fashion’ folder otherwise tensorflow
    will download original mnist dataset.  fashion\_mnist\_dataset \= input\_data.read\_data\_sets(''data/fashion'',
    one\_hot=True)    \# check the size of train and test dataset  shape\_train=fashion\_mnist\_dataset.train.images.shape  shape\_test=fashion\_mnist\_dataset.test.images.shape  You
    will find that dataset are in 1-D array.  \# Fashion mnist dataset are labeled
    according to below dictionary.  label\_dict \= {  0: ''T-shirt/top'',  1: ''Trouser'',  2:
    ''Pullover'',  3: ''Dress'',  4: ''Coat'',  5: ''Sandal'',  6: ''Shirt'',  7:
    ''Sneaker'',  8: ''Bag'',  9: ''Ankle boot''  }    \# check the random images
    from dataset and associated label.  sample \= fashion\_mnist\_dataset.train.images\[40\].reshape(28,28)  sample\_label
    \= np.where(fashion\_mnist\_dataset.train.labels\[40\] \== 1)\[0\]\[0\]    \#
    Show images and labels  print("y \= {label\_index} ({label})".format(label\_index=sample\_label,
    label=label\_dict\[sample\_label\]))  plt.imshow(sample, cmap=''Greys'')  plt.show()   
    On executing the above code, we can see Figure 2.29 with a label name.    ![](image-2bj1hhwa.jpg) 
    Figure 2.29    Let’s assign various parameters and hyperparameters values of the
    network as follows:    \# Units in first hidden layer  n\_hidden\_1 \= 128  \#
    Units in second hidden layer  n\_hidden\_2 \= 128  \# Fashion mnist data input
    (img shape: 28\*28)  n\_input \= 784  \# Fashion mnist total classes (0-9 digits),
    also, no. units in output layer  n\_classes \= 10    \# Create placeholders  def
    create\_placeholders(n\_x, n\_y):  #n\_x and n\_y represents size of input vector
    and no. of output class respectively.  X \= tf.placeholder(tf.float32, \[n\_x,
    None\], name="X")  Y \= tf.placeholder(tf.float32, \[n\_y, None\], name="Y")  return
    X, Y    def initialize\_parameters():  #Initializes parameters to build a neural
    network with tensorflow. We have discussed  \# earlier how to define shape of
    parameters at each layer.The shapes are:    W1 : \[n\_hidden\_1, n\_input\]  b1
    : \[n\_hidden\_1, 1\]  W2 : \[n\_hidden\_2, n\_hidden\_1\]  b2 : \[n\_hidden\_2,
    1\]  W3 : \[n\_classes, n\_hidden\_2\]  b3 : \[n\_classes, 1\]  \# Set random
    seed for reproducibility  tf.set\_random\_seed(42)  \# Initialize weights and
    biases for each layer  W1 \= tf.get\_variable("W1", \[n\_hidden\_1, n\_input\],
    initializer=tf.contrib.layers.xavier\_initializer(seed=42))  b1 \= tf.get\_variable("b1",
    \[n\_hidden\_1, 1\], initializer=tf.zeros\_initializer())  W2 \= tf.get\_variable("W2",
    \[n\_hidden\_2, n\_hidden\_1\], initializer=tf.contrib.layers.xavier\_initializer(seed=42))  b2
    \= tf.get\_variable("b2", \[n\_hidden\_2, 1\], initializer=tf.zeros\_initializer())  W3
    \= tf.get\_variable("W3", \[n\_classes, n\_hidden\_2\], initializer=tf.contrib.layers.xavier\_initializer(seed=42))  b3
    \= tf.get\_variable("b3", \[n\_classes, 1\], initializer=tf.zeros\_initializer())  \#
    Store initializations as a dictionary of parameters  parameters \= {  "W1": W1,  "b1":
    b1,  "W2": W2,  "b2": b2,  "W3": W3,  "b3": b3  }  return parameters  }    def
    forward\_propagation(X, parameters):  \# X is the input placeholder, i.e. size
    of input and parameters are dictionary of parameters that  #we have defined in
    last function.  \# Retrieve parameters from dictionary  W1 \= parameters\[''W1''\]  b1
    \= parameters\[''b1''\]  W2 \= parameters\[''W2''\]  b2 \= parameters\[''b2''\]  W3
    \= parameters\[''W3''\]  b3 \= parameters\[''b3''\]  #forward propagation, Z represents
    matrix multiplication and addition of bias value whereas  #as A represents implementation
    of activation function and integer associated with character  #represents layer
    no.    Z1 \= tf.add(tf.matmul(W1,X), b1)  A1 \= tf.nn.relu(Z1)  Z2 \= tf.add(tf.matmul(W2,A1),
    b2)  A2 \= tf.nn.relu(Z2)  Z3 \= tf.add(tf.matmul(W3,A2), b3)  return Z3  def
    compute\_cost(Z3, Y):  \# compute loss between predicted output Z3 and final output
