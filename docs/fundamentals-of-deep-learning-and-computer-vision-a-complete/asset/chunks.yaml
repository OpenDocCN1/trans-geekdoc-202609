  fmt: "\n# Assign value\n\nTensorFlow provides a technique to assign a value to variables.\
    \ We can use the function `Variable.assign()` to change the value of variables.\
    \ Let’s get familiarize with this function using few examples.\n\n```python\n\
    import tensorflow as tf\na = tf.Variable(4)\na.assign(6)\nwith tf.Session() as\
    \ sess:\n    sess.run(a.initializer)\n    print(sess.run(a))\n```\n\nWhen we run\
    \ this code, it will return 4 as an output that means `a.assign(6)` does not come\
    \ into effect. For this operation to come into effect `Variable.assign()` should\
    \ always run in session. \n\n```python\nimport tensorflow as tf\na = tf.Variable(4)\n\
    assign_to_a = a.assign(6)\nwith tf.Session() as sess:\n    sess.run(assign_to_a)\n\
    \    print(sess.run(a))\n```\n\nNow after execution, this code will return output.\
    \ Note that `a` is not initialized in this code still, it works because it is\
    \ done by `assign()` operation. In fact, if we analyze the initializer operation,\
    \ we can say that initializer operation was implementing the same thing as this\
    \ `assign` operation does. Think, initializer operation also assigns initial values\
    \ of the variable to the variable itself.\n\nLet’s see another example.\n\n```python\n\
    import tensorflow as tf\nvar = tf.Variable(4)\nvar_plus_2 = var.assign(var + 2)\n\
    initializer = tf.global_variables_initializer()\nwith tf.Session() as sess:\n\
    \    sess.run(initializer)\n    print(sess.run(var_plus_2))\n    print(sess.run(var_plus_2))\n\
    ```\n\nOutput of this code is 6 and In this example, if we put `var_plus_2` in\
    \ `sess.run()` without initializing `var` then it shows an error because the value\
    \ of `var_plus_2` depends on `var`. Hence, `var` need to initialize first.\n\n\
    To add and subtract to variable, TensorFlow provides operations like `tf.Variable.assign_add()`\
    \ and Note that unlike `tf.Variable.assign_add()` and `tf.Variable.assign_sub()`\
    \ methods do not initialize the variable because output these operations takes\
    \ initial value of variables as inputs. In each Session, data remains separate.\
    \ Suppose we have created a variable in graph, now if we execute the graph under\
    \ different Sessions then each session can have different value for variable.\
    \ Let’s understand this with an example.\n\n```python\nimport tensorflow as tf\n\
    a = tf.Variable(4)\nsess1 = tf.Session()\nsess2 = tf.Session()\nsess1.run(a.initializer)\n\
    sess2.run(a.initializer)\nprint sess1.run(a.assign_add(1))\nprint sess2.run(a.assign_add(2))\n\
    print sess1.run(a.assign_sub(10))\nprint sess2.run(a.assign_sub(2))\nsess1.close()\n\
    sess2.close()\n```\n\nWhen we run this code, it will return output -5 and We can\
    \ see variable `a` have different values under different session.\n\n# Name scopes\n\
    \nSo far, we have discussed the basic concepts and implementation of TensorFlow\
    \ graph. Till now, we have discussed small computational graph having fewer nodes\
    \ and small tensor object, but when we build model for the practical application,\
    \ we have to deal with large graph with hundreds of nodes and million parameters.\
    \ While dealing with a large and complex graph, we prefer to group nodes hierarchically\
    \ with the unique identification. Hence, it helps to manage large graph by observing\
    \ it in chunks. TensorFlow provides such mechanism called name scopes, which helps\
    \ to manage large graphs. Name scope is easy to use and provide good insight while\
    \ visualizing graph in TensorBoard. Using name scopes, we can arrange nodes into\
    \ larger blocks. When we use TensorBoard, we can see all operation encapsulated\
    \ in their respective scope names. We can start using name scopes by implementing\
    \ this line, with.\n\nLet’s understand name scopes with an example.\n\n```python\n\
    import tensorflow as tf\nwith tf.name_scope(\"1st_scope\"):\n    a = tf.multiply(6,\
    \ 4, name=\"multiply1\")\n    b = tf.add(a, 6, name=\"add1\")\n    with tf.name_scope(\"\
    2nd_scope\"):\n        c = tf.multiply(4, 5, name=\"multiply2\")\n        d =\
    \ tf.add(c, 10, name=\"add2\")\n        e = tf.div(b, d, name=\"output\")\nsess\
    \ = tf.Session()\nwriter = tf.summary.FileWriter(\"output\")\nsess.run(e)\nwriter.close()\n\
    ```\n\n`with tf.name_scope(\"1st_scope\"):`\nThis line creates first box named\
    \ `1st_scope` and corresponding operations is grouped under this name scope.\n\
    `with`\nThis line creates second box named and corresponding operations grouped\
    \ under this name scope. \n\nWhen we run this code, it will return 1 as an output.\
    \ Let’s visualize the graph with TensorBoard. Figure 1.14 and 1.15 represent the\
    \ graph shown in TensorBoard:\n\n![](image-uje4tc1g.jpg)\nFigure 1.14\n\nWhen\
    \ we see TensorBoard graph, it will not show each operation. This figure shows\
    \ that nodes are grouped in `1st_scope` and When we double-click on plus (`+`)\
    \ icon in both name scope box, it will expand and resemble Figure\n\n![](image-4iimvpr1.jpg)\n\
    Figure 1.15\n\nIn the preceding figure, we can easily see individual operation.\
    \ Let’s see another example of name scope.\n\n```python\nimport tensorflow as\
    \ tf\nimport numpy as np\ng = tf.Graph()\nwith g.as_default():\n    input_1 =\
    \ tf.placeholder(tf.float32, shape=None, name=\"input_1\")\n    input_2 = tf.placeholder(tf.float32,\
    \ shape=None, name=\"input_2\")\n    const = tf.constant(4, name=\"constant\"\
    )\n    with tf.name_scope(\"Chain\"):\n        with tf.name_scope(\"LayerA\"):\n\
    \            LA_sub = tf.subtract(input_1, const)\n            LA_output = tf.div(input_1,\
    \ LA_sub)\n        with tf.name_scope(\"LayerB\"):\n            LB_sub = tf.subtract(input_2,\
    \ const)\n            LB_output = tf.div(input_2, LB_sub)\n        with tf.name_scope(\"\
    LayerC\"):\n            LC_max = tf.add(LA_output, LB_output)\n            LC_output\
    \ = tf.multiply(LC_max, const)\n        with tf.name_scope(\"LayerD\"):\n    \
    \        LD_max = tf.add(LC_output, LB_output)\n            LD_output = tf.multiply(LD_max,\
    \ const)\n        output = tf.add(LC_output, LD_output)\nvar_1 = np.array([8])\n\
    var_2 = np.array([6])\ninitialize_operation = tf.global_variables_initializer()\n\
    sess = tf.Session(graph=g)\nsess.run(initialize_operation)\nwriter = tf.summary.FileWriter(\"\
    output\", graph=g)\nprint(sess.run(output, feed_dict={input_1: var_1, input_2:\
    \ var_2}))\nwriter.close()\n```\n\nWhen we run this code, it will return output.\
    \ Figure represents a high-level overview of the previous example. When we click\
    \ on plus (`+`) icon in name scope named chain, it will show four more name scope\
    \ arranged in two layers. LayerA and LayerB are comprised in the first layer.\
    \ Output of LayerA and LayerB is passed to LayerC and LayerD in next layer. Finally,\
    \ the last node uses output of the second layer as an input. This example gives\
    \ us another way to visualize the graph. In Figure we can see that color of name\
    \ scopes in the first layer are the same and similar case can be observed in the\
    \ second layer.\n\n![](image-mank6gap.jpg)\nFigure 1.16\n\n![](image-wgu2mpxp.jpg)\n\
    Figure 1.17\n"
  trans: "\n\n# 给变量赋值\n\nTensorFlow 提供了一种为变量进行赋值的技巧。我们可以使用 `Variable.assign()` 函数来改变变量的值。让我们通过几个示例来熟悉这个函数。\n\
    \n```python\nimport tensorflow as tf\na = tf.Variable(4)\na.assign(6)\nwith tf.Session()\
    \ as sess:\n    sess.run(a.initializer)\n    print(sess.run(a))\n```\n\n当我们运行这段代码时，它将返回\
    \ 4 作为输出，这意味着 `a.assign(6)` 没有生效。为了让此操作生效，`Variable.assign()` 应该始终在 session 中运行。\n\
    \n```python\nimport tensorflow as tf\na = tf.Variable(4)\nassign_to_a = a.assign(6)\n\
    with tf.Session() as sess:\n    sess.run(assign_to_a)\n    print(sess.run(a))\n\
    ```\n\n现在执行后，这段代码将返回输出。注意，在此代码中 `a` 仍然没有初始化，它之所以能工作是因为是由 `assign()` 操作完成的。事实上，如果我们分析初始化操作，可以认为初始化操作实现的内容与此\
    \ `assign` 操作所做的相同。思考，初始化操作也将变量的初始值赋值给变量本身。\n\n让我们看另一个示例。\n\n```python\nimport\
    \ tensorflow as tf\nvar = tf.Variable(4)\nvar_plus_2 = var.assign(var + 2)\ninitializer\
    \ = tf.global_variables_initializer()\nwith tf.Session() as sess:\n    sess.run(initializer)\n\
    \    print(sess.run(var_plus_2))\n    print(sess.run(var_plus_2))\n```\n\n这段代码的输出是\
    \ 6。在这个示例中，如果我们在不初始化 `var` 的情况下在 `sess.run()` 中放入 `var_plus_2`，将会报错，因为 `var_plus_2`\
    \ 的值依赖于 `var`。因此，`var` 需要先初始化。\n\n为了对变量进行加减法，TensorFlow 提供了如 `tf.Variable.assign_add()`\
    \ 等操作。注意，`tf.Variable.assign_add()` 和 `tf.Variable.assign_sub()` 方法不会初始化变量，因为这些操作的输出需要变量的初始值作为输入。在每个\
    \ Session 中，数据是保持分离的。假设我们在图中创建了一个变量，现在我们在不同的 Sessions 下执行图，那么每个 session 都可以有不同的变量值。让我们通过示例来理解这一点。\n\
    \n```python\nimport tensorflow as tf\na = tf.Variable(4)\nsess1 = tf.Session()\n\
    sess2 = tf.Session()\nsess1.run(a.initializer)\nsess2.run(a.initializer)\nprint\
    \ sess1.run(a.assign_add(1))\nprint sess2.run(a.assign_add(2))\nprint sess1.run(a.assign_sub(10))\n\
    print sess2.run(a.assign_sub(2))\nsess1.close()\nsess2.close()\n```\n\n当我们运行这段代码时，它将返回输出\
    \ -5，我们可以看到变量 `a` 在不同的 session 下不同的值。\n\n# 名称作用域 (Name scopes)\n\n到此为止，我们讨论了 TensorFlow\
    \ 图的基本概念和实现。目前，我们讨论的是节点较少、张量对象较小的计算图，但在为实际应用构建模型时，我们必须处理具有数百个节点和数百万参数的大型图。在处理大型且复杂的图时，我们倾向于使用唯一标识对节点进行分级分组。因此，这有助于通过分块观察来管理大型图。TensorFlow\
    \ 这种名为名称作用域（name scopes）的机制，有助于管理大型图。名称作用域易于使用，并在 TensorBoard 可视化时提供良好的洞察。通过名称作用域，我们可以将节点排列成块。当我们使用\
    \ TensorBoard 时，我们可以看到所有封装在各自作用域名称中的操作。我们可以通过实现这一行 `with` 来开始使用名称作用域。\n\n让我们通过示例来理解名称作用域。\n\
    \n```python\nimport tensorflow as tf\nwith tf.name_scope(\"1st_scope\"):\n   \
    \ a = tf.multiply(6, 4, name=\"multiply1\")\n    b = tf.add(a, 6, name=\"add1\"\
    )\n    with tf.name_scope(\"2nd_scope\"):\n        c = tf.multiply(4, 5, name=\"\
    multiply2\")\n        d = tf.add(c, 10, name=\"add2\")\n        e = tf.div(b,\
    \ d, name=\"output\")\nsess = tf.Session()\nwriter = tf.summary.FileWriter(\"\
    output\")\nsess.run(e)\nwriter.close()\n```\n\n`with tf.name_scope(\"1st_scope\"\
    ):`\n这一行创建了名为 `1st_scope` 的第一个框，相应的操作被分组在该名称作用域下。\n`with`\n这一行创建了名为（此处）的第二个框，相应的操作被分组在该名称作用域下。\n\
    \n当我们运行这段代码时，它将返回 1 作为输出。让我们用 TensorBoard 可视化图。图 1.14 和 1.15 代表 TensorBoard 中所示的图：\n\
    \n![](img/image-uje4tc1g.jpg)\n图 1.14\n\n当我们查看 TensorBoard 图时，它不会显示每个操作。此图显示节点被分组在\
    \ `1st_scope` 中，当双击两个名称作用域框中的加号 (`+`) 图标时，它会展开并类似于图：\n\n![](img/image-4iimvpr1.jpg)\n\
    图 1.15\n\n在前面的图中，我们可以很容易看到单独的操作。让我们看名称作用域的另一个示例。\n\n```python\nimport tensorflow\
    \ as tf\nimport numpy as np\ng = tf.Graph()\nwith g.as_default():\n    input_1\
    \ = tf.placeholder(tf.float32, shape=None, name=\"input_1\")\n    input_2 = tf.placeholder(tf.float32,\
    \ shape=None, name=\"input_2\")\n    const = tf.constant(4, name=\"constant\"\
    )\n    with tf.name_scope(\"Chain\"):\n        with tf.name_scope(\"LayerA\"):\n\
    \            LA_sub = tf.subtract(input_1, const)\n            LA_output = tf.div(input_1,\
    \ LA_sub)\n        with tf.name_scope(\"LayerB\"):\n            LB_sub = tf.subtract(input_2,\
    \ const)\n            LB_output = tf.div(input_2, LB_sub)\n        with tf.name_scope(\"\
    LayerC\"):\n            LC_max = tf.add(LA_output, LB_output)\n            LC_output\
    \ = tf.multiply(LC_max, const)\n        with tf.name_scope(\"LayerD\"):\n    \
    \            LD_max = tf.add(LC_output, LB_output)\n                LD_output\
    \ = tf.multiply(LD_max, const)\n        output = tf.add(LC_output, LD_output)\n\
    var_1 = np.array([8])\nvar_2 = np.array([6])\ninitialize_operation = tf.global_variables_initializer()\n\
    sess = tf.Session(graph=g)\nsess.run(initialize_operation)\nwriter = tf.summary.FileWriter(\"\
    output\", graph=g)\nprint(sess.run(output, feed_dict={input_1: var_1, input_2:\
    \ var_2}))\nwriter.close()\n```\n\n当我们运行这段代码时，它将返回输出。图展示了之前示例的高级概览。当我们点击名为 chain\
    \ 的名称作用域中的加号 (`+`) 图标时，它将显示出排列两层的四个名称作用域。LayerA 和 LayerB 组成第一层。LayerA 和 LayerB\
    \ 的输出传递给下一层的 LayerC 和 LayerD。最后，最后一个节点使用第二层的输出作为输入。这个示例为我们提供了另一种可视化图的方法。在图中我们可以看到第一层名称作用域的颜色是相同的，第二层也可以观察到类似的情况。\n\
    \n![](img/image-mank6gap.jpg)\n图 1.16\n\n![](img/image-wgu2mpxp.jpg)\n图 1.17\n\
    \n"
