    # AlexNet


    AlexNet 与现代架构相比，布局虽然简单，但它对卷积神经网络（CNN）及其在计算机视觉问题中的应用产生了浓厚兴趣。它由多伦多大学的 `Alex Krizhevsky`、`Geoffrey
    Hinton` 和 `IlyaSutskever` 在 2012 年作为 ImageNet 挑战赛（一项专注于图像分类的年度竞赛）的一部分设计。与传统方法相比，它显著提高了
    ImageNet 的分类准确率。


    AlexNet 由 5 个卷积层和随后的 3 个全连接层组成，如图所示。与之前使用的标准激活函数（如 `Tanh` 或 `sigmoid`）不同，它使用了
    `ReLu`（整流线性单元）激活函数，这有助于解决梯度消失问题（在“神经网络引论”章节中讨论）；因此随后导致了更快的训练速度。为了防止过拟合并确保模型的泛化能力，AlexNet
    在第一和第二个全连接层之前使用了 `drop out`。


    ![](img/image-4qcubi5o.jpg) 图 4.2: AlexNet 架构

    https://www.learnopencv.com/wp-content/uploads/2018/05/AlexNet-1.png


    # VGG Net


    VGG Net 由牛津大学的视觉几何组（Visual Geometry Group）首次提出，其特点是仅使用堆叠的 `3 × 3` 卷积层，而如图所示，AlexNet
    在前两个卷积层使用了 `11 × 11` 和 `5 × 5` 大小的卷积核。


    VGG Net 非常有吸引力，因为它具有统一的架构和 `3 × 3` 的小滤波器，这有助于减少参数的总数。具有相同滤波器尺寸的被多次应用。然而，由于 VGG
    Net 在不同层中使用了许多此类滤波器，参数数量仍然很大，有时由于计算量巨大而变得非常难以处理。以下图像关于不同深度的：


    ![](img/image-nx0216dj.jpg) 图 4.3: 不同深度的 VGG 网络


    # GoogLeNet/Inception 网络


    在讨论并理解了两个重要的经典网络——`AlexNet` 和 `VGGNet-16` 之后，让我们讨论一下 2014 年 ImageNet 挑战赛的冠军架构
    `GoogLeNet/Inception Network`，它已被证明 CNN 架构领域的一个重要里程碑。


    在我们之前讨论的架构中，其核心思想是让网络更深，其底层假设是更深的网络始终会带来更好的性能。但更深的网络也有自己的缺点，首要问题就是梯度消失问题，这使得网络的前几层难以学习。随着层数的增加，可训练参数（权重）的数量也会激增，导致训练在内存和时间上的计算代价都非常昂贵。此外，深层网络容易过拟合；因此，它们的泛化能力不好。


    `GoogLeNet` 的网络架构建立之前的经典架构之上，并利用了下文讨论的一些新技术来处理上述问题。


    ## 1 X 1 卷积


    尽管 `1 X 1 卷积` 最初在论文 `Network in Network` 中作为一种引入非线性的技术引入，但在 `GoogLeNet` 中被用降维模块来减少计算。


    让我们先理解 `1X1 卷积` 是做什么的：


    ![](img/image-gh3f.jpg) 图 4.4: 1X1 卷积

    如图所示`1 X 1 卷积` 并没有太大意义。但当我们考虑它时，它增加了网络的深度。


    ![](img/image-b5gp.jpg) 图 4.5: 用于 3D 的 1 X 1 卷积

    现在，让我们尝试理解 `1 X 1` 如何提供帮助：


    ![](img/image-yshzd3.jpg) 图 4.6: 1 X 1 卷积

    ![](img/image-bl97zs.jpg) 图 4.7: 不使用 1 卷积


    在这里应该注意的是，池化层（在上章中讨论）也减少了参数数量，但通道数保持不变。


    ## Inception 模块


    使用 Inception 模块的理念是使用不同尺寸的卷积来捕捉不同尺度的信息。从图中看到，不同尺寸的 `1 X 1`、`3 X 3` 和 `5 X 5` 卷积被用于从上一层提取所有特征。图中黄色框中的
    `1 X 1` 卷积起到了前面所述的限制输入通道以减少计算的作用。


    ![](img/image-xri22uz.jpg) 图 4.8: Inception 模块


    ## 全局平均池化层


    在上述讨论的架构和上一章中，网络末尾使用了全连接层：


    ![](img/image-gtfpual.jpg) 图 4.9: 全连接层与全局平均池化


    从图中可以看出，在全连接情况下，所有输入都连接到每个输出，导致需要训练 `7 * 7 * 1024 * 1024` 个权重（两层之间的连接总数）。


    而在全局平均池化情况下，每个 `7 X 7` 切片都通过平均池化所有 `7 X 7` 值映射到 `1 X 1`，从而创建了一组 `1024` 个值，不需要估计参数，不像全连接层的情况。因此，它节省了大量的计算。这种平均池化的简单技巧将顶-1
    准确率提高了约 0.6%。


    # ResNets


    在理想情况下，随着层数的增加，模型准确率应该提高。但在所有实际应用中并非如此，由于深度的增加，早期层无法从网络末端接收到改变权重所需的信息——这就是梯度消失问题。因此，如图
    4.11 所示，训练误差在特定深度之后开始增加——这通常被称为退化问题。


    ResNets 由微软研究院在 2015 年作为 ImageNet 2015 挑战赛的一部分引入，并超越了所有之前的基准，残差网络在很大程度上解决了退化问题，并通过训练非常深的神经网络获得了准确率。


    ![](img/image-0t4dxyle.jpg) 图 4.11: 深度网络中的退化问题


    '
