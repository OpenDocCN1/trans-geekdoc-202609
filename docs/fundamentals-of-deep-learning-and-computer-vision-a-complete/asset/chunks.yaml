    this opportunity to publish our book. We are also grateful to all our colleagues
    at our respective organizations. At last, we thank our critics for their valuable
    inputs to give final shape to this book.


    ## Preface

    In recent years, there has been commendable progress made in the field of Computer
    Vision i.e. how machines see, process, analyze and interpret images, with advancements
    in deep learning - a technique which makes it possible for the computers to learn
    by example. This has opened up new opportunities and Computer Vision is now being
    used for various purposes from medical imaging to driverless cars to SnapChat''s
    filters. This book discusses the fundamental concepts of Computer Vision and Deep
    Learning which form the basis of all such applications. The book is divided into
    5 chapters and provides a lucid and intuitive explanation of the core concepts
    of computer vision and deep learning.


    - **Chapter 1** introduces the deep learning framework - `TensorFlow` and discusses
    its fundamental concepts.

    - **Chapter 2** discusses the core concept of Deep Learning - neural networks
    along with other related concepts such as loss functions, gradient descent optimization,
    activation functions and how backpropagation works for training multi-layer perceptrons.

    - **Chapter 3** introduces the convolution operation before moving on to the convolutional
    neural networks and thereafter describes different building blocks of the `CNN`
    architecture such as kernel size, stride, padding, and pooling and how to build
    a small `CNN` model.

    - **Chapter 4** discusses different popular `CNN` architectures such as `AlexNet`,
    `VGGNet`, `Inception`, and `ResNets` along with different object detection algorithms
    such as `RCNN`, `SSD`, and `YOLO`.

    - **Chapter 5** discusses sequential models, such as `RNN`, `GRU`, and `LSTMs`,
    their architectures and their applications in machine translation, image/video
    captioning and video classification.


