    _operation)  writer \\= tf.summary.FileWriter(“output”, graph=g)  print(sess.run(output,\
    \ feed\\_dict={input\\_1: var\\_1, input\\_2:  var\\_2}))  writer.close()    When\
    \ we run this code, it will return output Let’s understand this graph in Figure\
