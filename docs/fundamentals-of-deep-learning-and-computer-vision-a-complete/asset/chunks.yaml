    \ value for the next iteration.\n\nNow, we will see how parameters at hidden layer\
    \ effects outputs. At hidden layer, we have weights `w` and `b`. To establish\
    \ dependency between hidden units and cost function, we will use a similar approach\
    \ but little complex because we can see that the hidden units are connected with\
    \ both the output units, which will affect both the output values. Let’s understand\
    \ how `w` affects `E` ![](image-rjy13y17.jpg). We will consider both terms on\
    \ the right-hand side one by one. First, we will work on `dE/dout`. Using the\
    \ chain rule, we can write that: ![](image-pnbxk4z4.jpg). Similarly, we will get\
    \ the value for `dE/dout2` ![](image-uyyk940k.jpg). Now, to establish the relation\
