    # 3D 图像中的卷积


    好了，到目前为止我们讨论了针对 2D 数据（如 2D 图像）的卷积。现在让我们将这些概念扩展到 3D 数据，例如 RGB（彩色）图像。我们知道 3D 输入由
    3 层组成，每层都是 2D 的，它们一个接一个堆叠在一起，如图所示。为了对 3D 输入进行卷积，卷积核（kernel）也应该是 3D 的。通常情况下，我们可以说如果输入是
    `n` 维的，那么为了执行卷积，卷积核也应该是 `n` 维。让我们通过一个由 3 个通道 `R`、`G` 和 `B` 组成的 3D 输入以及深度为 `3`
    的卷积核来理解这一点。这意味着输入的大小为 `m × n × 3`，卷积核的大小为 `k × l × 3`。可以看到输入和卷积核的深度是相同的。通常我们可以写，如果输入的大小为
    `m × n × d`，那么为了执行卷积，卷积核的大小应该是 `k × l × d`，其中 `k` 和 `l` 通常比 `m` 和 `n` 分别小几个级数。


    ![](img/image-e9rsbtfg.jpg)

    图 3.38：3D 图像的 RGB 层示例


    ## 为什么我们要保持输入矩阵和卷积核的深度一致？


    在卷积中，我们在输入和卷积核之间进行逐元素乘法。为了对 `N` 维输入执行卷积操作，需要一个 `N` 维的滤波器（filter），以便在每一层执行逐元素操作。如果我们选择的滤波器的深度小于或大于输入的深度，将导致维度不匹配错误。将滤波器层与输入图像的一层进行卷积是一个标准准则，如图所示。为了从输入图像中提取更多特征，我们通常在卷积核的每一层保留不同的值。我们可以在每层保留相同的值，或者使用相同的层作为堆叠，但这样滤波器产生的输入特征表示将非常稀疏，而我们知道稀疏性意味着信息较少。


    现在，输入和过滤器之间的卷积将产生与每层对应的 2D 输出，如图所示。蓝色方块表示输入层，绿色方块表示滤波器的不同层，紫色方块表示滤波器层与对应输入层之间卷积操作的结果，最后，黄色方块表示堆叠的紫色方块。为了获得最终的
    2D 卷积输出，我们沿着深度将每层的值相加，得到如图所示的输出。在我们的案例中，黄色方块中的值将沿深度求和，产生如图所示的单个 2D 输入。通常，我们使用多个相同大小和深度的卷积核来学习输入特征。如前所述，每个卷积核产生一个
    2D 输出；因此，使用多个卷积核会产生多个 2D 输出，它们一个接一个堆叠在一起，如图 3.42 所示，并且这种堆叠输出作为下一层的输入，依此类推。我们将通过图表更详细地讨论架构。


    ![](img/image-kfxt19xy.jpg)

    图 3.39：蓝色方块（输入层）、绿色方块（滤波器层）、紫色方块（卷积操作的结果）和黄色方块（堆叠的紫色方块）。


    ![](img/image-cdvc95rz.jpg)

    图 3.40：大小为 `6x6x3` 的输入与大小为 `3x3x3` 的滤波器进行卷积，产生 `4x4` 矩阵作为输出。


    在图 3.41 中显示了一个通用框图，其中 3D 输入与多个 3D 滤波器（代表所使用的滤波器数量）进行卷积，并给出多维输出。输出的深度（通道数）取决于所使用的滤波器数量。我们可以通过图
    3.43 中的示例进行更深入的理解，图中大小为 `6 x 6 x 5` 的输入与 2 个大小为 `1 x 1 x 5` 的滤波器进行卷积，产生大小为 `6
    x 6 x 2` 的输出。输出的每一层都对应于输入与每个滤波器的卷积结果。让我们看看图 3.43 中的另一个示例，它只是之前图的扩展。它展示了我们如何从每个滤波器获取独立的
    2D 卷积输出，并将这些输出堆叠在一起形成最终输出。


    ![](img/image-wigsjmgw.jpg)

    图 3.41：输入和滤波器的卷积操作概览。


    图 3.42 是上幅图的扩展表示，为了更好的视觉效果，它展示了具有多个滤波器分离表示的单层卷积操作的概览。


    ![](img/image-tx00i0bp.jpg)

    图 3.42：输入与多个滤波器卷积并产生多维输出。


    图 3.43 展示了对大小为 `6 x 6 x 5` 的输入图像（最左侧）使用 2 个大小为 `1 x 1 x 5` 的滤波器（中间图像）进行卷积，产生大小为
    `6 x 6 x 2` 的输出（最右侧图像）：


    ![](img/image-3vsq024w.jpg)

    图 3.43：卷积操作示例


    图 3.44 展示了对大小为 `6 x 6 x 3` 的输入图像使用 2 个大小为 `3 x 3 x 3` 的滤波器进行更详细的卷积操作，产生大小为 `4
    x 4 x 2` 的输出：


    ![](img/image-bmydu4bd.jpg)

    图 3.44：卷积操作示例。最左图像是输入图像，下一个图像表示使用的滤波器，下一个图像显示每个滤波器的输出，最右侧图像表示最终输出。


    我们已经讨论了三维输入的卷积。现在，让我们讨论如何构建单层：


    ![](img/image-8wiphpl.jpg)

    图 3.45a：单层的卷积操作


    ![](img/image-qpm9ac.jpg)

    图 3.45b：卷积操作后的最终堆叠输出。图 3.45a 表示简单的卷积层。我们可以看到，在获得最终输出之前添加了偏置（bias）值，然后为了应用非线性使用了
    `ReLU` 函数。相同的偏置值被添加到上方矩阵的每个值。同样，相同的偏置值被添加到底部矩阵的每个值。最后，最右侧的方矩阵将堆叠在一起形成最终输出。因此，这种对不同输出添加偏置和非线性函数并将这些输出堆叠在一起的过程就是卷积层。


    ## CNN 中使用的符号


    让我们回顾一个 MLP 的层，然后我们将尝试将 CNN 的层映射到前馈网络的层。我们可以这样写前馈网络的第一层：


    ![](img/image-hxmcbk43.jpg)


    然后应用非线性：


    ![](img/image-9tmxzvlr.jpg)


    如果我们类比，可以将它们视为输入数据、第一层使用的滤波器、如图所示的第二个右侧矩阵，以及如图所示的堆叠输出。好了，我们已经看到了 CNN 的层，但还没有讨论参数的数量。让我们看看单层。如果我们有
    10 个大小为 `3 x 3 x 3` 的滤波器，那么这一层有多少参数？由于滤波器的大小为 `3 x 3 x 3`，一个滤波器的元素总数为 27，外加一个偏置值。因此，最终参数数量为
    28。由于我们正在寻找 10 个滤波器，这 10 个滤波器的总参数数量为 280。我们可以看到，无论图像有多大，10 个滤波器的参数数量都保持不变。让我们看看描述卷积神经网络层使用的符号。对于任何层


    ![](img/image-g3bcdwdk.jpg)


    现在我们熟悉了 CNN 相关的术语，并讨论了卷积层。接下来，让我们讨论 CNN 的架构。


    '
