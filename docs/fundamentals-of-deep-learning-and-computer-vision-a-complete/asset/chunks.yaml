    # 平移等变 (Translation Equivariance)


    好的，现在让我们讨论另一个名为平移等变的属性。如果输入特征的变化导致输出发生等效的变化，我们可以说一个函数具有等变性。在数学上，如果一个函数满足 $f(g(x))
    = g(f(x))$，则称该函数对于 `g` 是等变的。例如，如果输入模式 `0, 0, 4, 3, 0` 产生输出 `0, 0, 1, 0`，那么模式 `0,
    4, 3, 0, 0` 可能会产生 `0, 1, 0, 0`。


    卷积操作与平移具有交换律，这意味着如果 `T` 是一个平移任意函数的算子，例如 $T(x) = f(x-y)$（其中 $y$ 是函数 $f$get $y$
    的平移），那么对于任意两个函数 $f$ 和 $g$，我们可以写道：


    $T(f * g) = (Tf) * g$ ![](img/image-iq59xlzr.jpg)


    让我们通过例子来理解这一点。设 `I` 是一个返回每个位置像素值的函数，`g` 是任意将像素从一个图像映射到另一个图像的函数，使得 $g(x) = x+y$，其中
    `g` 是平移算子，使得 $Tg(x) = f(x-y)$。函数 `g` 按单位位移 `I` 的每一个像素。现在，如果满足以下条件，`I` 和 `g` 将是相互等变的：


    $g(I * f) = (gI) * f$ ![](img/image-xa95r5k7.jpg)


    这意味着，如果我们先应用卷积再应用平移操作，其输出将与先应用平移操作再应用卷积的输出是相同的。平移等变的例子如图所示。在这个例子中，图 3.22 代表输入图像，3.23
    和 3.24 代表输出图像：


    ![](img/image-8yzwbn6u.jpg) 图 3.22: 输入图像


    在图中，首先执行卷积然后应用平移；而在另一图中，首先执行变换然后应用卷积。我们可以看到，在两种情况下我们都得到了相同的输出。使用拉普拉斯卷积核（Laplacian
    kernel）执行了卷积操作。


    ![](img/image-fbpeg4l7.jpg) 图 3.23: 卷积后平移


    ![](img/image-w1yqru2f.jpg) 图 3.24: 平移后卷积


    我们 MLP 和卷积网络中利用稀疏连接和参数共享，但我们可以看到，使用 CNN 实现这些特征比 MLP 更容易。在 3D 输入的情况下，在 CNN 中实现上述这些重要特征比在
    MLP 中要复杂得多。


    我们已经讨论了前馈网络的局限性、CNN 如何帮助克服这些问题、在 2D 图像上如何进行卷积，以及我们如何利用 CNN 利用一些其他重要特征。现在，我们将更形象性地讨论卷积，以及如何在
    3D 图像上执行卷积。


    # 步长 (Stride)


    在本节中，我们将讨论如何使用填充（padding）来解决图 3.18 所示的问题；我们还将讨论步长的概念。首先，我们从“步长”开始。图中展示了大小为 5 ×
    5 的输入矩阵与大小为 3 × 3 的滤波器之间的卷积。在那个例子中，滤波器通过每次移动 1 个单位与输入矩阵进行卷积。步长定义为滤波器在每一步之后所移动的位移量。例如，如图所示滤波器移动
    1 个单位，因此步长为 1，但步长可以大于 1。


    在书中，卷积核（kernel）、滤波器（filter）和特征检测器（feature detector）将通用使用。在很多书中，我们经常看到“感受野”（receptive
    field）一词的使用。它可以定义为卷积核与输入矩阵之间连接的空间范围。随着卷积核的移动，感受野也移动。因此，如果卷积核的大小是 $n \times n$，那么感受野的大小也是
    $n \times n$。


    让我们通过例子来看步长的影响。假设一个大小为 7 × 7 的输入矩阵与大小为 3 × 3 的滤波器在步长为 1 的情况下进行卷积。这种卷积产生如图所示大小为
    5 × 5 的输出矩阵


    ![](img/image-jpyww7wg.jpg) 图 3.25: 步长为 1 的卷积。颜色框表示感受野。不同的颜色框代表不同位置的感受野。


    现在，对于相同的输入和卷积核，让我们尝试步长 2。现在，感受野每次移动 2 个单位。我们从图 3.26 中看到它产生大小为 3 × 3 的输出。我们可以说，随着步数的增加，输出尺寸也会缩小。


    ![](img/image-fjg2sr6n.jpg) 图 3.26: 步长为 2 的卷积。颜色框表示感受野。不同的颜色框代表不同位置的感受野。


    现在，如果我们使用步长 3 会怎样？图中显示，如果我们再移动一次卷积核，感受野的空间就会超出输入矩阵的空间。通常情况下，我们选择步长值使得输出矩阵的大小保持整数而不是分数，这意味着是全卷积而不是部分卷积。


    ![](img/image-a4sige3w.jpg) 图 3.27: 步长为 3 的卷积。颜色框表示感受野。不同的颜色框代表不同位置的感受野。


    '
