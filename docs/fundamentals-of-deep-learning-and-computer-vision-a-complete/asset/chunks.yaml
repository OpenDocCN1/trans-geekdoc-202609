- raw: "  Backward pass    Alright, so far, we have discussed the importance of RNNs\
    \ and a few of its applications. Now, we will look into the learning process of\
    \ an RNN network. While discussing the learning process in feedforward networks\
    \ and CNNs, we have seen that given the partial derivatives of some differentiable\
    \ loss function L with respect to the network outputs, the next step is to determine\
    \ the derivatives with respect to the weights. We will extend the same concept\
    \ to RNNs and will also discuss any additional concepts required in the learning\
    \ process of RNNs. So, how are RNNs trained? Since now there is a temporal connection,\
    \ in addition to normal feedforward connections, the weights associated with normal\
    \ feedforward connections W can be learned using normal backpropagation algorithm.\
    \ For the temporal weights backpropagation has to be slightly modified to incorporate\
    \ the sequential factor. This algorithm is popularly known as backpropagation\
    \ through time (BPTT).    Let’s consider a vanilla RNN network shown in Figure\
    \ from equations 5.4 and 5.5, we can write hidden state and output at any time\
    \ instant t as:    ![](image-h0ilepfq.jpg)  Here, we consider the cross-entropy\
    \ loss between the correct label at time step and , the prediction of the network.\
    \ The total error is just the sum of the errors at each time step, and we consider\
