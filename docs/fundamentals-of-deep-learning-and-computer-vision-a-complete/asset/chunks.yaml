    # Virtual environment


    We can directly install software at machine level, but it has some disadvantages.
    Let’s understand how. Suppose we want to install a software `A` and it requires
    any other software `x` as part of the installation with version `1.0`. Now, for
    other programs we want to install software `B` which also require software `x`
    in installation but with version `2.0`. Now, if we use `B` then `A` will not work,
    and if we use `A` then `B` will not work due to the conflict in terms of dependency.
    The virtual environment helps to overcome this type of problems. In a virtual
    environment, we create a separate environment for the different version of the
    software and import that software locally in the code.


    To install `pip` and virtual environment, run the following command in Terminal.
    For Ubuntu Linux 64-bit, Python 3:


    ```bash

    $ sudo apt-get install python3-pip

    $ sudo pip3 install --upgrade virtualenv

    ```


    To install any software in a virtual environment, first, we will have to create
    virtual environment folder. We can make this folder in any directory but right
    now we will create virtual environment folder in the user’s home directory that
    is `~/` (or home directory). Let’s see how we can do it in terminal.


    ```bash

    $ cd

    $ mkdir envs

    $ cd envs

    $ Virtualenv

    ```


    ## Tensorflow (or any name we want)


    After completing these steps, we can see virtual environment named `TensorFlow`
    (depend on folder name used in command) in `envs` folder. To use this virtual
    environment folder, first, we will have to activate it. We can activate this folder
    by using the following commands in Terminal.


    ```bash

    $ source ~/activate\ envs/tensorflow/bin/

    ```


    Now we can see the change in the terminal, it will show `(tensorflow)`. After
    finishing the work, we will deactivate the virtual environment by using the following
    command.


    ```bash

    (tensorflow) $ deactivate

    ```


    We can avoid the above-mentioned steps to activate virtual environment folder
    by writing the following line in bash file, and next time, we will have to type
    only folder name, and it will get activated.


    `Alias tensorflow="source ~/env/tensorflow/activate"`


    After activating virtual environment, we can install `TensorFlow` using `pip`
    command.


    ### Python 2 and CPU:

    ```bash

    (tensorflow)$ pip install --upgrade tensorflow

    ```


    ### Python 3 and CPU:

    ```bash

    (tensorflow)$ pip3 install --upgrade tensorflow

    ```


    If we want to install `TensorFlow` for GPU, we can use the following commands:


    ### Python 2 and GPU:

    ```bash

    (tensorflow)$ pip install --upgrade tensorflow-gpu

    ```


    ### Python 3 and GPU:

    ```bash

    (tensorflow)$ pip3 install --upgrade tensorflow-gpu

    ```


    To check whether `TensorFlow` is installed or not, we will use traditional hello
    world example. Before executing code, make sure virtual environment is activated
    otherwise, it will throw an error messaging, `ImportError: No module named`.


    ```python

    import tensorflow as tf

    a = tf.constant("Hello world")

    sess = tf.Session()

    print(sess.run(a))

    ```


    It will return `Hello world`. Don’t worry about descriptions of the code, we will
    discuss it later in detail.


    To run a `TensorFlow` program on a GPU with a Nvidia GPU, we will need the `CUDA`
    toolkit `7.0` or greater. We can use the following commands.

    '
