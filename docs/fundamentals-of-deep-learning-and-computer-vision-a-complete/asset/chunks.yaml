    # 虚拟环境


    我们可以直接在机器层级安装软件，但这存在一些缺点。让我们了解一下原因。假设我们想要安装软件 `A`，它需要版本为 `1.0` 的其他软件 `x` 作为安装的一部分。现在，对于我们想要安装的另一个软件
    `B`，它也需要软件 `x` 进行安装，但版本要求为 `2.0`。现在，如果我们使用 `B`，那么 `A` 将无法工作；如果我们使用 `A`，那么 `B`
    将无法工作，这是因为依赖关系发生了冲突。虚拟环境有助于解决这类问题。在虚拟环境中，我们为不同版本的软件创建一个独立的环境，并在代码中本地导入该软件。


    安装 `pip` 和虚拟环境，请在终端中运行以下命令。适用于 Ubuntu Linux 64 位，Python 3：


    ```bash

    $ sudo apt-get install python3-pip

