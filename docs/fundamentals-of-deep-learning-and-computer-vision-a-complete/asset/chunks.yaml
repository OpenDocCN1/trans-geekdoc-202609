  fmt: "\n# Create TensorFlow graph\n\nTill now, we have discussed that each TensorFlow\
    \ operation is a node of a graph. But we have not created any graph explicitly\
    \ yet. So, how does this happen? When we import `TensorFlow` library as it automatically\
    \ creates a graph and assigned it as a default graph. Whenever we use any `TensorFlow`\
    \ operations it automatically becomes a node of the default graph. Let’s create\
    \ new graph called it `g_new`.\n\n## Creating a New Graph\n\nWe can create a new\
    \ graph using following lines of code.\n\n```python\nimport tensorflow as tf\n\
    g_new = tf.Graph()\n```\n\nUsing the above line, we have created a new graph.\
    \ We can check that default graph is created after importing `TensorFlow` library\
    \ and we can also check whether a new graph is created or not.\n\n```python\n\
    import tensorflow as tf\ng_new = tf.Graph()\nprint(g_new)\nprint(tf.get_default_graph())\n\
    ```\n\nWhen we run this code in Jupyter Notebook or in Python files, we can see\
    \ the following output:\n\n`object at 0x7fb2687bf050>`\n`object at 0x7fb2a4b64e90>`\n\
    \nThis confirms that both new graph and default graph is created.\n\n## Node Association\n\
    \nAs we discussed, when we use new `TensorFlow` operation and assigned to a variable,\
    \ this variable automatically assigned under default graph until we explicitly\
    \ assigned this operation under the desired graph. We can validate our arguments\
    \ by checking the association of nodes with a graph.\n\n```python\nimport tensorflow\
    \ as tf\ng_new = tf.Graph()\nvar_a = tf.constant(10)\nprint(var_a.graph is tf.get_default_graph())\n\
    print(var_a.graph is g_new)\n```\n\nIn this example, `var_a.graph` is an attribution\
    \ which used to check which node is connected to which graph. When we run the\
    \ above code in the notebook, we will get two Boolean `True` and `False` respectively.\
    \ This result shows that node `var_a` is associated with default graph, not with\
    \ `g_new`.\n\n## Using Context Managers for Graphs\n\nSo how can we assign operation\
    \ under new graph, Let’s look at this code.\n\n```python\nimport tensorflow as\
    \ tf\ng_new = tf.Graph()\nwith g_new.as_default():\n    a = tf.add(1, 2)\nsess\
    \ = tf.Session(graph=g_new)\nsess.run(a)\n```\n\nWhen we run this code, we will\
    \ get the output. We can see that we can access the new graph by using `graph_name.as_default()`\
    \ function.\n\n```python\nwith g_new.as_default():\n```\n\nThis line acts as a\
    \ context manager. Context manager may be defined as an object that determines\
    \ when to execute, `with` statement function. Simply we can understand it as a\
    \ manager that controls all the entry and exit statement of a code block that\
    \ comes under, `with` statement function.\n\n```python\nsess = tf.Session(graph=g_new)\n\
    ```\n\n`Session` also required the name of the created graph to run. Otherwise,\
    \ it will always run default graph.\n\n## Working with Multiple Graphs\n\nLet’s\
    \ see another example with the default graph and the new graph.\n\n```python\n\
    import tensorflow as tf\ng_new = tf.Graph()\ndefault_graph = tf.reduce_sum([3,\
    \ 4])\nwith g_new.as_default():\n    new_graph = tf.reduce_sum([4, 5])\nsess =\
    \ tf.Session()\nprint(sess.run(default_graph))\nsess = tf.Session(graph=g_new)\n\
    print(sess.run(new_graph))\n```\n\nOutput: `7` and `20`.\n\nIn the above example,\
    \ the first print statement will print output of default graph and the second\
    \ print statement will print output of new graph. We can see that when we do not\
    \ pass graph during initialization it will produce output for default graph but\
    \ when graph is passed it will. Let’s see a more corrective way to use multiple\
    \ graphs.\n\n```python\nimport tensorflow as tf\ngraph_1 = tf.get_default_graph()\n\
    graph_2 = tf.Graph()\n# Now make each graph as default one by one and assign operations\
    \ inside it.\ndefault_graph = tf.reduce_sum([3, 4])\nwith graph_2.as_default():\n\
    \    new_graph = tf.reduce_prod([4, 5])\n```\n\nIn this way `graph_1` and `graph_2`\
    \ will be created graphs. Using multiple graph, we can use output of one model\
    \ with another model.\n\n## Fetches\n\nWe have discussed, how we can have the\
    \ output of each node by passing the node in Fetches. Fetches can be defined as\
    \ a technique that help to find the output of the desired node. We can put multiple\
    \ nodes in `sess.run()` and it will return corresponding output.\n\n```python\n\
    import tensorflow as tf\na1 = tf.constant([6, 4, 2], name=\"input\")\na2 = tf.reduce_sum(a1,\
    \ name=\"sum_b\")\na3 = tf.reduce_prod(a1, name=\"product_c\")\na4 = tf.multiply(a2,\
    \ a3, name=\"multiply_d\")\nsess = tf.Session()\nprint(sess.run([a2, a3, a4]))\n\
    ```\n\nWhen we run this code, it will return `[12, 48, 576]` as an output. If\
    \ we put only it will return value correspond to `a2` only.\n\n## Feedings in\
    \ TensorFlow\n\nFeeding is a mechanism provided by TensorFlow which helps to override\
    \ or replace the value of tensors in the graph. It uses a parameter `feed_dict`\
    \ to replace the value, and this parameter take dictionary object as an input.\
    \ The data type of dictionary object and the value which will be replaced should\
    \ be same.\n\nLet’s see with an example, how can we use feed mechanism.\n\n```python\n\
    import tensorflow as tf\nvalue1 = tf.reduce_mean([6, 4, 2])\nvalue2 = tf.reduce_mean([1,\
    \ 8, 6])\nvalue3 = tf.add(value1, value2)\nsess = tf.Session()\nReplace_value\
    \ = {value1: 10}\nprint(sess.run(value3, feed_dict=Replace_value))\n```\n\nWhen\
    \ we run this code, it will return 15 as an output. While execution, the output\
    \ of `value3` should be `9` but eventually `value1` will be replaced by `feed_dict`\
    \ hence final output will be We will see more use case of feeding mechanism in\
    \ later sections.\n"
  trans: "\n\n# 创建 TensorFlow 图\n\n到为止，我们已经讨论了每个 TensorFlow 操作都是图中的一个节点。但我们还没有显式地创建过任何图。那么，这是如何实现的呢？当我们导入\
