    \ will affect So, we can generalize the equation as:    ![](image-t2g7ugx5.jpg) \
    \ But things get a bit complicated when we get to the hidden layer, .    ![](image-zjt8rwmk.jpg) \
    \ Similarly, for U:    ![](image-t1v9ty83.jpg)  Now, note that \\= \\+ depends\
    \ on which depends on W and and so on. So, if we take the derivative with respect\
    \ to we can’t simply treat as a constant! We need to apply the chain rule again\
    \ and what we really have is this:    ![](image-h5v98z9v.jpg)  ![](image-9fz4rb6j.jpg) \
    \ Figure 5.11: BPTT    Figure 5.11 and equation 5.20 manifest the key difference\
    \ between feedforward network and an RNN network. Due to parameter sharing property\
    \ in RNNs, we sum up the derivatives in equation 5.20, whereas, in feedforward\
    \ network, parameters don’t get shared and hence we do not sum anything.  \n\n\
      Vanishing gradient problem    As we discussed, RNN may be used to find the upcoming\
    \ event using previous data, such as the description of the next frame using past\
    \ frames in a video and the most suitable next words in a sentence. After knowing\
    \ that RNNs are good for sequential data, can RNN be used to solve the real life\
    \ complex problems? If yes, then how much previous data is required? How far any\
    \ information can be passed to next blocks? Let’s understand this by revisiting\
    \ the “fill in the blank” example. In that example, we had to find a more appropriate\
    \ word to fill in the blanks in a sentence. Here is the same sentence, color of\
    \ the sky is blue. We had discussed that in these types of questions, RNN can\
    \ use previous context to find an appropriate word. Here, the difference between\
    \ the relevant information and the word which needs to be predicted is small,\
    \ shown in Figure hence RNN can find a suitable answer. But here is the catch;\
    \ what if we increase the length of a sentence (means more words)? Can RNNs predict\
    \ the word in that situation?    ![](image-tdxvby2i.jpg)  Figure 5.12: RNN with\
    \ small information gap    Let’s take another example. Here is a sentence, I grew\
    \ up in Spain; I speak fluent We need to predict the word after fluent. Let’s\
    \ separate the sentence into two parts. First, I grew up in Spain and second,\
    \ I speak fluent If we take the second part of the sentence as recent information,\
    \ we can say that it suggests that the word after fluent will be a language. But\
    \ it does not suggest which language. To know the type of language, we need a\
    \ context from the first part of the sentence. Since, the number of words has\
    \ been increased in this example, the gap between the relevant information and\
    \ the point where the word needs to be predicted becomes large shown in Figure\
    \    ![](image-9858zn30.jpg)  Figure 5.13: RNN with large information gap    The\
    \ increased gap results in more number of time steps and the value of gradient\
    \ between output and inputs at initial time steps starts to diminish, which is\
    \ defined as the Vanishing gradient. Vanishing gradient caused RNNs to have difficulties\
    \ in learning long-range dependencies between words. To understand the vanishing\
    \ gradient problem, let’s take a closer look at the gradient we calculated for\
    \ W .    Let’s take another look at the gradient propagation through time, , which\
    \ is a chain rule, along temporal path.    These gradients are stored in a matrix\
    \ called Jacobian matrix, which contains all pairs of first order gradient propagation.\
    \ If we apply the overall gradient update for any unit,    ![](image-vcykuzri.jpg) \
    \ it turns out that the 2-norm (which we can think of as an absolute value) of\
    \ the above Jacobian matrix has an upper bound of 1\\. This makes intuitive sense\
    \ because tanh (sigmoid) activation function maps all values into a range between\
    \ \\-1 and 1(0 to 1 for sigmoid), and the derivative is bounded by 1 (1/4 in the\
    \ case of sigmoid) as well. For a detailed explanation of equation 22, please\
    \ refer to this paper: On the difficulty of training recurrent neural networks\
    \ by RazvanPascanu, Tomas Mikolov, and YoshuaBengio.    Let’s look at the sigmoid\
    \ and tanh activation functions. As you can see, that towards the limiting value,\
    \ 0 and 1 in case of sigmoid and \\-1 and +1 in case of tanh, the function reaches\
    \ saturation. So, the gradient in those regions is very small. As a result, the\
    \ chain rule of gradient propagation, from layers that capture long range dependencies,\
    \ exponentially reduces and finally vanishes. In other words, the that is the\
    \ error propagation through time from the layer 3 to layer k through the temporal\
    \ connection might vanish as k is large. This is popularly known as the vanishing\
    \ gradient problem.    There is a related problem called exploding gradient. This\
    \ happens on the portion of sigmoid or tanh curve where learning is very steep.\
    \ As a result, the gradients are very large and if it happens in consecutive layers,\
    \ the error propagation can exponentially increase and lead to an overflow of\
    \ the variable storing the gradient. This is usually mitigated by capping the\
    \ gradient over a certain value. It depends on the activation functions and network\
    \ parameters; it can lead to exploding instead of vanishing gradients if the values\
    \ of the Jacobian matrix are large.    There are a few ways to avoid the vanishing\
    \ gradient problem.     Using proper activation function, i.e. using ReLU instead\
    \ of sigmoid or tanh is effective in combating the vanishing and exploding gradient\
    \ problem.    Initializing the network parameter using standard techniques.   \
    \ Using other variants of RNNs, like LSTM or Grated Linear Units (GRUs).  "
