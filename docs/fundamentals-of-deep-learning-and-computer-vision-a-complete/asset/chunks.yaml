    # 馈向神经网络


    前向神经网络是所有神经网络中最简单的一种，信息仅沿单方向移动。数据从输入节点移动到输出节点，并经过隐藏节点（如果有的话）。从输出到输入没有反馈机制；因此，前向网络也是有向无环图的一种形式。


    ## 单层感知机

    单层感知机是人工神经网络最基础的形式，它具有输入层和输出层，没有隐藏层。它是一种具有 0 个隐藏层的馈向神经网络。


    ## 多层感知器

    多层感知器（`MLP`）是一种馈向神经网络。`MLP` 由三层组成：输入层、输出层以及一个或多个隐藏层。多层感知器或馈向神经网络是深度学习模型的基础性且经典的形式。


    在本章中，“神经网络”和“馈向网络”术语将交替使用。那么，我们为什么称其为网络呢？我们可以假设通用或广义函数 `F` 是更小、更不复杂的函数的组合。


    深度网络中的每一层都代表一个较小的函数。从数学上讲，它可以根据层数被定义为 `F =` 等；网络可以写成 `y = F(x; θ)`，其中 `x` 是输入向量，`θ`
    是通用函数的参数，`y` 是输出向量。


    正如我们讨论过的，这些模型的主要目标是通用函数近似，本质上意味着近似任何映射输入和输出向量的通用函数 `F`。与传统的机器学习算法一样，它在将输入 `x`
    映射到类别的同时，学习函数 `⨍(x; θ)` 的参数值，但通过利用输入向量的特征以更好的效率和更优的方法来实现。


    神经网络由输入层、隐藏层和输出层组成。中间层定义为隐藏层。之所以被称为隐藏层，是因为这些层无法从输入数据中获取真实输出值的信息。学习算法利用这些隐藏层并自身选择参数的最优值，以近似映射输入到输出的函数。


    在上述论述中，我们定义了近似函数 `F =` 和输出 `y = F(x; θ)`。该网络中的层总数为 6 层，包括输入层 `x`、输出层以及隐藏层数量，隐藏层数量也代表了模型的深度，这正是“深度学习”名称的由来。


    网络的每一层都由单元组成。隐藏层的单元被称为隐藏单元。通过增加更多的层和隐藏单元，网络的维度会随之增加，从而增加了函数的复杂性。从数学上说，每一层可以被定义为一个向量，其中单元单元代表向量的元素。因此，神经网络可以被解释为多个向量的组合；或者，它也可以解释为向量与标量之间的连接，意味着向量的每个元素与其他向量的每个元素之间的连接。层的每个单元并行连接到前一层的所有单元。


    让我们通过一个例子来理解神经网络的结构。假设第一层包含 3 个单元，第二层包含 2 个单元。第一层的每个单元都可以连接到第二层的所有单元。因此，第一层向量的完整信息将分别传递给第二层向量的每个单元。所以，第一层和第二层之间的最大连接数为
    6。推广这一论点，我们可以说分别具有 `m` 和 `n` 个单元的两层（向量）之间的总连接数将是 `m*n`（最大可能的连接）。我们稍后会讨论与与之间的连接数也可以小于最大值。


    ![](img/image-qxqk9aob.jpg) 图 2.3


    让我们看看 AI 社区之所以离开线性网络的舒适区并开始专注于深度学习的背后的原因。模型大致分为两类：线性和非线性。


    ## 线性模型

    线性模型使用简单的数学属性（通常是加法性）来寻找解决方案。我们可以观察到这些模型可以拟合线性可分的数据，而且它们也简单易用。线性模型工作的场景如图 2.4
    所示的 OR 和 AND 逻辑函数。那么，我们为什么转向其他模型？线性模型的主要缺点是缺乏灵活性。线性模型没有提供输入数据之间或通用函数参数之间的关系。


    ![](img/image-4w2suu7z.jpg) 图 2.4：线性可分逻辑函数


    ## 非线性模型

    在现实世界中，我们会遇到行为之间存在非线性相关的问题。图 2.5 显示了 XOR 逻辑函数，这是一个非函数的例子。它们需要复杂的非线性模型。由于功能的限制（如乘法和加法），线性模型的近似函数被限制在线函数。因此，为了利用线性模型处理非线性，我们通过任何变换函数
    `T` 或使用 `SVM` 中的核技巧将数据映射到高维空间。但这些方法引发了一个新问题：如何决定哪个变换函数会产生更好的结果？这取决于数据点和模型，每种变换技术都会产生不同的结果。


    ![](img/image-lxgsyt68.jpg) 图 2.5：非线性可分逻辑函数


    为了解决这个问题，提出了一种名为深度学习的新技术。这种技术在网络中引入了非线性。在深度学习中，我们使用具有各种参数的近似函数 `F`。在映射输入到输出时，这种技术帮助我们学习函数参数的最优值，从而帮助我们获得一个对测试数据也能产生良好结果的通用映射函数。让我们通过
    XOR 函数的简单例子来理解上述讨论。首先，我们将看到为什么无法通过线性模型开发 XOR 函数，然后我们使用非线性模型来实现 XOR 函数。


    '
