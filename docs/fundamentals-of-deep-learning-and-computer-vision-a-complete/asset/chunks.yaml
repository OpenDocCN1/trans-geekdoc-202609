    # Why CNN?


    Figure 3.6 shows an example of an application of convolution. It shows how we
    can detect edges in an image using a type of kernel known as `laplacian kernel`.
    As shown in Figure, `functions` and represent input image and kernel respectively,
    and `function` represents convolution operation that produces filtered output.


    ![](image-xbbiycvd.jpg)

    Figure 3.6: Edge detection using convolution operation


    Let’s understand the motivation behind CNN Figuratively in more detail. Assume
    a small image of size $3 \times 3$. In this example, the size of the image is
    restricted to $3 \times 3$ for simplicity and random numbers are used to represent
    the image.


    ![](image-joo8mj7y.jpg)

    Figure 3.7: 2D image (left) flattened into 1D vector (right)


    In multilayer perceptron, input data should be so we have to convert data into
    vector as shown in Figure. We can see that each pixel of the image is mapped to
    vector and we know that each element of the vector represents a single neuron
    in. As we took an image of size $3 \times 3$, the total number of elements will
    be 9 and hence the input layer will have 9 neurons.


    Now, we will have to decide the number of hidden layers. To keep it simple we
    will set 1 hidden layer and an output layer. Let’s take 16 neurons in hidden layer
    and, also, we are implementing a fully connected network so each neuron at input
    layer will be connected to each neuron in the hidden layer as shown in Figure.
    In general terms, we can say that each neuron at layer $l$ will be connected to
    all neurons at layer $l-1$.


    ![](image-7xwi1zkn.jpg)

    Figure 3.8: Pixel from input layer is connected to each pixel in the next layer


    In this example, there are 9 neurons in input layer and 16 neurons in hidden layer,
    so there will be $9 \times 16 = 144$ connections between neurons and hence there
    will be 144 weights corresponding to each connection, as shown in Figure.


    ![](image-lf5ve9gn.jpg)

    Figure 3.9: Fully connected layer


    In this example, we have used a smaller image, so the number of parameters is
    small but what if we increase the size of an image? For example, if we use a image
    of size $64 \times 64 \times 3$ with 2 hidden layers each having 1000 neurons
    or even 500 neurons, then the number of parameters will be more than 10 millions.
    Generally, for practical problems, image size is usually very large, and if we
    use fully connected MLP then the number of parameters will be more than 100 millions.
    As we discussed in the introduction, this many parameters will rule out the hardware
    implementations. CNN is used to overcome these types of problems.


    We can see that the number of parameters get very large because, in fully connected
    network, all the neurons at layer $l-1$ are connected to each neuron at layer
    $l$. To reduce the number of parameters, neurons at layer $l-1$ can be connected
    to a group of neurons at layer $l$, as shown in Figure. We can see that neuron
    with index 0 at input layer is connected to the first 4 neurons of the next layer
    with indices 0, 1, 2, 3, with the same weight as shown in Figure. Whereas, in
    Figure it is shown that the same set of neurons is connected with different weights.


    ![](image-z18nlyvd.jpg)

    Figure 3.10: Each Pixel in input layer shares (same) weight with a group pixel
    in the next layer


    So how many connections do we have now? Since each neuron is connected to a group
    of 4, the number of connections gets reduced to one-fourth. Hence, the total number
    of connections will be $144/4 = 36$. We can see that the number of connections
    is reduced by 75%. Can it be reduced further? We will see that next.


    In Figure the complete connection between each neuron at input layer to the next
    hidden layer is shown. For the sake of neat representation, a simple connection
    with one of the neurons from a group is shown here:


    ![](image-3gdu3oty.jpg)

    Figure 3.11: Fully connected layer where each pixel in input layer shares (same)
    weight with a group pixel in the next layer


    ## Spatial relation among pixels


    Till now we have seen that by grouping the neurons, the number of parameters can
    be decreased, but still the number of connections is not reduced. Is it necessary
    to connect each neuron with the neuron in the next layer? Let’s see. So far, we
    have not discussed spatial pixel relation in images. We know that in images, local
    pixels are highly correlated as compared to pixels that are far from each other.
    Is it necessary to use all the pixels of images at one neuron and repeat the same
    for other neurons also? This means, why are we connecting all neurons at layer
    $l-1$ to each neuron at layer $l$? Is it necessary or can we avoid this? Let’s
    understand with an example. In Figure a dog is shown with some background. We
    can see that and can also prove that the pixels representing the body are highly
    correlated as compared to the pixels between body and background.


    ![](image-isxq5j4y.jpg)

    Figure 3.12: An example image to explain spatial relation


    Using all pixels makes the operation computationally redundant and expensive.
    Can we get the same result while connecting lesser pixels from input layer to
    each neuron in the hidden layer? We will get the affirmative result while discussing
    CNN further. Now, assuming that lesser pixels will give the same result, let’s
    see by how much the parameters can be reduced in our example. Okay, earlier we
    were connecting all 9 pixels from input layer to next layer; however, now we will
    use 4 local pixels. Suppose, we are using the first pixel located at $(0, 0)$
    in the image and its neighbor pixels that are $(0, 1), (1, 0)$ and $(1, 1)$. As
    we know, local pixels are more correlated, that’s why 4 nearest pixels are selected.
    Now, each neuron at hidden layer will be connected by only 4 neurons from input
    layer. We have already formed the group of 4 pixels at hidden layer that share
    same weight parameters. So, in the above mentioned scenario, the total number
    of weight parameters will get reduced to 16 for the network shown in Figure If
    we compare this to the number of parameters for the fully connected network shown
    in Figure we find that the number of parameters is reduced by more than 88% for
    the network shown in Figure![](image-s5g92nc0.jpg)

    Figure 3.13: Explaining spatial relation among pixels


    We have discussed the limitations of feedforward neural networks. Now, we will
    discuss how CNN helps to overcome these issues. In the latter part of the above
    section, we have discussed how we can improve the efficiency of feedforward neural
    networks. In this section, we will discuss how CNN exploits similar features.

