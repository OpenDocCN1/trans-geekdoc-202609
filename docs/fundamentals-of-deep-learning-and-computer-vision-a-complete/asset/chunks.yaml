    \ are used less than non-boundary pixels in receptive fields.\n\nNow, imagine\
    \ if we build a deep convnet, what would be the size of the final output? As we\
    \ build more layers, we will implement more convolutional layers and the output\
    \ size will get reduced. So far, we know that the size of the output is reduced\
    \ by convolutional layer but later on, we will discuss pooling layer which also\
    \ reduces the size of the output matrix significantly. Reduction in the size results\
    \ in the loss of input features meaning loss of information. In deep networks,\
    \ we want to keep as much information about input features as possible so that\
    \ we can extract low level features of input. As output shrinks, we find that\
    \ the representation of input features becomes scarce which leads to high error\
    \ prone results. Padding helps to overcome this problem. Let’s understand how\
    \ padding helps.\n\nWe will use the example shown in Figure. The size of the input\
    \ matrix is $5 \\times 5$, kernel size is $3 \\times 3$, and `stride` is $1$.\
    \ Our aim is to keep the output size same as input. We can understand “padding”\
    \ more using Figure 3.28 and Figure. Figure 3.28 shows the input matrix with zero\
    \ padding (left) and the kernel (right) and Figure 3.29 shows the output of convolution\
    \ operation between the padded input matrix and kernel:\n\n![](image-atelhwpw.jpg)\n\
    Figure 3.28: Input matrix (left) and kernel (right). Color on borders represents\
    \ different receptive fields.\n\n![](image-m8qn4ojs.jpg)\nFigure 3.29: Each color\
    \ box represents output of a convolution operation between different receptive\
    \ fields and input matrix.\n\nWe can see that the dimensions of the output matrix\
    \ and the input matrix remained the same. We pad the input matrix with zeros.\
    \ After padding, we can keep each pixel of the input image at the center of receptive\
    \ fields during convolution. Hence, each pixel is used with equal frequency in\
    \ receptive fields, which is not possible without padding except when the size\
    \ of kernel is $1 \\times 1$. When size of a kernel is $1 \\times 1$, we don’t\
    \ use padding because each pixel position acts as a receptive field, so each pixel\
    \ is involved in receptive fields with equal frequency. We can pad additional\
    \ layers with any number, like average of local pixels or maximum of local pixels\
    \ but generally zero is used.\n\n![](image-on5fhys5.jpg)\nFigure 3.30: Example\
    \ of convolution with padding and stride of 2\n\nFigure 3.30 represents another\
    \ example of convolution with padding and stride of 2. We can see that output\
    \ matrix shrinks. In the last example, we used padding layer of size 1 and stride\
    \ of 1 but in this example, we used padding layer of size 1 with stride of 2.\n\
    \nSo, how can we decide the combination of padding layer and stride to keep the\
    \ dimensions of input and output same or how can we choose padding layers and\
    \ stride so that we can get desired dimensions of output? Let’s start by simple\
    \ convolution. When we convolve a $4 \\times 4$ input matrix with $3 \\times 3$\
    \ kernel, it produces a $2 \\times 2$ output matrix. That’s because there are\
    \ only $2 \\times 2$ possible positions where $3 \\times 3$ filter can fit into\
    \ $4 \\times 4$ matrix. In general, if we convolve a matrix of size $n \\times\
    \ n$ with a kernel of size $k \\times k$ then the dimension of the output will\
    \ be $n-k+1$.\n\nWhen we introduce padding and stride, the equation changes. Let’s\
    \ see the mathematical equation for different scenarios. In the following cases,\
    \ we will use input matrix of size $n \\times n$ and kernel of size $k \\times\
    \ k$. We will use notations and $O$ to denote padding, strides, input, kernel,\
    \ and output sizes respectively. The output matrix $O$ will also be a square matrix.\n\
    \n- **Valid padding** ($p=0$, $s=1$):\n  $O = n-k+1$\n- **Zero padding** ($p=2$,\
    \ $s=1$):\n  $O = n-k+1+p$\n- **Same or Half padding** (we want to keep the input\
    \ and output dimensions same, $O=n$, $s=1$):\n  $p = \\lfloor(k-1)/2\\rfloor$\n\
    - **Full padding** (generally, with convolution either output shrinks or dimensions\
    \ of input and output remain same using padding, but when we want to increase\
    \ the size of an output then we use full padding):\n  For any $n$ and $k$, if\
    \ $p=k-1$ and $s=1$:\n  $O = n-k+1+p$\n\nSince $p$ takes integer values, we can\
    \ say that when $n$ is even, size of a filter will be odd.\n\nFigure depict the\
    \ above discussed cases respectively. We can see that padding layers, dimensions\
    \ of input matrices, and filters are varying. We discussed different cases in\
    \ which parameters may have different relationships with each other. The parameters\
    \ used in Figure are according to discussed relationships.\n\n![](image-9z1hfdo2.jpg)\n\
    Figure 3.31: Convolution between input matrix of size $4\\times4$ and filter $3\\\
    times3$ with no padding and stride of 1.\n\n![](image-mi6gk7y1.jpg)\nFigure 3.32:\
    \ Convolution between input matrix of size $5\\times5$ and filter $4\\times4$\
    \ with 2 layers of padding and stride of 1.\n\n![](image-5ivfkshl.jpg)\nFigure\
    \ 3.33: Convolution between input matrix of size $5\\times5$ and filter $3\\times3$\
    \ with 1 layer of padding and stride of 1.\n\n![](image-r8chv59l.jpg)\nFigure\
    \ 3.34: Convolution between input matrix of size $4\\times4$ and filter $3\\times3$\
    \ with 2 layers of padding and stride of 1.\n\nSo far, we have fixed the number\
    \ of strides to 1, i.e kernels shift by 1 unit at a time but what if we want the\
    \ kernels to shift by more than 1 unit at a time, 2, 3 or more? Mainly in large\
    \ size images, we may find that value of `stride` is more than 1. In Figure an\
    \ example of convolution with stride value of 2 and a padding layer has been shown.\
    \ Let’s look at another example to understand how to convolve input matrix and\
    \ filter with stride of 2 and no zero padding layer. We will use input matrix\
    \ of size $7 \\times 7$ and filter of size $3 \\times 3$ as shown in Figure\n\n\
    ![](image-cqsw3o0a.jpg)\nFigure 3.35: Input matrix (left) and kernel (right)\n\
    \nFigure 3.36a represents different positions of filter or receptive field during\
    \ convolution. Let’s assume that blank spaces in the output matrix are to be filled\
    \ with 0. The arrow represents shift of filter in that direction.\n\n![](image-0m7fysmf.jpg)\n\
    Figure 3.36a: Convolution with stride 2\n\n![](image-qd6iy0kb.jpg)\nFigure 3.36b:\
    \ Convolution with stride 2\n\n![](image-qbao5lr6.jpg)\nFigure 3.36c: Convolution\
    \ with stride 2\n\n![](image-nrq90ijg.jpg)\nFigure 3.36d: Convolution with stride\
    \ 2\n\n![](image-4vme6fe3.jpg)\nFigure 3.36e: Convolution with stride 2\n\n![](image-ovj3jq.jpg)\n\
    Figure 3.36f: Convolution with stride 2\n\n![](image-fu9q09i.jpg)\nFigure 3.36g:\
    \ Convolution with stride 2\n\n![](image-uwa20ws.jpg)\nFigure 3.36h: Convolution\
    \ with stride 2\n\n![](image-9x2lrd8y.jpg)\nFigure 3.36i: Final output (right)\
    \ of the operation between Input matrix (left) and filter (center)\n"
  trans: "\n\n# 填充 (Padding)\n\n通常情况下，如果我们希望感受野之间的重叠减少，或者保持空间维度较小，我们会增加 `stride`（步长）值。但是，如果我们不想在每次卷积步骤后都缩小输出矩阵的大小呢？让我们来理解如何保持输入矩阵和输出矩阵的大小相同。我们在图\
    \ 3.26 中看到，在卷积层之后，输出矩阵的大小会减小。输出尺寸之所以缩小是因为边界像素和非边界像素的使用方式不同。换句话说，在感受野中边界像素的使用频率低于非边界像素。\n\
    \n现在，想象如果我们构建一个深层卷积网络，最终输出的大小是多少？随着层数的增加，我们将实现更多的卷积层，输出尺寸也会不断减小。到为止，我们知道输出尺寸会被卷积层减小，但稍后我们将讨论池化层，它也会显著减小输出矩阵的大小。尺寸的减少会导致输入特征的丢失，意味着信息的丢失。在深度网络中，我们希望尽可能保留有关输入特征的信息，以便提取输入的低级特征。随着输出的缩小，我们发现输入特征的表示变得稀疏，从而导致易出错的结果。填充有助于克服这一问题。让我们了解填充是如何帮助的。\n\
    \n我们将使用图中所示的示例。输入矩阵的大小为 $5 \\times 5$，内核大小为 $3 \\times 3$，`stride` 为 $1$。我们的目标是保持输出尺寸与输入相同。我们可以通过图\
    \ 3.28 和图更深入地理解“填充”。图 3.28 显示了带有零填充（左侧）的输入矩阵和内核（右侧），图 3.29 显示了填充后的输入矩阵与内核之间进行卷积操作的输出：\n\
    \n![](img/image-atelhwpw.jpg)\n图 3.28：输入矩阵（左）和内核（右）。边界的颜色代表不同的感受野。\n\n![](img/image-m8qn4ojs.jpg)\n\
    图 3.29：每个颜色方框代表不同感受野与输入矩阵之间卷积操作的结果。\n\n我们可以看到输出矩阵和输入矩阵的维度保持不变。我们对输入矩阵进行了零填充。填充后，我们可以在卷积期间使输入图像的每个像素都处于在感受野的中心。因此，每个像素在感受野中使用的频率是相等的，如果不填充（除非内核尺寸为\
    \ $1 \\times 1$），这是不可能的。当内核尺寸为 $1 \\times 1$ 时，我们不使用填充，因为每个像素位置都充当感受野，所以每个像素参与感受野的频率相等。我们可以对额外的层进行任意数量的填充，例如局部像素的平均值或最大值，但通常使用零值。\n\
    \n![](img/image-on5fhys5.jpg)\n图 3.30：填充且步长为 2 的卷积示例\n\n图 3.30 表示了另一个填充且步长为 2\
    \ 的卷积示例。我们可以看到输出矩阵缩小了。在上一个例子中，我们使用了大小为 1、步长为 1 的填充层，在这个例子中，我们使用了大小为 1、步长为 2 的填充层。\n\
    \n那么，我们如何决定填充层和步长的组合以保持输入和输出维度相同，或者如何选择填充层和步长以获得所需的输出维度？让我们从简单的卷积开始。当用 $4 \\times\
    \ 4$ 输入矩阵与 $3 \\times 3$ 内核进行卷积时，它会产生一个 $2 \\times 2$ 的输出矩阵。这是因为只有 $2 \\times\
    \ 2$ 个可能的位置可以让 $3 \\times 3$ 滤波器放入 $4 \\times 4$ 矩阵中。通常，如果用大小为 $n \\times n$ 的矩阵与大小为\
    \ $k \\times k$ 的内核进行卷积，那么输出的维度将是 $n-k$。\n\n当引入填充和步长时，公式发生了变化。在后续场景中，我们将使用大小为\
    \ $n \\times n$ 的输入矩阵和大小为 $k \\times k$ 的内核。使用 $O$ 分别表示填充、输入和输出。\n\n- **有效填充 (Valid\
    \ padding)**（$p=0, s=1$）：\n  $O = n-k+1$\n- **零填充 (Zero padding)**（$p=2, s=1$）：\n\
    \  $O = n-k+1$\n- **等尺寸填充 (Same padding)**（我们希望输入输出尺寸相同，$s=1$）：\n  $p = \\lfloor(k-1)/2\\\
    rfloor$\n- **全填充 (Full padding)**（对于任何 $n$ 和 $k, p=k-1, s=1$）：\n  $O = n+k-1$\n\
    \n如果 $n$ 是偶数，$O$ 将取偶值；如果 $n$ 是奇数，$O$ 将取奇值。\n\n图中展示了上述情况。我们可以看到填充层、输入矩阵和滤波器的关系。\n\
    \n![](img/image-9x2lrd8y.jpg)\n图 3.31：$4 \\times 4$ 输入矩阵与 $3 \\times 3$ 内核的无填充、步长为\
    \ 1 的卷积。\n\n![](img/image-mi6gk7.jpg)\n图 3.32：$5 \\times 5$ 输入矩阵与 $4 \\times 4$\
    \ 内核的 2 层填充、步长为 1 的卷积。\n\n![](img/image-5ivfksh.jpg)\n图 3.33：$5 \\times 5$ 输入矩阵与\
    \ $3 \\times 3$ 内核的 1 层填充、步长为 1 的卷积。\n\n![](img/image-r8chv59.jpg)\n图 3.34：$4\
    \ \\times 4$ 输入矩阵与 $3 \\times 3$ 内核的 2 层填充、步长为 1 的卷积。\n\n到为止，我们固定了步长为 1，即内核每次移动\
    \ 1 个单位，但如果我们希望内核每次移动超过 1 个单位，例如 2、3 或更多呢？在大型图像中，可能会发现 `stride` 值大于 1。图中展示了步长为\
    \ 2 带有填充层的示例。让我们看另一个例子来理解如何在步长为 2 且无零填充的情况下卷积输入矩阵和内核。我们将使用图中所示的 $7 \\times 7$\
    \ 输入矩阵和 $3 \\times 3$ 内核。\n\n![](img/image-cqsw3o0.jpg)\n图 3.35：输入矩阵（左）和内核（右）\n\
    \n图 3.36a 表示卷积期间不同的滤波器位置或感受野。让我们假设输出矩阵中的空白区域将填充为 0。箭头表示在该方向移动滤波器。\n\n![](img/image-0m7fysmf.jpg)\n\
    图 3.36a：步长为 2 的卷积\n\n![](img/image-qd6iy0kb.jpg)\n图 3.36b：步长为 2 的卷积\n\n![](img/image-qbao5lr6.jpg)\n\
    图 3.36c：步长为 2 的卷积\n\n![](img/image-nrq90ijg.jpg)\n图 3.36d：步长为 2 的卷积\n\n![](img/image-4vme6fe3.jpg)\n\
    图 3.36e：步长为 2 的卷积\n\n![](img/image-ovj3jq.jpg)\n图 3.36f：步长为 2 的卷积\n\n![](img/image-fu9q09i.jpg)\n\
    图 3.36g：步长为 2 的卷积\n\n![](img/image-uwa20ws.jpg)\n图 3.36h：步长为 2 的卷积\n\n![](img/image-9x2lrd8y.jpg)\n\
    图 3.36i：输入矩阵（左）与滤波器（中心）之间操作的最终输出（右）\n\n"
