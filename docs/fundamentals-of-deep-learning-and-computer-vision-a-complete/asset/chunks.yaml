    \ accuracy significantly in comparison to traditional methodologies. \n\nAlexNet\
    \ is composed of 5 convolutional layers followed by 3 fully connected layers as\
    \ depicted in Figure. Unlike the previously used standard activation functions,\
    \ like `Tanh` or `sigmoid`, it uses the `ReLu` (Rectified Linear Unit) activation\
    \ function, which helps in solving the vanishing gradient problem (discussed in\
    \ Chapter Introduction to Neural Networks); hence it subsequently leads to faster\
    \ training. To prevent overfitting and ensure generalization of the model, AlexNet\
    \ uses `drop out` before the first and second fully connected layers.\n\n![](image-4qcubi5o.jpg)\
    \ Figure 4.2: AlexNet Architecture\nhttps://www.learnopencv.com/wp-content/uploads/2018/05/AlexNet-1.png\n\
