    \ Oxford, is known for its simplicity using only `3 × 3` convolutional layers\
    \ stacked on top of each other, unlike AlexNet which uses kernels of size `11\
    \ × 11` and `5 × 5` in the first two convolutional layers as shown in Figure.\
    \ \n\nVGG Net is very appealing because of its uniform architecture and small\
    \ filter sizes of `3 × 3` that help in reducing the total number of parameters.\
    \ The blocks with the same filter size are applied multiple times. However, since\
    \ VGG Net uses so many of such filters in different layers, the number of parameters\
    \ is still large and sometimes becomes very difficult to handle due to heavy computation.\
    \ The following image is about various depths:\n\n![](image-nx0216dj.jpg) Figure\
    \ 4.3: VGG Nets of Various Depths\n\n# GoogLeNet/Inception network\n\nAfter discussing\
    \ and understanding the two important classic networks — `AlexNet` and `VGGNet-16`,\
    \ let’s discuss the winner architecture of the ImageNet challenge 2014, `GoogLeNet/Inception\
    \ Network`, which has proved to be an important milestone in the field of CNN\
    \ architectures. \n\nIn the previous architectures that we discussed, the idea\
    \ was to make the network deeper with an underlying hypothesis that deeper networks\
    \ will always give better performance. But deeper networks have their own disadvantages,\
    \ the first of them being the problem of vanishing gradients which makes the earlier\
    \ layers of the network difficult to learn. With more number of layers, the number\
    \ of trainable parameters (weights) also shoots up and training becomes computationally\
    \ very expensive, both in terms of memory and time. Also, the deep networks are\
    \ prone to overfitting; hence, they do not generalize well. \n\nThe network architecture\
    \ of `GoogLeNet` builds upon the previous classical architectures and exploits\
    \ some new techniques as discussed below, to deal with the aforementioned issues.\n\
    \n## 1 X 1 convolution\n\nThough first introduced in the paper `Network in Network`\
    \ as a technique to introduce non-linearity, `1 X 1 convolution` has been used\
