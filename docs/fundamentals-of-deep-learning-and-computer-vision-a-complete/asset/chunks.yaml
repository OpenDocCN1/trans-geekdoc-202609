    will define the complexity of the neural network. The more hidden units we will
    put, the more complex a function will be created. We can use any activation function,
    but in this example, we will use the tanh activation function. For optimization,
    the batch gradient descent technique has been used.    Let’s implement the nonlinear
    classifier. First, we will build a multilayer perceptron without using any Deep
    Learning framework; this will help us understand the structure of the network
    mathematically.    \# Importing required packages  import matplotlib.pyplot as
    plt  import numpy as np  importsklearn.datasets  import matplotlib    \# Generating
    dataset  np.random.seed(0)  x, y \= sklearn.datasets.make\_moons(300, noise=0.30)  plt.scatter(x\[:,0\],
    x\[:,1\], s=40, c=y, cmap=plt.cm.Spectral)    ##defining variables  \# number
    of training samples  num\_examples \= len(x)    \# no. of units at input layer
    (input layer dimension)  nn\_input\_dim \= 2    \# no. of output units (output
    layer dimension)  nn\_output\_dim \= 2    ##hyperparameters  \# learning rate
    used in gradient descent  alpha \= 0.001    \# regularization parameter  reg\_lambda
    \= 0.001    ##evaluate the total loss on the dataset  #In this example, We are
    using tanh activation function, other functions can be applied to check the outcomes.  def
    calculate\_loss(model):  loss \= None  W1, b1, W2, b2 \= model\[''W1''\], model\[''b1''\],
    model\[''W2''\], model\[''b2''\]  \# Forward propagation to calculate our predictions  z1
    \= x.dot(W1) \+ b1  a1 \= np.tanh(z1)  z2 \= a1.dot(W2) \+ b2  exp\_scores \=
    np.exp(z2)  probs \= exp\_scores / np.sum(exp\_scores, axis=1, keepdims=True)#softmax
    loss  \# Calculating the loss  corect\_logprobs \= \-np.log(probs\[range(num\_examples),
    y\])  data\_loss \= np.sum(corect\_logprobs)/num\_examples  \# adding regularization
    parameter(L2 Regularization)to avoid overfitting  reg\_loss \= reg\_lambda/2 \*
    (np.sum(np.square(W1)) \+ np.sum(np.square(W2)))  loss \= data\_loss \+ reg\_loss  return
    loss    \# predict an output  def predict(model, x):  W1, b1, W2, b2 \= model\[''W1''\],
    model\[''b1''\], model\[''W2''\], model\[''b2''\]  \# Forward propagation  z1
    \= x.dot(W1) \+ b1  a1 \= np.tanh(z1)  z2 \= a1.dot(W2) \+ b2  exp\_scores \=
    np.exp(z2)  probs \= exp\_scores / np.sum(exp\_scores, axis=1, keepdims=True)  returnnp.argmax(probs,
    axis=1)    \## Training neural network  \# nn\_hdim : no. of hidden unit in the
    hidden layer  #num\_passes : no. of epochs  def build\_model(nn\_hdim, num\_passes=40000,
    print\_loss=False):    \# Initialize the parameters to random values. We need
    to learn these.  np.random.seed(0)  W1 \= np.random.randn(nn\_input\_dim, nn\_hdim)
    / np.sqrt(nn\_input\_dim)  b1 \= np.zeros((1, nn\_hdim))  W2 \= np.random.randn(nn\_hdim,
    nn\_output\_dim) / np.sqrt(nn\_hdim)  b2 \= np.zeros((1, nn\_output\_dim))   
    \# This is what we return at the end  model \= {}    \# Batch Gradient descent  for
    i in range(0, num\_passes):  \# Forward propagation  z1 \= x.dot(W1) \+ b1  a1
    \= np.tanh(z1)  z2 \= a1.dot(W2) \+ b2  exp\_scores \= np.exp(z2)  probs \= exp\_scores
    / np.sum(exp\_scores, axis=1, keepdims=True)  \# Backpropagation  delta3 \= probs  delta3\[range(num\_examples),
    y\] \- \= 1  dW2 \= (a1.T).dot(delta3)  db2 \= np.sum(delta3, axis=0, keepdims=True)  delta2
    \= delta3.dot(W2.T) \* (1 \- np.power(a1, 2))  dW1 \= np.dot(x.T, delta2)  db1
    \= np.sum(delta2, axis=0)  \# Adding regularization terms for weights, we can
    add regularization term for biases also  dW2 += reg\_lambda \* W2  dW1 += reg\_lambda
    \* W1  \# Gradient descent parameter update  W1 += \-alpha \* dW1  b1 += \-alpha
    \* db1  W2 += \-alpha \* dW2  b2 += \-alpha \* db2  \# Assign new parameters to
    the model  model \= { ''W1'': W1, ''b1'': b1, ''W2'': W2, ''b2'': b2}  if print\_loss
    and i % 1000 \== 0:  print("Loss after iteration %i: %f" %(i, calculate\_loss(model)))  return
    model  \## Plot decision boundary  def plot\_decision\_boundary(pred\_func):  \#
    Set min and max values and give it some padding  x\_min, x\_max \= x\[:, 0\].min()
    \- .5, x\[:, 0\].max() \+ .5  y\_min, y\_max \= x\[:, 1\].min() \- .5, x\[:, 1\].max()
    \+ .5  h \= 0.01  \# Generate a grid of points with distance h between them  xx,
    yy \= np.meshgrid(np.arange(x\_min, x\_max, h), np.arange(y\_min, y\_max, h))  \#
    Predict the function value for the whole gid  Z \= pred\_func(np.c\_\[xx.ravel(),
    yy.ravel()\])  Z \= Z.reshape(xx.shape)  \# Plot the contour and training examples  plt.contourf(xx,
    yy, Z, cmap=plt.cm.Spectral)  plt.scatter(x\[:, 0\], x\[:, 1\], c=y, cmap=plt.cm.Spectral)  \#
    Build a model with a 3-dimensional hidden layer  model \= build\_model(3, print\_loss=True)  \#
    Plot the decision boundary  plot\_decision\_boundary(lambda x: predict(model,
    x))  plt.title("Decision Boundary for hidden layer size 3")  plt.show()    On
    executing this code, we will get something similar to the Figure shown below:   
