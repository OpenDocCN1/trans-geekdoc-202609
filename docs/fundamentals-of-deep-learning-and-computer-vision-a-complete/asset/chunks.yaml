    \ * dz2/dw1`. So, ![](image-9pswtknb.jpg), Therefore, ![](image-norgvrh6.jpg),\
    \ Now, we can update weight as: ![](image-x3dcs041.jpg). Similarly, we can update\
    \ the value of `w4` and `w5` and get the updated value very near to following\
    \ number: `w4 = 0.19956143`, `w5 = 0.24975114`, `w6 = 0.29950299`. So far, we\
    \ have updated weights for 1 epoch (defined as, when entire dataset is passed\
    \ forward and backward through the network), till convergence this process should\
