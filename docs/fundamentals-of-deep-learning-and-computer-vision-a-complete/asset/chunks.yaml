    # Stochastic Gradient Descent


    As we discussed, batch gradient descent uses every sample point in the training
    set and sums up the gradients to update parameters at every step. When we optimize
    the model for a large dataset, this algorithm converges slowly and also becomes
    computationally expensive. To overcome this problem, researchers have proposed
    a new algorithm called stochastic gradient descents, also known as `SGD`.


    In `SGD`, we compute the gradient for the first training example and try to fit
    the sample, then update the parameter. Then, the updated parameter will be used
    as an initial parameter for the second training example, and so on. In other words,
    in `SGD`, whenever we encounter training examples, we compute the gradient and
    use the error due to that training example to update parameters of the model.
    In contrast to batch gradient descent, in `SGD` we do not need a complete training
    dataset to take a small step towards the steepest descent. There is an associated
    disadvantage with `SGD` that it may not lead convergence to the global minimum
    due to the zig-zag motion. But it will find local minimum, which will be closer
    to the global minimum.


    ## Cost Function for SGD


    Let’s understand the cost function for `SGD`. In the last section, the cost function
    for the batch gradient descent algorithm was defined as:


    ![](image-fy960zwp.jpg)


