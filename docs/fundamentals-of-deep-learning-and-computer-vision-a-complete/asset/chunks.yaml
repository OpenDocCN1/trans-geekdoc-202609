    # 梯度下降


    梯度下降有助于找到最陡峭的方向，该方向将用于收敛代价函数。为了找到可能的收敛点，我们需要计算函数的斜率，并迈出小步 `δx` 以到达最小点。根据第一性原理，我们将函数
    `y=f(x)` 的微变化定义如下：


    ![](img/image-ryrzx5f8.jpg)


    对于极小的步长，我们可以写下：


    ![](img/image-n8btz01s.jpg)


    更全面地说，我们可以写成 `+ \ = –`。我们还知道对于递增函数 `> 0`，对于递减函数 `< 0`。从这个方程中推断出，对于递增函数 `–` 小于。因此，为了减小
    `y` 的值，沿着 `⨍` 的反方向迈出一小步。同样，我们也可以对递减函数这样做。


    利用上述论点，我们可以说新点将是 `x = x – αδx`，其中 `α` 定义为学习率，它决定了小步的大小。通常，我们为 `α` 值设置一个非常小的常数，以便它以最优速率收敛且不会跳过所需的最小点。在多维空间，当存在多个独立变量时，将为每个方向计算
    `∇`。对于多变量输入，我们将计算函数的梯度，记为 `∇J()`。这种梯度计算技术被定义为梯度下降。


    ![](img/image-6d5j9mez.jpg)

    图 2.14


    我们可以通过图理解上述论点。在这个示例中，使用了一个简单的抛物线，可以用 `y ≈ x²` 方程进行数学表示。`f(x)` 的导数是 `⨍ = 2x`。现在，利用增减函数的标准，我们可以说对于
    `x > 0`，该函数表现为递增函数；对于 `x < 0`，该函数表现为递减函数。在 `x = 0` 处，`⨍` 也为 `0`；这些被称为驻点或临界点。


    我们可以通过评估相邻点的函数值来检查该点是最小值还是极大值。如果相邻点的值大于临界点的值，则临界点是局部最小值。同样，如果相邻点的值小于临界点的值，则临界点是局部极大值。我们可能会在图中遇到多个局部极值点。给出图中最低绝对值的临界点定义为全局最小值。同样，给出图中最高绝对值的临界点被定义为全局极大值。


    ![](img/image-2ik2uex4.jpg)

    图 2.15


    我们可以通过图理解最后一段。假设图 2.15 中的图代表任何代价函数。`x` 代表点，`y` 代表函数在这些点处的值。图 2.15 展示了三个最小值，其中一个是全局最小值，另外两个是局部最小值。在梯度下降中，我们的目标应该是达到全局最小值，但由于网络的非线性和多维性，我们通常会停留在局部最小值。


    在上面的图中，我们可以看到局部最小值 (1)的值比局部最小值 (2) 更接近全局最小值。因此，模型在点 1 的表现将远好于点 2。因此，局部最小值 (1)是可以接受的，而应该避免局部最小值
    (2)。


    ## 优化技术


    现在，我们将讨论如何使用梯度下降更新参数。首先，我们将讨论最小二法代价函数。如前面的节所述，最小二法代价函数定义为：


    ```

    J(w, b) = 1/(2m) * Σ (y_i - (wx_i + b))²

    ```


    我们的目标是选择 `w` 和 `b` 以使代价函数最小。我们将使用上述讨论过的“线性搜索”方法和梯度下降算法来更新 `w` 和 `b`：


    ```

    w = w - α∂J/∂w

    b = b - α∂J/∂b

    ```


    让我们计算代价函数对每个参数的偏导数。对于一个样本，具有一个权重值和一个偏置值：


    ```

    ∂J/∂w = -(1/m) * Σ (y_i - (wx_i + b)) * x_i

    ∂J/∂b = -(1/m) * Σ (y_i - (wx_i + b))

    ```


    同样，对于具有多个特征的样本，上面的方程变为：


    ```

    ∂J/∂w_j = -(1/m) * Σ (y_i - (Σ w_kx_k + b)) * x_ij

    ```


    对 `b` 的偏导数保持不变。因此，我们可以写出 `w` 的更新规则为：


    ```

    w_j = w_j - α∂J/∂w_j

    ```


    注意方程中的符号变化。有些书籍使用 `+`，另一些使用 `-`；然而，两者是一样的。这取决于我们在代价函数中使用 `-` 还是 `-` 来推导更新规则。对于
    `m` 个样本的训练集，我们可以写出每个权重 `w` 的更新规则为：


    ```

    w_j = w_j - α∂J/∂w_j

    (修正此处)

    ```


    我们执行此更新直到收敛。这种方法使用训练集中每个样本点来更新参数；因此，该算法被称为批量梯度下降。


    现在我们讨论了如何使用最小二法代价函数更新参数，让我们来讨论交叉熵代价函数的情况，我们之前对 `m` 个样本定义如下：


    ```

    J(w, b) = -1/m * Σ [y_i * log(h_i) + (1-y_i) * log(1-h_i)]

    ```


    我们将以类似于处理之前代价函数的方式讨论更新规则。对于具有单个权重和偏置值的 1 个样本。现在我们的代价函数将是：


    ```

    J(w, b) = -[y * log(h) + (1-y) * log(1-h)]

    ```


    其中：


    ```

    h = 1/(1 + e^{-(wx+b)})

    ```


    现在：


    ```

    ∂J/∂w = (1/m) * (h - y) * x

    ∂J/∂b = (1/m) * (h - y)

    ```


    因此，我们可以写出更新方程：


    ```

    w = w - α(1/m) * Σ (h_i - y_i) * x_i

    b = b - α(1/m) * Σ (h_i - y_i)

    ```


    我们可以看到得到了之前相同的更新，但在这种情况下 `h` 是线性的。对于多个特征，更新规则将变为：


    ```

    w_j = w_j - α(1/m) * Σ (h_i - y_i) * x_ij

    ```


    而偏置 `b` 将保持不变。


