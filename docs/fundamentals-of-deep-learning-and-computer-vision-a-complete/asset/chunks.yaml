    \ the two layers). \n\nWhereas, in the global average pooling case, each `7 X\
    \ 7` slice gets mapped to `1 X 1` by average pooling all the `7 X 7` values, thereby\
    \ creating a set of `1024` values with no parameters required to be estimated,\
    \ unlike in the fully connected layer’s case. Thus, it saved a lot of computations.\
    \ This simple trick of average pooling helped improve the top-1 accuracy by about\
    \ 0.6%.\n\n# ResNets\n\nIdeally, with an increase in the number of layers, model\
    \ accuracy should improve. But, that doesn’t happen for all practical purposes,\
    \ as earlier layers do not receive the required information for changing weights\
    \ from network end due to increased depth — the vanishing gradient problem. Hence,\
