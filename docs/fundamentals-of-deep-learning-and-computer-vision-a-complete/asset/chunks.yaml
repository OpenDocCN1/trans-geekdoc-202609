- raw: "  AlexNet    AlexNet, though a simple layout as compared to the modern architectures,\
    \ created a deep interest in CNNs and their applications in computer vision problems.\
    \ It was first designed by Alex Krizhevsky, Geoffrey Hinton, and IlyaSutskever\
    \ from the University of Toronto in 2012 as part of the ImageNet challenge (yearly\
    \ competition focused on image classification). It increased the ImageNet classification\
    \ accuracy significantly in comparison to traditional methodologies.    AlexNet\
    \ is composed of 5 convolutional layers followed by 3 fully connected layers as\
    \ depicted in Figure Unlike the previously used standard activation functions,\
    \ like Tanh or sigmoid, it uses the ReLu (Rectified Linear Unit) activation function,\
    \ which helps in solving the vanishing gradient problem (discussed in Chapter\
    \ Introduction to Neural Networks); hence it subsequently leads to faster training.\
    \ To prevent overfitting and ensure generalization of the model, AlexNet uses\
    \ drop out before the first and second fully connected layers.    ![](image-4qcubi5o.jpg) \
    \ Figure 4.2: AlexNet Architecture    https://www.learnopencv.com/wp-content/uploads/2018/05/AlexNet-1.png\
    \  \n\n  VGG Net    VGG Net, first proposed by Visual Geometry Group, University\
    \ of Oxford, is known for its simplicity using only 3 × 3 convolutional layers\
    \ stacked on top of each other, unlike AlexNet which uses kernels of size 11 ×\
    \ 11 and 5 × 5 in the first two convolutional layers as shown in Figure    VGG\
    \ Net is very appealing because of its uniform architecture and small filter sizes\
    \ of 3 × 3 that help in reducing the total number of parameters. The blocks with\
    \ the same filter size are applied multiple times. However, since VGG Net uses\
    \ so many of such filters in different layers, the number of parameters is still\
    \ large and sometimes becomes very difficult to handle due to heavy computation.\
    \ The following image is about various depths:    ![](image-nx0216dj.jpg)  Figure\
    \ 4.3: VGG Nets of Various Depths  \n\n  GoogLeNet/Inception network    After\
    \ discussing and understanding the two important classic networks — AlexNet and\
    \ VGGNet-16, let’s discuss the winner architecture of the ImageNet challenge 2014,\
    \ GoogLeNet/Inception Network, which has proved to be an important milestone in\
    \ the field of CNN architectures.    In the previous architectures that we discussed,\
    \ the idea was to make the network deeper with an underlying hypothesis that deeper\
    \ networks will always give better performance. But deeper networks have their\
    \ own disadvantages, the first of them being the problem of vanishing gradients\
    \ which makes the earlier layers of the network difficult to learn. With more\
    \ number of layers, the number of trainable parameters (weights) also shoots up\
    \ and training becomes computationally very expensive, both in terms of memory\
    \ and time. Also, the deep networks are prone to overfitting; hence, they do not\
    \ generalize well.    The network architecture of GoogLeNet builds upon the previous\
    \ classical architectures and exploits some new techniques as discussed below,\
    \ to deal with the aforementioned issues.     1 X 1 convolution    Though first\
    \ introduced in the paper Network in Network as a technique to introduce non-linearity,\
    \ 1 X 1 convolution has been used in GoogLeNet as a dimension reduction module\
    \ that reduces the computation.    Let’s first understand what 1X1 convolution\
    \ does in the following image:    ![](image-gh3vobfh.jpg)  Figure 4.4: 1 X 1 convolution\
    \ for a 2D matrix     As shown in Figure for a 2D matrix, 1 X 1 convolution is\
    \ simply a matrix multiplied with an integer and doesn’t make much sense. But\
    \ when we consider it (images/matrices) with depth more than 1, as shown in Figure\
    \ it helps in containing the depth of the layer or the number of feature maps\
    \ in a layer. It is very useful because depth in convolutional layers increases\
    \ with an increase in depth of the network and results in more parameters and\
    \ hence more computations.    ![](image-b5gpobu3.jpg)  Figure 4.5: 1 X 1 convolution\
    \ for a 3D matrix    Now, let’s try to understand how 1 X 1 helps in reducing\
    \ the computation requirements with an example:    ![](image-yshzyd03.jpg)  Figure\
    \ 4.6: Without the use of 1 X 1 convolution    \\# of operations for convolution\
    \ in Figure 4.6 \\= 14\\*14\\*48\\*5\\*5\\*480=112.9 M    ![](image-bl9b7zs2.jpg) \
    \ Figure 4.7: With the use of 1 X 1 convolution    \\# of Operations for 1X1 in\
    \ Figure 14\\*14\\*16\\*1\\*1\\*480= 1.5 M    \\# of Operations for 5X5 in Figure\
    \ 4.7 \\= 14\\*14\\*48\\*5\\*5\\*16= 3.8 M    Total number of operations \\= 5.3M\
    \ << 112.9M    It should be noted here that pooling layers (discussed in the last\
    \ chapter) also reduce the number of parameters but the number of channels or\
    \ feature maps remains unchanged.     Inception module    The idea behind using\
    \ the inception module is to use convolutions of different sizes to capture information\
    \ at varied scales. In Figure we see that convolutions of different sizes — 1\
    \ X 1, 3 X 3, and 5 X 5 have been used to extract all different levels of features\
    \ from the previous layer. 1 X 1 convolutions in the yellow box in Figure serve\
    \ the purpose of reducing the computations, as discussed in the previous section,\
    \ by limiting the number of input channels.    ![](image-xri22uzy.jpg)  Figure\
    \ 4.8: Inception module    Global average pooling layer    In the architectures\
    \ discussed above and in the previous chapter, fully connected layers are used\
    \ at the end of the network as seen in Figure    ![](image-gtfpualt.jpg)  Figure\
    \ 4.9 Fully connected layer vs global average pooling     As can be observed from\
    \ Figure in a fully connected case, all inputs are connected to each output, which\
    \ results in 7 \\* 7 \\* 1024 \\* 1024 weights to be trained (total number of\
    \ connections between the two layers).    Whereas, in the global average pooling\
    \ case, each 7 X 7 slice gets mapped to 1 X 1 by average pooling all the 7 X 7\
    \ values, thereby creating a set of 1024 values with no parameters required to\
    \ be estimated, unlike in the fully connected layer’s case. Thus, it saved a lot\
    \ of computations. This simple trick of average pooling helped improve the top-1\
    \ accuracy by about 0.6%.    The following image shows the architecture:    ![](image-7qshjcxn.jpg) \
    \ Figure 4.10: GoogLeNet architecture  \n\n  ResNets    Ideally, with an increase\
    \ in the number of layers, model accuracy should improve. But, that doesn’t happen\
    \ for all practical purposes, as earlier layers do not receive the required information\
    \ for changing weights from network end due to increased depth — the vanishing\
    \ gradient problem. Hence, training error starts increasing after a particular\
    \ depth as shown in the graph in Figure 4.11 — often termed as degradation problem.\
    \    Introduced in 2015 by Microsoft Research as part of ImageNet Challenge 2015,\
    \ and crossing all the previous benchmarks, residual Networks or ResNets have\
    \ helped in solving the degradation problem to a great extent and gaining accuracy\
    \ from training very deep neural networks.    ![](image-0t4dxyle.jpg)  Figure\
    \ 4.11: Degradation problem in deep networks  "
