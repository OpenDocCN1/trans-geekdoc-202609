    \ [sold, remaining, defected], category:category_name})\n      print(category_name,\
    \ total)\n```\n\nTensorFlow has amazing support for distributed computations.\
    \ This allows us to have parts of our graph run in different CPUs, GPUs of a cluster.\
    \ The distributed implementation of TensorFlow shares most of the code with localized\
