    # 图 (Graph)


    在核心层，TensorFlow 使用有向图（directed graph）——一种数据流图/计算图的形式——来实现其算法并执行操作。在本书，数据流图和计算图将交替使用。这种结构适用于需要链式导数的深度学习模型。数据流图通过将节点拆分，帮助将复杂的计算实现为简单的计算。图
    1.3 展示了一个简单的示例。


    ![](img/image-540zx76h.jpg)

    ### 图 1.3

    上面的示例展示了如何使用图进行基础加法。节点用圆表示。每个节点定义了一个单一的操作或数学函数。在这个示例中，它接收由箭头表示的两个输入 `X` 和 `Y`。当这些输入通过执行加法操作节点时，它返回输出
    `X + Y`。此外，该输出可以作为另一个节点的输入，也可以作为最终输出。


    节点（Nodes）和边（Edges）是图的元素单元。通常，节点用圆或矩形表示，箭头表示边。数学操作在节点处实现，其值通过边传递到其他节点，因此边起到了节点之间连接器的作用。


    图 1.4 展示了一个稍微复杂且有趣的示例：


    ![](img/image-qfe2ejk6.jpg)

    ### 图 1.4

    由于数据流图使用有向图，计算方向由箭头指示。让我们逐步理解图的每个操作：


    - 在左侧，我们可以看到两个圆圈 `a` 和 `b`，代表两个输入 `input1` 和 `input2`。这些输入可以来自其他图，也可以是原始输入。

    - 这两个圆将其对应的值传递给框（节点）`node c` 和 `node d` 进行进一步计算。`node c` 执行加法操作，`node d` 执行乘法。

    - `node c` 接收两个值 `6` 和 `4` 作为输入，在对这些值相乘后，它给出 `24` 作为输出结果。同时，`node d` 也接收两个值 `6`
    和 `4` 执行加法操作，并给出 `10` 作为输出结果。

    - 最后，`node e` 接收 `node c` 和 `node d` 的输出作为输入，并执行加法操作，给出 `34` 作为输出结果。`node e` 的输出可以是最终输出，也可以是后续节点的输入。


    让我们看看计算图的数学解释。在这里，节点表示为 `a`、`b`、`c` 和 `d`：

    - `a = input 1`

    - `b = input 2`

    - `c = a + b`; `d = a * b`

    - 最后，`e = c + d`


    设 `input 1` 和 `input 2` 的值为 `6` 和 `4`。因此，`a = 6` 且 `b = 4`。

    现在，`c = a + b = 6 + 4 = 10`；`d = a * b = 6 * 4 = 24`。

    最后，`e = c + d = 10 + 24 = 34`。


    让我们讨论为什么采用节点方法。在这种方法中，输入值可以被各种数学操作利用，因此它可以被后续层中的大量节点使用。否则，每个节点将是孤立的。


