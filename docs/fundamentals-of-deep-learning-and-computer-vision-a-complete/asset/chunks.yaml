- raw: "  Long Short-Term Memory (LSTM)    How to solve the Vanishing gradient problem?\
    \ The previous section actually contains the solution. To make the gradient propagate\
    \ through a large context is not always required, especially near the training\
    \ saturation. This means, when the network is near convergence, the activation\
    \ function of the nodes is in the saturation region, where the gradient is small.\
    \ In those instances, the gradient doesn’t need to be propagated through large\
    \ context length. On the contrary, short-term context representation will mostly\
    \ contribute to the error at that time. So, the network should have some control\
    \ on what to remember and what to forget. In other words, the network should have\
    \ some control based on the input and the hidden state which lets the gradient\
    \ from previous state pass to the present state. LSTM does exactly that. Long\
    \ Short-Term Memory, commonly known as LSTM, is another kind of RNN network, which\
    \ can handle long-term dependencies between data. LSTM stemmed out as a saver\
    \ for the vanishing and exploding gradient problem. LSTM has been used to solve\
    \ many practical problems and has become a de facto standard for RNNs. The core\
    \ idea behind LSTM is compared to RNN; it has several gates. This gate allows\
    \ the LSTM cell to focus on or forget a specific part of the input sequence depending\
    \ on the input and output.    LSTM becomes very popular by overcoming this problem\
    \ and setting benchmarks in a number of fields in natural language processing,\
    \ like language modeling, machine translation, image captioning, speech recognition,\
    \ etc.    ![](image-tylzy8sk.jpg)  Figure 5.14: Simple structure of RNN    Figure\
    \ 5.14 depicts an overview of the simple structure of RNN. It shows how information\
    \ flows from the previous time step to the next step. In this figure, the box\
    \ named tanh represents the tanh function. LSTMs also have similar chain like\
    \ structures, but the small building block, which is called LSTM cell, has different\
    \ structure as shown in Figure    ![](image-8am3oqbl.jpg)  Figure 5.15: Simple\
    \ structure of LSTM    As evident from Figure there is a single neural network\
    \ in a cell of RNN but in LSTM four different neural networks interacting with\
    \ each other.  \n\n  Architecture of LSTM    The trick of LSTM is the cell state,\
    \ i.e. the upper line of LSTM cell, as shown in Figure It has a connection with\
    \ some linear operations which makes it easy for information to pass along to\
    \ the next cell.    ![](image-zrip32y5.jpg)  Figure 5.16: Cell state    LSTM cells\
    \ also have gates shown in Figure which decide the flow of information. The gate\
    \ (known as forget gate) is composed of a sigmoid layer and pointwise multiplication\
    \ operation.    ![](image-nfc40rkr.jpg)  Figure 5.17: Simple architecture of gate\
    \    Depending on the output from the sigmoid layer, it lets the information flow.\
    \ The range of output values varies from 0 to 1\\. When the output value is 0,\
    \ it does not allow information to flow, whereas, when the output value is 1,\
    \ it allows all information to flow from last to the next cell.    As discussed\
    \ above, the first step in the LSTM cell is to decide whether to pass the information\
    \ from the last LSTM cell state to the next or not. The sigmoid layer, acting\
    \ as forget gate layer, has already been discussed. There will be 2 inputs to\
    \ the sigmoid layer. The first input, is input data to the network at time step\
    \ t and is output from the last LSTM cell. These two values will concatenate together\
    \ and act as one input for the sigmoid layer. Now, if the output from sigmoid\
    \ layer is 1, then information from the last cell state, Ct – 1, will pass to\
    \ the next cell. If the output is 0, then the information from the last cell state\
    \ will not pass to the next cell. Figure 5.18 represents the forget gate with\
    \ its respective equation.    Let’s go back to the example of trying to predict\
    \ the next word based on all the previous words. In such a problem, the cell state\
    \ might include the gender of the present subject, so that the correct pronouns\
    \ can be used. When there is a new subject, the gender of the old subject needs\
    \ to be forgotten.    ![](image-e6ld1rjh.jpg)  Figure 5.18: Forget gate in LSTM\
    \ cell    The next step is to decide what new information is to be stored in the\
    \ cell state. This has two parts. First, a sigmoid layer called the input gate\
    \ layer decides which values are to be updated. Next, a tanh layer creates a vector\
    \ of new candidate values, that could be added to the state. In the next step,\
    \ these two are combined to create an update to the state. In the example of the\
    \ language model, their aim is to add the gender of the new subject to the cell\
    \ state, to replace the old one that is to be forgotten.    ![](image-1a74yyb4.jpg) \
    \ Figure 5.19: Input gate in LSTM cell    In the next step, the old cell state,\
    \ Ct – 1, will get updated into the new cell state The previous steps already\
    \ decided what to do; it now needs to be done. From the previous cell state Ct\
    \ – 1 and the new candidate cell state we generate the new cell state Ct by multiplying\
    \ the old state by forgetting the things that were marked as ‘to be forgotten’\
    \ earlier. Next to be added is it Figure 5.20 shows the computation of new cell\
    \ state This is the new candidate value, scaled by what the volume decided previously\
    \ for each state value. This is a crucial development in LSTM over RNN. LSTM behaves\
    \ like a memory cell, it not only stores the cell state directly, it learns what\
    \ to store.    In the case of the language model, this is where the old subject’s\
    \ gender could be dropped, and the new information could be added, as described\
    \ in the previous steps.    ![](image-0derxrnn.jpg)  Figure 5.20: Cell state computation\
    \ in LSTM cell    Finally, the output needs to be decided, which is a filtered\
    \ version of the cell state. First, a sigmoid layer is run, which decides what\
    \ parts of the cell state are to be outputted. Then, the cell state is put through\
    \ tanh (to push the values to be between −1 and 1) and multiplied by the output\
    \ of the sigmoid gate. Now, only the desired elements are outputted.    For the\
    \ language model example, since it only saw a subject, it might want to output\
    \ information relevant to a verb, in case that’s what is coming next. For example,\
    \ it might output whether the subject is singular or plural so that it is known\
    \ what form a verb should be conjugated into if that’s what follows next.    ![](image-ogxe84r0.jpg) \
    \ Figure 5.21: Output gate in LSTM cell  \n\n  Variants on LSTM    What we have\
    \ discussed so far is a normal LSTM. But not all LSTMs are the same as the above.\
    \ In fact, it seems like almost every paper involving LSTMs uses a slightly different\
    \ version. Let’s see another form of LSTM briefly.    Gated Recurrent Unit, or\
    \ GRU, combines the forget and input gates into a single update gate. It also\
    \ merges the cell state and hidden state and makes some other changes. The resulting\
    \ model is simpler than standard LSTM models and has been growing increasingly\
    \ popular. Figure 5.22 shows a cell of GRU:    ![](image-zlypl7q1.jpg)  Figure\
    \ 5.22: Gated Recurrent Unit    Peephole connection allows the forget and the\
    \ input gate to access the cell state. Figure 5.23 shows a cell of peephole connection:\
    \    ![](image-x9mzbeo3.jpg)  Figure 5.23: Peephole connection  "
