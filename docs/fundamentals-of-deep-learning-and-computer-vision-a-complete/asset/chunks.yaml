    # 为什么选择 CNN？


    图 3.6 显示了卷积的应用示例。它展示了我们如何使用称为 `laplacian kernel` 的内核来检测图像中的边缘。如图所示，`functions`
    和 `kernel` 分代表输入图像和内核，而 `function` 代表产生滤波输出的卷积操作。


    ![](img/image-xbbiycvd.jpg)

    图 3.6：使用卷积操作进行边缘检测


    让我们更形象地深入 CNN 背后的动机。假设有一张大小为 $3 \times 3$ 的小图像。在这个例子中，为了简单起见，图像尺寸限制为 $3 \times
    3$，并使用随机数表示图像。


    ![](img/image-joo8mj7y.jpg)

    图 3.7：2D 图像（左）展平为 1D 向量（右）


    在多层感知器中，输入数据应该是向量形式，因此我们必须如图所示将数据转换为向量。我们可以看到图像的每个像素都被映射到向量，并且知道向量的每个元素代表输入层中的单个神经元。由于我们取的是
    $3 \times 3$ 大小的图像，元素总数将为 9，因此输入层将拥有 9 个神经元。


    现在，我们必须决定隐藏层的数量。为了简单起见，我们将设置 1 个隐藏层和 1 个输出层。假设隐藏层有 16 个神经元，而且我们实现的是全连接网络，如图所示，输入层的每个神经元都将连接到隐藏层的每个神经元。通俗地说，我们可以说层
    $l$ 的每个神经元都将连接到层 $l-1$ 的神经元。


    ![](img/image-7xwi1zkn.jpg)

    图 3.8：输入层的像素连接到下一层的每个像素


    在例例中，输入层有 9 个神经元，隐藏层有 16 个神经元，因此神经元之间将有 $9 \times 16 = 144$ 个连接，相应的每个连接将有 144
    个权重，如图所示。


    ![](img/image-lf5ve9gn.jpg)

    图 3.9：全连接层


    在这个例中，由于我们使用了较小的图像，因此参数数量较少，但如果我们增加图像尺寸会怎样？例如，如果我们使用一张大小为 $64 \times 64 \times
    3$ 的图像，并带有两个各有 1000 个甚至 500 个神经元的隐藏层，那么参数数量将超过 1000 万。通常，对于实际问题，图像尺寸通常很大，如果我们使用全连接
    MLP，参数数量将超过 1 亿。正如我们在引言中所讨论的，如此多的参数将排除硬件实现。CNN 被用于解决这类问题。


    我们可以看到参数数量变得非常大，因为在全连接网络中，层 $l-1$ 的所有神经元都连接到层 $l$ 的每个神经元。为了减少参数数量，层 $l-1$ 的神经元可以连接到层
    $l$ 的一组神经元，如图。我们可以看到输入层索引为 0 的神经元连接到下一层的前 4 个神经元（索引为 0, 1, 2, 3），且具有相同的权重，如图所示。而图中显示同一组神经元以不同的权重连接。


    ![](img/image-z18nlyvd.jpg)

    图 3.10：输入层的每个像素与下一层的一组像素共享（相同）权重


    那么我们现在有多少个连接？由于每个神经元连接到一组 4 个神经元，连接数量减少到了分之一。因此，连接总数将变为 $144/4 = 36$。我们可以看到连接数减少了
    75%。还能进一步减少吗？我们将在看到。


    图中显示了输入层每个神经元到下一个隐藏层之间的完整连接。为了便于表述，这里显示了与组神经元中一个神经元的简单连接：


    ![](img/image-3gdu3oty.jpg)

    图 3.11：全连接层，其中输入层的每个像素与下一层的一组像素共享（相同）权重


    ## 像素间的空间关系


    到为止，我们已经看到通过对神经元分组可以减少参数数量，但连接数并没有减少。有必要将每个神经元与下一层的神经元连接吗？让我们来看看。到目前为止，我们还没有讨论图像中的空间像素关系。我们知道在图像中，局部像素与远离彼此的像素相比具有高度相关性。有必要在一个神经元中使用图像的所有像素，并对其他神经元重复相同的操作吗？这意味着，为什么要将层
    $l-1$ 的所有神经元连接到层 $l$ 的每个神经元？有必要吗，还是我们可以避免？让我们通过例子来理解。图中显示了一只带有背景的狗。我们可以看到并证明，代表身体的像素与身体与背景之间的像素相比具有高度相关性。


    ![](img/image-isxq5j4y.jpg)

    图 3.12：解释空间关系的示例图像


    使用所有像素会导致计算计算上的冗余和昂贵。我们可以在从输入层到隐藏层每个神经元只连接较少像素的情况下，获得相同的结果吗？在进一步讨论 CNN 时，我们将得到肯定的结果。现在，假设较少像素会产生相同的结果，让我们看看在示例中参数可以减少多少。好的，之前我们是将输入层的所有
    9 个像素连接到下一层；但现在我们将使用 4 个局部像素。假设我们正在使用图像中位于 $(0, 0)$ 的第一个像素及其邻居像素 $(0, 1), (1,
    0)$ 和 $(1, 1)$。正如我们所知，局部像素的相关性更高，这就是选择 4 个最近的像素的原因。现在，隐藏层的每个神经元将只由输入层的 4 个神经元连接。我们已经在隐藏层形成了
    4 个像素的组，它们共享相同的权重参数。因此，在上述场景中，图中所示的网络权重参数总数将减少到 16。如果我们与图所示的全连接网络的参数数量相比，我们发现图中所示的网络参数数量减少了
    88% 以上![](img/image-s5g92nc0.jpg)

    图 3.13：解释像素间的空间关系


    我们已经讨论了前馈神经网络的局限性。现在，我们将讨论 CNN 如何帮助克服这些问题。在上节的后半部分，我们已经讨论了如何提高前馈神经网络的效率。在本节中，我们将讨论
    CNN 如何利用相似特征。


    '
