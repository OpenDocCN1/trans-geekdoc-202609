    _variable)  print(sess.run(variable1))  for i in range(2):  sess.run(update\\\
    _variable)  print(sess.run(variable1))    In this example, variable1 is created\
    \ as variable scalar value, constant1 is a constant scalar value and new\\_variable\
    \ will return output after multiplying variable1 and In next step, tf.assign()\
    \ update the value of variable1. When we run this code, it returns 4 and 8 as\
    \ an output. This shows variable1 keeps changing its value on every iteration.\
    \    So far, we have discussed the global initialization of variables. Let’s understand\
    \ custom initialization with an example.    import tensorflow as tf  variable1\
    \ \\= tf.Variable(6)  variable2 \\= tf.Variable(\\[6, 4\\])  variable3 \\= tf.Variable(tf.truncated\\\
    _normal(\\[2, 2\\]))    In this example, variable1 is created as variable scalar\
    \ value, variable2 is created as variable vector and variable3 are created as\
    \ a random variable object of size 2x2.    To initialize custom variables, we\
    \ use tf.variables\\_initializer() with a list of variables to be initialized.\
    \    initialize\\_variable\\_1\\_and\\_2 \\=  tf.variables\\_initializer(\\[variable1,\
    \ variable2\\],  name=”initialize\\_1\\_and\\_2”)  with tf.Session() as sess:\
    \  tf.run(initialize\\_variable\\_1\\_and\\_2)    We can also initialize each\
    \ variables one by one using    variable3 \\= tf.Variable(tf.truncated\\_normal(\\\
    [2, 2\\]))  sess \\= tf.Session()  sess.run(variable3.initializer)  print(sess.run(variable3))\
    \    This code will return random value matrix of size 2x2.  "
  fmt: "\n# Placeholders\n\nThus far, we are providing input directly into operations\
    \ or using operation to create inputs. But TensorFlow provides another technique\
    \ to feed inputs. This can be done using `placeholder`. Placeholder, the name\
    \ itself defines it as an empty tensor object which does not have any value during\
    \ initialization, but it can be feed with input data during execution of the graph.\n\
    \n### Why is it better to use placeholders than constants?\n\nWhen we use `constant`,\
    \ its value gets copied in a graph. Suppose we initialize large ones or zeros\
    \ as constant operation e.g. `initialize_ones = np.ones((3000, 3000))`. This operation\
    \ not only add a single operation to the graph, but it also copies the 9 million\
    \ constant elements into the graph. So, whenever the graph is loaded, constant\
    \ value gets replicated. This makes loading of graph slow and expensive. We can\
    \ check the argument by printing graph’s protobuf (protocol buffer).\n\nLet’s\
    \ understand this with an example.\n\n```python\nimport tensorflow as tf\nconstant_value\
    \ = tf.constant([6, 4, 2], name=\"constant_value\")\nprint(tf.get_default_graph().as_graph_def())\n\
    ```\n\nWhen we run this code, it will return output shown in Figure. Now when\
    \ we run the code in notebook multiple times, the number of dictionaries keep\
    \ on increasing. This shows that value of a constant gets replicated when the\
    \ graph is loaded. Placeholder initializes single operation and it gets executed\
    \ inside `session.run()`. After each resources which are not needed any longer\
    \ get released by closing the session as Hence, it does not copy the tensor object\
    \ in a graph.\n\n![](image-3ld4eoqm.jpg) Figure 1.13\n\nPlaceholders are flexible\
    \ with data size. We can initialize the size of input or we can mention `None`.\
    \ When we pass `None` value as shape parameter, it enables placeholders to take\
    \ data of any size. Data type in placeholder should also be initialized to avoid\
    \ any mismatch errors. Placeholders once initialized, must be feed with input\
    \ data, otherwise it shows an exception. Feeding mechanism is used to feed data\
    \ in a placeholder.\n\nLet’s understand the use of placeholder with an example.\n\
    \n```python\nimport tensorflow as tf\nimport numpy as np\nx_matrix = np.random.randn(3,\
    \ 1)\nm_matrix = np.random.randn(3, 3)\nx = tf.placeholder(tf.float32, shape=(3,\
    \ 1))\nm = tf.placeholder(tf.float32, shape=(3, 3))\nc = tf.ones((3,1))\nmx =\
    \ tf.matmul(m, x)\ny = mx + c\nvalue = tf.reduce_mean(y)\nsess = tf.Session()\n\
    sess.run(value, feed_dict={x: x_matrix, m: m_matrix})\n```\n\nIn the above example,\
    \ we implemented the equation `y = mx + c`. Initially, we have defined values\
    \ for two matrices and one vector using NumPy. We have initialized two inputs\
    \ `x` and `m` as a placeholder, which eventually got filled in during execution.\n\
    \n# Variables\n\nSo far, we have used constants as input, and it has been fun.\
    \ Now, let’s discuss variables, another tensor object which really matters a lot.\n\
    \nIn optimization or learning process, variables play a key role. In this type\
    \ of process, different types of parameters and hyperparameters needs to be tuned\
    \ continuously and properly till they find the best value to fit in the model.\
    \ In each iteration, its value keeps updating. While discussing placeholder, we\
    \ have discussed the drawbacks of using constant operation. Variables can also\
    \ be a replacement of constant operation. Variables should be used where more\
    \ data are in play because it requires more memory. A variable is stored separately\
    \ and usually, they don’t replicate.\n\n### How to create a variable\n\nVariable\
    \ is declared when we instantiate an instance of the class. Lowercase `c` is used\
    \ in constant whereas uppercase `V` is used in `Variable`. This difference arises\
    \ because `tf.constant` is an operation, whereas `tf.Variable` is a class because\
    \ it offers more than one function.\n\nVariable can be created using TensorFlow\
    \ operation\n\n```python\nimport tensorflow as tf\nvar = tf.Variable(10, name=\"\
    create_variable\")\nvalue1 = tf.multiply(2, var)\nvalue2 = tf.reduce_max(5, var)\n\
    ```\n\nOkay, now we will discuss how to initialize variable.\n\nAs we have discussed\
    \ above, state of variables or we can simply say value of variables handled by\
    \ session. To use variables, first we will have to initialize them, and it will\
    \ get executed in `session run`. Generally, initialization is done by using `tf.global_variables_initializer()`\
    \ after which memory get allocated to variables.\n\n```python\nimport tensorflow\
    \ as tf\nx = tf.Variable(tf.truncated_normal([2, 1], mean=5.0, stddev=1.0))\n\
    m = tf.Variable(tf.random_normal([2, 2], stddev=0.1))\nc = tf.Variable(tf.ones([2,\
    \ 1]))\n\nmx = tf.matmul(m, x);\ny = tf.add(mx, c)\n\ninitializer = tf.global_variables_initializer()\n\
    sess = tf.Session()\nsess.run(initializer)\nprint(sess.run(y))\nsess.close()\n\
    ```\n\nIn this example, we have calculated the value of equation `y = mx + c`.\
    \ When we run this code, it will return `[[0.4051047], [0.507525]]` as an output.\
    \ Note that, `sess.run(initializer)` is used to initialize a variable, it does\
    \ not fetch any value.\n\nLet’s look at another example.\n\n```python\nimport\
    \ tensorflow as tf\nvariable1 = tf.Variable(2)\nconstant1 = tf.constant(2)\nnew_variable\
    \ = tf.multiply(variable1, constant1)\nupdate_variable = tf.assign(variable1,\
    \ new_variable)\ninitialize_variable = tf.global_variables_initializer()\nsess\
    \ = tf.Session()\nsess.run(initialize_variable)\nprint(sess.run(variable1))\n\
    for i in range(2):\n    sess.run(update_variable)\n    print(sess.run(variable1))\n\
    ```\n\nIn this example, `variable1` is created as variable scalar value, `constant1`\
    \ is a constant scalar value and `new_variable` will return output after multiplying\
    \ `variable1`. In next step, `tf.assign()` update the value of `variable1`. When\
    \ we run this code, it returns 4 and 8 as an output. This shows variable1 keeps\
    \ changing its value on every iteration. \n\nSo far, we have discussed the global\
    \ initialization of variables. Let’s understand custom initialization with an\
    \ example.\n\n```python\nimport tensorflow as tf\nvariable1 = tf.Variable(6)\n\
    variable2 = tf.Variable([6, 4])\nvariable3 = tf.Variable(tf.truncated_normal([2,\
    \ 2]))\n```\n\nIn this example, `variable1` is created as variable scalar value,\
    \ `variable2` is created as variable vector and `variable3` are created as a random\
    \ variable object of size 2x2.\n\nTo initialize custom variables, we use `tf.variables_initializer()`\
    \ with a list of variables to be initialized.\n\n```python\ninitialize_variable_1_and_2\
    \ = tf.variables_initializer([variable1, variable2], name=\"initialize_1_and_2\"\
    )\nwith tf.Session() as sess:\n    tf.run(initialize_variable_1_and_2)\n```\n\n\
    We can also initialize each variables one by one using\n\n```python\nvariable3\
    \ = tf.Variable(tf.truncated_normal([2, 2]))\nsess = tf.Session()\nsess.run(variable3.initializer)\n\
    print(sess.run(variable3))\n```\n\nThis code will return random value matrix of\
    \ size 2x2.\n"
  trans: "\n\n# 占位符 (Placeholders)\n\n到为止，我们直接向操作中提供输入，或者使用操作来创建输入。但 TensorFlow 提供了另一种提供输入的方法。这可以通过\
    \ `placeholder` 实现。占位符名称本身将其定义为一个空张量对象，它在初始化期间没有任何值，但在图的执行过程中可以为其喂入输入数据。\n\n###\
    \ 为什么使用占位符比常量（constants）更好？\n\n当我们使用 `constant` 时，它的值会被复制到图中。假设我们初始化了一个大型全 1 或全零矩阵作为常量操作，例如\
    \ `initialize_ones = np.ones((3000, 3000))`。此操作不仅向图中添加了一个单独的操作，还将将 900 万个常量元素复制到图中。因此，每当加载图时，常量值就会被复制。这导致图的加载变得缓慢且昂贵。我们可以通过打印图的\
    \ protobuf（协议缓冲区）来检查该参数。\n\n让我们通过一个例子来理解这一点。\n\n```python\nimport tensorflow as\
    \ tf\nconstant_value = tf.constant([6, 4, 2], name=\"constant_value\")\nprint(tf.get_default_graph().as_graph_def())\n\
    ```\n\n当运行这段代码时，它将返回如图所示的输出。现在当我们在 notebook 中多次运行代码时，字典的数量不断增加。这表明常量的值在加载图时会被复制。占位符初始化的是单个操作，它在\
    \ `session.run()` 内部执行。在之后，不再需要的资源将通过关闭 session 释放，因此，它不会在图中复制张量对象。\n\n![](img/image-3ld4eoqm.jpg)\
    \ 图 1.13\n\n占位符对数据大小非常灵活。我们可以初始化输入的大小，也可以提及 `None`。当我们把 `None` 值作为形状参数传递时，它允许占位符接受任何大小的数据。占位符中的数据类型也应该初始化，以避免任何匹配错误。占位符一旦初始化，必须喂入输入数据，否则会抛出异常。使用喂入机制（Feeding\
    \ mechanism）向占位符中提供数据。\n\n让我们通过一个例子来理解占位符的使用。\n\n```python\nimport tensorflow\
    \ as tf\nimport numpy as np\nx_matrix = np.random.randn(3, 1)\nm_matrix = np.random.randn(3,\
    \ 3)\nx = tf.placeholder(tf.float32, shape=(3, 1))\nm = tf.placeholder(tf.float32,\
    \ shape=(3, 3))\nc = tf.ones((3,1))\nmx = tf.matmul(m, x)\ny = mx + c\nvalue =\
    \ tf.reduce_mean(y)\nsess = tf.Session()\nsess.run(value, feed_dict={x: x_matrix,\
    \ m: m_matrix})\n```\n\n在上面的示例中，我们实现了方程 `y = mx + c`。最初，我们使用 NumPy 定义了两个矩阵和一个向量的值。我们将两个输入\
    \ `x` 和 `m` 初始化为占位符，它们最终在执行过程中被填充。\n\n# 变量 (Variables)\n\n到为止，我们一直常量作为输入，这很有趣。现在，让我们讨论变量，另一个非常重要的张量对象。\n\
    \n在优化或学习过程中，变量起着关键性的作用。在此类过程中，不同类型的参数和超参数需要连续且正确地调整，直到它们找到适应模型的最佳值。在每次迭代中，它的值都会不断更新。在讨论占位符时，我们讨论了使用常量操作的缺点。变量也可以作为常量操作的替代。在涉及更多数据的地方应该使用变量，因为它们需要更多内存。变量单独存储，通常它们不会被复制。\n\
    \n### 如何创建变量\n\n当我们实例化类的实例时会声明变量。常量使用小写的 `c`，而在 `Variable` 中使用大写的 `V`。这种差异产生是因为\
    \ `tf.constant` 是一个操作，而 `tf.Variable` 是一个类，因为它提供了多个一个函数。\n\n可以使用 TensorFlow 操作创建变量：\n\
    \n```python\nimport tensorflow as tf\nvar = tf.Variable(10, name=\"create_variable\"\
    )\nvalue1 = tf.multiply(2, var)\nvalue2 = tf.reduce_max(5, var)\n```\n\n好了，现在我们将讨论如何初始化变量。\n\
    \n正如我们上面讨论的，变量的状态或简单来说，变量的值由 session 处理。要使用变量，首先我们必须初始化它们，它们将在 `session run` 中执行。通常，初始化是通过使用\
    \ `tf.global_variables_initializer()` 完成的，之后内存会被分配给变量。\n\n```python\nimport tensorflow\
    \ as tf\nx = tf.Variable(tf.truncated_normal([2, 1], mean=5.0, stddev=1.0))\n\
    m = tf.Variable(tf.random_normal([2, 2], stddev=0.1))\nc = tf.Variable(tf.ones([2,\
    \ 1]))\n\nmx = tf.matmul(m, x);\ny = tf.add(mx, c)\n\ninitializer = tf.global_variables_initializer()\n\
    sess = tf.Session()\nsess.run(initializer)\nprint(sess.run(y))\nsess.close()\n\
    ```\n\n在这个示例中，我们计算了方程 `y = mx + c` 的值。运行这段代码时，它将返回 `[[0.4051047], [0.507525]]`\
    \ 作为输出。注意，`sess.run(initializer)` 用于初始化变量，它并不获取任何值。\n\n让我们来看另一个例子。\n\n```python\n\
    import tensorflow as tf\nvariable1 = tf.Variable(2)\nconstant1 = tf.constant(2)\n\
    new_variable = tf.multiply(variable1, constant1)\nupdate_variable = tf.assign(variable1,\
    \ new_variable)\ninitialize_variable = tf.global_variables_initializer()\nsess\
    \ = tf.Session()\nsess.run(initialize_variable)\nprint(sess.run(variable1))\n\
    for i in range(2):\n    sess.run(update_variable)\n    print(sess.run(variable1))\n\
    ```\n\n在这个示例中，`variable1` 被创建为变量标量值，`constant1` 是常量标量值，`new_variable` 在相乘 `variable1`\
    \ 后返回输出。在下一步中，`tf.assign()` 更新了 `variable1` 的值。运行这段代码时，它返回 4 和 8 作为输出。这表明 variable1\
    \ 在每次迭代中不断改变其值。\n\n到为止，我们讨论了变量的全局初始化。让我们通过一个例子来理解自定义初始化。\n\n```python\nimport\
    \ tensorflow as tf\nvariable1 = tf.Variable(6)\nvariable2 = tf.Variable([6, 4])\n\
    variable3 = tf.Variable(tf.truncated_normal([2, 2]))\n```\n\n在这个示例中，`variable1`\
    \ 被创建为变量标量值，`variable2` 被创建为变量向量，`variable3` 被创建为 2x2 大的随机变量对象。\n\n要初始化自定义变量，我们使用\
    \ `tf.variables_initializer()` 并传入需要初始化的变量列表。\n\n```python\ninitialize_variable_1_and_2\
    \ = tf.variables_initializer([variable1, variable2], name=\"initialize_1_and_2\"\
    )\nwith tf.Session() as sess:\n    sess.run(initialize_variable_1_and_2)\n```\n\
    \n我们也可以使用逐个初始化每个变量：\n\n```python\nvariable3 = tf.Variable(tf.truncated_normal([2,\
    \ 2]))\nsess = tf.Session()\nsess.run(variable3.initializer)\nprint(sess.run(variable3))\n\
    ```\n\n这段代码将返回一个 2x2 大的随机值矩阵。\n\n"
