    Running model on Fashion mnist  train \= fashion\_mnist\_dataset.train  test \=
    fashion\_mnist\_dataset.test  parameters \= model(train, test, learning\_rate=0.0005,
    graph\_filename=''fashion\_mnist\_costs'')    On executing the above code, we
