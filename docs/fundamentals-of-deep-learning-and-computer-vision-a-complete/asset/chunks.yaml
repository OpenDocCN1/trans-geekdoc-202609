    Superscript `0`, `1`, and `2` represent the zeroth layer (Input data), 1st layer
    (hidden layer), and 2nd layer (output units or output layer) respectively. In
    this book, superscript is used to represent the layer number and subscript is
    used to represent the place in that layer. For example, `h3` represented as means
    that `h3` is at position in layer.


    For a single neuron, we write input to output relation as `y = f(Wx + b)`.


    Now, for the neural network shown with given input we can write output at 1st
