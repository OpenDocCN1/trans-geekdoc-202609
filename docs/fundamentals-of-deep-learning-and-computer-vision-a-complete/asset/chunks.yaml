    # 深度残差学习框架


    现在我们理解了，训练一个网络并不像向网络中添加层那么简单。我们遇到了一个名为训练准确率下降的问题。为了解决这个问题，人们提出了一种深度残差学习框架。正如我们在前面的章节中所回顾的，基本上，每个神经网络都尝试通过堆叠的层来学习输入
    `X` 和输出 `Y` 之间的映射。然而，在 ResNet 中，我们不再期望层直接拟合底层映射，而是显式地让层拟合残差映射。让我们理解使用残差映射背后的直觉，以及我们如何通过跳跃连接（skip
    connections）来实现这一点。从上方来看，原始映射函数变为 `H(x) = F(x) + x`，其中 `F(x)` 代表堆叠的非线性层，`x` 代表恒等函数（`H(x)
    = x`）。这种是与其使用堆叠的非线性层优化 `H(x)`，不如优化残差映射函数 `F(x)` 。这防止了神经网络在必要时必须学习恒等函数。为了对恒等函数进行建模，如图所示，跳跃连接被用于显式地将权重从前面的层拷贝到后面的层。


    ![](img/image-3johc9yl.jpg

    图 4.12：用于残差映射的跳跃连接


    ## 两种残差跳跃连接


    有两种残差跳跃连接：当输入和输出的维度相同时，直接使用恒等连接，如下：


    ![](image-p5kd27u3.jpg

    当前面的和后面的层维度不同时，通过快捷连接执行线性投影以匹配维度，如下：


    ![](image-p4dqw76g.jpg

    在这里，我们应该注意这增加了一额外的参数集。为了避免这种情况，我们也可以使用零填充（zero padding）来增加维度。在普通网络中使用这些跳跃连接，最终的
    ResNet 架构如图所示


    ![](image-vnr0zsy.jpg

    图 4.13：左侧：具有 34 个参数层的普通网络。右侧：具有 34 个参数层的残差网络


    # 计算机视觉应用


    在上一节中，我们讨论了过去几年提出的不同 `CNN` 架构，并发现它们在许多计算机视觉应用的特征提取中具有巨大的用途。由于所有这些进步，训练极深神经网络并以极高的效率解决许多现实世界的图像分类问题已成为可能。计算机视觉应用和系统已经变得更加先进和复杂，它们的用例远超图像分类。目标检测和定位是其中两个。目标检测和定位的进展使得自动驾驶汽车、视频监控、人脸检测、机器人系统以及许多工业中的自动化成为可能。下面的图像显示了分类、定位和目标检测之间的区别：


    ![](image-h5ahuxfb.jpg

    图 4.14：分类、定位和目标检测的区别


    在所有此类用例中，如果图像中有多个对象，并且要求在定位后对其进行分类和标记，目标检测和定位就登场了。我们不仅是将图像分类到相应的类别，还需要检测图像中所有不同的对象并找到它们的位置——在对象周围创建边界框（bounding
    boxes）。过去几年见证了许多目标检测算法的出现，例如 `R-CNN`、`Fast R-CNN`、`Faster R-CNN`、`SSD` 和 `YOLO`。在下一节中，我们将简要讨论每种算法及其架构，重点关注
    `YOLOv3`。在此之前，我们将对通用目标检测框架进行概述。


    ## 通用目标检测框架


    通用目标检测框架的步骤如下：


    1. 首先，目标是创建并训练一个合适的 `ConvNet` (`CNN`) 来对不同的对象进行分类。

    2. 下一个任务是通过模型或算法在图像中找到预期检测对象的感兴趣区域 (`RoI`）或区域建议（region proposals）。通常使用 `selective
    search` 算法来寻找 `RoIs`，这是一种基于聚类的方法，它将像素分组并根据生成的簇生成 `RoIs`。

    3. 接下来，我们从每个边界框中提取特征，将这些特征通过步骤 1 中创建的 `ConvNet` 分类分类，并将每个边界框分类到相应的类别。

    4. 在最后一步，将重叠的边界框合并为单个边界框，这种方法被称为非极大抑制（non-maximum suppression）。上面讨论的直观框架是 `R-CNN`。虽然它非常慢，但它启发并帮助了我们将讨论的先进目标检测算法的演进。


    ## Fast R-CNN


    Fast R-CNN 是 `R-CNN` 的直接后代。尽管它与 `R-CNN` 非常相似，但它通过下面讨论的两个主要改进提高了了检测速度：不再先寻找 `RoIs`
    然后从这些边界框中提取特征，`Fast R-CNN` 建议先从图像中提取特征，然后使用合适的特征 `RoIs` 进行分类。因此，是在整个图像上运行一个 `CNN`，而不是为
    2k 个区域建议运行 2k 次 `CNNs`。而不是为分类创建一个单独的模型，`Fast R-CNN` 进一步扩展了特征提取模型，并包含了几个全连接层和一个
    `softmax` 层，用于端到端的特征提取和分类。


    ## Faster R-CNN


    Faster R-CNN 提出了一种替代 `selective search` 算法的方案，以神经网络的形式来寻找区域建议。它引入了区域建议网络 (`RPN`)
    来实现这一特定目的。现在，让我们理解 `RPN` 是如何工作的。通过 `CNN` 生成特征图后，一个 `3 X 3` 滑动窗口在特征图上移动，将特征图映射到较低维度。对于每个滑动窗口位置，根据
    `k` 个默认边界框（称为 `anchor boxes`）生成多个可能的区域。对于这些锚框中的每一个，我们输出一个对象性评分（objectness score），告诉我们框是否包含对象以及框的坐标。一旦我们通过
    `RPN` 获得了这些区域建议，它们会被直接输入到之前讨论过的 `Fast R-CNN` 中。

    '
