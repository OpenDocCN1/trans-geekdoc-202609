- raw: "  Single Shot Detector (SSD)    Single Shot Detector or SSD is a state-of-the-art\
    \ real time object detection algorithm that provides enormous speed as compared\
    \ to Faster R-CNN and also performs comparably well, but with a different approach.\
    \    So far, every model that we discussed had two components. First, we generate\
    \ RoIs or region proposals and then we use ConvNets for classifying those regions.\
    \ SSD does the two steps in a single shot. As it processes the image, it predicts\
    \ both, the bounding box and the class.    Now, let’s understand how SSD achieves\
    \ this once we have the input image and ground truth table for bounding boxes\
    \ i.e. their coordinates and the objects they contain. Firstly, image is passed\
    \ through a ConvNet (a series of convolutional layers) which generates sets of\
    \ feature maps at different scales (to include different object size possibilities)\
    \ – 10 X 10, 5 X 5, and 3 X 3\\. Now, for each location of different feature maps,\
    \ 3 X 3 filter is used to evaluate a small set of default bounding boxes or anchor\
    \ boxes. During training, ground truth box (GTB) is matched with the predicted\
    \ box (PB) based on IoU (Intersection over Union metric). IoU is calculated as\
    \ shown below:    IoU \\= (Common area shared by GTB and PB)/(Area of GTB \\+\
    \ Area of PB-Common area shared by GTB and PB)    “The best predicted box is labeled\
    \ as positive”, along with all other boxes that have an IoU with the truth \\\
    > 0.5. Through this approach, a large number of bounding boxes are generated,\
    \ as we classify and draw bounding boxes from every single position in the image,\
    \ using multiple shapes, at several different scales. To overcome this, NMS or\
    \ non-maximum suppression, discussed earlier, is used to combine highly overlapping\
    \ boxes into one.    To summarize, SSD carries out region proposal and classification\
    \ steps simultaneously. Given n classes, each bounding box is associated with\
    \ 4+n dimensional vector that outputs 4 box offset coordinates and n class probabilities,\
    \ and training is carried out by matching this vector with ground truth labels.\
    \ Look at the following figure to understand the SSD framework:    ![](image-dst3yzyx.jpg) \
    \ Figure 4.15: SSD framework  \n\n  You Only Look Once (YOLO)    You Only Look\
    \ Once (YOLO) is another state-of-the-art real time object detection algorithm.\
    \ Similar to SSD, it creates a unified network for predicting region proposals\
    \ and object classes. Moreover, as the name suggests, even in YOLO, each image\
    \ is processed once, but unlike SSD, YOLO does not generate the feature maps before\
    \ evaluating the bounding boxes. Let’s get on to how YOLO actually works.    In\
    \ the past couple of years, researchers have come up with different versions of\
    \ YOLO, each one an inspired and improved version of the previous one — YOLOv1,\
    \ YOLOv2, and YOLOv3 are the latest ones. We will primarily revolve our discussion\
    \ around the latest version, YOLOv3, and the various ideas it has inherited from\
    \ previous versions. From here onwards, YOLO should be read and understood as\
    \ YOLOv3.    We discussed earlier that YOLO creates a unified network to achieve\
    \ end-to-end training. Let’s understand this further. In YOLO, the input image\
    \ is divided into an SXS grid as shown in Figure    ![](image-ck76tniy.jpg)  Figure\
    \ 4.16: YOLO unified detection    The grid cell, into which the center of a particular\
    \ object falls, is responsible for detecting the object. Hence, each grid cell\
    \ predicts B bounding boxes and the confidence score of those boxes that tell\
    \ us if they contain an object. Bounding box is represented by where y are the\
    \ coordinates of the center of the box relative to the bounds of grid cell, and\
    \ h are the width and height relative to the whole image. During training, the\
    \ objectness score (or confidence score) is predicted using logistic regression.\
    \ It is 1 if the bounding box prior overlaps a ground truth object by more than\
    \ any other bounding box prior. Only one bounding box prior is assigned for each\
    \ ground truth object. Apart from bounding box, each grid cell also predicts the\
    \ probability of each object of being a part of it. YOLOv2 and YOLOv3 do not use\
    \ fully connected layers and rather use anchor boxes to predict bounding boxes\
    \ similar to Faster R-CNN. One pooling layer is removed to increase the resolution\
    \ of the output.    So, for one particular image scale, with 20 different objects,\
    \ for a grid of 7 X 7, and keeping default bounding boxes as 2, YOLO output would\
    \ look similar to Figure    ![](image-mchokmgc.jpg)  Figure 4.17: YOLO output\
    \    Now, let’s discuss how we get the above output, and finally, predict the\
    \ object location by training a convolutional neural network. Below, we have the\
    \ DarkNet-53 architecture that YOLOv3 uses for predicting the bounding box and\
    \ object class.    ![](image-p0w8y034.jpg)  Figure 4.18: DarkNet-53 architecture\
    \    Note the presence of residual layers, discussed earlier in this chapter.\
    \ Also, Batch Normalization is used in all the convolutional layers of YOLOv3\
    \ for better convergence and to avoid overfitting without using any other regularization\
    \ approach. For class prediction, instead of using softmax, independent logistic\
    \ classifiers are used for multi-label classification, and binary cross-entropy\
    \ loss is used as there can be more than one label for an object, e.g. Woman and\
    \ Person.    YOLOv3 runs significantly faster than the other detection methods,\
    \ with comparable performance. Apart from the features discussed above, there\
    \ are further improvements vis-a-vis the previous versions, such as direct location\
    \ prediction, dimension-based clustering, feature upsampling, and concatenation.\
    \ These improvements are responsible for its commendable performance. Let’s discuss\
    \ each of them one by one.  \n\n  Direct location prediction    While training,\
    \ at early iterations, the model becomes very unstable as there are no constraints\
    \ for bounding box prediction. Anchor box can end up at any point in the image.\
    \ YOLOv3, (and YOLOv2 also!!) bounds the location using logistic activation σ,\
    \ which makes the value fall between 0 to 1 (relative to the bounds of the grid\
    \ cell). After constraining the location prediction, the parameterization is easier\
    \ to learn, making the network more stable.    ![](image-cwk69hh1.jpg)  Figure\
    \ 4.19: Bounding boxes with dimension priors and location prediction  \n\n  Dimension\
    \ cluster    While using anchor boxes for bounding box prediction, it is required\
    \ to handpick the anchor boxes as has been the practice since the introduction\
    \ of region proposal-based methods. In YOLOv3, instead of choosing priors by hand,\
    \ clustering is run on the training set bounding boxes to automatically find good\
    \ priors.    With standard with Euclidean distance, larger boxes generate more\
    \ error than smaller boxes, but it is required to have priors with good IoU scores.\
    \ So, the distance metric used for this purpose is:    ![](image-ngmgh4tu.jpg) \
    \ Experimentally, it has been found that k \\= 5 is the best value with a good\
    \ tradeoff between model complexity and high recall.  \n\n  Feature upsampling\
    \ and concatenation    YOLOv3 predicts boxes at 3 different scales to successfully\
    \ capture small as well as large objects. Several convolutional layers are added\
    \ to the base feature extractor Darknet-53. The last of these layers predicts\
    \ the bounding box, objectness, and class predictions. Next, the feature map is\
    \ taken from 2 previous layers and upsampled by 2×. This method allows us to get\
    \ more meaningful semantic information from the upsampled features and finer-grained\
    \ information from the earlier feature map. Then, a few more convolutional layers\
    \ are added to process this combined feature map and eventually predict the output\
    \ for each scale.    YOLOv3 performs better and faster than other technologies\
    \ in the object detection world because of the design tricks that it applies,\
    \ which we discussed above.  "
  fmt: "\n# Single Shot Detector (SSD)\n\nSingle Shot Detector or `SSD` is a state-of-the-art\
    \ real time object detection algorithm that provides enormous speed as compared\
    \ to `Faster R-CNN` and also performs comparably well, but with a different approach.\n\
    \nSo far, every model that we discussed had two components. First, we generate\
    \ `RoIs` or region proposals and then we use `ConvNets` for classifying those\
    \ regions. `SSD` does the two steps in a single shot. As it processes the image,\
    \ it predicts both, the bounding box and the class. \n\nNow, let’s understand\
    \ how `SSD` achieves this once we have the input image and ground truth table\
    \ for bounding boxes i.e. their coordinates and the objects they contain. Firstly,\
    \ image is passed through a `ConvNet` (a series of convolutional layers) which\
    \ generates sets of feature maps at different scales (to include different object\
    \ size possibilities) – `10 X 10`, `5 X 5`, and `3 X 3`. Now, for each location\
    \ of different feature maps, `3 X 3` filter is used to evaluate a small set of\
    \ default bounding boxes or anchor boxes. \n\nDuring training, ground truth box\
    \ (`GTB`) is matched with the predicted box (`PB`) based on `IoU` (Intersection\
    \ over Union metric). `IoU` is calculated as shown below:\n\n```\nIoU = (Common\
    \ area shared by GTB and PB)/(Area of GTB + Area of PB-Common area shared by GTB\
    \ and PB)\n```\n\n“The best predicted box is labeled as positive”, along with\
    \ all other boxes that have an `IoU` with the truth `> 0.5`. Through this approach,\
    \ a large number of bounding boxes are generated, as we classify and draw bounding\
    \ boxes from every single position in the image, using multiple shapes, at several\
    \ different scales. To overcome this, `NMS` or non-maximum suppression, discussed\
    \ earlier, is used to combine highly overlapping boxes into one.\n\nTo summarize,\
    \ `SSD` carries out region proposal and classification steps simultaneously. Given\
    \ `n` classes, each bounding box is associated with `4+n` dimensional vector that\
    \ outputs `4` box offset coordinates and `n` class probabilities, and training\
    \ is carried out by matching this vector with ground truth labels. Look at the\
    \ following figure to understand the `SSD` framework:\n\n![](image-dst3yzyx.jpg)\
    \ Figure 4.15: SSD framework\n\n# You Only Look Once (YOLO)\n\nYou Only Look Once\
    \ (`YOLO`) is another state-of-the-art real time object detection algorithm. Similar\
    \ to `SSD`, it creates a unified network for predicting region proposals and object\
    \ classes. Moreover, as the name suggests, even in `YOLO`, each image is processed\
    \ once, but unlike `SSD`, `YOLO` does not generate the feature maps before evaluating\
    \ the bounding boxes. Let’s get on to how `YOLO` actually works.\n\nIn the past\
