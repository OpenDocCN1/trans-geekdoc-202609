    # Translation Equivariance


    Okay, now let’s discuss another property called translation equivariance. We can
    say a function is equivariance if the change in input features results in an equivalent
    change in output. Mathematically, a function is called equivariance to `g` if
    it satisfies $f(g(x)) = g(f(x))$. For example, if pattern `0, 0, 4, 3, 0` as an
    input produce `0, 0, 1, 0` as an output then the pattern `0, 4, 3, 0, 0` may results
    into `0, 1, 0, 0`.


    The convolution operation commutes with translation meaning if `T` is a translation
    operator which translates any function such as $T(x) = f(x-y)$ where $y$ is the
    translation of the function $f$ by $y$ then for any two functions $f$ and $g$
    we can write:


    $T(f * g) = (Tf) * g$ ![](image-iq59xlzr.jpg)


    Let’s understand this using an example. Let `I` be a function which returns pixel
    value at every location and `g` be any function which maps pixels from one image
    to another image such that $g(x) = x+y$ where `g` is translation operator, such
    that $Tg(x) = f(x-y)$. The function `g` shifts every pixel of `I` by units. Now,
    `I` and `g` will be equivariance to each other if:


    $g(I * f) = (gI) * f$ ![](image-xa95r5k7.jpg)


    It means, if we apply convolution and then translation operation it will give
    the output which will be the same if we apply translation operation and then convolution.
    An example of translation equivariance is shown in Figure. In this example, Figure
    3.22 represents an input image and 3.23 and 3.24 represent output images:


    ![](image-8yzwbn6u.jpg) Figure 3.22: Input image


    In Figure convolution is performed first and then translation is applied but in
    Figure transformation is performed first and then convolution is applied. We can
    see that we get the same output in both cases. Laplacian kernel has been used
    to perform convolution operation.


    ![](image-fbpeg4l7.jpg) Figure 3.23: Convolution then translation


    ![](image-w1yqru2f.jpg) Figure 3.24: Translation then convolution


    We can exploit sparse connection and parameter sharing in both MLP and convnet
    but we can see that the implementation of these features using CNN is easier than
    MLP. In the case of 3D input, implementation of the above discussed important
    features in a CNN is much less complex than in an MLP.


    We have discussed the limitations of feedforward networks, how CNN can help to
    overcome those issues, how convolution on 2D images is performed, and how we can
    exploit some other important features using CNN. Now, we will discuss convolution
    more figuratively and how to perform convolution on 3D images.


    # Stride


    In this section, we will discuss how we can overcome the issue shown in Figure
    3.18 using padding; we’ll also discuss the concept of stride. Firstly, we will
    start with “stride”. In Figure convolution between input matrix of size 5 × 5
    and filter of size 3 × 3 is shown. In that example, filter convolves with input
    matrix by shifting 1 unit at a time. Stride is defined as the amount of shift
    filter takes after each step. For example, as shown in Figure filter shifts by
    1 unit so stride is 1 but stride can be more than 1.


    In this book, kernel, filter, and feature detector will be used interchangeably.
    In many books, we often see the use of the word “receptive field”. It can be defined
    as the spatial extent of connectivity between kernel and input matrix at a time.
    As kernel shifts, receptive field shifts. So, if the size of a kernel is $n×n$
    then the size of a receptive field will also be $n×n$.


    Let’s look at the effect of stride with examples. Let’s imagine an input matrix
    of size 7 × 7 convolve with filter of size 3 × 3 with stride 1. This convolution
    produces an output matrix of size 5 × 5 as shown in Figure


    ![](image-jpyww7wg.jpg) Figure 3.25: Convolution with a stride of 1. Color box
    represents receptive field. Different color box represent receptive field at different
    positions.


    Now, for the same input and kernel, let’s try stride of 2. Now, receptive field
    will shift by 2 units at a time. We can see in Figure 3.26 that it results in
    an output of size 3 × 3. We can say that as we increase the number of strides,
    the output size shrinks as well.


    ![](image-fjg2sr6n.jpg) Figure 3.26: Convolution with stride of 2. Color box represents
    receptive field. Different color box represent receptive fields at different positions.


    Now, what if we use stride of 3? In Figure it is shown that if we shift the kernel
    once more, then the space of the receptive will come out from the space of input
    matrix. In general, we select stride value such that the size of the output matrix
    remains integer not a fraction means full convolution not partial convolution.


    ![](image-a4sige3w.jpg) Figure 3.27: Convolution with stride of 3. Color box represents
    receptive field. Different color box represent receptive field at different positions.

    '
