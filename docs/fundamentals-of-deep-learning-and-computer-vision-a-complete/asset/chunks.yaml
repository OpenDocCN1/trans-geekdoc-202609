    ## 前言

    近年来，计算机视觉领域（即机器如何观察、处理、分析和解释图像）取得了赞目的进展，这得益于深度学习的进步——这种技术让计算机能够通过示例进行学习。这开启了新的机会，计算机视觉现在被用于各种用途，从医学影像到无人驾驶汽车，再到
    SnapChat 的滤镜。本书讨论了计算机视觉和深度学习的基础概念，这些概念是所有此类应用的基础。本书分为 5 章。


