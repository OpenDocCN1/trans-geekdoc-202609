- raw: "  Convolution in 3D image    Okay, so far we have discussed convolution for\
    \ 2D data, such as 2D images. Let’s extend these concepts to 3D data, such as\
    \ RGB (color) images. We know that 3D input consists of 3 layers where each layer\
    \ is 2D, one stacked behind the other as shown in Figure To perform convolution\
    \ with 3D input, kernel should also be 3D. In general, we can say that if an input\
    \ is n dimensional, then to perform convolution, kernel should also be n dimensional.\
    \ Let’s understand this with a 3D input consisting of 3 channels R, G, and B and\
    \ kernel of depth 3\\. It means the size of the input is m × n × 3 and that of\
    \ kernel is k × l × 3\\. We can see that the depth of both input and kernel is\
    \ same. In general, we can write that if the size of an input is m × n × d then\
    \ to perform the convolution, size of the kernel should be k × l × where, k and\
    \ l are normally several orders magnitude smaller than m and n respectively. \
    \   ![](image-e9rsbtfg.jpg)  Figure 3.38: Example of RGB layer of a 3D image \
    \   Why do we keep the depth of the input matrix and kernel same? In convolution,\
    \ we perform element wise multiplication between input and kernel. In order to\
    \ perform a convolutional operation with an N dimensional input, an N dimensional\
    \ filter is required so that element wise operation can be performed at each layer.\
    \ If we select the depth of a filter less than or greater than the depth of an\
    \ input, it will result in dimensional mismatch error. It is a standard norm to\
    \ convolve a layer of filter with a layer of the input image as shown in Figure\
    \ To extract more features from the input image, we generally keep different values\
    \ at each layer of the kernel. We can keep the same value at each layer or use\
    \ the same layer as stack but then filters will produce scarce representation\
    \ of input features and we know that scarcity leads to less information.    Now,\
    \ convolution between input and filter will result 2D outputs corresponding to\
    \ each layer as shown in Figure Blue squares represent layers of input, green\
    \ squares represent different layers of a filter, purple squares represent results\
    \ of the convolution operation between one layer of filter with the corresponding\
    \ layer of input, and, finally, yellow squares represent stacked purple squares.\
    \ To get the final 2D convolutional output, we add all the values at each layer\
    \ along the depth to get an output as shown in Figure In our case, values in yellow\
    \ squares will be summed up along its depth to produce single 2D input as shown\
    \ in Figure In general, we use multiple kernels of the same size and depth to\
    \ learn the input features. As mentioned earlier, each kernel produces a 2D output;\
    \ hence, the use of multiple kernels produce multiple 2D outputs, one stacked\
    \ behind another as shown in Figure 3.42 and This stacked output acts as an input\
    \ for the next layer and so on. We will discuss the architecture using Figures\
    \ in more detail.    ![](image-kfxt19xy.jpg)  Figure 3.39: Blue squares (Input\
    \ layers), Green squares (Filter layers), Purple squares (result of a convolutional\
    \ operation) and Yellow squares (stacked purple squares).    ![](image-cdvc95rz.jpg) \
    \ Figure 3.40: Input of size 6x6x3 is convolved with a filter of size 3x3x3, results\
    \ a 4x4 matrix as an output.    In Figure 3.41 and a general diagram is shown\
    \ in which a 3D input convolves with multiple 3D filters represents the number\
    \ of filters used) and gives a multidimensional output. Depth (number of channels)\
    \ of the output depends on the number of filters used. We can understand more\
    \ with an example shown in Figure 3.43 in which an input of size 6 x 6 x 5 is\
    \ convolved with 2 filters of size 1 x 1 x 5 each to produce an output of size\
    \ 6 x 6 x 2\\. Each layer of the output corresponds to a convolutional result\
    \ of input and each of the filters. Let’s look at another example in Figure 3.43\
    \ and which is just an extension of what we saw in Figure It shows how we get\
    \ independent 2D convolutional output from each filter, and these outputs stack\
    \ together to become the final output.    ![](image-wigsjmgw.jpg)  Figure 3.41:\
    \ An overview of convolution operation with input and filter.    Figure 3.42 is\
    \ an extended representation of the last Figure which shows an overview of convolution\
    \ operation for one layer with segregated representation of multiple filters for\
    \ better visualization.    ![](image-tx00i0bp.jpg)  Figure 3.42: Input convolved\
    \ with multiple filters and produce multidimensional output.    Figure 3.43 shows\
    \ convolution operation on input image (the leftmost image) of size 6 x 6 x 5\
    \ with 2 filters (central images) of size 1 x 1 x 5 each to produce an output\
    \ (the rightmost image) of size 6 x 6 x 2:    ![](image-3vsq024w.jpg)  Figure\
    \ 3.43: An example of convolution operation    Figure 3.44 shows a more detailed\
    \ convolution operation on input image of size 6 x 6 x 3 with 2 filters of size\
    \ 3 x 3 x 3 to produce output of size 4 x 4 x 2:    ![](image-bmydu4bd.jpg)  Figure\
    \ 3.44: An example of convolution operation. The leftmost image is an input image,\
    \ the next image represents 2 different filters, the next image shows output from\
    \ each filter, and the rightmost image represents the final output.    We have\
    \ discussed convolution for 3 dimensional inputs. Now, let’s discuss how to build\
    \ a single layer convolutional network:    ![](image-8wiphplb.jpg)  Figure 3.45a:\
    \ Convolution operation at one layer    ![](image-qpmcv9ac.jpg)  Figure 3.45b:\
    \ Final stacked output after convolution operation    Figure 3.45a represents\
    \ one layer of simple convolutional layer. We can see that before getting the\
    \ final output, bias values and have been added and then to apply nonlinearity,\
    \ the ReLU function has been used. Same bias value has been added to each value\
    \ of upper square matrix. Similarly, same bias value has been added to each value\
    \ of the bottom square matrix. Finally, the rightmost square matrices will be\
    \ stacked one behind another to form the final output. So, this process of adding\
    \ biases and nonlinear function to different convolutional output and then stacking\
    \ these different output matrices together is one convolution layer.  \n\n  Notations\
    \ used in CNN    Let’s recap the one layer of MLP and then we will try to map\
    \ one layer of CNN with that of feedforward neural network (MLP).    We can write\
    \ the 1st layer of feedforward neural network as:    ![](image-hxmcbk43.jpg) \
    \ then to apply nonlinearity:    ![](image-9tmxzvlr.jpg)  If we make an analogy,\
    \ we can think of as input data, as filters used in 1st layer, as the second rightmost\
    \ matrices shown Figure and as stacked output as shown in Figure    Okay, we have\
    \ seen one layer of CNN but we have not yet discussed the number of parameters.\
    \ Let’s look for one layer. If we have 10 filters, each of size 3 x 3 x 3, then\
    \ how many parameters does one layer have? Since the size of a filter is 3 x 3\
    \ x 3, the total number of elements in one filter will be 27 and one extra bias\
    \ value. Thus, the final number of parameters will be 28\\. As we are looking\
    \ for 10 filters, the total number of parameters for these 10 filters will be\
    \ 280\\. We can see that the number of parameters for 10 filters will remain the\
    \ same no matter how large the image is.    Let’s look at the notation we will\
    \ use to describe convolutional neural network layer. For any layer    ![](image-g3bcdwdk.jpg) \
    \ Now we are familiar with the terminology related to CNN and have also discussed\
    \ the convolutional layer. Moving ahead, let’s discuss architecture of a CNN.\
    \ Typically, a CNN architecture is composed of convolutional layers, pooling layers,\
    \ and fully connected layers. We have discussed the fully connected layer while\
    \ discussing the feedforward network in the last chapter, and we have also discussed\
    \ convolutional layer in earlier sections.  "
  fmt: '

    # Convolution in 3D image


    Okay, so far we have discussed convolution for 2D data, such as 2D images. Let’s
    extend these concepts to 3D data, such as RGB (color) images. We know that 3D
    input consists of 3 layers where each layer is 2D, one stacked behind the other
    as shown in Figure. To perform convolution with 3D input, kernel should also be
    3D. In general, we can say that if an input is `n` dimensional, then to perform
    convolution, kernel should also be `n` dimensional. Let’s understand this with
    a 3D input consisting of 3 channels `R`, `G`, and `B` and kernel of depth `3`.
    It means the size of the input is `m × n × 3` and that of kernel is `k × l × 3`.
    We can see that the depth of both input and kernel is same. In general, we can
    write that if the size of an input is `m × n × d` then to perform the convolution,
    size of the kernel should be `k × l × d` where, `k` and `l` are normally several
    orders magnitude smaller than `m` and `n` respectively.


    ![](image-e9rsbtfg.jpg)

    Figure 3.38: Example of RGB layer of a 3D image


    ## Why do we keep the depth of the input matrix and kernel same?


    In convolution, we perform element wise multiplication between input and kernel.
    In order to perform a convolutional operation with an `N` dimensional input, an
    `N` dimensional filter is required so that element wise operation can be performed
    at each layer. If we select the depth of a filter less than or greater than the
    depth of an input, it will result in dimensional mismatch error. It is a standard
    norm to convolve a layer of filter with a layer of the input image as shown in
    Figure. To extract more features from the input image, we generally keep different
    values at each layer of the kernel. We can keep the same value at each layer or
    use the same layer as stack but then filters will produce scarce representation
    of input features and we know that scarcity leads to less information.


    Now, convolution between input and filter will result 2D outputs corresponding
    to each layer as shown in Figure. Blue squares represent layers of input, green
    squares represent different layers of a filter, purple squares represent results
    of the convolution operation between one layer of filter with the corresponding
    layer of input, and, finally, yellow squares represent stacked purple squares.
    To get the final 2D convolutional output, we add all the values at each layer
    along the depth to get an output as shown in Figure. In our case, values in yellow
    squares will be summed up along its depth to produce single 2D input as shown
    in Figure. In general, we use multiple kernels of the same size and depth to learn
    the input features. As mentioned earlier, each kernel produces a 2D output; hence,
    the use of multiple kernels produce multiple 2D outputs, one stacked behind another
    as shown in Figure 3.42 and this stacked output acts as an input for the next
    layer and so on. We will discuss the architecture using Figures in more detail.


    ![](image-kfxt19xy.jpg)

    Figure 3.39: Blue squares (Input layers), Green squares (Filter layers), Purple
    squares (result of a convolutional operation) and Yellow squares (stacked purple
    squares).


    ![](image-cdvc95rz.jpg)

    Figure 3.40: Input of size `6x6x3` is convolved with a filter of size `3x3x3`,
    results a `4x4` matrix as an output.


    In Figure 3.41 and a general diagram is shown in which a 3D input convolves with
    multiple 3D filters (represents the number of filters used) and gives a multidimensional
    output. Depth (number of channels) of the output depends on the number of filters
    used. We can understand more with an example shown in Figure 3.43 in which an
    input of size `6 x 6 x 5` is convolved with 2 filters of size `1 x 1 x 5` each
    to produce an output of size `6 x 6 x 2`. Each layer of the output corresponds
    to a convolutional result of input and each of the filters. Let’s look at another
    example in Figure 3.43 and which is just an extension of what we saw in Figure.
    It shows how we get independent 2D convolutional output from each filter, and
    these outputs stack together to become the final output.


    ![](image-wigsjmgw.jpg)

    Figure 3.41: An overview of convolution operation with input and filter.


    Figure 3.42 is an extended representation of the last Figure which shows an overview
    of convolution operation for one layer with segregated representation of multiple
    filters for better visualization.


    ![](image-tx00i0bp.jpg)

    Figure 3.42: Input convolved with multiple filters and produce multidimensional
    output.


    Figure 3.43 shows convolution operation on input image (the leftmost image) of
    size `6 x 6 x 5` with 2 filters (central images) of size `1 x 1 x 5` each to produce
    an output (the rightmost image) of size `6 x 6 x 2`:


    ![](image-3vsq024w.jpg)

    Figure 3.43: An example of convolution operation


    Figure 3.44 shows a more detailed convolution operation on input image of size
    `6 x 6 x 3` with 2 filters of size `3 x 3 x 3` to produce output of size `4 x
    4 x 2`:


    ![](image-bmydu4bd.jpg)

    Figure 3.44: An example of convolution operation. The leftmost image is input
    image, the next image represents filters used, the next image shows output from
    each filter, and the rightmost image represents final output.


    We have discussed convolution for 3 dimensional inputs. Now, let’s discuss how
    to build a single layer:


    ![](image-8wiphpl.jpg)

    Figure 3.45a: Convolution operation at one layer


    ![](image-qpm9ac.jpg)

    Figure 3.45b: Final stacked output after convolution operation Figure 3.45a represents
    simple convolutional layer. We can see that before getting the final output, bias
    values have been added and then to apply nonlinearity, the `ReLU` function has
    been used. Same bias value has been added to each value of upper matrix. Similarly,
    same bias value has been added to each value of bottom matrix. Finally, the rightmost
    square matrices will be stacked one another to form the final output. So, this
    process of adding biases and nonlinear function to different output and then stacking
    these output together is convolution layer.


    ## Notations used in CNN


    Let’s recap one layer of MLP and then we will try to map one layer of CNN with
    that of feedforward network. We can write the 1st layer of feedforward network
    as:


    ![](image-hxmcbk43.jpg)


    then to apply nonlinearity:


    ![](image-9tmxzvlr.jpg)


    If we make an analogy, we can think of as input data, as filters used in 1st layer,
    as the second rightmost matrices shown Figure and as stacked output as shown in
    Figure Okay, we have seen one layer of CNN but we have not yet discussed the number
    of parameters. Let’s look for one layer. If we have 10 filters, each of size `3
    x 3 x 3`, then how many parameters does one layer have? Since the size of a filter
    is `3 x 3 x 3`, the total number of elements in one filter will be 27 and one
    extra bias value. Thus, the final number of parameters will be 28. As we are looking
    for 10 filters, the total number of parameters for these 10 filters will be 280.
    We can see that the number of parameters for 10 filters will remain the same no
    how large the image is. Let’s look at the notation we will use to describe convolutional
    neural network layer. For any layer


    ![](image-g3bcdwdk.jpg)


    Now we are familiar with the terminology related to CNN and have also discussed
    the convolutional layer. Moving ahead, let’s discuss architecture of a CNN. Typically,
    a CNN architecture is composed of convolutional layers, pooling layers, and fully
    connected layers. We have discussed the fully connected layer while discussing
    the feedforward network in the last chapter, and we have also discussed convolutional
    layer in earlier sections.

