    `y` 属于 0 或 1。为了实现这一约束，我们将选择一种能够将模型的输出值压缩在 0 和 1 之间的函数。`sigmoid` 函数将输出值保持在 0 到
    1 之间。`sigmoid` 函数也称为逻辑回归函数（logistic function）。在数学上，`sigmoid` 函数定义为：


