    a \= \+ w.r.t w and x and then w.r.t a and    ![](image-5zmq96su.jpg)  We are
    interested in calculating partial derivatives of ⨍ with respect to x and Now,
    let’s find the gradient of ⨍ with respect to each of the input.    ![](image-y58ein0t.jpg) 
    Now, we will use numerical values to understand the result of partial derivatives.
    Suppose we choose w \= – 3, x \= – 1 and y \= 3\. Now, we will see how each of
    the input values affects the function.    we can see that gradient of ⨍ with respect
    to a has a positive sign. It means that if we increase ⨍ will increase or if we
    decrease ⨍ will decrease. In other words, to increase or decrease we will have
    to increase or decrease a accordingly with a magnitude of 3\. Continuing with
