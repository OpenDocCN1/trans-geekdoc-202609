    # 单次击检测器 (SSD)


    单次击检测器 `SSD` 是一种先进的实时目标检测算法，与 `Faster R-CNN` 相比，它提供了极快的速度，而且性能也相当出色，但采用了不同的方法。


    到目前为止，我们讨论的每个模型都包含两个组件。首先，我们生成 `RoIs` 或区域建议，然后使用 `ConvNets` 对这些区域进行分类。`SSD` 在单一步中完成了这两个步骤。当它处理图像时，它会同时预测边界框和类别。


    现在，当我们拥有了输入图像和边界框的真值表（即它们的坐标和包含的物体）后，让我们来看看 `SSD` 是如何实现这一点的。首先，图像通过一个 `ConvNet`（一系列卷积层），生成不同尺的特征图（以包含不同尺寸物体的可能性）——`10
    X 10`、`5 X 5` 和 `3 X 3`。现在，对于不同特征图的每个位置，使用 `3 X 3` 过滤器来评估一组较小的默认边界框或锚框（anchor
    boxes）。


    在训练期间，根据 `IoU`（交并比指标）将真值框 (`GTB`) 与预测框 (`PB`) 进行匹配。`IoU` 的计算方法所示：


    ```

    IoU = (Common area shared by GTB and PB)/(Area of GTB + Area of PB-Common area
    shared by GTB and PB)

    ```


    “最佳预测框被标记为正样本”，所有其他与真值框 `IoU` `> 0.5` 的框也是如此。通过这种方法，会生成大量的边界框，因为我们在图像的每一个位置上，使用多种形状、在多个不同尺度上分类并绘制边界框。为了克服这个问题，使用了之前讨论过的
    `NMS` 或非极大值抑制，将高度重叠的框合并为一个。


    总结来说，`SSD` 同时执行区域建议和分类步骤。在给定 `n` 类的情况下，每个边界框都与一个 `4+n` 维向量相关联，该向量输出 `4` 个框偏移量坐标和
    `n` 个类别概率，并通过将此向量与真值标签匹配来完成训练。请下图以理解 `SSD` 框架：


    ![](img/image-dst3yzyx.jpg) 图 4.15: SSD 框架


    # 只看一次 (YOLO)


    只看一次 (`YOLO`) 是另一种先进的实时目标检测算法。与 `SSD` 类似，它也创建了一个统一的网络来预测区域建议和物体类别。此外，正如名称所示，即使在
    `YOLO` 中，每个图像也只处理一次，但与 `SSD` 不同，`YOLO` 在评估边界框之前不会生成特征图。让我们来看看 `YOLO` 到底是如何工作的。


    过去的几年里，研究人员提出了不同版本的 `YOLO`，每一个都是前一个版本的启发和改进版本——`YOLOv1`、`YOLOv2` 和 `YOLOv3` 是最新的版本。我们将主要围绕最新版本
    `YOLOv3` 以及它从之前版本继承的各种想法展开讨论。从这里开始，`YOLO` 应读并理解为 `YOLOv3`。


    我们之前讨论过 `YOLO` 创建了一个统一网络来实现端到端训练。让我们进一步理解这一点。在 `YOLO` 中，输入图像被划分为 `SXS` 网格，如图所示：


    ![](img/image-ck76ni.jpg) 图 4.16: YOLO 统一网络


    其余文本遵循 `YOLOv3` 架构的相同逻辑：

    - 输入图像被划分为 `SXS` 网格。

    - `YOLOv3` 预测边界框、物体性（objectness）和类别预测。

    - 所有卷积层都使用了 `Batch Normalization`。

    - 使用二交叉熵损失用于多标签分类。

    - `YOLOv3` 的运行速度远快于其他检测方法。

    - 除了上述特征，相对于之前的版本还有进一步的改进，例如直接位置预测、基于尺寸的聚类、特征上采样和拼接。


    ## 详细改进


    ### 直接位置预测


    在训练的早期迭代中，模型变得非常不稳定，因为对边界框预测没有约束。锚框可能位于图像中的任何点。`YOLOv3`（以及 `YOLO2`）使用逻辑激活函数 `σ`
    来限制位置，使得值落在 `0` 到 `1` 之间（相对于网格单元）。在限制位置预测后，参数化更容易学习，使得网络更加稳定。


    ![](img/image-cw69hh.jpg) 图 4.19: 带有尺寸先验和位置预测的边界框


    ### 尺寸聚类


    在使用锚框进行边界框预测时，根据自引入基于区域建议的方法以做法，需要手动挑选锚框。在 `YOLOv3` 中，不再通过手动选择先验，而是对训练集边界框运行聚类，以自动找到好的先验。使用标准的欧几里距离时，大框产生的误差比小框多，但需要具有良好
    `IoU` 分数的先验。因此，为此目的使用的距离度量是：


    ```

    Distance Metric

    ```

    实验发现，`k = 5` 是在模型复杂性和高召回率之间取得良好平衡的最佳值。


    ### 特征上采样和拼接


    `YOLOv3` 在 3 个不同的尺度上预测框，以成功捕捉小型和大型物体。在基础特征提取器 `Darknet-53` 中添加了几个卷积层。这些层中的最后一个预测边界框、物体性和类别预测。接下来，从之前的两个层提取特征图并进行
    `2×` 上采样。这种方法允许我们从上采样的特征中获得更有意义的语义信息，并从较早特征图中获得更细粒度的信息。然后，添加了几个卷积层来处理这种组合特征图，并最终预测每个尺度的输出。


    '
