    # 激活函数


    到目前，我们讨论了网络架构、代价函数和优化技术。现在，我们将讨论在每一层中应该选择以及选择什么样的隐藏单元。之前，我们使用 `sigmoid` 函数作为隐藏单元的激活函数。在本节中，我们将讨论其他类型的激活函数，但让我们先讨论为什么我们需要激活函数。


    在线性模型中，我们使用单个神经元，并将权重和输入的线性组合来拟合模型。从数学上讲，我们尝试预测输出 `y` 为：

    ![](img/image-6ew1onzc.jpg)

    它产生一个线性决策边界，因此是一个线性分类器。我们的目标是得到一个非线性分类器。我们使用神经网络来构建非线性模型，并且神经网络中的每个神经元获取的输入类似于广义线性模型。


    我们可以写出通用方程，通过该方程神经元获取输入：

    ![](img/image-rgh0ny38.jpg)

    在线性模型中，我们使用线性函数作为激活函数。让我们在神经网络模型中尝试线性激活函数。假设我们在隐藏单元和神经网络模型的输出单元中使用线性激活函数，如图所示，我们知道隐藏单元的输入可以写为：`z
    = X + b`，隐藏单元的输出可以写为 `a = f(z)`，其中 `f` 代表该层的激活函数。由于我们假设 `f` 是线性函数，所以我们可以写道，同样，对于输出层，我们可以写道
    ![](img/image-4zu4vh1o.jpg)其中 `a = f(z)`。我们可以看到神经网络输出的是线性函数。


    将此结果推广到多个层，我们可以说，如果对神经网络使用线性激活函数，那么无论神经网络有多少层，它计算的都是线性函数。换句话说，我们可以说神经网络的行为将像它没有隐藏单元一样。同样地，我们可以看到，如果我们将输出层的激活函数从线性改为
    `sigmoid` 函数，那么同一个神经网络将表现得像逻辑回归模型，因为输出单元的输入是权重和原始输入的线性线性组合。在回归和时间序列预测等问题中，我们可以在输出单元使用线性激活，但在隐藏层中我们应该使用不同的激活函数。


    到目前为止，我们讨论了通过仅使用线性激活函数，我们将无法获得非线性分类器。为了实现这一目标，需要以激活函数的形式在网络中引入非线性。现在，让我们来介绍神经网络中一些广泛使用的非线性激活函数。


    ## Sigmoid 函数


    ![](img/image-9ez6szt0.jpg) ![](img/image-a5dg784c.jpg) 图 2.17

    图 2.17 显示了 sigmoid 函数的图像。传统上，sigmoid 函数被用作神经网络的激活函数。它将值压缩在 0 到 1 的范围内。它被广泛应用于二分类问题。虽然
    sigmoid 函数引入了非线性，但它也有一些缺点。让我们来看看：


    *   **梯度消失**：当隐藏单元的输出值达到 0 或 1 时，梯度由于饱和而变为零（斜率 `f'' = 0`）。我们知道参数将不会更新（我们下一节中将更多更多反向传播）。由于这个问题，在初始化参数时也需要额外小心，因为如果初始值很高，就会饱和。

    *   **非零中心输出**：隐藏单元的输出产生非中心化数据，这会在梯度下降过程中产生之字形动态；因此导致收敛较慢。


    ## Tanh 函数


    函数的表示形式为：![](img/image-jwmu86je.jpg)

    Tanh 是另一种用作激活函数的非线性函数。它将值压缩在 –1 到 1 的范围内。如果对其进行适当分析，我们可以看到 tanh 是 sigmoid 函数的平移版本。从数学上讲，我们可以将其写为
    `tanh(x) = (e^x - e^-x)/(e^x + e^-x)`。Tanh 也存在梯度消失问题，但由于零中心输出优于 sigmoid 函数。


    ## ReLU


    `f = max(0, x)` ![](img/image-zscora.jpg) 图 2.19

    修正线性单元通常称为 `relu`，使用上述函数。由于与线性函数的相似性，`relu` 容易优化。`relu` 与线性函数的区别在于当 `x` 小于等于 0
    时它输出零值。图 2.19 展示了 `relu` 函数的图像。`relu` 的导数在其定义域范围内为 1；这意味着当 `x` 大于 0 时，隐藏单元将保持激活。这有助于避免
    `x` 大于 0 时的梯度消失问题。与 sigmoid 和 tanh 函数 x 值较大时梯度值会减小相反，`relu` 函数的梯度保持不变，有助于加速收敛。与
    sigmoid 和 tanh 函数不同，`relu` 由于其特性（当 `x ≤ 0` 时输出 0）提供了稀疏网络。


    ## Leaky ReLU


    `f = max(αx, x)` ![](img/image-rdl9cu5n.jpg) 图 2.20

    如前所述，`leaky relu` 试图解决死亡 `relu` 问题。它使用上述函数，其中 `α` 是一个非常小的数。在 `relu` 中，当 `x ≤ 0`
    时返回 0，但在 `leaky relu` 中，它将返回该值。我们通常将 `α` 的小值保持在 0.01 或更小。


    '
