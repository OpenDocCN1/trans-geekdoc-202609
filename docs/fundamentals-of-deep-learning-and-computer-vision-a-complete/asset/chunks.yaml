    # Vanishing gradient problem


    As we discussed, RNN may be used to find the upcoming event using previous data,
    such as the description of the next frame using past frames in a video and the
    most suitable next words in a sentence. After knowing that RNNs are good for sequential
    data, can RNN be used to solve the real life complex problems? If yes, then how
    much previous data is required? How far any information can be passed to next
    blocks? Let’s understand this by revisiting the “fill in the blank” example. In
    that example, we had to find a more appropriate word to fill the blanks in a sentence.
    Here is the same sentence, color of the sky is blue. We had discussed that in
    these types of questions, RNN can use previous context to find an appropriate
    word. Here, the difference between the relevant information and the word which
