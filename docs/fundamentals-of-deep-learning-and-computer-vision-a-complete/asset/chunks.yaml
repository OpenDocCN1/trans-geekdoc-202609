    # 为什么选择 RNN？


    RNN 利用了统计学习中早期且重要的思想之一，即模型不同部分之间的参数共享。参数共享使得模型能够对训练期间未见过的不同长度的输入序列进行泛化处理。


    让我们通过这两个句子来理解参数共享的重要性：“It was raining in the morning”（早上在下雨）和“In the morning,
    it was raining”（在早上，正在下雨）。当我们将这两行输入模型并寻找早上的天气状况时，无论 `raining` 在两个句子中的位置如何，我们期望的都是
    `raining`。


    现在，如果我们将这些句子作为输入传递到全连接神经网络，网络将为每个句子拥有独立的参数。因此，全连接神经网络需要在句子的每个位置单独学习语言的所有规则，这导致产生一个具有大量参数的复杂模型。


    相反，由于参数共享属性，RNN 在多个时间步之间共享相同的权重，使得模型复杂性降低，参数也更少。此外，全连接前馈网络仅将输入映射到输出向量，而 RNN 则将之前所有输入的完整历史映射到每个输出。


    我们可以通过图示更深入地理解上述结论。假设我们有形式为 `Input1`、`Input2` 和 `Input3` 的序列输入，我们的目标是建立这些序列输入之间的关系。图
    5.3(a) 描述了一个前馈网络，其中输入层一次接收所有输入并将其传递给下一个隐藏层，随后是激活层，直到到达输出层。每个隐藏层都有自己的权重和偏置；因此，每个层都是独立运行的。


    ![](img/image-cx15zxyw.jpg) 图 5.3(a)：前馈网络


    但我们的目标是建立序列输入之间的关系。我们如何实现这一点呢？首先，我们也可以在隐藏层提供输入，如图所示。但每个隐藏层仍然有自己的权重和偏置，由于此，它们仍然独立运行，因此每个隐藏层为其每个输入创建不同的规则。


    ![](img/image-9aybrrl9.jpg) 图 5.3(b)：隐藏层的输入（具有独立的权重和偏置）


    为了实现我们的目标，我们也可以在隐藏层提供输入，如图所示。但每个隐藏层仍然有自己的权重和偏置，由于此，它们仍然独立运行，因此每个隐藏层为其每个输入创建不同的规则。


    ![](img/image-7dfp08.jpg) 图 5.3(c)：隐藏层的输入（具有独立的权重和偏置）


    卷积网络也有参数共享，例如，卷积网络可以用于序列数据，但由于卷积核较小，参数共享是浅层次的。在 RNN 中，每个输出单元都是所有之前单元的函数。因此，每个输出单元都是其之前单元的函数。


    ## 前向传播


    我们可以认为 RNN 的前向传播类似于单层前馈网络，不同之处是隐藏层的输入来自上一个时间步。


    ![](img/image-pxnyowl.jpg) 图 5.4：单个单元的展开视图


    图 5.4 展示了展开的更详细的视图。例如，如果我们考虑句子“It was raining in the morning”，`It` 代表第一个词，`was`
    代表第二个词。在这里，`raining` 代表每个时间步的隐藏单元。因此，在任何时间步，其计算方式如下：


    ```

    h_t = f(W_h * h_{t-1} + W_x * x_t + b_h)

    ```


    ![](img/image-asfepmb.jpg) 其中 `f` 是任何非线性函数，主要是 `Tanh` 或 `ReLU`。任何时间步的输出计算方式如下：


    ```

    y_t = g(W_y * h_t + b_y)

    ```


    ![](img/image-xbc8ia98.jpg) 其中 `g` 是激活函数，例如 `softmax` 或其他函数。隐藏激活的完整序列可以通过从 `t=0`
    开始递归地应用公式 (5.2) 计算得出。注意，在时间步 1，即没有来自上一个隐藏单元的输入，因此我们假设初始值为 0，但观察到在某些情况下非零初始值会效果结果。从图
    5.4 可以看出，RNN 在所有步骤之间共享参数。在本章中，我们将交替使用 `h` 和 `y` 来表示 RNN 网络的隐藏状态和输出状态。


    ## RNN 的变体


    根据架构或捕捉序列信息的方式，有不同类型的 RNN。下面提到了不同类型 RNN 的概述。


    设 `x` 为输入向量，`h` 为隐藏单元向量，`y` 为输出向量。`W`、`U` 和 `V` 分别是输入层、隐藏层和输出层的权重；`bh` 和 `by`
    分别是隐藏层和输出层的偏置参数；`f` 和 `g` 分别是隐藏层和输出层的激活函数。


    Vanilla RNN（也称为 Elman）在当前隐藏层具有来自上一个时间步 `t-1` 隐藏层的时间连接。在普通的前馈神经网络中，`t` 处的隐藏层仅取决于
    `x_t`，而在 RNN 的情况下，会有来自 `t-1` 刻的成分影响当前输出。


    ![](img/image-5chf2asz.jpg) Jordan 网络是 RNN 的另一种变体，其中循环连接允许在当前时间步使用上一个时间步预测的信息。因此，某一刻的隐藏层依赖于
    `t-1` 刻的预测。


    ![](img/image-ndeb2isx.jpg)


