    # Gradient Descent


    Gradient descent helps to find the direction of steep that will be used to converge
    the cost function. To get the possible converging point, we will have to calculate
    the slope of the function and take small steps `δx` to reach the minimum point.
    Using the first principle, we will define small change in function `y=f(x)` as
    follows:


    ![](image-ryrzx5f8.jpg)


    For very small steps, we can write the following:


    ![](image-n8btz01s.jpg)


    More comprehensively, we can write `+ \ = –`. We also know that for increasing
    function `> 0` and `< 0` for decreasing function. We can infer from this equation
    that, for increasing function `–` is less than. Hence, to decrease the value of
    `y` take a small step in the opposite direction of `⨍`. Similarly, we can do this
    for the decreasing function.


    Using the preceding arguments, we can say that the new point will be `x = x –
    αδx` where `α` is defined as learning rate, which determines the size of the small
    step. Generally, we set a very small constant number for the value of `α` so that
    it converges at optimum rate and does not jump the desired minimum point. In multiple
    dimensions, when there are multiple independent variables, `∇` will be computed
    for each direction. For multivariate inputs, we will compute gradient of function
    which is denoted as `∇J()`. This gradient computation technique is defined as
    gradient descent.


    ![](image-6d5j9mez.jpg)

    Figure 2.14


    We can understand the above arguments using Figure. In this example, a simple
    parabolic curve is used that can be represented mathematically by using the `y
    ≈ x²` equation. The derivative of `f(x)` is `⨍ = 2x`. Now, using the increasing
    and decreasing function criteria, we can say that for `x > 0`, this function behaves
    as an increasing function and for `x < 0`, this function behaves as a decreasing
    function. At `x = 0`, `⨍` is also `0`; these are called stationary or critical
    points.


    We can check if the point is minima or maxima by evaluating the function value
    at neighboring points. If a value at neighboring points is greater than a value
    at the critical point, then the critical point is a local minima. Similarly, if
    a value at neighboring points is lower than a value at the critical point, then
    the critical point is a local maxima. We may encounter multiple local extrema
    in a graph. A critical point that gives the lowest absolute value of a graph is
    defined as a global minimum. Similarly, a critical point that gives the highest
    absolute value of a graph is defined as a global maximum.


    ![](image-2ik2uex4.jpg)

    Figure 2.15


    We can understand the last paragraph using Figure. Let’s suppose the graph in
    Figure 2.15 represents any cost function. `x` represents points and `y` represents
    value of function at those points. Figure 2.15 depicts three minima, out of which,
    one is a global minimum and the other two are local minimum. In gradient descent,
    our aim should be to reach the global minimum, but due to nonlinearity and multidimensionality
    in network, we usually settle at a local minimum.


    In the above graph, we can see that the value at local minimum (1) is closer to
    global minimum than that of local minimum (2). So, the model will perform much
    better at point 1 than point 2. Hence, local minimum (1) is acceptable and local
    minimum (2) should be avoided.


    ## Optimization Techniques


    Now, we will discuss how to update parameters using gradient descent. First, we
    will discuss least square cost function. As explained in the earlier section,
    least square cost function is defined as:


    ```

    J(w, b) = 1/(2m) * Σ (y_i - (wx_i + b))²

    ```


    Our aim is to choose `w` and `b` such that it minimizes the cost function. We
    will use the above-discussed “line search” method and gradient descent algorithm
    to update `w` and `b` as:


    ```

    w = w - α∂J/∂w

    b = b - α∂J/∂b

    ```


    Let’s calculate partial derivative of cost function with respect to each parameter.
    For a sample, with a weight value, and a bias value:


    ```

    ∂J/∂w = -(1/m) * Σ (y_i - (wx_i + b)) * x_i

    ∂J/∂b = -(1/m) * Σ (y_i - (wx_i + b))

    ```


    Similarly, for a sample with multiple features, the above equation gets changed
    as:


    ```

    ∂J/∂w_j = -(1/m) * Σ (y_i - (Σ w_kx_k + b)) * x_ij

    ```


    Partial derivative with `b` will remain the same. So, we can write the update
    rule for `w` as:


    ```

    w_j = w_j - α∂J/∂w_j

    ```


    Notice the sign change in equation. Few books use `+` others `-`; however, both
    are the same. It depends on whether we use `-` or `-` in cost function to derive
    the update rule. For a training set of `m` samples, we can write the update rule
    for each weight of `w` as:


    ```

    w_j = w_j + α(1/m) * Σ (y_i - h_i) * x_ij

    ```


    We perform this update till convergence. This method uses every sample point in
    the training set to update parameters at each step; hence, this algorithm is known
    as batch gradient descent.


    Now that we discussed how to update parameters using the least square cost function,
    let’s discuss the same for the cross-entropy cost function, for which we had defined
    `m` samples earlier as follows:


    ```

    J(w, b) = -1/m * Σ [y_i * log(h_i) + (1-y_i) * log(1-h_i)]

    ```


    We will discuss the update rule in a similar manner as we did for previous cost
    functions. For 1 sample with single weight and bias value. Now, our cost function
    will be:


    ```

    J(w, b) = -[y * log(h) + (1-y) * log(1-h)]

    ```


    Where:


    ```

    h = 1/(1 + e^{-(wx+b)})

    ```


    Now:


    ```

    ∂J/∂w = (1/m) * (h - y) * x

    ∂J/∂b = (1/m) * (h - y)

    ```


    So, we can write the update equation as:


    ```

    w = w - α(1/m) * Σ (h_i - y_i) * x_i

    b = b - α(1/m) * Σ (h_i - y_i)

    ```


    We can see that we got the same update as earlier, but in this case, `h` in nonlinear.
    For multiple features, update rule will change as:


    ```

    w_j = w_j - α(1/m) * Σ (h_i - y_i) * x_ij

    ```


    and for bias `b` it will remain the same.

