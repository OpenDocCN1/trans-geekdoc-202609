- raw: "  Conclusion    In this chapter, we covered a lot of state-of-the-art techniques\
    \ and architectures. As an extension of the basic CNN architecture covered in\
    \ the last chapter, we started with understanding classic CNN architectures like\
    \ AlexNet, VGGNet, Inception, and ResNet, along with the different design techniques\
    \ applied in each of them. We also discussed the general object detection framework,\
    \ and how object detection is different from image classification. We understood\
    \ different architectures, such as R-CNN, Fast R-CNN, Faster R-CNN, SSD, and YOLOv3,\
    \ and how SSD and YOLOv3 are better than the previous ones.    In the next and\
    \ the last chapter, we will learn about sequential networks and their different\
    \ applications in real world problems.  \n\nCHAPTER 5    Sequential Models   \
    \ According to some, there’s nothing new beneath the sun. That seems dubious,\
    \ but it is true that every seemingly new thing experienced is, in fact, the product\
    \ of vast and unseen contexts. For example, humans don’t start to think from scratch\
    \ every time new information appears. When, say, reading a book, understanding\
    \ is built upon previous knowledge, either in a macro sense, such as understanding\
    \ the language the words are written in or the tropes of gender, or in the micro\
    \ sense, the context provided by earlier pages in the book being read. One name\
    \ for these is sequential contexts. Even if thoughts seem novel, their novelty\
    \ is born from a string of previous thoughts.  \n\n  Structure     RNN    GRU\
    \    LSTM    Image captioning  \n\n  Objective    After reading this chapter,\
    \ we will learn how to get a semantic description of an image using deep recurrent\
    \ networks and its interesting real-life applications.  \n\n  RNN    Traditionally,\
    \ whenever something was requested from a machine like a computer, it started\
    \ anew each time. For example, when using a calculator, each new sum is a surprise\
    \ to the machine; it has no memory of the previous mathematical habits of its\
    \ users. This isn’t just a problem in simple machines like computers. There is\
    \ a lack of sequential contexts in traditional neural networks, and this is a\
    \ significant drawback, for example, when describing the kind of scenario that\
    \ is happening at every point in a video or the subsequent scene in a video. How\
    \ then to approach these types of problems? Traditional neural networks take all\
    \ input at the same instant; hence, they don’t get any sequential data as an input.\
    \ Due to the lack of structured input sequence, it becomes difficult to find the\
    \ pattern in data and hence, impossible to predict what may come next, for example,\
    \ prediction of a new frame using previous frames. It remains unclear for researchers\
    \ to find how a traditional neural network can be used for sequential data.   \
    \ Instead of trudging along with traditional neural networking, researchers shifted\
    \ their focus and proposed a new algorithm called Recurrent Neural commonly known\
    \ as RNN. An RNN is a class of artificial neural networks, which models data that\
    \ has sequential property. As convolutional network is specialized for processing\
    \ a grid of values such as an image, RNN is designed to recognize patterns in\
    \ sequences of data, such as text, genomes, time series data from sensors, stock\
    \ markets, and government agencies. It forms a directed graph, where a connection\
    \ between two nodes can be across time instances.    If … are the data instances,\
    \ where xi is the feature of the instance and yi is the corresponding label, then\
    \ mathematically, an RNN model can be defined as:    ![](image-v4wxclks.jpg) \
    \ where z is x2, …, xi − 1\\.    As evident from equation 5.1, RNN uses data from\
    \ previous instances to return the output of data at current instances. Thus,\
    \ RNN can be used for representing temporal or sequential information.    RNN\
    \ uses loops in the network which helps to persist information.    ![](image-cgvnrgpw.jpg) \
    \ Figure 5.1: Simple RNN with loops    Figure 5.1 represents a small building\
    \ block of an RNN. As seen in the figure, it takes any input ‘xt’ and outputs\
    \ a value ht. The above diagram also contains a loop; loops help to pass information\
    \ in the network from one time-step to the next. For example, when reading a sentence,\
    \ the first word is encountered, and then the second, the third and so on. Each\
    \ word in a sentence represents a time-step. Comprehending the meaning of a sentence\
    \ relies on following the entire sentence from the first word to the last and\
    \ then understanding a relationship between them. Similarly, for machines, loops\
    \ help to pass the information from previous time steps to the next time steps.\
    \    Figure 5.2 represents an unrolled diagram of an RNN in a chain like structure\
    \ which shows that RNN can be used in sequence-like data.    ![](image-zkrwt9x1.jpg) \
    \ Figure 5.2: An unrolled RNN    Now, each input, at different time instants can\
    \ be shown. Each small block represented by A resembles a simple neuron. Hence,\
    \ an RNN can be described as a collection of similar networks connected with each\
    \ other at different time-steps, passing information to the next block.    In\
    \ the last few years, RNNs have shown incredible improvements in the field of\
    \ speech recognition, time series forecasting, image captioning, sequence classification,\
    \ language translation, and many others.  "
