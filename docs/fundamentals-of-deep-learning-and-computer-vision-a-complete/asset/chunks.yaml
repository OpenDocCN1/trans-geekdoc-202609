  trans: "\n\n# TensorFlow 中的分布式计算\n\n现在我们来介绍 TensorFlow 程序中一个非常重要的部分，即读取文件。我们将遇到一些需要从\
    \ csv、json 或其他格式的文件加载训练数据或样本数据的场景。我们将使用内置的 Python 函数来打开文件并逐行读取，并将这些数据存储到我们之前学过的占位符（placeholder）中。假设我们有一个包含库存信息的\
    \ `data.csv` 文件。\n\n## 程序开始\n\n```python\nimport tensorflow as tf\nimport os\n\
    dir_path = os.path.dirname(os.path.realpath(__file__))\nfilename = dir_path +\
    \ \"/data.csv\"\nfeatures = tf.placeholder(tf.int32, shape=[3], name='features')\n\
    category = tf.placeholder(tf.string, name='category')\ntotal = tf.reduce_sum(features,\
    \ name='total')\nwith tf.Session() as sess:\n  sess.run( tf.global_variables_initializer())\n\
    \  with open(filename) as inf:\n    # 跳过表头\n    next(inf)\n    for line in inf:\n\
    \      # 使用 python 将数据读取到我们的 features 中\n      category_name, code, sold, remaining,\
    \ defected, total = line.strip().split(\",\")\n      sold = int(sold)\n      remaining\
    \ = int(remaining)\n      defected = int(defected)\n      total = sess.run(printerop,\
    \ feed_dict={features: [sold, remaining, defected], category:category_name})\n\
    \      print(category_name, total)\n```\n\nTensorFlow 对分布式计算提供了惊人的支持。这允许我们将图的部分在集群中不同的\
    \ CPU、GPU 上运行。TensorFlow 的分布式实现与本地实现共享大部分代码，此外支持工作节点（workers）、客户端（client）和主节点（master）作为集群内多个系统的进程运行的环境。你可以将其比为客户端服务器模型。然后，我们将创建许多工作节点，它们如图所示处理计算部分。一旦\
    \ TensorFlow 给一个计算图，它的首要目标是决定由哪个 CPU 执行特定节点的计算。\n\n![](img/image-9mcx79x4.jpg)\
    \ 图 1.18\n\n现在，让我们来看一个非常简单的 TensorFlow 程序，并让它在分布式环境中运行。\n\n## 程序开始\n\n```python\n\
    import tensorflow as tf\nx = tf.constant(10)\ny1 = x + 120\ny2 = x - 32\ny = y1\
    \ + y2\nwith tf.Session() as sess:\n  result = sess.run(y)\n  print(result)\n\
    ```\n\n上面的程序是加法和减法的组合，并没有什么复杂的逻辑。程序的输出是：\n\n现在，让我们来看一段尝试将上述程序分布在两个进程上的代码。首先，我们在程序中创建一个如下的集群规范（cluster\
    \ spec）：\n\n```python\nimport tensorflow as tf\ncluster = tf.train.ClusterSpec({\"\
    local\": [\"localhost:2222\", \"localhost:2223\"]})\n```\n\n我们指定了运行在端口号 2222 和\
    \ 2223 的两个工作节点。接下来，我们启动进程：\n\n`server = tf.train.Server(cluster, job_name=\"local\"\
    , task_index=1)`\n\n这在 2223 端口启动了一个工作节点进程。接下来，我们将在两个不同的终端中启动上面定义的两个工作节点。将代码保存为\
    \ `start_worker.py`，并在两个终端中执行程序 `python start_worker.py 0` 和 `python start_worker.py`。可以在本地机器上或网络集群中创建更多工作节点，其中\
    \ localhost 被替换为集群中设备的 IP 地址。\n\n现在，我们将创建一个主节点，它将在工作节点上调度子图。\n\n```python\nimport\
    \ tensorflow as tf\ncluster = tf.train.ClusterSpec({\"local\": [\"localhost:2222\"\
    , \"localhost:2223\"]})\nx = tf.constant(1)\nwith tf.device(\"grpc://localhost:2222\"\
    ):\n    y1 = x + 2\nwith tf.device(\"grpc://localhost:2223\"):\n    y2 = x - 3\n\
    y = y1 + y2\nwith tf.Session() as sess:\n  result = sess.run(y)\n  print(result)\n\
    ```\n\n这将任务在工作节点上分布。\n\n# 总结\n\n在本章中，我们讨论了张量（tensors）的概念，并学习了如何在 TensorFlow 中创建张量并执行这些数学操作。我们还讨论了\
    \ TensorFlow 的主要构建块，如计算图、用于输入的占位符以及用于调优参数的变量。我们学习了张量数组，并涵盖了数据类型、形状。我们将在后续章节中反复应用本章的概念。在下一章，我们将进入计算机视觉。\n\
    \n# 第 2 章：神经网络简介\n\n在上一章中，我们讨论了流行的深度学习框架 —— TensorFlow。在本章及之后，我们将讨论现代深度学习算法及其解决问题的实用性。深度学习历史悠久，并模拟人类大脑。文献中提出的许多技术尚未达到其目标和预期。研究人员正在通过提出复杂且革命性的思想深入这一领域。传统上，深度学习研究人员主要关注监督学习，但最近深度学习正在扩展到其他学习方法，如半监督、无监督和强化学习。\n\
    \n深度学习可以简化为执行 A 到 B 的映射。A 和 B 分别代表输入和输出向量。更准确、全面的解释是，深度学习是在通用函数近似；意味着在有足够数据的情况下，它可以近似任何函数。我们可以通过扩展层和在每层中添加更多单元来增加函数的复杂度，这简单意味着为函数添加更多变量和参数。与传统的机器学习算法相比，深度学习具有更好的学习能力；因此它可以从数据集中选择更好的特征。\n\
    \n## 结构\n\n- 损失函数\n- 激活函数\n- 优化（SGD, RMSPROP, ADAM, SortaGrad）\n- 反向传播\n- 多层感知机\n\
    - 让我们构建：一个时尚 MNIST 分类器来分类衣服\n\n## 目标\n\n在本章中，我们将学习近似参数函数的基本方法和技术。我们将从线性模型及其局限性开始讨论。然后，我们将讨论一种非线性网络——前馈网络（也称为多层感知机，通常被称为神经网络），它基本上是近期深度学习算法背后的技术。接下来，我们将了解优化技术和损失函数，这些将用于实现最佳近似函数。进一步，我们将讨论如何使用激活函数向网络中添加非线性。\n\
    \n"
