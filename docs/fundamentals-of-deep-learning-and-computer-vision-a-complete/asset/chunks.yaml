    # 双向 RNN (Bidirectional RNNs)


    好了，我们已经讨论了普通 RNN 的常见架构。现在我们将讨论另一种流行的 RNN 变体——双向 RNN（Bi-directional RNN）。在深入研究其架构和实现之前，让我们了解双向
    RNN 在文本摘要或词性标注等实际问题中的重要性。


    人类大脑在摘要之前会阅读整个文本语料库。阅读整个语料库有助于人类推导出潜在意图，并最终帮助获得更好的摘要结果。


    通常，普通的 RNN 模型没有为机器提供这种功能。在普通 RNN 中，机器是从头到尾顺序地（逐词）学习的。但就像人类大脑一样，如果机器也能知道未来的词（从后往前学习），对它来说将更有利。双向
    RNN 帮助机器实现这一特性。


    考虑这两个单词序列：“He said, Teddy bears are on sale”（他说，泰迪熊正在特卖）和“He said, Teddy Roosevelt
    was a great president”（他说，泰迪·罗斯福特是一位伟大的总统）。假设我们的任务是为每个句子中的名称进行标记。我们可以快速识别出第二个序列中的“Teddy”是一个人名，但在第一个序列中不是，因为我们可以阅读完整的句子并从句子的后部分理解上下文。但是，单向
    RNN 没有为机器提供这种能力。双向 RNN 帮助机器从末尾理解上下文。图 5.5 展示了双向 RNN 模型的架构概述。


    ![](img/image-u577ctuz.jpg)

    图 5.5: 双向 RNN


    双向 RNN 非常流行，特别是在语言翻译和语言建模中。双向 RNN 从两个方向捕捉信息，因此输出依赖于 `t-1` 刻和 `t+1` 刻的输入。正如图像所示，基础的（简单的）双向网络可以表示为：


    ![](img/image-z7rfsw.jpg)

    双向网络可以表示为：


    ![](img/image-4iv.jpg)


    # RNN 的动机 (Motivation for RNN)


    我们之前简要讨论了 RNN 的用处。在本节中，我们将看到 RNN 的更多应用。RNN 在许多领域取得了巨大成功。在需要序列表示的领域，对 RNN 的兴趣日益增长。在本章中，我们将讨论计算机视觉中的
    RNN。在后续的章节中，我们将讨论 RNN 在自然语言处理中的应用。在本章结束时，我们将讨论 RNN 在视频分析中的应用。


    # 语言建模 (Language modeling)


    给定一个单词序列，我们想要根据之前的词预测每个词的概率。人类大脑可以快速做出反应并说天空的颜色是 ___，因为它知道背景。机器没有这种背景。在这些问题中，RNN
    使用上下文来找到合适的词。语言模型通过观察数据集中的句子生成语法和句法正确的句子。每个句子由 `m` 个单词组成，天空是蓝色的句子的概率将……等。在数学上，它是：


    ![](img/image-foczdfc.jpg)

    图 5.6 展示了上述示例的基于 RNN 的语言模型简单架构。

    ![](img/image-a1fl529.jpg)

