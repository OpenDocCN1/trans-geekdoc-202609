    # Introduction to ANN


    Let’s observe the following picture and attempt to recognize what it is about
    before we proceed further:


    ![](image-pa00lh7g.jpg)

    Figure 2.1: Example image


    From Figure we should have the capacity to tell it is a giraffe even though it
    is abnormally fat to look at. Our brains can recognize such features and objects
    swiftly in spite of them being presented in a form other than what we have seen
    before in our life.


    ## How do we do that?


    Whenever we touch any object, we can feel it. It’s possible because of the sensors
    that are connected to our brain. All human body sensors work as data collectors
    that collect data and pass them on to our brain for further processing. Based
    on this information, the brain takes final decision and sends the relevant instruction
    or information to the appropriate body part.


    Neural networks are inspired from the human brain and its inner workings. Before
    we delve deeper, we will look at how the human brain works and its parallels within
    the artificial neural networks. It is very difficult to intricately understand
    how the brain works, but we can get a quick general overview. The human brain
    is composed of approximately 100 billion nerve cells called neurons. Each neuron
    can relate to thousands of other neurons that are found in a large network. A
    neuron communicates with other neurons in the form of electrochemical signals.
    Every feeling, thought, and emotion that we have is due to millions of small nerve
    cells called neurons. Without these neurons working and carrying messages throughout
    our body, we wouldn’t be able to feel or do anything – kind of like a normal day
    in math class.


    Now that we have an idea of how the brain works, we will discuss an artificial
    neural network.


    ## Artificial Neural Network


    A typical neural network consists of many artificial neurons called units that
    are arranged in a series of layers. A typical artificial neural network consists
    of different layers, as shown in Figure:


    ![](image-njw5de4f.jpg)

    Figure 2.2: Example of artificial neural network


    - **Input layer**: The input layer contains those units (artificial neurons) that
    receive input from the outside world on which network will learn, recognize, or
    otherwise process.

    - **Output layer**: The output layer contains units that respond to the information
    about how it has learned any task.

    - **Hidden layer**: The hidden layers are units that are in between the input
    and output layers. The job of the hidden layer is to transform the input into
    something that the output unit can use in some way.


    We can create different types of neural networks by connecting nodes in a different
    manner and changing data flow direction. Each type of neural network has a varied
    complexity level and use cases for application. In this book, we will look at
    feedforward neural networks and its variants.

    '
