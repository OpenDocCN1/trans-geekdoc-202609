    ## Pooling layer


    Now, let’s understand the pooling layer. Pooling layer is somewhat similar to
    dropout layer in feedforward networks that was discussed in the last chapter.
    It helps to reduce the co-adaption between pixels and hence it reduces variance.
    In pooling layer, certain elements of the output are replaced with new elements
    based on the statistics of local output. Hence, it helps to down sample the data
    that eventually increases statistical efficiency and reduces memory requirements.


    Right now, images are being used as examples, so we will use term pixels instead
    of elements and also because they are more familiar. For example, in average pooling,
    local pixels get replaced by average of those local pixels. Similarly, in max
    pooling, maximum value of pixel among local pixels replaces the remaining local
    pixels. There are other different types of pooling, such as weighted average pooling,
    norm pooling, or stochastic pooling, etc. Figure 3.46 represents two most commonly
    used variants, max pooling and average pooling. The left matrix in Figure 3.46
    represents input image, the upper right matrix represents the output by applying
    `max pool` function, and the lower right matrix represents output of `average
    pooling` function. In this example, we can think that we are using filter of size
    `2 x 2` and `stride = 2`. These are the hyperparameters in pooling layers. Hyperparameters
    in the pooling layer remain fixed, meaning these parameters do not change during
    backpropagation, unlike weights and biases in convolutional layer which change
    during backpropagation.


    ![](image-k077fj1e.jpg)

    Figure 3.46: Output after pooling function


    The main function of pooling is to add invariance to small translation of the
    input which, essentially, means that a pooling function prevents the change in
    value of the output due to small translational perturbation in the input. We can
    understand the above statement using Figure ![](image-uzz8uued.jpg)

    Figure 3.47: Representation of pooling function


    In Figure diagrams a and b depict pooling function. In this Figure, `stride` of
    `1` and filter of size `1 x 3` has been used. In diagram the bottom circles represent
    outputs before pooling layer and the top row represents output of `max pool` function
    on the bottom row. Now, in diagram all the pixels shift by `1` unit; we can think
    of this as small translational perturbation. Due to a shift in pixel by `1` unit,
    every value in the bottom circles has changed, whereas only half of the values
    of upper circles have changed. This is because the `max pool` layer is sensitive
    to maximum value of pixels in receptive field and not the pixel position. We can
    also think of pooling function as feature detectors. Suppose, we need to find
    a cat’s eye in an image; `max pool` layer ensures that if there is a cat’s eye
    in the image, it will detect it irrespective of its location but sometimes we
    need to preserve locations, and in that case pooling function will be inappropriate.
    For 3D inputs, we apply pooling function at each layer and then stack those layers.


    ## Architecture of CNN


    We have discussed typical layers used in CNN. Let’s understand CNN architecture
    with an example shown in Figure. In this Figure, RGB image of size `32 x 32 x
    3` has been used. In the first convolutional layer, `6` filters of size `5 x 5
    x 3` with `stride 1` and no padding have been used and then `ReLU` function is
    used to induce nonlinearity. It produced an output of size `28 x 28 x 6`; depth
    of the output is `6` because `6` filters of size `5 x 5 x 3` have been used. The
    next layer is a pooling layer in which a filter of size `2 x 2` with `stride 2`
    is used for each output or we can assume that a filter of size `2 x 2 x 6` with
    `stride 2` is used; both assumptions will result in the same output. Pooling layer
    downsampled the size by a factor of `2` and hence the output size is `14 x 14
    x 6`. Again, the next layer is convolutional layer in which `16` filters of size
    `5 x 5 x 6` with `ReLU`, nonlinearity, `stride 1`, and no padding have been used,
    which resulted in an output of size `10 x 10 x 16`. After this, a pooling layer
    is implemented with filter size of `2` and `stride 2`, which resulted in an output
    of size `5 x 5 x 16`. Now, in the next layer, output from the second pooling layer
    is flattened into a `400 x 1` vector, i.e. 3D output is converted into a column
    vector. The next 2 layers are fully connected layers `FC1` and `FC2` with `120`
    and `84` units respectively, and finally, `softmax` layer which classifies the
    input image. All the units from flattened vector are densely connected to units
    of `FC1`; similarly, all the units of `FC1` is connected to every unit of `FC2`.
    We can think of flattened vector as input to `MLP` and next layers as hidden layers
    of `MLP`.


    ### Why do we add a fully connected layer?


    We can think like this—`CNN` helps extract certain features from the image while
    the fully connected layer is (better) able to generalize from these features into
    the output-space. Fully connected layer helps to establish nonlinear relationship
    between features from `CNN`. We also see that as the number of layers increases,
    the size (height and width) of the image decreases but the number of channels
    (depth of image) increases.


    ![](image-5pxmpmv.jpg)

    Figure 3.48: A simple architecture of a CNN


    ## Conclusion


    In this chapter, we explored `CNNs` and the essential building blocks of a `CNN`
    architecture. Firstly, we have discussed the limitation of feedforward networks
    such as its computationally extensive process, inability to exploit spatial relations
    among pixels, etc., and how `CNNs` help to overcome those problems. We have looked
    at the important operations in `CNNs`, such as application of convolutional operation
    with kernel, selection of kernel size, concepts of `stride` and `padding`, `max
    pool`, and more. Moving forward, we discussed how to perform convolution operation
    at each layer. Towards the end, we learned to build a small `CNN` model. Once
    we are able to get small models working properly, we can build larger and deeper
    ones, following the same principles. In the next chapter, we will discuss various
    advanced and complex `CNN` architectures, such as `Alexnet`, `VGG`, `Resnet`,
    and more.


    # CHAPTER 4 CNN Architectures


    In the previous chapter, we learned about convolutional neural networks and different
    concepts related to them. Most of the computer vision applications revolve around
    `CNN` architectures. In this chapter, we will take our discussion from the last
    chapter further and understand different `CNN` architectures used in academia
    and industry for various computer vision applications in healthcare, agriculture,
    automobiles, etc.


    ### Structure

    - AlexNet

    - GoogleNet/Inception

    - VGG16 (OxfordNet)

    - ResNet

    - Fast R-CNN

    - Faster R-CNN

    - SSD

    - YOLO


    ### Objective


    We will discuss some of the popular networks — `AlexNet`, `VGG`, `Inception`,
    `ResNet`, and different object detection algorithms such as `R-CNN`, `Fast R-CNN`,
    `Faster R-CNN`, `Single Shot Detector (SSD)`, and `You Only Look Once (YOLO)`.
    We’ll try to understand their design and why they work so well. Further, in due
    course, we will look at the application of different concepts learned in the previous
    chapters (activation functions, pooling layers, `stride`, `padding`, dropout regularization,
    `batch normalization`, etc.). Several computer vision applications, such as image
    classification, object detection, and face recognition use one of these concepts
    as the base architecture. The following figure shows `ILSVRC` winners:


    ![](image-f89lg5m5.jpg)

    Figure 4.1: ImageNet Large Scale Visual Recognition Challenge (ILSVRC) winners.
    (Copyright Kaiming He 2016)

