    Example of artificial neural network     Input layer: The input layer contains
    those units (artificial neurons) that receive input from the outside world on
    which network will learn, recognize, or otherwise process.    Output layer: The
    output layer contains units that respond to the information about how it has learned
    any task.    Hidden layer: The hidden layers are units that are in between the
    input and output layers. The job of the hidden layer is to transform the input
    into something that the output unit can use in some way.    We can create different
    types of neural networks by connecting nodes in a different manner and changing
    data flow direction. Each type of neural network has a varied complexity level
    and use cases for application. In this book, we will look at feedforward neural
    networks and its variants.  '
