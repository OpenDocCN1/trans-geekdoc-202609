- raw: "  Video classification    In today’s digital content video, in particular,\
    \ has become a new way of communication between Internet users. Due to the pervasiveness\
    \ of Internet, video data has been generated, published, and spread explosively.\
    \ This has encouraged the development of advanced techniques for a broad range\
    \ of video understanding applications including online advertising, video retrieval,\
    \ video surveillance, etc. The sheer volume of video data has motivated approaches\
    \ to automatically categorizing video content according to classes such as human\
    \ activities and complex events.    We know that a video is a sequence of images.\
    \ CNN algorithms are widely used in problems related to image and video processing.\
    \ While discussing CNNs, we learned how CNN extracts latent features from images\
    \ and how it can be useful. RNNs allow us to understand the context of a video\
    \ frame, relative to the frames that came in sequence. Combination CNN \\- RNN\
    \ architecture has shown good results in video classification problems. The video\
    \ classification framework is a broad class of video analytics problem, which\
    \ includes motion tracking, action recognition, and video type detection.    Video\
    \ classification explores the application of LSTM beyond the prediction of short\
    \ snippets related to video or video captioning. It explores the application of\
    \ stacked CNN and LSTM for video classification. Given a set of videos V \\= …\
    \ vn and label Yv \\= … the video classification problem tries to implement the\
    \ CNN-LSTM stacked network to learn what type of frames distinguish one class\
    \ from another. Here the LSTM, unlike the captioning problem, doesn’t learn the\
    \ distribution over words; instead, it tries to learn the context of the video\
    \ frame by frame. Alternatively, this is a problem of video understanding; as\
    \ the previous CNN layer helps in image processing and feature generation.   \
    \ Figure 5.28 depicts a two stream CNN-LSTM network for video classification.\
    \ Specifically, the spatial and the short-term motion features are extracted separately\
    \ by two Convolutional Neural Networks. The two streams have different functionality.\
    \ One stream has the raw image as input. It captures the spatial features which\
    \ is essential for object detection or recognizing the action in the video frames.\
    \ Action detection is a difficult problem than object detection because, in action\
    \ recognition, a lot of frames need to be summarized to form the action. This\
    \ is where the second stream helps. The second stream has motion feature detection\
    \ using Shift-CNN framework. The input are the shift features in the frame, and\
    \ the CNN further tracks the object through the shift vector. Finally, LSTM networks\
    \ are applied on top of the two features to further model longer-term temporal\
    \ clues.    ![](image-cgjbimgt.jpg)  Figure 5.28: Video classification    Figure\
    \ 5.28 depicts that for an input video, two types of features are extracted using\
    \ the CNN from spatial frames and stacked motion optical flows respectively. The\
    \ features are separately fed into two sets of LSTM networks for long term temporal\
    \ modeling (Left and Right). In addition, we also employ a regularized feature\
    \ fusion network to perform video-level feature fusion and classification (Middle).\
    \ The outputs of the sequence-based LSTM and the video-level feature fusion network\
    \ are combined to generate the final prediction.  \n\n  Conclusion    In this\
    \ chapter, we have explored the sequential models (RNNs/LSTMs). We have discussed\
    \ why we need RNNs, its advantages over other algorithms, such as feedforward\
    \ networks, and CNNs and its application. We have also looked into better versions\
    \ of RNNs, such as GRU and LSTMs. In the end, we have also discussed how a combined\
    \ architecture of CNN and RNN can be useful in problems related to images and\
    \ videos. RNNs have been an active research area, it has shown remarkable results\
    \ lately (most of all are using LSTMs).  \n\nBibiliography     https://www.tensorflow.org/\
    \    http://www.academia.edu/Documents/in/Tensorflow    https://www.researchgate.net/publication/308895905\\\
    _A\\_Tour\\_of\\_TensorFlow    Martin Abadi et al., 2015, TensorFlow: Large-Scale\
    \ Machine Learning on Heterogeneous Distributed Systems    Nishant Shukla et al.,\
    \ 2018, Machine Learning with TensorFlow    Ian Goodfellow et al., 2016, Deep\
    \ Learning    https://mattmazur.com/2015/03/17/a-step-by-step-backpropagation-example/\
    \    Coryn A.L. Bailer-Jones et al., 2001, An introduction to artificial neural\
    \ networks    Michael Nielsen, Neural Networks and Deep Learning    Raul Rojas,\
    \ Neural Networks \\- A Systematic Introduction    James Elder, York University,\
    \ NonLinear Classification And Regression    Andrew Beam, Deep Learning: History\
    \ and Background    Paras Dahal, Classification and Loss Evaluation \\- Softmax\
    \ and Cross Entropy Loss    http://home.agh.edu.pl/~vlsi/AI/xor\\_t/en/main.htm\
    \    NptelHrd, Solution of Non-Linearly Separable Problems Using MLP    https://i.pinimg.com/originals/48/f6/b1/48f6b1c26ef383a6ee1a68ec01644ebf.jpg\
    \    https://d279iyy6fmg6l4.cloudfront.net/blog/Artificial-Neural-Network-Architecture.jpg\
    \    Asawari P. Jirapure, Wood Defect Identification Using Generalized Feed Forward\
    \ Neural Network       Rafael C. Gonzalez et al., Digital Image Processing   \
    \ https://ttic.uchicago.edu/~shubhendu/Slides/NeuralNets2.pdf    Vincent Dumoulin\
    \ et al., 2018, A guide to convolution arithmetic for deep learning    Christopher\
    \ Tensmeyer et al., 2017, Improving Invariance And Equivariance Properties of\
