    # Conclusion


    In this chapter, we discussed that linear models are useful against linearly separable
    data, but they fail against a data set with nonlinear interactions due to the
    inherent linearity, which means they can only identify linear decision boundary.
    In the real world, we generally encounter problems that cannot be solved using
    the linear decision boundary. Then, we discussed a nonlinear network called feedforward
    neural network. We saw how a nonlinear network solves the nonlinear data. Moving
    forward, we also talked about the various building blocks of the feedforward neural
    networks, such as cost functions (penalizing the wrong output), gradient descent
    (learning steps), activation functions (adding nonlinearity), and more. Next,
    we discussed how to avoid biases or variance in a network or how to make a generalized
    network. Finally, we concluded with a couple of examples—one showing the effects
    of complexity in a network, and the other on MNIST fashion clothes classification.
    A feedforward network is helpful to solve simple problems, but it does not show
    good results for complex tasks such as language translation, time series forecasting,
    object detection, and more. In the next chapter, we will discuss the extension
    of feedforward network, called Convolutional Neural Network (CNN), and we will
    see how CNNs help to overcome the limitation of feedforward networks.


    # CHAPTER 3 Convolutional Neural Networks


    In the last chapter, we discussed feedforward neural networks, which are capable
    of learning higher dimensional, nonlinear, and complex functions for nonlinear
    mapping between input and output vectors. In this chapter, we will discuss a more
    advanced and complex class of neural networks called convolutional neural network
    (CNN). We will start with a discussion on the limitations of feedforward neural
    networks. Next, we will discuss the definition and applications of CNNs and how
    we can leverage CNNs to overcome the limitations of feedforward neural networks.
    Moving forward, we will discuss elementary operations and techniques required
    to build a CNN, such as convolution operation, pooling function, and more. Finally,
    we will conclude with the end-to-end architecture of CNN.


    ## Structure

    - Convolution operation

    - Activation layer

    - Pooling layer

    - Dropout


    ## Objectives


    The goal of this chapter is to explain the applications of CNNs in processing
    topological data like images and to understand various state-of-the-art CNN architectures.


    ## Introduction to CNN


    Let’s start with the efficiency of the feedforward neural network. Generally,
    we come across data, like images and words having variables in the order of hundreds
    or thousands. To understand this, let’s consider a comparatively smaller neural
    network with 100 input units. Now, a fully connected first layer will have 10,000
    weights and if we increase the number of layers to 3 or 4, this increases up to
    30,000 to 40,000 weights. Even if we apply the general dropout criteria (discussed
    in the last chapter), it will not reduce the number of weights. Moreover, if we
    keep on dropping more hidden units, it will result in underfitting. That’s the
    case for a small neural network. Suppose, if we use a neural network with 1000
    input units, the number of weights will be in millions. These many variables require
    large memory and eventually rule out the hardware implementation. Due to the conditions
    mentioned earlier, the implementation of feedforward neural network becomes computationally
    expensive. In addition to that, if we have limited training data, we may face
    the overfitting problem.


    Apart from the computational limitations discussed above, there are also feature
    level limitations with feedforward network. We know that feedforward network is
    an unstructured network and does not share parameters and hence it is not robust
    to local distortions. During preprocessing, we normalize the data and feed into
    a network but there are chances of the image getting distorted translationally
    or rotationally during preprocessing, and since each unit uses different weights,
    the output of units get distorted. Secondly, in CNN, parameters get shared among
    inputs and hence the number of variables is reduced, and it becomes a much more
    efficient technique. Another limitation of neural network is, it does not use
    the topology of input data. We can see that we can feed input in any order and
    it will not change the output. But we know that images are spatially related,
    similar to time series that are temporally related. CNN exploits the correlation
    among local features. We will discuss later in detail, how CNN helps to overcome
    the limitations of feedforward neural networks.


    CNN is widely practiced for data possessing grid-like topology. An example includes
    1D data, like time series data that can be analyzed as a 1D grid sampled at regular
    time intervals, and multidimensional images, which can be visualized as 2D grid
    of pixels stacked in layers. CNN has shown remarkable performance in solving practical
    problems. As the name suggests, CNN uses a mathematical operation called convolution
    without flipping the kernel. Mathematically, convolution is defined as a specialized
    kind of linear operation. If we analyze CNN, we can see that CNN is similar to
    neural networks that use convolution operation (cross-correlation) between weights
    and inputs in place of matrix multiplication in at least one of their layers.
    Now, we will discuss what convolution is. Next, we will discuss figuratively,
    why researchers shifted their focus from fully connected network to convolutional
    neural networks. As mentioned earlier, convolution operation used in CNN is not
    precisely the same as the one used in fields like engineering or mathematics.
    We will discuss several variants of the convolution operation that are widely
    practiced in neural networks. We will also see how we can use convolution function
    on various kinds of data with multiple dimensions.

    '
