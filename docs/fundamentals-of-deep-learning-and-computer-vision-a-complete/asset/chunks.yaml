- raw: '  Convolution operation    In general, convolution is an operation on two
    functions to produce the third function that is typically assumed as a modified
    version of one of the original functions. Let’s try to understand convolution
    with an example. Suppose, we are tracking the position of an object with radar
    sensor and our sensor provides the position of the object as an output, where
    is a function of time. Both variables x and t are real values; so, we may get
    a different reading from the sensor at any time instant. Let’s assume that the
    sensor produces noisy output. Due to noise in the output, we will get distorted
    results. To reduce the distortion, we will compute the mean of several measurements
    but we may not get an accurate result because we are giving equal weights to the
    variance of each measurement. To reduce the error, we use weighted average in
    which we give more weight to the recent terms. We can also think of it as a system
    in which data points are of varying quality, so the variance of random error will
    not be constant for all data and hence to reduce error, we can provide weights
    inversely proportional to the variance of data. To implement this technique, we
    can use a weight function say, w(a) where a denotes the time period. We can assume
    w as a probability function to get a weighted average otherwise output will not
    be a weighted average. Using this technique, we get a new smooth function which
    estimates the position of the object more accurately. Mathematically, we can write
    this as:    ![](image-tijyighu.jpg)  The operation mentioned above is known as
    the convolution operation. In literature, convolution operation is generally represented
    using an asterisk, \* as \= \*    Let’s take another example to understand convolution
    operation. In this example, we will see more of a practical convolution problem,
    i.e. discrete convolution. The above example can be used to understand discrete
    convolution but we will see another example. Let’s say a tuition teacher decides
    to take private teaching classes on a course. On the first day, a beginner receives
    a 1-hour lecture to explore and understand a course. From the next day onwards,
    the duration of lecture changes from 1 hour to 3 hours for the same student. Now,
    if we plot this relation between days and number of hours, we will get the graph
    as shown in Figure    No. of hours vs Days    ![](image-kcjzctgw.jpg)  Figure
    3.1: Number of hours is changing with each day for one student.    Suppose, on
    the first day 2 students join the private tuition. On the second day, 4 new students,
    and on the third day, it reaches 6\.    No. of new students vs Days    ![](image-2l4ba3pf.jpg) 
    Figure 3.2: Number of new students joined at each day    Figure 3.2 shows the
    number of new students joined each day. Okay, let’s calculate the number of teaching
    hours on each day. On the first day, there are 2 students so the total number
    of hours will be 2 \* 1 \= 2\. If we use to denote the total number of hours where
    d represents the day, then \= 2\. The first day is represented using number 0
    for mathematical convenience. Now, on the second day, there are already 2 students
    from the first day and each student will get 3 hours each and 4 new students who
    joined on the same day will get 1 hour each. Hence, \= 2 \* 3 \+ 4 \* 1 \= 10\.
    Now on the third day, 6 new students joined the classes and there are already
    6 students from previous days so we can write \= 2 \* 3 \+ 4 \* 3 \+ 6 \* 1 \=
    24\.    This computation of T is known as convolution. Let’s visualize this computation
    through a graph. First, we will flip the graph shown in Figure 3.2 and then we
    will multiply each value of graph on each day.    On flipping Figure we will get
    the graph as shown in Figure    ![](image-qn4llr3c.jpg)  Figure 3.3: (flipped
    representation) Number of new students joined at each day    Now, let’s line up
    Figure 3.1 and Figure We will get a new graph as shown in Figure    ![](image-zib5onxd.jpg) 
    Figure 3.4: No. of teaching hours on 1st day    Okay, the above Figure depicts
    the situation of the first day, i.e. Assume, the value left to 1 in the upper
    graph is zero. Now, if we multiply the value shown in the graph, we will get \=
    2 \* 1 \+ 4 \* 0 \+ 6 \* 0 \= 2\. This is what we got earlier. Similarly, to visualize
    the second day’s situation, the lower graph should be shifted by 1 time instant,
    as shown below in Figure    ![](image-brxagerb.jpg)  Figure 3.5: No. of teaching
    hours on 2nd day    As we did earlier, if we multiply the corresponding values
    of the graphs shown in Figure 3.5 we will get \= 2 \* 3 \+ 4 \* 1 \+ 6 \* 0 \=
    10\. Similarly, we can see the results for    Now, let’s generalize the result.
    We can represent the graph shown in Figure 3.1 using function where d is the day
    number, and represents the number of teaching hours on day Hence, \= 1, \= \=
    ….. \= 3\. Similarly, we can use function to represent the number of students
    on a specific day (shown in Figure as system response, where \= 2, \= 4 and \=
    6\. Recall that the first step done as part of convolution was to flip the graph.
    So, the graph shown in Figure 3 can be represented by function Note that our idea
    was to shift the graph right by t time instant so, the function – can be used
    to represent that operation. Now, we can write a general formula for convolution
    as:    ![](image-a1qhq51c.jpg)  Okay, let’s again calculate We can write \= \*
    \= 1 \* 2 \= 2:    ![](image-99s6is35.jpg)  In convolution network, the position
    of object x or day number N are defined as an input and w or h are referred as
    kernel. We will get to know more about this terminology while discussing kernels.   
    In the above section, we have discussed convolution for 1 dimension but in practical
    problems, we often use convolution for multiple dimensions. Let’s understand the
    convolution operation in the case of a gray scale image where I represents image
    and K represents kernel. Here, and represent height (rows) and width (columns)
    of an image (matrix). Since an image is two dimensional (grayscale), the size
    of the kernel will also be two dimensional to match the dimension of the input.
    We can write convolutional output as:    ![](image-d7aq5b8c.jpg)  Convolution
    follows commutative property, meaning if we are convolving 2 functions, s and
