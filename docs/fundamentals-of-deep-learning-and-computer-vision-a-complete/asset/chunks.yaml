  trans: "\n\n# 反向传播\n\n到目前为止，我们讨论了如何更新简单神经网络的参数，但还没有讨论如何在复杂网络中计算损失函数的梯度。换句话说，我们还没有妥善地讨论如何计算损失函数相对于网络中每个参数的梯度。因此，在本节中，我们将讨论每个参数如何影响损失函数，以及如何在神经网络中将误差反向传播以更新模型参数。\n\
    \n在前馈神经网络中，我们取一个输入 `x`，然后来自 `x` 的信息流过隐藏层产生输出。由于来自 `x` 的信息仅向前流动，这就是为什么过程被称为正向传播。现在，一旦得到了输出，我们就定义一个\
    \ `J` 损失函数，它代表真实输出 `y` 与预测输出之间的误差。使用反向传播算法，我们将损失函数中的信息（本质上是梯度）传回网络。我们可以将其视为一个利用反馈机制来增强性能的过程。在反向传播中，我们再次向网络输入信息，但这次是反向的。换句话说，我们按反向传播信息，这就是这种技术被称为“反向传播”的原因。注意，即使在广义线性模型的情况下，我们也执行了反向传播。因此，通常来说，我们可以说反向传播用于计算任何函数的梯度。\n\
    \n接下来，我们将利用链式法则对反向传播建立直观的理解，链式法则将被递归地计算函数的梯度。\n\n## 简单示例与链式法则\n\n我们将从一个简单的示例开始。假设一个函数为\
    \ `y = f(x)`。为了简单起见，我们将该方程表示为简单的方程：`y = a * w`，其中 `w + x` 由 `a` 表示。现在，让我们应用链式法则来寻找\
    \ `y` 与输入之间的关系。首先，我们将计算函数 `a = w + x` 对 `w` 和 `x` 的偏导数，然后 `w` 对 `a` 的导数。\n\n![](img/image-5zmq96su.jpg)\
    \ \n\n我们感兴趣的是计算 `y` 对 `x` 和 `w` 的偏导数。现在，让我们找到 `y` 对每个输入的梯度。\n\n![](img/image-y58ein0t.jpg)\
    \ \n\n现在，我们将使用数值来理解偏导数的结果。假设我们选择 `w = -3`，`x = -1` 且 `y = 3`。现在，我们将看到每个输入值如何影响函数。\n\
    \n我们可以看到 `y` 对 `a` 的梯度带有正号。这意味着如果我们增加 `a`，`y` 就会增加；或者如果我们减少 `a`，`y` 就会减少。换句话说，为了增加或减少\
    \ `y`，我们必须相应地增加或减少 `a`，幅度为 3。继续上面的表达式，我们可以写下 `dy/da = w`。这意味着我们可以给出类似的参数来建立 `y`\
    \ 与 `w` 之间的关系。现在，由于 `w` 和 `x` 保持线性关系（由于加法性质），两个变量的行为将相似。因此，我们可以说 `w` 与 `y` 之间的关系类似于\
    \ `dy/dx`。现在，对于 `dy/dw`，正如我们看到的 `y` 对 `w` 的梯度带有负号，这意味着 `y` 将与 `w` 呈反比关系，幅度为 4。\n\
    \n## 数值反向传播\n\n现在我们已经讨论了链式法则，让我们通过具体的数字来理解反向传播是如何工作的。查看下面的图片：\n\n![](img/image-z5o02mvy.jpg)\n\
    \n### 图 2.1\n\n图 2.1 代表了我们的神经网络。为了简单起见，我们将通过一个具有 2 个输入、2 个输出和 1 隐藏层的模型来理解反向传播。我们可以将相同的概念扩展到更大更复杂的网络。\n\
    \n让我们初始化权重和偏置以及输入输出值：\n- **权重 (Weights)**：`w1 = 0.15`, `w2 = 0.20`, `w3 = 0.25`,\
    \ `w4 = 0.30`, `w5 = 0.40`, `w6 = 0.45`, `w7 = 0.50`, `w8 = 0.55`\n- **偏置 (Biases)**：`b1\
    \ = 0.35`, `b2 = 0.60`, `b3 = 0.05`, `b4 = 0.10`, `b5 = 0.01`, `b6 = 0.99`\n-\
    \ **学习率 (Learning rate)**：`α = 0.5`，在这个例子中，`α` 的值很高。通常我们选择较低的 `α`，如 0.01。\n\n\
    我们将使用单个示例并尝试预测正确的输出。首先，我们将看到正向传播是如何工作的![](img/image-gd5v0w8t)。接下来，我们将使用激活函数获取输出。在这个例子中，`sigmoid`\
    \ 函数将作为激活函数![](img/image-o3r53ome)。同样，我们得到 `out = 0.59688478`。现在，我们将关注输出![](img/image-owyqc489)。同样对于\
    \ `out = 0.77298465`，我们将使用最小二乘函数计算预测输出与真实输出之间的误差，其定义为![](img/image-c8ddo208)。计算每个输出单元的误差如下![](img/image-w0c3jq8n)。同样，我们得到\
    \ `0.02356026`。现在，总误差 `E = 0.29837109`。\n\n到目前为止，我们在正向传播中计算了总误差。我们的目标是预测真实的输出。为了实现这一点，我们需要最小化误差。现在，我们将使用反向传播技术将误差反向传播到网络中，观察权重和偏置值如何更新，以便在下次迭代中预测输出更接近真实输出。\n\
    \n让我们理解每个参数如何影响输出![](img/image-gldnyvrn)。我们已经定义了，并且如果![](img/image-557uxa4p)(image-fio9b5vh)，我们也定义了\
    \ `dE/dw = dE/dout * dout/dz * dz/dw`。使用链式法则，我们可以看到总误差如何依赖于 `w` ![](img/image-kjugoduq)。我们计算了每个乘项；将所有值放在一起得到![](img/image-odgbnv27)。到目前为止，我们建立了\
    \ `w` 与 `E` 之间的关系并计算了该值。现在，让我们更新权重 `w1` 的值![](img/image-4z1kunyd)。同样，我们可以更新 `w2`\
    \ 和 `w3` 的值并得到接近以下数字的更新值：`w1 = 0.408666186`, `w2 = 0.51130127`, `w3 = 0.56137021`。\n\
    \n取决于值的近似精度，我们可以看到权重和偏置值的变化。注意，在更新隐藏层的参数值时，我们将使用输出层参数的原始值。通常，在反向传播期间，我们使用层 `l`\
    \ 参数的原始值来更新层 `l-1` 的参数。每次迭代后，所有参数都会更新并成为下次迭代的原始值。\n\n现在，我们将看到隐藏层的参数如何影响输出。在隐藏层，我们有权重\
    \ `w` 和 `b`。为了建立隐藏单元与损失函数之间的依赖关系，我们将使用类似的方法，但稍微复杂，因为可以看到隐藏单元与两个输出单元连接，这将影响两个输出值。让我们理解\
    \ `w` 如何影响 `E` ![](img/image-rjy13y17)。我们将逐一考虑右边的两个项。首先，我们将处理 `dE/dout`。使用链式法则，我们可以写道![](img/image-pnbxk4z4)。同样，我们将得到\
    \ `dE/dout2` ![](img/image-uyyk940k)。现在，为了建立层 1 参数与 `E` 之间的关系，我们需要为每个权重计算 `dout/dz`\
    \ 然后是 `dz/dw` ![](img/image-1chz90nw)。所以，![](img/image-rlzp10wy)，我们也定义了 `dE/dw\
    \ = dE/dout1 * dout1/dz1 * dz1/dw1 + dE/dout2 * dout2/dz2 * dz2/dw1`。所以，![](img/image-9pswtknb)，因此![](img/image-norgvrh6)，现在，我们可以更新权重为![](img/image-x3dcs041)。同样，我们可以更新\
    \ `w4` 和 `w5` 的值并得到接近以下数字的更新值：`w4 = 0.19956143`, `w5 = 0.24975114`, `w6 = 0.29950299`。到目前为止，我们已经更新了\
    \ 1 个 epoch（定义为整个数据集通过网络正向和反向传播一次）。直到收敛，这个过程应该不断重复，因此我们将获得非常接近真实的预测输出。\n\n"
