  trans: '


    # RNN 在图像和视频分析中的应用


    自动生成图像描述（即图像字幕，`image captioning`）近年来在计算机视觉领域受到了广泛关注。`image captioning` 出许多原因变得非常重要。例如，它可以被用于基于内容的图像检索（CBIR），因此可以应用于许多领域，包括生物医学、商业、军事、教育、数字图书馆、网络搜索等。描述内容可以包括我们所在的位置（例如街道、游乐场）、我们穿的衣服，以及重要的是我们在那里正在做什么。为图像生成有意义的自然语言描述需要一种远超图像分类和目标检测的图像理解水平。从图像空间到语义空间的映射是关键挑战。在我们看来，映射图像与语言之间的空间可能与某些更深层次的进展产生共鸣。早些，这是一项困难的任务；虽然图像可以很容易地表示为实向量，但没有合适的方法可以在实向量中捕捉文本的语义和语法信息。但通过基于
    `LSTM` 的语言模型，文本现在可以被以简洁的特征表示出来，这种表示同时捕捉了语义和语法基础。从这些语言模型中，每个词都可以映射为数值向量表示。


    `CNNs` 已被广泛用于图像表示。使用 `CNNs` 的图像分类模型已得到广泛研究，并且发现此类架构中卷积层的中间输出是具有优越判别能力的图像特征表示，特别是与其所接触的监督信号有关。


    视频字幕生成或为视频生成文本摘要，归结底是为单个帧或同一时间上下文内的帧生成字幕的任务。由于视频帧无无等异于图像，因此图像字幕框架可以作为此类问题的起点。


    基本思想是从图像空间映射到文本空间。因此，给定一个图像，使用 `CNN` 提取特征向量，并将其传递给 `RNN`。每个 `I` 都与一个词序列（即字幕）`X
    = ….,` 相关，其中 `T` 是字幕序列的长度。因此，字幕生成的基本问题是找到给定条件下词序列的概率。


    ![](img/image-7mm9yvwj.jpg)


    所有词都嵌入在一个大小为的固定大小嵌入矩阵中。此词嵌入矩阵由 `RNN` 学习。概率 `|` 由 `w`给出，其中 `a`（隐藏状态）可以定义为：


    ![](img/image-0xycutvi.jpg)


    其中 `S` 是一个非线性函数。


    ![](img/image-zs32frvy.jpg)

    图 5.24: 图像字幕架构


    如图所示，通常一个预训练的卷积神经网络（可能未预训练）从我们的输入图像中提取特征，然后将特征向量进行线性变换以匹配 `LSTM` 网络的输入维度。最后，组合后的网络被模拟为语言模型，以特征向量作为输入。


    ## 视频中的目标识别和字幕


    在计算机视觉领域，图像和视频的识别与描述是一项基础挑战。视频中的目标识别任务比图像中更复杂，因为不同的帧可能引用不同的物体，使得检测更具挑战性。理想情况下，视频模型应该允许处理变长度的输入序列，并能够提供变长度的输出，包括生成超越传统单句描述的全长度句子描述。能够扮演此角色的网络被称为长期卷积网络（`LRCNs`），这是一类用于视觉识别和描述的架构，结合了卷积层和长距离时间依赖。图
    5.25 显示了 `LRCNs` 的架构。


    ![](img/image-9j2lomcs.jpg)

    图 5.25: 递归卷积网络 (LRCNs)


    在图 5.25 中，`CNN`（左侧）从变长输入（左侧）提取特征，这些特征被馈入一叠 `LSTMs`（中间右侧），最终产生变长预测（右侧）。`CNN` 和
    `LSTM` 的权重在时间上共享，产生任意长度序列的表示。所有长度为 `T` 的帧输入卷积网络。因此，`ConvNet` 权重应用于整个时间。`LRCN`
    学习在每个时间步预测视频类别，并通过平均每个标签生成视频标签。


    ![](img/image-0jqowq7.jpg)

    图 5.26: LRCN 的三种变体


    ## 视频描述


    在视频描述中， `LSTM` 框架允许我们将视频建模为变长度输入流。由于可用视频描述数据集的限制，`LSTM` 输入是通过传统的活动生成的，即条件随机场（`CRF`）活动识别。图
    5.27 探索了使用 `LSTM` 和 `CRF` 框架的联合目标识别和字幕框架。对于每种架构，我们假设基于 `CRF` 的完整视频输入具有活动、工具、物体和位置的预测。通过这种方式，我们在每个时间步观察整个视频，而不是逐帧步进。


    ![](img/image-ux9h1w15.jpg)

    图 5.27: 视频描述


    从视频采样池中提取的帧以及物体的 `CRF` 分数都由 `LSTM` 编码。基本上，`CRF` 的最大后验（`MAP`）估计被用于提取视频特征。`LSTM`
    解码层然后尝试从中构建字幕。


    在图中 `LSTM` 被用作解码器和编码器，并使用 `CRF-max` 方法生成独热向量。


    在图中 `LSTM` 被用作解码器，并在每个时间步为 `LSTM` 提供完整的视觉输入表示，就就像图像字幕一样。


    在图中 `LSTM` 再次用作解码器，但使用概率作为 `LSTM` 的输入而不是独热向量，这有助于 `LSTM` 学习不确定性。


    更多细节请参考此论文：Long-term Recurrent Convolutional Networks for Visual Recognition and
    Description by Jeff Donahue et al.


    '
