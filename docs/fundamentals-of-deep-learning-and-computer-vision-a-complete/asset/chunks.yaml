    \nLet’s initialize the weights and biases and set input and output values:\n-\
    \ **Weights**: `w1 = 0.15`, `w2 = 0.20`, `w3 = 0.25`, `w4 = 0.30`, `w5 = 0.40`,\
    \ `w6 = 0.45`, `w7 = 0.50`, `w8 = 0.55`\n- **Biases**: `b1 = 0.35`, `b2 = 0.60`,\
    \ `b3 = 0.05`, `b4 = 0.10`, `b5 = 0.01`, `b6 = 0.99`\n- **Learning rate**: `α\
