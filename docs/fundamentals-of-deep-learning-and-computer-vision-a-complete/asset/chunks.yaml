    # 随机梯度下降


    正如我们所讨论的，批量梯度下降使用训练集中的每个样本点并累加梯度来在每一步中更新参数。当我们为大型数据集优化模型时，该算法收敛缓慢，而且计算开销巨大。为了解决这个问题，研究人员提出名为随机梯度下降的新算法，也称为
    `SGD`。


    在 `SGD` 中，我们计算第一个训练示例的梯度并尝试拟合样本，然后更新参数。接着，更新后的参数将作为第二个训练示例的初始参数，以此此类推。换句话说，在 `SGD`
    中，每当我们遇到训练示例，就会计算梯度并利用该训练示例产生的误差来更新模型的参数。与批量梯度下降相比，在 `SGD` 中我们不需要完整的训练数据集即可向最速下降方向迈出一小步。`SGD`
    的一个缺点是由于之字形运动，它可能无法收敛到全局最小值。但它会找到局部最小值，而局部最小值会接近全局最小值。


    ## SGD 的代价函数


