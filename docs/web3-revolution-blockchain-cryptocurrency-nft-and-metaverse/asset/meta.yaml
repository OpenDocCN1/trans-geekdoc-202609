- - '##'
  - 1998 - Szabo 设计了一种去中心化数字货币的机制，他称之为“比特黄金”（Bit Gold）。尽管比特黄金从未被实现，但它被称为“比特币架构的直接先驱”。
- - '##'
  - 2009 - 比特币由中本聪（Satoshi Nakamoto）正式诞生，这是开发比特币的个人或群体所使用的笔名。2009 年 1 月 12 日，美国工程师、加密活动家哈尔·芬尼（Hal
    Finney）收到了由中本聪发送的第一笔 10 BTC 交易（在本书编写时，其价值约 400,000 美元）。从这一刻起，区块链的概念与加密货币的概念共同演进，我们将在第四章中对其进行更详细的讨论。
