    \ Given the inherent volatility of the market, it is not unusual to see daily\
    \ drops of up to 30%. As mentioned above, this is actually the most unfavorable\
    \ sales situation. To prevent excessive losses, major exchanges provide tools\
    \ to stop losses when a certain minimum threshold value is exceeded. Similarly,\
    \ the same sentiment can be generated during a bull-run, in which one is led to\
    \ buy particularly attractive cryptocurrencies without knowing what one is buying.\
    \ In most cases, you risk seeing an exactly sudden drop in value, likely leading\
    \ to a negative balance with respect to the purchase\n\n·    **Set Stop Loss Limits**:\
    \ as just mentioned, placing Stop Loss in the market can be a solution for weak\
    \ hearts. In fact, it often happens that market fluctuations occur at night (we\
    \ have seen that the Crypto market never closes), thus risking to end up with\
    \ unexpected losses upon waking up. However, it is better to put them with caution:\
    \ always referring to high volatility, the value of a Token could suddenly fall\
    \ and then rise immediately afterwards. In the event of a stop loss, you risk\
    \ selling your coins for no real reason\n\n·    **Stay informed on events and\
    \ sentiment**: it is important to always stay updated on the world that revolves\
    \ around cryptocurrencies. There are many factors that can influence the market,\
    \ given its extremely volatile nature, to a greater extent than what happens on\
    \ the financial markets. Some examples? The statements on Twitter by Elon Musk\
    \ (for example on Dogecoin), the ban imposed by China which banned all transactions\
    \ in Cryptocurrencies and Mining, effectively decreeing the virtual currencies\
    \ and monetary policies of the various countries to deal with the crisis illegal\
    \ of the pandemic, first of all the United States, are all factors that have the\
    \ power to change the sentiment on the Crypto markets. In this case, it might\
    \ be useful to monitor the so-called Bitcoin Fear & Greed Index: translated into\
    \ Italian as an index of Bitcoin's fear and greed, it was developed to measure\
    \ two of the primary emotions that influence how much investors are willing to\
    \ pay for actions. The Fear and Greed Index is measured on a daily, weekly, monthly\
    \ and yearly basis."
