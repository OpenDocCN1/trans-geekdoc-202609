    \ founder Jack Dorsey, in its unique version certified through NFTs, was auctioned\
    \ for charity on Valuables in March 2021 and sold for nearly $ 3 million.\n\n\
    ![](images/00023.jpeg)\n\nFigure 23: The first tweet in history\n\n8.  **Genesis\
    \ Estate di Axie Infinity**: digital terrains are also in the ranking of the most\
    \ expensive NFT works to date. They are called \"Genesis Estate,\" sold for a\
    \ total of $ 1.5 million, and are found within the Axie Infinity game.\n\n9. \
    \ **Hairy**: the video of a blue and pink creature dancing to the tune of a song\
    \ sold for nearly $ 900,000. The video was produced by internationally acclaimed\
    \ artist Steve Aoki.\n\n![](images/00024.jpeg)\n\nFigure 24: Hairy\n\n10.         \
    \ **Nyan Cat**: at the bottom of the ranking of NFT works of art we find Nyan\
    \ Cat, a cute cat with the body of a sandwich followed by a trail of rainbow.\
    \ The creator, Chris Torres, sold his NFT for $ 561,000.\n\n![](images/00025.jpeg)\n\
    \nFigure 25: Nyan Cat\n\n# 8. The Metaverse\n\n**8.1 Introduction**\n\n**8.2 Second\
    \ Life: the first example of Metaverse**\n\n**8.3 Other examples of the Metaverse**\
    \ \n\n**8.4 A new UX**\n\n**8.5 Metaverse, Blockchain, Crypto and NFT** \n\n**8.6\
    \ Some current technological limitations **\n\n**8.7 Controversial aspects of\
    \ the Metaverse **\n\n**Chapter summary**\n\nThe metaverse probably represents\
    \ the last piece to give shape to the concept of web3 as it will be used in the\
    \ years to come. In this chapter we will illustrate the concepts and technologies\
    \ underlying the metaverse, such as virtual reality and augmented reality, as\
    \ well as the close link that exists with Blockchain technology and the use of\
    \ tokens, whether they are fungible or not.\n\n**Keywords**: metaverse, UX, augmented\
    \ reality, AR, virtual reality, VR\n\n## 8.1 Introduction\n\nOne of the first\
    \ questions I asked myself when the media recently reported the term \"metaverse\"\
    \ in reference to the new name of Mark Zuckerberg's Meta Platforms was: what does\
    \ it mean?\n\nThe term dates back to 1992, as reported by Wikipedia[***\\[110\\\
    ]***](#part0000_split_077.html#_ftn110):\n\n*\"Metaverse is a term coined by Neal\
    \ Stephenson in Snow Crash (1992), a cyberpunk science fiction book, described\
    \ as a sort of virtual reality shared via the internet, where one is represented\
    \ in three dimensions through one's avatar \\[...\\] Stephenson's is a futuristic\
    \ vision of the modern internet, frequented by the medium to high segments of\
    \ the population, where the difference between social classes is represented by\
    \ the resolution of their avatar (from the black and white ones of the public\
    \ terminals, to those with an excellent 3D rendering of the wealthy people), and\
    \ the possibility of accessing exclusive places\".*\n\nA simpler definition of\
    \ Metaverse could instead be the one reported by Albert Meige: *\"* *The future\
    \ version of the web, where the immersive 3D virtual universes of video games\
    \ meet social networks, collaborative spaces, marketplaces and eCommerce\"*[***\\\
    [111\\]***](#part0000_split_077.html#_ftn111)*.*\n\nIn a recent interview[\\[112\\\
    ]](#part0000_split_077.html#_ftn112) from Gary Vaynerchuk to Mark Zuckerberg on\
    \ Meta's future vision, Zuckerberg said:\n\n*\"The Metaverse for me today is the\
    \ next frontier of social connection in the same way that social networks were\
    \ when I started in 2004 \\[...\\] Most people think of us as a social media company,\
    \ but in ours DNA we are a technology company that builds different technologies\
    \ to help people connect and try to improve the connection between humans. Of\
    \ course, social media is an important part of the process. However, I think it\
    \ will increasingly be a matter of building platforms and creating experiences\
    \ that can convey a sense of presence, as if you were there with another person.\
    \ Of course, augmented and virtual reality are part of the process, \\[…\\] we've\
    \ been working on it for 7 years now \\[…\\]. We started releasing Horizon and\
    \ Workrooms and some of these experiences where you feel the presence of someone\
    \ in a place \\[virtual reality platforms for Oculus, ed.\\] \\[…\\]. In a certain\
    \ way, it's a bit like the always dream of building this kind of digital social\
    \ experience, where people sense that they are together and that they are doing\
    \ something together, collaborating. To date, none of the technologies we have\
    \ can do this \\[...\\] We will have virtual reality for when we want to go to\
    \ an immersive area, we will have augmented reality to view holograms, so you\
    \ can imagine this information in 3 or 5 years where instead of having a video,\
    \ you will be a hologram in my living room, and I will be a hologram in yours\"\
    .*\n\n**![](images/00026.jpeg)**\n\nFigure 26: Darth Vader talks to a subordinate\
    \ via handheld holoprojector. According to Zuckerberg, such a scenario will be\
    \ technologically feasible within 3-5 years[**\\[113\\]**](#part0000_split_077.html#_ftn113)\n\
    \nZuckerberg's move proposes a new business perspective, with the aim of overcoming\
    \ the evident criticality of the company's stock prices, which have not benefited\
    \ from the explosion in the turnover of the other Big Techs: Amazon, Google and\
    \ in even to a lesser extent Apple. In fact, Meta was unable to grasp the positive\
    \ turning point that characterized the years 2019-2021 both for Google (Alphabet)\
    \ and for Amazon:\n\n**![](images/00027.jpeg)**\n\nFigure 27: growth in the value\
    \ of the big Tech shares from 2016 to 2021. The prices are respectively recorded\
    \ on 11, 10, 9, 8, 13 and 11 November of the various years. Source: Agenda Digitale[**\\\
    [114\\]**](#part0000_split_077.html#_ftn114)\n\nThirty years after the term was\
    \ first coined, the scenario described could become reality thanks to a set of\
    \ technologies, even if not yet fully mature, such as Blockchain, Virtual Reality\
    \ and Augmented Reality.\n\n### 8.1.1 From Data to Privacy\n\nAs described in\
    \ an article reported by Wired magazine[\\[115\\]](#part0000_split_077.html#_ftn115):\n\
    \n*“The experience in the Metaverse will certainly involve the collection, processing\
    \ and sharing of an unprecedented amount of personal data, of different types\
    \ and between multiple subjects. Furthermore, in the metaverse it will be possible\
    \ to collect information relating to the behavior and psychological reactions,\
    \ physical movements and biometric data of users (imagine the case of goggles\
    \ or other bodily devices necessary for the new virtual experience). Users (and\
    \ their reactions, physical and / or psychological) will therefore be continuously\
    \ monitored.” *\n\nConsequently, the issue of privacy and the processing of personal\
    \ data will become an increasingly central point for the purpose of a responsible\
    \ and serious presence and participation in the metaverse.\n\n## 8.2 Second Life:\
    \ the first example of Metaverse\n\nSecond Life[\\[116\\]](#part0000_split_077.html#_ftn116)\
    \ is an online platform launched in 2003 by the Linden Lab of San Francisco and\
    \ is considered the first concrete example of Metaverse. Second Life allows people\
    \ to create an avatar for themselves and have a second life in an online virtual\
    \ world, or metaverse. Users, also called residents, are able to interact with\
    \ places, objects and other avatars, they can explore the world (known as the\
    \ grid), meet other residents, socialize, participate in both individual and group\
    \ activities, build, create, purchase and exchange virtual properties and services\
    \ with each other.\n\nThe platform features mainly user-generated 3D content and\
    \ also has its own virtual currency, the Linden Dollar, which is exchangeable\
    \ for real-world currency.\n\n**![](images/00028.jpeg)**\n\nFigure 28: Second\
    \ Life virtual environment. Source: Wikipedia\n\nWhat are the possibilities offered\
    \ by Second Life, beyond the playful aspect? Here are some of them:\n\n·            \
    \ the platform can be used as a virtual workspace for holding remote conferences\
    \ and meetings\n\n·             similarly, it allows a virtual space for online\
    \ education and training"
