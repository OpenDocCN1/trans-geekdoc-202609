  trans: "\n\n通过其市场，用户可以购买一系列虚拟物品，从化身配饰（如衣服和珠宝）到虚拟生活中使用的家具。\n\n第二人生（Second Life）一直从多个方面受到批评：\n\
    \n- **技术方面**：第二人生曾遭受和正遭受着各种技术问题。例如：\n    - `与系统不稳定性相关的困难，`，包括系统延迟增加和客户端崩溃\n  \
    \  - `用户库存中的物品丢失，包括购买的物品，` 这些物品可能会在没有任何预警的情况下消失，或者永久地进入一种在需要时不会出现在世界中的状态\n   \
    \ - `计算机硬件和网络连接`：能够在其他在线多人游戏平台中流畅运行高质量内容的硬件和连接，在第二人生中可能表现不佳，导致帧率低且即使在最低图形配置下控制也无灵敏\n\
    \    - `网络拥塞`：单个区域仅用于托管有限数量的居民，导致某些热门地点无法访问。`Resident`（居民）支付的土地区域可能因为同一区域的另一个区域化身额度耗尽而无法访问\n\
    - **知识产权方面**：尽管第二人生 服务器整合了一项管理数字对象知识产权的技术，但仍然有系统可以绕过它们\n- **安全与隐私**：2006 年 9 月\
    \ 8 日，Linden Lab 发布了一份新闻公告，揭露其第二人生数据库已被入侵，客户信息（包括加密密码和真实用户名）可能已被访问\n- **不当内容**：一些媒体关注了涉及外表儿童化身的性活动。由于由于原因，例如，英国和德国是正在研究新法律以打击模拟儿童色情的国家之一。美国曾试图通过几项禁止此类行为的法律，但每一项都被美国最高法院驳回，理由是违反了宪法第一修正案的言论自由权。\n\
    \n## 8.3 元宇宙的其他示例\n\n特别是在最近几年，项目在元宇宙概念的基础上诞生。以下是一些示例：\n\n- **VRChat**：一种 3D 格式的社交体验。`VRChat`\
    \ 在游戏界非常流行，并在 Twitch 和 YouTube 直播网站上活跃。相遇、分享、比较：这就是该平台提供的。\n- **AltspaceVR**：微软的社交\
    \ VR 平台，可以在那里组织虚拟活动、会议和派对，用户可以在那里相遇、协作和聊天。该平台推广了 LGBTQI + 活动、知名艺术家的现场秀，以及 2020\
    \ 年巴黎时装周虚拟秀。\n- **Hoppin’**：这是一种沉浸式体验，允许你访问世界的任何地方，与朋友或家人同时共享同一空间。此外，这也是一个机会让你可以在舒适的家中或办公室向潜在客户展示地点和目的地，分享会议。\n\
    - **Spatial**：该平台专注于会议和商务会议。通过 4 种不同的虚拟环境，可以创建真实再现用户脸部的 3D 化身，直接从查看器共享本地文件并操作\
    \ 2D 对象。它还支持图像、视频、pdf 和 3D 对象。\n- **OVR**：这是一个基于 `Ethereum Blockchain` 构建的增强现实和虚拟现实平台。通过为\
    \ `OVRLand` 用户，任何人可以在他们的环境中设计任何想象中的 `OVRExperience`。此外，创作者可以通过 `OVR Marketplace`\
    \ 销售他们的虚拟现实体验。\n\n最后，我们报告，微软正在向其 `Teams` 聊天系统添加化身和 3D 虚拟环境，作为其推向“元宇宙”的一部分。微软表示，这些被称为“沉浸式会议”的新功能将在\
    \ 2022 年上半年可用。\n\n## 8.4 全新的 UX\n\n在技术领域，缩写 `UX` 代表用户体验（User Experience），即用户交互和体验产品、系统或服务的方式。随着\
    \ 90 年代初互联网的起源，用户简单地通过键盘和鼠标与系统交互。另一方面，随着所谓的 `Web 2.0`，智能手机和平板等便携式设备开始越来越普及。在这种情况下，触摸屏成为与设备交互的主要界面。另一方面，随着\
    \ `Web 3.0`，由于可穿戴设备的使用增加，用户体验将发生进一步变化，特别是使用两种特定技术的智能眼镜：\n\n- 虚拟现实\n- 增强现实\n\n\
    下面我们将详细描述这两种技术的工作原理。\n\n### 8.4.1 虚拟现实\n\n在最近发布在 YouTube 上的视频中，我们可以了解到扎克伯格的新公司所说的元宇宙：一个沉浸式世界，它可以包括现有现实部分的虚拟元素，或者完全虚拟的元素、物体和人。\n\
    \nimages/0029.jpeg\n图 29：根据 Meta 的元宇宙\n\nMeta 视觉背后的技术是虚拟现实，这项技术并不新鲜（如我们所见），但公司通过\
    \ 2014 年收购 `Oculus`（现更名为 Horizon），在该领域已拥有丰富的专业知识。在本节中，我们将详细描述什么是虚拟现实。\n\n虚拟现实可以描述为在模拟环境中进行的交互式计算机生成体验，主要整合了听觉和视觉反馈，也可以允许其他类型的感官反馈，如触觉反馈。\n\
    \n虚拟现实的概念最早可以追溯到 1838 年，当时查尔斯·惠斯顿发明了立体镜。20 世纪 50 年代中期，电影人莫顿·海利开发了 `Sensorama`（1962\
    \ 年专利），这是一种街机式的剧场家具，能够刺激所有的感官，而不只是视觉和听觉。它具有立体声器、立体 3D 显示、风扇、气味发生器和震动椅。1961 年，`Philco\
    \ Corporation` 的两个工程师开发了我们所熟悉的头戴显示器的前身：`Headsight`。它为每个眼睛配备了一个视频和一个和一个运动检测系统，连接到\
    \ `CCTV` 摄像头。1968 年，伊万·萨瑟兰发明了“达摩克利斯之剑”，能够通过叠加原始的计算机生成的 3D 合成图形来追踪用户的头部运动。随着互联网时代的到来，虚拟现实尤其进入了视频游戏领域，出现了一些有时并不非常成功的实验和产品（例如任天堂的产品）。到目前为止，最流行的\
    \ VR 头显设备设备可能是 Meta 的 Oculus 和 HTC 的 HTC Vive。\n\n#### 8.4.1.1 VR 如何工作，例如硬件和软件\n\
    \n使用虚拟现实基本上有两种类型的技术：\n\n- `洞穴式自动虚拟环境 (CAVE)`\n- 头戴设备技术\n\nCAVE 技术由一个位于房间内的视频剧场组成，其\
    \ CAVE 墙可以由：\n\n"
