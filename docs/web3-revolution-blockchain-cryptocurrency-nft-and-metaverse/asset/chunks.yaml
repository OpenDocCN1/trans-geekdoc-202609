- raw: "What is the environmental impact of Bitcoin? According to recent data published\
    \ by the Cambridge Bitcoin Electricity Consumption Index[\\[18\\]](#part0000_split_077.html#_ftn18)\
    \ as of this writing, Bitcoin's annual electricity consumption would be around\
    \ 123 TWh, which is roughly the same as the annual energy consumption of countries\
    \ like Norway or Argentina[\\[19\\]](#part0000_split_077.html#_ftn19). Furthermore,\
    \ the energy consumption of Bitcoin, as reported in the graph in Figure 12, is\
    \ growing exponentially. Or again, a BTC transaction consumes as much as 1.2 million\
    \ VISA circuit transactions[\\[20\\]](#part0000_split_077.html#_ftn20).\n\n![](images/00012.jpeg)\n\
    \n|  ||  |\n\n| --- | --- |\n\n|  || ![](images/00013.jpeg) |\n\nFigure 12: Bitcoin\
    \ total energy consumption^(22) \n\nFigure 13: comparison between the energy consumption\
    \ of 1 Bitcoin transaction and 100,000 VISA transactions^(24)\n\nPrecisely for\
    \ this reason, we have seen how one of the main efforts of professionals is to\
    \ find new mechanisms to reduce energy consumption. The Algorand platform, for\
    \ example, claims to be even carbon negative. In fact, through the partnership\
    \ with ClimateTrade, Algorand is offsetting its CO2 emissions and is now a Blockchain\
    \ with a negative carbon footprint. Furthermore, the Solana, Polkadot and Cardano\
    \ projects were born with the clear intention of making the Blockchain more scalable,\
    \ cheaper and more sustainable. For example, Solana's Blockchain is capable of\
    \ processing 50,000 transactions per second compared to Ethereum's 15-30, with\
    \ costs of $ 0.00025 per transaction. Solana uses a consensus mechanism known\
    \ as Proof-of-History, which is much cheaper than not only Proof-of-Work, but\
    \ also Proof-of-Stake[\\[21\\]](#part0000_split_077.html#_ftn21).\n\n### 3.2.6\
    \ Deregulation\n\nBeing a technology still substantially new and unknown to the\
    \ masses, the Blockchain is subject to a legislative vacuum even in the main countries.\
    \ However, regulatory initiatives are proliferating around the world to create\
    \ an orderly environment for the development of crypto markets. As reported by\
    \ Sole24Ore[\\[22\\]](#part0000_split_077.html#_ftn22), according to the composite\
    \ index developed by the company ChainAnalysis[\\[23\\]](#part0000_split_077.html#_ftn23)\
    \ between the end of 2019 and mid-2021 the use of digital currencies increased\
    \ by 25 times (+ 2500%), with a decisive explosion starting from January 2021.\
    \ In this panorama, initiatives of regulation aimed at creating an orderly environment\
    \ for the development of crypto markets. The risk is that we proceed in no particular\
    \ order and without an overall perspective, in a sector where the regulatory arbitrage\
    \ of prohibitions and divergent interpretations is extremely simple. The EU has\
    \ chosen to develop the Markets in Crypto-Assets (MiCA) Regulation[\\[24\\]](#part0000_split_077.html#_ftn24).\n\
    \nAt international level, the Financial Crimes Enforcement Network[\\[25\\]](#part0000_split_077.html#_ftn25)\
    \ (FinCEN) proposed that digital currency service providers (exchanges, but also\
    \ banks) collect information on the identity of proprietary Wallet holders. This\
    \ means that if a user wanted to convert their personally held Bitcoins into fiat\
    \ currencies, they would have to provide their credentials to intermediaries,\
    \ essentially equating crypto transactions with bank transfers. \n\n### 3.2.7\
    \ Financial risks\n\nDecentralized finance exposes the investor to very high and\
    \ unknown risks in the context of classical financial services. First of all,\
    \ there is a general lack of depositor protection: users can also lose the entire\
    \ investment due to sudden falls in the value of cryptocurrencies, fraud, and\
    \ lost private keys. Furthermore, the irreversibility of transactions in digital\
    \ currencies and the difficulty in establishing responsibility towards users due\
    \ to decentralized management pose additional risks. Finally, it should be noted\
    \ that the data strings representing the public key addresses of the holders in\
    \ a Crypto transaction can, with a significant effort, be linked to the identifiers,\
    \ thus compromising the identity of users and their privacy.\n\n### 3.2.8 Loss\
    \ of cryptographic keys\n\nThe possession of the private cryptographic keys in\
    \ a Crypto transaction allows you to have only the value associated with it. When\
    \ a user holds their digital currencies in a Wallet at a large exchange like Coinbase,\
    \ they are effectively delegating the custody of their keys to a private company.\
    \ Therefore, the digital currencies deposited in the Exchange are not really Bitcoin\
    \ but rather a contractual right on the underlying Bitcoins. On the contrary,\
    \ the user can decide to keep their keys personally using specific software or\
    \ hardware in the proprietary Wallets (at most, paper and pen) bypassing the exchange.\
    \ In any case, the loss of the cryptographic key cannot in any way be recovered.\n\
    \n# 4. What are Cryptocurrencies?\n\n**4.1 Coin and Token, a subtle difference**\n\
    \n**4.2 History of Cryptocurrencies **\n\n**4.3. Bitcoin, a new digital currency**\n\
    \n**4.4 Ethereum, the # 1 Altcoin**\n\n**4.5 Initial Coin Offering (ICO) **\n\n\
    **4.6 Initial Exchange Offering (IEO) and Initial DEX Offering (IDO)**\n\n**4.7\
    \ The main Cryptocurrencies on the market** \n\n**Chapter summary**\n\nCryptocurrencies\
    \ can be considered the fuel to run the engine of Blockchain projects. But how\
    \ do they work and what mechanism governs them? How can we buy them, keep them\
    \ and exchange them? We will try to answer these simple questions by describing\
    \ the concept of Cryptocurrency in more detail. \n\n**Keywords**: Cryptocurrency,\
    \ Coin, Token, Bitcoin, Ethereum, Altcoin, Initial Coin Offering (ICO), Initial\
    \ Exchange Offering (IEO), Initial DEX Offering (IDO)\n\n## 4.1 Coin and Token,\
    \ a subtle difference\n\nIn the previous chapters we have described what Blockchain\
    \ technology consists of and what are its advantages and disadvantages.\n\nTrying\
    \ to summarize once again, Blockchain technology is a transparent, secure, reliable\
    \ and affordable solution for carrying out transactions, whether they are of an\
    \ economic, contractual or commercial nature. To do this, over the years solutions\
    \ have been developed which take the name of Blockchain in their current form\
    \ and which are essentially based on the use of:\n\n·             a distributed\
    \ network\n\n·             a hash and cryptographic coding system\n\n·            \
    \ a chain architecture\n\n·             a consent mechanism\n\nThese elements\
    \ contribute to achieving the set objectives. The absence of one of these would\
    \ invalidate the final result: without a distributed network there would be no\
    \ complete transparency and without a cryptographic coding system there would\
    \ be no security. However, due to the increasing computing power provided by modern\
    \ computers, capable of generating thousands of strings per second, this system\
    \ alone would not be sufficient to guarantee the necessary security. Linking blocks\
    \ in sequence reduces the likelihood of block modification as the chain becomes\
    \ more extensive (remember? To modify an upstream block, all the hashes downstream\
    \ must be recalculated). If even this mechanism were not enough, the consensus\
    \ algorithms set a series of rules so that each block is validated by the network.\
    \ In the case of PoW, the computational effort in deciphering the blocks is made\
    \ by the so-called miners, whose role is fundamental in an ecosystem of this type.\
    \ To reward miners for the work done (who would work for free?) they receive tokens\
    \ associated with the Blockchain the miners are working on. Such Tokens are also\
    \ called Coins."
