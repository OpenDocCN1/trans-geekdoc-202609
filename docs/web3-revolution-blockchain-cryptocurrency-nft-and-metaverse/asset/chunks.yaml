- raw: '## 2.1 Peer-to-Peer (P2P) network


    In the field of computer network, 3 types of network architectures can be identified:


    **1.              Centralized networks**


    **2.              Decentralized networks**


    **3.              Distributed networks**


    **![](images/00003.jpeg)**


    Figure 3: A comparison of the topography of centralized, decentralized and distributed
    networks (Source: Baran, 1964)


    ### 2.1.1 Centralized network


    A centralized network architecture is built around a single server that manages
    all major processing. Less powerful workstations connect to the central server
    and send their requests instead of executing them directly. Having a central server
    that controls the entire network means less management time and fewer administrators
    to update the entire network. Also, all data on a centralized network has to go
    through a single location, so it is very easy to track and collect data across
    the network.


    However, centralized networks have their downsides: by definition, the server
    represents a single point of failure, that is, its malfunction puts the entire
    network at risk. As a result, if the server goes down, the individual connected
    "client" machines are unable to process user requests. Another disadvantage of
    centralized networking is that it offers limited scalability: since all applications
    are hosted on a single server, the only way to scale the network is to add more
    storage, bandwidth, or processing power to the server. This may not prove to be
    a cost-effective long-term solution.


    ### 2.1.2 Decentralized network


    As opposed to a centralized network, a decentralized network architecture distributes
    workloads across multiple machines, rather than relying on a single central server.
    A decentralized network offers a wide range of advantages over the more conventional
    centralized network, including greater system reliability, scalability and privacy.


    One of the most important benefits of decentralized network management is the
    fact that there is no true single point of failure like in the centralized network,
    because individual users'' machines do not depend on a single central server to
    manage all processes. Decentralized networks are also much easier to scale, as
    you can simply add more machines to the network for more computing power. In addition
    to this, a decentralized network architecture allows for greater privacy, as information
    does not pass through a single point but passes through several different points.
    However, the downside is that decentralized networks require more machines, which
    means more maintenance and potential problems, which in turn places an additional
    burden on IT resources.


    ### 2.1.3 Distributed network


    An evolution of the architecture of decentralized network systems is represented
    by the distributed network, or peer-to-peer (P2P) on which the Blockchain is based.
    A P2P network is an architectural model in which the nodes are not hierarchized
    only in the form of fixed clients or servers, but also in the form of equivalent
    or ''peer'' nodes, being able to act at the same time as clients and servers towards
    the other terminals (Hosts) of the network. This means that through this configuration
    any node is able to initiate or complete a transaction. Equivalent nodes may differ
    in local configuration, processing speed, bandwidth, and amount of stored data.
    Among the main features of decentralized networks, we list the followings:


    ·             each user shares his own resources locally and he is the administrator
    of his own Client-Server. On the one hand this can be positive for major "independence",
    but on the other it requires skills from each user, especially as regards protection


    ·             the average data transmission speed is much higher than a classic
    centralized network, since the information requested by a Client can be found
    by numerous Clients connected in an equal way (i.e., "peer"), rather than by a
    single server


    ·             the access security to clients is managed locally on each machine
    and it is not centralized


    ·             high scalability and "self-regeneration" capability. In the event
    that a node stops working - or simply disconnects from the network - the network
    will continue to function without major problems: the exchange of data or the
    search for resources will continue along alternative routes to the one that passed
    through the node that was not more available. In this way, the bottleneck that,
    in some cases, is represented by relying on the functioning of a single server
    is bypassed


    The most popular examples of peer-to-peer (P2P) networks are the various file
    sharing protocols that have sprung up over the years:


    ·             **Napster**: launched in 1999 by Shawn Fanning, a computer programmer
    and Sean Parker (who would later become Facebook''s first president) as a pioneering
    file sharing software service with an emphasis on distributing digital audio files.
    It was closed in 2002 due to legal problems related to copyright


    ·             **Bit Torrent**: born in 2001 by Bram Cohen, a computer science
    student at the University of Buffalo in the United States


    ·             **eMule**: the eMule project was started in 2002 by Hendrik Breitkreuz,
    dissatisfied with the original eDonkey2000 client


    These protocols, although legal (data exchange is not an illegal activity), are
    nevertheless mostly used for the trafficking of works that infringe copyright,
    such as movies, music, books and video games. Only in the United States, more
    than 200,000 lawsuits have been filed for copyright infringement on Bit Torrent
    since 2010.


    ## 2.2 The distributed ledger system


    In the example of the online library described in the previous chapter we saw
    how the Blockchain is based on a distributed accounting system, i.e., a system
    in which each participant receives a copy of the transaction log of the entire
    library. Think of this type of accounting system as a family tree that, instead
    of the names of the people who own and borrow the books, also contains information
    about the payment value, time, and addresses. Regarding the value of the amounts,
    the ledger keeps all the records of the payments up to the first transaction that
    has ever been made.


    What happens is very similar to any of the current banking systems. However, there
    are substantial differences:


    1.  the ledger has no banker by virtue of the distributed architecture described
    above


    2.  addresses do not represent people''s names, nor who owns what. Therefore,
    we can define it as an anonymous accounting system (in Chapter 3 we will actually
    see how this is not entirely true). When it comes to a Cryptocurrency account
    within the big ledger, the only person who can access it is the person who has
    the password to do so. This can be dangerous: in fact, if you accidentally lose
    the password of the Wallet that the ledger holds, any value will be lost forever.
    As we will see later, this risk is reduced if virtual wallets are used


    3.  the register is visible to everyone, as it is completely decentralized. Therefore,
    everyone can see a user''s account, as well as how much value that wallet is


    ## 2.3 Blocks


    Blocks are the bricks of the Blockchain. Each block of the chain basically contains
    3 elements:


    ·             **the data** stored in the block. The type of data stored depends
    on the type of Blockchain. For example, the Bitcoin Blockchain stores the details
    of one or more transactions, such as user, recipient and the amount of Bitcoin
    traded


    ·             **the hash**, a string of numbers and letters that identifies that
    block and its content and that is always unique, like a kind of fingerprint. Each
    time a new block is created, a new, unique and specific hash for that block is
    calculated. If any data inside the block changes, the hash will also change accordingly


    ·             **the hash of the previous block**, thanks to which the connection
    to the previous block is generated, making the blockchain particularly secure. '
