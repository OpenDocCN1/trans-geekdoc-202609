    \ (IMUs) are used to track rotation. IMUs use a gyroscope, accelerometer, and\
    \ magnetometer to detect rotations. All modern 3 DoF tracking uses an IMU\n\n\
    ·             **6 DoF**: monitoring keeps track of position and rotation. The\
    \ system knows where we are looking and where we are positioned. This is how high-end\
    \ VR systems, like HTC Vive and Oculus Rift, let you move around the room. There\
    \ are many different ways to do 6 DoF monitoring. The Oculus Rift uses a number\
    \ of LEDs and external cameras that build a model and then try to fit a 3D model\
    \ of the headset with the 2D model it sees of the camera. It then uses information\
    \ from an internal IMU to calculate the position of the head. The HTC Vive instead\
    \ uses infrared lasers to measure the time it takes to sweep a visual sensor vertically\
