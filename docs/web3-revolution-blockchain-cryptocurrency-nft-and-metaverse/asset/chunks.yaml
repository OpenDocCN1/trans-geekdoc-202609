    without having to use Exchange. These synthetic assets represent cryptocurrencies,
    stocks and fiat currencies.


    We have seen how Ethereum has basically given way to the birth of a series of
    Cryptocurrencies based on the creation of `Smart Contracts`. What value do these
    cryptocurrencies have? The initial value is assigned thanks to an initial token
    offer, or `ICO`.


    ## 4.5 Initial Coin Offering (ICO)


    In the wake of Bitcoin, a series of different Blockchains have been born over
    the years, and consequently also a series of different cryptocurrencies. A digital
    currency market parallel and analogous to that of fiat currencies has therefore
    been created, i.e., currencies issued by the government not supported by physical
    commodities, such as gold or silver, but rather by the government that issued
    them (for example the US dollar, euro and other major global currencies) and that
    of the stock markets. In fact, thanks to the Foreign Exchange market, more commonly
    called `forex`, or currency market, it is possible to exchange different currencies,
    just as it is possible to trade shares in the stock market. In a completely similar
    way, it has become possible to exchange Cryptocurrencies through the Exchanges.


    The question we ask ourselves now is: **what value to assign to newly born cryptocurrencies?**


    The answer still lies in the analogy with the financial markets. When a company
    decides to go public, it must go through a so-called initial public offering.
    An initial public offering or `IPO`, is an offer to the public of the securities
    of a company that intends to go public for the first time on a regulated market.
    It is a complex phase that requires notions that are beyond our scope. However,
    it is worth underlining that it is necessary to carry out an evaluation of the
    company being listed.


    Similarly, in the Cryptocurrency market we proceed through an initial coin offering
    or `ICO`. However, the process is completely different from the `IPO`: it often
    takes place in the form of crowdfunding, although a private `ICO` that does not
    seek public investments is also possible. In an `ICO`, a quantity of Cryptocurrency
    is sold in the form of `tokens` to speculators or investors, in exchange for fiat
    currency or other Cryptocurrencies such as `Bitcoin` or `Ether`. `ICOs` can allow
    startups to avoid regulations that prevent them from seeking investments directly
    from the public and intermediaries such as venture capitalists, banks and stock
    exchanges, which may require greater control and a certain percentage of future
    profits or joint ownership.


    Furthermore, `ICOs` may fall outside existing regulations, depending on the nature
    of the project, or be banned altogether in some jurisdictions, such as China and
    South Korea. In fact, due to the lack of regulation, `ICOs` have in the past been
    a vehicle for scams.


    Less than half of `ICOs` survive, while nearly half of `ICOs` fail by 2018. However,
    `ICOs` aren''t the only way to raise money.


    ## 4.6 Exchange Offering (IEO) and Initial DEX Offering (IDO)


    If 2017 was the year of `ICOs`, 2019 is that `IEOs`. An `IEO` is managed by `Exchange`
    to raise funds. In return, the `start-up` has to pay listing fees and a percentage
    of tokens sold.


    Initial DEX Offering (`IDO`) is similar to `IEO`, except that `IDOs` are conducted
    on decentralized exchanges (`DEX`), while `IEOs` are conducted on centralized
    platforms. However, decentralized exchanges currently have limited traction so
    that many members have questioned their usefulness.


    ## 4.7 The main Cryptocurrencies on the market


    After having seen what `Cryptocurrency` is (`Coin` and `Token`), what are the
    main benefits introduced by `Bitcoin` and what `Ethereum` offers, in this paragraph
    we will provide some basic information of the top Cryptocurrencies in terms of
    market capitalization as of writing. This will give us only a partial, but still
    effective, idea of the variety of proposals that each brings with it. Many think
    it unworthy to take consideration the so-called "pump and dump" mechanism, which
    consists in the creation of false hype about a new `Token` by a group of people
    with the aim of generating interest. Once investors start buying it, its value
    increases. The scammers behind the hype sell all their `Tokens`.


    ### Bitcoin`[`42`]`](#part0000_split_077.html#_ftn42)


    `Bitcoin` is first presented in a 2008 Whitepaper by one person, or a group of
    people, using the alias `Satoshi Nakamoto` and launched shortly thereafter, in
    January 2009. `Bitcoin` was created, in Nakamoto''s own words, for allow *"to
    send online payments directly from one party to another without going through
    a financial institution"*.

