- raw: "If you decide to invest in the aforementioned financial instruments, we recommend\
    \ that you deepen the subject with professionals, courses or books that explain\
    \ the investment mechanisms of the financial markets.\n\n## 5.3 The Wallets\n\n\
    There are many ways to store and protect your Cryptocurrencies and, in this section,\
    \ we will take a look at each of these possibilities and their advantages and\
    \ disadvantages. In reality, a clarification must be made immediately: Cryptocurrencies\
    \ are actually stored on the Blockchain, or on a public address for each of which\
    \ there is a private key necessary to be able to use them. Anyone who knows the\
    \ private key of a public address can freely use all the tokens stored on it,\
    \ therefore it becomes essential to keep the private keys of one's addresses properly.\n\
    \nWallets or digital wallets are the place where public and private keys are stored,\
    \ in a manner similar to physical wallets where coins, banknotes and credit cards\
    \ are stored. \n\nThe Wallet is a software or hardware designed exclusively to\
    \ store and manage public keys and private keys of our Cryptocurrencies and uses\
    \ advanced Blockchain encryption techniques to offer and guarantee total security\
    \ to users. In this way, the Wallet can save, send and receive Cryptocurrencies\
    \ without increased risk. Before operating with a Wallet, it is necessary to know\
    \ the types of Wallets available on the market and to study the advantages and\
    \ disadvantages offered by each of them to determine which is the one that best\
    \ suits the needs of each. As we will see, the user has several means of protecting\
    \ their private key.\n\n### 5.3.1 Cold Wallet \n\nThe so-called “cold Wallet”\
    \ is any type of Wallet in which the private key is stored offline, without an\
    \ Internet connection. **Paper Wallets** fall under this category: it consists\
    \ of writing the private key on a piece of paper and is probably the safest way\
    \ to keep keys but at the same time also the most inconvenient.\n\n### 5.3.2 Hot\
    \ Wallet \n\nThese are Wallets that are saved on a device with an Internet connection.\
    \ Hot Wallets are not insecure by definition, but it is essential to understand\
    \ the risks because today it is necessary to expect that every device can be hacked.\
