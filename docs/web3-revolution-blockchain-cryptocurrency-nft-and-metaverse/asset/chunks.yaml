    \ **Coinbase**[\\[58\\]](#part0000_split_077.html#_ftn58)**: **Top-notch American\
    \ Exchange that owes much of its success to excellent mobile apps for iOS and\
    \ Android. This platform sets strict rules for identification and asks for a lot\
    \ of personal data. There is the Pro version that offers different analysis tools\
    \ for investors and lower commissions, at the expense of greater complexity at\
    \ the interface level\n\n3.               **FTX**[\\[59\\]](#part0000_split_077.html#_ftn59):\
    \ Bahamas-based Exchange founded by MIT alumni Sam Bankman-Fied and Gary Wang\
    \ in May 2019. Formula 1 fans will likely have recognized the name of the Exchange\
    \ thanks to sponsorship starting September 2021 with Mercedes-AMG Petronas F1\
    \ with the company logo appearing on the livery and overalls of the official drivers\
    \ Luis Hamilton and Valeri Bottas\n\n4.               **Kraken**[\\[60\\]](#part0000_split_077.html#_ftn60)**:\
    \ **offers exchanges of many currency pairs and all major cryptocurrencies. Maximum\
    \ commissions reaching 0.26%, profile verification and bank transfers accepted.\
    \ However, there are limits to daily withdrawals\n\n5.               **KuKoin**[\\\
    [61\\]](#part0000_split_077.html#_ftn61): founded in 2013 but officially launched\
    \ in September 2017 and is based in Singapore.\n\nOther popular and noteworthy\
    \ exchanges are:\n\n·    **Bitstamp**[\\[62\\]](#part0000_split_077.html#_ftn62)**:\
    \ **in 12th position on CMP. This Exchange carries out an impressive volume of\
    \ transactions every day in Europe thanks to its speed and the large number of\
    \ accepted payment methods\n\n·    **Poloniex**[\\[63\\]](#part0000_split_077.html#_ftn63)**:\
    \ **in 21st position on CMP. In this case, account verification is not required,\
    \ but withdrawals have thresholds that are not allowed to be exceeded. Commissions\
    \ more than acceptable\n\n·    **Bittrex**[\\[64\\]](#part0000_split_077.html#_ftn64)**:\
    \ **in 25th position on CMP. Few exchanges can offer the same huge amount of cryptocurrencies\
    \ and currency pairs in today's market. In addition, the commissions reach a maximum\
    \ amount of $ 0.23\n\n·    **Bitpanda**[\\[65\\]](#part0000_split_077.html#_ftn65)**:\
    \ **In 93rd position on CMP. Here, too, we can count on a cost-free electronic\
    \ wallet and on many accepted payment methods (including electronic ones). And\
    \ also, in this case the identification operations are scrupulous\n\nWhat are\
    \ the differences between Exchanges and stock markets? Basically two:\n\n·   \
    \ The stock markets have an opening and closing time, as well as following the\
    \ calendar of the different states in which they operate, while the Crypto Exchanges\
    \ never close. This means that the exchange can be made at any time. This results\
    \ in more flexibility for the Crypto investor\n\n·    Stock markets are regulated,\
    \ while exchanges are not. Financial markets are among the most regulated sectors\
    \ of the economy with the aim of ensuring individual protection (of creditors,\
    \ investors and policyholders), the stability of the system and the functionality\
    \ of the financial markets themselves. This comes with a greater source of risk\
    \ for the Crypto investor\n\n## 5.2 Broker\n\nA Cryptocurrency broker is a company\
    \ or individual that acts as an intermediary between the buyer and the different\
    \ Cryptocurrency markets, to facilitate the buying and selling of Cryptocurrencies\
    \ through financial instruments. \n\nCryptocurrency brokers differ from exchanges\
    \ in several characteristics, the main one of which is the impossibility of buying\
    \ cryptocurrencies, as they deal with investments on their value. The investment\
    \ in Cryptocurrencies through a broker can essentially take place through 3 financial\
    \ instruments:\n\n1.  **CFD**: it stands for contract for difference and is a\
    \ financial instrument whose price is based on the difference between the entry\
    \ price and the exit price of an underlying asset. Simply put, a CFD reflects\
    \ the value states of an asset, both at the beginning and at the end of a day.\
    \ Thanks to these features, traders have the ability to trade different types\
    \ of assets such as indices, stocks, futures, or even Cryptocurrencies, without\
    \ owning them. For example, when you buy a CFD on a stock, you are not the owner\
    \ of the stock, but simply have a contract with the broker\n\n2.  **ETF**: Exchange\
    \ Traded Funds are special passively managed investment funds. As with all funds,\
    \ buying an ETF is like buying a basket of stocks. Investing in a fund is equivalent\
    \ to putting your savings together with that of other investors, the fund manager\
    \ will then buy the instruments on which you will invest with this money. The\
    \ investment performance will be given by the result of all the individual instruments\
    \ in which the fund invests. Within the ETFs we can find investments in companies\
    \ that, for example, operate in the branch of hardware production or mining, up\
    \ to financial companies that hold real Exchanges on which to exchange Crypto,\
    \ passing through banks and payment services in favor of Bitcoin adoption. To\
    \ date, there are several indices that invest in companies operating in the Blockchain\
    \ and Cryptocurrency sector, directly or indirectly. Some of them are:\n\n1. \
    \ Elwood Blockchain Global Equity, which replicates the performance of companies\
    \ around the world, developed and non-developed countries, which deal or will\
    \ deal with the Blockchain sector;\n\n2.  Indxx Blockchain, which replicates the\
    \ performance of companies, globally, that are already using or creating products\
    \ and services related to the Blockchain, or alternatively that are investing\
    \ in this sector;\n\n3.  MVIS Global Digital Assets Equity, which replicates the\
    \ global trend of companies engaged in the sector of digital assets or similar,\
    \ offering Exchange services, payment systems, mining operations, software, technologies\
    \ or infrastructures related to this issue. \n\n3.  **ETN**: these are Exchange-Traded\
    \ Notes, or financial instruments that differ from ETFs in that they are not funds\
    \ and are issued against a direct investment in the underlying by the issuing\
    \ company, replicating the trend. Who made these ETNs available is the company\
    \ VanEck, which has decided to add the following ETNs to its ETF on digital assets\
    \ (which we have analyzed before):\n\na.  VanEck Vectors Ethereum ETN\n\nb.  VanEck\
    \ Vectors Solana ETN\n\nc.   VanEck Vectors Polkadot ETN\n\nd.  VanEck Vectors\
    \ Tron ETN\n\nThe advantage of investing in these ETNs is the fact of being able\
    \ to expose yourself on these Cryptocurrencies without having to buy them directly\
    \ through an Exchange, with all the risks associated with the counterparty. Furthermore,\
    \ you do not have to worry about the custody of private keys and you have the\
    \ possibility to easily access these tools simply by using an online broker. As\
    \ for brokers, we would like to mention the following two in terms of popularity:\n\
    \n·             **eToro**[\\[66\\]](#part0000_split_077.html#_ftn66): probably\
    \ the broker par excellence. eToro was born in Tel Aviv in 2007. In 2010, it launched\
    \ the eToro Open Book investment platform, which includes Copy Trading functionality,\
    \ allowing investors to automatically search, track and copy successful traders.\
    \ In addition, the platform provides a demo account for financial simulation with\
    \ virtual money, which reduces the associated risk for a novice investor.\n\n\
    ·             **DEGIRO**[\\[67\\]](#part0000_split_077.html#_ftn67): DEGIRO is\
    \ a Dutch company founded in 2008 and offers a large selection of cryptocurrency\
    \ trackers, most of which are ETNs. It also offers cryptocurrency ETFs."
