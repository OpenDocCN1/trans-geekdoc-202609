    There is also the positive side of the coin: every risk represents an opportunity.
    To seize these opportunities, we must first make a personal effort, that is, accept
    the risk, then reduce it and manage it appropriately. To reduce risks, the first
    thing to do is to keep informed adequately, learn about the meaning of the `Blockchain`,
    `Cryptocurrencies` and `NFTs`, but above all their practical use. As we will see,
    these new digital assets will bring with them a series of uses and benefits that
    in some cases could lead to significant social and cultural changes.


    Think of a society in which banks lose their central role as financial guarantor.
    Today, the exchange of money and payment transactions in digital format take place
    precisely by virtue of this institutional role that banks play, so when we exchange
    a banknote, we trust its intrinsic value. However, if we were able to exchange
    money thanks to a decentralized and secure mechanism, which allows us to exchange
    a value without the need for a central guarantor, what repercussions (for better
    or for worse) could it generate?


    Similarly, imagine that every transaction that is not necessarily financial, such
    as the exchange of documents or contracts, the exchange of files, from video,
    audio or 3D models (think for example of additive manufacturing) was tracked and
    automatically verified, in the absence of intermediaries. The existing contract
    (`Smart Contract`) would take place instantly, without the risk of counterfeiting,
    complete traceability and no intermediation costs.


    These are just some practical benefits generated by `Blockchain` technology. As
    we will explain later, we can say that the `Blockchain` is the engine to implement
    the configured scenario, while the `Cryptocurrencies` are the gasoline to make
    it work.


    ## Why this book?


    As an employee first and then as a freelancer I had the opportunity to work in
    innovative international technological contexts. Managing innovation and new technologies
    represents a challenge and an opportunity for me, and the best way to face the
    challenge and to seize the opportunity offered is to learn, research and accept
    a certain level of risk. For this reason, when I started to get interested in
    the world of `Blockchain`, I was more interested in the practical implications
    in the real world rather than the speculative implications typical of `Cryptocurrencies`.


    With this book I set the ambitious goal of making clear for everyone the main
    concepts underlying the technologies and applications of the `Web3` such as `Blockchain`,
    `Cryptocurrencies`, `NFTs` and the `Metaverse` known in a simple and effective
    way to the widest possible audience to ensure that more and more people are able
    to seize the opportunities and reduce the associated risks.


    Specifically, the book is aimed at:


    1. All the people curious to know what new frontiers the web is undertaking and
    what risks and opportunities can derive from it;

    2. Free investors who would like to know what `cryptocurrencies` and `NFTs` are,
    what technology they are based on and what practical implications they can have,
    before investing time and money in exchanges;

    3. Curious professionals who want to know more about the potential applications
    of the `Blockchain` in order to gain a competitive advantage for their company;

    4. Professionals who are approaching new technologies with the aim of creating
    their own business linked to them.


    At the end of the book there are the definitions of some terms specific to the
    world of the `Web3` that are not common for non-experts. It is therefore considered
    useful to provide the reader with this Glossary to allow them to approach the
    subject with greater ease.


    To conclude, a necessary note: in this book some references will be made to financial
    instruments that are based on the technologies described. Although certainly useful
    information is provided to future investors, in no way is it intended to direct
    the reader towards one investment rather than another. Instead, the aim is to
    list a series of concepts that can help the potential investor decide whether
    or not to invest in these new technological assets, and if so, help him define
    the asset most in line with his financial strategy.


    # 1 What is the Blockchain?


    ### Chapter Summary

    In this chapter we will try to answer the following question as simply as possible:
    what is the `Blockchain`? We will do this with the help of some historical notes
    on the origin of this technology, referring to the solution offered in relation
    to the problem of the centralization of information and security of the exchange
    of valuable assets, thanks to the use of cryptography.


    **Keywords**: `Blockchain`, `cryptocurrency`, `Bitcoin`, `Blockchain trilemma`,
    `David Chaum`, `Satoshi Nakamoto`


    ## 1.1 Introduction

    The `Blockchain`, as the name implies, is a "chain of blocks" where each block
    contains a series of information. A large database, which is decentralized (more
    precisely, distributed). What is the purpose of creating a series of blocks containing
    data?


    Each new technology has the goal of solving a problem, or solving it in a better
    way than an existing solution. What is the problem that the `blockchain` tries
    to solve? To answer this question, let''s take a few steps back.


    The first to propose a protocol based on such a system was `David Chaum`, an American
    computer scientist and cryptographer. The practical implication of `Chaum`''s
    work was to create a digital `Cryptocurrency`, independent of banks and usable
    in an untraceable way. To develop a system of this type, it was therefore necessary
    to avoid the centralization of information typical of the traditional banking
    system, creating a decentralized system in which the information was accessible
    to all and at the same time not modifiable.


    ### 1.2 A practical example

    **How to design a system in which the exchange of information is traceable, immutable
    and independent, without the need for a third-party guarantor?**


    In a system such as the one that has evolved into the current `Bitcoin` technology,
    for example, each block is uniquely linked to the previous and next block by means
    of a code. This means that to change the information within a block, all subsequent
    blocks must also be changed. However, this operation is by no means simple, as:


    1. changing the code of a block requires some effort

    2. the code change must be approved by the users who are part of the network


    These two points give us the opportunity to deep dive some specific concepts of
    the `Blockchain`.


    ### 1.3 History of Blockchain

    We said that modifying a code requires some effort. As we will see in the next
    chapter, this commitment in most cases occurs in the form of power consumption
    used to "find" the code of the block.


    ### 1.4 The Blockchain Trilemma

