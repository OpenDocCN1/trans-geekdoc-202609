- raw: 'The DeFi economy is currently worth around $ 100 billion. In this regard Nasdaq
    has decided to create an index (DEFX) to keep track of the major DeFi products.
    At the moment there are about 200 DeFi projects and 90% exploit the Ethereum network.
    As described in Chapter 4, banking related Cryptocurrencies are quite popular
    as the associated benefits are very significant. For example, an international
    transaction can take up to 4 business days and can cost up to 2-5% plus additional
    costs. Ripple can dramatically reduce costs. Through the Ripple network, in fact,
    banks could not only process transactions much faster, but they would also cost
    much less, without considering the reduction in staff required to process transactions.
    Another system provided by Ripple is xCurrent, which is already being tested by
    Santander, UBS, American Express, UniCredit, BBVA and many others. xCurrent is
    an application that allows end-to-end transactions in seconds, thanks to which
    Ripple estimates it can save up to 33% of costs. It is evident that thanks to
    decentralized finance the old banking system could be revolutionized, even if
    not completely replaced: in fact, many banks are still rather skeptical due to
    the use of these IT tools mainly due to their volatility and instability, which
    do not allow them to still be used by the masses instead of fiat money.


    At the time of writing, there are 509 tokens created for DeFi applications. Below
    we list for information the top 5 Cryptocurrencies in terms of market capitalization
    according to CMP:


    **1.  Terra[**\[76\]**](#part0000_split_077.html#_ftn76)**


    **2.  Avalanche[**\[77\]**](#part0000_split_077.html#_ftn77)**


    **3.  Wrapped Bitcoin[**\[78\]**](#part0000_split_077.html#_ftn78)**


    **4.  Uniswap[**\[79\]**](#part0000_split_077.html#_ftn79)**


    **5.  Chainlink[**\[80\]**](#part0000_split_077.html#_ftn80)**


    ## 6.3 Automobile Industry


    One of the biggest industries interested in using Blockchain and Smart Contracts
    is the automotive industry. It is not surprising that almost all major car manufacturers
    such as VW (IOTA), BMW (VeChain), Daimler and others are already working with
    Cryptocurrencies.


    In 2017 on average almost every second a car was rented: so, let''s imagine the
    amount of contracts in place. If such contracts were to take place on a Blockchain
    such as Ethereum, greater control over payments could be achieved and at the same
    time reduced personnel costs, which would no longer be necessary. But this is
    only a small part of what could happen. Volkswagen is one of IOTA''s partners
    and together they aim to revolutionize the car payment system. Let''s imagine
    the scenario of having a self-driving car capable of carrying out microtransactions
    every time it parks, crosses a motorway tollbooth, recharges, without the need
    to take any action. For example, if you park, the car pays exactly for the seconds
    it remains parked at that point, or if you enter a toll road, only the mileage
    traveled is charged with precision, and so on. This could be because cryptocurrencies
    such as IOTA are designed to carry out microtransactions in the absence of fees.


    A startup called CarVertical, for example, seeks to revolutionize the used car
    market. The idea is to save every vehicle on the Blockchain and keep the Blockchain
    updated on engine conditions, mileage, accidents and so on to prevent criminal
    manipulation on used cars. This technology could have a huge influence on the
    industry as a whole, as there are further possibilities for adaptability with
    regards to new cars.


    ## 6.4 Supply chain


    Within a globalized system in which we operate, the supply chain represents one
    of the most important aspects for companies. Modern supply chain networks are
    very complex as they often require several independent systems in many countries:
    goods enter different tariff zones before reaching retail distribution, ready
    to be sold. Due to this complexity, it becomes difficult to keep track of all
    movements and contact points. A solution to this complexity could be a decentralized
    network that synchronizes all data at the same time. Locations could easily access
    all supply chain data, and payments could be made automatically. The currencies
    that are exploring these opportunities are **Origintrail[**\[81\]**](#part0000_split_077.html#_ftn81)**,
    **Vechain[**\[82\]**](#part0000_split_077.html#_ftn82)** or **Wabi[**\[83\]**](#part0000_split_077.html#_ftn83)**.


     Another benefit of the Blockchain is to improve the registration of goods, therefore
    their traceability. Today it is imperative for many people to know where the food
    or clothes purchased comes from, which thanks to the Blockchain could take place
    with a high degree of security (therefore also anti-counterfeiting) at minimal
    costs. For example, imagine the market for MADE IN ITALY products: which of these
    are actually 100% produced in Italy? You can answer this question by checking
    the Blockchain. In this sector **TE-Food**[\[84\]](#part0000_split_077.html#_ftn84)
    is working on food solutions, i.e., a "farm to table traceability solution".


    We can conclude that the Blockchain has a significant number of applications within
    the supply chain of companies and could become a real turning point: it remains
    to be seen to what extent it will affect the economy we know.


    ## 6.5 Commercial aviation


    The benefits of Blockchain in commercial aviation are described in the Whitepaper
    "Blockchain in Aviation"[\[85\]](#part0000_split_077.html#_ftn85) published in
    2018 by the International Air Transport Association (IATA). Briefly, the benefits
    can be summarized in the following points:


    ·    **Frequent Flyer points collection campaigns:** the Blockchain has the ability
    to significantly simplify the accounting of frequent flyer points by tokenizing
    these resources so that they become digital and pervasive


    ·    **Management of baggage, cargo and spare parts:** the Blockchain facilitates
    the monitoring of the status and location of goods such as baggage, cargo and
    spare parts for airplanes in a very reliable and immutable way. This offers the
    opportunity to improve visibility and transparency as these types of items move
    along the value chain


    ·    **Distribution and Payments:** Blockchain enables airlines and travel agents
    to better collaborate when delivering travel products and services


    ·    **Passenger and crew identity management:** Blockchain could simplify passenger
    identity management by improving the experience, protecting privacy and also allowing
    airlines and the wider value chain to do business in digital environments


    ·    **Smart contracts along the travel value chain:** Airlines and other players
    in the value chain trade products and services and put significant effort into
    contracts, contract execution, fulfillment monitoring, reconciliation, billing
    and settlement. All these efforts can be eliminated or greatly simplified by taking
    advantage of the Smart Contract concept


    ## 6.6 Healthcare


    Personal information relating to the state of health of patients is one of the
    most sensitive information in the world, consequently the demand for a more secure
    and private infrastructure is always very high. For this, the model proposed by
    the Blockchain would be ideal: information is sent to the Blockchain just like
    a transaction, anonymously, thus maintaining patient privacy. Furthermore, once
    the data is saved on the Blockchain, the information could be used for studies
    and research without violating the privacy of patients. If a patient needed to
    go to a doctor, she could only provide all of her personal information using her
    private key. The result would be that the patient has all his medical data and
    can decide who can access it. This avoids personal data breach and protects the
    data.


    In this sector there are already active Blockchain projects, such as, for example,
    **Medicalchain[**\[86\]**](#part0000_split_077.html#_ftn86)** or **Medibloc[**\[87\]**](#part0000_split_077.html#_ftn87)**.'
