  trans: '


    *   高百分比表明市场绝非稳定：该资产上的资产主要具有投机性质，这不仅不利于价格稳定，也会削弱机构投资者的意愿。

    *   百分比过低则表明市场具有过度的静态特性，因此会损害资产的未来前景。


    要理解这些高百分比反映了加密货币多大的潜力，只需想想所有所谓的“山寨币”（Shitcoins）的比例至少是 `Bitcoin` 或 `Ethereum` 的
    4 到 5 倍，在某些情况下，日交易量甚至占总市值的 70%。在这些情况下，投机成分如此强烈，以至于投资带有赌博的特征。


    此外，如果我们观察这两种资产多年来的趋势，它们确实显示出有趣的长期潜力：


    ![](img/00014.jpeg)


    图 14：`ETH` 令牌价格从 2019 年 1 月到 2021 年 12 月的趋势。来源：CoinMarketCap。


    ![](img/00015.jpeg)


    图 15：`BTC` 令牌价格从 2019 年 1 月到 2021 年 12 月的趋势。来源：CoinMarketCap。


    根据这些图表以及许多分析师的观点，可以预期上升趋势将在长期内持续。


    ### 5.4.2 通过关注前 10-15 个加密货币创建一个“不平衡”的投资组合


    通常，投资者之间最常见的建议是“多元化”。其理由是“不要把所有的钱都放在一个资产上”。由于成千上万种资产，分散投资可以帮助缓解与将一切押注在单一资产上相关的固有风险。这一概念在传统市场中是有意义的，但
    `Crypto` 市场中的一些投资者认为多元化虚虚一个神话。部分原因是由于许多主流加密货币与 `Bitcoin` 紧密相关，而且用于区分不同货币的营销手段使得很难妥善评估资产。与上市公司及其相应的股票不同，评估一个
    `Crypto` 项目的潜力是一个复杂得的过程，需要更多的技术技能。


    因此，我们推荐的第二种策略是创建一个 `Crypto Wallet`，除了 `Bitcoin` 和 `Ether` 之外，还包含其他 `Altcoins`，但倾向于后者。为什么要“不平衡”？专家建议在你的
    `Wallet` 中选择一些加密货币（1-3 个），并列一份中高风险 `Tokens` 列表。该列表还应包含几种 `Stablecoins`，即由“稳定”资产支撑的加密货币。这种策略考虑了
    `Coins` 往往如何与 `Bitcoin` 的波动相关。然而，不受流行的 `Coins` 无论 `Bitcoin` 的表现如何，都可能增长得多，尽管它们带有大得投资风险。


    ### 5.4.3 通过基本面分析押注低知名但高潜力的 Altcoins


    我们想要提到的第三也是最后一种策略（但特别建议那些第一次接触加密货币世界的人不要这样做）是：全仓投入那些价值仍然较低但潜力巨大的 `Altcoins`。如何截获它们呢？如果这个问题有简单的答案，那么每个人都会这样做。无论如何，最重要的是研究项目的基本面，并感知其长期的重要性。然而，正如前面提到的（尽管我们不会厌烦地重复这一点），市场的波动性代表了真实的风险，因此不建议这样做。


    ### 5.4.4 使用技术分析进行交易


    如果投资者决定投机加密货币特有的这种波动性，那将特别有趣。在实践中，`technical analysis` 是对随时间价格的研究，以便预测未来的趋势。我们不会深入探讨这类分析的细节，因为它超出了本书的范围。


