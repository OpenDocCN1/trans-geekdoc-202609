    \n# About the author\n\nMy name is [Nicola Accialini](https://www.linkedin.com/in/nicolaaccialini/)\
    \ and I am a freelance consultant. After graduating from the University of Padua,\
    \ I worked for some of the main companies in innovative and international environments.\
    \ Since June 2019 I have been dealing with digital transformation and technology\
    \ management, helping companies to find and implement innovative solutions and\
    \ strategies in various fields, from product development, to production, passing\
    \ from supply chain management. In this context, the Web3 undoubtedly represents\
    \ an opportunity that companies, professionals and investors must not let go to\
    \ keep up with the present and future trains.\n\nFor more information: [www.accialiniconsulting.com](http://www.accialiniconsulting.com)\
    \ \n\n# Introduction\n\nIt was the 2010 when Laszlo Hanyecz bought two pizzas\
    \ for 30 dollars in a small town in Florida for 10,000 Bitcoins. Today, almost\
    \ 12 years later, those two pizzas are yielding to the lucky pizzeria (which hopefully\
    \ has in the meantime saved the Bitcoins) an equivalent value of about 400 million\
    \ dollars. On the other hand, the US dollar suffered a devaluation of about 27%\
    \ at the same time. This simple fact is enough to understand that we are facing\
    \ a disruptive change: we have reached a point where new technological solutions\
    \ promise such changes that they can even reformulate a new social architecture\
    \ on the basis of a new decentralized protocol: the Blockchain.\n\nWe are probably\
    \ facing something similar to what happened during the second industrial revolution,\
    \ when the masses moved from the countryside to the cities to work in factories\
    \ and centralizing capital in the hands of businessmen. Centuries have passed\
    \ since then, but the paradigm has not changed. In fact, inequality has even increased.\
    \ In his book \"Invertire la rotta: disuguaglianza e crescita economica\" (Italian\
    \ Edition)[\\[1\\]](#part0000_split_077.html#_ftn1), Joseph Stiglitz, former Nobel\
    \ laureate in Economics in 2001, reports some data: between 1980 and 2014 the\
    \ real average income of the richest 1% of the population of the United States\
    \ increased by 169% and its share of national income is more than doubled (from\
    \ 10 to 21%). At 0.1% of the super-rich, it fared even better, with real income\
    \ increasing by 281%. However, the average family income only grew by 11%, but\
    \ only in the very first years: in 2014 it was just 0.7% higher than in 1989.\
    \ In addition, the average hourly wage, adjusted for inflation, has increased\
    \ by only 9%, despite the fact that productivity increased by 72.2% in the same\
    \ period."
