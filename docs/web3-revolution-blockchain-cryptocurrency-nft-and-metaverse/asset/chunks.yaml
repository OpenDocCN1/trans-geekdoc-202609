    ![](img/00004.jpeg)


    图 4：比特币区块链区块组成元素的图化表示


    平均而言，每十分钟会创建一个比特币区块，而在以太坊上，每 17 秒产生一个区块。


    总结来说：每个区块包含自己的哈希值（hash）以及上一个区块的哈希值。主链的所有区块都经过了编号，从 0 开始，然后是 1, 2, 3, 4, 5 等。以一个由
    3 个区块组成的区块链为例， 2 号区块将指向 1 号区块，而 1 号区块将指向 0 号区块。0 号区块与之前的区块不同：它不能指向任何之前的区块，事实上，它在术语中被称为“创世区块”（genesis
    block）。如果由于某种原因，1 号区块被黑客篡改，该区块的哈希值将自动改变。结果是，2 号区块不再有效，因为它不再包含上一个区块的哈希值，从而实际上损害了所有后续区块的有效性。


    ![](img/00005.jpeg)


    图 5：连接到比特币区块链的 3 个区块的图化表示


    然而，仅有哈希系统是不够的。事实上，现代计算机拥有强大的计算能力，即使是很长的链也可以在短时间内重新计算。因此，引入了“共识算法”的概念，我们稍后会解释。所以，让我们一步步来，更详细地看看哈希和加密的概念。


    ## 2.4 哈希与密码学


    Keizer Söze 在他的《理解区块链技术、比特币创造和货币未来的终极指南》（Ultimate Step by Step Guide to Understanding
    Blockchain Technology, Bitcoin Creation, and the future of Money）书中清晰地描述了什么是哈希函数以及它是工作的。


    哈希基本上是基于系列算法生成的固定长度数字字符串。哈希函数允许将任何文本字符串（无论长度如何）还原为具有精确特征的新字符串，其中包含预定义的字符数量。


    其中一种算法是所谓的消息摘要算法 5，或 MD5（其中 `5` 是版本号）。例如，尝试输入单词 "blockchain"。生成的 `md5` 哈希值将是：


    ```

    5510a843bc1b7acb9507a5f71de51b98

    ```


    如果我们尝试对单词 "blockchain1" 执行相同的 `md5` 哈希，结果将完全不同：


    ```

    1150228f14788047028d774b7c83c5a6

    ```


    现在让我们尝试一个数字，为了简单起见，我们使用极少数数字。尝试对数字字符串 `123` 进行 `md5` 哈希处理，然后是 `124`，看看是否有任何差异。对于字符串
    `123`，哈希值 `md5` 如下：


    ```

    202cb962ac59075b964b07152d234b70

    ```


    而字符串 `124` 则是：


    ```

    C8ffe9a587b126f152ed3d89a146b445

    ```


    正如我们所看到的，这是一个完全不同的结果。`md5` 算法诞生于 1992 年，但由于其漏洞，它已被多次破解。


    有多种哈希算法：2001 年，由国家安全局（NSA）设计的 `SHA-2` 算法（安全哈希算法 2）发布。`SHA-2` 系列由六个哈希函数组成，其哈希（或摘要）值分别为
    224、256、384 或 512 位，即 `SHA-224`、`SHA-256`、`SHA-384`、`SHA-512`。特别是 `SHA-256` 是比特币使用的哈希算法。2012
    年，发布了 `scrypt` 算法，专门用于执行需要大量内存的大规模自定义硬件攻击。该算法后来被 Litecoin 和 Dogecoin 等加密货币用于工作量证明机制。


    我们可以通过以下基本点总结哈希算法的通用特征：


    -   **一致性 (constancy)**：相同的输出始终且不可避免地对应于每个输入；

    -   **不可逆性 (irreversibility)**：虽然通过已知生成输出的原始输入总是可以复制输出，但无法反向操作，因此无法从字母数字字符串回溯到生成它的输入初始内容；

    -   **确定性 (determinism)**：无论输入多长，哈希函数始终会返回给定字符数量的字母数字字符串；例如，如果我拿出《神曲》并对其进行哈希处理，结果将始终是一个
    32、64（等）字符的字符串（输出长度取决于所使用的哈希函数）；

    -   **雪崩效应 (avalanche effect)**：无论输入多长，输入的微小变化都足以生成一个完全不同的输出。


    最后，必须强调，哈希被用作识别机制，而不是机密性机制（后者使用更复杂的过程）。然而，哈希函数在密码学本身也起着至关重要的作用：它们对于验证消息的完整性非常有效，因为执行过程会修改文本。


    ### 2.4.1 密码学


    密码学是区块链技术的基础之一。在解释密码学如何在区块链中使用之前，我们需要进行简要插插并提供一些理论概念。加密是将数据转换为不可读形式的过程，通常称为加密。为了确保未经授权的人无法访问，使用了公钥和私钥：


    -   **私钥 (private key)**：只有生成者知道的随机生成的秘密数字。密钥类似于我们登录不同网页时使用的 PIN 码或密码，但在这种情况下它是加密的，这增加了许多安全性。在比特币中，私钥是访问区块链资金的
    256 位（32 字节）无符号整数。在实践中，私钥如下：


    images/00006.jpeg)


    图 6：私钥示例


    -   **公钥 (public key)**：相反，是一个对应私钥的数字，但不需要秘密。公钥可以从私钥计算出来，反之则不然。也就是说，无法从公钥获取私钥。公钥经过后续更改后是可以共享给社区所有成员的地址，以便他们向我们发送资金，或者我们在需要时向社区其他用户进行支付。这里没有被盗的风险，因为资金只能通过私钥访问。


    现在让我们增加另一条信息。加密和解密数据有两种类型的密钥：


    -   **对称密钥 (symmetric key)**：加密和解密过程使用相同的密钥。我们可以将对称密钥想象成打开家门的钥匙：当我们出门或进入时，实际上我们使用的是同一把钥匙。对称密钥算法比非对称密钥快数倍，但这里的问题是发送者和接收方必须使用相同的密钥进行加密和解密。当然，在安全性方面这不是优势，而且区块链绝不使用对称密钥算法。


    '
