- raw: 'The Web3 aims to solve content ownership and provide portability of digital
    assets by tokenizing them, paving the way for the exchange of this value with
    other fungible assets, thus allowing creators to monetize their work effort. These
    working efforts may include mining and creating content, such as art, music, and
    other forms of non-fungible tokens, which are at stake in an ecosystem. Likewise,
    DAOs represent the emerging trend that is driving a profound and lasting transformation
    of the workplace that combines cultural, digital and philosophical belief systems.


    In a future where increasingly dynamic, borderless and hierarchical organizations
    can undertake much of value creation, a service delivery is more conceivable with
    interconnected value networks, exchanges and bridges that provide connectivity
    between these ecosystems. These decentralized exchanges or asset bridges not only
    provide a way to trade various asset classes, but also facilitate the global movement
    of assets, thus creating truly global economies that attract digital natives and
    a talent pool.


    As pointed out by Zuckerberg, the way of connecting people has evolved over the
    last 15 years from sharing messages to mass sharing first of images and then of
    videos. The next step will be sharing a common immersive experience. In the same
    way, in the business world we are moving more and more from communication via
    email (text), to the increasingly widespread use of file-sharing and videoconferencing
    platforms and the natural next step will be the sharing of virtual spaces where
    to carry out our meetings (spaces which, as we have seen, already exist).


    ![Figure 32: example of Metaverse according to Meta Platforms ](images/00032.gif)![](images/00033.jpeg) 


    Scenarios of this type will also be increasingly common in the industrial world.
    Let''s imagine, for example, a production plant. This is probably one of the most
    difficult sectors to "virtualize", as the physical presence of the operators is
    still essential to manage the production flow and solve everyday problems. However,
    even in this sector the use of mostly digital technologies is spreading, known
    as Industry 4.0. Already in some factories the human-machine interface is managed
    through augmented reality, while the simulation of new plants can be validated
    using immersive technologies such as virtual reality. But there is more. Digital
    twins, in fact, represent the bridge between the physical world and the real world,
    in which a virtual replica behaves exactly, and in real time, like the real production
    system, thanks to the connection technologies of machinery and systems. In such
    a scenario, while the information will travel on the web in a secure form for
    companies thanks to the Blockchain, the semi-finished products will move between
    the lines and the warehouses thanks to robots and AGVs. Consequently, the factory
    could be managed through a Metaverse, in which the operator interacts through
    an avatar.


    A similar scenario could take place, for example, in the retail sector. Let''s
    imagine we want to try on an accessory (a dress, a ring, a pair of shoes, to which
    NFT tokens are associated) in a Metaverse in which avatars and objects are a faithful,
    but virtual copy. We imagine that, in addition to the Oculus-style viewer, the
    sensory experience is guaranteed through the use of special clothes equipped with
    sensors that make us perceive exactly the experience of wearing the dress, to
    understand if the size tested is the right one. We could try accessories directly
    from home with a completely reliable experience, with no significant differences
    from the "real" reality.


    We leave the reader to think about the countless scenarios that can arise and
    develop on the basis of these technologies.


    It is difficult to predict what will happen and which directions we will take.
    What is certain is that we will see radical changes in the years to come that
    will also bring with them some great risks that must be managed, and at the same
    time great opportunities that must be grasped.


    # Glossary


    This section contains the definitions of some terms specific to the world of the
    Web3. It is therefore considered useful to provide the reader with this Glossary
    to allow them to approach the subject with greater ease.


    **Algorithm**: strategy used to solve a problem and consists of a finite sequence
    of operations (also called instructions). An algorithm must be finite (consisting
    of a finite number of instructions), deterministic (starting from the same input
    data, the same output results are obtained), unambiguous (all must interpret the
    operations in the same way) and general (solution must be the same for all problems
    of the same class). The Blockchain, for example, is essentially based on cryptographic
    algorithms.


    **Altcoin**: any type of cryptocurrency other than Bitcoin


    **Fundamental analysis**: in finance, fundamental analysis evaluates the capital
    strength and profitability of a company, determining the intrinsic value (or fair
    value) of the company. It is often applied to companies listed on the stock exchange
    or in the process of listing, to underestimate the convenience or otherwise of
    a given investment. Fundamental analysis studies all the micro and macroeconomic
    events that have some impact on the society under consideration. It is therefore
    necessary to be able to have an overview of the markets, the sector in which the
    company operates, its business plan and its management, but above all it is necessary
    to have an in-depth knowledge of its financial statements, which is the primary
    tool valuation used in fundamental analysis.


    **Technical Analysis (TA)**: in finance, technical analysis is the study of the
    price trend of financial markets over time, with the aim of predicting future
    trends, mainly using graphical and statistical methods. In a broad sense, it is
    that theory of analysis (or set of principles and tools) according to which it
    is possible to predict the future trend of the price of a listed asset (real or
    financial), by studying its past history. It is used, together with fundamental
    analysis, for the definition of financial operational decisions.


    **Bear:** A bear is an investor who believes that a particular stock, or the broader
    market, is going down and may be attempting to profit from a decline in stock
    prices. Bears are typically pessimistic about the state of a particular underlying
    market or economy.


    **Bitcoin**: first Cryptocurrency, created in 2009 by Satoshi Nakamoto.


    **Bitcoin Maximalist**: Bitcoin maximalists believe that Bitcoin, which is the
    most popular Cryptocurrency in the world, is the only digital asset that will
    be needed in the future. Maximalists believe that all other digital currencies
    are inferior to Bitcoin.


    **Block**: basic element of a Blockchain chain. Each block consists of three main
    elements: the data, the hash that identifies the block and the hash of the previous
    block.


    **Blockchain**: a distributed database shared between the nodes of a computer
    network. As a database, a Blockchain stores information in digital format. The
    main features of a Blockchain are security, decentralization and scalability (see
    Blockchain trilemma).


    **Bull**: a bull is an investor who thinks that the market, a specific stock or
    an industry is ready to grow. Investors taking a bullish approach buy stocks on
    the assumption that they can sell them later at a higher price.


    **Bull run**: it means that there is an upward trend in the Cryptocurrency market
    (or shares or precious metals) for a prolonged period of time, which can also
    be defined as (bull market) or bull market.


    **CFD**: a Contract For Difference (CFD) is a financial instrument, essentially
    a contract between two parties, typically described as "buyer" and "seller", which
    stipulates that the buyer will pay the seller the difference between the current
    value of an asset and the its value at the time of the contract.


    **Coin:** see Cryptocurrency.'
