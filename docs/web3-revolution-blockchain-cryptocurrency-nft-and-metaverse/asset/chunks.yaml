    ### Chapter summary

    In this chapter, the main exchange platforms for buying and storing Cryptocurrencies
    will be presented. In addition, reference will be made to other financial instruments
    such as `CFD`, `ETF` and `ETN` that can be used thanks to `Broker`.


    **Keywords**: `Exchange`, `Broker`, `CFD`, `ETF`, `ETN`, `Wallet`


    Cryptocurrencies can take on an intrinsically different value depending on the
    use and the strategies pursued:


    1. They are essentially utility tokens that acquire value thanks to the potential
    benefits within social and business context (for example, through `Smart Contracts`
    or `NFTs`, which we will already discuss in the next chapter)

    2. They are a currency of exchange, like fiat currencies

    3. They are a store of value, on a par with the traditional reserve of gold

    4. They are a highly speculative asset in the market, due to their high volatility


    Cryptocurrencies can be purchased and exchanged through the so-called `Exchange`
    in a completely similar way (albeit with some differences, which we will see)
    to forex and stock markets. The main factors to consider when choosing the `Exchange`
    are the amount of Cryptocurrencies available and the commissions that are applied
    to transactions. This second point is very important if the intent is to trade.


    Banks are also recently entering this market, giving their customers the opportunity
    to purchase this asset through their own institutions. The reason is simple. As
    reported by Cryptonomist, "it is impossible to ignore a $ 1 trillion dollar asset,
    which is credited as a safe haven against inflation and which attracts the attention
    of the richest men in the world and institutional investors. Just as we cannot
    ignore the entire crypto sector which has reached a capitalization of 3,000 billion
    in the past months".


    Once purchased, cryptocurrencies must be stored in special `Wallets`. There are
    `Wallets` of various kinds, and even in this case, we will illustrate the various
    options available on the market.


