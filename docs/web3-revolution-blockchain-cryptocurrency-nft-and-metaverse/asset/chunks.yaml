    - 后投影投影幕，或

    - 平面显示器


    由于近距离观察，投影系统的分辨率非常高，这需要极小的像素尺寸来维持现实的幻觉。用户在 CAVE 内部佩戴 3D 眼镜查看生成的 3D 图形。使用 CAVE
    的人可以看到悬浮在空中物体，并可以在其周围行走，获得这些物体在现实中真实外视角。这是通过使用红外摄像头实现的。用户在 CAVE 中的移动由通常附在 3D 眼镜上的传感器进行跟踪，视频会不断调整以维持观察者的视角。计算机同时控制
    CAVE 的这方面和音频部分。CAVE 中通常在多个角度放置了多个扬声器，提供立体声。


    ![VR 世界中的 HMD 与 CAVE。虚拟现实是一种迷人的…… | 作者 Reghill J Manuelraj | XRPractices | Medium](img/00030.jpeg)


    图 30：CAVE 技术的图形表示


    头戴技术对普通大众更为熟悉，因为它为体验虚拟现实提供了一种更廉价的解决方案。头显包括目戴式立体显示器（为每只眼睛提供独立的图像）、立体声和头部运动检测传感器（可以包括陀螺仪、加速度计、结构光系统等）。根据其跟踪方法，头显技术可以分为两大类：


    - **3 DoF**：监控头显如何旋转，因此它知道我们正在看哪里。大多数移动 VR 平台使用 3 DoF 监控系统。惯性测量单元（`IMUs`）用于跟踪旋转。`IMUs`
    使用陀螺仪、加速度计和磁力计检测旋转。所有现代 3 DoF 跟踪都使用 `IMU`。

    - **6 DoF**：监控跟踪位置和旋转。系统知道我们正在看哪里以及我们处于什么位置。这就是高端 VR 系统（如 HTC Vive 和 Oculus Rift）让您能够在房间内移动的方式。实现
    6 DoF 监控有许多不同的方法。Oculus Rift 使用许多 LED 和外部摄像头建立模型，然后尝试用摄像机看到的 2D 模型与头显的 3D 模型进行拟合。它随后使用来自内部
    `IMU` 的信息来计算头部的位置。而 HTC Vive 则使用红外激光来测量视觉传感器垂直和水平扫描所需的时间。它利用获取的数据和内部 `IMU` 来确定头部和手的位置。


    基于 VR 头显技术的另一种分类方法是：


    - **移动 VR (Mobile VR)**：移动 VR 使用 `IMU` 跟踪，因此它只有 3 DoF 跟踪。它只能监控头部旋转，而不是位置。它还是“自由”的，这意味着没有电线连接头显和计算机。你可以在任何地方使用它。它的图形性能较弱，由电池供电。

    - **桌面 VR (Desktop VR)**：桌面 VR 技术使用 6 DoF 监控，通常是有线解决方案。设备连接到计算机，并使用计算机执行图形工作并获取电源。图形效果通常更好。大多数桌面
    VR 设备还带有手动控制器，允许更强的交互性和更沉浸的体验。


    通常，虚拟现实的开发需要编写代码、使用编辑器或将两者结合。编辑器是一种简化游戏创建的软件开发框架。编辑器通常提供 3D 渲染、物理、声音、脚本、动画、资源管理等功能。


    一些流行的编辑器有：


    - **虚幻引擎 (Unreal Engine)**

    - **Cryengine**

    - **亚马逊林场 (Amazon Lumberyard)**

    - **Unity**


    你还可以使用原生开发工具，如 `OpenGL` 和 `Microsoft DirectX`。这些选项提供了更大的灵活性，但通常需要更长的开发时间和编写更多的代码。WebVR
    也是一个有效选项。


    ### 8.4.2 增强现实


    不仅仅是虚拟现实。元宇宙包含了一种全新的体验，它可能不仅完全是虚拟的，而且是“现实”与虚拟现实的混合。这种混合之所以可能，归功于增强现实，该术语归于 1990
    年的前波音研究员 Thomas Caudell 所有。1984 年，第一副“终结者”式眼镜问世。2013 年，最流行的设备是 Google 眼镜。2015
    年，微软宣布了 HoloLens，它利用各种传感器将高分辨率全息与现实世界融合。


    #### 8.4.2.1 增强现实的工作原理


    增强现实基本上根据以下原理之一工作：


    1. **SLAM**：**同步定位与建图 (`SLAM`)** 是在未知环境中构建或更新地图的同时，同时跟踪代理在 particular 环境内位置的计算问题。已有几种已知算法被应用于自动驾驶汽车、无人机、行星探测器甚至人体。

    2. **基于识别的 (Recognition based)**：基于识别（或标记）的增强现实系统使用摄像头识别标记或物体（例如 `QR` 代码或自然特征跟踪
    (`NFT`)），只有当设备检测到标记时，才会显示信息或图像的叠加层。这项技术本质上取决于设备的摄像头将标记与现实世界或其他物体区分开。不仅可以识别标记图像，还可以计算其位置和朝向。一旦被识别，屏幕上的标记将被替换为相应对象的虚拟
    3D 版本。这样做是为了让用户能够更详细地从各个角度观察该物体。旋转标记也会导致虚拟副本旋转。

    3. **基于位置的 (Position based)**：与基于识别的系统不同，基于位置的增强现实依赖于 `GPS` 系统、数字指南针、速度传感器或加速度计来提供位置数据，而增强现实信息叠加根据这些输入被激活。它被称为无标记增强现实。智能手机的位置跟踪功能使得人们很容易利用这种增强现实技术，使其非常流行。基于位置的
    AR 的常见用途包括地图导航、搜索附近的服务以及其他以位置为中心的移动应用。


    增强现实的主要硬件组件包括：


    - 处理器

    - 显示器

    - 传感器

    - 输入设备


    '
