    - rear-projection screens, or

    - flat screen display


    Projection systems are very high resolution due to close range viewing which requires
    very small pixel sizes to maintain the illusion of reality. The user wears the
    3D glasses inside the CAVE to see the generated 3D graphics. People using CAVE
    can see objects floating in the air and can walk around them, getting a correct
    view of what they would look like in reality. This is made possible by the use
    of infrared cameras. The user''s movements in the CAVE are tracked by sensors
    typically attached to the 3D glasses and the video continuously adapts to maintain
    the viewers perspective. Computers control both this aspect of the CAVE and the
    audio aspect. There are typically multiple speakers placed at multiple angles
    in the CAVE, which provide stereo sound.


    ![HMD vs CAVE in the world of VR. Virtual reality is a fascinating… | by Reghill
    J Manuelraj | XRPractices | Medium](images/00030.jpeg)


    Figure 30: graphic representation of CAVE technology


    Headset technology is more familiar to the general public as it provides a cheaper
    solution for experiencing Virtual Reality. The headset includes an eye-mounted
    stereoscopic display (providing separate images for each eye), stereo sound, and
    head motion detection sensors (which can include gyroscopes, accelerometers, structured
    light systems, etc.). Based on their tracking method, Headset technologies can
    be divided into 2 main categories:


    - **3 DoF**: monitoring tracks how the headset is rotated, so it will know where
    we are looking. Most mobile VR platforms use the 3 DoF monitoring system. Inertial
    Measurement Units (`IMUs`) are used to track rotation. `IMUs` use a gyroscope,
    accelerometer, and magnetometer to detect rotations. All modern 3 DoF tracking
    uses an `IMU`.

    - **6 DoF**: monitoring keeps track of position and rotation. The system knows
    where we are looking and where we are positioned. This is how high-end VR systems,
    like HTC Vive and Oculus Rift, let you move around the room. There are many different
    ways to do 6 DoF monitoring. The Oculus Rift uses a number of LEDs and external
    cameras that build a model and then try to fit a 3D model of the headset with
    the 2D model it sees of the camera. It then uses information from an internal
    `IMU` to calculate the position of the head. The HTC Vive instead uses infrared
    lasers to measure the time it takes to sweep a visual sensor vertically and horizontally.
    It uses the data it gets and an internal `IMU` to determine where the head and
    hands are.


    Another classification of VR Headset-based technologies is:


    - **Mobile VR**: Mobile VR uses `IMU` tracking, so it only has 3 DoF tracking.
    It can only monitor the rotation of the head, not the position. It is also "free"
    which means there are no wires connecting the headset to a computer. You can use
    it anywhere. It has less powerful graphics and is powered by a battery.

    - **Desktop VR**: VR Desktop technology uses 6 DoF monitoring and is typically
    a wired solution. The device is connected to a computer and uses the computer
    to perform graphic work and to obtain its power. Graphics are generally better.
    Most desktop VR devices also come with manual controllers that allow for greater
    interactivity and a more immersive experience.


    Generally, development for Virtual Reality requires writing code, using an editor,
    or a combination of both. An editor is a software development framework that simplifies
    game creation. Editors typically provide 3D rendering, physics, sound, scripting,
    animation, resource management, and more.


    Some popular editors are:


    - **Unreal Engine**

    - **Cryengine**

    - **Amazon Lumberyard**

    - **Unity**


    You can also use native development tools such as `OpenGL` and `Microsoft DirectX`.
    These options offer more flexibility, but typically take much longer to develop
    and write more code. WebVR is also a valid option.


    ### 8.4.2 Augmented Reality


    Not just Virtual Reality. The Metaverse consists of a new sensory experience that
    may not only be completely virtual, but a mix of "real" reality and virtual reality.
    This mix is possible thanks to Augmented Reality, whose authorship of the term
    is attributed in 1990 to Thomas Caudell, a former Boeing researcher. In 1984,
    the first "Terminator" glasses appeared. In 2013, the most popular devices are
    Google Glasses. In 2015, Microsoft announced the HoloLens, which uses various
    sensors to blend high-definition holograms with the real world.


    #### 8.4.2.1 How Augmented Reality works


    Augmented Reality basically works according to one of the following:


    1. **SLAM**: **Simultaneous Localization and Mapping (`SLAM`)** is the computational
    problem of building or updating a map of an unknown environment while keeping
    track of the position of an agent within it. There are several known algorithms
    to solve this employed for self-driving cars, unmanned aerial vehicles, planetary
    rovers, and even the human body.

    2. **Recognition based**: systems based on recognition (or markers) using Augmented
    Reality use a camera to identify markers or objects, such as a `QR` code or natural
    feature tracking (`NFT`), to display an overlay of information or images only
    when the marker is detected by the device. This technology essentially depends
    on the device''s camera to distinguish a marker from other real-world objects.
    It is not only possible to identify the marker image, but also to calculate its
    position and orientation. Once recognized, the on-screen marker is replaced with
    a virtual 3D version of the corresponding object. This is done to allow the user
    to observe the object in more detail and from various angles. Rotating the marker
    also rotates the virtual replica.

    3. **Position based**: Unlike recognition-based systems, location-based augmented
    reality relies on `GPS` systems, digital compasses, speed sensors or accelerometers
    to provide location data, while augmented reality information overlay is activated
    based on these inputs. It is also known as markerless augmented reality. The location
    tracking capabilities in smartphones make it easy to take advantage of this type
    of augmented reality technology, making it quite popular. Some common uses of
    location-based AR include mapping directions, searching for nearby services, and
    other location-centric mobile apps.


    The main hardware components for augmented reality are:


    - A processor

    - A display

    - Sensors

    - Input devices

