- raw: "Due to its pioneering nature, BTC remains at the top of this market after\
    \ more than a decade of existence. Even after Bitcoin lost its undisputed dominance,\
    \ it remains the largest cryptocurrency, with a market cap that passed the $ 1\
    \ trillion mark in 2021.\n\n### 4.6.2 Ethereum[**\\[43\\]**](#part0000_split_077.html#_ftn43)\n\
    \nThe first alternative to Bitcoin in terms of market capitalization is Ethereum,\
    \ a decentralized platform that allows you to create and run smart contracts and\
    \ decentralized applications (dApps) without downtime, fraud, control or interference\
    \ from third parties. The goal behind Ethereum is to create a decentralized suite\
    \ of financial products that anyone in the world can access freely. Its Ether\
    \ Token is used as a vehicle to move around the platform and is mainly sought\
    \ after by developers who wish to develop and run applications within Ethereum,\
    \ or by investors who wish to make purchases of other digital currencies using\
    \ Ether. Ethereum launched a presale for Ether in 2014, receiving overwhelming\
    \ response and helping usher in the era of the Initial Coin Offering (ICO).\n\n\
    According to Ethereum, the platform can be used to *\"code, decentralize, secure\
    \ and trade just about anything\".*\n\nEthereum plans to move its consensus algorithm\
    \ from Proof-of-Work (PoW) to Proof-of-Stake (PoS) by mid-2022, an update expected\
    \ as Ethereum 2.0. This move is intended to allow the Ethereum network to function\
    \ autonomously with much less power and better transaction speed.\n\n### 4.6.3\
    \ Binance Coin[**\\[44\\]**](#part0000_split_077.html#_ftn44)\n\nBinance Coin\
    \ operates as a payment method for fees associated with trading on the Binance\
    \ Exchange and is currently the third largest Cryptocurrency by market capitalization.\
    \ Those who use the Token as a means of payment for the exchange can also negotiate\
    \ at a discount.\n\nThe Binance Exchange was founded by Chinese Changpeng Zhao\
    \ and is one of the most used exchanges in the world based on trading volumes.\
    \ One of Binance's biggest competitive advantages is its drive to develop services.\
    \ In fact, while the company only started out as a Crypto exchange in 2017, today\
    \ Binance has rolled out its services in numerous different spheres. According\
    \ to the company's website, its mission is to become the infrastructure service\
    \ provider for the entire Blockchain ecosystem. Since the launch of Binance Coin,\
    \ the Exchange has also benefited from increased investor interest in the token.\
    \ BNB experienced a significant price hike in early 2021, which put it on the\
    \ corporate investor map.\n\n### 4.6.4 Tether[**\\[45\\]**](#part0000_split_077.html#_ftn45)\n\
    \nTether was one of the earliest and most popular of a group of so-called Stablecoins,\
    \ or Cryptocurrencies that aim to anchor their market value to a currency or other\
    \ external benchmark to reduce volatility. As most digital currencies, even major\
    \ ones like Bitcoin, have experienced frequent periods of extreme volatility,\
    \ Tether and other Stablecoins attempt to smooth out price fluctuations to attract\
    \ users who might otherwise be cautious. By virtue of this, the price of Tether\
    \ is directly linked to the price of the US dollar. The system allows users to\
    \ more easily make transfers from other cryptocurrencies to US dollars in a more\
    \ timely manner than actually converting to regular currency. Launched in 2014,\
    \ Tether describes itself as *\"a blockchain-enabled platform designed to facilitate\
    \ the use of fiat currencies digitally.\"* Indeed, this Token allows people to\
    \ use a Blockchain network and related technologies to transact in traditional\
    \ currencies while minimizing the volatility and complexity often associated with\
    \ cryptocurrencies.\n\n### 4.6.5 Solana[**\\[46\\]**](#part0000_split_077.html#_ftn46)\n\
    \nSolana is designed to host decentralized and scalable applications. Founded\
    \ in 2017, Solana is an open-source project currently run by the Geneva-based\
    \ Solana Foundation, while the Blockchain was built by San Francisco-based Solana\
    \ Labs. Solana is much faster in terms of the number of transactions it can process\
    \ and has significantly lower transaction fees than rival Blockchains like Ethereum.\n\
    \nThe protocol is designed to facilitate the creation of decentralized apps (DApps)\
    \ and aims to improve scalability by introducing a Proof-of-History (PoH) consensus\
    \ developed by Anatoly Yakovenko, combined with the underlying Proof-of-Stake\
    \ (PoS) consensus of the Blockchain. In fact, Solana's hybrid protocol allows\
    \ significantly reduced validation times for both the transaction and the execution\
    \ of the smart contract. \n\n### 4.6.6 Cardano[**\\[47\\]**](#part0000_split_077.html#_ftn47)\n\
    \nCardano has been created with a scientific approach based on the research of\
    \ teams of engineers, mathematicians and cryptographic experts. The project was\
    \ co-founded by Charles Hoskinson, one of the initial five founding members of\
    \ Ethereum, following some disagreements with the other co-founders. Cardano's\
    \ team created its Blockchain through extensive peer-reviewed experimentation\
    \ and research. In fact, the researchers of the project have written over 90 articles\
    \ on Blockchain technology on a wide range of topics and such research forms the\
    \ backbone of Cardano today, which means that all of its innovative principles\
    \ can be questioned by the network of researchers. before being validated. According\
    \ to Cardano's team, this academic rigor helps the Blockchain to be durable and\
    \ stable, increasing the chances that potential pitfalls can be anticipated. For\
    \ this reason, Cardano seems to distinguish itself from other large cryptocurrencies,\
    \ so much so that it even earned the nickname of \"Ethereum killer\". Cardano\
    \ is one of the largest Blockchains to successfully use a PoS consensus mechanism.\n\
    \n### 4.6.7 USD Coin[**\\[48\\]**](#part0000_split_077.html#_ftn48)\n\nUSD Coin\
    \ (USDC) is a digital Stablecoin pegged to the US dollar and runs on the Ethereum,\
    \ Stellar, Algorand, Solana, Tron and Hedera Hashgraph systems. USD Coin is managed\
    \ by a consortium called Center and includes members of the Cryptocurrency Exchange\
    \ Coinbase and the Bitcoin company Bitmain. The USDC is issued by a private entity\
    \ and should not be confused with a central bank digital currency (CBDC). The\
    \ USDC was first announced on May 15, 2018 by Circle and launched in September\
    \ 2018.\n\n### 4.6.8 Ripple[**\\[49\\]**](#part0000_split_077.html#_ftn49)\n\n\
    Ripple is a technology that serves as both a Cryptocurrency and a digital payment\
    \ network for financial transactions. It was first released in 2012 and was co-founded\
    \ by Chris Larsen and Jed McCaleb. Ripple's core process is a payment settlement\
    \ asset exchange and remittance system, similar to the SWIFT system for international\
    \ money and securities transfers, which is used by banks and financial intermediaries\
    \ operating in different currencies. The Token used for the Cryptocurrency uses\
    \ the XRP symbol.\n\n### 4.6.9 Terra[**\\[50\\]**](#part0000_split_077.html#_ftn50) \n\
    \nTerra is an open-source payment platform for Stablecoin. The Terra Blockchain\
    \ allows users to spend, save or trade Stablecoin Terra instantly. Founded in\
    \ 2018, Terra was launched with a $ 32 million backing from Binance and Polychain\
    \ Capital, among others. Each Stablecoin Terra (such as TerraUSD), relies on the\
    \ system's LUNA token to maintain its anchor. In January 2021, Terra raised $\
    \ 25 million in a funding round from Galaxy Digital, Coinbase Ventures, Pantera\
    \ Capital, and others. Previous investors Hashed, Arrington XRP and Kenetic Capital\
    \ also participated in the round. \n\n### 4.6.10 Polkadot[**\\[51\\]**](#part0000_split_077.html#_ftn51)"
