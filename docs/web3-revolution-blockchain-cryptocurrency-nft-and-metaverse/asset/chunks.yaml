- raw: "Finally, even the world of social media will not be free from revolutions\
    \ due to the Blockchain. One of the problems within the social network is the\
    \ management of content and advertising. To date, for example, it is the algorithms\
    \ within the various social platforms such as Facebook or LinkedIn that decide\
    \ which content is most suitable for us, often regardless of the quality of the\
    \ same. And what if the contents were evaluated directly by users, based on specific\
    \ criteria, in exchange for a system of rewards? It is moving in this direction\
    \ **Steemit**[\\[90\\]](#part0000_split_077.html#_ftn90), a platform created in\
    \ 2016 by Ned Scott and Daniel Larime as the first application based on the Steem\
    \ blockchain. Steemit a decentralized application (DApp) that uses the eponymous\
    \ cryptocurrency STEEM to reward users for their content. By voting on posts and\
    \ comments, users can decide to pay for those posts.\n\n# 7. Non-Fungible Tokens\n\
    \n**7.1 Introduction **\n\n**7.2 A brief history of NFTs **\n\n**7.3 How NFTs\
    \ Work **\n\n**7.4 Most common uses **\n\n**7.5 How to create, buy and trade NFTs\
    \ **\n\n**Chapter summary**\n\n**In Chapter 4 we got to know the fungible tokens,\
    \ that is, tokens able to be interchangeable by users. However, there is another\
    \ category called Non-Fungible-Token, better known as NFT, which we will describe\
    \ in this chapter.**\n\n**Keywords**: Non-Fungible Token, NFT, Copyright, Digital\
    \ art\n\n## 7.1 Introduction\n\nIn the previous chapter we described how Blockchain\
    \ offers solutions to security problems in the absence of centralized architectures\
    \ that bring with them a series of limitations, such as costs and scalability.\n\
    \nAnother application that is becoming more and more popular in recent months\
    \ is that of the so-called Non-Fungible Tokens, or NFT.\n\nLet's clarify the meaning\
    \ of fungible and non-fungible.\n\nA banknote or Cryptocurrency is said to be\
    \ fungible as it can be replaced without any problem with another banknote or\
    \ cryptocurrency of equal value. A Non-Fungible Token, on the other hand, represents\
    \ a unique piece: that is, it cannot be replicated or replaced.\n\nAn NFT can\
    \ be any object in digital format, for example a video, a photo, a GIF, a text,\
    \ an article, an audio. Any of these digital objects, when certified with an NFT,\
    \ is as if there was the author's signature on it and no one can say that it is\
    \ not original or that there are other copies if not signed with an NFT. Let's\
    \ take another example: a copy of a book, by itself, has some commercial value.\
    \ Each copy is substantially the same as the other, and can for example be replaced\
    \ with another completely identical. However, if this copy is signed by the author,\
    \ for example by adding a dedication and date, this copy would become unique and\
    \ unrepeatable. Furthermore, it would acquire a much greater value, so it would\
    \ not make sense to exchange it for a different copy of the book. Here, this special\
    \ copy would become non-fungible, an NFT. NFTs couldn't exist without the Blockchain.\
    \ Which Blockchain? Ethereum was the first to support NFTs with its ERC-721 standard\
    \ and is currently the most widely used. Since Ethereum currently has high transaction\
    \ fees (so-called gas fees), Level 2 solutions (i.e., top-of-the-chain protocols\
    \ created later to solve some specific problems) have emerged for Ethereum that\
    \ also support NFT:\n\n·             **Immutable X**[****\\[91\\]****](#part0000_split_077.html#_ftn91)\
    \ \n\n·             **Polygon**[****\\[92\\]****](#part0000_split_077.html#_ftn92)\n\
    \nOther Blockchains that support NFTs are:\n\n·             **Bitcoin Cash**[****\\\
    [93\\]****](#part0000_split_077.html#_ftn93)\n\n·             **Cardano**[****\\\
    [94\\]****](#part0000_split_077.html#_ftn94)\n\n·             **FLOW**[****\\\
    [95\\]****](#part0000_split_077.html#_ftn95) \n\n·             **GoChain**[****\\\
    [96\\]****](#part0000_split_077.html#_ftn96)\n\n·             **Solana**[****\\\
    [97\\]****](#part0000_split_077.html#_ftn97)\n\n·             **Tezos**[****\\\
    [98\\]****](#part0000_split_077.html#_ftn98)\n\n## 7.2 A brief history of NFTs\n\
    \n**2014: Kevin McCoy creates the first known \"NFT\", Quantum, **which Anil Dash\
    \ later bought during a live presentation at the New Museum in New York. At the\
    \ time, he referred to the technology as \"monetized graphics,\" which is a non-fungible,\
