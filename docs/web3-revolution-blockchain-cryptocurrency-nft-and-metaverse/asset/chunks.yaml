- raw: '·             **Decentraland**[****\[133\]****](#part0000_split_077.html#_ftn133):
    it is a decentralized platform built on the Ethereum Blockchain. Created in 2015
    by Argentines Ari Meilich and Esteban Ordano, at first it was just a pixelated
    grid that allocated pixels to users through a PoW algorithm. Subsequently, starting
    in October 2018, the platform evolved into a 3D world. How does it work? After
    creating their avatar, users have the opportunity to buy and resell plots of land
    on which to build in a virtual space. The currency used for transactions is MANA,
    the native token which, unlike other cryptocurrencies, cannot be mined and is
    removed from the Blockchain every time a transaction occurs for the purchase of
    land or other goods that can be purchased by users. In addition to buying or selling
    land, MANAs are used as a currency to buy digital content, NFTs, advertising services
    and much more. At the time of writing, MANA is valued at around $ 3.14 and is
    the 28th largest cryptocurrency in terms of market capitalization. Several investors
    expect the uptrend to continue in the coming years and cross $ 15 by 2025[\[134\]](#part0000_split_077.html#_ftn134)


    ·             **The Sandbox**[****\[135\]****](#part0000_split_077.html#_ftn135):
    it is a platform founded by Arthur Madrid and Sebastien Borget that uses decentralized
    virtual reality based on Ethereum and allows users to build, own and monetize
    content and applications. In this virtual reality, users can buy plots, or plots
    of land of 96 × 96 meters (virtual) each. The Token used is SAND which is used
    to acquire NFT in the Metaverse of the platform. The Token can also be used to
    purchase gear, customize your character, and much more. For example, equipment
    means a magic sword for your hero in video game X, a special armor in video game
    Y, or simply a pet in video game Z. As for the personalization of your character,
    in this case we are talking about different kinds of shoes, gloves, jackets, hats,
    etc. SAND is currently in 39th position in terms of market capitalization with
    a value of $ 4.94[\[136\]](#part0000_split_077.html#_ftn136)


    ·             **Enjin Coin**[****\[137\]****](#part0000_split_077.html#_ftn137):
    the need to optimize online gaming platforms was noticed in 2017 by Maxime Blagov,
    an experienced Blockchain programmer, who together with Witek Radomski thought
    and planned the establishment of the Enjin project. Enjin represents a complex
    ecosystem, created to create a safe, fast and designed environment for gamers.
    The project aims to improve the creation of video games, making sure that programmers
    can really highlight their ideas and potential, without being forced to design
    based on the choices of the publishers, all while maintaining a high level of
    security. which in the gaming and NFT sector has begun to represent an increasingly
    important aspect. Currently, the ENJ token is in 65th position in terms of market
    capitalization, with a value of $ 2.34


    ·             **Velhalla**[****\[138\]****](#part0000_split_077.html#_ftn138):
    lastly, we mention a recently born project. In fact, his SCAN Token became available
    only from November 16, 2021 via IDO (initial offer via decentralized platform).
    Velhalla''s Metaverse offers peculiarities similar to those of other existing
    projects based on the Metaverse: in fact, it is possible to take advantage of
    different play-to-earn games to increase the player''s earning potential using
    your own platform. Each game provided has its own Metaverse, which makes it more
    unique than other platforms. These cryptocurrencies are to be used to redeem in-game
    rewards and assets. SCAN is currently in position 4332 with a value of $ 0.08


    It is easy to understand how such a scenario can open up enormous and still totally
    unexplored opportunities. However, there are some limits, especially technological
    ones. Let''s see which ones.


    ## 8.6 Some current technological limitations


    Although much of the technology is already available on the market and examples
    of Metaverse have already been developed, there is still a long way to go from
    a technological point of view to guarantee users the necessary usability. We have
    already mentioned the technical problems on the Second Life platform, relating
    for example to the graphic processing of information.


    Raja Koduri, one of the leaders of Intel''s accelerated graphics and processing
    team (Computing Systems and Graphics Group) suggests that very powerful infrastructures
    will be needed to set up a Metaverse as conceived by Meta, estimated at approximately
    1000 times higher in terms of computational capacity than what we have today.
    This is essentially due to the fact that it will be necessary to digitize a series
    of "human" characteristics including voice functions and the movement of people
    in real time, all data that will have to be collected by a device worn by the
    user who will necessarily have to integrate various sensors. All this huge amount
    of data will have to be transferred with very high bandwidth and with very low
    latency to the cloud servers, for hundreds of thousands of users, connected simultaneously,
    in a few milliseconds. This scenario would not currently be viable if you wanted
    to simulate realistic avatars and environments. In any case, Intel has recently
    stated that it is working in this direction in particular in the development of
    new graphics processors designed for the Metaverse. However, the development of
    new hardware will not be enough, but there will also be a need for specialized
    algorithms, a new architecture (which Intel has already called Xe), new software
    tools and open development libraries. Koduri eventually declares himself optimistic
    about the technical feasibility of making a realistic Metaverse, even if this
    could take years[\[139\]](#part0000_split_077.html#_ftn139)


    Other technological limitations concern virtual reality and augmented reality.
    In fact, we have seen how the use of these devices can generate discomfort for
    users, such as VR Sickness, eye fatigue and dizziness. There is no doubt that
    if we were to use these devices for several hours during a day, these aspects
    will have to find a solution to make these technologies usable on a large scale.


    ## 8.7 Controversial aspects of the Metaverse


    The first aspect concerns the lack of interoperability and standards. In the perspective
    in which many companies can create their own proprietary metaverse, where for
    example gadgets sold by the NFT itself will be needed to access, many non-communicating
    "realms" will be created, a sort of new Digital Middle Ages.


    The second aspect concerns usability, where a problem has always remained open:
    what physical consequences does the use of these devices cause? In fact, we have
    seen, speaking of Virtual and Augmented Reality, how these viewers can generate
    problems such as dizziness or tired eyes.


    The third aspect concerns regulation, an issue already addressed in Chapter 3.
    It is clear, in fact, that legislative intervention on the part of legislators
    has become urgent. Shoshana Zuboff[\[140\]](#part0000_split_077.html#_ftn140),
    Professor of the Harvard Business School, he raises the question of how to organize
    and govern the information and communication spaces of the digital century. For
    example, if in the physical world, addictive substances are strictly regulated,
    why aren''t addictive digital services in the Metaverse? An educational intervention
    for digital users is therefore becoming increasingly urgent, studying what lies
    behind monitors and viewers, knowing virtual and augmented reality bearing in
    mind that unfortunately the business models that exploit these concepts are based
    on potential forms of addiction.


    # 9. Web3 Revolution


    **9.1 Summary of previous chapters **


    **9.2 Adopt new technologies **


    **9.3 A true decentralization**


    **9.4 What future scenarios?  **


    **Chapter summary**'
