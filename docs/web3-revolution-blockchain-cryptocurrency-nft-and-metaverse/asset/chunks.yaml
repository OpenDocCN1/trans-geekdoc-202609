    Fiat currencies are essentially virtual currencies and, since 1971, not constrained
    by gold / currency convertibility. Indeed, the sudden decision of the American
    president, announced on TV on the evening of August 15, 1971, marked the end of
    the post-war international monetary system, created at the Bretton Woods conference.


    Bitcoin aims to become a digital currency by taking the main benefits of gold
    and fiat currency, namely:


    - the `non-manipulability of the monetary offer` by central entities. Bitcoin
    is based on `Blockchain`, a database that is decentralized by nature. Governments
    cannot have control over it, for example by creating hyperinflation. Let''s think
    for example of the case of Zimbabwe or Venezuela, with decreases in purchasing
    power on savings of up to 30% per week. However, the West is not exempt from inflation:
    1 US dollar in 1970 had the same purchasing power of 6.59 dollars in 2019, with
    an inflation rate of change over this period of 558.63%.


    - `privacy` on the use of currency (think of countries with limited freedom, such
    as Afghanistan, where women cannot even open a bank account)


    - `it can be virtualized`, as it can be exchanged in electronic form, therefore
    easily transportable and usable


    - `it is safe`, as it is subject to the immutability and security rules of the
    `Blockchain`


    Bitcoin adds another solution to the problems of the digital age: the centralization
    of data by entities that monitor the exchange of money. In fact, payments are
    among the most sensitive information ever, however the new forms of digital payment
    that have emerged in recent years such as `Apple Pay`, `PayPal`, `Google Pay`
    and `Stripe`, just to name the most famous, collect sensitive data that can then
    be resold. This information can become a form of control if not properly managed.
    An example? On June 14, 2011, WikiLeaks decided to accept donations in Bitcoin
    after the boycott of `Amazon`, `PayPal`, `Visa`, `MasterCard`, `Bank of America`
    and `Western Union`, which suddenly decided to cut off any possibility of donating
    to WikiLeaks under pressure from the United States government, as reported by
    Stefania Maurizi in her book "Il potere segreto" (“The secret power”).


    ### 4.3.1 How does Bitcoin be worth thousands of Dollars?


    In the introductory chapter we mentioned the fact of Laszlo Hanyecz who, on May
    22, 2010, bought two pizzas worth $ 30 in a small town in Florida for 10,000 Bitcoins.
    `This was the first price given to Bitcoin in history, with an exchange rate of
    1 BTC = $ 0.003.` Today, almost 12 years later, those two pizzas are earning an
    equivalent value of around 400 million dollars to the lucky pizzeria. But what
    is the mechanism by which a virtual asset, initially without any value, suddenly
    becomes a store of value?


    **In other words, who determines the price of Bitcoin?**


    The price is determined by all those who want to participate in the buying and
    selling process, essentially its users. It sounds trivial, but that''s the way
    it is, although multiple factors play a role. In fact, miners can propose a price
    when they sell their Bitcoins to interested parties: when in a negotiation between
    two people, one proposes a price and the other is willing to accept it, then the
    transaction is made. What we have just described is the same process by which
    all existing goods are exchanged. And it happens tens, hundreds or thousands of
    times a day, often with great variations.


    The value of Bitcoin has changed over time and is essentially based on the trust
    of its users, its usefulness and its popularity. There is no official or single
    price for Bitcoin, as there is no single platform to trade, the so-called `Exchanges`,
    which we will discuss in Chapter 6.


    Certainly, a fundamental component in the price of Bitcoin is its intrinsic scarcity.
    In fact, its `Blockchain` was designed to have a finite number of coins that can
    be mined, or 21 million. Consequently, the greater the demand, the greater the
    cost.


    ## 4.4 Ethereum, the #1 Altcoin


    After describing the reasons, the implications of the birth of Bitcoin, as well
    as some of the main reasons why it has accumulated value over the years, we now
    introduce Ethereum, the second Cryptocurrency in terms of market cap. Why is there
    a need for Ethereum, and more generally, for Altcoins?


    Ethereum was conceived in 2013 by programmer Vitalik Buterin together with co-founders
    Gavin Wood (later creator of `Polkadot`), Charles Hoskinson (later founder of
    `Cardano`), Anthony Di Iorio and Joseph Lubin. The network went live on July 30,
    2015 with the aim of allowing anyone to deploy permanent and immutable decentralized
    applications that users could interact with. This is the main difference compared
    to Bitcoin, according to the founders: Bitcoin generates tokens that essentially
    become a store of value or trading currency, while Ethereum thinks that thanks
    to the `Blockchain` it is possible to create `Smart Contracts` capable of making
    every safe and decentralized transactions, not just those of money.


    As reported by an article by Vincenzo Cacioppoli on the Cryptonomist:


    > "Many think that Ethereum is better than Bitcoin, from the perspective of its
    adoption in the real world. Bitcoin, as a payment tool, still struggles to find
    space in finance, if not in limited cases. Ethereum represented a real revolution
    for the blockchain world, and its example was followed by other projects, such
    as `Solana`, `Cardano` and `Polkadot`." According to the author: " research carried
    out by the Sydney University of Technology has shown that Ethereum is better than
    Bitcoin, as a store of value, despite the fact that Bitcoin''s coins in circulation
    are limited, unlike Ether. According to Australian researchers, Ethereum is a
    much more effective anti-inflation tool than Bitcoin."


    However, there are many skeptics, including the aforementioned Bitcoin maximalists,
    who express various criticisms regarding the Ethereum project, especially as regards
    the technical aspects.


    Many of the altcoins on the market today are based on Ethereum, such as `Layer
    2`. Among these we mention:


    - `Chainlink` (LINK): a decentralized network that allows you to bridge the gap
    between `Blockchain` and the real world in a secure way. In most cases, `dApps`
    (decentralized applications) need real-world data to work, so they rely on intermediaries
    (called `oracles`), who provide a reliable source of information. Considering
    that some `dApps` manage hundreds of millions of dollars, the security of these
    external communication bridges is of vital importance. `Chainlink` minimizes the
    potential risks associated with `oracles` through the use of a highly decentralized
    infrastructure, innovative hardware and data sources protected from manipulation.


    - `Compound` (COMP): the decentralized equivalent of traditional credit markets.
    This protocol is basically a liquidity pool that allows users to obtain and grant
    loans, as well as earn interest on their cryptocurrencies.


    - `MakerDAO` (MKR): a service that, through `Smart Contracts`, makes it possible
    to obtain and grant loans without the need for intermediaries. It is one of the
    first projects developed in the DeFi ecosystem, as well as one of the most used.


    - `0x` (ZRX): a standard that facilitates interactions between platforms and introduces
    the concept of "interconnected liquidity": operators using `0x` share trading
    orders on individual platforms to obtain better liquidity.

