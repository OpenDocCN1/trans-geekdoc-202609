    - Asymmetric key: the Blockchain uses asymmetric key algorithms. To implement
    this type of algorithm, you need to have two different keys. One of the keys will
    be responsible for encrypting the information to turn it into ciphertext, and
    the other key will be used to decrypt the information to make it plaintext. The
    asymmetric key algorithm is much slower than a symmetric key algorithm; however,
    security is more complex and it is more difficult to be hacked. The Blockchain
    uses an asymmetric key algorithm called `Elliptic Curve Digital Signature Algorithm
    (ECDSA)`.


    The `ECDSA` algorithm is considered a secure standard for the implementation of
    digital signature systems and today it’s use is so varied that it finds application
    in almost all fields of information technology. For example, the Internet''s `SSL`
    and `TLS` security certificate infrastructure makes heavy use of the `ECDSA` algorithm.


    ![](images/00007.jpeg)


    Figure 7: example of using public key and private key in the encryption process


    One of the main problems that Satoshi Nakamoto had to face with Bitcoin was the
    distribution of public keys, necessary to guarantee the security of the tokens
    in the relative Wallets (we will see them in chapter 6). Nakamoto''s vision was
    to enable the sharing of short, secure, low-cost, easy-to-use public keys, characteristics
    thanks to elliptic curve cryptography. For this Nakamoto decided to use the `ECDSA`
    algorithm for his system. Furthermore, it is guaranteed that:


    - the system is extremely safe. Satoshi decided to use the elliptic curve standard
    `secp256k1` for Bitcoin;

    - the computational cost of key generation and signature validation is very low;

    - allows the generation of infinite public keys.


    However, the 256-bit `ECDSA` keys are very long. For this, it was decided to use
    hash functions such as `SHA-256` and `RIPEMD-160`, to reduce the size of the public
    keys and create the Bitcoin address file.


    ## 2.5 Consensus Algorithm


    In paragraph 2.3 we mentioned that the generation of hashes does not guarantee
    the full security of the Blockchain, but that it is necessary to implement other
    mechanisms. A consensus algorithm is the set of rules that allows the finalization
    of transactions and the functioning of the system and has the purpose of keeping
    the network usable, safe and decentralized. We will focus on this aspect as one
    of the main differences between the different cryptocurrencies that are emerging
    is also based on the consensus mechanism used.


    We can divide the consensus mechanisms into two main macro categories:


    - Without authorization (open technology)

    - With authorization (closed technology)


    In the without authorization mechanism, the technology is open to anyone and there
    is no central body that can decide the rules of the protocol and the transactions
    to be carried out. In the second case, however, the validator nodes are known
    entities that must be trusted.


    The two main types of consensus algorithms will be described below, namely `Proof-of-Work
    (PoW)` and `Proof-of-Stake (PoS)`.


    ### 2.5.1 Proof-of-Work (PoW)


    In paragraph 1.3 we have already addressed `Proof-of-Work (PoW)`, without going
    into too many technicalities, a network is created that models’ payment channels
    using `Smart Contract` (we will talk about this in the next chapter) to ensure
    that the network can operate in a decentralized way. This approach offers one
    of the most powerful options for improving Bitcoin''s scalability: in fact, it
    can lead Bitcoin to reach levels close to 1 million transactions per second.


    Miners are the nodes that exploit the computing power of their computers to mine
    Bitcoin. They are called miners because, like miners looking for gold by making
    a physical effort, Bitcoin miners try to find the hashes of the blocks of a chain
    by harnessing the computational power of their computers, ultimately consuming
    electricity in exchange for Bitcoin as a reward. Miners validate, authenticate,
    certify and finalize transactions.

