- raw: "In the context of the Blockchain, a fork occurs when a block is linked to\
    \ 2 successive blocks. Forks are related to the fact that the parties must use\
    \ common rules to keep the history of the Blockchain. Indeed, when the parties\
    \ disagree, alternative chains can emerge. While most forks are short-lived, others\
    \ are nevertheless permanent: short-lived forks are due to the difficulty of reaching\
    \ rapid consensus in a distributed system, while permanent forks (i.e., due to\
    \ protocol changes) are used for add new features to a Blockchain, or they can\
    \ also be used to reverse the effects of hacking (as in the case of Ethereum and\
    \ Ethereum Classic), or to avoid catastrophic bugs on a Blockchain as in the case\
    \ of the Bitcoin fork of August 6, 2010. \n\n**![](images/00011.jpeg)**\n\nFigure\
    \ 11: example of a fork\n\nForks can be classified as:\n\n1.              **accidental**\n\
    \n**2.              intentional**\n\nAccidental forking occurs when two or more\
    \ miners find a block almost simultaneously. The fork is resolved when subsequent\
    \ blocks are added and one of the chains becomes longer than the alternative.\
    \ The network consequently leaves the blocks of the shorter chain, because the\
    \ miners' goal is to always work on the longest chain. Abandoned blocks are then\
    \ called orphan blocks.\n\nIntentional forks that change the rules of a Blockchain\
    \ can be classified as follows:\n\n·             **Hard fork**: a hard fork is\
    \ a rule change such that software validating under the old rules will see blocks\
    \ produced under the new rules as invalid. In the event of a hard fork, all nodes\
    \ intended to operate under the new rules must update their software. If a group\
    \ of nodes continues to use the old software while the other nodes are using the\
    \ new software, permanent division can occur\n\n·             **Soft Fork**: a\
    \ soft fork is an update of the program code that manages a Blockchain file to\
    \ add a change, usually a new feature or a bug fix. But to be a soft fork it must\
    \ remain compatible with the old Blockchain. For example, in Bitcoin an update\
    \ is first disclosed in a document known as BIP (Bitcoin Improvement Proposals).\
    \ Once approved, further implementation is up to the developers of the Bitcoin\
    \ clients. There are two types of soft forks that occur when:\n\no      Most miners\
    \ upgrade to apply the new rules. This is called Miner Activated Soft Fork (MASF);\n\
    \no      Nodes are coordinated to enforce the new rules, without the support of\
    \ miners. This is called User Activated Soft Fork (UASF).\n\n### 2.6.1 Hard fork:\
    \ the cases of Ethereum and Bitcoin\n\nEthereum Classic maintains the original\
    \ and unaltered history of the Ethereum network. The main Ethereum project network\
    \ was in fact initially released through July 30, 2015. However, due to a hack\
    \ of a third party project, on July 20 2016 the Ethereum Foundation created a\
    \ new version of the Ethereum main network with a change implemented of irregular\
    \ state that erased the theft of millions of ether from the history of the Ethereum\
    \ Blockchain, applying its own brand to the new modified version of the Ethereum\
    \ Blockchain (code: ETH), i.e. the one in which the stolen funds were returned\
    \ to the owners, while the previous and unaltered version of Ethereum was renamed\
    \ Ethereum Classic (code: ETC), i.e. the one in which the funds were not returned.\n\
    \nOn August 6, 2010, a serious vulnerability was detected in Bitocoin protocol,\
    \ effectively allowing users to circumvent the economic restrictions of the Blockchain\
    \ and create an indefinite number of Bitcoins. As a result, on August 15, over\
    \ 184 billion Bitcoins were generated in one transaction and sent to two addresses\
    \ on the network. Within hours, that transaction was detected and cleared from\
    \ the transaction log after the bug was fixed and the network switched to an updated\
    \ version of the Bitcoin protocol. This was the only major security flaw found\
    \ and exploited in Bitcoin's history.\n\nHowever, Bitcoin has been subject to\
    \ other forks for different reasons. The hard forks that divide Bitcoin were created\
    \ by changing the rules of the Blockchain and sharing a history of transactions\
    \ with Bitcoin up to a certain time and date. The first hard fork dividing bitcoin\
    \ occurred on August 1, 2017, with the creation of Bitcoin Cash.\n\nBelow is a\
    \ list of important hard forks that break down bitcoin by date and / or block:\n\
    \n·    **Bitcoin Cash**: fork occurred at block 478558, 1 August 2017, for each\
    \ bitcoin (BTC), one owner obtained 1 Bitcoin Cash (BCH);\n\n·    **Bitcoin SV**:\
    \ fork occurred at block 556766, November 15, 2018, for each Bitcoin Cash (BCH),\
    \ one owner obtained 1 Bitcoin SV (BSV);\n\n·    **Bitcoin Gold**: fork occurred\
    \ at block 491407, 24 October 2017, for each bitcoin (BTC), one owner has obtained\
    \ 1 Bitcoin Gold (BTG).\n\n# 3. Benefits and challenges of Blockchain technology\n\
    \n**3.1 Main benefits **\n\n**3.2 Main challenges**\n\n**Chapter summary**\n\n\
    What are the advantages of a Blockchain architecture? We have already mentioned,\
    \ for example, safety, traceability and the absence of central bodies that act\
    \ as guarantors. \n\nIn this chapter, we will describe with more details the main\
    \ benefits, or the reasons why the Blockchain is becoming an increasingly popular\
    \ technology not only in finance. In addition, we will also describe the main\
    \ challenges to be faced in order for the Blockchain to become a widespread system\
    \ globally.\n\n**Keywords**: transparency, security, scalability, privacy, 51%\
    \ attack, energy consumption, deregulation, cryptographic key\n\n## 3.1 Main benefits\n\
    \nBelow we describe the main advantages related to Blockchain technology: transparency,\
    \ costs, security, speed and scalability.\n\n### 3.1.1 Transparency\n\nTo improve\
    \ transparency in the exchange of information, organizations have tried to implement\
    \ more and more rules; however, there is one thing that does not make any system\
    \ 100% transparent, which is the centralization of information. In a centralized\
    \ network, every decision-making power is in the hands of a central body that\
    \ controls the network. For example, in the case of a central banking system,\
    \ every decision goes through the banks that will implement the banking policy\
    \ most in line with their strategy. Transparency therefore becomes arbitrary and\
    \ not structural: this means that we will have to somehow \"trust\" the protection\
    \ mechanisms that the bank puts in place towards savers. One of the main applications\
    \ of the Blockchain is the so-called decentralized finance, also known as DeFi,\
    \ which will be presented in more detail in Chapter 6.\n\nAnother application\
    \ example concerns the voting process of democratic governments. In order for\
    \ this process to take place as transparently as possible, each state implements\
    \ a series of measures during the counting to avoid electoral fraud. If, on the\
    \ other hand, the process was carried out in a completely computerized way through\
    \ electronic voting, it would be enough to manipulate or tamper with the central\
    \ server that processes the information to pilot the outcome of the votes as desired.\n\
    \nWith the Blockchain, this kind of problem would find a robust solution: as we\
    \ have seen, a Blockchain is made up of nodes responsible for executing transactions\
    \ and their validation. Each transaction is also sent to the members of the network\
    \ who keep an exact copy of it in their register, while any potential attempt\
    \ to tamper with the outcome of the vote should be validated according to the\
    \ consent mechanism adopted. All this would happen with a significant reduction\
    \ in costs and time.\n\n### 3.1.2 No intermediary cost"
