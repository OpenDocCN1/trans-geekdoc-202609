    \nYou can also use native development tools such as OpenGL and Microsoft DirectX.\
    \ These options offer more flexibility, but typically take much longer to develop\
    \ and write more code. WebVR is also a valid option.\n\n### 8.4.2 Augmented Reality\n\
    \nNot just Virtual Reality. The Metaverse consists of a new sensory experience\
    \ that may not only be completely virtual, but a mix of \"real\" reality and virtual\
    \ reality. This mix is possible thanks to Augmented Reality, whose authorship\
    \ of the term is attributed in 1990 to Thomas P. Caudell, a former Boeing researcher.\
    \ Even in this case, however, the first prototypes date back to a few previous\
    \ decades, but it is in 1984 that thanks to the movie \"The Terminator\" this\
    \ technology becomes popular to the public: the Terminator uses a viewer in different\
    \ parts of the film. In one part, for example, he accesses information on his\
    \ \"new\" motorcycle. Recently, the most popular devices to take advantage of\
    \ augmented reality are the Google Glasses, launched in 2013. The Google Glasses\
    \ are glasses that connect to the Internet via Bluetooth, via the wireless service\
    \ on a user's cell phone and respond to voice commands, by touch. of the frame\
    \ or by moving the head. In 2015, Microsoft responded by announcing the HoloLens\
    \ augmented reality device. The device uses various sensors and a processing unit\
    \ to blend high-definition \"holograms\" with the real world.\n\n#### 8.4.2.1\
    \ How Augmented Reality works\n\nAugmented Reality basically works according to\
    \ one of the following approaches:\n\n1.              **SLAM:** **Simultaneous\
    \ Localization and Mapping (SLAM)** it is the computational problem of building\
    \ or updating a map of an unknown environment while keeping track of the position\
    \ of an agent within it. There are several known algorithms to solve this. Published\
    \ approaches are employed for the development of self-driving cars, unmanned aerial\
    \ vehicles, autonomous underwater vehicles, planetary rovers, new home robots,\
    \ and even within the human body.\n\n2.              **Recognition based:** systems\
    \ based on recognition (or markers) using Augmented Reality use a camera to identify\
