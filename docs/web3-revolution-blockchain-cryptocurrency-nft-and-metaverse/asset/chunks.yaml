    * High percentages indicate that the market is by no means stable: assets on the
    asset are mainly of a speculative nature and this disfavors not only the stability
    of the prices but also the interest on the part of institutional players.

    * Too low percentages indicate an excessive static nature of the market and, consequently,
    undermine the future prospects of the asset.


    To realize how much the high percentages say about the potential of a Cryptocurrency,
    just think that all the so-called Shitcoins have a ratio of at least 4 or 5 times
    higher than that of `Bitcoin` or `Ethereum`, in some cases reaching volumes that
    cover 70% of capitalization daily. In these cases, the speculative component is
    so strong that the investments take on features of the bet.


    Furthermore, if we look at the trend over the years of these two assets, they
    certainly show interesting long-term potential:


    ![](images/00014.jpeg)


    Figure 14: `ETH` token price trend from January 2019 to December 2021. Source:
    CoinMarketCap.


    ![](images/00015.jpeg)


    Figure 15: `BTC` token price trend from January 2019 to December 2021. Source:
    CoinMarketCap.


    According to these charts and according to many analysts, it is reasonable to
    expect that the upward trend will continue over the long term.


    ### 5.4.2 Create an "unbalanced" portfolio by focusing on the top 10-15 Cryptocurrencies


    Generally, the most common advice among investors is to "diversify." The reasoning
    is "don''t put all your money into a single asset." There are thousands of assets,
    so spreading out an investment could help mitigate some of the inherent risks
    associated with betting everything on one asset. This concept makes sense in traditional
    markets, but several investors in the `Crypto` market believe diversification
    is just a myth. Partly because many of the major Cryptocurrencies are closely
    related to `Bitcoin`, and the marketing used to distinguish one currency from
    another makes it difficult to properly evaluate the asset. Unlike public companies
    and corresponding stocks, assessing the potential of a `Crypto` project is a much
    more complex process and requires more technical skills.


    For this reason, the second strategy we recommend is to create a `Crypto Wallet`
    that includes other `Altcoins`, in addition to `Bitcoin` and `Ether`, but biased
    towards the latter. Why "unbalanced"? Experts suggest choosing some cryptocurrencies
    in your `Wallet` (1-3) and developing a list of medium and high-risk `Tokens`.
    This list also should include several `Stablecoins`, Cryptocurrencies backed by
    a "stable" asset. This strategy considers how `Coins` tend to correlate with `Bitcoin`
    fluctuations. However, less popular `Coins` could grow much more regardless of
    `Bitcoin`''s performance, although they carry a much greater investment risk.


    ### 5.4.3 Bet on little-known but high-potential Altcoins by exploiting fundamental
    analysis


    The third and final strategy that we would like to mention but to advise against
    especially for those approaching the world of Cryptocurrencies for the first time
    is to go all-in on `Altcoins` that are still low in value but high potential.
    How to intercept them? If the question had a simple answer, everyone would. In
    any case, the main thing is certainly to study the fundamentals of the project
    and perceive its importance in the long term. However, as already mentioned but
    we will not tire of repeating it, the volatility of the market is such that it
    represents a real risk and is therefore not recommended.


    ### 5.4.4 Trading using technical analysis


    If the investor decides to speculate on this volatility that characterizes Cryptocurrencies,
    it is particularly interesting. In practice, `technical analysis` is the study
    of price over time, in order to predict future trends. We will not go into the
    technicalities of this type as it is outside the scope of this book.

