    Similarly, the current fiat currencies managed by national governments are undergoing
    a slow but steady inflationary process (in some cases not so slow, such as the
    cases of hyperinflation in Zimbabwe and Venezuela), gradually losing their value:
    1 US dollar in the 1970 had the same purchasing power of $ 6.59 in 2019, with
    an inflation rate of change of 558.63%[#2](#part0000_split_077.html#_ftn2).


    # How to avoid the devaluation of national currencies?


    ## The centralization of information and data


    Resuming the comparison with the second industrial revolution, today, in the digital
    age, we are witnessing a phenomenon similar to what happened with the centralization
    of production activities in factories, but this time on the basis of information
    and data. In his book "The Fourth Industrial Revolution"[#3](#part0000_split_077.html#_ftn3),
    Klaus Schwab, founder and executive president of the World Economic Forum, while
    discussing the impact of new digital technologies on people''s lives, presents
    an interesting picture: whether the three largest social media sites were countries,
    they would be in the top 10 of the most populous nations. Furthermore, in the
    first place we find a country of the social media category, without considering
    that these three social networks are all part of `Meta Platforms Inc`. In addition,
    if we consider `Google`, the largest search engine in the world, `Microsoft`,
    the largest provider of operating systems, `Samsung`, which holds the primacy
    of the smartphone market share and finally if we add to this analysis also the
    world server market, divided between the American giants `Dell`, `Hpe`, `Inspur`
    and the big Chinese `Huawei` and `Lenovo`, it is easy to understand how information,
    true gold of the new millennium, is centralized in the hands of a few corporations.


    ## The Big Brother


    In the novel "1984" the English writer George Orwell describes a society in which
    each individual is constantly monitored by the authorities. The Big Brother, as
    the fictional character is called, is not known whether he is an existing person
    or simply a symbol created by the party. However, in 2013 the big brother became
    not just a character in a science fiction novel, but something absolutely real
    through the work of the main world power: the United States. The discovery of
    a centralized mass surveillance system, in which information technology was used
    by the `NSA`[#4](#part0000_split_077.html#_ftn4) to monitor every citizen on a
    global scale in the name of national security, breaking all international privacy
    laws, became public thanks to whistleblower Edward Snowden. It was clear that
    data centralization was a formidable tool of power and control for anyone with
    access to it. However, as it turned out, everything happened in the total unawareness
    of the citizens.


    Will it be possible, in the future, to prevent situations of this type from happening
    again?


    ## Web3


    If in the case of industrial revolutions, we can identify four distinct phases
    that occurred historically over the course of just over two centuries, in the
    field of information technology the transformations occur at hypersonic speeds.
    Although the World Wide Web officially dates back to 1990, when `CERN` published
    the first web page in history on December 20, we can already distinguish three
    distinct phases of the evolution of the web in just 30 years.


    Web 1.0 spread substantially between 1991 and 1999. Web 2.0, on the other hand,
    was coined in 1999 by DarcyNucci in her article "Fragmented Future"[#5](#part0000_split_077.html#_ftn5):
    in Web 1.0 the vast majority of users simply acted as consumer. In Web 2.0, the
    user becomes an active part of the web. The main features of Web 2.0 include `social
    networking websites`, `self-publishing platforms`, `website building tools`, `tagging`,
    `likes` and `bookmarking` becoming increasingly common.


    What about Web 3.0? The term, also known as `Web3`, was coined in 2014 by Ethereum
    co-founder and Polkadot creator Gavin Wood. Web3 revolves around the idea of a
    decentralized Internet as opposed to Web 2.0, where large amounts of data and
    content are centralized in a fairly small group of companies often referred to
    as Big Techs: `Alphabet (Google)`, `Amazon`, `Apple`, `Meta (Facebook)` and and
    `Microsoft`.


    Figure 1: history of Internet, from web 1.0 to web 3.0. Source: Cointelegraph


    However, being a relatively new term, the meaning of `Web3` is still not entirely
    clear, even if there is some convergence with `Blockchain` technologies, such
    as `Cryptocurrencies` or `Non-Fungible Tokens (NFT)`. Decentralized Finance (`DeFi`)
    represents another key concept, where users can exchange currency without the
    involvement of bank or government.


    ## New upcoming scenarios


    `Blockchain`, `Cryptocurrencies` and `NFT` are therefore highly interconnected
    and topical technologies and applications. However, for the vast majority, they
    still represent unknown concepts, or at least unclear, consequently generating
    strong skepticism and hesitation in the moment of implementation.


    According to a recent survey conducted during the EY Blockchain Summit[#6](#part0000_split_077.html#_ftn6),
    key top managers were asked what the level of knowledge was regarding this technology.
    On a sample of 100 large companies, the level of knowledge was 48 on a scale from
    1 to 100. However, `Blockchain` is considered among the three technologies with
    the highest impact on the business by those who know it: 57% would like to implement
    it in the company.


    Finally, with the birth of `Meta Platform Inc.`, formerly `Facebook`, in October
    2021, the concept of `Metaverse` is gaining ground. As we will see, the basic
    idea of the `Metaverse` is to interact and form relationships with other agents
    in a completely virtual world through the use of `avatars`. This concept integrates
    perfectly with `Blockchain` technology and with the use of `Tokens`, whether they
    are `Cryptocurrencies` or `NFTs`, as a means of exchange in the virtual world,
    guaranteeing the decentralization, privacy and security typical of the `Blockchain`
    infrastructure.

