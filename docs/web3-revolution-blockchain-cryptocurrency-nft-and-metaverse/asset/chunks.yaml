  trans: '


    ### **共识（机制）**：这是一种用于区块链的机制，用于在分布式进程之间就单个数据值或网络状态达成必要的共识。例如，在比特币上，共识机制被称为工作量证明（`Proof-of-Work`，`PoW`），它需要通过计算能力来解决一个困难但任意的谜题，以保持所有网络节点的诚实。


    ### **Corda**：这是一个开源项目，允许你在开放的开发环境中设计和开发区块链。通过区块链技术和智能合约，Corda 可以简化业务操作降低注册成本，并帮助公司创建可操作的区块链网络或直接进行交易的应用。


    ### **加密货币**（Cryptocurrency）：一种受加密算法保护的数字或虚拟货币，使得伪造或双重花费几乎不可能。许多加密货币是基于区块链技术的去中心化网络。加密货币的一个特点是它们通常不由任何中央机构发行，这在理论上使其能够免疫政府的干扰或操纵。


    ### **密码学**（Cryptography）：它是对安全通信技术的研究，允许消息的发送者和预期接收者查看其内容。在加密过程中，使用密钥对数据进行加密，然后将加密后的消息和密钥一起发送给接收者进行解密。加密算法是区块链的基础。


    ### **密码朋克**（Cypherpunk）：指任何主张广泛使用高级加密和隐私增强技术作为社会政治变革途径的个人。密码朋克至少从 20 世纪 80 年代后期就开始参与一项活跃运动。


    ### **DAO**：代表去中心化自治组织（Decentralized Autonomous Organization），是指组织和管理组织的方法，利用智能合约和区块链技术为组织提供透明性、不可篡性、自主性和安全性。在
    DAO 中，成千上万的人会自主决定针对该组织设立的特定项目的决策。


    ### **DApp**：去中心化应用（`DApp`、`dApp`、`Dapp` 或 `dapp`）是一种运行在去中心化计算机系统上的计算机程序。DApps
    通过 `Ethereum` 等分布式账本技术（`DLT`）使用智能合约变得流行。


    ### **去中心化金融**（Decentralized Finance）：见 `DeFi`。


    ### **DeFi**：去中心化金融，或 `DeFi`，是一种让金融产品在公共去中心化区块链网络上变得可用的系统。这使得任何人都可以使用，而不是通过银行等中介机构。


    ### **破坏性创新**（Destructive innovation）：这是一种创造新市场和价值网络，并最终杀死现有市场和价值网络的创新。该术语由美国学者
    `Clayton M.Christensen` 于 1995 年首次使用。


    ### **数字钱包**（Digital Wallet）：见 `Wallet`。


    ### **分布式账本**（Distributed Ledger）：见 `DLT`。


    ### **DLT**：代表分布式账本技术（Distributed Ledger Technology）。`DLT` 是一种基于分布式账本的系统，即网络的所有节点都拥有数据库的副本，各个节点可以独立地读取和修改。


    ### **双重花费**（Double-spending）：在 `PoW` 共识机制的背景下，它代表数字货币可能由于 51% 攻击而被花费两次的风险。


    ### **ECDSA**：代表椭圆曲线数字签名算法（Elliptic Curve Digital Signature Algorithm），是一种加密算法。`ECDSA`
    算法被认为是实现数字签名系统的安全标准。它们今天的应用非常广泛，几乎应用于所有信息技术领域。例如，互联网的 `SSL` 和 `TLS` 安全证书基础设施大量使用了
    `ECDSA`。


    ### **EIP-20**：缩写 `EIP` 代表以太坊改进提案（Ethereum Improvement Proposal），这是一份向以太坊社区提供信息的文档，或描述
    `Ethereum` 及其进程或环境的新功能的文档，而 `20` 是该文档的递增编号。


    ### **认知不确定性**（Epistemic uncertainty）：指信息对决策者未知的不确定性，尽管事实已经确立且已知。这与随机不确定性形成对比，后者的事实尚未确立，并受未来将发生的随机随机过程的影响。


    ### **ERC-20**：`ERC-20` 代币是一种具有预定义数据结构的智能合约（`Smart Contract`）。该设施旨在便于在 `Ethereum`
    区块链上实现各种功能，让开发者更容易工作。缩写 `ERC` 代表以太坊意见请求（Ethereum Requests for Comments），而数字 `20`
    来自于描述它的 `EIP`（以太坊改进提案）。


    ### **以太坊**（Ether）：以太坊代币


    ### **以太坊**（Ethereum）：它是一个拥有自己的加密货币（`Ether`，`ETH`）和自己的编程语言（`Solidity`）的区块链平台。作为一个区块链网络，`Ethereum`
    是一个验证和记录交易的去中心化公共账本。网络用户可以在平台上创建、发布、货币化和使用应用程序，并使用其加密货币 `Ether` 进行支付。业内人士将网络上的去中心化应用称为“dApps”。


    ### **ETF**：代表交易所基金（Exchange Traded Funds），它们是特殊的被动管理投资基金。购买 `ETF` 就像买一篮子股票。投资基金等同于将你的储蓄与其他投资者的资金放在一起，基金经理将用这笔钱购买你将投资的工具。投资表现将取决于基金所投资的所有单个工具的结果。


    ### **ETN**：代表交易型票据（Exchange-Traded Notes），这些金融工具与 `ETFs` 的不同在于它们不是基金，它们是根据发行公司的直接投资发行的，以复制趋势。


    ### **交易所**（Exchange）：你可以在其中购买和交易加密货币及 NFT 的平台。


    ### **恐惧贪婪指数**（Fear & Greed Index）：翻译成意大利语为恐惧与贪婪指数，由 `CNNMoney` 开发，用于衡量影响投资者愿意为股票支付的两种主要情绪。`恐惧贪婪指数`
    按每日、每周、每月和每年进行衡量。理论上，该指数可以评估股票市场是否定价合理。这基于一种逻辑：过度的恐惧会导致股价下跌，而过度的贪婪往往产生相反的影响。


    ### **法币**（Fiat currency）：法币是一种不挂钩黄金或银等大宗商品价格的国家货币。法币的价值在很大程度上取决于对发行机构的信任，该机构通常是国家或中央银行。


    ### **分叉**（Fork）：当一个区块连接到两个后续区块时发生分叉。分叉与双方必须使用共同规则来维护区块链历史有关。


    ### **Gas**：指的是在以太坊区块链平台（Ethereum Blockchain platform）上成功执行交易或合约所需的佣金或价格值。Gas
    以加密货币 `Ether`（`ETH`）的小额计价（通常被称为 `gwei`，有时也称为 `nanoeth`），`gas` 用于分配以太坊虚拟机（`EVM`）的资源，以便智能合约等去中心化应用程序能够以安全去中心化的方式执行。`gas`
    的确切价格由网络矿工之间的供需决定，矿工在 `gas price` 未达到其阈值时拒绝处理交易，而网络用户则寻找计算能力。


    '
