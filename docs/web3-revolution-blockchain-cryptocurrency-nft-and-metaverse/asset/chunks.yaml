    ## 7.3 NFT 的原理


    如今，`NFTs` 被认为是数字格式艺术世界的一种演进。购买与 `NFT` 链接的作品并不意味着严格意义上购买了作品。相反，主张该作品的权利是通过智能合约保证的。


    但这些作品是如何产生的呢？基本上，艺术家保存一个数字格式的照片或视频，这将对应一串数字。这个序列被压缩成更短的序列，即 `hash`。这个 `hash` 然后存储在
    `区块链` 中，并带有相关的时间戳。`NFT` 在内部跟踪哈希销售情况，直到第一次易手的创建者。通过这条反向路径，你可以获得 `Token` 真实性和所有权的证明，只要区块链活跃，作品的所有者就不需要联系中间人。


    此时有必要对知识产权进行澄清：`NFT` 的所有权并不内在保证代表 `Token` 的任何数字资源的版权或知识产权。虽然有人可能会出售代表其作品的 `NFT`，当
    `NFT` 所有权变更时，买家并不一定获得版权权限，因此原始所有者允许创建同一作品的多个 `NFT`。从这个意义上说，`NFT` 仅仅是版权之外独立的所有权证明。


