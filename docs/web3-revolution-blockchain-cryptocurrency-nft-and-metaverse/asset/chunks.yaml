- raw: '·    **Kyber Network[**\[37\]**](#part0000_split_077.html#_ftn37) (KNC)**:
    a protocol that allows users to exchange ETH and Token in a totally decentralized
    way, without having to use Exchange


    ·    **Aave[**\[38\]**](#part0000_split_077.html#_ftn38) (LEND)**: the protocol
    allows to lend and borrow a wide range of Cryptocurrencies. The accrued interest
    is distributed in the form of this native token.


    ·    **Synthetix (SNX)**[\[39\]](#part0000_split_077.html#_ftn39): Synthetix is
    a protocol for issuing synthetic assets, called Synth, which use the native SNX
    token as collateral. Users can convert Synth directly through a Smart Contract,
    without having to use Exchange. These synthetic assets represent cryptocurrencies,
    stocks and fiat currencies.


    We have seen how Ethereum has basically given way to the birth of a series of
    Cryptocurrencies based on the creation of Smart Contracts. What value do these
    cryptocurrencies have? The initial value is assigned thanks to an initial token
    offer, or ICO.


    ## 4.5 Initial Coin Offering (ICO)


    In the wake of Bitcoin, a series of different Blockchains have been born over
    the years, and consequently also a series of different cryptocurrencies. A digital
    currency market parallel and analogous to that of fiat currencies has therefore
    been created, i.e., currencies issued by the government not supported by physical
    commodities, such as gold or silver, but rather by the government that issued
    them (for example the US dollar, euro and other major global currencies) and that
    of the stock markets. In fact, thanks to the Foreign Exchange market, more commonly
    called forex, or currency market, it is possible to exchange different currencies,
    just as it is possible to trade shares in the stock market. In a completely similar
    way, it has become possible to exchange Cryptocurrencies through the Exchanges.


    The question we ask ourselves now is: **what value to assign to newly born cryptocurrencies?**


     The answer still lies in the analogy with the financial markets. When a company
    decides to go public, it must go through a so-called initial public offering.
    An initial public offering or IPO, is an offer to the public of the securities
    of a company that intends to go public for the first time on a regulated market.
    It is a complex phase that requires notions that are beyond our scope. However,
    it is worth underlining that it is necessary to carry out an evaluation of the
    company being listed.


    Similarly, in the Cryptocurrency market we proceed through an initial coin offering
    or ICO. However, the process is completely different from the IPO: it often takes
    place in the form of crowdfunding, although a private ICO that does not seek public
    investments is also possible. In an ICO, a quantity of Cryptocurrency is sold
    in the form of tokens to speculators or investors, in exchange for fiat currency
    or other Cryptocurrencies such as Bitcoin or Ether. ICOs can allow startups to
    avoid regulations that prevent them from seeking investments directly from the
    public and intermediaries such as venture capitalists, banks and stock exchanges,
    which may require greater control and a certain percentage of future profits or
    joint ownership.


    Furthermore, ICOs may fall outside existing regulations, depending on the nature
    of the project, or be banned altogether in some jurisdictions, such as China and
    South Korea. In fact, due to the lack of regulation and enforcement of securities
    law, ICOs have in the past been a vehicle for scams and fraud.


    Less than half of all ICOs survive four months after offering, while nearly half
    of ICOs sold in 2017 fail by February 2018. Despite their record failures and
    falling cryptocurrency prices, January to June 2018 was raised a record $ 7 billion
    via ICO.


    However, ICOs aren''t the only way to raise money in the cryptocurrency industry[\[40\]](#part0000_split_077.html#_ftn40).


    ## 4.6 Initial Exchange Offering (IEO) and Initial DEX Offering (IDO)


    If 2017 was the year of ICOs, 2019 is that of IEOs. An IEO is managed by an Exchange
    on behalf of the start-up that aims to raise funds. In return, the start-up has
    to pay listing fees and a percentage of the tokens sold through IEO. The relationship
    between Exchange and start-ups becomes symbiotic, as the former are incentivized
    to help the latter with marketing and promotions.


    An Initial DEX Offering (IDO) is similar to an IEO, except that IDOs are conducted
    on decentralized exchanges (DEX), while IEOs are conducted on centralized platforms.
    However, decentralized exchanges currently have very limited traction, so much
    so that many community members have questioned their usefulness[\[41\]](#part0000_split_077.html#_ftn41).


    In the following paragraph, we will provide a global overview of the top Cryptocurrencies
    by market capitalization as of this writing date. This will give us only a partial,
    but still effective, idea of the quantity and variety of proposals and solutions
    that each of these projects brings with it.


    ## 4.7 The main Cryptocurrencies on the market


    After having seen what a Cryptocurrency is (Coin and Token), what are the main
    benefits introduced by Bitcoin and what alternative Ethereum offers, in this paragraph
    we report some basic information relating to some of the main Cryptocurrencies
    in terms of market capitalization to date of writing this book. However, given
    the great volatility that characterizes the market, it would not be strange that
    at the time of reading some of these were no longer in the top positions and that
    they were ousted by others currently unknown. Many think it unworthy to take into
    consideration Cryptocurrencies with market capitalization beyond the 20th position,
    also by virtue of the so-called "pump and dump" mechanism, which consists in the
    creation of a false hype about a new Token by a group of people with the aim of
    generating interest. Once investors start buying it, its value increases. When
    the value reaches a certain point, the scammers behind the fake hype sell all
    their Tokens, causing the price to plummet, leaving new investors with a worthless
    Cryptocurrency (Shitcoin).


    Although much of this information can be found online completely free of charge
    on the main crypto sites, we believe it is useful to report it in a synthetic
    list to give way to those who are approaching this world for the first time discover
    the variety of offers and solutions. For more information on each Cryptocurrency,
    we recommend reading the accompanying Whitepaper, or inquiring about some reference
    sites such as:


    ·             [www.investopedia.com](http://www.investopedia.com)


    ·             [www.coinmarketcap.com](http://www.coinmarketcap.com)


    ### 4.6.1 Bitcoin[**\[42\]**](#part0000_split_077.html#_ftn42)


    Bitcoin is first presented in a 2008 Whitepaper by one person, or a group of people,
    using the alias Satoshi Nakamoto and launched shortly thereafter, in January 2009.
    Bitcoin was created, in Nakamoto''s own words, for allow *"to send online payments
    directly from one party to another without going through a financial institution"*.
    Some concepts for a similar type of decentralized electronic currency precede
    BTC, but Bitcoin has the distinction of being the first Coin to actually be used.
    Nakamoto has managed to create a global community and give birth to a whole new
    industry of millions of enthusiasts who create, invest, trade and use Bitcoin
    and other Cryptocurrencies in their daily lives. The emergence of Bitcoin created
    a conceptual and technological foundation that subsequently inspired the development
    of thousands of competing projects.


    The entire cryptocurrency market - which is now worth more than $ 2 trillion -
    is based on the idea realized by Bitcoin: money that can be sent and received
    by anyone, anywhere in the world, without relying on trusted intermediaries, such
    as banks. and financial services companies.'
