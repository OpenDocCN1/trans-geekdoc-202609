    ###### 2.5.2 Proof-of-Stake (PoS)


    `Proof-of-Stake` was devised in 2011 as a less expensive alternative to `PoW`.
    The first working use of `PoS` for cryptocurrency was `Peercoin` in 2012. The
    difference between the two consensus mechanisms is that, while in `PoW` miners
    use energy to validate transactions, in `PoS` blocks are validated by "validators"
    in proportion to the share of token held (`stake`). Validators are those who bind
    a certain amount of token as a guarantee for the right to verify transactions.
    The validators are chosen among the nodes of the network through an automatic
    selection process that takes into account a number of different factors. These
    factors may be different depending on the project; however, generally the following
    are taken into consideration:


    1. the amount of stake deposited

    2. the longevity of the stake (also called coin age, i.e., how long has the deposit
    been made)

    3. a randomization factor


    Of course, the higher the amount and the longer the time of stake deposited are,
    the higher the probability of being selected as validators, as higher and historically
    solid stakes have a greater degree of reliability and integrity. Furthermore,
    when a node is selected by the algorithm and coins a new block, its coin age is
    reset and a certain period of time will have to pass before it can be re-selected.
    This system prevents nodes with large stakes from dominating the `Blockchain`.


    Once a node is selected as the validator of the next block, it will have to check
    if the transactions it contains are valid, sign the block and add it to the `Blockchain`.
    This validation is known as an attestation. Validators get rewards for proposing
    new blocks and for certifying the ones they viewed. If a validator validates malicious
    blocks, it loses its `stake`.


    Unlike `PoW` systems, where the miners'' work is rewarded with the creation of
    a new block, in `PoS` systems... (Note: The source text provided contains some
