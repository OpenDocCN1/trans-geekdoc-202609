  trans: '


    -   **Decentraland**[133：这是一个基于以太坊区块链的去中心化平台。由阿根廷人 Ari Meilich 和 Esteban Ordano
    于 2015 年创立，最初只是一个通过 PoW 算法向用户分配像素的像素化网格。随后的后，从 2018 年 10 月开始，该平台演变为一个 3D 世界。它是如何运作的？在创建虚拟形象后，用户有机会在虚拟空间中购买和转卖土地块以进行建设。交易使用的货币是
    `MANA`，这是原生代币，与其他加密货币不同，它无法被挖掘，并且每当发生土地或其他用户可购买的商品交易时，它就会从区块链中移除。除了买卖土地，`MANA`
    还被用于购买数字内容、NFT、广告服务等。在本文写作时，`MANA` 的价值约为 3.14 美元，是市值第 28 大加密货币。几位投资者预计这一增长趋势将在未来几年持续下去，并在
    2025 年突破 15 美元[134


    -   **The Sandbox**[135：这是一个由 Arthur Madrid 和 Sebastien Borget 创立的平台，使用基于以太坊的去中心化虚拟现实，允许用户构建、拥有并货币化内容和应用程序。在这个虚拟现实中，用户可以购买地块，即每个
    96×96 米（虚拟）的土地块。使用的代币是 `SAND`，用于在平台的元宇宙中获取 NFT。该代币还可用于购买装备、自定义角色等。例如，装备意味着视频游戏
    X 中英雄的一把魔法剑、视频游戏 Y 中的特殊盔甲，或者仅仅是视频游戏 Z 中的一只宠物。至于角色的个性化，在这里我们讨论的是不同类型的鞋子、手套、夹克、帽子等。`SAND`
    目前市值位列第 39 位，价值为 4.94 美元[136


    -   **Enjin Coin**[137：经验丰富的区块链程序员 Maxime Blagov 在 2017 年注意到了优化在线游戏平台的需求，他与 Witek
    Radomski 一起构思并计划了 Enjin 项目的建立。Enjin 代表了一个复杂的生态系统，旨在为游戏玩家创建一个安全、快速且设计良好的环境。该项目旨在改进视频游戏的创作，确保程序员能够真正突出他们的想法和潜力，而不必被迫根据发行者的选择进行设计，同时保持高水平的安全，这在游戏和
    NFT 领域已开始代表一个日益重要的方面。目前，`ENJ` 代币市值位列第 65 位，价值为 2.34 美元


    -   **Velhalla**[138：最后，我们提到一个最近诞生的项目。事实上，它的`SCAN` 代币直到 2021 年 11 月 16 日才通过 IDO（去中心化平台的初始发售）开始可用。Velhalla
    的元宇宙提供了与其他现有基于元宇宙的项目类似的特性：事实上，可以利用不同的边玩赚（play-to-earn）游戏，通过自己的平台增加玩家的盈利潜力。提供的每个游戏都有自己的元宇宙，这使其比其他平台更独特。这些加密货币用于兑换游戏奖励和资产。`SCAN`目前排名第
    4332 位，价值为 0.08 美元


    很容易理解这种场景如何开启巨大且完全未被开发的机遇。然而，存在一些局限，特别是技术上的限制。让我们来看看有哪些。


    ## 8.6 目前的一些技术限制


    尽管许多技术已经在市场上可用，并且元宇宙的示例已经开发出来，但从技术角度来看，要保证用户必要的可用性还有很长的路要走。我们已经提到过第二人生平台上的技术问题，例如信息的图形处理。


    英特尔加速图形和处理团队（计算系统与图形小组）负责人之一 Raja Koduri 建议，需要非常强大的基础设施来建立 Meta 构想的元宇宙，估计其计算能力将是现在的
    1000 倍。这本质上是因为需要将一系列“人类”特征数字化，包括语音功能和人员的实时移动，所有数据都必须由用户佩戴的设备收集，该设备必须集成各种传感器。所有海量数据必须以极高的带宽和极低的延迟传输到云服务器，并在几毫秒内为数十万同时连接的用户提供服务。无论如何，英特尔最近表示他们正朝着这一方向努力，特别是开发用于元宇宙的新型图形处理器。然而，开发新硬件是不够的，还需要专门的算法、一种新架构（英特尔已将其称为`Xe`）、新的软件工具和开放开发库。Koduri
    最终对实现现实元宇宙的技术可行性表示乐观，尽管这可能需要几年[139


    其他技术限制涉及虚拟现实和增强现实。事实上，我们已经看到使用这些设备会给用户带来不适，如虚拟现实症、眼睛疲劳和头晕。如果我们每天都要使用这些设备，这些问题必须找到解决方案。


    ## 8.7 元宇宙的争议方面


    第一个方面是缺乏互操作性和标准。在许多公司可以创建自己的私有元宇宙的情况下，例如访问需要由销售的 NFT，将产生许多互不通的“领域”，一种新的数字中世纪。


    第二个方面是可用性，这是一个一直悬而未决的问题：事实上，我们已经看到在使用虚拟现实和增强现实时，这些设备会产生头晕或眼睛疲劳。


    第三个方面是监管，这是一个在第三章中讨论过的问题。事实上，立法者的干预已迫在眉睫。哈佛商学院教授 Shoshana Zuboff[140 提出了如何组织和治理数字世纪的信息通信空间的问题。例如，如果物理世界中成瘾物质受到严格监管，为什么元宇宙中的成瘾数字服务不受限制呢？


    # 9. Web3 革命


    **9.1 前章节总结 **


    **9.2 采用新技术 **


    **9.3 真正的去中心化**


    **9.4 什么样的未来场景？ **


    **本章总结**


    '
