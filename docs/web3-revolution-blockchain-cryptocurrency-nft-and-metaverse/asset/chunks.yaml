    ### 章节总结


    **区块链技术在不同领域有许多应用，特别得益于智能合约。在本章中，我们将提供概述以及一些示例和应用。**


    如今的区块链代表了一种普通大众对其机制仍鲜为人知的技术，除非考虑到与加密货币的联系（人们经常将两者混淆）：2021 年加密货币市场的爆发了投资者对这一高度投机市场的关注。尽管如此，区块链技术从不同角度为实际问题提供了具体的解决方案。


    根据安永合伙人兼 EMEIA 区块链负责人 Giuseppe Perrone 的说法：“区块链技术对公司业务和公共服务演进具有巨大价值，但要具体利用这一价值，有必要在技能开发、行业监管以及特定用例的创新能力方面下功夫。”公司领导
    Paul Brody 似乎对区块链技术在公司的未来没有怀疑，他宣布：“*区块链对业务网络和业务生态系统所做的作用，就像过去 ERP 对单个企业所做的那样。使用区块链改进供应链管理不仅确保了所有公司的公平竞争场域，还意味着能够提供更高质量的信息，允许他们做出更好的决策[**73]](#part0000_split_077.html#_ftn73)*。”


    在本章中，我们将看到区块链如何在不同现实和背景下解决问题的具体示例。


    ## 6.1 智能合约


    智能合约代表人与人之间的协议，在没有中介（如公证处）的情况下，通过计算机系统直接进行验证，以去中心化且安全的形式通过。这意味着如果一方违反合约，区块链将自动执行先前的协议或执行任何其他义务。以太坊创始人
    Vitalik Buterin 这样解释这一概念：


    “在智能合约方法中，资产或货币被转移到一个程序中，程序运行该代码并在某个点自动验证条件，并自动确定资产应该是给某人还是退还给发送者。同时，去中心化账本还会存储并复制该文档，使其具有某种安全性和不可篡改性。[**74]](#part0000_split_077.html#_ftn74)”


    以太坊网络的开发主要是为了允许用户开发这类合约。其优势显而易见：


    - 智能合约适用于任何类型的交易，而不只是财务。我们讨论的是商品、服务、协议等的交换。

    - 不需要中介来确保合约的性。成本更低，执行更快。

    - 确保合约执行，因为其执行被委托给了算法。


    ### 6.1.1 智能合约与 DAO


    得益于区块链和智能合约，去中心化自治组织 (DAO) 开始传播，最初作为一个简单的概念，被构想为通过智能合约和区块链的所有基本原理实现业务功能和流程的组织。核心思想是扁化各种组织陷入的复杂业务流程，并促进资产向未来的数字互动移动，这种互动不需要中介，并承诺提供更快、更廉价的交易处理。


    ## 6.2 银行与去中心化金融 (DeFi)


    去中心化金融意味着什么？根据维基百科：


    “*去中心化金融（通常被称为 DeFi）是一种金融系统的实验性形式，它不依赖于中央金融中介（如经纪人、交易所或银行），而是使用区块链上的智能合约。DeFi
    平台允许人们向他人借贷资金、利用衍生品对各种资产的价格进行投机、交易加密货币、对冲风险以及在储蓄账户中赚利。[**75]](#part0000_split_077.html#_ftn75)
    *”


    '
