  fmt: '

    In the previous chapters we described the main technologies underlying the concept
    of Web 3.0, or Web3, focusing in particular on the `Blockchain`, a decentralized
    architecture capable of revolutionizing the structure of the web as we know it,
    without forgetting the consequences that can arise from it also, from a socio-economic
    point of view. In this final chapter we will make some considerations about what
    future scenarios await us.


    **Keywords**: Web3, decentralization, new technologies, future scenario


    ## 9.1 Summary of previous chapters


    Trying to summarize what we have seen in the previous chapters, we can say that
    Web 3.0 essentially represents the evolution of Web 2.0, in which the user will
    not only be seen as a buyer or an entity from which to obtain the greatest amount
    of information from reuse in every possible form, but thanks to the decentralization
    of the network, it will be able to be the owner of its own data without the need
    for a central controlling body.


    This scenario will be possible on the basis of a decentralized IT architecture,
    the `Blockchain`. As we have seen, thanks to the `Blockchain`, users will be able
    to carry out transactions, for example, exchange digital money such as `Bitcoin`,
    sign smart contracts and purchase services without the need for intermediation,
    radically reducing the time and associated costs and at the same time maintaining
    a level of security and transparency otherwise not possible. Cryptocurrencies
    could therefore establish themselves as the first trading currency and supplant
    fiat currencies as they cannot be manipulated and incensurable, while at the same
    time acting as a store of superior value to other assets such as gold. Through
    Cryptocurrencies it is already possible to trade Non-Fungible Tokens (`NFT`),
    or unique digital objects, such as works of art, which are the subject of a market
    still in an embryonic phase, but according to many insiders with enormous opportunities.
    Finally, everything could take place in a virtual environment that is likely decentralized,
    immersive or not, thanks to technologies such as `Virtual and Augmented Reality`,
    in the `Metaverse`. In this sense, the boundary between "real" and virtual reality
    would become increasingly blurred, in favor of new opportunities and still unexplored
    scenarios in this case as well.


    ## 9.2 Adopt new technologies


    Are we facing utopian or dystopian scenarios? In recent years, more and more authors
    and film producers are focusing their attention on future scenarios allowed by
    the use of these technologies. The real problem is the one revealed at the beginning:
    technology advances but our condition as "creatures of habit" does not help us
    to adapt to the consequences of their diffusion, consequently creating an ever-greater
    gap between what is possible and what is possible. communities actually adopt.


    This problem is actually not recent: in fact, as early as 1959 the German philosopher
    Martin Heidegger was writing[`141`](#part0000_split_077.html#_ftn141):


    “What is truly disturbing is not that the world turns into a complete domain of
    technology.


    *Far more disturbing is that man is not at all prepared for this radical change
    in the world.*


    *Far more disturbing is that we are not yet able to reach, through a meditating
    thought, an adequate comparison with what is really emerging in our age.”*


    The large-scale adoption of one technology rather than another can take place
    on the basis of different mechanisms: it can be stimulated by the so-called network
    effect (see Glossary), it can be encouraged at a centralized level, for example
    by laws of state governments (see the case of El Salvador for `Bitcoin`), or it
    can even be discouraged at the community level, as in the case of the Amish or
    some indigenous peoples, who deliberately choose not to use some modern forms
    of technology.


    Furthermore, a technology can spread regardless of whether it is the best on the
    market, as evidenced by some practical examples. An example is that the layout
    of `QWERTY` keyboards, which became a standard at the time of analog typewriters
    instead of the `Dvorak` layout, designed to speed up typing in digital systems.
    In this case we enter the field of epistemic uncertainty: it is known that the
    `Dvorak` is better than the `QWERTY`, however it was decided to use the latter.


    A similar thing could happen with the `Blockchain`, in which one standard (for
    example `Bitcoin`) could be preferred to another (for example `Ethereum`) although
    it may be technically inferior. Among other things, this is what happened with
    the `TCP / IP` protocol at the basis of the Internet: certainly not the best,
    but now a standard in all respects.


    ## 9.3 A true decentralization?


    Of course, not all that glitters is gold and scenarios like the ones described
    also carry significant risks. One of the main ones would be the lack of centralized
    control bodies to ensure compliance with laws globally. But what if it is the
    controller who does not comply with the laws? This, as we saw in the introductory
    chapter in reference to the `Snowden affair`, has actually already occurred but
    it is only the tip of the iceberg.


    To date, in fact, there is no certainty that this is not repeating itself or cannot
    occur again, regardless of the government that takes control of the information.


    **The question we ask ourselves at this point is: better a centralized or a decentralized
    society?**


    A decentralized corporate structure, meaning that it does not have central regulators
    such as a government (if not possibly `DAOs`) could help criminal organizations
    escape scrutiny. A concrete example to date is provided by the `P2P` file sharing
    network through which it is possible to exchange files subject to Copyright with
    very minimal risks. We have also seen that in the case of `Second Life`, scenarios
    of this type could also lead to the uncontrolled proliferation of inappropriate
    content, linked for example to the world of child pornography.


    As pointed out by Silvio Micali, professor at MIT and founder of `Algorand`, in
    an interview with Marco Montemagno, the real problem in solving the centralization
    of `Blockchains` lies in the consensus algorithm. In fact, we have seen that the
    main `PoW` and `PoS` mechanisms actually centralize power, once again, in the
    hands of those who have more economic resources. In fact, in the `PoW`, the validation
    of the blocks is in the hands of the miners, to a greater extent than their available
    computing power, or the hardware in their possession. Similarly, in the `PoS`
    the power to validate blocks tends to focus on who has the largest stakes.


    A true decentralized `Blockchain` will therefore have to guarantee a mechanism
    that gives the same possibility to anyone, regardless of their economic power,
    to add blocks to the chain, while guaranteeing the necessary security. Consequently,
    the system can only be considered secure if most of the users involved, or at
    least the users responsible for validating the blocks, are honest.


    **The question can therefore be rephrased as follows: we would have greater confidence
    in being governed by a decentralized system, assuming that most of the people
    involved act honestly, or by a centralized society, in which a group of people
    take control?**


    ## 9.4 What future scenarios?


    For these reasons, Web 3.0 represents a real revolution in different social and
    business contexts. Web3 as a technological paradigm aims to provide binaries for
    the creation, tokenization and movement of value and resources.

    '
  trans: '


    在之前的章节中，我们描述了 Web 3.0（或 Web3）概念的核心技术，特别关注了 `Blockchain`（区块链）。这是一种去中心化的架构，能够彻底改变我们所知的网络结构，同时也没有忽视它从社会经济角度可能带来的后果。在最后一个章节章中，我们将对等待着我们的未来场景进行一些思考。


    **关键词**：Web3、去中心化、新技术、未来场景


    ## 9.1 之前的章节总结


    尝试总结我们在之前章节中看到的内容，我们可以说，Web 3.0 本质上代表了 Web 2.0 的演进。在这种演进中，用户不仅被视为买家或从各种可能形式的重复利用中获取最大信息的实体，而且益于网络的去中心化，用户将能够成为自己数据的所有者，而不需要中央控制机构。


    这种场景将在去中心化的 IT 架构——`Blockchain`的基础上得以实现。正如我们所看到的，得益于 `Blockchain`，用户将能够交易，例如交换
    `Bitcoin` 等数字货币、签署智能合约并在无需中介的情况下购买服务，从根本上减少了时间和相关成本，同时维持了在其他情况下无法实现的安全性和透明度。因此，加密货币可能成为第一种交易货币，并取代法定货币，因为它们无法被操纵和审查，同时作为优于黄金等其他资产的价值存储载体。通过加密货币，已经可以交易非同质化代币（`NFT`）或独特的数字对象（如艺术品），这些处于一个仍处于胚胎阶段的市场，但根据许多业内人士的说法，其中充满了巨大的机遇。最后，这一切都可能在一个虚拟环境中发生，无论它是去中心化的还是沉浸式的，得益于
    `Metaverse`（元宇宙）中 `Virtual and Augmented Reality` 等技术。从这个意义上说，“现实”与虚拟之间的边界将变得日益模糊，在这个领域也带来了新的机会和尚待探索的场景。


    ## 9.2 采用新技术


    我们面临的是乌托邦式还是反乌托邦式的场景呢？近年来，越来越多的作者和电影制人开始关注使用这些技术所允许的未来场景。真正的问题正如开头揭示的那样：技术在进步，但我们作为“习惯性生物”的状况无助于我们适应其扩散带来的后果，导致在可能实现的与社区实际采纳的之间产生了越来越大的鸿沟。


    这个问题其实并不新鲜：事实上，早在 1959 年，德国哲学家马丁·海德格尔（Martin Heidegger）就曾写道[`141`](#part0000_split_077.html#_ftn141）：


    “真正令人不安的不是世界变成了一个完全的技术领域。


    *更令人不安的是，人类对世界的这种根本性变化根本没有做好准备。*


    *更令人不安的是，我们还无法通过沉思的思考，与我们时代真正出现的东西进行恰当的比较。”*


    一种技术而非另一种技术的大规模采用可以在不同的机制的基础上发生：它可以受到所谓的“网络效应”（参见词表）的刺激，可以在中心化层面得到鼓励（例如通过国家政府的法律，参见萨尔瓦多采用
    `Bitcoin` 的案例），或者甚至可以在社区层面受到阻碍，例如安米士人或一些原住民，他们刻意选择不使用某些现代形式的技术。


    此外，一项技术的传播无论它是否是市场上最好的，正如一些实际例子证明了这一点。一个例子是 `QWERTY` 键盘的布局在模拟打字机时代成为标准，而不是为了提高数字系统输入速度设计的
    `Dvorak` 布局。在这种情况下，我们进入了认知不确定性领域：众知道 `Dvorak` 比 `QWERTY` 好，但决定使用后者。


    类似的情况也可能发生在 `Blockchain` 上，其中一种标准（例如 `Bitcoin`）可能被优于另一种标准（例如 `Ethereum`），尽管它在技术上可能稍逊一筹。除此之外，这也是互联网基础
    `TCP / IP` 协议发生过的情况：它无疑不是最好的，但现在在各方面都是标准。


    ## 9.3 真正的去中心化？


    当然，并非所有闪光的都是金子，像描述的场景也伴随着巨大的风险。主要的风险之一是缺乏全球性的中央控制机构来确保遵守法律。但如果控制者本身不遵守法律呢？正如我们在引言章节引用
    `Snowden affair`（斯诺登事件）时提到的，这实际上已经发生，但只是冰山一角。


    事实上，目前无法确定这不会重演或再次发生，无论由哪个政府控制信息。


    **我们在这个节点问自己的问题是：一个集权的社会还是去中心化的社会更好？**


    一个去中心化的公司结构，意味着它没有像政府这样的中央监管机构（可能是 `DAOs`），这可能帮助犯罪组织逃避审查。到目前一个具体的例子是 `P2P` 文件共享网络，通过该网络可以以极小的风险交换受版权保护的文件。我们还看到，在
    `Second Life` 的情况下，这类场景也可能导致不当内容的不受控扩散，例如与儿童色情内容的世界有关。


    正如麻理工学院教授、`Algorand` 创始人西尔维奥·米卡利（Silvio Micali）在接受 Marco Montemagno 采访时所指出的，解决
    `Blockchains` 中心化问题的真正困难在于共识算法。事实上，我们看到主要的 `PoW` 和 `PoS` 机制实际上将权力集中在拥有更多经济资源的人手中。事实上，在
    `PoW` 中，区块验证在矿工手中，很大程度上取决于他们的计算能力或拥有的硬件。同样，在 `PoS` 中，验证区块的权力倾向于持有权益最多的人。


    因此，一个真正的去中心化 `Blockchain` 必须保证一种机制，让无论经济实力如何，任何人都有机会向链上添加区块，同时保证必要的安全性。因此，只有当大多数参与用户（或至少是验证区块的用户）是诚实的时候，该系统才能被认为是安全的。


    **因此，问题可以重新表述为：假设大多数参与的人都是诚实的，我们是更倾向于由一个去中心化的系统治理，还是由一个群体控制的集权社会治理？**


    ## 9.4 什么样的未来场景？


    由于这些原因，Web 3.0 在不同的社会和商业背景下代表了一场真正的革命。Web3 作为一种技术范式，旨在为价值和资源的创造、代币化和移动提供底层支持。


    '
