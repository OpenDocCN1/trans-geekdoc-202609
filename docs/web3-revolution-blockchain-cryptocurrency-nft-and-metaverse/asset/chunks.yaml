- raw: "Similarly, the current fiat currencies managed by national governments are\
    \ undergoing a slow but steady inflationary process (in some cases not so slow,\
    \ such as the cases of hyperinflation in Zimbabwe and Venezuela), gradually losing\
    \ their value: 1 US dollar in the 1970 had the same purchasing power of $ 6.59\
    \ in 2019, with an inflation rate of change of 558.63%[\\[2\\]](#part0000_split_077.html#_ftn2).\
    \ \n\nHow to avoid the devaluation of national currencies?\n\n*The centralization\
    \ of information and data*\n\nResuming the comparison with the second industrial\
    \ revolution, today, in the digital age, we are witnessing a phenomenon similar\
    \ to what happened with the centralization of production activities in factories,\
    \ but this time on the basis of information and data. In his book \"The Fourth\
    \ Industrial Revolution\"[\\[3\\]](#part0000_split_077.html#_ftn3), Klaus Schwab,\
    \ founder and executive president of the World Economic Forum, while discussing\
    \ the impact of new digital technologies on people's lives, presents an interesting\
    \ picture: whether the three largest social media sites were countries, they would\
    \ be in the top 10 of the most populous nations. Furthermore, in the first place\
    \ we find a country of the social media category, without considering that these\
    \ three social networks are all part of Meta Platforms Inc. In addition, if we\
    \ consider Google, the largest search engine in the world, Microsoft, the largest\
    \ provider of operating systems, Samsung, which holds the primacy of the smartphone\
    \ market share and finally if we add to this analysis also the world server market,\
    \ divided between the American giants Dell, Hpe, Inspur and the big Chinese Huawei\
    \ and Lenovo, it is easy to understand how information, true gold of the new millennium,\
    \ is centralized in the hands of a few corporations.\n\n*The Big Brother*\n\n\
    In the novel \"1984\" the English writer George Orwell describes a society in\
    \ which each individual is constantly monitored by the authorities. The Big Brother,\
    \ as the fictional character is called, is not known whether he is an existing\
    \ person or simply a symbol created by the party. However, in 2013 the big brother\
    \ became not just a character in a science fiction novel, but something absolutely\
    \ real through the work of the main world power: the United States. The discovery\
    \ of a centralized mass surveillance system, in which information technology was\
    \ used by the NSA[\\[4\\]](#part0000_split_077.html#_ftn4) to monitor every citizen\
    \ on a global scale in the name of national security, breaking all international\
    \ privacy laws, became public thanks to whistleblower Edward Snowden. It was clear\
    \ that data centralization was a formidable tool of power and control for anyone\
    \ with access to it. However, as it turned out, everything happened in the total\
    \ unawareness of the citizens.\n\nWill it be possible, in the future, to prevent\
    \ situations of this type from happening again?\n\n*Web3*\n\nIf in the case of\
    \ industrial revolutions, we can identify four distinct phases that occurred historically\
    \ over the course of just over two centuries, in the field of information technology\
    \ the transformations occur at hypersonic speeds. Although the World Wide Web\
    \ officially dates back to 1990, when CERN published the first web page in history\
    \ on December 20, we can already distinguish three distinct phases of the evolution\
    \ of the web in just 30 years. Web 1.0 spread substantially between 1991 and 2004.\
    \ In Web 1.0 the vast majority of users simply acted as a consumer of content\
    \ and the first personal web pages spread. The term Web 2.0, on the other hand,\
    \ was coined in 1999 by Darcy DiNucci in her article \"Fragmented Future\"[\\\
    [5\\]](#part0000_split_077.html#_ftn5): in Web 2.0, the user becomes an active\
    \ part of the web, being invited to contribute to the contents of the sites by\
    \ commenting on the articles published or by creating a user account or profile\
    \ on the site in question, allowing greater participation. The main features of\
    \ Web 2.0 include social networking websites, self-publishing platforms (for example,\
    \ WordPress blogs and website building tools), \"tagging\" (which allows users\
    \ to tag sites, photos or videos), \"likes\" buttons and social bookmarking. The\
    \ interface also changes: the use of mobile devices such as smartphones or tablets\
    \ instead of desktop workstations becomes increasingly common. \n\nWhat about\
    \ Web 3.0? The term, also known as \"Web3\", was coined in 2014 by Ethereum co-founder\
    \ and Polkadot creator Gavin Wood. Web3 revolves around the idea of a decentralized\
    \ Internet as opposed to Web 2.0, where large amounts of web data and content\
    \ are centralized in a fairly small group of companies often referred to as the\
    \ Big Techs: Alphabet (Google), Amazon, Apple, Meta (Facebook) and Microsoft.\n\
    \n![](images/00001.jpeg)\n\nFigure 1: history of Internet, from web 1.0 to web\
    \ 3.0. Source: Cointelegraph\n\nHowever, being a relatively new term, the meaning\
    \ of Web3 is still not entirely clear, even if there is some convergence in considering\
    \ it as a new frontier of the web based on Blockchain technologies, such as Cryptocurrencies\
    \ or Non-Fungible Tokens (NFT). Decentralized Finance (DeFi) represents another\
    \ key concept, where users can exchange currency without the involvement of the\
    \ bank or the government.\n\n*New upcoming scenarios*\n\nBlockchain, Cryptocurrencies\
    \ and NFT are therefore highly interconnected and highly topical technologies\
    \ and applications. However, for the vast majority, they still represent unknown\
    \ concepts, or at least unclear, consequently generating strong skepticism and\
    \ hesitation in the moment of a possible implementation in real contexts or investment.\n\
    \nAccording to a recent survey conducted during the EY Blockchain Summit[\\[6\\\
    ]](#part0000_split_077.html#_ftn6), key top managers were asked what the level\
    \ of knowledge was regarding this technology. On a sample of 100 large companies,\
    \ the level of knowledge was 48 on a scale from 1 to 100. However, Blockchain\
    \ is considered among the three technologies with the highest impact on the business\
    \ by those who know it: 57% would like to implement it in the company.\n\nFinally,\
    \ with the birth of Meta Platform Inc., formerly Facebook, in October 2021, the\
    \ concept of Metaverse is gaining ground. As we will see, the basic idea of the\
    \ Metaverse is to interact and form relationships with other agents in a completely\
    \ virtual world through the use of avatars. This concept integrates perfectly\
    \ with Blockchain technology and with the use of Tokens, whether they are Cryptocurrencies\
    \ or NFTs, as a means of exchange in the virtual world, guaranteeing the decentralization,\
    \ privacy and security typical of the Blockchain infrastructure.\n\n*New technologies\
    \ adoption*\n\nWe certainly live in a complex world, in which technology is evolving\
    \ at an increasingly fast pace and in which people find it difficult to keep up\
    \ with it. However, this should not surprise us: after all, we are creatures of\
    \ habit, where change pushes us towards a condition of risk outside our comfort\
    \ zone. Changing means taking risks. However, there is no improvement without\
    \ change and there is no change without risk. For this reason, adopting a new\
    \ technology or investing in new assets is risky, especially if they are based\
    \ on unfamiliar and often complicated concepts. As we will see, Blockchain, Cryptocurrencies\
    \ and NFT refer to complex algorithms, cryptography concepts and distributed networks\
    \ that although we already have several years behind us, therefore a certain level\
    \ of maturity, however they have not yet reached full diffusion as regards their\
    \ use."
