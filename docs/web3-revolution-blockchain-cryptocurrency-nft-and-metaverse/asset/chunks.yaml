- raw: " Fiat currencies are essentially virtual currencies and, since 1971, not constrained\
    \ by gold / currency convertibility. Indeed, the sudden decision of the American\
    \ president, announced on TV on the evening of August 15, 1971, marked the end\
    \ of the post-war international monetary system, created at the Bretton Woods\
    \ conference.\n\nBitcoin aims to become a digital currency by taking the main\
    \ benefits of gold and fiat currency, namely:\n\n·             the **non-manipulability\
    \ of the monetary offer** by central entities. Bitcoin is based on Blockchain,\
    \ a database that is decentralized by nature. Governments cannot have control\
    \ over it, for example by creating hyperinflation. Let's think for example of\
    \ the case of Zimbabwe[\\[28\\]](#part0000_split_077.html#_ftn28) or Venezuela,\
    \ with decreases in purchasing power on savings of up to 30% per week[\\[29\\\
    ]](#part0000_split_077.html#_ftn29). However, the West is not exempt from inflation:\
    \ 1 US dollar in 1970 had the same purchasing power of 6.59 dollars in 2019, with\
    \ an inflation rate of change over this period of 558.63%[\\[30\\]](#part0000_split_077.html#_ftn30)\n\
    \n·             **privacy** on the use of currency (think of countries with limited\
    \ freedom, such as Afghanistan, where women cannot even open a bank account)\n\
    \n·             **it can be virtualized**, as it can be exchanged in electronic\
    \ form, therefore easily transportable and usable\n\n·             **it is safe**,\
    \ as it is subject to the immutability and security rules of the Blockchain\n\n\
    Bitcoin adds another solution to the problems of the digital age: the centralization\
    \ of data by entities that monitor the exchange of money. In fact, payments are\
    \ among the most sensitive information ever, however the new forms of digital\
    \ payment that have emerged in recent years such as Apple Pay, PayPal, Google\
    \ Pay and Stripe, just to name the most famous, collect sensitive data that can\
    \ then be resold. This information can become a form of control if not properly\
    \ managed. An example? On June 14, 2011, WikiLeaks decided to accept donations\
    \ in Bitcoin after the boycott of Amazon, PayPal, Visa, MasterCard, Bank of America\
    \ and Western Union, which suddenly decided to cut off any possibility of donating\
    \ to WikiLeaks under pressure from the United States government, such as reported\
    \ by Stefania Maurizi in her book \"Il potere segreto \"[\\[31\\]](#part0000_split_077.html#_ftn31)\
    \ (“The secret power”).\n\n### 4.3.1 How does Bitcoin be worth thousands of Dollars?\n\
    \nIn the introductory chapter we mentioned the fact of Laszlo Hanyecz who, on\
    \ May 22, 2010, bought two pizzas worth $ 30 in a small town in Florida for 10,000\
    \ Bitcoins. **This was the first price given to Bitcoin in history, with an exchange\
    \ rate of 1 BTC = $ 0.003.** Today, almost 12 years later, those two pizzas are\
    \ earning an equivalent value of around 400 million dollars to the lucky pizzeria.\
    \ But what is the mechanism by which a virtual asset, initially without any value,\
    \ suddenly becomes a store of value?\n\n**In other words, who determines the price\
    \ of Bitcoin?**\n\nThe price is determined by all those who want to participate\
    \ in the buying and selling process, essentially its users. It sounds trivial,\
    \ but that's the way it is, although multiple factors play a role. In fact, miners\
    \ can propose a price when they sell their Bitcoins to interested parties: when\
    \ in a negotiation between two people, one proposes a price and the other is willing\
    \ to accept it, then the transaction is made. What we have just described is the\
