    \ delving into technicalities and complications that would only risk generating\
    \ confusion without letting the reader grasp the essence of the technology.\n\n\
    **Keywords**: decentralized network, block, hash, cryptography, ledger, consensus\
    \ mechanism, Proof of Work (PoW), Proof of Stake (PoS).\n\nThe elements of a public\
    \ and open Blockchain are basically the followings: \n\nThe elements of a public\
    \ and open Blockchain are basically the followings:\n\n**1.              A peer-to-peer\
    \ (P2P) network**, i.e., a distributed network that connects users participating\
    \ in the Blockchain and propagates blocks of verified transactions;\n\n**2.             \
    \ The blocks** of transactions verified by encrypted code;\n\n**3.             \
    \ A hash**, that is an algorithm to uniquely identify each block;\n\n**4.             \
    \ A cryptographic algorithm** to ensure security;\n\n**5.              A ledger**\
    \ distributed across the network to all nodes;\n\n**6.              A consensus\
    \ mechanism.**"
