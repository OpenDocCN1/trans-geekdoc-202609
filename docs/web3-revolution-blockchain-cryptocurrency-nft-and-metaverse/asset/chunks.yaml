    \ by adjusting their portfolios appropriately[\\[68\\]](#part0000_split_077.html#_ftn68).\n\
    \n### 5.4.4 Trading using technical analysis\n\nIf the investor decides to speculate\
    \ on this high market volatility that characterizes Cryptocurrencies, he could\
    \ have particularly interesting economic returns here too. In practice, to earn\
    \ in this way you must try to enter the market (therefore buy Tokens) at the moment\
