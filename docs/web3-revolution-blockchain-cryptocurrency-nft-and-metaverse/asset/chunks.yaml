  trans: '


    DeFi 经济目前的价值约为 1,000 亿美元。在这方面，纳斯达克决定创建一个指数（`DEFX`）来跟踪主要的 DeFi 产品。目前，有约 200 个 DeFi
    项目，其中 90% 利用了 `Ethereum` 网络。正如第 4 章所述，与银行相关的 `Cryptocurrencies` 非常受欢迎，因为其相关收益非常显著。例如，一笔国际交易可能需要
    4 个工作日，成本可能高达 2-5% 加上额外费用。`Ripple` 可以大幅降低成本。通过 `Ripple` 网络，事实上银行不仅可以更快地处理交易，而且成本会低得多，更不用说处理交易所需的人员减少。`Ripple`
    提供的另一个系统是 `xCurrent`，它已由桑德斯银行、`UBS`、美国运通、UniCredit、`BBVA` 等许多机构进行测试。`xCurrent`
    是一种可以在数秒内完成端到端交易的应用，得益于此，`Ripple` 估计节省高达 33% 的成本。显而易见，得益于去中心化金融，旧银行体系可能会发生革命性的变化，即使不是被完全取代：事实上，许多银行对使用这些
    IT 工具仍持怀疑态度，主要由于它们的波动性和不稳定性，这使得它们无法被大众使用来取代法定货币。


    在编写本文时，已有 509 个为 DeFi 应用创建的代币。下面列出了根据 `CMP` 按市值排的前 5 大 `Cryptocurrencies`：


    1. `Terra`**76**

    2. `Avalanche`**77**

    3. `Wrapped Bitcoin`**78**

    4. `Uniswap`**79**

    5. `Chainlink`**80**


    ## 6.3 汽车行业


    对使用 `Blockchain` 和 `Smart Contracts` 感兴趣的最大的行业之一是汽车行业。并不意外的是，几乎所有主要的汽车制造商，如 `VW`
    (`IOTA`)、`BMW` (`VeChain`)、`Daimler` 等已经在使用 `Cryptocurrencies`。


    在 2017 年，平均几乎每秒就有一辆车被租出去：所以，让我们想象一下现存合同的数量。如果此类合同发生在如 `Ethereum` 之类的 `Blockchain`
    上，就可以实现对支付的更好控制，同时减少人员成本（这些成本将不再是必要的）。但这只是可能发生情况的一小部分。`Volkswagen` 是 `IOTA` 的合作伙伴之一，他们的目标是变革汽车支付系统。让我们想象这样一个场景：一辆自动驾驶汽车在每次停车、通过高速公路收费站、重新充电时，都能执行微交易，而无需采取任何操作。例如，如果你停了车，汽车会根据你在该点停车的秒数精确付费；或者如果你进入收费公路，则仅精确收取行驶里程费用，以此类推。这可能是因为像
    `IOTA` 这样的加密货币被设计为在没有费用的情况下执行微交易。


    例如，一家名为 `CarVertical` 的初创公司寻求变革二手车市场。其理念是在 `Blockchain` 上保存每辆车辆，并保持 `Blockchain`
    关于发动机状况、里程、事故等信息的更新，以防止对二手车的犯罪操纵。这项技术可能会对整个行业产生巨大影响，因为在新款汽车的适应性方面还有进一步的可能。


    ## 6.4 供应链


    在我们运营的全球化系统中，供应链代表了公司最重要的几个方面之一。现代供应链网络非常复杂，因为它们通常需要许多国家的多个独立系统：货物在到达零售分销点之前会进入不同的关税区。由于这种复杂性，跟踪所有的移动和接触点变得困难。解决这种复杂性的解决方案可以是同时同步所有数据的去中心化网络。位置可以轻松访问所有供应链数据，并自动进行支付。探索这些机会的货币有
    `Origintrail`**81**、`Vechain`**82** 或 `Wabi`**83**。


    `Blockchain` 的另一个优势是改进货物注册，从而提高其可追溯性。如今，对于许多人来说，知道购买的食物或衣服来自哪里是关重要的，由于 `Blockchain`，这可以以极低的成本以高安全性实现（因此也具有防伪功能）。例如，想象一下意大利制造产品的市场：其中哪些实际上是
    100% 在意大利生产的？你可以通过检查 `Blockchain` 来回答这个问题。在该领域，`TE-Food`**84** 正在研究食品解决方案，即“从农场到餐桌的可追溯解决方案”。


    我们可以得出结论，`Blockchain` 在公司的供应链中有大量的应用，并可能成为一个转折点：它将在多大程度上影响我们尚有待观察。


    ## 6.5 商业航空


    `Blockchain` 在商业航空领域的益处描述于国际航空运输协会 (`IATA`) 于 2018 年发布的《航空领域的区块链》白皮书中[**85**]。简而言之，优势可以总结为以下几点：


    - **常旅客积分收集活动**：`Blockchain` 通过将这些资源代币化，能够显著简化常旅客积分，使其数字化并无处不在。

    - **行李、货物和零件管理**：`Blockchain` 以一种非常可靠且不可篡改的方式监控行李、货物和飞机零件的状态和位置。这为这些物品沿价值链的移动提供了提高可见性和透明度的机会。

    - **分销与支付**：`Blockchain` 使航空公司和旅行社在交付旅游产品和服务时能够更好地协作。

    - **乘客和机组身份管理**：`Blockchain` 可以通过改进体验、保护隐私并允许航空公司和更广泛的价值链在数字环境中运营来简化乘客身份管理。

    - **价值链中的智能合约**：航空公司和价值链中的其他参与者在合同、合同执行、履行监控、账单和结算方面投入了大量精力。利用智能合约的概念，这些努力可以消除或极大简化。


    ## 6.6 医疗健康


    与健康相关的个人信息是世界上最敏感的信息之一，因此对更安全、更私密的设施的需求一直很高。为此，`Blockchain` 提出的模型将是理想的：信息像交易一样发送到
    `Blockchain`，是匿名的，从而维护患者隐私。此外，一旦数据保存在 `Blockchain` 上，信息可以在不违反患者隐私的情况下用于研究和探索。如果患者需要看医生，她可以使用她的私钥提供所有的个人信息。结果将是患者拥有所有的医疗数据，并决定谁可以访问。这避免了个人数据泄露并保护了数据。


    在该领域已经有一些活跃的 `Blockchain` 项目，例如 `Medicalchain`**86** 或 `Medibloc`**87**。


    '
