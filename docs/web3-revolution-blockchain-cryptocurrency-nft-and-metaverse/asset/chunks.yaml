  trans: "\n\n显示器通常集成在智能眼镜、智能手机和平板电脑中。如今，平板电脑和智能手机在 AR 领域也非常常见且广泛使用。这些设备具备所有所需功能：便携且强大的\
    \ CPU、数字摄像头、GPS、惯性传感器和触摸屏。根据《时间》杂志的，增强现实和虚拟现实预计在未来 15-20 年内成为计算机交互的主流技术。\n\n软件必须从摄像头图像中提取真实世界的坐标。这一过程被称为图像配准，使用了不同的计算机视觉方法。增强现实标记语言（`ARML`）是一种专为\
    \ AR 开发的语言。为了实现增强现实应用的快速开发，已经开发了一些软件开发工具包（`SDKs`）。一些 AR SDK 由以下机构提供：\n\n*   `Vuforia`[\\\
    [129\\]](#part0000_split_077.html#_ftn129)\n*   `ARToolKit`[\\[130\\]](#part0000_split_077.html#_ftn130)\n\
    *   `Wikitude`[\\[131\\]](#part0000_split_077.html#_ftn131)\n\n以下是市场上一些主要增强现实设备的简要概述：\n\
    \n*   **Google Glass：** 尽管它未能进入消费市场，但谷歌在增强现实领域的医疗和制造应用取得了远更大的成功。该设备配备了宏勃的技术，包括用于音频输出的骨传导技术和棱镜投影显示器。Explorer\
    \ 版的继者 Google Glass 企业版放弃了骨传导技术，但相比之前的版本有了几项改进，包括 Intel Atom 处理器和压力计。\n*   **Microsoft\
    \ HoloLens**：HoloLens 被誉为世界上第一台完全无线的全息计算机，提供开发版和商业套件两种配置。位于北美的公司还可以选择通过微软合作伙伴租用\
    \ HoloLens。当前版本的 HoloLens 具有 35° 的 FOV（视场），但微软最近一项关于 MEMS 激光扫描器的专利可以将下一代 HoloLens\
    \ 的 FOV 增加到 70°。\n\n![Microsoft HoloLens&#39' Revealed, an Untethered See-through\
    \ AR Headset – Road to VR](img/00031.jpeg)\n\n图 31：Microsoft HoloLens 头设备\n\n\
    *   **VUZIX M100 & M300 智能眼镜：** Vuzix 成立于 1997 年，在增强现实行业拥有悠久的历史。其目前适用于工业应用的产品是\
    \ M100 和 M300 智能眼镜。M300 标记具有先进的功能，两者之间存在一些重要差异。例如，M100 的对角 FOV 为 15°，而 M300 为\
    \ 20°。\n*   **DAQRI 智能眼镜：** 作为公司增强现实硬件的最新迭代，DAQRI 智能眼镜专为专业用途设计。该设备基于第 6 代 Intel\
    \ Core m7 处理器，使用两个 LCoS 光学显示，提供了 44° 的对角 FOV。它带有 Worksense Standard，这是 DAQRI 用于\
    \ AR 活动的应用程序套件。\n\n### 8.4.3 与使用 VR 和 AR 相关的问题\n\n然而，虚拟现实和增强现实并非没有问题。其中一些包括：\n\
    \n*   **用户界面：** AR 的主要挑战之一是提高视场（FOV）、亮度、显示质量、延迟等。例如，在 FOV 方面，即使是最好的 AR 设备也只能提供\
    \ 90 度。与人类正常视觉的 190 度水平和 120 度垂直 FOV 相比，该技术现状与目标之间的差距变得显而易见。\n*   **健康问题：** 过度使用\
    \ AR 和 VR 设备（下一章描述）可能会导致一些健康问题，例如：\n    *   **虚拟现实症：** VR 头戴设备包含两个小型 LCD 显示器，每个投影在一只眼睛上，创造出立体效果，让使用户产生周围创建了一个人工环境的错觉。较长的屏幕聚焦时间会增加恶心和扭曲感，这种现象被称为虚拟现实症；\n\
    \    *   **眼睛疲劳：** 使用 AR/VR 观察器时，我们受环境限制在有限区域内，长时间观察并关注细节，导致眨眼频率倾向于低于正常水平。这会导致眼球前表面干燥和眼睛疲劳。\n\
    \    *   **眩晕：** 弱视（双眼视力不平衡）或其他抑制聚焦、深度感知或正常 3D 视觉的情况，在使用类设备时可能更容易出现头痛和眼睛疲劳。\n\n\
    ### 8.5 元宇宙、区块链、NFT\n\n我们已经看到虚拟现实和增强现实很可能是开发虚拟世界的两个主要技术。然而，如果这种未来愿景日益盛行，我们习惯于每天花几个小时沉浸在虚拟世界中，并使用能够通过显示数字信息来增强现实的设备，这意味着控制的可能性将更大。如果\
    \ Meta 已经通过社交媒体拥有了我们大部分的数据，让我们想象一下拥有整个虚拟世界的公司可以拥有多大的中心化权力。\n\n出于这个原因，`Blockchain`\
    \ 技术将允许保证必要的安全和隐私，而无需一个充当信息控制和集中者的中央机构。元宇宙因此可以充分利用去中心化网络来克服这些问题，带来我们在前面的章节中讨论过的所有收益和风险。在这种情况下，使用数字代币（即\
    \ `Bitcoin`、`Ether` 等）将成为商品交换和服务的最实用的解决方案。同样，元宇宙将成为使用由智能合约引入的所有去中心化解决方案的理想环境。\n\
    \n类似地，`NFT` 市场也可能经历指数级增长。正如《第二人生》（Second Life）的情况一样，在元宇宙中，我们可能可以通过去中心化平台购买并交易物品。让我们想象一下视频游戏的情况：以\
    \ `NFT` 形式购买的物品可以在一个平台上购买，但在其他多人平台上使用甚至交易。或者，通过增强现实，我可以在特定地点出售独特的虚拟广告空间（例如建筑、特殊地点等），当用户位于地点附近时，这些空间出现在他们的显示器上。\n\
    \n可以确定的是，元宇宙将会持续存在，否则公共和私营部门在该领域的投资将无法解释。例如，作为中国人口最密集的城市，上海正在寻找在未来五年在公共服务中使用元宇宙的方法。上海市经济和信息化产业发展规划列出了四个前沿领域，其中之一就是元宇宙。\n\
    \n我们在下面列了一些利用元宇宙理念的 `Blockchain` 项目（因此也是加密货币和 `NFT`），按市值（从高到低）排序[\\[132\\]](#part0000_split_077.html#_ftn132)：\n\
    \n"
