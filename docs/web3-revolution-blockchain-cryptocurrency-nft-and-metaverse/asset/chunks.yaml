- raw: "Displays are typically integrated into smart glasses, smartphones and tablets.\
    \ Nowadays, tablets and smartphones are also very common and widely used with\
    \ AR. These devices have all the required functionalities: portable and powerful\
    \ CPU, digital camera, GPS, inertial sensors and touch screen. According to Time\
    \ Magazine, augmented reality and virtual reality are expected to become the leading\
    \ technology for computer interactions in about 15-20 years.\n\nThe software must\
    \ derive the real-world coordinates from the camera images. This process is called\
    \ image registration and uses different computer vision methods. Augmented Reality\
    \ Markup Language (ARML) is a language developed specifically for AR. To enable\
    \ rapid development of augmented reality applications, some software development\
    \ kits (SDKs) have been developed. Some AR SDKs are offered by:\n\n·            \
    \ **Vuforia**[****\\[129\\]****](#part0000_split_077.html#_ftn129)\n\n·            \
    \ **ARToolKit**[****\\[130\\]****](#part0000_split_077.html#_ftn130)\n\n·            \
    \ **Wikitude**[****\\[131\\]****](#part0000_split_077.html#_ftn131)\n\nBelow is\
    \ a brief overview of some of the main augmented reality devices on the market:\
    \ \n\n·             **Google Glass:** While it failed to make its way into the\
    \ consumer market, Google's foray into augmented reality found considerably greater\
    \ success in medical and manufacturing applications. The device is equipped with\
    \ ambitious technology, including bone conduction for audio output and a prism\
    \ projector display. The Explorer Edition's successor, Google Glass Enterprise\
    \ Edition, eschews bone conduction technology, but also brings several improvements\
    \ over previous iterations, including an Intel Atom processor and a barometer.\n\
    \n·             **Microsoft HoloLens**: billed as the world's first completely\
    \ wireless holographic computer, HoloLens is available in both a Development Edition\
    \ and a Commercial Suite configuration. North American-based companies also have\
    \ the option to rent a HoloLens through a Microsoft partner. The current version\
    \ of HoloLens has a 35 ° FOV, but a recent patent from Microsoft for a MEMS laser\
    \ scanner could increase the FOV for the next generation of HoloLens to 70°.\n\
    \n![Microsoft HoloLens&#39; Revealed, an Untethered See-through AR Headset – Road\
    \ to VR](images/00031.jpeg)\n\nFigure 31: Microsoft HoloLens Headset\n\n·            \
    \ **VUZIX M100 & M300 Smart Glasses:** founded in 1997, Vuzix has a long history\
    \ in the augmented reality industry. Its current offerings suitable for industrial\
    \ applications are the M100 and M300 Smart Glasses. The M300 is marketed as having\
    \ advanced features and there are some important differences between the two.\
    \ For example, the diagonal FOV on the M100 is 15 ° and 20 ° on the M300.\n\n\
    ·             **DAQRI Smart Glasses:** the latest iteration of the company's augmented\
    \ reality hardware, DAQRI's Smart Glasses are designed for professional use. The\
    \ unit is based on a 6th generation Intel Core m7 processor and uses two LCoS\
    \ optical displays, which give it a diagonal FOV of 44 °. It comes with Worksense\
    \ Standard, the DAQRI app suite for AR activities.\n\n### 8.4.3 Problems related\
    \ to the use of VR and AR\n\nVirtual Reality and Augmented Reality are however\
    \ not without problems. Some of these are:\n\n·             **User interface:**\
    \ one of the main challenges of AR is to improve the field of view (FOV), brightness,\
    \ display quality, latency, etc. In the case of the FOV, for example, even the\
    \ best AR devices can only offer up to 90 degrees. Comparing this to the 190-degree\
    \ horizontal and 120-degree vertical FOVs for normal human vision, the gap between\
    \ where the technology is now and where it needs to go becomes apparent.\n\n·            \
    \ **Health problems:** Heavy use of AR and VR devices (described in the next chapter)\
    \ could cause some health problems such as:\n\no      **Virtual reality sickness**: VR\
    \ headsets contain 2 small LCD monitors, each projected onto an eye, creating\
    \ a stereoscopic effect that gives users the illusion of an artificial environment\
    \ created around you. And a longer screen focusing time increases the feeling\
    \ of nausea and distortion, a phenomenon called Virtual Reality Sickness;\n\n\
    o      **Eye strain**: using AR/VR viewers we are confined to a limited area by\
    \ our environment, we see and focus on details for a long time due to which it\
    \ is correct to tend to blink less than normal frequency. This results in dryness\
    \ of the front surface of our eyes and eye strain\n\no      **Dizziness**: individuals\
    \ with amblyopia (an imbalance in visual strength between the 2 eyes) or other\
    \ conditions that inhibit focus, depth perception or normal 3D vision may not\
    \ experience the 3D effects of VR devices. Individuals with these disorders may\
    \ be more likely to experience headaches and eye strain when using such devices\n\
    \n## 8.5 Metaverse, Blockchain, Crypto and NFT\n\nWe have seen how Virtual and\
    \ Augmented Reality are probably the two main technologies on which to develop\
    \ virtual worlds, or future Metaverses. However, if this futuristic vision takes\
    \ hold more and more and we get used to living a few hours of our days immersed\
    \ in a virtual world and we will use devices capable of increasing reality by\
    \ displaying digital information, it means that the possibilities of control will\
    \ always be greater. If Meta already owns a large part of our data thanks to social\
    \ media, let's imagine what centralizing power a company that owns an entire parallel\
    \ virtual world can have.\n\nFor this reason, the Blockchain technology would\
    \ allow to guarantee the necessary security and privacy without a central body\
    \ that acts as a controller and centralizer of the information. The Metaverse\
    \ could therefore make good use of a decentralized network to overcome these problems,\
    \ bringing with them all the benefits and risks that we have already talked about\
    \ in the previous chapters. In this scenario, the use of digital tokens, i.e.,\
    \ Bitcoin, Ether or others, would represent the most usable solution for the exchange\
    \ and purchase of goods and services. Likewise, the Metaverse would represent\
    \ the ideal environment for using all those decentralized solutions introduced\
    \ enabled by Smart Contracts.\n\nIn a very similar way, the NFT market could also\
    \ experience exponential growth. As in the case of Second Life, in the Metaverse\
    \ we may be able to purchase items and trade them through decentralized platforms.\
    \ Let's imagine the case of video games: an item purchased in the form of NFT\
    \ could be purchased on one platform, but used or even traded on other multi-player\
    \ platforms. Or, through Augmented Reality I could sell unique virtual advertising\
    \ spaces in specific places (for example, buildings, special places, etc.) that\
    \ will appear on the user's viewer when they are located near the place.\n\nWhat\
    \ is certain is that the Metaverse is here to stay, otherwise the investments\
    \ made in the public and private sectors in this sector would not be explained.\
    \ For example, Shanghai, the most densely populated city in China, is looking\
    \ for ways to use a Metaverse in public services over the next five years. The\
    \ Shanghai Municipal Commission of Economy and Information Technology Development\
    \ Plan for the IT sector has listed four frontiers to explore, and one of them\
    \ is the Metaverse.\n\nWe cite below some Blockchain projects (therefore also\
    \ Crypto and NFT) that exploit the idea of the Metaverse, sorted by market capitalization\
    \ (from highest to lowest)[\\[132\\]](#part0000_split_077.html#_ftn132):"
