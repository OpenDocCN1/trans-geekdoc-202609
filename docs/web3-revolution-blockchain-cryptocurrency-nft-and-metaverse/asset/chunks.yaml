  trans: "\n\n1. **币安（Binance）**[\\[57\\]](#part0000_split_077.html#_ftn57)：成立于 2017\
    \ 年，得益于提供的 500 多种加密货币，它是目前全球最著名的平台。由于中国政府近期对加密货币市场实施的限制，这家中国交易所目前总部位于开曼群岛，并提供以较低的手续费使用传统货币（法币）购买加密货币。\n\
    \n2. **Coinbase**[\\[58\\]](#part0000_split_077.html#_ftn58)：顶级的美国交易所，其成功很大程度上归功于适用于\
    \ iOS 和 Android 的卓越移动应用程序。该平台设定了严格的身份识别规则，并要求大量的个人数据。它还有一个 Pro 版本，为投资者提供不同的分析工具和更低的佣金，但代价是界面的复杂性更高。\n\
    \n3. **FTX**[\\[59\\]](#part0000_split_077.html#_ftn59)：总部位于巴哈马的交易所，由麻省理工学院（MIT）校友萨姆·班克曼·弗德（Sam\
    \ Bankman-Fied）和加里·王（Gary Wang）于 2019 年 5 月创立。F1 粉丝可能对这个交易所的名字很熟悉，因为它从 2021 年\
    \ 9 月开始赞助梅赛德斯-AMG 彼特纳（Mercedes-AMG Petronas）F1 车队，公司标志出现在官方赛手刘易斯·汉密尔顿（Luis Hamilton）和瓦尔里·博塔斯（Valeri\
    \ Bottas）的赛车和队服上。\n\n4. **Kraken**[\\[60\\]](#part0000_split_077.html#_ftn60)：提供许多货币对和所有主流加密货币的交易。最高费用达到\
    \ 0.26%，接受身份验证和银行转账。然而，每日提取有限制。\n\n5. **KuCoin**[\\[61\\]](#part0000_split_077.html#_ftn61)：成立于\
    \ 2013 年，但于 2017 年 9 月正式推出，总部位于新加坡。\n\n其他受欢迎且值得关注的交易所还有：\n\n* **Bitstamp**[\\\
    [62\\]](#part0000_split_077.html#_ftn62)：在 CMP 中排名第 12。得益于其速度和接受的大量支付方式，该交易所每天在欧洲产生令人震惊的交易量。\n\
    \n* **Poloniex**[\\[63\\]](#part0000_split_077.html#_ftn63)：在 CMP 中排名第 21。在这种情况下，不需要账户验证，但提现有不能超过的阈值。佣金高于接受水平。\n\
    \n* **Bittrex**[\\[64\\]](#part0000_split_077.html#_ftn64)：在 CMP 中排名第 25。在当今市场上，很少有交易所能提供如此大量的加密货币和货币对。此外，佣金最高达\
    \ 0.23 美元。\n\n* **Bitpanda**[\\[65\\]](#part0000_split_077.html#_ftn65)：在 CMP\
    \ 中排名第 93。在这里，我们也可以依靠免费的电子钱包和许多接受的支付方式（包括电子支付）。同样，在这种情况下，身份识别操作是非常严谨的。\n\n###\
    \ 交易所和股票市场有什么区别？\n\n基本上有两点：\n\n* 股市有开盘和收盘时间，并遵循其运营不同国家的日历，而加密货币交易所永不关闭。这意味着可以在任何时间进行交易。这为加密货币投资者提供了更大的灵活性。\n\
    \n* 股票市场受监管，而交易所没有。金融市场是经济中受监管最严格的部门之一，目的是确保个人保护（债权人、投资者和保单持有人）、稳定性以及金融市场本身的功能。这为加密货币投资者带来了更大的风险来源。\n\
    \n## 5.2 经纪商\n\n加密货币经纪商是充当买方与不同加密货币市场之间中间人的公司或个人，通过金融工具促进加密货币的买卖。\n\n加密货币经纪商与交易所有几个特点，主要的特点是不可能购买加密货币，因为他们处理的是对其价值投资。通过经纪商进行加密货币投资本质上可以通过三种金融工具进行：\n\
    \n1. **CFD**：代表差价合约（contract for difference），是一种价格基于标的资产买入价格和卖出价格差值的金融工具。简单来说，CFD\
    \ 反映了资产在一天开始和结束时的价值状态。得益于这些特征，交易者能够交易不同类型的资产，如指数、股票、期货甚至加密货币，而无需拥有它们。例如，当你买入某股票的\
    \ CFD 时，你并不是股票的所有者，只是与经纪商有一份合同。\n\n2. **ETF**：交易型基金（Exchange Traded Funds）是特殊的被动管理投资基金。与所有基金一样，购买\
    \ ETF 就像购买一篮股票。投资基金等于将你的储蓄与其他投资者的储蓄放在一起，基金经理将用这些钱购买你将投资的工具。投资表现将由基金投资的所有单个工具的结果给出。在\
    \ ETF 中，我们可以找到对公司的投资，例如，在硬件生产或采矿领域运营的公司，到持有用于交换加密货币的真实交易所金融公司，以及支持比特币采用的银行和支付服务公司。截至目前，已有多个指数直接或间接地投资于在区块链和加密货币领域运营的公司。其中一些包括：\n\
    \n    * **Elwood Blockchain Global Equity**，复制全球（包括发达国家和不发达国家）从事或将从事区块链板块的公司的表现；\n\
    \n    * **Indxx Blockchain**，复制全球范围内已使用或正在与区块链相关的产品服务的公司表现；\n\n    * **MVIS Global\
    \ Assets Equity**，复制从事数字资产或类似服务、采矿作业、技术或基础设施领域的全球趋势。\n\n3. **ETN**：这些是交易型债券（Exchange-Traded\
    \ Notes），它们与 ETF 的区别在于它们不是基金，而是由发行公司针对直接投资发行的，用于复制相关趋势。提供这些 ETN 的是 VanEck 公司，该公司决定将以下\
    \ ETN 加入到它的 ETF（我们之前分析过的那种）中：\n\n    * VanEck Ethereum ETN\n    * VanEck Solana\
    \ ETN\n    * VanEck Polkadot ETN\n    * VanEck Tron ETN\n\n投资这些 ETN 的优势在于可以让自己接触这些加密货币，而无需通过交易所直接购买它们，从而避免与交易对手相关的所有风险。此外，你不需要担心私钥的托管，并且可以通过使用在线经纪商轻松地访问这些工具。至于经纪商，我们想提到以下两个：\n\
    \n* **eToro**[\\[66\\]](#part0000_split_077.html#_ftn66)：可能是最出色的经纪商。eToro 于 2007\
    \ 年出生于特拉维。2010 年，它推出了 eToro Open Book 投资平台，包含跟单交易（Copy Trading）功能，允许投资者自动搜索、跟踪和复制成功的交易者。此外，平台提供了一个可以使用虚拟资金进行金融模拟的账户，降低了新手投资者的相关风险。\n\
    \n* **DEGIRO**[\\[67\\]](#part0000_split_077.html#_ftn67)：DEGIRO 是一家成立于 2008 年的荷兰公司，提供大量的加密货币跟踪基金，大部分是\
    \ ETN。它还提供加密货币 ETF。\n\n"
