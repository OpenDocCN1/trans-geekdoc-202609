    Polkadot is a protocol that facilitates the transfer between different Blockchains
    of any type of data or asset, not just Tokens, thus making a wide range of Blockchains
    interoperable. This interoperability aims to establish a completely decentralized
    and private web, controlled by its users, and to simplify the creation of new
    applications and services. Polkadot''s native `DOT` token aims to provide governance
    and network operations and create parachains, the so-called parallel chains.


    ### 4.6.11 Dogecoin[52]

    Dogecoin was created in 2013 by two American computer engineers, Billy Markus
    and Jackson Palmer. Markus and Palmer reportedly created the coin as a joke, commenting
    on the wild speculation of the Cryptocurrency market. Dogecoin was primarily used
    as a tipping system on Reddit and Twitter to reward the creation or sharing of
    quality content. You can get a Dogecoin tip by joining a community that uses digital
    currency. Dogecoin caused a stir in 2021 as the coin''s price skyrocketed. The
    Coin, which uses an image of the shiba inu as an avatar, is accepted as a form
    of payment by some major companies including Dallas Mavericks, Kronos and SpaceX,
    an American aerospace manufacturer owned by Elon Musk.


    ### 4.6.12 Litecoin[53]

    Litecoin, launched in 2011, was among the first Cryptocurrencies to follow in
    Bitcoin''s footsteps and was created by Charlie Lee, an MIT graduate and former
    Google engineer. Litecoin is based on an open-source global payment network which
    is not controlled by any central authority and uses `scrypt` as a Proof-of-Work.
    Although Litecoin is very similar to Bitcoin, it has a faster block generation
    rate and therefore offers a faster transaction confirmation time.


    Its main advantage derives precisely from its speed and economy. Litecoin transactions
    are generally confirmed within minutes and the transaction fees are almost negligible.
    This makes it an attractive alternative to Bitcoin in developing countries, where
    transaction fees can be the deciding factor as to which cryptocurrency to support.


    As of January 2021, Litecoin is one of the most widely accepted Cryptocurrencies
    and more than 2,000 merchants and shops now accept `LTC` worldwide.


    As of November 2021, Litecoin has a market cap of $ 14 billion and a value per
    token of around $ 200, making it the 17th largest cryptocurrency in the world.


    ### 4.6.13 Algorand[54]

    Algorand is a Blockchain-based platform which, basically like most of them, aims
    to be secure, scalable and decentralized. The development of the Algorand platform
    is overseen by Algorand, Inc., a privately held company based in Boston and was
    founded in 2017 by Silvio Micali, a professor at MIT. What makes this Blockchain
    different from the others is its consensus mechanism, the so-called Pure-Proof-of-Stake
    (`PPoS`) in which the creators of blocks are not chosen on the basis of their
    wealth, but are selected randomly. With `PPoS`, the likelihood of being chosen
    is proportional, but not limited, to the total amount of "wagered" `ALGO`s. This
    consensus mechanism is intended to increase decentralization, as low "stakes"
    requirements favor participation from anywhere in the world. Furthermore, the
    security is high because random selection represents a big obstacle for hackers
    or malicious users.


    Another noteworthy feature is that Algorand declares itself "carbon negative":
    not only does it not produce `CO[2]` emissions, but it induces a permanent removal
    of `CO[2]` from the ecosystem.


    Algorand''s native Token is called `ALGO`.


    ### 4.6.14 IOTA[55]

    IOTA currently represents a sort of unicum in the Cryptocurrency landscape and
    that is why, although it is not currently among the main ones in terms of capitalization,
    we think it is useful to mention it.


    IOTA is an open-source distributed ledger designed for the Internet of Things
    (`IoT`), i.e., the exchange of data between systems such as industrial, such as
    robots, machine tools, processing plants and so on. IOTA is not based on a Blockchain
    mechanism, but on a mechanism called `Tangle`, motivated by potentially higher
    scalability than Blockchain-based distributed ledgers. IOTA does not use miners
    to validate transactions, but nodes that issue a new transaction on the network
    must approve two previous transactions. Transactions can then be issued commission-free,
    facilitating microtransactions.


    This mechanism has come under criticism due to its unusual design, of which it
    is unclear whether it will work in practice. For this reason, IOTA was rewritten
    from scratch for a network update called `Chrysalis`, or `IOTA 1.5`, launched
    on April 28, 2021. However, despite this skepticism, the project enjoys first-rate
    investors, especially in the industrial field. For example, concepts based on
    IOTA technology have been developed in the automotive and IoT sectors by companies
    such as Jaguar Land Rover and Bosch. IOTA also participates in projects to develop
    smart cities, to establish digital identity, waste management and local energy
    trade.


    IOTA is traded in `megaIOTA` units (1,000,000 `IOTA`) and is listed under the
    `MIOTA` symbol.


