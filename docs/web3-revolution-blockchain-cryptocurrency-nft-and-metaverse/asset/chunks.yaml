    # 8. 元宇宙


    ### 8.1 引言

    ### 8.2 第二生（Second Life）：元宇宙的第一个示例

    ### 8.3 元宇宙的其他示例

    ### 8.4 全新的用户体验（UX）

    ### 8.5 元宇宙、区块链、加密货币与 NFT

    ### 8.6 当前的一些技术局限性

    ### 8.7 元宇宙的争议方面


    ### 章总结


    元宇宙可能代表了 Web3 概念的最后拼图，因为它将在未来几年内被使用。在本章中，我们将阐述元宇宙的基础概念和技术，如虚拟现实和增强现实，以及它与区块链技术和代币使用（无论同质还是非同质）之间的密切联系。


    **关键词**：元宇宙、UX、增强现实、AR、虚拟现实、VR


    ## 8.1 引言


    当媒体最近报道“元宇宙”一词来指代马克·扎克伯格的 `Meta Platforms` 新名称时，我问自己的第一个问题之一是：这意味着什么？


    这个术语追溯到 1992 年，根据维基百科[[110]](#part0000_split_077.html#_ftn110)报道：


    *“元宇宙是尼尔·斯蒂芬森（Neal Stephenson）在赛博朋克科幻小说《崩塌》（1992）中创造的术语，它被描述为一种通过互联网共享的虚拟现实，人们在那里通过自己的化身以三维形式呈现[......]斯蒂芬森描述的是对现代互联网的未来愿景，中高层人群经常出没，社会阶层之间的差异通过化身的分辨率来表示（从公共终端的黑白形象，到富人极的
    3D 渲染形象），以及进入专属场所的可能性”。*


    元宇宙一个更简单的定义可以是阿尔伯特·梅日（Albert Meige）报道的：“未来的 Web 版本，视频游戏的沉浸式 3D 虚拟宇宙与社交网络、协作空间、市场和电子商务汇合的地方”111。


    在 Gary Vaynerchuk 最近一次 112 的采访中，询问马克·扎克伯格关于 Meta 的未来愿景，扎克伯格表示：


    *“对我来说，今天的元宇宙是社交连接的下一个前沿，就像社交网络在我 2004 年开始时一样……大多数人认为我们是社交媒体公司，但在我们的 DNA 里，我们是一家科技公司，构建不同的技术来帮助人们连接，并尝试改进人之间的联系。当然，社交媒体是这一过程的重要部分。然而，我认为它将越来越多地成为构建平台和创造能够传达存在感的体验，就像你和另一个人在那里一样。当然，增强现实和虚拟现实是过程的一部分[……]，我们已经研究了
    7 年了[……]。我们开始发布 `Horizon` 和 `Workrooms` 以及其中一些让你感觉到某地有人在的体验（针对 Oculus 的虚拟现实平台，编辑）[……]。在某种意义上，这有点像一直梦想的这种数字社交体验，人们感觉到聚在一起并一起做事情、一起协作。到目前为止，我们拥有的技术没有能做到这一点[……]当我们想要去沉浸式区域时将会有虚拟现实，我们将增强现实来查看全息图，所以你可以想象
    3 到 5 年后，不再是有视频，你将是我客厅里的一个全息，我是你客厅里的一个全息。”*


    ![](img/00026.jpeg)

    图 26：西答通过手持全息投影仪与下属对话。根据扎克伯格的说法，这种场景在技术上 3-5 年内可行 113


    扎克伯格此举提出了一个新的业务视角，旨在克服 `Amazon`、`Google` 和 `Apple` 股价明显的关键性问题。


    ![](img/00027.jpeg)

    图 27：大型科技公司价值从 2016 年到 2021 年的增长。来源：Digitale114


    在这一术语出现三十年后，描述的情景将由于一组技术（即使尚未完全成熟）如 `区块链`、`虚拟现实` 和 `增强现实` 而成为。


    ### 8.1.1 从数据到隐私


    正如 Wired 报道的一篇文章 115 所：


    *“元宇宙的体验无疑涉及前所未有的个人数据收集、处理和共享，涉及多个主体。此外，在元宇宙中可以收集有关用户行为和心理反应、物理运动和生物识别数据的信息（想象用于新虚拟体验的眼镜或其他身体设备）。用户（以及他们的物理或心理反应）将受到持续监控。”*


    因此，隐私问题和个人数据处理将成为负责任且严肃参与元宇宙日益增加的核心点。


    ## 8.2 第二生（Second Life）：元宇宙的第一个示例


    Second Life[116](#part0000_split_077.html#_ftn116）是由旧金山的 `Linden Lab` 在 2003 年推出的一个在线平台，被认为是元宇宙的第一个具体示例。Second
    Life 允许人们为自己创建化身并在在线虚拟世界或元宇宙中过第二生活。用户（被称为居民）可以与地点、物体和其他化身交互，他们可以探索世界（称为网格）、与其他居民见面、社交、参与个人和小组活动，并相互构建、创建、购买和交换虚拟财产和服务。


    该平台主要以用户生成的 3D 内容为主，并拥有自己的虚拟货币——林登美元（Linden Dollar），该货币可以兑换现实货币。


