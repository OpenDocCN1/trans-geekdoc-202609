- raw: "During transactions that involve the signing of official documents, the exchange\
    \ of money or the sale of goods, the figure of the intermediary very often acts\
    \ only as a guarantor of the transaction itself. This comes at a cost, which is\
    \ sometimes called financial friction in the jargon. We have just seen that this\
    \ figure in a distributed network context loses its meaning, as the validity of\
    \ the transaction is guaranteed by the architecture of the Blockchain network\
    \ itself. Consequently, the transaction does not require any intermediary, therefore\
    \ no brokerage costs. The most common example is that of electronic payments:\
    \ when we pay with a debit or credit card or make a bank transfer, the transaction\
    \ is taken over by the bank which in some cases asks for a commission. In addition,\
    \ the credit card often also requires an annual fee. In the case of electronic\
    \ payments via Blockchain, such fees would not be necessary.\n\n### 3.1.3 Security\n\
    \nBlockchain technology uses an advanced level of security compared to other platforms\
    \ or registration systems. In the previous chapter we mentioned the use of hashing\
    \ and cryptography, algorithms on which the Blockchain is based. Furthermore,\
    \ the consensus mechanism and the decentralization of the distributed system make\
    \ the Blockchain probably the safest information technology out there.\n\n###\
    \ 3.1.4 Transaction speed \n\nCentralized transactions take some time to process.\
    \ Take for example the case of a national or international bank transfer between\
    \ 2 different banks: this process can take several working days to resolve. However,\
    \ in a decentralized process such as the Blockchain this mechanism is no longer\
    \ necessary, as the transaction, not requiring an intermediary, can take place,\
    \ if we take as reference the time of an average Bitcoin transaction, about 10\
    \ minutes.\n\n### 3.1.5 Scalability\n\nThe scalability of a system generally denotes\
    \ its ability to scale up or down according to need and availability. Referring\
    \ to the Blockchain, scalability is its ability to manage an increasing number\
    \ of transactions without affecting performance. The Blockchain has the advantage\
    \ of being an extremely scalable technology; however, as evidenced by the Blockchain\
    \ trilemma, this could happen to the detriment of security, for example. In fact,\
    \ Bitcoin with its PoW mechanism has a scalability problem largely linked to the\
    \ high energy consumption required as the growth of the nodes increases, however\
    \ it guarantees high decentralization and security. For this reason, the altcoins\
    \ that were born after Bitcoin aim to solve its intrinsic scalability problems.\
    \ \n\n## 3.2 Main challenges\n\nAfter having illustrated the main advantages,\
    \ let's now see what are the main challenges that Blockchain technology will have\
    \ to face to be adopted on a global scale: lack of knowledge, privacy, 51% risk\
    \ of attack, energy consumption, deregulation, financial risks and risks related\
    \ to the loss of cryptographic keys.\n\n### 3.2.1 Little knowledge of Technology\n\
    \nThis limit actually refers to human nature and more generally to any innovation\
    \ process. As mentioned in the introduction of this book, every innovative process\
    \ is associated with a series of opportunities but also a series of risks. By\
    \ their nature, people are inclined not to risk excessively, unless they have\
    \ implemented a series of countermeasures to reduce and manage these risks. However,\
    \ these countermeasures require some effort. The first step consists in reducing\
    \ the uncertainty associated with the lack of knowledge of a technology, in this\
    \ case the Blockchain. It is essential to create a method for reducing the knowledge\
    \ gap with respect to technology, a gap that is gradually growing due to the speed\
    \ with which new technologies evolve and the inertia of people to adapt to new\
    \ future scenarios.\n\n### 3.2.2 Privacy \n\nIf on the one hand a distributed\
    \ architecture is one of the main elements that guarantees the security and transparency\
    \ we talked about in the previous paragraph, on the other hand this can generate\
    \ a problem related to privacy. Specifically, in Blockchain technology each node\
    \ necessarily has access to the data of the Blockchain transaction itself. This\
    \ means that in the case of a public Blockchain, every transaction that is public\
    \ can be traced back to the first block of genesis.\n\nIn practice, this transparency\
    \ and traceability cancels the benefit of anonymity, that is, of the fact that\
    \ there is apparently no link between the individual and the Wallet to which he\
    \ belongs. A public Blockchain actually allows for identification opportunities.\
    \ An article on the Bitcoin investigations of the Journal of Forensic Research[\\\
    [16\\]](#part0000_split_077.html#_ftn16), for example, illustrates several: one\
    \ way is to monitor communications between Blockchain nodes, which can associate\
    \ Internet protocol addresses and transactions. Furthermore, while it is not public,\
    \ the cryptocurrency wallet software can be forensically analyzed even without\
    \ the necessary keys to use it.\n\n The higher-profile use of these techniques\
    \ cost Ross Ulbricht's arrest for running the 'Silk Road' site, a black market\
    \ for illegal drugs. Even more interesting is that a special agent from the IRS\
    \ was also able to track Bitcoin transactions to determine that a U.S. Drug Enforcement\
    \ Administration agent involved in the investigation, Carl Force, was laundering\
    \ Silk Road related Bitcoins. As it is easy to guess, a Blockchain like Bitcoin\
    \ provides limited privacy protection. Individuals who rely on exchanges such\
    \ as Coinbase must be aware that such platforms must comply with international\
    \ privacy laws and are therefore subject to controls. For example, the IRS also\
    \ asked Coinbase to hand over certain records involving cryptocurrency transactions\
    \ [\\[17\\]](#part0000_split_077.html#_ftn17). \n\nTherefore, it is necessary\
    \ to be aware of the privacy aspects of public Blockchains, which while on the\
    \ one hand guarantee a certain anonymity of user transactions, on the other hand\
    \ they still offer identification opportunities through the implementation of\
    \ a series of specific techniques.\n\n### 3.2.3 Risk of a 51% attack\n\nIn a PoW\
    \ mechanism a 51% attack refers to a hypothetical attack on a Blockchain by a\
    \ group of miners who control more than 50% of the hash rate or computing power\
    \ of the network (hash rate is a parameter used to measure total computational\
    \ power to process transactions and mine new coins). In fact, one of the characteristics\
    \ that guarantees the immutability of the blocks is the fact that the transactions\
    \ are distributed on the network, which must approve these transactions according\
    \ to the consensus mechanism. This means that if most users agree to change the\
    \ blocks, this change could be implemented. On the practical side, if a transaction\
    \ already carried out had foreseen the exchange of 1 BTC, the network could decide\
    \ to modify it, for example, by spending 2 times the same coins. This risk is\
    \ known as \"double-spending\", which is the risk that a digital currency could\
    \ be spent twice. This is a potential problem unique to digital currencies because\
    \ digital information can be reproduced relatively easily by experienced individuals\
    \ who understand the Blockchain network and the computing power required to manipulate\
    \ it. An attack of this type is only hypothetical, however if it happened it would\
    \ irreparably undermine the foundations of the Blockchain and cryptocurrencies,\
    \ especially those based on a PoW consensus mechanism.\n\n### 3.2.4 Costs\n\n\
    While on the one hand the Blockchain has the advantage of reducing the costs of\
    \ financial transactions, on the other hand it entails costs in terms of energy\
    \ consumption and, in the case of PoW-based Blockchains, of hardware for mining.\
    \ For this reason, the main mining farms are located in countries with low energy\
    \ costs.\n\n### 3.2.5 Energy Consumption "
