    \ exit the market (therefore sell Tokens) at the moment of greatest strength,\
    \ ideally in the presence of relative maximums. Easy, isn't it? Absolutely not,\
    \ at least not for beginners in the matter. Professional traders do this for a\
    \ living using the so-called technical analysis. In finance, technical analysis\
    \ (AT) is the study of the price trend of financial markets over time, in order\
    \ to predict future trends, mainly using graphical and statistical methods. In\
    \ a broad sense, it is that theory of analysis (or set of principles and tools)\
    \ according to which it is possible to predict the future trend of the price of\
    \ a listed asset (real or financial), by studying its past history. It is used,\
    \ together with the fundamental analysis (which we will see in paragraph 5.4.6),\
    \ for the definition of financial operating decisions.\n\nWe will not go into\
    \ the technicalities of this type of analysis as it is outside the scope of this\
    \ book. For those wishing to deepen the subject, we recommend studying on dedicated\
    \ manuals for trading on the markets: the methodology used is in fact the same\
    \ used for traditional financial markets.\n\n### 5.4.5 Further advice for future\
    \ investors\n\nIn addition to the aforementioned strategies that can be used in\
