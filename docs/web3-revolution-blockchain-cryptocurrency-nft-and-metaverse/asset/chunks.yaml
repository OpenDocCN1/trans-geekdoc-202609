- raw: "In the previous chapters we described the main technologies underlying the\
    \ concept of Web 3.0, or Web3, focusing in particular on the Blockchain, a decentralized\
    \ architecture capable of revolutionizing the structure of the web as we know\
    \ it, without forgetting the consequences that can arise from it also, from a\
    \ socio-economic point of view. In this final chapter we will make some considerations\
    \ about what future scenarios await us.\n\n**Keywords**: Web3, decentralization,\
    \ new technologies, future scenario \n\n## 9.1 Summary of previous chapters\n\n\
    Trying to summarize what we have seen in the previous chapters, we can say that\
    \ Web 3.0 essentially represents the evolution of Web 2.0, in which the user will\
    \ not only be seen as a buyer or an entity from which to obtain the greatest amount\
    \ of information from reuse in every possible form, but thanks to the decentralization\
    \ of the network, it will be able to be the owner of its own data without the\
    \ need for a central controlling body.\n\nThis scenario will be possible on the\
    \ basis of a decentralized IT architecture, the Blockchain. As we have seen, thanks\
    \ to the Blockchain, users will be able to carry out transactions, for example,\
    \ exchange digital money such as Bitcoin, sign smart contracts and purchase services\
    \ without the need for intermediation, radically reducing the time and associated\
    \ costs and at the same time maintaining a level of security and transparency\
    \ otherwise not possible. Cryptocurrencies could therefore establish themselves\
    \ as the first trading currency and supplant fiat currencies as they cannot be\
    \ manipulated and incensurable, while at the same time acting as a store of superior\
    \ value to other assets such as gold. Through Cryptocurrencies it is already possible\
    \ to trade Non-Fungible Tokens (NFT), or unique digital objects, such as works\
    \ of art, which are the subject of a market still in an embryonic phase, but according\
    \ to many insiders with enormous opportunities. Finally, everything could take\
    \ place in a virtual environment that is likely decentralized, immersive or not,\
    \ thanks to technologies such as Virtual and Augmented Reality, in the Metaverse.\
    \ In this sense, the boundary between \"real\" and virtual reality would become\
    \ increasingly blurred, in favor of new opportunities and still unexplored scenarios\
    \ in this case as well.\n\n## 9.2 Adopt new technologies\n\nAre we facing utopian\
    \ or dystopian scenarios? In recent years, more and more authors and film producers\
    \ are focusing their attention on future scenarios allowed by the use of these\
    \ technologies. The real problem is the one revealed at the beginning: technology\
    \ advances but our condition as \"creatures of habit\" does not help us to adapt\
    \ to the consequences of their diffusion, consequently creating an ever-greater\
    \ gap between what is possible and what is possible. communities actually adopt.\n\
    \nThis problem is actually not recent: in fact, as early as 1959 the German philosopher\
    \ Martin Heidegger was writing[***\\[141\\]***](#part0000_split_077.html#_ftn141):\n\
    \n*“What is truly disturbing is not that the world turns into a complete domain\
    \ of technology.*\n\n*Far more disturbing is that man is not at all prepared for\
    \ this radical change in the world.*\n\n*Far more disturbing is that we are not\
    \ yet able to reach, through a meditating thought, an adequate comparison with\
    \ what is really emerging in our age.”*\n\n The large-scale adoption of one technology\
    \ rather than another can take place on the basis of different mechanisms: it\
    \ can be stimulated by the so-called network effect (see Glossary), it can be\
    \ encouraged at a centralized level, for example by laws of state governments\
    \ (see the case of El Salvador for Bitcoin), or it can even be discouraged at\
    \ the community level, as in the case of the Amish or some indigenous peoples,\
    \ who deliberately choose not to use some modern forms of technology.\n\nFurthermore,\
    \ a technology can spread regardless of whether it is the best on the market,\
    \ as evidenced by some practical examples. An example is that of the layout of\
    \ QWERTY keyboards, which became a standard at the time of analog typewriters\
    \ instead of the Dvorak layout, designed to speed up typing in digital systems.\
    \ In this case we enter the field of epistemic uncertainty: it is known that the\
