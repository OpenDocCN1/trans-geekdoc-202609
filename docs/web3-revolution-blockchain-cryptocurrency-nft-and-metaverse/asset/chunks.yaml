    ## 1.3 History of Blockchain


    When was the Blockchain born and who invented it? In this section we briefly report
    the main stages of its birth:


    **1982 - David Chaum**[[8]](#part0000_split_077.html#_ftn8), an American computer
    scientist and cryptographer, lays the foundations of `Blockchain`. In his doctoral
    thesis at Berkley, he defines a plan for achieving consensus between nodes:


    **1983 - Blind Signature**. In his document *"Blind signatures for untraceable
    payments"*[[10]](#part0000_split_077.html#_ftn10)* Chaum describes a system for
    allowing users to obtain digital currency from a bank and spend it in a way that
    cannot be traced. With this form of digital signature, it is possible to hide
    the content of a message before it is signed, so that the signer cannot determine
    its content. The resulting blind signature can be publicly verified against the
    original message like a normal digital signature. For his contribution, Chaum
    is credited as the inventor of digital currency, ideas that form the technical
    basis of the Cypherpunk movement that began in the late 1980s. Indeed, members
    of this movement advocated the widespread use of advanced cryptography and privacy-enhancing
    technologies as a path to social and political change.


    **1990 - Chaum** founds `DigiCash`, an Amsterdam-based electronic cash company.


    **1994 - DigiCash** sends the first electronic payment.


    **1997 - Adam Back**, a British cryptographer and later CEO of Blockstream, proposes
    `Hashcash`, an algorithm used to limit email spam. Shortly, `Hashcash` is a "proof-of-work"
    algorithm (we''ll find out in the second chapter what that means) based on hash
    codes. In practice, when email is used, a code (or "stamp") is added to the email
    header to show that the sender took a modest amount of CPU time to calculate this
    code before sending the e-mail. By virtue of that effort, he is unlikely to be
    a spmer. At this point the recipient can check the validity of the stamp with
    a negligible computational cost. However, the only known way to find the code
    is through what is commonly referred to as "brute force," which is by calculating
    random codes until the exact code is found. This concept will later be used in
    the Bitcoin blockchain as part of the mining.


    **Early 90´: Nick Szabo**, an American computer scientist and cryptographer, introduces
    the concept of `Smart Contracts` as distributable value in addition to electronic
    money. A `Smart Contract` is a digital contract that is executed automatically
    and based on predefined criteria.

