    # 关于作者

    我叫 [Nicola Accialini](https://www.linkedin.com/in/nicolaaccini/)，是一名自由职业顾问。在帕多亚大学毕业后，我曾在一些主要公司工作过。从
    2019 年 6 月开始，我一直致力于数字化转型，帮助公司在各个领域寻找并实施创新策略。在这种背景下，`Web3` 无疑是公司、专业人士不能错过的机会，以跟上现在和未来。


    # 引言

    2010 年，Laszlo Hanyecz 用 30 美元购买了两个披萨`10,000 比特币`。现在几乎 12 年后，那两个披萨为那幸运的披萨店（希望他们在此期间保存了那些比特币）带来了约
    4 亿美元的等值价值。与此同时，美元贬值了 27%。这一简单的事实足以让我们意识到我们正面临着颠覆性的变革：新的技术解决方案所承诺的变革，甚至可以基于一种新的去中心化协议：`区块链`
    来重构新的社会架构。


    更多信息请访问：`www.accialiconsulting.com`


