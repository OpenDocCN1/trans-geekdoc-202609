    \ even very small amounts can be exchanged.\n\nIn this sense, we can say that\
    \ a Coin is a Token with its own register, while Tokens that do not have their\
    \ own register (thus exploiting the register of an existing Blockchain) are simply\
    \ called Token.\n\nIn fact, anyone can create and issue Tokens thanks to the so-called\
    \ Initial Coin Offer (ICO), which we will discuss in paragraph 4.4. So, Bitcoin\
    \ is properly a Coin that uses the BTC Token as a trading currency, just as Ethereum\
    \ uses the ETH Token. Most tokens are issued on the Ethereum Blockchain, with\
    \ the ERC-20 format (see Glossary), and although they are stored on the Ethereum\
    \ Blockchain they have nothing to do with the native Coin of this network, i.e.,\
    \ Ether (ETH). In fact, it is necessary to distinguish between Coin, Ether, and\
    \ the Ethereum network, which are not the same thing. Issuing a new Token nowadays\
    \ is not very complicated, because in theory it is enough to write a special Smart\
    \ Contract (we will talk about it in paragraph 7.1), for example on the Ethereum\
    \ network. Creating a new Coin, on the other hand, is much more complex.\n\nTokens\
    \ are therefore the representation of a digital asset and we could think of them\
    \ as the chips of a casino or as tokens of the gaming rooms: they have the value\
    \ of currency only in the context in which they are used.\n\nIn a PoW Blockchain\
    \ like that of Bitcoin, the Coin or BTC Token was born as a reward to miners for\
    \ coding the blocks by virtue of the energy consumption spent by their hardware,\
    \ adding them to the chain and making it more and more reliable and secure. However,\
    \ with the emergence of other applications and consensus mechanisms, Tokens represent\
    \ a much more versatile asset. In fact, we can identify different types of tokens\
    \ according to their economic use:\n\n1.              **Utility Token**: used\
    \ to help capitalize or finance projects for startups, companies or project development\
    \ groups. Very often cryptocurrency projects use ICOs to offer utility tokens\
    \ to those interested in the project by announcing the issue of a certain number\
    \ of tokens. These tokens represent a means (such as coupons) to access a product\
    \ or good / service of a company: they are exchanged for products or services\
    \ of the issuing company;\n\n2.              **Security Token**: Security Tokens\
    \ are considered as real financial investments for which the holder holds part\
    \ of the value of the underlying but does not imply a share of ownership of the\
    \ \"issuing\" company;\n\n3.              **Equity Token**: it is a type of Security\
    \ Token but which implies, for the owner, a share of ownership. It works more\
    \ like a traditional equity asset. In other words, those who hold stock tokens\
    \ have some form of ownership in their investments.\n\nWe realize how the sometimes-subtle\
    \ distinction between Coin and Token may have generated some doubts and perplexities\
    \ in the reader. However, for a purely practical purpose and for those who intend\
    \ to try their hand at investing these assets from a financial point of view,\
    \ they can both be considered simply as cryptocurrencies, or Altcoins for all\
    \ those other than Bitcoin. For this reason, in the continuation of the discussion\
    \ of this book, we will never make this distinction, but we will speak exclusively\
    \ of Cryptocurrencies. \n\n## 4.2 History of Cryptocurrencies\n\nIn the first\
    \ chapter we made some historical mention of how the concept of Blockchain has\
    \ evolved and we stopped at 2009, the year in which the first Cryptocurrency,\
    \ namely Bitcoin, is officially launched. Let's see now how this market has evolved.\n\
    \n**2009 - Bitcoin was born, **by the pseudonym **Satoshi Nakamoto.**\n\n**2011**\
    \ - **Namecoin was born in April,** the second Cryptocurrency originally born\
    \ from a Bitcoin fork and uses the same Proof-of-Work consensus algorithm. Like\
    \ Bitcoin, it is limited to 21 million coins.\n\n**Litecoin was born in October**,\
    \ officially the third Cryptocurrency in the world. The main difference is that\
    \ it uses scrypt as a hash function instead of Bitcoin's SHA-256.\n\nFrom this\
    \ moment on, the number of Blockchains and Cryptocurrencies multiplies visibly.\
    \ At the time of writing (January 2022), there are more than 10,000 different\
    \ cryptocurrencies.\n\n**2014** - On August 6, the UK announced that its **Treasury\
    \ Department had commissioned a study on cryptocurrencies** and to establish what\
    \ role they could play in their economy. Its final report was published in 2018[\\\
    [26\\]](#part0000_split_077.html#_ftn26).\n\n**2019 / 2020** – Even following\
    \ the global pandemic crisis, **Cryptocurrencies are identified as a reserve of\
    \ money** and the value of some of them begins to explode, bringing the attention\
    \ of many institutional investors and at the same time the concern on the part\
    \ of banks and central governments for a market regulation.\n\n **2021** - In\
    \ June, El Salvador becomes the first country to **accept Bitcoin as legal tender**.\
    \ Following the example of El Salvador, Cuba also decides to accept Bitcoin as\
    \ legal tender in August. In September, however, the Chinese government, the largest\
    \ single market for cryptocurrency, declared all cryptocurrency transactions illegal.\n\
    \n## 4.3. Bitcoin, a new digital currency\n\nGiacomo Zucco[\\[27\\]](#part0000_split_077.html#_ftn27),\
    \ a Bitcoin expert and consultant, as well as founder of Bcademy, is considered\
    \ what in the jargon is defined as a \"Bitcoin maximalist\". Bitcoin maximalists\
    \ believe that Bitcoin, which is the most popular Cryptocurrency in the world,\
    \ is the only digital asset that will be needed in the future and that all other\
    \ digital currencies are inferior to Bitcoin. There's more: many think that Altcoins\
    \ are even real scams. It is not up to us to verify whether or not they are, however\
    \ Zucco expresses interesting and in some cases even strong points of view, so\
    \ it is advisable to see his videos on Youtube. Zucco describes Bitcoin as *\"\
    the attempt to climb into the information age the currency that man has used for\
    \ millennia before the last few centuries, which is basically gold\"*. In fact,\
    \ gold was the most salable commodity on the market for a series of advantages:\n\
    \n·             it was not perishable, it was malleable and divisible, therefore\
    \ transportable in different forms (e.g., coins, nuggets and ingots)\n\n·            \
    \ it was not subject to central control by a state, i.e., its value was recognized\
    \ regardless of where you were;\n\n·             it was not manipulated by governments\
    \ by altering its quantity\n\n·             was immeasurable, meaning third parties\
    \ could not block the gold transaction once the two parties had reached an agreement\n\
    \nHowever, gold also had some disadvantages:\n\n·             it was difficult\
    \ to transport in large quantities\n\n·             it was falsifiable in the\
    \ eyes of non-experts\n\n·             it was not virtualizable, like fiat currencies\n\
    \nOn the other hand, from the point of view of central governments, exchange currencies\
    \ such as fiat offer several advantages:\n\n·    they can be controlled and manipulated\
    \ by the monetary policies of central governments\n\n·    are virtualizable. It’s\
    \ worth to say that 97% of the money supply exists only as a record on a computer\
    \ database, the remainder is circulating money"
