    同样，目前由各国政府管理的法币正经历着一个缓慢但稳定的通胀过程（在某些情况下速度并不缓慢，例如津巴布韦和委内瑞拉的恶性通胀案例），其价值正在逐渐流失：1970
    年代的 1 美元其购买力等同于 2019 年的 6.59 美元，通胀率变化率为 558.63%#2。


    # 如何避免国家货币贬值？


    ## 信息与数据的中心化


    回顾与第二次工业革命的对比，在如今的数字时代，我们正在看到一种与工厂生产活动中心化相似的现象，但这次是在信息和数据的基础上。世界经济论坛创始人兼执行主席克劳斯·施韦伯在《第四次工业革命》#3
    书中，讨论新数字技术对人类生活的影响时，呈现了一个有趣的画面：如果最大的三个社交媒体网站是国家，它们将进入人口最多国家的前 10 名。此外，第一位发现的是一个社交媒体类国家，且不考虑这三个社交网络都是
    `Meta Platforms Inc`的一部分。此外，如果我们考虑到全球最大的搜索引擎 `Google`、最大的操作系统提供商 `Microsoft`、占据手机市场份额主导地位的
    `Samsung`，最后如果我们将全球服务器市场也加入这一分析（由美国巨头 `Dell`、`Hpe`、`Inspur`以及中国大厂`Huawei`和`Lenovo`划分），就很容易理解作为新千千年“真金”的信息是如何集中在少数公司手中的了。


    ## 老大哥


    在小说《1984》中，英国作家乔治·奥威尔描述了一个个人都不断受到当局监控的社会。“老大哥”（Big Brother）是这个虚构角色的名称，由于他是一个真实存在的人，还是政党创造的符号。然而，在
    2013 年，“老大哥”不仅是一个科幻小说中的角色，而且通过世界主要大国——美国的行为，变成了绝对真实的东西。感谢于告哨者爱德华·斯诺登，一个中心化的大规模监控系统被公开了，该系统利用
    `NSA`#4`、`Amazon`、`Apple`、`Meta (Facebook)` 和 `Microsoft`。


    图 1：互联网历史，从 web 1.0 到 web 3.0。来源：Cointelegraph


    然而，由于是一个相对新的术语，`Web3` 的含义仍然并不完全清楚，尽管它与 `Blockchain` 技术（如 `Cryptocurrencies` 或非同质化代币
    `NFT`）存在某些收敛性。去中心化金融（`DeFi`）代表另一个关键概念，用户可以在没有银行或政府参与的情况下交换货币。


    ## 即将出现的新场景


    因此，`Blockchain`、`Cryptocurrencies` 和 `NFT` 是高度关联且具有话题性的技术和应用。然而，对于大多数人来说，它们仍然代表着未知的概念，或者至少是不清楚的，因此在实施时产生了强烈的怀疑和犹豫。


    根据 EY 区块链峰会#6 期间进行的一项近期调查，关键高管被问及对该技术的了解程度如何。在 100 家大公司的样本中，知识水平在 1 到 100 分的分值上为
    48 分。然而，对于了解它的人来说，`Blockchain` 被认为是对业务影响最大的三项技术之一：57%的人希望在公司内部实施它。

