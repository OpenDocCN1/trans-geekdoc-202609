  trans: '


    -   非对称密钥：区块链使用非对称密钥算法。为了实现这类算法，你需要两个不同的密钥。其中一个密钥负责加密信息将其转换为密文，而另一个密钥则用于解密信息将其还原为明文。非对称密钥算法比对称密钥算法慢得多；然而它的安全性更复杂，也更难被破解。区块链使用了一种名为
    `Elliptic Curve Digital Signature Algorithm (ECDSA)` 的非对称密钥算法。


    `ECDSA` 算法被认为是数字签名系统实现的安全标准，如今它的应用非常广泛，几乎涵盖了几乎所有的信息技术领域。例如，互联网的 `SSL` 和 `TLS`
    安全证书基础设施大量使用了 `ECDSA` 算法。


    ![](img/00007.jpeg)


    图 7：加密过程中使用公钥和私钥的示例


    中本聪纳丰在处理比特币时面临的主要问题之一是公钥的分配，这对于保证相关钱包中令牌的安全性是必要的（我们将在第 6 章介绍它们）。中本的愿景是实现短、安全、低成本且易于使用的公钥，这些特性得益于椭圆曲线密码学。为此，中本决定在其系统中使用
    `ECDSA` 算法。此外，它还能保证：


    -   系统极其安全。中本决定为比特币使用椭圆曲线标准 `secp256k1`；

    -   密钥生成和签名验证的计算成本非常低；

    -   允许生成无限公钥。


    然而，256 位的 `ECDSA` 密钥非常长。为此，决定使用如 `SHA-256` 和 `RIPEMD-160` 等哈希函数来减小公钥的大小并创建比特币地址文件。


    ## 2.5 共识算法


    在第 2.3 节中，我们提到哈希值的生成并不能保证区块链的完全安全性，而是必须实现其他机制。共识算法是允许交易最终化和系统运行的规则集，其目的是保持网络的可用、安全和去中心化。我们将关注这一方面，因为新兴不同加密货币之间的主要区别之一也基于它们所使用的共识机制。


    我们可以将共识机制分为两个主要的宏类：


    -   无授权（开放技术）

    -   有授权（封闭技术）


    在无授权机制中，技术对任何人开放，没有中央机构可以决定协议规则和要执行的交易。然而在在种情况下，验证节点是必须信任的已知实体。


    下面将描述两种主要的共识算法类型，即 `Proof-of-Work (PoW)` 和 `Proof-of-Stake (PoS)`。


    ### 2.5.1 工作量证明 (PoW)


    在第 1.3 节中我们已经讨论了 `Proof-of-Work (PoW)`，在不涉及过多技术细节的情况下，创建了一个使用 `Smart Contract`（我们将在下一章讨论）模拟支付通道的网络，以确保网络能够以去中心化的方式运行。这种方法为提高比特币的可扩展性提供了最强大的选项之一：事实上，它可以让比特币达到每秒
    100 万次交易的水平。


    矿工是利用计算机计算能力来挖掘比特币的节点。他们被称为矿工，因为就像矿工通过体力劳动寻找黄金一样，比特币矿工通过利用计算机的计算能力尝试寻找区块的哈希值，最终通过消耗电力来换取比特币作为奖励。矿工负责验证、认证、证明并完成交易。


