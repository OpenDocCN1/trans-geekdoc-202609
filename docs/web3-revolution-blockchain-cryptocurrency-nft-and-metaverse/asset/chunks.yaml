    # About the author

    My name is [Nicola Accialini](https://www.linkedin.com/in/nicolaaccini/) and I
    am a freelance consultant. After graduating from the University of Padua, I worked
    for some of the main companies. Since June 2019 I have been dealing with digital
    transformation, helping companies to find and implement innovative strategies
    in various fields, from product development, to production. In this context, `Web3`
    undoubtedly represents an opportunity that companies, professionals and investors
    must not let go to keep up with the present and future.


    # Introduction

    It was 2010 when Laszlo Hanyecz bought two pizzas for 30 dollars `10,000 Bitcoin`.
    Today, almost 12 years later, those two pizzas are yielding to the lucky pizzeria
    (which hopefully has in the meantime saved the Bitcoins) an equivalent value of
    about 400 million dollars. On the other hand, the US dollar suffered a devaluation
    of 27% at the same time. This simple fact is enough to understand that we are
    facing a disruptive change: we have reached a point where new technological solutions
    promise such changes that they can even reformulate a new social architecture
    on the basis of a new decentralized protocol: `Blockchain`.


    For more information: `www.accialiconsulting.com`

