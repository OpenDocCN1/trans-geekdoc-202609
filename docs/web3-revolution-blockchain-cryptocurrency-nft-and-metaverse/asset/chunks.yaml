    如果你想亲手接触 `PoW` 区块链背后的原理，有一个非常清晰的演示可用[15]。


    ###### 2.5.2 权益证明 (PoS)


    `Proof-of-Stake` 设计于 2011 年，是 `PoW` 的一种低成本替代方案。`PoS` 在加密货币中的首次应用是 2012 年的 `Peercoin`。这两种共识机制的区别在于，在
    `PoW` 中矿工使用能量来验证交易，而在 `PoS` 中，区块由“验证者”根据持有的代币份额（`stake`）进行验证。验证者是那些绑定一定数量代币作为担保以获得交易验证权利的人。验证者通过网络节点中的自动选择过程产生，该过程考虑了多个不同的因素。这些因素可能因项目而异；但通常会考虑以下因素：


    1. 质押的金额

    2. 质押的持续时间（也称为币龄，即存款持续了多久）

    3. 随机因子


    当然，质押金额越高、持续时间越长，被选为验证者的概率就越大，因为较高且历史悠实的质押具有更高的可靠性和完整性。此外，当节点被算法选中并产生新区块时，其币龄会被重置，必须经过一段时间后才能被重新选中。该系统防止了拥有大量质押的节点主导
    `Blockchain`。


    一旦节点被选为下一个区块的验证者，它必须检查其中的交易是否有效，对区块签名并将其添加到 `Blockchain` 中。这种验证被称为证明（attestation）。验证者因提议新区块和验证它们所看到的区块而获得奖励。如果验证者验证了恶意区块，将失去其
    `stake`。


    与 `PoW` 系统不同，矿工的工作通过创建新区块获得奖励，而在 `PoS` 系统中……（注：此处原文包含一些不完整的句子，我已保持其原始逻辑）。


    ……`PoS` 的一种变体是所谓的纯权益证明 (`PPoS`)。


    ###### 2.5.3 PoW 和 PoS 的区别


    `Proof-of-Work` 和 `Proof-of-Stake` 之间的区别是什么？下面列出了主要的：


    * `Proof-of-Stake` 消耗的电力比 `Proof-of-Work` 少。因此更具扩展性。

    * 在相同时间内，`Proof-of-Stake` 能够处理比 `Proof-of.Work` 更多的交易。

    * 两者都可能存在中心化问题……`stake` 的数量严重影响验证区块的概率


    ###### 2.5.4 其他共识机制


    虽然 `PoW` 和 `PoS` 是 `Blockchain` 环境中最常见的共识机制，但还有其他共识算法，如：


    * `Proof-of-Capacity` (`PoC`)，用于 `Burstcoin`，它允许共享 `Blockchain` 网络贡献节点的内存空间。

    * `Proof-of-Activity` (`PoA`)，用于 `Decred` `Blockchain`，是一种结合了 `PoW` 和 `PoS` 特性的混合机制。

    * `Proof-of-Burn` (`PoB`) 是另一种，要求交易者向不可访问的钱包地址发送少量代币，并将其“销毁”。

    * `Proof-of-History` (`PoH`) 由 `Solana` 开发，通过通过加密方式对时间流本身来获取共识。


    ## 2.6 分叉 (fork)


