    # 7. Non-Fungible Tokens


    ### 7.1 Introduction


    ### 7.2 A brief history of NFTs


    ### 7.3 How NFTs Work


    ### 7.4 Most common uses


    ### 7.5 How to create, buy and trade NFTs


    ## Chapter summary


    In Chapter 4 we got to know the fungible tokens, that is, tokens able to be interchangeable
    by users. However, there is another category called Non-Fungible-Token, better
    known as NFT, which we will describe in this chapter.


    **Keywords**: Non-Fungible Token, `NFT`, Copyright, Digital art


    ## 7.1 Introduction


    In the previous chapter we described how Blockchain offers solutions to security
    problems in the absence of centralized architectures that bring with them a series
    of limitations, such as costs and scalability.


    Another application that is becoming more and more popular in recent months is
    that of the so-called Non-Fungible Tokens, or `NFT`.


    Let''s clarify the meaning of fungible and non-fungible.


    A banknote or Cryptocurrency is said to be fungible as it can be replaced without
    any problem with another banknote or cryptocurrency of equal value. A Non-Fungible
    Token, on the other hand, represents a unique piece: that is, it cannot be replicated
    or replaced.


    An `NFT` can be any object in digital format, for example a video, a photo, a
    `GIF`, a text, an article, an audio. Any of these digital objects, when certified
    with an `NFT`, is as if there was the author''s signature on it and no one can
    say that it is not original or that there are other copies if not signed with
    an `NFT`. Let''s take another example: a copy of a book, by itself, has some commercial
    value. Each copy is substantially the same as the other, and can for example be
    replaced with another completely identical. However, if this copy is signed by
    the author, for example by adding a dedication and date, this copy would become
    unique and unrepeatable. Furthermore, it would acquire a much greater value, so
    it would not make sense to exchange it for a different copy of the book. Here,
    this special copy would become non-fungible, an `NFT`. `NFTs` couldn''t exist
    without the Blockchain. Which Blockchain? `Ethereum` was the first to support
    `NFTs` with its `ERC-721` standard and is currently the most widely used. Since
    `Ethereum` currently has high transaction fees (so-called `gas fees`), Level 2
    solutions (i.e. top-of-the-chain protocols created later to solve some specific
    problems) have emerged for `Ethereum` that also support `NFT`:


    * `Immutable X`

    * `Polygon`


    Other Blockchains that support `NFTs` are:


    * `Bitcoin Cash`

    * `Cardano`

    * `FLOW`

    * `GoChain`

    * `Solana`

    * `Tezos`


