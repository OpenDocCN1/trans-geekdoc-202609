  trans: '

    由于其开创性，BTC 在存在十多年后仍然处于该市场的顶端。即使在比特币失去了其无可争议的主导地位后，它仍然是最大的加密货币，市值在 2021 年突破了 1
    万亿美元大关。


    #### 4.6.2 以太坊 `[43]`](#_part0000_split_077.html#_ftn43)


    在市值方面，比特币的第一个替代品是以太坊，这是一个去中心化的平台，允许您创建和运行智能合约以及去中心化应用（dApps），而无需停机、欺诈或第三方控制。以太坊背后的目标是创建一个任何人都可以自由访问的去中心化金融产品。其
    Ether Token 被用作在平台上移动的媒介，深受希望在以太坊上开发和运行应用的开发者，以及希望使用 Ether 购买其他数字货币投资者的追求。以太坊在
    2014 年推出了 Ether 的预售，获得了巨大的反响，并开启了代币发行（ICO）时代。


    根据以太坊的说法，该平台可以用于 `"代码、去中心化、安全并交易任何内容"`。


    以太坊计划在 2022 年年中将其共识算法从工作量证明（PoW）迁移到权益证明（PoS），这一更新被称为以太坊 2.0。此举旨在让以太坊网络以更低的功耗和更快的交易速度自主运行。


    #### 4.6.3 币安币 `[44]`](#_part0000_split_077.html#_ftn44)


    币安币作为币安交易所交易费用的支付方式，目前按市值计算是第三大加密货币。使用该代币作为交易所支付手段的人还可以获得折扣。


    币安交易所由中国人赵长鹏创立，根据交易量，它是全球使用最频繁的交易所之一。币安最大的竞争优势之一是其开发服务的动力。事实上，尽管该公司仅从 2017 年作为加密货币交易所起家，但今天币安已经在许多不同领域推出了其服务。根据公司网站，其使命是成为整个区块链生态系统的基础设施服务提供商。自从币安币发行以来，交易所一直受益于投资者对该代币兴趣的增加。BNB
    在 2021 年初经历了大幅上涨，这使其进入了企业投资者的版图。


    #### 4.6.4 Tether `[45]`](#_part0000_split_077.html#_ftn45)


    Tether 是所谓的“稳定币”群体中最早且最受欢迎的之一，这些加密货币旨在将其市场价值锚定在货币或其他外部基准上以减少波动。大多数数字货币即使是像比特币这样的主流货币，也经常经历极端波动时期，Tether
    和其他稳定币试图平滑价格波动，以吸引可能谨慎的用户。正因如此，Tether 的价格与美元直接挂钩。该系统允许用户以更及时的方式将其他加密货币转换为美元，而不是实际上转换为法币。Tether
    于 2014 年推出，它自描述为 `"一个基于区块链的平台，旨在"`。


    #### 4.6.5 Solana `[46]`](#_part0000_split_077.html#_ftn46)


    Solana 设计用于托管去中心化应用（dApps）并旨在提高可扩展性。Solana 于 2017 年成立，获得了来自币安和 Polychain Capital
    等机构的 3200 万美元支持。该协议引入了历史证明（PoH），并且比以太坊等竞争对手区块链快得多。事实上，Solana 的混合协议允许由位于旧金山的 Solana
    开发的历史证明（PoH）。


    #### 4.6.6 Cardano `[47]`](#_part0000_split_077.html#_ftn47)


    Cardano 是基于权益证明（PoS）的科学方法创建的。该项目由 Charles Hoskinson 共同创立，他是以太坊的创始人之一。事实上，该项目的研究人员在验证之前已撰写了
    90 多篇关于区块链的文章。Cardano 使用同行评审的研究方法来确保区块链的持久性和稳定。


    #### 4.6.7 USD Coin `[48]`](#_part0000_split_077.html#_ftn48)


    美元币 (USDC) 是一种锚定美元的数字稳定币，运行在以太坊、Stellar、Algorand、Solana、Tron 和 Hedera Hashgraph
    系统上。USDC 由一个名为 Center 的财团管理，包括加密货币交易所 Coinbase 和比特币公司 Bitmain 的成员。USDC 由私人实体发行，不应与中央银行数字货币（CBDC）混淆。USDC
    由 Circle 于 2018 年 5 月 15 日首次宣布并于 2018 年 9 月推出。


    #### 4.6.8 Ripple `[49]`](#_part0000_split_077.html#_ftn49)


    Ripple 是一种既作为加密货币又是金融交易数字支付网络的技术。它于 2012 年发布，由 Chris Larsen 和 Jed McCaleb 共同创立。Ripple
    的核心流程是一个支付结算资产交换和汇系统，类似于国际资金和证券传输的 SWIFT 系统，被银行和金融中间介使用。用于加密货币的代币使用 XRP 符号。


    #### 4.6.9 Terra `[50]`](#_part0000_split_077.html#_ftn50)


    Terra 是一个稳定币的开源支付平台。Terra 区块链允许用户立即花费、储蓄或交易稳定币 Terra。Terra 于 2018 年成立，获得了来自币安和
    Polychain Capital 等机构的 3200 万美元支持。每个稳定币 Terra（如 TerraUSD）依赖于系统的 LUNA 代币来维持其锚定。2021
    年 1 月，Terra 从 Galaxy Digital、Coinbase Ventures 和 Pantera Capital 等处筹集了 2500 万美元。之前的投资者
    Hashed、Arrington 和 Kenetic Capital 也参与了这一轮融资。


