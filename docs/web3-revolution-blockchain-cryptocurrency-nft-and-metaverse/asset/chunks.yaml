  trans: '


    - `Kyber Network``37` (`KNC`): 一允许用户以完全去中心化的方式交换 `ETH` 和 `Token` 的协议，无需使用交易所。

    - `Aave``38` (`LEND`): 该协议允许借贷和贷款广泛的加密货币。产生的利息以该原生代币的形式进行分配。

    - `Synthetix (SNX)`[[`39`]](#part0000_split_077.html#_ftn39): `Synthetix` 是一种发行合成资产（称为
    `Synth`）的协议，这些资产使用原生 `SNX` 代币作为抵押品。用户可以通过 `Smart Contract` 直接转换 `Synth`，而无需使用交易所。这些合成资产代表加密货币、股票和法币。


    我们已经看到以太坊如何基本上通过创建 `Smart Contracts` 催生了一系列加密货币的诞生。这些加密货币有什么价值呢？其初始价值是通过首次代币发行（或
    `ICO`）赋予的。


    ## 4.5 首次代币发行 (ICO)


    在比特币之后，多年年来了一系列不同的区块链，随之也了一系列不同的加密货币。因此，建立了一个与法币市场并行且类似的数字货币市场，即由政府发行的货币，它们不由实物商品（如黄金或白银）支持，而是由发行它们的政府（例如美元、欧元和其他全球其他主要货币）以及股票市场支持。事实上，得益于外汇市场（通常称为
    `forex` 或货币市场），交换不同货币是可能的，就像在股票市场交易股票一样。以完全相同的方式，通过交易所交换加密货币也成为可能。


    我们现在问自己的问题是：**给新出生的加密货币分配什么价值？**


    答案仍然在于与金融市场的类比。当一家公司决定上市时，它必须经过所谓的首次公开募股。首次公开募股或 `IPO` 是向公众提供一家拟在监管市场首次上市的公司证券的要约。这是一个复杂的阶段，需要超出我们研究范围的知识。然而，值得强调的是，对拟上市的公司进行评估是必要的。


    **地，在加密货币市场中，我们通过首次代币发行或 `ICO` 进行。然而，这一过程与 `IPO` 完全不同：它通常以众筹的形式进行，尽管不寻求公共投资的私人
    `ICO` 也是可能的。在 `ICO` 中，数量的加密货币以 `tokens` 的形式出售给投机者或投资者，以换法币或其他加密货币（如 `Bitcoin`
    或 `Ether`）。`ICOs` 可以让初创公司规避限制直接向公众以及风险投资人、银行和股票交易所等中介寻求投资的监管，这些机构可能要求更大的控制权以及未来利润的一定比例或共同所有权。


    此外，根据项目的性质，`ICOs` 可能落在现有监管之外，或者在某些司法管辖区（如中国和韩国）被完全禁止。事实上，由于缺乏监管，`ICOs` 在过去一直是诈骗的工具。


    不到一半的 `ICOs` 生存了下来，而到 2018 年近一半的 `ICOs` 失败了。然而，`ICOs` 并不是筹的唯一方式。


    ## 4.6 交易所发行 (IEO) 和首次去中心化交易所发行 (IDO)


    如果说 2017 年是 `ICOs` 的年，那么 2019 年就是 `IEOs` 的年。`IEO` 由 `Exchange` 管理以筹集资金。作为回报，创业公司必须支付上市费和出售代币的比例。


    首次去中心化交易所发行 (`IDO`)  `IEO`，但 `IDOs` 在去中心化交易所 (`DEX`) 上进行，而 `IEOs` 在中心化平台上进行。然而，去中心化交易所目前的进展有限，许多成员对其实用性表示怀疑。


    ## 4.7 市场上的主要加密货币


    在了解 `Cryptocurrency` 是什么（`Coin` 和 `Token`）、`Bitcoin` 引入了哪些优点以及 `Ethereum` 提供了什么之后，在本节中，我们将提供截至写作时排名之前的加密货币的基本信息。这将为我们提供一个部分但有效的观点，了解每个项目带来的方案的多样性。许多人认为所谓的“拉高崩盘”（pump
    and dump）机制不值得考虑，这种机制由一群人对新 `Token` 制造虚假炒作以引起兴趣。一旦投资者开始购买，其价值就会增加。炒作背后的骗子会卖掉他们所有的
    `Tokens`。


    ### Bitcoin`42`


    `Bitcoin` 最初在 2008 年的一份白皮书中由一个人或一群人提出，他们使用化名 `Satoshi Nakamoto`，并于不久后的 2009 年
    1 月推出。根据 Nakamoto 本人的话，`Bitcoin` 的创建是为了允许*"从一方直接向另一方发送在线付款，而无需经过金融机构*”。


