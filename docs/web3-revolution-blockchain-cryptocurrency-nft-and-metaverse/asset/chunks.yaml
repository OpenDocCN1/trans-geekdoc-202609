    ## 8.4 A new UX


    In technology, the acronym UX stands for the User Experience, or the way in which
    a user interacts and experiences a product, system or service. With the beginnings
    of the internet, in the early nineties, users used the system simply interacting
    via keyboard and mouse. With the so-called Web 2.0, on the other hand, portable
    devices such as smartphones and tablets are starting to spread more and more.
    In this case, the touchscreen becomes the main interface tool with your device.
    With Web 3.0, on the other hand, there will be a further change in the user experience
    through the increasing use of wearable devices, in particular the so-called smart
    glasses that use two technologies in particular:


    ·             Virtual Reality


    ·             Augmented Reality


    Below we will describe how these two technologies work in more detail.


    ### 8.4.1 Virtual reality


    In a recent video posted on YouTube [\[124\]](#part0000_split_077.html#_ftn124)
    from Meta we can get an idea of what Zuckerberg''s new Meta company means by Metaverse:
    an immersive virtual world, which can include virtual elements part of an already
    existing reality, or completely invented elements, environment, objects and people.


    **![](images/00029.jpeg)**


    Figure 29: the Metaverse according to Meta Platforms


    The technology underlying Meta''s vision is virtual reality, a technology that
    is not really new (as we will see) but in which the company already has considerable
    know-how thanks to the acquisition in 2014 of Oculus VR (now renamed Horizon),
    a Californian company founded just 2 years earlier, for $ 2 billion. In this paragraph
    we will describe in more detail what virtual reality is and how it works.


    Virtual Reality can be described as an interactive computer-generated experience
    that takes place within a simulated environment and mainly incorporates auditory
    and visual feedback, but can also allow for other types of sensory feedback such
    as tactile feedback. Furthermore, this immersive environment can be similar to
    the real world or it can be fantastic.


    The first concepts of virtual reality were born in reality as early as 1838, when
    Sir Charles Wheatstone invented the stereoscope. In the mid-1950s, the filmmaker
    Morton Heilig developed the Sensorama (patented in 1962), an arcade-style theater
    furniture that was able to stimulate all the senses, not just sight and hearing.
    It featured stereo speakers, a stereoscopic 3D display, fans, odor generators,
    and a vibrating chair. In 1961 two engineers from the Philco Corporation (Comeau
    and Bryan) developed the first precursor to a head-mounted display as we know
    it today: the Headsight. It incorporated a video screen for each eye and a magnetic
    motion detection system, connected to a CCTV camera. In 1968 Ivan Sutherland invents
    "the Sword of Damocles", capable of tracing the movement of the user''s head by
    superimposing synthetic graphics of primitive 3D computer-generated objects. With
    the age of the internet, virtual reality makes its way especially in the world
    of video games, with experiments and products that are sometimes not very successful
    (for example by Nintendo). To date, the most popular VR Headset devices are probably
    Meta''s Oculus and HTC''s HTC Vive.


    #### 8.4.1.1 How VR works, such as hardware and software


    There are basically 2 types of technologies to use Virtual Reality:


    ·             **Cave Automatic Virtual Environment (CAVE)**


    ·             **Headset technology**


