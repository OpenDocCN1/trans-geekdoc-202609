    \ technologies of machinery and systems. In such a scenario, while the information\
    \ will travel on the web in a secure form for companies thanks to the `Blockchain`,\
    \ the semi-finished products will move between the lines and the warehouses thanks\
    \ to robots and `AGVs`. Consequently, the factory could be managed through a `Metaverse`,\
    \ in which the operator interacts through an `avatar`.\n\nA similar scenario could\
    \ take place, for example, in the retail sector. Let's imagine we want to try\
    \ on an accessory (a dress, a ring, a pair of shoes, to which `NFT` tokens are\
    \ associated) in a `Metaverse` in which `avatars` and objects are a faithful,\
    \ but virtual copy. We imagine that, in addition to the `Oculus`-style viewer,\
    \ the sensory experience is guaranteed through the use of special clothes equipped\
    \ with sensors that make us perceive exactly the experience of wearing the dress,\
    \ to understand if the size tested is the right one. We could try accessories\
    \ directly from home with a completely reliable experience, with no significant\
    \ differences from the \"real\" reality.\n\nWe leave the reader to think about\
    \ the countless scenarios that can arise and develop on the basis of these technologies.\n\
    \nIt is difficult to predict what will happen and which directions we will take.\
    \ What is certain is that we will see radical changes in the years to.\n\n# Glossary\n\
    \nThis section contains the definitions of terms specific to the world of `Web3`.\n\
    \n### Algorithm\nstrategy used to solve a problem and consists of a sequence of\
    \ instructions.\n\n### Altcoin\nany type of cryptocurrency other than `Bitcoin`.\n\
    \n### Fundamental analysis\nin finance, fundamental analysis evaluates the strength\
    \ and profitability of a company. It is often applied to companies to determine\
    \ their intrinsic value (or fair value).\n\n### Technical Analysis (TA)\nin finance,\
    \ technical analysis is the study of the price trend of financial markets, with\
    \ the aim of predicting future trends, mainly using graphical and statistical\
    \ methods. It is used, together with fundamental analysis, for financial decisions.\n\
    \n### Bear\nA bear is an investor who thinks that a particular stock, or the broader\
    \ market, is going down and may be attempting to profit from a decline in stock\
    \ prices. Bears are typically pessimistic about the state of a particular market\
    \ or economy.\n\n### Bitcoin\nfirst Cryptocurrency, created in 2009 by Satoshi\
    \ Nakamoto.\n\n### Bitcoin Maximalist\nBitcoin maximalists believe that `Bitcoin`,\
    \ which is the most popular Cryptocurrency in the world, is the only digital asset\
    \ that will be needed in the future.\n\n### Block\nbasic element of a `Blockchain`.\
    \ Each block consists of three main elements: the data, the hash that identifies\
    \ the block and the hash of the previous block.\n\n### Blockchain\na distributed\
    \ database shared between the nodes of a computer network. As a database, a `Blockchain`\
    \ stores information in digital format.\n\n### Bull\na bull is an investor who\
    \ thinks that the market, a specific stock or an industry is ready to grow.\n\n\
    ### Bull run\nit means that there is an upward trend in the Cryptocurrency market\
    \ for a prolonged period of time.\n\n### CFD\na contract that stipulates the buyer\
    \ will pay the seller the difference between the current value of an asset and\
    \ the value at the time of the contract.\n\n**Coin:** see Cryptocurrency.\n"
  trans: "\nWeb3 旨在通过代币化解决内容所有权并提供数字资产的可移植性，为这种价值与其他同质化资产的交换铺平道路，从而允许创作者将其工作努力变现。这些努力可能包括挖掘和创作内容，如艺术、音乐和其他形式的非同质化代币，这些在一个生态系统中至关重要。同样，`DAOs`\
    \ 代表了一种新兴趋势，它正驱动着工作场所结合文化、数字和哲学信仰体系的深刻且持久的变革。\n\n在未来，日益动态、无边界和层次化的组织可以承担大部分价值创造，通过互联的价值网络、交易所和桥梁提供这些生态系统之间的连接，服务交付将变得更加可行。这些去中心化交易所或资产桥梁不仅提供了交易各种资产类别的方法，还促进了资产的全球流动，创造出吸引数字原生人和人才池的真正全球化经济。\n\
    \n正如扎伯格所指出的，过去的 15 年里，连接人们的方式已从分享信息演变为大规模共享图片，然后是视频。下一步将是共享共同的沉浸式体验。同样，在商业世界，我们正越来越多地从电子邮件（文本）通信转向日益广泛使用的文件共享和视频会议平台，而自然的下一步将是共享用于进行会议的虚拟空间（正如我们所见，这些空间已经存在）。\n\
    \n![图 32：根据 Meta Platforms 定义的元宇宙示例](img/00032.gif)![](img/00033.jpeg) \n\n这类场景在工业世界也将变得日益常见。让我们想象一个生产工厂，例如。这可能是最难“虚拟化”的领域之一，因为操作员的物理存在对于管理生产流程和解决日常问题仍然至关重要。然而，即使在这个领域，大部分数字技术的使用也在扩散，被称为`Industry\
    \ 4.0`。在某些工厂，人机界面已经通过增强现实进行管理，而新工厂的模拟可以使用虚拟现实等沉浸式技术进行验证。但不仅如此。事实上，`Digital twins`\
    \ 代表了物理世界与真实世界之间的桥梁，得益于机械和系统的连接技术，虚拟副本中的行为与真实的生产系统完全一样，并且实实。在这种情况下，虽然信息将得益于`Blockchain`以安全的形式在网络上为公司传输，但半成品将在机器人和`AGVs`的作用下在线线和仓库之间移动。因此，工厂可以通过`Metaverse`进行管理，操作员通过`avatar`进行交互。\n\
    \n类似的场景也可能发生在零售领域，例如。让我们想象我们想在一个`Metaverse`中试穿配饰（连衣裙、戒指、鞋子，这些与`NFT`代币相关联），在这个元宇宙中，`avatars`和物体是忠实但虚拟的副本。我们想象，除了`Oculus`风格的显示器外，通过使用配备传感器的特殊衣服来确保感官体验，这些传感器让我们能够准确感知穿上连衣裙的体验，以判断测试的尺寸是否合适。我们可以直接从家里尝试配饰，获得完全可靠的体验，与“真实”现实没有显著差异。\n\
    \n我们让读者去思考基于这些技术可能产生和发展的无数场景。\n\n预测未来会发生什么以及我们将采取什么方向是困难的。确定的是，我们将在未来几年看到剧性的变化。\n\
    \n# 术语表\n\n本节包含`Web3` 世界特定术语的定义。\n\n### 算法\n用于解决问题的策略，由一系列指令组成。\n\n### 山寨币\n`Bitcoin`之外的任何类型的加密货币。\n\
    \n### 基本面分析\n在金融领域，基本面分析评估公司的实力和盈利能力。它通常应用于公司以确定其内在价值（或公平价值）。\n\n### 技术分析 (TA)\n\
    在金融领域，技术分析是对金融市场价格趋势的研究，旨在预测未来趋势，主要使用图表和统计方法。它与基本面分析一起用于金融决策。\n\n### 熊\n熊是指认为特定股票或大市场将会下跌，并试图从价格下跌中获利的投资者。熊对特定市场或经济状况持有悲观态度。\n\
    \n### 比特币\n2009 年由中本聪创建的首个加密货币。\n\n### 比特主义者\n比特币主义者认为`Bitcoin`作为世界上最流行的加密货币，是未来唯一的数字资产。\n\
    \n### 区块\n`Blockchain`的基本元素。每个区块由三个部分组成：数据、标识区块的哈希以及上一个区块的哈希。\n\n### 区块链\n计算机网络节点共享的分布式数据库。作为数据库，`Blockchain`以数字格式存储信息。\n\
    \n### 牛市\n牛是指认为市场、特定股票或行业准备好增长的投资者。\n\n### 牛市\n这意味着加密货币市场在长时间内呈现上升趋势。\n\n### 差价合约\n\
    一种规定买方将向卖方支付资产当前价值与合同时价值之间差值的合同。\n\n**币:** 参见加密货币。\n\n"
