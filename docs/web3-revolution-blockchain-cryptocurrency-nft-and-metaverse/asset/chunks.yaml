    ### **Tokenization**: process which consists in the transformation of a resource
    or an object within a Blockchain file. This transformation process consists in
    digitizing said object and bringing all its information on a block of a Blockchain.
    To be later exchanged or archived.


    **Trading**: it is a speculation activity on financial instruments with the aim
    of making a profit. Trading is mainly based on technical analysis, fundamental
    analysis and the application of a specific strategy to trading.


    **Trading volumes**: Trading Volumes or Exchange Volumes are the number of transactions
    carried out during a certain period of time on a given financial instrument.


    **Trilemma (Blockchain)**: The Blockchain Trilemma is a concept coined by Vitalik
    Buterin that proposes a set of three main issues - decentralization, security
    and scalability - that developers encounter when building blockchains, ultimately
    forcing them to sacrifice one "aspect" as a compromise to satisfy the other two.


    **UX**: it stands for User Experience, or user experience, and defines the way
    in which a user interacts and experiences a product, system or service. It includes
    a person''s perceptions of usefulness, ease of use, and efficiency.


    **Volatility**: it is a measure of the percentage change in the price of a financial
    instrument over time. Cryptocurrencies are a highly volatile financial product,
    as the price change can vary significantly, especially in the short term. For
    this reason, these products are considered risky for those who want to trade.


    **Wallet**: it is software or hardware designed exclusively to store and manage
    public keys and private keys of our cryptocurrencies and uses advanced blockchain
    encryption techniques to offer and guarantee total security to users. In this
    way, the wallet can save, send and receive cryptocurrencies without increased
    risk


    **Whale (Bitcoin)**: a bitcoin whale refers to individuals or entities who hold
    large amounts of bitcoin. Whales hold enough cryptocurrency that they have the
    potential to manipulate currency valuations.


