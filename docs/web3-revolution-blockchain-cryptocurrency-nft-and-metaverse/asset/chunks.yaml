    ## 章节总结


    在第 4 章中，我们了解了同质化代币，即用户可以相互交换的代币。然而，还有另一类被称为非同质化代币（广为人知的 NFT），我们将在本章中进行描述。


    **关键词**：非同质化代币、`NFT`、版权、数字艺术


    ## 7.1 引言


    在上一章中，我们描述了区块链如何解决缺乏中心化架构带来的安全问题，中心化架构带来了一系列局限性，例如成本和可扩展性。


    最近几个月日益流行的另一个应用是所谓的非同质化代币，或 `NFT`。


    让我们澄清一下同质化和非同质化的含义。


    钞票或加密货币被认为是同质化的，因为可以毫无问题地替换为另一张等值的钞票或加密货币。另一方面，非同质化代币代表的是一个独特的物品：即它不能被复制或替换。


    `NFT` 可以是数字格式的任何对象，例如视频、照片、`GIF`、文本、文章、音频。这些数字对象中的任何一个通过 `NFT` 认证，就像上面有作者的签名一样，没有人说它不是原作的，或者在没有用
    `NFT` 签名的情况下有其他副本。再举一个例子：书的副本本身具有某些商业价值。每份副本实质上与其他副本是相同的，例如可以被另一个完全相同的副本替换。然而，如果这个副本由作者签名（例如通过添加题词和日期），那么这个副本就会变得独特且不可重复。此外，它将获得更大的价值，因此将其与书的不同副本交换是没有意义的。在这里，这个特殊的副本将变成非同质化的，一个
    `NFT`。没有区块链 `NFTs` 就不存在。哪种区块链？`Ethereum` 是第一个通过其 `ERC-721` 标准支持 `NFTs` 的区块链，目前也是最广泛使用的。由于
    `Ethereum` 目前具有高交易费用（所谓的 `gas fees`），`Ethereum` 出现了第 2 层解决方案（即后期创建的用于解决某些特定问题的链上协议），这些方案也支持
    `NFT`：


    * `Immutable X`

    * `Polygon`


    其他支持 `NFTs` 的区块链还有：


    * `Bitcoin Cash`

    * `Cardano`

    * `FLOW`

    * `GoChain`

    * `Solana`

    * `Tezos`


