    图 10：矿工功能示意图。在 `PoW` 机制中，矿工将转换为算力的电力作为输入，以此换取加密货币。


    你是如何挖掘比特币的？矿工可以使用市面上各种不同的软件，也可以创建自己的自定义软件来加速验证过程。以下是用于挖掘比特币的流行软件列表：


