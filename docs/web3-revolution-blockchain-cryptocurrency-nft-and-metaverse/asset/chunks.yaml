    # 1998 - Szabo 设计了一种去中心化数字货币的机制，他称之为“比特黄金”（Bit Gold）。尽管比特黄金从未被实现，但它被称为“比特币架构的直接先驱”。


    同年，中国计算机工程师大卫炎（Wei Dai）发表了名为《b-money：一种匿名、分布的电子现金系统》的论文。在文中，大卫炎概述了所有现代加密货币系统的基本属性：“……一种让大量无法追踪的数字别名方案能够使用货币进行相互支付，并在没有外部帮助的情况下强制执行之间的合同”。


    # 2009 - 比特币由中本聪（Satoshi Nakamoto）正式诞生，这是开发比特币的个人或群体所使用的笔名。2009 年 1 月 12 日，美国工程师、加密活动家哈尔·芬尼（Hal
    Finney）收到了由中本聪发送的第一笔 10 BTC 交易（在本书编写时，其价值约 400,000 美元）。从这一刻起，区块链的概念与加密货币的概念共同演进，我们将在第四章中对其进行更详细的讨论。


    ## 1.4 区块链三困境


    ![](img/00002.jpeg)


    图 2：区块链三困境


    根据 CoinMarketCap 的定义：“区块链三困境是由维太·布特林（Vitalik Buterin）提出的一个概念，它提出了开发者在构建区块链时面临的三个主要问题——去中心化、安全性和扩展性，这最终迫使他们通过牺牲其中一个‘方面’来平衡另外两个”。


    这个问题实际上出现在比特币上，以及在尝试扩展其区块链时出现的问题。事实上，其区块链低的可扩展性源于它的设计方式：加密货币共识算法（`Proof-of-Work`）无法允许它像其他算法那样指数级扩展（例如，`Proof-of-Stake`）。另一方面，它确实具有安全性和持久性，使其在面对任何类型的攻击时都是安全的。我们将在下一章中讨论这些概念。为了解决这一三困境，并在事实上成为理想的区块链，中本聪创建的协议必须能够扩展。因此，后来诞生的大多数区块链以及随之生的加密货币（所谓的代币
    Altcoins），目标都是以最好的方式解决以太坊联合创始人布特林（现今第二大区块链项目）所提出的三困境。


    ## 1.5 区块链的类型


    基本上，我们可以根据区块链是公有的、私有的还是混合的来进行分类。


    ### 1.5.1 公有区块链


    公共区块链指的是可以通过互联网网络公开访问的区块链。这种类型的例子是上述的比特币和以太坊。公共区块链将其数据、软件和开发向公众开放，任何人都可以审查、验证、开发或改进它。然而，公共区块链具有一些安全措施，确保没有攻击者可以轻易更改链的功能。


    这种网络的特征如下：


    - `完全参与`：任何人都可以作为用户或矿工参与其中，没有任何限制。

    - `完全透明`：数据从创建之日起对所有人可见。

    - `去中心化`：没有中央机构。

    - `经济维护`：系统依赖网络。


    ### 1.5.2 私有区块链


    随后，随着区块链的发展，许多公司对私有解决方案产生了兴趣。这种类型与公共区块链具有相同的元素，但访问受限于中央单元。


    这种网络的特征是：


    - `访问网络`：仅限于授权用户。

    - `访问账本`：生成的信息是私有的。


    ### 1.5.3 混合区块链


    这种类型的区块链是公共和私有的融合。在这些区块链中，参与性由一个或多个实体控制。


    例如，一个案例是制药行业，数据由主管机构安全地存储。这种网络的特征是：


    - `访问网络`：仅限于授权机构。

    - `访问账本`：生成的信息是公开的。

    - `没有加密货币`。

    - `安全性`：达到了更高水平。


    在下一章，我们将更详细地查看区块链的工作原理，并澄清之前遇到但未完全明确的一些概念。


    # 2 区块链是如何工作的？


    ## 2.1 点对点 (P2P) 网络


    ## 2.2 分布式账本系统


    ## 2.3 区块


    ## 2.4 哈希算法与密码学


    ## 2.5 共识算法


    ## 2.6 分叉


    ## 章节总结


    在上一章中，我们定性地描述了区块链及其的一些主要优势。在本章中，我们将更详细地观察区块链的关键元素，而不深入探讨只会导致困惑而无法让读者理解技术本质的细节和复杂性。


    关键词：`去中心化网络`、`区块`、`哈希`、`密码学`、`账本`、`共识`、`工作量证明 (PoW)`、`权益证明 (PoS)`。


    一个公有且开放区块链的元素基本上如下：


    1. `点对点 (P2P) 网络`，即一种连接参与区块链的用户并传播经验证的交易区块的分布式网络；

    2. 由加密代码验证的交易`区块`；


