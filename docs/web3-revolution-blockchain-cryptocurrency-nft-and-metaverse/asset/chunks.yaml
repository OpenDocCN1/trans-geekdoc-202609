- raw: '**Halving**: it is an automated process of halving the Bitcoins that miners
    receive as a reward for creating a block. It was created to incentivize mining
    through Proof-of-Work. By doing this for every certain number of blocks the emission
    should be halved.


    **Hash (function)**: the hash function produces a sequence of bits, called digest
    (or string) strictly correlated with the incoming data. The hash is used as a
    kind of fingerprint of each block of a Blockchain. In Bitcoin, identifying the
    hash of each block is an operation relegated to so-called miners.


    **Hash rate**: is the speed with which a mathematical problem is solved. It is
    measured by the hash per second (H/s) parameter.


    **Hype**: The English term hype means a great advertising launch or a sensationalist
    advertisement, accompanied therefore by great expectations, sometimes excessive.
    Hype often accompanies the rapid growth of new technology as a new opportunity.
    The Blockchain and in particular Cryptocurrencies are often subject to this phenomenon.


    **ICO**: it stands for English Initial Coin Offering, it takes place during the
    launch of a new cryptocurrency and that often takes place in the form of crowdfunding,
    although a private ICO that does not seek public investments is also possible.
    In an ICO, a quantity of cryptocurrency is sold in the form of "tokens" ("coins")
    to speculators or investors, in exchange for legal tender (fiat) or other (generally
    established and more stable) cryptocurrencies such as Bitcoin or Ether.


    **IDO**: Initial DEX Offerings, or IDOs, are Tokens that represent any type of
    asset hosted on a decentralized exchange platform (DEX): an IDO occurs when a
    project launches a token through a decentralized liquidity exchange. IDOs offer
    companies a tool to engage their communities in an economy that enriches their
    products and services by enabling them to make smart business decisions about
    their assets.


    **IEO**: An Initial Exchange Offering (IEO) involves the use of a centralized
    cryptocurrency exchange to raise funds for a new project.


    **IPO**: from the English Initial Public Offering, is an offer to the public of
    the securities of a company that intends to be listed for the first time on a
    regulated market. It is the mechanism by which a company is listed on the stock
    exchange.


    **Layer 2**: refers to a protocol built on the basis of an existing Blockchain,
    with the aim of solving some structural problems to the blockchain of origin.
    The main example for Bitcoin is the Bitcoin Lightning Network.


     **Market Cap**: stands for market capitalization and refers to the total dollar
    market value of a company''s outstanding shares. It is calculated by multiplying
    the total number of outstanding shares of a company by the current market price
    of a share.


    **Meme Coin**: a cryptocurrency that originates from an internet meme or has some
    humorous characteristics, with no apparent practical application. The most popular
    Meme Coins are probably "Doge Coin" and "Shiba Inu".


    **Miners**: In the PoW mechanism, miners try to find the hashes of blocks in a
    chain by harnessing the computational power of their computer equipment and ultimately
    consuming electricity in exchange for Bitcoin (for example) as a reward. Ultimately,
    miners validate, authenticate, certify and finalize transactions through specific
    processes. Once miners have created a new block that is accepted by the community,
    the transaction record cannot be changed, making it permanent and irreversible
    information.


    **Network effect**: it is the phenomenon whereby the value or utility that a user
    derives from a good or service depends on the number of users of compatible products.
    When there is a network effect, the value of a product or service increases with
    the number of other users.


    **NFT**: Non-Fungible Token, in Italian non-fungible token. An NFT can be any
    object in digital format, such as a video, photo, GIF, text, article, or audio.


    **Proof-of-stake (PoS)**: they are a class of consensus mechanisms for Blockchains
    that work by selecting validators in proportion to their number of holdings in
    the associated cryptocurrency.


    **Proof-of-Work (PoW)**: it is a form of cryptographic proof in which one party
    (the prover) proves to the others (the verifiers) that a certain amount of a specific
    computational effort has been spent. Verifiers can subsequently confirm this expense
    with minimal effort.


    **Pump and Dump**: is a stock scam that usually involves stocks or cryptocurrencies.
    Scammers create a false hype about a stock or new cryptocurrency to generate interest.
    Once investors start buying a new cryptocurrency, for example, its value increases.
    When the value reaches a certain point, the scammers behind the fake hype sell
    all their tokens, causing the price to plummet, leaving new investors with a worthless
    cryptocurrency (Shitcoin).


    **Satoshi**: it is the smallest unit of Bitcoin. It is named after Satoshi Nakamoto,
    the creator of the protocol used in blockchains and bitcoin cryptocurrency. The
    ratio of satoshi to bitcoin is 100 million satoshi for one bitcoin (10 ^ -8 Bitcoin).


    **Satoshi Nakamoto**: it is the name used by the alleged person or people who
    developed Bitcoin.


    **Scalability**: it generally denotes the ability of a system to increase or decrease
    in scale according to needs and availability. Referring to the Blockchain, scalability
    is the ability of a blockchain to manage an increasing number of transactions
    without affecting performance (see Blockchain trilemma).


    **Sentiment Indicator**: a sentiment indicator is designed to represent how a
    group feels about the market or the economy. These market psychology-based indicators
    attempt to quantify sentiment, in the form of figures or graphically, to predict
    how current beliefs and positions may affect future market behavior. Sentiment
    indicators look at how market players are bullish or bearish and what they think
    and feel, which can help predict future investor behavior. For example, when investors
    are extremely bearish, this is often a counter sign to sentiment indicator traders
    that market prices may start to rise soon.


    **SHA-256**: SHA-2, Secure Hash Algorithm 2, is a set of cryptographic hash functions
    designed by the US National Security Agency (NSA) and first published in 2001.
    SHA-256 is a 256-bit hash function.


    **Shitcoin**: in jargon, it is a cryptocurrency with little or no value or digital
    currency that has no immediate and recognizable purpose.


    **Smart contract**: it is a transaction program or protocol that is intended to
    automatically execute, control or document legally relevant events and actions
    under the terms of a contract or agreement.


    **Solidity**: is an object-oriented programming language for writing smart contracts.
    It was developed by Christian Reitwiessner, Alex Beregszaszi, and several former
    Ethereum key contributors to enable writing of smart contracts on blockchain platforms
    such as Ethereum. Programs compiled by Solidity are meant to run on the Ethereum
    Virtual Machine.


    **Stablecoin**: identifies a particular type of cryptocurrency linked to a real
    financial product developed in order to compensate for the wide volatility typical
    of digital currencies, thereby providing greater stability. An example of a related
    financial asset is a fiat currency (for example the US dollar) or commodities
    with gold.


    **Tangle**: used by the IOTA token, Tangle is a distributed ledger architecture
    (DLT) designed specifically for the Internet of Things (IoT) environment and which
    is based on an apparently similar approach to the blockchain.


    **Token**: cryptographic tokens, or simply tokens, are a type of cryptocurrency
    that represents a specific asset or use and resides on its own blockchain. Tokens
    can be used for investment purposes, to store value or to make purchases.'
