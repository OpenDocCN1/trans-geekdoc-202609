- raw: "·             **Asymmetric key**: the Blockchain uses asymmetric key algorithms.\
    \ To implement this type of algorithm, you need to have two different keys. One\
    \ of the keys will be responsible for encrypting the information to turn it into\
    \ ciphertext, and the other key will be used to decrypt the information to make\
    \ it plaintext. The asymmetric key algorithm is much slower than a symmetric key\
    \ algorithm; however, security is more complex and it is more difficult to be\
    \ hacked. The Blockchain uses an asymmetric key algorithm called Elliptic Curve\
    \ Digital Signature Algorithm (ECDSA)\n\nThe ECDSA algorithm is considered a secure\
    \ standard for the implementation of digital signature systems and today it’s\
    \ use is so varied that it finds application in almost all fields of information\
    \ technology. For example, the Internet's SSL and TLS security certificate infrastructure\
    \ makes heavy use of the ECDSA algorithm. \n\n**![](images/00007.jpeg)**\n\nFigure\
    \ 7: example of using public key and private key in the encryption process\n\n\
    One of the main problems that Satoshi Nakamoto had to face with Bitcoin was the\
    \ distribution of public keys, necessary to guarantee the security of the tokens\
    \ in the relative Wallets (we will see them in chapter 6). Nakamoto's vision was\
    \ to enable the sharing of short, secure, low-cost, easy-to-use public keys, characteristics\
    \ thanks to elliptic curve cryptography. For this Nakamoto decided to use the\
    \ ECDSA algorithm for his system. Furthermore, it is guaranteed that:\n\n·            \
    \ the system is extremely safe. Satoshi decided to use the elliptic curve standard\
    \ secp256k1 for Bitcoin;\n\n·             the computational cost of key generation\
    \ and signature validation is very low;\n\n·             allows the generation\
    \ of infinite public keys.\n\nHowever, the 256-bit ECDSA keys are very long. For\
    \ this, it was decided to use hash functions such as SHA-256 and RIPEMD-160, to\
    \ reduce the size of the public keys and create the Bitcoin address file.\n\n\
    ## 2.5 Consensus Algorithm\n\nIn paragraph 2.3 we mentioned that the generation\
    \ of hashes does not guarantee the full security of the Blockchain, but that it\
    \ is necessary to implement other mechanisms. A consensus algorithm is the set\
    \ of rules that allows the finalization of transactions and the functioning of\
    \ the system and has the purpose of keeping the network usable, safe and decentralized.\
    \ We will focus on this aspect as one of the main differences between the different\
    \ cryptocurrencies that are emerging is also based on the consensus mechanism\
    \ used.\n\n We can divide the consensus mechanisms into two main macro categories:\n\
    \n·            Without authorization (open technology)\n\n·            With authorization\
    \ (closed technology)\n\n In the without authorization mechanism, the technology\
    \ is open to anyone and there is no central body that can decide the rules of\
    \ the protocol and the transactions to be carried out. In the second case, however,\
    \ the validator nodes are known entities that must be trusted for the validation\
    \ of transactions.\n\nThe two main types of open technology consensus algorithms\
    \ will be described below, namely Proof-of-Work (PoW) and Proof-of-Stake (PoS).\n\
    \n### 2.5.1 Proof-of-work (PoW) \n\nIn paragraph 1.3 we have already addressed\
    \ the topic of Proof-of-Work (PoW), when in 1997 Adam Back developed an algorithm\
    \ to limit email spam. The innovation introduced by the Bitcoin Blockchain was\
    \ to use different cryptographic tools, including the hash function, digital signatures\
    \ and PoW, combining them in such a way as to obtain a database that kept the\
    \ history of transactions in a decentralized way. In the case of Bitcoin, in fact,\
    \ the PoW serves to make it difficult to create new identities that are authorized\
    \ to receive the rewards of the new Bitcoins as a certain computational power\
    \ is required. The computational power required to mine new Bitcoins is expressed\
    \ through the number of hashes that a computer can calculate in a certain time\
    \ interval (H/s). More concretely, greater computational power equates to higher\
    \ costs linked to the associated higher energy consumption.\n\nIn fact, without\
    \ going into too much detail, we learned that the only way to find a hash is by\
    \ trial and error, or \"brute force\", whereby machines constantly perform competing\
    \ calculations, until a miner reaches the target. The first to find the solution\
    \ of the block has the right to add this block to the chain and obtain a reward.\
    \ As soon as a block is added, the miners immediately start looking for a new\
    \ block of transactions to validate. By doing so, the greater the use of dedicated\
    \ mining machines, the more secure and resilient the Blockchain will become. The\
    \ majority of computational power will determine the longest chain, the valid\
    \ one.\n\nIn the case of the Bitcoin Blockchain, the difficulty of the target\
    \ is adjusted periodically, in such a way as to keep the emission interval of\
    \ the new Bitcoins constant on average every 10 minutes. The rewards for these\
    \ blocks are halved every 4 years in a process called Halving, forming a geometric\
    \ series with decreasing inflation.\n\n**![](images/00008.jpeg)**\n\nFigure 8:\
    \ trend in the value of Bitcoin after the Halvings. Source: Cointelegraph\n\n\
    Anyone can contribute to the system with their computational power; however, this\
    \ activity requires huge investments in terms of hardware to have a better chance\
    \ of solving these puzzles and therefore to have an economic return. In this regard,\
    \ some companies have specialized in the production of special chips that have\
    \ the sole function of calculating hashes.\n\nIn summary, the Proof-of-Work mechanism\
    \ is necessary to have a certain commitment spent. The more miners devote energy\
    \ to block solving and validating transactions, the harder it will be to perform\
    \ a chain attack.\n\nThe amount of electricity consumption of Bitcoin has reached\
    \ extraordinary levels. For this reason, over time, new consensus mechanisms have\
    \ been created, which could be able to limit energy expenditure while maintaining\
    \ a decent level of security and decentralization. For example, Ethereum, the\
    \ second largest Cryptocurrency by capitalization, has been implementing the transition\
    \ from a PoW to a Proof-of-Stake (PoS) for some years.\n\n Another problem with\
    \ PoW is scalability. For comparison alone, while Visa can approve up to 4,000\
    \ transactions per second, Bitcoin can only process seven. A solution to this\
    \ problem is called \"Lightning Network\". The Lightning Network protocol was\
    \ designed to improve the scalability of Bitcoin due to the fact that the Lightning\
    \ Network functions as a second layer (Layer 2) network on top of Bitcoin. This\
    \ allows to do things that normally couldn't be done, such as making instant transactions\
    \ with very low fees. Without deep dive into too many technicalities, a network\
    \ is created that models’ payment channels using Smart Contract (we will talk\
    \ about this in the next chapter) to ensure that the network can operate in a\
    \ decentralized way. This approach offers one of the most powerful options for\
    \ improving Bitcoin's scalability: in fact, it can lead Bitcoin to reach levels\
    \ close to 1 million transactions per second, many more than those managed by\
    \ payment systems such as VISA or MasterCard.\n\n**![](images/00009.jpeg)**\n\n\
    Figure 9: schematic representation of how Lightning Network works. Source: Wikipedia\n\
    \n#### 2.5.1.1 Miners\n\nMiners are the nodes that exploit the computing power\
    \ of their computers to mine Bitcoin. They are called miners because, like miners\
    \ looking for gold by making a physical effort, Bitcoin miners try to find the\
    \ hashes of the blocks of a chain by harnessing the computational power of their\
    \ computers, ultimately consuming electricity in exchange for Bitcoin as a reward.\
    \ Miners validate, authenticate, certify and finalize transactions through specific\
    \ processes.\n\n**![](images/00010.jpeg)**"
