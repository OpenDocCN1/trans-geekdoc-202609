  trans: '

    每种加密货币都必须有自己的交易日志。一旦创建了这个注册表，就必须发行 `Tokens`，其交换将成为存储在分布式注册表上的交易。例如，已经发行了约 1700
    万个代币（即 `Bitcoin`），而超过 2100 万个的永远不会被发行。此外，电子代币是可分的，因此也可以交易代币的碎片。例如，一个 `Bitcoin`（或
    `1 BTC` 代币）可以被拆分成亿分之一，被称为“Satoshi”，这样如果根据需要，即使是极小金额也可以交易。


    从这个意义上说，我们可以说 `Coin` 是拥有自己注册表的 `Token`，而没有自己注册表（因此利用了现有 `Blockchain` 的注册表）的 `Tokens`
    简单称为 `Token`。


    事实上，由于所谓的首次币发行（`ICO`），任何人都可以创建和发行 `Tokens`，我们将在 4.4 节中讨论这一点。因此，`Bitcoin` 实际上是一个使用
    `BTC` 代币作为交易货币的 `Coin`，就像 `Ethereum` 使用 `ETH` 代币一样。大多数代币是在 `Ethereum` 区块网上发行的，采用
    `ERC-20` 格式（见词表），尽管它们存储在 `Ethereum` 区块网上，但它们与该网络的原生 `Coin`，即 `Ether` (`ETH`) 无关。事实上，有必要区分
    `Coin`、`Ether` 和 `Ethereum` 网络，它们并不是同一件事。如今发行一个新的 `Token` 并不十分复杂，因为从理论上讲，编写一个特殊的
    `Smart Contract`（我们将在 7.1 节中讨论）即可，例如在 `Ethereum` 网络上。相比之下，创建一个新的 `Coin` 要复杂得多。


    因此，`Tokens` 是数字资产的表示，我们可以将其想象成赌场里的筹码或游戏房的代币：它们只有在所使用的语境下才具有货币价值。


    在像 `Bitcoin` 这样的 `PoW Blockchain` 中，`Coin` 或 `BTC` 代币的诞生是作为矿工的奖励，奖励他们通过硬件消耗的能量来编写区块，将其添加到链中并使其变得越来越可靠和安全。然而，随着其他应用和共识机制的出现，`Tokens`
    代表了功能更丰富的资产。事实上，我们可以根据其经济用途识别不同类型的代币：


    1. **实用型代币 (Utility Token)**：用于帮助初创公司、公司或项目开发小组筹资或融资。许多加密货币项目通过 `ICOs` 向对项目感兴趣的人提供实用型代币，宣布发行特定数量的代币。这些代币代表了一种手段（如优惠券），用于访问公司的产品或商品/服务：它们用于发行公司的产品或服务；

    2. **证券型代币 (Security Token)**：`Security Tokens` 被视为真实的财务投资，持有者拥有底层资产的部分价值，但不意味着拥有“发行”公司的所有权；

    3. **股权代币 (Equity Token)**：它是 `Security Token` 的一种，但对所有者意味着意味着所有权。它的运作方式更像传统的股权资产。换句话说，持有股票代币的人对其投资拥有某种形式的所有权。


    我们意识到 `Coin` 和 `Token` 之间有时微妙的区别可能给读者带来一些疑问和困惑。然而，出于纯实目的考虑，对于那些打算从财务角度尝试投资这些资产的人来说，它们都可以被简单地视为加密货币，对于除
    `Bitcoin` 以外的所有其他货币则称为 `Altcoins`。出于这个原因，在本书后续的讨论中，我们不会做这种区分，而是将专门讨论加密货币。


    ## 4.2 加密货币的历史


    在第一章中，我们简要提到 `Blockchain` 概念是如何演变的，并停在了 2009 年，那是第一种加密货币（即 `Bitcoin`）正式发布的一年。现在让我们来看看这个市场是如何演变的。


    - **2009 - `Bitcoin` 出生**，化名为 `Satoshi Nakamoto`。

    - **2011** - `Namecoin` 于 4 月出生，是首个从 `Bitcoin` 分叉中产生的加密货币，并使用相同的 `Proof-of-Work`
    共识算法。与 `Bitcoin` 一样，它被限制 2100 万个币。

    - `Litecoin` 于 10 月出生，正式成为世界上第三种加密货币。主要区别在于它使用 `scrypt` 作为哈希函数，而不是 `Bitcoin` 的
    `SHA-256`。


    从那一刻起，`Blockchains` 和加密货币的数量显著倍数增长。在写作时（2022 年 1 月），已有超过 10,000 种不同的加密货币。


    - **2014** - 8 月 6 日，英国宣布其财政部已委托进行了一项关于加密货币的研究，以确定它们在经济中可能扮演的角色。其最终报告于 2018 年发布。

    - **2019 / 2020** – 即便在全球疫情危机之后，加密货币被视为货币储备，其中某些价值开始爆发，引起了许多机构投资者的关注，同时也引起银行和中央政府对市场监管的担忧。

    - **2021** - 6 月，萨尔瓦多成为第一个接受 `Bitcoin` 作为法定货币的国家。效仿萨尔瓦多，古巴也决定在 8 月接受 `Bitcoin`
    作为法定货币。然而，在 9 月，全球最大的加密货币市场中国政府宣布所有加密货币非法。


    ## 4.3. Bitcoin，一种新的数字货币


    Giacomo Zucco 是比特币专家和顾问，也是 `Bcademy` 的创始人，被认为是术语中所定义的“比特币主义者 (Bitcoin maximalist)”。比特币主义者认为，作为世界上最流行的加密货币，`Bitcoin`
    是未来唯一的数字资产，且所有数字货币都劣于比特币。不仅如此：许多人认为 `Altcoins` 是真正的骗局。Zucco 将比特币描述为“人类使用了数千年货币进入信息时代的尝试，这种货币本质上是黄金”。事实上，由于一系列优势，黄金是市场上最易售卖的商品：


    - 它不会腐烂，具有延展性和可分性，因此可以以不同的形式运输（例如，硬币、金块和金条）

    - 它不受国家的中央控制，即无论你身何处，它的价值都得到认可；

    - 它不会被政府通过改变数量来操纵；

    - 不可测量，这意味着一旦双方达成协议，第三方无法阻止黄金交易。


    然而，黄金也有一些缺点：


    - 大批量运输很困难

    - 在非专家眼中，它是可以伪造的

    - 它不像法货币那样可以虚拟化


    相反，从中央政府的角度来看，法货币货币具有若干优势：


    - 它们可以被中央政府的货币政策控制和操纵；

    - 是虚拟化的。值得注意的是，97% 的货币供应仅以计算机数据库中的记录形式存在，其余的是流通货币。

    '
