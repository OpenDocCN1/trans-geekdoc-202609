  trans: '


    法币本质上是虚拟货币，且自 1971 年以来，它们不再受黄金/货币可兑换性的限制。事实上，美国总统在 1971 年 8 月 15 日晚上在电视上宣布的突然决定，标志着在布雷顿森林会议上建立的战后国际货币体系的终结。


    比特币旨在通过吸收黄金和法币的主要优点来成为一种数字货币，即：


    - 中心化实体对货币供应的`**不可操纵性**`。比特币基于`Blockchain`（区块链），这是一种本质上是去中心化的数据库。政府无法对其进行控制，例如通过制造恶性通膨胀。让我们以津巴布韦或委内瑞拉的情况为例，其储蓄的购买力每周下降高达
    30%。然而，西方也免受通货膨胀的影响：1970 年的 1 美元购买力等同于 2019 年的 6.59 美元，在此期间的通胀率变化率为 558.63%。


    - 使用货币的`隐私性`（考虑自由度有限的国家，例如阿富汗，那里女性甚至无法开设银行账户）


    - `它可以虚拟化`，因为可以以电子形式交换，因此易于运输和使用


    - `它是安全的`，因为它遵循`Blockchain`（区块链）的不可篡改性和安全规则


    比特币为数字时代的问题提供了另一个解决方案：监控货币交换的实体对数据的中心化。事实上，支付是人类以来最敏感的信息之一，然而，近年来出现的新型数字支付形式，如`Apple
    Pay`、`PayPal`、`Google Pay`和`Stripe`（仅列举著名的），收集了随后可以转售的敏感数据。如果管理不当，这些信息可能会变成控制的形式。举个例子？2011
    年 6 月 14 日，WikiLeaks 在遭到`Amazon`、`PayPal`、`Visa`、`MasterCard`、`Bank of America`和`Western
    Union`的抵制后，决定接受比特币捐赠。正如 Stefania Maurizi 在她的书《Il potere segreto》（意为“秘密权力”）中所报告的那样，这些机构在美国政府的压力下，突然切断了向
    WikiLeaks 捐赠的所有可能。


    ### 4.3.1 比特币如何价值数千美元？


    在引言章节中，我们提到了 Laszlo Hanyecz 的事迹，他在 2010 年 5 月 22 日在佛罗里达州的一个小镇用 10,000 个比特币购买了两块价值
    30 美元的披萨。`这是历史上比特币的第一个价格，汇率为 1 BTC = 0.003 美元。`今天，在几乎 12 年后，那两个披萨为那家幸运的披萨店赚了价值约
    4 亿美元的等值。但一个最初没有任何价值的虚拟资产突然变成价值载载的机制是什么？


    **换句话说，谁决定了比特币的价格？**


    价格由所有想要参与买卖过程的人决定，本质上就是它的用户。这听起来很显而易见，但事实确实如此，尽管有多个因素在起作用。事实上，矿工在将比特币卖给感兴趣的相关同时可以提议价格：当两个人在进行谈判时，一方提出一个价格而另一方愿意接受，那么交易就成了。我们刚刚描述的过程与所有现有商品的交换过程相同。这种情况每天发生几十、数百或数千次，且通常伴随着巨大的波动。


    比特币的价值随时间而变化，本质上基于用户的信任、其实用性和流行程度。比特币没有官方或单一的价格，因为没有单一的交易平台，即所谓的`Exchanges`（交易所），我们将在第
    6 章讨论。


    当然，比特币价格中的一个基本组成部分是其内在的稀缺性。事实上，它的`Blockchain`（区块链）被设计为有限数量的代币。因此，需求越大，价值越高。


    ## 4.4 以太坊，排名第一的山寨币


    在描述了比特币的意义以及它多年来积累价值的原因之后，我们现在介绍以太坊，市值排名第二的加密货币。为什么需要以太坊，以及更广泛意义的山寨币？


    以太坊由程序员 Vitalik Buterin 于 2013 年构思，共同创始人还包括 Gavin Wood（后来`Polkadot`的创始人）、Charles
    Hoskinson（后来`Cardano`的创始人）、Anthony Diorio 和 Joseph Lubin。该网络于 2015 年 7 月 30 日上线，目标是允许任何人部署永久的、去中心化的应用程序。这是与比特币的主要区别，正如
    Vincenzo Cacioppoli 在 Cryptonomist 的一篇文章中所报道：


    > “许多人认为以太坊比比特币更好，从其在现实世界的应用来看。比特币作为一种支付工具，仍然难以找到空间。以太坊为区块链世界带来了一场真正的革命，它的例子被其他项目跟随，例如`Solana`、`Cardano`和`Polkadot`。”作者认为，“悉尼大学的研究显示，以太坊作为价值载体比比特币更好，尽管比特币的流通量是有限的，而太不是。据澳大利亚研究人员认为，以太坊是比比特币更有效的抗通胀工具。”


    然而，也有许多怀疑者，包括上述的比特币主义者，他们对以太坊项目提出了各种批评，特别是在技术方面。


    目前市场上许多山寨币都基于以太坊，例如`Layer 2`。其中我们提到：


    - `Chainlink`(LINK)：一个去中心化的网络，能够以安全的方式连接`Blockchain`与现实世界之间的差距。大多数情况下，dApps（去中心化应用）需要现实数据来运行，因此它们依赖于预言机（oracles），后者提供可靠的信息源。考虑到某些
    dApps 管理着数亿美元，这些外部通信桥的安全性至关重要。`Chainlink`通过使用高度去中心化的基础设施、创新的硬件和受保护不受操纵的数据源，降低了与预言机相关的潜在风险。


    - `Compound`(COMP)：传统市场的去中心化等品。该协议基本上是一个流动性池，允许用户获取和贷款，并对其加密货币赚利。


    - `MakerDAO`(MKR)：一种通过`Smart Contracts`在不需要中间人的情况下获取和贷款的服务。它是 DeFi 生态最早的项目之一，也是最常用的项目之一。


    - `0x`(ZRX)：一种促进平台间交互的标准，并引入了“互联流动性”的概念：使用`0x`的操作者共享各个平台上的交易订单，以获得更好的流动性。


    '
