    Polkadot 是一种促进任何类型数据或资产（而不只是代币）在不同区块链之间传输的协议，从而使得广泛的区块链具有互操作性。这种互操作性旨在建立一个完全去中心化且由用户控制的私有网络，并简化新应用程序和服务的创建。Polkadot
    的原生代币 `DOT` 旨在提供治理和网络操作，并创建平行链（即所谓的并行链）。


    ### 4.6.11 狗狗币[52]

    狗狗币（Dogecoin）由两位美国计算机工程师比利·马库斯（Billy Markus）和杰克·帕尔默（Jackson Palmer）于 2013 年创建。据报道，马库斯和帕尔默创建这种货币是为了开玩笑，以此评论加密货币市场的疯狂投机。狗狗币主要作为
    Reddit 和 Twitter 上的小费系统，用于奖励高质量内容的创建或分享。你可以通过加入使用数字货币的社区获得狗狗币打赏。狗狗币在 2021 年因价格飙升而引起了轰动。这种以柴犬图像作为头像的代币，已被包括达拉斯独行者队（Dallas
    Mavericks）、Kronos 和埃隆·马斯克拥有的美国航天制造商 SpaceX 在内的一些大型公司接受作为支付形式。


    ### 4.6.12 莱币[53]

    莱币（Litecoin）于 2011 年推出，是首批跟随比特币的加密货币之一，由理工学院（MIT）毕业生、前谷歌工程师李强（Charlie Lee）创建。莱币基于开源全球支付网络，该网络不受任何中央机构控制，并使用
    `scrypt` 作为工作证明。尽管莱币与比特币非常相似，但它的区块生成速度更快，因此提供了更短的交易确认时间。


    它的主要优势正源于速度和经济性。莱币交易通常在几分钟内确认，且交易手续费几乎忽略不计。这使其成为发展中国家比特币的极佳替代方案，在这些国家，交易手续费可能是支持哪种加密货币的决定性因素。


    截至 2021 年 1 月，莱币是受广泛接受的加密货币之一，全球已有超过 2,000 多商户和商店接受 `LTC`。


    截至 2021 年 11 月，莱币的市场规模为 140 亿美元，每个代币价值约为 200 美元，成为全球第 17 大的加密货币。


    ### 4.6.13 算法链[54]

    算法链（Algorand）是一个基于区块链的平台，与大多数平台一样，旨在实现安全、可扩展和去中心化。Algorand 平台的开发由总部位于波士顿的私有公司
    Algorand, Inc. 监督，由理工学院教授西尔维奥·米卡利（Silvio Micali）于 2017 年创立。这种区块链与其他区块链的不同之处在于它的共识机制，即所谓的纯权益证明（`PPoS`），在该机制中，区块创建者不是根据财富选择的，而是随机选择的。通过
    `PPoS`，被选中的概率与“质押”的 `ALGO` 总量成比例，但不受限制。这种共识机制旨在增加去中心化，因为低“质押”要求有利于来自世界任何地方的参与。此外，安全性很高，因为随机选择为黑客或恶意用户制造了巨大的障碍。


    另一个值得关注的特征是，Algorand 声称自己是“碳负的”：它不仅产生 `CO[2]` 排放，还能从系统中永久移除 `CO[2]`。


    Algorand 的原生代币被称为 `ALGO`。


    ### 4.6.14 IOTA[55]

    IOTA 目前在加密货币领域代表了某种独特性，这也就是为什么，尽管它在市值方面目前不处于主流地位，但我们认为提一下它是很有用的。


    IOTA 是一种为物联网（`IoT`）设计的开源分布式账本，即工业系统（如机器人、机床、加工厂等）之间的数据交换。IOTA 不基于区块链机制，而是基于一种名为
    `Tangle` 的机制，其动力是实现比基于区块链的分布式账本具有更高的可扩展性。IOTA 不使用矿工来验证交易，而是网络上发布新交易的节点必须批准两笔之前的交易。交易可以无佣金的形式发布，便于微交易。


    这种机制因其不寻常的设计而受到批评，目前尚不清楚它在实践中是否有效。由于这个原因，IOTA 从头重写，以进行 2021 年 4 月 28 日发布的名为 `Chrysalis`
    或 `IOTA 1.5` 的网络更新。然而，尽管存在这些怀疑，该项目仍拥有顶级投资者，特别是在工业领域。例如，捷虎路虎汽车（Jaguar Land Rover）和博世（Bosch）等公司已经在汽车和物联网领域开发了基于
    IOTA 技术的概念。IOTA 还参与了开发智能城市、建立数字身份、废物管理和本地能源交易的项目。


    IOTA 以 `megaIOTA` 单位（1,000,000 `IOTA`）交易，并以 `MIOTA` 符号列出。


    # 5. 加密货币的购买、交易、持有和投资


    ## 5.1 主要加密货币交易所


    ## 5.2 券


    ## 5.3 钱包


    ## 5.4 投资策略


    ### 章总结

    在本章中，将介绍购买和存储加密货币的主要交易平台。此外，还将提到可以通过 `Broker` 使用其他金融工具，如 `CFD`、`ETF` 和 `ETN`。


    **关键词**：`Exchange`、`Broker`、`CFD`、`ETF`、`ETN`、`Wallet`


    加密货币根据用途和所采取的策略可能产生不同的价值：


    1. 它们本质上是实用代币，得益于社交和商业背景下的潜在收益（例如通过 `Smart Contracts` 或 `NFTs`，我们将在下一章讨论）

    2. 它们是像法币一样的交换货币

    3. 它们是价值存储手段，与传统黄金相当

    4. 由于其高波动性，它们是市场上的高投机性资产


    加密货币可以通过所谓的 `Exchange` 进行购买和交换，这与外汇和股票市场完全相似（尽管会有一些差异）。选择 `Exchange` 时需要考虑的主要因素是可用加密货币的数量以及适用于交易的手续费。对于交易者来说，这一点非常重要。


    银行也进入了这个市场，为客户提供了通过自己的机构购买这种资产的机会。原因很简单。正如《Cryptonomist》报道的，“无法忽视一种价值 1 万亿美元的资产，它被认为是对抗通胀的避风港，并吸引了世界上最富有的人和机构投资者的关注。正如我们无法忽视过去几个月来市值已达到
    3 万亿的整个加密领域一样”。

