    如果你决定投资上述金融工具，我们建议你通过专业人士、课程或书籍来深入研究，这些资源详细解释了金融市场的投资机制。


    ## 5.3 钱包


    存储和保护加密货币有许多方法，在本节中，我们将查看每种可能性及其优缺点。事实上，必须立即澄清一点：加密货币实际上存储在 `Blockchain`（区块链）上，或者存储在每个公共地址上，每个地址都有一个使用它们时所需的私钥。任何知道公共地址私钥的人都可以自由使用存储在该地址上的所有代币，因此，妥善保管个人地址的私钥至关重要。


    钱包或数字钱包是存储公钥和私钥的地方，类似于存储硬币、钞票和信用卡的实体钱包。


    `Wallet` 是一种专门用于存储和管理我们加密货币公钥和私钥的软件或硬件，它利用先进的 `Blockchain` 加密技术为用户提供并保证全方的安全。通过这种方式，`Wallet`
    可以在风险增加的情况下保存、发送和接收加密货币。在操作 `Wallet` 之前，有必要了解市场上提供的钱包类型，并研究每种钱包的优缺点，以确定哪种最符合个人的需求。正如我们将看到的，用户有多种手段来保护其私钥。


    ### 5.3.1 冷钱包


    所谓的“冷钱包”是指私钥存储在离线状态、未连接的任何类型的钱包。`Paper Wallets`（纸钱包）属于此类：它由将私钥写在纸上组成，可能是保存密钥最安全的方法，但同时也是最不方便。


    ### 5.3.2 热钱包


    这些是存储在连接互联网的设备上的钱包。热钱包从定义上来说是不安全的，但理解风险至关重要，因为现在必须预计每个设备都可能被破解。基本上，它是一个作为私钥保险箱的软件，并使用密码来保护它。然而，重要的是指出，理论上安装软件的
    PC 可能会被篡改，因此 `Wallet` 密码不应保存在计算机的任何地方。此外，强烈建议进行定期备份，以防 PC 损坏导致密码（从而导致硬币）丢失。


    ### 5.3.3 硬钱包


    硬钱包是冷钱包和热钱包的结合。这种类型的钱包由 `Ledger` 或 `Trezor` 等公司创建，由一个 USB 闪存器组成，你需要输入 PIN 码才能访问存储在上面的所有私钥。例如，`Ledger`
    保留存储在 `Wallet` 中所有数据的备份；因此，即使它被毁也可以恢复。而 `Trezor` 则需要你使用指纹并输入 PIN 来访问资源。


    ### 5.3.4 交易所


    交易所可能是存储硬币最流行的方式。大多数交易所还提供 `Wallet`，以便在交易前后存储硬币。这里的主要优势在于使用的便利性；然而，你需要依赖于一个你可以信任的安全的
    `Exchange`（交易所）。


    ### 5.3.5 HD 钱包


    HD 钱包（分层确定性钱包）使用单个 12、18 或 24 个关键词的种子（即按特定顺序排列的单词列表，存储了检索钱包所需的所有信息），通过它们可以生成无限数量的地址。HD
    钱包有硬钱包和软（热）钱包的形式提供；其中一些是免费的，另一些需要付费。最流行的由 `Trezor`、`KeepKey`、`Ledger Nano S`、`Mycelium`、`Jaxx`、`Eidoo`
    和 `Electrum` 提供。这些钱包只需要一次备份，以便你可以在任何时候完全恢复数据。这是由于使用了 `BIP32` 传输协议，该协议允许父密钥在层级结构中创建子密钥。`BIP32`
    规定了如何从主种子在所谓的树结构中派生出密钥对，以及如何构建使用这种结构的钱包。HD 钱包的第二个优势是在无法访问相应私钥的情况下创建公钥序列。这使得 `Wallet
    HD` 可以在不安全的服务器上或仅具有接收能力的设备上，为每笔交易发放不同的公钥。


    ## 5.4 投资策略


    如果几年前投资加密货币看起来像是一场真正的赌博，今天它代表了一种更被接受的活动。然而，关于这一点有几种思想哲学。例如，根据经济学家 David Rosenberg
    的观点，`Bitcoin` 在过去期的指数级增长是不正常的，这导致他宣布 `Bitcoin` 现在是“最大的市场泡沫”。然而，Rosenberg 本人承认
    `PayPal`、`Fidelity` 和 `Microstrategy` 等机构投资者的加入不容忽视。


    根据 Morgan Creek Digital 创始人 Anthony Pompliano 的观点，购买 `Bitcoin` 是保护自己免受通货膨胀的良好选择，虚拟货币可以与黄金相比，并被视为购买力的保护者。


    因此，对于那些想要迈出这一步的人，除了考虑第 5.1 节提到的 `Exchange` 金融市场差异外，还应强调，虽然在传统市场中无法购买股票份额，但在加密货币市场可以购买代币的碎片。例如，在本文写作时，`1
    BTC` 的价值约为 `$40,000`，这使得普通投资者难以购买整个比特币。但是，正如前面提到的，可以购买它的部分。


    在本节中，我们将提供关于在决定投资一种或多种加密货币时可以使用哪些主要策略的概述。随后，我们将根据风险水平描述以下内容：


    1. 长期策略

    a. 关注 `Ethereum` 和 `Bitcoin` 作为价值的存储手段

    b. 通过关注前 10-15 种货币创建一个不平衡的投资组合

    c. 通过基本面分析押注低知名但高潜力的代币


    2. 短期策略

    a. 使用技术分析进行交易


    ### 5.4.1 关注比特币或以太坊作为价值的存储手段


    风险最低的投资方案是购买目前市场上按市值排名的两种主要的货币。市值是决定加密货币重要性的两个决定性因素之一，另一个是每日交易量。第一个因素决定了资产在市场上的整体重要性：市值越大，加密货币的相对稳定性越高。


