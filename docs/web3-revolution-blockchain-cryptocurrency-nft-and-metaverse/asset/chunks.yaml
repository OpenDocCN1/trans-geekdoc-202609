    \ possible to identify the marker image, but also to calculate its position and\
    \ orientation. Once recognized, the on-screen marker is replaced with a virtual\
    \ 3D version of the corresponding object. This is done to allow the user to observe\
    \ the object in more detail and from various angles. Rotating the marker also\
    \ rotates the virtual replica.\n\n3.              **Position based:** Unlike recognition-based\
    \ systems, location-based augmented reality relies on GPS systems, digital compasses,\
    \ speed sensors or accelerometers to provide location data, while augmented reality\
    \ information overlay is activated based on these inputs. It is also known as\
    \ markerless augmented reality. The location tracking capabilities in smartphones\
    \ make it easy to take advantage of this type of augmented reality technology,\
    \ making it quite popular. Some common uses of location-based AR include mapping\
    \ directions, searching for nearby services, and other location-centric mobile\
    \ apps. A popular example is provided by Pokémon Go - the game uses your smartphone's\
