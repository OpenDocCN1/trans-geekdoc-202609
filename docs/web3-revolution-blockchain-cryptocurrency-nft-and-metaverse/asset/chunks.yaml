    the other terminals (Hosts) of the network. This means that through this configuration
    any node is able to initiate or complete a transaction. Equivalent nodes may differ
    in local configuration, processing speed, bandwidth, and amount of stored data.
    Among the main features of decentralized networks, we list the following:


    - `Napster`: launched in 1999 by Shawn Fanning and Sean Parker (who would later
    become Facebook). It was closed in 2000 due to legal issues related to copyright.

    - `Bit Torrent`: born in 2001 by Bram Cohen, a computer science student at the
    University of Buffalo

    - `eMule`: the project started in 2002 by Hendrikkreuz

    - `eDonkey2000`


    These protocols, although legal (data exchange is not illegal), are nevertheless
    mostly used for trafficking works such as movies, music and video games. In the
    United States, more than 200,000 lawsuits have been filed for copyright on `Bit
    Torrent`.


    ## 2.2 The distributed ledger


    In the example of the online library described in the previous chapter we saw
    how Blockchain is based on a accounting system, i.e., a system in which each participant
    receives a copy of the transaction log. Think of this type of accounting system
    as a family tree that, instead of the names of the people who own and borrow the
    books, also contains information about the payment value, time, and addresses.
    Regarding the amounts, what happens is very similar to any of current banking
    systems. However, there are substantial differences:


    1. the ledger has no banker by virtue of the distributed architecture described
    above

    2. addresses do not represent people'' names, nor who owns what. Therefore, we
    can define it as an anonymous accounting system (in Chapter 3 we will actually
    see this is not entirely true). When it comes to a Cryptocurrency account within
    the big ledger, the only person who can access it is the person who has the password
    to do so. This can be dangerous: in fact, if you accidentally lose the password
    of the Wallet that the ledger holds, any value will be lost forever. As we will
    see later, this risk is reduced if virtual wallets are used

    3. the register is visible to everyone, as it is completely decentralized. Therefore,
    everyone can see a user''s account, as well as how much value that wallet is


    ## 2.3 Blocks


    Blocks are the bricks of the Blockchain. Each block of the chain basically contains
    3 elements:


    - `data`: the type of data stored in the block depends on the type of Blockchain.
    For example, the Bitcoin Blockchain stores the details of one or more transactions,
    such as user, recipient and the amount of Bitcoin traded.

    - `hash`: a string of numbers and letters that identifies that block and its content
    and that is always unique, like a kind of fingerprint. Each time a new block is
    created, a new, unique and specific hash for that block is calculated. If any
    data inside the block changes, the hash will also change accordingly.

    - `hash of the previous block`: thanks to which the connection to the previous
    block is generated, making the blockchain particularly secure.

    '
