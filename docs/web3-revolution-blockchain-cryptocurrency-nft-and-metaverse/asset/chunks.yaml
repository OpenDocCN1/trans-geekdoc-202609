    ###### 2.5.3 Difference between PoW and PoS


    What are the differences between `Proof-of-Work` and `Proof-of-Stake`? Below we
    list the main:


    * `Proof-of-Stake` requires less electricity than `Proof-of-Work`. It is therefore
    more scalable.

    * `Proof-of-Stake` is able to process a greater number of transactions than `Proof-of-Work`,
    for the same amount of time.

    * Both can have centralization problems... amount of cryptocurrency made available
    (`stake`) heavily affects the probability of validating a block


    ###### 2.5.4 Other consensus mechanism


    While `PoW` and `PoS` are the most widespread consensus mechanisms in the `Blockchain`
    environment, there are other consensus algorithms such as:


    * `Proof-of-Capacity` (`PoC`), used by `Burstcoin`, it allows the sharing of the
    memory space of the contributing nodes on the `Blockchain` network.

    * `Proof-of-Activity` (`PoA`), used on the `Decred` `Blockchain`, is a hybrid
    that exploits aspects of both `PoW` and `PoS`.

    * `Proof-of-Burn` (`PoB`) is another that requires traders to send small amounts
    of coin to inaccessible wallet addresses, then "burning" them.

    * `Proof-of-History` (`PoH`), developed by `Solana`, cryptographically encodes
    the passage of time itself to obtain consent.


