    比特币对环境的影响是什么？根据剑桥比特币电力消耗指数（Cambridge Bitcoin Electricity Consumption Index）截至本文时发布的最新数据，比特币的年用电量约为
    123 TWh，这与挪威或阿根廷等国家的年度能源消耗相当。此外，如图 12 所示所示，比特币的能源消耗正呈指数级增长。或者说，一次 BTC 交易消耗的能量相当于
    120 万次 VISA 线路交易。


    ![](img/00012.jpeg)


    |  ||  |

    | --- | --- |

    |  || ![](img/00013.jpeg) |


    图 12：比特币总能源消耗²²


    图 13：1 笔比特币交易与 100,000 次 VISA 交易的能源消耗对比²⁴


    正因为这个原因，我们看到专业人士的主要努力之一是寻找新机制来降低能源消耗。例如，Algorand 平台声称甚至实现了碳负极。事实上，通过与 ClimateTrade
    合作，Algorand 正在抵消其二氧化碳排放，现在是一个具有负碳足迹的区块链。此外，Solana、Polkadot 和 Cardano 项目的诞生具有明确目的，使区块链更具扩展性、更便宜且更可持续。例如，Solana
    区块链每秒能够处理 50,000 笔交易，而以太坊为 15-30 次，每笔交易成本仅为 0.00025 美元。Solana 使用名为“历史证明”（Proof-of-History）的共识机制，它不仅比工作量证明（Proof-of-Work），而且比权益证明（Proof-of-Stake）便宜得多。


    ### 3.2.6 去监管化


    作为一项对大众仍然相当新且未知的技术，区块链在主要国家也处于法律真空状态。然而，监管倡议在全球范围内涌现，旨在为加密市场的发展创造有序的环境。根据 Sole24Ore
    的报道，根据公司 ChainAnalysis 在 2019 年底至 2021 年中期间开发的复合指数，数字货币的使用增加了 25 倍（+ 2500%），从
    2021 年 1 月开始出现决定性的爆发。在这种背景下，监管倡议旨在为加密市场的发展创造有序的环境。风险在于，我们在没有特定顺序且缺乏全局视角的情况下在一个领域进行，而在这个领域中，禁止的监管套利和分歧的解释极其简单。欧盟已选择开发《加密资产市场法》（MiCA）条例。


    在国际上，金融犯罪执法网络（FinCEN）建议数字货币服务提供商（包括交易所，也包括银行）收集有关私有钱包持有者身份的信息。这意味着，如果用户想将个人持有的比特币转换为法币，他们将不得不向中间机构提供凭据，这本质上是将加密交易等同于银行转账。


    ### 3.2.7 金融风险


    去中心化金融（DeFi）使投资者在经典金融服务的背景面临极高且未知的风险。首先，普遍缺乏存款者保护：用户可能会因为加密货币价值的突然下跌、欺诈和私钥丢失而导致投资损失。此外，数字货币交易的不可逆性以及由于去中心化管理而难以建立对用户的责任归属构成了额外风险。最后，需要注意的是，加密交易中代表持有者公钥地址的数据字符串可以通过巨大的努力与标识符相关联，从而危及用户的身份和隐私。


    ### 3.2.8 加密密钥丢失


    在加密交易中持有私有加密密钥允许你仅拥有与之相关的值。当用户在 Coinbase 等大型交易所的钱包中持有其数字货币时，他们实际上是将密钥的托管权委托给了一家私营公司。因此，在交易所存款的数字货币并非比特币，而是对底层比特币的合同权利。相反，用户可以决定通过特定的软件或硬件自行持有密钥。在任何情况下，加密密钥的丢失都是无法找回的。


    # 4 什么是加密货币？


    ## 4.1 Coin 和 Token 的微妙区别


    ### 4.2 加密货币的历史


    ### 4.3 比特币，一种数字货币


    ### 4.4 以太坊，代币


    ### 4.5 代币发行（ICO）


    ### 4.6 交易所发行（IEO）与去中心化交易所发行（IDO）


    ### 4.7 市场上的主要加密货币


    ## 章节总结


    加密货币可以被认为是区块链引擎的燃料。但它们是如何工作的？什么机制在管理它们？我们如何购买、持有和交易它们？我们将尝试通过详细描述加密货币的概念来回答这些简单的问题。


    **关键词**：加密货币、Coin、Token、比特币、以太坊、代币、代币发行（ICO）、交易所发行（IEO）、去中心化交易所发行（IDO）

