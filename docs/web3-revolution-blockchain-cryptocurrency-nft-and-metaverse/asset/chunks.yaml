    ## 7.3 How NFTs Work


    Nowadays, `NFTs` are considered a sort of evolution of the world of art in digital
    format. Whoever buys a work linked to an `NFT` does not purchase the work in the
    strict sense. Rather, the possibility of claiming a right to that work is guaranteed,
    through a `Smart Contract`.


    But how is this work produced? Basically, the artist saves a photo or video in
    digital format, which will correspond to a string of numbers. This sequence is
    then compressed into a shorter one, a `hash`. This `hash` is then stored in a
    `Blockchain`, complete with an associated timestamp. The `NFT` keeps track of
    hash sales internally, right up to the creator who changed hands the first time.
    With this reverse path, you can therefore have proof of the authenticity and ownership
    of the `Token`, and the owner of the work will not need to contact intermediaries,
    at least as long as the `Blockchain` is active.


    At this point it is necessary to make a clarification regarding Intellectual Property
    rights: the ownership of an `NFT` does not intrinsically guarantee Copyright or
    Intellectual Property rights to any digital resource that represents the `Token`.
    While someone may sell an `NFT` that represents their work, the buyer will not
    necessarily receive Copyright privileges when ownership of the `NFT` is changed
    and thus the original owner is allowed to create multiple `NFTs` of the same work.
    In this sense, an `NFT` is simply a separate proof of ownership from a `Copyright`.


