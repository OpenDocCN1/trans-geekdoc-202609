- raw: "Once the code associated with a block is found and validated by the network,\
    \ the block can now be added to the chain. As a reward, the user or node who managed\
    \ to crack the block before the others will receive a token in exchange. In the\
    \ case of Bitcoin, therefore, the user will receive 1 BTC as a reward.\n\nWe summarize\
    \ below the various steps in the block generation process within a Blockchain:\n\
    \n·    the aim is to create a reliable and secure system to carry out transactions\
    \ without the need for intermediaries;\n\n·    the Blockchain uses a complex coding\
    \ system to create codes able to uniquely identify the blocks and connect them\
    \ to the chain;\n\n·    the codes are decrypted by special nodes, the so-called\
    \ \"miners\" (we will talk about them in the next chapter) and sent to the network\
    \ that is using the Blockchain;\n\n·    the miners, for their efforts, receive\
    \ in exchange tokens protected by cryptography;\n\n·    each Blockchain user keeps\
    \ a copy of these codes;\n\n·    the modification of block codes is an extremely\
    \ expensive operation in terms of computational resources and difficult to implement,\
    \ since for example it would require validation by at least 51% of users.\n\n\
    ## 1.2 A practical example\n\nTo clarify even better the concepts underlying the\
    \ Blockchain and what its main benefits are, let's take a cue from the example\
    \ reported in the book by Mark Gates[\\[7\\]](#part0000_split_077.html#_ftn7).\
    \ Let's imagine an online library that shares books (let's say eBooks to be more\
    \ concrete) where each user contributes their eBooks and allows people to borrow\
    \ them. Anyone can participate, and when they borrow books, they can also lend\
    \ them to other people, without returning them to the library or to the original\
    \ owner. How could records be kept of who had borrowed the books, which book they\
    \ had, and who was the original owner of the book? Records should be kept of the\
    \ books currently in the library, their original owners, and books that have been\
    \ borrowed. To do this, one could assign a person in the group to track the exchanges\
    \ using a centralized database model. In reality this condition would have a number\
    \ of disadvantages:\n\n·             the ability of the person handling the transactions\
    \ and keeping the ledger should be trusted first. The greater the network, the\
    \ greater the management complexity and difficulty, therefore the greater the\
    \ risk of mistakes\n\n·             it should then be trusted that this person\
    \ does not fraudulently modify the records to steal the circulating books\n\n\
    ·             I should pay this person\n\n·             I should wait for this\
    \ person to carry out all transactions. Greater complexity also means greater\
    \ execution time. Otherwise, I would have to hire another person, thus also increasing\
    \ the fixed management costs\n\nInstead, the Blockchain can provide a distributed\
    \ database of all library book records without the need for a person to take over\
    \ management. With such a database, everyone in the library has access to the\
    \ trade register, everyone sees the library's books, who the original owners were,\
    \ who borrowed each book, and everyone can see if they've continued to lend that\
    \ book to anyone. other. Whenever a book is borrowed from the shared library,\
    \ all the books in the book database that everyone has access to are updated.\
    \ There is no central database or institution needed to make it work - everyone\
    \ has a copy of the database. Each time a book is borrowed, a transaction is created:\
    \ there can be many transactions occurring at the same time, so these can be grouped\
    \ and added to a new block. This new block is added \"on top\" of the previous\
    \ block and linked to it. For instance:\n\n·             Block 10 connections\
    \ to block 9\n\n·             Block 9 connections to block 8\n\n·            \
    \ Block 8 connections to block 7 Etc.\n\nBy connecting these blocks, a chain of\
    \ blocks is created, hence the name \"Blockchain\". Still referring to our example,\
    \ anyone could go to the most recent block in the chain and see all the books\
    \ that were borrowed and from whom, see the transactions in the previous block\
    \ (to see who had the books before them) up to start to see the original owner.\
    \ There is no database or central authority: for example, if a person claims to\
    \ be the owner of the book, it could be verified by simply tracing all transactions\
    \ back to the first block known as the \"genesis block\". In a decentralized library\
    \ of this type:\n\n·             there is no central authority or body that manages\
    \ the transaction. This means less waiting times and no librarian management costs;\n\
    \n·             the system thus designed allows full traceability of the books.\
    \ Everyone knows who the owners are and who has the book at that moment: it is\
    \ in fact almost impossible to modify the registers, unlike a centralized system;\n\
    \n·             anyone can make their books available, no validation by a central\
    \ body is required.\n\n## 1.3 History of Blockchain\n\nWhen was the Blockchain\
    \ born and who invented it? In this section we briefly report the main stages\
    \ of the birth and evolution of this technology:\n\n **1982** - **David Chaum**[\\\
    [8\\]](#part0000_split_077.html#_ftn8), an American computer scientist and cryptographer,\
    \ lays the foundations of the Blockchain. In his doctoral thesis at Berkley *\"\
    Computer Systems Established, Maintained and Trusted by Mutually Suspicious Groups\"\
    [**\\[9\\]**](#part0000_split_077.html#_ftn9)* he defines a plan for achieving\
    \ consensus state between nodes in a distributed network, concatenating consensus\
    \ history in chunks, and immutably marking concatenated data. The document also\
    \ exposes the specific code to implement this protocol.\n\n**1983** - **Blind\
    \ Signature**. In his document *\"Blind signatures for untraceable payments\"\
    [**\\[10\\]**](#part0000_split_077.html#_ftn10)* Chaum describes a system for\
    \ allowing users to obtain digital currency from a bank and spend it in a way\
    \ that cannot be traced by the bank or any other entity. With this form of digital\
    \ signature, it is possible to hide the content of a message before it is signed,\
    \ so that the signer cannot determine its content. The resulting blind signature\
    \ can be publicly verified against the original undisclosed message like a normal\
    \ digital signature. For his contribution, Chaum is credited as the inventor of\
    \ digital currency, ideas that form the technical basis of the vision of the Cypherpunk\
    \ movement that began in the late 1980s. Indeed, members of this movement advocated\
    \ the widespread use of advanced cryptography and privacy-enhancing technologies\
    \ as a path to social and political change.\n\n**1990** - Chaum founds **DigiCash**,\
    \ an Amsterdam-based electronic cash company.\n\n**1994** - DigiCash sends **the\
    \ first electronic payment**. \n\n**1997 - Adam Back**, a British cryptographer\
    \ and later CEO of Blockstream, proposes Hashcash, an algorithm used to limit\
    \ email spam. Shortly, Hashcash is a \"proof-of-work\" algorithm (we'll find out\
    \ in the second chapter what that means) based on hash codes (again, a little\
    \ bit of patience). In practice, when email is used, a code (or \"stamp\") is\
    \ added to the email header to show that the sender took a modest amount of CPU\
    \ time to calculate this code before sending the e-mail. By virtue of that effort,\
    \ he is unlikely to be a spammer. At this point the recipient can check the validity\
    \ of the stamp with a negligible computational cost. However, the only known way\
    \ to find the code is through what is commonly referred to as \"brute force,\"\
    \ which is by calculating random codes until the exact code is found. This concept\
    \ will later be used in the Bitcoin blockchain as part of the mining algorithm.\n\
    \n**Early 90´: Nick Szabo**, an American computer scientist and cryptographer,\
    \ introduces the concept of Smart Contracts as distributable value in addition\
    \ to electronic money. A Smart Contract is a digital contract that is executed\
    \ automatically and based on predefined criteria. "
