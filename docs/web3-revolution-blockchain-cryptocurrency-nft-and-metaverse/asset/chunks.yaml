    ![](images/00004.jpeg)


    Figure 4: graphic representation of the constituent elements of a block of the
    Bitcoin blockchain


    On average, a Bitcoin block is created every ten minutes, while on Ethereum blocks
    are set every 17 seconds.


    In summary: each block contains its own hash and the hash of the previous block.
    All the blocks of the main chain are numbered, starting with the number 0, then
    1, 2, 3, 4, 5 and so on. Taking as an example a Blockchain made up of 3 blocks,
    block number 2 will refer to block number 1 and block number 1 will refer to block
    number 0. Block number 0 is different from the previous ones: it cannot point
    to any previous block, in fact, is called in the jargon "genesis block". If for
    some reason block #1 was tampered with by a hacker, that block''s hash would automatically
    be changed. Consequently, block #2 would no longer be valid as it would no longer
    contain the hash of the previous block, effectively compromising the validity
    of all subsequent blocks.


    ![](images/00005.jpeg)


    Figure 5: graphic representation of 3 blocks connected to the Bitcoin blockchain


    However, the hash system alone is not enough. In fact, modern computers have such
    a computing power that even very long chains could be recalculated in a short
    time. For this reason, the concept of "consensus algorithm" was introduced, which
    we will explain later. So, let''s proceed in small steps and let’s see the concept
    of hash and encryption in more detail.


    ## 2.4 Hash and cryptography


    In his book “Ultimate Step by Step Guide to Understanding Blockchain Technology,
    Bitcoin Creation, and the future of Money”, Keizer Söze clearly describes what
    a hash function is and how it works.


    A hash is basically a fixed-sized string of numbers generated on the basis of
    a series of algorithms. A hash function allows to reduce any text string, regardless
    of its length, into a new string with precise characteristics including a predefined
    number of characters.


    One such algorithm is the so-called Message Digest 5, or MD5 (where `5` is the
    version number). For example, trying to type the word "blockchain". The resulting
    `md5` hash value will be:


    ```

    5510a843bc1b7acb9507a5f71de51b98

    ```


    If we tried to perform the same `md5` hashing on the word "blockchain1", the result
    would be completely different:


    ```

    1150228f14788047028d774b7c83c5a6

    ```


    Let''s try a number now, and for simplicity, let''s use very few digits. Let''s
    try to hash `md5` on a string of numbers of `123` and then `124` and see if there
    is any difference. For string `123`, the hashing value `md5` is this:


    ```

    202cb962ac59075b964b07152d234b70

    ```


    For string `124`, on the other hand:


    ```

    C8ffe9a587b126f152ed3d89a146b445

    ```


    As we can see, once again, it is a completely different result. The `md5` algorithm
    was born in 1992, however it has been compromised several times due to its vulnerabilities.


    There are several hashing algorithms: in 2001, the `SHA-2` algorithm (Secure Hash
    Algorithm 2) designed by the National Security Agency (NSA) was published. The
    `SHA-2` family consists of six hash functions with hash (or digest) values that
    are 224, 256, 384 or 512 bits, respectively `SHA-224`, `SHA-256`, `SHA-384`, `SHA-512`.
    Specifically, `SHA-256` is the hash algorithm used by Bitcoin. In 2012, the `scrypt`
    algorithm was released, designed specifically to perform large-scale custom hardware
    attacks that required a large amount of memory. This algorithm was later used
    as part of the Proof-of-Work mechanism by some cryptocurrencies such as Litecoin
    and Dogecoin.


    We can summarize the general characteristics of a hash algorithm in the following
    fundamental points:


    - **constancy**: the same output always and inevitably corresponds to each input;

    - **irreversibility**: while it is always possible to reproduce the output knowing
    the original input with which the output was generated, it is not possible to
    do the reverse path, therefore it is not possible starting from an alphanumeric
    string to go back to the initial content of the input that generated it;

    - **determinism**: regardless of how long the input is, the hash function will
    always return an alphanumeric string of a given number of characters; if I took
    the divine comedy, for example, and subjected it to a hash function, the result
    would always be a string of 32, 64 (etc) characters (the length of the output
    depends on the hashing function used);

    - **avalanche effect**: no matter how long the input is, an infinitesimal variation
    of the input is sufficient to generate a completely different output


    To conclude, it should be emphasized that hash is used as identification mechanism,
    but not as confidentiality mechanism, for which more complex processes are used.
    However, hash functions also play an essential role in the cryptography itself:
    they are useful for verifying the integrity of a message, as the execution modified
    text.


    ### 2.4.1 Cryptography


    Cryptography is one of the fundamental pillars on which Blockchain technology
    is based. Before explaining how cryptography is used in the Blockchain, we need
    to make a brief digression and provide some theoretical concepts. Encryption is
    a defined process by which data is converted into an unreadable form, commonly
    known as Encrypted Text. To ensure that no unauthorized person can access the
    data, public and private key are used:


    - **private key**: a randomly generated secret number known only to the person
    who generated it. The private key is similar to a PIN or password that we use
    to log into different web pages, but in this case, it is encrypted, which adds
    much more security. In Bitcoin, for example, the private key is the code that
    guarantees access to funds on the Blockchain and is a 256-bit (32-byte) unsigned
    integer. In practice, a private key looks like this:


    images/00006.jpeg)


    Figure 6: example of private key


    - **public key**, on the other hand, is a number that corresponds to a private
    key, but don’t have to be kept secret. A public key can be computed from a private
    key, but not the other way around. That is, the private key cannot be obtained
    from the public key. The public key, after subsequent changes, is the address
    that we can share with all members of the community so that they can send us money,
    or that of other users of the community that we will use if necessary to make
    a payment in their favor. There is no risk of theft, as the funds are only accessible
    via the private key.


    Now let''s add another piece of information. There are two types of keys used
    to encrypt and decrypt data:


    - **Symmetric key**: the encryption and de-encryption processes use the same key.
    We can imagine a symmetrical key as a key to open the door of the house: when
    we go out or enter, in fact, we use the same key. The symmetric key algorithm
    is thousands of times faster than asymmetric keys, however the problem here is
    that both the sender and the recipient must use the same key for both encryption
    and decryption. Of course, this isn''t an advantage when it comes to security,
    and the Blockchain certainly doesn''t use symmetric key algorithms.

