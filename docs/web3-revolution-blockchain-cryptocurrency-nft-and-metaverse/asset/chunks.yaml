    一旦网络找到并验证了与区块关联的代码，该区块就可以添加到链中。作为奖励，在其他人之前成功破解该区块的用户或节点将获得相应的代币作为交换。因此，在比特币的情况下，该用户将获得
    `1 BTC` 作为奖励。


    我们在下文中总结了 `Blockchain`（区块链）中区块生成过程的各个步骤：


    - 这种的目标是创建一个可靠且安全的系统，以便在不需要中介的情况下进行交易；

    - `Blockchain` 使用复杂的编码系统来创建能够唯一标识区块并将它们连接到链上的代码；

    - 这些代码由特殊节点，即所谓的“矿工”（我们将在下一章中讨论他们）进行解密，并发送到使用该 `Blockchain` 的网络中；

    - 矿工因其努力而获得了受密码学保护的代币作为回报；

    - 每个 `Blockchain` 用户都保留一份这些代码的副本；

    - 修改区块代码在计算资源方面是一项极其昂贵的操作，且难以实现，因为例如它需要至少 `51%` 用户的验证。


    ## 1.2 实际示例


    为了更清楚地解释 `Blockchain` 的底层概念及其主要优点，让我们参考 Mark Gates 在书中记录的示例[[7]](#part0000_split_077.html#_ftn7)。让我们想象一个共享书籍的在线图书馆（为了具体起见，我们称之为
    `eBooks` 库），其中每个用户都贡献自己的 `eBooks` 并允许人们借阅。任何人都可以参与，当他们借阅书籍时，他们也可以将书借给其他人，而无需还给图书馆或原始所有者。该如何记录谁借了书、他们拥有哪些书，以及谁是原始所有者？应该记录目前图书馆中所有的书籍、它们的原始所有者以及已借出的书籍。为了做到这一点，可以为小组分配一个人，使用中心化数据库模型来跟踪交换情况。在现实中，这种做法会有许多缺点：


    - 首先必须信任处理交易和维护账本的人员的能力。网络越大，管理的复杂性和难度就越高，因此出错的风险也越大

    - 然后必须信任此人不会通过欺诈性地修改记录来偷取流通的书籍

    - 我应该向此人支付费用

    - 我必须等待此人完成所有交易。更大的复杂性也意味着更长的执行时间。否则，我将不得不雇佣另，从而增加了固定的管理成本


    相反，`Blockchain` 可以提供一个所有图书馆书籍记录的分布式数据库，而不需要人员接管管理。有了这样一个数据库，图书馆的每个人都可以访问交易登记，每个人都能看到图书馆的书籍、原始所有者以及已借出的书籍。为了做到这一点，可以为小组分配一个人，使用中心化数据库模型来跟踪交换情况。在现实中，这种做法会有许多缺点：


