    \ outcome of the vote should be validated according to the consent mechanism adopted.\
    \ All this would happen with a significant reduction in costs and time.\n\n###\
    \ 3.1.2 No intermediary cost\n"
  trans: "\n\n在区块链的背景下，当一个区块被链接到两个连续的区块时，就会发生分叉（fork）。分叉的产生是因为各方必须使用共同规则来维护区块链的历史。事实上，当各方产生分歧时，就会出现替代链。虽然大多数分叉是短暂的，但仍有一些分叉是永久的：短暂分叉是因为分布式系统中难以快速达成共识，而永久性分叉（即由于协议更改）则用于为区块链添加新功能，也可以用于撤销黑攻击的影响（如以太坊和以太坊经典为例），或者避免区块链上的灾难性漏洞（如\
    \ 2010 年 8 月 6 日的比特币分叉）。\n\n![](img/00011.jpeg)\n\n图 11：分叉的示例\n\n分叉可以分类为：\n\n\
    1. **偶然性**\n2. **人为性**\n\n偶然分叉发生在两个或多个矿工几乎同时发现一个区块时。当后续区块添加且其中一条链比另一条链长时，分叉就会得到解决。因此，网络会放弃较短链的区块，因为矿工的目标始终在最长链上工作。被遗弃的区块被称为“孤儿区块”（orphan\
    \ blocks）。\n\n改变区块链规则的人为分叉可以分类如下：\n\n- **硬分叉 (Hard fork)**：硬分叉是一种规则更改，使得根据旧规则验证的软件会将根据新规则产生的区块视为无效。在发生硬分叉的情况下，所有旨在在新规则下运行的节点必须更新其软件。如果一组节点继续使用旧软件，而其他节点使用新软件，就可能会发生永久性的分裂。\n\
    - **软分叉 (Soft Fork)**：软分叉是对管理区块链文件的程序代码进行更新，以添加更改，通常是新功能或修复漏洞。但要成为软分叉，它必须保持与旧区块链兼容。例如，在比特币中，更新首先在一个名为\
    \ `BIP`（比特币改进提案）的文档中公布。一旦获得批准，进一步的实现取决于比特币客户端开发者的决定。软分叉有两种类型，发生在以下情况：\n    - 大多数矿工升级以应用新规则。这被称为矿工激活的软分叉（`MASF`）；\n\
    \    - 协调节点以执行新规则，而没有矿工的支持。这被称为用户激活的软分叉（`UASF`）。\n\n### 2.6.1 硬分叉：以太坊和比特币的案例\n\
    \n以太坊经典维护了以太坊网络原始且未更改的历史。以太坊主项目网络最初一直发布到 2015 年 7 月 30 日。然而，由于一个第三方项目遭到黑客，2016\
    \ 年 7 月 20 日，以太坊基金创建了以太坊主网的新版本，并实施了对不规则状态的更改，从以太坊区块链的历史中删除了数百万以太坊的被盗记录，并在新的修改后的以太坊区块链版本上应用了自身的品牌（代码：`ETH`），即将被盗资金归还给所有者的版本；而之前的且未更改的以太坊版本被重命名为以太坊经典（代码：`ETC`），即资金未归还的版本。\n\
    \n2010 年 8 月 6 日，比特币协议中发现了一个严重的漏洞，该漏洞实际上允许用户绕过区块链的经济限制并创建无限数量的比特币。结果在 8 月 15 日，超过\
    \ 184 亿个比特币在一个笔交易中生成并发送到网络上的两个地址。几小时后，该交易被检测到并在漏洞修复、网络切换到更新后的比特币协议版本后从交易日志中清除。这是比特币历史上被发现并利用的唯一重大安全漏洞。\n\
    \n然而，比特币也由于不同的原因经历过其他分叉。划分比特币的硬分叉是通过更改区块链规则并共享截至特定日期和时间的比特币交易历史而创建的。第一次划分比特币的第一次硬分叉发生在\
    \ 2017 年 8 月 1 日，伴随着比特币现金（Bitcoin Cash）的产生。\n\n以下是按日期和/或区块划分的比特币重要硬分叉列表：\n\n-\
    \ **比特币现金 (Bitcoin Cash)**：分叉发生在区块 `478558`，2017 年 8 月 1 日，对于每枚比特币（`BTC`），每个所有者获得\
    \ 1 个比特币现金（`BCH`）；\n- **比特币 SV (Bitcoin SV)**：分叉发生在区块 `556766`，2018 年 11 月 15\
    \ 日，对于每枚比特币现金（`BCH`），每个所有者获得 1 个比特币 SV（`BSV`）；\n- **比特币黄金 (Bitcoin Gold)**：分叉发生在区块\
    \ `491407`，2017 年 10 月 24 日，对于每枚比特币（`BTC`），每个所有者获得了 1 个比特币黄金（`BTG`）。\n\n# 3. 区块链技术的优势与挑战\n\
    \n## 3.1 主要优势\n\n## 3.2 主要挑战\n\n## 本章总结\n\n区块链架构的优势是什么？我们已经提到，例如安全性、可追溯性以及缺乏作为担保人的中心机构。\n\
    \n在本章中，我们将更详细地描述主要优势，即区块链为何在金融领域之外变得日益流行的原因。此外，我们还将描述为了让区块链成为全球性系统所面临的主要挑战。\n\n\
    **关键词**：透明度、安全性、可扩展性、隐私、51%攻击、能源消耗、去监管、加密密钥\n\n## 3.1 主要优势\n\n下面我们描述了与区块链技术相关的主要优势：透明度、成本、安全性、速度和可扩展性。\n\
    \n### 3.1.1 透明度\n\n为了提高信息交换的透明度，各机构尝试实施越来越多的规则；然而，有一件事不能让任何系统变得 100%透明，那就是信息的中心化。在中心化网络中，所有的决策权都在一个控制网络的中心机构手中。例如，在中央银行系统的案例中，每个决策都通过最符合其战略的银行进行。因此，透明度变成了任意的而非结构性的：这意味着我们必须以某种方式“信任”银行针对储户采取的保护机制。区块链的主要应用之一是所谓的去中心化金融，也称为\
    \ `DeFi`，将在第 6 章中详细介绍。\n\n另一个应用示例涉及民主政府的投票过程。为了让这一过程尽可能透明地进行，每个国家在计票期间实施了一系列措施以避免选举欺诈。相反，如果过程是通过电子投票完全计算机化的完成，那么只需要操纵或篡改处理信息的中央服务器就可以按意愿控制投票结果。\n\
    \n通过区块链，这类问题将找到稳健的解决方案：正如我们所看到的，区块链由负责执行和验证交易的节点组成。每笔交易还会发送给网络成员，他们在他们的注册表中保留一份完全相同的副本，而任何篡改投票结果的潜在尝试都将根据采用的共识机制进行验证。这一切将在显著降低成本和时间的情况下完成。\n\
    \n### 3.1.2 无中间介成本\n\n"
