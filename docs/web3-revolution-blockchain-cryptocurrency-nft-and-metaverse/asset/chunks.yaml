  fmt: "\n- **Digital Art**: digital art was one of the first use cases for NFTs,\
    \ due to the Blockchain's ability to ensure the unique signature and ownership\
    \ of NFTs. For example, the digital artwork titled \"Everydays: the First 5000\
    \ Days\" by artist Mike Winkelmann sold for $ 69.3 million in 2021. This was the\
    \ third highest auction price for a work by a living artist, after the works of\
    \ Jeff Koons and David Hockney respectively.\n- **Gaming**: we have already mentioned\
    \ the use of NFTs in video games. These can be used to represent in-game assets,\
    \ such as digital parcels, which are controlled by the user rather than the game\
    \ developer.\n- **Music**: As their popularity increased in 2021, NFTs were used\
    \ by touring artists and musicians to recoup lost revenue due to the 2020 COVID-19\
    \ pandemic. For example, February 28, 2021, electronic dance musician 3LAU sold\
    \ a collection of 33 NFTs for a total of $ 11.7 million to commemorate the third\
    \ anniversary of his Ultraviolet album.\n- **Film**: In May 2018, 20th Century\
    \ Fox partnered with Atom Tickets and released limited edition digital posters\
    \ of Deadpool 2 to promote the film. In November 2021, director Quentin Tarantino\
    \ released seven NFTs based on uncut scenes from Pulp Fiction. Miramax later filed\
    \ a lawsuit alleging that their film rights had been violated.\n- **Publishing**:\
    \ The NFT Magazine is a new editorial project launched by Cryptonomist. As reported\
    \ by the official website, the NFT Magazine:\n    - it is a magazine to read and\
    \ collect on `Ethereum` to discover the biggest players in the Crypto world, market\
    \ trends, rankings and expert advice.\n    - to read the Magazine, it is necessary\
    \ to collect the NFT covers.\n    - NFT Covers, made by major international Crypto\
    \ artists, can be collected.\n    - the print run is limited and each copy costs\
    \ 0.05 `ETH` (at the writing date of the book).\n\nFurthermore, this project runs\
    \ in parallel with the series launch of NFT dedicated to Cryppo, the company mascot.\
    \ The series consists of 7,777 NFTs generated by artificial intelligence with\
    \ over 90 very special 3D traits, which makes Cryppo ready for the Metaverse.\
    \ In fact, thanks to a partnership with The Nemesis, Cryppo will immediately have\
    \ its own meta-world, where owners can meet, talk, play, and find the latest edition\
    \ of The NFT Magazine on newsstands. A smart way to build community loyalty.\n\
    - **Luxury**: in fact, NFTs have three characteristics that can be extremely useful\
    \ in the luxury sector:\n    - the end user can verify the originality of an object\
    \ in the `Blockchain`.\n    - it is possible to verify with absolute certainty\
    \ who is the creator of the NFT, or the final producer.\n    - you can uniquely\
    \ link a single product to a single NFT. However, specific electronic devices\
    \ are required to do this.\n- **Digital real estate market**: digital real estate\
    \ can be defined as a \"virtual property\" and can also come in many different\
    \ forms. Some practical examples are the classic website, through which to advertise\
    \ and sell product info through e-commerce, the development of smartphone apps,\
    \ or the purchase and sale of a domain. Just like with a physical property, through\
    \ the digital real estate market it is possible to generate passive income. As\
    \ we will see in the next chapter, the development of the Metaverse, or a virtual\
    \ world, could make the purchase of plots of land in the virtual world more and\
    \ more popular thanks to NFTs. According to a recent tweet from Axie Infinity,\
    \ a plot of land within the game world called the \"Genesis Land Plot\" was sold\
    \ for 550 `ETH`, equivalent to $ 2.3 million at the time of writing.\n\n## 7.5\
    \ How to create, buy and trade NFTs\n\nIf you want to create an NFT, since `Ethereum`\
    \ has the largest NFT ecosystem, it is assumed that you want to operate with this\
    \ standard. Therefore, to start you need an `Ethereum Wallet` that supports `ERC-721`,\
    \ the NFT Token standard based on `Ethereum`, in fact. `MetaMask`, `Trust Wallet`\
    \ or `Coinbase Wallet`, for example, provide the required standard. Subsequently,\
    \ if you want to create an NFT, you will first need to identify the platform you\
    \ want to use, such as `OpenSea`, `Rarible` or `Mintable`, then connect your `Wallet`\
    \ and upload the chosen image or file that you want to transform into an NFT.\n\
    \nTo sell your NFTs on a marketplace instead, the procedure is normally as follows:\n\
    - you will need to locate them in your collection, click on them and find the\
    \ \"sell\" button.\n- you will access a prices page where you can define the conditions\
    \ of the sale, including whether to run an auction or sell at a fixed price.\n\
    \nListing NFTs on a marketplace sometimes requires a fee to complete the process,\
    \ although that's not the case with all platforms.\n\nIf, on the other hand, you\
    \ want to buy an NFT, then first you will need to know which `Wallet` to download\
    \ to connect to the platform and buy NFTs, with which `Cryptocurrency` you will\
    \ finance the purchase and above all to know if the NFTs you want to buy are sold\
    \ at a specific time. The most popular NFT markets in 2021 are definitely:\n-\
    \ `OpenSea`\n- `Rarible`\n- `SuperRare`\n- `Nifty Gateway`\n- `Foundation`\n-\
    \ `Axie`\n- `BakerySwap`\n- `ShowRoom`\n- `VIV3`\n\n### 7.5.1 The 10 most expensive\
    \ NFTs sold at auction\n\nAs an example, below are the 10 most expensive NFTs\
    \ at auction:\n\n1. **Everydays, Beeple**: The record sale of an NFT so far is\
    \ from the aforementioned \"Everydays: The First 5000 Days\", the digital collage\
    \ with about 5000 images created by the American artist Beeple.\n2. **CryptoPunk**:\
    \ `CryptoPunks` are considered to be the first NFTs on `Ethereum`. It is a series\
    \ of 10,000 24x24 pixel art images generated uniquely by an algorithm. Each `CryptoPunk`\
    \ represents a different character. The average bid over the past year was approximately\
    \ $ 61,600.\n3. **Hashmasks**: about 70 artists have created one of the most beautiful\
    \ and expensive virtual works in the world. They are known by the name of `Hashmasks`\
    \ and represent colorful and particular masks, inspired by the graffiti of Jean\
    \ Michel Basquiat, an American artist. All masks sold for $ 16 million.\n4. **CryptoPunk\
    \ #7804**: Let's go back to `CryptoPunk`, in fourth place we find one of the characters\
    \ of this NFT work. It is the teal little man and the most expensive of all, it\
    \ was sold in March 2021 for a whopping 7.5 million dollars!\n5. **War Nymph di\
    \ Grimes**: Grimes is the Canadian artist who sold his digital works for $ 6 million.\
    \ `War Nymph` consists of 10 series and the most expensive video is inspired by\
    \ a song by the artist.\n6. **Crossroads**: A 10-second clip of Beeple also sold\
    \ for $ 6.6 million that shows a giant Donald Trump lying on the ground naked\
    \ and covered in graffiti after losing the 2020 presidential election.\n"
  trans: "\n\n- **数字艺术**：数字艺术是 NFT 的最早用例之一，这是因为区块链能够确保 NFT 的唯一签名和所有权。例如，艺术家迈克·温克曼（Mike\
    \ Winkelmann）名为《每一天：前 5000 天》的数字作品在 2021 年以 6930 万美元售出。这是世艺术家作品第三高拍卖价，仅次于杰夫·昆斯（Jeff\
    \ Koons）和大卫·霍克尼（David Hockney）的作品。\n- **游戏**：我们已经提到 NFT 在视频游戏中的用途。这些可以用来代表游戏内资产，例如数字包裹，它们由用户而非游戏开发者控制。\n\
    - **音乐**：随着 2021 年热度的上升，巡演艺人和和音乐家利用 NFT 来弥补 2020 年新冠肺炎带来的收入损失。例如，2021 年 2 月 28\
    \ 日，电子舞音乐家 3LAU 出出了包含 33 个 NFT 的集合，总价 1170 万美元，以纪念他的专辑《Ultraviolet》三周年。\n- **电影**：2018\
    \ 年 5 月，20 世纪影业与 Atom Tickets 合作，发布了《死侍 2》的限量版数字海报以推广电影。2021 年 11 月，导演昆丁·塔伦蒂诺（Quentin\
    \ Tarantino）发布了基于《低俗小说》未剪辑版的七个 NFT。Miramax 随后提起诉讼，指控其电影版权被侵犯。\n- **出版**：《NFT Magazine》是由\
    \ Cryptonomist 启动的一项新编辑项目。根据官方网站报道：\n    - 它是一本在 `Ethereum` 上阅读和收藏的杂志，旨在发现加密世界最大的玩家、市场趋势、排名和专家建议。\n\
    \    - 要阅读该杂志，需要收集 NFT 封面。\n    - 由主要的国际加密艺术家制作的 NFT 封面是可以收藏的。\n    - 印刷量有限，每份成本为\
    \ 0.05 `ETH`（按书籍编写时计算）。\n\n此外，该项目与针对公司吉祥物 Cryppo 的 NFT 系列同步进行。该系列由 7,777 个由人工智能生成的\
    \ NFT 组成，具有 90 多个非常特殊的 3D 特征，使 Cryppo 为元宇宙做好了准备。事实上，得益于与 The Nemesis 的合作，Cryppo\
    \ 将立即拥有自己的元世界，主人可以在那里见面、聊天、游戏，并在报刊上找到《NFT Magazine》的最新版本。这建立社区忠诚度的智能方式。\n- **奢侈品**：事实上，NFT\
    \ 有三个在奢侈品领域非常有用的特点：\n    - 终端可以在 `Blockchain` 中验证物品的正品性。\n    - 可以绝对确定地验证谁是 NFT\
    \ 的创建者或最终生产者。\n    - 你可以将一个单一产品与单个 NFT 唯一地关联起来。然而，这需要特定的电子设备。\n- **数字房地产市场**：数字房地产可以定义为“虚拟财产”，也可以以许多不同的形式出现。一些实用的例子包括通过电子商务进行广告和销售产品信息的经典网站、智能手机\
    \ App 的开发，或者域名的买卖。就像物理财产一样，通过数字房地产市场可以产生被动收入。正如我们在下一章看到的，由于元宇宙（或虚拟世界）的发展，得益于 NFT，在虚拟世界中购买土地变得越来越流行。根据\
    \ Axie Infinity 最近的一条推文，游戏世界内一块被称为“创世之地块”（Genesis Land Plot）的土地以 550 `ETH` 售出，在写作时相当于\
    \ 230 万美元。\n\n## 7.5 如何创建、购买和交易 NFT\n\n如果你想创建一个 NFT，由于 `Ethereum` 拥有最大的 NFT 生态系统，假设你想按照该标准操作。因此，要开始你需要一个支持\
    \ `ERC-721` 的 `Ethereum Wallet`，实际上这是基于 `Ethereum` 的 NFT Token 标准。例如，`MetaMask`、`Trust\
    \ Wallet` 或 `Coinbase Wallet` 提供了所需的标准。随后，如果你想创建一个 NFT，首先需要确定你想要使用的平台，例如 `OpenSea`、`Rarible`\
    \ 或 `Mintable`，然后连接你的 `Wallet` 并上传你想要转换为 NFT 的选择图像或文件。\n\n如果想在市场上出售你的 NFT，程序通常如下：\n\
    - 你需要在你的收藏中找到它们，点击它们并找到“出售”（sell）按钮。\n- 你将进入价格页面，可以在那里定义销售条件，包括是进行拍卖还是以固定价格出售。\n\
    \n在市场上列出 NFT 有时需要费用来完成过程，尽管并非所有平台都是如此。\n\n另一方面，如果你想购买 NFT，那么首先你需要知道下载哪个 `Wallet`\
    \ 来连接平台并购买 NFT，你将用哪种 `Cryptocurrency` 为购买融资，最重要的是知道你想购买的 NFT 是否在特定时间出售。2021 年最流行的\
    \ NFT 市场绝对是：\n- `OpenSea`\n- `Rarible`\n- `SuperRare`\n- `Nifty Gateway`\n- `Foundation`\n\
    - `Axie`\n- `BakerySwap`\n- `ShowRoom`\n- `VIV3`\n\n### 7.5.1 拍卖出的最贵的 10 个 NFT\n\
    \n作为示例，以下是拍卖出的最贵的 10 个 NFT：\n\n1. **Everydays, Beeple**：到为止 NFT 的纪录性销售来自上述的《每一天：前\
    \ 5000 天》，这是由美国艺术家 Beeple 创建的包含 5000 张图片的数字拼贴。\n2. **CryptoPunk**：`CryptoPunks`\
    \ 被认为是 `Ethereum` 上的第一个 NFT。它是由算法唯一生成的 10,000 个 24x24 像素艺术图像系列。每个 `CryptoPunk`\
    \ 代表一个不同的角色。过去一年的平均报价约为 61,600 美元。\n3. **Hashmasks**：约 70 名艺术家创作了世界上最美且最贵的虚拟作品。它们被称为\
    \ `Hashmasks`，代表彩色且独特的口罩，灵感来自美国艺术家让·米歇尔·巴斯亚（Jean Michel Basquiat）的涂鸦。所有口罩以 1600\
    \ 万出售。\n4. **CryptoPunk #7804**：回到 `CryptoPunk`，我们在第四位找到了这个 NFT 作品的角色之一。它是青色的小人，也是最贵的，它在\
    \ 2021 年 3 月以惊人的 750 万美元出售！\n5. **War Nymph di Grimes**：Grimes 是以 600 万出售其数字作品的加拿大艺术家。`War\
    \ Nymph` 由 10 个系列组成，最贵的视频灵感来自艺术家的歌曲。\n6. **Crossroads**：Beeple 的一段 10 秒片段也以 660\
    \ 万美元售出，显示了唐纳德·特朗普在输掉 2020 年总统大选后赤裸地躺在地上，满是涂鸦。\n\n"
