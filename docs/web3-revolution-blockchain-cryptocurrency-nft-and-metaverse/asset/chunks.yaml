    在涉及官方文件签署、资金交易或商品销售的交易中，中介这一角色往往仅作为交易本身的担保人。这会产生一种成本，在专业术语中有时被称为“金融摩擦力”。我们刚刚看到，在分布式网络语境下，这一角色失去了意义，因为交易的有效性是由
    `Blockchain` 网络架构本身来保证的。因此，交易不需要任何中介，也就没有了佣金成本。最常见的例子是电子支付：当我们使用借记卡或信用卡支付或进行银行转账时，交易由银行接手，银行在某些情况下会收取佣金费。此外，信用卡通常还需要支付年费。在通过
    `Blockchain` 进行电子支付的情况下，这些费用是不可必需的。


    ### 3.1.3 安全性


    与其他平台或注册系统相比，区块链技术使用了更高级别的安全性。在上一章中，我们提到了哈希和加密的使用，这是 `Blockchain`set 的基础算法。此外，共识机制和分布式系统的去中心化使得
    `Blockchain` 可能成为世界上最安全的信息技术之一。


    ### 3.1.4 交易速度


    中心化交易需要一些时间来处理。例如，两个不同银行之间的国家或国际银行转账：这个过程可能需要几个工作日才能解决。然而，在像 `Blockchain` 这样的去中心化过程中，这种机制不再必要，因为交易不需要中介即可发生，如果我们以平均
    `Bitcoin` 交易时间为例，大约是 10 分钟即可。


    ### 3.1.5 可扩展性


    系统的可扩展性通常是指根据需求和可用性进行扩大或缩小的能力。对于 `Blockchain` 而言，可扩展性是指其在不影响性能的情况下管理日益增加的交易的能力。`Blockchain`
    具有极可扩展性的优势；然而，正如“区块链三难题”所示，这可能是以牺牲安全性为代价的。事实上，具有 `PoW` 机制的 `Bitcoin` 存在可扩展性问题，这在很大程度上与节点数量增加所需的高能耗有关，但它保证了高度的去中心化和安全性。因此，在
    `Bitcoin` 之后产生的代币旨在解决其内在的可扩展性问题。


    ### 3.2 主要挑战


    在阐述主要优势之后，现在让我们来看看 `Blockchain` 技术要在全球范围内被采用将面临的主要挑战：知识匮乏、隐私问题、51% 攻击风险、能耗、去监管、金融风险以及与加密密钥丢失相关的风险。


    ### 3.2.1 技术知识匮乏


    这种局限性实际上指的是人性，更广泛地说，指的是任何创新过程。正如本书引言提到的，每个创新过程都伴随着一系列机会，但也伴随着一系列风险。根据人的本性，人们倾向于不过度冒险，除非他们已经实施了一系列应对措施来减少和管理这些风险。然而，这些应对措施需要付出努力。第一步是减少与不了解技术（在本例中为
    `Blockchain`）相关的不确定性。创建一种方法来缩小与技术之间的知识差距至关重要，这种差距由于新技术的演进速度以及人们适应未来新情景的惯性而正在逐渐扩大。


    ### 3.2.2 隐私


    一方面，分布式架构是保证我们在上一段中提到的安全性和透明性的主要元素之一；另一方面，这可能会产生与隐私相关的问题。具体而言，在 `Blockchain` 技术中，每个节点都必须访问
    `Blockchain` 交易本身的数据。这意味着在公共 `Blockchain` 的情况下，每一笔公开交易都可以追溯到第一个创世区块。


    在实践中，这种透明度和可追溯性抵消了匿名性的优势，即个人与其所属的 `Wallet` 之间似乎没有联系。公共 `Blockchain` 实际上提供了识别机会。例如，《法医研究杂志》上一篇关于
    `Bitcoin` 调查的文章说明了几个此类案例：一种方法是监控 `Blockchain` 节点之间的通信，这可以将互联网协议地址和交易关联起来。此外，加密货币钱包软件不是公开的，但即使没有使用所需的密钥，也可以对其进行法医分析。


    这些技术的高调使用导致了 Ross Ulbricht 因运营“丝绸之路”（Silk Road，一个非法毒品黑市）而被捕。更有趣的是，美国税务局（IRS）的一名特探还能够追踪
    `Bitcoin` 交易，确定参与调查的美国毒品管理局探 Carl Force 正在洗钱与丝绸之路相关的比特币。正如容易猜的那样，像 `Bitcoin` 这样的
    `Blockchain` 提供的隐私保护有限。依赖 `Coinbase` 等交易所的个人必须意识到，此类平台必须遵守国际隐私法，因此受到监管。例如，IRS
    还要求 `Coinbase` 交出某些涉及加密货币交易的记录。


    因此，有必要意识到公共 `Blockchains` 的隐私方面，虽然它们一方面保证了用户交易的某种匿名性，但另一方面仍然通过特定技术提供了识别机会。


    ### 3.2.3 51% 攻击风险


    在 `PoW` 机制中，51% 攻击指的是一组控制了网络 50% 以上算力或计算能力的矿工对 `Blockchain` 实施的假设性攻击（算力是衡量处理交易和挖掘新币的总计算能力参数）。事实上，确保区块不可篡改的特征之一是交易分布在网上，网络必须根据共识机制批准这些交易。这意味着如果大多数用户同意修改，这种修改就可以实施。在事实上，如果已经执行的交易预计交换
    `1 BTC`，网络可以对其进行修改，例如花费两次相同的币。这种风险被称为“双花”，是数字货币特有的潜在问题，因为数字信息可以由经验丰富的人士相对容易复制。这种攻击是假设性的，但如果真的发生，它将不可挽回地破坏
    `Blockchain` 和加密货币的基础。


    ### 3.2.4 成本


    虽然一方面 `Blockchain` 具有降低金融交易成本的优势，但另一方面，它在能耗以及基于 `PoW` 的 `Blockchains` 的矿机硬件方面产生了成本。由于这个原因，主要的矿场位于能源成本较低的国家。


    ### 3.2.5 能耗


