    using as input electrical energy converted into computational power, they receive
    Cryptocurrency in exchange


    How do you mine Bitcoin? Miners can use different software available in the market,
    or they can create their own custom software to speed up the authentication process.
    Below is a list of popular software used to mine Bitcoin:


    ·             Shamming ([https://shamining.com](https://shamining.com))


    ·             Ecos ([https://ecos.am](https://ecos.am))


    ·             Kryptex Miner ([https://www.kryptex.org/](https://www.kryptex.org/))


    ·             Cudo Miner ([https://www.cudominer.com/](https://www.cudominer.com/))


    ·             BeMine ([https://bemine.club/](https://bemine.club/))


    ·             Awesome Miner ([https://www.awesomeminer.com/](https://www.awesomeminer.com/))


    ·             BFGMiner ([http://bfgminer.org](http://bfgminer.org))


    ·             MultiMiner ([https://www.multiminerapp.com/](https://www.multiminerapp.com/)


    ·             EasyMiner ([https://www.easyminer.net/](https://www.easyminer.net/))


    ·             CGMiner ([https://cgminer.info/](https://cgminer.info/))


    ·             BTCMiner ([https://www.btcminer.website/](https://www.btcminer.website/))


    ·             DiabloMiner ([https://github.com/Diablo-D3/DiabloMiner](https://github.com/Diablo-D3/DiabloMiner))


    ·             NiceHash Miner ([https://www.nicehash.com/cpu-gpu-mining](https://www.nicehash.com/cpu-gpu-mining))


    If you want to touch the mechanism behind the PoW Blockchain mechanism first hand,
    an extremely clear demo is available[\[15\]](#part0000_split_077.html#_ftn15).


    ### 2.5.2 Proof-of-Stake (PoS)


    Proof-of-Stake was devised in 2011 as a less expensive alternative to PoW. The
    first working use of PoS for cryptocurrency was Peercoin in 2012. The difference
    between the two consensus mechanisms is that, while in PoW miners use energy to
    validate transactions, in PoS blocks are validated by "validators" in proportion
    to the share of token held (stake). Validators are those who bind a certain amount
    of token as a guarantee for the right to verify transactions. The validators are
    chosen among the nodes of the network through an automatic selection process that
    takes into account a number of different factors. These factors may be different
    depending on the project; however, generally the following are taken into consideration:


    1.              the amount of stake deposited


    2.              the longevity of the stake (also called coin age, i.e., how long
    has the deposit been made)


    3.              a randomization factor


    Of course, the higher the amount and the longer the time of stake deposited are,
    the higher the probability of being selected as validators, as higher and historically
    solid stakes have a greater degree of reliability and integrity. Furthermore,
    when a node is selected by the algorithm and coins a new block, its coin age is
    reset and a certain period of time will have to pass before it can be re-selected.
    This system prevents nodes with large stakes from dominating the Blockchain.


    Once a node is selected as the validator of the next block, it will have to check
    if the transactions it contains are valid, sign the block and add it to the Blockchain.
    This validation is known as an attestation. Validators get rewards for proposing
    new blocks and for certifying the ones they viewed. If a validator validates malicious
    blocks, it loses its stake.


    Unlike PoW systems, where the miners'' work is rewarded with the creation of a
    new currency, in PoS systems the reward consists of a fee withheld on the validated
    transaction. Before being able to withdraw your deposited share and collect your
    reward, the network verifies the validator''s work, checking that no fraudulent
    blocks have been added.


    The most important concept in support of the PoS consensus mechanism is that,
    if a validator attempted to hack the network or process malicious transactions,
    he would lose the entire tied stake.


     A variation of the PoS is the so-called Pure-Proof-of-Stake (PPoS), a mechanism
    created by Algorand. What changes is that the validators are also chosen through
    a random selection, regardless of the number of tokens owned. This automatic selection
    is based on a Verifiable Random Function (VRF). VRF behaves similar to a lottery:
    it is as if each ALGO in a participant''s account had a lottery ticket.


    ### 2.5.3 Difference between PoW and PoS


    What are the differences between Proof-of-Work and Proof-of-Stake? Below we list
    the main ones:


    ·    Proof-of-Stake requires less electricity than Proof-of-Work. As we have seen,
    PoW does not require the computational power of PoW as there is no activity on
    the part of the miners. Proof-of-Stake is consequently considered a more ecological
    consensus mechanism


    ·    Proof-of-Stake is able to process a greater number of transactions than Proof-of-Work,
    for the same amount of time. It is therefore more scalable


    ·    Both can have centralization problems, albeit for different reasons. PoW
    harnesses computational power to mine money; this means that power can be centralized
    by the main mining farms (before the famous ban by the Chinese government, some
    estimates reported that about 70% of world mining took place in China). On the
    other hand, the PoS mechanism encourages the concentration of capital over time
    on a few individuals by encouraging a mechanism whereby the rich become richer
    and richer. Since the amount of cryptocurrency made available (stake) heavily
    affects the probability of validating a block, and consequently the winning of
    the reward, the more people put a large stake at their disposal, the more the
    probability increases that they will become validators. In this way they get some
    sort of priority over the other participants


    ·    In a PoS mechanism, an attack attempt of 51% is less likely than in a PoW
    mechanism as it is not financially convenient. In fact, to achieve this goal,
    the attacker would have to bet at least 51% of the total amount of cryptocurrency
    in circulation. The only way to do this is to buy the coins on the market, increasing
    the real value of the coin over time. As a result, he would end up spending far
    more than he could earn from the attack. Not only that, but once the rest of the
    network realized what had happened, the malicious actor would have lost all of
    his stakes!


    ### 2.5.4 Other consensus mechanism


    While PoW and PoS are the most widespread consensus mechanisms in the Blockchain
    environment, there are other consensus algorithms such as:


    ·    **Proof-of-Capacity (PoC)**, used by Burstcoin, it allows the sharing of
    the memory space of the contributing nodes on the Blockchain network. The more
    memory or hard disk space a node has, the more rights it is granted to maintain
    the public ledger


    ·    **Proof-of-Activity (PoA)**, used on the Decred Blockchain, is a hybrid that
    exploits aspects of both PoW and PoS;


    ·    **Proof-of-Burn (PoB)** is another that requires traders to send small amounts
    of coin to inaccessible wallet addresses, then "burning" them;


    ·    **Proof-of-History (PoH)**, developed by Solana, cryptographically encodes
    the passage of time itself to obtain consent.


