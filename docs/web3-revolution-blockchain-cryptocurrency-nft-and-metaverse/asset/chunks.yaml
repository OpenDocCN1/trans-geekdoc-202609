- raw: '**Consensus (mechanism)**: it is a mechanism that is used in the Blockchain
    to obtain the necessary agreement on a single data value or a single state of
    the network between distributed processes. On the Bitcoin Blockchain, for example,
    the consensus mechanism is known as Proof-of-Work (PoW), which requires the exercise
    of computing power to solve a difficult but arbitrary puzzle in order to keep
    all network nodes honest.


    **Corda**: it is an open-source project that allows you to design and develop
    Blockchains in an open development environment. With Blockchain technology and
    smart contracts, Corda can reduce registration costs by simplifying business operations
    and helping companies create interoperable blockchain networks or applications
    that transact directly.


    **Cryptocurrency**: a digital or virtual currency protected by cryptography, which
    makes counterfeiting or double spending nearly impossible. Many cryptocurrencies
    are decentralized networks based on Blockchain technology. A distinctive feature
    of cryptocurrencies is that they are generally not issued by any central authority,
    which theoretically makes them immune to government interference or manipulation.


    **Cryptography**: it is the study of secure communication techniques that allow
    only the sender and intended recipient of a message to view its content. In encryption,
    the data is encrypted using a secret key, then both the encrypted message and
    the secret key are sent to the recipient for decryption. Cryptographic algorithms
    are the basis of the blockchain.


    **Cypherpunk**: it is any individual who advocates the widespread use of advanced
    cryptography and privacy-enhancing technologies as a gateway to social and political
    change. Cypherpunks have been engaged in an active movement since at least the
    late 1980s.


    **DAO**: it stands for Decentralized Autonomous Organization and refers to a way
    of organizing and managing organizations, making use of smart contracts and Blockchain
    technology to provide them with transparency, immutability, autonomy and security.
    In a DAO, thousands of people autonomously decide the decisions to be made regarding
    a specific project, for which the organization was set up.


    **DApp**: a decentralized application (DApp, dApp, Dapp or dapp) is a computer
    application that runs on a decentralized computer system. DApps have been popularized
    by distributed ledger technologies (DLT) such as the Ethereum through the use
    of smart contracts.


    **Decentralized Finance**: see DeFi


    **DeFi**: decentralized finance, or DeFi, is a system by which financial products
    become available on a public decentralized blockchain network. This makes them
    open for anyone to use, rather than going through intermediaries such as banks.


    **Destructive innovation**: it is an innovation that creates a new market and
    a network of values and ends up killing an existing market and network of values.
    The term was first used in 1995 by the American scholar Clayton M. Christensen.


    **Digital Wallet**: see Wallet.


    **Distributed Ledger**: see DLT.


    **DLT**: it stands for Distributed Ledger Technology. DLT is a system based on
    a distributed ledger, i.e., systems in which all the nodes of a network have the
    same copy of a database that can be read and modified independently by the individual
    nodes.


    **Double-spending**: in the context of the PoW consensus mechanism, it represents
    the risk that a digital currency could be spent twice as a result of a 51% attack.


    **ECDSA**: stands for Elliptic Curve Digital Signature Algorithm and is a cryptographic
    algorithm. The ECDSA algorithm is considered a secure standard for the implementation
    of digital signature systems. Their use today is so varied that they find application
    in almost all fields of information technology. For example, the Internet''s SSL
    and TLS security certificate infrastructure makes heavy use of ECDSA.


    **EIP-20:** the acronym EIP stands for Ethereum Improvement Proposal, which is
    a design document that provides information to the Ethereum community or that
    describes a new functionality for Ethereum or its processes or environment, while
    20 is the progressive number of the document.


    **Epistemic uncertainty**: the uncertainty that the information is unknown to
    the decision maker, although the facts are already established and knowable. This
    is in contrast to random uncertainty, where the facts are not yet established
    and are subject to a random stochastic process that will take place in the future.


    **ERC-20**: an ERC-20 token is a Smart Contract that has a predetermined data
    structure. This facility is designed to facilitate the implementation of various
    functionalities on the Ethereum blockchain, making it easier for developers to
    create work. The acronym ERC stands for Ethereum Requests for Comments, while
    the number 20 comes from the EIP (Ethereum Improvement Proposal) in which it is
    described.


    **Ether**: Ethereum token


    **Ethereum**: it is a Blockchain platform with its own cryptocurrency, called
    Ether (ETH) and its own programming language, called Solidity. As a Blockchain
    network, Ethereum is a decentralized public ledger for verifying and recording
    transactions. Network users can create, publish, monetize and use applications
    on the platform and use its Ether cryptocurrency as a payment. Insiders call decentralized
    applications on the network "dApps".


    **ETF**: it stands for English Exchange Traded Funds, they are special passively
    managed investment funds. Buying an ETF is like buying a basket of stocks. Investing
    in a fund is equivalent to putting your savings together with that of other investors,
    the fund manager will then buy the instruments on which you will invest with this
    money. The investment performance will be given by the result of all the individual
    instruments in which the fund invests.


    **ETN**: it stands for Exchange-Traded Notes, these are financial instruments
    that differ from ETFs in that they are not funds and are issued against a direct
    investment by the issuing company, replicating the trend.


    **Exchange**: platform where you can buy and trade cryptocurrencies and NFTs.


    **Fear & Greed Index**: translated into Italian as an index of fear and greed,
    it was developed by CNNMoney to measure two of the primary emotions that influence
    how much investors are willing to pay for shares. The Fear and Greed Index is
    measured on a daily, weekly, monthly and yearly basis. In theory, the index can
    be used to assess whether the stock market is fairly priced. This is based on
    the logic that excessive fear tends to drive stock prices down, and too much greed
    tends to have the opposite effect.


    **Fiat (currency)**: a fiat currency is a national currency not anchored to the
    price of a commodity such as gold or silver. The value of a fiat currency is largely
    linked to trust in the authority that issues it, usually a state or a central
    bank.


    **Fork**: a fork occurs when a block is connected to 2 successive blocks. Forks
    are related to the fact that the parties must use common rules to keep the history
    of the Blockchain.


    **Gas**: it refers to the commission, or price value, required to successfully
    conduct a transaction or execute a contract on the Ethereum Blockchain platform.
    Priced in small fractions of the cryptocurrency Ether (ETH), commonly referred
    to as gwei and sometimes also called nanoeth, gas is used to allocate the resources
    of the Ethereum virtual machine (EVM) so that decentralized applications such
    as smart contracts can self - to be carried out in a secure and decentralized
    manner. The exact price of gas is determined by supply and demand among network
    miners, who can refuse to process a transaction if the gas price does not reach
    their threshold, and network users looking for processing power.'
