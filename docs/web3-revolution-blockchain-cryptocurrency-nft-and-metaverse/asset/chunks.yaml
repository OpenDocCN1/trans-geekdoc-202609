- raw: "**1998** - Szabo designs a mechanism for a decentralized digital currency\
    \ which he calls \"Bit Gold\". Bit gold was never implemented, however it was\
    \ called \"a direct precursor of the Bitcoin architecture\". \n\nIn the same year\
    \ **Wei Dai**[\\[11\\]](#part0000_split_077.html#_ftn11), a Chinese computer engineer,\
    \ publishes the document \"b-money, an anonymous, distributed electronic cash\
    \ system\". In the paper, Dai outlines the basic properties of all modern cryptocurrency\
    \ systems: *\"... a scheme for a bunch of untraceable digital aliases to pay each\
    \ other with money and enforce contracts between them without external help \"\
    *.\n\n**2009 - Bitcoin was officially born by Satoshi Nakamoto**, a pseudonym\
    \ used by the person or group of people who developed Bitcoin. On January 12,\
    \ 2009, Hal Finney, an American engineer and cryptographic activist, receives\
    \ the first 10 BTC transaction from Satoshi Nakamoto (at the time of writing this\
    \ book, about $ 400,000). From this moment on, the concept of Blockchain evolves\
    \ hand in hand with the concept of Cryptocurrency, which we will discuss in more\
    \ detail in chapter 4.\n\n## 1.4 The Blockchain Trilemma\n\n![](images/00002.jpeg) \n\
    \nFigure 2: the Blockchain Trilemma\n\nAs defined by CoinMarketCap[\\[12\\]](#part0000_split_077.html#_ftn12)\
    \ *“The blockchain trilemma is a concept coined by Vitalik Buterin that proposes\
    \ a set of three main issues - decentralization, security and scalability – that\
    \ developers encounter when building Blockchains, ultimately forcing them to sacrifice\
    \ one \"aspect\" as a compromise to satisfy the other two”.*\n\nThis question\
    \ actually arises with Bitcoin and with the problems that arose when an attempt\
    \ was made to extend its Blockchain. In fact, the low scalability of its Blockchain\
    \ is due to the way it was conceived: the cryptocurrency consensus algorithm (Proof-of-Work)\
    \ does not allow it to scale exponentially like others (e.g., Proof-of- Stake).\
    \ On the other hand, it certainly has the safety and durability that make it the\
    \ safest from attacks of any kind. We will talk about these concepts in the next\
    \ chapter. To solve the trilemma, and thus become an ideal Blockchain in effect,\
    \ the protocol created by Satoshi Nakamoto necessarily had to scale. Consequently,\
    \ most of the Blockchains and therefore of the Cryptocurrencies that were born\
    \ later, the so-called Altcoins, aim to solve in the best way the trilemma presented\
    \ by Buterin, co-founder of Ethereum, today the second largest Blockchain project.\n\
    \n## 1.5 Types of Blockchain\n\nBasically, we can divide the types of Blockchains\
    \ according to whether they are public, private, or hybrid[\\[13\\]](#part0000_split_077.html#_ftn13).\n\
    \n### 1.5.1 Public Blockchain\n\nPublic Blockchain refers to Blockchains that\
    \ are publicly accessible from an Internet network. An example of this type of\
    \ Blockchain are the aforementioned Bitcoin and Ethereum. A public Blockchain\
    \ keeps its data, software and development open to the public, so that anyone\
    \ can review, verify, develop or improve it. However, public Blockchains have\
    \ some security measures that guarantee that no attacker can easily alter the\
    \ functioning of the chain.\n\nThe characteristics of this type of network are\
    \ the following:\n\n·             **full participation**, i.e., they allow anyone\
    \ to be part of it, whether as a user, miner or administrator of a node, without\
    \ any restrictions\n\n·             **full transparency**. The data of the Blockchain\
    \ is available to everyone since its inception without restrictions and anyone\
    \ can examine or control the functioning of the network and its software\n\n·            \
    \ **decentralization**. Public networks are completely decentralized and there\
    \ is no central authority that regulates their operation\n\n·             the\
    \ **economic maintenance** of the Blockchain depends on the system integrated\
    \ in it. Generally, this economic system depends on mining and collecting commissions\
    \ for every transaction made within the network.\n\n### 1.5.2 Private or Authorized\
    \ Blockchain\n\nSubsequently, with the evolution of Blockchain technology and\
    \ its expansion, many companies have become interested in it, leading to the development\
    \ of private or authorized solutions. This type of Blockchain generally has the\
    \ same elements as a public Blockchain, but they depend on a central unit that\
    \ controls all the actions within it. The central body guarantees access to users\
    \ and controls their functions and authorizations within the Blockchain.\n\nThe\
    \ main characteristics of this type of network are:\n\n·    **access to the network**\
    \ is limited to items that can only be authorized from the central control unit\n\
    \n·    **access to the transaction book** or any other means of information generated\
    \ by the blockchain is private\n\n·    **the economic maintenance** of the Blockchain\
    \ generally depends on the company that supports the project. Private blockchains\
    \ often don't use a reward system like cryptocurrencies.\n\n### 1.5.3 Hybrid or\
    \ Federated Blockchain\n\nThis type of Blockchain is a fusion of public and private\
    \ Blockchains and represents an attempt to exploit the best of both solutions.\
    \ In these Blockchains, participation in the network is private, so access to\
    \ network resources is controlled by one or more entities. However, the ledger\
    \ is publicly accessible - this means anyone can explore everything that happens\
    \ on that blockchain block by block.\n\nFor example, these Blockchain networks\
    \ are very useful for governments or business organizations that want to store\
    \ or share data securely. A perfect use case is occurring in the pharmaceutical\
    \ industry, where the Blockchain is used to store the data of its drug production\
    \ lines. The stored data can be examined by the competent authority in order to\
    \ check its quality, both at the corporate and governmental level. The goal of\
    \ applying this blockchain model is to maintain a high level of transparency and\
    \ trust. The characteristics of this type of network are:\n\n·             **access\
    \ to the network is limited** to items that can only be authorized by a central\
    \ body\n\n·             **access to the transaction book** or any other means\
    \ of information generated by the blockchain is public\n\n·             **there\
    \ are no mines or cryptocurrencies**. The consent of the network is given by other\
    \ means which ensure that the data is correct\n\n·             **it is partially\
    \ decentralized**, which leads to a better level of security and transparency\n\
    \nIn the next chapter we will see in more detail how the blockchain works and\
    \ we will clarify some doubts about some concepts previously encountered but not\
    \ yet fully clarified.\n\n# 2\\. How does Blockchain work?\n\n**2.1 Peer-to-Peer\
    \ (P2P) network **\n\n**2.2 The distributed ledger system **\n\n**2.3 Blocks  **\n\
    \n**2.4 Hash and cryptography  **\n\n**2.5 Consensus Algorithm **\n\n**2.6 The\
    \ fork **\n\n**Chapter summary**\n\nIn the previous chapter, we qualitatively\
