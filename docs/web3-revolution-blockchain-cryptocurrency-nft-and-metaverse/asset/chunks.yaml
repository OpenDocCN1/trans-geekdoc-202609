    Once the code associated with a block is found and validated by the network, the
    block can now be added to the chain. As a reward, the user or node who managed
    to crack the block before the others will receive a token in exchange. In the
    case of Bitcoin, therefore, the user will receive `1 BTC` as a reward.


    We summarize below the various steps in the block generation process within a
    `Blockchain`:


    - the aim is to create a reliable and secure system to carry out transactions
    without the need for intermediaries;

    - the `Blockchain` uses a complex coding system to create codes able to uniquely
    identify the blocks and connect them to the chain;

    - the codes are decrypted by special nodes, the so-called "miners" (we will talk
    about them in the next chapter) and sent to the network that is using the `Blockchain`;

    - the miners, for their efforts, receive in exchange tokens protected by cryptography;

    - each `Blockchain` user keeps a copy of these codes;

    - the modification of block codes is an extremely expensive operation in terms
    of computational resources and difficult to implement, since for example it would
    require validation by at least `51%` of users.


    ## 1.2 A practical example


    To clarify even better the concepts underlying the `Blockchain` and what its main
    benefits are, let''s take a cue from the example reported in the book by Mark
    Gates[[7]](#part0000_split_077.html#_ftn7). Let''s imagine an online library that
    shares books (let''s say `eBooks` to be more concrete) where each user contributes
    their `eBooks` and allows people to borrow them. Anyone can participate, and when
    they borrow books, they can also lend them to other people, without returning
    them to the library or to the original owner. How could records be kept of who
    had borrowed the books, which book they had, and who was the original owner of
    the book? Records should be kept of the books currently in the library, their
    original owners, and books that have been borrowed. To do this, one could assign
    a person in the group to track the exchanges using a centralized database model.
    In reality this condition would have a number of disadvantages:


    - the ability of the person handling the transactions and keeping the ledger should
    be trusted first. The greater the network, the greater the management complexity
    and difficulty, therefore the greater the risk of mistakes

    - it should then be trusted that this person does not fraudulently modify the
    records to steal the circulating books

    - I should pay this person

    - I should wait for this person to carry out all transactions. Greater complexity
    also means greater execution time. Otherwise, I would have to hire another person,
    thus also increasing the fixed management costs


    Instead, the `Blockchain` can provide a distributed database of all library book
    records without the need for a person to take over management. With such a database,
