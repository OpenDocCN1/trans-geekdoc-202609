    this has applications in scenarios such as consortium data analysis, where multiple
    entities wish to share insights without revealing their proprietary information.
    In the quantum financial landscape, `SMC` takes on an even more pivotal role,
    allowing quantum algorithms to be executed on encrypted data across different
