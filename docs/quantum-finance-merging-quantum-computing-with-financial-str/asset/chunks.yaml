  trans: '


    随着我们进一步探索金融的未来，`SMC` 成为了一项突出的基石技术。它有望构建安全、协作的金融生态系统，这些系统能够在量子威胁的阴影下运行。`SMC` 在金融系统中的开发不仅是针对潜在攻击的防御措施，更是迈向金融运营新范式的积极一步——在这种范式中，安全、隐私和效率不仅是目标，更是织入行业基础架构的准则。


    # NIST 在定义量子安全标准中的作用


    在快速发展的金融领域，建立量子安全标准的重要性至关重要。美国国家标准与技术研究院（`NIST`）作为标准化领域备受推崇的机构，处于这项关键任务的前沿。NIST
    的作用超越了指南的制定；它还是引导向抗量子系统过渡的灯塔。


    量子安全标准对于保护金融信息免受量子计算机强大计算能力的至关重要，因为这种能力威胁着传统的加密防御。NIST 在此背景下的使命是多方面的：


    1. `Research and Development`:`NIST` 积极参与前沿研究，以理解潜在的量子威胁并开发能够抵抗量子攻击的加密算法。这种持续的研究对于保持在不断变化的量子格局中的领先地位至关重要。


    2. `Cryptographic Standards`: 通过其后量子加密（`PQC`）项目，`NIST` 正在引领识别并标准化抗量子算法。该机构严谨的筛选过程包括公开竞赛，鼓励全球密码学家参与，确保了创新和审查的广泛来源。


    3. `Implementation Guidelines`:`NIST` 提供了关于如何实施量子安全加密的全面指南。这些指南为金融机构和技术提供者提供了蓝图，使其能够有效采用抗量子措施。


    4. `Testing and Certification`:`NIST` 开发了评估抗量子算法性能和安全性的测试。通过 `NIST` 的认证确保利益相关者其加密系统的稳健性。


    5. `Educational Outreach`: 考虑到可能阻碍量子安全标准采用的知识差距，`NIST` 致力于教育推广。该学院提供资源、研讨会出版物，向包括金融专业人士、监管机构和政策制定者在内的更广泛读者解释量子安全加密的复杂性。


    6. `Collaboration with Industry and Government`:`NIST` 促进工业、学术界和政府机构之间的合作，以协调量子安全标准。这种协作方法确保了标准是实用的、广泛接受的，并符合国际法规。


    7. `Global Influence and Interoperability`: 作为标准化领域受尊敬的权威机构，`NIST` 的量子安全标准可能会影响全球加密实践。该学院积极参与国际讨论，以确保其标准与其他国家和其他国际机构开发的标准具有互操作性。


    鉴于金融市场的国际性质，`NIST` 在定义量子安全标准中的作用至关重要。随着量子技术变得日益普及，`NIST` 制定的标准将在塑造金融部门安全基础设施方面发挥着工具性作用。它们将为安全的量子金融交易、数据存储和通信提供基础，帮助缓解量子计算给全球经济体系带来的风险。


    量子计算的现状呈现出一种悖论。虽然它为金融业提供了非凡的机遇，但也给安全框架引入了前所未有的挑战。`NIST` 在建立量子安全标准方面的积极方法是应对这些挑战的关键一步。通过构建稳健的加密基础设施，`NIST`
    不仅在加强金融部门抵御量子威胁的能力，还使其能够充满信心地地利用量子计算的全部潜力。


    因此，鼓励金融机构密切关注 `NIST` 的进展，并为整合量子安全标准做好准备。


    ## 向量子安全基础设施转型


    在一个量子计算不再是遥远幽灵，而是日益蓬勃发展的现实的时代，金融部门面临着关键的转型。过渡到量子安全金融基础设施不仅是一项预防措施，更是保护未来的必然要求。这种迁移涉及对现有系统进行全面改造，以抵抗量子机器的强大力量。


    1. `Assessment of Current Cryptographic Footprint`:金融机构必须首先评估其现有的加密系统。这包括对所有依赖加密保护的数字资产、传输中数据和静态数据进行清单。了解当前的加密足迹对于规划转型至关重要。


    2. `Strategic Planning`:向量子安全基础设施转型是一个复杂的项目，需要战略规划。这涉及设定明确的目标、时间表和里程碑。机构必须为研究、开发和培训分配资源，以确保转型顺利且全面。


    3. `Adoption of Quantum-Resistant Algorithms`:一旦 `NIST` 确定了抗量子算法的选择，金融机构必须采用这些算法。采用过程并非简单的旧算法替换；它需要严谨的测试和验证，以确保新算法与现有系统无缝集成。


    4. `System Upgrades and Retrofits`:现有的硬件和软件可能与抗量子算法不兼容。金融机构可能需要升级或改造其系统以支持增强的加密措施。


    5. `Policy and Procedure Updates`:在技术变化的同时，金融机构必须更新其政策和程序。这包括修订风险评估、应急响应计划和连续策略，以考虑量子背景。


    6. `Staff Training and Awareness`:必须对员工进行量子威胁和新安全措施的教育。培训计划将确保员工精通量子安全系统的操作和维护。


    7. `Collaboration with Vendors and Partners`:金融机构并非独立运行。它们必须与供应商、合作伙伴和客户合作，以确保整个金融生态系统转型到量子安全标准。这需要协调和协作，以升级相互连接和接口。


