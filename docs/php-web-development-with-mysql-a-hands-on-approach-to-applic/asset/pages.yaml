  md: "# Create NumberOfMoviesReservedByUser() Function\n\nLet's create a function\
    \ called numberOfMoviesReservedByUser(). It requires one parameter: $user_id.\
    \ Add the header and function in Listing 25.24. This function queries the reservation\
    \ table of the movie database for all the rows containing the given user_id. In\
    \ line 20, we use MySQL's COUNT() function to total the number of matching rows.\
    \ This number indicates the number of movies this user has reserved.\n\nListing\
    \ 25.24.\n\n```\n```php\n/**\n * Purpose: Determines the number of movies reserved\
    \ by a user\n * Description: Given a user id, a query is made for the number of\
    \ movies reserved by this user. This number is returned.\n * @param $user_id\n\
    \ * @return int The number of movies reserved by this user.\n */\nfunction numberOfMoviesReservedByUser($user_id)\n\
    {\n\trequire_once('dbconnection.php');\n\t$dbc = mysqli_connect(DB_HOST, DB_USER,\
    \ DB_PASSWORD, DB_NAME)\n\tor trigger_error('Error connecting to MySQL server\
    \ for' . DB_NAME, E_USER_ERROR);\n\t$query = \"SELECT COUNT(id) FROM reservation\
    \ WHERE user_id = ?\";\n\t$result = parameterizedQuery($dbc, $query, 'i', $user_id)\n\
    \tor trigger_error('Error querying database movieListing', E_USER_ERROR);\n\t\
    $retval = 0;\n\tif (mysqli_num_rows($result) == 1)\n\t{\n\t\t$row = mysqli_fetch_row($result);\n\
    \t\t$retval = $row['total'];\n\t}\n\treturn $retval;\n}\n```\n```"
