    # Expected Results


    Let’s run our application and verify we are inserting items in our database correctly.


    If all goes well, we should get the expected output shown in Figure 12.25.


    Now let’s check to see if our full name actually was inserted into our fullName
    table. In the MySQL CLI tool, select all fields and rows in the fullName table:


    ```

    SELECT * FROM FullName;

    ```


    Depending on your input, you should see a new row like the one in Figure 12.26.


    # SUCCESS!


    # Things That Can Go Wrong


    A few common bugs may crop up now, and then that will prevent your application
    from running successfully. The most common tend to be those related to communicating
    with the database. Bugs due to PHP coding errors can be found with a standard
    debugger and using tools like Xdebug[8] and PHP Integrated Development Environments
    (IDE) like JetBrains’ PhpStorm.


    Regarding database communication bugs, it is helpful to use a database management
    tool like Adminer or (for our example) the MySQL CLI tool to verify your connection
    parameters work. Database communication bugs typically involve a failure to connect
    to the database or a malformed SQL query. Let’s look at both of these.


