  md: "# File Uploads\n\nAnother source of attack is uploaded files. The OWASP has\
    \ a lot of detailed information regarding the risks of uploaded files and various\
    \ mitigation strategies. My recommendation is always to follow the guidance from\
    \ the OWASP. Still, here are the minimal things you must consider to allow for\
    \ securely uploading files.\n\nFor this example, let’s say we are asking a user\
    \ to upload an image file using this form:\n\n```\n<form method=\"POST\" enctype=\"\
    multipart/form-data\" action=\"upload.php\">\n    File: <input type=\"file\" name=\"\
    picture\">\n    <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n# Validate\
    \ the Uploaded File\n\nThere are a few steps you need to follow to validate an\
    \ uploaded file. For example, you want to guard against a directory path traversal\
    \ attack, only accept uploaded files using POST, check the file type, and check\
    \ the file size.\n\n# Protect Against a Path Traversal Attack\n\nAn attacker can\
    \ try and acquire passwords from our web server or access a file that wasn’t meant\
    \ to be accessed by setting the file’s name as a relative path (e.g. ../../../etc/passwd).\n\
    \nTo guard against this attack, use the basename()[15] function to strip off unwanted\
    \ characters:\n\n```\n$file_name = basename($_FILES['picture']['name']);\n```\n\
    \n# Only Accept Uploaded Files Using HTTP POST\n\nAs an extension to not being\
    \ able to manipulate the web application to work on files it should not, you should\
    \ verify the file was actually uploaded using HTTP POST with the is_uploaded_file()[16]\
    \ function:\n\n```\nif (is_uploaded_file($_FILES['picture']['tmp_name']) === true)\n\
    {\n    // You're good to go!\n}\nelse\n{\n    // We've got a problem!\n}\n```\n\
    \n[15] basename(): https://php.net/basename\n[16] is_uploaded_file(): https://php.net/is_uploaded_file"
  merge: -1
  img_proc: true
- pgno: 340
  md: "# 22. CREATING SECURE WEB APPLICATIONS\n\n# Check the MIME File Type\n\nWe\
    \ also want to prevent attackers from uploading files our application is not interested\
    \ in (e.g. executable files). Rather than relying on the file extension contained\
    \ in $_FILES['picture']['type'], it is best to use the finfo_open()[17] and finfo_file()[18]\
    \ functions that interrogate the actual file for it's MIME file type:\n\n```\n\
    $file_info = finfo_open(FILEINFO_MIME_TYPE);\n$file_mime_type = finfo_file($file_info,\
    \ $_FILES['picture']['tmp_name']);\nfinfo_close($file_info);\n```\n\nIf you are\
    \ expecting an image type, in addition to explicitly validating the MIME file\
    \ type, you should also use the function getimagesize()[19] as shown in Listing\
    \ 22.4\n\n# Listing 22.4.\n\n```\nif (is_readable($_FILES['picture']['tmp_name']))\n\
    {\n    $file_size = getimagesize($_FILES['picture']['tmp_name']);\n    if (!empty($file_size)\
    \ && ($file_size[0] !== 0) && ($file_size[1] !== 0))\n    {\n        // You're\
    \ good to go!\n    }\n    else\n    {\n        // We've got a problem!\n    }\n\
    }\n```\n\n# Check the File Size\n\nIt is always a best practice to limit the maximum\
    \ file size of uploaded files. We typically do that by setting a hidden input\
    \ element with the name attribute set to max_file_size inside the form. However,\
    \ an attacker can manipulate this value.\n\nThe web server also has an INI file\
    \ directive called upload_max_filesize that limits the maximum file that a browser\
    \ can upload to the server.\n\nA file will not be uploaded if it exceeds either\
    \ the max_file_size or upload_max_filesize (whichever is smaller). In this case,\
    \ UPLOAD_ERR_FORM_SIZE will be set for $_FILES['picture']['error'] To further\
    \ limit the size (in bytes) of the uploaded file to the application by checking\
    \ $_FILES['picture']['size']:\n\n[17] finfo_open(): https://php.net/finfo_open\n\
    [18] finfo_file(): https://php.net/finfo_file\n[19] getimagesize(): https://php.net/getimagesize"
  merge: -1
  img_proc: true
- pgno: 341
  md: "```\n```php\nif ($_FILES['pictures']['size'] <= 1000000)\n{\n    // You're\
    \ good to go!\n}\nelse\n{\n    // Too big!\n}\n```\n```\n\n# # Securing Your Session\n\
    \nThe last attack I’ll cover is session hijacking. An attacker can steal your\
    \ session if they can get a hold of your session ID. This frequently happens as\
    \ a result of an XSS or man-in-the-middle attack and not using an encrypted connection.\n\
    \n# ## Use HTTP-Only Session Cookies\n\nYou can prevent session hijacking by making\
    \ sure to set the web server’s INI directive `session.cookie_httponly=On`. This\
    \ will refuse access to the session cookie from JavaScript.\n\nAnother INI directive\
    \ to consider is `session.use_strict_mode=On`. It prevents the session module\
    \ from accepting session IDs that were not generated by the session module and\
    \ can prevent using an attacker-initialized session ID.\n\nFor more information\
    \ on securing sessions and INI settings, see [https://php.net/session.security.ini](https://php.net/session.security.ini).\n\
    \n# ## HTTPS Uses Encrypted Communication\n\nAnother way to prevent a session\
    \ from being hijacked is to make your web application available only using an\
    \ encrypted connection (i.e., HTTPS). The HTTP protocol is communicated in cleartext.\
    \ In contrast, HTTPS encrypts the HTTP using the Transport Layer Security (TLS)\
    \ protocol. In the past, browsers used their predecessor, the Secure Socket Layer\
    \ (SSL). Setting up a webserver to use the HTTPS protocol involves using TLS/SSL\
    \ certificates that contain a private key for the webserver and a public key that\
    \ client browsers use to connect to the secure server. The public and private\
    \ keys handle encryption and decryption.\n\nIf your site uses HTTPS, you can further\
    \ protect your sessions by setting `session.cookie_secure=On`. This setting only\
    \ allows accessing the session ID cookie over HTTPS.\n\nLet’s Encrypt[^20] is\
    \ a nonprofit Certificate Authority that provides TLS certificates free of charge.\n\
    \n[^20]: *Let’s Encrypt*: [https://letsencrypt.org](https://letsencrypt.org)"
