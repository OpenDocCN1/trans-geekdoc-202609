  md: "# 23. ADDING USER LOGINS\n\n# Listing 23.8.\n\n```\n```php\nfunction parameterizedQuery($dbc,\
    \ $sql_query, $data_types, ...$query_parameters)\n{\n    $ret_val = false; //\
    \ Assume failure\n\n    if ($stmt = mysqli_prepare($dbc, $sql_query))\n    {\n\
    \        if (mysqli_stmt_bind_param($stmt, $data_types, ...$query_parameters)\n\
    \            && mysqli_stmt_execute($stmt))\n        {\n            $ret_val =\
    \ mysqli_stmt_get_result($stmt);\n\n            if (!mysqli_errno($dbc) && !$ret_val)\n\
    \            {\n                $ret_val = true;\n            }\n        }\n \
    \   }\n    return $ret_val;\n}\n```\n```\n\nThis code is essentially a repeat\
    \ of what I covered in the last chapter, just a little more efficient. Notice\
    \ that the mysqli_stmt_bind_param() function conveniently takes the passed in\
    \ $data_types and ...$query_parameters variable parameters. Our new function returns\
    \ the results of our query or false if there is an error.\n\nNow let's get back\
    \ to using this new function to check if the user trying to sign up already exists\
    \ before creating a new user. If you recall, in our signup.php script, we are\
    \ in the condition where we know the user has entered in their user name and password.\n\
    \n```\n```php\n// Get user name and password\n$user_name = $_POST['user_name'];\n\
    $password = $_POST['password'];\n\nif (!empty($user_name) && !empty($password))\n\
    {\n}\n```\n```\n\nSince we are querying the database, we must include our dbconnection.php.\
    \ We also require our queryutils.php script to connect to our Movie database as\
    \ in Listing 23.9."
