    \ is ';\n29.\n30. if ($boat_radio->getPowered())\n31. {\n32.     echo 'turned\
    \ on';\n33. }\n34. else\n35. {\n36.     echo 'turned off';\n37. }\n38.\n39. echo\
    \ ' with the volume set to ' . $boat_radio->getVolume() . ', ';\n40. echo ' and\
    \ the channel set to ' . $boat_radio->getChannel() . '.';\n```\n\n# Validating\
    \ Input to a Setter Method\n\nFrequently, we need to constrain the input to our\
    \ methods. For example, in our Radio class, volume settings will have an upper\
    \ and lower limit. Many entertainment centers have a volume setting between 0\
    \ and 10. Let’s add some class constants[4] for these to our Radio class:\n\n\
    ```\n<?php\nclass Radio\n{\n    const MIN_VOLUME = 0;\n    const MAX_VOLUME =\
    \ 10;\n\n    // ...\n}\n```\n\nIn our setVolume() method, we get access to these\
    \ class constants by using self::. self represents the class’s self, and the ::\
    \ is called the scope resolution operator[5]. It is needed when referencing constants\
    \ inside the class. You also use the :: when referencing external variables, but\
    \ you use the name of the class instead. For example, we can update setVolume()\
    \ to ensure a user can’t set it outside of the allowable range as in Listing 26.8.\n\
    \n[4] class constants: https://php.net/language.oop5.constants\n[5] scope resolution\
    \ operator: https://php.net/language.oop5.paamayim-nekudotayim"
