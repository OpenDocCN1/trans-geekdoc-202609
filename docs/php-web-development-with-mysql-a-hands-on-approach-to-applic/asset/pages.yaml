- pgno: 334
  md: '# Leaking Information to Hackers


    Speaking in security lingo, it is essential to know what the attack vectors are
    for any application you write. These are cookies, query parameters, and form fields
    typically sent via POST for web applications. Another thing to consider is what
    information we make available—like the database schema or file system paths—that
    hackers can use to penetrate our application. These happen to be closely related
    to the attack vectors. Let’s take a look at each of these.


    # Cookies


    Web applications can use cookies to store all kinds of information. However, they
    reside on a client’s browser, and as such, they are viewable and vulnerable to
    modification. I could spend a lot of time talking about what should and should
    not be stored in cookies (e.g., you should never store personal information in
    cookies). However, the debate is moot; along with the database, use session variables
    and only use a single cookie to store the session ID. Doing so avoids most problems
    with using cookies. Remember, cookies are only one solution to the problem of
    the web being stateless. We have much better tools available to solve the persistence
    problem: the database and session variables.


    # Query Parameters


    Query parameters are sent over in the URL of an HTTP GET request, after the ?:


    ```

    http://example.com?term=elephant&page=3

    ```


    The user or a potential hacker can see this. Query parameters can be used as a
    persistence mechanism (similar to hidden variables in a form). This practice exposes
    details about the application and how it runs. Often we only need to send a single
    query parameter which can be an ID that maps to a primary key in a database table
    which can be queried in the script after processing the GET request.


    ```

    http://example.com?id=840938

    ```


    Since query parameters are user-supplied data, they should be parameterized when
    used in queries and escaped when displayed in HTML.


    # Form Fields


    Form fields are a gold mine of information for hackers trying to guess field names
    in a database schema. Unfortunately, this has been a common practice for developers
    and makes the process of guessing the database schema much easier in a blind SQL
    injection attack.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'I live in an area with many insurance companies, and they typically have development
    requirements for obfuscating the column names in database tables used in form
    fields. This is an excellent practice every developer should follow.


    # Preventing Cross-Site Scripting Attacks


    Cross-Site Scripting (XSS) is listed as the number seven ASR from the “OWASP Top
    Ten.” According to OWASP:


    > XSS flaws occur whenever an application includes untrusted data in a new web
    page without proper validation or escaping, or updates an existing web page with
    user-supplied data using a browser API that can create HTML or JavaScript. XSS
    allows attackers to execute scripts in the victim’s browser which can hijack user
    sessions, deface web sites, or redirect the user to malicious sites.


    Sounds scary! Well, all this stuff is scary. There are three vectors of XSS attacks
    targeting browsers: Reflected XSS, Stored XSS, and DOM XSS:


    Here is what the OWASP says about these:


    +   - **Reflected XSS:** The application or API includes unvalidated and unescaped
    user input as part of HTML output. A successful attack can allow the attacker
    to execute arbitrary HTML and JavaScript in the victim’s browser. Typically, the
    user will need to interact with some malicious link that points to an attacker-controlled
    page, such as malicious watering hole websites, advertisements, or similar.

    +   - **Stored XSS:** The application or API stores unsanitized user input that
    is viewed at a later time by another user or an administrator. Stored XSS is often
    considered high or critical risk.

    +   - **DOM XSS:** JavaScript frameworks, single-page applications, and APIs that
    dynamically include attacker-controllable data to a page are vulnerable to DOM
    XSS. Ideally, the application would not send attacker-controllable data to unsafe
    JavaScript APIs.


    I will deal with the first two since mitigating the third type of attack is done
    outside of PHP.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# 22. CREATING SECURE WEB APPLICATIONS


    The mechanics of how XSS works are pretty involved due to the number of actors.
    An excellent reference is *Security Principles for PHP Applications* by Eric Mann
    for a more in-depth discussion. In Chapter 7, Eric explains XSS and how to prevent
    it. Another great reference is https://excess-xss.com. The authors have a comprehensive
    tutorial with diagrams explaining XSS and mitigation strategies.


    XSS involves three actors at its core: the attacker, the victim, and the vulnerable
    website. To mitigate the vulnerability, our code must sanitize all inputs to the
    website of JavaScript and HTML entities before outputting it.


    # Reflected XSS


    Let''s take the application we wrote above to test an SQL Injection attack and
    add an output of our search term to the web page as in Figure 22.16.


    Even though we''ve parameterized our search term input to the database query,
    let''s see if this web application is exploitable to a reflected XSS attack. We''ll
    know it can be exploited if we can execute a JavaScript command or render some
    additional HTML.


    ```

    <script>alert(''XSS Attack'')</script>

    ```


    Let''s start by entering `<script>alert(''XSS Attack'')</script>` into the search
    field as shown in Figure 22.17. We get the results shown in Figure 22.18. Uh oh!
    Unfortunately, this indicates our application is vulnerable to XSS attacks.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_336_0.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_336_1.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_336_2.png)'
