    \ DB_USER, DB_PASSWORD, DB_NAME)\n17. or trigger_error(\n18. 'Error connecting\
    \ to MySQL server for DB_NAME.',\n19. E_USER_ERROR\n20. );\n21. \n22. if (isset($_POST['delete_movie_submission'])\
