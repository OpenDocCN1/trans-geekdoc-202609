- pgno: 44
  md: '# 3. WHY VARIABLES MATTER


    # Variables in PHP


    PHP supports several kinds of variables. Predefined variables are defined already
    by the PHP language, while user-defined variables are defined by you, the developer,
    in your code. Then there are form variables defined by the name attributes in
    an HTML form and become keys in a predefined variable.


    # Valid Variable Names


    +   - PHP variable names must begin with a dollar sign ($).

    +   - A variable name must be at least one character in length.

    +   - The first character after the dollar sign $ can be a letter or an underscore
    _, and characters after that can be a letter, an underscore, or a number.

    +   - Spaces and special characters other than _ and $ are not allowed in any
    part of a variable name.


    Here are a few examples of valid variable names:


    ```

    $name1

    $price_tag

    $_abc

    $Abc_22

    $A23

    ```


    Here are a few examples of invalid variable names:


    ```

    $10names

    box.front

    $name#last

    A-23

    $5

    ```


    # Recommendations for Naming Your Variables


    PHP does have a set of coding standards, which this book follows. You can find
    them on the PHP-FIG website at PSR-1: Basic Coding Standard[1] and PSR-2: Coding
    Style Guide[2]. However, the coding standards intentionally give little guidance
    on how to name your variables. The standards recommend using camelCase for naming
    your methods, StudlyCaps for class names, and ALL_CAPS separated by underscores
    for naming constants[3].


    [1] PSR-1: Basic Coding Standard: http://www.php-fig.org/psr/psr-1/

    [2] PSR-2: Coding Style Guide: http://www.php-fig.org/psr/psr-2/

    [3] naming constants: http://www.php-fig.org/psr/psr-1/#1-overview'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'I like to use the following conventions when creating variables, functions,
    methods, constants, and classes in PHP, which I will be using throughout this
    book:


    | Property | Example |

    |---|---|

    | Variable Names | $snake_case |

    | Function/Method Names | function camelCase() |

    | Classes | class StudlyCaps |

    | Constants | const ALL_CAPS |


    Regarding naming your variables, a recommended practice is to choose good descriptive
    names for your variables (e.g., $temperature_fahrenheit). Also, most predefined
    PHP variables start with a $_ (i.e. $_POST[]). I recommend that you do not create
    any variables starting with an underscore (_) as this might be confusing to other
    PHP developers that have to maintain your code.


    # Types of Variables


    All data is eventually represented to a computer using 1s and 0s. However, a programming
    language interpreter or compiler must know the data type representation before
    correctly converting the data into a format the computer can use. Like several
    other programming languages (e.g., JavaScript), PHP is a dynamically typed language
    (as opposed to a statically typed language like Java). A variable will dynamically
    change its type implicitly based on the data type of the value assigned to it
    or the context in which it''s used.


    # Scalar Data Types


    PHP supports the following scalar data types:


    +   - Boolean

    +   - integer

    +   - float

    +   - string'
