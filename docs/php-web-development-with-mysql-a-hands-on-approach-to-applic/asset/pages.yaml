    \ = \"\";\n7. $movie_runtime = \"\";\n8. $movie_genre_text = \"\";\n9. $checked_movie_genres\
    \ = null;\n```\n\nThese values get set after the user submits the form in the\
    \ if condition in Listing 19.13 that checks the $_POST form variables are set."
