  md: '# SELECTing from a Table


    Selecting data from a table is incredibly powerful and allows us to retrieve rows
    and specific columns from a table based on criteria we specify in the SELECT statement.


    If we are interested in retrieving ALL the rows and columns in the invoices table,
    we can issue the following command:


    ```

    SELECT * FROM invoices;

