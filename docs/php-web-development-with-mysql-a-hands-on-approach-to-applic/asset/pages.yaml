- pgno: 236
  md: '# 19. WORKING WITH FILES AND FEATURE ADDITIONS TO EXISTING CODE


    In this chapter, we add the ability to upload and display an image to our *Movie
    Listing* application.


    Let’s say we have our *Movie Listing* application out in the wild, and one of
    our users says, “Hey, I really like the App, but it would be truly awesome if
    you could add a thumbnail image for each movie. Can you do that?”


    As easy as that one sentence is to say regarding the addition of this feature,
    it does require changing quite a few PHP scripts. Furthermore, it can require
    modifying all the PHP scripts depending on our implementation. Therefore, it makes
    sense to keep your users in the loop and present them with different use cases
    and screenshots. However, this is beyond the scope of this book, so I will jump
    right in with a description of how I think it should look, work, and what needs
    to be modified:


    +   1. Add a field to the `movielisting` database table for holding the file information
    (more on this below).

    +   2. Create an `images/` folder for holding images for movies.

    +   3. Modify `addmovie.php` so users can upload an image of a movie and add it
    to the movie details entry in the database. Also, display the image on the “Add
    a Movie” page after adding the movie. The uploading of an image should be optional
    as well.

    +   4. Modify `index.php` to display a thumbnail image of the movie at the beginning
    of each movie row.

    +   5. Modify `moviedetails.php` to display the image on the “Movie Details” page
    to better identify the movie.

    +   6. Modify `editmovie.php` so that a user can upload a different image of a
    movie (or not) and modify the movie details entry in the database.

    +   7. Modify `removemovie.php` to show the image on the “Remove a Movie” page
    to identify the movie better.'
  merge: -1
  img_proc: true
