- pgno: 251
  md: "# Adding File Upload Capability\n\nNote the file path locations also must include\
    \ the name of the files. move_uploaded_file() returns true if successful, otherwise\
    \ false. We will put the call in an if condition and reset movie_file_path to\
    \ an empty string if it fails. Add the following code below the line where we\
    \ previously set movie_file_path:\n\n```\n```php\n$movie_file_path = ML_UPLOAD_PATH\
    \ . $_FILES['movie_image_file']['name'];\n\nif (!move_uploaded_file($_FILES['movie_image_file']['tmp_name'],\
    \ $movie_file_path))\n{\n    $movie_file_path = \"\";\n}\n```\n```\n\nThe above\
    \ code moves the uploaded movie image file from the temporary location on the\
    \ webserver to the images/ folder. Our completed addMovieImageFileReturnPathLocation()\
    \ function looks like Listing 19.7.\n\n# Listing 19.7.\n\n```\n```php\nfunction\
    \ addMovieImageFileReturnPathLocation()\n{\n    $movie_file_path = \"\";\n\n \
    \   // Check for $_FILES being set and no errors.\n    if (isset($_FILES) && $_FILES['movie_image_file']['error']\
    \ == UPLOAD_ERR_OK) {\n        $movie_file_path =\n            ML_UPLOAD_PATH\
    \ . $_FILES['movie_image_file']['name'];\n\n        if (!move_uploaded_file($_FILES['movie_image_file']['tmp_name'],\
    \ $movie_file_path)) {\n            $movie_file_path = \"\";\n        }\n    }\n\
    \n    return $movie_file_path;\n}\n```\n```"
