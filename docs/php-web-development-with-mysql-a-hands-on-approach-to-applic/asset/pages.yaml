- pgno: 18
  md: '# INTRODUCTION


    # Why PHP and MySQL?


    Both PHP and MySQL are open source which means you can freely download them and
    modify the source code if you so desire. Moreover, PHP and MySQL are commonly
    used together.


    Both PHP and MySQL have a low barrier to entry. All you need to develop dynamic
    web applications with databases is access to a computer. All the applications
    necessary to develop using PHP and MySQL are freely available at no cost.


    # Who This Book is NOT For?


    If you are unfamiliar with any of these concepts, you would be best served by
    first getting a hold of an introductory programming book. While we introduce how
    PHP implements common programming concepts like loops and arrays, we expect you
    to know how and when to use them. Likewise, if you are not comfortable with basic
    HTML/CSS, you should spend some time brushing up on these skills as well.


    # PHP Versions, MySQL, and This Book


    PHP version 7.0 provides a significant upgrade over version 5.6 in both performance
    and security. Therefore, all PHP code and concepts presented in this book will
    be based on version 7.0.


    There are many database management systems (DBMS). However, this book uses a DBMS
    based on the Standard Query Language (SQL). We use the MySQL DBMS because it is
    frequently used with PHP, free to download and use, and it is the most popular
    DBMS in the world.


    # How Code Samples are Presented


    Code samples are used throughout the book to illustrate each topic. Longer code
    listings are numbered and include line numbers for ease of reference. Syntax highlight
    similar to what you find in a modern text editor or integrated development environment
    (IDE) is used to make the code more readable by making variables, strings, and
    keywords stand out. Finally, you can also download the code samples from the phparch.com
    website.


    Bear in mind that the code samples in the book have been formatted to fit in the
    narrower widths afforded by the screens for PDF and electronic readers as well
    as the printed page. None of the changes made to accommodate this limitation affect
    the functionality of the'
  merge: -1
  img_proc: true
