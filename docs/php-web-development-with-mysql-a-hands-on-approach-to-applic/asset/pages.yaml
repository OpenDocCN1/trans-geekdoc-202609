- pgno: 154
  md: '# 15. DISPLAYING A LIST OF ITEM DETAILS


    In this chapter, we create a database-driven movie listing web application that
    contains a list of items with links to another page to get more detailed information
    about the movie. Over the following chapters, we will be adding features to this
    application such as:


    +   - Administrative ability to upload new movies

    +   - Ability to upload a thumbnail image of a new movie

    +   - User logins

    +   - The ability for users to check out movies.

    +   - The ability for users to return movies.


    # Designing the Database


    When thinking about the features for this application, we should consider the
    data we need first. Since this is an application containing information about
    movies, we should have the following:


    +   - title

    +   - rating

    +   - director

    +   - running time

    +   - genre

    +   - (eventually an image)


    The opening page of our application will have a list of the movies with a link
    to another page for more detailed information. We can use a single table to keep
    our movie data in and call it `movieListing`. We will name our database `Movie`.


    In our `movieListing` table we will have the following columns/fields:


    +   - id for the primary key

    +   - title

    +   - rating

    +   - director

    +   - running_time_in_minutes

    +   - genre'
  merge: -1
  img_proc: true
