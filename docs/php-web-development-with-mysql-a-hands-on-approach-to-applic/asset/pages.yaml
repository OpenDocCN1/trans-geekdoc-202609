- pgno: 302
  md: '# 20. BASIC HTTP AUTHENTICATION


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_302_0.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_302_1.png)


    The first time this script is called, neither $_SERVER[''PHP_AUTH_USER''] nor
    $_SERVER[''PHP_AUTH_PW''] is set, so the authorization dialog is shown. If the
    user enters in the wrong credentials and then presses Sign In (Figure 20.7), the
    authorizeaccess.php script is called again. The code again meets the if statement
    conditions because the credentials do not match, and the authorization headers
    are sent again.


    When the user submits the correct credentials, the authorizeaccess.php script
    is called again. This time, the previous if statement doesn''t trigger, and the
    script continues execution.


    The last case we need to handle is the user selecting Cancel from the authorization
    dialog (Figure 20.8).


    We want to display a message to the page that they need to enter a valid username
    and password and exit our application. Therefore, add the following code after
    the two header() lines of code:


    ```

    ```php

    header(''HTTP/1.1 401 Unauthorized'');

    header(''WWW-Authenticate: Basic realm="Movies I Like"'');


    $invalid_response = "<h2>Movies I Like</h2><h4>You must enter a " . "valid username
    and password to access this page.</h4>";

    exit($invalid_response);

    ```

    ```


    If the user selects Cancel, their page request does not include any access credentials.
    Doing so invokes the exit() function, exits the application, and displays contents
    of $invalid_response.'
