  md: "Let's look at Listing 26.27 for reading a single row based on the ID.\n\n#\
    \ Listing 26.27.\n\n```\n```php\npublic function readById($id)\n{\n    $db = new\
    \ PDO(self::DSN, self::DB_USER, self::DB_PASSWORD);\n\n    // Read the record\
    \ given by the id\n    $sql = \"SELECT * FROM student WHERE id=:id\";\n\n    try\n\
    \    {\n        $query = $db->prepare($sql);\n        $query->bindParam(\":id\"\
    , $id, PDO::PARAM_INT);\n        $query->execute();\n\n        // Fetch result\
    \ into instance of a Student object\n        $result = $query->fetchObject(\"\
    Student\");\n    }\n    catch(Exception $ex)\n    {\n        echo \"{$ex->getMessage()}<br/>\"\
    ;\n    }\n\n    return $result;\n}\n```\n```\n\nEverything in this method should\
    \ be straight forward except for line 15:\n\n```\n$result = $query->fetchObject(\"\
    Student\");\n```\n\n> *Another way to specify our class is Student::class—without\
    \ quotes. PHP uses the ::class constant to reference the fully-qualified name\
    \ of a class which includes its namespace.*\n> \n> `$result = $query->fetchObject(Student::class);`\n\
    \nIn our readAll() method, we used the fetchAll() method which returned an array\
    \ of Student objects. We could have done the same thing on line 15, but we would\
    \ return a single object inside an array with one element. It's more convenient\
    \ to return a single object since we know we're only looking for a single row.\
    \ Therefore, we need to use the fetchObject() method, which takes a string with\
    \ the name of the class we want to use that contains properties with all the fields\
    \ in the student table, which in our case is Student.\n\nIf an ID that does not\
    \ exist in the student table is passed in, readById() returns false."
