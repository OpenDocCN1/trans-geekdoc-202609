- pgno: 181
  md: "# Creating an Array with Checkboxes for Genre\n\nA movie can fit into multiple\
    \ genres. Since we want to include various selections for “Genre,” we need to\
    \ use checkboxes (Figure 16.4). It also cuts down on duplication of HTML markup\
    \ if we create an array containing our genres.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_181_0.png)\n\
    \nListing 16.3 shows what the PHP code and HTML markup look like for “Genre”.\n\
    \n# Listing 16.3.\n\n```\n<?php\n$genres = [\n    'Action', 'Adventure', 'Comedy',\
    \ 'Documentary', 'Drama',\n    'Fantasy', 'Horror', 'Romance', 'Science Fiction'\n\
    ];\n?>\n// ...\n<?php\nforeach ($genres as $genre)\n{\n?>\n<div class=\"form-check\
    \ form-check-inline col-sm-3\">\n    <input class=\"form-check-input\" type=\"\
    checkbox\"\n        id=\"movie_genre_checkbox_action\"\n        name=\"movie_genre_checkbox[]\"\
    \n        value=\"<?= $genre ?>\"\n    <label class=\"form-check-label\"\n   \
    \     for=\"movie_genre_checkbox_action\"><?= $genre ?></label>\n</div>\n<?php\n\
    }\n?>\n```\n\nThe previous code and markup create a checkbox input for each item\
    \ in our genres array. Every genre checked by the user gets added to the movie_genre_checkbox\
    \ array (note the [] added to the name attribute). Be aware that if the user does\
    \ not select any genre, the movie_genre_checkbox name attribute will not exist\
    \ in the $_POST[] superglobal array."
  merge: -1
  img_proc: true
