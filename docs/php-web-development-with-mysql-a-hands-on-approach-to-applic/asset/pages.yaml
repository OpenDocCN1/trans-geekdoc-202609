- pgno: 440
  md: '# 25. ADDING RESERVATION FEATURES


    Lines 7–12 show the shopping cart icon with a link to `shoppingcart.php`. Also,
    notice the ternary operation that adds a badge with the number of items in the
    cart if `$_SESSION[''cart'']` exists. It is set to a span to the right of the
    shopping cart icon.


    # Add a Script for a Shopping Cart


    Now that we can put movies into a shopping cart, we need to create a web page
    that allows us to manage our cart. We need to be able to remove items from our
    cart and reserve all the movies in our cart.


    Let’s say we have added the outlined movies to our cart as seen on the homepage
    shown in Figure 25.18.


    When we select the shopping cart icon in the upper right of the navbar as in Figure
    25.19, a user should go to a `shoppingcart.php` page that looks like Figure 25.20.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_440_0.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_440_1.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_440_2.png)'
