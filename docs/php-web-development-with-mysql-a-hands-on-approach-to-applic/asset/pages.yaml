- pgno: 381
  md: "# Create Navbar Logic\n\nThen we have a <div> tag with a class set to collapse\
    \ navbar-collapse to group and hide/ collapse menu items. In this <div>, we put\
    \ navbar-nav item links to our home, login, and signup pages. In fact, we already\
    \ have a navigation link to our Home page here. Let's take a closer look at it\
    \ in Listing 24.2.\n\n# Listing 24.2.\n\n```\n<nav ...>\n<!-- ... -->\n<div class=\"\
    collapse navbar-collapse\" id=\"navbarNavAltMarkup\">\n<div class=\"navbar-nav\"\
    >\n<a class=\"nav-item nav-link<?= $page_title == MR_HOME_PAGE ? ' active' : ''\
    \ ?>\" \nhref=\"<?= dirname($_SERVER['PHP_SELF']) ?>\">Home </a>\n</div>\n</div>\n\
    </nav>\n```\n\nTo create a navigation item, you need to create a child <div> tag\
    \ container with the class attribute set to navbar-nav. Next, you create a child\
    \ <a href> link with the class set to nav-item nav-link. However, you will notice\
    \ I added some PHP code with a ternary operator before the href attribute. This\
    \ link is for the home page. However, we want the navigation link for the current\
    \ page we are on to be highlighted (e.g., active):\n\n```\n\"nav-item nav-link<?=\
    \ $page_title == MR_HOME_PAGE ? ' active' : '' ?>\"\n```\n\nIf the home page is\
    \ being displayed (i.e. index.php) the class attribute will be set as:\n\n```\n\
    class=\"nav-item nav-link active\"\n```\n\nOtherwise, it is set as:\n\n```\nclass=\"\
    nav-item nav-link\"\n```\n\nWe use this mechanism for all pages that include navmenu.php\
    \ and have a link to its page.\n\nFor more details, see the documentation on how\
    \ Bootstrap's Navbar[2] works.\n\n[2] Bootstrap's Navbar: https://getbootstrap.com/docs/4.0/components/navbar/"
  merge: -1
  img_proc: true
- pgno: 382
  md: "# Add the Navigation Bar\n\nNow that we have our navmenu.php script, let’s\
