- pgno: 79
  md: "# # Conditional Logic\n\nYou have already seen how the simple if/else statement\
    \ works. Let’s take a look at other ways we can write conditional statements in\
    \ PHP.\n\n# ## if/else if/else\n\nA typical block of if/else statements looks\
    \ like Listing 7.4.\n\n# Listing 7.4.\n\n```\n```php\nif ($age > 18)\n{\n    echo\
    \ 'You can vote';\n}\nelseif ($age > 16)\n{\n    echo 'You can drive';\n}\nelse\n\
    {\n    echo 'Get back to school!';\n}\n```\n```\n\nYou can also embed conditional\
    \ logic directly into your HTML as follows:\n\n```\n```php\n<?php if ($age > 18)\
    \ : ?>\n    <h1>You can vote</h1>\n<?php elseif ($age > 16) : ?>\n    <h1>You\
    \ can drive</h1>\n<?php else : ?>\n    <h1>Get back to school!</h1>\n<?php endif;\
    \ ?>\n```\n```\n\nNote that in the above examples else if can also be substituted\
    \ for elseif[^1] when using curly braces ({}). However, when using a colon (:)\
    \ to define if/elseif conditions, a parse error results if you separate elseif\
    \ into two words (i.e. else if).\n\n[^1]: elseif: http://php.net/control-structures.elseif"
  merge: -1
  img_proc: true
- pgno: 80
  md: "# 7. TRUTH, COMPARISONS, CONDITIONS, AND COMPOUND CONDITIONS\n\n\n\nMost modern\
    \ programming languages have a ternary operator that works essentially like a\
    \ shorthand if/else statement. Suppose you needed a piece of code that held a\
    \ Boolean value indicating if someone was old enough to vote. Listing 7.5 shows\
    \ how you might write it.\n\n```\n1. $able_to_vote = NULL;\n2. if ($age > 18)\
    \ {\n   $able_to_vote = true;\n}\nelse {\n   $able_to_vote = false;\n}\n\n```\n\
    \nA more compact way to write this code would be to use the ternary operator like\
    \ so:\n\n```\n$able_to_vote = ($age > 18) ? true : false;\n```\n\nThe ternary\
    \ operator has a conditional statement in between two parentheses, followed by\
    \ a question mark (?), then the value that will be assigned if the condition is\
    \ true, followed by a colon (:), then a value that will be assigned if the condition\
    \ is false. You typically create a variable and assign the results of the ternary\
    \ operation to the variable. See the Ternary Operator[2] documentation for more\
    \ information.\n\n> [2] Ternary Operator: http://php.net/manual/en/language-operators.php"
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Switch


    Another useful way to write conditional statements are with a switch and several
    case statements. Programmers typically use a switch statement when they have more
    than four conditions they want to check for. Listing 7.6 is an example of how
    you might use a switch and case statements.


    # Listing 7.6.


    ```

    ```php

    1. $hungry_for = ''ice cream''

    2. switch ($hungry_for)

    3. {

    4.     case ''burgers'':

    5.         echo ''The Nitty Gritty on Frances St. is great!'';

    6.         break;

    7.     case ''ice cream'':

    8.         echo ''Get some Babcock Ice Cream at the Memorial Union at UW Madison!'';

    9.         break;

    10.    case ''chocolate'':

    11.        echo ''Gail Ambrosius Chocolatier on Atwood Ave. is my favorite!'';

    12.        break;

    13.    case ''laotian'':

    14.        echo ''Lao Laan Xang on Atwood Ave. is the best!'';

    15.        break;

    16.    default:

    17.        echo ''There are so many great places to eat in Madison!!'';

    18.        break;

    19. }

    ```

    ```


    The switch statement will contain several case statements with each case ending
    in a colon (:). The code statements following the colon (:) will be executed upon
    the case matching the variable specified in the parenthesis following the switch
    up until the first break statement is encountered. Therefore, it is very important
    (in most cases) to have a break statement separating your case statements. Note
    that it is a best practice to always have a default case, even if you do not expect
    your default case to be executed. It can be very helpful in debugging and error
    handling.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Compound Conditional Logic Using Logical Operators


    We can create quite complex conditions by combining them using various logical
    operators.


    # Logical Operators


    PHP defines several logical operators. Here is a table of them:


    | Operator | Example | Meaning | Result |

    |---|---|---|---|

    | && | $a && $b | AND | TRUE if both $a AND $b are TRUE |

    | || | $a || $b | OR | TRUE if either $a OR $b is TRUE |

    | ! | !$a | NOT | TRUE if $a is NOT TRUE |

    | xor | $a xor $b | XOR | TRUE if either $a OR $b is TRUE, but not both. (operates
    at different precedence) |

    | and | $a and $b | AND | TRUE if both $a AND $b are TRUE. (operates at different
    precedence) |

    | or | $a or $b | OR | TRUE if either $a OR $b is TRUE. (operates at different
    precedence) |


    Note that the use of and, or, and xor use a lower order of operator precedence[3]
    than && and ||. I do not recommend using and & or, but prefer && and || for a
    couple of reasons. The first is as mentioned, or & and operate at different precedences
    and would almost always require the use parenthesis for correct use. Second, most
    every modern programming language has standardized on the use of || for logical
    OR and && for logical AND. Regarding xor, it would be nice if ^^ were used as
    a standardized symbol for logical XOR and it operated at the same precedence level
    as && and ||, however most programming languages do not have a logical XOR symbol.
    A good solution to this problem that operates at the same level of precedence
    would be: !$a != !$b


    # Compound Conditional Statements


    The combining of logical operators within conditional statements can be quite
    handy and add to the readability of your code. Consider the problem of executing
    some code only if a number is within a certain range. Suppose we want to assign
    a letter grade of “B” only if a


