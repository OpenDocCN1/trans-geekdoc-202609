    # Compound Assignment operators


    Like many modern programming languages, PHP has compound assignment operators.
    Here are a few examples using the arithmetic compound assignment operators:


    | Compound Assignment | Shorthand for... | Meaning |

    |---|---|---|

    | $a += $b | $a = $a + $b | Addition |

    | $a -= $b | $a = $a - $b | Subtraction |

    | $a *= $b | $a = $a * $b | Multiplication |

    | $a /= $b | $a = $a / $b | Division |

    | $a %= $b | $ = $a % $b | Modulus |


    # Operator Precedence


    In PHP (as in many other programming languages), precedence determines the order
    in which operators are evaluated and their associativity. The following table
    lists the precedence and associativity of all the PHP operators:


    | Operator | Description | Associativity |

    |---|---|---|

    | () | Parentheses | Left to right |

    | new | Creates an object | Non-associative |

    | [] | Array subscript | Right to left |

    | ++ -- | Auto increment, decrement | Non-associative |

    | ! ~ - | Logical not, bitwise not, negation | Non-associative |

    | (int) (float) (string) (array) (object) | Cast | Right |

    | instanceof | Determines if a variable is an instantiated object of some class
    | Left |

    | ! | Not | Non-associative |

    | () | Parentheses | Left to right |'
