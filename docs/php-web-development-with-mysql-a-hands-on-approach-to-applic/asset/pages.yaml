  md: "# 19. WORKING WITH FILES AND FEATURE ADDITIONS TO EXISTING CODE\n\nSince we\
    \ know we are going to return a string containing the path location or an empty\
    \ string if no file was uploaded or there were errors, create a variable called\
    \ $movie_file_path set to an empty string and return it:\n\n```\n```php\nfunction\
    \ addMovieImageFileReturnPathLocation()\n{\n    $movie_file_path = \"\";\n   \
    \ // ...\n    return $movie_file_path;\n}\n```\n```\n\nBefore we move the uploaded\
    \ file, we need to check that the user actually uploaded a file and there are\
    \ no errors. Add the following code after $movie_file_path = \"\":\n\n```\n```php\n\
    $movie_file_path = \"\";\n\n// Check for $_FILES being set and no errors.\nif\
    \ (isset($_FILES) && $_FILES['movie_image_file']['error'] == UPLOAD_ERR_OK)\n\
    {\n    // ...\n}\n```\n```\n\nIf we reach this condition, we can start building\
    \ the path. Add the following code just below the if condition:\n\n```\n```php\n\
    if (isset($_FILES) && $_FILES['movie_image_file']['error'] == UPLOAD_ERR_OK)\n\
    {\n    $movie_file_path = ML_UPLOAD_PATH . $_FILES['movie_image_file']['name'];\n\
    }\n```\n```\n\nNext, we need to move the file from its temporary location on the\
    \ webserver to our images/ folder. We do that using the move_uploaded_file()[4]\
    \ function. This function takes two arguments:\n\n+   1. the first is the source\
    \ path location of the file we want to move,\n+   2. and the second is the destination\
    \ path location of where we want to move the file to\n\n[4] move_uploaded_file():\
    \ https://php.net/move_uploaded_file"
