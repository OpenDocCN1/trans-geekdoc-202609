    \ && !isMovieReservedByUser($row['id'], $_SESSION['user_id']))\n```\n\nWe have\
    \ three conditions to satisfy before displaying the shopping cart link to reserve\
    \ a movie:\n\n+   - Does the logged-in user have user privileges?\n+   - Are the\
