- pgno: 474
  md: "# Encapsulation Using Access Modifiers\n\nSo, what’s the meaning of putting\
    \ private before our properties?\n\nThe keyword private is what’s known as an\
    \ access modifier. PHP calls this “visibility”[2] and uses it to restrict access\
    \ to properties and methods. There are three levels of access to properties and\
    \ methods: private, protected, and public.\n\n+   - `private` means only the code\
    \ within the class can access a property or call a method.\n+   - `protected`\
    \ means only the code within this class or subclasses of it can gain access to\
    \ the property or method.\n+   - `public` means everyone can gain access to the\
    \ property or method.\n\nIn object-oriented programming, it is a best practice\
    \ to restrict access to your properties by making them private. Then, add public\
    \ methods that grant read or write access to these properties. This is the principle\
    \ of encapsulation and is one of the main pillars of OOP.\n\n# Accessor Methods\n\
    \nTo add functionality to our class, we create a method. A method is a fancy OOP\
    \ term we use that means the same thing as a function, except that we are embedding\
    \ our methods inside our class. The OOP idea behind methods is that they manipulate\
    \ or get the data in our class.\n\nIf we want to manipulate the data in our Radio\
    \ class, we need methods to set the data like channel or volume. Likewise, if\
    \ we’re going to retrieve data from our class, we need methods that get this data.\
    \ We typically call these accessor methods getters and setters.\n\nThe convention\
    \ used for creating getters and setters is to put either the word get or set in\
    \ front of our property and capitalize the first letter of each word in the property\
    \ (e.g., “camel case” style. We usually make the getters public, and we often\
    \ make the setters public (see below).\n\n> *Mutability and immutability in class\
    \ design*\n> \n> *Although this is a more advanced topic, you should think about\
    \ how code interacts with objects created from your classes during the object’s\
    \ life. You have the freedom to design a class that allows users of these objects\
    \ to manipulate data within the object throughout the life of the object or only\
    \ upon the creation of the object. This concept is known as*\n\n[2] “visibility”:\
    \ https://www.php.net/language.oop5.visibility"
  merge: -1
  img_proc: true
- pgno: 475
  md: "> the “mutability” of your object. If you create ANY setters in your class\
    \ with public access, your object is known to be mutable (i.e., changeable). Conversely,\
    \ if you create ALL the setters in your class with private—or possibly protected—access,\
    \ your object is known to be immutable (i.e., unchangeable). You might be asking,\
    \ how do you even set the properties of an object if it is immutable? Immutable\
    \ objects must have their properties set upon construction. Further on, I’ll show\
    \ you how to create a constructor. Immutable objects tend to be preferred because\
    \ they’ve been shown to be less error-prone.\n\nSo, to create getters for our\
    \ Radio class we need the following methods:\n\n+   - getPowered()\n+   - getVolume()\n\
    +   - getChannel()\n\nListing 26.1 shows what they should look like.\n\n# Listing\
    \ 26.1.\n\n```\n```php\n<?php\nclass Radio\n{\n    private $powered;  // true\
    \ or false\n    private $volume;   // 0 - 10\n    private $channel;  // 535kHz\
    \ - 1700kHz, 87.5MHz - 108MHz\n\n    // Getters\n    public function getPowered()\n\
    \    {\n        return $this->powered;\n    }\n\n    public function getVolume()\n\
    \    {\n        return $this->volume;\n    }\n\n    public function getChannel()\n\
    \    {\n        return $this->channel;\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 476
  md: "# 26. INTRODUCTION TO OBJECT-ORIENTED PROGRAMMING IN PHP\n\nNote the getters\
    \ have public access so users of our class can retrieve the state of the properties.\
    \ Now let's take a look at the setters (Listing 26.2). Note the setters have public\
    \ access, which means objects created from this class will be mutable.\n\nListing\
    \ 26.2.\n\n```\n<?php\nclass Radio\n{\n    private $powered;    // true or false\n\
    \    private $volume;    // 0 - 10\n    private $channel;   // 535kHz - 1700kHz,\
    \ 87.5MHz - 108MHz\n\n    // ...\n\n    // Setters\n    public function setPowered($powered)\n\
    \    {\n        $this->powered = $powered;\n    }\n\n    public function setVolume($volume)\n\
    \    {\n        $this->volume = $volume;\n    }\n\n    public function setChannel($channel)\n\
    \    {\n        $this->channel = $channel;\n    }\n}\n```\n\n# The $this Variable\n\
    \nIn the above getters and setters, we made a reference to the $this variable:\n\
    \n```\nreturn $this->volume;\n// ...\n$this->volume = $volume;\n```\n\nThe $this\
    \ variable is a built-in variable available to all classes. It refers to the current\
    \ object of the class, or this specific instance of this class. To use a class,\
    \ it has to be “instantiated.” The $this variable refers to just this particular\
    \ instance of the class. -> is the object operator and allows you to reference\
    \ the properties or methods of a class by value. PHP requires using $this-> to\
    \ access these properties or methods, unlike other languages like Java."
  merge: -1
  img_proc: true
- pgno: 477
  md: '# Why Don’t Other Languages Require the $this Keyword?


    Welp, that''s a good question, and it''s something PHP gets right. Other programming
    languages such as Java, C#, and C++ also use the this keyword to refer to class
    instance variables. However, it is not required to use this in these other languages.
    It is meant as a convenience to leave it out. I feel it is a mistake not to require
    the use of the this keyword. Consider the example written in Java from Listing
    26.3.


    # Listing 26.3.


    ```

    ```java

    1. class Radio

    2. {

    3.     private int _volume; // 0 - 10

    4.     ...

    5.     public void setVolume(int volume)

    6.     {

    7.         _volume = volume;

    8.     }

    9.     ...

    10. }

    ```

    ```


    Without requiring the use of the this keyword, we have to make up a scheme for
    how we differentiate instance variables from our local variables. Prefixing instance
    variable names with an underscore (_) is one of the typical ways I''ve seen this
    done.


    The problem with leaving out the this keyword is two-fold. First, we require a
    future developer maintaining this code to know the style of creating instance
    variables is to precede them with an underscore. Second, it''s hard at first glance
    to understand that the variables with underscores are instance variables. All
    developers have to remember not to name local variables starting with an underscore.
    Contrast the previous example with the same Java code rewritten to use the this
    keyword in Listing 26.4.


    # Listing 26.4.


    ```

    ```java

    1. class Radio

    2. {

    3.     private int volume; // 0 - 10

    4.     // ...

    5.     public void setVolume(int volume)

    6.     {

    7.         this.volume = volume;

    8.     }

    9.     // ...

    10. }

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 478
  md: "# 26. INTRODUCTION TO OBJECT-ORIENTED PROGRAMMING IN PHP\n\nThe above example\
    \ is unambiguous and leaves no doubt as to the intent of the code. It does not\
    \ rely on unenforceable naming schemes for instance variables, all to get around\
    \ not having to use the this keyword. You should always use the this keyword when\
    \ directly referencing an instance variable in any programming language. Thank\
    \ goodness PHP makes this a requirement!\n\n# General Purpose Methods\n\nIn addition\
    \ to getters and setters, your class can include utility methods to perform various\
    \ tasks. For example, many radios have a scan button to look for the next channel\
    \ with a strong signal. These methods don't have to change your object state (i.e.,\
    \ modify properties) but they may calculate or perform some operation based on\
    \ your properties as in Listing 26.5.\n\n# Listing 26.5.\n\n```\n```php\nclass\
    \ Radio\n{\n  public function scanChannels()\n  {\n    // find the next channel\
    \ with a strong signal\n  }\n\n  public function getCurrentSong()\n  {\n    //\
    \ reads live metadata from current channel about current song\n    // being played\
    \ and returns song title, etc...\n  }\n}\n```\n```\n\n# Instantiating and Using\
    \ a Class\n\nInstantiating classes as objects and creating multiple instances\
    \ of that class demonstrates another powerful concept of OOP. In the same way,\
    \ you can have multiple variables that are strings, integers, etc., a class is\
    \ another more complex data type that you can use in this way.\n\nTo use our class,\
    \ we first need to include it in a PHP script:\n\n```\n```php\nrequire_once('Radio.php');\n\
    ```\n```\n\nTo instantiate or create a new instance of our class we have to use\
    \ the new keyword:\n\n```\n```php\nrequire_once('Radio.php');\n\n$car_radio =\
    \ new Radio();\n```\n```"
  merge: -1
  img_proc: true
- pgno: 479
