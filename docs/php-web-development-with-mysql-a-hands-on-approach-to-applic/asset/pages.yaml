    ```


    We only want to display the details of the selected movie if the user navigated
    from one of the movie title links instead of just typing moviedetails.php into
    the URL navigation bar (Figure 15.16).


    Figure 15.17 shows the incorrect navigation from Movie Listing to Movie Details.


    If a user does incorrectly navigate by typing moviedetails.php into the URL navigation
    bar, we want to display Figure 15.18.


    Therefore, we need to add an if condition that checks that we received and set
    the query parameter.


    Before we do that, an understanding of the $_GET[] super global variable is needed.


    # Super Global $_GET


    Similar to a $_POST[], $_GET[] is a superglobal array variable that holds either
    form data when sent from a form or query parameters embedded as data in a URL.


    When sending a GET request from a form, the data is automatically sent and accessed
    using the name attributes as indexed keys into the array.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_170_0.png)


