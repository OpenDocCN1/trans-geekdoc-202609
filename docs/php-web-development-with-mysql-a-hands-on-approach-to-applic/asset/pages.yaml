- pgno: 298
  md: '# 20. BASIC HTTP AUTHENTICATION


    Currently, our *MovieListing* application has no protection from someone simply
    deleting all of our movies in our database or adding movie entries that we might
    not approve of.


    In this chapter, we implement basic HTTP authentication that adds a level of protection
    for features of our application we do not want to expose to everyone.


    In a follow-on chapter covering Security, I will discuss authentication and authorization
    further. Basic HTTP Authentication is a simple way to control who can use particular
    web pages.


    The question is, what features do we want to require authentication for? Given
    that our application allows anyone to access the whole website, we need to add
    basic authentication to any feature that modifies or deletes data from the application.
    This limits who can change the database to trusted users who know a valid username
    and password combination. Therefore we will require authentication to:


    +   - `addmovie.php`

    +   - `removemovie.php`

    +   - `editmovie.php`


    # Password Protection with HTTP Authentication


    Users should be able to add a movie by clicking on the link shown in Figure 20.1,
    remove a movie (Figure 20.2), or edit movie details via the link in Figure 20.3.
    Before carrying out any of these operations, we want to display the authorization
    dialog shown in Figure 20.4, or something similar, to verify their identity. The
    exact dialog you see varies depending on your browser and operating system.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_298_0.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_298_1.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_298_2.png)'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# # How Does HTTP Authentication Work?


    This dialog continues to pop up as long as the user enters the incorrect credentials.
    A user can add, edit, or remove movie details only if they sign in with the correct
    credentials.


    If the user presses Cancel, the message in Figure 20.5 shows on the page.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_299_0.png)


    # # How Does HTTP Authentication Work?


    HTTP Authentication is sent using HTTP headers. Every time a user requests a webpage,
    headers to verify the user''s identity are sent from the server to the client
    before returning any HTML. You should be aware that while you can use basic authentication
    with HTTP, the username and password are not encrypted and can be intercepted.
    If you must use basic authentication, make sure you''re using HTTPS on your live
    site.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_299_1.png)


    Headers control how and what kind of information passes between the client and
    the server. Headers usually (but not always) consist of a name/value pair separated
    by a colon (:).


    > > NOTE: For more information on HTTP Request and Response Headers, please see
    Chapter 1: HTTP Request/Response


    In PHP, we use the header() function to create HTTP headers and send them from
    a script.


    Because headers must be sent before any HTML markup, it must be the first thing
    in your PHP code. There cannot be any blank lines before the <?php tag. Also,
    any other file you’ve included or required before the header() call must not send
    any output to the browser.


    ```

    [1] header(): https://php.net/header

    ```'
