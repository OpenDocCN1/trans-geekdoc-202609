  md: '# Persisting Movie Reservations for Users


    Now that we can track the number of movies available and reserved, we have to
    add a table to the Movie database that tracks all movies reserved by a user. Therefore,
    we need a table that represents a many-to-many[1] relationship between users and
    movies, otherwise known as a “join” table.


    A join table involves common fields, typically the ID fields, from two or more
    tables. These fields are set as foreign keys to the selected rows in the table
    they represent. In this case, we want to relate the user table to the movieListing
    table, and we want this relationship to represent a reservation. Foreign keys
    are usually named using the table field name concatenated with the table’s primary
    key name. Therefore, if we create a table named reservation with the usual primary
    key set to id, it has the following foreign keys:


    | Field Name | Purpose |

    |---|---|

    | id | Primary Key |

    | user_id | Foreign Key |

    | movieListing_id | Foreign Key |


    In Adminer (Figure 25.9) create a table called reservation in the Movie database
    with the following attributes:


    | Column Name | Type | Length | Auto Increment |

    |---|---|---|---|

    | id | int | 11 | Yes |

    | user_id | int | 11 | No |

    | movieListing_id | int | 11 | No |


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_417_0.png)


    [1] many-to-many: https://phpa.me/sql-many-to-many'
