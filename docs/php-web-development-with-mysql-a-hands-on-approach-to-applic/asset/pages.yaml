- pgno: 64
  md: '# 6. ARRAYS


    When we have data that logically relate to each other, we often want to group
    that data together into a single data structure to contain them. The most basic
    data structure for gathering a collection of related information is an array.


    An array in PHP is an ordered map that associates values to keys. Arrays in PHP
    can be represented using either integer or string keys that match an associated
    value.


    # Simple Arrays in PHP


    A simple array uses integers as keys, typically starting from 0 and going to n-1
    (where n is the number of elements in an array). This implementation is similar
    to how arrays are accessed in other programming languages. These are called “numeric”
    or “indexed” arrays.


    # Creating


    Here is how you create a numeric array in PHP:


    ```

    $us_states = array(); // Empty array


    // Populated array

    $us_states = array("California", "Florida", "Wisconsin");

    ```


    # Short Array Syntax


    Prior to version 5.4 of PHP, programmers had to create arrays using the array()
    function. Version 5.4 introduced short array syntax, which allows you to create
    arrays using square brackets ([ & ]). Here is how to create the above arrays using
    the short array syntax:


    ```

    $us_states = []; // Empty array (short array syntax)


    // Populated array (short array syntax)

    $us_states = ["California", "Florida", "Wisconsin"];

    ```


    # Accessing Single Elements


    Using $us_states as an example, we can access our array’s individual values through
    the numeric keys. The indexed keys for our numeric array will start at zero (0),
    and we access the corresponding values by placing the key in between a set of
    square brackets ([ & ]) following the variable name of our array:


    ```

    echo "Sacramento is the capital of $us_states[0].<br/>";

    echo "Tallahassee is the capital of $us_states[1].<br/>";

    echo "Madison is the capital of $us_states[2].";

    ```'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Associative Arrays\n\nAn associative array uses a string as a key connected\
    \ with a value in an array.\n\n# Enumerated Versus Associative\n\nAssociative\
    \ arrays are great to use because they allow the developer to associate a meaningful\
    \ word as a key to a value instead of relying on an arbitrary numeric value that\
    \ typically has no significant association to the value it is mapped to.\n\n#\
    \ Creating\n\nThe syntax for creating an associative array in PHP is a little\
    \ different because it requires that you specify both the key and it's associated\
    \ value upon creation of the element pair. The key and it's value are separated\
    \ by the => operator (sometimes called the “rocket” operator):\n\n```\n$us_state_capitals\
    \ = array(\n  \"California\" => \"Sacramento\",\n  \"Florida\" => \"Tallahassee\"\
    ,\n  \"Wisconsin\" => \"Madison\"\n);\n```\n\n# Short Array Syntax\n\nHere is\
    \ how to create the above arrays using short array syntax:\n\n```\n$us_state_capitals\
    \ = [\n  \"California\" => \"Sacramento\",\n  \"Florida\" => \"Tallahassee\",\n\
    \  \"Wisconsin\" => \"Madison\"\n];\n```\n\n# Accessing Single Elements\n\nUsing\
    \ $us_state_capitals as an example, we can access individual values of our array\
    \ through the associated keys. Like the numeric array, values are accessed by\
    \ specifying the key in between a set of square brackets ([ & ]) following the\
    \ variable name of our array:\n\n```\necho \"The capital of California is {$us_state_capitals['California']}.<br/>\"\
    ;\necho \"The capital of Florida is {$us_state_capitals['Florida']}.<br/>\";\n\
    echo \"The capital of Wisconsin is {$us_state_capitals['Wisconsin']}.<br/>\";\n\
    ```"
  merge: -1
