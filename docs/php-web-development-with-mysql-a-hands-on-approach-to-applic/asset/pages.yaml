  md: '# INTRODUCTION


    was released in the middle of 1999. The official release of PHP 4 occurred in
    May of 2000 and added support for more web servers and session management.


    In July of 2004, PHP 5 was released was powered by the "Zend Engine 2.0." This
    release included improvements for OOP, PHP Data Objects (PDO - which defines connections
    and interactions with databases), and other features.


    In December of 2015, the PHP development team released version 7.0 of PHP[2].
    This release improved the performance of PHP applications up to twice as fast
    as version 5.6. It also included a number of security enhancements and improved
    Exception handling.


    PHP 8.0[3] was released in November of 2020. It further enhances the language’s
    type hinting system and adds named arguments while making the language more consistent
    and performant. Like previous releases, the core contributors have worked to minimize
    the impact of backward-incompatible changes such that upgrading from PHP 7 is
    not a monumental undertaking for most code bases.


    # An Even Briefer History of PHP


    +   - June 8, 1995 PHP 1.0 is posted to the usenet group comp.infosystems.www.authoring.cgi

    +   - It was created by Rasmus Lerdorf[4] as PHP Tools

    +   - Then Rasmus set to work integrating his tools with the Apache web server,
    and less than a year later, PHP 2.0 was posted to the same Usenet group

    +   - PHP originally stood for “Personal Home Pages.”

    +   - PHP now stands for “PHP Hypertext Preprocessor” (a recursive acronym)

    +   - It is most likely the fastest and simplest tool available for creating database-enabled
    websites

    +   - It will work with any UNIX-based web server on every UNIX flavor out there.
    The package is completely free of charge for all uses, including commercial


    Here is how Rasmus described PHP at the time:


    > *PHP/FI is a server-side HTML embedded scripting language. It has built-in access
    logging and access restriction features and also support for embedded SQL queries
    to mSQL and/or Postgres95 backend databases.*


