    # Hello World!


    Now that we have our development environment installed and configured, we can
    write our first PHP program! First, since the root user is the owner of the /var/www/html
    directory, change the group privileges and access rights on it so that our user
    can create and modify files in it.


    In the terminal window, navigate to the /var/www directory and change the group
    privileges and access rights on the html directory as a superuser by typing the
    following commands. Make sure you change the username to yours.


    ```

    cd /var/www

    sudo chgrp kmarks html/

    sudo chmod 775 html/

