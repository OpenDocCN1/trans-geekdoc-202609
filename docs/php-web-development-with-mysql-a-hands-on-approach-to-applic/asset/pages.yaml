- pgno: 88
  md: "# Verifying and Checking Variable Types\n\nSince PHP is a dynamically typed\
    \ language, you might also want to use some of the built-in functions[^3] to verify\
    \ the types of PHP variables:\n\n| Function | Type Checked | Explanation |\n|---|---|---|\n\
    | `is_bool()` | boolean | returns true if parameter is a boolean |\n| `is_int()`\
    \ | integer | returns true if parameter is an integer |\n| `is_float()` | float\
    \ | returns true if parameter is a float |\n| `is_string()` | string | returns\
    \ true if parameter is a string |\n| `is_scalar()` | scalar data types | returns\
    \ true if parameter is a scalar type, any of the above |\n\nListing 8.2 shows\
    \ how to check for types.\n\nListing 8.2.\n\n```\n```php\n<?php\n$bool_value =\
    \ false;\n$int_value = 42;\n$float_value = 37.4;\n$string_value = \"The answer\
    \ to life, the universe, and everything\";\n\nif (is_bool($bool_value))\n{\n \
    \   echo '$bool_value IS a boolean data type<br/>';\n}\n\nif (is_int($int_value))\n\
