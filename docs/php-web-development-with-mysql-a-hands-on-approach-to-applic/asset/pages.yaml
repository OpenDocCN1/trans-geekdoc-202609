- pgno: 314
  md: "# Session Variables\n\nSession variables also allow the persistence of small\
    \ pieces of data. However, instead of storing them on the client's browser, they\
    \ are stored on the server, giving them an added security benefit in preventing\
    \ users from altering the data. They are also not limited to storing string data.\
    \ You can persist arrays, variables, and serializable objects, and the PHP interpreter\
    \ automatically converts them between scripts. However, session variables only\
    \ last as long as the current web browsing session. In other words, the session\
    \ ends when the user closes the browser. When the session ends, the $_SESSION\
    \ variables are destroyed.\n\nTo use session variables, you must indicate when\
    \ your session starts by using the function session_start()[3]:\n\n```\nsession_start();\n\
    ```\n\nWhen first calling session_start(), there is no data saved. It only indicates\
    \ that the PHP interpreter can start storing and accessing session variables and\
    \ internally sets a unique identifier for this session. The web browser and our\
    \ application use this unique identifier to associate a session with multiple\
    \ web pages.\n\nThe session identifier is not destroyed until the session is closed.\
    \ This happens when the web browser is closed or when you call the session_destroy()\
    \ function:\n\n```\nsession_destroy();\n```\n\nIf you close a session yourself\
    \ by using the session_destroy()[4] function, it does not delete the session variables.\
    \ Instead, it only ends the session.\n\nTo create session variables, you use the\
    \ $_SESSION[] superglobal:\n\n```\n$_SESSION['user_name'] = 'kenmarks';\n```\n\
    \nYou use the session variable by accessing the $_SESSION superglobal[5] using\
    \ the assigned index to retrieve it's value:\n\n```\n<p class=\"login\">You are\
    \ logged in as <?= $_SESSION['user_name'] ?>.</p>; \n```\n\n[3] session_start():\
    \ https://php.net/session_start\n[4] session_destroy(): https://php.net/session_destroy\n\
    [5] $_SESSION superglobal: https://php.net/reserved.variables.session"
  merge: -1
  img_proc: true
- pgno: 315
  md: "There are a few interesting things about using session variables. First, you\
    \ must call the session_start() before creating and accessing session variables.\
    \ Second, when hyperlinking from one page to another (or to the same page), you\
    \ must remember that the web is stateless. To access any session variables you\
    \ have created, you must call the session_start() function again.\n\n> The naming\
    \ of session_start() is unfortunate. When developers first learn how to use session\
    \ variables in PHP, they often assume that once they call session_start(), they\
    \ do not need to call it again—even though the web is stateless. They wonder why\
    \ they do not have access to their session variables in subsequent requests. A\
    \ more accurate name for this function might be: session_start_or_resume().\n\n\
    Third, as mentioned above, calling session_destroy() only ends the session but\
    \ does not delete the session variables. Until the user closes their browser and\
    \ PHP’s session garbage collector deletes expired session data, you can’t depend\
    \ on any data being deleted. To ensure session variables are deleted, set the\
    \ $_SESSION[] superglobal to an empty array right after you destroy the session:\n\
    \n```\nsession_destroy();\n$_SESSION = []; // Destroy all session variables in\
    \ the current session\n```\n\n# A Session Example\n\nTo show how to use sessions,\
    \ let’s rewrite our favorite cookie application to use session variables instead\
    \ of cookies.\n\nCopy cookies.php and name it sessionvariables.php. Change the\
    \ content in the <title> element within the <head> element section and the <h1>\
    \ content within the <body> element section from Using Cookies to Using Session\
    \ Variables:\n\nAdd a call to start_session() at the top of the script. You should\
    \ call this function early and before sending any HTML output to prevent web server\
    \ warnings.\n\n```\n<?php\n    session_start(); // Start or resume the current\
    \ session so we can access session variables\n?>\n\n<title>Using Session Variables</title>\n\
    \n    <h1>Using Session Variables</h1>\n```"
