- pgno: 15
  md: '# About the Author


    Ken Marks has been working in his dream job as a Programming Instructor at Madison
    College in Madison, Wisconsin, teaching PHP web development using MySQL since
    2012. Prior to teaching, Ken worked as a software engineer for more than 20 years,
    mainly developing medical device software.


    Ken earned his Bachelors of Science in Computer Science from California State
    University at Fullerton and earned his Masters of Science in Adult Education from
    the University of Wisconsin at Platteville.


    Ken is actively involved in the PHP community, speaking and teaching at conferences.


    In his spare time, he’s a man of many hobbies such as 3D printing, board game
    development, Ham radio, Fly fishing, and of course, Coffee Roasting :-)


    Ken has two grown daughters and lives in the Madison area with his wife and their
    cat Ophelia who thinks she’s a dog.


