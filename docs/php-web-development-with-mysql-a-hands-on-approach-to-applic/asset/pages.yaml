- pgno: 83
  md: "# Compound Conditional Logic Using Logical Operators\n\nstudent gets a score\
    \ of between 80 and 90 (inclusive) on a test. We might solve this problem with\
    \ the code in Listing 7.7.\n\n# Listing 7.7.\n\n```\n1. $letter_grade = NULL;\n\
    2.\n3. if ($score >= 80)\n4. {\n5.   if ($score <= 90)\n6.   {\n7.     $letter_grade\
    \ = 'B';\n8.   }\n9. }\n```\n\nA better, and more readable solution, would be\
    \ to use the logical operator && to eliminate the interior if:\n\n```\n$letter_grade\
    \ = NULL;\n\nif ($score >= 80 && $score <= 90)\n{\n    $letter_grade = 'B';\n\
    }\n```\n\nUsing logical AND to create compound conditional statements is often\
    \ used when matching inclusive range values. Conversely, the use of logical OR\
    \ is used in a compound conditional statement when you want to exclude a certain\
    \ range. Consider the problem of applying a ten percent discount for people that\
    \ are either children or senior citizens. For this example let's arbitrarily say\
    \ someone is a child if they are under 18 years old and a senior citizen if they\
    \ are 55 years or older:\n\n```\n$child_or_senior_discount_applies = false;\n\n\
    if ($age < 18 || $age >= 55)\n{\n    $child_or_senior_discount_applies = true;\n\
    }\n```"
  merge: -1
  img_proc: true
