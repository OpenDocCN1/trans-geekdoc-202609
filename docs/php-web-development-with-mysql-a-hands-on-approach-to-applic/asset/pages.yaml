    We obviously need to parameterize every incoming parameter which we do on lines
    6,7, and 14–17. The only other line that needs explanation is line 19:


    ```

    $rows_affected = $query->rowCount();

    ```


    Since we are only updating a single row in the student table, rowCount() returns
    1 if the row was successfully updated. If the ID is not found, 0 is returned.
    We return this value to the caller of update() so they know if the update was
    successful or not.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_503_0.png)


