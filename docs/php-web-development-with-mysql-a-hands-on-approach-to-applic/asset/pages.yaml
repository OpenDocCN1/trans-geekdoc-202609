  md: "# 26. INTRODUCTION TO OBJECT-ORIENTED PROGRAMMING IN PHP\n\nPDO is the library\
    \ of choice for interacting with databases, primarily because it works with many\
    \ different database technologies. This library gives us a familiar API no matter\
    \ where we store our data.\n\nFirst, we need to create a database and a simple\
    \ table we can work on. I'll make a simple database called Student and a table\
    \ called student used to hold a student's first name, last name, and email address\
    \ for this demonstration as shown in Figure 26.5\n\nA common way to use PDO is\
    \ to create a class known as a CRUD wrapper that manages all queries to a database\
    \ table. CRUD stands for Create, Read, Update, and Delete, which are the common\
    \ operations we perform on database tables. It is a good practice to name our\
    \ classes using a “Studly Caps” interpolation of our database table and concatenate\
    \ the word “Manager” onto the end of our class. In this case, we should name our\
    \ class StudentManager since our table is called student.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_494_0.png)\n\
    \n# Using PDO to Create New Database Entries\n\nListing 26.22 is the class along\
    \ with a create() method to insert rows into our student table.\n\n# Listing 26.22.\n\
    \n```\n```php\n1. <?php\n2. \n3. class StudentManager\n4. {\n5.     // Database\
    \ connection constants\n6.     private const DB_TECHNOLOGY = \"mysql\";\n7.  \
    \   private const DB_HOST = \"localhost\";\n8.     private const DB_NAME = \"\
    Student\";\n9.     private const DB_USER = \"testuser\";\n10.    private const\
    \ DB_PASSWORD = \"testuser\";\n11. ```\n```"
