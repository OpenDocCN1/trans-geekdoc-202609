  md: '# 23. ADDING USER LOGINS


    # Create a parameterizedQuery() Function


    Let’s take a slight detour and create a function we can use to parameterize all
    our inputs to our database queries. This function safeguards our SQL queries by
    using prepared statements. Create a new script called `queryutils.php` we can
    include in our scripts where we will need to query the database.


    First, we need to identify all the PHP functions and their input parameters to
    parameterize our queries. They would be:


    | Function | Parameters | Return | Reference |

    |---|---|---|---|

    | `mysqli_prepare()` | connection, string query | statement | https://php.net/mysqli.prepare
    |

    | `mysqli_stmt_bind_param()` | statement, string data types, variables (specified
    by their types) | true or false | https://php.net/mysqli-stmt.bind-param |

    | `mysqli_stmt_execute()` | statement | true or false | https://php.net/mysqli-stmt.execute
    |

    | `mysqli_stmt_get_result()` | statement | true or false | https://php.net/mysqli-stmt.get-result
    |

    | `mysqli_errno()` | connection | error code | https://php.net/mysqli.errno |


    Another thing to consider when creating queries is that we can have a varying
    number of query parameters that need to be parameterized. A cool thing about PHP
    is that we can create functions that take a variable number of parameters by preceding
    the last variable in an argument list with .... See the online documentation for
    more information on variable length parameters[4].


    Whenever you create a function, it is a good practice to have a function header
    that describes the function, any input parameters, and any return values. It serves
    as excellent documentation on how to use your function, primarily if you use DocBlocks[5]
    to describe the parameters and return values. Keep in mind that you must update
    this comment if you change the parameters to your function or how it works.


    > Another option afforded by PHP 7 is to use scalar and class type hints to indicate
    what kinds of arguments your function expects and what values it returns.


    [4] variable length parameters: https://php.net/functions.arguments.php#functions.variable-arg-list

    [5] DocBlocks: https://docs.phpdoc.org/3.0/guide/guides/docblocks.html'
