- pgno: 54
  md: '# Concatenation


    In PHP, strings can be joined together by concatenating them using the dot (.)
    operator:


    ```

    $name = "Fred Flintstone";

    echo "Hello " . $name . " !";

    ```


    This outputs:


    ```

    Hello Fred Flintstone!

    ```


    You can also successively concatenate onto a string variable using the compound
    assignment operator .=:


    ```

    $some_fruit = "apple";

    $some_fruit .= ", orange";

    $some_fruit .= ", banana";

    echo "Here are some fruit: " . $some_fruit . ".";

    ```


    This outputs:


    ```

    Here are some fruit: apple, orange, banana.

    ```


    # Interpolation


    In PHP, when a variable is contained within a string using double-quotes (") ,
    the variable''s contents are interpolated, which outputs the value of the variable
    within the string. An example would be helpful:


    ```

    $name = "Fred Flintstone";

    echo "Hello $name, how are you today?";

    ```


    This outputs:


    ```

    Hello Fred Flintstone, how are you today?

    ```


    However, variable interpolation does not work within a string defined by single-quotes
    (''). Whatever is contained in between the single-quotes is literally output to
    the web page:


    ```

    $name = "Fred Flintstone";

    echo ''Hello $name, how are you today?'';

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'This outputs:


    ```

    Hello $name, how are you today?

    ```


    # Escaping


    Strings can be contained in either double-quotes (") or single-quotes (''). To
    use a literal '' in a string with single-quotes, you must escape it using the
    backslash \ character:


    ```

    echo ''You\''re an awesome programmer!'';

    ```


    This outputs:


    ```

    You''re an awesome programmer!

    ```


    To use a literal " in a string with double-quotes, you have to escape it as well
    (using the \):


    ```

    echo "A famous programmer, Olav Mjelde said, \"They don''t make bugs like Bunny
    anymore.\"";

    ```


    This outputs:


    ```

    A famous programmer, Olav Mjelde said, "They don''t make bugs like Bunny anymore."

    ```


    Note that strings contained in double-quotes can contain single-quotes without
    escaping them. Likewise, strings contained in single-quotes can contain double-quotes
    without escaping the latter:


    ```

    echo ''Jane said, "Hi John!"<br/>'';

    echo "John said, ''Hi Jane!''";

    ```


    This code outputs:


    ```

    Jane said, "Hi John!"

    John said, ''Hi Jane!''

    ```


    See the online docs for more on single-quoted strings[^1] and on double-quoted
    strings and string escape characters[^2].


    [1] single-quoted strings: http://phpa.me/php-single-strings

    [2] string escape characters: http://php.net/language.types.string.php#language.types.string.syntax.double'
