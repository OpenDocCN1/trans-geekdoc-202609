  md: "# 22. CREATING SECURE WEB APPLICATIONS\n\nOne thing to note is that passwords\
    \ are truncated to 72 characters if they are over 72 characters in length. Another\
    \ thing is that the current default length of a hashed password using password_hash()\
    \ is 60 characters in length. Therefore, when storing hashed passwords in a database,\
    \ make this field a VARCHAR(255) to account for updates to the encryption algorithms\
    \ available in these functions.\n\nWhen authenticating a user logging in with\
    \ their password, use the password_verify()[5] function. This function takes two\
    \ arguments, the first is the user-entered password, and the second is the hashed\
    \ password you retrieve from the database. The function returns true if the password\
    \ is verified—you've successfully authenticated the user. Otherwise, it returns\
    \ false.\n\n```\nif (password_verify($password, $salted_hashed_password))\n{\n\
    \    echo \"You're Legit!\";\n}\n```\n\n# Guarding Against SQL Injection\n\nSQL\
    \ injection is the number one security risk for web applications and is listed\
    \ as the number one ASR from the “OWASP Top Ten.” An SQL injection attack inserts\
    \ data directly into an SQL query without first sanitizing the input. Therefore,\
    \ any source of data passed to a query can be a vector of attack and must be appropriately\
    \ escaped. However, for this discussion, I focus on form field data as an attack\
    \ vector into our web application and how to prevent it.\n\n# What a SQL Injection\
    \ Attack Looks Like\n\nAll the code we have written so far has been vulnerable\
    \ to SQL injection. Let’s look at an example of how bad this can be. Let’s say\
    \ I have an ecommerce application with a page that allows users to browse the\
    \ inventory of stuff I’m selling as in Figure 22.4.\n\nAs we can see, if a user\
