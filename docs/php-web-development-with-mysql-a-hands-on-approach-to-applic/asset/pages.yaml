  md: "# 19. WORKING WITH FILES AND FEATURE ADDITIONS TO EXISTING CODE\n\nNext, we\
    \ have to do three more things before updating the database:\n\n+   1. Move the\
    \ image file to the images/ folder and get the path location by calling addMovieImageFileReturnPathLocation().\n\
    +   2. Remove the old image file from the images/ folder if there was a previously\
    \ set image by calling removeMovieImageFile().\n+   3. Update the query to the\
    \ database to update the image_file field in the movieListing database table.\n\
    \n```\n$movie_image_file_path = addMovieImageFileReturnPathLocation();\n```\n\n\
    ```\n// IF new image selected, set it to be updated in the database.\nif (!empty($movie_image_file_path))\n\
    {\n    // IF replacing an image (other than the default), remove it\n    if (!empty($movie_image_file))\n\
    \    {\n        removeMovieImageFile($movie_image_file);\n    }\n    $movie_image_file\
    \ = $movie_image_file_path;\n}\n```\n\n```\n$query = \"UPDATE movieListing SET\
    \ title = '$movie_title', rating = '$movie_rating', \"\n    . \"director = '$movie_director',\
    \ running_time_in_minutes = '$movie_runtime', \"\n    . \"genre = '$movie_genre_text',\
    \ image_file = '$movie_image_file' \"\n    . \"WHERE id = $id_to_update\";\n```\n\
    \nThe complete code block looks like Listing 19.30.\n\n# Listing 19.30.\n\n```\n\
    if (empty($file_error_message))\n{\n    $movie_image_file_path = addMovieImageFileReturnPathLocation();\n\
    \n    // IF new image selected, set it to be updated in the database.\n    if\
