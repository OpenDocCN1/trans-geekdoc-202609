- pgno: 493
  md: "We saw this above. In constructor property promotion, we can rewrite the same\
    \ code as in Listing 26.21 with fewer boilerplate lines of code.\n\n# Listing\
    \ 26.21.\n\n```\n```php\n<?php\nclass Student\n{\n    // Constructor\n    public\
    \ function __construct(\n        private $id,\n        private $name,\n      \
    \  private $email)\n    {\n    }\n    // ...\n}\n```\n```\n\nAs long as there\
    \ is an access modifier (private, protected, or public) preceding the variable\
    \ in the constructor's parameter list, PHP will create the properties under the\
    \ hood, and assign the values passed into the parameter list. You can still directly\
    \ access the properties in the class using the this keyword.\n\nDetails are buried\
    \ in the PHP manual section on constructors[9]. For in-depth information, you\
    \ can refer to the Request for Comments (RFC) for constructor property promotion[10]\
    \ that was approved for PHP 8 on the PHP manual Wiki if you'd like to know more.\n\
    \n# Creating Parameterized Queries Using OOP\n\nBack in Chapter 23: Prepared Statements,\
    \ I showed you how to create more secure parameterized database queries by using\
    \ the procedural functions mysqli_prepare(), mysqli_stmt_bind_param(), mysqli_stmt_execute(),\
    \ and mysqli_stmt_get_result(). However, there is an object-oriented way to parameterize\
    \ your database queries with less code using PHP Data Objects[11] (PDO). I'll\
    \ demonstrate how to use PDO by creating a simple database table and a class that\
    \ manages our data in and out of the table to implement the PDO functionality.\n\
    \n[9] constructors: https://php.net/language.oop5.decon.constructor.promotion\n\
    [10] constructor property promotion: https://wiki.php.net/rfc/constructor_promotion\n\
    [11] PHP Data Objects: https://php.net/book.pdo"
