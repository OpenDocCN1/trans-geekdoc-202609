- pgno: 300
  md: "# 20. BASIC HTTP AUTHENTICATION\n\n# Headers Required for Authentication\n\n\
    As long as the password and username are incorrect or missing, our script sends\
    \ these two headers:\n\n```\nheader('HTTP/1.1 401 Unauthorized');\nheader('WWW-Authenticate:\
    \ Basic realm=\"Movies I Like\"');\n```\n\n> Note that the Basic realm is used\
    \ to identify this authentication. Thus, it is possible to protect different web\
    \ pages with separate credentials as long as the Basic realm is set differently.\
    \ You can use whatever text you want here, but make sure it's clear to the user.\n\
    > \n> That said, once a page has been successfully authenticated, any other web\
    \ page in the application that uses the same Basic realm will be automatically\
    \ authenticated and not require re-credentialing.\n\n# Credentials in $_SERVER\
    \ Superglobal\n\nWhen the user enters their username and password into the authentication\
    \ request dialog, the browser sends the credentials to your PHP script. They're\
    \ parsed and added to the superglobal variable $_SERVER (Figure 20.6). Our code\
    \ then uses these values to validate the credentials:\n\n+   - The username is\
    \ held in\n+     $_SERVER['PHP_AUTH_USER']\n+   - The password is in\n+     $_SERVER['PHP_AUTH_PW']\n\
    \n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_300_0.png)\n\n# Create authorizeaccess.php\n\
    \nSince we will only use one Basic realm, it makes sense to create a single PHP\
    \ script that will handle our authorization. Therefore, we will create a script\
    \ called authorizeaccess.php.\n\nSince HTTP authentication is sent over in a Header,\
    \ we need to make sure we have no blank lines before sending the authorization\
    \ headers. So make sure your opening <?php script tag is at the top of your script\
    \ and flush to the left margin:\n\n```\n<?php\n```"
  merge: -1
  img_proc: true
