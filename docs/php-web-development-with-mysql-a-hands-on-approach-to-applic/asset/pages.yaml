  md: "# Anticipating Paths to the Edit Page\n\nThere are two expected ways and various\
    \ unanticipated ways to navigate to the editmovie.php script. The first expected\
    \ way is for the user to select the “edit it” link on the “Movie Details” page\
    \ as in Figure 18.4.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_215_0.png)\n\n\
    Doing so sends a single query parameter contained in the id_to_edit element of\
    \ the $_GET super global variable.\n\nThe second expected way is when the user\
    \ selects “Update Movie.” When the user successfully enters the required data\
    \ in the form fields and submits the form, we will want to update the data for\
    \ this movie in the movieListing table of the Movie database. You can find the\
    \ submitted form fields in the $_POST super global variable.\n\nAll other mechanisms\
    \ are unanticipated. So this essentially gives us three choices we are looking\
    \ for. Therefore, the best way to deal with these three choices is to create an\
    \ if/elseif/else block of code structure in Listing 18.2.\n\n# Listing 18.2.\n\
    \n```\n$dbc = mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD, DB_NAME)\n    or trigger_error(\n\
    \        'Error connecting to MySQL server for ' . DB_NAME,\n        E_USER_ERROR\n\
    \    );\n\nif (isset($_GET['id_to_edit']))\n{\n    // ...\n}\nelseif (isset($_POST['edit_movie_submission'],\
    \ $_POST['movie_title'],\n        $_POST['movie_rating'], $_POST['movie_director'],\n\
    \        $_POST['movie_running_time_in_minutes']))\n{\n    // ...\n}\nelse //\
    \ Unintended page link\n{\n    // ...\n}\n```\n\n> In the elseif block of code\
    \ above: even though we are validating the field inputs on the client-side, it\
    \ is still important to validate the field inputs on the server-side."
  merge: -1
  img_proc: true
- pgno: 216
  md: '# 18. EDITING DATA USING THE WEB APPLICATION


    # Direct Navigation


    The first intended way we will navigate to the editmovie.php script is when the
    user selects the “edit it” link on the moviedetails.php page. The link causes
    an HTTP GET to be sent to the editmovie.php script with the query parameter in
    the $_GET superglobal variable. We deal with this in the first if block:


    ```

    if (isset($_GET[''id_to_edit'']))

    {

    ```


    When we get to this condition, the primary key of the movie we want to edit is
    referenced by the id_to_edit query parameter.


    Take a look at the form shown in Figure 18.5.


    You will notice that the fields are pre-populated with the movie details. To do
    this, we need to query the movieListing table for the movie details before displaying
    the form.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_216_0.png)


    Notice, in Figure 18.6, that the “Genre” checkboxes are correctly selected with
    the set movie genres.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_216_1.png)


    In order to display the checkboxes for “Genre”—just as in the addmovie.php script—we
    need an array to hold the names of each genre. Just above the if block, but right
    after the mysqli_connect() function call, add the $genres array from Listing 18.3.'
