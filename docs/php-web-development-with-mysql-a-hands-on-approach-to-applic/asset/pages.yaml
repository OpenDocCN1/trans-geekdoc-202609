    15. }\n```\n\nNotice that last line of code:\n\n```\n$checked_movie_genres = explode(',\
    \ ', $movie_genre_text);\n```\n\nThe explode()[2] function takes the comma-delimited\
    \ list of genres stored for this movie and turns it into an array called $checked_movie_genres.\
    \ Using it converts this string:\n\n```\n'Action,Adventure,Science Fiction'\n\
    ```\n\ninto this array:\n\n```\n$checked_movie_genres[0] = 'Action'\n$checked_movie_genres[1]\
    \ = 'Adventure'\n$checked_movie_genres[2] = 'Science Fiction'\n```\n\nSo we can\
    \ use it to populate the correct checkboxes for the “Genre”.\n\nThe complete code\
    \ for this if block looks like Listing 18.6."
