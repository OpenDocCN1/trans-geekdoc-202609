  md: "# 6. ARRAYS\n\n# Sorting\n\nAfter populating an array, you may need to work\
    \ with it in sorted order. asort()[10] will reorder an array with the values in\
    \ sorted order and preserve the key-value pairs. Listing 6.7 is an example where\
    \ that resorts U.S. state capitals in alphabetic order.\n\nListing 6.7.\n\n```\n\
    $us_state_capitals = [\n    \"California\" => \"Sacramento\",\n    \"Florida\"\
    \ => \"Tallahassee\",\n    \"Wisconsin\" => \"Madison\"\n];\n\nasort($us_state_capitals);\n\
    \necho \"<pre>\";\nprint_r($us_state_capitals);\necho \"</pre>\";\n```\n\nResults\
    \ in:\n\n```\nArray\n(\n    [Wisconsin] => Madison\n    [California] => Sacramento\n\
    \    [Florida] => Tallahassee\n)\n```\n\n> *PHP provides many built-in functions\
    \ for sorting arrays. For example, if you need to reverse sort an array, use arsort()[11].\
    \ For a complete list, see “Sorting Arrays”[12].*\n\n# Multidimensional Arrays\n\
    \nThe arrays we have dealt with so far are all single-dimensional arrays. However,\
    \ like many other programming languages, PHP allows for the creation of multidimensional\
    \ arrays. One way to visualize multidimensional arrays is to think of each dimension\
    \ as an axis of numbers. For example, a single-dimensional array could be a single\
    \ number line of values such as an X-axis. Using this metaphor, you can think\
    \ of a two-dimensional array as the\n\n[10] asort(): http://php.net/asort\n[11]\
    \ arsort(): http://php.net/arsort\n[12] “Sorting Arrays”: https://php.net/arrays.sorting"
