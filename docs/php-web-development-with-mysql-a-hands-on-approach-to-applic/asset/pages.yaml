  md: "# 14. VALIDATING FORM DATA AND CREATING STICKY FIELDS\n\nWhen creating a web\
    \ application that requires form data, it is crucial to validate the data being\
    \ entered before processing it. At a minimum, we usually want to make sure that\
    \ the user entered text into all the form fields.\n\nLikewise, it is always annoying\
    \ from the user’s perspective if a user is sent back to a form that they missed\
    \ entering a field of data, only to find out that all the data they entered in\
    \ the other fields didn’t persist. In this case, we want to create sticky fields\
    \ that will fill in the form fields with the user’s data if we have to redisplay\
    \ the form.\n\nWe will take the FullName application we’ve been working on in\
    \ the last two chapters and add validation and sticky fields for the form entries.\n\
    \n# Modifying FullName Behavior Based On Validation\n\nWhen a user brings up the\
    \ FullName application, we want to process the first and last name entries only\
    \ if they enter text into both fields. Otherwise, we want to send the user back\
    \ to the form.\n\nTherefore, we want to add logic to display the form as long\
    \ as any field is empty and display an appropriate error message indicating what\
    \ data needs to be filled in for missing fields. If the fields validate correctly,\
    \ we can output our thanks to the user for submitting their full name.\n\nLet’s\
    \ start by adding conditional logic that runs when the user submits the form,\
    \ or navigates to this script the first time:\n\n```\n<?php\n    if (isset($_POST['submit']))\n\
    \    {\n        // ...\n    }\n    else\n    {\n        // ...\n    }\n    //\
    \ ...\n```"
