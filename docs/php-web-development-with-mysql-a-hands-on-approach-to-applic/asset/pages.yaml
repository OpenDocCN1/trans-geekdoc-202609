  md: "# 16. ADDING DATA USING THE WEB APPLICATION\n\n# Extracting the Genre from\
    \ the Checkbox Array\n\nNotice the section of code above that deals with the movie\
    \ genre:\n\n```\n$movie_genre_text = \"\";\n\nif (isset($checked_movie_genres))\n\
    {\n    $movie_genre_text = implode(\", \", $checked_movie_genres);\n}\n```\n\n\
    Since a movie can have multiple genres, we create a comma-delimited list of the\
    \ selected genres from the checkbox array. We do this by calling the implode()\
    \ function ONLY if the user chose at least one genre. If the user doesn’t select\
    \ any genres, the checkbox array does not exist. Therefore we need to check that\
    \ it is set first before calling implode(). If the user does not select a genre,\
    \ we insert an empty string into the genre field of the movieListing table.\n\n\
    # Preventing the Display of the “Add a Movie” Form\n\nAfter inserting the new\
    \ movie information into the database, we prevent the form from displaying again\
    \ by setting $display_add_movie_form to false:\n\n```\nmysqli_query($dbc, $query)\n\
    \    or trigger_error(\n        'Error querying database movieListing: Failed\
    \ to insert movie listing',\n        E_USER_ERROR\n    );\n\n$display_add_movie_form\
    \ = false;\n```\n\n# Displaying the Added Details and a Link to Add Another Movie\n\
    \nTo make this page more useful, we should let the user know their movie information\
    \ was successfully added to the database. Let us do this by displaying a page\
    \ and a table that looks like Figure 16.6, including a link to add another movie\
    \ as shown.\n\nListing 16.10 lists the HTML markup and PHP code to display the\
    \ added movie details.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_188_0.png)"
