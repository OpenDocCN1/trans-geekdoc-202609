    # How to Use This Book


    This book is split into two major parts. Part one is a basic reference to the
    PHP language. While not an exhaustive reference, it explains all the features
    needed for the web applications presented in this book. As more web applications
    are presented, you will be applying more of the PHP language concepts. Part two
    shows how to apply the PHP language through the presentation of various web applications.
    It is intended to give the web developer a complete understanding of how to apply
    PHP and MySQL for many of the most common web development challenges. To illustrate
    the process, it works through the development of a full-featured application implementing
    the typical CRUD (Create-Read-Update-Delete) operations found in one.


    # A Brief History of PHP


    PHP was created in 1994[1] by Rasmus Lerdorf and was originally designed to be
    a simple set of Common Gateway Interface (CGI) binaries written using the C-programming
    language for interacting with HTML forms. Rasmus called this suite of scripts
    “Personal Home Page Tools.” Rasmus continued to add more functionality to his
    toolset, including database interaction and a framework for developing dynamic
    web applications. In early June of 1995, Rasmus released PHP Tools to the public
    through the comp.infosystems.www.authoring. CGI newsgroup. In October of that
    year, Rasmus released a new version that consisted of an advanced scripting interface
    that resembled C and Perl. In April of the next year, Rasmus added database support
    for several DBMSs, and in June of 1996, version 2 of PHP was released. In May
    of 1998, 1% (approximately 60000) web servers had PHP/FI installed.


    In 1997, Andi Gutmans and Zeev Suraski collaborated with Rasmus to rewrite the
    PHP Parser. When they released version 3 (in June of 1998), the programming language
    was renamed “PHP,” which is a recursive acronym meaning “PHP: Hypertext Preprocessor.”
    PHP 3 allowed for easy extensibility, with many developers contributing useful
    modules. PHP 3 also included Object-Oriented Programming (OOP) extensions to the
    language. PHP 3, at one point, was installed on 10% of the web servers on the
    internet.


    During the winter of 1998, Andi Gutmans and Zeev Suraski started working on performance
    and modularity improvements to the PHP interpreter. This rewrite of the core of
    PHP came to be known as the ‘Zend Engine’ (named for Zeev and Andi’s first names)
    and


    [1] PHP was created in 1994: http://php.net/en/history.php'
  merge: -1
  img_proc: true
