  md: "# What is Equality?\n\n+   - == tests whether the value is equal\n+   - ===\
    \ tests whether the value is equal and also if it's same data type\n\nThe == operator\
    \ will do automatic type conversion for an equality test, see Listing 7.1.\n\n\
    Listing 7.1.\n\n```\n```php\n$age_string = \"18\";\nif ($age == 18)\n{\n    echo\
    \ 'You can vote';\n}\nelse\n{\n    echo 'You can not vote';\n}\n```\n```\n\nOutputs\
    \ the following:\n\n```\n```\nYou can vote\n```\n```\n\nHowever, === requires\
    \ that two values be of the same type and equal in order to be true as in Listing\
    \ 7.2.\n\nListing 7.2.\n\n```\n```php\n$age_string = \"18\";\nif ($age === 18)\n\
    {\n    echo 'You can vote';\n}\nelse\n{\n    echo 'You can not vote';\n}\n```\n\
    ```\n\nWhich results in:\n\n```\n```\nYou can not vote\n```\n```"
