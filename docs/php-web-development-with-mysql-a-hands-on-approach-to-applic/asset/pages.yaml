- pgno: 338
  md: '# 22. CREATING SECURE WEB APPLICATIONS


    Thankfully, the solution is straightforward and requires using the function `filter_var()`[^13].
    Since we expect a string for our search term, this is how we can sanitize our
    application from XSS:


    ```

    ```php

    $search_term = isset($_POST[''search'']) ? $_POST[''search''] : '''';

    $search_term = filter_var($search_term, FILTER_SANITIZE_STRING);

    ?>

    <h2>Stuff you might be interested in as a result of searching for

    <span class="text-danger"><?= $search_term?></span>...</h2>

    ```

    ```


    Now when we enter `<script>alert(''XSS Attack'')</script>` into the search field
    we no longer get the alert(), but instead get the output you see in Figure 22.22.
    And when we enter our form into the search field, we no longer get the login form,
    but instead get what is shown in Figure 22.23.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_338_0.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_338_1.png)


    Note that if you receive an email address as an input, you should use `FILTER_SANITIZE_EMAIL`
    as it removes all characters except those allowed in an email address. For more
    information on the list of filters for sanitization, see https://php.net/filter.filters.sanitize.


    > > You may see older articles using the functions `htmlentities()`[^14] and `htmlspecialchars()`
    to guard against XSS. While they may work, they don’t protect against directory
    traversal attacks. Also, the default parameters don’t protect you from all XSS
    attacks.


    # Stored XSS


    Regarding stored XSS, you should be super paranoid and make sure you run the `filter_var()`
    function on everything you query out of your database that you plan to display
    on a web page. If you’re sending the output in a CSV file, PDF document, or another
    format, you may need to escape it differently.


    You should couple this approach with validating and sanitizing everything coming
    into the web application. This means filtering every input from a form or a query
    parameter using `filter_var()` and then parameterizing all your queries from these
    inputs as well.


    [13] `filter_var()`: https://php.net/filter_var


    [14] `htmlentities()`: https://php.net/htmlentities'
