    \ Found :-(</h3>\n<?php\nendif;\n// ...\n</body>\n```\n```\n\n# Linking Listings\
    \ to Detail Pages\n\nNow that we have our movie title listings, we want to create\
    \ links for each movie that takes us to a moviedetails.php page. We want to send\
    \ a query parameter containing the id field for each movie to the moviedetails.php\
    \ page. Query parameters are sent to a PHP script within the $_GET superglobal\
    \ variable.\n\n# Using GET versus POST\n\nWe have two options for sending data\
    \ along with our page request. Usually, this is to send form data to be saved\
    \ or include information we need to lookup saved data. Many programmers use GET\
    \ and POST interchangeably, but they make different assumptions about these bits\
    \ of data."
