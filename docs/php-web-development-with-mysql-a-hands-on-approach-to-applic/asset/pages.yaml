- pgno: 488
  md: "# Overriding Methods\n\nWith inheritance, I can create more specific data and\
    \ methods based on the details in my sub-class. However, I don’t like that my\
    \ dog and cat are portrayed as exercising the same way. It would be handy to customize\
    \ or “override” the different ways my dog and cat exercise.\n\nAnother central\
    \ pillar of OOP is the ability to override the behavior of methods based on the\
    \ specificity of the subclass. In fact, with the ability to override methods,\
    \ we don’t have to keep track of which specific method to use. We can rely on\
    \ each subclass taking care of its unique details for how something is done. It\
    \ is done automatically for us based on the subclass type. This behavior is called\
    \ “polymorphism” (meaning many forms), another main pillar of OOP.\n\nWe override\
    \ the behavior of a base class’s method by redefining it in the sub-class. The\
    \ rule is: the method in the subclass must have the exact same signature as the\
    \ method in the base class.\n\nListing 26.15 is our Dog class with the exercise()\
    \ method overridden:\n\n# Listing 26.15.\n\n```\n```php\n<?php\nrequire_once('Pet.php');\n\
    \nclass Dog extends Pet\n{\n    public function bark()\n    {\n        echo $this->name\
    \ . ' is barking.<br />';\n    }\n\n    // Do some dog exercise!\n    public function\
    \ exercise()\n    {\n        echo 'Walking my dog ' . $this->name . '.<br />';\n\
    \    }\n}\n```\n```\n\nOur Cat class is in Listing 26.16 with the exercise() method\
    \ overridden:"
  merge: -1
  img_proc: true
- pgno: 489
  md: "# Listing 26.16.\n\n```\n<?php\nrequire_once('Pet.php');\nclass Cat extends\
    \ Pet\n{\n    public function meow()\n    {\n        echo 'My cat ' . $this->name\
    \ . ' is meowing.<br />';\n    }\n\n    // Do some cat exercise!\n    public function\
    \ exercise()\n    {\n        echo 'My cat ' . $this->name . ' is chasing mice!<br\
    \ />';\n    }\n}\n```\n\nA powerful feature of OOP is we don’t have to make any\
    \ changes to code that uses the Pet, Dog, and Cat class since we call the methods\
    \ the same way. Just rerun it and notice the change in the output in Figure 26.3.\n\
    \n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_489_0.png)\n\n# Constructors\n\nConstructors\
    \ are used in object-oriented languages to initialize an object from a class as\
    \ part of instantiation. So far, when we’ve instantiated an object, we have done\
    \ so using an empty set of parenthesis following the name of the class using the\
    \ new keyword:\n\n```\n$myDog = new Dog();\n```\n\nThis method of initialization\
    \ is using the default constructor. If you do not define a constructor, PHP will\
    \ try to initialize your object’s properties.\n\nA constructor is a function that\
    \ runs during the initialization of your object. You want to define a constructor\
    \ if you have some specific initialization you want to perform in your class.\n\
    \nWe define a constructor using the PHP Magic Method __construct(). PHP has a\
    \ number of “Magic Methods”[7] which are functions starting with a double-underscore\
    \ (__). I will only talk about __construct() and __destruct() in this chapter.\n\
    \n[7] “Magic Methods”: https://php.net/language.oop5.magic"
