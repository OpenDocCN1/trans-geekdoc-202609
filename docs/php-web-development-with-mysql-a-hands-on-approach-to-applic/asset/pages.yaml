  md: "# 12. INSERTING DATA INTO A MYSQL DATABASE\n\n# Inserting the Full Name Into\
    \ the Database\n\nNext we want to build a SQL SELECT query and send it to our\
    \ database using the mysqli_query() function[7]. This function takes two parameters:\
    \ a database connection resource, and a query string. Our query string and mysqli_query()\
    \ statement should look like this:\n\n```\n$query = \"INSERT INTO fullName (first_name,\
    \ last_name)\"\n  . \" VALUES ('$first_name', '$last_name')\";\n\n$result = mysqli_query($dbc,\
    \ $query);\n```\n\nIf the call to mysqli_query() is successful, $result contains\
    \ TRUE. Otherwise, if the query fails, FALSE is returned. You can also use an\
    \ or trigger_error() statement as well.\n\n# Closing the Database Connection\n\
    \nFinally, close the database connection using the function mysqli_close(). This\
    \ function takes one parameter: the database connection. Our mysqli_close() statement\
    \ should look like this:\n\n```\nmysqli_close($dbc);\n```\n\n> Whenever we want\
    \ to query a database, one approach is to connect to the database, perform the\
    \ query, and close the database connection. It is not a good idea to leave a database\
    \ connection open. It takes up thread resources and can be a potential problem\
    \ if you have a large-scale application where multiple connections can be open\
    \ simultaneously. Suppose you're writing a large-scale application that may have\
    \ many open connections to the database at one time. In that case, you should\
    \ consider closing connections when you finish interacting with the database rather\
    \ than waiting for the script to finish.\n> \n> On the other hand, PHP will automatically\
    \ close any open database connections when your script terminates. For small to\
    \ medium-size applications, or if your queries are spread out across many functions,\
    \ you can skip calling mysqli_close() explicitly.\n\nPutting it all together,\
    \ our script now looks like Listing 12.2.\n\n[7] mysqli_query() function: http://php.net/mysqli_query"
