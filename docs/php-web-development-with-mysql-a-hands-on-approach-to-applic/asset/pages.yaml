    \ connection,\n *               a query string, a data types string, and a variable\
    \ number\n *               of parameters to be used in the query. If the query\
    \ is\n *               successful, the database results object will be returned\n\
    \ *               (or TRUE if no results set and the query was successful),\n\
    \ *               otherwise FALSE is returned and the connection has to be\n *\
    \               queried for the last error.\n *\n * @param $dbc            database\
    \ connection\n * @param $sql_query      SQL statement\n * @param $data_types \
    \    string containing one character for each parameter type\n * @param $query_parameters\
    \ variable list of parameters representing each query parameter\n * @return string\
    \         Database results set, false if there is an error, or true if successful.\n\
    \ */\nfunction parameterizedQuery($dbc, $sql_query, $data_types, ...$query_parameters)\n\
