  md: "# Allow Users with Administrative Access\n\nSince we are now authenticating\
    \ users through the login.php script, we only need to look at the session variables\
    \ user_id and user_access_privileges to determine if a user is logged in, and\
    \ if so, what access privileges they have.\n\nWe are going to rewrite the entire\
    \ authorizeaccess.php script and start from scratch. Start by deleting everything\
    \ in authorizeaccess.php and making a call to the session_start() function:\n\n\
    ```\n```php\n<?php\n    session_start();\n```\n```\n\nNext, we want to take care\
    \ of the case where a visitor is not authenticated. When not logged in, the session\
    \ variables user_id or user_access_privileges are not set. Add the following code\
    \ (Listing 23.28), which redirects the user to unauthorizedaccess.php if they\
    \ are not logged in.\n\n# Listing 23.28.\n\n```\n```php\n<?php\n    session_start();\n\
    \n    // Not logged in, redirect to unauthorizedaccess.php script\n    if (!isset($_SESSION['user_id'])\
    \ || !isset($_SESSION['user_access_privileges']))\n    {\n        header(\"Location:\
    \ unauthorizedaccess.php\");\n        exit();\n    }\n```\n```\n\nIf we make it\
    \ past this conditional, then we know the user is logged in. Now, we need a condition\
    \ to check if they have admin rights. Add the code in Listing 23.29 which redirects\
    \ the user to unauthorizedaccess.php if they don’t have admin privileges.\n\n\
    # Listing 23.29.\n\n```\n```php\n<?php\n    // ...\n\n    // IF NOT admininstrative\
    \ access redirect to unauthorizedaccess.php script\n    if ($_SESSION['user_access_privileges']\
    \ != 'admin')\n    {\n        header(\"Location: unauthorizedaccess.php\");\n\
    \        exit();\n    }\n```\n```"
