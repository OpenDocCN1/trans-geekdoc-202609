- pgno: 129
  md: "You want to do three things:\n\n+   1. Connect to the database\n+   2. Query\
    \ the database\n+   3. Close the connection to the database\n\nBefore we do these\
    \ three things, lets create two variables for our first and last names:\n\n```\n\
    $first_name = $_POST['first_name'];\n$last_name = $_POST['last_name'];\n```\n\n\
    # Opening the Database Connection\n\nRight after the else { statement (but before\
    \ the closing ?>) we connect to the database using the mysqli_connect()⁶ function.\
    \ This function takes four string parameters (by default): host, username, password,\
    \ and database_name. Our mysqli_connect() statement should look like this:\n\n\
    ```\n$dbc = mysqli_connect('localhost', 'testuser', 'testuser', 'FullName')\n\
    \    or trigger_error('Error connecting to MySQL server.', E_USER_ERROR);\n```\n\
    \n> It is not a good idea to have our password entered in clear text in our source\
    \ code (especially if we accidentally post it up on some git repository). The\
    \ better way to manage this is to use a configuration or environment variable.\n\
    \nIf the call to mysqli_connect() is successful, $dbc will contain a resource\
    \ connection referring to our database. It is a good idea to use the or trigger_error()\
    \ statement so that you can determine if you run into a problem connecting to\
    \ your database. If there is a failure, you will see the error message displayed\
    \ on the web page, and execution of your PHP script will halt.\n\n> Why not or\
    \ die()? You're likely to run into legacy code or old tutorials online that use\
    \ the die() statement to stop and display a message. Since it halts the execution\
    \ of the PHP interpreter, your error messages are not logged to PHP's error logs\
    \ and not passed to any custom error handlers. Furthermore, the only way to be\
    \ notified that a user ran into an error is to wait for someone to report an outage.\
    \ trigger_error() with the E_USER_ERROR severity have the same effect without\
    \ the downsides.\n\n[6] mysqli_connect(): http://php.net/function.mysqli-connect"
