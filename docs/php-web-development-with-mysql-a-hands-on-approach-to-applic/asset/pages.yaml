- pgno: 102
  md: "# 10. FUNCTIONS\n\nIt is very easy to write code and continue to add functionality\
    \ to it. The problem is that our program code becomes too large and unwieldy.\
    \ It is common to write code modularized into functions and limit that functionality\
    \ to a specific task. Doing so allows us to reuse these modules throughout our\
    \ program. Functions also give us the ability to pass in arguments and return\
    \ results.\n\n# Simple Function\n\nThe simplest function takes no arguments and\
    \ does not return anything; it just performs some functionality. Let’s say you\
    \ want a function that will output the greeting, “Welcome to my Website!” you\
    \ display for every page of your website. Here is what it might look like:\n\n\
    ```\nfunction outputGreetingToWebsite()\n{\n    echo \"<h1>Welcome to my Website!</h1>\"\
    ;\n}\n```\n\nWhen creating a function in PHP, you always start using the function\
    \ keyword. Next, you want to give your function a good name. Since your function\
    \ is invoked to do something, it is usually a good idea to start the name of your\
    \ function with a verb. In this case, we want to output a greeting to the website.\
    \ Naming your function as specifically as possible helps with the readability\
    \ and maintainability of our code. Therefore outputGreetingToWebsite is a good\
    \ name. Although not specified in the PHP Standards, I usually like to name my\
    \ functions using something called “camel case.” As you can see by the above example,\
    \ we start the first word of the function using a lowercase letter, then with\
    \ each subsequent word joined together in the function, we capitalize the first\
    \ character of the joined word. Next, the function defines parameters that are\
    \ passed into the function in between a set of parenthesis. In this case, we do\
    \ not have any parameters to pass, so we will just use an empty set of parenthesis.\
    \ Next, the code within the function is contained within two curly braces ({}).\
    \ Additionally, each time a new opening curly brace is encountered, you will want\
    \ to indent your code. I usually use four spaces for indentation levels and double\
    \ indentation (eight spaces) for line continuations.\n\nIt is also a good idea\
    \ to organize our functions. Later, when I talk about object-oriented programming,\
    \ we will put functions (called methods) into something called a “class.” For\
    \ now, let’s assume we have several functions used to output information to our\
    \ website collected into a single PHP script called outputToWebsite.php."
  merge: -1
  img_proc: true
- pgno: 103
  md: "When we want to invoke or call our function somewhere else in our code (like\
    \ in another PHP script), we need to do a couple of things. First, we need to\
    \ make sure we include the code where our function is defined. We do that using\
    \ the require_once() statement and include the name of the script containing the\
    \ function we want to use inside a set of quotes:\n\n```\n<?php\nrequire_once('outputToWebsite.php')\n\
    ```\n\nNext, we call our function. In the example below, let's call it twice:\n\
    \n```\noutputGreetingToWebsite();\noutputGreetingToWebsite();\n```\n\nThe output\
    \ of calling the function twice looks like Figure 10.1.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_103_0.png)\n\
    \n# Function Parameters/Arguments\n\nFunctions can also take parameters. Let's\
    \ say we want to create a function that adds two numbers as arguments to the function.\
    \ Let's call this function addTwoNumbers. We need two parameters in between the\
    \ parenthesis separated by a comma. These variables are parameters to the function\
    \ and are considered local variables scoped to the function. It is a good idea\
    \ to be descriptive if you can with the name of these parameters as well:\n\n\
    ```\nfunction addTwoNumbers($num1, $num2)\n{\n    $sum = $num1 + $num2;\n    echo\
    \ \"$num1 + $num2 = $sum<br />\";\n}\n```\n\nWhen we call this function, we need\
    \ to pass in two arguments to this function in the same order they are defined\
    \ in the function:\n\n```\naddTwoNumbers(4, 5);\n```\n\nThis results in the output:\n\
    \n```\n4 + 5 = 9\n```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "# 10. FUNCTIONS\n\nThis will also work when passing in variables:\n\n```\n\
    $the_first_number = -2;\n$the_second_number = 5;\naddTwoNumbers($the_first_number,\
    \ $the_second_number);\n```\n\nResulting in the output:\n\n```\n-2 + 5 = 3\n```\n\
    \nWhen calling the function, the values passed in are considered arguments to\
    \ the function. However, from the function's perspective, the values are considered\
    \ parameters. I don't think this bit of Computer Science will get you into any\
    \ trouble if you happen to mix these two perspectives up. When you call the function,\
    \ the values of the arguments (whether literal values or variable values) are\
    \ copied to the function's parameter variables.\n\n# Returning Values from a Function\n\
    \nFinally, we can write functions so that they return results to us. Expanding\
    \ upon our adding two numbers example above, let's modify this function. Instead\
    \ of echoing out the results of the function, we can return the result and allow\
    \ the code that called the function to do whatever it wants with the result. First,\
    \ let's change the name of this function to sum since this would be a more accurate\
    \ name for what the function is doing. The only modification we need to make to\
    \ the code is to replace the echo statement to return the variable $sum:\n\n```\n\
    function sum($num1, $num2)\n{\n    $sum = $num1 + $num2;\n    return $sum;\n}\n\
    ```\n\nNow when we call this function we can create a variable that will hold\
    \ the result of the call and set it equal to the call of the function:\n\n```\n\
    $first_num = 5;\n$second_num = 7;\n\n$sum_of_two_numbers = sum($first_num, $second_num);\n\
    echo \"The result of adding $first_num and $second_num is $sum_of_two_numbers<br/>\"\
    ;\n```"
  merge: -1
  img_proc: true
- pgno: 105
  md: 'This results in the following output:


    ```

    The result of adding 5 and 7 is 12

    ```


    > If a function returns a result, and you fail to assign that result to a variable,
    the result is lost.


    # Further Advice On Writing Good Functions


    As we close this chapter, I want to give advice regarding writing good functions.
    Writing functions is tricky, and it’s more of an art than science, but it’s also
    90% common sense. Let’s look at some advice for writing functions with high readability
    and maintainability.


    # Global Variables are Evil!


    I cannot overemphasize this point that global variables are evil. The problem
    with global variables is all of your code (at a minimum, the code within a single
    script) has access to it and could change its value. This practice makes debugging
    and maintenance difficult. Unfortunately, it is a lazy substitute for proper design.


    In software design, it is a best practice to limit data exchanges between functions.
    In other words, we pass data into functions through arguments/parameters, and
    we get data out of functions through return values without affecting the rest
    of the program. You should not use the global keyword inside of a function or
    method in PHP.


    # The Only Good Global is a Constant


    This is not to say you cannot or should not have any global values. Constant values
    are a good use of global values because any code that needs them can access them.
    However, because it is constant, it cannot change. However, you want to be careful
    to limit the number of global constants to what is needed.


    # Variable Scope


    Variable scope is defined as what parts of your code can access which variables.
    Global scope is the outer- or top-most level.'
  merge: -1
  img_proc: true
- pgno: 106
  md: "# 10. FUNCTIONS\n\n# Scoping Operators ({})\n\nIn PHP (and most other programming\
    \ languages), we limit the scope of variables using scoping operators ({}). For\
    \ example, all function code is contained within a set of scoping operators:\n\
    \n```\n```php\nfunction sum($num1, $num2)\n{\n    $sum = $num1 + $num2;\n    return\
    \ $sum;\n}\n```\n```\n\n> In the above example, the parameters $num1 and $num2\
    \ are defined outside the function scoping operators in the function signature.\
    \ However, because we are defining a function, these parameters only have scope—that\
    \ is, hold a value—within the function scoping operators. This is also true of\
    \ variables defined within a for() loop.\n\nTherefore, variables created within\
    \ a set of scoping operators can only be directly accessed by the code within\
    \ these scoping variables. However, variables (and constants) defined outside\
    \ of scoping operators are accessible by code within the scoping operators. Consider\
    \ the example in Listing 10.1.\n\n# Listing 10.1.\n\n```\n```php\n<?php\n\nfunction\
    \ doSomething()\n{\n    $value1 = 10;\n\n    if ($value1 >= 10)\n    {\n     \
    \   $value2 = $value1;\n    }\n    else\n    {\n        $value3 = $value1;\n \
    \   }\n\n    echo $value2; // This outputs an undefined value\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: "In the code above on line 9, $value2 can access $value1 because $value1 is\
    \ within $value2’s scope. This is also true of $value3 on line 13. However, on\
    \ line 16, we create a new variable called $value2 because the one created on\
    \ line 9 went out of scope after encountering the closing scoping operator on\
    \ line 10. The result of echoing out $value2 on line 16 is undefined.\n\n# Scalers\
    \ are Passed in by Value\n\nIn PHP, arguments are passed to functions by value\
    \ (i.e., a copy). Therefore you cannot modify the passed-in variable. The values\
    \ of the arguments are copied to the parameters. Consider the following function\
    \ and a call to it. See Listing 10.2.\n\n# Listing 10.2.\n\n```\n```php\n<?php\n\
    function incrementValueNotWorking($value)\n{\n    $value++;\n}\n$number = 42;\n\
    echo \"Before function call: $number<br/>\";\nincrementValueNotWorking($number);\n\
    echo \"After function call: $number\";\n```\n```\n\nBecause scaler values are\
    \ passed by value, the output of $number on lines 9 and 13 are the same, thus\
    \ failing to increment $number. What happens if we re-write the code like Listing\
    \ 10.3?\n\n# Listing 10.3.\n\n```\n```php\n<?php\nfunction incrementValue($value)\n\
    {\n    $value++;\n    return $value;\n}\n$number = 42;\necho \"Before function\
    \ call: $number<br/>\";\n$number = incrementValue($number);\necho \"After function\
    \ call: $number\";\n```\n```"
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 10. FUNCTIONS


    Now the output of $number on line 15 will be one greater than on line 11.


    # Functions Should Do One Thing and One Thing Only.


    When designing your functions, make sure they do one thing. First, it lowers the
    complexity of your code, and second, it increases the reusability of your code.


    # Name Your Functions Completely and Succinctly.


    Back in the early days of programming, we did not have the luxury of adequately
    naming our functions because of the limited amount of memory available to program
    code. I can remember sitting on the floor with reams of code printed out, trying
    to decipher the meaning of functions called x and y as if I were using a secret
    decoder ring. Today, there is no excuse for poorly naming your functions.


    You want to name your functions completely and succinctly because it makes your
    code self documenting. For example, if I needed to write a function for calculating
    the state income tax for an employee, a good name for this function might be:
    `calculateEmployeeStateIncomeTax()`. I know. It’s long, but there is no ambiguity
    as to what this function is intended to do.


    As mentioned earlier, a good template to follow is to name your function using
    a verb+noun with adjectives sprinkled in as needed. If your function returns a
    boolean `true` or `false` (your function answers a question), consider naming
    it something like `isX()` or `hasY()`. Look for other conventions like this in
    the projects your work in. For example, some projects use `fetchQ()` to indicate
    a method that works with the database or an external API.


    # Exercises


    Create a script `functions.php` for the following:


    +   1. Create functions to add, subtract, divide, multiply two numbers that return
    the result. Echo the result of each operation and the two input values.

    +   2. Create a function that accepts two arguments: a total and a sales tax rate
    expressed as a percent (so 5% sales tax is expressed as 0.05). Return the sales
    tax owed on the total. Then echo the total, the tax rate, and the sales tax owed.'
