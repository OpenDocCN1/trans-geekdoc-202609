  md: '# Create a PHP Application to Insert Data


    # Failed Database Connection


    Failing to connect to the database usually involves one or more incorrect parameters
    to the mysqli_connect() function, which could be incorrect credentials or a non-existent
    database name.


    For example, you might see output like Figure 12.27.


    Error output can be pretty tricky to decipher. However, we do know that our mysqli_connect()
    call failed. We can also see the reason given is:


    ```

    php_network_getaddresses: getaddrinfo failed: Name or service not known in

    ```


    The fact that we see a problem with the network address is a clue as to what’s
    wrong. Looking up the mysqli_connect()[9] function definition in the PHP manual,
    we see that the first parameter expected is the hostname or IP address of the
    SQL server we are trying to connect to. Looking at line 24 of our code, we see
    Figure 12.28.


    We quickly identify that we typed localhosed instead of localhost, which we can
    quickly fix.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_133_0.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_133_1.png)


    Let’s say we see the output in Figure 12.29 instead.


    The reason given is:


    ```

    Access denied for user ''testusers''@''localhost''...

    ```


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_133_2.png)


    Because we see that access was denied, it tells us that either the username or
    password parameter to mysqli_connect() is incorrect. Looking at line 24 of our
    code, we see Figure 12.30.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_133_3.png)


    Looking at the user name parameter, we can see it is misspelled and has an extra
    s on the end.


    [9] mysqli_connect(): https://php.net/mysqli_connect'
