  md: '# Guarding Against SQL Injection


    Now, I know I can manipulate the query through the search field and that it is
    a MySQL database. So, let''s see if we can display some dummy data at the bottom
    of the table. MySQL has a dummy table called DUAL. Using the UNION command with
    a subquery in SQL, we can add three columns of fake information to the end of
    the table.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_329_0.png)


    Let''s enter this into the search field:


    ```

    sir%'' UNION (SELECT 1, 2, 3 FROM dual);--

    ```


    And we get Figure 22.10.


    This is no longer a blind attack as we can harvest information out of the database.


    MySQL has a database called information_schema containing meta-information about
    all the databases and their tables. The information_schema.tables table contains
    information about all the tables in the current database. The fields TABLE_NAME
    and TABLE_SCHEMA give us the names of each table and the database containing them.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_329_1.png)


    Let''s enter this into the search field to harvest some information from this
    database:


    ```

    sir%'' UNION (SELECT TABLE_NAME, TABLE_SCHEMA, 3 FROM information_schema.tables);--

    ```


    We should get output shown in Figure 22.11 and Figure 22.12. There is a lot of
    interesting information here we can mine. However, I am particularly interested
    in the Login table within the SQLInjection database. The COLUMN_NAME field within
    the columns table of the information_schema database will list all


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_329_2.png)'
