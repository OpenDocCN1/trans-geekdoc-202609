  md: '# 19. WORKING WITH FILES AND FEATURE ADDITIONS TO EXISTING CODE


    # Add Image File Uploads to the Editing Page


    Now, new movies can have a custom file image. We need to add to the editmovie.php
    script the same ability to upload a movie image and any other details for the
    movie. That way, users can update existing file images with a new one or add a
    movie thumbnail to existing entries.


    When we navigate to the “Edit a Movie” page, as a result of selecting the edit
    it link on the “Movie Details” page, we should see Figure 19.19


    We want to add an image of the movie to the right of the form and add a “Choose
    File” button towards the bottom of the form (Figure 19.20).


    When choosing an image to update, a file browser window pops up. Then, users can
    navigate to the image file they want to upload, select it, then press Open as
    in Figure 19.21.


    The name of the selected file displays after the “Choose File” button, instead
    of “No file chosen”. See Figure 19.22.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_276_0.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_276_1.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_276_2.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_276_3.png)'
