  md: "# Create a user Table\n\nTo add user logins, we need to create another table\
    \ in the Movie database to hold user information. Let's create a user table that\
    \ holds the following fields:\n\n| Column Name | Type | Default |\n|---|---|---|\n\
    | id | int(11) Auto Increment | |\n| user_name | varchar(50) | |\n| password_hash\
    \ | varchar(255) | |\n| access_privileges | varchar(25) | [user] |\n| date_created\
    \ | datetime | [CURRENT_TIMESTAMP] |\n\n> The PHP Manual entry for password_hash()[1]\
    \ recommends allowing for hash lengths between 60 and 255 characters to allow\
    \ for the hash to expand over time as the algorithm is updated.\n> \n> In a professional\
    \ application, you would want to capture more demographic information (contact\
    \ info, etc.).\n\nUsing Adminer, create a new table in the Movie database containing\
    \ the columns (and associated data types) listed above. We will have two types\
    \ of access privileges: user and admin. When we sign up a new user, we want to\
    \ set the default access privileges to user. Any user account you want to have\
    \ admin privileges must be altered manually in the database table. We also want\
    \ a default value of CURRENT_TIMESTAMP set for the date_created field, which also\
    \ gets set when we sign up a new user.\n\n[1] password_hash(): https://php.net/password_hash"
