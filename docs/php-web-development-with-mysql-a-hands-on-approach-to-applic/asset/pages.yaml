- pgno: 94
  md: "# 9. LOOPING\n\nLooping in PHP is used to run a block of code either a predetermined\
    \ number of times or until a specific condition is reached. When looping a predetermined\
    \ number of times, this is known as a counting loop. We don’t know how many times\
    \ a code block will repeat, but we know the condition for ending the repetition.\
    \ This state is known as a sentinel loop.\n\nThere are four loop structures in\
    \ PHP.\n\n+   1. `for`\n+   2. `while`\n+   3. `do/while`\n+   4. `foreach`\n\n\
    for and while loops are the most common looping structures in all programming\
    \ languages.\n\n# Counting Loops\n\nfor and foreach are considered counting loops.\
    \ They repeat a block of code based on a counter variable or the number of items\
    \ in a collection.\n\n# for Loops\n\nA for loop has three clauses separated by\
    \ two semi-colons (;). We call the first clause the “initializer.” It is executed\
    \ only the first time upon encountering the loop. The second clause is called\
    \ the “conditional” and is executed every time the compiler encounters the loop.\
    \ The last clause is called the “incrementer” and is used to either increment\
    \ or decrement a variable upon completing a loop iteration.\n\nThe syntax looks\
    \ like this:\n\n```\n```php\nfor (_initializer_; _conditional_; _incrementer_)\n\
    {\n    _code to execute_\n}\n```\n```\n\nListing 9.1 is a simple for loop that\
    \ adds ten to a variable ten times."
  merge: -1
  img_proc: true
- pgno: 95
  md: "# Listing 9.1.\n\n```\n1. $looping_value = 0;\n2. $counter;\n3.\n4. for ($counter\
    \ = 0; $counter < 10; $counter++)\n5. {\n6.     $looping_value += 10;\n7. }\n\
    8.\n9. echo \"After $counter times through the loop, looping_value = $looping_value\"\
    ;\n```\n\nThis outputs:\n\n```\nAfter 10 times through the loop, looping_value\
    \ = 100\n```\n\nIt is important to note when incrementing a variable in a loop,\
    \ the variable to increment (in this case, $looping_value) must be initialized.\
    \ Otherwise, you end up with a NULL value as your final result. This bug is common\
    \ in looping. Also, note the incrementer (in this case, $counter) will be set\
    \ to 10 because the last successful iteration of the loop increments the variable\
    \ to the next value. This final value causes the loop to exit—the incrementer\
    \ at this point no longer passes the conditional expression with a value of true.\n\
    \n# foreach Loops\n\nThe foreach loop is a convenient way to iterate through all\
    \ values in an array without the need for indexing each array item. The foreach\
    \ loop has two values separated by the word as. The first value is the actual\
    \ array you will iterate over. The second value is an arbitrary variable name\
    \ used for accessing each element of the array from the beginning to the end.\n\
    \nThe syntax looks like this:\n\n```\nforeach (_array_ as _array_element_)\n{\n\
    \    _code to be executed_\n}\n```\n\nHere is a simple foreach loop that outputs\
    \ each value in an array:\n\n```\n$colors = array('red', 'green', 'blue', 'orange');\n\
    \nforeach ($colors as $color)\n{\n    echo \"The current color is $color<br/>\"\
    ;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 96
  md: "# 9. LOOPING\n\nThis loop produces this output:\n\n```\nThe current color is\
    \ red\nThe current color is green\nThe current color is blue\nThe current color\
    \ is orange\n```\n\n# Sentinel Loops\n\nwhile and do/while are sentinel loops.\
    \ They execute until some condition is false.\n\n# while Loops\n\nWhen new programmers\
    \ learn about looping, they are first taught how to use the while loop because\
    \ it only has one clause and is the simplest loop to create. In fact, it is typically\
    \ shown as a counting loop:\n\n```\n$looping_value = 0;\n$counter = 0;\n\nwhile\
    \ ($counter < 10)\n{\n    $looping_value += 10;\n    $counter++;\n}\n```\n\nThis\
    \ example, however, is not the best use of a while loop because the programmer\
    \ has to separately initialize the counter variable and then remember to increment\
    \ the counter variable at the bottom of the loop. The for loop was designed to\
    \ be used as a counting loop.\n\n> It's essential to ensure your loops terminate.\
    \ If not, you create an infinite loop that only ends if PHP's max execution time\
    \ is reached.\n\nThe proper use of the while loop is to continue executing a block\
    \ of code until a particular event occurs.\n\nLet us assume we have a MySQL database\
    \ that contains product information stored in a table. Let us say we want to output\
    \ the product name and unit price for every row in the table, but we don't know\
    \ how many rows it contains. We just want to output all of them."
  merge: -1
  img_proc: true
- pgno: 97
  md: "PHP offers several functions for storing and retrieving data in MySQL databases.\
    \ When querying a database, we get an associative array returned that contains\
    \ the whole result set. This result set needs to be passed into a function (mysqli_fetch_array())\
    \ that returns the next row in the record set as an associative array that uses\
    \ the field names as element references for the values contained for this row.\
    \ Each subsequent call to mysqli_fetch_array() returns the next row until there\
    \ are no more rows left in the record set. When there are no more rows in the\
    \ record set, NULL is returned, which allows you to exit a loop. Listing 9.2 an\
    \ example of a while loop.\n\n# Listing 9.2.\n\n```\n```html\n<html>\n<head>\n\
    \  <title>Fetching Multiple Rows</title>\n</head>\n<body>\n<?php\n  $dbc = mysqli_connect('localhost',\
    \ 'testuser', 'testuser', 'northwind')\n  or trigger_error('Error connecting to\
    \ MySQL server.', E_USER_ERROR);\n\n  $query = \"SELECT ProductName, UnitPrice\
    \ FROM Products\";\n\n  $result = mysqli_query($dbc, $query)\n  or trigger_error('Error\
    \ querying database.', E_USER_ERROR);\n?>\n<table border='1px solid;'>\n  <tr><th>Product\
    \ Name</th>\n  <th>Unit Price</th></tr>\n<?php\n  while($row = mysqli_fetch_array($result))\n\
    \  {\n    echo '<tr><td>' . $row['ProductName'] . '</td><td>'\n    . $row['UnitPrice']\
    \ . '</td></tr>';\n  }\n  mysqli_close($dbc);\n?>\n</table>\n</body>\n</html>\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 98
  md: "# 9. LOOPING\n\nFigure 9.1 shows the table of product information from the\
    \ database using a while loop.\n\n> We will look at creating and using functions\
    \ and working with databases in upcoming chapters.\n\ndo/while[1] loops are helpful\
    \ if you can guarantee you will enter the loop at least once. In PHP, you can\
    \ rarely guarantee this condition. Therefore it is seldom used.\n\n# Exiting and\
    \ Continuing a Loop\n\nOccasionally, you will want to either exit a loop early\
    \ or continue iterating through a loop but skip executing some code for the rest\
    \ of the current iteration. PHP offers the break and continue commands for this.\n\
    \n# break\n\nUse the break command in a loop if you want to exit a loop. Listing\
    \ 9.3 is an example that exits a foreach loop if an element in an array equals\
    \ finished.\n\n# Listing 9.3.\n\n```\n<?php\n$random_words = ['happy', 'sad',\
    \ 'finished', 'anxious', 'ecstatic'];\nforeach ($random_words as $word) {\n  \
    \  if ($word == 'finished') {\n        break;\n    }\n    echo \"$word<br/>\"\
    ;\n}\n```\n\nHere's the output:\n\n```\nhappy\nsad\n```\n\n[1] do/while: http://php.net/control-structures.do.while\n\
    \n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_98_0.png)"
  merge: -1
  img_proc: true
- pgno: 99
  md: "# continue\n\nUse the continue command in a loop if you want to skip the rest\
    \ of the current iteration and continue to the next. See Listing 9.4 for an example\
    \ that skips every third iteration of a loop.\n\nListing 9.4.\n\n```\n<?php\n\
    $random_words = ['one', 'two', 'three', 'anxious', 'ecstatic'];\n\nfor ($i = 1;\
    \ $i <= 9; i++)\n{\n    if ($i % 3)\n    {\n        continue;\n    }\n\n    echo\
    \ \"$i<br/>\";\n}\n```\n\nThis loop produces the following output:\n\n```\n1\n\
    2\n4\n5\n7\n8\n```\n\n# Exercises\n\nCreate a script loops.php for the following:\n\
    \n+   1. Write a loop to count from one to ten and output each value in one column.\
    \ In a second column, output the square of the number.\n+   2. Use a foreach loop\
    \ to output your list of book titles from arrays.php in Chapter 6."
