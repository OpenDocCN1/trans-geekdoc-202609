- pgno: 400
  md: '# 25. ADDING RESERVATION FEATURES


    Finally, we are ready to add the movie reservation features to our *Movie Reservations*
    application. This chapter will focus on adding reservation features to the *Movie
    Reservations* application so that users can reserve and return movies. Again,
    here is the list of modifications we need to make to finally turn the *Movie Listing*
    application into a *Movie Reservations* application:


    +   1. **Adding Reservation Features**

    +      1. Create a database table to hold information for movie reservations

    +      2. Add fields to the `movieListing` database table to keep track of the
    number of copies and reserved movies for each movie

    +      3. Modify the add, edit, remove, and movie details movie scripts to include
    the number of copies of a movie

    +      4. Modify the Movie listings page to show a link for reserving a movie
    for logged in users

    +      5. Modify the Movie listings page to show a link for removing a movie for
    users logged in with admin privileges

    +      6. Add a reservation script for users to check out movies

    +      7. Add a script for a shopping cart that allows users to reserve movies
    in their cart and remove them from their cart

    +      8. Add a shopping cart icon that allows users to view their cart

    +      9. Add a reserved movies script allowing users to check movies back in

    +      10. Add a reservations icon that allows users to view their reservations


    # Add Number of Copies and Number Reserved


    To turn our movie listing application into a movie reservation application, we
    need to know how many copies of a movie title we have and how many of those copies
    are reserved. We will modify the database and add movie checkout features.


    # Add Number of Copies and Reserved Database Fields


    Let’s add two fields to our `movieListing` table in the *Movie* database. One
    for the number of copies, and another for the number reserved. We’ll use Adminer
    to alter our table as in Figure 25.1.'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# Add Number of Copies and Number Reserved


    Select the + after the `image_file` field to add two new fields to the end of
    the `movieListing` table.


    For the `number_of_copies` field:


    +   - In the **Column name** below `image_file`, enter `number_of_copies`

    +   - Select the “Type” as int

    +   - Enter **11** for the “Length”

    +   - Check the box and enter **1** for “Default value”


    And for the `number_reserved` field:


    +   - In the **Column name** below `number_of_copies`, enter `number_reserved`

    +   - Select the “Type” as int

    +   - Enter **11** for the “Length”

    +   - Check the box and enter **0** for “Default value”


    Once you press **Save**, the table description should look like Figure 25.2. Now
    all the movies in our `movieListing` table have `number_of_copies` set to 1, and
    `number_of_reserved` set to 0 as shown in Figure 25.3.


