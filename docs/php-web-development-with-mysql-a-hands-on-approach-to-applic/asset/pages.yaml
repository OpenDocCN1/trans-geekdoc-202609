    \ now. We use our parameterized query function to look up and display the movie\
    \ details based on the movie ID parameter we receive or show an error message\
    \ if no match is found.\n\n> Since we see some duplication of code in multiple\
    \ pages, it would be an excellent exercise to refactor this out soon by modularizing.\
    \ I leave that to you as an exercise.\n\n# Adding a Movie to the Cart\n\nOnce\
    \ the user clicks the “Add to Cart” button (Figure 25.15), the HTML POST routes\
    \ back to the same page since the form’s action attribute is set to <?= $_SERVER['PHP_SELF']\
    \ ?>. Since the form’s input element’s name attribute is set to add_to_cart, the\
    \ code will execute in this condition:\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_432_0.png)\n\
    \n```\nif (isset($_POST['add_to_cart']) && isset($_POST['id'])):\n```\n\nHere\
    \ is where we:\n\n+   1. check to see if the movie is still reservable\n+   2.\
    \ reserve the movie if it is still reservable\n+   3. update number_reserved in\
    \ the movieListing table (if reserved).\n+   4. Add the movie to the user's shopping\
    \ cart.\n+   5. Redirect back to the Home page.\n\nAdd the code in Listing 25.34\
    \ to the if (isset($_POST['add_to_cart']) && isset($_POST['id'])): condition,\
    \ and I will walk through it below.\n\n# Listing 25.34.\n\n```\n<?php\nif (isset($_POST['add_to_cart'])\
    \ && isset($_POST['id'])):\n\n$movie_id = $_POST['id'];\n\n// Query if movie is\
    \ still reservable\n$query = \"SELECT id FROM movieListing\n          WHERE id\
    \ = ? AND number_of_copies - number_reserved > 0\";\n$result = parameterizedQuery($dbc,\
    \ $query, 'i', $movie_id);\n```"
