  md: '# Create a Folder for Uploaded Movie Image Files


    In your main web folder, where your index.php script is located (mine is /MovieListing),
    create a new folder called images/ as in Figure 19.8.


    Note, your web server must have privileges to write files into this folder. For
    example, on a *NIX system, if your webserver (i.e., Apache) runs as user www-data,
    make sure this folder is writeable by the same user.


