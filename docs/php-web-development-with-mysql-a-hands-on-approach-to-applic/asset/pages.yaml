    1. public function update($id, $first_name, $last_name, $email)

    2. {

    3.   $db = new PDO(self::DSN, self::DB_USER, self::DB_PASSWORD);

    4.

    5.   // UPDATE a record with a given first name, last name, and email for a given
    id

