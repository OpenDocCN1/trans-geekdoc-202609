- pgno: 22
  md: '# 1. THE LIFE AND TIMES OF A PHP SCRIPT


    # Static Vs. Dynamic Websites


    HTML alone only allows you to create static web pages. This approach is fine if
    you just want to display images of your cat. However, if you want a web application
    with the ability to interact with a database and for your web pages to update
    based on content that can change, you need a dynamic website. This is where PHP
    comes in. The PHP interpreter runs in the webserver. PHP will deliver HTML to
    the webserver, and since PHP is also a programming language, it allows you to
    build the HTML dynamically.


    # The Browser and the Server


    HyperText Transfer Protocol (HTTP) is the protocol used to communicate between
    a web server (which I will call the server) and the web browser (which I will
    call the client).


    # HTTP Requests and Responses


    When you open up a web browser on your computer and type in a Uniform Resource
    Locator (URL) in the address bar (let''s say flibbertigiblets.com)...


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_22_0.png)


    As soon as you press the Return key on your computer, your browser sends an HTTP
    Request to the web server at flibbertigiblets.com. That request might look something
    like Listing 1.1.


    Listing 1.1.


    ```

    ```

    1. GET /phpWebDevMySQL/ HTTP/1.1

    2. Host: flibbertigibets.com

    3. Connection: keep-alive

    4. Cache-Control: max-age=0

    5. Authorization: Basic ZmFsbDIwMTdwaHA6dXNlIHRoZSBMb3Jj3jZQ==

    6. Upgrade-Insecure-Requests: 1

    7. User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_6)

    8. AppleWebKit/537.36 (KHTML, like Gecko) Chrome/62.0.3202.94 Safari/537.36

    9. Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,

    10. image/apng,*/*;q=0.8

    11. Accept-Encoding: gzip, deflate

    12. Accept-Language: en-US,en;q=0.9

    13. If-Modified-Since: Mon, 13 Nov 2017 21:51:51 GMT

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 23
  md: "The server can send various responses back to your browser (the client). However,\
    \ the most common is a 200 OK response that looks like:\n\n```\nHTTP/1.1 200 OK\n\
    Server: nginx/1.12.2\nDate: Fri, 17 Nov 2017 00:31:35 GMT\nContent-Type: text/html\n\
    Transfer-Encoding: chunked\nConnection: keep-alive\nLast-Modified: Mon, 13 Nov\
    \ 2017 21:51:51 GMT\nContent-Encoding: gzip\n```\n\nAssuming everything is OK\
    \ with the header, the server sends HTML to the browser, so you should see the\
    \ web page shown in Figure 1.2.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_23_0.png)\n\
    \n# The Server and PHP\n\nAs previously mentioned, PHP runs with the web server\
    \ and is responsible for interpreting PHP code.\n\n# What the PHP Interpreter\
    \ Does\n\nWhen the web server encounters PHP code, it hands the code to the PHP\
    \ interpreter. The interpreter executes the code according to the rules of the\
    \ PHP language. Within the code, text will frequently need to be echoed or printed\
    \ out to the web page. This text will be sent from the PHP interpreter back to\
    \ the web server to be rendered as HTML back to the browser.\n\nLet’s take a look\
    \ at a simple web page with HTML and PHP integrated together that outputs today’s\
    \ date:\n\n```\n<html>\n  <head>\n    <title>My Awesome Page</title>\n  </head>\n\
    \  <body>\n    <h1>Today is <?php echo date(\"m-d-Y\"); ?></h1>\n  </body>\n</html>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 1. THE LIFE AND TIMES OF A PHP SCRIPT


    When the web browser encounters the <?php tag, everything from the opening <?php
    to the closing ?> tag is handed off to the PHP interpreter for processing. When
    the PHP script is done processing, any resulting HTML is sent back to the web
    server for output to the client.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_24_0.png)


    The output of the above script is shown in Figure 1.3.


    # The php.ini File and Important Settings


    The php.ini file is where we set and change directives to configure PHP. This
    file is read every time the web server is started or restarted, and it is how
    PHP is initialized. This file is well documented with comments regarding the various
    directives. Visit the PHP manual[1] for a detailed explanation of the php.ini
    directives. Many directives can affect the security and behavior of your application,
    so change them with care.


    To find the php.ini file used by the PHP interpreter, you can inspect the output
    of phpinfo() in a browser or look at the output of php -i at the command line.


    # Error Reporting Settings


    When working through this book, you should tell PHP to show any errors it encounters
    in your browser. You''ll get feedback about parse errors, uninitialized variables,
    and more. Otherwise, when you run your code, you may get the dreaded White Screen
    of Death (WSOD) when PHP encounters a syntax error like a missing semi-colon.
    In your php.ini file, check to verify that display_errors is enabled:


    ```

    display_errors = On;

    ```


    In a production environment, this setting should be off to prevent disclosing
    sensitive information.


    [1] PHP manual: http://php.net/ini'
