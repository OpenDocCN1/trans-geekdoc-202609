- pgno: 344
  md: '# 23. ADDING USER LOGINS


    Now that we are armed with proper techniques for securing our web applications
    let''s get back to our *Movie Listing* application. We need to make three significant
    changes to the application. First, we add individual logins with the ability to
    sign new users up. Second, we add a navigation menu to increase the ease of use
    of the application. And third, we incorporate a reservation system to allow users
    to check out movies and return them. We will also modify the application to only
    allow administrators to add, edit, and remove movies. Here is a detailed list
    of the modifications that we need to make to turn the *Movie Listing* application
    into a *Movie Reservations* application:


    +   1. **Adding Individual User Logins**

    +      1. Create a database table to hold information for users and their access
    privileges

    +      2. Create signup, login, and logout scripts for individual users

    +      3. Modify the `authorizeaccess.php` script to only allow users with `admin`
    access privileges to add, edit, and remove movies

    +   2. **Add a Navigation Menu to Increase Ease of Use**

    +      1. Create and integrate a navigation bar script to be used by multiple
    pages

    +   3. **Adding Reservation Features**

    +      1. Create a database table to hold information for movie reservations

    +      2. Add fields to the `movielisting` database table to keep track of the
    number of copies and reserved movies for each movie

    +      3. Modify the add and edit movie scripts to include the number of copies
    of a movie

    +      4. Modify the Movie listings page to show a link for reserving a movie
    for logged in users

    +      5. Modify the Movie listings page to show a link for removing a movie for
    users logged in with admin privileges

    +      6. Add a reservation script for users to check out movies

    +      7. Add a script for a shopping cart that allows users to reserve movies
    in their cart and remove them from their cart

    +      8. Add a shopping cart icon that allows users to view their cart

    +      9. Add a reserved movies script allowing users to check movies back in

    +      10. Add a reservations icon that allows users to view their reservations


    In this chapter, we modify the application to add individual user logins. We add
    the other features in the following two chapters.'
  merge: -1
  img_proc: true
