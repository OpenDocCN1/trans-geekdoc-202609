- pgno: 222
  md: "# 18. EDITING DATA USING THE WEB APPLICATION\n\nNotice the value attribute\
    \ is set to the value of the $movie_title variable. This variable comes from the\
    \ title field for this movie's row in the movieListing database table returned\
    \ by our earlier query.\n\n```\nvalue='< ?= $movie_title ?>'\n```\n\nThe value\
    \ attributes for these input fields need to be set for the movie title, director,\
    \ and running time:\n\n```\n... name=\"movie_title\" value=\"<?= $movie_title\
    \ ?>\" ...\n... name=\"movie_director\" value=\"<?= $movie_director ?>\" ...\n\
    ... name=\"movie_running_time_in_minutes\" value=\"<?= $movie_runtime ?>\" ...\n\
    ```\n\nThe value attributes also need to be set for the rating selection and the\
    \ genre checkboxes. However, they are a little trickier. First we will deal with\
    \ rating selection:\n\n```\n<select class=\"custom-select\" id=\"movie_rating\"\
    \ name=\"movie_rating\"\n    value=\"<?= $movie_rating ?>\" required>\n<option\
    \ value=\"\" disabled selected>Rating...</option>\n<option value=\"G\" <?= $movie_rating=='G'\
    \ ? 'selected' : '' ?>>G</option>\n<option value=\"PG\" <?= $movie_rating=='PG'\
    \ ? 'selected' : '' ?>>PG</option>\n<option value=\"PG-13\" <?= $movie_rating=='PG-13'\
    \ ? 'selected' : '' ?>>PG-13</option>\n<option value=\"R\" <?= $movie_rating=='R'\
    \ ? 'selected' : '' ?>>R</option>\n</select>\n```\n\nIn a select, only one option\
    \ can be selected by default. Therefore, I used the ternary operator (?:) to check\
    \ each option as it was added to the movie_rating select to test if this option\
    \ was equal to the rating for this movie. If the option was equal, I set this\
    \ option to selected. Otherwise, I set this option to an empty string ('').\n\n\
    Setting the value attributes for the genre checkboxes are also a little tricky\
    \ and required the use of the ternary operator. Similar to how we displayed the\
    \ checkboxes for “Genre” in addmovie.php, the code and markup in Listing 18.8\
    \ creates a checkbox input for each item in our genres array. Every genre checked\
    \ by the user gets added to the movie_genre_checkbox array—note the [] added to\
    \ the name attribute. Be aware that if the user does not select any genre, the\
    \ movie_genre_checkbox name attribute will not exist in the $_POST[] superglobal\
    \ array."
