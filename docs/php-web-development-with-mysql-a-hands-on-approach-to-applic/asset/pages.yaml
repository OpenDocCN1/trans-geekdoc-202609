  md: "# 18. Editing Data Using the Web Application\n\nListing 18.11.\n\n```\n```php\n\
    1. elseif (isset($_POST['edit_movie_submission'], $_POST['movie_title'],\n2. \
    \    $_POST['movie_rating'], $_POST['movie_director'],\n3.     $_POST['movie_running_time_in_minutes'],\
    \ $_POST['id_to_update']))\n4. {\n5.\n6.     $movie_title = $_POST['movie_title'];\n\
    7.     $movie_rating = $_POST['movie_rating'];\n8.     $movie_director = $_POST['movie_director'];\n\
    9.     $movie_runtime = $_POST['movie_running_time_in_minutes'];\n10.    $checked_movie_genres\
    \ = $_POST['movie_genre_checkbox'];\n11.    $id_to_update = $_POST['id_to_update'];\n\
    ```\n```\n\nWe also need to build a comma delimited string containing the movie\
    \ genre from the checkbox array. Add the following code next:\n\n```\n```php\n\
    $movie_genre_text = \"\";\n\nif (isset($checked_movie_genres))\n{\n    $movie_genre_text\
    \ = implode(\", \", $checked_movie_genres);\n}\n```\n```\n\nJust like the addmovie.php\
    \ script, a movie can have multiple genres. To store them all, we create a comma-delimited\
    \ list of the chosen genres from the checkbox array. We do this by calling the\
    \ implode()[4] function ONLY if the user selected at least one genre. If the user\
    \ doesn't choose any genres, the checkbox array does not exist. Therefore we need\
    \ to check that it is set first before calling implode(). If the user does not\
    \ select a genre, we insert an empty string into the genre field of the movielisting\
    \ table.\n\nNow that we have all the updated movie listing data in the form we\
    \ want, we can update the movieListing table with an SQL UPDATE query.\n\nA SQL\
    \ UPDATE query looks like this:\n\n```\n```sql\nUPDATE <table_name> SET <field_name>\
    \ = <value_[, ...]> WHERE <condition>\n```\n```\n\nThus, our query string and\
    \ call to mysqli_query() should look like Listing 18.12\n\n[4] implode(): https://php.net/implode"
