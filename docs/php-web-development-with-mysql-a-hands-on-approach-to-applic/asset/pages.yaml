  md: "# 3. WHY VARIABLES MATTER\n\n# Booleans\n\nA Boolean data type contains a logical\
    \ value that is either TRUE or FALSE. Boolean values are typically used in conditional\
    \ logic statements:\n\n```\n$passed_drivers_license_exam = TRUE;\n\nif ($passed_drivers_license_exam\
    \ == TRUE)\n{\n    echo \"Award driver's license.<br/>\";\n}\n```\n\nThe online\
    \ PHP documentation has more information about Boolean data types[4].\n\n# Integers\n\
    \nAn integer data type contains a whole number that can be negative, zero, or\
    \ positive. They are typically represented in the base-10 number system but can\
    \ be represented using base 2, 8, 10, or 16.\n\nFor more information, see the\
    \ PHP docs about integer data types[5].\n\n# Floats\n\nA floating-point data type\
    \ contains real numbers which can be expressed either using decimals and/or scientific\
    \ notation:\n\n```\n// Pascal to Pound per square inch\n$pa_to_psi = 0.000145037738;\n\
    \n// Pascal to Pound per square inch\n$pa_to_psi = 145037738e-12;\n\n// Pascal\
