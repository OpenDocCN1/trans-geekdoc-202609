- pgno: 225
  md: "# DRY?\n\n*This looks like we are repeating code from the addmovie.php script,\
    \ doesn't it? In this case, since we are using boiler-plate Bootstrap validation\
    \ code, it makes more sense to put the JavaScript code in an anonymous function\
    \ directly below the form.*\n\n# Pressing the Update Button\n\nThis is the second\
    \ intended way we will navigate to the editmovie.php page. Therefore we will be\
    \ dealing with the elseif block:\n\n```\n```php\nelseif (isset($_POST['edit_movie_submission'],\
    \ $_POST['movie_title'],\n    $_POST['movie_rating'], $_POST['movie_director'],\n\
    \    $_POST['movie_running_time_in_minutes'], $_POST['id_to_update'])) {\n```\n\
    ```\n\nWhen we get into this condition, it is because a user selected the **Update\
    \ Movie** submit button. Doing so POSTs back to editmovie.php with the form variables\
    \ edit_movie_submission, movie_title, movie_rating, movie_director, movie_running_time_in_minutes,\
    \ and id_to_update in the $_POST[] superglobal array. Note, because genre is optional\
    \ we do not check if it is set.\n\nSpeaking of id_to_update, notice I created\
    \ a hidden <input> element in the form and set it to the ID of the movie and set\
    \ the name attribute to id_to_update. When the form data is posted back to editmovie.php,\
    \ the ID is available in the $_POST[] superglobal array so that it can be updated\
    \ in the database:\n\n```\n```html\n<input type=\"hidden\" name=\"id_to_update\"\
    \ value=\"<?= $id_to_edit ?>\">\n```\n```\n\nWe need to do this to carry over\
    \ the ID of the movie that was sent using a query parameter when editmovie.php\
    \ was first called. Remember, HTTP requests and responses do not any state or\
    \ information.\n\n> *Please see the aside in the previous chapter titled: THE\
    \ WEB IS STATELESS!*\n\nUpon first entering a condition where either form or query\
    \ parameters are being passed in, I create separate variables for each. Again,\
    \ this is not required and can be just as readable if you created descriptive\
    \ name attributes for your form fields and access them using the $_POST super\
    \ global variable. However, I find it easier to type, and the purpose of the variable\
    \ stands out, assuming you use sufficiently descriptive names. Add the code in\
    \ Listing 18.11 immediately under and within the elseif line."
  merge: -1
  img_proc: true
