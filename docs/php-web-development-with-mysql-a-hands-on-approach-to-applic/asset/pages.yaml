- pgno: 86
  md: "# 8. VERIFYING VARIABLES AND TYPE CHECKING\n\n# Verifying Variables\n\nPHP\
    \ is most often used for developing web applications. As such, you need to get\
    \ data from your form entries. For security reasons and standard practice, you\
    \ want to verify the content of this input. Maybe you want to check if a user\
    \ entered anything at all into a field. You could use == to check for empty strings,\
    \ however it is better to use the built-in PHP functions isset()[1] and empty()[2].\
    \ isset() checks that a variable exists and is set. empty() checks that a variable\
    \ has any contents. See Listing 8.1.\n\n# Listing 8.1.\n\n```\n```php\n<?php\n\
    $word1 = 'flibertigibbits'; // $word1 is set, but not empty\n$word2 = '';    \
    \           // $word2 is set, but it is also empty\n\nif (isset($word1))\n{\n\
    \    echo '$word1 is set<br />';\n}\nelse\n{\n    echo '$word1 is NOT set<br />';\n\
    }\n\nif (empty($word1))\n{\n    echo '$word1 is empty<br />';\n}\nelse\n{\n  \
    \  echo '$word1 is NOT empty<br />';\n}\n\nif (isset($word2))\n{\n    echo '$word2\
    \ is set<br />';\n}\nelse\n{\n    echo '$word2 is NOT set<br />';\n}\n```\n```\n\
    \n[1] isset(): https://php.net/isset\n[2] empty(): https://php.net/empty"
  merge: -1
  img_proc: true
