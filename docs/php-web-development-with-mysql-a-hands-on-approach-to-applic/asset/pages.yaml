  md: "# Creating Parameterized Queries Using OOP\n\n```\n// Results in DSN = \"mysql:host=localhost;dbname=Student\"\
    \nprivate const DSN = self::DB_TECHNOLOGY\n    . ':host=' . self::DB_HOST\n  \
    \  . ';dbname=' . self::DB_NAME;\n\npublic function create($first_name, $last_name,\
    \ $email)\n{\n    $db = new PDO(self::DSN, self::DB_USER, self::DB_PASSWORD);\n\
    \n    // Insert a new record\n    $sql = \"INSERT INTO student(`first_name`, `last_name`,\
    \ `email`) VALUES (:first_name, :last_name, :email)\";\n\n    $db->setAttribute(PDO::ATTR_ERRMODE,\
    \ PDO::ERRMODE_EXCEPTION);\n\n    try\n    {\n        $query = $db->prepare($sql);\n\
    \        $query->bindParam(\":first_name\", $first_name, PDO::PARAM_STR);\n  \
    \      $query->bindParam(\":last_name\", $last_name, PDO::PARAM_STR);\n      \
    \  $query->bindParam(\":email\", $email, PDO::PARAM_STR);\n        $query->execute();\n\
    \    } catch (Exception $ex)\n    {\n        echo $ex->getMessage() . \"<br/>\"\
    ;\n    }\n\n    // Returns the primary key of this INSERT\n    return $db->lastInsertId();\n\
    }\n```\n\nThe constructor for instantiating a new PDO object takes three parameters:\
    \ a data source name, user name, and password, and when created, connects to the\
    \ database. When connecting to a MySQL database, the data source name must look\
    \ like this:\n\n```\n\"mysql:host=localhost;dbname=Student\"\n```\n\nThe constants\
    \ in lines 6–10 set the data source name, user name, and password input parameters\
    \ to the PDO constructor.\n\nLines 17 is our create() method that takes the first\
    \ and last name and the email address, which correspond to the three fields we\
    \ want to insert into the student table.\n\nTo use PDO, we instantiate a new object\
    \ on line 19, which creates the connection to our database."
