  md: "# 25. ADDING RESERVATION FEATURES\n\n# Checking Movies Reserved by Users\n\n\
    We’re going to need to know if a user has a movie reserved and the number of movies\
    \ a user has reserved. Since we make these queries often, it makes sense to create\
    \ functions in the queryutils.php script.\n\n# Create IsMovieReservedByUser()\
    \ Function\n\nLet’s create a function called isMovieReservedByUser(). It needs\
    \ two parameters: $movie_id and $user_id. Open the queryutils.php script and add\
    \ the header and function shown in Listing 25.23. This function queries the reservation\
    \ table of the Movie database for a row containing the given movieListing_id and\
    \ the given user_id. If a row is found in the database, the function returns true\
    \ otherwise false.\n\nListing 25.23.\n\n```\n```php\n/**\n * Purpose:     Determines\
    \ if a movie is currently reserved by a user\n *\n * Description: Given a movie\
    \ id and a user id, queries to see if this user has\n *              this movie\
    \ reserved. If so, true is returned, otherwise false.\n * @param        $movie_id\n\
    \ * @param        $user_id\n * @return bool  True if this movie is reserved by\
    \ this user, otherwise false.\n */\nfunction isMovieReservedByUser($movie_id,\
    \ $user_id)\n{\n    require_once('dbconnection.php');\n\n    $ret_val = false;\
    \ // Assume failure\n\n    $dbc = mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD,\
    \ DB_NAME)\n        or trigger_error(\n            'Error connecting to MySQL\
    \ server for ' . DB_NAME,\n            E_USER_ERROR\n        );\n\n    $query\
    \ = \"SELECT id FROM reservation\n        WHERE movieListing_id = ? AND user_id\
