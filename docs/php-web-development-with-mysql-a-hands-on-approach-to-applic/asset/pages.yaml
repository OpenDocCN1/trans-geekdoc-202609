    \ before the <!DOCTYPE html> element:\n\n```\n<?php\nrequire_once('pagetitles.php');\n\
    $page_title = MR_HOME_PAGE;\n?>\n<!DOCTYPE html>\n<html>\n```\n\nThis properly\
    \ sets our $page_title variable for use in navmenu.php which we include from pagetitles.php\
    \ and changes our page title from “Movies I Like” to “Movie Reservations”. Next,\
    \ in the <head> element, modify the <title> element with this code:\n\n```\n<html>\n\
    \  <head>\n    <link >\n    <title><?= $page_title ?></title>\n  </head>\n  <body>\n\
    ```\n\nThis changes our <title> element from Movies I Like to Movie Reservations.\
    \ Next, right below the <body> element, include the navmenu.php script:\n\n```\n\
    <body>\n<?php\n  require_once('navmenu.php');\n?>\n  <div class=\"card\">\n  \
    \  <div class=\"card-body\">\n```\n\nNext, inside the <div class=\"card-body\"\
    > element, modify the <h1> element to reference the $page_title instead of Movies\
    \ I Like:\n\n```\n<div class=\"card\">\n  <div class=\"card-body\">\n    <h1><?=\
    \ $page_title ?></h1>\n```"
