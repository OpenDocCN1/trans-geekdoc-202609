- pgno: 13
  md: '# # Foreword


    Almost a decade ago, I was running our local PHP user group, and Ken heard about
    and attended one of our events. He instantly became an ever-enthusiastic member
    of our community. Ken is always ready to say hi to everyone and make sure they
    feel welcome. On top of that, he is also always happy to give a talk, which is
    a surefire way to endear yourself to a user group leader. When we needed a new
    space to hold our meetings, Ken once again stepped up and volunteered his classroom
    space at the local tech college where he was teaching. It was a perfect fit with
    plenty of space, easy transportation access, a projector, and great Wi-Fi—a user
    group’s dream come true! Eventually, Ken made the mistake of mentioning that he
    wouldn’t mind helping more if we needed anything. He had barely finished saying
    that before I made him a co-organizer of the group.


    Throughout the years, Ken has been invaluable in building our amazing local PHP
    community. He has an infectious enthusiasm that draws people in, and his love
    of teaching is second to none. He doesn’t just teach the material, but he truly
    cares about helping his students succeed. Not only that, but you can always rely
    on him. When he started toying with the idea of writing a book, Ken wasn’t sure
    he would be able to finish the book, but I never doubted he would. I knew that
    once he agreed to do it, he would persevere and get it done. That’s just the kind
    of person Ken is.


    Ken’s teaching style focuses on real-world skills and hands-on practice. This
    book is no exception. When you are done with this book, you will have working
    examples of code talking with databases and interacting with users. You will have
    a good understanding of what happens during these interactions, which will help
    you immensely during your future debugging sessions and give you a solid foundation
    to stand on as you learn about more advanced programming techniques, frameworks,
    and libraries.


    So even though Ken and I agree to disagree on specifically which framework you
    should learn next, I am so grateful for his love of PHP and his love of sharing
    knowledge with others. Our community is far better for having Ken around, and
    I’m so excited for you to get to know him a bit through this book.


    Welcome to the PHP community. We are glad you are here!


    – Beth Tucker Long, July 2021'
  merge: -1
  img_proc: true
