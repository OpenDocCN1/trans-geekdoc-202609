  md: '# 12. INSERTING DATA INTO A MYSQL DATABASE


    Let''s say instead, we want to retrieve ALL the rows in the products table, but
    we only want data from the id, product_name, list_price, and reorder_level columns.
    We would issue the following command:


    ```

    SELECT id, product_name, list_price, reorder_level FROM products;

    ```


    You should see a potentially long list of rows as in Figure 12.13 and 12.14.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_124_0.png)


    Or maybe we just want to retrieve the same information as above, but just products
    where the reorder level is greater than 25. We need to qualify the rows we are
    going to retrieve using a WHERE clause. Our query would look like this:


    ```

    SELECT id, product_name,

    list_price, reorder_level

    FROM products

    WHERE reorder_level > 25;

    ```


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_124_1.png)


    Figure 12.15 shows the matching rows.


    We can have multiple criteria in our WHERE clause as well by adding a boolean
    value. For example, we might be interested in only the products with a reorder_level
    greater than 20 AND less than 100. We would use a query like this:


    ```

    SELECT id, product_name, list_price, reorder_level

    FROM products

    WHERE reorder_level > 20 AND reorder_level < 100;

    ```


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_124_2.png)'
