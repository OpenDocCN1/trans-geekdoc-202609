- pgno: 166
  md: "# 15. DISPLAYING A LIST OF ITEM DETAILS\n\nPOST is intended to change the state\
    \ on the server. As such, POST is typically used in forms and with file uploads.\n\
    \n```\n<form method=\"POST\" action=\"doSomethingGood.php\">\n```\n\nGET can be\
    \ sent from a form as well (set the method attribute to GET). But it assumes the\
    \ data is not being saved or persisted in any way. One typical use is a search\
    \ format to send the keywords you want to find.\n\n```\n<form method=\"GET\" action=\"\
    doSomethingGreat.php\">\n```\n\nWhen a URL includes query parameters, this is\
    \ a GET request.\n\n```\n<a href=\"moviedetails.php?id=1&title=Sleepless%20in%20Seattle\"\
    >Sleepless in Seattle</a>\n```\n\nQuery parameters are sent in URLs as key-value\
    \ pairs. So, in the above href example, id is the key and 1 is its value, and\
    \ title is the next key, and Sleepless in Seattle is its value. When sending multiple\
    \ query parameters, separate them with an ampersand (&), as is seen following\
    \ 1 and preceding title. One other thing to note is that spaces are represented\
    \ in a URL using the percent character (%20). Several other symbols with special\
    \ meaning in a URI must also be encoded. PHP's http_build_query()[3] simplifies\
    \ building complicated query strings.\n\nBuilding query parameters for links in\
    \ PHP from row data returned from mysqli_fetch_assoc() could look like this:\n\
    \n```\nwhile($row = mysqli_fetch_assoc($result))\n{\n    echo \"<tr><td>\" .\n\
    \    \"<a class='nav-link' href='moviedetails.php?id=' . $row['id'] .\n    \"\
    &title=\" . $row['title'] . \"'>\" . $row['title'] . \"</a></td></tr>\";\n}\n\
    ```\n\nWhen sending query parameters originating from database queries, a more\
    \ secure practice is to send only the primary key field and query the other fields\
    \ needed from the database within the destination script.\n\n[3] http_build_query():\
    \ https://php.net/http_build_query"
