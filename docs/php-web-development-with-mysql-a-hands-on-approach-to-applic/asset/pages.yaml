  md: '# 26. INTRODUCTION TO OBJECT-ORIENTED PROGRAMMING IN PHP


    Object-Oriented Programming (OOP) is a programming paradigm that allows for a
    more modular way to develop programs. Many modern programming languages have OOP
    features, and PHP is no exception. There are many conceptual components to OOP.
    At its most basic level, it allows for combining what a program knows (its data)
    and what a program does (its functionality) into modular components. This approach
    is different from basic procedural-based programming, where you have many functions
    separated from the data that they typically work on. This chapter gives a brief
    overview of object-oriented programming using PHP.


    Since this book covers web development using PHP, I cover the more common uses
    of OOP supported by the language. If you want to learn more about the principles
    and design practices of OOP, I would recommend David Kung’s book: *Object-Oriented
    Software Engineering: An Agile Unified Methodology*¹ published by McGraw-Hill
    Education.


    I briefly cover the following topics:


    +   - Classes

    +   - Properties

    +   - Encapsulation using access modifiers

    +   - Accessor Methods (Getters/Setters)

    +   - The $this variable

    +   - General Purpose Methods

    +   - Instantiating and using a class

    +   - Validating input to a Setter Method

    +   - Inheritance

    +   - Overriding Methods

    +   - Constructors

    +   - PHP Database Objects (PDO)


    # Classes


    Classes organize code into modular components. It is typical to put a single class
    into its own file. In PHP, you define a class using the class keyword:


    ```

    <?php

    class Radio

    {

    }

    ```


    [1] *Object-Oriented Software Engineering: An Agile Unified Methodology*: http://phpa.me/mhws-oop-engineering'
