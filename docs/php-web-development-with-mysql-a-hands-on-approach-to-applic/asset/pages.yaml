- pgno: 378
  md: "# 24. ADDING A NAVIGATION MENU\n\nThis chapter adds a navigation bar (otherwise\
    \ known as a “navbar”) to the top of our *Movie Reservations* application. A navbar\
    \ makes it much more user-friendly to navigate around the application. With a\
    \ few exceptions, we want our navbar to display on all the pages in our application.\
    \ Additionally, we want our navbar to be context-sensitive. That is, it should\
    \ indicate or hint what page we are on and display links we have access to based\
    \ on our privileges. When we first navigate to the Home page, without being logged\
    \ in, this is what we want our navbar to look like Figure 24.1.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_378_0.png)\n\
    \n# Create Navbar Logic\n\nSince almost every page in our application will be\
    \ displaying a navbar, we will create a script to be included by these pages.\
    \ Create a script called navmenu.php and add this PHP code at the very top that\
    \ checks the $page_title variable of the page that included this script:\n\n```\n\
    ```php\n<?php\n    $page_title = isset($page_title) ? $page_title : \"\";\n?>\n\
    ```\n```\n\n> > *It is crucial that the opening PHP tag <?php is the first thing\
    \ in your file (no spaces preceding) as this code runs before HTML headers are\
    \ sent.*\n\nRemember we set the variable $page_title to one of the definitions\
    \ created in pagetitles.php in the scripts that include navmenu.php (e.g. index.php,\
    \ login.php, etc.).\n\nSince we are using session variables in our application\
    \ and navmenu.php will be included by most every script, let's add the following\
    \ code after the $page_title check that starts or resumes our session:\n\n```\n\
    ```php\n<?php\n    $page_title = isset($page_title) ? $page_title : \"\";\n\n\
    \    if (session_status() == PHP_SESSION_NONE)\n    {\n        session_start();\n\
    \    }\n?>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 379
  md: "Notice, we call session_start() only after checking to see that none already\
    \ exists. You could certainly make the call with error suppression (e.g. @session_start()),\
    \ however, I usually frown on that sort of behavior.\n\n> The navbar is part of\
    \ the HTML <body>, so we assume the Bootstrap style sheet was already included\
    \ in the <head> section of the including script.\n\nAdd the code in Listing 24.1\
    \ after the closing PHP tag (?>), and I will explain it in the following paragraphs.\n\
    \n# Listing 24.1.\n\n```\n```php\n1. <?php\n2. $page_title = isset($page_title)\
    \ ? $page_title : \"\";\n3. \n4. // ...\n5. session_start();\n6. }\n7. ?>\n8.\
    \ <nav class=\"navbar sticky-top navbar-expand-md navbar-dark\"\n9.     style=\"\
    background-color: #569f32;\">\n10. <a class=\"navbar-brand\" href=\"<?= dirname($_SERVER['PHP_SELF'])\
    \ ?>\"\n11.     <img src=\"resources/movie_rental_icon.png\" width=\"30\" height=\"\
    30\"\n12.         class=\"d-inline-block align-top\" alt=\"\">\n13.     <?= MR_HOME_PAGE\
    \ ?>\n14. </a>\n15. <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"\
    collapse\"\n16.     data-target=\"#navbarNavAltMarkup\" aria-controls=\"navbarNavAltMarkup\"\
    \n17.     aria-expanded=\"false\" aria-label=\"Toggle navigation\">\n18.     <span\
    \ class=\"navbar-toggler-icon\"></span>\n19. </button>\n20. <div class=\"collapse\
    \ navbar-collapse\" id=\"navbarNavAltMarkup\">\n21.     <div class=\"navbar-nav\"\
    >\n22.     <a class=\"nav-item nav-link<?= $page_title == MR_HOME_PAGE ? ' active'\
    \ : '' ?>\"\n23.         href=\"<?= dirname($_SERVER['PHP_SELF']) ?>\">Home </a>\n\
    24. \n25. </div>\n26. </nav>\n```\n```"
