- pgno: 322
  md: '# 22. CREATING SECURE WEB APPLICATIONS


    Since this is a book on web development, I would be remiss if I did not spend
    time on web application security. Most people—developer or not—have heard about
    the horrific data breaches that occurred over the past ten or so years. The most
    significant breach to date was the Equifax data breach reported in September of
    2017, where hundreds of millions of customer credit records were stolen—basically,
    more than 70% of all adults in the U.S. Ironically, the Equifax breach was a result
    of a vulnerability in the Apache webserver having to do with the Java Struts framework
    that was not patched. However, there are plenty of vulnerabilities that can be
    prevented by developers properly securing their web applications.


    Web security is a deep topic, and I can only scratch its surface. At the end of
    this chapter, I list some references you can read to dive deeper into the subject.
    That said, a reference that every developer must become familiar with is the Open
    Web Application Security Project[1] (OWASP) site. The two resources I find most
    useful on it are the OWASP Top Ten[2] and the OWASP Cheat Sheet Series[3]. The
    “OWASP Top Ten” lists the top ten security risks present in web applications today
    and has helpful links describing the vulnerability and how to mitigate the risk
    effectively. The “OWASP Cheat Sheet Series” has a collection of security information
    organized by topic. Each article explains the vulnerability and gives recommendations
    for how to mitigate the risks.


    This chapter discusses the more common vulnerabilities, what they look like, and
    how to mitigate them in your application.


    # Secure Password Protection for Authenticating


    This scenario is a subset of the third top application security risk (ASR) from
    the “OWASP Top Ten”.


    # SHA-1 Is Not Secure


    I taught one of my PHP web development courses from a book that used the example
    of securing user passwords with Secure Hash Algorithm 1-SHA-1. Unfortunately,
    since 2005, SHA-1 was no longer considered secure for protecting data. SHA-1 hashed
    passwords, once obtained by an attacker, can be cracked offline with sufficient
    processing power. In 2017, Google successfully cracked the SHA-1 algorithm using
    a collision attack. The bad thing about using hashing algorithms like SHA-1 or
    even SHA-256, which has not been cracked, for storing passwords is that an attacker
    can generate the hashes quickly. As a result, hashes are


    > [1] Open Web Application Security Project: https://owasp.org

    > [2] OWASP Top Ten: https://owasp.org/www-project-top-ten/

    > [3] OWASP Cheat Sheet Series: https://cheatsheetseries.owasp.org'
