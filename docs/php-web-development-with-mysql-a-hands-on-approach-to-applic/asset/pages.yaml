- pgno: 47
  md: '# Strings


    A string is a group of characters enclosed in either single ('') or double (")
    quotes. The type of opening quote must match the closing quote:


    ```

    echo "This is a string";

    echo ''This is also a string'';

    echo "This is a string with ''singe-quotes'' embedded";

    echo ''This is a string with "double-quotes" embedded'';

    ```


    If you have a string surrounded by double-quotes (") you can contain a double-quote
    in your string by escaping it with the back-slash (\). Likewise, you can embed
    single-quotes by escaping them if they are inside of a string surrounded by single-quotes:


    ```

    echo "This is a string surrounded by \\";

    echo ''I don\''t like using contractions'';

    ```


    See the PHP manual for more information about string data types[7].


    # Compound Data Types


    PHP defines several “compound” data types which allow you to contain or aggregate
    multiple pieces of data of the same data type under a single entity. PHP supports
    the following compound data types:


    +   - array

    +   - object

    +   - callable

    +   - iterable


    # Array


    Arrays in PHP are ordered maps, which are a way to associate a key with its corresponding
    value. Therefore, arrays in PHP are known as “associative arrays.”


    An array is created using the array() language construct. Here’s how to create
    an empty array:


    ```

    $fahrenheit_temperatures = array();

    ```


    [7] string data types: http://php.net/language.types.string'
