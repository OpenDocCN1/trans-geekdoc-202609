- pgno: 196
  md: "# 17. REMOVING DATA USING THE WEB APPLICATION\n\nIn this chapter, we add the\
    \ ability to remove movie listing data to our *Movie Listing* application.\n\n\
    In addition to providing a mechanism to add movies, it also seems reasonable to\
    \ provide the means for removing movies using a web interface. So, let us add\
    \ a script that allows the user to remove movie listing data.\n\n> > *Note that\
    \ you generally want to limit access to who can remove items from a database.*\
    \  \n> > *In a follow-on chapter on [security], I will show you how to properly\
    \ limit access to a web application's ability to remove data through user logins.*\n\
    \n# Adding Deletion Links to Movie Listings\n\nThere are several ways we could\
    \ design our *Movie Listing* application to include the ability to remove movies.\
    \ I have chosen to add links to each movie listing on the main “Movies I Like”\
    \ index.php page for removing each movie. If we use an icon that looks like a\
    \ trashcan, the purpose of the link should be apparent as in Figure 17.1\n\nEach\
    \ trashcan link will take us to the (yet to be written) removemovie.php script\
    \ and send over the primary key of the specified movie (from the movielisting\
    \ table) as a query parameter.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_196_0.png)"
  merge: -1
  img_proc: true
