    # Creating the “Northwind” Database


    To demonstrate some of the functionality of MySQL, let’s download a famous sample
    database Microsoft created years ago for teaching people how to use the Access
    database application. Since then, it has been ported to support IIS and MySQL.
    The Northwind database holds sales, inventory, and employee data for the fictitious
    company called “Northwind Traders.”


    First, we need to create an empty database using SQL. We do that by typing the
    following command in the MySQL CLI tool (Figure 12.3).


    ```

