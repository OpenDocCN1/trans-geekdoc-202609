  md: "# Modifying the Form to Allow Uploads\n\nWe need to add two main things to\
    \ our addmovie.php form to enable the uploading of files. First we need to add\
    \ the enctype attribute to the <form> element and set it to multipart/form-data:\n\
    \n```\n<form enctype=\"multipart/form-data\" ...>\n```\n\nWhen files are uploaded\
    \ using a form, the file data is contained in the form data. By setting the enctype\
    \ attribute of the <form> element to multipart/form-data, the browser knows to\
    \ include the file data in the form data when sent to the webserver.\n\nSecondly,\
    \ we must add a file input element to the form:\n\n```\n<input type=\"file\" class=\"\
    form-control-file\"\n    id=\"movie_image_file\" name=\"movie_image_file\">\n\
    ```\n\nAdd the file input element within a Bootstrap form-group row right before\
    \ the submit button in your form like in Listing 19.1.\n\n# Listing 19.1.\n\n\
    ```\n1. </div>\n2. <div class=\"form-group row\">\n3.     <label for=\"movie_image_file\"\
    \n4.         class=\"col-sm-3 col-form-label-lg\">Movie Image File</label>\n5.\
    \     <div class=\"col-sm-8\">\n6.         <input type=\"file\" class=\"form-control-file\"\
    \n7.             id=\"movie_image_file\" name=\"movie_image_file\">\n8.     </div>\n\
    9. </div>\n10. <button class=\"btn btn-primary\" type=\"submit\"\n11.     name=\"\
    add_movie_submssion\">Add Movie</button>\n12. </form>\n```\n\nAdding file upload\
    \ capability adds a bit of code to our script. Therefore, it would be best to\
    \ decouple as much of the file handling capability from the addmovie.php script\
    \ as possible and put this capability into its own set of functions. This separation\
    \ is a good design decision since we will utilize this functionality in our “Edit\
    \ a Movie” page as well. Therefore, create a separate script for holding image\
    \ file functionality."
  merge: -1
  img_proc: true
- pgno: 242
  md: '# # 19. WORKING WITH FILES AND FEATURE ADDITIONS TO EXISTING CODE




    When uploading an image file to the server, there are two things we need to take
    into consideration:


    +   1. what type(s) of image files we want to allow,

    +   2. and how big of a file do we want to allow.


    For security, we want to ensure users only upload image files (of the image types
    we support) so users do not upload any executable files. Also, we want to limit
    the size so that we do not run out of storage space and the web server does not
    crash. Before saving an uploaded file to our images/ folder, we should validate
    the file meets these considerations, and there were no errors in the file upload.
    The $_FILES super global variable contains all of the information about an uploaded
    file.




    The ability to upload files is typically done with a form. All the information
    about and including the file is contained in the $_FILES super global variable.
    The $_FILES superglobal variable is a two-dimensional associative array. The first
    dimension is set to the name attribute of the file input element, which is movie_image_file
    in this case. PHP sets the second dimension to different attributes about the
    uploaded file.


    | Attribute Name | Attribute Meaning | Attribute Value |

    | --- | --- | --- |

    | `$_FILES[''movie_image_file''][''name'']` | the name of file | serenity_movie.jpg
    |

    | `$_FILES[''movie_image_file''][''type'']` | the image type | image/jpg |

    | `$_FILES[''movie_image_file''][''size'']` | the image size in bytes | 214480
    |

    | `$_FILES[''movie_image_file''][''tmp_name'']` | the temporary storage location
    of the file on the server | /tmp/phpV9CAHI |

    | `$_FILES[''movie_image_file''][''error'']` | the error code for the file upload;
    0 is good | 0 |


    > [1] The PHP documentation has a complete explanation of all the error codes
    that can be found in $_FILES[''movie_image_file''][''error''] as a result of uploading
    a file, see: https://php.net/features.file-upload.errors'
  merge: -1
  img_proc: true
- pgno: 243
  md: "# Validating Uploaded Movie Image Files\n\nAs mentioned earlier, we want to\
    \ limit the size and the image type of the uploaded image file. We want to restrict\
    \ our images to either JPEGs, PNGs, or GIFs. We also want to make sure the file\
    \ is uploaded without error. Since we will often refer to the size limit, it is\
    \ best to create a constant for this maximum file size and put it in a separate\
    \ file that other scripts can include.\n\nCreate a new PHP script called movielistingfileconstants.php\
    \ and add the following code:\n\n```\n<?php\n// Movie Listing File Constants\n\
    define('ML_MAX_FILE_SIZE', 524288);\n```\n\n> In the php.ini configuration file,\
    \ a couple of settings affect file uploads. By default, these settings should\
    \ already be enabled:\n> \n> - post_max_size = (some number)M\n> - upload_max_filesize\
    \ = (some number)M\n> - file_uploads = TRUE\n> \n> post_max_size controls the\
    \ total size of your post request while upload_max_filesize controls the max size\
    \ of each file uploaded. The sum of file sizes can't exceed the maximum size of\
    \ the post request. The M suffix signifies megabytes.\n> \n> In the apache2.conf\
    \ configuration file ensure the following setting is enabled correctly:\n> - LimitRequestBody\
    \ sets a limit on how large a post request can be.\n> \n> So, in order to have\
    \ working uploads for your PHP scripts, these three numbers have to be set correctly:\
    \ LimitRequestBody = post_max_size > upload_max_filesize\n\nNext, create another\
    \ new PHP script called movieimagefileutil.php. This file is where we put functions\
    \ that work with movie image files.\n\nAdd the following require_once() statement\
    \ to movieimagefileutil.php to include movielistingfileconstants.php:\n\n```\n\
    <?php\nrequire_once 'movielistingfileconstants.php';\n```"
  merge: -1
  img_proc: true
- pgno: 244
