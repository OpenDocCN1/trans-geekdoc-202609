- pgno: 320
  md: '# The Database


    Of course, the database is one of the best tools we have for persisting data for
    as long as we want. I do not need to go into how to use the database here since
    you already know how to do that. Therefore, remember many of our persistence problems
    can be solved using the database.


    # Best Practices in Solving the Persistence Problem


    It is essential to recognize the reason cookies and session variables were created
    in the first place. They were designed to solve the persistence problem due to
    the stateless behavior of the web. They’re still helpful for saving bits of data
    between pages for a short amount of time that we don’t need to save permanently
    to the database.


    The problem with cookies is that they live on the browser and are therefore insecure,
    or at least not trustworthy. The next option is session variables. Since these
    live on the server, they are more secure. However, they only last as long as the
    session is active. So for small pieces of data that you want to retain for the
    session’s life, session variables make sense.


    So how do we solve the problem of wanting to log out of a tax preparation application,
    and then when we log in, we want to resume right where we left off? This case
    is where using the database is a superior solution. Nothing stops us from having
    a database table tied to a user that identifies where they are in the workflow
    of their tax preparation, for example.


    One thing to note is that when you use session variables, you create a cookie
    on the browser that stores the session ID. This result is necessary since a user
    may have multiple tabs open to the same application, and we need a practical way
    to tie a user’s browser to a session.


    # Exercises


    +   1. Create cookies.php to ask a user their favorite cookie and store it in
    their browser.

    +   2. Add a field to ask a user their favorite flavor of ice cream and store
    it in a cookie. Display their ice cream preference below the form.

    +   3. Create sessionvariables.php to store the favorite cookie for a user.

    +   4. Create a select menu with the four seasons, Spring, Summer, Winter, and
    Fall. Ask a user to pick their preferred season, store it as a session var, and
    display the choice.'
