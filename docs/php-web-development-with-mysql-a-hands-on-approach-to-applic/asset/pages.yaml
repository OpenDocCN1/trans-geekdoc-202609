  md: "# Handling File Upload Errors\n\nTo handle errors encountered when a user tries\
    \ to upload a file, we need to modify the above code. But, first, let's add an\
    \ else condition after the if so we can output the error message as in Listing\
    \ 19.11.\n\n# Listing 19.11.\n\n```\n1. if (empty($file_error_message))\n2. {\n\
    3.     //...\n4. }\n5. else\n6. {\n7.     // echo error message\n8.     echo \"\
    <h5><p class='text-danger'>\" . $file_error_message . \"</p></h5>\";\n9. }\n```\n\
    \nNote that the form is redisplayed if this else executes because display_add_movie_form\
    \ will already be set to true.\n\nBefore we get back to modifying the code in\
    \ the if block, let's make the form sticky to handle the error condition in the\
    \ else block. Near the top of the script, just below the line initializing $display_add_movie_form\
