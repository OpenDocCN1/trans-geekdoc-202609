- pgno: 469
  md: '# Track Date of Reservation


    Currently, the database does not track when a user checked out a movie or provide
    a due date for returning them. Adding these would allow administrators to ensure
    someone doesn''t keep a movie copy out indefinitely.


    # Add Reservation Management Features for Administrator


    Many of the features that we developed for the Movie Reservation app focused on
    the user. To streamline site administration, it would be nice to have the following
    administrative features:


    +   1. A table showing reserved movies

    +      - Clicking on a movie brings up a page listing each user that has each
    movie checked out

    +      - Clicking on a user links to the page listing only the movies that the
    user has reserved

    +   2. A table listing users that have one or more movies reserved

    +      - Clicking on a user brings up a page listing the movies they have checked
    out

    +   3. Ability to manage lost movies


    # Flaws in This Application


    There is quite a bit of duplicate code in some of these pages, especially the
    boilerplate Bootstrap links. You should move this duplicate code into its own
    header page to be included by all other scripts that need it.


    There a several design issues with this application as well.


    One problem is if a user has movies in their cart and they log out, the movies
    are reserved without the user actively reserving them. Putting a movie in the
    shopping cart actually reserves the movie in the reservation table. A better design
    for managing movies in a cart would have a database table that maintains movies
    that are currently in all users’ shopping carts at any one time (i.e., multiple
    users are logged in adding movies to their carts). Then, we only create the reservation
    once they decided to reserve the movies in their cart. This change adds complexity
    but is a more robust solution by keeping shopping cart items out of the reservation
    table. Another potential solution is to remove all the reservations when users
    log out before reserving the movies in their shopping cart. It would also be a
    good idea to pop up a modal dialog letting the user know of the situation and
    allow them to either reserve the movies or continue to log out. The shopping table
    maintaining users’ shopping'
