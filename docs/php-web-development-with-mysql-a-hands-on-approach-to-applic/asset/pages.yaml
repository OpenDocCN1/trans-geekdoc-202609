- pgno: 324
  md: '# 22. CREATING SECURE WEB APPLICATIONS


    This is why everyone tells you to create strong, random passwords and use a password
    generator tool like LastPass or 1Password.


    Let me try to crack a password I generated with my password management tool 1Password:


    ```

    RbkboCLYoPKisqKFKV2ikXvV

    ```


    This results in the generated SHA-256 hash of:


    ```

    7931791FBDBB854240378D6AD728A1D2A1EA5DE763315D71BFAF85DEA819AF5B

    ```


    When I head over to CrackStation and try to crack this hash, it fails, as shown
    in Figure 22.3.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_324_0.png)


    > What about MD5? Everything in this section applies doubly to another commonly
    abused hashing function, md5(). Many older PHP articles on building login systems
    use this hashing function. However, it is eminently crackable because it is designed
    to generate hashes quickly. Therefore, no one should ever use MD5 for passwords.


    # Salted Passwords


    These rainbow tables only work on hashed values that are unsalted. What is a “salt,”
    and how does this apply to password hashes? A salt is a string added to make a
    password hash output unique. Randomly generated salts make the hash output unique
    even if multiple users use the same password. Every user must have a unique salt
    for this to work.


    Let’s say two users of my web application choose the same password: ilikebananas.
    To avoid the problems of this password ending up in a rainbow table, I want to
    use a password hashing algorithm that generates a unique hash for each of these
    users. First, this algorithm generates a random salt value. Then, when the first
    user signs up, we get a salt value similar to the following:


    ```

    saEEWZTmyiIkLQ0U2MLw9e

    ```'
