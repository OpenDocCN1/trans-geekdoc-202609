  md: '# 26. INTRODUCTION TO OBJECT-ORIENTED PROGRAMMING IN PHP


    We create our SQL statement on line 22 to insert the data into the student table.
    Notice that instead of using ? and relying on the order of them, we can create
    named parameters using an arbitrary name preceded by a colon (:):


    ```

    $sql = "INSERT INTO student(`first_name`, `last_name`, `email`)\n        VALUES
    (:first_name, :last_name, :email)";

    ```


    Here we use :first_name, :last_name, and :email as our named parameters that we
    will bind the incoming parameters of $first_name, $last_name, and $email to.


    Line 25 allows us to enable error reporting and exception handling by setting
    a couple of PDO class constant attributes. Doing so allows us to use Exceptions
    to handle database errors without the complexity of too much conditional logic.


    ```

    $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);

    ```


    > I haven''t covered exception handling, but a simple explanation is that it allows
    us to try executing some code that might cause some exceptional behavior (like
    not being able to query a database table successfully). If an exception occurs,
    we can catch it in an orderly fashion that hopefully allows our application to
    recover gracefully. If everything runs correctly in the try block, the catch block
    does not execute.


    The OOP way of preparing and binding our parameters is handled in these lines
    of the try block:


    ```

    $query = $db->prepare($sql);\n$query->bindParam(":first_name", $first_name, PDO::PARAM_STR);\n$query->bindParam(":last_name",
    $last_name, PDO::PARAM_STR);\n$query->bindParam(":email", $email, PDO::PARAM_STR);

    ```


    First, we call the prepare() method of the PDO object passing in the SQL statement
    as an argument that returns a PDOStatement object we assign to a variable we''ll
    call $query. This is the object we bind our parameters to. Notice the third parameter
    to the bindParam() method is a PDO class constant specifying the data type. Although
    this argument is optional, you should explicitly include it so that PDO escapes
    your data type correctly.


    Then we execute the query with this call:


    ```

    $query->execute();

    ```'
