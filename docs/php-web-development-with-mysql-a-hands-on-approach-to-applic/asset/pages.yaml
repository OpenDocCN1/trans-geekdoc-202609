  md: '# 13. RETURNING DATA FROM A MYSQL DATABASE


    In the previous chapter, we created a database with a table for holding a first
    and last name. In this chapter, we''ll query data from that table and display
    it on a webpage.


    If you recall, when we were using the MYSQL CLI tool, I introduced the SQL SELECT
    command that shows all the rows in a table:


    ```

    SELECT * FROM fullName;

    ```


    This query gives us the output seen in Figure 13.1.


    Within PHP, we can use the mysqli function calls to retrieve data from our database
    queries and write code that allows us to display our results to the webpage.


    We already know how to use mysqli_connect() and mysqli_query() to connect to and
    query our database. With the function mysqli_fetch_assoc(), I''ll show you how
    to iterate through the rows you get back from your queries.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_138_0.png)


    # Returning Database Rows in a PHP Application


    # Querying for Data from the fullName Table


    We know that if we want to display the results for all the fields (first_name,
    and last_name) in the fullName table, we can use the SQL SELECT command with the
    *:


    ```

    SELECT * FROM fullName;

    ```


    However, let''s assume we only want to display the results for the first_name
    field. We need to use this query:


    ```

    SELECT first_name FROM fullName;

    ```


    Testing this in the MYSQL CLI tool, we see Figure 13.2.


    Our query string in our PHP code looks like this:


    ```

    $query = "SELECT first_name FROM fullName";

    ```


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_138_1.png)'
  merge: -1
  img_proc: true
- pgno: 139
  md: "# Returning Database Rows in a PHP Application\n\nWhen we pass our query string\
    \ to mysqli_query(), this function returns the results of our query so we need\
    \ to assign it to a variable:\n\n```\n$result = mysqli_query($dbc, $query)\n \
    \   or trigger_error('Error querying database.');\n```\n\nThe $result variable\
    \ contains the results of our query, which is all the rows in the fullName table\
    \ for the first_name field.\n\n# Looping Through the Row Set\n\nSince the query\
    \ results return the entire row set, we need a mechanism to operate on each row\
    \ in the results. This scenario is where the function mysqli_fetch_assoc() comes\
    \ into play.\n\nThe manual reference for mysqli_fetch_assoc()[1] says this function\
    \ returns an associative array that corresponds to the fetched row or NULL if\
    \ there are no more rows. The field names in the table you are querying are the\
    \ keys of the associative array, whereas the values will contain the data in that\
    \ row for the key/field.\n\nFor example, consider the snippet of PHP code in 13.1.\n\
    \n# Listing 13.1.\n\n```\n1. <?php\n2.\n3. $dbc = mysqli_connect('localhost',\
    \ 'testuser', 'testuser', 'FullName')\n4.     or trigger_error('Error connecting\
    \ to MySQL server.', E_USER_ERROR);\n5.\n6. $query = \"SELECT first_name FROM\
    \ fullName\";\n7.\n8. $result = mysqli_query($dbc, $query)\n9.     or trigger_error('Error\
    \ querying database.', E_USER_ERROR);\n10.\n11. // show first row\n12. $row =\
    \ mysqli_fetch_array($result);\n13.\n14. echo \"First Name: <strong>\" . $row['first_name']\
    \ . \"</strong>\";\n15.\n16. // show second row\n17. $row = mysqli_fetch_array($result);\n\
    18.\n19. echo \"<br/>First Name: <strong>\" . $row['first_name'] . \"</strong>\"\
    ;\n```\n\n[1] mysqli_fetch_assoc(): http://php.net/mysqli-result.fetch-assoc"
  merge: -1
  img_proc: true
- pgno: 140
  md: "# 13. RETURNING DATA FROM A MYSQL DATABASE\n\nThis code produces the output\
    \ shown in Figure 13.3.\n\nIn the above code, the first call to mysqli_fetch_assoc()\
    \ immediately following the call to mysqli_query() will return the first row in\
    \ the table. The manual entry for mysqli_fetch_assoc() does not clarify that subsequent\
    \ calls to mysqli_fetch_assoc() return the next row in the table unless there\
    \ are no more rows.\n\nSo, if we add the following code to the end of our example:\n\
    \n```\n$row = mysqli_fetch_assoc($result);\n\necho \"<br/>First Name: <strong>\"\
    \ . $row['first_name'] . \"</strong>\";\n?>\n```\n\nWe will see output like Figure\
    \ 13.4.\n\nIn the case there are no more rows in the table, NULL is returned.\
    \ We can use this to our advantage by placing the mysqli_fetch_assoc() call in\
    \ a while loop that checks for NULL.\n\nSo, if I want to output all the first\
    \ names from the fullName table to the web page, I could use the code in Listing\
    \ 13.2.\n\n# Listing 13.2.\n\n```\n<?php\n$dbc = mysqli_connect('localhost', 'testuser',\
    \ 'testuser', 'FullName')\n    or trigger_error('Error connecting to MySQL server.',\
    \ E_USER_ERROR);\n\n$query = \"SELECT first_name FROM fullName\";\n\n$result =\
    \ mysqli_query($dbc, $query)\n    or trigger_error('Error querying database.',\
    \ E_USER_ERROR);\n\nwhile ($row = mysqli_fetch_array($result))\n{\n    echo \"\
    <br/>First Name: <strong>\" . $row['first_name'] . \"</strong>\";\n}\n```\n\n\
    Figue 13.5 shows the output produced.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_140_0.png)\n\
    \n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_140_1.png)\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_140_2.png)"
