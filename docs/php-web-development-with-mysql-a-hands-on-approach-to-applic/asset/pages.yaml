  md: '# 16. ADDING DATA USING THE WEB APPLICATION


    This chapter adds the ability to add movie listing data to our *Movie Listing*
    application we created in the last chapter.


    When creating an application that lists various kinds of data, it is also a reasonable
    expectation to provide the ability to add data using a web interface. For example,
    let us create a script that allows a user to add new movie listing data.


    > *Note that you generally want to limit access to who can add items to a database.
    In a follow-on chapter on security, I will show you how to properly limit access
    to a web application''s ability to add data through user logins.*


    # Creating a Page to Add Movies


    We start by creating an `addmovie.php` page that displays a form to the user for
    entering all the movie listing data. When the user submits the form, the data
    will be validated and inserted into the `MovieListing` table of the `Movie` database.


    # Create an “Add a Movie” Form


    Figure 16.1 displays what we want our “Add a Movie” page to look like when we
    first navigate to it.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_178_0.png)'
  merge: -1
  img_proc: true
