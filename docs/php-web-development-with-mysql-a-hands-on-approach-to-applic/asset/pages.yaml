  md: "# 15. DISPLAYING A LIST OF ITEM DETAILS\n\n# Storing Database Connection Definitions\n\
    \nNext, let's create a separate file called dbconnection.php (Listing 15.2) for\
    \ our database credentials that we will create constants for. Since we'll need\
    \ these values in multiple scripts, we store them in a file we can require or\
    \ include across our application.\n\n# Listing 15.2.\n\n```\n```php\n1. <?php\n\
    2.   /* dbconnection.php */\n3.\n4.   // Database connection constants\n5.   define('DB_HOST',\
    \ 'localhost');\n6.   define('DB_USER', 'movieguru');\n7.   define('DB_PASSWORD',\
    \ 'ilikemovies');\n8.   define('DB_NAME', 'Movie');\n```\n```\n\n> Typically,\
    \ you would use an environment variable to hold sensitive information, but for\
    \ these examples, this is sufficient.\n\n# Displaying a Movie Listings Table\n\
    \nNow let's create our main Movie Listing script and call it index.php. Starting\
    \ right after our opening <body> tag, we display our heading “Movies I Like”.\
