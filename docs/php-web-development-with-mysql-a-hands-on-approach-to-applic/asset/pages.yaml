  md: '# Final Thoughts


    Given this book concerns developing web applications using PHP and MySQL, this
    chapter only scratches the surface of what it takes to create a secure web application.
    When writing web applications that you will release in the wild (i.e., deployed
    and accessible on the internet), it is essential to follow the guidelines laid
    out in the *Open Web Application Security Project (OWASP)* site at: https://owasp.org.
    Web site security is an ongoing process. As I mentioned earlier, another excellent
    resource is the book *Security Principles for PHP Applications* by Eric Mann.
    When you deploy a web application, make sure it is safe and keep your users’ information
    safe.


    # Exercises


    +   1. Go back to our Movie Database application, rewrite queries to use prepared
    statements, particularly if they have user-supplied data.

    +   2. In the Movie Application, test some text fields to see if you can inject
    the following value: `<script>alert(''oh no!'')</script>`. If you get an alert
    box, change the code to escape the user’s input before displaying it.

    +   3. In the Favorite Cookies application, test some text fields to see if you
    can inject the following value: `<script>alert(''oh no!'')</script>`. If you get
    an alert box, change the code to escape the user’s input before displaying it.

    +   4. Review the Movie Database application and ensure any user-supplied data
    about a movie is properly escaped on output.'
