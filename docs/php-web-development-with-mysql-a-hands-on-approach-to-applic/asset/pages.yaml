- pgno: 113
  md: "# Cleaning It Up Using a Self Referencing Page\n\nOne thing to note when running\
    \ this small web program is that we first navigate to a URL that contains our\
    \ form. Then after submitting our form, we navigate to a second page containing\
    \ our PHP code. We don’t have to do this, and it would be better if we could somehow\
    \ contain the entire form into a single script and call ourselves when the user\
    \ is ready to submit the form.\n\nWe can accomplish this by creating what’s known\
    \ as a self-referencing page. To do this, we need to use another superglobal provided\
    \ by PHP that references the current web page URL called $_SERVER['PHP_SELF'].\n\
    \nLet’s use our above example of outputting a greeting to a user who enters their\
    \ first and last name.\n\nThe script is made up of two sections: the form and\
    \ the output of the greeting. For this program, we want to output the form first.\
    \ Then when the user submits the form, we want to output the greeting without\
    \ the form. Note that some designs will have you output the greeting along with\
    \ the form again (after submitting), but for this example, we want to output the\
    \ greeting without the form once the user submits it.\n\nThis behavior requires\
    \ a little conditional logic (if/else), so I suggest making a simple decision\
    \ tree or some pseudo-code:\n\n```\nIF user submitted form\n    Output greeting\
    \ with first and last name.\nELSE IF\n    Output first and last name form\nEND\
    \ IF\n```\n\nSo how do we know if the user has submitted the form? We know this\
    \ if $_POST['submit'] exists or not by passing it as an argument to the function\
    \ isset(). If we get to this page without the user pressing the Submit Name button\
    \ (i.e., this is the first time the page was rendered), then $_POST['submit']\
    \ is not set and is NULL. Let’s take a look at the modified script that is now\
    \ self-referencing. See Listing 11.4."
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 11. WORKING WITH HTML FORMS


    Listing 11.4.


    ```

    ```

    1. <html>

    2.   <head>

    3.     <title>Form for Entering Full Name</title>

    4.   </head>

    5.   <body>

    6.     <?php if (!isset($_POST[''submit''])) { ?>

    7.       <h2>Enter Full Name</h2>

    8.       <form action="<?= $_SERVER[''PHP_SELF''] ?>" method="POST">

    9.         First name:<br/>

    10.         <input name="first_name"/><br/>

    11.         Last name:<br/>

    12.         <input name="last_name"/><br/>

    13.         <p>

    14.           <input type="submit" name="submit" value="Submit Name" />

    15.         </form>

    16.     <?php } else { ?>

    17.       <h2>Greetings!</h2>

    18.       Hello <?= $_POST[''first_name''] . " " . $_POST[''last_name''] ?>

    19.       Thanks for submitting the form!

    20.     <?php } ?>

    21.   </body>

    23. </html>

    ```

    ```


    The above code splits what to display in the body of the HTML document depending
    on whether the user has submitted the form. The first time this page is rendered,
    the user has not submitted the form, so $_POST[''submit''] will not be set. As
    a result, all the HTML within the first if statement—which displays the form—is
    rendered to the page. None of the HTML from within the else statement will be
    rendered.


    Once the user submits the form, the browser sends the HTTP POST to the very same
    script (as evidenced from the form’s action attribute set to $_SERVER[''PHP_SELF'']).
    The script starts executing from the beginning. However, when the if statement
    is next encountered, it is false because the user did submit the form, and $_POST[''submit'']
    is now set.


    At this point, the code and HTML within the else statement will execute and render,
    respectively, which causes the greeting to be output to the web page (instead
    of the form).


    Incidentally, $_SERVER[2] is another superglobal associative array provided by
    PHP. It contains information about the webserver and the execution environment.
    Be careful in using its contents because they depend on the server you use and
    how it’s configured.


    [2] $_SERVER: http://php.net/reserved.variables.server'
  merge: -1
  img_proc: true
