- pgno: 380
  md: '# 24. ADDING A NAVIGATION MENU


    The <nav> element has these Bootstrap class attributes set for the following purpose:


    | Class Property | Purpose |

    |---|---|

    | .navbar | Specifies this is a navbar |

    | .sticky-top | Sticks to the top as the page scrolls |

    | .navbar-expand-md | For responsive collapsing |

    | .navbar-dark | For white text on dark color backgrounds |


    Also, notice I set the style attribute to a background-color. If you omit this,
    you will have white text on a black background for the menu.


    Next is a standard <a href> link with the class attribute set to navbar-brand
    with the href set to the home folder location, along with an image icon referencing
    MR_HOME_PAGE, which must be defined in pagetitles.php. Create a folder under the
    Movie Listing folder called resources to store your image icons. I called this
    one movie_rental_icon.png.


    > > *The movie projector icon is free to use with Creative Commons attribution,
    which I found here¹¹.*


    Before we forget, let''s define MR_HOME_PAGE. Open pagetitles.php and add the
    following MR_HOME_PAGE definition right before the MR_SIGNUP_PAGE definition:


    ```

    ```php

    <?php

    // Page Titles

    define(''MR_HOME_PAGE'', ''Movie Reservations'');

    define(''MR_SIGNUP_PAGE'', ''Movie Reservations - Sign Up'');

    define(''MR_LOGIN_PAGE'', ''Movie Reservations - Login'');

    define(''MR_UNAUTHORIZED_ACCESS_PAGE'', ''Movie Reservations - Unauthorized Access'');

    ```

    ```


    Getting back to navmenu.php, we then have a <button> element with a class attribute
    set to navbar-toggler for the button to collapse for responsive design. This class
    collapses the navigation menu on mobile devices under a hamburger icon as in Figure
    24.2


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_380_0.png)


    [1] here: https://iconfinder.com/icons/753134/festival_film_icon'
