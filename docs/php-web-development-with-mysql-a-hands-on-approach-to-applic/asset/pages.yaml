- pgno: 485
  md: "Figure 26.1 Here's the output from running version 2:\n\nMy car radio is turned\
    \ on with the volume set to 4, and the channel set to 88.6.\n\nMy boat radio is\
    \ turned on with the volume set to 10, and the channel set to 535.\n\nFigure 26.1.\n\
    \n# Inheritance\n\nIn OOP, “inheritance”[6] extends the behavior of one class\
    \ (called the base or parent class) and reuses it as the basis of another class\
    \ (called the sub or child class). Doing so allows for efficient reuse of code\
    \ from a base class and is considered another central pillar of OOP. Another way\
    \ to take advantage of inheritance is to design your base classes with the thought\
    \ of more generalization and the sub-classes with more specificity.\n\nThis is\
    \ best illustrated through an example. Let's say we want to represent the idea\
    \ of a pet. Our Pet class might look like Listing 26.11.\n\n# Listing 26.11.\n\
    \n```\n```php\n<?php\nclass Pet\n{\n    protected $name;\n\n    // Getters / Setters\n\
    \    public function getName()\n    {\n        return $this->name;\n    }\n\n\
    \    public function setName($name)\n    {\n        $this->name = $name;\n   \
    \ }\n\n    // Do some exercise!\n    public function exercise()\n    {\n     \
    \   echo 'Exercising my pet ' . $this->name . '.<br />';\n    }\n}\n```\n```\n\
    \n> Use protected (not private) to make parent properties available to your sub-classes.\n\
    \n[6] “inheritance”: https://php.net/language.oop5.inheritance"
  merge: -1
  img_proc: true
- pgno: 486
  md: "# 26. INTRODUCTION TO OBJECT-ORIENTED PROGRAMMING IN PHP\n\nThe Pet class will\
    \ serve as our base class. If we want to create a more specific class with all\
    \ the knowledge and methodology of a Pet, we need to create a sub-class. We do\
    \ that by defining our subclass and extending the base-class using the keyword\
    \ extends:\n\n```\n<?php\n    require_once('Pet.php');\n    class Dog extends\
    \ Pet\n    {\n        ...\n    }\n```\n\nSince we are extending the Pet class,\
    \ don’t forget to include it before declaring our sub-class. Now let’s add more\
    \ specific functionality (Listing 26.12) to our sub-class.\n\n# Listing 26.12.\n\
    \n```\n1. <?php\n2.     require_once('Pet.php');\n3.     class Dog extends Pet\n\
    4.     {\n5.         public function bark()\n6.         {\n7.             echo\
    \ $this->name . ' is barking.<br />';\n8.         }\n9.     }\n```\n\nIn Listing\
    \ 26.13, let’s create another sub-class.\n\n# Listing 26.13.\n\n```\n1. <?php\n\
    2.     require_once('Pet.php');\n3.     class Cat extends Pet\n4.     {\n5.  \
    \       public function meow()\n6.         {\n7.             echo 'My cat ' .\
    \ $this->name . ' is meowing.<br />';\n8.         }\n9.     }\n```"
