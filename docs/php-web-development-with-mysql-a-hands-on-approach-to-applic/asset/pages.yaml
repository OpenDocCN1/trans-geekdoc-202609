  md: "# Creating the Movie Details Page\n\nWhen embedded as query parameters in a\
    \ URL, the data is built as key-value pairs as part of the URL. Each value in\
    \ the array is indexed using the key as mentioned earlier. See Figure 15.19.\n\
    \nAdd the PHP conditional block from Listing 15.11 below the navigation link we\
    \ just added.\n\n# Listing 15.11.\n\n```\n```php\n1. <nav class=\"nav\">\n2. <a\
    \ class=\"nav-link\" href=\"index.php\">Movies I Like</a>\n3. </nav>\n4. <?php\n\
    5.     if (isset($_GET['id'])):\n6. \n7.     else:\n8. ?>\n9. <h3>No Movie Details\
    \ :-</h3>\n10. <?php\n11. endif;\n12. ?>\n```\n```\n\nWe only want to display\
    \ the movie listing details if a user navigated to this page due to selecting\
    \ a movie listing link from the main page. Therefore, we will put our code that\
    \ gets and displays the movie listing details in between the if and else statements.\n\
    \nIn between the if and else clauses, let's add code to get all the fields from\
    \ the movielisting table WHERE the id field equals the value specified by $_GET['id'].\
    \ We need all the usual boilerplate code to connect and query the database as\
    \ in Listing 15.12.\n\n# Listing 15.12.\n\n```\n```php\n1. <?php\n2. if (isset($_GET['id'])):\n\
    3. \n4.     require_once('dbconnection.php');\n5. \n6.     $id = $_GET['id'];\n\
    7. \n8.     $dbc = mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD, DB_NAME)\n9.\
    \         or trigger_error('Error connecting to MySQL server for ' . DB_NAME,\
    \ E_USER_ERROR);\n10. \n11.     $query = \"SELECT * FROM movielisting WHERE id\
    \ = $id\";\n12. \n13.     $result = mysqli_query($dbc, $query)\n14.         or\
    \ trigger_error('Error querying database movielisting', E_USER_ERROR);\n15. else:\n\
    16. ?>\n```\n```\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_171_0.png)"
