  md: '# 23. ADDING USER LOGINS


    # Create a Signup.php script


    To allow new users to access our application, we need to create a signup.php script.
    Figure 23.1 shows what we want our signup page to look like.


    To make our application more secure, we might implement a CAPTCHA[2] feature on
    our “Sign Up” form to lower the risk of automated scripts signing up for an account.
    CAPTCHAs are annoying for the user, so a better implementation is like Google’s
    reCAPTCHA shown in Figure 23.2.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_346_0.png)


    Figure 23.1.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_346_1.png)


    Figure 23.2.


    Google has a new version, v3[3] that minimizes user interaction using analytics
    to better determine if a user or an automated script is interacting with the website.


    # Create a Signup Form


    Let’s start by creating a basic Bootstrap page and name it signup.php as in Listing
    23.1.


    Listing 23.1.


    ```

    <!DOCTYPE html>

    <?php

    require_once(''pagetitles.php'');

    $page_title = MR_SIGNUP_PAGE;

    ?>

