    \ “Fantasy” genres as well. So, our edits might look something like Figure 18.7.\n\
    \nThe application directs the user to the “Movie Details” page, where they can\
    \ immediately see the results (Figure 18.8).\n\n# Unanticipated Navigation Methods\n\
    \nAs in the last chapter, since the HTTP request is coming from the client. In\
    \ theory, unanticipated or malicious parameters can be in the query string (or\
    \ even field parameters from the HTTP POST). Therefore, all other conditions we\
    \ could navigate to the editmovie.php page are unintended, and we will be dealing\
    \ with the else block:\n\n```\nelse // Unintended page link\n{\n```\n\nAs in the\
    \ last chapter, since all of the above conditions are the ones where we want the\
    \ application to function in a specific way, it is a best practice to put the\
    \ application’s response to unpredictable behavior in an else condition. In this\
    \ case, we just want to link back to the main “Movies I Like” index.php page:\n\
    \n[5] IMDB: https://imdb.com\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_228_0.png)\n\
    \n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_228_1.png)"
