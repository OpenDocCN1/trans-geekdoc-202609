- pgno: 441
  md: '# Add a Script for a Shopping Cart


    Notice each movie can be deleted from the cart, so let''s say we want to delete
    a movie as in Figure 25.21. That movie is removed from the cart and the reservation
    table. We''re left with these movies (Figure 25.22) that we can reserve by pressing
    the “Reserve Movies” button.


    > Again, notice that the number of movies in our cart updates.


    When the user selects the “Reserve Movies” button, the user''s cart is emptied.
    Then, the application displays the home page (Figure 25.23). You can see that
    the shopping cart is empty, and a new icon is displayed representing a movie projector
    (Figure 25.24). We will add this later when we update the navigation bar, and
    it will link to a page that will allow us to return movies that we''ve reserved.


    > There is a design flaw related to the fact that movies are reserved as soon
    as you add them into the cart. At the end of this chapter, I explain the flaws
    of this application and potential design solutions to consider.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_441_0.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_441_1.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_441_2.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_441_3.png)'
