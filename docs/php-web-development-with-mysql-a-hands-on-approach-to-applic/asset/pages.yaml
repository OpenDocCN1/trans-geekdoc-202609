  md: '# Create a PHP Application to Insert Data


    What is cool about PHP is that it lets you easily insert data into your MySQL
    database. PHP provides several ways for accomplishing this. One way is using mysqli
    function calls, and another is PHP Data Objects (PDO). PDO is a more object-oriented
    way of interacting with your database. For this example, we’ll use the mysqli[5]
    functions.


    Let’s take our self-referencing postfullname.php script from chapter 11 and modify
    it to insert the first and last name into the fullName table of our FullName database.
    Listing 12.1 shows our initial form.


    # Listing 12.1.


    ```

    ```php

    1. <html>

    2. <head>

    3. <title>Form for Entering Full Name</title>

    4. </head>

    5. <body>

    6. <?php if (!isset($_POST[''submit''])) { ?>

    7. <h2>Enter Full Name</h2>

    8. <form action="<?=$_SERVER[''PHP_SELF''] ?>" method="POST">

    9. First name:<br/>

    10. <input type="text" name="first_name"/><br/>

    11. Last name:<br/>

    12. <input type="text" name="last_name"/><br/>

    13. <p>

    14. <input type="submit" name="submit" value="Submit Name" />

    15. </form>

    16. <?php } else { ?>

    17. <h2>Greetings!</h2>

    18. <p>Hello <?=$_POST[''first_name''] . " " . $_POST[''last_name''] ?>

    19. Thanks for submitting the form!</p>

    20. <?php } ?>

    21. </body>

    22. </html>

    ```

    ```


    # Add Code to Insert the Data Into the Database


    In this else block of code:


    ```

    ```php

    <?php } else { ?>

    <h2>Greetings!</h2>

    <p>Hello <?=$_POST[''first_name''] . " " . $_POST[''last_name''];?>

    Thanks for submitting the form!</p>

    <?php } ?>

    ```

    ```


    [5] mysqli: https://php.net/book.mysqli'
