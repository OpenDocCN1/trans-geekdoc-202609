  md: '# Secure Password Protection for Authenticating


    generated from dictionaries of potential passwords and stored in online databases
    known as “Rainbow Tables.”


    Let me give you an example. Let’s say I have an account for a web application.
    The password I use for my login is: ilikebananas. Let us also suppose the developer
    of this application is using SHA-256 to hash passwords. If I navigate in my web
    browser to the website https://passwordsgenerator.net/sha256-hash-generator/ and
    generate a SHA-256 hash of my password as in Figure 22.1, I get the following
    hash.


    ```

    06855FBBC5079369B8240F7ED71093ED8203994521A715ED96546FA4B4CE31B7

    ```


    # CrackStation Can Crack Unsalted Passwords


    Next, if we navigate to the website https://crackstation.net and enter the same
    hash, I can successfully crack the password. See Figure 22.2.


    This site maintains a database of reverse lookups for unsalted hashes to a dictionary
    of possible passwords. Here’s a quote from CrackStation on how they create their
    lookup tables:


    > > Crackstation’s lookup tables were created by extracting every word from the
    Wikipedia databases and adding it with every password list we could find. We also
    applied intelligent word mangling (brute force hybrid) to our wordlists to make
    them much more effective. For MD5 and SHA1 hashes, we have a 190GB, 15-billion-entry
    lookup table, and for other hashes, we have a 19GB 1.5-billion-entry lookup table.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_323_0.png)


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_323_1.png)'
