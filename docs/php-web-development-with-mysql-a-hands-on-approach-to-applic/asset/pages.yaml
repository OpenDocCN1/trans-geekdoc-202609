  md: '# 18. EDITING DATA USING THE WEB APPLICATION


    In this chapter, we add the ability to edit movie listing data to our *Movie Listing*
    application.


    Since we have an application with the ability to add and remove movies, we should
    probably add the ability to edit a movie listing as well. From a movie’s “Movie
    Details” page, we want to navigate to a page with a form that allows us to modify
    all the movie details. After successfully editing the movie data, we want to be
    taken back to the “Movie Details” page for that movie to see the changes reflected
    immediately.


    > > Note that you generally want to limit access to who can edit items in a database.
    A follow-on chapter on *security* shows how to properly restrict access to a web
    application’s ability to edit data through user logins.


    # Linking Movie Details to the Edit Page


    Add a horizontal line and a link to the (yet to be written) editmovie.php script
    in the moviedetails.php script just after the closing </table> element:


    ```

    ```html

    </table>

    <hr/>

    <p>If you would like to change any of the details of this movie, feel free to
    <a href=''editmovie.php?id_to_edit=<?=$row[''id'']?>''> edit it</a></p>

    ```

    ```


    The updated “Movie Details” page should look like Figure 18.1.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_212_0.png)


    When we run the updated moviedetails.php script, we can see when hovering on “edit
    it”, our destination hyperlink is the editmovie.php script along with the query
    parameter of id_to_edit set to the primary key of the movie we are interested
    in editing as in Figure 18.2.


    This query parameter is contained in $row[''id''] and will get sent over in the
    $_GET[] superglobal array.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_212_1.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Create the Editing Page


    We create an `editmovie.php` script that displays essentially the same form as
    the “Add a Movie” `addmovie.php` script. The difference is that we pre-populate
    the form inputs with the movie details from the database. Additionally, we use
    the same Bootstrap validation code—in the `addmovie.php` script—in case the user
    inadvertently deletes a required field from the form. When we select “edit it”
    for the movie we want to update, our browser should take us to a page that looks
    like Figure 18.3.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_213_0.png)


    # DRY (Do Not Repeat Yourself)


    For easier maintenance and reduced duplication of code, you should reuse the same
    `addmovie.php` form markup and code. You can do this with PHP’s `require_once`[^1]
    statement in `addmovie.php` and `editmovie.php` scripts. We will leave this up
    to you as an exercise.


    [1] `require_once`: https://php.net/require_once'
