    \ . \"<br/>\";\n24.     echo \"Email: \" . $update_homer_to_maggie->getEmail()\
    \ . \"<br/>\";\n25.     echo \"<br/>\";\n26. }\n27. }\n```\n\n# Deleting Database\
    \ Entries with PDO\n\nFinally, let’s look at what a delete() method should look\
    \ like. See Listing 26.31.\n\nListing 26.31.\n\n```\n1. public function delete($id)\n\
    2. {\n3.     $db = new PDO(self::DSN, self::DB_USER, self::DB_PASSWORD);\n4. \n\
    5.     // Delete a record\n6.     $sql = \"DELETE FROM student WHERE id=:id\"\
    ;\n7. \n8.     $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
    9. \n10. try\n11. {\n12.     $query = $db->prepare($sql);\n13.     $query->bindParam(\"\
    :id\", $id, PDO::PARAM_INT);\n14.     $query->execute();\n15.     $rows_affected\
    \ = $query->rowCount();\n16. }\n17. catch(Exception $ex)\n18. {\n19.     echo\
    \ $ex->getMessage() . \"<br/>\";\n20. }\n21. \n22. return $rows_affected; // Returns\
    \ the number of rows affected by the DELETE\n23. }\n```\n\nSince we need to pass\
    \ in the id as a parameter to delete(), we need to parameterize it as indicated\
    \ on lines 6 and 13. As we did in the update() method, we will return the number\
    \ of rows affected by the DELETE."
