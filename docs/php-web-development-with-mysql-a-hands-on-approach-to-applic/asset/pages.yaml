    # Features to Add


    This code by no means is a complete and polished application. While working code
    is essential, there are always ways to improve it or adapt it to new uses. Several
    features could and should be added to improve the user experience and add robustness
    to the application. I''ve listed a few here below.


    # Add Pagination of Movie Titles


    As the movie reservation library grows, it would be good to add pagination to
    the application instead of listing all the movies in the database. Pagination
    would improve response time and reduce the amount of vertical scrolling needed
    to display the results on each page.


    # Add a Search and Filter Movies Feature


    Along with pagination, adding a search feature to limit results would add to the
    user experience. This feature can be a title search or maybe a director search.
    Along with this, adding the ability to filter movies of various ratings would
    be helpful too.


    # Add Details to Movie Records


    We can track more information about each movie than we do now. We can add fields
    for a release date, producer, actors, and more. You could even link to reviews
    or sites about the movie.'
