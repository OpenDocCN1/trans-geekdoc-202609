- pgno: 219
  md: "# Listing 18.6.\n\n```\n```php\nif (isset($_GET['id_to_edit']))\n{\n    $id_to_edit\
    \ = $_GET['id_to_edit'];\n\n    $query = \"SELECT * FROM movieListing WHERE id\
    \ = $id_to_edit\";\n\n    $result = mysqli_query($dbc, $query)\n        or trigger_error('Error\
    \ querying database movieListing', E_USER_ERROR);\n\n    if (mysqli_num_rows($result)\
    \ == 1)\n    {\n        $row = mysqli_fetch_assoc($result);\n\n        $movie_title\
    \ = $row['title'];\n        $movie_rating = $row['rating'];\n        $movie_director\
    \ = $row['director'];\n        $movie_runtime = $row['running_time_in_minutes'];\n\
    \        $movie_genre_text = $row['genre'];\n\n        $checked_movie_genres =\
    \ explode(', ', $movie_genre_text);\n    }\n}\n```\n```\n\n# Consider a Database\
    \ Relationship for Genres\n\n> *Notice above that we use explode() to separate\
    \ a comma-delimited string of genres we store in the database. The problem with\
    \ the above solution is that it denormalizes our list of genres—which incidentally\
    \ is hard-coded from the addmovie.php script. A better and more long-term solution\
    \ would be to create a database table that holds all of our genres and then create\
    \ a cross-reference (or JOIN table) representing a many-to-many relationship between\
    \ movies and genres. The advantage of this approach makes it easier to maintain/modify\
    \ genres because it is contained entirely within the data model. A minor disadvantage\
    \ is that it adds some complexity to your SQL queries. I leave it as a refactoring\
    \ exercise for you to implement this improvement within the application.*\n\n\
    # Display the Edit Form\n\nBefore we add code for the other two conditions, we\
    \ create the form to update the movie. We add this below the else block for the\
    \ unintended condition. This form should look very similar to the form for the\
    \ addmovie.php script, except that the fields are pre-populated with the data\
    \ we just queried from the database. Listing 18.7 is the code for the form. Notice\
    \ some of the differences between this form and the one in addmovie.php."
