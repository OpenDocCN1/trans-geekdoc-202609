  md: '# 16. ADDING DATA USING THE WEB APPLICATION


    *Using Bootstrap''s Client Side Validation*


    Also, notice that we are using Bootstrap''s client-side validation. This requires
    we do the following:


    +   1. Set the form''s class attribute to needs-validation and add the novalidate
    attribute:

    +   ```

    +   <form class="needs-validation" novalidate ...

    +   ```

    +   2. Marking input elements with a required attribute to ensure the fields we
    want to be validated get validated and sent by the user''s browser as part of
    the POST request.

    +   ```

    +   <input type="number" ... required>

    +   ```

    +   3. Adding <div> elements with class attributes set to invalid-feedback containing
    the validation text we want the user to see if they forget to fill in the field.
    We add these directly under the <input> elements we want validated. Listing 16.5
    is the complete HTML markup for the “Running Time” input field along with the
    invalid feedback we want the user to see if they forget to enter a value.

    +   4. Adding the JavaScript code from Listing 16.6 in <script> tags following
    the form.


    # Listing 16.5.


    ```

    1. <div class="form-group row">

    2.   <label for="movie_running_time_in_minutes"

    3.     class="col-sm-3 col-form-label-lg">Running Time (min)</label>

    4. <div class="col-sm-8">

    5.   <input type="number" class="form-control"

    6.     id="movie_running_time_in_minutes"

    7.     name="movie_running_time_in_minutes"

    8.     placeholder="Running time (in minutes)" required>

    9.   <div class="invalid-feedback">

    10.     Please provide a valid running time in minutes.

    11.   </div>

    12. </div>

    13. </div>

    ```


    > A complete write-up on how to implement client-side validation using Bootstrap[^3]
    (version 4.3) can be found online.


    [3] client-side validation using Bootstrap: https://getbootstrap.com/docs/4.3/components/forms/#validation'
