  md: "Notice that once our code runs, the removed movie is no longer listed (Figure\
    \ 17.8).\n\n# Pressing the “Don’t Delete” Button\n\nThis is the third intended\
    \ way to navigate to the removemovie.php page. Therefore we will be dealing with\
    \ first elseif block:\n\n```\nelseif (isset($_POST['do_not_delete_movie_submission'])):\n\
    ```\n\nIf this condition is true, it was because a user selected the “Don’t Delete”\
    \ submit button. Doing so, POSTs to removemovie.php with the form variables do_not_delete_movie_submission\
    \ in the $_POST[] superglobal array.\n\nIn this block, we redirect the user automatically\
    \ to the main “Movies I Like” index.php page. Using the header()[2] function,\
    \ We send a Location: with the destination URL, index.php.\n\n```\nelseif (isset($_POST['do_not_delete_movie_submission'])):\n\
    \n    header(\"Location: index.php\");\n    exit;\n```\n\nWhen the page reloads,\
    \ notice the movie was not removed (Figure 17.9).\n\n# Soft vs Hard Deletes\n\n\
    Depending on your application, you may not want to delete a row from the database\
    \ immediately. What if the user wants to recover a record? In that case, many\
    \ programs use a “soft” delete by adding a boolean column to a table to indicate\
    \ that something has been “deleted.” When querying for records, exclude the rows\
    \ with this field set to true. To recover a record, we need only flip the field\
    \ to false.\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_205_0.png)\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_205_1.png)\n\
    \n[2] header(): https://php.net/header"
