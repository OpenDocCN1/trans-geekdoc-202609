  md: '# Setting Up a Development Environment


    You will need to type Y or press Enter to accept the changes (Figure 2.15).


    Verify PHP is installed by running the following command in the terminal window:


    ```

    php -v

    ```


    You should see the output in Figure 2.16.


    Out of the box, PHP installs with error reporting turned off. This default is
    a good thing since we don’t want to advertise to potential hackers where our files
    or bugs are for our deployed websites. Since we are creating a development environment,
    we will want to know when we have PHP errors.


    Most of our PHP configuration settings are found in the php.ini file. We will
    use the installed nano editor that comes installed with Ubuntu to modify this
    file for displaying our errors.


    In the terminal window, type the following command to edit the php.ini file:


    ```

    sudo nano /etc/php/7.4/apache2/php.ini

    ```


    You need to search for the second occurrence of display_errors using the ^W “Where
    Is” command (ctrl+W) in nano and change it from Off to On (Figures 2.17).


