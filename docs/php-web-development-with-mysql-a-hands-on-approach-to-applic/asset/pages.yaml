    When the user submits the form, we validate the credentials and either log them
    in or redirect them to correct their entries. To be successfully logged in, the
    user has to exist in the user table of the Movie database, and their password
    has to be correct. Once we’ve validated the user’s credentials in the database,
    we note they are authenticated by setting a session variable for the user’s user_id
    and user_name. After setting the session variables, we will redirect the user
    to the index.php page. If the user navigates to the login.php script, we display
    that they have logged in rather than showing the form.


