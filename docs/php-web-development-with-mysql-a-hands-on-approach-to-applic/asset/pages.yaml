  md: '# 2. WRITING YOUR FIRST PHP SCRIPT


    # Setting Up a Development Environment


    To write PHP, all you need is a text editor. However, since PHP runs with a web
    server, you need access to a PHP development environment. I will show you how
    to install and configure a Unix-based development environment for writing and
    debugging your PHP web applications.


    # Downloading a Unix Operating System (OS)


    Since most PHP web applications run on a Linux distribution of the Unix OS, it
    makes sense to develop on one. I find Ubuntu Desktop one of the easiest operating
    systems to develop in. As of this writing, the current version is Ubuntu 20.04.1
    LTS.


    > LTS stands for long-term support. Canonical, the organization that maintains
    Ubuntu, guarantees free security and maintenance updates for five years on LTS
    releases.


    The first thing we need to do is head over to https://www.ubuntu.com/download/desktop
    and download the latest 64-bit version of Ubuntu Desktop and press the Download
    button as in Figure 2.1.


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_26_0.png)


    Figure 2.1.'
