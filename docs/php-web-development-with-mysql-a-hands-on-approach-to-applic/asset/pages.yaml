  md: "# Processing Our Form and Outputting Back to the Web Page\n\nOnce the form\
    \ is submitted, the browser sends the form data to our postfullname.php script.\
    \ Here, we take the form data, process a greeting out of it, and then display\
    \ it on the webpage.\n\nAssuming I enter \"Ken\" for the first name and \"Marks\"\
    \ for the last name, I would like the greeting to look like Figure 11.2. Our postfullname.php\
    \ script is shown in Listing 11.2.\n\nListing 11.2.\n\n```\n1. <html>\n2. <head>\n\
    3. <title>Full Name</title>\n4. </head>\n5. <body>\n6. <h2>Greetings!</h2>\n7.\
    \ <?php\n8. $first_name = $_POST['first_name'];\n9. $last_name = $_POST['last_name'];\n\
    10. \n11. echo \"Hello \" . $first_name . \" \" . $last_name . \". Thanks for\
    \ submitting the form!\";\n12. ?>\n13. </body>\n14. </html>\n```\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_111_0.png)\n\
    \nThere are several things I want you to notice. First, PHP was designed to be\
    \ mixed with HTML. You can move in and out of PHP and HTML with ease. Second,\
    \ if you have any PHP code in your script, you need to name the script using the\
    \ .php extension.\n\n# $_POST Superglobal Variable\n\n$_POST is a special variable\
    \ built into PHP that holds form data, and it is available throughout your entire\
    \ set of scripts as a result of an HTTP POST. $_POST is an associative array.\
    \ You access the form data by using the name attributes from the form as associated\
    \ keys into the $_POST superglobal array.\n\nLooking at the postfullname.php script,\
    \ you can see that $_POST['first_name'] comes from the input element name attribute\
    \ identified by first_name (<input name=\"first_name\"/>) from postfullname.html.\
    \ Likewise, $_POST['last_name'] comes from the input element name attribute identified\
    \ by last_name (<input name=\"last_name\"/>).\n\nYou will also notice that I assigned\
    \ the $_POST['first_name'] and $_POST['last_name'] to local variables. Doing so\
    \ is not necessary. However, it is often done to aid in the readability of the\
    \ code. I want to point out that using echo to output HTML to a web page should\
    \ be used"
  merge: -1
  img_proc: true
- pgno: 112
  md: "# 11. WORKING WITH HTML FORMS\n\nsparingly as it can be cumbersome to create\
    \ HTML output using echo. Listing 11.3 is a modified example of our postfullname.php\
    \ script showing another method of moving in and out of HTML and PHP to output\
    \ HTML.\n\nListing 11.3.\n\n```\n```php\n1. <html>\n2.   <head>\n3.     <title>Full\
    \ Name</title>\n4.   </head>\n5.   <body>\n6.     <h2>Greetings!</h2>\n7.    \
    \ Hello <?= $_POST['first_name'] . \" \" . $_POST['last_name'] ?>\n8.     Thanks\
    \ for submitting the form!\n9.     <br/>\n10.    <?php print_r($_POST) ?>\n11.\
    \  </body>\n12. </html>\n```\n```\n\nInstead of using echo we use the PHP short\
    \ tag <?= . This syntax is a shortcut for <?php echo, which is incredibly convenient\
    \ since you will more than likely be using PHP to process data before turning\
    \ it into HTML for output.\n\nOne other thing to notice about this simplified\
    \ example is that I removed the local variables and directly access the appropriate\
    \ elements using the $_POST superglobal.\n\nOne final note about using the $_POST\
    \ superglobal or working with arrays in general. Often you need to inspect the\
    \ contents of an array. For example, it might be nice to know if you got what\
    \ you expected from your form. You can use the developer tools that come with\
    \ your browser for this (most developers do this), but this only shows you what\
    \ the client will send. It is handy to quickly output the contents of an array\
    \ from your PHP script under development. You can easily do that by using the\
    \ function print_r()¹.\n\nIf I add the following lines just before the closing\
    \ </body> tag of the above script, I get the output shown in Figure 11.3.\n\n\
    ```\n```html\n    <br/>\n    <?php print_r($_POST) ?>\n</body>\n</html>\n```\n\
    ```\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_112_0.png)\n\nFigure 11.3.\n\n\
    [1] print_r(): https://php.net/print_r"
