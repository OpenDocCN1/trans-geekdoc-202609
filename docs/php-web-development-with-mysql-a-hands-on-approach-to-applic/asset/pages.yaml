- pgno: 306
  md: '# 21. PERSISTENCE


    Persistence. That’s a big word. What if we need to remember the user’s name and
    whether they’re logged in? Back in chapter 18, I mentioned that the web is stateless.
    To carry over data from a previous HTTP request, so far, we have needed to save
    this data in a hidden variable in the form. This approach is a fragile form of
    persistence because if we want that data to stay around for another HTTP GET or
    POST, we must remember always to include our hidden variable in future requests.
    Wouldn’t it be nice to have a better mechanism to persist our data with less work
    so we could use it across multiple HTTP GETs or POSTs? In web development, there
    are three mechanisms we can use to persist data: cookies, session variables, and
    the database. We have already been using the database. This chapter focuses on
    cookies and session variables, how they are used, and the best practices for using
    them.


    # Cookies


    Cookies allow the persistence of small pieces of string data on the client’s browser,
    have a time limit and can be deleted at will. The components (Figure 21.1) of
    a cookie are:


    +   - Name: The unique name of the cookie

    +   - Value: The value stored in the cookie

    +   - Expiration Date: The date and time when the cookie expires


    ![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_306_0.png)


    A cookie lasts as long as its set expiration date and time. If you don’t set a
    cookie’s expiration date and time, it lasts until the user dismisses the browser
    session. A cookie can only be read or modified by the site that sets it for security
    and privacy.


    > What do we mean by small? Most browsers limit the maximum size of a cookie to
    4096 bytes.'
