  md: "# Creating the Main Movie Listing Page\n\nNext (right after the <h1> tag),\
    \ we'll add some PHP code to include our database connection constants and connect\
    \ to our database (Listing 15.4). We use require_once() to make our dbconnection.php\
    \ values available to our script and ensure that this file is only loaded one\
    \ time when our script runs.\n\n# Listing 15.4.\n\n```\n```php\n1. <h1>Movies\
    \ I Like</h1>\n2.\n3. <?php\n4. require_once('dbconnection.php');\n5.\n6. $dbc\
    \ = mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD, DB_NAME)\n7.     or trigger_error('Error\
    \ connecting to MySQL server for DB_NAME.', E_USER_ERROR);\n```\n```\n\nThen,\
    \ we'll create a query string for getting the id, title fields from all the movies\
    \ in the movielisting table and query the database:\n\n```\n```php\n$query = \"\
    SELECT id, title FROM movielisting ORDER BY title\";\n\n$result = mysqli_query($dbc,\
    \ $query)\n    or trigger_error('Error querying database movielisting', E_USER_ERROR);\n\
    ```\n```\n\nNote that we will need the id for each movie listing when we navigate\
    \ to the “Movie Details” page so we can query and retrieve the individual details\
    \ for the selected movie.\n\nAt this point, we only want to display a table of\
    \ the movies if there are movies in the database:\n\n```\n```php\nif (mysqli_num_rows($result)\
    \ > 0):\n?>\n    <table class=\"table table-striped\">\n        <thead>\n    \
    \        <tr>\n                <th scope=\"col\">Movie Title</th>\n          \
    \  </tr>\n        </thead>\n```\n```\n\nAssuming we have movies to display, this\
    \ while loop iterates and outputs through the movie titles as in Listing 15.5."
