  md: "# Add Image File Uploads to the Editing Page\n\nOnce we select “Update Movie”\
    \ (Figure 19.23), we want to see the updated movie details modified with the image\
    \ we uploaded on the “Movie Details” as shown in Figure 19.24.\n\nFirst, open\
    \ the editmovie.php script and add a reference to the movieimagefileutil.php script\
    \ by adding the following require_once() just after the reference to dbconnection.php\
    \ towards the top of the script:\n\n```\n```php\nrequire_once('dbconnection.php');\n\
    require_once('movieimagefileutil.php');\n```\n```\n\n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_277_0.png)\n\
    \n![](img/83a2e1d9463a10cf8d6f7fe54ee4b1c7_277_1.png)\n\n# Displaying Movie Image\
    \ Details when Editing\n\nWhen first browsing to the “Edit a Movie” page (editmovie.php),\
    \ it was because of an HTTP GET request/response when navigating from the “Movie\
    \ Details” page. Therefore, we need to make the modifications in Listing 19.24\
    \ to add the movie image file details in the if (isset($_GET['id_to_edit'])) block\
    \ of code:\n\n# Listing 19.24.\n\n```\n```php\nif (isset($_GET['id_to_edit']))\n\
    {\n    // ...\n    if (mysqli_num_rows($result) == 1)\n    {\n        // ...\n\
    \        $movie_genre_text = $row['genre'];\n        $movie_image_file = $row['image_file'];\n\
    \n        if (empty($movie_image_file))\n        {\n            $movie_image_file_displayed\
    \ = ML_UPLOAD_PATH . ML_DEFAULT_MOVIE_FILE_NAME;\n        }\n        else\n  \
    \      {\n            $movie_image_file_displayed = $movie_image_file;\n     \
    \   }\n\n        $checked_movie_genres = explode(', ', $movie_genre_text);\n \
    \   }\n}\n```\n```"
