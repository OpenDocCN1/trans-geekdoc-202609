  md: "# 17. REMOVING DATA USING THE WEB APPLICATION\n\n# Unexpected Navigation Method\n\
    \nSince the HTTP request is coming from the client, in theory, unanticipated,\
    \ unwanted, and malicious parameters can be in the query string. All other conditions\
    \ we could navigate to the removemovie.php page are unintended. Therefore, we\
    \ are dealing with the else block:\n\n```\nelse: // Unintended page link\n```\n\
    \nSince all of the above conditions are where we want the application to function\
    \ in a specific way, it is common practice to put the application's response to\
    \ unpredictable behavior in an else condition. In this case, we redirect to the\
    \ main Movies I Like index.php page:\n\n```\nelse: // Unintended page link - No\
    \ movie to remove, link back to index\n\n    header(\"Location: index.php\");\n\
    \    exit;\n\nendif;\n```\n\n# Complete Code Listing\n\nListing 17.9 holds the\
