- pgno: 66
  md: '# 6. ARRAYS


    # Adding Values


    Arrays in PHP are immutable. That is, they can change after they are initially
    created. This property allows us to add and delete items from an array.


    There are two ways to add values to the end of arrays. The first is to use the
    array_push()[1] function:


    ```

    // Add value to end of numeric array

    array_push($us_states, ''Wisconsin'');


    // Add value to end of associative array

    array_push($us_state_capitals, ''California'' => ''Sacramento'');

    ```


    The second is to use the following syntax:


    ```

    // Add value to end of numeric array

    $us_states[] = ''Wisconsin'';


    // Add value with this key to end of associative array

    $us_state_capitals[''California''] = ''Sacramento'';

    ```


    # Explicit Versus Short Array Syntax


    Short array syntax is generally preferred over using the array keyword because
    it''s less verbose.


    # Useful Array Functions


    # count()


    You will often need to know how many elements are in your array. The count()[2]
    function returns the number of items in an array:


    ```

    $us_states_i_lived_in = ["California", "Florida", "Wisconsin"];

    $number_of_states = count($us_states_i_lived_in);


    echo "I have lived in $number_of_states<br/>";

    ```


    [1] array_push(): http://php.net/array-push

    [2] count(): http://php.net/count'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# array_pop()


    If you need to get the last element and remove it from an array, you will want
    to use the function array_pop()[3]. Here is an example how to use it:


    ```

    $us_states = ["California", "Florida", "Wisconsin"];

    $last_state = array_pop($us_states);


    echo "I currently live in $last_state<br/>"; // Wisconsin

    // Count of $us_states is now 2

    echo "There are now count($us_states) left in the us_states array";

    ```


    # shift()


    If you need to get the first element and remove it from an array, you will want
    to use the function array_shift()[4]. Here is an example how to use it:


    ```

    $us_states = ["California", "Florida", "Wisconsin"];

    $first_state = array_shift($us_states);


    echo "I was born in $first_state<br/>"; // California

    // Count of $us_states is now 2

    echo "There are now count($us_states) left in the us_states array";

    ```


    # array_merge()


    The array_merge()[5] function appends one or more arrays to the end of the previous
    array:


    ```

    $us_states = ["California", "Florida", "Wisconsin"];

    $more_us_states = ["Virginia", "Maryland", "New York"];

    $merged_us_states = array_merge($us_states, $more_us_states);


    echo "<pre>";

    print_r($merged_us_states);

    echo "</pre>";

    ```


    [3] array_pop(): http://php.net/array_pop

    [4] array_shift(): https://php.net/array_shift

    [5] array_merge(): http://php.net/array_merge'
  merge: -1
  img_proc: true
