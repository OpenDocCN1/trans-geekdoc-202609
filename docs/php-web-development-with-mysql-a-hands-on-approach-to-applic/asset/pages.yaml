    +   2. Use PDO to create a ToDo List application

    +   1. Create a database called ToDo.

    +   2. Create a table called todo with the following fields for id, description.
    Make the id the primary key, and the description should be a varchar[100].

    +   3. Use PDO to create a CRUD class for the todo table

    +   4. Create a ToDo list application with a form that allows a user to create,
    read all, read by id, update, and delete ToDo list items

    +   5. When the user reads all of the ToDo items, display the results in a table
    that includes the id.

    +   6. When the user updates a ToDo list item, return 1 indicating one row was
    affected and the update was successful, or 0 if it was unsuccessful.

    +   7. When the user deletes a ToDo list item, return 1 indicating a single row
    was affected and the update was successful, or 0 if it was unsuccessful.'
