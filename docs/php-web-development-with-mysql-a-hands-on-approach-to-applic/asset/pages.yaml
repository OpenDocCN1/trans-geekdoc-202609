    \ are noted using the @param tag, one for each parameter. For more information,\
    \ see Docblocks in PHP[2] on their proper usage.\n\n# Handling Errors\n\nWe know\
    \ we will return a string containing an error message if there are errors or an\
    \ empty string if there are none. Let’s create a variable called error_message\
    \ initialized to an empty string at the start of our function. At the end of the\
    \ function, return it:\n\n[2] Docblocks in PHP: https://docs.phpdoc.org/guides/docblocks.html"
