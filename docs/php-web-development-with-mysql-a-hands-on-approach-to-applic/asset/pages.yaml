    \ $error_message;\n}\n```\n\n# Consider Preventing Uploading of generic_movie.jpg\n\
    \nIn the above implementation, nothing is preventing the user from uploading an\
    \ image named generic_movie.jpg. It would be a good idea to prevent this by checking\
    \ the name of the uploaded file. Otherwise, anyone could overwrite the default\
    \ image we use for movies. In general, you should handle file uploads carefully\
    \ and consider how someone might abuse them. I leave this as an exercise for you\
    \ to do.\n\n# Consider in_array() to Check Image Types\n\nIn the code in Listing\
    \ 19.5, we have the following if clause for validating legal image types:\n\n\
    ```\nif ($image_type != 'image/jpg' && $image_type != 'image/jpeg' && $image_type\
    \ != 'image/pjpeg'\n    && $image_type != 'image/png' && $image_type != 'image/gif')\n\
    ```\n\nThis kind of code gets messy and is difficult to maintain. A better solution\
    \ for picking out a legal image type is to use the built-in PHP function in_array()[3].\
    \ To use it, create an array of the allowed image types, then check to see if\
    \ the set image type is found in the array:\n\n```\n$allowed_image_types = [\n\
    \    'image/jpg', 'image/jpeg', 'image/pjpeg', 'image/png', 'image/gif'\n];\n\n\
    if (in_array($image_type, $allowed_image_types))\n{\n    // ...\n}\n```\n\n[3]\
    \ in_array(): https://php.net/in-array"
