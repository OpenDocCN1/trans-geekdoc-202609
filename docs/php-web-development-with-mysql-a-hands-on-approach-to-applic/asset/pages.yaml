  md: '# Add a Field for File Information


    In theory, we could upload an image file and store the image in the database.
    However, databases were designed for quick access, and image files can be large.
    Therefore, doing so could slow down the retrieval time when querying the database,
    especially when dealing with a large database.


    A better solution is storing the image on the server in an images/ folder. Then,
    we create a string field in the movielisting table that holds the file path location
    to the uploaded image.


    To add a new field to an existing table, we need to ALTER the the movielisting
    table. Let’s do this using Adminer. Using our browser, log in to Adminer as movieguru
    and create our database and table (Figure 19.1).


