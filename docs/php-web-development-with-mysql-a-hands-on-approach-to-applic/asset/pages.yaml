    Next, we need to add a column to our movie listing table by adding a blank table
    head column. Then, we can add a data item for each movie listing with a link to
    removemovie.php and the id of the movie as a query parameter to the table row.
    Let us name the query parameter id_to_delete as in Listing 17.1.


