  md: "# Moving Image Files\n\nAssuming the uploaded movie image file validates, we\
    \ want to move the file from the temporary location on the webserver to our images/\
    \ folder. Once that’s done, we should return the path location of the file to\
    \ store with the other movie details in the database. If a user does not upload\
    \ a file—or there was an error uploading the file—we return an empty string for\
    \ the path location. This empty string serves later as an indicator to show the\
    \ generic file icon.\n\nSince we will be referring to the images/ folder often,\
    \ it is best to create a constant for this upload path and put it in a separate\
    \ file that can be included by other scripts. Therefore, add `define('ML_UPLOAD_PATH',\
    \ 'images/');` to movielistingfileconstants.php. We also need a constant for a\
    \ default image file in case the user does not upload an image. Here is what the\
    \ complete constants file should look like now:\n\n```\n```php\n<?php\n// Movie\
    \ Listing File Constants\ndefine('ML_UPLOAD_PATH', 'images/');\ndefine('ML_MAX_FILE_SIZE',\
    \ 524288);\ndefine('ML_DEFAULT_MOVIE_FILE_NAME', 'generic_movie.jpg');\n```\n\
    ```\n\nAlways use descriptive names for functions, a good one is: addMovieImageFileReturnPathLocation().\
    \ Below the validateMovieImageFile() function, let’s create our new function with\
    \ a good descriptive DocBlock as in Listing 19.6.\n\nListing 19.6.\n\n```\n```php\n\
    /**\n * Purpose:        Moves an uploaded movie image file to the ML_UPLOAD_PATH\
    \ (images/)\n *                 folder and return the path location.\n *\n * Description:\
    \    Moves an uploaded movie image file from the temporary server location\n *\
    \                 to the ML_UPLOAD_PATH (images/) folder IF a movie image file\
    \ was uploaded\n *                 and returns the path location of the uploaded\
    \ file by appending the file\n *                 name to the ML_UPLOAD_PATH (e.g.\
    \ images/movie_image.png). IF a movie image\n *                 file was NOT uploaded,\
    \ an empty string will be returned for the path.\n *\n * @return string  Path\
    \ to movie image file IF a file was uploaded AND moved to the\n *            \
    \     ML_UPLOAD_PATH (images/) folder, otherwise and empty string.\n */\nfunction\
    \ addMovieImageFileReturnPathLocation()\n{\n}\n```\n```"
