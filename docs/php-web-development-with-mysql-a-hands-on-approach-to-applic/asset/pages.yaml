    > You’ll notice that I include a reference to the Pet class even though Dog and
    Cat also include the Pet class. It is a best practice, as long as I am instantiating
    an object of a base class to include the base class, even though an instantiated
    sub-class inherits the base class as well. The reason is, I would minimize any
    breaking changes if the inheritance structure were to be redesigned. Remember
    to use require_once so you don’t get a fatal error when including a class that
    already exists.'
