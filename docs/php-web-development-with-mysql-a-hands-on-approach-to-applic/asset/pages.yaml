  img_proc: true
- pgno: 56
  md: '# 4. BASIC STRING INTERPRETATION


    # Heredoc


    PHP defines a special way to delimit strings called heredoc which allows you to
    define an identifier after the the <<< sequence followed by a newline. EOT (“end
    of text”) is a popular character sequence used as an identifier. Everything after
    this line up until the same identifier followed by a semicolon ; on its own line
    is delimited as a string. This syntax allows you to define large portions of text
    without the need for escaping single or double quotes:


    ```

    echo <<<EOT

    Cupcake ipsum dolor. Sit amet cake ice cream sweet pudding

    tootsie roll marshmallow cake. "Lemon" drops apple pie fruitcake

    caramels lollipop''s sweet roll. Sesame snaps lemon drops topping.

    EOT;

    ```


    This outputs:


    ```

    Cupcake ipsum dolor. Sit amet cake ice cream sweet pudding

    tootsie roll marshmallow cake. "Lemon" drops apple pie fruitcake

    caramels lollipop''s sweet roll. Sesame snaps lemon drops topping.

    ```


    The online documenation has more detail on Strings[3].


    # Exercises


    Create a script strings.php to do the following:


    +   1. Assign a first and a last name to two separate variables. Then, use concatenation
    to echo the full name.

    +   2. Again, with first and last name, use string interpolation to output the
    last name, a comma, and then the first name.

    +   3. Set the last name to “O’Connor” and output the full name.


    [3] Strings: http://php.net/language.types.string'
