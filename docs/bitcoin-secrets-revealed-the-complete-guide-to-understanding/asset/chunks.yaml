    介绍 ![](img/rsrc93.jpg) 通过历史上的无数发现和发明，我们看到许多进步，从微小的到重大的，有些短暂，有些则极为重要且持久。有些历史事件对人类至关重要，它们是推动全人类进步的唯一因素，使人类
    collectively 取得关键且永恒的进步。例如，考虑到农业机械和肥料的发明，使得固定土地的食物产出实现了指数级增长。如果没有这些发明和发现，世界就无法支撑我们所目睹的全球人口激增。几百年前，科学家和经济学家指出，由于食物生产仅以数值速率增长（每隔几年翻倍或三倍），而人口以指数速度增长（在此期间扩大到两次或更多的幂次），因此预测不久将出现食物不足的情况，除非从固定土地上每年获得更多食物。幸运的是，这正是实际发生的。科学提供了重型农业设备、氨肥等改进，使得粮食收成能够跟上人口增长的速度。这使得在以前相同的土地上可以维持更多人。如果没有这些发展，今天世界将是一个截然不同的地方。同样，抗生素、青霉素的发明、航空旅行、海运货运和蒸汽机的引入，以及更近期的信息时代的信息共享——这得以实现是微电路和晶体管的发明——都
    irreversibly 改变了世界。这些创新和发现使我们比以往任何时候都更加相互连接、更好、更健康，并且能够以更低的成本和更便捷地获取商品和服务。


    '
