- raw: 'The final way that blockchain technology can add value to a business is by
    helping with monetization. The ways companies are making money are changing. People
    no longer pay attention to ads because you can now fast-forward through the commercials
    and online they can be ignored. Plus, the money generally goes to the site where
    the ad is placed, which has a tremendous impact on business. Blockchain technology
    solves this problem. This is because every part of the content that is created
    for ads is recorded on the blockchain, which is how content creators are rewarded
    through cryptocurrency or fiat currency. Growing Money Many experts believe that
    blockchain technology will become the way of the future. Cryptocurrency is rapidly
    increasing because people want to put their money in a place that is not only
    safe and secure, but that will also gain value like a savings account. However,
    savings accounts aren''t as secure as they would like. By the end of 2017, future
    markets had already been created for bitcoin. That was also the year the finance
    industry saw a dramatic increase in Initial Coin Offerings, (ICO). In the last
    year, ICOs have gained more money than venture capital investments. While cryptocurrencies
    continue to improve in their abilities to quickly process transactions, eventually
    they will compete against credit card companies processing of transactions. The
    Cloud and Blockchain ![](rsrc9C.jpg)At some point, everyone has used the cloud
    to back up data that they don''t want to lose. If you didn''t know, the cloud
    actually runs on a blockchain. Experts say that we have started to take luxury
    for granted. In the past, you couldn''t merely click a button and automatically
    save data to a backup site like iCloud or OneDrive. Instead, you were required
    to transfer the information on a compact disk or flash drive. Then, you would
    have to take the disk or flash drive to another computer to download the data.
    While you can still do this today, there isn''t a guarantee that this type of
    technology will last. Like the floppy disks of the past, compact discs and flash
    drives may become obsolete, but internet saving applications will always be updated
    because we now live in a tech-savvy world. Blockchain and Gaming eSports and online
    fantasy sports have grown significantly over the last decade with more and more
    people creating online fantasy sports teams. Online games, like Fantasy Football,
    were some of the first sites to adopt the earliest versions of bitcoin and other
    cryptocurrencies. They also use blockchain technology to run and keep up with
    the gaming technology. The uses of blockchain technology don''t just stop with
    fantasy sports. The most popular smartphone applications to download today are
    games. This is why, as the technology grows, more developers will likely make
    use of blockchains, as well as cryptocurrencies. Supply Chain Management and Blockchain
    Blockchain technology will also benefit supply chain management by providing a
    way to trace goods while at the same time being cost effective. For example, sending
    packages through the United Parcel Services from one business to another. In the
    past, someone had to call to find out where their box was if it hadn''t arrived
    when it was supposed to. Today, you are provided with a tracking number that allows
    you to see where the package you sent or are waiting for is in transit, which
    creates a blockchain. Blockchain technology has made it easier for businesses
    to do business together because it has dramatically simplified the production
    process, and transfer process, as well as the verification and payment methods,
    used. Blockchain Technology and Quality Assurance In business, mistakes happen,
    no matter how careful you are and how closely you follow processes and procedures,
    and it can be challenging to pin down how the mistake occurred. With blockchain
    technology, mistakes and errors can be traced back to the point of origin. Not
    only does this make it easier to investigate mistakes, but it also saves companies
    time and money. Chapter 4 – Proof of Work vs. Proof of Stake ![](rsrc9D.jpg)A
    majority of the public blockchains that are currently available are based on a
    proof of work system. However, in 2018, the second biggest cryptocurrency, Ethereum,
    began testing a new system that would change its blockchain from a proof of work
    to a proof of state system. Before we can get into what exactly this means, it
    is essential to understand what exactly is occurring when a transaction is verified.
    Proof of Work The mining of bitcoin is accomplished by using a high-powered machine
    that will utilize a SHA256 double round has a verification process with the purpose
    of validating bitcoin transactions as they happen. This is done to provide security
    for the sanctity of the bitcoin blockchain. The speed that your machine can mine
    bitcoins is measured regarding hashes per second. Bitcoin, in exchange for this
    service, compensates those that are doing the mining by offering them a fraction
    of a bitcoin for every validation. They do this to offset time and energy costs.
    Additionally, those who initiate the transaction will typically provide some amount
    of a transaction fee to help offset costs as well. The higher the computer processing
    power of your bitcoin mining machine, the more you can make through the process.
    To be accepted into the blockchain, each block must have a valid proof of work.
    A proof of work is a type of data that is both difficult to produce as well as
    time-consuming. Creating proof of work is essentially a random process with a
    low probability of success. This means that a bitcoin mining machine that is trying
    to complete the process requires a significant degree of trial and error to be
    successful. Bitcoin uses what is known as the hashcash proof of work. The hashcash
    proof of work is a type of cryptographic algorithm that makes use of a hash function
    as a core building block of the mining process. The most common hashcash function
    that is used today is the haschash-Sha256. This particular proof of work function
    was created by Dr. Adam Back in the 1990s. It was initially used as a way to prevent
    email spam abuse because successfully generating the hashcash for a single email
    was simple. However, creating one for a vast number of emails at the same time
    proved to be much more difficult. You can tweak hashcash proofs of work for the
    difficulty to ensure that new blocks aren''t being generated faster than the network
    can handle. This means that a new block can''t be generated more than once every
    ten minutes at this time. As the probability of each successive generation is
    low, this makes it challenging to determine which bitcoin machine is going to
    generate the next block. For a new block to be considered valid, its hash value
    must end up being less than that of the current target. This means that each block
    will have to naturally indicate that work has been completed to generate it. Each
    block also contains the hash of the preceding block, which is how the chain understands
    where each block falls within the overall blockchain. To change a block, the work
    must be redone on all the previous blocks, and new and connected hashes must be
    generated for all of them. The blockchain is then essentially protected from tampering,
    because of the enormous computational power that is needed. Proof of Stake Most
    of the significant cryptocurrencies today work off of some variation of the proof
    of work model, either through the SHA256 hash or through another, similar hash.
    However, Ethereum, bitcoin’s largest competitor, has been working on an alternative
    that could significantly change the way blockchain transactions are verified.
    In early 2017, Ethereum released the implementation guide for a hybrid proof of
    work/proof of stake system. They are rolling out this new system in phases before
    they make it the platform’s primary verification system. The plan currently states
    that the blockchain platform will alternate between the two systems. With the
    new system, about one out of every 100 blocks will use the new system while the
    rest will continue to use the old system. There hope is that the new system will
    improve the rate at which they can produce new blocks. This will mark the first
    step in the plans for Ethereum’s evolution. This will be the first time a proof
    of stake system will be used to secure a blockchain, which will be a significant
    step forward. This new system will serve as the proof of concept test for an alternative
    to the proof of work model that dominates the cryptocurrency today and provide
    proponents the ability to test their claim of its superiority. When the new proof
    of stake model is rolled out on a larger scale, it will significantly reduce the
    amount of electricity that is required to verify a single block.  '
