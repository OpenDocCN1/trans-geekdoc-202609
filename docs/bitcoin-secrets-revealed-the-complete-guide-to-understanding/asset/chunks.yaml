  trans: "\n会计行业极大地受益于区块链技术。当今经济中的每一笔交易都在个人市场参与者的私有记录中内部登记。当会计超出网络边界时，区块链技术得以实现。为企业增加价值\
    \ 有许多方式区块链技术可以为企业增加价值。一种方式是为您的企业构建网络。CyberMiles 的首席科学家 Michael Yuan 博士指出区块链如何为初创企业和公司提供价值。他的理论是区块链的关键优势在于能够为所有种类的企业构建网络。他的理论是，与其相互竞争，公司可以合作并构建一个系统，每个行业拥有自己的链。另一种区块链技术为企业增加价值的方式是为未受银行服务的人提供银行服务。这可能难以置信，但全球有大量人没有银行账户。区块链技术将为这些人提供创建银行账户的机会。某人只需开设比特币账户，即可获得数字钱包。第三种区块链技术为企业增加价值的方式是降低交易完成时间。再次，时间在区块链世界中扮演重要角色。Modular\
    \ 的首席执行官 Christopher Brown 创建了 Blossom，一个面向以太坊的数字钱包。该程序是一个多功能桌面钱包应用程序，为企业和用户提供更简便的资金管理方式。其处理资金的时间比前往银行取现更短。此外，区块链技术还可通过将物联网（IoT）数据与区块链技术相结合，为企业提供法律合约的价值。利用\
    \ IoT 设备的数据，个人和企业可以连接到已存储在区块链上的法律合约。例如，当您购买房屋时，您签署的所有文件也必须由卖方签署。这意味着所有文件必须在双方都能访问的同一位置。来自\
    \ IoT 设备的外部信息链接到区块链，使法律合约可以立即使用，且无需任何人干预。  \n\n"
