- raw: 'clearinghouse transactions) can take days to clear. This is especially true
    for transactions that are made outside of regular working hours. Just think about
    when you send a wire or make a purchase at the end of the business day on Friday.
    Without blockchains, you are unable to see any timely updates to the status of
    your funds. Often you aren''t provided an update until the following Tuesday or
    Wednesday. Blockchain technology reduces the transaction times to minutes, and
    sometimes even seconds, and they are processed around the clock. Lower Transaction
    Costs With blockchains, no outside parties are overlooking the transactions. Because
    of this blockchains can potentially reduce the transaction fees significantly.
    With reduced transaction fees, it could possibly lead to billions of dollars being
    saved annually. Chapter 6 – Risks and Challenges of Blockchain Technology ![](rsrc9F.jpg)One
    of the major draws of blockchain technology is also one of its most significant
    challenges. Currently, there is very little regulation with regards to what is
    and isn''t allowed in the blockchain space. Because of this, there have been numerous
    instances of hackers being able to make off with millions of dollars of investor
    money because of loopholes in the online blockchain systems. Despite the promise
    of security on the current blockchains, there are teething issues that hackers
    are taking advantage of to the detriment of every blockchain user. Recently, there
    was a case with Enigma, a decentralized platform that was preparing to raise money
    through an ICO. Hackers were able to hack Enigma''s website and numerous social
    accounts successfully. This allowed the hackers to send out spam to Enigma''s
    community and make off with almost $500,000. The Enigma project was launched by
    a group of MIT graduates, who sent out invites for people to join the Enigma community.
    The hackers grabbed money from those who joined the company''s official mailing
    list and Slack group. In all, there were around 9,000 users and participants who
    were affected by this security breach. The hacker''s effectively posted messages
    on Slack altered the official website and spoofed emails to the community list
    to make it look like the company was making a formal request for money. Members
    of the community responded by sending money that was deposited directly into the
    hacker''s crypto wallet. Last year there was a similar hack but on a much larger
    scale. When the Decentralized Autonomous Organization or DAO that was built on
    Ethereum was hacked and resulted in a loss of $50 million to hackers. ![](rsrc9G.jpg)The
    DAO was supposed to be a decentralized investment fund where decisions wouldn''t
    rest on just a few partners, but rather anyone who invested in the fund would
    have a vote in which companies or projects the company should invest in. It was
    set up so that the more that you contributed, the more votes you got. Since the
    fund was built to be distributed, no one could take the money and run. Unfortunately,
    due to human error and programming errors, hackers were able to exploit the system
    to receive a $50 million payday, which has of yet been recovered. Another example
    of the challenges facing blockchain technology comes from a company called OneCoin.
    Recently, a company known as Gnosis sold $12..5 million worth of a token called
    GNO in just over ten minutes. The sale was intended to pay for the development
    of an advanced prediction market. The initial coin offering, ICO, received rave
    reviews across the global press. On that same day, a company called OneCoin, based
    in Mumbai, India, was in the middle of a sales pitch for its own digital currency
    when their offices were raided by financial enforcement officers. In the end,
    eighteen OneCoin reps were jailed, and more than $2 million in investor funds
    were seized. Multiple authorities describe OneCoin, which was being touted as
    the next bitcoin, as a Ponzi scheme. By the time the offices in Mumbai were raided,
    the company had already moved at least $350 million in scammed funds. Since there
    are no checks and balances to govern the execution of ICOs, if you are going to
    invest in a coin, you need to ensure that you aren’t investing in any random idea
    that could turn out to be a scam. Major Hurdles of Blockchain Currently, there
    are significant hurdles in the way of formally legalizing and regulating crypto
    trades. Similar challenges exist with market growth and adoption. Some of the
    issues surrounding blockchain include, what kinds of tax structures are right
    for blockchain markets, how to trace and aggregate funds, and where will spending
    and income information come from and how it will be gathered. As long as these
    problems remain question marks on the policy boards of decision makers, widespread
    adoption of blockchain technology will be difficult. However, there is some promise
    for the future of blockchain technology. South Korea and Japan have made significant
    advances recently that will allow for legal bitcoin transactions, and various
    applications have opened investment channels in the blockchain space to traditional
    investors. These advancements have led to an influx of funds to different blockchain
    companies, which, in turn, have been able to invest in growth, research, and the
    promotion of their particular blockchain services. Risks of Blockchain Technology
    As a new technology, resolving challenges like transaction speed, the verification
    process, and data limits are standing in the way of making blockchain widely adopted
    technology. The regulatory status of blockchain projects is also a risk of blockchain
    technology and is currently uncertain. If financial institutions and governments
    don’t buy into the idea of blockchain technology, or if it is pushed away because
    of a lack of clear guidelines on how the industry should be regulated, blockchain
    will never gain the widespread adoption that investors and experts are hoping
    for, leaving it to be a novelty idea and nothing more. The mining of blocks is
    highly energy intensive and is becoming even more expensive with the creation
    of each new block on the chain. There may end up being a limit to how much miners
    are willing to continue to spend to solve mathematical puzzles in order to earn
    a few bitcoins as their reward. There are also cybersecurity and integration concerns
    that will have to be addressed before the general public will be willing to entrust
    their personal data to a blockchain solution. This also goes for getting the go-ahead
    from any body of users or a Board of Directors in order to make significant changes
    to or even completely replacing an existing system. Finally, there is the problem
    of social and cultural adoption of blockchain technology. Blockchain represents
    a complete shift to a decentralized network. This requires a significant buy-in
    of all users and operators on the network. Also, since it is such a significant
    development, it is not entirely understood by a majority of the population. Will
    all of these risks and hurdles, it may be several years before we see widespread
    adoption of blockchain solutions. Chapter 7 – Deciding if Blockchain Technology
    is Right for You ![](rsrc9H.jpg)The most common reasons that someone might consider
    an experiment with blockchain is a continuous desire to experiment with new technologies,
    a need for blockchain''s timestamp technology or an interest in the many different
    ways blockchain can safeguard existing data. As with any new technology, it is
    essential that you look before you leap and consider if blockchain technology
    is really right for you and your business. Know Who Will Be Looking at Your Data
    In a majority of the traditional centralized databases, anyone with access to
    it has their activities stored in case they need to be reviewed later. If you
    need to have many individuals look at your data on a regular basis, but don''t
    want them to have write access to the data, then you may benefit from using a
    blockchain. Utilizing a blockchain in your business may help to streamline the
    process by providing users with read-only access in addition to a having a log
    in a more traditional sense when it is required. Writeable Data An average user
    database is generally protected through a mix of usernames and passwords, as well
    as several levels of restricted access. You can then implement even more security
    measures to prevent your high-level data from being accessed when it shouldn’t.
    Even with all of these precautions, it is still less than the standard blockchain
    security protocols that make it perfectly clear who created which blocks and the
    time and place they created those blocks. These measures ensure that every transaction
    is always completed with the full knowledge of the creator, who can then confirm,
    and sign off on the transaction. This, of course, assumes that the individuals
    aren''t adding information directly to the node. The signature is then further
    confirmed before the block can be attached to the chain. Even if a username and
    password combination is not required for users to have access, the chain will
    still automatically log the IP address of any user who creates new blocks. Data
    Alteration If you think that you are going to need to alter data that is being
    stored in a blockchain, then blockchain technology might not be right for you
    and your business. With a centralized database, its simple to alter data by merely
    tracking down the appropriate clearance, changing the required data, and having
    those changes saved in a log. With blockchain technology, the only way to do the
    same with data that has already been stored is to simultaneously change the data
    across 51 percent of the nodes that are available on the network. While this is
    a useful security feature of blockchains, in some scenarios, it will automatically
    disqualify blockchain databases from running in several others. Data Restoration
    If you find yourself doing nothing but updating backup data, then you might discover
    blockchain technology beneficial. When you use a traditional database, you have
    to instigate backups manually, leaving you to worry about making sure that everything
    is where it needs to be. On the other hand, when it comes to a distributed database,
    the information in it is automatically updated across all available nodes every
    time new information is added to the chain. As long as all of your nodes don''t
    catastrophically fail at the same time, then you don''t have anything to worry
    about. Depending on the costs that are associated with backing up and updating
    all of your data, you may find that the additional operating expenses associated
    with a decentralized database may make it the cheaper of the two alternatives.
    Easy to Share Centralized databases are often limited concerning access, while
    a blockchain database can be temporarily connected to another blockchain database
    easily. This ability to connect to other blockchain databases makes the process
    of transferring information between the too, nearly painless. The other blockchains
    that you are connecting to could be related to a specific department within your
    company, or even related to entirely different companies. If you are considering
    doing this, it is essential to keep in mind that when you give someone access
    to your blockchain, you are giving them access to your entire blockchain. This
    may require significant planning to effectively utilize if you deal with sensitive
    information. Storage Limitations One area where a traditional database beats a
    blockchain database is in the amount of data that can be comfortably stored. When
    a new node is created in a decentralized database, the entirety of the blockchain
    is downloaded to it. This, along with the fact that nodes can be thousands and
    thousands of miles apart from one another, means that it is in your best interest
    to keep the total amount of data in your blockchain manageable. As a general point
    of reference, the database for bitcoin only has about 100 gigabytes, and it has
    been around for nearly ten years. If you need a high capacity option, you might
    need to look elsewhere. Verification Process If you are planning on running a
    private blockchain, then you don''t need to worry about funding a reward for the
    validation of blocks. In fact, you won''t even have to worry about a proof of
    work system at all. Instead, you will want to use a proof of stake model, because
    everyone in the private blockchain will have a stake in keeping the chain up-to-date
    and reliable. This means that the process for validating blocks can be more straightforward.
    However, you will still need to factor in the amount of time it will take to process
    and ensure that you have the workforce to facilitate the work. Taking the Next
    Step After analyzing the specifics, if you decide to take advantage of blockchain
    technology, it is crucial that you consider exactly how you plan to use the technology.
    If you are an existing business owner, who hope to get ahead of the curve, then
    you’ll want to focus your attention and energy on the potential ways that blockchain
    and smart technology can work together to improve the ancillary aspects of your
    business. More specifically, you’ll want to take a long look at things that have
    the potential to decrease costs and improve efficiency. This means that you will
    need to consider all the many ways that utilizing blockchain will make you more
    competitive in the eyes of your competition by allowing you to get a jump start
    on emerging trends in your industry. Alternately, you will need to consider the
    various disruptions to the way your business works that implementing blockchain
    technology might bring to light. This will require you to move things around now
    so that the disruptions you might experience are kept to a minimum. Being aware
    of what is likely to happen next will make it a lot easier to face head-on.  '
