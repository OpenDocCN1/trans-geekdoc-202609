    # 当涉及信息时代，事情自 90 年代初至中期的第一次点.com 浪潮以来，进展速度堪比闪电。


    一切从定义我们与技术交互和接入方式的用户界面工具和技术，到支付解决方案和银行解决方案，过去 20 年发生了巨大变化。社交网络、主要邮件以及人工智能（AI）和大数据分析领域的进步也同样适用，这些进步影响范围从治理协助到在线搜索。我们从为上述所有需求提供必要解决方案，发展到如今拥有能够整合各种技术方面的高级软件服务，为全球数十亿人提供高效、可靠、增值且无缝的服务。![](img/rsrc94.jpg)


    然而，随之而来的进步带来了新挑战。人工智能、大数据以及政府实施大规模监控计划的能力，以及技术无处不在，都开始引发严肃的伦理问题和技术挑战。这引发了关键问题：法律与非法监控之间该如何划界？当公司和政府在数据收集与处理时缺乏透明度，我们作为社会如何信任其数据使用实践？政府与大型企业与私人用户的关系将如何发展？正是基于这些令人兴奋且充满挑战的背景，区块链将被讨论。


    近年来，区块链成为热门技术，已远超单纯的技术潮流。许多领域专家和技术大师认为，这是人类下一步巨大的飞跃，对我们的子孙后代产生深远影响，正如过去农业和医疗发展对曾曾祖父母产生的影响一样。我们已进入新的信息时代。第
    1 章：钱的历史、加密货币与区块链 ![](img/rsrc95.jpg)


    1991 年，关于构建永久、去中心化账本（如区块链）的概念首次被讨论。但第一个实际区块链实现是在 2008 年由中本聪设计。他的初始设计被用作比特币这类数字货币的基础技术。中本聪工程的区块链作为比特币交易的公开账本。比特币若您未曾了解，是一种数字货币，目前价值约
    16,000 美元，基于区块链技术。目前市场上最知名的区块链是比特币区块链，而以太坊区块链紧随其后。


    比特币之所以能作为数字货币、价值储存手段和交换媒介，是因为其交易记录在区块链账本中。这意味着区块链不仅限于运行比特币，其应用范围可跨越贸易、金融、医疗、法律、记录管理、游戏、在线交易所、概率等众多领域。在深入理解区块链技术前，您需先了解它如何与当前货币及数字货币体系衔接。货币的历史几乎与人类一样悠久，已有大量著作探讨此主题。值得一读的是尼尔·弗格森（Niall
    Ferguson）所著《钱的 ascent: A Financial History of the World》（《钱的崛起：世界的金融史》）。货币若要运作，必须同时具备价值储存功能和交换媒介功能。历史上，我们曾使用金、银、牲畜、珠宝及盐等物品作为货币。无论其形式如何，货币必须履行这两项核心职能，且必须有信任感保障其能胜任这些角色。加密货币
    ![](img/rsrc96.jpg)


    加密货币是近几年兴起的货币形式。它通过计算机与数学加密技术创造，这些技术使我们能够转移资金并验证转账确实发生。加密货币的另一关键特性是独立于政府和中央银行，从而实现去中心化。


    如今，众多重要银行正 increasingly 卷入支撑加密货币的同类技术。但需注意，由银行主导的任何新货币均非真正的加密货币，因其受银行控制。加密货币的可靠拥护者坚持其必须保持去中心化。加密货币如何发展？比特币是市场上最知名的加密货币，曾备受炒作、关注与宣传。公众对其近年来价值剧增的态度令人着迷，也对早期以低价获取比特币而致富的传闻印象深刻。尽管其新颖性，人们迅速认识到比特币是真实货币。除比特币外，还有许多其他


