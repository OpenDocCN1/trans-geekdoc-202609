- raw: "Because there isn’t a single person in charge of these blockchains, decisions\
    \ are made by many decentralized agreement tools such as proof of work, which\
    \ a computer algorithm that is used by cryptocurrencies like bitcoin. Public blockchains\
    \ are open and crystal clear in content, making it easy for anyone who looks at\
    \ them to understand what they are and what they can do. Public blockchains, on\
    \ the other hand, are privately owned by an individual or organization. With public\
    \ blockchains, there is a single, designated person in charge. While there can\
    \ be several contributors to this type of blockchain, the final transactions are\
    \ either approved or disapproved by the person in charge and then recorded. The\
    \ purpose of consortium blockchains, also known as federated blockchains, is to\
    \ remove the only autonomy given to just one contributor by the use of private\
    \ blockchains. This type of blockchain allows for more than one contributor to\
    \ be in charge. Instead, there is a group of companies or individuals that gather\
    \ and make decisions that benefit the entire network. Blockchain Technology Breakdown\
    \ ![](rsrc9A.jpg)Blockchain technology is an irreversible, encrypted, decentralized\
    \ ledger that has the potential to make all centralized activities, processes,\
    \ and organizations entirely autonomous. This means that a person will have the\
    \ ability to eliminate the middleman and specialists, effectively reforming every\
    \ single business in the world. Blockchain technology is merely a way to keep\
    \ track of any money or trading exchanges you engage in online. You can think\
    \ of it like an accountant who keeps track of all the money that you spend. Currently,\
    \ blockchain technology is mostly used to handle any type of situation that deals\
    \ with cryptocurrency, like bitcoin. Let’s consider the following example. When\
    \ you complete a transaction using bitcoin, that specific transaction is processed\
    \ through the blockchain. Before the transaction can be achieved, you or someone\
    \ connected to your bitcoin account has to verify that the transaction is legitimate.\
    \ Once the transaction can be confirmed as being valid, it is recorded and saved\
    \ to a ledger that is controlled by the blockchain. At this point, nobody can\
    \ change or alter the transaction in any way. Only you or those with access to\
    \ your account can verify transactions. Blockchain technology is controlled by\
    \ a decentralized network, which means that it isn't controlled by any government.\
    \ By running on a decentralized system, it is much easier to conduct business\
    \ transactions. It is also more private because you don't have a federal bank\
    \ holding your money or other assets. Everything is strictly handled by you and\
    \ your company. To understand the importance of decentralization, you need to\
    \ consider the following examples of centralization and decentralization. Centralization\
    \ Example When you use your debit card at the bookstore, you swipe your card to\
    \ pay for your purchases. At this point, the company then sends a bill to your\
    \ bank for the amount agreed to when you paid for your goods. The bank then must\
    \ verify that it was you who made the purchase. The bank, once the transaction\
    \ is confirmed, releases the money to the company and records the transaction\
    \ in their ledger. The ledger the bank recorded the transaction in, includes all\
    \ the operations the bank made on behalf of the card you used. The bank has complete\
    \ control over what happens with the ledger. Other than having the ability to\
    \ look at your banking statements, you have no authority to change anything or\
    \ do anything with the ledger. Centralized ledgers are much easier to hack because\
    \ they are controlled by multiple entities. Decentralized Example Imagine that\
    \ you want to transfer 1.00 bitcoin to someone. All you have to do is tell whoever\
    \ is in charge of the network, whether it’s one person or a group of people, that\
    \ you are transferring 1.00 bitcoin. Once this is done, the transaction is approved\
    \ and then it is recorded. Decentralized blockchains are much better than centralized\
    \ transactions because it takes less time to complete a single transaction. Other\
    \ reasons decentralized blockchains are better is that a person or company can\
    \ send secure information to another person or company, such as encrypted messages\
    \ and medical records. Chapter 3 – The Business of Blockchain ![](rsrc9B.jpg)Everybody\
    \ has trust issues with something in their lives. Many people today, don’t trust\
    \ inputting their information into the internet. However, even with this mistrust,\
    \ it hasn’t stopped many people from continuing to do it. One purpose of blockchain\
    \ technology is to help ease the distrust that people have with inputting their\
    \ information on the internet and is one of the main reasons why companies are\
    \ increasingly investing their money in the use of this technology. In fact, between\
    \ 2013 and 2016, a study showed that blockchainmanaged funds reached a total of\
    \ $1.6 billion, which equates to a 1,600 percent increase. Different Industries\
    \ that Use Blockchain Technology The financial industry is one of the sectors\
    \ that have greatly benefitted from the use of blockchain technology. This is\
    \ because of the vast sums of money and transactions that are in play in the industry.\
    \ Here are a couple of examples of the different companies that are utilizing\
    \ blockchain technology today. • Crowdlending  \n\nCrowdlending campaigns have\
    \ started to take over the act of having to go to the bank to get a loan. Crowdlending\
    \ is a person to person lending company. Today, there are, on average, more than\
    \ 50 billion person to person loans being made worldwide. This industry will likely\
    \ feel an enormous boost with the use of blockchain technology. • IBM Global Financing\
    \ Unit  \n\nIBM has become one of the major players in blockchain technology use,\
    \ with a proven track record of being a great asset for tracing transactions.\
    \ IBM’s Global Financing Unit processes $2.9 million in payables for the company\
    \ every year. It is also responsible for granting credit to more than four thousand\
    \ suppliers. IBM has been successful in lowering dispute settlements by 25 percent,\
    \ thanks in part to blockchain technology. This decrease in percentage has resulted\
    \ in the group being able to free up $100 million in pre-confirmed capital for\
    \ other purposes. • Bookkeeping  "
