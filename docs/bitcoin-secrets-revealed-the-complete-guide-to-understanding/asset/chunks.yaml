    \ called OneCoin. Recently, a company known as Gnosis sold $12..5 million worth\
    \ of a token called GNO in just over ten minutes. The sale was intended to pay\
    \ for the development of an advanced prediction market. The initial coin offering,\
    \ ICO, received rave reviews across the global press. On that same day, a company\
    \ called OneCoin, based in Mumbai, India, was in the middle of a sales pitch for\
    \ its own digital currency when their offices were raided by financial enforcement\
    \ officers. In the end, eighteen OneCoin reps were jailed, and more than $2 million\
    \ in investor funds were seized. Multiple authorities describe OneCoin, which\
    \ was being touted as the next bitcoin, as a Ponzi scheme. By the time the offices\
    \ in Mumbai were raided, the company had already moved at least $350 million in\
    \ scammed funds. Since there are no checks and balances to govern the execution\
    \ of ICOs, if you are going to invest in a coin, you need to ensure that you aren’t\
    \ investing in any random idea that could turn out to be a scam. Major Hurdles\
    \ of Blockchain Currently, there are significant hurdles in the way of formally\
    \ legalizing and regulating crypto trades. Similar challenges exist with market\
    \ growth and adoption. Some of the issues surrounding blockchain include, what\
    \ kinds of tax structures are right for blockchain markets, how to trace and aggregate\
    \ funds, and where will spending and income information come from and how it will\
    \ be gathered. As long as these problems remain question marks on the policy boards\
    \ of decision makers, widespread adoption of blockchain technology will be difficult.\
    \ However, there is some promise for the future of blockchain technology. South\
    \ Korea and Japan have made significant advances recently that will allow for\
    \ legal bitcoin transactions, and various applications have opened investment\
    \ channels in the blockchain space to traditional investors. These advancements\
    \ have led to an influx of funds to different blockchain companies, which, in\
    \ turn, have been able to invest in growth, research, and the promotion of their\
    \ particular blockchain services. Risks of Blockchain Technology As a new technology,\
    \ resolving challenges like transaction speed, the verification process, and data\
    \ limits are standing in the way of making blockchain widely adopted technology.\
    \ The regulatory status of blockchain projects is also a risk of blockchain technology\
    \ and is currently uncertain. If financial institutions and governments don’t\
    \ buy into the idea of blockchain technology, or if it is pushed away because\
    \ of a lack of clear guidelines on how the industry should be regulated, blockchain\
    \ will never gain the widespread adoption that investors and experts are hoping\
    \ for, leaving it to be a novelty idea and nothing more. The mining of blocks\
    \ is highly energy intensive and is becoming even more expensive with the creation\
    \ of each new block on the chain. There may end up being a limit to how much miners\
    \ are willing to continue to spend to solve mathematical puzzles in order to earn\
    \ a few bitcoins as their reward. There are also cybersecurity and integration\
    \ concerns that will have to be addressed before the general public will be willing\
    \ to entrust their personal data to a blockchain solution. This also goes for\
    \ getting the go-ahead from any body of users or a Board of Directors in order\
    \ to make significant changes to or even completely replacing an existing system.\
    \ Finally, there is the problem of social and cultural adoption of blockchain\
    \ technology. Blockchain represents a complete shift to a decentralized network.\
    \ This requires a significant buy-in of all users and operators on the network.\
    \ Also, since it is such a significant development, it is not entirely understood\
    \ by a majority of the population. Will all of these risks and hurdles, it may\
    \ be several years before we see widespread adoption of blockchain solutions.\
    \ Chapter 7 – Deciding if Blockchain Technology is Right for You ![](rsrc9H.jpg)The\
    \ most common reasons that someone might consider an experiment with blockchain\
    \ is a continuous desire to experiment with new technologies, a need for blockchain's\
    \ timestamp technology or an interest in the many different ways blockchain can\
    \ safeguard existing data. As with any new technology, it is essential that you\
    \ look before you leap and consider if blockchain technology is really right for\
    \ you and your business. Know Who Will Be Looking at Your Data In a majority of\
    \ the traditional centralized databases, anyone with access to it has their activities\
    \ stored in case they need to be reviewed later. If you need to have many individuals\
    \ look at your data on a regular basis, but don't want them to have write access\
    \ to the data, then you may benefit from using a blockchain. Utilizing a blockchain\
    \ in your business may help to streamline the process by providing users with\
    \ read-only access in addition to a having a log in a more traditional sense when\
    \ it is required. Writeable Data An average user database is generally protected\
    \ through a mix of usernames and passwords, as well as several levels of restricted\
    \ access. You can then implement even more security measures to prevent your high-level\
    \ data from being accessed when it shouldn’t. Even with all of these precautions,\
    \ it is still less than the standard blockchain security protocols that make it\
    \ perfectly clear who created which blocks and the time and place they created\
    \ those blocks. These measures ensure that every transaction is always completed\
    \ with the full knowledge of the creator, who can then confirm, and sign off on\
    \ the transaction. This, of course, assumes that the individuals aren't adding\
    \ information directly to the node. The signature is then further confirmed before\
    \ the block can be attached to the chain. Even if a username and password combination\
    \ is not required for users to have access, the chain will still automatically\
    \ log the IP address of any user who creates new blocks. Data Alteration If you\
    \ think that you are going to need to alter data that is being stored in a blockchain,\
    \ then blockchain technology might not be right for you and your business. With\
    \ a centralized database, its simple to alter data by merely tracking down the\
    \ appropriate clearance, changing the required data, and having those changes\
    \ saved in a log. With blockchain technology, the only way to do the same with\
    \ data that has already been stored is to simultaneously change the data across\
    \ 51 percent of the nodes that are available on the network. While this is a useful\
    \ security feature of blockchains, in some scenarios, it will automatically disqualify\
    \ blockchain databases from running in several others. Data Restoration If you\
    \ find yourself doing nothing but updating backup data, then you might discover\
    \ blockchain technology beneficial. When you use a traditional database, you have\
    \ to instigate backups manually, leaving you to worry about making sure that everything\
    \ is where it needs to be. On the other hand, when it comes to a distributed database,\
    \ the information in it is automatically updated across all available nodes every\
    \ time new information is added to the chain. As long as all of your nodes don't\
    \ catastrophically fail at the same time, then you don't have anything to worry\
    \ about. Depending on the costs that are associated with backing up and updating\
    \ all of your data, you may find that the additional operating expenses associated\
    \ with a decentralized database may make it the cheaper of the two alternatives.\
    \ Easy to Share Centralized databases are often limited concerning access, while\
    \ a blockchain database can be temporarily connected to another blockchain database\
    \ easily. This ability to connect to other blockchain databases makes the process\
    \ of transferring information between the too, nearly painless. The other blockchains\
    \ that you are connecting to could be related to a specific department within\
    \ your company, or even related to entirely different companies. If you are considering\
    \ doing this, it is essential to keep in mind that when you give someone access\
    \ to your blockchain, you are giving them access to your entire blockchain. This\
    \ may require significant planning to effectively utilize if you deal with sensitive\
    \ information. Storage Limitations One area where a traditional database beats\
    \ a blockchain database is in the amount of data that can be comfortably stored.\
    \ When a new node is created in a decentralized database, the entirety of the\
    \ blockchain is downloaded to it. This, along with the fact that nodes can be\
    \ thousands and thousands of miles apart from one another, means that it is in\
    \ your best interest to keep the total amount of data in your blockchain manageable.\
    \ As a general point of reference, the database for bitcoin only has about 100\
    \ gigabytes, and it has been around for nearly ten years. If you need a high capacity\
    \ option, you might need to look elsewhere. Verification Process If you are planning\
    \ on running a private blockchain, then you don't need to worry about funding\
    \ a reward for the validation of blocks. In fact, you won't even have to worry\
    \ about a proof of work system at all. Instead, you will want to use a proof of\
    \ stake model, because everyone in the private blockchain will have a stake in\
    \ keeping the chain up-to-date and reliable. This means that the process for validating\
    \ blocks can be more straightforward. However, you will still need to factor in\
    \ the amount of time it will take to process and ensure that you have the workforce\
    \ to facilitate the work. Taking the Next Step After analyzing the specifics,\
    \ if you decide to take advantage of blockchain technology, it is crucial that\
    \ you consider exactly how you plan to use the technology. If you are an existing\
    \ business owner, who hope to get ahead of the curve, then you’ll want to focus\
    \ your attention and energy on the potential ways that blockchain and smart technology\
    \ can work together to improve the ancillary aspects of your business. More specifically,\
    \ you’ll want to take a long look at things that have the potential to decrease\
    \ costs and improve efficiency. This means that you will need to consider all\
    \ the many ways that utilizing blockchain will make you more competitive in the\
    \ eyes of your competition by allowing you to get a jump start on emerging trends\
    \ in your industry. Alternately, you will need to consider the various disruptions\
    \ to the way your business works that implementing blockchain technology might\
    \ bring to light. This will require you to move things around now so that the\
    \ disruptions you might experience are kept to a minimum. Being aware of what\
    \ is likely to happen next will make it a lot easier to face head-on.  \n"
  trans: "\n-   [clearinghouse transactions]的交易可以花费数天才能结算。这在交易在非工作时间进行时尤为如此。想想你在周五下班后发送电汇或进行购买的情况。如果没有区块链，你无法看到资金状态的及时更新。通常，你需要等到下周二或周三才能收到更新。区块链技术将交易时间缩短到分钟，甚至秒级，并且全天候处理。降低交易成本\
    \ 由于区块链无需中介机构监督交易，因此区块链有可能显著降低交易费用。降低交易费用可能导致每年节省数十亿美元。第 6 章 – 区块链技术的风险与挑战 ![](img/rsrc9F.jpg)区块链技术的主要吸引力也是其最大的挑战之一。目前，关于区块链空间中什么是被允许的、什么是不被允许的，存在极少的监管。因此，黑客多次利用在线区块链系统中的漏洞窃取数百万美元的投资者资金。尽管当前区块链声称具有安全性，但仍存在一些初步问题，黑客正利用这些问题损害每个区块链用户的利益。最近，Enigma\
    \ 这一去中心化平台因黑客入侵其网站和多个社交媒体账号而遭遇安全事件。黑客借此向 Enigma 社区发送垃圾信息，并窃取近 50 万美元。Enigma 项目由一群麻省理工学院毕业生创立，他们向公众发出加入\
    \ Enigma 社区的邀请。黑客从该公司的官方邮件列表和 Slack 群组中获取资金，影响了约 9,000 名用户和参与者。黑客在 Slack 上发布的消息篡改了官方网站，并伪造了邮件列表中的公司正式资金请求，使得社区成员误以为公司在正式征集资金。社区成员随后将资金直接转入黑客的加密钱包。上一年发生过类似但规模更大的黑客事件：当基于以太坊的去中心化自治组织（DAO）被黑客攻破，导致黑客获得\
    \ 5000 万美元的不法收益，目前尚未挽回。![(rsrc9G.jpg)DAO 原本设想为去中心化投资基金，决策权不应仅由少数合伙人掌握，而是所有投资者均可投票决定投资哪些公司或项目。基金设计为按投入金额赋予投票权，且因基金结构分布式，无人能卷款逃跑。遗憾的是，由于人为错误和编程缺陷，黑客得以利用系统漏洞获取\
    \ 5000 万美元，至今尚未挽回。另一家面临区块链技术挑战的公司是 OneCoin。最近，一家名为 Gnosis 的公司在短短十分钟内以 1250 万美元的代价出售了其代币\
    \ GNO，用于开发先进的预测市场。此次首次代币发行（ICO）在全球媒体中获得了热烈好评。与此同时，位于印度孟买的 OneCoin 公司正在进行其数字货币的销售推广，结果其办公室被金融执法人员突袭。最终，18\
    \ 名 OneCoin 代表被捕，并有超过 200 万美元的投资者资金被没收。多位权威机构将 OneCoin（被誉为“下一个比特币”）描述为庞氏骗局。在孟买办公室被突袭时，公司已转移至少\
    \ 3.5 亿美元的诈骗资金。由于 ICO 缺乏监管和制衡机制，若要投资加密货币，必须确保自己投资的不是随意构想，以免落入诈骗陷阱。 重大障碍 目前，正式合法化和监管加密交易仍面临重大障碍，市场增长和采用也存在类似挑战。围绕区块链的问题包括：区块链市场应采用何种税收结构、如何追踪和汇总资金、资金流入与支出信息的来源及收集方式等，这些问题若仍未在决策者的政策板上得到明确解答，区块链技术的广泛采用将面临困难。然而，未来区块链技术仍有希望。韩国和日本最近取得了重要进展，将允许合法比特币交易，并开放多个应用以供传统投资者进入区块链领域。这些进展吸引了大量资金流向不同的区块链公司，这些公司随后能够投入增长、研究和推广其区块链服务。\
    \ 区块链技术的风险 作为一项新技术，区块链在解决交易速度、验证流程及数据限制等挑战方面仍是广泛采用的障碍。区块链项目的监管状态也是风险之一，目前仍处于不确定状态。如果金融机构和政府不认可区块链技术，或因缺乏明确的行业监管指引而推迟其发展，区块链将永远无法实现投资者和专家所期待的广泛采用，仅成为一种新颖概念。区块链挖矿过程高度耗能，且随着链上每个新区块的创建，成本不断上升。未来可能出现矿工因解决数学谜题仅换取少量比特币奖励而不愿继续投入的局面。此外，还有网络安全和集成问题需要解决，才能让公众愿意将个人数据委托给区块链方案。这也包括获得用户群体或董事会的批准，以便对现有系统进行重大改动或完全替换。最后，区块链技术的社会与文化接受度仍是一个挑战。区块链代表向去中心化网络的彻底转变，这需要所有网络用户和运营者的大力支持。且由于其重大性，大多数人对其并不完全理解。在经历了上述所有风险与障碍后，我们可能需要数年时间才能看到区块链解决方案的广泛采用。第\
    \ 7 章 – 判断区块链技术是否适合你 ![](img/rsrc9H.jpg)有人考虑尝试区块链的常见原因包括：持续尝试新技术的欲望、对区块链时间戳技术的需求，或对区块链在多种方式上保护现有数据的兴趣。与任何新技术一样，在跃进之前，务必审慎考量区块链技术是否真正适合你及你的业务。了解谁会查看你的数据\
    \ 在大多数传统中心化数据库中，拥有访问权限的人的活动都会被记录，以便日后审查。如果你需要让大量人员定期查看数据，但又不希望他们拥有写入权限，那么使用区块链可能会带来好处。利用区块链的优势，你的业务流程可能会得到简化，因为它能为用户提供只读访问权限，同时在必要时提供更传统意义上的日志记录。\
    \ 可写入数据 普通用户数据库通常通过用户名和密码以及多层权限限制来保护。你可以在此基础上实施更多安全措施，防止高价值数据在不应被访问时被访问。尽管有这些预防措施，传统数据库仍不如区块链的安全协议明确：区块链能清晰记录谁创建了哪个区块、何时何地创建的，并要求创建者确认并签名交易。这前提是用户不会直接向节点添加信息。签名随后会在区块链上得到验证，才能将区块附加到链中。即使不需要用户名和密码，区块链也会自动记录创建新区块的用户\
    \ IP 地址。 数据篡改 如果你认为需要对已存储在区块链中的数据进行修改，那么区块链技术可能不适合你的业务。中心化数据库的数据修改非常简单：只需找到适当的授权、更改数据并保存变更日志即可。而区块链技术要求你必须同时在网络中\
    \ 51% 的节点上修改数据，这在某些场景下会自动使区块链数据库被排除在运行之外。 数据恢复 如果你只需不断更新备份数据，那么区块链技术可能会对你有帮助。传统数据库需要手动发起备份，让你担心确保所有数据都在正确位置。相反，分布式数据库会在每次向链中添加新信息时，自动将信息同步到所有可用节点。只要所有节点不会同时出现\
    \ catastrophic 失败，你就无需担心数据丢失。根据备份与更新数据的成本，你可能会发现去中心化数据库的运营费用更具成本效益，从而成为更便宜的选择。\
    \ 易于共享 中心化数据库在访问权限上存在局限，而区块链数据库可以轻松临时连接到其他区块链数据库。这种连接能力使得不同区块链之间的信息传输变得近乎无痛。你可以将数据连接到公司内部的特定部门，或连接到完全不同的公司。若考虑此类连接，请牢记：当你授予他人访问你的区块链时，你实际上授予其访问整个区块链的权限。这对涉及敏感信息的情况而言，需要进行重大规划才能有效利用。\
    \ 存储限制 在传统数据库与区块链数据库的对比中，存储容量是一个明显优势。当在去中心化数据库中新增节点时，它会下载整个区块链。加之节点之间可能相隔数千甚至数万英里，因此保持区块链内的数据量适中尤为重要。作为参考，比特币的数据库仅约\
    \ 100 GB，且已有将近十年历史。若需高容量方案，可能需另寻他处。 验证流程 若计划运行私有区块链，则无需为区块链的区块验证提供奖励，甚至无需考虑工作量证明（PoW）机制。相反，建议采用权益证明（PoS）模型，因为私有区块链中的每个参与者都有利益保持链的更新和可靠。这意味着区块链验证流程会更为简洁。但仍需考虑处理时间以及是否具备足够的人力资源来推动工作。\
    \ 进一步步骤 在分析具体情况后，若决定利用区块链技术，必须明确其具体用途。若你是现有业务所有者，希望在行业中保持领先，则应重点关注区块链与智能技术如何协同提升业务\
    \ ancillary（附属）方面的效率与竞争力。具体而言，需深入审视能够降低成本、提升竞争力的区块链应用场景，以便抢先布局行业新兴趋势。同时，也需评估区块链技术可能带来的业务流程\
    \ disruption（颠覆），提前规划以将其影响降到最低。了解未来可能发生的变化，将使你能够更从容地面对挑战。  \n\n"
