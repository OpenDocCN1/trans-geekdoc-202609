- raw: 'cryptocurrencies, who like bitcoin, have had massive increases in their dollar
    value. Legitimate government and businesses are pursuing an increasing involvement
    in cryptocurrency. Despite critics, the market for these currencies is thriving.
    Cryptocurrencies, Fiat Currencies, and Stocks Fiat currencies are the currencies
    we use daily, like the dollar, yen, euro, and renminbi. Despite having the word
    currency in the word cryptocurrency, they are more similar to stocks and shares
    of the stock market than between fiat currencies and cryptocurrency. When you
    purchase cryptocurrency, you get some of the coins for that cryptocurrency, which
    acts like a technology stock and a digital entry into a ledger, known as a blockchain.
    Blockchains Blockchains are digital ledgers and can be formally defined as a continuously-growing
    list of records that are linked tougher and secured using advanced cryptography.
    In more simple terms, a blockchain is literally a chain of blocks. Each record
    in the list of a blockchain’s chain is called a block that contains specific types
    and pieces of information. Each block will usually include some sort of pointer
    as a link to the previous bock, transaction data, and a timestamp, which can take
    a variety of forms. Another way to look at is that a blockchain is much like a
    database where each entry is linked to the previous and next entry. This means
    that the information contained within the blockchain can''t be changed, once a
    block with specific data is added to the chain. Depending on the chain that you
    are looking at, there are often useful tools for exploring that will allow you
    to scan the transaction data. Blockchains are resistant to being modified because
    of their inherent design. This allows blockchains to record transactions between
    different parties efficiently. These transactions are not only verifiable but
    permanent as well. Once information is recorded in a blockchain, the data cannot
    be altered after-the-fact without altering the subsequent blocks by having the
    majority of nodes on the network agreeing to the change. This inability to change
    the data within a blockchain make illegal or unfair actions almost impossible
    to carry out. If a hacker wished to alter information within a blockchain, they
    would have to gain control of every node. This security is one of the most useful
    characteristics of the blockchain. Since blockchains are designed to be verifiable
    and permanent, they are especially suitable for recording events, maintaining
    medical records, drawing up agreements, fundraising, and keeping track of other
    documents. Chapter 2 – Blockchain Basics ![](rsrc97.jpg)Whether you are aware
    of it or not, you conduct business every day, even if you don''t work. At some
    point, everyone gets online and initiates some kind of transaction. Whether it
    is purchasing something from Amazon or buying something from iTunes, you are engaging
    in the business of blockchain technology. Even though the term “blockchain” is
    relatively new, the technology has been around for about a decade. The digitized
    ledger that Satoshi Nakamoto created in 2008 was the basis for the spreadsheets
    that manage cryptocurrencies and other online trading transactions. The technology
    is used in cryptography, which is how text is coded on the Internet. Cryptography
    is used in blockchain technology to create distributed trust networks. This, in
    turn, allows any contributor to the system to operate the transactions securely
    without having to obtain authorization from someone else in the digital ledger.
    These transactions are then verified, approved, and then recorded in an encrypted
    block. This block is saved intermittently and then connected to the previous block,
    which in turn creates a chain. Components of a Blockchain Two main parts make
    up a blockchain. The first component is the decentralized network. The decentralized
    network is what facilitates and verifies the transactions that are made. Having
    blockchains on a decentralized network means that the software isn''t limited
    to one computer system. Instead, it can be controlled on multiple computer systems,
    and more importantly, it isn''t controlled by the government. ![](rsrc98.jpg)The
    second component is the indisputable ledger where the transactions are processed
    and recorded in a location that is secure. This security makes it almost impossible
    for someone who is not connected to the chain to make changes or steal information.
    Since there can be numerous contributors involved in any blockchain, any of the
    contributors can control the information that is entered into the ledger. Since
    every transaction is processed securely, and given a permanent time-stamp, it
    can become challenging for another contributor to alter the ledger in any way.
    Blockchain technology can be used for various computerized and internet-based
    application. One of these applications is smartcontracts. Smart contracts allow
    businesses to automatically verify and execute agreements that function independently
    in a secure environment. Blockchain technology acts as a middleman for implementing
    all business deals, protocols, and programmed exchanges of information in smart
    contracts. As more and more transactions are completed online, to not only run
    our personal lives but professional lives as well, more and more deals are being
    signed and created online. Blockchain applications have begun to become increasingly
    popular in the medical field in recent years. Researchers are now investigating
    these applications dealing with digital identity, insurance records, and medical
    records. There are many medical offices today that use some kind of digital machine
    to verify that the information they have on file is, in fact, your information.
    Security Concerns ![](rsrc99.jpg)One of the most significant issues people are
    faced with today is the thought that all their information could be compromised
    by hackers because most of our personal information is digitized. It also seems
    that it has become too easy for complete strangers to access, copy and tamper
    with our data. However, it is still a risk that we all take despite the increasing
    probability of being hacked. Blockchain technology was created to help ensure
    that doesn''t happen or in the very least make it more challenging to try. For
    someone to hack the blockchain system, they would need to go back and change every
    single block. That would require a ton of effort and patience because blockchains
    could have upwards of billions of chains linked that a person would have to go
    through and change. Changing just one or two blocks would automatically send an
    alert that the system is being hacked. This is only one of the many reasons why
    blockchain technology has become so popular. Blockchain technology can be used
    for a variety of other things as well. It can also be used for global payments,
    sharing music, or tracking diamond sales. Types of Blockchain There are three
    major types of blockchain. There are private blockchains, public blockchains,
    and consortium blockchains. Public blockchains are created by the public. Anyone
    can participate in the creation, confirmation, and recordation of the content
    that is put into the blockchain. There isn''t just one person in charge of overseeing
    the transactions that happen in this kind of blockchain.  '
