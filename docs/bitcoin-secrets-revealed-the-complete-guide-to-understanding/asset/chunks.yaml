    如果你正在考虑围绕区块链创办新的业务，那么你应该尽可能多地与不同的区块链合作。这将帮助你更深入地理解技术，并有助于让技术更加普及，这是新区块链公司起步的关键。如果你希望借助区块链进入主流，那么你需要做一切努力确保区块链技术实现普及。同时，你也要意识到，这条道路注定会很艰难。然而，区块链技术的许多重要好处，往往只能被已经拥有现有基础设施的公司充分利用。这意味着区块链技术普及的最现实预测是：会有少数几家公司抢占风头，其余空间则由能够配合好、在竞争对手之前将自身与区块链技术结合的传统力量成员所占据。


    Chapter 8 – Blockchain Implementation Mistakes to Avoid ![](img/rsrc9J.jpg)在区块链炒作的氛围中，很容易冲动加入而不去审视如何构建自己的区块链分发系统，这是一个巨大的错误。在跃入之前，你需要确保避免以下错误。


    Having Unrealistic Expectations 如果你计划高效使用区块链，首先要明白它并非解决所有问题的万能药。你可以搭建一个私有系统，且只有少数人需要知晓，即便初始测试出现问题。这同样适用于每个区块中常规存储的信息量。整个区块链的大部分内容最终会复制到每个新节点上，因此过于臃肿的链条会为使用区块链的所有计算机带来不必要的负担。要记住，比特币区块链总大小仅为
    55 GB。虽然这在安全存储私有数据方面表现良好，但在大规模数据使用场景中并非最佳选择。此类情况下，集中式存储系统会更合适。同时要记住，尽管区块链系统内置了多种防错机制，但这并不意味着它们无懈可击。由于每个区块仅通过哈希值引用，人类更容易将一个区块误认为是另一个区块，从而造成损害。因此，若要在业务中使用区块链，必须实施检查机制以防止此类错误，从而获得最佳结果。


    Underestimating the Time Commitment 完全掌握区块链技术的复杂性需要大量时间。如果你计划将区块链系统实施到底，必须明确了解所需的时间投入，以便充分发挥区块链的潜力。阅读本书后，你仍需进一步研究，以确定最适合你业务需求的区块链实现方式。这意味着你需要明确自己将定期使用区块链的目的，以及可能涉及的次要或衍生职责。只有在对这些方面有清晰认识后，才能确定适合你的创建软件类型。


    区块链创建工具的市场并不拥挤，这意味着你必须精准把握自己需要的可靠、有效的工具。错误的选择会让创建过程变得比必要的更加繁琐。


    Being Impatient 在明确自己将如何使用区块链分布式数据库以及如何实施区块链后，务必避免急于求成。区块链技术的实现过程往往漫长且复杂，必须按部就班、稳步推进。虽然过程可能耗时，但必须完整执行并进行彻底测试，方可在实际场景中依赖区块链。搭建一个优质区块链需要时间，急于求成只会招致问题。因此，你需要制定一个真实反映项目完成时长的时间表，并考虑获得他人（尤其是关键决策者）认可所需的时间。


    Not Limiting Access 对于区块链等令人兴奋的新技术，自然会有许多人想尝试。如果你运营的是私有区块链，则必须在获得适当培训前，不要让过多人接入，否则初创区块链容易因
    inexperienced（ inexperienced 为英文，保持原样）操作而被推翻。在私有区块链的核心访问方面，务必将为新区块链生成的私有访问密钥安全存储，一旦丢失，将无法恢复对区块链的控制权。


    Conclusion ![](img/rsrc9K.jpg)历史上不多的发现与发明能够长久地影响人类进步的方向与速度。区块链技术有望成为其中之一。它在重新定义航空运输、海运货运和全球物流，以及通过提供安全可靠的医疗记录来转变医疗领域的潜力，以及在微金融、金融、信贷投资和预测市场等领域的机遇，表明世界正逐步认识到区块链技术的价值。该技术的能力仍在被界定，仍有大量工作需要完成。数百万美元的投资正持续流入此领域的研究与开发，每天都有新的区块链想法、初创公司和项目推出，每个都希望成为引爆点，改变现有运作方式。现在正是变革的时机，新区块链技术正推动这场变革。然而，前行时我们需要采取谨慎步伐，确保正确使用技术并让尽可能多的人受益。如果你正考虑为业务采用区块链技术，唯一能够真正掌握它的途径是坚持成为该领域的终身学习者。

