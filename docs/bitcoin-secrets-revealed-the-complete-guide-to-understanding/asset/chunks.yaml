  trans: "\n因为没有单一的人负责这些区块链，决策是由许多去中心化的共识工具（如工作证明）做出的，这是比特币等加密货币使用的计算机算法。公共区块链内容公开透明，任何查看它们的人都能轻松理解它们是什么以及能做什么。相反，私有区块链是由个人或组织所有的。公共区块链有一个指定的人负责。虽然这种区块链可以有多个贡献者，但最终交易要么由负责人批准，要么由其否决，然后记录。联盟区块链（也称为联邦区块链）的目的是消除仅由一个贡献者拥有的唯一自主权——这是私有区块链的特点。这种区块链允许多个贡献者共同负责。相反，是一群公司或个人聚集在一起，做出对整个网络有益的决策。区块链技术分解\
    \ ![](img/rsrc9A.jpg)区块链技术是一种不可逆转、加密、去中心化的账本，有潜力使所有集中化的活动、流程和组织完全自主。这意味着个人有能力消除中间人和专家，从而彻底改革世界上每一个商业实体。区块链技术仅仅是用来记录你在线上进行的任何金钱或交易活动。你可以把它想象成一位会计师，记录你所有的支出。目前，区块链技术主要用于处理与加密货币（如比特币）相关的任何情况。让我们考虑以下例子。当你使用比特币完成交易时，该交易会通过区块链处理。在交易完成之前，你或与你的比特币账户相关的人必须验证该交易的合法性。一旦交易被确认有效，它就会被记录并保存到由区块链控制的账本中。此时，任何人都无法更改或修改该交易。只有你或拥有你账户权限的人才能验证交易。区块链技术由去中心化网络控制，这意味着它不受任何政府的控制。通过在去中心化系统上运行，它使业务交易更加便捷。它也更加私密，因为没有央行银行持有你的钱或其他资产。一切都由你和你的公司严格管理。要理解去中心化的重要性，你需要考虑以下中央化与去中心化的例子。中央化例子\
    \ 当你在书店刷卡付款时，你刷卡支付购买费用。此时，公司会将账单发送到你的银行，金额为你购买时约定的金额。随后，银行必须确认是你本人进行了购买。银行在确认交易后，会向公司释放资金并将交易记录在其账本中。银行记录的账本包含了你使用的卡片所进行的所有操作。银行对账本拥有完全控制权。除了能查看你的银行对账单外，你没有任何权限去修改或处理账本。中央化账本更容易被黑客攻击，因为它们由多个实体控制。去中心化例子\
    \ 想象你想转让 1.00 比特币。你只需告诉网络负责人（无论是一个人还是一群人）你正在转让 1.00 比特币。完成后，交易即被批准并记录。去中心化区块链比集中式交易更好，因为单笔交易完成时间更短。其他优势包括：个人或公司可以向另一名个人或公司发送安全信息，例如加密消息和医疗记录。第\
    \ 3 章 – 区块链的商业 ![](img/rsrc9B.jpg)每个人都对某些事物存在信任问题。如今，许多人不信任将信息输入互联网。尽管如此，这并未阻止许多人继续使用互联网。区块链技术的一个目的，就是缓解人们对在互联网上输入信息的不信任，这也是许多公司日益投资于此技术的主要原因。事实上，2013\
    \ 至 2016 年间，一项研究显示区块链管理的资金达到了 16 亿美元，增长了 1,600 ％。使用区块链技术的不同行业 金融行业是受益最大的行业之一，因为该行业涉及巨大的资金和交易量。以下是一些今天正在利用区块链技术的公司示例。•\
    \ 众筹借贷（Crowdlending） 众筹借贷活动已开始取代去银行申请贷款的方式。众筹借贷是一种点对点借贷公司。目前，全球平均每天有超过 500 亿美元的点对点借贷在进行。如果采用区块链技术，这一行业将获得巨大的提升。•\
    \ IBM 全球融资部  \n\nIBM 已成为区块链技术的主要参与者，拥有追踪交易的 proven track record。IBM 全球融资部每年处理\
    \ 290 万美元的应付账款，并负责为超过四千家供应商授予信用。IBM 通过区块链技术，使争议调解减少了 25％，这使得该部门能够释放 1 亿美元的预确认资本用于其他用途。•\
    \ 记账  \n\n"
