- raw: "When it comes to the information age, things have progressed at breakneck\
    \ speed, ever since the first dot-com wave in the early to mid-90s. Everything\
    \ from the user interface tools and technologies that have defined how we interact\
    \ and interface with technology. Everything from payment solutions to banking\
    \ solutions has dramatically changed over the last 20 years. The same can be said\
    \ for social networks and primary email, along with the advancements that have\
    \ been made in fields of artificial intelligence (AI) and big data analysis, both\
    \ of which have an impact on everything from helping with governance to online\
    \ search. Collectively, we've gone from necessary solutions for all of the above\
    \ to have sophisticated software services that combine various aspects of technology\
    \ to deliver effective, robust, valueadded, and seamless services to billions\
    \ of people around the world. ![](rsrc94.jpg)However, with all the progress comes\
    \ new challenges. AI, big data, and the ability of governments to implement mass\
    \ surveillance initiatives, and the ubiquity of technology all around have begun\
    \ to pose serious ethical questions and technological challenges. This leads to\
    \ the question, where do you draw the line between legal and illegal surveillance?\
    \ How can we, as a society, trust the data usage collection and manipulation practices\
    \ of companies and governments when they aren’t transparent. When it comes to\
    \ the role of government and big corporations and their relationships with private\
    \ users, where is the world headed? It is with this exciting and challenging background\
    \ in mind that blockchain will be discussed. In recent years, blockchain has become\
    \ a popular technology and so much more than the latest tech fad. It is, in the\
    \ opinion of many subject area experts and tech gurus, the next giant leap for\
    \ humanity and something that will have a significant impact on our children and\
    \ us as the farming and healthcare developments of the past had an effect on our\
    \ great-great-grandparents more than a century ago. We have now entered the new\
    \ Information Age. Chapter 1 – A History of Money, Cryptocurrency, and Blockchain\
    \ ![](rsrc95.jpg)The concept behind establishing a permanent, decentralized ledger,\
    \ like blockchain, was first discussed in 1991. However, the first actual blockchain\
    \ implementation was designed in 2008, by Satoshi Nakamoto. It was his initial\
    \ design that was used as the underpinning technology that runs the digital currency\
    \ known as bitcoin. The blockchain that was engineered by Mr. Satoshi serves as\
    \ the public ledger for all bitcoin transactions. Bitcoin, if you don't already\
    \ know, is a digital currency that is now worth roughly $16,000, that runs on\
    \ blockchain technology. The most wellknown blockchain on the market today is\
    \ that for Bitcoin, with the Ethereum blockchain coming in a close second.  \n\
    \nThe technology that allows bitcoin to serve as a digital currency, as a store\
    \ of value, and as a medium of exchange is blockchain because bitcoin transactions\
    \ are recorded in a blockchain ledge. This means blockchains are not limited to\
    \ running bitcoin; rather blockchain application can span the entire gamut of\
    \ trade, finance, healthcare, legal operations, records management, gaming, online\
    \ exchanges, probability, and more. Before you can get started understanding blockchain\
    \ technology, you have to know how it fits in with our current currency and digital\
    \ currency. Money Money is nearly as old as humanity. Many books have been written\
    \ on the subject. One that is worth checking out if you are interested in the\
    \ matter is The Ascent of Money: A Financial History of the World by Niall Ferguson.\
    \ Money, to work, has to be both a store of value as well as a means of exchange.\
    \ In the past, we've used many different items for money, including gold, silver,\
    \ cattle, beads, and salt. No matter the form it takes, money has to execute these\
    \ two essential functions. Also, there has to be trust that these roles can be\
    \ fulfilled by the money. Cryptocurrency ![](rsrc96.jpg)A cryptocurrency is a\
    \ form of currency that has become popular over the last several years. Cryptocurrency\
    \ is created by using the encryption techniques of computing and mathematics.\
    \ These techniques allow us to transfer funds and verify that the transfer did,\
    \ in fact, occur. Another essential aspect of cryptocurrency is that it is independent\
    \ of governments and central banks, making them decentralized.  \n\nThese days,\
    \ many important banks are becoming increasingly involved with the same kind of\
    \ technology that underlies cryptocurrency. However, it is essential to understand\
    \ that any currency that arises from their endeavors won't be true cryptocurrency\
    \ because it will be controlled by the banks. The most reliable and most dedicated\
    \ advocates of cryptocurrency are determined that it will not be centralized.\
    \ How Did Cryptocurrencies Develop? Bitcoin is the most well-known cryptocurrency\
    \ on the market. It has been the recipient of hype, fame, and publicity. The general\
    \ public has been fascinated by its extraordinary increase in value over the last\
    \ several years. They have been awe-struck by the tales of significant wealth\
    \ that has been generated with bitcoin, for those who acquired it in its infancy,\
    \ when it was cheap. Despite its novelty, people quickly realize that bitcoin\
    \ is genuine money. In addition to bitcoin, there are many other  "
