- raw: "It's important to understand just how the proof of stake system differs from\
    \ the proof of work model. With proof of stake verification, rather than having\
    \ the miner solve the equation to verify the block, a validator, who is confirmed\
    \ reliable by the stake they have in the system, will commit to its accuracy.\
    \ They know that if they lie, they will lose their own ether as well. During the\
    \ first stage of deployment, all of the blocks that are verified through the new\
    \ system will also be checked through the old system to help double verify that\
    \ the blocks contain the information that they should, while also testing the\
    \ accuracy of the new system. Validators will then look at the various chains\
    \ that are available and make a decision based on how much ether is currently\
    \ in the chain. If they make a poor choice, they will lose their money. This process\
    \ will help form a consensus that leads to a single more massive chain from the\
    \ many smaller ones. Benefits of the Proof of Stake Model While the process of\
    \ implementing the proof of stake model isn't smooth sailing, it doesn't mean\
    \ that the proof of stake system is going to lose out. It contains many clear\
    \ benefits over the more traditional process. This first clear benefit that this\
    \ new model will have is that it will drop the more than one million dollars Ethereum\
    \ miners spend on electricity each day to around $100,000 or just ten percent.\
    \  \n\nIn addition to making it cheaper to mine cryptocurrency, the proof of stake\
    \ model will also make it more unrestricted because it won't matter how fast the\
    \ user's computer is because the calculations will be completed within the blockchain\
    \ itself. As a bonus, this makes the 51 percent attack much more difficult to\
    \ pull off successfully. A 51 percent attack happens when a group of miners comes\
    \ together to control more than 51 percent of all nodes running a particular blockchain\
    \ in an attempt to add completely false blocks to the system that the unaffected\
    \ nodes will then accept as accurate because a majority of the nodes are already\
    \ reporting it that way. Proof of stake will also make it possible to ensure the\
    \ validators stay honest by forcing them to be vested in the transactions that\
    \ they verify because they know if they don’t play fair, they will lose their\
    \ own money. Finally, the proof of stake model makes it easier to produce blocks\
    \ faster than ever thanks to a process called sharding, which is the process of\
    \ breaking a more extensive database down into more manageable pieces. When databases\
    \ are broken down, it allows each piece to have its own set of validators who\
    \ complete their own transactions within the shard. Once this occurs, it makes\
    \ scalability more modular and even faster. Proof of Stake Challenges The new\
    \ process won't be without its own share of issues. The first issue will be that\
    \ the new system isn't guaranteed to work. This is because this type of model\
    \ hasn't been put into play at a large scale before. This means that there is\
    \ a chance that the original blockchain could be damaged if the transactions aren't\
    \ processed as planned, or if a smart contract is miswritten. To combat this scenario,\
    \ the Ethereum team is working on what is called the finality property. This will\
    \ ensure that the current state of the blockchain will be secure before the new\
    \ one can be implemented. Chapter 5 – Benefits of Blockchain Technology ![](rsrc9E.jpg)The\
    \ promise of blockchain technology saw all of the world's contracts and agreements\
    \ digitized into code and stored in public, transparent databases that are safe\
    \ from being deleted, tampered with, or revised. The future will see every kind\
    \ of agreement, business process, online task, funds payment, and transactions\
    \ with a single digital record that can be identified and validated. As the technology\
    \ continues to expand, we'll see middlemen, like lawyers, stock exchange brokers,\
    \ and banks, saving billions, if not trillions of dollars every year. Blockchain\
    \ technology is ideally suited to revolutionizing the way many industries do business.\
    \ Here are just some of the ways that blockchain technology will accomplish this.\
    \ Eliminating Third Parties Blockchain technology will eradicate third parties\
    \ and increase the number of exchanges that aren't subject to trust issues. Blockchain\
    \ will allow two or more parties to conduct a transaction, of any type, without\
    \ having to resort to official oversight or intermediation with an external party.\
    \ This will significantly reduce, or even eliminate counterparty risks. Counterparty\
    \ risk is a risk that each party of a contract will face if the counterparty doesn't\
    \ live up to their contractual obligations. It is a risk to both parties and is\
    \ something that should always be considered when evaluating a contract. Control\
    \ Over Data With blockchain, users are more empowered and have better control\
    \ over their own data. With blockchain protocols in place, users own and are in\
    \ control of all their information and transactions themselves. Uber is a perfect\
    \ example of this. Uber is one of the world’s largest car services companies,\
    \ but they don’t actually own any of the cars that run its business, but they\
    \ rake in billions of dollars through car rides that are logged by drivers using\
    \ the Uber app. Better Data Quality and Integrity With the blockchain technology,\
    \ data is always complete because the next block can't be created or mined without\
    \ being linked to a verified block being finished in the chain. It is also consistent\
    \ because all the data has to conform to the protocol standards or else it won’t\
    \ be recorded in the chain, as well as being widely available. Durability and\
    \ Reliability Blockchain technology has been proven not to have a single point\
    \ of failure and is capable of withstanding malicious exterior attacks more efficiently.\
    \ This is compared to closed systems that contain possible weaknesses and point\
    \ of failure that are scattered throughout the entire system from within. The\
    \ Integrity of Data Processing and Transfers Due to the unchangeable nature of\
    \ the blocks in a blockchain, every user on the network can trust that every transaction\
    \ they make will take place on the network and that they will always be executed\
    \ precisely as the system was designed. This removes the need for any third party\
    \ to oversee the transactions, maintaining the integrity of the data being processed\
    \ and all transfers. Transparency and Auditability All transactions made to and\
    \ on a blockchain are, by design, created on a public ledger that can be looked\
    \ at by everyone. This creates a highly transparent system that can be searched\
    \ by anyone. There are various services, such as etherscan.io, that allows users\
    \ to search the vast databases and transactions in order to audit everything that\
    \ is happening within and on a blockchain. Faster Transactions Transactions between\
    \ banks, like ACH, (automated  "
  fmt: "\nIt's important to understand just how the proof of stake system differs\
    \ from the proof of work model. With proof of stake verification, rather than\
    \ having the miner solve the equation to verify the block, a validator, who is\
    \ confirmed reliable by the stake they have in the system, will commit to its\
    \ accuracy. They know that if they lie, they will lose their own ether as well.\
    \ During the first stage of deployment, all of the blocks that are verified through\
    \ the new system will also be checked through the old system to help double verify\
    \ that the blocks contain the information that they should, while also testing\
    \ the accuracy of the new system. Validators will then look at the various chains\
    \ that are available and make a decision based on how much ether is currently\
    \ in the chain. If they make a poor choice, they will lose their money. This process\
    \ will help form a consensus that leads to a single more massive chain from the\
    \ many smaller ones. Benefits of the Proof of Stake Model While the process of\
    \ implementing the proof of stake model isn't smooth sailing, it doesn't mean\
    \ that the proof of stake system is going to lose out. It contains many clear\
    \ benefits over the more traditional process. This first clear benefit that this\
    \ new model will have is that it will drop the more than one million dollars Ethereum\
    \ miners spend on electricity each day to around $100,000 or just ten percent.\
    \  \n\nIn addition to making it cheaper to mine cryptocurrency, the proof of stake\
    \ model will also make it more unrestricted because it won't matter how fast the\
    \ user's computer is because the calculations will be completed within the blockchain\
    \ itself. As a bonus, this makes the 51 percent attack much more difficult to\
    \ pull off successfully. A 51 percent attack happens when a group of miners comes\
    \ together to control more than 51 percent of all nodes running a particular blockchain\
    \ in an attempt to add completely false blocks to the system that the unaffected\
    \ nodes will then accept as accurate because a majority of the nodes are already\
    \ reporting it that way. Proof of stake will also make it possible to ensure the\
    \ validators stay honest by forcing them to be vested in the transactions that\
    \ they verify because they know if they don’t play fair, they will lose their\
    \ own money. Finally, the proof of stake model makes it easier to produce blocks\
    \ faster than ever thanks to a process called sharding, which is the process of\
    \ breaking a more extensive database down into more manageable pieces. When databases\
    \ are broken down, it allows each piece to have its own set of validators who\
    \ complete their own transactions within the shard. Once this occurs, it makes\
    \ scalability more modular and even faster. Proof of Stake Challenges The new\
    \ process won't be without its own share of issues. The first issue will be that\
    \ the new system isn't guaranteed to work. This is because this type of model\
    \ hasn't been put into play at a large scale before. This means that there is\
    \ a chance that the original blockchain could be damaged if the transactions aren't\
    \ processed as planned, or if a smart contract is miswritten. To combat this scenario,\
    \ the Ethereum team is working on what is called the finality property. This will\
    \ ensure that the current state of the blockchain will be secure before the new\
    \ one can be implemented. Chapter 5 – Benefits of Blockchain Technology ![](rsrc9E.jpg)The\
    \ promise of blockchain technology saw all of the world's contracts and agreements\
    \ digitized into code and stored in public, transparent databases that are safe\
    \ from being deleted, tampered with, or revised. The future will see every kind\
    \ of agreement, business process, online task, funds payment, and transactions\
    \ with a single digital record that can be identified and validated. As the technology\
    \ continues to expand, we'll see middlemen, like lawyers, stock exchange brokers,\
    \ and banks, saving billions, if not trillions of dollars every year. Blockchain\
    \ technology is ideally suited to revolutionizing the way many industries do business.\
    \ Here are just some of the ways that blockchain technology will accomplish this.\
    \ Eliminating Third Parties Blockchain technology will eradicate third parties\
    \ and increase the number of exchanges that aren't subject to trust issues. Blockchain\
    \ will allow two or more parties to conduct a transaction, of any type, without\
    \ having to resort to official oversight or intermediation with an external party.\
    \ This will significantly reduce, or even eliminate counterparty risks. Counterparty\
    \ risk is a risk that each party of a contract will face if the counterparty doesn't\
    \ live up to their contractual obligations. It is a risk to both parties and is\
    \ something that should always be considered when evaluating a contract. Control\
    \ Over Data With blockchain, users are more empowered and have better control\
    \ over their own data. With blockchain protocols in place, users own and are in\
    \ control of all their information and transactions themselves. Uber is a perfect\
    \ example of this. Uber is one of the world’s largest car services companies,\
    \ but they don’t actually own any of the cars that run its business, but they\
    \ rake in billions of dollars through car rides that are logged by drivers using\
    \ the Uber app. Better Data Quality and Integrity With the blockchain technology,\
    \ data is always complete because the next block can't be created or mined without\
    \ being linked to a verified block being finished in the chain. It is also consistent\
    \ because all the data has to conform to the protocol standards or else it won’t\
    \ be recorded in the chain, as well as being widely available. Durability and\
    \ Reliability Blockchain technology has been proven not to have a single point\
    \ of failure and is capable of withstanding malicious exterior attacks more efficiently.\
    \ This is compared to closed systems that contain possible weaknesses and point\
    \ of failure that are scattered throughout the entire system from within. The\
    \ Integrity of Data Processing and Transfers Due to the unchangeable nature of\
    \ the blocks in a blockchain, every user on the network can trust that every transaction\
    \ they make will take place on the network and that they will always be executed\
    \ precisely as the system was designed. This removes the need for any third party\
    \ to oversee the transactions, maintaining the integrity of the data being processed\
    \ and all transfers. Transparency and Auditability All transactions made to and\
    \ on a blockchain are, by design, created on a public ledger that can be looked\
    \ at by everyone. This creates a highly transparent system that can be searched\
    \ by anyone. There are various services, such as etherscan.io, that allows users\
    \ to search the vast databases and transactions in order to audit everything that\
    \ is happening within and on a blockchain. Faster Transactions Transactions between\
    \ banks, like ACH, (automated  \n"
  trans: "\n理解权益证明（Proof of Stake）系统与工作量证明（Proof of Work）模型的区别至关重要。在权益证明机制中，验证区块的不是矿工，而是凭借系统中持有的代币（以太币）而被确认可靠的验证者（validator）。验证者知道，若撒谎，他们将失去自己的以太币。在部署的第一阶段，通过新系统验证的所有区块也会通过旧系统进行检查，以双重验证区块是否包含应有信息，同时测试新系统的准确性。验证者会查看所有可用的链，并根据当前链中持有的以太币数量做出决策。若做出错误选择，他们将损失资金。此过程将帮助达成共识，形成由许多小链汇聚而成的单一更庞大的链。\n\
    \n权益证明模型的优势虽然实施过程并非一帆风顺，但这并不意味着权益证明系统会落后。它相较于传统流程拥有许多明显优势。权益证明模型的首要优势在于，它将以太坊矿工每天在电力上的支出（超过一百万美元）降至约\
    \ 10 万美元，即不到原来的十%。\n\n此外，权益证明模型还能降低挖矿加密货币的成本，并使其更具可及性，因为无论用户的电脑速度如何，计算均在区块链内部完成。这也使得\
    \ 51% 攻击变得更加困难。51% 攻击是指一群矿工聚集控制超过 51% 的运行该区块链的节点，试图向系统添加完全虚假的区块，未受影响的节点会因多数节点已确认该区块为准确而接受其为真实。权益证明还能通过要求验证者对其验证的交易负有利益（持有以太币），从而确保验证者保持诚实；若不公平行为，他们将损失自身资金。最后，权益证明模型通过分片（sharding）技术加速区块生成，将大型数据库拆分为更小的块，每个块拥有独立的验证者，从而实现更模块化的可扩展性和更快的处理速度。\n\
    \n权益证明挑战新流程同样面临挑战。首要问题是新系统未必能保证运行。原因是该模型尚未在大规模环境中实际部署，因此若交易处理不当或智能合约编写错误，原区块链可能受损。为应对这种情况，以太坊团队正在研发所谓的“最终性属性”（finality\
    \ property），以确保在实施新链之前，当前区块链的状态已得到安全确认。\n\n第 5 章 – 区块链技术的优势 ![](img/rsrc9E.jpg)区块链技术的承诺是将全球合同和协议数字化为代码，存储在公共、透明且防篡改的公共数据库中，免受删除、篡改或修订。未来，所有类型的协议、业务流程、在线任务、资金支付及交易将以单一数字记录形式出现，该记录可被识别并验证。随着技术的不断发展，中间人（如律师、股票经纪人、银行）将每年节省数十亿甚至数万亿美元。区块链技术非常适合颠覆许多行业的运营方式。以下是区块链技术实现这一点的部分方式。\n\
    \n消除第三方区块链技术将消除第三方，并增加不受信任问题影响的交换数量。区块链允许两个或多个方进行任何类型的交易，无需依赖官方监督或外部中介。这将显著降低或彻底消除对手方风险。对手方风险是指合同各方在对方未履行合约义务时所面临的风险，这种风险对双方均构成威胁，在评估合约时应始终予以考虑。\n\
    \n数据控制权区块链赋予用户更大的自主权，使其能更好地掌控自身数据。通过区块链协议，用户拥有并完全控制所有信息和交易。Uber 是典型例子。Uber 是全球最大的汽车服务公司之一，但并不拥有运营所需的车辆，却通过驾驶员使用\
    \ Uber 应用记录的车费为公司带来数十亿美元的收入。\n\n数据质量与完整性区块链技术确保数据始终完整，因为新区块只能在验证的前一个区块完成后才能创建或挖掘。数据也保持一致，因为所有数据必须符合协议标准，否则不会被记录在链中，并且数据广泛可用。\n\
    \n耐用性与可靠性区块链技术已被证明不存在单一故障点，并能更高效地抵御恶意外部攻击。这与封闭系统形成对比，后者可能在系统内部散布多个潜在弱点和故障点。\n\n\
    数据处理与传输的完整性由于区块链中区块的不可更改性，网络中每个用户都可以信任其交易将按设计执行。这消除了对第三方监督交易的需求，从而保持数据处理的完整性以及所有转移的可靠性。\n\
    \n透明性与可审计性所有在区块链上进行的交易均创建在公开账本上，任何人均可查看。这种设计产生高度透明的系统，可供全球搜索。诸如 etherscan.io 等服务让用户能够浏览区块链上庞大的数据库和交易，进行全面审计。\n\
    \n更快的交易区块链使银行间交易（如 ACH）更加迅速。 \n"
