  trans: "\n-   [比特币等加密货币](https://en.wikipedia.org/wiki/Cryptocurrency)的美元价值出现了巨大的增长。合法的政府和企业正在逐步加大对加密货币的参与。尽管有批评，这些货币的市场仍在蓬勃发展。加密货币、法定货币和股票\
    \ 法定货币是我们日常使用的货币，如美元、日元、欧元和人民币。尽管加密货币这个词里包含“货币”，但它们更类似于股票市场的股票和份额，而不是法定货币与加密货币之间的关系。当你购买加密货币时，你会获得该加密货币对应的某些硬币，这类似于技术股票和一个数字账本的入口，即区块链。区块链\
    \ 区块链是数字账本，可以正式定义为一个不断增长的、通过高级加密技术相互链接并受保护的记录列表。用更简单的话，区块链就是一个区块链。区块链的列表中的每条记录都称为一个块，包含特定类型和信息的块。每个块通常包含某种指针作为对前一个块的链接、交易数据以及时间戳，时间戳形式多样。另一种看法是，区块链类似于数据库，其中每条记录都与前后记录相连。这意味着一旦将包含特定数据的块添加到链条中，链条中的信息就无法更改。根据你查看的链条类型，通常会有有用的工具供你扫描交易数据。区块链因其固有设计而具有抗篡改性。这使得区块链能够高效记录不同参与方之间的交易。这些交易不仅可验证，而且是永久性的。一旦信息记录在区块链中，除非多数网络节点同意更改后续块，否则无法在事后修改数据。如果黑客想要篡改区块链内的信息，他们需要控制所有节点。这种安全性是区块链最有价值的特性之一。由于区块链设计为可验证和永久，它们特别适合记录事件、维护医疗记录、制定协议、筹款以及追踪其他文档。第\
    \ 2 章 – 区块链基础 ![](img/rsrc97.jpg)无论你是否意识到，你每天都在进行业务，即使你不工作。在某个时刻，每个人都会上网并发起某种交易。无论是从\
    \ Amazon 购买商品还是在 iTunes 购买内容，你都在使用区块链技术进行业务。虽然“区块链”这一术语相对新颖，但该技术已有约十年的历史。Satoshi\
    \ Nakamoto 在 2008 年创建的数字账本是管理加密货币和其他在线交易的表格的基础。该技术用于密码学，即互联网上对文本进行编码的方式。密码学在区块链技术中用于创建分布式信任网络。这使得系统的任何贡献者都能够安全地执行交易，而无需从数字账本中的其他人获得授权。这些交易随后被验证、批准，并记录在加密块中。该块会间歇性保存，然后与前一个块相连，从而形成链条。区块链的组成部分\
    \ 区块链由两个主要部分组成。第一部分是去中心化网络。去中心化网络负责促进和验证交易。在去中心化网络上使用区块链意味着软件不局限于单一计算机系统，而是可以在多个计算机系统上控制，更重要的是，它不受政府控制。\
    \ ![](img/rsrc98.jpg)第二部分是不可否认的账本，交易在此处被处理并记录在安全的位置。这种安全性使得未连接链条的人几乎不可能进行篡改或窃取信息。由于区块链可能有众多贡献者，任何贡献者都可以控制账本中输入的信息。由于每笔交易都安全处理并带有永久时间戳，另一位贡献者篡改账本的可能性变得十分困难。区块链技术可用于各种电脑和互联网应用。其中一种应用是智能合约。智能合约允许企业自动验证并执行协议，并在安全环境中独立运行。区块链技术作为中介，用于在智能合约中实施所有业务交易、协议以及信息的编程交换。随着越来越多的交易在线完成，不仅个人生活而且专业生活也在进行，线上签署和创建的协议越来越多。区块链应用在医疗领域近年来越来越流行。研究人员正在研究涉及数字身份、保险记录和医疗记录的应用。目前许多医疗机构使用某种数字设备来验证其记录上的信息是否确实属于你。安全隐患\
    \ ![](img/rsrc99.jpg)当今人们面临的最重大问题之一是担心所有信息可能被黑客入侵，因为大部分个人信息已数字化。而且，完整的陌生人很容易访问、复制和篡改我们的数据。然而，我们仍然承担着被黑客攻击的风险，尽管被攻击的概率在增加。区块链技术的创建初衷是防止这种情况发生，或者至少使其更加困难。要黑客篡改区块链系统，他们必须回退并修改每一个块。这需要巨大的努力和耐心，因为区块链可能包含数十亿条链接，个人需要遍历并修改这些链接。仅修改一个或两个块就会自动触发系统被黑客入侵的警报。这只是区块链技术受欢迎的众多原因之一。区块链技术还可以用于其他多种用途，例如全球支付、音乐共享或追踪钻石销售。区块链类型\
    \ 存在三种主要类型的区块链：私有区块链、公有区块链和联盟区块链。公有区块链由公众创建。任何人都可以参与区块链内容的创建、确认和记录。在这种区块链中，没有单一的人负责监督交易。\
    \  \n\n"
