- "# \n比特币秘籍：了解比特币、加密货币和区块链的完整指南\n\n\n![](img/rsrc92.jpg)\n\n![](img/rsrc92.jpg)\n\
  \n\n# 介绍.....................................................................................................................6\n\
  \n\n\n\n\n\n\n\n\n\n\n\n# 当涉及信息时代，事情自 90 年代初至中期的第一次点.com 浪潮以来，进展速度堪比闪电。\n\n一切从定义我们与技术交互和接入方式的用户界面工具和技术，到支付解决方案和银行解决方案，过去\
  \ 20 年发生了巨大变化。社交网络、主要邮件以及人工智能（AI）和大数据分析领域的进步也同样适用，这些进步影响范围从治理协助到在线搜索。我们从为上述所有需求提供必要解决方案，发展到如今拥有能够整合各种技术方面的高级软件服务，为全球数十亿人提供高效、可靠、增值且无缝的服务。![](img/rsrc94.jpg)\n\
  \n然而，随之而来的进步带来了新挑战。人工智能、大数据以及政府实施大规模监控计划的能力，以及技术无处不在，都开始引发严肃的伦理问题和技术挑战。这引发了关键问题：法律与非法监控之间该如何划界？当公司和政府在数据收集与处理时缺乏透明度，我们作为社会如何信任其数据使用实践？政府与大型企业与私人用户的关系将如何发展？正是基于这些令人兴奋且充满挑战的背景，区块链将被讨论。\n\
  \n近年来，区块链成为热门技术，已远超单纯的技术潮流。许多领域专家和技术大师认为，这是人类下一步巨大的飞跃，对我们的子孙后代产生深远影响，正如过去农业和医疗发展对曾曾祖父母产生的影响一样。我们已进入新的信息时代。第\
  \ 1 章：钱的历史、加密货币与区块链 ![](img/rsrc95.jpg)\n\n1991 年，关于构建永久、去中心化账本（如区块链）的概念首次被讨论。但第一个实际区块链实现是在\
  \ 2008 年由中本聪设计。他的初始设计被用作比特币这类数字货币的基础技术。中本聪工程的区块链作为比特币交易的公开账本。比特币若您未曾了解，是一种数字货币，目前价值约\
  \ 16,000 美元，基于区块链技术。目前市场上最知名的区块链是比特币区块链，而以太坊区块链紧随其后。\n\n比特币之所以能作为数字货币、价值储存手段和交换媒介，是因为其交易记录在区块链账本中。这意味着区块链不仅限于运行比特币，其应用范围可跨越贸易、金融、医疗、法律、记录管理、游戏、在线交易所、概率等众多领域。在深入理解区块链技术前，您需先了解它如何与当前货币及数字货币体系衔接。货币的历史几乎与人类一样悠久，已有大量著作探讨此主题。值得一读的是尼尔·弗格森（Niall\
  \ Ferguson）所著《钱的 ascent: A Financial History of the World》（《钱的崛起：世界的金融史》）。货币若要运作，必须同时具备价值储存功能和交换媒介功能。历史上，我们曾使用金、银、牲畜、珠宝及盐等物品作为货币。无论其形式如何，货币必须履行这两项核心职能，且必须有信任感保障其能胜任这些角色。加密货币\
  \ ![](img/rsrc96.jpg)\n\n加密货币是近几年兴起的货币形式。它通过计算机与数学加密技术创造，这些技术使我们能够转移资金并验证转账确实发生。加密货币的另一关键特性是独立于政府和中央银行，从而实现去中心化。\n\
  \n如今，众多重要银行正 increasingly 卷入支撑加密货币的同类技术。但需注意，由银行主导的任何新货币均非真正的加密货币，因其受银行控制。加密货币的可靠拥护者坚持其必须保持去中心化。加密货币如何发展？比特币是市场上最知名的加密货币，曾备受炒作、关注与宣传。公众对其近年来价值剧增的态度令人着迷，也对早期以低价获取比特币而致富的传闻印象深刻。尽管其新颖性，人们迅速认识到比特币是真实货币。除比特币外，还有许多其他\n\
  \n\n\n\n-   [比特币等加密货币](https://en.wikipedia.org/wiki/Cryptocurrency)的美元价值出现了巨大的增长。合法的政府和企业正在逐步加大对加密货币的参与。尽管有批评，这些货币的市场仍在蓬勃发展。加密货币、法定货币和股票\
  \ 法定货币是我们日常使用的货币，如美元、日元、欧元和人民币。尽管加密货币这个词里包含“货币”，但它们更类似于股票市场的股票和份额，而不是法定货币与加密货币之间的关系。当你购买加密货币时，你会获得该加密货币对应的某些硬币，这类似于技术股票和一个数字账本的入口，即区块链。区块链\
  \ 区块链是数字账本，可以正式定义为一个不断增长的、通过高级加密技术相互链接并受保护的记录列表。用更简单的话，区块链就是一个区块链。区块链的列表中的每条记录都称为一个块，包含特定类型和信息的块。每个块通常包含某种指针作为对前一个块的链接、交易数据以及时间戳，时间戳形式多样。另一种看法是，区块链类似于数据库，其中每条记录都与前后记录相连。这意味着一旦将包含特定数据的块添加到链条中，链条中的信息就无法更改。根据你查看的链条类型，通常会有有用的工具供你扫描交易数据。区块链因其固有设计而具有抗篡改性。这使得区块链能够高效记录不同参与方之间的交易。这些交易不仅可验证，而且是永久性的。一旦信息记录在区块链中，除非多数网络节点同意更改后续块，否则无法在事后修改数据。如果黑客想要篡改区块链内的信息，他们需要控制所有节点。这种安全性是区块链最有价值的特性之一。由于区块链设计为可验证和永久，它们特别适合记录事件、维护医疗记录、制定协议、筹款以及追踪其他文档。第\
  \ 2 章 – 区块链基础 ![](img/rsrc97.jpg)无论你是否意识到，你每天都在进行业务，即使你不工作。在某个时刻，每个人都会上网并发起某种交易。无论是从\
  \ Amazon 购买商品还是在 iTunes 购买内容，你都在使用区块链技术进行业务。虽然“区块链”这一术语相对新颖，但该技术已有约十年的历史。Satoshi\
  \ Nakamoto 在 2008 年创建的数字账本是管理加密货币和其他在线交易的表格的基础。该技术用于密码学，即互联网上对文本进行编码的方式。密码学在区块链技术中用于创建分布式信任网络。这使得系统的任何贡献者都能够安全地执行交易，而无需从数字账本中的其他人获得授权。这些交易随后被验证、批准，并记录在加密块中。该块会间歇性保存，然后与前一个块相连，从而形成链条。区块链的组成部分\
  \ 区块链由两个主要部分组成。第一部分是去中心化网络。去中心化网络负责促进和验证交易。在去中心化网络上使用区块链意味着软件不局限于单一计算机系统，而是可以在多个计算机系统上控制，更重要的是，它不受政府控制。\
  \ ![](img/rsrc98.jpg)第二部分是不可否认的账本，交易在此处被处理并记录在安全的位置。这种安全性使得未连接链条的人几乎不可能进行篡改或窃取信息。由于区块链可能有众多贡献者，任何贡献者都可以控制账本中输入的信息。由于每笔交易都安全处理并带有永久时间戳，另一位贡献者篡改账本的可能性变得十分困难。区块链技术可用于各种电脑和互联网应用。其中一种应用是智能合约。智能合约允许企业自动验证并执行协议，并在安全环境中独立运行。区块链技术作为中介，用于在智能合约中实施所有业务交易、协议以及信息的编程交换。随着越来越多的交易在线完成，不仅个人生活而且专业生活也在进行，线上签署和创建的协议越来越多。区块链应用在医疗领域近年来越来越流行。研究人员正在研究涉及数字身份、保险记录和医疗记录的应用。目前许多医疗机构使用某种数字设备来验证其记录上的信息是否确实属于你。安全隐患\
  \ ![](img/rsrc99.jpg)当今人们面临的最重大问题之一是担心所有信息可能被黑客入侵，因为大部分个人信息已数字化。而且，完整的陌生人很容易访问、复制和篡改我们的数据。然而，我们仍然承担着被黑客攻击的风险，尽管被攻击的概率在增加。区块链技术的创建初衷是防止这种情况发生，或者至少使其更加困难。要黑客篡改区块链系统，他们必须回退并修改每一个块。这需要巨大的努力和耐心，因为区块链可能包含数十亿条链接，个人需要遍历并修改这些链接。仅修改一个或两个块就会自动触发系统被黑客入侵的警报。这只是区块链技术受欢迎的众多原因之一。区块链技术还可以用于其他多种用途，例如全球支付、音乐共享或追踪钻石销售。区块链类型\
  \ 存在三种主要类型的区块链：私有区块链、公有区块链和联盟区块链。公有区块链由公众创建。任何人都可以参与区块链内容的创建、确认和记录。在这种区块链中，没有单一的人负责监督交易。\
  \  \n\n\n\n\n因为没有单一的人负责这些区块链，决策是由许多去中心化的共识工具（如工作证明）做出的，这是比特币等加密货币使用的计算机算法。公共区块链内容公开透明，任何查看它们的人都能轻松理解它们是什么以及能做什么。相反，私有区块链是由个人或组织所有的。公共区块链有一个指定的人负责。虽然这种区块链可以有多个贡献者，但最终交易要么由负责人批准，要么由其否决，然后记录。联盟区块链（也称为联邦区块链）的目的是消除仅由一个贡献者拥有的唯一自主权——这是私有区块链的特点。这种区块链允许多个贡献者共同负责。相反，是一群公司或个人聚集在一起，做出对整个网络有益的决策。区块链技术分解\
  \ ![](img/rsrc9A.jpg)区块链技术是一种不可逆转、加密、去中心化的账本，有潜力使所有集中化的活动、流程和组织完全自主。这意味着个人有能力消除中间人和专家，从而彻底改革世界上每一个商业实体。区块链技术仅仅是用来记录你在线上进行的任何金钱或交易活动。你可以把它想象成一位会计师，记录你所有的支出。目前，区块链技术主要用于处理与加密货币（如比特币）相关的任何情况。让我们考虑以下例子。当你使用比特币完成交易时，该交易会通过区块链处理。在交易完成之前，你或与你的比特币账户相关的人必须验证该交易的合法性。一旦交易被确认有效，它就会被记录并保存到由区块链控制的账本中。此时，任何人都无法更改或修改该交易。只有你或拥有你账户权限的人才能验证交易。区块链技术由去中心化网络控制，这意味着它不受任何政府的控制。通过在去中心化系统上运行，它使业务交易更加便捷。它也更加私密，因为没有央行银行持有你的钱或其他资产。一切都由你和你的公司严格管理。要理解去中心化的重要性，你需要考虑以下中央化与去中心化的例子。中央化例子\
  \ 当你在书店刷卡付款时，你刷卡支付购买费用。此时，公司会将账单发送到你的银行，金额为你购买时约定的金额。随后，银行必须确认是你本人进行了购买。银行在确认交易后，会向公司释放资金并将交易记录在其账本中。银行记录的账本包含了你使用的卡片所进行的所有操作。银行对账本拥有完全控制权。除了能查看你的银行对账单外，你没有任何权限去修改或处理账本。中央化账本更容易被黑客攻击，因为它们由多个实体控制。去中心化例子\
  \ 想象你想转让 1.00 比特币。你只需告诉网络负责人（无论是一个人还是一群人）你正在转让 1.00 比特币。完成后，交易即被批准并记录。去中心化区块链比集中式交易更好，因为单笔交易完成时间更短。其他优势包括：个人或公司可以向另一名个人或公司发送安全信息，例如加密消息和医疗记录。第\
  \ 3 章 – 区块链的商业 ![](img/rsrc9B.jpg)每个人都对某些事物存在信任问题。如今，许多人不信任将信息输入互联网。尽管如此，这并未阻止许多人继续使用互联网。区块链技术的一个目的，就是缓解人们对在互联网上输入信息的不信任，这也是许多公司日益投资于此技术的主要原因。事实上，2013\
  \ 至 2016 年间，一项研究显示区块链管理的资金达到了 16 亿美元，增长了 1,600 ％。使用区块链技术的不同行业 金融行业是受益最大的行业之一，因为该行业涉及巨大的资金和交易量。以下是一些今天正在利用区块链技术的公司示例。•\
  \ 众筹借贷（Crowdlending） 众筹借贷活动已开始取代去银行申请贷款的方式。众筹借贷是一种点对点借贷公司。目前，全球平均每天有超过 500 亿美元的点对点借贷在进行。如果采用区块链技术，这一行业将获得巨大的提升。•\
  \ IBM 全球融资部  \n\nIBM 已成为区块链技术的主要参与者，拥有追踪交易的 proven track record。IBM 全球融资部每年处理 290\
  \ 万美元的应付账款，并负责为超过四千家供应商授予信用。IBM 通过区块链技术，使争议调解减少了 25％，这使得该部门能够释放 1 亿美元的预确认资本用于其他用途。•\
  \ 记账  \n\n\n\n\n会计行业极大地受益于区块链技术。当今经济中的每一笔交易都在个人市场参与者的私有记录中内部登记。当会计超出网络边界时，区块链技术得以实现。为企业增加价值\
  \ 有许多方式区块链技术可以为企业增加价值。一种方式是为您的企业构建网络。CyberMiles 的首席科学家 Michael Yuan 博士指出区块链如何为初创企业和公司提供价值。他的理论是区块链的关键优势在于能够为所有种类的企业构建网络。他的理论是，与其相互竞争，公司可以合作并构建一个系统，每个行业拥有自己的链。另一种区块链技术为企业增加价值的方式是为未受银行服务的人提供银行服务。这可能难以置信，但全球有大量人没有银行账户。区块链技术将为这些人提供创建银行账户的机会。某人只需开设比特币账户，即可获得数字钱包。第三种区块链技术为企业增加价值的方式是降低交易完成时间。再次，时间在区块链世界中扮演重要角色。Modular\
  \ 的首席执行官 Christopher Brown 创建了 Blossom，一个面向以太坊的数字钱包。该程序是一个多功能桌面钱包应用程序，为企业和用户提供更简便的资金管理方式。其处理资金的时间比前往银行取现更短。此外，区块链技术还可通过将物联网（IoT）数据与区块链技术相结合，为企业提供法律合约的价值。利用\
  \ IoT 设备的数据，个人和企业可以连接到已存储在区块链上的法律合约。例如，当您购买房屋时，您签署的所有文件也必须由卖方签署。这意味着所有文件必须在双方都能访问的同一位置。来自\
  \ IoT 设备的外部信息链接到区块链，使法律合约可以立即使用，且无需任何人干预。  \n\n\n\n\n最终，区块链技术为企业创造价值的方式之一是通过帮助实现货币化。公司赚钱的方式正在改变。人们不再关注广告，因为你现在可以快进广告，线上也可以忽略。此外，广告收益通常流向广告所在的站点，这对企业产生了巨大影响。区块链技术解决了这一问题，因为为广告创作的所有内容都记录在区块链上，内容创作者通过加密货币或法币获得回报。许多专家认为区块链技术将成为未来的主流。加密货币迅速增长，因为人们希望将资金存放在既安全可靠，又能增值的地方，就像储蓄账户一样。然而，储蓄账户的安全性不如人们所愿。2017\
  \ 年底，比特币期货市场已经出现，同年金融行业也迎来了初始代币发行（ICO）的 dramatic increase。过去一年，ICO 筹集的资金超过了风险投资。随着加密货币在快速处理交易方面的能力不断提升，它们终将与信用卡公司处理交易相竞争。云端与区块链\
  \ ![](img/rsrc9C.jpg) 众所周知，大家都使用云端备份不想丢失的数据。实际上，云端实际上是基于区块链的。专家们说，我们已经习惯了奢侈待遇。过去，你不能简单点击按钮就自动将数据保存到\
  \ iCloud 或 OneDrive 等备份站点。相反，你需要将信息转移到磁盘或 U 盘上，然后把磁盘或 U 盘带到另一台电脑下载数据。虽然今天仍可这样做，但没有保证这种技术会长久存在。就像过去的软盘一样，光盘和\
  \ U 盘可能会过时，但基于互联网的存储应用总会不断更新，因为我们生活在一个技术发达的世界。区块链与游戏、电子竞技和在线幻想体育在过去十年中得到了显著增长，越来越多的人开始创建在线幻想体育队伍。像幻想橄榄球这样的在线游戏是最早采用比特币及其他加密货币早期版本的网站之一，它们也利用区块链技术运行并保持游戏技术。区块链技术的用途不止于幻想体育。如今最受欢迎的智能手机应用下载都是游戏，这也是随着技术发展，更多开发者会使用区块链和加密货币。供应链管理与区块链\
  \ 区块链技术也能通过在保持成本效益的同时追踪商品来惠及供应链管理。例如，通过联合包裹服务（UPS）将包裹从一家企业发送到另一家。过去，如果包裹未按时到达，需要打电话询问其位置。如今，你会获得一个追踪号码，可查看所发送或等待的包裹在传输过程中的位置，这实际上构成了区块链。区块链技术极大简化了企业之间的合作，因为它极大地简化了生产流程、转移流程，以及用于验证和支付的方法。区块链技术与质量保证\
  \ 在业务中，错误时有发生，无论多么小心并严格遵循流程和程序，错误仍可能发生，且追溯错误来源常常颇具挑战。借助区块链技术，错误和失误可以追溯至其起点。这不仅简化了错误的调查，还为公司节省了时间和金钱。第\
  \ 4 章 – 工作证明 vs. 财产证明 ![](img/rsrc9D.jpg) 目前大多数公共区块链均基于工作证明（proof of work）系统。然而，2018\
  \ 年，第二大加密货币以太坊开始测试新系统，将其区块链从工作证明切换为财产证明（proof of stake）系统。在深入了解其具体含义之前，必须先理解交易验证时的具体过程。工作证明\
  \ 比特币的挖矿通过使用高性能机器完成，该机器利用 SHA256 双重哈希进行验证，目的是在交易发生时验证比特币交易，从而保障区块链的完整性。你的机器每秒可产生的哈希数（hashes\
  \ per second）衡量其挖矿速度。比特币会以挖矿服务的形式，向完成验证的矿工支付一部分比特币，以抵消时间和能源成本。此外，发起交易的用户通常会支付一定交易费用，以帮助抵消成本。矿机的算力越强，所能获得的收益越多。要被纳入区块链，每个区块必须具备有效的工作证明。工作证明是一种既难生成又耗时的数据。它本质上是随机过程，成功概率极低，因此矿机需要大量的试错才能成功。比特币采用所谓的“proof\
  \ of work”（工作证明）机制，其核心是哈希函数。当前最常用的哈希函数是 SHA256（即 haschash‑Sha256）。该工作证明函数由亚当·巴克（Dr.\
  \ Adam Back）于 1990 年代创建，最初用于防止电子邮件滥用，因为单封邮件生成工作证明很容易，但大量邮件生成则困难。你可以调节工作证明的难度，确保新区块不会比网络处理速度更快。因此，新区块最多每\
  \ 10 分钟生成一次。由于每次后续生成的概率低，判断哪台矿机将产生下一个区块颇具挑战。为了让区块被认可，其哈希值必须小于当前目标值。这意味着每个区块必须自然表明其工作已完成。每个区块还包含前一个区块的哈希值，从而让区块链知道每个区块在整个链中的位置。修改区块需要重新计算所有前序区块的工作，并为它们生成新的、连贯的哈希值。由于所需的巨大计算力，区块链因此受到篡改的极强保护。\
  \ 财产证明 目前大多数重要加密货币均基于工作证明模型的变体，要么使用 SHA256 哈希，要么使用类似哈希函数。然而，以太坊作为比特币最大竞争对手，正在研发一种替代方案，可能彻底改变区块链交易验证方式。2017\
  \ 年初，以太坊发布了混合工作证明/财产证明系统的实施指南。该系统分阶段推出，最终将成为平台的主验证机制。计划是让区块链平台在两种系统之间交替使用。新系统下，约每\
  \ 100 个区块中有 1 个采用新系统，其余继续使用旧系统。期望新系统能提升新区块产生的速率，标志着以太坊进化的第一步。这是首次使用财产证明系统来保护区块链，标志着重大进展。新系统将作为工作证明模型的替代方案的概念验证，让支持者能够测试其优越性。当新财产证明模型大规模推出时，验证单个区块所需的电力将大幅降低。\
  \  \n```if (condVar > someVal) {console.log(\"xxx\")}```  \n\n\n\n理解权益证明（Proof of\
  \ Stake）系统与工作量证明（Proof of Work）模型的区别至关重要。在权益证明机制中，验证区块的不是矿工，而是凭借系统中持有的代币（以太币）而被确认可靠的验证者（validator）。验证者知道，若撒谎，他们将失去自己的以太币。在部署的第一阶段，通过新系统验证的所有区块也会通过旧系统进行检查，以双重验证区块是否包含应有信息，同时测试新系统的准确性。验证者会查看所有可用的链，并根据当前链中持有的以太币数量做出决策。若做出错误选择，他们将损失资金。此过程将帮助达成共识，形成由许多小链汇聚而成的单一更庞大的链。\n\
  \n权益证明模型的优势虽然实施过程并非一帆风顺，但这并不意味着权益证明系统会落后。它相较于传统流程拥有许多明显优势。权益证明模型的首要优势在于，它将以太坊矿工每天在电力上的支出（超过一百万美元）降至约\
  \ 10 万美元，即不到原来的十%。\n\n此外，权益证明模型还能降低挖矿加密货币的成本，并使其更具可及性，因为无论用户的电脑速度如何，计算均在区块链内部完成。这也使得\
  \ 51% 攻击变得更加困难。51% 攻击是指一群矿工聚集控制超过 51% 的运行该区块链的节点，试图向系统添加完全虚假的区块，未受影响的节点会因多数节点已确认该区块为准确而接受其为真实。权益证明还能通过要求验证者对其验证的交易负有利益（持有以太币），从而确保验证者保持诚实；若不公平行为，他们将损失自身资金。最后，权益证明模型通过分片（sharding）技术加速区块生成，将大型数据库拆分为更小的块，每个块拥有独立的验证者，从而实现更模块化的可扩展性和更快的处理速度。\n\
  \n权益证明挑战新流程同样面临挑战。首要问题是新系统未必能保证运行。原因是该模型尚未在大规模环境中实际部署，因此若交易处理不当或智能合约编写错误，原区块链可能受损。为应对这种情况，以太坊团队正在研发所谓的“最终性属性”（finality\
  \ property），以确保在实施新链之前，当前区块链的状态已得到安全确认。\n\n第 5 章 – 区块链技术的优势 ![](img/rsrc9E.jpg)区块链技术的承诺是将全球合同和协议数字化为代码，存储在公共、透明且防篡改的公共数据库中，免受删除、篡改或修订。未来，所有类型的协议、业务流程、在线任务、资金支付及交易将以单一数字记录形式出现，该记录可被识别并验证。随着技术的不断发展，中间人（如律师、股票经纪人、银行）将每年节省数十亿甚至数万亿美元。区块链技术非常适合颠覆许多行业的运营方式。以下是区块链技术实现这一点的部分方式。\n\
  \n消除第三方区块链技术将消除第三方，并增加不受信任问题影响的交换数量。区块链允许两个或多个方进行任何类型的交易，无需依赖官方监督或外部中介。这将显著降低或彻底消除对手方风险。对手方风险是指合同各方在对方未履行合约义务时所面临的风险，这种风险对双方均构成威胁，在评估合约时应始终予以考虑。\n\
  \n数据控制权区块链赋予用户更大的自主权，使其能更好地掌控自身数据。通过区块链协议，用户拥有并完全控制所有信息和交易。Uber 是典型例子。Uber 是全球最大的汽车服务公司之一，但并不拥有运营所需的车辆，却通过驾驶员使用\
  \ Uber 应用记录的车费为公司带来数十亿美元的收入。\n\n数据质量与完整性区块链技术确保数据始终完整，因为新区块只能在验证的前一个区块完成后才能创建或挖掘。数据也保持一致，因为所有数据必须符合协议标准，否则不会被记录在链中，并且数据广泛可用。\n\
  \n耐用性与可靠性区块链技术已被证明不存在单一故障点，并能更高效地抵御恶意外部攻击。这与封闭系统形成对比，后者可能在系统内部散布多个潜在弱点和故障点。\n\n\
  数据处理与传输的完整性由于区块链中区块的不可更改性，网络中每个用户都可以信任其交易将按设计执行。这消除了对第三方监督交易的需求，从而保持数据处理的完整性以及所有转移的可靠性。\n\
  \n透明性与可审计性所有在区块链上进行的交易均创建在公开账本上，任何人均可查看。这种设计产生高度透明的系统，可供全球搜索。诸如 etherscan.io 等服务让用户能够浏览区块链上庞大的数据库和交易，进行全面审计。\n\
  \n更快的交易区块链使银行间交易（如 ACH）更加迅速。 \n\n\n\n-   [clearinghouse transactions]的交易可以花费数天才能结算。这在交易在非工作时间进行时尤为如此。想想你在周五下班后发送电汇或进行购买的情况。如果没有区块链，你无法看到资金状态的及时更新。通常，你需要等到下周二或周三才能收到更新。区块链技术将交易时间缩短到分钟，甚至秒级，并且全天候处理。降低交易成本\
  \ 由于区块链无需中介机构监督交易，因此区块链有可能显著降低交易费用。降低交易费用可能导致每年节省数十亿美元。第 6 章 – 区块链技术的风险与挑战 ![](img/rsrc9F.jpg)区块链技术的主要吸引力也是其最大的挑战之一。目前，关于区块链空间中什么是被允许的、什么是不被允许的，存在极少的监管。因此，黑客多次利用在线区块链系统中的漏洞窃取数百万美元的投资者资金。尽管当前区块链声称具有安全性，但仍存在一些初步问题，黑客正利用这些问题损害每个区块链用户的利益。最近，Enigma\
  \ 这一去中心化平台因黑客入侵其网站和多个社交媒体账号而遭遇安全事件。黑客借此向 Enigma 社区发送垃圾信息，并窃取近 50 万美元。Enigma 项目由一群麻省理工学院毕业生创立，他们向公众发出加入\
  \ Enigma 社区的邀请。黑客从该公司的官方邮件列表和 Slack 群组中获取资金，影响了约 9,000 名用户和参与者。黑客在 Slack 上发布的消息篡改了官方网站，并伪造了邮件列表中的公司正式资金请求，使得社区成员误以为公司在正式征集资金。社区成员随后将资金直接转入黑客的加密钱包。上一年发生过类似但规模更大的黑客事件：当基于以太坊的去中心化自治组织（DAO）被黑客攻破，导致黑客获得\
  \ 5000 万美元的不法收益，目前尚未挽回。![(rsrc9G.jpg)DAO 原本设想为去中心化投资基金，决策权不应仅由少数合伙人掌握，而是所有投资者均可投票决定投资哪些公司或项目。基金设计为按投入金额赋予投票权，且因基金结构分布式，无人能卷款逃跑。遗憾的是，由于人为错误和编程缺陷，黑客得以利用系统漏洞获取\
  \ 5000 万美元，至今尚未挽回。另一家面临区块链技术挑战的公司是 OneCoin。最近，一家名为 Gnosis 的公司在短短十分钟内以 1250 万美元的代价出售了其代币\
  \ GNO，用于开发先进的预测市场。此次首次代币发行（ICO）在全球媒体中获得了热烈好评。与此同时，位于印度孟买的 OneCoin 公司正在进行其数字货币的销售推广，结果其办公室被金融执法人员突袭。最终，18\
  \ 名 OneCoin 代表被捕，并有超过 200 万美元的投资者资金被没收。多位权威机构将 OneCoin（被誉为“下一个比特币”）描述为庞氏骗局。在孟买办公室被突袭时，公司已转移至少\
  \ 3.5 亿美元的诈骗资金。由于 ICO 缺乏监管和制衡机制，若要投资加密货币，必须确保自己投资的不是随意构想，以免落入诈骗陷阱。 重大障碍 目前，正式合法化和监管加密交易仍面临重大障碍，市场增长和采用也存在类似挑战。围绕区块链的问题包括：区块链市场应采用何种税收结构、如何追踪和汇总资金、资金流入与支出信息的来源及收集方式等，这些问题若仍未在决策者的政策板上得到明确解答，区块链技术的广泛采用将面临困难。然而，未来区块链技术仍有希望。韩国和日本最近取得了重要进展，将允许合法比特币交易，并开放多个应用以供传统投资者进入区块链领域。这些进展吸引了大量资金流向不同的区块链公司，这些公司随后能够投入增长、研究和推广其区块链服务。\
  \ 区块链技术的风险 作为一项新技术，区块链在解决交易速度、验证流程及数据限制等挑战方面仍是广泛采用的障碍。区块链项目的监管状态也是风险之一，目前仍处于不确定状态。如果金融机构和政府不认可区块链技术，或因缺乏明确的行业监管指引而推迟其发展，区块链将永远无法实现投资者和专家所期待的广泛采用，仅成为一种新颖概念。区块链挖矿过程高度耗能，且随着链上每个新区块的创建，成本不断上升。未来可能出现矿工因解决数学谜题仅换取少量比特币奖励而不愿继续投入的局面。此外，还有网络安全和集成问题需要解决，才能让公众愿意将个人数据委托给区块链方案。这也包括获得用户群体或董事会的批准，以便对现有系统进行重大改动或完全替换。最后，区块链技术的社会与文化接受度仍是一个挑战。区块链代表向去中心化网络的彻底转变，这需要所有网络用户和运营者的大力支持。且由于其重大性，大多数人对其并不完全理解。在经历了上述所有风险与障碍后，我们可能需要数年时间才能看到区块链解决方案的广泛采用。第\
  \ 7 章 – 判断区块链技术是否适合你 ![](img/rsrc9H.jpg)有人考虑尝试区块链的常见原因包括：持续尝试新技术的欲望、对区块链时间戳技术的需求，或对区块链在多种方式上保护现有数据的兴趣。与任何新技术一样，在跃进之前，务必审慎考量区块链技术是否真正适合你及你的业务。了解谁会查看你的数据\
  \ 在大多数传统中心化数据库中，拥有访问权限的人的活动都会被记录，以便日后审查。如果你需要让大量人员定期查看数据，但又不希望他们拥有写入权限，那么使用区块链可能会带来好处。利用区块链的优势，你的业务流程可能会得到简化，因为它能为用户提供只读访问权限，同时在必要时提供更传统意义上的日志记录。\
  \ 可写入数据 普通用户数据库通常通过用户名和密码以及多层权限限制来保护。你可以在此基础上实施更多安全措施，防止高价值数据在不应被访问时被访问。尽管有这些预防措施，传统数据库仍不如区块链的安全协议明确：区块链能清晰记录谁创建了哪个区块、何时何地创建的，并要求创建者确认并签名交易。这前提是用户不会直接向节点添加信息。签名随后会在区块链上得到验证，才能将区块附加到链中。即使不需要用户名和密码，区块链也会自动记录创建新区块的用户\
  \ IP 地址。 数据篡改 如果你认为需要对已存储在区块链中的数据进行修改，那么区块链技术可能不适合你的业务。中心化数据库的数据修改非常简单：只需找到适当的授权、更改数据并保存变更日志即可。而区块链技术要求你必须同时在网络中\
  \ 51% 的节点上修改数据，这在某些场景下会自动使区块链数据库被排除在运行之外。 数据恢复 如果你只需不断更新备份数据，那么区块链技术可能会对你有帮助。传统数据库需要手动发起备份，让你担心确保所有数据都在正确位置。相反，分布式数据库会在每次向链中添加新信息时，自动将信息同步到所有可用节点。只要所有节点不会同时出现\
  \ catastrophic 失败，你就无需担心数据丢失。根据备份与更新数据的成本，你可能会发现去中心化数据库的运营费用更具成本效益，从而成为更便宜的选择。 易于共享\
  \ 中心化数据库在访问权限上存在局限，而区块链数据库可以轻松临时连接到其他区块链数据库。这种连接能力使得不同区块链之间的信息传输变得近乎无痛。你可以将数据连接到公司内部的特定部门，或连接到完全不同的公司。若考虑此类连接，请牢记：当你授予他人访问你的区块链时，你实际上授予其访问整个区块链的权限。这对涉及敏感信息的情况而言，需要进行重大规划才能有效利用。\
  \ 存储限制 在传统数据库与区块链数据库的对比中，存储容量是一个明显优势。当在去中心化数据库中新增节点时，它会下载整个区块链。加之节点之间可能相隔数千甚至数万英里，因此保持区块链内的数据量适中尤为重要。作为参考，比特币的数据库仅约\
  \ 100 GB，且已有将近十年历史。若需高容量方案，可能需另寻他处。 验证流程 若计划运行私有区块链，则无需为区块链的区块验证提供奖励，甚至无需考虑工作量证明（PoW）机制。相反，建议采用权益证明（PoS）模型，因为私有区块链中的每个参与者都有利益保持链的更新和可靠。这意味着区块链验证流程会更为简洁。但仍需考虑处理时间以及是否具备足够的人力资源来推动工作。\
  \ 进一步步骤 在分析具体情况后，若决定利用区块链技术，必须明确其具体用途。若你是现有业务所有者，希望在行业中保持领先，则应重点关注区块链与智能技术如何协同提升业务\
  \ ancillary（附属）方面的效率与竞争力。具体而言，需深入审视能够降低成本、提升竞争力的区块链应用场景，以便抢先布局行业新兴趋势。同时，也需评估区块链技术可能带来的业务流程\
  \ disruption（颠覆），提前规划以将其影响降到最低。了解未来可能发生的变化，将使你能够更从容地面对挑战。  \n\n\n\n\n如果你正在考虑围绕区块链创办新的业务，那么你应该尽可能多地与不同的区块链合作。这将帮助你更深入地理解技术，并有助于让技术更加普及，这是新区块链公司起步的关键。如果你希望借助区块链进入主流，那么你需要做一切努力确保区块链技术实现普及。同时，你也要意识到，这条道路注定会很艰难。然而，区块链技术的许多重要好处，往往只能被已经拥有现有基础设施的公司充分利用。这意味着区块链技术普及的最现实预测是：会有少数几家公司抢占风头，其余空间则由能够配合好、在竞争对手之前将自身与区块链技术结合的传统力量成员所占据。\n\
  \n\nHaving Unrealistic Expectations 如果你计划高效使用区块链，首先要明白它并非解决所有问题的万能药。你可以搭建一个私有系统，且只有少数人需要知晓，即便初始测试出现问题。这同样适用于每个区块中常规存储的信息量。整个区块链的大部分内容最终会复制到每个新节点上，因此过于臃肿的链条会为使用区块链的所有计算机带来不必要的负担。要记住，比特币区块链总大小仅为\
  \ 55 GB。虽然这在安全存储私有数据方面表现良好，但在大规模数据使用场景中并非最佳选择。此类情况下，集中式存储系统会更合适。同时要记住，尽管区块链系统内置了多种防错机制，但这并不意味着它们无懈可击。由于每个区块仅通过哈希值引用，人类更容易将一个区块误认为是另一个区块，从而造成损害。因此，若要在业务中使用区块链，必须实施检查机制以防止此类错误，从而获得最佳结果。\n\
  \nUnderestimating the Time Commitment 完全掌握区块链技术的复杂性需要大量时间。如果你计划将区块链系统实施到底，必须明确了解所需的时间投入，以便充分发挥区块链的潜力。阅读本书后，你仍需进一步研究，以确定最适合你业务需求的区块链实现方式。这意味着你需要明确自己将定期使用区块链的目的，以及可能涉及的次要或衍生职责。只有在对这些方面有清晰认识后，才能确定适合你的创建软件类型。\n\
  \n区块链创建工具的市场并不拥挤，这意味着你必须精准把握自己需要的可靠、有效的工具。错误的选择会让创建过程变得比必要的更加繁琐。\n\nBeing Impatient\
  \ 在明确自己将如何使用区块链分布式数据库以及如何实施区块链后，务必避免急于求成。区块链技术的实现过程往往漫长且复杂，必须按部就班、稳步推进。虽然过程可能耗时，但必须完整执行并进行彻底测试，方可在实际场景中依赖区块链。搭建一个优质区块链需要时间，急于求成只会招致问题。因此，你需要制定一个真实反映项目完成时长的时间表，并考虑获得他人（尤其是关键决策者）认可所需的时间。\n\
  \nNot Limiting Access 对于区块链等令人兴奋的新技术，自然会有许多人想尝试。如果你运营的是私有区块链，则必须在获得适当培训前，不要让过多人接入，否则初创区块链容易因\
  \ inexperienced（ inexperienced 为英文，保持原样）操作而被推翻。在私有区块链的核心访问方面，务必将为新区块链生成的私有访问密钥安全存储，一旦丢失，将无法恢复对区块链的控制权。\n\
  \nConclusion ![](img/rsrc9K.jpg)历史上不多的发现与发明能够长久地影响人类进步的方向与速度。区块链技术有望成为其中之一。它在重新定义航空运输、海运货运和全球物流，以及通过提供安全可靠的医疗记录来转变医疗领域的潜力，以及在微金融、金融、信贷投资和预测市场等领域的机遇，表明世界正逐步认识到区块链技术的价值。该技术的能力仍在被界定，仍有大量工作需要完成。数百万美元的投资正持续流入此领域的研究与开发，每天都有新的区块链想法、初创公司和项目推出，每个都希望成为引爆点，改变现有运作方式。现在正是变革的时机，新区块链技术正推动这场变革。然而，前行时我们需要采取谨慎步伐，确保正确使用技术并让尽可能多的人受益。如果你正考虑为业务采用区块链技术，唯一能够真正掌握它的途径是坚持成为该领域的终身学习者。\n"
