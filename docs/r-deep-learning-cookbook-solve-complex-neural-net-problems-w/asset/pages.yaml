    # # Starting with multilayer perceptrons


    This section will focus on extending the logistic regression concept to neural
    networks.


    > > The neural network, also known as Artificial neural network (ANN), is a computational
    paradigm that is inspired by the neuronal structure of the biological brain.


    # # Getting ready


    The ANN is a collection of artificial neurons that perform simple operations on
    the data; the output from this is passed to another neuron. The output generated
    at each neuron is called its activation function. An example of a multilayer perceptron
    model can be seen in the following screenshot:


    ![](img/88a9c35e3059565190fbb6413f1ca217_66_0.png)


    Each link in the preceding figure is associated to weights processed by a neuron.
    Each neuron can be looked at as a processing unit that takes input processing
    and the output is passed to the next layer, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/88a9c35e3059565190fbb6413f1ca217_67_0.png)


    An example of a neuron getting three inputs and one output


    The preceding figure demonstrates three inputs combined at neuron to give an output
    that may be further passed to another neuron. The processing conducted at the
    neuron could be a very simple operation such as the input multiplied by weights
    followed by summation or a transformation operation such as the sigmoid activation
    function.


    # How to do it...


    This section covers type activation functions in multilayer perceptrons. Activation
    is one of the critical component of ANN as it defines the output of that node
    based on the given input. There are many different activation functions used while
    building a neural network:


    +   * **Sigmoid**: The sigmoid activation function is a continuous function also
    known as a logistic function and has the form, 1/(1+exp(-x)). The sigmoid function
    has a tendency to zero out the backpropagation terms during training leading to
    saturation in response. In TensorFlow, the sigmoid activation function is defined
    using the `tf.nn.sigmoid` function.

    +   * **ReLU**: Rectified linear unit (ReLU) is one of the most famous continuous,
    but not smooth, activation functions used in neural networks to capture non-linearity.
    The ReLU function is defined as `max(0,x)`. In TensorFlow, the ReLU activation
    function is defined as `tf.nn.relu`.

    +   * **ReLU6**: It caps the ReLU function at 6 and is defined as `min(max(0,x),
    6)`, thus the value does not become very small or large. The function is defined
    in TensorFlow as `tf.nn.relu6`.

    +   * **tanh**: Hypertangent is another smooth function used as an activation
    function in neural networks and is bound [-1 to 1] and implemented as `tf.nn.tanh`.

    +   * **softplus**: It is a continuous version of ReLU, so the differential exists
    and is defined as `log(exp(x)+1)`. In TensorFlow the softplus is defined as `tf.nn.softplus`.'
