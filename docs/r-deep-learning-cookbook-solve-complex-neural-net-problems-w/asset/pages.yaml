  md: '```

    sess$run(err, feed_dict=dict(X= trainX, W= prv_w, vb= prv_vb, hb= prv_hb))

    ```


    # 5. The full model for the RBM can be trained using the following script:


    ```

    epochs=15

    errors <- list()

    weights <- list()

    u=1

    for (ep in 1:epochs){

    for (i in seq(0, (dim(trainX)[1]-100), 100)) {

    batchX <- trainX[(i+1) : (i+100), ]

    output <- sess$run(list(update_w, update_vb, update_hb),

    feed_dict = dict(X=batchX,

    W = prv_w,

    vb = prv_vb,

    hb = prv_hb))

    prv_w <- output[[1]]

    prv_vb <- output[[2]]

    prv_hb <- output[[3]]

    if(i%%10000 == 0){

    errors[[u]] <- sess$run(err, feed_dict=dict(X= trainX, W= prv_w, vb= prv_vb, hb=
    prv_hb))

    weights[[u]] <- output[[1]]

    u <- u+1

    cat(i , " : ")

    }

    }

    cat("epoch :", ep, " : reconstruction error : ",

    errors[length (errors)][[1]],"\n")

    }

    ```


    # 6. Plot reconstruction using mean squared errors:


    ```

    error_vec <- unlist(errors)

    plot(error_vec,xlab="# of batches",ylab="mean squared reconstruction error",main="RBM-Reconstruction
    MSE plot")

    ```


    # How it works...


    Here, we will run 15 epochs (or iterations) where, in each epoch, a batchwise
    (size = 100) optimization is performed. In each batch, the CD is computed and,
    accordingly, weights and biases are updated. To keep track of the optimization,
    MSE is calculated after every batch of 10,000 rows.'
