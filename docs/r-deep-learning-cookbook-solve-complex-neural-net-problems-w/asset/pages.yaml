  md: "# Setting up denoising autoencoders\n\nDenoising autoencoders are a special\
    \ kind of autoencoder with a focus on extracting robust features from the input\
    \ dataset. Denoising autoencoders are similar to the previous model except with\
    \ a major difference that the data is corrupted before training the network. Different\
    \ approaches for corruption can be used such as masking, which induces random\
    \ error into the data.\n\n# Getting ready\n\nLet's use the CIFAR-10 image data\
    \ to set up a denoising dataset:\n\n+   - Download the CIFAR-10 dataset using\
    \ the `download_cifar_data` function (covered in Chapter 3, Convolution Neural\
    \ Network)\n+   - TensorFlow installation in R and Python\n\n# How to do it...\n\
    \nWe first need to read the dataset.\n\n# Reading the dataset\n\n+   1. Load the\
    \ CIFAR dataset using the steps explained in Chapter 3, Convolution Neural Network.\
    \ The data files `data_batch_1` and `data_batch_2` are used to train. The `data_batch_5`\
    \ and `test_batch` files are used for validation and testing, respectively. The\
    \ data can be flattened using the `flat_data` function:\n+   \n+   `train_data\
    \ <- flat_data(x_listdata = images.rgb.train)`\n+   `test_data <- flat_data(x_listdata\
    \ = images.rgb.test)`\n+   `valid_data <- flat_data(x_listdata = images.rgb.valid)`\n\
    \n+   2. The `flat_data` function flattens the dataset as NCOL = (Height * Width\
    \ * number of channels), thus the dimension of the dataset is (# of images X NCOL).\
    \ The images in CIFAR are 32 x 32 with three RGB channels; thus, we obtain 3,072\
    \ columns after data flattening:\n+   \n+   `> dim(train_data$images)`\n+   `[1]\
    \ 40000 3072`"
