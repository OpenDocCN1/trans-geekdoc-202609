- pgno: 6
  md: '# About the Reviewer


    Vahid Mirjalili is a software engineer/data scientist, currently working toward
    his PhD in Computer Science at Michigan State University. His research at the
    i-PROBE (integrated pattern recognition and biometrics) involves attribute classification
    of face images from large image datasets. He also teaches Python programming as
    well as computing concepts for data analysis and databases. With his specialty
    in data mining, he is very interested in predictive modeling and getting insights
    from data. He is also a Python developer and likes to contribute to the open source
    community. He enjoys making tutorials for different areas of data science and
    computer algorithms, which can be found in his GitHub repository, at http://github.com/mirjalili/DataScience.'
