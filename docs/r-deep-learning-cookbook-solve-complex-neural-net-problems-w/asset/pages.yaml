    # # Setting up a Long short-term memory based sequence model


    In sequence learning the objective is to capture short-term and long-term memory.
    The short-term memory is captured very well by standard RNN, however, they are
    not very effective in capturing long-term dependencies as the gradient vanishes
    (or explodes rarely) within an RNN chain over time.


    > The gradient vanishes when the weights have small values that on multiplication
    vanish over time, whereas in contrast, scenarios where weights have large values
    keep increasing over time and lead to divergence in the learning process. To deal
    with the issue Long Short Term Memory (LSTM) is proposed.


    # # How to do it...


    The RNN models in TensorFlow can easily be extended to LSTM models by using BasicLSTMCell.
    The previous rnn function can be replaced with the lstm function to achieve an
    LSTM architecture:


    ```

    ```

    # LSTM implementation

    lstm<-function(x, weight, bias){

    # Unstack input into step_size

    x = tf$unstack(x, step_size, 1)

    # Define a lstm cell

    lstm_cell = tf$contrib$rnn$BasicLSTMCell(n.hidden, forget_bias=1.0,

    state_is_tuple=TRUE)

    # Get lstm cell output

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: '```

    cell_output = tf$contrib$rnn$static_rnn(lstm_cell, x, dtype=tf$float32)

    # Linear activation, using rnn inner loop last output

    last_vec=tail(cell_output[[1]], n=1)[[1]]

    return(tf$matmul(last_vec, weights) + bias)

    }

    ```


    For brevity the other parts of the code are not replicated.


    # How it works...


    The LSTM has a similar structure to RNN, however, the basic cell is very different
    as traditional RNN uses single multi-layer perceptron (MLP), whereas a single
    cell of LSTM includes four input layers interacting with each other. These three
    layers are:


    +   * forget gate

    +   * input gate

    +   * output gate


    The forget gate in LSTM decides which information to throw away and it depends
    on the last hidden state output \(h_{t-1}\), \(X_t\) which represents input at
    time \(t\).


    ![](img/88a9c35e3059565190fbb6413f1ca217_215_0.png)


    Illustration of forget gate


    In the earlier figure, \(C_t\) represents cell state at time \(t\). The input
    data is represented by \(X_t\) and the hidden state is represented as \(h_{t-1}\).
    The earlier layer can be formulated as:


    ```

    \(f_t = \sigma(S_f X_t + W_f h_{t-1} + b_f)\)

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'The input gate decides update values and decides the candidate values of the
    memory cell and updates the cell state, as shown in the following figure:


    ![](img/88a9c35e3059565190fbb6413f1ca217_216_0.png)


    Illustration of input gate


    +   - The input $i_t$ at time $t$ is updated as:


    ```

    $$i_t = \sigma(S_i x_t + W_i h_{t-1} + b_i)$$ $$\hat{C}_t = \tanh(S_c x_t + W_c
    h_{t-1} + b_c)$$

    ```


    +   - The expected value of current state $\hat{C}_t$ and the output from input
    gate $i_t$ is used to update the current state $C_t$ at time $t$ as:


    ```

    $$C_t = I_t * \hat{C}_t + f_t * C_{t-1}$$

    ```'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'The output gates, as shown in the following figure, compute the output from
    the LSTM cell based on input $X_t$, previous layer output $h_{t-1}$ and current
    state $C_t$:


    ![](img/88a9c35e3059565190fbb6413f1ca217_217_0.png)


    Illustration of output gate


    The output based on output gate can be computed as follows:


    ```

    $O_t = \sigma(S_o x_t + W_o h_{t-1} + b_o)$

    $h_t = O_t * \tanh(C_t)$

    ```'
  merge: -1
