  md: '# How to do it...


    1. The data is imported using the standard function from R, as shown in the following
    code. The data is imported using the read.csv file and transformed into the matrix
    format followed by selecting the features used for the modeling as defined in
    xFeatures and yFeatures:


    ```

    # Loading input and test data

    xFeatures = c("Temperature", "Humidity", "Light", "CO2",

    "HumidityRatio")

    yFeatures = "Occupancy"

    occupancy_train <-

    as.matrix(read.csv("datatraining.txt",stringsAsFactors = T))

