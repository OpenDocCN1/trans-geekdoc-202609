- pgno: 170
  md: "# Understanding the contrastive divergence of the reconstruction\n\nAs an initial\
    \ start, the objective function can be defined as the minimization of the average\
    \ negative log-likelihood of reconstructing the visible vector v where P(v) denotes\
    \ the vector of generated probabilities:\n\n```\narg min (w) -E [Σ_δ∈V log P(δ)]\n\
    ```\n\n# Getting ready\n\nThis section provides the requirements for image reconstruction\
    \ using the input probability vector.\n\n+   • mnist data is loaded in the environment\n\
    +   • The images are reconstructed using the recipe Backward or reconstruction\
    \ phase\n\n# How to do it...\n\nThis current recipe present the steps for, a contrastive\
    \ divergence (CD) technique used to speed up the sampling process:\n\n+   1. Compute\
    \ a positive weight gradient by multiplying (outer product) the input vector X\
    \ with a sample of the hidden vector h0 from the given probability distribution\
    \ prob_h0:\n+      w_pos_grad = tf$matmul(tf$transpose(X), h0)\n+   \n+   2. Compute\
    \ a negative weight gradient by multiplying (outer product) the sample of the\
    \ reconstructed input data v1 with the updated hidden activation vector h1:\n\
    +      w_neg_grad = tf$matmul(tf$transpose(v1), h1)\n+   \n+   3. Then, compute\
    \ the CD matrix by subtracting the negative gradient from the positive gradient\
    \ and dividing by the size of the input data:\n+      CD = (w_pos_grad - w_neg_grad)\
    \ / tf$to_float (tf$shape(X)[0])"
  merge: -1
  img_proc: true
- pgno: 171
  md: '+   4. Then, update the weight matrix W to update_W using a learning rate (alpha)
    and the CD matrix:


    ```

    update_W = W + alpha * CD

    ```


    +   5. Additionally, update the visible and hidden bias vectors:


    ```

    update_vb = vb + alpha * tf$reduce_mean(X - v1)

    update_hb = hb + alpha * tf$reduce_mean(h0 - h1)

    ```


    # How it works...


    The objective function can be minimized using stochastic gradient descent by indirectly
    modifying (and optimizing) the weight matrix. The entire gradient can be further
    divided into two forms based on the probability density: positive gradient and
    negative gradient. The positive gradient primarily depends on the input data and
    the negative gradient depends only on the generated model.


    ![](img/88a9c35e3059565190fbb6413f1ca217_171_0.png)


    In the positive gradient, the probability toward the reconstructing training data
    increases, and in the negative gradient, the probability of randomly generated
    uniform samples by the model decreases.


    The CD technique is used to optimize the negative phase. In the CD technique,
    the weight matrix is adjusted in each iteration of reconstruction. The new weight
    matrix is generated using the following formula. The learning rate is defined
    as alpha, in our case:


    ```

    W'' = W + learning rate * CD

    ```


    # Initializing and starting a new TensorFlow session


    A big part of calculating the error metric such as mean square error (MSE) is
    initialization and starting a new TensorFlow session. Here is how we proceed with
    it.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Getting ready


    This section provides the requirements for starting a new TensorFlow session used
    to compute the error metric.


    +   • mnist data is loaded in the environment

    +   • The TensorFlow graph for the RBM is loaded


    # How to do it...


    This section provides the steps for optimizing the error using reconstruction
    from an RBM:


    +   1. Initialize the current and previous vector of biases and matrices of weights:


    ```

    cur_w = tf$Variable(tf$zeros(shape = shape(num_input, num_hidden),

    dtype=tf$float32))

    cur_vb = tf$Variable(tf$zeros(shape = shape(num_input),

    dtype=tf$float32))

    cur_hb = tf$Variable(tf$zeros(shape = shape(num_hidden),

    dtype=tf$float32))

    prv_w = tf$Variable(tf$random_normal(shape=shape(num_input,

    num_hidden), stddev=0.01, dtype=tf$float32))

    prv_vb = tf$Variable(tf$zeros(shape = shape(num_input),

    dtype=tf$float32))

    prv_hb = tf$Variable(tf$zeros(shape = shape(num_hidden),

    dtype=tf$float32))

    ```


    +   2. Start a new TensorFlow session:


    ```

    sess$run(tf$global_variables_initializer())

    ```


    +   3. Perform a first run with the full input data (**trainX**) and obtain the
    first set of weight matrix and bias vectors:


    ```

    output <- sess$run(list(update_w, update_vb, update_hb), feed_dict

    = dict(X=trainX,

    W = prv_w$eval(),

    vb = prv_vb$eval(),

    hb = prv_hb$eval()))

    prv_w <- output[[1]]

    prv_vb <-output[[2]]

    prv_hb <-output[[3]]

    ```


    +   4. Let''s look at the error of the first run:'
