    # # Learning the architecture of a CNN classifier


    The CNN classifier covered in this chapter has two convolution layers followed
    by two fully connected layers in the end, in which the last layer acts as a classifier
    using the softmax activation function.


    # # Getting ready


    The recipe requires the CIFAR-10 dataset. Thus, the CIFAR-10 dataset should be
