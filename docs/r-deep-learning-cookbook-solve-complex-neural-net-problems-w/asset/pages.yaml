    # # Setting up a regularized autoencoder


    A regularized autoencoder extends the standard autoencoder by adding a regularization
    parameter to the `cost` function.


    # ## Getting ready


    The regularized autoencoder is an extension of the standard autoencoder. The set-up
    will require:


    +   1. TensorFlow installation in R and Python.

    +   2. Implementation of a standard autoencoder.'
