  md: 'In the current cost function, softmax activation function is embedded thus
    the activation function is not required to be defined separately.


    +   2. Calculate the average of the cross entropy, which needs to be minimized
    using an optimizer:


    ```

    cost = tf$reduce_mean(cross_entropy)

    ```


    # How it works...


    In step 1, we define a cross entropy to evaluate the performance of classification.
    Based on the exact match between the true and predicted labels, the cross entropy
    function returns a value that is positive and follows a continuous distribution.
    As zero cross entropy ensures a full match, optimizers tend to minimize the cross
    entropy toward the value zero by updating the network parameters such as weights
    and biases. The cross entropy function returns a value for each individual image
    that needs to be further compressed into a single scalar value, which can be used
    in an optimizer. Hence, in step 2, we calculate a simple average of the cross
    entropy output and store it as _cost_.


    # Performing gradient descent cost optimization


    In this recipe, let''s define an optimizer that can minimize the cost. Post optimization,
    check for CNN performance.


    # Getting ready


    The optimizer definition will require the _cost_ recipe to be defined as it goes
    as input to the optimizer.


    # How to do it...


    +   1. Run an Adam optimizer with the objective of minimizing the cost for a given
    _learning_rate_:


    ```

    optimizer =

    tf$train$AdamOptimizer(learning_rate=1e-4) $minimize(cost)

    ```'
