  img_proc: true
- pgno: 168
  md: '# Example of a sampling


    Consider a constant vector s1 equivalent to a tensor vector of probabilities.
    Then, create a new random uniformly distributed sample s2 using the distribution
    of the constant vector s1. Then calculate the difference and apply a rectified
    linear activation function.


    # How to do it...


    This section provides the steps to set up the script for running the RBM model
    using TensorFlow:


    ```

    X = tf$placeholder(tf$float32, shape=shape(NULL, num_input))

    prob_h0= tf$nn$sigmoid(tf$matmul(X, W) + hb)

    h0 = tf$nn$relu(tf$sign(prob_h0 - tf$random_uniform(tf$shape(prob_h0))))

    ```


    Use the following code to execute the graph created in TensorFlow:


    ```

    sess$run(tf$global_variables_initializer())

    s1 <- tf$constant(value = c(0.1, 0.4, 0.7, 0.9))

    cat(sess$run(s1))

    s2=sess$run(tf$random_uniform(tf$shape(s1)))

    cat(s2)

    cat(sess$run(s1-s2))

    cat(sess$run(tf$sign(s1 - s2)))

    cat(sess$run(tf$nn$relu(tf$sign(s1 - s2))))

    ```


    # Backward or reconstruction phase of RBM


    In the reconstruction phase, the data from the hidden layer is passed back to
    the visible layer. The hidden layer vector of probabilities h0 is multiplied by
    the transpose of the weight matrix W and added to a visible layer bias vb, which
    is then passed through a sigmoid function to generate a reconstructed input vector
    prob_v1.


    A sample input vector is created using the reconstructed input vector, which is
    then multiplied by the weight matrix W and added to the hidden bias vector hb
    to generate an updated hidden vector of probabilities h1.


    This is also called Gibbs sampling. In some scenarios, the sample input vector
    is not generated and the reconstructed input vector prob_v1 is directly used to
    update the hi'
  merge: -1
  img_proc: true
- pgno: 169
  md: '![](img/88a9c35e3059565190fbb6413f1ca217_169_0.png)


    # Getting ready


    This section provides the requirements for image reconstruction using the input
    probability vector.


    +   - mnist data is loaded in the environment

    +   - The RBM model is trained using the recipe Training a Restricted Boltzmann
    machine


    # How to do it...


    This section covers the steps to perform backward reconstruction and evaluation:


    +   1. The backward image reconstruction can be performed using the input probability
    vector with the following script:


    ```

    prob_v1 = tf$nn$sigmoid(tf$matmul(h0, tf$transpose(W)) + vb)

    v1 = tf$nn$relu(tf$sign(prob_v1 -

    tf$random_uniform(tf$shape(prob_v1))))

    h1 = tf$nn$sigmoid(tf$matmul(v1, W) + hb)

    ```


    +   2. The evaluation can be performed using a defined metric, such as **mean
    squared error** (MSE), which is computed between the actual input data (X) and
    the reconstructed input data (v1). The MSE is computed after each epoch and the
    key objective is to minimize the MSE:


    ```

    err = tf$reduce_mean(tf$square(X - v1))

    ```'
