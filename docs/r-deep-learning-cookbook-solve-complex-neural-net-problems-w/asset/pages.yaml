- pgno: 49
  md: '# Deep Learning with R


    This chapter will build a foundation for neural networks followed by deep learning
    foundation and trends. We will cover the following topics:


    +   - Starting with logistic regression

    +   - Introducing the dataset

    +   - Performing logistic regression using H2O

    +   - Performing logistic regression using TensorFlow

    +   - Visualizing TensorFlow graphs

    +   - Starting with multilayer perceptrons

    +   - Setting up a neural network using H2O

    +   - Tuning hyper-parameters using grid searches in H2O

    +   - Setting up a neural network using MXNet

    +   - Setting up a neural network using TensorFlow


    # Starting with logistic regression


    Before we delve into neural networks and deep learning models, let''s take a look
    at logistic regression, which can be viewed as a single layer neural network.
    Even the **sigmoid** function commonly used in logistic regression is used as
    an activation function in neural networks.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Getting ready


    Logistic regression is a supervised machine learning approach for the classification
    of dichotomous/ordinal (order discrete) categories.


    # How to do it...


    Logistic regression serves as a building block for complex neural network models
    using sigmoid as an activation function. The logistic function (or sigmoid) can
    be represented as follows:


    $$y = \frac{1}{1 + e^{-z}}$$


    The preceding sigmoid function forms a continuous curve with a value bound between
    [0, 1], as illustrated in the following screenshot:


    ![](img/88a9c35e3059565190fbb6413f1ca217_50_0.png)


    Sigmoid functional form'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The formulation of a logistic regression model can be written as follows:


    P r(y=1|X) = \frac{1}{1+e^{-(W^TX+b)}}


    Here, W is the weight associated with features X= [x1, x2, ..., xm] and b is the
    model intercept, also known as the model bias. The whole objective is to optimize
    W for a given loss function such as cross entropy. Another view of the logistic
    regression model to attain Pr(y=1|X) is shown in the following figure:


    ![](img/88a9c35e3059565190fbb6413f1ca217_51_0.png)


    # Introducing the dataset


    This recipe shows how to prepare a dataset to be used to demonstrate different
    models.


    # Getting ready


    As logistic regression is a linear classifier, it assumes linearity in independent
    variables and log odds. Thus, in scenarios where independent features are linear-dependent
    on log odds, the model performs very well. Higher-order features can be included
    in the model to capture nonlinear behavior. Let''s see how to build logistic regression
    models using major deep learning packages as discussed in the previous chapter.
    Internet connectivity will be required to download the dataset from the UCI repository.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # How to do it...


    In this chapter, the Occupancy Detection dataset from the **UC Irvine ML repository**
    is used to build models on logistic regression and neural networks. It is an experimental
    dataset primarily used for binary classification to determine whether a room is
    occupied (1) or not occupied (0) based on multivariate predictors as described
    in the following table. The contributor of the dataset is *Luis Candanedo* from
    UMONS.


    Download the dataset at `https://archive.ics.uci.edu/ml/datasets/Occupancy+Detection+.`


    There are three datasets tobe downloaded; however, we will use `datatraining.txt`
    for training/cross validation purposes and `datatest.txt` for testing purposes.


    The dataset has seven attributes (including response occupancy) with 20,560 instances.
    The following table summarizes the attribute information:


    | Attribute | Description | Characteristic |

    |---|---|---|

    | Date time | Year-month-day hour:minute:second format | Date |

    | Temperature | In Celsius | Real |

    | Relative Humidity | In % | Real |

    | Light | In Lux | Real |

    | CO2 | In ppm | Real |

    | Humidity ratio | Derived quantity from temperature and relative humidity, in
    kg water-vapor/kg-air | Real |

    | Occupancy | 0 for not occupied; 1 for occupied | Binary class |'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Performing logistic regression using H2O


    Generalized linear models (GLM) are widely used in both regression- and classification-
    based predictive analysis. These models optimize using maximum likelihood and
    scale well with larger datasets. In H2O, GLM has the flexibility to handle both
    L1 and L2 penalties (including elastic net). It supports Gaussian, Binomial, Poisson,
    and Gamma distributions of dependent variables. It is efficient in handling categorical
    variables, computing full regularizations, and performing distributed n-fold cross
    validations to control for model overfitting. It has a feature to optimize hyperparameters
    such as elastic net (α) using distributed grid searches along with handling upper
    and lower bounds for predictor attribute coefficients. It can also handle automatic
    missing value imputation. It uses the Hogwild method for optimization, a parallel
    version of stochastic gradient descent.


    # Getting ready


    The previous chapter provided the details for the installation of H2O in R along
    with a working example using its web interface. To start modeling, load the h2o
    package in the R environment:


    ```

    require(h2o)

    ```


    Then, initialize a single-node H2O instance using the h2o.init() function on eight
    cores and instantiate the corresponding client module on the IP address localhost
    and port number 54321:


    ```

    localH2O = h2o.init(ip = "localhost", port = 54321, startH2O =

    TRUE,min_mem_size = "20G",nthreads = 8)

    ```


    The H2O package has dependency on the Java JRE. Thus, it should be pre-installed
    before executing the initialization command.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# How to do it...


    The section will demonstrate steps to build the GLM model using H2O.


    +   1. Now, load the occupancy train and test datasets in R:


    ```

    # Load the occupancy data

    occupancy_train <-

    read.csv("C:/occupation_detection/datatraining.txt",stringsAsFactor

    s = T)

    occupancy_test <-

    read.csv("C:/occupation_detection/datatest.txt",stringsAsFactors =

    T)

    ```


    +   2. The following independent (x) and dependent (y) variables will be used
    to model GLM:


    ```

    # Define input (x) and output (y) variables"

    x = c("Temperature", "Humidity", "Light", "CO2", "HumidityRatio")

    y = "Occupancy"

    ```


    +   3. Based on the requirement for H2O, convert the dependent variables into
    factors as follows:


    ```

    # Convert the outcome variable into factor

    occupancy_train$Occupancy <- as.factor(occupancy_train$Occupancy)

    occupancy_test$Occupancy <- as.factor(occupancy_test$Occupancy)

    ```


    +   4. Then, convert the datasets to H2OParsedData objects:


    ```

    occupancy_train.hex <- as.h2o(x = occupancy_train,

    destination_frame = "occupancy_train.hex")

    occupancy_test.hex <- as.h2o(x = occupancy_test, destination_frame

    = "occupancy_test.hex")

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: '5. Once the data is loaded and converted to H2OParsedData objects, run a GLM
    model using the `h2o.glm` function. In the current setup, we intend to train for
    parameters such as five-fold cross validation, elastic net regularization ($\alpha
    = 5$), and optimal regularization strength (with `lambda_search = TRUE`):


    ```

    ```

    # Train the model

    occupancy_train.glm <- h2o.glm(x = x, # Vector of predictor

    variable names

    y = y, # Name of response/dependent

    variable

    training_frame =

    occupancy_train.hex, # Training data

    seed = 1234567, # Seed for

    random numbers

    family = "binomial", # Outcome

    variable

    lambda_search = TRUE, # Optimum

    regularisation lambda

    alpha = 0.5, # Elastic net

    regularisation

    nfolds = 5 # N-fold

    cross validation

    )

    ```

    ```


    6. In addition to the preceding command, you can also define other parameters
    to fine-tune the model performance. The following list does not cover all the
    functional parameters, but covers some based on importance. The complete list
    of parameters can be found in the documentation of the `h2o` package.


    +   - Specify the strategy of generating cross-validation samples such as random
    sampling, stratified sampling, modulo sampling, and auto (select) using `fold_assignment`.
    The sampling can also be performed on a particular attribute by specifying the
    column name (`fold_column`).

    +   - Option to handle skewed outcomes (imbalanced data) by specifying weights
    to each observation using `weights_column` or performing over/under sampling using
    `balance_classes`.

    +   - Option to handle missing values by mean imputation or observation skip using
    `missing_values_handling`.

    +   - Option to restrict the coefficients to be non-negative using `non_negative`
    and constrain their values using `beta_constraints`.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   * Option to provide prior probability for y==1(logistic regression) in
    the case of sampled data if its mean of response does not reflect the reality
    (prior).

    +   * Specify the variables to be considered for interactions (interactions).


    # # How it works...


    The performance of the model can be assessed using many metrics such as accuracy,
    **Area under curve** (**AUC**), misclassification error (%), misclassification
    error count, F1-score, precision, recall, specificity, and so on. However, in
    this chapter, the assessment of model performance is based on AUC.


    The following is the training and cross validation accuracy of the trained model:


    ```

    ```

    # Training accuracy (AUC)

    > occupancy_train.glm@model$training_metrics@metrics$AUC

    [1] 0.994583


    # Cross validation accuracy (AUC)

    > occupancy_train.glm@model$cross_validation_metrics@metrics$AUC

    [1] 0.9945057

    ```

    ```


    Now, let''s assess the performance of the model on test data. The following code
    helps in predicting the outcome of the test data:


    ```

    ```

    # Predict on test data

    yhat <- h2o.predict(occupancy_train.glm, occupancy_test.hex)

    ```

    ```


    Then, evaluate the AUC value based on the actual test outcome as follows:


    ```

    ```

    # Test accuracy (AUC)

    > yhat$pmax <- pmax(yhat$p0, yhat$p1, na.rm = TRUE)

    > roc_obj <- pROC::roc(c(as.matrix(occupancy_test.hex$Occupancy)),

    >                     c(as.matrix(yhat$pmax)))


    > auc(roc_obj)

    Area under the curve: 0.9915

    ```

    ```'
  merge: -1
  img_proc: true
