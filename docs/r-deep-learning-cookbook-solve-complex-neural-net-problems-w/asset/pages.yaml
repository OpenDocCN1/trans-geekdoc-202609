- pgno: 33
  md: '# # How it works...


    Model evaluation is a key step in any machine learning process. It is different
    for supervised and unsupervised models. In supervised models, predictions play
    a major role; whereas in unsupervised models, homogeneity within clusters and
    heterogeneity across clusters play a major role.


    Some widely used model evaluation parameters for regression models (including
    cross validation) are as follows:


    +   - Coefficient of determination

    +   - Root mean squared error

    +   - Mean absolute error

    +   - Akaike or Bayesian information criterion


    Some widely used model evaluation parameters for classification models (including
    cross validation) are as follows:


    +   - Confusion matrix (accuracy, precision, recall, and F1-score)

    +   - Gain or lift charts

    +   - Area under ROC (receiver operating characteristic) curve

    +   - Concordant and discordant ratio


    Some of the widely used evaluation parameters of unsupervised models (clustering)
    are as follows:


    +   - Contingency tables

    +   - Sum of squared errors between clustering objects and cluster centers or
    centroids

    +   - Silhouette value

    +   - Rand index

    +   - Matching index

    +   - Pairwise and adjusted pairwise precision and recall (primarily used in NLP)


    Bias and variance are two key error components of any supervised model; their
    trade-off plays a vital role in model tuning and selection. Bias is due to incorrect
    assumptions made by a predictive model while learning outcomes, whereas variance
    is due to model rigidity toward the training dataset. In other words, higher bias
    leads to underfitting and higher variance leads to overfitting of models.'
  merge: -1
  img_proc: true
- pgno: 34
  md: "In bias, the assumptions are on target functional forms. Hence, this is dominant\
    \ in parametric models such as linear regression, logistic regression, and linear\
    \ discriminant analysis as their outcomes are a functional form of input variables.\n\
    \nVariance, on the other hand, shows how susceptible models are to change in datasets.\
    \ Generally, target functional forms control variance. Hence, this is dominant\
    \ in non-parametric models such as decision trees, support vector machines, and\
    \ K-nearest neighbors as their outcomes are not directly a functional form of\
    \ input variables. In other words, the hyperparameters of non-parametric models\
    \ can lead to overfitting of predictive models.\n\n# Setting up deep learning\
    \ tools/packages in R\n\nThe major deep learning packages are developed in C/C++\
    \ for efficiency purposes and wrappers are developed in R to efficiently develop,\
    \ extend, and execute deep learning models.\n\nA lot of open source deep learning\
    \ libraries are available. The prominent libraries in this area are as follows:\n\
    \n+   - Theano\n+   - TensorFlow\n+   - Torch\n+   - Caffe\n\nThere are other\
    \ prominent packages available on the market such as H2O, CNTK (Microsoft Cognitive\
    \ Toolkit), darch, Mocha, and ConvNetJS. There are a lot of wrappers that are\
    \ developed around these packages to support the easy development of deep learning\
    \ models, such as Keras and Lasagne in Python and MXNet, both supporting multiple\
    \ languages.\n\n# How to do it...\n\n+   1. This chapter will cover the MXNet\
    \ and TensorFlow packages (developed in C++ and CUDA for a highly optimized performance\
    \ in GPU).\n+   \n+   2. Additionally, the h2o package will be used to develop\
    \ some deep learning models. The h2o package in R is implemented as a REST API,\
    \ which connects to the H2O server (it runs as Java Virtual Machines (JVM)). We\
    \ will provide quick setup instructions for these packages in the following sections"
  merge: -1
  img_proc: true
- pgno: 35
  md: '# # Installing MXNet in R


    This section will cover the installation of MXNet in R.


    # ## Getting ready


    The MXNet package is a lightweight deep learning architecture supporting multiple
    programming languages such as R, Python, and Julia. From a programming perspective,
    it is a combination of symbolic and imperative programming with support for CPU
    and GPU.


    The CPU-based MXNet in R can be installed using the prebuilt binary package or
    the source code where the libraries need to be built. In Windows/mac, prebuilt
    binary packages can be download and installed directly from the R console. MXNet
    requires the R version to be 3.2.0 and higher. The installation requires the `drat`
    package from CRAN. The `drat` package helps maintain R repositories and can be
    installed using the `install.packages()` command.


    To install MXNet on Linux (13.10 or later), the following are some dependencies:


    +   - Git (to get the code from GitHub)

    +   - libatlas-base-dev (to perform linear algebraic operations)

    +   - libopencv-dev (to perform computer vision operations)


    To install MXNet with a GPU processor, the following are some dependencies:


    +   - Microsoft Visual Studio 2013

    +   - The NVIDIA CUDA Toolkit

    +   - The MXNet package

    +   - cuDNN (to provide a deep neural network library)


    Another quick way to install `mxnet` with all the dependencies is to use the prebuilt
    Docker image from the `chstone` repository. The `chstone/mxnet-gpu` Docker image
    will be installed using the following tools:


    +   - MXNet for R and Python

    +   - Ubuntu 16.04

    +   - CUDA (Optional for GPU)

    +   - cuDNN (Optional for GPU)'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# How to do it...


    1. The following R command installs MXNet using prebuilt binary packages, and
    is hassle-free. The drat package is then used to add the dlmc repository from
    git followed by the mxnet installation:


    ```

    install.packages ("drat", repos="https://cran.rstudio.com")

    drat:::addRepo("dmlc")

    install.packages("mxnet")

    ```


    2. The following code helps install MXNet in Ubuntu (V16.04). The first two lines
    are used to install dependencies and the remaining lines are used to install MXNet,
    subject to the satisfaction of all the dependencies:


    ```

    sudo apt-get update

    sudo apt-get install -y build-essential git libatlas-base-dev

    libopencv-dev

    git clone https://github.com/dmlc/mxnet.git ~/mxnet --recursive

    cd ~/mxnet

    cp make/config.mk .

    echo "USE_BLAS=openblas" >>config.mk

    make -j$(nproc)

    ```


    3. If MXNet is to be built for GPU, the following config needs to be updated before
    the make command:


    ```

    echo "USE_CUDA=1" >>config.mk

    echo "USE_CUDA_PATH=/usr/local/cuda" >>config.mk

    echo "USE_CUDNN=1" >>config.mk

    ```


    ![](img/88a9c35e3059565190fbb6413f1ca217_36_0.png)


    A detailed installation of MXNet for other operating systems can be found at http://mxnet.io/get_started/setup.html.


    4. The following command is used to install MXNet (GPU-based) using Docker with
    all the dependencies:


    ```

    docker pull chstone/mxnet-gpu

    ```'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Installing TensorFlow in R


    This section will cover another very popular open source machine learning package,
    TensorFlow, which is very effective in building deep learning models.


    # Getting ready


    TensorFlow is another open source library developed by the Google Brain Team to
    build numerical computation models using data flow graphs. The core of TensorFlow
    was developed in C++ with the wrapper in Python. The `tensorflow` package in R
    gives you access to the TensorFlow API composed of Python modules to execute computation
    models. TensorFlow supports both CPU- and GPU-based computations.


    The `tensorflow` package in R calls the Python tensorflow API for execution, which
    is essential to install the `tensorflow` package in both R and Python to make
    R work. The following are the dependencies for `tensorflow`:


    +   - Python 2.7 / 3.x

    +   - R (>3.2)

    +   - devtools package in R for installing TensorFlow from GitHub

    +   - TensorFlow in Python

    +   - pip


    # How to do it...


    +   1. Once all the mentioned dependencies are installed, `tensorflow` can be
    installed from `devtools` directly using the `install_github` command as follows:


    ```

    devtools::install_github("rstudio/tensorflow")

    ```


    +   2. Before loading `tensorflow` in R, you need to set up the path for Python
    as the system environment variable. This can be done directly from the R environment,
    as shown in the following command:


    ```

    Sys.setenv(TENSORFLOW_PYTHON="/usr/bin/python")

    library(tensorflow)

    ```


    If the Python `tensorflow` module is not installed, R will give the following
    error:'
  merge: -1
  img_proc: true
