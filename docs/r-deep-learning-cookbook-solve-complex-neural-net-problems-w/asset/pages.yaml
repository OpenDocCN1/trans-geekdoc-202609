- pgno: 95
  md: "# # Getting ready\n\nThe input dataset is defined and loaded. The `create_conv_layer`\
    \ function presented in the recipe takes the following five input parameters and\
    \ needs to be defined while setting-up a convolution layer:\n\n+   1. Input: This\
    \ is a four-dimensional tensor (or a list) that comprises a number of (input)\
    \ images, the height of each image (here 32L), the width of each image (here 32L),\
    \ and the number of channels of each image (here 3L : red, blue, and green).\n\
    +   \n+   2. Num_input_channels: This is defined as the number of color channels\
    \ in the case of the first convolution layer or the number of filter channels\
    \ in the case of subsequent convolution layers.\n+   \n+   3. Filter_size: This\
    \ is defined as the width and height of each filter in the convolution layer.\
    \ Here, the filter is assumed to be a square.\n+   \n+   4. Num_filters: This\
    \ is defined as the number of filters in a given convolution layer.\n+   \n+ \
    \  5. Use_pooling: This is a binary variable that is used perform 2 x 2 max pooling.\n\
    \n# ## How to do it...\n\n+   1. Run the following function to create a new convolution\
    \ layer:\n\n```\n```\n# Create a new convolution layer\ncreate_conv_layer <- function(input,\n\
    num_input_channels,\nfilter_size,\nnum_filters,\nuse_pooling=True)\n{\n# Shape\
    \ of the filter-weights for the convolution.\nshape1 = shape(filter_size, filter_size,\
    \ num_input_channels,\nnum_filters)\n# Create new weights\nweights = weight_variable(shape=shape1)\n\
    # Create new biases\nbiases = bias_variable(shape=shape (num_filters))\n# Create\
    \ the TensorFlow operation for convolution.\nlayer = tf$nn$conv2d(input=input,\n\
