- pgno: 91
  md: '# # How to do it...


    Let''s define the configuration of the CNN classifier as follows:


    +   1. Each input image (CIFAR-10) is of size 32 x 32 pixels and can be labeled
    one among 10 classes:


    ```

    # CIFAR images are 32 x 32 pixels.

    img_width = 32L

    img_height = 32L


    # Tuple with height and width of images used to reshape arrays.

    img_shape = (img_width, img_height)


    # Number of classes, one class for each of 10 images

    num_classes = 10L

    ```


    +   2. The images of the CIFAR-10 dataset have three channels (red, green, and
    blue):


    ```

    # Number of color channels for the images: 3 channel for red, blue,

    green scales.

    num_channels = 3L

    ```


    +   3. The images are stored in one-dimensional arrays of the following length
    (img_size_flat):


    ```

    # Images are stored in one-dimensional arrays of length.

    img_size_flat = img_width * img_height * num_channels

    ```


    +   4. In the first convolution layer, the size (width x height) of the convolution
    filter is 5 x 5 pixels (filter_size1) and the depth (or number) of convolution
    filter is 64 (num_filters1):


    ```

    # Convolutional Layer 1.

    filter_size1 = 5L

    num_filters1 = 64L

    ```


    +   5. In the second convolution layer, the size and depth of the convolution
    filter is the same as the first convolution layer:


    ```

    # Convolutional Layer 2.

    filter_size2 = 5L

    num_filters2 = 64L

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: '6. Similarly, the output of the first fully connected layer is the same as
    the input of the second fully connected layer:


    ```

    # Fully-connected layer.

    fc_size = 1024L

    ```


    # How it works...


    The dimensions and characteristics of an input image are shown in steps 1 and
    2, respectively. Every input image is further processed in a convolution layer
    using a set of filters as defined in steps 4 and 5. The first convolution layer
    results in a set of 64 images (one for each set filter). In addition, the resolution
    of these images are also reduced to half (because of 2 x 2 max pooling); namely,
    from 32 x 32 pixels to 16 x 16 pixels.


    The second convolution layer will input these 64 images and provide an output
    of new 64 images with further reduced resolutions. The updated resolution is now
    8 x 8 pixels (again due to 2 x 2 max pooling). In the second convolution layer,
    a total of 64 x 64 = 4,096 filters are created, which are then further convoluted
    into 64 output images (or channels). Remember that these 64 images of 8 x 8 resolution
    correspond to a single input image.


    Further, these 64 output images of 8 x 8 pixels are flattened into a single vector
    of length 4,096 (8 x 8 x 64), as defined in step 3, and are used as an input to
    a fully connected layer of a given set of neurons, as defined in step 6. The vector
    of 4,096 elements is then fed into the first fully connected layer of 1,024 neurons.
    The output neurons are again fed into a second fully connected layer of 10 neurons
    (equal to num_classes). These 10 neurons represent each of the class labels, which
    are then used to determine the (final) class of the image.


    First, the weights of the convolution and fully connected layers are randomly
    initialized till the classification stage (the end of CNN graph). Here, the classification
    error is computed based on the true class and the predicted class (also called
    cross entropy).


    Then, the optimizer backpropagates the error through the convolution network using
    the chain rule of differentiation, post which the weights of the layers (or filters)
    are updated such that the error is minimized. This entire cycle of one forward
    and backward propagation is called one iteration. Thousands of such iterations
    are performed till the classification error is reduced to a sufficiently low value.


    Generally, these iterations are performed using a batch of images instead of a
    single image to increase the efficiency of computation.'
  merge: -1
  img_proc: true
