    # # Evaluating the sparse decomposition


    The sparse autoencoder is also known as over-complete representation and has a
    higher number of nodes in the hidden layer. The sparse autoencoders are usually
    executed with the sparsity parameter (regularization), which acts as a constraint
    and restricts the node to being active. The sparsity can also be assumed as nodes
    dropout caused due to sparsity constraints. The loss function for a sparse autoencoder
    consists of a reconstruction error, a regularization term to contain the weight
    decay, and KL divergence for sparsity constraint. The following representation
    gives a very good illustration of what we are talking about:'
  merge: -1
  img_proc: true
- pgno: 156
  md: '```

    ||X-f(h)||^2 + \frac{\lambda}{2} ||W||^2 + \beta J_{KL}(\rho||\hat{\rho})

    ```


    where, X and f(h) represent input matrix and output from decoder. The W represent
    weight matrix for nodes and \lambda and \beta are regularization parameter and
    penalty to sparsity term. The term J_{KL}(\rho||\hat{\rho}) is KL divergence value
    captured for sparsity term \rho . KL divergence for given sparsity parameter can
    be computed as


    ```

    J_{KL}(\rho||\hat{\rho}) = \sum_{i=1}^{n} \rho \log(\frac{\rho}{\hat{\rho_i}})
    + (1-\rho)\log(\frac{1-\rho}{1-\hat{\rho_i}})

    ```


    where, n is number of nodes in layer h and \hat{\rho} is vector of average activities
    in hidden layer on normalized neurons.


