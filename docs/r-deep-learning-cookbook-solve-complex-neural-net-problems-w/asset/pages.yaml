- pgno: 58
  md: '# Performing logistic regression using TensorFlow


    In this section, we will cover the application of TensorFlow in setting up a logistic
    regression model. The example will use a similar dataset to that used in the H2O
    model setup.


    # Getting ready


    The previous chapter provided details for the installation of TensorFlow. The
    code for this section is created on Linux but can be run on any operating system.
    To start modeling, load the tensorflow package in the environment. R loads the
    default TensorFlow environment variable and also the NumPy library from Python
    in the np variable:


    ```

    library("tensorflow") # Load TensorFlow

    np <- import("numpy") # Load numpy library

    ```


    # How to do it...


    The data is imported using a standard function from R, as shown in the following
    code.


    +   1. The data is imported using the read.csv file and transformed into the matrix
    format followed by selecting the features used to model as defined in xFeatures
    and yFeatures. The next step in TensorFlow is to set up a graph to run optimization:


    ```

    # Loading input and test data

    xFeatures = c("Temperature", "Humidity", "Light", "CO2",

    "HumidityRatio")

    yFeatures = "Occupancy"

    occupancy_train <-

    as.matrix(read.csv("datatraining.txt",stringsAsFactors = T))

    occupancy_test <-

    as.matrix(read.csv("datatest.txt",stringsAsFactors = T))

    # subset features for modeling and transform to numeric values

    occupancy_train<-apply(occupancy_train[, c(xFeatures, yFeatures)],

    2, FUN=as.numeric)

    ```'
  merge: -1
  img_proc: true
- pgno: 59
  md: '```

    occupancy_test<-apply(occupancy_test[, c(xFeatures, yFeatures)], 2,

    FUN=as.numeric)

    ```


    ```

    # Data dimensions

    nFeatures<-length(xFeatures)

    nRow<-nrow(occupancy_train)

    ```


    +   2. Before setting up the graph, let''s reset the graph using the following
    command:


    ```

    # Reset the graph

    tf$reset_default_graph()

    ```


    +   3. Additionally, let''s start an interactive session as it will allow us to
    execute

    +   variables without referring to the session-to-session object:


    ```

    # Starting session as interactive session

    sess<-tf$InteractiveSession()

    ```


    +   4. Define the logistic regression model in TensorFlow:


    ```

    # Setting-up Logistic regression graph

    x <- tf$constant(unlist(occupancy_train[, xFeatures]),

    shape=c(nRow, nFeatures), dtype=np$float32) #

    W <- tf$Variable(tf$random_uniform(shape=c(nFeatures, 1L)))

    b <- tf$Variable(tf$zeros(shape=c(1L)))

    y <- tf$matmul(x, W) + b

    ```


    6. The input feature x is defined as a constant as it will be an input to the
    system.

    The weight W and bias b are defined as variables that will be optimized during

    the optimization process. The y is set up as a symbolic representation between
    x,

    W, and b. The weight W is set up to initialize random uniform distribution and
    b is

    assigned the value zero.


    +   7. The next step is to set up the cost function for logistic regression:


    ```

    # Setting-up cost function and optimizer

    y_ <- tf$constant(unlist(occupancy_train[, yFeatures]),

    dtype="float32", shape=c(nRow, 1L))

    cross_entropy<-

    tf$reduce_mean(tf$nn$sigmoid_cross_entropy_with_logits(labels=y_,

    logits=y, name="cross_entropy"))

    optimizer <-

    tf$train$GradientDescentOptimizer(0.15)$minimize(cross_entropy)

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: "The variable y_ is the response variable. Logistic regression is set up using\
    \ cross entropy as the loss function. The loss function is passed to the gradient\
    \ descent optimizer with a learning rate of 0.15. Before running the optimization,\
    \ initialize the global variables:\n\n```\n# Start a session\ninit <- tf$global_variables_initializer()\n\
    sess$run(init)\n```\n\n+   8. Execute the gradient descent algorithm for the optimization\
    \ of weights using cross entropy as the loss function:\n\n```\n# Running optimization\n\
    for (step in 1:5000) {\n sess$run(optimizer)\n if (step %% 20== 0)\n cat(step,\"\
    -\", sess$run(W), sess$run(b), \"==>\",\n sess$run(cross_entropy), \"n\")\n}\n\
    ```\n\n# How it works...\n\nThe performance of the model can be evaluated using\
    \ AUC:\n\n```\n# Performance on Train\nlibrary(pROC)\nypred <- sess$run(tf$nn$sigmoid(tf$matmul(x,\
    \ W) + b))\nroc_obj <- roc(occupancy_train[, yFeatures], as.numeric(ypred))\n\
    ```\n\n```\n# Performance on test\nnRowt<-nrow(occupancy_test)\nxt <- tf$constant(unlist(occupancy_test[,\
    \ xFeatures]), shape=c(nRowt,\nnFeatures), dtype=np$float32)\nypredt <- sess$run(tf$nn$sigmoid(tf$matmul(xt,\
    \ W) + b))\nroc_objt <- roc(occupancy_test[, yFeatures], as.numeric(ypredt)).\n\
    ```\n\nAUC can be visualized using the plot.auc function from the pROC package,\
    \ as shown in the screenshot following this command. The performance for training\
    \ and testing (hold-out) is very similar.\n\n```\nplot.roc(roc_obj, col = \"green\"\
    , lty=2, lwd=2)\nplot.roc(roc_objt, add=T, col=\"red\", lty=4, lwd=2)\n```"
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/88a9c35e3059565190fbb6413f1ca217_61_0.png)


    Performance of logistic regression using TensorFlow


    # # Visualizing TensorFlow graphs


    TensorFlow graphs can be visualized using TensorBoard. It is a service that utilizes
    TensorFlow event files to visualize TensorFlow models as graphs. Graph model visualization
    in TensorBoard is also used to debug TensorFlow models.


    # ## Getting ready


    TensorBoard can be started using the following command in the terminal:


    ```

    ```

    $ tensorflow --logdir home/log --port 6006

    ```

    ```


    The following are the major parameters for TensorBoard:


    +   * `--logdir : To map to the directory to load TensorFlow events`

    +   * `--debug: To increase log verbosity`'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   - --host: To define the host to listen to its localhost (127.0.0.1) by
    default

    +   - --port: To define the port to which TensorBoard will serve


    The preceding command will launch the TensorFlow service on localhost at port
    6006, as shown in the following screenshot:


    ![](img/88a9c35e3059565190fbb6413f1ca217_62_0.png)


    TensorBoard


    The tabs on the TensorBoard capture relevant data generated during graph execution.


    # How to do it...


    The section covers how to visualize TensorFlow models and output in TernsorBoard.


    +   1. To visualize summaries and graphs, data from TensorFlow can be exported
    using the FileWriter command from the summary module. A default session graph
    can be added using the following command:


    ```

    ```

    # Create Writer Obj for log

    log_writer = tf$summary$FileWriter(''c:/log'', sess$graph)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'The graph for logistic regression developed using the preceding code is shown
    in the following screenshot:


    ![](img/88a9c35e3059565190fbb6413f1ca217_63_0.png)


    Visualization of the logistic regression graph in TensorBoard


    Details about symbol descriptions on TensorBoard can be found at https ://www.tensorflow.org/get_started/graph_viz.


    +   2. Similarly, other variable summaries can be added to the TensorBoard using
    correct summaries, as shown in the following code:


    ```

    # Adding histogram summary to weight and bias variable

    w_hist = tf$histogram_summary ("weights", W)

    b_hist = tf$histogram_summary ("biases", b)

    ```


    The summaries can be a very useful way to determine how the model is performing.
    For example, for the preceding case, the cost function for test and train can
    be studied to understand optimization performance and convergence.


    +   3. Create a cross entropy evaluation for test. An example script to generate
