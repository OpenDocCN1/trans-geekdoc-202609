- pgno: 124
  md: "# Data normalization\n\n**Data normalization** is a critical step in machine\
    \ learning to bring data to a similar scale. It is also known as feature scaling\
    \ and is performed as data preprocessing.\n\nThe correct normalization is very\
    \ critical in neural networks, else it will lead to saturation within the hidden\
    \ layers, which in turn leads to zero gradient and no learning will be possible.\n\
    \n# Getting ready\n\nThere are multiple ways to perform normalization:\n\n+  \
    \ **Min-max standardization**: The min-max retains the original distribution and\
    \ scales the feature values between [0, 1], with 0 as the minimum value of the\
    \ feature and 1 as the maximum value. The standardization is performed as follows:\n\
    +   \n+   $$x' = \\frac{x - \\min(x)}{\\max(x) - \\min(x)}$$\n\nHere, $x'$ is\
    \ the normalized value of the feature. The method is sensitive to outliers in\
    \ the dataset.\n\n+   **Decimal scaling**: This form of scaling is used where\
    \ values of different decimal ranges are present. For example, two features with\
    \ different bounds can be brought to a similar scale using decimal scaling as\
    \ follows:\n+   \n+   $x'=x/10^j$\n\n+   **Z-score**: This transformation scales\
    \ the value toward a normal distribution with a zero mean and unit variance. The\
    \ Z-score is computed as:\n+   \n+   $Z=(x-\\mu)/\\sigma$"
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Here, \(\mu\) is the mean and \(\sigma\) is the standard deviation of the feature.
    These distributions are very efficient for a dataset with a Gaussian distribution.


    All the preceding methods are sensitive to outliers; there are other more robust
    approaches for normalization that you can explore, such as **Median Absolute Deviation**
    (**MAD**), tanh-estimator, and double sigmoid.


    # Visualizing dataset distribution


    Let''s look at the distribution of features for the occupation data:


    ```

    > ggpairs (occupancy_train$data[, occupancy_train$xFeatures])

    ```


    ![](img/88a9c35e3059565190fbb6413f1ca217_125_0.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'The figure shows that the features have linear correlations and the distributions
    are non- normal. The non-normality can be further validated using the Shapiro-Wilk
    test, using the `shapiro.test` function from R. Let''s use min-max standardization
    for the occupation data.


    # How to do it...


    +   1. Perform the following operation for data normalization:


    ```

    minmax.normalize<-function(ds, scaler=NULL) {

    if(is.null(scaler)) {

    for(f in ds$xFeatures) {

    scaler[[f]]$minval<-min(ds$data[, f])

    scaler[[f]]$maxval<-max(ds$data[, f])

    ds$data[, f] <- (ds$data[, f] -

    scaler[[f]]$minval) / (scaler[[f]]$maxval-scaler[[f]]$minval)

    }

    ds$scaler <- scaler

    } else {

    for (f in ds$xFeatures) {

    ds$data[, f] <- (ds$data[, f] -

    scaler[[f]]$minval) / (scaler[[f]]$maxval-scaler[[f]]$minval)

    }

    }

    return(ds)

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 127
  md: '2. The minmax.normalize function normalizes the data using min-max normalization.
    When the scaler variable is NULL, it performs normalization using the dataset
    provided, or normalizes using scaler values. The normalized data pair plot is
    shown in the following figure:


    ![](img/88a9c35e3059565190fbb6413f1ca217_127_0.png)


    This figure shows min-max normalization bringing the values within bounds [0,
    1] and it does not change the distribution and correlations between features.


    # # How to set up an autoencoder model


    The next step is to set up the autoencoder model. Let''s set up a vanilla autoencoder
    using TensorFlow:


    +   1. Reset the graph and start InteractiveSession:


    ```

    # Reset the graph and set-up a interactive session

    tf$reset_default_graph()

    sess<-tf$InteractiveSession()

    ```'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 2. Define the input parameter where n and m are the number of samples and
    features, respectively. To build, network m is used to set up the input parameter:


    ```

    ```

    # Network Parameters

    n_hidden_1 = 5 # 1st layer num features

    n_input = length(xFeatures) # Number of input features

    nRow<-nrow(occupancy_train)

    ```

    ```


    When n_hidden_1 is low, the autoencoder is compressing the data and is referred
    to as an under-complete autoencoder; whereas, when n_hidden_1 is large, then the
    autoencoder is sparse and is referred to as an over-complete autoencoder.


    # 3. Define graph input parameters that include the input tensor and layer definitions
    for the encoder and decoder:


    ```

    ```

    # Define input feature

    x <- tf$constant(unlist (occupancy_train[, xFeatures]),

    shape=c(nRow, n_input), dtype=np$float32)

    # Define hidden and bias layer for encoder and decoders

    hiddenLayerEncoder <-tf$Variable (tf$random_normal (shape (n_input,

    n_hidden_1)), dtype=np$float32)

    biasEncoder <- tf$Variable (tf$zeros (shape (n_hidden_1)),

    dtype=np$float32)

    hiddenLayerDecoder<-tf$Variable (tf$random_normal (shape (n_hidden_1,

    n_input)))

    biasDecoder <- tf$Variable (tf$zeros (shape (n_input)))

    ```

    ```


    The preceding script designs a single-layer encoder and decoder.


    # 4. Define a function to evaluate the response:


    ```

    ```

    auto_encoder<-function(x, hiddenLayerEncoder, biasEncoder) {

    x_transform <- tf$nn$sigmoid(tf$add(tf$matmul (x,

    hiddenLayerEncoder), biasEncoder))

    x_transform

    }

    ```

    ```


    The auto_encoder function takes the node bias weights and computes the output.
    The same function can be used for encoder and decoder by passing respective weights.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   5. Create encoder and decoder objects by passing symbolic TensorFlow variables:


    ```

    encoder_obj = auto_encoder(x,hiddenLayerEncoder, biasEncoder)

    y_pred = auto_encoder(encoder_obj, hiddenLayerDecoder, biasDecoder)

    ```


    +   6. The y_pred is the outcome from decoder, which takes the encoder object
    as input with nodes and bias weights:


    ```

    Define loss function and optimizer module.

    learning_rate = 0.01

    cost = tf$reduce_mean(tf$pow(x - y_pred, 2))

    optimizer = tf$train$RMSPropOptimizer(learning_rate)$minimize(cost)

    ```


    The preceding script defines mean square error as the cost function, and uses
    RMSPropOptimizer from TensorFlow with 0.1 learning rate for the optimization of
    weights. The TensorFlow graph for the preceding model is shown in the following
    diagram:


    ![](img/88a9c35e3059565190fbb6413f1ca217_129_0.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Running optimization


    The next step is to run optimizer optimization. Executing this process in TensorFlow

    consists of two steps:


    +   1. The first step is parameter initialization of the variables defined in
    the graph. The

    +   initialization is performed by calling the `global_variables_initializer`

    +   function from TensorFlow:


    ```

    # Initializing the variables

    init = tf$global_variables_initializer()

    sess$run(init)

    ```


    Optimization is performed based on optimizing and monitoring the train and

    test performance:


    ```

    costconvergence<-NULL

    for (step in 1:1000) {

    sess$run(optimizer)

    if (step %% 20==0) {

    costconvergence<-rbind(costconvergence, c(step, sess$run(cost),

    sess$run(costt)))

    cat(step,"-", "Traing Cost ==>", sess$run(cost), "\n")

    }

    }

    ```


    +   2. The cost function from train and test can be observed to understand convergence

    +   of the model, as shown in the following figure:


    ```

    costconvergence<-data.frame(costconvergence)

    colnames(costconvergence)<-c("iter", "train", "test")

    plot(costconvergence[, "iter"], costconvergence[, "train"], type =

    "l", col="blue", xlab = "Iteration", ylab = "MSE")

    lines(costconvergence[, "iter"], costconvergence[, "test"],

    col="red")

    legend(500, 0.25, c("Train","Test"), lty=c(1,1),

    lwd=c(2.5, 2.5),col=c("blue","red"))

    ```'
