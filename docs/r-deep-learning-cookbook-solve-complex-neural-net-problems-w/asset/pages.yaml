    # Building an image classification model


    The recipe focuses on building an image classification model using Transfer Learning.
    It

    will utilize the dataset prepared in the previous recipes and use the Inception-BN

    architecture. The BN in Inception-BN stands for batch normalization. Details of
    the

    Inception model in computer vision can be found in Szegedy et al. (2015).


    # Getting ready


    The section cover''s the prerequisite to set-up a classification model using INCEPTION-BN

    pretrained model.


    +   1. Convert images into .rec file for train and validation.

    +   2. Download the Inception-BN architecture from http://data.dmlc.ml/models/im

    +   agenet/inception-bn/.

    +   3. Install R and the mxnet package in R.'
