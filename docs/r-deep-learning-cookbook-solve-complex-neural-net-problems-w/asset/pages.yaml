- pgno: 135
  md: '# Getting ready


    The preceding diagram demonstrates a stacked autoencoder with two layers. A stacked
    autoencoder can have n layers, where each layer is trained using one layer at
    a time. For example, the previous layer will be trained as follows:


    ![](img/88a9c35e3059565190fbb6413f1ca217_135_0.png)


    Training of a stacked autoencoder


    The initial pre-training of layer 1 is obtained by training it over the actual
    input xi . The first step is to optimize the We(1) layer of the encoder with respect
    to output X. The second step in the preceding example is to optimize the weights
    We(2) in the second layer, using We(1) as input and output. Once all the layers
    of We(i) where i=1, 2, ...,n is number of layers are pretrained, model fine-tuning
    is performed by connecting all the layers together, as shown in step 3 of the
    preceding diagram. The concept can also be applied to denoising to train multilayer
    networks, which is known as a stacked denoising autoencoder. The code developed
    in a denoising autoencoder can be easily tweaked to develop a stacked denoising
    autoencoder, which is an extension of the stacked autoencoder.


    The requirements for this recipe are:


    +   1. R should be installed.

    +   2. SAENET package, The package can be download from Cran using the command
    `install.packages("SAENET")`.'
