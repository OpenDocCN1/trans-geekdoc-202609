- pgno: 132
  md: '# How to do it...


    The code setup for the autoencoder can directly be converted to a regularized
    autoencoder

    by replacing the cost definition with the following lines:


    ```

    Lambda=0.01

    cost = tf$reduce_mean(tf$pow(x - y_pred, 2))

    Regularize_weights = tf$nn$l2_loss(weights)

    cost = tf$reduce_mean(cost + lambda * Regularize_weights)

    ```


    # How it works...


    As mentioned earlier, a regularized autoencoder extends the standard autoencoder
    by

    adding a regularization parameter to the cost function, shown as follows:


    ![](img/88a9c35e3059565190fbb6413f1ca217_132_0.png)


    Here, \(\lambda\) is the regularization parameter and \(i\) and \(j\) are the
    node indexes with \(W\)

    representing the hidden layer weights for the autoencoder. The regularization
    autoencoder

    aims to ensure more robust encoding and prefers a low weight \(h\) function. The
    concept is

    further utilized to develop a contractive autoencoder, which utilizes the Frobenius
    norm of

    the Jacobian matrix on input, represented as follows:


    ![](img/88a9c35e3059565190fbb6413f1ca217_132_1.png)


    where J(x) is the Jacobian matrix and is evaluated as follows:


