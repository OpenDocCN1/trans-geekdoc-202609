    ```


    ```

    # subset features for modeling and transform to numeric values

    occupancy_train<-apply(occupancy_train[, c(xFeatures, yFeatures)], 2,

    FUN=as.numeric)

    occupancy_test<-apply(occupancy_test[, c(xFeatures, yFeatures)], 2,

    FUN=as.numeric)

    ```


    ```

    # Data dimensions

    nFeatures<-length(xFeatures)

    nRow<-nrow(occupancy_train)

    ```


    2. Now load both the network and model parameters. The network parameters define
    the structure of the neural network and the model parameters define its tuning
    criteria. As stated earlier, the neural network is built using two hidden layers,
    each with five neurons. The n_input parameter defines the number of independent
    variables and n_classes defines one fewer than the number of output classes. In
    cases where the output variable is one-hot encoded (one attribute with yes occupancy
    and a second attribute with no occupancy), then n_classes will be 2L (equal to
    the number of one-hot encoded attributes). Among model parameters, the learning
    rate is 0.001 and the number of epochs (or iterations) for model building is 10000:


    ```

    # Network Parameters

    n_hidden_1 = 5L # 1st layer number of features

    n_hidden_2 = 5L # 2nd layer number of features

    n_input = 5L # 5 attributes

    n_classes = 1L # Binary class

    ```


    ```

    # Model Parameters

    ```'
