- pgno: 272
  md: '# # Training a deep learning model on a GPU


    The Graphical processing unit (GPU) is hardware used for rendering images using
    a lot of cores. Pascal is the latest GPU micro architecture released by NVIDIA.
    The presence of hundreds of cores in GPU helps enhance the computation. This section
    provides the recipe for running a deep learning model using GPU.


    # ## Getting ready


    This section provides dependencies required to run GPU and CPU:


    +   1. The experiment performed in this recipe uses GPU hardware such as GTX 1070.

    +   2. Install mxnet for GPU. To install mxnet for GPU for a specified machine,
    follow the installation instruction from mxnet.io. Select the requirement as shown
    in the screenshot, and follow the instructions:


    ![](img/88a9c35e3059565190fbb6413f1ca217_272_0.png)


    Steps to get installation instruction for MXNet'
  merge: -1
  img_proc: true
- pgno: 273
  md: "# How to do it...\n\nHere is how you train a deep learning model on a GPU:\n\
    \n+   1. The Inception-BN-transferred learning recipe discussed in the previous\
    \ section can be made to run on the GPU installed and the configured machine by\
    \ changing the device settings as shown in the following script:\n\n```\n# Mode\
    \ re-train\nmodel <- mx.model.FeedForward.create (\n\tsymbol = new_soft,\n\tX\
    \ = train,\n\teval.data = val,\n\tctx = mx.gpu(0),\n\teval.metric = mx.metric.accuracy,\n\
    \tnum.round = 5,\n\tlearning.rate = 0.05,\n\tmomentum = 0.85,\n\twd = 0.00001,\n\
    \tkvstore = \"local\",\n\tarray.batch.size = 128,\n\tepoch.end.callback = mx.callback.save.checkpoint\
    \ (\"inception_bn\"),\n\tbatch.end.callback = mx.callback.log.train.metric(150),\n\
    \tinitializer = mx.init.Xavier(factor_type = \"in\", magnitude\n= 2.34),\n\toptimizer\
    \ = \"sgd\",\n\targ.params = arg_params_new,\n\taux.params = inception_bn$aux.params\n\
    )\n```\n\nIn the aforementioned model, the device setting is changed from mx.cpu\
    \ to mx.gpu. The CPU for five iteration tools takes ~2 hours of computational\
    \ effort, whereas the same iteration is completed in ~15 min with GPU.\n\n# Comparing\
    \ performance using CPU and GPU\n\nOne of the questions with device change is\
    \ why so much improvement is observed when the device is switched from CPU to\
    \ GPU. As the deep learning architecture involves a lot of matrix computations,\
    \ GPUs help expedite these computations using a lot of parallel cores, which are\
    \ usually used for image rendering."
  merge: -1
  img_proc: true
- pgno: 274
  md: "The power of GPU has been utilized by a lot of algorithms to accelerate the\
    \ execution. The following recipe provides some benchmarks of matrix computation\
    \ using the `gpuR` package. The `gpuR` package is a general-purpose package for\
    \ GPU computing in R.\n\n# # Getting ready\n\nThe section covers requirement to\
    \ set-up a comparison between GPU Vs CPU.\n\n+   1. Use GPU hardware installed\
    \ such as GTX 1070.\n+   2. CUDA toolkit installation using URL https://developer.nvidia.com/cuda-downloads.\n\
    +   3. Install the `gpuR` package:\n+      \n+      ```r\n+      install.packages(\"\
    gpuR\")\n+      ```\n+   4. Test `gpuR`:\n+      \n+      ```r\n+      library(gpuR)\n\
    +      # verify you have valid GPUs\n+      detectGPUs()\n+      ```\n\n# # How\
    \ to do it...\n\nLet's get started by loading the packages:\n\n+   1. Load the\
    \ package, and set the precision to `float` (by default, the GPU precision is\
    \ set to a single digit):\n+      \n+      ```r\n+      library(\"gpuR\")\n+ \
    \     options(gpuR.default.type = \"float\")\n+      ```\n+   2. Matrix assignment\
    \ to GPU:\n+      \n+      ```r\n+      # Assigning a matrix to GPU\n+      A<-matrix(rnorm(1000),\
    \ nrow=10)\n+      vcl1 = vclMatrix(A)\n+      ```"
  merge: -1
  img_proc: true
- pgno: 275
  md: "The output of the preceding command will contain details of the object. An\
    \ illustration is shown in the following script:\n\n```\n> vc11\nAn object of\
    \ class \"fvclMatrix\"\nSlot \"address\":\n<pointer: 0x0000000001822e180>\n\n\
    Slot \".context_index\":\n[1] 1\n\nSlot \".platform_index\":\n[1] 1\n\nSlot \"\
    .platform\":\n[1] \"Intel(R) OpenCL\"\n\nSlot \".device_index\":\n[1] 1\n\nSlot\
    \ \".device\":\n[1] \"Intel(R) HD Graphics 530\"\n```\n\n3. Let's consider the\
    \ evaluation of CPU vs GPU. As most of the deep learning will be using GPUs for\
    \ matrix computation, the performance is evaluated by matrix multiplication using\
    \ the following script:\n\n```\n# CPU vs GPU performance\nDF <- data.frame()\n\
    evalSeq<-seq(1,2501,500)\nfor (dimpower in evalSeq){\n  print(dimpower)\n  Mat1\
    \ = matrix(rnorm(dimpower^2), nrow=dimpower)\n  Mat2 = matrix(rnorm(dimpower^2),\
    \ nrow=dimpower)\n  now = Sys.time()\n  Matfin = Mat1*%*Mat2\n  cpu <- Sys.time()-now\n\
    \  now <- Sys.time()\n  vc11 = vclMatrix(Mat1)\n  vc12 = vclMatrix(Mat2)\n  vc1C\
    \ = vc11 *%* vc12\n  gpu <- Sys.time()-now\n  DF <- rbind(DF,c(nrow(Mat1), cpu,\
    \ gpu))\n}\nDF<-data.frame(DF)\ncolnames(DF) <- c(\"nrow\", \"CPU_time\", \"gpu_time\"\
    )\n```"
  merge: -1
  img_proc: true
- pgno: 276
  md: 'The preceding script computes the matrix multiplication using CPU and GPU;
    the time is stored for different dimensions of the matrix. The output from the
    preceding script is shown in the following diagram:


    ![](img/88a9c35e3059565190fbb6413f1ca217_276_0.png)


    Comparison between CPU and GPU


    The graph shows that the computation effort required by CPUs increases exponentially
    with the CPU. Thus, GPUs help expedite it drastically.


    # There''s more...


    The GPUs are new arena in machine learning computing, and a lot of packages have
    been developed in R to access GPUs while keeping you in a familiar R environment
    such as `gputools`, `gmatrix`, and `gpuR`. The other algorithms are also developed
    and implemented while accessing GPUs to enhance their computational power such
    as `RPUSVM`, which implements SVM using GPUs. Thus, the topic requires a lot of
    creativity with some exploration to deploy algorithms while utilizes full capability
    of hardware.


    # See also


    To learn more on parallel computing using R, go through *Mastering Parallel Programming
    with R* by Simon R. Chapple et al. (2016).'
  merge: -1
  img_proc: true
