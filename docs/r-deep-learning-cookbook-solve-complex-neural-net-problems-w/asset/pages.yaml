  md: '# # Setting up a Restricted Boltzmann machine for Bernoulli distribution input


    In this section, let''s set up a restricted Boltzmann machine for Bernoulli distributed
    input data, where each attribute has values ranging from 0 to 1 (equivalent to
    a probability distribution). The dataset (MNIST) used in this recipe has input
    data satisfying a Bernoulli distribution.


    An RBM comprises of two layers: a visible layer and a hidden layer. The visible
    layer is an input layer of nodes equal to the number of input attributes. In our
    case, each image in the MNIST dataset is defined using 784 pixels (28 x 28 size).
    Hence, our visible layer will have 784 nodes.


    On the other hand, the hidden layer is generally user-defined. The hidden layer
    has a set of binary activated nodes, with each node having a probability of linkage
    with all other visible nodes. In our case, the hidden layer will have 900 nodes.
    As an initial step, all the nodes in the visible layer are connected with all
    the nodes in the hidden layer bidirectionally.


    Each connection is defined using a weight, and hence a weight matrix is defined
    where the rows represent the number of input nodes and the columns represent the
    number of hidden nodes. In our case, the weight matrix (w) will be a tensor of
    dimensions 784 x 900.


    In addition to weights, all the nodes in each layer are assisted by a bias node.
    The bias node of the visible layer will have connections with all the visible
    nodes (that is, the 784 nodes) and is represented with vb, whereas the bias node
    of the hidden layer will have connections with all the hidden nodes (that is,
    the 900 nodes) and is represented as vh.


    ![](img/88a9c35e3059565190fbb6413f1ca217_165_0.png)


    A point to remember with RBMs is that there will be no connections among nodes
    within each layer. In other words, the connections will be interlayer, but not
    intralayer.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'The following image represents an RBM with the visible layer, hidden layer,
    and interconnections:


    ![](img/88a9c35e3059565190fbb6413f1ca217_166_0.png)


    # # Getting ready


    This section provides the requirements for setting up an RBM.


    +   - TensorFlow in R is installed and set up

    +   - The mnist data is downloaded and loaded for setting up RBM


    # # How to do it...


    This section provides the steps to set up the visible and hidden layers of an
    RBM using TensorFlow:


    +   1. Start a new interactive TensorFlow session:


    ```

    ```

    # Reset the graph

    tf$reset_default_graph()

    # Starting session as interactive session

    sess <- tf$InteractiveSession()

    ```

    ```


    +   2. Define the model parameters. The num_input parameter defines the number
    of nodes in the visible layer and num_hidden defines the number of nodes in the
    hidden layer:


    ```

    ```

    num_input<-784L

    num_hidden<-900L

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: '3. Create a placeholder variable for the weight matrix:

    ```

    W <- tf$placeholder(tf$float32, shape = shape(num_input,

    num_hidden))

    ```


    4. Create placeholder variables of the visible and hidden biases:

    ```

    vb <- tf$placeholder(tf$float32, shape = shape(num_input))

    hb <- tf$placeholder(tf$float32, shape = shape(num_hidden))

    ```


    # # Training a Restricted Boltzmann machine


    Every training step of an RBM goes through two phases: the forward phase and the
    backward phase (or reconstruction phase). The reconstruction of visible units
    is fine tuned by making several iterations of the forward and backward phases.


    **Training a forward phase:** In the forward phase, the input data is passed from
    the visible layer to the hidden layer and all the computation occurs within the
    nodes of the hidden layer. The computation is essentially to take a stochastic
    decision of each connection from the visible to the hidden layer. In the hidden
    layer, the input data (X) is multiplied by the weight matrix (W) and added to
    a hidden bias vector (hb).


    The resultant vector of a size equal to the number of hidden nodes is then passed
    through a sigmoid function to determine each hidden node’s output (or activation
    state). In our case, each input digit will produce a tensor vector of 900 probabilities,
    and as we have 55,000 input digits, we will have an activation matrix of the size
    55,000 x 900. Using the hidden layer’s probability distribution matrix, we can
    generate samples of activation vectors that can be used later to estimate negative
    phase gradients.


    # # Getting ready


    This section provides the requirements for setting up an RBM.


    +   - TensorFlow in R is installed and set up

    +   - The mnist data is downloaded and loaded for setting up the RBM

    +   - The RBM model is set up as described in the recipe Setting up a Restricted
    Boltzmann machine for Bernoulli distribution input'
