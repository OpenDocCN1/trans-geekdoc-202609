  md: '# # Getting Started


    In this chapter, we will cover the following topics:


    +   • Installing R with an IDE

    +   • Installing a Jupyter Notebook application

    +   • Starting with the basics of machine learning in R

    +   • Setting up deep learning tools/packages in R

    +   • Installing MXNet in R

    +   • Installing TensorFlow in R

    +   • Installing H2O in R

    +   • Installing all three packages at once using Docker


    # ## Introduction


    This chapter will get you started with deep learning and help you set up your
    systems to develop deep learning models. The chapter is more focused on giving
    the audience a heads-up on what is expected from the book and the prerequisites
    required to go through the book. The current book is intended for students or
    professionals who want to quickly build a background in the applications of deep
    learning. The book will be more practical and application-focused using R as a
    tool to build deep learning models.


    > > For a detailed theory on deep learning, refer to Deep Learning by Goodfellow
    et al. 2016. For a machine learning background refer Python Machine Learning by
    S. Raschka, 2015.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'We will use the R programming language to demonstrate applications of deep
    learning. You are expected to have the following prerequisites throughout the
    book:


    +   - Basic R programming knowledge

    +   - Basic understanding of Linux; we will use the Ubuntu (16.04) operating system

    +   - Basic understanding of machine learning concepts

    +   - For Windows or macOS, a basic understanding of Docker


    # # Installing R with an IDE


    Before we begin, let''s install an IDE for R. For R the most popular IDEs are
    Rstudio and Jupyter. Rstudio is dedicated to R whereas Jupyter provide multi-language
    support including R. Jupyter also provides an interactive environment and allow
    you to combine code, text, and graphics into a single notebook.


    # # Getting ready


    R supports multiple operating systems such as Windows, macOS X, and Linux. The
    installation files for R can be downloaded from any one of the mirror sites at
    Comprehensive R Archive Network (CRAN) at https://cran.r-project.org/. The CRAN
    is also a major repository for packages in R. The programming language R is available
    under both 32-bit and 64-bit architectures.'
  merge: -1
  img_proc: true
