- pgno: 269
  md: '# How to do it...


    1. Load the .rec file as iterators. The following is the function to load the
    .rec data as iterators:


    ```

    # Function to load data as iterators

    data.iterator <- function(data.shape, train.data, val.data,

    BATCHSIZE = 128) {

    # Load training data as iterator

    train <- mx.io.ImageRecordIter(

    path.imgrec = train.data,

    batch.size = BATCHSIZE,

    data.shape = data.shape,

    rand.crop = TRUE,

    rand.mirror = TRUE)

    # Load validation data as iterator

    val <- mx.io.ImageRecordIter(

    path.imgrec = val.data,

    batch.size = BATCHSIZE,

    data.shape = data.shape,

    rand.crop = FALSE,

    rand.mirror = FALSE

    )

    return(list(train = train, val = val))

    }

    ```


    In the preceding function, mx.io.ImageRecordIter reads batches of images from
    the RecordIO (.rec) files.


    2. Load data using the data.iterator function:


    ```

    # Load dataset

    data <- data.iterator(data.shape = c(224, 224, 3),

    train.data = "pks.lst_train.rec",

    val.data = "pks.lst_val.rec",

    BATCHSIZE = 8)


    train <- data$train

    val <- data$val

    ```


    3. Load the Inception-BN pretrained model from the Inception-BN folder:


    ```

    # Load Inception-BN model

    inception_bn <- mx.model.load("Inception-BN", iteration = 126)

    symbol <- inception_bn$symbol

    ```


    The different layers of the model can be viewed using function symbol$arguments'
  merge: -1
  img_proc: true
- pgno: 270
  md: "# 4. Get the layers of the Inception-BN model:\n\n```\n# Load model information\n\
    internals <- symbol$get.internals()\noutputs <- internals$outputs\nflatten <-\
    \ internals$get.output(which(outputs == \"flatten_output\"))\n```\n\n# 5. Define\
    \ a new layer to replace the flatten_output layer:\n\n```\n# Define new layer\n\
    new_fc <- mx.symbol.FullyConnected(data = flatten,\n                         \
    \                    num_hidden = 2,\n                                       \
    \      name = \"fc1\")\nnew_soft <- mx.symbol.SoftmaxOutput(data = new_fc,\n \
    \                                            name = \"softmax\")\n```\n\n# 6.\
    \ Initialize weights for the newly defined layer. To retrain the last layer, weight\
    \ initialization is performed using the following script:\n\n```\n# Re-initialize\
    \ the weights for new layer\narg_params_new <- mxnet:::mx.model.init.params (\n\
    \  symbol = new_soft,\n  input.shape = c(224, 224, 3, 8),\n  output.shape = NULL,\n\
    \  initializer = mxnet:::mx.init.uniform(0.2),\n  ctx = mx.cpu(0)\n)$arg.params\n\
    fc1_weights_new <- arg_params_new[[\"fc1_weight\"]]\nfc1_bias_new <- arg_params_new[[\"\
    fc1_bias\"]]\n```\n\nIn the aforementioned layer, weights are assigned using uniform\
    \ distribution between [-0.2, 0.2]. The ctx define the device on which the execution\
    \ is to be performed.\n\n# 7. Retrain the model:\n\n```\n# Mode re-train\nmodel\
    \ <- mx.model.FeedForward.create (\n  symbol = new_soft,\n  X = train,\n  eval.data\
    \ = val,\n  ctx = mx.cpu(0),\n  eval.metric = mx.metric.accuracy,\n  num.round\
    \ = 5,\n  learning.rate = 0.05,\n  momentum = 0.85,\n  wd = 0.00001,\n)\n```"
  merge: -1
  img_proc: true
