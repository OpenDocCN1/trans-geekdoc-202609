    np <- import("numpy")

    ```


    +   2. Reset or remove any existing default_graph:


    ```

    tf$reset_default_graph()

    ```


    +   3. Start an InteractiveSession:


    ```

    sess <- tf$InteractiveSession()

    ```


    +   4. Initialize the global_variables:


