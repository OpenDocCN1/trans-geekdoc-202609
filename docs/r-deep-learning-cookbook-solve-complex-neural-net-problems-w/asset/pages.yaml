- pgno: 17
  md: '# Preface


    Deep learning is one of the most commonly discussed areas in machine learning
    due to its ability to model complex functions and learn through a variety of data
    sources and structures, such as cross-sectional data, sequential data, images,
    text, audio, and video. Also, R is one of the most popular languages used in the
    data science community. With the growth of deep learning, the relationship between
    R and deep learning is growing tremendously. Thus, Deep Learning Cookbook in R
    aims to provide a crash course in building different deep learning models. The
    application of deep learning is demonstrated through structured, unstructured,
    image, and audio case studies. The book will also cover transfer learning and
    how to utilize the power of GPU to enhance the computation efficiency of the deep
    learning model.


    # What this book covers


    *Chapter 1, Getting Started,* introduces different packages that are available
    for building deep learning models, such as TensorFlow, MXNet, and H2O. and how
    to set them up to be utilized later in the book.


    *Chapter 2, Deep Learning with R,* introduces the basics of neural network and
    deep learning. This chapter covers multiple recipes for building a neural network
    models using multiple toolboxes in R.


    *Chapter 3, Convolution Neural Network,* covers recipes on **Convolution Neural
    Networks** (CNN) through applications in image processing and classification.


    *Chapter 4, Data Representation Using Autoencoders,* builds the foundation of
    autoencoder using multiple recipes and also covers the application in data compression
    and denoising.


    *Chapter 5, Generative Models in Deep learning,* extends the concept of autoencoders
    to generative models and covers recipes such as Boltzman machines, **restricted
    Boltzman machines** (RBMs), and deep belief networks.


    *Chapter 6, Recurrent Neural Networks,* sets up the foundation for building machine
    learning models on a sequential datasets using multiple **recurrent neural networks**
    (RNNs).


    *Chapter 7, Reinforcement Leaning,* provides the fundamentals for building reinforcement
    learning using **Markov Decision Process** (MDP) and covers both model-based learning
    and model-free learning.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chapter 8, Application of Deep Learning in Text-Mining, provides an end-to-end
    implementation of the deep learning text mining domain.


    Chapter 9, Application of Deep Learning to Signal processing, covers a detailed
    case study of deep learning in the signal processing domain.


    Chapter 10, Transfer Learning, covers recipes for using pretrained models such
    as VGG16 and Inception and explains how to deploy a deep learning model using
    GPU.


    # What you need for this book


    A lot of inquisitiveness, perseverance, and passion is required to build a strong
    background in data science. The scope of deep learning is quite broad; thus, the
    following backgrounds is required to effectively utilize this cookbook:


    +   - Basics of machine learning and data analysis

    +   - Proficiency in R programming

    +   - Basics of Python and Docker


    Lastly, you need to appreciate deep learning algorithms and know how they solve
    complex problems in multiple domains.


    # Who this book is for


    This book is for data science professionals or analysts who have performed machine
    learning tasks and now want to explore deep learning and want a quick reference
    that address the pain points that crop up while implementing deep learning. Those
    who wish to have an edge over other deep learning professionals will find this
    book quite useful.


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: “We
    can include other contexts through the use of the include directive.”'
  merge: -1
  img_proc: true
