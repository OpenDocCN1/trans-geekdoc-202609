  md: "# Setting up a Deep Restricted Boltzmann Machine\n\nUnlike DBNs, **Deep Restricted\
    \ Boltzmann Machines (DRBM)** are undirected networks of interconnected hidden\
    \ layers with the capability to learn joint probabilities over these connections.\
    \ In the current setup, centering is performed where visible and hidden variables\
    \ are subtracted from offset bias vectors after every iteration. Research has\
    \ shown that centering optimizes the performance of DRBMs and can reach higher\
    \ log-likelihood values in comparison with traditional RBMs.\n\n# Getting ready\n\
    \nThis section provides the requirements for setting up a DRBM:\n\n+   - The MNIST\
    \ dataset is loaded and set up\n+   - The tensorflow package is set up and loaded\n\
    \n# How to do it...\n\nThis section covers detailed the steps for setting up the\
    \ DRBM model using TensorFlow in R:\n\n+   1. Define the parameters for the DRBM:\n\
    +   \n+   ```\n+   learning_rate = 0.005\n+   momentum = 0.005\n+   minbatch_size\
    \ = 25\n+   hidden_layers = c(400,100)\n+   biases = list(-1,-1)\n+   ```\n\n\
    +   2. Define a sigmoid function using a hyperbolic arc tangent [(log(1+x)-log(1-x))/2]:\n\
    +   \n+   ```\n+   arcsigm <- function(x) {\n+   return (atanh ( (2*x)-1 )*2)\n\
    +   }\n+   ```\n\n+   3. Define a sigmoid function using only a hyperbolic tangent\
    \ [(e^x-e^-x)/(e^x+e^x)]:\n\n```\nsigm <- function(x) {\nreturn (tanh ( (x/2)\
    \ +1 )/ 2)\n}\n```"
