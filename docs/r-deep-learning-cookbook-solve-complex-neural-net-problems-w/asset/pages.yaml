  md: 'The Q learning returns a 2D Q-table of the size of the number of states x the
    number of actions. The values in the Q-table are updated based on the following
    formula, where Q denotes the value of state s and action a, r’ denotes the reward
    of the next state for a selected action a, γ denotes the discount factor, and
    α denotes the learning rate:


    ```

    Q_{new}(s,a) = Q_{old}(s,a)

    + \alpha [r'' + \gamma * \max_{a''} Q_{expected optimal value}(s'',a'') - Q_{old}(s,a)]

    ```


    The framework for Q-learning is shown in the following figure:


    ![](img/88a9c35e3059565190fbb6413f1ca217_230_0.png)


    Framework of Q-learning'
