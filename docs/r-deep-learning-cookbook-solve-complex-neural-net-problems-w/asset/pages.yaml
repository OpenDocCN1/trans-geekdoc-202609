- pgno: 39
  md: 'An example TensorFlow graph for logistic regression scoring is shown in the
    following diagram:


    ![](img/88a9c35e3059565190fbb6413f1ca217_39_0.png)


    TensorFlow graph for logistic regression


    The preceding figure illustrates the TensorFlow graph to score logistic regression
    with optimized weights:


    y = \frac{1}{1 + e^{-(\beta X + C)}}


    The MatMul node performs matrix multiplication between input feature matrix X
    and optimized weight \beta. The constant C is then added to the output from the
    MatMul node. The output from Add is then transformed using the Sigmoid function
    to output Pr(y=1|X).


    # See also


    Get started with TensorFlow in R using resources at https://rstudio.github.io/tensorflow/low/.'
