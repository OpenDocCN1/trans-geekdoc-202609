- pgno: 245
  md: "# How it works...\n\nAs mentioned earlier, one can observe that the tf-idf\
    \ scores of very common words such as *the* are close to zero and those of fewer\
    \ occurrence words such as the proper noun *Austen* is close to one.\n\n# Performing\
    \ sentiment prediction using LSTM network\n\nIn this section, we will use LSTM\
    \ networks to perform sentiment analysis. Along with the word itself, the LSTM\
    \ network also accounts for the sequence using recurrent connections, which makes\
    \ it more accurate than a traditional feed-forward neural network.\n\nHere, we\
    \ shall use the `movie reviews` dataset `text2vec` from the `cran` package. This\
    \ dataset consists of 5,000 IMDb movie reviews, where each review is tagged with\
    \ a binary sentiment flag (positive or negative).\n\n# How to do it...\n\nHere\
    \ is how you can proceed with sentiment prediction using LSTM:\n\n+   1. Load\
    \ the required packages and movie reviews dataset:\n\n```\nload_packages=c(\"\
    text2vec\",\"tidytext\",\"tensorflow\")\nlapply(load_packages, require, character.only\
    \ = TRUE)\ndata(\"movie_review\")\n```\n\n+   2. Extract the movie reviews and\
    \ labels as a dataframe and matrix respectively. In movie reviews, add an additional\
    \ attribute \"Sno\" denoting the review number. In the labels matrix, add an additional\
    \ attribute related to negative flag.\n\n```\nreviews <- data.frame(\"Sno\" =\
    \ 1:nrow(movie_review),\n                     \"text\"=movie_review$review,\n\
    \                     stringsAsFactors=F)\n```\n\n```\nlabels <- as.matrix(data.frame(\"\
    Positive_flag\" =\n                               movie_review$sentiment,\"negative_flag\"\
    \ = (1\n                               movie_review$sentiment))))\n```"
  merge: -1
  img_proc: true
- pgno: 246
  md: '3. Extract all the unique words across the reviews, and get their count of
    occurrences (n). Also, tag each word with a unique integer (orderNo). Thus, each
    word is encoded using a unique integer, which shall be later used in the LSTM
    network.


    ```

    reviews_sortedWords <- reviews %>% unnest_tokens(word,text) %>%

    dplyr::count (word, sort = TRUE)

    reviews_sortedWords$orderNo <- 1:nrow(reviews_sortedWords)

    reviews_sortedWords <- as.data.frame(reviews_sortedWords)

    ```


    4. Now, assign the tagged words back to the reviews based on their occurrences:


    ```

    reviews_words <- reviews %>% unnest_tokens (word,text)

    reviews_words <-

    plyr::join(reviews_words,reviews_sortedWords,by="word")

    ```


    5. Using the outcome of step 4, create a list of reviews with each review transformed
    into a set of encoded numbers representing those words:


    ```

    reviews_words_sno <- list ()

    for(i in 1:length(reviews$text))

    {

    reviews_words_sno[[i]] <- c (subset(reviews_words,Sno==i,orderNo))

    }

    ```


    6. In order to facilitate equal-length sequences to the LSTM network, let''s restrict
    the review length to 150 words. In other words, reviews longer than 150 words
    will be truncated to the first 150, whereas shorter reviews will be made 150 words
    long by prefixing with the required number of zeroes. Thus, we now add in a new
    word 0.


    ```

    reviews_words_sno <- lapply(reviews_words_sno,function(x)

    {

    x <- x$OrderNo

    if(length(x)>150)

    {

    return (x[1:150])

    }

    else

    {

    return (c(rep (0,150-length(x) ),x))

    }

    })

    ```'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   7. Now split the 5,000 reviews into training and testing reviews using
    a 70:30 split ratio. Also, bind the list of train and test reviews row wise into
    a matrix format, with rows representing reviews and columns representing the position
    of a word:


    ```

    train_samples <-

    caret::createDataPartition(c(1:length(labels[1,])),p =

    0.7)$Resample1

    train_reviews <- reviews_words_sno[train_samples]

    test_reviews <- reviews_words_sno[-train_samples]

    train_reviews <- do.call(rbind,train_reviews)

    test_reviews <- do.call(rbind,test_reviews)

    ```


    +   8. Similarly, also split the labels into train and test accordingly:


    ```

    train_labels <- as.matrix(labels[train_samples,])

    test_labels <- as.matrix(labels[-train_samples,])

