- pgno: 94
  md: "# # Getting ready\n\nWeights and biases are model coefficients which need to\
    \ be initialized before model compilation. This steps require the `shape` parameter\
    \ to be determined based on input dataset.\n\n# # How to do it...\n\n+   1. The\
    \ following function is used to return randomly initialized weights:\n\n```\n\
    # Weight Initialization\nweight_variable <- function(shape) {\n  initial <- tf$truncated_normal(shape,\
    \ stddev=0.1)\n  tf$Variable(initial)\n}\n```\n\n+   2. The following function\
    \ is used to return constant biases:\n\n```\nbias_variable <- function(shape)\
    \ {\n  initial <- tf$constant(0.1, shape=shape)\n  tf$Variable(initial)\n}\n```\n\
    \n# # How it works...\n\nThese functions return TensorFlow variables that are\
    \ later used as part of a Tensorflow graph. The `shape` is defined as a list of\
    \ attributes defining a filter in the convolution layer, which is covered in the\
    \ next recipe. The weights are randomly initialized with a standard deviation\
    \ equal to `0.1` and biases are initialized with a constant value of `0.1`.\n\n\
    # # Using functions to create a new convolution layer\n\nCreating a convolution\
    \ layer is the primary step in a CNN TensorFlow computational graph. This function\
    \ is primarily used to define the mathematical formulas in the TensorFlow graph,\
    \ which is later used in actual computation during optimization."
