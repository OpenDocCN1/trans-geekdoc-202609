  md: '```

    learning_rate = 0.001

    training_epochs = 10000

    ```


    3. The next step in TensorFlow is to set up a graph to run the optimization. Before
    setting up the graph, let''s reset the graph using the following command:


    ```

    # Reset the graph

    tf$reset_default_graph()

    ```


    4. Additionally, let''s start an interactive session as it will allow us to execute
    variables without referring to the session-to-session object:


    ```

    # Starting session as interactive session

    sess<-tf$InteractiveSession()

    ```


    5. The following script defines the graph input (x for independent variables and
    y for dependent variable). The input feature x is defined as a constant as it
    will be input to the system. Similarly, the output feature y is also defined as
    a constant with the float32 type:


    ```

    # Graph input

    x = tf$constant(unlist(occupancy_train[,xFeatures]), shape=c(nRow, n_input), dtype=np$float32)

    y = tf$constant(unlist(occupancy_train[,yFeatures]), dtype="float32", shape=c(nRow,
    1L))

    ```


    6. Now, let''s create a multilayer perceptron with two hidden layers. Both the
    hidden layers are built using the ReLU activation function and the output layer
