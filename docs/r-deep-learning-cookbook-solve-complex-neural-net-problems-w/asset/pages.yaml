    ungroup(),

    Pride_Prejudice_chapters %>%

    semi_join (bingPOS, by="word") %>%

    group_by(book, chapter) %>%

    dplyr::summarize(pos_words = n()) %>%

    left_join (wordcounts, by = c("book", "chapter")) %>%

    mutate(pos_ratio = round(pos_words*100/words,2)) %>%

    filter(chapter != 0) %>%

    ungroup() )

