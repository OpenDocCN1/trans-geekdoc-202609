- pgno: 208
  md: '# How it works...


    Any changes to the structure require model retraining. However, these assumptions
    may not be valid for a lot of sequential datasets, such as text-based classifications
    that may have varying input and output. RNN architecture helps to address the
    issue of variable input length.


    The standard architecture for RNN with input and output is shown in the following
    figure:


    ![](img/88a9c35e3059565190fbb6413f1ca217_208_0.png)


    Recurrent Neural Network architecture


    The RNN architecture can be formulated as follows:


    ```

    \mathbf{h}_t = f(\mathbf{h}_{t-1}, x_t ; S, W)

    ```


    Where $h_t$ is state at time/index $t$ and $x_t$ is input at time/index $t$. The
    matrix $W$ represents weights to connect hidden nodes and $S$ connects input with
    the hidden layer. The output node at time/index $t$ is related to state $h_t$,
    as shown as follows:


    ```

    \mathbf{y}_t = f(\mathbf{h}_t ; \mathbf{V})

    ```


    In the previous Equations layer, weights remain constant across state and time.'
  merge: -1
  img_proc: true
