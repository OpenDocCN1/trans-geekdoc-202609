  img_proc: true
- pgno: 235
  md: '# # How to do it...


    Here is how we go about preprocessing:


    +   1. Load the required packages:


    ```

    load_packages=c("janeaustenr","tidytext","dplyr","stringr","ggplot2","wordcloud","reshape2","igraph","ggraph","widyr","tidyr")

    lapply(load_packages, require, character.only = TRUE)

    ```


    +   2. Load the Pride and Prejudice dataset. The line_num attribute is analogous
    to the line number printed in the book:


    ```

    Pride_Prejudice <- data.frame("text" = prideprejudice,

    "book" = "Pride and Prejudice",

    "line_num" =

    1:length(prideprejudice),

    stringsAsFactors=F)

    ```


    +   3. Now, perform tokenization to restructure the one-string-per-row format
    to a one-token-per-row format. Here, the token can refer to a single word, a group
    of characters, co-occurring words (n-grams), sentences, paragraphs, and so on.
    Currently, we will tokenize sentence into singular words:


    ```

    Pride_Prejudice <- Pride_Prejudice %>% unnest_tokens (word,text)

    ```


    +   4. Then, remove the commonly occurring words such as the, and, for, and so
    on using the stop words removal corpus:


    ```

    data(stop_words)

    Pride_Prejudice <- Pride_Prejudice %>% anti_join(stop_words,

    by="word")

    ```


    +   5. Extract the most common textual words used:


    ```

    most.common <- Pride_Prejudice %>% dplyr::count(word, sort = TRUE)

    ```'
