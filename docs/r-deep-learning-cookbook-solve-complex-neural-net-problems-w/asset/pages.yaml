  md: '# Application of Deep Learning in Text Mining


    The current chapter we will cover the following topics:


    +   - Performing preprocessing of textual data and extraction of sentiments

    +   - Analyzing documents using tf-idf

    +   - Performing sentiment prediction using LSTM network

    +   - Application using text2vec examples


    # Performing preprocessing of textual data and extraction of sentiments


    In this section, we will use Jane Austen''s bestselling novel Pride and Prejudice,
    published in 1813, for our textual data preprocessing analysis. In R, we will
    use the tidytext package by Hadley Wickham to perform tokenization, stop word
    removal, sentiment extraction using predefined sentiment lexicons, term frequency
    - inverse document frequency (tf-idf) matrix creation, and to understand pairwise
    correlations among n-grams.


    In this section, instead of storing text as a string or a corpus or a document
    term matrix (DTM), we process them into a tabular format of one token per row.'
