- pgno: 253
  md: '# # Application of Deep Learning to Signal processing


    The current chapter will present a case study of creating new music notes using
    generative modeling techniques such as RBM. In this chapter, we will cover the
    following topics:


    +   * Introducing and preprocessing music MIDI files

    +   * Building an RBM model

    +   * Generating new music notes


    # ## Introducing and preprocessing music MIDI files


    In this recipe, we will read a repository of Musical Instrument Digital Interface
    (MIDI) files and preprocess them into a suitable format for an RBM. MIDI is one
    of the formats of storing musical notes, which can be converted to other formats
    such as .wav, .mp3, .mp4, and so on. MIDI file formats store various kinds of
    events such as Note-on, Note-off, Tempo, Time Signature, End of track, and so
    on. However, we will primarily be focusing on the type of note--when it was turned
    on, and when it was turned off.


    Each song is encoded into a binary matrix, where rows represent time, and columns
    represent both turned on and turned off notes. At each time, a note is turned
    on and the same note is turned off. Suppose that, out of n notes, note i is turned
    on and turned off at time j, then positions Mji = 1 and Mj(n+i) = 1, and the rest
    Mj = 0.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'All the rows together form a song. Currently, in this chapter, we will be leveraging
    Python codes to encode MIDI songs into binary matrices, which can later be used
    in a Restricted Boltzmann Machine (RBM).


    # Getting ready


    Let''s look at the prerequisites to preprocess MIDI files:


    +   1. Download the MIDI song repository:

    +   https://github.com/dshieble/Music_RBM/tree/master/Pop_Music_Midi

    +   2. Download the Python codes to manipulate MIDI songs:

    +   https://github.com/dshieble/Music_RBM/blob/master/midi_manipulation.py

    +   3. Install the "reticulate" package, which provides the R interface to Python:

    +   Install.packages ("reticulate")

    +   4. Import Python libraries:


    ```

    use_condaenv ("python27")

    midi <-

    import_from_path ("midi",path="C:/ProgramData/Anaconda2/Lib/site-packages")

    np <- import ("numpy")

