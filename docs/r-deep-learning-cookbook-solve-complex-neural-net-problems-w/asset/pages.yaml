  md: 'The RL is reward-based learning where the reward comes at the end or is distributed
    during the learning. For example, in chess, the reward will be assigned to winning
    or losing the game whereas in games such as tennis, every point won is a reward.
    Some of the commercial examples of RL are DeepMind from Google uses RL to master
    parkour. Similarly, Tesla is developing AI-driven technology using RL. An example
    of reinforcement architecture is shown in the following figure:


    ![](img/88a9c35e3059565190fbb6413f1ca217_219_0.png)


    Interaction of an agent with environment in Reinforcement Learning


    The basic notations for RL are as follows:


    +   - T(s, a, s''): Represents the transition model for reaching state s'' when
    action a is taken at state s

    +   - P: Represents a policy which defines what action to take at every possible
    state s ∈ S

    +   - R(s): Denotes the reward received by agent at state s


    The current chapter will look at how to set up reinforcement models using R. The
    next sub-section will introduce MDPtoolbox from R.'
