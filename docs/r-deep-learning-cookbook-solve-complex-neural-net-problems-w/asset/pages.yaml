- pgno: 40
  md: '# # Installing H2O in R


    H2O is another very popular open source library to build machine learning models.
    It is produced by H2O.ai and supports multiple languages including R and Python.
    The H2O package is a multipurpose machine learning library developed for a distributed
    environment to run algorithms on big data.


    # ## Getting ready


    To set up H2O, the following systems are required:


    +   - 64-bit Java Runtime Environment (version 1.6 or later)

    +   - Minimum 2 GB RAM


    H2O from R can be called using the h2o package. The h2o package has the following
    dependencies:


    +   - RCurl

    +   - rjson

    +   - statmod

    +   - survival

    +   - stats

    +   - tools

    +   - utils

    +   - methods


    For machines that do not have curl-config installed, the RCurl dependency installation
    will fail in R and curl-config needs to be installed outside R.


    # ## How to do it...


    +   1. H2O can be installed directly from CRAN with the dependency parameter TRUE
    to install all CRAN-related h2o dependencies. This command will install all the
    R dependencies required for the h2o package:


    ```

    install.packages("h2o", dependencies = T)

