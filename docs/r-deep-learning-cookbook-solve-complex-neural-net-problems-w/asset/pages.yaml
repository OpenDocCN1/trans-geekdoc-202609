  md: 'In model-based learning, the following iterative steps are performed in order
    to obtain an optimum policy, as shown in the following figure:


    ![](img/88a9c35e3059565190fbb6413f1ca217_227_0.png)


    Iterative steps to find an optimum policy


    In this section, we shall evaluate the policy using the state-value function.
    In each iteration, the policies are dynamically evaluated using the Bellman equation,
    as follows, where $V_i$ denotes the value at iteration $i$, $P$ denotes an arbitrary
    policy of a given state $s$ and action $a$, $T$ denotes the transition probability
    from state $s$ to state $s''$ due to an action $a$, $R$ denotes the reward at
    state $s''$ while traversing from the state $s$ post an action $a$, and $\gamma$
    denotes a discount factor in the range of (0,1). The discount factor ensures higher
    importance to starting learning steps than later.


    ```

    $V_{i+1}(s) = \sum_{a} P(s,a) \sum_{s''} T_{ss''}^a [R_{ss''}^a + \gamma V_i(s'')]$

    ```'
