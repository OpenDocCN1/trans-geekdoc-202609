  md: '# How it works...


    The function begins with extracting the shape of the given input layer. As stated
    in previous recipes, the shape of the input layer comprises four integers: image
    number, image height, image width, and the number of color channels in the image.
    The number of features (num_features) is then evaluated using a dot-product of
    image height, image weight, and number of color channels.


    Then, the layer is flattened or reshaped into a two-dimensional tensor (using
    tf$reshape). The first dimension is set to -1 (which is equal to the total number
    of images) and the second dimension is the number of features.


    Finally, the function returns a list of flattened layers along with the total
    number of (input) features.


    # Using functions to flatten the densely connected layer


    The CNN generally ends with a fully connected multilayered perceptron using softmax
    activation in the output layer. Here, each neuron in the previous convoluted-flattened
    layer is connected to every neuron in the next (fully connected) layer.


    The key purpose of the fully convoluted layer is to use the features generated
    in the convolution and pooling stage to classify the given input image into various
    outcome classes (here, 10L). It also helps in learning the non-linear combinations
    of these features to define the outcome classes.


    In this chapter, we use two fully connected layers for optimization. This function
    is primarily used to define the mathematical formulas in the TensorFlow graph,
    which is later used in actual computation during optimization.


    # Getting ready


    The (create_fc_layer) function takes four input parameters, which are as follows:


    +   • Input: This is similar to the input of the new convolution layer function'
