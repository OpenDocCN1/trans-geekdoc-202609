- pgno: 120
  md: '# # Data Representation Using Autoencoders


    This chapter will introduce unsupervised applications of deep learning using autoencoders.
    In this chapter, we will cover the following topics:


    +   - Setting up autoencoders

    +   - Data normalization

    +   - Setting up a regularized autoencoder

    +   - Fine-tuning the parameters of the autoencoder

    +   - Setting up stacked autoencoders

    +   - Setting up denoising autoencoders

    +   - Building and comparing stochastic encoders and decoders

    +   - Learning manifolds from autoencoders

    +   - Evaluating the sparse decomposition


    # ## Introduction


    Neural networks aim to find a non-linear relationship between input X with output
    _y_, as _y=f(x)_. An autoencoder is a form of unsupervised neural network which
    tries to find a relationship between features in space such that _h=f(x)_, which
    helps us learn the relationship between input space and can be used for data compression,
    dimensionality reduction, and feature learning.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'An autoencoder consists of an encoder and decoder. The encoder helps encode
    the input x in a latent representation y, whereas a decoder helps converts back
    the y to x. Both the encoder and decoder possess a similar representation of form.


    Here is a representation of a one layer autoencoder:


    ```

    h = f(x) = \sigma(W_e^T X + b_e)


    \tilde{X} = f(h) = \sigma(W_d^T h + b_d)

    ```


    The coder encodes input X to h under a hidden layer contain, whereas the decoder
    helps to attain the original data from encoded output h. The matrices We and Wd
    represent the weights of the encoder and decoder layers, respectively. The function
    f is the activation function.


    An illustration of an autoencoder is shown in the following diagram:


    ![](img/88a9c35e3059565190fbb6413f1ca217_121_0.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'The constraints in the form of nodes allows the autoencoder to discover interesting
    structures within the data. For example, in the encoder in the preceding diagram,
    the five-input dataset must pass through three-node compression to get an encoded
    value h. The Encoded Output layer of an encoder can have a dimensionality that
    is the same, lower, or higher than the input/output Decoded Output layer. The
    Encoded Output layer with a fewer number of nodes than the input layer is referred
    to as an under-complete representation, and can be thought of as data compression
    transforming data into low-dimensional representation.


    An Encoded Output layer with a larger number of input layers is referred to as
    an over-complete representation and is used in a sparse autoencoder as a regularization
    strategy. The objective of an autoencoder is to find y, capturing the main factors
    along the variation of data, which is similar to Principal Component Analysis
    (PCA), and thus can be used for compression as well.


    # Setting up autoencoders


    There exist a lot of different architectures of autoencoders distinguished by
    cost functions used to capture data representation. The most basic autoencoder
    is known as a vanilla autoencoder. It''s a two-layer neural network with one hidden
    layer the same number of nodes at the input and output layers, with an objective
    to minimize the cost function. The typical choices, but not limited to, for a
    loss function are mean square error (MSE) for regression and cross entropy for
    classification. The current approach can be easily extended to multiple layers,
    also known as multilayer autoencoder.


    The number of nodes plays a very critical role in autoencoders. If the number
    of nodes in the hidden layer is less than the input layer then an autoencoder
    is known as an under-complete autoencoder. A higher number of nodes in the hidden
    layer represents an over-complete autoencoder or sparse autoencoder.


    The sparse autoencoder aims to impose sparsity in the hidden layer. This sparsity
    can be achieved by introducing a higher number of nodes than the input in the
    hidden layer or by introducing a penalty in the loss function that will move the
    weights for the hidden layer toward zero. Some autoencoders attain the sparsity
    by manually zeroing out the weight for nodes; these are referred to as K-sparse
    autoencoders. We will set up an autoencoder on the occupancy dataset discussed
    in Chapter 1, Getting Started. The hidden layer for the current example can be
    tweaked around.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Getting ready


    Let''s use the Occupancy dataset to set up an autoencoder:


    +   - Download the Occupancy dataset as described in Chapter 1, Getting Started

    +   - TensorFlow installation in R and Python


    # How to do it...


    The current occupancy dataset as described in Chapter 1, Getting Started, is used
    to demonstrate the autoencoder setup in R using TensorFlow:


    +   1. Set up the R TensorFlow environment.

    +   2. The load_occupancy_data function can be used to load the data by setting
    the correct working directory path using setwd:


    ```

    # Function to load Occupancy data

    load_occupancy_data<-function(train) {

    xFeatures = c("Temperature", "Humidity", "Light", "CO2",

    "HumidityRatio")

    yFeatures = "Occupancy"

    if(train) {

    occupancy_ds <-

    as.matrix(read.csv("datatraining.txt",stringsAsFactors = T))

    } else {

    occupancy_ds <-

    as.matrix(read.csv("datatest.txt",stringsAsFactors = T))

    }

    occupancy_ds<-apply(occupancy_ds[, c(xFeatures, yFeatures)], 2,

    FUN=as.numeric)

    return(occupancy_ds)

    }

    ```


    +   3. The train and test occupancy dataset can be loaded to the R environment
    with the following script:


    ```

    occupancy_train <-load_occupancy_data(train=T)

    occupancy_test <- load_occupancy_data(train = F)

    ```'
