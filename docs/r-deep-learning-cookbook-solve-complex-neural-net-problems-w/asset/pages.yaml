  md: '# Comparing principal component analysis with the Restricted Boltzmann machine


    In this section, you will learn about two widely recommended dimensionality reduction
    techniques--Principal component analysis (PCA) and the Restricted Boltzmann machine
    (RBM). Consider a vector _v_ in _n_-dimensional space. The dimensionality reduction
    technique essentially transforms the vector _v_ into a relatively smaller (or
    sometimes equal) vector _v_’ with _m_-dimensions (_m_<_n_). The transformation
    can be either linear or nonlinear.


    PCA performs a linear transformation on features such that orthogonally adjusted
    components are generated that are later ordered based on their relative importance
    of variance capture. These _m_ components can be considered as new input features,
    and can be defined as follows:


    Vector $v'' = \sum_{i=1}^{m} W_i \cdot c_i$


    Here, _w_ and _c_ correspond to weights (loading) and transformed components,
    respectively.


    Unlike PCA, RBMs (or DBNs/autoencoders) perform non-linear transformations using
    connections between visible and hidden units, as described in Chapter 4, Data
    Representation Using Autoencoders. The nonlinearity helps in better understanding
    the relationship with latent variables. Along with information capture, they also
    tend to remove noise. RBMs are generally based on stochastic distribution (either
    Bernoulli or Gaussian).


    > A large amount of Gibbs sampling is performed to learn and optimize the connection
    weights between visible and hidden layers. The optimization happens in two passes:
    a forward pass where hidden layers are sampled using given visible layers and
    a backward pass where visible layers are resampled using given hidden layers.
    The optimization is performed to minimize the reconstruction error.'
  merge: -1
  img_proc: true
