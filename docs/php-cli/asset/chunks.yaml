    \ `header()` 函数添加必要的头部。\n\n*   `PHP` 不会将工作目录更改为脚本所在的目录。要手动这样做，请使用 `getcwd()` 和\
    \ `chdir()` 获取和设置当前目录。否则，工作目录将是调用脚本的地方。例如，如果你在 `/home/rob` 中输入 `php /home/peter/some_script.php`，`PHP`\
    \ 使用的工作目录将是 `/home/rob`，而不是 `/home/peter`。\n\n*   任何错误或警告信息都以纯文本输出，而不是 HTML 格式文本。如果你想要\
    \ HTML 错误（例如你正在生成静态 HTML 文件），可以在脚本中使用 `ini_set('html_errors', 1);` 覆盖此设置。\n\n\
    *   `PHP` 隐式地立即刷新所有输出，默认不缓冲。在线直接输出往往会损害性能，因此输出会在缓冲区满时以最佳大小的块发送。离线时这可能不是问题，因此 `print`\
    \ 和 `echo` 等构造的输出会立即发送到 shell。当你等待进一步输出时，不需要使用 `flush()` 来清除缓冲区。如果你愿意，可以使用 PHP\
    \ 的输出缓冲函数来捕获和控制输出，请参见 PHP 手册中的“输出控制”部分。\n\n*   没有设置执行时间限制。你的脚本将持续运行直到它自愿退出，即使它挂起了\
    \ PHP 也不会终止它。如果你想设置时间限制来约束行为不当的脚本，可以在脚本中使用 `set_time_limit()` 函数。\n\n*   描述传递给脚本的命令行参数的变量\
    \ `$argc` 和 `$argv` 会自动设置。这些将在本章后面详细讨论。\n\n*   `PHP` 定义了与同名标准流相关的常量 `STDIN`、`STDOUT`\
    \ 和 `STDERR`，并自动打开它们的 I/O 流。\n"
- fmt: '

    To use the PHP CLI SAPI, you may need to install it first. Appendix A gives details
    on installing (and compiling, where necessary) PHP. However you may find that
    it is already installed if you have PHP installed (often in a folder called `sapi/cli`
    in the PHP program folders), and if not it is usually available in modern OS software
    repositories (e.g. in Ubuntu a package called `php5-cli` exists and can be installed
    from any package manager or via the command line with `sudo apt-get install php5-cli`).
    If it is installed in the command line search path, typing `php -v` on the command
    line will print the version details, confirming it is indeed installed.


    ### 3.3 PHP command line options


    The PHP binary will accept a number of command line options/switches/arguments
    which affect its operation. A full list can be seen by typing `php -h`. Although
    some apply only to the CGI SAPI (used when there is not a “module” such as the
    PHP Apache module), the following are some of the more interesting and common
    ones used when interacting with the CLI SAPI:


    #### `-f` or `--file`


    - This allows you to specify the filename of the script to be run, and is optional.
    The `-f` option exists to allow compatibility with software and scripts such as
    automation software which can programmatically call command line programs but
    require filename arguments to be formed in this way. It also allows default filetype
    handlers to be easily set on Windows for PHP scripts. The only real difference
    in usage between the two versions of the command above come when interpreting
    command line arguments passed to the script, which we look at in the “Command
    line arguments for your script” section below. In most cases, the two following
    lines are mostly equivalent:


    ```

    1 ~$ php -f myscript.php

    2 ~$ php myscript.php

    ```


    #### `-a` or `--interactive`


    - Runs PHP interactively. This allows you to type in PHP code, line by line, rather
    than executing a saved PHP script. This mode of operation is often called a “REPL”
    (Read-Eval-Print-Loop). As well as providing an interactive interface for testing
    and developing code, it can also act as an enhanced PHP enabled shell or command-line,
    and we’ll look at this more closely later in this chapter.


    #### `-c` or `--php-ini`


    - Specifies the PHP ini file that PHP will use for this application. This is particularly
    useful if you are also running web services using PHP on the same machine, as
    if it is not specified PHP will look in various default locations for `php.ini`
    and may end up using the same one as your web service. By providing one specifically
    for your CLI applications you can “open up” various restrictions that make more
    sense for offline applications. Note that by using the CLI SAPI, PHP will automatically
    override several `php.ini` settings regardless of whether you specify a custom
    ini file using this option. These overridden settings are those that affect the
    behaviour outlined in the “Whats different about the CLI SAPI?” above, and while
    the `php.ini` file is ignored in these cases you can revert or change these settings
    directly in your code using `ini_set()` function or similar. You can also use
    the `-d` or `--define` option to set options (e.g. `php -d max_execution_time=2000
    myscript.php`). If you are deploying software onto machines that you do not control
    (e.g. if you are selling software for users to install on their own machines),
    it makes sense to use one of these mechanisms to ensure that PHP will be running
    with the settings you expect, not the settings the user may happen to have. See
    `-n` below as well.


    #### `-n` or `--no-php-ini`


    - This tells PHP not to load a `php.ini` file at all. This can be useful if you
    do not wish to ship one with your application and instead set all of the settings
    directly within your code using `ini_set()` or similar. PHP will use its default
    settings if no ini file is provided, and it is worth remembering that these default
    settings may change from version to version of PHP (and indeed have done so in
    the past). You shouldn’t rely on the current defaults being suitable for your
    application. You can use `php --ini` to show the default path that PHP will look
    for ini files when the `-n` option isn’t used and `-c` isn’t used to specify a
    file.


    #### `-e` or `--profile-info`


    - This puts PHP into “Extended Information Mode”. EIM generates extra information
    for use by profilers and debuggers. If you’re not using a profiler or debugger
    that requires this mode, you should not enable it as it can degrade performance.
    More information on profilers and debuggers can be found in the next chapter.


    #### `-i` or `--info`


    - Calls the `phpinfo()` function and prints the output. This outputs a large range
    of information about the PHP installation, in plain text format rather than the
    usual HTML (it detects we are calling it from the CLI SAPI). This can be useful
    in tracking down issues with the installation itself, as well as giving you version
    information, lists of extensions installed, relevant file paths etc. As with any
    other shell command, the output can be piped to other commands, e.g. `grep`. So
    if you wanted to check if IPv6 was enabled in your PHP binary for instance, you
    could try:


    ```

    1 ~$ php -i | grep -i "ipv6"

    ```


    #### `-l` or `--syntax-check`


    - Parses the file, checking for syntax errors. This is a basic “lint” type checker,
    more advanced static code analysis tools are discussed in the next chapter. Be
    aware that this option only checks for syntax errors, the code is not executed.
    Some IDE’s and text editors run `php -l` in the background to highlight syntax
    errors as you type. For instance the linter-php package in Github’s Atom editor
    uses this method for live linting.


    #### `-m` or `--modules`


    - Lists all of the loaded PHP modules/extensions. These are modules that PHP has
    been compiled with, and may include things like “core”, “mysql”, “PDO”, “json”
    and more. This is useful for checking the PHP installation has the functionality
    that your application requires. You can also check from within your scripts using
    the `extension_loaded()` function or by calling the `phpinfo()` function. `-m`
    provides a subset of the information given with the `-i` flag above, and `-i`
    (or the `phpinfo()` function) will return more information about the configuration,
    version etc. of the modules.


    #### `-r` or `--run`


    - Runs a line of PHP code supplied as the argument, rather than executing it from
    a file. The line of code should be enclosed by single quotes, as shells like bash
    will try and interpolate PHP variables as if they were shell variables if you
    use double quotes. This performs a similar role to the `-a` interactive mode,
    except that PHP’s “state” is cleared after each line is executed. This means that
    the line of code supplied is treated as the whole script to be executed, and execution
    is terminated once it has been run. An Example would be:


    ```

    1 ~$ php -r ''echo (2+2)."\n";''

    ```


    Note that the line must be well-formed syntactically correct PHP, so don’t miss
    out the semi-colon at the end! We will return to `-r` later in this chapter in
    the section “The many ways to call PHP scripts”.


    #### `-B` or `--process-begin`


    #### `-R` or `--process-code`


    #### `-F` or `--process-file`


    #### `-E` or `--process-end`

    '
