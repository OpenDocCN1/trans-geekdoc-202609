    从 4.3 版本开始，PHP 就拥有一项可以解决所有这些问题的“王牌杀手”。PHP CLI SAPI（正式名称为“命令行接口”或“服务器应用程序编程接口”）本质上是“独立运行
    PHP”的一种冗长说法。它消除了对 Web 服务器的需求，并为你提供了一个独立的 PHP 二进制文件供你交互。例如，在 shell 提示符中输入以下内容：


    ```bash

    1 ~$ php /home/myfiles/myprogram.php

    ```


    这将直接执行你的 `myprogram.php` 文件（你编写它的方式与任何其他 PHP 脚本无异），并将任何输出返回到终端（除非你另有说明），而不是发送到
    Web 服务器（而该服务器根本不存在！）。


    通常情况下，直接使用 PHP CLI SAPI 调 PHP PHP 脚本的行为通过 Web 服务器调用时相同，尽管存在一些差异。例如，你将无法找到任何 `$_GET`
    或 `$_POST` 数组，且 PHP 默认不会发送任何 HTTP 头部，因为这些概念在 Web 之外并没有意义。像 `max_execution_time`
    等默认设置被设置为适用于本地使用的合理值（在这种情况下设置为 0，这样你的脚本就不会超时），输出缓冲被关闭，且错误信息以纯文本而非 HTML 显示。


    关于如何安装（如有必要）和使用 CLI SAPI 的完整细节，请见下一章。


    ## 2.2 PHP 版本 - 你用的是哪一个？


    PHP 从 4.3.0 版本开始就支持 CLI SAPI，因此书中的许多示例可以在此后的任何 PHP 版本上运行。在编写本书时，PHP 的当前版本是 7.02，书中的代码已针对该版本进行了测试。如果你发现某个特定函数似乎不存在或运行不符合预期，请检查该函数的在线
    PHP 手册。手册会显示哪些版本支持哪些函数，并描述新版本所引入的任何破坏性更改。


    如果你正在使用旧版本，有几个非常充分的理由进行升级：


    *   在最近的版本中，性能显著提高（相应地，使用的资源也减少了）。

    *   虽然对于非 Web 应用，安全性并不总是那么关键（请参见本章稍后关于安全讨论中的注意事项），但如果你正在处理来自外部源的数据，并且将相同的版本用于
    Web 工作，那么最近版本中的安全增强和安全相关的漏洞修复是必不可少的。

    *   可以使用现代语言特性，这可以提高你的编码效率，并帮助他人更认真地对待你的代码。


    与 PHP 的 Web 版本一样，如果你觉得需要，也可以编译你自己的 CLI SAPI 版本。如果你想包含操作系统软件仓库未预装的扩展、出于性能考虑移除非核心代码，或使用
    PHP 支持的任何其他编译时选项，那么学习“自制”一个版本可能是值得值得的。在附录 A 中可以找到编译和安装 PHP 及相关扩展的入门指南。


    ## 2.3 不要在 PHP 中执行它的几个好理由


    如果你告诉某人你将用 PHP 编写 CLI 脚本，他们通常会抱怨 PHP 是一门 Web 语言，认为你应该选择一种“更适合”该任务的语言。本书侧重于用 PHP
    完成所有工作，对于 90% 的任务，PHP 都能胜任所有要求。PHP 现在是一门通用语言，它是图灵完备的，虽然它仍被主要用于运行“网站”，但现在它越来越多地也意味着后端服务。但在你决定用
    PHP 重写你的世界之前，有几个相关问题是你可能在跳入之前仔细考虑的。


    ### 高性能需求

    如果你需要非常高的性能，特别是在硬件有限的情况下，PHP 可能不适合你。PHP 在最近的版本中性能有了飞跃性的提升，在基准测试中经常击败 Python 等语言和
    Ruby-on-Rails 等框架。然而，PHP 本质上是一种抽象的脚本语言，对于某些任务，它永远无法获得像 C 这样更接近底层的低级语言相同的性能。但不要因此否定它所有高性能任务，如果你从成本的角度考虑性能，你可能会发现，通过
    PHP 的快速开发所节省的开发者时间成本，超过了为了获得性能而投入的额外硬件成本。


    ### 不要（没必要）重造轮子

    你*可以*用 PHP 编写一个 Web 服务器（参见附录 D 的示例），但*现有的*服务器如 Apache 难道不能满足你的需求吗？对于许多或大多数基础设施方面的“痒点”，已经存在软件（用许多不同的语言编写）可以提供你所需的“解决方案”。除非你真的需要其他功能，否则编写自己的软件所花费的时间通常比学习和实现现有软件花费的时间要长。当然，对某些人来说，反过来也是的。“因为我可以”可以是一个合理的理由，而且编写软件始终是一次宝贵的学习经历。


    ### 保持源代码关闭

    PHP 是一种脚本语言，这意味着如果你正在编写要出售或部署在其他地方软件，你将向接收者公开你的源代码。许多人（包括作者）会认为“开源”（即使是商业开源）是一好事。但如果那不是你的领域，那么你就需要付出更大的努力来保护你的代码。网上有很多源代码混淆器，它们使用各种技巧让你的代码难以（但并非不可能）阅读，而且还有许多
    PHP 编译器可以生成二进制程序（尽管在语法和扩展覆盖方面存在局限性）。但 PHP 主项目尚未表达过支持代码隐藏或编译的意图，因此此类方法的长期可行性尚不明。闭源软件的商业案例在中长期也不是定论。


    ## 2.4 思考安全性


    进入离线软件的世界，情况则显著不同。通常我们看到的软件仅针对受信任的用户，部署在本地受信任的机器上，并受仁慈用户的完全控制。用户不会故意攻击软件或机器，他们处理的是自己的数据。功能绝对不能被破坏。在开发命令行程序和桌面应用时，很少会考虑安全性，更不用将其作为设计时指定的功能了，因为这并不“必要”。


    '
- fmt: '

    Except the world doesn’t work like that. Take a look at any software vulnerability
    mailing list like `BugTraq` and you’ll find an abundance of vulnerabilities in
    “offline” apps like `Adobe Reader`, `Microsoft Word` and even open-source stalwarts
    like `GIMP`. The fact is, security is important even in local apps, for two main
    reasons. The first is the perennial problem of “typical user” behaviour. This
    is not a problem for an intelligent tech-literate user who never makes mistakes
    (like you dear reader), but for any software used by the rest of us disaster is
    only an accidental-click-on-a-dodgy-email away. The second reason security is
    important is that for most machines, many non-web applications aren’t really “off-line”.
    Even when a desktop app or a system daemon doesn’t interact with the web, local
    network or other external services itself, the machine it is connected to will
    invariably have an Ethernet cable plugged into it or a WiFi/3G/4G connection active.
    Your software will not run in its own cosy little realm, insulated from the world
    outside. Perfectly sand-boxed virtual machines not withstanding, of course.


    Software security is the topic of a whole other book (of which others have written
    plenty, see the further reading section below), and many of the same principles
    apply to systems software as to web software so you will be able to use your existing
    knowledge of web based `PHP` security practices to guide you. The following list
    of typical vulnerability types and attack vectors in both user-facing and systems
    software should be considered when planning your script security measures and
    monitoring.


    *   **Compromised data files**

    Compromised files from external sources (loaded deliberately or accidentally by
    users). These are usually data files, and particularly at risk is software registered
    as a default viewer for a particular file type, as accidental and malicious file
    activation is much easier.


    *   **Exploitation by malware**

    Malware looking for innocent software to exploit to gain privilege escalation.
    Scripted software like `PHP` code can be easier for malware to re-write or alter,
    and the availability of the source code in an un-compiled form can be of help
    to the malware authors.


    *   **User misbehaviour**

    Legitimate users misbehaving. John Smith looking for a way to view the files or
    surfing history of his boss Jane Doe on their shared business system, for instance.


    *   **Privilege escalation**

    Similar to legitimate users misbehaving, this is legitimate software misbehaving,
    either accidentally or deliberately trying to gain & use access permissions it
    does not have.


    *   **Dependency vulnerability**

    `PHP` vulnerabilities, and vulnerabilities in other dependencies and related software.
    Your software will be completely free of security issues, of course, but it invariably
    depends on other libraries, software and `PHP` extensions, and of course lets
    not forget the `PHP` interpreter itself. Any of these can contain security bugs
    and attack vectors.


    The above section lists common sources of security issues in all types of software,
    not just in `PHP`. Minimise your risks by planning for these in the design stage,
    and testing for them before deployment. Then cross your fingers…


    ## 2.5 CLI specific Code Frameworks


    There are many coding frameworks for `PHP`, and many of them can be used with
    `CLI` applications, although there is only one that is specifically created for
    non-web programming. Code in various frameworks may assume that it will be called
    in an http related context, so you may need to do extra work to code around this.
    When deciding whether to use a Framework, or which one to use, you should bear
    in mind their applicability (in terms of their focus on the web) and whether your
    application’s performance will suffer from the overhead they may bring. You will
    usually also need to look at their license, as they will usually have components
    that need to be distributed with your scripts. That’s not to say that they can’t
    be useful in general purpose programming, however, there are none that your author
    can currently recommend specifically for non-web projects. If you’re currently
    comfortable using a particular framework on your web projects, it may be worth
    seeing if there is a `CLI/Console` module or recommended code path for that particular
    framework.


    ## 3. Understanding and using the CLI SAPI


    As we mentioned in the previous chapter, `PHP CLI` scripting involves using the
    `PHP CLI SAPI`. It’s therefore important to have a good grasp of how to use it,
    the options for configuring and running it, and how it differs from the web based
    `SAPIs` you are used to. Luckily the differences are minimal, and many are intuitive.


    ### 3.1 What’s different about the CLI SAPI?


    The following are the main differences between the `CLI SAPI` and the standard
    web implementation :


    *   No HTTP headers are written to the output by default. This makes sense as
    they hold no meaning in the command line and so would be just extraneous text
    printed above your genuine output. If your output will later be funnelled out
    to a web browser, you will need to manually add any necessary headers (for instance
    by using the `header()` PHP function).


    *   `PHP` does not change the working directory to that of the `PHP` script being
    executed. To do this manually, use `getcwd()` and `chdir()` to get and set the
    current directory. Otherwise, the current working directory will be that from
    which you invoked the script. For instance, if you are currently in `/home/rob`
    and you type `php /home/peter/some_script.php`, the working directory used in
    `PHP` will be `/home/rob`, not `/home/peter`.


    *   Any error or warning messages are output in plain text, rather than HTML formatted
    text. If you want HTMLified errors, for instance if you are producing static HTML
    files, you can override this by setting the `html_errors` runtime configuration
    directive to true in your script using `ini_set(''html_errors'', 1);`


    *   `PHP` implicitly ‘flushes’ all output immediately and doesn’t buffer by default.
    Online performance can often be harmed by sending output straight to a browser,
    so instead output is buffered and sent in optimal sized chunks when the chunk
    is full. Off-line this is not likely to be an issue, and so HTML blocks and output
    from constructs like `print` and `echo` are sent to the shell straight away. There
    is no need to use `flush()` to clear a buffer when you are waiting for further
    output. You can still use PHP’s output buffering functions to capture and control
    output if you wish, see the “Output Control Functions” section in the PHP manual
    for more information.


    *   There is no execution time limit set. Your script will run continuously until
    it exits of its volition, `PHP` will not terminate it even if it hangs. If you
    want to set a time limit to reign in misbehaving scripts you can do so within
    the script using the `set_time_limit()` function.


    *   The variables `$argc` and `$argv` which describe any command line arguments
    passed to your script are automatically set. These are discussed fully later in
    this chapter.


    *   `PHP` defines the constants `STDIN`, `STDOUT` and `STDERR` relating to the
    standard streams of the same name, and automatically opens I/O streams for them.
    These give your application instant access to “standard input” (`STDIN`), “standard
    output” (`STDOUT`) and “standard error” (`STDERR`) streams.

