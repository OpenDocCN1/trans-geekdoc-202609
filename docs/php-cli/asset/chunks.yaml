  raw: "I’ve been programming in PHP since late 2000. Initially it wasn’t by choice\
    \ as my preferred languages at the time were Perl and Delphi (also known as Object\
    \ Pascal). Things began to change after I graduated from the University of Leeds\
    \ with a degree in Computer Science in 1999 and started out in a career as a freelance\
    \ web developer. After only a couple of months I was offered the opportunity to\
    \ take over a (relatively speaking) substantial government website contract from\
    \ a friend who was exiting the freelance world for the safer and saner world of\
    \ full-time employment. The only catch was that several thousand lines of code\
    \ had already been written, and they were written in a relatively new language\
    \ called “PHP”. Oh, and the only other catch was that I had about a week to learn\
    \ it before taking over the site. So, as was the way at the time, I popped down\
    \ to the local Waterstones bookshop (for the younger among you that’s where we\
    \ used to get books. Books made of paper. And we had to go out and get them. Or\
    \ order online and wait days for them to be delivered. Did I mention they were\
    \ made of paper?). With my paper copy of “The Generic Beginners Complete Guide\
    \ to PHP and MySQL for Dummies Compendium” book in hand (I may not have recalled\
    \ the title completely correctly) I settled down with a pint of ale (I’m in Yorkshire\
    \ at this point, remember) and set about reading it. A few days later I was coding\
    \ like a pro (well, stuff was working) and 12 years later I haven’t looked back.\
    \ After a varied career as a freelancer and starting up a couple of, er, start-ups\
    \ (IT related and not) with varying (usually dismal) success, I’m now a full-time\
    \ programmer at The University of Oxford. My day job involves medium-scale data\
    \ acquisition and management, statistical analysis and providing user interfaces\
    \ for researchers and the public. The majority of my development work is done\
    \ in PHP, either developing new projects or gluing together other peoples software,\
    \ systems and databases.\n\nThrough-out my career I’ve always used PHP for web\
    \ development, but for Desktop GUI work I initially used Delphi (and then Free-Pascal/Lazarus),\
    \ complimented with bash shell scripting for other tasks. This was mainly due\
    \ to learning them while at University. However, as PHP has matured I’ve increasingly\
    \ used it beyond the web, and now I rarely use anything else for any programming\
    \ or scripting task I encounter. Having been immersed in other languages like\
    \ C++, Javascript, Fortran, Lisp (and probably others that my brain has chosen\
    \ deliberately not to remember) by necessity during University and in some of\
    \ my freelance jobs, I can honestly say that PHP is now my language of choice,\
    \ rather than of necessity.\n\nWhen I’m not tied to a computer, I would like to\
    \ say I have lots of varied and interesting hobbies. I used to have. I could write\
    \ a whole book (which wouldn’t sell well) about where I’ve been and what I’ve\
    \ done and I’d like to think it’s made me a well rounded person. But these days\
    \ I don’t. In large part this is due to the demands of my three gorgeous young\
    \ daughters Ellie, Izzy and Indy, my gorgeous wife Parv and my even more gorgeous\
    \ cat Mia. And I wouldn’t have it any other way. That’s what I tell myself, anyway…\n\
    \n### Acknowledgements\n\nIsaac Newton said “If I have seen further, it is by\
    \ standing on the shoulders of giants”. This book builds on, and hopefully adds\
    \ to, the work of many others. The most notable of whom I would like to acknowledge\
    \ below.\n\n**The authors of, and contributors to, the official PHP manual** \
    \ \n\nAn invaluable reference for PHP functions and syntax, to which I referred\
    \ frequently during writing this book, both for fact checking and as an aide-memoir.\
    \ Thanks!\n\n**The collective PHP wisdom of the Internet**  \n\nFor over 12 years\
    \ I’ve used you for learning, research, play and profit. Too many sites & too\
    \ many people to list here, if you’ve written about PHP on web then you may well\
    \ be one of them. Thanks!\n\n**My Family**  \n\nFor allowing me a modicum of time\
    \ to write this book, and supporting me unconditionally in everything I do. Usually.\
    \ If I ask first. And there’s not something more important going on. And usually\
    \ with conditions. Thanks!\n\n## 1\\. Introduction\n\nIf your e-reader has bought\
    \ you directly to this page, or your fingers have flipped straight through the\
    \ pages of the paper copy to here, then you have (perhaps wisely) skipped the\
    \ books “front matter”, containing the front cover, table of contents, about-the-author\
    \ section, acknowledgements and a few more bits and bobs. If that interests you,\
    \ then scroll or flip backwards. Otherwise, read on to start your journey through\
    \ the wider world of PHP software.\n\n### 1.1 “Use PHP? We’re not building a website,\
    \ you know!”.\n\nBoth it’s current recursive moniker (“PHP : PHP HyperText Preprocessor”),\
    \ as well as the name originally bestowed upon it by it’s creator Rasmus Lerdorf\
    \ (“PHP : Personal Home Page”) reinforce the widely held view that PHP is a scripting\
    \ language for the web. And that was true, back in 1995 when PHP was first created,\
    \ and for a number of years afterwards. In the web arena PHP excels : it’s easy\
    \ to use, quick to develop in, widely deployed, tightly integrated into web stacks\
    \ (it’s usually the P in LAMP,WAMP,MAMP etc.), and of course because it is free\
    \ and open source.\n\nBut many people don’t realise (or haven’t noticed, or choose\
    \ not to notice) that PHP has evolved and grown up. It now closely resembles a\
    \ modern, general purpose programming language. This lack of recognition is partly\
    \ PHP’s own fault as it took a long time to get some of the fundamentals in place,\
    \ such as OOP language constructs and even the ability to run at all without a\
    \ web server being involved. However the programming community hasn’t helped;\
    \ many programmers had a hard time seeing the potential for PHP to bring its rapid\
    \ dynamic development model out of the web and into the wider computing environment,\
    \ and many simply stuck with the “web scripting for beginners” dogma that was\
    \ only really true of its early years.\n\nRecent releases in particular have brought\
    \ mainstream language features (e.g. closures, traits, better language support,\
    \ namespaces & late static binding among many others) to the table. Performance\
    \ has jumped up and up and up, memory usage (a bugbear of older versions) has\
    \ dropped considerably, and PHP is now one of the more lean popular scripting\
    \ languages. For even higher performance needs PHP 7 has dramatically rewritten\
    \ Zend Engine (giving up to twice the performance of 5.6), and Facebook (the biggest\
    \ user of PHP around) are one of several groups who are releasing alternative\
    \ interpreters/VM’s, leading to performance increases of up to 6 times that achievable\
    \ with the old Zend Engine. The recent release of PHP 7, and the upswing in community\
    \ involvement, are indicative that reports of PHP’s demise are quite premature!\n\
    \nBut why, why, oh why create Command Line Scripts in PHP? Why not whip up a bash\
    \ shell script? Why not learn C++ or another language typically used for software\
    \ projects? The truth is these are valid options, and life may well work out just\
    \ fine for you. But why turn down the opportunity to use your existing skills?\
    \ Why not use PHP’s integrated database access, reuse existing code and data from\
    \ your web projects, take advantage of PHP’s easy to use network libraries and\
    \ functions, wallow in flexible text and data handling, and mix shell commands\
    \ and other languages into PHP as needed to get best of both worlds? In short,\
    \ why the heck not?"
