    除了上述介绍的内置 PHP REPL 之外，还有许多第三方 REPL 可用，其中一些包含了诸如已输入命令历史、命令 Tab 补全、致命错误保护，甚至是简要函数文档等功能。


    ## 4. 面向用户的软件


    在处理完理解在非 Web 环境下开发 PHP 所需的初步信息后，我们现在将进入核心部分，即如何在没有  渲染引擎的情况下与用户进行交互。


    ### 4.1 命令行界面基础


    尽管图形界面如今似乎占据着主导地位，但文本界面仍然有许多用处，特别是在技术精通的用户环境中。在创建一个运行在命令行的基于文本的程序时，除了你已经熟悉的 PHP
    之外，还有三个首要考虑的因素。这些因素是：


    1. 获取键盘输入

    2. 向屏幕输出文本（和图形）

    3. 程序流控制


    我们不会孤立地描述每项内容，而是通过一个包含这三个元素的简单程序来观察。请阅读下面的代码和注释。该程序是一个屏幕保护程序程序，通过一个蠕动的蛇形光标为 shell
    填充颜色。

    '
- fmt: "\n```php\n<?php\n# First we will define some named constants.\n# These are\
