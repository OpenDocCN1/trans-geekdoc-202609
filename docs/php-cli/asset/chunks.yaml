    English (you know, the one that kicked it all off) as your humble author hails
    from the other side of the pond. Deal with it, we spell things differently. Any
    genuine spelling mistakes you spot will be dismissed as part of an evolving language,
    and then quietly fixed while you’re not looking.


    ## 2\. Getting away from the Web - an overview of CLI programming in PHP


    This chapter takes a look at the basic steps involved in breaking free from the
    web with PHP. We’ll cover the technical steps involved, and also at the differences
    in programming practises and focus.


    ### 2.1 PHP without a web server


    Most PHP programmers have used PHP strictly in a web-server environment. In such
    an environment PHP is a CGI/Fast GGI or server module, called and controlled by
    the HTTP server (usually Apache, IIS, Nginx or similar). The HTTP server receives
    a request for a PHP based web page and calls the PHP process to execute it, which
    usually returns output back to the HTTP server to be sent on to the end user.


    There have been a number of attempts to create local applications (scripting systems,
    desktop apps and so forth) with PHP using a locally installed web server, with
    some success. However the downsides of using this web-type model for local apps
    are numerous:


    *   For the value they provide in these scenarios, web servers such as Apache
    are often very over specified and resource hungry


    *   Unless properly locked down, a web server running locally introduces a point
    of access to your machine for malicious visitors from the outside world


    *   HTTP is a verbose protocol and (arguably) ideally suited for the web, however
    it’s often overkill for local inter-process communication and adds another resource
    and complexity overhead to your application


    *   Your application interface typically runs in a web browser, and therefore
    looks anything but local (and comes with additional support/upgrade headaches
    unless you install a browser specifically for your app)


    PHP, as of version 5.4, includes a built-in web-server which removes some of the
    problems described above. However it was designed for local testing of PHP scripts
    designed to be deployed on a fully-fledged HTTP server such as Apache in a live
    environment. It is a route that can be explored for some local apps, particularly
    where you want to run a private instance of a PHP web app that already exists.
    However its stability, reliability and suitability for production-ready local
    apps is yet to be proven, and it still comes with the baggage of HTTP and web
    browsers.'
