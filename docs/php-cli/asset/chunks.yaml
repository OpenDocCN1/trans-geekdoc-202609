    There are also a couple of relevant tools listed below. The first is php-build,
    which automatically builds multiple versions of PHP from source, although you
    still need to exercise care installing and using them simultaneously. The second
    is 3v4l.org, a web service which allows you to test chunks of code in 90+ versions
    of PHP at the same time. This may avoid the need for installing multiple versions
    at all. And the final tool is a library which simulates many functions from newer
    versions for use with older versions.


    ### PEAR and PECL


    PEAR (PHP Extension and Application Repository) is a library of code and extensions
    written in PHP, with an easy to use packaging and distribution system. PECL (PHP
    Extension Community Library) is essentially the same, but for extensions written
    in C.


    Both PECL and PEAR work in a similar way to package managers such as Debians apt-get.
    For example to install the Cairo graphics extension from PECL, simply do `sudo
    pecl install cairo` at the command line. This will download, compile and install
    Cairo for you and you can then start using it from within your PHP scripts. Similarly,
    to install the RDF extension from PEAR, use `pear install rdf`.


    The `pear` and `pecl` commands are included as standard with PHP, however some
    package managers put them in the optional `php-dev` or `php-pear` package. On
    Ubuntu, for instance, use `sudo apt-get install php-pear` to install it.


    More information on both as well as the hundreds of extensions and libraries available,
    can be found at [http://pear.php.net](http://pear.php.net) and [http://pecl.php.net](http://pecl.php.net)
    respectively.


    ### Composer


    Composer is a dependency manager. While it deals with packages, it is not a package
    manager like PEAR. Rather than installing packages centrally, it deals with them
    on a per-project basis, ensuring that the appropriate versions of the relevant
    packages, and their dependencies, are installed automatically for that project.


    The basic Composer workflow happens as follows :


    *   You install Composer.


    *   In the base directory of your project, you create a json-formatted file called
    `composer.json` that specifies which packages (and versions) your project needs


    *   In that directory, you run Composer. It will fetch and install of the specified
    packages, and will automatically also install any of the other packages that those
    you have specified depend on (and so on until all dependencies are satisfied)


    *   In your PHP code, simply add the function `require ''vendor/autoload.php'';`
    and your libraries will be automatically available when you use them.


    Fully comprehensive documentation, aimed at beginners as well as advanced users,
    is available on the composer website. Composer itself doesn’t host any packages,
    that is the job of package repositories. Packagist is the main, and currently
    the only, comprehensive public repository, and is the default used by Composer.
    You can browse the thousands of available packages on the Packagist website. You
    can of course specify a different repository and indeed create and use your own
    packages privately if you need to.


    ### Symfony2 bundles


    If you’re using the Symfony2 framework, you can choose from and download over
    a thousand useful code bundles from knpbundles. These can be installed manually,
    or often using the Composer dependency system (see the section above). Visit [http://knpbundles.com/](http://knpbundles.com/)
    for more information and to browse the available code.


    ## Appendix B : Sources of help


    Even with excellent books like this on on the market, you will sometimes need
    a little additional help when you come across a tricky problem with PHP. Below
    are some potential sources of help.


    ### The PHP manual


    The official PHP manual can be found online at [http://php.net/docs.php](http://php.net/docs.php).
    The manual provides fairly comprehensive documentation in the main on PHP installation,
    syntax, functions and many extensions. Of particular note are the user comments
    at the bottom of each page. These are generally helpful and offer real-world advice
    related to the function or topic of the page. Occasionally some duff advice is
    given in the comments, however this is usually corrected or mentioned in a subsequent
    comment, so it’s worth reading through all of the comments on a given page.


    A handy function of the online manual is that you can do a quick look up of a
    function or topic by typing it as the first part of a URL. For instance, if you
    can’t remember what the parameters of `strripos()` are, you can simply type [http://php.net/strripos](http://php.net/strripos)
    into your browser and you will be sent straight to the relevant page. Likewise,
    if you want a quick refresher on how PHP handles arrays, visit [http://php.net/array](http://php.net/array)
    and you’ll go straight to the array page in the language/types section of the
    manual.


    If you don’t always have an internet connection, you can also download a copy
    of the manual from [http://www.php.net/download-docs.php](http://www.php.net/download-docs.php).
    It is available as HTML, Unix style man pages, and Microsoft Compiled HTML Manual
    (CHM) format.


    ### Official mailing lists


    There are a number of official mailing lists at [http://php.net/mailing-lists.php](http://php.net/mailing-lists.php)
    covering a wide variety of topics. Of note for getting help are the “General user
    list” for general queries, and the “Windows PHP users list” for Windows specific
    questions. Beware if subscribing that some of the lists area quite busy and you
    will get a large number of emails each day. The archives are available online
    if you just want to browse or get a feel for the volume generated on each list.


    ### Stack Overflow'
