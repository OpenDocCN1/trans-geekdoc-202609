  trans: "\n\n```php\n<?php\n# 首先，我们将定义一些命名常量。\n# 这些是 shell 转义码，用于格式化。\n# 将它们定义为命名常量有助于提高我们代码的可读性。\n\
    \ndefine(\"ESC\", \"\\033\");\ndefine(\"CLEAR\", ESC.\"[2J\");\ndefine(\"HOME\"\
    , ESC.\"[0;0f\");\n\n# 我们将向用户输出一些指令。注意我们使用的是 fwrite\n// 而不是 echo。目标是将我们的输出写回 shell，\n\
    // 这样用户可以在那里看到它。fwrite(STDOUT...) 写入\n// php://stdout 流。Echo（以及 print）写入 php://output\n\
    // 流。通常情况下二者是同一个东西，但并不一定如此。\n// 此外，php://output 受到输出控制和\n// 缓冲函数（http://www.php.net/manual/en/book.outcontrol.php）的影响，\n\
    // 这可能是需要的，也可能不需要。\n\nfwrite(STDOUT, \"按回车键开始，再次按回车键结束\");\n\n# 现在我们等待用户按下回车。默认情况下，STDIN\
    \ 是\n// 一个阻塞流，这意味着当我们尝试从它读取内容时，\n// 我们的脚本将停止并等待输入。当用户按下回车键时，\n// shell 的键盘输入将（通过\
    \ fread）传递给我们的脚本。\n\nfread(STDIN,1);\n\n# 我们希望程序一直运行直到用户再次按下回车键。\n// 这意味着我们希望定期使用\
    \ fread 检查输入，\n// 但在没有输入时不暂停/阻塞程序。因此，我们将 STDIN\n// 设置为非阻塞模式。\n\nstream_set_blocking(STDIN,\
    \ 0);\n\n# 在为输出做准备时，我们想要清除终端并在其周围\n// 画一个精美的框。要做到这一点，我们需要知道当前终端\n// 窗口有多大。没有内置的方法可以实现这一点，因此我们调用\n\
    // 一个名为 tput 的外部 shell 命令，它提供了关于当前终端的信息。\n\n$rows = intval(`tput lines`);\n$cols\
    \ = intval(`tput cols`);\n\n# 现在我们向终端写入两个特殊的转义码，其中第一个\n# (\\033[2J) 清除屏幕，第二个 (\\\
    033[0;0f) 将\n# 光标置于屏幕的左上角。我们已经在脚本开头\n# 将它们定义为常量 CLEAR 和 HOME。\n\nfwrite(STDOUT,\
    \ CLEAR.HOME);\n\n# 现在我们想在窗口周围画一个框。在终端中绘制\n#“图形”（或“半图形”）最简单的方法是使用\n// 大多数等宽字体中包含的框线字符。\n\
    \n# 通过逐行移动光标每一侧来绘制垂直框。\n# 光标通过转义码移动，例如 ESC.\"[$rowcount;1f\n\nfor ($rowcount =\
    \ 2; $rowcount < $rows; $rowcount++) {\n\tfwrite(STDOUT, ESC.\"[$rowcount;1f║\"\
    ); // 例如 \\033[7;1f 用于第 7 行\n\tfwrite(STDOUT, ESC.\"[$rowcount;${cols}f║\");\n\
    }\n\n# 现在对水平框执行同样的操作。\n\nfor ($colcount = 2; $colcount < $cols; $colcount++) {\n\
    \tfwrite(STDOUT, ESC.\"[1;${colcount}f═\");\n\tfwrite(STDOUT, ESC.\"[$rows;${colcount}f═\"\
    );\n}\n\n# 最后填充四个角。\n\nfwrite(STDOUT, ESC.\"[1;1f╔\");\nfwrite(STDOUT, ESC.\"\
    [1;${cols}f╗\");\nfwrite(STDOUT, ESC.\"[$rows;1f╚\");\nfwrite(STDOUT, ESC.\"[$rows;${cols}f╝\"\
    );\n\n# 你可以在此处查看框线字符范围\n// http://en.wikipedia.org/wiki/Box-drawing_character\n\
    // 它们就像任何其他字符一样，所以你可以轻松复制\n// 并粘贴到大多数编辑器中。\n\n// $p 是一个存储光标位置的数组 [x,y]。我们将将其\n\
    // 初始化为屏幕中心。\n\n$p = [\"x\"=>intval($cols/2), \"y\"=>intval($rows/2)];\n\n# 现在处理第一个流程控制元素。我们需要让程序\n\
    // 一直运行直到用户提供输入。最简单的方法是\n// 使用 while(1) 使用不结束的循环。“1”始终为真，\n// 所以 while 循环永远不会结束。当我们（或用户）准备\n\
    // 结束程序时，可以使用“break”结构跳出循环，\n// 并继续执行循环后的剩余脚本。\n\nwhile (1) {\n\n\t# 每当通过循环时，我们都想检查用户在\n\
    \t// 上一个循环中是否按了回车键。记住\n    // ... (后续逻辑由于原文截断省略)\n}\n```\n\n"
- fmt: "\n### 4.2 Advanced command line input\n\nIn the section above we used `fread()`\
    \ to read keyboard input. This is suitable for simple programs, but if you are\
    \ looking to create a more complex interface to allow users to issue commands\
    \ then you may wish to look at the `readline` extension, which you can use to\
    \ implement a shell-like editable command line program.\n\nThe following example\
    \ script shows how to implement a simple bespoke command line type interface with\
    \ the `readline` library.\n\n```php\n<?\n# Create arrays to hold our command history\
    \ and list of valid commands.\n\n$history = array();\n$validCommands = array();\n\
    \n# Define some valid commands.\n\n$validCommands[] = 'kill';\n$validCommands[]\
    \ = 'destroy';\n$validCommands[] = 'obliterate';\n$validCommands[] = 'history';\n\
    $validCommands[] = 'byebye';\n\n# We want to enable tab-completion of commands,\
    \ which allows the user to\n# start typing a command and then press tab to have\
    \ it completed, as \n# happens in Bash shells and the like. We need to provide\
    \ a function (via\n# readline_completion_function) that will provide an array\
    \ of possible \n# functions names. This can be based on the $partial characters\
    \ the user\n# has typed or the point in the program we are at, or any other \n\
    # factors we want. In our case, we'll simply provide an array of ALL of\n# the\
    \ valid commands we have.\n\nfunction tab_complete ($partial) {\n\tglobal $validCommands;\n\
    \treturn $validCommands;\n};\n\nreadline_completion_function('tab_complete');\n\
    \n# We now enter our main program loop. Note that we don't include a usleep,\n\
    # as readline pauses our program execution while it waits for input from\n# the\
    \ user.\n\nwhile (1) {\n\n\t# We call readline with a string that forms the command\
    \ prompt. In our\n\t# case we'll put the date & time in there to show that we\
    \ can change \n\t# it each time its called. Whatever the user enters is returned.\
    \ This \n\t# one simple line implements most of the readline magic. At this stage\
    \ \n\t# the user can take advantage of tab-completion, history (use up/down \n\
    \t# cursor keys) and so on.\n\n\t$line = readline(date('H:i:s').\" Enter command\
    \ > \");\n\n\t# We need to manually add commands to the history. This is used\
    \ for \n\t# the command history that the user accesses with the up/down cursor\
    \ \n\t# keys. We could choose to ignore commands (mis-typed ones or\n\t# intermediate\
    \ input, for example) if we want.\n\t\n\treadline_add_history($line);\n\t\n\t\
    # If we want to programmatically retrieve the history, we can use a \n\t# function\
    \ called readline_list_history(). However, this is only\n\t# available if PHP\
    \ has been compiled using libreadline. In most cases,\n\t# modern distributions\
    \ compile it using the compatible libedit library\n\t# for licensing and other\
    \ reasons. So we will keep a parallel copy of\n\t# the history in an array for\
    \ programatic access.\n\n\t$history[] = $line;\n\n\t# Now we decide what to do\
    \ with the users input. In real life, we may\n\t# want to trim(), strtolower()\
    \ and otherwise filter the input first.\n\n\tswitch ($line) {\n\n\t\tcase \"kill\"\
    :\n\t\t\techo \"You don't want to do that.\\n\";\n\t\t\tbreak;\n\n\t\tcase \"\
    destroy\":\n\t\t\techo \"That really isn't a good idea.\\n\";\n\t\t\tbreak;\n\n\
    \t\tcase \"obliterate\":\n\t\t\techo \"Well, if we really must.\\n\";\n\t\t\t\
    break;\n\n\t\tcase \"history\":\n\t\t\t# We will use the parallel copy of the\
    \ command history that we\n\t\t\t# created earlier to display the command history.\n\
    \n\t\t\t$counter = 0;\n\n\t\t\tforeach($history as $command) {\n\t\t\t\t$counter++;\n\
    \t\t\t\techo(\"$counter: $command\\n\");\n\t\t\t};\n\t\t\tbreak;\n\n\t\tcase \"\
    byebye\":\n\t\t\t# If it's time to leave, we want to break from both the\n\t\t\
    \t# statement and while loop, so break with a level of 2.\n\t\t\tbreak 2;\n\n\t\
    \tdefault :\n\t\t\t# Always remember to give feedback in the case of user error.\n\
    \t\t\techo(\"Sorry, \".$line.\" was recognised.\\n\");\n\t}\n}\n# If we reached\
    \ here, the user typed byebye. \necho(\"Bye, come again!\\n\");\n```\n\nYou may\
    \ have noticed that I chose to use `byebye` as the command to quit. This was not\
    \ just a whimsical choice on my part, but to illustrate the need about discoverability.\
    \ If you were presented with this program, without seeing the source code, and\
    \ asked to close it, you would likely try `quit`, `exit`, and so on before resorting\
    \ to a good `Ctrl-C`. In a GUI interface, you would have such problems when faced\
    \ with a button that said “Bye!”. With text input, it is best to stick to common\
    \ and memorable formats, provide visual guidance and clues where possible, and\
    \ aid in discoverability with a `help` command, and user training.\n\nThe PHP\
    \ CLI SAPI automatically opens the standard streams for you when script starts,\
    \ so there is no need to issue commands like `php://stdin`. You can treat these\
    \ streams like any other PHP stream, and start them straight away. We’ve included\
    \ some examples above, but here are a few more to illustrate.\n\n```php\n<?\n\
    # Get one line of input from STDIN\necho ('Please Type In : >');\n\n$line1 = fgets(STDIN);\n\
    echo ('**** Line 1 : ****\\n\");\n\n# Get one line of input, without the newline\
    \ character\necho ('Please Type Else In : >');\n\n$line2 = trim(fgets(STDIN));\n\
    echo ('**** Line 2 : ****\\n\");\n\n# Write an array out to STDOUT in CSV format.\n\
    # First, create an array of arrays...\n$records[] = array('User', 'Full Name',\
    \ 'Gender');\n$records[] = array('Rob', 'Aley', 'M');\n$records[] = array('Ada',\
    \ 'Augusta King, Countess of Lovelace', 'F');\n$records[] = array('Grete', 'Hermann',\
    \ 'F');\n\necho (\"The following is your Data in CSV format :\\n\\n\");\n\n# ...then\
    \ convert each array to CSV on the fly as we write it out\nforeach ($records as\
    \ $record) {\n\tfputcsv(STDOUT, $record);\n};\n\necho (\"\\nnEnd of your CSV data\\\
    n\");\n\n# Pause until the user enters something starting with a number\necho\
    \ ('Please type one or more numbers : >');\n\nwhile (! fscanf(STDIN, \"%d\\n\"\
    , $your_number) ) {\n\techo (\"No numbers found :>\");\n};\n\necho (\"Your number\
    \ was $your_number\\n\\n\");\n\n# Send the text of a web page to STDOUT\necho\
    \ (\"Press enter for some interwebs :\\n\\n\");\n\nfread(STDIN, 1); # fread blocks\
    \ until enter pressed\n\nfwrite(STDOUT, strip_tags( file_get_contents('http://www.cam.ac.uk')\
    \ ) );\n\n# Send an error message to STDERR. You can just fwrite(STDERR,...\n\
    # if you want, or you can use the error_log function, which uses the\n# defined\
    \ error handling routine. By default for the CLI SAPI this is\n# printing to STDERR.\n\
    \nerror_log('System ran out of beer. ABORT. ABORT.',4);\n```\n\nThe error logged\
    \ on the last line will usually appear in your shell along with the other output,\
    \ as that is where most shells put `STDERR` by default. If you want to check that\
    \ it did come via `STDERR` rather than `STDOUT`, the following bash command will\
    \ highlight any `STDERR` output (denoted by the `2>`) in red. It uses escape codes\
    \ to colour the error (31 sets the colour to red, 07 reverses it, then 0 clears\
    \ it):\n\n```bash\nphp script.php 2> >(while read errors; do echo -e \"\\e[07;31m$errors\\\
    e[0m\" \n\t>&2;  done)\n```\n\nIn short, we can use the standard streams in any\
    \ number of ways, often treating them as standard file pointers or streams.\n"
