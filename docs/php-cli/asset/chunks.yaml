  trans: "\n这四个参数允许你指定在 PHP 处理来自 `STDIN` 的输入之前、期间和之后执行的 PHP 代码。`-B` 指定在处理输入之前执行一行代码，`-R`\
    \ 指定在处理每一行输入时执行一行代码，而 `-F` 指定为每行输入执行一个 PHP 文件。最后，`-E` 在输入过程结束时执行一行代码。在 `-R` 和\
    \ `-F` 中，有两个特殊变量可用：`$argn` - 正在处理的行文本，以及 `$argi` - 正在处理的行行号。这在在 shell 脚本中直接使用\
    \ PHP 时非常有用。例如，要打印带有行号的文本文件，你可以 own 这样做：\n\n```\n1 ~$  cat my_text_file.txt |\
    \ php -B 'echo \"Lets add line numbers...\\n\";'\n2         -R 'echo \"$argi:\
    \ $argn\\n\";' -E 'echo \"That''s the end folks\\n\";'\n```\n\n输出结果如下：\n\n```\n\
    1 Lets add line numbers...\n2 1: Lorem ipsum dolor sit amet, consectetur adipisicing\
    \ elit, sed do \n3 2: eiusmod tempor incididunt ut labore et dolore magna aliqua.\
    \ Ut enim ad\n4 3: minim veniam, quis nostrud exercitation ullamco laboris nisi\
    \ ut aliquip\n5 4: ex ea commodo consequat. Duis aute irure dolor in reprehenderit\
    \ in \n6 That's the end folks\n```\n\n*   `-s` 或 `--syntax-highlight`\n\n这会输出\
    \ PHP 脚本的 HTML 版本，带有彩色的语法高亮。PHP 脚本不会被执行或验证，仅仅是进行“美化”。美化后的 HTML 打印到 STDOUT，这在检查代码以寻找错误、问题和优化时非常有用。这仅适用于文件中的\
    \ PHP，不适用于通过 `-r` 选项提供的代码。虽然大多数现代 IDE 和代码编辑器默认都提供语法高亮，但如果你只能通过命令行访问机器，且你使用的编辑器不支持语法高亮，这就会很有用。在这种情况下，使用\
    \ `-s` 创建脚本的彩色版本，如果机器安装了 Web 服务器，可以下载它或通过 浏览器查看。\n\n*   `-v` 或 `--version`\n\n\
    这会输出 PHP 版本信息。你也可以在上述的 `-i` 选项的输出中找到它。在假设特定格式时要小心，某些软件包仓库（例如 Ubuntu）会在版本字符串中包含它们的名称和自己的构建版本，因此不要仅对其过滤任何数字。\n\
    \n*   `-w` 或 `--strip`\n\n这会输出删除了任何不必要的空格和注释后的源代码内容。这只能用于代码文件（不适用于通过 `-r` 提供的代码行），且与上述语法高亮选项不兼容。这用于“压缩”文件，即减小文件大小。与流行观点相反，这不会加快大多数脚本的速度，因为解析注释和空格的开销微乎其微。即使保留了“完整”代码的副本，你也应该警惕支持和调试问题，因为错误报告中的行号在原始版本和剥离版本之间不再匹配。它也不会压缩变量名等标识符，因此不能用于混淆你的代码。\n"
- fmt: "As you can probably tell from the command line options in the previous section,\
    \ there are several different ways to execute PHP code when using the CLI SAPI.\
    \ Although we’ve covered a couple of these already, they are discussed here again\
    \ for completeness.\n\n#### 3.5.1 From a file\n\nYou can tell PHP to execute a\
    \ particular PHP source code file. For instance:\n\n```\n1 php myscript.php\n\
    2 php -f myscript.php\n```\n\nNote that `-f` is optional, the above two lines\
    \ are functionally equivalent. The `php` command line options detailed above,\
    \ where appropriate, work in this method. E.g.\n\n```\n1 ~$ php -e myscript.php\n\
    ```\n\nwill execute the file `myscript.php` in Extended Information Mode.\n\n\
    As with the web version of PHP, source files can be interpolated (mixed) with\
    \ HTML (or, more usefully on the command line, plain text). So you will still\
    \ need your opening `<?` or `<?php` tags, otherwise your source code will just\
    \ be printed straight out without being executed.\n\n#### 3.5.2 From a string\n\
    \nYou can execute a single line of code with the `-r` flag:\n\n```\n1 ~$ php -r\
    \ 'echo(\"Hello World!\\n\");'\n```\n\nMany of the other command line options\
    \ are not available with the `-r` method, such as syntax highlighting. Watch out\
    \ for shell variable substitution (use single quotes rather than double quotes\
    \ around your code) and other mangling of your code by the shell. Unless it really\
    \ is a quick one-off, it is likely safer and easier to pop the relevant line into\
    \ a file and execute that instead. One common use of the `-r` option is for executing\
    \ PHP generated by other (possibly non-PHP) shell commands where the whole shell\
    \ script needs to execute in memory without touching disk (for instance where\
    \ permissions prohibit disk write access).\n\n#### 3.5.3 From STDIN:\n\nIf you\
    \ do not specify a file or use the `-r` option, PHP will treat the contents of\
    \ `STDIN` as the PHP code to be executed, as shown here:\n\n```\n1 ~$ echo '<?\
    \ echo \"hello\\n\";?>' | php\n```\n\nYou can also use this method with `-B`,\
    \ `-R`, `-F` and `-E` to makes PHP a first class citizen in shell scripting, giving\
    \ you the ability to pipe data in and out of PHP. For instance, to reverse every\
    \ line of a file (or any data source that you pipe into it), use\n\n```\n1 ~$\
    \ cat file.txt | php -R 'echo strrev($argn).\"\\n\";' | grep php\n```\n\nIn this\
    \ line of code, we pipe the contents of a text file into PHP. The `-R` option\
    \ tells PHP to execute the following PHP code on each line of input, where the\
    \ line is stored in the special variable `$argn`. In this case, we reverse `$argn`\
    \ using the string reversing function `strrev()` and then echo the reversed string\
    \ out again. Any `echo`’d output goes to `STDOUT`, which is either printed to\
    \ the shell or, as in this case, can be piped to another shell command. In our\
    \ case we then use `grep` to only display the lines containing the string ‘php’,\
    \ which is ‘php’ backwards. More details on `-R` and its siblings are given in\
    \ the previous section.\n\nIf you want to use options like `-R`, but have too\
    \ much PHP code to fit comfortably on the command line, you can put the code in\
    \ a normal PHP source code file and `include()` it, e.g.\n\n```\n1 ~$ cat something.txt\
    \ > php -R 'include(\"complicated.php\");'\n```\n\nIf it is a non-trivial PHP\
    \ script, it may be more efficient to package it up into functions and include\
    \ it once with `-B` (`-B` means it’s executed before the main code), and then\
    \ execute the function each time with `-R`. The following example loads the content\
    \ of `my_functions.php` once at the start, and then the function `complicated()`\
    \ from that file is called on each line (each `$argn`) from the data file (`data.txt`).\n\
    \n```\n1 php -B 'include(\"my_functions.php\");' -R 'complicated($argn);'\n2\t\
    -f 'data.txt'\n```\n\nAlthough these commands look relatively simple, there is\
    \ of course no arbitrary limit to the PHP code you can put behind them. You can\
    \ use classes and objects, multiple files, and most of the code and techniques\
    \ explored in this book, exposing only functions or methods at the shell level\
    \ as an interface for the user. You can also open the standard streams as PHP\
    \ streams within PHP and access their file pointers to read data in, negating\
    \ the need to use `-R`, as discussed in the next chapter.\n\n#### 3.5.4 As a self\
    \ executing script: Unix/Linux\n\nOn Unix/Linux type systems you can make a PHP\
    \ script file into a directly executable shell command. Simply make the very first\
    \ line of the script file a `#!` line (usually pronounce “shebang line” or “hashbang\
    \ line”) with path to the PHP binary, e.g.\n\n```\n1 #!/usr/bin/php\n2 <?\n3\n\
    4 echo('Hello World!');\n```\n\nand set the executable bit using `chmod` or similar,\
    \ e.g.\n\n```\n1 ~$ chmod a+x myscript.php\n```\n\nThen simply typing `./myscript.php`\
    \ at the command line to execute it. You can also rename the file to remove the\
    \ `.php` extension (assuming you had one in the first place), so you would just\
    \ type\n\n```\n1 ~$ ./myscript\n```\n\nat the shell prompt to run it. You can\
    \ further simplify it to remove the initial `./` by moving it to a path.\n\n####\
    \ 3.5.5 As a self executing script: Windows\n\nIn a similar manner, scripts can\
    \ be executed by calling them directly under Windows. However, the process for\
    \ setting Windows up to do this is slightly more involved, requiring changes to\
    \ the Registry and file type associations. I therefore recommend reading the official\
    \ PHP documentation which covers this in detail.\n\n#### 3.5.6 Windows php-win.exe\n\
    \nPHP for Windows also ships with php-win.exe, which is similar to the CLI build\
    \ of PHP, except that it does not open a command line window. This is useful for\
    \ running system software in the background or running scripts which create their\
    \ own graphical interface.\n\n### 3.6 Quitting your script\n\nWe’ve looked at\
    \ starting your scripts, but what happens when it comes time to finish running\
    \ them?\n\nLike web based PHP scripts, CLI scripts will terminate happily when\
    \ we hit the end of the script file, and will tidy up all the resources used in\
    \ the same way. Likewise, if we want to end early, we can call the `exit` (or\
    \ equivalent `die`) language construct.\n"
