    如果你不熟悉的话，[Stack Overflow](http://stackoverflow.com) (stackoverflow.com) 是一个面向程序员、内容极其丰富的“问答”网站。与某些问答网站不同，你不需要加入或付费即可查看问题的答案，广告非常有限，而且板块上字面上就有数以百万计的已回答问题。其中包含了大量与
    PHP 相关的问题。


    所有问题和答案都根据主题标记了“标签”，以便你找到与你相关的内容。若要浏览标记有 PHP 标签的问题，请访问 [`stackoverflow.com/questions/tagged/php`](http://stackoverflow.com/questions/tagged/php)。你也可以使用网站的搜索功能，在搜索词中添加
    `[tag]` 以将范围缩小到仅包含 PHP 相关的答案。例如，如果你想搜索关于 `date` 函数的问题（该词在英语中是常用单词，也是许多编程语言中的常用函数名），请搜索
    `[php] date` 以仅获取 PHP 特有的信息。


    在编写本文时，有 864,182 个标记为 `php` 的问题，1,087 个标记为 `php` 且 `command-line` 的问题，以及 1,094
    个标记为 `php` 且 `cli` 的问题。版主通常关闭关闭重复问题，所以从这些数字中你可以看到有大量的相关信息可用。


    ## 其他书籍


    虽然你可能认为这是你需要的唯一一本 PHP 书籍，但我被告知市面上可能还有其他的 PHP 书籍。虽然我无法专门推荐任何书籍（除了我已经在相关章节中提到的那些之外），但如果你浏览任何大型书店，你会发现琳琅满目的
    PHP 相关书目。如果你确实想购买另一本书，并希望支持 PHP.net 项目，请通过 [`php.net/support.php`](http://php.net/support.php)
    书籍板块的链接进入一家知名书店，在你点击他们的链接后购买的任何物品，PHP.net 都将获得佣金。


    ## 新闻组 (Newsgroups)


    PHP 有一组官方的新闻组，列在 [`news.php.net/`](http://news.php.net/) 上并进行归档，涵盖了广泛的 PHP 主题领域。这些可能值得浏览，而且有时可以对查询做出回应（尽管某些内部列表绝对不适合胆小的人看）。


    ## PHP Reddit 版块 (Subreddit)


    reddit.com 上的 PHP “Subreddit”位于 [`www.reddit.com/r/PHP/`](http://www.reddit.com/r/PHP/)，它是
    PHP 新、观点、有用链接和求助的混合体。虽然这里通常非常有趣，并对问题提供有帮助的回答，但偶尔也能发现一些喷子以及无帮助/无礼的人。


    ## Github 上的 PHP


    有时解决问题的最佳方法是查看其他人编写的类似代码。Github 作为流行的源代码托管网站，有大量的内容供你挖掘。你可以在 [`github.com/search`](https://github.com/search)
    搜索所有代码仓库，并在搜索词中使用修符 `language:php` 将搜索结果缩小到使用我们最喜爱的语言的项目。如果你只想关注最近哪些 PHP 项目流行，可以查看
    [`github.com/trending?l=php`](https://github.com/trending?l=php) 上的 PHP 趋势列表。


    ## PHP 新闻网站


    尽管通常不便于寻求直接帮助，但 PHP 新闻网站和邮件列表可以让你了解基础动态，例如安全警报、有用且有趣的文章，以及你可能还不知道自己需要的新项目、库和教程的公告！一些较流行的网站列在下方。


