    PHP 社区成员写的文章，他们恰恰做了这些工作，可能会为你提供一些操作建议和涉及的陷阱提示。我建议在你尝试此之前，先彻底熟悉编译和安装 PHP、PHP 使用的文件和目录结构及位置，以及如何检查正在运行的是哪些版本的
