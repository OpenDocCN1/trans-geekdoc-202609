  trans: "\n正如你可能从上一节的命令行选项中看出的，在使用 CLI SAPI 时，有几种不同的方法可以执行 PHP 代码。虽然我们已经涵盖了其中几种，但为了完整起见，我们在这里再次讨论了它们。\n\
    \n#### 3.5.1 从文件执行\n\n你可以告诉 PHP 执行特定的 PHP 源代码文件。例如：\n\n```\n1 php myscript.php\n\
    2 php -f myscript.php\n```\n\n请注意 `-f` 是可选的，上述两行在功能上是等价的。上述详细的 `php` 命令行选项在适当的情况下也适用于此方法。例如：\n\
    \n```\n1 ~$ php -e myscript.php\n```\n\n将在扩展信息模式（Extended Information Mode）下执行\
    \ `myscript.php` 文件。\n\n与 PHP 的 Web 版本一样，源文件可以与 HTML（或在命令行上更有用的纯文本）进行插值（混合）。因此，你仍然需要你的起始标签\
    \ `<?` 或 `<?php`，否则你的源代码将直接被打印出来，而不会被执行。\n\n#### 3.5.2 从字符串执行\n\n你可以使用 `-r` 标志执行单行代码：\n\
    \n```\n1 ~$ php -r 'echo(\"Hello World!\\n\");'\n```\n\n许多其他命令行选项在 `-r` 方法中不可用，例如语法高亮。注意\
    \ shell 变量替换（在代码周围使用单引号而不是双引号）以及 shell 对你代码的其他形式篡改。除非这确实是一个快速的一次性任务，否则将相关行存入文件并改为执行该文件可能更安全、也更简单。`-r`\
    \ 选项的一个常见用途是执行由其他（可能非 PHP）shell 命令生成的 PHP 代码，其中整个 shell 脚本需要在内存中执行而不触碰磁盘（例如权限禁止磁盘写入访问的情况）。\n\
    \n#### 3.5.3 从标准输入（STDIN）执行：\n\n如果你不指定文件或不使用 `-r` 选项，PHP 将把 `STDIN` 的内容视为要执行的\
    \ PHP 代码，如下所示：\n\n```\n1 ~$ echo '<? echo \"hello\\n\";?>' | php\n```\n\n你还可以结合\
    \ `-B`、`-R`、`-F` 和 `-E` 使用此方法，使 PHP 成为 shell 脚本中的一等公民，让你能够将数据管道输入和输出到 PHP。例如，要反转文件的每一行（或任何管道到它的数据源），使用：\n\
    \n```\n1 ~$ cat file.txt | php -R 'echo strrev($argn).\"\\n\";' | grep php\n```\n\
    \n在这行代码中，我们将文本文件的内容管道到 PHP。`-R` 选项告诉 PHP 在每行输入上执行随后的 PHP 代码，该行存储在特殊变量 `$argn`\
    \ 中。在这种情况下，我们使用字符串反转函数 `strrev()` 反转 `$argn`，然后再次 `echo` 反转后的字符串。任何 `echo` 的输出都会进入\
    \ `STDOUT`，它会被打印到 shell 中，或者像在本例中这样可以管道到另一个 shell 命令。在我们的案例中，我们使用 `grep` 只显示包含字符串‘php’的行，即‘php’的反转字符串。关于\
    \ `-R` 及其兄弟选项的更多细节请见上一节。\n\n如果你想使用像 `-R` 这样的选项，但 PHP 代码太多无法方便地放在命令行中，可以将代码放在普通的\
    \ PHP 源代码文件中并 `include()` 它，例如：\n\n```\n1 ~$ cat something.txt > php -R 'include(\"\
    complicated.php\");'\n```\n\n如果这是一个复杂的 PHP 脚本，将其封装成函数并使用 `-B` 包含一次（`-B` 意味着在主代码之前执行）可能效率更高，然后使用\
    \ `-R` 每次执行该函数。以下示例在开始时加载一次 `my_functions.php` 内容，然后通过 `-R` 执行函数 `complicated()`：\n\
    \n```\n1 php -B 'include(\"my_functions.php\");' -R 'complicated();'\n2\tdata.txt\n\
    ```\n\n尽管这些命令看起来很简单，但你可以在后面放置的 PHP 代码没有限制。你可以使用类和对象、多个文件以及本书书中探讨的许多技术，并在 shell\
    \ 层级暴露函数或方法。我们还可以打开标准流作为 PHP 流来读写数据，这将在下一节中讨论。\n\n#### 3.5.4 作为可执行脚本：Unix/Linux\n\
    \n在 Unix/Linux 类型系统中，你可以将 PHP 脚本变为可执行的 shell 命令。只需在脚本文件的第一行使用 `#!` 行（通常称为“shebang\
    \ line”或“hashbang line”），并指向 PHP 二进制文件的路径，例如：\n\n```\n1 #!/usr/bin/php\n2 <?\n\
    3\n4 echo('Hello World!');\n```\n\n并使用 `chmod` 或类似的命令设置执行位，例如：\n\n```\n1 ~$ chmod\
    \ a+x myscript.php\n```\n\n然后在命令行中输入 `./myscript.php` 即可执行它。你也可以通过重命名文件移除 `.php`\
    \ 扩展（如果原本有的话），这样你只需要输入\n\n```\n1 ~$ ./myscript\n```\n\n在 shell 提示符处运行。你可以通过将其移动到路径来进一步简化\
    \ `./`。\n\n#### 3.5.5 作为可执行脚本：Windows\n\n类似地，Windows 下可以直接调用执行脚本。然而，设置 Windows\
    \ 执行此操作的过程要复杂一些，涉及注册表和文件类型关联。因此，我建议阅读官方 PHP 文档，它详细介绍了这一点。\n\n#### 3.5.6 Windows\
    \ php-win.exe\n\nWindows 版 PHP 还带有 php-win.exe，它与 PHP 的 CLI 版本类似，但不会打开命令行窗口。这对于后台运行系统软件或运行创建图形界面的脚本有用。\n\
    \n### 3.6 退出你的脚本\n\n我们已经了如何启动脚本，但在运行结束时会发生什么呢？\n\n像 Web 版 PHP 脚本一样，CLI 脚本在到达脚本文件末尾时会顺利终止，并以相同的方式清理所有使用的资源。同样，如果我们想提前结束，可以调用\
    \ `exit`（或等价 `die`）语言结构。\n"
- fmt: "\nHowever in the world of CLI scripts this isn’t considered very polite. Because\
    \ CLI command are designed to work together, often in chains of commands, most\
    \ shell programs and scripts will provide an “exit code” when they terminate to\
    \ let the other programs around them know *why* they finished. Were they done?\
    \ Did they encounter an error? Were they called incorrectly? Enquiring minds want\
    \ to know.\n\nIt is particularly important to supply an exit code when your script\
    \ may be the last item in a shell script, as the exit code of the shell script\
    \ as a whole is taken to be the last exit code returned within it. We can make\
    \ our PHP script provide an exit code, simply by including it as a parameter to\
    \ `exit` or `die`. An exit code is an integer, and there are a number of common\
    \ exit codes:\n\n* `0` : Success - we’ve exited normally.\n* `1` : General Error\
    \ - usually used for application/language specific errors and syntax errors\n\
    * `2` : Incorrect Usage\n* `126` : Command is not executable - usually permissions\
    \ related\n* `127` : Command Not Found\n* `128+N` (up to `165`): Command terminated\
    \ by POSIX Signal number N - e.g. In the case of `kill -9 myscript.php` it should\
    \ return code 137 (128+9)\n* `130` : Command terminated by Ctrl-C (Ctrl-C is POSIX\
    \ code 2, so as above 128+2 = 130)\n\nAny other positive integer is generally\
    \ construed as exiting due to an unspecified error. So, for instance, if you decide\
    \ the command line arguments provided by your user are not in the correct format,\
    \ you should terminate your script using `exit(2)`. If instead all goes well and\
    \ your script continues to the end of its script file, you can actually let it\
    \ exit by itself (or by calling `exit` without a parameter), as it returns status\
    \ code 0 by default.\n\nAs with web scripts, you can register functions to be\
    \ executed when your PHP script exits using the `register_shutdown_function()`\
    \ function. One use for this may be to check that all is well and evaluate which\
    \ exit code should be returned. The exit code used as the parameter to `exit`\
    \ or `die` within a registered shutdown functions overrides the code used in the\
    \ initial exit call that initiated shutdown. This means that you can happily `exit(0)`\
    \ everywhere, then `exit(76)` from your shutdown function if you detect that the\
    \ foo conflaganation isn’t aligned with the bar initispations in your metaspacialatific\
    \ object. Or similar.\n\n### 3.7 PHP REPLs\n\nWhen you want to test out a few\
    \ lines of PHP, your default instinct may be to create a new PHP file, save it,\
    \ and then execute it with PHP. There is a better, faster and more interactive,\
    \ way however. The PHP “Interactive Shell”, also known as the PHP REPL (Read-Eval-Print-Loop),\
    \ is a quick and easy way to type in code and have it execute immediately. Unlike\
    \ executing single lines of code using `php -r`, the REPL (started by calling\
    \ `php -a`) keeps the scripts state (e.g. contents of variables and objects) in-between\
    \ each line that you type, until you exit. You can use all of PHP’s functions,\
    \ although no libraries are loaded by default, and you can `include()` or `require()`\
    \ existing files of PHP code. This latter capability is useful for debugging the\
    \ final output of a problematic script; simply `include()` your script which will\
    \ execute the script and, as long as the script doesn’t terminate prematurely,\
    \ then you can `echo()` or `print_r()` or otherwise explore the state of the variables\
    \ and other resources at the end of the run. Other brands of REPL are available,\
    \ and are listed later in this section. By it’s nature, it can also be used as\
    \ a CLI / Shell in it’s own right, calling other PHP and non-PHP programs as you\
    \ would in, for instance, a bash shell.\n\nThe following example is a capture\
    \ of an actual interactive REPL session using the standard PHP REPL.\n\n```\n\
    \ 1 ~$ php -a\n 2 Interactive shell\n 3 \n4 php > # As we can type any valid PHP,\
    \ I have added comments\n 5 php > # directly to the REPL, rather than afterwards\
    \ in editing!\n 6 php > \n 7 php > # Lets start with some simple assignments :\n\
    \ 8 php > \n 9 php > $a = 5;\n10 php > $b = 6;\n11 php > \n12 php > # The REPL\
    \ will throw Notices, Warnings and Errors as appropriate, \n13 php > # in real-time\
    \ :\n14 php > \n15 php > $c = nothingdefined;\n16 PHP Notice:  Use of undefined\
    \ constant nothingdefined - assumed \n17 'nothingdefined' in php shell code on\
    \ line 1\n18 php > \n19 php > # Just as with normal PHP source files, we can split\
    \ commands across \n20 php > # lines. The interpreter only kicks in when it hits\
    \ the terminating \n21 php > # semicolon :\n22 php > \n23 php > $d \n24 php >\
    \ =\n25 php > 7\n26 php > ;\n27 php > \n28 php > # The following shows that the\
    \ state in the variables above has been\n29 php > # kept :\n30 php >\n31 php >\
    \ echo $a + $b + $c + $d .\"\\n\";\n32 18\n33 php >\n```\n"
  raw: "However in the world of CLI scripts this isn’t considered very polite. Because\
    \ CLI command are designed to work together, often in chains of commands, most\
    \ shell programs and scripts will provide an “exit code” when they terminate to\
    \ let the other programs around them know *why* they finished. Were they done?\
    \ Did they encounter an error? Were they called incorrectly? Enquiring minds want\
    \ to know.\n\nIt is particularly important to supply an exit code when your script\
    \ may be the last item in a shell script, as the exit code of the shell script\
    \ as a whole is taken to be the last exit code returned within it. We can make\
    \ our PHP script provide an exit code, simply by including it as a parameter to\
    \ `exit` or `die`. An exit code is an integer, and there are a number of common\
    \ exit codes :\n\n*   **0** : Success - we’ve exited normally.\n\n*   **1** :\
    \ General Error - usually used for application/language specific errors and syntax\
    \ errors\n\n*   **2** : Incorrect Usage\n\n*   **126** : Command is not executable\
    \ - usually permissions related\n\n*   **127** : Command Not Found\n\n*   **128+N**\
    \ (up to **165**): Command terminated by POSIX Signal number N - e.g. In the case\
    \ of `kill -9 myscript.php` it should return code 137 (128+9)\n\n*   **130** :\
    \ Command terminated by Ctrl-C (Ctrl-C is POSIX code 2, so as above 128+2 = 130)\n\
    \nAny other positive integer is generally construed as exiting due to an unspecified\
    \ error. So, for instance, if you decide the command line arguments provided by\
    \ your user are not in the correct format, you should terminate your script using\
    \ `exit(2)`. If instead all goes well and your script continues to the end of\
    \ its script file, you can actually let it exit by itself (or by calling `exit`\
    \ without a parameter), as it returns status code 0 by default.\n\nAs with web\
    \ scripts, you can register functions to be executed when your PHP script exits\
    \ using the `register_shutdown_function()` function. One use for this may be to\
    \ check that all is well and evaluate which exit code should be returned. The\
    \ exit code used as the parameter to `exit` or `die` within a registered shutdown\
    \ functions overrides the code used in the initial exit call that initiated shutdown.\
    \ This means that you can happily `exit(0)` everywhere, then `exit(76)` from your\
    \ shutdown function if you detect that the foo conflaganation isn’t aligned with\
    \ the bar initispations in your metaspacialatific object. Or similar.\n\n### 3.7\
    \ PHP REPLs\n\nWhen you want to test out a few lines of PHP, your default instinct\
    \ may be to create a new PHP file, save it, and then execute it with PHP. There\
    \ is a better, faster and more interactive, way however. The PHP “Interactive\
    \ Shell”, also known as the PHP REPL (Read-Eval-Print-Loop), is a quick and easy\
    \ way to type in code and have it execute immediately. Unlike executing single\
    \ lines of code using `php -r`, the REPL (started by calling `php -a`) keeps the\
    \ scripts state (e.g. contents of variables and objects) in-between each line\
    \ that you type, until you exit. You can use all of PHP’s functions, although\
    \ no libraries are loaded by default, and you can `include()` or `require()` existing\
    \ files of PHP code. This latter capability is useful for debugging the final\
    \ output of a problematic script; simply `include()` your script which will execute\
    \ the script and, as long the script doesn’t terminate prematurely, then you can\
    \ `echo()` or `print_r()` or otherwise explore the state of the variables and\
    \ other resources at the end of the run. Other brands of REPL are available, and\
    \ are listed later in this section. By it’s nature, it can also be used as a CLI\
    \ / Shell in it’s own right, calling other PHP and non-PHP programs as you would\
    \ in, for instance, a bash shell.\n\nThe following example is a capture of an\
    \ actual interactive REPL session using the standard PHP REPL.\n\n```\n 1 ~$ php\
    \ -a\n 2 Interactive shell\n 3 \n 4 php > # As we can type any valid PHP, I have\
    \ added comments\n 5 php > # directly to the REPL, rather than afterwards in editing!\n\
    \ 6 php > \n 7 php > # Lets start with some simple assignments :\n 8 php > \n\
    \ 9 php > $a = 5;\n10 php > $b = 6;\n11 php > \n12 php > # The REPL will throw\
    \ Notices, Warnings and Errors as appropriate, \n13 php > # in real-time :\n14\
    \ php > \n15 php > $c = nothingdefined;\n16 PHP Notice:  Use of undefined constant\
    \ nothingdefined - assumed \n17 'nothingdefined' in php shell code on line 1\n\
    18 php > \n19 php > # Just as with normal PHP source files, we can split commands\
    \ across \n20 php > # lines. The interpreter only kicks in when it hits the terminating\
    \ \n21 php > # semicolon :\n22 php > \n23 php > $d \n24 php > =\n25 php > 7\n\
    26 php > ;\n27 php > \n28 php > # The following shows that the state in the variables\
    \ above has been\n29 php > # kept :\n30 php >\n31 php > echo $a + $b + $c + $d\
    \ .\"\\n\";\n32 18\n33 php > \n34 php > # Next, a more interesting example. Use\
    \ the REPL instead of the \n35 php > # shell to get the first line from a file\
    \ :\n36 php > \n37 php > echo file ('/proc/version')[0];\n38 Linux version 3.5.0-21-generic\
    \ (buildd@roseapple) (gcc version 4.7.2 \n39 (Ubuntu/Linaro 4.7.2-2ubuntu1) )\
    \ #32-Ubuntu SMP Tue Dec 11 18:52:46 UTC \n40 2012\n41 php >\n42 php > # Of course\
    \ all of the usual protocol wrappers are available, so we \n43 php > # can see\
    \ what is happening in the world...\n44 php > \n45 php > $page = file ('http://news.bbc.co.uk');\n\
    46 php > \n47 php > echo $page[0];\n48 <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML+RDFa\
    \ 1.0//EN\" \"http://www.w3.org/\n49 MarkUp/DTD/xhtml-rdfa-1.dtd\">\n50 php >\
    \ \n51 php > # and maybe get a hash of that...\n52 php > \n53 php > echo md5 (\
    \ implode ( $page, \"\\n\" ) ) . \"\\n\";\n54 0319bf4e62db39fb2c89210e48783d70\n\
    55 php > \n56 php > # when we are done ...\n57 php > \n58 php > exit;\n59 php\
    \ > \n60 php > # doesn't work, as its just evaluated as PHP (and the REPL ignores\n\
    61 php > # exit/die calls. To exit the REPL, enter the word 'exit' on its own\n\
    62 php > # on a new line\n63 php > \n64 php > exit\n65 ~$\n```\n\nSometimes you’ll\
    \ want to execute your commands within the “environment” of other scripts. For\
    \ instance, you may have a script that declares constants, sets up database connections\
    \ and does other routine tasks that you normally `include()` at the start of your\
    \ main PHP scripts. As noted above you can `include()` these files in the REPL\
    \ too, but you may forget to do so and then wonder why things didn’t work as they\
    \ should. One facility PHP offers us, which applies not only to the REPL but to\
    \ all forms of PHP execution, is the `auto_prepend_file` configuration directive.\
    \ This tells PHP to execute a given file each time PHP is run before it starts\
    \ to do anything else (like executing the script you have asked it to). This can\
    \ either be set in php.ini, or via the `-d` flag on the command line. The following\
    \ is an example of presetting some constants/variables. First, we create a script\
    \ called `initialise.php` with the following content.\n\n```\n1 <?\n2 \n3 const\
    \ FOUR = 4; # Declare a constant value\n4 \n5 $five = 5; # Instantiate a variable\
    \ with another value\n```\n\nand then, at the command line, start and run a REPL\
    \ session as follows, using `-d` to execute the `initialise.php` script first.\n\
    \n```\n1 $> php -d auto_prepend_file=initialise.php -a\n2 Interactive shell\n\
    3 \n4 php > echo (FOUR + $five).\"\\n\";\n5 9\n6 php > exit\n7 $>\n```\n\nAs you\
    \ can see, the constant and variable we had set up in the initialise.php file\
    \ were available for use from the REPL without having to manually declare them.\
    \ The `-d` flag is used here, but the option could be set in php.ini as well if\
    \ you want to always use the same file. If you regularly use a few different initialisation\
    \ files like this, you can create shell aliases to commands using the `-d` flag.\
    \ For instance, you could add lines similar to the following to your `~/.bash_profile`:\n\
    \n```\n1 alias php-cl=\"php -d auto_prepend_file=clientSetup.php -a\"\n2 alias\
    \ php-in=\"php -d auto_prepend_file=ourSiteSetup.php -a\"\n```"
