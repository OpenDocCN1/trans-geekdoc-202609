  trans: "\n\n有一些预先写的库/组件可以使用，可以减少创建交互式控制台软件的工作量。我在下面列出了三个常用的库。与大多数此类库一样，它们对程序的结构组织有非常“主观性”的见解，因此在选择最适合你项目的库之前，请务必彻底阅读每个库的文档。Symfony\
    \ console（Symfony Framework 项目的一部分）经过了充分测试，非常稳定，与大多数 Symfony 组件一样，它拥有良好的文档说明和支持。如果你熟悉\
    \ Symfony Framework，那么这种代码风格会让你很熟悉，但它与其他框架也同样游刃有（它被用于 Laravel Framework 的 Artisan\
    \ Console 工具）。Webmozart Console 工具包是 Symfony Console 组件的重构版本，因此具有相似的功能，但编码风格有所不同。它目前仍处于\
    \ Beta 阶段。最后，Hoa Console 可能是这三者中最独特的，它的编码风格侧重于真实世界的任务，对于开发者来说可能更容易上手。\n\n# 5.\
    \ PHP CLI 脚本与你的系统\n\nPHP CLI 脚本通常与你的系统交互涉及多个领域。虽然大多数系统交互与你在 Web 脚本中习惯的相同，但有几个领域你可能没有用过，我们将查看一些可能会让你困惑的坑（gotchas）。\n\
    \n## 5.1 从 PHP 启动外部进程，或“调用 shell”（shelling out）\n\nCLI 脚本的一个常见功能是调用并与其他脚本及进程交互。在脚本中使用其他脚本和程序作为“构建块”是\
    \ CLI 编程的一种常见模式。正如我们之前看到的，你通常可以将你的 PHP 脚本与其他通用的 shell 脚本结合，但通常让 PHP 脚本本身在需要时启动其他软件也往往是很有用的。这通常被称为“调用\
    \ shell（shelling out）”。\n\nPHP 提供了许多函数来实现这一目标，每个函数的实现方式略有不同，且具有不同的优处：\n\n* `exec()`：执行程序并将文本输出发送给用户\n\
    * `passthru()`：执行程序并将二进制输出发送给用户\n* `system()`：执行程序并收集输出供 PHP 使用\n* `shell_exec()`：通过\
    \ shell 执行命令并收集其输出供 PHP 使用\n* 反引号运算符（例如 `\\`command\\``）：与上述的 `shell_exec()` 相同\n\
    * `pcntl_exe()`：在当前进程空间中执行程序，也就是说，它会停止当前的 PHP 脚本并用指定的程序替换它\n* `popen()`：执行程序并打开一个文件指针（与\
    \ `fopen()` 返回的指针相同），通过 STDOUT 或 STDIN 对进程进行读取或写入。只能读或写，不能兼顾。\n* `proc_open()`：类似于\
    \ `popen()`，但具有更多控制权。允许同时读取和写入。使用起来没有 `popen()` 那么简单。\n\n选择哪种方法取决于你打算对新打开的进程做什么，以及你如何（或者实际上是否）想与其通信。如果你无法根据上面的描述确定哪个函数适用于你的用途，下方的“延伸阅读”列表提供了一些提示、信息和实现示例，应该能给你提供方向。\n\
    \n调用外部脚本时，请记住在命令名或选项中使用不可信的用户输入是安全灾难的来源！`escapeshellarg()` 函数可以保护你免受一些无意错误，但不能阻止你执行“坏”函数或文件。\n\
    \n## 5.2 文件状态和 Realpath 缓存\n\n在 Web 世界，速度就是王道。PHP 运行两个信息缓存来加速文件系统的访问。第一个是文件状态缓存，它缓存有关给定文件的信息（例如是否存在、是否可读、大小和类型等）。第二个是\
    \ realpath 缓存，它缓存给定文件或目录的实际路径（展开符号链接、相对路径、`.` 和 `..` 路径、include_path 等）。PHP 每当遇到新文件时都会自动将信息添加到缓存中，在下一次任何数量函数尝试查看该相同文件时，这些信息就会被使用。对于一个转瞬即逝的网页来说，由于文件系统可能没有发生什么变化，这通常是提高性能的一种很好的权衡。\n\
    \n然而，在你的脚本运行期间，文件或路径细节发生更改的概率显然随着脚本执行时间的增加而增加。因此，PHP 为我们提供了处理这两个缓存的选项。\n\n下面的示例展示了文件状态缓存的作用，以及如何使用\
    \ `clearstatcache()` 来清空它。\n\n```\n 1 <?\n 2 \n 3 # 创建一个文件并为其添加一些文本\n 4 \n 5 $filename\
    \ = 'test.txt';\n 6 \n 7 $handle = fopen($filename, 'w+');\n 8 \n 9 fwrite($handle,\
    \ 'test');\n10 \n11 # 下面应该打印 4\n12 \n13 echo stat($filename)[\"size\"].\"\\n\"\
    ;\n14 \n15 # 现在向文件写入一些数据，增加文件大小。\n16 \n17 fwrite($handle, 'more test');\n18 \n\
    19 # 直觉上，下面的命令应该打印 13，因为文件现在\n20 # 比之前大了。然而，它仍然打印 4，因为这个文件的 filesize\n21 # 值现在被缓存了。\n\
    22 \n23 echo stat($filename)[\"size\"].\"\\n\";\n24 \n25 # 如果我们清空缓存……\n26 \n27\
    \ clearstatcache();\n28 \n29 # 那么下一行应该如预期打印 13\n30 \n31 echo stat($filename)[\"\
    size\"].\"\\n\";\n32 \n33 fclose($handle);\n```\n\nrealpath 缓存的工作方式类似，可以通过调用 `clearstatcache(true)`\
    \ 来清空，即通过将第一个参数设置为 true 来调用它。你也可以通过调用 `clearstatcache(true, 'myfile.txt')` 只清除一个文件的缓存，其中第二个参数是文件名（第一个参数必须设置为\
    \ true）。\n\n当然，在你的应用程序中可能没有必要清除这些缓存，而且这样做会有性能影响。请根据具体情况考虑每次文件访问。\n\n### 5.3 APC\
    \ 和其他代码缓存\n\n你可能已经知道 APC 缓存系统和其他用于加速脚本启动时间的代码缓存系统。APC 以及大多数其他系统不适用于 CLI 脚本（或者至少不会产生任何收益），因为它们基于\
    \ Apache 等 Web 服务器找到的共享进程模型。由于 PHP CLI 脚本（通常）在完成后会终止自己的进程，这些系统无法工作。\n\n# 6. 现在去哪里？或者，感谢与反馈\n\
    \n如果你读到了这里，感谢你。我诚地希望这本书能引起你的兴趣，至少为你未来的 PHP 编程提供信息。如果是这样，我鼓励你现在就根据书中的一个或多个主题开始编码，让它们在你的记忆中保持新鲜。比我聪明得多的人已经证明，学习后越早进行相关活动，越容易越长期保留信息和技术。如果你在“现实生活”中使用了书中提到的任何技术，我将非常想知道！最后，如果你还没有走向键盘，不要忘记浏览一下后面的附录。那里可能有对你来说有趣或实用的东西（无论现在使用还是未来以后了解）。\n\
    \n## 6.1 升级到“PHP Beyond The Web”仅需 5 美！\n\n"
- fmt: "\nThe content in this book is an adapted subset of one of another book I wrote\
    \ called “PHP Beyond The Web”. As well as CLI scripts, it covers the many other\
    \ things you can do with PHP including (but not limited to) writing software daemons,\
    \ desktop GUI applications, interface with other software processes and hardware\
    \ like printers, and even control electronics with a Raspberry Pi. It also looks\
    \ further into topics like performance, development tools, garbage collection\
    \ and other topics that get more revelant when you build big off-line systems.\n\
    \nAs a reader of this book, you can check out a sample, peruse the table of contents\
    \ and can get PHP Beyond The Web for only $5 USD (+VAT where applicable) from\
    \ Leanpub simply by visiting [http://leanpub/php/c/upgrade](http://leanpub/php/c/upgrade).\
    \ And even at that price, it still comes with the Leanpub unconditional, no risk,\
    \ 100% happiness guarantee, which is a long way of saying an unconditional 45-day\
    \ two-click refund.\n\n## 6.2 Giving feedback, and getting help and support\n\n\
    E-mail : `author@phpbeyondtheweb.com`\n\nYour feedback on this book, good or bad,\
    \ fundamental or trivial, is solicited and very much welcomed. Tell me what you\
    \ thought about the book, overall or a particular section. Let me know if any\
    \ areas weren’t covered in enough depth (or in too much detail), if any topics\
