    \ `./` by moving it to a directory somewhere in your shell’s search path. Note\
    \ that when running a script in this manor, any command line options are passed\
    \ directly to the script and not to PHP. In fact, you cannot pass extra command\
    \ line parameters to PHP at runtime using this method, you must include them in\
    \ the “shebang” line when constructing your script. For instance, in the example\
    \ above, if you wanted to use “Extended Information Mode”, you would alter the\
    \ first line of the script to read:\n\n```\n1 #!/usr/bin/php -e\n```\n\nIf you\
    \ were to instead call the script as follows :\n\n```\n1 ~$ myscript -e\n```\n\
    \nthen the `-e` flag would be passed as an argument to the script, not to PHP\
    \ directly, and so PHP would not enter EIM. This is useful for scripts that have\
    \ lots of user supplied arguments, but also makes options like `-B` and `-R` discussed\
    \ in the method above cumbersome to use for processing `STDIN` data, as you have\
    \ to include all of the PHP on the shebang line where it is harder to change.\
    \ However you can simply `include()` the necessary files and use standard file\
    \ streams to process the `STDIN` stream (created and opened by the CLI SAPI automatically\
    \ for you) line by line instead.\n\nIf your script may be used on other systems,\
    \ please bear in mind that the PHP binary will quite often be located in a different\
    \ directory to the one on your system. In this scenario, you will need to change\
    \ the shebang line for each system if you hard-code the location in it. Fortunately,\
    \ if installed correctly, PHP sets an environment variable with its location,\
    \ available via the `/usr/bin/env` shell command. So if you change the shebang\
    \ line as follows, your script should be executable wherever PHP is located :\n\
    \n```\n1 #!/usr/bin/env php\n```\n\nOn Windows, the “shebang” line can be left\
    \ in, as PHP will recognise it and ignore it. However it will not execute the\
    \ file as it does on \\*nix.\n\n#### 3.5.5 As a self executing script : Windows\n\
    \nIn a similar manner, scripts can be executed by calling them directly under\
    \ Windows. However, the process for setting Windows up to do this is slightly\
    \ more involved, requiring changes to the Registry and file type associations.\
    \ I therefore recommend reading the official PHP documentation which covers this\
    \ in detail.\n\n#### 3.5.6 Windows php-win.exe\n\nPHP for Windows also ships with\
    \ php-win.exe, which is similar to the CLI build of PHP, except that it does not\
    \ open a command line window. This is useful for running system software in the\
    \ background or running scripts which create their own graphical interface.\n\n\
    ### 3.6 Quitting your script\n\nWe’ve looked at starting your scripts, but what\
    \ happens when it comes time to finish running them?\n\nLike web based PHP scripts,\
    \ CLI scripts will terminate happily when we hit the end of the script file, and\
    \ will tidy up all the resources used in the same way. Likewise, if we want to\
    \ end early, we can call the `exit` (or equivalent `die`) language construct."
