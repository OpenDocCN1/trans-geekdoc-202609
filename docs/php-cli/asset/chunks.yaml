    \ of the loop.\n\nwhile (1) {\n\n\t# Each time we go through the loop, we want\
    \ to check if the user has\n\t// pressed enter while we were in the last loop.\
    \ Remember that\n// ... (rest of the logic follows similarly)\n}\n```\n"
