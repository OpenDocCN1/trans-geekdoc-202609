- fmt: '

    Hopefully I’ve sold you on the story that PHP is a cross-platform, rapid-development
    focused, versatile language and is ideal for many different types of software.
    The aim of this book is to give you, the PHP coder, an insight into one specific
    type of software : using PHP to build command line tools that live beyond the
    web. I’ll show you the essential ingredients needed to transform your existing
    web based PHP skills to the command line, to allow you to get up and running as
    quickly as possible with the tools you already know.


    And if this book whets your appetite for web-less PHP programming, you can get
    a large discount on “PHP Beyond The Web”, my other book that covers many more
    types of PHP software and off-line programming topics. See the last Chapter for
    details.


    ## 1.2 Are you new to PHP?


    This book is aimed at showing PHP developers how they can use their existing skills
    to write CLI software instead of web pages. However I appreciate that some readers
    may be new to PHP and are reading this book to get a feel for what PHP is capable
    of. If you’re already a programmer, albeit not well versed in PHP, the comprehensive
    official `PHP` manual may be the best place to begin to get a feel for the differences
    between `PHP` and the languages you are used to.


    If you’re not already a programmer, there are numerous “beginning PHP” books available
    from your favourite e-book retailer. In either case, the wider web also provides
    its usual breadth of in-depth knowledge and tutorials, just a judicious google
    away.


    And finally, newcomer or experienced programmer, if you’re thinking of getting
    serious about `PHP`, it may be worth having a look at some `PHP` “best practice”
    websites before diving headlong into coding. It may save you a lot of trouble
    in the long run


    ## 1.3 Reader prerequisites. Or, what this book isn’t


    To make the most of this book, you should have basic experience of programming
    in `PHP` (most likely for the web), a general programming or IT background, and
    a willingness to learn and be taken outside of your comfort zone.


    This book isn’t an introduction to `PHP` or programming in general. Although you
    don’t need a computing degree or knowledge of advanced programming concepts, the
    book is hopefully pitched to the level of an average `PHP` programmer (one who
    has explored more than the very basics of `PHP`) and tries to explain any necessary
    concepts as we go along. It is also useful for advanced programmers who may choose
    to use it as a quick reference for exploring the `PHP CLI` features.


    ## 1.4 An important note for Windows and Mac users


    Most of the examples given in the book are run and tested under Linux (the latest
    Ubuntu Desktop/Server flavour in most cases). `PHP` runs on many operating systems,
    including `MS Windows` and `Apple OS X`, and code often runs in an identical manner.
    However there are, of course, differences due to the file system, OS, available
    libraries etc., but to cover this all in this book would not be practical. In
    addition, some features such as those reliant on `POSIX` standards aren’t (easily)
    available on some systems like `Windows`. As `OS X` was derived from a `POSIX`
    compliant operating system, you will likely find more of the code compatible than
    with `Windows`, but your experience may still vary. A good source of information
    for OS specific issues is the official `PHP` online manual, and in particular
    the user comments at the bottom of each page. Where possible areas specific to
    these other OSes have also been covered, for instance we will look at how to access
    the `Windows Registry`.


    ## 1.5 About the sample code


    As you’ll see throughout the book I mainly use “traditional” imperative/procedural
    `PHP` in my coding examples to keep things as simple as possible for coders of
    all abilities. This book isn’t designed to be a lesson in coding best practices
    or style, a guide to `OOP` programming or to push any kind of programming model
    or dogma. I also avoid the use of any code frameworks. Many frameworks are based
    around the web model and don’t always perform as intended in the kind of applications
    we’ll be looking at, although some do now have “console” or “cli” modules. `MVC`
    style frameworks can be useful when building GUI applications (indeed the `MVC`
    paradigm pre-dates the web considerably!), but because of the many different implementation
    details and styles we’ll stick to framework-less code here.


    It should be clear from the plain, straightforward `PHP` code presented how it
    can be used or adapted to suit your own programming style, framework or model.
    We will be mainly looking at task specific implementation details, leaving the
    hot topic of programming itself to the many other books available.


    All of the sample `PHP` source code in this book is available for you to use and
    with as as you please without limit or license. Use or abuse it as you see fit!


    If you have trouble running or understanding the sample code, see the feedback
    section in the last chapter of this book for details on how to contact the author
    for help.


    ## 1.6 External resources


    Through out the book we will point you in the direction of external tools, resources
    and information, in one of two ways :


    ## 1.7 English. The Real English.


    Just a quick note to say that, no, those aren’t spelling mistakes, it’s British
    English (you know, the one that kicked it all off) as your humble author hails
    from the other side of the pond. Deal with it, we spell things differently. Any
    genuine spelling mistakes you spot will be dismissed as part of an evolving language,
    and then quietly fixed while you’re not looking.


    ## 2. Getting away from the Web - an overview of CLI programming in PHP


    This chapter takes a look at the basic steps involved in breaking free from the
    web with `PHP`. We’ll cover the technical steps involved, and also the differences
    in programming practises and focus.


    ## 2.1 PHP without a web server


    Most `PHP` programmers have used `PHP` strictly in a web-server environment. In
    such an environment `PHP` is a `CGI/Fast GGI` or server module, called and controlled
    by the `HTTP` server (usually `Apache`, `IIS`, `Nginx` or similar). The `HTTP`
    server receives a request for a `PHP` based web page and calls the `PHP` process
    to execute it, which usually returns output back to the `HTTP` server to be sent
    on to the end user.


    There have been a number of attempts to create local applications (scripting systems,
    desktop apps and so forth) with `PHP` using a locally installed web server, with
    some success. However the downsides of using this web-type model for local apps
    are numerous:


    *   For the value they provide in these scenarios, web servers such as `Apache`
    are often very over specified and resource hungry

    *   Unless properly locked down, a web server running locally introduces a point
    of access to your machine for malicious visitors from the outside world

    *   `HTTP` is a verbose protocol and (arguably) ideally suited for the web, however
    it’s often overkill for local inter-process communication and adds another resource
    and complexity overhead to your application

    *   Your application interface typically runs in a web browser, and therefore
    looks anything but local (and comes with additional support/upgrade headaches
    unless you install a browser specifically for your app)


    `PHP`, as of version `5.4`, includes a built-in web-server which removes some
    of the problems described above. However it was designed for local testing of
    `PHP` scripts designed to be deployed on a fully-fledged `HTTP` server such as
    `Apache` in a live environment. It is a route that can be explored for some local
    apps, particularly where you want to run a private instance of a `PHP` web app
    that already exists. However its stability, reliability and suitability for production-ready
    local apps is yet to be proven, and it still comes with the baggage of `HTTP`
    and web browsers.

    '
