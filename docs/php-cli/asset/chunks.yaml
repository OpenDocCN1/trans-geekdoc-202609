    \ &\n// buffering functions (http://www.php.net/manual/en/book.outcontrol.php)\n\
    // which may or may not be desirable.\n\nfwrite(STDOUT, \"Press Enter To Begin,\
    \ And Enter Again To End\");\n\n# Now we wait for the user to press enter. By\
    \ default, STDIN is\n// a blocking stream, which means that when we try to read\
    \ from it,\n// our script will stop and wait some input. Keyboard input to the\
    \ shell\n// is passed to our script (via fread) when the user presses Enter.\n\
    \nfread(STDIN,1);\n\n# We want the program to run until the user presses enter\
    \ again. This\n// means that we want to periodically check for input with fread,\
    \ but not\n// to pause/block the program if there isn't any input. So we set STDIN\
    \ to\n// be non-blocking.\n\nstream_set_blocking(STDIN, 0);\n\n# In preparation\
