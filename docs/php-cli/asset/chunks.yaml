  trans: '

    要使用 PHP CLI SAPI，你可能需要先安装它。附录 A 提供了关于安装（以及在必要时编译）PHP 的细节。不过，如果你已经安装了 PHP，可能会发现它已经安装了（通常在
    PHP 程序目录中名为 `sapi/cli` 的文件夹下），如果没有，它通常在现代操作系统的软件仓库中可用（例如，在 Ubuntu 中，有一个名为 `php5-cli`
    的包，可以通过任何包管理器或通过命令行使用 `sudo apt-get install php5-cli` 进行安装）。如果它已安装在命令行搜索路径中，在命令行中输入
    `php -v` 将打印版本详情，确认它确实已安装。


    ### 3.3 PHP 命令行选项


    PHP 二进制文件将接受许多命令行选项/开关/参数，这些选项会影响它的运行。可以通过输入 `php -h` 查看完整列表。虽然某些选项仅适用于 CGI SAPI（当没有“模块”时使用，例如没有
    PHP Apache 模块时），但以下是用于在与 CLI SAPI 交互时一些有趣且常用的选项：


    #### `-f` 或 `--file`


    - 这允许你指定要运行的脚本文件名，它是可选的。存在 `-f` 选项是为了兼容某些软件和脚本（例如自动化软件，可以通过编程方式调用命令行程序，但要求以这种方式形成文件名参数）。它还允许在
    Windows 上为 PHP 脚本轻松设置默认文件类型处理器。上述两个版本命令在用法上的唯一真实区别在于解释传递给脚本的命令行参数，我们将在下文的“你的脚本的命令行参数”部分中查看这一内容。在大多数情况下，以下两行代码大部分是等价的：


    ```

    1 ~$ php -f myscript.php

    2 ~$ php myscript.php

    ```


    #### `-a` 或 `--interactive`


    - 以交互模式运行 PHP。这允许你逐行输入 PHP 代码，而不是执行一个已保存的 PHP 脚本。这种运行模式通常被称为“REPL”（读取-评估-打印-循环）。除了为测试和开发代码提供交互式界面外，它还可以作为一个增强的
    PHP 启用 shell 或命令行，我们将在本章稍后的部分进行详细讨论。


    #### `-c` 或 `--php-ini`


    - 指定 PHP 为此应用使用的 PHP ini 文件。如果你在同一台机器上还使用 PHP 运行 Web 服务，这特别有用，因为如果没有指定，PHP 将在多个默认位置查找
    `php.ini`，并最终可能与你的 Web 服务使用同一个。通过为你的 CLI 应用提供一个特定的文件，你可以“开启”各种更符合离线应用程序的限制。请注意，通过使用
    CLI SAPI，无论你是否使用此选项指定了自定义 ini 文件，PHP 都会自动覆盖几个 `php.ini` 设置。这些被覆盖的设置会影响上述“CLI SAPI
    有何不同？”中列出的行为，虽然在这些情况下 `php.ini` 文件被忽略，但你可以在代码中使用 `ini_set()` 函数或类似函数直接还原或更改这些设置。你还可以使用
    `-d` 或 `--define` 选项来设置选项（例如 `php -d max_execution_time=2000 myscript.php`）。如果你将软件部署到你无法控制的机器上（例如，如果你正在销售软件让用户安装在自己的机器上），那么使用这些机制之一来确保
    PHP 以你预期的设置运行，而不是用户可能恰好拥有的设置。请同样参见下文的 `-n`。


    #### `-n` 或 `--no-php-ini`


    - 这告诉 PHP 不要加载任何 `php.ini` 文件。如果你不想随应用程序分发一个文件，而是希望在代码中使用 `ini_set()` 或类似函数直接设置所有配置，这就会很有用。如果没有提供
    ini 文件，PHP 将使用其默认设置。


    #### `-e` 或 `--profile-info`


    - 将 PHP 放入“扩展模式”。它为分析器和调试器生成额外信息。关于分析器和调试器的更多信息可以在下一章中找到。在使用分析器或调试器时，启用此模式可能会影响性能。


    #### `-i` 或 `--info`


    - 调用 `phpinfo()` 函数并输出。这输出关于 PHP 安装的大量信息，采用纯文本格式而不是 HTML（假设我们从 CLI 调用它）。这对于追踪问题非常有用，提供了版本信息、扩展列表等。与其他任何
    shell 命令一样，输出可以管道到其他命令，例如你可以尝试：


    ```

    1 ~$ php -i | grep "ipv6"

    ```


    #### `-l` 或 `--syntax-check`


    - 解析文件并检查语法错误。这是一个基础的“语法”检查器，更高级的代码分析工具将在下一章讨论。请注意，此选项只检查语法错误，不会执行代码。某些 IDE 和文本编辑器会在你输入时在后台运行
    `php -l`。例如，Atom 编辑器中的 linter-php 插件就使用这种方法进行实时检查。


    #### `-m` 或 `--modules`


    - 列出所有加载的 PHP 模块/扩展。这些是 PHP 时的模块，可能包括“core”、“mysql”、“PDO”、“json”等。对于检查 PHP 安装是否具有应用程序所需的功能非常有用。你也可以在脚本内部使用
    `extension_loaded()` 函数或调用 `phpinfo()` 函数进行检查。`-m` 提供了上述 `-i` 标志信息的子集，而 `-i` 则将返回更多关于模块的配置、版本等信息。


    #### `-r` 或 `--run`


    - 运行作为参数提供的 PHP 代码，而不是从文件执行。代码行应该用单引号括，因为像 bash 这样的 shell 会尝试对双引号变量进行插值。这与 `-a`
    交互模式的作用相似，只是每执行一行后，PHP 的“状态”都会清除。这意味着提供的代码行被视为要执行的整个脚本，并在运行后终止。示例如下：


    ```

    1 ~$ php -r ''echo (2+2)."\n";''

    ```


    注意，该行必须是语法上正确的 PHP 代码，所以不要漏掉结尾的分分号！我们将在本章稍后的“调用 PHP 脚本的多种方法”部分重新回到 `-r`。


    #### `-B` 或 `--process-begin`


    #### `-R` 或 `--process-code`


    #### `-F` 或 `--process-file`


    #### `-E` 或 `--process-end`

