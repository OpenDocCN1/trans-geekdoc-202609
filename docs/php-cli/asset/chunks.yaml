    希望我已经让你信服了这一观点：PHP 是一种跨平台、专注于快速开发且功能多样的语言，非常适用于许多不同类型的软件。本书的目的是让你——作为 PHP 程序员——深入了解一种特定类型的软件：使用
    PHP 构建超越 Web 领域的命令行工具。我将向你展示将现有的基于 Web 的 PHP 技能转换为命令行技能所需的要素，以便你能够利用已有的工具尽可能快地上手并运行。


    如果这本书激发了你对非 Web 化 PHP 编程的兴趣，你可以购买我的另一本书《PHP Beyond The Web》，并获得大折扣，那本书涵盖了更多类型的
    PHP 软件和离线编程主题。详情请参阅最后一章。


    ## 1.2 你是 PHP 新手吗？


    本书旨在向 PHP 开发者展示他们如何利用现有技能编写 CLI 软件而不是网页。不过，我理解有些读者可能是 PHP 新手，他们阅读此书是为了初了解 PHP
    的能力。如果你已经是一名程序员（尽管不精通 PHP），全面的官方 `PHP` 手册可能是你开始学习的最佳地点，可以让你感受 `PHP` 与你熟悉的语言之间的差异。


    如果你还不是程序员，可以在你喜欢的电子书零售商找到许多“PHP 入门”书籍。无论何种情况，广大的互联网也提供了我们常有的深度知识和教程，只需明智地 Google
    一番即可。


    最后，无论你是新手还是资深程序员，如果你正考虑认真学习 `PHP`，那么在埋头写代码之前，先看一些 `PHP` “最佳实践”网站可能是值得的。从长远来看，这可能会为你节省很多很多麻烦。


    ## 1.3 读者先决条件。或者说，本书不是什么


    为了充分利用本书，你应该具备基础的 `PHP` 编程经验（最可能是用于 Web 的）、通用的编程或 IT 背景，并且愿意学习并走出自己的舒适区。


    本书并非对 `PHP` 或广义编程的介绍。虽然你不需要计算机科学学位或高阶编程概念的知识，但本书的难度水平据认为是针对平均水平的 `PHP` 程序员（即那些探索了多于
    `PHP` 基础知识的人），并尝试在编写过程中解释任何必要的概念。对于可能选择本书作为探索 `PHP CLI` 特性快速参考的高级程序员来说，它同样有用。


    ## 1.4 给 Windows 和 Mac 用户的重要说明


    书中给出的大多数示例都在 Linux 下运行和测试的（大多数情况下是最新版本的 Ubuntu Desktop/Server 版本）。`PHP` 运行在许多操作系统上，包括
    `MS Windows` 和 `Apple OS X`，且代码的运行方式通常是相同的。然而，由于文件系统、操作系统、可用库等原因，它们确实存在差异，但在书中涵盖所有这些是不切实际的。此外，某些功能（如依赖于
    `POSIX` 标准的功能）在 `Windows` 等某些系统上无法（轻易）使用。由于 `OS X` 源自一个符合 `POSIX` 标准的操作系统，你可能会发现代码比在
    `Windows` 上更有兼容性，但你的体验可能仍会有不同。获取特定操作系统问题的良好信息来源是官方 `PHP` 在线手册，特别是每个页面底部的用户评论。在可能的情况下，我们也涵盖了针对这些其他操作系统的特定区域，例如我们将查看如何访问
    `Windows 表`。


    ## 1.5 关于示例代码


    正如你在整本书中所看到的，我在代码示例中主要使用“传统的”命令式/过程化 `PHP` 代码，以便让所有水平的程序员都能保持内容尽可能简单。本书并非设计用于编写代码最佳实践或风格的课程，不是
    `OOP` 编程指南，也不是为了推行任何类型的编程模型或教条。我也避免了使用任何代码框架。许多框架基于 Web 模型，在我们将要考虑的应用类型中，它们并不总是按预期方式运行，尽管某些框架现在已经有了“控制台”或“cli”模块。`MVC`
    风格框架在构建 GUI 应用时非常有用（事实上 `MVC` 范式比 Web 早得多！），但由于存在许多不同的实现细节和风格，我们在这里将坚持无框架的代码。


    通过呈现的简单直观的 `PHP` 代码可以清楚地看到如何使用或调整以适应你自己的编程风格、框架或模型。我们将主要关注特定任务的实现细节，将编程本身的热点话题留给许多其他书籍。


    书中所有的示例 `PHP` 源代码均供你随心使用，不受限制也无需许可。请根据你的需要随意使用或滥用它！


    如果你在运行或理解示例代码时遇到困难，请查看本书最后一章的反馈部分，了解如何联系作者寻求帮助的详情。


    ## 1.6 外部资源


    在整书中，我们将通过两种方式之一引导你关注外部工具、资源和信息：


    ## 1.7 英语。真正的英语。


    只是简单说明一下：不，那些不是拼写错误，那是英式英语（你懂的，那种开启这一切的英语），因为你谦卑的作者来自大西洋的彼岸。接受吧，我们的拼写方式不同。你发现的任何真正的拼写错误都将被视为语言演变的一部分，然后在你没注意时被悄悄修复。


    ## 2. 摆脱 Web - PHP CLI 编程概览


    本章将介绍涉及使用 `PHP` 摆脱 Web 局限的基本步骤。我们将涵盖涉及的技术步骤，以及编程实践和重点的差异。


    ## 2.1 没有 Web 服务器的 PHP


    大多数 `PHP` 程序员严格仅在 Web 服务器环境中使用 `PHP`。在这样的环境中，`PHP` 是一个 `CGI/Fast GGI` 或服务器模块，由
    `HTTP` 服务器（通常是 `Apache`、`IIS`、`Nginx` 或类似软件）调用和控制。`HTTP` 服务器接收到基于 `PHP` 的网页请求，并调用
    `PHP` 进程执行它，该进程通常会将输出返回给 `HTTP` 服务器，以便发送给最终用户。


    人们曾多次尝试使用本地安装的 Web 服务器通过 `PHP` 创建本地应用程序（脚本系统、桌面应用等），并取得了一些成功。然而，在本地应用中使用这种 Web
    类型模型的缺点有许多：


    *   就它们在这些场景中提供的价值而言，像 `Apache` 这样的 Web 服务器通常配置过高且消耗资源

    *   除非经过妥善锁定，否则运行在本地的 Web 服务器会为外部恶意访问者提供访问你机器的接入点

    *   `HTTP` 是一种冗长的协议，且（可以说）非常适合 Web，然而，对于本地进程间通信来说，它通常是大材小用，并为你的应用程序增加了额外的资源和复杂性开销

    *   你的应用程序界面通常在 Web 浏览器中，因此看起来完全不像本地应用（除非你为应用专门安装浏览器，否则会有额外的支持/升级烦恼）


    `PHP` 从 `5.4` 版本开始包含一个内置 Web 服务器，这解决了上述描述的一些问题。然而，它是为了本地测试旨在部署在生产环境的完整 `HTTP`
    服务器（如 `Apache`）上的 `PHP` 脚本而设计的。对于某些本地应用来说，这是一个可以探索的路线，特别是当你想要运行一个已有的私有 `PHP` Web
    应用实例时。然而，它的稳定性、可靠性和对于生产级本地应用的性尚待证明，而且仍然带有 `HTTP` 和 Web 浏览器的包袱。

