    \ Web 应用程序并不是真正的“离线”。即使桌面应用或系统守护进程本身不与网络、本地网络或其他外部服务交互，它所连接的机器也必然插着以太网线，或者激活着\
    \ WiFi/3G/4G 连接。你的软件不会运行在自己不受外界干扰隔绝的舒适小世界里。当然，完美的沙箱化虚拟机除外。\n\n软件安全是另一整本书的主题（其他人已经写过很多了，请参见下方的延伸阅读部分），许多原则既适用于系统软件也适用于\
    \ Web 软件，因此你可以利用现有的 Web `PHP` 安全实践知识来指导自己。在规划你的脚本安全措施和监控时，应该考虑以下列出的面向用户和系统软件的典型漏洞类型和攻击向量列表：\n\
    \n*   **受损的数据文件**\n    来自外部源的受损文件（由用户刻意或无意加载）。这些通常是数据文件，特别是被注册为特定文件类型默认查看器的软件风险最高，因为无意或恶意的文件激活要容易得多。\n\
    \n*   **被恶意软件利用**\n    恶意软件寻找无辜的软件进行利用以获取权限提升。像 `PHP` 代码这样的脚本化软件更容易被恶意软件重写或修改，而且未编译形式源代码的可用性对恶意软件作者有所帮助。\n\
    \n*   **用户行为不当**\n    合法用户的行为不当。例如，John Smith 试图在他们的共享业务系统上查看其老板 Jane Doe 的文件或浏览历史。\n\
