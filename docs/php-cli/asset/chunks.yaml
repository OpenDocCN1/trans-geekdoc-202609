- fmt: "\nThese four arguments allow you to specify PHP code to be executed before,\
    \ during and after input from `STDIN` is processed by PHP. `-B` specifies a line\
    \ of code to execute before the input is processed, `-R` specifies a line of code\
    \ to execute for every line of input whilst `-F` specifies a PHP file to execute\
    \ for each line. Finally `-E` executes a line of code at the end of the input\
    \ process. In `-R` and `-F`, two special variables are available; `$argn` - the\
    \ text of the line being processed, and `$argi` - the number of the line being\
    \ processed. This is mainly useful when using PHP directly in shell scripts. For\
    \ instance, to print out a text file with line numbers, you can do something like:\n\
    \n```\n1 ~$  cat my_text_file.txt | php -B 'echo \"Lets add line numbers...\\\
    n\";'\n2         -R 'echo \"$argi: $argn\\n\";' -E 'echo \"That''s the end folks\\\
    n\";'\n```\n\nwhich will output something like\n\n```\n1 Lets add line numbers...\n\
    2 1: Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do \n3 2: eiusmod\
    \ tempor incididunt ut labore et dolore magna aliqua. Ut enim ad\n4 3: minim veniam,\
    \ quis nostrud exercitation ullamco laboris nisi ut aliquip\n5 4: ex ea commodo\
    \ consequat. Duis aute irure dolor in reprehenderit in \n6 That's the end folks\n\
    ```\n\n*   `-s` or `--syntax-highlight`\n\nThis outputs an HTML version of the\
    \ PHP script, with coloured syntax highlighting. The PHP script is not executed\
    \ or validated, it’s simply made “pretty”. The pretty HTML is printed to STDOUT,\
    \ and can be useful when pouring over code looking for errors, issues and optimisations.\
    \ This only works with PHP in files, not with code provided by the `-r` option.\
    \ Most modern IDE’s and code editors provide syntax highlighting by default, however\
    \ this can be useful if your only access to a machine is on the command line and\
    \ the editor you are using doesn’t do syntax highlighting. In this case, use `-s`\
    \ to create a coloured version of your script, and either download it or view\
    \ it through your web browser if the machine has a web server installed.\n\n*\
    \   `-v` or `--version`\n\nThis outputs the PHP version information. This can\
    \ also be found in amongst the output of the `-i` option described above. Be careful\
    \ when assuming a particular format, some package repositories (Ubuntu for instance)\
    \ include their name and their own build numbers in the version string, so don’t\
    \ just filter it for any numerics.\n\n*   `-w` or `--strip`\n\nThis outputs the\
    \ contents of the source code with any unnecessary white space and any comments\
    \ removed. This can only be used with code files (not with lines of code supplied\
    \ by `-r`) and does not work with the syntax highlighting option above. This is\
    \ used to “minify” a file, i.e. reduce the file size. Contrary to popular opinion,\
    \ this will not speed up most scripts, the overhead of parsing comments and white\
    \ space is extremely negligible. You should also be wary of support & debugging\
    \ issues even if a copy of the “full” code is kept, as line numbers in error reports\
    \ will no longer match between the original and stripped versions. It also does\
    \ not minify identifies like variable names, and so cannot be used to obfuscate\
    \ your code.\n"
  raw: "These four arguments allow you to specify PHP code to be executed before,\
    \ during and after input from `STDIN` is processed by PHP. `-B` specifies a line\
    \ of code to execute before the input is processed, `-R` specifies a line of code\
    \ to execute for every line of input whilst `-F` specifies a PHP file to execute\
    \ for each line. Finally `-E` executes a line of code at the end of the input\
    \ process. In `-R` and `-F`, two special variables are available; `$argn` - the\
    \ text of the line being processed, and `$argi` - the number of the line being\
    \ processed. This is mainly useful when using PHP directly in shell scripts. For\
    \ instance, to print out a text file with line numbers, you can do something like:\n\
    \n```\n1 ~$  cat my_text_file.txt | php -B 'echo \"Lets add line numbers...\\\
    n\";'\n2         -R 'echo \"$argi: $argn\\n\";' -E 'echo \"That''s the end folks\\\
    n\";'\n```\n\nwhich will output something like\n\n```\n1 Lets add line numbers...\n\
    2 1: Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do \n3 2: eiusmod\
    \ tempor incididunt ut labore et dolore magna aliqua. Ut enim ad\n4 3: minim veniam,\
    \ quis nostrud exercitation ullamco laboris nisi ut aliquip\n5 4: ex ea commodo\
    \ consequat. Duis aute irure dolor in reprehenderit in \n6 That's the end folks\n\
    ```\n\n*   `-s` *or* `--syntax-highlight`\n\nThis outputs an HTML version of the\
    \ PHP script, with coloured syntax highlighting. The PHP script is not executed\
    \ or validated, it’s simply made “pretty”. The pretty HTML is printed to STDOUT,\
    \ and can be useful when pouring over code looking for errors, issues and optimisations.\
    \ This only works with PHP in files, not with code provided by the `-r` option.\
    \ Most modern IDE’s and code editors provide syntax highlighting by default, however\
    \ this can be useful if your only access to a machine is on the command line and\
    \ the editor you are using doesn’t do syntax highlighting. In this case, use `-s`\
    \ to create a coloured version of your script, and either download it or view\
    \ it through your web browser if the machine has a web server installed.\n\n*\
    \   `-v` *or* `--version`\n\nThis outputs the PHP version information. This can\
    \ also be found in amongst the output of the `-i` option described above. Be careful\
    \ when assuming a particular format, some package repositories (Ubuntu for instance)\
    \ include their name and their own build numbers in the version string, so don’t\
    \ just filter it for any numerics.\n\n*   `-w` *or* `--strip`\n\nThis outputs\
    \ the contents of the source code with any unnecessary white space and any comments\
    \ removed. This can only be used with code files (not with lines of code supplied\
    \ by `-r`) and does not work with the syntax highlighting option above. This is\
    \ used to “minify” a file, i.e. reduce the file size. Contrary to popular opinion,\
    \ this will not speed up most scripts, the overhead of parsing comments and white\
    \ space is extremely negligible. You should also be wary of support & debugging\
    \ issues even if a copy of the “full” code is kept, as line numbers in error reports\
    \ will no longer match between the original and stripped versions. It also does\
    \ not minify identifies like variable names, and so cannot be used to obfuscate\
    \ your code. There are very few reason to use this option these days. To make\
    \ a file smaller for distribution, using proper compression (e.g. adding it to\
    \ a zip file) is usually a better method.\n\n*   `-z` *or* `--zend-extension`\n\
    \nThis specifies the filename/path for a Zend Extension to be loaded before your\
    \ script is run. This allows dynamic loading of extensions, which can alternatively\
    \ be specified in the `php.ini` file if they are always to be loaded.\n\n*   `--rf`\
    \ *or* `--rfunction`  \n\n    `--rc` *or* `--rclass`  \n\n    `--re` *or* `--rextension`\
    \  \n\n    `--rz` *or* `--rzendextension`  \n\n    `--ri` *or* `--rextinfo`\n\n\
    These options allow you to explore PHP structures using reflection. Reflection\
    \ is the process by which PHP can perform runtime “introspection”, which is the\
    \ means to allow you to look into elements and structures of your code at run\
    \ time. The first three options above print reflection information about a named\
    \ function, class or extension. The last two print basic information about a Zend\
    \ extension or a standard extension, as returned by the `phpinfo()` function.\
    \ This reflection information, which is very detailed, is only available if PHP\
    \ is compiled with reflection support. These options can be used as a quick but\
    \ precise reference guide to the entities listed above, and are particularly useful\
    \ in interrogating unknown code written by others.\n\n### 3.4 Command line arguments\
    \ for your script\n\nAs we’ve seen above, passing arguments to PHP itself is straightforward\
    \ and done in the normal way. However passing arguments for use by your PHP script\
    \ is a little more complicated, as PHP needs to know where its own arguments stop\
    \ and where your script’s start. The best way to examine how PHP deals with this\
    \ is through some examples. Consider the following PHP script:\n\n```\n1 <?\n\
    2 \n3 echo \"Number of arguments given :\".$argc.\"\\n\";\n4 \n5 echo \"List of\
    \ arguments given :\\n\";\n6 \n7 print_r($argv);\n```\n\nThere are two special\
    \ variables in the script above :\n\n*   `$argc` : This records the number of\
    \ command line arguments passed to the script\n\n*   `$argv` : This is an array\
    \ of the actual arguments passed.\n\nLets save the script as `arguments.php`.\
    \ Now lets call it as follows :\n\n```\n1 ~$ php -e arguments.php -i -b=big -l\
    \ red white \"and blue\"\n```\n\nYou will get the following output :\n\n```\n\
    \ 1 Number of arguments given :7\n 2 List of arguments given :\n 3 Array\n 4 (\n\
    \ 5     [0] => arguments.php\n 6     [1] => -i\n 7     [2] => -b=big\n 8     [3]\
    \ => -l\n 9     [4] => red\n10     [5] => white\n11     [6] => and blue\n12 )\n\
    ```\n\nAs you can see, all of the arguments given from the filename onwards in\
    \ the command are passed to the script. The first, `-e`, which is used by PHP\
    \ itself is not passed through. So, as a general rule, everything after the filename\
    \ is treated as an argument to the script, anything before the filename is treated\
    \ as an argument for PHP itself, and the filename is shared between the two.\n\
    \nThere is, of course, an exception. As we learned above, in addition to specifying\
    \ the filename of your script on its own, we can also pass it as part of the -f\
    \ flag. So if we execute the following command:\n\n```\n1 ~$ php -e -f arguments.php\
    \ -i -b=big -l red white \"and blue\"\n```\n\nwe get the following unexpected\
    \ output :\n\n```\n 1 phpinfo()\n 2 PHP Version => 5.4.6-1ubuntu1.3\n 3 \n 4 System\
    \ => Linux dev-system 3.5.0-37-generic #58-Ubuntu SMP Mon Jul 8 22:10:2\\\n 5\
    \ 8 U\n 6 TC 2013 i686\n 7 Build Date => Jul 15 2013 18:23:34\n 8 Server API =>\
    \ Command Line Interface\n 9 Virtual Directory Support => disabled\n10 Configuration\
    \ File (php.ini) Path => /etc/php5/cli\n11 <rest of output removed for brevity>\n\
    ```\n\nYou may recognise this as the output of calling `php -i`. Rather than treating\
    \ arguments after the filename as belonging to the script, PHP has treated the\
    \ -i argument (and those afterwards) as one of it’s own. As `-i` is a valid PHP\
    \ argument, it decides that it was what you wanted and invokes its “information”\
    \ mode. If you need to pass the filename as part of the -f flag rather than as\
    \ an argument on it’s own, you will need to separate your scripts arguments using\
    \ `--`. So, for the command above to work as expected, we need to alter it to\
    \ read:\n\n```\n1 ~$ php -e -f arguments.php -- -i -b=big -l red white \"and blue\"\
    \n```\n\nEverything after the `--`, plus the script filename, is passed as arguments\
    \ to the script, and we get the output we were expecting.\n\nThis can make your\
    \ scripts a little messy, particularly if you are passing lots of arguments, so\
    \ you may want to look at the sub-section on self-executing scripts in the next\
    \ section, which will show you how to embed PHPs arguments in the script itself,\
    \ allowing the script to claim any and all arguments passed as its own.\n\n###\
    \ 3.5 The many ways to call PHP scripts"
