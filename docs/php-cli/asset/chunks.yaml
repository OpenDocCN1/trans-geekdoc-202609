    \    `PHP` 漏洞以及其他依赖和相关软件中的漏洞。你的软件当然完全没有安全问题，但它不可避免地依赖其他库、软件和 `PHP` 扩展，当然，不要忘记\
    \ `PHP` 解释器本身。其中任何一个都可能包含安全漏洞和攻击向量。\n\n上述章节列出了所有类型软件中常见的安全问题来源，而不是 `PHP`。在设计阶段规划这些问题，并在部署前进行测试，以尽量减少你的风险。然后祈好运吧……\n\
    \n## 2.5 CLI 专用代码框架\n\n`PHP` 有许多编码框架，其中许多框架可以用于 `CLI` 应用，尽管只有一个框架是专门为非 Web 编程创建的。各种框架中的代码可能假设它们会在\
    \ HTTP 相关的环境中被调用，因此你可能需要编写额外的代码来规避这一点。在决定是否使用框架或使用哪一个框架时，你应该考虑到它们的适用性（取决于它们对 Web\
