- fmt: '

    Since version 4.3, PHP has had an ace hidden up its sleeve which solves all of
    these problems. The PHP CLI SAPI (“Command Line Interface” “Server Application
    Programming Interface”), to give it its formal name, is essential a long way of
    saying “stand-alone PHP”. It cuts out the need for a web server and provides a
    stand alone PHP binary for you to interact with. For instance, typing the following
    at a shell prompt


    ```bash

    1 ~$ php /home/myfiles/myprogram.php

    ```


    will simply execute your `myprogram.php` file (which you write mostly like any
    other PHP script) and return any output back to the terminal (unless you tell
    it otherwise) instead of being sent to the web server (which doesn’t exist!).


    In general, PHP scripts called directly using the PHP CLI SAPI will behave in
    the same way as when called through a web server, although there are some differences.
    For instance, you won’t find any `$_GET` or `$_POST` arrays, and PHP won’t send
    any HTTP headers by default, as these concepts don’t mean much beyond the web.
    Default settings like `max_execution_time` are set to sensible values for local
    use (in this case to 0 so your scripts won’t time out), output buffering is turned
    off, and error messages are displayed in plain text rather than HTML.


    Full details of how to install (if necessary) and use the CLI SAPI are given in
    the next chapter.


    ## 2.2 PHP versions - what’s yours?


    PHP has supported the CLI SAPI since version 4.3.0, so many of the examples in
    this book will run on any PHP version since then. At the time of writing, the
    current version of PHP is 7.02 and the code in this book has been tested against
    this version. If you find that a particular function doesn’t appear to exist or
    work as expected, check the online PHP manual for that function. This shows which
    versions support which functions, and describe any breaking changes created by
    newer versions.


    If you are using an older version, there are some very good reasons to upgrade.


    * Performance has increased markedly (and, correspondingly, resources used have
    decreased) in recent versions.

    * Although security is not always as critical with non-web applications (see the
    discussion on security later in this chapter for caveats), the security enhancements
    and security related bug fixes in recent versions are essential if you’re handling
    data from external sources, and if you’re using the same version for web work
    as well.

    * Modern language features are available, which can help your coding productivity,
    as well as helping others take your code more seriously.


    As with the web versions of PHP, you can compile your own version of the CLI SAPI
    if you find the need. If you want to include extensions not pre-packaged by your
    OS software repositories, remove non essential code for performance reasons, or
    use any of the other compile-time options that PHP supports then learning to “roll
    your own” version may be worthwhile. A starter guide to compiling and installing
    PHP and related extensions can be found in Appendix A.


    ## 2.3 A few good reasons NOT to do it in PHP


    Tell someone you’re going to be writing CLI scripts in PHP, and often they’ll
    rail about how PHP is a web language, that you should choose a language “more
    suitable” to the task. This book is focused on doing everything in PHP, and for
    90% of tasks PHP will do all that is asked of it. PHP is now a general purpose
    language, it’s Turing complete, and while it’s still used in the main to run “websites”,
    more and more that means backend services as well. But before you commit to rewrite
    your world in PHP, there are a few pertinent issues that you may want to consider
    carefully before jumping in.


    ### High performance requirements

    If you need very high performance, particularly on limited hardware, PHP may not
    be for you. Performance has come on leaps and bounds in recent versions of PHP
    and regularly trounches languages like Python and frameworks like Ruby-on-Rails
    in benchmarks. However at its heart PHP is an abstracted scripting language which
    is never going to get the same performance for some tasks as lower level languages
    like C, which are closer to the bare metal. Don’t write it off for all high-performance
    tasks though, if you’re looking at performance with an eye to costs, you may find
    that the cost savings on developer time through speed of development in PHP outweighs
    the cost of the extra hardware you throw at it to get the performance.


    ### Don’t (necessarily) re-invent the wheel

    You *can* write a web server in PHP (see Appendix D for examples), but won’t *existing*
    servers like Apache do what you need? For many or most infrastructure “itches”,
    software exists (written in many different languages) that will give you the “scratch”
    you need. Unless you really need other features, the time spent writing your own
    is usually going to be greater than the time learning and implementing an existing
    piece of software. Of course, for some people the converse is true. “Because I
    can” can be a valid reason, and writing software is always a valuable learning
    experience.


    ### Keeping the source closed

    PHP is a scripting language, and this means that if you are writing software to
    sell or deploy elsewhere, you will be revealing your source code to the recipients.
    Many (including your author) will argue that being “open-source”, even commercially,
    is a good thing. But if that’s not your bag then you will need to go to greater
    lengths to protect your code. Source code obfuscaters are available online which
    use various tricks to make your code hard (but not impossible) to read, and a
    number of PHP compilers are available to produce binary programs (albeit with
    limitations in terms of syntax and extension coverage). But the main PHP project
    hasn’t expressed any intention to support code hiding or compiling, and so the
    viability of such methods long term is not certain. The business case for closed-source
    software is also not a done-deal in the medium to long term.


    ## 2.4 Thinking about security


    Every programmer worth their salt is at least aware of the security implications
    of building web sites and online apps. You deliberately expose your code to the
    public, to the world, to anyone and everyone who will come (good people and bad).
    One of the early failings of PHP was to prioritise ease of use over security of
    code (the horror stories from relics like `register_globals` are only a quick
    google away). With newer, more secure defaults and functions like `register_globals`
    being depreciated PHP is safer than ever online. And although most security problems
    are caused by the programmer rather than the language, even the newest web coders
    seem to have an appreciation of security issues right off the bat these days.


    Step into the world of off-line software, however, and things are markedly different.
    Typically we see software for trusted users only, deployed locally on trusted
    machines and under the full control of the benevolent user. The user isn’t going
    to deliberately attack the software or machine, they’re working with their own
    data. Functionality absolutely can’t be compromised. Security is rarely considered
    at all when developing command line programs and desktop apps, let alone being
    features specified at design time, because it’s not “necessary”.

