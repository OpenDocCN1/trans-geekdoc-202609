  trans: "\n本书的内容是我所写的另一本书《PHP Beyond The Web》中部分内容的改编而成的子集。除了 CLI 脚本外，它还涵盖了使用 PHP\
    \ 可以进行的许多其他工作，包括但不限于：编写软件守护进程、桌面 GUI 应用程序、与其他软件进程及硬件（如打印机）进行交互，甚至使用树莓派控制电子设备。它还深入探讨了性能、开发工具、垃圾回收以及其他在构建大型离线系统时更相关的话题。\n\
    \n作为本书的读者，你可以查看示例、查阅目录，并只需访问 [`leanpub/php/c/upgrade`](http://leanpub/php/c/upgrade)\
    \ 即可在 Leanpub 上仅需 5 美元（适用时额外加收增值税）即可获得《PHP Beyond The Web》。即使以那个价格，它仍然带有 Leanpub\
    \ 的“无条件、无风险、100% 快乐保证”，这句长话翻译过来就是：提供无条件的 45 天内双击退款。\n\n## 6.2 给出反馈、获取帮助与支持\n\n\
    电子邮件：`author@phpbeyondtheweb.com`\n\n非常欢迎你对这本书提供的反馈，无论好坏、是本质还是琐碎。请告诉我你对这本书的整体或某个特定章节的看法。如果某些领域涵盖深度不够（或细节过于冗长）、你预期的某些主题没有出现，或者任何信息不清楚，请告知我。同样，如果你在运行示例代码时遇到任何问题，或在实现讨论的技术时遇到困难，请随时给我写信，我会看看是否有我能提供什么帮助。\n\
    \n## 6.3 你正在读的是“盗版”吗？\n\n在我人生中，曾有几次我读过“未经授权”的复印书籍：当我买不起时，当它们无法通过合法渠道（当地书店、在线销售、图书馆）轻松获得时，或者（对于电子书）当\
    \ DRM（数字版权管理）阻碍了我在可用设备上阅读时。因此，如果你处于这种境地，我完全理解，我不想批评你的选择。如果你无法负担这本书，也许你可以考虑在以后负担得起时购买；与此同时，我请求你帮我一个忙作为回报——请考虑通过向那些负担得起的人推荐它来帮助我推广，在网上尝试写评论，或者通过其他方式口碑。如果你是因为除了费用之外的某些因素阻碍了你获取合法版本而阅读未经授权的版本，请告诉我，我会尽力消除那个障碍。我希望让每个想要购买和阅读这本书的人都能以最少的麻烦实现这一点。这就是为什么我不会在我的作品中使用\
    \ DRM，因为对于每一个被它阻止的“盗版者”（数量并不多），可能还有十倍的被它困扰的合法读者。\n\n如果你仅仅是因为不想为它付钱而阅读未经授权的版本，那么那是你与你良知之间的事。\n\
    \n## 附录 A：编译并安装 PHP、扩展和库\n\n获取 PHP 有十种不同的方法，包括自己下载并编译、下载预编译的二进制文件、使用包管理器和软件仓库，以及发现由远见卓明的管理员预先安装了。在大多数\
    \ Linux 发行版中，可以使用一行命令（如 `sudo apt-get install php5`）或通过图形化包管理器（如 Synaptic 软件包管理器或\
    \ Ubuntu 软件中心）来安装 PHP。许多常见的 PHP 扩展和插件同样以预构建包的形式提供，或者通过 PECL 和 PEAR 系统获取。\n\n然而，有时需要多做一些工作来安装\
    \ PHP，例如：\n\n*   当你的项目对特定 PHP 版本有要求，而该版本与操作系统自带的版本不同时\n*   当你需要未以包形式提供的扩展时\n*\
    \   或者当你想要编译一个针对你需求的自定义 PHP 版本时。\n\n与任何涉及计算机和软件开发的事务一样，编译 PHP 可能会让你掉进各种选项、自定义、兼容性问题、库和依赖的“兔子洞”。关于涉及的各种可能性（以及可能带来的头疼问题），可以写一整本书。幸运的是，在大多数使用情况下，编译标准版本的各种操作非常简单。就像生活中的大多数事情一样，一旦做过一次就会变得容易。下面的第一部分将介绍获取、编译和安装\
    \ PHP 及其核心扩展所需的必要步骤。PHP 用 C 语言编写，由于你们中的很多人可能并不熟悉编译 C 程序的流程，我尝试解释了下面的每一个步骤，让你了解正在发生什么。这使得过程看起来稍微有些冗长，但实际上非常简单。如果你不信，尽管尝试吧！接下来的章节也值得一，因为它们涵盖了如何从\
    \ PECL、PEAR 和 Packagist 仓库安装额外的库和扩展。\n\n### 编译并安装 PHP 本身\n\nWindows 开发者注意——这些步骤适用于\
    \ Linux/Unix 类型系统，并使用几乎总是随操作系统自带的免费编译器工具。对于 Windows，需要专有的 Visual Studio 编译器，步骤有所不同且超出了本书的范围。Windows\
    \ 源码、预编译二进制文件可以在 [`windows.php.net/`](http://windows.php.net/) 获取。\n\nOS X 开发者注意——虽然步骤与\
    \ Mac 类似，但根据你使用的操作系统可能会遇到一些问题。\n\n在 Linux 机器上，我们的第一步是从 PHP 网站 [`www.php.net/downloads.`](http://www.php.net/)\
    \ 下载源码。该页面列出了当前的稳定版本和上一个稳定版本。仍在开发中的新版本可以在 [`snaps.php.net/`](http://snaps.php.net/)\
    \ 获取，旧版本可以在 [`museum.php.net/`](http://museum.php.net/) 获取。Git 用户也可以从官方镜像 [https://github.com/php]\
    \ 拉取源码。\n\n当你确定了想要的版本后，记下 .tar.gz 源码的 URL，我们稍后会用到。\n\n```\n1 ~$ mkdir php5.4\n\
    2 ~$ cd php5.4\n3 ~$ wget http://uk3.php.net/get/php-5.4.6.tar.gz/from/uk3.php.net/mirror\
    \ \n4\t-o php-5.4.6.tar.gz\n5 ~$ tar zxvf php-5.4.6.tar.gz\n6 ~$ cd php-5.4\n\
    ```\n\n前两行为工作创建一个目录并进入。该目录存放源码和中间文件，一旦 PHP 安装完成就可以删除。然而，通常建议保留它，以防以后需要重新安装或检查你下载的是哪个版本的源码。第三行将源码文件下载到我们的目录中。第五行将包解压到包含单个源码文件的目录。最后一行我们进入源码目录。现在我们开始实际的编译过程。\n\
    \n```\n1 ~$ ./configure\n```\n"
- fmt: '

    The `configure` command creates the “setup” for compilation. We use it to provide
    the settings and arguments we want for our compilation session. For instance,
    we can specify which core extensions we want to include in our build. If we don’t
    specify any arguments as above, the defaults provided by the PHP dev team are
    used. This is a good choice if you don’t have any particular needs and want a
    version that is fairly similar/compatible with the versions included with most
    distributions. You can also install extensions at a later date either individually
    or by re-compiling PHP from scratch, which we will discuss in the next section.
    If you want to include an extension at this stage that’s not included in the default
    settings, then this is the place to do it. For example, if you wanted to include
    the ldap extension, then you would change the command above to `./configure --with-ldap[=DIR]`
    where `[=DIR]` is the base installation directory of ldap on your system. The
    exact option to use and any necessary dependencies can be found in the PHP manual,
    under the “Installing/Configuring” section for the extension in question. For
    example, details for the ldap extension can be found at [http://www.php.net/manual/en/ldap.setup.php](http://www.php.net/manual/en/ldap.setup.php).
    A (slightly out-of-date) list of options that you can pass to the `configure`
    command can be found at [http://www.php.net/manual/en/configure.about.php](http://www.php.net/manual/en/configure.about.php)
    or, for a full list of those supported on your system in the current version you
    are trying to compile, you can issue the command `autoconf` followed by `./configure
    --help`. More information about the `configure` command can be found at [http://www.airs.com/ian/configure/](http://www.airs.com/ian/configure/).
    Now we will actually compile PHP.


    ```

    1 ~$ make clean

    2 ~$ make

    3 ~$ sudo make install

    ```


    We compile the binary PHP files using the “make” tool. The first line removes
    any previously created files and resets us to the start of the “make” process.
    This is not strictly necessary on your first run at compiling, but it can help
    if your attempt fails for some reason (such as missing dependencies, incorrect
    settings, unintended interruptions to the process etc.) so including it by default
    is often a good choice. The second line does the actual building and compiling
    of the files. The third line then takes those files and installs them on the system.
    By default, PHP will usually be installed in the `/usr/bin` directory on Linux.
    However you can choose where to install it by specifying a “prefix” directory
    at the `./configure` stage above. Simply add the switch `--prefix=/path/to/dir`
    where `/path/to/dir` is the directory into which you want PHP to be installed.
    This is often useful if you want to install multiple versions on the same machine
    (although be aware that there are other considerations when doing so). Note that
    the `make install` line must be run with higher permissions (`sudo`) to allow
    it to copy files into “privileged” locations.


    If all goes well, congratulations, you have installed PHP! To check that the correct
    version is installed and available, use `php -v` at the command line and PHP will
    display the current version number. If you have installed PHP in a location outside
    of your search path you will need to specify the full path name, e.g. `/path/to/dir/php
    -v`. To check which extensions and other options were installed, use `php -i`
    at the command line to run the `phpinfo()` function. As well as extension information
    (and a lot more besides), this returns a list of the options used with the `./configure`
    command. This can be useful when re-installing PHP or when trying to clone an
    installation on another machine (where the same binaries cannot just be re-used).


    If all doesn’t go well, have a close look at the errors produced. The most common
    type of errors happen when your system doesn’t have the relevant dependencies
    installed for a particular extension. Often the error message will say this explicitly,
    but even if it just gives you an obscure error message mentioning the name of
    an extension, the best advice is to double-check the installation section for
    that extension in the the PHP manual to find out exactly what dependencies are
    required. Missing dependencies can often be installed using your systems package
    manager rather than having to manually compile them. You should also check that
    you have provided the location of any dependencies at the configure stage above
    if required.


    If all else fails, copy and paste the exact error message into your favourite
    internet search engine, probably starting with the first error message shown if
    multiple errors appear. Many, many people have compiled PHP, and most errors have
    been encountered and documented online. Don’t let all this talk of errors put
    you off having a go at compiling PHP. Errors are more likely to occur the more
    complicated you make your configuration, and if you’re careful about dependencies
    you can often avoid them altogether. So have a go at a straight forward compilation
    with the default options to get the hang of things, and take it from there!


    More information on installations, with a general focus on web servers but otherwise
    useful, can be found in the PHP manual at [http://www.php.net/manual/en/install.php](http://www.php.net/manual/en/install.php).


    ### Compiling and installing extra core extensions


    As we saw in the previous section, the most common way to install core extensions
    is to enable the relevant flags at the configure stage during compilation of the
    main PHP installation (note by default, many extensions are automatically enabled).
    However it’s not uncommon to come across the need to install an additional extension
    later on, for instance as the requirements for your program change from its initial
    design. There are two ways to approach this. The first, which you’ll find recommended
    a lot online, is to re-do the compilation/installation of PHP from scratch, adding
    the newly required modules at the configure stage (after issuing `php -i` to remember
    what configure options you used the first time). While this works perfectly well,
    compiling the full PHP binaries is a bit of a slog which can take older PCs in
    particular a long time to complete. There is a short cut however.


    Each of the core extensions is actual a .so binary, and can be compiled independently.
    To do this, follow the first steps in the previous section to download and unpack
    the PHP source code and step into the directory. If you haven’t deleted it from
    you compiled PHP itself, it should be ready to go. Within the source code is a
    directory called ext, inside of which are separate directories for each of the
    extensions.


    ```

    1 ~$ cd ext

    2 ~$ ls

    ```


    This will show you all of the core extensions available. For instance, if we want
    to add the `pcntl` extension (used in this book for daemon software), we can enter
    the `pcntl` directory and compile/install just that extension in a similar manner
    to how we compiled the whole PHP package in the previous section.


    ```

    1 ~$ cd pcntl

    2 ~$ phpize

    3 ~$ ./configure

    4 ~$ make clean

    5 ~$ make

    6 ~$ sudo make install

    ```


    The additional command above, `phpize`, is used to prepare the build environment
    for the extension. This is not necessary when building the full PHP binaries,
    but it is when building individual extensions. If you find that you don’t have
    `phpize` on your system, it is often available through your systems package manager
    in the `php-dev` package (e.g. on Ubuntu it is available as `phpize5` in the `php5-dev`
    package). More details about `phpize` and getting it can be found at [http://us.php.net/manual/en/install.pecl.phpize.php](http://us.php.net/manual/en/install.pecl.phpize.php).

