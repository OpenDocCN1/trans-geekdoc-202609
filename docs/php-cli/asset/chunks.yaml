  trans: '


    `configure` 命令用于创建编译的“设置”环境。我们用它为编译会话提供所需的设置和参数。例如，我们可以指定想要在构建中包含哪些核心扩展。如果我们不像上面那样指定任何参数，则将使用
    PHP 开发团队提供的默认值。如果你没有特殊需求，并希望获得一个与大多数发行版中包含的版本相当相似/兼容的版本，那么这是一个很好的选择。你也可以在日后的某个时间单独地安装扩展，或者通过从头开始编译
    PHP 来安装，我们将在下一节中讨论这一点。如果你想在此阶段包含一个默认设置中未包含的扩展，那么这里就是进行操作的地方。例如，如果你想包含 ldap 扩展，则可以将上面的命令更改为
    `./configure --with-ldap[=DIR]`，其中 `[=DIR]` 是系统上 ldap 的基础安装目录。要使用的具体选项以及任何必要的依赖项，可以在
    PHP 手册中相关扩展的“安装/配置（Installing/Configuring）”部分找到。例如，ldap 扩展的详细信息可以在 [`www.php.net/manual/en/ldap.setup.php`](http://www.php.net/manual/en/ldap.setup.php)
    找到。可以传递给 `configure` 命令的选项列表（略微过）可以在 [`www.php.net/manual/en/configure.about.php`](http://www.php.net/manual/en/configure.about.php)
    找到；或者，为了获取你正在尝试编译的当前版本在你系统中支持的完整列表，你可以执行命令 `autoconf` 然后跟上 `./configure --help`。关于
    `configure` 命令的更多信息可以在 [`www.airs.com/ian/configure/`](http://www.airs.com/ian/configure/)
    找到。现在我们来实际编译 PHP。


    ```

    1 ~$ make clean

    2 ~$ make

    3 ~$ sudo make install

    ```


    我们使用“make”工具来编译二进制 PHP 文件。第一行会删除任何之前创建的文件并重置到“make”过程的起点。在第一次运行编译时这并不是严格必要的，但如果你的尝试由于某些原因失败了（例如缺少依赖项、设置错误、进程被无意中断等），它可能会有所帮助，因此默认包含它通常是一个很好的选择。第二行执行对文件的实际构建和编译。第三行随后获取这些文件并将它们安装到系统中。默认情况下，PHP
    通常会安装在 Linux 的 `/usr/bin` 目录下。然而，你可以通过上面的 `./configure` 阶段指定“prefix”目录来选择安装位置。只需添加开关
    `--prefix=/path/to/dir`，其中 `/path/to/dir` 是你希望安装 PHP 的目录即可。如果你想在同一台机器上安装多个版本，这通常非常有用（尽管请注意这样做会有其他考虑因素）。请注意
    `make install` 行必须以更高的权限（`sudo`）运行，以便将其文件复制到“特权”位置。


    如果一切顺利，恭喜你，安装了 PHP！要检查是否安装了正确的版本并且可用，请在命令行中使用 `php -v`，PHP 将显示当前版本号。如果你将 PHP 安装在搜索路径之外的位置，你需要指定完整路径，例如
    `/path/to/dir/php -v`。要检查安装了哪些扩展和其他选项，请在命令行使用 `php -i` 来运行 `phpinfo()` 函数。除了扩展信息（以及许多其他信息外），它还返回了使用
    `./configure` 命令时的选项列表。这在重新安装 PHP 或尝试在另一台机器上克隆安装时（无法直接重用相同的二进制文件）非常有用。


    如果一切不顺利，请仔细查看产生的错误。最常见的错误发生在你的系统没有安装为特定扩展的相关依赖项时。通常错误消息会显式说明这一点，但即使它只给出了一个提到扩展名称的模糊错误消息，最好的建议也是双检
    PHP 手册中该扩展的安装部分，以找出确切需要哪些依赖项。缺少的依赖项通常可以使用系统的包管理器进行安装，而无需手动编译它们。你还应该检查在上面的配置阶段是否按要求提供了任何依赖项的位置。


    如果所有其他方法都失败了，将准确的错误消息复制并粘贴到你喜欢的网络搜索引擎中，如果出现多个错误，可能从显示的第一个错误消息开始。有非常很多人编译过 PHP，大多数错误已经在网上遇到并记录下来了。不要让这些关于错误的话阻碍你尝试编译
    PHP。你的配置得越复杂，发生错误的概率就越大，如果你对依赖项非常小心，通常可以完全避免它们。因此，请尝试使用默认选项进行简单的编译以熟悉操作，然后在此基础上进行！


    关于安装的更多信息（主要关注 Web 服务器，但在其他方面也很有用）可以在 PHP 手册的 [`www.php.net/manual/en/install.php`](http://www.php.net/manual/en/install.php)
    找到。


    ### 编译并安装额外的核心扩展


    正如我们在上一节看到的，安装核心扩展的最常见方法是在编译主 PHP 安装期间在配置阶段启用相关标志（注意默认情况下，许多扩展会自动启用）。然而，稍后需要安装额外扩展并不罕见，例如当你的程序需求发生从初始设计的变化时。处理此问题有两种方法。第一种（你会在网上经常看到推荐这种方法）是从头开始重新编译/安装
    PHP，在配置阶段添加新需要的模块（在执行 `php -i` 后以记住你第一次使用了哪些配置选项）。虽然这种方法效果完美，但编译完整的 PHP 二进制文件是一项工程，特别是对于老旧电脑来说可能需要很长时间才能完成。不过有一个捷径。


    每个核心扩展实际上都是一个 .so 二进制文件，可以独立编译。要做到这一点，请遵循上一节中的第一步骤下载并解压 PHP 源码并进入该目录。如果你没有从编译的
    PHP 本身中删除它，它应该已经准备就绪。源码内部有一个名为 `ext` 的目录，其中包含每个扩展的独立目录。


    ```

    1 ~$ cd ext

    2 ~$ ls

    ```


    这将向你显示所有可用的核心扩展。例如，如果我们想添加 `pcntl` 扩展（本书用于守护进程软件），我们可以进入 `pcntl` 目录并按照我们在上一节中编译整个
    PHP 包的方式仅编译/安装该扩展。


    ```

    1 ~$ cd pcntl

    2 ~$ phpize

    3 ~$ ./configure

    4 ~$ make clean

    5 ~$ make

    6 ~$ sudo make install

    ```


    上述额外的命令 `phpize` 用于为扩展准备构建环境。在构建完整的 PHP 二进制文件时是不必要的，但在构建单个扩展时是必要的。如果你发现系统中没有 `phpize`，它通常可以通过系统的包管理器通过
    `php-dev` 软件包获得（例如在 Ubuntu 上，它作为 `php5-dev` 软件包中的 `phpize5` 提供）。关于 `phpize`get
    获取它的更多详细信息可以在 [`us.php.net/manual/en/install.pecl.phpize.php`](http://us.php.net/manual/en/install.pecl.phpize.php)
    找到。


