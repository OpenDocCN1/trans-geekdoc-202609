  trans: '

    我从 2000 年末就开始用 PHP 编程了。起初并不是我的意愿，因为我当时偏向的语言是 Perl 和 Delphi（也称为 Object Pascal）。在
    1999 年从利兹大学获得计算机科学学位并开始自由 Web 开发师的生涯后，情况开始发生了变化。仅仅几个月后，我就获得了一个机会，从一位朋友那里接手一个（相对而言）规模巨大的政府网站合同，那位朋友正离开自由职业领域，进入更安全、更理性的全职工作世界。唯一的问题是，几千行代码已经写好了，而且它们是用一种名为
    `PHP` 的较新语言编写的。哦，另一个问题是我在接手该网站之前，大约只有一周的时间来学习它。所以，按照当时的做法，我去了当地的 Waterstones 书店（对于你们年轻的读者来说，那里是我们以前买书的地方。纸质书。我们必须出门去。或者在线订购并等好几天送货。我提到过它们是纸质的吗？）。手里拿着一本纸质版的《傻瓜式
    PHP 和 MySQL 入门指南合集》（我可能没有完全记准确书名），我坐下喝了一口啤酒（记得我那时在约克郡），开始阅读。几天后，我写起代码来像专业人士一样了（嗯，程序运行正常），12
    年后的我再也没有回头。在经历了多样的自由职业职业生涯，并创办了几家，呃，初创公司（与 IT 相关，也有不相关的）并取得了不相同（通常很惨淡）的成功后，我现在是牛津大学的全职程序员。我的日常工作涉及中等规模的数据采集和管理、统计分析，以及为研究人员和公众提供用户界面。我的大部分开发工作是用
    `PHP` 完成的，无论是开发新项目，还是将别人的软件、系统和数据库整合在一起。


    在整个职业中，我一直使用 `PHP` 进行 Web 开发，但对于桌面 GUI 工作，我最初使用 `Delphi`（然后是 `Free-Pascal/Lazarus`），并配合
    `bash` 脚本处理其他任务。这主要是因为我在大学期间学习了它们。然而，随着 `PHP` 的成熟，我越来越多地在网络之外使用它，现在对于我遇到的任何编程或脚本任务，我都很少使用其他任何东西。在大学期间和一些自由职业工作中，我被迫沉浸过
    `C++`、`Javascript`、`Fortran`、`Lisp`（可能还有其他我大脑选择性忘记的语言），我可以诚实地说，`PHP` 现在是我的首选语言，而非被迫之选。


    当我没有被拴在电脑前时，我想说我有许多多样化且有趣的爱好。我曾经有。我可以写一整本书（虽然可能卖不出去）来记录我去过哪里、做过什么，我曾认为这让我变成了一个全面发展的人。但现在我没有了。这很大程度上是因为我三个可怜的小女儿
    Ellie、Izzy 和 Indy 的需求，还有我美丽的妻子 Parv 和我更漂亮的猫 Mia。我不希望生活因此有任何改变。至少，我是这么这么对自己说的……


