    \ Likewise, if you have any problems getting the sample code to run, or issues\
    \ implementing the techniques discussed please do drop me a line and I’ll see\
    \ if there is any way I can help.\n\n## 6.3 Are you reading a “pirated” copy?\n\
    \nThere are times in my life when I have read “unauthorised” copies of books;\
    \ when I couldn’t afford them, when they weren’t easily available through legitimate\
    \ channels (local bookshops, online sales, libraries), or (for e-books) when DRM\
    \ thwarted my efforts to read them on the devices I had available. So I quite\
    \ understand if you are in this position, and I don’t want to criticise your choice.\
    \ If you are unable to afford this book, perhaps you could consider purchasing\
    \ it in the future when you are able, and in the meantime I would ask that you\
    \ do me a favour in return - please consider helping me to promote it by recommending\
    \ it to those that can afford it, have a go at reviewing it online, and otherwise\
    \ spread the word. If you’re reading an unauthorised copy because there was something\
    \ else (other than cost) blocking your access to a legitimate copy, please let\
    \ me know and I’ll do my very best to remove that obstacle. I want to enable everybody\
    \ who wants to buy and read this book to be able to do so with the minimum of\
    \ fuss. This is why I won’t employ DRM on my work, because for every “pirate”\
    \ that it stops (and it won’t be many), there are likely to be ten times as many\
    \ legitimate readers who it annoys.\n\nIf you are reading an unauthorised copy\
    \ because you simply don’t want to pay for it, then that is between you and your\
    \ conscience.\n\n## Appendix A: Compiling and installing PHP, extensions and libraries\n\
    \nThere are a dozen different ways to get PHP, including downloading & compiling\
    \ it yourself, downloading pre-compiled binaries, using package managers and software\
    \ repositories, and finding it pre-installed by a forward thinking administrator.\
    \ On most Linux distributions, PHP can be installed with a one-line command such\
    \ as `sudo apt-get install php5` or through graphical package managers like the\
    \ Synaptic Package Manager or the Ubuntu Software Centre. Many common PHP extensions\
    \ and add-ons are likewise available as pre-built packages or alternatively through\
    \ the PECL and PEAR systems.\n\nHowever there are times when it becomes necessary\
    \ to do a little more work to install PHP, such as:\n\n*   when your project has\
    \ requirements for a specific version of PHP that is different to the one shipped\
    \ with your OS\n*   where you need extensions not available as packages,\n*  \
    \ or when you want to compile a customised version of PHP specific to your needs.\n\
    \nLike anything involved in computers and software development, compiling PHP\
    \ can take you down a rabbit-hole of options, customisations, compatibility issues,\
    \ libraries and dependencies. A whole book could be written about the different\
    \ possibilities (and possible headaches) involved. Luckily for us, in most use\
    \ cases, the basics of compiling a standard version are quite straightforward.\
    \ And like most things in life, it gets easier once you have done it once. The\
    \ first section below will go over the steps necessary for getting, compiling\
    \ and installing PHP and its core extensions. PHP is written in C, and as many\
    \ of you may not be familiar with the process of compiling C programs, I have\
    \ tried to explain each step below to give you an idea of what is happening. This\
    \ makes the process seem a little more verbose, but in reality it is quite straightforward.\
    \ Go ahead and try it if you don’t believe me! The next sections are also worth\
    \ a read, as they cover installing extras like libraries and extensions from the\
    \ PECL, PEAR and Packagist repositories.\n\n### Compiling and installing PHP itself\n\
    \nNote for Windows devs - These steps are for Linux/Unix type systems, and use\
    \ free compiler tools almost always included with the OS. For Windows, the proprietary\
    \ Visual Studio compiler is required, and the steps are somewhat different and\
    \ beyond the scope of this book. Windows source code, pre-built binaries and instructions\
    \ for compiling can be found at [http://windows.php.net/download/](http://windows.php.net/download/),\
    \ with older versions in the archive at [http://windows.php.net/downloads/releases/archives/](http://windows.php.net/downloads/releases/archives/).\n\
    \nNote for OS X devs - while the steps below are similar to those on a Mac, there\
    \ are some issues you may run into depending on the version of OS you are using.\n\
    \nOn \\*ix machines, our first step is to download the source code from the PHP\
    \ website at [http://www.php.net/downloads.](http://www.php.net/downloads.) .\
    \ This page lists the current stable release and the previous stable release.\
    \ Newer versions which are still under development are available at [http://snaps.php.net/](http://snaps.php.net/),\
    \ and older end-of-life versions are available at [http://museum.php.net/](http://museum.php.net/)\
    \ . Git users can also pull the source down from the official mirror at [https://github.com/php](https://github.com/php).\n\
    \nWhen you have identified which version you want, make a note of the URL of the\
    \ .tar.gz source code which we will use later.\n\n```\n1 ~$ mkdir php5.4\n2 ~$\
    \ cd php5.4\n3 ~$ wget http://uk3.php.net/get/php-5.4.6.tar.gz/from/uk.php.net/mirror\
    \ \n4\t-o php-5.4.6.tar.gz\n5 ~$ tar zxvf php-5.4.6.tar.gz\n6 ~$ cd php-5.4.6\n\
    ```\n\nThe first two lines creates a directory for our work and steps into it.\
    \ The directory holds the source code and intermediate files, and can be deleted\
    \ once PHP is installed if you want. However it is often a good idea to keep it\
    \ in-case you need/want to re-install or check what version of the file you downloaded\
    \ later. The third line downloads a copy of the source code file into our directory.\
    \ Change the URL in the third line to that of the .tar.gz file you want to use,\
    \ and the `-o` option to the name of the file (otherwise, in the above example,\
    \ wget will simply call your file “mirror”). The fifth line unpacks the archive\
    \ into a directory containing the individual source code files. Finally, the last\
    \ line steps us into the source code directory. Now we start the actual compilation\
    \ process.\n\n```\n1 ~$ ./configure\n```\n"
