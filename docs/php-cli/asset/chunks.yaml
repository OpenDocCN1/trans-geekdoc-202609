- fmt: '

    If you’re not familiar with it, Stack Overflow ([http://stackoverflow.com](http://stackoverflow.com))
    is a prolific “Question and Answer” site aimed at programmers. Unlike some Q&A
    sites, you don’t need to join or pay to view the answers to questions, adverts
    are limited and there are literally millions of answered questions on the board.
    This includes a good chunk of PHP related questions.


    All questions and answers are “tagged” with their topics so that you can find
    the ones relevant to you. To browse questions tagged with PHP, visit [http://stackoverflow.com/questions/tagged/php](http://stackoverflow.com/questions/tagged/php).
    You can also use the sites''s search facility, and to narrow you search to only
    PHP related answers add `[tag]` to your search. For example, if you want to search
    for questions about the `date` function, which is a common word in English and
    a common function name in many programming languages, search for `[php] date`
    to only get PHP specific information.


    At the time of writing, there were 864,182 questions tagged with `php`, 1,087
    tagged with `php` AND `command-line`, and 1,094 tagged with `php` AND `cli`. The
    moderators are usually very quick at shutting down duplicate questions, so you
    can see from these numbers that there is a lot of relevant information available.


    ## Other books


    While you may think that this is the only book on PHP you will ever need, I have
    been told that there may be other PHP books available out there. While I can’t
    recommend any specifically (other than those I have already noted in the relevant
    chapters), if you browse any big name bookseller you will find a plethora of PHP
    related titles. If do want to purchase another book, and would like to help support
    the PHP.net project, follow the links from the books section at [http://php.net/support.php](http://php.net/support.php)
    to a well known book store, and PHP.net will receive a commission for anything
    that you buy after following their link.


    ## Newsgroups


    PHP has a set of official newsgroups listed and archived at [http://news.php.net/](http://news.php.net/)
    which cover a wide range of PHP topic areas. These may be worth a browse, and
    sometimes can elicit a response to queries (although some of the internals lists
    are definitely not for the faint-hearted).


    ## PHP Subredit


    The PHP “Subredit” on reddit.com at [http://www.reddit.com/r/PHP/](http://www.reddit.com/r/PHP/)
    is a mixture of PHP news, opinions, useful links and requests for help. Although
    usually genuinely interesting with helpful responses to questions, an occasional
    assortment of trolls and unhelpful/rude people can be found here as well.


    ## PHP on Github


    Sometimes the best way to solve a problem is to look at similar code other people
    have written. Github, the popular source repository website, has tons of the stuff
    to plough through. You can search all of the code repositories at [https://github.com/search](https://github.com/search),
    and use the modifier `language:php` in your search terms to narrow your results
    to projects using our favourite language. If you just want to keep an eye on what
    PHP projects are popular these days, you can check out the PHP trending list at
    [https://github.com/trending?l=php](https://github.com/trending?l=php).


    ## PHP news sites


    Although not usually good for direct help, PHP news sites and mailing lists can
    keep you up to date with essentials like security alerts, useful and interesting
    articles, and announcements of new projects, libraries and tutorials that you
    may not even know you needed yet! Some of the more popular ones are listed below.

