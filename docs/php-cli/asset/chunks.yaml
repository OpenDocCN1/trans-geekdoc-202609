- fmt: '

    Once the commands above have been run, you should find that a `.so` file (`pcntl.so`
    in our example) has been compiled and placed in PHP’s extension directory. The
    final step is to tell PHP about it, by adding the following line somewhere in
    your `php.ini` file:


    ```

    1 extension=pcntl.so

    ```


    If you’re not sure where your `php.ini` file is, you can run `php -i | grep "Loaded
    Configuration File"` on the command line to find out. You can also use `php -i`
    to check that your extension is now correctly installed and available for use.


    ### Installing multiple versions of PHP


    Sometimes (particularly on development machines) you may want to install multiple
    versions of PHP at the same time, for instance if you are deploying to end users
    with PHP already installed but who may have different versions. One straight forward
    way to achieve this is to create a set of virtual machines (I use VirtualBox for
    this) with a different version of PHP installed in each. In this scenario you
    can always be sure which version you are running and that the installation and
    configuration of one version isn’t interfering with that of another. The downside
    is that it can be slow to start up and shut down different VMs (or a hit on resources
    to run them all at once), and if you are using proprietary OSes like Windows you
    can incur additional licensing costs. As I noted in a previous section, it is
    possible to have multiple versions installed and running directly on the same
    machine. However if you are not careful it can become a nightmare trying to keep
    the versions and their dependencies separate and making sure you know which version
    you are using at all times. As such I am not going to delve into it in this book.
    However below are two articles from respected PHP community members who have done
    just that, which may give you some pointers on what to do and the pitfalls involved.
    I would suggest that before you try this, you become intimately familiar with
    compiling and installing PHP, the file and directory structures and locations
    that PHP uses, and how to check which versions of PHP and extensions are running.


    There are also a couple of relevant tools listed below. The first is `php-build`,
    which automatically builds multiple versions of PHP from source, although you
    still need to exercise care installing and using them simultaneously. The second
    is `3v4l.org`, a web service which allows you to test chunks of code in 90+ versions
    of PHP at the same time. This may avoid the need for installing multiple versions
    at all. And the final tool is a library which simulates many functions from newer
    versions for use with older versions.


    ### PEAR and PECL


    PEAR (PHP Extension and Application Repository) is a library of code and extensions
    written in PHP, with an easy to use packaging and distribution system. PECL (PHP
    Extension Community Library) is essentially the same, but for extensions written
    in C.


    Both PECL and PEAR work in a similar way to package managers such as Debians `apt-get`.
    For example to install the Cairo graphics extension from PECL, simply do `sudo
    pecl install cairo` at the command line. This will download, compile, and


    ### The PHP manual


    The official manual can be found online at `http://php.net/docs.php`. The manual
    provides fairly comprehensive documentation on installation, syntax, functions
    and many extensions. Of particular note are the user comments at the bottom of
    each page. These are generally helpful and offer real-world advice related to
    the function. Occasionally some duff advice is given in the comments, however
    this is usually corrected or mentioned in a subsequent comment, so it’s worth
    reading through all the comments on a page.


    A handy function of the online manual is that you can do a quick look up of a
    function or topic by typing it as the first part of a URL. For instance, if you
    can’t remember what the parameters of `strripos()` are, you can simply type `http://php.net/strripos`
    into your browser and you will be sent straight to the relevant page. Likewise,
    if you want a quick refresher on how PHP handles arrays, visit `http://php.net/array`
    and you’ll go straight to the array page in the language/types section of the
    manual.


    ## Appendix B: Sources of help


    Even with excellent books like this, you will sometimes need little additional
    help when you come across a tricky problem. Below are some potential sources of
    help.

