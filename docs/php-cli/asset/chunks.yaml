- fmt: '

    I’ve been programming in PHP since late 2000. Initially it wasn’t by choice as
    my preferred languages at the time were Perl and Delphi (also known as Object
    Pascal). Things began to change after I graduated from the University of Leeds
    with a degree in Computer Science in 1999 and started out in a career as a freelance
    web developer. After only a couple of months I was offered the opportunity to
    take over a (relatively speaking) substantial government website contract from
    a friend who was exiting the freelance world for the safer and saner world of
    full-time employment. The only catch was that several thousand lines of code had
    already been written, and they were written in a relatively new language called
    `PHP`. Oh, and the only other catch was that I had about a week to learn it before
    taking over the site. So, as was the way at the time, I popped down to the local
    Waterstones bookshop (for the younger among you that’s where we used to get books.
    Books made of paper. And we had to go out and get them. Or order online and wait
    days for them to be delivered. Did I mention they were made of paper?). With my
    paper copy of `The Generic Beginners Complete Guide to PHP and MySQL for Dummies
    Compendium` book in hand (I may not have recalled the title completely correctly)
    I settled down with a pint of ale (I’m in Yorkshire at this point, remember) and
    set about reading it. A few days later I was coding like a pro (well, stuff was
    working) and 12 years later I haven’t looked back. After a varied career as a
    freelancer and starting up a couple of, er, startups (IT related and not) with
    varying (usually dismal) success, I’m now a full-time programmer at The University
    of Oxford. My day job involves medium-scale data acquisition and management, statistical
    analysis and providing user interfaces for researchers and the public. The majority
    of my development work is done in `PHP`, either developing new projects or gluing
    together other peoples software, systems and databases.


    Through-out my career I’ve always used `PHP` for web development, but for Desktop
    GUI work I initially used `Delphi` (and then `Free-Pascal/Lazarus`), complimented
    with `bash` shell scripting for other tasks. This was mainly due to learning them
    while at University. However, as `PHP` has matured I’ve increasingly used it beyond
    the web, and now I rarely use anything else for any programming or scripting task
    I encounter. Having been immersed in other languages like `C++`, `Javascript`,
    `Fortran`, `Lisp` (and probably others that my brain has chosen deliberately not
    to remember) by necessity during University and in some of my freelance jobs,
    I can honestly say that `PHP` is now my language of choice, rather than of necessity.


    When I’m not tied to a computer, I would like to say I have lots of varied and
    interesting hobbies. I used to have. I could write a whole book (which wouldn’t
    sell well) about where I’ve been and what I’ve done and I’d like to think it’s
    made me a well rounded person. But these days I don’t. In large part this is due
    to the demands of my three gorgeous young daughters Ellie, Izzy and Indy, my gorgeous
    wife Parv and my even more gorgeous cat Mia. And I wouldn’t have it any other
    way. That’s what I tell myself, anyway…


