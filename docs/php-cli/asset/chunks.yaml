    ### PHP 手册


    官方手册可以在网上 `http://php.net/docs.php` 找到。该手册提供了关于安装、语法、函数和许多扩展的详尽文档。特别值得注意的是每个页面底部的用户注释。这些注释通常很有帮助，并提供了与函数相关的实际建议。尽管注释中偶尔会给出一些糟糕的建议，但这些通常会在后续注释中得到修正或提及，因此值得阅读页面上的所有注释。


    在线手册的一个方便功能是，你可以通过输入 URL 的第一部分来快速查找函数或主题。例如，如果你忘记了 `strripos()` 的参数是什么，只需在浏览器中输入如
    http://php.net/strripos`，你将直接跳转到相关页面。同样，如果你想快速复习 PHP 如何处理数组，访问 `http://php.net/array`，你将直接进入手册中语言/类型部分的数组页面。


