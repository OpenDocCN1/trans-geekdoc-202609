  trans: "\n然而，在 CLI 脚本的世界中这被认为是不礼貌的。由于 CLI 命令的设计是为了协同工作（通常以命令链的形式运行），大多数 shell 程序和脚本在终止时都会提供一个“退出码”（exit\
    \ code），以便让其他程序知道它们*为什么*结束。它们是执行完毕？还是遇到了错误？或者是被错误地调用？好奇的心灵想要答案。\n\n当你的脚本可能是 shell\
    \ 脚本中的最后一个项时，提供退出码尤为重要，因为整个 shell 脚本的退出码被视为内部返回的最后一个退出码。我们可以通过通过将退出码作为 `exit`\
    \ 或 `die` 的参数，让我们的 PHP 脚本提供退出码。退出码是一个整数，有许多常见的退出码：\n\n* `0` : 成功 - 我们已正常退出。\n\
    * `1` : 通用错误 - 通常用于应用程序/语言特定的错误和语法错误\n* `2` : 用法不正确\n* `126` : 命令不可执行 - 通常与权限有关\n\
    * `127` : 找不到命令\n* `128+N`（最高至 `165`）：命令被 POSIX 信号数 N 终止 - 例如在 `kill -9 myscript.php`\
    \ 的情况下，它应该返回代码 137 (128+9)\n* `130` : 命令被 Ctrl-C 终止（Ctrl-C 是 POSIX 代码 2，因此如上述\
    \ 128+2 = 130）\n\n任何其他正整数通常被解释为由于未指定的错误而退出。例如，如果你判断用户提供的命令行参数格式不正确，你应该使用 `exit(2)`\
    \ 终止脚本。如果一切顺利且你的脚本一直运行到文件末尾，你实际上可以让它自行退出（或通过不带参数地调用 `exit`），因为它默认返回状态码 0。\n\n\
    与 Web 脚本一样，你可以使用 `register_shutdown_function()` 函数注册在 PHP 脚本退出时执行的函数。这的一种用途可能是检查一切是否正常，并评估应该返回哪种退出码。在注册的关机函数内部，作为\
    \ `exit` 或 `die` 参数使用的退出码，将覆盖启动关机的初始退出调用中所使用的代码码。这意味着你可以放心地在任何地方使用 `exit(0)`，如果你检测到元空间对象中的\
    \ foo 聚合与 bar 初始化不匹配，则在关机函数中执行 `exit(76)`。或者类似的操作。\n\n### 3.7 PHP REPLs\n\n当你想要测试几行\
    \ PHP 代码时，你的直觉可能是创建一个新的 PHP 文件，保存它，然后用 PHP 执行它。然而，有一种更好、更快且更具交互性的方法。PHP “交互式外壳”，也称为\
    \ PHP REPL（读取-求值-打印循环），是一种输入代码并使其立即执行的快速简便的方法。与使用 `php -r` 执行单行代码不同，REPL（通过调用\
    \ `php -a` 启动）会在你输入的每行之间保持脚本的状态（例如变量和对象的内容），直到你退出为止。你可以使用 PHP 的所有函数，尽管默认没有加载任何库，并且你可以\
    \ `include()` 或 `require()` 现有的 PHP 代码文件。后一种功能对于调试问题脚本的最终输出非常有用只需 `include()`\
    \ 你的脚本，它就会执行；只要脚本没有提前终止，你就可以使用 `echo()` 或 `print_r()` 或其他方式探索运行结束时变量和其他资源的状态。还有其他类型的\
    \ REPL，将在在本节的后续部分列出。根据其性质，它也可以本身作为 CLI / Shell 使用，调用其他 PHP 和非 PHP 程序，就像你在 bash\
    \ shell 中调用它们一样。\n\n下面的示例是使用标准 PHP REPL 的实际交互式 REPL 会话的。\n\n```\n 1 ~$ php -a\n\
    \ 2 Interactive shell\n 3 \n4 php > # 既然我们可以输入任何有效的 PHP，我添加了注释\n5 php > # 直接添加到\
    \ REPL 中，而不是事后再编辑！\n6 php > \n7 php > # 让我们从一些简单的赋值开始：\n8 php > \n9 php > $a =\
    \ 5;\n10 php > $b = 6;\n11 php > \n12 php > # REPL 会根据情况抛出通知、警告和错误，\n13 php >\
    \ # 并且实时显示：\n14 php > \n15 php > $c = nothingdefined;\n16 PHP Notice:  Use of\
    \ undefined constant nothingdefined - assumed \n17 'nothingdefined' in php shell\
    \ code on line 1\n18 php > \n19 php > # 就像对于普通的 PHP 源文件一样，我们可以跨行拆分命令。\n20 php\
    \ > # 解释器只有在遇到终止的分号时才会介入：\n21 php > # 分号：\n22 php > \n23 php > $d \n24 php > =\n\
    25 php > 7\n26 php > ;\n27 php > \n28 php > # 下面显示了上述变量中的状态被\n29 php > # 保留了：\n\
    30 >\n31 php > echo $a + $b + $c + $d .\"\\n\";\n32 18\n33 php >\n```\n\n"
- fmt: '

    As well as the built in PHP REPL explored above, there are a number of third-party
    REPLs available, some of which include features such as a history of commands
    typed, tab-completion of commands, protection from fatal errors and even abbreviated
    function documentation.


    ## 4. User facing software


    After-slugging through the preliminary information necessary to understand developing
    PHP in a non-web context, we’re now getting to the nitty-gritty of how to start
    communicating with our users without the rendering engine of a web browser.


    ### 4.1 Command line interface basics


    Although graphical interfaces seem to rule the roost these days, there are still
    plenty of uses for text-based interfaces, particularly in environments with technically-adept
    users. When creating a text based program to run on the command line, there are
    three primary considerations over-and-above the PHP you are already accustomed
    to. These are:


    1. Getting keyboard input

    2. Outputting text (and graphics) to the screen

    3. Program flow control


    Rather than describe each one in isolation, we will instead look through a simple
    program that contains elements of each. Read through the code and comments below.
    The program is a screen-saver type routine which fills the shell with colour via
    a wiggling snake-like cursor.

    '
