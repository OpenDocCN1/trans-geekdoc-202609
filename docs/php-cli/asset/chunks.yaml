  trans: "\n\n### 4.2 高级命令行输入\n\n在上面的小节中，我们使用了 `fread()` 来读取键盘输入。这对于简单的程序非常合适，但如果你想创建一个更复杂的界面来允许用户发布命令，那么你可能希望查看\
    \ `readline` 扩展，你可以使用它来实现一个类似 shell 的可编辑命令行程序。\n\n接下来的示例脚本展示了如何使用 `readline` 库实现一个简单的自定义命令行类型界面。\n\
    \n```php\n<?\n# 创建数组来存储我们的命令历史记录和有效命令列表。\n\n$history = array();\n$validCommands\
    \ = array();\n\n# 定义一些有效命令。\n\n$validCommands[] = 'kill';\n$validCommands[] =\
    \ 'destroy';\n$validCommands[] = 'obliterate';\n$validCommands[] = 'history';\n\
    $validCommands[] = 'byebye';\n\n# 我们希望启用命令的制 键补全功能，这允许用户\n# 开始输入命令，然后按 Tab 键完成输入，就像在\n\
    # Bash shell 等类似环境中发生的那样。我们需要提供一个函数（通过\n# readline_completion_function）来提供一个可能的函数\n\
    # 名称数组。这可以基于用户输入的 $partial 字符\n# 或者程序所处的位置，或者任何我们想要的\n# 因素。在我们的情况下，我们将提供一个包含所有\n\
    # 有效命令的数组。\n\nfunction tab_complete ($partial) {\n\tglobal $validCommands;\n\t\
    return $validCommands;\n};\n\nreadline_completion_function('tab_complete');\n\n\
    # 现在进入主程序循环。注意我们没有包含 usleep，\n# 因为 readline 在等待用户输入时会暂停程序的执行。\n\nwhile (1) {\n\
    \n\t# 我们调用 readline 并传入一个构成命令提示符的字符串。\n\t# 在我们的情况下，我们将日期和时间放在其中，显示每次\n\t# 调用时都会更改。用户输入的任何内容都会被返回。这\n\
    \t# 行简单的代码实现了 readline 的大部分魔法功能。在此阶段\n\t# 用户可以利用 Tab 补全、历史记录（使用上/下方向键）等功能。\n\n\
    \t$line = readline(date('H:i:s').\" 正在输入命令 > \");\n\n\t# 我们需要手动将命令添加到历史记录中。这用于\n\
    \t# 用户通过上/下方向键访问的命令历史。如果我们想，\n\t# 可以选择忽略命令（例如，输入错误的命令或\n\t# 中间输入）。\n\t\n\treadline_add_history($line);\n\
    \t\n\t# 如果我们想通过程序检索历史记录，可以使用\n\t#名为 readline_list_history() 的函数。然而，只有当\n\t# PHP\
    \ 使用 libreadline 编译时才可用。在大多数情况下，\n\t# 现代发行版由于许可等原因使用兼容的\n\t# libedit 库进行编译。因此我们将在数组中保留一份\n\
    \t# 历史行的副本以便程序化访问。\n\n\t$history[] = $line;\n\n\t# 现在我们决定对用户的输入做什么。在现实生活中，\n\t\
    # 我们可能需要先对输入进行 trim()、strtolower() 和其他过滤。\n\n\tswitch ($line) {\n\n\t\tcase \"\
    kill\":\n\t\t\techo \"你不想做那个。\\n\";\n\t\t\tbreak;\n\n\t\tcase \"destroy\":\n\t\
    \t\techo \"那真的不是个好主意。\\n\";\n\t\t\tbreak;\n\n\t\tcase \"obliterate\":\n\t\t\t\
    echo \"好吧，如果我们真的必须这样做。\\n\";\n\t\t\tbreak;\n\n\t\tcase \"history\":\n\t\t\t# 我们将使用之前创建的命令历史副本\n\
    \t\t\t# 来显示命令历史记录。\n\n\t\t\t$counter = 0;\n\n\t\t\tforeach($history as $command)\
    \ {\n\t\t\t\t$counter++;\n\t\t\t\techo(\"$counter: $command\\n\");\n\t\t\t};\n\
    \t\t\tbreak;\n\n\t\tcase \"byebye\":\n\t\t\t# 如果该离开了，我们想要跳出语句\n\t\t\t# 和 while\
    \ 循环，所以使用级别为 2 的 break。\n\t\t\tbreak 2;\n\n\t\tdefault :\n\t\t\t# 始终记住在用户出错时给出反馈。\n\
    \t\t\techo(\"抱歉，\".$line.\" 未被识别。\\n\");\n\t}\n}\n# 如果我们到达这里，说明用户输入了 byebye。\n\
    echo(\"再见，下次见！\\n\");\n```\n\n你可能注意到我选择使用 `byebye` 作为退出命令。这不仅仅是我个人的心血来之，，而是为了说明“可发现性”（discoverability）的重要性。如果你面对这个程序，在没有看到源代码的情况下，并被要求关闭它，你可能会在诉诸使用\
    \ `Ctrl-C` 之前尝试 `quit`、`exit` 等。在 GUI 界面中，当你面对一个写着“Bye!”的按钮时，也会遇到此类问题。在文本输入中，最好遵循常见且易于记忆的格式，尽可能提供视觉引导和线索，并通过\
    \ `help` 命令和用户训练来辅助可发现性。\n\nPHP CLI SAPI 在脚本启动时会自动为你打开标准流，因此不需要发布诸如 `php://stdin`\
    \ 之类的命令。你可以将这些流视为任何其他 PHP 流，并直接启动它们。我们在上面已经包含了一些示例，但这里有更多示例用于说明。\n\n```php\n<?\n\
    # 从 STDIN 获取一行输入\necho ('请输入 : >');\n\n$line1 = fgets(STDIN);\necho ('**** 第一行\
    \ : ****\\n');\n\n# 获取不带换行符的输入\necho ('请输入 : >');\n\n$line2 = trim(fgets(STDIN));\n\
    echo ('**** 第二行 : ****\\n');\n\n# 将数组写入 STDOUT 并转换为 CSV 格式。\n# 首先创建一个数组...\n$records[]\
    \ = array('User', 'Full Name', 'Gender');\n$records[] = array('Ada', 'Countess\
    \ of Lovelace', 'F');\n$records[] = array('Grete', 'Hermann', 'F');\n$records[]\
    \ = array('Rob', 'Aley', 'M');\n\necho (\"以下是 CSV 格式的数据 :\\n\\n\");\n\n# ...动态将每个数组转换为\
    \ CSV\nforeach ($records as $record) {\n\tfputcsv(STDOUT, $record);\n};\n\necho\
    \ (\"\\n 数据结束\\n\");\n\n# 等待用户输入数字\necho ('请输入一个或多个数字 : >');\n\nwhile (! fscanf(STDIN,\
    \ \"%d\\n\", $your_number) ) {\n\techo (\"未找到数字 :>\");\n};\n\necho (\"你的数字是 $your_number\\\
    n\\n\");\n\n# 将网页文本发送到 STDOUT\necho (\"回车查看网页内容 :\\n\\n\");\n\nfread(STDIN, 1);\
    \ # fread 等待按键\n\nfwrite(STDOUT, strip_tags( file_get_contents('http://www.cam.ac.uk')\
    \ ) );\n\n# 将错误消息发送到 STDERR。你可以直接 fwrite(STDERR,...\n# 如果你需要，或者可以使用 error_log\
    \ 函数，它使用\n# 定义的错误处理程序。对于 CLI SAPI，默认是\n# 打印到 STDERR。\n\nerror_log('系统啤酒光光了。中止。中止。',4);\n\
    ```\n\n最后一行记录的错误通常会在你的 shell 中与其他输出一起显示，因为这是大多数 shell 放置 `STDERR` 的地方。如果你想检查它确实来自\
    \ `STDERR` 而不是 `STDOUT`，下面的 bash 命令会将任何 `STDERR` 输出（由 `2>` 标记）显示为红色。它使用转义代码来着色错误（31\
    \ 设置为红色，07 反转颜色，然后 0 清除）：\n\n```bash\nphp script.php 2> >(while read errors; do\
    \ echo -e \"\\e[07;31m$errors\\e[0m\" \n\t>&2;  done)\n```\n\n简而言之，我们可以以多种方式使用标准流，通常将其视为任何其他文件指针或流。\n\
    \n"
- fmt: "\nThere are some pre-written libraries/components available that can take\
    \ some of the effort out of creating interactive console software. I’ve listed\
    \ three common ones below. As with most libraries of this type, they are quite\
    \ “opinionated” in how your program should be structured, so do look thoroughly\
    \ through the documentation of each before choosing which best suites your project.\
    \ The Symfony console (part of the Symfony Framework project) is well tested and\
    \ very stable, as with most Symfony components it is well documented and supported.\
    \ If you are familiar with the Symfony Framework then the code style should be\
    \ familiar, but it is equally at home with other Frameworks (it is used for the\
    \ Laravel Framework Artisan Console tool). The Webmozart Console toolkit is a\
    \ re-factored version of the Symfony Console component, so has similar features,\
    \ but a different coding style. It is also currently still in Beta. Finally, the\
    \ Hoa Console is perhaps the most distinct of the three, with a coding style that\
    \ focuses on real-world tasks and is arguably easier to get to grips with as a\
    \ developer.\n\n# 5. PHP CLI scripts and your system\n\nThere are a number of\
    \ areas where PHP CLI scripts typically interact with your system. While most\
    \ system interactions are identical to you’re used to with web scripts, there\
    \ are a few area’s that you may not have used much, and we’ll look at a few gotcha’s\
    \ that might trip you up.\n\n## 5.1 Starting external processes from PHP, or “shelling\
    \ out”\n\nA common feature of CLI scripts is calling and interacting with other\
    \ scripts and processes. Using other scripts and programs as “building blocks”\
    \ within your script is a common pattern of CLI programming. As we’ve seen earlier,\
    \ you can often combine your PHP script with others in general purpose shell scripts,\
    \ but often it is useful for the PHP script itself to start other software when\
    \ it needs to. This is often referred to as “shelling out”.\n\nThere are a number\
    \ functions available in PHP to achieve this, each doing it in a slightly different\
    \ way and with different benefits:\n\n* `exec()` : Executes a program and sends\
    \ the text output to the user\n* `passthru()` : Executes a program and sends the\
    \ binary output to the user\n* `system()` : Executes a program and gathers the\
    \ output for use by PHP\n* `shell_exec()` : Executes a command via a shell and\
    \ gathers it’s output for use by PHP\n* Backtick operator (e.g. `\\`command``)\
    \ : identical to `shell_exec()` above\n* `pcntl_exe()` : Executes a program in\
    \ the current process space, that is to say it stops the current PHP script and\
    \ replaces it with the specified program\n* `popen()` : Executes a program and\
    \ opens a file pointer (identical to the pointers returned by `fopen()` for example)\
    \ to read or write to the process via STDOUT or STDIN. Can only read or write,\
    \ not both.\n* `proc_open()` : Like `popen()`, but with more control. Allows both\
    \ reading and writing at the same time. Not as simple to use as `popen()`.\n\n\
    Which method you choose depends on what you intend to do with the newly opened\
    \ process and how (or indeed if) you want to talk to it. If you’re not sure from\
    \ the descriptions above which function is appropriate for your use, the Further\
    \ Reading list below gives some pointers, information and examples of implementations\
    \ which should give you some direction.\n\nWhen calling external scripts, remember\
    \ that using untrusted user input in command names or options is a recipe for\
    \ a bad security day! The `escapeshellarg()` function can protect you from some\
    \ inadvertent mistakes, but won’t stop you executing “bad” functions or files.\n\
    \n## 5.2 File Status and Realpath caches\n\nOn the web, speed is king. PHP operates\
    \ two information caches to speed up access to the filesystem. The first is the\
    \ file status cache, which caches information about a given file (like whether\
    \ it exists, whether it is readable, it’s size and type, and so on). The second\
    \ is the realpath cache, which caches the actual, real path for a given file or\
    \ directory (expanding out symlinks, relative paths, `.` and `..` paths, include_path’s\
    \ and so on). Information is added to the cache automatically by PHP each time\
    \ it encounters a new file, and is then used by any number of functions the next\
    \ time they attempt to look at that same file. With a web page that’s gone in\
    \ the blink of an eye where little may have happened on the filesystem, this is\
    \ often a good trade-off for increased performance.\n\nHowever the chances that\
    \ the details of a file or path may change while your script runs obviously increase\
    \ with the length of time that your script takes to execute. Therefore PHP gives\
    \ us a couple of options for working with these two caches.\n\nThe following example\
    \ shows the file status cache in action, and how to use `clearstatcache()` to\
    \ clear it.\n\n```\n 1 <?\n 2 \n 3 # Create a file and add some text to it\n 4\
    \ \n 5 $filename = 'test.txt';\n 6 \n 7 $handle = fopen($filename, 'w+');\n 8\
    \ \n 9 fwrite($handle, 'test');\n10 \n11 # The following should print 4\n12 \n\
    13 echo stat($filename)[\"size\"].\"\\n\";\n14 \n15 # Now write some data to the\
    \ file, increasing the file size.\n16 \n17 fwrite($handle, 'more test');\n18 \n\
    19 # Intuitively, the following command should print 13 as the file is now\n20\
    \ # bigger than before. However it still prints 4, because the filesize \n21 #\
    \ value for this file is now cached.\n22 \n23 echo stat($filename)[\"size\"].\"\
    \\n\";\n24 \n25 # If we clear the cache ....\n26 \n27 clearstatcache();\n28 \n\
    29 # then the next line should print 13 as expected\n30 \n31 echo stat($filename)[\"\
    size\"].\"\\n\";\n32 \n33 fclose($handle);\n```\n\nThe realpath cache operates\
    \ in a similar way, and can be cleared by calling `clearstatcache(true)`, i.e.\
    \ by calling it with true as the first parameter. You can also clear the cache\
    \ for just one file by calling `clearstatcache(true, 'myfile.txt')`, where the\
    \ second parameter is the filename (and the first must be set to true).\n\nOf\
    \ course clearing these caches may not be necessary in your application and doing\
    \ so has performance implications. Consider each file access on a case-by-case\
    \ basis.\n\n### 5.3 APC and other code caches\n\nYou may be aware of the APC caching\
    \ system and other code caching systems that act to speed up the startup time\
    \ of your script. APC, and most other systems, will not work with CLI scripts\
    \ (or at least not add any benefit) as they work on a shared process model found\
    \ with webservers such as Apache. As PHP CLI scripts (typically) terminate their\
    \ own process when they complete, these will not work.\n\n# 6. Where now? or,\
    \ Thanks & feedback\n\nIf you’ve read this far, thank you. I sincerely hope that\
    \ this book has held your interest and at the very least informed some areas of\
    \ your future PHP programming. If it has, I would encourage you to start some\
    \ coding right now based on one or more topics in this book while they are still\
    \ fresh in your mind. People far smarter than me have shown that the sooner relevant\
    \ activity occurs after learning, the easier it is to retain information and techniques\
    \ over the longer term. If you use any of the techniques presented in the book\
    \ in “real-life”, I would be very interested to know! Finally, if you’ve not already\
    \ headed for the keyboard, don’t forget to glance through the Appendices that\
    \ follow. There may be something interesting or useful in there for you (either\
    \ to use now or to be aware of for the future).\n\n## 6.1 Upgrade to “PHP Beyond\
    \ The Web” for only $5!\n"
