- raw: '*   Fuzzy C-Means (FCM) Clustering


    2.  Distribution-based Methods


    The main distribution-based techniques are as follows:


    *   Gaussian Mixture Models (GMMs): The model assigns probabilities for the cluster
    membership of data points by modelling clusters as overlapping Gaussian distributions.


    *   Expectation-Maximisation Algorithms


    *   Dirichlet process mixture models (DPMMs)


    3.  Connectivity Based Methods


    Connectivity based methods are:


    *   Hierarchical clustering: By merging or dividing clusters, hierarchical clustering
    constructs a dendrogram, a tree-like structure, without a predetermined number.


    *   Agglomerative Clustering


    *   Divisive clustering


    *   Affinity propagation


    4.  Density Based methods


    Density based methods are:


    *   DBSCAN (Density-Based Spatial Clustering of Applications with Noise): Creates
    density-based clusters using distance and point parameters, allowing for customisable
    forms and outlier detection.


    *   OPTICS (Ordering Points to Identify the Clustering Structure): OPTICS is a
    clustering algorithm that identifies density-based clusters in data, handling
    varying densities by ordering points to reveal clustering structure without explicitly
    producing a partitioning like DBSCAN.


    b)       Dimensionality Reduction


    Datasets can be made simpler by using dimensionality reduction, which lowers the
    amount of features while keeping the most crucial information.


    1.  Principal Component Analysis (PCA): Converts information into a fresh collection
    of principal components, or orthogonal features, that best represent the variance.


    2.  t-distributed Stochastic Neighbour Embedding (t-SNE): Reduces dimensionality
    while maintaining local linkages in order to visualise high-dimensional data.


    3.  Non-negative Matrix Factorisation (NMF): It is helpful for sparse data, such
    as text or images, to factorise data into non-negative components.


    4.  Isomap: In order to capture non-linear structures in data, geodesic distances
    are preserved.


    5.  Locally Linear Embedding (LLE): Local relationships are preserved by reconstructing
    data points from their neighbours.


    6.  Latent Semantic Analysis (LSA): Reveals hidden patterns by reducing the dimensionality
    of text data.


    7.                       Autoencoders: Neural networks are helpful for anomaly
    detection and feature learning because they can compress and recreate data.


    c)       Association Rule


    Analyse patterns (also known as association rules) among goods in huge datasets,
    usually in market basket research (e.g., discovering that individuals who purchase
    bread also buy butter). It finds patterns just by looking at how often items and
    co-occurrences occur in the dataset.


    1.  Apriori algorithm: Iteratively going through the data and eliminating infrequent
    item combinations, it finds frequent item-sets.


    2.  FP-Growth (Frequent Pattern-Growth): Mines frequent item-sets efficiently
    without the need for candidate generation by employing a compressed FP-tree structure.


    3.  ECLAT (Equivalence Class Clustering and bottom-up Lattice Traversal): Enables
    more rapid and frequent pattern finding by effectively intersecting item sets
    using a vertical data structure.


    3.  Reinforcement Learning Algorithms


    In reinforcement learning, agents are trained to make a series of choices by rewarding
    good behaviour and punishing poor behaviour. These techniques may be broadly divided
    into two categories: Model-Based and Model-Free methods. They vary in their interactions
    with the environment.


    a)       Model-Based Methods


    These techniques simulate possible outcomes using a model of the environment to
    forecast outcomes and assist the agent in planning actions.


    *   Markov decision processes (MDPs)


    *   Bellman equation


    *   Value iteration algorithm


    *   Monte Carlo Tree Search


    b)       Model-Free Methods


    These approaches neither create nor depend on an explicit environmental model.
    By interacting with the environment and modifying its activities in response to
    input, the agent instead gains firsthand experience. Value-Based and Policy-Based
    approaches are two more subcategories of model-free approaches:


    1.  Value-Based Methods: Concentrate on learning the values of several states
    or actions, in which the agent chooses the action with the greatest value after
    estimating the anticipated return from each one.


    *   Q-Learning


    *   SARSA


    *   Monte Carlo Methods


    2.  Policy-based Methods: The agent continually modifies its policy to optimise
    rewards by directly learning a policy (a mapping from states to actions) without
    guessing values.


    *   REINFORCE Algorithm


    *   Actor-Critic Algorithm


    *   Asynchronous Advantage Actor-Critic (A3C)


    ## 2.4                 Data Preprocessing


    Data preprocessing, a component of data preparation, refers to any form of processing
    that is conducted on unprocessed data in order to prepare it for a subsequent
    data processing procedure. It has long been a crucial first stage in the data
    mining procedure. Data preparation approaches have been modified more recently
    for use in training AI and machine learning models as well as for making inferences
    against them.


    To make data mining, machine learning, and other data science operations easier
    and more efficient, data preprocessing converts the data into a format. To guarantee
    correct results, the methods are often used at the very beginning of the machine
    learning and artificial intelligence development process.


    Preprocessing data may be done using a variety of tools and techniques, such as
    the following:


    1.  Sampling is the process of choosing a representative selection of data from
    a large population.


    2.  Transformation creates a single input by modifying raw data.


    3.  Data noise is eliminated using denoising.


    4.  Imputation, which fills in missing values with statistically significant data.


    5.  Normalisation is the process of arranging data for easier access.


    6.  Feature extraction, which identifies a subset of features that are pertinent
    and important in a certain situation.


    These tools and techniques can be used to a range of data sources, such as streaming
    data and data saved in files or databases.


    1.  Steps For Data Preprocessing


    ![https://www.techtarget.com/rms/onlineimages/steps\_for\_data\_preprocessing-f.png](Image00008.jpg)


    Figure ‎ 2.7: Steps for Data Preprocessing.  [\[7\]](#text00015.html#_ftn7)


    The following are some of the steps involved in data preprocessing:


    a)     Data Profiling: The practice of looking at, evaluating, and assessing data
    in order to get statistics on its quality is known as data profiling. A study
    of the current data and its features is the first step. In order to create a hypothesis
    about characteristics that could be useful for the proposed analytics or machine
    learning activity, data scientists first discover data sets that are relevant
    to the issue at hand and then catalogue its significant properties. They also
    think about which preprocessing libraries may be employed and connect data sources
    to pertinent business ideas.


    b)    Data Cleansing: In order to ensure that the raw data is appropriate for
    feature engineering, the goal is to identify the simplest method of fixing quality
    concerns, such as removing inaccurate data or adding missing data.


    c)     Data Reduction: Raw data sets often include duplicate information that
    results from characterising occurrences in several ways or information that is
    unrelated to a certain machine learning, artificial intelligence, or analytics
    application. Data reduction converts raw data into a more manageable format appropriate
    for certain use cases by using methods such as principal component analysis.


    d)    Data Transformation: Here, data scientists consider how various data elements
    might be arranged to best serve the objective. This may encompass the following:
    the organisation of unstructured data, the integration of salient variables when
    appropriate, or the identification of critical ranges to concentrate on.'
