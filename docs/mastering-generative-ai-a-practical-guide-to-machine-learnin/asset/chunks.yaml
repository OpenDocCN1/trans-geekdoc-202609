  trans: '


    在图像和语音识别等应用中，正确分类每个数据点是至关重要的，因为单个分类错误就可能导致模型预测结果出现巨大偏差。


    ## 3. 判别式 AI 的工作


    判别式 AI 模型通过监督学习在标注数据集上进行训练，这使其能够识别输入数据中的独特模式和决策边界。该过程包括：


    1. **标注数据上训练**：将带有“猫”或“狗”等标签的标注数据输入模型中。

    2. **特征提取**：提取区分不同类别的关键特征，包括纹理或形状。

    3. **决策边界形成**：模型根据学习到的特征划分不同的类别。

    4. **新数据分类**：当面对未知数据时，模型利用其学习到的模式来准确识别输入。


    以下是判别式 AI 常用的机器学习技术：


    - `Logistic regression`（逻辑回归）用于分类。

    - `SVMs`（支持向量机）用于决策。

    - `Neural networks`（神经网络），如 `CNNs` 和 `RNNs` 用于识别。


    ## 4. 判别式 AI 的未来


    随着 AI 技术的发展，判别式模型变得更加准确和有效，结合深学习实现了更高的精度。它们越来越多地应用于对精确分类至关重要的领域，例如网络安全、无人驾驶和医疗诊断。


    得益于 AI 伦理和偏差消除的持续进步，未来的判别式模型将更加开放、公平且可解释。随着机器学习算法理解力和效率的进一步提高，这些模型将在数据应用中至关重要。


    ## 1.6 AI 概述


    人工智能（AI）这一计算机科学领域的目标是制造计算机、控制机器人以及像人类一样智能行为的软件。为了开发智能软件和系统，人工智能的基本思想是研究人类认知的模式和机制。AI
    详细研究人类如何感知、学习和决策。AI 的最终目的是创建能够推理、基于经验学习、环境适应以及需要人类智力的机器。


    ### 1. 人工智能简史


    人工智能（AI）的历史跨越数十年。以下是该领域的重大节点和进展概述：


    - a) **1950 年代**：1950 年标志着 AI 革命的开始，研究人员开始探索机器展示智能行为的潜力。`Alan Turing` 等人物引入了机器智能的概念，并创建了著名的`Turing
    Test` 来评估计算机类人智能的能力。

    - b) **1956 年**：`John McCarthy` 被认为创造了“人工智能”这一术语并组织了达特茅会议，这被认为是 AI 作为一个研究学科的正式开始。著名科学家聚集在一起讨论人工智能的潜力和前景。

    - c) **1960 年-1970 年**：专家系统（旨在复制特定领域人类专家决策能力的计算机程序）是当时 AI 研究的重点。然而，现实问题的复杂性和技术限制限制了早期
    AI 系统的发展。

    - d) **1980 年-1990 年**：AI 经历了“AI 寒冬”，资金和公众关注下降。AI 研究进展缓慢，未能达到预期。尽管如此，自然语言处理、知识表示和机器学习等领域的研究持续，为进一步的发展奠定了基础。

    - e) **20 世纪 90 年代末-21 初**：随着计算能力的提高以及数据驱动方法和神经网络等新方法的流行，AI 迎来了复兴。数据挖掘、计算机视觉和语音识别等应用开始产生令人鼓舞的结果。

    - f) **2010 年代**：由于大数据和深度学习的发展，人工智能取得了重大进展。由多层神经网络驱动的深度学习模型在自然语言处理、图像识别和游戏等各种任务中显示出惊人的成果。

    - g) **如今**：如今人工智能（AI）渗透到生活的方方面，从推荐引擎、虚拟助手到自动驾驶汽车和医疗诊断。随着深度学习、强化学习和机器学习方法的进步，它们正在推向人工智能的极限。


    ### 2. 弱 AI vs. 强 AI


    弱 AI 和强 AI 在能力和类人智能程度上存在区别：


    - a) **弱 AI**：弱 AI 系统是指设计在限制区域内执行某些活动或功能的系统。它们有时被称为狭义 AI 或应用 AI。弱 AI 缺乏通用智能，只关注解决特定问题。这些系统经过训练或设计，非常擅长某些任务，包括国际象棋、图像分类或语音识别。它们无法在指定区域之外扩展知识或能力，并在良好定义的参数内工作。

    - b) **强 AI**：强 AI，通常被称为人类级 AI 或通用人工智能（`AGI`），试图在各种活动和领域模拟人类水平的智力。强大的工智能系统能够以模拟人类认知能力的方式理解、学习和使用信息。与人类类似，它们具备意识、自我意识和推理能力。强
    AI 旨在复制人类大脑的复杂性和灵活性，允许机器人展示广泛的认知能力并在各个领域执行活动。


