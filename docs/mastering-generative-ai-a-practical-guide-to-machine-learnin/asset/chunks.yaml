- raw: 'Similar to Q-learning, SARSA is another reinforcement learning method; however,
    instead of updating the Q-values according to the optimal course of action, it
    bases them on the action the agent actually does. This guarantees that the agent
    learns in accordance with the existing policy and makes SARSA more conservative.


    ## 2.3                 Machine Learning Algorithms


    The AI system''s mode of operation, which often involves predicting output values
    from input data, is called a machine learning algorithm. Regression and classification
    are the two primary steps in machine learning (ML) algorithms.


    In essence, machine learning algorithms are collections of instructions that,
    without explicit programming, enable computers to learn from data, generate predictions,
    and gradually improve their performance. Three major categories can be used to
    classify machine learning algorithms:


    1.  Supervised Learning: Labelled data, in which the link between input and outcome
    is understood, is what algorithms learn from.


    2.  Unsupervised Learning: Algorithms find patterns or groups in unlabelled data.


    3.  Reinforcement Learning: Algorithms acquire knowledge through interaction with
    an environment and feedback in the form of rewards or penalties.


    1.  Supervised Learning Algorithms


    Supervised learning algorithms are trained on datasets in which each example is
    associated with a target or response variable, which is referred to as the label.
    To enable the model to provide precise predictions on unseen data, the objective
    is to develop a mapping function from input data to the associated output labels.


    The two primary categories of supervised learning algorithms are classification
    and regression.


    1.  Classification: Classification properly assigns test results into distinct
    groups using an algorithm. The system identifies certain entities in the dataset
    and makes an effort to determine how those things need to be described or labelled.
    Random forests, K-nearest neighbour, decision trees, support vector machines (SVM),
    and linear classifiers are examples of common classification algorithms.


    2.  Regression: Regression is employed to comprehend the correlation between independent
    and dependent variables. It is often used to forecast things like a company''s
    sales revenue. Popular regression methods include polynomial, logistic, and linear
    regression.


    Supervised machine learning processes use a variety of calculation methods and
    algorithms, which are often computed using Python and other similar programs.
    Among the supervised learning algorithms are:


    1.  AdaBoost or gradient boosting : Adaptive boosting is another name for this
    strategy, which combines a regression algorithm that performs poorly with weaker
    ones to make it stronger and produce less errors. The predicting ability of many
    base estimators is combined in boosting.


    2.  Artificial neural networks : Also referred to as ANNs, neural networks, or
    simulated neural networks (SNNs), they are a subset of machine learning techniques
    that are the foundation of deep learning algorithms. The learner algorithm uses
    building blocks called neurones, which are modelled after the trained and adjusted
    neurones in the human brain, to identify patterns in incoming data.


    3.  Decision tree algorithms : Decision trees, which may be shown with a tree
    diagram, use a branching series of connected choices to categorise data into categories
    and forecast numerical values (regression issues). In contrast to the neural network''s
    dark box, decision trees have the benefit of being simple to verify and audit.


    4.  Dimensionality reduction : A chosen data collection is said to have high dimensionality
    if it contains a large number of features. The most significant ideas or information
    are then left behind after dimensionality reduction reduces the number of characteristics.
    An illustration is principal component analysis.


    5.  K-nearest neighbour : This non-parametric technique, sometimes referred to
    as KNN, groups data points according to their associations and closeness to other
    accessible data. It makes the assumption that comparable data points may be located
    close to one another. Therefore, it aims to determine the distance between data
    points, often using the Euclidean distance, and then classifies the data according
    to the average or most common category.


    6.  Linear regression : Linear regression is employed to establish a correlation
    between a dependent variable and one or more independent variables, usually in
    order to make predictions about future outcomes. Simple linear regression is the
    process of analysing data with just one independent variable and one dependent
    variable.


    7.  Logistic regression : Logistic regression is used when the dependent variable
    is categorical, meaning that there are binary outputs, such as "true" and "false"
    or "yes" and "no," while linear regression is used when the dependent variables
    are continuous. Logistic regression is primarily employed to address binary classification
    issues, including spam detection, even though both regression models aim to comprehend
    the connections between data inputs.


    8.  Neural networks : Neural networks, which are mostly used for deep learning
    algorithms, use layers of nodes to analyse incoming training data in a manner
    that replicates the interconnectedness of the human brain. Inputs, weights, a
    bias (threshold), and an output comprise each node. Data is transmitted to the
    subsequent stratum in the network when the output value surpasses a specified
    threshold, causing the node to "fire" or activate. Neural networks use gradient
    descent to learn from modifications depending on the loss function. The accuracy
    of the model may be trusted when the cost function is at or close to zero.


    9.  Naïve Bayes : This method uses the Bayes Theorem''s class conditional independence
    principle. This indicates that each predictor has an equal influence on a particular
    outcome and that the existence of one characteristic does not affect the presence
    of another in the likelihood of that event. Multinomial Naïve Bayes, Bernoulli
    Naïve Bayes, and Gaussian Naïve Bayes are the three varieties of Naïve Bayes classifiers.
    Text categorisation, spam detection, and recommendation systems are the main applications
    for this technology.


    10.  Random forests : A random forest is a machine learning approach that combines
    the output of many decision trees to predict a value or category. Uncorrelated
    decision trees are referred to as the "forest" because they are put together to
    lower variance and provide forecasts that are more accurate.


    11.  Support vector machines (SVM) : Usually, this approach creates a hyperplane
    when the distance between two classes of data points is at its highest. It may
    be used to both regression and data classification issues. The classifications
    of data points (oranges vs. apples) on each side of the hyperplane are separated
    by what is called the decision boundary.


    2.  Unsupervised Learning Algorithms


    Unsupervised learning algorithms use unlabelled data to find underlying structures
    or patterns without producing predetermined results. Based on their intended use,
    they are again separated into three primary groups: Dimensionality Reduction,
    Association Rule Mining, and Clustering.


    a)       Clustering


    Clustering algorithms use similarities or differences to organise data points
    into clusters. Finding organic groups in the data is the aim. Various kinds of
    clustering algorithms may be distinguished by the ways in which they group data.
    Among these categories are "density-based methods, connectivity-based methods,
    distribution-based methods, and centroid-based methods."


    1.  Centroid-based Methods: Utilise central elements, such as centroids or medoids,
    to represent concentrations.


    *   K-Means clustering: Assuming spherical clusters, iteratively assigns points
    to the closest centres to divide the data into k clusters.


    *   K-Means++ clustering


    *   K-Mode clustering'
