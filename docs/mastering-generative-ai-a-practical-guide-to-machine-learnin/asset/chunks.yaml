    现在，想象提取此图像的一小部分，并对其应用一个称为过滤器（filter）或内核（kernel）的小型神经网络，产生垂直排列的 `K` 个输出。然后，该神经网络在整个图像上滑动，生成一张具有不同宽度、高度和深度的新图像。现在，有了额外的通道可用，尽管与只有
    `R`、`G` 和 `B` 通道相比，宽度和高度已经减少。这种操作被称为 `Convolution`（卷积）。如果补块的大小与图像尺寸匹配，它将作为一个传统的神经网络运行。这种小补块的存在减少了权重。


    ![GliomaCNN: An Effective Lightweight CNN Model in Assessment of Classifying Brain
    Tumor from Magnetic Resonance Images Using Explainable AI - ScienceDirect](img/Image00036.gif)


    图 7.3: Deep Learning Udacity。 [[27]](#text00015.html#_ftn27)


    ### 3. 卷积的数学概述


    卷积过程中的某些数学概念：


    1. 卷积层由一组可学习过滤器组成，也称为内核，这些内核具有较小的宽度和高度，同时保持与输入卷数据相同的深度，如果输入层是图像，深度通常为三。


    2. 例如，对尺寸为 `34x34x3` 的图像进行卷积时。过滤器的潜在维度可以表示为 `axax3`，其中 `a` 是任何值（如 `3`、`5` 或 `7`），只要它小于图像尺寸即可。


    3. 在前向传播中，每个过滤器逐逐渐滑动整个输入卷数据，每次增量被称为 `stride`（步长），对于高维图像，步长值可能取 `2`、`3` 甚至 `4`。然后在内核权重与输入卷数据中的相应补块之间计算点积。


    4. 通过滑动过滤器，每个过滤器都会生成一个二维输出，当这些输出堆叠在一起时，生成的输出卷的深度将与使用的过滤器数量相对应。网络被设置为学习所有的过滤器。


    ### 7.2 循环神经网络


    循环神经网络是一种既强大又鲁棒的神经网络类型。它们是目前使用的最有前景的算法之一，因为它们是唯一具有内部内存的神经网络。


    RNN 在预测未来事件方面非常准确，因为它们能够保留有关接收到的输入的重要细节。对于序列数据，如时间序列、语音、文本、金融数据、音频、视频、天气等，这就是它们成为首选算法的原因。与其他算法相比，循环神经网络能够对序列及其上下文建立更深层的理解。


    #### 1. 循环神经网络的工作


    ![`d2908q01vomqb2.cloudfront.net/f1f836cb4ea6efb2a0b1b99f41ad8b103eff4b59/2017/10/06/intro-gluon-1.gif`](img/Image00037.jpg)


    图 7.4: RNN 图。 [[28]](#text00015.html#_ftn28)


    RNN 由神经元组成，神经元是协作执行复杂任务的数据处理节点。输入层、输出层和隐藏层构成了神经元的布局。输入层在获取数据后交付结果。隐藏层是进行数据处理、分析和预测的地方。


    a) 隐藏层


    RNN 逐个接收序列数据并将其传输到隐藏层。但它们也有一个循环或自循环的工作流：短期记忆组件允许隐藏层记住并使用之前的输入来预测未来情况。为了预测后续序列，它会同时使用存储的内存和当前输入。


    例如，考虑以下序列：Apple is red（苹果是红色的）。当 RNN 接收到输入序列 Apple is 时，red 是它想要预测的颜色。一旦单词 Apple
    is 经过处理，Apple is 的副本就会存储在隐藏层的内存中。然后当它遇到单词 is 时，它会从内存中识别出 Apple 并理解整个序列：Apple is
    构成了上下文。然后，为了提高准确性，它可以预测 red。正因如此，RNN 对于机器翻译和语音识别等语言建模应用非常有帮助。


    b) 训练


    为了训练深度神经网络（如 RNN），机器学习 (ML) 工程师向模型提供训练数据并提高其性能。在机器学习中，神经元的权重充当信号，指示训练期间获得的信息对输出预测有多大影响。RNN
    的所有层具有相同的权重。


    为了提高预测的准确性，机器学习工程师会修改权重。他们计算模型误差并根据误差使用通过时间反向传播（BPTT）的方法来修改权重。BPTT 重新计算错误率并将输出回溯到上一个时间步。然后它可以更改权重以降低误差范围，并确定序列中的哪个隐藏状态产生了严重的不准确性。


    #### 2. 循环神经网络的类型


    RNN 可以根据网络的输入和输出数量分为四类：


    a) 一对一 RNN


    这种神经网络设计中只有一个输入和一个输出，是最基础的。它被用于不需要序列数据的简单分类任务，例如二分类。


    ![](img/Image00038.jpg)


    图 7.5: 一对一 RNN。 [[29]](#text00015.html#_ftn29)


    b) 一对多 RNN


    随着时间的推移，一对多 RNN 通过处理单个输入生成多个输出。当一个输入触发一系列输出时，这是非常有用的。例如在图像描述中，单个图像可以作为输入产生单词字符串。


    ![](img/Image00039.jpg)


    图 7.6: 一对多 RNN。 [[30]](#text00015.html#_ftn30)


    c) 多对一 RNN


    多对一 RNN 在接收一系列输入后产生单个输出。当单个预测需要输入序列的通用上下文时，这是非常有用的。当短语或其他字符串被到情感分析模型时，它会生成一个积极、消极或中性的单个输出。


    ![](img/Image00040.jpg)


    图 7.7: 多对一 RNN。 [[31]](#text00015.html#_ftn31)


    d) 多对多 RNN


    多对多 RNN 处理一系列输入，然后产生输出序列。在语言翻译过程中，一种语言的单词集作为输入，输出是另一种语言的匹配单词集。


    ![](img/Image00041.jpg)


    图 7.8: 多对多 RNN。 [[32]](#text00015.html#_ftn32)


    '
