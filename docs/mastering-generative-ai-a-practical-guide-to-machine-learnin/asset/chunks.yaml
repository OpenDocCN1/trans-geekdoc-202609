    concerns about data privacy and security. The Digital Personal Data Protection
    Act, 2023, provides a legal framework for data governance, but its applicability
    to AI-generated content remains unclear. Questions arise regarding how AI firms
    should handle user-generated data, whether AI-generated content should be considered
    personal data, and how to ensure data protection while maintaining innovation.
    Moreover, there is the risk of AI models unintentionally memorising sensitive
    information, leading to potential data breaches.


    3.  Misinformation and Deepfake Regulation


    Generative AI has enabled the creation of highly realistic deepfakes and synthetic
    media, posing risks of misinformation, fraud, and reputational damage. The spread
    of AI-generated fake news can influence elections, manipulate public opinion,
    and cause societal harm. While the Information Technology (Intermediary Guidelines
    and Digital Media Ethics Code) Rules, 2021, address misinformation to some extent,
    there is no specific mechanism for handling AI-generated deepfakes. Regulating
    such content without infringing on free speech is a complex challenge that Indian
    lawmakers must address.


    4.  Intellectual Property and Copyright Issues


    Generative AI raises serious concerns regarding intellectual property (IP) rights.
    Content generated by AI often resembles existing copyrighted works, leading to
    potential copyright infringements. The Indian Copyright Act, 1957, does not currently
    address AI-generated works, creating legal ambiguity regarding ownership and liability.
    Should AI-generated works be considered original creations? If so, who owns them—the
    developer, the user, or the AI itself? These unresolved questions make it difficult
    for businesses to commercialise AI-generated content without legal risks.


    5.  Ethical and Bias Concerns


    AI models, including generative AI, can perpetuate biases present in their training
    data. This has ethical implications, particularly in a diverse country like India,
    where socio-economic, linguistic, and cultural factors must be considered. If
    AI-generated content reinforces stereotypes or discriminates against certain groups,
    it can lead to reputational damage and legal challenges. There is a need for regulatory
    oversight to ensure AI systems are fair, unbiased, and transparent in their decision-making
    processes.


    6.  Compliance Burden for Businesses and Startups


    India has a growing AI startup ecosystem, but regulatory uncertainty poses a significant
    compliance burden. Small and medium-sized enterprises (SMEs) may struggle to navigate
    evolving legal requirements, especially if strict AI regulations are implemented
    without clear guidelines. Overregulation could stifle innovation, while under-regulation
    could lead to legal risks and unethical AI deployment. Striking a balance is crucial
    to fostering AI-driven entrepreneurship while ensuring responsible AI use.


    7.  Accountability and Liability Issues


    Determining accountability in cases where generative AI causes harm is another
    significant challenge. If an AI model generates defamatory or harmful content,
    who is held responsible—the developer, the platform hosting the AI, or the end
    user? Without clear liability provisions, legal disputes could arise, leading
    to uncertainty for businesses and consumers. Establishing a regulatory framework
    that delineates responsibility in AI-related disputes is crucial for legal clarity.


    # CHAPTER 9:                        Future of Generative AI


    Learning Objective


    This chapter explores the future trajectory of generative AI, including the path
    toward Artificial General Intelligence (AGI), autonomous AI agents, humanoid robots,
    and broader AI integration. It examines the limitless potential of AI advancements,
    the role of human optimism, and AI’s transformative impact on industries and society.


    ## 9.1                 Artificial General Intelligence in Sight


    The domain of Artificial General Intelligence (AGI) encompasses theoretical research
    in AI, aiming to develop software that possesses human-like intelligence and the
    capacity for self-directed learning. The objective is for the software to execute
    tasks for which it has not been specifically trained or developed.


    Existing artificial intelligence technologies operate within a defined range of
    parameters. For instance, AI models that have been taught to recognise and create
    images are unable to create webpages. The pursuit of AGI is theoretical, aiming
    to create AI systems that have autonomous self-control, a certain level of self-understanding,
    and the capability to acquire new skills. Complex problems can be solved in settings
    and contexts that were not included during its creation. The idea of AGI possessing
    human-like abilities continues to be a theoretical notion and an objective of
    research.


    1.  Types of Artificial General Intelligence (AGI) Research


    Researchers in computer science and artificial intelligence are persistently advancing
    theoretical frameworks while addressing the unresolved challenge of AGI. Several
    high-level approaches have been defined that have emerged in the field of AGI
    research and are categorised as follows:


    1.  Symbolic : A symbolic approach to AGI posits that symbolic thought is fundamental
    to human general intelligence and is what enables the broadest generalisation
    capabilities.


    2.  Emergentist : An emergentist perspective on AGI emphasises that the human
    brain consists of basic components (neurones) that intricately self-organise in
    response to bodily experiences. It may be inferred that a comparable form of intelligence
    could arise from the reconstruction of a similar framework.


    3.  Hybrid : The term hybrid approach to AGI implies that the brain functions
    as a hybrid system, where various components and principles collaborate to produce
    an outcome that surpasses the mere aggregation of its individual elements. The
    nature of hybrid AGI research encompasses a broad range of approaches.


    4.  Universalist : A Universalist approach to AGI focusses on the mathematical
    core of general intelligence, suggesting that once AGI is addressed in theory,
    the principles derived from that solution can be adapted and applied to its actual
    development.


    2.  Challenges in Artificial General Intelligence Research


    Computer scientists encounter various challenges in the development of AGI.


    a)       Make connections


    Present AI models are confined to their particular areas and are unable to establish
    links across different domains. Nevertheless, individuals are capable of transferring
    knowledge and experience from one area to a different one. For instance, game
    designers use educational ideas to create captivating learning environments. Individuals
    are capable of applying the knowledge gained from theoretical education to practical
    situations in life. Nevertheless, deep learning models necessitate extensive training
    using particular datasets to function dependably with unknown data.


    b)       Emotional intelligence 


    Deep learning models suggest the potential for AGI, yet they have not yet shown
    the genuine creativity inherent to humans. Emotional thinking is essential for
    creativity, a quality that current neural network architectures have not yet been
    able to replicate. Humans engage in conversations influenced by their emotional
    perceptions, whereas NLP models produce text outputs derived from the linguistic
    datasets and patterns on which they have been trained.


    c)       Sensory perception 


    AGI necessitates that AI systems engage physically with the outside environment.
    In addition to its robotic capabilities, the system needs to understand the world
    in a manner similar to humans. Current computer technologies require additional
    development to accurately distinguish shapes, colours, tastes, smells, and sounds
    in a manner similar to humans.


