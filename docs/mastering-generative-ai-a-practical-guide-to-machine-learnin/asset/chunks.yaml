- raw: 'The goal of regression learning, a different kind of supervised learning,
    is to forecast a continuous value as opposed to a category. A labelled dataset
    containing input-output pairs—where the output is a numerical value—is used to
    train the algorithm. For instance, the system learns from characteristics like
    location, number of bedrooms, and square foot area to anticipate home values.
    Using this data, the algorithm forecasts a new home''s price depending on its
    attributes. Finding stock price projections, predicting economic patterns, and
    many more situations are just a few of the numerous applications for regression.


    Typical algorithms used in regression learning methods include the following:


    *   Linear Regression


    *   Polynomial Regression


    *   Ridge Regression


    *   Lasso Regression


    *   Decision tree


    *   Random Forest.


    2.  Unsupervised Learning 


    In unsupervised learning, an algorithm is given data without labels or predetermined
    categories, making it one of the most popular forms of machine learning techniques.
    Finding patterns or correlations in the data is the primary objective of this
    program. Rather than being instructed on what to search for, the algorithm automatically
    finds common traits and clusters related data pieces. This is helpful for identifying
    hidden patterns, putting related things in one category, or minimising the volume
    of data for further analysis.


    a)       Example of Unsupervised Learning 


    A dataset is envisioned that includes different books along with their characteristics
    such as genre, author, page count, and year of publication. An unsupervised learning
    system may use clustering to combine related books according to these characteristics.
    This will unveil a collection of novels that are either authored by the same author
    or fall under certain categories. Bookshops have the ability to utilise this information
    for better inventory organisation or to suggest comparable books to their customers.


    ![Unveiling the Top 5 Unsupervised Machine Learning Algorithms in Data Science](Image00005.jpg)


    Figure ‎ 2.4: Unsupervised Machine Learning.  [\[4\]](#text00015.html#_ftn4)


    b)       Types of Unsupervised Learning 


    There are two primary categories of unsupervised learning, which are association
    and clustering.


    1.  Clustering in Unsupervised Learning


    In unsupervised learning, clustering is a process where data points are grouped
    by algorithm based on similarities. Data points in each cluster, or group, are
    more comparable to one another than to individual data points in other clusters.
    Clustering is a technique used in many different domains, such as customer segmentation,
    where it allows firms to group clients with similar purchase behaviours and tailor
    distinct marketing campaigns for each customer.


    The following are a few popular clustering algorithms:


    *   K-Means Clustering algorithm


    *   Mean-shift algorithm


    *   DBSCAN Algorithm


    *   Principal Component Analysis


    *   Independent Component Analysis.


    2.  Association in Unsupervised Learning


    In unsupervised learning, association is a technique for finding intriguing correlations
    or trends across variables in large datasets. The rules that emphasise the relationship
    between the occurrence of one item and the occurrence of another are identified
    using this approach. For instance, an association algorithm may show that consumers
    who purchase bread are also likely to purchase butter in a market basket study.
    These association rules are used by businesses to enhance inventory control and
    product positioning.


    The following are a few popular association rule learning algorithms:


    *   Apriori Algorithm


    *   Eclat


    *   FP-growth Algorithm


    3.  Semi-Supervised Learning


    Semi-supervised learning is another popular machine learning approach that makes
    use of a lot of unlabelled data and a small quantity of labelled data. While the
    labelled data helps in the model''s learning to generate predictions, the unlabelled
    data enhances the model''s accuracy by offering more details about the data''s
    structure.


    a)       Example of Semi-Supervised Learning


    Consider the process of creating a model that categorises emails into spam and
    non-spam classifications. A collection of 100 labelled emails exists, categorised
    as either "spam" or "not spam," alongside 1000 unlabelled emails. In semi-supervised
    learning, the process begins with training the model using 100 labelled emails.
    After the model has been constructed, it is utilised to forecast labels for the
    1000 emails that lack labels. The predictions are not always accurate, yet they
    offer supplementary information. This process aids the model in gaining a deeper
    understanding of the features and patterns present in the emails, leading to enhanced
    performance.


    ![](Image00006.jpg)


    Figure ‎ 2.5: Semi-Supervised Learning.  [\[5\]](#text00015.html#_ftn5)


    b)       Types of Semi-Supervised Learning


    Numerous semi-supervised learning models exist, each with distinct characteristics
    and employed for distinct objectives.


    1.  Graph-based Semi-Supervised Learning:  The connections between data points
    are represented by graphs in these models. Through these links, labels are dispersed
    from marked to unlabelled places.


    2.  Label Propagation:  Using this paradigm, labels are transferred from labelled
    to unlabelled data via a network, supposing that comparable data points are near
    one another.


    3.  Co-training:  This method labels the unlabelled data by training two or more
    distinct models. Different portions of the data are utilised to train each model,
    and the predictions made by each model are used to enhance the others.


    4.  Self-training:  After training the labelled data, the model makes predictions
    about the unlabelled data. The model is retrained when these fresh predictions
    are included in the training set.


    4.  Reinforcement Learning 


    Reinforcement learning is a form of machine learning in which an agent acquires
    the ability to make decisions by executing actions in an environment in order
    to attain the highest possible reward. The agent learns via trial and error, starting
    with no prior knowledge of the optimal course of action. Every action has an outcome,
    which may be either a reward or a punishment. The agent seeks to choose behaviours
    that provide the maximum cumulative reward throughout the given time period.


    a)       Example of Reinforcement Learning


    Consider the process of teaching a dog to catch a ball. The setting is the yard,
    the participant is the dog, and the activity involves retrieving the ball. When
    the dog retrieves the ball, a treat is given as a reward. If the dog fails to
    retrieve the ball or engages in another activity, it does not earn a treat, which
    serves as a negative reward.


    At the beginning, the dog might not grasp the task, but with time, it comes to
    realise that retrieving the ball results in a reward. The dog''s objective is
    to obtain additional rewards by retrieving more balls. The dog''s fetching habit
    increases with repeated encounters and incentives.


    ![What Is Reinforcement Learning? - MATLAB & Simulink](Image00007.jpg)


    Figure ‎ 2.6: Reinforcement learning.  [\[6\]](#text00015.html#_ftn6)


    b)       Types of Reinforcement Learning 


    There are three primary varieties of reinforcement learning techniques, each of
    which is employed for a distinct purpose and possesses distinct characteristics.


    1.  Q-learning


    Q-learning is a straightforward and well-liked reinforcement learning method.
    It stores values that indicate the anticipated future benefits of doing a certain
    action in a particular condition using a Q-table. In order to maximise its total
    reward, the agent gradually learns the best course of action in each state and
    adjusts the Q-values in response to the rewards it receives.


    2.  SARSA (State-Action-Reward-State-Action)'
