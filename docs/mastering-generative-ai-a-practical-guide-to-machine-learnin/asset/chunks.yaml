    3.  Working of Discriminative AI


    Discriminative AI models are trained on labelled datasets using supervised learning,
    which enables them to identify unique patterns and decision boundaries in the
    input data. The procedure entails:


    1.  Training on Labelled Data: Labelled training data, such as pictures with the
    labels "cat" or "dog," are input into the model.


    2.  Feature Extraction: It picks up essential characteristics that set classes
    apart, including fur texture or shape.


    3.  Decision Boundary Formation: The model establishes borders according to learnt
    characteristics to divide various classes.


    4.  Classification of New Data: The model uses the patterns it has learnt to accurately
    identify input based on the recognised data points when it is presented with unknown
    data.


    The following are well-known machine learning techniques for discriminative AI:


    *   Logistic regression is used for applications involving binary classification.


    *   SVMs (support vector machines) are used to draw borders around decisions.


    *   Neural networks, such as CNNs and RNNs, are used in deep learning applications
    such as voice and picture recognition.


    4.  The Future of Discriminative AI


    Discriminative models are become more accurate and effective as AI technology
    develops, combining with deep learning to achieve even more precision. They are
    being used more and more in real-time applications where precise categorisation
    is essential, such cybersecurity, driverless cars, and medical diagnostics.


    Future discriminatory AI models will be more open, equitable, and interpretable
    thanks to continuous advancements in AI ethics and bias reduction, guaranteeing
    ethical AI development across a range of businesses. Further improving the comprehension
    and effectiveness of machine learning algorithms, these models will be essential
    in modelling data points for next applications.


    ## 1.6                 AI in a Nutshell


    The goal of the computer science discipline known as artificial intelligence (AI)
    is to make computers, computer-controlled robots, and software that behave intelligently
    like the human mind. In order to develop intelligent software and systems, the
    fundamental idea of artificial intelligence is to investigate the patterns and
    mechanisms of human cognition.


    AI studies the human brain in great detail in an effort to comprehend how people
    see, learn, and make choices. AI researchers may create models and algorithms
    that mimic intelligent reasoning and problem-solving by identifying these cognitive
    processes.


    AI''s ultimate objective is to create machines that are capable of reasoning,
    experience-based learning, situational adaptation, and activities that normally
    call for human intellect.


    1.  A brief History of Artificial Intelligence


    The history of artificial intelligence (AI) is lengthy and includes several decades.
    An outline of significant turning points and advancements in the field is provided
    below:


    a)     1950s:  The 1950s marked the beginning of the AI revolution, as researchers
    began to investigate the potential of machines to demonstrate intelligent behaviour.
    Prominent individuals like as Alan Turing introduced the concept of machine intelligence
    and created the well-known "Turing Test" to evaluate a computer''s capacity for
    human-like intelligence.


    b)    1956:  John McCarthy is credited for coining the phrase "artificial intelligence"
    and organising the Dartmouth Conference, which is regarded as the formal beginning
    of AI as a subject of study. Prominent scientists gathered at the meeting to discuss
    the potential and prospects of artificial intelligence.


    c)     1960s-1970s : Expert systems, or computer programs created to replicate
    the decision-making skills of human specialists in certain fields, were the major
    focus of AI research at this time. However, the intricacy of real-world issues
    and technological limits hindered the development of early AI systems.


    d)    1980s-1990s:  AI went through "AI winter" during which funding and public
    attention declined. Research on AI slowed down, and the technology did not live
    up to expectations. Nonetheless, research in fields like natural language processing,
    knowledge representation, and machine learning persisted, laying the groundwork
    for further developments.


    e)     Late 1990s-early 2000s:  AI had a comeback when processing power rose and
    new methods like data-driven approaches and neural networks became popular. Applications
    such as data mining, computer vision, and voice recognition began to indicate
    encouraging outcomes.


    f)       2010s:  Due to developments in big data and deep learning, the 2010s
    saw important advances in artificial intelligence. Deep learning models, which
    are driven by multi-layered neural networks, have shown impressive results in
    a variety of tasks, including natural language processing, picture identification,
    and gaming.


    g)    Present day:  These days, artificial intelligence (AI) permeates every aspect
    of life, from recommendation engines and virtual assistants to self-driving cars
    and medical diagnostics. As deep learning, reinforcement learning, and machine
    learning methods advance, they push the limits of artificial intelligence.


    2.  Weak AI vs. Strong AI


    Weak AI and strong AI differ from one another in terms of their capacities and
    degree of human-like intelligence:


    a)     Weak AI: Weak AI systems are those that are designed to carry out certain
    activities or functions inside a restricted area. They are sometimes referred
    to as narrow AI or applied AI. Weak AI lacks universal intelligence and is only
    concerned with addressing particular challenges. These systems have been taught
    or designed to be very good at certain tasks, including chess play, picture classification,
    or voice recognition. They are unable to expand their knowledge or abilities outside
    of their designated area and work within well-defined parameters.


    b)    Strong AI: Strong AI, often known as Human-Level AI or Artificial General
    intellect (AGI), seeks to mimic human-level intellect in a variety of activities
    and areas. Robust artificial intelligence systems are able to comprehend, learn,
    and use information in ways that mimic human cognitive capacities. Similar to
    human intelligence, they are capable of consciousness, self-awareness, and reasoning.
    Strong AI aims to replicate the intricacy and flexibility of the human mind, allowing
    robots to demonstrate a broad range of cognitive abilities and carry out activities
    in a variety of fields.


    3.  Applications of Artificial Intelligence


    There are several uses for artificial intelligence (AI) in a variety of sectors
    and businesses. Here are a few noteworthy applications of AI:


    a)     Healthcare : AI is transforming healthcare by helping with medication development,
    illness detection, and individualised therapy regimens. It makes it possible to
    analyse medical pictures for precise diagnosis, including MRIs and X-rays. AI-powered
    solutions may also help detect possible health hazards, forecast the course of
    diseases, and monitor patient data in real-time.


    b)    Finance and Banking:  In the financial industry, AI is used in algorithmic
    trading, risk assessment, fraud detection, and customer support. Customer interactions
    are improved by AI-powered chatbots and virtual assistants, while machine learning
    algorithms examine financial data to identify trends and stop fraud.


    c)     Transportation : Autonomous cars, better traffic control systems, and route
    optimisation are all made possible by AI. AI algorithms are used by self-driving
    vehicles to navigate and make decisions, improving efficiency and safety. AI is
    also used in supply chain management and logistics to streamline processes and
    save expenses.'
