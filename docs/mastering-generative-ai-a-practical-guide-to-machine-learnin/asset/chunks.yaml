    A machine learning model that is appropriate for the task is selected based on
    the classification, regression, and clustering tasks. Some examples are decision
    trees, neural networks, support vector machines, and more complex models like
    deep learning frameworks.


    ### d) Training the Model

    The training data is used to train the chosen model. The program discovers links
    and patterns in the data during training. This entails repeatedly modifying the
    model''s parameters to reduce the discrepancy between the training data''s actual
    outputs (`labels` or `targets`) and projected outputs.


    ### e) Evaluating the Model

    After training, the model''s performance is assessed using the test data. Measures
    like mean squared error, recall, accuracy, and precision are used to assess how
    effectively the model generalises to new, untested data.


    ### f) Fine-tuning

    In order to enhance performance, models may be adjusted by modifying hyperparameters,
    which are factors that are not directly learnt during training, such as learning
    rate or the number of hidden layers in a neural network.


    ### g) Prediction or Inference

    Lastly, fresh data is subjected to predictions or judgements based on the trained
    model. In this procedure, the learnt patterns are applied to fresh inputs to produce
    outputs, such as numerical values for regression tasks or class labels for classification
    tasks.


    # 3. Machine Learning Lifecycle


    ![https://miro.medium.com/v2/resize:fit:500/0\*riH9z2sLjb4eAQcf.png](Image00002.jpg)

    Figure 2.1: Machine Learning Life Cycle. [1](#text00015.html#_ftn1)


    The major steps involved in the machine learning life cycle are outlined as follows:


    ### a) Data Acquisition

    Data serves as a crucial element in the life cycle of machine learning, yet it
    is necessary to obtain suitable data to address a specific problem. No data scientist
    is needed to collect the data. A person with prior knowledge of the actual differences
    among the various freely available data sets, along with the ability to make impactful
    decisions regarding an organisation’s investment strategy, would be most suitable
    for the role of a data scientist.


    ### b) Data Preparation

    This task could be considered the most laborious and time-intensive in this cycle,
    as it requires the identification of numerous data quality issues. Typically,
    when data is obtained, it cannot be analysed due to the presence of incorrect
    entries, inconsistencies, and semantic mistakes. To utilise this type of data,
    data scientists manually reformat and clean it by either editing it in a spreadsheet
    or by scripting code. The data wrangling phase or data cleansing step are additional
    names for the data preparation process.


    ### c) Hypothesis and Modelling

    This is the basic phase of any data science project, which involves creating,
    executing, and improving the programs in order to analyse the data and extract
    valuable business insights. Programs can be developed using languages such as
    `Python`, `R`, `MATLAB`, or `Perl`. At this stage, the data is utilised to train
    different machine learning algorithms, and the algorithm that yields the best
    performance is chosen.


    ### d) Evaluation and Interpretation

    After the training of the model on data, the final outcome is assessed to determine
    its performance and reliability in practical scenarios. Every performance metric
    possesses a unique set of evaluation metrics. For example, when aiming for a machine
    learning model to forecast daily stock, it is strongly advised to take into account
    the `RMSE` (root mean squared error) for assessment purposes. Alternatively, performance
    metrics such as average accuracy, `AUC`, and `log loss` are taken into account
    for the classification of spam emails.


    ### e) Deployment

    Deployment refers to the application of a model that utilises new data to generate
    predictions. Creating a model is typically not the conclusion of the project.
    Although the model aims to enhance the understanding of the data, the acquired
    insights must be structured and displayed in a manner that allows for easy utilisation
    by the client. The deployment phase can range from being as straightforward as
    generating a report to being as complex as implementing a replicable data science
    process based on specific requirements.


    ### f) Operations

    A plan is created for overseeing and maintaining the data science project over
    an extended period. In this phase, the performance of the model is monitored regarding
    its upgrades and downgrades. Data scientists utilise a specific data science project
    to facilitate shared learning and enhance the execution of similar data science
    projects in the future.


    ### g) Optimisation

    The last stage of every data science endeavour is optimisation. When fresh data
    sources are added or when essential actions are taken to improve the machine learning
    model''s performance, it retrains the model in production.


