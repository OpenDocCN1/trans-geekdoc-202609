    2.  Data Preprocessing Techniques


    Data cleaning and feature engineering are the two primary types of preprocessing.
    Each has a range of methods, which are explained below:


    a)       Data Cleansing


    The following are some methods for cleaning up jumbled data:


    1.  Identify and sort out missing data:  Individual data fields may be absent
    from a data collection for a number of reasons. Data scientists must determine
    whether it is preferable to ignore or reject data with missing fields or to fill
    them up with a likely value. For instance, it could be permissible to add the
    missing average temperature between the prior and subsequent data in an Internet
    of Things application that tracks temperature.


    2.  Reduce noisy data:  Analytical or AI models may be distorted by the noise
    present in real-world data. For instance, a sensor that normally records a temperature
    of 75 degrees Fahrenheit may indicate a temperature of 250 degrees instead. The
    noise may be reduced using a number of statistical techniques, including as clustering,
    regression, and binning.


    3.  Identify and remove duplicates:  An algorithm must decide if two seemingly
    identical recordings are indeed two independent occurrences or whether the same
    measurement was taken twice. There may sometimes be minor discrepancies in a record
    due to an inaccurately reported field. In other situations, documents that seem
    to be duplicates may really be different, such as when a father and son share
    a name and reside in the same home but need to be listed as distinct people. These
    issues may be automatically resolved with the use of duplication detection, removal,
    or joining techniques.


    b)       Feature Engineering


    The feature engineering refers to methods that data scientists use to arrange
    the data in ways that facilitate the training of data models and the drawing of
    conclusions from them. These methods consist of the following:


    1.  Feature scaling or normalisation:  The scales at which distinct variables
    change are often different, or one variable may develop linearly while another
    changes exponentially. For instance, age is expressed in double digits, but pay
    may be expressed in thousands of dollars. Scaling aids in transforming the data
    so that computers may more easily identify a significant correlation between variables.


    2.  Data reduction:  To develop a new AI or analytics model, data scientists often
    need to integrate data from several sources. It may be safe to exclude some of
    the variables as they have no correlation with a certain result. In the case of
    a model that predicts the chance of loan payback, other variables may be meaningful,
    but only in terms of their connection. For example, the debt-to-credit ratio may
    be merged into a single variable. In order to reduce the number of dimensions
    in the training data set and create a more effective representation, methods such
    as principal component analysis are essential.


    3.  Discretisation:  Raw numbers are often helpfully grouped into distinct intervals.
    For instance, five categories of income can be identified, each of which would
    reflect the usual applicants for a certain kind of loan. By doing this, the overhead
    of drawing inferences against a model or training it may be decreased.


    4.  Feature encoding : Constructing a structured format out of unstructured data
    is another facet of feature engineering. Formats for unstructured data might include
    audio, video, and text. For instance, converting words into numerical vectors
    using data transformation methods like Word2vec is usually the first step in the
    development of natural language processing systems. This makes it simple to show
    the algorithm that, whereas terms like "house" are entirely distinct, "mail" and
    "parcel" are comparable. Similarly, raw pixel data may be re-encoded into vectors
    that indicate the separations between various facial features using a facial recognition
    system.


    ## 2.5                 Model Evaluation


    In the realm of machine learning, evaluating a model entail assessing its predictive
    accuracy. Predictive accuracy indicates the effectiveness of a model in generating
    precise predictions for data that has not been previously encountered. The objective
    is to identify a model that performs effectively on new, previously unencountered
    examples instead of merely recalling the training data.


    Evaluating a model involves more than just measuring its accuracy. Additionally,
    it includes assessing various factors like the model''s capacity to manage class
    imbalance, its resilience to noisy data, and its capability to address missing
    values. These elements are essential in assessing a machine learning model''s
    overall effectiveness and dependability.


    In the process of evaluating the model, it is typical to divide the available
    data into sets for training and testing. The model undergoes training using the
    training set and is subsequently assessed with the testing set to evaluate its
    performance on data that has not been encountered before. This method aids in
    simulating real-world situations in which the model must predict outcomes for
    new, previously unencountered examples.


    1.  Necessary of Evaluation for a Successful Model


    Assessment is essential for confirming that machine learning models are dependable,
    applicable across various scenarios, and able to produce precise predictions on
    novel, unencountered data, which is vital for their effective implementation in
    practical situations. The two main reasons why machine learning algorithms perform
    poorly are overfitting and underfitting.


    ![https://miro.medium.com/v2/resize:fit:700/1\*cOcV7J0b-d\_MAxStyL-6gg.png](Image00009.jpg)


    Figure ‎ 2.8: Classification and Regression Model.  [\[8\]](#text00015.html#_ftn8)


    1.  Overfitting: Happens when the model is so tightly fitted to the training data
    that it lacks the ability to react to new data.


    2.  Right Fit: It happens when both the error in the training data and the error
    in the test data is low.


    3.  Underfitting: Happens when the model fails to sufficiently represent the fundamental
    framework of the data.


    Table 1: Error risks in the models:


    ![https://miro.medium.com/v2/resize:fit:700/1\*Z0Ns-N0GfEGkNXUlTGq4\_g.png](Image00010.jpg)


    2.  The Role of Model Evaluation in Predictive Accuracy


    A machine learning model''s ultimate objective is to provide precise predictions
    on actual data. When a model does not successfully forecast results, its value
    decreases. Evaluating and optimising model performance is essential for success.
    Understanding the strengths and weaknesses of the models allows for informed decisions
    regarding their deployment and helps in avoiding potential pitfalls.'
