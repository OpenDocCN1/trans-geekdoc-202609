- raw: '1.  Bidirectional RNNs: The output layer may concurrently receive information
    from past and future states by processing data both forward and backward.


    2.  Deep RNNs:  They are capable of extracting additional hierarchical information
    from the data due to the presence of multiple layers.


    2.  Convolutional Neural Networks (CNNs)


    Drawing inspiration from the visual brain of animals, Yann LeCun was the first
    to develop this multilayer neural network. The architecture was first created
    for applications such as postal code interpretation and handwritten character
    recognition. Convolutional neural networks, or CNNs, are now crucial for classification
    and image processing. Important layers consist of:


    1.  Convolutional Layer:  Features are extracted using kernels, with ReLU activation
    added for non-linearity.


    2.  Pooling Layer:  Reduces dimensionality while maintaining important information
    by using maximum or average pooling.


    3.  Fully Connected Layer:  Connects every input to every neuron to complete the
    categorisation.


    ![C:\\Users\\AGPH\\Desktop\\CNN Architecutre.png](Image00015.jpg)


    Figure ‎ 3.5: CNN Architecture.


    CNN functionality is improved by additional components such as dropout layers
    to avoid overfitting and softmax activation for output normalisation. CNNs are
    essential in many different sectors because of their superior performance in applications
    such as object identification, face recognition, medical imaging, natural language
    processing, and more.


    3.  Long Short-Term Memory (LSTM)


    Hochreiter and Schimdhuber developed LSTM in 1997, and it has been more and more
    well-liked as an RNN architecture for a variety of applications in recent years.
    LSTMs are sophisticated RNNs that overcome the drawbacks of conventional RNNs
    by capturing long-range relationships in sequential data. Important features include:


    1.  Memory Cells:  Long-term information retention that captures dependencies
    and context in sequential data.


    2.  Gates:  To ensure efficient information retention and disposal, three gates—input,
    forget, and output—control the flow of data into and out of memory cells.


    3.  Vanishing Gradient Problem:  LSTMs effectively learn long-term dependencies
    by maintaining a steady error flow over time.


    ![](Image00016.jpg)


    Figure ‎ 3.6: LSTM Working.  [\[12\]](#text00015.html#_ftn12)


    4.  Gated Recurrent Unit (GRU)


    GRUs are a more computationally efficient and simpler form of LSTMs that improve
    long-term dependency modelling. Important features include:


    1.  Gating Mechanism:  Information flow in the network is managed by two gates:
    update and reset. The update gate controls the percentage of data that should
    be kept or discarded, while the reset gate controls when the internal state should
    be reset.


    2.  Simplicity:  GRUs are appropriate for applications such as time series prediction,
    voice recognition, and natural language processing (NLP) because they need fewer
    parameters and train faster.


    5.  ResNet (Residual Networks)


    ResNet is a well-known deep learning architecture that uses residual modules to
    create very deep networks. Among the major advances are:


    1.  Residual Modules:  To mitigate the issue of disappearing gradients, either
    perform a series of functions on the input or omit the step completely.


    2.  SGD:  Use an acceptable initialisation function and ordinary stochastic gradient
    descent.


    3.  Preprocessing:  Prior to being fed into the network, inputs are separated
    into patches.


    6.  Generative Adversarial Networks (GANs)


    GANs learn and produce new data that is similar to the original dataset, making
    them effective models for generative tasks. Essential components consist of:


    1.  Generator:  Aims to provide realistic results by generating new data instances
    from random inputs.


    2.  Discriminator:  Serves to differentiate between produced and actual data by
    acting as a classifier.


    3.  Adversarial Training:  The discriminator and generator train concurrently
    and competitively. Applications include text-based picture creation, virtual reality,
    and image generation. Conditional GANs (cGANs) improve specificity by producing
    data depending on auxiliary information.


    7.  Transformer Architecture


    A revolutionary encoder-decoder architecture, transformers were introduced by
    Vaswani et al. in 2017. Transformers, in contrast to conventional RNNs, use self-attention
    processes to assess the relative relevance of various sequence parts, enabling
    quicker training and parallel processing. Among the applications are:


    1.  NLP Tasks: Sentiment analysis, text summarisation, and machine translation.
    Transformers are used in models such as BERT to enhance contextual comprehension
    by taking into account both the left and right context during pre-training.


    8.  Deep Belief Network (DBN)


    Stacked Restricted Boltzmann Machines (RBMs) make up DBNs, which are multilayer
    networks. With DBNs learning complete input probabilities via unsupervised learning,
    each pair of linked layers becomes an RBM. DBNs do very well on tasks like image
    recognition and natural language processing (NLP) because to their all-encompassing
    approach.


    9.  Deep Stacking Network (DSN)


    Deep Convex Networks (DCN), another name for DSNs, are made up of many separate
    deep networks, each of which has hidden layers. This architecture views training
    as a collection of issues in order to solve the complexity of conventional deep-learning
    models. The modular stacking used by DSNs, which consists of input, hidden, and
    output layers in each module, increases training efficiency.


    ![](Image00017.jpg)


    Figure ‎ 3.7: Deep Stacking Network.  [\[13\]](#text00015.html#_ftn13)


    ## 3.4                 Optimisation Techniques


    A branch of machine learning called deep learning handles complex tasks like text
    categorisation and audio recognition. Deep learning models, which include hidden
    layers, input, output, activation functions, and loss functions, are designed
    to generalise data and provide predictions on previously unknown data. Several
    methods, referred to as optimisers, are used to maximise these models. Neural
    networks may learn from data thanks to optimisers that repeatedly change model
    parameters during training in order to minimise a loss function.


    Optimisers are essential for improving accuracy and expediting the training process,
    which shapes deep learning models'' overall performance.


    1.  Gradient Descent


    ![](Image00018.jpg)


    Figure ‎ 3.8: Gradient Descent.  [\[14\]](#text00015.html#_ftn14)


    A simple optimisation technique called gradient descent modifies the model''s
    parameters in order to reduce the loss function. The algorithm''s fundamental
    form can be expressed as follows:


    θ \= θ − α ⋅ ∇ θ ​ L ( θ )


    Where


    *   θ is the model parameter,


    *   L(θ)) is the loss function, and


    *   α is the learning rate.


    2.  Stochastic Gradient Descent


    Stochastic gradient descent (SGD) represents a variation of gradient descent that
    updates parameters using a small, randomly chosen subset of the data, known as
    a "mini-batch," instead of utilising the entire dataset. The basic form of the
    algorithm can be written as follows:


    θ \= θ − α ⋅ ∇ θ ​ L ( θ ; x ( i ) ; y ( i ) )


    Where ( x ( i ) , y ( i ) ) is a mini-batch of data.


    ![](Image00019.jpg)


    Figure ‎ 3.9: Stochastic Gradient Descent.  [\[15\]](#text00015.html#_ftn15)


    3.  Stochastic Gradient Descent with Momentum


    SGD with momentum represents a variation of SGD that incorporates a "momentum"
    component into the update rule, aiding the optimiser in maintaining its trajectory
    even when the local gradient is minimal. The momentum term is generally assigned
    a value ranging from 0 to 1. The update rule can be expressed as follows:


    v \= β ⋅ v +(1− β ) ⋅ ∇ θ ​ L ( θ ; x ( i ) ; y ( i ) )


    θ \= θ − α ⋅ v


    Where


    *   v  is the momentum vector and


    *   β  is the momentum hyperparameter.


    ![](Image00020.jpg)


    Figure ‎ 3.10: Stochastic Gradient Descent with Momentum.  [\[16\]](#text00015.html#_ftn16)


