    3.  Mathematical Overview of Convolution


    Some mathematical concepts that are part of the convolution process:


    1.  Convolution layers are made up of a collection of learnable filters, also
    known as kernels, which possess small widths and heights while maintaining the
    same depth as the input volume, typically three if the input layer is an image.


    2.  For instance, when performing convolution on an image that measures 34x34x3.
    The potential dimensions of filters can be represented as axax3, with ‘a’ being
    any value such as 3, 5, or 7, provided it is smaller than the dimensions of the
    image.


    3.  In the forward pass, each filter is slid across the entire input volume incrementally,
    with each increment referred to as stride, which may take values of 2, 3, or even
    4 for high-dimensional images. The dot product is then calculated between the
    kernel weights and the corresponding patch from the input volume.


    4.  By sliding the filters, a 2-D output will be generated for each filter, and
    when these outputs are stacked together, the resulting output volume will have
    a depth that corresponds to the number of filters used. The network is set to
    learn all the filters.


    ## 7.2                 Recurrent Neural Networks


    Recurrent neural networks are a variety of neural network that is both potent
    and robust. They are among the most promising algorithms currently in use due
    to the fact that they are the only sort of neural network that has an internal
    memory.


    RNNs are very accurate in anticipating future events because they are able to
    retain significant details about the input they have received. For sequential
    data such as time series, voice, text, financial data, audio, video, weather,
    and much more, this is the reason they are the algorithm of choice. Compared to
    other algorithms, recurrent neural networks are able to develop a much deeper
    grasp of a sequence and its context.


    1.  Working of Recurrent Neural Network


    ![https://d2908q01vomqb2.cloudfront.net/f1f836cb4ea6efb2a0b1b99f41ad8b103eff4b59/2017/10/06/intro-gluon-1.gif](Image00037.jpg)


    Figure ‎ 7.4: Diagram of an RNN.  [\[28\]](#text00015.html#_ftn28)


    Neurons, which are data-processing nodes that collaborate to carry out intricate
    tasks, make up RNNs. Input, output, and hidden layers make up the arrangement
    of the neurons. The output layer delivers the outcome after the input layer gets
    the data to process. The hidden layer is where data processing, analysis, and
    prediction occurs.


    a)       Hidden Layer


    One step at a time, RNNs receive sequential data which they transmit to hidden
    layers. But they also have a recurring or self-looping workflow: a short-term
    memory component allows the hidden layer to remember and use previous inputs for
    predictions in the future. To predict a subsequent sequence, it uses both the
    stored memory and the current input.


    For example, consider the following sequence: Apple is red. Red is the colour
    the RNN wants to predict when it receives the input sequence Apple is. A duplicate
    of the word Apple is stored in the hidden layer’s memory once it has been processed.
    It then recognizes Apple from memory when it encounters the word is and understands
    the entire sequence: Apple is for context. Then, for increased accuracy, it can
    predict red. Because of this, RNNs are helpful for language modelling applications
    such as machine translation and audio recognition.


    b)       Training


    In order to train deep neural networks, such as RNNs, machine learning (ML) engineers
    feed the model training data and improve its performance. In machine learning,
    the weights of the neurones serve as signals that indicate how much the information
    acquired during training influences the output prediction. An RNN''s layers all
    have the same weight.


    To increase the accuracy of predictions, machine learning engineers modify weights.
    They compute model error and modify its weight based on it using a method known
    as backpropagation through time (BPTT). BPTT recalculates the error rate and rolls
    back the output to the prior time step. It may then alter the weight to lower
    the error margin and determine which hidden state in the sequence is generating
    a substantial inaccuracy.


    2.  Types of Recurrent Neural Networks


    RNNs can be divided into four categories according on the network''s input and
    output numbers:


    a)       One-to-One RNN


    There is just one input and one output in this kind of neural network design,
    which is the most basic. It is used for simple classification jobs that don''t
    need sequential data, such binary classification.


    ![](Image00038.jpg)


    Figure ‎ 7.5: One to One RNN.  [\[29\]](#text00015.html#_ftn29)


    b)       One-to-Many RNN


    Over time, a One-to-Many RNN generates several outputs by processing a single
    input. When one input sets off a series of predictions (outputs), this is helpful.
    For instance, in image captioning, a single image can be utilised as input to
    produce a string of words that will be used as the caption.


    ![](Image00039.jpg)


    Figure ‎ 7.6: One-to-Many RNN.  [\[30\]](#text00015.html#_ftn30)


    c)       Many-to-One RNN


    The Many-to-One RNN produces a single output after receiving a series of inputs.
    When a single prediction requires knowledge of the input sequence''s general context,
    this type is helpful. When a phrase or other string of words is fed into a sentiment
    analysis model, it generates a single output that may be classified as positive,
    negative, or neutral.


    ![](Image00040.jpg)


    Figure ‎ 7.7: Many-to-One RNN.  [\[31\]](#text00015.html#_ftn31)


    d)       Many-to-Many RNN


    A series of inputs is processed by the Many-to-Many RNN type, which then produces
    a sequence of outputs. A set of words in one language is provided as input in
    a language translation process, and the output is a matching set of words in another
    language.


    ![](Image00041.jpg)


    Figure ‎ 7.8: Many-to-Many RNN.  [\[32\]](#text00015.html#_ftn32)


    ## 7.3                 Deep Generative Models


    Deep generative models are a class of neural networks trained to generate new
    data samples similar to those in their training dataset. They achieve this by
    learning the probability distribution of the input data and sampling from it to
    create new instances. These models leverage deep learning techniques, particularly
    neural networks, to capture complex patterns and relationships within the data.


    Generative models contrast with discriminative models, which focus on distinguishing
    between different data categories. While discriminative models, such as convolutional
    neural networks (CNNs) and recurrent neural networks (RNNs), are trained to classify
    inputs, generative models attempt to reconstruct or generate novel instances from
    learned distributions.


    1.  Types of Deep Generative Models


    There are several types of deep generative models, each with unique approaches
    and applications. The most notable ones include:


    a)       Variational Autoencoders (VAEs)'
