    # CHAPTER 2:                        Fundamentals of Machine Learning


    Learning Objective


    This chapter covers the basics of Machine Learning, its different types, algorithms,
    and data preprocessing techniques. It also discusses model evaluation strategies,
    providing a strong foundation for understanding how ML powers Generative AI.


    ## 2.1                 What Is Machine Learning?


    Machine learning is a subfield of artificial intelligence that allows algorithms
    to identify concealed patterns in datasets. They are able to forecast fresh, comparable
    data without the need for explicit task programming. Applications for machine
    learning may be found in many different domains, including fraud detection, portfolio
    optimisation, recommendation systems, natural language processing, picture and
    audio recognition, and automation of tasks.


    The influence of machine learning extends to robotics, drones, and driverless
    cars, improving their capacity to adapt to changing conditions. This method, which
    is tightly related to data mining and data science, is a breakthrough in which
    computers learn from data examples to provide correct results.


    1.  Need for Machine Learning


    The significance of machine learning lies in its capacity to enable computers
    to enhance their performance on specific tasks by learning from data without the
    need for explicit programming. Machine learning is especially helpful for activities
    involving a lot of data, complicated decision-making, and dynamic contexts because
    of its capacity to learn from data and adapt to new circumstances.


    The following are some particular domains in which machine learning finds application:


    a)     Predictive Modelling: Businesses may improve their decision-making by using
    machine learning to create predictive models. For instance, machine learning can
    be employed to forecast which consumers are most likely to purchase a specific
    product or which patients are most susceptible to developing a specific disease.


    b)    Natural Language Processing: To create systems that can comprehend and interpret
    human language, machine learning is used. For applications like chatbots, speech
    recognition, and language translation, this is crucial.


    c)     Computer Vision: Systems that are able to identify and comprehend photos
    and videos are created using machine learning. This is critical for applications
    like medical imaging, surveillance systems, and self-driving automobiles.


    d)    Fraud Detection: Detecting fraudulent activity in internet advertising,
    financial transactions, and other domains is possible using machine learning.


    e)     Recommendation Systems: Recommendation systems that provide recommendations
    to users based on their prior behaviour and preferences may be developed using
    machine learning.


    Overall, machine learning has emerged as a crucial tool for several companies
    and sectors, allowing them to harness data more effectively, enhance their decision-making
    procedures, and provide more personalised consumer experiences.


    2.  Working of Machine Learning Algorithms


    Machine learning algorithms are not explicitly coded for every task instead, they
    learn patterns and correlations from data to produce predictions or choices. This
    is a condensed description of the workings of a common machine learning algorithm:


    a)       Data Collection


    First, pertinent information is gathered or vetted. This information may consist
    of text, photos, numerical data, or other characteristics, traits, or examples
    that are relevant to the work at hand.


    b)       Data Preprocessing


    It is often necessary to preprocess the data before entering it into the algorithm.
    This stage might include separating the data into training and test sets, cleaning
    the data (dealing with missing values, outliers), and converting the data (normalisation,
    scaling).


