- raw: 'All autoencoders are, in general, neural networks that can learn data. Autoencoders
    consist of a decoder that reconstructs the original data from its compressed pieces
    and an encoder that breaks up incoming data into smaller components. An autoencoder,
    when properly built, will offer highly accurate decoder output and reconstruct
    data. Consequently, the information is acquired in a very condensed way.


    Adding probabilistic features to the encoding process, a VAE expands upon the
    fundamentals of an autoencoder. The word "variational" has been introduced to
    the autoencoder lexicon in order to reflect these probabilistic capabilities.
    Essentially, a VAE may create a more extensive data distribution during encoding,
    and then take a sample from that more extensive data while decoding.


    VAEs are able to simulate generations thanks to these additional capabilities.
    Additionally, it allows VAEs to generate previously unobtainable data, while maintaining
    the training data set''s representativeness.


    The four fundamental behaviours listed below help to understand VAEs:


    1.  The training data teaches the VAE to recognise key components. This is the
    behaviour of encoding.


    2.  Using the key components of the training data, the VAE recreates the original
    data. This is the behaviour of decoding.


    3.  The VAE may generate various data outputs from the encoded samples by including
    probabilistic features, such inference, into the encoding side. This mechanism
    is generative.


    4.  The VAE efficiently enables VAEs to pursue tasks like unsupervised learning
    by re-encoding those intricate generative outputs back into a latent space where
    data is learnt and encoded.


    2.  The Architecture of Variational Autoencoder


    Variational Autoencoders (VAEs) differ from conventional autoencoders in that
    they are based on an encoder-decoder design. The encoder network converts unprocessed
    input data into a latent space probability distribution.


    The VAE may describe a range of possible representations rather than simply one
    point in the latent space since the encoder produces a probabilistic latent code.


    A sampled point from the latent distribution is then reconstructed into data space
    by the decoder network. To reduce the reconstruction loss, or the difference between
    the input data and the decoded output, the model optimises the encoder and decoder
    parameters during training. In addition to achieving accurate reconstruction,
    the objective is to regularise the latent space such that it follows a predetermined
    distribution.


    The reconstruction loss and the regularisation term, which is often represented
    by the Kullback-Leibler divergence, are two crucial elements that must be carefully
    balanced throughout the process. Reconstruction loss forces the model to correctly
    rebuild the input, while regularisation term prevents overfitting and promotes
    generalisation by encouraging the latent space to follow the selected distribution.


    The VAE learns to convert incoming data into a meaningful latent space representation
    by repeatedly modifying these parameters during training. Accurate reconstruction
    is made possible by this optimised latent code, which captures the fundamental
    characteristics and structures of the data. It is also possible to generate new
    samples by selecting random points from the learnt distribution, thanks to the
    probabilistic character of the latent space.


    ![Lightbox](Image00025.jpg)


    Figure ‎ 5.1: VAE architecture.  [\[19\]](#text00015.html#_ftn19)


    3.  Use of Variational Autoencoders


    The three main goals of VAEs are to generate new data, find abnormalities in existing
    data, and eliminate undesirable or noisy data. Although these three features may
    not seem remarkable, they enable VAEs to be used in a wide range of potent applications,
    including the following:


    a)     Text creation:  VAEs are able to provide fresh content on a subject in
    the manner of their choice. Nevertheless, the new text is restricted to the intended
    style and the training material''s scope. For instance, in order to generate a
    baseball field description in the manner of Mark Twain, the training data set
    has to include both text that is characteristic of Twain''s writing and a comprehensive
    description of baseball fields.


    b)    Image creation:  VAEs have the ability to produce new images, but their
    options are restricted by the training data set. For instance, the training set
    has to have photos of dogs, poker players, and images that are reflective of Picasso''s
    style in order to produce an image of dogs playing poker in the manner of Picasso.


    c)     Video creation:  VAEs can create new video sequences, just as they can
    create images. The additional video components in this case are also restricted
    to those found in the training data set.


    d)    Language processing:  Complex associations between data pieces may be recognised
    and comprehended by VAEs. This makes VAEs useful for creating artificial intelligence
    (AI) entities such as chatbots and digital assistants that can produce speech
    that sounds both natural and manufactured.


    e)     Anomaly detection:  VAEs specialise in time series or sequential data processing
    and are capable of handling massive amounts of data. Given that the benchmark
    or typical behaviour of a system has been established, VAEs are thus well suited
    to anomaly identification in data points.


    f)       Synthetic data creation:  VAEs are used by software engineers to create
    artificial data sets for testing and development. In situations when real-world
    data is scarce or testing data needs are very high, this streamlines the application
    development process.


    ## 5.2                 Generative Adversarial Networks


    In 2014, Ian Goodfellow and his colleagues presented Generative Adversarial Networks
    (GANs). GANs are a kind of neural networks that create new instances that are
    similar to the original dataset by automatically identifying patterns in the input
    data.


    The Generator and Discriminator neural networks make up the architecture of a
    GAN. They create synthetic data that is exact replicas of real data via adversarial
    training.


    ![](Image00026.jpg)


    Figure ‎ 5.2: Generative Adversarial Networks (GANs).  [\[20\]](#text00015.html#_ftn20)


    The two networks play a never-ending game of cat and mouse in which the Generator
    becomes better at producing realistic data and the Discriminator gets better at
    spotting fakes. This adversarial method produces high-quality, realistic data
    over time.


    1.  Architecture of GANs


    ![https://miro.medium.com/v2/resize:fit:700/1\*20eOTTCwC-jGXpbAoc9yVg.png](Image00027.jpg)


    Figure ‎ 5.3: Architecture of GANs.  [\[21\]](#text00015.html#_ftn21)


    The Generator and the Discriminator neural networks are trained concurrently using
    adversarial training to form a Generative Adversarial Network (GAN).


    1.  Generator : This network generates data (such as pictures) from random noise.
    Its objective is to produce data that closely resembles actual data.


    2.  Discriminator : This network endeavours to differentiate between actual data
    and the data produced by the Generator from its input. It produces the likelihood
    that the provided data is accurate.


    The Generator attempts to create data during training that the Discriminator is
    unable to discern from actual data, while the Discriminator seeks to improve its
    ability to discriminate between genuine and fake data. In essence, the two networks
    are playing a game of competition: the Generator seeks to create convincingly
    fictitious data, while the Discriminator seeks to distinguish between genuine
    and fake. Over time, the Generator produces better and better data as a result
    of this adversarial process.


    2.  Types of GANs


    GANs can be used for a variety of activities and come in a variety of shapes.
    The most popular GAN kinds are as follows:'
