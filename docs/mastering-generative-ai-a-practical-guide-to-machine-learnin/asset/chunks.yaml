  trans: '

    通常，所有的自编码器都是能够学习数据的神经网络。自编码器由一个用于从压缩片段中重建原始数据的 `decoder`（解码器）和一个用于将输入数据分解为较小组件的
    `encoder`（编码器）组成。构建得当的自编码器将提供高度准确的解码器输出并重构数据。因此，信息是以非常精炼的方式获取的。


    通过在编码过程中引入概率特征，`VAE` 扩展了自编码器的基础。引入“变分”（variational）一词到自编码器的词汇表中，是为了反映这些概率能力。本质上，`VAE`
    可能会在编码过程中创建一个更广泛的数据分布，然后在解码时从该更广泛的数据中进行抽样。


    得益于这些额外的能力，`VAEs` 能够模拟生成过程。此外，它允许 `VAEs` 在保持训练数据集代表性的同时，生成以前无法获得的数据。下面列出的四种基本行为有助于理解
    `VAEs`：


    1. 训练数据教会 `VAE` 识别关键组件。这是编码的行为。

    2. 使用训练数据的关键组件，`VAE` 重建原始数据。这是解码的行为。

    3. 通过在编码端包含概率特征（如 `inference` 推理），`VAE` 可以从编码样本中生成各种数据输出。这种机制是生成性的。

    4. `VAE` 通过将这些复杂的生成输出重新编码回学习和编码数据的潜在空间，高效地使 `VAEs` 能够执行如无监督学习等任务。


    ## 2. 变分自编码器的架构


    变分自编码器 (`VAEs`) 与传统自编码器的不同之处在于它们基于编码器-解码器设计。编码器网络将未处理的输入数据转换为潜在空间的概率分布。


    由于编码器产生的是概率潜码，`VAE` 可以描述一系列可能的表示，而不仅仅是潜在空间中的某一点。


    从潜在分布中抽样的点随后由 `decoder` 网络重构回数据空间。为了减少重构损失（即输入数据与解码输出之间的差异），模型在训练期间会优化 `encoder`
    和 `decoder` 参数。除了实现准确重构外，目标是对潜在空间进行正则化，使其遵循预定的分布。


    重构损失和正规化项（通常用 Kullback-Leibler 散度表示）是整个过程中必须仔细平衡的两个关键元素。重构损失强制模型正确重建输入，而正规化项通过鼓励潜在空间遵循所选分布来防止过拟合并促进泛化。


    `VAE` 通过在训练期间反复修改这些参数，学习将迁入数据转换为有意义的潜在空间表示。这种优化的潜码使得准确重构成为可能，它捕捉了数据的根本特征和结构。得益于潜在空间的概率特性，还可以从学习得的分布中选择随机点来生成新样本。


    ![Lightbox](img/Image00025.jpg)


    图 5.1: `VAE` 架构。[ [19]](#text00015.html#_ftn19)


    ## 3. 变分自编码器的用途


    `VAEs` 的三个主要目标是生成新数据、发现现有数据中的异常以及消除不理想或噪声数据。尽管这三个特征看起来并不显著，但它们使得 `VAEs` 能够许多强大的应用，包括：


    a) 文本创建：`VAEs` 能够在保持训练数据集代表性的同时生成新数据。在数据稀缺的情况下，这简化了开发过程。

    b) 图像创建：`VAEs` 能够在保持训练数据集代表性的同时生成以前无法获得的数据。在数据稀缺的情况下，这简化了开发过程。

    c) 视频创建：由于这些额外的能力，`VAEs` 能够模拟生成。此外，它允许 `VAEs` 在保持训练数据集代表性的同时生成以前无法获得的数据。

    d) 语言处理：`VAE` 通过将这些复杂的生成输出重新编码回学习和编码数据的潜在空间，高效地使 `VAEs` 能够执行如无监督学习等任务。

    e) 异常检测：`VAE` 通过在训练期间反复修改这些参数，学习将迁入数据转换为有意义的潜在空间表示。准确重构通过此……

    f) 合成数据创建：软件工程师使用 `VAEs` 来创建人工数据。在数据稀缺的情况下，这简化了开发过程。


    ## 5.2 生成对抗网络 (GANs)


    变分自编码器 (`VAEs`) 与传统自编码器的不同之处在于它们基于编码器-解码器设计。编码器网络将未处理的输入数据转换为潜在空间的概率分布。


    由于编码器产生的是概率潜码，`VAE` 可以描述一系列可能的表示，而不仅仅是潜在空间中的某一点。


    从潜在分布中抽样的点随后由 `decoder` 网络重构回数据空间。为了减少重构损失（即输入数据与解码输出之间的差异），模型在训练期间会优化 `encoder`
    和 `decoder` 参数。除了实现准确重构外，目标是对潜在空间进行正则化，使其遵循预定的分布。


    ![Image00026.jpg)


    图 5.2: `VAE` 架构。[ [20]](#text00015.html#_ftn20)


    这两个网络玩着永不停歇的猫鼠游戏，生成器变得越来越擅生成数据，而判别器变得越来越擅长伪造。这种对抗方法随着时间的推移产生高质量的数据。


    ### 1. GAN 的架构


    ![`miro.medium.com/v2/resize:fit:700/1\*20eOTTCwC-jGXpbAoc9Vg.png`](img/Image00027.jpg)


    图 5.3: GAN 的架构。[ [21]](#text00015.html#_ftn21)


    生成器和判别器神经网络通过对抗训练同时训练，形成生成对抗网络。


    1. 生成器：该网络从随机噪声生成数据（如图片）。其目标是产生与真实数据相似的数据。

    2. 判别器：该网络努力区分真实数据和生成器产生的数据。它输出提供数据准确的概率。

