    *   Principal Component Analysis\n*   Independent Component Analysis.\n\n####\
    \ 2. Association in Unsupervised Learning\n\nIn unsupervised learning, association\
    \ is a technique for finding intriguing correlations or trends across variables\
    \ in large datasets. The rules that emphasise the relationship between the occurrence\
    \ of one item and the occurrence of another are identified using this approach.\
    \ For instance, an association algorithm may show that consumers who purchase\
    \ bread are also likely to purchase butter in a market basket study. These association\
    \ rules are used by businesses to enhance inventory control and product positioning.\n\
    \nThe following are a few popular association rule learning algorithms:\n\n* \
    \  Apriori Algorithm\n*   Eclat\n*   FP-growth Algorithm\n\n## 3. Semi-Supervised\
    \ Learning\n\nSemi-supervised learning is another popular machine learning approach\
    \ that uses a lot of unlabelled data and a small quantity of labelled data.\n\n\
    ### a) Example of Semi-supervised Learning\n\nConsider a dataset of images where\
    \ only a few are labelled. A semi-supervised system uses the labelled images to\
    \ learn basic features and then uses the unlabelled images to refine its understanding.\
    \ This is particularly useful when labelling data is expensive or time-consuming.\n\
    \n### b) Types of Semi-Supervised Learning\n\nNumerous semi-supervised models\
    \ exist, each with distinct characteristics and employed for distinct objectives.\n\
    \n1.  Graph-based Semi-Supervised Learning: The connections between data points\
    \ are represented by graphs. Through these links, labels are dispersed from marked\
    \ to unlabelled places.\n2.  Label Propagation: supposing that comparable data\
    \ points are near one another.\n3.  Co-training: Using two or more distinct models,\
    \ the predictions made by each model are used to enhance the others.\n4.  Self-training:\
    \ After training the labelled data, the model makes predictions about unlabelled\
    \ data.\n\n## 4. Reinforcement Learning\n\nReinforcement learning is a framework\
    \ in which an agent acquires the ability to make decisions by executing actions\
    \ in an environment in order to attain the highest possible reward. The agent\
    \ learns via trial and error, starting with no prior knowledge of the optimal\
    \ action. Every action has an outcome, which may be either a reward or a punishment.\n\
    \n### a) Example of Reinforcement Learning\n\nConsider the process of teaching\
    \ a dog to catch a ball. The setting is the yard, the participant is the dog,\
    \ and the activity involves retrieving the ball. When the dog retrieves the ball,\
    \ a treat is given as a reward. If the dog fails to retrieve the ball or engages\
    \ in another activity, it does not earn a treat, which serves as a negative reward.\n\
    \nAt the beginning, the dog might not grasp the task, but with time, it comes\
    \ to realise that retrieving the ball results in a reward. The dog's fetching\
    \ habit increases with repeated encounters and incentives.\n\n![What Is Reinforcement\
    \ Learning? - MATLAB & Simulink](Image00007.jpg)\n\nFigure 2.6: Reinforcement\
    \ learning. [[6]](#text00015.html#_ftn6)\n"
  trans: '

    回归学习是另一种类型的监督学习，其目标是预测连续值而非类别。它使用包含输入-输出对的标记数据集（其中输出为数值）来训练算法。例如，系统通过位置、卧室数量和平方英尺等特征进行学习，以预测房屋价值。利用这些数据，算法可以根据房屋的属性预测新房的价格。寻找股票价格预测、预测经济模式等许多情况，只是回归学习的众多应用场景之一。


    回归学习方法中常用的算法包括：


    *   线性回归

    *   多项式回归

    *   岭回归（Ridge Regression）

    *   Lasso 回归（Lasso Regression）

    *   决策树

    *   随机森林。


    ## 2. 无监督学习


    在无监督学习中，算法获得的是没有标签或预设类别的数据，这使其成为机器学习技术中最流行的形式之一。该程序的首要目标是在数据中发现模式或相关性。算法不需要被指示要搜索什么，而是自动发现共同特征并聚类相关数据点。这有助于识别隐藏模式、将相关事物归为一类，或减少进一步分析的数据量。


    ### a) 无监督学习的示例


    想象一个包含不同书籍及其特征（如体裁、作者、页数和出版年份）的数据集。无监督学习系统可以使用聚类根据这些特征将相关书籍组合在一起。这将揭示一组由同一作者编写或属于特定类别的小说。书店能够利用这些信息进行更好的库存管理，或向客户推荐相似的书籍。


    ![揭示数据科学中的前 5 大无监督机器学习算法](img/Image00005.jpg)


    图 2.4: 无监督机器学习。[[4]](#text00015.html#_ftn4)


    ### b) 无监督学习的类型


    无监督学习主要分为两类：关联和聚类。


    #### 1. 无监督学习中的聚类


    在无监督学习中，聚类是算法根据相似性对数据点分类的过程。每个簇（或组）中的数据点彼此之间与其他簇中的单个数据点更具可比性。聚类是用于许多不同领域的领域，例如客户细分，它允许公司将具有相似购买行为的客户分组，并为每位客户定制独特的营销活动。


    以下是一些流行的聚类算法：


    *   K-Means 聚类算法

    *   均值漂（Mean-shift）算法

    *   DBSCAN 算法

    *   主成分分析（PCA）

    *   独立成分分析（ICA）。


    #### 2. 无监督学习中的关联


    在无监督学习中，关联是一种用于发现大型数据集中变量之间有趣相关性或趋势的技术。通过这种方法识别出强调一个项目发生与另一个项目发生之间关系的规则。例如，在购物篮分析中，关联算法可能会显示，购买面包的消费者也可能购买黄油。企业使用这些关联规则来增强库存控制和产品定位。


    以下是一些流行的关联规则学习算法：


    *   Apriori 算法

    *   Eclat 算法

    *   FP-growth 算法


    ## 3. 半监督学习


    半监督学习是另一种流行的机器学习方法，它使用了大量的未标记数据和少量标记数据。


    ### a) 半监督学习的示例


    考虑一个图像数据集，其中只有少数带有标记。半监督系统使用标记图像来学习基本特征，然后使用未标记图像来完善其理解。这在标记数据成本昂贵或耗时时特别有用。


    ### b) 半监督学习的类型


    存在许多半监督模型，每个模型都有不同的特征并用于不同的目标。


    1.  基于图的半监督学习：数据点之间的连接用图表示。通过这些链接，标签从标记处传播到未标记处。

    2.  标签传播（Label Propagation）：假设相似的数据点彼此靠近。

    3.  协同训练（Co-training）：使用两个两个不同的模型，利用每个模型的预测来增强其他模型。

    4.  自训练（Self-training）：在训练标记数据后，模型对未标记数据进行预测。


    ## 4. 强化学习


    强化学习是一个框架，代理体通过在环境中执行动作来获得可能的奖励。代理体通过试错来学习，开始对最优动作没有先验知识。每个动作都有一个结果，结果可能是奖励也可能是惩罚。


    ### a) 强化学习的示例


    考虑教狗接球的过程。场景是院子，参与者是狗，活动涉及捡球。当狗捡回球时，给予零食作为奖励。如果狗没有捡回球或从事其他活动，则得不到零食，这作为负奖励。


    刚开始，狗可能无法理解这项任务，但随着时间的推移，它意识到捡球会带来奖励。随着反复的接触和激励，狗的捡球习惯会增加。


    ![什么是强化学习？ - MATLAB & Simulink](img/Image00007.jpg)


    图 2.6: 强化学习。[[6]](#text00015.html#_ftn6)

    '
