- raw: 'a)     Vanilla GAN:  This is the most basic of all GANs. Using stochastic
    gradient descent, a technique for learning a whole data set by going over each
    sample one at a time, its algorithm attempts to optimise the mathematical equation.
    It is made up of a discriminator and a generator. The discriminator and generator
    are simple multilayer perceptrons that are used to create and classify produced
    images. While the generator gathers the data distribution, the discriminator aims
    to ascertain the probability that the input belongs to a certain class.


    b)    Conditional GAN:  This kind of GAN makes it possible to condition the network
    with novel and targeted information by adding class labels. To assist the network,
    learn to differentiate between them, the network is given the photos together
    with their true names, such as "rose," "sunflower," or "tulip," during GAN training.


    c)     Deep convolutional GAN:  High-resolution images that can be differentiated
    are generated by this GAN, which employs a deep convolutional neural network.
    Convolutions are a method for extracting significant information from the data
    that is produced. They operate especially effectively with images, allowing the
    network to swiftly take in the important information.


    d)    Self-attention GAN: This GAN incorporates residually linked self-attention
    modules, making it a variant of the deep convolutional GAN. This attention-driven
    architecture is not restricted to spatially local spots; it may build details
    utilising signals from all feature locations. Consistency between features that
    are far apart in an image can also be maintained by its discriminator.


    e)     CycleGAN:  The most popular GAN architecture, it is often used to learn
    how to switch between several forms of images. For example, a network may be trained
    to change a picture from a horse to a zebra or from winter to summer. FaceApp,
    one of the most well-known uses of CycleGAN, transforms human faces into different
    age groups.


    f)       StyleGAN:  In December 2018, Nvidia researchers published StyleGAN, which
    suggested major enhancements to the initial generator architecture models. Users
    have the ability to modify the model to alter the aspect of the images generated
    by StyleGAN, which is capable of producing photorealistic, high-quality photos
    of faces.  [\[22\]](#text00015.html#_ftn22)


    g)    Super-resolution GAN:  A low-resolution picture may be transformed into
    a more detailed one using this kind of GAN. Super-resolution GANs fill up areas
    of blur to improve picture resolution.


    h)    Laplacian pyramid GAN:  High picture quality is achieved by this GAN by
    combining many generator and discriminator networks to create a linear image with
    band-pass images spaced octave apart, utilising various layers of the Laplacian
    pyramid.


    ## 5.3                 Transformers


    A neural network architecture known as Transformer is utilised for executing machine
    learning tasks. In 2017, a paper titled “Attention is all you need” was published
    by Vaswani and colleagues, introducing the transformers architecture. The article
    examines the design, functionality, and uses of transformers.  [\[23\]](#text00015.html#_ftn23)


    The Transformer Architecture is a model that employs self-attention to convert
    an entire sentence into a singular sentence. This represents a significant change
    from the operation of previous models, addressing the difficulties encountered
    in architectures such as RNNs and LSTMs.


    1.  Use Cases for Transformers


    Large transformer models can be trained on various types of sequential data, including
    human languages, music compositions, programming languages, and additional forms.
    Here are several illustrative use cases.


    a)       Natural language processing


    Machines are now able to understand, interpret, and generate human language with
    unprecedented accuracy, thanks to transformers. Large documents can be summarised,
    and coherent, contextually relevant text can be generated for various use cases.
    Virtual assistants such as Alexa utilise transformer technology to comprehend
    and react to voice commands.


    b)       Machine translation


    Translation applications utilise transformers to deliver real-time and precise
    translations across different languages. The fluency and accuracy of translations
    have seen significant improvements with the advent of transformers in comparison
    to earlier technologies.


    c)       DNA sequence analysis


    By considering segments of DNA as a sequence akin to language, transformers are
    able to forecast the impacts of genetic mutations, comprehend genetic patterns,
    and assist in pinpointing areas of DNA linked to specific diseases. This ability
    is essential for tailored healthcare, as comprehending a person''s genetic composition
    can result in more efficient treatments.


    d)       Protein structure analysis


    Transformer models have the capability to handle sequential data, making them
    particularly effective for modelling the lengthy sequences of amino acids that
    fold into intricate protein structures. Grasping the structures of proteins is
    essential for the discovery of drugs and for comprehending biological processes.
    Transformers can also be utilised in applications that forecast the 3D structure
    of proteins derived from their amino acid sequences.


    2.  Components of Transformer Architecture


    The architecture of transformer neural networks consists of multiple software
    layers that collaborate to produce the final output. The image presented illustrates
    the components of transformation architecture:


    ![https://d1.awsstatic.com/GENAI-1.151ded5440b4c997bac0642ec669a00acff2cca1.png](Image00028.jpg)


    Figure ‎ 5.4: Components of transformer architecture.  [\[24\]](#text00015.html#_ftn24)


    a)       Input Embedding


    This phase transforms the input sequence into a mathematical format that is comprehensible
    to software algorithms. The initial step involves dividing the input sequence
    into a collection of tokens or separate components of the sequence. As an example,
    when the input consists of a sentence, the tokens represent the words. The embedding
    process subsequently converts the token sequence into a sequence of mathematical
    vectors. The vectors hold both semantic and syntactic information, represented
    numerically, with their characteristics acquired throughout the training process.


    Vectors can be visualised as a collection of coordinates within an n-dimensional
    space. For a straightforward illustration, consider a two-dimensional graph in
    which the x-axis denotes the alphanumeric value of the initial letter of the word,
    while the y-axis signifies their respective categories. The term banana holds
    a value (2,2) as it begins with the letter b and belongs to the category of fruit.
    The term mango holds a value (13,2) as it begins with the letter m and belongs
    to the category of fruit. The neural network is therefore informed that the terms
    "banana" and "mango" belong to the same category via the vector (x,y).


    Envision an n-dimensional space where numerous attributes related to the grammar,
    meaning, and usage of any word are represented by a sequence of numbers. The software
    is capable of utilising numerical data to compute the relationships among words
    in mathematical terms, thereby gaining an understanding of the human language
    model. Embeddings offer a method for representing distinct tokens as continuous
    vectors that can be processed and learnt from by the model.


    b)       Positional Encoding'
