- raw: 'Mini-batch gradient descent resembles stochastic gradient descent; however,
    it utilises a small, fixed-size group of samples to calculate the gradient rather
    than relying on a single sample. The update rule remains consistent with that
    of SGD, with the exception that the gradient is averaged across the mini-batch.
    This has the potential to minimise noise in the updates and enhance convergence.


    ![](Image00021.jpg)


    Figure ‎ 3.11: Mini-Batch Gradient Descent.  [\[17\]](#text00015.html#_ftn17)


    5.  Adagrad


    An optimisation algorithm known as Adagrad employs an adaptive learning rate for
    each parameter. The learning rate is adjusted according to historical gradient
    information, resulting in parameters that undergo frequent updates having a reduced
    learning rate, while those that experience fewer updates have an increased learning
    rate. The update rule can be expressed in the following manner:


    g \=∇ θ ​ L ( θ ; x ( i ) ; y ( i ) )


    G \= G + g ⊙ g


    θ \= θ −​ α/G + ϵ ​⊙ g


    Where


    *   G  is a matrix that accumulates the squares of the gradients, and


    *   ϵ  is a small constant added to avoid division by zero.


    6.  RMSProp


    RMSProp is an optimisation algorithm that resembles Adagrad; however, it employs
    an exponentially decaying average of the squares of the gradients instead of the
