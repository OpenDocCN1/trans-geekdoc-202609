- raw: 'Deep neural networks and machine learning form the basis of this concept.
    It involves a competition between two unstable neural networks, a discriminator
    and a generator, to provide more realistic data and predictions.


    An unsupervised learning method called a GAN enables the automated discovery and
    learning of various patterns in input data. Image-to-image translation, which
    converts daylight photographs into nighttime photos, is one of its primary applications.
    Additionally, GANs are utilised to produce very realistic representations of a
    wide range of items, people, and settings that are difficult for even the human
    brain to distinguish as fake.


    b)       Variational Autoencoders (VAEs)


    VAEs are generative models that are built on neural network autoencoders, which
    are made up of encoders and decoders, two distinct neural networks, much like
    GANs. They''re the most effective and useful way to create generative models.


    In order to swiftly sample fresh data from the training data''s underlying probability
    distribution, VAE, a probabilistic graphical model based on Bayesian inference,
    aims to comprehend that distribution. The encoders in VAEs seek to better represent
    the data, while the decoders more effectively reconstruct the original data set.
    VAEs are often used in signal processing, security analytics, and anomaly detection
    for predictive maintenance.


    c)       Autoregressive Models


    Autoregressive models may readily accommodate a range of time-series patterns
    and forecast future values based on previous values. These models use a linear
    combination of a sequence''s historical values to forecast its future values.


    Forecasting and the study of time series, including stock prices and index values,
    often use autoregressive models. Modelling and predicting weather trends, predicting
    product demand based on historical sales data, and researching crime and health
    effects are some further use examples.


    d)       Bayesian Networks


    Graphical representations of probabilistic interactions between variables are
    called Bayesian networks. They do very well in circumstances when knowledge of
    cause and effect is essential. For example, based on observed symptoms, a Bayesian
    network may efficiently determine the likelihood of a disease in medical diagnosis.


    e)       Diffusion Models


    Noise is gradually introduced into diffusion models, which subsequently learn
    to reverse the process. This results in the generation of data.


    They are essential for comprehending the evolution of phenomena and are especially
    helpful in examining scenarios like the spread of infectious illnesses within
    a population or the propagation of rumours in social networks.


    f)         Restricted Boltzmann Machines


    RBMs are neural networks with two layers that can learn the input data''s probability
    distribution. They are used in recommendation systems, which utilise user preferences
    to offer films on streaming platforms.


    g)       Pixel Recurrent Neural Networks


    One kind of generative model intended for picture generating applications is PixelRNNs.
    They are particularly trained to model pictures pixel by pixel in order to produce
    new images that match the ones in the training data. They are based on the idea
    of recurrent neural networks.


    h)       Markov Chains


    Generative models known as Markov chains ignore previous states and predict future
    states only based on the present state. In text generation, they are often used
    to anticipate the subsequent word in a phrase based just on the word that is now
    being used.


    i)         Normalising Flows


    These generative models may describe real-world data by converting a basic, readily
    sampled probability distribution—like a Gaussian distribution—into a more intricate
    distribution.


    Applying a sequence of invertible transformations on a basic distribution with
    the goal of producing a distribution that closely resembles the target data distribution
    is the main objective of normalising flows.


    ## 4.2                 Generative vs Discriminative Models


    In machine learning, knowing the distinction between discriminative and generative
    models is essential for choosing the best strategy to address certain issues.
    Models of these two categories are frequently pitted against one another in order
    to achieve optimal performance. Generative models, like Naive Bayes and Generative
    Adversarial Networks (GANs), concentrate on creating new data instances and modelling
    the distribution of data. Discriminative models, on the other hand, such as Support
    Vector Machines (SVMs) and Logistic Regression, learn to differentiate between
    data classes by concentrating on boundaries.


    1.  Generative Model


    A subfield of artificial intelligence (AI) called "generative AI" is dedicated
    to producing original content, such prose, music, and graphics. One kind of machine
    learning model that seeks to comprehend the underlying distributions and patterns
    of data is called a generative model. After learning from the data, it may produce
    brand-new data that is comparable to the original data.


    Generative AI carefully examines information to identify complex linkages and
    traits that are present. This is known as AI training. For instance, the AI model
    may be trained on a billion old writings to produce an essay. This includes a
    wide range of media, including code, text, pictures, and music.


    It then starts creating new data instances that are similar to those in the original
    dataset. Furthermore, probabilistic methods are often used in generative AI to
    simulate the underlying data distributions. It can accurately determine the probability
    of the many outputs it produces in this way, guaranteeing a realistic result.


    2.  Discriminative Model


    Conditional models, also known as discriminative models, are another kind of machine
    learning model that has several applications. Classification challenges are a
    typical illustration of discriminative AI. The AI model is taught to categorise
    inputs into pre-established groups.


    A discriminative AI example might be a spam email filter. The classification of
    emails as spam or not spam is determined by factors such as the structure of the
    email, the originator information, and the keywords used.


    Discriminative AI functions via a unique mechanism that mostly involves the algorithms
    used and the training procedure. First, tagged data is used to train these models.
    Their respective categories are indicated by the specific class identifiers that
    are assigned to each data point. The model can more easily identify key characteristics
    that act as class discriminators thanks to this tagged data. Second, a range of
    algorithms are necessary for discriminative AI to operate. Examples of these include
    the well-known logistic regression, neural networks, decision trees, and support
    vector machines (SVMs). Depending on how it was trained and how the algorithm
    is configured, discriminative AI may now distinguish between spam and relevant
    emails and assist with data analytics.


    3.  Generative Models Vs Discriminative Models: Comparison Summary


    The main distinctions and similarities between generative and discriminative models
    are succinctly summarised in this table. It outlines each of their goals, methods
    of instruction, uses, advantages, and disadvantages.


    | Aspect || Generative Models || Discriminative Models |


    | --- | --- | --- |


    | Objective || “Learn joint probability distribution of data || “Learn conditional
    probability of target given data |


    | Focus || Generate new data samples || Make predictions/classifications based
    on data |


    | Training Approach || Typically unsupervised learning || Typically supervised
    learning |


    | Example Applications || Image generation, text generation, data augmentation
    || Classification, regression, sequence labeling |


    | Key Algorithms || Variational Autoencoders (VAEs), Generative Adversarial Networks
    (GANs) || Convolutional Neural Networks (CNNs), Recurrent Neural Networks (RNNs),
    Support Vector Machines (SVMs) |'
