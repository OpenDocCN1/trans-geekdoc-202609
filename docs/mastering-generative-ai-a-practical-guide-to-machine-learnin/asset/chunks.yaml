    ## 8.2                 Responsible AI


    An emerging field of AI governance is responsible AI. The term "responsible" is
    used to refer to both ethics and the democratisation of AI.


    Bias is often introduced by the data sets used to train machine learning (ML)
    models used in artificial intelligence. There are two primary methods by which
    bias is introduced into these models: incomplete or defective data, or the biases
    of those who train the ML model. Biased AI programs have the potential to harm
    or adversely impact people. For instance, it may unjustly deny credit applications
    or, in the medical field, misdiagnose a patient.


    1.  Principles of Responsible AI


    A set of guidelines that may vary from company to company should be adhered to
    by AI and machine learning models.


    For instance, both Google and Microsoft adhere to their own set of values. Furthermore,
    a 1.0 version of the Artificial Intelligence Risk Management Framework issued
    by the National Institute of Standards and Technology (NIST) adheres to many of
    the same guidelines as those listed by Google and Microsoft. Among NIST''s seven
    guiding principles are the following:


    1.  Valid and reliable: In various and unforeseen situations, responsible AI systems
    need to be able to continue operating without experiencing any problems.


    2.  Safe: Responsible AI must protect the environment, property, and human life.


    3.  Secure and resilient: Appropriate AI systems need to be safe and strong against
    possible dangers, such hostile assaults. AI systems that are responsible must
    be designed to prevent, defend against, and react to assaults while also having
    the capacity to bounce back from them.


    4.  Accountable and transparent: The goal of more transparency is to increase
    confidence in the AI system while also making it simpler to address issues related
    to the output of AI models. Developers are required under this concept to assume
    accountability for their AI systems.


    5.  Explainable and interpretable: Explainability and interpretability are designed
    to provide detailed information about how well an AI system works and how reliable
    it is. For instance, explainable AI explains to people how and why the system
    produced its results.


    6.  Privacy-enhanced: Practices that protect end users'' autonomy, identity, and
    dignity are enforced under the privacy principle. Values like control, anonymity,
    and secrecy must guide the development and implementation of responsible AI systems.


    7.  Fair with harmful bias managed: Eliminating AI prejudice and discrimination
    is the main goal of fairness. It makes an effort to guarantee justice and equality,
    which is a challenging undertaking since these ideals vary throughout organisations
    and their cultures.


    2.  Designing Responsible AI


    AI models have to be developed with specific objectives that centre on developing
    a model in a manner that is secure, reliable, and moral. To make sure a company
    is dedicated to offering objective, reliable AI technology, constant examination
    is essential. An organisation must adhere to a maturity model while developing
    and deploying an AI system in order to accomplish this.


    Fundamentally, development standards that emphasise responsible design principles
    are the foundation of responsible AI. The following requirements have to be included
    into these corporate-wide AI development guidelines:


    1.  Shared code repositories.


    2.  Approved model architectures.


    3.  Sanctioned variables.


    4.  Established bias testing methodologies to help determine the validity of tests
    for AI systems.


    5.  Stability standards for active machine learning models to ensure AI programming
    works as intended.


    3.  Challenges in Implementing Responsible AI


    The process of implementing responsible AI rules and frameworks is often slowed
    down by important issues and concerns. Among these challenges are the following:


    1.  Security and privacy:  Companies that gather information for AI model training
    may need private information about specific people. Although it may be challenging
    to distinguish private information from public information, responsible AI principles
    seek to address data privacy, security, and protection.


    2.  Data bias:  To prevent biases, training data should be carefully obtained
    and examined, although biases are sometimes difficult to identify. There is no
    one-size-fits-all method; it takes time and effort to remove biases from inputs
    and data sets.


    3.  Compliance:  Businesses must keep an eye out for new restrictions and make
    sure their AI policies are simple to update as laws and regulations continue to
    change at the local, state, federal, and international levels.


    4.  Training:  Business owners need to be aware of who is in charge of managing
    AI systems and make sure they are properly educated. Legal, marketing, human resources,
    and other departments and stakeholders may need training in addition to technical
    teams.


    ## 8.3                 Intellectual Property and the Generative AI Platform


    In simple terms, intellectual property (IP) encompasses the intangible creations
    of humans, including "ideas, inventions, creative works, logos, brand names, and
    more". Intellectual property rights (IPR), which are designed to safeguard creators
    and stop unauthorised use of their works, are a similar idea.


    There are currently a number of ongoing legal actions against companies that have
    provided AI picture generation, AI text generation, and AI code generation tools,
    and more will surely come as a result of the fast emergence of generative AI and
    its associated complicated intellectual property issues.


    Though this is just the beginning, the use of IPR-protected information in model
    training has been the primary focus of these litigation up to this point. Numerous
    more IP hazards are associated with generative AI:


    1.  Training Data Risks


    Using IP-protected data to train AI models is one of the most often recognised
    concerns. Although this concern is not exclusive to generative AI, it has grown
    in importance as artists see their creations being copied in generative AI model
    outputs and feel that their employment are in jeopardy.


    Businesses that create generative AI models are coming under fire for training
    their models on copyrighted content without the owners'' consent, and it''s not
    clear whether current exclusions like fair use would apply in these situations.
    There is now a range of methods, from rigorous limitations and fully transparent
    disclosure of training material to almost unlimited use of copyrighted works,
    and several nations and international groups are actively working on relevant
    recommendations and regulations.


    2.  Model Output Risks'
