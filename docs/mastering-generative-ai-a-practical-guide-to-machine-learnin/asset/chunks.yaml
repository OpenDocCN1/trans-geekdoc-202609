    The supervised learning algorithm can be divided into two primary categories:
    Classification Learning and Regression Learning.


    1.  Classification Learning


    Sorting data into distinct classes or groups is the aim of classification learning,
    a kind of supervised learning. A labelled dataset, in which every data point is
    linked to a predetermined category, is used to train the algorithm. For instance,
    in an email spam filter, the algorithm becomes adept at categorising emails as
    either "spam" or "not spam" based on attributes such as the subject line, originator,
    and content.


    The following are some typical classification learning algorithms:


    *   Logistic Regression


    *   Support Vector Machine


    *   Random Forest


    *   Decision Tree


    *   K-Nearest Neighbours (KNN)


    *   Naive Bayes.


    2.  Regression Learning'
