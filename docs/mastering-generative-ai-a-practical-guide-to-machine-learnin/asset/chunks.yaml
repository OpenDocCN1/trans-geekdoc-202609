    This has significant effects on scalability, efficiency, and automation.


    b) **When to Use**: When autonomous decision-making is needed in complex and dynamic
    situations, agentic AI is perfect. This covers fields including financial trading,
    robots, driverless cars, and smart home automation.


    ## 1.3 Applications of Generative Models


    A generative model produces abstractions or representations of observable events
    or target variables using statistical and probabilistic techniques together with
    artificial intelligence (AI). It is therefore possible to create new data that
    resembles the observed data using these representations.


    In order to represent events in data and help computers comprehend the actual
    world, generative modelling is employed in unsupervised machine learning (ML).
    Modelled data can be utilised to forecast a wide range of probability about a
    subject using this AI knowledge. A subclass of statistical models known as generative
    models creates new instances of data.


    Applications for generative models are many and span many different domains. Below
    is a summary of some of the most important areas:


    1. **Image generation**:

    The generative adversarial networks (`GANs`) are often used to produce photorealistic
    pictures that may be employed in a variety of fields, such as video game development,
    interior design, and fashion. For example, they may create lifelike human faces
    or other commercial components.


    2. **Art creation**:

    Generative models are increasingly being used by musicians and artists to produce
    fresh and avant-garde works of art. The art industry has seen a transformation
    because to tools like `Midjourney`, which allow artists to create beautiful images
    in response to text prompts or certain art styles.


    3. **Drug discovery**:

    Drug development is being expedited by generative AI models, which create novel
    chemical structures, forecast their characteristics, and optimise them for qualities
    like safety and effectiveness. This method improves the accuracy of finding viable
    drug candidates while saving time and money by assisting researchers in exploring
    a larger chemical space.


    4. **Content creation**:

    Website owners are increasingly employing generative models using tools like `Copy.ai`
    and `HubSpot AI Content Writer` to expedite their content production process.
    For instance, these artificial intelligence (AI) technologies may produce blog
    articles, social media content, email marketing content, and landing page text
    by given prompts or subjects. Generative models facilitate the production of material
    more quickly while preserving consistency and quality. To guarantee accuracy,
    relevance, and a distinctive brand voice, human monitoring is always required
    when producing content.


    5. **Video games**:

    By automating a variety of activities, including the creation of realistic textures,
    three-dimensional models, and animations, generative models speed up the production
    of video games. The models provide dynamic, intelligent non-player characters
    (`NPCs`) with a variety of game settings and levels. Generative models allow developers
    to concentrate on core gameplay by automating tedious tasks and producing imaginative
    material, which leads to more inventive and engrossing gaming experiences.


    6. **Image-to-image translation**:

    Using deep learning approaches, generative models learn to map several picture
    representations together to give image-to-image translation. For example, models
    like `GANs` may turn crude drawings into realistic pictures or a greyscale image
    into a coloured one.


    7. **Text-to-image translation**:

    Textual descriptions may be translated into related visuals using generative models,
    which has uses in content production and advertising. Concepts stated in words
    are visualised via text-to-image technology.


    8. **Video generation**:

    Generative models, like `GANs`, use preexisting video data to identify patterns
    and produce synthetic video content. They create new sequences that imitate the
    original style by analysing frame connections, motion, and visual components.
    Applications like virtual reality, entertainment, and advertising where dynamic,
    captivating material is essential are supported by this.


    9. **Audio generation**:

    Generative models have made tremendous progress in the creation of music and speech
    synthesis. For example, deep learning methods are used by models like `WaveNet`
    and `Tacotron` to produce very expressive and natural-sounding synthetic speech,
    which finds usage in voice-overs, audiobooks, and virtual assistants. In the music
    industry, models like `Jukedeck` and `Musenet` utilise machine-learning algorithms
    to create unique music by examining large datasets of previously recorded songs.
    Background soundtracks for a variety of multimedia projects are provided by this
    technology, which also helps musicians in their art.


    ## 1.4 Ethics in Generative AI


    Generative AI tools can provide assistance in daily life, in the workplace, or
    during study sessions. As with any instrument, its usage must be appropriate,
    evaluative, and ethical. The following outlines ethical considerations related
    to generative AI for exploration.


    1. **Environmental Impacts**:

    The process of constructing, training, and utilising generative AI models demands
    a considerable amount of energy and results in carbon emissions. A significant
    amount of water is also used for cooling purposes. Researchers and companies are
    investigating methods to enhance the sustainability of generative AI. However,
    it remains crucial to evaluate whether the application of AI justifies its environmental
    consequences and to utilise generative AI tools as efficiently as possible.


    2. **Accessibility**

