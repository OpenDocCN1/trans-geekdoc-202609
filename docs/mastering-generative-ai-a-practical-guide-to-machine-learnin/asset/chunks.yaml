    ## 学习目标


    本章探索了神经网络、各种架构以及挑战。通过追求预测准确性并解决过拟合和欠拟合等挑战。


    ## 3.1 什么是深度学习


    人工神经网络是机器学习的一个子集，灵感源于人类大脑的数据提取知识。


    ### 1. 深度学习算法


    大型标记数据集通常用于训练深度学习系统。例如，它们可以学习狗的图像。深度学习系统一旦完成学习，就能对新数据做出预测。


    ### 2. 深度学习的工作原理


    神经网络通过连接的节点（或神经元）层处理输入数据。数据通过输入层进入深度网络，然后通过隐藏层，隐藏层使用非线性函数改变数据。模型的预测由最后一层产生。


    ![Lightbox](img/Image0011.jpg)


    图 3.1：全连接深度网络


    ## 3. 深度学习的类型


    深度学习模型有多种形式。以下是最常见的类型之一：


    ### a) 卷积神经网络 (CNNs)


    CNN 用于分析和识别图像。它们非常擅长识别图片中的物体，即使这些物体变形或被部分遮挡。


    ### b) 深度强化学习


    深度强化学习用于游戏和机器人领域。这种机器学习允许智能体与环境交互，并通过获得奖励或惩罚来学习如何行为。


    ### c) 循环神经网络 (RNNs)


    语音识别和自然语言处理是 RNN 的两个应用。除了能够创建文本和翻译语言外，它们还擅长理解句子或短语的上下文。


    # 4. 使用深度学习模型的优势


    以下是采用深度学习模型的的一些优点：


    1. **学习数据中特征之间的复杂关系**：因此，它们比传统的机器学习技术更强大。

    2. **大规模数据集训练**：结果是它们可以从更多样化的事件中学习并更具扩展性，从而产生更精确的预测。

    3. **数据驱动学习**：DL 模型更高效且易于扩展，因为它们可以从数据中学习，在训练期间需要的人工交互较少。


