    # 引言

    深度神经网络和机器学习是这一概念的基础。它涉及到两个不稳定神经网络——`discriminator`（判别器）和 `generator`（生成器）之间的竞争，以提供更逼真的数据和预测。


    一种名为 `GAN` 的无监督学习方法能够自动发现并学习输入数据中的各种模式。图像到图像的转换（将白天照片转换为夜间照片）是其主要应用之一。此外，`GANs`
    还被用于生成各种物品、人物场景的极其真实的表示，这些内容甚至连人脑都难以分辨它们是伪造的。


    ## 分变自编码器 (VAEs)


    `VAEs` 是基于神经网络自编码器的生成模型，自编码器由 `encoders`（编码器）和 `decoders`（解码器）两个不同的神经网络组成，这类似于
    `GANs`。它们是创建生成模型最有效且实用的方法。


    `VAE` 是一种基于贝叶斯推断的概率图模型，旨在理解训练数据的底层概率分布，以便从该分布中快速采样出新数据。`VAEs` 中的 `encoders` 寻求更好地表示数据，而
    `decoders` 则更有效地重建原始数据集。`VAEs` 经常用于信号处理、安全分析和用于预测维护的异常检测。


    ## 自回归模型


    自回归模型可以轻松地适应一系列时间序列模式，并根据之前的值预测未来值。这些模型使用序列历史值的线性组合来预测其未来值。


    预测和时间序列研究（包括股价和指数值）经常使用自回归模型。其他用例还包括天气趋势的建模和预测、根据历史销售数据预测产品需求，以及研究犯罪和健康的影响。


    ## 贝叶斯网络


    `Bayesian networks` 是变量之间概率交互的图化表示。在因果关系知识至关情况下，它们表现非常好。例如，在医学诊断中，根据观察到的症状，`Bayesian
    network` 可以有效地确定疾病的概率。


    ## 扩散模型


    `diffusion models` 逐渐引入噪声，随后学习反转这一过程，从而生成数据。


    它们对于理解现象的演变至关重要，并且对于检查传染病在人群中的传播或谣言在社交网络中的传播等场景非常有帮助。


    ## 受限玻尔兹曼机


    `RBMs` 是具有两层的神经网络，可以学习输入数据的概率分布。它们被用于推荐系统，利用用户偏好在流媒体平台上提供电影。


    ## 像素递归神经网络


    `PixelRNNs` 是旨在用于图像生成应用的一种生成模型。它们经过专门训练，通过逐像素对图像进行建模，以生成与训练数据中匹配的新图像。它们基于递归神经网络的思想。


    ## 马尔可夫链


    被称为 `Markov chains` 的生成模型忽略之前的状态，仅根据当前状态预测未来状态。在文本生成中，它们经常被用于根据正在使用的单词预测短语中的下一个单词。


    ## 归一化流


    这些生成模型通过将基础的、易于采样的概率分布（如 `Gaussian distribution`）转换为更复杂的分布来描述现实世界的数据。


    `normalising flows` 的主要目标是对基础分布应用一系列可逆变换，以产生一种接近目标数据分布的分布。


    ## 4.2 生成式模型与判别式模型


    在机器学习中，了解生成模型和判别模型之间的区别至关重要。生成模型（如 `Generative Adversarial Networks (GANs)`）专注于创建新数据。而判别模型（如
    `Support Vector Machines (SVMs)` 和 `Logistic Regression`）则学习区分类别。


    ### 生成模型


    被称为“生成式 AI”的人工智能（AI）子领域致力于制作原创内容，如散文、音乐和图形。生成模型是一种寻求理解底层分布和模式的机器学习模型。在从数据中学习后，它可以产生与原始数据相似的新实例。这被称为
    AI 训练。


    ### 判别模型


    条件模型（也称为判别模型）是另一种具有多种应用的机器学习模型。分类问题是判别式 AI 的典型说明。一个常见的例子可能是垃圾邮件过滤器。邮件被分类为垃圾邮件与否取决于邮件结构、发送者信息和所使用的关键词等因素。判别式
    AI 通过独特的机制运行，主要涉及所使用的算法和训练过程。首先，使用标记数据来训练这些模型。分配给每个数据点的特定类别标识指示了它们各自的类别。


    ## 3. 比较总结


    下表简要总结了生成模型和判别模型之间的主要区别和相似之处。它概述了它们的每个方面：


    | 方面 | 生成模型 | 判别式模型 |

    | :--- | :--- | :--- |

    | **目标** | 学习数据的联合概率分布 | 学习给定数据的目标的条件概率 |

    | **重点** | 生成新的数据样本 | 基于数据进行预测/分类 |

    | **训练方法** | 通常是无监督学习 | 通常是监督学习 |

    | **应用用例** | 图像生成、文本生成、数据增强 | 分类、回归、序列标注 |

    | **关键算法** | `VAEs`, `GANs` | `CNNs`, `RNNs`, `SVMs` |


