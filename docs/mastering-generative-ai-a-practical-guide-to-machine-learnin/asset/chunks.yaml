    # 第 2 章：机器学习基础


    ## 学习目标


    本章涵盖了机器学习的基础、不同类型、算法和数据预处理技术。它还讨论了模型评估策略，为理解机器学习如何驱动生成式 AI 奠定了坚实的基础。


    ## 2.1 什么是机器学习？


    机器学习是人工智能的一个分支领域，允许算法识别数据集中的隐藏模式。它们能够在不需要显式任务编程的情况下预测新的、相似的数据。机器学习的应用存在于许多不同领域，包括欺诈检测、投资组合优化、推荐系统、自然语言处理、图像和音频识别以及任务自动化。


    机器学习的影响延伸到机器人、无人机和自动驾驶汽车，提高了它们适应变化环境的能力。这种方法与数据挖掘和数据科学密切相关，是一种从数据中学习的突破。


    ### 1. 机器学习的需求


    机器学习的意义在于它能够在不需要显式编程的情况下，通过从数据中来提高性能。对于涉及大量数据、复杂决策和动态环境的任务，机器学习特别有用。


    以下是机器学习应用的一些特定领域：


    ### a) 预测建模：企业通过机器学习创建预测模型来改进决策。例如，机器学习可以预测哪些消费者最可能购买特定产品，或哪些患者容易患特定疾病。


    ### b) 自然语言处理：使用机器学习创建可以理解和解释人类语言的系统。这对聊天机器人、语音识别和语言翻译等应用至关重要。


    ### c) 计算机视觉：使用机器学习创建识别和理解照片及视频的系统。对于医学成像、监控系统和自动驾驶汽车等应用这至关重要。


    ### d) 欺诈检测：利用机器学习检测网络广告、金融交易和其他领域中的欺诈活动。


    ### e) 推荐系统：利用机器学习开发根据用户先行为和偏好提供建议的推荐系统。


    总体而言，机器学习已成为许多公司和行业的关键工具，使其能够更有效地利用数据、增强决策流程并提供更个性化的消费者体验。


    ### 2. 机器学习算法的工作原理


    机器学习算法并非为每个任务显式编码，而是从数据中学习模式和关联以产生预测或决策。以下是常见机器学习算法工作原理的简述：


    ### a) 数据收集


    首先收集或筛选相关信息。这些信息可能包括文本、照片、数值数据或其他与工作相关的特征、属性或示例。


    ### b) 数据预处理


    在进入算法之前，通常需要对数据进行预处理。此阶段可能包括将数据分为训练集和测试集、清洗数据（处理缺失值、离群值）以及转换数据（归一化、缩放）。


    ### c) 选择模型


