- raw: 'This chapter introduces Generative AI, tracing its evolution and differentiating
    it from Discriminative AI. It explores various applications, ethical considerations,
    and provides a concise overview of AI fundamentals. Readers will gain a foundational
    understanding of Generative AI''s significance and role in modern technology.


    ## 1.1                 What is Generative AI?


    Generative artificial intelligence, or GenAI, is a technology that lets user create
    new content—text, photographs, videos, sounds, code, 3D designs, and more—by responding
    to a range of signals. It is taught and "learns" using existing online materials
    and artefacts.


    As generative AI continues to learn from additional data, it develops. Large unlabelled
    data sets are used to train AI models and algorithms, which are created using
    sophisticated mathematics and a lot of processing power. These datasets teach
    the AI to forecast results in a manner similar to what people would do or produce
    on their own.


    The proliferation of generative AI may be attributed in large part to the fact
    that individuals can now prompt AI using natural language, expanding its range
    of applications. AI generators are now being utilised as a writing, research,
    coding, design, and other companion tool across several sectors.


    1.  Types of Generative AI


    There are many distinct kinds of generative AI, each with special traits and uses.
    The three main categories into which these models fall are as follows:


    a)     Transformer-Based Models: Transformer-based models like GPT-3 and GPT-4
    have proved crucial for text generation. They are able to create very coherent
    and contextually relevant language because of their design, which takes into account
    the input text''s whole context.


    b)    Generative Adversarial Networks (GANs):  A discriminator and a generator
    are the two components that make up a GAN. New data instances are produced by
    the generator, and their authenticity is assessed by the discriminator. In essence,
    the two components play a game in which the discriminator tries to improve at
    identifying the phoney data while the generator tries to produce data that the
    discriminator cannot tell apart from the genuine data. The generator gains proficiency
    in producing very lifelike data instances over time.


    c)     Variational Autoencoders (VAEs) : Another kind of generative model that
    makes use of statistical inference concepts is the VAE. To create new data, they
    first encode input data into a latent space, which is a compressed representation
    of the data, and then they decode this latent representation. Incorporating a
    randomness element into the encoding process enables VAEs to produce data instances
    that are both varied and comparable.


    There are additional models, but transformer-based models, VAEs, and GANs are
    some of the most widely used generative AI models at the moment. Normalising flow
    models, which use a sequence of transformations to explain complicated data distributions,
    and autoregressive models, which forecast future data points based on past ones,
    are two deserving of attention.


    2.  Technologies and Concepts Powering Generative AI


    The operation of generative AI tools is made possible by a number of basic concepts
    and technologies:


    a)       Neural Networks and Deep Learning


    These are the fundamental components of generative artificial intelligence. Machines
    can identify patterns and correlations in data thanks to neural networks, which
    mimic how the human brain processes information.


    Neural networks with many layers that are capable of learning hierarchical representations
    are used in deep learning. This makes it possible to create intricate and subtle
    information using a variety of data formats, including text, images, and sound.


    b)       Transformers


    Transformers are sophisticated models that aid in comprehending human language
    context. This is referred to as natural language processing.


    The developments in transformers, which allow these AI tools to quickly produce
