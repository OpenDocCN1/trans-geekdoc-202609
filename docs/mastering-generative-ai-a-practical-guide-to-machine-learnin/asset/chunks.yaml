    ### e) 数据增强

    在此阶段，数据科学家通过在数据上利用各种特征工程库来实现预期的转换。最终的应该应该是一个结构化的数据集合，该集合能够在必要的计算量与训练新模型所需的时间之间达到最佳平衡。


    ### f) 数据验证

    数据现在被分为两组。第一组用于训练深度学习或机器学习模型。第二组数据是评估数据，用于评判最终模型的稳健性和准确性。第二个阶段有助于识别应用于数据特征工程和清洗时所采用的假设可能存在的任何问题。如果数据科学家对结果感到满意，可以将预处理任务分配给数据工程师，由其决定如何进行适用于生产环境的缩放（scale）。如果不满意，数据科学家可以选择撤销其对特征工程和数据清洗阶段的实现构型。


    ## 2. 数据预处理技术


    数据清洗和特征工程是预处理的两种主要类型。每种类型都有系列方法，下文将进行介绍：


    #### a) 数据清洗

    以下是一些清理杂乱数据方法：


    1. **识别并分类缺失数据**：由于多种原因，数据集合中可能会缺失某些个人数据字段。数据科学家必须决定是忽略、拒绝具有缺失字段的数据，还是用可能的值对其进行填充。例如，在跟踪温度的物联网应用中，添加前一条数据和后一条数据之间缺失的平均温度可能是允许的。

    2. **减少噪声数据**：分析模型或 AI 模型可能会受到真实数据中存在噪声的扭真。例如，一个通常记录温度为 75 华氏度的传感器可能会显示温度为 250
    华氏度。可以使用多种统计技术（包括聚类、回归和分箱（binning））来减少噪声。

    3. **识别并删除重复项**：算法必须决定两个看似相同的记录确实是两个独立的事件，还是对同一个测量值进行了两次测量。有时，由于字段报告不准确，记录可能会存在细微差异。在其他情况下，看起来是重复的文档实际上可能是不同的，例如当父子同名并住在同一个家里，但需要被列为不同的人时。这些问题可以通过重复检测、删除或合并技术进行自动解决。


    #### b) 特征工程

    特征工程是指数据科学家用于排列数据的方法，以便于训练数据模型并从中得出结论。这些方法包括以下内容：


    1. **特征缩放或归一化**：不同变量变化的尺度通常不同，或者一个变量可能线性增长，而另一个变量可能呈指数级变化。例如，年龄以双数字表示，但工资可能以千元美元为单位表示。缩放有助于转换数据，以便计算机更容易识别变量之间的显着相关性。

    2. **数据压缩**：为了开发新的 AI 或分析模型，数据科学家通常需要整合来自多个源的数据。如果某些变量与特定结果没有相关，那么排除某些变量可能是安全的。在预测贷款还款概率的模型中，其他变量可能有意义，但仅体现在它们之间的联系上。例如，债贷比可以合并为一个单一变量。为了减少训练数据集的维度并创建更有效的表示，如主成分分析（PCA）等方法是至关重要的。

    3. **离散化**：原始数字通常被很有帮助地分组到不同的区间。例如，可以识别出五种收入水平，每种水平都会反映某种类型贷款的常见申请人。通过这样做，可以减少对模型进行推理或训练时的额外开销。

    4. **特征编码**：从非结构化数据构建结构化格式是特征工程的另一个方面。非结构化数据的格式可能包括音频、视频和文本。例如，使用 `Word2vec` 等数据转换方法将单词转换为数值向量，通常是开发自然语言处理系统的第一步。这使得系统识别面部特征变得简单。

