    虽然有许多生成式 AI 工具可以免费使用，但越来越多的工具开始对访问权限或高级功能收取费用。这为那些无法负担访问费的个人制造了障碍。尽管如此，生成式 AI
    工具也可以作为无障碍辅助辅助。例如，Maggie Melo 讨论了 `ChatGPT` 是辅助注意力缺陷多动障碍（ADHD）教师和学生的有用工具。


    ## 3. 创作性与学术诚信


    大学经历能够增强知识和技能，确保个人在获得学位后，为就业或深造做做好充分准备。使用生成式 AI 生成内容而不对其进行进一步的阐述、修改或深度互动，将导致提交的作品不属于个人本人，并表明了个人知识和技能发展的缺失。


    利用生成式 AI 工具生成或修改作业，并随后将其作品作为原创作品提交，被认为是不诚行为。这类似于要求他人代为自己完成任务。在使用生成式 AI 时，必须说明所使用的特定工具及其使用方式。此外，如果意图发布包含
    AI 生成内容的作品，建议审阅出版商关于许可范围的指南。


    ## 4. 版权


    生成式 AI 工具的创建和应用涉及许多版权问题。为 AI 工具收集训练数据、包含版权保护材料，以及从权利者处获得许可或授权的必要性，都是需要考虑的重要因素。将受版权保护的作品的大部分作为输入，或作为
    AI 工具输出的特定形式，可能会带来版权后果。


    尽管目前各国似乎尚未为 AI 生成输出的版权保护提供法律基础，但这些输出可能会违反其他版权，生成式 AI 工具的开发者和用户都可能对此类侵权行为承担责任。


    ## 5. 权利管理


    生成式 AI 的出现为权利管理带来了复杂的困难。技术的飞速发展使得监管活动需要时间来适应并反映这些进展。该问题的一个例子涉及艺术家和作家，他们的内容被用于训练生成式
    AI。


    内容贡献的影响代表了权利管理的一个关键方面，个人在使用生成式 AI 工具之前应该理解这一点。通过提示词（prompts）或上传向 AI 平台提交内容可能会赋予
    AI 工具重复和分发该内容的权利，从而可能导致版权或隐私侵犯。向 AI 平台提交内容时应谨慎，特别是那些并非由个人原创的信息或数据。


    ## 6. 隐私与数据安全


    利用个人数据的生成模型存在隐私忧虑，因为它们有潜力创建与真实个人高度相似的合成画像。这可能导致对用户隐私的侵害和法律后果，包括违反《通用数据保护条例》（`GDPR`）等数据保护法。


    训练期间的数据匿名化以及实施强的数据安全措施（包括加密）对于保护用户数据至关重要。通过遵循 `GDPR` 的数据最小化要求等指南，也可以减少隐私泄露的风险。


    ## 7. 偏见与歧视


    生成模型可能会延续训练数据集中存在的偏见，从而导致不公正的歧视。带有偏见的人脸识别软件可能会误识别个人，导致法律纠纷和声誉损害。


    最近的一个案例涉及 Google 的 `Gemini`，它在用户发现其生成的图像在历史上是不准确的后遭到了反弹。这些图像包括女性教皇、黑人维京人，以及一位穿着二战德国士兵装服的亚洲女性。


    为了解决这个问题，优先考虑训练数据集的多样性至关重要。此外，定期进行审计以检测并纠正任何无意的偏见也是重要的。与专注于偏见评估和审计的组织合作可以增强生成式
    AI 系统的公平性。


    ## 8. 准确性


    公司保留有关用于训练生成式 AI 模型的数据信息是常见现象。生成式 AI 无法告知用户创建特定内容所使用的数据，也无法提供准确的引用或生成可靠的参考文献。因此，生成式
    AI 生成的材料作为信息来源缺乏公力和可靠性。


    AI 模型偶尔会产生不准确、偏见或过时的信息。在某些情况下，生成式 AI 可能会产生错误的答案，这种现象被称为“幻觉”。例如，`ChatGPT` 有时会虚构引用。为了防止虚假信息的使用，在将其纳入任何工作之前，必须确认内容的正确。


    ## 1.5 什么是判别式 AI？


    判别式 AI 的目标是从训练数据中学习，并区分不同的类别，以便选择最佳选项或类别。由于判别式 AI 模型被学会区分不同类型的数据，它们在这一方面优于生成式
    AI 模型。


    这些模型旨在发现标签或类别变量与其输入之间的联系。使用逻辑回归（`logistic regression`）和支持向量机（SVM`）等方法的各种平台和应用是
    AI 模型常见的用例。


    ### 1. 判别式 AI 的特征


    以下是判别式 AI 的主要特征：


    1. **分类准确性**：在对数据进行预定义分类时，在准确性和效率方面优于其他模型。

    2. **模式识别**：对输入数据的结构和特征进行描述和区分。

    3. **预测能力**：预测能力可以使用训练中学到的模型来预测未来未知数据集的特征。

    4. **效率**：训练模型有时比生成式模型效率更高。

    5. **应用多样性**：在情感分析、欺诈检测、诊断和垃圾邮件过滤等尖端领域非常流行。


