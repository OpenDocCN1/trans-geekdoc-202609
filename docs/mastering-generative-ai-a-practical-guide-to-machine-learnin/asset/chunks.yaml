  trans: '


    对 AI 的日益依赖使得技能组的必须发生转变。传统的职业角色正在演变，要求专业人员掌握新的能力。批判性思维、解决问题能力、AI 素养和数据分析正成为现代劳动力中不可或少的技能。那些提升技能并适应这些变化的员工将在各自领域继续保持价值。


    ### c) 混合角色的兴起

    AI 并非完全取代人类工人，而是在培养专业人士与 AI 工具协作的混合型角色。例如，记者使用 AI 生成的草稿来增强写作，金融分析师使用 AI 检测趋势，教育工作者使用
    AI 提供个性化的学习体验。这些混合型角色要求个人理解 AI 的能力和局限性，同时运用人类的专业知识来增强成果。


    ### d) 创业机会

    生成式 AI 正在降低创业的门槛。小型企业和独立专业人士可以利用 AI 进行营销、内容创作、客户支持和自动化，使他们能够与大型企业竞争。AI 驱动行业中的许多初创公司，为各个领域提供创新解决方案。


    ## 8.7 对 AI 的依赖

    对 AI 的日益依赖在医疗保健、金融、教育和娱乐等领域显而易见。虽然 AI 提供了许多益处，但对其过度依赖既带来了机遇也带来了风险。


    ### 1. 依赖 AI 的益处

    AI 的优势是不可否认的，它提升了各个领域的效率、准确性和可访问性。企业和个人都依赖 AI 驱动的技术来简化任务、分析海量数据并做出明智决策。以下是一些关键益处：


    #### a) 提高效率和生产力

    AI 驱动的自动化通过惊人的速度和准确性处理重复性和耗时的任务，彻底改变了行业。在制造业中，AI 驱动的机器人高效地组装产品，降低了生产成本和人为错误。同样，AI
    算法简化了业务运营，优化了供应链、客户服务和物流。


    #### b) 改进决策

    AI 处理和分析大型数据集的能力使组织能够精确做出数据驱动的决策。在金融市场中，AI 驱动交易算法在毫秒内评估风险并执行交易，导致更科学的投资策略。在医疗保健领域，AI
    协助诊断疾病、预测患者结果并推荐个性化的治疗方案。


    #### c) 增强个性化

    AI 通过在电子商务、娱乐和社交媒体中提供个性化推荐，显著改善了用户体验。流平台使用 AI 根据观看历史建议内容，而在线零售商则根据个人偏好推荐产品。这种程度的定制增强了客户的满意度和参与度。


    #### d) 更好的可访问性与包容性

    AI 驱动的技术改善了残障人士的可访问性。语音识别软件、语音转文本应用程序和 AI 驱动的助手为视觉或运动障碍的人士提供了更大的独立性。AI 还促进了语言翻译，弥合了不同语言背景的人们之间的交流鸿沟。


    ### 2. 依赖 AI 的风险

    虽然 AI 提供了许多益处，但过度依赖可能会带来重大风险。在缺乏充分人工监督的情况下依赖 AI 可能导致伦理困境、职位流失、安全担忧以及人类认知能力的下降。


    #### a) 职位流失和经济影响

    AI 驱动的自动化导致了各行业的职位流失，特别是制造业、客户服务和运输业。随着机器在重复性和常规任务中取代人类工人，对失业和经济不平等的担忧日益增加。虽然
    AI 在技术驱动的领域创造了新的就业机会，但对劳动力进行再培训和适应不断变化的职业角色的需求正在增长。


    #### b) 伦理和偏见担忧

    AI 算法基于历史数据进行训练，而这些数据可能包含固有的偏见。如果不仔细监控，AI 系统可能会在招聘实践、执法和金融服务中强化并延续歧视。算法偏见已成为日益关注的问题，因为它可能导致基于种族、性别或社会经济地位对某些群体产生不公正对待。


    #### c) 人类技能和批判性思维的丧失

    过度依赖 AI 进行决策可能导致人类认知能力的下降。当个人依赖 AI 解决问题和检索信息时，他们的批判性思维和分析推理能力可能会降低。这种趋势在教育领域尤为令人担忧，学生依赖
    AI 驱动的工具而不是培养独立的解决问题能力。


    #### d) 安全和隐私风险

    AI 驱动的技术容易受到网络威胁和数据泄露的影响。黑客可以利用 AI 系统操纵信息、传播虚假信息或获取敏感数据的未经访问。AI 在监控中日益增加引发了对隐私的担忧，因为政府和公司收集了大量的个人数据，可能导致滥用或不合伦的监控行为。


    ## 8.8 环境关注

    生成式 AI 的能力也引发了显著的环境关注。随着对 AI 模型依赖的增加（特别是大规模使用），伴随着巨大的能量消耗、碳排放和电子垃圾。这些环境问题需要引起关注，以确保技术进步不会以生态可持续性为代价。


    ### 1. 能量消耗和碳足迹

    与生成式 AI 相关的最紧迫的环境关注之一是其高能耗。训练和运行大型 AI 模型（例如 OpenAI 的 `GPT` 系列或 Google 的 `DeepMind`
    项目）需要巨大的计算能力。这些模型使用高性能数据中心进行训练，这些中心消耗大量的电力，通常依赖于化石燃料的能源。


    一个复杂的 AI 模型单次训练运行使用的能量可能相当于数百家庭一年的消耗。研究估计，训练一个大型神经网络产生的碳排放相当于多次长途飞行。随着 AI 采用的增长，其对环境的影响随之增加，加剧了全球气候挑战。


    ### 2. 数据中心和用水量

    AI 驱动的数据中心需要广泛的冷却机制来维持最佳性能。这一冷却过程涉及大量的用水，增加了另一层环境担忧。许多 AI 数据中心位于已面临水资源短缺的地区，加剧了现有的资源挑战。随着对
    AI 服务的需求增加，水供应面临压力也增大，引发了关于技术进步与自然资源保护之间权衡的伦理问题。


    ### 3. 电子垃圾和硬件需求

    AI 处理的硬件需求是另一个环境挑战。用于 AI 训练的高性能 `GPUs`（图形处理器）和 `TPUs`（张量处理器）的生产涉及稀有金属的开采和加工。这一过程对环境也有有代价，包括栖息地破坏、土壤和水污染，以及采矿作业产生的碳排放。


