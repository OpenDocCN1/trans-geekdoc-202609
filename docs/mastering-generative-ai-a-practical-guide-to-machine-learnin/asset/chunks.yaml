- raw: 'While numerous generative AI tools remain available at no charge, an increasing
    number are introducing fees for access or for utilising premium features. This
    establishes obstacles for individuals who cannot afford access. Nonetheless, generative
    AI tools may serve as aids for accessibility. For instance, Maggie Melo discussed
    ChatGPT as a helpful tool for teachers and students with Attention-Deficit/Hyperactivity
    Disorder (ADHD).


    3.  Creatorship and Academic Integrity


    University experiences enhance knowledge and skills, ensuring that upon completing
    a degree, individuals are well-prepared for employment or additional studies.
    Employing generative AI to produce content without further elaboration, alteration,
    or significant interaction results in the presentation of work that does not belong
    to the individual, and it indicates a lack of personal knowledge and skill development.


    Utilising a generative AI tool to produce or modify an assignment and subsequently
    presenting that work as original is considered dishonest. This resembles requesting
    another individual to perform tasks on behalf of oneself. When utilising generative
    AI, it is essential to disclose the specific tool(s) employed and the manner in
    which they were used. Additionally, if there is an intention to publish work that
    includes content generated by AI, it is advisable to review the publisher''s guidelines
    regarding what is permissible.


    4.  Copyright


    Numerous copyright concerns are associated with the creation and application of
    generative AI tools. The gathering of training data for the AI tool, the inclusion
    of copyright-protected material, and the necessity of obtaining permission or
    a license from the rights holder are all significant factors to consider. The
    utilisation of significant segments of works protected by copyright as inputs
    or specific forms of outputs with AI tools could carry copyright consequences.


    Although there does not yet seem to be a legal foundation for copyright protection
    of AI-generated outputs in various nations, these outputs may violate other copyrights,
    and both generative AI tool developers and users may be held liable for such infringements.


    5.  Rights Management


    The emergence of generative AI introduces intricate difficulties regarding rights
    management. The rapid advancement of technology necessitates that regulatory activities
    take time to adapt and mirror these developments. An example of this issue involves
    artists and writers whose content has been utilised to train generative AI.


    The implications of content contributions represent a crucial aspect of rights
    management that individuals should understand prior to utilising generative AI
    tools. Submitting content to AI platforms via prompts or uploads may grant an
    AI tool the right to reuse and distribute that content, potentially leading to
    a violation of copyright or privacy. Caution is advised when submitting content,
    particularly information or data that was not originally created by the individual,
    to AI platforms.


    6.  Privacy And Data Security


    Generative models that utilise personal data present privacy concerns, as they
    have the potential to create synthetic profiles that bear a strong resemblance
    to actual individuals. This may result in infringements of user privacy and legal
    repercussions, including breaches of data protection laws such as General Data
    Protection Regulation (GDPR).


    Data anonymisation during training and the implementation of strong data security
    measures, including encryption, are crucial for protecting user data. The danger
    of privacy breaches may also be reduced by following guidelines like the GDPR''s
    data minimisation requirements.


    7.  Bias And Discrimination


    Generative models have the potential to perpetuate biases that exist in the datasets
    used for training, resulting in unjust discrimination. Biassed facial recognition
    software has the potential to misidentify individuals, leading to legal complications
    and harm to reputations.


    A recent instance involves Google’s Gemini, which encountered backlash after users
    found that it was generating images that were historically inaccurate. These included
    images of a female Pope, Black Vikings, and an Asian lady dressed in a German
    soldier outfit from World War II.


    To address this issue, prioritising diversity in training datasets is essential.
    Additionally, it is important to perform regular audits to detect and correct
    any unintended biases. Collaborating with organisations that focus on bias assessments
    and audits can enhance the fairness of generative AI systems.


    8.  Accuracy


    It is common for companies to withhold information regarding the data utilised
    for training a generative AI model. Generative AI is unable to inform a user about
    the data utilised to create specific content, nor can it provide accurate citations
    or generate a dependable bibliography. As a result, material produced by generative
    AI lacks credibility and reliability as a source of information.


    AI models can occasionally generate inaccurate, biassed, or obsolete information.
    In certain instances, a generative AI tool may indicate that it cannot deliver
    an accurate response, while in other situations, it might produce an incorrect
    answer that seems to be valid. This phenomenon is referred to as a “hallucination.”
    For instance, ChatGPT sometimes creates fake citations to unidentified sources.
    To prevent the use or dissemination of false information, it is essential to confirm
    the correctness of content produced by AI through trustworthy sources prior to
    incorporating it into any work.


    ## 1.5                 What Is Discriminative AI?


    The goal of discriminative AI is to learn from training data and how sample data
    distinguishes between different classes in order to choose the best option or
    the appropriate class for the input data. Since discriminative AI models are taught
    to distinguish between various types of data, they perform better than generative
    AI models in this regard.


    These models aim to discover the connection between labels or categorical variables
    and their inputs. Natural language processing, image and speech recognition, and
    predictive analytics across a variety of platforms and applications using methods
    like logistic regression and support vector machines (SVM) are some of the most
    common use cases for AI models.


    1.  Features of Discriminative AI


    These are the main features of discriminative AI:


    1.  Classification Accuracy: Performs better than others in terms of accuracy
    and efficiency when it comes to classifying data into predefined categories.


    2.  Pattern Recognition: The input data set''s structures and features are described
    and differentiated.


    3.  Predictive Power: Predictive power can use learnt models in training to forecast
    the features of future incoming unknown data sets.


    4.  Efficiency:  Training models can occasionally be more efficient than generative
    models.


    5.  Application Versatility:  In cutting-edge domains like sentiment analysis,
    fraud detection, diagnostics, and spam filtering, it is prevalent.


    2.  Uses of Discriminative AI


    In many different sectors, discriminative AI is essential for pattern detection
    and classification:


    1.  Image Recognition: Distinguishing between various species in wildlife photography,
    for example, occurs through the identification of objects in photographs.


    2.  Speech Recognition: The process of converting spoken language into text involves
    the classification of sound patterns.


    3.  Natural Language Processing (NLP): Utilised in the development of chatbot
    responses, sentiment analysis, and spam detection.


    4.  Healthcare: The classification of medical images or laboratory results to
    aid in the diagnosis of diseases.


    5.  Finance: Making the distinction between authentic and fraudulent transactions
    improves fraud detection.


    6.  Retail & Marketing: Enhancing personalised recommendations by examining consumer
    preferences.'
