  trans: '

    确保生成式 AI 的安全至关重要，因为这些模型可能被各种滥用，导致伦理、社会和经济损害。一个紧迫的问题是生成误导性或有害的内容。例如，AI 深度伪造（deepfakes）可用于操纵舆论、传播虚假信息或诽谤个人。恶意行为者利用
    AI 创建了具信力的虚假新闻、冒充真人，甚至实现了网络诈骗自动化。


    偏见和歧视也是主要的安全担忧。AI 模型从历史数据中学习，这些数据可能反映了社会偏见。如果不加仔细管理，这些偏见可能会出现在 AI 生成的内容中，强化招聘、贷款和法律执法等领域的刻板印象和不公平待遇。


    AI 安全的另一个关键方面涉及幻觉（hallucinations）——生成式 AI 产生错误或无意义信息的情况。与传统软件不同，AI 模型并不“知道”事实，而是根据训练数据中的模式生成概率性输出。这可能导致
    AI 自信满满地呈现虚假信息，给医疗、法律和科学研究等领域带来风险。


    为了降低这些风险，AI 开发者必须实施严格的测试、伦理 AI 原则以及模型开发中的透明度。负责任的 AI 框架应包含内容审核、实时监控和用户反馈机制，以防止有害或误导性内容的传播。


    ## 3. 生成式 AI 中的安全风险


    生成式 AI 中的安全威胁已超出了数据隐私和安全，涵盖了可被网络犯罪分子和对手利用的漏洞。主要担忧之一是对抗攻击（adversarial attacks），攻击者通过操纵输入数据来欺骗
    AI 模型生成非预期或有害的输出。这些攻击可用于绕过内容过滤器、更改 AI 生成的推荐，或利用自动化决策系统中的安全漏洞。


    钓鱼攻击和自动化诈骗也受益于 AI 生成的内容。网络犯罪分子可以使用 AI 创建极具说服力的电子邮件、语音录制和短信，使钓鱼诈骗更难检测。随着 AI 生成冒充的兴起，企业和个人面临着更大的欺诈、身份盗窃和金融犯罪风险。


    此外，生成式 AI 在银行、医疗和网络安全等关键基础设施中的整合整合，引发了对其抗攻击尝试稳健性的担忧。如果恶意行为者获取了 AI 驱动系统的访问权限，他们可能会操纵金融交易、篡改医疗诊断或中断基本服务。


    为了增强 AI 安全，组织必须优先考虑稳健的网络安全措施，包括加密数据存储、安全的 API 访问和定期的安全审计。AI 开发者还应该实施对抗训练——在开发期间让
    AI 模型接触潜在攻击的技术，以提高其对现实威胁的韧性。


    ## 8.6 生成式 AI 对工作和行业的影响


    AI 为企业和专业人士提供了许多机会；但也引发了对工作流失和技能需求演变的担忧。理解生成式 AI 对工作和行业的影响，对于努力适应这一技术革命的个人和组织至关重要。


    ### 1. 生成式 AI 正在改变行业


    生成式 AI 已经深入到各个行业，提高了效率、降低了成本并实现了创新。受影响最大的一些部门包括：


    ### a) 媒体和内容创作


    AI 驱动工具（如 `ChatGPT`、`DALL-E` 和 `Midjourney`）的兴起彻底改变内容生成的方式。作家、平面设计师和视频剪辑师现在有了
    AI 驱动的助手，帮助简化他们的创作流程。自动化内容创建允许企业快速扩大营销规模，在极短时间内制作博客、广告和社交媒体帖子。


    然而，这种进步也对传统的创意角色带来了挑战。虽然 AI 可以以惊人的速度生成文本、图像和视频，但人类的监督对于确保原创性、质量和伦理考虑仍然至关重要。AI
    并不是取代创意专业人士，而是将其角色转向更具战略性和编辑的功能。


    ### b) 软件开发与 IT


    生成式 AI 正在彻底改变 IT 领域，特别是编码和软件开发。AI 驱动的工具可以生成代码、调试软件并协助项目管理，显著缩短了开发时间。`GitHub Copilot`
    和 `OpenAI Codex` 等平台让程序员能够自动化重复的编码任务，专注于复杂的问题的解决。


    尽管有了这些进步，AI 不可能完全取代软件工程师。相反，它正在成为一种增强生产力的必备助手。拥抱 AI 工具的开发者将具有竞争优势，因为他们可以将常规编码委托给
    AI，同时专注于创新和系统架构。


    ### c) 客服与聊天机器人


    随着 AI 驱动的聊天机器人和虚拟助手的采用，客服发生了巨大变化。这些工具对客户查询提供即响应，缩短了等待时间并提升了用户体验。公司利用 AI 处理常规查询，释放人工代理来处理复杂或敏感的问题。


    虽然 AI 驱动的自动化减少了对基层客服岗位的需求，但它也为 AI 训练、机器人管理客户体验设计创造了新机会。该领域的专业人士将需要获得 AI 整合和人机协作的技能。


    ### d) 医疗与制药


    医疗行业受益于生成式 AI 在诊断、药物发现和患者护理方面的应用。AI 模型可以分析医学图像、预测疾病，甚至辅助开发新药。药公司利用 AI 加快新疗法上市的时间。


    尽管有这些创新，人类的专业知识仍然不可缺。医生、研究人员和医疗专业人士与 AI 工作，利用其见解，同时根据 AI 缺乏的伦理、情感和背景因素做出决策。


    ### e) 制造业与自动化


    制造业一直处于自动化的沿，生成式 AI 进一步优化了生产线、供应链管理和质量控制。AI 驱动的机器人正在处理复杂的组装任务，预测性维护正在减少停机时间，而
    AI 生成的设计提高了产品效率。


    虽然一些体力工作可能会减少，但 AI 也为工程师、机器人专家和 AI 系统集成器创造了需求。精通 AI 驱动技术的工人将在维护和编程自动化系统方面发现新机会。


    ## 2. 对工作的影响


    生成式 AI 整合行业不可避免地以积极和挑战性的方式影响劳动力市场。各种影响包括：


    ### a) 工作流失 vs. 机会创造


    AI 应用最受争议的方面之一是替代人类工作的潜力。虽然一些常规和重复性任务正在被自动化，但 AI 也在创造需要人类干预的新角色。随着企业寻求负责任地优化 AI
    使用，AI 伦理、提示词工程、AI 模型训练和系统监控等职位正在出现。


    ### b) 技能需求的转变


