  trans: '


    根据分类、回归和聚类任务选择适用于任务的机器学习模型。示例包括决策树、神经网络、支持向量机以及深度学习框架等更复杂的模型。


    ### d) 训练模型

    使用训练数据来训练所选模型。程序在训练过程中发现数据中的关联和模式。这涉及到反复修改模型的参数，以减少训练数据的实际输出（`labels` 或 `targets`）与预测输出之间的差异。


    ### e) 评估模型

    训练完成后，使用测试数据对模型性能进行评估。使用均方误差、召回率、准确率和精确率等指标来评估模型对新的、未测试数据的泛化有效性。


    ### f) 模型微调

    为了增强性能，可以通过修改超参数来调整模型，超参数是在训练过程中不直接学习的因素，例如学习率或神经网络中隐藏层的数量。


    ### g) 预测或推理

    最后，根据训练好的模型对新数据进行预测或判断。在此过程中，将学到的模式应用于新输入以产生输出结果，例如回归任务的数值结果或分类任务的类别标签。


    # 3. 机器学习生命周期


    ![`miro.medium.com/v2/resize:fit:500/0\*riH9z2sLjb4eAQcf.png`](img/Image00002.jpg)

    图 2.1：机器学习生命周期。1


    机器学习生命周期涉及的主要步骤概述如下：


    ### a) 数据获取

    数据是机器学习生命周期中的关键元素，但必须获取合适的数据来解决特定问题。收集数据并不需要数据科学家来完成。一个对各种免费可用数据集之间的实际差异有先验知识，并能够对组织的投资策略做出影响性决策的人，将最胜任数据科学家这一角色。


    ### b) 数据准备

    这项任务可以被认为是该循环中最耗力且最耗时的任务，因为需要识别许多数据质量问题。通常，在获取数据后，由于存在错误条目、不性和语义错误，无法对其进行分析。为了利用这类数据，数据科学家会通过在电子表格中编辑或编写脚本手动对数据进行重新格式化和清洗。数据整理（Data
    wrangling）阶段或数据清洗（Data cleansing）步骤是数据准备过程的额外名称。


    ### c) 假设与建模

    这是任何数据科学项目的基础阶段，涉及创建、执行和改进程序以分析数据并提取有价值的业务见解。可以使用 `Python`、`R`、`MATLAB` 或 `Perl`
    等语言开发程序。在此阶段，数据被用于训练不同的机器学习算法，并选择产生性能最佳的算法。


    ### d) 评估与解释

    在数据上完成模型训练后，会对最终结果进行评估，以确定其在实际场景中的性能和可靠性。每个性能指标都拥有一套独特的评估标准。例如，当目标是让机器学习模型预测每日股票时，强烈建议在评估时考虑
    `RMSE`（均方根误差）。或者，在对垃圾邮件分类时，会考虑平均准确率、`AUC` 和 `log loss` 等性能指标。


    ### e) 部署

    部署指的是应用模型并利用新数据生成预测结果。创建模型通常不是项目的终点。虽然模型旨在增强对数据的理解，但获得的见解必须以结构化的方式展示出来，以便客户易于使用。部署阶段的范围可以从简单的生成报告到复杂的根据特定需求实现可复制的数据科学流程不等。


    ### f) 运维

    创建一个计划，用于在长期监督和维护数据科学项目。在此阶段，将监控模型性能的升级和下降情况。数据科学家利用特定的数据科学项目来促进共享学习，并增强未来类似数据科学项目的执行。


    ### g) 优化

    每个数据科学尝试的最后阶段是优化。当添加新的数据源或采取必要的措施以改进机器学习模型的性能时，会在环境中重新训练模型。


    ## 2.2 机器学习的类型


    存在许多类型的机器学习技术，每种都有独特的特性和应用。日常生活中常用的几种机器学习算法类型包括：


    ![`zd-brightspot.s3.us-east-1.amazonaws.com/wp-content/uploads/2022/04/04094802/4-12-1-e1715637495321.png`](img/Image00003.jpg)

    图 2.2：机器学习的类型。2


    ### 1. 监督学习

    机器学习算法最重要的类别之一是监督学习，算法在标记数据上进行训练。这意味着提供给算法的数据中包含了已知有效输出的输入-输出对。算法通过识别输入与输出之间的相关性和模式从这些数据中获取知识。模型一旦完成训练，可以使用其所学到的知识对新的、未知的数据预测结果。


    #### a) 监督学习示例

    出现一种情况：需要开发一个对各种水果进行分类的模型。过程始于为算法提供一组描绘各种水果的图像，每张图像都标记了标签以指示其展示的特定水果类型，包括苹果、香蕉和橘子。算法获得了识别区分水果特征的能力，例如形状、颜色和大小。当以后输入一个算法以前从未遇到的新水果图像时，它将利用学到的模式判断该水果是苹果、香蕉还是橘子。这个过程解释了监督学习的工作原理。


    ![C:\Users\AGPH\Desktop\Screenshot_1.png](img/Image00004.jpg)

    图 2.3：监督学习。3


    #### b) 监督学习的类型

    监督学习算法可分为两大类：分类学习和回归学习。


    #####1. 分类学习

    分类学习的目标是将数据划分到不同的类别或组，它是监督学习的一种。使用标记数据集来训练算法，该数据集中的每个数据点都与一个预定义的类别相关联。例如，在垃圾邮件过滤器中，算法根据主题行、发送者和内容等属性擅长将电子邮件分类为“垃圾邮件”或“非垃圾邮件”。


    以下是一些典型的分类学习算法：


    *   `逻辑回归`

    *   `支持向量机`

    *   `随机森林`

    *   `决策树`

    *   `K 近邻算法 (KNN)`

    *   `朴素贝叶斯`。


    2. 回归学习


