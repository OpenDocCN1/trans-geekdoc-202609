    architecture, as the model does not naturally handle sequential data in a specific
    order. The transformer requires a method to take into account the sequence of
    the tokens in the input. Positional encoding provides additional information to
    the embedding of each token, signifying its location within the sequence. This
    is often accomplished by adding a distinct positional signal to each token''s
    embedding using a collection of functions. The model can comprehend the sequence
    context and maintain the token order using positional encoding.


    c)       Transformer Block


    A standard transformer model consists of several transformer blocks arranged in
    a stacked formation. Every transformer block consists of two primary elements:
    "a multi-head self-attention mechanism and a position-wise feed-forward neural
    network". The self-attention mechanism allows the model to assess the significance
    of various tokens in the sequence. The emphasis is placed on pertinent sections
    of the input during the prediction process.


    For example, take into account the phrases "Do not tell lies" and "He lies." The
    meaning of the word lies in both sentences cannot be grasped without considering
    the surrounding words. The terms speak and down are crucial for grasping the accurate
    meaning. The mechanism of self-attention allows for the organisation of pertinent
    tokens to establish context.


    The feed-forward layer includes extra components that enhance the training and
    functioning efficiency of the transformer model. Each transformer block consists
    of the following components:


    1.  The connections that surround the two primary components function as shortcuts.
    The flow of information is facilitated from one part of the network to another,
    bypassing certain operations in between.


    2.  Layer normalisation maintains the values—particularly the outputs from various
    layers within the network—within a specific range to ensure smooth training of
    the model.


    3.  A linear transformation functions to adjust values in a model, enhancing its
    performance on the specific task for which it is being trained, such as document
    summarisation rather than translation.


    d)       Linear And Softmax Blocks


    The model ultimately requires making a specific prediction, like selecting the
    subsequent word in a sequence. The linear block is introduced at this point. A
    fully connected layer, often referred to as a dense layer, precedes the final
    stage. The vector space is mapped to the original input domain using a learnt
    linear mapping. This essential layer is where the decision-making component of
    the model transforms the intricate internal representations into specific predictions
    that are interpretable and usable. This layer produces a collection of scores,
    commonly referred to as logits, corresponding to each potential token.


    The softmax function serves as the concluding step that transforms the logit scores
    into a normalised probability distribution. Every component of the softmax output
    indicates the model''s level of confidence in a specific class or token.


    ## 5.4                 Diffusion Models


    The natural process of particulate dispersion from high-concentration areas to
    low-concentration areas until they are uniformly distributed is the inspiration
    for diffusion models.


    Diffusion models, which begin with data and gradually introduce noise to it, use
    a similar concept in the domain of machine learning. In order to successfully
    eliminate the noise and reconstruct the data or produce fresh, realistic copies,
    they subsequently learn to reverse this procedure. This slow conversion produces
    finely detailed and high-quality outputs that are helpful in applications like
    autonomous driving, medical imaging, and producing realistic text or graphics.


    The distinctive feature of diffusion models is their methodical refining process,
    which enables them to replicate the natural processes of diffusion and provide
    very precise and subtle outcomes.


    1.  Working of Diffusion Models


    A neural network is trained to introduce noise into data (the forward diffusion
    phase) before learning to systematically reverse this process to retrieve the
    original data or produce new samples. This is how diffusion models function. The
    following is a descriptive summary of the stages that contribute to the functioning
    of a diffusion model.


    a)       Data Preparation:


    The data must be properly prepared for training before the diffusion process begins.
    Cleaning the data to eliminate irregularities, normalising characteristics to
    preserve consistency, and supplementing the dataset to provide variety—particularly
    crucial for picture data—are some of the tasks involved in this preparation. A
    normal distribution is ensured by standardisation, which aids in the efficient
    management of noisy data. Certain changes, including correcting imbalances in
    data classes, may be necessary for different kinds of data, like text or images.
    For the model to receive high-quality input, learn important patterns, and provide
    realistic outputs while in use, the data must be properly prepared.


    b)       Forward Diffusion Process:


    A basic distribution, usually Gaussian, is used as the starting point for the
    forward diffusion process. Then, using a Markov chain, this initial sample is
    gradually changed by a series of reversible stages, each of which adds a little
    bit more complexity. In order to enable the model to learn and reproduce the complex
    patterns seen in the target data distribution, structured noise is gradually added
    when these modifications are implemented. The basic sample will be transformed
    into one that closely reflects the complexity of the intended data via this procedure.
    This method shows how starting with basic inputs may lead to outputs that are
    rich and detailed.


