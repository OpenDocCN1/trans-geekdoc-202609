- raw: 'Adding to the risks associated with training data, generative AI models may
    generate outputs that, often without alerting model users, integrate or otherwise
    differ from protected works. Then, if these outputs are employed in commercial
    activities, these users—who may be anybody from freelancers to firm employees—face
    possible consequences. The exact level of "derivedness" required for a model output
    to pose a danger to the user is still unknown and will probably only be made explicit
    by legal action or legislation. The intellectual property rights (IPRs) that may
    be applied to generative AI outputs remain unclear as well, given that they are
    not fully human-made.


    3.  Software Licencing Risks


    Software licencing risks are similar to model output hazards that occur when developers
    employ AI to produce usable code. It could be necessary for new software to appropriately
    represent the license or licenses linked to the code in the training data if a
    generative AI model that was trained on code with attached licenses is later used
    to create comparable code that is integrated into new software. For instance,
    under severe circumstances, copyleft licenses can mandate that commercial software
    be declared open source as well.


    4.  Data Leakage and Trade Secret Risks


    Depending on the product and model, generative AI models may be continuously trained
    using input data; however, once learnt, there is a chance that the data may be
    replicated for other users. This makes it difficult to protect sensitive and private
    information when using generative AI models and products. In fact, there have
    been cases where companies have banned ChatGPT after employees used private company
    information in generative AI prompts and it was later discovered that the information
    had leaked outside the company.


    5.  Inventorship Risks


    AI has already been utilised to assist in the development of new innovations in
    several domains, such as medication design. It is still uncertain how—or even
    if—AI may be portrayed as having contributed to a claimed idea since the majority
    of IP offices need a human inventor to be mentioned on a patent. This may sound
    harmless, but if a court reviews a patent and determines that it is not primarily
    the invention of the listed inventor, the patent may be declared invalid.


    ## 8.4                 Misinformation and Misuse of Generative AI


    Alongside generative AI benefits, generative AI presents significant risks, particularly
    in the spread of misinformation and its potential for misuse. As AI-generated
    content becomes increasingly indistinguishable from human-created material, concerns
    over ethical implications, security threats, and societal impact grow ever more
    pressing.


    1.  The Rise of Misinformation through Generative AI


    One of the primary concerns regarding generative AI is its role in the proliferation
    of misinformation. AI models can generate highly convincing fake news articles,
    manipulated media, and misleading narratives that can easily deceive the public.
    With the rapid spread of information on social media platforms, such content can
    gain traction quickly, influencing public opinion and shaping real-world events.


    a)       Fake News and Disinformation


    AI-generated content can be used to create false narratives that appear credible.
    Malicious actors exploit these capabilities to spread propaganda, influence elections,
    or manipulate stock markets. Unlike traditional misinformation, AI-driven disinformation
    can be mass-produced with minimal effort, making it a powerful tool for those
    with deceptive intentions.


    b)       Deepfake Technology


    Deepfake AI, which generates hyper-realistic synthetic media, has become a major
    concern. Videos and images manipulated by AI can fabricate events, create false
    testimonies, or impersonate public figures. This technology poses serious threats
    in politics, cybersecurity, and even personal privacy, as deepfake videos can
    be used to blackmail individuals or damage reputations.


    c)       Social Media Manipulation


    Social media is particularly vulnerable to AI-generated misinformation. Bots and
    AI-driven accounts can flood platforms with misleading content, amplifying divisive
    issues and fostering political and social unrest. The ability of generative AI
    to mimic writing styles and human interactions makes it difficult to distinguish
    between real users and automated accounts.


    2.  The Ethical and Legal Challenges of AI Misuse


    With generative AI''s potential for misuse, ethical and legal frameworks struggle
    to keep pace. Issues surrounding accountability, intellectual property, and privacy
    are among the key challenges facing regulators and technology companies.


    a)       Accountability and AI-Generated Content


    A critical question in AI ethics is determining responsibility for AI-generated
    misinformation. Should accountability fall on the developers, the users, or the
    platforms hosting the content? The absence of clear regulations complicates efforts
    to hold malicious actors responsible for their actions.


    b)       Copyright and Intellectual Property


    AI-generated content raises complex intellectual property concerns. Artists, writers,
    and musicians face challenges when AI creates work that closely resembles human-created
    pieces. The question of ownership—whether AI-generated works can be copyrighted
    and who holds the rights—remains unresolved in many jurisdictions.


    c)       Privacy and Security Risks


    Generative AI can be used to create convincing phishing emails, voice synthesis
    for scams, and impersonation fraud. Such activities threaten cybersecurity and
    personal privacy, as AI-generated content can deceive individuals into sharing
    sensitive information or engaging in fraudulent transactions.


    ## 8.5                 Privacy, Safety, and Security


    The rapid advancement of generative artificial intelligence has raised serious
    concerns about privacy, security, and safety. Addressing these challenges is essential
    to ensure responsible deployment of AI while protecting individuals, organisations,
    and society.


    1.  Privacy Concerns in Generative AI


    Privacy is a fundamental issue in the age of AI. Generative models often rely
    on vast datasets that include publicly available, proprietary, and sometimes sensitive
    information. These datasets may inadvertently contain personal data, raising concerns
    about how information is collected, processed, and utilised.


    One of the primary privacy risks involves data leakage. AI models, particularly
    large language models (LLMs), have been shown to memorise and reproduce training
    data, sometimes exposing sensitive personal details. If a model is trained on
    confidential medical records, financial information, or private conversations,
    it may generate outputs that reveal such data when queried in specific ways.


    Furthermore, user interactions with AI systems can themselves be a source of privacy
    risks. Chatbots and other generative AI applications often collect input data
    to improve performance. However, without robust data protection measures, this
    information could be exploited for surveillance, targeted advertising, or even
    malicious activities. Users may not always be aware of what data is being stored,
    how it is being used, or whether they have control over its deletion.


    Addressing these concerns requires stringent data protection policies, clear user
    consent mechanisms, and compliance with regulations such as the General Data Protection
    Regulation (GDPR) and India’s Digital Personal Data Protection Act (DPDPA). Organisations
    must adopt privacy-preserving techniques, including differential privacy, data
    anonymisation, and federated learning, to mitigate risks while maintaining AI’s
    capabilities.


    2.  Safety Issues with Generative AI'
