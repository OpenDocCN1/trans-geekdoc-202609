    1.  Supervised Learning


    One of the most significant categories of machine learning algorithms is supervised
    learning, in which the algorithm is trained on labelled data. This indicates that
    input-output pairs with known valid outputs are included in the data supplied
    to the algorithm. The algorithm gains knowledge from this data by identifying
    correlations and patterns between the inputs and outputs. The model may use what
    it has learnt to forecast the outcome for fresh, unknown data once it has been
    trained.


    a)       Example of Supervised Learning


    A situation arises in which there is a requirement to develop a model for categorising
    various kinds of fruits. The process begins with providing the algorithm a collection
    of images depicting various fruits, with each image tagged to indicate the specific
    type of fruit it shows, including apples, bananas, and oranges. The algorithm
    acquires the ability to identify the characteristics that set different fruits
    apart, such as shape, colour, and size. When a new image of a fruit that the algorithm
    has not encountered before is inputted later, it will utilise the learnt patterns
    to determine if the fruit is an apple, banana, or orange. This process explains
    the functioning of supervised learning.


    ![C:\\Users\\AGPH\\Desktop\\Screenshot\_1.png](Image00004.jpg)


    Figure ‎ 2.3: Supervised Learning.  [\[3\]](#text00015.html#_ftn3)


