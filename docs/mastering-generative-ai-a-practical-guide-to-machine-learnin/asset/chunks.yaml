- raw: 'Evaluating models assists in recognising and tackling problems like overfitting
    and underfitting. Overfitting happens when a model shows outstanding performance
    on the training data yet struggles to apply that knowledge to new data. Underfitting
    occurs when a model is overly simplistic and does not adequately capture the underlying
    patterns present in the data. Through the evaluation of the models, it becomes
    possible to identify and address these issues, thereby ensuring that the models
    perform effectively on data that has not been previously encountered.


    Ultimately, evaluating models represents an essential phase in the machine learning
    workflow. This enables the assessment of the performance and quality of the models,
    the understanding of their strengths and weaknesses, and the making of informed
    decisions regarding their deployment and optimisation. Through the pursuit of
    predictive accuracy and the resolution of challenges like overfitting and underfitting,
    reliable and effective machine learning models can be developed to provide accurate
    predictions on real-world data.


    3.  Concepts in Model Evaluation


    With a clear overview of the significance of model evaluation established, it
    is time to explore some key concepts that will enhance understanding of the evaluation
    process.


    a)       Overfitting and Underfitting


    A fundamental concept in model evaluation involves the tradeoff between overfitting
    and underfitting. Overfitting happens when a model becomes too familiar with the
    training data, resulting in excessive complexity and a failure to generalise to
    new instances. Conversely, underfitting occurs when a model is overly simplistic
    and does not adequately represent the fundamental patterns present in the data.
    Finding a balance between these two extremes is essential for creating models
    that demonstrate strong predictive performance on data that has not been previously
    encountered.


    b)       Bias-Variance Tradeoff


    The bias-variance tradeoff represents a significant factor in the evaluation of
    models. A model''s simplifying assumptions on the connection between the input
    characteristics and the target variable are referred to as bias. Conversely, variance
    describes how sensitive the model is to changes in the training set of data. Achieving
    optimum model performance requires striking the correct balance between variance
    and bias.


    c)       Generalisation and Validation


    The capability of a model to excel with data that has not been encountered before
    is referred to as generalisation. This aspect of model evaluation is crucial as
    it determines the performance of models in real-world scenarios. Validation entails
    evaluating a model''s performance using a distinct validation dataset, comprising
    instances that were not utilised in the training process. This enables an estimation
    of the model''s ability to generalise to new, unseen examples.


    4.  Different Types of Model Evaluation Techniques


    With a strong grasp of the essential concepts established, the next step involves
    examining various methods for assessing machine learning models.


    a)       Holdout Method


    The holdout method, referred to as the train-test split, represents one of the
    most straightforward techniques for model evaluation. The available data is divided
    into two segments: a training set and a test set. The model undergoes training
    using the training set and is subsequently assessed using the test set. This enables
    the estimation of the model''s performance on data that has not been previously
    encountered.


    b)       Cross-Validation


    Cross-validation serves as a more reliable technique for evaluating models, addressing
    the shortcomings associated with the holdout method. The process entails splitting
    the data into several subsets or "folds." The model undergoes training using a
    combination of these folds while being assessed on the fold that remains. A more
    accurate assessment of the model''s performance can be obtained by repeating this
    procedure with other fold combinations.


    c)       Bootstrap


    Bootstrap is an additional resampling technique that can be implemented for the
    purpose of model evaluation. This process entails generating several bootstrap
    samples through the random selection of data from the original dataset, allowing
    for replacement. A model is trained using each bootstrap sample, and the model''s
    performance is assessed by combining the results from the bootstrap samples.


    # CHAPTER 3:                        Introduction to Deep Learning


    Learning Objective


    This chapter explores into Deep Learning, explaining neural networks, various
    architectures, optimisation techniques, and various challenges. Readers will gain
    insight into how Deep Learning drives advancements in Generative AI.


    ## 3.1                 What is Deep Learning


    Artificial neural networks are used in deep learning, a subset of machine learning,
    to extract knowledge from data. Artificial neural networks, which draw inspiration
    from the human brain, can be used to a broad range of applications, such as voice
    recognition, picture identification, and natural language processing.


    1.  Deep Learning Algorithms


    Large labelled data sets are often used to train deep learning systems. The algorithms
    are trained to assign the appropriate labels to the data''s characteristics. As
    an instance, in an image recognition job, the algorithm may learn to link certain
    aspects in a picture (such an object''s form or colour) to the appropriate label
    (like "dog" or "cat").


    A deep learning system is capable of making predictions on fresh data once it
    has been learnt. For instance, dogs in fresh photographs can be recognised using
    a deep learning system that has been taught to recognise dog images.


    2.  Working of Deep Learning


    A neural network processes incoming data by working together with layers of linked
    nodes, or neurones. Data moves through many layers in a fully connected deep neural
    network, where each neurone carries out nonlinear modifications to enable the
    model to learn complex data representations.


    Data enters a deep neural network via the input layer and then travels through
    hidden layers that use nonlinear functions to alter the data. The model''s forecast
    is produced by the last output layer.


    ![Lightbox](Image00011.jpg)


    Figure ‎ 3.1: Fully Connected Deep Neural Network.


    3.  Types of Deep Learning


    Deep learning models come in a variety of forms. The following are among the most
    prevalent types:


    a)       Convolutional Neural Networks (CNNs)


    CNNs are used to analyse and recognise images. They are very adept at recognising
    items in pictures, even if they are deformed or partly hidden.


    b)       Deep Reinforcement Learning


    Deep reinforcement learning is used to gaming and robotics. This kind of machine
    learning enables an agent to interact with an environment and learn how to behave
    by getting rewards or penalties.


    c)       Recurrent Neural Networks (RNNs)


    Speech recognition and natural language processing are two applications of RNNs.
    In addition to being able to create text and translate languages, they excel in
    comprehending the context of a sentence or phrase.


    4.  Benefits of Using Deep Learning Models


    The following are some benefits of employing deep learning models:


    1.  Learning complex relationships between features in data: They are thus more
    potent than conventional machine learning techniques.


    2.  Large dataset training:  As a result, they may learn from a greater variety
    of events and become more scalable, resulting in more precise forecasts.


    3.  Data-driven learning: DL models are more efficient and scalable since they
    can learn from data and need less human interaction during training. Continuously
    produced data, such that from sensors or social media, is used to train these
    models.


    5.  Deep Learning Applications


