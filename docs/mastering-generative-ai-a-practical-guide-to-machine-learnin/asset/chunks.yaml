  trans: '


    除了与训练数据相关的风险外，生成式 AI 模型可能会生成输出，这些输出通常在不提醒模型用户的情况下整合或以其他形式区别受保护的作品。那么，如果这些输出被用于商业活动，这些用户（可能是从自由职业者到公司员工的任何人）将面临可能的后果。模型输出要对用户构成危险，所需的精确“衍生性”程度尚不为人知，可能只有通过法律诉讼或立法才能明确。鉴于生成式
    AI 的输出并非完全由人类创作，适用于生成式 AI 输出的知识产权（`IPRs`）也仍不明确。


    ## 3. 软件许可风险


    软件许可风险与开发者利用 AI 产生可用代码时发生的模型输出危害相似。如果一个在带有许可协议的代码上训练的生成式 AI 模型随后被用于创建集成到新软件中的相似代码，那么新软件可能需要适当代表与训练数据中代码相关的许可或多个许可。例如，在严重情况下，拷贝权许可证（copyleft
    licenses）可能会强制商业软件也声明为开源。


    ## 4. 数据泄露和商业秘密风险


    根据产品和模型的不同，生成式 AI 模型可能会使用输入数据进行持续训练；然而，一旦被学习，数据就有被复制给其他用户的可能。这使得在使用生成式 AI 模型和产品时，保护敏感和隐私信息变得困难。事实上，已经有公司在员工在生成式
    AI 提示词中使用公司私有信息后禁用了 `ChatGPT`，随后发现这些信息已泄露到公司之外。


    ## 5. 发明人风险


    AI 已被用于协助多个领域的新创新的开发，例如药物设计。目前尚不确定 AI 如何——甚至是否可能被描述对某项声明的想法出了贡献，因为大多数知识产权局需要在专利中注明人类发明者。这听起来可能无害，但如果法院审查专利并确定其并非列出发明者的主要发明，则该专利可能被宣布无效。


    ## 8.4 生成式 AI 的虚假信息和滥用


    在带来生成式 AI 益处的同时，生成式 AI 也带来了巨大的风险，特别是在虚假信息的传播和潜在的滥用方面。随着 AI 生成的内容与人类创作的材料变得难以区分，对伦理影响、安全威胁和社会影响的担忧变得日益紧迫。


    ### 1. 生成式 AI 导致的虚假信息兴起


    关于生成式 AI 的主要关注之一是其在虚假信息传播中的作用。AI 模型可以生成极具说服力的假新闻文章、受操纵的媒体和误导性叙述，这些很容易欺骗公众。随着信息在社交媒体平台上快速传播，此类内容可以迅速流行，影响公众观点并塑造现实事件。


    #### a) 假新闻和虚假信息


    AI 生成的内容可用于创建看似可信的假叙述。恶意行为者利用这些功能传播宣传、影响选举或操纵股市。与传统的虚假信息不同，AI 驱动的虚假信息可以以极小的努力大量生产，成为具有欺骗意图的人的强大工具。


    #### b) 深度伪造技术（Deepfake）


    生成超真实合成媒体的深度伪造 AI 已成为主要关注问题。由 AI 操纵的视频和图像可以制造事件、创建虚假证或冒充公众人物。这项技术在政治、网络安全甚至个人隐私方面构成了严重威胁，因为深度伪造视频可用于勒索个人或损害声誉。


    #### c) 社交媒体操纵


    社交媒体对 AI 生成的虚假信息特别为敏感。机器人和 AI 驱动的账户可以用误导性内容充斥平台，放大分裂问题并助长政治和社会动荡。生成式 AI 模仿写作风格和人类交互的能力，使得区分真实用户和自动化账户变得非常困难。


    ### 2. AI 滥用的伦理和法律挑战


    由于生成式 AI 有滥用的可能，伦理和法律框架难以跟上步伐。围绕责任归属、知识产权和隐私的问题是监管机构和科技公司面临的关键挑战。


    #### a) 责任归属与 AI 生成的内容


    AI 伦理中的一个关键问题是确定 AI 生成的虚假信息的责任。责任应该归于开发者、用户还是托管内容的平台？缺乏明确的规定使得让恶意行为者对其行为负责的努力变得复杂化。


    #### b) 版权和知识产权


    AI 生成的内容引发了复杂的知识产权问题。当 AI 创建与人类创作作品高度相似的作品时，艺术家、作家和音乐家面临着挑战。所有权问题——AI 生成的作品是否可以受版权保护以及谁拥有权利——在许多司法管辖区仍未解决。


    #### c) 隐私和安全安全风险


    生成式 AI 可用于创建极具说服力的钓鱼邮件、用于诈骗的语音合成和身份欺骗诈。此类活动威胁网络安全和个人隐私，因为 AI 生成的内容可能会欺骗个人共享敏感信息或参与欺诈交易。


    ## 8.5 隐私、安全与安保


    生成式人工智能的快速发展引发了对隐私、安全和安全的严重关注。解决这些挑战对于确保负责任地部署 AI 的同时保护个人、组织和社会至关重要。


    ### 1. 生成式 AI 中的隐私关注问题


    隐私是 AI 时代的基本问题。生成式模型通常依赖于庞大的数据集，其中包含公开的、专有的有时是敏感的信息。这些数据集可能无意中包含个人数据，引发了对信息如何收集、处理和利用的担忧。


    主要的隐私风险之一涉及数据泄露。AI 模型，特别是大语言模型（`LLMs`），已被证明会记忆并复制训练数据，有时会暴露敏感的个人细节。如果模型根据机密医疗记录、财务信息或私人对话进行训练，当以特定方式进行查询时，它可能会生成此类数据的输出。


    此外，用户与 AI 系统的交互本身也可能是隐私风险的来源。聊天机器人和其他生成式 AI 应用通常收集输入数据以提高性能。然而，如果没有稳健的数据保护措施，这些信息可能会被用于监控、定向广告甚至恶意活动。用户并不总是知道存储了哪些数据、这些数据如何被使用，或者他们是否对删除这些数据拥有控制权。


    解决这些问题需要严格的数据保护政策、明确的用户同意机制，并遵守如《通用数据保护条例》（`GDPR`）和印度《数字个人数据保护法》（`DPDPA`）等法规。组织必须采用隐私保护技术，包括差分隐私、数据匿名化和联邦学习，在保持
    AI 能力的同时降低风险。


