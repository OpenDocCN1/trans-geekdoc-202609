    ### 3. 虚假信息与深度伪造监管


    生成式 AI 使得高度逼真的深度伪造（deepfakes）和合成媒体成为可能，带来了误信息、欺诈和名誉损害的风险。AI 生成的假新闻传播可能会影响选举、操纵舆论并造成社会危害。尽管《2021
