  md: '# Message from the Program Chairs

    SmartBlock 2020


    It is a great pleasure to welcome you on behalf of the conference committees,
    to the 3rd IEEE International Conference on Smart BlockChain (SmartBlock 2020).
    I am glad that we can have this international conference at Zhengzhou, Henan,
    China in this summer.


    Now, allow us to introduce the IEEE SmartBlock. This conference addresses the
    development of blockchain and smart computing technology which has deeply changed
    the way people live. Today, one of the most promising trends of computer science
    is to migrate a centralized computing system to decentralized computing systems
    which is becoming a main stream to establish a trust and secure trading and trading
    environment. It is actually early to make a solid statement about the adoption
    of blockchain technology, since there are many unsolved problems in the field.
    The success of blockchain technique in Bitcoin does not mean the technique can
    be successfully deployed in all domains. This year, we focus on the blockchain
    and smart computing techniques and aim to gather recent achievements in academic
    and industry. IEEE SmartBlock 2020 is the next edition of a series of successful
    academic events, including SmartBlock 2018 (Tokyo, Japan), and SmartBlock 2019
    (Birmingham, UK).


    Moreover, it is our great honor to introduce the IEEE SmartBlock 2020. We received
    over 129 research papers for this conference out of fewer than 39 were accepted
    as full papers. The acceptance rate of IEEE SmartBlock 2020 is 28%. We have put
    together a few tracks over the period of the conference. The success depends ultimately
    on many people who have endeavored to the conference with us in planning and organizing
    both the technical programs and social arrangements. We particularly express our
    gratitude to our General Chairs Meikang Qiu, Lizhu Jiang, and Bhavani Thuraisingham;
    Publicity Chairs Mingsheng Hu, Yugao Wu, and Kek Gai; General Chair Yunxia Liu.
    We also owe thanks to our sponsors: IEEE, IEEE Computer Society, IEEE TCSC, IEEE
    ST Smart Computing,zhou Normal University, China Computer Federation, the Association
    of Engineering Education for Information Technologies, Longxiang High Tech Group
    Inc., North America Chinese Talent Association, Henan Blockchain Research Institute,
    and Min Meng Committees.


    On behalf of the IEEE SmartBlock 2020 organizing committee, I am honored and delighted
    to welcome you to 3rd IEEE International Conference on Smart BlockChain (SmartBlock
    2020) in Henan, Zhengzhou, China. I believe we have chosen a venue in which guarantees
    a successful technical conference. With our charming venue, we are sure that you
    will enjoy your journey at SmartBlock 2020 for socializing with other scholars
    and gathering the academic social networks.


    Yonghao Wang, Birmingham City, UK

    Liehuang Zhu, Beijing Institute of Technology, China

    Gerard Memmi, Telecom Paris, France

    SmartBlock 2020 Program Chairs'
