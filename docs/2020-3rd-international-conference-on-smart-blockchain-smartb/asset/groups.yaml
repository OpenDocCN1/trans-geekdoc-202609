  mdcn: '

    # 程序主席致辞

    SmartBlock 2020


    我们代表大会委员会，非常欢迎大家参加第三届 IEEE 智能区块链国际会议（SmartBlock 2020）。我很高兴今年夏天，我们能够在中国河南郑州举办这次国际性会议。


    现在，请允许我们介绍一下 IEEE SmartBlock。本次会议关注区块链和智能计算技术的发展，这些技术已从根本上改变了人们的生活方式。今天，计算机科学最有前景的趋势之一是将中心化计算系统迁移到去中心化计算系统，这正成为建立信任和安全交易及交易环境的主流。实际上，要对区块链技术的应用做出确切的定论还为时过早，因为该领域仍存在许多未解决的问题。比特币在区块链技术上的成功，并不意味着该技术可以在所有领域中成功部署。今年，我们专注于区块链和智能计算技术，旨在汇聚学术界和工业界的最新成果。IEEE
    SmartBlock 2020 是系列成功学术活动的下一届，之前的活动包括 SmartBlock 2018（日本东京）和 SmartBlock 2019（英国伯明翰）。


    此外，我们非常荣幸能介绍 IEEE SmartBlock 2020。本次会议收到了 129 多篇研究论文，其中少于 39 篇被接收为全文。IEEE SmartBlock
    2020 的录取率为 28%。我们在会议期间安排了几个分会。会议的成功最终取决于许多在规划和组织技术议程以及社交安排方面与我们并肩努力的人们。我们特别感谢大会主席
    Meikang Qiu、Lizhu Jiang 和 Bhavani Thuraisingham；宣传主席 Mingsheng Hu、Yugao Wu 和 Kek
    Gai；总主席 Yunxia Liu。我们还要感谢赞助单位：IEEE、IEEE 计算机学会、IEEE TCSC、IEEE ST 智能计算、郑州师范大学、中国计算机学会、信息技术工程教育协会、龙翔高科技集团、北美华人人才协会、河南区块链研究院以及民盟委员会。


    我代表 IEEE SmartBlock 2020 组委会，非常荣幸地地欢迎大家来到中国河南郑州参加第三届 IEEE 智能区块链国际会议（SmartBlock
    2020）。我相信我们选择了一个能够确保技术学术会议圆满成功的地点。凭借我们迷人的场地，我们坚信您将享受 SmartBlock 2020 的旅程，与其他学者交流并汇聚学术社交网络。


    Yonghao Wang，英国伯明翰

    Liehuang Zhu，中国北京理工大学

    Gerard Memmi，法国巴黎电信学院

    SmartBlock 2020 程序主席

    '
