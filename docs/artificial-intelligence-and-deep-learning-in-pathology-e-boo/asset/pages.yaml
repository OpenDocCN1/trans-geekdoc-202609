- pgno: 72
  md: 'operates at this level. To do so, there must be a way of quantitating the relationships
    among the nodes. The connections can be described by what is known as an adjacency
    matrix. The elements of the matrix indicate whether pairs of vertices are adjacent
    (the element at the intersection of row and column is a one, if there is a connection
    between them, and otherwise zero). In other words, the adjacency matrix represents
    the adjacency of vertices. There is another form of representation of a graph
    that is known as an incidence matrix that, as its name suggests, represents the
    incidence of vertices and edges. These matrices are constructed from the graph
    in visual form. Conversely, it is possible to recreate a pictorial diagram of
    a graph from its matrices (or one functionally identical or isomorphic to that
    diagram). As neural networks are based on linear algebra, the graph as defined
    by its matrix is now amenable to computation by the network. The effective implementation
    of a graphical network is a topic of active investigation. The models are quite
    complex and beyond the scope of this discussion. However, for the mathematically
    sophisticated, Zhou et al. [9] have recently published a review of methods and
    applications involving graphical neural networks.


    It is possible to analyze graphical relationships from CNN output without an explicit
    use of a graphical neural network. For example, newly published work by Jung et
    al. [10] has demonstrated the power of integrating traditional deep learning with
    the mathematics of graph theory for the analysis of histopathologic images involving
    collagen deposition in immunostained images in relation to HIV Infection. A CNN
    is first used for segmentation of the whole slide image. Parallel processing is
    applied to convert segmented collagen fibrils into a relational graph and graph
    theory is used to extract topological and relational information from the collagenous
    framework.


    In brief, graphical networks are designed to deal with relationships among its
    nodes which may represent attributes, attribute sets, or attribute patterns. Conventional
    CNNs are not very good at this. When dealing with images, there is another area
    of weakness. A neural network can identify a face from representations that define
    overall shape, shape, number, and position of elements within the face (two eyes,
    one nose, one mouth). A model capable of good generalization will have no trouble
    with different shapes such as round or oval eyes, broad or narrow noses, and so
    on. They can also handle translational, rotational, and scaling relationships
    of the elements. To a CNN, a face in which one eye and the mouth are switched
    may appear to be similar because they are constructed of similar elements, yet
    they are quite different to a human observer. The internal data representation
    of a CNN simply does not take into account important spatial hierarchies between
    simple and complex objects and thus their meaningful relationships to each other.


    # Capsule networks


    Another newly emerging idea is that of the capsule network, in which the output
    of each artificial neuron is not a scalar, but rather a vector that encodes both
    a probability of detection of a feature (length) and its state (orientation).
    Thus, neuronal'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'activities are directly associated not only with feature detection but also
    the orientation of that feature. Hinton’s group [11] recently described the basic
    architecture and the process of dynamic routing between capsules.


    Capsule networks are relatively new and, in their current form, are difficult
    to train and not very accurate. Thus, it is still too early to assess their ultimate
    utility.


    # Weakly supervised learning


    There have been many attempts to achieve unsupervised learning, i.e., to obtain
    predictive representations from unlabeled data. Although human beings can do this,
    it has proven very difficult to implement this strategy in a robust way for practical
    AI. As described in Chapter 2, clustering algorithms such as K-means and principle
    component analysis are two ways of finding relationships and/or identifying critical
    features in a database containing unlabeled examples and in that sense are unsupervised.
    Much current research involves employing these and related strategies within the
    context of deep learning via hybrid strategies. However, for the most part, current
    efforts in pathology are devoted to weakly supervised rather than unsupervised
    classification. Weak supervision may be thought of in a simplistic way as the
    obverse of multilabel classification. In multilabel classification, complexity
    is introduced by the need to simultaneous identify complex subimages or patterns
    within each example from a well-defined dataset. In the case of weakly supervised
    learning, the classifications need not be complex but are based upon an incompletely
    labeled dataset itself. In both cases, the task is to abstract information that
    is much more complicated than simply assigning a class label to an unknown sample.


    There are three basic types of weak supervision. In incomplete supervision, only
    a small subset of training data has labels. This is typically the case for image
    analysis. Huge datasets may be available, but usually only a small subset of these
    is annotated. In the case of inexact supervision, some supervision information
    is given, but it is not as exact as desired. For example, a dataset may consist
    of breast cancer images, but only the diagnosis is known for the slides. These
    are coarse labels. Fine-grained information, such as that obtained by annotation
    by trained pathologists, may only be available for a small subset of these slides.
    Inaccurate supervision refers to situations in which the label information may
    not be perfect ground truth. In pathology, this is sometimes due to interobserver
    variability and sometimes due to the presence of noise, as for example, difficulty
    in distinguishing between a mitotic and a pyknotic nucleus. For a good general
    survey of these concepts and approaches, see Ref. [12].


    With this as background, it is relatively straightforward to understand the concepts
    behind weakly supervised learning. For incomplete supervision, we can try to make
    do with the small labeled subset that is available. Recall that a neural network
    learns by developing increasing complex (and lower dimensional) representations
    of the data at each hidden layer within the network. This process is implemented
    by adjusting the weights of the connections between layers by comparing'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'the output of the network with its input and minimizing a loss or error function.
    The starting point involves random weights across the connections, and these are
    then adjusted via backpropagation. In the previous chapter, several methods for
    obtaining representational information in the early layers of a neural network
    using only limited subsets of the data were described. These include autoencoders
    and generative adversarial networks (GAN). In both of these cases, the initial
    stages are unsupervised in that the program creates an internal representation
    by reconstructing an input as its output. This gives rise to internal representations
    of the data that may then be used as the starting points for a conventional neural
    network such as a CNN. The initial stages of a GAN or autoencoder thus learn a
    set of weights that can be used as the starting points of the CNN instead of beginning
    with a set of random weights. This reduces the size of the training set, and so
    only a subset of the training set needs be labeled.


    Also, as it was pointed out previously, as early representations may have similar
    properties across different but similar datasets, it is possible to pretrain a
    new model by using the early layers of the model previously fully trained on a
    similar problem, and using the weights in those layers as starting points rather
    than the usual beginning random weights (see Chapter 3). This is known as transfer
    learning.


    In all these cases, a limited set of annotated data is used as for the beginning
    steps in the training of the algorithm. These are some of the most effective ways
    of dealing with incomplete supervision. Examples of the use of autoencoders, GANs,
    and transfer learning, respectively, are found in Refs. [13,14]. It is also possible
    to bootstrap learning by using labels assigned to unknown examples by the network
    with limited labeled data available to it and using these new examples to expand
    the labeled training set. This is closely related to strategies used to generate
    synthetic data when there is class imbalance, as will be discussed in the next
    section.


    For inexact supervision, there are a number of multiple-instance approaches (MIL).
    In these, the focus is shifted from discrimination of the samples themselves to
    discrimination of “bags,” i.e., breaking up the images into tiles or patches (Fig.
    4.3).


    It should be noted that the MIL approach is not confined to deep learning (neural
    network) algorithms. It has been applied to support vector machines [15] and in
    combination with feature clustering [16]. Campanella et al. [17] apply an MIL
    to a residual neural network in a highly sophisticated manner to the study of
    prostate, basal cell, and breast cancer at the terabyte scale (discussed in detail
    in a subsequent chapter).


    The above examples all represent semisupervised learning. There are fully unsupervised
    learning strategies as well. A classic example is the K-means algorithm described
    in Chapter 2. This and related clustering algorithms require no information about
    the labels of the sample but instead find clusters in the data based upon geometric
    closeness in an n-dimensional space. However, to be useful in a diagnostic/predictive
    setting, the clusters must ultimately be given a label. However, it is not necessary
    to label every sample in a given cluster individually; one can use the same class
    label for each element of that cluster. Clustering can be the basis'
