- pgno: 100
  md: '# Digital pathology as a platform for primary diagnosis and augmentation via
    deep learning


    Anil V. Parwani, MD, PhD, MBA


    Professor, Pathology and Biomedical Informatics, The Ohio State University, Columbus,
    OH, United States


    # Introduction


    The field of pathology is entering into an exciting time with the more widespread
    use of digital imaging in pathology. Pathologists have been using images for a
    long time, but only in the last 20 years, there has been an increased effort to
    digitize the workflow [1,2]. The electronic communication of digitized images,
    digital pathology, and the ability to transfer a microscopic image between one
    pathologist and another physician or member of the health care team has applications
    today in the national as well as global pathology community to be used for primary
    diagnosis, education, peer-review, intraoperative consultation, second opinion
    consultations, and quality reviews [1,3–15].


    The most exciting aspect of digital pathology is the development and widespread
    use of whole slide imaging (WSI) technology [6,16]. WSI allows the scanning of
    entire glass slides, with an outputting of an image file that is a digitized reproduction
    of the glass slide with images that boast diagnostic quality standards [2,5,17,18].
    The College of American Pathologists has published recommendations for validation
    of WSI scanners for clinical use [16,19–21]. In the last 2 years, the US Food
    and Drug Administration (FDA) has approved two WSI vendors to market devices for
    primary diagnosis, which have been major milestones in the journey toward adopting
    and implementing digital pathology systems [22,23]. A new set of regulatory pathways
    are now potentially going to be implemented as tools like deep learning (DL) and
    artificial intelligence (AI) start their way from research labs and clinical labs
    [14,24–30].


    WSI scanners and the infrastructure surrounding the use and storage of digital
    images have advanced significantly since the description of the first one in 1997
    by Ferreira et al. [31,32]. In the last decade, innovations and significant technical
    advancements in WSI have contributed to the ability of clinical laboratories to
    image'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'large numbers of slides automatically, rapidly, and at high resolution [6].
    The ability to routinely digitize entire slides not only allows pathologists to
    better apply computer power and network connectivity to the study of histomorphology
    but also has significantly improved the quality and accessibility of biospecimen
    repositories [33], particularly large image datasets that can be used for research
    in the areas of DL and AI [34–40]. The tools have also paved the way toward creating
    remote networks of digital pathology scanning centers to enable rapid sharing
    of clinical cases [41]. The latter inventions and innovations in the field of
    AI are paving the way to augment the clinical diagnostic workflow and primary
    diagnosis in pathology [28,42]. This chapter will focus on providing an overview
    of digital pathology and particularly WSI as a unique platform for clinical applications
    such as primary diagnosis and the potential to augment this diagnosis via DL and
    AI [11,20,26,43,44].


    # Digital imaging in pathology


    Imaging plays a critical role in modern pathology practice and is a driving technology
    to enhance workflows within the clinical laboratory. Pathology images are unique
    in the healthcare environment and present significant challenges in labeling,
    storage, and management. Imaging workstations can be thought of as PCs with image-specific
    software and the appropriate hardware peripherals needed to handle digital images
    [32,45–47].


    With improved computing power and infrastructure increasingly supporting more
    powerful computers, more robust networking, and cheaper storage, this is a perfect
    time when pathologists are able to review large images rapidly and easily as they
    can now manage text. Many of the laboratory information system (LIS) vendors are
    now able to provide integration with WSI systems [18]. In recent years, we are
    witnessing a vast improvement in capture, storage, and retrieval of images handled
    by the LIS [48]. Digital images continue to be used for teaching, quality assurance
    studies, and even consultation. The basic ability to capture the digital image
    faithfully must be validated before further applications can be developed [49–51].


    Imaging software comes in many flavors and serves many functions. Software for
    image processing allows the adjustment of brightness, contrast, hue, and resolution
    and is therefore extremely useful for providing pathologic images for academic
    use [52]. Many laboratories have implemented image acquisition and management
    systems that acquire images during all stages of the specimen workflow (requisition
    scanning, gross and microscopic examination) and store them into either customized
    home-grown systems or commercial systems [52–54]. These images are linked to the
    surgical accession numbers, which in turn are linked to the electronic medical
    record and the LISs [49]. The most critical aspect of this workflow is the ability
    to integrate with the LIS and have images readily available for patient care [46,51].


    Several laboratories have utilized image-embedded reports to improve the care
    of patients by providing additional information and can also include annotations,
    tables, graphs, and diagrams. Such reports can in addition provide the clinician
    with'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'added insight to the practice of pathology, facilitating greater understanding
    between disciplines. Image-embedded reports also serve as a powerful marketing
    tool for expanding the outreach capabilities of the laboratory [55,56]. The advent
    of AI tools will pave the way in the future to automate many of the tasks of “choosing”
    the right image based on clinical data and other relevant information. There are
    also significant advances occurring in parallel in the field of molecular pathology,
    which together with digital pathology and AI will provide the next generation
    of powerful and advanced diagnostic tools [53].


    Digital images in pathology originate from several sources including autopsy,
    gross room, cameras mounted on microscopes or scanned using scanners. There are
    numerous situations where digital imaging in pathology has provided useful solutions
    to pathologists including their deployment in pathology reports, conferences,
    presentations, quality assurance studies, and creation of teaching sets of rare
    and archival material. These images may be published as a collection of archived
    images on the Internet or local intranet for teaching. Digital images are also
    acquired for legal situations [54,57,58].


    # Telepathology


    Telepathology technologies allow light microscopic examination and diagnosis from
    a distance. These systems may be combined with DL algorithms to assist the pathologist
    to screen a remote case for consultation or extract features from these images
    for assisted diagnosis. Telepathology use cases include primary diagnosis, teleconsultation,
    intraoperative consultation, telecytology, telemicrobiology, quality assurance,
    and teleeducation [59–61]. There are three general approaches to telepathology.
    These include dynamic, static, and hybrid systems [32,62–67].


    Dynamic systems are remote-controlled microscopes that provide the pathologist
    with a “live” view of the distant microscopic image while allowing them to control
    the stage, focus, and change the magnification, remotely. An advantage of the
    dynamic system is that they give the remote pathologist control and [68] flexibility
    in viewing any region of the entire slide and do so at any power. These systems
    tend to be more expensive with proprietary software requirements [69–71].


    The second method of telepathology is “store-and-forward” telepathology in which
    digital images are first captured via cameras or acquired via WSI systems for
    transmission to the consultant. These images can be captured in standard file
    formats and can be viewed via a remote viewer. In the future, this mode of telepathology
    may be used to send images to the cloud, where image analysis may be performed
    or DL algorithms may be run to prescreen for rare event detection or for diagnosis
    or grading of cancer or for identifying microorganisms [69,72–74].


    The third method of telepathology is the use of hybrid systems which can combine
    features of both “store-and-forward” and dynamic systems. Hybrid telepathology
    systems can provide a “live” view using robotic-controlled microscopy with high-resolution
    still image capture and retrieval. This dual functionality makes them valuable.
    Some of the hybrid systems in the market today have capabilities for WSI as well
    [2].'
