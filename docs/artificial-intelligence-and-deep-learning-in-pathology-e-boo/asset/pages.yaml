    # Whole slide imaging and primary diagnosis


    The first WSI scanner was approved by the FDA in 2017 and the second one in 2019,
    paving the way for using WSI as a primary diagnostic tool [22,116]. Before this,
    most of the financial gain from implementing WSI system was for remote consultations,
    frozen sections [117], education [118], and research. Utilizing WSI for primary
    diagnostics is helping labs with increased productivity and cost mitigation by
    increasing patient safety by providing pathology images for easy sharing for expert
    consultation, which in turn will lead to reduction in overcalls and undercalls
    in pathology diagnosis. One of the impacts of improved access to images and sharing
    images is also in the rapid inpatient review of cases and potential to decrease
    the number of hospital days of care and facilitate earlier discharge of patients
    where delay in pathology diagnosis may be resulting in discharge decisions. In
    a study published by the Journal of Pathology Informatics, a group from the University
    of Pittsburgh studied the positive effects of implementing digital pathology [119].
    Workflow improvement benefits as a result of employing digital pathology included
    the support of lab automation (e.g., bar coding and tracking of assets and bidirectional
    interfaces with the scanners) and the potential to increase an individual pathologist’s
    productivity by at least 13% because of improved organization and racking of surgical
    pathology cases [119]. Other possible areas for financial gains will be to increase
    number of pathology consults coming to a facility and indirectly by recognition
    of these new technologies creating a band recognition, more patients will come
    to a facility for surgery and treatment [119].


    WSI technology has several advantages over conventional microscopy, such as portability,
    ease of sharing and retrieval of archival images, and the ability to make use
    of computer-aided diagnostic tools such as image algorithms and 3D reconstruction
    used to convert poorly oriented specimens into well-oriented ones. WSI has also
    created new business models in pathology [120]. One such example is the virtual
    immunohistochemistry service provided by large national laboratories. After the
    remote reference laboratory performs technical staining and slide scanning services,
    the referring pathologist is provided with full access to these immunostained
    slides for their interpretation or referral to a teleconsultant. This has allowed
    some pathology practices to recapture a portion of the reimbursement for professional
    interpretation services. Finally, some issues that still need to be satisfactorily'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'addressed to truly accommodate the use of WSI for making primary diagnoses
    relate to regulations (e.g., FDA and validation guidelines), malpractice and liability
    issues, and reimbursement for technical services [22,121–123].


    More recently, digital pathology association (DPA) has worked with FDA to downgrade
    the risk of WSI scanner. Under certain circumstances, manufacturers can opt to
    submit a de novo application for a moderate- or low-risk device, which has not
    yet been classified and for which there is no predicate device. The DPAs discuss
    with the FDA on the notion that manufacturers submit a de novo application. FDA
    indicated the WSI for primary diagnosis is, rather than a premarket approval (PMA),
    a candidate for de novo applications as a class II device. Once a de novo application
    receives marketing authorization, other companies will then be able to submit
    510(k) for WSI. The first device was approved for primary diagnosis in 2017 and
    the second device was approved in 2019.


    The practice of histopathology evaluation by benchtop optical microscopes remains
    the gold standard for pathology review. However, as the workflow of related specimen
    information transitions to fully digital systems including the use of whole slide
    image scanners, there has been an emerging need to incorporate the traditional
    glass slide histopathology findings as digital images to move toward a complete
    slidel­ess and seamless digital workflow [11,50,87,124,125]. This need has been
    increasingly met over the past decade by the development of robotic telepathology
    systems and evolved to whole slide digitization technology and associated software
    for visualization and data management [113,126]. The selection of systems available
    in the marketplace ranges from offering broad-based anatomic pathology workflow
    solutions to those with feature sets suited to specific areas of pathology. Hospital
    administrators and C-suite executives are taking closer look at the cost-to-benefit
    analysis of WSI systems and deployments continue to increase steadily around the
    world [119].


    Some of the lessons learned from early “validation” studies highlight the need
    for diagnostic standards and better design of study conditions for a direct comparison
    of light and WSI modalities [9,126–134]. Some important considerations are to
    look at intraobserver discrepancies and identify the causes [105,135,136]. Many
    times, these discrepancies are not image quality related but because of other
    factors. These discrepancies may be because subject pathologists sign out cases
    they are accustomed to signing out while general pathologists sign out general
    cases, whereas subspecialized pathologists sign out subspecialty cases only. Other
    factors which may result in discrepancies may be because of preanalytical factors
    such as different cutting and staining protocols as well as using scanners with
    special functions such as Z-stacking [21,22,137,138].


    # Whole slide imaging and image analysis


    One of the major advantages of digitizing slides is the ability to use computer
    algorithms to conduct reproductive and accurate measurements, quantify'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'immunohistochemical stain intensity, and provide accurate measurements (e.g.,
    cell counting) [139–141]. Many WSI vendors have engaged in cooperation with companies
    developing computer-assisted diagnosis and providing quantitative image analysis
    by providing a selection of solutions from specific defined assays (e.g., HER2/neu)
    to rule-based image segmentation [142,143]. These application packages can interoperate
    with WSI formats, either via vendor-supplied interfaces or via provided programming
    interfaces. Several vendors, but not all, include image analysis software packages
    with a WSI system [144,145].


    *FDA-approved quantitative algorithms for diagnostic use* are available for a
    limited number of vendors. Approved tests include breast cancer biomarkers—progesterone
    receptor, estrogen receptor, human epidermal growth factor receptor 2 (HER2/neu),
    the cell proliferation index marker Ki67, micrometastases in bone marrow, and
    p53 [146].


    # Whole slide imaging and deep learning


    As more laboratories adopt digital pathology and digital images are incorporated
    into the diagnostic pathology workflow, there will be better case management and
    resulting of cases because of overall improvement in the information management
    surrounding a patient case [99]. Digital pathology workflow will help improve
    the efficiency of reading the cases [147–155]. AI tools can now be applied before
    signing out of the case to help collate and integrate the information that is
    needed for case review, but ultimately the pathologist will review the case and
    make a diagnosis [14,79,84,156,157].


    Advances in digital imaging and ability to rapidly digitize glass slides have
    now paved the ways to start using these images in DL/machine learning (ML) algorithms
    leading to potentially novel and innovative diagnostic tools [158]. The use of
    DL and AI tools combined with digital pathology images can extend the value of
    digital pathology far beyond what is possible today and quantified above. This
    is the true value of digital pathology and the AI tools that have been developed
    and are being developed today will help transform diagnostic pathology [14,159].


    As anatomical pathologists implement digital pathology, they now will have the
    capability to start using the smart DL tools in daily practice [28,158]. This
    is easy to illustrate by considering a specific area in surgical pathology, prostate
    cancer diagnosis, and grading. Adenocarcinoma of the prostate is one of the most
    common cancers diagnosed in men worldwide, second only to lung cancer. The increase
    in diagnosis stems from the increase in screening for prostate cancer, and it
    has led to unnecessary testing and overtreatment [160,161]. Prostate cancer has
    an excellent five-year survival rate of greater than 98% [147–155]. For this reason,
    it is important to determine if treatment will have an added benefit to the patient
    or simply decrease his quality of life. Current standards utilize Gleason scoring
    to determine if prostate cancer prognosis is from biopsy specimens [161].'
