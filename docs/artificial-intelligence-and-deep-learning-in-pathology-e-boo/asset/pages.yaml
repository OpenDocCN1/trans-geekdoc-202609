- pgno: 6
  md: '# Preface


    It is now well recognized that artificial intelligence (AI) represents an inflection
    point for society at least as profound as was the Industrial Revolution. It plays
    increasing roles in industry, education, recreation, and transportation, as well
    as science and engineering. As one example of its ubiquity, a recent headline
    proclaimed that “Novak Djokovic used AI to Train for Wimbledon!”


    In particular, AI has become important for both biomedical research and clinical
    practice. Part of the reason for this is the sheer amount of data currently obtainable
    by modern techniques. In the past, we would study one or a few enzymes or transduction
    pathways at a time. Now we can sequence the entire genome, develop gene expression
    arrays that allow us to dissect out critical networks and pathways, study the
    entire microbiome instead of a few bacterial species in isolation, and so on.
    We can also use AI to look for important patterns in the massive data that have
    already been collected, i.e., data mining both in defined datasets and in natural
    language sources. Also, we can take advantage of the power of AI in pattern recognition
    to analyze and classify pictorial data not only for classification tasks but also
    to extract information not obvious to an individual limited to direct observations
    through the microscope, a device that has never received FDA approval.


    Radiologists have been among the first clinical specialists to embrace AI to assist
    in the processing and interpretation of X-ray images. Pathologists have lagged,
    in part because the visual content of the images that pathologists use is at least
    an order of magnitude greater than those of radiology. Another factor has been
    the delay of the major industrial players to enter this arena, as well as limited
    hospital resources based on perceived differences in hospital profitability between
    radiology and pathology practices. However, more and more pathology departments
    are embracing digital pathology via whole slide imaging (WSI), and WSI provides
    the infrastructure both for advanced imaging modalities and the archiving of annotated
    datasets needed for AI training and implementation. An ever-increasing number
    of articles utilizing AI are appearing in the literature, and a number of professional
    societies devoted to this field have emerged. Existing societies and journals
    in pathology have begun to create subsections specifically devoted to AI.


    Unfortunately, existing texts on machine learning, deep learning, and AI (terms
    that are distinct, but loosely overlap) tend to be either very general and superficial
    overviews for the layman or highly technical tomes assuming a background in linear
    algebra, multivariate calculus, and programming languages. They do not therefore
    serve as a useful introduction for most pathologists, as well as physicians in
    other'
