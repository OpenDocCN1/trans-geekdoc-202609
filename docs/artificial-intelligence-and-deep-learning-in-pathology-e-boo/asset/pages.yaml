    may be synergistic with each other [19].


    # Synthetic data


    Weakly supervised methods are needed when there are large datasets available,
    but a limited number of annotated examples within that dataset. There are a number
    of other situations in which the dataset is well annotated, but there is class
    imbalance in that set. For example, there are usually many examples of normal
    tissue but limited examples of specific kinds of neoplasms of that tissue. Clearly,
    this creates a situation where there are not enough examples of each class for
    successful training. In addition, it can lead to a spurious kind of accuracy.
    As an example, suppose we are studying a neoplasm that has an incidence of 1%.
    Our training set consists of 10,000 entries of which 100 are positive and the
    remainder negative. We can easily generate an algorithm with an accuracy of 99%
    by simply calling every sample negative. Thus, every AI strategy that generates
    99% accuracy is suspect. We can guard against this by calculating metrics such
    as precision and recall as described above.'
