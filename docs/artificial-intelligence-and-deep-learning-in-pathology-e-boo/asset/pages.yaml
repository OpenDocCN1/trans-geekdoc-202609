- pgno: 259
  md: 'Fondon et al. [32] reviewed the use of traditional machine learning in breast
    cancer diagnosis. These authors approached the problems of automatically identifying
    and classifying breast histopathological digital images into one of the four classes:
    normal, benign lesion, in situ carcinoma, and invasive carcinoma. The functions
    of preprocessing, feature extraction from nuclei, regions, textures, and the use
    of these features to drive a variety of machine classifier tools are described.
    The SVM classifiers were most efficient with accuracy of up to 76%.


    Deep learning approaches to breast cancer diagnosis using CNNs are being vigorously
    explored. Araujo et al. [33] have used CNNs on digital images from the Bioimaging
    2015 breast histology classification challenge to separate into the same four
    classes of normal, benign lesion, in situ carcinoma, and invasive carcinoma. The
    overall sensitivity of the CNN in finding the carcinoma classes was 80%.


    Cruz-Roa et al. [34] have used CNN deep learning to automatically identify invasive
    breast cancer on whole slide images from the Cancer Genome Atlas and from whole
    slide images collected from three contributing institutions. They found a positive
    predictive value of 72% and a negative predictive value of 97% for identifying
    invasive breast cancer. CNN classifiers outperformed visual feature classifiers
    (color and intensity, color histograms, shape index histograms, Haralick features,
    and graph-based features) in this study. Bejnordi et al. [35] have extended the
    CNN approach on whole slide breast images by using context-aware stacked CNNs
    for a similar task of separation of the classes normal/benign, ductal carcinoma
    in situ, and invasive carcinoma. In their “context-aware” approach, these authors
    first trained a CNN using high-pixel resolution information to classify the tissue
    into different classes. To incorporate more context, they fed much larger patches
    to this model at the time of testing. The output of this first system is then
    the input to a second stacked system, which uses the compact informative representations
    of the first model together with the information of the surrounding context to
    learn global independence of structures in different lesion categories. In this
    3 class task, they achieved an accuracy of 0.812.


    # The digital assistant in finding metastases


    The tasks of searching for and identifying cancer metastases in lymph nodes are
    critical but time-consuming work for diagnostic pathologists. In breast cancer,
    the definition of nodal status by histopathology is ground truth for the assignment
    of nodal status. Current clinical guidelines codify the sizing of lymph node metastases
    into pN 0 (i-): No regional lymph node metastases histologically, negative IHC;
    pN0 (i-): Malignant cells in regional lymph node(s) no greater than 0.2 mm and
    no more than 200 cells (detected by H&E or IHC including isolated tumor cells
    [ITCs]); pN1mi: Micrometastases (greater than 0.2 mm and/or more than 200 cells,
    but none greater than 2.0 mm); and pN1 macrometastases at least 1 tumor deposit
    greater than 2.0 mm. Steiner et al. [36] have used a scoring system for gauging
    how difficult it is for a pathologist to distinguish among these classes which
    they term “obviousness scores.” In their study, it was found, not surprisingly,
    that the'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'obviousness score is high for macrometastases and low for identifying isolated
    tumor cells. These authors also examined the impact of deep learning algorithmic
    assistance, which they named the Lymph Node Assistant (LYNA), on the obviousness
    score. LYNA improved the obviousness score for micrometastasis detection. The
    impact on assignment of the other classes is was less apparent. The average review
    time was also decreased for micrometastasis detection with LYNA, marginally improved
    for a negative class assignment, and not significantly impacted for the assignment
    of macrometastases or isolated tumor cells.


    A recent competition (CAMELYON16) [37] to develop algorithmic solutions for the
    automated detection of sentinel lymph node metastases had 32 algorithms submitted.
    The areas under the curves (AUCs) for the receiver operating characteristic curves
    ranged from 0.556 to 0.994. The top five algorithms had a mean AUC comparable
    to the study pathologists’ interpretations in the absence of time constraints.


    Such studies offer the real possibility that the algorithmic digital assistant
    may provide a valuable prescreening function in histopathology in future diagnostic
    workflows.


    # The digital assistant in predictive modeling and precision medicine


    Apart from substantially aiding the pathologists in decision-making, the use of
    computational imaging tools could enable the creation of digital imaging–based
    companion diagnostic assays that would allow for improved disease risk characterization.
    Unlike expensive molecular-based assays that involve destroying the tissue and
    invariably capture genomic or proteomic measurements from a small part of the
    tumor, these digital imaging–based companion diagnostic tests could be offered
    for a fraction of the price and could enable characterization of disease heterogeneity
    across the entire landscape of the tissue section. Both traditional AI and deep
    learning approaches for the modeling of patient outcomes and response to therapy
    have been explored in a variety of neoplastic and nonneoplastic conditions.


    Lu et al. [17] have studied the prediction of survival in early stage estrogen-positive
    breast cancers using a traditional AI approach. These authors examined tissue
    microarrays for 615 features related to nuclear shape, texture, and orientation.
    They identified the top 15 quantitative history morphometric features which in
    combination modeled, using a linear discriminate analysis classification, the
    probability of long-term versus short-term disease-specific survival. Features
    relating to the heterogeneity of nuclear orientation dominated in this model.
    The authors in multivariate analysis controlled for tumor stage found that their
    model was strongly independently predictive of patient’s survival in estrogen
    receptor (ER)–positive and lymph node–negative breast carcinomas.


    Bychkov et al. [38] took a deep learning approach to the prognostic modeling of
    colon cancer outcomes from standard histopathology. These authors used an image
    analysis pipeline which included long short-term memory (LSTM) networks that allow
    the learning system to detect and memorize image tiles, which encode relevant
    and contributory morphologic information and disregard irrelevant image titles.'
