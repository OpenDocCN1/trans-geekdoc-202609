  md: 'cancer. This work leveraged rapidly expanding machine learning methodology
    in nuclear segmentation, feature extraction, and classification [5,6,9]. Segmentation
    of nuclei in tissue images proved to be challenging due to (1) variations in nuclear
    size and morphology, (2) nuclear overlap, (3) complex and irregular visual aspects
    of histologic structures, and (4) variations and irregularity of H&E staining
    and image acquisition. Irshad et al. [6] and Gurcan et al. [5] provide excellent
    surveys of the state of the art as it existed approximately 5–10 years ago in
    nuclear segmentation and detection. Image processing algorithms of various levels
    of sophistication were also employed, but the utilization of supervised algorithms
    was rare. Irshad et al. [6] specifically stated in their review article in 2014
    that, “To the best of our knowledge, only few supervised machine learning techniques
    like Bayesian ... SVM (Support Vector Machine) ... and AdaBoost are used for nuclei
    segmentation.”


    In the past few years since then, deep learning methods have played a rapidly
    increasing role in both nuclear segmentation and detection (for early examples,
    see Refs. [114–116]). Janowczyk et al. [21] articulated the advantages of deep
    learning approaches in an excellent manner by stating, “in order to develop a
    nuclear segmentation algorithm, one must first understand all of the possible
    variances in morphology, texture, and color appearances. Subsequently, an algorithmic
    scheme needs to be developed which can account for as many of these variances
    as possible while not being too general as to result in false positive results
    or too narrow as to result in false negative errors. This process can become quite
    unwieldy as it is often infeasible to view all of the outlier cases a priori,
    and thus an extensive iterative trial and error approach needs to be undertaken.”
    Winners of the recent MICCAI nuclear segmentation challenges have also utilized
    deep learning methods [117]. Since the success of deep learning algorithms tends
    to hinge on training data adequacy, generation of comprehensive training datasets
    remains crucial and challenging. This is especially challenging due to the wide
    variability in the appearance of nuclei that can differ between tissue types and
    can sometimes be difficult to morphologically distinguish and classify in cancer,
    which is further complicated by the variations in appearance that are due to tissue
    preparation. A promising approach to reduce the requirements for generating training
    datasets employs generative adversarial networks (GANs) [118] to generate realistic
    synthetic nuclei that can be used to enlarge and generalize training sets [119,120].


    Early work in lymphocyte detection and characterization efforts also explored
    the development of a clinical decision support (CDS) system to discriminate among
    three types of lymphoproliferative disorders and normal blood cells [121], along
    with lymphocyte detection and centroblast quantification in follicular lymphoma
    [122]. Currently, algorithms have been developed that can detect and classify
    lymphocytes as well as other types of cells, which allows for the detailed characterization
    of the interrelationships between tumor, tumor-associated stroma, and lymphocytes
    [123]. Corredor et al. recently presented a set of metrics that captures density
    and spatial co-localization of TILs and tumor cells that were linked to likelihood
    of early-state NSCLC recurrence [123]. Similarly, Heindl et al. captured metrics
    of immune cell abundance and spatial heterogeneity that were computed'
