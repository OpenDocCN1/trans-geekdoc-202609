    Protein biomarkers provide valuable diagnostic and prognostic information not
    available in standard H&E-stained tissue. This section provides an overview of
    a few of the many ways of quantifying biomarkers in an image.


    Immunohistochemistry (IHC), in its most popular form, uses a brown chromogenic
    detection system (3,3-diaminobenzidine or DAB) to tag a protein of interest against
    a nuclear hematoxylin counterstain, viewed on a brightfield microscope and manually
    quantified on a scale of 0–3. Multiplexing and automation extend'
