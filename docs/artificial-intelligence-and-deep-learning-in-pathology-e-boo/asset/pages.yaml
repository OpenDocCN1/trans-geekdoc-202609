- pgno: 134
  md: 'In Janowczyk et al. [27], an unsupervised deep learning approach termed Stain
    Normalization using Sparse AutoEncoders (StaNoSA) was developed to overcome some
    of the challenges with traditional stain color normalization methods (Fig. 7.2B).
    A sparse autoencoder is trained on the dataset, and the embeddings of the template
    were clustered with K-means clustering and the input image embeddings were assigned
    to the K clusters. Then a traditional histogram matching algorithm was applied
    per cluster. Three datasets were used to evaluate the StaNoSA algorithm. A breast
    biopsy slide dataset was used to study how StaNoSA could decrease intrasanner
    and interscanner variation. A gastrointestinal biopsy slide dataset was used to
    study how StaNoSA could decrease variability between sites, which was simulated
    with different staining protocols. The third dataset is a subset of the second
    with nuclei annotations to test how StaNoSA could improve object detection in
    pathology. StaNoSA was also compared with four state-of-the-art techniques. StaNoSA
    was demonstrated to bring the interscanner error to a similar range of the intrasanner
    error. It also decreased variability between staining protocols with better performance
    than other tested techniques. Finally, StaNoSA had the best Dice score for nuclei
    segmentation using a simple thresholding method.


    While the previous study utilized a neural network to improve normalization, a
    neural network architecture can also be used for end-to-end normalization processes,
    as done in Bug et al. [31]. Their network utilized two parallel network paths:
    a main transformation path and a feature extractor path (Fig. 7.2C). The feature
    extractor path is based on a pretrained VGG-19 architecture. The transformation
    path is composed of novel network blocks termed Feature Aware Normalization (FAN)
    units, which are inspired by batch normalization and long short-term memory units
    (LSTMs). The features from each block in the feature extractor network were passed
    into the FAN unit to gradually rescale and shift the image (similar to batchnorm)
    through addition and multiplication gates (similar to LSTM). As there are no paired
    data from H&E images, noise is deliberately added to the reference image. The
    noise model is constructed using normal distribution data with variances defined
    based on principal component analysis. To train and test the model, the staining
    protocol was varied by either increasing or decreasing hematoxylin concentration,
    eosin concentration, and slice thickness. The changes in color deviation were
    measured with the sum of squared differences between the color histogram (SSDH).
    Influence on texture was measured with the structural dissimilarity index (SDSIM).
    The magnitude of perceivable colors (color volume) was measured by the product
    of the standard deviations of the LAB color-space channels. In terms of SSDH and
    color volume, the proposed method significantly outperformed previous approaches.
    When assessed using alternative metrics, other methods performed equally well.
    However, these other methods required similar tissue distributions in the input
    and reference images, and therefore also required careful selection of a reference
    image. The proposed method overcomes these challenges, while providing an end-to-end
    algorithm to perform stain normalization, with the caveat that introduction of
    contextual information in the conversion model did introduce some undesirable
    textural changes.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Generative models have also been applied for histopathological stain color
    normalization. Zanjani et al. [32] introduces fully unsupervised generative models
    for stain-color normalization. The GAN model includes a generator network, discriminatory
    network, and an auxiliary network. The images are converted to CIE-LAB color space,
    and the lightness channel is passed into the generator, and only the chromatic
    channels are generated by the GAN. The auxiliary network is based on the InfoGAN
    architecture [33] in order to maximize the information present in the generated
    image. The variational autoencoder (VAE) model [34] is inputted with the H&E image
    in the HSD color space, with the encoder being trained to segregate the input
    image into tissue channels. The parameters of the color distribution are computed
    per tissue class. The decoder network reconstructs the chromatic channels of the
    input image. The deep convolutional Gaussian mixture model (DCGMM) used by these
    authors was a fully convolutional network jointly optimized with the parameters
    of a Gaussian mixture model (GMM). The DCGMM fits the GMM to the pixel-color distribution
    while being conditioned on the tissue classes. The detection of the tissue classes
    is done by exploiting CNN embeddings, in similar fashion to the output of encoder
    of a VAE. The algorithms were evaluated with a normalized median intensity (NMI)
    measure to assess color constancy of the normalized images. Out of the three models,
    and compared with previous state-of-the-art results, the DCGMM had highest performance,
    with the lowest standard deviation and coefficient of variation. While these models
    do not make assumptions about H&E image content, they do rely on other assumptions
    such as various hard-coded thresholds and nuclei shape fitting that may not be
    applicable to other tissue types.


    The stain color normalization problem can also be reformulated as an image translation
    task. For example, in Shaban et al. [23], a CycleGAN was trained to reduce interscanner
    variability (Fig. 7.2D). The stain normalization task was reformulated as image
    translation between images from two different scanners. The CycleGAN, termed StainGAN
    in this study, outperformed other methods in terms of SSIM, FSSIM, Pearson correlation
    coefficient, and PSNR. StainGAN was also applied as a preprocessing step for cancer
    classification on the Camelyon16 dataset. The StainGAN improved the AUC-ROC of
    classification when compared with no normalization and alternative normalization
    preprocessing steps. The use of a GAN also eliminates human error that can arise
    when an expert is called upon to manually select a reference slide for normalization.
    While this application was tasked to decrease interscanner variability, similar
    models could be used for interlaboratory variability as well.


    Tellez et al. [35] also developed a network-based stain normalization algorithm
    by formulating it as an image translation problem. The authors trained a U-net
    architecture to reconstruct the original images from inputted augmented images.
    The model was trained on a multiorgan, multisite dataset. They also performed
    systematic multicenter evaluation of several other stain color augmentation and
    normalization algorithms. A total of four classification tasks spanning different
    centers were used to determine the effect of data augmentation and stain normalization
    on the'
