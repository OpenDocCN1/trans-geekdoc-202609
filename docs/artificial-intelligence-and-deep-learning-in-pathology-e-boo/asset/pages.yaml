- pgno: 139
  md: 'In certain settings, staining procedures can result in irreversible modifications
    or damage; this is usually regarded as disadvantageous as it can preclude further
    analysis of the tissue. However, this is particularly true in the special case
    of sperm cell selection for in-vitro fertilization (IVF) due to the potential
    cytotoxicity of staining. Interferometric phase microscopy (IPM) is currently
    used for sperm evaluation, as it is compatible with available medical microscopes
    which are modified with an additional wavefront sensor to allow for holographic
    microscopy. This combination provides quantitative topological maps of the cells
    without the need for stains. However, morphological evaluation of cells is most
    effectively accomplished using chemical staining of cell organelles. A method,
    “HoloStain,” was therefore developed to convert quantitative phase images and
    phase gradient images, which are extracted from the digital holograms, to virtually
    stain brightfield images using DCGANs [39]. For each cell, an ensemble of four
    images was used to train the model: stain-free quantitative phase image, two stain-free
    phase gradient images, and the target-stained brightfield image. An advantage
    of HoloStain is that cells that were out of focus could be virtually stained and
    refocused. This is possible since digital reconstruction of the holograms can
    be done such that unfocused cells can be brought into focus. In order to demonstrate
    the usefulness of the algorithm, sperm cells were classified by an embryologist
    using data from brightfield images (no staining), stain-free quantitative phase
    images, one of the stain-free gradient images, and HoloStain images. The HoloStain
    method had the highest F1 score compared with the alternative three methods.


    While most research studies employ GANs, it is also possible to use image-style
    transfer algorithms as an alternative approach as demonstrated by IzadyYazdanabadi
    et al. [10]. In particular, the authors sought to convert confocal laser endomicroscopy
    (CLE) images to H&E. CLE is a real-time, in vivo intraoperative imaging technique
    with high potential to assist neurosurgeons during surgery. The authors developed
    a transformation tool that can remove common CLE artifacts, add histological patterns,
    and avoid removing critical features or adding unreal features to images (Fig.
    7.3D). Unfortunately, due to problems in exact colocalization and intrinsic tissue
    movements, it is difficult to obtain spatially registered H&E-CLE image pairs.
    Instead, the authors used an image-style transfer algorithm using a pretrained
    VGG19 architecture and a content and style loss. One advantage of style transfer
    is that it only requires a single image of the desired style (H&E). Five neurosurgeons
    independently judged the stylized CLE images as having a significantly higher
    diagnostic quality than the original CLE images.


    The potential for these methods is quite high, as well as being quite close in
    terms of implementation, with multiple groups working on clinical trials. The
    quality of images acquired from these methods greatly exceeds the current gold
    standard for real-time pathology, frozen sections, which introduce artifacts that
    can render evaluation challenging. By converting images from fluorescence color
    scheme to one immediately familiar to the pathologist, the odds of adoption increase
    dramatically. These imaging modalities have the potential to become a new gold
    standard of real-time pathology in the near future; hence the widespread interest
    in accurate color mapping.'
