  md: '# Overview of the role of artificial intelligence in pathology: the computer
    as a pathology digital assistant


    John E. Tomaszewski, MD


    SUNY Distinguished Professor and Chair, Pathology and Anatomical Sciences, University
    at Buffalo, State University of New York, Buffalo, NY, United States


    # Introduction


    As this chapter goes to press, two great waves of change are sweeping through
    the science and the practice of medicine. These are the molecular revolution and
    computational analytics. These two scientific movements are radically altering
    the ways in which we approach all aspects of human biology. Previous chapters
    have discussed machine learning strategies in detail, with an emphasis on deep
    learning via various kinds of neural networks, ranging from basic convolutional
    models to advanced architectures such as graphic and capsule networks. In this
    chapter, I will describe the overall framework in which digital and computational
    pathologies are embedded, summarize these various strategies, and provide examples
    from the literature that illustrates many of the topics covered. This overview
    is designed to show how pathology is evolving and will continue to evolve in the
    age of artificial intelligence (AI). One major thesis is that human pathologists
    will not be replaced by computers. Instead, the computer will serve as a highly
    capable “digital assistant,” and this synergistic pairing of human intelligence
    (HI) and AI will ensure that pathology will be a major driver of personalized
    medicine.


    # Computational pathology: background and philosophy

    The current state of diagnostics in pathology and the evolving computational opportunities:
    “why now?”


    Diagnostic pathology in the early 21st century is still very much an analog enterprise
    which uses a work process that was developed in the early 20th century and which
    has been substantially carried forward into the early 21st century. The processes
    of chemically treating and processing tissue, microtomy, staining, and the creation
    of'
