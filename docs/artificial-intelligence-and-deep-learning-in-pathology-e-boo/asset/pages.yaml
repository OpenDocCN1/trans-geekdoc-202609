  md: 'required labeling cells with dots. Another recent approach that focuses on
    reducing the requirement for training data is the development of super-resolution
    methods that are designed to predict high-resolution labels by primarily utilizing
    low-resolution training data, generally augmented with sparse high-resolution
    training data [153]. Generating training data in these approaches involves a combination
    of labeling patches to indicate density of different cells in each patch that
    is supplemented with dot annotation.


    The emergence of mIHC and mIF and their natural combination with digital pathology
    and deep learning methods for quantitative IHC interpretation has the potential
    to address the challenges that can enable this kind of rich information from multiple
    biomarkers to become routinely used to provide clinically useful prognostic and
    predictive information [29–31,42,136,142,148]. There appears to be much less doubt
    and increasing excitement about methods that interrogate and quantify the nature
    of the interactions among the different types of immune cells in the TME to provide
    useful prognostic information by identifying key immunoregulatory cells. The potential
    of identifying clinically actionable insights from using mIHC and artificial intelligence
    to stratify patients for targeted immunotherapy in the neoadjuvant and adjuvant
    settings are too important to ignore [42,130]. Thus, development of new methods
    are absolutely necessary if mIHC and mIF are clinically adopted. If, and when,
    these methods become full-fledged methods to enable clinical decision support
    to guide treatment and provide prognostic information, rigorous evaluation, testing,
    and validation will be undoubtedly required. Since several commercially available
    mIF and mIHC methods have emerged recently, the future appears very bright for
    the incorporation of these methods into mainstream translational cancer research.


    # Vendor platforms


    Deep learning algorithms have also found their way into commercial platforms.
    Commercial software for analysis of the immune infiltrates include the Genie Spectrum
    (Aperio ePathology Solutions, Vista, CA) [154,155], Image-Pro Plus 3.0 (Media
    Cybernetics, Silver Spring, MD) [156], Halo (Indica Labs, Corrales, NM) [151],
    ImageJ [157], VMscope (VMscope GmbH, Berlin, Germany) slide explorer [2], Vectra/inForm
    (PerkinElmer, Waltham, MA, USA) [158], SlidePath (Leica Biosystems, Wetzlar, Germany)
    [159], Tissue Studio (Definiens, Munich, Germany) [146], Author AI (Visiopharm
    Corporation, Westminster, CO, USA), and many others. A commercially available
    image analysis software platform, WebMicroscope, has also been utilized to (1)
    identify tissue regions containing TILs and (2) count the number of lymphocytes
    in each region [160], where the authors observed that TIL density in seminomas
    had prognostic relevance regarding disease relapse. PaigeAI and PathAI are also
    examples of companies that advertise the ability to carry out combinations of
    region characterization and cell identification in H&E WSIs as part of their respective
    efforts to develop deep learning applications to deliver more accurate diagnosis.'
