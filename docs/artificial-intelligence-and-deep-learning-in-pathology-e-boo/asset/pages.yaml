- pgno: 49
  md: '# Overview of advanced neural network architectures


    Benjamin R. Mitchell, BA, MSE, PhD


    Assistant Professor, Department of Computing Sciences, Villanova University, Villanova,
    PA, United States


    # Introduction


    The field of deep learning has expanded rapidly over the past few years, and modern
    practitioners now use a wide range of methods and techniques to achieve state-of-the-art
    performance. Many of the best performing systems now use architectures that are
    significantly more complex than the fully connected feed-forward networks used
    in the past. These techniques draw inspiration from a range of different fields,
    including statistical methods, time series analysis, game theory, information
    theory, operant conditioning, genetic evolution, and modern neuroscience (though
    for the last few it is worth a reminder that “inspired by” is not the same as
    “accurately modeling”).


    This chapter will cover some of the most popular variations, including residual
    connections (ResNet), unsupervised pretraining (Autoencoders), transfer learning,
    generative models (GANs), recurrent networks (LSTMs), reinforcement learning,
    ensemble methods, and evolutionary algorithms. When reading this chapter, keep
    in mind that the methods presented are largely ways of modifying or expanding
    on the basic techniques presented in the previous chapter. This is done to address
    problems where those basic techniques are insufficient. The techniques described
    here can be used to address problems such as computational efficiency, classifier
    accuracy, and lack of large amounts of labeled training data.


    # Network depth and residual connections


    The “depth” of a deep neural network can be highly variable depending on the task.
    In the earliest days of artificial neural networks, most networks were “shallow,”
    meaning they did not have hidden layers. This was not because the early network
    designers did not want to have deeper networks; rather, it was because early researchers
    had no reliable method for training these deeper networks. As time progressed,
    developments in the field have allowed for the successful training of deeper and
    deeper networks. Today, some networks may have hundreds of hidden layers.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The primary advantage of adding more hidden layers is that it allows the network
    to encode more complex functions. Since each layer takes the output of the previous
    layer as its input, each layer can be thought of as computing some sort of abstract
    "features" of the previous layer. Thus, each additional layer can compute a more
    abstract and complex function of the original data. A deeper network has more
    computational power than a shallower one, at least in theory.


    In practice, this theoretical power may not always be easy to realize. There are
    several practical problems that can arise from adding extra hidden layers. The
    first, and simplest, is the fact that adding more hidden layers means adding more
    connections. Those extra connections give the network more representational power,
    but they also represent extra parameters which we must propagate information through
    and learn good values for. In other words, more connections means the network
    will operate more slowly and may take more epochs to train.


    Even if we are willing to pay the computational cost of adding more connections,
    there is another phenomenon which can arise with too many hidden layers: the vanishing
    gradient problem. Since the standard method for learning weights in a neural network
    is using error backpropagation via the chain rule, the more hidden layers there
    are the more times we must "chain" the derivatives together. This can lead to
    the gradient becoming flattened and "diffused" as we get farther and farther away
    from the output units. This problem is particularly severe when using sigmoid
    activation functions, since the sigmoid function will always have a derivative
    between 0 and 1, and multiplying small numbers yields even smaller numbers. This
    is the primary reason that most modern neural networks use a rectified linear
    (ReLU) activation function [1]; the ReLU activation is less prone to gradient
    diffusion, allowing deeper networks to be used successfully.


    However, even with the use of ReLU units, there are practical limits to how deep
    a simple feed-forward network can be successfully trained. In order to push depth
    beyond that limit, more advanced network architectures are required. One method
    which has become very popular in recent years is the use of residual connections
    [2]. This involves creating connections which "skip" one or more layers (also
    sometimes called "skip connections") (Fig. 3.2). In typical modern practice, these
    residual connections do not have tunable weights, but rather are a way to simply
    copy the activation from a lower level.


    The key mathematical insight behind making these connections "skip" a layer is
    that it makes it much easier for that layer to "learn" to replicate the input
    of the previous layer; with the addition of the residual connections, simply outputting
    0 will result in the output value being equal to the node the residual connection
    originates from. In effect, any nonzero output of the node is now added to the
    value from the earlier layer, rather than replacing it (as would be typical in
    a standard feed-forward network).


    The term "residual" means the leftover or remaining error. In the case of residual
    connections, the idea is that each additional layer of the network now only has
    to try to fit the residual error, which simplifies the learning process. The result
    is that networks that make use of residual connections can be made much deeper
    than are possible otherwise, without falling prey to gradient diffusion or other
    optimization difficulties. The term ResNet may be used to refer to the original
    network'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/ec668102bd6cbe5645156f246a7c2e8b_51_0.png)


    # FIGURE 3.1


    An autoencoder network is trained to reproduce its inputs with as little reconstruction
    error as possible. Since the hidden layer has fewer units than the input and output
    layers, this means the network learns to produce a reduced dimensionality encoding
    in the hidden layer. This is an “unsupervised” training process, since it requires
    no additional human annotation to the raw data.


    proposed using this type of connection [2], but the term is also sometimes used
    to refer to any network making use of residual connections.


    # Autoencoders and unsupervised pretraining


    One of the known drawbacks of deep neural networks is that they require very large
    amounts of data to train. This is a natural consequence of the power of the model;
    the more connections a network has, the more “power” it has to encode complex
    functions. However, it has long been known that the more parameters we need to
    estimate, the more data necessary to estimate good values for them. Since deep
    neural networks can have millions of free parameters, it is unsurprising that
    very large datasets may be needed to train them. As a few examples, the MNIST
    data set is a classic benchmarking set that has been around for over 20 years
    [3,4]. These days, it is considered a “toy” problem due to its comparatively small
    scale and the ease of achieving high performance. However, even this “small” data
    set has 60,000 images for training. The ImageNet data set, which is a more modern
    benchmarking set, consists of over 15 million high-resolution images [5]. In practice,
    many authors use only a subset of this full set, but even the subsets tend to
    have over a million MNIST images.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'This requirement for very large training sets would already be enough to potentially
    limit the problems that deep neural networks can be applied to, but the true scenario
    is even worse. Not only do we need very large amounts of data, most deep networks
    are trained using backpropagation, which is a supervised learning method. This
    means that we need a human-annotation giving the correct label (i.e., desired
    output) for each and every one of our millions of training examples.


    For some tasks, this process can be crowdsourced; for instance, the ImageNet data
    set was created using Amazon’s Mechanical Turk to pay large numbers of unskilled
    annotators to label images which had been scraped from the web [5]. Unfortunately,
    for many problems of interest, it is not possible to rely on unskilled annotators.
    In fields like medical imaging, it is common that humans require a


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_52_0.png)


    # FIGURE 3.2


    Many modern deep networks make use of skip connections, which allow for easier
    optimization in very deep networks. Here, the units in the first layer have direct
    connections to corresponding units in the third hidden layer, in addition to their
    “normal” connections to units in the second hidden layer.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'significant amount of training to be able to correctly and reliably annotate
    images. Thus, even if a large set of images can be collected, it may not be practical
    to annotate them all. In this scenario, in which a large amount of data is available
    but only a small portion can be annotated, pure supervised learning is unlikely
    to succeed. Fortunately, we do have other options.


    One method for handling this scenario is called *unsupervised pretraining*. The
    idea behind unsupervised pretraining is that, prior to applying a supervised learning
    technique, we will first apply an unsupervised learning technique in an attempt
    to make the final supervised optimization problem easier.


    A classic example of this is to first train one or more layers of a neural network
    as an *autoencoder* [6]. The autoencoder is trained simply to reconstruct its
    input; that is, the desired output is merely a copy of the input (Fig. 3.1). If
    the network has enough hidden nodes, this task becomes trivial, but if the network
    is restricted in capacity then it is forced to learn some low-dimensional encoding.
    This can be thought of as analogous to a lossy compression scheme; the “compressed”
    data are encoded by the activations of the hidden nodes.


    A single autoencoder layer is trained using backpropagation, which is a supervised
    learning technique; however, the “correct output” values are just a copy of the
    input values, meaning no human annotation or labeling is required. Thus, the method
    as a whole is considered an unsupervised technique. If an even more abstract and
    compressed representation is desired, we can use the output of one autoencoder
    layer as the input for another. The result is called a *stacked autoencoder*.


    A similar style of network can be generated using a restricted Boltzmann machine
    (RBM) instead of a feed-forward network; the result of stacking RBMs is sometimes
    called a *deep belief network*. The training method for RBMs is quite different
    (see Ref. [7] for details), but for the purposes of unsupervised pretraining,
    the end result is functionally similar.


    Once the unsupervised model has been trained, it is then used as the basis for
    a supervised model, typically by simply adding one or two extra fully connected
    layers to the top. At that point, the entire network is trained using a standard
    supervised approach. The intuition behind the use of unsupervised pretraining
    is that the “unsupervised” step is essentially finding a feature-based representation
    of the data suitable for reconstructing the original inputs. So long as a similar
    set of features is useful for classification, pretraining the network in an unsupervised
    setting can allow the supervised learning stage to achieve good convergence even
    in cases where the amount of labeled data would otherwise be too small to allow
    it.


    It should be noted that unsupervised pretraining is not a magic bullet; in particular,
    it can reduce the amount of labeled data required to a point, but there will still
    be a point at which there is simply too little labeled data to learn a model which
    generalizes well. Additionally, it is nearly always the case that unsupervised
    pretraining will be outperformed by fully supervised training using the same amount
    of data (i.e., if you have labels for all your data, you are better off simply
    doing supervised training from the beginning).


    That said, this is still a potentially useful method, particularly in cases where
    acquiring large amounts of labeled data is considerably more expensive than acquiring
    large amounts of unlabeled data. Additionally, there are a number of'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'more recent variations on the autoencoder idea which may have advantages on
    certain tasks. Variational autoencoders [8] and sparsity [9] are some examples.


    # Transfer learning


    Another potential way around the problem of not having enough data to train a
    deep neural network is the process of transfer learning [10]. Similar to unsupervised
    pretraining, transfer learning is a method to “start” learning on your data set
    using a network with weights that have already been pretrained. The difference
    is that in transfer learning, the “pretraining” is achieved by simply doing regular,
    supervised learning on a different-but-related problem. Here, the key insight
    is that if two problems involve similar data, then the low-level features needed
    to solve one problem are likely to be useful for the other as well.


    To perform transfer learning, the first step is to train a deep neural network
    on some data set which is large, and as similar as possible to the task you ultimately
    want to do. In particular, the similarity of the data is the most important. What
    this means in practice is that if you want to train a digit classification network,
    MNIST is a reasonable data set to start out with. However, if you want to classify
    natural images of the world, a network trained on MNIST is likely to transfer
    poorly. Instead, a network trained on the ImageNet data set would likely give
    a much better result, since that data set is already composed of natural images
    of the world.


    One potential issue here is that training a large, complex network on a large,
    complex data set requires a large amount of computational hardware (and/or a lot
    of training time). Fortunately, in many instances, it is possible to use a pretrained
    network created by someone else. Several prominent “pretrained” networks are available
    to download for a variety of deep learning toolkits; check the information for
    the deep learning library you are using to find out what is available.


    The actual transfer learning process involves taking a pretrained network, removing
    the fully connected “topper” on the network that does the classification, and
    replacing it with a new fully connected “topper” (with randomly initialized weights).
    At this point, the network is trained as usual using your data set. Again, the
    primary advantage is that the training can succeed with a much smaller labeled
    training set than would be required to train the same network “from scratch” (i.e.,
    starting with randomly initialized weights).


    It is also possible to selectively update only part of the network. This is primarily
    useful if you are using a large pretrained network and have limited computational
    power available, as it will speed up training, but can result in lowered accuracy
    if done too aggressively. Here, the idea is that when performing the training
    for your data set, the uppermost layers of the pretrained network are the ones
    most likely to be significantly changed by the secondary training process. Therefore,
    it is possible to “freeze” the weights of the lower layers of the pretrained network,
    and only update the weights for the top few layers. Since many architectures have
    a lot more connections at lower levels than they do at higher levels, this can
    often result in a significant speedup of training.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # Generative models and generative adversarial networks


    The type of network we have dealt with so far is aimed at the task of classification.
    While classification networks are by far the most popular type, they are not the
    only type used. There are several other types of problems that can be tackled
    using machine learning, and one of them is the problem of generative modeling.
    A *generative model* is one which can be used to “generate” new examples. The
    basic task is to take in a set of examples and then construct new examples that
    are unique, but are similar to the examples the system was trained on. In statistical
    terms, the goal is to model the distribution that the training samples were drawn
    from and then generate new samples drawn from the same distribution.


    There are several cases in which it might be worthwhile to train such a generative
    model. Firstly, we might directly want the outputs, that is, the generation of
    plausible synthetic examples may be useful in its own right. Second, we may view
    the generative model as another way of finding potentially useful features, which
    we could then exploit as a method of unsupervised pretraining. Third, we may be
    interested in a conditional generative model, which is a fancy way of saying that
    we are interested in transforming inputs, rather than creating them from whole
    cloth. For instance, taking an image and generating a version in the style of
    some famous artist. All three of these things are possible using generative models.


    In the context of deep neural networks, the most popular generative model is called
    a *generative adversarial network* (GAN) [11]. GANs work by creating two networks
    and training them in competition with one another. The first network is called
    the *generator*, and it is responsible for generating plausible synthetic examples.
    The second network is called the *discriminator*, and it is responsible for distinguishing
    between “real” examples (taken from the training set) and “fake” examples (created
    by the generator). These two networks are effectively playing a zero-sum game,
    in which each player’s success must come at the expense of the other. The only
    way for the generator to win is to come up with examples that the discriminator
    cannot tell apart from real examples; the only way for the discriminator to win
    is to figure out how to recognize the generator’s artificial examples.


    Training proceeds by first initializing each network randomly, and then alternately
    updating first one, then the other. Updating the discriminator network is simple,
    since it is a basic application of backpropagation; since we know which examples
    are real and which are fake, we have “ground truth” labels. Updating the generator,
    however, would seem to be more difficult; how do we define an error function for
    the generator?


    The answer is at the heart of what makes GANs such a clever idea: since the output
    of the generator is used as the input to the discriminator, we can view the combined
    generator-plus-discriminator as being just one big network. If we take this view,
    we can then propagate error from the discriminator back all the way down to the
    bottom of the generator. Of course, when we are training the generator, we want
    to *minimize* the performance of the discriminator, so we cannot update the weights
    for the discriminator when we are training the generator. By alternating'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'which network gets updated (always freezing the weights of the other), the
    overall performance of both players will slowly improve. Every time the generator
    finds some loophole in the discriminator, the discriminator is forced to fix the
    loophole. Every time the discriminator discovers flaws in the generated content,
    the generator must make its output more realistic to fix the flaws.


    Thus, over many iterations, the generator slowly converges toward producing synthetic
    examples that are indistinguishable from the real examples. Of course, in practice
    there are several complicating factors that mean the system may not always converge
    as well as we would like, especially if the distribution we are trying to simulate
    is highly complex. Nevertheless, GANs are useful in many domains where generating
    synthetic examples is desirable.


    # Recurrent neural networks


    While convolutional networks perform very well on image and imagelike data, convolution
    is not always the best choice for all types of problems. One popular alternative
    for sequential data is a *recurrent* network. The basic idea behind a recurrent
    network is that for sequential or time-series problems, the “current” input may
    not be sufficient to successfully solve the problem. In other words, the problem
    requires some access to past information to solve correctly.


    It is possible to address this by simply feeding the network multiple time points
    concatenated together as a single ‘input,’ but this approach has some limitations.
    In particular, the size of the temporal window is fixed; for example, if we use
    a window of size 4 (i.e., feed the network the last 4 timesteps as its input),
    then we cannot capture temporal dependencies longer than 4 timesteps. Additionally,
    for every extra timestep of history we add, the complexity of the network (i.e.,
    number of nodes and weights) increases dramatically, which often makes the use
    of long temporal windows impractical.


    It is possible to do convolution in the time domain (see, e.g., Ref. [12]), but
    if longer temporal histories are required, the classic approach is to use a recurrent
    network. The term “recurrent” here refers to the fact that the hidden nodes have
    some access to their own previous states; that is, the value of a hidden node
    at time *t* is dependent on its inputs at time *t* as well as its own state at
    time *t − 1* (and possibly the states of other hidden nodes at time *t − 1*).


    In the earliest recurrent networks, this was a direct dependence, meaning that
    the previous states were treated just like any other input to a node; however,
    this proved to be somewhat inflexible. More recent work typically uses a type
    of node called a *long-short term memory* (LSTM) [13]. In modern parlance, there
    are some who use the terms “LSTM” and “recurrent network” interchangeably, though
    this can sometimes lead to confusion. It is also worth noting that there are a
    number of minor variations on LSTMs which may be encountered, but at a high level
    they have fairly similar properties (see Ref. [14]). The GRU [15] is probably
    the most well known of these.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'These modern recurrent networks make use of “gates” to allow a context-dependent
    decision about when to make use of the prior value of a hidden node, and when
    to ignore it. This allows, for example, a sequence delimiter (such as a punctuation
    mark in text data) to be handled intelligently by the network. In general, LSTMs
    are significantly more flexible and powerful than their older counterparts, and
    in the context of modern work it would be highly unusual to use units without
    some sort of gate in any type of recurrent network.


    As with any other architectural building block, LSTM units are typically arranged
    in layers, and in modern practice these layers are often stacked to create deep
    recurrent networks.


    The operation of LSTMs is not quite as well suited to massively parallel GPU implementations
    as their convolutional counterparts, so training LSTMs is typically slower than
    training convolutional neural networks (CNNs). However, for some types of tasks,
    they are still the right choice. For example, most modern machine translation
    systems make use of LSTMs (see Ref. [16] for a popular example from Google).


    # Reinforcement learning


    Most neural network models are trained in a “supervised” fashion, meaning that
    the system is given a labeled training set consisting of hand-labeled input-output
    pairs. However, for some types of task this is not practical. In particular, for
    sequential decision problems, it is often the case that we can only accurately
    assess the performance of the system at certain points. A common example is trying
    to train a network to play a game like chess or Go; until the game is over, we
    do not know whether the strategy being employed is a good one or not. This means
    we cannot train the network to decide what moves to make in the middle of the
    game using standard supervised learning.


    The idea of *reinforcement learning* was developed for situations like this. Inspired
    by operant conditioning, reinforcement learning works by providing a “reward”
    signal that tells the system when it is doing well and when it is doing poorly.
    Over time, the system experiments and through trial and error discovers a policy
    that will maximizes its expected reward.


    The classic formulations of this algorithm are based on the formalism of a Markov
    decision process (MDP). An MDP encodes a problem as a discrete set of possible
    states and actions, along with a transition model that specifies a probability
    distribution over possible “next” states, given a current state and choice of
    action. Given a “reward” function that specifies what reward the agent receives
    for being in any given state, it is possible to use an iterative approximation
    algorithm to determine the optimal action to take in any state, where “optimal”
    is defined as the action that leads to the highest expected future reward. It
    is also common to add a “discount” factor, which allows us to downweight future
    expected gain based on how distant it is; by tuning this parameter, we can make
    the agent optimize for more short-term or more long-term reward.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Unfortunately, this method is limited by the fact that the transition model
    needs to be fully specified as an input; in real-world problems, this is often
    not the case. If we need to discover the transition probabilities, the problem
    becomes more difficult. It can still be solved, using algorithms like adaptive
    dynamic programming and Q-learning, but these algorithms tend to converge very
    slowly. Furthermore, there is an additional difficulty that arises, which is that
    the agent’s own decisions control which state-action sequences it gets observations
    from. As a result, there is a need to ensure sufficient “exploration” of the state-action
    space that takes place to avoid converging to poor local optima. Simply taking
    random actions will result in a high degree of exploration, but in most real-world
    problems, some areas of the state-action space are more productive than others,
    so it is inefficient to spend a lot of time exploring choices that we already
    know lead to bad outcomes. This is known as the “exploration/exploitation dilemma,”
    and it is yet another reason that convergence is so slow; if we are too aggressive,
    we can get premature convergence to a bad solution.


    These classic reinforcement learning algorithms are limited in that they tend
    to work best on small, discrete state spaces, and do not scale well to complex,
    high-dimensional problems. One of the fundamental issues is that reinforcement
    learning treats each state in the state-space as atomic, meaning that information
    about each state must be learned separately, even if the states appear to be “similar”
    to a human. The combinatorics means that for large state-action spaces, the number
    of training runs needed to get good estimates can become intractable.


    The solution to this is to use a technique known as function approximation, which
    means that instead of directly learning the expected utility of taking a given
    action in a given state for each state, we use some sort of regression techniques
    to learn an approximation. The primary advantage of function approximation is
    that, in addition to making the combinatorics less bad, it can also allow a means
    to treat states as nonatomic, meaning we can learn based on similarity between
    states (i.e., if we have encountered a similar state in the past, we may assume
    that this state will have a similar expected reward).


    It is particularly convenient to use a neural network as the function approximator
    for reinforcement learning because neural networks can be trained in an online
    fashion (i.e., one training example at a time), allowing them to be updated after
    each action. In recent years, deep neural networks have become increasingly popular
    for this, allowing for better scaling to large and complex problems. Many recent
    successful solutions to games have made use of reinforcement learning for training,
    including results on Atari games [17] and Go [18].


    The primary downside of reinforcement learning is its lack of computational efficiency;
    training via reinforcement learning is very slow compared with fully supervised
    learning. For problems where fully supervised learning is an option, it is typically
    preferred. However, reinforcement learning opens up the possibility of solving
    an entire class of problems that would otherwise be intractable, making it a very
    valuable technique for that class of problems.'
