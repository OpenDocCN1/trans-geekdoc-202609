- pgno: 189
  md: 'invasive and in situ carcinoma) on breast WSIs. Annotated tumor on the WSIs
    were used for patch-based training of the CNN classifier. They further developed
    their work in Ref. [43] by creating a fast high-throughput CNN-based method for
    automatic detection of invasive breast tumor on WSIs. For this, they used an efficient
    adaptive and iterative sampling method based on probability gradients to efficiently
    identify the precise extent of the invasive breast cancer, obtaining comparative
    results to those using dense sampling. Bejnordi et al. in Ref. [47] assessed and
    compared the performance of deep learning algorithms submitted to a public challenge
    to detect metastases in H&E tissue sections of lymph nodes in women with breast
    cancer. Seven out of 32 deep learning algorithms submitted to this competition
    showed greater discriminating performance than a panel of 11 pathologists in a
    simulated time-constrained diagnostic setting.


    The task becomes more complicated when attempting to both detect tumor and classify
    architectural heterogeneity on WSIs. This can be as simple as separating benign
    from malignant to distinguishing invasive disease, in situ carcinoma, proliferative
    entities, reactive patterns, and normal structures. Machine learning and more
    specifically deep learning techniques have provided state-of-the-art results in
    automated detection and morphologic classification in histopathology images. Bardou
    et al. [44] developed and compared two approaches for the classification of breast
    cancer histology images into benign and malignant classes, as well as their subclasses.
    In the first method, they extracted a set of handcrafted features encoded by bag-of-words
    and locality-constrained linear coding descriptors, and used support vector machines
    for the classification of features. In the second approach, they trained a CNN
    for the classification of a large labeled image dataset. Although the deep learning
    approach has many advantages including outperforming the handcrafted approach
    as well as automated feature generation, it is worth mentioning that one of the
    drawbacks of this approach is that the features are not transparent as they are
    embedded in the neural network architecture. Using a context-aware stacked CNN
    approach, Bejnordi et al. [48] classified whole slide breast images into normal/benign,
    in situ, and invasive classes. They first trained a deep CNN with high pixel resolution,
    but small image size, to classify the tissue into different classes. Then, they
    fed much larger images to the model and used the extracted feature responses generated
    by the initial model as input to a second CNN. This architecture allowed them
    to use a larger input image to learn the global interdependence of various structures
    or context in different lesion categories.


    We have developed a robust ensemble CNN-based technique for classification of
    clinically significant architectural and morphologic patterns into four types:
    normal tissue, benign (proliferative) entities, in situ carcinoma, and invasive
    cancer. We incorporated image perturbation models specifically designed for digital
    pathology images for training the classifiers, which increased robustness and
    generalizability of the classifier to real-world image data variability [49].
    A review of the state-of-the-art methods with their performance and collective
    results on a public challenge is given in Ref. [50]. Fig. 9.5 shows the results
    of our developed technique applied specifically to the histologically relevant
    areas of the WSI given in Fig. 9.4.'
