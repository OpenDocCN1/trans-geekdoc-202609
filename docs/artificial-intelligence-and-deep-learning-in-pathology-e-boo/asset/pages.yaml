  md: 'The actual situation is not that simple. As the dimensionality of the space
    increases, the loss function curve can get complex. In Fig. 2.13 it can be seen
    that there is no single minimum; instead there are local minima that can be reached
    by different starting trajectories. There is no computationally efficient way
    of calculating the true global minimum. However, in practice, local minima are
    good enough for excellent algorithmic performance. One can always take different
    starting points for the weights and compare outputs as a way of sampling the local
    minima.


    This process is refined over the set of training examples. Backpropagation is
    one of the reasons that training sets for deep learning must be large. Interestingly,
    if the network has too many layers, training can suffer. As we proceed further
    and further backwards down the net the weighting corrections get smaller and smaller
    and they will become closer and closer to zero. This is known as the vanishing
    gradient problem. It can be overcome in a specialized ANN known as a residual
    neural network, which will be covered in the next chapter.


