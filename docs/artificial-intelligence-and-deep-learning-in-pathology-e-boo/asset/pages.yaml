- pgno: 26
  md: 'To treat novel samples on or close to the line, we look for a point in the
    training space closest to the novel point and assume that they are in the same
    class. However, the points may be exactly halfway between two points in two different
    classes, the test point itself might be inaccurate, and the data might be “noisy.”
    The solution is the **K-nearest neighbor algorithm (KNN)**, which, though simple,
    is a strong machine learning strategy. Just use several (K) nearest neighbors
    instead of one and go with the majority, or use an average or weighted average.


    It has already been noted that this may, at first glance, seem no better than
    a rules-based algorithm involving statistical analysis. However, consider the
    situation where the number of attributes (feature vector) has hundreds or thousands
    of attributes rather than just two.


    Even with more complex but still linearly separable plots, there are often many
    different ways to draw the boundary line, as illustrated in Fig. 2.3A. In fact,
    there are an infinite number of linear separators in this example. The best line
    is the one that provides the greatest separation of the two classes. For this
    purpose, we obviously need to consider only the closest points to the line, which
    are known as support vectors. Using these, the algorithm creates a line that is
    farthest away from all the points in both the clusters (Fig. 2.3B). The algorithm
    that does this is known as a **support vector machine (SVM)**.


    An SVM can do much more than finding optimal linear boundaries. It can even transform
    nonlinear data to a linear form by transforming the data in a new coordinate system
    in a higher dimensional space by means of a kernel function, which itself involves
    only linear operations. This is known as the “kernel trick.”


    Fig. 2.4 shows, in the right, an example of two classes without a linear boundary
    that can separate them. In this example, there are two classes, each with two
    defining attributes. Clearly there is no linear boundary that can separate them.
    In this case, a circle (nonlinear boundary) will do the job. However, if you imagine
    pulling one class up into the third dimension, as shown on the left of Fig. 2.4,
    then it is easy


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_26_0.png)


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_26_1.png)


    # FIGURE 2.3


    A): Possible linear separators for the clusters shown. (B): Support vectors are
    used to construct the line that best separates them.'
