  md: 'Gland segmentation in colon histopathology has a significant literature. The
    gland segmentation in colon histology images (GlaS) grand challenge [25] in computational
    pathology asked participants from the computer vision and medical imaging research
    communities to develop and compare gland segmentation algorithms of benign colonic
    glands and colon cancer glands. Accuracy of the detection of individual glands;
    volume-based accuracy of the segmentation of individual glands; and the boundary-based
    similarity between glands and their corresponding segmentations were the metrics
    for comparisons. Gland detection accuracy was performed using the F1 score (2×
    precision × recall/precision + recall). Volume-based segmentation accuracy was
    evaluated using the dice index which is a measure of agreement or similarity between
    two sets of samples. In this competition, these sample sets included a set of
    pixels corresponding to a ground truth object (G) and a set of pixels belonging
    to a segmented object (S). Boundary-based segmentation accuracy between ground
    truth (G) and segmented object (S) was evaluated using object-level Hausdorff
    distances. In general, two broad approaches to gland segmentation were employed
    by the competitors. The first approach was to start by identifying pixels belonging
    to glands which were then grouped to form a separate spatial glandular object.
    The second approach began with candidate objects which were then classified as
    glands or non-glands. All of the methods which were based on CNNs used the first
    approach. Only one method followed the second approach whereby candidate objects
    forming part of the gland, namely lumens or epithelial boundaries, were identified
    first and then classified into different types followed by full gland segmentation.
    Overall, the pixel-based CNN entries had the strongest performances. A novel DCAN
    [19] (Chen et al., read also below) was the overall winner of the challenge.


