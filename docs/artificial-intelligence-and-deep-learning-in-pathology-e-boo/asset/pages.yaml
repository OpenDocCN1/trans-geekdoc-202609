  md: 'focused dataset [13]. This takes advantage of the fact that many of the convolutional
    layers derived from large-dataset-derived models serve to extract general, low-level
    features. Therefore, only some of the layers of models that were pretrained on
    larger datasets are subsequently retrained on the smaller dataset. This process
    is known as transfer learning.


    # U-nets


    A wide variety of algorithms and deep learning architectures [14,15] are used
    for image segmentation, but undoubtedly the most common neural network architecture
    for image segmentation is the U-net [16] (Fig. 7.1B). Ronneberger et al. originally
    introduced U-nets specifically for biomedical segmentation, but this approach
    has now been used across a variety of segmentation problems. This work builds
    upon existing fully convolutional architectures [14] by adding up sampling operations
    with many feature channels to the contracting subnetworks. As a result, there
    is an expansive path that is symmetric to the contracting path, leading to a u-shaped
    architecture. This model was tested successfully across various cell and more
    complex tissue segmentation tasks [16].


    While U-nets were originally developed for segmentation, they have been used for
    other paired image tasks such as achieving computational super-resolution [17],
    and are commonly employed as components in some generative adversarial networks
    (GANs) (described below). With some 10,000 citations already reported in Google
    Scholar, the U-net architecture is clearly one of the most influential deep learning
    architectures developed to date.


    # Generative adversarial networks and their variants


    A generative adversarial network (GAN) is a deep learning method that was pioneered
    by Goodfellow et al. [18] and leverages multiple neural networks working “against”
    each other to transform images of different classes (Fig. 7.1C). The basic premise
    is that one neural network (the “generator”) is trained to take images of one
    class and transform them into a second class, for example, taking zebras and turning
    them into horses. The second neural network (the “discriminator”) is trained to
    discriminate real images of horses from fake images generated by the first network.


    This is done cyclically until the images generated cannot be classified accurately
    as generated or real by the discriminator. The potential for this method has been
    continually explored and expanded since its original description in 2014; it has
    found many applications, such as in super-resolution [19] and artistic endeavors
    [20]. One of the early limitations of this general methodology was that the data
    had to be pixel-registered to facilitate training. In other words, the starting
    and target mode images needed to contain exactly the same scene. This is tractable
    in situations in which a slide is imaged under one condition, and then reimaged
    perhaps after additional staining steps. In this case, the scenes being viewed
    have intrinsically pixel-registered content. This requirement makes creation of
    large datasets for'
