  md: 'stained images using GANs. They trained on salivary gland tissue stained with
    H&E, kidney tissue stained with Jones stain, and liver and lung stained with Masson’s
    trichrome. The GAN model performed very well converting the images, with considerable
    detail generated and accurate histopathological features captured in the virtual
    images (Fig. 7.4B). The virtually stained images were also evaluated by pathologists,
    and no significant difference between the virtually stained and regular brightfield
    images was observed. This indicates the virtually stained images can provide similar
    diagnostic utility. The variation in the colorization of the virtually stained
    images is lower than that of the histologically stained images. Therefore, intrinsic
    staining standardization is an interesting positive by-product of this approach.
    The authors also demonstrated transfer learning by using it to rapidly train the
    model for application on thyroid tissue sections. This technology has the potential
    to be applied to non–slide-based methods, which would allow for impressive label
    free imaging without the need to retrain pathologists. The added ability to generate
    special stains increases the applicability, as many of these stains require hours
    of skilled technician time and expensive reagents.


    While histochemically stained images can give useful information about the cellular
    and extracellular components, fluorescent labels can give even more detailed information
    about desired subcellular structures. Hence, there is tremendous interest in obtaining
    fluorescently labeled images in cell biology and pathology. Ounkomol et al. [43]
    developed a U-net architecture to convert 3D transmitting light and 2D electron
    microscopy (EM) to 3D fluorescence microscopy and 2D immunofluorescence (IF) microscopy.
    Importantly, the predictions for the different structure models can be combined
    into a 3D multichannel fluorescent image prediction from a single 3D TL image.
    Another application of image modality conversion is to facilitate automatic registration
    between images. EM and IF images of ultrathin brain sections are commonly collected
    as part of an array tomography protocol. However, as they are collected from two
    different microscopes, they are not inherently aligned, and manual registration
    is tedious and time-consuming. The authors trained a model on manually registered
    EM and immunofluorescence images labeled for myelin basic protein (MBP-IF). The
    MBP-IF prediction, and therefore the original EM image, was registered with the
    target MBP-IF image using traditional intensity-matching techniques. While EM
    is not routinely used for clinical diagnosis outside of renal biopsies, converting
    images to immunofluorescence stains has great utility as these stains are often
    expensive, cumbersome, and take hours to complete. While in its early stages with
    further validation and interest, this technology could be very useful for pathologists.


    In Christiansen et al. [40], a more universal and flexible architecture was developed
    to address a similar problem. A multitask, multiscale deep neural network was
    trained on paired sets of fluorescently labeled 2D images and transmitted light
    z-stack images (Fig. 7.4C). These z-stack images include images from various focal
    planes, with the hypothesis that even out-of-focus planes contain information
    useful for accurately predicting the fluorescent labels. The images were obtained
    from various labs, samples, and even imaging modalities. This allows for the training
    of a generalizable network through multitask learning. When tasks are similar
    in'
