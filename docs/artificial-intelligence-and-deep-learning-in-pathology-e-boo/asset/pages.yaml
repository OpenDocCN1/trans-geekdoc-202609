    Stepping back for a moment from the technical detail, intuitively what is happening
    here is that the algorithm is learning which class exemplars are the “most problematic”
    ones, i.e., which exemplars are nearest to the class boundaries and thus most
    likely to be misclassified. These are the support vectors that give the approach
    its name. Inspection of these is insightful. Firstly, a large number of support
    vectors (relative to the total amount of training data) should immediately raise
    eyebrows as it suggests overfitting. Secondly, by examining which exemplars end
    up as support vectors, an understanding of the nature of learning that took place
    can be gain as well as of the structure of the problem and data representation,
    which can lead to useful and novel clinical insight.


    # Nonparametric, k-nearest neighbor—based methods


    The k-nearest neighbor classifier classifies a novel pattern comprising features
    x1, ..., xn to the class dominant in the set of k-nearest neighbors to the input
    pattern (in the feature space) among the training patterns with known class memberships
    [29]. The usually employed similarity metric used is the Euclidean distance.


    # Random forests


    Random forest classifiers fall under the broad umbrella of ensemble-based learning
    methods [30]. They are simple to implement, fast in operation, and have proven
    to be extremely successful in a variety of domains [31,32]. The key principle
    underlying the random forest approach comprises the construction of many “simple”
    decision trees in the training stage and the majority vote (mode) across them
    in the classification stage. Among other benefits, this voting strategy has the
    effect of correcting for the undesirable property of decision trees to overfit
    training data [33]. In the training stage, random forests apply the general technique
    known as bagging to individual trees in the ensemble. Bagging repeatedly selects
    a random sample with replacement from the training set and fits trees to these
    samples. Each tree is grown without any pruning. The number of trees in the ensemble
    is a free parameter which is readily learned automatically using the so-called
    out-of-bag error [29].


    Much like in the case of naïve Bayes– and k-nearest neighbor–based algorithms,
    random forests are popular in part due to their simplicity on the one hand, and
    generally good performance on the other. However, unlike the former two approaches,
    random forests exhibit a degree of unpredictability as regards the structure of
    the final trained model. This is an inherent consequence of the stochastic nature
    of tree building. As we will explore in more detail shortly, one of the key reasons
    why this characteristic of random forests can be a problem in regulatory reasons—clinical
    adoption often demands a high degree of repeatability not only in terms'
