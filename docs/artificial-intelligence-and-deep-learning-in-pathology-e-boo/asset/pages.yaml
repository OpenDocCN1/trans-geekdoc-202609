  md: 'value. In reinforcement learning, the algorithm learns to react to its environment
    and finds optimal strategies via a reward function.


    Although we tend to think of deep learning and neural networks as the newest forms
    of machine learning, this is not the case. The primitive ancestors of modern neural
    network architectures began with the work of Rosenblatt [1] in 1957. These neural
    networks were loosely based upon the model of neuronal function described by McCulloch
    and Pitt [2] about a decade earlier (see Ref. [3] for a review of the history
    of deep learning). Basically, it involves a sequence of simulated neurons arranged
    in layers, with the outputs of one layer becoming the input of the next. Each
    layer thus receives increasingly complex input from the layer beneath it, and
    it is this complexity that allows the algorithm to map an unknown input to an
    outputted solution. Note that the term “deep learning” does not refer to the sophistication
    of the program or to its capacity to mimic thought in any meaningful way. Rather,
    it simply refers to the fact that it is built of many layers of nonlinear processing
    units and their linear interconnections. At its most fundamental level, deep learning
    is all about linear algebra with a little bit of multivariate calculus and probability
    thrown in.


    Meanwhile a number of other models of machine learning were being developed, which
    are collectively referred to, by many though not all, as shallow learning. Just
    as is the case of deep learning, in all of these models, the program is presented
    with a large dataset of known examples and their defining features. In the simplest
    case, there are two classes of objects in the training set, and the program has
    to construct a model from these data that will allow it to predict the class of
    an unknown example. If the two classes are bedbugs and caterpillars, the useful
    features might be length and width. To distinguish between different faces, a
    large number of different morphometric features might have to be determined. The
    development of these architectures progressed in parallel with that of neural
    networks. A major advantage of neural networks is that they can derive their own
    features directly from data (feature learning) while shallow learning required
    the programmer to explicitly create the feature set (feature engineering). Another
    advantage of deep learning is that it can be used for reinforcement learning in
    which the algorithm learns to react to an environment by maximizing a reward function.


    In spite of this obvious advantage, the field of deep learning languished for
    many years, partially because the early models did not live up to the hype (they
    were billed as thinking machines) but mostly because the computational power and
    storage capacities available were insufficient until relatively recently. Deep
    learning tends to be more computationally “needy” than shallow learning.


    In all forms of machine learning, the computer is presented with a training set
    of known examples. Once the program has been trained, it is presented with a validation
    set. This is another set of known examples. However, this is withheld until training
    is complete. At that point, the program is tested with the examples in the validation
    set, to determine how well it can identify these samples that it has never seen.
    It is important to note that accuracy alone is not a valid measure of'
