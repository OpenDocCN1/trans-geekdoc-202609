- pgno: 232
  md: '# Conclusion


    Artificial intelligence is rapidly assuming a crucial role in the elucidation
    and characterization of tumor immune interactions. Deep learning driven computational
    algorithms that support the construction of detailed spatial maps appear to be
    a relatively straightforward way to characterize general tumor immune interactions
    in the tumor microenvironment, which may be very helpful to predict treatment
    response and clinical outcomes. Thus, the utilization of advanced digital pathology
    and deep learning applications will likely grow very quickly over the next few
    years. This chapter has focused primarily on describing methods behind rapid advances
    in our ability to generate cancer immune maps and emerging methods that can be
    used in combination to provide many different types of potentially useful information
    to deliver precision medicine. Currently, the interpretation of cancer immune
    dynamics with the complex TME is challenging, but disease site-specific correlations
    between predictions with digital pathology and deep learning methods, quantitative
    analyses of mIHC and mIF, clinical outcomes, and treatment response are being
    actively studied to discover biomarkers and elucidate complex relationships between
    tumors and immunity in order to help advance our ability to treat cancer. Even
    though mapping patient-specific tumor-immune interactions are still at an early
    stage, the crucial next phase of research regarding the quantitative analysis
    of spatial morphologic and molecular patterns emerging from these methods is beyond
    fascinating and hopefully clinically applicable. Last but not least, the power
    of the digital pathology and deep learning methods also lies in the ability to
    perform these computational analyses of WSIs across thousands to hundreds of thousands
    of cases in parallel without the need for additional tissue, time, or resources.
    It is also quite conceivable that analyses of mIF and mIHC in small subsets of
    site-specific diseases can be used to identify generalizable relationships that
    can be correlated with more high-throughput standard Pathomics analyses in H&E
    WSIs in much larger collections in order to gain further insight into tumor biology.
    Hopefully, these developments can lead to workflows that can be implemented in
    pathology laboratories as practical clinical decision support tools for routine
    diagnostic surgical pathology. Thus, we hope the end of this chapter serves as
    a beginning to help imagine a future where WSIs of incoming tissue samples are
    analyzed with automated algorithms that perform diagnostic screening, quantify
    the expression of biomarkers in mIHC panels, provide prognostic information, help
    identify therapeutic targets, and predict treatment response.


