    based data preprocessing.


    Previous chapters have discussed the concept of ensemble learning. In all of the
    above examples, weakly supervised learning strategies attempt to achieve strong
    generalizations (performance) from limited amounts of labeled (annotated) data.
    In contrast, ensemble learning attempts to achieve strong generalizations from
