- pgno: 28
  md: 'We can determine the best choice for K by plotting within-cluster scatter as
    a function of the number of clusters. As an extreme example, if K equals the number
    of data points, there is obviously no variance within each cluster, as they each
    consist of one element. The smaller the number of clusters, the greater the variance
    within the clusters. When variance is plotted as a function of K, the equation
    is reminiscent of exponential decay, and it is easy to pick a value of K such
    that larger values do not appreciably change the overall variance. This is analogous
    to the so-called “scree plots” used in principal component analysis (PCA), described
    in a separate section below.


    # Probabilistic models


    In the previous section, the basic building blocks of clustering and distance
    were used to learn relationships among data and to use those relationships to
    predict class labels. We can also approach this problem by asking the following
    question; given the feature set for an unknown example, what is the probability
    that it belongs to a given class? More precisely, if we let X represent the variables
    we know about, namely our instance’s feature values, and Y the target variables,
    namely the instance’s class, then we want to use machine learning to model the
    relationship between X and Y.


    Since X is known for a given instance, but Y is not (other than in the training
    set), we are interested in the conditional probabilities; what is the probability
    of Y given X. This is another way of saying that given a sample’s feature set
    (X), predict the class it belongs to (Y). In mathematical notation, this is written
    as P(Y|X) which is read as “the probability of Y given X.” As a concrete example,
    X could indicate the phrase” my fellow Americans” and Y could indicate whether
    the speaker is a member of the class politician (thus using the words “class”
    and “politician” in the same sentence, possibly for the first time).


    The classification problem is thus simply to find P(Y|X). The probabilities of
    several kinds of occurrence can be calculated directly from the training set.
    In the data matrix in Fig. 2.1, for any given feature X, we can simply count the
    number of times its value appears divided by the total number of variables, giving
    P(X). For any given value of Y, we can count similarly count the ratio of the
    number of times that class appears relative to the overall number of classes.
    In this manner, we can calculate values for the sets X,Y to get P(Y) and P(X).


    There is one more thing we can do, and that is to calculate P(X|Y), the probability
    of the feature, given the class, which is simply based on looking only at that
    class and determining how many times the feature value X appears in samples of
    that class in the training set. We now know P(X|Y). Given this information, we
    can calculate the probability of the class given our knowledge of its feature
    set, P(Y|X) by means of the easily proven Bayes theorem (the only equation used
    in this chapter):


    P(Y|X) = (P(X|Y)*P(Y))/P(X) which, if a Venn diagram is drawn, becomes intuitively
    obvious.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'In practice this formula is too simple, since in order to make predictive assignments
    from attributes to class, each sample must have more than one attribute, and in
    real-world problems, many more than one. The procedure for dealing with multiple
    attributes is more complicated [6]. In any case, the Bayes theorem is a formulation
    of one of the basic rules for conditional probabilities. However, the problem
    with computing probabilities in this way is that some of the features in a feature
    set may be dependent on each other (for embryos, mass and cell number are dependent
    variables), which makes the calculations difficult. In practice, this complication
    is ignored, and the features are treated as if they were independent. This algorithm
    is known as **Naïve Bayes** where naïve means that we are foolish enough to assume
    independence. Surprisingly Naïve Bayes works remarkably well in spite of this
    limitation, and so it has become an important machine learning model. There are
    much more complex models that deal with dependency relationships; these are known
    as Bayesian optimal classifiers. There is also a middle ground that is based on
    the idea that some things are conditionally dependent but some things are not.


    These approaches fall into the framework of probabilistic graphical models that
    are known as Bayesian Belief Networks or Directed Graphical Networks. These are
    networks that represent a set of variables and their conditional dependencies
    via the use of a directed graph. A simple network of this kind is shown in Fig.
    2.5. Rain influences whether the sprinkler is turned on, and both rain and the
    sprinkler influence whether we get wet. Bayesian Belief Networks are beyond the
    scope of this chapter, but additional information may be found in Ref. [7]. All
    these algorithms learn from probability distributions within their sample space,
    rather than spatial metrics, as was the case for SVMs and other geometrical models.


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_29_0.png)


    **FIGURE 2.5**


    Relationships among three objects. Whether it is raining or not determines whether
    the sprinkler gets turned on, but not vice versa, so this is a directed graph.
    Similarly, either rain or the sprinkler will get wet, but the state of wetness
    does not cause either rain or the sprinkler to happen, so these arrows are also
    directional.'
