- pgno: 205
  md: 'models. This method was also extended to solving regression problems, known
    as support vector regression. Essentially, the SVM algorithm is an optimization
    algorithm that works by maximizing the margin of a data set and finding the separating
    hyperplane that neatly divides the data. The margin is the smallest distance between
    a data point and the separating hyperplane. Implicitly, we have assumed that the
    data we are trying to classify and learn are perfectly separable by a hyperplane,
    but if this is not the case, we can still find an approximation by optimizing
    the distance to the separating hyperplane (pink box), Fig. 9.16, with error variables
    (blue box), subject to constraints (red box).


    given the constraints


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_205_0.png)


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_205_1.png)


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_205_2.png)


    # FIGURE 9.16


    Support vector machine (SVM) equations. SVM is an optimization algorithm to find
    the optimal hyperplane that separates two classes of data in a given higher dimensional
    feature space. The operation of the algorithm is explained in three boxes. Pink
    box: minimize the weight of all features. The distance between a point of one
    class and the optimal hyperplane can be represented as 1. We want to maximize
    this distance or equivalently, minimize the denominator W, ||W||. Blue box: penalize
    imperfectly separated data using error (slack) variables, with penalty factor
    C. Red box: constrain the slack variables to separate the data. Larger slack variables,
    with greater penalty, are needed for points whose projection to higher dimensional
    feature space by φ(x_i) is further than ε from the target value [111]. The two
    constraint lines deal with points on either side of the hyperplane, or when extended
    to survival regression, to early predictions in the first line, and late predictions
    in the second line. The kernel trick is a way of speeding up the computation by
    calculating the matrix multiplication W·φ once, and reusing the result for every
    data point. In SVCR (censored regression), the two hyper-parameter penalty values,
    C and ε, are used for early and late predictions and for censored data and events—an
    overly restrictive model. SVRc effectively extends the model by using separate
    penalty parameters for early/late and censored/event data. These eight hyper-parameters
    were optimized in advance over a set of cohorts by particle swarm optimization
    (see text).'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'SVCR, a simple extension of SVMs for survival analysis that accounts for censoring
    [112], ignores constraints where the prediction time is later than the censor
    time (right censoring, second line in red box). In this model, errors in events
    and nonevents and in early and late predictions are penalized identically, which
    creates a problem in that late prediction of an event is generally a far more
    serious error than early prediction, having consequences for patient treatment
    decisions.


    SVRc, an effective and efficient solution to this problem, improves the handling
    of censored data by applying separate penalty factors [113]. The algorithm applies
    the most severe penalty to late prediction of events, followed by a lesser penalty
    to early prediction of nonevents, then early prediction of events, and finally
    a negligible penalty is applied to late prediction of nonevents (censored data).
    Optimal values for these parameters may be found using a hyper-parameter tuning
    algorithm to learn the values over multiple data sets. We have successfully used
    particle swarm optimization [114] to set up these parameters.


    # Feature selection tools


    The feature development sections above can generate many features often anywhere
    between several hundreds to multiple thousands per application. Considering that
    for modeling purposes there must be a limit and an optimal balance between features
    and events, methods for reducing the number of features must be a part of any
    modeling strategy. There are four possible classes of features—strongly relevant,
    weakly relevant, redundant, and irrelevant [115]. As the names suggest, relevant
    features are important for achieving good results [116]. Irrelevant features do
    not affect the result but may affect algorithm efficiency. Redundant features
    are those that contain the same information as another or a subset of features.
    Removing irrelevant and redundant features is the function of feature selection
    algorithms, with the goal of improving results and reducing computation time.
    Let us assume there are m features associated with a problem. To find the best
    subset of features, one needs to evaluate all 2^m − 1 subsets, a computationally
    infeasible task. Hence, there is a need for approximation algorithms that can
    perform feature selection. Broadly there are three classes of feature selection
    methods: Filter, Wrapper and Embedded methods [117].


    Filter methods filter out irrelevant features by some mechanism that computes
    a score of importance. For example, Pearson’s correlation measures the linear
    dependency of two random variables. This could be used to compute the correlation
    coefficients of features with respect to the target variable and then select the
    top features as input to the algorithm. Another coefficient, mutual information
    (MI) better captures nonlinear relationships between features and target variables.


    Wrapper methods for feature selection are those methods that use the classification
    algorithm itself as a black box predictor and use the performance of the resulting
    model as an indicator of how good the feature subset is. Obviously, as explained
    above, not all subsets can be evaluated and thus, wrapper methods use clever algorithms
    to prune and search the space of feature subsets to arrive at an optimal subset.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Broadly these methods can be classified as sequential search algorithms and
    heuristic search algorithms. Forward selection and backward elimination are examples
    of the sequential search methods. In forward selection, we start with an empty
    set and add the feature that results in the best performance. Sequentially, we
    keep adding features and stop when there is no further improvement. Backward elimination
    works in a similar fashion where we start with the entire set of features and
    progressively remove features. These are both examples of greedy methods, where
    one hopes that sequentially taking the best step will result in a globally optimal
    solution. But this is not usually the case when there are complicated interactions
    between features. Alternatively, heuristic-based wrapper algorithms, like particle
    swarm optimization and genetic algorithms tend to find better locally optimal
    solutions. Given that feature selection is a problem for which no efficient algorithms
    exist, these solutions are the best we can do in a reasonable time.


    Embedded methods perform feature selection as an intrinsic part of the classification
    algorithm, for example, decision trees only consider splits that result in best
    performance. The features that do not contribute to the model are not considered.
    Regularization is an important, optional addendum to linear feature selection
    models that falls under the class of embedded methods. When learning a linear
    model (linear regression, linear SVMs), lasso (least absolute shrinkage and selection
    operator) regularization is invoked by adding a term to the cost function. Linear
    models operate by learning the coefficients of the model that best fit the data,
    often including many small weights which do not meaningfully improve the model,
    and which do not generalize well to unseen data. To get over this limitation,
    we need to force some of the coefficients to zero and adjust other coefficients.
    This is done by adding an extra term to the cost function which penalizes the
    nonzero weights. In practice, this extra term limits the sum of the absolute value
    of the coefficients.


    # Ground truth data for AI-based features


    Deep learning algorithms are heavily data dependent, and to ensure scalability
    outside of the development environment, these large datasets must conform to clinical
    reality both in terms of absolute numbers and in variety of representation. It
    is critical to not only represent different grades and morphologic subtypes but
    also different staining conditions and tissue quality. In addition to large datasets
    in a supervised or semisupervised setting, deep learning also demands ground truth
    annotations. This can be as simple as assigning a grade or binary label of tumor
    or nontumor to an input image, all the way to digitally drawing outlines around
    target objects for detection or segmentation. The choice of annotation strategy
    is dependent on the algorithms functional output. For example, if the output is
    boundary segmentation of an object, then precise boundaries must be part of the
    ground truth. If, on the other hand, the task is detection then the annotation
    may involve putting a bounding box around or a seed in the target object. Clearly
    segmentation provides much greater flexibility downstream in creating features,
    but it comes at a much higher upfront cost in terms of annotation.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Rapid outlining using semiautomatic methods can reduce the work demand for
    expert annotators, using minimal gestures and mouse clicks to initialize algorithms
    that create complete boundaries for structures of interest. Example algorithms
    include segmentation based on active contour evolution [118,119] where users provide
    an initial boundary and the algorithm evolves it to match an image boundary. This
    type of algorithm has been applied successfully for a variety of outlining tasks
    in medicine [120]. Random walker [121] is another algorithm that automatically
    generates contours, where the user provides a rough initial labeling of the different
    objects. This approach has less burden compared with active contour approaches
    as it does not require a complete definition of an outline. An alternative approach
    to contour initialization uses the watershed algorithm [122], which simulates
    the flooding of water in image valleys (low-intensity values surrounded by high
    values) to detect objects separated by boundaries. Annotators can interactively
    specify thresholds for the watershed algorithm and select pixel clusters that
    form the object of interest.


    Due to the dependence of deep learning on large datasets, virtually all deep learning–based
    approaches conduct training of the neural network using data augmentation where
    training data are transformed to expand the existing datasets. Transformations
    are performed geometrically via rotations or flips, and they can also be performed
    based on color (e.g., stain transformation, contrast adjustment, etc.). Crowdsourcing
    also has great potential for generating larger datasets. Consistency and detection
    of low-quality annotations is a critical issue for such an approach, necessitating
    a data aggregation step such as the one proposed by Albarqouni et al. [68].


    # Conclusion


    The importance of accurate histopathologic diagnosis in patient care is often
    underestimated. This perception is changing among treating clinicians as our molecular
    understanding of disease has exploded and targeted therapies and new specific
    treatment protocols continue to emerge. Having precise and reproducibly characterized
    disease remains an important component in developing these specific treatment
    protocols. To this end the use of deep learning methods for interrogating images
    and artificial intelligence to analyze complex interrelated datasets are changing
    this landscape. The promise of this technological and knowledge revolution ultimately
    is to improve patient outcomes by creating a more robust basis for linking patients
    with the most effective treatments.'
  merge: -1
  img_proc: true
