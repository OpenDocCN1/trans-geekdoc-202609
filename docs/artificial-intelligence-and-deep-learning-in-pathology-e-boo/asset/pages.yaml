  md: 'more detail elsewhere in this book. Algorithms such as these are being developed
    to aid the pathologist in their diagnosis, and it is only a matter of time until
    they are applied routinely in the clinical workflow of pathology departments.
    Currently, these algorithms are not being designed to automatically report on
    patient samples, without any human verification, rather to act as an aid to the
    pathologist in order to increase the speed of their reporting, for example, by
    highlighting the areas of interest, as a method to triage urgent cases or as a
    second opinion. However, as deep learning becomes more sophisticated, there is
    a strong possibility that in the future, computer vision algorithms may perform
    an aspect of autonomous clinical reporting. Later in this chapter, we discuss
    what regulatory concerns to address when designing an algorithm for translation
    into the clinic.


    Deep learning architectures are now able to predict patient molecular subgroups
    from H&E-labeled histology. They do this from only the morphology and histological
    pattern of the tissue sample [15,16]. This may be quite remarkable to imagine;
    however, the histopathologist would most likely have predicted this to be possible.
    They have been fully aware of the complex and important variations of morphology
    present in the tissue and how they affect patient outcome; even if they have not
    been able to link these to molecular subtypes. This, however, has real implications
    beyond academic research. Molecular testing is expensive and requires complex
    instrumentation. If the same information, relevant to personalized pathology,
    can be gleaned from the routine and cheap H&E-labeled section, this could have
    significant monetary impact when calculating health economics.


    # Spatial resolution


    We have briefly covered the importance of reporting the tissue architecture in
    the field of precision medicine when quantifying biomarkers of interest, as opposed
    to other molecular technology that destroys the tissue and thus the spatial resolution
    of its cellular components. Histopathologists know that context is key to an accurate
    diagnosis and prognosis. The tumor microenvironment is complex, with many cellular
    and molecular interactions that play a role in inhibiting or driving tumor progression
    and responses to therapy. The quantification of a stand-alone biomarker, even
    by image analysis, may not be enough to predict accurate prognosis or prediction
    for an individual patient. This is the case for PDL-1 immunohistochemical testing,
    where even patients with PDL-1 positive tumors may not respond to anti-PDL-1 therapy
    [17]. Similarly, there is an advantage to quantifying prognostic histopathological
    features such as lymphocytic infiltration or tumor budding in distinct regions
    within the tumor microenvironment. Traditionally, image analysis has quantified
    a single prognostic feature across a single tissue section and with proven success
    at patient stratification. However, by applying multiplexed immunofluorescence,
    it is now possible to visualize multiple biomarkers and histological features
    within a single tissue section. Image analysis software can furthermore calculate
    and export the exact x and y spatial coordinates of each feature of interest across
    the WSI, or recognize specific patterns within the interacting cellular'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'milieu of the tumor microenvironment (Fig. 8.5). This not only brings the advantage
    of measuring more than one prognostic feature, but also allows new insights into
    the understanding of disease progression based on quantifying novel interactions
    at the spatial resolution of the tissue. This was demonstrated by Nearchou et
    al. who showed that the density of tumor budding and immune infiltrate were significantly
    associated with stage II colorectal cancer survival, but furthermore that their
    specific interaction added value to a combined prognostic model [6]. Studies such
    as this show that complex spatial analysis may be key to the success of accurate
    prognosis for the individual patient.


    # Machine learning on extracted data


    The image analysis solutions described above allow accurate image segmentation
    and cellular and molecular classifications of known biomarkers or histopathological
    features. The quantification of these known features can be utilized and applied
    to deliver personalized pathology. However, image analysis can further extract
    a wealth of unbiasedly collected data across multiple classified objects and their
    spatial interactions. Such data may be the specific density of specific objects
    surrounding others, or their distance to each other, as well as a wealth of extent,
    shape, and texture measurements of individual objects. The value of these data
    is often not known a priori


