  md: 'and TILs can be subdivided in a data-driven manner with emerging artificial
    intelligence applications in digital pathology image analysis to specifically
    identify intratumoral and peritumoral TILs, which can be further subdivided to
    identify intraepithelial TILs and stromal TILs. To put this into context, if a
    pathologist or group of pathologists attempted to perform this type of task in
    multiple fields of view under the microscope for every tissue section for multiple
    slides per case across hundreds to thousands of glass slides, this would be prohibitive
    due to the amount of labor, time, and cost and almost impossible to realistically
    consider given the limited availability of practicing pathologist and intrinsic
    intra- and interobserver variability.


    # Multiplex immunohistochemistry with digital pathology and deep learning


    Building on the exciting advances with computational detection of lymphocytes
    to identify TILs within the histologic landscape of the cancer, a conceptually
    straightforward approach is to integrate insights from TIL maps and specifically
    identify the various types and subsets of aforementioned immune cells based on
    the expression of surface and cellular biomarkers and their in situ spatial distribution
    in the TME [42, 130–133]. In routine diagnostic surgical pathology, consecutive
    serial sections of tissues are stained with one marker at a time and interpretation
    is based on the presence of a marker or a semiquantitative estimation of the number
    of positive cells of interest. Multiplexed chromogenic immunohistochemistry (mIHC)
    and immunofluorescence (mIF) have recently emerged to simultaneously detect multiple
    biomarkers in the same tissue section to perform molecular immune profiling in
    situ in formalin-fixed paraffin-embedded (FFPE) samples in order to preserve limited
    tissue in samples [133–141].


    However, the manual evaluation and interpretation of the immunohistochemical (IHC)
    expression of a single marker is highly subjective and time-consuming due to the
    nuances in relationship between expression and stain intensity, as well as non-specific
    background staining, heterogeneous expression, subcellular localization, and variability
    in selecting appropriate ROIs to score [42, 142], which can be heavily influenced
    by preanalytic variables intrinsic to the various differences in chemical methods,
    tissue fixation, and histology laboratory processing and staining protocols. Similarly,
    challenges still remain for computationally aligning or registering serial sections
    with companion H&E tissue sections, which can vary due to intrinsic architectural
    and texture differences in each section. There are also drawbacks with generating
    spatial molecular maps from serial sections that are related to the spatial resolution
    of molecular IHC biomarkers, as well as challenges associated to variations that
    are introduced into tissue samples during histologic sectioning and processing
    for sample preparation. Another overarching challenge that remains as a barrier
    to the analyses of spatial multiplex IHC and IF in WSIs is the need for training
    datasets.


    Despite these challenges and variables, digital pathology image analysis tools
    can play a very important role to help pathologists routinely quantify the expression
    of IHC biomarkers in specific types of cells, differentiate various expression
    levels,'
