  md: 'by the pharmaceutical industry [1]. These screens also applied image analysis,
    but to cultured cells exposed to genetic of small molecular manipulation, to segment
    and classify cellular structures before capturing large multiparametric datasets
    that inform on novel targets or drug efficacy. Similar methodology taken from
    high-content biology and image analysis can be applied to digital pathology. This
    is the case for classical object threshold–based image analysis or for artificial
    intelligence. The overarching aim being to either quantify and report on specific
    biomarkers or histological patterns of known importance, or by capturing unbiasedly
    collected multiparametric data and pattern recognition across segmented objects
    and whole-slide images (WSI). The aim of distilling and reporting on the extracted
    data from digital pathology images is to allow for the stratification of patients
    into distinct groups that may inform the clinician on their optimal and personalized
    treatment regimen.


    # Digital pathology


    Digital pathology, the high-resolution digitization of glass-mounted histopathological
    specimens, is becoming more common place in the clinic. This disruptive technology
    is on track to replace the reporting of glass slides down a microscope, as has
    been the tradition for centuries. There remain certain obstacles to overcome for
    wide-scale adoption of digital pathology; such as IT infrastructure, scanning
    workflow costs, and the willingness of the pathology community. However, as more
    institutes trend to full digitization, these obstacles diminish. The adoption
    of digital pathology holds advantages over traditional microscopy in teaching,
    remote reporting and image sharing, and not least the ability to perform image
    analysis on the resultant digitized specimens.


    In essence, the technology is currently moving from the glass slide and microscope
    to the digital image and high-resolution screen, although the manual viewing and
    diagnosis remains the same. Clinical applications using digital pathology and
    WSIs are currently restricted to the primary diagnosis of H&E stained slides.
    However, future applications, such as immunofluorescence, can bring advantages
    to digital pathology. Indeed, scanner vendors are frequently combining both brightfield
    and multiplexed immunofluorescence visualization into their platforms. Immunofluorescence
    allows the identification, classification, and quantification of multiple cell
    types or biomarkers colocalized at the single-cell resolution and on a single
    tissue section. The importance of this capability is becoming increasingly apparent
    as we realize that the complex intercellular and molecular interactions within
    the tumor microenvironment, on top of cellular morphology, play a vital role to
    a tumor’s progression and aggressiveness.


    Humans are as adept at reporting from digital pathology samples as they are from
    glass mounted ones. They do this by identifying diagnostic and prognostic patterns
    in the tissue, while at the same time disregarding artifact and nonessential histology.
    However, an inherent human setback in the field of pathology has been the standardization
    and consistency of inter- and intraobserver reporting. This is specifically true'
