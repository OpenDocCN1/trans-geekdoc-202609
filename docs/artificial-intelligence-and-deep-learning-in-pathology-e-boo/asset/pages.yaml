    of images, our colleagues in radiology have taken the lead in this field, with
    impressive results. Pathology has embraced this approach with the advent of whole
    slide imaging, which in addition to its many other benefits, provides the framework
    in which to embed machine learning from biopsy specimens.


    Because of the increasing importance and ubiquity of WSI, in the chapters to follow,
    there will be a focus on image interpretation, with some additional attention
    to the use of AI in exploring other large correlated data arrays such as those
    from genomic and proteomic studies. Interestingly, although genotype determines
    phenotype, using AI we can sometimes work backward from image phenotype to genotype
    underpinning based on subtle morphologic distinctions not readily apparent to
    the naked eye. Natural language understanding, which is another major area of
    current AI research, is a vast field that requires its own monograph and is largely
    outside the scope of the present volume though important for analyzing clinical
    charts, electronic health records, and epidemiologic information, as well as article
    and reference retrieval. By removing the mysticism surrounding AI, it becomes
    clear that it is a silicon-based assistant for the clinical and the research laboratories
    rather than an artificial brain that will replace the pathologist.


