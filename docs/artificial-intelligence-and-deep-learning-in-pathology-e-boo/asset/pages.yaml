    # The need for human intelligence—artificial intelligence partnerships


    Pathologists, confronted with a future filled with massive and ever-expanding
    computing power, properly ask the question “...will a machine diagnostician replace
    a human diagnostician and if so when?”. No one knows the answer to this question
    but a glimpse into the world of chess offers some useful guideposts.


    The chess grandmaster Garry Kasparov describes his years as a grandmaster as a
    time when computational chess was quickly developing and challenging human player
    expertise [5]. In the 1970s and 80s, grandmasters successfully outplayed the computers
    of the day. In the 90s, the competitions were more matched. Kasparov'
  merge: -1
