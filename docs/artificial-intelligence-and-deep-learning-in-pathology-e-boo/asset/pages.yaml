- pgno: 18
  md: 'In many ways, the experiences of radiologists are helping to guide us in the
    evolution of pathology, since radiologists continue to adopt AI at a rapid pace.
    Pathologists have been late in coming to the table. For radiologists AI is mainly
    about analyzing images, and their images are relatively easy to digitize. In pathology,
    acquisition and annotation of datasets for computer input was not possible until
    WSI at appropriate scale of resolution and speed of acquisition became available.
    Some of the drivers of WSI are efficiency, data portability, integration with
    other diagnostic modalities, and so on, but two main consequences of the move
    from glass microscopy to WSI are the ability to incorporate AI and the incorporation
    of computer-intensive imaging modalities. Although AI plays important roles in
    clinical pathology, in the interpretation of genomic and proteomic arrays, etc.,
    where inference and prediction models are important, the focus of this book will
    be on the use of AI in anatomic pathology, with specific attention to the extraction
    of maximal information from images regarding diagnosis, grading, prediction, and
    so on.


    # Limitations of AI


    While recognizing the great success of AI, it is important to note three important
    limitations. First, for the most part, current algorithms are one-trick ponies
    that can perform a specific task that they have been trained for, with limited
    capability of applying that training to new problems. It is possible to do so-called
    transfer learning on a computer, but it is still far removed from the kind of
    general intelligence that humans possess. Second, training an algorithm requires
    huge datasets often numbering in the thousands of examples. In contrast, humans
    can learn from very small amounts of data. It does not take a toddler 1000 examples
    to learn the difference between an apple and a banana. Third, computation by machine
    is very inefficient, in terms of energy needs as compared with the human brain,
    even though the brain is much more complex than the largest supercomputer ever
    developed. A typical human brain has about 100 billion neurons and 100 trillion
    interconnections, which is much bigger than the entire set of neural networks
    running at any time across the globe. This has a secondary consequence. It has
    been estimated that training large AI models produces carbon emissions nearly
    five times greater than the lifecycle carbon emissions of an automobile.


    There are several new approaches that have the ability to address these issues.
    The first is neuromorphic computing, which attempts to create a brainlike physical
    substrate in which the AI can be implemented, instead of running solely as a software
    model. Artificial neurons, based upon use of a phase-change material, have been
    created. A phase-change material is one that can exist in two different phases
    (for example, crystalline or amorphous) and easily switch between the two when
    triggered by laser or electricity. At some point the material changes from a nonconductive
    to a conductive state and fires.


    After a brief refractory period, it is ready to begin this process again. In other
    words, this phase-change neuron behaves just like a biological neuron. Artificial
    synapses have also been created. These constructs appear to be much more energy'
