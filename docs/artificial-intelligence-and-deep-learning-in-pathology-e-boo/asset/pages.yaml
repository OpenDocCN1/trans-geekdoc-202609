- pgno: 181
  md: '# Artificial intelligence methods for predictive image-based grading of human
    cancers


    Gerardo Fernandez, Abishek Sainath Madduri, Bahram Marami, Marcel Prastawa, Richard
    Scott, Jack Zeineh, Michael Donovan


    *Department of Pathology, Icahn School of Medicine at Mount Sinai, New York, NY,
    United States*


    # Introduction


    Surgical pathology and the practice of general medicine are often described as
    having legitimate components of art as well as science. That perception is perhaps
    less relevant in the current information age and with the adoption of genomic
    medicine, in large part due to the growth in disease-specific causal knowledge.
    As a surgical pathologist, gestalt and intuition are words you may not use to
    describe how you arrive at a specific patient’s diagnosis, but it is certainly
    understood that with experience, in particular with a deep immersion in a subspecialty,
    comes an understanding of histopathology that cannot easily be transmitted or
    formalized. This is not in any way to delegitimize pathology or relegate it to
    the unscientific, rather to illustrate a strength of the human brain. For well
    over 100 years using a microscope, pathologists have been applying this strength
    to group and separate disease entities into diagnoses and their subtypes. The
    brain seems to be good at pattern recognition, filtering noise, and dealing with
    variability, and from a histopathology perspective, this has complemented the
    medical need quite well for over a century. Although the concept of tumor differentiation
    and its relationship to clinical outcome dates back to the early days of histopathology
    until fairly recently, limited treatment options diminished the necessity for
    more precise and standardized grading.


    Over the past several decades, however, treating physicians and patients have
    seen increasingly sophisticated therapeutic options, directed at narrower oncologic
    disease states and have therefore become more and more reliant on accurate tumor
    classification to make informed decisions on the overall best treatment choice.
    The relevant information in this current era of personalized medicine ranges from
    robust prognostic information about specific diagnoses to the presence or absence
    of biomarkers that may dictate a targeted therapy. Although accurate classification
    clearly starts with tumor diagnosis, relevant subtypes, and even target biomarkers,
    it is not complete without robust and reproducible grading schemes providing reliable
    prognostic information. Although grade is emphasized in this review, it is important
    to'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'understand that clinically relevant prognostic clinical models rely on both
    the AJCC cancer staging system and histologic grade to guide treatment decisions
    and project outcomes. In addition, these clinical models have further evolved
    with the advent of molecular phenotyping and the interplay with these same clinical
    features.


    If we restrict ourselves to one organ system or further to one cell of origin,
    there are many examples where tumor type and subtype provide the prognostic information
    required to guide treatment and therefore grading schemes are either less important
    or not applicable, as is the case, for example, with prognostically favorable
    tubular or medullary carcinomas of the breast and prognostically unfavorable small
    cell lung cancer. For many cancers, however, it is the degree of differentiation
    that determines the aggressiveness of the tumor and therefore the grade. This
    makes intuitive sense as the degree of differentiation is a measure of a tumor’s
    morphologic departure from the normal histologic pattern of the organ. The greater
    the tumor’s departure from normal histology, the more malignant, unchecked, and
    aggressive it is.


    Grading schemes over the years represent attempts to create a histopathology-based
    prognostic model, capturing the degree of differentiation and providing treating
    clinicians with the most reliable insight into the potential aggressive behavior
    of a cancer and therefore risk to the patient. These models incorporate a range
    of histologic features that are quantitatively or semiquantitatively determined
    microscopically by the pathologist. Some grading schemes incorporate very few
    features or focus on a narrow group of features as is the case in the Fuhrman
    grading system for renal clear-cell carcinoma which only uses nuclear features
    (size, shape, chromatin pattern, and nucleolar prominence) [1]. Other grading
    schemes incorporate a combination of features such as architectural or proliferative
    activities. Architectural features in carcinomas generally reflect the degree
    to which the tumor’s epithelial component differs from the organ’s normal epithelial
    component. Grading schemes for adenocarcinoma of the colon, adenoid cystic carcinoma
    of salivary gland, and adenocarcinoma of prostate all primarily rely on architectural
    features [2–4]. Proliferative activity, namely mitotic figure counts or proliferative
    (Ki67) indices, is occasionally primarily relied on, such as in gastrointestinal
    stromal tumors and some neuroendocrine tumors of the gastrointestinal tract, whereas
    it is frequently a part of multiple-feature grading schemes including breast’s
    Nottingham modification of the Bloom-Richardson grade which additionally incorporates
    nuclear morphology and glandular architecture [5–8].


    The battleground in histopathologic grading has been between complexity and reproducibility
    where many schemes capture nuance at the expense of reproducibility. Numerous
    studies in different subspecialties have documented less than optimal reproducibility
    of grading systems, be it intra- or interobserver or whether the comparison is
    against a consensus of experts or general pathologists [9–12]. Recent efforts
    by international organizations representing subspecialties have tried consensus
    to guide grading recommendations in the direction of increased reproducibility
    and clinical utility, perhaps none more than in the case of prostate cancer. The
    Gleason grading scheme has undergone a number of modifications to simplify'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'ambiguity in the pattern categories. Most recently the International Society
    of Urological Pathology (ISUP) focusing on clinical utility modified how the score
    is reported to match pathologically defined subgroups to clinically relevant risk
    and treatment groups [13].


    Prognostic models to establish risk for patients with cancer have evolved beyond
    grade and stage. In their simplest form, they have combined or incorporated the
    two to better assess prognosis. The Nottingham Prognostic Index, for example,
    combined grade with tumor size and lymph node status to arrive at clinically relevant
    prognostic groupings [14]. There are also numerous nomogram variations that combine
    grade with stage and clinical variables such as the Kattan preoperative and postoperative
    nomograms for prostate cancer [15,16].


    Despite strategies for improving the reproducibility of grade by simplifying schemes
    or combining it with other predictive features such as stage or clinical variables
    for improved prognostic value, the central issue has not been addressed until
    recently. As long as humans are visually quantifying grading scheme features,
    there will always be a significant reproducibility problem. Not all feature quantification
    suffers equally; in breast cancer, for example, we are significantly better at
    reproducibly assessing tubule formation than nuclear pleomorphism or mitotic counts
    [11,12]. In all cases, however, a tool for quantitative assessment has been missing.
    Although image analysis with traditional machine vision (MV) approaches has been
    slowly inching its way into this role, the recent feasibility of artificial intelligence
    (AI) approaches such as deep learning promises to change the field in the next
    half-decade.


    To date, there are no clinically validated let alone clinically accepted AI-based
    grading schemes, although there have been a few traditional MV-based models that
    combine morphometric assessment and biomarker quantitation to risk stratify patients
    [17–20]. Much more common in the literature are MV- and AI-based algorithms that
    focus on quantitating histologic features, and some have created models that correlate
    features to grade [21–23]. Although the latter, probably best described as computer-aided
    diagnosis (CAD), is a useful first step, the ultimate goal is to generate models
    that use these features to create a better prognostic tool, in terms of patient
    clinical outcome, than current grading schemes. The sections below will roughly
    follow a pipeline (Fig. 9.1) for developing an image analysis–based multivariate
    system, with attention drawn in each subsection to inherent obstacles and published
    state of the art, as well as to our own experience with solutions.


    # Tissue preparation and staining


    A few basic principles and common factors related to tissue preparation and staining
    are worth mentioning that impact the design of an algorithm development cohort
    and the feature engineering strategy. Preanalytical factors known to affect the
    antigenicity of tissue [24,25], such as length of fixation, tissue processing,
    and age of cut slides, can introduce significant variability into the set of biomarker-stained
    images used for algorithm development. This variability/noise'
