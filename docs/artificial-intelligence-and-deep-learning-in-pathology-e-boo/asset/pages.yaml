- pgno: 65
  md: '# Complexity in the use of artificial intelligence in anatomic pathology


    Stanley Cohen, MD 1,2,3


    ¹Emeritus Chair of Pathology & Emeritus Founding Director, Center for Biophysical
    Pathology, Rutgers-New Jersey Medical School, Newark, NJ, United States; ²Adjunct
    Professor of Pathology, Perelman Medical School, University of Pennsylvania, Philadelphia,
    PA, United States; ³Adjunct Professor of Pathology, Kimmel School of Medicine,
    Jefferson University, Philadelphia, PA, United States


    # Introduction


    The previous chapters were designed to demystify the machine learning strategies
    that are at the core of artificial intelligence (AI) by describing its algorithmic
    building blocks in detail, while avoiding mathematical formulation or computer
    code. As we have seen, the underlying theme of machine learning is classification,
    which essentially boils down to identifying similarities and differences among
    things. From this one can progress to understanding relationships among data for
    prediction and inference. In anatomic pathology, AI can be used to determine if
    a lesion is cancerous, evaluate the degree of malignancy from subtle morphological
    differences, predict clinical behavior, and suggest therapeutic strategies.


    AI is beginning to be a robust tool at academic centers. For this reason, commercial
    ventures to exploit it for pathology are proliferating. A major step forward for
    practical applications has been the approval of whole slide imaging for diagnostic
    purposes (as digital images are essential for machine learning). However, for
    anatomic pathology, there are a number of bottlenecks that must be addressed.
    Some that clearly stand out are (a) the huge databases required for training (true
    of neural networks in general, and not just in pathology), (b) image complexity,
    i.e., the large number of features needed to define the samples (instances) within
    the dataset, and (c) the topological complexity of the data. An example of this
    complexity is an image dataset, where each sample may contain normal as well as
    abnormal tissue and abnormal regions may vary in morphology in important ways.


    In addition to the above, relationships are important, such as the distribution
    and location of vasculature, lymphatics, inflammation, mitosis, necrosis, and
    their spatial relationship to the areas of pathology on the slide. Complicating
    these factors is the need for the integration of morphological, genetic, and various
    “-omics,” for various predictive analytics. Omic analysis in itself requires identification
    of relationships'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'within the data such as clustering and activation patterns, thus making its
    integration with morphologic information difficult. Combining omic and morphological
    data presents a daunting challenge, and translationally relevant work in this
    area has only just begun.


    These kinds of complexity issues are not unique to pathology; a good example involves
    autonomous driving algorithms where all of the above come into play. Interestingly,
    autonomous driving algorithms are developed by data scientists and computer learning
    experts, with relatively minor input from professional drivers. For the development
    of AI in pathology, there must be a close interaction between the pathologists
    (as content providers, content annotators, and ground truth arbiters for training)
    and the computer scientists who devise the appropriate machine learning algorithms
    for use. The purpose of this chapter is to expand on previous chapters describing
    the basics of machine learning and some advanced deep learning strategies for
    pathologists to bridge that gap, as well as real-world examples of the principles
    that are involved.


    In this chapter, we will first discuss how images can be segmented into regions
    of interest, using mitosis detection as an example, and then explore various ways
    of dealing with petascale datasets through weak supervision and possibilities
    for so-called one-shot learning. Other topics include the choice of an algorithm
    for a given task and the problem of parameter tuning within that algorithm. This
    is not designed to be a comprehensive review; subsequent chapters will provide
    detailed descriptions of state-of-the-art work being done in a number of pioneering
    laboratories. It will be apparent that the basic strategies for image interpretation
    can be used across a wide spectrum of other topics of interest to pathologists,
    including natural language processing and analysis and prediction from genetic
    arrays, proteomics, transcriptomes, microbiomes, etc.


    # Life before machine learning


    Before proceeding it is important to note that there were many approaches toward
    the solution of these problems before the widespread use of machine learning.
    Many of these involve the extraction of important and measurable features from
    samples and the use of clustering. In image analysis, mathematical operations
    have been used to distinguish pixel areas on the basis of intensity, color, texture,
    shape, and geometric relationship. Blobs (connected areas in an image), edges,
    and boundaries are important to identify in these tasks. One example of a mathematical
    operation used is the Hough transform, which can be utilized to isolate features
    of a particular shape within an image. While these techniques could locate nuclei,
    glands, and other structural elements within the image for the pathologist, they
    could not generalize from a constellation of these features to an overall classification
    or diagnosis of the tissue under study. Machine learning facilitated the transition
    from image analysis to image interpretation.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Multilabel classification


    When we think of the use of AI in analyzing images, we tend to think of deep learning
    structures that can recognize differences between normal and malignant tissues,
    provide reliable and accurate estimates of degree of malignancy (grading), and
    provide information regarding prognosis and optimizing therapeutic choice. Often
    this is based upon overall pattern recognition and classification based on these
    patterns. However, if there are separate islands of tumor embedded within long
    stretches of normal stroma or tissue, the segmentation of those tumor fields will
    allow the program to treat the normal as a kind of background noise. Also, in
    addition to overall patterns, pathologists look for specific defining features
    within the image. These might include the presence of mitoses, degree of vascularization,
    the presence of tumor clusters within lymphatics or small vessels in the tumor,
    necrosis, and so on. Also important are spatial relationships among these features.


    For all these reasons, in pathology, the need for massive datasets is magnified
    by the need for extensive annotation within each image. This problem is often
    addressed by decomposing the image into subsets (image patches or tiles) and trying
    to automate the process of finding regions of interest as much as possible. Dividing
    an image into subsets obviously increases the number of training instances needed.
    Moreover, within those regions of interest, there are often specific features
    we wish to identify as well as identifying and grading the lesion as a whole.
    We can use traditional segmentation, and object detection schemes embedded into
    deep neural networks, or alternatively, use a single suitably powerful network
    for all these tasks.


    Multilabel classification is based on image segmentation into regions of interest.
    There are several kinds of image segmentation, as illustrated in Fig. 4.1, which
    illustrates segregation categories for scenes of cats and dogs as a simple example.


    Semantic segregation is separation on the basis of classes within the image; in
    the illustration, the algorithm has separated classes corresponding to grass,
    cat, tree, and sky by color without information as to the relative importance
    of these classes to the


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_67_0.png)


    # FIGURE 4.1


    Categories of image segmentation. Creative Commons, public domain.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'human observer (first panel). Object detection involves localizing and classifying
    the object of interest within the image and either highlighting it for human action
    or identifying it for further analysis, as shown in the second panel. One can
    detect multiple classes in the same image (third frame). Finally, there is instance
    segmentation, in which each of the dogs is individually (and uniquely) identified.
    In other words, in instance segmentation, we separately identify each instance
    within a given class, as compared to semantic segmentation, where we identify
    each class but not the individual elements of that class.


    The final goal of this use of machine learning is thus to identify features of
    interest within the regions of interest and use these in conjunction with overall
    pattern recognition of the lesion. When dealing with problems involving multilabel
    classification, a number of machine learning algorithms may be used including
    multilabel K-nearest neighbor, multilabel decision trees, multilabel support vectors,
    and multilabel neural networks. A review of multiclassification methods before
    advent of deep learning can be found in Ref. [1], with more technical aspects
    in Ref. [2].


    # Single object detection


    As is the case for AI in general, there is no one algorithm that is optimal for
    all problems. The use of machine learning for the identification of mitoses provides
    a good example of this principle and is discussed in detail in Ref. [3]. By way
    of introduction, it should be noted that detecting mitoses is a difficult problem
    because of issues relating to interobserver variability that impose constraints
    on ground truth and because the many papers that have been published make use
    of widely varying AI approaches. This has been studied in a systematic way. By
    way of background, for many tumors, prognostic factors related to tumor proliferation
    have proven to be very important. There are a number of histochemical markers
    for proliferation. Two examples are Ki67 and BRDU. Ki67 is a protein that increases
    in cells as they prepare to divide. BRDU is a marker that is incorporated into
    cellular DNA. However, simply counting mitotic figures in tumors by pathologists
    remains the most widely form of assessment of proliferation. Although time-consuming
    and subjective, direct morphological observation can, under ideal conditions,
    identify mitotic phases. Breast tumors are good examples of cases in which proliferation
    has prognostic significance. However, even in tumor types where proliferation
    does not correlate as well with behavior, the presence of morphologically abnormal
    mitosis can confirm the diagnosis of malignancy.


    In 2013, the Assessment of Mitosis Algorithms (AMIDA13) Study was launched (as
    a competitive challenge, the results were analyzed by Veta et al. and summarized
    in Ref. [3]). The training data available to all participants consisted of image
    data accompanied by ground truth mitosis annotations (with due attention to correction
    for interobserver variability). Two months after the training dataset was released,
    a testing dataset was made available. This consisted only of image data; annotations
    were withheld by the challenge organizers to ensure independent evaluation. Results
    were uploaded to the challenge website for evaluation.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'The learning strategies that were compared were computational neural networks,
    random forests, support vector machines, Bayesian methods, and various boosting
    strategies. Most of these methods involved a two-step object detection approach
    in which the first step identified candidate objects that were then classified
    in the second step as mitoses or nonmitoses. Two of the methods evaluated did
    not use candidate extraction but instead evaluated every pixel location to obtain
    a mitosis probability map for each image, from which mitoses were detected.


    By measures of precision and recall, all of the models described in Ref. [3] gave
    good performance, with the best being the procedure with multiple alternating
    convolutional net and max-pooling layers. The F1 score (based on the ratio of
    the product of precision and recall divided by the sum of precision and recall)
    of this method was comparable to the interobserver agreement among pathologists.
    The worst performance, by these measures, made use of random forest classifiers.
    Interestingly, experiments with combining results from the different methods by
    majority voting or intersection of the better performing methods showed no performance
    gain over the best individual method.


    # Multiple objects


    Image segmentation, multilabel classification, and multiple-instance learning
    (MIL) (see weakly supervised learning section) all have features in common. For
    example, in the case of histopathologic material, only a small part of the image
    may be useful for processing and analysis. Thus, a prior step is localization,
    in which we identify areas of interest. In many applications, this is done by
    breaking the image up into small contiguous patches and either identifying the
    “regions of interest” through prior annotation of the training set or by strategies
    within the algorithm itself. This is similar to the methods used for MIL to be
    discussed in a subsequent section.


    As aforementioned, object detection is based on the use of a classification label
    for the objects of interest within the sample images, rather than simply for the
    sample as a whole. Various machine learning strategies led to the simultaneous
    identification and classification of multiple labels within images. As is the
    case for image analysis in general, neural networks have transformed this field.
    Typically, one extends a convolutional neural network (CNN) to multilabel classification
    by transforming it into multiple single-label classification sets. These treat
    the labels independently and so have difficulty in modeling dependency between
    labels. Object detection is not limited to neural network analysis. Many of the
    machine learning strategies can be applied to this task as well. There have been
    only a few comparative studies of these using standardized datasets. One example
    has already been described in detail [3]. Bjednordi et al. have compared 32 algorithms
    for detecting lymph node metastases [4]. Twenty-five were based on deep convolutional
    networks, while the remainder utilized support vector machines or random forests
    and statistical and structural texture features. The tasks included both metastasis'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'identification and whole slide image classification. All the algorithms performed
    well, and several were better than the best performing pathologists in the comparison
    panel.


    # Advances in multilabel classification


    At this point, it is helpful to compare this image analysis problem to issues
    that arise in autonomous driving. The algorithms must be able to identify human
    beings, other cars, road markers, traffic signs, and their specific locations
    within a scene and thus make use of multilabel classification strategies. As driving
    is a dynamic process, there needs to be a way of dealing with sequential data,
    and for this purpose, recurrent neural networks (RNNs) are an obvious choice as
    they capture temporal relationships. Recently, there have been several advances
    in the use of visual attention or RNNs combined with CNNs for this purpose. Recall
    from the previous chapter that whole CNNs are good for dealing with spatially
    related data and RNNs are good at handling temporally related data. Previously,
    RNNs have been used for signal analysis, sequential images (video), and natural
    language processing (where the temporal sequence of words in a sentence matters).
    They can also be used for static image analysis. Here, an RNN processes inputs
    sequentially, dealing with locations within the images one at a time, and incrementally
    combines information so obtained to create the internal representation.


    For example, Wang et al. [5] described a model inspired by the way humans analyze
    images by continuously moving and their attention from one discriminative object
    to the next when performing image-labeling tasks. As usual, the CNN extracts the
    deep feature representations, and the RNN (in this case a long term short term
    memory (LSTM) network) iteratively locates class-related regions and predicts
    label scores for these. LSTM networks are explained in Chapter 3. This model also
    appears to allow for class redundancies in labeling. For example, for many purposes,
    labels such as “baby cat” and “kitten” have pretty much the same meaning. Although
    this study did not involve histopathological materials, more recently, Alom et
    al. performed similar studies combining residual and recurrent networks [6]. This
    sophisticated model was applied to blood vessel segmentation, skin cancer segmentation,
    and lung lesion segmentation. This model yielded state-of-the-art performance
    in all three tasks.


    The possibility of exploiting reinforcement learning for image recognition tasks
    in pathology is especially interesting. In the case of autonomous driving, reinforcement
    learning has been applied to dynamic sensory input, but reinforcement learning
    has only begun to be exploited for tasks involving static image analysis. Mathe
    et al. [7] have described sequential search strategies that accumulate evidence
    from a set of image locations utilizing reinforcement learning concepts such as
    exploration and reward. Basically, traditional object detection is based upon
    an exhaustive spatial search and is brute force in nature whereas reinforcement
    learning involves moving toward a defined goal in a stepwise manner. Chen et al.
    [8] have combined'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'attentional models with reinforcement learning where the “reward” is classification
    correctness.


    Interestingly, biological neural networks such as brains utilize reinforcement
    learning in visual pattern recognition. They also learn to recognize sequences
    of patterns. Thus, it appears likely that approaches such as these will be fruitful
    in pathology as well.


    # Graphical neural networks


    Sophisticated implementations such as those above capture relationships among
    the objects in an image in addition to classifying them. However, there are a
    number of modern approaches that deal explicitly with such relationships. The
    majority of these fall into the category of graph neural networks. In mathematical
    terminology, a graph is a collection of distinct objects (vertices or nodes) and
    lines (edges) connecting them (Fig. 4.2).


    Both neural networks and decision trees are graphs, as are connecting flight maps
    and highway maps connecting cities. In the case of a neural network, the nodes
    are the simulated neurons and the edges show the direction in which weighted information
    flows toward the next layer of nodes. Edges can be unidirectional or bidirectional.
    As an example, network analysis, which is a branch of graph theory, is used to
    understand relationships and patterns within transcriptomes.


    If data can be expressed as a network, then it is possible to analyze not only
    the relationship of a test sample to the classes defined by the training set but
    also the relationship between the attributes that define that sample. A graphical
    network


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_71_0.png)


    **FIGURE 4.2**


    (A) Sample graph showing nodes and edges connecting them, as well as apparent
    clustering into four subgroups. *Reprinted from Wikipedia commons, public domain.*
    (B) Actual protein expression network of a treponeme.


    *Reprinted from Wikipedia commons, with attribution: Hauser, et al., The syphilis
    spirochete, PLoS One 2008; 3(5):e2292. https://doi.org/10.1371/journal.pone.0002292.*'
