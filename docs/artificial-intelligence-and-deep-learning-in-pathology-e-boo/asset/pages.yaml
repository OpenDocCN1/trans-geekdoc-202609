    identifying each gland or nucleus with a unique label. A classic algorithm for
    IF nuclear segmentation is Ref. [51], which operates according to a popular nuclear
    detection pattern, by first finding seed points, one per nucleus, and then growing
    the seeds according to proximity, size, and shape constraints to find the nuclear
    boundaries. Many variations of this algorithm have been proposed for H&E and IHC
    images also, e.g., Ref. [52], but they all share a common problem which is that
    the irregular texture and holes, the result of chromatin clumping and marginating
    in high-grade nuclei, lead to the detection of multiple seed points per nucleus,
    producing fragmented segmentations. A second (inverse) problem is that closely
    packed nuclei may be merged together when too few seed points are detected or
    the nuclear borders are missed. A comprehensive review of nuclei segmentation
    algorithms [53] shows the successful application of deep neural networks to these
    problems.


    A distinct problem, common in epithelium segmentation of IF images, is the inconsistency
    of cytokeratin intensity throughout the cytoplasm, often magnified by the negative
    impression where the nucleus sits, or the DAPI holes. This problem has been addressed
    by combining epithelial with nuclear segmentation, as in Ref. [54], by filling
    in nuclear holes in the cytokeratin (the inverse of the DAPI image) along the
    gland border where the nuclei are clustered and the staining is often weaker.
    In order to compensate for unmixing errors, which may result in strong background
    signal or in weak response along gland borders, we have developed a combined unmixing/segmentation
    algorithm which is robust against typical under- and over-segmentation errors.


    # Nuclei detection and segmentation in H&E images


    Although not part of the Gleason grading system, manually characterizing nuclei
    is a common thread throughout most grading schemes and often one of the least
    reproducible [11,12]. As described above in IF images, H&E segmentation of nuclei'
