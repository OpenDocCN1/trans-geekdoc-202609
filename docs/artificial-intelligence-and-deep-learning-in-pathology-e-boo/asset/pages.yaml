- pgno: 220
  md: 'treatment options stimulate immune cells or block immune checkpoint pathways.
    The best examples of recent success in immunotherapy include monoclonal antibody-based
    treatment strategies that block cytotoxic T-lymphocyte associated protein 4 (CTLA-4)
    and programmed cell death protein-1 (PD-1), which have generated substantial interest
    in identifying other novel clinically actionable targets that can further improve
    treatment response and clinical outcomes through combinations with existing chemotherapy
    and other novel pharmacologic options. Other types of treatments that are being
    explored include chimeric-antigen receptor T-cells (CAR-T) that are produced by
    genetically modifying T-cells harvested from individual patients; recombinant
    proteins to stimulate and enhance cytotoxic T-cell activity; cancer vaccines to
    augment antigen presentation; and oncolytic viruses to initiate systemic anti-tumor
    immunity in order to target and destroy cancer cells [30,37,38].


    Examples of immune checkpoint therapy with CTLA-4 or PD-1/PD-L1 to overcome the
    immunosuppression mediated by tumor cells [37,38,64,66] include melanoma, renal
    cancer, and lung cancer [67–71]. Ipilimumab, the monoclonal antibody that blocks
    CTLA-4, was approved by the Food and Drug Administration (FDA) to treat melanoma
    in 2011, which was followed by FDA approval for nivolumab to block PD-1 in melanoma
    and non–small cell lung cancer (NSCLC) in 2014 [50,72]. These success were followed
    by the introduction of Pembrolizumab, which is considered to be a breakthrough
    therapy for the treatment of NSCLC because treatment response is significantly
    improved in tumors that also express high levels of the PD-L1. Nivolumab has also
    been recently approved to treat patients with advanced metastatic squamous NSCLC
    with disease progression in combination with or after standard platinum-based
    chemotherapy [39,71,72]. In order to further improve the therapeutic efficacy
    of these immune checkpoint inhibitors, combinations of immunotherapy with existing
    forms of chemotherapy and other forms of targeted therapies are currently being
    tested and evaluated in patients with locally advanced or metastatic cancer [37,73–76].


    Despite this success, the identification and stratification of patients who will
    likely benefit from immunotherapy is not so straightforward, even though the PD-1
    signaling blockade has become an established form of treatment for many types
    of cancer. Commercially available standardized assays to evaluate the bioactivity
    of PD-1/PD-L1 lack antigen specificity, even though the overexpression of surface
    or soluble PD-L1 in multiple tumor types is mostly associated with poor prognosis
    [67,70,72,76–81]. The histologic assessment of PD-L1 is also challenging due to
    heterogeneous expression in cancer and benign normal tissues, which is further
    complicated with unintuitive thresholds and cutoffs for scoring PD-L1 positivity
    that can vary and lead to known problematic interobserver variability in PD-L1
    assessment by pathologists [42,82–84].


    As immunotherapy expands, there is a high demand for reliable and standardized
    bioassays and scoring methods that can characterize antibodies and evaluate expression
    to select the appropriate patients for PD-1/PD-L blockade therapy. Since checkpoint
    inhibitors and other forms of emerging immunotherapy rely on the host immune system
    and tumor infiltrating lymphocytes (TILs) to fight cancer, the'
