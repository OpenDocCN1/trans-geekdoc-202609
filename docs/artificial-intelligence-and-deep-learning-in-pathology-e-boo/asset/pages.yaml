- pgno: 126
  md: "# # 7. Applications of artificial intelligence for image enhancement in pathology\n\
    \n**Tanishq Abraham**<sup>1</sup>, **Austin Todd**<sup>2</sup>, **Daniel A. Orringer,\
    \ MD**<sup>3</sup>, **Richard Levenson, MD**<sup>4</sup>  \n<sup>1</sup>Department\
    \ of Biomedical Engineering, University of California, Davis, CA, United States;\
    \ <sup>2</sup>UT Health, San Antonio, TX, United States; <sup>3</sup>Associate\
    \ Professor, Department of Surgery, NYU Langone Health, New York City, NY, United\
    \ States; <sup>4</sup>Professor and Vice Chair, Pathology and Laboratory Medicine,\
    \ UC Davis Health, Sacramento, CA, United States\n\n# ## Introduction\n\nThis\
    \ chapter will describe and discuss opportunity for artificial intelligence (AI)\
    \ to contribute to image quality improvements and to simplify and accelerate imaging\
    \ methods. There are two major goals for adding AI to imaging tasks. The first\
    \ is direct image enhancement and conversion to different imaging modes (for example,\
    \ autofluorescence to simulated H&E) for direct visual “consumption.” The second\
    \ is the eventual deployment of AI-based classification and quantitative approaches.\
    \ We will concentrate on the former and give one example of the latter, which\
    \ demonstrates the real-world application of AI in intraoperative surgical guidance\
    \ in brain tumor surgery. This approach, which has already entered the clinic,\
    \ accomplishes not only improved patient care via accelerated, high-quality tumor-site\
    \ imaging but also can reintegrate pathology into surgical decision-making and\
    \ reinforce collaborative relationships. This will be explored in detail in the\
    \ latter section of this chapter.\n\nThe basic underpinning of all the approaches\
    \ to be discussed below is that there is information content present in images\
    \ that is hard to discern with direct (human) visual observation, but that can\
    \ be elicited using AI tools that have been trained to associate image type 1\
    \ with image type 2. This requires some degree of image content stereotyping,\
    \ in that the relationships have to be established within a context of a relatively\
    \ limited spatial, textural, and biological variability. While transfer learning\
    \ from “irrelevant” sources, such as images of cats and dogs, can prime a learning\
    \ network to be sensitive to image primitives such as edges and textures, it will\
    \ not do a good job predicting image content for histology specimens without specific\
    \ and focused exemplars. To take this argument to the limit, the more random noise\
    \ or extreme variation is present, the poorer AI predictive or conversion tools\
    \ will perform. It is impossible to take an image consisting of pure noise, downsize\
    \ it, and then predict via AI its true high-resolution content. Fortunately, histology\
    \ does exhibit a limited repertoire—only so many colors are anticipated, nuclei"
