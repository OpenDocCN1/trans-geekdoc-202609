    we will occasionally make a mistake. The model generalizes well. In contrast,
    in case B we have a boundary line that has separated both classes perfectly. In
    this case, when the model sees a novel point, it will simply bend the boundary
    again so as to accommodate it, rather than generalize it for prediction. Perfection
    is the enemy of the truth. The subject of overfitting is a complex one and the
    details are beyond the scope of this chapter. For a complete discussion of overfitting
    and mechanisms for dealing with it, see Ref. [12].'
