    gland identification. Traditional handcrafted image analysis techniques begin
    with a prior concept of acinar structure. Monaco et al. [26] conceived of a prostatic
    acinus as a lumen surrounded by a collar of epithelium. To distinguish between
    benign prostatic glands and prostatic adenocarcinoma, a Markov iteration was used
    to group and separate microacini from benign glands. Separation of Gleason patterns
    3 versus 4 was facilitated by this schema. Singh et al. [27] used a combination
    of pixel and object-level classifiers which incorporated local and spatial information
    for consolidating pixel-level classification results into object-level segmentation
    of acini. As alluded to above, Chen et al. [19] have described a DCAN which provides
    a unified multitask learning framework examining contextual features by using
    a fully convolutional network. The fully convolutional network takes an image
    as input and outputs a probability map in one forward propagation. In this system,
    object features (for example, texture and color) are integrated with contour information.
    The result is a system which addresses the difficult problem of separating touching
    objects. The system is extensible to many types of objects including benign and
    malignant colonic glands and nuclei.'
