- pgno: 261
  md: 'Through this architecture, the authors attempted to find units which performed
    biologically meaningful discriminations of tissue patterns. They hypothesized
    that if the system observed tiles which contained information regarding disease,
    then some memory cells within the network will learn this pattern, aggregate it
    into memory, and propagate the understanding through the network. The authors
    used LSTM networks to examine tissue microarrays of colorectal carcinoma. They
    found that the LSTM model provided a strong hazard ratio for disease prognosis
    as compared to visual scoring, but that their LSTM system did not outperform the
    Dukes staging system for colorectal carcinoma prognosis.


    Deep learning classifiers have also been used in predicting outcomes of nonneoplastic
    conditions. For example, in the arena of cardiac pathology, Nirschl et al. [39]
    used deep CNNs to predict clinical heart failure from H&E-stained whole slide
    images with 99% sensitivity and 94% specificity.


    The clinical pathology laboratories of health systems offer robust data basis
    of well-organized quantitative data representing the chronological patient record.
    Cabitza and Banfi [9] review multiple applications of machine learning to clinical
    laboratory data for the diagnosis, prognosis, and predictive modeling of a variety
    of conditions. These authors predict a deluge of investigations using clinical
    laboratory data and machine learning in the near future.


    # The digital assistant for anatomical simulation learning


    Just as the digital revolution has required a robust infrastructure, so also does
    the learning from and teaching of complex 3D subjects like anatomy. Pedagogically
    relevant programs to develop, test, and scale a data-intensive, bandwidth-heavy,
    digitally enhanced, collection and visualization systems for anatomical data are
    critical to UME, GME, and CME training in radiology, surgery, and pathology. Simulation
    learning depends on computational approaches to the 3D structure of human gifts,
    large animal models, radiological images, and pathological specimens. 3D Slicer
    (http://www.slicer.org) is an open source software platform for the registration,
    interactive segmentation, visualization, and volume rendering of medical images
    and for research in image-guided therapy [40]. This sort of computational analysis
    of structure can integrate biological and digital phantoms within the pedagogic
    experience. This juxtaposition can allow for robust surgical simulation programs,
    which integrates the use of artificial phantoms, digital phantoms, and biological
    phantoms in preclinical surgical investigation, teaching, and training. This combination
    of the core activities of teaching and investigation in the structural sciences
    can offer a laboratory where students can learn in the new environment of quantitative
    structural science.


    # The digital assistant for image-omics data fusion


    When trying to understand the cell biology systems which underpin all pathological
    interpretations, the data from different modes of examination are best not considered'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'in isolation. Rather, these data are streams (or perhaps torrents) which integrate
    and literally “fuse” into robust representations of these complex cell and tissue
    systems. Both image and molecular ‘omic (genomic, proteomic, metabolomics, etc.)
    data are dense and heterogeneous. Image data are strong at probing the relationships
    among features. Reductionist ‘omic data are strong at probing causal pathways.
    The frameworks in which image data and ‘omic data are represented are often quite
    different. We know digital image data as pixels features and values and ‘omic
    data as molecular structures, molar quantities, and frequencies. It is not intuitively
    evident that these very different modes of data can live in the same space. Computational
    pathology and AI approaches, however, now allow for the quantitative fusion of
    these diverse cross-modal data streams in support of the modeling of complex biological
    systems.


    There are several approaches to combining data. One is that of combining interpretations.
    In this method, there is an aggregation of the decisions made from classifiers.
    Each classifier corresponds to one particular data stream. This is quite common
    in biology and medicine. A combination of interpretations may, however, not be
    able to leverage all the power of the combined data streams because information
    is often lost in the process of converting from feature vectors to class labels.


    A concatenation of high-dimensionality feature vectors is an inclusive approach,
    which subsumes all the available features; however, this approach invokes the
    “curse of multidimensionality,” whereby the excess of features compared to patients
    may result in a classifier system which is overfit. Dimensionality reduction approaches
    such as principle component analysis (PCA) project feature vectors into a unified
    low-dimensionality eigenvector space. PCA assumes that the system data are contained
    within a linear space. Most biological systems, however, are nonlinear. Nonlinear
    dimensionality reduction approaches can be of assistance in addressing such complex
    systems. There are numerous algorithms for manifold learning and nonlinear dimensionality
    reduction. Some of these algorithms simply function as visualization tools, while
    others map data from high-dimensionality space to low-dimensionality spaces. Data
    may be combined by creating transformed representations of each data stream before
    combining the transformed representations. Data streams are projected (embedded)
    into a homogeneous metaspace, where all data are represented at the same scale.
    Embeddings may be combined in many ways. For example, one strategy is to combine
    embeddings by using high-dimensionality kernels. Kernels are dot product representations
    of each modality, which can be combined to create a fused representation of heterogeneous
    data. Using another method, Lee et al.[41] examined the effectiveness of fused
    data to predict biochemical recurrent of prostate cancer after radical prostatectomy.
    These authors employed a novel technique which they termed supervised multiview
    canonical correlation analysis (sMVCCA). Canonical correlation analysis (CCA)
    is a multivariate statistical method which seeks to find a linear subspace in
    which correlation between two sets of variables is maximized. Using sMVCCA, Lee
    et al. created an integrated feature vector composed of quantitative histopathological
    features and proteomic features obtained from tandem mass spectrometry of prostate'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'cancer from radical prostatectomies. Kaplan–Meier analysis showed improved
    biochemical recurrence free survival prediction using the sMVCCA fused data classifier
    as compared to histology or proteomic features alone.


    In another example, Savage and Yuan [42] presented a new tool for selecting informative
    features from heterogeneous data types and predicting treatment response and prognosis
    which they have named FusionGP. This is a Bayesian nonparametric method for integrating
    multiple data types. The relationships between input features and outcomes are
    modeled through a set of (unknown) latent functions. The latent functions are
    constrained using a set of Gaussian priors, and sparse feature selection is applied.
    The most strongly selected molecular features were evaluated in gene ontology
    for dominant core processes at work. These authors examined a cohort of 119 ER-negative
    and 345 ER-positive breast cancers to predict two important clinical outcomes:
    death and chemoinsensitivity by combining gene expression, copy number alteration,
    and digital pathology image data. For the prediction of disease-specific death,
    the molecular data were most informative for the ER-negative tumors. Interestingly,
    image features outperformed the molecular data in ER-positive tumors.


    The digital assistant of the future might present the diagnostician with a variety
    of data fusion options to assist the HI–AI partnership team seeks in identifying
    the best precision diagnostic, prognostic, and predictive statements for a given
    patient.


    # Artificial intelligence and regulatory challenges


    The adoption of computational methods into the diagnostic workflow will require
    an aligned combination of technology, economic value, and regulatory oversight
    to insure a safe process. The FDA employs a risk-based paradigm for medical device
    classification. “Premarket approval” (PMA) is required for Class III devices,
    which have no comparison to a predicate. A “510(K) Premarket notification” is
    a path to market for new devices which are substantially equivalent to predicate
    devices. In certifying image-based pathology systems, the FDA has broad experience
    in the regulation of image-based instrumentation driven by algorithms. The clinical
    use of algorithms in image-based assays in pathology already exists in several
    domains including automated hematology analyzers, chromosome analysis, FISH enumeration
    systems, urine sediment analysis, gynecological cytology, and IHC for predictive
    markers such as HER2/neu, ER, and progesterone receptor (PR).


    When considering the regulation of market entry for deep learning AI systems in
    image-based pathology, the new regulatory challenge is to provide access to these
    powerful systems and yet constrain their application to use cases, where patient
    safety can be assured. Clearly, new approaches to the regulatory evaluation of
    machine learning systems are required.


    The understanding of the relationship between digital image data and the human
    perception of image data in pathology is one challenge. Gallas and'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'Gravrielides [43] from the FDA are creating an evaluation program which develops
    information regarding which technical characteristics of an image-based system
    are important; learning how these technical characteristics impact pathologists’
    interpretations; and understanding how these technical characteristics can be
    measured. These authors and their colleagues have created an “evaluation environment
    for digital and analog pathology (eeDAP).” They anticipate that this be used as
    a “Clinical Outcome Assessment tool used in reader studies for A premarket submissions
    (PMA or 510k DeNovo) to compare the accuracy or reproduce ability of pathologist
    evaluations of digital images on a display to those of glass slides on a microscope.
    The pathologist evaluations of outpatient tissue are the clinical outcomes. The
    accuracy or reproducibility is the clinical outcome assessment; this assessment
    reflects image quality.” Such tools will be important in examining sources of
    discrepancies between pathologists for classifying different types of diseases,
    for developing a panel of histopathological patterns and related decision support
    tools for improving pathologist performance for these classification tasks, and
    in assessing pathologist performance with whole slide images versus traditional
    optical microscopy.


    A second challenge is fixing on the target of regulation. Machine learning systems
    are endlessly changing. With each epoch, a machine learning system understands
    or “sees” a set of images differently and can output a different understanding
    of class assignments. The fundamental regulatory challenge for harnessing image-based
    machine learning systems as clinical decision tools is to constrain the questions
    asked to clinically meaningful outputs which can be tested against other forms
    of understanding. For example, if a machine learning system outputs an interpretation
    of Her2/neu IHC that seeks to classify a breast cancer as having amplification
    of this gene, the output of the image-based test can be validated with other modes
    of analysis such as PCR or FISH for Her2/neu amplification. This validation is
    only possible after some training and testing time of the machine learning system
    and during a period when the learning system is locked down and not changing.
    The qualification(s) of image-based machine learning systems as clinical laboratory
    tools are likely to address newly proposed machine learning systems in a series
    of locked down versions, each of which will have to be validated. Functionally,
    what will need to be developed are rapid validation programs with which regulatory
    agencies such as the FDA can quickly compare the outputs of locked down machine
    learning system versions against predicate testing systems.


    The current literature on the use of image-based machine learning systems as clinical
    laboratory testing tools is primordial. It is apparent from a quick inspection
    that most of the studies cited above are investigational and not yet ready for
    use in clinical practice. The tremendous opportunities promised by machine learning
    technologies are, however, likely to soon propel these tools into 510(k) approval
    pathways. Humans in the loop architectures are likely to be deemed safer approaches
    for the early application of machine learning systems in pathology and laboratory
    medicine.'
