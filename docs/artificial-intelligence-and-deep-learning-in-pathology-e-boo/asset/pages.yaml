- pgno: 136
  md: 'performance of these tasks. These tasks are mitotic figure detection, tumor
    metastasis detection, prostate epithelium detection, and colorectal cancer tissue
    type detection. Basic, morphology-based, brightness and contrast, HSV-based, and
    H&E-to-DAB (HED)-based augmentation methods were tested. In terms of stain normalization,
    starting points of no transformation, grayscale transformation, and a chromatic
    distribution–based technique were tested. The augmentation and stain color normalization
    methods were used as preprocessing for a simple patch CNN classifier. A CNN classifier
    was trained for each combination of organ, color normalization, and data augmentation
    method studied. The performance of the classifier was evaluated with the AUC-ROC
    metric. A global ranking of the methods based on their AUC-ROC score for each
    task and organ was established. Based on these rankings, it was determined that
    stain color augmentation was crucial for the performance of the CNN classifier.
    The novel deep learning–based stain color normalization also improved the results.
    Importantly and somewhat surprisingly, using the deep learning normalization method
    did not alleviate the need for color augmentation. Utilizing stain color normalization
    alone is insufficient to achieve high classification accuracy.


    # Mode switching


    Traditionally, microscopy with H&E (or related) staining or fluorescent labeling
    requires time-consuming and potentially variable labeling procedures. In addition,
    staining or labeling can typically only be used for ex vivo applications. Another
    major disadvantage is the damage to the sample that staining and/or labeling can
    induce. Additionally, the act of imaging itself can degrade the specimen via forms
    of photodamage.


    Many novel microscopy techniques have been developed in order to overcome these
    challenges. However, the traditional H&E-stained histopathology images are most
    accessible to histopathologists. Additionally, the images obtained with these
    new techniques may be harder to interpret, as well as susceptible to varieties
    of artifacts, making these techniques more difficult for histopathologists to
    adopt. Therefore, converting novel modalities to resemble H&E-stained slides (or
    vice-versa) may allow for a wider adoption of these modalities. For example, Fig.
    7.3A demonstrates how quantitative phase imaging is an imaging modality that is
    hard for the uninitiated to interpret, but still can be introduced in a histopathologist’s
    workflow by utilizing neural networks to convert these images to H&E-like results.
    We will describe several reports of how deep learning techniques are used for
    such mode of conversion. Most of these reports utilize GAN architectures and their
    variants, discussed in Section 2.3.


    Quantitative phase imaging (QPI) is a relatively recent label-free imaging technique
    with lower phototoxicity that can be deployed on various platforms (including
    portable platforms). In order to bridge the gap between QPI and standard histopathology,
    Rivenson et al. [36] used a GAN to convert phase-based microscopy images to histological
    images (Fig. 7.3A–B). Three models were'
