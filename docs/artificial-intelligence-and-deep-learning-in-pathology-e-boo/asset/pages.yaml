  md: 'of data with limited labels. The analytics which can be applied is now beginning
    to match the big data of biology and medicine.


    # ## Digital pathology versus computational pathology


    It is important to distinguish between the terms *digital pathology* and *computational
    pathology*.


    *Digital pathology* is best understood as the digital workflow tools which are
    more focused on the front end of the process. Digital pathology is a dynamic,
    image-based environment that enables the acquisition, management, and interpretation
    of pathology information generated from a digitized glass slide. Healthcare applications
    include primary diagnosis, diagnostic consultation, intraoperative diagnosis,
    medical student and resident training, manual and semiquantitative review of immunohistochemistry
    (IHC), clinical research, diagnostic decision support, peer review, and tumor
    boards. Digital pathology is an innovation committed to the reduction of laboratory
    expenses, an improvement of operational efficiency, enhanced productivity, and
    improving treatment decisions and patient care.


    Broadly written, the approaches to the computational modeling of complex systems
    of human disease from big data are termed “*computational pathology.*” In 2011,
    Fuchs and Buhmann [3] opined that “Computational Pathology investigates a complete
    probabilistic treatment of scientific and clinical workflows in general pathology,
    i.e., it combines experimental design, statistical pattern recognition, and survival
    analysis within a unified framework to answer scientific and clinical questions
    in pathology.” Computational pathology focuses on the analytics of extracting
    data from the output of sensors and turning those data into information and knowledge.
    This might include both prognostics and outcome prediction or simply a quantitative
    cataloging of tissue morphologies represented by computation.


    # ## Data on scale


    The scientific understanding of human structure has stagnated as a largely descriptive
    endeavor for many decades. Structural science learning related to cells, organelles,
    and tissues is central to the disciplines of cell biology and pathology. With
    the advent of machine vision and machine learning, major advances in computing
    and network power, and the rapid evolution of advanced biophysical systems for
    cellular imaging, these disciplines are poised to embrace a quantitative paradigm
    for their work. The data embedded in a cellular or tissue image are deep and full
    of complex relationships. Thousands of image metrics derived by machine vision
    can be captured from a field of view and used in the modeling of complex biological
    or disease system outcomes. Computational advances now offer the promise of enabling
    the quantitative analysis of human structural data.


    Biological data lives on scale. Modern imaging, image analytics, and computational
    methods provide tools with which to quantitatively mine the data within macroscopic
