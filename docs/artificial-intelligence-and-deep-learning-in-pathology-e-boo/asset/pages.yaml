    # Things to come


    While the many models for deep learning are impressive in their sophistication
    and power, we are only at the beginning of the age of artificial intelligence.
    Our human brains still have a number of obvious advantages over ANNs as presently
    implemented. For example, we can learn complex patterns from a very small training
    set of examples, and are much better than machines at avoiding both overfitting
    and the increase of errors with multiple processing layers due to vanishing gradients
    during backpropagation. In fact, backpropagation itself seems biologically unlikely,
    based in part on measures of latency during biologic learning, and because very
    few neurons have taken courses in multivariate calculus. For these reasons, there
    has been an increasing interest in models for deep learning that more closely
    mimic our current understanding of biological neural function. This includes both
    the development of spiking neural networks, and attempts to replace backpropagation
    in more traditional models, the latter via synthetic gradients, random feedback,
    or direct feedback alignment. With respect to spiking networks, the notion of
    a set of weighted inputs across layers is replaced by an integrate-and-fire model
    that integrates incoming pulses based upon pulse coding. Such models lend themselves
    well to synaptic plasticity, by which is meant that there is a correlation between
    pre- and postsynaptic neurons based upon long-term depression and potentiation
    effects. They have intrinsic temporal information processing activity, and are
    amenable to implementation of unsupervised learning strategies. Current spiking
    models are relatively simplistic and are not yet competitive with traditional
    ANNs for practical applications, but there is a great deal of ongoing research
    on optimizing them.


    Of great potential significance is the creation of artificial neurons and synapses
    that will allow for the construction of spiking networks in hardware as well as
    software. For example, Tuma et al. [13] have described an artificial stochastic
    phase-change neuron in which membrane potential is represented by a reversible
    amorphous-to-crystal phase transition. More recently, Schneider et al. [14] have
    described an artificial synapse in which the strength of an electrical current
    flowing'
