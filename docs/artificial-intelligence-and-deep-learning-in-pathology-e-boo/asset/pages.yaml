- pgno: 104
  md: 'emphasis on scanning speed, image quality, and high-throughput capabilities.
    A modern WSI scanner today can run in batch mode and can capture and compress
    an image of a slide with a 1.5 × 1.5 cm tissue section in under a minute with
    spatial sampling as low as 0.25 microns/pixel. These scanners have now also implemented
    cutting-edge optics, illumination, and sensors which allow for high-speed image
    capture [31,32].


    WSI scanners of the future still have many chances to improve many aspects of
    the mechanics and performance such as speed, point spread function, scan to view
    timing latency, and other methods of captures such as Z-stacking, immunofluorescence,
    and phase contrast. These enhancements should result in substantial improvements
    in speed, throughput, and resolution in the future. Z-stacking is an especially
    important consideration for organizations and/or laboratories that will be scanning
    cytology specimens and/or blood smears.


    Many recent studies have demonstrated the utility of WSI in teaching and assessment
    [7,85,86]. The high-speed WSI robot industry is becoming highly diverse with a
    wide range of optics, detectors, slide handling devices, and software resulting
    in an increasing range of capabilities and costs. The quality of the images produced
    is generally of diagnostic quality, and with the viewing software, it is possible
    to have annotations and clinical metadata presented with the image, resulting
    in a virtual microscope with all the clinical information needed to sign out the
    case [8,9,87,88].


    The quality of focusing is limited by multiple optical and mechanical constraints,
    notably numerical aperture (NA) of the objective and movement resolution on the
    vertical (z) axis. Newer devices are implementing nontraditional optics, illumination,
    and sensors designed specifically for very high-speed image capture, resulting
    in significant improvements in speed, throughput, and resolution. Several scanners
    come with automatic algorithms to determine the optimal focus throughout the slide,
    but most scanners only have the capacity to image one level of the z-axis at a
    time.


    The ability of a WSI system to create sharp, well-focused digital images in true
    color is determined by a combination of several components of the system’s optical
    setup, including platform stability, optics, camera, adapter, and condenser setup.
    In general, the resolution feature represents an objective comparison measurement
    of the capability of an optical-based system to represent fine details in an image,
    usually represented as µm/pixel. Resolution correlates to the combined NA of the
    objective lens and condenser. Higher NA values result in higher image resolutions
    [6,89–91].


    Increasing resolution also presents compromises to the overall scanner performance,
    including increased scanning time and decreased depth of field of focus, resulting
    in more frequent focus adjustments. The increased operational and algorithmic
    performance needs, coupled with lower sensitivity to histological preparation
    artifacts, may result in higher rescan rates. However, higher resolution is critical
    for interpretation of digital images of certain tissue types/applications such
    as transplant kidney biopsies [36]. For example, a scanning resolution'
