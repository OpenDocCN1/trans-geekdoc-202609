- pgno: 16
  md: 'The simplest neural net has at least one hidden layer. Most neural nets have
    several layers of simulated neurons, and the “neurons” of each layer are connected
    to all of the neurons in the next layer. These are often preceded by a convolutional
    set of layers, based loosely on the architecture of the visual cortex of the brain.
    These transform the input data to a form that can be handled by the following
    fully connected layer. There are many different kinds of modern sophisticated
    machine learning algorithms based on this kind of neural network, and they will
    be featured predominantly throughout this monograph. Not all machine learning
    programs are based on these deep learning concepts. There are some that rely on
    different interconnections among the simulated neurons within them, for example,
    so-called restricted Boltzmann networks. Others, such as spiking neural networks,
    utilize an architecture that is more like biological brains work. While these
    represent examples of the current state of the art in AI, the basic fully connected
    and convolutional framework are simpler to train and more computationally efficient,
    and thus remain the networks of choice as of 2019.


    It should also be noted that it is possible to do unsupervised or weakly supervised
    learning where there is little to no a priori information about the class labels
    and large datasets are required for these approaches as well. In subsequent chapters
    we will describe these concepts in detail as we describe the inner workings of
    the various kinds of machine learning, and following these we will describe how
    AI fits into the framework of whole slide imaging (WSI) in pathology. With this
    as baseline, we will explore in detail examples of current state-of-the art applications
    of AI in pathology. This is especially timely in that AI is now an intrinsic part
    of our lives. The modern safety features in cars, decisions on whether or not
    we are good credit risks, targeted advertising, and facial recognition are some
    obvious examples. When we talk to Siri or Alexa we are interacting with an AI
    program. If you have an iWatch or similar device, you can be monitored for arrhythmias,
    accidental falls, etc. AI’s successes have included natural language processing
    and image analysis, among other breakthroughs.


    AI plays an increasingly important role in medicine, from research to clinical
    applications. A typical workflow for using machine learning for integrating clinical
    data for patient care is illustrated in Fig. 1.4.


    IBM’s Watson is a good example of the use of this paradigm. Unstructured data
    from natural language is processed and outputted in a form that can be combined
    with the more structured clinical information such as laboratory tests and physical
    diagnosis. In the paradigm shown here, images are not themselves interpreted via
    machine learning; rather they are the annotation of those entities (diagnostic
    impression, notable features, etc.) that are used. As neural networks have become
    more sophisticated, they can take on the task of interpreting the images and,
    under pathologist and radiologist supervision, further streamline the diagnostic
    pathway. In Fig. 1.4, AI is the term used to define the whole process by which
    the machine has used its training to make what appears to be a humanlike judgment
    call.'
