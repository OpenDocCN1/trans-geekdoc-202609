  md: '![](img/ec668102bd6cbe5645156f246a7c2e8b_27_0.png)


    # FIGURE 2.4


    Creating a linear separator for the data by adding a dimension to it. The separating
    plane shown in the 3D space on the left is analogous to a line drawn in 2D space.
    In general, for any N-dimensional space, a linear construct such as this is defined
    as a hyperplane.


    > *Reprinted with permission from Eric Kim (www.eric-kim.net).*


    to see that a flat plane can divide them. In general, an SVM can raise the dimensionality
    of the data space until an (N-1) hyperplane can separate the classes. In this
    example, the two-dimensional plot is transformed into a three-dimensional space
    such that an N = 2 hyperplane can provide a boundary.


    # The K-Means Algorithm (KM)


    This is also a classic clustering algorithm, but it is discussed in a separate
    section because it important not to confuse it with KNN, and so they are presented
    separately for pedagogical rather than conceptual reasons. This is another important
    distinction, in that unlike the K nearest neighbor algorithm, it involves unsupervised
    learning. As such, it has important applications not only on its own but also
    in conjunction with some deep learning methods.


    The K means algorithm attempts to find clustering in unlabeled data. One starts
    by making a guess as to how many clusters there are (this will be refined later).
    A centroid is the arithmetic mean position of all the points in a cluster. Next
    make a random guess as to where the central points of each cluster are so as to
    create k pseudo-centers. These should be reasonably distant from each other, but
    need have no relationship to the actual clusters and can be chosen randomly (unless
    there is some prior knowledge about the data structure). Next assign each point
    of the dataset to its nearest pseudo-center. We now form clusters with each cluster
    comprising all of the data points associated with its pseudo-center. Next update
    the location of each cluster’s pseudo-center so that it is now indeed in the center
    of all its members. Do this recursively until there are no more changes to cluster
    membership.'
