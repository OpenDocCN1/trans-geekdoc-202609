    # The weights in an ANN


    As was the case for the Rosenblatt perception, every input within an ANN is associated
    with a weight that represents the relative importance of that input with respect
    to its contribution to the sum of signals received by the neuron. For a node receiving
    input from two nodes of the previous layer, the total input is the sum of the
    output of the first node times its weight plus the output of the second node times
    its weight. This is the product of two vectors. In general, one can set up the
    computation of each layer of nodes as a single matrix-vector product. Basically,
    there is a matrix of weights multiplied by the input vector, which produces the
    aggregated output when acted upon by the activation function. When these calculations
    are generalized to multilayer networks with many nodes, they are seen to be the
    result of simple multiplicative steps in linear algebra. In some ANNs a bias term
    is also added; this is a scalar that is added to the input to ensure that a few
    nodes per layer are activated regardless of signal strength. It is because the
    weighted inputs summed is a linear function that a nonlinear activation function
    must act upon them so that the ANN is not restricted to linear problems. Both
    weights and biases are modified throughout the training of an ANN.


    # Learning from examples; Backprop and stochastic gradient descent.


    The traditional learning method for feed-forward networks such as the ANN is to
    take a fixed network architecture and then use the examples to find appropriate
    values for the weights that lead to correct performance. The fact that each node
    in a layer has an incoming connection from every node in the previous layer does
    not interfere with this adjustment, since any unnecessary connection can be set
    to zero during this process.


    The network learns the proper weights from the training set using a gradient-descent
    algorithm based upon The Error Back-Propagation algorithm (Backprop). The basics
    of backpropagation were derived in the context of control theory by multiple researchers
    in the 1960s. Subsequently, in the 1980s, a number of investigators proposed that
    it could be used for neural networks. Thus, it is difficult to assign'
