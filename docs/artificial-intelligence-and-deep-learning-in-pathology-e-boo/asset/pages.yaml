    A foundational hypothesis supporting the concept of cell and tissue image-based
    computational pathology is that a high-resolution image is a self-organizing set
    of data which uniquely represents all of the genes, and all of the molecules,
    and all of the cells in that scene at one point in time. As a self-organizing
    piece of data, the image can only uniquely have the phenotype which it presents.
