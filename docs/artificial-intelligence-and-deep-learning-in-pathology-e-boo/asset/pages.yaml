  md: 'problems the gains from the distributed search process allow GAs to reach levels
    of classification performance not possible using backprop.


    A GA begins with an initial “population” of “individuals,” each of which represents
    a candidate solution to the problem. Each individual is generated at random, and
    the population size is a user-tunable parameter. In the case of a neural network,
    each “individual” will be a complete network. The individual is encoded with a
    “genome,” which is simply a numeric representation of the individual. In some
    applications, there may be complex encoding functions needed to transform between
    “genotype” and “phenotype,” while in other applications the two forms might be
    identical. The key factor is that the genotype encoding must support the functioning
    of the rest of the genetic algorithm; a poorly chosen encoding can handicap the
    entire process.


    Each individual is evaluated using a “fitness function,” which is another term
    for the thing we are trying to optimize. In the case of a neural net, this is
    typically just the inverse of the loss function used for backprop (we invert the
    value because a GA maximizes, where backprop minimizes). In other applications,
    more complex or interesting notions of “fitness” may be used, including relative
    measures such as tournament-based selection.


    The overall operation of the GA proceeds in rounds, or “generations.” In each
    round, all the individuals are evaluated using the fitness function, and then
    some of them are selected to “reproduce.” The most common selection criterion
    is fitness proportionate, which simply means the likelihood of selection is proportional
    to the fraction of the total population’s net fitness accounted for by the given
    individual. Again, the GA literature contains many alternatives, and the choice
    of a selection strategy is up to the user.


    Selected individuals are then used to produce “offspring,” or new individuals,
    using the genetic operators of “mutation” and “crossover.” The exact implementation
    of these operators is defined with respect to the chosen genotype encoding and
    must be selected on a per-problem basis, but the underlying idea is always the
    same. Mutation makes a small, random change to the encoding; for a neural network,
    this might mean adjusting some randomly selected weights with small random perturbations.
    Crossover operates on two selected individuals and creates one offspring genome
    by combining the two parent genomes. For a convolutional neural network, this
    might involve something like taking half the filter kernels at random from one
    parent and the other half from the other parent. It is important that whatever
    operators are used must be well suited to the problem; they need to have some
    reasonable likelihood of producing a child that is better than the parent(s),
    or the GA will not converge. For this reason, in some applications, only one or
    the other is applied. If no useful definition for crossover is available, it is
    better to simply rely on mutation.


    Once a number of offspring have been produced, some number of individuals in the
    “parent” generation are selected for replacement, and removed from the population.
    Again, the choice of how many are replaced at each generation and how they are
    selected is a user-choosable parameter, but typically the population size is kept'
  merge: -1
