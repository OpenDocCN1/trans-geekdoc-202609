    # Convolutional Neural Networks


    # Overview


    Convolutional Neural Networks (CNNs) are sufficiently complex so that a brief
    overview will be helpful prior to a more complete discussion. In brief, images
    are too large to be analyzed at the input pixel level. Arguable, the first CNN
    was “Alexnet” in 2012 by A Krizhevsky et al. [11]. The CNN extracts image features
    to create increasingly complex representation. It uses feature extraction filters
    on the original image, and uses some of the hidden layers to move up from low
    level feature maps to high level ones. CNNs have two kinds of layers, convolutional
    and pooling (subsampling). Convolutional filters are small matrices that are “slid”
    over the image. The matrix is combined with the underlying image piece and the
    maximum value from each convolution is obtained. In the CNN, the convolutional
    layers are not fully connected, but their output is usually passed to one or more
    fully connected layers that perform the final classification. An overview of the
    process is seen in Fig. 2.14.


    # Detailed explanation


    CNNs take advantage of the hierarchical pattern in data such as images and assemble
    more complex patterns using smaller and simpler patterns before moving these representations
    into traditional fully connected networks. They are loosely based upon the organization
    of the visual cortex of the brain. Individual cortical neurons respond to stimuli
    only in a restricted region of the visual field known as the receptive field.
    The receptive fields of different neurons partially overlap such that they cover
    the entire visual field. The CNN mimics this, in that its layers are not fully
    connected. This is shown in Fig. 2.15.


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_42_0.png)


    # FIGURE 2.14


    Schematic of a typical convolutional network diagramming convolutions and subsampling.
    The image representation at the final layer is passed to fully connected layers
    and a classification prediction is made.'
