- pgno: 142
  md: 'multitask learning, common features can be learned to improve the performance
    of the model. The training set included human motor neurons derived from induced
    pluripotent stem cells, primary murine cortical cultures, and breast cancer cell
    lines. The fluorescent labels used were Hoechst and DAPI for labeling nuclei,
    propidium iodide (PI) for assessing cell viability, and CellMask for labeling
    plasma membrane. Some cells were also immunolabeled with antibodies against TuJ1
    (labeling for neurons), the Islet1 protein (labeling for motor neurons), and for
    MAP2 (labeling dendrites). The deep neural network had multiscale input with five
    paths for each of these scales (Fig. 7.4D). The scale with finest detail stays
    at the same scale, while the other scales have contracting and upsampling convolution
    operations, inspired by a U-net architecture. The final network outputs a discrete
    probability distribution over 256 intensity values (all possible 8-bit pixel values)
    for all the pixels in the image. It reads z-stacks of either brightfield, phase-contrast,
    or differential interference contrast images.


    The network was tested for various tasks. It was first used to predict Hoechst
    or DAPI fluorescence in order to label cell nuclei. Qualitatively, the in silico
    labels and the true fluorescent labels looked identical. The Pearson correlation
    coefficient between the true and predicted pixel intensities was 0.87, indicating
    the model accurately predicted the nuclear regions. Similar experiments were done
    to predict propidium iodide (PI) fluorescence, used to detect dead cells (since
    live cells can exclude the dye). The network also performed well-predicting immunolabels
    for TuJ1 protein, which labels neurons. The neural network was also able to successfully
    predict independent axon and dendrite labels, which was unexpected as it was unclear
    whether the transmitted-light images contained enough information to be able to
    distinguish whether a neurite extending from a cell was an axon or dendrite. In
    order to demonstrate the flexibility of the model, transfer learning was used
    to learn how to predict a different label from a different cell type from data
    from a single well. Specifically, transfer learning was used to predict CellMask
    (cell membrane label) fluorescence from differential interference contrast images
    from cancer cells. The model was trained from data from a single training well,
    but was regularized by simultaneously training on previous conditions. The network
    had a Pearson correlation score of 0.95. This suggests this model could continue
    to learn and be adapted for other tasks, when provided with more training examples.


    While fluorescent microscopy is not commonly used in routine clinical pathology
    applications, deep learning techniques used for fluorescence microscopy could
    also be applied in histopathology. In particular, Christiansen et al. [40] suggested
    a way to solve a key problem in deep learning for mode conversion. Most mode conversion
    methods are limited by constraints imposed by differences in magnification, staining,
    modality, tissue types, and other factors. However, Christansen et al. used a
    multitask and multiscale network that was generalizable to various tissue types,
    magnification scales, and even various modalities. Using transfer learning, these
    universal models could also be further trained for more specific tasks with very
    additional little data. The development of similar models for conversion to H&E
    images could greatly facilitate the adoption of novel imaging modalities for use
    in histopathology.'
