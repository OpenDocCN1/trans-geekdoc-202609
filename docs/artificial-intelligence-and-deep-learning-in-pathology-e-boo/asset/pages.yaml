  img_proc: true
- pgno: 131
  md: 'complex applications costly and time-consuming if it is possible at all. CycleGAN
    [21] is a variation of the traditional method that aimed to correct this problem
    by adding cyclic consistency between the conversions, allowing the training to
    be completely unsupervised with spatially unpaired (but contextually paired) images
    (Fig. 7.1D). This is accomplished by doubling the number of neural networks and
    training the network to not only convert from, for example, zebras to horses,
    but also from zebras to horses and then back to zebras. By forcing the reconstruction
    of the original image from the converted image the training is almost pseudo-supervised,
    permitting unpaired image training. Applications of this class of deep learning
    tools (mostly) in histopathology are described in more detail below.


    # Common training and testing practices


    # Dataset preparation and preprocessing


    Often, when applying deep learning to microscopy, ground truth and input images
    are collected separately. For example, images of the same sample may be taken
    on separate microscopes with different imaging modalities. In this case, the images
    need to be aligned to obtain a paired-image dataset. Many image coregistration
    approaches have been developed for accurate image coregistration [24]. Often a
    global registration algorithm is used for rough coregistration of the image, while
    a subsequent local coregistration algorithm is used to account for local deformations.
    Often, accurate coregistration is essential for the performance of an algorithm
    on a paired dataset. Note that coregistration is not required for unpaired image
    translation tasks, however.


    Not infrequently, datasets are quite small and only represent a small sample of
    the kinds of images a trained model could be applied to. A neural network model
    generalizes well across a diverse set of samples if there is a large and diverse
    training set. If the dataset is small, the model might perform well on the training
    set, but may not perform well on unseen data. This phenomenon is known as overfitting.
    In order to overcome this challenge, two methods are commonly used. Transfer learning,
    as discussed in the Convolutional neural networks section, can be used to decrease
    the amount of data required for training [13]. Additionally, data augmentation
    is a common approach for improving the utility of small datasets. This involves
    the creation of synthetic but representative examples for the dataset. More specifically,
    transformations like rotation, flipping, distorting, color variation, etc. are
    used to create new images and augment the original image dataset [25]. Data augmentation
    is therefore a useful technique for limiting overfitting.


    # Loss functions


    In order to train a neural network, the weights (i.e., the trainable parameters
    of the network) of the neural network are adjusted to minimize a user-defined
    loss function'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'that best represents the task that the neural network is required to solve.
    For classification tasks, the most commonly used loss function is a cross entropy
    loss. When comparing between predicted and ground-truth images in image-mapping
    tasks, the cost function is instead usually based on per-pixel differences, such
    as mean absolute error (L1 loss) or mean squared error (L2 loss). Other networks
    can also have specialized loss functions for training, such as GANs (adversarial
    loss) and cycleGANs (cyclic loss). Loss functions can also be augmented with regularization
    terms (e.g., weight decay, identity loss) in order to prevent overfitting. In
    many cases, careful selection of the loss function is critical in optimizing the
    performance of the neural network.


    # Metrics


    Quantitative metrics are required in order to reliably evaluate the performance
    of a model. For classification tasks, the most common metrics includes accuracy
    and area under the curve of the receiver operating characteristic (AUC-ROC). For
    segmentation tasks, the most common metrics are intersection over union and Dice
    scores. However, for image translation and style transfer tasks, the most appropriate
    metric is often dependent on the application. For applications in microscopy,
    metrics such as structural similarity index (SSIM), peak signal-to-noise ratio
    (PSNR), and Pearson correlation coefficient are often used to compare the structural
    content between the predicted and ground truth images.


    # Deep learning for microscopy enhancement in histopathology


    # Stain color normalization


    A major problem in the field of computational pathology and computer-aided diagnosis
    (CAD) is variability between individual stained whole-slide (WSI) microscopy images.
    Different scanners, staining procedures, and institutional environments can lead
    to wide variance in staining appearance. Image analysis methods find it difficult
    to cope with these variations in image appearance. In fact, a major contributor
    to CAD algorithm performance is proper deployment of a standardization algorithm
    [26]. Consequently, a significant body of work has been dedicated to methodologies
    intended to reduce variability between and within microscopy image datasets. Collectively,
    these algorithms are designated as stain color normalization methods (Fig. 7.2A).


    One of the most popular algorithms is color deconvolution [27,28]. This algorithm
    attempts to determine a stain matrix, which describes how much each stain contributes
    to the final pixel color. However, these stain matrices do not generalize well
    to images from other labs and scanning platforms. Other common approaches use
    clustering-based algorithms. However, these require that clusters to be'
