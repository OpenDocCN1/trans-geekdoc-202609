- pgno: 265
  md: '# Educating machines—educating us: learning how to learn with machines


    Pathological diagnostics, prognostics, and theranostic statements of cell and
    tissue samples are not just application spaces for AI, but they offer tremendous
    opportunities to learn more about HI–machine intelligence partnerships in unique
    ways. Researchers at the University at Buffalo, State University of New York (Doyle
    S, unpublished communications) are developing a novel approach to building machine
    learning–based systems, where classifier training is recast as a problem of pedagogy.
    In this approach, termed the “AI School for Pathology,” AI agents are treated
    as students in a school where human agents are instructors and the learning context
    is that of higher order clinical phenotypes and clinical outcomes. Both AI and
    human agents learn the biological/medical realities and the meaning of data from
    tissue imaging, ‘omics, electronic medical record (EMR), and their fused data
    products. Within this paradigm, learning researchers propose to examine various
    portals for AI–human agent interactions analogous to those of teachers and students
    in a traditional learning setting. The understandings generated from this project
    will help advance research in one of the key challenge areas for AI today, namely,
    enabling AI systems to learn as humans learn.


