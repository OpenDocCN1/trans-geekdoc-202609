    # Explainable artificial intelligence


    The concept of XAI is that machine learning is understood by human operators and
    that through this understanding, a bilateral trust relationship is established
    between humans and machines. XAI contrasts sharply with the “black box criticism”
    of deep learning. XAI is very important when machine learning systems impact social
    systems. As diagnostics is a central function of medicine, which in turn impacts
    all aspects of the societal good of health and wellness, XAI is a particularly
    desirable form of AI in computational pathology. Regulators of clinical laboratories
    and the diagnostic process should have a strong interest in XAI as it offers the
    transparency and real-world rationales which make algorithmic outputs testable
    and subject to quality assurance processes. XAI guards against AI “cheating,”
    in which a learning system tracks surrogate labels but is not truly informative.
    For example, a data-driven deep learning AI system that used histological images
    tagged with ICD10 codes could never be relied on to distinguish cancer from noncancer
    using pixel data from digital virtual slides. Or even more simply, if the slides
    with cancer in a training dataset had been marked with a red dot by a previewer
    and the machine learning system learned to look for a “red dot” to classify the
    dataset into cancer versus not-cancer, the resulting classifier might be 100%
    effective in the training data but 0% extensible to other test datasets.


    Deep learning systems may be adapted to XAI through a technique called layer-wise
    relevance propagation, which determines the features in an input vector which
    contribute most strongly to a neural network’s output [6]. Exposing the output
    layers or even the early activation layers of neural networks to human observers
    for error correction or other annotations may also be used to support XAI (Fig.
    11.2).


    # Cognitive artificial intelligence


    Cognitive computing seeks to simulate the functioning of the human brain with
    software and hardware which senses, responds to stimulus, and reasons. Cognitive
    AI systems stimulate human thought in finding solutions to broad and complex problems.
    Cognitive AI systems should be adaptive, interactive, iterative, and contextual.
    Cognitive learning systems are adaptive in that they learn in real time or near
    real time and they learn as information changes. Cognitive systems are interactive
    with users. Cognitive systems help define problems by asking multiple questions
    or finding additional sources of information to make the statement of a problem
    less ambiguous. Cognitive learning systems understand, identify, and extract contextual
    elements such as meaning, syntax, time, location, appropriate domain,'
