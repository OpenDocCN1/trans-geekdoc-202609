- pgno: 185
  md: '# Stain normalization


    Color and intensity variations in histology images can not only cause inconsistencies
    in interpretation between pathologists but can also significantly impact the performance
    of CAD systems. These variations are in part due to variability in preparation,
    staining, and digitization of histological samples. These include preanalytic
    factors such as fixation and tissue preservation, paraffin embedding, deparaffinization,
    slide thickness, stain reagents, stain protocols, and mounting medium, as well
    as color fidelity algorithms of the digitization device. In order to compensate
    for this type of input variability, stain normalization strategies are often employed,
    in which the color and intensity range of an image is transformed to match those
    of another image. A review of the major techniques for stain normalization of
    digitized histologic images is discussed here.


    An early method, originally developed for nonmedical images [28] and later applied
    to stain normalization of histology images [29], transforms the typical RGB image
    into an alternate color space (lαβ) which allows a statistical color distribution
    in each channel to match the reference image. This method, however, does not take
    into account the independent contribution of stain dyes to the final color and
    can result in improper color mapping [30]. Macenko et al. [31] proposed to convert
    the image to an optical density space and find the optimal stain vectors by means
    of singular value decomposition. This method does not preserve all information
    from the source image in the processed image and performs poorly in the presence
    of strong staining variations. The algorithm proposed by Vahadane et al. [32]
    preserves all the structure of the source image by using a sparse nonnegative
    matrix factorization method. Although this method outperforms all previous supervised
    stain separation methods, it is computationally costly and the algorithm might
    reach a nonrepresentative local optimal solution [33]. A whole slide color standardization
    algorithm was proposed in Ref. [34] in which two chromatic distributions and one
    density distribution are computed for hematoxylin, eosin, and background in the
    image after applying an RGB-to-HSD model. The source image is then transformed
    to the space of the reference image by a weighted sum of three nonlinear transformations
    between the distributions. This algorithm has a high processing time and does
    not preserve all the source image information such as background and red blood
    cells color.


    More recently, deep generative models have been used as style transfer and generative
    learning for stain normalization of histopathology images. BenTaieb et al. [35]
    used a generative adversarial network (GAN) for learning stain normalization across
    different datasets and integrated it with a task-specific discriminative model
    for supervised classification. Moreover, Shaban et al. [30] proposed StainGAN,
    using cycle-consistent adversarial networks (CycleGAN) for image-to-image unpaired
    translation between two datasets. This method does not require picking a reference
    image for stain normalization, and the processed image has a good visual similarity
    to the reference domain. We have compared the performance of five different methods
    in Fig. 9.2.'
