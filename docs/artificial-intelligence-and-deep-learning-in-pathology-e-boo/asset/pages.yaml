  img_proc: true
- pgno: 204
  md: 'higher performing improvement that does not make assumptions about the structure
    of the relationship between features and risk [106], learns the distribution of
    survival times directly. The structure of the network is more complicated than
    DeepSurv, with fully connected layers and a single softmax layer as the output
    layer. A disadvantage of using deep neural networks for survival analysis is that,
    in order to build robust models with reliable predictions, these algorithms tend
    to require large quantities of clinically annotated patient data (i.e., outcome),
    which is often not available at the necessary scale.


    # Decision trees and random forests


    Tree-based methods can be used to solve problems in classification and regression
    by growing conceptual trees [107]. A simple traversal algorithm walks from the
    root to one of the leaves of the tree, choosing each branch limb depending on
    the value of a feature relative to a threshold the algorithm selects for that
    branching point. A regression value is therefore computed at each branch and leaf,
    creating a regression tree. Creating too many branching points overfits the data,
    and conversely, not creating a deep-enough tree risks not learning the appropriate
    structure of the data. Decision trees are unfortunately sensitive to noise, and
    small perturbation in the data can result in vastly different models due to the
    recursive identification of branch points.


    Random forest [108] is a conceptual modification of the decision tree approach
    that introduces two main random components to generate multiple trees whose outputs
    are then aggregated. Random modifications include bootstrap aggregation of the
    data and random selection of features for each node. Using this modification to
    the decision-tree learning algorithm, multiple trees are generated are combined
    by averaging and arriving at a solution which reduces the bias and variance in
    the decision-tree models.


    Random survival forest (RSF) is an extension of the random forest method [109],
    which includes the computation of an ensemble cumulative hazards function (EHF).
    The central idea of RSF is that the survival difference between low- and high-risk
    patients is maximized in the tree. For a given set of features, for every tree,
    a path is followed to a unique terminal node and EHF value. This is averaged over
    all survival trees to compute the survival estimate for the patient.


    # SVM-based methods: Survival-SVM, SVCR, and SVRc


    Support vector machine, introduced in the early 1990s [110], is a classification
    algorithm that learns to distinguish between binary labels of given data. SVM
    is a linear method, extended to encapsulate nonlinear problems through projecting
    the data to a higher dimensional space. This method has enjoyed particular success
    in its ease of handling high-dimensional data and the interpretability of its
    linear'
