- pgno: 109
  md: '# Evolution of whole slide imaging systems


    Early generation WSI systems were mostly built on a robotic compound microscope
    frame and often utilized the “stop–start” imaging methods to produce an initial
    low-resolution overview or thumbnail image of the glass slide for tissue detection
    [76,78,109]. Once tissue was located, each field of view was individually focused
    and captured, repeating this process until all present tissue areas were captured.
    The resultant image was then represented in full color (typically 24 bits per
    pixel) with a dimension of many thousands of pixels in both width and height.
    Image fields were captured with an overlap to provide context for a “stitching”
    process used to join the images together at a later step in the process. Because
    of their large data sizes, these images were represented as a pyramid-like structure
    organized into multiple layers, each layer containing a different resolution.
    This stratification of data by resolution allowed for more efficient viewing via
    specialized vendor-supplied software [76].


    Second-generation WSI systems minimized image acquisition time by utilizing alternate
    camera technologies such as line scanning [6]. These techniques allowed slide
    movement at a near-constant velocity or speed and thereby eliminated start/stop
    delays, as well as minimized the amount of algorithmic image “stitching” required
    to create the final digital slide image. Focus detection algorithms were also
    improved to allow for interpolated focus adjustment during the scanning process.
    Expanded imaging methods enabled capture and digital revisiting of multiple focal
    planes. Camera speed improvements led to additional optical configuration options,
    including higher NA objectives (higher resolution imaging) and oil immersion modalities.
    In addition, more fail-safe mechanisms of slide loading mechanisms were developed,
    and WSI system slide loading capacity was increased [41].


    The current generation of scanners has slide loaders with slide capacities up
    to 1000 slides per run, with the added ability to support various, nonstandard
    histology glass sizes such as whole mounts (e.g. “2 × 3” slides). Lastly, the
    availability of more economical data storage options in recent years has enhanced
    workflow making archival and remote web-based image viewing possible for routine
    daily workloads [6]. The newer scanners not only have faster processing and camera
    performance (measured by frames per second) but also have implemented enhancements
    to the continuous scanning techniques used by second-generation scanners by adopting
    illumination methods such as high-intensity LED strobes to eliminate delay in
    image capture because of motion artifact. Focus mapping, also known as predictive
    autofocusing, has remained a viable technique as it gives a priori information
    about focus position, but multiple tissue scans are required, thus decreasing
    scanning efficiency. An alternative technique, termed “frequency”-based sampling,
    saves time by incorporating the concept of focus maps with real-time continuous
    focus adjustments, whereby the system performs an autofocus for every number (N)
    of imaging fields scanned. Nonetheless, optimal focus is difficult to maintain
    at higher NAs without increasing autofocus frequency (i.e., reducing N), requiring
    increased time for each complete scan performed at higher magnification. Newer'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'WSI systems also offer advanced imaging functionality such as an epifluorescence
    (fluorescence) capability in addition to oil-immersion microscopy, thereby providing
    additional flexibility regarding potential uses of the WSI to support the anatomic
    pathology lab operations and needs. Over time, image capture time has decreased
    and image quality has improved, and the overall utility of the WSI has moved steadily
    toward a recognized increase in core value to both clinical and research imaging
    operations [6,29,41,110,111].


    # Infrastructure requirements and checklist for rolling out high-throughput whole
    slide imaging workflow solution


    Step 1: Deploy scanners and initiate validation of anatomical pathology slides
    [112–114].


    +   1. Depending on the volume of slides to be scanned, first step is to begin
    installing the desired number of scanners in a designated digital scan lab facility,
    ensuring that each scanning appliance is afforded a 10 Gbit link to the WSI Server
    Cluster, via a private unshared channel. These facilities should ideally be in
    the histology lab or in close proximity to the histology lab [112].

    +   2. The WSI scanner needs to be installed along with the associated server
    in a secure, clinical grade, data center with networking to the scan facilities
    and collective scanning appliances using multiple dedicated 10 G bit channels.

    +   3. The next step is to install, in sequenced fashion, the cohort of designated
    pathology workstation solutions in various locations, with each having an independent
    1 G bit channel back to the server. This will enable the remote viewing of the
    WSI images by the pathologists in their work areas.

    +   4. The next milestone is to establish connectivity between respective integration
    engines, such that patient demographics, case data, and other clinically relevant
    data as deemed necessary in support of primary case sign out, which can be populated
    into the digital pathology cockpit. This is accomplished by a bidirectional HL7
    interface engine interface between scanners and the laboratory information.

    +   5. This unified bidirectional HL7 interface will provide support for admissions,
    discharges, and transfers (ADT) and demographic updates, accession logs, specimen/block/slide
    logs and barcode IDs, internal histology orders, case history, slide archive inventory,
    and case narrative texts [115].

    +   6. Finally, the pathologist workstation or cockpit will be ready for routine
    intramural case sign out capability. Moreover, this capability serves as the foundational
    work needed for subsequent optimization in support of full case volume sign out,
    upon the availability of use of digital pathology solutions for primary case sign
    out, utilizing FDA-approved devices.

    +   7. The LIS serves as a single source of truth for preserved overall hospital-level
    referential integrity of data [114].'
