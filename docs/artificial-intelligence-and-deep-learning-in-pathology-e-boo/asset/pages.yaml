    # Modeling


    Modeling as the final computational step in creating improved grading schemes
    combines the output of image-derived features as well as clinically derived features
    to predict the probability of survival or the expected time until significant
    progression of the disease in a cohort of patients with known clinical outcome.
    Standard clinical features that go into models include age, race, sex, etc. as
    well as pathologic stage, laboratory values, features from radiology and genetic
    testing [97]. Machine learning algorithms learn the most relevant feature combinations
    (imaging and clinically derived) and quantify the relative importance of each
