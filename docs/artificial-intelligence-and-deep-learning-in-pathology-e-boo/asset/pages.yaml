  md: 'boosting via the Cox’s negative log function. Finally, the aggregated patch
    risk data are equated to patient risk. This, however, is only a loose approximation
    because patient risk also includes size and location of tumor, all modified by
    age, sex, and comorbidity, and in modern medicine, genomic and proteomic features.


    SCCN is more sophisticated, in that it explicitly utilizes genomic data as well
    as image morphology. It requires annotation of the image dataset which is then
    run through a full CNN. The genomic data are inputted directly into the fully
    connected layers, bypassing the convolutional layers. The network is trained in
    the usual fashion with a standard loss function, except that the outputs are then
    entered into a final Cox approximation layer. In effect, SCCN is taking advantage
    of the universal approximation theorem, namely that a single layer with an appropriate
    activation factor can approximate any arbitrary function. Here the function is
    the Cox partial hazard function. By providing a risk-based heat map overlying
    histological features in their publication, the authors documented that the algorithm
    is detecting meaningful risk elements.


    Looking ahead, it is likely that deep learning algorithms will become better able
    to integrate morphological data with the whole spectrum of available patient information,
    allowing optimal tailoring of therapy to the specific disease as manifested in
    a specific patient, thus enabling truly personalized precision medicine.


    # ## General considerations


    In this chapter, the examples chosen for illustration made use of a variety of
    machine learning strategies, and in some cases hybrid networks were utilized as
    well. An important practical question involves the choice of an algorithm to solve
    a given problem. Unfortunately, there is no correct answer. In this context, it
    is important to reflect upon the so-called “no free lunch” theorem of Wolpert
    and Macready [31], which states “for any algorithm, any elevated performance over
    one class of problems is offset by performance over another class.”


    Simply stated, there is no one model that works best for every problem. However,
    each method may be best aligned with a particular class of problems. This means
    that it is not possible to generalize that the best performing algorithm in a
    given study is the best strategy for other machine learning tasks. Thus, it is
    important to choose the appropriate model for a given problem. Unfortunately,
    there is no theoretical basis upon which to choose. This must be done empirically
    through trial and error. The algorithm assessment study [3] provided a good specific
    example of this general principle.


    Regardless of the choice, every model has tunable parameters or hyperparameters.
    For example, in the case of neural networks, the tunable parameters include the
    number of nodes in each layer and the number of layers. Backpropagation involves
    choices of momentum and learning rate. For a CNN, decisions must be made about
    the size of the convolution matrix. Initial weights must be randomized, but there
    most random numbers are generated by computer starting with a “seed”'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'number. That seed is also a parameter. This list is by no means exhaustive.
    For random forests, the number of trees, the number of branches, the tree depth,
    and so on are parameters that must be chosen. For k-means, one must choose the
    number of clusters, as well as the k random number seeds that start the iterative
    process of defining clusters. Tunable parameters are a fact of life for the artificial
    intelligentsia.


    The other consideration in selecting a model is the implicit bias of that model.
    This does not refer to external biases such as those that arise from choices of
    the elements of the training set, or a value-based assessment of the feature or
    class labels, but rather to the assumptions baked into each model. For example,
    K-means assumes roughly spherical clusters similar in size to each other (although
    there are better models that do not have these constrains). Naïve Bayes assumes
    that the attributes describing the feature vector are independent of each other.
    Assumptions about data distributions are at the heart of almost every machine
    learning algorithm. It is important to understand the nature of the dataset in
    sufficient detail to allow choosing the algorithm whose constraints are least
    critical for that dataset. Unfortunately, the use of the term “bias” tends to
    anthropomorphize the AI program and obscures the issues involved.


    The detection of implicit bias in a deep learning network is made difficult in
    that we have no true understanding of how that network is processing its inputs
    to arrive at the correct outputs. In other words, there are problems with explainability
    and interpretability. Interpretability is the ability to predict the effect of
    a change in input or algorithmic (tunable) parameters. Explainability is the ability
    to understand the basis upon which the algorithm is drawing its conclusion. For
    example, it might be reassuring to be able to explain to a surgeon the basis upon
    which the AI came up with a diagnosis of a high grade malignancy, or how it differentiated
    between two morphologically similar but biologically different tumors. It is interesting
    that if one questions a reference level, high-trained pathologist as to how he
    or she arrived at a diagnosis, they will often refer to the “years of experience”
    that led to the diagnosis. When pressed for more specific criteria, they may make
    them up, but it is often on an ad hoc basis, to justify the decision already intuitively
    made. For this reason, the black box nature of neural networks while disquieting
    to some does not bother others of the artificial intelligentsia.


    There are ways of gaining some insight as to what is happening behind the scenes
    so that we can raise the curtain to see the wizard at work. For example, saliency
    maps create a visualization of the pixels in an image that contributes most to
    the predictions by the model. By calculating the change in predicted class by
    applying small adjustments to pixel values, we can measure the relative importance
    of each pixel to the ultimate output value. This is discussed in Ref. [32]. Other
    approaches involve trying to determine the activity of neurons in the hidden layers
    as backpropagation proceeds, and additionally to obtain visual representations
    of the increasingly complex outputs of the hidden layers by mapping characteristics
    of these such as intensity, orientations, color, and shapes.


    These approaches may provide some insight as to how the neural network is discriminating
    among classes, but still do not “explain” what is going on in human'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'terms. When an AI makes an unexpected and startling chess move that has no
    obvious strategic importance to a human observer, and that move initiates a winning
    sequence, these internal measures provide no clue as to how the program created
    the move that, in retrospect, turned out to be “brilliant.” Thus, they do not
    create a true learning experience for the human observer. On the other hand, this
    occasionally happens when human observers watch a human Grand Master at play.
    Nevertheless, knowledge about the internal decision-making process of a machine
    learning algorithm may inform the development of better algorithms, so there is
    something to be said for insisting on AI explainability while accepting our occasional
    inability to understand human genius.


    In spite of all these caveats, studies using different “shallow” learning AI strategies
    on the same dataset often get similar results. The arrival of deep learning led
    to a great improvement in machine learning over most, if not all, alternate approaches.
    When dealing with complex, multidimensional feature sets, neural networks substantially
    outperform other kinds of machine learning. Even here, when papers dealing with
    the same dataset but using variations of network models are compared, the improvements
    claimed by each tend to be incremental. While some are better than others, they
    all seem to converge around results that achieve greater than 90%–95% accuracy
    (with similar results for the other evaluation metrics). This, however, may be
    merely because of the fact that careful attention has been made to optimize the
    program of choice in each. There are also differences in computational power that
    must be considered. For this latter reason, performance speed should never be
    used in comparing one algorithm to another unless they are running on exactly
    the same platform. Another reason is that often the training sets are simplified
    and carefully curated versions of data that are found in the wild. This raises
    the possibility that in less structured situations, greater differences may be
    observed. Finally, results obtained by a given algorithm in one setting may not
    always correspond to results using the same algorithm in a different setting.
    In other words, past performance is not guarantee of future results.


    Because of considerations such as these, various ensemble methods have been used,
    as well as hybrid models involving combining two or more different algorithms
    sequentially or in parallel. Examples have been presented above for both multilabel
    detection and weak supervision.


    # Summary and conclusions


    Although we have not discussed the use of AI for clinical laboratory data, natural
    language processing, or (with one exception) genetic, expression, and protein
    “-omics,” considerations similar to those discussed hold for all these applications.
    With respect to image recognition and analysis, we are far beyond merely identifying
    a lesion and predicting outcomes based upon morphological patterns. Our images
    are complex, and both abnormal structures and the relationship of the normal elements
    to these must be analyzed. Simultaneously, specific features within the'
