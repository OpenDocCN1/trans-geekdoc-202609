- pgno: 144
  md: '(Fig. 7.5B). The benefit is a field of view that is four times larger, while
    allowing for a similar reduction in scanning time. This has major implications
    not only for speeding up scanning but also for allowing larger fields of view
    in time-lapse studies, allowing for more data to be collected from a single experiment.
    Another benefit is that the depth of field of the 10× lens is greater, so the
    focus and sharpness of the generated images can actually be better than the ground
    truth images themselves, meaning that they are not only equivalent but superior
    in terms of quality. This is not limited to brightfield as the group has also
    published similar deep learning algorithms to convert brightfield images from
    a 40× lens to those better than a 100× oil immersion lens even though the latter
    was used as the target for the transformation [45]. All the same benefits apply
    from the previous fluorescent paper with the added benefit that a vast majority
    of current clinical pathology is done with brightfield imaging. Taking this a
    step further the group showed it was possible to achieve image quality similar
    to that of a 20× microscope lens with a smartphone lens, with the added benefit
    of increased depth of field achieved by the lower NA lens. The algorithm here
    was not only improving the spatial resolution, but was able to correct the color
    distortions from the low-quality lens/camera to that of similar quality from a
    benchtop microscope [46]. This has even further reaching potential as incredibly
    low-cost hardware could generate much higher quality diagnostic images allowing
    for better care in resource-poor nations.


    An example of the use of deep learning to increase depth of field is an implementation
    of a CNN to allow for rapid automated diagnosis of blood films for malaria [47].
    Blood films are thick samples, and interpretation of scanned images requires the
    collection of multiple focal planes merged in a way that can be interpreted by
    either a human pathologist or an artificial neural network (ANN). Manescu et al.
    [47] trained a network with a three-plane input that generated an image close
    to the quality obtained with 14 different focus plane images. It convincingly
    outperformed traditional extended-depth-of-field algorithms, which could greatly
    increase the speed at which automated scanning and diagnosis of malaria could
    be made.


    Increasing depth of field, however, is not always beneficial; there are many methods
    that allow for the reduction of depth of field to allow for axially confined resolution.
    Such techniques include structured-illumination microscopy (SIM), confocal microscopy,
    and computational deconvolution. These methods allow for the acquisition of high-resolution
    images from thick samples without physically sectioning tissue. Zhang et al. [48]
    implemented a CNN to reduce the optical depth of widefield fluorescence images
    without having to employ the optical methods just listed. The largest advantage
    is the reduced complexity of the microscope, as well as the reduction of artifacts.
    Stripe artifacts that can be seen in structured illumination images are common
    and can distract from the content of the image; deep learning can help generate
    similarly optically thinned images while retaining comparable quality. Application
    of a traditional deconvolution method also eliminated stripe artifacts, but the
    resulting image appeared is significantly thicker and lacked the sharpness of
    the AI-generated counterpart. While not currently in clinical use, lightsheet'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'microscopy for pathology has been explored by Ref. [49] and proved especially
    useful in the evaluation of prostate biopsies. The ability to capture 3D datasets
    allowed more accurate assessment of Gleason scoring (a prognostic factor for prostate
    tumors) which could in turn lead to a better quality of care for patients.


    Beyond increasing resolution or affecting depth of field, another contribution
    of AI that can markedly improve image quality is reduction of noise. Images with
    low signals can be difficult to interpret; this can make in vivo imaging particularly
    challenging since the data typically must be acquired quickly and with low (safe)
    light levels. Paired data (low and high noise versions) for developing noise reduction
    models are relatively easy to acquire or synthesize, meaning that large and representative
    datasets can be generated quickly. For example, Weigert et al. [50] successfully
    demonstrated the use of a convolutional neural net trained on multiphoton images
    using very low laser power and low exposure times as input with the target output
    being the high-quality images taken with normal exposure times and laser powers
    (Fig. 7.5C). While not immediately relevant to pathology as it is practiced today,
    this concept could be applied to all of the previous fluorescent methods to help
    speed them up. If any of these techniques are to replace the frozen section, they
    must either offer better-quality histology, or be faster. In addition, these techniques
    could be used to improve label-free imaging methods, possibly allowing for in
    vivo microscopic inspection of tumor margins allowing for even better resection
    margins than obtained via frozen section, as there is no tissue lost due to sectioning
    or embedding.


    This general approach can also be applied to standard super-resolution techniques,
    such as photoactivated localization microscopy (PALM) or stochastic optical reconstruction
    microscopy (STORM). Both methods rely on the acquisition of thousands of images
    to reconstruct structure below the diffraction limit of light microscopy. By training
    an ANN, Ouyang et al. [51] decreased the number of images required for a PALM
    reconstruction from 60,000 to a mere 500, representing a difference in acquisition
    time from 10 min to 9 s. While not currently applicable to pathology, there are
    some applications of electron microscopy that may be able to be replaced by techniques
    such as STORM/PALM; and as the field evolves and our understanding of disease
    processes increases there may be a place for these techniques in clinical pathology.


    Increased acquisition time requirements arise not only from a desire to maximize
    signal-to-noise ratios; many fluorescence image sessions require serial imaging
    with different sets of filters in order to separate multiple labels. The result
    is a large increase in imaging times and light exposure to the sample, with attendant
    potential for phototoxicity or photobleaching. By training a neural net on filter-acquired
    images, Hershko et al. [52] has shown it is possible to use the chromatic aberration
    differences related to the use of different wavelengths of light to separate multiple
    labels from a single image (Fig. 7.5D). The implication of this method is much
    the same as described previously, namely, the potential for more rapid collection
    of data, and a reduction in imaging time.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Deep learning for computationally aided diagnosis in histopathology


    In the section above, we described the possibility of using AI tools for improving
    the quality and information salience of images via AI-assisted tools. However,
    such tools are still regarded with some skepticism on the regulatory side, as
    they are seen as premature for deployment in high-impact clinical settings. The
    number of approved AI tools—with or without AI-enhanced images—for pathology is
    still very small, and for intraoperative guidance even smaller. The notion is
    that for direct-to-AI-interpretation, the need for an intermediate step of AI-enhancement
    may be diminished, since extraction of information and reduction of the impact
    of noise and distortion is implicitly performed by the classifier itself. An example
    from the neuropathology domain is given below, emphasizing as well the opportunity
    to combine AI tools with novel rapid histology technology.


    # A rationale for AI-assisted imaging and interpretation


    Serving the US population that grew 8% from 2007 to 2017, the pathology workforce
    contracted 17% during the same time period [53]. Within certain subspecialties,
    workforce shortages are even more severe. Approximately 800 neuropathologists
    cover the 1400 centers performing brain tumor surgery [54]. Worsening deficits
    in neuropathology are expected with a vacancy rate of approximately 42% in neuropathology
    fellowships [55]. In neuropathology, the workforce shortage is felt in a number
    of ways. Although academic centers tend to be well staffed with board-certified
    neuropathologists, community hospitals rarely have one on staff. Consequently,
    nonexpert pathologists are compelled to provide services that could better be
    provided by a more specialized practitioner. Although hard to quantify, lack of
    neuropathology expertise probably leads to delays in intraoperative diagnosis,
    unnecessary surgical intervention (where a lymphoma or germinoma is misdiagnosed
    as a tumor where surgery might be required), and a limitation on how pathology
    can be used to formulate surgical strategy.


    Histologic data have been recognized as central to decision-making in brain tumor
    surgery since at least 1930 [56]. There are numerous decisions that must be made
    by surgeons at the time of an operation on a brain lesion. First and foremost,
    surgeons rely on pathologists to ensure the tissue they have biopsied is indeed
    lesional and can be used to establish a diagnosis. Beyond that, differentiating
    neoplastic from nonneoplastic processes in the brain is essential as is differentiating
    surgical and nonsurgical tumors. With respect to the surgical candidates, differentiating
    between primary and metastatic tumors, low- and high-grade gliomas, circumscribed
    and diffuse tumors all have specific implications for decision-making.


    While the importance of histologic data in brain tumor surgery is now well established,
    in modern surgical practice, a chasm remains between the operating room and neuropathology.
    In most centers, the frozen section lab is off-site or a substantial'
