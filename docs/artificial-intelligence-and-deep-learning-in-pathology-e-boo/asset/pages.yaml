  md: 'and is difficult, if not impossible, to sort and analyze by eye. Machine learning
    can be applied to large datasets from both molecular and digital pathology in
    order to understand the optimal features that allow patient stratification, and
    thus clinical decision-making, in the field of personalized medicine. However,
    caution must be taken when deciding on which machine learning algorithm to apply
    to your data. If one model is superior at analyzing one dataset, based on, e.g.,
    the search for the optimal area under the receiver operator, it does not mean
    that the same algorithm will be as successful at analyzing a second and distinct
    dataset under similar computational restrictions. This forms part of the “no free
    lunch theorem” [18] of which we will touch upon again later in the chapter. In
    plain terms, different machine learning algorithms are superior to others when
    applied to specific datasets. For example, some algorithms excel at analyzing
    data with low dimensionality (such as K-Nearest Neighbor) and, however, become
    intractable or return poor results when the data dimensions increase. On the other
    hand, random forests excel at analyzing high-dimensional data. Similarly, some
    models are better than others at separating data in a linear fashion. As we rarely
    know a priori which model, or which settings of their hyperparameters, is optimal
    at separating a specific dataset, it is prudent to test multiple machine learning
    methodologies across a single dataset. Automated workflows can be designed that
    split data into balanced training and test sets, apply feature reduction algorithms
    (if needed), test multiple machine learning models, and set their hyperparameters
    before returning the model and features used to best separate ones data and answer
    the clinical question being asked [19].


    An example that demonstrates the usefulness of combining many of the topics that
    we have discussed in this chapter is that of Schmidt et al., who designed an image
    analysis and deep learning workflow to better predict a patient’s response to
    ipilimumab [20]. They combined basic image analysis thresholding to classify lymphocytic
    infiltrating cells and applied deep learning to negate artifact and necrosis in
    the images. Furthermore, they used pathologist annotations to train for specific
    regions of interest, where they compartmentalized the tumor and stroma prior to
    quantification of the lymphocytic contexture. Finally, they applied multiple methods
    of analyzing their resultant data before reporting the final optimal model that
    predicts response to treatment.


    # Beyond augmentation


    To make deep learning an effective method for patient diagnosis in the clinic,
    there must be a sufficient amount of labeled annotations and a wide variety of
    samples to be representative of the larger population. In the case of deep learning,
    this requires training and validation on 1000s of patient samples, obtained from
    multiple international institutes and prepared by multiple individuals. This is
    not an easy or fast task to perform. A major drawback to the field is a lack of
    such large well-annotated and curated datasets that are available to data scientists.
    However, there is a wealth of data held in each hospital located in their glass
    microscope slide archives and that go back decades. These data can be traced back
    to each patient treated in that'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'institute along with their clinical reports. A sample tissue section from each
    patient in the archive will be stained with H&E, and as each prospective patient’s
    samples are also stained with H&E, it makes sense to concentrate deep learning
    efforts on digital pathology samples prepared with this stain. The bottleneck
    is therefore not access to patient samples but the expert’s digitized annotations
    of regions of interest that pertain to diagnosis. To overcome this bottleneck,
    researchers are forgoing image level annotations and developing weakly supervised
    deep learning architectures that rely only on slide level annotations, namely
    the diagnosis of the patient. Simply put, the computer is not told where in the
    image the cancer is, rather that somewhere in the image there are cancer cells.
    This methodology has been shown to be effective and relies on the data-driven
    analysis of patients, where the computer vision algorithm identifies subtle and
    complex morphologies that relate to diagnosis or prognosis. Thus, the machine
    can now inform the human on what is of pathological significance within the patient’s
    individual tissue specimen. These patterns may have gone unnoticed to date, or
    have been too complex to allow for a standardized reporting protocol to be produced
    by human effort. This type of methodology has been tested in colorectal cancer
    [21], prostate cancer, and lymph nodal metastasis of breast cancer [22]. Further
    information on these methodologies can be found in the following chapter.


    # Practical concepts and theory of machine learning


    # Machine learning and digital pathology


    The existing work in the realm of digital pathology, which analyzes various types
    of clinical data, could be conceptually organized in a variety of ways, that is,
    according to different criteria. Considering the diversity of pathologies of possible
    interest, one approach would be to consider solutions developed with specific
    diseases in mind, or indeed tissues or populations; another criterion would be
    based on the type of annotations that is training feedback, available for learning;
    yet another could distinguish between different types of input data and the modalities
    used to acquire them.


    For reasons which will become apparent as we develop our narrative, herein we
    found it useful to start with a broad categorization of work in the area into
    two categories in terms of their technical approach to the problem. The first
    of these could be roughly described as involving “conventional” (or “traditional”)
    computer vision, and the second one as deep learning based. This distinction is
    somewhat loose but in that it reflects the current trends in the field, namely
    the shift in focus from the former to the latter, it will be useful for illustrating
    the driving challenges and opportunities in the field, as well as for highlighting
    potential pitfalls and limitations of the current thinking, and for explaining
    our thoughts and recommendations for future work.


    Considering the variety of challenges that a pathologist has to deal with in the
    analysis of real-world cases, it should come as no great surprise to the reader
    that algorithmic solutions addressing a wide range of possibly useful tasks have
    been explored and proposed. Much, indeed probably most, of research has focused
    on'
