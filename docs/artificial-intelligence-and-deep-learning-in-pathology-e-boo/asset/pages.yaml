- pgno: 106
  md: 'Image viewer software, unique to each vendor, is often installed on the local
    user’s computer and may require administrative rights or the equivalent for deployment.
    However, to support the frequent need for remote image viewing, vendors often
    provide a web-based version of the viewing software. The latter usually offers
    slightly less functionality in terms of image modification, annotation, and measurement
    but allows for off-site viewing using protocols built off standard web technologies
    to facilitate ease of deployment.


    The image viewer provided with each WSI system typically enables the viewing of
    WSI image files saved using a proprietary image format unique to their WSI system
    and does not support viewing of images created by other WSI scanner systems. However,
    several companies offer image viewers that currently support viewing of differently
    formatted files. The native, vendor-provided image viewing software and/or applications
    and their coupling to the corresponding vendor-specific pathology workflow software
    may offer several advantages over “generic” or viewing systems [78].


    The main advantage of vendor-unique viewers includes access to specific vendor-encoded
    features such as user comments and/or annotations. Other advantages may include
    access to data while using third-party solutions such as viewing multichannel
    fluorescence data, as limited access to such solutions is available while using
    “generic” viewers. To support comparison of different slides, multiple slide viewing
    and navigation options are provided by various vendor-specific image viewers [58,98,99].


    This feature is used to compare different biomarkers for a single case. Digital
    slide viewers allow the pathologist to see a virtual slide on a screen in a similar
    fashion as they would by looking through a traditional microscope. With these
    viewers, pathologists are able to view virtual slides at different magnifications.
    Furthermore, some of these viewers provide additional functionality like viewing
    of virtual slides at different magnifications in two windows or tools to annotate.
    Some viewers may also be linked to LISs, leading to a true digital workflow experience
    for the pathologist [98,100].


    # Whole slide image data and workflow management


    Image and data management databases and tools are typically available as supporting
    software programs included with the majority of WSI systems intended for clinical
    or research use [50,101]. Nearly all WSI systems offer a choice of visualization
    and workflow/data management packages that include support for WSI file formats.
    Such software packages allow pathologists and histology technicians to view, manage,
    and analyze the digital slides and the associated clinical data [102].


    Image and information management is an important benefit of creating a digital
