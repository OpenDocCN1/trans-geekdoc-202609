- pgno: 9
  md: '# The evolution of machine learning: past, present, and future


    Stanley Cohen, MD 1,2,3


    ¹Emeritus Chair of Pathology & Emeritus Founding Director, Center for Biophysical
    Pathology, Rutgers-New Jersey Medical School, Newark, NJ, United States; ²Adjunct
    Professor of Pathology, Perelman Medical School, University of Pennsylvania, Philadelphia,
    PA, United States; ³Adjunct Professor of Pathology, Kimmel School of Medicine,
    Jefferson University, Philadelphia, PA, United States


    # Introduction


    The first computers were designed solely to perform complex calculations rapidly.
    Although conceived in the 1800s, and theoretical underpinnings developed in the
    early 1900s, it was not until ENIAC was built that the first practical computer
    can be said to have come into existence. The acronym ENIAC stands for Electronic
    Numerical Integrator and Calculator. It occupied a 20 × 40 foot room, and contained
    over 18,000 vacuum tubes. From that time until the mid-20th century, the programs
    that ran on the descendants of ENIAC were rule based, in that the machine was
    given a set of instructions to manipulate data based upon mathematical, logical,
    and/or probabilistic formulas. The difference between an electronic calculator
    and a computer is that the computer encodes not only numeric data but also the
    rules for the manipulation of these data (encoded as number sequences).


    There are three basic parts to a computer: core memory, where programs and data
    are stored, a central processing unit that executes the instructions and returns
    the output of that computation to memory for further use, and devices for input
    and output of data. High-level programming languages take as input program statements
    and translate them into the (numeric) information that a computer can understand.
    Additionally, there are three basic concepts that are intrinsic to every programming
    language: assignment, conditionals, and loops. In a computer, x = 5 is not a statement
    about equality. Instead, it means that the value 5 is assigned to x. In this context,
    X = X + 2 though mathematically impossible makes perfect sense. We add 2 to whatever
    is in X (in this case, 5) and the new value (7) now replaces that old value (5)
    in X. It helps to think of the = sign as meaning that the quantity on the left
    is replaced by the quantity on the right. A conditional is easier to understand.
    We ask the computer to make a test that has two possible results. If one result
    holds, then the computer will do something. If not, it will do something else.
    This is typically an IF-THEN statement. IF you are wearing a green suit with yellow
    polka dots,'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'PRINT “You have terrible taste!“ IF NOT print “There is still hope for your
    sartorial sensibilities.” Finally, a LOOP enables the computer to perform a single
    instruction or set of instructions a given number of times. From these simple
    building blocks, we can create instructions to do extremely complex computational
    tasks on any input.


    The traditional approach to computing involves encoding a model of the problem
    based on a mathematical structure, logical inference, and/or known relationships
    within the data structure. In a sense, the computer is testing your hypothesis
    with a limited set of data but is not using that data to inform or modify the
    algorithm itself. Correct results provide a test of that computer model, and it
    can then be used to work on larger sets of more complex data. This rules-based
    approach is analogous to hypothesis testing in science. In contrast, machine learning
    is analogous to hypothesis-generating science. In essence, the machine is given
    a large amount of data and then models its internal state so that it becomes increasingly
    accurate in its predictions about the data. The computer is creating its own set
    of rules from data, rather than being given ad hoc rules by the programmer. In
    brief, machine learning uses standard computer architecture to construct a set
    of instructions that, instead of doing direct computation on some inputted data
    according to a set of rules, uses a large number of known examples to deduce the
    desired output when an unknown input is presented. That kind of high-level set
    of instructions is used to create the various kinds of machine learning algorithms
    that are in general use today. Most machine learning programs are written in PYTHON
    programming language, which is both powerful and one of the easiest computer languages
    to learn. A good introduction and tutorial that utilizes biological examples is
    Ref. [1].


    # Rules-based versus machine learning: a deeper look


    Consider the problem of distinguishing squares and rectangles and circles from
    each other. One way to approach this problem using a rules-based program would
    be to calculate relationships between area and circumference for each shape by
    using geometric-based formulas, and then comparing the measurements of a novel
    unknown sample to those values for the best fit, which will define its shape.
    One could also simply count edges, defining a circle as having zero edges, and
    use that information to correctly classify the unknown.


    The only hitch here would be the necessity to know pi for the case of the circle.
    But that is also easy to obtain. Archimedes did this somewhere about 250 BCE by
    using geometric formula to calculate the areas of two regular polygons; one polygon
    inscribed inside the circle and the other the polygon with which the circle was
    circumscribed (Fig. 1.1).


    Since the actual area of the circle lies between the areas of the inscribed and
    circumscribed polygons, the calculable areas of these polygons set upper and layer
    bounds for the area of the circle. Without a computer, Archimedes showed that
    pi is between 3.1408 and 3.1428. Using computers, we can now do this calculation
    for polygons with very large numbers of sides and reach an approximate value of
    pi'
  merge: -1
  img_proc: true
- pgno: 11
  md: '![](img/ec668102bd6cbe5645156f246a7c2e8b_11_0.png)


    # FIGURE 1.1


    Circle bounded by inscribed and circumscribed polygons. The area of the circle
    lies between the areas of these bounds. As the number of polygon sides increases,
    the approximation becomes better and better.


    Wikipedia commons; Public domain.


    to how many decimal places we require. For a more “modern” approach, we can use
    a computer to sum a very large number of terms of an infinite series that converges
    to pi. There are many such series, the first of which having been described in
    the 14th century.


    These rules-based programs are also capable of simulations; as an example, pi
    can be computed by simulation. For example, if we have a circle quadrant of radius
    = 1 embedded in a square target board with sides = 1 units, and throw darts at
    the board so that they randomly land somewhere within the board, the probability
    of a hit within the circle segment is the ratio of the area of that segment to
    the area of the whole square, which by simple geometry is pi/4. We can simulate
    this experiment by computer, by having it pick pairs of random numbers (each between
    zero and one) and using these as X-Y coordinates to compute the location of a
    simulated hit. The computer can keep track of both the ratio of the number of
    hits landing within the circle quadrant and the total number of hits anywhere
    on the board, and this ratio is then equal to pi/4. This is illustrated in Fig.
    1.2.


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_11_1.png)


    # FIGURE 1.2


    Simulation of random dart toss. Here the number of tosses within the segment of
    the circle is 5 and the total number of tosses is 6.


    From Wikipedia commons; public domain.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'In the example shown in Fig. 1.2, the value of pi is approximately 3.3, based
    on only 6 tosses. With only a few more tosses we can beat Archimedes, and with
    a very large number of tosses we can come close to the best value of pi obtained
    by other means. Because this involves random processes, it is known as Monte Carlo
    simulation.


    Machine learning is quite different. Consider a program that is created to distinguish
    between squares and circles. For machine learning, all we have to do is present
    a large number of known squares and circles, each labeled with its correct identity.
    From this labeled data the computer creates its own set of rules, which are not
    given to it by the programmer. The machine uses its accumulated experience to
    ultimately correctly classify an unknown image. There is no need for the programmer
    to explicitly define the parameters that make the shape into a circle or square.
    There are many different kinds of machine learning strategies that can do this.


    In the most sophisticated forms of machine learning such as neural networks (deep
    learning), the internal representations by which the computer arrives at a classification
    are not directly observable or understandable by the programmer. As the program
    gets more and more labeled samples, it gets better and better at distinguishing
    the “roundness,” or “squareness” of new data that it has never seen before. It
    is using prior experience to improve its discriminative ability, and the data
    itself need not be tightly constrained. In this example, the program can arrive
    at a decision that is independent of the size, color, and even regularity of the
    shape. We call this artificial intelligence (AI), since it seems more analogous
    to the way human beings behave than traditional computing.


    # Varieties of machine learning


    The age of machine learning essentially began with the work of pioneers such as
    Marvin Minsky and Frank Rosenblatt who described the earliest neural networks.
    However, this approach languished for a number of reasons including the lack of
    algorithms that could generalize to most real-world problems, the primitive nature
    of input storage, and computation in that period. The major conceptual innovations
    that moved the field forward were backpropagation and convolution, which we will
    discuss in detail in a later chapter. Meanwhile, other learning algorithms that
    were being developed also went beyond simply rule-based calculation and involved
    inferences from large amounts of data. These all address the problem of classifying
    an unknown instance based upon the previous training of the algorithm with a known
    dataset.


    Most, but not all, algorithms fall into three categories. Classification can be
    based on clustering of data points in an abstract multidimensional space (support
    vector machines), probabilistic considerations (Bayesian algorithms), or stratification
    of the data through a sequential search in decision trees and random forests.
    Some methods utilizing these techniques are shown in Fig. 1.3.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/ec668102bd6cbe5645156f246a7c2e8b_13_0.png)


    **FIGURE 1.3**


    Varieties of machine learning.


    *Reprinted from https://medium.com/sciforce/top-ai-algorithms-for-healthcare-aa5007ffa330,
    with permission of Dr. Max Ved, Co-founder, SciForce.*


    All of those latter approaches, in addition to neural networks, are collectively
    known as “machine learning.” In recent years, however, neural networks have come
    to dominate the field because of their near-universal applicability and their
    ability create high-level abstractions from the input data. Neural network-based
    programs are often defined as “deep learning.” Contrary to common belief, this
    is not because of the complexity of the learning that takes place in such a network,
    but simply due to the multilayer construction of a neural network as will be discussed
    below. For simplicity, in this book we will refer to the other kinds of machine
    learning as “shallow learning.”


    The evolution of the neural network class of machine learning algorithms has been
    broadly but crudely based upon the workings of biological neural networks in the
    brain. The neural network does not “think”; rather it utilizes information to
    improve its performance. This is learning, rather than thinking. The basics of
    all of these will be covered in this chapter. The term “Artificial Intelligence”
    is often used to describe the ability of a computer to perform what appears to
    be human-level cognition, but this is an anthropomorphism of the machine, since,
    as stated above, machines do not think. In the sense that they learn by creating
    generalizations from inputted training data, and also because certain computer
    programs can be trained by a process similar to that of operant conditioning of
    an animal, it is easy to think of them as intelligent. However, as we shall see,
    machine learning at its most basic level is simply about looking for similarities
    and patterns in things. Our programs can create high levels of abstraction from
    building blocks such as these in order to make predictions, and identify patterns.
    But “asking if a machine can think is like asking whether a submarine can swim”
    [2]. Nevertheless, we will use the term artificial intelligence throughout the
    book (and in the title as well) as it is now firmly ingrained in the field.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# General aspects of machine learning


    The different machine learning approaches for chess provide good examples of the
    differences between rules-based models and AI models. To program a computer to
    play chess, we can give it the rules of the game, some basic strategic information
    along the lines of “it’s good to occupy the center,” and data regarding typical
    chess openings. We can also define rules for evaluating every position on the
    board for every move. The machine can then calculate all possible moves from a
    given position and select those that lead to some advantage. It can also calculate
    all possible responses by the opponent. This brute force approach evaluated billions
    of possible moves, but it was successful in defeating expert chess players. Machine
    learning algorithms, on the other hand, can develop strategically best lines of
    play based upon the experiences of learning from many other games played previously,
    much as prior examples improved a simple classification problem as described in
    the previous section. Early machine learning models took only 72 h of play to
    match the best rules-based chess programs in the world. Networks such as these
    learn to make judgment without implicit input as to the rules to be invoked in
    making those judgments.


    What most machine learning programs have in common is the need for large amounts
    of known examples as the data with which to train them. In an abstract sense,
    the program uses data to create an internal model or representation that encapsulates
    the properties of those data. When it receives an unknown sample, it determines
    whether it fits that model to “train” them. A neural network is one of the best
    approaches toward generating such internal models, but in a certain sense, every
    machine learning algorithm does this. For example, a program might be designed
    to distinguish between cats and dogs. The training set consists of many examples
    of dogs and cats. Essentially, the program starts by making guesses, and the guesses
    are refined through multiple known examples. At some point, the program can classify
    an unknown example correctly as a dog or a cat. It has generated an internal model
    of “cat-ness” and “dog-ness.” The dataset composed of known examples is known
    as the “training set.” Before using this model on unlabeled, unknown examples,
    one must test the program to see how well it works. For this, one also needs a
    set of known examples that are NOT used for training, but rather to test whether
    the machine has learned to identify examples that it has never seen before. The
    algorithm is analyzed for its ability to characterize this “test set.”


    Although many papers quantitate the results of this test in terms of accuracy,
    this is an incomplete measure, and in cases where there is an imbalance between
    the two classes that are to be distinguished, it is completely useless. As an
    example, overall cancer incidence for the period 2011–15 was less than 500 cases
    per 100,000 men and women. I can create a simple algorithm for predicting whether
    a random individual has cancer or not, by simply having the algorithm report that
    everyone is negative. This model will be wrong less than only 500 times, and so
    its accuracy is approximately 99.5%! Yet this model is clearly useless, as it
    will not identify any patient with cancer.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'As this example shows, we must not only take into account the accuracy of the
    model but also the nature of its errors. There are several ways of doing this.
    The simplest is as follows. There are four possible results for an output from
    the model: true positives (TP), false positives (FP), true negatives (TN), and
    false negatives (FN). There are simple formulas to determine the positive predictive
    value and the sensitivity of the algorithm. These are known as “precision” (Pr)
    and “recall” (Re), respectively. In some publications, an F1 value is given, which
    is the harmonic mean of Pr and Re.


    # Deep learning and neural networks


    For many kinds of machine learning, the programmer determines the relevant features
    and their quantification. Features may include such things as weight, size, color,
    temperature, or any parameter that can be described in quantitative, semiquantitative,
    or relative terms. The process of creating feature vectors is often known as feature
    engineering. There are some things that have too many features to do this directly.
    For example, a picture may have several megabytes of data at the pixel level.
    Prior to machine learning, image analysis was based upon specific rules and measurements
    to define features, and a rules-based program detected patterns based on edges,
    textures, shapes, and intensity to identify objects of such as nuclei, cytoplasm,
    mitoses, necrosis and so on, but interpretation of these was up to the human pathologist.
    Before neural networks, machine learning also needed humans to define features,
    a task often referred to “feature engineering.” These more powerful networks could
    make specific classification and predictions from the image as a whole. Neural
    networks consisting of layers of simulated neurons took this a step further; a
    large part of the strength of these algorithms is that the network can abstract
    out high-level features from the inputted data all by itself. Those are based
    on combinations of initial data inputs and are often referred to as representations
    of the data. These representations are of significantly lower dimensionality than
    the original feature vectors of the input. The representations are formed in the
    network layers that are between input and output which are referred to as hidden
    layers. Training refines these representations, and the program uses them to derive
    its own internal rules for decision-making based on them. Thus, the neural network
    learns rules by creating hidden variables from data.


    Within the inner layers of the neural network, the process of abstraction leading
    to a representation is based on an iterative model often initiated by random variables,
    and so is partially unexplainable to the human observer (which is why the term
    “hidden” is used for these inner layers). This lack of explainability is uncomfortable
    for some researchers in the field. However, if you were to ask an experienced
    pathologist how he or she arrived a diagnosis based upon examination of a biopsy
    slide, they would find it difficult to explain the cognitive processes that went
    into that judgment, although if pressed, they could define a set of features consistent
    with that diagnosis. Thus, both neural networks and humans base their decisions
    on processes not readily explainable.'
