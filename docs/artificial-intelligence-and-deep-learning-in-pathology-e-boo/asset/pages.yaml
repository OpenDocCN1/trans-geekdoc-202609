  md: 'have a reasonable degree of self-similarity, the background is often mostly
    white or mostly black, and so on.


    Various image conversion tasks have been identified as worth pursuing in histology,
    and these are described below.


    # Common machine learning tasks


    In histopathology, there are several tasks that can be assisted through the application
    of deep learning technologies. Most of these problems fall into four classes:
    classification, segmentation, image translation, and image style transfer. Here,
    we will briefly define these tasks and explain how problems in histopathology
    can be formulated as common machine learning tasks. In all cases, we focus on
    image tasks, as this is most relevant to histopathology.


    # Classification


    Image classification refers to the task of assigning a label to an image. Much
    of the field of histopathology is comprised of various classification tasks. This
    is since histopathology is mainly focused on assigning a diagnosis based on review
    of slide-based microscopy. Automatic classification of tissue structures and subtypes
    can also be extremely useful to augment and improve the histopathology workflow.


    As a central problem in computer vision and machine learning, the methodologies
    for solving classification problems have been broadly explored in both academic
    and well-funded commercial enterprises and considerable progress has been made.
    The leading algorithms for image classification are convolutional neural networks
    (CNNs), which have demonstrated better-than-human performance on various benchmark
    datasets [1–6], although their real-world performance across novel institutions
    and differently curated collections remains to be determined. We will briefly
    cover an example application of deep learning–based classification in histology
    used for intraoperative surgical guidance in Deep learning for computationally
    aided diagnosis in histopathology section.


    # Segmentation


    Image segmentation refers to the task of assigning labels to specific regions
    of an image. It can also be seen as a pixel-level classification task. Segmentation
    of subcellular structures, such as nuclei and cytoplasm and membrane compartments,
    can be useful for automating common tasks such as cell enumeration (via nuclei
    counting), determination of intracellular locations of molecular markers, and
    is important for analysis of subcellular morphological features such as nuclear
    size, eccentricity and chromatin texture [7]. Automatic segmentation can also
    be used to help pathologists recognize tissue components by delineating different
    tissue types. While segmentation in pathology is not a focus of this chapter,
    some image'
