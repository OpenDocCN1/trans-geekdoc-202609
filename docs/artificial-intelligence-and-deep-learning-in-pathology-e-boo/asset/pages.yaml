  md: '# Naïve Bayes assumption—based methods


    Naïve Bayes classification applies the Bayes theorem by making the “naïve” assumption
    of feature independence. Formally, given a set of n features x₁,..., xₙ, the associated
    pattern is deemed as belonging to the class y which satisfies the following condition:


    $$y = \arg \max_{j} P(C_j) \prod_{i=1}^{n} p(x_i|C_j)\tag{8.1}$$


    where P(Cⱼ) is the prior probability of the class Cⱼ and p(xᵢ|Cⱼ) is the conditional
    probability of the feature xᵢ given class Cⱼ (readily estimated from data using
    a supervised learning framework) [23].


    The key potential weakness of naïve Bayes—based algorithms, be they regression
    or classification oriented, is easily spotted, and it lies in the unrealistic
    assumption of feature independence. Yet, somewhat surprisingly at the first sight,
    these simple approaches often work remarkably well in practice and often outperform
    more complex and, as regards the fundamental assumptions of feature relatedness,
    more expressive and more flexible models [19].


    There are a few reasons why this might be the case. One of these includes the
    structure of errors—if the conceptual structure of data relatedness under a given
    representation is in a sense symmetrical, errors in the direction of overestimating
    conditional probabilities and those in the direction of underestimating them can
    cancel out in the aggregate, leading to more accurate overall estimates [24].
    Another equally important factor contributing to often surprisingly good performance
    of methods which make the naïve Bayes assumption emerges as a consequence of the
    relationship between the amount of available training data (given a problem of
    a specific complexity) and the number of free parameters of the adopted model.
    It is often the case, especially considering that in digital pathology class imbalance
    poses major practical issues, that more complex models cannot be sufficiently
    well trained; thus, even if in principle able to learn a more complex functional
    behavior, this theoretical superiority cannot be exploited.


    While a good starting point and a sensible baseline, naïve Bayes—based methods
    are in the right circumstances outperformed by more elaborate models, some of
    which we summarize next.


    # Logistic regression—based methods


    Logistic regression is another widely used, well-understood, and often well-performing
    supervised learning technique. In logistic regression, the conditional probability
    of the dependent variable (class) y is modeled as a logit-transformed multiple
    linear regression of the explanatory variables (input features) x₁, ..., xₙ:


    $$P_{LR}(y = \pm1|x, w) = \frac{1}{1 + e^{-y w^T x}}.\tag{8.2}$$'
  merge: -1
  img_proc: true
