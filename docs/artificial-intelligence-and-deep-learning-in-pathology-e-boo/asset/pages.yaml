  img_proc: true
- pgno: 114
  md: 'Nagpal et al. (2019) have published a study on the development and validation
    of a DL algorithm for improving Gleason scoring of prostate cancer [162]. This
    study aimed to address the issue of grading variability, improve prognostication,
    and optimize patient management. A two-stage deep learning system (DLS) was developed
    to perform Gleason scoring and quantitation on prostatectomy specimens. The first
    stage was a deep convolutional neural network–based regional Gleason pattern classification.
    It was trained using 912 slides with 112 million pathologist-annotated image patches.
    About 1159 slide-level pathologist classifications were used for the second stage
    of training. A reference standard was created from the independent reviews of
    three pathologists as well as a genitourinary specialist pathologist on a dataset
    of 331 slides from 331 patients from 3 independent sources [162].


    Twenty-nine additional pathologists reviewed the validation dataset as a comparison
    to the performance of the DLS. The mean accuracy of the 29 pathologists was 0.61
    compared with an accuracy of 0.70 for the DLS (P = .002). Gleason Grade decision
    thresholds were also investigated with the DLS achieving area under the receiver
    operating characteristic curves between 0.95 and 0.96 at each threshold. At a
    Gleason Grade ≥4, the largest difference was seen, and the DLS showed greater
    sensitivity and specificity than 9 out of 10 pathologists [162].


    Because of its clinical significance, Gleason pattern quantitation was compared
    among the groups; DLS had 4%–6% lower mean absolute error than the average pathologist,
    and the DLS predicted the same pattern as the pathologist 97% of the time. Lastly,
    the DLS was able to predict a more gradual transition from well to poorly differentiated
    by utilizing “fine-grained Gleason patterns,” such as 3.3 or 3.7 instead of the
    traditional methods of Gleason scoring [162].


    Bulten et al. (2020) reported on a DL method for the automated Gleason grading
    of prostate biopsies. The purpose of this latter study was to create a DLS that
    was fully automated for detecting cancer and performing Gleason grading without
    the need for training with manual pixel-level annotations. This was accomplished
    using previously developed epithelium and prostate cancer segmentation algorithms
    with slide-level Gleason grades from the original pathology reports of 5209 biopsies
    from the Radboud University Medical Center. The U-Net architecture was utilized
    in two stages: (1) Segmentation of the whole biopsy was done by assigning Gleason
    growth patterns to tumorous regions, and the normalization ratio of epithelial
    tissue was calculated. (2) The normalized volume percentages of each growth pattern
    were used to determine the grade group. The neural network was deepened to contain
    six levels with more skip connections in each layer block and upsampling operations
    in the expansion path. A test set of 535 biopsies that were not included in the
    training set was reviewed by three uropathologists, each with greater than 20
    years of experience. A consensus score and Gleason Grade were determined by these
    expert pathologists, and this became the reference set [163].


    This DLS attained a quadratic kappa agreement of 0.918 with the reference set.
    Misclassification occurred at the decision boundaries of grade groups 2 and 3
    as well as groups 4 and 5. Determining benign versus malignant biopsies resulted
    in an area'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'under the receiver operating characteristic curve of 0.990 with a specificity
    of 82%. In a subset of 100 cases assessed by an external panel of 15 pathologists,
    the median interater agreement kappa value was 0.819, compared with the system
    kappa value of 0.854 [163].


    Additional analyses showed that the DLS performs better than pathologists with
    less than 15 years of experience ($P = .036$) and is not significantly different
    to those with greater than 15 years of experience ($P = .955$). No significant
    difference was found between the DLS and the panel of pathologists for detection
    of benign and malignant specimens ($P = .704$). Lastly, the DLS was applied to
    an external data set of 641 cores that were annotated by two pathologists independently,
    and quadratic kappa values were 0.711 and 0.639. These values fall within the
    range of interobserver variability but are lower than those achieved by the reference
    set [163].


    Both studies above showed that DLSs can achieve pathologist-level performance
    [162,163]. This is important in the field of pathology with increasing demand
    and not enough physicians going into pathology to keep up. The first study developed
    a DLS that was more accurate than several general pathologists in the quantitation
    of Gleason patterns. In addition, it created a system that could discriminate
    these patterns at a finer level. The second study created a DLS using an automated
    training system that did not require extensive additional pathologist work hours
    and thus saved valuable resources. It used a straightforward and easily interpretable
    system that is similar to the method pathologists currently use in clinical practice,
    which allows simple communication between the DLS and clinicians. Both studies
    created systems that can not only detect the presence of a tumor but accurately
    grade the aggressiveness of the tumor utilizing Gleason scoring [162].


    There are important limitations to both studies that would need to be addressed
    before the implementation of these tools into clinical practice [162,163]. The
    first study employed a time-consuming and expensive method to train the DLS with
    112 million pathologist-annotated image patches requiring almost 900 pathologist
    hours. The purpose of creating the DLS becomes obsolete if pathologists have to
    spend exuberant amounts of time training them. This study used prostatectomy specimens
    to determine the Gleason Grade. This means the grade obtained can only inform
    postoperative treatment decisions, instead of whether a prostatectomy was recommended
    to begin with [162]. The second study solved this issue by using biopsy specimens
    to determine Gleason Grade but only obtained data from a single center. This caused
    the DLS performance to be lower for the external test set [163]. Both studies
    utilized digital slide review, which is not universally accepted by all pathologists.
    They also did not show that either DLS could stage or review the slides for unusual
    pathology, other tumor types, or foreign tissue that could be present in prostate
    biopsies.


    Overall, there have been promising advances in DLS for the automated Gleason grading
    of prostate cancer. Both of the studies discussed above were conducted at approximately
    the same time in slightly different manners. They used different training methods
    for each DLS as well as different types of specimens. It appears'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'that semiautomatic labeling for training the DLS of the second study paired
    with the multicenter data retrieval of the first study could produce even more
    generalizable results. The ability to further classify regions into “fine-grained
    Gleason patterns” could increase classification accuracy and agreement within
    the DLS. Utilizing the Gleason Grade of biopsy specimens instead of prostatectomy
    specimens is essential in providing insight for determining the next steps in
    clinical care for patients with prostate adenocarcinoma. Other investigators have
    also developed and built algorithms for the diagnosis and detection as well as
    grading of prostate cancer [164–167], and it is expected that similar methods
    and tools will continue to flourish as digitization of pathology workflow continues
    to increase with increasing adoption of these tools.


    # Conclusions


    Significant technologic gains have led to the adoption of innovative digital imaging
    solutions in pathology. WSI, which refers to scanning of conventional glass slides
    to produce digital slides, is the most recent imaging modality being employed
    by pathology departments worldwide. WSI continues to gain traction among pathologists
    for diagnostic, educational, and research purposes. The quality of the images
    produced is of diagnostic quality, and with the viewing software, it is possible
    to have annotations and clinical metadata presented with the image, resulting
    in a virtual microscope with all the clinical information needed to sign out the
    case [11].


    Many recent studies have demonstrated the utility of WSI in teaching, quality
    assurance assessment, frozens, consultation, telepathology, image analysis, and
    research use [159,168,169]. Some of the advantages of using digital pathology,
    particularly WSI, has been the ability to help address several problems with conventional
    light microscopy, including eliminating the inefficiencies of “snapshot” imaging
    or taking images of regions of interest for meetings and conferences. Digital
    pathology has now paved the way to facilitate the sharing of cases/slides across
    distances. Now, we can have access to experts, irrespective of patient location.
    Digital workflow also contributes to our ability to share cases with multiple
    colleagues simultaneously. We can start creating more smart worklists particularly
    aiming in the prioritization of caseloads and workload balancing. It is now possible
    to reallocate cases across a network, which in turn enables the experts doing
    expert work and generalists doing general pathology. There are access-archived
    images, which in turn reduce and may be eliminate physical, more expensive, movement
    of glass slides.


    Applications of AI and ML techniques such as deep neural networks may be trained
    to not only recognize specific patterns on a whole slide image of an H&E slide
    but also AI tools may help in the interpretation of features in the tissue that
    are predictive and/or prognostic. With DL software deployment, pathologists will
    gain in the three areas of pathology workflow: information management, image sharing,
    and image analysis [14,26,170,171].'
