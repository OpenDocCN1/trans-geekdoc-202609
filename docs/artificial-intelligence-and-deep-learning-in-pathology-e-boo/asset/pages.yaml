- pgno: 35
  md: 'Additional modulation of signals comes at the synapses between two brain cells.
    A synapse between two neurons is strengthened when the neurons on either side
    of the synapse (input and output) have highly correlated outputs. This is known
    as Hebbian learning. In essence this means that if one neuron repeatedly excites
    another, then the connection between them is facilitated. Hebbian learning allows
    modification of the flow of information within the network. In the brain, the
    synaptic connections are constantly being remodeled, based upon the integrated
    set of signals they are responding to at any given moment. Remodeling is not well
    understood, but appears to be based on the accumulation and depletion of chemical
    gradients. Some synapses can be completely eliminated via interaction with astrocytes
    or glia, presumably via cytokines.


    This picture is further complicated in that the neuron, taken as a whole, can
    show bistable behavior. Bistability is a property of a dynamical system that exhibits
    more than one stable point. A model proposed by Lowenstein and Sompolinsky [9]
    involves bistability with respect to the dendritic concentration of Ca++. If it
    is forced to be in the up state at one end of the dendrite, and in the down state
    at the other, then a standing wave of Ca++ concentration is created, instead of
    a gradient. As long as no further input occurs, the wave front will maintain its
    position. This model is very important. Although the process of activating and
    firing a neuron occurs at very short time scales, working memory requires longer
    time scales, and this model is one simple way of integrating transient effects
    into a persistent trace, which is essentially a definition of working memory.


    Since each neuron receives inputs from many other neurons, and transmits its output
    to many other neurons, the neurons essentially work as aggregators; the total
    amount of output is controlled by the total input from all its dendritic connections.
    Since the axon can also connect to multiple neurons, this allows a complex, multi-layer
    structure to develop. The human brain has approximately 100 billion neurons. Even
    though arranged as subsystems, there are huge numbers of possible interconnections.


    # The rise of the machines


    After approximately 1.9 million years and 3 months (author’s note: It was 1.9
    million when this chapter was begun, 3 months ago) of brain evolution, human scientists
    began to model the brain. Rosenblatt’s single layer perceptron [1] was based upon
    the first mathematical model of a neuron by McCullough and Pitts [2], the MCP
    neuron. This was inspired by the Hebbian concept of synaptic plasticity based
    on the adaptation of brain neurons during the learning process. Applying different
    relative weights to the inputs affects the output, Rosenblatt developed a supervised
    learning algorithm for this modified MCP neuron that enabled it to figure out
    the correct weights by learning from data all by itself. Such an artificial neuron,
    which is a mathematical abstraction rather than a physical construct, is diagrammed
    in Fig. 2.9 and compared to a simple representation of a biological neuron.'
