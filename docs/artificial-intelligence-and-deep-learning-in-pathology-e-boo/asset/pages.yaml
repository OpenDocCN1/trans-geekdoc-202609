- pgno: 224
  md: 'for patients with ER + breast cancer [124] based on a pipeline that segmented
    and classified nuclei as lymphocytes, cancer, or other types of nuclei to perform
    analyses in postmenopausal patients with ER + breast cancer treated with tamoxifen
    or anastrozole over 5 years. The prognostic significance of immune scores was
    then compared with Oncotype DX 21-gene recurrence score (RS), PAM50 risk of recurrence
    (ROR) score, IHC4 score, and clinical treatment scores.


    The development of methods that classify tissue regions has been facilitated by
    the rapid development of convolutional neural network (CNN) methods and publicly
    available software. Recently, a deep learning–based patch classification workflow
    was utilized to characterize patterns of lymphocytes in WSIs by using a CNN to
    classify image patches as lymphocyte-positive (i.e., containing lymphocytes) or
    lymphocyte-negative in combination with a CNN to segment necrotic regions in order
    to reduce false lymphocyte-positive classifications [41]. This method leveraged
    a convolutional autoencoder (CAE) that was designed to encode nuclei in image
    patches into sparse feature maps that encode both the location and appearance
    of nuclei [105]. A supervised CNN took unsupervised encoded features from the
    unsupervised CAE for classification. An iterative training effort was carried
    out with 100 × 100 pixel image patches (equivalent to a resolution of 50 × 50µm
    patches at 200× magnification) for 5200 images from 13 tumor types using TCGA
    data.


    The approach taken was to progress through tumor types and (1) annotate lymphocyte
    infiltrated image regions and regions not infiltrated by lymphocytes, (2) train
    by using all available annotations to generate predictions, and (3) visually assess
    the predictions while extracting samples of images from regions where the predictions
    were inaccurate until adequate accuracy was obtained for the given tumor type.
    After the end of this process, a separate testing dataset was generated across
    tumor types to evaluate results. Recently, Abousamra et al. utilized all of the
    publicly available set of annotations generated in this method to train two standard
    CNN networks, VGG 16 and Inception v4 to generate predictions in the same 5200
    TCGA specimens [125]. The accuracy that was obtained by using the standard models
    on the aggregated training set is modestly better than that reported by using
    the CAE model on the incrementally generated training set [41,125].


    A variety of other efforts have targeted characterization of region types in specific
    tumor types. In breast cancer, a fully convolutional network was utilized to carry
    out pixel level semantic segmentation to identify tumor, stroma, necrosis, and
    TILs [10]. These training data were gathered through a structured annotation gathering,
    where the annotation curation process was called “structured crowdsourcing” through
    participants with varying degrees of expertise who contributed training data.
    Amgad et al. [11] have also described pixel-level semantic segmentation of tumor,
    stroma, and necrosis regions linked with the detection of tumor, stroma, and lymphocytic
    nuclei. This approach also employs a fully convolutional network approach that
    combines region and nucleus segmentation masks to classify pixels into 12 classes,
    where each class encodes a combination of region and nucleus membership information.
    The framework enforces biological constraints, e.g., it does not allow cell classifications
    within necrotic regions or stromal cells within non-stromal regions.'
