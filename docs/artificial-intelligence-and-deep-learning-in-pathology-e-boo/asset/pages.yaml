  md: 'for the identification and semiquantification of more discrete and subtle morphologies
    as well as, for example, the counting of specific cell types, mitotic figures,
    or biomarker expression across WSIs [2–4]. The automated analysis of such features
    by computer algorithms can overcome these flaws and provide objective and standardized
    quantification. With ongoing research providing much needed evidence of the capability
    of image analysis and artificial intelligence to accurately quantify and report
    on molecular and morphological features, it is only a matter of time before these
    too translate into the clinic.


    The use of image analysis and artificial intelligence can be knowledge driven
    or data driven. The next section of this chapter will discuss how both methodologies
    can be applied to digital pathology before we expand on the theory and concepts
    behind the various artificial intelligence models commonly used in the field.


    # Applications of image analysis and machine learning


    # Knowledge-driven image analysis


    The first applications of image analysis in digital pathology were the quantification
    of previously identified histopathological features or immunohistochemical results
    of known pathological significance. This image analysis typically relies on user-defined
    thresholds of either color or fluorescence intensity coupled with classifications
    based on object shape, extent, or texture. Examples of histopathological features
    quantified in such a manner include the quantification of tumor buds, lymphovascular
    density and invasion, or immune infiltrate [5,6]. Similarly, the quantification
    of protein expression through immunolabeling, such as pHH3, PDL-1, or EGFR, whether
    studying predictive or prognostic outcomes, can also be quantified in such a manner
    [7–9]. This image analysis can be applied to user-defined regions of interest
    through manual annotations, or across WSIs. A further advantage of the automatic
    reporting of such features, over and above reproducibility, is that they can be
    quantified across a continuum instead of traditional semiquantified categorical
    reporting. The analysis of continuous data is far more amenable to personalized
    pathology through machine learning than creating distinct categories to group
    patients.


    # Machine learning for image segmentation


    Pathologists regularly quantify features from specific locations within the tissue
    section, for example, only within the tumor or stromal cells, or at the cancer’s
    invasive margin. However, to manually annotate images to differentiate these regions
    of interest prior to performing image analysis is a subjective and tedious task,
    specifically if needed to be applied to the large patient cohorts required for
    statistically relevant studies. One can therefore apply machine learning algorithms,
    such as random forest, directly to the images to overcome the need for manual
    annotations. This machine learning–based classification relies on the user teaching
    the algorithm what'
  merge: -1
  img_proc: true
