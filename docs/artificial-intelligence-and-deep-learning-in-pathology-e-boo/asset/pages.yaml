- pgno: 105
  md: 'approaching 0.15 μm/pixel enables the pathologist to determine the presence
    of clinically important subtle details within the digital slide that are typically
    visible while utilizing a traditional optical microscope [89].


    The main component of the optical microscope is the objective lens. High NA objectives
    are typically used in optical microscopes provided within a WSI system [92]. NA
    affects image resolution; scanning conducted with higher NA objectives creates
    sharper images. Lenses are typically nonproprietary to the WSI manufacturer. Vendors
    are beginning to incorporate multiple objective lens configurations within a single
    device. Majority of WSI systems are supplied with a 20× objective lens for scanning
    purposes, as the 20× objective lens configuration provides the best match of field
    size and resolution [93]. However, interpretation of specific pathology tissue
    types such as neuropathology or transplantation pathology may require higher resolutions
    that are obtained using higher magnification lens and configurations [93].


    The scanning resolution offered by currently marketed WSI systems using a bright-field
    light source with a 20× magnification objective configuration ranges from 0.22
    to 0.5 μm/pixel, and when using a 40× magnification objective configuration, it
    is about 0.25 μm/pixel.


    The balance between image resolution and magnification and the resulting digital
    image display on a computer monitor are important points to consider in selecting
    and configuring a WSI system. It is difficult to match a WSI image to an image
    obtained using a traditional microscope. The design of a bright field optical
    system is composed of multiple stages or planes from where light is collected
    and focused on the specimen, through the objective and connected tube lens/camera
    adaptor to reach the camera chip sensor, and ultimately to the human eye via monitor
    display. To understand and optimize the resulting image quality on a monitor display,
    it is important to relate the resolution of the various components of this system
    [94,95].


    Innovations in illumination are being utilized by WSI vendors; the traditional
    bright field halogen lighting, although still currently used in many scanners,
    is being replaced with newer light-emitting diode (LED)–based modules, to provide
    improved color consistency. New techniques in illumination also include LED “strobing”
    or flash illumination instead of constant illumination, as this minimizes motion
    artifact enabling faster acquisition [92]. Automated multichannel fluorescent
    WSI is now readily available by some of the vendors [96,97].


    # Whole slide image viewers


    All WSI systems are provided with software that supports viewing of WSI image
    files (digital slides) at the scanner control computer workstation. Imaging viewing
    software allows viewing of digital slides on a computer screen in a manner similar
    to the viewing of glass slides using a traditional optical microscope [98]. Most
    vendors provide feature-rich image viewing software solutions, offering many functions
    for image navigation, panning and zooming movements, image manipulation/editing
    with an enhanced ability to add annotations, and microscopic image measurements
    [6,78].'
