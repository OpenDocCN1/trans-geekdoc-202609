    reduction. The classic example, from statistical models, is known as PCA, which
    was first described in the 1930s, way before the onset of machine learning. PCA
    operates by finding the direction of maximum variance in the data. This is the
    dimension along which the data are most spread out and is the first principal
    component. The next one is the line perpendicular to this component that has the
    next best spread of the data, and so on. This process is repeated until there
    are as many principal components as the original data have dimensions. In essence,
    it is simply a linear transformation of the data from one n-dimensional space
    to another n-dimensional space that retains the information in the original set.
    In order to reduce the dimensionality of this transformed set, we must discard
    some of these components. Since the n components have already been ordered according
    to importance, if we want to project down the k dimensions (k < n) we just keep
    the first k components and discard the rest. We can plot the loss of information
    by a graph showing variance as a function of component number (in mathematical
    terms, the curve shows the eigenvalues of the covariance matrix on the y-axis
    and the component number of the x-axis). This construct is known as a scree plot.


