- pgno: 76
  md: 'We can expand the number of samples by the use of so-called synthetic data.
    Synthetic data are created rather than obtained from real-world samples. A typical
    example is a dataset in which some entries are missing one or more attributes.
    One can fill in those blanks by approximations based upon a statistical analysis
    of the collective data attributes in the set. Another method of generating synthetic
    data is to create a physical model that explains the observations and then reproduce
    random data using that model, because in many cases observed features of a complex
    system can often emerge from simple rules. Patki et al. [20] have described a
    system that builds machine learning models out of real datasets to create such
    artificial data, the Synthetic Data Vault. This model captures correlations among
    the multiple features. In their study, the investigators found no significant
    performance difference when using synthetic data as compared with using only real-world
    data.


    For the case of image analysis, we can create synthetic data by taking real samples
    and manipulating them in some controlled way to create randomized new examples
    that share properties of the real data. There are a number of available programs
    such as GANpaint Studio that allows the creation of realistic images of faces
    or scenes (available as a free demo from the internet). Such programs have been
    used to generate so-called “deepfake” images for nefarious purposes, but such
    algorithms can be used to create synthetic images from real ones for use as supplemental
    in machine learning protocols. Hou et al. [21] have used GANs to generate histopathology
    images that model the distribution of real data.


    # N-shot learning


    When performing tasks such as classification using AI, large datasets are used
    to create internal representations for each class that can be used to generalize
    to new unlabeled examples. Humans do not learn in this fashion. For example, show
    an infant a banana a few times and the child will recognize that banana. It is
    true that complex patterns require more learning; however, it is well known that
    one can “train” second-year medical students to distinguish between normal, benign,
    and malignant examples with much less than 100 samples. In general, humans can
    classify based on limited examples if they have adequate information about their
    appearance, properties, and in some cases their functionality. This may be a general
    capability of suitably complex biological brains. Levenson et al. [22] have demonstrated
    that it is possible to train pigeons to accomplish cancer diagnostic tasks with
    high degrees of precision in less than 200 trials! An ensemble of 16 pigeons was
    able to achieve performance approaching that of a trained CNN.


    A “shot” is defined as a single example available for training. In one-shot training,
    we only have a single example of each class. In N-shot learning, there are N examples.
    The task is to classify any test image into a class using that constraint. One
    way of doing this is by the use of “prototypical networks.” Unlike the usual deep
    learning architecture, prototypical networks do not classify the images directly.
    They learn the mapping of the image into metric space. This means'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'that images of the same class are placed in close proximity to each other,
    while different classes are placed at further differences. When a new example
    is presented, the network just checks for the nearest cluster to it. These models
    are essentially sophisticated forms of the K-means clustering algorithm and are
    based on CNNs. Models in this category are known as “Image2Vector” models. More
    sophisticated models involve neural networks augmented with memory via a neural
    attention mechanism. These can be complicated to describe, but a good example
    is seen in Ref. [23]. Although “one-shot learning” should be used to describe
    the case where N = 1, that term is also used more generally when N is very small.


    The method for N-shot learning with the greatest potential for one-shot learning
    currently appears to be the Siamese network. Instead of a model that learns to
    classify its inputs, the neural network learns to differentiate between two inputs.
    A typical Siamese network consists of two identical neural networks, each taking
    one of the two images. Identical means that they have the same configuration with
    the same parameters and weights. The last layers of the two networks are jointly
    fed into a contrastive loss function that calculates the degree of similarity
    between the two images. An example from natural language processing involves scoring
    an exam question. Here one input is the question sentence and the other input
    is the answer. The output is how relevant the answer is to the question. This
    is not a simple classification task in that we do not have a database consisting
    of all possible answers that are judged “correct” and examples that are judged
    “wrong.” Nevertheless, a Siamese network can extract similarity or a connection
    between question and answer.


    Very often the term one-shot learning is used whenever n is a small number. In
    any event, Siamese Networks have achieved state-of-the-art performance in one-shot
    image recognition tasks (Koch et al. [24]). In this study, each of the two networks
    was a standard CNN. The final convolutional layer output was flattened into a
    single vector, which was then fed into a fully connected layer, and then to an
    additional layer that computes the distance metric between the outputs of each
    Siamese twin.


    There are relatively few examples of one-shot learning involving pathology subject
    matter. Within the past few months, Yarlagadda et al. [25] demonstrated the use
    of a one-shot learning model for cervical cancer cell classification in histopathological
    images.


    # One-class learning


    It is important to distinguish between one-shot learning and one-class learning.
    Closely related to N-shot learning is the concept of one-class learning. The object
    of one-class classification is to recognize instances of a class by only using
    examples of that class. All other classes are lumped together and are known as
    alien classes. In other words, the difference between one-class and binary classification
    is due to the absence of training data from a second class. While this approach
    has received a'
