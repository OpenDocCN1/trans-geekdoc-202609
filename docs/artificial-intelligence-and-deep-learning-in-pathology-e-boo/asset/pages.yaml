- pgno: 59
  md: 'Additionally, there are cases in which the two methods can be combined. This
    typically occurs when we have some training labels for our data, but they do not
    fully capture the behavior we want. For example, many machine translation systems
    are trained to optimize BLEU score [19], even though it is acknowledged to be
    an imperfect model for human evaluation of translation quality. Training a machine
    translation system fully using reinforcement learning and human evaluation would
    require so much time as to be entirely infeasible. However, it is possible to
    first train the system in a supervised fashion using BLEU scores, and then refine
    the system using reinforcement learning. Since it is only a refinement, much less
    training data are required, making this more practical. However, it is worth note
    that there is no guarantee this will actually improve the performance of the final
    system; some experiments done using Google Translate showed that the benefits
    of this approach were not as great as had been hoped [16].


    # ## Ensembles


    A classic machine learning method for boosting the performance of classifiers
    is to combine several of them together into an *ensemble* classifier. The inspiration
    is the same as that behind crowdsourcing; in both cases, each individual member
    may be wrong, but so long as enough of them are right, the “group” gets the correct
    answer. This relies on the assumption that the members of the ensemble are sufficiently
    diverse, since if they all make the *same* mistakes, there is no benefit. However,
    there is enough randomness in the standard neural network training algorithms
    to allow for a reasonable degree of independence, which can be increased if necessary
    through methods like boosting or bagging.


    Even without these methods, ensembles of deep neural networks tend to outperform
    their members. Thus, a reliable way of increasing the performance of a deep neural
    network is to simply train four or five different copies of the network and then
    allow them to “vote” for the correct answer. There are limits to how much performance
    can be gained this way, but it is a fairly simple means of eking out a few more
    percentage points of accuracy.


    This is an example of the simplest way to build an ensemble, simply training multiple
    copies of the *base* classifier and then combining their output. The simplest
    way of combining classifier output is to allow each classifier to make its own
    prediction and then choose the plurality prediction as the “final” output. This
    simple *voting* scheme is easy to implement and easy to understand, but it does
    not always produce the best possible results. In particular, it gives equal weight
    to all members of the ensemble, which may not be a good idea. If we have reason
    to believe that a particular member of the ensemble is likely to be unusually
    trustworthy (or untrustworthy) for a given example, it would make sense to do
    *weighted voting*. Here, each classifier still gets to vote, but not all votes
    count equally. Instead of each classifier contributing +1 to the vote tally for
    their respective choice, they will contribute'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'an amount proportional to some confidence measure. At the end, the answer with
    the largest total score is then the one chosen as the ensemble’s joint answer.
    The choice of confidence measure will be problem dependent, but for artificial
    neural networks one common choice is to train the networks to produce pseudo-likelihood
    scores for the various classes as their outputs. The score associated with the
    “winning” class can then be used as a confidence measure; if the network predicts
    a class with a value of 0.99, we give it more weight than if the highest output
    value is only 0.6.


    The performance of an ensemble depends on the members making *different* mistakes;
    therefore, ensemble performance can often be boosted by forcing the member classifiers
    to be more different from each other, even if that comes at the cost of a small
    accuracy penalty to each individual member. The simplest example of this is a
    method called *bagging*, which works by ensuring each member is trained using
    a slightly different training set. Rather than training each classifier with all
    of the available training data, each classifier is trained using some fraction
    of the examples, chosen at random. This ensures different classifiers will have
    different strengths and weaknesses, and helps ensure the ensemble as a whole does
    not overfit the training data. The smaller the fraction of the training data given
    to each classifier, the more diverse they will be, but the lower their performance
    will tend to be as well. At some point, the individual performance degradation
    overcomes the benefit from increased diversity. Unfortunately, exactly where the
    sweet spot is located is problem dependent.


    One alternative to bagging is a method called *boosting*. Boosting makes the observation
    that the goal is to ensure that every example is classified correctly by a sufficient
    number of members, and tries to build an ensemble to ensure this is the case.
    In boosting, the first member classifier is trained normally, but after that each
    classifier is trained as follows. First, test the performance of the existing
    ensemble on the training data; for each example, count how many classifiers get
    it right, and how many get it wrong. Then, weight the examples based on how often
    they were predicted correctly by the existing ensemble. The more times an example
    was guessed incorrectly, the more importance weight is put on that example. Then,
    a new classifier is trained factoring in the example weights; this means that
    the new classifier will be pushed to do well on the examples that other classifiers
    are getting wrong and will have less incentive to perform well on examples that
    other classifiers are getting right.


    Boosting often performs very well in practice, but it does have a few downsides.
    In particular, bagging is an algorithm that makes use of data parallelism, meaning
    all the member classifiers can be trained simultaneously if enough parallel compute
    power is available. Boosting, on the other hand, is an iterative method; each
    new classifier needs to know the performance of the previous ones, so they must
    be trained one at a time. Additionally, boosting works best for classifiers that
    can easily make use of the importance weights on the examples, which not all possible
    base classifiers can do.


    The only real downside of ensembles is their computational cost; each member of
    the ensemble must be trained from scratch, since otherwise they will not be'
