  md: 'by human sensors. These human understandings are gleaned from the history,
    physical examination, clinical laboratory, radiology, surgical pathology, cytopathology,
    molecular pathology, and quality assurance information systems. In other words,
    pathologists will need to learn how to work with machine learning systems as senior
