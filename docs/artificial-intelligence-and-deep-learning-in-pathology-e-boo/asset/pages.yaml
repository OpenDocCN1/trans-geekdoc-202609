    # Selection criteria for a whole slide scanner


    Today, much progress has occurred in the industry, and there are multiple WSI
    scanners on the market in the United States and globally. These devices have all
    of the following basic features: automated tissue identification, autofocus, autoscanning,
    automated image compression, and automated barcode reading. Some of the key features
    that need to be considered when evaluating a new WSI scanner are listed in Table
    6.1.


    Table 6.1 Key features to consider when evaluating a new whole slide scanner.


    ✔ **Physical/general**

