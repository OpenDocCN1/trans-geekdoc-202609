- pgno: 90
  md: 'analysis (PCA) as it is one of the most highly used procedures. PCA was first
    invented at the beginning of the 20th century as a statistical technique and thus
    precedes the advent of machine learning by half a century. It has become an important
    tool for data preprocessing across many fields and especially in machine learning.
    PCA is used to identify those features that provide the most information in regard
    to distinguishing among examples for the purpose of classification and to remove
    the others. This is done by transforming the data based upon their contribution
    to the variance of that data. Another way of thinking about PCA is to note that
    our data usually contain many variables, some of which may be correlated. This
    leads to a redundancy in the information in the dataset. In essence, PCA transforms
    the original variables to linear combinations of these variables that are independent.
    PCA can be a difficult topic to understand, so we will approach it in two ways,
    first a more or less intuitive approach and then a more precise explanation of
    the underlying mathematical principles.


    A good intuitive account of this is found in Ref. [8]. The article begins by noting
    that variance is a measure of how far a set of numbers is spread out. It describes
    how much a variable differs from its expected value. If each feature had the same
    value in all samples, the model using it would have no predictive value because
    each sample would be identical. Thus, variance is useful as a feature variable
    in the model. If we define the target as the value to be predicted, then we want
    features that have nonzero variances with respect to the target. Mathematically,
    variance is the mean squared difference between the predicted and true values.
    While variance describes how multiple instances of a single variable vary, covariance
    is a measure of how much two or more random variables vary together.


    As noted above, PCA automates data reduction and does so in an unsupervised manner.
    It does so on the basis of variance. It begins by finding the direction of maximum
    variance in the data. This is basically the direction along which the data are
    most spread out. In analogy with linear regression, we can find a line such that
    the mean squared difference between the original data points and the nearest point
    of the line is minimized. This line gives the first principal component. The next
    principal component will be the line that minimizes loss of information while
    also being perpendicular to the component already found (Fig. 5.3). This process
    can be repeated until there are as many components as the original data had dimensions.
    As will be seen below, these operations represent linear transformations of the
    data and can be reversed to reconstruct the original data. Thus, both represent
    equivalent information about the dataset.


    At this point, there is no dimensional reduction. However, each component contributes
    less and less information, as we have started out with the direction in which
    the data are most spread out. This means that we can discard some of the later
    components without doing much damage. This will make the component-based dataset
    dimensionally smaller than the original dataset. The trick is to determine how
    much bathwater can be discarded while retaining the baby. This is usually by plotting
    variance as a function of component number and looking for a cutoff point beyond
    which there is little variance. Fig. 5.4 provides a good illustration of this.
    This is'
  merge: -1
  img_proc: true
