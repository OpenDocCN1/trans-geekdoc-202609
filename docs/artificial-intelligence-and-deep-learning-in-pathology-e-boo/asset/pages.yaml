    # Machine learning tools in computational pathology: types of artificial intelligence


    AI is not really a new concept. The term AI was first used by John McCarthy in
    1955 [4]. He subsequently organized the Dartmouth conference in 1956 which started
    AI as a field. The label “AI” means very different things to different observers.
    For example, some commenters recognize divisions of AI as “statistical modeling”
    (calculating regression models and histograms) versus machine learning (Bayes,
    random forests, support vector machines [SVMs], shallow neural networks, or artificial
    neural network) versus deep learning (deep neural networks and CNNs). Others recognize
    categories of traditional AI versus data-driven deep learning AI. In this comparison,
    traditional AI starts with a human understanding of a domain and seeks to condition
    that knowledge into models which represent the world of that knowledge domain.
    When current lay commentators refer to “AI,” however, they are usually referring
    to data-driven deep learning AI, which removes the domain knowledge inspired feature
    extraction part from the pipeline and develops knowledge of a domain by observing
    large numbers of examples from that domain.


    The design approaches of traditional AI versus data-driven deep learning AI are
    quite different. The architects of traditional AI learning systems focus on building
    generic models. They often begin with a human understanding of the world through
    the statement of a prior understanding of the domain (see Fig. 11.1), develop
    metrics representing that prior, extract data using those metrics, and ask humans
    to apply class labels of interest to these data. These labels are then used to
    train the system to learn a hyperplane which separates one class from another.
