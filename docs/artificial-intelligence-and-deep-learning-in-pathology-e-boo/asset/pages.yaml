- pgno: 173
  md: 'Thus, deep learning algorithms too are not endowed with a quasi-magical ability
    to overcome this fundamental limitation but are also constrained by some prior
    knowledge (and are hence not agnostic). In particular, a deep neural network contains
    constraints, which emerge from the type of its layers, their order, and the number
    of neurons in each layer, the connectedness of layers, and other architectural
    aspects. This is important to keep in mind and not see deep learning as necessarily
    superior to “conventional” approaches or see them as the universal solution to
    any problem.


    # Conventional approaches to image analysis


    As mentioned already, the first broad category of algorithms that have been proposed
    a means of analyzing images used in clinical pathology is one which uses what
    we term conventional, or traditional, computer vision. By this, we primarily refer
    to the first stage in the processing, which concerns the extraction of a priori,
    explicitly defined features. The key premise is appealing and intuitively sensible
    to use human expertise to identify what elementary, low level elements of an image
    are salient in that they capture important discriminative information on the one
    hand, and are yet compact enough to facilitate computational efficiency and reliable
    learning from available data.


    Having demonstrated success on a wide variety of images of so-called natural scenes
    (to say the least, they have rather revolutionarized the field) [43], local appearance
    descriptors originally proposed for more day-to-day applications of computer vision
    (e.g., location recognition, synthetic panoramic image generation, object localization,
    etc.) have been adopted first and applied on a diverse range of pathology image
    types [44,45]. Popular and widely used examples include local binary pattern (LBP)
    [46], scale invariant feature transform (SIFT) [47], and histogram of oriented
    gradients (HOG) [48] based descriptors.


    While also “handcrafted” in contrast to the above general purpose descriptor–based
    features are features which directly and explicitly exploit domain-specific information,
    that is, human expert knowledge of pathology. Thus, body of interest counts (e.g.,
    tumor and immune cells, etc.), their morphology quantifiers (e.g., size, eccentricity),
    or spatial statistics are some of the widely used ones. The appeal of these is
    twofold. First, by their very nature they can be reasonably expected to exhibit
    saliency in the context of pathology slide analysis. Moreover, they are usually
    rather effortlessly measured (extracted) from images: different staining and imaging
    modalities or biomarkers can be used to highlight the targets of interest, and
    simple image processing or computer vision algorithms (such as flood fill algorithms
    [49], morphological operators [50], blob detectors [45], etc.) usually suffice
    as regard to the computational side.'
