    dimensionality of the feature set increases, the space in which the samples reside
    increases with the power of the dimension, and so the sample density at any given
    point falls below that which is needed for an accurate prediction. The obvious
    solution is to get more data, but this may not always be possible in practice.
    There are techniques for dimensional reduction that minimize the loss of information
