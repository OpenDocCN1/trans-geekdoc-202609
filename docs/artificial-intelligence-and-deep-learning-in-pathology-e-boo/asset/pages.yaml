- pgno: 19
  md: 'efficient than current fully software implementations such as both conventional
    neural networks and spiking net algorithms that more directly simulate neuronal
    behavior.


    Much further in the future is the promise of quantum computing that will be orders
    of magnitude faster than the most powerful computers presently available. These
    are based on three-state “qubits” (0, 1, and an indeterminate superposition of
    these) rather than binary bits, and these states can hold multiple values simultaneously.
    A quantum computer can also process these multiple values simultaneously. In theory,
    this allows us to address problems that are currently intractable and could lead
    to major advances in AI. Although current quantum computers have only a small
    number of interacting qubits, it is conceivable that a quantum computer of the
    future could approach the complexity of the human brain, with far less numbers
    of interacting qubits (unless, of course, the brain itself functions in part as
    a quantum computer, as some have speculated). This is not as far-fetched as it
    seems, as photosynthetic processes have been shown to exhibit quantum properties
    at physiological temperatures [3,4], thus demonstrating the feasibility of maintaining
    quantum coherence at room temperatures, based on technologies that have had millions
    of years to evolve.


    Even with current technology, however, both the potential and current applications
    of AI have demonstrated that it will play as powerful a role in pathology and
    medicine in general, as it has already done in many other fields and disciplines.
    For both a good overview and historical perspective of AI, see Ref. [5].


    # General aspects of AI


    For any use of AI in solving real-world problems, a number of practical issues
    must be addressed. For example,


    +   a. For the choice of a given AI algorithm, what are the classes of learning
    problems that are difficult or easy, as compared with other potential strategies
    for their solution?

    +   b. How does one estimate the number of training examples necessary or sufficient
    for learning?

    +   c. What trade-offs between precision and sensitivity is one willing to make?

    +   d. How does computational complexity of the proposed model compare with that
    of competing models?


    For questions such as these there is no current analytical approach to the best
    answer. Thus, the choice of algorithm and its optimization remains an empirical
    trial and error approach. Nevertheless, there are many aspects of medicine that
    have proven amenable to AI approaches. Some are “record-centric” in that they
    mine electronic health records, journal and textbook materials, patient clinical
    support systems, and so on, for epidemiologic patterns, risk factors, and diagnostic
    predictions. These all involve natural language processing. Others involve signal
    classification, such as interpretation of EKG and EEG recordings. A major area
    of'
