- pgno: 203
  md: 'are no better than chance. Although a useful measure, some caveats are important
    to remember. C-Index indicates the discrimination power of an algorithm but not
    the predictive power. Since the index only looks at the proportion of correctly
    ordered pairs, it is agnostic to the actual predicted times.


    Survival analysis can be treated as a regression problem of predicting survival
    times of which there are many methods [98], most of which, however, do not handle
    the problem of missing data caused by patients dropping out of the study over
    time. Missing information from these patients is known as censored data [101].
    Patients who have experienced the event of interest (e.g., PSA recurrence, death,
    or metastasis) are considered events. Right-censored patients are ones being followed
    at the end of the study who have not experienced the event or have dropped out
    of the study, and left-censored patients are patients who had an event but the
    timing is not clear.


    Traditional ways of dealing with censored data in statistics include removing
    the sample points, treating them as nonevents, or more elaborate ways such as
    repeating the data points once as an event and once as a nonevent. There are also
    imputing methods which estimate the missing values before training on a survival
    model. Inevitably, however, all these methods introduce a bias to the resulting
    model. To rectify this, there are a variety of methods that can handle censored
    information, these are outlined in the paragraphs below.


    # Cox proportional hazards model


    One of the first and most popular methods of handling censored information is
    the Cox proportional hazards model [102]. In this model, the hazard function or
    risk (the slope of the survival function, h_i(t)) is proportional for any two
    individuals. The proportionality is set up by taking the product of a baseline
    hazard function (h_0(t)) with baseline features, and an exponential function of
    weighted feature values, with the weights indicating the importance of each feature.
    The biggest caveat when using this model, is to detect and account for time-varying
    effects where the proportionality assumption may break down [103], as is the case
    in many biological applications. The reliability of the Cox model (and other models)
    is not sound if the number of features is greater than the number of events.


    # Neural networks


    In their earliest and simplest form, neural networks for survival analysis [104]
    learned the relationship between features and the hazard functions. Unfortunately,
    this method performed about the same as a linear Cox model. DeepSurv, a relatively
    new method which is rooted in the Cox model, uses deep learning to predict the
    risk of a patient experiencing an event [105]. It is a simple application of a
    multilayer neural network with one output node that predicts patient risk. The
    main advantage of DeepSurv is that, while the Cox model evaluates efficacy as
    a whole for the group of patients, DeepSurv produces a risk score tailored to
    each patient. DeepHit, a'
