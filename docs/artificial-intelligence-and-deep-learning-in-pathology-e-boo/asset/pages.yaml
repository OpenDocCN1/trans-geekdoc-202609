  img_proc: true
- pgno: 7
  md: 'disciplines. The purpose of this monograph is to provide a detailed understanding
    of both the concepts and methods of AI, as well as its use in pathology. In broad
    general terms, the book covers machine learning and introduction to data processing,
    the integration of AI and pathology, and detailed examples of state-of-the-art
    AI applications in pathology. It focuses heavily on diagnostic anatomic pathology,
    and thanks to advances in neural network architecture we now have the tools for
    extraction of high-level information from images.


    We begin with an opening chapter on the evolution of machine learning, including
    both a historical perspective and some thoughts as to its future. The next four
    chapters provide the underlying framework of machine learning with special attention
    to deep learning and AI, building from the simple to the complex. Although quite
    detailed and intensive, these require no knowledge of computer programming or
    of mathematical formalism. Wherever possible, concepts are illustrated by examples
    from pathology. The next two chapters deal with the integration of AI with digital
    pathology and its application not only for classification, prediction, and inference
    but also for the manipulation of the images themselves for extraction of meaningful
    information not readily accessible to the unaided eye. Following this is a chapter
    on precision medicine in digital pathology that demonstrates the power of traditional
    machine learning paradigms as well as deep learning, The reader will find a certain
    amount of overlap in these chapters for the following reasons; each author needs
    to review some basic aspects of AI as they specifically relate to his or her assigned
    topic, each presents their own perspective on the underpinnings of the work they
    describe, and each topic considered can best be understood in the light of parallel
    work in other areas. The next two chapters deal with two important topics relating
    to cancer in which the authors utilize AI to great effect and discuss their findings
    in the context of studies in other laboratories. Taken together, these latter
    chapters provide complementary views of the current state of the art based upon
    different perspectives and priorities.


    The book concludes with an overview that puts all this in perspective and makes
    the argument that AI does not replace us, but rather serves as a digital assistant.
    While it is still too early to determine the final direction in which pathology
    will evolve, it is not too early to recognize that it will grow well beyond its
    current capabilities and will do so with the aid of AI. However, until “general
    AI” is attained that can fully simulate conscious thought (which may never happen),
    biological brains will remain indispensable. Thus, for the foreseeable future,
    human pathologists will not be obsolete. Instead, the partnership between artificial
    and natural intelligence will continue to expand to form a true partnership. The
    machine will'
