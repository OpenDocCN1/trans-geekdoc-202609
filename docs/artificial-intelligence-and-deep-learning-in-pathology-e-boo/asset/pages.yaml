- pgno: 248
  md: 'noted that the things that computers do well are often the tasks where humans
    are weak and that the converse is also true. This concept caused Kasparov to ask
    whether the goal of computational chess play was to pit man against computer or
    rather was it to play the highest level of chess possible as a partnership of
    man and machine? Kasparov went on to observe a chess playing experiment in which
    the types of machine–human pairings varied. He saw that a weak human player paired
    with a machine with a better process was superior to a strong computer alone,
    and remarkably, also superior to a strong human player working with a machine
    which had an inferior process.


    In the evolving world of computational pathology, the fear of artificial machine
    diagnostic intelligence displacing HI must be balanced with the opportunity of
    providing patients with more precise and accurate diagnostic, prognostic, and
    theranostic statements. What if, as in Kasparov’s chess playing experience, that
    in computational pathology, a partnership of weak human diagnosticians + machines
    + better processes were better than strong human diagnosticians + machines + worse
    processes? The field of computational pathology would be immeasurably extended
    in its global availability and somewhat more democratized in its practice. The
    key to next generation diagnostics may, in fact, be getting machines and humans
    to interact using the best processes. I would opine that this system approach
    is native to the practice of pathology and laboratory medicine and that our specialty
    is the best positioned in all of medicine to explore the AI revolution by developing
    robust HI–AI partnerships in the domains of diagnostics, prognostics, and theranostics.
    Dr. Scott Doyle a computational pathology investigator at the University at Buffalo,
    State University of New York opines that “The true value of human diagnosticians
    is not that they are valuable because of their ability to do poorly what artificial
    intelligence robots can do easily. In fact, they are valuable because of all the
    things they can do that robots cannot do such as disparate data integration, ingenuity,
    serendipity, learning, experimentation, and value judgments. These are all central
    parts of the practice of pathology and laboratory medicine. In the end pathologists
    should/will focus on these things and leave the robotic tasks to the robots” (unpublished
    communication).


    # Human transparent machine learning approaches


    Human transparent machine learning systems seek to have humans understand AI cognition.
    This means that humans must be able to understand the dynamics of the machine
    learning system. In human transparent machine learning, the machine learning system
    may have human-like sensing inputs. Most importantly, humans are able to trust
    the AI output of human transparent learning systems. In the computational pathology
    domain, this means that the outputs of machine learning systems must be vetted
    against the big 360° view of the complete clinical context. In this construct,
    the digital assistance which results from any computational pathology systems
    is used only after cross referencing them with all of the meaning understood'
