- pgno: 176
  md: 'greatest similarity to a new example under consideration can be brought up.
    With support vector–based methods, the closest examples (in a kernel sense) or
    the support vectors which define class boundaries can be similarly used to gain
    insight into what was learned and how a decision was made. With random forests,
    a well-known method of substituting features with dummy features can be used to
    quantify which features are the most important ones in decision-making and “sanity
    checked” by an expert. This process can be not only confirmatory but can also
    lead to novel clinical insight. While explainability has for a long time been
    seen as a potential disadvantage (cf. with human memory and brain: can one localize
    where the concept of “cake” is stored?) of deep learning–based approaches, which
    used to be seen as proverbial “black boxes,” recent years have seen huge strides
    of progress in this area [57]. For example, looking at which neurons in a network
    fire together (cf. the mantra of biological reinforcement learning “what fires
    together wires together”) can be insightful. A higher (semantic) level of insight
    can be gained by looking at different layers and visualizing features learned—typically
    layers closer to input tend to learn simple, low-level appearance elements, which
    are then combined to compose more complex visual patterns downstream [58]. Another
    ingenious technique involves so-called “occlusion” whereby parts of an input image
    are occluded by a uniform pattern (thus effecting localized information loss)
    and quantifying the impact such occlusion has on the decision—the greater the
    impact, the greater the importance of a particular image locus [59].


    The issues of repeatability and reproducibility have gained much prominence in
    academic circles, and wider, in recent years. The difference between the two concepts
    has been convincingly highlighted and discussed by Drummond [60], but this nuance
    does not appear to have penetrated regulatory processes as of yet. In particular,
    the practical impossibility of perfect reproducibility of experimental outcomes
    for some machine learning algorithms poses a major obstacle in their adoption
    in clinical practice due to the stochastic nature of their operation. We have
    already alluded to this in the previous section in our overview of random forests.
    In particular, even if the same training data are used and the same manner of
    training employed, the parameters of a trained random forest or neural network
    will differ from instance to instance. This is an inherent consequence of the
    stochastic elements of their training processes and is something that does not
    sit comfortably with some. While this sentiment is not difficult to relate to,
    it does illustrate what can be argued to be an inconsistency in how human and
    machine expertize are treated. In particular, the former has been shown to exhibit
    major interpersonal variability (two different, competent, and experienced pathologists
    arriving at different conclusions from the same data), as well as intrapersonal
    one (e.g., depending on the degree of fatigue, time of day, whether the decision
    is made in the anteprandial or postprandial period, etc.). This kind of double
    standard is consistent with a broad range of studies involving human-human and
    human-machine interaction and is neurologically well understood, with the two
    types of engagement differently engaging important brain circuitry such as the
    ventromedial prefrontal cortex and the amygdala [61]. Generalizability is a concept
    that pervades machine learning. It refers to the ability of an algorithm to learn
    from training data'
