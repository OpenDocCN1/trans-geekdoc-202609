  img_proc: true
- pgno: 128
  md: 'microscopy problems can be reformulated as segmentation problems. More importantly,
    the most common deep learning architecture for segmentation, U-nets, is often
    utilized for image enhancement tasks, as we will see later.


    # Image translation and style transfer


    Image translation refers to the conversion of one image representation to another
    image representation. The goal is to learn the transformation between the input
    and output images. This can be applied to a wide variety of applications, such
    as converting between night and day images, winter and summer images, or more
    useful tasks like converting satellite images to maps. In computational pathology,
    image-to-image translation has been explored for stain color normalization (Section
    Stain color normalization) and for converting between different image modalities
    (Section Mode switching). The most common models used for image translation tasks
    are generative adversarial networks or their variants (Section Generative adversarial
    networks and their variants). Most model architectures for image translation tasks
    require paired-image datasets. However, in some cases, obtaining paired datasets
    may be difficult or even impossible. For example, when converting between image
    modalities, it may be impossible to obtain pixel-scale paired images using different
    image modalities. Therefore, models like CycleGANs (Section Generative adversarial
    networks and their variants) have been developed to solve the problem of unpaired
    image-to-image translation.


    Another task related to that is style transfer [8,9]. Style transfer focuses on
    transferring the style of a single reference image to the content of the input
    image in order to generate an output image. Style transfer can be thought of as
    a single-sample version of image-to-image translation. Style transfer also has
    potential applications in computational pathology, such as for stain-color normalization,
    the task being to convert an input image to have the color gamut and structural
    color assignments that mimic a target, reference image. This is demonstrated in
    Ref. [10].


    # Commonly used deep learning methodologies


    # Convolutional neural networks


    A CNN belongs to a class of deep learning algorithms most commonly used for image
    tasks such as image classification (Fig. 7.1A). The building blocks of a CNN are
    learned convolutional kernels [11,12]. These convolutional kernels are applied
    to the image and their subsequent representations in the neural network in order
    to extract learned features. The convolutional kernels are developed during the
    training process, and updated through backpropagation. A key advantage of convolutional
    layers is their shift invariance [11]. As the convolutional kernel is applied
    over the entire image, shifts in the input shift the output in an equivalent manner.
    This is an especially useful property for microscopy. The stacking of convolutional
    layers and other layers such as fully connected layers and pooling layers are
    used to build CNNs.'
