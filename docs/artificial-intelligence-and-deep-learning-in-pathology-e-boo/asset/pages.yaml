  md: 'As will be discussed throughout this section, layering is a common theme of
    feature engineering. Starting with the segmentation outputs discussed above, a
    variety of different techniques can be layered to quantitate or characterize relationships
    as well as to normalize features for robustness. Nuclei segmentation, for example,
    followed by ellipsoid fitting can provide a high-level view of the shape and organization
    of nuclei within a region of interest, Fig. 9.11. Additionally derived features
    from the ellipsoidal representations, could include density, shape, orientation,
    and regularity, among others Fig. 9.12. Nuclear shape, texture, and orientation
    have recently been shown to be predictive of outcome in estrogen positive, lymph
    node negative breast cancer [21]. At the highest resolution, color and texture
    of nuclei successfully distinguish benign and malignant regions in colon cancer,
    as shown by Jørgensen et al. [88].


    Although raw mitotic count may be predictive in TMA cohorts, normalizing to account
    for variability in the sample volume will stabilize the feature when developing
    in larger samples and when scaling outside of the test environment. Manual grading
    schemes generally require counting mitotic figures within a specified area or
    per a specified number of tumor cells to account for volume variability from patient
    to patient [89]. This provides a standard mechanism for comparing mitotic activity
    in different subjects. Applying that concept to an automated scheme, an algorithm
    applies the same specified area to each slide either randomly or looking for the
    area of highest proliferation, analogous to the mitotic count requirement of the
    modified Bloom-Richardson grading scheme for breast cancer. Another similar relative
    measure could be achieved by combining mitotic count and nuclear count providing
    a density index that reflects a tumor’s proliferative activity.


    Characterizing the spatial distribution of epithelial cells and stromal cells
    in cancer is an evaluation primarily in the domain of computational pathology.
