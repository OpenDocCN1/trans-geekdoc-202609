  md: '# Artificial intelligence and the interplay between tumor and immunity


    Joel Haskin Saltz, MD, PhD¹, Rajarsi Gupta, MD, PhD²


    ¹Professor, Chair, Biomedical Informatics, Stony Brook University, Stony Brook,
    NY, United States; ²Assistant Professor, Biomedical Informatics, Stony Brook Medicine,
    Stony Brook, NY, United States


    # Introduction


    Over the last 20 years, digital pathology has rapidly grown and evolved alongside
    advances in immunology, cancer therapeutics, computer science, and artificial
    intelligence. During this time, there has been increased adoption of digital slide
    scanners in clinical settings and greater availability of digital whole-slide
    images (WSIs) of glass slides for a wide spectrum of clinical and research applications.
    Digital pathology, deep learning, and computational pathology have emerged as
    powerful and valuable tools in the era of precision medicine and immunotherapy.
    These technologies and computational methods can revolutionize the clinical subspecialty
    of pathology, which serves as the central hub of medicine and oncology by providing
    definitive tissue-based diagnoses that guide patient management and treatment
    selection in cancer.


    Computational image analysis of digital pathology images generates data that are
    referred to as Pathomics, which refers to the automated quantification of the
    wide spectrum of phenotypic features of tissues and cells in WSIs. Basic clinically
    relevant and interpretable Pathomics features include (1) characterization of
    phenotypically distinct architectural regions such as cancer, benign, and stromal
    connective tissue, (2) shapes and textures of nuclei, (3) classifications of cell
    type, and (4) characterization of lymphocytic infiltration. Recently, digital
    pathology tools have been developed that can quantify and characterize nuanced
    interactions between cancer and the immune system in digital WSIs of hematoxylin
    and eosin (H&E)-stained tissue samples from patients, motivated by the guidelines
    of the International Immuno-Oncology Biomarkers Working Group [1–4].


    Image analysis has been employed to study digital pathology images for many years,
    as described in excellent review articles of algorithmic methods [5–9]. Recently,
    deep learning and artificial intelligence in Pathomics has led to the development
    of computational methods that augment and empower qualitative traditional diagnostic
    histopathologic evaluation, which can substantially accelerate cancer research.
    Emerging digital pathology and deep learning applications can (1) stratify'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'patient management through data-driven insights into cancer, (2) identify relevant
    biomarkers to predict clinical outcomes and treatment response, and (3) enhance
    our collective understanding of cancer biology to motivate the utilization of
    novel therapeutic approaches [5–8,10–41]. This chapter introduces and describes
    a selected set of novel Pathomics-based deep learning methods that have been developed
    to classify and reproducibly quantify the interplay between tumor cells and the
    immune response in the tumor microenvironment.


    # Immune surveillance and immunotherapy


    The human immune system is typically described as the sum of the innate and adaptive
    immune systems, which function together to maintain a state of continuous surveillance
    through several different types and subtypes of immune cells. These diverse cells
    are responsible for eliminating the vast majority of infectious agents, aberrant
    cells with acquired genetic and epigenetic changes, and cancer cells through the
    recognition and processing of foreign antigens. The cells of the innate immune
    system have pattern recognition receptors that recognize non-self antigens which
    generate immediate, short-lived, and nonspecific inflammatory responses, whereas
    the cells of the adaptive immune response generate highly specific inflammatory
    responses through antibody-mediated and cell-dependent responses to provide long-lasting
    defense with the capacity for memory [17,23,25,27].


    The innate and adaptive immune systems are hierarchical regulatory mechanisms
    that are coordinated through many different types of immune cells. These cells
    are typically divided into broader classes and cell lineages that commonly include
    B-cells, T-cells (TH1, TH2, TH17, TREG, γδ T-cells, cytotoxic T-cells, and NK/T-cells),
    neutrophils, macrophages, dendritic cells, mast cells, and NK cells [34,35,42–44].
    The major categories of cell types that exist in the tumor microenvironment (TME)
    include cytotoxic CD8+ T-cells that kill non-self and cancer cells; CD4+ helper
    T-cells that suppress or regulate immune responses through cytokine signaling;
    CD4+ regulatory T-cells (CD25+/FOXP3+ Treg) that play an important role in tolerance;
    natural killer cells (NK cells) that kill cells that are missing self MHC-I markers
    without requiring cytokine stimulation; and macrophages and dendritic cells that
    have phagocytic and antigen presenting functions [45,46]. To put the diversity
    and heterogeneity of the immune landscape into perspective, there are over 100
    different populations of immune cell types in the peripheral blood of humans that
    are characterized by the variable expression of cell surface and intracellular
    markers across the continuum of various activation and differentiation states
    [47–50].


    The dynamic complexity of the immune system and its ability to respond to diverse
    stimuli and fight cancer cells is highly unpredictable due to intrinsic differences
    in the pro-inflammatory and anti-inflammatory cell populations that vary widely
    across individuals [17,28,29,51–53]. Moreover, immune infiltrates can include
    all kinds of immune cell types in any given tumor, leading to heterogeneity'
