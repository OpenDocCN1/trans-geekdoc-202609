  md: 'passengers in the dataset have no cabin information, so it is best to simply
    eliminate this attribute. In contrast, there are only 2 empty embarked values,
    so these samples can simply be dropped. There is no information for 177 passengers.
    We can create pseudodata for these entries by finding some statistical measures.
    For example, we can impute an age based on the mean of all those who resided in
    a given passenger class or some other attribute that appears reasonable. In doing
    so, it would be helpful to look at the actual distributions involved to see whether
    they appear to fit a normal distribution. Another approach, where the data may
    not be amenable to this kind of statistical analysis, is to simply label missing
    categorical data as “missing” and missing numerical data as “0” just to meet the
    technical requirement for no missing variables. Using this technique is essentially
    allowing the algorithm to estimate the optimal value instead of just filling it
    in with the mean.


    The next step is to decide which features are likely to be useful and which are
    not. While a bit counterintuitive, keeping the entire attribute set may actually
    harm the predictive accuracy of the algorithm. Passenger ID and passenger name
    are redundant, so we can eliminate the passenger name column before imputting
    the data. However, before this step, that information might be useful in uncovering
    errors. For example, in 1912, if a male and female cabinmate had different surnames,
    not only are they unlikely to be an unmarried couple but also they were unlikely
    to be married to each other. This may simply be a listing error. However, there
    are some other possibilities, such as a grandparent–child combination or siblings
    of opposite sex (although this latter might have also have been an issue in 1912).
    This may be useful information in checking the accuracy of SibSp data, for example.
    One can also cross-check SibSp and Parch data for discrepancies. Age may give
    clues as well. A 13-year-old is unlikely to have a spouse. An 80-year-old is unlikely
    to have a parent on board. Erroneous data can be treated as missing data.


    In reducing the attribute set, it is important to look for dependencies. For example,
    fare for a given embarkation point might correlate with passenger class, and if
    so, one of these might be dropped. Cabin also is likely to correlate with fare
    and class, but this gives additional information, such as location in relation
    to deck level and proximity to stairs. These choices involve informed guesses,
    so different data scientists could wind up with different attribute subsets. For
    example, in the example used in Ref. [6], the attributes chosen were age, SibSp,
    Parch, Fare, Sex, Passenger Class, and Embarked.


    For the next step, it is important to consider the metric for each. While there
    are only two possible values for “Sex” (this is 1912) and three possible values
    for class, there are seven distinct values of SibSp and 8 distinct values for
    Parch in the dataset. There are, however, 281 distinct fares, and it is not likely
    that fine distinctions would help the model, so it possible to group the fare
    values into a smaller number of range categories.


    These examples demonstrate that raw data are merely the tip of the iceberg!'
  merge: -1
