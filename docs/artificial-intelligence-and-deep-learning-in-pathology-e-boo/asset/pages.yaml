  md: '# Feature transformation, standardization, and normalization


    As data are either numeric or coded in numeric form for input to a computer, it
    may be important for each attribute to fall into a similar numeric range, so that
    one feature does not contribute disproportionately. Normalization usually refers
    to scaling a variable to have a value between zero and one. Standardization, on
    the other hand, usually means rescaling the database to a mean of zero and a standard
    deviation of 1 [7]. Proper scaling can often lead to a boost in algorithmic accuracy
    even after all its hyperparameters are optimally tuned.


    # Feature engineering


    Feature engineering is the process of using domain knowledge of the data to create
    features that optimize machine learning algorithms that use those features as
    input. In other words, feature engineering is about creating new input features
    from existing ones. This improves computation efficiency and, in some cases, accuracy
    by reducing the feature set to a more manageable size. It makes use of your domain
    expertise. The simplest form of feature engineering is to combine features. For
    example, if two attributes are “weight” and “volume,” and absolute size is not
    necessary, then the single value “density” may be more appropriate. If some of
    the attributes are not well-represented in the dataset, it may be possible to
    combine them. In the vehicle example in the previous section, we might combine
    data on “acceleration” and “roadholding” into a single variable “performance.”
    This may sometimes be helpful for sparse classes as well, for example, the category
    of non–small cell lung carcinoma, instead of separating these into individual
    morphologic variants. Finally, categorical or text values may be replaced by binary
    variables. Brick, wood, vinyl, and stone may be able to be replaced by “brick”
    and “nonbrick” or zero and one, respectively. Many of these techniques lead to
    dimensional reduction. In the next section, we will describe some formal, mathematically
    based techniques for data reduction.


    The most sophisticated form of feature engineering is the creation of new relevant
    features rather than merely combination or replacement. Features useful for face
    recognition include distances between various facial features, overall size and
    shape, and so on. All these are quantifiable and become a feature set rather than
    the raw pixels of the image. Similarly, there are mathematical techniques such
    as Hough transforms and “blob” analysis that allow the quantification of density
    contrasts and the detection of edges. These can also be used to create additional
    features. All these steps involve transforming the data. The use of the data in
    a machine learning algorithm is merely the final (although admittedly the most
    sophisticated and mathematically intensive) step. This process is illustrated
    in Fig. 5.2.


    The power of deep learning systems such as neural networks is that they can implicitly
    learn to do feature engineering all on their own. The algorithms can automatically
    create higher level features from the raw input. The more representation'
