    Methods for slide-free histology including (A) microscopy with ultraviolet surface
    excitation, (B) light sheet microscopy, and (C) stimulated Raman histology (SRH),
    all of which can be performed on minimally processed or unprocessed tissue to
    generate diagnostic histologic images without the need for the resources of a
    conventional pathology lab. Each technique relies on optical, rather than physical
    sectioning of imaged tissue, simplifying the workflow required to generate a diagnostic
    histologic image. SRH has unique value as a modality for bedside histology as
    no staining, clearing, or handling of the tissue is required to generate a histological
    image. In SRH, fresh specimens can be placed into an imager at bedside which rapidly
    creates a virtual H&E microscopic image through relatively simple spectral band
    combination and recoloring. To this end, academic-industrial partnership has resulted
    in the first FDA-registered imager, now employed in several operating rooms across
    the United States.


