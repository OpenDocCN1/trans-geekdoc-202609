- pgno: 143
  md: '# Super-resolution, extended depth-of-field, and denoising


    In order to generate high-quality WSIs, it has been necessary to use high-numerical-aperture
    lenses that can capture high-resolution images. The downside is that these lenses
    have restricted fields of view, which greatly increases the scanning time, as
    well as shallow depths of field (Fig. 7.5A). While used increasingly for improving
    the resolution of standard (macro) photography images [19], the application of
    deep learning methods to increase the resolution of microscope images is quite
    recent. Wang et al. [44] used a training set consisting of pixel-matched images
    taken with a 10×/0.4 NA lens paired with images taken with a 20×/0.75 NA lens.
    The use of paired data forces the GAN to concentrate on improving the resolution
    of the image and confers high-quality transformations with little artifacts or
    errors


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_143_0.png)


    # FIGURE 7.5


    (A) In traditional microscopy, there are key trade-offs between exposure, resolution,
    and speed. However, application of deep learning can augment this design space
    and diminish these trade-offs. (B) A GAN-based approach was successfully applied
    to convert diffraction-limited fluorescence images to super-resolved images. (C)
    A U-net architecture was successfully utilized for image denoising of fluorescent
    microscopy images. (D) Even with grayscale cameras, deep learning can be used
    to determine the color of emitters, as the point spread function is determined
    by the wavelength. GAN, generative adversarial network.


    (A) Adapted with permission from Weigert M, et al., Content-aware image restoration:
    pushing the limits of fluorescence microscopy. Nature Methods 2018;15(12):1090–1097.
    https://doi.org/10.1038/s41592-018-0216-7; (B) Adapted with permission from Wang
    H, et al., Deep learning enables cross-modality super-resolution in fluorescence
    microscopy. Nature Methods 2019;16(1):103–110. https://doi.org/10.1038/s41592-018-0239-0;
    (C) Adapted with permission from Weigert M, et al., Content-aware image restoration:
    pushing the limits of fluorescence microscopy. Nature Methods 2018;15(12):1090–1097.
    https://doi.org/10.1038/s41592-018-0216-7; (D) Adapted with permission from Hershko
    E, Weiss LE, Michaeli T, Shechtman Y, Multicolor localization microscopy and point-spread-function
    engineering by deep learning. Optics Express 2019;27(5):6158–6183. https://doi.org/10.1364/OE.27.006158.'
