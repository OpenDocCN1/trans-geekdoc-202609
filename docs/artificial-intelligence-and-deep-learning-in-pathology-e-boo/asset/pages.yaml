  md: 'some information contained within it which would allow it to make good decisions
    on previously unseen input, often seemingly rather different from anything seen
    in the training stage. The issue of generalizability underlies the tasks of data
    representation, problem abstraction, mathematical modeling of learning, etc. Herein
    we are referring to generalizability in a very specific context. Namely, a major
    challenge in the practice of pathology concerns different protocols and conditions
    in which data are acquired. Put simply, the question being asked is what performance
    can I expect to see from an algorithm evaluated using data a technician acquired
    using particular equipment on one cohort of patients in a specific lab, when it
    is applied on data acquired by a different technician in a different lab from
    a different cohort. It can be readily seen that slight changes in the data acquisition
    (such as the duration of exposure to a dye), different physical characteristics
    of lab instruments, or indeed different demographics of patients all pose reasonable
    grounds for concern. Indeed, at present, most of the work in digital pathology
    is rather limited in this regard, in no small part due to the variety of obstacles
    in data sharing: there are issues of ethics and privacy, as well as financial
    interests at stake.


