  img_proc: true
- pgno: 147
  md: 'distance from the operating table, creating a logistic barrier for surgeons
    interested in viewing slides with the pathologists. Moreover, the process for
    creating high-quality pathology slides is time- and labor-intensive. Consequently,
    pathologists will call into an OR with a diagnosis 30–45 min after a specimen
    is collected. The inefficiency of this process isolates surgeons from histologic
    data and limits the way it can be used to inform surgical decision-making.


    Given the challenges in the modern neuropathology workflow, AI holds great promise
    in a number of regards: (1) verifying that lesional tissue has been collected,
    (2) assisting in tissue diagnosis, (3) helping to define surgical endpoints in
    tumors without gross boundaries, and (4) in the future, predicting actionable
    and diagnostic molecular markers. In fixed tissue, AI has been applied to classification
    of epithelial versus stromal regions in breast and colon cancer [57], differentiating
    necrotic and nonnecrotic regions [58], and differentiating high- and low-grade
    gliomas [59]. That said, the application of AI for assisting in diagnosis only
    addresses the challenges associated with establishing diagnosis in neuropathology.
    With conventional histologic workflows, many of the barriers related to tissue
    transport and processing remain. To fully leverage the opportunity created by
    rapid advances in AI-assisted pathologic diagnosis, marriage with a technique
    for rapid histology is essential.


    # Approaches to rapid histology interpretations


    To this end, several methods for slide-free histology have been proposed and validated
    to varying degrees. MUSE, stimulated Raman histology (SRH), and light-sheet microscopy
    are among the most promising tools for imaging unprocessed or minimally processed
    biological specimens (Fig. 7.6).


    While numerous techniques for slide-free histology have been proposed, only SRH
    has been incorporated into an AI-based diagnostic pipeline validated for brain
    tumor diagnosis in a clinical setting. Hollon et al. adapted the Inception-V2
    CNN to diagnose the 10 most common brain tumors using SRH images and deployed
    their software on a bedside SRH imager. In a head-to-head clinical trial of 278
    patients, Hollon et al. demonstrated that an autonomous diagnostic pathway utilizing
    SRH and a CNN could predict diagnosis with performance that was noninferior to
    board-certified neuropathologists interpreting conventional histologic slides
    in the same patients [61]. The accuracy of both arms was approximately 94% and
    interestingly the errors in both arms were entirely nonoverlapping (Fig. 7.7).
    The authors of this study therefore conclude that the SRH + CNN pathway can be
    used as a standalone method for brain tumor diagnosis when pathology resources
    are unavailable and as a method to improve diagnostic accuracy in neuropathology,
    even in well-staffed centers. Although the authors limited trial inclusion to
    common types of brain tumors, they also offered a means of differentiating common
    and unusual histologic classes in an effort to make their system universal to
    application in all central nervous system neoplasms. The algorithm was also used
    to develop a semantic segmentation tool capable of depicting the areas of a histologic
    image most likely to contain lesional tissue (Fig. 7.8). The authors also conclude
    that given the features'
