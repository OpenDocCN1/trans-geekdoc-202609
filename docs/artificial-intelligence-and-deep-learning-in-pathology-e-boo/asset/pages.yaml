- pgno: 219
  md: 'of the immune landscape across the wide spectrum of different types of cancer,
    which results in the high variability and diversity of immune cell populations
    in patients [17,31,33–35,44,54]. Cancer cells evade immune-mediated recognition
    and elimination through immunosuppressive strategies that disrupt T-cell signaling
    and induce tolerance in the TME through the production of inhibitory cytokines
    that prevent the expansion and activation of CD4+ helper and cytotoxic CD8+ T-cells
    [30,37–39].


    The suppression and inactivation of immune detection and immune-mediated cytotoxicity
    is also accompanied by the ability of cancer cells to actively reprogram immune
    cells in order to stimulate angiogenesis and accompanying stromal responses that
    promote the progression of disease through the continued survival of cancer cells.
    The subversion of normal immunoregulatory mechanisms also leads to the emergence
    of subsets of tumor cells that are less immunogenic and resistant to apoptosis
    within the immunosuppressed milieu of the tumor microenvironment. This selection
    pressure enables cancer cells to adapt and further evade the immune system through
    the loss of tumor antigens that would normally stimulate complement-mediated and
    antibody-dependent cell-mediated cytotoxicity from T-cells and natural killer
    (NK) cells [17,28–39]. The combination of the uncontrolled proliferation and adaptation
    of cancer cells in the immunosuppressed tumor microenvironment ultimately results
    in the invasion of neighboring tissues and distant sites beyond the primary site
    of origin.


    The importance of the role of immunity in controlling cancer was observed a century
    ago by Dr. William Coley in a case of complete remission in advanced inoperable
    sarcoma secondary to severe Streptococcus pyogenes bacterial skin infections [55].
    Thus, the concept of stimulating and inhibiting hierarchical immunoregulatory
    mechanisms of the immune surveillance system as a feasible treatment strategy
    for cancer was born decades ago [56–58]. Since then, many studies have focused
    on specific types of immune cell populations and their various functional properties
    in order to determine the clinical significance of pro-inflammatory and anti-inflammatory
    temporospatial relationships in numerous types of human disease, including cancer
    [17,28–30,32,44,52,53,59–65]. During the process of uncontrolled growth in cancer,
    nuanced differences in protein structure of foreign antigens in infected, aberrant,
    or tumor cells are detected at the molecular level during antigen processing and
    processed by the innate and adaptive immune system to coordinate and targeted
    immune-mediated response. However, the immune system is highly complex and consists
    of many types and subtypes of immune cells to fight infections and remove aberrant
    cells, which results in a dynamic interplay between pro-inflammatory and anti-inflammatory
    functional states that are regulated through cytokine cell signaling and direct
    interactions between immune cells to generate systemic immune responses to fight
    cancer.


    Despite the intrinsic functional complexities and widely variable composition
    of the immune system, we are fortunate as a society to have access to first-generation
    immunotherapeutic options in our current day and age that have been utilized to
    successfully treat cancer and provide tangible clinical benefits. Currently, available'
