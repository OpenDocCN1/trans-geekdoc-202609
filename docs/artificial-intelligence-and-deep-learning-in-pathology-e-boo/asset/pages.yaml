    $$\frac{1}{\sigma\sqrt{2\pi}} e^{-\frac{1}{2\sigma^2} \mathbf{w}^T \mathbf{w}},\quad
    8.4$$


    which can be restated as the minimization of the following regularized negative
    log-likelihood:


    $$\mathcal{L} = C \sum_{i=1}^{2} \log\left(1 + e^{-y_i \mathbf{w}^T \mathbf{x}_i}\right)
    + \mathbf{w}^T \mathbf{w}.\quad 8.5$$


    A coordinate descent approach, such as the one described by Yu et al. [25], can
    be used to minimize L.


    # Support vector—based methods


    Support vector machines perform classification by constructing a series of class
    separating hyperplanes in a high-dimensional (potentially infinitely dimensional)
    space into which the original input data are mapped [26]. For comprehensive detail
    of this regression technique, the reader is referred to the original work by Vapnik
    [27]; herein we present a summary of the key ideas.


    In the context of support vector machines, the seemingly intractable task of mapping
    data into a very high-dimensional space is achieved efficiently by performing
    the aforesaid mapping implicitly, rather than explicitly. This is done by employing
    the so-called kernel trick which ensures that dot products in the high-dimensional
    space are readily computed using the variables in the original space. Given labeled
    training data (input vectors and the associated labels) in the form {(x1, y1),
    ..., (xn, yn)}, a support vector machine aims to find a mapping which minimizes
    the number of misclassified training instances, in a regularized fashion. As mentioned
    earlier, an implicit mapping of input data x → Φ(x) is performed by employing
    a Mercer-admissible kernel [28] k(xi, xj) which allows for the dot products between
    mapped data to be computed in the input space: Φ(xi)·Φ(xj) = k(xi, xj). The classification
    vector in the transformed, high-dimensional space of the form


    $$w = \sum_{i=1}^{n} c_i y_i \Phi(x_i)\quad 8.6$$


    is sought by minimizing


    $$\sum_{i=1}^{n} c_i - \frac{1}{2} \sum_{i=1}^{n} \sum_{j=1}^{n} y_i c_i k(x_i,x_j)
    y_j c_j\quad 8.7$$'
