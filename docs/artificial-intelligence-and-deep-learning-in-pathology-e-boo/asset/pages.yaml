  md: 'these models perform poorly because of the complexity of the data. The human
    brain is very good at this because it makes use of a series of processing levels
    or “layers”, each one doing a more complex analysis than the previous one. Deep
    learning computational approaches patterned on the brain deal with this issue
    very well. Although not the only form of deep learning, neural network–based models
    are the ones most currently employed at present.


    As we shall see, ANNs develop increasingly complex internal representations of
    the data, and in the process automatically extract the relevant salient feature
    vectors of the dataset. In this chapter we will cover the basics of fully connected
    and convolutional networks. More advanced architectures will be covered in the
    next chapter. The aim is to present the inner workings of ANNs in detail (the
    second-floor view), rather than merely providing the descriptive 30,000 feet overview
    that appears in most of the medical literature, while avoiding the underlying
    mathematics and programming details that become apparent at ground level. There
    is only one equation in the entire exposition, and it is easily derived. It should
    be noted that there are many other deep learning algorithms that are not based
    on connected layers in linear sequences such as those described here (for example,
    Boltzmann machines). As these have only rarely been employed in pathology applications,
    they will not be covered here.


    In the examples provided, the emphasis will be placed on image interpretation,
    but the principles can also be applied to genomics and expression arrays, as well
    as natural language processing. Natural language processing and semantic understanding
    are not covered; at the current state-of-the-art programs such as IBM’s Watson
    and similar efforts have proven disappointing in the clinical setting. The focus
    will be entirely on supervised models. Just as there are shallow network models
    for unsupervised learning, there are a number of unsupervised deep learning strategies,
    and some of these will be covered in later chapters.


    # Neuroscience 101


    As indicated above, models for deep learning are (very) loosely based upon the
    neural network architecture of the mammalian brain and how the neurons within
    the networks comprising the brain process signals both inside the neuron and from
    one neuron to another. The first mammalian neural nets came into being about 200
    million years ago. Through a process of “continuous performance improvement,”
    we now have the cellular structure shown in Fig. 2.8.


    The neuron receives signals at its dendritic end, usually from multiple other
    neurons. Those signals are integrated within the cell, and if they rise past a
    threshold value, they are passed through the axon as an action potential. Signals
    are propagated via electrical pulses or spikes generated via the modulation of
    ion channels at the cell membrane and are transduced across the synapses that
    separate the neurons via electrochemical reactions involving a variety of chemical
    mediators. Each action potential is a simple on-off burst of electrical energy.
    The only exception is'
