- pgno: 194
  md: 'The same issues that make mitotic figures difficult to reproducibly count manually
    are the same that make them challenging to detect automatically, namely that they
    are relatively rare events, heterogeneously distributed, morphologically diverse,
    and with a number of nonmitotic objects that share similar properties. Cells undergoing
    cell division can be visually recognized at a number of morphologically different
    stages—some, in the middle and later stages of the cycle, easier to identify than
    the earlier stages. Even in the later stages the morphologic variability is quite
    pronounced and the difference between mitotic objects and nonmitotic mimics can
    be as subtle as boundary fuzziness. Deep learning with large datasets is well
    suited for these types of subtle morphologic distinctions. One aspect of mitotic
    figure detection that is challenging for deep learning is that of class imbalance
    between mitotic figures, nonmitotic background objects such as regular nuclei
    and lymphocytes, and mimics such as apoptotic cells. This is generally handled
    by oversampling the mitotic figure class or by adjusting the loss function for
    training to account for the lower sample count. Ciresan et al. [65] developed
    a CNN approach for mitotic figure detection that is trained on image patches.
    Training of the neural network included enrichment of the limited mitotic training
    data by generating rotated and flipped versions of the images. These additional
    training examples helped alleviate the class imbalance issue and resulted in a
    robust network that had the best performance in the Assessment of Mitosis Detection
    Algorithms 2013 (AMIDA13) challenge [66]. Chen et al. [67] proposed the use of
    a cascade of two CNNs. The first network generating a coarse classification of
    objects that are likely to be mitosis and may include other similar structures,
    and a second network performing finer discrimination and verification to determine
    the final mitotic figure classification. Their approach utilized a specialized
    network that analyzed subtle patterns in images to reduce false-positive identifications.
    Albarqouni et al. [68] utilized data obtained from untrained annotators (crowds)
    in a CNN that contains an aggregation layer. Crowdsourcing provides enrichment
    of training data for mitosis, with noise handled using an explicit data aggregation
    step in training.


    # Ring segmentation


    Gland structures, in general, are three-dimensional objects composed of tubules
    of varying width and length, with rounded ends, connected in a branching structure
    at lower grades, or forming an interconnected network at higher grades. Confocal
    microscopy of prostate samples in Ref. [69] and stacked histology slices in Ref.
    [70] show how the 3D geometry of glands relates to patterns in 2D histology. In
    the fragmented pattern of prostate cancer, illustrated with increasing grade on
    the right descending side of the Gleason diagram [71], tubules wrapped in stroma
    shrink down to small clusters and single cells, and central lumens disappear.
    In the cribriform and solid patterns, on the left descending side of the diagram,
    tubules are fused together without intervening stroma, as lumen size and frequency
    decreases. The morphogenesis from low grade to high grade, suggested by the Gleason
    diagram, is confirmed by 3D studies of gland structure to be a process of continuous
    growth along these two axes of variation.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'There are a number of patterns that lumen, epithelium, and stroma can take
    in relation to one another. These patterns can be seen in many different kinds
    of cancer, with the frequency of occurrence and prognostic significance varying
    by organ. The cribriform pattern in breast, prostate, colon, lung, and other organs
    is discussed in Ref. [72]. From an engineering point of view, it is useful to
    identify organ-specific gland morphologic tendencies and their prognostic implications,
    to design segmentation strategies and features that correlate with the underlying
    biological processes, and so lead to accurate characterization of tumor differentiation.


    This motivates the segmentation of gland rings, which we define as complete or
    fragmented tubules, appearing either as a ring of epithelial nuclei surrounding
    a gland lumen, or as a gland fragment with a few epithelial nuclei surrounded
    by stroma [73]. By looking at the adjacency between rings, stromal, and lumen
    regions, an algorithm can detect and evaluate these patterns across all grades
    of cancer.


    Our ring segmentation algorithm works by forming a compact triangulation of epithelial
    nuclei centers, known as the Delaunay triangulation (characterized by the property
    that the interior of each triangle’s circumcircle contains no other vertices).
    The algorithm then clusters the triangles across epithelial and lumen regions,
    to form broad areas separated by relatively short edges between ring nuclei, as
    shown in Fig. 9.9. This algorithm was originally developed based on IF epithelial
    and nuclear segmentation and has been validated as part of a clinical test [17]
    for risk stratification of prostate cancer patients. With the advent of accurate
    deep learning segmentations, rings and ring features can be applied to H&E images
    also with similar results, Fig. 9.14.


    Few existing algorithms make the distinction between epithelial and gland ring
    segmentation, focusing instead on lower grade presentations with one ring of closely
    spaced nuclei per epithelial unit, surrounding a clear lumen, e.g., Ref. [74].
    These algorithms use nuclei as a guide for region-growing, starting from the lumen,
    an approach which can work well for the colon, less so for prostate and breast
    glands which tend to have a greater frequency of fragmentation and fusion. A notable
    exception is Ref. [75], which searches for polygonal gland rings using a randomized
    Markov Chain Monte Carlo approach, based upon approximate gland and nuclei maps.
    But this algorithm too does not generalize to handle the continuum of presentations
    between low- and high-grade cancers.


