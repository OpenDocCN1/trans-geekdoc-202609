- pgno: 93
  md: 'variance and “eigenvalues.” As shown below, the eigenvalues are calculated
    from a covariance matrix in PCA, the eigenvalues represent variance, and so the
    terms can be used interchangeability for graphical analysis. Most scree plots
    have a point of inflection, and when this occurs, it defines the cutoff for discussing
    later components. In Fig. 5.5, we would keep the first three components and discard
    the rest.


    This is a very oversimplified explanation of PCA. To understand the actual implementation
    of PCA, a bit of mathematical detail is necessary [9]. What we are actually doing
    is using linear algebra to transform a feature set into a new set based on variance.
    We do this by finding linear combinations of variables that best explain the covariance
    structure of the variables. We implement this task by first constructing a covariance
    matrix from the raw data matrix (in some applications, a correlation matrix is
    used; for the purposes of this discussion, we can ignore this distinction). A
    covariance matrix is a matrix whose element in the i,j position is the covariance
    between the ith and jth elements of the original vector. The eigenvalues and eigenvectors
    of this matrix are then calculated. Eigenvectors are vectors that describe a fixed
    direction under a given linear transformation and eigenvalues are scaling factors
    for these vectors. The most intuitive explanation, I have come across, is that
    the eigenvalues of a linear mapping provide a measure of the distortion induced
    by the transformation and the eigenvectors tell you how the distortion is oriented.
    In PCA, the matrix is constructed in terms of covariances in the original data,
    and so the eigenvalues represent variances along the directions (eigenvectors)
    of the principal components. In other words, the size of the eigenvalues provides
    information as to how much each contributes to the overall behavior of the original
    data. The eigenvector associated with largest eigenvalue is the first principal
    component, and so on. Thus, the size of the eigenvalue provides information as
    to how much that eigenvalue contributes to the overall behavior of the original
    data. The final step is to write the feature vector for each data point in terms
    of the sum of the principal components.


    Dimensional reduction comes from discarding the principle components with the
    smallest eigenvalues. For this reason, a scree plot of variances, such as the
    one that was shown in Fig. 5.5, is usually shown as a curve in which the eigenvalues
    are plotted against principal component number rather than of contribution to
    variance versus component number. These two terms represent the same thing. To
    put this in concrete terms, for the ellipsoid in a previous example, when we discard
    the direction of flatness, we do so according to the above calculations. The scree
    plot would have shown how little information was lost in going from a 3D to 2D
    representation.


    PCA is a powerful statistical technique that predates machine learning. It has
    turned out to be useful in virtually all forms of machine learning. Not only does
    PCA reduce the curse of dimensionality by stripping out less important features
    in the data, but also it provides a means by which the data can be better visualized
    in graphical form, as it is usually hard to represent more than three or four
    dimensions. PCA is not the only technique for doing this. Some others are embedding
    single value decomposition, linear discriminant analysis, and factor analysis.
    There are also nonlinear dimensionality reduction methods. These are based on
    the concept of'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'a manifold. A manifold is a topological space that locally resembles flat Euclidean
    space near each point. For example, if you think of a linear space as a flat sheet
    of paper, then a rolled-up sheet of paper is a nonlinear manifold, as each point
    has a small region near it that is linear. Some nonlinear reduction methods include
    multidimensional scaling, isometric feature mapping, local linear embedding, and
    spectral embedding, among others. There are also probabilistic approaches for
    nonlinear reduction such as t-distributed stochastic neighbor embedding. This
    technique computes the probability that pairs of data points in the high-dimensional
    space are related and then finds a low-dimensional embedding that produces a similar
    distribution. Although beyond the range of this discussion, a good summary can
    be found in Ref. [9].


    # Dimensional reduction in deep learning


    Neural network–based algorithms provide many ways of performing unsupervised dimensionality
    reduction. Recall that within the neural network, a representation of the details
    is developed at increasing levels of complexity. Each of the derived features
    of the representation is built up from many original features in the dataset and
    therefore is of lower dimensionality. A convolutional neural network is a good
    example. The initial feature set may consist of millions of pixels. The convolutional
    and max pooling layers reduce this to a small number of features that encode the
    important data in the image. Other ways of generating such representations include
    autoencoders and generative adversarial networks, as described in Chapter 4. There
    is an interesting connection between autoencoders and PCA. Autoencoders develop
    a dimensionally reduced encoding (representation) of the input data by compressing
    it via convolution and then confirming its accuracy by deconvoluting it and comparing
    the result to the original input. Although this seems to bear no relationship
    to PCA, it turns out that if we were to run the data through an autoencoder without
    internal activation functions, then the mathematics of the resulting network is
    the same as running it through a PCA algorithm. However, if we include activation
    functions in the autoencoder, as is typically the case, then the system becomes
    much more powerful than PCA [10].


    # Imperfect class separation in the training set


    In the above discussion and throughout the book, we have assumed the existence
    of a labeled training set in which the class of each instance in the dataset is
    accurately known and distinct from each other. However, there is sometimes a spillover
    in that one class is contaminated by a small but unknown number of samples from
    another either because of imperfect annotation or because of errors in constructing
    the training set. Fortunately, there are some sophisticated ways of dealing with
    this. The simplest case is the situation of training a binary classifier to reliably
    separate a'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'positive and a negative class, for example, cancer versus normal. Here, we
    consider the situation in which the positive set is known, but the negative set
    is unknown in that it contains both positive and negative examples. In other words,
    we have to isolate a set of so-called “reliable negatives” for training purposes.
    Techniques for doing this are known as PU (positive-unlabeled) learning algorithms.
    The trick is to begin by treating all the negatives as truly negative and train
    the classifier. Next, using the classifier, score the unknown class and eliminate
    those for whom the classification is least reliable. Retrain with the positives
    against that truncated negative set, and repeat as necessary until some stopping
    condition is met [11,12]. Another approach involves bagging the unknown into distinct
    subsets and evaluating each subset for training [13].


    In problems such as this, we assume that the positive set is large enough for
    effective training. However, often the available positive set is smaller than
    the negative set, and ways of dealing with this such as the creation of synthetic
    data have been discussed in previous chapters. It is interesting to note that
    PU learning itself can be used for classification problems, where there is only
    a small positive training set available. This involves augmenting the set of labeled
    positive examples with a set of unlabeled samples that includes both positive
    and negative examples. In the example of PU learning described above, we assume
    a sufficiently large set of positive training examples and that the positive samples
    were drawn from the same distribution as the contaminating positives in the negative
    set. In this new scenario, in addition to finding a set of reliable negatives,
    we wish to identify reliable positives hidden within the negative set. An interesting
    variant of PU using this strategy is known as “learning from probabilistically
    labeled positives” (LPLP). LPLP has been described for document classification
    [14] but has obvious applications for image interpretation as well.


    # Fairness and bias in machine learning


    There are two kinds of bias in machine learning: coding or model bias and data
    bias. Coding bias is important for understanding the validity of a given algorithm
    for the problem it is addressing, but it is not analogous to human forms of bias.
    Instead, it refers to assumptions made in constructing the model. For example,
    in the K-means clustering model, it is assumed that the clusters are of similar
    size and essentially globular. In naïve Bayes, it is assumed that the feature
    attributes are independent variables. In neural network backpropagation, it is
    assumed that local minima can serve as surrogates for the global minimum. Model
    bias is not a fault; it is basic to the simplifying assumptions that are made
    in constructing useable models that are computationally efficient while retaining
    the ability to provide useful and meaningful outputs. Such built-in assumptions
    are also often necessary simply to allow the problem to be solved within the current
    state of the art. In any event, it is important to understand the limitations
    of the algorithm that is being used.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Data bias is much more insidious than coding bias. Most clinicians in general,
    and pathologists in particular, will be users, rather than creators, of machine
    learning models, so minimizing coding bias may be outside our domain of expertise.
    However, we will serve as content providers and annotation experts for the training
    set data. Thus, we are the first line of defense in scrutinizing the data itself
    for unintended bias.


    We can define bias as unfair prejudice in favor or against one thing, person,
    or group compared with another. For humans, bias can be defined as a particular
    tendency, trend, inclination, feeling, or opinion, usually preconceived or unreasonable.
    Bias may be unconscious in that we may have attitudes or stereotypes without conscious
    awareness of them (implicit bias). As machines lack inclinations or opinions,
    or as far as we know, awareness, fairness in machine learning can be represented
    as the relationships between a sensitive attribute (race, gender, nationality,
    etc.) and the output of the model. In case of both human and machine, the output
    is incorrectly classified based upon an attribute that, in point of fact, has
    no causal relationship to that output. In the case of human bias, the result is
    often judgmental; in the case of the machine, it can lead to false judgments by
    humans.


    There are many ways that bias can arise in machine learning. Sample bias is where
    the data used to train the model do not accurately reflect the domain of the problem.
    For example, the data may be restricted or poorly collated, or where there may
    be a marked imbalance in the training sets. An example of the former would be
    a training set in which all cats were placed on red rugs and dogs on brown rugs.
    An unknown sample of a dog on a red rug might be classified as a cat. Another
    would be a set of head shots of men and women, where the women all had long hair.
    An unknown woman with a pixie cut might be classified as a man. Note that these
    examples do not exhibit prejudice, and they are merely wrong because of “faulty”
    assumptions about properties of a population. These are relatively harmless examples.
    However, imagine a training set for distinguishing cocker spaniels from Doberman
    pinchers, in which the spaniels were all shown biting their owners, while the
    Dobermans’ were shown cuddling. While both breeds can be docile or aggressive,
    this would paint an unfair picture of the relative temperaments of these two breeds
    and could lead to an unfair prejudice against cocker spaniels.


    Set imbalance can contribute to machine bias in a much more insidious and problematic
    way. For example, in 2015, Google developed an algorithm to identify faces as
    humans, rhesus monkeys, baboons, gorillas, and other primates. The algorithm classified
    African Americans as gorillas! This was not neo-Nazi programming but rather related
    to a limited set of African Americans in the training set and large numbers of
    Caucasian examples, as well as large numbers of the various nonhuman primates.
    Google did not do this intentionally; it worked with the images at hand and did
    not notice the imbalance in the numbers of people of different races or ethnicity
    in their database. The neural network had learned skin color as a discriminant
    between humans and apes! The obvious fix would have been to expand the database,
    but Google’s initial fix was simply to block the algorithm from identifying gorillas
    altogether.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Data bias can also lead to poor medical care on a population basis. Recently,
    Obermeyer et al. [15] examined a commercial algorithm used for healthcare decision-making
    and found that at a given risk score, black patients are considerably sicker than
    white patients. Remedying this disparity would increase the percentage of black
    patients receiving additional help from 17.7% to 56.5%. The bias was not because
    of judgmental issues but rather because of the underlying data structure. The
    algorithm used healthcare costs as a surrogate variable for degree of illness,
    on the apparently reasonable notion that the sicker you are, the more you spend
    on medical care. However, this equivalence rests on the assumption of equal access
    to healthcare. However, unequal access to healthcare and/or socioeconomic factors
    means that we spend less money caring for black patients. In this case, the fix
    is simpler; look at more appropriate measures of illness (or better still, having
    identified the societal problem, fix it).


    These results should be contrasted to another study published by the same author
    in 2003 [16]. In this study, a large bank of fictitious job resumes was created.
    He also used fictitious names such as Emily and Greg versus Lakisha and Jamal
    and assigned them randomly to these resumes. The resumes were then sent to employers
    who posted job advertisements in the media of the day. White sounding names received
    50% more callbacks for interviews than black sounding names. Applicants living
    in better neighborhoods received more callbacks, but this parameter was unaffected
    by perceived race. The amount of discrimination was uniform across occupations
    and industries. These results suggested that racial discrimination was still a
    prominent feature of the labor market in 2015.


    It is instructive to note the differences in the causes of bias in these two examples.
    In the latter, which is much more pernicious, it is presumably based on unfair
    stereotyping. In the former, it is because of an error in the choice of attribute
    (cost vs. actual illness) rather than an unfair generalization. Nevertheless,
    both can lead to significant negative consequences.


    Issues relating to understanding the features used for analysis are not confined
    to machine learning but are also problematic in traditional statistical analysis.
    In Ref. [17], Smith describes a study that, using statistical analysis, found
    that patients with sepsis with high pH levels are more likely to be readmitted
    to the hospital after discharge than patients with low pH. This implied that having
    a low pH is a good thing. This was surprising as it is well-known that acidosis
    in sepsis is associated with more severe disease. Analysis of the data revealed
    that the data included patients who had died during their hospital stay. The patients
    least likely to be readmitted are the ones discharged to the mortuary!


    It can be very difficult to evaluate fairness in machine learning models. We initially
    defined fairness in machine learning in terms of the relationships between a sensitive
    attribute (race, gender, nationality, etc.) and the output of the model. However,
    it is obvious from the above examples that one cannot evaluate fairness in this
    context without considering the data generation strategies for the model and the
    causal relationships embedded within the data. For example, differences in disease
    prevalence based on genetic makeup may not reflect unfair bias in the'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'data. On the other hand, differences in disease prevalence because of environmental
    or socioeconomic factors may reflect an underlying unfair bias. Recently, scientists
    at Google’s DeepMind have used a technique known as causal Bayesian network analysis
    to explore these issues in an attempt to build fairer learning systems [18,19].


    # Summary


    Good performance of a machine learning model requires a large set of features
    to allow classification and prediction from the data. There is an optimal point
    for this. Increasing the attribute number beyond that point can degrade performance.
    This can usually be overcome by increasing the complexity of the network, in terms
    of both layer width and layer depth. However, the downside here is that the network
    may lose its ability to generalize from the known examples to novel ones. In addition,
    irrelevant features can degrade performance by the network focusing on these rather
    than the ones that are truly important. For all these reasons, there must be a
    balance between algorithmic power and the structure of the data. A data scientist
    must pay as much attention to data preprocessing as to the choice of a machine
    learning model. There are also ethical considerations with respect to data such
    as restricted or poorly constructed datasets leading to implicit biases on the
    part of the model as well as privacy issues. These are very important and have
    come under increasing study as artificial intelligence is becoming more and more
    ubiquitous in society. For all these reasons, understanding the data as well as
    the algorithms is essential to address these issues properly.


