    # FIGURE 2.1


    A dataset in matrix form. Each feature set is written as a letter with a number
    that shows which sample it belongs to. Note that these need not be unique; for
    example, a1, a3, a7 can be identical. In fact, there *must* be shared feature
    values for learning to occur. In this dataset, four attributes define each sample.
    When samples in a training set are presented to a machine learning program, they
    are generally arranged in random order.


    In this example, there are nine samples, representing two distinct classes. Each
    sample is defined in terms of its feature set (in this example, 4). In machine
    learning jargon, samples (or examples) are also known as “instances,” and features
    are also known as “attributes.” The set of features for a given sample is called
    its “feature vector.” In this context, a vector is defined as an ordered collection
    of n elements, rather than as a directed line segment. The features (a1, a2, etc.)
    can be anything that can be amenable for computer manipulation. If one feature
    is color, we would have to define that feature by assigning each color to a different
    number (red would be coded as 1, blue as 2, and so on). We can refer to the dimensionality
    N of the feature vector (here 4) or, in some cases, the dimensionality of the
    entire dataset. In order for this to be a usable training set, no sample can have
    a completely unique feature set, since if that were the case, the computer would
    have no basis for generalization to new unknown samples; all it could do would
    be to memorize the list.


    # Geometric (distance-based) models


    These fall into the category of clustering algorithms. They will be discussed
    in detail as to illuminate many of the concepts involved in more complicated forms
    of machine learning.


    The best way to begin to talk about clustering is with an example. Bloodletting
    was a widely accepted therapeutic practice for a variety of diseases beginning
    about 3000 years ago and still is practiced for conditions such as polycythemia
    vera and hemochromatosis [5]. Back in the good old days of medicine this was accomplished
    by the use of bloodsucking leeches. There are both bloodsucking leeches and'
