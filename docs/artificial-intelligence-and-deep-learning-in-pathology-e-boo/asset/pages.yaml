- pgno: 221
  md: 'utility and pharmacologic effects of these treatments may be limited in current
    treatment strategies if the host immune system is depleted or not present in the
    tumor microenvironment. Furthermore, inaccurate patient stratification and the
    impact of misinterpretation of PD-L1 expression can lead to radically different
    therapeutic stratification, clinical outcomes, and serious adverse effects that
    can occur due to subjective scoring around variable thresholds and cutoffs [42,82–84].
    In order to meet this unmet clinical need, digital pathology algorithms that can
    detect and characterize lymphocytes in WSIs of diagnostic surgical pathology specimens
    may play useful roles to identify and stratify patients for immunotherapy, especially
    with the recent success of manual assessment of TILs by pathologists in histopathologic
    specimens in many solid tumor types to provide important prognostic information
    and established the potential of the role of TILs as a biomarker to predict treatment
    response [3,4,28,85,86].


    # Identifying TILs with deep learning


    The biological behavior of various types and subtypes of cancer is intrinsically
    coupled to the characteristics of the tumor microenvironment, which consists of
    stroma, immune infiltrate, nerves, and lymphovascular vessels [17,31–35,50]. Since
    these distinct tissue components cohabit the TME with cancer cells, it is widely
    believed that tumor antigenicity–driven immune responses are likely quite influenced,
    if not directly dependent, on the type, quantity, and spatial localization of
    immune cells that are present in the immediate landscape of the TME [17,31,87].
    In order to further examine the relationship of immune cells in the TME with cancer
    cells, the assessment of TILs is gaining importance as a candidate prognostic
    and predictive biomarker that may be useful to identify and stratify patients
    with the highest likelihood of responding to immunotherapy treatment options in
    a variety of cancer types [32–35,88].


    Thus, the routine of evaluation of TILs is gaining popularity as a readily available
    and widely applicable biomarker that needs to be incorporated into diagnostic
    surgical pathology reports. Even though the implementation of TILs as a routine
    clinical biomarker has not been achieved yet, the immediate need to incorporate
    the evaluation of TILs to improve current protocols for immune checkpoint therapy
    and other forms of immunotherapy is very clear. The evaluation and appropriate
    characterization of TILs in the TME is also warranted in terms of addressing immunotherapy-related
    safety issues since serious adverse effects and the lack of long-lasting responses
    in many patients suggests that the activation of previously tumor-immunosuppressed
    TILs needs to be carefully controlled [63].


    High densities of TILs correlate with favorable clinical outcomes [89], including
    longer disease-free survival (DFS) or improved overall survival (OS) in multiple
    cancer types [90]. Moreover, the spatial localization and distribution of TILs
    in terms of the immune infiltrate in the tumor center and invasive margin have
    also become important in cancer prognosis [89]. Similarly, the quantification
    of spatial'
