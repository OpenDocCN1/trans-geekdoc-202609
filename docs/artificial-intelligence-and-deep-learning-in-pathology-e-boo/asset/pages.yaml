  md: '![](img/ec668102bd6cbe5645156f246a7c2e8b_17_0.png)


    # FIGURE 1.4


    The incorporation of artificial intelligence into clinical decision-making. Both
    precise quantifiable data and unstructured narrative information can be captured
    within this framework.


    Reprinted from https://medium.com/sciforce/top-ai-algorithms-for-healthcare-aa5007ffa330,
    with permission of Dr. Max Ved, Co-founder, SciForce.


    # The role of AI in pathology


    It has been estimated that approximately 70% of a clinical chart is composed of
    laboratory data, and the pathologist is therefore an important interpreter of
    those data in the context of the remaining 30%. Even in the age of molecular analysis,
    the cognitive skills involved in the interpretation of image-based data by the
    pathologist remain of major importance in those clinical situations where diagnosis
    occurs at the tissue level. This has become increasingly difficult because of
    the complexities of diagnostic grading for prognosis, the need to integrate visual
    correlates of molecular data such as histochemical markers based on genes, gene
    expression, and immunologic profiles, and the wealth of archival material for
    comparative review. For these and many other reasons, research and implementation
    of AI in anatomic pathology, along with continuing implementation in clinical
    pathology, is proceeding at an exponential rate.'
