    # The targets of image-based calculations


    The targets for algorithmic computation in image-based pathology include (1) the
    pixels in the image; (2) cells and organelles; (3) tissues and tissue elements
    and the complex relationships among pixels and cellular/tissue elements. Each
    of these targets may be amenable to many image analytic approaches, but some approaches
    are better suited for one or another of the targets. Machine learning systems
    driving decisions can be applied to the data extracted from any of these targets.
    The following are some examples of computational schemes for examining each of
    these targets.


    Pixels: Pixels are the basic building blocks of digital images. They are a rich
    source of information in the color and intensity domains. Image texture features
    are metrics calculated from pixels that contain information about colors or intensities.
    Texture features can be viewed across an entire slide and leveraged as input data
    for machine learning systems, or they may be sorted into feature representations
    of cellular and tissue objects (as below). Thousands of texture features can be
    calculated from a histopathological image. The features can be extracted in cost-efficient
    unsupervised ways. Texture features data can be approached statistically. For
    example, an edge detection algorithm could examine the gradient magnitude and
    the gradient direction of the pixels and yield an “edgeness” metric for an entire
    image or segments of an image.


    Cells and organelle segmentation: Cells and organelles are obvious biological
    units of interest to pathologists. Gathering quantitative information about cells
    is central to a computational pathologist’s modern exploration of Virchow’s cellular
    theory of disease. Segmentation of cells, nuclei, membranes, and organelles from
    image metrics can be accomplished by a variety of whole scene segmentation approaches,
    some of which include texture features, size and shape features, densitometric
    features, and chromatin-specific features [10].


    Tissue and tissue elements and the complex relationships among pixels and cellular/tissue
    elements: The grand challenge for analytic approaches to computational pathology
    is to capture the image embedded information which is informative in modeling
    complex disease systems such as disease progression and the predictive modeling
    supporting therapeutic choices. Much of this information is embedded in the spatial
    relationships between cells. Spatial arrangement features can either be explicitly
    harvested or discovered with deep learning systems. Graph embedding theory is
    an example of a method which is well-adapted for exploring the relationships among
    pixels and cellular and tissue elements in high-resolution histopathological image
    data [10]. Graphs'
