- pgno: 174
  md: '# Deep learning on images


    One of the reasons why deep learning has become such a popular area of research
    lies in its success when applied to many computer vision problems, including a
    number of those which have been prohibitively challenging using more traditional
    approaches [51]. Its application to image analysis in digital pathology has not
    disappointed either, with deep learning quickly establishing the state-of-the-art
    performance in the context of a number of diverse tasks. Considering that the
    technical detail specifically of deep learning is addressed by several other chapters
    in the present volume, herein we focus our attention on the bigger picture with
    the aim of highlighting the key trends in the field, the main challenges, and
    inherent advantages and disadvantages of deep learning.


    Rather than joining the choir singing praises to deep learning, a more useful,
    insightful, and instructive question to ask concerns the outstanding limitations.
    If the key obstacle were merely the availability of sufficient data (undoubtedly
    a difficulty encountered by virtually any single research group, perhaps save
    for the few tech giants), the solution would be merely a matter of time and concerted
    effort. Unfortunately from the practical point of view, or fortunately from the
    point of view of intellectual challenge, the answer is more nuanced. In particular,
    the major problem to current methods is posed by the sheer size of individual
    images which are often in excess of 10 GB each. Training deep neural network images
    of this size (and bear in mind that deep learning methods are very training data
    hungry) is computationally impractical.


    A survey of existing work in the field shows two main ways of dealing with the
    problem posed by the size of WSIs. The first of these involves severe downsampling—a
    multiple gigapixel image is scaled down to an image with mere tens of thousands
    of pixels. The second approach consists of dividing a WSI into small patches (usually
    nonoverlapping), performing learning on these as individual images, and then aggregating
    patch level decisions to arrive at a slide level decision. Both approaches can
    be seen to lead to information loss, albeit in different ways. As formally demonstrated
    by Nyquist in the 1930s, but equally easy understood intuitively, the type of
    information loss incurred by the downsampling approach comes in the form of loss
    of fine detail (i.e., high spatial frequencies). Even to a human expert, this
    information is important in the interpretation of a tissue slide, and can be expected
    to be even more so to computer-based methods which do not suffer from many of
    the imperfections of the human visual system. The type of information loss that
    takes place in patch-based algorithms is rather different and more nuanced so
    it is useful to highlight a few influential works before continuing the discussion.


    In the simplest form, patches are treated entirely separately from one another.
    This approach has yielded promising results in patch level distinction between
    tumorous and normal tissues [52] and the segmentation of precursor lesions [53],
    but on prognostic tasks the success has been much more limited [54]. Moving away
    from patch level decision as the ultimate aim, Hou et al. [55] proposed a method
    whereby a deep neural network is trained on individual patches, and patch'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'level decisions aggregated by virtue of voting to make slide level predictions.
    Recently, a few methods which address the challenges of intraslide heterogeneity
    have been introduced, broadly comprising adaptive selection of patches, phenotype-based
    patch clustering, automatic clustering selection, and learned aggregation of cluster
    level predictions. Initial attempts were disappointing [56], but more subsequent
    refinements of the methodology have led to much more promising results [21].


    What the above fly-through the field brings out to the fore are some of the key
    limitations of patch-based methods, which dominate the existing literature. First,
    by decomposing a WSI into patches, it is virtually unavoidable but to resort to
    a form of ad hoc labeling of patches, usually attaching the whole slide label
    to all of the patches extracted from it. This is clearly a rather unattractive
    proposition as not every region in a slide containing a pathology is equally informative;
    indeed some may contain perfectly healthy tissue. Hence the learning algorithm
    is effectively fed incorrect data. Moreover, problems arise in the aggregation
    stage too. Lastly, there is a loss of spatial information effected by the separation
    of patches and the arbitrariness of the loci of patch boundaries with respect
    to the imaged physical tissue.


    # Regulatory concerns and considerations


    Thus far our focus was on the fundamental challenges associated with the use of
    images for tasks in digital pathology, the manner in which these have shaped the
    field to date, and the trends most likely to yield advances in future. Related
    to these, equally important in practice though somewhat different in nature, are
    requirements and demands associated with the adoption of artificial intelligence
    in everyday clinical processes. Oftentimes these are imposed by various regulatory
    bodies, such as the Food and Drug Administration (FDA) in the United States or
    more loosely the end users themselves. While a comprehensive examination of this
    topic is beyond the scope of this chapter, it is important to draw the reader’s
    attention to some of the key issues within this area. In particular, we highlight
    three issues:


    +   - Explainability,

    +   - Repeatability, and

    +   - Generalizability.


    Explainability in the context of relevance here concerns the ability for a decision
    made by an algorithmic, artificial intelligence–based solution to be communicated
    to a human on a semantically appropriate level. In other words, the question being
    asked is not just what the decision is but rather how or why the algorithm made
    that decision. As alluded to before, for many of the algorithms covered under
    the umbrella of conventional approaches to image understanding, this is reasonably
    straightforward. For example, in k-nearest neighbor–based solutions, the nearest
    neighbors, that is, previously seen and human labeled examples which exhibit the'
