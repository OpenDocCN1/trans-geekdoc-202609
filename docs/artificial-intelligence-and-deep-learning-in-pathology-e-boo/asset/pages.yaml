    # Unsupervised learning


    We have already mentioned the task of patient stratification. Indeed, the need
    for stratification emerges frequently in digital pathology, for example, due to
    the heterogeneity of many diseases or differential response of different populations
    to treatment or the disease itself [19].


    Given that the relevant strata are often unknown a priori, often because the limitations
    imposed by previously exclusively manual interpretation of data and the scale
    at which the data would need to be examined to draw reliable conclusions, it is
    frequently desirable to stratify automatically. A common way of doing this is
    by means of unsupervised learning, by applying a clustering algorithm such as
    a Gaussian mixture model or more frequently due to its simplicity and fewer free
    parameters, the k-means algorithm [21]. Then any subsequent learning can be performed
    in a more targeted fashion by learning separate models for each of the clusters
    individually.


    Let X = {x₁, x₂, ..., xₙ} be a set of d-dimensional feature vectors. The k-means
    algorithm partitions the points into K clusters, X₁, ..., X_K, so that each datum
    belongs to one and only one cluster. In addition, an attempt is made to minimize
    the sum of squared distances between each data point and the empirical mean of
    the corresponding cluster. In other words, the k-means algorithm attempts to minimize
    the following objective function:


    $J(X_1,...,X_k) = \sum_{i=1}^k \sum_{x \in X_i} \|c_i - x\|^2$, 8.8


    where the empirical cluster means are calculated as:


    $c_i = \sum_{x \in X_i} x / |X_i|$, 8.9


    The exact minimization of the objective function in Ref. [1] is an NP-hard problem
    [34]. Instead, the k-means algorithm only guarantees convergence to a local minimum.
    Starting from an initial guess, the algorithm iteratively updates cluster centers
    and data-cluster assignments until (1) a local minimum is attained, or (2) an
    alternative stopping criterion is met (e.g., the maximal desired number of iterations
    or a sufficiently small sum of squared distances). The k-means algorithm starts
    from an initial guess of cluster centers.


    Often, this is achieved simply by choosing k data points at random as the centers
    of the initial clusters, although more sophisticated initialization methods have
    been proposed [35,36]. Then, at each iteration t = 0, ... the new datum-cluster
    assignment is computed:'
