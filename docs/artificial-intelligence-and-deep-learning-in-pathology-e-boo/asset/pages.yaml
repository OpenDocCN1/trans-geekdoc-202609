    # One-shot learning


    Humans have the capacity to learn object classifications from limited training
    examples or even no examples. Humans are able to make use of information from
    previously learned classes to learn new ones. In a one-shot learning system, a
    machine uses prior learning to classify objects newly presented to it. One-shot
    learning emphasizes knowledge transfer from prior learning to new circumstances
    and as such is an approach which resonates with human learners. Knowledge transfer
    could be of model parameters learnt by training on multiple examples on one class
    and then applying them to a new object class. Knowledge transfer may be done by
    sharing features across classes. Mutual information among learned objects could
    be applied to learning a new class of object. Knowledge transfer may also occur
    through the transfer of context. For example, knowing the context of camera geometry
    used to classify one object may help classify a new object.


    The computational approaches described above can be applied to any laboratory
    data used in the clinical setting, and these methods are opportunities to innovate
    in all of the disciplines in pathology and laboratory medicine. Cabitza et al.
    [9] outlined the opportunities of machine learning in laboratory medicine, and
    these authors anticipate a flood of applications in the near future. In the following
    sections, however, we will mostly focus on the use cases of computational pathology
    in cellular and tissue-based image data.


    # Image-based computational pathology


