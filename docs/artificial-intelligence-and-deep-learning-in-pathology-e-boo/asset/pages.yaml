  md: '# Feature selection, extraction, and correction


    These are best discussed in the context of a specific example, related to the
    sinking of the Titanic based on Kaggle data. Kaggle is an online resource for
    users to find, publish, explore, and enter competitions and maintains many useful
    databases for these purposes. In particular, it contains a public domain 60 KB
    data source (train.csv) of the Titanic manifest for its final voyage [4]. This
    provides information on a large number of attributes for the passengers, and based
    on these, the Kaggle challenge is to predict if an arbitrary passenger on the
    Titanic would survive its sinking. A sample of the data from the manifest is shown
    in Fig. 5.1.


    To summarize, the categories of available information are the following:


    | Passenger ID | PClass | Name |

    |---|---|---|

    | Sex | Age | SibSp(sibling or spouse) |

    | Ticket | Fare | Parch (parent and child) |

    | Cabin no. | Embarked from | Survival information |


    If we consider survived and not survived as the two classes, then each sample
    has 11 attributes.


    We cannot directly plug this dataset into a machine learning algorithm because
    of inconsistencies, omissions, and redundancies. Excellent summaries of the issues
    involved are found in Refs. [5,6]. To summarize, 687 of the 891


    ![](img/ec668102bd6cbe5645156f246a7c2e8b_86_0.png)


    # FIGURE 5.1


    Sample of data obtained from manifest of Titanic for final voyage in 1912. Kaggle
    Repository.'
