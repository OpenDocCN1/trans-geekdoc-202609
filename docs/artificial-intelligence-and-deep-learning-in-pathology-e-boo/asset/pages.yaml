    Since each dendritic input interacts with the others via multiple interacting
    electrochemical events, there may be a nonlinear sum of inputs, especially since
    the spatial separation of the inputs affects their interaction. For this reason,
    the neuronal threshold for firing can be an all-or-none event (in mathematical
    jargon, this is a Heaviside ramp function) while the total process is nonlinear.
    Moreover, information can move backwards in a neuron through current flow. In
    other words, the neuron has an internal feedback system. A single backpropagating
    action potential can activate slow dendritic voltage-gated ionic currents, which
    in turn flow back toward the spike initiation zone in the axon, resulting in additional
    action potentials. Effectively this gives us a two-layered neural network that
    resides in a single neuron. There are experiments that show that directional selectivity
    and coincidence detection may be implemented even at this basic computational
    level.


    The pulses of electrical activity that mediate interneuron signaling can be modulated
    on the basis of pulse frequency, pulse width, or pulse arrival time in relation
    to other incoming signals. A neuron can receive either excitatory or inhibitory
    signals.'
