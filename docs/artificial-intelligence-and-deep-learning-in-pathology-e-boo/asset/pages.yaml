  md: 'for mIHC and mIF is exploring unbiased, unsupervised, and semisupervised deep
    learning methods to perform automatic IHC analysis in order to isolate and detect
    the expression of individual markers and measure the extent of expression in tumor
    and immune cells through color deconvolution, optical density, and multispectral
    separation of chromogens [42,142].


    Previous work in several studies have explored three immune biomarkers on a single
    tissue section in combination with an adjacent section stained with H&E or another
    biomarker to delineate the tumor [132]. Due to the availability of mIHC, mIF,
    and the variety of approaches to apply this advanced histologic technique, there
    have been several recent studies with multiple markers in NSCLC and cancer in
    other anatomic sites [131–133,135,137–139,145,146]. Novel multispectral approaches
    that can identify, segment, and evaluate more than three colors at a time have
    been developed to interpret mIHC within the context of the biological properties
    of the protein markers of tumor and immune cells by incorporating methods to assign
    each pixel with a collection of constituent signals from the chromogens in the
    color mixture [42,135,142,147–149]. This method can usefully address IHC co-expression
    in subsets of cell types with mIHC and mIF and represents a lot of progress since
    the maximum number of stains that could be unmixed was limited to three colors
    previously [42,142,147,149].


    A prospective study has also been performed that explored the heterogeneous nature
    of metastatic melanoma using mIHC correlated with flow cytometry (FACS) to quantify
    immune subsets in the intratumoral, tumor-associated stromal compartments, and
    leading invasive edge of the tumor [150]. This study evaluated the association
    between intratumoral CD8+ T-cells and PDL1 expression in melanoma in combination
    with FACS to obtain data regarding the differentiation of T-cells and subsets,
    activation status, and expression of immune checkpoint molecules. mIHC identified
    significantly higher Treg cells than FACS and showed preferential stromal CD4+
    T-cells. This study proposed a model of the immune context of metastatic melanoma
    with respect to PDL1 expression in melanoma cells and/or macrophages, presence
    or absence of intratumoral CD8+ TILs, and intratumoral and peritumoral tumor location.
    This study also provided insight into treatment response with checkpoint inhibitor
    therapy because PDL1 expression was more prevalent in macrophages in this study
    [150]. A separate study in metastatic melanoma utilized a novel combination of
    quantitative IHC, quantitative mIF, and next-generation sequencing for T-cell
    antigen receptors (TCRs) to show that the proliferation of intratumoral CD8+ TILs
    was directly correlated with radiographic reduction in tumor size with Pembrolizumab
    therapy [151]. This study also identified that pretreatment samples had increased
    numbers of intratumoral and peritumoral cells that expressed CD8, PD-1, and PD-L1,
    as well as close proximity between PD-1 and PD-L1.


    Deep learning methods have also been used to detect and classify cells in mIHC
    WSIs of breast cancer, where a recent approach [152] involved a two stage approach
    with an initial neural network to carry out cell detection and cell counting coupled
    to a second neural network to carry out cell classification, where the annotations'
