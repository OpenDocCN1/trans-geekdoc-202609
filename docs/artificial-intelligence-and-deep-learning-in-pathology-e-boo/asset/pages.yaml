  md: '$$X_i^{(t)} = \left\{x : x \in X \land \arg\min_j \left\|x-c_j^{(t)}\right\|^2
    = i\right\}$$


    In other words, each datum is assigned to the cluster with the nearest (in the
    Euclidean sense) empirical mean. Lastly, the locations of cluster centers are
    recomputed from the new assignments by finding the mean of the data assigned to
    each cluster:


    $$c_j^{(t+1)} = \sum_{x\in X_j^{(t)}} \frac{x}{\left|X_j^{(t)}\right|}$$


    The algorithm is guaranteed to converge because neither of the updates in Ref.
    [3] nor [4] can ever increase the objective function of Ref. [1]. Various extensions
    of the original k-means algorithm include fuzzy c-means [37], k-medoid [38], kernel
    k-means [39], as well as discriminative k-means when partial labeling is available
    [40]. The interested reader is referred to the cited publications for further
    information.


    # ## Image-based digital pathology


    Probably one of the most interesting areas of research in digital pathology, both
    in terms of practical potential and the nature of intellectual challenges, concerns
    the use of images.


    Due to the inherent complexity of images of interest in pathology, the aforementioned
    distinction between what we termed “conventional” machine learning—and deep learning—based
    methods is particularly pronounced in this realm of digital pathology. In an outline,
    the former usually take on a modular, pipeline form whereby explicitly engineered
    features (sometimes referred to as “handcrafted” features) are extracted from
    input images first, and then fed into a machine learning algorithm of the sort
    described in the previous section. In contrast, in deep learning—based approaches,
    the process is not atomized [41] in this manner—good features, as complex functions
    of directly sensed data (e.g., pixel intensities), are learned automatically from
    labeled training data. This distinction has often led to deep learning—based methods
    being characterized as “data agnostic” [42]; colloquially put, the idea is that
    no matter what the input is, the algorithm will learn what good features are.
    However, to describe deep learning in this manner would be a misnomer and highly
    misleading. For any learning to take place, the model has to be constrained and
    by virtue of these constraints contain implicit information about the problem
    at hand; succinctly put, a tabular rasa cannot learn. Indeed, one of the theorems
    popularly known as “no free lunch theorem” implicitly says the very same:


    > > *Any two optimization algorithms are equivalent when their performance is
    averaged across all possible problems.*

    > >

    > > **Ref. [18]**'
