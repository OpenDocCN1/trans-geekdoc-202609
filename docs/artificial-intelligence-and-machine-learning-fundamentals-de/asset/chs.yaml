  ![](img/Image00030.jpg)\n\n##### 图 3.11: batman 函数的图\n\n绘制曲线有多种方法。我们已经看到 `NumPy`\
  \ 库的 `polyfit` 方法返回一个系数数组，用于描述线性方程：\n\n```python\nimport numpy as np\n\nx = np.array(range(1,\
  \ 14))\n\ny = np.array([2, 8, 8, 18, 25, 21, 32, 44, 32, 48, 61, 45, 62])\n\nnp.polyfit(x,\
  \ y, 1)\n\n#### array([ 4.85714286, -2.76923077])\n```\n\n该数组描述了方程 `4.85714286 *\
  \ x - 2.76923077`。\n\n假设我们现在想要绘制曲线 `y = -x**2 + 3*x - 2`。这个二次方程由系数数组 `[-1, 3, -2]`\
  \ 描述。我们可以编写自己的函数来计算对应 x 值的 y 值。但是 `NumPy` 库已经有一个功能可以为我们完成这项工作：`np.poly1d`：\n\n```python\n\
  import numpy as np\n\nx = np.array(range(-10, 10, 0.2))\n\nf = np.poly1d([-1,3,-2])\n\
