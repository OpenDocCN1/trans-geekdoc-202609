  \ Minmax 算法：\n\n```python\nalpha = infinity\nbeta = -infinity\n```\n\n#### DRY 简化\
  \ Minmax 算法 – NegaMax 算法\n\nMinmax 算法效果非常好，特别是配合 alpha-beta 剪枝。唯一的问题是算法中有一个 if 和一个\
  \ else 分支，它们本质上是互反的。\n\n正如我们所知，在计算机科学中，有 DRY 代码和 WET 代码。DRY 代表 Don't Repeat Yourself（不要重复）。WET\
  \ 代表 We Enjoy Typing（我们喜欢打字）。当我们写两次相同的代码时，出错的概率就会增加一倍。我们也增加了未来每次维护工作执行执行的概率。因此，复用我们的代码更好。\n\
  \n在实现 Minmax 算法时，我们总是从 AI 玩家的角度来计算节点的 utility。这就是为什么我们在实现中必须有一个具有对偶性质的 utility 最大化分支和一个\
  \ utility 最小化分支。由于我们倾向于使用描述一次问题的整洁代码，可以通过更改评估的视角来消除这种对偶性。\n\n每当轮到 AI 玩家时，算法中什么都没有变化。\n\
  \n每当轮到对手玩家时，我们就反转视角。最小化 AI 玩家的 utility 等同于最大化对手的 utility。\n\n这简化了 Minmax 算法：\n\n\
  ```python\ndef Negamax(state, depth, is_players_point_of_view):\n    if depth ==\
  \ 0 or is_end_state(state):\n        return utility(state, is_players_point_of_view)\n\
  \    utility = 0\n    for s in successors(state):\n        score = Negamax(s,depth-1,not\
  \ is_players_point_of_view)\n    return score\n```\n\n使用 NegaMax 算法需要必要条件：棋面状态的评估是对称的。如果一个游戏状态从第一个玩家的角度来看价值\
  \ +20，那么从第二个玩家的角度来看价值 -20。因此，我们经常围绕零对分数归一化。\n\n#### 使用 EasyAI 库\n\n我们已经见过 simpleai\
