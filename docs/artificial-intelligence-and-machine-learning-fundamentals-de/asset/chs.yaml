  5. 根据你想要预测的值创建一个标签列（label column）。对于数据框的第 `i` 行，标签值应该属于时间点 `i+T`。\n6. 对于最后 `T` 行，标签值为\
  \ `NaN`。从数据框中删除这些行。\n7. 从特征和标签创建 NumPy 数组。\n8. 对特征数组进行缩放。\n9. 分离训练数据和测试数据。\n\n某些特征之间存在高度相关。例如，`Real\
