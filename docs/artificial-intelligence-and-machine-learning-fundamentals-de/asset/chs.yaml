  \n### Activity 13: 使用 Mean Shift 算法进行形状识别\n\n本节将学习如何对图像进行聚类。我们将假设你正在为一家从照片中检测人类情绪的公司工作。你的任务是从头像照片中提取构成人脸的像素。\n\
