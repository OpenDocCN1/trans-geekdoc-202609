  \ - 1, false )\n            utility = max( utility, score )\n        return utility\n\
  \    else:\n        utility = infinity\n        for s in successors( state ):\n\
  \            score = MinMax( s, depth - 1, true )\n            utility = min( utility,\
  \ score )\n        return utility\n```\n\n这就是 `Minmax` 算法。我们从自己的角度评估叶子节点。然后，从下而上，我们应用递归定义：\n\
