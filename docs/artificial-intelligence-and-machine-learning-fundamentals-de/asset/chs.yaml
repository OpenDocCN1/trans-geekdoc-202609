  \n##### 图 3.7: 显示斐波那契数值与线 `y=a*x+b` 的图\n\n第二个数据集的最佳拟合线明显偏离了任何区间。\n\n##### 注意\n我们不需要使用这种方法来进行线性回归。许多库（包括\
  \ `scikit-learn`）都会帮助我们自动化这个过程。当我们对多个变量进行线性回归时。\n\n#### 使用 NumPy Polyfit 拟合模型\n\n\
  NumPy 的 `polyfit` 也可以用于创建最佳拟合线。回顾系数的计算：\n\n```python\nimport numpy as np\n\nfrom\
  \ numpy import mean\n\nx = np.array(range(1, 14))\n\ny = np.array([2, 8, 8, 18,\
