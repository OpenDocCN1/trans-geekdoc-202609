  \ ** 2 - mean( x ** 2 ))\n4.857142857142859\n\nb = mean(y) - a*mean(x)\n\n-2.7692307692307843\n\
  ```\n\n`polyfit` 函数接受三个参数：`x`、`y` 和多项式的次数。它返回系数：\n\n```python\nimport numpy as np\n\
  \nx = np.array(range(1, 14))\n\ny = np.array([2, 8, 8, 18, 25, 21, 32, 44, 32, 48,\
  \ 61, 45, 62])\n\na, b = np.polyfit(x, y, 1)\n```\n\n\n\n\n在绘制曲线时，绘图器用线段连接各个点。此外，请记住，即使是复杂的曲线序列也是连接点的近似值。例如，如果你执行来自\
