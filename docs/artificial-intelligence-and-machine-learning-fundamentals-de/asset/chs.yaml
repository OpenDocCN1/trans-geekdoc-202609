  \n![图 2.9 包含可能移动的搜索树示例](img/Image00014.jpg)\n\n#### 图 2.9：包含可能移动的搜索树示例\n\n我们必须从自己的角度选择最好的移动，因为我们的目标是最大化自己移动的效用。这种最大化收益的愿望代表了\
