  我们现在将学习一种可以找到起始节点到目标节点最短路径的算法：A* 算法。\n\n#### 介绍 A* 算法\n\nA* 是一种完备且最优的启发式搜索算法，用于找到当前游戏状态与胜利状态之间的最短路径。在此状态下，“完备”和“最优”的定义如下：\n\
  \n* 完备（Complete）意味着 A* 总是能找到解决方案。\n* 最优（Optimal）意味着 A* 将找到最佳解决方案。\n\n要设置 A* 算法，我们需要：\n\
  \n* 一个初始状态\n* 一个目标状态的描述\n* 用于衡量向目标状态进展的可接受启发式函数（Admissible heuristics）\n* 生成通往目标的步骤的方法\n\
  \n一旦设置完成，我们在初始状态上按照以下步骤执行 A* 算法：\n\n1. 我们生成所有可能的下一步。\n2. 我们按照子节点与目标的距离顺序存储这些子节点。\n\
  3. 我们首先选择得分最高的子节点，并以该最优子节点为初始状态重复这三个步骤。这就是从起始节点到某个节点的最短路径。\n\n`distance_from_end(\
  \ node )` 是一种可接受的启发式估计，显示了我们距离目标节点有多远。\n\n在路径规划中，一个良好的启发式函数可以是欧几得距离。如果当前节点是 (x,\
  \ y) 而目标节点是 (u, v)，那么：\n\n`distance_from_end( node ) = sqrt( abs( x – u ) \\*\\\
  * 2 + abs( y – v ) \\*\\* 2 )`\n\n其中：\n\n* `sqrt` 是平方根函数。不要忘记从 `math` 库导入它。\n* `abs`\
  \ 是绝对值函数。`abs( -2 )` = `abs( 2 )` = `2`。\n* `x \\*\\* 2` 是 `x` 的平方。\n\n我们将使用 `distance_from_start`\
  \ 矩阵来存储从起始节点的距离。在算法中，我们将此代价矩阵称为 `distance_from_start( n1 )`。对于任何坐标为 `(x1, y1)` 的节点\
  \ `n1`，该距离等于 `distance_from_start\\[x1\\]\\[y1\\]`。\n\n我们将使用 `succ( n )` 符号从 `n`\
  \ 生成后继节点列表。\n\n让我们看看算法的伪代码：\n\n```\nfrontier = [start], internal = {}\n\n#### 初始化代价矩阵，将每个单元设置为无穷。\n\
  #### 将 distance_from_start(start) 的值设置为 0。\nwhile frontier is not empty:\n    #\
  \ 注意 n 具有起始点和终点之间\n    # 最小估计总距离。\n    n = frontier.pop()\n    # 我们之后将学习如何重建最短路径\n\
  \    if n == end:\n        return the shortest path.\n    internal.add(n)\n    for\
  \ successor s in succ(n):\n        if s in internal:\n            continue # 节点已经检查过了\n\
  \        new_distance = distance_from_start(n) + distance(n, s)\n        if new_distance\
  \ >= distance_from_start(s):\n            # 这条路径并不比我们已经\n            # 过的路径更好。\n\
  \            continue\n        if s is a member of frontier:\n            update\
  \ the priority of s\n        else:\n            Add s to frontier.\n```\n\n关于最短路径的检索，我们可以利用代价矩阵。该矩阵包含了路径上每个节点到起始节点的距离。由于在向回行走时代价总是减小的，我们只需要从终点开始，贪婪地向代价更小的方向回溯：\n\
  \n`path = [end_node], distance = get_distance_from_start( end_node )`\n\nwhile path\
