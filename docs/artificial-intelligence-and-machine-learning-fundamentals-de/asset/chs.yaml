  你必须了解文件中可能出现的所有标签。文档负责为你提供这些可用选项。在极少数情况下，如果你无法获取文档，你必须从文件中逆向工程出可能的值。\n\n一旦返回了编码后的数组，与上一点相同的问题仍然存在：我们必须用这些新值替换\
  \ `DataFrame` 中的 `currency` 列，来利用这些值。\n\n#### 目标列的极值最大值缩放（Minmax Scaling）\n\n在引入\
  \ Minmax 缩放时，你看到它不是缩放矩阵中每个向量的值，而是对每个向量中每个坐标的值进行统一缩放。这就是矩阵结构描述数据集的方式。一个向量包含一个数据点的所有属性。当我们只缩放某一个属性时，必须转置我们想要缩放的列。\n\
  \n你在《人工智能原理》的第 1 章中学习了 `NumPy` 的转置操作：\n\n```python\nimport numpy as np\n\nvalues_to_scale\
  \ = np.mat([data_frame['goal']]).transpose()\n```\n\n然后，我们必须应用 `MinMaxScaler` 来缩放转置后的值。为了在一个数组中获得结果，我们可以将转置后的结果转回原始形式：\n\
  \n```python\npreprocessing.MinMaxScaler(feature_range=(0,1))\n.fit_transform(values_to_scale)\n\
  .transpose()\n```\n\n输出如下：\n\n```\narray([[9.999900e-06, 2.999999e-04, 4.499999e-04,\
  \ ..., 1.499999e-04, 1.499999e-04, 1.999990e-05]])\n```\n\n这些值看起来很奇怪，因为 Kickstarter\
  \ 上有一些很高的目标，可能使用了七位数的数值。除了线性的 Minmax 缩放，还可以使用对数来对数量级进行缩放，计算目标价格有多少个数字。这是另一种可能降低分类练习复杂性的转换。\n\
  \n一如既往，你必须将结果放在 `DataFrame` 的相应列中，以利用这些转换后的值。\n\n我们在此停止预处理。希望现在这些不同方法的用法已经很清楚了，你将来将能够熟练地使用这些预处理方法。\n\
  \n#### 识别特征和标签\n\n与回归类似，在分类中，我们也必须分离特征和标签。继续原始示例，我们的特征是除最后一列以外的所有列，最后一列包含信用评分的结果。我们唯一的标签是信用评分列。\n\
  \n我们将使用 `NumPy` 数组来存储特征和标签：\n\n```python\nimport numpy as np\n\nfeatures = np.array(data_frame.drop(['CreditScore'],\
  \ 1))\nlabel = np.array(data_frame['CreditScore'])\n```\n\n现在我们已经准备好了特征和标签，可以使用这些数据进行交叉验证了。\n\
  \n#### 使用 scikit-learn 进行交叉验证\n\n关于回归的另一个相关点是，我们可以使用交叉验证来训练和测试模型。这个过程与回归问题的情况完全相同：\n\
  \n```python\nfrom sklearn import model_selection\n\nfeatures_train, features_test,\
  \ label_train, label_test = \\model_selection.train_test_split(\n    features,\n\
  \    label,\n    test_size=0.1\n)\n```\n\n`train_test_split` 方法会打乱并将我们的特征和标签拆分为训练数据集和测试数据集。我们可以指定测试数据集的大小为\
  \ `0` 到 `1` 之间的数字。`test_size` 为 `0.1` 意味着 `10%` 的数据将进入测试数据集。\n\n#### 活动 7：为分类准备信用数据\n\
  \n在本节中，我们将讨论如何为分类器准备数据。我们将使用来自 [`archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/`](https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/)\
  \ 的 `german.data` 作为示例，并为训练和测试分类器准备数据。确保所有的标签都是数值型的，并且值已经为分类准备好。使用 80% 的数据点作为训练数据：\n\
  \n1. 从 [`archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/`](https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/)\
  \ 下载 `german.data` 并使用 Sublime Text 或 Atom 等文本编辑器打开它。为其添加表头。\n2. 使用 `pandas` 导入数据文件并将\
  \ NA 值替换为离群值值。\n3. 执行标签编码。将数据框中的所有标签转换为整数。\n4. 分离特征和标签。我们可以应用与理论章节中看到的相同的方法。\n5.\
  \ 联合对训练和测试数据进行缩放。使用 Scikit Preprocessing 库中的 `MinMaxScaler`。\n6. 最后一步是交叉验证。打乱我们的数据，并将\
  \ 80% 用于训练，20% 用于测试。\n\n#### 注意事项\n\n此活动的解决方案见第 276 页。\n\n#### k-最近邻分类器\n\n我们将从上次过的地方继续。在引入\
  \ K-最近邻算法后，我们将使用 scikit-learn 进行分类。\n\n#### 介绍 K-最近邻算法\n\n分类算法的目标是对数据进行划分，以便我们确定属于哪一类。假设有一组分类点。我们的任务是确定一个数据点属于哪个类。\n\
  \nk-最近邻分类器接收具有给定特征值的类别。分类基于接近性。接近性被定义为欧几里得距离。如果 A 与 B 之间的欧几里得距离比 A 与 C 之间的距离短，则\
  \ A 更接近 B。\n\n#### 距离函数\n\n许多距离量都可以 k-最近邻算法。我们现在计算两个数据点的欧几里得距离和曼哈顿距离。欧几里得距离是我们在平面或三维空间中计算两点距离方法的推广。\n\
  \n点 `A = (a1, a2, …, an)` 和 `B=(b1, b2, …, bn)` 之间的距离是连接这两点的线段长度：\n\n![图 4.1 点 A\
  \ 和 B 之间的距离](img/Image0043.jpg)\n\n###### 图 4.2：点 A 和 B 之间的距离\n\n技术上讲，当我们寻找最近邻居时，不需要计算平方根，因为平方根是一个单调函数。\n\
  \n\n\n\n\n由于我们将在本书中使用欧几里得距离，让我们来看看如何通过单次 scikit-learn 函数调用计算多个点之间的距离。我们需要从 `sklearn.metrics.pairwise`\
  \ 导入 `euclidean_distances`。该函数接受两组点，并返回一个矩阵，其中包含第一组与第二组中每个点之间的两对距离：\n\n```python\n\
  from sklearn.metrics.pairwise import euclidean_distances\n\npoints = [[2,3], [3,7],\
  \ [1,6]]\n\neuclidean_distances([[4,4]], points)\n```\n\n输出如下：\n\n```python\narray([[2.23606798,\
  \ 3.16227766, 3.60555128]])\n```\n\n例如，(4,4) 和 (3,7) 之间的距离约为 3.162。\n\n我们也可以计算同一组点之间的欧几里得距离：\n\
  \n```python\neuclidean_distances(points)\n```\n\narray([[0. , 4.12310563, 3.16227766],\n\
  \ [4.12310563, 0. , 2.23606798],\n [3.16227766, 2.23606798, 0.]])\n\n### 曼哈顿/汉明距离\n\
  \n汉明和曼哈顿距离代表相同的公式。\n\n曼哈顿距离依赖于计算数据点坐标差的绝对值：\n\n![图 4.2 曼哈顿与汉明距离](img/Image00044.jpg)\n\
  \n#### 图 4.3：曼哈顿与汉明距离\n\n欧几里得距离是距离更准确的推广，而曼哈顿距离计算更容易。\n\n### 练习 12：演示 K-最近邻分类算法\n\
