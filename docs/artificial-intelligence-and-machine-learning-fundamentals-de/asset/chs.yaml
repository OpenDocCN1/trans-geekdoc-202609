  \ 101。\n\n![图 2.12 最大化效用的搜索树](img/Image00017.jpg)\n\n#### 图 2.12：最大化获胜概率\n\n让我们看看如何实现这个想法：\n\
  \n```python\ndef min_max( state, depth, is_maximizing):\n    if depth == 0 or is_end_state(\
  \ state ):\n        return utility( state )\n    if is_maximizing:\n        utility\
