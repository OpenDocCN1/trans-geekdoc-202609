  \n然后使用固定默认聚类数为 8 的 k-means 算法。将其结果与 Mean Shift 聚类算法进行比较。\n\n1. 选择你想要聚类的图像并加载图像。\n\
  \n2. 我们从作者的 Youtube 频道选择了这张图像：\n\n![](img/Image00076.jpg)\n\n###### Fig 7.13: 一张包含作者照片的图像\n\
  \n3. 图像尺寸已大幅减小，以便我们的算法更快终止。\n\n```python\nimage = Image.open('destructuring.jpg')\n\
  \npixels = image.load()\n```\n\n4. 将像素转换为数据框以进行聚类\n\n```python\nimport pandas\n\n\
  data_frame = pandas.DataFrame(\n[[x,y,pixels[x,y][0], pixels[x,y][1], pixels[x,y][2]]\n\
  for x in range(image.size[0])\nfor y in range(image.size[1])\n],\ncolumns=['x',\
  \ 'y', 'r', 'g', 'b']\n)\n```\n\n5. 使用 scikit-learn 对图像执行 Mean Shift 聚类。注意，这次我们将跳过特征的归一化，因为像素的接近度和颜色分量的接近度以接近相等的权重表示。像素距离的最大差异为\
  \ 750，而颜色分量的最大差异为 256。\n\n```python\nfrom sklearn.cluster import MeanShift\n\nmean_shift_model\
