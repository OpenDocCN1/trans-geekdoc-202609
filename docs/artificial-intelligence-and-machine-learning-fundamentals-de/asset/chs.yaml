  * 实现 k-最近邻和支持向量机分类器\n\n本章将重点关注分类的目标，并学习 k-最近邻和支持向量机。\n\n### 引言\n\n在本章中，我们将学习分类器，特别是\
  \ k-最近邻分类器和支持向量机。我们将使用这种分类对数据进行分类。就像我们在回归中做的那样，我们将基于训练数据构建分类器，并使用测试数据测试分类器的性能。\n\
  \n## 分类的基础\n\n回归侧重于创建一个最拟合我们数据的模型以预测未来，而分类的在于创建一个模型，将我们的数据分离到不同的类别。\n\n假设你有一些属于不同类别的数据，分类可以帮助你预测新数据点所属的类别。分类器是一个确定领域内任何数据点标签值的模型。假设你有一组点，`P\
  \ = {p1, p2, p3, ..., pm}`，以及另一组点，`Q = {q1, q2, q3, ..., qn}`。你将这些点视为不同类别的成员。为了简单起见，我们可以想象\
  \ `P` 包含信用良好的人员，而 `Q` 包含在信用还款倾向方面具有风险的人员。\n\n你可以划分状态空间，使得 `P` 中的所有点位于空间的一个簇中，然后与包含\
  \ `Q` 中所有点的状态空间簇不相交。一旦你在状态空间找到这些被称为“簇”（clusters）的边界空间，你就成功执行了“聚类”（clustering）。\n\
  \n假设我们有一个点 `x`，它不等于之前的任何一个点。点 `x` 属于簇 `P` 还是簇 `Q`？这个问题的答案是一个“分类练习”，因为我们正在对点 `x`\
  \ 进行分类。\n\n分类通常由接近程度决定。点 `x` 距离簇 `P` 中的点越近，它属于簇 `P` 的概率就越大。这就是最近邻分类背后的思想。在 k-最近邻分类中，我们找到点\
  \ `x` 的 k 个最近邻，并根据同类中最近邻的最大数量对其进行分类。除了 k-最近邻之外，我们还将使用支持向量机进行分类。在本章中，我们将详细介绍这种信用评分方法。\n\
  \n我们可以自己组装随机虚拟数据，也可以选择使用包含数百个数据点的在线数据集。为了让这种学习体验尽可能真实，我们将选择后者。让我们继续一个练习，让我们下载一些可以用于分类的数据。下载机器学习数据集的常用地方是\
  \ `https://archive.ics.uci.edu/ml/datasets.html`。你可以在那里找到五个关于信用审批的不同数据集。我们现在加载德国贷款审批的数据集，因为\
  \ 1000 个数据点的规模非常适合作为示例，并且有相关的文档。\n\n`german 数据集以 CSV 格式提供`\n\nCSV 代表逗号分隔值（comma-separated\
  \ values）。`CSV` 文件是一个简单的文本文件，其中文件的每行包含一个数据点。数据点的属性按固定顺序给出，并用逗号等分隔符分隔。该字符可能不会数据中，否则我们无法不知道分隔符是数据的一部分还是作为分隔符。尽管名称“逗号分隔值”暗示分隔符字符是逗号，但并不总是如此。例如，在我们的示例中，分隔符是空格。`CSV`\
  \ 文件用于许多应用程序，包括 Excel。\n\n### 练习 10：加载数据集\n\n1. 访问 `https://archive.ics.uci.edu/ml/datasets/Statlog+%28German+Data`。数据文件位于\
