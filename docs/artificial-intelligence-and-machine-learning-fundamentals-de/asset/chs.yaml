  \ 293 页。\n\n### 总结\n\n在本章，我们学习了聚类是如何工作的。聚类是无监督学习的一种，其中特征是给定的，聚类算法寻找标签。\n\n聚类有两种：扁的和层次。\n\
  \nk-means 算法是一种扁聚类算法，我们为 K 个聚类确定 K 个中心点，算法寻找数据点。\n\n均值偏移是层次聚类算法的一个示例，不同标签值的数量由算法确定。\n\
  \n最后一章将介绍一个由于计算能力的爆炸和廉价的可扩展在线服务器容量而在这个十年流行的领域。该领域是神经网络和深度学习的科学。\n\n## 使用神经网络进行深度学习\n\
  \n### 学习目标\n\n在本章结束时，你将能够：\n\n* 执行基本的 TensorFlow 操作以解决各种表达式\n* 描述神经网络如何工作\n* 使用\
  \ TensorFlow 训练和测试神经网络\n* 使用 TensorFlow 实现深度学习神经网络模型\n\n在本章中，我们将使用 TensorFlow 库检测手写数字。\n\
  \n### 引言\n\n在本章中，我们将学习另一种监督学习技术。然而，这次我们不再使用分类或回归等简单的数学模型，而是将使用一个完全不同的模型：神经网络。尽管我们将神经网络用于监督学习，但请注意神经网络也可以建模无监督学习技术。这种模型的重要性在过去一个世纪增加了，因为在过去使用该模型进行监督学习所需的计算能力是不够的。因此，神经网络在过去世纪开始进入实践。\n\
  \n### Python 版 TensorFlow\n\nTensorFlow 是 Google 维护的最重要的机器学习和开源库之一。TensorFlow API\
  \ 适用于许多语言，包括 Python、JavaScript、Java 和 C。由于 TensorFlow 支持监督学习，我们将使用 TensorFlow 构建图模型，然后使用该模型进行预测。\n\
  \nTensorFlow 处理张量。张量的一些示例是：\n\n* 标量值，例如浮点数。\n\n\n\n\n\n- 任意长度的向量。\n- 规则矩阵，包含 `p`\
  \ 乘以 `q` 个值，其中 `p` 和 `q` 是有限整数。\n- 一个 `p` x `q` x `r` 的广义矩阵状结构，其中 `p`, `q`, `r`\
  \ 是有限整数。将此构造想象为三维空间中的矩形物体，边长为 `p`、`q` 和 `r`。该数据结构中的数字可以用三维的形式可视化。\n- 观察上述四种数据结构，更复杂的\
  \ `n-dimensional` 数据结构也可以作为张量的有效示例。\n\n在本章中，我们将专注于标量、向量和规则矩阵张量。在本章的范围内，可以将张量看作标量值、数组，或数组的数组。\n\
  \nTensorFlow 用于创建人工神经网络，因为它模拟了其输入、输出、内部节点以及这些节点之间的有向边。TensorFlow 还带有用于转换信号的数学函数。这些数学函数在建模神经网络内部的神经元被激活时也会非常有用。\n\
  \n#### 注意事项\n\n张量是类数组对象。流（Flow）象征着对张量数据的操作。因此，本质上，TensorFlow 是一个数组数据处理库。\n\nTensorFlow\
  \ 的主要用例是人工神经网络，因为该领域需要对大型数组和矩阵进行操作。TensorFlow 带有许多深度学习相关的函数，因此它是神经网络的理想环境。TensorFlow\
  \ 用于语音识别、语音搜索，也是 translate.google.com 背后的大脑。在本章后面，我们将使用 TensorFlow 来识别手写。\n\n####\
  \ 在 Anaconda Navigator 中安装 TensorFlow\n\n打开 Anaconda Prompt 并使用 `pip` 安装 TensorFlow：\n\
  \n```bash\npip install tensorflow\n```\n\n安装需要几分钟时间，因为包本身很大。如果你更倾向于使用显卡 GPU 而不是\
  \ CPU，也可以使用 `tensorflow-gpu`。请确保只有在你拥有足够好的显卡的情况下才使用 GPU 版本。\n\n一旦完成安装，你可以在 IPython\
  \ 中导入 TensorFlow：\n\n```python\nimport tensorflow as tf\n```\n\n首先，我们将使用 TensorFlow\
  \ 构建一个图。该模型的执行是分离的。这种分离是非常重要的，因为执行过程是资源密集型的，因此可能运行在专门解决计算密集型问题的服务器上。\n\n#### TensorFlow\
  \ 操作\n\nTensorFlow 提供了许多处理数据的操作。以下是这些操作的一些示例：\n\n- **算术操作**：`add` 和 `multiply`\n\
  - **指数操作**：`exp` 和 `log`\n- **关系操作**：`greater`、`less` 和 `equal`\n- **数组操作**：`concat`、`slice`\
  \ 和 `split`\n- **矩阵操作**：`matrix_inverse`、`matrix_determinant` 和 `matmul`\n- **神经网络相关操作**：`sigmoid`、`ReLU`\
  \ 和 `softmax`\n\n#### 练习 22：使用基础操作和 TensorFlow 常量\n\n使用 TensorFlow 中的算术操作求解表达式：`2\
  \ * 3 + 4`\n\n这些操作可以用于构建图。为了进一步了解关于 TensorFlow 常量和基础算术运算符，让我们考虑一个简单的表达式 `2 * 3 +\
  \ 4`，该表达式的图如下：\n\n![Figure 7.1 Graph of the expression 2\\*3+4](img/Image00062.jpg)\n\
  \n##### 图 7.1：表达式 2*3+4 的图\n\n1. 使用以下代码构建此图：\n```python\nimport tensorflow as tf\n\
  input1 = tf.constant(2.0)\ninput2 = tf.constant(3.0)\ninput3 = tf.constant(4.0)\n\
  product12 = tf.multiply(input1, input2)\nsum = tf.add(product12, input3)\n```\n\
  2. 一旦图构建完成，为了执行计算，我们需要：\n```python\nwith tf.Session() as sess:\n    print(sess.run(sum))\n\
  ```\n输出是：\n```\n10\n```\n\n#### 占位符与变量\n\n现在我们理解了占位符，让我们更进一步。占位符是在会话开始前替换的值。变量是可能会变化的值。让我们用代码创建一个表达式：\n\
  \n```python\nimport tensorflow as tf\ninput1 = tf.placeholder(tf.float32, name='input1')\n\
  input2 = tf.placeholder(tf.float32, name='input2')\ninput3 = tf.Variable(0.0, name='input3')\n\
  product12 = tf.multiply(input1, input2)\nsum = tf.add(product12, input3)\n```\n\n\
  为了执行它，我们使用：\n```python\nwith tf.Session() as sess:\n    print(sess.run(sum, feed={input1:\
  \ 2, input2: 3}))\n```\n\n#### 全局变量初始化\n\n由于 TensorFlow 经常使用矩阵，因此根据正态分布初始化一个随机矩阵是有意义的。\n\
  \n```python\nimport tensorflow as tf\nrandomMatrix = tf.Variable(tf.random_normal([3,\
  \ 4]))\nwith tf.Session() as sess:\n    sess.run(tf.global_variables_initializer())\n\
  \    print(sess.run(randomMatrix))\n```\n\n输出是：\n```\n[[-0.41974232  1.8810892 -1.4549098\
  \  0.7398717 ]\n [ 2.1072254   1.796842   -0.3830152  0.9811519 ]\n [-0.550108 \
  \  -0.41858754  1.351614    1.2387075 ]]\n```\n\n### 神经网络简介\n\n神经网络是 AI 的最新分支。神经网络的灵感来源于人类大脑的工作方式。它们最初是由\
  \ 20 世纪 40 年代的 Warren McCulloch 和 Walter Pitts 发明的。神经网络是一种用于描述人脑如何解决问题的数学模型。\n\n\
  我们在谈论数学模型时使用“人工神经网络”一词，在谈论人脑时使用“生物神经网络”。人工神经网络是监督学习算法。\n\n\n\n\n人工神经网络的工作原理类似于人脑的工作原理。人脑中的树突连接到胞体，而胞体连接到轴突。在这里，树突充当输入，胞体是进行计算（加权和和激活函数）的地方，而轴突则类似于输出。\n\
  \n然后，我们通过将加权和传递给激活函数来确定哪个神经元被发放。如果该函数确定神经元必须发放，信号就会出现在输出中。该信号可以作为网络中其他神经元的输入：\n\n\
  ![图 7.2 显示人工神经网络工作原理的图](img/Image00063.jpg)\n\n#### 图 7.2：显示人工神经网络工作原理的图\n\n假设 `f`\
  \ 是激活函数，`x1`、`x2`、`x3` 和 `x4` 是输入，它们的和通过权重 `w1`、`w2`、`w3` 和 `w4` 加权：\n\n`y = f(x1*w1\
  \ + x2*w2 + x3*w3 + x4*w4)`\n\n假设向量 `x` 为 (`x1`, `x2`, `x3`, `x4`)，向量 `w` 为 (`w1`,\
  \ `w2`, `w3`, `w4` )，我们可以将此方程写为这两个向量的标量或点积：\n\n`y = f(x ⋅ w)`\n\n我们定义的结构是一个神经元：\n\
  \n让我们隐藏这个神经元的细节，以便更容易构建神经网络：\n\n![图 7.4：表示神经元隐藏层的图](img/Image00064.jpg)\n\n####\
  \ 图 7.4：表示神经元隐藏层的图\n\n我们可以创建多个方框和多个输出变量，这些变量可能会由于读取输入的加权平均值而作为结果而被激活。\n\n尽管在接下来的图中有从所有输入指向所有方框的箭头，但请记住箭头上的权重可能为零。我们仍然在图中显示这些箭头：\n\
  \n![](img/Image00065.jpg)\n\n#### 图 7.5：表示神经网络的图\n\n描述输入与输出之间关系的方框被称为**隐藏层**。具有一个隐藏层的神经网络被称为普通神经网络。\n\
  \n在连接输入和输出时，我们可能有多个隐藏层。具有多个层的神经网络被称为深度神经网络：\n\n![图 7.6：表示深度神经网络的图](img/Image00066.jpg)\n\
  \n#### 图 7.6：表示深度神经网络的图\n\n“深度学习”一词源于多层的存在。在创建人工神经网络时，我们可以指定隐藏层的数量。\n\n#### 偏置 (Biases)\n\
  \n让我们再次看看神经网络中神经元的模型：\n\n![图 7.7：神经网络中神经元的图](img/Image00067.jpg)\n\n#### 图 7.7：神经网络中神经元的图\n\
  \n我们学到了该神经元的方程如下：\n\n`y = f(x1*w1 + x2*w2 + x3*w3 + x4*w4)`\n\n这个方程的问题在于没有依赖于输入\
  \ `x1`、`x2`、`x3` 和 `x4` 的常数因子。这意味着神经网络中的每个神经元在没有偏置的情况下，每当每对权重-输入对的乘积为零时，它总是产生这个值。\n\
  \n因此，我们向方程中添加了偏置：\n\n`y = f(x1*w1 + x2*w2 + x3*w3 + x4*w4 + b)`\n\n`y = f(x ⋅ w\
  \ + b)`\n\n第一个方程是冗长形式，描述了每个坐标、权重系数和偏置的作用。第二个方程是向量形式，其中 `x = (x1, x2, x3, x4)` 且\
  \ `w = (w1, w2, w3, w4)`。\n\n\n\n\n当我们过滤的是一个列表而不是单个值时，可以使用 `softmax` 函数。列表中的每个元素都将进行转换。\n\
  \n让我们对不同的激活函数进行实验。通过解决以下练习，观察这些函数如何通过求解来抑制加权输入。\n\n#### 练习 23：激活函数\n\n考虑以下神经网络：\n\
  \n`y = f( 2 * x1 + 0.5 * x2 + 1.5 * x3 - 3 )`\n\n假设 `x1` 为 1 且 `x2` 为 2，当当 `x` 值为\
  \ -1, 0, 1, 2 时，计算 `y` 的值：\n\n*   `f` 是 `sigmoid` 函数\n*   `f` 是 `tanh` 函数\n*   `f`\
  \ 是 `ReLU` 函数\n\n执行以下步骤：\n\n1.  代入已知系数：\n    ```python\n    def get_y( f, x3 ):\n\
  \        return f(2*1+0.5*2+1.5*x3)\n    ```\n\n2.  使用以下三个激活函数：\n    ```python\n\
  \    import numpy as np\n\n    def sigmoid(x):\n        return 1 / (1 + np.e **\
  \ (-x))\n\n    def tanh(x):\n        return 2 / (1 + np.e ** (-2*x)) - 1\n\n   \
  \ def relu(x):\n        return 0 if x < 0 else x\n    ```\n\n3.  使用以下命令计算 sigmoid\
  \ 值：\n    ```python\n    get_y( sigmoid, -2 )\n    ```\n    输出为 `0.5`\n\n    ```python\n\
  \    get_y(sigmoid, -1)\n    ```\n    输出为 `0.8175744761936437`\n\n    ```python\n\
  \    get_y(sigmoid, 0)\n    ```\n    输出为 `0.9525741268224331`\n\n    ```python\n\
  \    get_y(sigmoid, 1)\n    ```\n    输出为 `0.9890130573694068`\n\n    ```python\n\
  \    get_y(sigmoid, 2)\n    ```\n    输出为 `0.9975273768433653`\n\n4.  如你所见，随着 `sigmoid`\
  \ 函数内部表达式和的增加，变化被迅速抑制。我们期望 `tanh` 函数具有更大的抑制效果：\n    ```python\n    get_y(tanh, -2)\n\
  \    ```\n    输出为 `0.0`\n\n    ```python\n    get_y(tanh, -1)\n    ```\n    输出为\
  \ `0.9051482536448663`\n\n    ```python\n    get_y(tanh, 0)\n    ```\n    输出为 `0.9950547536867307`\n\
  \n    ```python\n    get_y(tanh, 1)\n    ```\n    输出为 `0.9997532108480274`\n\n \
  \   ```python\n    get_y(tanh, 2)\n    ```\n    输出为 `0.9999877116507956`\n\n5. \
  \ 根据 `tanh` 函数的特性，输出比 sigmoid 函数更快地接近 1 渐线。对于 `x3 = -2`，我们计算 `f(0)`。虽然 `sigmoid(0)`\
  \ 是 `0.5`，但 `tanh(0)` 是 `0`。与其他两个函数相反，`ReLu` 函数不抑制正值：\n    ```python\n    get_y(relu,\
  \ -2)\n    ```\n\n    ```python\n    get_y(relu, -1)\n    ```\n\n    ```python\n\
  \    get_y(relu, 0)\n    ```\n\n    ```python\n    get_y(relu, 1)\n    ```\n\n \
  \   ```python\n    get_y(relu, 2)\n    ```\n\n\n\n例如，值 `[0, 0.1, 0, 0, 0.9, 0, 0,\
  \ 0, 0, 0]` 表示我们的数字有 90% 的概率是 4，10% 的概率是 2。\n\n在分类问题中，我们始终为每个类使用一个输出值。\n\n让我们继续权重和偏置。为了连接\
  \ `28*28 = 784` 个特征和 10 个标签，我们需要一个 `784 x 10` 的权重矩阵，它有 784 行和 10 列。\n\n因此，方程变为 `y\
  \ = f( x ⋅ W + b )`，其中 `x` 是 `784` 维空间中的向量，`W` 是一个 `784 x 10` 矩阵，`b` 是一个十维偏置向量。`y`\
  \ 向量也包含十个坐标。`f` 函数定义在具有十个坐标的向量上，并应用于每一个坐标。\n\n##### 注意\n\n为了将一个二维的 `28x28` 数据点矩阵转换为一维的\
  \ `28x28` 元素向量，我们需要展平（flatten）矩阵。与许多语言和库不同，Python 并没有 `flatten` 方法。\n\n由于展平是一项简单任务，让我们来构造一个\
  \ `flatten` 方法：\n\n```python\ndef flatten(matrix):\n    return [elem for row in\
  \ matrix for elem in row]\n\nflatten([[1,2],[3,4]])\n```\n\n输出如下：\n\n```\n[1, 2,\
  \ 3, 4]\n```\n\n让我们将特征从 `28*28` 矩阵展平为 `784` 维空间的向量：\n\n```python\nfeatures_train_vector\
  \ = [\n    flatten(image) for image in features_train\n]\n\nfeatures_test_vector\
  \ = [\n    flatten(image) for image in features_test\n]\n```\n\n为了将标签转换为向量形式，我们需要进行归一化：\n\
  \n```python\nimport numpy as np\n\nlabel_train_vector = np.zeros((label_train.size,\
  \ 10))\n\nfor i, label in enumerate(label_train_vector):\n    label[label_train[i]]\
  \ = 1\n\nlabel_test_vector = np.zeros((label_test.size, 10))\n\nfor i, label in\
  \ enumerate(label_test_vector):\n    label[label_test[i]] = 1\n```\n\n#### 多标签的\
  \ TensorFlow 建模\n\n我们现在用 TensorFlow 为以下方程建模：`y = f( x ⋅ W + b )`\n\n在导入 TensorFlow\
  \ 后，我们将定义特征、标签和权重：\n\n```python\nimport tensorflow as tf\n\nf = tf.nn.sigmoid\n\n\
  x = tf.placeholder(tf.float32, [None, 28 * 28])\n\nW = tf.Variable(tf.random_normal([784,\
  \ 10]))\nb = tf.Variable(tf.random_normal([10]))\n```\n\n如果我们知道如何使用 TensorFlow 执行点积乘法，就可以简单写写方程\
  \ `y = f( x ⋅ W + b )`。\n\n如果我们将 `x` 视为一个 `1x84` 矩阵，可以使用 `tf.matmul` 函数将其与 `784x10`\
  \ 的 `W` 矩阵相乘。\n\n因此，我们的方程变为：`y = f( tf.add( tf.matmul( x, W ), b ) )`\n\n你可能已经注意到\
  \ `x` 包含占位符，而 `W` 和 `b` 是变量。这是因为 `x` 的值是给定的。我们只需要在方程中替换它们。TensorFlow 的任务是优化 `W`\
  \ 和 `b` 的值，以便最大化我们读取正确数字的概率。\n\n让我们用函数形式表示 `y` 的计算：\n\n```python\ndef classify(x):\n\
  \    return f(tf.add(tf.matmul(x, W), b))\n```\n\n##### 注意\n\n这是我们可以定义激活函数的地方。在本章结束的活动中，你最好使用\
