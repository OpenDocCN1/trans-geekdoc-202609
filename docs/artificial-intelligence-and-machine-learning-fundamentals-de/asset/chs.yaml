  \ ['unacc', 'acc', 'good', 'vgood']\n}\n\nfrom sklearn import preprocessing\nlabel_encoders\
  \ = {}\ndata_frame_encoded = pandas.DataFrame()\n\nfor column in data_frame:\n \
  \   if column in labels:\n        label_encoders[column] = preprocessing.LabelEncoder()\n\
  \        label_encoders[column].fit(data_frame[column])\n        data_frame_encoded[column]\
  \ = label_encoders[column].transform(data_frame[column])\n    else:\n        data_frame_encoded[column]\
  \ = data_frame[column]\n```\n\n4. 将特征和标签分开：\n\n```python\nfeatures = data_frame_encoded.drop('Class',\
  \ axis=1)\nlabel = data_frame_encoded['Class']\n```\n\n5. 划分训练集和测试集，使用 10% 的测试数据：\n\
  \n```python\nfrom sklearn import model_selection\nfeatures_train, features_test,\
