  \ 中。\n\n### 数据预处理\n\n在构建分类器之前，最好对数据进行格式化，以便我们将相关数据留在最适合分类的格式中，并移除所有我们感兴趣的数据。\n\n\
  #### 1. 替换或删除值\n\n例如，如果数据集中存在 `N/A`（或 `NA`）值，我们可能将这些值替换为我们可以处理的数值更好。`NA` 代表不可用（Not\
  \ Available）。我们可以选择忽略包含 `NA` 值的行，或者将它们替换为离群值。离群值是指像 -1,000,000 这样与数据集中普通值明显有不同的值。`DataFrame`\
  \ 的 `replace` 方法可以执行这种类型的替换。用离群值替换 `NA` 值的写法如下：\n\n```\ndata_frame.replace('NA',\
  \ -1000000, inplace=True)\n```\n\n`replace` 方法将所有 `NA` 值更改为数值。这个数值应该远离 `DataFrame`\
  \ 中的任何合理值。假设那里只有正值，那么分类器就会把负百万识别出来（作为异常值）。\n\n用极值替换不可用数据的替代方案是删除包含不可用数据的行：\n\n```\n\
  data_frame.dropna(0, inplace=True)\n```\n\n第一个参数指定我们删除的是行而不是列。第二个参数指定我们执行删除操作，而不克隆\
  \ `DataFrame`。删除 `NA` 值是不太理想的，因为你通常会丢失数据集中的很大一部分。\n\n#### 2. 删除列\n\n如果我们有一列不想包含在分类中，我们最好将其删除。否则，分类器可能会在完全没有相关性的地方检测到错误的模式。例如，你的电话号码本身极不可能与你的信用评分相关。它是一个\
  \ 9 到 12 位的数字，可能会很容易给分类器引入大量噪声。因此，我们删除了电话列。\n\n```\ndata_frame.drop(['Phone'], 1,\
  \ inplace=True)\n```\n\n第二个参数表示我们删除的是列而不是行。第一个参数是我们想要删除的列的枚举。`inplace` 参数的作用是该调用修改原始的\
  \ `DataFrame`。\n\n#### 3. 数据转换\n\n通常，我们处理的数据格式并不总是对分类过程是最优的。我们可能出于多个原因想要将数据转换为不同的格式，例如：\n\
  \n* 突出我们感兴趣的数据方面（例如，Min-max 缩放或归一化）\n* 移除我们不感兴趣的数据方面（例如，二值化）\n* 标签编码（Label encoding）\n\
  \n`Minmax scaling` 可以通过 scikit 预处理工具包的 `MinMaxScaler` 方法完成：\n\n```\nfrom sklearn\
  \ import preprocessing\n\ndata = np.array([\n    [19, 65],\n    [4, 52],\n    [2,\
  \ 33]\n])\n\npreprocessing.MinMaxScaler(feature_range=(0,1)).fit_transform(data)\n\
  ```\n\n输出如下：\n\n```\narray([[1. , 1. ], [0.11764706, 0.59375 ], [0. , 0. ]])\n```\n\
  \n`MinMaxScaler` 缩放数据中的每一列，使得列中的最小数字变为 0，最大数字变为 1，中间所有的值按比例缩放到 0 和 1 之间。\n\n`Binarization`\
  \ 根据条件将数据转换为 0 和 1：\n\n```\npreprocessing.Binarizer(threshold=10).transform(data)\n\
  ```\n\n输出是：\n```\narray([[1, 1], [0, 1], [0, 1]])\n```\n\n`Label encoding` 为准备 scikit-learn\
  \ 处理的特征非常重要。虽然你的某些特征是字符串标签，但 scikit-learn 期望这些数据是数字。这就是 scikit-learn 的预处理库派上用场的地方。\n\
  \n##### 注意\n\n你可能已经注意到在信用评分示例中有两个数据文件。一个包含字符串形式的标签，另一个包含整数形式的标签。我故意让你加载带有字符串标签的数据，以便让你获得一些如何使用标签编码器正确预处理数据的经验。\n\
  \n标签编码并不是什么复杂的科学。它在字符串标签和数值之间创建了映射。\n[/content]---\n\n#### 练习 11：预处理\n\n在此练习中，我们将使用\
