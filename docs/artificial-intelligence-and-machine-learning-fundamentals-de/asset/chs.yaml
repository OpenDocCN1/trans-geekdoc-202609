  \ 2 small low unacc\n1 vhigh vhigh 2 2 small med unacc\n2 vhigh vhigh 2 2 small\
  \ high unacc\n3 vhigh vhigh 2 2 med low unacc\n4 vhigh vhigh 2 2 med med unacc\n\
  \n```\n\n3. 由于分类工作处理的是数值数据，我们必须像在前一章所示那样进行标签编码（label encoding）。\n\n```python\nlabels\
