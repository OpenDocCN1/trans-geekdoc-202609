  \n#### 活动 2：教智能体意识到可以防御损失的情况\n\n\n\n\n\n在本节中，我们将讨论如何让计算机玩家玩得更好，从而减少状态空间和失败次数。我们将强制计算机去防御玩家在行、列或对角线上放置的第三个符号（棋子）：\n\
