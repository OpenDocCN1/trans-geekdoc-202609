  \ 聚类。\n\n#### 活动 12:销售数据的 k-means 聚类\n\n在本节中，我们将检测表现相似的产品销售情况，以识别产品销售趋势。\n\n我们将使用位于以下\
  \ URL 的每周销售交易数据集：\n\n[`archive.ics.uci.edu/ml/datasets/Sales_Transactions_Dataset_Weekly`](https://archive.ics.uci.edu/ml/datasets/Sales_Transactions_Dataset_Weekly)\
  \ 使用 k-means 算法对数据集进行聚类。确保你根据之前章节中所学的内容为聚类准备数据。\n\n使用 k-means 算法的默认设置：\n\n\n\n\n\
  \n#### 1. 使用 pandas 加载数据集\n如果检查 CSV 文件中的数据，你会发现第一列包含产品 ID 字符串。这些值只会给聚类过程带来噪声。此外，注意到对于第\
  \ 0 到 51 周，存在一个以 W 为前缀的标签和一个归一化标签。使用归一化标签更有意义，这样我们就可以从数据集中删除常规的周标签。创建一个 k-means\
  \ 聚类模型并将数据点拟合到 8 个聚类中。检索聚类算法的中心点和标签。\n\n#### 2. 标签\n每个数据点的标签都可以使用 `labels_` 属性检索。这些标签决定了原始数据框行的聚类方式。这些标签有什么好处？\n\
  \n假设在原始数据框中，给出了产品名称。你可以很容易地认识到相似类型的产品销售情况相似。也有一些产品波动很大，还有一些产品具有季节性。例如，如果某些产品促进脂肪减少和塑形，它们往往在一年中的前半年销售，在海滩季节之前。\n\
  \n##### Note\n本活动的解决方案可在第 291 页找到。\n\n### Mean Shift Algorithm\n\nMean shift 是一种分层聚类算法。与\
  \ k-means 算法不同，在 mean shift 中，聚类算法决定需要多少个聚类，并执行聚类。这是有利的，因为我们很少知道我们正在寻找多少个聚类。\n\n\
  该算法在我们日常生活中的许多用例中也有应用。例如，Xbox Kinect 设备使用 mean shift 算法检测人体部位。一些手机也使用 Mean Shift\
  \ 算法来检测人脸。随着社交媒体平台的增长，图像分割是许多用户已经习惯的功能。由于图像分割也是计算机视觉的基础，因此可以在那里找到一些应用。mean shift\
  \ 算法也可能挽救生命，因为它内置于许多现代汽车的汽车检测软件中。想象一下，有人在你前面紧急刹车。你的汽车的图像分割软件检测到你前面的汽车离你越来越近，并在你意识到紧急情况之前应用紧急刹车。这些驾驶辅助系统在现代汽车中广泛存在。自动驾驶汽车只差一步之遥。\n\
  \n#### Exercise 21: Illustrating Mean Shift in 2D\n\n要使用 mean shift 算法学习聚类，请执行以下步骤：\n\
  \n1. 让我们回忆一下上一主题中的数据点：\n\n```python\ndata_points = np.array([\n    [1, 1],\n   \
  \ [1, 1.5],\n    [2, 2],\n    [8, 1],\n    [8, 0],\n    [8.5, 1],\n    [6, 1],\n\
  \    [1, 10],\n    [1.5, 10],\n    [1.5, 9.5],\n    [10, 10],\n    [1.5, 8.5]\n\
  ])\nr = 2;\n```\n\n2. 我们现在要做的任务是找到一个点 `P (x, y)`，使得点 `P` 半径 `R` 范围内的数据点数量最大化。点分布如下：\n\
  \n![](img/Image00060.jpg)\n\n###### Figure 6.6: Graph showing the data points from\
  \ the `data_points` array\n\n3. 假设我们最初将点 `P` 等同于第一个数据点，`[1, 1]`：\n\n`P = [1, 1]`\n\
  \n4. 让我们找到距离此点 `R` 范围内的点：\n\n```python\nfrom scipy.spatial import distance\n\npoints\
  \ = np.array([\n    p0 for p0 in data_points if distance.euclidean(p0, P) <= r\n\
  ])\npoints\n```\n\n输出如下：\n\n```\narray([[1. , 1. ],\n    [1. , 1.5],\n    [2. ,\
  \ 2. ]])\n```\n\n5. 让我们计算数据点的均值：\n\n```python\nimport numpy as np\n\nP = [\n   \
  \ np.mean( points.transpose()[0] ),\n    np.mean(points.transpose()[1] )\n]\nP\n\
  ```\n\n输出如下：\n\n`[1.3333333333333333, 1.5]`\n\n6. 现在新的均值已计算，我们可以再次检索给定半径内的点：\n\n\
  ```python\npoints = np.array([\n    p0 for p0 in data_points if distance.euclidean(\
  \ p0, P) <= r\n])\npoints\n```\n\n输出如下：\n\n```\narray([[1. , 1. ],\n    [1. , 1.5],\n\
  \    [2. , 2. ]])\n```\n\n7. 这些是相同的三个点，所以我们可以在这里停止。三个点已围绕均值 `[1.3333333333333333,\
  \ 1.5]` 找到。半径为 2 的该中心周围的点形成一个聚类。\n\n8. 如果我们检查数据点 `[1, 1.5]` 和 `[2, 2]`，我们会得到相同的结果。让我们继续使用列表中的第四个点，`[8,\
  \ 1]`：\n\n`P = [8, 1]`\n\n```python\npoints = np.array( [\n    p0 for p0 in data_points\
  \ if distance.euclidean(p0, P) <= r\n])\npoints\n```\n\n输出如下：\n\n```\narray([[8.\
  \ , 1. ],\n    [8. , 0. ],\n    [8.5, 1. ],\n    [6. , 1. ]])\n```\n\n9. 这次，所有四个区域内的点都被找到了。因此，我们可以简单地计算它们的均值：\n\
  \n```python\nP = [\n    np.mean(points.transpose()[0]),\n    np.mean(points.transpose()[1])\n\
  ]\n```\n\n输出如下：\n\n`[7.625, 0.75]`\n\n这个均值不会改变，因为在下一次迭代中，我们会找到相同的数据点。\n\n10. 注意我们选择点\
  \ `[8, 1]` 很幸运。如果我们从 `P = [8, 0]` 或 `P = [8.5, 1]` 开始，我们只会找到三个点而不是四个：\n\n`P = [8,\
  \ 0]`\n\n```python\npoints = np.array([\n    p0 for p0 in data_points if distance.euclidean(p0,\
  \ P) <= r\n])\npoints\n```\n\n输出如下：\n\n```\narray([[8. , 1. ],\n    [8. , 0. ],\n\
  \    [8.5, 1. ]])\n```\n\n11. 计算这三个点的均值后，我们必须使用移动后的均值重新运行距离计算：\n\n```python\nP =\
  \ [\n    np.mean(points.transpose()[0]),\n    np.mean(points.transpose()[1])\n]\n\
  P\n```\n\n输出如下：\n\n`[8.166666666666666, 0.6666666666666666]`\n\n12. 点 `P = [8.5,\
  \ 1]` 的输出如下数组：\n\n```\narray([[8. , 1. ],\n    [8. , 0. ],\n    [8.5, 1. ]])\n```\n\
  \n我们再次只找到了相同的三个点。这意味着从 `[8,1]` 开始，我们得到的聚类比从 `[8, 0]` 或 `[8.5, 1]` 开始的大。因此，我们必须采用包含数据点数量最多的中心点。\n\
  \n13. 现在，让我们检查如果我们从第四个数据点 `[6, 1]` 开始发现会发生什么：\n\n`P = [6, 1]`\n\n```python\npoints\
  \ = np.array([\n    p0 for p0 in data_points if distance.euclidean(p0, P) <= r\n\
  ])\npoints\n```\n\n输出如下：\n\n```\narray([[8., 1.],\n    [6., 1.]])\n```\n\n14. 我们成功找到了数据点\
  \ `[8, 1]`。因此，我们必须将均值从 `[6, 1]` 移动到计算出的新均值 `[7, 1]`：\n\n```python\nP = [\n    np.mean(points.transpose()[0]),\n\
  \    np.mean(points.transpose()[1])\n]\nP\n```\n\n输出如下：\n\n`[7.0, 1.0]`\n\n15. 让我们检查是否找到了更多点：\n\
  \n```python\npoints = np.array([\n    p0 for p0 in data_points if distance.euclidean(p0,\
  \ P) <= r\n])\npoints\n```\n\n输出如下：\n\n```\narray([[8. , 1. ],\n    [8. , 0. ],\n\
  \    [8.5, 1. ],\n    [6. , 1. ]])\n```\n\n是的——我们成功找到了全部四个点！因此，我们已成功定义了一个大小为 4 的聚类。均值将与之前相同：`[7.625,\
  \ 0.75]`。\n\n这是一个简单的聚类示例，应用了 mean shift 算法。我们只提供了一个说明算法如何考虑找到聚类的示例。还有一个剩余的问题，那就是半径的值。\n\
  \n请注意，如果半径 2 未设置，我们可以简单地从包含所有数据点的巨大半径开始，然后减小半径，或者从非常小的半径开始，确保每个数据点都在其自己的聚类中，然后增加半径，直到我们得到所需的结果。\n\
  \n### Mean Shift Algorithm in scikit-learn\n\n让我们使用与 k-means 算法中相同的 data points：\n\
  \n```python\nimport numpy as np\n\ndata_points = np.array([\n```\n\n\n\n\n\n```\n\
  [1, 1],\n[1, 1.5],\n[2, 2],\n[8, 1],\n[8, 0],\n[8.5, 1],\n[6, 1],\n[1, 10],\n[1.5,\
  \ 10],\n[1.5, 9.5],\n[10, 10],\n[1.5, 8.5]\n```\n\n均值偏移（mean shift）聚类算法的语法与 k-means\
  \ 聚类算法相似。\n\n```python\nfrom sklearn.cluster import MeanShift\n\nmean_shift_model\
  \ = MeanShift()\n\nmean_shift_model.fit(data_points)\n```\n\n聚类完成后，我们可以访问每个类的中心点：\n\
  \n`mean_shift_model.cluster_centers_`\n\n输出如下：\n\n```\narray([[ 1.375 , 9.5 ],\n\
  \ [ 1.33333333, 1.5 ],\n [ 8.16666667, 0.66666667],\n [ 6. ],\n [ 10. , 10. ])\n\
  ```\n\n均值偏移模型通过上述代码找到了 5 个聚类中心。\n\n与 k-means 类似，我们也可以获取标签：\n\n`mean_shift_model.labels_`\n\
  \n输出如下：\n\n```\narray([1, 1, 1, 2, 2, 3, 0, 0, 0, 4], dtype=int64)\n```\n\n输出数组显示了数据点属于哪个聚类。我们需要绘制这些数据：\n\
  \n```python\nplot.scatter(\n    mean_shift_model.cluster_centers_:,0],\n    mean_shift_model.cluster_centers_:,1]\n\
  )\n\nfor i in range(len(data_points)):\n    plot.plot(\n        data_points[i][0],\n\
  \        data_points[i][1],\n        ['ro','go','yo', 'mo'][mean_shift_model.labels_[i]]\n\
  \    )\n\nplot.show()\n```\n\n输出如下：\n\n![](img/Image0061.jpg)\n\n#### 图 6.7：基于 k-means\
  \ 的图，\n\n三个点是红色、绿色和黄色聚类的中心点。在坐标系统中还有两个单点，属于 (6,1) 和 (10,10)。\n\n### Python 中的图像处理\n\
  \n为了完成后续活动，你需要了解如何在 Python 中处理图像。我们将使用 PIL 库来实现。有多种方法可以从路径读取图像，最简单的方法是使用 `Image`\
  \ ：\n\n```python\nfrom PIL import Image\n\nimage = Image.open('file.jpg')\n```\n\
  \n上述代码假设 `open` 方法的字符串参数是一个有效的图像文件。\n\n通过查询 `size` 属性获取图像的大小：\n\n`image.size`\n\n\
  输出如下：\n\n`(750, 422)`\n\n我们可以从图像创建一个包含每个像素 RGB 值的二维数组：\n\n```python\nimport numpy\
  \ as np\npixel_array = np.array(image)\n```\n\n一旦构建了像素数组，就可以轻松地检索和操作每个像素：\n\n`pixel_array`\n\
  \n输出如下：\n\n```\narray([29, 33, 32], dtype=uint8)\n```\n\n图像的像素也可以使用图像的 `load()`\
  \ 方法来访问。一旦获取这些像素，我们可以获取每个像素的 RGBA 值，格式如下：\n\n```python\npixels = image.load()\n\
  ```\n\n`pixels`\n\n输出如下：\n\n`(29, 33)`\n\n注意像素坐标的顺序是反的，与读取的 `pixel_array` 不同。我们也可以为像素设置新值：\n\
  \n`pixels[7][4] = (255, 0, 0)`\n\n如果你想保存更改，使用图像的 `save()` 方法：\n\n```python\nimage.save('test.jpg')\n\
  ```\n\n对像素进行聚类分析，将其转换为 DataFrame。这意味着我们需要将图像转换为元组或数组。一旦有了这些值的一维数组，就可以将其转换为 pandas\
  \ DataFrame：\n\n```python\nimport pandas\ndata_frame = pandas.DataFrame(\n    [pixels[x][y]\
  \ for x in range(image.size[0])\n    for y in range(image.size[1])],\n    columns=['x',\
  \ 'y', 'r', 'g', 'b']\n)\n\ndata_frame.head()\n```\n\n输出如下：\n\n```\n   x  y  r \
  \ g  b\n0  0  0 29 71\n1  0  1 32 73\n2  0  2 37 77\n3  0  3 41 82\n4  0  4 45 84\n\
  ```\n\n这就是使用均值偏移算法处理图像活动所需的所有知识。\n\n#### 活动 13：使用均值偏移算法进行形状识别\n\n在本节中，我们将学习如何对图像进行聚类。假设你正在一家通过照片检测人类情绪的公司工作。你的任务是提取组成人脸的像素。\n\
