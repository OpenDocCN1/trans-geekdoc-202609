  \n1. 使用线性回归处理 `2001` 年到 `2018` 年的数据。\n2. 使用 `np.polyfit` 确定回归系数。\n3. 使用 `matplotlib.pyplot`\
  \ 绘制结果。\n\n### 多个变量的线性回归\n\n在上一个主题中，我们处理了单变量的线性回归。现在我们将学习线性回归的扩展版本，使用多个输入变量来预测输出。我们将依赖示例来预测股票价格。\n\
  \n#### 多线性回归\n\n如果你记得线性回归的拟合公式，它定义为 `y = a*x + b`，其中 `a` 是直线的斜率，`b` 是直线的截距，`x` 是特征值，`y`\
  \ 是计算标签。在多元回归中，假设我们有三个特征 `x1`、`x2` 和 `x3`，我们的模型变为：\n\n`y = a1*x1 + a2*x2 + a3*x3`\n\
  \n在 `NumPy` 数组格式中，我们可以这样写方程：\n\n```python\ny = np.dot(np.array([a1, a2, a3]), np.array([x1,\
  \ x2, x3])) + b\n```\n\n为了方便，以向量乘法的形式定义整个方程是合理的。多线性回归是向量的点积，系数 `b`、`a1`、`a2` 决定了空间中的拟合方程。执行此操作的\
  \ `NumPy` 函数称为 `dot`：\n\n```python\nimport numpy as np\nv1 = [1, 2, 3]\nv2 = [4,\
  \ 5, 6]\nnp.dot(v1, v2) = 1*4 + 2*5 + 3*6 = 32\n```\n\n我们只需计算相应坐标的积。我们可以通过最小化数据点与方程之间的误差来确定这些系数。为了简单，我们将省略拟合方程的数学解，改用\
  \ `scikit-learn`。\n\n##### 注意\n\n在 n 维空间中，当 n 大于 3 时，维度决定了模型中不同的变量。在前面的示例中，我们有三个特征和一个标签，产生了四个维度。如果你想想象四维空间，可以简化为三维时间和时间。五维空间可以想象为四维空间，其中每个时间点都有温度。维度只是特征（以及标签）；它们并不对应我们三维空间的概念。\n\
  \n#### 线性回归的过程\n\n我们将遵循以下简单步骤解决线性回归问题：\n\n1. 从数据源加载数据。\n2. 为预测准备数据（归一化、格式化、过滤）。\n\
  3. 计算回归线的参数。无论使用单变量还是多变量线性回归，都遵循这些步骤。\n\n#### 从数据源导入数据\n\n有多个库可以让我们访问数据源。由于我们将处理股票数据，让我们涵盖两个获取金融数据的示例：Quandl\
  \ 和 Yahoo Finance：\n\n*   `scikit-learn` 带有一些可以用于练习技能的数据集。\n*   `Quandl.com` 提供免费和付费的金融数据集。\n\
  *   `pandas.io` 帮助加载任何 `.csv`、`.excel`、`.json` 或 `SQL` 数据。\n*   Yahoo Finance 提供数据集。\n\
  \n#### 使用 Yahoo Finance 加载价格\n\n使用 Yahoo Finance 加载股票数据非常简单。你只需要在 CLI 中以下命令安装 `fix_yahoo_finance`\
  \ 包：\n\n```bash\npip install fix_yahoo_finance\n```\n\n我们将下载一个包含从 2015 年开始的标普 500\
  \ 指数的开盘、最高、最低、收盘、调整收盘和成交量的数据集：\n\n```python\nimport fix_yahoo_finance as yahoo\n\
  spx_data_frame = yahoo.download(\"^GSPC\", \"2015-01-01\")\n```\n\n这就是你所需要的。包含标普\
  \ 500 指数的 dataframe 已经就绪。你可以使用 `plot` 方法绘制指数价格：\n\n```python\nspx_data_frame.Close.plot()\n\
  ```\n\n##### 图 3.15: Yahoo Finance 显示股票价格的图\n\n也可以使用以下命令将数据保存到 CSV 文件：\n\n```python\n\
