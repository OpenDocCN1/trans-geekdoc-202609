- "# 人工智能与机器学习基础：利用最新 AI 进展开发现实世界应用\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n### 关于\n\n本节简要介绍了作者、本书涵盖的内容、你入门所需的所需的技能，以及完成书中书中包含的所有活动和练习所需的所需的硬件和软件要求。\n\
  \n### 关于本书\n\n机器学习和神经网络正迅速成为你构建智能应用程序的支柱。本书将从介绍 Python 开始，并讨论 AI 搜索算法的用法。你将学习一些数学性较强的主题，如回归和分类，并结合\
  \ Python 示例对其进行说明。\n\n随后，你将进阶学习 AI 技术和概念，并在真实数据集上工作以形成决策树和聚类。你将接触神经网络，这是一种强大的工具，得益于摩尔定律在\
  \ 21 世纪计算能力上的应用。读完本书后，你将充满信心，并期待用新学的技能构建你自己的 AI 应用！\n\n#### 关于作者\n\nZsolt Nagy 是一家数据科学密集型广告科技公司的工程经理。在获得本体论推理的硕士学位后，他主要使用\
  \ AI 分析在线扑克策略，以帮助职业扑克玩家做出决策。在扑克热潮结束后，他投入精力在领导力和软件工程方面培养自己的“T 型”人才结构。\n\n#### 目标\n\
  \n*   理解 AI 的重要、原理和领域\n*   学习如何使用 Python 实现用于路径规划和破解游戏的基础工智能\n*   在 Python 中实现应用于真实问题的回归和分类练习\n\
  *   在 Python 中使用决策树和随机森林进行预测分析\n*   在 Python 中使用聚类算法进行聚类\n\n#### 目标读者\n\n如果你希望通过机器学习来丰富你的个人或职业项目，或者想成为数据科学家，那么本书适合你。不需要\
  \ AI 经验，但需要基础数学知识。虽然本书是 AI 入门级，但中级学生也将受益。\n\n#### 方法\n\n本书通过实践的方法教授人工智能。\n\n###\
  \ 硬件要求\n\n为了获得最佳体验，我们建议以下配置：\n\n*   处理器：Intel i5 或同等水平\n*   内存：8 GB\n*   存储：3 GB\n\
  \n### 软件要求\n\n要开始本书，你需要：\n\n*   操作系统：Windows 7 SP1、Ubuntu Linux 或 macOS\n*   浏览器：Google\
  \ Chrome\n*   Anaconda（最新版本）\n\n### 安装与设置\n\n在开始本书之前，你需要安装 Anaconda。要安装 Anaconda，请点击：[`www.anaconda.com/download/`](https://www.anaconda.com/download/)。\n\
  \n#### 安装 Python\n\n按照此说明安装 Python：[`realpython.com/installing-python/`](https://realpython.com/installing-python/)。\n\
  \n#### 规范\n\n为了避免包冲突，我们使用：\n\n```python\nfrom sklearn.pairwise import euclidean_distances\n\
  ```\n\n常见的激活函数有 `sigmoid` 和 `tanh`。\n\n#### 启动 Anaconda\n\n你可以在开始菜单中找到已安装的 Anaconda。如果你在开始本书之前已安装了\
  \ Anaconda，可以选择升级。最干净的方法是卸载并重新安装。\n\nAnaconda Navigator 提供了本书所需的大部分工具。选择右上选项启动 `IPython`。\n\
  \nJupyter Notebook 是你运行书中 Python 代码的地方。\n\n#### 额外资源\n\n本书的代码包也托管在 GitHub 上：https://github.com/TrainingByPackt/Artificial-Intelligence-and-Machine-Learning-Fundamentals。\n\
  \n我们丰富的书籍和视频目录中还有其他代码包，可以在[`github.com/PacktPublishing/`](https://github.com/PacktPublishing/)\
  \ 获取。去看看！\n\n1\n\n#人工智能原理\n\n### 学习目标\n\n完成本章后，你将能够：\n\n*   描述 AI 的各个领域\n*   解释\
  \ AI 中使用的主要的学习模型\n*   解释为什么 Python 是 AI 项目的热门语言\n*   为给定的游戏状态空间建模\n\n在本章中，你将学习 AI\
  \ 的目的、领域和应用，并对我们将在 Python 中用到的功能进行简要总结。\n\n### 引言\n\n\n\n\n在讨论不同的 AI 技术和算法之前，我们先来了解人工智能和机器学习的基础知识，并回顾几个基本定义。然后，我们将通过生动浅出的的例子继续深入本书。我们将使用现实世界的案例，以易于易懂的方式介绍人工智能的基本概念。\n\
  \n如果你想在某个领域成为专家，你必须对基础知识非常熟悉。因此，让我们从理解什么是人工智能开始：\n\n**定义**：人工智能（AI）是一门利用硬件和软件解决方案来构建智能的科学。\n\
  \n它的灵感源于逆向工程，例如人类大脑中神经元的工作方式。我们的大脑由神经元的微单元组成，神经元网络被称为`neural networks`（神经网络）。除了神经网络，神经科学中许多其他模型可以用于解决人工智能中的现实世界问题。\n\
  \n机器学习是一个经常与人工智能混淆的术语。它起源于 20 世纪 50 年代，由亚瑟·李·塞缪尔（Arthur Lee Samuel）于 1959 年首次定义。\n\
  \n**定义**：机器学习是一项关于赋予计算机无需显式编程即可学习能力的研究领域。\n\n汤姆·米切尔（Tom Mitchell）提出了一个更具数学精确性的机器学习定义。\n\
  \n**定义**：如果一个计算机程序对于任务 `T` 和性能衡量标准 `P`，其通过 `P` 衡量的 `T` 性能随着经验 `E` 的增加而提高，则称该程序从经验\
  \ `E` 中学习。\n\n从这两个定义中我们可以得出结论：机器学习是实现人工智能的一种方式。然而，你可以在没有机器学习的情况下拥有人工智能。例如，如果你硬编码规则和决策树，或者应用搜索技术，你就创建了一个人工智能智能体，尽管你的方法与机器学习几乎没有关系。\n\
  \n#### AI 如何解决现实世界问题？\n\n**人工智能根据人类大脑处理信息的方式，使人类智能自动化。**\n\n每当我们解决问题或与人互动时，我们都会经历一个过程。当我们限制问题或互动的范围时，这个过程通常可以被建模和自动化。\n\
  \n**AI 让计算机看起来像人类一样在思考。**\n\n有时，感觉 AI 知道我们需要什么。想一下你在在线购物后收到的个性化优惠券。在本书结束时，你将理解要选择最成功的产品，你需要被展示如何最大化你的购买——这是一个相对简单的任务。然而，它也是如此高效，以至于我们经常认为计算机“知道”我们需要什么。\n\
  \n**AI 是由执行底层指令的计算机执行的。**\n\n尽管一个解决方案看起来是智能的，但我们编写代码就像编写任何其他软件解决方案一样。即使我们在模拟神经元，也是由简单的机器码和计算机硬件在执行“思考”过程。\n\
  \n大多数 AI 应用有一个主要目标。当我们与 AI 应用交互时，它看起来像人类，是因为它可以将问题领域限制在一个主要目标上。因此，我们有机会在底层计算机指令的帮助下分解复杂过程并模拟智能。\n\
  \n**AI 可以为特定领域刺激人类的感官和思考过程。**\n\n我们必须模拟人类的感官和思想，有时甚至欺骗 AI 相信我们正在与人类互动。在特殊情况下，我们甚至可以增强自己的感官。\n\
  \n同样，当我们与聊天机器人互动时，我们期望机器人理解我们。我们期望聊天机器人甚至语音识别系统让计算机理解我们。\n\n#### 学科的多样性\n\n为了创建智能机器，涉及到不同的学科。例如：\n\
  \n- `Robotics`（机器人学）：移动物体\n- `Algorithm Theory`（算法理论）：创建算法\n- `Statistics`（统计学）：得出结果并预测未来\n\
  - `Psychology`（心理学）：模拟人类大脑的工作方式\n- `Software Engineering`（软件工程）：创建可维护的解决方案\n- `Computer\
  \ Science or Computer Programming`（计算机科学或计算机编程）：实现\n- `Mathematics`（数学）：执行复杂操作\n\
  - `Control Theory`（控制理论）：创建前馈和反馈系统\n- `Information Theory`（信息论）：表示、解码和压缩信息\n- `Graph\
  \ Theory`（图论）：优化点\n- `Physics`（物理学）：模拟现实世界\n- `Computer Graphics and Image Processing`（计算机图形与图像处理）：显示和处理图像\n\
  \n在本书中我们将涵盖其中的一些领域。现在我们知道了什么是人工智能，让我们继续研究 AI 应用的不同领域。\n\n### 人类行为模拟\n\n人类有五种基本感官，分为视觉、听觉、触觉、嗅觉和味觉。然而，为了创建机器的目的，我们可以将学科划分如下：\n\
  \n- 听与说\n- 理解语言\n- 记忆事物\n- 思考\n- 观察\n- 移动\n\n其中一些领域超出了我们的范围，因为本书的目的是理解基础知识。例如，为了移动机械臂，我们需要学习大学水平的数学。\n\
  \n#### 听与说\n\n通过语音识别系统，AI 可以收集信息。通过语音合成，它可以将内部数据转换为可理解的声音。语音识别和语音合成技术处理人类发出或人类可以理解的声音的识别和构建。\n\
  \n想象你正在一个你不通语言的国家旅游。你可以对着手机的麦克风说话，期望它能“理解”你说的话，然后将其翻译成另一种语言。反过来也一样，当地人说话，AI 将声音翻译成你听懂的语言。语音识别和语音合成使这一切成为可能。\n\
  \n##### 注意\n\n语音合成的一个例子是谷歌翻译。你可以访问 `https://translate.google.com/`，通过点击翻译单词下方的扬声器按钮让翻译器说非英语单词。\n\
  \n#### 理解语言\n\n我们可以通过处理自然语言来理解它。这个领域被称为自然语言处理，简称 `NLP`。在涉及自然语言处理时，我们倾向于基于统计学习来学习语言。\n\
  \n#### 记忆事物\n\n我们需要表示我们对世界认知的事物。这就是创建知识库和层次化表示（本体论）发挥作用的地方。本体论对我们世界中的事物和思想进行分类，并包含这些类别之间的关系。\n\
  \n#### 思考\n\n\n\n\n我们的 AI 系统必须通过使用专家系统成为特定领域的专家。`expert system`（专家系统）可以基于确定性的数学逻辑，也可以基于模糊的、非确定性的逻辑。\n\
  \n专家系统的知识库使用不同的技术来表示。随着问题范围的扩大，我们创建了层次化的本体。\n\n我们可以通过对大脑的构建块进行建模来复制这种结构。这些构建块被称为\
  \ `neurons`（神经元），而网络本身被称为 `neural network`（神经网络）。\n\n另一个你需要连接到神经网络的关键术语是：`deep learning`（深度学习）。`Deep\
  \ learning` 之所以深度，是因为它超越了模式识别和分类。学习被刻在网络的结构中。例如，一项特殊的深度学习任务是使用 `computer vision`\
  \ 进行 `object recognition`。\n\n### 视觉\n\n我们必须通过感官与现实世界进行交互。在语音识别和合成方面，我们目前只触及了听觉。如果我们必须看到东西呢？那么，我们就必须创建\
  \ `computer vision` 技术来学习我们的环境。毕竟，识别人脸很有用，而且大多数人在这方面的专家。\n\n计算机视觉依赖于 `image processing`（图像处理）。尽管\
  \ `image processing` 并不是一门直接的 AI 学科，但它是 AI 必备学科。\n\n### 移动\n\n移动和触摸对我们人类来说是自然的，但对计算机来说是非常复杂的任务。移动由\
  \ `robotics`（机器人学）处理。这是一个非常注重数学的话题。\n\n机器人学基于 `control theory`（控制理论），你创建一个反馈回路，并根据收集到的反馈来控制对象的移动。有趣的是，`control\
  \ theory` 也应用于与空间物体移动完全无关的其他领域。这是因为所需的反馈回路与经济学中建模的非常相似。\n\n### 模拟智能 – 图灵测试\n\n`Turing\
  \ machine`（图灵机）的发明者 Alan Turing 是算法理论中使用的抽象概念提出了一种测试智能的方法。这种测试在 AI 文献中被称为 `Turing\
  \ test`（图灵测试）。\n\n使用文本接口，提问者与人类和一个机器人聊天。机器的任务是误导提问者，直到他们无法判断计算机是人还是机器。\n\n我们需要哪些学科才能通过\
  \ `Turing test`？\n\n首先，我们需要理解口语语言以知道提问者说什么。我们通过使用 `Natural Language Processing`\
  \ (`NLP`，自然语言处理）来实现这一点。我们还需要做出回应。\n\n我们需要成为人类大脑倾向于感兴趣的事物的专家。我们需要建立一个人类的 `Expert\
  \ System`（专家系统），涉及我们世界上物体和抽象思想的分类，以及历史事件甚至情感。\n\n通过 `Turing test` 非常困难。目前的预测表明，直到\
  \ 2020 年代后期，我们才能够创建一个足够通过 `Turing test` 的系统。更进一步，如果这还不够，我们可以迈向 `Total Turing Test`（全图灵测试），它还包含了移动和视觉。\n\
  \n### AI 工具和学习模型\n\n在之前的几个章节中，我们发现了人工智能的基础。人工智能的核心任务之一是学习。\n\n#### 智能体\n\n在解决 AI\
  \ 问题时，我们在环境中创建一个执行者，它可以从周围环境收集数据并影响其周围环境。这个执行者被称为 `intelligent agent`（智能体）。\n\n\
  一个 `intelligent agent`：\n\n*   观察周围环境\n*   在环境中行动\n*   从周围收集数据\n*   影响周围环境\n\n###\
  \ 学习模型\n\nAI 学习的过程可以通过监督或无监督的方式进行。`Supervised learning`（监督学习）基于标记数据并从训练数据中推断函数。`Linear\
  \ regression`（线性回归）是其中一个例子。`Unsupervised learning`（无监督学习）基于未标记数据，通常用于聚类分析。\n\n####\
  \ 分类与预测\n\n不同的目标需要不同的过程。让我们探索最流行的 AI 类型：`classification`（分类）和 `prediction`（预测）。\n\
  \n`Classification` 是弄清事情的过程。`Prediction` 是基于模式预测事情的过程。\n\n### Python 在人工智能中的作用\n\
  \n为了将基础 AI 概念付诸实践，我们需要支持人工智能的编程语言。在书中，我们选择了 `Python`。有几个原因使 `Python` 成为很好的选择：\n\n\
  *   `Python` 是一种 `high-level programming language`（高级编程语言）。这意味着你不需要担心内存分配、指针或机器码。你可以用方便的方式编写代码并依赖\
  \ `Python` 的健壮性。\n*   `Python` 同样 `cross-platform compatible`（跨平台）。\n*   对 `developer\
  \ experience`（开发者体验）的高度重视使得 `Python` 在软件开发者中非常受欢迎。事实上，根据 [`www.hackerrank.com`](https://www.hackerrank.com)\
  \ 2018 年的开发者调查，在所有年龄段中，`Python` 位列第一首选语言。这是因为 `Python` 易于阅读且简单。因此，`Python` 非常适合\
  \ `rapid application development`（快速应用开发）。\n*   尽管是一种解释型语言，`Python` 与数据科学中使用的其他语言（如\
  \ `R`）相比并不逊。它的主要优势是 `memory efficiency`（内存效率），因为 `Python` 可以处理大型内存数据库。\n\n#####\
  \ 注意\n\n`Python` 是一种多用途语言。它可以用于创建桌面应用程序、数据库应用程序、移动应用程序以及游戏。`Python` 的网络编程特性也值得一提。此外，`Python`\
  \ 是一个优秀的原型设计工具。\n\n\n\n\n\n## Python 中的 Anaconda\n\n我们在前言中已经安装了 Anaconda。在进行人工智能实验时，Anaconda\
  \ 将是我们的首选工具。\n\n这个列表目前还不是不完整的，因为 Anaconda 中有 700 多个可用库。然而，如果你熟悉这些库，那么你就有了一个良好的开始，因为你将能够在\
  \ Python 中实现基础的 AI 算法。\n\nAnaconda 将包、IDE、数据可视化库以及用于并行计算的高性能工具整合在了一起。Anaconda 隐藏了配置问题以及维护数据科学、机器学习和人工智能技术栈的复杂性。这一特性在\
  \ Windows 系统上特别有用，因为该系统最容易出现版本不匹配和配置问题。\n\nAnaconda 自带了 `IPython` 控制台，你可以在其中以文档风格编写代码和注释。当你尝试\
  \ AI 特性时，你的思路流就像一个交互式教程，你可以逐步运行代码的每一步。\n\n### Note 事项\nIDE 代表集成开发环境（Integrated Development\
  \ Environment）。虽然文本编辑器提供了一些高亮和格式化代码的功能，但 IDE 的功能超越了文本编辑器，它提供了自动重构、测试、调试、打包、运行和部署代码的工具。\n\
  \n## 用于人工智能的 Python 库\n\n这里列出的库列表并不完整，因为 Anaconda 中有 700 多个可用库。然而，这些特定的库将让你有一个良好的开始，因为它们将为你在\
  \ Python 中实现基础 AI 算法提供良好的基础：\n\n*   `NumPy`: `NumPy` 是一个用于 Python 计算库。由于 Python\
  \ 没有内置的数组数据结构，我们必须使用库来高效地模拟向量和矩阵。在数据科学中，我们需要这些数据结构来执行简单的数学运算。我们将在后续模块中大量使用 `NumPy`。\n\
  *   `SciPy`: `SciPy` 是一个包含数据科学算法的高级库。它是 `NumPy` 的极佳补充，因为它提供了你所需的所有高级算法，无论是种。\n*\
  \   `pandas`: `pandas` 提供了快速、灵活且表达丰富的数据结构，例如一维的 series 和二维 `DataFrames`。它能高效地加载、格式化和处理不同类型的复杂表格。\n\
  *   `scikit-learn`: `scikit-learn` 是 Python 主要的机器学习库。它基于 `NumPy` 和 `SciPy` 库。`scikit-learn`\
  \ 提供了执行分类、回归、数据预处理以及监督学习和无监督学习所需的功能。\n*   `NLTK`: 本本书不会涉及自然语言处理，但 `NLTK` 仍然值得提及，因为它是\
  \ Python 主要自然语言工具包。你可以使用该库进行分类、分词、词干提取、标记、解析、语义推理以及许多其他服务。\n*   `TensorFlow`: `TensorFlow`\
