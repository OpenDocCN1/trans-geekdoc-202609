  \    if is_maximizing:\n        utility = 0\n        for s in successors(state):\n\
  \            score = min_max(s, depth - 1, false, alpha, beta)\n            utility\
  \ = max(utility, score)\n        alpha = max(alpha, score)\n        if beta <= alpha:\
  \ break\n        return utility\n    else:\n        utility = infinity\n       \
  \ for s in successors(state):\n            score = min_max(s, depth - 1, true, alpha,\
  \ beta)\n            utility = min(utility, score)\n            beta = min(beta,\
