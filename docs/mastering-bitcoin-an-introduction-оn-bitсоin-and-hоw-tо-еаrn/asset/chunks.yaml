    Maintaining multi-addresses and setting up addresses requires personal information.
    The DLT technology makes Bitcoin completely transparent; it stores complete details
    by an address of every transaction that ever occurs.


    Transfers of Bitcoin are immediate and once made, they are final. At the same
    time, there are limited fees and international and domestic transfers are not
    subject to foreign currency exchange rates and fees for transfer. There are no
    borders when it comes to Bitcoin.


    ## IS BITCOIN A COMMODITY?


    The CFTC’s designation came as a response to a Bitcoin exchange that was offering
    derivative contracts or options on the value of the cryptocurrency. However, Bitcoin
    is one of those assets that does not quite fit well into any definition and a
    historical understanding of what is a currency and what is a commodity sheds light
    on the argument.


    Throughout the course of history, many commodities and even some manufactured
    products have served as currency. Probably the best examples are gold and silver.
    Gold and silver were not only used as a medium of exchange, or currencies for
    thousands of years, they were backing many paper currencies around the world until
    only recently. Central banks and monetary authorities around the world continue
    to hold vast gold reserves and categorize their holdings as “foreign exchange
    reserves.” Therefore, both gold and silver can be thought of in the same class
    as Bitcoin.


    Moreover, over the course of history salt served as a medium of exchange in ancient
    times. More recently, cigarettes or blue jeans have been employed as currency
    in certain areas of the world over recent decades. As you can see, the classification
    of Bitcoin as a commodity is both dubious and understandable, at the same time.
    It is hard categorized because it is so new and different from other assets available
    to market participants. One thing seems certain, the growth of interest in the
    cryptocurrency over recent years means that it is an asset that deserves our attention.


    ## BITCOIN TRANSACTIONAL PROPERTIES


    ### Fast and global

    The transaction is propagated nearly instantly in the network and are confirmed
    in a couple of minutes. Since they happen in a global network of computers they
    are completely indifferent of your physical location. It doesn’t matter if I send
    Bitcoin to my neighbor or to someone on the other side of the world.


    ### Secure

    Bitcoin funds are locked in a public cryptography system. Only the owner of the
    private key can send cryptocurrency. Strong cryptography and the magic of big
    numbers makes it impossible to break this scheme. A Bitcoin address is more secure
    than Fort Knox.


    ### Pseudonymous

    Neither transactions or accounts are connected to real-world identities. You receive
    Bitcoin on so-called addresses, which are randomly seeming chains of around 30
    characters. While it is usually possible to analyze the transaction flow, it is
    not necessarily possible to connect the real world identity of users with those
    addresses.


    ### Permissionless

    You don’t have to ask anybody to use cryptocurrency. It’s just a software every
    can download for free. After you installed it, you can receive and send Bitcoin
    or other currencies. No one can prevent you.


    ### Irreversible

    After confirmation, a transaction can’t be reversed. By nobody. Not your bank,
    not the State, not your miner. If you send money, you send it. No can help you,
    if you sent funds to a scam or if hacker stole them.


    ## WHAT ARE BITCOINS AND


    Bitcoins have a way to go before becoming a serious alternative to existing transactions,
    but provide real advantage to users:


    ### Direct transfers for immediate settlement

    Purchasing real typically involves a number of parties, and payment of fees. In
    many ways, the bitcoin is like a “property rights.” Bitcoin contracts can be designed
    and eliminate third parties, or completed at a future date for a fraction of the.


    ### Access to historically markets

    There are approximately 2.2 billion individuals with access to the Internet or
    mobile phones who don’t currently have access to exchanges. These individuals
    are for the bitcoin market. Kenya’s M-PESA system, a mobile phone-based money
    transfer, and financing service announced a bitcoin device, with one in now owning
    a wallet.


    ### Protection from Payment Fraud

    Bitcoins are digital and cannot be counted or reversed by the sender, as with
    credit card chargebacks.


    ### Reduced possibility of Identity Theft

    When you give your credit card to a merchant, you give him or her access to your
    credit line, even if the transaction is for small amount. Credit cards operate
    on a “pull” basis, where the store initiates the payment and pulls designated
    amount from your account. Bitcoins use a “push” mechanism that allows the bitcoin
    holder to send exactly what he or she wants to the merchant or recipient with
    no further information. Furthermore, bitcoins do not require names – just wallet
    IDs.


    ### Lower Fees

    There aren’t usually transaction fees for bitcoin exchanges because the bitcoin
    miner is compensated by the network with newly issued bitcoins. Even though there’s
    no bitcoin transaction fee, many observers expect that most users will engage
    a third-party service, such as Coinbase, in lieu of creating and maintaining their
    own bitcoin wallets. These services act like Paypal does for cash or credit card
    users, providing the online exchange system for bitcoin, and as such, they’re
    likely to charge fees. It’s interesting to note that Paypal does not accept or
    transfer bitcoins.


    ## LIMITATIONS & RISKS OF BITCOINS


    Critiques of bitcoins range from noted economist and “New York Times” writer Paul
    Krugman, to advocates for bitcoin say: “Most of them are. They don’t trust inflation.
    They don’t trust the government. They don’t trust central banks.” They, and others
    raise a number of concerns, some of which are for the.


    ### Financing illegal and activities

    Some believe the area of bitcoin is that it can be used for illegal. According
    to Mercury Tundall of LLP, “Bitcoin has built its reputation anti-establishment.”


    On October 2, 2013, the FBI closed the famous website Silk Road, seizing more
    than 144,000 BTC worth $28 million. According to Paul Smith, president of BITS
    (the technology policy division), Silk Road was “an operation that was allegedly
    used to anonymously buy sell drugs, offer guns for sale, and provide tutorials
    for hacking machines.”

