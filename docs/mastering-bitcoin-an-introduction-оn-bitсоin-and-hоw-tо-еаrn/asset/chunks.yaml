    除此之外，加密货币领域一直在不断扩张，对于加密货币社区的任何人来说，下一个大数字代币明天可能发布。在市值、用户群和人气方面，比特币继续在加密货币中处于领先地位。


    以太坊（ethereum）和波币（ripple）等虚拟货币正越来越多用于企业解决方案并变得流行。一些代币因其相对于比特币更优或更先进的特性而受到推崇。加密货币的设计几乎总是为了不受政府的操纵和控制，尽管随着它们的流行，这一行业的基础性方面已受到质疑。模仿比特币的货币统称为替代代币（altcoins），它们试图将自己呈现为比特币的修改或改进版本。虽然其中某些货币比比特币更容易开矿，但存在权衡，包括流动性较低、认可度和价值留存能力下降带来的更大风险。在下，我们将审查比特币之外的一些重要数字货币。首先，需要说明的是：这样的列表是不可能完全涵盖的。原因之一是，截至本文撰写时，已经存在超过
    1600 种加密货币，其中许多代币和货币在忠实（尽管某些情况下规模很小）的支持者和投资者群体中享有极高人气。除此之外，加密货币领域一直在不断扩张，对于加密货币社区的任何人来说，下一个大数字代币明天可能发布。虽然比特币被广泛视为加密货币世界的先驱，但分析师采用许多方法来评估
    BTC 以外的代币。例如，分析师经常会将代币之间市值的排名赋予很大重要。我们已将其纳入考虑范围，但还有其他原因导致某个数字代币被纳入列表中。


    ### 比特币现金 (BCH)

    比特币现金在替代代币的历史占据着重要地位，因为它是原始比特币最早且最成功的叉之一。在加密货币世界，分叉是开发者和矿工之间辩论和争论的结果。由于数字货币的去中心化本质，代币或货币的底层代码更改必须根据特定的通用共识进行。当不同派别无法达成一致时，数字货币就会分裂，一个保持其原始代码，而另一个则作为比特币的新版本。比特币现金于
    2017 年 8 月因这些分裂而诞生。争议导致了 BCH 的产生，是因为比特币对区块大小有严格限制，为 1MB。BCH 将区块大小从 1 MB 增加到 8
    MB，较大的区块将允许更快的交易。它还进行了其他更改，包括移除某些内容。截至 2019 年 2 月 9 日，BCH 的市值为 23 亿美元，每个代币的价值为
    126.49 美元。


    ### Steam

    Steam 是一个基于区块链的社交媒体平台，在那里可以获得奖励。加密货币赏需要用户提供一些东西来奖励他们的贡献。在 Steam 中，奖励他人就像在 Reddit
    上对帖子进行投票，或者像在 Facebook 上点赞帖子一样简单。区块链将支付分配为 50%的 Steam Power（投票积分）和 50%的 Steam
    Dollars。奖励由区块链发放，类似于矿工获得报的方式，并在内容和投票提交后约 24 小时发生。Steam 是一种荣誉，意味着奖金或价值。Steam 也是“蒸汽”的同音词，蒸汽通常与力量有关，更进一步，蒸汽动力火车对英语习语有影响，例如“this
    conversation is picking steam（这次谈话正在变得火热）”。这种与奖赏、语言和赋权的关联感觉是正确的。


    ### 零币 (ZEC)

    Zcash 是一种于 2016 年后期推出的去中心化开源加密货币，看起来前景广阔。“如果说比特币是货币的 HTTP，那么 zcash 就是 HTTPS，”这是
    zcash 用于定义自己的一种类比。Zcash 提供了交易的隐私性和选择性透明。因此，像 https 一样，zcash 声称在所有交易都在区块链上记录并发布的情况下提供额外的安全或隐私，但发送者、接收者和金额等细节保持私密。Zcash
    为用户提供了“屏蔽”（shielded）交易的选择，这允许使用其团队开发的先进加密技术或零知识证明构造——zk-SNARK 对内容进行加密。截至 2019
    年 2 月 9 日，Zcash 的市值为 2.9125 亿美元，每个代币的价值为 49.84 美元。


    ### Dash

    Dash（原名为 darkcoin）是比特币的一个版本。Dash 提供匿名性，因为它在去中心化网络上运行，使交易私密化。Dash 于 2014 年 1 月推出，经历了网络增长。Dash
    网络构建在一个可以实现某些功能的系统之上。截至 2019 年 2 月 9 日，Dash 的市值为 6.407 万美元，价值为 74.3 美元。


    ### 同行币 (Peercoin)

    Peercoin 试图通过在铸币时提供 1%的年化收益来成为最安全的加密货币。尽管其代码基于比特币，但 Peercoin 是第一个引入权益证明（Proof
    of Stake）来保护网络的。Peercoin 是一种荣誉，意味着对网络的奖金或价值。


    公平分配 – Peercoin 使用工作证明（Proof of Work）来促进代币公平分配，而网络安全性通过权益证明铸币来维护。


    可持续奖励 – 挖矿区块的奖励随着网络算力的增长逐渐减少。随着时间的推移，挖矿对供应增长的影响将越来越小。


    ### 币 (NEO)

    NEO 始于 2014 年。最初名为 AntShares，后来由创始人大鸿飞进行了重命名。到目前，它是中国产生的最大的加密货币，由于其在智能合约的使用上与其相似，有时被称为“中国以太坊”。NEO
    支持许多现有语言的编程，包括 Go、Java、C++等。

