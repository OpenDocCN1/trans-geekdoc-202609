  trans: '


    当你将美元或其他货币兑换为比特币时，你需要资金来完成这些交易。比特币钱包可以可以直接连接到你的银行账户、借记卡或信用卡。


    ## 比特币交易所


    在用支付方式设置好钱包之后，你需要一个可以实际购买比特币的地方。用户可以从被称为“交易所”的在线市场购买比特币和其他加密货币，这类似于交易员用于购买股票时所使用的平台。交易所将你直接连接到比特币市场，你可以在那里将传统货币兑换为比特币。


    ### 第一步：获取比特币钱包


    如果你已经走过了通往这一点的弯折的解释道路，那么恭喜你！你可能已经准备好购买你的第一个个（或部分）比特币了。在出门之前，你最后需要的是一个存储它们的地方。


    在选择比特币钱包时，你有多种选择，但目前加密货币世界的“路易威登和古驰”分别是“软件”钱包和“硬件”钱包。软件钱包是连接到你传统银行账户的移动应用程序。这些钱包允许快速方便地访问比特币，但缺点是它们将你的钱交给了第三方公司。


    尽管领先的软件钱包是值得信赖的，但过去曾有流行的第三方公司倒闭或被黑客攻击。就像你不会把数千美元放在床垫下一样，拥有大量比特币的用户应该考虑以更安全的方式存储他们的资金。


    Coinbase 是美国最流行的软件钱包，部分原因因为它拥有网站、移动应用程序，并将 98% 的客户货币进行离线存储以增加安全性。对于初学者来说，Coinbase
    是最好且最容易的起点，因为它直接连接到比特币交易所，简化了买卖流程。


    Blockchain.info 是另一个连接到比特币交易所的流行钱包，但该钱包不支持移动应用程序。用户还可以下载仅限移动端的钱包，例如安卓 版的 Bitcoin
    Wallet 或 iOS 版的 Blockchain Bitcoin Wallet。


    硬件钱包稍微老旧一些，但通常因为是离线存储的而被认为更安全。这些钱包将用户的私钥存储在类似于优 盘的物理硬件设备上，这防止了黑客通过互联网连接访问用户的私钥。通过将银行账户链接到你的钱包，你可以买卖比特币并将这些资金直接存入你的账户。


    ### 第二步：连接银行账户


    为了购买比特币，你需要将你的钱包连接到银行账户、借记卡或信用卡。虽然这些支付方式的功能相同——即将传统货币兑换为比特币——但每种都有费用。使用银行账户的交易可能需要
    4-5 天时间处理，但建议初次尝试的用户使用。通过将银行账户链接到钱包，你可以买卖比特币并将资金存入你的账户。如果你处理的是较大资金，建议使用银行账户。目前，银行账户允许用户每周花费高达
    1250 美元。另一方面，借记卡和信用卡允许你立即购买比特币。缺点是，在 Coinbase 和其他流行的交易所，借记卡只能用于购买——即使如此，也只能小额购买。当钱包连接到借记卡时，用户无法出售比特币或向银行账户存款。不同交易所的声誉、可靠性、费用以及可交易的货币各不相同。


    ### 第三步：加入交易所


    比特币交易所是在线市场，你可以在那里将比特币交易为传统货币，将 BTC 交易为美元。正就像你在线购物时一样，你有像亚马逊、eBay 和阿里巴巴这样的平台，那里有数百万的私人卖家使用这些网站出售他们的产品。购买比特币是真实的。即使交易所都进行交易，每家交易所提供的服务也可能不同。交易所的声誉、可靠性、费用以及可交易的货币各不相同。在决定使用交易所之前，这里是我们的首选推荐。


    #### 初学者首选：Coinbase


    Coinbase 是美国最流行、最受尊敬的数字交易所。尽管 Coinbase 支持五种货币——比特币、比特币现金、以太坊、莱币和以太坊经典——它提供了一种安全购买和存储加密货币的方法。Coinbase
    对从银行账户或 Coinbase USD 钱包进行的美国交易收取费用。使用信用卡或借记卡购买将收取 2.49% 的费用。此外，在存储发生被窃或泄露的情况下，Coinbase
    会保障高达 250,000 美元的余额。


    #### 转账首选：Square Cash


    Square Cash App 是点对转账的领导者，与 PayPal 拥有的 Venmo 并列。Cash 来自 Square 公司，那是制造那些信用卡读器的公司。Square
    是一家巨大的金融科技公司，包含许多其他业务——其中之一就是交易比特币。Cash App 允许用户在无需手续费的情况下买卖比特币。与大多数在线交易所不同，Cash
    App 将你的比特币存储在 Square Cash 账户中，而不是独立的数字钱包。然而，如果你担心安全，可以将 Square Cash 账户中的比特币发送到你选择的另一个钱包。Square
    限制每周购买金额为 10,000 美元，但出售没有限制。


    #### 预算比特币首选：Robinhood


    Robinhood 于 2013 年作为免手续费股票券商上市。2018 年 2 月，公司扩展到了比特币和以太坊市场，以及另外 15 种货币的市场数据，允许用户免费交易加密货币。与
    Square 一一样，Robinhood 将比特币存储在用于股票的同一个账户中。Robinhood 有移动端并刚刚增加了网页版。交易比特币的缺点是，该应用程序仅在
    17 个州可用。


    #### 消费者首选：Coinbase Pro（原 GDAX）


    如果你觉得在 Coinbase 上交易很舒服并想增加交易量，你可能准备好切换到 Coinbase Pro 了。以前名为 Coinbase 全球数字交易所 (GDAX)，该交易平台使用的界面类似于彭博终端以及活跃的股票、商品和期权交易平台。除了传统的买卖，Coinbase
    Pro 还提供了市价单、限价单和止损单选项。与其仅从美元交易加密货币，Coinbase Pro 允许用户在货币之间进行交易，例如在以太坊和比特币之间。


    #### 扩展尝试首选：Binance


    如果你想多元化加密货币组合，Binance 可能是你的最佳选择。该在线交易所支持多种货币更多的数字货币，包括比特币、以太坊、以太坊经典、莱币、瑞币、比特币现金以及许多你可能没听过的早期加密货币。许多交易所交易这么多


