    Depending on the quality of your hardware, electricity costs, and the current
    price of Bitcoin, Bitcoin mining can have different rates of profitability.


    Nonetheless, you may always switch to other currencies depending on what you see
    is the most profitable.


    ### WHAT ARE BITCO MINING POOLS?


    Mining pools allow small miners to receive more frequent mining payouts. By joining
    with other miners in a group, a pool allows miners to find blocks more frequently.


    But, there are some problems with mining pools as we''ll discuss. As with `GPU`
    and `ASIC` mining, Satoshi apparently failed to anticipate the emergence of mining
    pools. Pools are groups of cooperating miners who agree to share block rewards
    in proportion to their contributed mining power.


    This chart displays the current distribution of total mining power by pools:


    While pools are desirable to the average miner as they smooth out rewards and
    make them more predictable, they unfortunately concentrate power to the mining
    pool’s owner.


    ### MINING: ISN’T ELECTRICITY A WASTE?


    Certain orthodox economists have criticized mining as wasteful. It must be kept
    in mind however that this electricity is expended on useful work: Enabling a monetary
    network worth billions (and potentially trillions) of dollars!


    Compared to the carbon emissions from just the cars of PayPal’s employees as they
    commute to work, Bitcoin’s environmental impact is negligible. As Bitcoin could
    easily replace PayPal, credit card companies, banks and the states regulate them
    all, it begs question: Isn’t traditional finance waste not just of electricity
    but of time and human resources!


    ### Mining Difficulty


    If only 21 million Bitcoins will ever be created, why has issuance of Bitcoin
    not accelerated with rising mining power? Issuance is regulated by an algorithm
    which adjusts the difficulty of `Proof of Work` in accordance with how quickly
    blocks are solved (typically every 2 week blocks). Difficulty rises and falls
    with hashing power to keep the time between blocks around 10 minutes.


    ### Block Reward Halving


    Satoshi designed Bitcoin such that the block reward, which miners receive for
    solving a block, is halved every 210,000 blocks (or 4 years). As Bitcoin’s price
    has risen substantially (and is expected to rise), mining remains a profitable
    endeavor despite the falling reward… at least for those on the bleeding edge of
    hardware with access to low-cost electricity.


    ### Honest Majority Secures the Network


    To successfully attack the Bitcoin network by creating blocks with a falsified
    transaction record, a dishonest miner would require the majority of mining power
    to maintain the longest chain. This is known as a `51% attack` and it allows an
    attacker to spend the same coins multiple times and to blockade transactions of
    other users at will. To achieve it, an attacker needs to own hardware than all
    honest miners. This imposes a high monetary cost on any such attack. At this stage
    of Bitcoin’s development, it’s likely that only major corporations or states would
    be able to meet this expense… although it’s unclear what net benefit, if any,
    such actors would gain from degrading Bitcoin.


    ### Mining Centralization


    Pools and specialized hardware have unfortunately led to a centralization trend
    in Bitcoin mining. Bitcoin developer Greg Maxwell has stated that, to Bitcoin’s
    likely detriment, a handful of entities control the vast majority of hashing power.
    It is also widely known that at least 50% of mining hardware is located within
    China. However, it may be argued that it’s contrary to the long-term economic
    interests of any miner to attempt such an attack. The resulting fall in Bitcoin
    credibility would dramatically reduce its exchange rate, undermining the value
    of the miner’s hardware investment and their held coins. As the community could
    then decide to reject the dishonest chain and revert to the last honest block,
    a 51% attack probably offers a poor risk-reward ratio to miners. Bitcoin mining
    is essentially not possible but always being considered.


    ### HOW DOES BITCO MINING WORK?


    This simplified illustration is helpful to explain:


    #### Spending

    Let’s say Green user wants to buy some goods from Red user. Green sends 1 bitcoin
    to Red.


    #### Announcement

    Green announces 1 bitcoin to Red. This information, known as transaction (and
    sometimes abbreviated as `tx`) is broadcast to Full Nodes with Green – typically
    8. A full node is special, which maintains the entire blockchain.


    #### Propagation

    Full Nodes then check Green’s send. If they are valid (e.g. Green didn’t send
    to a third user), full nodes broadcast the transaction. At this point, the transaction
    has not yet entered the blockchain. Red would be taking a big risk by sending
    goods before the transaction is confirmed. So how transactions get confirmed?
    This is where Miners enter the picture.


    #### Processing by Miners

    Miners, like full nodes, maintain a complete copy of the blockchain and monitor
    the network for newly-announced transactions. Green’s transaction may, in fact,
    reach a miner directly without being relayed through a full node. In either case,
    a miner then performs work in an attempt to fit all new valid transactions into
    the current block. Miners race each other to complete the work, which is to “pass”
    the current block so that it’s acceptable to the rest of the network. Acceptable
    blocks include a solution to a Proof of Work computational problem, known as a
    hash. The more computing power a miner controls, the higher their hashrate and
    the greater their odds of solving the current block.


    But why do miners invest in expensive computing hardware and race each other to
    solve blocks? Because, as a reward for verifying and recording everyone’s transactions,
    miners receive a substantial Bitcoin reward for every solved block!


    And what is a hash? Well, try entering all the characters in the above paragraph,
    from “But” to “block!” into this hashing utility. If you pasted correctly – as
    a string hash with no spaces after the exclamation mark – the `SHA-256` algorithm
    used in Bitcoin should produce:


    ```

    6afc21238f2d33e24e168195888721dd5ace05d76196671d6739789af92201

    ```


    If the characters are altered even slightly, the result won’t match. So, a hash
    is a way to verify any amount of data is accurate. To solve a block, miners modify
    the data until their result begins with a certain number (according to the current
    Difficulty, covered below). If you manually modify the string until you get a
    0…


    #### The Longest Valid Chain

