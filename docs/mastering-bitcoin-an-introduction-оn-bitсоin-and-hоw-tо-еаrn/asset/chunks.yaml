    取决于硬件质量、电力成本以及比特币的当前价格，比特币挖矿的盈利率可能不同。


    尽管如此，你始终可以根据你认为利润最高的货币随时切换到其他货币。


    ### 什么是比特币矿池？


    矿池允许小规模矿工更频繁地获得挖矿收益。通过与其他矿工一起组成小组，矿池让矿工能够更频繁地发现区块。


    但正如我们将讨论的，矿池也存在一些问题。与 `GPU` 和 `ASIC` 挖矿一样，中本（Satoshi）显然没有预料到矿池的出现。矿池是合作矿工的群体，他们同意按照贡献算力的比例共享区块奖励。


    此图表显示了各矿池总算力的当前分布情况：


    对于普通矿工来说，矿池是理想的，因为它们平滑了收益并使其更具预测性；遗憾的是，它们将权力集中在了矿池所有者手中。


    ### 挖矿：电力不是浪费吗？


    某些正统经济学家曾批评挖矿是浪费的。然而，必须记住，这些电力消耗在了有用的工作上：开启一个价值数十亿（甚至数万亿）美元的货币网络！


    与 PayPal 员工通勤上班时仅汽车产生的碳排放相比，比特币对环境的影响可以忽略不计。由于比特币可以可以地取代 PayPal、信用卡公司、银行，而这些机构都受到国家监管，这不禁引发人们思考：传统金融不仅浪费了电力，而且浪费了时间和人力资源吗！


    ### 挖矿难度


    如果比特币只会产生 2100 万个，为什么比特币的发行没有随着挖矿算力的增加而加速呢？发行由一种算法调节，该算法根据解决工作量证明（`Proof of Work`）的速度来调整难度（通常每
    2 周区块调整一次）。难度随哈算力的变化而波动，以将区块之间的时间保持在 10 分钟左右。


    ### 区块奖励减半


    中本设计比特币时，矿工通过解决区块获得的区块奖励每隔 210,000 个区块（或 4 年）减半一次。由于比特币价格大幅上涨（预计还将上涨），尽管奖励在下降，挖矿仍然是一项盈利的活动……至少对于那些拥有廉价电力的尖端硬件矿工来说如此。


    ### 诚实多数确保网络安全


    要通过创建伪造交易记录的区块来成功攻击比特币网络，不诚实的矿工需要拥有大多数的算力来维护最长链。这被称为 `51% 攻击`，它允许攻击者多次花费同一枚硬币，并随意封锁其他用户的交易。要实现这一点，攻击者拥硬件必须超过所有诚实矿工。这为任何此类攻击增加了高昂的资金成本。在比特币开发的目前阶段，可能只有大型公司或国家能够承担这笔费用……尽管不清楚此类行为者从损害比特币中获得什么净收益。


    ### 挖矿中心化


    遗憾的是，矿池和专用硬件导致了比特币挖矿的中心化趋势。比特币开发者格雷格·马克斯韦尔（Greg Maxwell）表示，这对比特币可能不利不利，少数实体控制着绝大多数哈算力。众周知的是，至少
    50% 的挖矿硬件位于中国。然而，有人认为，尝试这种攻击与任何矿工的长期经济利益相背。由此导致的比特币信誉下降将大幅降低其汇率，从而损害矿工硬件投资及其所持币的价值。由于社区随后可以决定拒绝不诚实的链并恢复到最后一个诚实区块，51%
    攻击对矿工来说可能是一个风险回报比很差。比特币挖矿本质上是不可能的，但一直被考虑。


    ### 比特币挖矿是如何工作的？


    这个简化的插图有助于解释：


    #### 支出

    假设用户 Green 想从用户 Red 那里购买商品。Green 向 Red 发送 1 个比特币。


    #### 公告

    Green 向 Red 宣布 1 个比特币。这一信息被称为“交易”（有时缩写为 `tx`），被广播到 Green 拥有的全节点（通常为 8 个）。全节点是特殊的，它们维护着整个区块链。


    #### 传播

    全节点随后检查 Green 的发送。如果它们是有效的（例如，Green 没有发送给第三个用户），全节点就会广播该交易。此时，交易尚未进入区块链。如果 在交易确认之前发送商品，将面临巨大的风险。那么交易是如何被确认的呢？这就是矿工登场的地方。


    #### 矿工处理

    矿工和全节点一样，维护区块链的完整副本，并监控网络中新发布的交易。Green 的交易实际上可以直接到达矿工，而无需通过全节点中继。无论哪种情况，矿工都会执行工作，尝试将所有新的有效交易放入当前区块中。矿工相互竞争完成这项工作，即“通过”当前区块，使其被网络其他部分接受。可接受的区块包括对工作量证明计算问题的解决方案，这种解决方案被称为哈希值（hash）。矿工控制的计算能力越强，他们的哈希产率就越高，解决当前区块的概率就越大。


    但为什么矿工要投资于昂贵的计算硬件并竞争解决区块呢？因为作为验证和记录每个人交易的奖励，矿工每解决一个区块就能获得丰 amount 的比特币奖励！


    那么什么是哈希值呢？嗯，试着将上面段落中从“But”到“block!”的所有字符输入这个哈希实用工具中。如果你粘贴得正确——作为一个字符串哈希，且在感叹号后没有空格——比特币中使用的
    `SHA-256` 算法应该产生：


    ```

    6afc21238f2d33e24e168195888721dd5ace05d76196671d6739789af92201

    ```


    如果字符被轻微修改，结果将无法匹配。因此，哈希值是验证任何数量数据准确的方法。要解决区块，矿工修改数据，直到其结果以特定的数字开头（根据下文的当前难度）。如果你手动修改字符串直到得到一个
    0……


    #### 最长有效链


