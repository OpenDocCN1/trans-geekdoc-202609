    今天，80% 的比特币已经被开挖，矿工需要定制化的设备，这些设备设计的唯一用途就是解决比特币问题。作为一名个人矿工，你通常需要与其他矿工组成矿池，但这涉及的费用会削减你的利润。


    # 我该如何获得比特币？


    首先，你需要一个存放比特币的地方——钱包。这个钱包是一段文本，人们可以使用它来向你发送比特币。它有点像银行账户；不同之处在于它与你的任何身份信息都没有关联。注册钱包就像注册新账户一样简单。你只需要一个电子邮件地址来接收验证链接。钱包（即标识你持仓的文本字符串）可以存储在网上，也可以离线存储在“冷存储”硬件中（如
    USB 闪存盘），甚至可以写在纸上（这种方法涉及一张带有二维码的纸张，扫描后即可访问在线钱包）。保护钱包的安全至关重要——据估计，价值数十亿美元的比特币因丢失钱包而丢失，无论是因为丢弃了钱包还是丢失了详细信息。


    Blockchain 是一个流行的免费钱包，拥有 1500 万用户。它可以通过网页浏览器以及 Android 和 iOS 访问。与许多其他钱包不同，它不需要身份验证（尽管系统会鼓励你添加一些信息以便于接收）。因为钱包始终存在被攻击的可能性（就像任何其他账户一样），如果你打算保留大量的比特币，将你的大部分收益存储在冷存储钱包中是一个好主意。


    Ethereum 是一个较新的、同样免费的在线钱包，适用于桌面和 Android，界面相对易用，并提供将大部分比特币储备存储在冷存储中的选项（发布时，曾发生过安全漏洞，现已解决）。Ledger
    Nano 是一种硬件选项，USB 闪存盘上带有钱包软件，可以安全地存放比特币，并能插入计算机即时发送或接收比特币。备份和恢复表包含你的钱包详情，所以如果你丢失了闪存盘，你的币也是安全的。在亚马逊上售价为
    98.99 美元。


    # 我可以在哪里获得比特币？


    获得比特币最简单的方法是前往比特币交易所网站，全球有几十个这样的网站。比特币交易所是一个让比特币买卖双方进行交易的平台，并收取费用。


    总部位于旧金山的 Coinbase 是最著名的交易所之一，它允许比特币与你的本地货币之间进行交易，并提取到你的银行账户、借记卡或信用卡（如果你使用的银行没有禁止加密货币购买）。你还可以交易另外两种数字货币——以太坊和比特币——并注册
    Coinbase 钱包以便在其交易所上进行无缝交易。


    如果你住在美国，你可能想选择一家位于美国的交易所，以避免银行收取的跨境交易费。


    你会发现，比特币的价值在不同交易所之间有所不同——这是由于交易所上需求（来自用户）和供应（来自持有比特币的用户）的不同，以及交易情况的差异导致的。还有少量的
    ATM 机——美国有约 1600 台——你可以在那里从借记账户中提取现金并存入比特币（换句话说）。


    # 比特币真的是匿名的吗？


    你可能已经注意到——如果钱包 ID 与现实世界的账户关联，那么使用比特币有多大匿名？答案是，交易通常可以追溯到身份详情，因为第三方钱包提供者和交易所会记录这些。由于比特币区块链上的所有交易都是公开的，也可以追踪特定钱包的支付和接收，并根据比特币建立画像，特别是当这些交易发生在现实世界的银行账户支出时。普林斯顿大学的研究人员发现，通过
    Cookie 和网络跟踪器泄露的数据足以将交易与用户信息（如电子邮件地址）联系起来。


