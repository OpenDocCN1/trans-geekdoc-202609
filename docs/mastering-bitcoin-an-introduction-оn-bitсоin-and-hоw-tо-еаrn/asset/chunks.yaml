    对于其他的公共信息记录机构，如证券交易委员会 (SEC)、维基百科或你的当地图书馆，都有专人负责审核新的数据条目。然而，在区块链中，这项工作交给了计算机网络。这些网络通常由分布在全球各地的数千台（在比特币的情况下，约为
    500 万台）计算机组成。


    当你使用比特币进行购买时，该计算机网络会迅速检查你的交易是否按照你所描述的方式发生。它们会确认购买细节，包括交易时间、美元金额和参与者。


    当消费者使用美元进行购买时，银行和信用卡公司会验证这些交易的准确性。比特币通过一种被称为“哈希”（hashing）的系统在不需要这些机构的情况下执行相同的功能。


    当一个人使用比特币向他人支付商品时，比特币区块链上的计算机会迅速检查你的交易是否准确。为了向区块链中添加新交易，计算机必须解决一个复杂的数学问题，这被称为“哈希”。解决一个哈希平均需要计算机（甚至是超级计算机）花费
    10 分钟。在此期间，计算机还会检查比特币区块链上新交易的准确性。如果某台计算机第一个解决了哈希，它们就会将新生成的交易作为一个区块存储在区块链上，此时这些交易就变得不可更改了。


    ### 比特币是匿名的吗？


    任何人都可以查看区块链上的交易历史，甚至你也可以。但虽然交易在区块链上是公开的，但用户信息并不是公开的。例如，在查看你的银行账户交易历史时，你会发现银行单上包含了商户名称。然而，在比特币区块链上，只有用户的公钥出现在交易旁边——这使得交易具有机密性，但并非匿名。这是一个重要的区别。国际研究人员和联邦调查局
    (FBI) 多次声称，他们可以将区块链上完成的交易追踪到用户的其他在线账户，包括他们的数字钱包。这就是前面提到的反洗钱政策的直接结果。


    ### 如何购买比特币


    比特币。它是目前金融科技行业中最热门的词汇之一，但也是最少被理解的词汇之一。随着加密货币再次回到新闻中心，现在比以往任何时候都 {深入细节并学习更多关于投资知识。如果你正站着，请坐下，因为这里涵盖了你在购买第一枚比特币（或决定不买）之前需要了解的一切详细说明。


    投资加密货币和首次代币发行（"ICOS"）具有极高的风险和投机性，本文并非 Investopedia 或作者对投资加密货币或 ICO 的建议。由于每个人的情况都是独特的，在做出任何财务决定之前，应始终咨询专业的人士。Investopedia
    对此处信息的准确性不作任何报告或保证。截至日期，作者拥有加密货币。


    ### 为什么人们买加密货币


    你不需要理解银行、企业以及加密货币中大胆的哈希。2016 年，比特币的价格为 710 美元。2019 年 2 月 21 日，比特币的汇率为 3,890 美元。不需要即使是经济学家也能知道，几年前投资比特币的人现在正备受赞誉——但好消息是，现在入场还不晚。数字货币可能价值数千美元，这似乎难以置信。毕竟，与贵金属或印刷纸币等实体货币不同，比特币只是几行代码。是什么让比特币有了价值？


    ### 货币的价值


    货币的价值过去曾由金属支撑。例如，从 1879 年到 1933 年，美国人可以用联邦政府的 20.67 美元兑换 1 盎司黄金。对于美国来说，这种情况在大萧条时期发生了变化，当时美国面临着不断上升的失业率和螺旋下降的通货。1933
    年，总统富兰克林·罗斯福决定美国脱钩黄金，实际上允许联邦储备银行向经济注入比联邦政府储备更多的资金。美国现在拥有所谓的“法币”，这意味着美元的价值取决于信任，而非物理资产。例如，美元的价值超过了打印它的墨水和纸张的价值。


    ### 核心要点


    比特币是一种数字货币，承诺比在线支付机制更低的费用。比特币的价值取决于投资者的信任、加密货币与金融机构的整合以及公众学习的意愿。当有人使用比特币支付商品时，比特币区块链上的计算机会迅速检查交易是否准确。想要交易比特币的消费者需要一个存储它们的地方——数字钱包，并将其连接到银行账户、信用卡或借记卡。交易者可以加入交易所或在线市场将比特币兑换为传统货币。


    ### 比特币的法币原则


    比特币遵循与美元相同的法币原则。虽然构成每枚比特币的代码行本身毫无价值，但国际市场已经认为每枚比特币价值数千美元。这是因为比特币是稀缺的，并且随着时间的推移变得越来越难以。原因如下：当比特币程序在
    2009 年 1 月 3 日启动时，比特币的产生速度为每 10 分钟 50 枚，或每天 7,200 枚。截至 2019 年 2 月，7,200 枚比特币大约价值
    2800 万美元，但当时每枚比特币仅值几美元。根据比特币程序，比特币的速率会减半。例如，2012 年 11 月 28 日，每 10 分钟 25 枚，或每天
    3,600 枚。2016 年 7 月 9 日，比特币的价格再次减半至 12.5。按照这个速率，比特币的总数为 2100 万枚。


    ### 我需要什么来购买


    #### 数字钱包


    为了在比特币网络进行交易，人们需要一个名为“钱包”的程序。比特币在技术上并不是“币”，因此钱包由两个独特的密钥组成：公钥和私钥。公钥是存入和提取交易的位置。它也是区块链上作为用户数字签名显示的密钥，类似于社交媒体信息中的用户名。私钥是购买、出售和交易钱包中比特币所需的密码。


    #### 个人文件


    证券交易委员会要求用户在注册数字钱包时验证其身份，作为反洗钱政策的一部分。为了买卖比特币，你需要使用多种个人文件验证你的身份，包括驾照和社会安全号码 (SSN)。


