    # 手机验证


    手机验证是作为次要身份验证源进一步保护你的钱包所必要的。唯一的限制是你需要输入手机号码。一旦你输入手机号码，你将收到一条包含验证码的短信，并在网站上输入。输入代码后，验证即告完成。


    # 添加支付账户


    现在我们的手机号码已经通过验证，我们需要绑定银行账户、信用卡/借记卡或 PayPal，以便在 Coinbase 钱包中转入。我选择了同时绑定我的 PayPal（用于账户注资）和银行账户（用于提现）。这允许我在转账到
    Coinbase 钱包时立即拥有可用资金，我将其用于在 Genesis-Mining.com 算力。


    在设置过程的这一部分，我建议绑定银行账户，因为该步骤需要进行身份验证。


    ## 绑定你的 PayPal 账户


    对于下一步或使用信用卡/借记卡，你需要验证身份。如果你的电脑上有摄像头，可以通过该方式上传图片。我发现通过手机上安装 Coinbase App 并以此上传身份证明比较简单。


    如果你通过电脑操作，请前往 `Settings > Payment Methods > Add Payment Method`。选择 `PayPal` 或
    `Credit/Debit Card`，然后点击上传 ID 链接。这将启用你的摄像头并允许你上传 ID。一旦你的 ID 通过验证，你将能够完成账户绑定并开始传输资金。


    # 评估账户设置


    ### 添加支付方式


    ### 可用的支付方式


    ## 身份验证


    我们需要做的最后件事是通过填写账户个人资料表来验证身份。当你进入账户设置时，你会看到一个像下面的链接。点击它，它将带你进入身份验证表。输入你的信息，此步骤即完成，你的钱包现在已激活。


    ### 身份验证表


    # 接收比特币资金


    现在你的 Coinbase 钱包已激活且账户已绑定，你就可以发送或接收比特币。要接收比特币，只需向他人提供你的钱包地址，他们会将资金发送那里。要找到你的钱包地址，点击
    `BTC Wallet` 然后 `Wallet Address`。会弹出一个如下所示窗口。长字母数字地址就是你的钱包地址。向给你发送 BTC 的人提供此地址或你的邮箱。你也可以使用此地址让挖矿收益发送给你。


    ### 发送/请求比特币资金


    你也可以使用 Coinbase 钱包的发送/请求功能通过电子邮件或他们的 BTC/ETH 地址向其他用户发送 BTC 或 ETH，以及发送资金。例如，如果你从
    Genesis 这样的云平台购买算力，当你的购买完成后，他们会提供一个 BTC 地址并用它发送 BTC，从而完成交易。


    # 恭喜，你的钱包现在已


    你现在拥有了一个功能完整的钱包，可以用它来购买和发送/接收比特币、比特币现金、以太坊和莱币。你还可以使用此钱包接收比特币挖矿奖励。


    ## 为什么应该交易加密货币？


    加密货币的现代概念在交易者中变得流行。中本·纳科向世界引入了一项革命性概念，即加密货币是区块链中创建和存储的货币媒介。这是通过技术实现的，旨在控制货币的创建和验证。比特币是第一个出现的加密货币。加密货币只是运行在虚拟世界中的数据库的一部分。这里的真实人物身份无法确定。此外，没有中心化机构来管理加密货币的交易。这等同于人们保存的黄金，其价值本应受法律保护。中本建立的系统是去中心化的，只有矿工有权通过确认发起的交易来更改。他们是系统中唯一的接触提供者。


    伪造加密货币是不可能的，因为整个系统基于硬性数学和密码谜题。只有能够解决这些谜题的人才能更改数据库，而这进一步是不可能的。交易一旦确认，就会成为数据库或区块链的一部分，无法再逆转。加密货币无非通过技术帮助创建的数字货币。它基于点对点的控制系统。让我们现在了解如何通过在这个市场交易来获益。


    ### 不可逆转或伪造


    尽管许多人可以反驳说完成的交易是不可逆的，但加密货币最棒的一点在于一旦交易被确认，新区块会被添加到区块链，交易就无法被伪造。你成为了该区块的所有者。


    ### 在线交易


    这不仅使得坐在世界任何地方的人都能进行交易，还加快了交易处理的速度。因为加密货币是区块链中使用的和存储的货币形式。这是通过技术实现的，旨在控制货币的创建和验证。


