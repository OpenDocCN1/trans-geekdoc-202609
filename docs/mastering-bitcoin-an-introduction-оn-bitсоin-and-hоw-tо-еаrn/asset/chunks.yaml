    You may have heard that Bitcoin transactions are irreversible, so why is it advised
    to await several confirmations? The answer is somewhat complex and requires a
    solid understanding of the above mining processes: Let’s imagine two miners, A
    in China and B in Iceland, who solve the current block at roughly the same time.
    A’s block (A1) propagates through the internet from Beijing, reaching nodes in
    the East. B’s block (B1) is first to reach nodes in the West. There are now two
    competing versions of the blockchain!


    Which blockchain prevails? Simply, the longest valid chain becomes the official
    version of events. So, let’s say the next miner to solve a block adds it to B’s
    chain, creating B2. If B2 propagates across the entire network before A2 is found,
    then B’s chain is the clear winner. A loses his mining reward and fees, which
    only exist on the invalidated A-chain.


    Going back to the example of Green’s payment to Red, let’s say this transaction
    was included by A but rejected by B, who demands a higher fee than was included
    by Green. If B’s chain wins then Green’s transaction won’t appear in the B chain
    – it will be as if the funds never left Green’s wallet.


    Although such blockchain splits are rare, they’re a credible risk. The more confirmations
    have passed, the safer a transaction is considered.


    # ANALYSIS ON THE ELECTRICITY USE OF BITCOIN & WHY IT''S NOT A WASTE


    In March 2016, Motherboard projected this: Bitcoin’s electricity consumption will
    grow to rival that of Denmark by 2020. Whatever the accuracy of Motherboard’s
    math, there is no disputing the fact that Bitcoin uses a great deal of energy.
    On an industrial level, Bitcoin is considered something which converts electricity
    directly into money.


    There are two major camps which object to Bitcoin mining cost:


    ### Eco-economists

    Eco-economists seek to diminish power consumption. Given that electricity is,
    currently generated through unsustainable methods, eco-activists hold that all
    energy expenditures must be weighed against their (debatable) contribution to
    climate change.


    Secondly, there are those economists who doubt Bitcoin’s viability. This group
    is best exemplified by Paul Krugman, who argues that Bitcoin (and to a lesser
    extent, gold) has no real value to society and so represents a waste of resources
    and labor.


    ### Defending Bitcoin’s Power Use

    While disproving the “experts” is as simple as referring them to Bitcoin’s current
    price and continued existence, explaining why Bitcoin is worth its electrical
    cost to the eco-conscious requires a more thoughtful approach. After all, social
    pressure to sustain the Bitcoin project is sensible. We need to maintain a healthy
    balance between nature and technology. That said, until advances in green energy
    diminish negate Bitcoin’s draw on ecologically-costly energy sources, Bitcoiners
    must endeavor to defend the expenditure by conveying the importance of this revolutionary
    poorer currency!


    Here are good reasons which, taken together and in our opinion, completely justify
    the world’s admittedly high expenditure of electricity on the Bitcoin project:


    #### Protection from Inflation and Avoidance of Capital Controls

    Of course, it’s your money. I just tell you what it’s worth and what you can do
    with it. As alluded to in Reason 1, many rulers are diluting the value of “their”
    national currencies, either as an economic stimulus (mostly to the worth of elites)
    or as a means to cheap their tremendous debt. Such debasement punishes savers
    in particular, as the value of their stored wealth is eroded. Savers naturally
    seek to protect their fiat savings by translating them to a more durable form,
    such as foreign currency or investments.


    Rulers often block their citizens’ flight to monetary safety by imposing capital
    controls. China is known for its particularly strict limitations. Bitcoin mining
    represents an excellent, legal way to circumvent such. Investing in mining brings
    stated amount of bitcoin; a form of money beyond control of the ruling class.
    For those under restricted capital controls, mining represents unity. Given the
    relative costs and risks of other wealth-preservation measures, it may even be
    worthwhile to mine Bitcoin at loss! Consider one popular alternative, real estate:
    Bloomberg estimates that $1 trillion left China in 2015, 7 times more than was
    offshore in 2014. A lot of that money flowed into real estate in Western cities
    (such as Vancouver). This phenomenon has created bubbles and unaffordable housing
    conditions for residents. Bitcoin mining represents effective means to preserve
    wealth without creating such undesirable market distortions.


    ### Bitcoin is backed by Electricity (and Integrity)

    You mean there isn’t ounce gold in the bank for every dollar? Over millennia,
    history has shown that prosperity depends on sound money. Whether it was the Roman
    Empire debasing its coinage or modern central banks inflating the supply of fiat
    money… The end result of currency debasement is, tragically, economic crises.
    Mr. Mike Maloney’s superb series, “The Hidden Secrets of Money,” explores this
    timeless lesson in Episode 5. Simply put, currency with no backing but faith in
    its controllers tends to be short-lived and ruinous in its inflationary death.


    Bitcoin was designed with one monetary goal foremost in mind: avoiding the dismal
    fate of previous monetary forms by preventing the evils of debasement. Rather
    than trust in some distant, unaccountable human authority’s wisdom and restraint,
    Bitcoin’s supply limit is enshrined in its code; its “digital DNA,” as a matter
    of consensus. Unlike fiat currency, Bitcoin’s value is also backed by tangible,
    measurable resources: code running on computing hardware powered by electricity.
    Given money’s (over-)importance to our modern world, maintaining a technologically-superior
    alternative to flawed fiat currencies is certainly worthwhile.


    # Mining is a Profitable and Promising Industry in a Slow Global Economy

    Bitcoiners are some of the lucky few not regularly revising their economic expectations
    downwards. The major determinants of profitability in the fiercely competitive
    world of Bitcoin mining are low electricity costs, access to cutting-edge ASIC
