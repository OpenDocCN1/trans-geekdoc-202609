    When you exchange USD or another currency for bitcoin, you will need funds to
    make those transactions. Bitcoin wallets can connect directly to your bank account,
    debit card, or credit card.


    ## Bitcoin Exchange


    After you’ve set up your wallet with a payment method, you''ll need a place to
    actually buy bitcoin. Users can buy bitcoin and other cryptocurrencies from online
    marketplaces called “exchanges,” similar to the platforms that traders use to
    buy stock. Exchanges connect you directly to the bitcoin marketplace, where you
    can exchange traditional currencies for bitcoin.


    ### Step One: Get a Bitcoin Wallet


    If you’ve made it through the winding road of explanations leading up to this
    point, congratulations! You may very well be ready to buy your first (fraction
    of a) bitcoin. The last thing you’ll need before you’re out the door is a place
    to store them.


    When it comes to choosing a bitcoin wallet, you have options, but the Louis Vuitton
    and Gucci of the cryptocurrency world right now are “software” and “hardware”
    wallets. Software wallets are mobile applications that connect with your traditional
    bank account. These wallets allow for quick and easy access to bitcoin, but the
    drawback is they put your money in the hands of a third-party company.


    Although the leading software wallets are trustworthy, popular third-party companies
    have collapsed, or been hacked, in the past. Much like you wouldn’t store thousands
    of dollars in your mattress, users with larger sums of bitcoin should consider
    storing their money more securely.


    Coinbase is the most popular software wallet available in the United States, partly
    because it has a website, mobile application, and stores 98% of customer currencies
    offline for added security. For beginners, Coinbase is the best and easiest place
    to start because it is connected directly to a bitcoin exchange, which simplifies
    the buying and selling processes.


    Blockchain.info is another popular wallet connected to the bitcoin exchange, but
    the wallet is not supported by a mobile application. Users can also download mobile-only
    wallets such as Bitcoin Wallet for Android or Blockchain Bitcoin Wallet for iOS.


    Hardware wallets are a little more old-school but tend to be considered more secure
    because they are kept offline. These wallets store a user’s private key on a physical
    hardware device similar to a flash drive, which prevents hackers from accessing
    a user’s private key through an internet connection. By linking a bank account
    to your wallet, you can buy and sell bitcoin and deposit that money directly into
    your account.


    ### Step Two: Connect a Bank Account


    In order to purchase bitcoin, you need to connect your wallet to a bank account,
    debit card, or credit card. Although these payment methods perform the same function—exchanging
    traditional currency for bitcoin—each has fees. Transactions using a bank account
    can take 4-5 days to process, but are recommended for first-timers. By linking
    a bank account to your wallet, you can buy and sell bitcoin and deposit that money
    into your account. Bank accounts are recommended if you are dealing with larger
    sums. At the time, bank accounts allow users to spend as much as $1250 per week.
    Debit and credit cards, on the other hand, allow you to buy bitcoin instantly.
    The drawback is that on Coinbase and other popular exchanges, debit cards can
    only be used to purchase—and even then, only small amounts. Users cannot sell
    bitcoin or deposit money into their bank when their wallet is connected to a debit
    card. Exchanges can vary in reputation, reliability, fees, and currencies available
    for trading.


    ### Step Three: Join an Exchange


    Bitcoin exchanges are online marketplaces where you can trade bitcoin for traditional
    currencies, BTC for USD. Just like when you make a purchase online, you have platforms
    like Amazon, eBay, and Alibaba that have millions of private sellers who use these
    websites to sell their products. Buying bitcoin is true. Even if exchanges trade,
    it is likely each offers different services. Exchanges can vary in reputation,
    reliability, fees, and currencies available for trading. Before settling down
    with an exchange, here are our top recommendations.


    #### Best for Beginners: Coinbase


    Coinbase is the most popular and respected digital exchange in the United States.
    Although Coinbase trades in five currencies—Bitcoin, Bitcoin Cash, Ethereum, Litecoin,
    and Ethereum Class—offers a way to securely buy and store crypto. Coinbase charges
    a fee for U.S. transactions from a bank account or Coinbase USD wallet. Purchases
    using a credit or debit card are charged 2.49 percent. Plus, Coinbase secures
    balances up to $250,000 in the event of theft or breach in storage.


    #### Best for On: Square Cash


    The Square Cash app is a leader in peer-to-peer transfers, right alongside PayPal-owned
    Venmo. The Cash comes from Square, the company that makes those credit card readers.
    Square is a huge financial technology company that includes many other—one of
    which is trading bitcoin. The Cash App allows users to buy and sell bitcoin without
    processing fees. Unlike most online exchanges, the Cash App stores your bitcoin
    in your Square Cash Account, rather than a separate digital wallet. If you’re
    worried about security, however, you can send the bitcoin in your Square Cash
    Account to another wallet of your choosing. Square limits purchases at $10,000
    per week, but there is no limit to what you can sell.


    #### Best for Bitcoin on a Budget: Robinhood


    Robinhood launched in 2013 as a fee-free stock brokerage. In February 2018, the
    company expanded into the bitcoin and ethereum markets, along with market data
    for another 15 currencies, allowing users to trade cryptocurrency without a fee.
    As is the case with Square, Robinhood stores bitcoin in the same account used
    for stocks. Robinhood is mobile and just added web version. The drawback of trading
    bitcoin is that the app is only available in 17 states.


    #### Best for Spenders: Coinbase Pro (formerly GDAX)


    If you feel comfortable trading on Coinbase and want to step up your volume, you
    may be ready to switch to Coinbase Pro. Formerly known as Coinbase Global Digital
    Exchange (GDAX), the trading platform uses interfaces similar to Bloomberg terminals
    and active stock, commodity, and option trading platforms. Coinbase Pro offers
    options to make market orders, limit orders, and stop orders in addition to traditional
    buying and selling. Instead of trading exclusively from USD to cryptocurrency,
    Coinbase Pro allows users to trade between currencies, say between Ethereum and
    Bitcoin.


    #### Best for Branching Out: Binance


    Binance may be your best bet if you’re looking to diversify your cryptocurrency
    portfolio. The online exchange supports multiple currencies and even more digital
    currencies, including Bitcoin, Ethereum, Ethereum Class, Litecoin, Ripple, Bitcoin
    Cash, and many fledgling cryptocurrencies you may not have heard of. Many exchanges
