  fmt: '

    There is no Web or desktop interface but as many people now use their phone as
    their primary computer, that may not be a reason to be scared off from trying
    it out. It is very secure, allows for anonymity and keeps your Bitcoin in your
    pocket or bag pretty wherever you go.


    ### Blockchain.info


    Blockchain is the technology that allows Bitcoin and other digital currencies
    to exist. Expect to hear more about Blockchain far beyond the digital currency
    world. Blockchain.info is similar to Coinbase in that it is an online wallet,
    but you can’t buy or sell directly through Blockchain, which means your Bitcoin
    storage is separate from your Bitcoin marketplace. Because it isn’t a full exchange,
    it is considered to be more secure than a site like Coinbase, where you can bet
    that bad guys are constantly attempting to hack. If you are not a “computer person,”
    using an exchange like Coinbase is much easier. This separation adds a level of
    security, but also a level of complexity in your Bitcoin use.


    ### Robinhood


    Robin started as a free stock trading platform and has recently expanded to include
    support for options and other investments, including cryptocurrencies such as
    Bitcoin. Robinhood is both a wallet and an exchange, so like Coinbase everything
    is in one place. Robinhood is a mobile-first platform and has not even rolled
    out the Web version to all stock trading customers. But what really sets Robinhood
    apart is the cost: free. There are no commissions when buying or selling Bitcoin,
    just like stocks on the platform. Some may argue it is less secure for reasons
    we already discussed, but if it is secure enough for your stocks, it is secure
    enough for your coins.


    ### Coinbase


    Coinbase is one of the easiest ways to buy, sell and hold cryptocurrencies, which
    earns it the first spot on this list. With Coinbase, you can connect to a U.S.
    bank account and easily transfer dollars in or out of your dollar wallet. You
    can use those dollars, or transfer in new ones, to buy and sell. In addition to
    Bitcoin, Coinbase currently supports Bitcoin Cash, Ethereum and Litecoin. There
    are constant rumors of additional currencies like Ripple getting support from
    Coinbase as well. While the big upside of Coinbase is ease of use, that is offset
    with some worries about security. Mt. Gox was at one point the dominant platform
    for Bitcoin and other currencies. That is until it was hacked and lost nearly
    half a billion dollars in user currency. But Coinbase did learn from Mt. Gox’s
    loss, and has very firm security in place and improves the entire user experience.


    ### Trezor


    Trezor isn’t a full buying and selling platform like Coinbase. Instead it is simply
    a place to store your Bitcoin. Trezor is a physical device that plugs into your
    computer, tablet or phone to access your coins. The Trezor wallet works with multiplicities
    and works as a password manager, two-factor authentication and other useful features.
    This wallet offers protections against lost passwords and lost devices, but you
    should learn from others and make sure never happens. The entire point of this
    digital wallet is to keep others from stealing your Bitcoin.


    ### Ethereum


    Ethereum is a software wallet, which means your Bitcoin is stored in a set of
    files on your laptop or computer. It is currently available for Windows, MacOS,
    and Android. Electrum can work with physical wallets and has some flexibility
    using a hardware wallet like Trezor. The big benefit is that you can quickly get
    up and store your Bitcoin on your own computer. But if that computer crashes,
    is lost in fire, or corrupted you could lose your coins. The app supports recovery
    and allows you to create a physical “cold storage” with a printed or handwritten
    set of keys.


    ## How to Create a Wallet


    In basic terms, a wallet is a database kept either online or offline that stores
    the private key for coins in your possession. When you make a transaction, you
    sign for the transaction with your private key, which confers ownership of the
    coins and your right to initiate the transaction. Blockchain encodes the transmitted
    bitcoin with the recipient’s private key, formally transferring ownership. This
    is roughly equivalent to a physical wallet, where taking money out of your wallet
    and permitting someone else to place money in his or her wallet conveys a money
    transfer.


    Wallets can exist as physical devices, on paper (which is just a printout of both
    your public and private keys; the actual coins exist on the blockchain), as software
    on a private computer, or a managed web account. Should a wallet ever become inaccessible,
    the private key would be, making the bitcoin “lost” or not spendable. Proper wallet
    management requires protection of passwords and any physical assets, management
    of backups, and informing appropriate individuals about how to access the wallet
    in the case of your inheritance or death. Exchanges, including Coinbase, automatically
    create wallets for new accounts as a courtesy. All new subscriber has to use wallet
    is load them with bitcoin or coins. However, as managed wallet provides to charge
    transaction for outside transaction, it may be to consider a non-managed option.
    There are plenty of free wallets. Using web-managed wallet, however, sharing your
    private key with a third. For private this may be a no go.


    ### Setting Up a New Wallet


    For this example we are looking up a new wallet at blockchain.info:


    - **Step 1**: At the blockchain.info homepage, scroll to “New to?” Click “Get
    a Free Wallet.”

    - **Step 2**: Enter your email and password. Confirm the Terms of Service box.
    Hit “Continue.” Make sure you pick a password you are unlikely to forget and read
    terms of service.

    - **Step 3**: Click “Get Started.”그런- **Step 4**: Your wallet is now online. You
    can now create an address with which receive coins by hitting “Request.” You will
    need an exchange account to fund your wallet. Once funded, you can send coins
    by hitting “Send.”


    ## How to Setup a Coinbase Bitcoin Wallet


    ### Why Coinbase?


    Pretty every person today has a PayPal account and uses it to make purchases or
    send and receive payments from other people. A cryptocurrency wallet provides
    the same functionality, but with a couple differences. Coinbase is for cryptocurrencies
    such as Bitcoin, Ethereum and Litecoin and not for currencies such as USD or EUR.
    Coinbase is used as an exchange between your local currency and cryptocurrency.
    So if a person wanted to own Bitcoin, Ethereum or Litecoin as investment they
    can simply buy the currency with USD and hold it in the wallet. If the price goes
    up you can then exchange your cryptocurrency back to USD for a profit. One of
    the reasons I use my cryptocurrency wallet is to have my cloud proceeds deposited
    in BTC daily. I can then exchange my proceeds to USD or leave as BTC in hopes
    of a price increase relative to USD.


    ### Creating Your Coinbase Account


    When you go to Coinbase.com to create your wallet a screen will be presented where
    you can enter your first/last name, email address, and password. Select the checkbox
    and then click the Sign Up button. Once your wallet is created there are a few
    steps necessary for purposes and to link your bank account, PayPal, and credit/debit
    card so you can start exchanging your currency for Bitcoin, Ethereum, or Litecoin.

    '
  trans: '

    虽然它没有 Web 端或桌面界面，但考虑到现在许多人将手机作为主要电脑，这可能并不是让你望而却步尝试它的理由。它非常安全，允许匿名，并且无论你去哪里，都能将你的比特币保存在口袋或包包里。


    ### Blockchain.info


    区块链是允许比特币和其他数字货币存在的技术。你可以期待在数字货币世界之外听到更多关于区块链的内容。Blockchain.info 与 Coinbase 的相似之处在于它是一个在线钱包，但你不能直接通过
    Blockchain 进行买卖，这意味着你的比特币存储地与你的比特币交易市场是分开的。因为它不是一个完整的交易所，所以被认为比像 Coinbase 这样的网站更安全，在
    Coinbase，你可以肯定坏人正在不断尝试黑客。如果你不是“电脑高手”，使用像 Coinbase 这样的交易所要容易得多。这种分离增加了一层安全性，但也增加了你使用比特币的复杂性。


    ### Robinhood


    Robin 起始于一个免费股票交易平台，最近扩展到支持期权和其他投资，包括包括比特币在内的加密货币。Robinhood 既是钱包也是交易所，所以像 Coinbase
    一样，所有功能都在一个地方。Robinhood 是一个移动优先的平台，甚至还没有向所有股票交易客户推出 Web 版本。但真正让 Robinhood 脱颖而出的是成本：免费。买卖比特币时没有佣金，就像平台上的股票一样。有些人可能会认为由于我们已经讨论的原因它不那么安全，但如果它对你的股票足够安全，那么它对你的硬币也足够安全。


    ### Coinbase


    Coinbase 是购买、出售和持有加密货币最简单的方法之一，这使其在列表中位列首位。通过 Coinbase，你可以连接到美国银行账户，并轻松将美元转入或转出美元钱包。你可以使用这些美元或转入新的美元来买卖。除了比特币之外，Coinbase
    目前还支持比特币现金、以太坊和莱币。不断传言 Ripple 等其他货币也将获得 Coinbase 的支持。虽然 Coinbase 的巨大优势是易用，但这被一些对安全性的担忧所抵消。Mt.
    Gox 曾是比特币和其他货币的主导平台。直到它被黑客并丢失了近五亿美元的用户货币。但 Coinbase 从 Mt. Gox 的损失中吸取了教训，拥有非常稳固的安全措施，并改进了整个用户体验。


    ### Trezor


    Trezor 不是像 Coinbase 那种完整的买卖平台。相反，它只是存储你比特币的地方。Trezor 是一个物理设备，插入你的电脑、平板电脑或手机即可访问你的货币。Trezor
    钱包具有多重功能，并作为密码管理器、双重身份验证和其他有用功能。此钱包提供了针对密码丢失和设备丢失的保护，但你应该从他人身上学习教训，确保这些永远不会发生。这个数字钱包的目的是防止他人偷取你的比特币。


    ### Ethereum


    以太坊是一个软件钱包，这意味着你的比特币存储在你的笔记本电脑或电脑的一组文件中。它目前适用于 Windows、MacOS 和 Android。Electrum
    可以与物理钱包配合，并在使用像 Trezor 这样的硬件钱包时具有灵活性。大好处是你可以快速起身并将比特币存储在自己的电脑上。但如果那台电脑崩溃、在火灾中丢失或损坏，你可能会丢失你的货币。该应用程序支持恢复，并允许你通过打印或手写一组密钥来创建一个物理“冷存储”。


    ## 如何创建钱包


    简单来说，钱包是一个存储在在线或离线的数据库，用于存储你所拥有的货币的私钥。当你进行交易时，你用你的私钥对交易进行签名，这赋予了你货币的所有权以及发起交易的权利。区块链用接收者的私钥对传输的比特币进行编码，正式转移所有权。这大致相当于一个物理钱包，从你的钱包中取出钱并允许他人将钱放在他或她的钱包中意味着金钱转账。


    钱包可以以物理设备的形式、纸质形式（这只是你的公钥和私钥的打印件；实际货币存在于区块链上）、私有电脑上的软件或托管 Web 账户的形式。如果钱包变得无法访问，私钥也将无法访问，导致比特币“丢失”或无法花费。适当的钱包管理需要保护密码和任何物理资产，管理备份，并在你继承或去世的情况下告知相关人员如何访问钱包。包括
    Coinbase 在内的交易所会自动为新账户创建钱包以作为一种好意。所有新订阅者都必须使用钱包来从中载入比特币或硬币。然而，由于托管钱包会对外部交易收取费用，因此可能需要考虑非托管选项。有很多免费的钱包。然而，使用网络托管钱包意味着将你的私钥共享给第三方。对于隐私考量来说，这可能是不可接受的。


    ### 设置新钱包


    在本示例中，我们正在 blockchain.info 查找一个新钱包：


    - **步骤 1**：在 blockchain.info 首页上，滚动到“新用户？”。点击“获取免费钱包”。

    - **步骤 2**：输入你的电子邮件和密码。确认服务条款复选框。点击“继续”。确保你选择了一个你不可能忘记的密码并阅读服务条款。

    - **步骤 3**：点击“开始使用”。

    - **步骤 4**：你的钱包现在在线了。你现在可以通过点击“请求”来创建一个接收货币的地址。你需要一个交易所账户为你的钱包资金。注资后，你可以点击“发送”来发送货币。


    ## 如何设置 Coinbase 比特币钱包


    ### 为什么选择 Coinbase？


    现在的每个人都有 PayPal 账户，并用它进行购买或向他人发送和接收付款。加密货币钱包提供了相同的功能，但有几点不同。Coinbase 用于比特币、以太坊和莱币等加密货币，而不是用于美元或欧元等货币。Coinbase
    被用本地货币和加密货币之间的交易所。因此，如果某人想拥有比特币、以太坊或莱币作为投资，他们可以使用美元购买货币并将其保留在钱包中。如果价格上涨，你可以将加密货币换回美元以获利。我使用加密货币钱包的原因之一是让我的云收益每天以
    BTC 存款。我可以将收益兑换为美元或保留 BTC 以期待相对于美元的价格上涨。


    ### 创建 Coinbase 账户


    当你访问 Coinbase.com 创建钱包时，会出现一个屏幕，你可以在其中输入你的姓名、电子邮件地址和密码。勾选框，然后点击注册按钮。钱包创建后，还有一些必要的步骤，出于目的以及关联银行账户、PayPal
    和信用卡/借记卡，以便你开始将你的货币兑换为比特币、以太坊或莱币。


