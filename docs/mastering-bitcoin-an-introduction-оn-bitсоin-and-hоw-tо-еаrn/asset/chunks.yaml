    years. This coincides with analyses of Marie Brière, associate professor of Paris
    Dauphine in France, counted an annualized return of 370% with 175% volatility.
    Such violent movements within short periods are not an ideal exchange medium for
    buyers or sellers, limiting bitcoins as a significant vehicle for businesses.
    Many believe bitcoins are speculative bubbles similar to the Dutch tulip. Evidence
    suggests the current market is mainly speculation, with three-quarters of mined
    waiting for prices to rise.


    ### High Risk of Loss


    Thomas B. Lee, adjunct scholar at Cato Institute and regular contributor to Forbes,
    identifies four reasons about: Lack of security. There is no safety net to protect
    your from human error (passwords), technical glitches (hard drive failures, malware),
    or financial fraud. According to an article in the UK edition of Wired, 18 of
    40 web-based businesses offering to exchange bitcoins into other currencies gone
    out of business, with only six reimbursing their customers. The authors of the
    study estimate that the median life of any exchange is 381 days, with a 29.9%
    chance that a new exchange will close within a year of opening.


    Increased Regulation. While relatively benign guidelines are currently in place,
    law enforcement agencies could decide that bitcoins are a “giant money laundering
    scheme,” and enact more stringent regulations that would diminish the currency’s
    value.


    Limited Scaling. The design of the system limits the speed and number of transactions
    processed, making it unlikely that bitcoins will replace conventional credit card
    transactions.


    Lack of Applications. While acknowledging bitcoins’ popular use for illegal transactions,
    questions how useful bitcoins really are. To be truly disruptive to existing fiat
    currencies or electronic payment systems, Bitcoin would need applications for
    low-cost international money transfers, the creation of complex electronic contracts,
    or use in Kickstarter-style crowdfunding or micropayment transfers.


    James J. Angel, associate professor of finance at the McDon School of Business
    at Georgetown University, noted in an article on CNN that one of the largest Bitcoin
    exchanges is a former online site to trade cards used in the popular game: “An
    exchange based on trading cards not a sound foundation for money.” Financial experts
    would count the issues inherent in currency and monetary exchanges are more complex
    than the limits hit in software. Angel also predicted that Bitcoin mining software
    would become a magnet for viruses since is no government regulating it. On December
    8, 2013, Financial Times reported that “Bitcoin has fueled a surge in the number
    of cyberattacks,” with more than 300,000 occurring. Cyberattacks demand bitcoin
    from owners that hack computers used to maintain the public ledger of ownership.
    Furthermore, Mr. Smoky, testifying before the Senate Subcommittee, noted that
    bitcoins are not broadly accepted by established financial services, limiting
    their application and use.


    ### How is Bitcoin created?


    When computers successfully add a block to the blockchain, they are rewarded with
    cryptocurrency. Earlier discussed the amount of bitcoin produced every 10 minutes
    cuts in half every four years. At the time of writing, computers receive 12.5
    bitcoin, or approximately $48,625 USD, for each block that they add to the blockchain.


    If the tune of $48,625 sounds enticing, be warned that the process of adding blocks
    to the blockchain, what the cryptocurrency world calls “mining,” is not easy.
    In fact, the odds of solving one of these problems on the Bitcoin network are
    about one in trillion (12 zeros). To put that number in perspective, the odds
    of winning the jackpot lottery are one in 13 million. To solve complex math problems
    at those odds, computers must run programs that cost them significant amounts
    of power, energy, and money. Similar to winning the lottery, solving hashes essentially
    comes down to chance—but there are ways to increase your odds of winning in both
    contests. With bitcoin, arriving at the right answer before another miner has
    almost everything to do with how fast your computer can produce hashes. Just a
    decade ago, bitcoin mining could be performed competitively on normal desktop
    computers. Over time, however, miners realized that graphics cards commonly used
    for video games were more effective at mining than desktops and graphics processing
    units (`GPU`) came to dominate the game. In 2013, bitcoin miners began to use
    computers designed specifically for mining cryptocurrency called `ASICs`. These
    `ASICs` are much faster than `GPU`.

    '
