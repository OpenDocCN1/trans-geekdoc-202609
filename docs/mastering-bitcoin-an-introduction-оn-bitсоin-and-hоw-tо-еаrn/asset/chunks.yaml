    ## 引言

    可以说是全球经济最具颠覆性、最令人兴奋且最具争议的新进展之一，比特币作为一种合法、流行货币的出现，已经引发了关于未来的辩论。尽管如此，许多人并不熟悉这种新的、仅限在线的金融资源，部分原因因为它排除在“现实”世界之外。


    比特币的起源可以追溯到 2008 年，当时货币创造者采用的匿名名字“中本聪明”（Satoshi Nakamoto）向世界推介了他的“点对点”货币。比特币被定义为一种“加密货币”，或一种使用一系列加密工具生成和传输的货币形式，而不是中心权威。比特币的设计初衷是与国家利益和互动保持“独立”，从其主权和对通胀的抵抗中发展出来。


    比特币是一种虚拟商品，与传统现金有许多相似属性。利用强大的加密技术和点对点网络，它们是第一种没有中央发行者的货币。比特币不是实体，但其工作方式虚拟上相同。最初，比特币通过比特币论坛进行交易，成为赛博朋克社区受众的财产，这是一群爱好者，他们相信加密协议可以成为政治和社会变革的催化剂。


    两年后，比特币被更大比例越来越多的全球社区所接受，使企业家能够为这种货币开发活跃的交易平台。对于那些有兴趣将比特币作为外汇工具的人来说，有各种平台可供选择。


