    ## Leaving money on an exchange


    This is the most basic ground-rule for any crypto trader: NEVER leave your money
    on an exchange that you’re not currently trading with. If your money is sitting
    on the exchange, it means that you don’t have any control over it. If the exchange
    gets hacked, goes offline, or goes out of business, you may end losing that money.
    Whenever you have money that isn’t needed in the short term for trading on an
    exchange, make sure to move it into your own Bitcoin wallet or bank account for
    keeping.


    ## Risking more than you can afford to lose


    The biggest mistake you can make is to risk more money than you can afford to
    lose. Take a look at the amount you feel comfortable with. Here’s the worst-case
    scenario: You’ll end losing it all. If you find yourself trading above that amount,
    stop. You’re doing it wrong. Trading is a very risky business. If you invest more
    money than you’re comfortable with, it will affect how you trade, and it may cause
    you to make bad decisions.


    ## Not having a plan


    Another mistake people make when starting out with trading is not having an action
    plan that’s clear enough. In other words, they don’t know why they’re entering
    a specific trade, and more importantly, when they should exit that trade. So clear
    profit goals and stop-losses should be decided before starting.


    ## Giving into fear or greed


    Two basic emotions tend to control the actions of many traders: fear and greed.
    Fear can appear in the form of prematurely trading because you read a disturbing
    article, heard a rumor from a friend, or got scared by a sudden dip in price (that
    may soon be corrected). The other major emotion, greed, is actually based on fear
    of missing. When you hear people telling you about the next big thing or when
    market prices rise sharply you don’t want to miss out. So you get into a trade
    too soon or even prematurely. Remember that in most cases, our emotions rule us.
    So say “This won’t happen.” Be aware of your tendency towards fear and greed and
    stick to the plan that was laid before you started the trade.


    ## Practical ways to make money with bitcoin


    So you want to get your hands on some free bitcoin? Now, you might have heard
    how you can make money with bitcoin, magic money and digital currency that can
    be traded or used to make purchases. This digital money uses encryption to make
    safe and secure transactions instantly anywhere in the world. Not regulated by
