    Two years later, bitcoin has been embraced an increasingly larger proportion of
    the global community, allowing entrepreneurs to develop active trading platforms
    for the currency. For those interested in using bitcoin as a vehicle for foreign
    exchange, a variety of platforms currently exist which allow for intra-currency
    trading. Some of the larger platforms are Kraken, Mt.Gox, VirWox and Intersango.


    Each of these exchange vehicles features a unique set of services and stipulations.
    Security plays an incredibly important role in bitcoin trading due to both the
    intangible nature of the currency and the lack of a comprehensive regulatory infrastructure
