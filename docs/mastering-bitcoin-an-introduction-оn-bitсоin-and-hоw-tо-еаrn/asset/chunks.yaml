  trans: '

    此外，NEO 因与中国政府的良好关系而受益，而中国政府通常对加密货币采取严厉立场。截至 2019 年 2 月 9 日，NEO 的市值为 4.9248 亿美元，代币价值为
    7.58 美。


    # Namecoin


    Namecoin 是一种实验性的开源技术，旨在提高互联网基础设施某些组件（如 DNS 和身份）的去中心化、安全性、抗审查性、隐私性和速度。


    Namecoin 是比特币的首次硬叉，仍然是最具创新性的“替代币”之一。它首次实现了合并挖矿和去中心化 DNS。


    Namecoin 还是 Zooko 三角（Zooko’s Triangle）问题的解决方案，即产生一个既安全、去中心化又具有人类意义的命名系统的长期难题。Namecoin
    可以用于什么？


    * 通过使网络更具抗审查能力，来维护在线言论自由权。

    * 将身份信息（如 GPG 和 OTR 密钥以及电子邮件、比特币和 Bitmessage 地址）绑定到你选择的身份。

    * 具有人类意义的 Tor 洋葱域名。

    * 由区块链共识支持的去中心化 TLS (HTTPS) 证书验证。

    * 使用 .bit 顶级域名访问网站。

    * 提议诸如文件签名、投票、债券/股票/股份、信任网、公证服务和存在证明等想法。


    # Litecoin (LTC)


    Litecoin 出于 2011 年，是比特币之后首批加密货币之一，经常被称为“比特币的银”。它由麻理工学院毕业生、前 Google 工程师李林（Charlie
    Lee）创建。


    Litecoin 基于开源全球支付网络，该网络不受任何中央机构控制，并使用“scrypt”作为工作量证明，可以通过消费级 CPU 的帮助进行解码。尽管 Litecoin
    在许多方面与比特币相似，但它的区块生成速度更快，并能提供更快的交易确认。除了开发者之外，接受 Litecoin 的商家也日益增加。截至 2019 年 2 月
    9 日，Litecoin 的市值为 26.3 亿美元，代币价值为 43.41 美。


    # Ripple (XRP)


    Ripple 是一个实时全球结算网络，提供即时、确定且低成本的国际支付。Ripple 出于 2012 年，“能够让银行实时结算跨境支付，具有端到端的透明性且成本更低”。Ripple
    的共识账本（其确认方法）独特之处在于不需要挖矿。通过这种方式，Ripple 将自己与比特币许多许多替代币区分来。由于 Ripple 的结构不需要挖矿，它减少了算力的使用并最大限度地降低了网络延迟。Ripple
    认为“价值价值是激励行为的方法”，目前计划通过开发交易发放 XRP，激励提供支付的流动性提供者，并向感兴趣的投资者出售 XRP。到目前为止，Ripple 成功了；它仍然是寻求跨境支付解决方案的金融机构中最感兴趣的数字货币之一。截至
    2019 年 2 月 9 日，Ripple 的市值为 120 亿美元，代币价值为 0.38 美。


    # Primecoin


    Primecoin 是一种创新的加密货币，是一种通过加密技术保护并通过去中心化挖矿市场发行的数字货币。源自 Satoshi 的比特币，Primecoin 引入了基于质数的独特工作量证明形式。


    Primecoin 的优势——Primecoin 中创新的质数工作量证明不仅为网络提供了安全性和铸币，还产生了对数学研究有特殊意义的特殊质数。因此，与比特币相比，Primecoin
    网络是能源密集。


    Primecoin 背后的价值——Primecoin 网络搜索被称为坎汉链（Cunningham chains）和双孪生链（bi-twin chains）的质数链。这些质数链的分布即使是最简单的孪生质的情况下，其无限存在性也没有被证明。


    # Monero (XMR)


    Monero 是一种安全、隐私且不可追溯的货币。这种开源加密货币于 2014 年 4 月推出，很快引起了密码学社区和爱好者的兴趣。这种加密货币的发展完全基于捐赠和社区驱动。


    它关注去中心化和可扩展性，通过使用名为“环签名”（ring signatures）的特殊技术实现了完全隐私。通过这种技术，会出现一组加密签名，其中包含至少一个参与者，但由于它们看起来都是有效的，因此真实的无法被隔离。由于这种异常的安全机制，Monero
    产生了某种负面声誉；它与全球的犯罪活动联系在一起。尽管如此，无论用于善还是坏，不可否认 Monero 为加密货币带来了重要的技术进步。截至 2019 年 2
    月 9 日，Monero 的市值为 8.085 亿美元，代币价值为 48.18 美。


    # Feathercoin


    一种没有中央银行或机构的互联网 Feathercoin 使用点对点技术超越了旧银行系统。支付是无边界的，并且可以通过廉价硬件处理。这项工作通过网络发行的新羽毛（feathers）获得奖励。Feathercoin
    基于 NeoScrypt，具有比特币中不具备的特征。ATM 和销售点项目、Feathercoin T 恤钱包以及基于树莓派的项目多到无法列举，但这些是使加密货币与大多数货币区别开的技术方面。


    NeoScrypt 算法

    当前代 ASIC 抗性 80

    每个区块代币奖励总计 3.36 亿

    区块目标为 1.0 分钟

    区块奖励每 2,100,000 个区块减半

    每个区块目标平均 15,120 和 480 个区块，并有 25% 的抛售。

    默认 Feathercoin 网络端口为 9336

    默认 RPC 挖矿端口为 9337

    eRC (增强算力)

    ACP (高级检查点)


    # Cardano (ADA)


    以太坊联合创始人之一查尔斯·霍斯金（Charles Hoskinson）于 2017 年 9 月推出了 Cardano。对于这种数字货币的支持者来说，ADA
    提供了以太坊的所有以及其他优势。Cardano 为 DApps 和智能合约提供了一个平台，类似于之前的以太坊。此外，ADA 旨在解决加密加密货币的问题，包括互操作性和可扩展性。


    Cardano 还希望解决与国际支付相关的问题，这些通常既耗时又昂贵。由于对这一领域的关注，ADA 将国际支付处理时间从几天缩短到了几秒。截至 2019 年
    2 月 9 日，cardano 的市值为 11.6 亿美元，代币价值为 0.041 美。


