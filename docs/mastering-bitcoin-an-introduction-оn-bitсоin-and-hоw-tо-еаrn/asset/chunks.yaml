    你可能听过比特币交易是不可逆的，那么为什么还建议等待多次确认呢？答案相当复杂，需要对上述挖矿过程有深入理解：想象有两个矿工，分别位于中国的 A 和冰岛的 B，他们大约在同一时间解决了当前区块。A
    的区块（A1）从北京通过互联网传播，到达东部的节点。B 的区块（B1）首先到达西部的节点。现在有了两个竞争的区块链版本！


    哪种区块链会胜出？简单来说，最长的有效链将成为官方的事实版本。假设，下一个解决区块的矿工将其添加到 B 的链中，创建了 B2。如果 B2 在 A2 被发现之前传播到整个网络，那么
    B 链就是明确的获胜者。A 将失去他的挖矿奖励和手续费，而这些只存在于已失效的 A 链上。


    回到 Green 向 Red 支付的例子，假设这笔交易被 A 包含但被 B 拒绝了，B 要求比 Green 支付的费用更高。如果 B 链胜出，Green 的交易将不会出现在
    B 链中——就像资金从未离开过 Green 的钱包一样。


    尽管这种区块链分叉并不罕见，但它们是真实的风险。确认次数越多，交易被认为越安全。


    # 关于比特币电力消耗的分析以及为什么它不是浪费


    2016 年 3 月，Motherboard 预测了这一点：比特币的用电量将在 2020 年增长到与丹麦相当。无论 Motherboard 的计算准确性如何，比特币消耗大量能量的事实是不争疑的。在工业层面，比特币被视为直接将电力转化为货币的东西。


    反对比特币挖矿成本有两个主要阵营：


    ### 生态经济学家

    生态经济学家寻求减少功率消耗。鉴于目前电力是通过不可持续的方法产生的，环保人士认为，所有的能量支出必须与其对气候变化的（有争议的）贡献进行权衡。


    其次，还有一些经济学家怀疑比特币的可行性。这一群体以保罗·克鲁曼（Paul Krugman）为典型代表，他认为比特币（以及某种程度的黄金）对社会没有真实价值，因此代表了资源和劳动的浪费。


    ### 为维护比特币的电力使用

    虽然反驳那些“专家”只需要让他们看看比特币目前的价格和持续存在即可，但要向环保意识人士解释为什么比特币值得其电力成本，则需要更周全的方法。毕竟，维持比特币项目的社会压力是合理的。我们需要在自然和技术之间保持一种健康的平衡。尽管如此，在绿色能源的进步抵消比特币对生态成本高昂能源的依赖之前，比特币持有者必须通过传达这种革命性廉价货币的重要性来为这种支出辩护！


    以下是一些充分的理由，这些理由结合，在我们看来，完全证明了世界在比特币项目上投入公认的高昂电费支出：


    #### 防止通胀和规避资本管制

    当然，这是你的钱。我只是告诉你它值多少钱以及你可以用它来做什么。正如理由 1 中提到的，许多统治者正在稀释“他们的”国家货币的价值，要么作为经济刺激（主要是为了精英阶层的利益），要么作为廉化其巨额债务的手段。这种贬值特别惩罚了储蓄者，因为他们存储财富的价值被侵蚀了。储蓄者自然寻求通过将法定储蓄转换为更具持久的形式（如外币或投资）来保护自己的货币储蓄。


    统治者经常通过实施资本控制来阻止公民逃向货币安全。中国以其特别严格的限制而闻名。比特币挖矿代表了一种规避此类限制的极佳合法途径。投资挖矿带来了规定数量的比特币；一种不受统治阶级控制的货币。对于受限制资本管制的人来说，挖矿代表了统一。考虑到其他财富保护措施的相对成本和风险，即使亏损挖比特币也可能是值得的！考虑一种流行的替代方案，即房地产：彭博估计，2015
    年有万亿美元流出中国，是 2014 年离岸金额的 7 倍。其中大量资金流入了西方城市的房地产（如温哥华）。这种现象为居民创造了泡沫和无法负担的住房状况。比特币挖矿是保护财富且不会产生此类不受欢迎的市场扭曲的有效手段。


    ### 比特币由电力（和诚信）支撑

    你的意思是银行里每有一个美元就没有一盎黄金吗？几千年来，历史证明了繁荣取决于健全的货币。无论是罗马帝国贬低其钱币，还是现代中央银行通胀法货币的供应……货币贬值的悲剧结果都是经济危机。迈克·马洛尼（Mike
    Maloney）先生的精彩系列《金钱的隐藏秘密》在第 5 集中探究了这一永恒的教训。简单来说，没有支撑但仅对其控制者有信心的货币往往是短暂的，并在通胀性的死亡中是毁灭性的。


    比特币的设计首要考虑一个货币目标：通过防止贬值的恶果，避免以往货币形式的惨惨命运。与其信任某些遥远、不可追责的人类权威的智慧和克制，不如比特币的供应限制被刻在它的代码中；作为共识，它的“数字
    DNA”。与法定货币不同，比特币的价值还受到实体、可测量资源的支撑：运行在电力驱动计算硬件上的代码。鉴于货币对我们现代世界（过度）的重要性，维持一种技术优于缺陷法定货币的替代方案绝对是的。


    # 在全球经济放缓的情况下，挖矿是一个盈利且充满前景的行业

    比特币持有者是少数不经常下调自己经济预期的幸运儿。在比特币挖矿竞争激烈的的世界中，盈利的主要决定因素是低电力成本、获取尖端 ASIC 硬件以及对比特币的深度了解。


