    比特币的支持者在联邦货币监管机构和执法部门的同意下认为，任何金融机构、支付系统或交易介质都有存在被用于洗钱或其他非法活动的可能。


    ### 过度波动性


    根据杜克大学金融学教授坎贝尔·哈维斯（Campbell Harvey）在《华尔街日报》上发表的一项分析显示，在过去的三年中，比特币的波动性是黄金的 7.5
    倍，是标普 500 指数的 8 倍以上。这与法国巴黎高等金融大学副教授玛丽·布里埃（Marie Brière）的分析相吻，她计算出年收益率为 370%，波动率为
    175%。这种在短时间内剧烈的波动对于买卖双方来说都不是理想的交易介质，限制了比特币作为业务重要工具的。许多人认为比特币是类似于荷兰郁香花的投机泡沫。证据表明，当前市场主要是投机性的，四之三的矿币正在等待价格上涨。


    ### 高损失风险


    凯托研究所（Cato Institute）兼职学者、《福布斯》定期撰稿人托马斯·B·李（Thomas B. Lee）指出了四个原因：缺乏安全性。没有安全网来保护你免受人为错误（密码）、技术故障（硬盘故障、恶意软件）或财务欺诈的影响。根据《连线杂志》（Wired）英国版的一篇文章，在
    40 家提供比特币兑换其他货币的网络业务公司中，有 18 家已经倒闭，只有 6 家赔偿了客户。该研究的作者估计，任何交易所的中位寿命为 381 天，新交易所有
    29.9%的可能性在开放的一年内关闭。


    加强监管。虽然目前实施了相对温和的指导方，但执法机构可能会认为比特币是一个“巨大的洗钱计划”，并制定更严格的规定，这将削弱该货币的价值。


    扩展性有限。该系统的设计限制了处理交易的速度和数量，使得比特币不太可能取代传统的信用卡交易。


    缺乏应用。在承认比特币在非法交易中广泛使用的同时，他们质疑比特币究竟有多用。若要对现有的法币或电子支付系统产生真正的颠覆性，比特币需要用于低成本国际汇款、创建复杂的电子合同，或用于类似于
    Kickstarter 风格的众筹或微支付转账。


    乔治敦大学麦当商学院金融学副教授詹姆斯·J·安杰尔（James J. Angel）在 CNN 的一篇文章中指出，最大的比特币交易所之一曾是一个交易热门游戏卡片的在线网站：“一个基于卡牌交易的交易所并不是货币的稳固基础。”金融专家认为，货币和货币交换中固有的问题比软件遇到的局限性更复杂。安杰尔还预测，比特币挖矿软件将成为病毒的磁铁，因为没有政府对其进行监管。2013
    年 12 月 8 日，《金融时报》报道道，“比特币引发了网络攻击数量激增”，发生了超过 30 万次。网络攻击向黑客用于维护所有权账本的计算机所有者索要比特币。此外，斯莫基先生（Mr.
    Smoky）在参议院小组作证时指出，比特币并未被成熟金融服务广泛接受，限制了其应用和使用。


    ### 比特币是如何产生的？


    当计算机成功将区块添加到区块链上时，它们将获得加密货币作为奖励。此前讨论过，每 10 分钟产生的比特币数量每四年减半。在写作时，计算机每向区块链添加一个区块可获得
    12.5 个比特币，或约 48,625 美元。


    如果 48,625 美元的数字听起来很诱人，请注意，将区块添加到区块链的过程（即加密货币世界所谓的“挖矿”）并不简单。事实上，在比特币网络上解决这些问题之一的概率约为万亿分之一（12
    个零）。为了让你直观理解这个数字，赢得大奖彩票的概率是 1300 万分之一。要在这种概率下解决复杂的数学问题，计算机必须运行消耗大量电力、能量和资金的程序。与中彩票类似，解决哈希值本质上取决于运气——但在两项比赛中都有增加中胜几率的方法。对于比特币来说，在另一个矿工之前得到正确答案几乎完全取决于你的计算机产生哈希的速度。就在十年前，比特币挖矿可以在普通的台式机上进行竞争性操作。然而，随着时间的推移，矿工们发现通常用于游戏的显卡比台式机更有效，而图形处理器（`GPU`）开始主导局面。2013
    年，比特币矿工开始使用专门为挖掘加密货币设计的计算机，称为`ASICs`。这些`ASICs`远快于`GPU`。


    '
