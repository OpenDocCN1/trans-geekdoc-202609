  trans: '

    2014 年，以太坊发起了以太预售，引起了巨大的反响；这开启了首次代币发行（ICO）时代的到来。根据以太坊的说法，它可以“编码、去中心化、安全并交易几乎一切”。在
    2016 年 DAO 遭受攻击后，以太坊分为以太坊（ETH）和以太坊经典（ETC）。截至 2019 年 2 月 9 日，以太坊（ETH）的市值为 124.亿美元，每个代币价值为
    118.71 美元。


    # EOS (EOS)


    我们列表中最新的数字货币之一是 EOS。EOS 于 2018 年 6 月推出，由加密货币先驱 Dan Larimer 创立。在开发 EOS 之前，Larimer
    创立了数字货币交易所 Bitshares 以及基于区块链的社交媒体平台 Steemit。与列表上的其他加密货币一样，EOS 是以以太坊为设计的，因此它提供了一个开发者可以在上面构建去中心化应用的平台。


    然而，EOS 因许多其他原因而闻名。首先，它的首次代币发行是历史上最长且最丰厚的 ICO 之一，通过持续一年的众筹活动，从投资者那里募集了约 40 亿美元的资金。EOS
    提供了一种委托权益证明（DPoS）机制，它希望提供比竞争对手更具扩展性的能力。EOS 由 EOS.IO（类似于计算机的操作系统，作为数字货币的区块链网络）以及
    EOS 硬币组成。EOS 的具有革命性的，因为它缺乏产生代币的挖掘机制。相反，区块生产者生成区块，并根据其产率获得 EOS 代币奖励。EOS 包含了一套复杂的规则系统来管理这一过程，其理念是网络最终将比其他加密货币更加民主和去中心化。截至
    2018 年 10 月 5 日，EOS 的市值为 24.9 亿美元，每个代币价值为 2.74 美元。


    # Novacoin


    Novacoin 是特色币种。它通过利用工作量证明（PoW）和权益证明（PoS）进行区块生成的独特方式，以及其分离的限制使其脱颖而出。尽管 Novacoin
    在某些方面与 PPCoin 相似，但它是一个拥有自己意识形态和独立代码库的项目，因此很难进行此类比较。我们可以肯定地说：Novacoin 使用较新版本的比特币作为基础。


    Novacoin 具有不同的发行模型（每个币每年的浮动奖励）。


    Novacoin 使用 scrypt 哈希函数进行工作量证明。


    Novacoin 同时使用工作量证明和权益证明进行链信任评分。NovaCoin 对工作量证明和权益有分离的限制。Novcoin 具有工作量证明区块签名。


    # 比特币钱包


    比特币钱包是存储比特币的软件程序。比特币并不存储在任何地方；每个地址都有一个私钥（秘密数字），保存在用于证明所有权的钱包中。比特币钱包方便发送和接收比特币，并将比特币的所有权交给用户。比特币钱包有多种形式；桌面端、移动端和硬件是四种类型的钱包。


    ## 拆解比特币钱包


    比特币钱包也被称为数字钱包。建立此类钱包是获取比特币过程中的重要步骤。正如比特币是现金的数字等价物一样，比特币钱包类似于实体钱包。但它不是字面上的存储比特币，存储的是大量相关信息，如用于访问地址和执行交易的安全私钥。钱包的四种主要类型是桌面端、移动、网页和硬件。


    桌面钱包安装在桌面电脑上，为用户提供对钱包的完全控制。桌面钱包允许用户创建用于发送和接收比特币的比特币地址。它们还允许用户存储私钥。一些已知的桌面钱包有 Bitcoin
    Core、MultiBit、Armor、Hive OS X、Electrum 等。


    移动钱包克服了桌面钱包的局限性，因为后者固定在一个地方。这些以付费应用的形式存在。一旦你在智能手机上运行该应用，钱包就可以执行与桌面钱包相同的功能，并帮助你随时随地从手机上直接支付。因此，移动钱包通过通过
    NFC 扫描二维码使用“触碰支付”来方便在实体店中进行支付。Bitcoin Wallet、Hive Android 和 Ethereum Bitcoin Wallet
    是少数几个移动钱包。比特币钱包通常不支持同时在 iOS 和安卓系统上运行。建议对你偏好的移动端比特币钱包进行研究，因为一些伪装成比特币钱包的恶意软件是一个问题。


    至于网页钱包，它们允许你在任何地方、通过任何浏览器或移动设备使用比特币。选择你的网页钱包必须非常仔细，因为它将你的私钥存储在网上。Coinbase 和 Blockchain
    是流行的网页提供商。硬件钱包是最安全的钱包，因为它们将比特币存储在通过 USB 连接到电脑的物理设备上。它们对攻击免疫，据极少数被窃报告。这些设备是唯一不是免费的钱包，它们通常花费
    100 到 200 美元。保护你的钱包至关重要，因为钱包是高价值目标。保护措施包括：使用强密码加密钱包，并选择存储选项，即离线存储。建议使用桌面钱包和移动钱包，因为我们致力于研究、测试和推荐最好的产品。在访问我们的内容后进行购买，我们可能会获得佣金。了解我们的评审流程。比特币已席卷全球，为我们日常生活中所有熟悉的政府支持货币提供了一种货币替代方案。支持者认为，数字货币比传统货币更容易、更安全，并提供更好的隐私保护。由于比特币相对于美元和其他货币的价值在过去几年中飙升，它已作为投资机会出现在一些人的视野中。


    Exodus 是一个像以太坊一样的软件钱包，但更美观、更直观。它提供了类似的安全益处，但外观完全不同。桌面钱包将你的数字货币（比特币及许多其他货币）转换为带有图表和曲线的投资组合。你可以通过应用集成
    ShapeShift 交易所进行货币交换。没有账户设置，所以你的货币和钱包只属于你。照顾好你的电脑！Exodus 包含了私钥加密和其他实用的安全工具。得益于投资组合和图形视图，它非常适合任何有投资背景并想进入数字货币的人。


    # Mycelium


    Mycelium 是一个仅限移动端的比特币钱包，提供安卓和 iPhone 版本。Mycelium 以比其他比特币钱包稍微复杂一点而闻名。但高级用户应该能够很好地应对这种体验。


