    Today, 80% of bitcoins have been mined and miners need customized rigs designed
    to do nothing but solve bitcoin problems. As an individual miner, you''d usually
    join forces with a pool of other miners, but this involves fees that cut into
    your profits.


    # How can I get bitcoins?


    First, you''ll need a place to keep your bitcoins — a wallet. This wallet is a
    string of text that people can use to send you bitcoins. It''s a bit like a bank
    account number; the only difference is that it isn''t linked to any identifying
    information about you. Signing up for a wallet is as easy as signing up for a
    new account. All you need is an email address to receive a verification link.
    Wallets (that is, the strings of text identifying your holdings) can be held online,
    offline in "cold storage" hardware such as a USB stick or even on paper (this
    method involves a paper with a QR code that, when scanned, offers access to online
    wallet). Keeping this wallet safe is critical — billions of dollars'' worth of
    bitcoin is estimated to be lost through losing to wallets, whether by throwing
    them out or details.


    Blockchain is a popular, free wallet with 15 million users. It can be accessed
    via a web browser as well as Android and iOS apps. Unlike many others, it doesn''t
    require identification (although you''ll be encouraged to add some to facilitate
    receive). Because there always possibility that a wallet can be hacked (like any
    other account), if you intend to keep a large amount of bitcoin, it''s a good
    idea to store most of your haul in a cold-storage wallet.


    Ethereum is a newer, also free online wallet for desktop and Android, with a relatively
    easy-to-use interface and option to save the bulk of your bitcoin stash in cold
    storage (As of publishing, there had a security breach which has been addressed).
    Ledger Nano is a hardware option with wallet software on a USB stick that keeps
    your bitcoin safely and can plug into a computer to send or receive bitcoins instantly.
    A backup and recovery sheet contains your wallet details, so if you lose the stick,
    your coin is safe. Available for $98.99 at Amazon.


    # Where can I get bitcoins?


    The easiest way to score some bitcoin is to head to a bitcoin exchange site, of
    which there are dozens, based around the world. Bitcoin exchanges are a platform
    for buyers and sellers of bitcoin to conduct transactions, for a fee.


    San Francisco-based Coinbase is one of the best-known exchanges, and allows transactions
    between bitcoin and your local currency, cashing out to your bank account or debit
    or credit card (if you use a bank that doesn''t ban cryptocurrency purchases).
    You can also trade in two other digital currencies — ethereum and bitcoin — as
    well as sign up for a Coinbase wallet for seamless trading on its exchange.


    If you live in the U.S., you might want to choose a U.S.-based exchange to avoid
    foreign transaction fees from your bank.


    You''ll find that the value of a bitcoin varies somewhat across exchanges — this
    is due to the different demand (from users) and supply (from users holding bitcoin)
    on exchange, and varying transactions. There is also small number of ATMs — about
    1,600 in the U.S. — where you can withdraw cash from your debit account to deposit
    as bitcoin (in other words).


    # Is bitcoin really anonymous?


    You might have spotted above — how anonymous is using bitcoin if a wallet ID be
    linked to a real-world account? The answer is that transactions often can be back
    to identifying details, as third-party wallet providers and exchanges — printing
    in its. Because all transactions in the bitcoin blockchain, it''s also possible
    to track payments made and received by a particular wallet and build a profile
    based on bitcoins, especially if they happen to be spent at a real-world out to
    bank account. Researchers at Princeton University found that the data leaked through
    cookies and web trackers could be sufficient to link the transactions to users''
    information such as email addresses.


