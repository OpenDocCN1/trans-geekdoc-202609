    (0.00000100 ฿) and Coinnadder pays around 25 satoshis per click.


    ### Doing Micro Jobs


    Much like Microworks and Cloudfactory, which pay you a small fee to complete very
    simple tasks like watching a YouTube video or completing someone’s survey, there
    are several working sites that will pay you in bitcoin. Bitcoin is the major player
    in this market which will pay you around 20,000 satoshis while others like Cointask
    will pay you a slightly lower sum.


    ### Mining Bitcoin


    So, you don’t have to dig the ground to get bitcoin. Not in that sense anyway.
    So why call it mining? Similar to gold miners who have to bring out the gold,
    in this case, bitcoin into the surface. While money has a government that prints
    and distributes it, bitcoin has miners who use special software to solve problems
    and are issued bitcoins in exchange. Mining used to be relatively simple, and
    the earliest miners were able to mine thousands using home computers. However,
    in a competitive market, miners need computer parts that the high power required
    to mine more difficult algorithms. Since this is a race to solve blocks first,
    miners combine their processing power to solve each transaction first. The rewards
    from miners’ fees is then split among members of the pool. Remember that bitcoin
    mining is not profitable as it used to and many are claiming it to be the end.
    The future of mining in 2019 will depend on the price of Bitcoin. If price goes
    up, mining will continue and the number of miners increases. If the price goes
    down, miners will gradually disappear. It presents new miners with new challenges
