    Much power as Denmark by 2020, then add the assumption that Bitcoin will have
    scaled sufficiently by then to cater to every user of the fiat system… it becomes
    impossible to compare the two systems, in an admittedly rough-and-ready fashion.


    Allowing that Bitcoin will replace banks, ATMs, brokers, exchanges and payment
    services (like VISA, Mastercard and PayPal) around the world, we can offset the
    electricity required by all those services. Considering the combined electric
    costs for these operations (covering lighting, air-conditioning, data-centers,
    website hosting, office equipment and more) the total probably approaches or even
    exceeds Denmark’s current power usage.


    Besides raw electricity, there are many other resources necessary for the continued
    operation of the fiat system but not to Bitcoin. For example:

    * Printer paper and other office supplies

    * The armored cars used to transport cash

    * The paper, textiles, ink and power needed to create that cash, The gasoline
    used by all employees driving to and from work every day

    * The resource cost of building offices

    * And so on, ad infinitum.


    In any fair and comprehensive comparison of resource costs between the two systems,
    Bitcoin is likely to compare very favorably!


    ### Mining Generates Subsidised Heat


    Excess heat from Bitcoin mining – problem or solution?


    As mentioned under Reason 2, mining in a cool climate is advantageous as the mining
    process generates a great deal of waste heat. However, enterprising Bitcoin miners
    can capture and use this heat productively! There are many examples of data centers
    reusing heat (for example Iceland warming a public pool) which Bitcoin miners
    could follow. Waste heat can even be useful to agriculture and it’s possible to
    heat air for drying. For office or home use, an additional source of passive income
    to make indoor temperatures more affordable. Although gas, wood, and oil remain
    the cheaper options, electricity tends to be the most expensive. The good news
    is that, according to somewhat outdated calculations of New York miner, mining
    rigs offer considerable savings over standard heating. As an additional benefit,
    mining rigs be precisely controlled via common hardware, such that automated heating
    and climate control systems programmed with relat. The only downside for home
    miners is that mining rigs are often noisy and loud. As a result, they tend to
    be situated in basement or garage for the sake of quiet. A little being called
    to heat where it’s more needed in the house. Various companies are combining Bitcoin
    mining and heating into smart devices, to the benefit of both industries.


    ### Bitcoin Mining can support the IoT (Internet of Things) Rise of Digital Corporations
    and other buzzwords


    Continuing the theme of Bitcoin integration with household and industrial devices,
    this is the precise business model of potentially disruptive Bitcoin company,
    `21.co`. `21` raised $120 million in venture capital, a record for a Bitcoin company.
    As their initial product offering, `21.co` released a Raspberry Pi-like device
    with built-in Bitcoin features; mining included. While such low-powered devices
    earn very little income, even a few hundred Satoshis opens the door to automated
    micropayment… It’s long been known that Bitcoin offers real potential for machine-to-machine
    payments. This potential is likely to be released soon with the deployment of
    the first Lightning Network. The results are bound to be interesting; perhaps
    even the beginning of a profound technological shift in how we conduct our lives
    and businesses! Smart, interconnected devices offer great promise in terms of
    self-reporting of problems and supply shortages, even the self-calibration and
    the self-diagnosis of problems. Bitcoin and additional layers are the most likely
    payment avenues to cater for these new, developing industries. After all, machines
    don’t have bank accounts or credit cards. How else will machines pay for their
    own inputs and how better could they charge for outputs? Certainly, the possibility
    of enabling exciting and potentially technologies is worth the energy between
    smart devices and power saving through efficiency.


    ### Denmark and Germany Occasionally Struggle with Excess Power


    “On Sunday, May 8 [2016] Germany produced so much electricity that prices went
    negative. As in, power companies paid to use it recently reported that Germany’s
    solar and wind generation overloaded its grid.” – Fortune.com


    Considering motherboard’s production, similar power situations occur in nearby
    Denmark. This means that if you set in a location which electricity green sources,
    it’s possible to get paid for mining as a public service!


    ### Mining Powers Bitcoin’s Tokenized Assets, Secondary Layers and- Mined Coins


    Mining isn’t just mining Bitcoin! If the mining process is the powerful engine
    driving Bitcoin, then it’s certainly a unit that loses efficiency for driving
    additional processes. Namecoin, the very first altcoin, uses the same `SHA-256
    Proof of Work` algorithm as Bitcoin, which means miners find solutions to both
    Bitcoin and Namecoin blocks. As Namecoin serves decentralized `DNS` (Domain Name
    Server), the effect is to bring greater resilience and sensor-resistance to the
    internet. Somewhat similar to Namecoin in concept, but more closely tied to Bitcoin,
    are sidechains. These are essentially separate blockchains which are pegged to
    Bitcoin’s blockchain. This benefits Bitcoin by extending it to other unusable
    use-cases. It also benefits the side-chain by backing and securing it crypt with
    the huge power of the Bitcoin mining industry. Tokenized coins are another technology
    layer with far-reaching implications, which are similarly backed and secured by
    Bitcoin mining. By associating particular units of `bitcoin` with digital, financial
    or physical assets, ownership of such assets may be exchanged. This works with
    everything from stocks to in-game items to land deeds and so on. Various stock
    markets, land registries and patent databases around the world are experimenting
    with such applications. Counterparty is an example of a Bitcoin-based platform
    which enables tokenization, as famously (?) seen in the Rare.


    ### Mining Efficiency is Constantly Increasing


    Finally, it must be noted that the efficiency of Bitcoin mining is constantly
    improving, so less power is used to provide more security. Since Bitcoin’s release
    in 2009, mining hardware has evolved from computer CPUs to graphics GPUs to `FPGA`
    (Field-Programmable Gate Array) and now to `ASIC` (Application-Specific Integrated
    Circuit). `ASIC` mining architecture and processes are under continuous development,
    with lucrative rewards on those who bring the latest and greatest innovations
    to market.

