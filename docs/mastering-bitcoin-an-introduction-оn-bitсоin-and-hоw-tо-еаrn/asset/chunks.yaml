    这就是为什么你反对的原因！这实在太贵了，而且你不太可能盈利。


    然而：


    对于兴趣挖矿，我们将向你展示现在可以采取的一些步骤，让你现在就开始挖掘比特币。


    ### 第一步：获取比特币挖矿硬件


    没有 ASIC 矿机，你就无法进行挖矿。ASIC 矿机是专为挖掘比特币而制造的专用计算机。不要尝试在你的家用台式电脑或笔记本电脑上挖掘比特币！你每年的收益将不到一分钱，而且会浪费电费。


    ### 第二步：选择矿池


    一旦你获取了挖矿硬件，你就需要选择一个矿池。如果没有矿池，只有在你自己发现区块时你才能获得挖矿收益。这被称为“单机挖矿”。我们不建议这样做，因为你的硬件算力极可能无法达到能够通过单机挖矿发现区块的水平。


    #### 矿池有什么什么帮助？


    通过加入矿池，你与矿池共享你的算力。一旦矿池发现区块，你将根据你对矿池贡献的算力百分比获得收益。如果你贡献了矿池 1% 的算力，你将从当前 12.5 比特币区块奖励中获得
    0.125 比特币。


    ### 第三步：获取比特币挖矿软件


    比特币挖矿软件是你实际上将挖矿硬件连接到目标矿池的工具。你需要使用该软件将你的算力指向该矿池。同时在软件中，你还会告诉矿池应该将收益发送到哪个比特币地址。如果你没有比特币钱包或地址，请学习如何获取一个。Mac、Windows
    和 Linux 都有相应的挖矿软件。


    ### 第四步：比特币挖矿在你的国家合法吗？确保这一点！


    这因地而异。请咨询当地国家以进一步确定比特币挖矿是否合法以及操作的税务影响。和其他业务一样，你通常可以抵扣使运营盈利的支出，例如电力和硬件。


    ### 第五步：比特币挖矿对你有利利吗？


    你了解开始前需要做什么吗？你应该进行一些计算，看看比特币对你来说是否有利。你可以使用比特币挖矿计算器来获得大致的想法。我想与你挖矿相关的因素在不断变化。比特币价格翻倍可能会让你的利润增加一倍。但是：它可能让挖矿变得如此激烈，以至于你的利润保持不变。


    ### 如何在安卓或 iOS 上挖掘比特币


    很有趣的是：你实际上可以在任何安卓设备上挖掘比特币。使用像 Crypto Miner 或 Easy Miner 这样的应用程序，你可以挖掘比特币或任何硬币。不好玩的地方在哪里？你每年的收益可能不到一分钱！为什么呢？安卓手机的性能根本不足，无法匹配专业人士使用的挖矿硬件。所以，在你的安卓手机上运行一个矿器看看它是如何工作的可能很酷。但不要指望能赚到钱。也不要指望会浪费大量的手机电池！


    ### 什么是比特币挖矿硬件


    比特币挖矿硬件（ASIC）是用于挖掘比特币的高度特化计算机。ASIC 行业已变得复杂且竞争激烈。挖矿硬件现在只位于电力廉价的地方。当 Satoshi 发布比特币时，他的打算让在计算机
    CPU 上进行挖掘。优秀的程序员们很快发现他们可以从显卡获得更多的算力，并编写挖矿软件来实现这一点。GPU 随后被 ASIC（应用专用集成电路）取代。如今，所有严肃的比特币挖矿都在
    ASIC 上进行，通常在可以获得廉价电力的温控数据中心内进行。规模经济导致了算力集中在比最初预期更少的人手中。


    ### 比特币交易基础


    在投资者交易比特币之前，他们应该确保回顾基础知识。通过这样做，他们可以增加实现投资目标的概率，无论他们是想产生稳健的回报还是仅仅使用比特币来实现投资组合的多化。


    ### 为什么要交易比特币？


    首先，投资者可能想要先考虑为什么他们想要交易比特币。毕竟，许多观察者已经表示数字货币带有巨大的风险。例如，欧洲监管机构在 2018 年警告说货币是“高风险”的。传奇投资者沃伦·巴菲特多次警告投资者数字货币，他于
    2018 年告诉 CNBC，“在货币方面，我几乎可以肯定它们将会（变得零价值）。”尽管许多人对比特币的性质发出警告，但这种数字货币经历了令人印象深刻的增长。例如，在
    2017 年，比特币价格从不到 1,000 美元飙到 20,000 美元以上。比特币的价格也脱离了其他数字资产的价格范围，使其成为多元化策略的首选。数字货币的价格走势并不遵循其他资产，使其融入了更大的稳定性。


    ### 投资 VS 交易


    一旦个人评估了比特币是否适合他们，他们就可以开始研究投资数字货币或交易它的什么是合理的。虽然这两个词听起来一样，但它们是不同的。在区分两者时，最简单的思考方式是投资是一项长期活动，而交易是一项更短期的活动。例如，许多人为了退休而投资，随着时间的推移积累财富以建立可靠的养老金。或者，他们可能为子女的教育储蓄。然而，交易可以是更短期，因为一个人可能购买某项证券并打算在当天晚些时候卖出。高频交易是一个更极端的例子，涉及在几分之一内买卖资产。投资者应该记住，比特币以波动大而闻名。它的价格经历过剧烈的反弹也经历过显著的下跌。因此，投资者应该记住，在交易比特币时，他们可能会迅速失去本金价值。另一方面，他们通过交易这种数字货币可能会产生一些非常有吸引力的回报。


    ### 比特币以外的加密货币


    比特币不仅是一个趋势引领者，开启了一波建立在去中心化点对点网络上的加密货币潮，它已成为加密货币的事实标准，激励了不断增长的跟随者和衍生币。


    #### 什么是加密货币？


    在我们仔细观察这些比特币的替代品之前，让我们退后一步，简要检查我们对加密货币和代币（altcoin）等术语的定义。广义上，加密货币是虚拟或数字货币，以代币（tokens）或“coins”的形式存在。虽然某些加密货币通过信用卡或其他项目进入了物理世界，但大多数仍然完全是无形的。加密货币中的“加密”是指密码学，它允许特定的数字代币安全地（通常是匿名地）生成、存储和传输。与这些货币重要的“加密”特征并行的，是对去中心化的共同承诺；加密货币通常由团队通过代码开发，这些团队构建了发行机制（通常，但并非总是，通过一个被称为“挖矿”的过程）和其他控制措施。


    #### 核心要点


    广义上，加密货币是虚拟或数字货币，以代币（tokens）或“硬币”的形式存在。虽然某些加密货币通过信用卡或其他项目进入了物理世界，但大多数仍然完全是无形的。


