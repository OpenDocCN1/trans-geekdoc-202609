    贝利兹正积极吸引美国人购买该国房地产，并将其纯净的海滩、税收政策和流利的英语作为营销重点。贝利兹还有很大的增长空间，它必须消除刻板印象。


    传统基金会（Heritage Foundation）认为智利在拉丁美洲经济自由度排名第一。智利拥有贸易顺差，其 4.5%的央银行利率对智利以外的投资者极具吸引力。对于那些希望利用美国、欧盟和日本等利率极低国家/经济区进行套利交易的人来说，交易智利比索可能是一项值得投入的努力。智利通通货膨胀率低，其政策不仅有利于廉价出口产品，也有利于其他出口产品，以维持顺差。摩根士丹利（Morgan
    Stanley）预计，智利、秘鲁、哥伦比亚和墨西哥在 2014 年的平均增长将达到 4.25%。这些国家没有面临抢劫爆发、卫生纸之争，也没有试图对另一个国家升级行动的领导人。


    ### 比特币对国家导向型经济的影响


    在所有这些国家导向的经济体中，都存在货币管制。委内瑞拉和阿根廷因价格管制而臭名昭著。巴西政府对经济的影响源于过度影响、可能的腐败问题以及通货膨胀担忧。企业家、投资者和普通个人将寻求市场满足他们的需求。配给、官僚主义、高成本和可能的监控都与国家导向型经济体相关联。比特币和加密货币将满足许多可以使用互联网的人的需求。


    在那些希望更加封闭但产生负面影响的国家进行全球竞争时，使用互联网以及在全球市场以可能的不可追踪方式进行交易的能力，将使竞争中的公民能够获得所需的商品和服务。委内瑞拉人将能够在不使用贬值货币的情况下从海外来源购买物品。委内瑞拉人还将有机会在委内瑞拉继续创业，以资助他们的努力，并可能被遣逐到哥伦比亚等国家。超过
    26%的委内瑞拉人每天使用互联网。委内瑞拉尚未过滤互联网，购买比特币比持有本利瓦尔币安全得多。比特币的使用可以消除政府对经济的紧紧控制，并可以征收税收；对于一个武装且可能受过教育的人口来说（你可以在丝绸路上买到任何东西），随着加密货币的使用病毒式传播，政治领导者和执行者的影响力将降低。这种思维可以应用于阿根廷的“委内瑞拉版”，这是一个具有巨大潜力的经济。通过让企业更多接触机会并克服奇异货币问题，巴西经济可以进一步增长。较低的交易成本、对货币的熟悉以及与比特币客户的匿名性将有助于寻求在巴西境外开展业务的巴西公司。随着大量游客和商务人士来到里约内卢和圣保罗，对比特币和其他加密货币的接受将消除货币转换和安全购买的障碍。巴西可能是像阿根廷那样的指令型经济，但全球预期和愿景应该推着他们远离过去的倾向。


    对于国家导向型经济体，比特币及其竞争对手提供了更大的自由度、货币安全、创业机会、交易安全和隐私。在委内瑞拉的情况下，它可能会引发治理的变革，就像社交媒体被认为促成了阿拉伯之春爆发一样。委内瑞拉周围的大部分问题是经济性的，黑市是一个自然的替代方案。通过将资产保存在云端数字钱包中防止资产被没收，比将资金存在委内瑞拉政府监管的银行要安全得多。


    在前一节中描述的比特币在太平洋企业家经济增长中的作用，其规模比希望进入数字空间的哥伦比亚、智利和墨西哥要小。通过较低的汇率和交易费用，更容易从欧洲、加拿大和美国吸引企业。信用卡和
    PayPal 对希望进行国际交易的用户施加限制，而这些限制将会减少。拉丁美洲可以作为中心实现增长，因为中心、开发项目和独立合同无法像现在这样进行竞争性竞标，但他们能够接受比特币和其他加密货币，这将驱动业务发展。这不是一个事实，而是一个让交易变得更容易的问题。减少销售障碍将帮助拉丁美洲企业实现全球化，从而导致风险投资增长。比特币将为拉丁美洲带来更多的国际交易并实现增长。对这些国家的益处各不相同，因为比特币和其他加密货币帮助世界变得更小，就像航空旅行、互联网、电信和社交媒体所的那样。加密货币促进了全球化，比特币将为拉丁美洲提供这种机会，拉丁美洲渴望在全球市场中竞争和增长。


    ### 结论


    多年来，技术让世界变得更小。比特币是技术革命的产物。作为第一种可以供全球范围内作为交换媒介且不涉及政府的全球通用货币（或商品），加密货币将继续吸引关注和阻力。


    在货币流动受到严格政府控制的国家，比特币提供了一种方法，将财富转移到限制较松的的世界地区。此外，由于比特币交易是匿名的，这种加密货币将继续吸引与不法和非法活动相关的交易。


