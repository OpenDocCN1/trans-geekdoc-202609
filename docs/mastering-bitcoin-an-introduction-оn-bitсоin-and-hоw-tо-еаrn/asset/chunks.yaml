  trans: '


    即便到 2020 年丹麦的电力消耗已是如此巨大，再加上假设到那时比特币已经过充分扩展，能够满足每一位法币系统用户的需求……那么以一种显然粗略的方式来比较这两个系统将变得是不可能的。


    假设比特币将取代全球的银行、自动取款机、经纪商、交易所和支付服务（如 VISA、Mastercard 和 PayPal），我们可以抵消这些服务所需的电力。考虑到这些运营的综合电力成本（涵盖照明、空调、数据中心、网站托管、办公设备等），其总和很可能接近甚至超过丹麦目前的总用电量。


    除了原始电力外，法币系统为了持续运行还需要许多其他资源，而比特币不需要。例如：

    * 打印机纸和其他办公用品

    * 用于运输现金的装甲车

    * 制造现金所需的纸张、纺织品、墨水和电力，所有员工每天上下通勤消耗的汽油

    * 建造办公室的资源成本

    * 等等，永无止境。


    在对这两个系统的资源成本的任何公平且全面的比较中，比特币的表现可能都非常有优势！


    ### 挖矿产生补贴热量


    比特币挖矿产生的过热——是问题还是解决方案？


    正如理由 2 中提到的，在凉爽气候下挖矿是有优势的，因为挖矿过程产生大量的废热。然而，有进取的比特币矿工可以高效地捕获并利用这些热量！有很多数据中心重复利用热量的例子（例如冰岛为公共泳池供热），比特币矿工可以效。废热甚至对农业有用，并可以加热空气用于干燥。对于办公室或家庭使用，这是一种额外的被动收入来源，可以让室内温度变得更加负担。尽管燃气、木柴和油仍然是廉价的选择，但电力往往是最贵的。好消息是，根据纽约矿工有些过时的计算，挖矿机与标准加热相比可以大量的成本。作为一个额外的益处，挖矿机可以通过通用硬件进行精确控制，从而运行带有相对湿度控制程序的自动化加热和气候控制系统。家庭矿工唯一的缺点是挖矿机通常噪音很大。因此，为了安静，它们往往被放置在地下室或车库。少量的热量可以引导到家里更需要的地方。许多公司正在将比特币挖矿和加热结合到智能设备中，使两个行业受益。


    ### 比特币挖矿可以支持物联网（IoT）、数字企业和其他热词的兴起


    延续比特币与家庭及工业设备整合的主题，这可能是具有颠覆性的比特币公司 `21.co` 的精确业务模式。`21` 筹集了 1.2 亿美元的风险投资，创下了比特币公司的记录。作为他们的初始产品，`21.co`
    发布了一款类似于树莓派的设备，内置了比特币功能；包括挖矿。虽然此类低功耗设备的收入非常少，但即使是几百个 Satoshi 也为自动化微支付开启了大门……众所周知，比特币为机器支付提供了真正的潜力。这种潜力可能随着第一条闪电网络（Lightning
    Network）的部署而很快释放。结果将是有趣的；也许是我们进行生活和商业活动的方式发生深刻技术变革的开始！智能、互联的设备在问题和供应短缺的自我报告方面具有巨大的前景，甚至是对问题的自我校准和自我诊断。比特币和额外的层级是最可能的满足这些新兴产业的支付途径。毕竟，机器没有银行账户或信用卡。机器将如何如何为自己的投入付费呢？它们又如何能为输出收费呢？显然，实现令人兴奋且具有潜力的技术的可能性，值得在智能设备和通过效率节能之间投入精力。


    ### 丹麦和德国偶尔面临电力过剩问题


    “2016 年 5 月 8 日（周日），德国产生的电力之多以至于价格变成了负值。最近支付费用使用电力的公司报告称，德国的太阳能和风能发电过载了其电网。” –
    Fortune.com


    考虑到主板的生产，附近的丹麦也出现了类似的电力状况。这意味着如果你位于一个绿色电力充足的地方，你可能作为公共服务获得挖矿报酬！


    ### 挖矿驱动比特币的代币化资产、二层和矿币


    挖矿不仅仅是挖比特币！如果挖矿过程是驱动比特币的强大引擎，那么它无疑是一个在驱动额外过程中会损失效率的单元。Namecoin 作为第一种代币，使用了比特币相同的
    `SHA-256 Proof of Work` 算法，这意味着矿工需要为比特币和 Namecoin 区块寻找解决方案。由于 Namecoin 服务于去中心化的
    `DNS`（域名服务器），其效果为互联网带来了更强的韧性和抗审查性。侧链在概念上与 Namecoin 相似，但与比特币联系更紧密。这些本质上是挂钩到比特币区块链的独立区块链。这通过将比特币扩展到其他不可用的用例造福了比特币。它也通过比特币挖矿业的巨大力量为侧链提供支持和加密安全护护。代币化货币是另一个具有深远影响的技术层，同样受到比特币挖矿的支持和安全保护。通过将特定的
    `bitcoin` 单元与数字、财务或物理资产相关，此类资产的所有权就可以进行交换。这适用于从股票到游戏物品再到土地地约等一切事物。世界各地的股票市场、土地登记处和专利数据库正在尝试此类应用。Counterparty
    是一个基于比特币的平台，它实现了代币化，正如在 Rare 中著名的（？）看到的那样。


    ### 挖矿效率在不断提高


    最后，必须指出，比特币挖矿的效率正在不断提高，因此可以使用更少的电力提供更多的安全性。自从 2009 年比特币发布以来，挖矿硬件已从计算机 CPU 演变为显卡
    GPU，再到 `FPGA`（可编程门阵列），现在是 `ASIC`（专用集成电路）。`ASIC` 挖矿架构和流程正在持续开发，对于那些向市场带来最新最伟大创新的人来说，将获得丰厚的回报。


    '
