    Volatility in Bitcoin’s value at the beginning of 2017 that took the price from
    $1129 to under $800 on the same day was likely due to successful speculation from
    China. Bitcoin, and its operational child, blockchain technology, have a future
    in the world markets. However, it is likely that governments all over the world
    will resist a pan-global asset that operates beyond their reach and can facilitate
    activities that run counter to their laws and rules or political agenda.


    # Bitcoin FAQ


    Bitcoin is a digital currency — a virtual form of cash — that allows users to
    make anonymous payments online. Bitcoin transactions are validated by a vast network
    of computers, instead of banks or governments, making it a decentralized form
    of money that many have hailed as a privacy-friendly answer to corrupt banking
    and a recession-proof alternative to inflationary currencies.


    Computers track and encrypt bitcoin transactions in a process called mining, saving
    the data in a record called a blockchain. New bitcoins are created in the mining
    process. The bitcoin blockchain is a public ledger of every bitcoin transaction
    between any two parties. Because it''s constantly validated by thousands of computers,
    this ledger is said to be virtually incorrupt, as a hack would need to outstrip
    the combined processing power of every computer working on the bitcoin blockchain.


    ## What can I use bitcoins for?


    Bitcoin was designed to transfer sums of money between two strangers without the
    need for an intermediary to verify the validity of the transaction. This means
    you can pay another person directly online, without having to provide identifying
    details such as a PayPal account or credit card information.


    Because of bitcoin''s ability to facilitate anonymous purchases online, nearly
    half of all bitcoin transactions are associated with illegal trade (think the
    type of black market activity found in the murier dark web of the internet). Mainstream
    retailers from Microsoft to Expedia are opening their registers to bitcoin. In
    theory, bitcoin could become a viable way to pay for things online without leaving
    the same type of trail a credit card leaves — and without adding to the in-depth
    profile advertisers have of what you like, buy and search for. Its meteoric rises
    and falls have even put bitcoin on two major stock exchanges, as U.S. regulators
    approved derivatives trading on bitcoin futures and swaps (but not direct ownership
    of bitcoin itself).


    ## How secure is bitcoin?


    There are definitely concerns about the security of bitcoin holdings. Hackers
    have attacked major bitcoin exchanges such as Bitfinex and Mt. Gox, making off
    millions of dollars'' worth of currency leaving users with nothing.


    As more people are getting into bitcoin — other cryptocurrencies — there has been
    attacks on users'' wallets. For example, phishing for details and a particularly
    virulent scam to try and gain control of users'' accounts. It''s effective, however,
    to use a wallet that requires at least offline login, making it difficult to hack.
    "Before trusting a wallet with bitcoins, I''d make sure offers good encryption
    with second-factor authentication," says senior security advisor Chester Wisinski.
    "The convenient it is to access, unfortunately for now, there''s little protection
    against losses when exchanges are hacked. Some providers have hit lawsuits for
    losing users; after a 90-minute blackout at the world''s largest exchange, BitThumb,
    cost traders millions of dollars, users filed a class."


    ## Does bitcoin have a future?


    Central banks around the world, including in the U.S., have floated the idea of
    a government-backed digital currency — but it''s early days for bitcoin and other
    cryptocurrencies in the eyes of the Federal Reserve, which noted that there were
    technical and privacy issues to overcome.


    "Bitcoin is not yet money in the standard sense of a commonly accepted medium
    of exchange — you can purchase a pretty limited of things with bitcoin present,"
    says White. "There is acknowledgment that the technology is remarkable and has
    potential uses, but it is too soon to tell whether further advances can make bitcoin
    a more user-friendly, everyday currency."


    ## What''s the catch with using bitcoin?


    The growing numbers of people transacting in bitcoin has slowed down the bitcoin
    network, as it struggles under the processing load. At points, this has increased
    transaction times from a few minutes to more than a day and raised transaction
    fees, making it a rather costly way to pick up that bitcoin bucket.


    "Bitcoin was not designed as an everyday currency," says Lawrence H. White, economics
    professor at George Mason University and an expert on monetary policy. "As it
    stands, it''s useful for occasional peer-to-peer remittances without the need
    for third-party verification."


    New payment processors such as Lightning promise to integrate bitcoin, which could
    facilitate the use of bitcoin for smaller purchases. That said, bitcoin isn''t
    a popular medium of exchange at moment," says White, which suggests the number
    of spenders below might help its volatility. "The volatility of bitcoin had been
    declining before year, but now it''s as high as it''s ever been. "The more use
    it as a medium of exchange, the more you would expect to calm down — but people
    are not keen to hold as a payment method it''s a bit of chicken-and-egg problem."
    Financial institutions are also making it difficult to get bitcoin in the first
    place — Citigroup, Bank of America and JPMorgan are major U.S. credit issuers
    banning purchases of bitcoin and other cryptocurrencies from known exchanges,
    making it harder for first-timers to enter the market.


    ## Should I invest in bitcoin?


    That depends on your appetite for risk. This hyper-volatility currency rose nearly
    1,400% in 2017 (before crashing to its relative low most $8,400 per bitcoin) —
    "Nobody should put the large savings into bitcoin, but it does diversify your
    portfolio," White notes. There''s also the fact that around 1,000 people are thought
    to hold 40% of bitcoins in circulation, which would make it possible for these
    big players to manipulate the value of bitcoin — just as a Tokyo bitcoin holder
    caused a slump by selling $400 million worth of bitcoin.


    Unlike real-world — government-supported — currency, there''s no guarantee that
    bitcoin will have any value in the coming years (or that it won''t). Many banks
    have denounced the "bitcoin bubble," suggesting its market will collapse and the
    value of bitcoin will fall to zero — though White doesn''t predict that will happen.


    ## Should I mine bitcoin?


    No. The scale of the computing equipment needed in the mining process to create
    new bitcoins is infeasible for the average person, and the vast amounts of electricity
    consumed are unlikely to make it worth your while. When the first bitcoins were
    mined in 2009, a personal computer could have turned out a couple of hundred bitcoins
    in a few days. That''s no longer possible, due to the escalating difficulty of
    the mining process, which requires increasingly more computing power as the total
    number of bitcoins created approaches its supply cap of 21 million.

    '
  trans: '

    2017 年初比特币价值的剧烈波动导致价格在同一天内从 1129 美元跌至 800 美元以下，这很可能是归于中国成功的投机行为。比特币及其运营产物区块链技术在世界市场中拥有未来。然而，各国政府可能会抵制一种超出其控制范围的全球性资产，这种资产可能会便利违背其法律、规则或政治议程的活动。


    # 比特币常见问题解答


    比特币是一种数字货币——现金的虚拟形式——允许用户在线上进行匿名支付。比特币交易由庞大的计算机网络进行验证，而不是银行或政府，这使其成为一种去中心化的货币，许多人将其誉为应对腐败银行的隐私友好答案，以及抵御通胀货币的替代方案。


    计算机通过一种被称为“挖掘”的过程跟踪并加密比特币交易，将数据保存在名为“区块链”的记录中。新的比特币是在挖掘过程中创建的。比特币区块链是任何双方之间每个比特币交易的公共账本。由于它由成千上万台计算机不断验证，该账本被认为几乎不可篡改，因为黑客攻击需要超过所有在比特币区块链上运行的计算机的总处理能力。


    ## 我可以用比特币做什么？


    比特币的设计初衷是在两个陌生人之间转账，而无需中间机构来验证交易的有效性。这意味着你可以直接在线上向另一个人付款，而无需提供 PayPal 账户或信用卡信息等身份识别详情。


    由于比特币能够促进在线匿名购买，近一半的比特币交易都与非法交易有关（想想互联网更阴暗的暗网上发现的那种黑市活动）。从微软到携程网（Expedia），主流零售商正在为比特币开通账户。理论上讲，比特币可以成为一种可行的在线购物支付方式，而不会留下信用卡留下的那种痕迹——而且不会增加广告商对你喜好、购买和搜索内容的深度画像。它那如云电般的涨跌甚至让比特币进入了两个主要的股票交易所，因为美国监管机构批准了比特币期货和掉期等衍生品交易（但不支持直接拥有比特币本身）。


    ## 比特币有多安全？


    人们对比特币持有的安全性确实存在担忧。黑客曾攻击过 Bitfinex 和 Mt. Gox 等大型比特币交易所，走了价值数百万的货币，导致用户一无所有。


    随着越来越多的人接触比特币——其他加密货币——用户的钱包遭到了攻击。例如，获取详细信息的钓鱼攻击，以及一种试图获取用户账户控制权的特别恶性的骗局。然而，使用至少需要离线登录的钱包是有效的，这使其很难被破解。高级安全顾问
    Chester Wisinski 表示：“在信任一个存储比特币的钱包之前，我会确保它提供良好的加密和双重身份验证。访问很方便，但遗憾的是，目前对于交易所被攻击时的损失几乎没有保护。一些提供商因丢失用户资金而面临诉讼；在世界最大的交易所
    BitThumb 发生 90 分钟停机后，交易者损失了数百万美元，用户发起了集体诉讼。”


    ## 比特币有未来吗？


    包括美国在内的全球中央银行已经提出过政府支持的数字货币的想法——但对于联邦联储来说，比特币和其他加密货币还处于早期阶段，联储指出还有许多待解决的技术和隐私问题。


    “比特币在标准意义上尚未成为一种被广泛接受的交易媒介——你用比特币能买的东西非常有限，”White 说，“人们承认这项技术非常非凡并具有潜力，但要说进一步的进步是否能让比特币成为一种更易用的日常货币，还为时过早。”


    ## 使用比特币的猫端是什么？


    使用比特币交易的人数不断增加减慢了比特币网络，因为它在处理负载下十分挣扎。在某些时刻，这导致交易时间从几分钟增加到一天多，并推高了交易费用，使得获取那桶“比特币”变得相当昂贵。


    “比特币的设计并不是作为日常货币，”乔治·梅森大学经济学教授、货币政策专家 Lawrence H. White 说，“就目前而言，它适用于偶尔的对点汇款，而无需第三方验证。”


    闪电网络（Lightning）等新的支付处理器承诺整合比特币，这可能有助于使用比特币进行小额购买。尽管如此，”White 指出，“比特币目前并不是一种受欢迎的交易媒介，”这表明下文的者的数量可能会帮助其波动性。“比特币的波动性在去年之前一直在下降，但现在达到了前所未有的高度。作为交易媒介使用得越多，你越会预期它会稳定——但人们并不热于将其作为支付方式，这有点像鸡生蛋的问题。”金融机构也让获取比特币变得变得困难——花旗银行、美国银行和摩根大通是美国主要的信贷发行机构，禁止从已知交易所购买比特币和其他加密货币，这让初学者进入市场变得更加困难。


    ## 我应该投资比特币吗？


    这取决于你的风险承受能力。这种极高波动的货币在 2017 年上涨了近 1,400%（在崩盘至相对低点每枚比特币 8,400 美元之前）——White 指出：“没有人应该把大量储蓄投入比特币，但它确实可以让你的投资组合多元化。”另一个事实是，据认为约
    1,000 人持有流通比特币的 40%，这使得这些大玩家有可能操纵比特币价值——就像一个东京比特币持有者通过卖出价值 4 亿美元的比特币导致了价格下跌。


    与现实中政府支持的货币不同，无法保证比特币在未来几年内具有任何价值（或者它可能没有）。许多银行谴责“比特币泡沫”，认为其市场将会崩溃，比特币价值将跌至零——尽管
    White 并不预测这种情况会发生。


    ## 我应该挖掘比特币吗？


    不。在挖掘过程中创建新比特币所需的计算设备规模对于普通人来说是不可行的，而且消耗的大量电力可能不值你付出。2009 年挖掘第一批比特币时，个人电脑可以在几天内产出几百枚比特币。由于挖掘难度的不断增加（随着创建的比特币总量接近
    2,100 万枚的供应上限），这已经不再可能。

