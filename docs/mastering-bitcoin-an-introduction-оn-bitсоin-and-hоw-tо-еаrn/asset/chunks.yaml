    ## INTRODUCTION

    Arguably of the most disruptive, exciting and controversial new developments in
    global economics, the arrival of Bitcoin as a legitimate, popular currency has
    begun sparking debate as the future. That being said, many people haven''t been
    acquainted with this new, online-only financial resource, due part to its exclusion
    from the "real" world.


    The origins of bitcoin can be traced back to 2008, when ''Satoshi Nakamoto'',
    a pseudonym adopted by the creator of the currency, introduced his ''peer-to-peer''
    currency to the world. Bitcoin is defined as a ''cryptocurrency,'' or form of
    money that is generated and transferred using an array of cryptographic tools
    as opposed to central authorities. The bitcoin is designed to remain ''independent''
    from national interests and interactions, developing out of its sovereignty and
    resistance to inflation.


    Bitcoins are a virtual commodity that have many similar properties to traditional
    cash. Utilizing strong cryptography and a peer-to-peer network, they serve as
    the first currency without a central issuer. Bitcoins are not physical entities,
    but work in virtually the same way. Originally, bitcoins were exchanged through
    the bitcoin forums, becoming the property of audiences within the cyberpunk community,
    a group of enthusiasts who believe that cryptographic protocols can become a catalyst
