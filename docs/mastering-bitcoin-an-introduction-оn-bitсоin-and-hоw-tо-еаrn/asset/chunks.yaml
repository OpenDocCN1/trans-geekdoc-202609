  trans: '

    监管可能会变得更加复杂。


    加密货币是 2018 年阿根廷 G20 峰会讨论的一个主要话题，据报道，主要经济体的代表当时努力达成共识，认为比特币以及其他数字代币实际上是资产。


    荷兰央行（荷兰银行）行克劳斯·诺特（Klaus Knot）表示：“无论你称其为加密资产、加密代币——绝对不是加密货币——就我而言，请务明确这一点。我不认为这些加密货币有任何一个满足货币在经济中所扮演的三个角色。”


    考虑到这些因素，潜在的比特币交易者在参与数字货币之前进行尽职调查变得尤为重要。


    投资者在研究比特币时，有许多地方可以着手。他们可能会从掌握行业术语中获益，学习诸如 `HODL`（死死持有）、`FUD`（恐惧、不确定和怀疑）以及 `ill`（为了获利而推销自己持有币的人）等术语。


    除了判断比特币是否适合自己之外，投资者还应该评估数字货币如何符合他们的财务目标以及现有的投资组合。比特币交易者可能还想通过了解知名人物及其独特见解，熟悉更广泛的加密货币生态系统。


    ## 学习比特币的价格驱动因素


    为了有效地交易比特币，投资者应该熟悉有助于决定数字货币价格的主要变量。


    在最基础的层，比特币的价格是供给和需求的函数。根据目前的规则，这种数字货币的总供应量上限为 2100 万个，这意味着在任何时候只能存在 2100 万单位的比特币。


    在写作时，这些数字代币中已有 1690 万个被挖出。这些单位是通过挖矿过程创建的，该过程涉及将交易处理比特币区块链中的“区块”。每当挖掘出一个区块，就会提供一份“挖矿奖励”。这种奖励随着时间的推移逐渐减少。虽然挖掘第一个区块释放了
    50 个比特币（`BTC`），但挖矿奖励大约每四年减半一次。在本文写作时，挖矿奖励为 12.5 BTC。


    虽然这些数字可能提供了帮助，但值得注意的是，许多比特币所需的信息已经丢失了。区块链基础设施公司 Block 的执行官尼古拉斯·格雷戈高里（Nicholas
    Gregory）在 2017 年表示：“可能还有其他比特币会被使用。有很多已经丢失了。”虽然信息涵盖了供给端，但需求端也必须提供完整信息。市场分析师认为，比特币的价格很大程度上取决于情绪，这可以被称为“动物精神”，这是由经济学家约翰·凯恩斯创造的术语，指投资者在做出决策时采取的心理方法。有证据支持这种观点，即炒作是比特币波动的主要驱动因素。在主流媒体报道期间，数字货币的价格经历过飙升。这种发展可能导致比特币遵循所谓的“炒作周期”。基本上，媒体报道会导致炒作在达到顶峰之前下降到较低的水平。比特币已经经历过几个周期，经历了剧烈升值，随后是明显的损失。虽然很难将其价格波动归因于单一变量，但数字货币在吸引主流关注时经历了巨大的波动。分析师经常引出的驱动比特币价格波动的另一个主要因素是宏观经济和/或动荡。据报道，分析师将比特币描述为避险资产。曾在投资管理公司
    ARK Invest 工作的知名分析师克里斯·伯恩基（Chris Burnske）告诉 CNBC，比特币可以被称为“数字黄金”，并表示这种加密货币与贵金属具有许多相同的品质。


    “当你观察全球市场时，充满了恐惧、不确定和怀疑，”伯恩基说。在市场动荡时期，投资者经常涌向黄金等避险资产。


    另一个主要变量是监管发展。正如前面所述，围绕数字货币的监管框架非常不成熟，这意味着它随着时间的推移可能会发生很大变化。数字货币交易所有时发现，为了吸引机构投资者，他们必须主动开发稳健的合规性，以符合法规。


    ## 选择交易所


    找到合适的交易所对于新交易者来说是至关的一步。许多数字货币交易所曾被破解，包括 `Bitfinex`，它有时被描述为最大的交易所。`Bitfinex` 在
    2016 年夏天遭受了黑客攻击，期间损失了约 7000 万美元的比特币。该交易所生存了下来，通过新创建的数字代币将损失分摊给所有持有者，这些代币又被回购。虽然
    Bitfinex 成功度过了黑客攻击，但 `Mt. Gox` 也遭到了第三方入侵，导致了 4.6 亿美元的损失。`Mt. Gox` 破产了，一位名叫小林（Kobayashi）的受托人于
    2018 年代表债权人开始出售数字货币。投资者在使用交易所之前进行尽职调查可以从中获益。在写作时，有一份未被破解的数字货币交易所名单。例如，Coinbase
    从未被破解过。然而，其客户在遭遇诈骗后曾被黑客攻击。


    ## 基础安全技术


    除了选择正确的交易所外，投资者还可以通过学习更多安全知识来减少被攻击的机会。最基础的技术之一是双重身份验证，它要求用户采取多个步骤来确认其身份。然而，并不是所有的双重验证形式都是相同的。例如，使用
    Google 身份验证器而不是短信可以产生巨大差异。根据 Coinbase 总裁丹·罗马诺（Dan Romano）的话，如果投资者想使用 Google 身份验证器进行双重验证，他们应该关闭短信认证。Coinbase
    产品管理副总裁肖恩·埃弗特（Sean Everett）表示，投资者防止资金被盗另一种方法是联系他们的移动服务提供商，并尽一切保护账户。交易者可以要求他们的移动运营商不报告任何号码，这增加了一层保护。

