    # 4 深度神经网络学习对人工智能研究的影响


    Amit Adate Vellore Institute of Technology, Vellore, India, School of Computer
    Science and Engineering. Dhruv Arya Vellore Institute of Technology, Vellore,
    India, School of Computer Science and Engineering. Aditya Shaha Vellore Institute
    of Technology, Vellore, India, School of Computer Science and Engineering. B.
    K. Tripathy Vellore Institute of Technology, Vellore, India, School of Information
    Technology and Engineering.


    ## 摘要


    深度学习技术对人工智能研究产生了巨大影响。它们改进了传统的机器学习技术，后者在特征工程方面需要人类专业知识。通过去除一个人为因素，它们在人工智能领域向前迈出了一步。不过，它们并没有完全去除人类。人类仍然需要用于设计架构和清理数据。深度学习技术在语音识别、机器翻译、图像识别和目标检测等领域取得了突破性成果。本章简要介绍了当前使用的各种深度学习技术。描述了使深度学习更有效的技术。还介绍了一些有趣的应用。


    关键词：深度学习，人工智能，人工神经网络，深度学习应用


    ## 4.1 引言


    模拟人脑功能是人工智能研究的核心挑战。人脑能够创建其所观察世界的复杂模型，并从中进行外推。此外，其功能非常稳健。大脑只需几次经验就能了解新实体。人类看一次香蕉，就能识别出不同形状和大小的香蕉。人工智能研究人员几十年来一直在尝试解决此类问题。计算和存储能力的提高使研究人员能够提出处理超高维输入的方法。高质量数据集的可用性也帮助了深度学习研究。本章简要介绍了深度学习方法。这些方法在讨论时考虑了深度学习对人工智能研究和应用的影响。首先，简要描述了一些深度学习模型，然后讨论了导致深度学习成功的一些技术。接下来，介绍了有助于深度学习模型开发的一些框架，随后介绍了一些有趣的应用。最后，介绍了深度学习的一些研究领域，这些领域可能成为未来几年的重点。


    ## 4.2 卷积神经模型


    卷积神经网络（CNN）是一类深度神经网络（DNN），其构建目的是实现最小预处理。尽管它们在图像处理领域表现出色，但也可用于分析任何时间序列数据。CNN 的成功可归因于其所需的预处理相对较少，这减少了人力以及手工设计特征所需的领域知识。CNN
    中神经元之间的连接模式受动物视觉皮层的启发，其中神经元仅对视觉场固定区域（称为感受野）内的刺激作出反应。在卷积运算中，第一个参数是输入（公式中的函数 `x`），第二个参数是核（公式中的
    `w`）。输出称为特征图。我们不再为输入空间手工制作特征，而是学习作为特征提取器的卷积运算权重：


    (4.1) $P_{new}s(t) = \sum_{a = 0}^{n}x(a)w(t - a)$


    可以等价地写成


    (4.2) $s(t) = (x * w)(t)$


    其中 `*` 是卷积算子。


    CNN 与传统神经网络的不同之处在于，它们具有稀疏连接、权重共享和平移等变性的特性 \[1\]。最近，CNN 已成功应用于目标检测、图像分类、分割、文本分类、语音识别等许多领域。


    ## 4.3 循环神经网络


    大多数机器学习模型并非为处理序列数据而设计。这并不意味着它们完全无法处理序列数据。支持向量机、全连接前馈神经网络等可以训练来处理固定大小的序列数据。然而，问题就在这里，这使得我们难以处理具有长期依赖关系的数据。大多数文本都存在此类依赖关系。为对长度为
    100 的文本进行分类而训练的神经网络无法处理长度为 200 的文本。此外，大多数现有模型在设计时假设数据点之间相互独立。显然，对于所有单元之间都存在依赖关系的有效数据来说，这不是一个有效的假设。


    循环神经网络（RNN）在一定程度上克服了这些问题。正如其名称所暗示的那样，这些网络中的计算单元具有循环连接。这些网络一次处理一个单元的序列数据。它们为每个步骤维护一组激活，并能够在这些步骤之间有选择地传递信息。它们在设计时就考虑了序列数据。


    '
