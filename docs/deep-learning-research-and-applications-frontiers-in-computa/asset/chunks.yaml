    2. 随着太空望远镜的发射，数据采集速率急剧上升，对于人类来说，手动分类如此大量的数据已不可能，因为这将需要数千年才能完成。解决这个问题的方法正是本章所关注的内容。


    为了解决第二个问题，我们需要工具，或者更确切地说，我们需要程序，这些程序可以在发生异常时预测异常，或者通过做出决策或在数据中寻找模式来对数据进行分类和聚类，例如，对星系的形状进行分类。在半个世纪内，我们将迎来从差分机发明到今天的
    200 年计算史，在此期间，计算能力已经增长到如此程度，以至于我们拥有可以自主做出决策的计算机。正如柏拉图所说，需求是发明之母，机器学习（ML）领域也是如此，因为我们需要能够自主学习以预测/分类/寻找模式的程序，或者更确切地说，我们需要能够执行所谓的人类机器在大量数据上所执行任务的程序，例如，星系分类。因此，我们可以正式地说，ML
    是一种在任务（t）上随着经验（e）的增加而改进其性能度量（p）的程序 [1]。ML 是一组基于统计学和微积分原理的不同技术，允许我们创建程序，这些程序无需显式编码即可执行需要人类水平决策和智能的任务。不同
    ML 算法的示例包括回归、逻辑回归、人工神经网络（ANNs）、支持向量机、聚类等等。使用这些技术，我们要么试图预测某个实体的值（例如，房价预测），要么试图对某个实体进行分类（例如，肿瘤类别预测），基于我们称为数据特征的某些因素。例如，假设我们想要预测房子的价格/类别。这个价格/类别将取决于许多因素（特征），例如房子大小（x[1]）、地段（x[2]）、卧室数量（x[3]）和楼层数量（x[4]）。所有这些特征都成为我们的输入数据，并对房价或类别产生不同的贡献；因此，它们的贡献可以分别表示为
    w[1]、w[2]、w[3] 和 w[4]。房子的实际价格/类别可以表示为 y，预测的价格/类别可以表示为 y''。


    我们可以根据算法的学习方式对这些算法进行分组。


    1. 监督式 ML 算法：在这里，数据由 x[1]、x[2]、…、x[n] 和 y 组成。算法的目标是通过学习 w[1]、w[2]、, w[n] 来正确预测
    y''，这些权重映射了 x 和 y 之间的关系。算法在标记的 y 提供的监督下学习，通过优化基于误差（y-y''）的权重来实现。这个误差用于根据不同的学习策略（例如，反向传播）和权重更新规则（例如，梯度下降）来调整
    w[1]、w[n]。


    2. 无监督式 ML 算法：在这里，数据仅由 x[1]、x[2]、…、x[n] 组成。算法的目标是将数据聚类或分组到用户预设的不同数量的类别（y[1]、y[2]..）中。这些算法基于数据本身（x[1]、x[2]、…、x[n]）进行内部表示或对数据进行聚类。这里没有提供监督，因为我们没有标签
    y 的值。


    因此，可以理解，代表数据的特征非常重要，因为如果我们使用无法正确代表数据的不正确特征，那么我们的预测 y'' 将是不正确的。因此，在传统的 ML 算法中，这仅仅成为优化由该领域人类专家提取或设计的特征权重的任务，如图
    2.1 所示。


    ![Figure 2.1: Machine learning in practice.](img/b_9783110670905-002_fig_001.png)


    Figure 2.1: Machine learning in practice.


    因此，在这些方法中，人类对问题的了解多于机器。在我们看来，在传统的 ML 中，近 90% 的工作是由人类完成的，以找出定义数据的特征，其余 10% 的工作是由计算机完成的，即数值优化。计算机擅长数值优化。ML
    不应仅仅意味着给定权重的数值优化，我们希望计算机能够从原始数据中自动提取特征。当前的深度学习（DL）算法正是如此。DL 算法基于受人类认知启发的 ANNs
    概念。


    '
