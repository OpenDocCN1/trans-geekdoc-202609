    `L` 是某个层 `1 ≤ L ≤ N`


    现在回到我们使用 DL 算法替代人工分类星系图像的任务，我们需要知道图像识别的基础是什么。图像是一个二维函数 `f(x,y)`，其中 `x` 和 `y` 是空间坐标，`f`
    在任何坐标对 `(x,y)` 处的幅度称为该点图像像素的强度。因此，通俗地说，我们可以说图像是一个 `m × n` 维矩阵，可以被视为一个二维网格。当我们谈论图像时，我们将所有原始像素视为图像的特征。对于物体/图像分类任务，研究人员长期以来依赖于物体的边缘。图像的边缘图给出了物体的大致轮廓或形状，在物体分类中非常有用。在许多计算机视觉任务中，我们首先通过将滤波器传遍图像来检测图像中的边缘。图
    2.4 展示了滤波器如何传遍图像。


    ![图 2.4: 图像上 Sobel 滤波器的应用。](img/b_9783110670905-002_fig_004.png)


    图 2.4: 图像上 Sobel 滤波器的应用。


    此处使用的滤波器是 Sobel 滤波器。我们可以说，滤波器可以被视为一组权重，它将输入 `A^([L−1]^)` 映射到输出 `Z^([L]^)]`。将滤波器传遍图像的效果在
    图 2.5 中显示，其中使用 Sobel 滤波器检测了猫的边缘。


    ![图 2.5: 应用 Sobel 滤波器后的猫图像输出。](img/b_9783110670905-002_fig_005.jpg)


    图 2.5: 应用 Sobel 滤波器后的猫图像输出。


    像 Sobel 滤波器一样，有许多不同类型的滤波器可以在各种场景中使用。读者脑海中应该会出现一个问题：如何选择最优滤波器。如前所述，ML 算法学习参数 `W`，将输入
    `X` 映射到输出 `Y`。因此，我们可以将物体识别任务视为一个受监督的 ML 问题，并学习能给出正确特征（边缘）的最优滤波器，这些特征可进一步用于分类物体。CNN
    学习正确的一组滤波器，以提取用于分类物体的正确特征。在下一节中，我们给出了 CNN 的数学概述。名称表明 CNN 使用名为卷积的数学算子。这种卷积运算与数学或信号处理教科书中定义的不同。DL
    社区实际上使用互相关（逐元素乘积之和），但按惯例称为 CNN，在本章中，我们将遵循该惯例。如前所述，卷积运算可以在任何以网格格式排列的数据上执行。例如，音频数据（一维网格，随时间或文本序列测量幅度）和图像（二维网格，每个位置
    `x`、`y` 代表一个像素）。因此，使用正确的滤波器（可通过受监督的 ML 学习），我们可以学习提取正确的特征。


    让我们看看卷积运算是如何工作的。


    ## 2.2 卷积运算


    在板球比赛中，我们根据球员的平均表现来评判其优劣。这只不过是球员在所有参加的比赛中得分的平均值。现在假设我们作为板球队的教练，被指派从一群球员中选出最佳球员，我们可以使用卷积运算来帮助我们。卷积运算只是球员最近
    `n` 场比赛得分的加权和。


    因此，我们的责任是选择那些不仅表现一直很好，而且在最近过去也表现良好的球员。因此，球员在最近过去得到的得分应比在遥远过去得到的得分赋予更高的权重。因此，我们使用加权和来计算球员的表现。


    设过去比赛的权重应小于最近比赛的权重。那么比赛的权重如 表 2.2 所示：


    表 2.2: 过去七场比赛分配的权重。


    | 比赛 1 (`w[1]`) || 比赛 2 (`w[2]`) || 比赛 3 (`w[3]`) || 比赛 4 (`w[4]`) || 比赛 5 (`w[5]`)
    || 比赛 6 (`w[6]`) || 比赛 7 (`w[7]`) |


    | --- | --- | --- | --- | --- | --- | --- |


    | 0.01 || 0.01 || 0.02 || 0.02 || 0.04 || 0.4 || 0.5 |


    | --- | --- | --- | --- | --- | --- | --- |


    球员得到的得分如 表 2.3 所示。


    表 2.3: 球员过去得到的得分。


    | `X[1]` || `X[2]` || `X[3]` || `X[4]` || `X[5]` || `X[6]` || `X[7]` || `X[8]`
    || `X[9]` || `X[10]` || `X[11]` || `X[12]` |


    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |


    | 100 || 110 || 120 || 140 || 170 || 180 || 190 || 210 || 220 || 240 || 250 ||
    270 |


    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |


