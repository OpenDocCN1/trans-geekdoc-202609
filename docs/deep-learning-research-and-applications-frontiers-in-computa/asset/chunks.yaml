    * Visual Recognition

    * Watson Assistant

    * Watson Discovery

    * Watson Knowledge Studio

    * Watson Language Translator

    * Natural Language Understanding

    * Watson Personality Insights

    * Watson Speech to Text

    * Watson Text to Speech

    * Watson Tone Analyzer


