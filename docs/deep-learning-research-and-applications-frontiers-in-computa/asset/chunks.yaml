    ### 5.3.5 VAE 的实现


    经过字符分割后得到的图像被输入到 VAE 中，图像在经过编码和解码后被重建。


    所遵循的步骤如下：


    ## STEP 1


    读取图像。


    ## STEP 2


    将图像转换为所需通道和大小的合适格式。


    ## STEP 3


    将图像像素强度值存储在数组中。


    ## STEP 4


    将数组塑形以匹配 VAE 模型的输入形状。


    ## STEP 5


    将数据分割为训练集和测试集。


    ## STEP 6


    使用全连接层构建编码器模型，模型中使用全连接层来计算均值和方差。


    ## STEP 7


    构建解码器，一个带有全连接层的序贯模型。


    ## STEP 8


    使用编码器和解码器的输入和输出形状来构建自动编码器。


    ## STEP 9


    使用负对数正态损失函数编译模型。


    ## STEP 10


    中间隐藏层使用 KL 表示均值层和方差层。模型作为一个整体进行训练，并且在每个时代的每个数据批次中，均值和方差通过反向传播进行更新。


    一旦从 VAE 中获得结果，就会进行聚类。聚类有助于在同一聚类中分组相似属性。因此，生成的聚类将持有清晰的图像，这对于从中得出重要结论将有所帮助。在理想情况下，预期如果我们形成所有英文字母图像的聚类，我们将获得
    26 个不同的聚类。但是，在患有书写障碍的儿童的书写分析中，可以肯定且可预测的是，所有 26 个字母的聚类数量将少于 26。形成的聚类数量的显著减少将为得出书写中存在的明显缺陷特征铺平道路。


