    \ {t - a} \\\\right)$ \n\nwhich can be equivalently written as\n\n(4.2)*s*(*t*) = (*x*\\\
    **w*)(*t*) \n\nwhere **\\*** is the convolution operator.\n\nCNNs differ from\
    \ the conventional neural networks in a way that they have the properties of sparse\
    \ connectivity, weight sharing and translation equivariance \\[[1](#bodymatter-004.xhtml#b_9783110670905-004_ref_001)\\\
    ]. Recently CNNs have been successfully applied in many domains such as object\
    \ detection, image classification, segmentation, text classification, speech recognition,\
    \ and so on.\n\n## 4.3 Recurrent neural networks\n\nMost machine learning models\
    \ have not been designed with sequential data in mind. That is not to say that\
