    After applying the convolution operation on these scores we get the values as
    in [Table 2.4](#bodymatter-002.xhtml#b_9783110670905-002_tab_004).


    Table 2.4: Result of the convolution operation.


    | `S[1]` || `S[2]` || `S[3]` || `S[4]` || `S[5]` || `S[6]` |


    | --- | --- | --- | --- | --- | --- |


    | 181.1 || 196.7 || 211.2 || 226.9 || 241.3 || 256.9 |


    | --- | --- | --- | --- | --- | --- |


    For example, `S[6]` was obtained by


    `S[6] = X[12]w[7] + X[11]w[6] + X[10]w[5] + X[9]w[4] + X[8]w[3] + X[7]w[2] + X[6]w[1]`


    Thus, the convolution operation now gave us a smaller space which extracted important
    performance details from a larger space of run. Now, this space can be used for
    a more thorough comparison of performance of players.


    In the above convolution operation, the kernel (weights) that we used was one-dimensional
    as our input was 1-dimensional. The same concept of convolution can be extended
    for a two-dimensional Input (like Images) by using a two-dimensional kernel:


    $$

    S(i,j) = (K * I)(i,j) = \sum_{m} \sum_{n} I(i + m, j + n) K(m, n)

    $$


    In the above equation we are applying the convolution operation on the image `I`
    by applying a kernel `K` of size `(m × n)`. [Figure 2.6](#bodymatter-002.xhtml#b_9783110670905-002_fig_006)
    [[2](#bodymatter-002.xhtml#b_9783110670905-002_ref_002)] shows the convolution
    operation by a kernel of size (2 × 2) on an image of size (3 × 4). From the above
    example we can see that by applying a one-dimensional kernel on 1-dimensional
    input we get a one-dimensional output.


    ![Figure 2.6: Convolution operation on image of size (4 × 4) with kernel (2 ×
    2).](graphic/converted/b_9783110670905-002_fig_006.png)


    Figure 2.6: Convolution operation on image of size (4 × 4) with kernel (2 × 2).


    Similarly, by applying a two-dimensional kernel on two-dimensional input (generally
    grayscale images) we get a two-dimensional output. So, what will be the case when
    we have a three-dimensional input (like RGB images)? In RGB images having three
    channels (`image[width] × image[height] × 3`) we need a kernel with the same number
    of channels. It will be convolved with a filter having three channels. The reader
    should note that each individual filter channel is convolved with the corresponding
    input channel and the output of all channels is summed to a single output. Thus,
    we get a two-dimensional output. In most of the CNNs, we use `K` number of three-dimensional
    filters and we get a three-dimensional output where the third dimension would
    be `K`, the number of filters. This is illustrated in [Figure 2.7](#bodymatter-002.xhtml#b_9783110670905-002_fig_007).


    ![Figure 2.7: Convolution operation on three-dimensional images.](graphic/converted/b_9783110670905-002_fig_007.jpg)


    Figure 2.7: Convolution operation on three-dimensional images.


    ## 2.3 Relationships between input dimension, output dimension, and the filter
    dimension


    Now one question that can come in our mind is how we can predict the dimension
    of the output without actually applying the filter. The answer to this question
    is through a mathematical relation that exists between the input dimension, output
    dimension and the filter dimension. So let us start deriving this relation by
    answering a simple question. Why is the output size less than the input size?
    The answer is that there are pixels on the image where we cannot place our kernel
    because we will go out of the image boundary ([Figures 2.8](#bodymatter-002.xhtml#b_9783110670905-002_fig_008)
    and [2.9](#bodymatter-002.xhtml#b_9783110670905-002_fig_009)).


    ![Figure 2.8: Convolution operation on image with kernel size (3 × 3).](graphic/converted/b_9783110670905-002_fig_008.jpg)


    Figure 2.8: Convolution operation on image with kernel size (3 × 3).


    ![Figure 2.9: Convolution operation on image with kernel size (5 × 5).](graphic/converted/b_9783110670905-002_fig_009.jpg)


    Figure 2.9: Convolution operation on image with kernel size (5 × 5).


    To avoid this, we can pad the image before applying the convolution operation,
    but it will still increase the image dimension. So padding will increase the dimension
    of the image by (2 × 2) for (3 × 3) kernel. But what if we increase the size of
    the kernel? For example, for a (5 × 5) kernel we have to increase the size of
    the image by padding (4 × 4). So in general we can see that by using the kernel
    of size `F` for a convolution operation we need a padding of `F`–1 on either sides
    of the image. In other words, we cannot calculate the convolution of `F`–1 pixels
    on either side of the image. So, the size of the image will decrease by `F`–1
    So let the height and width of the image be `H` and `W`, respectively. The height
    and width of the output be `H[o]` and `W[o]`, respectively. So the output dimension
    of the image will be


    `H[o] = H − F + 1`

    `W[o] = W − F + 1`


    Now as we saw in the above example that in order to calculate the convolution
    of all pixels we need to pad the image and padding an image increases the dimensions
    of the image by twice the padding size(above and below) So, after padding the
    dimensions of the output will be


    `H[o] = H + 2*P − F + 1`

    `W[o] = W + 2*P − F + 1`


    If we pad the image around with a pixel of value zero then it is called zero padding.
    Many a times we can do padding by adding layers of pixels which are present at
    the boundary. As padding is used to control the size of the output there are two
    commonly used types based on the output size. If the output size is equal to the
    input size then we call it as same padding. If the input is not padded then we
    call that scheme as valid padding. In addition to these two types we can always
    define our own custom pad size.


    Reason for padding are (1) information on corner as filter passes only once and
    (2) output will become very small if there is no padding. So, to control the size
    of output we go for padding.


    Now what if we don’t want to calculate the convolution operation for all the pixels
    in our image but we want to calculate the convolution for alternate pixels or
    maybe two alternate pixels or k-alternate pixels. In order to solve this we introduce
    the concept of strides. A stride is nothing but a step that we take while applying
    the convolution operation. In the normal case we have a stride of size 1, in which
    we calculate the convolution for each pixel. To calculate the convolution of alternate
    pixel we can have a stride of 2 and so on.


    So how will the application of stride affect our output dimensions? Because we
    are now calculating the alternate pixel convolution, the output size is bound
    to reduce by half of the input size. So, when we apply a stride of `k`, the output
    size will decrease by (1/`K`)th the input size. So the formula to calculate the
    output dimensions when we use a padding of size `P` and Stride of `S` is


    ```

    Ho = (H + 2P - F) / S + 1

    Wo = (W + 2P - F) / S + 1

    ```


    ## 2.4 Properties of CNNs


    Now that we know what a convolutional operator is and how the convolutional operation
    changes the output dimension it is now time to ask a very fundamental question.
    What are CNNs? Also why do we use CNNs and how are they different from the normal
    feed forward neural networks?


    Let us answer these questions one by one. Convolutional networks are simply neural
    networks that use convolution in place of general matrix multiplication in at
    least one of their layers [[2](#bodymatter-002.xhtml#b_9783110670905-002_ref_002)].
    But why should we use the convolution operation? Why are we moving from matrix
    multiplication operation used in ANNs to the convolution operation?


    The convolution operation has the following benefits which help us improve the
    ML process:


    * Sparse interactions


    * Parameter sharing


    * Equivariant representations


    ### 2.4.1 Sparse connections

    '
