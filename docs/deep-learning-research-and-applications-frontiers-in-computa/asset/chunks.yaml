    \ and final state(*q[N]*).\n\n(6.9)$A = \\\\ \\\\begin{bmatrix} a\\_{11} & \\\\\
    ldots & a\\_{1N} \\\\\\\\ \\\\vdots & \\\\ddots & \\\\vdots \\\\\\\\ a\\_{N1}\
    \ & \\\\cdots & a\\_{NN} \\\\\\\\ \\\\end{bmatrix}$ \n\nIn the above equation\
