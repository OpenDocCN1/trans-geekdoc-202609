- raw: 'Handwritten digit recognition has been applied for extraction of text contained
    in scanned documents or images. One classification algorithm is required for character
    recognition by their patterns. DNN has proved its excellent performance in the
    domain of machine learning \[[22](#bodymatter-003.xhtml#b_9783110670905-003_ref_022),
    [23](#bodymatter-003.xhtml#b_9783110670905-003_ref_023)\]. DNN consists of a huge
    number of hidden layers and connections. So, the number of trainable parameters
    in DNN is enormous. A massive number of samples are required for training the
    system to prevent overfitting. Whereas, CNN consists of a few hidden layers and
    lesser number of parameters compared to DNN. So, CNN takes lesser number of samples
    for training the system. CNN can change number of hidden layers and number of
    trainable parameters in every layer during formation of the architecture. Accordingly,
    the CNN architecture is planned for handwritten digits recognition. Here, the
    MNIST real world database is used to check the performance of the system.


    ### 3.5.1 Database used


    In this chapter, MNIST handwritten digits database is used to train and test the
    system. The MNIST handwritten digit images have been normalized in size and are
    preprocessed. So, a user is not required for preprocessing the image. The MNIST
    training set and test set examples contained from approximately 250 writers. The
    MNIST database consists of 60,000 images of handwritten digit used for training
    and 10,000 images of handwritten digit used for testing \[[24](#bodymatter-003.xhtml#b_9783110670905-003_ref_024)\].
    Each handwritten digit image consists of 28 by 28 pixels and each pixel has a
    value between 0 (background) and 255 (foreground) as shown in [Figure 3.5.](#bodymatter-003.xhtml#b_9783110670905-003_fig_005)
    The database consists of training set image file, training set label file, test
    set image file, and test set label file. Pixel values are arranged row wise in
    every image file. In the image file, all the pixel values of an image are arranged
    in a row. So, each image file consists of 784 columns for 28 by 28 pixels. In
    the label files, the label values consist of 10 columns. For a particular instance
    of any digit, the label value is set by 1 for an appropriate column and set by
    0 for the other columns.


    ![Figure 3.5: Examples of MNIST dataset.](graphic/converted/b_9783110670905-003_fig_005.jpg)


    Figure 3.5: Examples of MNIST dataset.


    ### 3.5.2 Design of proposed CNN architecture


    In this work, two CNN architectures are implemented for MNIST digit recognition.
    Each architecture consists of two hidden layers or convolution layers. The ReLU
    activation function is applied after every convolution operation for nonlinearity
    of the system. The first CNN architecture is named as “CNN Method 1” and it is
    implemented with the following details. The CNN Method 1 is implemented with two
    hidden layers or convolution layers for digit recognition of MNIST dataset. Input
    image size is 28 × 28, means total 784 numbers of pixels. So, the input layer
    has 784 numbers of inputs. Initially, a convolution operation is performed with
    32 filters of size 5 × 5 without padding and the stride is equal to 1. The convolution
    operation gives the output of 32 layers with size 24 × 24. Then, a subsampling
    operation is done using a 2 × 2 max filter. This subsampling reduces 75% volume
    of the data and the generated output consists of 32 layers of size 12 × 12. After
    that, another convolution operation is performed with 64 filters of size 7 × 7
    with zero-padding and the stride is equal to 1. The convolution operations produce
    the output of 64 layers with size 12 × 12. After that, another subsampling operation
    is done using a 2 × 2 max filter. This subsampling again reduces 75% volume of
    the data and the generated output consists of 64 layers of size 6 × 6. Then, an FCN
    layer is attached with 2,304 input nodes (64 × 6 × 6 nodes) and 1024 output nodes.
    Then, another FCN layer with 10 output nodes is attached for 10 digits.


    The second CNN architecture is named as “CNN Method 2” and it consists of the
    following details. The CNN Method 2 is implemented with two hidden layers or convolution
    layers for digit recognition of MNIST dataset as shown in [Figure 3.6.](#bodymatter-003.xhtml#b_9783110670905-003_fig_006)


    ![Figure 3.6: Architecture of proposed CNN Method 2.](graphic/converted/b_9783110670905-003_fig_006.png)


    Figure 3.6: Architecture of proposed CNN Method 2.


    Input image size is 28 × 28, means a total 784 numbers of pixels. So, the input
    layer has 784 numbers of inputs. Initially, a convolution operation is performed
    with 64 filters of size 5 × 5 without padding and the stride is equal to 1. The
    convolution operation gives the output of 64 layers with size 24 × 24. Then, a
    subsampling operation is done using a 2 × 2 max filter. This subsampling reduces
    75% volume of the data and the generated output consists of 64 layers of size
    12 × 12. After that, another convolution operation is performed with 128 filters
    of size 7 × 7 with zero-padding and the stride is equal to 1. The convolution
    operations produce the output of 128 layers with size 12 × 12. After that, another
    subsampling operation is done using a 2 × 2 max filter. This subsampling again
    reduces 75% volume of the data and the generated output consists of 128 layers
    of size 6 × 6. Then, an FCN layer is attached with 4608 input nodes (128 × 6 × 6
    nodes) and 1024 output nodes. Then, another FCN layer with 10 output nodes is
    attached for 10 digits.


    ## 3.6 Experimental result


    Initially, an MLP is implemented for digit recognition. The MLP has 784 nodes
    in input layer as each image of MNIST has 784 pixels (28 × 28 pixels). The Xeon
    processor of 2.2 gigahertz with 128 GB RAM is used to train and test the system.
    MLP takes huge amount of time as compared to CNN and RNN as shown in [Table 3.1](#bodymatter-003.xhtml#b_9783110670905-003_tab_001).


    Table 3.1:Accuracy of RNN and CNN.


    | Steps  || CNN implemented by Younis and Alkhateeb \[[23](#bodymatter-003.xhtml#b_9783110670905-003_ref_023)\]
    || RNN |


    | --- | --- | --- |


    | Accuracy || Training time (in seconds) || Accuracy || Training time (in seconds)
    |


    | 10,000 || 94.97% || 1354 || 86.67% || 148 |


    | --- | --- | --- | --- | --- |


    | 20,000 || 97.03% || 2698 || 93.55% || 295 |


    | 30,000 || 97.60% || 4050 || 95.99% || 443 |


    | 40,000 || 97.99% || 5391 || 96.55% || 589 |


    | 50,000 || 98.25% || 6738 || 97.01% || 736 |


    | 60,000 || 98.41% || 8083 || 97.21% || 883 |


    | 70,000 || 98.53% || 9436 || 97.30% || 1029 |


    | 80,000 || 98.59% || 10782 || 97.55% || 1178 |


    | 90,000 || 98.67% || 12132 || 97.79% || 1322 |


    | 100,000 || 98.80% || 13,502 || 97.76% || 1,476 |


    | 110,000 || 98.85% || 14,821 || 97.96% || 1,620 |


    The experimental result of the MLP takes 5371 seconds to achieve 92.44% accuracy
    for MNIST digit classification. To achieve the same accuracy, 295 s is sufficient
    for training the RNN and 1354 s is sufficient for training the CNN implemented
    by Younis and Alkhateeb. The comparative study for accuracy with respect to time
    shows that, RNN train the system faster compared to CNN as shown in [Figure 3.7.](#bodymatter-003.xhtml#b_9783110670905-003_fig_007)
    But, CNN has the capability to train more and more if the training time is very
    high.


    ![Figure 3.7: Accuracy vs. training time for CNN and RNN.](graphic/converted/b_9783110670905-003_fig_007.png)


    Figure 3.7: Accuracy vs. training time for CNN and RNN.'
