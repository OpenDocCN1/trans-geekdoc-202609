    # RNNs 和生成模型


    设长度为 `T` 的输入序列用 `X` = {`x1`, `x2`, … , `xt`, … , `xT`} 表示。一般 RNN 由以下方程表示：


    (4.3) `s[t] = F(s[t − 1], x[t], θ)`


    这里 `s[t]` 是 RNN 在时间 `t` 时的内部状态，`θ` 是 RNN 的权重集合。更具体的表示如下：


    (4.4) `s[t] = W[rec]σ(s[t − 1]) + W[in]x[t] + b`


    其中 `σ` 是对输入逐元素操作的非线性函数。一般情况下的参数 `θ` 由权重矩阵 `W[rec]`、`W[in]` 和偏置 `b` 组成。通常，`s[0]`
    初始化为零。从方程中可以清楚地看出，当前状态既依赖于当前输入 `x[t]`，也依赖于前一时间步的状态 `s[t][−1]`。这两者对当前状态的影响程度，分别直接取决于权重
    `W[in]` 和 `W[rec]`。


    虽然 RNN 表现良好，但 `[2]` 表明它们不能很好地捕捉长期依赖关系。此外，RNN 很难训练。它们也使用反向传播进行训练。在这种情况下，我们对序列进行梯度反向传播，因此称之为“通过时间反向传播”。梯度是通过将网络展开为多层网络来计算的。它们会受到梯度爆炸和梯度消失问题的影响，即梯度在展开网络的初始层中变得过大或过小。梯度爆炸问题可以通过裁剪超过某个阈值的梯度来解决
    `[3]`。然而，梯度消失问题更难处理。这主要是因为短期依赖的梯度较高，而只有长期依赖的梯度较低。这就是经典 RNN 无法建模长期依赖关系的原因。一种称为长短期依赖网络的
    RNN 变体在 `[4]` 中被引入。这种变体通过显式添加操作来允许隐藏状态的修改、保留和删除。这使其特别适合处理长期依赖关系，从而解决了梯度消失问题。


    传统上，n-gram 模型一直用于文本处理。隐马尔可夫模型（HMM）也用于此目的。然而，HMM 的工作基于一个基本假设：文本序列可以建模为马尔可夫模型，即我们可以到达的下一个状态仅依赖于前一个状态。在大多数应用中，一个
    `n`-gram 被视为一个状态。然而，该模型无法捕捉文本中的长期依赖关系。此外，随着隐藏状态数量的增加，HMM 在计算上变得难以求解。RNN 比 HMM
    及其变体（如 LSTM）更通用，而 LSTM 可以捕捉长期依赖关系。这使得它们成为文本分类等任务的首选模型。


    ## 4.4 生成对抗网络


    一般来说，生成模型学习任务的底层概率分布。生成只是从学习到的分布中采样数据点。假设某些数据 `D` 的底层概率分布为 `p[D]`，生成模型 `M` 的任务是以
    `p[M]` 的形式估计该分布。


    一种最近引入的生成模型是生成对抗网络（GAN）`[5]`。该模型通过使用两个竞争的神经网络（即生成器 `G` 和判别器 `D`）来工作。生成器试图将训练数据的概率分布
    `p[D]` 建模为 `p[G]`，而判别器则学习区分生成器生成的样本和训练数据中的样本。两个网络都随机初始化，并且在开始时各自任务表现都非常差。然而，随着时间的推移，两个网络都会在各自的任务上变得更好，因为当建模分布
    `p[G]` 与 `p[D]` 非常相似时，判别器开始以相等的概率随机预测真实或假样本。这类似于一名业余画家学习模仿梵高，而另一个人同时学习识别假梵高画作。当业余画家的水平与梵高一样好时，另一个人将无法区分这些画作。


    正式地说，生成器是一个可微函数 `G`，判别器是一个可微函数 `D`。设 `z` 是从概率分布 `p[z]` 中采样的一些噪声，`p[D]` 是训练数据的概率分布。生成器和判别器的极小极大博弈可由以下方程表示：


    (4.5) `min_G max_D V(D,G) = E_{x ~ PD}(x)[log D(x)] + E_{x ~ p_(x)}[log(1 - D(G(z)))]`


    Radford 等人 `[6]` 展示了如何将 CNN 用作生成器和判别器函数。他们移除了所有池化层，并在生成器中使用转置卷积进行上采样。这在与图像相关的生成任务中取得了令人印象深刻的结果。在过去几年中，CNN
    在 GAN 研究中的应用变得非常普遍。


    GAN 会遭受模式崩溃问题。我们之前使用的损失函数不能确保 GAN 能够生成多种样本。它可能学会生成少数几个满足其损失函数（即能够击败判别器）的样本。这是非常不希望的。GAN
    在其他方面也很难训练。有时它们无法收敛，模型参数会持续振荡。如果判别器在其工作上变得太好，生成器的梯度会减小，从而停止学习。平衡每次训练生成器时训练判别器的次数至关重要。Wasserstein
    GAN 在 `[7]` 中被引入，通过使用不同的损失函数克服了一些这些问题。条件 GAN 在 `[8]` 中被引入，在判别器中使用数据类别信息。这使它们能够更好地捕捉多模态数据表示。Zhu
    等人在 `[9]` 中引入了 Cycle GAN，它允许在不存在这些领域配对数据集的情况下，将一个图像领域映射到另一个领域。例如，即使我们没有该特定车型的蓝色图像，这也允许我们将红色汽车的图像转换为蓝色汽车的图像。关于
    GAN 的详细概述可以在 `[10]` 中找到。


    ## 4.5 变分自编码器


    变分自编码器（VAE）`[11]` 是另一种生成模型。自编码器是具有编码器–解码器结构的网络。编码器接收一个数据点并将其映射到一个较小的向量，该向量称为数据的潜在表示。然后，解码器接收这个较小的向量并尝试将其映射回原始数据点。编码器和解码器一起训练，通过最小化原始输入与解码器输出之间的均方误差。编码器学习压缩数据，解码器学习解压缩数据。


