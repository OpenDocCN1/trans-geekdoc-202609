    # STTs 在几乎所有应用中都被使用


    如今，STTs 在几乎所有应用中都被用作语音搜索工具、视频转录生成或字幕。它也可以被无法使用双手书写的残障人士作为口述工具使用。长期以来，使用期望-最大化算法训练的
    `HMMs` 结合高斯混合模型一直无人能敌 \[46\]。随着多年来越来越高效的机器学习（`ML`）算法和硬件的发明，深度神经网络（`DNNs`）击败了所有现有方法
    \[8\]。迄今为止，最好的 STT 是由 Google 使用参数模型 \[47\] 和串联模型 \[48\] 构建的。STT 最基本的操作是音素检测，然后由连接的音素序列形成特定单词。任何
    SR 的开始都从特征提取开始，可以是 `MFCCs` 或 `LPCs`，之后应用各种分类算法。关于构建 STT 所使用的 `HMMs` 和 `LSTM-RNNs`
    等模型的详细描述已在前面的章节中给出，`waveNets` 是性能最好的模型。语言通常具有特定的语言特征，如语法以及双字频、三字频等统计特征。这些特征是语言的特征，可以被学习，因此被称为语言模型或语言模型。为了增强
    STT，有时将声学概率与语言概率相结合，并将两者的结果相乘来确定所说的单词。尽管现有模型已经给出了足够好的结果，但人们正在努力改进连续 SR 的性能。图 6.13
    展示了语音识别模块的全面视图。


    ![Figure 6.13: Speech recognition module.](img/b_9783110670905-006_fig_013.png)


    Figure 6.13: Speech recognition module.


    ## 6.4.2 音频分类


    预测来自模糊片段（如繁忙道路、机场或公交车内部）的环境类型，根据鸟鸣声预测鸟类物种，预测给定歌曲的流派，或任何输出需要是不同标签的任务，都属于此领域。它在监控
    \[49\] 和上下文感知计算 \[50\] 等多个领域都有帮助。无论是歌曲还是任何声音，属于特定类别的每个音频信号都有共同特征，这些特征可能人耳无法感知，但可以被特征提取算法检测到。在音乐流派分类中，提取
    `MFCCs` 并输入深度前馈神经网络，针对作为类标签输入的流派（经过 one-hot 编码）进行训练。`MFCCs` 结合音色特征也能取得非常好的分类准确率
    \[7\]。在 \[51\] 中，一种称为 Daubechies 小波系数直方图的新特征提取方法被设计出来，并与线性判别分析和支持向量机等分类算法进行了测试；由此获得的分类结果比前面提到的方法更准确。在环境声音分类中，再次提取
    `MFCCs`，这次选择 `DCNNs` \[5\]，因为它们在这种分类中效果最好，其中不同的类别（如机场、公交车、繁忙街道、购物中心和火车站）再次经过 one-hot
    编码并充当输出标签。类似的方法可以用于任何其他类型的分类，例如乐器分类，其中提取特征并输入神经网络模型以进行监督训练。


    ## 6.4.3 语音和音乐生成


    AI 在音乐生成领域取得了巨大进步，模型在大型音乐数据集上训练，以便能够自主生成新音乐。`WaveNets` 在竞争中脱颖而出，在音乐或语音生成方面都能取得可观的结果。基于文本的语音生成用于有声书等应用，足够灵活，可以生成不同的声音。它还有助于沟通，当一个人不知道正确发音但知道如何拼写该语言中的任何单词时。它也有助于发音澄清或学习新语言。迄今为止，`TTS`
    主要通过播放人工发音的预录音来实现。在服务器上存储此类音频文件并在用户请求时获取它们，既需要大量存储空间，又会增加响应时间，前者是更大的问题。用基于文本的声音生成算法替代该机制是一个相当不错的解决方案。同样，音乐生成可以基于多个因素，如节奏、流派和乐器，这对那些不会演奏乐器但有音乐品味的人有帮助。一些已融入
    AI 并成功运行的音乐软件包括 Orb Composer、IBM Watson Beat、OrchExtra、Google Magenta 的 NSynthSuper、ChucK
    和 Jukedeck。


    ## 6.4.4 语言翻译


    当发生跨文化会议或前往语言不通的另一个目的地旅行时，语言翻译变得极其重要。因此，人们最常使用 Google 翻译。人工智能在语言翻译方面的应用是通过序列到序列学习
    \[52\] 实现的，其中使用了深度 `LSTM-RNNs` 并取得了与最先进技术相当的优异结果。任何要翻译的句子或单词都被视为查询序列，需要将其映射到目标语言中的目标序列。另一种解决翻译问题的方案是使用
    RNN 编码器-解码器 \[53\]。它们能够很好地掌握合理的短语和句子表示。


    ## 6.4.5 个人助手


    自从 Apple 推出其个人助手 Siri 以来，顶级组织之间一直存在着推出自己高效聊天机器人的激烈竞争。因此，Amazon 的 Alexa 和 Google
    的 Google Home 已进入战场。这些机器人不仅仅是简单的问答系统，其扩展功能允许它们链接到其他应用程序，例如电力控制，从而使它们能够与智能家居架构协作。用户可以命令它们播放音乐、开启/关闭电器、向它们提问、与它们互动、进行友好交谈、拨打电话或预约，以及许多其他事情。为了能够提供此类服务，个人助手设备必须使用应用程序编程接口链接到外部模块。一些常用的个人助手在图
    6.14 中有所展示。


    ![Figure 6.14: Personal assistants that made it big.](img/b_9783110670905-006_fig_014.jpg)


    Figure 6.14: Personal assistants that made it big.


