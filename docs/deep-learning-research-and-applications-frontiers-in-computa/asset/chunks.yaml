    \ 5.15: Snapshot representing failure to distinguish between similar characters.\n\
    \n4.  Similar alphabets contained in the same word gets interchanged often:\n\n\
    \    In the example shown in [Figure 5.16](#bodymatter-005.xhtml#b_9783110670905-005_fig_016)\
    \ the original words were “bad” and “guy.” Since, “b” and “d,” “y,” and “g” are,\
    \ though, not exactly same but look quite same, their position got interchanged\
    \ when written by a dysgraphia patient. Though such error is not the same for\
    \ all the patients it is quite common among majority.\n\n    ![Figure 5.16: Snapshot\
    \ representing interchanged letters.](graphic/converted/b_9783110670905-005_fig_016.png)\n\
    \n    Figure 5.16: Snapshot representing interchanged letters.\n\n5.  Unclear\
    \ and disconnected writing with errors in spellings:\n\n    ![Figure 5.17: Snapshot\
    \ representing disconnected writing.](graphic/converted/b_9783110670905-005_fig_017.png)\n\
    \n    Figure 5.17: Snapshot representing disconnected writing.\n\nThis is one\
    \ common facet for most; often the characters of words are disconnected and written\
    \ far apart making it two different words (as in [Figure 5.17](#bodymatter-005.xhtml#b_9783110670905-005_fig_017))\
    \ with no meaning and resulting in spelling mistakes.\n\nThough handwriting can\
    \ be a tangible tool to rely upon for detecting dysgraphia, certain characters\
    \ can mislead too. Not all patients having illegible handwriting is a patient\
    \ of dysgraphia or not all dysgraphia patients have extremely illegible handwriting.\
    \ It may so happen that a normal person possesses very poor handwriting as compared\
    \ to a dysgraphia patient.\n\nIt is also observed that alphabets like “i,” “s,”\
    \ and few more were written perfectly and the clusters were same throughout as\
    \ shown in [Figure 5.18](#bodymatter-005.xhtml#b_9783110670905-005_fig_018).\n\
    \n![Figure 5.18: Snapshot of “i” and “s” present in the collected samples.](graphic/converted/b_9783110670905-005_fig_018.png)\n\
    \nFigure 5.18: Snapshot of “i” and “s” present in the collected samples.\n\nAfter\
    \ studying so many handwriting samples, it is noted that patients with severe\
    \ dysgraphia fail to write even a complete sentence and it’s almost impossible\
    \ to construe what is exactly written, as in [Figure 5.19](#bodymatter-005.xhtml#b_9783110670905-005_fig_019).\n\
    \n![Figure 5.19: Handwriting of a patient with severe dysgraphia.](graphic/converted/b_9783110670905-005_fig_019.png)\n\
    \nFigure 5.19: Handwriting of a patient with severe dysgraphia.\n\nWhile collecting\
    \ the handwriting samples, a child was found suffering from the disorder at a\
    \ very serious and severe stage. Unfortunately, the ailment was all the more complicated\
    \ as the subject was affected with another neurodegenerative disease as well.\
    \ He was reluctant to write at the very beginning; though after a while of coaxing,\
    \ he agreed to write but he failed to complete a single sentence and began to\
    \ cry with panic.\n\nThe psychologies common to majority of these patients are\
    \ that they are extremely reluctant and unwilling to write. While writing they\
    \ become extra cautious about their handwriting and try to provide a suitable\
    \ justification for their bad and unclear handwriting. Their tendency is to minutely\
    \ observe the given sample and write the same which looked exactly similar. Not\
    \ all but most of the patient observed was in a state of agitation while writing.\
    \ Few complained of pain in their hands, as well. This endorses the theory which\
    \ was read about the psychology of dysgraphia patient.\n\nAs already mentioned\
    \ at the beginning of the chapter, the type of dysgraphia and symptoms present\
    \ in a child varies uniquely and one may be suffering from more than one type.\
    \ Analysis of the types by the machine seems to be beyond reach as of now.\n\n\
    In the field of agriculture, loss of production due to crop diseases is one of\
    \ the crucial challenges. Hence, plant disease detection has established a thoughtfulness\
    \ that production quality can be improved if the diseases are detected earlier.\
    \ Different machine learning techniques are prescribed in related literature and\
    \ these are very helpful in plant disease detection. Examples of these various\
    \ machine learning methods are ANN, SVM, k-means clustering, K-NN and so on. Individually,\
    \ these machine learning method based applications are articulated for segmentation,\
    \ classification, and clustering. The experimental results in disease recognition\
    \ show that the projected method is a primarily appreciated approach that can\
    \ support disease detection in a tiny computational effort.\n\nA postponement\
    \ of this chapter will emphasize on the importance of incorporating decision support\
    \ system along with other machine learning techniques, which may provide more\
    \ accurate early detection of crop diseases. Future work also targets the area\
    \ where machine learning is developed only to understand and handle various agriculture-related\
    \ natural phenomenon. Also, the decision which is deduced by the machine should\
    \ be converted into human-readable text or in the local language so that the farmer\
    \ can understand and cooperate with the machine.\n\n## 5.5 Conclusion\n\nIn this\
    \ chapter, extraction of common features of dysgraphia patients by handwriting\
    \ analysis using VAE was proposed. This method can be used to diagnose the disease\
    \ at the early stage. This is a cost-effective and noninvasive method or diagnostic\
    \ tool. Though no particular pattern was identified as an irrefutable sign of\
    \ dysgraphia, the results from the study can be utilized to test the cognitive\
    \ skills of the patient. The study could have been more effective had the samples\
    \ been collected on an equipped electronic tablet so that pressure, time, and\
    \ other factors could be precisely recorded. The study can be modified in future\
    \ to yield better and more accurate result by adding more functionality like monitoring,\
    \ tracking the gradual progression of the disease, and also identifying the stage\
    \ in which the patient is at the time of acquiring the sample so that the improvement\
    \ or deterioration of the condition can be detected at the earliest. This can\
    \ only continue up to the stage where the patient retains normal functional ability.\
    \ Dysgraphia patients in the terminal stages suffer from impaired functional ability\
    \ and its certain that they would be unable to provide sufficient data to analyze\
    \ using this model.\n\nThe study can also be applied to extract features for other\
    \ neurodegenerative diseases with slight modifications in the implementation to\
    \ determine whether handwriting analysis can be used as an early diagnostic method\
    \ or not. This study will also benefit from the availability of a large training\
    \ set and dynamic data collection. This will help in better image reconstruction.\
    \ The dynamic collection will provide more precise parameters for more accurate\
    \ clustering.\n\n## References"
