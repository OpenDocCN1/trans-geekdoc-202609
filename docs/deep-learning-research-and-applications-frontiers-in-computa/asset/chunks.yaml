    ].\n\n## 4.5 Variational autoencoders\n\nVariational autoencoders (VAEs) \\[[11](#bodymatter-004.xhtml#b_9783110670905-004_ref_011)\\\
    ] are another type of a generative model. Autoencoders are networks where we have\
    \ an encoder–decoder structure. The encoder takes a data point and maps it to\
    \ a smaller vector which is called the latent representation of the data. Then,\
    \ a decoder takes this smaller vector and maps tries to map it back to the original\
