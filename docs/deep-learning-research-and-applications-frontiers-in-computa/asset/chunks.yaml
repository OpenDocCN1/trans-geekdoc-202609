  trans: '


    Figure 2.22: 猫狗分类器第一层的滤波器。


    网络在第一层寻找如此原始的特征并不奇怪。20 世纪 60 年代，神经生理学家托斯滕·威塞尔（Torsten Wiesel）和大卫·休贝尔（David Hubel）对大脑工作原理的研究得出了一些相似的结果。他们发现，猫的大脑在视觉皮层的前几层也会寻找定向光条等原始特征。


    可视化网络其他层的权重无法让我们深入了解决策过程。这是因为第一层之后的层观察的是前一层的输出，而不是输入图像。即使我们可视化这些层，生成的图像也不会直观。


    调试网络的另一种方法是找出网络在输入图像中关注的区域。也就是说，对于任何输入图像，我们都想找出导致特定分类的图像区域。这可能有助于我们更深入地了解分类器。


    ### 2.7.2 显著性图


    显著性图 \[6\] 用于找出导致特定分类的图像部分。它们通过计算输入图像相对于目标类别的梯度来工作。请注意，这与我们的训练过程不同，在训练过程中，我们计算权重相对于损失函数的梯度。当我们计算权重相对于目标类别的梯度时，我们试图找出应该在多大程度上以及向哪个方向改变它们，以增加预测该类别的概率。被增加的权重对于该特定目标类别很重要。同样，当我们计算图像相对于目标类别的梯度时，我们会找出对于该特定目标类别很重要的像素。猫图像相对于目标类别“猫”的网络梯度已在
    Figure 2.23 中显示。原始图像中高重要性的像素在显著性图中由白点表示。请注意，猫的项圈不被网络视为分类的重要特征。这可能是因为输入数据集包含带有项圈的狗和猫的图像。因此，项圈不是一个区分特征。


    ![Figure 2.23: 输入图像及其显著性图：(a) 输入猫图像和 (b) 输出图像的显著性图。](img/b_9783110670905-002_fig_023.jpg)


    Figure 2.23: 输入图像及其显著性图：(a) 输入猫图像和 (b) 输出图像的显著性图。


    显著性图在调试错误分类时特别有用。它们可以帮助我们发现虚假相关性。如果训练数据集中所有狗的图像都包含交通信号灯，网络可能会学会将所有包含交通信号灯的图像都分类为狗。通过查看错误分类图像的显著性图，可以轻松发现这一点。显著性图将清楚地显示交通信号灯在将图像分类为狗中起着作用。


    ## 2.8 转置卷积


    我们现在知道如何将 128 × 128 × 3 的图像映射为 64 × 64 × 12 的特征图。我们可以通过在输入特征图边缘添加单位填充，然后在其上使用
    12 个大小为 3 × 3 × 3 的内核来轻松实现这一点。但是，我们的卷积操作无法将 64 × 64 × 12 的特征图映射为 128 × 128 × 3
    的特征图。也就是说，它无法执行逆操作。让我们以分辨率为 2,000 × 1,000 的电视为例。我们想要在该电视上显示分辨率为 1,000 × 500 的图像。为了进行全屏显示，我们需要将图像从
    1,000 × 500 × 3 上采样到 2,000 × 1,000 × 3。有许多算法可以执行此上采样操作。我们可以使用线性和立方等许多插值操作的变体来实现上采样。在本节中，我们将介绍一种操作，该操作将允许神经网络执行上采样。


    让我们考虑一个大小为 4 × 4 的特征图。当我们在其上使用步长为 1 的 3 × 3 内核时，我们得到一个形状为 2 × 2 的输出特征图。这在 Figure
    2.24 中显示。为了恢复 4 × 4 的输入卷，我们在对 2 × 2 特征图应用大小为 2 的零填充后，使用大小为 3 × 3 的内核。相应的转置卷积操作已在
    Figure 2.25 中描绘。令 *s* 为步长，*k* 为内核大小（假设为方形内核），*p* 为输入图像中的零填充。然后，当 *s* = 1 且 *p*
    = 0 时，为了恢复原始输入图像，我们为转置卷积设置 *s*′ = *s*、*k*′ = *k* 和 *p*′ = *p*。可以参考 \[7\] 以获取更深入的转置卷积算术讨论。转置卷积操作已用于可视化
    CNN 中后层的特征图 \[8\]。转置卷积层也被用于超分辨率 \[9\] 和语义分割 \[10\] 等应用中。


    ![Figure 2.24: 3 × 3 内核在 4 × 4 特征图上卷积。](img/b_9783110670905-002_fig_024.jpg)


    Figure 2.24: 3 × 3 内核在 4 × 4 特征图上卷积。


    ![Figure 2.25: 转置反卷积操作。](img/b_9783110670905-002_fig_025.jpg)


    Figure 2.25: 转置反卷积操作。


    ## 2.9 CNN 的应用


    在本节中，我们将回顾 CNN 在不同领域应用方面的最新进展。


    ![Figure 2.26: 分类、检测和分割之间差异的示意图。](img/b_9783110670905-002_fig_026.png)


    Figure 2.26: 分类、检测和分割之间差异的示意图。


    1. 定位：定位是找出图像中对象位置的任务，前提是我们知道要寻找什么类型的对象。这与检测不同，检测涉及查找图像中所有感兴趣的对象并为其贴标签。定位通常涉及预测对象周围的边界框。由
    Girschik 等人开发的边界框回归 \[11\] 已被用于定位并取得了一定成功。这涉及在 CNN 的最后一层预测边界框的坐标。如果事先知道对象的数量和每个对象的类型，可以通过设置多个并行全连接层来扩展此技术，以预测每个对象的边界框。


    '
