    原始音频使用 16 位表示，提供 65,536 种可能性，这使其成为计算密集型任务，因此对数据应用如 eq. (6.44) 所示的 μ-law 变换，将其缩减为
    256 种可能性，现在可以使用 8 位表示而不牺牲信号的原始性。输出中的条件概率随后使用 softmax 分布表示，其效果优于高斯尺度混合，因为前者不对数据的形状做任何先验假设。


    (6.44)$f\\left( \\psi\_{t} \\right) = sign\\left( \\psi\_{t} \\right)\\frac{{ln}\\left(
    {1 + \\ \\mu\\left| \\psi\_{t} \\right|} \\right)}{\\ln\\left( {1 + \\ \\mu} \\right)},\\
    where - 1 < \\psi\_{t} < 1\\ and\\ \\mu = 255$


