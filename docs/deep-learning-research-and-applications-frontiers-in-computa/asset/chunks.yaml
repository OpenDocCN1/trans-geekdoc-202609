- raw: '1.  Style transfer: Style transfer involves repainting an image in the style
    of another painting. While this was the domain of trained artists in the past,
    CNNs have made it more accessible. Before deep learning, algorithms had to be
    constructed for every specific style. Gatys et al. \[[28](#bodymatter-004.xhtml#b_9783110670905-004_ref_028)\]
    showed in their seminal work how the style of an image can be captured separately
    from the content of the image. In particular, they use CNNs as feature extractors
    where the gram matrix of the activations of any particular layer represents the
    style of the input image with respect to that layer. It is understood that as
    we go deeper into a CNN, more semantic features are captured. They used activations
    of the earlier layers of network to use as a reference for content. Style transfer
    in this method involves optimizing a randomly initialized image to have a similar
    activation gram matrix to the style image and similar activations in the earlier
    layers to a desired content image. Note that the network was only used as a feature
    extractor and was not optimized. One shortcoming of this approach is that it takes
    a lot of time, as for each content image, the optimization process has to be carried
    out again. Johnson et al. \[[29](#bodymatter-004.xhtml#b_9783110670905-004_ref_029)\]
    have used the methods presented by Gatys et al. to train neural networks to do
    style transfer. In this approach, one CNN is used for feature extraction and is
    not optimized while the CNN is used to convert a content image to a stylized image.
    The loss is computed by using the feature extraction network and the style transfer
    network is optimized. This approach is much faster than \[[28](#bodymatter-004.xhtml#b_9783110670905-004_ref_028)\]
    as style transfer only requires one passage through a CNN.


    2.  Super resolution: It is the task of obtaining a higher resolution (HR) image
    for a given set of low resolution input images. Single image super resolution
    is an interesting problem where we only have one input image. The interesting
    thing is that there is no correct answer as such because the information regarding
    the missing pixels is mostly not captured in the input. One input image can correspond
    to many high-resolution output images. In \[[30](#bodymatter-004.xhtml#b_9783110670905-004_ref_030)\],
    the authors have presented a model called super-resolution CNN that can be trained
    end to end for Single image super resolution. They first upscale the input image
    using bicubic interpolation and then pass it to a CNN which gives us a feature
    map in the final layer that has the same dimensions as that of the desired HR
    image. The CNN is trained to minimize the mean squared error between the output
    and the target. The authors improved their model in \[[31](#bodymatter-004.xhtml#b_9783110670905-004_ref_031)\]
    in which they processed all three channels of the input image simultaneously.
    Kim et al. \[[32](#bodymatter-004.xhtml#b_9783110670905-004_ref_032)\] proposed
    the usage of the same convolutional layer repeatedly multiple times. They show
    that although such a network is difficult to train, the performance benefits are
    significant.


    3.  Automatic speech recognition: Automatic speech recognition is used to automatically
    map audio to text. Graves et al. \[[33](#bodymatter-004.xhtml#b_9783110670905-004_ref_033)\]
    have used a deep RNN architecture to accomplish this task. They have used a connectionist
    temporal classification loss \[[34](#bodymatter-004.xhtml#b_9783110670905-004_ref_034)\]
    which is useful as it allows us to train RNNs where the input and the output sequence
    alignment are not known. This happens in speech recognition where multiple timesteps
    of an audio clip correspond to the same letter. Zhao et al. \[[35](#bodymatter-004.xhtml#b_9783110670905-004_ref_035)\]
    have presented an architecture that combines RNNs and CNNs for automatic speech
    recognition. This enables the network to capture both frequency and temporal dependence
    of the input. The network is trained on spectrograms of the speech which makes
    CNNs suitable for the job.


    4.  Image recognition, object detection, and segmentation: CNNs have been used
    as feature extractors to find similarities between faces in \[[36](#bodymatter-004.xhtml#b_9783110670905-004_ref_037)\].
    This has been used to do face recognition. The network was trained to map an image
    to a vector such that images of the same person should have vectors near each
    other while images of different people should have vectors that are far away from
    each other. When deployed, the network maps the input image to the vectorized
    representation and the distance is computed between it and the stored vectors.
    One important thing to note here is that network does not need to be trained specifically
    for faces that are to be recognized. Availability of high quality datasets such
    as COCO \[[37](#bodymatter-004.xhtml#b_9783110670905-004_ref_038)\], ImageNet
    \[[19](#bodymatter-004.xhtml#b_9783110670905-004_ref_019)\], and PASCAL VOC \[[38](#bodymatter-004.xhtml#b_9783110670905-004_ref_039)\]
    have been an impetus for object detection and segmentation research. Fully CNNs
    presented in \[[39](#bodymatter-004.xhtml#b_9783110670905-004_ref_040)\] have
    shown breakthrough results for object segmentation. Region-based convolutional
    network \[[40](#bodymatter-004.xhtml#b_9783110670905-004_ref_041)\] was seminal
    in the field of object detection. YOLO \[[41](#bodymatter-004.xhtml#b_9783110670905-004_ref_042)\]
    and Fast R-CNN \[[42](#bodymatter-004.xhtml#b_9783110670905-004_ref_043)\] are
    both faster during inference. Single shot detection (SSD) \[[43](#bodymatter-004.xhtml#b_9783110670905-004_ref_044)\]
    is another faster approach that builds upon the others and has shown impressive
    results.


    5.  Text to speech synthesis: Deep learning has made synthesis of natural sounding
    audio from text a reality. Earlier, to generate somewhat natural sounding audio,
    a big database for each type of sound had to be painstakingly maintained. Wavenet
    \[[44](#bodymatter-004.xhtml#b_9783110670905-004_ref_045)\] was a breakthrough
    work that used a fully CNN to synthesize audio from text. The network was conditioned
    on the identity of the speaker whom it was being trained on which allowed a single
    network to have multiple types of voices. In \[[45](#bodymatter-004.xhtml#b_9783110670905-004_ref_046)\],
    the authors have presented another audio synthesis approach that uses RNNs instead
    of convolutional networks. They use a layered architecture where the networks
    at different layers are sampling the input at a different temporal resolution.
    Tacotron \[[46](#bodymatter-004.xhtml#b_9783110670905-004_ref_047)\] is another
    neural audio synthesis model that uses encoder–decoder architecture.'
