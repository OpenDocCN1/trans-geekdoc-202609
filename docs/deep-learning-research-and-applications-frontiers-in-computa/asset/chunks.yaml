- raw: 'Figure 2.22: The first-layer filters of the cats and dogs classifier.


    It is not surprising that the network is looking for such primitive features in
    the first layer. Experiments by neurophysiologists Torsten Wiesel and David Hubel
    in the 1960s on the working of brain had some similar results. They found that
    the cat brain also looks for primitive features such as oriented bars of light
    in the first few layers of the visual cortex.


    Visualizing the weights of other layers of the network would not give us many
    insights into the decision-making process. This is because the layers after the
    first layer are looking at the output of the previous layer not the input image.
    Even if we visualize these layers, the images would not be intuitive.


    Another way using which we can debug the network is to find out the areas in which
    the network is looking at in the input image. That is, for any input image, we
    want to find out the regions in the image that result in a particular classification.
    This might help us in gaining more insights into our classifier.


    ### 2.7.2 Saliency maps


    Saliency maps \[[6](#bodymatter-002.xhtml#b_9783110670905-002_ref_006)\] are used
    for finding the parts of the image that lead to a particular classification. They
    work by computing the gradients of the input image with respect to the target
    class. Note that this is different from our training procedure in which we find
    the gradients of the weights with respect to the loss function. When we compute
    the gradients of weights with respect to a target class, we are trying to find
    out how much and in which direction should we change them to increase the probability
    of predicting that class. The weights that are being increased are important for
    that particular target class. Similarly, when we take the gradients of an image
    with respect to a target class, we find out the pixels that are important for
    that particular target class. The gradients of our network for the cat image with
    respect to the target class cat have been shown in [Figure 2.23](#bodymatter-002.xhtml#b_9783110670905-002_fig_023).
    The pixels of high importance in the original image are represented by white dots
    in the saliency maps. Note how the collar of the cat is not considered to be important
    for classification by the network. This might be because the input dataset contains
    images of both dogs and cats with a collar. Thus, a collar is not a distinguishing
    feature.


    ![Figure 2.23: The input image and its saliency map: (a) the input cat image and
    (b) the saliency map for the output image.](graphic/converted/b_9783110670905-002_fig_023.jpg)


    Figure 2.23: The input image and its saliency map: (a) the input cat image and
    (b) the saliency map for the output image.


    Saliency maps are particularly useful when debugging erroneous classification.
    They can help us spot false correlations. If in the training dataset all the dog
    images have a traffic light in them, the network might learn to classify all images
    with a traffic light as dogs. This can be easily spotted by looking at a saliency
    map of an image with an erroneous classification. A saliency map will clearly
    show that the traffic light plays a role in the classification of the image as
    a dog.


    ## 2.8 Transposed convolution


    We now know how to map a 128 × 128 × 3 image into a 64 × 64 × 12 feature map.
    We can easily achieve this by adding unit padding along the edges of the input
    feature map and then using 12 kernels each of size 3 × 3 by 3 over it. However,
    our convolution operation cannot map a 64 × 64 × 12 feature map to a 128 × 128 × 3
    feature map. That is, it cannot perform the inverse operation. Let’s take the
    case of a television which has the resolution 2,000 × 1,000. We want to display
    an image of resolution 1,000 × 500 on this television. To do a full-screen display,
    we will have to upscale the image from 1,000 × 500 × 3 to 2,000 × 1,000 × 3. There
    are many algorithms for performing this upscaling operation. We can use the many
    variants of interpolation operation such as linear and cubic to achieve upscaling.
    In this section, we introduce an operation that will allow neural networks to
    perform upscaling.


    Let’s consider a feature map of size 4 × 4. When we use a kernel of shape 3 × 3
    on it with a stride of one, we get an output feature map of shape 2 × 2. The same
    is shown in [Figure 2.24](#bodymatter-002.xhtml#b_9783110670905-002_fig_024).
    To recover the 4 × 4 input volume, we use a kernel of size 3 × 3 after applying
    zero padding of size 2 on the 2 × 2 feature map. The corresponding transposed
    convolution operation has been depicted in [Figure 2.25](#bodymatter-002.xhtml#b_9783110670905-002_fig_025).
    Let *s* be the stride length, *k* be the kernel size (assuming a square kernel),
    and *p* be the zero padding in the input image. Then to recover the original input
    image, when we have *s *\=* *1, and *p = *0, we set *s*^′\= *s*, *k*^′\= *k*,
    and *p*^′\= *p* for the transposed convolution. \[[7](#bodymatter-002.xhtml#b_9783110670905-002_ref_007)\]
    can be referred for a more in-depth discussion of the transposed convolution arithmetic.
    The transposed convolution operation has been used for visualizing the feature
    maps of the later layers in CNNs \[[8](#bodymatter-002.xhtml#b_9783110670905-002_ref_008)\].
    Transposed convolution layers are also being used in applications such as super
    resolution \[[9](#bodymatter-002.xhtml#b_9783110670905-002_ref_009)\] and semantic
    segmentation \[[10](#bodymatter-002.xhtml#b_9783110670905-002_ref_010)\].


    ![Figure 2.24: 3 × 3 kernel convolving on a 4 × 4 feature map.](graphic/converted/b_9783110670905-002_fig_024.jpg)


    Figure 2.24: 3 × 3 kernel convolving on a 4 × 4 feature map.


    ![Figure 2.25: The transposed deconvolution operation.](graphic/converted/b_9783110670905-002_fig_025.jpg)


    Figure 2.25: The transposed deconvolution operation.


    ## 2.9 Applications of CNN


    In this section we will go through the recent progress in application of CNNs
    in different domains.


    ![Figure 2.26: Illustration of the differences between classification, detection,
    and segmentation.](graphic/converted/b_9783110670905-002_fig_026.png)


    Figure 2.26: Illustration of the differences between classification, detection,
    and segmentation.


    1.  Localization: Localization is the task of finding the location of an object
    in an image given that we know what kind of an object we are looking for. This
    is different from detection which involves finding all objects of interest in
    an image and labelling them. Localization typically involves predicting a bounding
    box around the object. Bounding box regression, which was developed by Girschik
    et al. \[[11](#bodymatter-002.xhtml#b_9783110670905-002_ref_011)\], has been used
    with some success for localization. This involves predicting the coordinates of
    the bounding box in the last layer of the CNN. If the number of objects and the
    type of each object is known before hand, this technique can be extended by having
    multiple parallel fully connected layer to predict the bound box for each object.'
