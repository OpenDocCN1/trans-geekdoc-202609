  trans: '


    这些天，即使是银行、医院或旅游网站都有自己的聊天机器人，任何用户都可以与之交互以解决自己的疑问。在这种情况下，聊天机器人充当问答模型 \[54, 55, 56,
    57\]。在这些模型中，有多个组件协同工作——输入设备用于获取语音输入或文本输入，处理单元将输入转换为计算机可理解的形式，转换单元，以及数据库。在处理单元中，如果输入是文本形式，则有机制来理解所使用的语言，这是通过字符编码和其他元数据的信息来完成的。对于语音输入，处理是使用前面提到的语音识别器完成的。输入处理后，会部署执行域分类的算法，这些算法有助于理解查询及其所属的上下文
    \[58, 59\]。然后将自然语言问题转换为数据库将响应的查询语言，例如结构化查询语言。然后从数据库中检索信息作为查询的答案，并通过 TTS 转换 \[60\]
    以语音形式或文本输出形式输出到用户界面。这在 图 6.15 中进行了总结。


    ![Figure 6.15: Summary of a question–answer model.](img/b_9783110670905-006_fig_015.png)


    Figure 6.15: Summary of a question–answer model.


    ## 6.5 未来展望


    随着该领域大量研究的开展，我们可以期待未来出现相当神奇的应用。现有的架构虽然不错，但在认知能力和准确性方面仍有很长的路要走。与语音和翻译相关的大部分工作仍需要扩展到不同语言以及同一语言的各种口音。正在探索更多种类的深度架构，以完善与机器对话的艺术。随着新的和改进的硬件可用，存储相关问题得到解决，并行架构允许极快的处理时间。因此，ML
    架构的训练将随着时间的推移变得更加完美。随着更多信息的可用，NLP 正在达到新的高度；很快人们将在聊天机器人中找到朋友，并且将商业化个人助手，这些助手可以协助教师、医生，甚至对他们构成严峻竞争。


    ## 6.6 结论


    本章主要集中于描绘关于音频信号及其处理方法的清晰图景，并最终理解它。物理学很久以前就阐明了声音的细微之处，而只有在 AI 兴起后，才最近开始努力让计算机理解声音——无论是语音、音乐还是噪音。过去尝试了许多算法和模型，但由于硬件限制和标记数据的可用性，无法构建高效的算法来识别或理解声音。鉴于音频信号相当复杂，简单的算法不足以捕捉其特征或复杂性。今天，大量数据的可用性激发了无数领域的研究，并且公正地说，“数据是新的货币。”新的和改进的硬件以及数据使研究人员能够设计高效的算法，这些算法可以更好地处理音频信号。深度架构始终表现更好，因为它们能够研究数据之间的高阶依赖性——这一点已被该领域无数研究证明，其中一部分已在本章中提及并详细说明。正如研究所示，DNN
    在准确性方面击败了其他预先存在的模型，并能更好地建模 AI。目前，它们在图像分类方面表现最佳，并被用于多个领域，如自动驾驶汽车、医疗保健，并在脑机接口和音频分类等领域表现相当出色。音频处理是基本的人类感官之一，借助
    DNN，它正在被成功地融入机器中，为更完整的 AI 做出贡献。


