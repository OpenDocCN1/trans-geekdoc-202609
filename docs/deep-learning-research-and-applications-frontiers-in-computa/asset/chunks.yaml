    ## 6. Machine translation (sequence to sequence)


    The encoder–decoder approach for mapping a sequence of inputs to another sequence
    using recurrent networks presented in \[[47](#bodymatter-004.xhtml#b_9783110670905-004_ref_048)\]
    has been seminal in the field of machine translation. Neural machine translation
    approaches have become common. In \[[47](#bodymatter-004.xhtml#b_9783110670905-004_ref_048)\],
    two `LSTM`, a variant type of `RNN`, networks are used – an encoder and a decoder.
    The encoder takes a text sequence and iteratively maps it to a vector. Then, the
    decoder takes this vectorized representation of the input sequence and generates
    a new sequence iteratively. The proposed method performs well for English to French
    translation tasks. One important benefit of this technique is that the model can
    be trained end to end. This approach is not perfect and it fails to work for long
    sequences. In \[[48](#bodymatter-004.xhtml#b_9783110670905-004_ref_049)\], the
    authors reason that a fixed-length vector might not be able to capture all the
    information needed for translation. They propose that activations generated for
    each input unit in the input sequence be stored and referred when decoding. They
    use an attention mechanism that allows the decoder prioritize activations that
    are more relevant to the word being generated. This model can also be trained
    end to end.


    ## 7. Playing Video Games (Atari games)


    In \[[13](#bodymatter-004.xhtml#b_9783110670905-004_ref_013)\], Minh et al. showed
    that `DQN` model was successfully able to achieve human-level performance across
    41 out of 49 Atari games. `DQN` uses deep `Q-learning` algorithm a variant of
    `Q-learning` algorithm which uses experience replay to solve the problems faced
    by neural `Q-learning`. In \[[14](#bodymatter-004.xhtml#b_9783110670905-004_ref_014)\],
    the authors extended `DQN` with prioritized replay in which the frequency of replay
    in updates depended upon its `TD` error.


    ## 8. Work in and reasoning


    Most of the literature on reasoning and knowledge representation used symbolic
    logic-based methods. Currently, research is being done to train a `DNN` model
    that will be able to perform logical reasoning in the form of basic ontology reasoning
    \[[49](#bodymatter-004.xhtml#b_9783110670905-004_ref_050)\].


    ## 4.10 Conclusion


    A lot of research is being done in the field of deep learning. This has mostly
    been encouraged by the impressive results deep learning is achieving in all the
    domains it is being applied to.


    With the increase in the usage of `DNNs` for various applications, there is an
    increased need for practitioners who can design task-specific architectures. This
    has also generated interest in neural architecture search and hyper parameter
    optimization algorithms which automate this process. Most of neural architecture
    search techniques use either evolutionary algorithms or reinforcement learning.
    In particular, \[[50](#bodymatter-004.xhtml#b_9783110670905-004_ref_051)\] presents
    how neural architectures can be searched using reinforcement learning. One exciting
    approach in this field is differentiable architecture search \[[51](#bodymatter-004.xhtml#b_9783110670905-004_ref_052)\]
    which as the name implies assumes that the architecture space is continuous. This
    allows the usage of gradient-based techniques.


    One recent advance in the field has been the introduction of capsule networks
    \[[52](#bodymatter-004.xhtml#b_9783110670905-004_ref_053)\]. This neural network
    architecture that builds upon `CNNs` manages to learn equivariant representations.
    That is, they can easily deal with the input even when the image is scaled, rotated,
    or skewed. Research is being done to make the neural decision-making process more
    understandable. Deployment of black boxes such as neural networks in safety-critical
    applications raises several concerns. The field of deep learning is very exciting
    due to the rapid advances being made in it. Breakthrough results are being achieved
    very consistently due to new architectures, training techniques, and datasets.


