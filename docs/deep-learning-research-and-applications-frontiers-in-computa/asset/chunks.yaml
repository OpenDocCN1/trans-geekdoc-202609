    \ \\[[9](#bodymatter-004.xhtml#b_9783110670905-004_ref_009)\\] which allow mapping\
    \ from one image domain to another even when no paired datasets exist for those\
    \ domains. For example, this allows us to convert the image of a red car to that\
    \ of a blue car even when we do not have an image of that particular car model\
