    # 音频信号特征概述


    ## 感知特征


    A thorough research in psychoacoustics and the rudimentary stages of auditory
    signal processing in humans forms the basis of perceptual features. The cochlea
    in the inner ear serves as intersecting bandpass filters. To model it in real
    world, proposed methods include gammatone filters \[[20](#bodymatter-006.xhtml#b_9783110670905-006_ref_020),
    [21](#bodymatter-006.xhtml#b_9783110670905-006_ref_021), [22](#bodymatter-006.xhtml#b_9783110670905-006_ref_022)\],
    and simple implementation using discrete Fourier transforms, among others and
    the features thus extracted are known as cochleagrams. Another such feature is
    the correlogram which is responsible for capturing the essence of the fundamental
    frequency and higher harmonics from the signal \[[23](#bodymatter-006.xhtml#b_9783110670905-006_ref_023)\]
    that helps in segmentation of audio. Modular Spectrums on the other hand are able
    to detect variances from extended durations which help in preserving phonemic
    or syllabic structure in case of speech signals; this is done by applying some
    kind of transform on every frequency component along the time axis \[[24](#bodymatter-006.xhtml#b_9783110670905-006_ref_024)\].
    The aforementioned features model the outer ear. To model the complexities of
    the inner ear multiscale representations are used \[[25](#bodymatter-006.xhtml#b_9783110670905-006_ref_025),
    [26](#bodymatter-006.xhtml#b_9783110670905-006_ref_026)\]. Therefore, perceptual
    features can be thought of as simple minor features that are able to convey notable
    impressions of sound synonymity. Loudness, sharpness, and spectral features, such
    as spectral centroid or spectral flux and roughness, are few among many such features;
    MFCC being one of the most important and widely used ones, which will be elaborated
    later in the chapter.


    ## 物理特征


    Physical features are more mathematical in nature and extraction techniques are
    mostly applied on the crude signal without transforming it to other domains or
    applying filters, as opposed to perceptual features. Such features include the
    magnitude of energy, alterations in the amplitude of a waveform within every cycle
    \[[27](#bodymatter-006.xhtml#b_9783110670905-006_ref_027)\], the duration of such
    alterations, or the root-mean square of the magnitude of a waveform. These features
    could also be rhythm-based and computed using different methods including finding
    the peaks of the output envelopes in frequency bands or by finding pulse clarity
    or band periodicity, to state a few. Another set of physical features are frequency-based
    which constitute spectral flux, line spectral frequencies, spectral peaks, and
    the spectral centroid which is defined as the center of gravity of spectral energy
    leading to the mean of the frequency values. Frequency features also include pitch
    profiles, harmonicity, jitter, and a lot more spectral features which will be
    elaborated later in the chapter. Wavelet transforms have an upper-hand over Fourier
    transforms (FT) when representing discontinuous functions, because they are able
    to deconstruct and reconstruct finite, non-periodic and non-stationary signals
    precisely. Therefore, wavelet-based features such as Hurst parameter features
    and matching pursuit-based Gabor features serve as an appropriate feature-set
    for vocal and musical audio signals. Image processing techniques are used to extract
    features from time–frequency illustration of audio signals in the form of image.
    These features are known as image spectrograms. Among other physical features
    are cepstral features and features from the eigen space, phase space, and acoustic
    environment features.


    The taxonomy of audio signal features branches out to great details with various
    kinds of features under each head, interested readers can refer to \[[18](#bodymatter-006.xhtml#b_9783110670905-006_ref_018)\]
    for further details. In this chapter, only the most common and widely used features
    for audio classification and learning have been mentioned and detailed.


    ## 6.2.3 Mel frequency cepstral coefficients (MFCCs)


    MFCCs are the most widely used perceptual features because of their success in
    embodying the speech amplitude spectrum concisely. These features are obtained
    after applying a series of functions on the audio signal as described \[[10](#bodymatter-006.xhtml#b_9783110670905-006_ref_010),
    [28](#bodymatter-006.xhtml#b_9783110670905-006_ref_028)\].


    It starts with applying a filter that amplifies the higher frequencies in the
    signal, which elevates the energy at these parts. After amplification, the entire
    signal is fragmented into small frames ranging typically between 20ms and 40ms.
    This is done because an audio signal changes constantly, but not much statistical
    variations are observed over short time frames, so the chosen range is appropriate
    as ranges smaller than that would not give sufficient samples for decent spectral
    estimation. The next process in the line is applying the Hamming window function
    which eliminates the edge effects and assimilates all the frequency lines that
    are placed close together. This is done to imitate the cochlea of the human ear
    that is unable to discriminate between frequencies that are very near to each
    other, thus maintaining the perceptual nature of this technique. The output of
    the Hamming window is expressed in eq. (6.1).


    (6.1) `y(n) = x(n) × w(n)`


    In the eq. (6.2), `N` represents the number of samples in each frame and in eq.
    (6.1), `y(n)` is the output signal. The input signal is represented by `x(n)`
    and `w(n)` represents the Hamming window operation. A time signal is composed
    of its constituent frequencies and a FT on the time signals gives us the corresponding
    complex-valued function in the frequency domain. This transform is represented
    by eq. (6.3).


    (6.3) $F\\left( \\xi \\right) = \\!\\!\\int\\limits\_{- \\infty}^{\\infty}\\!\\!
    f\\left( x \\right)e^{- 2\\pi ix\\xi}dx$


    In the above equation ξ is any real number and Ƒ(ξ) represents the FT of the function
    f(x). Therefore, after windowing, FT is applied on the resultant signal so now
    the subject worked upon is a frequency representation. The resultant signal after
    applying FT is represented using eq. (6.4). The periodogram-based power spectral
    estimate for the resultant frame, represented by `P[i](k)`, is given by eq. (6.5).


    (6.4) $S\_{i}\\left( k \\right) = \\sum\\limits\_{n = 1}^{N}s\_{i}\\left( n \\right)y\\left(
    n \\right)e^{- j2\\pi kn/N\\ }\\ 1 \\leq k \\leq K$


    (6.5) $P\_{i}\\left( k \\right) = \\frac{1}{N}\\left| {S\_{i}\\left( k \\right)}
    \\right|\\ ^{2}$


    In the above equation `i` is the total number of frames, `n` represents the samples
    in each frame, `N` is the total number of samples in a frame and `K` represents
    the length of the FT. `y(n)` is the output signal obtained after windowing. Let
    us assume that first `C` coefficients are used for further processing (use shown
    later). The inability of the cochlea to distinguish between near adjacent frequency
    lines becomes more pronounced towards the higher frequencies. The Mel scale helps
    to incorporate this behavior into the extracted features so that it is analogous
    to how humans process audio. The Mel transform is given by eq. (6.6).


    (6.6) $M\\left( {\\, f} \\right) = 1125 \\times {ln}\\left( {1 + \\frac{f}{700}}
    \\right)$


    In the above equation, `f` is the frequency expressed in hertz. To represent the
    power spectrum on the Mel scale, filterbanks are applied to it. [Figure 6.4](#bodymatter-006.xhtml#b_9783110670905-006_fig_004)
    shows a demonstration of the filterbanks and the windowed segments.


    ![Figure 6.4: Plot of Mel filterbanks.](graphic/converted/b_9783110670905-006_fig_004.png)


    Figure 6.4: Plot of Mel filterbanks.

    '
