    \ between input and output layers. In a recurrent network, data may propagate\
    \ through a layer several times. Backpropagation through time (BPTT) technique\
    \ is used to train recurrent networks (RNN). The underlying idea of BPTT is to\
    \ transform a recurrent network into an unfolded feedforward network (multilayer\
    \ network), where conventional backpropagation learning is used for gradient calculation.\
    \ Here, each layer of the unfolded network represents a time step. The objective\
    \ of Chapter 7 is to integrate the concept of BPTT in the framework of fuzzy time\
    \ series prediction. The model takes a sequence of previous values as input (fuzzy\
    \ inputs) to the different layer of the unfolded network and produces fuzzy output.\
