    \n# 3 Handwritten Digit Recognition Using Convolutional Neural Networks\n\nRanjan\
    \ Jana RCC Institute of Information Technology, Kolkata, West Bengal, India Siddhartha\
    \ Bhattacharyya CHRIST (Deemed to be University), Bangalore, Karnataka, India\
    \ Swagatam Das Indian Statistical Institute, Kolkata, West Bengal, India. \n\n\
    #### Abstract\n\nOptical character recognition (OCR) systems have been used for\
    \ extraction of text contained in scanned documents or images. This system consists\
    \ of two steps: character detection and recognition. One classification algorithm\
    \ is required for character recognition by their features. Character can be recognized\
    \ using neural networks. The multilayer perceptron (MLP) provides acceptable recognition\
    \ accuracy for character classification. Moreover, the convolutional neural network\
    \ (CNN) and the recurrent neural network (RNN) are providing character recognition\
    \ with high accuracy. MLP, RNN, and CNN may suffer from the large amount of computation\
    \ in the training phase. MLP solves different types of problems with good accuracy\
    \ but it takes huge amount of time due to its dense network connection. RNNs are\
    \ suitable for sequence data, while CNNs are suitable for spatial data. In this\
    \ chapter, a CNN is implemented for recognition of digits from MNIST database\
    \ and a comparative study is established between MLP, RNN, and CNN. The CNN provides\
    \ the higher accuracy for digit recognition and takes lowest amount of time for\
    \ training the system with respect to MLP and RNN. The CNN gives better result\
    \ with accuracy up to 98.92% as the MNIST digit dataset is used, which is spatial\
    \ data.\n\nKeywords:  convolutional neural network,  deep neural network,  handwritten\
