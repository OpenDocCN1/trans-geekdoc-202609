    The runs scored by the player are given in [Table 2.3](#bodymatter-002.xhtml#b_9783110670905-002_tab_003).


    Table 2.3:Runs scored by the player in the past.


    | `X[1]` || `X[2]` || `X[3]` || `X[4]` || `X[5]` || `X[6]` || `X[7]` || `X[8]`
    || `X[9]` || `X[10]` || `X[11]` || `X[12]` |


    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |


    | 100 || 110 || 120 || 140 || 170 || 180 || 190 || 210 || 220 || 240 || 250 ||
    270 |


