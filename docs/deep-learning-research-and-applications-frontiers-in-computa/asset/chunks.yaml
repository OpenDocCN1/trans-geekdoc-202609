    ## 1.7 Conclusion


    In this chapter, an overview with their relationship between AI, ML, and DL has
    been specified. At the same time, the reason for considering DL as state of the
    art in modern era has been discussed. The main focus is to highlight different
    cloud platforms available in the market by different vendors. In Section 1.6,
    different steps of using ML with IBM Watson Studio – have been described, including
    data set management and cleansing raw data. Comparative discussion in terms of
    performance, accuracy, 24 × 7 availability, and user-friendliness between the
    ML platform offerings by multiple organizations can be considered for future study.


