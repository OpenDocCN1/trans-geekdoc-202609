- raw: 'A perceptron is a simple neural network model. It is the pioneer of complex
    neural networks. It tries to solve difficult problems like biological brains.
    The power of neural networks comes from their ability to model the system correctly
    from the training data and it predicts the output for data classification. In
    this sense, neural networks learn mapping scientifically. These types of networks
    are capable of learning any mapping function. The capability for prediction of
    any neural networks comes from the multilayered structure of the networks. The
    architecture of MLP consist of one input layer, one output layer, and multiple
    hidden layers as shown in [Figure 3.2.](#bodymatter-003.xhtml#b_9783110670905-003_fig_002)
    The architecture learns the features at different scales and combines them into
    higher-order features. For example, the architecture learns lines, then from collections
    of lines to shape. MLP is an efficient classifier. During training, the inputs
    are assigned with a class for the network to train the system. The network learns
    mapping very efficiently from input dataset to output dataset for data classification.


    ![Figure 3.2: Basic architecture of MLP.](graphic/converted/b_9783110670905-003_fig_002.png)


    Figure 3.2: Basic architecture of MLP.


    ### 3.4.2 Convolutional neural network


    CNN is an efficient neural network architecture in computer vision. It is used
    to extract the features automatically, and then classify the extracted features.
    The architecture uses a sequence of filters on raw pixels of an image to extract
    high-level, middle-level, and low-level features and then classifies the image
    based on extracted features. CNN maintains the spatial relationship between pixels
    using small squares of input data to extract features. Features are extracted
    across the entire image to allow the objects in the image to be translated or
    shifted. CNN architecture consists of a sequence of different layers that transform
    an input data into an output data. This architecture consists of input layer,
    output layer, and hidden layers as shown in [Figure 3.3.](#bodymatter-003.xhtml#b_9783110670905-003_fig_003)
    The hidden layers are divided into two modules. First module is used for feature
    extraction and the second module is used for features classification. The first
    module consists of repetitive convolution layers and pooling layers. The second
    module consists of a number of dense layers. The number of nodes in the last dense
    layer consists of the number of target classes. This layer is called output layer.


    ![Figure 3.3: Basic architecture of CNN.](graphic/converted/b_9783110670905-003_fig_003.png)


    Figure 3.3: Basic architecture of CNN.


    #### 3.4.2.1 Convolution layer


    Convolution layer is the main layer of a CNN. This layer consists of a set of
    convolution filters to perform some mathematical operations to generate one value
    in the output map. In the forward pass, every filter is convoluted throughout
    the entire image subregions. It is simply the dot product between the values of
    the subregion of input image/data and the values of the convolution filter. It
    produces a two-dimension activation map of the convolution filter to detect some
    specific type of features. The output data size of the convolution layer depends
    on the size of the filter, the value of stride, and zero-padding. The number of
    neurons in a convolution layer that connect to the same subregion of the input
    data is controlled by the size of the filter. These neurons learn to activate
    different features in the input data. For the first convolution layer, the input
    data is the raw pixels of the input image and the neurons learn to activate the
    presences of edges in the input image. The step of convolution operation is called
    stride, which controls the size of the output data of the convolution layer. If
    the stride is n then the convolution filter moves *n* pixels at a time. For low
    value of stride, the filter is overlapping the receptive fields and produce large
    output data size. Zero-padding is used to pad the border of the input data by
    the zero. It is required to maintain the output data size same as input data size.
    Each convolution layer applies a rectified linear unit (ReLU) to the output map
    which establishes nonlinearities into the architecture. ReLU applies element wise
    activation without affecting the receptive fields of the convolution layer. The
    most frequently used nonlinear activation functions in this layer are *f*(*x*) = tanh(*x*),
    *f*(*x*) = max(0,*x*), and *f*(*x*) =(1+*e*^( − *x*))^( − 1).


    #### 3.4.2.2 Pooling layer


    The pooling layer performs a nonlinear down-sampling operation on the input data
    generated by previous convolution layer. This layer performs between two successive
    convolution layers. It is a procedure to compress the extracted features and reduce
    the overfitting of the training data. Most frequently, pooling layer uses 2 × 2
    filter with a stride of 2 for down-sampling. So, this technique is discarding
    75% of the activations. Although, several nonlinear functions are available, max
    pooling is the most frequently used nonlinear function for pooling operation.
    In this layer, the input data is partitioned into a number of square subregions
    and generates the highest value of each subregion. The logic behind pooling is
    that the actual location of a feature in the image/data is less significant. This
    layer provides the architecture to another form of translation invariance.


    #### 3.4.2.3 Fully connected network (FCN) layer


    After the repetitive convolution and pooling layers, one or more FCN layer performs
    features classification. Here, every node of current layer is connected to every
    node of previous layer. The number of nodes in the final FCN layer consists of
    the number of target classes. The softmax activation function is used to generate
    a value between 0 and 1 for each node of the target class. The softmax function
    generates the probability of an image/data belonging to each target class. The
    total of all softmax values is 1.


    ### 3.4.3 Recurrent neural network


    RNN is capable to memorize the input into output mapping for its internal memory.
    The network contains minimum one feedback connection for memorization as shown
    in [Figure 3.4.](#bodymatter-003.xhtml#b_9783110670905-003_fig_004) A delay unit
    is used to introduce the output of RNN to loop back into the network for memorization.
    RNN inserts the recent past data to the current state. So, RNN has a present input
    data as well as recent past input data. The network is an exceptional neural network
    that is proposed for sequence data. This network allows demonstrating the dynamic
    behavior for a time sequence data. RNN architecture uses its memory to process
    sequences of input data. RNN is a feed-forward MLP with addition of loops in the
    architecture. So that, each neuron of a layer can transfer its signal to the next
    layer. The output of a layer may feedback as an input to the layer for the next
    input data. The recursive connections in RNN permit to gain knowledge of broad
    abstractions for any sequence of input data. RNN is more applicable for connected handwriting
    character recognition or speech recognition.


    ![Figure 3.4: Basic architecture of RNN.](graphic/converted/b_9783110670905-003_fig_004.png)


    Figure 3.4: Basic architecture of RNN.


    ## 3.5 Implementation'
