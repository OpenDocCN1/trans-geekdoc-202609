    \ LSTMs have been proposed \\[[13](#bodymatter-006.xhtml#b_9783110670905-006_ref_013),\
    \ [38](#bodymatter-006.xhtml#b_9783110670905-006_ref_038)\\] and a detailed comparative\
    \ study on the proposed architectures have been carried out by \\[[39](#bodymatter-006.xhtml#b_9783110670905-006_ref_039)\\\
    ] which shows that bidirectional LSTM-RNNs(BLSTM-RNNs) give the best results when\
    \ it comes to phoneme recognition, therefore we will elaborate more on the training\
    \ and framework of BLSTMs which take into consideration the future context as\
    \ well which is necessary as explained before. Equations (6.26) and (6.27) show\
    \ the calculation of *h*^← and *h*^→, which represents the backward and forward\
    \ sequences respectively.\n\n(6.26) *h*[*t*]^→ = *Ƕ*(*W*[*x**h*^→]*x*[*t*]+*W*[*h*^→*h*^→]*h*[*t* − 1]^→+*b*[*h*^→])\
    \ (6.27) *h*[*t*]^← = *Ƕ*(*W*[*x**h*^←]*x*[*t*]+*W*[*h*^←*h*^←]*h*[*t* − 1]^←+*b*[*h*^←])\
    \ (6.28)*y*[*t*]^() = *W*[*h*^→*y*]*h*[*t*]^→ + *W*[*h*^←*y*]*h*[*t*]^← + *b*[*y*]\
    \ \n\nIn deep LSTM-RNNs, the calculation for the hidden units are kept the same\
    \ for all the *N* layers as shown in (29), where *h*⁰ = x, and the output depends\
    \ on the inputs from the final hidden layer as shown in (30). In deep BLSTMs,\
    \ every hidden layer comprises a forward and a backward sequence: *h*^(*n*←) and\
    \ *h*^(*n*→)and every layer receives inputs from both the sequences in the previous\
    \ layer.\n\n(6.29) *h*[*t*]^(*n*) = *Ƕ*([*h*^(*n* − 1)*h*^(*n*)]*h*[*t*]^(*n* − 1)+ *W*[*h*^(*n*)*h*^(*n*)]*h*[*t* − 1]^(*n*)+*b*[*h*]^(*n*))\
    \ (6.30)*y*[*t*]^() = *W*[*h*^(*N*)*y*]*h*[*t*]^(*N*) + *b*[*y*] \n\nThe network\
    \ is trained to directly predict the phonemes from the acoustic input *x*. The\
