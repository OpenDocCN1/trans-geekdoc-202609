    ## 4.6 Deep reinforcement learning


    The reinforcement learning literature is rife with algorithms that guarantee convergence
    to the optimal solution when they are used with look-up tables. These reinforcement
    learning algorithms are analyzed for the cases when the underlying Markov decision
    processes (MDP) have finite number of states and actions. However, the look-up
    tables do not scale well for high-dimensional MDP which has continuous (infinite)
    states or actions because of the curse of dimensionality. So, function approximators
    like sigmoidal, multilayer perceptron, a radial basis function, or a memory based
    learning network must be used.


    In [53], Widrow et al. introduced a reinforcement learning variant of ADALINE
    Algorithm, in which an adaptive logic unit learned from the feedback the decision
    functions that are not necessarily linearly separable. Barto, Andrew G. et al.
    proposed in [54], that decision-making tasks with delayed consequences can be
    accurately formulated as sequential decision problems and solved by dynamic programming.
    They showed that the adaptive neural networks (ANN) will be successfully used
    for approximating the functions required for solving such problems. The dynamic
    programming methods, in case when the states are finite and discrete, depend on
    the look-up table representation of the evaluation functions to find the value
    of the states in successive iterations. But when the state space is continuous,
    the discretization of state space results in exponential-states in the state space.
    However, with the advancement in the knowledge of Deep learning, ANNs are being
    used for generalized functional approximation.


    ### 4.6.1 Deep Q-networks


    One such important learning algorithm that is successfully used to learn control
    policies from images using reinforcement learning and neural networks as function
    approximators was deep Q-learning. It used a CNN with a variant of Q-learning.
    The input to this model was images in the form of raw pixels and, as an output,
    it predicted the value function which was used to estimate the future rewards.
    The problem with applying deep learning directly as functional approximators is
    that:


    1. Deep learning requires large amounts of hand-labeled data while reinforcement
    learning uses scalar rewards that are usually sparse, noisy, and delayed.


    2. Most deep learning algorithms assume that the data is being sampled from independent
    and identical distributions, however in reinforcement learning the rewards received
    are highly correlated and the data distribution changes as the agent learns new
    behaviors.


    Deep Q-networks (DQN) used the experience replay mechanism that randomly sampled
    from previous transitions to solve the problem of correlated data and nonstationary
    distribution. The experience replay stores the agents experience at each time
    step, `ϵ[t] = (s[t],a[t],r[t],s[t+1])` in a dataset `D = ϵ[1], … ϵ[N]` which is
    collected over many episodes into the replay memory[13](#bodymatter-004.xhtml#b_9783110670905-004_ref_013).
    So, instead of performing updates after every reward signal, deep Q-learning uses
    mini-batch updates drawn at random from the experience replay. Once the updates
    are performed the agent selects and performs actions according to the `ϵ − greedy`
    policy.


    Performing the batch updates addresses many of the problems faced by directly
    applying Q-learning with CNNs as functional approximators.


    1. It is efficient to perform batch updates.


    2. As there exists a strong correlation between data, it is inefficient to learn
    from consecutive samples. We are able to break the correlations by sampling randomly
    and hence the variance of the updates is reduced.


    3. Traditional methods use on-policy learning in which the current parameters
    determine the next data sample on which the parameters are trained on. However,
    when the training distribution changes while learning, there is a higher risk
    of the parameters being stuck in the local minima. Experience replay averages
    the behavior distribution over many of the previous states which smoothens learning
    and avoids a suboptimal solution. Experience replay uses off-policy learning.


    Deep Q-learning algorithm uniformly samples from the experience replay. With this
    method of sampling, transitions are replayed at the same frequency with which
    they were experienced irrespective of their significance. In [14](#bodymatter-004.xhtml#b_9783110670905-004_ref_014),
    the authors developed a framework in which the important transitions were replayed
    more frequently which made the learning more efficient. One of the important concept
    that needs to be addressed in this update would be how we can decide the importance
    of the transition. The importance of the replay can be defined by how much the
    agent learnt by taking the transition from its current state. This can be measured
    using magnitude of the transition’s TD error `δ` which indicates how much the
    value differed from the expected value. However, the TD error can be poor estimates
    when the underlying rewards are noisy.


    Policy search methods are reinforcement learning that aims at directly finding
    the underlying policies by means of gradient-free or gradient-based methods. Traditionally,
    evolutionary algorithms were used to solve these problems which are gradient-free
    policy search algorithms. In evolutionary methods, the performance of a population
    of agents is considered for evaluating the performance. These methods give successful
    results in case of small population but become intractable when there are large
    numbers of agents or agents have multiple parameters. However, evolutionary models
    can be used to train large networks if the neural networks weight representation
    can be compressed. In [15](#bodymatter-004.xhtml#b_9783110670905-004_ref_015),
    the authors represented the networks weights as Fourier-type coefficients, thus,
    using a compressed encoding for weights. This method was successfully used for
    training for tasks that have very large networks owing to the high dimensional
    input space.


