    \ on the test data. If we keep other things the same, overfitting increases with\
    \ increase in complexity of the model. While `L1`/`L2` regularization has been\
    \ used a lot, two other techniques that are now being used are covered below:\n\
    \n1. Dropout: Dropout `[[16](#bodymatter-004.xhtml#b_9783110670905-004_ref_016)]`\
    \ is a regularization technique in which network connections are dropped with\
    \ a certain probability `p`. This ensures that the network does not become too\
    \ reliant on those connections.\n\n2. Batch normalization: Batch normalization\
    \ `[[17](#bodymatter-004.xhtml#b_9783110670905-004_ref_017)]` works by first calculating\
    \ the mean and the standard deviation of the activations of hidden layers in the\
    \ network for the batch. The activations of the batch are then normalized by subtracting\
    \ the mean from them and dividing them by the calculated standard deviation. Two\
    \ new parameters are introduced in these layers `γ` and `β`. These are used to\
    \ scale and shift the normalized activations `x̂`:\n\n    (4.7) `y = x̂γ + β`\n\
    \n3. This also has a small regularizing effect on the network.\n\n### 4.7.2 Transfer\
    \ learning\n\nThe success of deep learning has been possible partly due to the\
