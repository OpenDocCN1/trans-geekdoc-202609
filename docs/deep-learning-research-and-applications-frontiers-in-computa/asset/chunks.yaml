    \ bias for the j^(th) unit in the hidden layer and *ω[ij]* is the weight between\
    \ the i^(th) unit in the visible layer and the j^(th) unit in the hidden layer.\n\
    \n(6.31) $E\\\\left( {ʋ,ɧ} \\\\right) = - \\\\sum\\\\limits\\_{i\\\\,\\\\epsilon\\\
    \\, visible}^{}ձ\\_{i}v\\_{i} - {}\\\\!\\\\sum\\\\limits\\_{j\\\\,\\\\epsilon\\\
    \\, hidden}^{}ճ\\_{j}ɧ\\_{j} - {}\\\\sum\\\\limits\\_{i,j}^{}ʋ\\_{i}ɧ\\_{j}\\\\\
    omega\\_{ij}$ \n\nThe probabilities assigned to visible units and to all possible\
    \ pairs of visible and hidden units, using the energy function in (31), is given\
    \ in eqs. (6.32) and (6.33) respectively.\n\n(6.32) $P\\\\left( {ʋ|\\\\theta}\
    \ \\\\right) = \\\\frac{\\\\sum\\_{ɧ}e^{- E{({ʋ,ɧ})}}}{\\\\sum\\_{\\\\nu,ɧ}e^{-\
    \ E{({ʋ,ɧ})}}}$ (6.33) $P\\\\left( {ʋ,ɧ|\\\\theta} \\\\right) = \\\\frac{e^{-\
    \ E{({ʋ,ɧ})}}}{\\\\sum\\_{\\\\nu,ɧ}e^{- E{({ʋ,ɧ})}}}$ "
  fmt: "\n# 语言处理与循环神经网络\n\n在语言中，最小单位是音素。音素组合形成单词，单词再组合形成句子，许多句子共同构成上下文。因此，不能仅通过监听某个时间帧的音素来确定整个单词，因为前后的发音共同构成了有意义的单词。同样，为了确定给定句子或文本片段的上下文（这是\
    \ NLP 的重要应用），必须考虑该句子之前和之后的所有数据。RNNs 曾广泛用于 SR 任务，但它们不擅长建模音素或单词之间的依赖关系。这是因为每当考虑的帧增加时，就会出现消失和爆炸梯度下降问题。长短期记忆-循环神经网络（LSTM-RNNs）通过捕捉扩展时间帧上的依赖关系，在\
    \ SR 中取得了令人印象深刻的结果，成为解决方案。\n\nLSTM 单元的主要部分包括输入门（i）、遗忘门（f）和输出门（o）。由于网络具有循环性质，输出门的连接被指向输入层，如\
    \ [Figure 6.7](#bodymatter-006.xhtml#b_9783110670905-006_fig_007) 所示。本质上，遗忘门控制数据流以避免冗余或重复，即在给定先前输入的情况下，防止相似单词重复出现以保留含义。记忆（c）也被纳入\
    \ LSTM 中，如 [Figure 6.7](#bodymatter-006.xhtml#b_9783110670905-006_fig_007) 所示，以便能够记住之前遇到的单词，从而坚持上下文。由\
    \ LSTM 单元组成的单层在 SR 任务中效果不佳，因此将多个隐藏层的 LSTM 堆叠在一起，这被称为 deep-LSTMs \\[[38](#bodymatter-006.xhtml#b_9783110670905-006_ref_038)\\\
    ]。在 SR 中，通过结合声学模型（AM）和语言模型（LM），两者均使用 LSTM-RNNs 构建，获得了可观的准确性。\n\n任何 LSTM-RNN 模型的输入集合，表示为\
    \ `x={x[1],x[2],…,x[T]}`，在 LM 的情况下可以是离散单词集合，在 AM 的情况下可以是 MFCC 向量。通过 `t={1,2,…,T}`\
    \ 计算的隐藏序列表示为 `h={h[1],h[2],…,h[T]}`，输出表示为 `y={y[1],y[2],…,y[T]}`。\n\n![Figure\
    \ 6.7: Detailed representation of a simple recurrent network unit (left) and long\
    \ short-term memory unit (right).](graphic/converted/b_9783110670905-006_fig_007.png)\n\
    \nFigure 6.7: Detailed representation of a simple recurrent network unit (left)\
    \ and long short-term memory unit (right).\n\n隐藏单元和输出单元的计算如 eqs. (6.19) 和 (6.20)\
    \ 所示，其中 `Ƕ(.)` 是用于计算每个隐藏 LSTM 单元值的更复杂操作的简单表示，`W` 表示整个权重集合；在任何点 `W[ab]` 表示 `a`\
    \ 和 `b` 单元之间的权重，可以是 `i`、`f`、`o`、`c`、`x` 和 `h` 中的一个，`b` 是偏置项。\n\n```\n(6.19) h[t]\
    \ = Ƕ(W[xh]x[t] + W[hh]h[t-1] + b[h]) \n(6.20) y[t] = (W[hy]h[t] + b[y])\n```\n\
    \n`Ƕ` 到先前提到的门的函数的分解如 eqs. (6.21)–(6.25) 所示，这也解释了 LSTM 单元内数据流。\n\n```\n(6.21) i[t]\
    \ = σ(W[xi]x[t] + W[hi]h[t-1] + W[ci]c[t-1] + b[i])\n(6.22) f[t] = σ(W[xf]x[t]\
    \ + W[hf]h[t-1] + W[cf]c[t-1] + b[f])\n(6.23) c[t] = f[t]c[t-1] + i[t]tanh(W[xc]x[t]\
    \ + W[hc]h[t-1] + b[c])\n(6.24) o[t] = σ(W[xo]x[t] + W[ho]h[t-1] + W[co]c[t] +\
    \ b[o])\n(6.25) h[t] = o[t]tanh(c[t])\n```\n\n涉及 LSTM 的各种架构已被提出 \\[[13](#bodymatter-006.xhtml#b_9783110670905-006_ref_013),\
