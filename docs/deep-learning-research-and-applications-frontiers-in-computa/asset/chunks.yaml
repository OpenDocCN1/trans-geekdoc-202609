  trans: "\n\n# 受限玻尔兹曼机\n\n由于单元包含二进制值，任何隐藏单元和可见单元为 1 的概率由等式 (6.34) 和 (6.35) 给出，其中\
    \ `σ(ϰ) = (1 + e^−)^(−1)`。\n\n(6.34) `P(ɧ[j] = 1|ʋ; θ) = σ(∑[i ϵ visible] ʋ[i]\
    \ ω[ij] + ճ[j])`  \n(6.35) `P(ʋ[i] = 1|ɧ; θ) = σ(∑[j ϵ hidden] ɧ[i] ω[ij] + ձ[j])`\n\
    \n如果 RBM 需要复制类标签与数据的联合分布，则类标签的二进制表示向量 `ȴ` 与可见单元向量连接，并考虑标签的能量函数在等式 (6.36) 中给出。\n\
    \n(6.36) `$E\\\\left( {ʋ,ɧ,ȴ} \\\\right) = - \\\\sum\\\\limits\\_{i\\\\,\\\\epsilon\\\
    \\, visible}{ձ\\_{i}ʋ\\_{i}} - \\\\sum\\\\limits\\_{j\\\\,\\\\epsilon\\\\, hidden}{ճ\\\
    _{j}ɧ\\_{j}} - \\\\sum\\\\limits\\_{y\\\\,\\\\epsilon\\\\, labels}{ɕ\\_{y}ȴ\\\
    _{y}} - {}\\\\sum\\\\limits\\_{i,j}{v\\_{i}ɧ\\_{j}\\\\omega\\_{ij}} - \\\\sum\\\
    \\limits\\_{j,y\\\\,\\\\epsilon\\\\, labels}{ȴ\\_{y}ɧ\\_{j}\\\\omega\\_{ij}}$`\n\
    \n特定单元对应的标签被激活的概率由等式 (6.25) 给出，`P(ȴ|ʋ)` 由等式 (6.38) 给出。在等式 (6.36) 和等式 (6.37) 中，`ɕ`\
    \ 是与每个标签相关的偏置。\n\n(6.37) `$P(ȴ\\_{y} = 1{|ɧ};\\\\,\\\\theta) = {softmax}\\\\left(\
    \ {\\\\sum\\\\limits\\_{j\\\\,\\\\epsilon\\\\, hidden}ɧ\\_{j}\\\\omega\\_{yj}\
    \ + ɕ\\_{y}} \\\\right)$`  \n(6.38) `$P(ȴ|ʋ) = \\\\frac{\\\\sum\\_{ɧ}e^{- E{({ʋ,ɧ,ȴ})}}}{\\\
    \\sum\\_{l,ɧ}e^{- E{({ʋ,ɧ,ȴ})}}}$`\n\n接下来，RBM 使用生成式或判别式方法进行训练，如 图 6.8 所示，其中 `V-H`\
    \ 和 `v-h` 分别对应判别式和生成式模型的 `ʋ-ɧ`，而 `W` 对应 `ω`。`generative` 方法更多是一种快捷方法，可大幅加快训练速度。它仅在梯度上应用一次对比度差异（CD）近似，如等式\
    \ (6.39) 所示，其中 `< . >[data]` 表示期望，表示训练集中 `ʋ[i]` 和 `ɧ[j]` 同时等于 1 的次数，`< . >[1]`\
    \ 表示应用 CD[1] 后的期望。\n\n(6.39) `ω[ij] = <ʋ[i]ɧ[j]>[data] − <ʋ[i]ɧ[j]>[1]`\n\n判别式方法用于训练\
    \ RBM 权重，以便它们作为深度置信网络权重的初始值。对于由 (36) 描述的模型，权重更新如等式 (6.40) 所示；但为了使模型泛化良好并防止过拟合，使用\
    \ `ȴ` 和 `ʋ` 的函数 `f(ȴ,ʋ)` 的梯度来更新权重。(41) 中的 `Ƌ` 是控制其关联项影响的参数。\n\n(6.40) `$\\\\Delta\\\
    \\omega\\_{ij}\\\\, = \\\\sum\\\\limits\\_{j\\\\, \\\\in \\\\, hidden}^{}\\\\\
    sigma\\\\left( {ճ\\_{j} + \\\\omega\\_{jy} + \\\\sum\\\\limits\\_{i\\\\, \\\\\
    in \\\\, visible}^{}{\\\\upsilon\\_{i}\\\\omega\\_{ij}}} \\\\right)\\\\, ʋ\\_{i}\\\
    \\, - \\\\!\\\\!\\\\!\\\\!\\\\sum\\\\limits\\_{\\\\substack{{y \\\\in labels},\
    \ \\\\\\\\ j \\\\in hidden}}^{}\\\\!\\\\sigma\\\\left( {ճ\\_{j} + \\\\omega\\\
    _{jy} + \\\\sum\\\\limits\\_{i\\\\, \\\\in \\\\, visible}^{}ʋ\\_{i}\\\\omega\\\
    _{ij}} \\\\right)P(ȴ|ʋ)ʋ\\_{i}$`  \n(6.41) `f(ʋ,ȴ) = ƌP(ȴ|ʋ) + P(ʋ|ȴ)`\n\nRBM\
    \ 的另一种变体是均值-协方差 RBM（mcRBM），它在标准 TIMIT 数据集上获得了最低的错误率之一，该数据集最广泛用于语音识别。mcRBM 由两类隐藏单元组成——精度单元和均值单元。精度单元用于强制平滑度约束，因此，它们对偏离约束限度的样本是活跃的。因此，活跃的精度单元定义了特定于样本的协方差矩阵。有关\
    \ mcRBM 结构的更多信息可以在 [41] 中找到。\n\n![图 6.8：一个无限逻辑信念网，其中模型的生成部分由向下箭头表示。向上箭头表示属于模型判别部分的参数。](img/b_9783110670905-006_fig_008.png)\n\
    \n图 6.8：一个无限逻辑信念网，其中模型的生成部分由向下箭头表示。向上箭头表示属于模型判别部分的参数。\n\n"
