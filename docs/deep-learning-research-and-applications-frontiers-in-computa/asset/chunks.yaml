  trans: "\n\n解码器也是一个神经网络，其输入为表示 `y`，输出是数据的概率分布参数，并具有权重和偏差 `ϕ`。解码器被表示为 `pϕ(s|y)`。以手写数字为例执行时，假设图像为黑白图像，且每个像素的表示形式为\
    \ 0 或 1 (Figure 5.3)。\n\n![Figure 5.3: Illustration of the cited example.](img/b_9783110670905-005_fig_003.png)\n\
    \nFigure 5.3: Illustration of the cited example.\n\n单个像素的概率分布可以使用伯努利分布来表示。数字的隐式表示\
    \ `y` 作为输入传递给解码器，由此得到的输出是 225 个伯努利参数，分别对应图像中的 225 个像素。解码器将 `y` 中的实数值解码为 0 到 1\
    \ 之间的 225 个实数值。由于从较低维度转换到较高维度，会发生信息丢失 \\[17\\]。\n\nVAE 的要求如下：\n\n1. 必须使用两个可处理的分布：\n\
    \n   1. 初始分布 `p(y)` 必须易于采样。\n\n   2. 条件似然 `p(s|y,θ)` 应该可计算。\n\n2. 在实践中，这意味着这两个分布很少复杂，例如，均匀分布、高斯分布，甚至各向同性高斯分布。\n\
    \n一旦图像在 VAE 中被编码和解码，就涉及图像重建。为了提取相似特征/特性，需要执行聚类。\n\n层次聚类是一种统计聚类分析过程，涉及以层次形式构建聚类。在这里，分割和合并以贪婪的方式确定。层次聚类后得到的结果以树状图表示。如果需要对一组\
    \ `M` 个项目及其 `M × M` 距离（或相似度）矩阵进行聚类，则层次聚类过程需要执行以下操作：\n\n1. 首先，将每个 `M` 个项目分配给其自身的聚类；也就是说，对于\
    \ `M` 个项目，将形成 `M` 个聚类，每个聚类仅包含单个项目。假设聚类之间的距离（与相似度）等于它们所包含的项目之间的距离（相似度）。\n\n2. 接下来，需要计算并合并最近（最相似）的聚类对为单个聚类，从而使聚类数量减少\
    \ 1。\n\n3. 接下来，需要计算新形成的聚类与每个旧聚类之间的距离（相似度）。\n\n4. 重复步骤 2 和 3，直到所有项目被聚类为单个大小为 `M`\
    \ 的聚类。\n\nVAE 与标准自动编码器的独特之处在于它们具有连续的隐式空间，允许轻松的随机采样和插值。这一特性使它们成为有效的生成模型。这避免了由于隐式空间不连续而产生不现实输出。\n\
    \n## 5.3 提出的工作和方法论\n\n本章旨在彻底研究从患有书写障碍的儿童中获取的手写体。借助深度学习作为技术工具，从收集的样本中推导出了一些独特存在的特征或模式。这些可区分的特征在医学领域进一步被识别为书写障碍的症状。因此，可以在早期阶段检测出书写障碍，从而有助于采取治疗护理等补救措施。\n\
    \n本研究的最初步骤是收集患有书写障碍的儿童的手写体，然后将收集的文档扫描以便继续进行。考虑到的假设如下：\n\n* 扫描已完美执行，因此引入的倾斜是作者的责任\n\
    \n* 盐椒噪声 \\[18, 19\\] 和背景噪声 \\[18, 19\\] 可能存在，这些噪声可能是在扫描过程之前或之后产生的\n\n拟议工作的步骤如下：\n\
    \n### 5.3.1 预处理\n\n为了最大限度地提高处理效率并减少代码终端阶段的复杂性，进行图像预处理 \\[20, 21\\] 以获得更高质量的图像。手写体分析执行的预处理步骤包括二值化\
    \ \\[22, 23\\] 和噪声去除。中值滤波技术 \\[24\\] 被采用用于盐椒噪声去除 \\[18, 19, 24, 25, 26\\]，而图像二值化使用\
    \ Otsu’s \\[22\\] 阈值技术进行。在二值化中，从灰度图像中获得二值图像。\n\n### 5.3.2 行分割\n\n所获得的二值图像用于行分割。本工作实现将图像转换为灰度图像，然后进行反向二值化，从而得到深色背景和浅色文本。得到的图像被膨胀，并使用\
