- raw: "In unsupervised learning ([Figure 1.6](#bodymatter-001.xhtml#b_9783110670905-001_fig_006)),\
    \ no external trainer is required to accomplish the learning procedure. Inputs\
    \ are provided to the network but without the desired output(s). The network must\
    \ decide itself what characteristics are used to assemble the input data. Competitive\
    \ learning rule is one of the ways to perform unsupervised learning. If an NN\
    \ has two layers – an input layer and a competitive layer, the input layer neurons\
    \ collect the feed data, whereas the competitive layer consists of neurons participating\
    \ among themselves and only the winners of the competition survive and the other\
    \ neurons switch off according to the “winner-takes-all” approach. Another type\
    \ of unsupervised learning is Hebbian, that is, correlate weight adjustment.\n\
    \n![Figure 1.6: Block diagram of unsupervised learning.](graphic/converted/b_9783110670905-001_fig_006.png)\n\
    \nFigure 1.6: Block diagram of unsupervised learning.\n\n#### 1.3.2.2 Supervised\
    \ learning\n\nIf the desired output of an NN is already known and is feed to the\
    \ network, the learning method of the network is called supervised learning. The\
    \ network then processes the inputs and relates its resulting outputs against\
    \ the intended outputs. Differential errors are then calculated, producing the\
    \ system to regulate the weights to control the network. This method happens repeatedly\
    \ as the weights are continuously being fine-tuned.\n\nSupervised learning technique\
    \ ([Figure 1.7](#bodymatter-001.xhtml#b_9783110670905-001_fig_007)) is of two\
    \ types – stochastic (weight adjustment by probability) and through error correction.\
    \ Error correction learning rule is of two types, as stated below.\n\n*   **Delta\
    \ rule** – It was designed by Widrow and Hoff in 1960 and is also known as the\
    \ Widrow and Hoff learning rule or the least mean square rule. The delta rule\
    \ uses the difference between target activation (i.e., target output values) and\
    \ obtained activation to undergo learning. The values of the weights are fine-tuned\
    \ to minimize the difference between target and actual output activation (i.e.,\
    \ error).\n\n*   **Gradient descent rule** – The prime characteristic of gradient\
    \ descent is to gradually but consistently reduce the output error by regulating\
    \ the weights. If a change in a weight (*δ**w*) increases (decreases) the error\
    \ (*δ**E*), then the respective weight decreases (increases) and can be represented\
    \ as follows:\n\n(1.1)$\\\\Delta w\\_{ij}\\\\, = - \\\\eta\\\\frac{\\\\delta E\\\
    _{i}}{\\\\delta w\\_{ij}}$ \n\nThe distance, *η*, is a standard parameter in NNs\
    \ and is termed learning rate.\n\n![Figure 1.7: Block diagram of supervised learning.](graphic/converted/b_9783110670905-001_fig_007.png)\n\
    \nFigure 1.7: Block diagram of supervised learning.\n\n#### 1.3.2.3 Reinforcement\
    \ learning\n\nIn reinforcement learning, the learning of the network is achieved\
    \ through constant collaboration with the situation or environment. [Figure 1.8](#bodymatter-001.xhtml#b_9783110670905-001_fig_008)\
    \ shows the block diagram of a typical reinforcement learning network constructed\
    \ around a trainer that transforms a reinforcement signal collected from environment\
    \ into an advanced signal termed as the heuristic reinforcement signal.\n\n![Figure\
    \ 1.8: Block diagram of reinforcement learning.](graphic/converted/b_9783110670905-001_fig_008.png)\n\
    \nFigure 1.8: Block diagram of reinforcement learning.\n\n## 1.4 Deep learning\n\
    \nDL is a category of ML in which a network or model learns directly from dataset\
    \ \\[[8](#bodymatter-001.xhtml#b_9783110670905-001_ref_008)\\]. The word “deep”\
    \ denotes the number of layers in the network – the deeper network consists of\
    \ many layers. Traditional NNs comprise only two or three layers, whereas deep\
    \ networks can have hundreds of such layers as shown in [Figure 1.9](#bodymatter-001.xhtml#b_9783110670905-001_fig_009).\
    \ There is no specific definition beyond how many layers we can categorize the\
    \ network as “deep” \\[[9](#bodymatter-001.xhtml#b_9783110670905-001_ref_009)\\\
    ]. Learning techniques are similar to ML and ANN, as depicted earlier. DL is particularly\
    \ suitable to identify modern smart applications \\[[10](#bodymatter-001.xhtml#b_9783110670905-001_ref_010)\\\
    ] such as face recognition, text translation, voice recognition, and advanced\
    \ driver assistance systems including lane classification and traffic sign recognition.\n\
    \n![Figure 1.9: Block diagram of deep learning network.](graphic/converted/b_9783110670905-001_fig_009.png)\n\
    \nFigure 1.9: Block diagram of deep learning network.\n\n### 1.4.1 What makes\
    \ DL state of the art?\n\n*   Advanced tools and techniques have deeply improved\
    \ the accuracy of DL algorithms. By comparing with ML in the same problem with\
    \ same dataset, it has been shown that DL minimizes the % of error drastically.\n\
    \n*   DL can deal with massive dataset, which purposefully improvises the training\
    \ of the network. In today’s world, there is no scarcity of data. As shown in\
    \ [Figure 1.10](#bodymatter-001.xhtml#b_9783110670905-001_fig_010), DL performs\
    \ far better than ML at the presence of huge amount of data.\n\n*   High-performance\
    \ GPUs quicken the training of DL network with the huge volumes of data, which\
    \ lessens the training time from weeks to hours. GPUs are available in any DL\
    \ cloud platform.\n\nMany standard models, developed and agreed by experts, are\
    \ available in cloud platforms to reuse in any DL network for any purpose.\n\n\
    ![Figure 1.10: Performance comparison between ML and DL.](graphic/converted/b_9783110670905-001_fig_010.png)\n\
    \nFigure 1.10: Performance comparison between ML and DL.\n\n### 1.4.2 Activation\
    \ functions\n\nActivation function or transfer function \\[[11](#bodymatter-001.xhtml#b_9783110670905-001_ref_011),\
    \ [12](#bodymatter-001.xhtml#b_9783110670905-001_ref_012)\\] converts an input\
    \ signal of a node of an NN to an output signal, which is considered as an input\
    \ to the next layer of the network. It introduces nonlinearity into the network,\
    \ which makes the network more powerful and adds ability to learn something complex\
    \ and complicated form data. So, it is very significant to choose the appropriate\
    \ activation function for any network because it can considerably change the behavior\
    \ of the network. The popular activation functions are described below. In all\
    \ equations, *f*^′(*x*) is considered as the derivative of *f*(*x*), where *x*\
    \ is the input signal.\n\n#### 1.4.2.1 Sigmoid activation function\n\nSigmoid\
    \ function is defined as\n\n(1.2)$\\\\begin{matrix} & {f(x) = \\\\frac{1}{1 +\
    \ e^{- x}}} \\\\\\\\ & {f^{\\\\prime}(x) = f(x)(1 - f(x))} \\\\\\\\ \\\\end{matrix}$\
    \ \n\nThe sigmoid function curve looks like an S-shape, as illustrated in [Figure\
    \ 1.11](#bodymatter-001.xhtml#b_9783110670905-001_fig_011). This function exists\
    \ between 0 and 1. We can find the slope of the sigmoid curve at any two points;\
    \ hence, it is differentiable.\n\n![Figure 1.11: Sigmoid activation function.](graphic/converted/b_9783110670905-001_fig_011.png)\n\
    \nFigure 1.11: Sigmoid activation function.\n\n#### 1.4.2.2 Hyperbolic tangent\
    \ activation function\n\nHyperbolic tangent function is defined as\n\n(1.3)$\\\
    \\begin{matrix} & {f(x) = \\\\tanh(x) = \\\\frac{2}{1 + e^{- 2x}} - 1} \\\\\\\\\
    \ & {f^{\\\\prime}(x) = 1 - f{(x)^{2}}} \\\\\\\\ \\\\end{matrix}$ \n\nAs shown\
    \ in [Figure 1.12](#bodymatter-001.xhtml#b_9783110670905-001_fig_012), “tanh”\
    \ function also looks like an S-shape. This function exists between −1 and 1.\
    \ It is differentiable too.\n\n![Figure 1.12: “tanh” activation function.](graphic/converted/b_9783110670905-001_fig_012.png)\n\
    \nFigure 1.12: “tanh” activation function.\n\n#### 1.4.2.3 ReLU activation function\n\
    \nAt present, ReLU is the furthermost used activation function. It is shown in\
    \ [Figure 1.13](#bodymatter-001.xhtml#b_9783110670905-001_fig_013) and defined\
    \ as\n\n*f*(*x*) = 0, *f**o**r* *x*< 0     *x*, *o**t**h**e**r**w**i**s**e* (1.4)*f*^′(*x*) = 0, *f**o**r* *x* < 0\
    \     1, *o**t**h**e**r**w**i**s**e* \n\nThis function exists between 0 and infinity.\
    \ It is differentiable too.\n\n![Figure 1.13: Rectified linear unit activation\
    \ function.](graphic/converted/b_9783110670905-001_fig_013.png)"
