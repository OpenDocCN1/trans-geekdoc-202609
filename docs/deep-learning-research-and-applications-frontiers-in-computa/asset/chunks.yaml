- raw: "The decoder is also a neural network having representation y as the input,\
    \ while the parameters to the probability distribution of the data is its output,\
    \ and has weights and biases *ϕ*. The decoder has been denoted by *pϕ*(*s*|*y*).\
    \ On execution with the handwritten digit as example, let us assume that the images\
    \ are black and white and representation of each pixel is in the form of 0 or\
    \ 1 ([Figure 5.3](#bodymatter-005.xhtml#b_9783110670905-005_fig_003)).\n\n![Figure\
    \ 5.3: Illustration of the cited example.](graphic/converted/b_9783110670905-005_fig_003.png)\n\
    \nFigure 5.3: Illustration of the cited example.\n\nThe probability distribution\
    \ of a single pixel can be represented using a Bernoulli distribution. The latent\
    \ representation of a digit y is given as input to the decoder and the output,\
    \ thus, obtained is 225 Bernoulli parameters, one for each of the 225 pixels in\
    \ the image. Decoding the real-valued numbers in y into 225 real-valued numbers\
    \ between 0 and 1 is done by the decoder. There is the occurrence of loss of information\
    \ as it goes from a smaller to a larger dimensionality \\[[17](#bodymatter-005.xhtml#b_9783110670905-005_ref_017)\\\
    ].\n\nThe requirements of VAE are as follows:\n\n1.  It is essential to use two\
    \ tractable distributions:\n\n    1.  The initial distribution *p*(*y*) must be\
    \ easy to be sampled from.\n\n    2.  The conditional likelihood *p*(*s*|*y*,*θ*)\
    \ should be computable.\n\n2.  In practice, this implies that the two distributions\
    \ are seldom complex, for example, uniform, Gaussian, or even isotropic Gaussian.\n\
    \nOnce the image is encoded and decoded in the VAE, it involves reconstruction\
    \ of the images. For extraction of similar characteristics/features, clustering\
    \ needs to be performed.\n\nHierarchical clustering is a statistical cluster analysis\
    \ process which involves building of clusters in a hierarchical form. Here, splitting\
    \ and merging are determined in a greedy manner. After hierarchical clustering\
    \ the results thus obtained are represented in a dendrogram. In case a set of\
    \ *M* items with an *M* × *M* distance (or similarity) matrix needs to be clustered,\
    \ then the following needs to be performed for the process of hierarchical clustering:\n\
    \n1.  First, each M item is assigned to its own cluster; that is, in case of M\
    \ items there would be M clusters formed, each containing single item. Let us\
    \ assume, that the distances (with similarities) between the clusters is equivalent\
    \ to the distances (similarities) between the items they have.\n\n2.  Next, the\
    \ closest (most similar) pair of clusters needs to be calculated and merged into\
    \ a single cluster, so that there is a decrease in the number of clusters by 1.\n\
    \n3.  Next, the distances (similarities) between the newly formed clusters and\
    \ each of the old clusters need to be calculated.\n\n4.  Steps 2 and 3 are repeated\
    \ until all items are clustered into a single cluster of size M.\n\nThe uniqueness\
    \ between VAE and a standard autoencoder is that they have continuous latent spacesallowing\
    \ easy random sampling and interpolation. This property makes them effective generative\
    \ models. This avoids producing unrealistic output due to discontinuous latent\
    \ space.\n\n## 5.3 Proposed work and methodology\n\nThe chapter purports to thoroughly\
    \ study the handwritings that have been taken from children suffering from dysgraphia.\
    \ With the help of deep learning as the technical tool, a number of characteristics\
    \ or patterns uniquely present in the samples collected were deduced. These distinguishable\
    \ characteristics are further recognized as symptoms of dysgraphia in the field\
    \ of medicine. Hence, dysgraphia can be detected at an early stage, which would\
    \ in turn be helpful in taking up remedial measures like therapeutic care.\n\n\
    The very initial step of this study was collection of handwriting of children\
    \ suffering from dysgraphia and then those collected documents were scanned to\
    \ proceed further. The assumptions taken into consideration are:\n\n*   Scanning\
    \ has been performed perfectly, hence the introduced skew is the responsibility\
    \ of the writer\n\n*   Salt and pepper noise \\[[18](#bodymatter-005.xhtml#b_9783110670905-005_ref_018),\
    \ [19](#bodymatter-005.xhtml#b_9783110670905-005_ref_019)\\] and background noise\
    \ \\[[18](#bodymatter-005.xhtml#b_9783110670905-005_ref_018), [19](#bodymatter-005.xhtml#b_9783110670905-005_ref_019)\\\
    ]might be present, which may have been caused before or after the scanning process\n\
    \nThe steps of the proposed work are as follows:\n\n### 5.3.1 Preprocessing\n\n\
    To maximize the efficiency of processing and to reduce complicacy in the terminal\
    \ stages of the code, image preprocessing \\[[20](#bodymatter-005.xhtml#b_9783110670905-005_ref_020),\
    \ [21](#bodymatter-005.xhtml#b_9783110670905-005_ref_021)\\] is done to obtain\
    \ image of better quality. Preprocessing steps performed for handwriting analysis\
    \ includes binarization \\[[22](#bodymatter-005.xhtml#b_9783110670905-005_ref_022),\
    \ [23](#bodymatter-005.xhtml#b_9783110670905-005_ref_023)\\] and noise removal.\
    \ Median filter technique \\[[24](#bodymatter-005.xhtml#b_9783110670905-005_ref_024)\\\
    ] is adopted for salt and pepper noise removal \\[[18](#bodymatter-005.xhtml#b_9783110670905-005_ref_018),\
    \ [19](#bodymatter-005.xhtml#b_9783110670905-005_ref_019), [24](#bodymatter-005.xhtml#b_9783110670905-005_ref_024),\
    \ [25](#bodymatter-005.xhtml#b_9783110670905-005_ref_025), [26](#bodymatter-005.xhtml#b_9783110670905-005_ref_026)\\\
    ] while image binarization is done using Otsu’s \\[[22](#bodymatter-005.xhtml#b_9783110670905-005_ref_022)\\\
    ] thresholding technique. In binarization, binary image is obtained from grayscale\
    \ image.\n\n### 5.3.2 Line segmentation\n\nThe binary image obtained is used for\
    \ line segmentation. The present work implements conversion of image into grayscale\
    \ which is then binarized inversely, resulting in a dark background with the text\
    \ in a light shade. Resultant image is dilated and **findContours()** function\
    \ of OpenCV library is used to find the contours. Each of the contours found is\
    \ stored as a vector of points. Function RETR\\_EXTERNAL returns only the extreme\
    \ outer contours, which is the implemented mode of retrieval. In CHAIN\\_APPROX\\\
    _SIMPLE function, the horizontal, vertical, and diagonal segments are compressed\
    \ and reduced to their end points only, as done in the adopted approximation method.\
    \ For example, an upright triangular contour is encoded with 3 points.\n\n**Algorithm\
    \ for line segmentation**\n\nSTEP 1:\n\n: \n\nLoad the sample writings as images.\n\
    \nSTEP 2:\n\n: \n\nConvert image into grayscale.\n\nSTEP 3:\n\n: \n\nConvert the\
    \ grayscale image into binary image using proper threshold and invert the image.\n\
    \nSTEP 4:\n\n: \n\nDilate the binary image using kernel of 5 × 150 matrix of ones.\n\
    \nSTEP 5:\n\n: \n\nFind contours from the diluted image and consider only the\
    \ extreme outer flags.\n\nSTEP 6:\n\n: \n\nExtract the desired region of the image\
    \ using those contours and save them as images which are basically lines in the\
    \ writings.\n\n### 5.3.3 Word segmentation\n\nWord segmentation is performed by\
    \ applying the abovementioned method on the segmented lines and the characters\
    \ are thereby segmented using each individual word.\n\n**Algorithm for word segmentation**\n\
    \nSTEP 1:\n\n: \n\nLoad the sample lines as images.\n\nSTEP 2:\n\n: \n\nConvert\
    \ image into grayscale.\n\nSTEP 3:\n\n: \n\nConvert the grayscale image into binary\
    \ image using proper threshold and invert the image.\n\nSTEP 4:\n\n: \n\nDilate\
    \ the binary image using kernel of 5 x 35 matrix of ones.\n\nSTEP 5:\n\n: \n\n\
    Find contours from the diluted image and consider only the extreme outer flags.\n\
    \nSTEP 6:\n\n: \n\nExtract the desired region of the image using those contours\
    \ and save them as images which are basically words in the line.\n\n### 5.3.4 Character\
    \ segmentation\n\nThe characters are thereby segmented using each individual word\
    \ using the same method as that of line segmentation.\n\n**Algorithm for character\
    \ segmentation**\n\nSTEP 1:\n\n: \n\nLoad the sample words as images.\n\nSTEP\
    \ 2:\n\n: \n\nResize the contour containing the word using bicubic interpolation\
    \ over 4 × 4 pixel neighborhoods.\n\nSTEP 3:"
