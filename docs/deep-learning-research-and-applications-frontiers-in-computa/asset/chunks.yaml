    | 8 || 1.32 || 1.48 || 1.23 || 1.23 |

    | Theil’s `U` statistic || 6 || 0.025 || 0.026 || 0.023 || 0.023 |

    | 7 || 0.024 || 0.024 || 0.022 || 0.022 |

