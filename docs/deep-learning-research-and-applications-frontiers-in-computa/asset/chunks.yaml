    \ BLSTMs 的训练和框架，BLSTMs 也考虑未来上下文，如前所述所必需。方程式 (6.26) 和 (6.27) 显示了 `h^←` 和 `h^→`\
    \ 的计算，分别表示后向和前向序列。\n\n```\n(6.26) h[t]^→ = Ƕ(W[xh^→]x[t] + W[h^→h^→]h[t-1]^→ +\
    \ b[h^→])\n(6.27) h[t]^← = Ƕ(W[xh^←]x[t] + W[h^←h^←]h[t-1]^← + b[h^←])\n(6.28)\
