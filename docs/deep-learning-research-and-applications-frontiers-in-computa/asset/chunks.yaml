  trans: "\n\n作物的质量和产量始终对那些大部分人口依赖农业的国家至关重要。随着模型变得越来越复杂，过拟合现象变得越来越普遍。过拟合是指模型在测试数据上表现良好，但无法推广到测试数据的情况。如果保持其他条件不变，模型复杂度越高，过拟合越严重。虽然\
    \ `L1`/`L2` 正则化已被广泛使用，但下面介绍了另外两种正在使用的技术：\n\n1. Dropout：Dropout `[16]` 是一种正则化技术，其中网络连接以一定概率\
    \ `p` 被丢弃。这确保了网络不会过度依赖这些连接。\n\n2. Batch normalization：批归一化 `[17]` 的工作原理是先计算网络中隐藏层在批次上的激活值的均值和标准差。然后，通过从批次激活值中减去均值并除以计算出的标准差来对批次激活值进行归一化。在这些层中引入了两个新参数\
    \ `γ` 和 `β`。这些参数用于对归一化后的激活值 `x̂` 进行缩放和平移：\n\n    (4.7) `y = x̂γ + β`\n\n3. 这也对网络产生了一定的正则化效果。\n\
    \n### 4.7.2 迁移学习\n\n深度学习的成功部分归功于大型数据集和大量计算能力的可用性。VGG `[18]` 等深度神经架构如果没有大型数据集进行训练，则毫无用处。然而，在数据收集困难或昂贵的领域，大型数据集通常不可用。迁移学习使得深度学习能够在小数据集上工作。其假设是，深度学习模型在训练任务时会隐式地学习提取可重用特征。当两个领域相似时，在一个领域的数据集上训练的模型可以通过微调用于另一个领域。常见的迁移学习方法首先在像\
    \ ImageNet `[19]` 这样的大型数据集上训练一个模型（通常是深度 CNN）。这使得 CNN 能够学习提取许多面向图像任务共有特征的滤波器。然后，将网络的最后一个全连接层替换为另一个全连接层，其输出神经元数量等于目标数据集中的类别数量。随后，在目标数据集上重新训练网络。在重新训练阶段，被训练的层数可以不同。可以选择只训练最后一层，并将网络的其余部分用作特征提取器。整个网络也可以重新训练。在过去十年中，迁移学习取得了一些令人印象深刻的结果。\n\
    \n## 4.8 深度学习框架\n\n随着许多深度学习框架的兴起，深度学习研究变得更加容易。网络设计师不需要显式指定如何计算梯度，这些框架会自动为他们完成这项任务。这里介绍的大多数框架都是开源的。此外，其中大多数依赖于\
    \ CUDA `[20]` 进行 GPU 处理。所有这些框架都使用某种形式的自动微分。下面简要介绍了一些流行的深度学习框架：\n\n1. Theano：Theano\
    \ `[21]` 是一个开源项目，由蒙特利尔学习算法研究所开发。它从 2008 年一直处于活跃开发状态，直到 2017 年发布最终版本 1.0.0。本质上，该库允许在\
    \ GPU 和 CPU 上定义和执行数学表达式。与这里介绍的大多数其他库一样，它是用 C++ 实现的。它提供了一个与 Python 中流行的线性代数框架 NumPy\
    \ 类似的 API。\n\n2. Tensorflow：Tensorflow `[22]` 的设计考虑了机器学习模型的部署。它内置了支持将工作负载分布到多个计算节点。在\
    \ Tensorflow 中，必须先定义并编译计算图。之后，可以输入数据并执行图。\n\n3. Keras：Keras `[23]` 是为了更容易地进行深度学习模型实验而构建的。它内置了多种深度学习架构。它提供了比\
    \ Tensorflow 或 Theano 等框架更高层次的抽象。Keras 只是一个包装器，实际计算委托给底层计算库。用户可以选择 Theano 或 Tensorflow\
    \ 作为后端。\n\n4. PyTorch：PyTorch `[24]` 是一个相对较新的框架，由 Facebook AI 研究开发。它与 Keras 相似，旨在易于进行实验。与\
    \ Tensorflow 不同，PyTorch 不要求用户在执行前先编译计算图。虽然 PyTorch 不是为部署到生产环境而开发的，但最近的版本添加了功能，使\
    \ PyTorch 模型更适合生产。这些新增功能以即时编译（JIT）编译器的形式出现，允许在执行前编译和优化计算图，就像 Tensorflow 一样。PyTorch\
    \ 的另一个重要特性是它允许以面向对象的方式定义神经网络。\n\n5. Others：在过去几年中，开发了许多其他深度学习框架。计算网络工具包 `[25]`\
    \ 由微软开发。其他一些值得注意的框架是 MXNet `[26 27]`。\n\n## 4.9 深度学习的工程应用\n\n深度学习技术在一系列工程应用中的成功已有详细记录。DNNs\
    \ 正在为自然语言处理、语音识别、目标检测等领域量身定制。在本节中，我们介绍了一些因深度学习而取得进展的有趣工程应用。\n\n在从真彩色图像中找到最优聚类数量方面仍有研究空间，未来量子启发算法将为在短时间内高效解决多目标优化问题打开大门。\n\
    \n"
