    # 2 卷积神经网络：自底向上的方法


    Karan Maheshwari 维洛尔理工学院计算机科学与工程学院，维洛尔，印度。Aditya Shaha 维洛尔理工学院计算机科学与工程学院，维洛尔，印度。Dhruv
    Arya 维洛尔理工学院计算机科学与工程学院，维洛尔，印度。Rajkumar Rajasekaran 维洛尔理工学院计算机科学与工程学院，维洛尔，印度。B.
    K. Tripathy 维洛尔理工学院信息技术与工程学院，维洛尔，印度。


    #### 摘要


    自所谓的深度学习（DL）时代开启以来，世界发生了许多变化。与传统机器学习算法不同，在传统算法中，人类更多地进行特征提取，而机器仅仅进行数字计算；DL 算法非常有前景，因为它们彻底改变了我们处理数据的方式，并且已能够做出类似人类的决策。基于人工神经网络的强大概念，这些学习算法学习表示数据，或者换句话说，可以从原始数据中提取特征。DL
    为端到端系统铺平了道路，其中一个学习算法完成所有任务。卷积神经网络近年来声名鹊起，尤其是在计算机视觉领域，在某些情况下其性能已超越人类。已经对 convNets
    进行了大量工作，在本章中，我们将揭示卷积神经网络的工作原理，并将使用天文学领域的一个新颖应用进行说明，即使用原始图像作为输入进行星系分类，并根据其形状对其进行分类。此外，我们还将调查网络正在学习哪些特征。我们还将讨论
    DL 如何取代其他形式的学习，以及一些围绕卷积神经网络的最新算法创新。


    关键词：深度学习（DL），卷积神经网络，星系分类，人工神经网络，反卷积，


