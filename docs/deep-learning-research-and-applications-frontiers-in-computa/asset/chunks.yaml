    \ the number of filterbanks taken is equal to say *b* such that 20 ≤ *b* ≤ 40,\
    \ we get *b* numbers that denote the energy constituent in each filter. Next step\
    \ in line is to perform the logarithm of the numbers obtained. This is done to\
    \ imitate the fact that human beings do not perceive loudness on a linear scale.\
    \ Variations in sound is not very evident when the sound is too loud. At this\
    \ stage, the numbers obtained are highly correlated. Consequently, dimensionality\
    \ reduction can be considered to make further computations faster and easier.\
    \ Hence, discrete cosine transform (DCT) is applied to the log filterbanks. This\
    \ retains nearly half the coefficients, eliminating the higher valued ones which\
    \ result in improved performance. These coefficients are known as **MFCCs**. They\
    \ are commonly known as *acoustic feature vectors*. The most common representation\
    \ of a DCT is given in eq. (6.7).\n\n(6.7)$X\\_{k} = \\\\sum\\\\limits\\_{n =\
