    # RNNs and Generative Models


    Let the input sequence of length `T` be represented by `X` = {`x1`, `x2`, … ,
    `xt`, … , `xT`}. A general RNN is represented by the following equation:


    (4.3) `s[t] = F(s[t − 1], x[t], θ)`


    Here `s[t]` is the internal state of the RNN at time `t` and `θ` is the set of
    weights of the RNN. A more specific representation is given by


    (4.4) `s[t] = W[rec]σ(s[t − 1]) + W[in]x[t] + b`


    where `σ` is a nonlinear function that operates elementwise over the input. The
    parameter `θ` from the general case is made up of the weight matrices `W[rec]`,
    `W[in]`, and the bias `b`. Generally, `s[0]` is initialized to zeros. It is clear
    from the equation how the current state is dependent on both the current input
    `x[t]` and the state from the previous time-step `s[t][−1]`. The amount by which
    these two influence the current state is directly dependent on the weights `W[in]`
    and `W[rec]` respectively.


    While RNNs worked well, it was shown in `[[2](#bodymatter-004.xhtml#b_9783110670905-004_ref_002)]`
    that they did not capture long-term dependencies well. Furthermore, RNNs are tricky
    to train. They are also trained using backpropagation. In their case, we backpropagate
    the gradients over the sequence, thus we call it backpropagation through time.
    The gradients are computed by unrolling the network into a multilayered network.
    They suffer from the exploding and vanishing gradients problems where the gradient
    either becomes too large or too small for the initial layers in the unrolled network.
    The exploding gradients problem can be dealt with by clipping the gradients which
    go over a certain threshold `[[3](#bodymatter-004.xhtml#b_9783110670905-004_ref_003)]`.
    However, vanishing gradients are more difficult to deal with. This is mainly because
    the gradients for short-term dependencies are high while only the gradients for
    long-term dependencies are low. This is the reason that classic RNNs cannot model
    long-term dependencies. A variant of RNNs called long short-term dependency networks
    were introduced in `[[4](#bodymatter-004.xhtml#b_9783110670905-004_ref_004)]`.
    This variant worked by explicitly adding operations to allow hidden state modification,
    retention, and deletion. This makes it particularly suitable for handling long-term
    dependencies, thus resolving the vanishing gradients problem.


    Traditionally, n-gram models have been used for text processing. Hidden Markov
    models (HMMs) have been used for the same. However, HMMs work on an underlying
    assumption that text sequences can be modeled as Markov models, that is, the next
    state that we can land is only dependent on the previous state. In most applications,
    an `n`-gram is taken as one state. However, this model fails to capture long-term
    dependencies in texts. Furthermore, HMMs become computationally difficult to solve
    as the number of hidden states increase. RNNs are more general than HMMs and their
    variants, LSTMs, can capture long-term dependencies. This has made them the go-to
    model for tasks such as text classification.


    ## 4.4 Generative adversarial networks


    Generative models, in general, learn the underlying probability distribution of
    the task. Generation is simply the sampling of data points from the learned distribution.
    Suppose that the underlying probability distribution of some data `D` is `p[D]`,
    the task of a generative model `M` is to estimate this distribution in the form
    of `p[M]`.


    One recently introduced generative model is the generative adversarial network
    (GAN) `[[5](#bodymatter-004.xhtml#b_9783110670905-004_ref_005)]`. The model works
    by using two competing neural networks, the generator, `G`, and the discriminator,
    `D`. The generator tries to model the probability distribution of the training
    data `p[D]` as `p[G]` while the discriminator learns to distinguish between samples
    generated by the generator and samples from the training data. Both the networks
    are initialized randomly and perform very poorly at their respective tasks in
    the beginning. Both networks become better at their tasks over time, however,
    as the modeled distribution `p[G]` becomes very similar to `p[D]`, the discriminator
    starts randomly predicting genuine or fake with equal probability. This analogous
    to an amateur painter learning to imitate the painter Van Gogh while another person
    simultaneously learns to spot fake Van Goghs. When the amateur painter becomes
    as good as Van Gogh, the other person will not have any criteria to distinguish
    these paintings.


    Formally, the generator is a differentiable function `G` and the discriminator
    is a differentiable function `D`. Let `z` be some noise sampled from probability
    distribution `p[z]` and `p[D]` is the probability distribution of the training
    data. The generator and discriminator minimax game can be represented by the following
    equation:


    (4.5) `min_G max_D V(D,G) = E_{x ~ PD}(x)[log D(x)] + E_{x ~ p_(x)}[log(1 - D(G(z)))]`


    Radford et al. `[[6](#bodymatter-004.xhtml#b_9783110670905-004_ref_006)]` have
    shown how CNNs can be used as the generator and discriminator functions. They
    removed all pooling layers and used transposed convolution for upsampling in the
    generator. This resulted in impressive results in generative tasks related to
    images. The use of CNNs has become very common in the last few years in GAN research.


    GANs suffer from mode collapse. The loss function that we used earlier does not
    ensure that the GAN is able to generate a variety of samples. It might learn to
    generate a few samples that satisfy its loss function in that it beats the discriminator.
    This is highly undesirable. GANs are very tricky to train in other ways too. Sometimes
    they fail to converge and the model parameters keep on oscillating. If the discriminator
    becomes too good at its job, the gradient for the generator diminishes and it
    stops learning. It is essential to balance the number of times the discriminator
    is trained for each iteration of training the generator. Wasserstein GANs, introduced
    in `[[7](#bodymatter-004.xhtml#b_9783110670905-004_ref_007)]`, managed to overcome
    some of these problems by using a different loss function. Conditional GAN, introduced
    in `[[8](#bodymatter-004.xhtml#b_9783110670905-004_ref_008)]`, use the data class
    information in the discriminator. This allows them to capture better multimodal
    data representations. Zhu et al. introduced Cycle GANs in `[[9](#bodymatter-004.xhtml#b_9783110670905-004_ref_009)]`
    which allow mapping from one image domain to another even when no paired datasets
    exist for those domains. For example, this allows us to convert the image of a
    red car to that of a blue car even when we do not have an image of that particular
    car model in blue. A thorough overview of GANs can be found in `[[10](#bodymatter-004.xhtml#b_9783110670905-004_ref_010)]`.


    ## 4.5 Variational autoencoders


    Variational autoencoders (VAEs) `[[11](#bodymatter-004.xhtml#b_9783110670905-004_ref_011)]`
    are another type of a generative model. Autoencoders are networks where we have
    an encoder–decoder structure. The encoder takes a data point and maps it to a
    smaller vector which is called the latent representation of the data. Then, a
    decoder takes this smaller vector and maps tries to map it back to the original
    data point. Both the encoder and the decoder are trained together by minimizing
    the mean squared error between the original input and the output of the decoder.
    The encoder learns to compress that data and the decoder learns to decompress
    it.

    '
