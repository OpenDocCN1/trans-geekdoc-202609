    Audio signal processing and its classification dates back to the past century.
    From speech recognition to speaker recognition and from speech to text conversion
    to music generation, a lot of advances has been made in this field using algorithms
    such as hidden Markov models, recurrent neural networks with long short-term memory
    layers (LSTM), deep convolutional neural networks (DCNNs), and the recent state-of-the-art
    model for music and speech generation using WaveNets. These algorithms are applied
    after the audio signals are processed and effective feature extraction techniques
    are applied on them. Nowadays, devices come up with personal assistants with which
    they can interact either through text inputs or voice inputs. Most applications
    have also come up with voice search features, while some can generate transcripts
    from videos and recognize the song title when played. The constant urge for attaining
    perfection has also led to hybrid models combining supervised and unsupervised
    learning techniques for better feature extraction. The ability to deal with spectral
    and temporal data makes DCNNs different from deep neural networks and also makes
    it the appropriate choice to deal with speech data because correlation between
    words and phonemes are a characteristic of such data. The potentials of convolution
    neural networks are huge and being extended in areas like environmental sound
    classification, music and instrumental sound processing and classification, and
    large vocabulary continuous speech recognition. Therefore, this chapter gives
    detailed explanation about what an audio signal is and how it is processed. It
    will also cover the various feature extraction techniques and the classification
    algorithms. Finally, the present-day applications and the potentials of deep learning
    in this field will be explored.


    Keywords: `audio signal`, `feature extraction`, `speech processing`, `deep learning`,
    `applications of audio signal processing`


    ## 6.1 Introduction


    Language is one of the most important inventions of mankind without which communication
    would not have been possible. Speech using any language is the most effective
    and fast mode of communication because no other method can convey the accurate
    emotions along with the information, parallelly. Computers have been competing
    with humans in all aspects, be it processing speed or accuracy. The revolution
    brought about by artificial intelligence allows computers to think rationally
    and act by keeping a balance between rational and human behavior. To fulfil this
    aim, a computer needs to be equipped with the senses that a human is gifted with
    – vision, hearing, taste, smell, and touch. Vision has already been incorporated
    in computers as what is popularly known to be computer vision \[[1](#bodymatter-006.xhtml#b_9783110670905-006_ref_001)\].
    To allow taste, artificial tongues are being created \[[2](#bodymatter-006.xhtml#b_9783110670905-006_ref_002)\]
    and certain kind of sensors can detect the presence of gas which can indicate
    the smell. For touch, scientists have already developed artificial skin \[[3](#bodymatter-006.xhtml#b_9783110670905-006_ref_003)\],
    which leaves us with the question of what has been done to give computers the
    ability to hear and speak like humans. Thus, we arrive at the discussion of processing
    audio signals to enable the computers to understand audio data and respond like
    humans do. The context of audio is not restricted to just speech, it could be
    birds chirping, the sound of rain, the grunting of an engine, a baby crying, music
    from a flute, or any of the more limitless possibilities. The applications of
    identifying what kind of audio was processed holds good in multiple arenas like
    chatbots \[[4](#bodymatter-006.xhtml#b_9783110670905-006_ref_004)\], surveillance,
    environmental sound classification \[[5](#bodymatter-006.xhtml#b_9783110670905-006_ref_005)\](which
    could help detect the kind of scene from the last phone call of a victim), classification
    of musical instruments \[[6](#bodymatter-006.xhtml#b_9783110670905-006_ref_006)\]
    or musical genres \[[7](#bodymatter-006.xhtml#b_9783110670905-006_ref_007)\],
    speech to text converters (STT), \[[8](#bodymatter-006.xhtml#b_9783110670905-006_ref_008)\]
    and the like. Learning to process audio data also implants the ability to generate
    music for people who cannot play instruments or generate speech for people who
    have difficulty in speaking (text to speech converters) \[[9](#bodymatter-006.xhtml#b_9783110670905-006_ref_009)\].
    The learning is accomplished in two major steps: signal processing for feature
    extraction and classification. The best features for classification happen to
    be the Mel frequency cepstral coefficients (MFCCs) \[[10](#bodymatter-006.xhtml#b_9783110670905-006_ref_010)\],
    and the classification algorithms used has improved over time from hidden Markov
    models (HMMs) to deep convolutional neural networks (DCNNs). The earliest used
    model was HMM \[[11](#bodymatter-006.xhtml#b_9783110670905-006_ref_011)\] but
    it had limitations \[[12](#bodymatter-006.xhtml#b_9783110670905-006_ref_012)\],
    the most striking of which was the assumption which states that the probability
    of being in a given state at time *t* only depends on the state at time *t*–1.
    This was taken care by using long short-term memory layers (LSTMs) in conjunction
    with recurrent neural networks (RNNs) \[[13](#bodymatter-006.xhtml#b_9783110670905-006_ref_013)\]and
    also restricted Boltzman machines (RBMs) were used for the same purpose \[[14](#bodymatter-006.xhtml#b_9783110670905-006_ref_014)\]
    but DCNNs \[[5](#bodymatter-006.xhtml#b_9783110670905-006_ref_005)\] proved to
    give best results. While all these techniques served for classification, the best
    model for generation of speech or music proved to be WaveNets. With the help of
    these models, applications such as voice search, transcript generation, song search
    (Shazm, tells which song is being played by recognizing the audio), dictation,
    and personal assistants or audio books are made. With more and more data being
    available in corpuses in written or audio form, language recognition and real
    time translation over video chats are being made possible. Combining labelled
    video and audio classification in the training data can make annotations for sound
    in videos possible (helpful for deaf people). Detecting emotions from speech and
    context recognition are complex problems which can be solved by the combined use
    of both audio data classification and natural language processing (NLP).


    ## 6.2 Audio signal processing and its importance

