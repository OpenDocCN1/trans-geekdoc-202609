    # Introduction to Developmental Dysgraphia


    According to prior studies, it is believed that the presence of dysgraphia is
    common among children with average IQ level and is also found among those who
    have not been diagnosed with any neurological or perceptual motor disorders.


    The risk of developmental dysgraphia in children with neurodevelopmental disabilities
    is very high \[[9](#bodymatter-005.xhtml#b_9783110670905-005_ref_009)\]. In school-going
    children the risk is comparatively low and the percentage lies between 10 and
    30 \[[8](#bodymatter-005.xhtml#b_9783110670905-005_ref_008)\]. It is clinically
    proved that handwriting difficulty is capable of making serious impact on an individual’s
    overall academic performance, psychology, and behavior \[[10](#bodymatter-005.xhtml#b_9783110670905-005_ref_010)\].
    Thus, it is important to detect developmental dysgraphia at the earliest, to prevent
    uncontrollable and undesired manifestation in the adult life \[[11](#bodymatter-005.xhtml#b_9783110670905-005_ref_011)\].


    Scientific studies substantiate the utility of an automated system for recognizing
    the handwriting process and proceed with assessing the same to distinguish handwriting
    features of children suffering from dysgraphia \[[8](#bodymatter-005.xhtml#b_9783110670905-005_ref_008),
    [12](#bodymatter-005.xhtml#b_9783110670905-005_ref_012), [13](#bodymatter-005.xhtml#b_9783110670905-005_ref_013),
    [14](#bodymatter-005.xhtml#b_9783110670905-005_ref_014)\]. However, as perceived,
    concepts of deep learning will throw more light on the aspects of features and
    would be more effective to diagnose and identify handwriting defects among patients
    of dysgraphia.


    Previously, a system of automatic rating of dysgraphia based on HPSQ total score
    estimation was developed using the concept of machine learning which implemented
    handwriting parameterization techniques and intrawriter normalization approach.


    # Variational Autoencoder (VAE)


    For the first time, in this chapter, VAE, a deep learning technique to compress
    data, is used to identify common handwriting features in dysgraphia patients.
    Deep learning is a subset of unsupervised learning, also termed as hierarchical
    learning which has created huge impact on the field of machine learning \[[15](#bodymatter-005.xhtml#b_9783110670905-005_ref_015)\].
    AE typically comprises dense, fully connected layers of a feedforward neural network;
    it consists of an encoder network and a decoder network. The encoder is compared
    to a convolution neural network (CNN). The input is processed using several hidden
    layers “h” inside an autoencoder. The input is encoded into a much smaller representation
    as an output. The output received from the particular layer consists of sufficient
    suitable information to be processed in the next layer of the network to produce
    necessary output format. It simultaneously assimilates an inference model to deduce
    the latent features of image data and comprehends a generative model for generating
    images from those deduced latent features. The input image is encoded and decoded
    by VAE. Following this, clustering is implemented which may lead to loss of information.
    The similarities and dissimilarities among the various characters contained in
    the dataset are depicted as the output of clustering of characters. Identification
    of handwritings manually is comparatively easier than of identification done by
    machines since handwriting varies from individual to individual.


    VAE is considered as a neural network which can encrypt image into a direction
    in the latent space of `z` real numbers. For the sample that has been collected
    from a `z`-dimensional normal distribution, the direction is assumed to be arbitrary.
    Then, the decoder network decodes the encoded vector representation and obtains
    the original image. Random samples can be drawn from the distribution and fetch
    them into decoder network for which the latent space is `z`-dimensional normal
    distribution. From this new images can be obtained that are absent in the dataset
    we trained on. The architecture of the encoder is represented in [Figure 5.1](#bodymatter-005.xhtml#b_9783110670905-005_fig_001).


    ![Figure 5.1: The simplest form of representation of the encoder architecture.](graphic/converted/b_9783110670905-005_fig_001.png)


    Figure 5.1: The simplest form of representation of the encoder architecture.


    The pivotal facet of the VAE lies in the fact that its latent representation,
    `y` ∈ℙ^K is derived from a particular Gaussian distribution (i.e., `p(y) = N(y|
    μ, Σ)`, where `μ` denotes mean and `Σ` denotes covariance). The VAE is trained
    in an unsupervised manner as the output is basically the reconstructed version
    of the input. Let us consider the given set of training data is `S = {s[n]}[n][=1]^N`,
    the VAE comprises of a probabilistic encoder `qθ(y|s)`, that finds the latent
    representation `y` for the given set of input data `s`. It also consists of a
    probabilistic decoder `pϕ(s|y)` which reconstructs the input data for the specific
    latent representation, where `θ` represents the network parameter for encoder
    and `ϕ` represents the network parameter for decoder.


    Optimization of the variational bound `L[VAE](θ, ⌀)` with respect to the parameters
    `θ` and `ϕ` in the encoder and decoder occurs learning VAE.


    (5.1)

    ```

    L_VAE(θ, ∅) = ∑_{n-1}^{n} - E_y ~ qθ(y|s_n)[log p∅(s_n|y) + KL(qθ(y|s_n)||p(y))]

    ```


    Here, the first term is the reconstruction error that has been computed by taking
    the expectation with respect to the distribution of `y` while the second term
    denotes regularizer which is the Kullback–Leibler (KL) divergence between the
    estimated distribution `qθ(y|s[n])` and the true distribution `p(y)`. This divergence
    is the measurement of the amount of information lost while using `q` to represent
    `p`. The estimation of parameters can be done using an autoencoding variational
    Bayes algorithm \[[16](#bodymatter-005.xhtml#b_9783110670905-005_ref_016)\].


    The pictorial representation of an encoder and decoder is given in [Figure 5.2(a)](#bodymatter-005.xhtml#b_9783110670905-005_fig_002)
    and [(b)](#bodymatter-005.xhtml#b_9783110670905-005_fig_002), respectively.


    ![Figure 5.2: (a) The encoder is used to compress data into latent space (y).
    (b) The decoder is used for reconstruction of given data which is a hidden representation.](graphic/converted/b_9783110670905-005_fig_002.png)


    Figure 5.2: (a) The encoder is used to compress data into latent space (`y`).
    (b) The decoder is used for reconstruction of given data which is a hidden representation.


    The encoder is said to be a neural network whose input is a data point `s` while
    output is a hidden representation `y`, having weights and biases `θ`. Specifically
    saying, let us consider `y` to be a 15 by 15 pixel photo of a handwritten digit.
    The encoder “encodes” the data which is 225-dimensional into a latent (hidden)
    representation space `y`, which is much less than 225 dimensions. This is conventionally
    termed to be a “bottleneck” because the encoder must be capable of efficient compression
    of the data into this lower-dimensional space.


    From [Figure 5.2](#bodymatter-005.xhtml#b_9783110670905-005_fig_002), we can consider
    or assume the encoder to be denoted as `qθ(y|s)`. We know that the lower-dimensional
    space is arbitrary: the parameters to `qθ(y|s)`, which is a Gaussian probability
    density, is the output of the encoder. Sampling of this distribution can be done
    to obtain the noisy values of the representations `y`.

    '
  trans: '


    # 发育性书写障碍简介


    根据先前的研究，认为书写障碍在智商水平平均的儿童中很常见，并且也出现在未被诊断出任何神经系统或知觉运动障碍的儿童中。


    患有神经发育障碍的儿童患发育性书写障碍的风险非常高 \[9\]。在学龄儿童中，风险相对较低，百分比在 10% 到 30% 之间 \[8\]。临床已证实，书写困难会对个人的整体学业表现、心理和行为产生严重影响
    \[10\]。因此，尽早发现发育性书写障碍非常重要，以防止成年后出现不可控制和不希望的表现 \[11\]。


    科学研究证实，自动化系统在识别书写过程并对其进行评估，以区分患有书写障碍儿童的书写特征方面具有实用性 \[8, 12, 13, 14\]。然而，正如所认为的那样，深度学习的概念将对特征方面提供更多启示，并对诊断和识别书写障碍患者的书写缺陷更为有效。


    此前，基于 HPSQ 总分估计的书写障碍自动评分系统已使用机器学习概念开发，该系统实现了书写参数化技术和同书写者归一化方法。


    # 变分自编码器 (VAE)


    首次，在本章中，VAE（一种用于压缩数据的深度学习技术）被用于识别书写障碍患者的常见书写特征。深度学习是无监督学习的一个子集，也称为分层学习，对机器学习领域产生了巨大影响
    \[15\]。AE 通常由前馈神经网络的密集、完全连接层组成；它由编码器网络和解码器网络组成。编码器被比作卷积神经网络 (CNN)。输入在自编码器内部的几个隐藏层“h”中进行处理。输入被编码为更小的表示作为输出。从特定层接收到的输出包含足够合适的信息，以便在网络的下一层中处理以产生所需的输出格式。它同时同化一个推断模型来推断图像数据的隐式特征，并理解一个生成模型，用于从这些推断的隐式特征生成图像。输入图像由
    VAE 编码和解码。在此之后，实现聚类，这可能导致信息丢失。数据集中包含的各种字符之间的相似性和不相似性表现为字符聚类的输出。手动识别手写体比机器识别要容易得多，因为手写体因人而异。


    VAE 被认为是一种神经网络，可以将图像加密为 `z` 实数的潜在空间中的一个方向。对于从 `z` 维正态分布中收集的样本，该方向被假设为任意的。然后，解码器网络解码编码后的向量表示并获得原始图像。可以从分布中绘制随机样本并将其输入解码器网络，其中潜在空间是
    `z` 维正态分布。从此可以获得新图像，这些图像不存在于我们训练过的数据集中。编码器的架构在 Figure 5.1 中表示。


    ![Figure 5.1: The simplest form of representation of the encoder architecture.](img/b_9783110670905-005_fig_001.png)


    Figure 5.1: The simplest form of representation of the encoder architecture.


    VAE 的关键方面在于，其潜在表示 `y` ∈ℙ^K 源自特定的高斯分布（即，`p(y) = N(y| μ, Σ)`，其中 `μ` 表示均值，`Σ` 表示协方差）。VAE
    以无监督方式训练，因为输出基本上是输入的重建版本。让我们考虑给定的训练数据集为 `S = {s[n]}[n][=1]^N`，VAE 包含一个概率编码器 `qθ(y|s)`，用于为给定的输入数据集
    `s` 找到潜在表示 `y`。它还包含一个概率解码器 `pϕ(s|y)`，用于为特定的潜在表示重建输入数据，其中 `θ` 表示编码器的网络参数，`ϕ` 表示解码器的网络参数。


    优化编码器和解码器中参数 `θ` 和 `ϕ` 的变分下界 `LVAE` 发生在学习 VAE 时。


    (5.1)

    ```

    L_VAE(θ, ∅) = ∑_{n-1}^{n} - E_y ~ qθ(y|s_n)[log p∅(s_n|y) + KL(qθ(y|s_n)||p(y))]

    ```


    这里，第一项是重建误差，通过对 `y` 的分布取期望来计算，而第二项表示正则化项，即估计分布 `qθ(y|s[n])` 与真实分布 `p(y)` 之间的库尔贝克–莱布勒
    (KL) 散度。这种散度是使用 `q` 来表示 `p` 时丢失的信息量的度量。参数的估计可以使用自编码变分贝叶斯算法完成 \[16\]。


    编码器和解码器的图形表示分别在 Figure 5.2(a) 和 (b) 中给出。


    ![Figure 5.2: (a) The encoder is used to compress data into latent space (y).
    (b) The decoder is used for reconstruction of given data which is a hidden representation.](img/b_9783110670905-005_fig_002.png)


    Figure 5.2: (a) The encoder is used to compress data into latent space (`y`).
    (b) The decoder is used for reconstruction of given data which is a hidden representation.


    编码器被认为是一种神经网络，其输入是数据点 `s`，输出是隐藏表示 `y`，具有权重和偏差 `θ`。具体来说，让我们考虑 `y` 是一个手写数字的 15x15
    像素照片。编码器将 225 维的数据“编码”到潜在（隐藏）表示空间 `y` 中，该空间的维度远小于 225。这通常被称为“瓶颈”，因为编码器必须能够将数据高效压缩到这个低维空间中。


    从 Figure 5.2，我们可以考虑或假设编码器表示为 `qθ(y|s)`。我们知道，低维空间是任意的：`qθ(y|s)`（即高斯概率密度）的参数是编码器的输出。可以对该分布进行采样，以获取表示
    `y` 的噪声值。


    '
