    \ a few experiences to learn about a new entity. By looking at a banana once,\
    \ humans are able to recognize bananas in different shapes and sizes. Artificial\
    \ intelligence researchers have been trying to tackle such problems for decades\
    \ now. The increase in computational and storage capacity has allowed researchers\
    \ to come up with methods that deal with very high dimensional inputs. Deep learning\
    \ research has also been helped by the availability of high-quality datasets.\
    \ This chapter provides a brief overview of deep learning approaches. These have\
