- raw: 'These days even banks, hospitals, or travel websites have their own chatbots
    with which any user can interact to clear their own doubts. In such cases, the
    chatbots act as question–answer models \[[54](#bodymatter-006.xhtml#b_9783110670905-006_ref_054),
    [55](#bodymatter-006.xhtml#b_9783110670905-006_ref_055), [56](#bodymatter-006.xhtml#b_9783110670905-006_ref_056),
    [57](#bodymatter-006.xhtml#b_9783110670905-006_ref_057)\]. In such models there
    are multiple components that work together – the input device which acquires either
    a voice input or a text input, a processing unit that converts the input into
    computer understandable form, a conversion unit, and a database. In the processing
    unit if the input is in the form of text then there are mechanisms to understand
    the language used which is done using information about the character encoding
    and other metadata. In case of voice inputs, the processing is done using speech
    recognizers mentioned earlier. After the input is processed, algorithms are deployed
    that perform domain classification which help to understand the query and the
    context to which it belongs \[[58](#bodymatter-006.xhtml#b_9783110670905-006_ref_058),
    [59](#bodymatter-006.xhtml#b_9783110670905-006_ref_059)\]. The natural language
    question is then converted to a query in a language that the database will respond
    to, for example Structured Query Language. Information is then retrieved from
    the database as answers to the query which is then output to the user interface
    either as voice using TTS conversion \[[60](#bodymatter-006.xhtml#b_9783110670905-006_ref_060)\]
    or text output. This is summarized in [Figure 6.15](#bodymatter-006.xhtml#b_9783110670905-006_fig_015).


    ![Figure 6.15: Summary of a question–answer model.](graphic/converted/b_9783110670905-006_fig_015.png)


    Figure 6.15: Summary of a question–answer model.


    ## 6.5 Future scope


    With the amount of research going on in this domain, we can expect to see quite
    miraculous applications in the future. The existing architectures though good,
    still have a long way to go in terms of cognitive skills and accuracy. Most of
    the work related to speech and translations still need to be extended to different
    languages and various accents of the same language. More varieties of deep architectures
    are being explored to perfect the art of conversations with machines. As new and
    improved hardware is made available, problems related to storage are resolved
    and parallel architectures are allowing incredibly fast processing time. Therefore,
    the training of ML architectures will be more perfect with time. With availability
    of more information, NLP is reaching new heights; soon people will find friends
    in chatbots and there will be commercialization of personal assistants that can
    assist teachers, doctors, or even give a tough competition to them.


    ## 6.6 Conclusion


    This chapter mainly focusses on drawing a clear picture about an audio signal
    and methods to process it and finally understand it. Physics has put forth the
    nitty-gritties about sound ages ago and only recently with the advent of AI, effort
    is made to make the computer understand sound – be it speech, music, or noise.
    Many algorithms and models have been tried in the past but due to constraints
    in hardware and availability of labelled data, efficient algorithms could not
    be built to recognize or understand sound. Given that an audio signal is quite
    complex, simple algorithms were not good enough to capture the characteristics
    or complexities. Today, the availability of huge amount of data has sparked research
    in innumerable arenas and it is rightly said that “Data is the new Currency.”
    New and improved hardware along with data has allowed researches to devise efficient
    algorithms that can process audio signals better. Deep architectures have always
    given better performances as they are able to study the higher order dependencies
    between data – this is proved by countless research in this field, a fraction
    of which has been mentioned and detailed in this chapter. As is seen from studies,
    DNNs are beating other pre-existing models in terms of accuracy and are able to
    model AI better. Currently, they are the best in image classification and used
    in multiple arenas like self-driving cars, healthcare, and giving pretty good
    performance in fields such as brain-computer interfaces and audio classification.
    Audio processing is one of the fundamental human senses and with the help of DNNs
    it is being successfully incorporated in machines, contributing to a more complete
    AI.


