- raw: 'The fifth generation of computers are expected to think, analyze, and act
    on their own. We prefer to give commands and get fast responses. Who could imagine
    that saying “OK Google, play me some JAZZ” could actually play some jazz music
    for you, without you exclusively having to search for the genre. You could also
    turn on the fan without compromising the comfort of your sofa by telling Alexa
    (personal assistant launched by Amazon) to do it for you. These fascinating advancements
    could be made possible by audio signal processing. Not only can it be used for
    fancy things, environmental sound classification \[[15](#bodymatter-006.xhtml#b_9783110670905-006_ref_015)\]
    has made it possible to know the kind of environment in which a signal has been
    recorded. This could help in locating a victim from their last phone call or in
    annotating videos. There have been experiments on classifying sounds from different
    birds, sounds of babies crying \[[16](#bodymatter-006.xhtml#b_9783110670905-006_ref_016)\]
    to differentiate normal and pathological cries, classification of musical instruments,
    identifying the speaker, and much more. The study of various characteristics of
    an audio signal, along with feature extraction and proper training using machine
    learning algorithms makes this possible. The next section gives a detailed insight
    into the nitty-gritties of an audio signal. [Figure 6.1](#bodymatter-006.xhtml#b_9783110670905-006_fig_001)
    shows an audio waveform.


    ![Figure 6.1: An audio waveform.](graphic/converted/b_9783110670905-006_fig_001.jpg)


    Figure 6.1: An audio waveform.


    ### 6.2.1 Audio signals


    The basic definition of sound says it is a vibration that propagates essentially
    through any medium longitudinally and as both longitudinal and transverse waves
    in solids. In case of *longitudinal waves,* the particles of the medium vibrate
    parallel to the direction of wave propagation which might either be in the same
    or opposite direction. This motion causes regions of compression and rarefaction
    which indeed causes regions of varying pressure and hence these waves are also
    called *Pressure waves or Compression waves* as shown in [Figure 6.2](#bodymatter-006.xhtml#b_9783110670905-006_fig_002).


    ![Figure 6.2: Depiction of a longitudinal wave.](graphic/converted/b_9783110670905-006_fig_002.png)


    Figure 6.2: Depiction of a longitudinal wave.


    On the other hand, particles in the medium travel in a direction perpendicular
    to the wave propagation in case of *transverse waves* as shown in [Figure 6.3](#bodymatter-006.xhtml#b_9783110670905-006_fig_003).
    Waves are defined in terms of various characteristics – for longitudinal waves,
    the regions of highest particle concentration are known as *compressions* whereas
    the regions of lowest particle concentration are known as *rarefactions*; for
    transverse waves, *crests* are regions where maximum upward movement of particles
    occur and *troughs* are regions where maximum downward movement occurs. Movements
    are relative to the rest position of the particle. For any wave, the distance
    between two consecutive crests or troughs, or between two compressions or rarefactions,
    is known as the wavelength. *Frequency* of a wave is the number of waves that
    pass through a fixed point in the medium, per second. Shorter the wavelength,
    more is the frequency and hence more is the *pitch* of the audio. A high-pitched
    audio appears shriller than a low pitched one. The *amplitude* of a wave is the
    maximum displacement of the particle from its mean or rest position and is a measure
    of *loudness* and *intensity*. The more the amplitude, louder the sound appears.
    What tells apart a *note* from a *noise* is the orderly repetitive nature of its
    wave. Waves that repeat itself at intervals are more soothing as compared to waves
    that have irregular waveforms that do not repeat and constitute noise which is
    very unpleasant. The *quality* or *timbre* of a sound wave is determined by the
    waveform. Keeping the frequency constant, if the waveform is changed, different
    sounds of the same pitch will be perceived; this aspect is explored more in electronic
    music where varied sounds are produced by modulating the waveforms. The earlier
    description is a small outlook on the anatomy of a wave. For details on the mechanism
    by which a human being is able to hear please refer to \[[17](#bodymatter-006.xhtml#b_9783110670905-006_ref_017)\].
    The subjective nature of volume, noise, and how sound perceived varies among different
    individuals, and is immaterial to the context since we are to discuss various
    audio signal processing techniques for feature extraction and classification.
    The next section gives details on the various features of an audio wave and the
    methods by which they can be extracted.


    ![Figure 6.3: Depiction of a transverse wave.](graphic/converted/b_9783110670905-006_fig_003.png)


    Figure 6.3: Depiction of a transverse wave.


    ### 6.2.2 Feature extraction methods


    Machines learn through training. They are first made to get acquainted with the
    kind of input they need to process and are told what exactly it is. This is the
    simplest way in which supervised learning can be described. Therefore, when it
    comes to audio classification, the classification algorithm is fed with a set
    of relevant features corresponding to each audio piece, and a label, indicating
    either the words in the original audio or a sentence or a musical note. When a
    new sample is to be classified, the program extracts features from the new sample
    and outputs the nearest class to which these features belong. Audio features can
    be broadly divided into two heads – *physical* and *perceptual* features \[[18](#bodymatter-006.xhtml#b_9783110670905-006_ref_018)\].
    Each of these broad categories can be further subdivided into time, frequency,
    wavelet, image, and cepstral domains. In many audio classification systems, there
    is a segment where relevance feedback is taken from human beings, therefore, it
    becomes extremely important to take into consideration the perceptual features,
    because the way humans perceive sound is quite different from the physics of it.
    Therefore, either perceptual features are extracted or signal features, that bear
    a correlation to the perceptual features, are extracted \[[19](#bodymatter-006.xhtml#b_9783110670905-006_ref_019)\].'
