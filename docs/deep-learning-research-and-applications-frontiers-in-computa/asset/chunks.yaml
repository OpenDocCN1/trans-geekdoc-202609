    and pass it to the decoder, we should get a data point from the space of the original
    data. We are effectively performing a generative task. However, the latent space
    is not continuous, and the data reconstructed by the decoder for many random vectors
    will be unrealistic. Essentially, variational autoencoders are autoencoders that
    ensure that the activations of latent representation (hidden layer) are continuous.
    This is done by making the encoder output two vectors of dimension `d` instead
    of one vector of dimension `d`. These two vectors represent means and standard
    deviations and are represented by `μ` and `σ`, respectively. We then sample a
    random vector `H` of dimension `d`, and perform the following operation on each
    element `h[i]`:


    (4.6) `z[i] = σ[i] * h[i] + μ[i]`


    We get a vector `Z` which is then decoded back by the decoder. Note that this
    vector `Z` will not be the same even when the same input is given at different
    times. This is because the sampled vector `H` will differ. For the training, the
    Kullback–Leibler divergence between the latent representation and unit Gaussian
    is minimized, the mean squared error between the output and the input is also
    minimized simultaneously. The overall flow has been visualized in [Figure 4.1.](#bodymatter-004.xhtml#b_9783110670905-004_fig_001)
