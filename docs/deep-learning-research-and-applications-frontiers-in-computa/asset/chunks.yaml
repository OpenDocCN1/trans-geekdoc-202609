    have specific linguistic features like grammar and statistics like frequencies
    of bigrams, trigrams, and so on. These features are characteristic of languages
    and can be learnt hence known as linguistic or language model. To enhance STT,
    sometimes the acoustic probabilities are combined with the linguistic probabilities
    and the product of both the results are combined to determine the word said. Though
    existing models give good enough results, efforts are being made to better the
    performances in continuous SR. Figure 6.13 shows a comprehensive view of a speech
