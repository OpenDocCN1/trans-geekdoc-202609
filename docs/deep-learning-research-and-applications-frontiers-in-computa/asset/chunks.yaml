- raw: "We’ve seen how convolution operation works, but in a CNN we don’t just convolve\
    \ the image. In every CNN, Convolution is the first step. In the second step we\
    \ add bias (constant) to the convolved image, which then passes through a nonlinear\
    \ function like ReLU. This stage is also known as the detector stage as it detects\
    \ the features of the image. In the third step the nonlinear output undergoes\
    \ a pooling function. In [Figure 2.17](#bodymatter-002.xhtml#b_9783110670905-002_fig_017),\
    \ we have illustrated the steps involved in the fundamental block of the CNN.\n\
    \n![Figure 2.17: An illustration of the steps involved in the fundamental block\
    \ of the CNN.](graphic/converted/b_9783110670905-002_fig_017.png)\n\nFigure 2.17:\
    \ An illustration of the steps involved in the fundamental block of the CNN.\n\
    \n### 2.5.1 Pooling in CNN\n\nThe role of the pooling function is to summarize\
    \ the information the detected features hold. Obviously, there have been architectures\
    \ using different permutations of these steps where certain times multiple convolution\
    \ operations are performed without using pooling. Computer vision community is\
    \ highly active and comes up with different state of the art architectures, and\
    \ these topics are out of the scope of this chapter.\n\nNow let’s see how exactly\
    \ these pooling functions work. As mentioned earlier, the task of these pooling\
    \ functions is to give summary of the detected features and there are different\
    \ variants of these functions. Commonly used forms are max pooling and average\
    \ pooling. In max pooling as the name suggests we pass the maximum value of the\
    \ feature to the output. In average pooling the average of all the features is\
    \ passed to the output. Pooling is performed by passing a pooling filter across\
    \ the image and producing the output according to the type of function defined.\
    \ Example of max pooling can be illustrated in the following [Figure 2.18](#bodymatter-002.xhtml#b_9783110670905-002_fig_018).\n\
    \n![Figure 2.18: Illustration of max pooling.](graphic/converted/b_9783110670905-002_fig_018.png)\n\
    \nFigure 2.18: Illustration of max pooling.\n\nWe saw that convolution operation\
    \ follows the property of equivariance to translation. Likewise, the pooling function\
    \ helps the output become invariant to changes in translation in the input. All\
    \ variations of pooling help make the network invariant to minute translations\
    \ of the input. Researchers use combination of convolution and pooling functions\
    \ to make the networks robust to small changes in images. One point the reader\
    \ should note that is pooling operations are sensitive to changes in scale and\
    \ rotation. [Figures 2.19](#bodymatter-002.xhtml#b_9783110670905-002_fig_015)\
    \ shows how max pooling is invariant to translation. As observed in the figure\
    \ below all the entities in the input is translated to right by 1 unit, but only\
    \ half of the entities in the output are changed.\n\n![Figure 2.19: Pooling stage.](graphic/converted/b_9783110670905-002_fig_019.png)\n\
    \nFigure 2.19: Pooling stage.\n\n### 2.5.2 Building block of CNN\n\nThe building\
    \ blocks of a CNN are explained with help of [Figure 2.20](#bodymatter-002.xhtml#b_9783110670905-002_fig_020)–[2.21](#bodymatter-002.xhtml#b_9783110670905-002_fig_021)\
    \ and the table 2.5 provides a detailed layer-wise description of the Le-Net Architecture.\n\
    \n![Figure 2.20: A fundamental building block of the convolutional neural network.](graphic/converted/b_9783110670905-002_fig_020.png)\n\
    \nFigure 2.20: A fundamental building block of the convolutional neural network.\n\
    \n*A*^(*L* − 1) = *I**m**a**g**e*[*w**i**d**t**h*] × *I**m**a**g**e*[*h**e**i**g**h**t*] × *I**m**a**g**e*[*c**h**a**n**n**e**l*]\
    \     *W*^(*L*) = *F**i**l**t**e**r*[*w**i**d**t**h*] × *F**i**l**t**e**r*[*h**e**i**g**h**t*]× *I*[*c**h**a**n**n**e**l*]× *F*[*n**u**m**b**e**r* *o**f* *f**i**l**t**e**r**s*]\
    \ $\\\\mspace{-118mu} Z^{L} = A^{L - 1} \\\\ast W^{L} + B^{L}$ $\\\\mspace{-102mu}\
    \ A^{L}{= Pool}\\\\left( {{ReLU}\\\\left( Z^{L} \\\\right)} \\\\right)$ *A*^(*L*) *i**s* *o**f* *d**i**m**e**n**s**i**o**n* *O**u**t**p**u**t*[*w**i**d**t**h*] × *O**u**t**p**u**t*[*h**e**i**g**h**t*] × *O**u**t**p**u**t*[*c**h**a**n**n**e**l*]\
    \ \n\n## 2.6 Complete CNN\n\n### 2.6.1 Le-Net architecture\n\n![Figure 2.21: The\
    \ Le-Net architecture.](graphic/converted/b_9783110670905-002_fig_021.png)\n\n\
    Figure 2.21: The Le-Net architecture.\n\nTable 2.5:Detailed layer-wise description\
    \ of Le-Net.\n\n| Input layer  |\n\n| --- |\n\n| Convolution layer  || Stride = 1\
    \  \n\nKernel size = 5,  \n\nNumber of kernels = 6,  \n\nPadding = 0  || Output\
    \ dimension = $\\\\frac{32 - 5}{1}$ + 1 = 28 × 28 × 6  || Number of parameters\
    \ = 5 × 5 × 6 × 1 = 150  |\n\n| --- | --- | --- | --- |\n\n| Max pooling layer\
    \  || Stride = 2,  \n\nkernel size = 2,  \n\nNumber of kernels = 6,  \n\nPadding = 0\
    \  || Output dimension = $\\\\frac{28 - 1}{2}$ + 1 = 14 = 14 × 14 × 6  || Number\
    \ of parameters = 0  |\n\n| Convolution layer  || Stride = 1,  \n\nKernel size = 5\
    \  \n\nNumber of kernels = 16,  \n\nPadding = 0  || Output dimension = $\\\\frac{14\
    \ - 5}{1}$ + 1 = 10 × 10 × 16  || Number of parameters = 5× 5 × 16 × 6 = 2,400\
    \  |\n\n| Max pooling layer  || Stride = 2,  \n\nKernel size = 2, Number of kernels = 16,\
    \  \n\nPadding = 0  || Output dimension = $\\\\frac{10 - 1}{2}$ + 1 = 5 = 5 × 5 × 16\
    \  || Number of parameters = 0  |\n\n| Fully connected layer 1  || Size = 120\
    \  || Output dimension = 120 × 1  || Number of parameters = 120 × 5 × 5 × 16 = 48,120\
    \  |\n\n| Fully connected layer 2  || Size = 84  || Output dimension = 84 × 1\
    \  || Number of parameters = 84 × 120 + 84 = 10,164  |\n\n| Output layer  || Size = 26\
    \  || Output dimension = 26 × 1  || Number of parameters = 84 × 26 + 26 = 2,210\
    \  |\n\n## 2.7 What is the network learning?\n\nNow that we know how CNNs work,\
    \ let’s try applying them. We have trained a CNN for classifying images of cats\
    \ and dogs. The network seems to be performing poorly on the test set and we want\
    \ to find out the reason behind it. We will explore some techniques in this section\
    \ which will help us in understanding what the CNN has actually learned about\
    \ a given problem.\n\nPractitioners in the field of image processing have traditionally\
    \ relied on using filters designed specifically for the task. We have seen how\
    \ Sobel filters can be used to detect edges. Similarly, there are many filters\
    \ which detect specific features. In the previous decade, in most image categorization\
    \ pipelines, multiple such filters were used to extract features from images.\
    \ The practitioner usually knew what specific feature that they were getting.\
    \ For example, one might use a vertical edge detecting filter to detect road markings.\
    \ Being able to understand what features are being extracted makes the decision-making\
    \ process easy to understand.\n\nIn CNNs, we have thousands of filters. Furthermore,\
    \ these filters are generated by the training procedure. Only the dimensionality\
    \ of the filters is fixed manually. With so many filters being used, one very\
    \ natural question comes to mind – what specific features from the image are being\
    \ used while categorizing the image? The answer to this question helps us in debugging\
    \ our CNN.\n\n### 2.7.1 Visualizing the first layer\n\nOne simple way of discerning\
    \ the types of features being extracted is to look at the filters being used.\
    \ We can understand these filters by visualizing them. Simply plotting the weights\
    \ gives us good insights into what features of the input image are being looked\
    \ at by the filter. The filters from the first convolution layer of our cats and\
    \ dogs classifier have been visualized in [Figure 2.22](#bodymatter-002.xhtml#b_9783110670905-002_fig_022).\
    \ The first layer of this network used 64 7 × 7 by three (for the three channels)\
    \ filters. The 64 filters can be seen in the figure. Note how many filters are\
    \ performing the task of edge detection. In particular, the third last filter\
    \ seems to be looking at oriented edges at a 135° angle horizontally. Some filters\
    \ are looking for circles in specific channels.\n\n![Figure 2.22: The first-layer\
    \ filters of the cats and dogs classifier.](graphic/converted/b_9783110670905-002_fig_022.jpg)"
