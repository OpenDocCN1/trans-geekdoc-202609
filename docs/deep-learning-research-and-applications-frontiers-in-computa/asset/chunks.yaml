    ## 3.7 Conclusion


    This chapter deals with MLP, RNN, and CNN for recognizing handwritten characters
    of MNIST character dataset. Implementations of handwritten digit recognition using
    two CNN methods are implemented using different parameters. From the experimental
    results, it is proved that CNN is more accurate for recognizing of handwritten
    characters. The proposed “CNN Method 2” provides the accuracy of 98.92% whereas
    the proposed “CNN Method 1” provides the accuracy of 98.85% for MNIST character
    dataset. The experimental result shows that, the proposed “CNN Method 2” is better
    in terms of accuracy and the proposed “CNN Method 1” is better in terms of training
    time as compared to others for the MNIST dataset. The accuracy of the system will
    be better by using more number of filters. But, the training time will be very
    high. For further improvement, it is required to increase the number steps for
    training the system.


