    \ Finally, some areas of research of deep learning are presented which might become\
    \ the focus of the coming years.\n\n## 4.2 Convolutional neural models\n\nConvolutional\
    \ neural networks (CNN) are a class of deep neural networks (DNN) which were built\
    \ with the motive of achieving minimal preprocessing. Although they have performed\
    \ exceptionally well in the domains of image processing they can be used to analyze\
    \ any time-series data. The success of the CNNs can be attributed to the comparatively\
    \ lesser preprocessing required by them which reduces human effort and any requirement\
    \ of the domain knowledge to hand-engineer the features. The connectivity pattern\
    \ between the neurons in a CNN is inspired from animal visual cortex in which\
    \ a neuron only responds to a stimuli in a fixed region of the visual field known\
    \ as the receptive field. In the convolution operation, the first argument is\
    \ the input (in the formula the function *x*) and the second argument is a kernel\
    \ (in the formula *w*). The output is referred to as a feature map. Instead of\
