  trans: '


    一种看待深度置信网络（`DBNs`）的方法是，它们是像 图 6.9 所示的层叠在一起的 `RBMs` 层。当用于电话识别 \[40\] 时，此类模型能给出非常准确的结果，其效果甚至优于
    `RNNs`。训练具有多个隐藏层的 `DBNs` 并不容易，因为很难确定隐藏层中变量的后验分布。在评估了马尔可夫链蒙特卡洛算法 \[42\] 和 `CD`
    之后，`DBNs` 最优的训练方法被证明是互补先验算法与醒觉-睡眠算法相结合 \[43\]。`DBN` 由多个隐藏层组成，其中最顶层的两层具有无向连接，而其余层具有生成权重和识别权重，即分别在向上和向下方向具有特定的定向权重。用于训练它的贪婪算法（`GA`）的工作原理是序列中的每个模型从其前一个模型中学习。一层的输入是前一层的输出，该输出通过对数据表示向量执行非线性变换获得。结果，堆栈中的各个模型对实际数据具有不同的表示。模型中的所有层都具有相同数量的单元。图
    6.9(b) 显示了迄今所述的 `DBN` 模型。前两层之间的权重是基于这样一个假设学习的：较高层中的参数将为 `W[0]` 制定一个互补先验 \[43\]。为了构建
    `H[1]`（即第一个隐藏层）的向量输入，`V[0]` 中的数据通过 `W[0]^(*T*)` 进行映射。这是一个生成模型，可以通过使用 `GA` 来完善，该算法指出——`W[0]`
    是在假设所有其他权重矩阵被锁定后学习的，之后 `W[0]` 被固定，`W[0]^(*T*)` 用于为 `H[1]` 生成向量，即使较高层权重的连续变化表明该假设不正确。然后，较高层的权重矩阵彼此锁定，但与
    `W[0]` 保持无绑定，并为使用 `W[0]^(*T*)` 生成的较高层数据学习一个 `RBM` 模型，以重建原始输入数据向量。`GA` 对较高层权重矩阵所做的任何更改都会导致生成模型的改进。`GA`
    递归测试，`CD` 用于学习绑定权重，同时与底层的权重分离。以这种方式，权重被逐层高效地确定，尽管不是最优的，因为模型可能会遭受欠拟合。为了解决这个问题，使用了反向拟合，它是醒觉-睡眠算法的一种变体
    \[44\]。在从 `GA` 学习初始权重后，用于推理的识别权重和用于定义模型的生成权重被分离以进行进一步训练。在自底向上传递中，识别权重有助于随机确定隐藏单元的状态，生成权重根据最大似然算法进行修改，而
    `RBM` 两个最顶层之间的权重则通过根据倒数第二层的后验分布进行拟合来调整。在自顶向下传递中，通过生成权重进行映射以随机激活底层中的单元，同时仅修改识别权重。顶部的
    `RBM` 可以在其平衡分布处稳定下来，或者在开始自顶向下阶段之前经历几个阶段的 `CD` 才能达到平衡。后者在生成数据的不同模式方面证明更好。


    ![Figure 6.9: Deep belief networks as stack of restricted Boltzman machines .](img/b_9783110670905-006_fig_009.png)


    图 6.9：深度置信网络作为受限玻尔兹曼机的堆栈。


    在电话识别的情况下，反向传播 `DBNs` 给出了最佳结果，即在 TIMIT 数据集上具有最低的电话误差率（`PER`）。作为第一个可视层的输入，`MFCCs`
    及其一阶和二阶时间导数用于每个帧。`BP-DBNs` 的初始权重训练遵循逐层 `CD` 方法，并添加一个最终输出层，然后使用反向传播歧视性地微调模型参数。输出单元的数量等于类标签的二进制表示的维度，该维度是任意决定的。模型生成的输入语音片段的
    ɖ 维表示 ɚ 以及模型参数 ϴ，给定类 ɮ 的转换后的后验概率分布向量 ɔ[ɮ]，分配给每个类 ɮ 的概率在等式 (6.42) 中给出。


    (6.42) $P(ɮ|{{\\theta,}ᶕ})\\, = \\frac{e^{ͻɮᶕ}}{\\sum\_{ƈ\\, \\in \\, classes}e^{ͻ\_{ƈ}ᶕ}}$


    最佳结果由一个四层 `BP-DBN` 给出，每层包含 2048 个单元，并附加一个 128 个单元的输出层。


    ## 6.3.4 WaveNets


    `WaveNets` 是概率模型 \[9\]，在语音和音乐生成方面表现出最先进的性能，同时在电话识别等歧视性任务中也表现出色。`WaveNets` 生成的音频比当前的串联和参数方法听起来更自然，因为单个模型可以成功捕捉不同说话人的特征，并根据任何特定说话人生成语音。与在提取特征上进行训练的其他模型不同，`WaveNets`
    在原始音频波形上进行训练。生成特定波形的联合概率表示为每个样本在所有先前样本条件下的概率的乘积，如等式 (6.43) 所示。


    (6.43)$p\\left( \\psi \\right) = \\ \\prod\\limits\_{t = 1}^{T}p(\\psi\_{t}|\\psi\_{1},\\ldots,\\
    \\psi\_{t - 1})$


    上述原理使用许多层因果卷积神经网络（`CaCNNs`）来实现，没有池化层，且输入和输出层的时间维度相等。模型的输出使用 softmax 层计算，该层给出一个分类分布，指示样本
    `ψ[t]` 被生成的概率。在训练期间，参数被调整以实现数据的最大对数似然。根据 (31)，很明显，在训练期间，由于 `ψ` 已知，可以并行计算每个时间步预测样本的条件概率。音频生成是一个序列现象，每个生成的样本都反馈到网络中以对后续时间步进行预测。尽管由于没有循环连接，`CaCNNs`
    的训练时间比 `RNNs` 短，但需要更多的隐藏层或更大的滤波器来增加感受野。增加感受野长度对于在训练期间捕捉语音和音乐信号中的依赖关系非常重要，以确保自然的语音和和谐的音乐生成。为了减少由额外隐藏层产生的计算量，在每一层中引入了扩张因子（`Df`），同时保持模型中总层数不变。在扩张
    `CaCNNs` 中，滤波器的长度小于其应用的区域，它通过跳过特定数量的中间输入值来工作，如 图 6.10 所示。`Df` 指示要跳过的值的数量，并有助于在不添加更多隐藏层的情况下增加感受野。


