    同样，通过在二维输入（通常是灰度图像）上应用二维核，我们得到二维输出。那么，当我们有三维输入（如 RGB 图像）时会怎样呢？在具有三个通道（`image[width]
    × image[height] × 3`）的 RGB 图像中，我们需要一个具有相同通道数的核。它将与具有三个通道的滤波器进行卷积。读者应注意，每个单独的滤波器通道与相应的输入通道进行卷积，所有通道的输出被求和为单个输出。因此，我们得到二维输出。在大多数
    CNN 中，我们使用 `K` 个三维滤波器，并得到三维输出，其中第三维将是 `K`，即滤波器的数量。这在 图 2.7 中有所说明。


    ![Figure 2.7: Convolution operation on three-dimensional images.](img/b_9783110670905-002_fig_007.jpg)


    图 2.7：三维图像的卷积操作。


    ## 2.3 输入维度、输出维度和滤波器维度之间的关系


    现在，我们脑海中可能会出现一个问题：如何在不实际应用滤波器的情况下预测输出的维度？这个问题的答案在于输入维度、输出维度和滤波器维度之间存在的数学关系。那么，让我们先通过回答一个简单问题来开始推导这个关系。为什么输出大小小于输入大小？答案是图像上有某些像素，我们无法在那里放置核，因为这样会超出图像边界（图
    2.8 和 图 2.9）。


    ![Figure 2.8: Convolution operation on image with kernel size (3 × 3).](img/b_9783110670905-002_fig_008.jpg)


    图 2.8：核大小为 (3 × 3) 的图像卷积操作。


    ![Figure 2.9: Convolution operation on image with kernel size (5 × 5).](img/b_9783110670905-002_fig_009.jpg)


    图 2.9：核大小为 (5 × 5) 的图像卷积操作。


    为了避免这种情况，我们可以在应用卷积操作前对图像进行填充，但这仍然会增加图像的维度。因此，对于 (3 × 3) 核，填充将使图像的维度增加 (2 × 2)。但是，如果我们增加核的大小呢？例如，对于
    (5 × 5) 核，我们需要通过填充 (4 × 4) 来增加图像的大小。因此，一般来说，我们可以看到，对于大小为 `F` 的核进行卷积操作，我们需要在图像的两侧各进行
    `F`–1 的填充。换句话说，我们无法计算图像两侧 `F`–1 个像素的卷积。因此，图像的大小将减少 `F`–1。让图像的高度和宽度分别为 `H` 和 `W`。输出的高度和宽度分别为
    `H[o]` 和 `W[o]`。因此，图像的输出维度将为


    `H[o] = H − F + 1`

    `W[o] = W − F + 1`


    正如我们在上面的示例中所看到的，为了计算所有像素的卷积，我们需要对图像进行填充，而填充图像会使图像的维度增加两倍的填充大小（上下）。因此，填充后输出的维度将为


    `H[o] = H + 2*P − F + 1`

    `W[o] = W + 2*P − F + 1`


    如果我们用值为零的像素在图像周围进行填充，则称为零填充。很多时候，我们可以通过添加存在于边界的像素层来进行填充。由于填充用于控制输出的大小，因此根据输出大小有两种常用类型。如果输出大小等于输入大小，则我们称之为相同填充（same
    padding）。如果输入没有填充，则我们称该方案为有效填充（valid padding）。除了这两种类型，我们始终可以定义自己的自定义填充大小。


    填充的原因是（1）角落的信息，因为滤波器只通过一次，（2）如果没有填充，输出将变得非常小。因此，为了控制输出的大小，我们采用填充。


    那么，如果我们不想计算图像中所有像素的卷积操作，而是想计算交替像素，或者可能是两个交替像素或 k 个交替像素的卷积呢？为了解决这个问题，我们引入步长的概念。步长只不过是在应用卷积操作时我们采取的一个步长。在正常情况下，我们有一个大小为
    1 的步长，在这种情况下，我们为每个像素计算卷积。为了计算交替像素的卷积，我们可以有一个步长为 2，依此类推。


    那么，步长的应用将如何影响我们的输出维度呢？因为我们现在计算的是交替像素的卷积，输出大小必然会减少输入大小的一半。因此，当我们应用步长 `k` 时，输出大小将减少输入大小的
    (1/`K`) 倍。因此，当我们使用大小为 `P` 的填充和步长 `S` 时，计算输出维度的公式为


    ```

    Ho = (H + 2P - F) / S + 1

    Wo = (W + 2P - F) / S + 1

    ```


    ## 2.4 CNN 的特性


    现在我们知道什么是卷积算子，以及卷积操作如何改变输出维度，是时候提出一个非常根本的问题了。什么是 CNN？我们为什么使用 CNN，它们与普通的前馈神经网络有什么不同？


    让我们逐一回答这些问题。卷积网络只是在至少一个层中使用卷积代替一般矩阵乘法的神经网络 [2]。但是，我们为什么要使用卷积操作？我们为什么要从 ANNs 中使用的矩阵乘法操作转向卷积操作？


    卷积操作具有以下好处，有助于我们改进机器学习过程：


    * 稀疏交互


    * 参数共享


    * 等变表示


    ### 2.4.1 稀疏连接


    '
