    (6.48)`z` = tanh (`W`[*f*, `k`]\**ψ*`+`V`[*f*, `k`]^(*T*)\**y`*)`ʘ` `σ`(`W`[*g*, `k`]\**ψ*`+`V`[*g*, `k`]^(*T*) \* `y`)
    ![Figure 6.12: WaveNet 架构的整体表示。](img/b_9783110670905-006_fig_012.png)


    Figure 6.12: WaveNet 架构的整体表示。


    当用于语音生成且不将其条件约束于文本时，它生成听起来像语音但不包含任何实际单词的音频，因为它不知道要说什么。但该模型可以用于基于说话人身份生成类似语言的声音，说话人身份是独热编码并在训练和生成期间输入模型。单个
    WaveNet 模型能够以如此高的准确性生成不同说话人的声音，表明其内部架构在捕获多个说话人特征方面非常高效。对于文本转语音（TTS），WaveNet 在输入文本提取的基本频率对数以及语言特征上进行训练。与
    LSTM-RNN 参数模型和 HMM 驱动的连接模型相比，在北美英语和普通话中测试时，这显著提高了平均意见分数结果（表明生成的语音听起来有多自然）。对于音乐生成，WaveNet
    可以在标注了相关信息（如流派、情绪、音量和节奏）的音乐数据集上进行训练，这些信息可在生成期间用作条件约束因素。音乐生成的一般观察是，较长的感受野对于捕获音符之间的音乐依赖关系至关重要，并能产生更悦耳的作品。还进行了实验将
    WaveNet 应用于 SR 领域，将原始音频作为输入，通过在现有模型中添加池化层然后是普通卷积层来稍微修改模型，并训练其完美完成两项任务：预测下一帧和分类当前帧。与任何以原始音频作为输入并在
    TIMIT 数据集上训练的模型相比，WaveNet 具有最低的 PER 率。如 \[45 所示，可以通过使用并行架构来优化训练 WaveNet 所需的时间。


    ## 6.4 当前应用


    如前所述，音频信号处理是 AI 的组成部分，并对其进步做出了巨大贡献。它具有广泛的应用——作为银行、旅游网站、消息应用程序中个人助理的聊天机器人；使用环境声音分类将视频中不同区域标记为所发出的声音，或通过处理音频片段来检测周围环境；音乐流派分类可以帮助分类任何新的未标记音乐，相同的模型可用于分类婴儿的不同哭声类型以识别其需求，或根据它们发出的声音预测不同类型的动物或鸟类。语音或音乐生成也可用于生成特定上下文的文本或特定流派的音乐，这些可用于故事制作应用程序或音乐应用程序。本节简要介绍了其中几个应用。


