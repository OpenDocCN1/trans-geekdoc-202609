- raw: "In language, the smallest unit is a phoneme. Phonemes combine to form words\
    \ which in turn combines to form a sentence and many sentences together form a\
    \ context. Therefore, one cannot simply determine the entire word by listening\
    \ to the phoneme at a particular time frame, as the utterances before and after\
    \ together makes a meaningful word. Similarly, to determine the context of a given\
    \ sentence or a piece of text, which is an important application of NLP, it is\
    \ necessary to take into account the entire data before and after that sentence.\
    \ RNNs were used widely for the task of SR, but they were not good at modelling\
    \ the dependencies between phonemes or words. This is due to the fact that whenever\
    \ the frame of consideration is increased, the vanishing and exploding gradient\
    \ descent problem arises. Long short-term memory-recurrent neural networks (LSTM-RNNs)\
    \ served as the solution which gave impressive results in SR by capturing dependencies\
    \ over extended time frames. The main divisions of a LSTM unit are the input gate(i),\
    \ forget gate(f), and the output gate(o). Since the network is recurrent in nature,\
    \ the connections from the output gates are directed back to the input layer as\
    \ shown in [Figure 6.7](#bodymatter-006.xhtml#b_9783110670905-006_fig_007). In\
    \ essence, the forget gate controls the flow of data to avoid redundancy or repetition,\
    \ given the previous inputs, that is, it is required to prevent similar words\
    \ from reoccurring so that meaning is preserved. Memory(c) is also incorporated\
    \ in LSTMs as shown in the [Figure 6.7](#bodymatter-006.xhtml#b_9783110670905-006_fig_007),\
    \ so that it is able to remember previous words encountered which helps to stick\
    \ to the context. A single layer comprising LSTM units is not very good at the\
    \ task of SR, so to make it better multiple hidden layers of LSTMs are stacked\
    \ together which is known as deep-LSTMs \\[[38](#bodymatter-006.xhtml#b_9783110670905-006_ref_038)\\\
    ]. In case of SR, commendable accuracy is obtained by using a combination of an\
    \ acoustic model(AM) and a LM both of which are built using LSTM-RNNs. The set\
    \ of inputs to any LSTM-RNN model, represented by *x*\\={*x*[1],*x*[2], …, *x*[T]},\
    \ can either be a set of discrete words in case of a LM or a vector of MFCCs in\
    \ case of an AM. The hidden sequence calculated through *t*\\={1,2, …, *T*} is\
    \ denoted as *h* = {*h*[1],*h*[2], …, *h*[T]} and the outputs as *y* = {*y*[1],*y*[2],\
    \ …, *y[T]*}.\n\n![Figure 6.7: Detailed representation of a simple recurrent network\
    \ unit (left) and long short-term memory unit (right).](graphic/converted/b_9783110670905-006_fig_007.png)\n\
    \nFigure 6.7: Detailed representation of a simple recurrent network unit (left)\
    \ and long short-term memory unit (right).\n\nThe calculations of the hidden and\
    \ output units are shown in eqs. (6.19) and (6.20) where Ƕ(.) is a mere simplified\
    \ representation of the more complex operations used to calculate the value of\
    \ each hidden LSTM unit and *W* represents the entire set of weights; at any point\
    \ *W[ab]* represents the weights between the *a* and *b* units which can one among\
    \ *i, f, o, c, x*, and *h*, and *b* is a bias term.\n\n(6.19) *h*[*t*] = *Ƕ*(*W*[*x**h*]*x*[*t*]+ *W*[*h**h*]*h*[*t* − 1]+*b*[*h*])\
    \ (6.20)*y*[*t*] = (*W*[*h**y*]*h*[*t*] + *b*[*y*]) \n\nThe breakdown of Ƕ into\
    \ the functions of the previous mentioned gates are shown in eqs. (6.21)–(6.25)\
    \ which also explains the flow of data within the LSTM unit.\n\n(6.21)*i*[*t*]\\\
    = *σ*(*W*[*x**i*]*x*[*t*]+ *W*[*h**i*]*h*[*t* − 1]+*W*[*c**i*]*c*[*t* − 1]+*b*[*i*])\
    \ (6.22)*f*[*t*]\\= *σ*(*W*[*x**f*]*x*[*t*]+ *W*[*h**f*]*h*[*t* − 1]+*W*[*c**f*]*c*[*t* − 1]+*b*[*f*])\
    \ (6.23)*c*[*t*] = *f*[*t*]*c*[*t* − 1]+ *i*[*t*]*t**a**n**h*(*W*[*x**c*]*x*[*t*]+*W*[*h**c*]*h*[*t* − 1]+*b*[*c*])\
    \ (6.24)*o*[*t*] = *σ*(*W*[*x**o*]*x*[*t*]+*W*[*h**o*]*h*[*t* − 1]+*W*[*c**o*]*c*[*t*]+*b*[*o*])\
