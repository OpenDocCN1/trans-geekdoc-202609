    # 2 Convolutional Neural Networks: A Bottom-Up Approach


    Karan Maheshwari School of Computer Science and Engineering, Vellore Institute
    of Technology, Vellore, India. Aditya Shaha School of Computer Science and Engineering,
    Vellore Institute of Technology, Vellore, India. Dhruv Arya School of Computer
    Science and Engineering, Vellore Institute of Technology, Vellore, India. Rajkumar
    Rajasekaran School of Computer Science and Engineering, Vellore Institute of Technology,
    Vellore, India. B. K. Tripathy School of Information Technology and Engineering,
    Vellore Institute of Technology, Vellore, India.


    #### Abstract


    A lot has changed in the world since the inception of the so-called deep learning
    (DL) era. Unlike conventional machine learning algorithms, where human learns
    more of feature extraction than machine, which just crunches numbers, DL algorithms
    are quite promising as they have revolutionized the way we deal with data and
    have become adept in taking humanlike decisions. Based on the powerful notion
    of artificial neural networks, these learning algorithms learn to represent data
    or, if we rephrase, can extract features from raw data. DL has paved way for end-to-end
    systems where one learning algorithm does all the tasks. Convolutional neural
    networks have earned a lot of fame lately, especially in the domain of computer
    vision where in some cases its performance has beaten that of humans. A lot of
    work has been done on convNets and in this chapter we will demystify how convolutional
    neural networks work and will illustrate using one novel application in the field
    of astronomy where we will do galaxy classification using raw images as input
    and classify them based on its shape. In addition to this we will investigate
    what features the network is learning. We will also discuss how DL superseded
    other forms of learning and some recent algorithmic innovations centered on convolutional
    neural nets.


    Keywords: deep learning (DL), convolutional neural networks, galaxy classification,
    artificial neural networks, deconvolution,


    ## 2.1 Introduction

