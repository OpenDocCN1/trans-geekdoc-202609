    # 5.5 Conclusion


    在本章中，提出了使用 VAE 通过手写分析提取书写痉挛患者常见特征的方法。该方法可用于早期诊断疾病。这是一种成本效益高且非侵入性的诊断方法或诊断工具。虽然未识别出作为书写痉挛确凿迹象的特定模式，但研究结果可用于测试患者的认知技能。如果样本是在配备电子平板电脑上收集的，研究本可以更有效，以便可以精确记录压力、时间和其他因素。未来可以通过添加更多功能（如监控、跟踪疾病的逐渐进展，以及识别患者在获取样本时所处的阶段）来修改研究，以便尽早检测病情的改善或恶化。这只能持续到患者保持正常功能能力的阶段。书写痉挛患者在终末期会出现功能能力受损，可以肯定他们将无法提供足够的数据来使用此模型进行分析。


    该研究还可以应用于提取其他神经退行性疾病的特征，只需对实现进行轻微修改，以确定手写分析是否可用作早期诊断方法。该研究还将受益于大量训练集和动态数据收集的可用性。这将有助于更好的图像重建。动态收集将为更准确的聚类提供更精确的参数。


    # References


    在获得的聚类中，外观相似的字母被归为一起；例如，让我们考虑 [Figure 5.14](#bodymatter-005.xhtml#b_9783110670905-005_fig_014)，其中“l”、“e”和“c”被患者混淆和混乱。具体来说，他们无法找出并识别特定字符，因此在抄写时，他们试图画出他们所看到的东西，而不是理解字符是什么，然后将其写下来。


    ![Figure 5.14: Snapshot representing ambiguous writing.](graphic/converted/b_9783110670905-005_fig_014.png)


    Figure 5.14: Snapshot representing ambiguous writing.


    ## 3. Failure to distinguish between similar characters present adjacent to each
    other


    在 [Figure 5.15](#bodymatter-005.xhtml#b_9783110670905-005_fig_015) 中的原始单词是“little”、“lull”、“alumnae”、“will”；由于“le”、“ul”、“mn”和“il”相似且相邻，对他们来说无法识别，结果导致混淆，他们形成的单词难以辨认。


    ![Figure 5.15: Snapshot representing failure to distinguish between similar characters.](graphic/converted/b_9783110670905-005_fig_015.png)


    Figure 5.15: Snapshot representing failure to distinguish between similar characters.


    ## 4. Similar alphabets contained in the same word gets interchanged often


    在 [Figure 5.16](#bodymatter-005.xhtml#b_9783110670905-005_fig_016) 所示的示例中，原始单词是“bad”和“guy”。由于“b”和“d”、“y”和“g”虽然不完全相同，但看起来非常相似，因此在书写痉挛患者书写时，它们的位置被互换。虽然这种错误并非对所有患者都相同，但在大多数患者中相当常见。


    ![Figure 5.16: Snapshot representing interchanged letters.](graphic/converted/b_9783110670905-005_fig_016.png)


    Figure 5.16: Snapshot representing interchanged letters.


    ## 5. Unclear and disconnected writing with errors in spellings


    ![Figure 5.17: Snapshot representing disconnected writing.](graphic/converted/b_9783110670905-005_fig_017.png)


    Figure 5.17: Snapshot representing disconnected writing.


    这是大多数人的一个共同方面；通常单词的字符是断开的，写得很远，变成两个不同的单词（如 [Figure 5.17](#bodymatter-005.xhtml#b_9783110670905-005_fig_017)
    所示），没有意义并导致拼写错误。


    尽管手写可以作为检测书写痉挛的有形工具，但某些字符可能会产生误导。并非所有字迹潦草的患者都是书写痉挛患者，也并非所有书写痉挛患者都有极其潦草的字迹。正常人可能比书写痉挛患者有更差的字迹。


    还观察到，“i”、“s”和其他一些字母被完美书写，聚类在整个过程中都相同，如 [Figure 5.18](#bodymatter-005.xhtml#b_9783110670905-005_fig_018)
    所示。


    ![Figure 5.18: Snapshot of “i” and “s” present in the collected samples.](graphic/converted/b_9783110670905-005_fig_018.png)


    Figure 5.18: Snapshot of “i” and “s” present in the collected samples.


    在研究了如此多的手写样本后，注意到严重书写痉挛的患者甚至无法写出一个完整的句子，几乎不可能理解到底写了什么，如 [Figure 5.19](#bodymatter-005.xhtml#b_9783110670905-005_fig_019)
    所示。


    ![Figure 5.19: Handwriting of a patient with severe dysgraphia.](graphic/converted/b_9783110670905-005_fig_019.png)


    Figure 5.19: Handwriting of a patient with severe dysgraphia.


    在收集手写样本时，发现一个孩子患有非常严重和严重阶段的疾病。不幸的是，疾病更加复杂，因为受试者还患有另一种神经退行性疾病。他一开始不愿意写；经过一段时间的劝说后，他同意写，但他无法完成一个句子，并开始惊慌地哭泣。


    大多数这些患者共同的心理是他们极不愿意和不愿写作。写作时，他们对自己的字迹格外小心，并试图为自己糟糕和不清晰的字迹提供合适的理由。他们的倾向是仔细观察给定的样本，并写出看起来完全相同的东西。并非所有，但大多数观察到的患者在写作时处于激动状态。少数人还抱怨手痛。这证实了关于书写痉挛患者心理学的理论。


    如前所述，书写痉挛的类型和存在于儿童中的症状各不相同，一个人可能患有不止一种类型。机器对类型的分析目前似乎无法实现。


    在农业领域，由于作物疾病导致的产量损失是一个关键挑战。因此，植物病害检测已建立了一种思想，即如果疾病被早期发现，生产质量可以得到改善。相关文献中规定了不同的机器学习技术，这些技术在植物病害检测中非常有用。这些各种机器学习方法的示例包括
    ANN、SVM、k-means 聚类、K-NN 等。单独，这些基于机器学习方法的应用被阐述用于分割、分类和聚类。疾病识别的实验结果表明，所提出的方法是一种主要受到赞赏的方法，可以以微小的计算努力支持疾病检测。


    本章的延期将强调将决策支持系统与其他机器学习技术相结合的重要性，这可能提供更准确的作物疾病早期检测。未来工作还针对机器学习仅开发用于理解和处理各种农业相关自然现象的领域。此外，机器推导的决策应转换为人类可读文本或当地语言，以便农民可以理解并与机器合作。

    '
