    # 前言


    深度学习（DL）是机器学习（ML）研究的一个新领域，其引入的目标是使 ML 更接近其最初的目标之一，即人工智能（AI）。DL 是作为一种 ML 方法开发的，用于处理复杂的输入-输出映射。虽然传统的
    ML 方法能够成功解决最终值是输入数据简单函数的问题，但 DL 技术能够捕捉空气压力录音与英文单词、数百万像素与文本描述、与品牌相关的新闻与未来股票价格，以及几乎所有现实世界问题之间的复杂关系。DL
    框架使用多层非线性处理单元的级联来进行特征提取和转换。每个连续层使用前一层的输出作为输入。学习可以是受监督的（例如，分类）和/或无监督的（例如，模式分析）。这些算法通过使用某种形式的梯度下降通过反向传播进行训练，学习多个层次的表示，这些表示对应于不同的抽象级别。主要组件包括人工神经网络的多个隐藏层和一组命题公式。其他变体也很流行，其中潜在变量在深度生成模型中按层组织。代表性示例包括深度置信网络和深度玻尔兹曼机。DL
    是各个学科中最先进的系统，特别是计算机视觉、自动语音识别和人类动作识别。


    本卷包含七篇内容详实的章节，报告了 DL 研究和应用的最新趋势。


    第 1 章介绍了不同供应商市场提供的各种云平台。IBM 提供的 ML 平台——数据科学体验（Data Science Experience）在此研究领域中被考虑。在本节之前，讨论了
    AI、ML 和 DL 及其关系的概述。本章还考虑了流行 DL 架构的初步比较讨论。


    与传统的 ML 算法不同，在传统算法中，人类学习更多的特征提取，而机器只是进行数字计算，DL 算法非常有前景，因为它们彻底改变了数据处理的方式。基于人工神经网络的强大概念，这些学习算法学习表示数据，或者如果我们重新表述，可以从原始数据中提取特征。DL
    为端到端系统铺平了道路，其中一个学习算法完成所有任务。卷积神经网络（CNN）近年来声名鹊起，尤其是在计算机视觉领域，在某些情况下，其性能已超越人类。在第 2
    章中，作者试图揭示 CNN 的工作原理，并使用天文学领域的一个新颖应用进行说明。此外，本章还调查了网络正在学习哪些特征。


    光学字符识别系统已被用于提取扫描文档或图像中包含的文本。该系统包含两个步骤：字符检测和识别。需要一个分类算法来根据特征识别字符。字符可以使用神经网络来识别。多层感知机（MLP）为字符分类提供了可接受的识别准确率。此外，CNN
    和循环神经网络（RNN）正在提供高精度的字符识别。MLP、RNN 和 CNN 在训练阶段可能会受到大量计算的影响。在第 3 章中，实现了一个 CNN 来识别
    MNIST 数据库中的数字，并在 MLP、RNN 和 CNN 之间建立了比较研究。


    DL 技术对 AI 研究产生了巨大影响。它们改进了传统的 ML 技术，传统技术需要人类专业知识进行特征工程。通过去除一个人为因素，它们在 AI 领域向前迈出了一步。不过，它们并没有完全消除人类，因为人类仍然需要设计架构和清理数据。DL
    技术已在语音识别、机器翻译、图像识别和目标检测等领域取得了突破性成果。第 4 章简要概述了当今使用的各种 DL 技术。描述了使 DL 更有效的技术。还介绍了一些有趣的应用。


    使用智能计算技术进行手写文档分析是当今一个要求很高的研究领域，考虑到其在识别个人及其特征方面的用处，特别是那些患有阅读障碍、书写障碍和帕金森病等典型残疾的人。笔迹分析属于笔迹学的广泛范畴，有助于我们了解作者的心理、情感表达以及明显的障碍。由于草书性质的广泛谱系和书写风格的高度不一致，与传统的笔迹学技术相比，现代手写分析技术需要对不同模式更加稳健和敏感。智能计算技术的必要性在于，它能够智能地分析手写文本，以找出儿童或成人手写中较细微方面的相似性，这些人患有某种学习/书写障碍。DL
    技术被选为技术工具，用于识别和分类患有发育性书写障碍的儿童手写的共同特征。变分自编码器，一种深度无监督学习技术，据称将在此使用。第 5 章报告了成功提取大量可区分的手写特征，这些特征在临床上被证明是书写障碍的症状。音频信号处理及其分类可以追溯到上个世纪。从语音识别到说话人识别，从语音转文本到音乐生成，该领域使用隐马尔可夫模型、带有长短期记忆层的
    RNN、深度卷积神经网络以及用于音乐和语音生成的最新 WaveNet 模型等算法取得了许多进展。这些算法在音频信号处理并应用有效的特征提取技术后进行应用。第
    6 章详细解释了什么是音频信号以及如何处理它。它还涵盖了各种特征提取技术和分类算法。最后，探讨了该领域 DL 的当前应用和潜力。


