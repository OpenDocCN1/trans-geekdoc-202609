    ### 7.4.2 Performance evaluation


    FTS model of order fifth, sixth, seventh, and eighth are used in this study. Here,
    number of prior time steps is equivalent to the number of order taken, that is,
    for fifth-order model, `h = 5`. In the first step, fuzzy-c-means algorithm is
    applied to create different number of clusters for each dataset and fuzzy logical
    relationships are defined using BPTT model. Fuzziness index `m = 2`; for temperature
    datasets error = 0.005. Number of clusters used in each dataset is shown in the
    [Tables 7.6](#bodymatter-007.xhtml#b_9783110670905-007_tab_008)–[7.9](#bodymatter-007.xhtml#b_9783110670905-007_tab_011)
    with RMSE for in-sample data.


    Number of external input nodes is equal to the number of clusters taken. Number
    of external input nodes and number of computing units are equal. Number of iteration
    in each of the dataset is 100, learning rate = 0.5.


    Table 7.6: Error estimation for June data set using BPTT model.


    | Error || Number of clusters || Order |

    | --- | --- | --- |

    | 5th || 6th || 7th || 8th |

    | RMSE || 4 || 1.17 || 0.99 || 1.03 || 1.07 |

    | 5 || 1.08 || 1.1 || 1.4 || 1.02 |

    | 6 || 1.09 || 1.15 || 1.27 || 1.13 |

    | Theil’s `U` statistic || 4 || 0.021 || 0.02 || 0.02 || 0.02 |

    | 5 || 0.019 || 0.019 || 0.025 || 0.018 |

    | 6 || 0.019 || 0.02 || 0.022 || 0.02 |


    Predicted values are computed taking different combination of sequence length
    (prior time steps) and clusters. Then, prediction error is computed by using root
    mean square error (RMSE) and Theil’s U statistic [[19](#bodymatter-007.xhtml#b_9783110670905-007_ref_019)].
    It is observed that the accuracy of forecast is dependent on the number of clusters
    created and the order of the model (number of layer used). For each dataset, only
    predicted values (corresponding to minimum RMSE) are shown ([Tables 7.2](#bodymatter-007.xhtml#b_9783110670905-007_tab_004)–[7.5](#bodymatter-007.xhtml#b_9783110670905-007_tab_007)).


    (7.8) `${RMSE} = {}\\sqrt{\\frac{\\sum\_{i = 1}^{n}\\left( {A - P} \\right)^{2}}{n}}`
    (7.9) `${U = \\left( {\\sqrt{\\sum\\limits\_{i = 1}^{n}\\left( {A - P} \\right)^{2}}\\,}
    \\right)/\\left( {\\left( \\sqrt{\\sum\\limits\_{i = 1}^{n}A^{2}} \\right) + \\left(
    \\sqrt{\\sum\\limits\_{i = 1}^{n}P^{2}} \\right)} \\right)}`


    where `A` and `P` represent actual and predicted values, respectively. Number
    of observations is `n`.


    Error estimation for June data set using BPTT model is shown in [Table 7.6](#bodymatter-007.xhtml#b_9783110670905-007_tab_008).
    Using four clusters, there are four membership values and these are fed into the
    system as four external inputs. If we are using fifth order model then the number
    of layers in the unfolded network is five (i.e., `h = 5`) and membership values
    of previous five periods are fed into each layer of the network. In this case,
    RMSE value is 1.17. Similarly, other values are computed using different combination
    of sequence length (prior time steps) and clusters.


    June dataset ([Table 7.6](#bodymatter-007.xhtml#b_9783110670905-007_tab_008))
    produces minimum RMSE (0.99) in sixth order (`h = 6`) using four clusters. Using
    July dataset ([Table 7.7](#bodymatter-007.xhtml#b_9783110670905-007_tab_009)),
    minimum RMSE (1.13) is obtained in sixth order with six clusters. For August dataset
    ([Table 7.8](#bodymatter-007.xhtml#b_9783110670905-007_tab_010)), minimum RMSE
    (0.98) is in fifth order (`h = 5`) using three clusters. Using September dataset
    ([Table 7.9](#bodymatter-007.xhtml#b_9783110670905-007_tab_011)) minimum RMSE
    (1.23) is in seventh order with seven clusters and eight clusters. Using eight
    clusters in 8th order RMSE is 1.23 also.


    Table 7.7: Error estimation for July data set using BPTT model.


    | Error || Number of clusters || Order |

    | --- | --- | --- |

    | 5th || 6th || 7th || 8th |

    | RMSE || 4 || 1.18 || 1.19 || 1.23 || 1.31 |

    | 5 || 1.15 || 1.14 || 1.14 || 1.15 |

    | 6 || 1.18 || 1.13 || 1.34 || 1.34 |

    | Theil’s `U` statistic || 4 || 0.02 || 0.02 || 0.021 || 0.022 |

    | 5 || 0.021 || 0.02 || 0.02 || 0.02 |

    | 6 || 0.02 || 0.019 || 0.023 || 0.023 |


    Table 7.8: Error estimation for August data set using BPTT model.


    | Error || Number of clusters || Order |

    | --- | --- | --- |

    | 5th || 6th || 7th || 8th |

    | RMSE || 3 || 0.98 || 1.01 || 1.02 || 1.06 |

    | 4 || 1.13 || 1.18 || 1.16 || 1.12 |

    | 5 || 1.05 || 1.09 || 1.13 || 1.14 |

    | Theil’s `U` statistic || 3 || 0.017 || 0.018 || 0.018 || 0.019 |

    | 4 || 0.02 || 0.021 || 0.021 || 0.02 |

    | 5 || 0.019 || 0.019 || 0.02 || 0.02 |


