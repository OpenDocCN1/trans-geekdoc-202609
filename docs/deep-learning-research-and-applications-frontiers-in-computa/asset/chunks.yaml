    # 6.3 Timeline of algorithms used for audio signal processing and classification


    Research in audio signal processing and classification has been going on since
    a long time starting around the beginning of the twentieth century. Speech recognition
    (SR) was the main area of interest among other audio processing techniques. Environmental
    sound classification and music processing has gained interest more recently. It
    took years of research to reach to the neural network approach for audio classification
    that outperformed all the other then known techniques. Prior to that HMMs and
    other probabilistic models would be used both for classification and generation.
    These models are elaborated in this section along with their limitations.


    ## 6.3.1 Hidden Markov models


    HMMs are stochastic models that work on sequences. The main functions of HMMs
    include part-of-speech (POS) tagging, SR, and named entity tagging, among others.
    HMMs are derived from the Markov Chain model (MCM) which consists of a set of
    states `Q` = {`q`[0,]`q`[1],`q`[2], …, `q[N]`}, a transition matrix `A` as shown
    in eq. (6.9) and a start state (`q[0]`) and final state(`q[N]`).


    (6.9)$A = \\ \\begin{bmatrix} a\_{11} & \\ldots & a\_{1N} \\\\ \\vdots & \\ddots
    & \\vdots \\\\ a\_{N1} & \\cdots & a\_{NN} \\\\ \\end{bmatrix}$


    In the above equation `a[ij,]`, that is, the element in the `i^(th)` row and `j^(th)`
    column represents the probability of transition from state `i` to state `j`. The
    summation of probabilities from a state to all the other states is 1, as a result
    the summation of each row in the matrix is 1. The main property of the MCM is
    that the probability of being in a particular state is dependent solely on the
    previous state; as demonstrated by eq. (6.10).


    (6.10)*P*\[`X`[`t` + 1] = `x`[`t` + 1]|`X`[`t*] = `x`[`t*], `X`[`t` − 1] = `x`[`t` − 1], …, `X`[0] = `x`[0]\] = *P*\[`X`[`t` + 1] = `x`[`t` + 1]|`X`[`t*] = `x`[`t*]\]


    MCMs are useful when all the states in a model are completely visible to us and
    we are required to calculate the probability of a sequence of events. [Figure
    6.5](#bodymatter-006.xhtml#b_9783110670905-006_fig_005) shows a simple Markov
    model.


    ![Figure 6.5: A five state Markov model with state transition probabilities.](graphic/converted/b_9783110670905-006_fig_005.png)


    Figure 6.5: A five state Markov model with state transition probabilities.


    But there are quite many events that are not completely visible to us, for example,
    if we are to predict the weather outside from a room with closed windows and doors
    or we have to predict the color of a ball drawn from an urn containing balls of
    many colors. To be able to predict these events HMMs are introduced. There are
    `N` hidden states – {`S`[1],`S`[2], …, `S[N]`}, in a HMM and in most cases, each
    state can be reached from the other state. The state at time `t` is represented
    by `q[t]`. Each state contains `M` observations – {`v`[1],`v`[2], …, `v[M]`}.
    The state transition matrix denoted by eq. (6.9) is common for both MCMs and HMMs.
    In addition to that, HMMs have an observation symbol probability distribution,
    `B` = {`b[y]`(x)} that is indicative of the possibility of observation `v[x]`
    in state `q[y]`, where 1 ≤ x ≤ `M` and 1 ≤ `y` ≤ `N` as shown in eq. (6.11).


    (6.11)*b*[`y`](`x`) = *P*\[`v`[`x*] *a**t* *t*|`q`[`t*]\=`S`[`y*]\]


    Lastly, it is composed of the initial state probabilities that indicates the chances
    of being in a particular state at time `t` = 1, that is, the starting point. This
    is denoted by `π` and explained through eq. (6.12).


    (6.12) `π`[`i*] = *P*\[`q`[1]\=`S`[`i*]\] ; *w**h**e**r**e* 1 ≤ `i*` ≤ `N*`


    This entire model including `N`, `M`, `A`, `B` and `π` is denoted by `λ` and is
    shown in [Figure 6.6](#bodymatter-006.xhtml#b_9783110670905-006_fig_006). It is
    used to explain or account for any set of observation sequences, for example,
    given `λ`, HMMs can be used to calculate the probability of three consecutive
    rainy days starting from tomorrow. HMMs address three main problems:


    ### Problem 1:


    To compute the probability of an observation sequence `O` = {`O`[1],`O`[2], …,
    O`[T]`} over duration `T`, given `λ`. The most efficient solution to this problem
    that requires the least computation has been given by the `forward–backward algorithm`
    \[[29](#bodymatter-006.xhtml#b_9783110670905-006_ref_029), [30](#bodymatter-006.xhtml#b_9783110670905-006_ref_030)\].


    ### Problem 2:


    Choosing a state sequence `Q` = {`q`[1],`q`[2], …, `q[T]`}, that best explains
    an observation sequence `O`, given a model `λ`. The Viterbi algorithm best solves
    this problem \[[31](#bodymatter-006.xhtml#b_9783110670905-006_ref_031), [32](#bodymatter-006.xhtml#b_9783110670905-006_ref_032)\].


    ### Problem 3:


    Adjusting the model parameters to maximize the probability of a given observation,
    that is `P(O|λ)`. This problem is solved by the Baum–Welch method \[[33](#bodymatter-006.xhtml#b_9783110670905-006_ref_033)\]
    or gradient techniques \[[34](#bodymatter-006.xhtml#b_9783110670905-006_ref_034)\].


    ![Figure 6.6: An hidden Markov model with hidden states depicted in `X` and visible
    states depicted in `Y`. The hidden state probabilities are given in `a` and probability
    of a visible state from a hidden state is given in `b`.](graphic/converted/b_9783110670905-006_fig_006.png)


    Figure 6.6: An hidden Markov model with hidden states depicted in `X` and visible
    states depicted in `Y`. The hidden state probabilities are given in `a` and probability
    of a visible state from a hidden state is given in `b`.

