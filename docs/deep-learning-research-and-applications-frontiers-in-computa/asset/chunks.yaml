    ## Abstract


    Nowadays, handwritten document analysis using intelligent computing technology
    is a demanding research area, considering its usefulness in identifying a person
    and human characteristics, particularly that of persons having typical disabilities
    such as dyslexia, dysgraphia, and Parkinson’s disease. Analysis of handwriting,
    falling under the broad purview of graphology, helps us understand the writer’s
    psychology, emotional outlays, and noticeable disorders as well. Since there prevails
    a broad spectrum of cursive nature and high inconsistency of handwriting styles,
    the techniques for modern handwriting analysis need to be more robust and sensitive
    to different patterns compared to the traditional graphological techniques. Herein
    lies the necessity of computing technology, which should intelligently analyze
    handwritten texts to find out the similarity of finer aspects of handwritings
    of children or adult with some kind of learning/writing disability. Deep learning
    technology is chosen as the technical tool to identify and classify common features
    of handwriting of children with developmental dysgraphia. Variational autoencoder,
    a deep unsupervised learning technique, is presently used for this purpose. This
    chapter reports successful extraction and interpretation of significant number
    of distinguishable handwriting characteristics that are clinically proved to be
    symptoms of dysgraphia.


    Keywords: feature extraction, dysgraphia, handwriting analysis, variational autoencoder


    ## 5.1 Introduction


    There are so many electronic gadgets/tools available today, which are commonly
    used as digital platform for reading and writing, and as a medium of communication.
    Yet today, traditional medium like printed books, study materials, and handwritten
    documents are widely used and quite popular as learning or communication medium.
    Communication through writing on paper by hand remains the most basic mode though
    writing on digital screen by stylus is another useful mode. Therefore, handwriting
    skill needs to be acquired by one and all in their tender age as a part of the
    basic education. Handwriting is a complex task involving perceptual, attention-related,
    linguistic, and finer motor skills. Supposedly, handwriting is the foundation
    of all other educational errands such as jot notes, self-expression, and composition.
    The academic and behavioral progress of children is closely associated with prompt
    and significant development of reading and writing skills. Handwriting of every
    individual evolves with time on both qualitative and quantitative terms. Despite
    proper handwriting training, a significant percentage of children in the world,
    fail to grasp the skill and encounter difficulties in establishing their handwriting.
    This results in diminution of cognitive performance, weakening of self-esteem
    and so on. Therefore, detection and remediation of any kind of difficulty in handwriting
    at the earliest possible stage holds crucial importance.


    Most individuals facing conspicuous handwriting challenges owing to motor or sensory-motor
    weakness or disorder are considered to have dysgraphia \[[1](#bodymatter-005.xhtml#b_9783110670905-005_ref_001)\],
    a neurological disorder. The prefix “dys” implies the presence of impairment while
    the root word “graph” refers to the hand’s function in writing the letters similarly,
    the suffix “ia” means having a condition. Hence, dysgraphia can be defined as
    the unique condition of impaired letter writing by hand, that is, disabled handwriting.


    The term dysgraphia is often attributed to individuals having deficits in the
    following aspects in their writings:


    1. Accuracy in spellings


    2. Grammatical and punctuation accuracy


    3. Clarity or organization of written expression


    This neurodegenerative disorder commonly develops when children are in the initial
    stage of their introduction to handwriting. It can also occur following severe
    neurological trauma or may be found in a patient with physical impairments like
    ADHD, Tourette syndrome, learning disabilities, or an autism spectrum disorder
    such as Asperger’s syndrome. Apart from these, an individual can be suffering
    from dysgraphia without having any other disabilities. They are believed to be
    the victims of the cursed genes.


    Some of the general symptoms of dysgraphia are as follows:


    1. Lack of consistency in the case (upper/lower) of letters


    2. Sizes and shapes of letters are irregular and often they are incomplete


    3. Odd writing grip


    4. Several mistakes in spellings (sometimes)


    5. Significant change in speed of writing and copying


    6. Poor use of lines and spaces


    7. Reluctance or refusal to complete writing tasks


    8. Experience of physical pain in hand and/or arm while writing


    Dysgraphia can be widely classified into five types namely, dyslexic dysgraphia,
    motor dysgraphia, spatial dysgraphia, phonological dysgraphia, and lexical dysgraphia.
    As far as the present study is concerned, dyslexic, motor, and spatial dysgraphia
    are of primary interest as these are characterized by poor handwriting. Dyslexic
    dysgraphia affects an individual’s spontaneous writing and spelling. Motor dysgraphia
    is characterized by poor writing (both spontaneous and copied), bordering on illegible
    and slanted writing which may be attributed to lack of fine motor skills. Spatial
    dysgraphic patients often face difficulty in maintaining uniform skew for lines
    and uniform gap between words. However, patients may suffer from multiple type
    of dysgraphia and the symptoms may differ from individual to individual.


    VAE (variational autoencoder) has been used in this chapter. VAE \[[2](#bodymatter-005.xhtml#b_9783110670905-005_ref_002)\]
    is nothing but a neural network model that immediately adapts and adopts an inference
    model for deduction of imperceptible features of image data and initiates a generative
    model to produce images from those deduced features. Earlier, authors \[[3](#bodymatter-005.xhtml#b_9783110670905-005_ref_003)\]
    have successfully generated different clusters of characters having similar handwriting
    features using MNIST, a handwritten numeric dataset. Moreover, VAE can produce
    characters when alphabet dataset is used having more classes than MNIST. Hence,
    the same process has been applied on the current dataset to generate the generative
    model. However, the features of the handwritings in the dataset could not be perfectly
    captured since they are more complex when compared with the handwritten numerals
    of MNIST, as the character image was mapped into a one-dimensional vector.


    ## 5.2 Background


    Except a few unfortunate children, majority of children are able to master the
    handwriting skills essential for copying or penning down their own thoughts. Their
    handwriting is intelligible and the handwriting process \[[4](#bodymatter-005.xhtml#b_9783110670905-005_ref_004),
    [5](#bodymatter-005.xhtml#b_9783110670905-005_ref_005)\] is carried out with comfort
    and ease. It is by the age of six a child begins to get habituated with the form
    of the letters and an approximate 2 years of formal education provides handwriting
    experience, which leads to stable and effective handwriting by the age of 8 \[[6](#bodymatter-005.xhtml#b_9783110670905-005_ref_006)\].
    Now children who fail to adopt and develop handwriting proficiency by that age
    faces developmental dysgraphia \[[7](#bodymatter-005.xhtml#b_9783110670905-005_ref_007),
    [8](#bodymatter-005.xhtml#b_9783110670905-005_ref_008)\].

