    ]. An RBM comprises of a single layer of binary visible units, ʋ, and another\
    \ layer of binary hidden units, ɧ. It is called restricted because of its bipartite\
    \ nature, that is, there are no intralayer connections. Sampling and fragmentation\
    \ are a pre-requisite for any classification technique. Similarly, *ʋ* embodies\
    \ a particular fragment containing *ȵ* samples. This entire model can be represented\
    \ as ϴ = {ձ,ճ,ω}. The energy of the joint architecture is given in eq. (6.31),\
