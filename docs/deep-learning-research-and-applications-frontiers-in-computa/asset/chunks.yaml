    CNN，会捕捉到更多语义特征。他们使用网络早期层的激活作为内容参考。在这种方法中，风格迁移涉及优化一个随机初始化的图像，使其具有与风格图像相似的激活格拉姆矩阵，以及与所需内容图像在早期层中相似的激活。请注意，网络仅用作特征提取器，未进行优化。这种方法的一个缺点是耗时较长，因为对于每个内容图像，优化过程都必须重新执行。Johnson
