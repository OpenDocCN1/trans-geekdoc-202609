    # Arica and Vural proposed an offline character recognition system


    Arica and Vural proposed an offline character recognition system by using minimal
    preprocessing operations to restrict loss of essential information \[[11](#bodymatter-003.xhtml#b_9783110670905-003_ref_011)\].
    They used an efficient segmentation algorithm for detecting character boundary,
    slant angle, lower and upper baseline, stroke width, and height from a grayscale
    image. Hidden Markov model (`HMM`) was used to estimate the system parameters
    as well as some feature space parameters. `HMM` was used to determine the rank
    of the character based on the features of character shape. Khedher et al. described
    that selection of good features provides better accuracy for any character recognition
    system \[[12](#bodymatter-003.xhtml#b_9783110670905-003_ref_012)\]. They discussed
    how different good features were selected for recognizing Arabic handwritten characters.
    They used a real sample of handwritten characters. The average recognition accuracy
    was 88% for the Arabic numbers and 70% for the Arabic letters. Hanmandlu and Murthy
    implemented a fuzzy model in the form of membership values for recognition of
    handwritten English and Hindi numbers \[[13](#bodymatter-003.xhtml#b_9783110670905-003_ref_013)\].
    The membership function in the fuzzy set was adapted by optimization of entropy.
    The accuracy of the model was 95% for Hindi digits and 98.4% for English digits.
    Arora et al. implemented a system for the recognition of Devanagari character
    \[[14](#bodymatter-003.xhtml#b_9783110670905-003_ref_014)\]. Four features were
    extracted from the shadow, straight line fitting, intersection, and chain code
    histogram using box approach. The features of shadow were extracted from all portion
    of the image and the features of chain code histogram, intersection, and straight-line-fitting
    were extracted by partitioning the image into subimage. The system was tested
    using 4,900 Devanagari characters and the accuracy was 92.8%. Kimura implemented
    a system for character recognition that used features selection using a genetic
    algorithm \[[15](#bodymatter-003.xhtml#b_9783110670905-003_ref_015)\]. He selected
    the genes in such a way that the recognition rate of training data should not
    exceed the predefined threshold. So, the system was adopted as a reduction ratio
    for selecting the number of features. Graves and Schmidhuber developed a multidimensional
    `RNN` model for Arabic handwriting character recognition. They participated in
    the ICDAR word recognition competition in 2007 and the accuracy was 91% for the
    IFN/ENIT database \[[16](#bodymatter-003.xhtml#b_9783110670905-003_ref_016)\].
    `MLP` was used by Pal and Singh for recognizing handwritten English characters
    \[[17](#bodymatter-003.xhtml#b_9783110670905-003_ref_017)\]. They extracted the
    features using character boundary tracing and Fourier descriptors. The system
    classified each character by comparing features and shape of the character. They
    did an investigation to get better accuracy for character classification by using
    the optimized number of hidden layers. They reported 94% recognition accuracy
    for handwritten English characters. Pradeep et al. extracted the diagonal features
    for offline character recognition \[[18](#bodymatter-003.xhtml#b_9783110670905-003_ref_018)\].
    The system was based on a neural network model and they used two approaches by
    using 54 features and 69 features to implement this recognition system. They reported
    that the accuracy of offline character recognition was 97.8% for using 54 features
    and 98.5% for using 69 features. Neves et al. proposed an offline handwritten
    digit recognition system using a support vector machine and declared that it provided
    better accuracy compared to `MLP` \[[19](#bodymatter-003.xhtml#b_9783110670905-003_ref_019)\].
    The experiment was done on an NIST SD19 standard dataset. They reported that,
    `MLP` is capable of distinguishing nonlinear separable classes, but it could not
    achieve an optimal solution due to being stuck in local minima. So, an `MPL` might
    not be able to provide higher accuracy for digit recognition. Gaurav and Bhatia
    proposed a technique that deals with the various preprocessing techniques which
    are detection and correction of skew, contrast stretching, conversion into a binary
    image, removal of noise, segmentation, and morphological operation for character
    recognition \[[20](#bodymatter-003.xhtml#b_9783110670905-003_ref_020)\]. The technique
    was used for the handwritten document containing a color background with different
    intensities. They concluded that a single technique is not sufficient for character
    recognition from the varied intensities background image. Deep learning was used
    in a broad range of applications for its consistent performance in computer vision
    and machine learning \[[21](#bodymatter-003.xhtml#b_9783110670905-003_ref_021)\].
    Hu et al. implemented an OCR system and a face recognition system using a `DNN`
    and a `CNN`, which gave better accuracy than other systems. `DNNs` and `CNNs`
    provided a great opportunity for growing the applications of deep learning. They
    used the system for solving the problem of face recognition for security problems
    in Jordan. They achieved great success for face recognition. Ghazi and Ekenel
    demonstrated the model of VGG-Face and lightened CNN on five benchmark datasets.
    They reported that preprocessing can improve the performance in spite of having
    a small alignment of face or character \[[22](#bodymatter-003.xhtml#b_9783110670905-003_ref_022)\].
    The method showed favorable performance with accuracy up to 98.46% on MNIST dataset.
    Using CNN, preprocessing of image/data and handcrafted features extraction was
    not required. Younis and Alkhateeb implemented a face recognition system using
    a deep `CNN` on a face dataset, which was captured from different persons in University
    of Jordan \[[23](#bodymatter-003.xhtml#b_9783110670905-003_ref_023)\]. They implemented
    the system in the environment of Tensorflow and Keras. The accuracy of face classification
    was acceptable after 80 epochs which took a very low amount of time.


    # 3.4 Overview of MLP, CNN, and RNN


    `MLP` network has been used for a long time in pattern recognition, which used
    the hand-crafted features for pattern classification. A huge amount of time is
    required for selection of best features for a particular application. The best
    features are also called hand-crafted features. The hand-crafted features are
    fully dependent on some applications but it may not be applicable for other applications.
    Deep learning (`DL`) was a revolution in the field of neural networks, which uses
    huge number of layers for training the network to achieve better accuracy. `DL`
    consists of one input layer, a series of hidden layers, and one output layer for
    features extraction and features classification. `DL` tries to extract more features
    automatically through multiple stage of feature learning process. Researchers
    have proposed numbers of neural networks as modifications of existing model or
    a new model. They have generally recommended `MLP`, `CNN`, and `RNN` for consistent
    performance in broad range of applications.


    ## 3.4.1 Multilayer perceptron

