    # 7 时间反向传播算法在温度预测中的应用


    Mahua Bose 卡利亚尼大学计算机科学与工程系，西孟加拉邦，印度，卡利亚尼 Kalyani Mali 卡利亚尼大学计算机科学与工程系，西孟加拉邦，印度，卡利亚尼


    ## 摘要


    在深度学习中，数据在输入层和输出层之间的前馈网络中通过多个层进行传输。在循环网络中，数据可能多次通过一个层。时间反向传播（BPTT）技术用于训练循环网络（`RNN`）。BPTT
    的基本思想是将循环网络转换为展开的前馈网络（多层网络），其中使用常规反向传播学习进行梯度计算。在这里，展开网络的每一层代表一个时间步。本研究的目标是将 BPTT
    的概念集成到模糊时间序列预测框架中。该模型将先前值的序列作为输入（模糊输入）传递到展开网络的不同层，并产生模糊输出。使用温度数据集来评估模型的性能，BPTT
    的预测精度优于反向传播神经网络模型。


    关键词：`fuzzy set`, `layer`, `neural network`, `order`, `unfolding`


    ## 7.1 引言


    深度学习技术适用于图像和语音处理、模式识别、生物信息学等不同领域。最近，它也被用于季风降雨预测 `[1, 2]`。本研究的目标是在模糊时间序列（`FTS`）预测的背景下应用深度学习。


    '
