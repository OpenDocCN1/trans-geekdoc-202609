    | September || 0.019 || 0.026 || 0.025 || 0.028 |


    从比较研究（使用 RMSE 值）与 BPNN 模型来看，可以看出，使用模糊输入的 BPTT 模型对三个数据集（六月、七月和九月）产生了更好的结果。对于八月数据集，改进幅度较小
