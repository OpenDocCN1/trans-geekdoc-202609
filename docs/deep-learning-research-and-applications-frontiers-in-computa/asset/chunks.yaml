    # 4 Impact of Deep Neural Learning on Artificial Intelligence Research


    Amit Adate School of Computer Science and Engineering, Vellore Institute of Technology,
    Vellore, India. Dhruv Arya School of Computer Science and Engineering, Vellore
    Institute of Technology, Vellore, India. Aditya Shaha School of Computer Science
    and Engineering, Vellore Institute of Technology, Vellore, India. B. K. Tripathy
    School of Information Technology and Engineering, Vellore Institute of Technology,
    Vellore, India.


    ## Abstract


    Deep learning techniques have had a huge impact on artificial intelligence research.
    They have improved upon the traditional machine learning techniques where human
    expertise was required for feature engineering. By removing one human factor,
    they have moved us one step forward in the field of artificial intelligence. They
    have not entirely removed humans, though. They are required for designing the
    architectures and cleaning the data. Deep learning techniques have managed to
    achieve breakthrough results in domains such as speech recognition, machine translation,
    image recognition, and object detection. This chapter gives a brief overview of
    various deep learning techniques being used today. Techniques that make deep learning
    more effective have been described. Some interesting applications have also been
    covered.


    Keywords: deep learning, artificial intelligence, artificial neural networks,
    deep learning applications


    ## 4.1 Introduction


    Modeling the functions of the human brain is the core challenge of artificial
    intelligence research. The human brain is able to create complex models of the
    world that it observes and extrapolates from it. Furthermore, it is very robust
    in its functioning. It only takes the brain a few experiences to learn about a
    new entity. By looking at a banana once, humans are able to recognize bananas
    in different shapes and sizes. Artificial intelligence researchers have been trying
    to tackle such problems for decades now. The increase in computational and storage
    capacity has allowed researchers to come up with methods that deal with very high
    dimensional inputs. Deep learning research has also been helped by the availability
    of high-quality datasets. This chapter provides a brief overview of deep learning
    approaches. These have been discussed keeping in mind the impact of deep learning
    on artificial intelligence research and applications. First, some deep learning
    models are briefly described, and then some techniques that have led to the success
    of deep learning have been discussed. Next, some frameworks that aid the development
    of deep learning models have been presented, after which some interesting applications
    are covered. Finally, some areas of research of deep learning are presented which
    might become the focus of the coming years.


    ## 4.2 Convolutional neural models


    Convolutional neural networks (CNN) are a class of deep neural networks (DNN)
    which were built with the motive of achieving minimal preprocessing. Although
    they have performed exceptionally well in the domains of image processing they
    can be used to analyze any time-series data. The success of the CNNs can be attributed
    to the comparatively lesser preprocessing required by them which reduces human
    effort and any requirement of the domain knowledge to hand-engineer the features.
    The connectivity pattern between the neurons in a CNN is inspired from animal
    visual cortex in which a neuron only responds to a stimuli in a fixed region of
    the visual field known as the receptive field. In the convolution operation, the
    first argument is the input (in the formula the function `x`) and the second argument
    is a kernel (in the formula `w`). The output is referred to as a feature map.
    Instead of handcrafting features for an input space, we learn the convolution
    operation weights that work as feature extractors:


    (4.1) $P_{new}s(t) = \sum_{a = 0}^{n}x(a)w(t - a)$


    which can be equivalently written as


    (4.2) $s(t) = (x * w)(t)$


    where `*` is the convolution operator.


    CNNs differ from the conventional neural networks in a way that they have the
    properties of sparse connectivity, weight sharing and translation equivariance
    \[[1](#bodymatter-004.xhtml#b_9783110670905-004_ref_001)\]. Recently CNNs have
    been successfully applied in many domains such as object detection, image classification,
    segmentation, text classification, speech recognition, and so on.


    ## 4.3 Recurrent neural networks


    Most machine learning models have not been designed with sequential data in mind.
    That is not to say that they do not work with sequential data at all. Support
    vector machines, fully connected feedforward neural networks, and so on can be
    trained to work with sequential data of fixed size. However, that is where the
    problem lies, it makes it difficult for us to deal with data that has long-term
    dependencies. Most texts have such dependencies in them. Neural networks trained
    for classifying texts of length 100 would not work with texts of length 200. Furthermore,
    most existing models have been designed while assuming that the data points are
    independent of each other. Clearly, this is not a valid assumption for valid data
    where dependencies exist between all units.


    Recurrent neural networks (RNNs) have managed to overcome these problems to an
    extent. As the name implies, the computational units in these networks have a
    recurrent connection. These networks process sequential data one unit at a time.
    They maintain a set of activations for each step and are able to selectively pass
    information across these steps. They have been designed while keeping sequential
    data in mind.

