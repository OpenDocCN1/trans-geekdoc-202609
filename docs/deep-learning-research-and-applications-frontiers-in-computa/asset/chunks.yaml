- raw: "In this study, epochwise BPTT algorithm \\[[15](#bodymatter-007.xhtml#b_9783110670905-007_ref_015)\\\
    ] is applied for forecasting high-order FTS. Computation is done by truncating\
    \ the backward propagation of information to a predefined number of time steps.\
    \ So this model is a combination of epochwise BPTT and truncated BPTT \\[[Figure\
    \ 7.2](#bodymatter-007.xhtml#b_9783110670905-007_fig_002)\\]. Steps of the proposed\
    \ BPTT-based approach are as follows.\n\n![Figure 7.2: Epochwise BPTT (truncated).](graphic/converted/b_9783110670905-007_fig_002.png)\n\
    \nFigure 7.2: Epochwise BPTT (truncated).\n\nStep 1.\n\n: \n\nApply fuzzy c-means\
    \ (FCM) algorithm \\[[18](#bodymatter-007.xhtml#b_9783110670905-007_ref_018)\\\
    ] to create “*k*” clusters and obtain fuzzy membership value of each datapoint\
    \ in each cluster.\n\nStep 2.\n\n: \n\nChoose number of prior time steps “*h*.”\
    \ Here, this is equal to the number of order of the model.\n\nStep 3.\n\n: \n\n\
    Apply truncated version of epochwise BPTT as described below.\n\nLet us consider,\
    \ total number of datapoints (total time period) is “MAX” and number of prior\
    \ time steps is “h.” Each layer of the unfolded network takes fuzzy membership\
    \ values as input.\n\nAlgorithm:\n\n3.1. Initial activation = 0; iteration= 0.\n\
    \n3.2. *t* = 1;\n\n3.3. Repeat steps 3.4–3.9 until *t* ≤ MAX-*h*\n\n3.4. *t*[0 ]\\\
    = t; repeat steps 3.5–3.6 until *t*[0 ]< *t* + *h*\n\n3.5. Calculate output values\
    \ in the forward pass using [eqs. (7.1)](#bodymatter-007.xhtml#b_9783110670905-007_eq_001)–[(7.3)](#bodymatter-007.xhtml#b_9783110670905-007_eq_003).\n\
    \n3.6. *t*[0 ]\\= *t*[0] + 1.\n\n3.7. Proceed in the backward direction repeating\
    \ [eqs. (7.4)](#bodymatter-007.xhtml#b_9783110670905-007_eq_004) and [(7.5)](#bodymatter-007.xhtml#b_9783110670905-007_eq_005).\n\
    \n3.8. Update each connection weight using [eq. (7.6](#bodymatter-007.xhtml#b_9783110670905-007_eq_006)).\n\
    \n3.9. *t* = *t* + 1.\n\n3.10. Iteration = Iteration + 1\n\n3.11. If Iteration < maximum\
    \ iteration, go to step 3.2, else stop.\n\nStep 4.\n\n: \n\nDefuzzification:\n\
    \nLet us consider that *m* clusters are created in the dataset. If the output\
    \ membership values are *µ*[1], *µ*[2], … … …, *µ[m]*. and corresponding centers\
    \ of the clusters are *c*[1], *c*[2], … … …, *c[m]*. Then,\n\n(7.7)${Output} =\
    \ \\\\frac{\\\\sum\\_{i = 1}^{m}c\\_{i}\\\\mu\\_{i}}{\\\\sum\\_{i = 1}^{m}\\\\\
    mu\\_{i}}$ \n\n### Example:\n\nLet us consider temperature (August) data set.\
    \ Fuzzy C-means algorithm is applied to create three clusters. Membership values\
    \ are shown in [Table 7.1](#bodymatter-007.xhtml#b_9783110670905-007_tab_003).\
    \ Number of input units and processing units are three in this case. Now for the\
    \ fifth order model, number of prior time steps *h* = 5.\n\nNow, the following\
    \ sequence of membership values is fed into the system. Each layer of the unfolded\
    \ network represents a time step. Each of three membership values is fed into\
    \ the input layer of the network through three nodes.\n\n| Time || External input\
    \ |\n\n| --- | --- |\n\n| *t* = 1 || (0.71 0.25 0.04) |\n\n| *t* = 2 || (0.01\
    \ 0.05 0.95) |\n\n| *t* = 3 || (0.01 0.05 0.95) |\n\n| *t* = 4 || (0 0.02 0.98)\
    \ |\n\n| *t* = 5 || (0.02 0.11 0.87) |\n\nFinal output is compared with the values\
    \ at *T* = 6, that is, (0.03 0.22 0.75). Back propagation is done and weights\
