    图 1.17：IBM Watson Studio 子部分。(a) 项目（新建和现有）子部分，(b) 创建新项目，以及 (c) 服务（新建和现有）子部分。


    一旦项目创建完成，管理员可以向其中添加数据资产以便处理该数据。数据资产可以从本地文件、社区和数据库连接中添加。项目中的所有协作者均自动获得访问项目中数据的授权。将原始数据添加到项目后，数据需要进行精炼，这包括清洗和整形。清洗可以通过删除不正确、不完整、格式不当或重复的数据来完成。而数据整形可以通过过滤、排序、合并或删除列，以及执行操作来完成。精炼后的数据即可用于分析和可视化
    \[14\]。


    ## 1.7 结论


    在本章中，已说明 AI、ML 和 DL 之间关系的概述。同时，讨论了在现代将 DL 视为最先进技术的原因。重点是突出市场上不同供应商提供的不同云平台。在第
    1.6 节中，已描述了使用 IBM Watson Studio 进行 ML 的不同步骤，包括数据集管理和清洗原始数据。未来研究可以考虑对多个组织提供的 ML
    平台在性能、准确性、24 × 7 可用性和用户友好性方面进行比较讨论。


