    # 第六章 音频信号处理简介


    第五代计算机预计能够自主思考、分析和行动。我们更倾向于下达指令并获得快速响应。谁能想到说出“OK Google, play me some JAZZ”就能为你播放爵士音乐，而无需专门搜索该流派。你也可以告诉
    Alexa（亚马逊推出的个人助理）为你打开风扇，而无需离开沙发的舒适环境。这些迷人的进步得益于音频信号处理。它不仅可用于炫酷的应用，环境声音分类 \[[15](#bodymatter-006.xhtml#b_9783110670905-006_ref_015)\]
    还使得可以知道信号录制的环境类型。这有助于从最后一次电话中定位受害者，或对视频进行标注。已有实验对不同鸟类的声音、婴儿哭声 \[[16](#bodymatter-006.xhtml#b_9783110670905-006_ref_016)\]
    进行分类以区分正常和病理性哭声、分类乐器、识别说话人等。研究音频信号的各种特征，结合特征提取和使用机器学习算法进行适当训练，使这一切成为可能。下一节将详细介绍音频信号的细节。[Figure
    6.1](#bodymatter-006.xhtml#b_9783110670905-006_fig_001) 显示了一个音频波形。


    ![Figure 6.1: An audio waveform.](graphic/converted/b_9783110670905-006_fig_001.jpg)


    Figure 6.1: An audio waveform.


    ## 6.2.1 音频信号


    声音的基本定义是，它是一种振动，基本上沿任何介质纵向传播，并在固体中既作为纵向波也作为横向波传播。在 *纵向波* 中，介质的粒子沿波传播方向振动，方向可能相同或相反。这种运动导致压缩和稀疏区域，从而引起压力变化区域，因此这些波也被称为
    *压力波或压缩波*，如 [Figure 6.2](#bodymatter-006.xhtml#b_9783110670905-006_fig_002) 所示。


    ![Figure 6.2: Depiction of a longitudinal wave.](graphic/converted/b_9783110670905-006_fig_002.png)


    Figure 6.2: Depiction of a longitudinal wave.


    另一方面，在 *横向波* 中，介质中的粒子沿垂直于波传播方向的方向移动，如 [Figure 6.3](#bodymatter-006.xhtml#b_9783110670905-006_fig_003)
    所示。波按各种特征定义——对于纵向波，粒子浓度最高的区域称为 *压缩*，粒子浓度最低的区域称为 *稀疏*；对于横向波，*波峰* 是粒子最大向上运动的区域，*波谷*
    是粒子最大向下运动的区域。运动相对于粒子的静止位置。对于任何波，两个连续波峰或波谷之间，或两个压缩或稀疏之间的距离称为波长。波的 *频率* 是单位时间内通过介质中固定点的波数。波长越短，频率越高，音频的
    *音高* 也越高。高音频比低音频听起来更尖锐。波的 *振幅* 是粒子从其平均或静止位置的最大位移，是 *响度* 和 *强度* 的度量。振幅越大，声音听起来越响。区分
    *音符* 和 *噪音* 的是其波形的有序重复性。以间隔重复的波形比不规则且不重复的波形更悦耳，后者构成非常令人不快的噪音。声音波的 *音色* 或 *音质*
    由波形决定。在频率不变的情况下，如果波形改变，会感知到不同音高的不同声音；这一特性在电子音乐中被更多探索，通过调制波形产生各种声音。前述内容只是对波形结构的简要概述。关于人类如何听觉的机制细节，请参阅
    \[[17](#bodymatter-006.xhtml#b_9783110670905-006_ref_017)\]。音量、噪音和声音感知的主观性在不同个体之间有所差异，与本文讨论的各种音频信号处理技术用于特征提取和分类的背景无关。下一节将详细介绍音频波的各种特征及其提取方法。


    ![Figure 6.3: Depiction of a transverse wave.](graphic/converted/b_9783110670905-006_fig_003.png)


    Figure 6.3: Depiction of a transverse wave.


    ## 6.2.2 特征提取方法


    机器通过训练来学习。首先让它们熟悉需要处理的输入类型，并告知其确切含义。这是描述监督学习的最简单方式。因此，在音频分类中，分类算法会输入一组与每个音频片段对应的相关特征，以及一个标签，指示原始音频中的单词、句子或音乐音符。当需要分类新样本时，程序从新样本中提取特征，并输出这些特征所属的最近类别。音频特征大致可分为
    *物理* 和 *感知* 特征 \[[18](#bodymatter-006.xhtml#b_9783110670905-006_ref_018)\]。每个大类别可进一步细分为时域、频域、小波域、图像域和倒谱域。在许多音频分类系统中，有一个环节会从人类那里获取相关性反馈，因此，必须考虑感知特征，因为人类感知声音的方式与声音的物理特性截然不同。因此，要么提取感知特征，要么提取与感知特征相关的信号特征
    \[[19](#bodymatter-006.xhtml#b_9783110670905-006_ref_019)\]。

