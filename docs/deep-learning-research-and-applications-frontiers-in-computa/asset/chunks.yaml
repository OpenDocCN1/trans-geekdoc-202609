    # 1 Deep Learning – A State-of-the-Art Approach to Artificial Intelligence


    Soumyajit Goswami IBM India Private Limited, Salt Lake, Sector V, Kolkata, West
    Bengal, India


    ## Abstract


    This chapter presents various cloud platforms that are available in market offerings
    from different vendors. IBM provided a machine learning (ML) platform “IBM Watson
    Studio” (formerly “Data Science Experience”), and this is considered here for
    the field of study. An overview of artificial intelligence, ML, and deep learning
    (DL) with their relationship is deliberated. Discussion on popular DL architectures
    with elementary comparison is also considered.


    Keywords: Artificial intelligence, machine learning, deep learning, IBM Watson
    Studio (formerly, Data Science Experience or DSX),


    ## 1.1 Introduction


    Deep learning (DL), the subfield of artificial intelligence (AI), is the most
    promising area considered for research and industry. Although DL is a very modern
    topic, it is already being used by multiple technology giants to fulfill their
    needs. Few examples are voice and image recognition algorithms of Google \[[1](#bodymatter-001.xhtml#b_9783110670905-001_ref_001)\]:
    Netflix and Amazon use it to decide \[[2](#bodymatter-001.xhtml#b_9783110670905-001_ref_002)\]
    which video a person desires to watch or purchase in near future, upcoming forecast
    by MIT researchers \[[3](#bodymatter-001.xhtml#b_9783110670905-001_ref_003)\],
    and Facebook uses it to predict future actions for advertisers \[[4](#bodymatter-001.xhtml#b_9783110670905-001_ref_004)\].
    UCLA researchers have manufactured an advanced microscope that produces a high-dimensional
    dataset used to train a DL network in identifying cancer cells in tissue samples
    \[[5](#bodymatter-001.xhtml#b_9783110670905-001_ref_005)\]. In a nutshell, it
    has been used nowadays everywhere whenever automation comes into picture.

