    \ 和 `h^(n→)`，每个层接收来自前一层两个序列的输入。\n\n```\n(6.29) h[t]^(n) = Ƕ([h^(n-1)h^(n)]h[t]^(n-1)\
    \ + W[h^(n)h^(n)]h[t-1]^(n) + b[h]^(n))\n(6.30) y[t]^() = W[h^(N)y]h[t]^(N) +\
    \ b[y]\n```\n\n网络被训练以直接从声学输入 `x` 预测音素。给定输入序列的所有可能音素的条件概率 `Pr(y|x)` 被计算，目标输出序列\
