    # 3 Handwritten Digit Recognition Using Convolutional Neural Networks


    Ranjan Jana RCC Institute of Information Technology, Kolkata, West Bengal, India
    Siddhartha Bhattacharyya CHRIST (Deemed to be University), Bangalore, Karnataka,
    India Swagatam Das Indian Statistical Institute, Kolkata, West Bengal, India.


    ### Abstract


    Optical character recognition (OCR) systems have been used for extraction of text
    contained in scanned documents or images. This system consists of two steps: character
    detection and recognition. One classification algorithm is required for character
    recognition by their features. Character can be recognized using neural networks.
    The multilayer perceptron (`MLP`) provides acceptable recognition accuracy for
    character classification. Moreover, the convolutional neural network (`CNN`) and
    the recurrent neural network (`RNN`) are providing character recognition with
    high accuracy. `MLP`, `RNN`, and `CNN` may suffer from the large amount of computation
    in the training phase. `MLP` solves different types of problems with good accuracy
    but it takes huge amount of time due to its dense network connection. `RNN`s are
    suitable for sequence data, while `CNN`s are suitable for spatial data. In this
    chapter, a `CNN` is implemented for recognition of digits from MNIST database
    and a comparative study is established between `MLP`, `RNN`, and `CNN`. The `CNN`
    provides the higher accuracy for digit recognition and takes lowest amount of
    time for training the system with respect to `MLP` and `RNN`. The `CNN` gives
    better result with accuracy up to 98.92% as the MNIST digit dataset is used, which
    is spatial data.


    Keywords: `convolutional neural network`, `deep neural network`, `handwritten
    digit recognition`, `multilayer perceptron`, `optical character recognition`,
    `recurrent neural network`


    ## 3.1 Introduction


    Optical character recognition (`OCR`) translates the handwritten text image or
    printed text image into normal text. The text images are generally from images
    of a text document \[[1](#bodymatter-003.xhtml#b_9783110670905-003_ref_001)\].
    `OCR` is a significant area in many computer vision problems like automatic number
    plate recognition, extracting business card information, and data entry for passport,
    cheque, and invoice documents. `OCR` is mostly an offline process, which converts
    text from a static document. Movement of handwriting can be used for handwriting
    character recognition \[[2](#bodymatter-003.xhtml#b_9783110670905-003_ref_002)\].
    In online character recognition, instead of using the shape of the characters
    or words, the direction and pressure on pen can be used for extra information
    to make the process more efficient. `OCR` is a mechanism that classifies the character
    or word belonging in a text image. The character recognition from text image is
    processed through character segmentation, features extraction, and features classification.
    Introduction of multilayer perceptron (`MLP`) has been an outbreak for data classification
    in computer vision \[[3](#bodymatter-003.xhtml#b_9783110670905-003_ref_003)\],
    although the performance of `MLP` fully depended on appropriate features of the
    object for classification \[[4](#bodymatter-003.xhtml#b_9783110670905-003_ref_004),
    [5](#bodymatter-003.xhtml#b_9783110670905-003_ref_005)\]. The classical machine
    leaning technique has been revolutionized by deep neural networks (`DNN`s). This
    network works on the raw pixel data to extract appropriate features for classification
    \[[6](#bodymatter-003.xhtml#b_9783110670905-003_ref_006)\]. `DNN` is designed
    with a huge number of hidden layers and connections. So, the network has many
    numbers of parameters and it takes huge numbers of training samples to prevent
    overfitting. `DNN` architectures are mainly classified into convolutional neural
    network (`CNN`) and recurrent neural network (`RNN`) to solve the problems of
    various computer vision tasks. For extraction of position-invariant features,
    `CNN` is generally used, where `RNN` is used for modeling the network in sequence
    data \[[7](#bodymatter-003.xhtml#b_9783110670905-003_ref_007)\]. `CNN` has fewer
    numbers of parameters compared to a fully connected neural network \[[8](#bodymatter-003.xhtml#b_9783110670905-003_ref_008)\].
    `CNN` is able to model the data by changing the number of hidden layers and the
    number of trainable parameters of each layer \[[9](#bodymatter-003.xhtml#b_9783110670905-003_ref_009)\].
    `CNN` can design versatile nonlinear relationship between input and output with
    local receptive field and temporal subsampling to provide a degree of shift, rotation,
    and distortion invariance \[[10](#bodymatter-003.xhtml#b_9783110670905-003_ref_010)\].
    In a neural network, `CNN` is formed by a series of convolution and pooling layers
    between input and output layers. A fully connected layer is performed for generating
    unique representation of the input data in the last layer of the network. In this
    chapter, the comparison of performances is made for `MLP`, `RNN`, and `CNN` methods
    on the MNIST dataset. `CNN` provides better results compared to `MLP` and `RNN`.


    This chapter is organized as follows. The motivation for handwritten digit recognition
    is discussed in [Section 3.2](#bodymatter-003.xhtml#b_9783110670905-003_s_003_s_002).
    Related works are presented in [Section 3.3](#bodymatter-003.xhtml#b_9783110670905-003_s_003_s_003)
    and the overview of `MLP`, `CNN`, and `RNN` architecture are discussed in [Section
    3.4](#bodymatter-003.xhtml#b_9783110670905-003_s_003_s_004). The implementation
    details of the system are described in [Section 3.5](#bodymatter-003.xhtml#b_9783110670905-003_s_003_s_005).
    Experimental results are shown in [Section 3.6](#bodymatter-003.xhtml#b_9783110670905-003_s_003_s_006).
    Finally, the conclusions are derived in [Section 3.7](#bodymatter-003.xhtml#b_9783110670905-003_s_003_s_007).


    ## 3.2 Motivation for handwritten digit recognition


    The handwriting characters recognition technique was started around 1980. The
    task of handwritten digit recognition using a classifier has a great importance
    in machine learning. Handwriting character recognition is generally important
    for zip code recognition for postal mail sorting, processing of bank check, extraction
    of numeric entries in handwritten filled-up forms, and number plate recognition
    of any vehicle. The handwritten digits are different in size, alignment, and thickness
    for different time even for the same writer. Handwriting of different individuals
    for same digit are different that influences the appearance of the digits. So,
    there are many challenges that need to be faced to implement handwritten character
    recognition. The common problem in digit recognition is to predict the digits
    in spite of their similarity like 3 and 5, 9 and 4, 8 and 9, 5 and 6 as shown
    in [Figure 3.1](#bodymatter-003.xhtml#b_9783110670905-003_fig_001). The aim of
    this chapter is to implement a method for recognition of handwritten digits with
    varying size, thickness, and orientation.


    ![Figure 3.1: Similarity of digits.](graphic/converted/b_9783110670905-003_fig_001.jpg)


    Figure 3.1: Similarity of digits.


