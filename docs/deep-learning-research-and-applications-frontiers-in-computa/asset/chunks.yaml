    # 7 Backpropagation Through Time Algorithm in Temperature Prediction


    Mahua Bose Department of Computer Science and Engineering, University of Kalyani,
    Nadia, West Bengal, India Kalyani Mali Department of Computer Science and Engineering,
    University of Kalyani, Nadia, West Bengal, India


    ## Abstract


    In deep learning, data is transmitted through a number of layers in the feedforward
    network between input and output layers. In a recurrent network, data may propagate
    through a layer several times. Backpropagation through time (BPTT) technique is
    used to train recurrent networks (`RNN`). The underlying idea of BPTT is to transform
    a recurrent network into an unfolded feedforward network (multilayer network)
    where conventional backpropagation learning is used for gradient calculation.
    Here, each layer of the unfolded network represents a time step. The objective
    of this study is to integrate concept of BPTT in the framework of fuzzy time series
    prediction. The model takes sequence of previous values as input (fuzzy inputs)
    to the different layer of the unfolded network and produces fuzzy output. Temperature
    dataset is used to evaluate the performance of the model and prediction accuracy
    of BPTT is better than that of backpropagation neural network model.


    Keywords: `fuzzy set`, `layer`, `neural network`, `order`, `unfolding`


    ## 7.1 Introduction


    Deep learning technique is applicable to different fields such as image and speech
    processing, pattern recognition, bioinformatics, and so on. Recently, it is employed
    in monsoon rainfall prediction `[[1](#bodymatter-007.xhtml#b_9783110670905-007_ref_001),
    [2](#bodymatter-007.xhtml#b_9783110670905-007_ref_002)]` also. Objective of this
    research is to apply deep learning in the context of fuzzy time series (`FTS`)
    forecasting.

    '
