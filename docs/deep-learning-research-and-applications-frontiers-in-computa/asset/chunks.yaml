    \ state of the RNN at time *t* and *θ* is the set of weights of the RNN. A more\
    \ specific representation is given by\n\n(4.4) *s*[*t*] = *W*[*r**e**c*]*σ*(*s*[*t* − 1]) + *W*[*i**n*]*x*[*t*] + *b*\
    \ \n\nwhere *σ* is a nonlinear function that operates elementwise over the input.\
    \ The parameter *θ* from the general case is made up of the weight matrices *W*[rec],\
    \ *W*[in], and the bias *b*. Generally, *s*[0] is initialized to zeros. It is\
    \ clear from the equation how the current state is dependent on both the current\
    \ input *x[t]* and the state from the previous time-step *s[t]*[−1]. The amount\
    \ by which these two influence the current state is directly dependent on the\
    \ weights *W*[in] and *W*[rec] respectively.\n\nWhile RNNs worked well, it was\
    \ shown in \\[[2](#bodymatter-004.xhtml#b_9783110670905-004_ref_002)\\] that they\
    \ did not capture long-term dependencies well. Furthermore, RNNs are tricky to\
    \ train. They are also trained using backpropagation. In their case, we backpropagate\
    \ the gradients over the sequence, thus we call it backpropagation through time.\
    \ The gradients are computed by unrolling the network into a multilayered network.\
    \ They suffer from the exploding and vanishing gradients problems where the gradient\
    \ either becomes too large or too small for the initial layers in the unrolled\
    \ network. The exploding gradients problem can be dealt with by clipping the gradients\
    \ which go over a certain threshold \\[[3](#bodymatter-004.xhtml#b_9783110670905-004_ref_003)\\\
    ]. However, vanishing gradients are more difficult to deal with. This is mainly\
    \ because the gradients for short-term dependencies are high while only the gradients\
    \ for long-term dependencies are low. This is the reason that classic RNNs cannot\
    \ model long-term dependencies. A variant of RNNs called long short-term dependency\
    \ networks were introduced in \\[[4](#bodymatter-004.xhtml#b_9783110670905-004_ref_004)\\\
    ]. This variant worked by explicitly adding operations to allow hidden state modification,\
    \ retention, and deletion. This makes it particularly suitable for handling long-term\
    \ dependencies, thus resolving the vanishing gradients problem.\n\nTraditionally,\
    \ n-gram models have been used for text processing. Hidden Markov models (HMMs)\
    \ have been used for the same. However, HMMs work on an underlying assumption\
    \ that text sequences can be modeled as Markov models, that is, the next state\
    \ that we can land is only dependent on the previous state. In most applications,\
    \ an *n*\\-gram is taken as one state. However, this model fails to capture long-term\
    \ dependencies in texts. Furthermore, HMMs become computationally difficult to\
    \ solve as the number of hidden states increase. RNNs are more general than HMMs\
    \ and their variants, LSTMs, can capture long-term dependencies. This has made\
    \ them the go-to model for tasks such as text classification.\n\n## 4.4 Generative\
    \ adversarial networks\n\nGenerative models, in general, learn the underlying\
    \ probability distribution of the task. Generation is simply the sampling of data\
    \ points from the learned distribution. Suppose that the underlying probability\
    \ distribution of some data *D* is *p[D]*, the task of a generative model *M*\
    \ is to estimate this distribution in the form of *p[M]*.\n\nOne recently introduced\
    \ generative model is the generative adversarial network (GAN) \\[[5](#bodymatter-004.xhtml#b_9783110670905-004_ref_005)\\\
    ]. The model works by using two competing neural networks, the generator, *G*,\
    \ and the discriminator, *D*. The generator tries to model the probability distribution\
    \ of the training data *p[D]* as *p[G]* while the discriminator learns to distinguish\
    \ between samples generated by the generator and samples from the training data.\
    \ Both the networks are initialized randomly and perform very poorly at their\
    \ respective tasks in the beginning. Both networks become better at their tasks\
    \ over time, however, as the modeled distribution *p[G]* becomes very similar\
    \ to *p[D]*, the discriminator starts randomly predicting genuine or fake with\
    \ equal probability. This analogous to an amateur painter learning to imitate\
    \ the painter Van Gogh while another person simultaneously learns to spot fake\
    \ Van Goghs. When the amateur painter becomes as good as Van Gogh, the other person\
    \ will not have any criteria to distinguish these paintings.\n\nFormally, the\
    \ generator is a differentiable function *G* and the discriminator is a differentiable\
    \ function *D*. Let *z* be some noise sampled from probability distribution *p[z]*\
    \ and *p[D]* is the probability distribution of the training data. The generator\
    \ and discriminator minimax game can be represented by the following equation:\n\
    \n(4.5)$\\\\min\\\\limits\\_{G}\\\\,\\\\max\\\\limits\\_{D}\\\\, V\\\\left( {D,G}\
    \ \\\\right) = \\\\mathbb{E}\\_{x \\\\sim PD}\\\\left( x \\\\right)\\\\left\\\\\
    lbrack {{log}D\\\\left( x \\\\right)} \\\\right\\\\rbrack\\\\, + \\\\,\\\\mathbb{E}\\\
    _{x \\\\sim p\\_{(x)}}\\\\left\\\\lbrack {{log}\\\\left( {1 - D\\\\left( {G\\\\\
    left( z \\\\right)} \\\\right)} \\\\right)} \\\\right\\\\rbrack$ \n\nRadford et\
    \ al. \\[[6](#bodymatter-004.xhtml#b_9783110670905-004_ref_006)\\] have shown\
    \ how CNNs can be used as the generator and discriminator functions. They removed\
    \ all pooling layers and used transposed convolution for upsampling in the generator.\
    \ This resulted in impressive results in generative tasks related to images. The\
    \ use of CNNs has become very common in the last few years in GAN research.\n\n\
    GANs suffer from mode collapse. The loss function that we used earlier does not\
    \ ensure that the GAN is able to generate a variety of samples. It might learn\
    \ to generate a few samples that satisfy its loss function in that it beats the\
    \ discriminator. This is highly undesirable. GANs are very tricky to train in\
    \ other ways too. Sometimes they fail to converge and the model parameters keep\
    \ on oscillating. If the discriminator becomes too good at its job, the gradient\
    \ for the generator diminishes and it stops learning. It is essential to balance\
    \ the number of times the discriminator is trained for each iteration of training\
    \ the generator. Wasserstein GANs, introduced in \\[[7](#bodymatter-004.xhtml#b_9783110670905-004_ref_007)\\\
    ], managed to overcome some of these problems by using a different loss function.\
    \ Conditional GAN, introduced in \\[[8](#bodymatter-004.xhtml#b_9783110670905-004_ref_008)\\\
    ], use the data class in-formation in the discriminator. This allows them to capture\
