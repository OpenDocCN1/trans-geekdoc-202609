    ## 2. 检测


    在大多数场景中，例如自动驾驶汽车的障碍物检测，待检测对象的数量事先是未知的。检测既涉及图像中对象的定位，也涉及对其进行标记。该领域已取得了许多进展。在 \[11\]
    中，作者提出了一种称为基于区域的卷积神经网络（R-CNNs）的方法。在此方法中，使用一个网络来提议图像中的感兴趣区域。这些感兴趣区域随后被传递给一个 CNN
    分类器，以预测区域中对象的类别。R-CNNs 的一个更快版本在 \[12\] 中提出，其中在使用 CNN 生成整个图像的特征图后，进行区域提议。其他方法，例如你只看一次
    \[13\] 和单射检测 \[14\] 已被开发。这些方法要快得多，因为它们只需将图像通过 CNN 一次。


    ## 3. 语义分割


    语义分割涉及为图像中的每个像素分配一个类别。Long 等人在 \[10\] 中提出了一种称为全卷积网络的模型，该模型在语义分割方面取得了突破性结果。该模型首先使用卷积操作将图像映射到特征图，然后使用转置卷积操作将此特征图映射回与输入图像具有相同高度和宽度的图。最终输出的深度等于类别的数量。因此，输出特征图中第
    *i* 行、第 *j* 列和深度 *d* 处的点的值有助于我们计算输入图像 *I* 中像素 *I[ij]* 属于类别 *d* 的概率。图 2.15–2.26
    说明了定位、检测和分割。


    ## 4. 语音识别


    CNN 的应用不仅限于视觉数据。CNN 也被应用于语音和文本处理。语音识别是识别语音中的单词和短语并将其存储为机器可读格式的任务。大多数方法，例如在 \[15\]
    中，将音频信号的帧传递给 CNN。CNN 使用随时间的池化操作。CNN 已被证明在语音识别方面与循环神经网络（RNNs）相当。


    ## 5. 视觉问答（VQA）


    在 VQA 中，我们的代理人需要回答与图像相关的问题。这些任务需要对图像有更深入的理解；简单的标题并不那么有用。代理人还需要进行复杂的推理。许多现代方法，例如
    \[16\]，使用 CNN 将图像映射到特征向量，并使用 RNN 为给定的文本问题生成答案。这种系统的优点是它可以端到端训练。


    ## 2.10 结论与未来工作


    在本章中，我们介绍了强大的 CNNs（CNN）。CNN 使我们能够克服在构建 DNN 时面临的许多问题。它们已在许多领域找到应用，例如图像分类、对象检测、分割、文本分类和语音识别。最近开发的生成对抗网络（GANs）\[17\]
    为 CNN 的应用开辟了新的可能性。Radford 等人 \[18\] 提出了一种结合 GANs 和 CNNs 的架构。这在涉及图像的生成任务中取得了许多令人印象深刻的突破。在
    \[9\] 中，作者使用了这种 CNN 和 GAN 的组合来将图像放大到更高分辨率。在将图像从一个领域映射到另一个领域方面，即使没有配对数据集，也取得了很大进展
    \[19\]。胶囊网络 \[20\] 建立在 CNNs 之上，是提取等变特征的一种尝试。CNN 是一个活跃的研究领域，具有突破性结果的新应用不断被发现。


