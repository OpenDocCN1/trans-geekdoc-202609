- raw: "One way to look at deep belief networks **(*DBNs*)** is that they are layers\
    \ of RBMs stacked up together as shown in [Figure 6.9](#bodymatter-006.xhtml#b_9783110670905-006_fig_009).\
    \ Such models, when used for phone recognition \\[[40](#bodymatter-006.xhtml#b_9783110670905-006_ref_040)\\\
    ], give very accurate results which turn out to be even better than RNNs. It is\
    \ not easy to train DBNs with many hidden layers because it is hard to determine\
    \ the posterior distribution for the variables in the hidden layer. After assessing\
    \ algorithms like Markov chain Monte Carlo \\[[42](#bodymatter-006.xhtml#b_9783110670905-006_ref_042)\\\
    ] and CD, the most optimal training for DBNs turned out to be the complementary\
    \ priors algorithm coupled with the wake sleep algorithm \\[[43](#bodymatter-006.xhtml#b_9783110670905-006_ref_043)\\\
    ]. A DBN consists of multiple hidden layers out of which two of the top-most layers\
    \ have undirected connections whereas the rest of the layers have generative weights\
    \ and recognition weights, that is, specific directed weights in the upward and\
    \ downward directions, respectively. The greedy algorithm (GA) used to train it\
    \ works on the principle that each model in the sequence learns from its previous\
    \ model. The input of a layer is the output from the previous layer which is obtained\
    \ by performing a nonlinear transform on the vector of data representations. As\
    \ a result, individual models in the stack have varying representations of the\
    \ actual data. All the layers in the model have an equal number of units. [Figure\
    \ 6.9](#bodymatter-006.xhtml#b_9783110670905-006_fig_009)(b) shows a model of\
    \ the DBN as described so far. The weights between the first two layers are learned\
    \ based on the assumption that the parameters in the higher layers will formulate\
    \ a complementary prior \\[[43](#bodymatter-006.xhtml#b_9783110670905-006_ref_043)\\\
    ] for *W*[0]. To construct the vector input for H[1], that is, the first hidden\
    \ layer, the data in *V*[0] is mapped through *W*[0]^(*T*). This is a generative\
    \ model which can be perfected by using a GA that states – W[0] is learnt with\
    \ the assumption that all other weight matrices are cinched after which *W*[0]\
    \ is fixed and *W*[0]^(*T*) is used to generate vectors for *H*[1] even if consecutive\
    \ changes in the weights of the higher layers indicate that this assumption is\
    \ incorrect. The higher-level weight matrices are then locked to each other but\
    \ kept unbound with W[0] and an RBM model is learnt for the higher-level data\
    \ that was generated using *W*[0]^(*T*) to reconstruct the original input data\
    \ vector. Any changes made to the higher-level weight matrices by the GA results\
    \ in an improvement in the generative model. The GA is tested recursively and\
    \ CD is used for learning the tied weights while being separated from the weights\
    \ of the bottom layers. In this manner, weights are determined layer-wise efficiently\
    \ though not optimally as the model might suffer from under fitting. To solve\
    \ this problem, back-fitting is used which is a variation of the wake-sleep algorithm\
    \ \\[[44](#bodymatter-006.xhtml#b_9783110670905-006_ref_044)\\]. After learning\
    \ the initial weights from GA, the recognition weights used for deduction and\
    \ the generative weights used for defining the model are separated for further\
    \ training. In the bottom-up pass, the recognition weights help determine the\
    \ states of the hidden units stochastically and the generative weights are modified\
    \ as per the maximum likelihood algorithm while the weights between the two top-most\
    \ layers of the RBM is adjusted by fitting it according to the penultimate layer’s\
    \ posterior distribution. In the top-down pass, mapping is done through the generative\
    \ weights to activate units in the bottom layers stochastically while only modifying\
    \ the recognition weights. The RBM at the top can either settle at its equilibrium\
    \ distribution or undergo few stages of CD before attaining equilibrium, before\
    \ commencing the top-down phase. The later proves to be better at generating varying\
    \ modes of the data.\n\n![Figure 6.9: Deep belief networks as stack of restricted\
    \ Boltzman machines .](graphic/converted/b_9783110670905-006_fig_009.png)\n\n\
    Figure 6.9: Deep belief networks as stack of restricted Boltzman machines .\n\n\
    In case of phone recognition, Backpropagating DBNs gave the best results, that\
    \ is, the least phone error rate (PER) on the TIMIT dataset. As an input to the\
    \ first visual layer, MFCCs along with their first and second temporal derivatives\
    \ are used for each frame. The initial weight training for BP-DBNs follow the\
    \ layer-wise CD approach with the addition of a final layer of outputs and then\
    \ fine-tune the parameters of the model discriminatively using backpropagation.\
    \ The number of output units equals the dimension of the binary representation\
    \ of class labels which is decided arbitrarily. The probability assigned to each\
    \ class, ɮ, given the ɖ-dimensional representation, ɚ, of an input speech fragment\
    \ generated by the model, ϴ, and the vector of class ɮ’s transformed posterior\
    \ probability distribution, ɔ[ɮ], is given in eq. (6.42).\n\n(6.42) $P(ɮ|{{\\\\\
    theta,}ᶕ})\\\\, = \\\\frac{e^{ͻɮᶕ}}{\\\\sum\\_{ƈ\\\\, \\\\in \\\\, classes}e^{ͻ\\\
    _{ƈ}ᶕ}}$ \n\nThe best results were given by a four-layer BP-DBN each containing\
    \ 2048 units, with an additional output layer of 128 units.\n\n### 6.3.4 WaveNets\n\
    \nWaveNets are probabilistic models \\[[9](#bodymatter-006.xhtml#b_9783110670905-006_ref_009)\\\
    ] that give state-of-the-art performances in speech and music generation while\
    \ being commendable at discriminative tasks like phone recognition as well. Audio\
    \ generated by WaveNets sound more natural than present day concatenative and\
    \ parametric methods, as a single model can successfully capture the characteristics\
    \ of different speakers and generate speech conditioned on any particular speaker.\
    \ Unlike other models where training is performed on extracted features, WaveNets\
    \ are trained on the raw audio waveform. The combined probability of generating\
    \ a particular waveform is expressed as products of probabilities of each sample\
    \ conditioned on all previous samples as shown in eq. (6.43).\n\n(6.43)$p\\\\\
    left( \\\\psi \\\\right) = \\\\ \\\\prod\\\\limits\\_{t = 1}^{T}p(\\\\psi\\_{t}|\\\
    \\psi\\_{1},\\\\ldots,\\\\ \\\\psi\\_{t - 1})$ \n\nThe above principle is implemented\
    \ using many layers of causal convolution neural networks (CaCNNs) without the\
    \ pooling layers and equal time dimension of input and output layers. The output\
    \ of the model is calculated using a softmax layer that gives a categorical distribution\
    \ indicating the probability of a sample, ψ[t], being generated. During training,\
    \ the parameters are tuned to achieve the maximum log-likelihood of the data.\
    \ Following (31), it is evident that during training the conditional probability\
    \ for predicting the samples at each time step can be calculated parallelly as\
    \ ψ is already known. Generation of audio is a sequential phenomenon where every\
    \ sample generated is fed back into the network to make predictions for the subsequent\
    \ time step. Though the training time for CaCNNs is lesser than RNNs due to the\
    \ absence of recurrent connections, it takes a greater number of hidden layers\
    \ or larger filters to increase the receptive field. An increased receptive field\
    \ length is very important for capturing the dependencies in speech and musical\
    \ signals during training to ensure naturalistic speech and harmonious music generation.\
    \ To reduce computations resulting from additional hidden layers, a dilation factor\
    \ (Df) is introduced in each layer, keeping the total number of layers in the\
    \ model as constant. In dilated CaCNNs, the length of the filter is smaller than\
    \ the area it is applied on and it works by skipping a specific number of intermediate\
    \ input values as shown in [Figure 6.10](#bodymatter-006.xhtml#b_9783110670905-006_fig_010).\
    \ The Df indicates the number of values to be skipped and helps increase the receptive\
    \ field without the addition of more hidden layers."
