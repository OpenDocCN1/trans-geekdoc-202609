    ## 3.7 结论


    本章讨论了用于识别 MNIST 字符数据集手写字符的 MLP、RNN 和 CNN。使用两种 CNN 方法实现的手写数字识别采用了不同的参数。从实验结果可以看出，CNN
    在识别手写字符方面更准确。拟议的“CNN 方法 2”提供了 98.92% 的准确率，而拟议的“CNN 方法 1”为 MNIST 字符数据集提供了 98.85%
    的准确率。实验结果表明，与其他方法相比，拟议的“CNN 方法 2”在准确率方面更好，而拟议的“CNN 方法 1”在训练时间方面更好，适用于 MNIST 数据集。通过使用更多数量的滤波器，系统的准确率将更好。但是，训练时间将非常高。为了进一步改进，需要增加训练系统的步骤数。


