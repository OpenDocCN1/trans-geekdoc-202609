- raw: 'We as humans have always wondered about our position in the universe. Since
    the existence of mankind, we have always looked up into the sky and asked ourselves
    qualitative questions about the Sun, the Moon, the stars, and the Universe. How
    the universe came into existence? What’s the future of our universe? These are
    two of the many questions, yet to be answered clearly. There are many theories
    but there is no consensus about one in the scientific community. The astronomers
    and scientists in early twentieth century valued the data highly. For them collecting
    data meant hand recording observations from the Earth, it certainly was a time-consuming
    and costly process, but the only means to study the universe. They thought with
    more data they’ll be able to answer all the impending questions. Today scientists
    have more data than they can process. Everyday petabytes (1 Petabyte = 106 Gigabytes
    = 1,012 kilobytes) of data is downloaded and archived into data tombs and we believe
    why it is called data tomb is self-explanatory. Today what scientists agree upon
    is that we can’t answer the questions relating to our existence straight away
    but with more data we will get more information about the different astronomical
    phenomena and events occurring out there. Based upon that information we can frame
    new theories which may lead us to the path of knowing the origin of our universe.
    Before the existence of modern computing techniques and collecting data from space
    telescopes, cosmologists used to rely on crude techniques for analysis of hand
    recorded data.


    It all began in 1800s when Harvard College Observatory’s director Edward Pickering
    wanted to survey the whole sky using the newly discovered technique (stellar spectroscopy)
    of that era, with a dedicated and determined team of human machines who worked
    on classification of stars based upon presence of different elements in the spectral
    lines. After several hit and trial combinations they finally found the OBAFGKM
    star classification scheme which is still used till date. During 1911–15, these
    human computers were used to classify around 50,000 stars annually, which resulted
    in the Henry Draper catalogue (HDR). This amount of manual classification done
    was big feat in itself but despite the hard work, no manual method can cope with
    the current data rates.


    With the launch of first space telescope (Hubble Space Telescope, 1990) and later
    on followed by many, as the technology developed, scientists and engineers crafted
    new state of the art techniques for recording data from the sky. Thus, now there
    is an abundance of data.


    Today when the space telescopes scan out the sky with around a trillion stars,
    even at the incredible rate of classification by those human computers, it would
    cost us around 16,000 years to classify a billion stars or merely 0.1% of total.


    In short, we would like to summarize the whole era in terms of two problems and
    their solutions.


    1.  The first problem was that data was recorded in crude way by hand or photographs
    from earth so it was highly distorted and inaccurate because of dust and pollution
    in atmosphere. So, the solution to this problem was the launch of space telescopes
    and it resulted in the second problem.


    2.  With the launch of space telescopes, the data capturing rates sky rocketed,
    and then for humans it is just not possible to classify this much data manually
    as it will take thousands of years to classify. The solution to this problem is
    what this chapter is focused on.


    To solve the second problem, we need tools or rather we need programs which can
    predict anomalies if they occur or programs that can classify and cluster our
    data by taking decisions or finding patterns in data, for example, classifying
    the shape of the galaxy. In half a decade we will be marking 200 years of computation
    beginning from the invention of difference engines to this date where computational
    power has grown to such an extent that we have computers that can take decisions
    autonomously. As said by Plato, necessity is the mother of invention so is the
    field of machine learning (ML) as we needed programs which can learn to predict/classify/find
    patterns on its own or rather we’d say programs which can do the tasks performed
    by the so-called human machines on large amounts of data, for example, galaxy
    classification. Thus, formally we can say that ML is a program which improves
    on its performance measure (*p*) over task (*t*) with more experience (e) of (t)
    \[[1](#bodymatter-002.xhtml#b_9783110670905-002_ref_001)\]. ML is a set of different
    techniques based on principles of statistics and calculus that allow us to create
    programs, which without being explicitly coded can do tasks, which requires human-level
    decision making and intelligence. Examples of different ML-based algorithms are
    regression, logistic regression, artificial neural networks (ANNs), support vector
    machines, clustering, and so on. Using these techniques, we are either trying
    to predict value of some entity (e.g., house price prediction) or we are trying
    to classify some entity (e.g., tumor class prediction), based on certain factors
    which we call features of the data. For instance, let’s say we want to predict
    the price/category of a house. This price/category will depend on a number of
    factors (features), such as size of house (*x*[1]), locality (*x*[2]), number
    of bedrooms (*x*[3]), and number of floors (*x*[4]). All these features become
    our input data and contribute differently toward the house price or category;
    hence, their contributions can be represented as *w*[1], *w*[2], *w*[3], and *w*[4],
    respectively. The actual price/category of the house can be represented as y and
    the predicted price/category of the house can be represented as y’.


    We can group these algorithms based upon the way they learn.


    1.  Supervised ML algorithms: Here the data comprises of *x*[1]*, x*[2]*, …, x[n]*
    and *y*. The goal of algorithm is to predict *y*’ correctly by learning the *w*[1]*,w*[2]*,,w[n]*,
    which map the relationship between *x* and *y*. The algorithm learns under the
    supervision provided by labeled y as it optimizes the weights based on error (y-y’).
    This error is used to tune *w*[1]*, w[n]* based on different learning strategies
    (e.g., backpropagation) and weight updating rules (e.g., gradient descent).


    2.  Unsupervised ML algorithms: Here the data comprises of only *x*[1]*,x*[2]*,
    …, x[n].* The goal of algorithm is to cluster or group the data into different
    number of categories (*y*[1]*,y*[2]..) prespecified by user. These algorithms
    make internal representations or cluster the data based on the data itself (*x*[1]*,x*[2]*,
    …, x[n]*). Here no supervision is provided as we don’t have the values of label
    y.


    So, it can be understood that the features representing the data are very important
    because if we use incorrect features which cannot represent the data properly
    then our predictions *y’* will be incorrect. Therefore, in traditional ML algorithms,
    it just becomes the task of optimizing weights of features that are extracted
    or designed by human experts in the field and can be seen in [Figure 2.1](#bodymatter-002.xhtml#b_9783110670905-002_fig_001).


    ![Figure 2.1: Machine learning in practice.](graphic/converted/b_9783110670905-002_fig_001.png)


    Figure 2.1: Machine learning in practice.


    So, in these approaches human learns more about the problem rather than machine.
    In our opinion, in traditional ML almost 90% of work is done by humans to figure
    out features which define the data, the rest 10 % of work is done by computers,
    that is numeric optimization. Computers are good in numeric optimization. ML should
    not just mean numeric optimization of the given weights, we want computers to
    automatically draw features from raw data. The current deep learning (DL) algorithms
    exactly does this. DL algorithms are based on concept of ANNs which is inspired
    by human cognition.'
