    It is revealed from the experimental results that the accuracy of forecast is
    dependent on the number of clusters created and the number of layers (i.e., order)
    of the model. Good forecasting accuracy is achieved if the value of `U` ([eq.
    (7.9](#bodymatter-007.xhtml#b_9783110670905-007_eq_009))) is close to zero.


    Performance of high-order BPNN model [[11](#bodymatter-007.xhtml#b_9783110670905-007_ref_011)]
    using temperature dataset is also provided in [Table 7.10](#bodymatter-007.xhtml#b_9783110670905-007_tab_012).
    In this model, there is one input layer and hidden layer. Values of previous time
    periods are fed together at a time (number of input nodes is equal to the number
    of time periods). Middle points of the corresponding intervals are used as input.
    In this case, datasets for the months of June and July are partitioned into 17
    intervals. Datasets for the months of August and September are partitioned into
    20 and 21 intervals, respectively.


    Table 7.10: Error estimation for BPNN model on temperature data [[11](#bodymatter-007.xhtml#b_9783110670905-007_ref_011)].


    | Error || Month || Order |

    | --- | --- | --- |

    | 5th || 6th || 7th || 8th |

    | RMSE || June || 1.23 || 1.27 || 1.22 || 1.25 |

    | July || 1.33 || 1.36 || 1.37 || 1.47 |

    | August || 1.05 || 1.03 || 1.02 || 1.03 |

    | September || 1.35 || 1.43 || 1.39 || 1.57 |

    | Theil’s `U` statistic || June || 0.021 || 0.022 || 0.021 || 0.022 |

    | July || 0.023 || 0.024 || 0.024 || 0.026 |

    | August || 0.019 || 0.019 || 0.018 || 0.019 |

    | September || 0.019 || 0.026 || 0.025 || 0.028 |


    From the comparative study (using RMSE values) with BPNN model, it is seen that,
    BPTT model using fuzzy input produces better result for three of the datasets
    (June, July, and September). For August dataset improvement is marginal ([Figure
    7.3](#bodymatter-007.xhtml#b_9783110670905-007_fig_003)).


    ![Figure 7.3: RMSE values: BPNN versus BPTT.](graphic/converted/b_9783110670905-007_fig_003.png)


