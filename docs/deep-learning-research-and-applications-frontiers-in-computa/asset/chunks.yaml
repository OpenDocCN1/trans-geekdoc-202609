    ![Figure 6.10: causal convolution neural networks with dilation.](graphic/converted/b_9783110670905-006_fig_010.png)


    Figure 6.10: causal convolution neural networks with dilation.


    A standard CaCNN has `Df` equal to 1 as shown in [Figure 6.11](#bodymatter-006.xhtml#b_9783110670905-006_fig_011).
    When comparing the CaCNNs of [Figures 6.10](#bodymatter-006.xhtml#b_9783110670905-006_fig_010)
    and [6.11](#bodymatter-006.xhtml#b_9783110670905-006_fig_011), it can be observed
    that keeping the number of hidden layers constant, the receptive field of CaCNN
    in [Figure 6.10](#bodymatter-006.xhtml#b_9783110670905-006_fig_010) is more than
    thrice the receptive field of CaCNN in [Figure 6.11](#bodymatter-006.xhtml#b_9783110670905-006_fig_011)
    which results from the introduction of dilations in each layer in the former.
    Usually the `Df` is increased exponentially over the layers up to a certain point
    and the cycle is repeated again. A block of CaCNN with a `Df` of 1,ϝ,ϝ²,ϝ³, …,
    ϝ^(˪-1) over ˪ layers, respectively, has a receptive field of 2ϝ^(˪-1) and turns
    out to be better than a (1 x ϝ^(˪-1)) convolutional model due to the increased
    receptive field and its capacity to capture the nonlinearities due to the hidden
    layers in between.


    ![Figure 6.11: Standard causal convolution neural networks without dilation.](graphic/converted/b_9783110670905-006_fig_011.png)


    Figure 6.11: Standard causal convolution neural networks without dilation.


    Raw audio is represented using 16 bits giving 65,536 possibilities which makes
    it a computation-intensive task so a μ-law transform as shown in eq. (6.44), is
    applied to the data to scale it down to 256 possibilities which can now be represented
    using 8 bits without trading the originality of the signal. The conditional probabilities
    in the output is then represented using a softmax distribution which works better
    than Gaussian scale mixture because the former makes no prior assumptions about
    the shape of the data.


    (6.44)$f\\left( \\psi\_{t} \\right) = sign\\left( \\psi\_{t} \\right)\\frac{{ln}\\left(
    {1 + \\ \\mu\\left| \\psi\_{t} \\right|} \\right)}{\\ln\\left( {1 + \\ \\mu} \\right)},\\
    where - 1 < \\psi\_{t} < 1\\ and\\ \\mu = 255$


    The activations of each neuron in the kth layer is given by eq. (6.45), where
    `*` is the convolution operator, `ʘ` is the element-wise product operator, `f`
    denotes the filter and `g` denotes the gate. The weight matrices `W`, are the
    learnable parameters also known as the convolution filter and `σ(.)` is the sigmoid
    function. This form of activation works significantly better for audio signals
    as compared to the linear `ReLU` activation layers.


    (6.45) `z` = tanh (`W`[*f*, `k`]\**ψ*)`ʘ` `σ`(`W`[*g*, `k`]\**ψ*)


    [Figure 6.12](#bodymatter-006.xhtml#b_9783110670905-006_fig_012) shows the overall
    representation of the above model. From (43), it is evident that WaveNets can
    be conditioned on external factors, `Ɛ`, such as speaker identity, text, and musical
    tags, such as genre or type of instruments as shown in eq. (6.46). Two types of
    conditioning can be done with WaveNets – global in which case one external factor
    has its influence entirely over all time steps; and local conditioning where the
    external factor is time dependent and has to undergo a transformation for upsampling
    to make up for its lower sampling rate, that is, `y = f(Ɛ)`. The activations for
    global and local conditioning is shown in eqs. (6.47) and (6.48), respectively,
    where `V`[\*,`k`]^() is a trainable parameter and `V`[\*,`k`]^(*T*)`ɛ` is a vector
    used over the entire time duration.


    (6.46)$p\\left( {\\psi|ɛ} \\right) = \\ \\prod\\limits\_{t = 1}^{T}p(\\psi\_{t}|\\psi\_{1},\\ldots,\\
    \\psi\_{t - 1},\\ ɛ)$ (6.47)`z` = tanh (`W`[*f*, `k`]\**ψ*`+`V`[*f*, `k`]^(*T*)`ɛ`*)`ʘ` `σ`(`W`[*g*, `k`]\**ψ*`+`V`[*g*, `k`]^(*T*)`ɛ`)
    (6.48)`z` = tanh (`W`[*f*, `k`]\**ψ*`+`V`[*f*, `k`]^(*T*)\**y`*)`ʘ` `σ`(`W`[*g*, `k`]\**ψ*`+`V`[*g*, `k`]^(*T*) \* `y`)
    ![Figure 6.12: Overall representation of waveNet architecture.](graphic/converted/b_9783110670905-006_fig_012.png)


    Figure 6.12: Overall representation of waveNet architecture.


    When used for speech generation without conditioning it on text, it generates
    audio which sounds like speech but does not contain any actual words as it does
    not know what to say. But this model could be used to generate language-like sounds
    conditioned on different speakers based on their identity which is one-hot encoded
    and fed into the model during training as well as during generation. The accuracy
    with which a single WaveNet model can generate voices of different speakers shows
    that its internal architecture is very efficient in capturing the characteristics
    of multiple speakers. For text to speech (TTS), the WaveNet is trained on the
    log of the fundamental frequencies as well as linguistic features extracted from
    the input texts. This gave significantly better mean opinion score results (which
    indicates how natural the generated speech sounds) than LSTM-RNN parametric and
    HMM-driven concatenative models, when tested on North-American English and Mandarin
    Chinese. For music generation, the WaveNets can be trained on music datasets which
    are annotated with relevant information like genre, mood, volume, and tempo that
    can be used as conditioning factors during generation. A general observation with
    music generation is that longer receptive fields are essential to capture musical
    dependencies between notes and result in more melodious pieces. Experiments have
    also been performed to apply WaveNets in the domain of SR, where raw audio is
    fed as input and the model is slightly modified by adding a pooling layer followed
    by normal convolutional layers to the existing model and trained to perfect two
    tasks predicting the next frame and classifying the present one. WaveNets give
    the least PER rates when compared to any model trained on the TIMIT dataset that
    takes raw audio as input. The time required to train WaveNets can be optimized
    by using parallel architectures as demonstrated in \[[45](#bodymatter-006.xhtml#b_9783110670905-006_ref_045)\].


    ## 6.4 Current applications


    Audio signal processing, as mentioned already, is an integral part of AI and has
    huge contributions towards its advancements. It has a wide range of applications
    – chatbots that serve as personal assistants in banks, tourism websites, messaging
    applications; labelling different regions in videos as per the sound emitted using
    environmental sound classification, or detecting the surrounding by processing
    an audio clip; music genre classification can help classify any new untagged music,
    the same models can be used to classify different types of cries of babies in
    order to identify their needs, or predict the different types of animals or birds
    by the sounds emitted by them. Speech or music generation can also be used for
    producing context specific text or genre specific music which can be used in story
    making applications or music applications. In this section, a little brief on
    few of the applications is provided.


    ### 6.4.1 Speech to text converter

