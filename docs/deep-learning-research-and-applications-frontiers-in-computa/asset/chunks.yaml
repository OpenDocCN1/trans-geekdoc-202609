    \ performance in certain types of SR. But it turns out that some of the basic\
    \ assumptions made to build up such models are the causes of its limitations.\
    \ The main Markov assumption that the probability of being in a particular state\
    \ is solely dependent only on its previous state is inaccurate because, in case\
    \ of speech signals, the reliance usually extends through more than one state.\
    \ Also, the assumptions that succeeding observations are independent and their\
    \ distributions can be well represented by autoregressive or Gaussian densities,\
    \ often leads to incorrect outcomes.\n\n### 6.3.2 Long short-term memory-recurrent\
    \ neural networks"
