- raw: "The quality and quantity of the crops are always important for the countries\
    \ where a large percentage of its population depends on agriculture. As the models\
    \ are becoming more complex, overfitting has become more common. Overfitting happens\
    \ when the model fails to generalize to test data even though it gives good performance\
    \ on the test data. If we keep other things the same, overfitting increases with\
    \ increase in complexity of the model. While *L*1/*L*2 regularization has been\
    \ used a lot, two other techniques that are now being used are covered below:\n\
    \n1.  Dropout: Dropout \\[[16](#bodymatter-004.xhtml#b_9783110670905-004_ref_016)\\\
    ] is a regularization technique in which network connections are dropped with\
    \ a certain probability *p*. This ensures that the network does not become too\
    \ reliant on those connections.\n\n2.  Batch normalization: Batch normalization\
    \ \\[[17](#bodymatter-004.xhtml#b_9783110670905-004_ref_017)\\] works by first\
    \ calculating the mean and the standard deviation of the activations of hidden\
    \ layers in the network for the batch. The activations of the batch are then normalized\
    \ by subtracting the mean from them and dividing them by the calculated standard\
    \ deviation. Two new parameters are introduced in these layers *γ* and *β*. These\
    \ are used to scale and shift the normalized activations *x̂*:\n\n    (4.7) *y* = *x̂**γ* + *β*\
    \ \n\n3.  This also has a small regularizing effect on the network.\n\n### 4.7.2 Transfer\
    \ learning\n\nThe success of deep learning has been possible partly due to the\
    \ availability of huge datasets and massive amounts of computational power. Deep\
    \ neural architectures such as VGG \\[[18](#bodymatter-004.xhtml#b_9783110670905-004_ref_018)\\\
    ] are useless without a large dataset to train on. However, large datasets are\
    \ often not available in domains where data collection is difficult or expensive.\
    \ Transfer learning has enabled deep learning to work with small datasets. It\
    \ works on the assumption that deep learning models learn to extract reusable\
    \ features implicitly when trained on a task. When two domains are similar, a\
    \ model trained on the dataset of one domain may be used for the other domain\
    \ with some fine-tuning. Common transfer learning approaches involve first training\
    \ a model, typically a deep CNN, on a large dataset such as ImageNet \\[[19](#bodymatter-004.xhtml#b_9783110670905-004_ref_019)\\\
    ]. This enables the CNN to learn filters that can extract features that are common\
    \ across many image-oriented tasks. The last fully connected layer of the network\
    \ is then changed with another one with the number of output neurons equal to\
    \ the number of classes in the target dataset. Then, the network is retrained\
    \ on the target dataset. During the retraining phase, the number of layers that\
    \ are trained can vary. One may choose to just train last layer and use the rest\
    \ of the network as a feature extractor. The whole network can be retrained too.\
    \ Transfer learning has given some impressive results in the last decade.\n\n\
    ## 4.8 Deep learning frameworks\n\nDeep learning research has been made easier\
    \ with the rise of many deep learning frameworks. The network designer does not\
    \ have to explicitly specify how the gradients are to be computed, these frameworks\
    \ automate this task for them. Most frameworks covered here are open source. Furthermore,\
    \ most of these rely on the CUDA \\[[20](#bodymatter-004.xhtml#b_9783110670905-004_ref_020)\\\
    ] for GPU processing. All these frameworks use some form of automatic differentiation.\
    \ Some popular deep learning frameworks have been briefly described below:\n\n\
    1.  Theano: Theano \\[[21](#bodymatter-004.xhtml#b_9783110670905-004_ref_021)\\\
    ] is an open source project which was developed at the Montreal Institute for\
    \ Learning Algorithms. It was under active development since 2008 till 2017 when\
    \ its final version 1.0.0 was released. Essentially, the library allows definition\
    \ and execution of mathematical expressions on both GPU and CPU. Like most other\
    \ libraries covered here, it has been implemented in C++. It provides an API that\
    \ is similar to the popular linear algebra framework NumPy for Python.\n\n2. \
    \ Tensorflow: Tensorflow \\[[22](#bodymatter-004.xhtml#b_9783110670905-004_ref_022)\\\
    ] was designed while keeping deployment of machine learning models in mind. It\
    \ has inbuilt support for distributing the workload over multiple computational\
    \ nodes. In Tensorflow, a computational graph must first be defined and compiled.\
    \ Later, the data can be fed and the graph is executed.\n\n3.  Keras: Keras \\\
    [[23](#bodymatter-004.xhtml#b_9783110670905-004_ref_023)\\] was built to make\
    \ it easier to experiment with deep learning models. It has several deep learning\
    \ architectures inbuilt. It provides a higher layer of abstraction than frameworks\
    \ like Tensorflow or Theano. Keras is only a wrapper, and the actual computation\
    \ is delegated to the underlying computational library. The users can select either\
    \ Theano or Tensorflow for the backend.\n\n4.  PyTorch: PyTorch \\[[24](#bodymatter-004.xhtml#b_9783110670905-004_ref_024)\\\
    ] is a relatively new framework which was developed at Facebook AI research. It\
    \ is similar to Keras in that it was designed to be easy to experiment with. Unlike\
    \ Tensorflow, PyTorch does not require the user to compile a computational graph\
    \ first before execution. While PyTorch was not developed with deployment to production\
    \ in mind, recent releases have added features to make PyTorch models more suitable\
    \ for production. These additions have come in the form of a just-in-time (JIT)\
    \ compiler that allows computational graphs to be compiled and optimized before\
    \ execution, just like Tensorflow. Another important feature of PyTorch is that\
    \ it allows neural networks to be defined in an object-oriented manner.\n\n5.\
    \  Others: Many other deep learning frameworks have been developed in the last\
    \ few years. The computational network toolkit \\[[25](#bodymatter-004.xhtml#b_9783110670905-004_ref_025)\\\
    ] was developed by Microsoft. Some other notable frameworks are MXNet \\[[26](#bodymatter-004.xhtml#b_9783110670905-004_ref_026)\
    \ [27](#bodymatter-004.xhtml#b_9783110670905-004_ref_027)\\].\n\n## 4.9 Engineering\
    \ applications of deep learning\n\nSuccess of deep learning techniques in a range\
    \ of engineering applications has been well documented. DNNs are being tailor-made\
    \ for natural language processing, speech recognition, object detection, and so\
    \ on. In this section, we have covered some interesting engineering applications\
    \ that have experienced advances due to deep learning.\n\nThere remains a scope\
    \ of research on finding the optimal number of clusters from a true color image\
    \ and in future the quantum inspired algorithms will open up the door to resolve\
    \ the multiobjective optimization problem efficiently within a short time frame."
  fmt: "\nThe quality and quantity of the crops are always important for the countries\
    \ where a large percentage of its population depends on agriculture. As the models\
    \ are becoming more complex, overfitting has become more common. Overfitting happens\
