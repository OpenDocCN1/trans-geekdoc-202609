    # 2.2 The convolutional operation


    We know that brains process information, compute a lot of data, and retain short-term
    and long-term memory. The human brain takes raw input through the five sensory
    organs and process information. This is where the concept of ANNs (ANNs) fit in.
    In ANNs the scientific community has tried to model how human brain works. The
    brain has its fundamental building blocks which are responsible for taking the
    input from the five senses (from the outside world) and sending instructions to
    the body. Analogously in the ANN model where computation happens, the building
    blocks are nerve cells or neurons. Neurons are responsible for taking input signals
    and mapping these inputs to a targeted response. Similarly ANNs have a dense network
    of interconnected neurons where each connection has synaptic weights. The input
    signals are propagated through this dense network and mapped to a target response.
    [Table 2.1](#bodymatter-002.xhtml#b_9783110670905-002_tab_001) and ([Figure 2.2](#bodymatter-002.xhtml#b_9783110670905-002_fig_002))
    show the comparison between biological neuron and artificial neuron.


    Table 2.1:Biological neuron versus artificial neural networks.


    | Biological neuron || Artificial neuron |


    | --- | --- |


    | Nerve cell || Neuron |


    | --- | --- |


    | Dendrites || Input signals |


    | Synapses || Weights |


    | Soma || Net input |


    | Axon || Output |


    ![Figure 2.2: Neuron versus artificial neural networks.](graphic/converted/b_9783110670905-002_fig_002.png)


    Figure 2.2: Neuron versus artificial neural networks.


    In an ordinary neural network, we update the parameters `w^([L]^)` using weight
    updating rules like gradient descent which minimizes the loss after each iteration
    by backpropagating the error.


    In DL we have a dense network of layers of neurons where raw inputs are processed
    linearly and nonlinearly layer after layer in a hierarchical order (Figure 2.3).
    DL is a subfield of representation learning. Neural networks attempt to automatically
    learn good features or representations and deep neural networks (DNNs) or DL algorithms
    (based on ANNs) attempt to learn (multiple levels of) representation and output
    from raw inputs `x`. DL just does not mean using neural networks solely, it means
    we have multiple layers of representation. Convolutional neural networks (CNNs)
    (Le Cunn 1989) are one such DL architecture which is known to work on data that
    is structured in a gridlike manner ([Figure 2.3](#bodymatter-002.xhtml#b_9783110670905-002_fig_003)).


    ![Figure 2.3: Artificial neural network.](graphic/converted/b_9783110670905-002_fig_003.png)


    Figure 2.3: Artificial neural network.


    `Z[L] = W[L]A[L−1] + B[L] A[L] = g(Z[L])`


    `L` is some layer `1 ≤ L ≤ N`


    Now coming back to our task of replacing human effort of classifying galaxy images
    using a DL algorithm, we need to know on what basis images are recognized. Image
    is a two-dimensional function `f(x,y)`, where `x` and `y` are spatial coordinates,
    and the amplitude of `f` at any pair of coordinates `(x,y)` is called intensity
    of the pixel at that point in the image. So, in layman’s term we can say that
    an image is a `m × n`-dimensional matrix which can be considered as a two-dimensional
    grid. When we are talking about an image, we consider all the raw pixels as the
    features of the image. For the task of object/image classification, researchers
    have long relied on the edges of the object. Edge map of the image gives us the
    general outline or shape of the object and can be really useful in object classification.
    In a lot of computer vision tasks, we start by passing a filter across the image
    which detects edges in the image. [Figure 2.4](#bodymatter-002.xhtml#b_9783110670905-002_fig_004)
    shows how a filter is passed through an image.


    ![Figure 2.4: Application of Sobel filter on an image.](graphic/converted/b_9783110670905-002_fig_004.png)


    Figure 2.4: Application of Sobel filter on an image.


    The filter used here is a Sobel filter. Here we can say that the filter can be
    seen as set of weights which maps input `A^([L−1]^)` to output `Z^([L]^)]`. The
    effect of applying a filter across an image is shown in [Figure 2.5](#bodymatter-002.xhtml#b_9783110670905-002_fig_005),
    where edges of a cat are detected using a Sobel filter.


    ![Figure 2.5: Output of the cat image after applying Sobel filter.](graphic/converted/b_9783110670905-002_fig_005.jpg)


    Figure 2.5: Output of the cat image after applying Sobel filter.


    Like Sobel filter there are many different types of filters which can be used
    in various settings. One question which should arise in readers mind is how to
    select the optimum filter. As we stated before a ML algorithm learns parameters
    `W` which maps input `X` to output `Y`. Therefore, we could consider the task
    of object recognition as a supervised ML problem and learn the optimum filter
    that gives us right features (edges), which can be further used to classify the
    object. CNNs learn the right set of filters that extract correct features to classify
    the object. In the next section, we have given a mathematical overview of CNNs.
    The name suggests that CNNs use the mathematical operator called convolution.
    This convolution operation is different from what is defined in mathematics or
    signal processing textbooks. The DL community actually uses cross correlation
    (sum of element-wise product) but by convention it is being called CNN and in
    this chapter, we will be following that convention. As already mentioned, convolution
    operation can be performed on any data that is oriented in a grid format. For
    example, audio data (one-dimensional grid where amplitude is measured over time
    or sequences of texts) and images (two-dimensional grid, where each position `x`,
    `y` represents a pixel). Thus, using the right filter, which can be learnt using
    supervised ML, we can learn to extract the right features.


    Let us see how the convolution operation works.


    ## 2.2 The convolutional operation


    In cricket, we judge a player’s merit by his/her average performance. This is
    nothing but an average of runs that a player scores in all the matches he/she
    has played. Now suppose we as the coach of a cricket team have been assigned the
    task of selecting the best players from a bunch of players, we can use the convolution
    operation to help us out. The convolution operation is just a weighted sum of
    the runs of the player in last `n` matches.


    So, our responsibility is to choose the players who have not only performed consistently
    well but also performed well in the recent past. So, the runs scored by a player
    in the recent past should be given more weightage than the runs scored by the
    player in distant past. Hence, we use a weighted sum to find the performance of
    a player.


    Let the weight of matches played in the past be less as compared to the recent
    matches. Then the weights of the matches are given in [Table 2.2](#bodymatter-002.xhtml#b_9783110670905-002_tab_002):


