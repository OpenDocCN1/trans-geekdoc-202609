    \ to make the networks robust to small changes in images. One point the reader\
    \ should note that is pooling operations are sensitive to changes in scale and\
    \ rotation. Figures 2.19 shows how max pooling is invariant to translation. As\
    \ observed in the figure below all the entities in the input is translated to\
    \ right by 1 unit, but only half of the entities in the output are changed.\n\n\
    ![Figure 2.19: Pooling stage.](img/b_9783110670905-002_fig_019.png)\n\nFigure\
    \ 2.19: Pooling stage.\n\n## 2.5.2 Building block of CNN\n\nThe building blocks\
    \ of a CNN are explained with help of Figure 2.20–2.21 and the table 2.5 provides\
    \ a detailed layer-wise description of the Le-Net Architecture.\n\n![Figure 2.20:\
    \ A fundamental building block of the convolutional neural network.](img/b_9783110670905-002_fig_020.png)\n\
    \nFigure 2.20: A fundamental building block of the convolutional neural network.\n\
    \n```\nA^(L-1) = Image[width] × Image[height] × Image[channel]\nW^(L) = Filter[width]\
    \ × Filter[height] × I[channel] × F[number of filters]\nZ^L = A^(L-1) * W^L +\
    \ B^L\nA^L = Pool(ReLU(Z^L))\nA^L is of dimension Output[width] × Output[height]\
    \ × Output[channel]\n```\n\n# 2.6 Complete CNN\n\n## 2.6.1 Le-Net architecture\n\
    \n![Figure 2.21: The Le-Net architecture.](img/b_9783110670905-002_fig_021.png)\n\
    \nFigure 2.21: The Le-Net architecture.\n\nTable 2.5: Detailed layer-wise description\
    \ of Le-Net.\n\n| Input layer  |\n\n| --- |\n\n| Convolution layer  || Stride\
    \ = 1  \n\nKernel size = 5,  \n\nNumber of kernels = 6,  \n\nPadding = 0  || Output\
    \ dimension = `(32 - 5) / 1 + 1 = 28 × 28 × 6`  || Number of parameters = `5 ×\
    \ 5 × 6 × 1 = 150`  |\n\n| --- | --- | --- | --- |\n\n| Max pooling layer  ||\
    \ Stride = 2,  \n\nkernel size = 2,  \n\nNumber of kernels = 6,  \n\nPadding =\
    \ 0  || Output dimension = `(28 - 1) / 2 + 1 = 14 = 14 × 14 × 6`  || Number of\
    \ parameters = `0`  |\n\n| Convolution layer  || Stride = 1,  \n\nKernel size\
    \ = 5  \n\nNumber of kernels = 16,  \n\nPadding = 0  || Output dimension = `(14\
    \ - 5) / 1 + 1 = 10 × 10 × 16`  || Number of parameters = `5 × 5 × 16 × 6 = 2,400`\
    \  |\n\n| Max pooling layer  || Stride = 2,  \n\nKernel size = 2, Number of kernels\
    \ = 16,  \n\nPadding = 0  || Output dimension = `(10 - 1) / 2 + 1 = 5 = 5 × 5\
    \ × 16`  || Number of parameters = `0`  |\n\n| Fully connected layer 1  || Size\
    \ = 120  || Output dimension = `120 × 1`  || Number of parameters = `120 × 5 ×\
    \ 5 × 16 = 48,120`  |\n\n| Fully connected layer 2  || Size = 84  || Output dimension\
    \ = `84 × 1`  || Number of parameters = `84 × 120 + 84 = 10,164`  |\n\n| Output\
    \ layer  || Size = 26  || Output dimension = `26 × 1`  || Number of parameters\
    \ = `84 × 26 + 26 = 2,210`  |\n\n# 2.7 What is the network learning?\n\nNow that\
    \ we know how CNNs work, let’s try applying them. We have trained a CNN for classifying\
    \ images of cats and dogs. The network seems to be performing poorly on the test\
    \ set and we want to find out the reason behind it. We will explore some techniques\
    \ in this section which will help us in understanding what the CNN has actually\
    \ learned about a given problem.\n\nPractitioners in the field of image processing\
    \ have traditionally relied on using filters designed specifically for the task.\
    \ We have seen how Sobel filters can be used to detect edges. Similarly, there\
    \ are many filters which detect specific features. In the previous decade, in\
    \ most image categorization pipelines, multiple such filters were used to extract\
    \ features from images. The practitioner usually knew what specific feature that\
    \ they were getting. For example, one might use a vertical edge detecting filter\
    \ to detect road markings. Being able to understand what features are being extracted\
    \ makes the decision-making process easy to understand.\n\nIn CNNs, we have thousands\
    \ of filters. Furthermore, these filters are generated by the training procedure.\
    \ Only the dimensionality of the filters is fixed manually. With so many filters\
    \ being used, one very natural question comes to mind – what specific features\
    \ from the image are being used while categorizing the image? The answer to this\
    \ question helps us in debugging our CNN.\n\n## 2.7.1 Visualizing the first layer\n\
    \nOne simple way of discerning the types of features being extracted is to look\
    \ at the filters being used. We can understand these filters by visualizing them.\
    \ Simply plotting the weights gives us good insights into what features of the\
    \ input image are being looked at by the filter. The filters from the first convolution\
    \ layer of our cats and dogs classifier have been visualized in Figure 2.22. The\
    \ first layer of this network used 64 7 × 7 by three (for the three channels)\
    \ filters. The 64 filters can be seen in the figure. Note how many filters are\
    \ performing the task of edge detection. In particular, the third last filter\
    \ seems to be looking at oriented edges at a 135° angle horizontally. Some filters\
    \ are looking for circles in specific channels.\n\n![Figure 2.22: The first-layer\
    \ filters of the cats and dogs classifier.](img/b_9783110670905-002_fig_022.jpg)\n\
    \n"
