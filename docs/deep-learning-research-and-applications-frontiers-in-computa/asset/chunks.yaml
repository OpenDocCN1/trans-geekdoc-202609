    `W` 是可学习参数，也称为卷积滤波器，`σ(.)` 是 sigmoid 函数。这种激活形式对于音频信号相比于线性 `ReLU` 激活层效果显著更好。


    (6.45) `z` = tanh (`W`[*f*, `k`]\**ψ*)`ʘ` `σ`(`W`[*g*, `k`]\**ψ*)


    Figure 6.12 显示了上述模型的整体表示。从 (43) 可以看出，WaveNet 可以受外部因素 `Ɛ` 条件约束，例如说话人身份、文本以及音乐标签，如流派或乐器类型，如
    eq. (6.46) 所示。WaveNet 可以进行两种类型的条件约束——全局条件约束，即一个外部因素对所有时间步都有完全影响；以及局部条件约束，即外部因素是时间相关的，需要进行上采样变换以补偿其较低的采样率，即
    `y = f(Ɛ)`。全局和局部条件约束的激活分别由 eqs. (6.47) 和 (6.48) 给出，其中 `V`[\*,`k`]^() 是可训练参数，`V`[\*,`k`]^(*T*)`ɛ`
