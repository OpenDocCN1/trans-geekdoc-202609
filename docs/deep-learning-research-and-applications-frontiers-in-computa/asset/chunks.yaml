    \ \\[38\\] 中，建议通过将输出音素条件化为声学输入和前一时间步的音素来改进正常概率计算。\n\n## 6.3.3 受限玻尔兹曼机与深度信念网络\n\
    \n受限玻尔兹曼机（RBMs）是概率神经网络模型，已被证明在对象识别、电话识别方面表现良好，并且能更好地学习图像和声音数据的表示。由于我们专注于音频信号处理，我们将更详细地介绍\
    \ RBMs 在语音处理中的应用，即电话识别 \\[40\\]。RBM 由单层二进制可见单元 `ʋ` 和另一层二进制隐藏单元 `ɧ` 组成。它被称为受限，是因为其二部性质，即没有层内连接。采样和分片是任何分类技术的先决条件。同样，`ʋ`\
    \ 包含 `ȵ` 样本的特定片段。整个模型可以表示为 `ϴ = {ձ,ճ,ω}`。联合架构的能量在 eq. (6.31) 中给出，其中 `ʋ[i]` 和 `ɧ[j]`\
    \ 分别是可见层和隐藏层中的单元，`ձ[i]` 是可见层中第 `i` 个单元的偏置，而 `ճ[j]` 是隐藏层中第 `j` 个单元的偏置，`ω[ij]` 是可见层中第\
    \ `i` 个单元和隐藏层中第 `j` 个单元之间的权重。\n\n```\n(6.31) $E\\\\left( {ʋ,ɧ} \\\\right) = -\
    \ \\\\sum\\\\limits\\_{i\\\\,\\\\epsilon\\\\, visible}^{}ձ\\_{i}v\\_{i} - {}\\\
    \\sum\\\\limits\\_{j\\\\,\\\\epsilon\\\\, hidden}^{}ճ\\_{j}ɧ\\_{j} - {}\\\\sum\\\
    \\limits\\_{i,j}^{}ʋ\\_{i}ɧ\\_{j}\\\\omega\\_{ij}$\n```\n\n使用 (31) 中的能量函数，分配给可见单元以及所有可见和隐藏单元对的概率分别在\
    \ eqs. (6.32) 和 (6.33) 中给出。\n\n```\n(6.32) $P\\\\left( {ʋ|\\\\theta} \\\\right)\
    \ = \\\\frac{\\\\sum\\_{ɧ}e^{- E{({ʋ,ɧ})}}}{\\\\sum\\_{\\\\nu,ɧ}e^{- E{({ʋ,ɧ})}}}$\n\
    (6.33) $P\\\\left( {ʋ,ɧ|\\\\theta} \\\\right) = \\\\frac{e^{- E{({ʋ,ɧ})}}}{\\\\\
    sum\\_{\\\\nu,ɧ}e^{- E{({ʋ,ɧ})}}}$\n```\n\n"
