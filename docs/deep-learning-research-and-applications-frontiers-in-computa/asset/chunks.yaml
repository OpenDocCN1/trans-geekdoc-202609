    This work deals with univariate model. In each of the temperature dataset ([Tables
    7.2](#bodymatter-007.xhtml#b_9783110670905-007_tab_004)–[7.5](#bodymatter-007.xhtml#b_9783110670905-007_tab_007))
    the difference between the maximum value and minimum value is small, that is,
    data range is small. But for the applications where such difference is large,
    preprocessing of data is required before clustering. In this case, differences
    between consecutive values are to be calculated before clustering. Differencing
    helps in reducing the number of clusters. Preprocessing of data is necessary if
    the time series contains patterns like trend, seasonal effect and so on.


    Drawback of using BPTT is the memory requirement for the large sequence. Let us
    discuss the issues related to time complexity and space complexity of both of
    the models. For a BPNN model with *n* input layer nodes, *h* hidden layer nodes,
    and *m* output layer nodes, there are *h*(*n* + 1) and *m*(*h* + 1) link weights
    in the first and second layer, respectively. For each epoch, both the space and
    time complexity is *O*(*h* · (*m* + *n*)) \[[20](#bodymatter-007.xhtml#b_9783110670905-007_ref_015)\].


    Let us consider that the number of hidden layer nodes and input nodes are *n*
    and *m*, respectively. Epoch length is represented by *h*. In case of fully connected
    network, number of adaptable weights = *n* (*n* + *m*) and number of nonzero weights
    between units = n². If the desired output values at every time period is considered,
    then epochwise BPTT has space complexity in *O*(*nh*) and average time complexity
    (per time step) is *O*(*n*²) \[[15](#bodymatter-007.xhtml#b_9783110670905-007_ref_020)\].


    ## 7.5 Conclusion


    The proposed model can work with different number of clusters and orders. In addition
    to temperature data, this forecasting model is applicable to other datasets. In
    future, the technique can also be extended for forecasting multiple observations.
    Applications using variable/dynamic sequence length (prior time step) \[21\] instead
    of fixed sequence length can also be investigated in future. This approach is
    also applicable for solving complex and dynamic real-world problems like sequence
    classification in bioinformatics where large databases with multiple variables
    are required. Other signal analysis applications are in the field of seismology
    and speech processing.


