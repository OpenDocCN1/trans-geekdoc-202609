    # 1 深度学习——人工智能的前沿方法


    Soumyajit Goswami IBM 印度私人有限公司，盐湖城，第五区，加尔各答，西孟加拉邦，印度


    ## 摘要


    本章介绍了市场上不同供应商提供的各种云平台。IBM 提供了一个机器学习（ML）平台“IBM Watson Studio”（原名“数据科学体验”），本章将其作为研究领域进行讨论。阐述了人工智能、机器学习和深度学习（DL）及其关系的概述。还讨论了流行的深度学习架构及其基本比较。


    关键词：人工智能，机器学习，深度学习，IBM Watson Studio（原名数据科学体验或 DSX），


    ## 1.1 引言


    深度学习（DL）是人工智能（AI）的一个子领域，是目前研究和工业界最具前景的领域。尽管 DL 是一个非常现代的主题，但它已经被多家科技巨头用于满足其需求。例如，Google
    的语音和图像识别算法 \[1]; Netflix 和 Amazon 使用它来决定 \[2\] 一个人在不久的将来想要观看或购买哪个视频，MIT 研究人员的即将发布的预测
    \[3]，以及 Facebook 使用它来为广告商预测未来行为 \[4\]。UCLA 的研究人员制造了一台先进的显微镜，可产生高维数据集，用于训练 DL 网络以在组织样本中识别癌细胞
    \[5\]。简而言之，如今只要涉及自动化，它就无处不在。


