    现在，如果我们取任何与隐式表示维度相同的随机向量，并将其传递给解码器，我们应该能得到原始数据空间中的一个数据点。我们实际上是在执行生成任务。然而，隐式空间并不连续，许多随机向量由解码器重建的数据将不现实。本质上，变分自编码器是确保隐式表示（隐藏层）的激活值连续的自编码器。这是通过让编码器输出两个维度为
    `d` 的向量，而不是一个维度为 `d` 的向量来实现的。这两个向量分别表示均值和标准差，并分别用 `μ` 和 `σ` 表示。然后我们采样一个维度为 `d`
    的随机向量 `H`，并对每个元素 `h[i]` 执行以下操作：


    (4.6) `z[i] = σ[i] * h[i] + μ[i]`


    我们得到一个向量 `Z`，然后由解码器将其解码回去。请注意，即使在不同时间给出相同的输入，该向量 `Z` 也不会相同。这是因为采样的向量 `H` 会有所不同。对于训练，隐式表示与单位高斯分布之间的库尔贝克–莱布勒散度被最小化，输出与输入之间的均方误差也同时被最小化。整个流程已在
    图 4.1。 中可视化。关于 VAE 的优秀教程可以在 \[12\] 中找到。


    ![Figure 4.1: Variational autoencoder.](img/b_9783110670905-004_fig_001.png)


    Figure 4.1: Variational autoencoder.


    ## 4.6 深度强化学习


    强化学习文献中充斥着当与查找表一起使用时能保证收敛到最优解的算法。这些强化学习算法针对的是底层马尔可夫决策过程（MDP）具有有限状态和动作的情况进行分析。然而，查找表对于具有连续（无限）状态或动作的高维
    MDP 来说扩展性不佳，这是由于维度灾难。因此，必须使用像 sigmoidal、多层感知机、径向基函数或基于内存的学习网络这样的函数近似器。


    在 [53] 中，Widrow 等人引入了 ADALINE 算法的一种强化学习变体，其中自适应逻辑单元从反馈中学习不一定线性可分的决策函数。Barto, Andrew
    G. 等人在 [54] 中提出，具有延迟后果的决策任务可以准确地表述为序列决策问题，并通过动态规划求解。他们表明，自适应神经网络（ANN）将成功用于近似解决此类问题所需的函数。动态规划方法，在状态有限且离散的情况下，依赖于评估函数的查找表表示来找到连续迭代中状态的值。但是，当状态空间连续时，状态空间的离散化会导致状态空间中出现指数级的状态。然而，随着深度学习知识的进步，ANN
    正在被用于泛化函数近似。


    ### 4.6.1 深度 Q 网络


    一种成功地使用强化学习和神经网络作为函数近似器，从图像中学习控制策略的重要学习算法就是深度 Q 学习。它使用了带有 Q 学习变体的 CNN。该模型的输入是原始像素形式的图像，输出是预测用于估计未来奖励的值函数。直接将深度学习作为函数近似器应用的问题是：


    1. 深度学习需要大量人工标注的数据，而强化学习使用通常稀疏、嘈杂且延迟的标量奖励。


    2. 大多数深度学习算法假设数据是从独立同分布中采样的，然而在强化学习中，接收到的奖励高度相关，并且随着智能体学习新行为，数据分布会发生变化。


    深度 Q 网络（DQN）使用了经验重放机制，从之前的转换中随机采样，以解决相关数据和非平稳分布的问题。经验重放将智能体在每个时间步的经验 `ϵ[t] = (s[t],a[t],r[t],s[t+1])`
    存储在数据集 `D = ϵ[1], … ϵ[N]` 中，该数据集在许多回合中收集到重放内存 13。因此，深度 Q 学习不是在每个奖励信号后进行更新，而是从经验重放中随机抽取小批量进行更新。一旦更新执行完毕，智能体根据
    `ϵ − greedy` 策略选择并执行动作。


    执行批量更新解决了直接将 Q 学习与 CNN 作为函数近似器应用时面临的许多问题。


    1. 执行批量更新是高效的。


    2. 由于数据之间存在强相关性，从连续样本中学习是低效的。我们可以通过随机采样来打破相关性，从而降低更新的方差。


    3. 传统方法使用在策略学习，其中当前参数决定了参数训练的下一个数据样本。然而，当学习过程中训练分布发生变化时，参数陷入局部最小值的风险更高。经验重放对许多先前状态的行为分布进行平均，从而平滑学习并避免次优解。经验重放使用离策略学习。


    深度 Q 学习算法从经验重放中均匀采样。采用这种采样方法，转换的重放频率与其被体验的频率相同，与其重要性无关。在 14 中，作者开发了一个框架，其中重要的转换被更频繁地重放，从而使学习更高效。在此更新中需要解决的一个重要概念是如何确定转换的重要性。重放的重要性可以由智能体从当前状态采取该转换所学到的程度来定义。这可以使用转换的
    TD 误差 `δ` 的幅度来衡量，它指示值与预期值的差异程度。然而，当底层奖励嘈杂时，TD 误差可能是不准确的估计。


    策略搜索方法是强化学习，旨在通过无梯度或基于梯度的方法直接寻找底层策略。传统上，进化算法被用于解决这些问题，它们是无梯度策略搜索算法。在进化方法中，会考虑一群智能体的表现来评估性能。这些方法在小规模种群中效果良好，但在智能体数量庞大或智能体具有多个参数时会变得难以处理。然而，如果神经网络权重表示可以压缩，进化模型可以用于训练大型网络。在
    15 中，作者将网络权重表示为傅里叶类型系数，从而对权重使用压缩编码。这种方法成功地用于训练具有非常大网络的任务，因为高维输入空间。


