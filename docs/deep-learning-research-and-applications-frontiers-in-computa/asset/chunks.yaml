    ## 6. 机器翻译（序列到序列）


    将一系列输入映射到另一系列的编码器–解码器方法，在 \[47\] 中使用循环网络，在机器翻译领域具有开创性意义。神经机器翻译方法已变得普遍。在 \[47\]
    中，使用了两个 `LSTM`（一种 `RNN` 的变体类型）网络——一个编码器和一个解码器。编码器接收文本序列并迭代将其映射为向量。然后，解码器接收输入序列的这种向量化表示，并迭代生成新序列。所提方法在英语到法语翻译任务中表现良好。这种技术的一个重要好处是，模型可以端到端训练。这种方法并不完美，对于长序列无法工作。在
    \[48\] 中，作者认为固定长度向量可能无法捕获翻译所需的所有信息。他们建议存储输入序列中每个输入单元生成的激活，并在解码时引用。他们使用一种注意力机制，允许解码器优先处理与正在生成的单词更相关的激活。该模型也可以端到端训练。


    ## 7. 玩视频游戏（Atari 游戏）


    在 \[13\] 中，Minh 等人表明 `DQN` 模型能够成功地在 49 个 Atari 游戏中的 41 个上达到人类水平的性能。`DQN` 使用深度
    `Q-learning` 算法，这是 `Q-learning` 算法的一种变体，它使用经验回放来解决神经 `Q-learning` 面临的问题。在 \[14\]
    中，作者通过优先经验回放扩展了 `DQN`，其中更新中的回放频率取决于其 `TD` 误差。


    ## 8. 工作与推理


    关于推理和知识表示的大部分文献使用基于符号逻辑的方法。目前，正在进行研究以训练一个 `DNN` 模型，该模型将能够以基本本体推理的形式执行逻辑推理 \[49\]。


    ## 4.10 结论


    在深度学习领域正在进行大量研究。这主要得益于深度学习在其应用的所有领域所取得的令人印象深刻的结果。


    随着 `DNNs` 在各种应用中的使用增加，对能够设计特定于任务的架构的从业者的需求也在增加。这也引发了对神经架构搜索和超参数优化算法的兴趣，这些算法自动化了这一过程。大多数神经架构搜索技术使用进化算法或强化学习。特别是，\[50\]
    展示了如何使用强化学习搜索神经架构。该领域一个令人兴奋的方法是可微分架构搜索 \[51》，顾名思义，它假设架构空间是连续的。这允许使用基于梯度的技术。


    该领域最近的一项进展是引入了胶囊网络 \[52\]。这种基于 `CNNs` 的神经网络架构能够学习等变表示。也就是说，即使图像被缩放、旋转或倾斜，它们也可以轻松处理输入。正在进行研究，以使神经决策过程更易于理解。在安全关键型应用中部署神经网络等黑盒引发了若干担忧。由于该领域正在取得快速进展，深度学习领域非常令人兴奋。由于新架构、训练技术和数据集，突破性结果正在非常一致地取得。


