    ## 1.6 IBM Watson Studio (formerly, Data Science Experience)


    2016 年，IBM 推出了 DSX [13]，后改为 Watson Studio，旨在解决数据科学生命周期的每个阶段，通过配置 Spark、R、Python、Scala
    和其他 ML 语言，提供笔记本、协作空间、教程和 ML 模型。DSX 还通过支持数据科学家熟悉的工具（如 Jupyter、RStudio、Notebooks
    和 Apache Spark）来帮助他们创建复杂的 ML 模型并将这些模型部署到生产环境中。Figure 1.17 显示了 IBM Watson Studio
    中项目和服务子部分的几个快照。项目用于组织资源以实现特定目标。它可以包括数据、协作者以及笔记本和模型等分析资产。管理员可以将任意数量的服务与项目关联。可以关联的服务类型包括


    * IBM Apache Spark 计算服务

    * Amazon Elastic MapReduce 计算服务

    * IBM Analytics Engine 计算服务

    * Cognos Dashboard Embedded

    * IBM Watson Machine Learning

    * IBM Streaming Analytics

