  trans: '


    手写数字识别已被应用于从扫描文档或图像中提取文本。字符识别需要一种基于模式的分类算法。DNN 在机学习领域已证明其出色的性能 \[22, 23\]。DNN
    由大量的隐藏层和连接组成。因此，DNN 中可训练参数的数量巨大。需要大量样本来训练系统以防止过拟合。而 CNN 与 DNN 相比，隐藏层较少，参数数量也较少。因此，CNN
    训练系统所需的样本数量较少。CNN 在架构形成过程中可以改变每一层的隐藏层数量和可训练参数数量。因此，CNN 架构被规划用于手写数字识别。这里，使用 MNIST
    现实世界数据库来检查系统的性能。


    ### 3.5.1 使用的数据库


    在本章中，MNIST 手写数字数据库用于训练和测试系统。MNIST 手写数字图像的尺寸已被归一化并预处理。因此，用户不需要对图像进行预处理。MNIST 训练集和测试集示例包含来自约
    250 名书写者的数据。MNIST 数据库包含 60,000 张用于训练的手写数字图像和 10,000 张用于测试的手写数字图像 \[24\]。每张手写数字图像包含
    28×28 像素，每个像素的值在 0（背景）和 255（前景）之间，如 Figure 3.5. 所示。数据库包含训练集图像文件、训练集标签文件、测试集图像文件和测试集标签文件。像素值在每个图像文件中按行排列。在图像文件中，一张图像的所有像素值都排列在一行中。因此，每个图像文件包含
    784 列，对应 28×28 像素。在标签文件中，标签值包含 10 列。对于任何数字的特定实例，适当列的标签值设置为 1，其他列设置为 0。


    ![Figure 3.5: Examples of MNIST dataset.](img/b_9783110670905-003_fig_005.jpg)


    Figure 3.5: Examples of MNIST dataset.


    ### 3.5.2 拟议 CNN 架构的设计


    在这项工作中，实现了两种 CNN 架构用于 MNIST 数字识别。每种架构包含两个隐藏层或卷积层。ReLU 激活函数在每次卷积操作后应用，以实现系统的非线性。第一个
    CNN 架构命名为“CNN Method 1”，并按以下详细信息实现。CNN Method 1 使用两个隐藏层或卷积层来实现 MNIST 数据集的数字识别。输入图像大小为
    28 × 28，即总共 784 个像素。因此，输入层有 784 个输入。最初，使用 32 个大小为 5 × 5 的滤波器进行卷积操作，不使用填充，步幅等于
    1。卷积操作输出 32 个大小为 24 × 24 的层。然后，使用 2 × 2 最大滤波器进行下采样操作。这种下采样减少了 75% 的数据量，生成的输出包含
    32 个大小为 12 × 12 的层。之后，使用 64 个大小为 7 × 7 的滤波器进行另一次卷积操作，使用零填充，步幅等于 1。卷积操作输出 64 个大小为
    12 × 12 的层。之后，使用 2 × 2 最大滤波器进行另一次下采样操作。这种下采样再次减少了 75% 的数据量，生成的输出包含 64 个大小为 6 ×
    6 的层。然后，连接一个具有 2,304 个输入节点（64 × 6 × 6 个节点）和 1024 个输出节点的 FCN 层。然后，连接另一个具有 10 个输出节点的
    FCN 层，用于 10 个数字。


    第二个 CNN 架构命名为“CNN Method 2”，并包含以下详细信息。CNN Method 2 使用两个隐藏层或卷积层来实现 MNIST 数据集的数字识别，如
    Figure 3.6. 所示。


    ![Figure 3.6: Architecture of proposed CNN Method 2.](img/b_9783110670905-003_fig_006.png)


    Figure 3.6: Architecture of proposed CNN Method 2.


    输入图像大小为 28 × 28，即总共 784 个像素。因此，输入层有 784 个输入。最初，使用 64 个大小为 5 × 5 的滤波器进行卷积操作，不使用填充，步幅等于
    1。卷积操作输出 64 个大小为 24 × 24 的层。然后，使用 2 × 2 最大滤波器进行下采样操作。这种下采样减少了 75% 的数据量，生成的输出包含
    64 个大小为 12 × 12 的层。之后，使用 128 个大小为 7 × 7 的滤波器进行另一次卷积操作，使用零填充，步幅等于 1。卷积操作输出 128
    个大小为 12 × 12 的层。之后，使用 2 × 2 最大滤波器进行另一次下采样操作。这种下采样再次减少了 75% 的数据量，生成的输出包含 128 个大小为
    6 × 6 的层。然后，连接一个具有 4608 个输入节点（128 × 6 × 6 个节点）和 1024 个输出节点的 FCN 层。然后，连接另一个具有 10
    个输出节点的 FCN 层，用于 10 个数字。


    ## 3.6 实验结果


    最初，实现了一个 MLP 用于数字识别。MLP 在输入层中有 784 个节点，因为 MNIST 的每个图像都有 784 个像素（28 × 28 像素）。使用
    2.2 吉赫兹的至强处理器和 128 GB 内存来训练和测试系统。与 CNN 和 RNN 相比，MLP 需要花费大量时间，如 Table 3.1 所示。


    Table 3.1:Accuracy of RNN and CNN.


    | Steps  || CNN implemented by Younis and Alkhateeb \[23\] || RNN |


    | --- | --- | --- |


    | Accuracy || Training time (in seconds) || Accuracy || Training time (in seconds)
    |


    | 10,000 || 94.97% || 1354 || 86.67% || 148 |


    | --- | --- | --- | --- | --- |


    | 20,000 || 97.03% || 2698 || 93.55% || 295 |


    | 30,000 || 97.60% || 4050 || 95.99% || 443 |


    | 40,000 || 97.99% || 5391 || 96.55% || 589 |


    | 50,000 || 98.25% || 6738 || 97.01% || 736 |


    | 60,000 || 98.41% || 8083 || 97.21% || 883 |


    | 70,000 || 98.53% || 9436 || 97.30% || 1029 |


    | 80,000 || 98.59% || 10782 || 97.55% || 1178 |


    | 90,000 || 98.67% || 12132 || 97.79% || 1322 |


    | 100,000 || 98.80% || 13,502 || 97.76% || 1,476 |


    | 110,000 || 98.85% || 14,821 || 97.96% || 1,620 |


    MLP 的实验结果需要 5371 秒才能在 MNIST 数字分类中达到 92.44% 的准确率。要达到相同的准确率，训练 RNN 需要 295 秒，训练由
    Younis and Alkhateeb 实现的 CNN 需要 1354 秒。关于随时间变化的准确率比较研究表明，RNN 训练系统的速度比 CNN 快，如
    Figure 3.7. 所示。但是，如果训练时间非常高，CNN 有能力训练更多。


    ![Figure 3.7: Accuracy vs. training time for CNN and RNN.](img/b_9783110670905-003_fig_007.png)


    Figure 3.7: Accuracy vs. training time for CNN and RNN.


