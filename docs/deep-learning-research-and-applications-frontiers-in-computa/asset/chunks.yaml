    ### 6.4.2 Audio classification


    Tasks like predicting the type of surroundings from an indistinct clip like that
    of a busy road or an airport or the inside of a bus, predicting the bird species
    given their chirping sound, the genre of a given song, or any task where the outputs
    are required to be distinct labels, belong to this domain. It is helpful in various
    arenas like surveillance \[[49](#bodymatter-006.xhtml#b_9783110670905-006_ref_049)\]
    and contextwise computing \[[50](#bodymatter-006.xhtml#b_9783110670905-006_ref_050)\].
    Be it songs or any sound, every audio signal belonging to a specific category
    have common features that might not be perceived by the human ear but can be detected
    by the feature extraction algorithms. In case of music genre classification, MFCCs
    are extracted and fed into deep feed forward neural networks and trained against
    genres which are fed as class tags after one-hot encoding. MFCCs combined with
    timbral features also give very good classification accuracies \[[7](#bodymatter-006.xhtml#b_9783110670905-006_ref_007)\].
    In \[[51](#bodymatter-006.xhtml#b_9783110670905-006_ref_051)\], a new feature
    extraction method known as Daubechies wavelet coefficient histograms was devised
    and tested with classification algorithms like linear discriminant analysis and
    support vector machines; the classification results thus obtained were more accurate
    than the former mentioned approach. In case of environmental sound classification,
    once again MFCCs are extracted and this time DCNNs \[[5](#bodymatter-006.xhtml#b_9783110670905-006_ref_005)\]
    are chosen as they give the best results for this kind of classification where
    once again the different classes such as airport, bus, busy street, shopping mall,
    and railway station are one-hot encoded and act as output labels. Similar approaches
    can be taken for any other type of classification for instance musical instrument
    classification, where features are extracted and fed into a neural network model
    to perform supervised training.


    ### 6.4.3 Speech and music generation


    AI has made huge advancements in the fields of music generation where a model
    is trained against huge musical datasets so that it can generate new music on
    its own. WaveNets vanquished in the competition and give appreciable results when
    it comes to either music or speech generation. Speech generation conditioned on
    text is used in applications like audio books and it is flexible enough to generate
    different voices. It also helps in communication where one does not know the correct
    pronunciation but knows how to spell any word in that language. It is also helpful
    for clarification of pronunciations or learning a new language. Till date, TTS
    has been done mainly by playing pre-recorded sound which has been manually uttered.
    Storing such audio files on servers and fetching them on user request requires
    both huge amount of storage and increases the response time, the former being
    the bigger concern. Substituting the mechanism with a sound generating algorithm
    conditioned on text is quite a solution. Similarly, music generation can be conditioned
    on multiple factors such as tempo, genre, and instruments, which is of help to
    people who cannot play instruments but have a taste in music. Some music softwares
    which have incorporated AI and are running successfully are Orb Composer, IBM
    Watson Beat, OrchExtra, Google Magenta’s NSynthSuper, ChucK, and Jukedeck.


    ### 6.4.4 Language translation


    Language Translation becomes extremely important when intercultural meetings happen
    or anytime when travelling to another destination whose language is unknown. As
    a result, most often people find themselves using Google translate. Artificial
    intelligence’s take on language translation is done by sequence to sequence learning
    \[[52](#bodymatter-006.xhtml#b_9783110670905-006_ref_052)\] where deep LSTM-RNNs
    were used and gave excellent results comparable to the state of the art. Any sentence
    or word to be translated is considered to be a query sequence which is to be mapped
    to the target sequence in the other language to which the translation is required.
    Another solution to the translation problem has been proposed using RNN encoder–decoder
    \[[53](#bodymatter-006.xhtml#b_9783110670905-006_ref_053)\]. They are capable
    enough to grasp sensible phrase and sentence representations.


    ### 6.4.5 Personal assistants


    Ever since Apple introduced its personal assistant, Siri, there has been huge
    competition among the top organizations to introduce their own efficient chatbots.
    Consequently, Amazon’s Alexa and Google’s Google Home have entered the battlefield.
    These bots are not just mere question–answer systems, but their extended functionalities
    allow them to be linked to other applications such as electricity controls that
    allows them to collaborate with smart home architectures. Users can command them
    to play music, switch on/off electrical appliances, ask them questions, interact
    with them, have friendly conversations, make phone calls or appointments, and
    a ton of other things. To be able to provide such services, the personal assistant
    devices have to be linked to the external modules using application program interface.
    Some of the commonly used Personal Assistants are depicted in Figure 6.14.


    ![Figure 6.14: Personal assistants that made it big.](graphic/converted/b_9783110670905-006_fig_014.jpg)


    Figure 6.14: Personal assistants that made it big.'
