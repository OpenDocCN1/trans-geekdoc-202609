    # HMMs can be constrained or unconstrained


    Ergodic HMMs are the ones where transitions are possible from every state to the
    other state, hence they are unconstrained. Other variations of HMMs are left–right(LR)
    models where transitions are constrained from state `j` to state `i`, that is,
    `a[ij]` = 0 if j<i. Sometimes, the number of jumps between the states is also
    constrained, that is, `a[ij]` = 0 if j<i and j ≥ i+ℋ where ℋ is the number of
    hops. Constrained HMMs also include parallel LR models which is formed by the
    cross-coupled linkage between 2 parallel LR HMMs. They are more relaxed than the
    typical LR models as they allow parallel paths.


    # Use of HMMs in SR


    In this chapter, we will discuss more on the use of HMMs in SR. Every classification
    algorithm for speech processing works on features extracted. HMMs are shown to
    work well with features extracted using linear predictive coding (LPC). A series
    of steps are followed \[[35](#bodymatter-006.xhtml#b_9783110670905-006_ref_035)\]
    to calculate the LPC coefficients that model the vocal track and captures utterances.
    Consequently, they are also known as speech attributes. These coefficients can
    also be used later to regenerate the original audio, hence it serves very well
    as a speech compression algorithm. LPCs give coefficients that form vectors with
    continuous values; but to use these as features for HMM, discrete values are required
    for which a vector quantization (VQ) step is performed \[[36](#bodymatter-006.xhtml#b_9783110670905-006_ref_036),
    [37](#bodymatter-006.xhtml#b_9783110670905-006_ref_037)\]. First, the functioning
    of HMMs in identifying individual words will be explained followed by continuous
    SR \[[37](#bodymatter-006.xhtml#b_9783110670905-006_ref_037)\].


    In terms of HMMs, any word uttered can be thought of as a set of observations,
    `O`, which corresponds to the outputs from the VQ. Since SR is independent of
    the speaker, audio samples are taken from around `K` (usually K=100) speakers.
    Then the probability of the observation sequence `O^((k))` given the model is
    calculated and focus lies on maximizing the product as shown in eq. (6.13). This
    is done using the Baum–Welch algorithm \[[33](#bodymatter-006.xhtml#b_9783110670905-006_ref_033)\].


    (6.13)$P = \\prod\\limits\_{k = 1}^{K}P(O^{(k)}|\\lambda)$


    Finding out the probability of the observed sequence then resembles problem 1.
    This process confides in two segments – training and identification. During training,
    a model is built for every word present in the vocabulary and while identifying
    a test observation, each model’s probability to generate the given observation
    sequence is assessed and the test case is classified as the word whose corresponding
    model gives the highest probability. This probability `P(O|λ)` is calculated as
    shown in eqs. (6.14)–(6.17) (all symbols and notations are in accordance with
    the standard HMM model as already described above).


    (6.14)*α*[*t*](*i*) = *P*(*O*[1], *O*[2], …, *O*[*t*], *q*[*t*]\= *S*[*i*]|*λ*)
    (6.15)∴ *α*[1](*i*) = *π*[*i*]*b*[*i*](*O*[1]); 1 ≤ i ≤ N (6.16)$\\alpha\_{t +
    1}\\left( j \\right) = \\left\\lbrack {\\sum\\limits\_{i = 1}^{N\\ }\\alpha\_{t}\\left(
    i \\right)a\_{ij}} \\right\\rbrack b\_{j}\\left( O\_{t + 1} \\right);\\ 1 \\leq
    j \\leq N,\\ 1 \\leq t \\leq T - 1$ (6.17)$P(O|\\lambda) = \\sum\\limits\_{i =
    1}^{N\\ }\\alpha\_{T}\\left( i \\right)$


    In (14) an expression is given, that finds out the probability of an observation
    sequence that ends in a particular state `S[i]` at time `t` = `T`, that is, the
    total duration of observation. This probability is calculated for every state
    in the model. Training involves adjusting the model parameters to maximize the
    probability of every model for each word that they represent for which the solutions
    to problems 2 and 3 are used. Training is terminated after no significant increase
    in probability is obtained or after a certain number of iterations. To better
    each model, parameters like the number of states, the initial state transition
    probability matrix, and the probability of an observation in a state has to be
    tuned in order to reach perfect accuracy. In every iteration of the training phase,
    these values are modified.


    Along with individual word recognition, HMMs also contribute to continuous SR.
    Any sentence, `ς`, is a continuous speech consisting of words. The features in
    this case is a sequence of phones, `℘`, output by an acoustic processor (AP) (Jelinek
    1976). To decide which sentence most probably caused `℘` is on the linguistic
    decoder and this is done by calculating the probability `P(ς |℘)` as shown in
    eq. (6.18).


    (6.18)${By\\, Bayes\\, Theorem}:P(\\varsigma|\\wp)\\ = \\frac{P(\\wp\\ |\\varsigma)P\\left(
    \\varsigma \\right)\\ }{P\\left( \\wp \\right)}$


    In the above equation `P(ς)` is an a-priori probability that is supposed to be
    calculated by the language model (LM). Here is where HMMs come to play because
    it serves as the LM just mentioned. The Raleigh language is an implementation
    of the procedure which serves for relatively simple language models. It is executed
    as a graph with every branch having a state transition probability while word
    lists contained in boxes on the edges serve as choices for the output of transitions.
    Features for each of the words is then extracted using an AP and a corresponding
    HMM is constructed which would either give 1 output or nothing at all. Next, the
    Viterbi algorithm is used to find the most probable state path beginning from
    the start. The word corresponding to this path is taken as the output.


    HMMs had ruled for quite some time around when it was introduced due to its commendable
    performance in certain types of SR. But it turns out that some of the basic assumptions
    made to build up such models are the causes of its limitations. The main Markov
    assumption that the probability of being in a particular state is solely dependent
    only on its previous state is inaccurate because, in case of speech signals, the
    reliance usually extends through more than one state. Also, the assumptions that
    succeeding observations are independent and their distributions can be well represented
    by autoregressive or Gaussian densities, often leads to incorrect outcomes.


    ## 6.3.2 Long short-term memory-recurrent neural networks

    '
  trans: '


    # HMMs 可以是受约束或不受约束的


    Ergodic HMMs 是指从每个状态都可以转移到其他状态的 HMM，因此它们是不受约束的。其他 HMM 变体是左-右(LR)模型，其中从状态 `j` 到状态
    `i` 的转移受到约束，即，如果 j<i，则 `a[ij]` = 0。有时，状态之间的跳跃次数也受到约束，即，如果 j<i 且 j ≥ i+ℋ，则 `a[ij]`
    = 0，其中 ℋ 是跳跃次数。受约束的 HMM 还包括并行 LR 模型，该模型由 2 个并行 LR HMM 之间的交叉耦合链接形成。它们比典型的 LR 模型更宽松，因为它们允许并行路径。


    # HMM 在 SR 中的应用


    在本章中，我们将更多地讨论 HMM 在 SR 中的应用。每个语音处理分类算法都基于提取的特征工作。HMM 已被证明适用于使用线性预测编码 (LPC) 提取的特征。遵循一系列步骤
    \[35\] 来计算 LPC 系数，这些系数对声道进行建模并捕获发音。因此，它们也被称为语音属性。这些系数后来还可用于重新生成原始音频，因此它作为语音压缩算法效果很好。LPC
    给出形成连续值向量的系数；但要将这些系数用作 HMM 的特征，需要离散值，为此执行向量量化 (VQ) 步骤 \[36, 37\]。首先，将解释 HMM 在识别单个单词中的作用，然后是连续
    SR \[37\]。


    在 HMM 方面，任何说出的单词都可以看作是一组观测值 `O`，它对应于 VQ 的输出。由于 SR 与说话人无关，音频样本来自大约 `K` (通常 K=100)
    个说话人。然后计算给定模型下观测序列 `O^((k))` 的概率，重点在于最大化乘积，如 eq. (6.13) 所示。这是使用 Baum–Welch 算法
    \[33\] 完成的。


    (6.13)$P = \\prod\\limits\_{k = 1}^{K}P(O^{(k)}|\\lambda)$


    求出观测序列的概率然后类似于问题 1。该过程分为两个部分——训练和识别。在训练期间，为词汇表中存在的每个单词构建一个模型，而在识别测试观测值时，评估每个模型生成给定观测序列的概率，并将测试用例分类为相应模型给出最高概率的单词。该概率
    `P(O|λ)` 如 eqs. (6.14)–(6.17) 所示计算（所有符号和符号均符合前面已描述的标准 HMM 模型）。


    (6.14)*α**t* = *P*(*O*[1], *O*[2], …, *O*[*t*], *q*[*t*]\= *S*[*i*]|*λ*) (6.15)∴ *α*1 = *π*[*i*]*b**i*; 1 ≤ i ≤ N
    (6.16)$\\alpha\_{t + 1}\\left( j \\right) = \\left\\lbrack {\\sum\\limits\_{i
    = 1}^{N\\ }\\alpha\_{t}\\left( i \\right)a\_{ij}} \\right\\rbrack b\_{j}\\left(
    O\_{t + 1} \\right);\\ 1 \\leq j \\leq N,\\ 1 \\leq t \\leq T - 1$ (6.17)$P(O|\\lambda)
    = \\sum\\limits\_{i = 1}^{N\\ }\\alpha\_{T}\\left( i \\right)$


    在 (14) 中，给出了一个表达式，用于找出在特定状态 `S[i]` 处结束于时间 `t` = `T`（即观测的总持续时间）的观测序列的概率。该概率针对模型中的每个状态进行计算。训练涉及调整模型参数，以最大化每个模型对其所代表的每个单词的概率，为此使用问题
    2 和问题 3 的解决方案。训练在不再获得概率显著增加或经过一定数量的迭代后终止。为了改进每个模型，需要调整状态数量、初始状态转移概率矩阵以及状态中观测的概率等参数，以达到完美的准确性。在训练阶段的每次迭代中，这些值都会被修改。


    除了单个单词识别，HMM 还对连续 SR 有所贡献。任何句子 `ς` 都是由单词组成的连续语音。在这种情况下，特征是由声学处理器 (AP) (Jelinek
    1976) 输出的一系列音素 `℘`。要决定哪个句子最可能导致 `℘`，取决于语言解码器，这是通过计算概率 `P(ς |℘)` 来完成的，如 eq. (6.18)
    所示。


    (6.18)${By\\, Bayes\\, Theorem}:P(\\varsigma|\\wp)\\ = \\frac{P(\\wp\\ |\\varsigma)P\\left(
    \\varsigma \\right)\\ }{P\\left( \\wp \\right)}$


    在上述方程中，`P(ς)` 是先验概率，应该由语言模型 (LM) 计算。HMM 就派上用场了，因为它充当前面提到的 LM。Raleigh 语言是实现该过程的一种实现，适用于相对简单的语言模型。它作为一个图执行，每个分支都有一个状态转移概率，而边缘上的框中包含的单词列表作为转换输出的选择。然后使用
    AP 提取每个单词的特征，并构建相应的 HMM，该模型将给出 1 个输出或根本没有输出。接下来，使用 Viterbi 算法找到从开始处开始的最可能状态路径。该路径对应的单词被视为输出。


    HMM 在引入后相当长一段时间内一直占据主导地位，因为它在某些类型的 SR 中表现出色。但事实证明，构建此类模型时所做的一些基本假设是其局限性的原因。主要的马尔可夫假设，即处于特定状态的概率仅取决于其前一状态，这是不准确的，因为在语音信号的情况下，依赖性通常延伸超过一个状态。此外，后续观测值相互独立且其分布可以由自回归或高斯密度很好地表示的假设，往往会导致错误的结果。


    ## 6.3.2 长短期记忆-循环神经网络


    '
