    # 6 Recurrent Neural Networks (RNNs)


    We first present the overall RNN framework, and then two types of units widely
    used in practice: the LSTM and the GRU. A good review of RNNs, LSTMs and their
    applications can be found in [19].


    # 6.1 RNN framework


    While CNNs are naturally good at dealing with grids, RNNs were specifically developed
    to be used with *sequences* [6]. Some examples include time series, or, in NLP,
    words (sequences of characters) or sentences (sequences of words). CNNs do allow
    to capture some order information, but it is limited to *local* patterns, and
    long-range dependencies are ignored [8]. As shown in Fig. 6, a RNN can be viewed
    as a chain of simple neural layers that *share* the same parameters.


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_8_1.png)


    Figure 6: 3 steps of an unrolled RNN (adapted from Denny Britz'' blog. Each circle
    represents a RNN unit (see equations 6 & 7).


    From a high level, a RNN is fed an ordered list of input vectors $\{x_{1},...,x_{T}\}$
    as well as an initial hidden state $h_{0}$ initialized to all zeros, and returns
    an ordered list of hidden states $\{h_{1},...,h_{T}\}$, as well as an ordered
    list of output vectors $\{y_{1},...,y_{T}\}$. The output vectors may serve as
    input for other RNN units, when considering deep architectures (multiple RNN layers
    stacked vertically, as shown in Fig. 7). The hidden states correspond more or
    less to the “short-term” memory of the network. Note that each training example
    is a full $\{x_{1},...,x_{T}\}$ sequence of its own, and may be associated with
    a label depending on the task. E.g., for short document classification, the'
  merge: -1
  img_proc: true
