- pgno: 6
  md: 'be predicted:


    $\operatorname{softmax}(x_i) = \frac{e^{x_i}}{\sum_{j=1}^{K} e^{x_j}}$ (4)


    In the binary classification case, instead of having a final output layer of two
    neurons with a softmax, where each neuron represents one of the two classes, we
    can have an output layer with only one neuron and a sigmoid function ($\sigma(x)
    = \frac{1}{1 + e^{-x}}$). In that case, the neuron outputs the probability of
    belonging to one of the two classes, and decision regarding the class to predict
    is made based on whether $\sigma(x)$ is greater or smaller than 0.5 (assuming
    equal priors). These two approaches are equivalent. Indeed, $\frac{1}{1+e^{-x}}
    = \frac{e^{x}}{e^{x} + e^{0}}$. So, the one-neuron sigmoid layer can be viewed
    as a two-neuron softmax layer where one of the neurons never activates and has
    its output always equal to zero.


    # 5.3 Number of parameters


    The total number of trainable parameters for our CNN is the sum of the following
    terms:


    +   * **word embedding matrix** (only if non-static mode): $(V+1) \times d$, where
    $V$ is the size of the vocabulary. We add one row for the zero-padding vector.

    * **convolution layer:** $h \times d \times n_f + n_f$ (the number of entries
    in each filter by the number of filters, plus the biases).

    * **softmax layer:** $n_f \times 1 + 1$ (fully connected layer with an output
    dimension of 1 and one bias).


    # 5.4 Visualizing and understanding inner representations and predictions


    # 5.4.1 Document embeddings


    A fast and easy way to verify that our model is learning effectively is to check
    whether its internal document representations make sense. Recall that the feature
    vector which is fed to the softmax layer can be seen as an $n_f$-dimensional encoding
    of the input document. By collecting the intermediate output of the model at this
    precise level in the architecture for a subset of documents, and projecting the
    vectors to a low-dimensional map, we can thus visualize whether there is any correlation
    between the embeddings and the labels. Fig.$2$ and $3$ prove that indeed, our
    model is learning meaningful representations of documents.


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_6_0.png)


    Figure 2: Doc embeddings before training.


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_6_1.png)


    Figure 3: Doc embeddings after 2 epochs.'
