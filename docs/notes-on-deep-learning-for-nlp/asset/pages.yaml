    # 5.2.4 Document encoding


    As shown in Fig. 1, looking at things from a high level, the CNN architecture
    connects each filtered version of the input to a single neuron in a final feature
    vector. This vector can be seen as an embedding, or encoding, of the input document.
    It is the main contribution of the model, the thing we''re interested in. The
    rest of the architecture just depends on the task.


    # 5.2.5 Softmax layer


    Since the goal here is to classify documents, a softmax function is applied to
    the document encoding to output class probabilities. However, different tasks
    would call for different architectures: determining whether two sentences are
    paraphrases, for instance, would require two CNN encoders sharing weights, with
    a final energy function and a contrastive loss (à la Siamese [3]); for translation
    or summarization, we could use a LSTM language model decoder conditioned on the
    CNN encoding of the input document (à la seq-to-seq [24]), etc.


    Going back to our classification setting, the softmax transforms a vector $x \in
    \mathbb{R}^K$ into a vector of positive floats that sum to one, i.e., into a *probability
    distribution* over the classes to'
