  md: 'sequences would be associated with a label, whereas for language modeling,
    we would just parse all sequences, repeatedly predicting the next words.


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_9_0.png)


    At any step $t$ in the sequence, the hidden state $h_{t}$ is defined in terms
    of the previous hidden state $h_{t-1}$ and the current input vector $x_{t}$ in
    the following recursive way:


    > $\displaystyle h_{t}=f(Ux_{t}+Wh_{t-1}+b)$


    Where $f$ is a nonlinearity such as $\mathbf{tanh}$ (applied elementwise), $x_{t}
    \in \mathbb {R}^{d_{in}}$, $U \in \mathbb {R}^{H \times d_{in}}$ and $W \in \mathbb
    {R}^{H \times H}$ are parameter matrices shared by all time steps, and $h_{t}$,
    $h_{t-1}$ and $b$ belong to $\mathbb {R}^{H}$. $d_{in}$ can be the size of the
    vocabulary, if one-hot vectors are passed as input, or the dimensionality of the
    embedding space, when working with shared features. $H$ is the dimension of the
    hidden layer. Usually, $H \sim 100$. The larger this layer, the greater the capacity
    of the memory, with an increase in computational cost.


    The output vector $y_{t} \in \mathbb {R}^{d_{out}}$ transforms the current hidden
    state $h_{t} \in \mathbb {R}^{H}$ in a way that depends on the final task. For
    classification, it is computed as:


    > $\displaystyle y_{t} = \text{softmax}(Vh_{t})$


    Where $V \in \mathbb {R}^{d_{out} \times H}$ is a parameter matrix shared across
    all time steps. $d_{out}$ depends on the number of categories. E.g., for 3-class
    document classification, $d_{out}=3$, for a word-level language model, $d_{out}=|V|$.


    Note that when stacking multiple RNN layers vertically (deep RNN architecture),
    the hidden states of the units below are directly connected to the units above,
    i.e., $x_{t}^{above}=y_{t}^{below}$ and $y_{t}^{below}=h_{t}^{below}$. The output
    layer (Eq. 7) lies on top of the stack.


    # 6.1.1 Language modeling


    Language modeling is a special case of classification where the model is trained
    to predict the next word or character in the sentence. At each time step $t$,
    the output vector gives the probability distribution of $x_{t}$ over all the words/characters
    in the vocabulary, conditioned on the previous words/characters in the sequence,
    that is, $P[x_{t}|x_{t-1},...,x_{1}]$. At test time, the probability of a full
    sequence ${x_{1},...,x_{T}}$ is given by the product of all conditional probabilities
    as:


    > $\displaystyle P[{x_{1},...,x_{T}}] = P[x_{1}] \times \prod_{t=2}^{T} P[x_{t}|x_{t-1},...,x_{1}]$


    The language model can also be used to generate text of arbitrary size by repeatedly
    sampling characters for the desired number of time steps (for character-level
    granularity) or until the'
