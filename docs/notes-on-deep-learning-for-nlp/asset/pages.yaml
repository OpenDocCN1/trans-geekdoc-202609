    # 7.2 Self-attention


    We are here in a simpler setting with a single RNN encoder taking as input a sequence
    $(x_1, \dots, x_T)$ of length $T$. As usual, the RNN maps the input sequence to
    a sequence of annotations $(h_1, \dots, h_T)$. The goal is exactly the same as
    with attention in the encoder-decoder context: rather than considering the last
    annotation $h_T$ as a comprehensive summary of the entire sequence, which is prone
    to information loss, a new hidden representation is computed by taking into account
    the annotations at *all* time steps. To this purpose, the self-attention or inner
    attention mechanism emerged in the literature in 2016/2017, e.g., [27, 18]. In
    what follows we use the formulation of [27].


    As shown in Eq. 23, annotation $h_t$ is first passed to a dense layer. An alignment
    coefficient $\alpha_t$ is then derived by comparing the output $u_t$ of the dense
    layer with a trainable context vector $u$ (initialized randomly) and normalizing
    with a softmax. The attentional vector $s$ is finally obtained as a weighted sum
    of the annotations.


    ```

    $u_t = \tanh(W h_t)$


    $\alpha_t = \frac{\exp(\text{score}(u_t, u))}{\sum_{t''=1}^T \exp(\text{score}(u_{t''},
    u))} \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad (23)$


    $s = \sum_{t=1}^T \alpha_t h_t$

    ```


    score can in theory be any alignment function. A straightforward approach is to
    use $\text{score}(u_t, u) = u_t^\top u$. The context vector can be interpreted
    as a representation of the optimal word, on average. When faced with a new example,
    the model uses this knowledge to decide which word it should pay attention to.
    During training, through backpropagation, the model updates the context vector,
    i.e., it adjusts its internal representation of what the optimal word is.


    # 7.2.1 Difference with seq2seq attention


    The context vector in the definition of self-attention above has nothing to do
    with the context vector used in seq2seq attention! In seq2seq attention, the context
    vector $c_t$ is equal to the weighted sum $\sum_{i=1}^{T_s} \alpha_{t,i} \tilde{h}_i$,
    and is used to compute the attentional hidden state as $\tilde{h}_t = \tanh(W_c
    [c_t; h_t])$. In'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'self-attention however, the context vector is simply used as a replacement
    for the hidden state of the decoder when performing the alignment with score(),
    since there is no decoder. So, in self-attention, the alignment vector α indicates
    the *similarity of each input word with respect to the optimal word (on average)*,
    while in seq2seq attention, α indicates *the relevance of each source word in
    generating the next element of the target sentence*.


    # 7.2.2 Hierarchical attention


    A simple, good example of how self-attention can be useful in practice is provided
    by the architecture illustrated in Fig. 14. In this architecture, the self-attention
    mechanism comes into play twice: at the word level, and at the sentence level.
    This approach makes sense for two reasons: first, it matches the natural hierarchical
    structure of documents (words → sentences → document). Second, in computing the
    encoding of the document, it allows the model to first determine which words are
    important in each sentence, and then, which sentences are important overall. Through
    being able to re-weigh the word attentional coefficients by the sentence attentional
    coefficients, the model captures the fact that a given instance of word may be
    very important when found in a given sentence, but another instance of the same
    word may not be that important when found in another sentence.


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_18_0.png)


