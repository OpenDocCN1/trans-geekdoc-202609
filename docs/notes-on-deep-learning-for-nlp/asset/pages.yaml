  md: '# # 5 Convolutional Neural Networks (CNNs)


    # ## 5.1 Local invariance and compositionality


    Initially inspired by studies of the cat’s visual cortex [12], CNNs were developed
    in computer vision to work on regular grids such as images [16]. They are feedforward
    neural networks where each neuron in a layer receives input from a neighborhood
    of the neurons in the previous layer. Those neighborhoods, or *local receptive
    fields*, allow CNNs to recognize more and more complex patterns in a hierarchical
    way, by combining lower-level, elementary features into higher-level features.
    This property is called *compositionality*. For instance, edges can be inferred
    from raw pixels, edges can in turn be used to detect simple shapes, and finally
    shapes can be used to recognize objects. Furthermore, the absolute positions of
    the features in the image do not matter. Only capturing their respective positions
    is useful for composing higher-level patterns. So, the model should be able to
    detect a feature regardless of its position in the image. This property is called
    *local invariance*. Compositionality and local invariance are the two key concepts
    of CNNs.


    CNNs have reached very good performance in computer vision [15], but it is not
    difficult to understand that thanks to compositionality and local invariance,
    they can also do very well in NLP. Indeed, in NLP, high-order features (*n*-grams)
    can be constructed from lower-order features just like in CV, and ordering is
    crucial locally (“not bad, quite good”, “not good, quite bad”, “do not recommend”),
    but not at the document level. Indeed, in trying to determine the polarity of
    a movie review, we don’t really care whether “not bad, quite good” is found at
    the start or at the end of the document. We just need to capture the fact that
    “not” precedes “bad”, and so forth. Note that CNNs are not able to encode long-range
    dependencies, and therefore, for some tasks like language modeling, where long-distance
    dependence matters, recurrent architectures such as LSTMs are preferred.


    # ## 5.2 Convolution and pooling


    Though recent work suggests that convolutional layers may directly be stacked
    on top of each other [23], the elementary construct of the CNN is a *convolution*
    layer followed by a *pooling* layer. In what follows, we will detail how these
    two layers interplay, using as an example the NLP task of short document classification
    (see Fig. 1).


    # ### 5.2.1 Input


    We can represent a document as a real matrix $A \in \mathbb{R}^{s \times d}$,
    where $s$ is the document length, and $d$ is the dimension of the word embedding
    vectors. Since $s$ must be fixed at the collection level but the documents are
    of different sizes, we truncate the longer documents to their first $s$ words,
    and pad the shorter documents with a special zero vector as many times as necessary.
    The word vectors may either be initialized randomly or be pre-trained. In the
    latter case, they can be updated during training or not (“non-static” vs. “static”
    approach [14]).


    Thinking of $A$ as an image is misleading, because there is only one spatial dimension.
    The embedding vectors are not actually part of the input itself, they just represent
    the coordinates of the elements of the input in a shared latent space. In computer
    vision, the term *channels* is often used to refer to this *depth* dimension (not
    to be mistaken with the number of hidden layers in the network). If we were dealing
    with images, we would have two spatial dimensions, plus the depth. The input would
    be a tensor of dimensionality (width × height × n_channels), i.e., a 2D matrix
    where each entry would be associated with a vector of length 3 or 1, respectively
    in the case of color (RGB) and grey level images.'
