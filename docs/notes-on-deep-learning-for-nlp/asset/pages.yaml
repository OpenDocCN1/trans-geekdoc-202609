  md: "# 5.4.2 Predictive regions identification\n\nThis approach is presented in\
    \ section 3.6 (Tables 5 & 6) of [13]. Recall that before we lose positional information\
    \ by applying pooling, each of the $n_f$ filters of size $h$ is associated with\
    \ a vector of size $(s-h)/stride+1$ (a feature map) whose entries represent the\
    \ output of the convolution of the filter with the corresponding receptive field\
    \ in the input, after application of the nonlinearity and addition of the bias.\
    \ Therefore, each receptive field is embedded into an $n_f$-dimensional space.\
    \ Thus, after training, we can identify the regions of a given document that are\
    \ the most predictive of its category by inspecting the intermediate output of\
    \ the model corresponding to the receptive field embeddings (right before the\
    \ pooling layer), and by finding the regions that have the highest norms. For\
    \ instance, some of the most predictive regions for negative IMDB reviews are:\
    \ “worst movie ever”, “don’t waste your money”, “poorly written and acted”, “awful\
    \ picture quality”. Conversely, some regions very indicative of positivity are:\
    \ “amazing soundtrack”, “visually beautiful”, “cool journey”, “ending quite satisfying”...\n\
    \n# 5.4.3 Saliency maps\n\nAnother way to understand how the model is issuing\
    \ its predictions was described by [22] and applied to NLP by [17]. The idea is\
    \ to rank the elements of the input document $A \\in \\mathbb{R}^{s \\times d}$\
    \ based on their influence on the prediction. An approximation can be given by\
    \ the magnitudes of the first-order partial derivatives of the output of the model\
    \ $\\text{CNN}: A \\mapsto \\text{CNN}(A)$ with respect to each row $a$ of $A$:\
    \ \n\n```\n$$ \\text{saliency}(a) = \\left| \\frac{\\partial(\\text{CNN})}{\\\
    partial a} \\right|_a \\tag{5} $$\n```\n\nThe interpretation is that we identify\
    \ which words in $A$ need to be *changed the least to change the class score the\
    \ most*. The derivatives can be obtained by performing a single back-propagation\
    \ pass (based on the prediction, not the loss like during training). Fig.4 4 and\
    \ 5 5 show saliency map examples for negative and positive reviews, respectively.\n\
    \n![](img/cff14e17039cb2b04cb132bbbb5e2363_7_0.png)\n\nFigure 4: Saliency map\
    \ for document 1 of the IMDB test set (true label: positive)"
