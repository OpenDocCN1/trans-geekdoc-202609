    然而，在自注意力机制中，由于没有解码器，上下文向量只是作为解码器隐藏状态的替代品，在执行与 `score()` 的对齐操作时使用。因此，在自注意力中，对齐向量
    α 指示 *每个输入词相对于最优词（在平均意义上）的相似度*，而在序列到序列（seq2seq）注意力中，α 指示 *每个源词在生成目标句子下一个元素时的相关性*。


    ## 7.2.2 层次化注意力


    自注意力机制在实践中如何有益的简单而良好的例子，由图 14 所示的架构提供。在此架构中，自注意力机制发挥了两次作用：一次在词级别，另一次在句子级别。这种方法之所以合理，有两个原因：首先，它符合文档的自然层次结构（词
    → 句子 → 文档）。其次，在计算文档的编码时，它允许模型先确定每个句子中哪些词是重要的，然后确定整体上哪些句子是重要的。通过能够利用句子注意力系数重新加权词注意力系数，模型捕捉到了这样一个事实：某个给定的词实例在特定的句子中可能非常重要，而同一词的另一个实例在另一个句子中可能并不那么重要。


