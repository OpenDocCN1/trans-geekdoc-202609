    # 7.2.2 Hierarchical attention


    A simple, good example of how self-attention can be useful in practice is provided
    by the architecture illustrated in Fig. 14. In this architecture, the self-attention
    mechanism comes into play twice: at the word level, and at the sentence level.
    This approach makes sense for two reasons: first, it matches the natural hierarchical
    structure of documents (words → sentences → document). Second, in computing the
    encoding of the document, it allows the model to first determine which words are
    important in each sentence, and then, which sentences are important overall. Through
    being able to re-weigh the word attentional coefficients by the sentence attentional
    coefficients, the model captures the fact that a given instance of word may be
    very important when found in a given sentence, but another instance of the same
    word may not be that important when found in another sentence.


