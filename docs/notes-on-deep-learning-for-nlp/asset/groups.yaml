    # 1 Disclaimer


    Writing these notes is part of my learning process, so it is a work in progress.
    To write the current version of this document, I curated information mainly from
    the original 2D CNN paper [16] and Stanford’s CS231n CNN course notes¹, Zhang
    and Wallace practitioners’ guide to CNNs in NLP [26], the seminal papers on CNN
    for text classification [13, 14], Denny Britz’ tutorial² on RNNs, Chris Olah’s
    post³ on understanding the LSTM unit, and the seminal papers on the GRU unit [2,
    4], encoder-decoder architectures [2, 24] and attention [20, 1]. Last but not
    least, Yoav Goldberg’s primer on neural networks for NLP [8] and Luong, Cho and
    Manning tutorial on neural machine translation⁴ proved very useful.


    # 2 Code


    I implemented some of the models described in this document in Keras and tested
    them on the IMDB movie review dataset. The code can be found on my GitHub: https://github.com/Tixierae/deep_learning_NLP.
    Again, this is a work in progress.


    # 3 IMDB Movie review dataset


    # 3.1 Overview


    The task is to perform binary classification (positive/negative) on reviews from
    the Internet Movie Database (IMDB) dataset⁵, which is known as sentiment analysis
    or opinion mining. The dataset contains 50K movie reviews, labeled by polarity.
    The data are partitioned into 50% for training and 50% for testing. The imdb\_preprocess.py
    script on my GitHub cleans the reviews and put them in a format suitable to be
    passed to neural networks: each review is a list of word indexes (integers) from
    a dictionary of size V where the most frequent word has index 1.


    # 3.2 Binary classification objective function


    The objective function that our models will learn to minimize is the log loss,
    also known as the cross entropy. More precisely, in a binary classification setting
    with 2 classes (say 0 and 1) the log loss is defined as:


    ```

    logloss $= -\frac{1}{N} \sum_{i=1}^{N} \left( y_i \log p_i + (1-y_i) \log(1-p_i)
    \right)$ (1)

    ```


    +   ¹http://cs231n.github.io/convolutional-networks/

    ²http://www.wildml.com/2015/09/recurrent-neural-networks-tutorial-part-1-introduction-to-rnns/

    ³http://colah.github.io/posts/2015-08-Understanding-LSTMs/

    ⁴https://sites.google.com/site/acl16mnt/home

    ⁵http://ai.stanford.edu/~amaa/data/sentiment/'
  - '[PAGE 2]


    Where $N$ is the number of observations, $p_i$ is the probability assigned to
    class 1, $(1-p_i)$ is the probability assigned to class 0, and $y_i$ is the true
    label of the $i^{th}$ observation (0 or 1). You can see that only the term associated
    with the true label of each observation contributes to the overall score. For
    a given observation, assuming that the true label is 1, and the probability assigned
    by the model to that class is 0.8 (quite good prediction), the log loss will be
    equal to $-\log(0.8) = 0.22$. If the prediction is slightly worse, but not completely
    off, say with $p_i = 0.6$, the log loss will be equal to 0.51, and for 0.1, the
    log loss will reach 2.3. Thus, the further away the model gets from the truth,
    the greater it gets penalized. Obviously, a perfect prediction (probability of
    1 for the right class) gets a null score.


    # # 4 Paradigm switch


    # ## 4.1 Feature embeddings


    Compared to traditional machine learning models that consider core features and
    combinations of them as unique dimensions of the feature space, deep learning
    models often *embed* core features (and core features only) as vectors in a low-dimensional
    continuous space where dimensions represent shared latent concepts $[8]$. The
    embeddings are initialized randomly or obtained from pre-training$^6$. They can
    then be updated during training just like other model parameters, or be kept static.


    # ## 4.2 Benefits of feature embeddings


    The main advantage of mapping features to dense continuous vectors is the ability
    to capture similarity between features, and therefore to generalize. For instance,
    if the model has never seen the word “Obama” during training, but has encountered
    the word “president”, by knowing that the two words are related, it will be able
    to transfer what it has learned for “president” to cases where “Obama” is involved.
    With traditional one-hot vectors, those two features would be considered orthogonal
    and predictive power would not be able to be shared between them$^7$. Also, going
    from a huge sparse space to a dense and compact space reduces computational cost
    and the amount of data required to fit the model, since there are fewer parameters
    to learn.


    # ## 4.3 Combining core features


    Unlike what is done in traditional ML, combinations of core features are not encoded
    as new dimensions of the feature space, but as the *sum, average, or concatenation*
    of the vectors of the core features that are to be combined. Summing or averaging
    is an easy way to always get a fixed-size input vector regardless of the size
    of the training example (e.g., number of words in the document). However, both
    of these approaches completely ignore the ordering of the features. For instance,
    under this setting, and using n-grams as features, the two sentences “John is
    quicker than Mary” and “Mary is quicker than John” have the exact same representation.
    On the other hand, using concatenation allows to keep track of ordering, but *padding*
    and *truncation*$^8$ need to be used so that the same number of vectors are concatenated
    for each training example. For instance, regardless of its size, every document
    in the collection can be transformed to have the same fixed length $s$: the longer
    documents are truncated to their first (or last, middle...) $s$ words, and the
    shorter documents are padded with a special zero vector to make up for the missing
    words $[26, 14]$


    > $^6$ In NLP, Pre-trained word vectors obtained with Word2vec or GloVe from very
    large corpora are often used. E.g., Google News **word2vec** vectors can be obtained
    from https://code.google.com/archive/p/word2vec/, under the section “Pre-trained
    word and phrase vectors”


    > $^7$ Note that one-hot vectors can be passed as input to neural networks. But
    then, the network implicitly learns feature embeddings in its first layer


    > $^8$ https://keras.io/preprocessing/sequence/'
