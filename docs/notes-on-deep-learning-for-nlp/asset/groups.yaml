    \    - 6.1.1 语言建模\n  - 6.2 LSTM单元\n    - 6.2.1 内部层\n    - 6.2.2 遗忘/学习\n    - 6.2.3\
    \ 普通RNN类比\n  - 6.3 门控循环单元（GRU）\n  - 6.4 RNN与LSTM与GRU的比较\n- 7 注意力机制\n  - 7.1 编码器-解码器注意力机制\n\
    \    - 7.1.1 编码器-解码器概述\n    - 7.1.2 编码器\n    - 7.1.3 解码器\n    - 7.1.4 全局注意力\n\
    \    - 7.1.5 局部注意力\n  - 7.2 自注意力机制\n    - 7.2.1 与seq2seq注意力机制的区别\n    - 7.2.2\
    \ 层级注意力\n\n## 1 免责声明\n\n撰写这些笔记是我学习过程的一部分，因此这是一份正在进行中的工作。为了编写本文档的当前版本，我主要整合了原始2D\
    \ CNN论文 [16]、斯坦福大学CS231n CNN课程笔记 [1]、Zhang和Wallace关于NLP中CNN的实践指南 [26]、关于文本分类CNN的经典论文\
    \ [13, 14]、Denny Britz关于RNN的教程 [2]、Chris Olah关于理解LSTM单元的文章 [3]、以及关于GRU单元的经典论文\
    \ [2, 4]、编码器-解码器架构 [2, 24] 和注意力机制 [20, 1]。最后但同样重要的是，Yoav Goldberg关于用于NLP的神经网络的入门指南\
    \ [8] 和Luong、Cho以及Manning关于神经机器翻译的教程 [4] 证明非常有价值。\n\n## 2 代码\n\n我用Keras实现了本文档中描述的一些模型，并在IMDB影评数据集上进行了测试。代码可以在我的GitHub上找到：https://github.com/Tixierae/deep_learning_NLP。再次强调，这是一份正在进行中的工作。\n\
    \n## 3 IMDB影评数据集\n\n### 3.1 概述\n\n任务是对来自互联网电影数据库（IMDB）数据集 [5] 的影评进行二分类（正面/负面），这被称为情感分析或观点挖掘。该数据集包含5万条影评，按极性进行标注。数据被划分为50%用于训练，50%用于测试。我在GitHub上的\
    \ `imdb_preprocess.py` 脚本清理了影评，并将它们整理成适合传入神经网络的格式：每条评论是一个单词索引（整数）的列表，来自大小为 $V$\
    \ 的字典，其中最频繁的单词索引为1。\n\n### 3.2 二分类目标函数\n\n我们的模型将要学习最小化的目标函数是对数损失，也被称为交叉熵。更具体地说，在具有2个类别（假设为0和1）的二分类设置中，对数损失定义为：\n\
    \n$$\n\\text{logloss} = -\\frac{1}{N} \\sum_{i=1}^{N} \\left( y_i \\log p_i +\
    \ (1-y_i) \\log(1-p_i) \\right) \\quad (1)\n$$\n\n其中 $N$ 是观察值的数量，$p_i$ 是分配给类别1的概率，$(1-p_i)$\
    \ 是分配给类别0的概率，$y_i$ 是第 $i^{th}$ 个观察值的真实标签（0或1）。你可以看到，只有与每个观察值真实标签相关的项才贡献于整体得分。对于给定的观察值，假设真实标签是1，且模型分配给该类的概率是0.8（相当好的预测），那么对数损失将等于\
    \ $-\\log(0.8) = 0.22$。如果预测稍差，但并非完全错误，例如 $p_i = 0.6$，对数损失将等于0.51，而对于0.1，对数损失将达到2.3。因此，模型与真相偏离得越远，其受到的惩罚就越大。显然，完美的预测（正确类别的概率为1）得分为零。\n\
    \n## 4 范式转变\n\n### 4.1 特征嵌入\n\n与传统机器学习模型将核心特征及其组合视为特征空间的独立维度不同，深度学习模型通常将核心特征（且仅限核心特征）*嵌入*到低维连续空间中的向量，其中的维度代表共享的潜在概念\
    \ [8]。嵌入可以是随机初始化的，也可以是从预训练 [6] 中获得的。然后，它们可以在训练过程中像其他模型参数一样被更新，或者保持静态。\n\n### 4.2\
    \ 特征嵌入的优势\n\n将特征映射到稠密连续向量的主要优势在于能够捕捉特征之间的相似性，从而实现泛化。例如，如果模型在训练期间从未见过单词“Obama”，但遇到过单词“president”（总统），通过知道这两个单词是相关的，它就能将对于“president”学到的知识转移到涉及“Obama”的情况中。使用传统的独热向量（one-hot\
    \ vectors），这两个特征将被视为正交的，预测能力无法在它们之间共享 [7]。此外，从巨大的稀疏空间转向稠密且紧凑的空间减少了计算成本和拟合模型所需的数据量，因为需要学习的参数更少。\n\
    \n### 4.3 组合核心特征\n\n与传统机器学习不同，核心特征的组合作为被组合的核心特征向量的*和、平均值或拼接*来编码，而不是特征空间的新维度。求和或求平均值是一种简单的方法，无论训练示例的大小（例如，文档中的单词数量）如何，都能始终获得固定大小的输入向量。然而，这两种方法都完全忽略了特征的顺序。例如，在这种设置下，使用n-gram作为特征，句子“John\
    \ is quicker than Mary”（约翰比玛丽快）和“Mary is quicker than John”（玛丽比约翰快）具有完全相同的表示。另一方面，使用拼接可以保留顺序，但每个训练示例需要*填充*和*截断*\
    \ [8]，以确保拼接相同数量的向量。例如，无论其大小如何，集合中的每个文档都可以转换为具有相同的固定长度 $s$：较长的文档被截断为其前（或后、中间...）$s$\
    \ 个单词，而较短的文档则用特殊的零向量进行填充，以补齐缺失的单词 [26, 14]\n\n---\n\n[1] http://cs231n.github.io/convolutional-networks/\n\
    [2] http://www.wildml.com/2015/09/recurrent-neural-networks-tutorial-part-1-introduction-to-rnns/\n\
    [3] http://colah.github.io/posts/2015-08-Understanding-LSTMs/\n[4] https://sites.google.com/site/acl16mnt/home\n\
    [5] http://ai.stanford.edu/~amaa/data/sentiment/\n[6] 在NLP中，通常使用Word2vec或GloVe从非常语料库中获得的预训练词向量。例如，Google\
    \ News的**word2vec**向量可以从 https://code.google.com/archive/p/word2vec/ 获得，在“Pre-trained\
    \ word and phrase vectors”（预训练单词和短语向量）部分下\n[7] 请注意，独热向量可以作为输入传入神经网络。但随后，网络会在其第一层隐式地学习特征嵌入\n\
    [8] https://keras.io/preprocessing/sequence/\n"
