    ## 7.1.2 编码器


    源句子可以通过任何模型（例如，CNN、全连接网络）进行嵌入。不过，对于机器翻译（MT）而言，编码器通常是一个深度循环神经网络（RNN）。Bahdanau等人[1]最初使用的是*双向*深度RNN。这种模型由两个深度单向RNN组成，除了词嵌入矩阵外，它们的参数不同。第一个*前向*RNN从左到右处理源句子，而第二个*后向*RNN则从右到左处理该句子。在每一个时间步
    $t$，两个句子嵌入被连接起来，以获得双向RNN的内部表示：


    $$h_t = [\vec{h}_t; \vec{h}_t] \tag{15}$$


    双向RNN在编码源单词时会考虑整个上下文，而不仅仅是前文。结果是，$h_t$ 倾向于以单词 $x_t$ 为中心的一个小窗口，而单向RNN中的 $h_t$ 则倾向于
    $x_t$ 及其紧挨着的前几个单词。关注围绕 $x_t$ 的小窗口可能是有利的，但似乎并非至关重要。事实上，Luong等人[20]使用普通的单向深度RNN编码器也取得了最先进（state-of-the-art）的结果。在后续内容中，编码器的隐藏状态将写作
    $\hat{h}_t$。它们在文献中有时被称为*注释*（annotations）。


    ## 7.1.3 解码器


    虽然不同的模型都可以作为编码器，但在神经机器翻译（NMT）中，解码器通常是一个单向RNN，因为该模型自然适应生成任务的序列特性，且通常是深度的（堆叠结构）。解码器每次生成目标句子的一个单词，一步一生成。


    **核心思想。** 强制解码器仅使用编码器生成的最后一个注释 $h_{T_x}$ 来产生输出，这迫使编码器尽可能多的信息压缩进 $h_{T_x}$。由于 $h_{T_x}$
    是一个固定大小的单个向量，其容量有限，因此会丢失一些信息。另一方面，注意力机制允许解码器在生成过程的每一步都考虑编码器产生的整个注释序列 $(h_1, \ldots,
    h_{T_x})$。因此，编码器能够通过将所有注释中的信息进行分布来保留更多的信息，因为它知道解码器稍后能够决定应该关注哪些向量。


    更具体地说，目标句子 $y = (y_1, \ldots, y_{T_y})$ 是基于以下分布，每次生成一个单词 $y_t$：


    $$P[y_t | \{y_1, \ldots, y_{t-1}, c_t\}] = \text{softmax}(W_s \hat{h}_t) \tag{16}$$


    其中，$\hat{h}_t$，即*注意力*隐藏状态，计算如下：


    $$\hat{h}_t = \text{tanh}\big(W_c[c_t; h_t]\big) \tag{17}$$


    $h_t$ 是解码器的隐藏状态（当解码器是堆叠RNN时，为顶层的隐藏状态），它提供了关于之前生成的目标单词 $\{y_1, \ldots, y_{t-1}\}$
    的信息；$c_t$ 是源上下文向量；$[;]$ 表示连接（concatenation）。$W_s$ 和 $W_c$ 是可训练参数矩阵。为了简洁，未显示偏置项。如图11所示，上下文向量
    $c_t$ 可以通过两种方式计算：*全局*方式和*局部*方式。我们在接下来的两个小节中分别描述每种方法。


    **关于束搜索（beam search）的说明。** 尝试词汇表中所有可能的单词组合以找到联合概率最高的目标句子是不可行的。但另一方面，以纯粹的贪婪方式生成
    $y$（即每次都选择最可能的单词）是非常次优的。在实践中，使用*束*搜索（一种启发式搜索算法[7]）探索一定数量 $K$ 的候选翻译。较大的 K 值能生成更好的目标句子，但会降低解码速度。


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_15_0.png)


    图 11：全局注意力（左）与局部注意力（右）。改编自 [20]。


    ### 7.1.4 全局注意力


    在此，上下文向量 $c_t$ 计算为源句子*完整列表*注释 $\tilde{h}_i$（即编码器的隐藏状态）的加权和。共有 $T_x$ 个注释。每一个都是大小为编码器隐藏层单元数的向量。$c_t$
    的大小与任何注释相同。对齐向量 $\alpha_t$ 的大小等于源句子的大小 $T_x$，因此它是*可变*的。


    $c_t = \sum_{i=1}^{T_x} \alpha_{t,i} \tilde{h}_i$ (18)


    对齐向量 $\alpha_t$ 通过对当前的目标隐藏状态 $h_t$ 和所有源隐藏状态 $\tilde{h}_i$ 之间的*对齐*操作（$\textbf{score()}$）的输出应用
    softmax 来计算：


    $\alpha_{t,i} = \frac{\exp(\textbf{score}(h_t, \tilde{h}_i))}{\sum_{i''=1}^{T_x}
    \exp(\textbf{score}(h_t, \tilde{h}_{i''}))}$ (19)


    换句话说，$\alpha_t$ 是所有源隐藏状态上的概率分布（其系数都在 0 和 1 之间，且总和为 1），并指示源句子中哪些单词最有可能有助于预测下一个单词。**score()**
    在理论上可以是任何比较函数。Luong等人[20]实验了内积（$\textbf{score}(h_t, \tilde{h}_i) = h_t^\top \tilde{h}_i$）、带有参数矩阵的更通用形式（$\textbf{score}(h_t,
    \tilde{h}_i) = h_t^\top W_a \tilde{h}_i$）以及全连接层。他们发现*内积*在全局注意力中表现更好，而*通用*形式在局部注意力中更优越。图
    12 提供了全局注意力的总结。


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_16_0.png)


    图 12：*全局注意力*机制的总结 [20]。


    ### 7.1.5 局部注意力


    考虑源句子中的所有单词来生成每一个目标单词代价高昂，且可能并非必要。为了解决这个问题，Luong等人[20]提出仅关注固定大小 $2D + 1$ 的注释小窗口：


    $$c_t = \sum_{i=p_t-D}^{p_t+D} \alpha_{t,i}\tilde{h}_i \quad\quad\quad\quad\quad\quad
    (20)$$


    $D$ 由用户指定，窗口中心位置 $p_t$ 要么设置为 $t$（*单调对齐*），要么通过基于存储在 $h_t$ 中的之前生成的目标单词 $\{y_1,...,y_{t-1}\}$
    信息的可微分机制（*预测对齐*）确定：


    $$p_t = T_x \cdot (v_p^{\top}\tanh(W_p h_t)) \quad\quad\quad\quad\quad\quad (21)$$


    其中 $T_x$ 是源句子的长度，$\sigma$ 是 sigmoid 函数，$v_p$ 和 $W_p$ 是可训练参数。对齐权重的计算方式类似于全局注意力（公式
    19），但增加了一个以 $p_t$ 为中心、标准差为 $D/2$ 的正态分布项：


    $$\alpha_{t,i} = \frac{\exp(\text{score}(h_t, \tilde{h}_i))}{\sum_{i''=p_t-D}^{p_t+D}
    \exp(\text{score}(h_t, \tilde{h}_{i''}))} \exp\left(-\frac{(i-p_t)^2}{2(D/2)^2}\right)
    \quad\quad\quad (22)$$


    注意 $p_t \in \mathbb{R} \cap [0, T_x]$ 且 $i \in \mathbb{N} \cap [p_t-D, p_t+D]$。高斯项的添加使得当
    $i$ 远离窗口中心 $p_t$ 时，对齐权重会衰减，即给予靠近 $p_t$ 的注释更大的重要性。此外，与全局注意力不同，$\alpha_t$ 的大小是固定的且等于
    $2D+1$，因为只考虑窗口内的注释。局部注意力实际上可以看作是全球注意力的一个变体，其中对齐权重乘以了一个截断的正态分布（即在窗口外返回零）。图 13 提供了局部注意力的总结。


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_17_0.png)


    ## 7.2 自注意力


    我们这里处于一个更简单的设置中，单个RNN编码器接受长度为 $T$ 的序列 $(x_1, \dots, x_T)$ 作为输入。通常，RNN将输入序列映射到注释序列
