    # 5.2.2 Convolution layer


    The convolution layer is a linear operation followed by a nonlinear transformation.
    The linear operation consists in multiplying (elementwise) each instantiation
    of a 1D window applied over the input document by a filter, represented as a matrix
    of parameters. The filter, just like the window, has only one spatial dimension,
    but it extends fully through the input depth (the d dimensions of the word embedding
    space). If h is the window size, the parameter matrix W associated with the filter
    thus belongs to \mathbb{R}^{h \times d}. W is initialized randomly and learned
    during training.


    The instantiations of the window over the input are called regions or receptive
    fields. There are \lfloor(s-h)/\text{stride}\rfloor+1 of them, where stride corresponds
    to the number of words by which we slide the window at each step. With a stride
    of 1, there are therefore s-h+1 receptive fields. The output of the convolution
    layer for a given filter is thus a vector o \in \mathbb{R}^{s-h+1} whose elements
    are computed as:


    ```

    $o_i = W \cdot A[i:i+h-1,:]$ (2)

    ```


    Where A[i:i+h-1,:] \in \mathbb{R}^{h \times d} is the i^{th} region matrix. ,
    and \cdot is an operator returning the sum of the row-wise dot product of two
    matrices. Note that for a given filter, the same W is applied to all instantiations
    of the window regardless of their positions in the document. In other words, the
    parameters of the filter are shared across receptive fields. This is precisely
    what gives the spatial invariance property to the model, because the filter is
    trained to recognize a pattern wherever it is located. It also greatly reduces
    the total number of parameters of the model.


    Then, a nonlinear activation function f, such as \text{ReLU}^{9} (max(0,x)) or
    \tanh(\frac{e^{2x}-1}{e^{2x}+1}), is applied elementwise to o, returning what
    is known as the feature map c \in \mathbb{R}^{s-h+1} associated with the filter:


    ```

    $c_i = f(o_i) + b$ (3)

    ```


    Where b \in \mathbb{R} is a trainable bias.


    For short sentence classification, best region sizes are generally found between
    1 and 10, and in practice, n_f filters (with n_f \in [100, 600]) are applied to
    each region to give the model the ability to learn different, complementary features
    for each region [26]. Since each filter generates a feature map, each region is
    thus embedded into an n_f-dimensional space. Moreover, using regions of varying
    size around the optimal one improves performance [26]. In that case, different
    parallel branches are created (one for each region size), and the outputs are
    concatenated after pooling, as shown in Fig. 1. Performance and cost increase
    with n_f up to a certain point, after which the model starts overfitting.


    # 5.2.3 Pooling layer


    The exact positions of the features in the input document do not matter. What
    matters is only whether certain features are present or absent. For instance,
    to classify a review as positive, whether “best movie ever” appears at the beginning
    or at the end of the document is not important. To inject such robustness into
    the model, global k-max pooling^{10} is employed. This approach extracts the k
    greatest values from each feature map and concatenates them, thus forming a final
    vector whose size always remains constant during training. For short sentence


