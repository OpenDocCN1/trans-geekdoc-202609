    alongside them for long periods of time. Finally, the activation $h_t$ is computed
    from the updated memory, modulated by the output gate layer $o_t$:


    $h_t = \tanh(c_t) \circ o_t$ (10)


    The output gate allows the unit to only activate when the in-memory information
    is found to be relevant for the current time step. Finally, as before with the
    simple RNN, the output vector is computed as a function of the new hidden state:


    $y_t = \text{softmax}(Vh_t)$ (11)


    ### 6.2.3 Vanilla RNN analogy


    If we decide to forget everything about the previous state (all elements of $f_t$
    are null), to learn all of the new information (all elements of $i_t$ are equal
    to 1), and to memorize the entire cell state to pass to the next time step (all
    elements of $o_t$ are equal to 1), we have $c_t = \tilde{c}_t = \text{tanh}(U_c
    x_t + W_c h_{t-1} + b_c)$, and thus we go back to a vanilla RNN unit, the only
    difference being an additional **tanh**, as we end up with $h_t = \text{tanh}(\text{tanh}(U_c
    x_t + W_c h_{t-1} + b_c))$ instead of $h_t = \text{tanh}(U_c x_t + W_c h_{t-1}
    + b_c)$ like in the classical RNN case.


    ## 6.3 Gated Recurrent Unit (GRU)


    As shown in Fig. 9, the GRU unit [2] is a simplified LSTM unit with only two gates
    (reset and update), and where there is no explicit memory $c_t$.


    - 1. reset gate layer: $r_t = \sigma(U_r x_t + W_r h_{t-1} + b_r)$

    - 2. update gate layer: $z_t = \sigma(U_z x_t + W_z h_{t-1} + b_z)$


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_12_0.png)


    The candidate hidden state is computed as:


    $\tilde{h}_t = \tanh(U_h x_t + W_h (r_t \circ h_{t-1}) + b_h)$ $^{13}$ (12)


    When all elements of the reset gate approach zero, information from the previous
    time steps (stored in $h_{t-1}$) is discarded, and the candidate hidden state
    is thus only based on the current input $x_t$. The new hidden state is finally
    obtained in a way similar to that of the LSTM cell state, by linearly interpolating
    between the previous hidden state and the candidate one:


    $h_t = z_t \circ h_{t-1} + (1 - z_t) \circ \tilde{h}_t$ (13)


    the only difference is that this time, the update gate $z_t$ serves as the forget
    gate and determines the fraction of information from the previous hidden state
    that should be forgotten, and the input gate is coupled on the forget gate.


    ## 6.4 RNN vs LSTM vs GRU


    The basic RNN unit exposes its full hidden state at every time step (see Eq. 6),
    so as time goes by, the impact of older inputs is quickly replaced by that of
    the more recent ones. The RNN is therefore not able to remember important features
    for more than a few steps. Indeed, we have shown previously that a RNN is analogous
    to a LSTM where for all $t$, $f_t = \overline{0}$, $i_t = \overline{1}$, and $o_t
    = \overline{1}$ (we forget everything about the past and learn everything about
    the present).


    On the other hand, thanks to the use of an explicit memory (the cell) and a gating
    mechanism, the LSTM unit is able to control which fraction of information from
    the past should be kept in memory (forget gate $f_t$), which fraction of information
    from the current input should be written to memory (input gate $i_t$), and how
    much of the memory should be exposed to the next time steps and to the units in
    the higher layers (output gate $o_t$).


    The GRU also features a gating mechanism, but has no explicit memory (no cell
    state). As a result, the gating mechanism of the GRU is simpler, without output
    gate: the linear interpolation between the old and the new information is directly
    injected into the new hidden state without filtering (see Eq. 13). Another difference
    is that when computing the candidate values, the GRU, via its reset gate $r_t$,
    modulates the flow of information coming from the previous activation $h_{t-1}$
    (see Eq. 12), while in the LSTM unit, $\tilde{c}_t$ is based on the raw $h_{t-1}$.
    Last but not least, in the GRU, the balance between the old and the new information
    is only made by the update gate $z_t$ (see Eq. 13), whereas the LSTM unit has
    two *independent* forget and input gates.


    While both the LSTM and GRU units are clearly superior to the basic RNN unit [4],
    there is no evidence about which one is best [10, 4]. However, since the GRU is
    simpler, it is easier to implement, more efficient, and has less parameters so
    it requires less training data.


    ## 7 Attention


    The attention mechanism [1] was developed in the context of encoder-decoder architectures
    for Neural Machine Translation (NMT) [2, 24], and rapidly applied to naturally
    related tasks such as image captioning (translating an image to a sentence) [25],
    and summarization (translating to a more compact language) [21]. From a high-level,
    by allowing the decoder to shop for what it needs over multiple vectors, attention
    relieves the encoder from the burden of having to embed the input into a single
    fixed-length vector, and thus allows to keep much more information [1].


    Today, attention is ubiquitous in deep learning models, and is not used only in
    encoder-decoder contexts. Notably, attention devices have been proposed for encoders
    only, to solve tasks such as document classification [27] or representation learning
    [5]. Such mechanisms are qualified as *self* or *inner* attention.


    In what follows, we will start by presenting attention in the original context
    of encoder-decoder for NMT, using the general framework introduced by [20], and
    then introduce self-attention.


    ### 7.1 Encoder-decoder attention


    #### 7.1.1 Encoder-decoder overview


    From a very high level, as shown in Fig. 10, the encoder embeds the input into
    a vector, and the decoder generates some output from this vector.


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_13_0.png)


    Figure 10: Overview of the encoder-decoder architecture. Taken from https://sites.google.com/site/ac116nmt/home


    In Neural Machine Translation (NMT), the input and the output are sequences of
    words, respectively $x = (x_1, \dots, x_{T_x})$ and $y = (y_1, \dots, y_{T_y})$.
    $x$ and $y$ are usually referred to as the *source* and *target* sentences. When
    both the input and the output are sequences, encoder-decoder architectures are
    sometimes called sequence-to-sequence (seq2seq) [24]. Thanks to the fact that
    encoder-decoder architectures are differentiable everywhere, their parameters
    $\theta$ can be simultaneously optimized with maximum likelihood estimation (MLE)
    over a parallel corpus. This way of training is called *end-to-end*.


    $\operatorname{argmax}_{\theta} \bigg\{ \sum_{(x, y) \in \mathrm{corpus}} \log
    p(y|x; \theta) \bigg\} \quad\quad\quad\quad\quad (14)$


    Here, the function that we want to maximize is the log probability of a correct
    translation.

    '
  mdcn: '


    选用的特殊句末标记为 $^{11}$（针对词级别粒度）。例如，对于字符级别的语言模型，$T$ 很容易超过 20 或 25。这极大地加剧了著名的梯度消失和梯度爆炸问题的负面影响，导致长距离依赖无法被学习
    $^{12}$。需要注意的是，前馈神经网络（如多层感知机）也会出现此问题，但由于 RNN 固有的深层结构倾向，该问题在 RNN 中会更为严重。


    ## 6.2 LSTM 单元


    在实践中，每当人们使用 RNN 时，通常都会使用 LSTM 或 GRU 单元（见下一节），因为这些单元的设计使其能够规避梯度消失/爆炸问题，并在更长的时间范围内追踪信息
    [11]。


    如图 8 所示，与基本 RNN 单元相比，LSTM 单元有两个变化：(1) 引入了细胞状态 $c_{t}$，它充当显式记忆；(2) 隐藏状态的计算方式。在普通
    RNN 中，隐藏状态通过单层计算得出：$h_{t} = \tanh( Ux_{t} + Wh_{t - 1} + b )$（见公式 6）。然而，在 LSTM
    单元中，隐藏状态由四个相互作用的层计算得出，这使得网络能够记住或遗忘序列中先前元素的特定信息。


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_10_0.png)


    ### 6.2.1 内部层


    这四个层分别是：


    - 1. 遗忘门层：$ f_{t} = \sigma(U_{f}x_{t} + W_{f}h_{t - 1} + b_{f}) $

    - 2. 输入门层：$ i_{t} = \sigma(U_{i}x_{t} + W_{i}h_{t - 1} + b_{i}) $

    - 3. 候选值计算层：$ \tilde{c}_{t} = \tanh(U_{c}x_{t} + W_{c}h_{t - 1} + b_{c}) $

    - 4. 输出门层：$ o_{t} = \sigma(U_{o}x_{t} + W_{o}h_{t - 1} + b_{o}) $


    由于逐元素应用了 Sigmoid 函数（$\sigma$），遗忘、输入和输出*门*层（即上述第 1、2、4 层）生成的向量其所有条目均介于 0 和 1 之间，且要么接近
    0，要么接近 1。因此，当这些层与另一个向量相乘时，它们充当一种过滤器，仅选择该向量的一定比例。这正是这些层被称为“门”的原因。两种极端情况是所有条目等于
    1——完整向量通过——或等于 0——无内容通过。需要注意的是，遗忘、输入和输出门以完全相同的方式计算，只是参数有所不同。然而，这些参数在所有时间步之间是共享的。


    ### 6.2.2 遗忘/学习


    通过考虑新的训练样本 $x_t$ 和当前的隐藏状态 $h_{t-1}$，遗忘门层 $f_t$ 确定应遗忘多少之前的细胞状态 $c_{t-1}$（即释放多少记忆），而从相同的输入出发，输入门层
    $i_t$ 决定应将多少候选值 $\tilde{c}_t$ 写入记忆，换句话说，即应学习多少新信息。将这两个过滤器的输出结合，即可*更新*细胞状态：


    $c_t = f_t \circ c_{t-1} + i_t \circ \tilde{c}_t$ (9)


    其中 $\circ$ 表示逐元素乘法（Hadamard 积）。通过这种方式，重要信息不会被新输入覆盖，并且能够与新信息一起保存很长时间。最后，激活值 $h_t$
    根据更新后的记忆并受输出门层 $o_t$ 的调节计算得出：


    $h_t = \tanh(c_t) \circ o_t$ (10)


    输出门允许该单元仅在记忆中的信息被认为对当前时间步相关时才激活。最后，与简单 RNN 一样，输出向量作为新隐藏状态的函数计算得出：


    $y_t = \text{softmax}(Vh_t)$ (11)


    ### 6.2.3 与普通 RNN 的类比


    如果我们决定遗忘关于之前状态的一切（$f_t$ 的所有元素为零），学习所有新信息（$i_t$ 的所有元素等于 1），并将整个细胞状态记忆并传递给下一个时间步（$o_t$
    的所有元素等于 1），那么我们就有 $c_t = \tilde{c}_t = \text{tanh}(U_c x_t + W_c h_{t-1} + b_c)$，从而回到普通
    RNN 单元，唯一的区别是多了一个 **tanh**，因为最终得到的是 $h_t = \text{tanh}(\text{tanh}(U_c x_t + W_c
    h_{t-1} + b_c))$，而不是像经典 RNN 情况下的 $h_t = \text{tanh}(U_c x_t + W_c h_{t-1} + b_c)$。


    ## 6.3 门控循环单元 (GRU)


    如图 9 所示，GRU 单元 [2] 是一种简化的 LSTM 单元，只有两个门（重置门和更新门），并且没有显式记忆 $c_t$。


    - 1. 重置门层：$r_t = \sigma(U_r x_t + W_r h_{t-1} + b_r)$

    - 2. 更新门层：$z_t = \sigma(U_z x_t + W_z h_{t-1} + b_z)$


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_12_0.png)


    候选隐藏状态计算如下：


    $\tilde{h}_t = \tanh(U_h x_t + W_h (r_t \circ h_{t-1}) + b_h)$ $^{13}$ (12)


    当重置门的所有元素趋近于零时，来自之前时间步的信息（存储在 $h_{t-1}$ 中）被丢弃，因此候选隐藏状态仅基于当前输入 $x_t$。新的隐藏状态最终以类似于
    LSTM 细胞状态的方式获得，即在之前隐藏状态和候选状态之间进行线性插值：


    $h_t = z_t \circ h_{t-1} + (1 - z_t) \circ \tilde{h}_t$ (13)


    唯一的区别是，这次更新门 $z_t$ 充当遗忘门，确定应遗忘之前隐藏状态中信息的比例，并且输入门与遗忘门耦合在一起。


    ## 6.4 RNN 与 LSTM 与 GRU 的对比


    基本 RNN 单元在每个时间步都暴露其完整的隐藏状态（见公式 6），因此随着时间推移，较旧输入的影响很快被较新输入的影响所取代。因此，RNN 无法记住超过少数几个步骤的重要特征。确实，我们之前已经表明，RNN
    类似于一种在所有 $t$ 时 $f_t = \overline{0}$，$i_t = \overline{1}$，且 $o_t = \overline{1}$
    的 LSTM（我们遗忘过去的一切，并学习当前的一切）。


    另一方面，得益于显式记忆（细胞）和门控机制的使用，LSTM 单元能够控制过去信息的哪一部分应保留在记忆中（遗忘门 $f_t$），当前输入信息的哪一部分应写入记忆（输入门
    $i_t$），以及多少记忆应暴露给下一个时间步及更高层单元（输出门 $o_t$）。


    GRU 也具备门控机制，但没有显式记忆（无细胞状态）。因此，GRU 的门控机制更简单，没有输出门：旧信息与新信息之间的线性插值直接注入新的隐藏状态，无需过滤（见公式
    13）。另一个区别在于，在计算候选值时，GRU 通过其重置门 $r_t$ 调节来自之前激活值 $h_{t-1}$ 的信息流（见公式 12），而在 LSTM
    单元中，$\tilde{c}_t$ 基于原始的 $h_{t-1}$。最后但同样重要的是，在 GRU 中，旧信息与新信息之间的平衡仅由更新门 $z_t$ 完成（见公式
    13），而 LSTM 单元则有两个*独立的*遗忘门和输入门。


    虽然 LSTM 和 GRU 单元都明显优于基本 RNN 单元 [4]，但没有证据表明哪一种最好 [10, 4]。然而，由于 GRU 更简单，它更容易实现，效率更高，且参数更少，因此需要更少的训练数据。


    ## 7 注意力机制


    注意力机制 [1] 是在神经机器翻译（NMT）的编码器-解码器架构背景下开发的 [2, 24]，并迅速应用于自然相关的任务，如图像描述（将图像转换为句子）[25]
    和摘要（转换为更紧凑的语言形式）[21]。从高层次来看，通过允许解码器在多个向量中寻找其所需内容，注意力机制减轻了编码器将输入嵌入到单个固定长度向量的负担，从而允许保留更多信息
    [1]。


    如今，注意力机制在深度学习模型中无处不在，不仅限于编码器-解码器上下文。值得注意的是，已经提出了仅用于编码器的注意力设备，以解决如文档分类 [27] 或表示学习
    [5] 等任务。这类机制被称为*自*注意力或*内部*注意力。


    在接下来的内容中，我们将首先介绍在 NMT 原始编码器-解码器上下文中的注意力机制，使用由 [20] 引入的一般框架，然后介绍自注意力。


    ### 7.1 编码器-解码器注意力


    #### 7.1.1 编码器-解码器概述


    从非常高层次来看，如图 10 所示，编码器将输入嵌入到向量中，解码器从该向量生成一些输出。


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_13_0.png)


    图 10：编码器-解码器架构概述。取自 https://sites.google.com/site/ac116nmt/home


    在神经机器翻译（NMT）中，输入和输出分别是单词序列，即 $x = (x_1, \dots, x_{T_x})$ 和 $y = (y_1, \dots, y_{T_y})$。$x$
    和 $y$ 通常被称为*源*句和*目标*句。当输入和输出都是序列时，编码器-解码器架构有时被称为序列到序列（seq2seq）[24]。由于编码器-解码器架构在到处可微分，其参数
    $\theta$ 可以通过在平行语料库上的最大似然估计（MLE）同时优化。这种训练方式被称为*端到端*。


    $\operatorname{argmax}_{\theta} \bigg\{ \sum_{(x, y) \in \mathrm{corpus}} \log
    p(y|x; \theta) \bigg\} \quad\quad\quad\quad\quad (14)$


    在这里，我们要最大化的函数是正确翻译的对数概率。


