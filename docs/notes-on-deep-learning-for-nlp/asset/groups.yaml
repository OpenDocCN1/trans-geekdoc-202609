    # 7.1.2 Encoder


    The source sentence can be embedded by any model (e.g., CNN, fully connected).
    Usually for MT though, the encoder is a deep RNN. Bahdanau et al. $[1]$ originally
    used a *bidirectional* deep RNN. Such a model is made of two deep unidirectional
    RNNs, with different parameters except the word embedding matrix. The first *forward*
    RNN processes the source sentence from left to right, while the second *backward*
    RNN processes it from right to left. The two sentence embeddings are concatenated
    at each time step $t$ to obtain the inner representation of the bidirectional
    RNN:


    ```

    $$h_t = [\vec{h}_t; \vec{h}_t] \tag{15}$$

    ```


    The bidirectional RNN takes into account the entire context when encoding the
    source words, not just the preceding words. As a result, $h_t$ is biased towards
    a small window centered on word $x_t$, while with a unidirectional RNN, $h_t$
    is biased towards $x_t$ and the words immediately preceding it. Focusing on a
    small window around $x_t$ may be advantageous, but does not seem crucial. Indeed,
    Luong et al. $[20]$ obtained state-of-the-art results with a usual unidirectional
    deep RNN encoder. In what follows, the hidden states of the encoder will be written
    $\hat{h}_t$. They are sometimes called *annotations* in the literature.


    # 7.1.3 Decoder


    While different models can be used as the encoder, in NMT the decoder is usually
    a unidirectional RNN because this model is naturally adapted to the sequential
    nature of the generation task, and is usually deep (stacking). The decoder generates
    each word of the target sentence one step at a time.


    **Key idea.** Making the decoder use only the last annotation $h_{T_x}$ produced
    by the encoder to generate output forces the encoder to fit as much information
    as possible into $h_{T_x}$. Since $h_{T_x}$ is a single fixed-size vector, its
    capacity is limited, so some information is lost. On the other hand, the attention
    mechanism allows the decoder to consider the entire sequence $(h_1, \ldots, h_{T_x})$
    of annotations produced by the encoder at each step of the generation process.
    As a result, the encoder is able to keep much more information by distributing
    it among all its annotations, knowing that the decoder will be able to decide
    later on which vectors it should pay attention to.


    More precisely, the target sentence $y = (y_1, \ldots, y_{T_y})$ is generated
    one word $y_t$ at a time based on the distribution:


    ```

    $$P[y_t | \{y_1, \ldots, y_{t-1}, c_t\}] = \text{softmax}(W_s \hat{h}_t) \tag{16}$$

    ```


    where $\hat{h}_t$, the *attentional* hidden state, is computed as:


    ```

    $$\hat{h}_t = \text{tanh}\big(W_c[c_t; h_t]\big) \tag{17}$$

    ```


    $h_t$ is the hidden state of the decoder (hidden state of the top layer, when
    the decoder is a stacking RNN) and provides information about the previously generated
    target words $\{y_1, \ldots, y_{t-1}\}$, $c_t$ is the source context vector, and
    $[;]$ is concatenation. $W_s$ and $W_c$ are matrices of trainable parameters.
    Biases are not shown for simplicity. As shown in Fig. 11, the context vector $c_t$
    can be computed in two ways: *globally* and *locally*. We describe each approach
    in the next two subsections.


    **A note on beam search.** Trying all possible combinations of words in the vocabulary
    to find the target sentence with highest joint probability is intractable. But
    on the other hand, generating $y$ in a purely greedy way, i.e., by selecting the
    most likely word every time, is highly suboptimal. In practice, a certain number
    $K$ of candidate translations are explored with *beam*'
  - '[PAGE 15]


    search, a heuristic search algorithm [7]. Large values of K generate better target
    sentences, but decrease decoding speed.


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_15_0.png)


    Figure 11: Global (left) vs local attention (right). Adapted from [20].


    # 7.1.4 Global attention


    Here, the context vector $c_t$ is computed as a weighted sum of the *full list*
    of annotations $\tilde{h}_i$ of the source sentence (i.e., the hidden states of
    the encoder). There are $T_x$ annotations. Each one is a vector of size the number
    of units in the hidden layer of the encoder. $c_t$ has same size as any annotation.
    The size of the alignment vector $\alpha_t$ is equal to the size $T_x$ of the
    source sentence, so it is *variable*.


    $c_t = \sum_{i=1}^{T_x} \alpha_{t,i} \tilde{h}_i$ (18)


    The alignment vector $\alpha_t$ is computed by applying a softmax to the output
    of an *alignment* operation ($\textbf{score()}$) between the current target hidden
    state $h_t$ and all source hidden states $\tilde{h}_i$''s:


    $\alpha_{t,i} = \frac{\exp(\textbf{score}(h_t, \tilde{h}_i))}{\sum_{i''=1}^{T_x}
    \exp(\textbf{score}(h_t, \tilde{h}_{i''}))}$ (19)


    In other words, $\alpha_t$ is a probability distribution over all source hidden
    states (its coefficients are all between 0 and 1 and sum to 1), and indicates
    which words in the source sentence are the most likely to help in predicting the
    next word. **score()** can in theory be any comparison function. Luong et al.
    [20] experimented with the dot product ($\textbf{score}(h_t, \tilde{h}_i) = h_t^\top
    \tilde{h}_i$), a more general formulation with a matrix of parameters ($\textbf{score}(h_t,
    \tilde{h}_i) = h_t^\top W_a \tilde{h}_i$), and a fully connected layer. They found
    that *dot* works better for global attention while *general* is superior for local
    attention. A summary of global attention is provided in Fig. 12.'
