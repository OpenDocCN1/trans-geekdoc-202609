    ## 5 卷积神经网络（CNNs）


    ### 5.1 局部不变性和组合性


    卷积神经网络（CNNs）最初受猫视觉皮层研究 [12] 的启发，在计算机视觉领域被开发出来，用于处理如图像 [16] 等规则网格数据。它们是前馈神经网络，其中每一层的每个神经元都接收来自前一层神经元邻域的输入。这些邻域，即*局部感受野*，使得
    CNN 能够以层次化的方式识别越来越复杂的模式，通过将较低层次的初级特征组合成较高层次的特征。这一特性被称为*组合性*。例如，可以从原始像素推断出边缘，边缘反过来可用于检测简单的形状，最后形状可用于识别物体。此外，特征在图像中的绝对位置并不重要。只有捕获它们的相对位置对于组合更高级的模式才有用。因此，模型应能够检测图像中任意位置的特征。这一特性被称为*局部不变性*。组合性和局部不变性是
    CNN 的两个核心概念。


    CNN 在计算机视觉中取得了很好的性能 [15]，但不难理解，得益于组合性和局部不变性，它们在自然语言处理（NLP）中也能表现优异。确实，在 NLP 中，可以从低阶特征构建高阶特征（*n*-gram），就像在计算机视觉中一样，且局部顺序至关重要（“不太好，挺好的”，“不好，挺坏的”，“不推荐”），但在文档级别则不然。事实上，在试图确定电影评论的情感极性时，我们并不真正关心“不太好，挺好的”出现在文档的开头还是结尾。我们只需要捕获“not”（不）在“bad”（坏/糟糕）之前这一事实，以此类推。需要注意的是，CNN
    无法编码长距离依赖关系，因此，对于诸如语言建模等长距离依赖关系至关重要的任务，通常更偏好循环架构，如 LSTM。


    ### 5.2 卷积和池化


    尽管最近的研究表明卷积层可以直接堆叠在一起 [23]，但 CNN 的基本结构是一个*卷积*层后接一个*池化*层。在接下来的部分中，我们将详细说明这两个层如何相互作用，以短文档分类这一
    NLP 任务为例（见图 1）。


    #### 5.2.1 输入


    我们可以将文档表示为实数矩阵 $A \in \mathbb{R}^{s \times d}$，其中 $s$ 是文档长度，$d$ 是词嵌入向量的维度。由于在语料库级别
    $s$ 必须固定，但文档的大小不同，我们将较长的文档截断为其前 $s$ 个词，并用特殊的零向量填充较短文档，直到达到所需长度。词向量可以是随机初始化的，也可以是预训练的。在后一种情况下，它们在训练过程中可以更新也可以不更新（“非静态”与“静态”方法
    [14]）。


    将 $A$ 视为图像可能会产生误导，因为只有一个空间维度。嵌入向量实际上并不是输入本身的一部分，它们只是表示输入元素在共享潜在空间中的坐标。在计算机视觉中，术语*通道*通常用于指代这个*深度*维度（不要将其与网络中隐藏层的数量混淆）。如果我们处理的是图像，我们将拥有两个空间维度，加上深度。输入将是一个维度为（宽度
    × 高度 × n_channels）的张量，即一个 2D 矩阵，其中每个条目分别与长度为 3 或 1 的向量相关联，分别对应彩色（RGB）和灰度图像。


    #### 5.2.2 卷积层


    卷积层是一个线性操作，后接一个非线性变换。该线性操作包括将应用于输入文档的 1D 窗口的每个实例与一个滤波器相乘（逐元素），该滤波器表示为参数矩阵。滤波器，就像窗口一样，只有一个空间维度，但它贯穿整个输入深度（词嵌入空间的
    $d$ 个维度）。如果 $h$ 是窗口大小，则与该滤波器关联的参数矩阵 $W$ 属于 $\mathbb{R}^{h \times d}$。$W$ 随机初始化，并在训练过程中学习。


    窗口在输入上的实例化被称为区域或感受野。共有 $\lfloor(s-h)/\text{stride}\rfloor+1$ 个，其中 stride（步长）对应于我们在每一步中滑动窗口的词数。当步长为
    1 时，因此有 $s-h+1$ 个感受野。因此，对于给定的滤波器，卷积层的输出是一个向量 $o \in \mathbb{R}^{s-h+1}$，其元素计算如下：


    $$

    o_i = W \cdot A[i:i+h-1,:] \quad (2)

    $$


    其中 $A[i:i+h-1,:] \in \mathbb{R}^{h \times d}$ 是第 $i^{th}$ 个区域矩阵，$\cdot$ 是一个返回两个矩阵逐行点积之和的运算符。请注意，对于给定的滤波器，无论窗口在文档中的位置如何，相同的
    $W$ 都应用于窗口的所有实例化。换句话说，滤波器的参数在感受野之间共享。这正是赋予模型空间不变性特性的原因，因为滤波器被训练用于识别位于任何地方的模式。这也极大地减少了模型的总参数量。


    然后，将非线性激活函数 $f$（例如 ReLU (max(0,x)) 或 $\tanh(x)$）逐元素应用于 $o$，返回与滤波器相关的特征图 $c \in
    \mathbb{R}^{s-h+1}$：


    $$

    c_i = f(o_i) + b \quad (3)

    $$


    其中 $b \in \mathbb{R}$ 是可学习的偏置。


    对于短句子分类，最佳区域大小通常发现在 1 到 10 之间，在实践中，$n_f$ 个滤波器（其中 $n_f \in [100, 600]$）应用于每个区域，赋予模型为每个区域学习不同互补特征的能力
    [26]。由于每个滤波器生成一个特征图，因此每个区域被嵌入到一个 $n_f$ 维空间中。此外，使用围绕最优值变化的区域大小可以提高性能 [26]。在这种情况下，会创建不同的并行分支（每个区域大小一个），并在池化后连接输出，如图
    1 所示。随着 $n_f$ 的增加，性能和成本也会增加，直到达到某个点，之后模型开始过拟合。


    #### 5.2.3 池化层


    输入文档中特征的确切位置并不重要。重要的是某些特征是否存在。例如，要将评论分类为正面，无论“有史以来最好的电影”出现在文档的开头还是结尾并不重要。为了将这种鲁棒性注入模型，采用全局
    $k$-max 池化。该方法从每个特征图中提取 $k$ 个最大值并将其连接，从而形成一个大小在训练期间始终保持不变的最终向量。对于短句子分类，[26] 发现
    $k=1$ 远远优于高阶策略。他们还报告说，使用最大值比使用平均值要好得多，这是有道理的，因为我们只感兴趣于从每个特征图中提取最显著的（salient）特征。


    ![](img/cff14e17039cb2b04cb132bbbb5e2363_5_0.png)


    #### 5.2.4 文档编码


    如图 1 所示，从高层角度来看，CNN 架构将输入的每个滤波版本连接到最终特征向量中的单个神经元。这个向量可以被视为输入文档的嵌入或编码。它是模型的主要贡献，也是我们要感兴趣的内容。架构的其余部分取决于任务。


    #### 5.2.5 Softmax 层


    由于这里的目标是分类文档，因此对文档编码应用 softmax 函数以输出类别概率。然而，不同的任务需要不同的架构：例如，确定两个句子是否为释义，需要两个共享权重的
    CNN 编码器，以及一个最终的能函数和对比损失（类 Siamese 方法 [3]）；对于翻译或摘要，我们可以使用基于输入文档的 CNN 编码条件的 LSTM
    语言模型解码器（类 seq-to-seq 方法 [24]）等等。


    回到我们的分类设置，softmax 将向量 $x \in \mathbb{R}^K$ 转换为一个由正浮数组成的向量，其总和为 1，即转换为类别上的*概率分布*


    **脚注：**

    [^9]: 与 tanh 相比，ReLU 更经济实惠（由负区域的大量零值引起的稀疏性），并且在正区域中更好地对抗梯度消失问题，因为在正区域中梯度是常数，而在
    tanh 中梯度变得越来越小。

    [^10]: 池化也可以在局部小区域上应用，但对于短文本分类，全局池化效果更佳 [26]。


