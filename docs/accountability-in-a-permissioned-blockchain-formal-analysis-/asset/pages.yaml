  md: 'Overall, we set \(\alpha := \bigcup_{i=1}^4 \alpha_i\). We define an accountability
    constraint \(\mathcal{C}\) for \(\alpha\) as follows: \(\mathcal{C} := (\alpha
    \Rightarrow \text{dis}(p_1)|\dots|\text{dis}(p_m)|\text{dis}(\alpha_1)|\dots|\text{dis}(\alpha_l)|\text{dis}(\mathfrak{K}))\).
    That is, if \(\alpha\)io correctness or consistency is violated, then the judge
    must blame at least one individual from the set \(A\) of participants. We define
    the accountability property \(\Phi := \{\mathcal{C}\}\).


    We call \(\mathbb{P}_F\) (individually) accountable w.r.t. to consistency if for
    all environments \(\mathcal{E}\) and adversaries \(\mathcal{A}\) we have that
    \(\mathcal{E}[\mathcal{A}\|\mathbb{P}_F\) achieves \(\Phi\)-accountability.


    In Section 6.3, we prove that \(\mathbb{P}_F\) provides (individual) accountability
    w.r.t. to consistency.


    Trivially, the above definition of accountability w.r.t. consistency indeed covers
    the expected security goals of basic correctness and consistency, i.e., runs where
    one of the properties is violated belong to \(\alpha\).


    Lemma 1. Let \(\mathcal{E}\) be an environment and \(\mathcal{A}\) adversary.
    Let \(\Omega\) be the set of runs of \(\mathcal{E}[\mathcal{A}\|\mathbb{P}_F\)
    that satisfy basic correctness and consistency. Let \(\alpha\) be as defined above.
    Then it holds true that \(\alpha\) is the complement of \(\Omega\).


    # 6.2. The Judging Procedure


    Before we can prove that Fabric* achieves individual accountability w.r.t. consistency,
    we have to specify the judging procedure, i.e., by what evidence the judge blames
    which parties. Before we specify the judging procedure, we discuss what the judge
    resembles in reality.


    **What the judge models in reality.** Recall that, in our model, (honest) peers
    report blocks that they accept to the judge, who can then use this information
    to render verdicts. In reality, this corresponds to the situation where an error
    in the chain(s) of one or more peers was found, and those chains are then given
    to other parties (e.g., other peers or independent third parties) to determine
    who caused this error.


    For example, if a client suspects that consistency is violated say, because the
    data received upon a request from one peer is suspiciously inconsistent with the
    data received from another peer, the client would notify the organizations that
    take part in the Fabric* channel about the inconsistency. The organizations would
    inspect the chains of both peers following the judging procedure to determine
    whether a party misbehaved. If one of the peers refuses to provide the requested
    data he is trivially guilty of disrupting the protocol. Note that this process
    indeed requires basic correctness: a peer should not be able to escape a verdict
    by providing malformed evidence. In addition to clients suspecting problems, peers
    might (be required to) exchange data from time to time to see whether there are
    inconsistencies.


    Once an error has been detected and the judge has identified a misbehaving participant,
    organizations then agree out of band on the “correct” chain (e.g., by dropping
    all blocks after an inconsistency) and continue from there. Note that individual
    accountability acts as a strong deterrence and hence errors such as inconsistent
    chains should generally not occur in practice.


    **Specification of the judging procedure.** At the start of a run, the judge \(J\)
    obtains basic information about the Fabric* channel from \(\mathcal{F}_{\text{init}}\),
    including the sets of identities


    of peers, orderers, and Kafka brokers. During the run, (honest) peers immediately
    report all blocks that they accept to \(J\). The judge \(J\) first stores those
    reported blocks as evidence for verdicts. If no verdict has been issued so far,
    the judge then continues to check whether he has to issue a verdict due to the
    newly received block:


    +   **1. Basic Correctness.** The judge starts by checking whether basic correctness
    has been violated, i.e., whether the current run is in \(\bigcup_{i=1}^3 \alpha_i\).
    Note that this is indeed possible as all of those properties are defined over
    the evidence/blocks submitted to the judge. Further note that, according to their
    specification, honest peers also check those properties of blocks accordingly
    and will neither accept nor report a block that violates basic correctness (for
    their own chain). Thus, if a block causes a violation, then the judge blames the
    peer that reported that block.


    +   **2. Consistency.** If basic correctness still holds true in the current run,
    then the judge checks whether consistency has been violated, i.e., whether the
    current run is in \(\alpha_4\). As defined, this is the case iff there are two
    reported blocks \(\mathcal{B}_1, \mathcal{B}_2\) with the same ID but differing
    bodies (generated by two, not necessarily different orderers). The verdict is
    then computed as follows: The judge first checks whether there are two different
    Kafka messages with the same ID (and valid signatures) in \(\mathcal{B}_1\) and
    \(\mathcal{B}_2\). If so, then this inconsistency was caused by the Kafka cluster
    who is supposed to generate unique messages per ID, and hence the Kafka cluster
    is blamed. Otherwise, (at least) one of the orderers has cut the chain at a wrong
    point, i.e., the block ends too early or too late. To find the culprit, the judge
    checks whether \(\mathcal{B}_1\) follows the rules of the CUTBLOCK algorithm:
    That is, \(\mathcal{B}_1\) must (i) contain the maximum number of Kafka messages
    such that none of those messages is a valid cut message, or (ii) contain at most
    the maximum number of Kafka messages as well as a single valid cut message that
    is the last of the Kafka messages. If this check fails, the orderer who generated
    \(\mathcal{B}_1\) is blamed. Otherwise, the same checks are performed for \(\mathcal{B}_2\),
    potentially resulting in a verdict on the orderer that generated \(\mathcal{B}_2\).


    # 6.3. Proving Accountability


    In this section, we present our main theorem: Fabric* achieves (individual) accountability
    w.r.t. consistency, i.e., \(\Phi\)-accountability. Together with Lemma 1 this
    theorem shows that Fabric* achieves basic correctness and consistency in the absence
    of a verdict of the judge \(J\). Should basic correctness or consistency be violated
    at some point, the judge would rightly and individually blame at least one party.


    Due to lack of space, we provide the formal analysis of the remaining security
    goals from Section 3.1 for Fabric*, namely, chain-growth, liveness, hash chain
    integrity, and no creation in Appendix C.


    **Theorem 2** (Fabric* achieves accountability w.r.t. consistency). Let \(\mathbb{P}_F\)
    be the Fabric* protocol with arbitrary parameters for \(\mathcal{F}_{\text{init}}\)
    and the judge \(J\) defined as in Section 6.2. Then, it holds true that \(\mathbb{P}_F\)
    achieves individual accountability w.r.t. consistency.


    We briefly discuss the core ideas of the proof, with the full proof given in Appendix
    B.'
