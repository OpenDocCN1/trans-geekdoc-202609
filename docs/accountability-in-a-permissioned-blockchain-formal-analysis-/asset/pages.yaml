    chain or to change the state stored in the chain, a client calls a chaincode by
    initiating a transaction proposal. The proposal contains the client''s identity,
    the chaincode the client wants to invoke, input data for the chaincode call, a
    sequence number, and the client''s signature over this data. The hash over all
    of this data (excluding the signature) is used as transaction ID. A


