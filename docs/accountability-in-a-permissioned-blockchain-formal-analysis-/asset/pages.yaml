  md: '# C.1. Chain-growth and liveness


    As already mentioned, it is well-known that one can obtain neither chain-growth
    nor liveness (as, e.g., defined by Garay et al. [24]) in a fully asynchronous
    network with message loss. Unlike for consistency, one also cannot use accountability
    to enforce both goals as, even if all participants are honest, the network is
    still able to drop messages.


    Typically, chain-growth and liveness are shown for blockchains by assuming a network
    with bounded message delay where messages cannot be dropped. However, even using
    this assumption, formally Fabric* does not provide any of the two goals in general:
    A corrupted Kafka cluster can simply drop incoming messages, thus preventing chain-growth
    and violating liveness. Furthermore, formally it is still not possible to address
    this issue using (individual) accountability: If a transaction is not included
    in the Kafka message stream, this can be either due to a malicious Kafka cluster
    dropping the message or due to malicious orderers that did not forward the message
    to the cluster in the first place. As already briefly discussed in the main part,
    in reality, however, if messages keep being dropped, one can of course investigate
    the problem since all participants of Fabric* know each other.


    One can only formally show that chain-growth and liveness hold true for Fabric*
    in a network with bounded message delay if orderers, peers, and the Kafka cluster
    are honest. On a technical level, to show this result one has to adapt our model
    from Section 4 by routing all network communication via a round based ideal broadcast
    or diffuse channel with \(\Delta\)-delays \(\mathcal{F}_\Delta\) (cf. [24]). In
    \(\mathcal{F}_\Delta\), the adversary is allowed to delay a message for at most
    \(\Delta \in \mathbb{N}\) rounds, but he cannot drop or change any messages.


    **Proposition 3** (Chain-growth and Liveness of Fabric* - informal). Let \(\mathbb{P}_F\)
    be the Fabric* protocol where network traffic is sent and received via \(\mathcal{F}_\Delta\).
    Let \(\mathcal{E}\) and \(\mathcal{A}\) be an arbitrary environment and an arbitrary
    adversary for \(\mathbb{P}_F\) such that they do not corrupt any peer, orderer,
    or the Kafka cluster, resp. their instances at \(\mathcal{F}_{\text{sig}}\). Then
    \(\mathcal{Q}\) achieves chain-growth and liveness.


    Proof. The proof for both goals quite easily follows from the construction of
    \(\mathcal{F}_\Delta\) and \(\mathbb{P}_F\) as messages are eventually delivered
    after \(\Delta\) rounds.


    # C.2. Hash Chain Integrity


    Formally, we define hash chain integrity as follows:


    **Definition 4** (Hash chain integrity). Consider a run \(\omega\) of the system
    \(\mathcal{E}|\mathcal{A}|\mathbb{P}_F\), for some environment \(\mathcal{E}\)
    and some adversary \(\mathcal{A}\), that satisfies basic correctness.

    Let \(\mathcal{B}_1 = \langle id_1, prevHash_1, B_1, pid_1, s_1 \rangle\) be a
    reported block in \(\omega\). We say that \(B_1\) violates hash chain integrity
    if there is a reported block \(\mathcal{B}_2 = \langle id_2, prevHash_2, B_2,
    pid_2, s_2 \rangle\) in \(\omega\) such that \(id_1 = id_2 + 1\) and \(prevHash_1
    \neq H(id_2, prevHash_2, B_2)\), where \(H\) is a hash function. In addition,
    we also say that a block \(\langle 1, prevHash, B, pid, s \rangle\) violates hash
    chain integrity if \(prevHash \neq H(\mathcal{S}_{init})\) (where \(\mathcal{S}_{init}\)
    is the initial state modeling the genesis block).


