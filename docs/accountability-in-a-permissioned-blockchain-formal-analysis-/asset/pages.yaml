    # ## Appendix D. Transferring Ideal Results to Realizations


    All of our security results are shown for an ideal signature functionality \(\mathcal{F}_{\text{sig}}\).
    Here we show that if \(\mathcal{F}_{\text{sig}}\) is replaced by its realization
    \(\mathcal{P}_{\text{sig}}\) (cf. [46]) where signing is done using an EUF-CMA
    secure secure signature scheme \(\mathcal{P}_{\text{sig}}\) (existential unforgeability
    under chosen message attacks), then all results still hold true. EUF-CMA is the
    standard security notion for signature schemes (see, e.g., [26]) and it is well-known
    that such schemes are (necessary and) sufficient to realize an ideal signature
    functionality (see, e.g., [38], [46]).


    Let \(\mathbb{P}_F\) be the Fabric* protocol and let \(\mathbb{P}_F^r\) be the
    system obtained from \(\mathbb{P}_F\) by replacing \(\mathcal{F}_{\text{sig}}\)
    by \(\mathcal{P}_{\text{sig}}\). Informally speaking, the proposition below states
    that all our results indeed carry over to \(\mathbb{P}_F^r\). We provide a proof
    sketch for the proposition, giving the general intuition, and then formally show
    this result for the property "accountability w.r.t. consistency"; all other properties
    follow analogously. We emphasize that while this result uses that \(\mathcal{P}_{\text{sig}}\)
    realizes \(\mathcal{F}_{\text{sig}}\) in the usual UC sense (see, e.g., [46]),
    the result does not follow from the UC composition theorems.


    **Proposition 6** (Transferability of Security Properties - informal). Let \(\mathfrak{P}\)
    be one of the previous security properties that holds true for \(\mathbb{P}_F\).
    If the signature scheme used by \(\mathcal{P}_{\text{sig}}\) is EUF-CMA secure,
    then \(\mathfrak{P}\) also holds true for \(\mathbb{P}_F^r\).


