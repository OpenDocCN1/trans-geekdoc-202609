    # Summary of our contributions.


    +   - We put forward a formal treatment of accountability for blockchains.

    +   - We illustrate the use and features of accountability as a stand-alone property
    by Hyperledger Fabric, one of the most prominent and widely used (permissioned)
    blockchains in practice.

    +   - We formally define accountability w.r.t. consistency and other central security
    goals for Fabric with Kafka.

    +   - We identify individual accountability as the necessary degree of accountability
    for Fabric.

    +   - We argue that this instantiation of Fabric does not provide individual accountability
    (w.r.t. consistency) and then formally prove that Fabric*, a slight variant, satisfies
    individual accountability (w.r.t. consistency


    and other central security goals).


