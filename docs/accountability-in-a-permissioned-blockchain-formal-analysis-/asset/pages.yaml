    of Fabric. Conceptually, chain-quality is mainly used in public blockchains to
    argue that there is no censorship of transactions and thus to prove the security
    goal of liveness (see below).


    Chain-growth states that, over time, a blockchain continues to grow. This is a
    necessary goal for blockchains which use the longest chain rule. If the blockchain
    stopped growing, it would allow for, e.g., 51%-attacks or long range attacks [25],
    where an attacker tries to overwrite some history of the chain by creating a malicious
    fork that is longer than the current chain. However, since in Fabric peers only
    extend their chains without changing previous blocks (which implies so-called
    finality), Fabric is not vulnerable to this class of attacks.


    Liveness states that transactions cast by honest clients will eventually be included
    in the blockchain. Liveness clearly is a desirable goal of blockchains.


    Other security goal. In addition to the above standard security goals, the designers
    of Fabric want to achieve the following goals [2]: (i) Hash chain integrity states,
    roughly speaking, that all honest peers share the same hash chain (according to
    Fabric’s block definition), (ii) No skipping states that honest peers do not have
    gaps in their chain (i.e., all blocks in the chain of a peer have sequential IDs),
    and (iii) No creation states that chains of honest peers always consist of transactions
