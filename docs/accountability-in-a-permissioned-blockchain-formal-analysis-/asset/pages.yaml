    Consistency (also called common-prefix) states that the chains of honest participants
    share a common prefix. Consistency is the most essential security goal for blockchains
    as it is a necessary requirement for obtaining a shared global (ledger) state.


    Chain-quality states that the percentage of blocks of a chain that were created
    by malicious miners is upper bounded. This notion assumes that each block of a
    chain has exactly this unique “creator” and can thus be considered as either honestly
    or maliciously created. This, however, is generally not true for Fabric, e.g.,
    when using Kafka: all of the orderers create and sign a block for every block
