    # Appendix C. Definition and Analysis of Further Goals of Fabric*


    We have already formally shown in Section 6 that Fabric* is accountable with respect
    to consistency (which includes basic correctness and in particular no skipping).
    In this section, we first summarize and briefly discuss our results for the remaining
    security goals from Section 3.1 for the Fabric* protocol, namely, chain-growth,
    liveness, hash chain integrity, and no creation. Then, we provide full details
    on the analysis of these goals.


    +   1. Chain-growth and Liveness. In general, one cannot prove chain-growth and
    liveness in a network with message loss for any blockchain. Hence, we adapt our
    model of Fabric* to include a round-based network model with bounded message delay,
    as it is commonly used also for other blockchains. However, even when assuming
    such a network model, both goals can still be broken due to Fabric*''s centralized
    structure: malicious orderers and in particular a malicious Kafka cluster can
    simply drop messages instead of forwarding them. Furthermore, culprits also cannot
    be held individually accountable for breaking these goals (based on data in the
    blockchain). Thus, formally one can only show that both goals hold true if (i)
    all peers, (ii) all orderers, and (iii) the Kafka cluster are honest.


    We note that this formal lack of chain-growth and liveness is not that devastating
    in practice, unlike in many other common blockchains: Firstly, for chain-growth
    this has already been discussed in Section 3.1. Secondly, as shown above, neither
    liveness nor chain-growth are necessary to guarantee consistency, unlike in, e.g.,
    blockchains relying on the longest chain rule. Thirdly, all participants of Fabric,
    resp. Fabric* know each other. So in a real world execution of Fabric*, if peers,
    orderers, or the Kafka cluster do not receive updates from the channel, operators
    will report this issue to the organizations of the channel. The organizations
    can then monitor individual connections to identify where messages are dropped
    and whether this was caused by one of the participants or an unreliable network.


    +   2. Hash chain integrity. Intuitively, hash chain integrity states that for
    all pairs of peers p1, p2, if p1 accepts a block B'' with ID id and p1 has accepted
    a block B'' with ID id - 1, then the predecessor hash contained in B is the hash
    of B''. Analogously to consistency (which is a necessary requirement for hash
    chain integrity to hold true), we can enforce hash chain integrity for all peers,
    including dishonest ones, via accountability.


    +   3. No creation. Fabric* provides a slight variant of no creation which we
    call chain soundness. This goal holds true for all honest peers and can be enforced
    for malicious peers via accountability.'
