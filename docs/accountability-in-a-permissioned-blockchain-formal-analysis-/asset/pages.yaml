    Our case study perfectly illustrates the aforementioned features of accountability
    when used as a stand-alone concept: (i) We obtain reasonable security guarantees
    for a blockchain that is based on a crash-fault tolerant consensus algorithm.
    More generally, the concept of accountability enables new types of blockchain
