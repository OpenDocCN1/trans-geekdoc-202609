    # Appendix B. Accountability of Fabric* w.r.t. the Judge - Proof


    In this section, we present the full proof of accountability w.r.t. consistency
    for the Fabric* (cf. Theorem 2). Proof. Let PF be the Fabric* protocol as required
    by the theorem, and let E be an arbitrary environment and A be an arbitrary adversary.6
    We have to show that E | A | PF provides Phi-accountability, where Phi is the
    one from Definition 3.


    Let us start with some general observations. We know that signatures of honest
    participants cannot be forged by the definition of Fsig. Furthermore, if we look
    at the common case occurring in runs where first a signature in a block is checked
    by an (honest) peer, then this block is reported, and finally the signatures in
    that block are checked again by the judge, then we have that the signature check
    outputs the same for all three points in time. This is because the validity check
    of Fsig is a deterministic function over the input (which is the same message)
    and the internal state of Fsig (which does not change between those three points;
    in particular, the adversary is not activated in-between and cannot change the
    corruption status).


    We now show that E | A | PF provides Phi-accountability by proving fairness and
    completeness.


    **Fairness.** We have to show that Pr[Q(1^eta) |-> (J : Phi)] is a negligible
    function in eta, i.e., the judge''s verdicts evaluate to false (when they are
    issued) in at most a negligible amount of cases.


    Observe that, by the definition of J, all verdicts are of the form dis(p) for
    a participant p of the protocol. Hence, it suffices to argue that, for every role
    r, the probability that J renders the verdict dis(p) for some honest party p of
    role r is negligible (we denote this property by (*) in what follows); this then
    immediately implies fairness.


    **Clients.** There is never a verdict that contains a client. Hence, (*) trivially
    holds true for clients.


    6. As mentioned in Section 4, runtimes are defined in such a way that E | A |
    PF runs in polynomial time (see [47]).


    **Peers:** Let p be an honest peer (in some run). The judge J outputs dis(p) as
    verdict if one of the basic correctness properties alpha_1, ..., alpha_3 is violated
    by a block B1 sent by p. Observe that peers have a direct (authenticated) connection
    to the judge which guarantees that no other party can report data in the name
    of p. Hence, if the judge blames p due to a block B1 that violates basic correctness,
    then this block was submitted by p itself. Since p is honest, he will only submit
    blocks that pass all of the following checks: (i) The block is well-formed (alpha_1),
    (ii) The block including the Kafka messages satisfies rule compliance (alpha_2),
    (iii) and contains valid orderer signatures, Kafka broker signatures, and Merkle
    proofs (alpha_3). By this, we know that p never reports a block that violates
    either of the properties alpha_1, ..., alpha_3 and thus dis(p) is never part of
    a verdict. This implies (*) for peers.


    **Orderers.** Let o be an honest orderer (in some run). This implies that signatures
    of o are unforgeable. The judge can potentially issue a verdict dis(o) only for
    the property alpha_4. That is, dis(o) can only be part of a verdict if there are
    two inconsistent blocks B1, B2 reported by peers such that at least one of the
    blocks has a valid signature from o. If there are such two conflicting blocks,
    then exactly one of them was created by o (as signatures are unforgeable and honest
    orderers create unique blocks for each block ID). W.l.o.g., let B1 be the block
    created by o. Now, J outputs the verdict dis(o) only if B1 was not created by
    using CUTBLOCK, i.e., B1 should contain the maximum number of Kafka messages that
    are allowed per block and no valid cut messages before the end, or it should end
    with the first (valid) cutting message contained in that block while not exceeding
    the maximum number of messages. Since o is honest, the block B1 exactly follows
    those rules and hence o will not be blamed. This implies (*) for orderers.


    **Kafka Cluster.** Let K be an honest Kafka cluster (in some run). In particular,
    this implies that the signature keys of all Kafka Brokers in Fsig are still uncorrupted
    and hence signatures in the name of any broker/the whole cluster cannot be forged.


    The judge only includes dis(K) in a verdict if he finds two Kafka messages with
    the same ID, different message bodies, valid Merkle proofs, and valid signatures
    on the Merkle roots. Since signatures are unforgeable and the honest Kafka cluster
    never outputs different messages with the same ID, the only way for this to occur
    is if the adversary manages to re-use a (correctly) signed Merkle root (either
    for a different message, or for a different proof on the same message). As, e.g.,
    Coronado [17] showed, such a successful forgery of a Merkle proof can be reduced
    to the probability of a collision in the random oracle. Since we are using a random
    oracle that outputs hashes with length eta (where eta is the security parameter)
    and the whole system runs in polynomial time, the probability for collisions is
    negligible. Hence, dis(K) is part of a verdict only in a negligible number of
    cases, which gives (*).


    **Completeness.** For completeness, again observe that all verdicts of a judge
    are of the form dis(p) (where p is a peer, an orderer, or the Kafka cluster).
    Note that those verdicts trivially imply one of the verdicts of the accountability
    constraint C (which essentially states that'
