    Jumping ahead, we first note that Fabric* indeed achieves individual accountability
    w.r.t. consistency solely based on blockchain data with small overhead. This result
    holds true for dynamically corruptible participants in fully asynchronous networks.
    In particular, we do not need additional assumptions such as honest majorities
    or networks with eventual message delivery, which are common assumptions in the
    analyses of other blockchains.


    # **Modifications to Fabric.** We obtain Fabric* from Fabric with Kafka by two
    small changes.


    Firstly, we essentially have the Kafka cluster sign each message it includes in
    its (ordered) message stream. Recall that the stream contains mostly transaction
    commitments, but also other messages such as cutting messages from orderers. We
    use Merkle trees [50] to make the signing process more efficient. More specifically,
    the resulting messages distributed by Kafka are of the following form: (id, pid,
    msg, mr, mp, s) where id is the message ID (i.e., the counter of the enumeration),
    pid is the identity of the Kafka leader that signed this message, msg is the message
    payload (usually a transaction commitment), mr is the root of the Merkle tree,
    mp is a Merkle proof that proves that (id, pid, msg) is a leaf of the Merkle tree
    with root mr, and s = SIGN_sk(pid)(mr) is a signature of the root mr from pid.
    Importantly, the signature on a message is also over the message''s ID, which
    is a consecutive number that uniquely defines the order of all messages. In Appendix
    A, we provide a detailed specification of this change.


    Secondly, we require that orderers cut blocks by including a complete consecutive
    section of the Kafka message stream, including all message IDs and valid signatures,
    without dropping any messages. In particular, there may be no gaps (according
    to the message IDs, which must be consecutive) within one block and across consecutive
    blocks. Note that this means that also messages which cannot be parsed as transactions,
    such as cutting messages, are included in blocks. This removes any ambiguity that
    might otherwise be present at different orderers, e.g., due to dropped messages
    on the network, and effectively changes the computation of the blocks to be a
    deterministic function on the same content across all orderers. Thus, all honest
    orderers generate the same (prefix of the) "correct" chain, allowing us to identify
    misbehaving orderers by comparing their outputs to this "correct" chain. Peers
    are changed accordingly, i.e., they now also check whether a new block meets the
    above criteria and reject those blocks that do not pass the check.


    # ## 4. Security Model of Fabric*


    We now describe the formal model that we use to analyze and show accountability
    of Fabric* (formal definitions of all machines used in our model are available
    in the full version [41]). Our basic model is similar in spirit and inspired by
    those of Garay et al. [24], Pass et al. [53], and the recent work on the Ouroboros
    family [8], [19], [35], [36]. However, as already mentioned and further explained
    below, it differs in important aspects.


    We first explain a few high-level points of our modeling: We model Fabric* in
    the IITM model [37], [47],


    ![](img/872e73daae6737693dbc96d0b122ca30_7_0.png)


    Figure 3. IITM Model of Fabric*: the upper layer of machines in P_F are connected
    via tapes to the environment E and via tapes to the lower layer/subroutines F_init,
    RO, and F_sig. Furthermore, all machines in P_F are connected via tapes to A.


    a model for universal composability similar to the UC model [15]. We model a fully
    asynchronous setting, i.e., with message loss and without assuming rounds or a
    global clock. This is in contrast to most analyses of other blockchains, including
    the above mentioned works, which require networks with bounded message delay to
    show their security results and use rounds and/or clocks to model, e.g., limited
    access to computational resources. We also model full dynamic corruption of parties
    without assuming any limitations on, e.g., the number of corrupted participants.
    This is again in contrast to most analyses of other blockchains, which generally
    need assumptions on the number of honest parties such as, e.g., an honest majority.
    Furthermore, we provide a wide range of options to the adversary who is, for example,
    able to choose/change the Kafka leader arbitrarily and initiate block cutting
    of messages at any point in the run. For simplicity of presentation, we model
    a static, but arbitrarily big number of participants that does not change throughout
    a run of a system.


