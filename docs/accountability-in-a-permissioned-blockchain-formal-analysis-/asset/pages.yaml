  md: 'from Section 3.1 are analyzed in Appendix C. We believe that all of our definitions
    and concepts should be easy to adapt to other (permissioned) blockchains as well.


    # 6.1. Defining Accountability w.r.t. Consistency


    Standard definitions of consistency/common prefix of blockchains have been introduced
    in [24], [53]. These definitions essentially state that two honest participants
    that hold a blockchain always share the same chains, except for potentially the
    last $T$ blocks. We will show that Fabric* is accountable with respect to an even
    stronger definition of consistency: intuitively, we define consistency to hold
    true if, for every two participants, the chain of one participant is a prefix
    of the chain of the other participant. This definition is stronger in two aspects:
    Firstly, we do not have to allow for a spoofal divergence in the last $T$ blocks.
    Secondly, our definition also includes dishonest participants.


    In the following, we refer to what we call reported blocks to denote the blocks
    $\mathcal{B} = (j, prevHash, B, pid, s)$ that peers send to the judge $J$ where
    $j$ is a block number, $B$ is a block body, $pid$ is the ID of the orderer that
    generated the block, $prevHash$ is the hash over its predecessor block, and $s$
    is the orderer’s signature over the block.


    In order to define consistency, it is convenient to require that a chain at least
    follows the basic parsing and verification rules of the blockchain protocol. We
    call this goal basic correctness (see also the remark before Definition 3), which
    is somewhat similar to chain-level validity as introduced by [9]. With this, we
    can now define consistency of Fabric*. We later enforce both consistency and basic
    correctness via accountability.


    **Definition 2** (Consistency of Fabric*). Consider a run $\omega$ of the system
    $\mathcal{E}[\mathcal{A}|\mathbb{P}_F]$, for some environment $\mathcal{E}$ and
    some adversary $\mathcal{A}$ that satisfies basic correctness. Let $P$ be the
    set of peer identities (as specified as a parameter of $\mathcal{F}_{\text{init}}$).
    Let Let $[\omega]$ denote one point somewhere in the run $\omega$. Let $p_1, p_2
    \in P$ and let $\mathcal{B}_1^i = (1, prevHash_1^i, B_1^i, pid_1^i, s_1^i), \dots,
    \mathcal{B}_{id_i}^i = (id_i, prevHash_{id_i}^i, B_{id_i}^i, pid_{id_i}^i, s_{id_i}^i)$
    be all blocks reported by $p_i$ up to point $[\omega]$ for $i \in \{1, 2\}$ and
    $id_1, id_2 \in \mathbb{N}$. We say that $p_1$ and $p_2$ share a prefix at point
    $[\omega]$ if $B_1^j = B_2^j$ for all $j = 1, \dots, \min(id_1, id_2)$. The IITM
    system $\mathcal{E}[\mathcal{A}|\mathbb{P}_F]$ satisfies consistency in $\omega$
    iff all pairs of peers $p_1, p_2 \in P$ share a prefix at every point during the
    run $\omega$.


    In contrast to typical definitions of consistency, our consistency definition
    merely requires that peers agree on the order and contents of block bodies. There
    are three reasons for this difference: Firstly, agreement on block bodies is already
    sufficient for all peers to obtain an identical ledger state, so there is no reason
    to require agreement on other parts. Secondly, the construction of Fabric, resp.
    Fabric*, allows for the same block (ID) to be created and signed by different
    orderers, so it is not possible to show agreement on the full blocks. Thirdly,
    agreement of hashes (which do not include orderer IDs and signatures and hence
    should still be identical for different peers) is already covered separately by
    the security goal hash chain integrity; if desired, one could add agreement on
    hashes to be part


    of the consistency definition – this would not change our results.


    For Fabric*, we would like to show that every run provides either both basic correctness
    and consistency or we can hold someone accountable for misbehaving. This is captured
    in the notion of (individual) accountability w.r.t. consistency, which we define
    via $\Phi$-accountability. Note that in the following definition we specify three
    properties, $\alpha_1, \alpha_2$, and $\alpha_3$, that each cover a violation
    of one of the requirements of basic correctness as well as a fourth property $\alpha_4$
    that captures a violation of consistency. In fact, formally we define basic correctness
    to be satisfied for a run if it does not belong to $\alpha_1 \cup \alpha_2 \cup
    \alpha_3$. Also, $\alpha_4$ defines exactly those runs which satisfy basic correctness
    but violate consistency (see Lemma 1). We remark that all properties $\alpha_1,
    \alpha_2, \alpha_3$, and $\alpha_4$ are defined to be disjoint sets of runs. This
    simplifies the security proof.


    **Definition 3** (Accountability w.r.t. Consistency). We consider runs of the
    IITM system $\mathcal{E}[\mathcal{A}|\mathbb{P}_F]$ for some environment $\mathcal{E}$
    and some adversary $\mathcal{A}$. Let $P = \{p_1, \dots, p_m\}$ be the set of
    peers, let $\mathcal{O} = \{o_1, \dots, o_l\}$ be the set of orderers, and let
    $\mathbb{K}$ be the set of Kafka brokers as specified in the parameters of $\mathcal{F}_{\text{init}}$.
    Let $\mathbf{A} = \mathbf{P} \cup \mathbf{O} \cup \{\mathfrak{K}\}$ be the set
    of identities that should be held accountable, where $\mathfrak{K}$ is a special
    symbol that denotes the whole Kafka cluster. In the following, let $msg_{\mathfrak{K}}
    := (id_{\mathfrak{K}}, pid_{\mathfrak{K}}, msg, mr, mp, sr_{\mathfrak{K}})$ be
    a Kafka message and $\mathcal{B} = (id_{\mathcal{B}}, prevHash, B, pid_{\mathcal{B}},
    s_{\mathcal{B}})$ be a block. We now define the following four properties (predicates
    on runs): $\alpha_1$ (well-formed data): $\alpha_1$ includes all runs where peers
    report data to the judge that violates any of the following four requirements:
    (i) Reported data can be parsed as a block $\mathcal{B}$ and components of the
    block body $\mathcal{B}$ have correct data types. (ii) The block body $B$ of a
    reported block $\mathcal{B}$ can be parsed as a sequence of Kafka messages $msg_{\mathfrak{K}}$.
    (iii) The sequence of blocks that a single peer reports is in consecutive order
    without gaps (i.e., if a block with ID $id_{\mathcal{B}}$ is reported, then the
    next reported block has ID $id_{\mathcal{B}} + 1$ and the first block has ID 1.
    (iv) The sequence of blocks that a single peer reports contains, in the block
    bodies, a consecutive sequence of Kafka messages $msg_{\mathfrak{K}}$ without
    gaps such that the first message has ID 1. $\alpha_2$ (role compliance): $\alpha_2$
    includes all runs that are not in $\alpha_1$ and where a peer reports a block
    $\mathcal{B}$ such that (i) $pid_{\mathcal{B}} \notin \mathbf{O}$ or (ii) the
    block body $B$ includes a Kafka message $msg_{\mathfrak{K}}$ where $pid_{\mathfrak{K}}
    \notin \mathbf{K}$. $\alpha_3$ (signature validity): $\alpha_3$ includes all runs
    that are not in $\alpha_1 \cup \alpha_2$ and where a peer reports a block $\mathcal{B}$
    such that (i) $\text{VerifySig}_{pk(pid_{\mathcal{B}})}((id_{\mathcal{B}}, prevHash,
    B), s_{\mathcal{B}}) = false$ or (ii) the block body $B$ includes a Kafka message
    $msg_{\mathfrak{K}}$ such that $\text{VerifyMerkleProof}^+((id_{\mathfrak{K}},
    pid_{\mathfrak{K}}, msg, mr, mp) = false$ or $\text{VerifySig}_{pk(pid_{\mathfrak{K}})}(mr,
    s_{\mathfrak{K}}) = false$. $\alpha_4$ (consistency): $\alpha_4$ contains all
    runs that are not in $\bigcup_{i=1}^3 \alpha_i$ and where two peers report blocks
    $\mathcal{B} = (id_{\mathcal{B}}, prevHash, B, pid_{\mathcal{B}}, s_{\mathcal{B}})$
    and $\overline{\mathcal{B}} = (id_{\overline{\mathcal{B}}}, prevHash, \overline{B},
    pid_{\overline{\mathcal{B}}}, s_{\overline{\mathcal{B}}})$ such that $B \neq \overline{B}$.


    3. We note that well-formed data includes the security goal of no skipping as
    defined by Androulaki et al. [2].'
