    # 4. Block Generation and Distribution.


    The ordering service is supposed to create blocks from the transaction commitments
    it receives. As mentioned before, for now we consider the ordering service to
    be a black box, with the most commonly used concrete instantiation based on Apache
    Kafka described in Section 2.4.


    When an ordering service receives a transaction commitment, it stores the commitment
    for inclusion in an upcoming block. A block in Fabric consists of a block number
    (the ID of the block), a block body, i.e., an ordered sequence of transaction
    commitments (including all endorsements), the hash of the previous block, the
    identity of the participant of the ordering service that formed the block (recall
    that the ordering service is usually a distributed system consisting of different
    entities), and a signature of that participant over the full block (excluding
    the signature field). The hash of the previous block is computed over the previous
    block, excluding the block creator''s identity and the signature. Blocks are created
    using sequential block numbers starting at 1. When a new block is created, the
    ordering service removes some of its transaction commitments from its storage,
    orders them, and then adds them to the body of a new block. The resulting block
    is then sent to the peers in the channel (cf. (4) in Figure 1).


    Importantly, to increase throughput, ordering services generally do not validate
    transactions. Thus invalid and malformed transactions can be part of a block in
    Fabric; these are filtered out in the next step.


    # 5. Block Validation and Ledger State Update.


    Upon receiving a new block, peers validate whether they accept the block, i.e.,
    whether the block has the expected format, contains a valid signature from an
    orderer identity, and the block number is as expected (i.e., it increments the
    number of the previously accepted block by 1). If peers accept a block, they update
    their local copy of the ledger state according to the new block. More specifically,
    peers sequentially process transactions from the new block. For each transaction,
    they first check validity of the transaction, i.e., whether it has the expected
    format and the transaction commitment meets the endorsement policy. Valid transactions
    are then applied to the local ledger state. In contrast to, e.g., Ethereum, this
    is not done by re-executing the transaction, but rather by using the precomputed
    readsets and writesets from the endorsements of the transactions. Peers first
    check whether the readsets match their current


    ledger state (if not, the transaction is marked as invalid and is not applied
    to the state) and then apply the changes from the writsets.


    We emphasize the following fundamental differences between Fabric and other classical
    blockchains:


    Firstly, the separation of (i) execution of transactions (Step 2), (ii) transaction
    ordering and block generation (Step 4), and (iii) transaction validation (Step
    5,) is the core of the execute-order-validate paradigm. In contrast, typical blockchains
    use the order-execute paradigm where (i) miners order the transactions into blocks
    and propagate the blocks to all full-nodes and (ii) full-nodes validate and execute
    transactions if they accept a new block. The execute-order-validate paradigm enables
    a high throughput in Fabric compared to other blockchains [2], [21], [27].


    Note that one of the reasons for the improved throughput is that peers in Fabric
    simply trust the writsets contained in a valid transaction commitment, instead
    of recomputing the correct output on their own. Hence, the endorsement policy
    should be specified in such a way that it is reasonable to assume that the set
    of peers endorsing a transaction proposal contains at least one honest peer. In
    this case, malicious peers cannot manipulate the outcome of a transaction.


    Secondly, in contrast to, e.g., Bitcoin or Ethereum, there is no longest chain
    rule or a similar construct that allows for changing the current chain. Instead,
    chains of peers are final in the sense that they only extend their chains, but
    never remove/change previously accepted blocks.


    This completes the description of the basic Fabric framework. Next, we first briefly
    describe Apache Kafka and then how Kafka is used in Fabric.


    # 2.3. Apache Kafka


    Apache Kafka [3] is a so-called streaming platform. It is a crash fault-tolerant
    distributed system optimized for durability, high throughput, and reliable message
    distribution. In essence, Kafka provides an (atomic) broadcast channel: Kafka
    clients can send messages to the channel, which are then arranged into a total
    order. The resulting message stream can be accessed by the clients, allowing all
    clients to obtain the same sequence of messages. We give only a high-level overview
    of Kafka that is sufficient to follow our paper.


    Kafka consists of two main components: Kafka clients and a Kafka cluster. Clients
    can publish messages in the Kafka message stream by sending those messages to
    the Kafka cluster, and clients can also retrieve the complete ordered message
    stream from the Kafka cluster. The Kafka cluster consists of several machines
    called Kafka brokers. One of the brokers is the so-called Kafka leader. The leader
    handles all requests from clients. That is, upon receiving a message from a client,
    the leader adds an incremental message ID (a counter), called offset, to the message
    and appends the message to the message stream. Clients can send a request to the
    leader to obtain the full message stream. All non-leading brokers provide redundancy
    by replicating the state of the leader. If the leader crashes, then the remaining
    brokers elect a new leader (via Apache ZooKeeper [4], [29]) who then takes over
    the duties of the former leader. In practice, the whole'
