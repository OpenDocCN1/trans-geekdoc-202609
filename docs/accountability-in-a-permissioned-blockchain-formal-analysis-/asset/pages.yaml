    As already mentioned earlier, Fabric using Kafka trivially does not provide consistency
    in the presence of misbehaving participants. For example, a corrupted Kafka cluster
    can distribute messages in different orders to different orderers. Hence, the
    blocks that orderers build from those transactions will also be different and
    in particular define different ledger states. Even if one were to assume that
    Kafka operates honestly, there would still be other issues. For example, corrupted
    orderers can deliver different blocks to different peers, again violating consistency.


    While this would be devastating for any anonymous public blockchain, Fabric is
    a permissioned blockchain


    where the real identities of participants are known. So while consistency cannot
    be guaranteed in a strict sense, we put forward the idea of (individual) accountability,
    which so far has not been considered for blockchains. That is, if consistency
    is violated it should be possible to hold (individual) parties accountable for
    their misbehavior. More specifically, there should be cryptographic evidence that
    rightfully convinces all parties – parties who are part of the channel, but also
    external observers or an auditor – that one or more specific parties misbehaved.
    Such parties would then face punishment and image loss, which should deter them
    from misbehaving in the first place.


