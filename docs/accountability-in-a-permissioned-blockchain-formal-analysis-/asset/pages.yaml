    An Ordering Service is an abstract concept that provides a “consensus service”
    in Fabric. The ordering service is typically instantiated via a distributed protocol
    potentially using multiple different sub-roles, but it can also be implemented
    via a single centralized machine (cf. the Solo ordering service [30]). This service
    is one of the major differences compared to other blockchains. With this service,
    consensus and transaction execution are separated and an _execute-order-validate
    architecture_ is established. Transactions from clients are first executed by
    (some or all of) the peers; afterwards, transactions and execution results are
    forwarded by the clients to the ordering service. The ordering service forms blocks
    from the incoming transactions without re-executing transactions or checking validity.
    The service then distributes the blocks to all peers.


    Besides these four central roles (MSP, client, peer, ordering service), there
    are some additional (sub-)roles in Fabric, namely administrators, leading peers,
    anchor peers, and committing peers. Administrators are allowed to, e.g., update
    smart contracts and to add organizations. The various peer types describe different
    peers with specific tasks. For example, leading peers directly receive blocks
    from the ordering service and then distribute these blocks to other peers. While,
    for simplicity of presentation, we subsume all peer subroles into a single peer
    role and omit administrators, all of our results also hold true when these (sub-)roles
    are taken into account.


    # 2.2. The Fabric Protocol


    We now describe the Fabric protocol in detail, including the precise interactions
    between the roles described above.


    A set of organizations creates a new Fabric channel by first externally agreeing
    on a genesis block. The genesis block contains an initial setup of the Fabric
    channel, including a channel ID, organizations and thus participants that are
    allowed to access the channel. For simplicity of presentation, we also include
    in the genesis block an initial state of the channel, smart contracts available
    in the channel (i.e., deterministic programs which are called _chaincode_ in Fabric),
    and a so-called endorsement policy for each chaincode; formally, all of this information
    is also agreed upon externally but would be installed separately from the genesis
    block. We explain endorsement policies in the protocol description below.


    In what follows, we exemplify the execution of the Fabric protocol by following
    the path of a transaction from its initial creation until it becomes part of the
    blockchain. Figure 1 depicts the corresponding message flow.


