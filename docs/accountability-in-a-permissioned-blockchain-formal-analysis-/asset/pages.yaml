    In the following, we describe our model in detail. We start by giving a brief
    overview of the IITM model that is sufficient to understand our Fabric* model
    and analysis.


    IITMs are probabilistic Turing machines which can communicate via connected input
    and output tapes. A set of IITMs is called a system; in such a system, IITMs can
    be marked via a special so-called bang operator "!". For example, M1 | !M2 is
    a system consisting of two IITMs M1 and M2. In runs of a system Q, written Q^(17)
    where eta in N is the security parameter, there can be multiple instance of machines
    marked by "!", but only a single instance of each of the other machines. Only
    one instance is active at a time, which can send messages to other instances via
    a connected tape; that instance then becomes active. Different instances of one
    machine can be addressed by unique IDs. In our Fabric* model, these IDs are party
    IDs of the participants.


