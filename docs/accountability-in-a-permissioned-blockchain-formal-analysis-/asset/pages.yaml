    **Structure of the paper.** We introduce the Fabric protocol, including the Kafka-based
    consensus mechanism, in Section 2. In Section 3, we explain why Fabric using Kafka
    does not achieve consistency in the presence of an active adversary. We also give
    a first intuition of individual accountability w.r.t. consistency and explain
    why Fabric fails to achieve this security notion. We then propose Fabric*, obtained
    from slight modifications to Fabric, with a formal model of Fabric* described
    in Section 4. In Section 5 we introduce the accountability framework we use. Then,
    we formally define accountability w.r.t. consistency in Section 6 and prove that
    Fabric* satisfies this property. We also discuss other security notions besides
    consistency in Appendix C, with more details provided in the appendix. We discuss
    related work in Section 7. We conclude in Section 8. Full details are available
    in the full version of the paper [41].


    # 2. Hyperledger Fabric


    Fabric is designed as a *distributed operating system* [2]. Similar to Ethereum
    [60], the Fabric blockchain allows distributed code execution: all transactions
    in Fabric are calls to code stored in the blockchain. There is not just a single
    global instance of Fabric but there are multiple separate instances running in
    parallel. Each instance has its own set of participants, chain, code, ledger state
    (derived from the chain), and parameters, thus allowing different (groups of)
    companies to run their own separated Fabric blockchains. Such instances are called
    *channels*. Fabric is a framework that can be instantiated with different consensus
    algorithms. As already mentioned in the introduction, we focus on Fabric using
    Kafka.


    In this section, we first describe the general and abstract protocol of Fabric
    independently of specific consensus algorithms. We then explain the Apache Kafka-based
    consensus mechanism as one possible instance of a consensus algorithm. In our
    description of Fabric, we follow the terminology and presentation of Fabric by
    Androulaki et al. [2], which differs slightly from Fabric''s read-the-docs [32].


    # 2.1. Roles in Fabric


    In Fabric, all participants have a *role* and are assigned to an *organization*.
    One can think of an organization as a company that takes part in the Fabric blockchain.
    The central roles are the following:


    **Membership Service Providers (MSP)** provide access to the Fabric blockchain.
    More specifically, MSPs issue certificates to participants, which include the
    participant''s role, organization, and public key.


    **Clients** initiate transactions. They typically obtain inputs for transactions
    from end users. Similar to other blockchains, clients do not keep a copy of the
    chain.


    **Endorsing Peers or Peers** are essentially the “miners” and “full-nodes” of
    Fabric. They execute transactions from'
