  - '[PAGE 12]


    Proof Idea. We have to show two properties, fairness and completeness.


    **Fairness.** Firstly, we prove that the judge $J$ does not render a wrong verdict
    in a run of $\mathcal{E} | \mathcal{A} | \mathbb{P}_\text{Fr}$, i.e., verdicts
    must evaluate to $\text{true}$ (except for a negligible set of runs). This mostly
    follows from the reasoning given in Section 6.2 and the fact that, by the definition
    of $\mathcal{F}_\text{sig}$, an adversary cannot forge signatures for honest parties.
    Note that here we benefit from the construction of the block cutting algorithm
    CUTBLOCK, which allows for deterministically recomputing a block from the Kafka
    message stream contained in such a block. Thus, all blocks from an honest orderer
    will be the same as the re-computation of the judge. Hence, honest peers and orderers
    will not be blamed by accident.


    There is, however, one special case that requires further attention: the Kafka
    cluster does not directly sign messages, but rather builds a Merkle tree and then
    signs its root. Thus, if an adversary finds a different message body and Merkle
    proof with the same Merkle root or if he can create a different Merkle proof for
    the same message body and Merkle root, he can re-use a signature of an honest
    Kafka cluster to create inconsistent Kafka stream messages and thus cause an incorrect
    verdict. However, one can reduce both cases to a collision in the random oracle
    (see, e.g., [17]). As collisions have only negligible probability for polynomial
    time systems, the judge issues a wrong verdict with at most negligible probability.


    **Completeness.** We have to prove that if a run of $\mathcal{E} | \mathcal{A}
    | \mathbb{P}_\text{F}$ belongs to $\alpha = \bigcup_{i=1}^4 \alpha_i$, then the
    judge $J$ renders a verdict that blames at least one of the peers, orderers, or
    the Kafka cluster. Observe that, according to the judging procedure, all verdicts
    of the judge blame an individual party or the Kafka cluster directly.


    As explained in Section 6.2, if a run is in $\bigcup_{i=1}^3 \alpha_i$, then the
    judge will notice this and blame the peer that caused the violation. If the run
    is in $\alpha_4$, i.e., consistency is violated while basic correctness holds
    true, then either the judge blames the Kafka cluster for distributing different
    messages, or we know the Kafka message stream in one conflicting block is a (real)
    prefix of the Kafka message stream of the other block. This essentially follows
    from basic correctness (in particular, this is where we need that there are no
    gaps in the Kafka message streams contained in the chains) and the fact that this
    is the first inconsistent block ID. Hence, the blocks are inconsistent only because
    they end at different points of the Kafka message stream. By definition of CUTBLOCK,
    both orderers should have cut the stream at the same endpoint (as they agree on
    the same prefix of the Kafka message stream). This implies that the final check
    of the judge fails for at least one of the orderers, who is then blamed.


    All of our security results are shown for an ideal signature functionality $\mathcal{F}_\text{sig}$.
    In Appendix D, we show that all results carry over if $\mathcal{F}_\text{sig}$
    is replaced by its realization $\mathcal{P}_\text{sig}$ (cf. [46]) where signing
    is done using an EUF-CMA secure signature scheme (_existential unforgeability
    under chosen message attacks_). While this result uses that $\mathcal{P}_\text{sig}$
    realizes $\mathcal{F}_\text{sig}$ in the usual UC sense (see e.g., [46]), the
    result does not follow immediately from UC composition theorems.


    # 7. Related Work


    Most of the established literature on blockchain security (see, e.g., [8], [9],
    [11], [19], [24], [35], [36], [53]) does not use accountability or the closely
    related concept of covert adversaries [5], [7]. While there are several works
    that mention accountability as a concept for blockchains [12], [14], [18], [22],
    [23], [33], [34], [54], none of them formalizes let alone proves accountability.
    Perhaps the closest to our work is the work by Karame et al. [34], who suggest
    countermeasures against double-spending in Bitcoin by identifying misbehaving
    parties. While this work uses the underlying intuition of accountability — namely
    identifying a misbehaving participant — to show a formal statement about double-spending,
    they do not use the concept of accountability itself in a formal way.


    As discussed in detail in Section 3.3, Haeberlen et al. [28] introduce PeerReview
    to add accountability on top of an arbitrary (deterministic) protocol. PeerReview
    has several drawbacks that typically make solutions tailored to the protocol at
    hand preferable (cf. Section 3.3). Furthermore, Haeberlen et al. do not provide
    a formal security proof for their system.


    # 8. Conclusion


    In this paper, we put forward the formal treatment of accountability for (permissioned)
    blockchains and distributed ledgers. As an orthogonal property to strict security
    notions, on the one hand, accountability can serve as an additional security layer
    for blockchains and distributed ledgers. On the other hand, as a stand-alone property
    in its own right, accountability opens up alternative and interesting ways of
    analyzing and constructing secure blockchains and distributed ledgers with other,
    partly weaker assumptions (e.g., no eventual message delivery and no honest majorities)
    and security goals that in some aspects are stronger.


    We successfully illustrated this approach by a rigorous analysis of an (improved)
    instance of Hyperledger Fabric, a very successful and widely used blockchain in
    the industry. In addition to the formal treatment of accountability, given the
    wide spread use of this blockchain, the results obtained in our case study are
    of independent interest. We expect this approach to also prove useful for the
    analysis of a wide range of existing (permissioned) blockchains and distributed
    ledgers, such as Tendermint-based blockchains [1] and Corda [13].


    Altogether, the formal treatment of accountability is a powerful tool that opens
    up new options for blockchain (security) research. Our approach also provides
    a formal foundation for formalizing and proving the informal accountability claims
    that are commonly found in many blockchain specifications.


    # Acknowledgements


    This research was partially funded by the Ministry of Science of Baden-Württemberg,
    Germany, for the Doctoral Program “Services Computing”.5


    5. http://www.services-computing.de/'
