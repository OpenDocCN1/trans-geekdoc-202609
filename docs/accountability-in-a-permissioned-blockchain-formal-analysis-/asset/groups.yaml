    liveness in a network with message loss for any blockchain. Hence, we adapt our
    model of Fabric* to include a round-based network model with bounded message delay,
    as it is commonly used also for other blockchains. However, even when assuming
    such a network model, both goals can still be broken due to Fabric*''s centralized
    structure: malicious orderers and in particular a malicious Kafka cluster can
    simply drop messages instead of forwarding them. Furthermore, culprits also cannot
    be held individually accountable for breaking these goals (based on data in the
    blockchain). Thus, formally one can only show that both goals hold true if (i)
    all peers, (ii) all orderers, and (iii) the Kafka cluster are honest.


