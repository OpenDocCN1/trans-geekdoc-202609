    来自第 3.1 节的内容在附录 C 中进行分析。我们相信，我们的所有定义和概念都应该易于适应其他（许可型）区块链。


    ## 6.1. 关于一致性的问责定义


    区块链的一致性/共同前缀的标准定义已在 [24]、[53] 中介绍。这些定义本质上指出，持有区块链的两个诚实参与者始终共享相同的链，除了可能的最后 $T$
    个块。我们将展示 Fabric* 相对于更强的一致性定义是可问责的：直观地，我们定义一致性成立当且仅当，对于每两个参与者，一个参与者的链是另一个参与者链的前缀。该定义在两个方面更强：首先，我们不必允许最后
    $T$ 个块中的分叉分歧。其次，我们的定义还包括不诚实参与者。


    以下，我们将所谓的已报告块用于表示对等体发送给法官 $J$ 的块 $\mathcal{B} = (j, prevHash, B, pid, s)$，其中 $j$
    是块编号，$B$ 是块体，$pid$ 是生成该块的排序节点的 ID，$prevHash$ 是其前驱块的哈希值，$s$ 是排序节点对该块的签名。


    为了定义一致性，要求链至少遵循区块链协议的基本解析和验证规则是方便的。我们将这一目标称为基本正确性（另见定义 3 前的说明），这与 [9] 引入的链级有效性有些相似。有了这一点，我们现在可以定义
    Fabric* 的一致性。我们稍后将通过问责来强制执行一致性和基本正确性。


    ### 定义 2（Fabric* 的一致性）


    考虑系统 $\mathcal{E}[\mathcal{A}|\mathbb{P}_F]$ 的一个运行 $\omega$，其中环境 $\mathcal{E}$
    和对手 $\mathcal{A}$ 满足基本正确性。令 $P$ 为对等体身份集合（作为 $\mathcal{F}_{\text{init}}$ 的参数指定）。令
    $[\omega]$ 表示运行 $\omega$ 中的某一点。令 $p_1, p_2 \in P$，并令 $\mathcal{B}_1^i = (1, prevHash_1^i,
    B_1^i, pid_1^i, s_1^i), \dots, \mathcal{B}_{id_i}^i = (id_i, prevHash_{id_i}^i,
    B_{id_i}^i, pid_{id_i}^i, s_{id_i}^i)$ 为 $p_i$ 在点 $[\omega]$ 之前报告的所有块，其中 $i \in
    \{1, 2\}$ 且 $id_1, id_2 \in \mathbb{N}$。我们说 $p_1$ 和 $p_2$ 在点 $[\omega]$ 共享前缀，如果对于所有
    $j = 1, \dots, \min(id_1, id_2)$ 都有 $B_1^j = B_2^j$。IITM 系统 $\mathcal{E}[\mathcal{A}|\mathbb{P}_F]$
    在 $\omega$ 中满足一致性，当且仅当所有对等体对 $p_1, p_2 \in P$ 在运行 $\omega$ 的每一点都共享前缀。


    与典型的一致性定义相反，我们的一致性定义仅要求对等体就块体的顺序和内容达成一致。这种差异有三个原因：首先，就块体达成一致已经足够让所有对等体获得相同的账本状态，因此没有理由要求对其他部分达成一致。其次，Fabric（或
    Fabric*）的构造允许相同的块（ID）由不同的排序节点创建和签名，因此不可能展示对完整块的一致性。第三，哈希的一致性（不包含排序节点 ID 和签名，因此对不同对等体仍应相同）已由安全目标哈希链完整性单独覆盖；如果需要，可以将哈希一致性加入一致性定义的一部分——这不会改变我们的结果。


    对于 Fabric*，我们希望展示每个运行要么同时提供基本正确性和一致性，要么我们可以对某人因不当行为进行问责。这一概念通过关于一致性的（个体）问责来捕捉，我们通过
    $\Phi$-问责来定义。请注意，在以下定义中，我们指定了三个属性 $\alpha_1, \alpha_2$ 和 $\alpha_3$，它们分别覆盖基本正确性要求的一个违反，以及第四个属性
    $\alpha_4$，它捕捉一致性的违反。事实上，从形式上讲，我们定义如果一个运行不属于 $\alpha_1 \cup \alpha_2 \cup \alpha_3$，则该运行满足基本正确性。此外，$\alpha_4$
    定义了恰好那些满足基本正确性但违反一致性的运行（参见 Lemma 1）。我们指出，所有属性 $\alpha_1, \alpha_2, \alpha_3$ 和
    $\alpha_4$ 都被定义为不相交的运行集合。这简化了安全证明。


    ### 定义 3（关于一致性的问责）


    我们考虑 IITM 系统 $\mathcal{E}[\mathcal{A}|\mathbb{P}_F]$ 的运行，其中环境 $\mathcal{E}$ 和对手
    $\mathcal{A}$。令 $P = \{p_1, \dots, p_m\}$ 为对等体集合，令 $\mathcal{O} = \{o_1, \dots,
    o_l\}$ 为排序节点集合，并令 $\mathbb{K}$ 为 $\mathcal{F}_{\text{init}}$ 参数中指定的 Kafka 代理集合。令
    $\mathbf{A} = \mathbf{P} \cup \mathbf{O} \cup \{\mathfrak{K}\}$ 为应被问责的身份集合，其中
    $\mathfrak{K}$ 是表示整个 Kafka 集群的特殊符号。以下，令 $msg_{\mathfrak{K}} := (id_{\mathfrak{K}},
    pid_{\mathfrak{K}}, msg, mr, mp, sr_{\mathfrak{K}})$ 为 Kafka 消息，$\mathcal{B} =
    (id_{\mathcal{B}}, prevHash, B, pid_{\mathcal{B}}, s_{\mathcal{B}})$ 为块。我们现在定义以下四个属性（运行上的谓词）：$\alpha_1$（格式正确的数据）：$\alpha_1$
    包含所有对等体向法官报告违反以下任意四项要求的运行：(i) 报告的数据可以解析为块 $\mathcal{B}$ 且块体 $\mathcal{B}$ 的组件具有正确的数据类型。(ii)
    报告块 $\mathcal{B}$ 的块体 $B$ 可以解析为 Kafka 消息 $msg_{\mathfrak{K}}$ 的序列。(iii) 单个对等体报告的块序列是连续的且没有间隙（即，如果报告了
    ID 为 $id_{\mathcal{B}}$ 的块，则下一个报告的块具有 ID $id_{\mathcal{B}} + 1$，且第一个块具有 ID 1）。(iv)
    单个对等体报告的块序列在块体中包含一个连续的 Kafka 消息 $msg_{\mathfrak{K}}$ 序列且没有间隙，使得第一条消息具有 ID 1。$\alpha_2$（角色合规性）：$\alpha_2$
    包含所有不在 $\alpha_1$ 中且其中对等体报告块 $\mathcal{B}$ 使得 (i) $pid_{\mathcal{B}} \notin \mathbf{O}$
    或 (ii) 块体 $B$ 包含 Kafka 消息 $msg_{\mathfrak{K}}$ 其中 $pid_{\mathfrak{K}} \notin \mathbf{K}$
    的运行。$\alpha_3$（签名有效性）：$\alpha_3$ 包含所有不在 $\alpha_1 \cup \alpha_2$ 中且其中对等体报告块 $\mathcal{B}$
    使得 (i) $\text{VerifySig}_{pk(pid_{\mathcal{B}})}((id_{\mathcal{B}}, prevHash,
    B), s_{\mathcal{B}}) = false$ 或 (ii) 块体 $B$ 包含 Kafka 消息 $msg_{\mathfrak{K}}$ 使得
    $\text{VerifyMerkleProof}^+((id_{\mathfrak{K}}, pid_{\mathfrak{K}}, msg, mr, mp)
    = false$ 或 $\text{VerifySig}_{pk(pid_{\mathfrak{K}})}(mr, s_{\mathfrak{K}}) =
    false$ 的运行。$\alpha_4$（一致性）：$\alpha_4$ 包含所有不在 $\bigcup_{i=1}^3 \alpha_i$ 中且其中两个对等体报告块
    $\mathcal{B} = (id_{\mathcal{B}}, prevHash, B, pid_{\mathcal{B}}, s_{\mathcal{B}})$
    和 $\overline{\mathcal{B}} = (id_{\overline{\mathcal{B}}}, prevHash, \overline{B},
    pid_{\overline{\mathcal{B}}}, s_{\overline{\mathcal{B}}})$ 使得 $B \neq \overline{B}$
    的运行。


    - 3. 我们指出，格式正确的数据包括 Androulaki 等人 [2] 定义的不跳过安全目标。


    总体而言，我们设置 \(\alpha := \bigcup_{i=1}^4 \alpha_i$。我们为 $\alpha$ 定义问责约束 $\mathcal{C}$
    如下：$\mathcal{C} := (\alpha \Rightarrow \text{dis}(p_1)|\dots|\text{dis}(p_m)|\text{dis}(\alpha_1)|\dots|\text{dis}(\alpha_l)|\text{dis}(\mathfrak{K}))$。也就是说，如果基本正确性或一致性被违反，则法官必须从参与者集合
    $A$ 中至少责备一个个体。我们定义问责属性 $\Phi := \{\mathcal{C}\}$。


    如果对于所有环境 $\mathcal{E}$ 和对手 $\mathcal{A}$，我们有 $\mathcal{E}[\mathcal{A}\|\mathbb{P}_F]$
    实现了 $\Phi$-问责，则我们称 $\mathbb{P}_F$ 关于一致性是（个体）可问责的。


    在第 6.3 节中，我们证明 $\mathbb{P}_F$ 提供关于一致性的（个体）问责。


    显然，上述关于一致性的问责定义确实涵盖了基本正确性和一致性的预期安全目标，即违反其中一属性的运行属于 $\alpha$。


    ### 引理 1


    令 $\mathcal{E}$ 为环境，$\mathcal{A}$ 为对手。令 $\Omega$ 为 $\mathcal{E}[\mathcal{A}\|\mathbb{P}_F]$
    满足基本正确性和一致性的运行集合。令 $\alpha$ 如上定义。那么成立 $\alpha$ 是 $\Omega$ 的补集。


    ## 6.2. 评判程序


    ### 法官在现实中建模的内容


    请回顾，在我们的模型中，（诚实）对等体将其接受的块报告给法官，法官随后可以利用这些信息作出裁决。在现实中，这对应于发现一个或多个对等体的链中存在错误，随后将这些链提供给其他方（例如，其他对等体或独立的第三方）以确定谁导致了该错误。


    例如，如果客户怀疑一致性被违反，比如说，因为来自一个对等体的请求数据与来自另一个对等体的数据可疑地不一致，客户将通知参与 Fabric* 通道的组织有关不一致的情况。这些组织将按照评判程序检查两个对等体的链，以确定某一方是否行为不当。如果其中一个对等体拒绝提供请求的数据，他显然有罪，即干扰协议。请注意，这个过程确实需要基本正确性：对等体不应能够通过提供格式错误的证据来逃避裁决。除了客户怀疑问题之外，对等体可能（被要求）不时交换数据，以查看是否存在不一致。


    一旦发现错误并且法官已识别出行为不当的参与者，组织随后会带外就“正确”链达成一致（例如，通过丢弃不一致之后的所有块），并从那里继续。请注意，个体问责起到了强大的威慑作用，因此不一致链等错误在实践中通常不应发生。


    ### 评判程序规范


    在运行开始时，法官 $J$ 从 $\mathcal{F}_{\text{init}}$ 获取 Fabric* 通道的基本信息，包括对等体、排序节点和 Kafka
    代理的身份集合。在运行期间，（诚实）对等体立即将其接受的所有块报告给 $J$。法官 $J$ 首先将这些已报告块作为裁决证据存储。如果至今尚未发布裁决，法官随后继续检查他是否因新接收的块而需要发布裁决：


    - **1. 基本正确性。** 法官首先检查基本正确性是否被违反，即当前运行是否在 $\bigcup_{i=1}^3 \alpha_i$ 中。请注意，这确实是可能的，因为所有这些属性都定义在提交给法官的证据/块之上。进一步请注意，根据其规范，诚实对等体也相应地检查块的这些属性，既不会接受也不会报告违反基本正确性的块（针对其自身链）。因此，如果一个块导致违反，则法官责备报告该块的对等体。


    - **2. 一致性。** 如果基本正确性在当前运行中仍然成立，则法官检查一致性是否被违反，即当前运行是否在 $\alpha_4$ 中。根据定义，当且仅当存在两个
    ID 相同但块体不同的已报告块 $\mathcal{B}_1, \mathcal{B}_2$（由两个不一定不同的排序节点生成）时，这种情况成立。裁决计算如下：法官首先检查
    $\mathcal{B}_1$ 和 $\mathcal{B}_2$ 中是否存在两个 ID 相同（且具有有效签名）的不同 Kafka 消息。如果是，则此不一致是由
    Kafka 集群引起的，Kafka 集群本应为每个 ID 生成唯一消息，因此责备 Kafka 集群。否则，（至少）一个排序节点在错误的点切断了链，即块结束得太早或太晚。为了找到罪魁祸首，法官检查
    $\mathcal{B}_1$ 是否遵循 CUTBLOCK 算法的规则：即，$\mathcal{B}_1$ 必须（i）包含最大数量的 Kafka 消息，使得这些消息中没有一个是有效的切断消息，或（ii）包含不超过最大数量的
    Kafka 消息以及一个单一的有效切断消息，该切断消息是 Kafka 消息中的最后一个。如果此检查失败，则生成 $\mathcal{B}_1$ 的排序节点被责备。否则，对
    $\mathcal{B}_2$ 执行相同的检查，可能导致对生成 $\mathcal{B}_2$ 的排序节点的裁决。


    ## 6.3. 证明问责


    在本节中，我们提出主要定理：Fabric* 关于一致性实现（个体）问责，即 $\Phi$-问责。连同引理 1，该定理表明在法官 $J$ 未发布裁决的情况下，Fabric*
    实现基本正确性和一致性。如果在某个时刻违反基本正确性或一致性，法官将正确且个体地至少责备一方。


    由于篇幅限制，我们在附录 C 中提供了 Fabric* 其余安全目标（来自第 3.1 节）的正式分析，即链增长、活性、哈希链完整性和无创建。


    ### 定理 2（Fabric* 关于一致性实现问责）


    令 $\mathbb{P}_F$ 为具有 $\mathcal{F}_{\text{init}}$ 任意参数和如第 6.2 节所定义的法官 $J$ 的 Fabric*
    协议。那么，成立 $\mathbb{P}_F$ 关于一致性实现个体问责。


    我们简要讨论证明的核心思想，完整证明见附录 B。


    '
