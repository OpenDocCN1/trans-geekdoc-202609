    to the IITMs. That is, intuitively, we would like to ensure all accountability
    constraints in Φ. Furthermore, we denote by Pr[Q(1^η) ⊨ {(J : ψ) | ψ ⊭}] the probability
    that the judge J states a verdict ψ at some point [ω] of a run of Q(1^η) such
    that [ω] ⊭ ψ, i.e., the judge renders a false verdict.


    **Definition 1** (Accountability). _Let_ Q _be a system of IITMs that includes
    a judge J and let_ A _be a set of agents. Let_ Φ _be an accountability property
    of Q.

    We say that J ensures_ Φ_-accountability for_ Q _(or_ Q _is_ Φ_-accountable w.r.t.
