    我们已在第 6 节中正式证明，Fabric* 在一致性方面具有问责性（一致性包括基本正确性，特别是不跳过）。在本节中，我们首先总结并简要讨论 Fabric*
    协议在第 3.1 节中其余安全目标的结果，即：链增长、活性、哈希链完整性和不创建。然后，我们对这些目标的分析提供完整细节。


