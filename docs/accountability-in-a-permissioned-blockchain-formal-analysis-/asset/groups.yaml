    ## 3.2. Fabric 的安全目标


    如前所述，在存在行为不端的参与者的情况下，使用 Kafka 的 Fabric 平凡地无法提供一致性。例如，损坏的 Kafka 集群可以以不同的顺序向不同的排序节点分发消息。因此，排序节点从这些交易构建的块也会不同，并特别定义不同的账本状态。即使假设
    Kafka 诚实运行，仍然会有其他问题。例如，损坏的排序节点可以向不同的对等节点交付不同的块，再次违反一致性。


    虽然后果对任何匿名公有区块链来说都是毁灭性的，但 Fabric 是一个许可区块链，参与者的真实身份是已知的。因此，虽然无法从严格意义上保证一致性，但我们提出了（个体）问责的概念，迄今为止区块链尚未考虑这一点。也就是说，如果违反一致性，应该能够对（个体）各方的不当行为进行追责。更具体地说，应该有密码学证据，正当地说服所有各方——包括通道中的各方，以及外部观察员或审计员——一个或多个特定各方行为不端。这些各方将面临惩罚和声誉受损，这应当从一开始就阻止他们行为不端。


    因此，我们的目标是展示 Fabric 对一致性的（个体）问责。这将从形式上保证，一致性要么成立，要么我们可以指责至少一个违反一致性的个体参与者。不幸的是，我们发现使用
    Kafka 的 Fabric 也无法实现这一目标：存在一致性被破坏但无法唯一识别行为不端方的情况。例如，如果有两个对等节点拥有不同的链，每条链单独来看都是有效的（签名验证等），但两条链不一致，比如两者都包含相同块编号的块，但块包含不同的交易，那么就不清楚是谁行为不端。如上所述，可能是
    Kafka 集群恶意地向不同的排序节点发送了不同的交易序列，也可能是恶意的排序节点未能根据从 Kafka 集群接收到的交易序列正确形成块。不清楚该责怪谁，是运行
    Kafka 集群的数据中心还是某些排序节点。排序节点和数据中心通常都属于不同的组织和公司，因此可能会并且会互相推卸责任。所以，没有任何个体各方可以被追究责任，这在实践中是不够的。


