    orderers (which act as Kafka clients) and a Kafka cluster. Orderers are typically
    run by the various organizations that take part in a Fabric channel, while the
    Kafka cluster is, as mentioned, run by a single organization in a data center.
    Orderers provide the external interface of the ordering service to the clients
    and peers of the Fabric channel. They receive transaction commitments, use the
    Kafka cluster to establish a total order over the incoming commitments, cut blocks
    from this ordered sequence, and finally deliver the blocks to the peers. We describe
    each step in more detail in what follows; an example message flow of two clients
    submitting commitments is given in Figure 2.


    - 1. Forward Transaction Commitments to Kafka Cluster. Upon receiving transaction
    commitments from clients (cf. ① in Figure 2), orderers forward the messages to
    the Kafka cluster. Note that orderers do not perform any checks, such as checking
    whether a commitment meets the endorsement policy.


    - 2. Distribute Ordered Sequence of Transactions. The Kafka cluster orders the
    incoming transaction commitments and attaches a message ID to every transaction
    (cf. ② in Figure 2). All orderers then receive an ordered sequence of transaction
    commitments from the Kafka cluster.


    - 3. Block Generation or Cutting. All orderers “cut” the sequence of transaction
    commitments into blocks via a deterministic block cutting algorithm CUTBLOCK.
    This algorithm creates new blocks depending on (i) the maximum number of transactions
    in a block, (ii) the maximum size of the resulting block, and (iii) time passed
    since the last block. On a technical level, to ensure consistent block cuts for
    all orderers in the cases (ii) and (iii), an orderer running into one of these
    cases first broadcasts a special cutting message via the Kafka cluster. This message
    contains the ID of the block that the orderer wants to create via a cut. The Kafka
    cluster puts this message into the message stream, just like other messages (in
    the context of Fabric those are typically transaction commitments). This cutting
    message then tells an orderer to cut a new block up to this cutting message if
    the ID in that cutting message matches their next block ID (otherwise the cutting
    message is ignored). The new block contains all transaction commitments as ordered
    by Kafka since the last block. The cutting messages themselves are not part of
    a block. In the improved version of Fabric presented in Section 3, this is different:
    blocks will contain more information.


    Orderers then add their name to the new block and sign the whole block. Thus,
    blocks from different orderers are supposed to be equal content-wise but differ
    in some of the meta-data, i.e., block creator and signature. All orderers push
    the resulting blocks to peers (not necessarily all peers, see next).


    In a typical Fabric setup using a Kafka-based consensus algorithm, (i) every organization
    runs its own peers to keep a copy of the chain, (ii) all organizations participate
    in the distributed ordering service, i.e., all organizations run at least one
    orderer as part of this service, (iii) orderers usually push blocks to all peers
    in their own organization, and (iv) if clients need to retrieve data from the
    chain, they usually query peers within their own organization; as explained, a
    state change (via a transaction) might involve sending transaction proposals to
    several peers also outside of the own organization, depending on the endorsement
    policy.


