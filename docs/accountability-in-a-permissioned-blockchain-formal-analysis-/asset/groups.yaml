    Fabric’s block definition), (ii) No skipping states that honest peers do not have
    gaps in their chain (i.e., all blocks in the chain of a peer have sequential IDs),
    and (iii) No creation states that chains of honest peers always consist of transactions
    cast (and signed) by Fabric clients.


    Since consistency is the most important and fundamental security goal of blockchains,
    in our presentation, we focus on this goal. Except for chain-quality, which is
    not directly applicable to Fabric using Kafka, we, however, also cover all other
    mentioned goals in our work (see Appendix C).


    # 3.2. Security Goals of Fabric


    As already mentioned earlier, Fabric using Kafka trivially does not provide consistency
    in the presence of misbehaving participants. For example, a corrupted Kafka cluster
    can distribute messages in different orders to different orderers. Hence, the
    blocks that orderers build from those transactions will also be different and
    in particular define different ledger states. Even if one were to assume that
    Kafka operates honestly, there would still be other issues. For example, corrupted
    orderers can deliver different blocks to different peers, again violating consistency.


    While this would be devastating for any anonymous public blockchain, Fabric is
    a permissioned blockchain


    where the real identities of participants are known. So while consistency cannot
    be guaranteed in a strict sense, we put forward the idea of (individual) accountability,
    which so far has not been considered for blockchains. That is, if consistency
    is violated it should be possible to hold (individual) parties accountable for
    their misbehavior. More specifically, there should be cryptographic evidence that
    rightfully convinces all parties – parties who are part of the channel, but also
    external observers or an auditor – that one or more specific parties misbehaved.
    Such parties would then face punishment and image loss, which should deter them
    from misbehaving in the first place.


    Therefore, our goal is to show (individual) accountability w.r.t. consistency
    for Fabric. This would then formally guarantee that consistency either holds true
    or we can blame at least one individual participant for breaking consistency.
    Unfortunately, we find that Fabric with Kafka does not achieve this goal either:
    there are cases where consistency is broken but one cannot uniquely identify a
    misbehaving party. For example, if there are two peers with different chains where
    each chain individually is valid (signatures verify etc.) but the two chains are
    inconsistent, say both contain a block with the same block number but the blocks
    contain different transactions, then it is not clear who misbehaved. It could,
    as mentioned above, be that the Kafka cluster had maliciously sent different transaction
    sequences to different orderers or it could be that a malicious orderer has not
    formed blocks correctly, given the transaction sequence received from the Kafka
    cluster. It is not clear who to blame, the data center running the Kafka cluster
    or some of the orders. The orders and the data center typically all belong to
    different organizations and companies, and hence could and would put the blame
    on one another. So, no individual party could be held accountable, which is insufficient
    in practice.


