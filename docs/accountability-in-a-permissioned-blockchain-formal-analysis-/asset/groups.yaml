    如前所述，众所周知，在存在消息丢失的完全异步网络中，无法获得链增长或活性（例如，如 Garay 等人 [24] 所定义）。与一致性不同，也无法使用问责来强制执行这两个目标，因为即使所有参与者都是诚实的，网络仍然可以丢弃消息。


    通常，通过假设一个消息延迟有限且消息不会被丢弃的网络，来证明区块链的链增长和活性。然而，即使使用这个假设，从形式上讲，Fabric* 一般来说并不提供这两个目标中的任何一个：一个损坏的
    Kafka 集群可以简单地丢弃传入消息，从而阻止链增长并违反活性。此外，从形式上讲，仍然无法使用（个体）问责来解决这个问题：如果一笔交易未包含在 Kafka
    消息流中，这可能是由于恶意 Kafka 集群丢弃了消息，也可能是由于恶意排序节点一开始就没有将消息转发到集群。如前文简要讨论过，但在现实中，如果消息不断被丢弃，当然可以调查问题，因为
