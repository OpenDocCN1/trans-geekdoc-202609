    this party can then be identified and held accountable. (ii) In order to fulfill
    accountability properties one might need less assumptions. For example, in order
    to show accountability w.r.t. consistency in our case study, we do not require
    an honest majority or networks with eventual message delivery; strict security
    notions have not been proven in this setting for any blockchain yet. (iii) Accountability
    properties might be stronger in some aspects than strict security notions: as
    explained for our case study, for our notion of accountability w.r.t. consistency
    we require (and prove for the considered protocol) consistency not only for blockchains
    of honest parties but also of dishonest ones.


    # Accountability as an additional, orthogonal layer of defense.


    On the other hand, accountability can be used as an additional security requirement
    and another security layer on top of strict notions: Even in the strict setting,
    security can still be broken because the underlying assumptions, such as an honest
    majority, might not be fulfilled. In such a case, with the accountability property
    in place one can still identify and blame misbehaving parties. (As mentioned for
    the stand-alone case, in order for accountability to hold true one might need
    only weaker assumptions, e.g., a dishonest majority might be tolerated.) Such
    parties can then be excluded from future executions. Moreover, faced with the
    prospect of being held accountable, parties might refrain from misbehaving in
    the first place, making certain assumptions, such as honest majority, more likely
    to hold true.


    # Levels of accountability.


    We note that there are different levels of accountability (and hence levels of
    security) that a blockchain can provide. If, for example, for some violations
    of security goals only a group of parties, possibly from different companies collaborating
    on the same chain, can be identified to have misbehaved, but it is only clear
    that at least one of the parties within this group must have misbehaved, then
    this is an insufficient level of accountability: no individual party can for sure
    be held accountable, and hence, be blamed and punished. To be sufficient for practical
    purposes, it should be possible to hold at least one individual party accountable
    for misbehavior, a property called *individual accountability*.


    # Analyzing accountability for blockchains.


    Our approach for analyzing accountability for blockchains is based on a generic
    accountability framework from Küsters et al. [43], which we slightly adjust. A
    key task for instantiating this framework for the analysis of blockchains is to
    formalize appropriate security goals, for which parties can be held accountable
    if they are violated. It seems difficult, if not impossible, to formulate such
    goals in a way that applies to all kinds of blockchains and distributed ledgers.
    The reason is that even established security goals, such as consistency, mean
    different things in different systems: for some consistency might mean that the
    complete chains of different parties are prefixes of each other, for other systems
    this might only be required for certain parts of the chains, e.g., possibly modulo
    the last $T$ blocks and/or modulo certain meta-data (where the definitions of
    these parts again depend on the protocols at hand), and yet for others, such as
    Corda [13], consistency might rather require that the combination of the partial
    states of different parties yields a consistent state.


    We therefore chose to exemplify our approach on accountability for blockchains
    via a case study of one of the most important permissioned blockchains: Hyperledger
    Fabric [2], [31]. Analyzing Fabric within the above mentioned framework involves
    instantiating the framework by carrying out the following main tasks: (i) build
    an appropriate system model, including a model of corruption, (ii) formalize the
    security goals to be achieved, including, among others, consistency, (iii) specify
    who is to be blamed if a security goal is violated, including a procedure for
    how to identify misbehaving parties, and (iv) use the resulting instantiation
    of the accountability framework to formally analyze accountability of Fabric with
    respect to the specified security goals.


    While the details of the above steps are specific to the protocol at hand, the
    case study nevertheless illustrates general techniques and serves as a blueprint
    for the formal analysis of accountability of other blockchains as well as distributed
    ledgers.


    # Hyperledger Fabric.


    Hyperledger Fabric [2], [31], or short Fabric, is a success story in the blockchain
    sector for the Linux Foundation [58]. This permissioned business blockchain is
    widely used and accepted by the industry. Forbes includes more than 20 important
    companies using Fabric in the Forbes Blockchain 50 list [20] — a list of leading
    companies that are implementing distributed ledger technology for production usage.


    The driving reasons behind the increasing adoption of Fabric are several unique
    features tailored towards industrial contexts, such as a *execute-order-validate*
    architecture that allows for parallel executions of transactions and thus increases
    throughput in Fabric over other blockchains [21], [27] (cf. Section 2). Moreover,
    Fabric introduced modularity to blockchain architectures, including a pluggable
    consensus mechanism, i.e., the consensus algorithm is defined via a “plugin”.
    This plugin can be chosen depending on the specific requirements at hand to create
    a customized instantiation of Fabric. Out of the box, Hyperledger ships Apache
    Kafka [3], [30] (in short, Kafka) and, very recently, Raft [30], [52] as the only
    production ready consensus mechanisms for Fabric, both of which are only crash-fault
    tolerant.


    Our approach of accountability in blockchains can in principle be applied to all
    possible instantiations of Fabric. In particular, accountability can add a second
    security layer to Fabric instantiations based on Byzantine-fault tolerant consensus
    mechanisms (e.g., the prototype of the PBFT SMaRT-based consensus mechanism [16],
    [56]) which already provide strict security guarantees under certain assumptions.
    More interesting for this work, however, is an instantiation of Fabric using Apache
    Kafka: Not only is this the most widely used instantiation in production setups,
    it is, as mentioned, also based on a consensus mechanism that is only crash-fault
    tolerant, and hence, does not meet strict security notions in the presence of
    active attackers. Therefore, it is interesting to investigate in how far accountability
    as a stand-alone property can help to assess and possibly improve the security
    of this widely used instance of Fabric, for which the designers deliberately chose
    a crash-fault tolerant consensus mechanism.


    In our analysis, we observe that Fabric using Kafka provides a certain weak level
    of accountability with re-'
