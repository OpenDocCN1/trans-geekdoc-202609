    this has already been discussed in Section 3.1. Secondly, as shown above, neither
    liveness nor chain-growth are necessary to guarantee consistency, unlike in, e.g.,
    blockchains relying on the longest chain rule. Thirdly, all participants of Fabric,
    resp. Fabric* know each other. So in a real world execution of Fabric*, if peers,
    orderers, or the Kafka cluster do not receive updates from the channel, operators
    will report this issue to the organizations of the channel. The organizations
    can then monitor individual connections to identify where messages are dropped
    and whether this was caused by one of the participants or an unreliable network.


