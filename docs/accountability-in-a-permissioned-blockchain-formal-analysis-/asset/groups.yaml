    ## 许可型区块链中的问责制：Hyperledger Fabric 的形式化分析


    Mike Graf

    信息安全研究所

    斯图加特大学

    德国斯图加特

    mike.graf@sec.uni-stuttgart.de


    Ralf Küsters

    信息安全研究所

    斯图加特大学

    德国斯图加特

    ralf.kuesters@sec.uni-stuttgart.de


    Daniel Rausch

    信息安全研究所

    斯图加特大学

    德国斯图加特

    daniel.rausch@sec.uni-stuttgart.de


    摘要——虽然问责制在分布式系统和密码学中是一个众所周知的概念，但在区块链（以及更广泛的分布式账本）文献中，对问责制的形式化处理一直是个盲点：至今尚未存在任何区块链的问责制形式化，更不用说形式化证明了。因此，在这项工作中，我们提出并建议在此领域对问责制进行形式化处理。我们的目标是正式陈述并证明，如果在区块链的一次运行中，某个核心安全属性（如一致性）未得到满足，那么行为不当的各方可以被识别并追究责任。问责制对于许可型区块链特别有用，因为在该类区块链中所有各方相互认识，因此问责制激励所有各方诚实行为。我们以最突出的许可型区块链之一——Hyperledger
    Fabric 的最常见实例化为例，阐述了我们的方法。


    索引术语——问责制、区块链、分布式账本、分布式系统、安全性、Hyperledger Fabric


    ## 1. 引言


    自2008年区块链发明以来[51]，人们对这一概念以及分布式账本技术的兴趣迅速增长。区块链和分布式账本最初被提出作为无中央机构支付系统的解决方案，现已发展为具有强大安全承诺的多用途分布式系统。


    尽管针对区块链存在广泛的既定安全概念和形式化安全分析[8]、[9]、[11]、[19]、[24]、[35]、[36]、[53]，但在区块链和分布式账本的形式化安全分析中，仍有一个重要的盲点：问责制[43]。从高层次来看，问责制要求，如果协议的某些安全目标被违反，那么行为不当的各方可以通过不可否认的密码学证据被识别并为其不当行为承担责任，从而激励诚实行为。


    问责制本身是分布式系统和密码学中一个众所周知的概念，已经应用于多种场景（参见，例如，[6]、[10]、[28]、[39]、[40]、[42]-[45]、[48]、[49]、[61]）。


    在区块链的背景下，问责制常被提及为一种理想属性[12]、[18]、[22]、[33]、[54]，一些关于区块链的研究论文在非正式层面上使用了问责制概念[14]、[34]。然而，至今尚不存在任何区块链或分布式账本的问责制形式化，更不用说形式化证明了（另见第7节）。


    因此，在这项工作中，我们提出并建议针对区块链的问责制进行形式化处理，并以一个非常突出的许可型区块链为例进行阐述（见下文）。由此，我们为设计和分析区块链提供了一种新的形式化方法。


    这种方法实际上与区块链的既定安全概念（如一致性）正交：这些安全概念[24]、[53]要求在某些假设下始终满足安全目标。例如，区块链应始终收敛到一致状态，通常基于基于轮的网络模型、最终消息传递和参与者诚实多数的假设。从这个意义上说，只要某些假设得到满足，安全性（例如一致性）就不会被破坏。在下文中，我们将此类安全概念称为严格安全概念。相比之下，基于问责的方法接受安全目标可能被违反。但是，在这种情况下，可以保证识别行为不当的各方，并正确地为其不当行为指责。我们的方法可以以两种方式使用：


    ### 问责作为独立属性。


    一方面，问责制是一个有趣的独立属性，可以用来代替严格安全概念以获得（不同的）安全保证。特别是对于许可型区块链，各方相互认识，并且通常基于合同协作，拥有这样的保证：如果某个核心安全目标失效，那么行为不当的各方可以被识别并追究责任，在许多情况下将被视为足够强的属性。如本文所示，并如下文详细说明，将问责制作为独立属性使用，允许构建新的安全区块链，这些区块链可以利用以下一个或多个特性：_(i)_
    与实现严格目标所需的组件相比，问责制可能已经可以使用更弱但更高效的组件来实现。例如，如我们的案例研究所示，可问责的区块链可以基于高效的崩溃容错共识协议构建，而不是更复杂的拜占庭容错共识协议，以提供关于一致性的问责制。也就是说，虽然行为不当的一方可以破坏一致性，但该方随后可以被识别并追究责任。(ii)
