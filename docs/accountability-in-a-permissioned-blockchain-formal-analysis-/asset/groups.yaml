    requires “auditors” to recalculate the full internal state of suspects. Hence,
    a simpler solution tailored specifically towards Fabric with Kafka and with less
    overhead is preferable. In particular, it should be possible to identify misbehaving
    parties solely based on blockchain data instead of requiring separate message
