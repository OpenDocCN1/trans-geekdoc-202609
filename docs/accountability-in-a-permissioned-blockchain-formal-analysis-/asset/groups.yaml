    接下来，我们简要回顾所有安全目标，并讨论它们对 Fabric 的适用性。


    一致性（也称为共同前缀）指出，诚实参与者的链共享一个共同前缀。一致性是区块链最基本的安全目标，因为它是获得共享全局（账本）状态的必要条件。


    链质量指出，链中由恶意矿工创建的区块百分比有上限。这一概念假设链中的每个块都有唯一的“创建者”，因此可以被视为诚实创建或恶意创建。然而，这对于 Fabric
    来说通常不成立，例如在使用 Kafka 时：所有排序节点都会为每个块 ID 创建并签署一个块。因此，链质量的目标不直接适用于 Fabric 的场景。从概念上讲，链质量主要用于公有区块链，以论证不存在交易审查，从而证明活性安全目标（见下文）。


    链增长指出，随着时间的推移，区块链将继续增长。这是使用最长链规则的区块链的必要目标。如果区块链停止增长，将允许例如 51% 攻击或长程攻击 [25]，攻击者试图通过创建比当前链更长的恶意分叉来覆盖链的某些历史。然而，由于在
    Fabric 中，对等节点仅扩展其链而不更改先前的块（这意味着所谓的最终性），Fabric 不易受到此类攻击的影响。


    活性指出，诚实客户端发送的交易最终将被包含在区块链中。活性显然是区块链的一个理想目标。


    其他安全目标。除了上述标准安全目标外，Fabric 的设计者还希望实现以下目标 [2]：（i）哈希链完整性大致指出，所有诚实对等节点共享相同的哈希链（根据
    Fabric 的块定义），（ii）无跳过指出诚实对等节点的链中没有间隙（即，对等节点链中的所有块都有顺序 ID），以及（iii）无创建指出诚实对等节点的链始终由
    Fabric 客户端发送（并签署）的交易组成。


    由于一致性是区块链最重要和最基本的安全目标，在我们的介绍中，我们专注于此目标。除了不直接适用于使用 Kafka 的 Fabric 的链质量外，我们的工作还涵盖了所有其他提到的目标（见附录
