    ## 2. Hyperledger Fabric


    Fabric 设计为 *分布式操作系统* [2]。类似于以太坊 [60]，Fabric 区块链允许分布式代码执行：Fabric 中的所有交易都是对存储在区块链中的代码的调用。Fabric
    不只有一个全局实例，而是有多个独立实例并行运行。每个实例都有自己的参与者集、链、代码、账本状态（由链派生）和参数，从而允许不同（组）公司运行各自独立的 Fabric
    区块链。此类实例称为 *通道*。Fabric 是一个可以使用不同共识算法实例化的框架。如前文在引言中所述，我们专注于使用 Kafka 的 Fabric。


    在本节中，我们首先独立于特定共识算法描述 Fabric 的一般和抽象协议。然后，我们解释基于 Apache Kafka 的共识机制作为共识算法的一个可能实例。在我们对
    Fabric 的描述中，我们遵循 Androulaki 等人 [2] 对 Fabric 的术语和表述，这与 Fabric 的 read-the-docs [32]
    略有不同。


    ### 2.1. Fabric 中的角色


    在 Fabric 中，所有参与者都有一个 *角色* 并被分配给一个 *组织*。可以将组织视为参与 Fabric 区块链的公司。核心角色如下：


    **成员服务提供者（MSP）** 提供对 Fabric 区块链的访问。更具体地说，MSP 向参与者颁发证书，其中包括参与者的角色、组织和公钥。


    **客户端** 发起交易。它们通常从最终用户处获取交易输入。类似于其他区块链，客户端不保存链的副本。


    **背书节点或节点** 本质上是 Fabric 的“矿工”和“全节点”。它们执行来自客户端的交易。它们还验证和复制链，即，它们保存完整 Fabric 链的副本并允许客户端从链中查询数据。


    排序服务是 Fabric 中提供“共识服务”的抽象概念。排序服务通常通过分布式协议实例化，可能使用多个不同的子角色，但也可以通过单个集中式机器实现（参见 Solo
    排序服务 [30]）。与其他区块链相比，这是主要区别之一。借助此服务，共识与交易执行被分离，并建立了 _执行-排序-验证架构_。来自客户端的交易首先由（部分或全部）节点执行；之后，交易和执行结果由客户端转发给排序服务。排序服务从传入的交易中形成区块，而不重新执行交易或检查有效性。然后，该服务将区块分发给所有节点。


    除了这四个核心角色（MSP、客户端、节点、排序服务）之外，Fabric 中还有一些额外的（子）角色，即管理员、主节点、锚节点和提交节点。管理员被允许，例如，更新智能合约和添加组织。各种节点类型描述了具有特定任务的不同节点。例如，主节点直接从排序服务接收区块，然后将这些区块分发给其他节点。虽然，为了表述的简洁性，我们将所有节点子角色归纳为单个节点角色并省略管理员，但当考虑这些（子）角色时，我们的所有结果也成立。


    ### 2.2. Fabric 协议


    我们现在详细描述 Fabric 协议，包括上述角色之间的精确交互。


    一组组织通过首先在外部就创世区块达成一致来创建新的 Fabric 通道。创世区块包含 Fabric 通道的初始设置，包括通道 ID、组织以及因此被允许访问该通道的参与者。为了表述的简洁性，我们还在创世区块中包含通道的初始状态、通道中可用的智能合约（即在
    Fabric 中称为 _链码_ 的确定性程序）以及每个链码的所谓背书策略；正式地说，所有这些信息也在外部达成一致，但将与创世区块分开安装。我们将在下面的协议描述中解释背书策略。


    接下来，我们通过跟踪交易从初始创建直到成为区块链一部分的路径，来说明 Fabric 协议的执行。图 1 描绘了相应的消息流。


    - 1. 交易提案。要与链交互，例如，从链中读取或更改存储在链中的状态，客户端通过发起交易提案来调用链码。提案包含客户端的身份、客户端想要调用的链码、链码调用的输入数据、序列号以及客户端对此数据的签名。对所有这些数据（不包括签名）的哈希值用作交易
    ID。客户端请求一部分节点执行其交易提案（参见图 1 中的 1）。链码的背书策略规定，除其他事项外，哪些节点和/或多少个节点必须执行提案。在分发提案后，客户端等待来自节点的执行结果，即所谓的背书。


    ![](img/872e73daae6737693dbc96d0b122ca30_3_0.png)


    图 1. 带有客户端 C、（背书）节点 P1、...、Pn 和排序服务 OS 的 Fabric 示例消息流。


    - 2. 交易背书。


