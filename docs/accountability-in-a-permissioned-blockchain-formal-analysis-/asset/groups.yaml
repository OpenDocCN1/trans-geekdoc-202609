    ## Appendix A. Adding Signatures to Kafka


    In this section, we detail our first change to Kafka for Fabric* that was briefly
    discussed in Section 3.3.


    Recall that, on the input side, a Kafka leader gets requests to add messages to
    the stream. On the output side, orderers and other Kafka brokers pull new messages
    from the Kafka leader. Now, for efficiency reasons, instead of having a Kafka
    leader sign each message it puts into the message stream, we use Merkle trees
    [50] as follows. The Kafka leader collects incoming messages until the first request
    for delivering new messages arrives. For all newly collected messages, the Kafka
    leader then orders and enumerates the messages, forms a Merkle tree with these
    messages, and signs the root of the tree. More specifically, the resulting messages
    are of the following form: (id, pid, msg, mr, mp, s) where id is the message ID
    (i.e., the counter of the enumeration), msg is the message payload (usually a
    transaction commitment), pid is the identity of the Kafka leader, mr is the root
    of the Merkle tree, mp is a Merkle proof that proves that (id,pid,msg) is a leaf
    of the Merkle tree with root mr, and s = Sign_{sk(pid)}(mr) is a signature of
    the root mr from pid. By this, only one signature is necessary for all messages
    in one Merkle tree. These messages are put into the message stream in the appropriate
    order and given to the entity who requested new messages. For messages that have
    already been ordered and delivered once before (and hence, for which a Merkle
    tree has already been formed), the leader simply reuses the messages that were
    sent before (including their Merkle root, Merkle proof, and signature).


    We note that we include the Merkle proof in every message since messages from
    the same Merkle tree might be part of multiple different blocks.


