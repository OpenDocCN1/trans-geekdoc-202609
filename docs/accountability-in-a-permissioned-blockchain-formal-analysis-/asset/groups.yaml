    # Modeling Corruption.


    The adversary $\mathcal{A}$ can dynamically corrupt any instance of $C, P, O$,
    and $\mathcal{K}$ during the execution of the protocol. Upon corruption, the adversary
    obtains full control over the corrupted instance, i.e., the instance acts as a
    message forwarder for the adversary. This, for example, allows for signing messages
    via $\mathcal{F}_{\text{sig}}$ in the name of the corrupted instance or reporting
    arbitrary data to the judge in the name of a corrupted peer.


    In the case of the roles $C, P$, and $O$, a corrupted instance models a single
    corrupted/malicious participant. In the case of $\mathcal{K}$, corruption models
    that the entity that runs the Kafka cluster is corrupted and hence no longer ensures
    correct operation. As mentioned before, the whole cluster is typically run by
    a single entity. This entity should be accountable for any errors produced by
    the Kafka cluster.


    The adversary may also dynamically corrupt arbitrary instances of $\mathcal{F}_{\text{sig}}$.
    If an instance of $\mathcal{F}_{\text{sig}}$ is corrupted, this allows the adversary
    to forge signatures in the name of the corrupted instance, modeling that the adversary
    gained access to the signing key. Because this allows the adversary to impersonate
    the participant that owns this key, we also consider an instance of $C, P$, or
    $O$ to be (implicitly) corrupted if the instance of $\mathcal{F}_{\text{sig}}$
    that is used for signing is corrupted. Similarly, we consider $\mathcal{K}$, which
    uses multiple instances of $\mathcal{F}_{\text{sig}}$ for multiple brokers, to
    be corrupted if at least one of these instances/signature keys is corrupted, again
    following the intuition that in this case the entity operating the Kafka cluster
    can no longer ensure correct operation.


    We do not allow corruption of $\mathcal{F}_{\text{init}}$, $RO$, or the judge
    $J$. $\mathcal{F}_{\text{init}}$ models trusted system parameters that all participants
    have externally agreed upon, as well as a trusted membership service provider;
    thus, $\mathcal{F}_{\text{init}}$ is a trusted component of the system. Similarly,
    $RO$ models a secure hash function. The judge $J$ is an abstract judging algorithm
    that identifies misbehaving participants. Such an algorithm must be run honestly
    to obtain meaningful results.


    # 5. Accountability


    Our formal definition of accountability w.r.t. consistency (and the other security
    goals mentioned in Section 3.1), presented in Section 6, is based on the generic
    accountability framework by Küsters et al. [43]. We now recall and slightly adapt
    this framework, starting with some intuition.


    # 5.1. Intuition


    In general, it is not necessary (or even possible) to penalize every type of misbehavior
    of a party. For example, a corrupted party might run different internal computations,
    which, however, yield outputs that are “as good” as outputs computed by an honest
    party. Instead, one wants to capture that if certain (crucial) security goals
    are violated in a protocol run, then one can hold some parties accountable for
    the violation. Such'
  - '[PAGE 9]


    goals can be, e.g., correctness of the output in runs of an MPC protocol [10]
    or correctness of election results [43]. In this work, among others, one main
    goal is consistency of blockchains, which, as mentioned, we formalize in Section
    6. Holding a party accountable is formalized via a so-called judge, as already
    mentioned in the previous section. A judge, also called a judging procedure, is
    a special algorithm that, throughout the protocol run, gathers data (evidence)
    from some or all of the participants and renders a verdict on a group of participants
    once it detects misbehavior. Intuitively, one requires that the judge renders
    a verdict once a goal is violated, and never blames a group where everyone was
    honestly following the protocol (these two properties are called completeness
    and fairness). In reality, such a judging algorithm can be used by protocol participants,
    external auditors, or real judges to determine misbehaving (groups of) parties.


    In the general version of accountability, a judge is allowed to blame a group
    of parties where it is not clear which exact party/parties misbehaved (fairness
    of the judge only guarantees that at least one person in that group was misbehaving).
    As already discussed in the introduction, this is too weak in practice, which
    is why we aim for individual accountability, as mentioned before.


    # 5.2. Formal Definition of Accountability


    We now formalize the intuition given in the previous section. While we follow
    the accountability framework from [43], we slightly adapt and extend the framework
    to (i) allow the judge to render a verdict at any point of a run (instead of only
    at the end of a run) and to (ii) work for dynamic corruption (instead of only
    static corruption).


    Let Q be a system of IITMs that includes a judge IITM J and let A be a set of
    participants (sometimes called agents). Typically, participants p ∈ A are interpreted
    as PIDs, and p usually corresponds to exactly one instance of a machine in a run
    of Q.


    A verdict of J is a boolean formula ψ built from propositions of the form dis(p)
    where p ∈ A. A proposition dis(p) of a judge expresses that p (supposedly) violated
    the protocol w.r.t. a goal. To illustrate verdicts, consider the following examples
    for p1, p2 ∈ A: If a judge renders the verdict dis(p1) \/ dis(p2), then he claims
    at least one of the parties p1, p2 has misbehaved; analogously, a verdict dis(p1)
    ∧ dis(p2) expresses the claim that both p1 and p2 misbehaved. We denote the set
    of all verdicts by V.


    The correctness of a verdict at some point in a run is defined as follows: Let
    ω be a run of Q and let [ω] be some point in the run w. We set dis(p) to true
    at point [ω] iff the party p exists and is corrupted at point [ω]. This is extended
    to verdicts (boolean formulas) in the obvious way. We write [ω] |= ψ to say that
    the verdict is true at [ω]; we write [ω] ≠ |= ψ otherwise.


    The “violation of a goal” of a protocol is formalized via properties of runs.
    Formally, a property α of a protocol Q is a subset of all runs of Q. Intuitively,
    α contains all runs of Q where the desired property is violated; for example,
    we later consider a property α that contains all runs where consistency of Fabric*
    is violated. Every property α is accompanied by a so-called accountability constraint,
    which formalizes minimal verdicts that are


    expected from the judge for runs in α. Such constraints can be used to specify,
    e.g., that a judge should render a verdict on at least one specific party of the
    protocol. Formally, an accountability constraint C of Q is of the form C := (α
    ⇒ ψ1 | ⋯ | ψk) where α is a property of Q and ψ1, ..., ψk ∈ V are one or more
    verdicts. Such a constraint says that J, in a run from α, should output a verdict
    ψ that (logically) implies at least one of the verdicts ψ1, ..., ψk. Note that
    the judge is allowed to render stronger verdicts or verdicts that imply multiple
    verdicts.


    We say that J ensures C in a run w of Q if either w ⊭ α or at some point of the
    run w the judge J states a verdict ψ that implies one of ψ1, ..., ψk.


    For example, for Fabric* we later consider an accountability constraint of the
    form C := (α ⇒ dis(p1) | ... | dis(pm)) | dis(pm) | ... | dis(o1) | ... | dis(or))
    for peers pi, orders oi, and the Kafka cluster K where α essentially contains
    all runs where consistency is violated. So C requires that if consistency is violated
    in a run, the judge has to blame at least one of the mentioned parties individually
    in that run; by the fairness property of accountability (see below) it is guaranteed
    that this party indeed misbehaved. More technically, for example, a verdict dis(o1)
    ∧ dis(K) from the judge meets the requirement of C as it implies dis(o1) as well
    as dis(K), i.e., there are two individual parties that are blamed. In contrast,
    a verdict dis(o1) \/ dis(K) would not be sufficient.


    An accountability constraint C = (α ⇒ ψ1 | ⋯ | ψk) is said to achieve individual
    accountability if for every i ∈ {1, ..., k} there exists an identity p such that
    ψi implies dis(p). In other words, each ψi, i ∈ {1, ..., k} determines at least
    one misbehaving party. Clearly, the example constraint above achieves individual
    accountability.


    A set Φ of accountability constraints for a system Q is called an accountability
    property of Q. We write Pr[Q(1^η) ⊨ ¬(J : Φ)] to denote the probability that the
    judge J does not ensure C for some C ∈ Φ in a run of Q(1^η), where the probability
    is taken over the random coins of the run and 1^η is the security parameter given
    to the IITMs. That is, intuitively, we would like to ensure all accountability
    constraints in Φ. Furthermore, we denote by Pr[Q(1^η) ⊨ {(J : ψ) | ψ ⊭}] the probability
    that the judge J states a verdict ψ at some point [ω] of a run of Q(1^η) such
    that [ω] ⊭ ψ, i.e., the judge renders a false verdict.


    **Definition 1** (Accountability)**.** _Let_ Q _be a system of IITMs that includes
    a judge J and let_ A _be a set of agents. Let_ Φ _be an accountability property
    of Q.

    We say that J ensures_ Φ_-accountability for_ Q _(or_ Q _is_ Φ_-accountable w.r.t.
    J) iff

    1. (fairness)_ Pr[Q(1^η) ⊨ {(J : ψ) | ψ ⊭}] _is negligible as a function in_ η_,
    and

    2. (completeness)_ Pr[Q(1^η) ⊨ ¬(J : Φ)] _is negligible as a function in_ η_._


