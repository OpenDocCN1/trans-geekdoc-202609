    证明思路。我们需要证明两个属性：公平性和完备性。


    ### 公平性。


    首先，我们证明法官 $J$ 在 $\mathcal{E} | \mathcal{A} | \mathbb{P}_\text{Fr}$ 的一次运行中不会做出错误裁决，即裁决必须评估为
    $\text{true}$（可忽略的运行集除外）。这主要源自第 6.2 节给出的推理，以及根据 $\mathcal{F}_\text{sig}$ 的定义，对手无法为诚实方伪造签名的事实。请注意，这里我们受益于块切割算法
    CUTBLOCK 的构造，它允许从包含在该块中的 Kafka 消息流中确定性地重新计算块。因此，来自诚实排序节点的所有块都将与法官的重新计算相同。因此，诚实的对等节点和排序节点不会被意外指责。


    然而，有一种特殊情况需要进一步关注：Kafka 集群不会直接对消息签名，而是构建一个 Merkle 树并对其根签名。因此，如果对手找到具有相同 Merkle
    根的不同消息体和 Merkle 证明，或者能够为相同消息体和 Merkle 根创建不同的 Merkle 证明，他可以重用诚实 Kafka 集群的签名来创建不一致的
    Kafka 流消息，从而导致错误裁决。然而，可以将这两种情况归约为随机预言机中的碰撞（参见，例如，[17]）。由于对于多项式时间系统，碰撞的概率只有可忽略的概率，法官做出错误裁决的概率最多为可忽略的概率。


    ### 完备性。


    我们需要证明，如果 $\mathcal{E} | \mathcal{A} | \mathbb{P}_\text{F}$ 的一次运行属于 $\alpha =
    \bigcup_{i=1}^4 \alpha_i$，那么法官 $J$ 做出的裁决至少会指责对等节点、排序节点或 Kafka 集群中的某一个。请注意，根据评判程序，法官的所有裁决都直接指责某个单一方或
    Kafka 集群。


    如第 6.2 节所述，如果运行在 $\bigcup_{i=1}^3 \alpha_i$ 中，则法官会注意到这一点并指责导致违规的对等节点。如果运行在 $\alpha_4$
    中，即在基本正确性成立的前提下违反了一致性，那么要么法官指责 Kafka 集群分发了不同的消息，要么我们知道一个冲突块中的 Kafka 消息流是另一个块的
    Kafka 消息流的（真）前缀。这基本上源自基本正确性（特别是，我们需要链中包含的 Kafka 消息流没有间隙）以及这是第一个不一致块 ID 的事实。因此，块不一致仅仅是因为它们在
    Kafka 消息流的不同点结束。根据 CUTBLOCK 的定义，两个排序节点都应该在相同的端点处切断流（因为它们同意相同的 Kafka 消息流前缀）。这意味着法官的最终检查至少对一个排序节点失败，该排序节点随后被指责。


    我们所有的安全结果均针对理想签名功能 $\mathcal{F}_\text{sig}$ 进行展示。在附录 D 中，我们表明如果将 $\mathcal{F}_\text{sig}$
    替换为其实现 $\mathcal{P}_\text{sig}$（参见 [46]），所有结果均可迁移，其中签名使用 EUF-CMA 安全签名方案（_选择消息攻击下的存在性不可伪造性_）进行。虽然此结果使用了
    $\mathcal{P}_\text{sig}$ 按通常 UC 意义实现 $\mathcal{F}_\text{sig}$（参见，例如，[46]），但该结果并不直接从
    UC 组合定理中得出。


    ## 7. 相关工作


    大多数关于区块链安全的既有文献（参见，例如，[8]、[9]、[11]、[19]、[24]、[35]、[36]、[53]）不使用问责制或密切相关的隐蔽对手概念
    [5]、[7]。虽然有几篇作品将问责制作为区块链的一个概念予以提及 [12]、[14]、[18]、[22]、[23]、[33]、[34]、[54]，但它们都没有形式化，更不用说证明问责制了。或许最接近我们工作的是
    Karame 等人 [34] 的工作，他们通过识别行为不当的各方来建议针对比特币双重支出的对策。虽然这项工作利用了问责制的基本直觉——即识别行为不当的参与者——来展示关于双重支出的正式陈述，但他们并未以正式方式使用问责制本身的概念。


    如第 3.3 节详细讨论的那样，Haeberlen 等人 [28] 引入了 PeerReview，以在任意（确定性）协议之上添加问责制。PeerReview
    有几个缺点，通常使得针对特定协议定制的解决方案更可取（参见第 3.3 节）。此外，Haeberlen 等人未为其系统提供正式的安全证明。


    ## 8. 结论


    本文提出了对（许可型）区块链和分布式账本问责制的正式处理。作为与严格安全概念正交的属性，一方面，问责制可以作为区块链和分布式账本的额外安全层。另一方面，作为一种独立的属性，问责制为分析和构建安全区块链和分布式账本开辟了替代且有趣的途径，这些途径基于其他（部分较弱）假设（例如，无最终消息传递和无诚实多数派）以及在某些方面更强的安全目标。


    我们通过对 Hyperledger Fabric（一个改进的实例）的严格分析，成功地说明了这种方法，Hyperledger Fabric 是工业界非常成功且广泛使用的区块链。除了对问责制的正式处理之外，鉴于该区块链的广泛应用，我们案例研究中获得的结果具有独立的意义。我们期望这种方法也能证明对分析广泛现有（许可型）区块链和分布式账本有用，例如基于
    Tendermint 的区块链 [1] 和 Corda [13]。


    总的来说，问责制的正式处理是一种强大的工具，为区块链（安全）研究开辟了新的选择。我们的方法还为形式化和证明许多区块链规范中常见的非正式问责主张提供了正式基础。


