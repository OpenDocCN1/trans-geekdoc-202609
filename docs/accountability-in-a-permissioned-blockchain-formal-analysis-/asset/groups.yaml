    The authors of Fabric want to achieve the goal of no creation. This is essentially
    a form of access control which states that, if a peer accepts a block, then all
    transactions in that block were sent by a client before. Since orderers in Fabric*
    must include all messages from the Kafka stream in their blocks, including transactions
    with potentially invalid signatures, the goal of no creation technically does
    not hold true for Fabric*. However, we can show that Fabric* provides accountability
