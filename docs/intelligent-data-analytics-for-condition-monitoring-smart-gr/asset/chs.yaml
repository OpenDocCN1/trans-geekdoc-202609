  \ 和 (C) MAPE。\n\n## 7. 结论\n\n一种新的 `DNN` 方法通过波特莱尔的 SRF 在多步中得到了验证，所提 `DNN` 模型能够处理线性以及非线性问题。SRF\
  \ 通过 `DNN` 递归地使用一步前（1-分钟）、两步前（2-分钟）、三步前（3-分钟）和四步前（4-分钟）进行预测，在 `4 分钟` 处完成。所提 `DNN`\
  \ 方法在多步预测中显示了其性能，`DNN` 结果优于 `ANN` 模型。\n\n# 参考文献\n\n1 Ritchie, M. Roser. 可再生能源。来自\
