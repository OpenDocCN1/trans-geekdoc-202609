  \n## 5. 案例研究：性能评估\n\n本部分的主要目的是展示所提方法获得的结果并进行简要说明。获得结果的解释根据在四个不同案例研究中进行的分析来进行。这些案例研究包括：(1)\
  \ 月度负荷预测、(2) 周负荷预测、(3) 日负荷预测以及 (4) 小时负荷预测。这四个案例研究是考虑了它们在电力系统中的独特应用，例如系统规划、维护调度、机组指令、经济负荷管理、`OPF`\
  \ 分析、自动发电等，如第 2 所述。本研究使用的数据集取自 2004–07 年，见表 9.5。每个案例研究的结果总结在表 9.6 中。表 9.6 中每个案例的\
  \ `MAPE` 值为该案例研究的平均值。每个案例研究的详细分析将在后续章节单独表示。\n\n表 9.5 用于基于 FQL 的 ELF FRL 模型形成的数据集。\n\
