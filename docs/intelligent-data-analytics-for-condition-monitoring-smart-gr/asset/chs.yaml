  \ 转换 HI 的 TI 失效阈值。\n\n在评估阈值后，进行了基于 ANN 的 RUL 估计，并对 5 号电池从循环 20、42、122、198 到 274\
  \ 的数据集进行了性能评估。RUL 预测准确性根据公式 (10.34–10.37) 进行评估，并列于表 10.3。为了更好的可视化，在图 10.30 中展示了一个案例的图形表示。\n\
  \n表 10.3\n案例研究 2：B#5 的 SELM-SSELM-USELM-RUL 模型性能评估。\n\n\n\n\n图 10.4 全球锂离子电池（LIBs）市场需求。\n\
  \n反复的充放电会逐渐损坏电池性能，并可能导致严重故障。例如，NASA 的机器人探测器（火星全球轨道探测器号）于 2006 年因电池故障而失效。\n\n在这方面，可以使用容量或内阻作为指标轻松进行健康评估和剩余寿命（RUL）估计。然而，这两个变量的在线测量非常困难。这是因为在运行条件下，传感器无法获取电池的内部状态变量，而且直接准确地测量内部参数成本很高，这使得利用这些参数进行在线状态监测失效。因此，从常用测量变量中非侵入式地提取能够反映在线模式下电池健康状况的健康指标已变得至关重要。\n\
  \n在本中，通过充放电状态测量提取健康指标（`HI`）。提取后，通过优化来增强提取的 `HI` 与电池实际健康状况之间的线性相关性。现在，使用转换后的 `HI`\
  \ 来发现健康状况而非实际状况，从而实现了对电池非侵入式的在线健康评估。\n\n本章的结构由四个部分组成：\n- 第 1 节代表研究的介绍和动机部分。\n- 第\
  \ 2 节解释了方法论部分，包括实验数据集收集、提出的方法框架、`HI` 提取及其性能评估方法、RUL 预测技术（`SELM`、`SSELM` 和 `USELM`）以及所提方法涉及的步骤。\n\
  - 第 3 节展示了所提方法所有步骤的结果、讨论和实验验证。\n- 第 4 节提供了研究的结论。\n\n## 2. 方法论\n\n## 2.1. 研究的数据收集\n\
  \n为了对所提方法进行实验验证，从 NASA 收集了锂离子电池数据集：\n1. **充电过程**：充电实验在恒流（`CC`）模式下以 `1.5 A` 进行，直到电池电压达到\
  \ `4.2 V`，然后继续恒压（`CV`）模式，直到充电电流下降到 `20 mA`。\n2. **放电过程**：放电实验在 `2 A` 的 `CC` 水平下进行，直到电池\
  \ `#5`–`#7` 和 `#18` 的电压分别下降到 `2.7`、`2.5`、`2.2` 和 `2.5 V`。\n3. **阻抗测量**：通过从 `0.1\
  \ Hz` 到 `5 kHz` 的 EIS 频率扫描进行阻抗实验。反复充放电实验会导致电池加速老化，而阻抗实验提供了随老化进行而变化的电池内部参数的洞察。\n\n\
  当电池达到寿命结束（`EOL`）标准时停止重复充放电操作，额定容量下降 30%（从 `2 Ah` 降至 `1.4 Ah`）。记录的数据集被用于 `HI` 提取和基于多\
  \ ELM 的 RUL 估计。充电和放电条件下的记录质量分别体现在 图 10.5–10.9 以及 图 10.10–10.14。\n\n![图 10.5 充电条件下的端电压随时间变化的图。](img/f10-05-9780323855105.jpg\
