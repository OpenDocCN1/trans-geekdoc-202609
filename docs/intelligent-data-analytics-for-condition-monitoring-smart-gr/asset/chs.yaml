- "# 状态监测智能数据分析：智能电网应用\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  # 编辑传记\n\n\nHasmat Malik 博士，BEARS，新加坡国立大学（NUS）校园大学城；印度德里 Netaji Subhas Institute\
  \ of Technology 仪器仪表与控制工程系\n\nHasmat Malik (SM’20) 在印度德里的 GGSIP 大学获得电气和电子工程学士学位，在印度希里马尔普拉什邦哈米尔普尔的国立理工学院\
  \ (`NIT`) 获得电气工程硕士学位，在印度德里的印度理工学院 (`IIT`) 获得电气工程博士学位。他是一位特许工程师和专业工程师。\n\n他自 2019\
  \ 年 1 月起担任新加坡国立大学（NUS）大学城 BEARS 的博士后研究，并在印度德里 Netaji Subhas 技术大学 (`NSUT`) 仪器仪表与控制工程系担任了多年助理教授。他组织了五场国际会议，其论文由\
  \ Springer Nature 出版。他是美国电气电子工程师学会 (`IEEE`) 高级、`ISTE`（印度技术教育协会）终身会员、`IETE`（电子与电信工程师协会）会员、`IAENG`（国际工程师协会，香港）会员、`ISRD`（伦敦国际研究协会）会员以及\
  \ `CSTA`（计算机科学协会）会员。\n\n他的兴趣领域是人工智能、机器学习和数据分析。Hasmat 博士广泛发表了他的研究成果。他在 `IEEE`、Springer\
  \ 和 Elsevier 发表/合著了 100 多篇研究论文、8 本书和 13 章。在使用此类信息或方法时，他们应该注意自身及他人的安全，包括他们负有专业责任的方。在法律允许范围内，出版者、作者、贡献者或编辑不对因产品责任、疏忽或其他原因导致的人或财产的任何伤害和/或损害，或因对本文材料中包含的任何方法、产品、说明或思想的任何使用或操作承担任何责任。\n\
  \n他是《智能与模糊系统》杂志的客座编辑（2018，影响因子 `1.85`）。他的博士工作获得了 `POSOCO` 电力系统奖 (`PPSA-2017`）。他在\
  \ `IEEE INDICON-2015` 获得优秀论文，并在 `SSD-2012`（德国）获得全额注册费。他指导过 23 名研究生。他参与了多个研发项目。他的主要研究领域是可再生能源、智能建筑与自动化、状态监测以及在线故障检测与诊断\
  \ (`FDD`) 的工智能、机器学习和大数据分析。\n\nNuzhat Fatema 博士，印度 Intelligent Prognostic Limited；马来西亚苏占扎阿丁大学（UniSZA）商业与管理学院\n\
  \nNuzhat Fatema 博士毕业于印度马哈哈施拉健康科学大学。她凭借自己的医学知识治愈了许多患者。随后，为了超越临床技能，她在德里国际健康管理学院 (`IIHMR`)\
  \ 获得了医院管理硕士学位。在这个平台上，她利用人工智能 (`AI`)、机器学习 (`ML`) 和数据分析，将她的临床技能与管理技能结合起来。她曾在印度国家考试委员会\
  \ (`NBE`) 研究助理。她合著了一本书，描述了一种通过使用不同国家标准药品说明书制成的用于复杂药物（如华法林）的无障碍工具。\n\n目前，她任职于 `Intelligent\
  \ Prognostic` 和苏占扎阿丁大学（UniSZA）商业与管理学院。她的兴趣领域是医疗保健、监测、预测、预测、检测和诊断中的 `AI`、`ML` 和智能数据分析应用，她认为这是一个数据驱动的世界，工业拥有大量的数据库，需要提取价值以便在诊断、管理和行业护理中做出更信息丰富、更准确的决策。仅仅通过分析任何数据来抛出数字是没有价值的；因此，她通过数据生成叙述来进行决策。\n\
  \n\n\n\nAtif Iqbal，英国 IET 会员，印度 IE 会员以及 IEEE 高级会员，IEEE 卡塔尔尔分会副主席，波兰 DSc 博士。他在电力工程领域拥有深厚的学术背景，曾担任\
  \ IEEE 卡塔尔尔分会副主席。他曾是 `IEEE ACCESS` 期刊的编辑，并担任 `IEEE Trans. on Industrial Electronics`\
  \ 的主编。他在阿利格尔大学担任教授，并担任 `IEEE Trans. on Industry` 的主编。他在卡塔尔尔大学担任教授，并担任 `IEEE Trans.\
  \ on Power Electronics` 的编辑。他曾获得 IEEE 卓越学者奖，并在卡塔尔尔大学获得电力工程学博士学位，在波兰格但斯克理工大学获得高级科学学位，并在利物浦大学完成了电力工程学科学学士和硕士学位。他在学术研究中展现了卓越的领导力，他曾曾在利物浦大学担任教授，在阿利格尔大学担任教授，并目前在卡塔尔尔大学担任教授。他在电力系统和相关领域发表了超过\
  \ 400 篇学术论文、40 本著作，并在多本国际期刊和会议上发表研究成果。他目前的研究领域涵盖智能电网、能源转型、电动汽车、分布式能源发电、能源安全以及多相电机驱动系统。\n\
  \n# 前言\n\n如今，所有领域都产生了海量数据。对这些数据进行智能且有意义的工程处理至关重要。数据分析是对原始数据进行分析，以得出结论并用于智能决策。数据分析在业务中对于提升性能、降低成本、分析行为和满意度以及提高盈利能力具有重要意义。同样，随着信息技术的发展，智能电网通过智能传感器和智能电表收集数据，并利用大数据分析进行分析。\n\
  \n本书的主题是智能电网背景下的数据分析。书中首先介绍了机器学习的特征、数据收集和存储，以展示实施先进数据分析的动机和潜在优势。智能电网是一个整合了所有连接用户（例如发电机、负载、消费者）以及可持续供应的电力系统网络。\n\
  \n本书包含 10 个不同的章节，讨论了智能电网领域机器学习和数据分析的基础知识。书分为两个主要部分：\n\n\n书的第一部分涵盖了数据分析在光伏诊断、变压器健康监测和感应电机故障中的应用。进一步阐述了电力系统电质量分析和输线路诊断的数据分析。第二部分说明了利用数据分析进行预测的问题。书中讨论了全球太阳辐射预测，以及风电数据预测。需求侧管理的负载预测在书中专门有一节。最后，数据分析用于电池充放电。在智能电网和健康监测领域的章节中，深入探讨了多种先进的人学习方法，如`深度卷积神经网络\
  \ (ConvNet/CNN)`、`模糊强化学习 (FRL)`、改进模糊 Q 学习 (MFQL)`、基因表达编程 (GEP)`、极端学习机 (ELM)`、半监督与无监督\
  \ ELM、近端支持向量机 (PSVM)`、深度神经网络、`长短期记忆网络 (LSTM)` 以及`深度神经网络 (DLNN)`。\n\n\n本章详细介绍了智能电网应用数据分析、业务数据分析、健康监测、数据及其关系、数据预处理、特征提取、特征选择以及不同的应用领域，并列出了广泛的软件和数据集列表。\n\
  \n本章提出了一种基于`ConvNet/CNN`算法的深度神经网络，用于光伏组件（PVM）的自动故障诊断，并定位互联光伏系统中的异常情况。所提出的 `DNN`\
  \ 模型对光伏组件进行在线诊断。在训练和测试阶段获得的结果显示了其在太阳能光伏组件故障方面的卓越性能。\n\n\n\n\n\n在本章中，提出了一种基于基因表达编程（`GEP`）的三相感动机电外部故障识别实用\
  \ `FDCA` 方法，并在公开的真实故障数据上进行了验证。该 `GEP` 方法使用三相电压和电流的 `RMS` 值作为输入变量，用于识别感动机电经历的六种外部故障及一种正常运行（`NF`）状态。`GEP`\
  \ 方法与人工神经网络（`ANN`）（即多层感知器神经网络-MLP）和支持向量机（`SVM`）技术进行了对比，结果表明 `GEP` 方法在分析精度方面优优，且计算需求较低。\n\
  \n\n在本章中，提出了一种新的电质扰动诊断（`PQDD`）方法，包括模型开发、实时数据生成、数据预处理、特征提取和特征选择。开发了 `EMD` 方法进行特征提取，获取的\
  \ `IMFs` 通过基于 `J48` 算法的决策树机器学习方法进行处理，该算法用于特征选择，并将所得结果与传统人工智能方法 `MLP-ANN` 进行比较。结果显示了所提方法的优越性。\n\
  \n\n如今，输电线路在线状态监测、故障检测与诊断（`FDD`）对于预测电网（`EPN`）的实际运行状态（`AOC`）至关重要。在本章中，制定了一种在在线运行场景下通过易于记录参数预测\
  \ `AOC` 的替代方法，为此，实施了基于 `EEMD`（集成经验模态分解）的 `PSVM`（近端支持向量机）方法，与其他人工智能方法相比，该方法具有极高的处理速度。结果表明，新提出的框架可以在不需要测量电流和电压信号以外其他参数的情况下有效评估\
  \ `AOC`。\n\n\n\n本章提出了一种基于 `DLNN` 的智能数据分析预测方法，用于多步预测（`MSA`）全球太阳能辐射（`GSR`），其中首先从印度气象部门收集了\
  \ 3 年（2015 年至 2017 年）的分钟记录数据，然后进行了包括数据清洗、缺失值填充的数据预处理。`DLNN` 方法与传统人工智能方法 `MLP-ANN`\
  \ 进行了比较。结果显示了所提方法的优越性，并可用于后续。\n\n\n在本章中，可再生能源（`RES`）发挥着重要作用。本章提出了基于 `LSTM`（长期记忆）的智能数据分析预测方法和改进的\
  \ `LSTM`（`mLSTM`）网络，用于多步预测（`MSA`）风速（`WS`）。开发的 `LSTM` 和 `mLSTM` 均显示出良好的风速预测能力，并适用于其他地点。\n\
  \n\n在本章中提出了一种能够预测未来 `24h` 的短期负载预测器，并使用来自 `GEFCom2012` 和 `GEFCom2014` 的实时历史数据进行了测试。在本章中，针对提前一个月、提前一周、提前一天和提前一小时进行了四种不同的案例研究。\n\
  \n\n在本章中，制定了一种在线运行场景下估计剩余寿命（`RUL`）的替代方法，该方法可以从易于记录的锂离子（`Li-ion`）电池（`LIB`）参数中提取 `RUL`。为了在定义的健康指标（`HI`）与电池容量之间建立线性关系，采用了幂变换方法，然后使用\
  \ `Pearson` 和 Spearman 级相关方法验证其性能。监督极端学习机（`SELM`）、半监督 ELM（`SSELM`）和无监督 ELM（`USELM`）通过使用提取的\
  \ `HI` 和转换后的 `HI` 来评估 `RUL`。这是首次尝试为 `LIBs` 的 `RUL` 估计实现 `SSELM` 和 `USELM`，以使系统在实时领域在线。\n\
