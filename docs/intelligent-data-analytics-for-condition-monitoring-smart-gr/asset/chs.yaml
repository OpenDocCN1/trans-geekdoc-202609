  \ Syst*. 2014;42(16):1849–1861. doi: 10.1080/15325008.2014.956952.\n\n\n\n\n随着电力需求的不断增加，维持技术变化世界的发展和增长速度挑战着电力行业提供高度侧重于负荷管理和优化的清洁能源。这导致了通过理解电力公用事业不同用户的需求模式，在满足服务端所有目标和标准的同时，实现负荷的最佳管理。需要计划性的努力使消费者的需求模式通用化，以最大限度地减少电质量（`PQ`）问题。这种前提使得\
  \ `PQ` 调查成为近期最核心的研究领域。`PQ` 的观点在客户和公用事业视角上存在差异。这一问题开启了电气建设的多个领域，从高功率电力电机到控制硬件和低功率半导体器件，成为控制公用事业、消费者、工业界、设备制造商和生产商关注的一个紧迫领域。\n\
  \n电力系统主要由三个子系统组成：发电、输电和配电。这三个子系统集成在一起，为各个终端的消费者提供不间断的电力。电力配电系统（`EPDS`）在整个电力系统中占据着重要位置。通常，`EPDS`\
  \ 的性能受到若干 `PQ` 问题的影响。一些 `PQ` 问题包括电压跌落、电压涌、中断、瞬态/振荡和谐波。\n\n为了理解电力系统中 `PQ` 监控的现状，需要进行全面的文献综述。分布式发电和输电在电力系统中起着重要作用，它似乎是可靠的，但也显示出一些技术问题。因此，这些传统的配电系统正在被许多发达国家的智能电网系统取代。智能电网包含了允许与其客户之间进行双向通信的数字技术，对传输线路各种特征的传感使得电网变得智能。电力公司通常面临管理其复杂网络进行\
  \ `PQ` 监控的挑战，并可以智能决策从原始数据中区分出有用的 `PQ` 数据。\n\n有多种标准用于直接和/间接解决 `PQ` 问题。其中此类标准包括：\n\
  - `IEEE-519`（电流、电压谐波标准）\n- `IEC-61000`（适用于电气和电子设备的 EMC 排放要求）\n- `IEEE-141`（工业植物配电标准）\n\
  - `IEEE-142`（工业和商业电力系统接地标准）\n- `IEEE-446`（工业和商业应用应急和备用电源系统标准）\n- `IEEE-493`（可靠工业和商业电力系统设计标准）\n\
  - `IEEE-1100`（敏感电子设备的电源和接地标准）\n- `IEEE-1159`（电质量监控标准）\n- `IEEE-1250`（对瞬时电压波动敏感设备的服务的标准）\n\
  - `IEEE-1346`（评估电力系统与电子过程设备兼容性的标准）。\n\n为了解决 `PQ` 问题，大多数行业正在实施几种传统方法。虽然传统方法在诊断、离线监控方面速度较慢，且提供基于时间的维护方案。因此，研究正转向实现基于人工智能（`AI`）/机器学习（`ML`）的方法用于电质量扰动（`PQD`）分析。这些方法大部分基于：(1)\
  \ 基于小波变换的 `PQD` 分析。\n\n上述提到的所有问题都可以通过使用 `ELM`（极端学习机）来解决。`ELM` 有三个主要优势：(1) 高准确性，(2)\
  \ 最少的用户干预以及(3) 实时学习（即在秒、毫秒、微秒级进行学习）。`ELM` 及其隐藏层不需要调优程序，其输出函数是广义 `SL`。整个研究组织如下：\n\
  1. 研究介绍表示在 `Section 1` 中。\n2. 模型形成及其描述表示在 `Section 2` 中。\n3. 所提的方法，包括 `Section 3.1`\
  \ 中的特征提取和 `Section 3.2` 中的特征选择。\n4. 结果与讨论在 `Section 4` 中。\n5. 结论在 `Section 5` 中。\n\
  \n## 2. 模型形成与描述\n\n为了演示所提的方法，在 `MATLAB` 平台上仿真了传输线路（`TL`），以便与其他部分互连。一条额定值为 `25 kV`、`50\
  \ Hz` 的 `20 km` 传输线路连接在源和负载之间。对于建模，使用了以下参数：\n\n1. 源侧参数：阻抗（`z`） = `5+j0.3` `Ω`。\n\
  - `R` = `0.002`\n- `L` = `0.08`\n- `V` = `25 kV`\n\n2. 负载侧参数：\n- `R` = `0.002`\n\
  - `L` = `0.08`\n- `V` = `600 V`\n- `active` = `10 kW`\n- `reactive` = `100 kV`\n\
  - 三相电容器组，其额定电压为 `600 V` 且无功功率为 `0.8 MW`。\n\n\n\n\n仿真的 TLM 如图图 5.1 所示，其中展示了五（5）种故障。在五种故障中，三种故障朝向源侧（即电压跌落、电压涌动、中断），两种故障朝向负载侧（即瞬态波和谐波）。为了从所提方法的演示角度出发，对仿真模型执行了六种运行工况（一种健康和五种故障），并进一步利用从六种仿真模式提取的信号进行后续研究。运行工况期间捕的信号已记录，并在图\
  \ 5.2 中以图表形式展示每种运行工况。从图 5.2 可以清楚地看出，与正常运行相比，故障运行工况期间信号中存在某些偏差和/或激励。因此，这些特征可以用于本章的进一步研究。图\
  \ 5.3 和 5.4 分别代表了记录的电流特征和电压特征之间的相关性。从这些图中可以清楚地得出，在不同的运行工况下，记录的信号之间具有高度相关性。最后，本节的图\
  \ 5.5 展示了每种运行工况（包括健康运行）的记录特征的能量评估。对于图 5.5，可以得出结论：谐波在系统中产生了大量的激励，因此这可能是对传输线路更危险的故障类型。除了谐波故障外，其他故障也引起了额外的能量消耗，这些消耗相对高于健康工况。因此，从图\
  \ 5.5 中得出的关键点是识别信号的行为，以便这些信号可以用于进一步的研究。\n\n![图 5.1 电力分配的 Simulink 模型。](img/f05-01-9780323855105.jpg)\n\
