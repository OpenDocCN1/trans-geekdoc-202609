  \ 和 PSVM 的输电线路故障诊断智能数据分析\n\n## 摘要\n输电线路的在线状态监测、故障检测与诊断（FDD）对于预测电网（`EPN`）的实际运行状态（`AOC`）是必要的。通常，基阻抗、行波和磁场法等传统方法被广泛用作\
  \ FDD 方法。然而，这些方法的实现并非易事，导致了高的分析成本。在本章中，提出了一种在在线运行场景下预测 `AOC` 的替代方法，该方法可以从易于记录的输电线路参数中识别\
  \ `AOC`。为此，本文实现了一种基于 `EEMD`（集合经验模态分解）的 `PSVM`（近端支持向量机）方法，与其他 AI 方法相比，该方法具有极高的处理速度。为了在模型性能与\
  \ `AOC` 之间建立线性关系，分析了多种思路。然后实现 `SVM` 以评估和验证所提框架的性能。结果表明，新提出的框架能够在除电流和电压信号外，不需要测量其他参数，即可有效地评估\
  \ `AOC`。\n\n## 关键词\n输电线路电力系统分类诊断 FDD 实际运行状态 `SVM` `PSVM` `EMD` `EEMD` `IMFs`\n\n\
