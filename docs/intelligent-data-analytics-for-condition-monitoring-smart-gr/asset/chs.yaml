  \n## 5. 提出的结构\n\n在本节中，基于 `DNN` 的太阳辐射预测模型所示于图 7.14。通常，`DNN` 包含两个部分：(1) 数据预处理和 (2)\
  \ `SRF`。训练和测试阶段总结为三个步骤：(1) `DNN` 初始化，(2) 训练以及 (3) 性能评估![图 7.14 太阳辐射预测 (SRF)。](img/f07-14-9780323855105.jpg)\n\
  \n图 7.14 太阳辐射预测 (SRF)。\n\n最初，`DNN` 使用 `RNN`（循环神经网络）开发（配置 `L` 为深度、`H` 为隐藏单元数、`B`\
  \ 为批量大小、`I` 为输入大小）。然后进行迭代，直到预测形式的 `RMSE` 降低，该损失可以通过公式 (7.1) 计算：\n\n```\nLoss|O_forecasted|\
  \ = sqrt(1/B · sum_{i=1}^{O} (O_forecasted - O_measured))²)\n```\n![image](img/B9780323855105000077-si1)\n\
  \n### 5.1 深度学习\n\n通常，深度学习 (`DL`) 是机器学习的一个分支。`DNN` 是 `MLP`（多层感知器）的升级版本。`DNN` 的主要区别在于使用了标准激活函数。`DL`\
  \ 的概念由 McCulloch 和 Pitts 在 1943 年以“控制论”的形式提出。利用 `DL` 的两个主要理由是：(1) 学习高度非线性关系，2) 学习不确定性。此外，`DL`\
  \ 的架构开发包括 `CNN`（卷积神经网络）、`DRBM`（深度玻尔兹曼机）、`DSA`（深度稀疏自动编码器）、`MLP`、`DRNN`（深度循环神经网络）等。`DRNN`\
  \ 的实现包括将 `RNN` 层堆叠到深度架构中。对于实现方法，读者可以参考图 7.15 具有多层结构的 RNN 详细架构。](images/f07-15-9780323855105.jpg)\n\
  \n图 7.15 具有多层结构的 RNN 详细架构。\n\n在图 7.14 中，`RNN` 用于将输入样本 `I` 映射到输出/目标 `O`，学习在每个时间时间步上执行，从\
  \ `t= 1` 到 `t= Γ`![image](img/B9780323855105000077-si2.svg)。对于 `t`，第 `l` 层神经元的参数通过使用给定的公式\
  \ (7.2) 更新共享状态：\n\n```\np1 = q[1] + ω · y1 + η[1] · I^(t)\n```\n其中，`yl = activationfunction(p[1)`![image](img/B9780323855105000077-si3.svg)\
  \ 对于 `l=1, 2, ..., N`![image](img/B9780323855105000077-si4.svg)\n\n\n\n\n\n性能评估是以性能指标的形式计算模型特征的过程，它展示了模型对\
  \ STFP 的能力，本研究中选了 MAE（平均绝对误差）、MAPE（平均绝对百分比误差）和 RMSE（均方根误差）。这些性能指标针对出的 `DNN` 模型计算如下：\n\
  \n$MAE = \\\\frac{1}{N}\\\\sum\\\\limits\\\\_{t = 1}^{K}\\\\left| {\\\\hat{f}(t)\
  \ - f\\_{h}(t)} \\\\right|$$\n\n![image](img/B9780323855105000077-si20.svg)(7.6)\
  \  \n\n$MAPE = \\\\left( {\\\\frac{1}{N}\\\\sum\\\\limits\\\\_{t = 1}^{K}\\\\left|\
  \ \\\\frac{\\\\hat{f}(t) - f\\_{h}(t)}{f\\_{h}(t)} \\\\right|} \\\\right) \\\\times\
  \ 100$\n\n![image](img/B9780323855105000077-si21.svg)(7.7) \n\n$RMSE = \\\\sqrt{\\\
  frac{1}{N}\\\\sum\\\\limits\\\\_{t = 1}^{K}\\\\left( {\\\\hat{f}(t) - f\\_{h}(t)}\
  \ \\\\right)^{2}}$\n\n![image](img/B9780323855105000077-si22.svg)(7.8) 其中，`f̂(t)`![image](img/B9780323855105000077-si23.svg)\
  \ 和 `fh`![image](img/B9780323855105000077-si24.svg) 分别是时间间隔 `k` 处的预测和历史太阳辐射，`K`\
  \ 是预测和历史数据样本的总数。\n\n## 6. 结果与讨论\n\n本部分代表了通过所提 `DNN` 模型获得的一步步前预测不同时间间隔的太阳辐射（SR）预测结果，预测最高至\
  \ 4 步。对于 SR 的每一步步前预测，对每个 `DNN` 模型评估了性能指标（MAE、MAPE 和 RMSE），一步步前预测的结果所示表 7.5。表 7.5\
  \ 显示了所提 `DNN` 模型的优越结果。然后，基于这些性能评估，`DNN` 模型被用于在相同数据集上以不同时间间隔预测两步前、三步前和四步前的 SR。在多步（-step）预测中，考虑了以下假设：一步前（1-分钟）、两步前（2-分钟）、三步前（3-分钟）和四步前（4-分钟）预测。`DNN`\
  \ 模型训练阶段的学习曲线表示在图 7.16，其中深蓝色和深橙色线条分别代表模型的训练（平滑）RMS 和损失函数。同样，浅蓝色和浅橙色线条分别代表模型的训练（输出）RMS\
