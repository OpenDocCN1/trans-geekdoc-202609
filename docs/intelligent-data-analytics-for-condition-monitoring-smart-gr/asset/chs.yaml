  \ Environ. Rev.`. 2018;19(1):13–30. doi:10.1504/IER.2018.089766.\n14. Yadav AK,\
  \ 等. 一基于减轻算法和模糊强化学习预测风速的新型混合方法。`Sustain. Energy Technol. Assess.`. 2021;43:100920;\
  \ doi:10.1016/j.seta.2020.100920: 出版中。\n\n\n\n\n\n锂离子电池 (LIB) 的在线健康评估对于预测此类基于电池的系统的剩余使用寿命\
  \ (`RUL`) 至关重要。通常情况下，电池的内阻 (`R`) 和容量 (`Ah`) 被用作健康识别特征（即健康指标-`HI`）。然而，`R` 和 `Ah`\
  \ 的测量并非易事，这导致了大量设备的使用和昂贵的分析成本。在本章中，制定了一种在线运行场景下估计 `RUL` 的替代方法，该方法可以从 `LIBs` 易记录的参数中提取\
  \ `RUL`。为了在公式化的 `HI` 与实际电池容量之间建立线性关系，应用了幂变换法，并使用 Pearson 和 Spearman 级相关方法来验证其性能。通过使用提取的\
  \ `HI` 和变换后的 `HI`，应用有监督极值学习机 (`SELM`)、半监督 ELM (`SSELM`) 和无监督 ELM (`USELM`) 来评估 `RUL`。这是首次尝试针对\
  \ `LIBs` 的 `RUL` 估计实现 `SSELM` 和 `USELM`，以使系统在实时领域实现在线。结果表明，新提出的方法在无需测量 `R` 和容量的情况下，评估电池健康状况是有效的。\n\
  \n## 关键词\n\n健康指标、剩余使用寿命 (`RUL`)、锂离子电池、Box-Cox 变换、人工神经网络、在线监控\n\n## 1. 引言\n\n电池被用于多个领域的能源和存储，例如电动汽车\
  \ (`EV`)、通信、导航、应急备用、航空等。根据全球专利报告，可以根据全球专利局在 2016–18 年期间公布的专利数量来分析电池储能系统研究的增长情况，如图\
  \ 10.1 所示所示。图 10.1 显示，电池领域的主要参与者仅来自三个地区，即美国专利商标局 (`US-PTO`)、欧洲专利局 (`EPO`)、中国专利局\
  \ (`CPO`) 以及世界其他地区。2016–18 年间，全球专利局已授予电池储能研发的 9856 项专利，其中 `CPO` 贡献的专利数量最多，约 43%，其次是\
  \ `US-PTO`（28%以上）和 `EPO`（6.3%以上）。亚洲地区申请了约 5368 项专利，其次是北美的约 2803 项专利。根据电池储能的技术增长，不同类型的发明每天都在进行，大量发明正向全球专利局申请。研究领域正在进行七种不同类型的电池储能发明，如图\
  \ 10.2 所示，例如 `DIB`（双离子电池）、`Li-S`（锂硫电池：`LSB`）、`Mg-Na`（镁基基电池：`MBB`）、`Na-Ion`（钠离子电池：`SIB`）、`K-Air`（钾空气电池：`PAB`）、`Ni-Zn`（镍锌电池：`NZB`）以及\
  \ `Al-Air`（铝空气电池（`AAB`））。因此，特定类型电池储能的使用取决于其不同类型的属性（即存储容量、成本、性能、安全性、充/放电、适用性和技术水平等），如图\
  \ 10.3 所示![image](img/f10-01-9780323855105.jpg)\n\n图 10.1 全球电池储能领域的区域公布专利![image](img/f10-02-9780323855105.jpg)\n\
  \n图 10.2 电池储能正在进行的新研究专利申请![image](img/f10-03-9780323855105.jpg)\n\n\n\n\n\n# 图 10.3\
  \ 电池化学体系不同属性的类型\n\n根据图 10.3，在不同的电池技术中，锂离子电池（LIB）因其优越的特性被应用于全球，这些特性包括长寿命、高能量密度、轻质、低自放电率、环保以及高输出电压![图\
  \ 10.4 全球锂电池市场需求\n\n反复的充放电条件会逐渐降低电池性能，并可能导致严重故障。例如，NASA 的机器人航天器（火星全球轨道飞行器）在 2006\
  \ 年因电池故障而失效。在这方面，可以使用容量或内阻作为指标轻松进行健康评估和剩余寿命（RUL）估计。然而，这两个变量的在线测量非常困难。这是因为在运行条件下，传感器无法获取电池的内部状态变量，且直接准确地测量内部参数成本极高，这使得利用这些参数进行在线状态监控变得无效。因此，从常用测量变量中非侵入式地提取健康指标变得非常重要，这些指标可以在在线模式下反映电池的健康状况。\n\
  \n在本章中，通过充放电状态测量提取健康指标（HI）。提取后，进行优化以增强所提取的 HI 与电池实际健康状况之间的线性相关性。现在，使用转换后的 HI 来寻找健康状况而非实际状况，从而能够非侵入式地评估电池的在线健康。\n\
  \n本章的结构由四部分组成。第一部分代表研究介绍介绍动机。第二部分介绍了方法论部分，包括实验数据集收集、所提方法的框架、HI 提取及其性能评估方法、RUL 预测技术（`SELM`、`SSELM`\
  \ 和 `USELM`）以及所提方法涉及的步骤。第三部分介绍了结果及其讨论，以及所提方法所有步骤的实验验证。最后，第四部分给出了研究结论。\n\n## 2. 方法论\n\
  \n### 2.1 研究数据收集\n\n为了对所提方法进行实验验证，从 NASA 收集了锂电池数据集：\n\n1. **充电过程**：在恒流（CC）模式下以 `1.5\
  \ A` 电进行充电实验，直到电池电压达到 `4.2 V`，然后继续在恒压（CV）模式下进行，直到充电电流降至 `20 mA`。\n2. **放电过程**：在\
  \ `2 A` 的 `CC` 水平下进行放电实验，直到电池 `#5`–#7 和 `#18` 的电池电压分别下降至 `2.7`、`2.5`、`2.2` 和 `2.5\
  \ V`。\n3. **阻抗测量**：通过从 `0.1 Hz` 到 `5 kHz` 的 `EIS` 频率扫描进行阻抗实验。\n\n反复充放电实验会导致电池加速老化，而阻抗实验提供了随老化进行而变化的电池内部参数的洞察。当电池达到寿命（EOL）标准时，停止反复充放电操作，该标准为额定容量下降\
  \ 30%（从 `2 Ah` 降到 `1.4 Ah`）。记录的数据集用于 HI 提取和基于多 ELM 的 RUL 估计。充电和放电条件下记录的质量分别表示在图\
  \ 10.5–10.9 和图 10.10–10.14 中。\n\n*   图 10.5：充电条件下的端电压随时间变化图。\n*   图 10.6：充电条件下的测量电流随时间变化图。\n\
  *   图 10.7：电池温度与时间的关系。\n*   图 10.8：充电条件下的输出电流随时间变化图。\n*   图 10.9：充电条件下的测量电压随时间变化图。\n\
  *   图 10.10：放电条件下的测量电压随时间变化图。\n*   图 10.11：放电条件下的电压随时间变化图。\n*   图 10.12：放电条件下的输出电流随时间变化图。\n\
  *   图 10.13：放电条件下的负载测量电流随时间变化图。\n*   图 10.14：放电条件下的温度随时间变化图。\n\n### 2.2 所提方法\n\n\
  图 10.15 展示了所提方法，包括 HI 提取及其性能评估方法、RUL 预测技术（`SELM`、`SSELM` 和 `USELM`）以及所提方法涉及的步骤。提取后，进行优化以增强所提取的\
  \ HI 与电池实际健康状况之间的线性相关性。为此，使用了 Box-Cox 转换（`BCTM`）来增强相关性，其性能通过 `Pearson` 相关方法进行了验证。\n\
  \n#### 2.2.1 HI 提取的公式\n\n对于锂电池的在线非侵入式健康评估，HI 属性应在运行场景期间易于获取。对于锂电池，充放电期间运行时间、温度和电流是容易测量的。因此，HI\
  \ 可以从充电和放电数据集中提取。分析图 10.10 后得出，该曲线与退化曲线非常相似。放电条件电压与电池容量衰减也具有物理意义。图 10.16：基于衰减的 RUL\
  \ 估计。\n\n```\nTI_{(i)}|_DVI = |T_{(i)DVmax - T_{(i)DVmin}|\n```\n其中，`T_{(i)DVmax`\
  \ = 高电压时间，`T_{(i)DVmin` = 低电压时间，`i` = 循环次数。\n\n现在， 168 个循环放电条件下计算出的这些 `TI` 向量公式化为：\n\
  \n```\nTI_Raw = [TI_{(1)},TI_{(2)},TI_{(3)},...,TI_{(i)}]^T\n```\n该向量公式 (10.2) 用于电池\
  \ RUL 评估的 HI。\n\n#### 2.2.1.2 使用 Box-Cox 转换进行 HI 优化及其参数识别\n\n从公式 (10.2) 向量得到的曲线具有电池容量相似的几何特征，但需要增强以提高它们之间的相关性。为此，通过\
  \ Box-Cox (`BC`) 转换进行 HI 优化。\n\n通常，Box-Cox 转换是一类幂变换。它将正态分布的数据集修改具有近似正态分布的数据。BC 在数学上表示为：\n\
  \n```\nTI_Raw(λ) = { \n  (TI_Raw^λ - 1) / λ if λ ≠ 0 \n  log(TI_Raw) if λ = 0 \n\
  }\n```\n\n\n\n\n\n$\\end{matrix} \\right.$ ¶ image(10.3) 其中，对数是指自然对数（以 $e$ 为底）。该算法要求找到使对数似然函数（LLF）最大的\
  \ $\\lambda$ 值。这里，使用 `R` 软件实现了 `BC`，然后通过 `PCA` 和 `SCA` 方法评估了 `HI` 与电池容量之间相关性的改进。`PCA`\
  \ 评估 `TI` 与容量之间的线性相关性（$r$）（线性关系），其值从 $+1$ 到 $-1$ 不变，且 $r = 1$、$r = 0$ 和 $r = -1$\
  \ 分别表示正线性相关、无线性相关和负线性相关。\n\n### 皮尔逊相关系数 ($r$):\n\n```\nr = \\frac{\\sum\\limits_{_{i\
  \ = 1}^{n}}{(TI_{i} - \\overline{TI})*(Ah_{i} - \\overline{Ah})}}{\\sqrt{\\sum\\\
  limits_{_{i = 1}^{n}}{(TI_{i} - \\overline{TI})}^{2}}\\sqrt{\\sum\\limits_{_{i =\
  \ 1}^{n}}{(Ah_{i} - \\overline{Ah})}^{2}}}\n```\n\nimage(10.4) 其中，`Ah` = 实际容量，$\\\
  overline{Ah}$ = `Ah` 的平均值。\n\n`SCA` 是一种使用单调函数（无论是否线性）的非参数等级相关测量。如果一个变量是另一个变量完美的单调函数，则完美的\
  \ `SCA` 用 $+1$ 或 $-1$ 表示。\n\n#### 2.2.1.3 HI 性能评估\n\n这里，`HI` 性能评估通过均方根（$0 \\leq\
  \ \\% RMSE \\leq 0.5$）和拟合程度（$0 < R^{2} \\leq 1$）进行，分别由公式 (10.5) 和公式 (10.6) 计算。\n\
  \n```\nRMSE = \\sqrt{\\frac{\\sum\\limits_{_{i = 1}^{n}}{(Ah - \\hat{Ah})}^{2}}{n}}\n\
  ```\nimage(10.5)\n\n```\nR^{2} = 1 - \\frac{\\sum\\limits_{_{i = 1}^{n}}{(Ah - \\\
  hat{Ah})}^{2}}{\\sum\\limits_{_{i = 1}^{n}}{(Ah - \\overline{Ah})}^{2}}\n```\nimage(10.6)\
  \ 其中，$\\hat{Ah}$ = 变换后的估计容量\n\n#### 2.2.2 使用多-ELM 进行 RUL 评估\n\n##### 2.2.2.1 RUL\
  \ 预测\n\n预测性维护策略的主要部分是找出设备的 `RUL`。`RUL` 是设备在维修/更换之前健康运行的时间长度。因此，通过估计 `RUL` 可以合理安排设备维护。通常，`LIB`\
  \ 的 `RUL` 可以通过模型驱动方法和数据驱动方法预测。基于数据驱动方法的估计 `RUL` 的常用方法/模型有：(1) 相似性模型，(2) 生存模型和 (3)\
  \ 退化模型，它们取决于不同类型数据集，例如：(1) 寿命数据，(2) 故障历史数据集和 (3) 特定状态已知阈值。\n\n##### 2.2.2.2 用于 RUL\
  \ 评估的 ELM 数学建模\n\n`ELM` 方法可以用于监督（有标签数据集）和无监督（无标签数据集）两类问题。对于有标签数据集，实现了标准的 `ELM` (`SELM`)\
  \ 方法；而对于无标签数据集，以简单的方法实现了无监督 `ELM` (`USELM`)，其类似于谱聚类 (`SC`) 和拉普拉斯特征映射 (`LE`)。然而，`USELM`\
  \ 可以在不评估特征向量的情况下处理任何数据。此外，如果数据集是有标签和无标签的混合混合，则实现半监督 `ELM` (`SSELM`)。`SSELM` 基于学习算法（即拉普拉斯正则化最小二乘-RLS、SVM-SVM、深度嵌入-DE、神经网络-NN）。`SELM`、`SSELM`\
  \ 和 `USEM` 的设计和实现基于参考文献。\n\n###### 2.2.2.2.1 SELM 的数学建模\n\n假设有有标签数据：\n\n```\n[S,T]\
  \ = [s_{i},t_{i}]_{i = 1}^{N}\n```\nimage(10.7) 其中 $s_{i} \\in \\mathbb{R}^{n_{i}}$，$t_{i}\
  \ \\in \\mathbb{R}^{n_{1}}$ 用于分类，$t_{i} \\in \\mathbb{R}^{n_{0}}$ 用于回归，$t_{i}$ =\
  \ 二进制向量。\n\n`SELM` 的训练过程包括以下两个通用步骤：\n\n步骤 1) 使用随机生成的神经元通过以下构建隐藏层：\n\nSigmoid 函数：\n\
  ```\nz(s,\\lambda) = \\frac{1}{1 - \\exp(-(a^{T}s + b))}\n```\nimage(10.8)\n\n高斯函数：\n\
  ```\nz(s,\\lambda) = \\exp(- b\\|s - a\\|)\n```\nimage(10.9) 其中，$\\lambda = [a,b]$\
  \ 且 $\\|\\cdot\\|$ = 欧范范。在 `SELM` 中，根据连续概率分布，映射函数的参数是随机生成的。在此步中，隐藏神经元将训练数据映射到 $n_{h}$\
  \ 特征空间并表示为：关于 $s_{i}$ 的隐藏层输出，\n\n```\nh(s_{i}) \\in \\mathbb{R}^{1 \\times n_{h}}\n\
  ```\nimage(10.10) 输出权重（用于连接隐藏层和输出层），\n\n```\n\\omega \\in \\mathbb{R}^{n_{h} \\\
  times n_{O}}\n```\nimage(10.11) 然后是网络的输出，\n\n```\nO(s_{i}) = h(s_{i})\\omega\n```\n\
  image(10.12)\n\n步骤 2) 通过最小化误差优化输出权重\n\n```\nmin_{\\omega \\in \\mathbb{R}^{n_{h}\
  \ \\times n_{O}}}\\frac{1}{2}\\|\\omega\\|^{2} + \\frac{C}{2}\\sum_{_{i = 1}^{N}}\\\
  |e_{i}\\|^{2}\n```\nimage(10.13) 满足，\n\n```\nh(s_{i})\\omega = t_{i}^{T} - e_{i}^{T}\n\
  ```\nimage(10.14) 其中，PART-1 = 防止过拟合的正则化项，$e_{i} \\in \\mathbb{R}^{n_{O}}$ = 第 $i$\
  \ 个训练样本的误差，$C$ = 惩罚因子。\n\n从目标函数中减去约束：\n\n```\nmin_{\\omega \\in \\mathbb{R}^{n_{h}\
  \ \\times n_{O}}}J_{ELM} = \\frac{1}{2}\\|\\omega\\|^{2} + \\frac{C}{2}\\sum_{_{i\
  \ = 1}^{N}}\\|e_{i}\\|^{2}\n```\nimage(10.15) 其中，\n\n```\nP = [h(s_{i}),....h(s_{N})]^T\
  \ \\in \\mathbb{R}^{N \\times n_{h}}\n```\nimage(10.16) 令 $J_{ELM}$ 对 $\\omega$\
  \ 的导数置零：\n\n```\n\\nabla J_{ELM} = \\omega + CP^{T}(T - P\\omega) = 0\n```\nimage(10.17)\
  \ 如果 $s > h_{n}$（即 $P$ 行大于列），公式 (10.15)：\n\n```\n\\omega^{*} = \\left( P^{T}P +\
  \ \\frac{L_{n_{h}}}{C} \\right)^{-1}P^{T}T\n```\nimage(10.18) 其中 $L_{n_{h}}$ = 单位矩阵。如果\
  \ $s < h_{n}$（即 $P$ 列大于行），公式 (10.15) 为：\n\n```\n\\omega^{*} = P^{T}\\left( PP^{T}\
  \ + \\frac{L_{n_{h}}}{C} \\right)^{-1}\n```\nimage(10.19) 其中，$\\beta + C(T - PP^{T})\
  \ = 0$ image(10.20) 因此，优化的输出权重 ($\\omega$) 根据训练样本数 ($s_{i}$) 和隐藏层神经元数 ($h_{n}$)\
  \ 使用公式 (10.18) 和 (10.19) 计算。\n\n###### 2.2.2.2.2 SSELM 的数学建模\n\nSSELM 有助于分析有标签和无标签数据集的混合数据。假设：\n\
  \n有标签数据集：\n```\n[S_{l},T_{l}] = [x_{i},t_{i}]_{i = 1}^{l}\n```\nimage(10.21)\n\n\
  无标签数据集：\n```\nS_{u} = [x_{i}]_{i = 1}^{l}\n```\nimage(10.22) 其中，$l$ = 有标签样本数，$u$\
  \ = 无标签样本数。在修改 SELM 公式 (10.19) 和 (10.20) 后，SSELM 可以表示为：\n\n```\n\\begin{array}{l}\n\
  \\min_{\\omega \\in \\mathbb{R}^{n_{h} \\times n_{O}}}\\frac{1}{2}\\|\\omega\\|^{2}\
  \ + \\frac{1}{2}C_{i}\\sum_{_{i = 1}^{l}}\\|e_{i}\\|^{2} + \\frac{\\lambda}{2}Tr(H^{T}JH)\
  \ \\\\\n{s.t., h(s_{i})\\omega = t_{i}^{T} - e_{i}^{T},\\, i = 1,..,l} \\\\\n{\\\
  , O_{i} = h(s_{i})\\omega,\\, i = 1,..,l + u}\n\\end{array}\n```\n\n\n\n\n\n\\\\\
  end{array} ¶ image(10.23) ¶ 其中，$J \\in \\mathbb{R}^{(l + u) \\times (l + u)}$= 从两类数据得到的图拉普拉斯矩阵，$H\
  \ \\in \\mathbb{R}^{(l + u) \\times n_{O}}$= 第 $i$ 行的输出矩阵 $o(s_{i})$，$\\lambda$=\
  \ 权衡参数 (TP)，$C_{i} = \\frac{C_{o}}{N_{t_{i}}}$= 惩罚因子，$C_{o}$= 参数（用户定义），$N_{t_{i}}$=\
  \ 训练样本。 ¶ 代入约束后，公式 (10.23) 表示：\n\n$$\\min\\limits\\_{\\omega \\in \\mathbb{R}^{n_{h}\
  \ \\times n_{O}}}\\frac{1}{2}{\\parallel \\omega \\parallel}^{2} + \\frac{1}{2}{\\\
  parallel {C^{\\frac{1}{2}}\\left( {\\overset{\\sim}{T} - P\\omega} \\right)} \\\
  parallel}^{2} + \\frac{\\lambda}{2}Tr\\left( {\\omega^{T}P^{T}JP\\omega} \\right)$$\n\
  \n¶ image(10.24) ¶ 其中，$\\overset{\\sim}{T} \\in \\mathbb{R}^{(l + u) \\times n_{O}}$=\
  \ 前 $l$ 行的增强训练目标 $\\sim T_{l}$（其余部分为零）。 ¶ 现在，公式 (10.24) 对 $\\omega$ 的值梯度为：\n\n$$\\\
  nabla J_{SSELM} = \\omega + P^{T}C\\left( {\\overset{\\sim}{T} - P\\omega} \\right)\
  \ + \\lambda.P^{T}JP\\omega$$\n\n¶ image(10.25) ¶ 当 $s > h_{n}$ 时，输出权重向量为：\n\n$$\\\
  omega^* = \\left( {L_{n_{h}} + P^{T}CP + \\lambda P^{T}JP} \\right)^{- 1}P^{T}C\\\
  overset{\\sim}{T}$$\n\n¶ image(10.26) ¶ 当 $s < h_{n}$ 时，输出权重向量为：\n\n$$\\omega^*\
  \ = P^{T}\\left( {L_{l + u} + CPP^{T} + \\lambda JPP^{T}} \\right)^{- 1}C\\overset{\\\
  sim}{T}$$\n\n¶ image(10.27)\n\n### 2.2.2.2.3. USELM 的数学建模\n\n再次假设有一个类似于公式 (10.22)\
  \ 的无标记数据集：$S = \\{[\\lbrack x_{i}]\\}_{i = 1}^{N}$。 那么 USELM 的公式为：\n\n$$\\min\\\
  limits\\_{\\omega \\in \\mathbb{R}^{n_{h} \\times n_{O}}}{\\parallel \\omega \\\
  parallel}^{2} + \\lambda Tr\\left( {\\omega^{T}P^{T}JP\\omega} \\right)$$\n\n¶ image(10.28)\
  \ ¶ 公式 (10.22) 可以表示为：\n\n$$\\begin{matrix}\n{\\min\\limits\\_{\\omega \\in \\mathbb{R}^{n_{h}\
  \ \\times n_{O}}}{\\parallel \\omega \\parallel}^{2} + \\lambda Tr\\left( {\\omega^{T}P^{T}JP\\\
  omega} \\right)} \\\\\n{\\\\, s.t.\\,{(P\\omega)^{T}P\\omega = L_{n_{O}}}\n\\end{matrix}$$\n\
  \n\n\n\n当 $s > h_{n}$ 时，输出权重向量为 $\\omega^* = [\\tilde{m}_{2},{\\tilde{m}_{3},..\\\
  tilde{m}_{n_{0} + 1}]$ 图(10.30)，其中，归一化特征向量 $\\tilde{m}_{i} = \\left. \\frac{\\tilde{m}_{i}}{P\\\
  tilde{m}_{i}} \\right., i = 2,3,...,n_{O} + 1$ 图(10.31)。\n\n当 $s < h_{n}$ 时，输出权重向量为\
  \ $\\omega^* = P^{T}[\\tilde{b}_{2},{\\tilde{b}_{3},..\\tilde{b}_{n_{O} + 1}]$ 图(10.32)，其中，归一化特征向量\
  \ $\\tilde{b}_{i} = \\left. \\frac{\\tilde{b}_{i}}{\\parallel {PP^{T}{{\\tilde{b}_{i}\
  \ \\parallel}}} \\right.,i = 2,3,...,n_{O} + 1$ 图(10.33)。\n\n### 2.2.2.3. RUL 性能分析\n\
  \n此处，基于 5 号电池放电数据集提取的健康指标（HI）设计了多 ELM-RUL 模型，并根据绝对误差（AE）、相对误差（RE）、平均绝对百分比误差（MAPE）和归一化均方根误差（NRMSE）对其性能进行了评估：\n\
  \n$AE_{RUL} = \\left| {A_{RUL} - P_{RUL}} \\right|$ 图(10.34)\n\n$RE_{RUL} = \\left.\
  \ \\frac{|A_{RUL} - P_{RUL}|}{A_{RUL}} \\right.$ 图(10.35)\n\n$MAPE_{RUL} = \\left(\
  \ \\frac{1}{n}\\sum\\limits_{i = 1}^{n}\\frac{|A_{RUL} - P_{RUL}|}{| A_{RUL}|} \\\
  right) \\times 100$ 图(10.36)\n\n$NRMSE_{RUL} = \\frac{RMSE_{RUL}}{mean}$ 图(10.37)\n\
  \n其中，$A_{RUL}$ = 实际剩余寿命（RUL），$P_{RUL}$ = 预测剩余寿命。\n\n### 3. 结果与讨论\n\n#### 3.1. HI\
