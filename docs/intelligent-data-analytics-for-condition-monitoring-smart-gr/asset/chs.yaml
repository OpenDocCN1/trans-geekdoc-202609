  \ \n\n## 3.2. 使用 ANN 进行 RUL 估计\n\n在分析了提取并归一化的 `HI` 后，对 NASA 电池数据集进行了 RUL（剩余寿命）评估。评估分为以下三个案例研究进行：\n\
  \n1. **案例研究 #1**：以原始 `HI` 为输入、电池容量为输出对模型进行 RUL 评估。该研究旨在验证提取的 `HI` 与电池容量之间的相关性。\n\
  2. **案例研究 #2**：以原始 `HI` 为输入、转换后的 `HI` 为输出对模型进行 RUL 评估。该研究旨在验证提取的 `HI` 框架的一致性。\n\
  3. **案例研究 #3**：以转换后的 `HI` 为输入、电池容量为输出对模型进行 RUL 评估。该研究旨在评估提取的 `HI` 框架在评估 RUL 方面的相似性。\n\
  \n现在已针对三个案例研究制定并测试了三个多-ELM-RUL 模型，经过适当的训练与测试阶段后，对 5 号电池从第 20、42、122、198 和 274 个循环的不同数据样本评估了\
  \ RUL。\n\n在预测 RUL 之前，计算了 `TI` 的失效阈值，对于 5 号电池，该阈值为额定容量从 2 Ah 衰减 1.4 Ah 的 30%。现在计算了\
  \ `BC` 转换后关于时间和循环数的失效阈值容量，分别为 `2518 s` 和 `124`，如图 10.26–10.29 所示。\n\n![图 10.26 使用\
  \ EOL 标准的失效循环估计。](img/f10-26-9780323855105.jpg \"fig:\")\n![图 10.27 阈值时间与失效循环估计。](img/f10-27-9780323855105.jpg\
  \ \"fig:\")\n![图 10.28 关于电池容量的 TI 失效阈值。](img/f10-28-9780323855105.jpg \"fig:\")\n\
  ![图 10.29 关于 BC 转换 HI 的 TI 失效阈值。](img/f10-29-9780323855105.jpg \"fig:\")\n\n在评估阈值后，进行了基于\
  \ ANN 的 RUL 估计，并对 5 号电池从第 20、42、122、198 和 274 个循环的不同数据集评估了模型性能。RUL 预测准确性根据公式（10.34–10.37）进行评估并并于表\
  \ 10.3 中。为了更好的可视化效果，图表表示形式展示在图 10.30 中。\n\n表 10.3\n\n###案例研究 #2：SELM-SSELM-RUL 模型\n\
  \n## 4. 结论\n\n在本章中提出了一种用于锂健康评估的新 `HI` 构建与转换方法。通过变换方法（命名为 Box-Cox 转换）的 `HI` 优化了提取的\
  \ `HI` 与电池容量之间的关系。随后，通过两种不同的方法验证了这种线性关系。此外，多 ELM 方法对提取、优化和转换的 `HI` 实现了 RUL 估计。在未来，该方法可以通过其他\
  \ `HI` 变量进行增强。此外，RUL 评估中最相关的 `HI` 变量选择尚需进一步分析。\n\n## 致谢\n\n本出版由卡塔尔大学的 M-CTENG-2020-2\
