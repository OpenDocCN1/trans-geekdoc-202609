  \ 分类为：\n\n`class(New) = sign(<omega, New> + b)`![image](img/B9780323855105000065-si91.svg)(6.4)\
  \ 其中，`New`![image](img/B9780323855105000065-si92.svg) 是用于分类的数据集。\n\n### 2.5. 近端支持向量机\
  \ (PSVM)\n\nPSVM 主要用于数据分类图 6.7 表示了 PSVM 实现的分步过程。PSVM 取为 $R^n$ 空间中的 $m$ 个数据点![image](img/B9780323855105000065-si93.svg)，使用两个矩阵表示矩阵\
  \ `Q` ($m\\times n$![image](img/B9780323855105000065-si94.svg)) 和对角矩阵 `G` ($m\\\
  times m$![image](img/B9780323855105000065-si95.svg))，带有 $\\pm1$ 标签。标签 $\\pm1$ 表示矩阵\
  \ `Q` 每行的类别。使用 PSVM 进行线性分类的数学实现如下步骤所示：\n\n*   步骤 1：将 M 表示为：\n\n\n\n\n\n![图 6.7 PSVM\
  \ 实现流程图](img/image(6.5))\n\n$M = G[Q - \\varepsilon]$\n\n其中 $\\varepsilon = m \\\
  times 1$ 是一个 1 向量，并使用不同的不同的 $\\mu$ 值计算 $\\eta$：\n\n$\\eta = \\mu\\left( {\\\\left(\
  \ {1 - M\\left( {\\\\frac{1}{\\\\mu} + M'M} \\right)^{- 1}} \\\\right)M'} \\\\right)\\\
  varepsilon$\n\n(6.6)\n\n或者 $\\eta$ 也可以计算为：\n\n$\\eta = \\mu \\ast \\left( {1 - \\\
  left( {M \\ast \\vartheta} \\right)} \\right)$\n\n(6.7)\n\n其中 $\\vartheta$ 表示为：\n\
  \n$\\vartheta = \\left( \\frac{speye\\left( {n + 1} \\right)}{\\mu + M' \\ast M}\
  \ \\right)\\backslash Y$ 且 $Y = \\sum(M)'$。\n\n$\\mu$ 的最优值根据专家经验决定，范围从 $10⁶$ 到 $0.01$\
  \ 不等。建议较大的 $\\mu$ 值对训练数据提供更好的拟合效果，通常 $\\mu = 1$ 时效果最佳。\n\n### 步骤 #2：计算 $(\\omega,\\\
  lambda)$\n\n$\\omega = Q' \\ast G\\eta; \\quad \\lambda = - \\varepsilon' \\ast\
  \ G\\eta; \\quad \\tau = \\left. \\eta/\\mu \\right.$\n\n(6.8)\n\n根据相对于原点的位置 ($\\\
  lambda$) 和方向 ($\\omega$)，在边界平面之间实现边间隔的最大化。\n\n### 步骤 #3：新的 $X_{new}$ 标记或未标记数据集分类如下：\n\
  \n$(X_{new}'\\omega - \\lambda) = \\left\\{ {\\\\begin{array}{l}\n{> 0,} \\\\\\\\\
  \n{< 0,} \\\\\\\\\n{= 0,} \\\\\\\\\n\\\\end{array}\\\\begin{array}{l}\n{\\\\, then}\
  \ \\\\\\\\\n{then} \\\\\\\\\n{then} \\\\\\\\\n\\\\end{array}} \\right.\\begin{array}{l}\n\
  {X_{new} \\in A + ; \\\\\\\\\n{X_{new} \\in A - ; \\\\\\\\\n{\\\\text{X_{new}} \\\
  \\in A + \\\\text{or } \\\\ \\\\text{X_{new}} \\\\in A - ; \\\\\\\\\n\\\\end{array}}$\n\
  \n\n\n\n在训练阶段正常运行后，使用未标记数据集进行测试。测试数据集的识别类别由等式 (6.10) 定义，该公式是 `\\lambda` 图像和 `\\\
  omega` 图像函数。\n\n```\nf(Xnew) = sign\\left( {\\omega' \\ast Xnew - \\lambda} \\right)\n\
  ```\n\n其中，如果 `f(Xnew)` 为负值，则数据集被分类为类别#1 $\\left( {A -} \\right)$；如果 `f(x)` 为正值，则数据集被分类为类别#2\
  \ (A +)。对于多个分类任务，随后组合使用了了多个二分类 PSVM 分类器。\n\n## 2.6 基于 SVM 和 PSVM 的输电线路故障分类模型形成\n\
  \n根据 2.1 节图 6.1 所示的建议方法，使用 `SVM` (TFDDS) 和 `PSVM` (TFDDP) 的输电线路故障检测与诊断模型分别如图 6.8\
  \ 和 6.9 所示。\n\n图 6.8 通过 10 个 `SVM` 模型进行分类的方法。\n\n图 6.9 通过 10 个 `PSVM` 模型进行分类的方法。\n\
  \n`TFDDS` 和 `TFDDP` 分别包含 10 个二分类 `SVM` 和 `PSVM` 分类器，用于分类 11 种状态，即健康状态（HI）和 10 种线路故障（F1–F10）（F1:LGAG,\
  \ F2:LGBG, F3:LGCG, F4:LLGABG, F5:LLGBCG, F6:LLCAG, F7:LLAB, F8:LLBC, F9:LLCA 以及\
  \ F10:LLLABC 场景）。\n\n在使用 10 个二分类分类器的 FDD 过程中，`SVM model#1`/`PSVM model#1` 使用全部 11\
  \ 种情况的完整数据集进行训练，以从 10 种故障状态（F1–F10）中区分出 HI 健康。为了表示 HI 状态，`model#1` 的输出表示 -1，否则为\
  \ 1。现在，利用故障数据集（F1–F10）训练二分类 `SVM model#2`/`PSVM model#2`，将接地故障（F1-F6）从短路故障（F7–F10）中分类出来。为了从“短路”中演示“接地故障”状态，`model#2`\
  \ 的输出表示 -1，否则为 1。现在，利用 F7–F10 的短路故障数据训练 `SVM modle#3`/`PSVM model#3`，将“F7–F9”故障从“F10”故障中分类出来。为了演示三相短路故障状态（F10），`SVM\
  \ model#3`/`PSVM model#3` 的输出表示 -1；对于 F7–F9 状态则为 1。随后，利用 F7–F9 故障的双地线短路故障数据集训练 `SVM\
  \ model#4`/`PSVM model#4`，将“F7 和 F8”故障从“F9”故障中分类出来。为了演示“F9”故障状态，`model#4` 的输出表示\
  \ -1，否则为 1。现在，利用“F7 和 F8”故障训练 `SVM model#5`/`PSVM model#5`，将“F7”故障从“F8”故障中分类出来。为了演示“F8”故障状态，`model#5`/`PSVM\
  \ model#5` 的输出表示 -1，否则为 1。通过这种方式，短路线路状态的 FDD 完成。\n\n现在对接地故障状态进行进一步分类，利用接地故障数据集（F1–F6）故障训练\
  \ `SVM model#6`/`PSVM model#6`，将“F1–F3（单相接地）”故障从“F4–F6（双相接地）”故障中分类出来。为了演示“F4–F6”故障状态，`model#6`/`PSVM\
  \ model#6` 的输出表示 -1，否则为 1。随后，利用 F4-F6 的地线故障数据集训练 `SVM model#7`/`PSVM model#7`，将“F6”故障从“(F4\
  \ 和 F5)”故障中分类出来。为了演示“F6”故障状态，`model#7`/`PSVM model#7` 的输出表示 -1，否则为 1。现在，利用 F4 和\
  \ F5 的故障数据集训练 `SVM model#8`/`PSVM model#8`，将“F5”故障从“F4”故障中分类出来。为了演示“F5”故障状态，`model#8`/`PSVM\
  \ model#8` 的输出表示 -1，否则为 1。随后，利用 F1-F3 的单相接地故障数据集训练 `SVM model#9`/`PSVM model#9`，将“F1\
  \ & F2”故障从“F3”故障状态中分类出来。为了指定“F3”故障状态，`model#9`/`PSVM model#9` 的输出表示 -1，否则为 1。最后，利用\
  \ F1 和 F2 数据集训练 `SVM model#10`/`PSVM model#10`，将“F1”故障从“F2”故障状态中分类出来。为了演示除“F1”之外的“F2”故障状态，`model#10`/PSVM\
