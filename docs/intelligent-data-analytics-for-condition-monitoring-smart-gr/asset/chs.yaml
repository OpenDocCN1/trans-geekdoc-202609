  \ 教授、印度德里理工学院的 Sukumar Mishra 教授、印度德里理工学院的 Bhim Singh 教授、印度德里理工学院的 B.K. Panigrahi\
  \ 教授、西班牙 UCLM 大的 Fausto Pedro García Márquez 教授、印度德里 Jamia Millia Islamia 大的 Majid\
  \ Jamil 教授、印度纳格普尔 Gaikwad Patil 学院集团的研究总监 D.P. Kothari 教授、印度 DTU 大的 Rizwan 博士、印度阿尔加尔穆斯林大学的\
  \ Imtiaz Ashraf 教授、印度阿尔加尔穆斯林大学的 M.S. Jamil Asghar 教授、印度阿尔加尔穆斯林大学的 Salman Hameed\
  \ 教授、印度斯里那格尔理工学院的 A.H. Bhat 教授、阿尔及利亚杰尔尔法大学的 Kouzou Abdellah 教授、波兰格但斯科技大学的 Jaroslaw\
  \ Guzinski 教授、澳大利亚维多利亚科技大学的 Akhtar Kalam 教授、印度斯里那格尔理工学院的 Mairaj Ud Din Mufti 教授、印度哈米尔普尔理工学院的\
  \ YR Sood 教授、印度德里 NSUT 大学院的 A.P. Mittal 教授、印度哈米尔普尔理工学院的 R.K Jarial 教授、印度 GGSIPU\
  \ 大学的 Rajesh Kumar 教授、印度印德多尔理工学院的 Anand Parey 教授、约旦阿尔-巴尔卡应用大学的 Jafar A. Alzubi 博士、沙特阿拉伯利雅得沙特大学的\
  \ Majed Alotaibi 博士，以及沙特阿拉伯马玛大学的 Abdulaziz Almutairi 博士。\n\n我们还想向我们的家人表达爱与感谢：Shagma（Atif\
  \ Iqbal 教授之妻）、Abuzar、Abubaker（Atif Iqbal 教授之子）、Noorin（Atif Iqbal 教授之女）。感谢 Zainub\
  \ Fatema 和 Ayesha Fatema（Hasmat Malik 博士和 Nuzhat Fatema 博士之女）对我们的深厚之情。\n\nHasmat\
  \ Malik 博士，新加坡/印度德里；Nuzhat Fatema 博士，新加坡/马来西亚 UniSZA；Atif Iqbal 教授，卡塔尔多哈。\n\n\n\n\
  # 第 1 章：机器学习与数据分析的进展\n\n## 摘要\n人工智能 (AI) 是机器表现出的智能。人工智能也是机器（如计算机）的表示，它为了学习和解决问题的目的，模仿与人类思维相关的认知行为/功能。此外，人工智能的一个子集是机器学习\
  \ (ML)，它通过经验自动提高。机器学习算法基于数据开发，不需要系统行为的显式信息。数据统计和计算分析是机器学习的子集。数据分析是一个针对有用信息对数据进行分析、清洗、转换和建模的过程。在本章中，详细研究了智能电网应用、业务数据分析、状态监测、数据及其关系、数据预处理、特征提取、特征选择以及不同的应用领域。还包含了一份广泛的软件和数据集数字库。\n\
  \n## 关键词\n特征提取 特征选择 数据预处理 可视化 状态监测 开源软件 数据来源\n\n## 1. 引言\n在现代电力世界，智能电网的实施正推动公用事业推进其电网，使得\
  \ `M2M`（机器机）和 `M2H`（机机）之间的区域通信变得现代化。有许多子系统级设备（例如 `PMU` 相位测量单元、能量管理系统、自动计量机制、仪表与控制等），它们之间或节点与节点之间通信。由于这种通信，电力网络在秒或微秒内会产生巨大的数据流，通过简单或传统方式处理如此数据量并非易事。这给专业人员带来了技术挑战，因为消息的时序、成帧和处理可能会变得复杂。此外，如果没有高效的数据处理机制，尝试接收新应用以执行工作将消耗许多小时。此外，新应用需要高性能能力和先进的处理机制来采取快速、正确的行动和决策。因此，如果该过程发生在运行网络上，可能会导致负面后果。为了解决前面提到的现实世界中的这类问题，机器学习和数据分析正成为工业界和大学的热门研究领域。这种流行是由互联网以及连接到智能电网的巨量\
  \ `IoTs`（物联网）设备驱动的，因为它们每秒产生海量数据，而正确理解这些大数据需要先进的机器学习和/或数据分析方法。此外，诸应用如 `VPP`（虚拟电厂）管理、`DSM`（需求侧管理）、`DER`（分布式能源）管理、预测、预测、`ESS`（储能系统）管理和\
  \ `EVs`（电动汽车）管理已广泛利用机器学习方法。\n\n### 1.1. 数据库分析简要信息\n\n\n\n\n\n在研究领域，数据分析对于技术商业化奠定现实世界的基础非常重要。因此，在进行研究时，数据分析对以下方面非常有用：(1)\
  \ 理解趋势并发现重大事件；(2) 时间、风险和回报的可见性；(3) 市场规模识别和客户人口统计背景分析。因此，对于任何领域的研究和/或，从宏观层面到微观层面的数据主要分为三类。这些数据是：(1)\
  \ 国家级数据；(2) 行业级数据；以及(3) 公司级数据。任何类型的数据都提供两个主要点，即统计和分析。因此，国家级数据提供人口统计、GDP、工资等统计形式的统计，以及分析类信息——经济分析、社会分析、政治和法律类分析。行业级数据提供统计类信息（如行业规模、品牌和市场份额等）和分析信息（如趋势分析、亮点、SWOT\
  \ 等）。最后，公司数据类似于微观数据，它也提供了关于统计（即财务数据、公司规模等）和分析（即 SWOT、新闻、第三方报告等）的信息。SWOT 被解释为关于数据或来自数据的信息的正面和负面符号的内部外部信息（如优势、劣势、机会和威胁等）。因此，IDA\
  \ 领域中有一个重要的术语称为“甜点（sweet spot）”，它告知了发明者所执行创新的精确位置/水平。这是可行性（即技术和环境）、渴望性（即社会、法律和政治）和生存性（从工业角度看经济）之间的共同点。因此，为了对任何创新进行数据库\
  \ IDA，创新者需要数据库。根据前面的说明，创新者需要国家级、行业级和公司级数据库进行进一步分析。在这方面，有一些收集的信息表示在表 1.6 的第 7 节中。\n\
  \n### 1.2 商业智能数据分析简述\n\n智能数据/大数据分析（IDA/IBDA）是一个利用数据而非物理参数或系统建模信息来利用系统和/或其相关子系统信息的过程。如今在物联网世界中，一切都在向\
  \ IBDA 发展，因此其在业务预测方面的市场价值已变得非常有价值且重要。通常，专家将 IDA/IBDA 市场分为两个大类，即：数据可视化与发现（DVD）和高级别分析（AAL）。这些领域的主要参与者/股东来自医疗保健行业、生物技术公司、保险部门、银行部门、零售部门、政府机构、国防及其关联公司等。IDA/IBDA\
  \ 为组织做出实时决策提供支持，并还提供公司的实时位置，以便组织增强业务。根据历史数据，IDA/IBDA 市场在 2017 年约为 85.4 亿美元，预计未来几年的复合年增长率（CAGR）将超过\
  \ 29%（约 406.亿美元）。在 DVD 方法和架构制定中，数据集成、数据转换（及分析）和可视化是主要的组件。各种类型的数据来自各种来源（例如机器数据：传感器、RFID、摄像头；运营数据；文件：Excel/CSV、网络、网页/社交/云端数据；基于应用的数据等），对这些数据进行集成并执行数据融合过程。在数据转换中，集成的数据为了进一步的应用视角被转换和/或解码。在数据转换中，分析后的数据以图表/模式的形式表示，使技术人员/经理受益。同样，AAL\
  \ 架构包括数据集成、数据建模、模型开发、模型优化和可视化。整个过程取决于 DVD 中提到的数据源。通常，市场分析以生命周期的形式进行，主要取决于两个要素：市场价值和时间间隔。市场价值从零到较高不等。而时间显示了技术增长的实际水平，如开发阶段、增长阶段、成熟阶段和衰退阶段。IDA/IBDA\
  \ 的市场价值根据市场的原因/地点而异。例如，在欧洲和美国，IDA/IBDA 处于增长水平，而非洲和拉丁洲的 IDA/IBDA 仅处于开发阶段。因此，在非洲、拉丁洲、亚洲、中东和欧洲部分地区\
  \ IDA 领域有很多选择。根据专家意见，与其他世界其他相比，亚太地区的市场增长非常快。IDA/IBDA 的收入主要取决于以下几个行业和服务领域：GFS、G&I、零售、电信、医疗保健与生命科学、业务服务、信息通信技术、制造业、媒体娱乐和其他。IDA/IBDA\
  \ 最高和最低份额分别来自 BFS 和媒体娱乐。此外，医疗保健与生命科学行业在收入份额方面大致处于中间位置。在由几个解决方案供应商主导的市场份额中，他们是`SAS`、`IBM`、`QLIK`、`Splunk`、`TIBCO`、`Tableau`、`FICO`、`对抗`、`SAP`和`Alteryx`等，其中`SAS`、`IBM`和`QLIK`是主要的市场参与者，占据了全球一半的市场份额。读者注意，本节介绍的信息是根据\
  \ Google 搜索获取的开放信息收集的。作者对 Google 搜索或任何搜索模式提供的错误信息不负责。\n\n### 1.3 智能电网智能数据分析简述\n\n\
  根据国际能源署（IEA）关于智能电网分析的报告 \\[ \n\n### 1.4 状态监测智能数据分析简述\n\n\n\n\n\n# 状态监控 (CM)\n\n\
  状态监控 (CM) 是一种监测系统、子系统和/或相关设备健康状况或方法。CM 可以通过任何类型的方法进行，例如基于物理的方法、基于模型的方法和数据驱动的方法。基于物理和基于模型的方法需要系统信息，而数据驱动方法则处理根据随时间变化的间隔采集的历史数据。通常，利用借助传感器生成的机械和/或电学数据用于机械的状态监控。\n\
  \n执行系统/子系统/其相关设备的 CM 监控有一些基本步骤，如下：\n1. 识别系统中的关键资产；\n2. 识别待监控的参数及其采样频率率；\n3. 确定合适的\
  \ CM 解决方案/方法；\n4. 在现场进行演示/安装 CM 解决方案；以及\n5. 将 CM 系统与系统中现有的维护方案集成。\n\n系统/机械的故障状态有一些基本的显著迹象。这些指标包括振动、噪声、热量、气味、烟雾以及最终的故障状态。因此，为了防止系统故障，进行高级水平的\
  \ CM 对于维护工程师来说并不是一项易事。\n\n通常，进行 CM 时会执行三种类型的维护场景（PdM：预测性维护，TBM：基于时间的维护/计划维护，以及 RM：反应性维护）。通常，故障迹象（即振动、噪声、热量、气味、烟雾以及最终的故障状态）属于\
  \ RM，它在系统损坏后才修复。但系统所有希望在损坏之前修复故障状态。在这种情况下，PdM 和 TBM 发挥着重要作用，从而在提高系统性能的同时降低维修成本。\n\
  \n工业利用了多种 CM 技术，例如：\n1. 基于振动的 CM；\n2. 基于润滑油分析的 CM；\n3. 基于热成像的 CM；以及\n4. 其他方法（MCSA：电机电流特征分析）。\n\
  \n根据市场调查这些 CM 方法的主要贡献按价值排序为：振动 CM、润滑油分析、热成像、MCSA。虽然基于振动的 CM 占据了超过 65% 的市场份额，但其分析成本高于\
  \ MCSA。自 2016 年以来，CM 服务市场非常良好，复合年增长率（CAGR）较高。\n\n根据欧洲地区的市场收入，德国位第一，其次是英国、意大利和法国。在亚太地区，中国位第一，其次是日本和印度。根据目前的统计，领先的服务提供商是\
  \ GE 测量控制，其次是 SKF、艾默森和罗克韦尔自动化。\n\n在 CM 领域启动 IDA/IBDA 为业务部分带来了巨大的市场收入。从 2000 年开始至今，IDA/IBDA\
  \ 分四个阶段：\n- 第一阶段位于 2000 年至 2005 年之间，与资产管理有关。\n- 第二阶段属于 2005 年至 2010 年的资产管理与数据报告。\n\
  - IDA/IBDA 和评估处于 2010 年至 2015 年的第三阶段。\n- 第四阶段属于 PdM 或预测分析，从 2015 年开始持续。\n\n此外，未来，示性分析（prescriptive\
  \ analytics）可能会出现，这将通过数字孪生技术实现。指示性分析主要关注设备状况的未来预测。在 CM 领域，将广泛的研究领域将能源监控、智能建筑监控、生产/工艺监控和环境监控。在能源监控中，来自智能电表的数据将用于\
  \ IDA/IBDA。在智能建筑监控领域，使用来自空调系统、锅炉、传感器等的数据。土壤、水、空气和排放数据监控属于环境监控。\n\n因此，有一些关键参与者在市场中占据重要地位：\n\
  - MCSA 领域的领先者是西门子，其次是 ABB、三菱和博世。\n- 热成像 CM 领域的领先者是 FLIR 系统，其次是福禄和日本电器。\n- 润滑油 CM\
  \ 领域的领先者是 Bureau Veritas、Intertek、SGS、Spectro、Parker、GE 和嘉拓。\n- 基于振动的 CM 领域的领先者是\
  \ GE、SKF、艾默森、罗克韦尔自动化和 Bruel & Kjaer。\n\n## 2. 数据及其关系\n\n根据 Raymond Wolfinger 的说法，在现代世界中，数据无处不在，它们以各种形式存在（例如文本、图片、视频、字符）。每种类型的数据可以是结构化或非结构化的形式。在智能网格\
  \ CM 中，使用了以下不同类型的数据：\n- 电气类型数据（即功率、电流、电压、频率）；\n- 机械类型数据（即制冷剂、温度、湿度、压力、换热率、冷却率、效率）；\n\
  - 可再生能源相关数据（即全球水平辐射、法向辐射、散射水平辐射、风速、风向、最大风速、空气温度、相对湿度、压力、降水量、露点温度、纬度、经度、海拔）；\n- 储能设备相关数据集（即充放电循环次数、电压、电流、内阻、安时、阻抗、温度）；\n\
  - 变压器相关数据（即溶解气体、呋喃分析、绝缘强度、金属颗粒计数、水分、功率因数、界面张力、酸值、呋喃、氧抑制剂、快速频率响应、直流电阻、绝缘损耗、红外相机基础、油位、接地电阻、油泄漏）；\n\
  - 其他类型的数据为 Web 和社交媒体、机器机器、交易、生物识别、人类产生的数据。\n\n大数据指的是数据的量、多样性和速度。市场中的 10 V 模型涵盖了模糊性（对大数据和工具含义的困惑）、可变性（数据源的动态演变行为）、场所（来自多个平台的分布式异构数据）、多样性（不同类型的数据）、速度（数据产生的速度）、词汇（描述数据结构的数据模型语义）、有效性（数据质量、治理、主数据管理）、真实性（数据准确性）和量（数据的大小）。\n\
  \n物联网正在迅速增加以使事物变得智能化和互联，因此传感器和数据量产生了海量的生成数据量，如图 1.1 所示。这些数据需要在设备、和服务和应用场景之间传输。在工业\
  \ 4.0 中，到 2020 年，连接的物联网设备将达到 501 亿。\n\n\n图 1.1 物联网设备的增长。NCTA 数据。\n\n## 3. 数据预处理\
  \ (DPP)\n\n\n\n\n\n数据预处理（DPP）是一种集成化数据分析（IDA）技术，涉及将采集的原始数据转换为可理解且可用的格式，以解决现实应用实施中的问题。现场记录的数据通常是不完整的、不一致的，和/或由于某些错误而偏离趋势和模式（例如：缺失值、峰值、数据非线性、`signal-to-noise\
  \ ration`等）。因此，数据处理是解决此类问题并增强数据与标签目标值之间相关性的有效方法。在`DP`方法中，主要遵循三种方法论，如下：(1)数据处理；(2)特征提取；(3)特征选择。\n\
  \n在数据处理方法（DPA）中，解决了若干与数据质量及其行为相关的问题，如数据清洗、数据转换、数据削减、数据集成以及的数据离散化。在数据清洗过程中，对数据进行处理以消除峰值并填充缺失值（如果有）。然后进行数据转换，以确保设备在考虑扰动负载条件的所有情况场景下的数据一致性。此后进行数据削减，将相似的数据重新排列为一组。然后通过合并多个数据集进行数据集成。此外，用于`DP`的不同基于\
  \ IA/机器学习的方法包括：单用户编程、多用户编程、实时处理、在线处理、共享处理和分布式处理。在`DP`之后，执行特征提取和特征选择程序，这些将在后续章节中进行解释。\n\
  \n## 3.1. 特征提取\n\n特征提取过程（FEP）包括减少输入变量/属性/资源的数量，以描述大量数据集的相似信息。在智能电网应用领域的 CM（监测）中，特征提取通过三种主要方法进行。这些方法是：(1)基于时域的特征提取（TDbFE）；(2)基于频域的特征提取（FDbFE）；以及(3)基于时频域的特征提取（TFDbFE）。所示的表\
