  \n\n\n### 3.2. 基于 WEKA 决策树进行最相关特征选择\n\n在本节中，使用基于 WEKA 的决策树选择最相关的特征，该算法是决策树的一种算法。最相关的输入部分是一个减少冗余属性的过程，使得模型的\
  \ PQDD 准确率可以达到满意的水平，同时可以减少计算负担。在本章中，实现了基于决策树的 J48 算法，以识别 PQDD 的最佳解决方案。J48 算法的详细数学实现首先通过基于\
  \ WEKA 的学习平台表示，获得的结果表示在表 5.1 中，该表展示了 J48 算法模型的性能。这里，使用 J48 算法开发了总模型（基于电流的三个模型和基于电压信号的三个模型）用于特征选择。基于电流\
  \ IMF（本征模态函数）开发的模型对 PQDD 具有最佳性能，该模型被用于该领域的特征选择。关于 J48 算法的详细分析，J48 算法的所有其他性能参数已列在表\
  \ 5.2–5.4 中，且其决策树的图形化表示所示图 5.14。[图 5.14]中的节点代表了所选的属性。J48 算法的主要优点在于它能够直接移除所有冗余变量，并以节点的形式呈现最相关的变量。\n\
