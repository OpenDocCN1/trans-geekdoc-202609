  \n## 6. 结论\n\n三相感应电机故障诊断和状态评估是电机旋转设备健康监测（CM）和故障诊断（FDD）领域最有价值的研究。`MCSA` 是诊断感应电机故障的一种有效方法。本研究利用实验室模拟的\
  \ 788 种模式和 900 个样本的公开数据库，提出了一种创新的感应电机故障诊断方法。为了开发一种准确一致的感应电机故障诊断方法，我们使用了 Rama Hammo\
