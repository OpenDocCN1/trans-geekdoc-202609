  \n\n\n近年来，由于负载预测在现代电力系统以及虚拟电厂（`VPP`）中的广泛应用（通过对 `ESS`（储能系统）、`DERs`（分布式能源）、`DSM`（需求侧管理）和\
  \ `EVs`（电动汽车）的实时分析），负载预测变得越来越重要。为了克服实时创建/生成的挑战，并确保在不同时间步（如年、月、周、日、小时等）的连续时间范围内实现准确、可靠且稳定的发电，提出了一种基于\
  \ `FRL`（模糊强化学习）的 `FQL`（模糊 Q-学习）先进智能模型。在本章中，介绍了一种能够预测未来 24 小时负载的短期负载预测器。该方法通过了从 `GEFCom2012`\
  \ 和 `GEFCom2014` 收集的实时历史数据进行测试，仿真结果显示其具有准确且非常令人满意的性能。本章针对一个月前、一周前、一天前和一小时前的负载预测进行了四项案例研究。该方法可以提前预测\
  \ 1 个月、1 周、1 天以及 1 小时的负载，结果在所有四项案例研究中均显示出高预测精度，且 `MAPE`（平均绝对百分比误差）处于接受范围内。\n\n##\
  \ 关键词\n\n预测 垂直电厂 模糊强化学习 数据分析\n\n## 1. 引言\n\n电力负载预测（`ELF`）是电力系统行业规划不可不可缺的程序，在电力调度和电力系统管理（`PSM`）中发挥着至关重要的作用。因此，前期的\
  \ `ELF` 在发电容量管理、调度、管理、削峰、市场评估等方面具有巨大价值。因此，根据时间跨度进行预测对于满足其应用的不同需求非常有用，如表 9.1 所示。\n\
  \n### 表 9.1\n基于时间跨度的预测机制的应用领域。\n\n| 时间跨度视角 | 应用领域 | 备注 |\n| --- | --- | --- |\n\
  | 1–10 年 | 电力系统规划（`PSP`） | 包括发电规划、网络规划和负载预测。`PSP` 的基本结构见图 9.1。 |\n| 1 周到 1 年 | 维护调度\
  \ | |\n| 1 分钟到 1 周 | 机组组态分析 | |\n| 经济负荷调度（`ELD`）和 `OPF` 分析 | | |\n| 自动发电控制 | | |\n\
  | 毫秒到秒 | 电力系统动态分析 | |\n| 纳秒到微秒 | 电力系统瞬态分析 | |\n\n![Figure 9.1 PSP 的基本结构。](img/f09-01-9780323855105.jpg)\n\
  图 9.1 PSP 的基本结构。\n\n通常，负载预测（`LF`）指的是预期的负载需求，通过系统程序以足够的定量方式定义未来的预期负载来计算。此外，`LF` 应用于以下场景：\n\
  1. 容量规划\n2. 网络规划\n3. 财务投资\n4. 预测\n5. 能源采购\n6. 供过剩\n7. 规划\n8. 系统调度\n9. 燃料组合\n10.\
  \ 燃料选择\n\n在电力系统运行（`PSOP`）中，`LF` 分三类：\n1. 长期预测（`LTF`）：20 年\n2. 中期预测（`MTF`）：1 周–1\
  \ 年\n3. 短期预测（`STF`）：1 小时–1 周\n\n`LTF` 在规划中起着基础作用。`MTF` 主要用于供应、维护和财务规划。`STF` 也用于发电机组、旋转备用和详细研究。\n\
  \n`LF` 有若干优点，包括：\n1. 确保电力可用性\n2. 避免容量过度利用\n3. 帮助充分利用容量\n4. 节省不必要的支出\n5. 防止经济增长的影响\n\
  \n尽管具有某些优点，但 `LF` 也存在一些不确定性：\n1. 未来需求\n2. 生产与分配\n3. 项目交付期\n4. 不是孤立的活动\n5. 国家政策与策略\n\
  6. 公众认知\n7. `DSM`（需求侧管理）\n8. 精确性\n9. 可能存在风险\n10. 随时可能变化\n\n因此，`LF` 取决于影响性能的若干因素：土地利用、城市规划、社区发展规划、替代能源、负载密度、人口增长、历史数据和地理因素。\n\
  \n因此，在负载结构的 `LTF` 中，使用了两类数据（历史数据与天气数据以及预测的外生变量）用于长 20 年的结果。用于 `LTF` 的关键建模技术是趋势分析、线性多元回归、部分终端使用法和若干场景方法。同样，在负载结构的\
  \ `STF` 中，使用了三类数据（历史负载与天气数据、来自 `SCADA`/传感器电表的实时负载数据、以及预测的外生变量）用于未来 24 小时或一周内的结果。用于\
  \ `STF` 的关键技术是时间序列分析（`AR`、`ARX`、`ARMA` 等）、多元线性回归和先进方法（如神经网络、模糊逻辑、`SVM` 等及其混合模式）。\n\
  \n因此，数字领域多项研究发表的广泛使用的电力 `LF` 模型汇总在第 3 节的图 9.2 中。近年来，该领域已实施了一些先进方法，以克服其他技术的缺点。\n\n\
  ![Figure 9.2 VPP 的高层架构表示。](img/f09-02-9780323855105.jpg)\n图 9.2 VPP 的高层架构表示。\n\n\
  \n\n\n\n本章由五个部分组成。第 1 节代表研究的引言部分，阐述了 ELF 的需求。第 2 节代表针对负荷预测（LF）的智能数据分析，包含了 LF 研究领域的市场价值和发明细节。在第\
  \ 3 节中，介绍了方法论，包括提出的方法、FRL 方法的简要细节以及用于演示的数据集。在第 4 节中，介绍了四个不同的 LF 案例研究，以证明所提方法的性能。最后，结论和未来展望在第\
  \ 5 节中给出。\n\n## 2. 负荷预测的智能数据分析\n\n在本节中介绍了两种类型的分析。第一种分析与市场增长、需求，以及 LF 在电力系统核心领域相对于市场需求和未来前景性研究的相互联系有关。第二种分析与\
  \ ELF 领域已发明的发明有关。这种分析对于识别负荷预测及其相关子区域/地区未来研究的绿色区域非常有用。在现代世界中，LF 是管理电厂的关键因素/属性。在最近的场景，出现了一个名为“虚拟电厂\
  \ (VPP)”的新术语，它是去中心化中规模发电单元的网络（例如太阳能园区、风电场、热电联产和储能系统等）。互联单元通过 VPP 的中央控制室进行调度。VPP\
  \ 的主要目标是通过智能分配来共享/缓解电网负荷，以管理并平滑峰值需求。大多数与 VPP 相关的先进工作来自欧洲地区，其未来市场价值很高，预计 2030 年约为\
  \ 4.7 亿美元，与 2019 年（约 7500 万美元）相比，复合年增长率 (CAGR)预计约为 18% 以上。最初，ESS（储能系统）和 DERs（分布式能源）是\
  \ VPP 的一部分，但现在更多四个子系统（DERs、ESS、DSM 需求侧管理和 EVs 电动汽车）是 VPP 的一部分，这使其更加可靠。VPP 的主要组件是硬件（例如\
  \ VPP 控制箱）、软件（例如 VPP 中央系统、软件维护和支持）以及其服务（例如 DR 相关的软件实施、能源交易）。VPP 的高层架构如图图 9.2 所示。从硬件角度来看，VPP\
  \ 系统的主要组件有：(1) DERs，(2) ESS，(3) 可控负荷和 (4) ICT（信息通信技术）。DERs 具有发电子系统和公用事业（RES：光伏、风能、水能等，以及非\
  \ RES：CHP、生物质、沼气、柴油、气体、燃料电池等）。通常，不同区域的发电能力为：(1) 住宅用：1–10 kW，(2) 工业用：>300 kW，以及 (3)\
  \ 商业用：50–300 kW。在 VPP 中，ESS 可用于用峰期并可能在用谷期存储。通常，ESS 容量为：(1) 住宅用：<5 kVA，(2) 工业用：>20\
  \ kVA，以及 (3) 商业用：5–20 kVA。VPP 的第三组件是可控负荷，即 DR 分析。最后，ICT 负责连接所有子系统及其关联设备形成 VPP，以便以系统的方式执行以下工作：(1)\
  \ 监控 GU 状态，(2) 预测，(3) 监控 GU 状态以及 (4) 等。VPP 是发明数量不断增加的重要标志，中国处于领先地位。应用趋势显示发明数量不断增加的显著迹，中国处于领先地位。\n\
  \nVPP 可如表 9.2 分类如下：(1) 本地 LVPP，(2) 区域 RVPP，以及 (3) 大规模 LSVPP。\n\n表 9.2 根据地理尺寸划分的\
  \ VPP 类型\n\n| 类型 | | | | |\n| :--- | :--- | :--- | :--- | :--- |\n| 类型#1 | | LSPP\
  \ 或 CVPP | 5–10 年内 |\n| | | | | |\n| 类型#2 | RVPP1 | RVPP2 | RVPPn | 3–5 年内 |\n|\
  \ | | | | |\n| 类型#3 | LVPP1 | LVPP2 | LVPPn | 当前状态 |\n| | 交易系统 | 平衡系统 | 网络支持 | |\n\
  \n![images/B9780323855105000090-t0015.png]\n\n在 ELF 的发明和创新研究领域，分析了从 2001 年到 19 年的数据。在分析中，每年申请的百分比与授予申请的数量对比在图\
  \ 9.3 中表示，显示授予率从 2015 年开始逐年下降。通常，ELF 领域三种类型的创新（即发明：~95% 以上，实用新型：~4% 以上，设计~0.01%\
  \ 以上）。这些创新的前十大国家按排名为：中国、日本、美国、韩国、德国、俄罗斯、EPO（欧洲专利局）、法国、WIPO（世界知识产权组织）和印度。前十大国家每年发明申请如图图\
  \ 9.4 所示。\n\n![images/f09-03-9780323855105.jpg]\n\n图 9.3 每年创新表示。\n\n![images/f09-04-9780323855105.jpg]\n\
  \n图 9.4 前十大国家发明申请表示。\n\n## 3. 时间序列负荷预测模型\n\n\n\n\n\n在本节中，对不同类型的负荷预测模型进行了详细分析，并根据模型的应用和创新部分如图\
  \ 9.5 所示进行了分类。通常，时间序列负荷预测模型分为三类：(1) 统计模型、（2) 人工智能（AI)/机器学习（ML）模型以及(3) 混合模型。\n\n\
  统计模型通常是基于一系列统计假设和假设的数学模型。这类模型代表了一个或多个随机属性与其他非随机属性之间的数学关系。在预测领域已经开发了多种统计模型，其中一些列如下：(1)\
  \ `AR`（自回归）模型,(2) `MA`（移动平均）模型,(3) `ARMA`（自回归移动平均）模型,(4) `ARIMA`（自回归整合移动平均）模型,(5)\
  \ `ARFIMA`（自回归分数整合移动平均）模型,(6) `SARIMA`（季节性自回归整合移动平均）模型,(7) `ARMAX`模型,(8) `ARIMAX`模型,(9)\
  \ `NAR`（非线性自回归）模型,(10) `NMA`（非线性移动平均）模型,(11) `TAR`（阈值自回归）模型,(12) `ARCH`（自回归条件异异）模型,(13)\
  \ `GARCH`（广义 ARCH）模型,(14) `EARCH`（指数广义 ARCH）模型,(15) Kalman filter 模型,(17) `ES`:指数平滑以及(18)\
  \ `GM`:灰色模型。这些统计模型进一步分为两大类：线性时间序列模型和非线性时间序列模型。\n\n![图 9.5 负荷预测模型。](img/f09-05-9780323855105.jpg)\n\
  \n图 9.5 负荷预测模型。\n\n除了统计模型外，还有几种 AI/机器学习模型及其组合机制（混合模型）。通常，传统的统计模型具有某些局限性，对于某些问题性能可能不尽如意。此外，传统方法容易产生高额计算负担，导致处理时间过长。因此，由于这些原因以及非线性数据集的特性，基于\
  \ AI/ML 的模型在这一研究领域出现。有许多 AI/ML 方法，例如：(1) `ANN`（人工神经网络）模型,(2) `SVM`（支持向量机）模型,(3)\
  \ `ELM`（极值学习）模型,(4) 模糊逻辑模型,(5) 小波模型,(6) `GA`（遗传算法）模型,(7) 专家系统,(8) `GEP`（基因表达编程）模型等。在数字领域，通过这些\
  \ AI/ML 模型也有广泛的应用。混合模型通常通过两个或多个 AI/ML 算法的结合/统一开发。示例包括：基于 `GA`、基于 `PSO`（粒子群优化）、基于\
  \ `ACO`（蚁群算法）、基于 `GP`（遗传编程）等。\n\n## 4. 方法论\n\n### 4.1. 提出的方法\n\n图 9.6 展示了使用基于 FQL\
  \ 的 FRL 方法进行负荷预测（LF）的提出的方法，该方法被开发为四个（4）部分：(1) 数据采集与传输，2) 数据处理部分，3) FRL 模型开发与训练部分，以及(4)\
  \ 模型测试与适应性检查。前两个部分包含 11 个基本步骤。第一部分包含三个步骤（即电表连接进行数据采集，然后通过网关传输数据），第二部分包含四个步骤（即处理阶段、输出阶段、数据存储阶段和相关数据识别）。数据集采集、数据预处理（去除尖峰和填充缺失值）、最相关变量选择、数据压缩以及六个不同的数据文件（即训练、测试、每周、每月预测文件）。训练数据文件用于\
  \ FRL 模型开发，开发的 FRL 模型根据历史数据集进行学习。训练阶段之后进行测试阶段以测试模型性能。如果测试阶段性能可以，则继续进行未标记数据文件的预测。因此，对模型进行了多次测试。\n\
  \n- 基于实时数据\n- 数据去峰并填充缺失值（如有）\n- 模型的自适应性\n\n![图 9.6 负荷预测模型](img/f09-06-9780323855105.jpg)\n\
  \n图 9.6 负荷预测模型\n\n### 4.2. FRL 简述\n\n基于 FQL 的 LFM（负荷预测）的实现在此给出，数值如下：\n\n- 步骤 1：根据\
  \ (9.1 匹配输入标签与 `α`\n- 步骤 2：`α[i] = (c[max] - c[min]) / σ`\n- 步骤 3：评估 `α` 与 `y`\n\
  - 步骤 4：执行 `α[i]`规则之间的关联\n- 步骤 5：选择最高的 `q` 值\n- 步骤 6：评估时差（TD）误差：`ΔQ = r + γ * V -\
  \ Q`\n- 步骤 7：使用 `γ` 作为折扣因子\n- 步骤 8：根据 (9.4 更新特定规则 `w(i, y)` 值\n- 步骤 9：降低探索率\n- 步骤\
  \ 10：估计成功率百分比\n\n\n\n\n\n- 步骤#11：再次重复步骤 1 到步骤 9，直到 q 值收敛，即 `Δq`→0!![image](img/B978032385510500090-si14.svg)\
  \ 或变为一个足够小的值。\n\n## 4.3. 数据收集\n\nELF 的历史数据已从 GEFCom2012 获取  \n\n表 9.3 2004–05 年统计健康检查表示。\
