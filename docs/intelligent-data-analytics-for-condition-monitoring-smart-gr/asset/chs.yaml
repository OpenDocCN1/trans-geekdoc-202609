  \ |\n\n## 3. 提议的框架形成\n\nWSFP 的提议框架形成包含以下操作：(1) 提议方法的形成、(2) 历史数据集收集、(3) 数据预处理、(4)\
  \ 特征提取、(5) 最相关特征选择、(6) LSTM 网络设计以及 (7) 性能衡量指标。所有这些操作将得到进一步介绍。\n\n### 3.1. 提议方法的形成\n\
  \n对于 WSFP，提议方法的形成已在图 8.2 中所示，包含三个主要部分：(1) 数据处理部分、(2) LSTM 模型设计与训练部分，以及 (3) 多步测试与适应性验证部分。前两个部分（`PART-1`\
  \ 和 `PART-2`）包含六个基本步骤，表示如下：`Part-1` 包含五个步骤，`Part-2` 包含一个步骤。数据集收集、数据预处理（峰值去除和缺失值填充）、特征提取、最相关特征/变量选择、数据降维以及四个不同的数据文件（即训练集-70%、测试集-10%、验证集-10%和预测文件-10%）的形成均包含在\
  \ `Part-1` 中。在第一步中，收集了来自站点的包含 13 个变量的历史记录气象数据集。现在，该数据集被排列成向量形式，作为属性选择技术中的输入变量。在选择了最合适的输入变量后，为不同的数据文件准备了数据。开发的全部四个数据文件彼此并不相似。训练数据文件用于\
  \ LSTM 模型的设计，开发的 LSTM 模型根据印度城市每分钟记录的数据集学习风速预测特性。在训练阶段之后，执行测试阶段以测试已训练模型的性能。如果测试阶段的性能可以接受，则使用验证数据文件再次测试模型。因此，通过使用不同的数据集（即测试、验证和预测数据集）对已训练的模型进行多次测试，以交叉检查模型性能。`LSTM`\
  \ 和 `mLSTM` 方法在已选择输入变量和未选择的情况下均已实现，将在后续节中进行说明![图 8.2 WSFP 的提议方法。](img/f08-02-9780323855105.jpg)\n\
  \n图 8.2 WSFP 的提议方法。\n\n### 3.2. 研究的数据集收集\n\n位于孟加拉湾的安达曼和尼科巴群岛南部的波特布莱尔（北纬 11.61，东经\
  \ 92.72，海拔 65m）站点被纳入本章的研究，如图 8.3 所示。波特布莱尔被海洋覆盖，具有巨大的太阳能潜力。在 2015 年、2016 年和 2017\
  \ 年，这里的平均风速分别为 3.75 m/s、3.7 m/s 和 4.1 m/s。此外，该地具有热带气候，降水显著。平均温度、湿度压力分别为 27.21°C、82.05%\
  \ 和 1003.52 hPa。根据历史记录，2015 年、2016 年和 2017 年的最大和最小风速分别为 10.5 m/s、18.8 m/s 和 11.3\
  \ m/s，如图 8.4 所示![图 8.3 波特布莱尔的位置。](img/f08-03-9780323855105.jpg)\n\n图 8.3 波特布莱尔的位置。\n\
  \n图 8.4 2015–17 年的历史风速（A 为最大风速，B 为平均风速）。\n\n来自印度气象部门的历史数据被用于学术。以 1 分钟为间隔收集了 11 个主要变量（即总辐射、直接辐射、散射辐射、风速、风向、温度、相对湿度、降水）。从\
  \ 2015 年 1 月 1 日到 2017 年 12 月 31 日的记录数据用于研究。记录数据的进一步分析见表 8.3、8.8 和 8.5，它们是 2015\
