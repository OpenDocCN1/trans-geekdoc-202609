  \n图 5.5 六种不同工况记录电流的能量幅表示。\n\n## 3. 提出的方法\n\n电力质量干扰诊断（PQDD）的方法如图图 5.6 所示，它由六（6）部分组成。这些部分是：(1)\
  \ 部分-1：模型建模，(2) 部分-2：数据集收集，(3) 部分-3：特征提取，(4) 部分-4：特征选择，(5) 部分-5：数据准备，以及 (6) 部分-6：智能分类器模型开发。在部分-1\
  \ 中，在 MATLAB 环境中仿真传输线路模型供后续使用，并与所有必要的电气设备连接。在部分-2 中，开发的模型在六种不同的运行工况下执行，以产生瞬时电流和电压数据。每个故障案例以及健康场景都进行了数据生成。然后将每种运行工况生成的数据集用于进一步研究。在部分-3\
  \ 中，实施了特征提取过程。在这里，实现了用于数据分解的 EMD（经验模态分解）技术，它生成 IMF（内蕴模态函数）的数量，这些 IMF 被作为分类器的输入参数。因此，关键点……是识别信号的行为，以便这些信号可以用于进一步的研究。\n\
  \n### 3.1. 使用 EMD 进行特征提取\n\nEMD 是一种先进的时频分解技术。它通常用于分解非平稳信号。IMF 的生成取决于两个属性：\n1. 局部极值、局部最小值和极大值的总数，零交叉点的总数。\n\
  2. 上包络和下包络的平均值为零。\n\n基于这两个条件，图 5.7 生成了 IMFs。\n\n![图 5.7 EMD 的实施步骤。](img/f05-07-9780323855105.jpg)\n\
  \n图 5.7 EMD 的实施步骤。\n\n为了更好地理解每个案例生成的所有 16 个 IMF 之间的差异，每个案例的能量幅展示在图 5.8–5.13 中，分别对应健康、瞬态、涌动、中断和谐波。分析这些图表后得出结论：每个故障工况以及健康工况的每个\
  \ IMF 之间都存在能量差异。此外，谐波案例中记录信号的能量幅最高，这是故障引起的。而健康案例的记录信号能量幅最低，这显示了每种记录信号之间的差异。因此，这些提取的特征将用于本章的进一步分析。\n\
