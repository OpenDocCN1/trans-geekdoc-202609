  \ |\n\n### 基于滤波的提取\n\n1. **解调**：信号的解调 (`DoS`) 包含三个基本步骤：(1) 通过带通滤波器，(2) 应用 `HHT`\
  \ (Hilbert-Huang 变换)，(3) 应用 `FFT` (快速傅里叶变换)。\n2. **Prony 方法**：Prony 模型类似于 AR, ARMA,\
  \ ARIMA 并对信号进行拟合。Prony $\\hat{y}(t) = \\sum\\limits_{i = 1}^{L}A_{i}e^{- \\sigma_{i}t}\\\
  cos(w_{i}t + \\varphi)$ ![image](img/B9780323855105000016-si47.svg), 其中 L = 衰减分量，`A[i]`\
  \ = 幅度，`w` = 角频率，`sigma` ![image](img/B9780323855105000016-si48.svg) = 衰减系数，`phi`\
  \ ![image](img/B9780323855105000016-si49.svg) = 相移。\n3. **自适应噪声消除 (ANC)**：ANC 去除波形的背景噪声。参考信号通过自适应滤波器后从原始信号\
  \ `y(t)` 中减去以误差信号。然后将误差信号反馈到自适应滤波器（调整滤波器）以最小化误差。\n\n### 表 1.2：智能电网应用 FDbFE 摘要\n\n\
