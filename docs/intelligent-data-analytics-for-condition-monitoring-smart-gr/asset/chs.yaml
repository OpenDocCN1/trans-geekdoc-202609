  \ | 2.6554 | 2.4634 | | |\n\n### 3.2 基因表达式编程 (GEP)\n基因表达式编程（GEP）是一种结合了遗传算法和程序合成的计算进化技术。它通过进化表达式树的形式来表示函数，能够自动发现复杂的数学模型。在本文中，我们利用\
  \ GEP 来构建电动机故障的诊断模型。\n\n## 4. 基于 GEP 的外部故障分类器\n\n### 4.1. 数据集：训练与测试\n\n\n\n\n\n\
  数据集中大多数相关的输入变量已如第 3.1 节所示进行了收集，我们将数据划分为两个子数据集：从 628 个案例中随机选择的作为训练集，剩余的 160 个作为测试集。所有\
  \ 788 个案例均已通过分析，所得的 7 类识别结果如表 4.2 所示。`GEP FDD`（故障检测与诊断）模型基于可用数据集实现，这些数据集在训练和测试阶段用作输入特征。\n\
  \n### 4.2 GEP 方法\n\n我们提出的方法有两个基本步骤，如图 4.5 所示：读取输入参数和实施改进。`GEP` 使用了实验室的模拟实验结果和参考文献中的公开在线数据集。![图\
