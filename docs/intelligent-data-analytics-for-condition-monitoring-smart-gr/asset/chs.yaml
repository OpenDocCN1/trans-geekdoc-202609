  \n## 3. PV 图像数据集收集\n\n在本节中，详细解释了数据的价值、实验设计、材料和方法。PVMF 分析的实验数据集由 Estefanía Alfaro-Mejía\
  \ 及其同事收集。\n\n![图 2.6 PVM 示意图。](img/f02-06-9780323855105.jpg)\n\n代表 PVM 的示意图，显示了具有\
  \ 9 × 4 个电池的三种状态的面板，如健康电池（白色）、蜗迹电池（橙色）和热斑电池（红色）故障。为了进一步研究，使用红外热相机拍摄了该模块的热图像。从实验设计的角度考虑，拍摄图像时遵循了以下假设：(1)为了测量天气状况，将辐射计放置在距离面板表面\
  \ 3 米处以测量天气参数；2) 辐照水平至少为 500 W/m²；3) 图像拍摄时间在上午 10:00–11:30 和下午 13:00–14:00 之间；4)\
  \ 风速在 3 到 5 m/s 之间；5) 环境温度范围在 26°C–30°C 之间；以及 (6) 无人机的位置距离面板最低侧 2 米，距离面板底部 2.3–2.7\
  \ 米。基于这些假设，共进行了七次实验，，获取了三种 PVM 状态的 277 张图像。\n\n\n\n蜗迹纹（snail tracks）缺陷通常可以通过肉眼可见。通常，这发生在组件板在现场安装后\
  \ 3 个月到 1 年之间。这取决于环境条件以及不同的季节。因此，在夏季，这种现象形成得很快。蜗迹纹的出现有几个原因，例如银线变色和/或正常的银线。但变色的银线产生蜗迹纹的可能性比正常银线更大。由于蜗迹纹的存在，面板的电导率沿着迹线降低。此外，这与电池的银浆无关。光伏组件模组中的高漏电流是由蜗迹纹引起的。此外，当旁路二极无法正常工作且无法限制受影响区域的反向电压时，PVM\
  \ 中会出现热点。\n\n## 4. 提议的方法\n\n图 2.7 显示了 PVMF 分析的提议方法，包含三个基本工作步骤：(1) A 部分：数据捕获和预处理，(2)\
  \ B 部分：`ConvNet/CNN` 模型设计，以及 (3) C 部分：多步测试和适应性。在 A 部分的第 1 步中创建了实验装置的形成，这是基于某些标准的假设，以确保生成的图像具有高分辨率。在第\
  \ 2 步中创建了三种不同条件的共 277 张图像。具有不同电池缺陷的不同类型 PVM 用不同的颜色表示，如图 2.6 所示。在第 3 步中，进行了数据预处理和图像选择。在此过程中，选择了正确的数据进行进一步研究。在第\
  \ 4 步中，创建了四种不同类型的数据文件，用于 `CNN` 模型的训练和测试阶段。B 部分与使用 `ConvNet/CNN` 算法设计 DNN 模型有关。在提议方法的\
  \ C 部分，执行了多步测试过程，以验证基于 `ConvNet/CNN` 的 `DNN` 模型对于 PVMF 分析和诊断的适应性。![图 2.7 PVMF 分析的提议方法示意图](img/f02-07-9780323855105.jpg)\n\
  \n图 2.7 PVMF 分析的提议方法示意图。\n\n## 5. 深度卷积神经网络 (ConvNet/CNN)\n\n在最近的研究领域，有几种用于深度神经网络（`DNN`）的训练算法，可用于各种研究领域。然而，如今\
  \ `AlexNet`、`GoogleNet`、`VGGNet` 和 `ResNet` 在创新/发明领域的大多数应用中被发现更频繁地使用 ![图 2.8 基于\
  \ `ConvNet/CNN` 的深度神经网络原理示意图](img/f02-08-9780323855105.jpg)\n\n图 2.8 基于 `ConvNet/CNN`\
  \ 的深度神经网络原理示意图。\n\n加载 `AlexNet`，并根据 PVMF 分析调整了最后三层，以提高网络的适用性。为了实现迁移学习，使用了 `MATLAB`\
  \ 软件 ![此网络的输入数据是大小为 227 × 227 × 3 像素的图像。根据第 3 节，考虑了三类 PVMF 分析进行诊断。如[第 3 节]所述获取的图像以\
  \ 227 × 227 × 3 的固定大小进行处理，以映射网络的输入大小。每种类型 PVMF 的一组图像（约 70%）作为网络输入的数据库，其中 30% 的图像用于模型性能的测试/验证。训练阶段选定的最优参数为：(1)\
  \ 权重学习率因子：20，(2) 偏置学习率因子：20，(3) 最小批量大小：120，(4) 最大迭代次数：1000，(5) 初始学习率：0.001，(6) 硬件资源：单\
  \ CPU，(7) 学习率调度：分段，(8) 每个 epoch 迭代：25，以及 (9) 验证频率 = 25 次迭代。\n\n## 6. 结果与讨论\n\n`ConvNet/CNN`\
  \ 是 `DNN` 广泛使用的工具。它通常是图像分类的适用工具，尽管也被用于其他领域。在 `ConvNet` 的实现中，每层都组织为从 3D 输入到 3D 输出。例如，PVMF\
  \ 图像输入，`ConvNet` 的第一层（输入层）馈入 3D 输入值，包括高度、宽度和 PVMF 图像颜色等 3D 维度，然后第一卷积层的神经元与这些 PVMF\
  \ 图像的区域连接，然后转换为 3D 输出。每个隐藏单元的神经元学习原始输入特征的非线性组合，这被称为激活，因为一层的输出是下一层的输入。最后，处理后的特征成为模型末端分类器的输入。（此处省略后续重复性描述，已根据要求处理逻辑）\n\
  \n\n\n\n# 第 3 章：基于改进模糊学习 (MFQL) 的变压器健康智能数据分析\n\n## 摘要\n在智能电网应用中，风电场的风机`WECS`风能转换系统）与风力发电变压器(`WTPT`)连接，这使得输出从数百伏增加到中压配电系统水平。风机连接变压器经常发生故障。因此，风电场的制造商和用户正努力寻找故障原因。故障的主要原因是连接变压器无法承受现场风机的严苛运行，并面临变负载负载、谐波和非正弦负载、变压器容量与电压波动、低电压(`LV`)故障、保护与安全、开关浪涌和瞬态过电压、损耗及产气等问题。因此，为了维护智能电网应用的健康，提出了一种基于改进模糊学习(`MFQL`)的变压器健康数据分析方法。该方法能够为系统提供状态监测、故障检测与诊断(`FDD`)信息，以便人员采取纠正措施或为设备计划`PdM`（预测性维护）。所提方法的性能分析表明其具有更好的性能。\n\
  \n## 关键词\n`MFQL`，故障分类，`DGA`，`WECS`，故障检测与诊断(`FDD`)\n\n## 1. 引言\n风能转换系统(`WECS`)的稳定性取决于其子系统和所有组件的可靠性。风力发电变压器(`WTPT`)是`WECS`所有组件中的关键部件，同时也是电力网络（即输电线路或配电网）的关键部件。如果`WTPT`在运行过程中发生任何灾难性故障，将降低`WECS`的性能和稳定性，或可能导致区域完全停电。`WTPT`的故障是一种经济损失，会导致放电故障和热故障等问题。为了确保电力系统的正常运行，必须对这些故障进行监测。根据`WECS`子组件的故障率统计，电力网络(`PTEPN`)中的变压器导致故障率高达\
  \ 9.92%，如图 3.1 所示，其故障率仅次于塔（12.38%）、齿箱（10.98%）和转子叶片（10.16%）。\n\n![图 3.1 WECS 子组件的故障率。](img/f03-01-978032385510500.jpg)\n\
  *图 3.1 WECS 子组件的故障率。*\n\n变压器故障的根源是机械应力、电应力和热应力，这些根源进一步分为两大大类，即：(1)内部故障（绕组损坏、过热、油中含有固体污染物、氧气、局部放电、潮湿和设计缺陷等）和(2)外部故障（雷击、绝缘老化、系统故障、绕组谐振、系统过载、系统切换、短路状态等），如图\
  \ 3.2 所示。这些根源通常产生于套筒、辅助设备、分接头变换器和主油箱中。\n\n![图 3.2 变压器故障的根源。](img/f03-02-978032385510500.jpg)\n\
  *图 3.2 变压器故障的根源。*\n\n![图 3.3 变压器早期阶段异常的原因。](img/f03-03-978032385510500.jpg)\n*图\
  \ 3.3 变压器早期阶段异常的原因。*\n\n通常，变压器内部因故障产生九种气体（`G1:CH4`、`G2:C2H6`、`G3:C2H4`、`G4:C2H2`、`G5:H2`、`G6:CO2`、`G7:CO`、`G8:O2`和`G9:N2`），例如`PDF`:局部放电故障、`AF`:电弧故障、`COF`:纤维素过热故障、`OOF`:油过热故障、`TDF`:热分解故障、`TF`:热故障、`HEDF`:高能量释放故障。其中一些溶解在油中（如`G1`–`G6`），另一些未溶解（`G7`–`G9`）。此外，`IEEE`和`IEC`提供的传统异常检测率并不准确，某些方法也缺乏健康状态识别能力。\n\
  \n## 2. 数据采集/来源\n### 2.1. 研究的数据集收集\n本研究利用了共 552 个`DGA`数据样本。每个案例的数据样本数量如下：`HC`有 31\
  \ 个样本，`z1-z3`有 83 个，`z4`有 85 个，`z5-z6`有 39 个，`z7`有 130 个，最后`z8`有 184 个样本。\n\n##\
