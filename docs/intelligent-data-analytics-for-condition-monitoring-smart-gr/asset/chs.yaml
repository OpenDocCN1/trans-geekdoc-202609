  \n\n\n\n\n针对电力变压器内部（PTiEPN）故障诊断（FDD）的所提方法如图图 3.4 所示，该方法包含两个部分。第一部分与数据集生成以及对生成数据集的预处理有关。在这里，从\
  \ PTiEPN 现场的油箱中采集油样品，并在实验室中使用称为`GDA analyzer`的溶解性气体分析（DGA）色谱分析仪进行测试。此处使用了美国的 `Kalman\
  \ Transport-X` 对油样品进行色谱分析。然后，将采集到的每个样品每个气体的`ppm`级数据用于所提方法中第二部分的后续处理。![图 3.4 变压器故障诊断模型实施的方法与策略。](img/f03-04-9780323855105.jpg)\n\
  \n图 3.4 变压器故障诊断模型实施的方法与策略。\n\n所提方法的第二部分与智能数据处理有关，属于使用人工智能/机器学习方法的智能数据分析。在这一部分，首先应用传统的\
  \ IEC/IEEE 方法，根据所采集的 552 个数据样本来检查解释能力。随后，实施 AI/机器学习方法进行进一步分析。在本研究中，首先设计并实现了`MFQL`，然后将其在\
  \ PTiEPN 异常检测中的性能与`ANN`方法进行比较。此地设计了`MLP`类型的`ANN`方法以验证所提方法的准确性。在本章中，进行了两类研究：(1) 未选择最相关变量；(2)\
  \ 选择了相关变量。最相关输入变量的选择过程被称为特征选择。因此，在本研究中，通过使用两种不同的特征选择方法——即`J48`算法和`PCA`方法——来选择特征。此外，在实施这两类分析（带特征选择和带特征选择）之前，针对直接来自\
  \ IEC/IEEE 方法的输入变量，对所提的`MFQL`方法和`MLP-ANN`方法的性能进行了分析。在获得所提方法的所有置信水平后，可以建议其用于在线现场实施。\n\
