  \ 个诊断模型和 PSVM 的 80 个诊断模型），使用了 8 个不同类别的输入变量，并评估了分类准确率以分析两种分类方法（SVM 和 PSVM）的分类兼容性。通过详细对比，得出结论：只有一个特定类别可以提供最佳结果，即基于\
  \ `category#6` 的 `PSVM` 模型，如图 6.13 所示。与 SVM 模型相比，基于 `PSVM` 的输电线故障诊断模型具有可接受的诊断准确率。\n\
  \n\n\n\n\n本章展示了利用基于 `PSVM` 和 `SVM` 的分类器，`EEMD` 数据分解技术在输电线路故障诊断中的优势。本研究共设计并实现了 160\
  \ 个智能分类器，其中 80 个分类器基于原始数据集，另外 80 个基于 `EEMD` 技术。将基于 `PSVM` 获取的八类不同类别（`category1`–`category8`）的结果与\
  \ `SVM` 的结果进行比较，显示了所提 `PSVM` 分类器的优越性。在处理时间方面，`PSVM` 也比 `SVM` 快，且模型参数的调优更容易。此外，开发、验证并测试了\
  \ `SVM` 和 `PSVM` 模型对输电线路中发生故障的分类。结果表明，`PSVM` 被证明是有效的，且与 `SVM` 相比，其训练/测试时间要短得多。对于未来展望，该方法适用于智能电网应用的在线、非侵入式\
  \ `FDD`，这将降低 `O&M` 成本并延长设备及系统的运行寿命。\n\n# 参考文献\n\n[1] Chen YQ, Fink O, Sansavini\
