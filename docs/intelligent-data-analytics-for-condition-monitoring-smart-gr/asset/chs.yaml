  \n\n\n\n\n本章提出了一种基于深度学习神经网络（DLNN）的智能数据分析预测方法，用于多步预测（MSA）全球太阳辐射（GSR）。在提出的方法中，首先从印度气象部门收集了\
  \ 3 年（2015–17 年期间）的分钟级记录数据，然后对数据进行预处理，包括数据清洗、缺失值填充和峰值消除。MSA 预测通过递归方式实现，即将首次预测的数据作为输入来生成下一个预测数据，该过程一直持续到第四级。为了实现所提方法的准确性，将评估结果与其他方法（人工神经网络-ANN）进行了比较，结果表明所提出的基于\
  \ DLNN 的预测方法具有优异性能，可以用于在线预测应用。\n\n## 关键词\n\n预测 太阳辐射 深度神经网络 光伏系统\n\n## 1. 引言\n\n\
  能源潜力如太阳能（SE）在减少包括 CO[2]水平在内的不利环境影响方面起着巨大作用。随着近期技术的发展、完善以及成本降低，太阳能无疑将提供未来的能源前景。预计到\
  \ 2040 年，约 60%的发电将来自可再生能源，这主要包括水电、生物质、地热、潮汐、波浪、氢燃料电池、泥炭等以外的太阳能和风能潜力。可再生能源在全球年度新增总量中的份额日益增长，2018\
  \ 年约占全球新增发电总额的 65%。太阳能的发电量日益增加，1965 年太阳能发电量为零，而 1990 年、2000 年、2010 年、2017 年和 2018\
  \ 年分别为 0.39、1.13、33.68、453.52 和 584.63 TWh 地理上，印度位于赤道和北回归线之间，具有不同的气候区并拥有巨大的太阳能 [太阳能发电取决于各种气候变量，这使得太阳能具有时间变化的间歇性。这给光伏发电能力造成了限制。此外，所有变量的测量本身并不是经济的程序，数据存储也是系统的负担。因此，为了太阳能发电评估进行太阳辐射（SR）预测是该领域的一种替代方法。此外，太阳光伏系统的优化选型和安装使太阳辐射成为太阳能研究中的重要参数。太阳辐射测量设备昂贵，因此在大多数气象站并不可用。此外，由于现有仪器精度较低，数据集中发现了记录缺失的情况。因此，迫切需要对这些地点的太阳辐射进行准确预测。光伏发电在印度面临许多问题，如不同场地的缺乏实测太阳辐射以及光伏系统的优化选型\
  \ [ 本研究的目标是开发一种高成本且高精度的模型，以利用太阳辐射信息进行光伏系统的安装和/或为发电量规划短期和长期目标。在本研究中，开发了基于深度神经网络（DNN）的太阳辐射短期预测模型。本章由七部分组成，包括[第\
  \ 1 节中的引言和第 2 节中的太阳辐射预测（SRFP）数据分析。第 3 节代表太阳辐照预测方法，第 4 节代表研究区域和研究使用的数据集。所提模型的结构在第\
  \ 5 节中所示，包含了 DNN 和所开发模型的性能评估指标。演示结果在第 6 节中显示，最后结论在第 7 节中给出。\n\n## 2. 太阳辐射预测预测（SRFP）数据分析\n\
  \n在本节中，利用多个数据库平台对太阳辐射预测和太阳辐射预报进行了与近期发明相关的数据分析。本章的所有分析均基于现有的开放数据库，尽管这不足以得出明确的结论和决策，但它可以帮助研究人员确定并确立\
  \ SRFP 领域更高级水平的研究目标。在这一分析中，展示了许多价值信息，如创新概、与地理区域相关的创新、可选的关键技术和方法、所有权分析、涉及的研究人员或发明者及其共同发明者的分析、重大发明、市场及其重要性分析、与发明相关的创新词，以及与太阳辐射预测相关的每项技术分析。针对\
  \ SRFP 近期研究领域的数据分析，分析了过去 20 年（2001 年至 2019 年以及 2020 年期间）的重点创新工作，展示了年度实际应用与授权申请的对比，如图\
  \ 7.1 所示。![图 7.1 发明新申请和授权申请数量。](img/f07-01-9780323855105.jpg)\n\n图 7.1 发明新申请和授权申请数量。\n\
  \n根据可用信息得出结论，大部分工作分为六类（即：不活跃、活跃、PCT 指定阶段、PCT 指定阶段过期、未确定和待处理申请）。通常，这些创新工作属于三种主要类型，即发明类型、设计类型和实用类型。此处以发明类型为主，占总发明的\
  \ 94%以上。此外，STFP 的可用创新工作来自 11 个主要来源（即中国、美国、日本、韩国、德国、俄罗斯、法国、EPO、WIPO、印度等）。与其他地区相比，印度的参与度微乎其微。此外，根据申请趋势（如图\
  \ 7.2 所示![图 7.2 SRFP 领域领先国家的发明趋势。](img/f07-02-9780323855105.jpg)\n\n图 7.2 SRFP 领域领先国家的发明趋势。\n\
  \n![图 7.3 SRFP 发明的中国省份。](img/f07-03-9780323855105.jpg)\n\n图 7.3 SRFP 发明的中国省份。\n\n\
  \n\n\n\n在 SRFP 领域，前 10 项关键技术对发明起着重要作用。广义而言，这些关键技术包括：(1) `KT1`:系统或方法，(2) `KT2`:管理，(3)\
  \ `KT3`:电路布局，(4) `KT4`:气象，(5) `KT5`:数据处理或方法，(6) `KT6`:生物模型，(7) `KT7`:控制与安全，(8) `KT8`:预测用途，(9)\
  \ `KT9`:网络状况，以及(10) `KT10`:电池或负载。\n\n这些 `KT` 的地理分布如图图 7.4 所示。根据 `KT` 数据分析，SRFP 发明的主要申请人如下：中国国家电网、日立有限公司、中国电力研究研究院、东芝芝股份、中国电力、三菱电气、淮海大学、华北电力学院、天津大学和积水化学（如图图\
  \ 7.5 所示）。此外，主要申请人的地理代表如图图 7.6 所示，这表明大多数关键发明来自中国。\n\n![图 7.4 KTs 的地理分布。](img/f07-04-9780323855105.jpg)\n\
