  图 7.6 主要公司的地理代表。\n\n从 SRFP 领域可用发明的数据分析中得的关键结论是：发明的市场价值非常高，且发明和实施的关键领土是中国，中国在该领域起着领导者作用。这种类型的数据分析对于未来规划以及根据行业参与者对正在进行的研究进行映射非常重要。\n\
  \n## 3. 太阳辐射预测方法\n\n太阳预测技术主要有三种：(1) 数值天气预报 (NWP) 方法；(2) 基于图像的方法；(3) 统计和机器学习 (ML)\
  \ 方法。第三类方法适用于广泛的时间跨度，因此在预测中变得非常流行。\n\n## 4. 研究使用的研究区域和数据集收集\n\n本章考虑了位于安达曼和尼科巴尔群岛南安达曼岛孟加湾波特布莱尔（纬度\
  \ [°N] 11.61，经度 [°E] 92.72，海拔 [m] 65）站点，如图图 7.7 所示。波特布莱尔被海洋环绕，全年具有巨大的太阳能潜力。这里全年的每日平均日照时数和光照时间分别为\
  \ 2.9 到 9.4 小时和 11.5 到 12.8 小时。此外，它属于热带气候，全年降雨显著。平均温度、湿度和压力分别为 27.21°C、82.05% 和\
  \ 1003.52 hPa。根据历史记录，2015 年全年最大全球水平太阳辐射 (GHI)、直接法向辐射 (DNI) 和漫射水平辐射 (DHI) 分别从 1085\
  \ 到 1404、729 到 909 以及 560 到 895 (W/m²)，如图图 7.8 所示。\n\n![图 7.7 波特布莱尔的位置（深白色）。](img/f07-07-9780323855105.jpg)\n\
