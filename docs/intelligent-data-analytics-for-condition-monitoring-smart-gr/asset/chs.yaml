  \ 所提方法框架\n\n图 10.15 代表所提的方法和方法论，其包含了 `HI` 提取、`HI` 优化、`HI` 验证以及最后锂离子电池 RUL 评估的完整步骤。该方案利用原始实验数据集进行\
  \ `HI` 的提取和优化。首先，分析每个记录参数的趋势以提取提取 `HI`，然后进行相关性分析以将提取的 `HI` 与电池容量映射。所提出的方案适用于锂离子电池的在线非侵入式健康评估，这是通过直接测量电池\
  \ `R` 和容量无法实现的。在小节 1（`HI` 提取）中，展示了实时数据集收集和 `HI` 提取。对于 `HI` 提取，提取了间接 `HI` 用于估计锂离子电池的\
  \ RUL。之后，进行 `HI` 优化以增强提取的 `HI` (`eHI`) 与电池实际容量之间的相关性。Box-Cox 转换方法（`BCTM`）用于增强相关性，其性能通过\
  \ Pearson 和 Spearman 相关方法进行验证。获得优化的 `HI` 后，将数据集分为两个部分用于训练和测试。在第 3 节中，逐一开发、训练和测试了多个\
  \ ELM。所有 ELM 方法的设计和开发基于参考文献。\n\n![图 10.15 HI 和 RUL 估计的方法。](img/f10-15-9780323855105.jpg\
  \ \"fig:\")\n\n### 2.2.1. HI 提取与优化的公式化\n\n### 2.2.1.1. HI 提取\n\n\n\n\n\n对于锂离子电池（LIB）的在线无侵入式健康评估，`HI`属性在运行过程中应于于。对于\
  \ LIB，在电池运行的充电和放电条件下，运行时间、温度、电压和电流是易测量的。因此，可以从电池的充电和放电数据提取`HI`。分析图 10.10 后得出，该曲线与退化曲线非常相似。放电状态电压与电池容量衰减也具有物理意义。\n\
  \n![图 10.16 基于退化的 RUL 估计。](img/f10-16-9780323855105.jpg \"fig:\")\n\n```\nTI[i]\
  \ = |DVI| = |T[i][DVmax] - T[i][DVmin]|\n```\n![image](img/B9780323855105000107-si5.svg)(10.1)\n\
  \n其中，`T[i][DVmax]`![image](img/B9780323855105000107-si6.svg)\\= 高电压幅值时间，`T[i][DVmin]`![image](img/B9780323855105000107-si7.svg)\\\
  = 低电压幅值时间，`i` = 循环次数。\n\n现在，针对 168 次放电循环计算出的这些`TI`向量被公式为：\n\n```\nTI[Raw] = [TI[(1)],\
  \ TI[(2)], TI[(3)], ..., TI[(i)]\n```\n![image](img/B9780323855105000107-si8.svg)(10.2)\n\
  \n该向量公式 [(10.2)]被用作电池 RUL 评估的`HI`。\n\n### 2.2.1.2 使用 Box-Cox 变换进行 HI 优化及其参数识别\n\n\
  从公式(10.2)向量中获得的曲线具有与电池容量相似的几何特征，但为了获得它们之间更好的相关性，需要对其进行增强。为此，通过 Box-Cox (BC)变换执行`HI`优化。\n\
  \n通常，`BC`变换是一类幂变换。它将正态分布的数据集修改为具有近似正态分布的数据集。`BC`在数学上表示为：\n\n```\n$TI_{Raw}(\\lambda)\
  \ = \\left\\{ \\begin{matrix} {\\frac{T}{I_{Raw}}^{\\lambda} - 1}{\\lambda}\\, \\\
  text{ if}\\lambda \\neq 0} \\\\ {\\log(TI_{Raw})\\, \\text{ if}\\lambda = 0\\} \\\
  \\ \\end{matrix} \\right.$\n```\n![image](img/B9780323855105000107-si9.svg)(10.3)\n\
  \n其中，对数是自然对数（以 e 为底）。该算法要求找到使对数似然函数（LLF）最大化的`λ`值。这里，通过 R 软件实现了`BC`，然后通过 PCA 和 SCA\
  \ 方法评估了`HI`与电池容量之间相关性的改进。\n\n`PCA`评估`TI`与容量之间的线性相关性（`r`）（线性关系），其范围从+1 到−1，并表示相关性的程度，`r\
  \ = 1`、`r = 0`和`r = −1`分别代表正线性、无线性性和负线性相关。皮尔逊相关系数（`r`）：\n\n```\n$r = \\frac{\\sum\\\
  limits\\_{i = 1}^{n}}{(TI_{i} - \\overline{TI})\\*(Ah_{i} - \\overline{Ah})}}{\\\
  sqrt{\\sum\\limits\\_{i = 1}^{n}}{(TI_{i} - \\overline{TI})}^{2}}\\sqrt{\\sum\\\
  limits\\_{i = 1}^{n}}{(Ah_{i} - \\overline{Ah})}^{2}}}$\n```\n![image](img/B9780323855105000107-si10.svg)(10.4)\n\
  \n其中，`Ah`![image](img/B9780323855105000107-si11.svg) = 实际容量，$\\overline{Ah}$![image](img/B9780323855105000107-si12.svg)\
  \ = `Ah`的平均值。\n\n`SCA`是一种使用单调函数（无论是否线性）等级相关的非参数测量。如果一个变量是另一个变量的单调函数，则完美的`SCA`用+1\
  \ 或−1 表示。\n\n### 2.2.1.3 HI 性能评估\n\n这里，“HI`性能评估通过使用均根误差（0 ≤ `RMSE` ≤ 0.5）![image](img/B9780323855105000107-si15.svg）来进行，分别对应公式(10.5)和公式(10.6)。\n\
  \n```\n$RMSE = \\sqrt{\\frac{\\sum\\limits\\_{i = 1}^{n}}{(Ah - \\hat{Ah})}^{2}}{n}}$\n\
  ```\n![image](img/B9780323855105000107-si16.svg)(10.5)\n\n```\n$R^{2} = 1 - \\frac{\\\
  sum\\limits\\_{i = 1}^{n}}{(Ah - \\hat{Ah})}^{2}}{\\sum\\limits\\_{i = 1}^{n}}{(Ah\
  \ - \\overline{Ah})}^{2}}}$\n```\n![image](img/B9780323855105000107-si17.svg)(10.6)\n\
  \n其中，$\\hat{Ah} = \\text{变换后的估计容量}$![image](img/B9780323855105000107-si18.svg)\n\
  \n### 2.2.2 使用多-ELM 进行 RUL 评估\n\n#### 2.2.2.1 RUL 预测\n\n\n\n\n\n预测性维护策略的核心组件是发现设备的剩余使用寿命（RUL）。RUL\
  \ 是设备在维修/更换之前或之间的健康运行时间。因此，通过对 RUL 进行估计，可以合理安排设备维护。通常，锂电池（LIB）的 RUL 可以通过模型驱动和数据驱动的方法预测。基于数据驱动估计\
  \ RUL 的常用方法/模型有：(1) 相似性模型，2) 生存模型和(3) 退化模型，它们分别取决于不同类型的数据集，如：(1) 寿命数据，2) 故障历史数据集和(3)\
  \ 特定状态阈值数据。\n\n## 2.2.2.2. 用于 RUL 评估的 ELM 数学建模\n\nELM 方法可以适用于监督（有标签数据集）和无监督（无标签数据集）两类问题。对于标签数据集，采用标准\
  \ ELM (`SELM`) 方法；而对于无标签数据集，则以简单的方法实现无监督 ELM (`USELM`) 方法，这种方法类似于谱聚类 (`SC`) 和拉普拉斯特征映射\
  \ (`LE`)。然而，`USELM` 可以直接实现以处理任何数据，而无需评估特征向量。此外，如果数据集是有标签和无标签数据集的混合，则采用半监督 ELM (`SSELM`)。`SSELM`\
  \ 基于半监督学习算法（即拉普拉斯正则化最小二乘法 LapRLS、拉普拉斯支持向量机 LapSVMs、半监督深度嵌入 SSDE、半监督神经网络 SSNNs）。`SELM`、`SSELM`\
  \ 和 `USEM` 的设计与实现均基于参考文献。\n\n### 2.2.2.2.1. SELM 的数学建模\n\n假设有有训练数据为：\n\n```\n[S,\
  \ T] = [s[i], t[i]] [i = 1]^N\n```\n![image](img/B9780323855105000107-si19.svg)(10.7)\n\
  \n其中 `s[i]` ∈ ℝ^(n[i])![image](img/B9780323855105000107-si20.svg), `t[i]` ∈ ℝ^(n[1])![image](img/B9780323855105000107-si21.svg)\
  \ 用于分类，`t[i]` ∈ ℝ^(n[0])![image](img/B9780323855105000107-si22.svg) 用于回归问题，`t[i]`![image](img/B9780323855105000107-si23.svg)\
  \ = 二进制维度向量。\n\n`SELM` 的训练过程包括以下两个通用步骤：\n\n**步骤 1) 使用随机生成的神经元构建隐藏层：**\n\n- Sigmoid\
  \ 函数：\n```\nz(s,\\lambda) = \\frac{1}{1 - \\exp( - (a^{T}s + b))}\n```\n![image](img/B9780323855105000107-si24.svg)(10.8)\n\
  \n- 高斯函数：\n```\nz(s, \\lambda) = exp( - b || s - a ||)\n```\n![image](img/B9780323855105000107-si25.svg)(10.9)\n\
  \n其中，`λ` = [a, b]![image](img/B9780323855105000107-si26.svg) = 参数，`||·||`![image](img/B9780323855105000107-si27.svg)\
  \ = 欧几得数。在 `SELM` 中，映射参数按照连续分布随机生成。在该步骤中，隐藏神经元将训练数据映射到 `n[h]`![image](img/B9780323855105000107-si28.svg)\
  \ 特征空间并表示为：关于 `s[i]` 的隐藏层输出![image](img/B9780323855105000107-si29.svg)，`h(s[i])`\
  \ ∈ ℝ^(n[h])\n\n用于连接隐藏层的输出权重 `ω` ∈ ℝ^(n[h]×n[O])![image](img/B9780323855105000107-si31.svg)(10.11)\n\
  \n然后网络的输出 `O(s[i])` = `h(s[i])*ω`![image](img/B9780323855105000107-si32.svg)(10.12)\n\
  \n**步骤 2) 通过最小化误差优化输出权重**\n\n```\nmin_{\\omega \\in \\mathbb{R}^{n_{h} \\times n_{O}}}\
  \ \\frac{1}{2}||\\omega||^{2} + \\frac{C}{2}\\sum_{i = 1}^{N}||e_{i}||^{2}\n```\n\
  ![image](img/B9780323855105000107-si33.svg)(10.13)\n\n```\ns.*h(s[i])*ω = t[i]^T\
  \ - e[i]^T\n```\n![image](img/B9780323855105000107-si34.svg)(10.14)\n\n其中，PART-1\
  \ = 防止过拟合的正则项，`e[i]` ∈ ℝ^(n[O])![image](img/B9780323855105000107-si35.svg) = 第 i\
  \ 个训练的误差，`C` = e 的惩罚因子。\n\n从目标函数中减去约束方程 (10.13)：\n\n```\nmin_{\\omega \\in \\mathbb{R}^{n_{h}\
  \ \\times n_{O}}} J_{ELM} = \\frac{1}{2}||\\omega||^{2} + \\frac{C}{2}||T - P\\\
  omega||^{2}\n```\n![image](img/B9780323855105000107-si36.svg)(10.15)\n\n其中，`P` =\
  \ [h(s[i])^T, ..., h(s[N])^T]^T ∈ ℝ^(N×n[h])![image](img/B9780323855105000107-si37.svg)(10.16)\n\
  \n现在将 `J[ELM]` 对 `ω` 的梯度置于零：\n\n```\n∇J[ELM] = ω + CP^T(T - P\\omega) = 0\n```\n\
  ![image](img/B9780323855105000107-si40.svg)(10.17)\n\n如果 `s > h[n]`![image](img/B9780323855105000107-si41.svg)（即\
  \ P 的行多于列），则方程 (10.15) 为：\n\n```\nω* = (P^T P + L/C)^-1 P^T\n```\n![image](img/B9780323855105000107-si43.svg)(10.18)\n\
  \n其中 `L[n[h]]` = 单位矩阵。如果 `s < h[n]`![image](img/B9780323855105000107-si44.svg)（即\
  \ P 的列多于行），则方程 (10.15) 为：\n\n```\nω* = P^T β* = P^T(PP^T + L/C)^-1\n```\n![image](img/B9780323855105000107-si45.svg)(10.19)\n\
  \n其中，`β + C(T^T - P^Tβ*)` = 0\n![image](img/B9780323855105000107-si46.svg)(10.20)\n\
  \n因此，优化的输出权重 `ω` 将根据训练样本数量 `s[i]`![image](img/B9780323855105000107-si48.svg) 和隐藏层神经元\
  \ `h[n]`![image](img/B9780323855105000107-si49.svg) 通过方程 (10.18) 和 (10.19) 进行评估。\n\
  \n### 2.2.2.2. SSELM 的数学建模\n\n`SSELM` 有助于分析有标签和无标签数据集的混合。假设：\n\n有标签数据集：`S[l], T[l]\
  \ = [x[i], t[i]] [i = 1]^l`![image](img/B9780323855105000107-si50.svg)(10.21)\n\n\
  无标签数据集：`S[u] = [x[i]] [i = 1]^l`![image](img/B9780323855105000107-si51.svg)(10.22)\n\
  \n其中，`l` = 有标签样本，`u` = 无标签样本。在对 `SELM` 的方程 (10.19) 和 (10.20) 进行修改后，`SSELM` 可以表示为：\n\
  \n```\nmin_{\\omega \\in \\mathbb{R}^{n_{h} \\times n_{O}}} \\frac{1}{2}||\\omega||^{2}\
  \ + \\frac{1}{2}\\sum_{i = 1}^{l}||e_{i}||^{2} + \\frac{\\lambda}{2}Tr(H^{T}JH)\n\
  s.t., h(s_{i})ω = t_{i}^{T} - e_{i}^{T}, i = 1..l\nO_{i} = h(s_{i}), i = 1..u\n\
  ```\n![image](img/B9780323855105000107-si52.svg)(10.23)\n\n其中，`J` ∈ ℝ((l+u)×(l+u))\
  \ = 从两种类型数据集得到的拉普拉斯，`H` ∈ ℝ((l+u)×n[O]) = 第 i 行的输出矩阵 `o(s[i])`，`λ` = 折中参数，`C_i =\
  \ C_o/N[t_i]` = 惩罚因子。替换约束后，方程 (10.23) 表示为：\n\n```\nmin_{\\omega \\in \\mathbb{R}^{n_{h}\
  \ \\times n_{O}}} \\frac{1}{2}||\\omega||^{2} + \\frac{1}{2}||C^{1/2}(\\tilde{T}\
  \ - P\\omega)||^{2} + \\frac{\\lambda}{2}Tr(\\omega^{T}P^{T}JP\\omega)\n```\n![image](img/B9780323855105000107-si60.svg)(10.24)\n\
  \n其中，`\\tilde{T}` ∈ ℝ((l+u)×n[O]) = l 行的增强训练 `~T[l]`（其余为零）。现在方程 (10.24) 对 `ω` 的梯度为：\n\
  \n```\n∇J_{SSELM} = ω + P^T(\\tilde{T} - P\\omega) + \\lambda.P^{T}JP\\omega\n```\n\
  ![image](img/B9780323855105000107-si64.svg)(10.25)\n\n如果 `s > h[n]`，输出权重向量为：\n\n\
  ```\nω* = (L_{n_{h}} + P^TCP + \\lambda P^{T}JP)^{-1}P^TC\\tilde{T}\n```\n![image](img/B9780323855105000107-si66.svg)(10.26)\n\
  \n如果 `s < h[n]`，输出权重向量为：\n\n```\nω* = P^T(L_{l + u} + CPP^{T} + \\lambda JPP^{T})^{-1}C\\\
  tilde{T}\n```\n![image](img/B9780323855105000107-si68.svg)(10.27)\n\n### 2.2.2.2.3.\
  \ USELM 的数学建模\n\n再次假设无标签数据集类似于方程 (10.22)：`S = [x[i]] [i = 1]^N`\n![image](img/B9780323855105000107-si69.svg)(10.70)\n\
  \n则 `USELM` 的公式为：\n\n```\nmin_{\\omega \\in \\mathbb{R}^{n_{h} \\times n_{O}}} \\\
  frac{1}{2}||\\omega||^{2} + \\lambda Tr(\\omega^{T}P^{T}JP\\omega)\n```\n![image](img/B9780323855105000107-si70.svg)(10.28)\n\
  \n方程 (10.22) 可以表示为：\n\n```\nmin_{\\omega \\in \\mathbb{R}^{n_{h} \\times n_{O}}}\
  \ \\frac{1}{2}||\\omega||^{2} + \\lambda Tr(\\omega^{T}P^{T}JP\\omega)\ns.t., (P\\\
  omega)^{T}P\\omega = L_{n_{O}}\n```\n![image](img/B9780323855105000107-si71.svg)(10.29)\n\
  \n如果 `s > h[n]`，输出权重向量为：\n\n```\nω* = [\\tilde{m}_2, \\tilde{m}_3, .., \\tilde{m}_{n_{O}}+1]\n\
  ```\n![image](img/B9780323855105000107-si73.svg)(10.30)\n\n其中，归一化特征向量 `\\tilde{m}_i\
  \ = \\tilde{m}_i / ||P^T\\tilde{m}_i||`, i = 2, 3, ..., n_{O} + 1\n\n如果 `s < h[n]`，输出权重向量为：\n\
  \n```\nω* = P^T[\\tilde{b}_2, \\tilde{b}_3, .., \\tilde{b}_{n_{O}}+1]\n```\n![image](img/B9780323855105000107-si74.svg)(10.31)\n\
  \n其中，归一化特征向量 `\\tilde{b}_i = \\tilde{b}_i / ||PP^T\\tilde{b}_i||`, i = 2, 3, ...,\
  \ n_{O} + 1\n\n### 2.2.2.3. RUL 性能分析\n\n这里，根据 5 号电池放电数据集提取的 HI 设计了多 ELM-RUL 模型，并通过绝对误差\
  \ (AE)、相对误差 (RE)、平均绝对误差 (MAPE) 和归一化 RMSE 进行评估：\n\n```\nAE = |A[RUL] - P[RUL]|\n\
  ```\n![image](img/B9780323855105000107-si78.svg)(10.34)\n\n```\nRE = |A[RUL] - P[RUL]|/A[RUL]\n\
  ```\n![image](img/B9780323855105000107-si79.svg)(10.35)\n\n```\nMAPE_RUL = (1/n\
  \ * sum_{i = 1}^{n} |A[RUL] - P[RUL]| / |A[RUL]|) * 100\n```\n![image](img/B9780323855105000107-si80.svg)(10.36)\n\
  \n```\nNRMSE_RUL = RMSE_RUL / mean\n```\n![image](img/B9780323855105000107-si81.svg)(10.37)\n\
  \n\n\n\n\n# 3. 结果与讨论\n\n## 3.1. HI 提取与优化\n\n### 3.1.1. HI 提取\n\n如第 2.2.1.1 节所示，HI\
