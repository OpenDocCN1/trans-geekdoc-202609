  \ | 27.4 | 0.83518 | 0.72318 |\n\n`WSFP` 的历史数据是以分钟为单位记录的，假设每天的记录时间范围为每天的 `00:00:00`\
  \ 到 `23:59:00`。通常，由于异常天气状况或仪器/操作错误，时间序列数据中存在一些缺失值和尖峰。因此，实施了数据预处理技术，通过填充合适的缺失值和去除尖峰对历史数据进行纯化。处理后的每月历史数据如\
  \ `图 8.11` 所示，以便理解。\n\n\n\n\n提取了基于 EMD（经验模态分解）方法的时频域特征。EMD 提取的 `IMFs`（内模态函数）作为若干特征，这些特征必须满足\
  \ `EMD` 的两个基本准则。提取 `IMFs` 的 `EMD` 实现过程如图图 8.12 所示所示![图 8.12 经验模态分解 (EMD) 实现过程]\n\
  \n假设有 1 个属性，且从每个属性生成的 `IMFs` 数量为 `n`，则输入矩阵 (`IM`) 为：\n\n```\nIFM_{IMFs} = {[imf_{1,1},imf_{1,2},.....,imf_{1,n}]_{S\
  \ \\times i}\n```\nimage(8.1)\n其中，`i = 1,2,…3`（属性/变量数量），`n = 1,2,…N`（每个属性的 `IMFs`\
  \ 数量），`S =` 数据样本数。\n\n获得了 `WS` 的 10 个生成的内模态函数 (`IMFs`) 并将其用于进一步的研究。\n\n### 3.4.\
  \ 最相关特征选择\n\n基于决策树 (`DT`) 的 `J48` 算法\n\n利用输入向量 `H` 作为 `x_{i} \\in R^{n}, i = 1,2,....l`，目标\
  \ `y \\in R^{l},`，然后通过 `DT` 递归地划分具有相同目标样本的空间。\n\n令节点 `m` 处的数据命名为 `Q`，对于每个样本通过特征\
  \ `j` 和阈值 `t_{m}` 划分 `\\theta = (j,t_{m})`，数据可以划分为 `Q_{left}(\\theta)` 和 `Q_{right}(\\\
  theta)` 子组：\n\n```\nQ_{left}(\\theta) = \\left. {(x,y)} \\right|x_{j} <= t_{m}\\\
  ,\\text{and}\\, Q_{right}(\\theta) = Q\\backslash Q_{left}(\\theta)\n```\nimage(8.2)\n\
  \n根据所执行的任务（如分类/回归），通过其函数 `H()` 评估 `m` 处的不纯度。\n\n```\nG(Q,\\theta) = \\frac{\\eta_{left}}{N_{m}}H(Q_{left}(\\\
  theta)) + \\frac{\\eta_{right}}{N_{m}}H(Q_{right}(\\theta))\n```\nimage(8.3)\n\n\
  优化参数以减少不纯度如下：\n\n```\n\\theta^{*} = \\arg\\min_{\\theta}G(Q,\\theta)\n```\nimage(8.4)\n\
  \n对 `Q_{left}(\\theta^{*})` 和 `Q_{right}(\\theta*)` 反复迭代，直到 `N_{m} < \\min_{samples}`\
  \ 或 `N_{m} = 1`。\n\n如果问题被建模为分类，则 `m` 节点的目标为 `0,1,....,K - 1`，通知具有 `N_{m}` 个实例的区域\
  \ `R_{m}` 为 `p_{mk} = 1/N_{m}\\sum\\limits_{x_{i} \\in R_{m}}{I(y_{i} = k)}`。\n\n\
  通常情况下，不纯度的评估（即 Gini）：\n\n```\nH(X_{m}) = \\sum\\limits_{k}{p_{mk}(1 - p_{mk})}\n\
  ```\nimage(8.5)\n\n`交叉熵`: \n```\nH(X_{m}) = - \\sum\\limits_{k}{p_{mk}\\log(p_{mk})\n\
  ```\nimage(8.6)\n\n`其他标识识别`:\n```\nH(X_{m}) = 1 - \\max(p_{mk})\n```\nimage(8.7)\n\
  \n在实现 `J48` 算法后，发现为了减少不纯度，优化参数如下（注：原文此处逻辑衔接存在重复，已按意译处理）：`J48` 算法实现后，最相关 `IMFs` 的选择可以提高预测精度。\n\
  \n### 3.5. LSTM 的设计\n\n传统神经网络 (`NN`) 受限于处理长序列问题。为了克服这一问题，引入了 LSTM（长短期记忆），其具有隐藏状态的表示。LSTM\
  \ 的隐藏状态用于 `WS` 预测。通过门控机制控制信息流：遗忘门、输入门和输出门决定了状态的更新。\n\n### 3.6. 性能指标\n\n性能评估过程用于计算模型的特征，显示其预测能力。在本研究中计算了\
  \ `MAE`（平均绝对误差）、`MAPE`（平均绝对比误差）和 `RMSE`（均方根误差）。`DNN` 模型的性能指标如下：\n\n```\nMAE = \\\
  frac{1}{N}\\sum\\limits_{t = 1}^{K}\\left| \\hat{f}(t) - f_{h}(t) \\right|\n```\n\
  image(8.13)\n\n```\nMAPE = \\left( \\frac{1}{N}\\sum\\limits_{t = 1}^{K}\\left|\
  \ \\frac{\\hat{f}(t) - f_{h}(t)}{f_{h}(t)} \\right|} \\right) \\times 100\n```\n\
  image(8.14)\n\n```\nRMSE = \\sqrt{\\frac{1}{N}\\sum\\limits_{t = 1}^{K}\\left( \\\
  hat{f}(t) - f_{h}(t) \\right)^{2}}\n```\nimage(8.15)\n其中，`\\hat{f}(t)` 和 `f_{h}(t)`\
  \ 分别是时间间隔 `k` 处的预测和历史值，`K` 是预测和历史数据的总数。\n\n### 4. 案例研究：结果展示与讨论\n\n本部分展示了通过所提出的 `LSTM`\
  \ 和改进 LSTM (`mLSTM`) 获取的 `WS` 预测结果，针对不同时间间隔的一步预测并最多到四步。对于每步向前预测，评估了每个 `LSTM` 和 `mLSTM`\
  \ 模型的性能指标（`MAE`、`MAPE` 和 `RMSE`），如表 8.9 所示。表 8.9 显示了所提 `LSTM` 和 `mLSTM` 模型的优结果。随后，根据这些性能评估，利用\
  \ `mLSTM` 模型对同一数据集进行两步、三步和四步预测的 `WS` 预测。在多步预测中，考虑了以下假设：一步（1 分钟）、两步（2 分钟）、三步（3 分钟）和四步（4\
  \ 分钟）预测。\n\n表 8.9\n基于 IMFs 的一步预测 WS 预测性能指标表示。\n\n![](img/f08-12-9780323855105.jpg)\n\
  \n\n\n\n# 图 8.12 经验模态分解 (EMD) 实现步骤\n\n假设有 1 个属性，且从每个属性生成的 IMF 数量为 `n`，则输入矩阵 `(IM)`\
  \ 为：\n\n`IFM`[`IMFs`] = `[imf[1, 1], imf[1, 2], ..., imf[1, n]][S × i]`\n\n![image](img/B9780323855105000089-si2.svg)(8.1)\n\
  \n其中，`i` = 1,2,…3（属性/变量数量），`n` = 1,2,…N（每个属性的 IMF 数量），`S` = 数据样本数。 \n\n获得了 WS 的\
  \ 10 个数字生成的内源模态函数 (IMFs)，并将其用于进一步研究。\n\n## 3.4. 最相关特征选择\n\n### 基于决策树 (DT) 的 J48\
  \ 算法\n\n利用输入向量 `H` 作为 `x[i]` ∈ `R^(n)`，![image](img/B97803238551050000089-si3.svg)\
  \ `i` = 1,2,...,`l`![image](img/B9780323855105000089-si4.svg) 以及目标 `y` ∈ `R^(l)`，![image](img/B9780323855105000089-si5.svg)\
  \ 然后 DT 递归地划分空间，将具有相同样本的组合在一起。\n\n令节点 `m` 处的数据命名为 `Q`，对于每个样本划分 `θ` = (`j, t[m])`)![image](img/B9780323855105000089-si6.svg)\
  \ 使用特征 `j` 和阈值 `t[m]`![image](img/B9780323855105000089-si7.svg)，数据可以划分为子集 `Qleft`![image](img/B9780323855105000089-si8.svg)\
  \ 和 `Qright`![image](img/B9780323855105000089-si9.svg)如下：\n\n`Qleft` = (`x,y)|`x[j]`\
  \ <= `t[m]` 和 `Qright` = `Q ∖ Qleft`\n\n![image](img/B9780323855105000089-si10.svg)(8.2)\
  \ \n\n`m` 处的纯度根据所执行的任务（如分类/回归）通过其函数 `H()` 进行评估![image](img/B9780323855105000089-si11.svg)\
  \ \n\n$G(Q,\\theta) = \\frac{\\eta_{left}}{N_{m}}H(Q_{left}(\\theta)) + \\frac{\\\
  eta_{right}}{N_{m}}H(Q_{right}(\\theta))$\n\n![image](img/B9780323855105000089-si12.svg)(8.3)\
  \ \n\n优化参数以减少纯度如下：\n\n`θ^*` = arg min[θ]G(*Q, θ*)\n\n![image](img/B9780323855105000089-si13.svg)(8.4)\
  \ \n\n反复迭代 `Qleft`![image](img/B9780323855105000089-si14.svg) 和 `Qright`![image](img/B9780323855105000089-si15.svg)\
  \ 直到 `N[m]` < min[samples]`![image](img/B9780323855105000089-si16.svg) 或 `N[m]`\
  \ = 1![image](img/B9780323855105000089-si17.svg)。 \n\n如果问题建模为分类，则目标为 0,1,...,1，![image](img/B9780323855105000089-si18.svg)\
  \ 对于 `m` 节点，且通知区域 `R[m]`![image](img/B9780323855105000089-si19.svg) 实例为 $p_{mk}\
  \ = 1/N_{m}\\sum_{i \\in R_{m}}I(y_{i} = k)$![image](img/B9780323855105000089-si20.svg)。\
  \ \n\n通常，纯度评估（即 Gini）：\n\n$H(X_{m}) = \\sum_{k}p_{mk}(1 - p_{mk})$![image](img/B9780323855105000089-si22.svg)(8.5)\
  \ \n\n$\\text{交叉熵}:H(X_{m}) = -\\sum_{k}p_{mk}\\log(p_{mk})$![image](img/B9780323855105000089-si23.svg)(8.6)\
  \ \n\n杂项识别：`H(X[m])=1−max(p[mk])`![image](img/B9780323855105000089-si24.svg)(8.7)\
  \ \n\n在对最相关 IMF 执行 `J48` 算法后，发现对于 WS 问题的数量剪枝程序并不有效，且对预测的提升并不大。因此，关键信息是，对于 WS 预测，特征选择与基于特征的方法相比，可能无法提高预测预测准确性。因此为了减少计算负担，在现场可能不会采用。\n\
  \n## 3.5. LSTM 网络的设计\n\n传统的神经网络 (`NN`) 受限于序列数据流且受限于参数共享。为了解决这个问题，引入了 `RNN`，它具有隐藏状态以存储之前的参数。但在实际情况下\
  \ `RNN` 无法处理长序列，`LSTM` 能够处理长序列。`LSTM` 的基本组件是单元，通过 `Tanh` 传递 `LSTMs` 的不同信息。输入门带有之前的隐藏状态和当前输入，通过![image](img/B9780323855105000089-si25.svg)\
  \ 激活函数来决定哪些信息被保留（靠近 1 的保留，靠近 0 的丢弃）。输出门决定隐藏状态。计算单元的方程如下：![image](img/B9780323855105000089-si26.svg)\n\
  \n其中 `g` 是相对于门的 sigmoid 函数。\n\n遗忘门 = σ(W[f][S[t-1]],X[t]) + b[f]) (8.8) \n\n输入门\
  \ = σ(W[i][S[t-1]],X[t]) + b[i])（8.）![image](img/B9780323855105000089-si27.svg)(8.9)\
  \ \n\n输出门 = σ(W[o][S[t-1]],X[t]) + b[o])（8.10）![image](img/B9780323855105000089-si29.svg)(8.11)\
  \ \n\n$h(t)=tanh(W[h][S[t-1]],X[t]) + b[h]) (![image](img/B9780323855105000089-si30.svg)\
  \ \n\n## 3.6. 性能衡量\n\n性能评估用于以平均绝对误差 (MAE)、平均绝对百分比误差 (MAPE) 和均方根误差 (RMSE) 的形式计算模型的特征。\n\
  \n$MAE = \\frac{1}{N}\\sum_{k}|\\hat{f}(t) - f_{h}(t)|$![image](img/B9780323855105000089-si31.svg)(8.13)\
  \ \n\n$MAPE = \\left( \\frac{1}{N}\\sum_{k}\\frac{|\\hat{f}(t) - f_{h}(t)|}{f_{h}(t)}\
  \ \\right) \\times 100$![image](img/B9780323855105000089-si32.svg)(8.14) \n\n$RMSE\
  \ = \\sqrt{\\frac{1}{N}\\sum_{k}(\\hat{f}(t) - f_{h}(t))²}$![image](img/B9780323855105000089-si33.svg)(8.15)\
  \ \n\n其中，`hat{f}(t)` 和 `fh` 是时间间隔 `k` 的预测和历史辐射，`K` 是预测和样本的总数。\n\n## 4. 案例研究：结果展示与讨论\n\
  \n本部分展示了通过所提出的 LSTM 和改进 LSTM (mLSTM) 在不同单步预测和预测四步的情况下获得的 WS 预测结果。对于每个预测步，评估了每个 LSTM\
  \ 和 mLSTM 模型的性能指标（MAE、MAPE、RMSE），如表 8.9 中的单步预测所示。然后，根据这些性能评估，利用 mLSTM 模型在相同数据集的不同时间间隔下进行两步、三步和四步预测的\
  \ WS 预测。\n\n\n\n\n\n# 基于 IMF 的单步提前风速（WS）预测性能指标表征。\n\n图 8.15 展示了使用所提 `mLSTM` 在整个记录时间段内获得的预测行为和性能指标。结果结果表明，所提的\
  \ `mLSTM` 方法在所有多步情况下均优于其他方法，呈现了可接受的 `MAE`、`RMSE` 和 `MAPE` 误差。通过使用 2015 年至 2017 年的特布莱尔（Port\
  \ Blair）历史数据集以及每个月的测试阶段结果，证明了所提 `mLSTM` 方法的有效性，这表明所提 `mLSTM` 模型具有高度接受性。\n\n![图 8.15\
  \ WSF 模型多步预测性能指标的表征。(A) MAE，(B) RMSE，以及 (C) MAPE.](img/f08-15-9780323855105.jpg)\n\
  \n图 8.15 WSF 模型多步预测性能指标的表征。\n\n(A) `MAE`，(B) `RMSE`，以及 (C) `MAPE`。\n\n## 5. 结论\n\
  \n提出了一种新型先进 `mLSTM` 方法用于多步提前 `WSF`，并通过使用印度城市特布莱尔进行 `WS` 短期预测对其性能进行了验证和证明。该网络模型能够解决线性以及非线性问题。因此，`WSF`\
  \ 是一个高度非线性的短期预测（每分钟）问题，通过所提 `mLSTM` 方法可以以高效且计算负担较低的方式进行处理。多步提前预测是通过递归执行的，使用历史数据集进行单步（1\
  \ 分钟）、两步（2 分钟）、三步（3 分钟）和四步（4 分钟）提前预测，并重复此过程直到 4 分钟的时间步。该方法使用来自印度特布莱尔的真实气象数据进行了演示。通过将获得的结果与\
  \ `LSTM` 模型进行比较，完成了所提 `mLSTM` 模型的演示。演示结果表明，用于 `WSF` 的所提 `mLSTM` 模型在单步提前预测结果上相对于\
  \ `ANN` 模型的所有标准（`MAPE`、`RMSE` 和 `MAE`）均表现更优。\n\n# 参考文献\n\n[1]] 可再生能源系统：技术概述与展望，载于\
