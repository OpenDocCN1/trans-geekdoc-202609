  \ 2.3. 使用 EEMD 提取特征\n\nEEMD 是 EMD 算法的改进版本，用于解决 EMD 方法的模态混合问题。EEMD 算法的实现过程分为以下三个简单步骤：\n\
  \n*   步骤 1：添加足够数量的白噪声 ≅![image](img/B9780323855105000065-si71.svg)原始信号的均值和方差\n*\
  \   步骤 2：使用 EMD 算法分解每个新信号（原始信号 + 噪声）\n*   步骤 3：计算步骤 2 中 EMD 获得的所有本征模函数（IMF）的平均值，以消除白噪声的影响\n\
  \n图 6.4 以流程图形式表示 EEMD 算法的数学建模。噪声的引入为基于 EMD 的分解提供了均匀的基础尺度分布，以减少模态混合。该过程提高了准确性并减少了\
  \ IMF 中的虚假频率。![图 6.4 EEMD 算法流程图。](img/f06-04-9780323855105.jpg)\n\n图 6.4 EEMD 算法的流程图。\n\
