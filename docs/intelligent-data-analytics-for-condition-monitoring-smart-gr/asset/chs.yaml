  \n### 3.3. 极端学习机 (ELM)\n\n### 3.3.1 极端学习机 (ELM)\n\n极端学习机是一种用于聚类、回归等的前馈神经网络。它的学习速度比\
  \ BP 算法快。ELM 的详细数学实现见参考文献：\n\n```\nf = \\sum_{i=1}^{Q} \\beta_i h_i(x)\n```\n\n\
  其中 `h_i(x)` 是隐藏层的输出，`beta_i` 是输出权重。对于 `N` 个样本，隐藏层为：\n\n```\nH = \\begin{bmatrix}\
  \ h_1(x_1) & h_2(x_1) & \\dots & h_Q(x_1) \\\\ h_1(x_2) & h_2(x_2) & \\dots & h_Q(x_2)\
  \ \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\ h_1(x_N) & h_2(x_N) & \\dots &\
  \ h_Q(x_N) \\end{bmatrix}\n```\n\n输出权重 `beta_i` 通过以下公式计算：\n\n```\n\\beta = H^\\\
  dagger T\n```\n\n其中 `T` 是包含实际标签值“o” 的目标矩阵：\n\n```\nT = \\begin{bmatrix} o_1 \\\\\
  \ o_2 \\\\ \\vdots \\\\ o_N \\end{bmatrix}\n```\n\n\n\n\n\n# 架构\n具有一个隐藏层的 ANN 设计根据公式\
  \ (5.5)–(5.11) 中提到的公式化数学模型设计的，其中包含了输入层与隐藏层之间的权重值 `W^(*I*) = [w[*i*h]^(I)]((n + 1)\
  \ × q]`![image](img/B9780323855105000053-si24.svg) 以及隐藏层与输出层之间的权重 `W^(*H*) = [w[*h*j]^(H)](q\
  \ + 1) × p]`![image](img/B9780323855105000053-si25.svg)。图 5.15 封装了 MLP-ANN 架构的整个仿真\
  \ \\ ![图 5.15 单层 MLP-ANN 架构.\n\n图 5.15 单层 MLP-ANN 架构。\n\n### 输入层\n`i[th]` 神经元的计算为：\n\
  \n`Data sample selection = S(x[*i*]) = x[*i*], i = 1, 2, ..., n;`\n\n![image](img/B9780323855105000053-si26.svg)(5.5)\n\
  \n`S(x[0]) = 1.`\n\n![image](img/B9780323855105000053-si27.svg)(5.6)\n\n### 隐藏层\n\
  `h[th]` 神经元的计算为：\n\n$\\text{Input}\\,value\\, net\\left( {Hi} \\right) = z_{h} =\
  \ \\sum\\limits\\_{i = 0}^{n}{w_{ih}^{I}S\\left( x_{i} \\right)},\\\\, h = 1,2,....q$\n\
  \n![image](img/B9780323855105000053-si28.svg)(5.7)\n\n$\\text{Output}\\,value\\\
  , out\\left( {Hi} \\right) = S\\left( z_{h} \\right) = \\frac{1}{1 + e^{- z_{h}}},\\\
  \\, h = 1,2,....q$\n\n![image](img/B9780323855105000053-si29.svg)(5.8)\n\n`S(z[0])\
  \ = 1.`\n\n![image](img/B9780323855105000053-si30.svg)(5.9)\n\n### 输出层\n`j[th]`\
  \ 神经元的计算为：\n\n$\\text{Input}\\,value,\\,\\, out\\left( {Oi} \\right) = y_{j} = \\\
  sum\\limits\\_{h = 0}^{q}{w_{hj}^{H}S\\left( z_{h} \\right)},\\\\, j = 1,2,....p$\n\
  \n![image](img/B9780323855105000053-si31.svg)(5.10)\n\n$\\text{Output}\\,value,\\\
  ,\\, out(Oi) = S\\left( y_{j} \\right) = \\frac{1}{1 + e^{- y_{j}}},\\\\, j = 1,2,....p$\n\
  \n![image](img/B9780323855105000053-si32.svg)(5.11) 其中，`S(⋅)`![image](img/B9780323855105000053-si33.svg)\
  \ = 激活函数。\n\n## 4. 结果与讨论\n\n对 MLP-ANN 和 ELM 方法进行 PQDD 解释，以验证所提方法有效诊断 PQ 问题的能力。所得的结果如表\
