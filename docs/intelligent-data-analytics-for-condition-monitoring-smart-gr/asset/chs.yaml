  \ 的 BC 变换](img/f10-20-9780323855105.jpg \"fig:\")\n![图 10.21 TI 与变换容量的相关性](img/f10-21-9780323855105.jpg\
  \ \"fig:\")\n\n### 3.1.3. 变换 HI 分析\n\n为了分析通过 BC 变换后变换 HI 的显著改进，评估了 Pearson 和 Spearman\
