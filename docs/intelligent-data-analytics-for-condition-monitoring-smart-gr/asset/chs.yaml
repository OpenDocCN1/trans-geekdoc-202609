  \n[[7]] `ICPEICES`。\n\n[[8]] `978-981-13-22`。\n\n[[9]] `153208`。\n\n[[10]] `153208`。\n\
  \n[[11]] `2013.12.008`。\n\n[[12]] `PIICON-2016`。\n\n\n\n\n本文提出了一种基于`ConvNet/CNN`算法的深层神经网络（DNN），用于光伏组件（PVM）的自动故障诊断，并定位互联光伏（PV）系统中的异常状态。此前，PVM\
  \ 故障的识别已通过多种智能方法实现，例如带有外输入的非线性回归神经网络（`NARX`）、反向传播神经网络（`BPNN`）、概率神经网络（`PNN`）、人工神经网络（`ANN`）、支持向量机、模糊逻辑及其混合方法。然而，此类方法尚未探索过非线性负载和扰动负载条件下的\
  \ PV 故障诊断领域。此外，截至为止，文献中尚未报道针对非线性 PV 故障类型诊断的基于 DNN 的解决方案。因此，为了弥补这一研究空白，本文使用了不同 PVM\
  \ 故障状态的实时实验图像数据集。红-绿-蓝（`RGB`）索引下每种故障的光伏电池彩色图像为 PV 故障诊断提供了最佳视觉特征。所提出的使用`ConvNet/CNN`算法的\
  \ DNN 模型经过了多次测试，使其具有对光伏组件在线诊断的适用性。训练和测试阶段获得的结果显示其在 PVM 故障分析方面具有优异的性能。\n\n## 关键词\n\
  \nConvNet/CNN 深度神经网络 故障诊断 故障分析 光伏组件故障\n\n## 1. 引言\n\n在当前情况下，全球大多数国家已关注通过政策和倡议，通过减少传统能源使用（即化石燃料能源）并减少`CO[2]`排放来实现可持续性，以实现巴黎协定的目标。根据\
