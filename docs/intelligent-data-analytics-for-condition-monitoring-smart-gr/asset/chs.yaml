  \n# 第 8 章：基于长短期记忆（LSTM）网络用于风电发电风速预测的智能数据分析\n\n## 摘要\n风能是一项巨大的可再生能源，它是可能燃料的替代资源，并显示出减少不利环境影响的巨大潜力。可再生能源（RES）正日益增长，2018\
  \ 年其贡献占全球总发电量的比例约 65%，而风能资源在其中起着重要作用。本章提出了一种基于`LSTM`（长短期记忆）和改进`LSTM`（`mLSTM`）网络的智能数据分析预测方法，用于多步提前（MSA）风速（`WS`）预测。在所提方法中，首先从印度气象部门获取\
  \ 2015–17 年期间每分钟记录的历史数据，然后进行数据预处理，包括数据清洗、缺失值填充和离峰值剔。通过利用步骤 1 中的预测数据作为输入来生成下一个预测数据，递归地实现`WS`预测，该过程一直进行到四级。为了对所提方法的性能进行公平比较，针对同一数据开发了`LSTM`和`mLSTM`，结果表明所提的`WS`预测方法表现更好，并且可以适用于其他地点。\n\
  \n## 关键词\n长短期记忆 (LSTM) 深度神经网络 预测预测 风速\n\n## 1. 引言\n如今，随着工业现代化和智慧城市的发展，能源需求剧增。为了满足电力消耗限制，公用事业公司正试图加强对可再生资源的利用。根据参考文献[中的引用工作[\
  \ 根据 MNRE（印度新型和可再生能源资源部），印度设定了宏伟的目标，即到 2022 年实现 175 GW 的可再生能源发电[ 根据时间尺度，`WSFP`（风速预测与预测）被分为四类：(1)极短期（VST），(2)短期（ST），(3)中期（MT）和(4)长期（LT）[\
  \ 在现有的文献中，有许多与`WSFP`混合方法相关的研究论文、发明和版权作品。例如，Lili Wang 及其同事[ `WS`介于 4 到 35 m/s 之间的范围是具有生产效益的`WS`，可用于特定的风力发电机组发电。目前，由`WS`产生的电量大幅增加。所引入的`WE`在\
  \ 2005–09 年期间扩大了近 200%。如今，`WE`是世界上增长最快的资源。`WE`需要评估不同时间的`WS`，且具有随机性。`WS`通过风力发电机转换为电能。风电是`WS`的函数。风电场输出的准确功率预测需要对`WS`进行预测。`WS`预测对于风电场机组维护、常规机组与风电场之间的最优潮流、电力市场竞标、电力系统发电机调度、能量储备、储能规划和调度至关重要。因此，后续章节将讨论研究人员进行的`WS`预测[\
  \ 本文的主要贡献是提出一种基于 2015–17 实时测量历史数据集的新型`LSTM`方法用于`WSFP`。此外，利用开发的模型对未安装风速测量仪的印度站点进行`WS`预测。预测的`WS`可用于安装风力发电机组以发电的风资源评估。本章的结构分为五个部分，包括第\
  \ 1 节的引言和第 2 节的`WSFP`智能数据分析。第 3 节代表所提框架，包括以下子节：(1)3.1 节所提方法的形成，(2)3.2 节的研究数据集收集，(3)3.3\
  \ 节特征提取，(4)3.4 节特征选择，(5)3.5 节`LSTM`网络及其改进版本的设计，以及(6)3.6 节性能衡量指标。结果展示与讨论见第 4 节，最后结论见第\
  \ 5 节。\n\n## 2. WSFP 的智能数据分析\n\n\n\n\n\n`WSFP` 是 `RES`（可再生能源）预测和预测的一部分。尽管 `RES`\
  \ 预测和预测是不同用户使用的、具有运行工具和服务的成熟技术，但在模型和应用方面仍存在若干研究空白和瓶颈，这促使了全球范围内的重大研究。本研究的主要目标是针对利用机器学习进行\
  \ `RES` 预测和预测的智能数据分析挑战和创新研究。存在不同的 `RES` 分析工具和技术。可再生能源决策可以根据使用的数据分为七种关键分析方法。这些分析方法概述如下：(1)\
  \ 早期映射与可视化 (`ESMV`)、(2) 发电机性能建模 (`GPM`)、(3) 技术潜力分析 (`TPA`)、(4) 供给曲线建模 (`SCM`)、(5)\
  \ 经济潜力分析 (`EPA`)、(6) 产能扩展建模 (`CEM`) 以及 (7) 生产成本建模 (`PCM`)。\n\n这些分析技术的可行性和利用取决于所需的数据集以及分析的复杂程度，如图\
  \ 8.1 所示。在图 8.1 中，早期 `RE` 开发的意义与由 `RES` 高级可视化支持的决策有关。同样，后期 `RE` 开发与由具有产能扩展建模等多个分析模块的稳健分析支持的决策有关。图\
  \ 8.1 中所示的区块代表了每种方法分析所需的数据量。\n\n因此，图 8.1 的`x-axis`代表所需数据集的数据量，而`y-axis`代表方法的复杂程度，从低到高（从下到上）。例如，图\
  \ 8.1 底部的第一个区块（橙色）显示分析方法 #1（即 `ESMV`）研究所需的数据量较少，其复杂性也极低。图 8.1 顶部还有一个区块（深绿色），显示分析方法\
  \ (`PCM`) 的分析复杂性非常高，但它所需的数据集与 `ESMV` 类似也较少。\n\n![Figure 8.1 Analysis building blocks\
  \ to support RE decisions.](img/f08-01-9780323855105.jpg)\n\n图 8.1 支持可再生能源决策的分析模块。\n\
  \n每种分析方法都有不同类型的工具，列在表 8.1 中。这些工具可以通过适当的渠道向相应机构申请。此外，读者需要一个数据库，以便使用上述表 8.1 中的工具对开发的模型进行进一步验证。为了解决这一问题，表\
  \ 8.2 中总结了一些在线数据库。其中一些是付费的，一些是开放的。关于数据库的利用，读者需要关注 `RES` 智能数据分析目的的相应权限。\n\n### 表\
