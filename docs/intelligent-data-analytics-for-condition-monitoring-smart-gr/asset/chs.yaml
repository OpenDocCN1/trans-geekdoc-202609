  \n# 第 4 章：基于基因表达编程（GEP）的三相感动机故障诊断智能数据分析\n\n## 摘要\n\n随着设备运行年限的增加，三相感动机（`IM`）的故障诊断与状态评估（FDCA）变得越来越重要。适当的\
  \ FDCA 对于延长电机运行寿命、提高效率以及减少灾难性故障起着关键作用。我们提出了一种基于基因表达编程（`GEP`）的三相 `IM`外部故障识别实用 FDCA\
  \ 方法。该方法在公开的真实故障数据上得到了验证。`GEP` 方法使用三相电压和电流的均方根（RMS）值作为输入变量，用于识别 `IM` 经历的六种故障和一种正常运行（`NF`）状态。我们将我们的\
  \ `GEP` 方法与 `ANN` 和 `SVM` 技术进行了比较。我们还测试了 `GEP` 方法在运行条件扰动下分析这些故障状态的能力。\n\n## 关键词\n\
  \n感动机故障分类 基因表达编程\n\n## 1. 引言\n\n在过去的几十年里，电机已成为生活不可的一部分；涵盖了交通、农业甚至日常生活。即使在这个现代时代，电机仍然占据着核心地位。在各种类型的电机中，感动机（`IMs`）由于其一些优点而被最广泛地使用：坚固、高效率、低运行与维护（`O&M`）成本、卓越的启动扭矩以及先进的变频器（`VFD`）可用性。因此，使用的许多电机都是单相或三相\
  \ `IMs`。\n\n\n`IMs` 的少数异常状态或故障属于定子侧故障：\n\n表 4.1 三相感动机所经历的故障编码。\n\n| 故障类型 | 正常状态\
  \ | 单相 | 电压不平衡 | 低电压 | 转子锁死 | 过载 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\
  \ :--- |\n| 代码 | NF | SP | UB | OV | LR | OL |\n\n\n针对健康和故障状态评估的多种外部故障识别方法是基于机械和电气特征的。使用的一些特征包括：振动、电磁场、感应电压、浪涌测试、电机电路分析、声发射、气隙扭矩、瞬时角速度和电机电流分析（`MCSA`）。在文献中，基于\
  \ `ANN` 的方法涉及局部极值的确定和优化结构，这两者都是耗时的过程。在文献中，`GEP` 故障识别方法能够克服这些缺点。通常而言，`GEP` 比 `MLP`、`SVM`、`PSVM`、`WT`、`ELM`、`GA`\
  \ 和 `GP` 泛化能力更好。本工作的主要目标是提出一种基于 `GEP` 的技术来实现故障分类精度，因为 `GEP` 结合了 `GA` 和 `GP` 算法的优势。本文分为五部分：在第\
  \ 1 节中介绍了引言和文献综述。研究使用的数据集和采用的方法在第 2 节中进行了解释。提出的故障诊断与状态评估（FDCA）模型公式在第 3 节中给出。第 4\
  \ 节给出了结果，结论在第 5 节中进行描述。\n\n## 2. 感动机状态监测创新简要信息\n\n\n\n\n\n`IM`（电动机）的状态监测领域在全球范围内是非常成熟的领域。根据工业\
  \ 4.0 的需求，许多研究人员和院士在该领域致力于工作。利用“The Lens”平台对 `IM` 的 `CM`（状态监测）研究领域进行了一项数据分析研究。根据现有数据，执行了两种类型的分析：(1)\
  \ 基于学术成果的分析和(2) 引用专利分析。因此，在创新分析中，以下是排名前列的机构：Ford Global Technologies LLC、General\
  \ Electric Company、Samsung Electronics Co. Ltd、Ethicon LLC、Applied Materials Inc、Halliburton\
  \ Energy Services Inc、At&t Intellectual Property I.L.P.、GM Global Technology Operations\
  \ LLC、福特公司以及加州大学摄政会成员。该领域的顶尖发明者是：Silverbrook Kia、Hyde Roderick A、Henry Paul Shala、Shelton\
  \ Iv Frederick E、Gerszberg Irwin、Barzegar Farhad、Willis III Thomas M、Wood Jr Lowell\
  \ L、Bennett Robert、Barnickel Donald J、Lapstun Paul、Ruben Steven M、Rosen Craig A、Bevec\
  \ Dorian、Tang Y Tom、Kare Jordin T、Golz Stefan、Medoff Marshall、Harris Jason L 和 Cavalli\
  \ Fabio。根据司法管辖区的数量地区排名分别是：美国、WO—WIPO、澳大利亚、欧洲专利、中国、日本、德国、英国、法国、韩国、加拿大、俄罗斯、芬兰、巴西、新西兰、新加坡、香港、台湾、拉脱维亚、欧亚专利、意大利、墨西哥、马来西亚、西班牙、根和罗马尼亚。根据创新领域的顶端\
  \ CPC 分类，以下研究领域的排名为：`A61K38/00`、`C07K14/47`、`C07K14/705`、`C12Q2600/158`、`C12Q1/6883`、`A61K48/00`、`C07K2319/00`、`A61K2300/00`、`A61K45/06`、`A01K2217/05`、`G01N33/6896`、`G01N2500/00`、`A61K2039/505`、`G01R31/343`、`G01N33/5008`、`A61N1/36007`、`C07K16/18`、`C12Q2600/136`、`A01K2227/105`、`G01N33/6893`。有关所有\
