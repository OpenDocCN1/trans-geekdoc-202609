    These two functions can be used in handy to reduce duplication of work.


    Date and time can be displayed in PHP by using the date() function. This function
    returns date\and time information in a format based on the arguments given to
    it.


    The options available are as follows.


    +   - Y means year in 4-digit format.

    - y means year in 2-digit format.


    +   - n - means month as one or two digits as 4.


    +   - m - means month as two digits as 05.


    +   - F - means month in full form of the name of the month as August.


    +   - M - mean month in three letter format such as Aug.


    +   - j - means day of the month in 1 or 2 digits such as 8.


    +   - d - means the day of the month in 2-digit format such as 08.


    +   - l means the day of the week such as Sunday.'
