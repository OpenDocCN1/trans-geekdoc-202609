  md: '# Chapter 6. Files and Directories


    The first step to understanding the importance of a database is files and directories.
    There are two ways to store data with PHP and with most programming languages.
    They are files & directories or a database.


    In a web hosting environment especially one that is shared by the host provider
    might be a little strict when it comes to files.


    A file such as a file (.csv, .txt) have certain permission settings on the web
    host. The directory also will have these permissions.


    The permission options de-fact are read, write and executable. In addition to
    these options can be set in three different ways based on the user. The owner
    gets automatic write and read rights whereas others and groups are given only
    read permission.


    Irrespective of the type of hosting (Unix or Windows) the hosting service might
    limitations for security reasons on allowing access to write on files and directories
    in case of shared hosting. This needs to be studied upfront before creating a
    PHP program based on files and directories for storage and retrieval.


    As mentioned in the previous line files, directories and a database basically
    store data and allow them to be retrieved.


    To write to a file using PHP the following functions can be used:


    fopen() to open a file for writing in a particular mode.


    fwrite() to actually write the data to the file.


    fclose() to close the connection to the file.


    fopen() function has several modes of opening a file to write. They are:


    +   - r - for reading only. The reading will start at the beginning of the file.


    +   - r+ - for reading or writing. Either will start at the beginning of the file.


    w - for writing only. If the file does not exist, then it will be created and
    overwrite any existing content.


    w+ - for reading or writing. If the file does not exist, then it will be created
    and overwrite any existing contents when writing.


    a - for writing only. The file will be created if it does not exist and new data
    will be appended to the end of the file.'
  merge: -1
  img_proc: true
