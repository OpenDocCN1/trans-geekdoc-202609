    # Version 7 PHP:


    Version 7 of PHP is a new release in PHP and one of the areas that has been affected
    by new

    functions is in the way to deal with MySQL. The new functions are termed as mysqli
    i

    stands for improvement. The good news is that for those who are familiar with
    the previous ways

    of connecting to MySQL, can, easily migrate to the new functions because there
    is similarity in

    the connection will be made.


    mysqli_connect() replaces mysql_connect()


    mysqli_query() replaces mysql_query()


    mysqli_fetch_array() replaces mysqli_fetch_array()


    In short instead of mysql the new functions start as mysqli_. Let us look at an
    example of

    selecting from the data using the new mysqli functions in PHP 7.


    ```

    <html><body>

    <?php

    $link_id = mysqli_connect(''localhost'',''root'',''thottangal'');

    or die("Could not connect: " , mysqli_error());

