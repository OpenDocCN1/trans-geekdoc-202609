- pgno: 70
  md: '# DDL: Data Definition language


    | | |

    |---|---|

    | Create | Creates a new table. |

    | Alter | Modifies an object such as a table. |

    | Drop | Deletes a table. |

    | Truncates | Removes the values of the fields of a table but leaves the structure
    of the table intact. |


    # DML: Data Manipulation language


    | | |

    |---|---|

    | Select | Retrieves parts of a table in response to a user''s query. |

    | Insert | Puts values into a table. |

    | Update | Modifies rows in a table. |

    | Delete | Removes rows from a table. |


    # DCL: Data control language


    | | |

    |---|---|

    | Grant | Gives a privilege to a user such as permission to view or modify a table
    in a database. |

    | Revoke | Removes a privilege from a user. |


