  md: '# Chapter 7. Intro to Databases


    The database that comes with PHP developer kit or in in free or shared hosting
    is the MySQL database. There are exceptions. In this chapter we will look into
    the basics of the SQL (Structured Query Language) needed to operate any database.


    SQL has four important commands with respect to manipulating data in tables in
    a database. These four commands are:


    +   - Select - to retrieve data from the tables of a database.


    +   - Insert - to add data to a table in the database.


    +   - Update - to change data in a table of the database.


    +   - Delete - to remove data in a row of a table of the database.


    Further to these are commands for creating a database, table, view, index, procedure.


    Web hosting sites there is a control panel to create a database and the tables
    associated with them. In Unix/Linux hosting the most popular control panel currently
    in the market is the C-Panel. It may look like the one below.


    ![](img/d7e83bd680bb691d653bca3af472a71a_68_0.png)


    The administration of the databases in the case of Unix/Linux based C-Panels is
    done using the PHPMyAdmin option. In cases of hosting all be familiar with the
    faq''s of the hosting being used.


    In the grades table below we insert as follows:


    | sid | name | prelim | midterm | final |

    | 100 | Albert | 100 | 78 | 89 |'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Insert into grades values (''100'',''Albert'',100,78,89);


    The alphanumeric/char characters need to be within single quotes.


    Numbers do not have within quotes.


    It is very important in an insert statement to follow the same sequence of fields
    as in the table.


    One can skip a particular field or leave the value for a particular field blank
    as follows:


    Insert into grades values (''100'',''Albert'',null,78,89);


    The value of the prelim in the example above can be later filled in using the
    update statement as follows:


    Let us add one row into the table.


    insert into grades values (''101'',''Robert'',98,93,85);


    To delete a table or row of the table we use the following command:


    ```

    delete grades sid=''100'';

    ```


    This will delete only the row where sid = 100 and no other row. Deleting should
    be used carefully.


    delete grades;


    will result in all rows being deleted. Another way to remove all data in a table
    is truncate.


    truncate table grades;


    To completely remove the table from the database- including structure and values
    use the drop command as follows:


    drop table grades;


    These commands (drop, truncate, delete) must be used with caution in real life
    when working in a company or organization. The following is a summary of the commands
    that one needs to use a database.'
