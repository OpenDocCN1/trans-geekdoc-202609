  md: 'Cookies are aware for a server to store information about the user. Many websites
    require cookies to be enabled before the contents are displayed.


    Cookies have to be sent from the server to the client machine before any other
    information.


    Cookies are sent using the setcookie() function. For example:


    ```

    setcookie(''Cookiename'', This is a test cookie'');

    ```


    There may be a limit of the number of cookies that can be sent from a server to
    a single user.

    Cookie names should follow the naming rules of PHP.


