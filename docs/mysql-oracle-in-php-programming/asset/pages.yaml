  md: '# Chapter 2. HTML and PHP Form


    HTML is required to put PHP to full use. PHP programs can have HTML within it
    and HTML script can have PHP embedded in it.


    The first script in this chapter will request the name and phone number of a person.
    The form will have a box to enter the name and phone number and some radio buttons
    to choose the title of the person''s name.


    The way it works is like this:


    An HTML form/page requests the user to input data. It requests the PHP script
    on the server to process the data request which ultimately will be added to a
    database.


    HTML or a webpage has limited capability to interact with the server when it comes
    to processing. It transfers this task using the <form action = </form> method.


    Let us now write the HTML code for the HTML webpage.


    ```

    <html>

    <head><title>Feedback form</title></head>

    <body>

    <form action="feedback.php">

    Mr.<input type="radio" name="title" value="Mr."/>

    Mrs.<input type="radio" name="title" value="Mrs."/>

    <br>

    Ms.<input type="radio" name="title" value="Ms."/>

    <br>

    <p>Please complete the feedback form</p>

    <p>

    Name: <input type="text" name="name" size="20">

    <p>

    Phone: <input type="text" name="name" size="20">

    <p>

    <input type="submit" name="submit" value="Send my

    response" />

    </form>

    </body>

    </html>

    ```


    The output of this HTML file is as follows: Please note that the feedback.html
    file and its associated feedback.php file is kept in the same location. However,
    this is not a requirement. The files are in separate folders path to the PHP file
    must be included in the <form action > statement.'
  merge: -1
  img_proc: true
