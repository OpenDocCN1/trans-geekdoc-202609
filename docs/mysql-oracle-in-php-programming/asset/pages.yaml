- pgno: 112
  md: '# # Appendix IV. Easy PHP interface


    In this section we look at the different features or interfaces of the editor
    used to write programs in this book. The editor is Easy PHP and it can be downloaded
    from http://www.easyphp.org.


    ![](img/d7e83bd680bb691d653bca3af472a71a_112_0.png)


    The interface can be obtained after installing the latest version of EasyPHP editor.
    Upto version 17 there is no need for an internet connection to complete the installation.
    Once the shortcut appears on the desktop right click and open. As the "E" icon
    appears on the navigation bar of the screen right click and choose open dashboard.
    This will lead to the interface above.


    To start using the editor click on start HTTP server and if database is required
    then click on start Database Server. Note that the default version of PHP in version
    17 is 5.6 and so if that is not what is needed change settings under the HTTP
    server. This is the third button after the red one. Choose version and click ok.


    The portable directory is where the scripts are and it is from here the PHP scripts
    have to be run. The files are located in the eds-www directory under c drive or
    the chosen under EasyPHP. Use a notepad to edit the PHP programs and keep it in
    this directory. It will appear under portable directory.


    The MySQL administration allows one to bring up the PHMyAdmin to create databases
    or tables. The entire administration of the MySQL database is done from here.


    There is no access to other databases as Oracle from this interface. Perhaps in
    later versions of the editor there might be. To activate the OCI8 feature for
    connection to Oracle it is important to find the PHP.ini file. There will two
    of them in this version of the editor as there are two versions of PHP associated
    with it. Find the PHP.ini file for the property you want and to do this go the
    installation folder of EasyPHP. On the computer used for this book it was located
    at:


    ```

    C:\Program Files (x86)\EasyPHP-Devserver-17\eds\binaries\php

    ```'
  merge: -1
  img_proc: true
