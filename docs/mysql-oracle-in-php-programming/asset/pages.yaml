    \ to this a session has the\ncharacteristics.\n\n+   1. They are more secure,\
    \ as the data is on the server only.\n\n+   2. They allow for storage of more\
    \ information than a cookie.\n\n+   3. They can be made to work even if cookies\
    \ are not accepted by the user of the website.\n\nA session is like the English\
    \ meaning of the word (a period of time-like a class session). A\nrandom session\
    \ ID is created when a session starts. This is a reference to that particular\
    \ session\n its stored data.\n\nThe session ID is sent to the web browser as a\
    \ cookie and following PHP pages will use this\ncookie to get the session ID to\
    \ access its data.\n\nTo start or create a session in PHP we start with the session_start()\
    \ function. This function must\nbe of the first lines on every PHP page that uses\
    \ sessions.\n\nThe cookie which is stored on the browser will have a name such\
    \ as PHPSESSID and a value such\nas 3bcc37dc87cb4b54d63f9a23b41f1.\n\nOnce the\
    \ session starts one can record data to it by assigning values to the\nSESSIONarray.\n\
    \n$_SESSION['color'] = 'Yellow';\n\n$_SESSION['age'] = 35;\n\nThe data is written\
    \ to a temporary file stored on the server. Let us look at the following code.\n\
