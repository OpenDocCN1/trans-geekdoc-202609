- pgno: 102
  md: '# Appendix I. Workshop


    The end of any book in programming is only as good as the understanding derived
    from it. The following questions are examples of knowledge that should have been
    obtained from this book or from similar ones.


    +   1. Name any two functions to print a message in PHP?


    Answer: echo(), print();


    +   2. How can an external file be included in a PHP program?


    Answer: The function include() or require() can be used to include an external
    file. The difference is in the way function can give error messages while continuing
    to run the code but require() will terminate the program upon encountering any
    errors.


    +   3. What is the difference between GET and POST methods of transferring data?


    Answer: GET is used to transfer small amounts of data and this data will be visible
    during transfer. POST does not display the values being sent to the PHP program.


    +   4. How are arrays declared in PHP?


    Answer: $fruit = array(''apple'', ''grape'', ''lemon'');


    +   5. Which function will give the number of elements of an array?


    Answer: count(). As in count($array);


    +   6. What is the difference between a session and a cookie?


    Answer: Sessions are stored in the server and cookies are stored in the client
    machines. Cookies have expiration time. Sessions are closed when the browser is
    closed. Users do not have access to data stored in the session.


    +   7. How are cookies created and read?


    Answer: A cookie is created by using the setcookie() function and retrieved using
    the $_COOKIE[''cookie name''] function. Within the setcookie() function the name
    of the cookie, value and duration should be included.


    +   8. Name different ways to write a loop in PHP.


    Answer: While, For and do..while.


    +   9. What is the first step in trying to connect to MySQL database using PHP?'
  merge: -1
  img_proc: true
