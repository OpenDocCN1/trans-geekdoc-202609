  md: 'In the previous chapter the database discussed was MySQL. In this chapter let
    us take a look at the Oracle database with respect to PHP. The Oracle database
    being discussed here is the express version 11.2. Appendix II shows how to install
    it if it is not on the client or standalone machine being to be used.


    To use PHP with Oracle some configuration changes will be needed for the user
    with password. The code for this book was developed using the WAMP editor EasyPHP
    and this has several versions. It is not required to have the latest but the minimum
    version of this editor that will run the code in this book that runs PHP 5 and
    above. The configuration change required to connect to Oracle using or a similar
    one is shown in Appendix III and IV.


    It is very important to write down the default values of the Oracle installation.
    In the example(s) of this chapter the database installed is called orcl. The hr
    user and tables associated with that user is going to be used


    Let us create a table called in the oracle database under the hr user. To do this
    the sql plus from the apps menu in windows under Oracle. The interface will look
    like this. If the account is locked, login as the sybase and use the following
    - alter our account unlock; then connect to hr.


    ![](img/d7e83bd680bb691d653bca3af472a71a_92_0.png)


    To create the employee table, using the following command:


    ```

    create employee (sid varchar2(10), name varchar2(50), manager varchar2(10) constraint
    sid_pk primary key = (sid));

    ```


    This will create the employee table with sid as the primary key. For the purpose
    of this book this simple will be sufficient. Many on SQL might be helpful if SQL
    with Oracle is new to you.


    If the changes to PHP.ini (configuration file) as discussed in Appendix III and
    IV has been done and saved, it is time to get the PHP connectors for Oracle. PHP
    program is being connected to the Oracle database using the PHP OCI8 extension.


    This extension of writing this book can be used to Oracle 12,11, 10 and 9 databases.
    PHP by itself is independent of the Oracle database.


    To connect to the OCI8 PHP class library provides the following functions oci_connect(),
    oci_pconnect and oci_new_connect(). If a no persistent connection is required
    then use oci_connect(). This is also cached. This improves efficiency of connection.


    The cache used by oci_connect is removed after the script has been run or when
    the connection resource has closed.


    The oci_new_connect is not cached while oci_pconnect() is cached and can be used
    across'
