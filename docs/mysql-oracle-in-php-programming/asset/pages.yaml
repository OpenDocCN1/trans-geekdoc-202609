    \ back by the program exits.\nThe insert in the example could be done by another\
    \ method. This method involves using the OCI8 function called oci_bind_by_name().\n\
    ici_bind_by_name() binds a PHP variable to an Oracle place holder. This binding\
    \ improves database performance and is also a way to avoid SQL injection security\
    \ issues. SQL injection is a type of computer attack and also a way in which malicious\
    \ code is embedded in a poorly-designed application and passed to the backend\
    \ database. Bind variables are not treated as part of the SQL statement hence\
    \ decreases the SQL injection issues. The code is as follows:\n\n```\n<?php\n\
