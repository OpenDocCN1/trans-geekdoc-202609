- pgno: 1
  md: '# Overview


    PHP is a programming language to develop dynamic pages for the world wide web.
    HTML or hypertext markup language is the base for developing web pages but pages
    created in HTML are static. PHP allows HTML pages to interact with a database
    and do things like adding data or retrieving data from one.


    In addition, PHP can be used to verify user input and provide protection to pages.
    The prerequisite to understanding PHP is HTML. JavaScript allows dynamism on pages
    however, JavaScript is not server based. It works within the client browser. PHP
    on the other hand is server based. The fact is one needs HTML, JavaScript and
    scripting language like PHP to complete a professional looking and working page.


    This book is about PHP. One may want to consider my book on JavaScript if they
    need a refresher on that subject.


    The webpage for this book is located at: http://beamato.jitbooks


    Before we start:


    To run a PHP script which is a server based script one will need the following:


    A note pad editor or similar to save files with the extention "php". and


    A location to put the script when complete. This can be a hosted site of which
    there are many (free or inexpensive hosting sites) that allow PHP scripts. On
    a standalone computer it is possible to download a free PHP editor software. For
    this book was developed using the EasyPHP editor (version 17) and server which
    can be downloaded and installed for free at the time of writing this book. PHP
    has different versions and the current version is 7. This book is written for
    both version 5 and 7. There are some significant differences between these two
    versions. However, many hosting sites are still using version 5 series.


    The default database that is included in most hosting sites for PHP is MySQL and
    the free editors such as the one mentioned above also come with such database.
    In addition to this database book will explore connection to the Oracle database.
    The Oracle database being used with this book is the stand alone windows version
    11.2g Express version which can be downloaded for free at http://www.oracle.com.'
  merge: -1
  img_proc: true
- pgno: 2
  md: '# # Chapter 1. Introduction


    The first program by an unwritten tradition in any language is "Hello World".
    The way to do that in PHP is as follows:


    Using notepad with a file extention ".php" create a file called (hello.php). Put
    the following lines in that file.


    ```

    <?php

    print "Hello World!!!";

    ?>

    ```


    The print can also be replaced by the word echo.


    Now if one wants to wrap this within HTML tags that is fine such as:


    ```

    <html>

    <body>

    <?php

    print "Hello World!!!";

    ?>

    </body>

    </html>

    ```


    The <? starts the PHP part of the code and ?> ends it. Both of them are mandatory.
    If this code is put on a server that does not have PHP, every line of this code
    will be visible to the user.


    This is actually the first program in PHP in this book.


    ```

    <html>

    <body>

    <?php

    phpinfo();

    ?>

    </body>

    </html>

    ```


    The above code will give the PHP configuration information for the php installation
    on the client''s PHP server.


    All settings will be displayed starting with the version number. Free or inexpensive
    hosting sites at the time of writing have version 5.4 or higher for PHP on their
    servers. Backward compatibility is an important part of programming and even though
    the current version of PHP is higher than this knowledge of features in the old
    and new is very important.'
  merge: -1
  img_proc: true
