  md: 'The feedback html file has three parts- selection of title, name and phone.
    The <form action> statement that this file will connect to a script file for further
    processing. The <form action> is closed by a </form> Now that this html file is
    transferring data to a PHP file- the PHP file must be able to capture the data
    being transferred.


    Observe the <form action> statement, it is missing a method. There are two methods-
    get and post. What is the difference between the two methods?


    The GET method sends all the data gathered as a part of the URL. The POST method
    transmits the data invisibly. Thus choosing GET method might make some vital information
    visible when the submit button is clicked. There is also a limitation on the amount
    of data that can be sent with GET.


    The method of transfer from the feedback.html file will be POST. The following
    change must be made to the feedback.html code in the previous page.


    <form action="feedback.php" method="post">


