    | Zend Engine | (with) Zend Engine v3.0.0, Copyright (c) 1999-2012, The Zend Group*
    |

    | Engine Type | NTS |


    大多数 PHP 托管站点中包含的默认数据库是 MySQL，上述类似的免费编辑器也附带此类数据库。除了此数据库外，本书还将探索与 Oracle 数据库的连接。本书使用的
    Oracle 数据库是 Windows 独立版 11.2g Express 版，可以从 http://www.oracle.com 免费下载。


    PHP 中的变量是数据的容器。变量名对大小写敏感。变量名必须以字母或下划线开头，不能以数字开头。保留字不能作为变量名。变量有四种主要类型：数字、字符串、数组和对象。


    数字变量包括：

    - 整数：1, 2, 3

    - 浮点：1.0, 19.2


    字符串：如果变量是由包含在单引号或双引号内的字符组成的，则它就是字符串。例如：

    - "Hello World"

    - "Hello, $name"

    - "1"

    - "21.07.17"

    - "2017"


    数组：根据定义，数组以索引格式存储。使用键输入数据并使用这些键检索。数组可以是单维或多维的。例如：


    | John | Adam | Mary | Sally |

    | --- | --- | --- | --- |

    | 0 | 1 | 2 | 3 |


    使用索引的数组称为索引数组。使用字符串键的称为关联数组。


    对象被视为高级特性。要定义对象，必须定义其结构类。然后创建该结构的实例。在 C++ 或 Java 等中看到的面向对象编程概念是这种类型变量示例。例如：如果有一个变量叫
    car，那么 car,length 就是 car 对象的特性示例。


    在 PHP 中使用 "=" 赋值运算符向变量赋值。例如：

    ```php

    $ x = 1.5;

    $ y = "John";

    ```


    我们使用 print 函数输出结果。例如：

    ```php

    print "The number is $x";

    ```


