  - "[PAGE 21]\n\n# Chapter 3. Control & Loops\n\nIn every programming language there\
    \ is a control and loop structure. The IF statement is the most common one.\n\n\
    The basic structure of an IF statement in PHP is as follows:\n\n```\nif (condition)\n\
    {\n    statement(s);\n}\n```\n\nThe IF condition can be further enhanced by the\
    \ use of the else in the following manner.\n\n```\nif (condition)\n{\n    statement(s);\n\
    } else {\n    other statement(s);\n}\n```\n\nLet us look at an example. The HTML\
    \ file for the user login page is as follows.\n\n```\n<html>\n<head>\n<title>User\
    \ Login Form</title></head>\n<body>\n<form action=\"login.php\" method=\"post\"\
    >\n<p>\nPlease login, </p>\n<p> Username: <input type=\"text\" name=\"username\"\
    \ size=\"20\">\\p>\n<p> Password: <input type=\"password\" name=\"password\" size=\"\
    20\">\\p>\n<p>\n<input type=\"submit\" name=\"submit\" value=\"Send my details\"\
    \\</p>\n</form>\n</body></html>\n```\n\nIn the code above, a user has to enter\
    \ his/her username and associated password. The password is kept hidden. The HTML\
    \ file above will call upon a PHP file by the name user login. The name of the\
    \ HTML file is login.html. The page will look like this."
  md: "\n![](img/d7e83bd680bb691d653bca3af472a71a_14_0.png)\n\nIn the example above\
    \ we have seen the use of numbers in a PHP program and the mathematical operations\
    \ on them. The example above also illustrated the use of brackets to take into\
    \ account the mathematical precedence order.\n\nNumbers can be formatted using\
    \ many number functions in PHP. Some of the most used number functions are:\n\n\
    - round() -\n  - Example:\n  - round(4,5) = 4\n  - round(4.567,2) = 4.57 means\
    \ rounding to two places after decimal\n  - $x = 200.152\n  - round($x,2); (will\
    \ give 200.15)\n- number_format() -\n  - Example:\n  - number_format(400.43567,2)\
    \ = 400.44\n  - number_format(450,2) = 450.00\n  - number_format(567890321) =\
    \ 567,890,321\n\nThis last example cannot be done by round().\n\n- rand() -\n\
    \  - Example:\n  - $x = rand(); will give a random number\n\nif there is a preference\
    \ for a range of random numbers then:\n\n$x = rand(0, 1000) will give numbers\
    \ within the 0 to 1000 range.\n\nThe rand() function works in version of PHP which\
    \ are 4.2 or higher. Older version than 4.2 had srand() function instead.\n\n\
    getrandmax()\n\nwill get the largest random number that can be created using rand().\n\
    \nceil()\n\nThis function is part of the rand() function and rounds every number\
    \ to the next highest integer.\n(PHP 5)\n\nfloor()\n\nThis function rounds every\
    \ number to the next lowest integer.\n\nabs()\n\nExample:\n\n$x = abs(-25); will\
    \ give 25\n\n$x = abs(25); will give 25\n\nPHP supports trigonometry, exponent,\
    \ base conversion and logarithmic functions.\n\nLet us modify our feedback form\
    \ that we used earlier in this chapter. This time we are going to add a first\
    \ name and last name box in addition to the rest.\n\nThe code for this is follows:\n\
    \n```html\n<html\n<head><title>Feedback form</title></head>\n<body>\n<form action=\"\
    feedback.php\" method=\"post\">\nMr.<input type=\"radio\" name=\"title\" value=\"\
    Mr.\"/>\nMrs.<input type=\"radio\" name=\"title\" value=\"Mrs.\"/>\nMs.<input\
    \ type=\"radio\" name=\"title\" value=\"Ms.\"/>\n<br>\n<p>Please complete the\
    \ feedback form</p>\n<p>First Name: <input type=\"text\" name=\"firstname\"\n\
    ```\n\n```\nsize=\"20\">\n<p> Last Name:<input type=\"text\" name=\"lastname\"\
    \nsize=\"20\">\n<p>Phone:<input type=\"text\" name=\"phone\" size=\"20\">\n<p>\n\
    <input type=\"submit\" name=\"submit\" value=\"Send my response\"/>\n</form>\n\
    </body>\n</html>\n```\n\nNotice the title of the form remains as feedback. The\
    \ only differences are:\n\n- 1. Addition of last name and first name text boxes.\n\
    - 2. The name value for each of the name boxes have been changed. These name values\
    \ will be transferred in the post method to the PHP file.\n\nThe feedback webpage\
    \ will look like this:\n\n![](img/d7e83bd680bb691d653bca3af472a71a_16_0.png)\n\
    \nNow let us modify the feedback.php form to match the webpage above. The code\
    \ will look like this.\n\n```php\n<?php\n$title=$_POST['title'];\n$firstname=$_POST['firstname'];\n\
    $lastname=$_POST['lastname'];\n$phone=$_POST['phone'];\nprint\"Thank you, $title\
    \ $firstname Lastname for your\nfeedback\";\nprint\"<p> Your phonumber, $phone\
    \ has been added to our database;\\n\";\n?>\n```\n\nThe code is not much different\
    \ than the original feedback.php file. We have two names first and last name and\
    \ in the first print function we put $firstname $lastname. If a dot is required\
    \ between names a dot can be put in formatting reasons.\n\nWe want a full name\
    \ we put to add together the first and last name. PHP does allow the same effect\
    \ without using the usual dot between two string variables. This is because of\
    \ the way PHP deals with variables.\n\nThe result of the code above when using\
    \ the new feedback.html web page is as follows.\n\n![](img/d7e83bd680bb691d653bca3af472a71a_17_0.png)\n\
    \nIn PHP there is a term known as magic quotes. If it is turned on in the settings-(check\
    \ phpinfo() as shown earlier) these magic quotes will automatically escape problematic\
    \ characters. This means that single and double quotation marks in strings are\
    \ preceded by a backslash.\n\nThe three types of magic quotes are:\n\n- GPC magic\
    \ quotes that affect data transmitted via the get or post method and data stored\
    \ in cookies.\n- Runtime magic quotes that affect data retrieved from databases\
    \ and command line actions.\n- Sybase magic quotes are special.\n\nThe three types\
