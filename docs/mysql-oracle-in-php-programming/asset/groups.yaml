  - "[PAGE 79]\n\n# Chapter 8. PHP for MySQL Database\n\nIn this chapter, the emphasis\
    \ is to write a PHP code targeting a MySQL database and table. If this script\
    \ is being run first on an editor on a standalone computer or notebook, then the\
