    \ the example does not commit changes. If this is needed then oci_commit() has\
    \ to be used similar to the example above. If not used any changes will be rolled\
    \ back by the program exits.\n\nThe insert in the example could be done by another\
    \ method. This method involves using the OCI8 function called oci_bind_by_name().\n\
    oci_bind_by_name() binds a PHP variable to an Oracle placeholder. This binding\
    \ improves database performance and is also a way to avoid SQL injection security\
    \ issues. SQL injection is a type of computer attack and also a way in which malicious\
    \ code is embedded in a poorly-designed application and passed to the backend\
    \ database. Bind variables are not treated as part of the SQL statement hence\
    \ decreases the SQL injection issues. The code is as follows:\n\n```php\n<?php\n\
    $db = oci_connect('hr', 'hr', 'orcl');\nif (!$db) {\n    trigger_error('Unable\
    \ to connect to database', E_USER_ERROR);\n}\n$sql = \"insert into employee (sid,name,manager)\
    \ values\n(:sid_by,:name_by_name,:manager_by)\";\n$stmt = oci_parse($db, $sql);\n\
    $sid='104';\n$name='Adam';\n$manager='102';\noci_bind_by_name($stmt, \"sid_by\"\
    , $sid);\noci_bind_by_name($stmt, \"name_bv\", $name);\noci_bind_by_name($stmt,\
    \ \"manager_bv\", $manager);\noci_execute($stmt,OCI_NO_AUTO_COMMIT);\noci_commit($Db);\n\
    oci_close($Db);\n?>\n</body>\n</html>\n```\n\nThe code creates three bind variables\
    \ denoted by the _bv ending and values to the insert statement is sent via reference\
    \ in the bind statement associated with $sql.\n\nThe code for updating a row in\
    \ an oracle database table is as follows:\n\n```php\n<?php\n$Db = oci_connect('hr',\
    \ 'hr', 'orcl');\nif (!$Db) {\n    trigger_error('Unable to connect to database,\\\
    n', E_USER_ERROR);\n}\n$sql = \"update employee set manager='102'\\nsid='103'\"\
    ;\n$stmt = oci_parse($Db, $sql);\noci_execute($stmt,OCI_NO_AUTO_COMMIT);\noci_commit($Db);\n\
    oci_close($Db);\n?>\n```\n\nThe code for deleting rows or dropping a table can\
    \ be obtained from the above provided permission to do these these are given by\
    \ the administrator.\n\n```php\n<?php\n$Db = oci_connect('hr', 'hr', 'orcl');\n\
    if (!$Db) {\n    trigger_error('Unable to connect to database,\\n', E_USER_ERROR);\n\
    }\n$sql = \"delete employee where sid='103'\";\n$stmt = oci_parse($Db, $sql);\n\
    oci_execute($stmt,OCI_NO_AUTO_COMMIT);\noci_commit($Db);\noci_close($Db);\n?>\n\
    ```\n\n# Chapter 10. Regular Expressions\n\nRegular expressions are found in all\
    \ programming languages to take into consideration the format of some inputs.\
    \ For example, the postal code or zip code in many countries are not in the same\
    \ format as in the United States.\n\nPHP supports two types of regular expressions\
    \ - POSIX extended and PCRE which is Pearl compatible. Note: The information below\
    \ is applicable for PHP version 5 only. Even in version 5 some will not accept\
    \ the functions below. Functions in PHP 7 are shown at the end of this chapter.\n\
    \nPOSIX has six functions in PHP and that they are:\n\n- ereg() - Match a pattern\
    \ and is case sensitive.\n- eregi() - Match a pattern and is not case sensitive.\n\
    - ereg_replace() - Matches and replaces a pattern and is case sensitive.\n- eregi_replace()\
    \ - Matches and replaces a pattern and is not case sensitive.\n- split() - Splits\
    \ a string using a pattern and is case sensitive.\n- spliti() - Splits a string\
    \ using a pattern and is not case sensitive.\n\nMetacharacters help to create\
    \ patterns to test the input string against:\n\n- . is a period meaning any single\
    \ character.\n- ^ is a caret which means beginning of a string.\n- $ means end\
    \ of a string.\n- | means alternatives (or).\n- () means group.\n\nQuantifiers:\n\
    \n- ? - zero or one occurrences.\n- * - zero or more occurrences.\n- + - One or\
    \ more occurrences.\n- (x) - Exactly x occurrences.\n- {x, y} - Between x and\
    \ y occurrences (inclusive).\n- {x,} - At least x occurrences.\n\nCharacter classes:\n\
    \n- [a-z] - any lowercase letter.\n- [A-Z] - any uppercase letter.\n- [0-9] -\
    \ any digit.\n- [[:alnum:]] - alphanumeric character.\n- [[:alpha:]] - any letter.\n\
    - [[:digit:]] - any digit.\n- [[:punct:]] - any punctuation character.\n- [[:space:]]\
    \ - any white space.\n- [[:blank:]] - any space.\n\n```php\n<?php\n$db = oci_connect('hr',\
    \ 'hr', 'orcl');\nif (!$db) {\n    trigger_error('Unable to connect to database,\\\
    n', E_USER_ERROR);\n}\n// ... rest of code\n```\n"
