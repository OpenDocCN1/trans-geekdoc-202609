    \nPHP 支持两种类型的正则表达式 - POSIX 扩展正则和与 Perl 兼容的 PCRE。注意：以下信息仅适用于 PHP 5 版本。即使在第 5 版本中，某些环境也不会接受以下函数。PHP\
    \ 7 中的函数显示在本章末尾。\n\nPOSIX 在 PHP 中有六个函数，它们是：\n\n- ereg() - 匹配模式且区分大小写。\n- eregi()\
    \ - 匹配模式且不区分大小写。\n- ereg_replace() - 匹配并替换模式且区分大小写。\n- eregi_replace() - 匹配并替换模式且不区分大小写。\n\
    - split() - 使用模式分割字符串且区分大小写。\n- spliti() - 使用模式分割字符串且不区分大小写。\n\n元字符有助于创建模式，以测试输入字符串：\n\
