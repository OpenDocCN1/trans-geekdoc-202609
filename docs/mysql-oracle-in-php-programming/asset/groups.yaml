    strlen() -


    This returns the number of characters in a string. This will include punctuation
    and spaces.


    str_replace() -


    This is the same as the str_replace except that it is a case sensitive version
    of the same.


    str_word_count() -


    This returns the number of words in a given string using space as a delimiter.
    Note that this function is available in PHP version 4.3 and higher only.


    strstr() -


    This searches a string for the first occurrence of the search pattern given to
    the function.


    strpos() -


    This searches a string and returns the numeric position of the search pattern
    given to the function.


    strcmp() -


    This is used to compare two strings by returning a whole number.


    strnatcmmp() -


    This is similar to strcmp() but considered to be more precise linguistically.


    strcasecmp() and strnatcasecmp() -


    These are case insensitive companions of strcmp() and strnatcmmp().


