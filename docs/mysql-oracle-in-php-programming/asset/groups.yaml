  - '[PAGE 74]


    location in (''Miami'', ''Chicago'');


    Notice that when values are text -they have to be enclosed within single quotes.
    Numbers do not have to. If we change the last line of this query to location not
    in (''Miami'', ''Chicago'') then only names of those located in cities other than
    Miami or Chicago will be shown. The result of this query will be on those located
    in two cities.


    | sid | name | job | salary | location |

    |---|---|---|---|--|

    | 103 | Martha | Receptionist | 1500 | Chicago |

    | 104 | John | Accountant | 5000 | Chicago |

    | 105 | Sandy | Trainee | 1000 | Miami |

    | 106 | James | Lawyer | 7000 | Miami |


    Let us look at this query:


    +   * from staff

    where

    salary > 3000

    and salary < 6000;


    The query is requesting those who have a salary between 3000 and less than 6000.
    The query will produce the following result:


    | sid | name | job | salary | location |

    |---|---|---|---|--|

    | 101 | Albert | Administrator | 3000 | Atlanta |

    | 104 | John | Accountant | 5000 | Chicago |


    The same query could be written as follows:


    +   * from staff

    where

    salary between 3000 and 6000;


    The following query takes a look at the "like" operator:


    +   Select * from staff

    Where

    Name like ''R%'';


    This will give the following result:


    | sid | name | job | salary | location |

    |---|---|---|---|--|

    | 100 | Robert | Manager | 8000 | Atlanta |


    It is the only name that starts with an R. Martha too has the alphabet "r" but
    it is not at the'
  - '[PAGE 75]


    starting position.


    It is possible to call a select query from another query. The following is an
    example that shows this along with the use of the "Exists" operator.


    select name from staff

    where exists

    (select name from staff where salary > 5000); The result will be:


    | name |

    | Robert |

    | Albert |

    | Sally |

    | Martha |

    | John |

    | Sandy |

    | James |


    If we change the query slightly and try the query below, we will get no responses.


    select name from staff

    where exists

    (select name from staff where salary > 8000);


    An example of the use of the "ALL" operator:


    select * from staff

    where

    location = all (select location from staff where salary = 3000);


    | sid | name | job | salary | location |

    | 100 | Robert | Manager | 8000 | Atlanta |

    | 101 | Albert | Administrator | 3000 | Atlanta |

    | 102 | Sally | Secretary | 2000 | Atlanta |


    The result will be the info for all the staff in the location of Atlanta.


    An example of the use of the "ANY" operator:


    select * from staff

    where

    location = any (select location from staff where salary = 3000);


    | sid | name | job | salary | location |

    | 100 | Robert | Manager | 8000 | Atlanta |'
  - '[PAGE 76]


    | 101 | Albert | Administrator | 3000 | Atlanta |

    | 102 | Sally | Secretary | 2000 | Atlanta |


    When using any database, it is best to use small letters for field names and queries.


    Change the query as follows:


    ```

    select * from staff

    where

    location = any (select location from where salary > 3000);

    ```


    Each location with a salary greater than 3000 will be found. In this case all
    three cities have at least one person having a salary greater than 3000. Thus
    the first part of the query will print all the rows in the table. There will be
    seven rows.


    The commands given thus can work in the databases such as MySQL, Oracle and Microsoft''s
    Access.


    If an editor is used to develop PHP scripts on your computer before uploading
    to the website, then the first thing to do is find if it comes with PHPMyAdmin
    or not.


    The examples in this book were developed using the EasyPHP editor which is available
    at the following website: http://www.easyphp.org. current version of PHP at the
    time of writing this book version 7 and its interface was shown in chapter 1.
    The interface below is for PHP 5 series.


    ![](img/d7e83bd680bb691d653bca3af472a71a_76_0.png)


    Click on the MySQL Administration-PHPMyAdmin module or in version 7 start database
    before clicking on PHPMyAdmin in the middle of the interface page.


    A page that looks like this will appear.'
  - '[PAGE 77]


    As be seen the databases can be created using the new link on the left hand side
    above. C-Panel on all Unix/Linux based hosting will give a similar screen also.


    The menu on top of the above picture lists one databases associated with their
    account or installation in addition to adding SQL commands, Export and import
    allows for back up databases and input of bulk data.


    Using a developer software such as EasyPHP one can mimic a real hosting environment.
    The most important part of this is to find the path of the database. This will
    be different slightly technical facts sheet. To create a table such as staff click
    on the structure tab and put in the name and number of columns as shown below.


    To complete the table creation, enter the data types and field lengths of each
    field of the staff table and select sid as the primary key. Primary key is a field
    whose value does not repeat and is required. The fields of the staff table introduced
    earlier are sid name, job, salary and location. Out of these all are text except
    for salary which is a number.


    The following shows the table field details.'
