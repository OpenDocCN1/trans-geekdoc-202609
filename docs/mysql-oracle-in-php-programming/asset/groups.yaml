    ```


    ```php

    unset($car[''name'']);

    ```


    应用于整个数组时整个数组将被删除。要重置数组而不删除数组变量，使用 `array()` 函数。例如：


    ```php

    $car =array();

    ```


    看下面的代码。


    ```php

    php

    print"This script will print an array of cars";

    $car = array(''Toyota'', ''GM'', ''Ford'', ''Nissan'');

    unset($car[2]);

