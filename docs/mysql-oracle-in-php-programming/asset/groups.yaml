    \ 表示分组。\n\n量量词：\n\n- ? - 0 次或 1 次。\n- * - 0 次或多次。\n- + - 一次或多次。\n- (x) - 正好 x\
    \ 次。\n- {x, y} - 在 x 到 y 次之间（包含边界）。\n- {x,} - 至少 x 次。\n\n字符类：\n\n- [a-z] - 任何小写字母。\n\
    - [A-Z] - 任何大写字母。\n- [0-9] - 任何数字。\n- [[:alnum:]] - 字母数字字符。\n- [[:alpha:]] - 任何字母。\n\
    - [[:digit:]] - 任何数字。\n- [[:punct:]] - 任何标点符号。\n- [[:space:]] - 任何空白字符。\n- [[:blank:]]\
