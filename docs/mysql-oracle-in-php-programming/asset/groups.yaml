    # Chapter 10. Regular Expressions


    Regular expressions are found in all programming languages to take into consideration
    the format of some inputs. For example, the postal code or zip code in many countries
    are not in the same format as in the United States.


    PHP supports two types of regular expressions - POSIX extended and PCRE which
    is Pearl compatible. Note: The information below is applicable PHP version 5 only.
    Even in version 5 some will not accept the functions below. Functions in PHP 7
    are shown at the end of this chapter.


    POSIX has six functions in PHP and that they are:


    ereg() - Match a pattern and is case sensitive.


    regi() - Match a pattern and is not case sensitive.


    ereg_replace() - Matches and replaces a pattern and is case sensitive.


    egi_replace() - Matches and replaces a pattern and is not case sensitive.


    split() - Splits a string using a pattern and is case sensitive.


    spliti() - Splits a string using a pattern and is not case sensitive.


    Metacharacters help to create patterns to test the input string against.


    +   . is a period meaning any single character?


    +   ^ is a caret which means beginning of a string.


    +   $ means end of a string.


    +   | means alternatives (or).


    +   () means group.


    Quantifiers:


    +   ? - zero or one occurrences.


    +   * - zero or more occurrences.

    + - One or more occurrences.


    +   (x) - Exactly x occurrences.'
