    \n- round() -\n  - 示例：\n  - round(4,5) = 4\n  - round(4.567,2) = 4.57，意味着保留小数点后两位\n\
    \  - $x = 200.152\n  - round($x,2); (将得到 200.15)\n- number_format() -\n  - 示例：\n\
    \  - number_format(400.43567,2) = 400.44\n  - number_format(450,2) = 450.00\n\
    \  - number_format(567890321) = 567,890,321\n\n最后一个示例无法通过 round() 完成。\n\n- rand()\
    \ -\n  - 示例：\n  - $x = rand(); 将得到一个随机数\n\n如果偏好使用某个随机数范围，那么：\n\n$x = rand(0, 1000)\
    \ 将给出 0 到 1000 范围内的数字。\n\nrand() 函数适用于 4.2 或更高版本的 PHP。比 4.2 更旧的版本则使用 srand() 函数。\n\
