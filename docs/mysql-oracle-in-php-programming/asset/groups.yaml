    The address of John is:

    101, Orchard Lane

    Columbia

    SC

    29208


    The location of the script will vary according to the editor. In EasyPHP editor
    it is possible to run this script under the projects folder in the older versions
    (12 through 14) or in the eds-www folder if in version 17.


    If an error occurs and it will from time to time-- read the error message, go
    back to the code written in notepad or editor or correct the code in and around
    the line number given in the error message.


    Single quotes mean the item within them should be taken literally. Double quotes
    means that the values of the item within the quotes should be taken.


    For example:


    $name = ''John'' and $name = "John" will give the same result.


    but


    $name = "$firstname" and $name = "$firstname" will give two results.


    Value of firstname= John and $firstname.


    It is possible to assign to a variable the value of another variable as:


    $name = $firstname;


    It is best to use double quotes and that is what will be used throughout the rest
    of this book. In addition to the print function there is another function called
