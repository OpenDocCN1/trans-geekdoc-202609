    \ 可用的方法包括：\n- OCI_COMMIT_ON_SUCCESS - 当语句执行成功时，将自动提交连接未提交的更改。这是默认值。\n- OCI_DEFAULT\
    \ - 这是一个旧方法，在正在使用的 OCI8 版本中可能可用，从 PHP 5.2 之后就不建议使用此方法。\n- OCI_NO_AUTO_COMMIT -\
    \ 像示例中使用的那样，不会提交更改。如果需要，则必须像上面的示例那样使用 `oci_commit()`。如果不使用，任何更改将在程序退出时被回滚。\n\n\
    示例中的插入操作可以通过另一种方法完成。该方法涉及使用名为 `oci_bind_by_name()` 的 OCI8 函数。\n`oci_bind_by_name()`\
