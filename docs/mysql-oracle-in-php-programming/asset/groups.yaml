    # Chapter 4. Arrays


    An Array was mentioned as a variable type in the beginning of the book. An array
    can consist of numbers and strings. The array is given a name similar to a variable
    and the it has the ability to hold more than one value.


    Example: An array can be made to include a list of cars as shown below.


    ```

    $car1 = ''Toyota'';

    ```


    ```

    $car2 = ''GM'';

    ```


    ```

    $car3 = ''Ford'';

    ```


    ```

    $car4 = ''Nissan'';

    ```


    Array variable naming is as follows:


    +   1. Start with a $ sign.


    +   2. Continue with a letter or underscore.


    +   3. Finish with any combination of letters or numbers or the underscore.


    An array variable has an index starts. An array stands out from other variables
    with the presence of the [brackets]. Thus, $car[] is an array variable.


    The $car[3] stands for a specific element of the array at index position 3.


    To create an array in PHP using the cars example as follows:


    ```

    $car = array(''Toyota'', ''GM'', ''Ford'', ''Nissan'');

    ```


    The indexes are automatically assigned by PHP server. Here the model Toyota is
    indexed at 0. Array indexation automatically starts with 0. This can be changed
    if needed.


    In the car example, we can specifically put the model Toyota at index position
    1 by doing the following.


    ```

    $car =array(1=>''Toyota'', 2=>''GM'', 3=>''Ford'', 4=>''Nissan'');

    ```


    For most purposes leaving the PHP server to index the values in the default manner
    will sufficient.


    ```

    <?php

    print("This script will print an array of cars");

    ```'
