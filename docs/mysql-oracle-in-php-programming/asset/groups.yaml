    \ a staff table was shown. This table will be used in this chapter to demonstrate\
    \ the select, insert, update and delete queries.\n\nThe first step in getting\
    \ data from a table in the database or adding data to it is to connect to MySQL\
    \ in. The examples that follow are for PHP version 5 series. For version 7 check\
    \ of end chapter.\n\nTo this end the function mysql_connect is used to connect\
    \ to MySQL in PHP when the target opened has to be closed in programming so the\
    \ mysql_close() function plays this role.\n\n```\n<html>\n<body>\n<?php\nif($conn=mysql_connect('localhost','root','''))\
    \ {\n  print(\"Connected to MySQL.\");\n  mysql_close();\n} else {\n  print(\"\
    Could not connect to MySQL.\");\n}\n?>\n</body>\n</html>\n```\n\nThe connection\
    \ mechanism is shown above in the PHP script. The line mysql_connect('localhost','root','')\
    \ will be slightly different on the webhost being used. The localhost is followed\
    \ by a username and password.\n\nIn the case of a developer software on a standalone\
    \ machine the username is usually root but this needs to be verified in the help\
    \ manual of PHP editor being used.\n\nNow the second step after connecting to\
    \ MySQL, is to connect to the selected database followed by the table to do some\
    \ action. Let us start our example of the action by selecting the select or retrieval\
