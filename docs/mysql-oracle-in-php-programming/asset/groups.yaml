    The comparison operators are therefore:


    | | |

    |---|---|

    | = | to compare values of variables |

    | != | Not equal to. |

    | > | Greater than. |

    | < | Less than. |

    | >= | Greater than and equal to. |

    | <= | Less than and equal to. |

    | <> | Compares two values are equal or not. |


    If values are not equal condition becomes true. Logical operators in SQL are as
    follows:


    | | |

    | AND | Multiple conditions each which has to be satisfied. |

    | OR | Any of the conditions need to be satisfied. |

    | ALL | Used to compare a value to all values in another value-set.

    | ANY | Used to compare a value to any applicable value in the list as the condition.
    |

    | BETWEEN | Used to search for values that are within a set of values, given the
    minimum value and the maximum value. |

    | EXISTS | Used to search for the presence of a row in a specified table that
    meets a criterion. |

    | IN | Used to compare a value to a list of literal values that have been specified.
    |

    | LIKE | Used to compare a value to similar values using wildcard operators. |

    | NOT | Used with other logical operators to negate the effect. |

    | IS NULL | To find if a value is null. |

    | UNIQUE | searches each row of table for uniqueness. |


