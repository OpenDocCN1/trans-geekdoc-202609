    # PHP 程序中的 MySQL 与 ORACLE


    ![](img/d7e83bd680bb691d653bca3af472a71a_0_0.png)


    KELVIN STRONG


    # 概述


    PHP 是一种用于开发万维网动态页面的编程语言。HTML 或超文本标记语言是开发网页的基础，但 HTML 创建的页面是静态的。PHP 允许 HTML 页面与数据库交互，并执行如添加数据或从中检索数据等操作。


    此外，PHP 可用于验证用户输入并为页面提供保护。理解 PHP 的前提是 HTML。JavaScript 让页面具有动态性，但 JavaScript 不是基于服务器。它在客户端浏览器中运行。而
    PHP 是基于服务器的。事实上，人们需要 HTML、JavaScript 和像 PHP 这样的脚本语言来完成一个专业且功能良好的页面。


    本书是关于 PHP 的。如果他们需要复习该主题，可以考虑我写的关于 JavaScript 的书。


    本书的网页地址位于：http://beamato.jitbooks


    在我们开始之前：


    要运行基于服务器的 PHP 脚本，需要以下条件：


    - 一个记事本编辑器或类似的编辑器，用于保存扩展名为 "php" 的文件；以及

    - 一个完成后存放脚本的地方。这可以是一个托管站点，有很多（免费或廉价的托管站点）允许 PHP 脚本。在独立计算机上，可以下载免费的 PHP 编辑器软件。本书是使用
    EasyPHP 编辑器（版本 17）和服务器开发的，这些工具在编写本书时可以免费下载和安装。PHP 有不同的版本，当前版本是 7。本书针对版本 5 和 7
    编写。这两个版本之间存在一些显著差异。然而，许多托管站点仍然在使用版本 5 系列。


    大多数 PHP 托管站点中包含的默认数据库是 MySQL，上述类似的免费编辑器也附带此类数据库。除了此数据库外，本书还将探索与 Oracle 数据库的连接。本书使用的
    Oracle 数据库是 Windows 独立版 11.2g Express 版，可以从 http://www.oracle.com 免费下载。


    # 第 1 章 引言


    任何语言中一个不成文的传统的第一个程序都是“Hello World”。在 PHP 中实现该程序的方法如下：


    使用扩展名为 ".php" 的记事本创建一个名为 (hello.php) 的文件。在该文件中写入以下行。


    ```php

    <?php

    print "Hello World!!!";

    ?>

    ```


    `print` 也可以用单词 `echo` 替换。


    现在，如果想将其封装在 HTML 标签中也是可以的，例如：


    ```html

    <html>

    <body>

    <?php

    print "Hello World!!!";

    ?>

    </body>

    </html>

    ```


    `<?php` 开始代码的 PHP 部分，`?>` 结束它。两者都是强制性的。如果将此代码放在没有安装 PHP 的服务器上，这段代码的每一行都对用户可见。


    这实际上是本书中 PHP 的第一个程序。


    ```html

    <html>

    <body>

    <?php

    phpinfo();

    ?>

    </body>

    </html>

    ```


    上述代码将提供客户端 PHP 服务器上 php 运行的 PHP 配置信息。


    所有设置都将从版本号开始显示。在编写本书时，免费或廉价的托管站点在其服务器上的 PHP 版本为 5.4 或更高。向后兼容性是编程的一个重要部分，尽管 PHP
    的当前版本高于此版本，但了解旧新版本的特性知识是非常重要的。


    如果当前的 PHP 版本（即 7）`phpinfo()` 的示例输出将如下：


    ![](img/d7e83bd680bb691d653bca3af472a71a_3_0.png)


    | Name | Value |

    | --- | --- |

    | System | Windows NT PC v6.2 build 8230 (Intel) Windows Business Edition KB663
    |

    | Date | 01 Jul-2012 14:29:22 UTC |

    | Configure | -d |

    | Architecture | x86 |

    | Command Line | --with-config-file-path="C:\php" --enable-opcache --enable-mbstring
    --enable-curl --enable-filter=gd --with-zlib --with-openssl --with-readline --with-readline
    --with-iconv --enable-pcntl --enable-process-control --enable-shared-memory --enable-xml
    --enable-xmlreader --with-libgd --with-libjpeg2 --with-libcurl --enable-fixed-strings
    --with-libxml |

    | PHP API | 2.0-Handler |

    | Script API | C |

    | Directory | C:\php |

    | Upload max_filesize | 2M |

    | Post max_size | 8M |

    | Configuration File | C:\Program Files\PHP\PHP5.4.2\htroot\phpinfo.ini |

    | Start Time | 01 Jul-2012 14:29:22 UTC |

    | Server Software | Microsoft IIS |

    | Server Version | |

    | PHP Version | 5.4.2 |

    | Zend Engine | (with) Zend Engine v3.0.0, Copyright (c) 1999-2012, The Zend Group*
