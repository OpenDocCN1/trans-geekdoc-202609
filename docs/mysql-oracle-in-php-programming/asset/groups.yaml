    # Chapter 5. Web Application Components


    The subject of PHP files needs knowledge of HTML in the minimum. In addition to
    this knowledge of Cascading Style Sheets (CSS), Java script and Structured Query
    Language can greatly enhance the ability to create dynamic, rich looking web pages.


    This book does not go into development of CSS or Java Script in detail. However,
    an essential background will be given in SQL in the database part of this book.


    In this chapter some important components of making a web application will be
    looked at.


    External files may be used in a PHP program. For example, to create a header or
    footer for a page. To do this first create a header.html and footer.html file
    or the files can be PHP files too.


    These external files can be included in a PHP program by using one of two functions-
    include() and require().


    They are used in the following manner.


    ```

    include(''footer.html'');

    ```


    or


    ```

    include(''footer.php'');

    ```


    or


    ```

    require(''header.html'');

    ```


    or


    ```

    require(''header.php'');

    ```


    The code will be executed at the point where these functions are called. After
    execution the code will continue from the line below below the include or require
    function. The difference between the two functions is that when using include()
    if there is an error the PHP server will give a warning but will continue to run
    other code lines.


    In case of require() if the execution of the included file fails the program terminates.


    The example above assumes that the PHP program using include () or require() is
    in the same folder as the file being called. If not the absolute or relative paths
    to the file must be provided within the brackets of the function.


    An example of a relative path is - require(''./footer.html'');


    An example of an absolute path is - require(''c:\users\desktop\header.php'');'
