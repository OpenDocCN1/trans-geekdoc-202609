    Always comment a code in which ever language the program is written.


    # Variables:


    Like any programming language PHP is not exempt from variables and like the other
    languages variables are containers of data. Popular x, y and z taking on different
    values is also available in PHP.


    Variables are given reasonable names that identify what they stand for or what
    is expected. No reserved words of PHP can be used as a variable.


    Variable names are case sensitive. Following the $ sign which is required for
    a variable name in PHP the name must begin with a letter (A-Z or a-z) or an underscore
    (_). The name cannot start with a number. This rule is not new many languages
    have this but the $ sign is a requirement is a must in PHP. No spaces are allowed
    within the name except for the underscore.


    There are four main categories of variables in PHP - numbers, strings, arrays
    and objects.


    # Number variables consist of the following:


    Integer - 1,2,3, -1, -etc


    Floating point - 1.0, -19.2 etc


    Date types in PHP consist of numbers and strings are not specifically defined
    as a variable type.


    # Strings:


    A variable is a string if it consists of characters enclosed within a pair of
    either single or double quotation marks.


    Example: "Hello World"


    ```

    "Hello, $name"

    ```


    ```

    "1"

    ```


    ```

    "21.07.17"

    ```


    ```

    "2017"

    ```'
  - '[PAGE 5]


    # Arrays:


    Arrays by definition store data in index format. The data is entered using keys
    and retrieved using these keys. The arrays can be single or of multiple dimensions.


    Example:


    | John | Adam | Smith | Mary | Sally |


    Where John is at index 0 and Adam at key 1 and so forth until Sally is at index
    at 4. The size of this single dimension array is 5 (0-4).


    The arrays that use their keys are called a indexed array. An array that uses
    strings keys is called an associative array.


    Arrays are an important part of any programming language.


    # Object:


    Objects are considered as an advanced feature. To define an object, its structure
    called the class has to be defined. Then instances of that structure are created.


    The concept of object oriented programming as seen in C++ or Java etc is an example
    of this type of variable.


    For example: if there is a variable called car then car, length is an example
    of the feature of the car object.


    Values are assigned to variables in PHP using the "=" assignment operator.


    Example:


    ```

    $ x = 1.5;

    ```


    ```

    $ y = "John";

    ```


    To print out the result we use the print function.


    Example:


    ```

    print "The number is $x";

    ```


    Now let us create a PHP program that will print the name and address of a person
    by the name John.


