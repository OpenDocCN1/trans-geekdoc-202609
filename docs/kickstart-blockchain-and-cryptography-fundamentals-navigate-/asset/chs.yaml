  \n\n\n虽然跨链互操作协议有助于异构区块链之间的通信，但跨跨链协议的设计旨在为同质区块链之间提供通信。\n\n`Polygon` 与 `Avalanche`\
  \ 之间的信息交换是跨链协议的一个示例。跨链互操作协议的一个实例是 `Ethereum` 和 `Bitcoin` 等加密货币之间的数据交换。由于源链和目标区块链系统的哈希策略、共识算法、区块大小、执行环境和网络架构可能存在差异，设计跨链互操作协议被认为是一项挑战性任务。\n\
  \n# Avalanche\n\n一个著名的去中心化金融（DeFi）区块链是 `Avalanche`。`Trader Joe`、`Wonderland`、`BenQi`、`Curve`、`AAVE`\
  \ 和 `Wonderland` 是利用 `Avalanche` 的主要 DeFi 协议。\n\n凭借每秒 4500 次交易（TPS）的事务能力，领先的 DeFi\
  \ 协议 `Avalanche` 远超 `Bitcoin` (7 TPS)、`Ethereum` (14 TPS) 和 `Polkadot` (1,500 TPS)。`Avalanche`\
  \ 的原生代币被称为 `AXAX`，用于质押、支付费用并作为在 `Avalanche` 之上构建的各种子网的记单位。\n\n## Polygon (MATIC)\n\
  \n为了解决这个问题，`Polygon` 提供了许多商品和服务。\n\n注意：`Ethereum` 的区块链昂贵且速度缓慢。因此，`Polygon` 的 SDK\
  \ 通过允许创建 `Ethereum` 侧链改进了这一点，侧链是通过通双向锚定（two-way peg）与 `Ethereum` 连接的区块链。这些侧链有多种形式，包括：\n\
  \n*   将交易分组并作为单个批次提交到 `Ethereum` 区块链的能力（`Plasma Chains`）。\n*   将多次转账合并为单次交易的能力被称为\
  \ `ZK-Rollups`。\n*   拥有 `Ethereum` 智能合约扩展的 Plasma 链（`Optimistic Rollups`）。\n\n`MATIC`\
  \ 是 `Polygon` 的原生代币，其用途包括如下：\n\n*   支付网络中的交易费用。\n*   在 `Polygon` 生态系统中整合支付和结算单位的特性。\n\
  *   为 `Polygon` 权益证明侧链提供动力。\n\n通过检查它们之间交换的信息来识别和验证记录在一条链上的另一条链上的数据并非不可能，而是非常困难。\n\
  \n跨区块代币转账涉及若干挑战，例如：\n\n*   开发一种在区块链上发行代币的方法，当代币离开区块链时禁用。代币在整个区块链中进行重新平衡以保持流动性。\n\
  *   确定区块链的哪些属性对于跨链传输是必要的。\n*   选择哪种区块链适用于跨链传输。\n\n## 加密代币\n\n随着出现越来越多的区块链系统（即使是那些支持加密货币的系统），区块链互操作性正成为一个重要话题。其目标是支持资产从一个区块链系统转移到另一个区块链系统。\n\
  \n在技术术语中，“token”是“加密资产”或“加密货币”的另一个同义词。但根据上下文，它逐渐意味着几个更多不同的含义。首先，将描述除 `Bitcoin` 和\
  \ `Ethereum`（理论上它们也是代币）之外的所有加密货币。其次是解释特定的数字资产，例如运行在另一种加密货币区块链之上的若干去中心化金融（DeFi）代币。代币存在大量的潜在用途，从视频游戏中稀有物品的销售到促进去中心化交易所的运营等。但与任何其他加密货币一样，它们都可以被拥有或交换。\n\
  \n`THORChain` 构建在 `Cosmos` 区块链上，是一种去中心化流动性协议，专门用于跨链连接，允许交易者在不同网络之间交换代币。它使用去中心化流动性协议允许用户在无许可的环境下交换资产。它通过充当金库管理器实现了\
  \ `BTC` 等原生层 1 资产的交换。`THORChain` 使用 `Tendermint` 和 `Cosmos` 来维护网络安全。\n\n## 跨链技术\n\
  \n跨链协议使得不同的网络更容易相互通信并允许数据共享。用户可以通过跨链协议直接进行通信。因此，具有相似网络的区块链可以交换价值和信息。\n\n有效的，跨链设计通过在安全性、去中心化和效率之间进行权衡来促进互操作。这可以减少碎片化、提高效率并促进不同区块链之间的无缝流动。\n\
  \n跨区块互操作性是一种在不需要中间人的情况下促进多个区块链之间通信的特性。这基本上意味着可以在相似的网络之间传输价值。\n\n## 跨链的主要特征\n\n以下是跨链技术的主要特征：\n\
  \n*   该技术基于原子性原理工作。\n*   它实现了多个区块链之间的良好一致性。\n*   它实现了网络在不同平台上的分布。\n\n# 跨链技术的方法\n\
  \n每个网络以其独特的方式使用区块链互操作性来促进不需要第三方界面的交易。以下是隔离跨链交易的一些流行且为人知的方法：\n\n*   原子交换（Atomic Swaps）：被称为\
  \ `Atomic Swaps` 的交易所经纪允许双方在多个区块链之间交换代币。这种方法不需要中心化的第三方来促进交易。相反，它促进了用户进行点对点的直接代币交易。这种机制要么完成整个过程，要么根本不启动。例如，双方可以决定为原子交换设置一小时的限制。在这种情况下，即使没有满足所有条件，原始所有者在一个小时后也将收到他们存入的代币。\n\
  \n\n\n\n## 中继节点 (Relays)\n\n- 中继节点：由于 `Relays` 功能，区块链网络可以监控在其他链上发生的事件和交易。它们在链与链之间运行，允许单个合约作为多条链上其他节点的核心，而无需分散的节点。因此，它可以独立地验证完整的交易历史和单个区块头。除了这两种方法外，跨链技术还遵循其他多种运行方式。合并共识（Merged\
  \ consensus）是实现多个网络之间双向互操作的方法之一。另一方面，一组特定的验证方也会汇聚在一起检查事件。\n\n## 跨链技术的优势\n\n尽管跨链机制在促进互操作性方面发挥着重要作用，但它们也有许多其他优势。跨链技术提供的许多重要优势包括：\n\
  \n- 建立稳固连接并促进两个不同网络之间的高效通信的能力是其最大的特征之一。它通常用于启动代币交换和资产转移，因此区块链的不兼容性不再是一个问题。此外，它还便于用户传输数据，包括资产、交易收据和虚拟合约。\n\
  - 由于目前区块链机制的互操作性有限，跨链技术实现了更好的可扩展性。现在可以利用多个区块链的速度优势，因为这项技术促进了用户与各种网络的交互，最终增强了可扩展性。\n\
  - 改进数据流和代币传输：在现有设置下，用户必须从源链发送命令。中继节点在获取这些指令后将它们传输到目标链。另一方面，跨链技术在交易完成后立即进行验证，并延迟其到达目的地直到验证完成。它通过简化整个流程并促进数据的无缝交换和传输来实现这一点。如果你也想交易加密货币，可以参加任何在线课程学习基础知识。\n\
  - 跨链技术威慑大型实体垄断的潜力：通过威慑大型公司的垄断，跨链技术也有助于市场稳定。例如，占据市场 70% 以上份额份额的 `Bitcoin` 和 `Ethereum`\
  \ 是加密货币领域最广为人知的名称。由于这种统治地位，新竞争者没有机会进入市场测试其方法并脱颖而出。在这些情况下，跨链技术非常有用，因为它创建了一个交易过程平等关注所有网络的环境。\n\
  \n焦点将不仅是少数重要的区块链网络，其他网络也将成为焦点。因此，通过提供一种平衡的方式来描述市场中的加密货币参与者，跨链技术可以建立一个公平的环境。\n\n\
  ## 区块链互操作性项目\n\n近年来，出现了许多解决公共区块链互操作性的项目。然而，企业级互操作性解决方案是非常新颖，所需的标准化工作仍处于早期阶段。虽然有其他分类方法，但我们通常可以根据不同的方法论和理念将互操作性解决方案分为两类。在第一类中，建立了一个被称为“结算”链（或枢纽）的永久基础设施，其他链（称为“侧链”）可以连接到该链。通用链作为互操作性的中介，为侧链提供去中心化的信任。这保证了跨链交易的结算。这种方法在分布式账本和公共区块链中运行得良好，如\
  \ `Cosmos` 和 `Polkadot` 所示。\n\n允许在不依赖外部基础设施的情况下实现直接网络互操作的模块和功能被添加到第二类互操作性解决方案中。`Hyperledger\
  \ Cactus` 和 `Hyperledger Lab Weaver` 属于第二类，这在性能和隐私是重要考虑因素的业务环境中非常有帮助。这些策略每种都有优缺点，具体取决于具体情况。\n\
  \n## Hyperledger Cactus\n\n一种名为 `Hyperledger Cactus` 的新型插件企业级架构允许在不添加另一个竞争区块链的情况下，在多个分布式账本上进行交易。`SDK`\
  \ 的 `SDK` 提供了区块链网络之间及内部去中心化、灵活且安全的集成。此外，通过可扩展的插件设计（允许通过创建新插件来添加新协议或功能），它试图尽可能许多协议。\n\
  \n## Hyperledger Cactus 的关键特性\n\n- 支持开放数字资产协议 (`ODAP`)。\n- 更多的示例和更好的文档（类似于 `fabric-samples`）。\n\
  - 更多的维护者数量。\n- 实现 `Cactus` 网络的公共测试。\n- 任何拥有云提供商账户或 `K8s` 集群的人都可以按照功能用例的方式复制 `Cactus`\
  \ 的基准测试。\n\n## Hyperledger FireFly\n\n另一个名为 `FireFly` 的 Hyperledger 通过跨多个区块链账本提供\
  \ `API` 编排层，在应用层促进互操作性。这允许通过插件微服务代码模块在各种区块链上实现常见的区块链编程元素，例如身份验证、链下/链上数据编排和代币。一种实际投入使用的此类模式跨越了单一交易中的多个链，涉及在\
  \ `Ethereum` 区块链上协调代币化的价值转移。\n\n## Hyperledger FireFly 的显著特性\n\n- 多账本支持\n- 插件式 `DID`\
  \ 提供者支持\n- 插件式 `API` 安全（例如 `OAuth 2.0`）\n- 主主活动集群\n- NoSQL 数据库支持\n\n## Weaver\n\n\
  Hyperledger Lab 的 `Weaver` 框架和系列协议允许在异构 `DLTs` 构建的自主网络为了资产转移和数据交换进行协作，同时维护区块链技术的基本安全去中心化原则。其互操作性主要依赖于共享基础设施，该设施可能提供身份识别服务但不涉及基础协议。依赖对方网络固有共识机制来维护信任的协议实现了互操作性。`Fabric`\
  \ 和 `Corda` 支持具有溯源性和真实验证的账本间数据传输协议。\n\n- 实现跨网络去中心化。\n- 中继模块通过提供增强的弹性（容错能力）和用于分发负载均衡的消息队列功能，使\
  \ `ODAP` 合规。\n\n\n\n\n\n*   调用跨网络交易并发布/订阅事件。\n*   为状态和资产共享提供完全机密性协助。\n*   包含增强的数据/状态共享机制，该机制利用可验证的外部观测特性来确认状态的新鲜度。\n\
  *   更好的测试功能、教程和文档。\n*   增加性能评估能力。\n*   通过组合功能与 Hyperledger Cactus 实现互操作性。\n\n##\
  \ YUI\n\n“YUI”源于一个日语术语，意为“结、连接和交叉”。Hyperledger Labs 发的一项新计划 YUI 旨在建立多个异构账本之间的互操作性。\n\
  \n在 Hyperledger Lab 的帮助下，多个异构账本可以相互通信。该实验室提供了开发跨链应用程序的工具和模块，以及用于跨链通信的中间件和模块。\n\n\
  通过针对其他 Hyperledger 项目的增强，YUI 构建在由 Cosmos 项目开发的用于跨链通信的区块链间（IBC）协议之上。IBC 为账本之间不依赖于可靠第三方的任意数据传输和计算提供了基础。\n\
  \nYUI 支持企业级账本（`Fabric`、`Besu` 和 `Corda`）之间的跨身份验证。账本的每个参与者只需与其感兴趣的相应账本交互，即可完成跨链操作，例如代币的原子交换。\n\
  \n## YUI 的显著特性\n\n*   支持其他账本（可能是其他 Hyperledger 项目）。\n*   增强对 `Solidity` 和基于以太坊账本的支持。\n\
  *   增强了连接 Cosmos 生态系统（例如用于 `Solidity` 的 `Tendermint` 轻量客户端）。\n*   改进的文档和发布示例。\n\n\
  互操作性操作可以分为三类：\n\n*   加密货币互操作方法。\n*   区块链引擎。\n*   区块链连接器。\n\n# 区块链互操作架构\n\n区块链互操作架构的草案由若干个人\
  \ IETF 参与者产生。互联网工程任务组（IETF）是定义 `TCP/IP` 等标准操作协议的机构。IETF 是由互联网协会互联网架构委员会（IAB）监督的开放标准组织。\n\
  \n互联网工程任务组（IETF）是一个由网络设计者、运营商、供应商和学者组成的开放、全球性社区，他们对互联网架构的发展及其无缝运行感兴趣。旨在协调互联网的管理、开发和运行。IETF\
  \ 成立于 1986 年。\n\n各种区块链网络在网络各个区块链之间传输某些类型的数字资产，以及在它们之间交换和利用数据的能力被称为“区块链互操作性”。\n\n\
  这些不同的数据标准直接损害了互操作性。使用 `APIs` 访问区块链为此问题提供了解决方案。通过这种方式，数据格式被标准化，使得无论 EHR（电子健康记录）与各种\
  \ `HL7` 版本的交互能力如何，都能实现数据传输。\n\n跨链是指两个相对独立的区块链相互通信的能力。换句话说，它允许区块链由于其统一的结构而相互通信。跨链克服了单链的限制。\n\
  \n目前，至少有 1,000 条区块链，涉及至少四种区块链网络。虽然区块链的概念是一种单一的数据传输类型，但该行业提供了多个平台。\n\n“互操作区块链架构”的定义被包含在\
  \ NIST 对“区块链”的定义中（见文献 [5] 第 50 页）：\n\n互操作区块链架构是多个可区分区块链系统的组合，每个系统代表一个独特的分布式数据账本，其中原子交易执行可能跨越多个异构区块链系统，并且其中一个区块链中记录的数据可以以语义兼容的方式，被另一个可能的外部交易访问、验证和引用。\n\
  \n在此背景下，回顾 20 世纪 90 年代末可信平台模块（`TPM`）的一些关键设计是有用的，它们提供了对信任性的基本理解 [6]。重用可信计算中的某些概念，如果节点满足以下条件，则可以认为表现出技术信任：\n\
  \n*   不受阻运行并不受外部影响或干扰\n*   为定义的任务运行\n*   能够真实地报告其计算结果\n\n![](img/Figure-1.jpg)\n\
  \n**图 9.1：** 跨账本系统的跨域交易示例\n\n为了说明跨域交易，在 [图 9.1] 中展示了一个简单示例，其中区块链 `BC1` 的资产传输到区块链系统\
  \ `BC2`。\n\n区块链 `BC1` 和 `BC2` 都是许可/隐私区块链。\n\n在 [图 9.1] 中，拥有 `Application X` 的 `User\
  \ A` 在 `BC1` 账本上记录了资产（例如：土地所有证）。该账本的内部标识符为 `T x1privateID`。`User A` 希望将资产（例如：出售）转移给运行\
  \ `Application Y` 的 `User B`。然而，`User B` 要求资产被“移动”到区块链 `BC2` 并在其账本上记录。\n\n这将允许 `User\
  \ B` 随后在区块链 `BC2` 中出售该资产。注意，由于是隐私区块链，`BC1` 中的任何网关都无法直接读写 `BC2`，反之亦然。\n\n以下是 `BC1`\
  \ 和 `2` 之间交易流的高级概述：\n\n**第 1 步**，`User A` 通过向 `BC1` 提交候选交易启动向 `User B` 的传输，接收地址为\
  \ `BC2` 中 `User B` 的公钥（例如：`pubkeyB/BC2`）。\n\n由于目标区块链 `BC2` 是异构系统，只有 `BC1` 中的网关允许或有能力处理此交易。\n\
  \n**第 2 步**，网关 `G1` 选择 `BC1` 中 `User A` 的候选交易并继续处理该交易。看到待处理交易的目标是 `pubkeyB/BC2`，网关\
  \ `G1` 在 `BC2` 中定位一个或多个网关 `G2` 并继续与 `G2` 进行信任谈判。\n\n**第 3 步**，标识符值 `T x1privateID`\
  \ 对应一个新的公值 `T x1publicID`。`G1` 必须持久维护此映射表（`T x1privateID`, `T x1publicID`）。未来，如果需要，网关\
  \ `G1` 必须提供将公值 `T x1publicID` 解析回内部私值 `T x1privateID` 的方法。\n\n**第 4 步和第 5 步**，多轮网关\
  \ `G1` 和 `G2` 必须通过执行密钥建立协议建立信任，交换密钥参数、硬件信任根证书（例如 `TPM` 中的 `AIK` 证书）、硬件状态报告（如 `Quote`\
  \ 协议报告）以及相关的信任建立参数。\n\n**第 6 步**，在网关 `G1` 和 `G2` 建立点对技术信任后，网关 `G2` 继续向 `BC2` 账本提交一个标识符为\
  \ `T x2privateID` 的新本地交易，地址为 `pubkeyB`。该本地交易引用了 `BC1` 中由公值 `T x1publicID` 标识的资产。实际上，网关\
  \ `G2` 正在将资产 `T x2privateID` 注册为属于公钥为 `pubkeyB` 的 `User B`。\n\n\n\n\n\n在第 7 步中，BC2\
  \ 账本已完成确认。网关 G2 需要间接向网关 G1 报告 `T x2privateID` 的确认状态。因此，G2 需要用一个新的公共标识符 `T x2publicID`\
  \ 掩盖本地交易标识符 `T x2privateID`。从以后，网关 G2 必须维护 `T x2publicID` 与 `T x2privateID` 之间的持久映射关系。\n\
  \n在第 8 步中，网关 G2 向 G1 发出一个签名声明，说明标识符为 `T x2publicID` 的资产已在 BC2 账本上确认，并在声明中包含了私有标识符\
  \ `T x2privateID` 的哈希。\n\n在第 9 步中，网关 G1 在看到 G2 的签名声明后，在 BC1 中提交一个新的“失效”交易，基本上标记了之前名为\
  \ `T x1privateID` 的资产已移动到 BC2。该失效交易还包含了对资产新家园引用，即 `T x2publicID/BC2`。它还应该包含来自 G2\
  \ 的签名声明的哈希。最后，在第 10 步中，用户 B 能够看到确认的交易 `T x2privateID/BC2`，而用户 A 看到 `T x1privateID/BC1`\
  \ 也被确认。\n\n**注意**：上述用例仅为抽象示例。这些流程存在许多变体，包括在第 2 步到第 9 步引入承诺协议（例如，两阶段提交）。\n\n## 结论\n\
  \n在本章中，我们学习了这些基于区块链的应用被迫与运行在不同区块链网络上的其他区块链应用进行交互。这导致了几个隔离的区块链网络之间新型通信机制的发展，为区块链网络互操作性的理念奠定了基础。\n\
  \n为了复习，我们了解到区块链技术的发展非常快，现在被分为四个阶段：\n\n* 区块链 1.0 致力于加密货币应用。\n* 区块链 2.0 提供智能合约和属性。\n\
  * 区块链 3.0 开发了分布式应用，如治理、物联网、医疗保健、供应链、智能城市等许多非金融应用。\n* 区块链 4.0 分布式账本技术。\n\n我们已经看到，区块链互操作协议可以分为：跨链（同构）和跨区块链协议（异构）。\n\
  \n加密货币作为存储在区块链中的数字资产货币形式，是区块链技术最广泛的应用。新的跨链协议使得各种区块链网络之间的通信变得更容易，并允许许多网络之间共享数据。\n\
  \n在下一章《法律与环境方面》中，我们将学习使用加密货币的影响以及非同质化代币（NFT）和印度加密货币的规定。\n\n## 参考文献\n\n* [1] Belchior,\
