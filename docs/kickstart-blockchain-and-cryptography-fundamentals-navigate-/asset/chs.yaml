  6. 将程序附加到网络。\n7. 启动软件。\n\n## 克隆仓库\n\n在任选的文件夹中克隆此仓库：\n\n```bash\ngit clone https://github.com/IBM/Create-BlockchainNetwork-IBPV20\n\
