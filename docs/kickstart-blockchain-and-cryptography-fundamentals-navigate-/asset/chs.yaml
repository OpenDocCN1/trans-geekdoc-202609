  \ Kubernetes 作为编排工具，对容器进行负载均衡、扩展和监控。\n\n![](img/Figure-11.12.jpg)\n\n**图 11.12:**\
  \ IBM Cloud® Kubernetes Service\n\n# 实操练习 3：与区块链网络交互\n\n通过创建一个应用程序来测试网络及其规则，从而对区块链网络执行交易和请求（[`developer.ibm.com/patterns/interacting-with-a-blockchain-network/`](https://developer.ibm.com/patterns/interacting-with-a-blockchain-network/)））。\n\
  \n# 开发者模式\n\n区块链是一种安全、分布式且开放的技术，它正在降低成本、加速流程，并在事务应用中建立新层次的信任。此开发者代码模式通过向你展示如何使用\
  \ VS Code 的 IBM Blockchain Platform 扩展以及 IBM Cloud 上的 IBM Blockchain Platform 构建区块链网络，来帮助你上手区块链。\n\
  \n任何软件设计模式都是针对软件设计特定背景下常见问题的通用、可重用的解决方案。它不是一个可以直接转换为源代码或机器代码的完成设计。\n\n模式（或设计模式）是一份文档，描述了解决在许多项目中反复出现的设计问题的通用解决方案。软件设计人员将模式解决方案适配到他们特定的项目中。\n\
  \n*注意：此开发者模式是系列模式中的第一个，旨在帮助你入门区块链。*\n\n设计模式通过提供经过测试、经过证明的开发范式可以加速开发过程。\n\n每个区块链都由一组在点对点（P2P）网络系统上的节点组成。网络中的每个节点都有一份共享账本的副本，并且会及时更新。每个节点都可以验证交易、发起或接收交易，并创建区块。\n\
  \n一旦你定义了网络、参与者和交易，下一步是创建一个应用程序，以测试该网络是否设置正确并按预期运行。人们可能将其称为单元测试，它反复执行代码的功能。你应该始终构建测试用例来验证代码的逻辑。在这种情况下，你希望确保每个参与者只能执行为该参与者定义的交易。此外，你还希望验证所有交易都按预期工作。这种工作对于开发生命周期至关重要。\n\
  \n此开发者代码模式帮助你利用在此组合模式的第一步中构建的内容，即测试交易。如果你还没有在步骤 1 中部署网络，请查看“通过完整的 API 探索 Hyperledger\
  \ Fabric”并现在进行设置。然后你就可以准备好此此模式，你将构建应用程序、部署它，并逐步执行发行交易。\n\n![](img/Figure-11.13.jpg)\n\
  \n**图 11.13:** 开发者代码模式流程图\n\n# 在网络上部署区块链智能合约\n\n1. 安装智能合约。\n2. 导航到左侧导航栏中的 `Smart\
  \ Contracts`（智能合约）选项卡并点击 `Install Smart Contract.`（安装智能合约）。\n3. 浏览到区块链网络智能合约包文件的位置（它可能命名为\
  \ `blockchain-network@0.0.1.cds`），这是我们之前使用 Visual studio code 的 IBM Blockchain Platform\
  \ 扩展打包的。\n4. 点击 `Add file`（添加文件）并找到你打包的智能合约。\n5. 一旦合约上传，点击 `Install Smart Contract`。\n\
  \n![](img/Figure-11.14.jpg)\n\n**图 11.14:** 智能合约安装窗口\n\n# Instantiate 智能合约\n\n1.\
  \ 在 `Installed Smart Contracts`（已安装智能合约）下，从列表中找到在我们的节点上安装的 `Smart Contract`（这里我们的名为\
  \ `blockchain-network`），并点击右侧溢出菜单中的 `Instantiate`（实例化）。\n2. 在打开的侧边面板中，选择要实例化智能合约的通道\
  \ `mychannel,`。点击 `Next`（下一步）。\n3. 选择包含背书策略的组织成员。在我们的情况下，我们需要选择 `Org1MSP`。点击 `Next`。\n\
  4. 我们可以跳过 `Setup Private Data Collection`（设置私有数据收集）步骤，直接点击 `Next`。\n5. 给实例化提供 `Function`（函数）名称，并留\
  \ `Arguments`（参数）为空。\n\n*注意：Instantiate 是 `my-contract.js` 合约文件中用于在节点上启动智能合约的方法。有些人可能会将其命名为\
  \ `initLedger`。*\n6. 点击 `Instantiate`。\n\n![](img/Figure-11.15.jpg)\n\n**图 11.15:**\
  \ 使用 Instantiate Contract 窗口选择通道\n\n## 将应用程序连接到网络\n\n1. 通过连接配置文件（connection profile）与\
  \ SDK 连接。\n2. 滚动到 `Instantiated Smart Contracts`（已实例化的智能合约）部分，并在列表中找到 `\"blockchain-network\"\
  ` 合约。点击右侧溢出菜单中的 `Connect with SDK`。\n3. 从连接的 `MSP` 下拉菜单中选择 `Org1MSP`。\n4. 从 `Certificate\
  \ Authority`（证书颁发机构）下拉菜单中选择 `Org1 CA`。\n5.向下滚动并点击 `Download Connection Profile`（下载连接配置文件）下载连接配置文件。这将下载连接\
  \ JSON，我们将用它在 Node.js Web 应用程序与区块链网络之间建立连接。\n6. 下载完成后你可以点击 `Close`。\n\n![](img/Figure-11.16.jpg)\n\
  \n**图 11.16:** 与 SDK 连接窗口\n\n# 创建应用程序管理员\n\n1. 导航到左侧导航中的 `Nodes`（节点）选项卡，在 `Certificate\
  \ Authorities`（证书颁发机构）下选择你的组织 `CA`, `Org1 CA`。\n2. 点击 `Register user`（注册用户）。\n3.\
  \ 给 `Enroll ID`（注册 ID）`app-admin`,，Enroll Secret`（注册密钥）`app-adminpw`。将此身份的 `Type`（类型）设置为客户端。我们可以指定使用根关联，或取消勾选此字段并从下拉列表中选择任何关联组织。我们将\
  \ `Maximum Enrollments`（最大注册数）留空。点击 `Next`。\n4. 在 `Attributes`（属性）下，点击 `Add attribute`（添加属性）。属性名为\
  \ `hf.Registrar.Roles`。这将允许此身份作为注册员为我们的应用程序发行身份。点击 `Add attribute`。\n5. 点击 `Register\
  \ user`。\n\n![](img/Figure-11.17.jpg)\n\n**图 11.17:** 注册用户窗口\n\n# 更新应用程序连接\n\n1.\
  \ 将下载的连接配置文件复制到应用程序文件夹。\n2. 更新 `config.json` 文件并包含：\n    * 下载的连接 JSON 文件的名称。\n \
  \   * 你的应用管理员的注册 ID 和注册密钥，我们之前提供了 `app-admin` 和 `app-adminpw`。\n    * 我们提供的 `orgMSP`\
  \ ID，`Org1MSP`。\n    * `caName`，它位于你连接 JSON 文件中的 `\"organization\" -> \"Org1MSP\"\
  \ -> \"certificateAuthorities\"` 下。这看起来像一个端口和一个 IP 地址。\n    * 你想要设置的用户名。\n3. 为了连接到\
  \ IBM Blockchain Platform，将网关发现更新为 `{ enabled: true, asLocalhost: false }`\n\n```json\n\
  {\n  \"connection_file\": \"mychannel_blockchain-network_profile.json\",\n  \"channel_name\"\
  : \"mychannel\",\n  \"smart_contract_name\": \"blockchain-network\",\n  \"appAdmin\"\
  : \"app-admin\",\n  \"appAdminSecret\": \"app-adminpw\",\n  \"orgMSP\": \"org1msp\"\
  ,\n  \"caName\": \"169.46.208.151:30404\",\n  \"userName\": \"user1\",\n  \"gatewayDiscovery\"\
  : { \"enabled\": true, \"asLocalhost\": false }\n}\n```\n\n# 运行应用程序\n\n首先，导航到应用程序目录并安装\
  \ node 依赖。\n\n```bash\ncd application\nnpm install\n```\n\n运行 `enrollAdmin.js` 脚本\n\
  \n```bash\nnode enrollAdmin.js\n```\n\n你应该能在终端中看到：\n\n```\nmsg: Successfully enrolled\
  \ admin user app-admin and imported it into the wallet.\n```\n\n\n\n\n运行 `invoke-transactions.js`\
  \ 脚本在智能合约上执行交易。\n\n```bash\nnode invoke-transactions.js\n```\n\n你应该会在终端中看到以下内容：\n\
  \n`Wallet path: /Users/snyk/CognitiveApps/code-patterns/Create-BlockchainNetwork-IBPV20/Create-BlockchainNetwork-IBPV20/application/wallet`\n\
  \n`Submit AddTrader transaction.`\n\n`addTraderAResponse:`\n\n`{\"traderId\":\"\
  traderA\",\"firstName\":\"Carlos\",\"lastName\":\"Roca\"}`\n\n`addTraderAResponse_JSON.parse:`\n\
  \n`{ traderId: 'traderA', firstName: 'Carlos', lastName: 'Roca' }`\n\n`Submit AddTrader\
  \ transaction.`\n\n`addTraderBResponse:`\n\n`{\"traderId\":\"traderB\",\"firstName\"\
  :\"Lisa\",\"lastName\":\"Smith\"}`\n\n`addTraderBResponse_JSON.parse:`\n\n`{ traderId:\
  \ 'traderB', firstName: 'Lisa', lastName: 'Smith' }`\n\n`Submit AddCommodity transaction.`\n\
  \n`addCommodityResponse:`\n\n`{\"tradingSymbol\":\"commodityA\",\"description\"\
  :\"farm-commodity\",\"traderId\":\"traderA\"}`\n\n`addCommodityResponse_JSON.parse:`\n\
  \n`{ tradingSymbol: 'commodityA',`\n`description: 'farm-commodity',`\n`traderId:\
  \ 'traderA' }`\n\n`Submit Commodity trade transaction.`\n\n`commodityTradeResponse:`\n\
  \n`{\"description\":\"farm-commodity\",\"traderId\":\"traderB\",\"tradingSymbol\"\
  :\"commodityA\"}`\n\n`commodityTradeResponse_JSON.parse:`\n\n`{ description: 'farm-commodity',`\n\
  `traderId: 'traderB',`\n`tradingSymbol: 'commodityA' }`\n\n## 故障排除\n\n如果你在提交交易时收到以下错误：\n\
  \n`error: [Client.js]: Channel not found for name mychannel`\n\n忽略此错误是安全的，因为 IBM\
  \ Blockchain Platform 服务默认启用了服务发现（如需使用服务发现查找其他节点，请在 UI 中为你的通道定义锚点节点 anchor peers）。如果你确实想让该消息消失，可以在连接配置文件中添加\
  \ `channels` 部分，但这只是一个警告而非真正的错误，它告诉用户已找到通道但不在连接配置文件中。\n\n例如，你可以手动添加以下 JSON 并手动更新\
  \ IP 地址和端口：\n\n```json\n\"channels\": {\n  \"mychannel\": {\n    \"orderers\": [\n\
  \      \"169.46.208.151:32078\"\n    ],\n    \"peers\": {\n      \"169.46.208.151:31017\"\
  : {}\n    }\n  }\n}\n```\n\n# 扩展代码模式\n\n此应用程序可以通过几种方式进行扩展：\n\n- 为每个成员创建一个钱包，并使用成员的钱包与应用程序交互。\n\
  - 使用 UI 应用代替 `invoke.js` Node.js 来执行交易。\n\n## 结论\n\n在本章中，我们完成了三个练习来测试我们学习区块链的成效。我们首先理解了\
  \ Docker 容器的需求，并安装了它。托管容器的软件被称为 `Docker Engine`。我们详细了解了 `Docker` 的四个组件。\n\n我们学习了在\
  \ Windows 上安装 `Docker` 的流程。\n\n在第二个练习中，我们学习了创建和部署区块链网络以及区块链网络的类型。对于智能合约的打包，我们使用了\
  \ VS Code 上的 `IBM Blockchain Platform` 扩展来打包智能合约。\n\n在第三个练习中，我们理解了如何与区块链网络交互。\n\n\
