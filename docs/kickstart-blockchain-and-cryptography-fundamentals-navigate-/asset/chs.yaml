  \n# 第 4 章\n\n# 开放环境下的分布式共识\n\n## 引言\n\n共识是一组网络上的对等节点（竞争对手或其授权代理）——被称为“节点”确定哪些区块链交易是有效的，哪些是无效的过程。共识机制是用于实现这种共同的方法论。通过确保网络上的大多数用户对账本的状态达成一致，共识机制维护了区块链的安全完整性。共识机制通过保留所有合法交易的记录来维护区块链的安全性。由于加密交易是一个去中心化的过程，这对于防止卖方故意欺骗买方变得非常重要。\n\
  \n本章深入探讨了挖矿的世界。交易描述了比特币系统中用户之间数字币的传输。为了记录在分布式账本中，单笔交易必须嵌入到区块中。比特币网络中的一部分节点被称为“矿工”，他们收集已由用户传播的交易，并将它们分组成区块，以添加到区块链中。\n\
  \n为了有资格将提议的区块作为链中的下一个区块进行传播，每个矿工都必须展示 `PoW`。为了实现这一点，矿工必须找到一个名为 `nonce` 的数字。`nonce`\
  \ 的哈希结合前一个区块的哈希以及包含矿工提议交易的树的 `Merkle root`，应该低于某个目标阈值。\n\n在下一章中，我们将学习开放环境下的分布式共识，并在\
  \ `第 6 章` 中，我们将学习封闭环境下的分布式共识。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   比特币网络中的共识\n*  \
  \ 区块链的 HashCash 协议\n*   `PoW`\n*   比特币与 `PoW`\n*   对 `PoW` 的攻击与垄断\n*   燃烧证明 `PoB`\n\
  *   时间证明 `PoET` 区块\n*   历史证明 `PoH`\n*   挖矿的难度与挖矿池\n\n## 比特币网络中的共识\n\n共享数据库是在 20\
  \ 世纪 80 年代和 90 年代计算机和网络流行时创建的。它们的创建是为了让多个用户访问数据。大多数具有权限的中心化数据库。这种安排演变成了位于多地的设备网络。防止数据篡改和未经授权的访问（无论是恶意的）是需要解决的最问题之一。为了确保信息不被篡改，需要一种自动管理分布式数据库的方法。分布式自治共识是指使用加密技术对共享数据库状态达成一致的方法。这种一致旨在通过加密算法生成被称为哈希的长字符串，然后由运行在网络上的程序进行验证。只有当哈希算法的输入发生变化时，哈希才会变化，因此程序设计为比较哈希以确保它们相似。\n\
  \n分布式共识是在分布式或去中心化多代理平台上达成共同协议的过程。它对于消息传输系统至关重要。\n\n![](img/Figure-4.1.jpg)\n\n**图\
  \ 4.1:** 区块链过程与攻击者\n\n对于使用 `PoW` 算法进行共识的区块链，如果攻击者控制了网络哈希率的 50% 以上，则攻击是可能的。\n\n如果是这样，控制的\
  \ CPU 能力将允许攻击者从区块链中的任何以前区块创建一个单独的链。由于它拥有大部分计算能力，它的新链将超过网络接受的链，从而定义新的交易历史。\n\n在这条新链中，攻击者能够双重花费虚拟货币，这意味着在网络链上已经花费的资金可以在攻击者的链上再次花费。\n\
  \n对于比特币而言，由于网络规模和哈希率，策划 51% 攻击似乎是不可能的。据估计，对比特币进行 51% 攻击的成本略高于 150 亿亿美元。然而，许多替代币面临的风险更大。\n\
  \n\n\n\n近年来，发生了多次 51% 攻击。2021 年 8 月，比特币 SV (BSV) 在遭受攻击后价值下跌了约 5%。另一个比特币分叉项目比特币黄金\
  \ (BTG) 在 2019 年遭受了 51% 攻击。\n\n由于典型的软件架构中存在中央服务器，共识很少成为问题；相反，其他节点只需要与服务器对齐即可。为了达成共识，区块链等分布式网络中的每个节点都兼任主机和服务器的角色，并必须与其他节点进行通信。除了宕机或不可用的节点外，共识过程偶尔还可能受到恶意节点的严重阻碍或破坏。因此，一个良好的共识协议可以减少损害并接受这些现象的发生，而不影响共识的最终结果。\n\
  \n通常情况下，添加到区块链的每一个新区块都由共识协议保证，是区块链中每个节点所接受的唯一真理版本。\n\n让我们重申一下：区块链是一个不可篡的、私有的、安全的且透明的分布式去中心化网络。尽管缺乏中央权威来验证和确认交易，但区块链上的每一笔交易都被认为是完全安全的。只有共识机制——每个区块链网络的核心组成部分——才使这一切成为可能。\n\
  \n区块链网络中的所有节点对分布式账本的当前状态达成共识的过程被称为算法（共识算法）。共识算法通过在分布式计算环境中在陌生人之间建立信任，并确保区块链网络的可靠性来实现这一点。从本质上说，共识机制确保了添加到区块链的每个新区块都代表了区块链所有节点所接受的唯一且认可的真理版本。\n\
  \n## 共识构建过程\n\n在计算机和区块链系统中，共识机制本质上应该是一种容错方法，用于在分布式进程或多代理系统（如加密货币）中就单个数据值或网络单一状态达成所需的协议。这确保了记录工作能够从其利用中获益。例如，比特币区块链中的工作量证明\
  \ (PoW) 共识过程需要使用计算能力来解决一个具有挑战性但任意的问题，以维护所有节点的网络完整性。\n\n## 共识机制\n\n中央管理员有权维护和更新任何传统的集中化系统，例如包含某国驾执照重要数据的数据库。任何调整（例如添加、删除或修改符合特定许可证要求的个人姓名）都由中央权威执行，而该权威仍然是负责维护准确记录的唯一实体。\n\
  \n## 公有区块链的功能\n\n公共区块链作为全球分布的、自治的去中心化网络运行，不受单一实体治理。它们的实现取决于成千上万用户的参与，这些用户负责区块挖掘以及对区块链上发生的交易进行验证和确认。\n\
  \n由于区块链技术的动态性，公开访问的账本需要一种高效、公平、实时、功能、可靠且安全的机制，以确保所有网络交易的真实性，并且所有参与者对账本状态达成共识。共识机制是一组决定各种区块链参与者（即节点或交易者）所贡献有效性的准则，承担着这一至关重要的职责。\n\
  \n开放区块链是一个公共网络，保留了所有交易的不可更改记录。通过遵循特定规定，任何人都可以发布交易并参与网络。开放区块链的例子有轻币和比特币。简单来说，它是一个所有系统成员可访问的共享数字事件账本。\n\
  \n开放区块链是许多对系统感兴趣的用户之间数字事件（或交易）的共享记录。输入账本的信息在被记录后无法删除，只能通过参与者的共识进行更改。记录的每种事件都可以通过提供参与者共识的证据进行密码学验证。\n\
  \n从技术上讲，开放区块链是一种织物架构，使公司能够利用分布式、点对点、不可篡（仅允许追加）、加密安全的数据库的力量。这些特征由以太坊和比特币先驱，使得区块链在记录交易方面安全且可靠。\n\
  \n区块链是一种基于点对点运行的分布式账本系统，为新型交易应用程序服务。它简化了公司流程，同时建立了透明度、问责制和信任。与公有区块链相比，某些系统使用模块化的私有区块链。\n\
  \n这种方法用于存储和检索交易。在此背景下，`transaction` 一词可以指许多不同的内容，包括数据、资产、身份和指令。对于不同的领域，一个集成信息存储和交易处理的系统是非常有利的。这种模块化设计的一个关键优势是，网络管理员可以指定自己的限制，然后配置协议以满足这些需求。这种方法对于创建许可网络是有益的。\n\
  \n在这种开源织物的帮助下，无数不同的参与者可以构建自己的网络。社区建立了一个许可网络，其中已知的白名单实体同时运行验证节点和非验证节点。网络颁发机构授予这些身份的访问权限。这一概念与目前使用的区块链有很大不同。传统的区块链技术通过以下方式对开放区块链进行了扩展：\n\
  \n- **逻辑（链代码）：** 链代码是传统智能合约的扩展，通常被理解为代码表示的自执行合约，这些代码可以相互交互并触发其他智能合约。链代码可以在沙箱 Docker\
  \ 容器中运行的同时，与其他 `hlp-fabric-golang` 网络或外部世界通信。此外，链代码继承了机密性、隐私以及存储持久数据的能力。\n- **变量机密性：**\
  \ 网络具有在不同层级控制谁可以查看和参与环境的能力。这扩展到了交易，可以应用特定的隐私标准。\n- **可验证身份识别：** 尽管网络具有混淆身份的能力，但拥有\
  \ 100% 匿名且能够使用安全加密技术独立验证身份的节点仍然是可能的。如果用户提供授权，审计员可以对网络的用户和交易去匿名。这种透明度对于监管分析和检查至关重要。\n\
  - **私有交易：** 所有交易信息都经过加密，包括但不限于节点、资产、数量和链代码。这消除了识别模式或向未经授权的用户泄露隐私信息的可能性。独占参与者拥有解码、观察、交互和执行（使用链代码）的能力。\n\
  \n\n\n\n\n*   **可自定义共识协议：** 几乎任何共识机制，如 `proof-of-work` 或 `proof-of-stake`，都可以与 fabric\
  \ 配合轻松运行。得益于其适应的架构设计，Open Blockchain 有许多应用。例如，`Bitcoin` 区块使用的 `Proof-of-Work` (`PoW`)\
  \ 共识过程需要应用计算资源来解决一个具有挑战性但任意的难题，以维护网络中所有节点的完整性。\n\n`PoS` 机制在*对 PoW 的攻击与垄断*章节中进行了详细介绍。\n\
  \n# 工作证明 (Workproofing)\n\n2009 年，`Bitcoin` 的创造者中本聪（Satoshi Nakamoto）打算将其一种去中心化的、分布式共识的货币形式。这项创新旨在货币的金融和技术两个方面实现去中心化。例如，当你使用受信任系统进行货币交易时，借方和贷方交易由第三方处理（例如银行、信用卡/借记卡、`PayPal`\
  \ 等）。\n\n银行充当中介角色，扣除发送者的账户（例如 Mark）并向接收者账户（例如 Sally）存入相应金额。\n\n在交易完成之前，任何交易资金都不属于\
  \ Mark 或 Sally，因为它们都由未识别的第三方管理并存在于其内部。\n\n另一方面，`Bitcoin` 打破了这种中心化模型。它在点对点网络上运行，消除了对受信任中介的需求。这种方法旨在赋予用户对个人财务更大的控制权，并可能促进金融系统的透明度和信任。\n\
  \n## 工作证明 (PoW)\n\n目前存在多种共识机制算法，每种算法都基于一组不同的原则。这些包括：\n\n*   工作证明 (`PoW`)\n*   权益证明\
  \ (`PoS`)\n\n例如，`Bitcoin` 区块使用的 `Proof-of-Work` (`PoW`) 共识过程需要应用计算资源来解决一个具有挑战性但任意的难题，以维护网络中所有节点的完整性。`PoS`\
  \ 机制在*对 PoW 的攻击与垄断*章节中进行了详细介绍。\n\n在 `Proof-of-Work` 中，参与的节点必须证明它们已完成并提交的工作使其有权获得向区块链添加新交易的权限。然而，整个\
  \ `bitcoin` 挖矿过程需要大量的能量，并且处理时间很长。\n\n像 `Ethereum` 和 `Bitcoin` 这样的加密货币已经接受了 `PoW`。在每一轮共识中，`PoW`\
  \ 使用算力竞争来选择一个节点来生成新区块。挑战中的参与节点必须解出一个密码谜题。添加新区块的能力可能属于第一个解决谜题的节点。*图 4.1* 显示了 `PoW`\
  \ 流程中的区块形成过程。\n\n解决 `PoW` 谜非常困难。节点需要不断调整随机值 (`nonce`）以获得正确答案，这需要大量的计算能力。恶意攻击者推翻链中的一个区块是可行的，但这等于增加了链中有效区块的数量。工作量会累积，因此，推翻长链需要巨大的计算能力。`PoW`\
  \ 属于概率最终性共识协议，因为它保证了最终一致性。在 `Blockchain` 中，所有节点维护并作用于同一个分布式账本。\n\n下表阐述了分布式共识中原子广播的属性：\n\
  \n| 属性 | 备注 |\n| :--- | :--- |\n| 有效性 (Validity) | 这种有效性保证了如果由有效节点广播消息，它将被正确地包含在共识协议中。\
  \ |\n| 一致性 (Agreement) | 一致性保证了如果消息递送给有效节点，它最终将递送给所有有效节点。 |\n| 完整性 (Integrity) |\
  \ 确保消息仅由有效节点广播一次。 |\n| 全序 (Total Order) | 确保所有节点对所有递送消息的顺序一致。 |\n\n**表 4.1：** 分布式共识协议的原子广播属性\n\
  \n一个共识协议应该具有以下三个属性；即一致性、可用性和容错性[^([2])](#c04.xhtml#ftn2)。这些属性在*表 4.2*中进行了详细阐述：\n\
  \n| 属性 | 备注 |\n| :--- | :--- |\n| 安全性/一致性 (Safety/ Consistency) | 只有当所有节点产生相同的有效输出时，该共识协议才被认为是安全的（或一致的）\
  \ |\n| 活跃性/可用性 (Liveness/ availability) | 如果所有非故障节点都产生输出，则该协议被认为是活跃的。 |\n| 容错性 (Fault\
  \ Tolerance) | 它表现出网络在节点故障期间按预期执行的能力 |\n\n**表 4.2：** 分布式共识的属性\n\n# 区块链的开放型和封闭型\n\
  \n与依赖信任的传统金融机构不同，`Bitcoin` 作为一个无信任系统运行。这看起来可能违背直觉，但它实际上允许在没有中间人的情况下进行安全的点对点交易。\n\
  \n![](img/Figure-4.2.jpg)\n\n**图 4.2：** 验证后创建新区块\n\n在这里，矿工了传统调调员的角色，他们的工作是确保代表所有者成功完成涉及加密货币的交易。矿工使用计算机的计算能力来解析每个交易中包含的加密算法。在\
  \ `Proof of Work` 系统中，矿工竞争确认每个候选区块（或当前正在构建的区块([3])](#c04.xhtml#ftn3)）的有效性。区块奖励（或交易货币的一部分）将给给第一个解决这些问题的幸运的矿工。`PoW`\
  \ 由计算输出和竞争决定。想象有一个国际数学竞赛，参赛者（矿工）被拿到一个从未解决过的证明（区块）。第一个解决该证明的人将获得奖励（区块奖励），一旦解决，它将在网上公开，矿工会通知网络上的所有人该结果。\n\
  \n## 工作证明的优点\n\n正如之前提到的，`Proof of Work` 系统要求计算机在执行请求的操作之前执行少量的额外工作。在完成这些额外工作后，会产生解决方案并与连接到网络的其他计算机共享。`Proof\
  \ of Work` 系统的一个基本特征是，解决问题应该是相当困难的，而确认给定的解决方案确实解决了问题应该非常简单。密码哈希函数对于现代 `Proof of\
  \ Work` 系统至关重要。在这个上，`Proof of Work` 系统与 Merkle 树具有可比性。\n\n`Proof of Work` 的一些主要优点描述如下：\n\
  \n*   它们在阻止垃圾邮件发送者方面非常有效。如果发送一个电子邮件需要大量的工作，大多数垃圾邮件发送者将没有足够的计算能力来发送大量的未自垃圾邮件。\n\n\
  \n\n\n\n*   另一种情况下，即使垃圾邮件发送者拥有发送大量电子邮件的计算能力，但与这种计算能力相关的费用（如购买硬件和支付电费）可能会超过通过发送垃圾邮件获得的收益。工作量证明（Proof\
  \ of Work）系统的工作机制可以威慑垃圾邮件和其他有害活动。\n*   值得注意的是，工作量证明系统也可用于保护整个网络的安全。如果有足够的节点（计算机或专用挖矿设备）在竞争寻找特定的解决方案，单个恶意行为者甚至一小恶意行为者群体无法获得主导和影响网络所需的计算能力。\n\
  \n# 区块链工作量证明的技术细节\n\n工作量证明区块链涉及网络上的节点发现一个小于或等于预定义数字（称为“目标值”，target）的区块哈希。这就是节点正尝试解决的“工作量”或数学问题。区块头数据结合加密哈希算法就构成了区块哈希。区块头本身由六部分信息组成，包括：\n\
  \n*   挖掘区块时生效的区块链代码库版本号\n*   压缩形式（或位，bits）的目标数值\n*   对应于区块生成精确时刻的时间戳\n*   Merk 尔根（Merkle\
  \ Root），即使用 Merkle Tree 对区块中所有交易 ID 进行哈希后的集合\n*   前一个区块哈希的加密哈希\n*   `nonce`\n\n\
  因此，区块头由这六部分数据组成。对这六部分信息共同进行哈希后产生的哈希被称为“区块哈希”。区块必须拥有小于或等于目标值的区块哈希，矿工才能开始挖掘它。\n\n\
  至关重要的是，目标数量和通常所谓的“挑战”（challenge）并不是一回事。难度和目标值实际上是反比关系。随着目标值的减小，寻找区块的难度就会增加。\n\n\
  这是因为矿工正试图找到一个小于或等于目标值的区块哈希。如果目标值非常高，矿工找到小于目标值的区块哈希的概率相对较高。如果目标金额低，那么小于或等于该目标值的数字范围要小得多。这使得找到低于阈值的区块哈希变得更加困难。\n\
  \n每个工作量证明区块链都有频繁变化的目标值，以保证区块时间相对恒定。例如，比特币的目标每两周更改一次。比特币的目标是将区块时间维持在十分分钟。如果区块发现得太快（平均少于十分分钟），难度就会增加，使矿工更难找到新区块并减慢区块创建速度。相反，如果区块时间持续超过十分分钟，难度就会降低，允许矿工更快地找到区块并恢复目标区块时间。\n\
  \n现在请记住，工作量证明区块链中区块头的加密哈希（由六部分数据组成）是区块链中任何区块的区块哈希。你会发现六个数据点中的五个是静态的，这意味着它们不能被更改且必须保持不变。\n\
  \n`nonce` 是唯一可以修改的整数。因为它是一个一次性数字，所以它被称为 `nonce`（随机数）。每个区块的 `nonce` 都是唯一的。\n\n如前所述，挖掘加密货币的目标是定位一个小于或等于目标值的区块哈希。矿工通过重复且增量地更改\
  \ `nonce` 来尝试挖掘区块，因为它是唯一可修改的数字。目标是找到一个 `nonce`，使其与组成区块头的其他五部分信息结合时，产生的区块哈希小于或等于目标值。\n\
  \n一旦矿工发现了符合这些要求的 `nonce` 及其关联的区块哈希，就会将其广播到网络上的所有其他节点。每个节点都会确认由 `nonce` 生成的哈希是准确的，且小于或等于目标值。如果网络达成共识，该区块将被添加到链中。在矿工获得区块奖励后，竞争将使用新区块重新。\n\
  \n# 工作量证明区块链的缺点\n\n工作量证明系统有两个主要的缺点：\n\n*   第一是它们浪费能量，这对环境是有害的。随着计算机执行额外的计算工作，会消耗额外的电量。这可能会累积成极其巨大的过剩电量消耗。这导致了权益证明（Proof\
  \ of Stake）链作为一种更环保的替代方案的兴起。然而，关于比特币网络消耗能量的简单统计并不能说明问题。从环境角度来看，比特币挖掘并没有你想象的那么糟糕。2018\
  \ 年 11 发布的一份关于加密货币挖掘的报告估计，挖掘中使用的电力约 80%是绿色能源。在某些情况下，比特币挖掘正在利用国家电网无法存储和分配的剩余电力。\n\
  *   当有一个大型矿工网络竞争区块奖励时，工作量证明区块链才能提供足够的安全性。如果网络很小，仍然存在黑客获得网络简单多数的计算能力并发动所谓的 51%攻击的可能性。\n\
  \n在如今的情况下，操纵比特币区块链几乎是不可能的。然而，还有几十个较小的工作量证明区块链对 51%攻击仍然极其脆弱。\n\n事实上，许多此类较小的工作量证明链在\
  \ `NiceHash` 上每小时几百美元就能被成功攻击，`NiceHash` 是一个允许用户租哈算力来挖掘加密货币的网站。有关更多细节，请查看 `Crypto51`，该网站实时列出了对现有每一个工作量证明区块链进行\
  \ 51%攻击所需的费用。\n\n虽然工作量证明区块链的这两个缺点是严重的问题，但 Komodo 的区块链安全服务为这两个问题提供了解决方案。\n\n对于环境问题，Komodo\
  \ 创新的延迟工作量证明（delayed Proof of Work）安全机制回收了比特币网络巨大的哈算率，为所有集成区块链提供 BTC 级别的安全性。它利用了已经消耗的巨大电力来保护小型的工作量证明区块链。\n\
  \n至于对 51%攻击和其他类型区块链操纵的担忧，一旦链通过 BTC 网络的力量保护，它们就不再是问题了。潜在黑客需要同时击败 KMD 网络和 BTC 网络，才能成功攻击集成到\
  \ Komodo 区块安全服务的链。\n\n# POW 的 HashCash 协议\n\n1997 年，密码客运动（cypherpunk movement）的成员\
  \ Adam Back 创立了一种名为 `HashCash` 的协议，为“工作量证明”机制奠定了基础。HashCash 甚至包含了“双花费保护”，这是区块链中用于保护网络免受双花费攻击的基础性概念。\n\
  \n此外，Satoshi Nakamoto 在比特币中引用了 `HashCash` 作为影响因素，写道：“为了在点对点的基础上实现一个分布式时间戳服务器，我们需要使用一种类似于\
  \ Adam Back 的 Hashcash 的工作量证明系统”。这种联系不仅是被假设的，而是由比特币创始人本人明确提出的。\n\n\n\n\n\n`HashCash`\
  \ 是一种旨在对抗垃圾邮件的解决方案，它通过生成工作量证明来验证某封邮件是否为垃圾邮件。它引入了 `Proof of Work (PoW)`，用于最大限度地减少垃圾邮件和拒绝服务攻击（称为\
  \ `DoS` 或 `DDoS`）。这项技术由于其在 `Bitcoin` 以及许多其他加密货币中的应用而获得了广泛普及。\n\n## 比特币与 PoW\n\n\
  比特币将 `Hashcash` 函数作为其挖矿核心的一部分。所有的比特币矿工都使用 `GPU` 而不是 `CPU`。`GPUs` 是图形处理器，其计算能力高于传统的中央处理单元（`CPUs`）。与许多加密算法一样，`HashCash`\
  \ 使用哈希函数作为构建模块。解决这些谜题会创建新区块并验证 `Bitcoin` 网络上的交易。如果没有该软件，目前的比特币挖矿和安全结构将无法实现。\n\n\
  ## 权益证明 (PoS)\n\n另一种作为工作量证明（`PoW`）算法的低成本、低能耗替代的流行共识方法是权益证明（`PoS`）。它包括根据参与者节点持有的代表虚拟货币（即公共账本）的代币数量，为其分配一定数量的代币。`PoS`\
  \ 的一个潜在缺点是鼓励存储加密货币而不是花费，这可能会影响整体流通。\n\n在这种方法中，造区块者权益在区块链网络中的时长决定了选择哪些造区块者（工作量证明中相当于矿工）来产生区块。让我们举个例子，假设你拥有\
  \ `500,000` 个 `QTUM`。让我先推测性祝贺你大发横。回到例子，在 `Proof of Stake` 机制下，你创建候选区块的概率比拥有 `100,000`\
  \ 个 `QTUM` 的人高。此外，如果你在同一个地址持有这 `500,000` 个 `QTUM` 一年，而不是像另一个拥有相同 `QTUM` 但在网络地址中存储了一半时间的人，你更有可能生成下一个区块。\n\
  \n![](img/Figure-4.3.jpg)\n\n**图 4.3：** 造区块者权益在区块链网络中的时长\n\n另一种思考方式是，如果你中奖的概率取决于两点：\n\
  \n*   你投入了多少钱，以及\n*   你购买彩票持续多久。\n\n质押你偏好的 `PoS` 货币不会让你变成百万富，但你仍然可以增加投资价值并产生一些不错的被动收入。\n\
  \n需要记住的是，权益只有在保留在连接到币种网络的地址上时才能被选中。\n\n因此，如果你像前面的例子那样持有 `QTUM`，你就必须将你的 `QTUM` 保留在\
  \ `QTUM core wallet` 中。`PoS` 机制也没有区块奖励。造区块者只接收交易费，因为没有根据根据其努力去与其他矿工竞争的动力。\n\n此外，普通权益证明和委托权益证明之间存在显著区别，这将在以后讨论。使用各种技术的币列表如下：\n\
  \n*   **PoW 币**：`Bitcoin`、`Ethereum`、`Litecoin`、`Monero`\n*   **PoW/PoS 混合型**：`Dash`、`Stratis`、`HShare`\n\
  *   **PoS 币**：`Cardano`、`Ardor`、`QTUM`\n\n虽然 `PoW` 和 `PoS` 目前最流行，但区块链上还使用了其他算法，如容量证明（`PoC`）和活动证明（`PoA`）。\n\
  \n## 对 PoW 的攻击\n\n`51% 攻击`也称为多数攻击，发生在单个个人或团体获得 `PoW` 控制权时。`51%` 这个词只是象征性的，意味着足够的权力。\n\
  \n## 燃烧证明 (PoB)\n\n燃烧证明（`PoB`）是另一种比工作量证明（`PoW`）更节省能量的共识。与 `PoS` 不同，`PoB` 网络通过燃烧货币确保交易受新区块的保护。\n\
  \n由于 `PoB` 方法是一种新型共识，其在大网络中的适用性尚未确定。`PoB` 技术具有许多优点，包括完全去中心化的矿。\n\n# 等待时间证明 (PoET)\
  \ 区块链\n\n`Proof of Elapsed Time (POET)` 区块链通过采用抽取系统维持过程效率。得益于英 的 `POET` 共识算法，许可区块链网络可以选择由谁写入下一个区块。\n\
  \n在区块链网络上，`POET` 算法使用随机生成的等待时间来确定矿权。此外，`POET` 方法通过在安全环境中执行可信代码，保证了抽奖结果可以由其他方独立验证，从而增加了透明度。\n\
  \n\n\n\n\n*   首先，它保证了参与的节点实际上选择的是随机时间，而不是为了赢而刻意选择一个较短的时间。\n*   它还证明了获胜者已经完成了他们的等待期。\n\
  \n共识过程失败的证据消耗的能量比工作量证明少得多，因为它通过随机选择节点，而不是让网络中的所有矿工相互竞争。\n\n巨型芯片制造商`英特尔公司 (INTC)`\
  \ 在 2016 年初提出了 `PoET` 概念。它为“随机领导者选举”的计算问题提供了一个现成的、尖端的解决方案。得益于嵌入机制，应用程序可以在安全环境中运行可信代码。这确保了两个要求的共同满足：所有参与节点的等待时间必须随机选择，且获胜的参与者必须实际完成等待期。采用\
  \ `PoET` 共识机制的开源项目 `Hyperledger Sawtooth` 得到了 `Intel` 以及与其他小组（如 `Linux Project`\
  \ 和 `IBM`）合作的支持。这种既具有扩展性又灵活适用于广泛业务场景的分布式账本系统被称为 `Hyperledger Sawtooth`。\n\n# PoET\
  \ 的运行机制\n\n通过将获胜概率分配给尽可能多的网络用户，`PoET` 机制遵循公平彩票系统的理念，即每个节点都有等机会被选中。网络中参与 `PoET` 方案的每个节点都必须等待预定的时间；第一个完成等待期的节点获得下一个区块。在区块链网络中，每个节点创建一个随机等待时间，并在该时间内进入睡眠。\n\
  \n显而易见，第一个醒来的人（或等待时间最短的人）在醒来时会向整个对点网络广播所需信息，并将一个新区块提交到区块链中。然后，通过重复相同的程序发现下一个区块。\n\
  \n## 区分 PoET 和 PoW\n\n工作量证明 (`PoW`) 算法的工作流程本质上与 `比特币` 使用的共识方法相同，尽管它不需要那么多能量。它通过允许节点在预定时间内进入睡眠并切换到其他任务，提高了网络的效率。\n\
  \n因此，与鼓励去中心化和透明度的工作量证明 (`Proof-of-Work`) 不同，耗尽时间证明 (`Proof-of-Elapsed Time`) 必须向所有网络参与者发放证书。\n\
  \n在这种情况下，运行在安全环境中内部的可信代码执行机制满足了许多其他网络需求。它保证了可信代码在安全设置中运行，且不会被任何参与方更改。此外，它确保用户或其他授权方可以独立地验证结果，从而增加了网络共识的透明度。\n\
  \n`PoET` 还维持了共识过程的活力或灵活性，以将成本控制在与过程产生的价值成比例的范围内——这是加密货币经济持续增长的关键需求。`Hyperledger\
  \ Sawtooth` 是一种专注于企业的分布式账本，类似于区块链，旨在用于供应链和物流应用。它甚至可以用于记记、库存控制和其他耗时且易出错的公司运营操作。\n\
  \n`PoET` 主要用于 `Sawtooth Hyperledger`。截至 2022 年 1 月，还没有加密货币使用耗尽时间证明 (`PoET`)，因此目前还没有“耗尽时间证明币”\
  \ (`Proof of Elapsed Time Coin`)。\n\n工作量证明和耗尽时间证明之间存在显著差异。`PoW` 是一种竞争性的工作方法，而 `PoET`\
  \ 则依赖于随机选择。\n\n## 历史证明 (PoH)\n\n与耗尽时间证明 (`PoET`) 类似，另一种被称为 `历史证明 (PoH)` 的共识技术由 `Solana\
  \ 项目` 创建。它通过加密编码时间的流逝，在不需要大量资源的情况下实现共识。为了跨分布式进程或多代理系统（如加密货币系统）的单一数据值或网络单一状态达到所需的共识，计算机和区块链系统中使用的任何共识方法必须具有容错性。在其他方面，记录维护受益于它的利用。\n\
  \n# 挖矿难度与挖矿难度\n\n像 `比特币` 这样的加密货币的流行程度与其对点网络中涉及的计算机数量成正比。矿工争夺每个区块提供的少数收益而战。随着用户数量和计算能力的增加，整个网络的“算力”随之上升。\n\
  \n这种竞争过程被称为`挖矿难度`，简单来说就是`难度`（在竞争中感受到），一旦掌握了 `比特币` 挖矿的基础就更容易理解。它指的是解决复杂的加密谜题所需的精力。由于`比特币`交易存储在区块中，它们每\
  \ 10 分钟（=600 秒）被添加到区块链中。为了保持处理一个区块大约 10 分钟的时间，必须定期调整`难度`。\n\n`挖矿难度`是 `比特币` 挖矿过程中使用的测量单位。\n\
  \n`比特币`等加密货币的`挖矿难度`表示为每个区块寻找正确哈希有多困难、多耗时。\n\n新单位的挖矿`难度`随时间增加或减少，取决于网络中矿工的数量。\n\n\
  值得注意的是，`比特币`网络中的挖矿难度在挖完 2,016 个区块后会自动调整。难度的向上或向下调整取决于挖矿网络的人数及其总算力。\n\n# 挖矿设备的演变\n\
  \n自`比特币`诞生以来，挖矿设备已经经历了巨大的演变。早期，第一批矿工使用他们`电脑`的 `CPU` 来挖`比特币`。矿工最终发现显卡更适合挖`比特币`。然而，显卡也需要更多的能量。\n\
  \n近年来，开发了专门用于 `比特币` 挖矿的 `ASIC`（专用集成电路）芯片。\n\n目前，`比特币`和其他数字货币通过`矿池`进行挖矿，即许多矿工聚集在一起共享他们的算力，以追求区块奖励。创建有效区块的数学谜题需要巨大的计算能力。由于难度不断增加，矿工加入`矿池`并共同解决数学谜题。第一个找到正确哈希的个人矿工或矿池将获得区块奖励。\n\
  \n# 矿池\n\n`矿池`是矿工通过汇总资源的方式，他们在网络上共享处理能力，以根据他们对发现区块概率的贡献来平均分配奖励。\n\n\n\n\n\n“份额”（share）被授予提交了有效部分工作证明（partial\
  \ proof-of-work）的矿池成员。矿池挖矿的出现是因为挖矿难度增加到以至于较慢的矿工可能需要几个世纪才能生成一个区块⁹。解决这个问题的方案是矿工汇集资源，以便他们更快速地生成区块，从而能够持续地获得区块奖励的一部分，而不是每隔几年才随机获得一次⁹。\n\
  \n通常情况下，加密货币网络中的区块包含交易。交易手续费支付给矿工（矿池）。不同的矿池可以在其矿工之间共享这些费用，也可以选择不共享。\n\n每个加密货币矿池都会要求你支付挖矿费，因此最好选择收益率高且手续费低的矿池。\n\
  \n矿池是合作矿工的群体，他们同意按照其贡献的挖矿哈希算比例共享区块奖励。\n\n虽然对于普通矿工来说，矿池是理想的，因为它们平滑了奖励使其更具预测性，但遗憾的是，它们将权力集中到了矿池所有者手中。需要注意的是，大多数矿池位于中国。许多矿池只有中文网站和中文支持。比特币目前最大的担忧之一是中国的挖矿中心化。大约有\
  \ 20 个主要矿池，估计显示中国矿池控制了网络高达 65% 的哈希率。其他主要参与者包括马塔（10%）、美国（3%）、捷克（3%）和日本（0.5%）。\n\n\
  ![](img/Figure-4.4.jpg)\n\n**图 4.4:** 世界矿池份额 [参考资料 9]\n\n然而，矿工可以随时选择将其哈希算力重定向到不同的矿池。以下是一些热门选项：\n\
  \n*   **Slush Pool**: 它是目前使用的的最老的矿池，自 2010 年起运营。该矿池向公众开放，以准确性和稳定性闻名。它提供了简单的注册流程，为了学习仪表板的功能，你甚至可以构建一个演示矿器。网站上有两个选项：一个针对新手矿工，另一个针对老深矿工。\n\
  *   **AntPool**: 全球最大的矿池是 `AntPool`。所有区块中约有 11%由它挖掘，其服务器位于世界各地。在设置期间，`AntPool` 新新的点对挖矿机制可以将你的设备连接到最近的设备，以实现可靠连接。\n\
  *   **BTC.com**: 如果你熟悉 `Bitcoin.com`，那么同一家公司也拥有 `BTC.com`。在推出矿板块之前，`BTC.com` 以其尖端的区块链浏览器和比特币钱包而闻名。其中型矿池支持莱特币、以太和其他加密货币，矿池位于包括和德国在内的多个国家。\n\
  *   **KanoPool**: 该矿池自 2014 年起运营，比其他矿池小，但提供了廉价的挖矿成本和简单的启动程序。唯一的先决条件是用户名和比特币钱包地址；注册完全自愿。它有一个全面的帮助页面，包含所有必要的常见问题解答，界面直观易于使用。\n\
  *   **Binance Pool**: 世界最大的加密货币交易所之一 `Binance` 为 `Binance Pool` 提供动力支持。`Binance\
  \ Pool` 是一个新兴且受欢迎的平台，由于其交易所平台和原生货币 `Binance coin` 的成功，它目前挖掘了约占所有区块 9% 的区块。\n\n##\
  \ 结论\n\n本章探讨了支撑安全和去中心化区块链运行的各种机制。我们首先考察了比特币网络中的共识概念，强调了它在维护网络完整性方面起的关键作用。随后，我们深入研究了公共区块链的内部运作机制，并深入探讨了比特币利用的工作量证明（`PoW`）系统及其对\
  \ `HashCash` 协议的依赖。本章进一步探索了替代的共识机制，如权益证明（`PoS`）、销毁证明（`PoB`）和耗尽时间证明（`PoET`），每种机制与\
  \ `PoW` 相比都有其优缺点。最后，我们讨论了与工作量证明相关的潜在漏洞和中心化担忧。通过理解这些核心概念，你将获得对区块链技术基础的宝贵见解。\n\n下一章将专门介绍区块链技术在全球不同类型企业的部署。\n\
