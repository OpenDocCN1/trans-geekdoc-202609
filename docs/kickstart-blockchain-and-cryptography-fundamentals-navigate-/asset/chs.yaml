  \n我们现在开始配置构建在 IBM Cloud 上的 Hyperledger Fabric 网络以及在该网络上运行应用程序所需的各种服务。\n\n# 创建 IBM\
  \ Cloud 服务\n\n区块链服务指的是为构建和运行区块链应用程序的公司提供的第三方云基础设施和管理。`BaaS` 的功能类似于网络主机，为基于区块链的应用程序或平台运行后端操作。\n\
