  \ 第 10 章\n\n## 法律与环境方面\n\n## 引言\n\n加密货币是近期出现的一种虚拟货币的新支付方式。加密货币的使用和功能与传统支付方式相当不同，且不受任何政府的监管。印度最近决定对加密货币和非同质化代币等数字资产征收\
  \ 1%的预扣所得税（TDS）。我们将在本章中学习关于 NFT。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 加密货币的法律问题\n* 财产转移\n\
  * 数字所有权与非同质化代币\n* NFT 与加密货币的区别\n* NFT 的原理与用例\n* NFT 的应用\n* 使用中的电力消耗与环境足迹\n* 非法内容诈骗\n\
  * 资金转移\n* 区块链防洗钱\n* 区块链交换\n* 元宇宙\n\n## 加密货币的法律问题\n\n世界上所有的法定货币（传统货币）权威源于政府或货币当局。例如，每个卢比（印度纸币）由印度储备银行担保，正如美国联邦储备银行担保美元钞票一样。我们使用的法定货币（一种政府发行的货币）在所有国家都不由黄金等商品支撑。因为中央银行可以调节货币发行，法定货币使它们对经济拥有更大的控制权，并导致通胀。\n\
  \n### 世界主要国家加密货币的法律地位\n\n比特币和以太坊等加密货币没有公共或私有实体的支持或财务担保。在全球范围内，在不同的法律管辖区很难确定其法律地位。一个普遍事实是，加密货币很大程度上运行在现有金融基础设施之外。\n\
  \n所有用户以及金融银行机构都得出结论，加密货币无法归类为货币、资产或商品，因为它们缺乏内在价值和基础现金流。\n\n\n\n\n众所周知，加密货币是去中心化的系统，交易通过参与者之间的共识进行验证。它们的设计巧妙，旨在绕过金融系统及其所有的控制，且无法被政府追踪、没收或冻结。然而，在印度的\
  \ 2022 年预算中明确规定，`RBI`将在`FY 2023`推出印度数字卢比。\n\n2019 年 6 月，美国金融行动特别工作（`FATF`）建议加密货币的电汇应遵守其“旅行规则”的要求，该规则要求符合反洗钱（AML）规定。`wire\
  \ transfer`是一种传输资金的电子方式，也被称为银行转账。这种传输模式快速且安全，在银行之间进行。\n\n在美国，包括《银行保密法》在内的规定要求包括经纪交易商在内的金融机构必须制定并实施反洗钱（`AML`）合规计划。\n\
  \n萨尔瓦多是世界上唯一允许将`Bitcoin`作为货币交易的法定货币的国家。日本的《支付服务法》将`Bitcoin`定义为合法财产。\n\n然而，截至 2022\
  \ 年 4 月，在该国运营的加密货币交易所必须收集客户信息以及与电汇相关的细节。`China`已在其境内禁止了加密货币交易所和挖矿。\n\n值得注意的是，加密货币在欧盟是合。使用加密货币的衍生品和其他产品需要被认证为“金融工具”。2021\
  \ 年 6 月，欧盟委员会发布了《加密资产市场法规》（`MiCA`），为使用加密货币提供金融服务的公司或供应商制定了指导方和监管保护措施。\n\n美国被称为全球最大、最复杂的金融市场。`Bitcoin\
  \ futures`等加密货币衍生品可以在`芝加哥商品期货交易所`交易。但美国证券交易委员会（`SEC`）已反复重申，`Bitcoin`和`Ethereum`并非证券。\n\
  \n尽管加密货币被视为货币的形式，但美国国税务局（`IRS`）将其视为金融`asset or property`。此外，与大多数大多数投资一样，如果你出售或交易加密货币并获得资本利得，政府希望从你的利润中抽成。2021\
  \ 年 5 月 20 日，美国财政部宣布了一项提议，要求纳税人向`IRS`报告任何金额在$`10,000`及以上的加密货币交易。`IRS`如何处理税款——作为资本利得还是普通收入——取决于纳税人持有加密货币的时间长短。\n\
  \n## 财产转移\n\n财产定义为个人或企业拥有法律所有权的任何物品。财产的示例包括实体物品，如房屋、汽车或家电器，也可以指带有未来价值承诺的无形物品，如股票和债券证书。财产主要分为两个部分，即动产和不动产。针对任何财产（无论动产还是不动产）所实施的任何犯罪行为将根据`Crimes`法或《印度刑法典》（`IPC`）的规定受到惩罚。\n\
  \n`transfer of property`术语包括通过出售、抵押、租赁、可诉诸债权、赠与或交换进行的转移。该法不涵盖通过法律运作的转移，形式如继承、没收、破产或通过执行判决进行出售的转移。\n\
  \n《1882 年财产转让法》（`Transfer of Property Act 1882`）是一部规范印度财产转让的印度法律。它包含了关于何构成转移及其附带条件的特定规定。该法于`1882\
  \ 年 7 月 1 日`生效。\n\n根据该法，“财产转移”是指个人通过某种行为将财产转让给一个或多个个人或其本人。转移行为可以在现在进行，也可以为了未来进行。`person`一词可能包括个人、公司或协会、个人团体，任何种财产都可以转移，包括不动产的转移。\n\
  \n财产大致分为以下几类：\n\n*   不动产（不包括立木、生长中的农作物和草地）\n*   动产（如手表、木材）\n\n如果我们解释该法，它的意思是“不动产不包括立木、生长中的农作物或草地”。《1897\
  \ 年一般条款法》第`Section 3(26)`定义，“不动产”应包括土地、从土地产生的利益以及附着于土地或永久固定在附着于土地之物上的物品。此外，《1908\
  \ 年登记法》第`2(6)`规定，“不动产”包括土地、建筑物、继承津、道路权、光权、渡口权、渔业权或其他从土地产生的利益，以及附着于土地或永久固定在附着于土地之物上的物品，但不包括立木、生长中的农作物或草地。\n\
  \n注意，除非另有明确或暗示的规定，否则财产转移将立即向受让人转让转让人当时能够转让该财产的所有权益。\n\n根据《1882 年财产转让法》的第`Section\
  \ 43`：\n\n*   如果个人通过欺诈或错误表示其有权转让某些不动产，并采取了某些行为为了对转让此类财产，则此类转移在未来继续有效。它将对转让人可能在该等财产中获得的任何权益上生效。\n\
  *   这取决于受让人的选择，并可以在转移合同存在期间进行。根据此规则，对先前的转移或选择权不知情的**诚实受让人**（`bona fide transferee`）的权利受到保护。这一规则体现了**禁止反言**（estoppel`）原则，意味着做出过陈述的人以后不能违背该陈述。\n\
  *   每个有签订合同能力的人都有权转让可以全部或部分转移的财产。他应当拥有该可转财产，或被授权处置不属于自己的可转财产。权利可以是绝对的或附条件的，财产可以是动产或不动产、现在或未来的。除非法律特别要求以书面形式转移，否则此类转移可以口头进行。\n\
  *   即使个人在精神上有能力，但在身体上无法签署合同，其聘请的财产律师可以通过委托书（`power of attorney`）协助完成。\n\n根据《财产转让法》第`Section\
  \ 6`，任何种类的财产均可转移。然而，主张不可转移的人必须证明存在限制转移权利的法律或习惯。除非有法律阻止转移，否则所有者可以转移财产。如果转移的财产附带绝对限制受让人放弃或处置其财产权益的条件，则该条件无效。唯一的例外是租赁情况，即该条件是为了出租人或其索权人的利益。通常，只有拥有财产利益的人才有权转让并能向其他人传递适当的所有权。\n\
  \n这些条件必须满足：\n\n\n\n\n\n- 转让人必须做出某种陈述，证明其有权转让该不动产。\n- 该陈述应当是欺诈性的或错误的。\n- 受让人必须基于该陈述进行诚意行为。\n\
  - 转让应是为了对价进行的。\n- 转让人随后应获得其曾同意转让财产的某些权益。受让人可能拥有获得转让人随后获得的权益的期权。\n\n# 数字所有权与非同质化代币\
  \ (NFT)\n\n数字所有权提供了访问和/或使用关于我们或他人拥有物体的数据、信息和知识的权限。或者，它还授予或撤销对这些数据的权利。数字所有权也是物联网（IoT）的一个组件层，能够对单个物体收集数\
  \ GB 字节的数据。\n\n非同质化代币（NFT）被定义为一种数字资产，代表艺术、音乐、游戏物品和视频等现实世界物体。它们在线上进行展示、购买和出售，通常使用加密货币，并且它们通常与许多加密货币使用的相同底层软件进行编码。不言而说，NFT\
  \ 是存在于区块链上的独特加密令牌，无法被复制。\n\n尽管 NFT 自 2014 年以来就存在，但由于尽管它们日益流行，但投入其中的大部分资金来自未经批准的来源，目前\
  \ NFT 正在变得声名大噪。\n\n根据 Forbes Advisor India（2022 年 8 月 4 日）的报告，自 2017 年 11 月以来，NFT\
  \ 已经花费了惊人的 1.74 亿美元。\n\n也许 2021 年最著名的 NFT “EVERYDAYS: The First 5000 Days”是由著名的数字艺术家\
  \ Mike Winklemann（以其艺名“Beeple”闻名）创作的，他使用了 5000 幅每日绘画的组合。它在佳士拍卖以惊人的 6.103 亿美元售出。\n\
  \n任何人都可以免费查看单张图片——甚至在线查看整个图像拼贴。那么，为什么人们愿意花费数百万美元购买他们可以轻松截图或下载的东西呢？\n\n原因是 NFT 允许买家拥有包含内置身份验证的原始物品，这可以用作所有权的证明。\n\
  \n# NFT 与加密货币的区别\n\n物理货币（钱）和加密货币是“同质化的”，这意味着它们之间可以相互交易或交换。同质化的另一个词是可交换的、可替代的、互换的或可转换的。加密的同质性使其成为区块链上进行交易的可靠手段。\n\
  \nNFT 使用与加密货币（如比特币或以太坊）类似的编程构建，但相似性仅限于此。\n\n每笔 NFT 交易都是不同的，因为它们有数字签名，使得 NFT 无法相互交换或相等（因此，是非同质化的）。\n\
  \n## NFT 的原理\n\nNFT 存在于区块链上，区块链是一种记录交易的分布式公共账本。你可能熟悉区块链作为使加密货币可能的底层流程。NFT 通常存储在以太坊区块链上，尽管其他区块链也支持它们。\n\
  \n通常，NFT 是从代表有形无形物品的数字对象创建或“铸造”的，包括：\n\n- 独特的数字艺术品或图形艺术\n- 视频和体育集锦\n- 与 VIP、Neta、Abhineta\
  \ 相关的收藏品\n- 虚拟头像和视频游戏皮肤\n- 设计师运动鞋\n- 音乐\n- 限量时尚系列中的独特运动鞋\n- 游戏物品\n- 一篇文章\n- 数字收藏品\n\
  - 域名\n- 让你能够访问活动或优惠券的票\n- 家具\n- 迷包\n- 重大体育时刻\n- 虚拟时尚\n- 现实世界资产\n\n推文数量也可以包含在内。推特创始人\
  \ Jack Dorsey 将其第一条推文作为 NFT 出售，价格超过 290 万美元。\n\n# NFT 的用例\n\n在考虑拥有 NFT 时，需要记住以下因素：\n\
  \n- NFT 就像物理收藏品，只是数字的。所以，买家不是得到一幅挂在墙上的实际油画，而是得到一个数字文件。\n- 们还获得了排他性的所有权。NFT 一时间只能有一个所有者，它们对区块链技术的使用使得验证所有权在所有者之间传输令牌变得更容易。\n\
  - 创作者还可以在 NFT 的元数据中存储特定信息。例如，艺术家可以在文件中包含签名来对他们的作品进行签名。\n- 区块链技术和 NFT 为艺术家和内容创作者提供了一个变现商品的独特机会。例如，艺术家不再依赖画廊或拍卖行来出售他们的艺术。相反，艺术家可以作为\
  \ NFT 直接卖给消费者，这让他们能够保留更多利润。此外，艺术家可以在程序中设定版税，这样每当他们的艺术出售给新所有者时，他们都会收到销售额的百分比。这是一个非常有吸引力的特征，因为艺术家在艺术首次出售后通常不会获得未来的收益。\n\
  - 即使是像 Snoop Dogg 和 Lindsay Lohan 这样的名人也加入了 NFT 的行列，将独特的记忆、艺术品和时刻作为证券化的 NFT 发布。\n\
  \nNyan Cat（一个 2011 年的、带有派塔身体的猫的 GIF）在 2 月以约 60 万美元售出。NBA Top Shot 截至 3 月底产生了超过 5\
  \ 亿美元的销售额。单段莱布朗·詹姆集锦卖了超过 20 万美元。\n\n随着发行人的虚拟货币或令牌越来越流行，用户现在能够通过第三方供应商、点对点传输和全现金兑换来提取虚拟货币。许多交易所提供法币兑加密货币的交易、交易和投资服务。这使得数字货币从一种用于单一公司预付商品或服务的手段，变成了广泛接受的真实货币代理，以及在多方之间传输法币的手段。\n\
  \n在 SEC 认为是里程碑的案件中，发行人被要求遵守州和联邦货币汇款和货币服务业务法律。许多加密货币初创公司通过简单地将运营转移到避税天堂和离岸地区，绕过了美国、加拿大、欧洲和澳大利亚的许多金融服务法。\n\
  \n# 区块链数字所有权\n\n加密货币和令牌在任何司法管辖区都没有任何法币地位。美国国税局（IRS）将令牌和加密货币描述为价值的数字表示，作为交换媒介、记单位和价值存储手段。\n\
  \n基于目前关于货物、价值和交换的法律概念，资产仍然非常简单和过时。因此，取决于司法管辖区，加密货币可能被视为视为货币。虚拟令牌和财产数字所有权的混合性质使得这种不一致性更加糟糕。\n\
  \n加密货币和虚拟商品从法律角度来看无法分类，因为它们的法律地位对许多解释开放。在行业增长以及立法者和其他机构能够更好地装备以预测和理解其细节和后果之前，这种情况可能会继续发生。\n\
  \n\n\n\n事实上，监管的缺失并没有阻止任何人（包括投资者）通过加密货币换取数字代币、虚拟产品或游戏内物品。游戏制作商正在将独家数字产品整合到其游戏竞技场中，以吸引用户并建立封闭经济。为了购买所谓的数字资产，如虚拟猫等可收藏（非同质化）代币，玩家投入了数百万美元购买房地产。\n\
  \n区块链游戏“CryptoKitties”由加拿大公司 `Dapper Labs` 使用 `Ethereum` 创建。玩家可以在游戏中生成、购买和出售非同质化代币。这些\
  \ NFT 代表数字猫科动物。Digital Felines 是一家位于希腊塞萨洛尼基（Thessaloniki）的营销机构，其唯一目的是创建、管理和扩大您的业务形象。\n\
  \n在 `CryptoKitties` 之后，其他区块链和游戏开发者开始向狂热的粉丝提供法咒、武器、纹理、皮肤、房产、岛屿和其他数字资产。\n\n尽管缺乏治理，投资者和普通大众继续接受加密货币来交换和购买虚拟产品、游戏内物品和数字代币。越来越多的开发者正努力向游戏中添加独家数字商品，以激发玩家的兴趣并建立“封闭经济”。玩家在所谓的“数字资产”上花费了数百万美元，其中包括虚拟猫和其他可收藏非同质化代币。\n\
  \nNFT 支持者断言，这项技术在两个方面是突破性的。首先，它帮助艺术家（特别是新兴艺术家）摆脱唱片公司和画廊等中间机构的控制，这些机构传统上将大部分收益留在了那里。艺术家与观众之间可以建立直接的互动和互互利的协议。包括\
  \ `Ellen DeGeneres`、`Eminem` 和 `Salman Khan` 在内的大量名人已加入 NFT 市场。\n\n`CryptoKitties`\
  \ 是利用区块链技术用于休闲和娱乐目的的初早期尝试之一。由于该游戏的流行，`Ethereum` 网络在 2017 年 12 月经历了拥堵，导致交易量达到历史新高，并显著降低了网络速度。玩家可以购买、繁殖和交易具有独特视觉特征和不同稀有程度的虚拟猫。要玩游戏，玩家必须购买加密货币\
  \ `Ether`，并使用它来完成所有的交易和繁殖任务。\n\n`Ethereum` 的底层区块链网络驱动着 `CryptoKitties` 的运行。每个 `CryptoKitty`\
  \ 代币都是非同质化的（NFT）。每一个都是独特的，属于用户，经过区块链验证，并受市场价值波动的影响。即使是游戏开发者也无法在未经用户同意的情况下复制或重新分配\
  \ `CryptoKitties`。\n\n## 数字物品的所有权是真实的还是虚假的？\n\n尽管缺乏监管，使用真实货币购买虚拟产品、游戏内物品、代币和数字货币的做法变得越来越普遍。\n\
  \n无论是为了一个 `Eve Online Revenant Titan` 花 11,000 美元，还是为了 `CryptoKitties` 上的虚拟猫花费 170,000\
  \ 美元，亦或是为了一个 `Dota 2` 信使花费 38,000 美元，人们在数字商品上花费大量资金是为了转售。\n\n从理论上讲，这些物品都有价值——至少对于支付它们的个人而言如此。然而，各国对于是否将这种价值归类为商品还是货币存在争议。这种区别至关重要，因为如果它们被视为货币，将由中央银行管理；但如果被视为商品，将受到相关商品机构的监管并产生税收影响。\n\
  \n用户正在收集应用程序、媒体、游戏内商品和加密货币库，然后他们可以将这些收藏赠送、分享和出售给其他用户。然而，用户在注册游戏或服务时接受的条款几乎总是规定他们购买的数字商品是不可转让的。这里的问题在于真实账户是否可以转让。其他类型的账户具有高度定义但无形的价值，例如持有一定数量加密货币的数字交易配置。\n\
  \n欧洲法院 2012 年的 `Oracle v. UsedSoft` 裁定出售二手软件（包括数字和实体游戏）是法的，只要卖家将其从计算机中删除。然而，租赁二手软件是被禁止的。\n\
  \n但是，2014 年 6 月德国哈姆地区法院的一项判决并未涵盖下载的数字内容。此外，在数字商品和游戏内购买方面，法律可能会令人混乱，尽管它在音乐、电影和书籍方面通常非常直观。\n\
  \n虚拟资产日益流行并在全球普及将不可避免地导致人们对数字所有权关注的提高。政府最终需要就他们应该和不应该控制的内容，以及实施这些的最佳方法进行重要的对话。\n\
  \n位于旧金山的一家精品律师事务所 `The Gamma Law` 代表创新行业中的一小组客户。他们推向创新的边界，为客户提供在复杂动态的业务环境中蓬勃发展所需的支持，并帮助他们在国内和全球实现目标。\n\
  \n## 区块链操作中的电力消耗与环境足迹\n\n不可否认，`Bitcoin` 在过去的十年中已进入主流，但可能并不是像 `Nakamoto` 想象的那样。根据\
  \ `Nakamoto` 的创始白皮书，`Bitcoin` 是为了实现即时、无国界的交易，且没有今天存在的高昂费用或外汇障碍。\n\n当神秘的、可能不存在的 `Satoshi\
  \ Nakamoto` 在 2009 年铸造世界上第一种加密货币时，该计划是创建一个去中心化的支付平台，彻底改变我们买卖一切的方式。\n\n从概念上讲，`Bitcoin`\
  \ 似乎不需要大量的电力。在智能手机上购买和出售 `bitcoin`，你只需要指向并点击或触摸。几十年来，我们一直拥有电子网络为不同类型的数字交易执行基本相同的功能。\n\
  \n在 `Bitcoin` 早期，这种方法不需要国家级的电力。然而，加密货币中的算术题被设计为随着越来越多的人争相解决它们会变得越来越非常困难。随着更多人尝试投资\
  \ `Bitcoin`，这种动态只会变得越来越强。\n\n`Bitcoin` 要求计算机进行日益困难的数学运算。在中心化网络上验证交易所需的能耗远低于这种工作量共识机制。\n\
  \n\n\n\n自诞生以来，比特币的最小信任共识机制一直得益于其工作量证明算法（参见 `第 4 章，开放环境下的分布式共识`）。执行此项工作的机器在在此过程中消耗了巨大的能量。此外，所使用的能量主要来源于化石燃料。创建“比特币能源消耗指数”（Bitcoin\
  \ Energy Consumption Index）旨在为这些耗用量提供见解，并提高人们对工作量证明算法不可持续性的认识。\n\n越来越多的矿机（或专用计算机）加入了这场对抗这一问题的战斗，向生态系统投入了大量的电力和处理能量，试图成为第一个解决比特币数学难题并获得相关奖励的人。尽管可能有成千上万台计算机在竞相解决同一个问题，但最终只有一台可以获得比特币报酬。\n\
  \n完成这一过程需要非常长时间：一笔比特币交易可能需要十分钟。其他数字交易（例如由 `Visa` 驱动的交易）耗时不到一秒，且使用的能量仅为其 `1/500,000`，因为它们依赖中心化机构来验证交易。\n\
  \n加密货币（如比特币）并没有实现常规交易，而是大多数演变成了投机性资产（一种数字黄金），吸引了那些认为他们可以在未来出售持仓以获得巨额利润的投资者。然而，由于比特币淘金涉及巨大的电能消耗，它对人类产生了严重的生态影响。\n\
  \n《富比时》杂志指出，每笔比特币交易消耗 `1,173` 千瓦时。作者补充道，这种能量可以“为一个典型的美国家庭提供六周电力”。他们认为，支持购买、出售或转账的比特币挖矿消耗了价值\
  \ `$176` 的电能。\n\n根据数据科学家 `Alex de Vries` 创建的在线工具 `Digiconomist` 提供的“比特币能源消耗指数”数据，作为全球最大的加密货币，比特币的碳足迹与新西兰相当，两者每年向大气中排放近\
  \ `37` 百吨二氧化碳。\n\n比特币能源消耗指数提供了比特币网络总能量消耗的最新估计。\n\n`CBECI` 是一个持续进行的项目，由位于剑桥大学法学院商学院的替代金融中心（一家独立研究机构）的\
  \ `数字资产计划（DAP）` 团队创建并维护。\n\n剑桥比特币能源消耗指数对比特币网络的年度总用电量提供了实时估计。其底层模型根据实时价格和哈希率数据每三十秒更新一次网络功率估计。\n\
  \n自 `2020` 年以来，剑桥提供了关于比特币矿工随时间局部变化的详细见解。\n\n根据剑桥的计算，估计在 `48.7` 的平均效率下，生产一个比特币大约需要\
  \ `142,498 kWh`。这相当于 `142 MWh` 或 `0.142 GWh`。若要获得网络每天使用的能量总量，我们将开矿一个比特币所需的 `kWh`\
  \ 乘以 `900` 枚币的日产率。\n\n区分耗电量和环境足迹至关重要。前者涉及比特币挖矿过程中使用的总电量，而后者则关注比特币挖矿对环境的影响。环境足迹考虑了商品和服务的整个供需，这些需求被计为任何用户或用户组所使用的能量。在此过程中，假设整个人口都遵循某种生活方式。\n\
  \n## 对抗比特币的能源问题\n\n在 `2022` 年，估计有 `39%` 的工作量证明挖掘是通过可再生能源进行的。因此，最明显且最易建议的行动可能是政府在向用户提供电力服务时，强制用户公司采用绿色手段。\n\
  \n无数初创公司应而生以解决这个问题，每个公司都目标是为比特币带来环保的新方法。总部位于香港的 `LiquidStack` 旨在更高效地降低矿机温度，而冰岛的\
  \ `Genesis Mining` 则专门使用可再生能源。\n\n*   切换到可再生能源\n*   转型到权益证明系统\n*   强制接受预挖矿\n*  \
  \ 引入碳积分或费用\n*   切换到可再生能源\n\n根据 `eToro` 加密货币市场分析师 `Simon Peters` 的说法，加密货币可能会从工作量证明转向权益证明（见本书的\
  \ `第 4.5 节回顾`），这不需要同样疯狂的解题过程。\n\n这背后的基本理念是，为了有资格通过权益证明验证交易，网络用户必须预付一少量的加密货币并参与抽奖。\n\
  \n这种想法是，如果你投入了某种价值价值作为押金，你就不可能批准会导致货币贬值并让你损失押金的欺诈性交易。\n\n与工作量证明 (`PoW`) 系统（多台机器竞相回答同一个问题并消耗能量）不同，权益证明\
  \ (`POS`) 系统在消除竞争性计算元素的同时节省了能量。驱动 `Ether` 和大多数 `NFT` 的区块链系统以太坊正处于工作量证明向权益证明转换的过程中。这将大幅减少基于太坊的加密货币和区块链的能量消耗，估计减少\
  \ `910.5%`。\n\n*   接受预挖矿\n\n\n\n\n为了避免为了赚取数字货币而快速求解数学问题所导致的浪费性计算浪费，某些加密货币引入了“预挖”（pre-mining），这是一种在功能上类似于法币或股票的系统。由一个中央机构，例如\
  \ `U.S.` 政府（针对美元）或某公司（针对股票）创建固定数量的物品，然后根据世界局势或其业务情况，审慎地将其释放到经济中。\n\n其他几种加密资产如 `XRP`（也被通俗称为\
  \ `Ripple`）根本没有经过挖矿，而是通过算法产生的。这种想法消除了对专用高速挖矿设备的需求。\n\n在这些系统中，交易在被添加到货币的区块链记录之前，仍需由去中心化的验证者网络进行验证。但交易的参与者可能需要支付一小笔交易费用，以补偿验证者的努力，因为货币系统本身并不总是能给予他们奖励。在\
  \ `XRP` 的情况下，目前该费用仅为几分之一。\n\n据报道，将 `Bitcoin` 转型为质量证明或预挖系统并非易事。若要对 `Bitcoin` 协议进行任何根本性改变，必须说服大多数矿工同意新系统。考虑到在运行缓慢且电力效率低下的现有系统中涉及着数十亿的资金，这是一项相当艰巨的任务。上一次发生如此规模的变更时，并没有获得矿工的普遍接受，导致了所谓的“硬分叉”，创建了一个名为\
  \ `Bitcoin Cash` 的独立加密货币，而其后来又硬分叉成了 `Bitcoin SV` 等。\n\n### 引入碳额度或碳税\n\n政府许可公司向环境中排放一定数量的碳排放的能力被称为“碳额度”（`Carbon\
  \ credits`）。这些额度通常保持证券化，因此可以由负担得起产生较少排放的公司出售（卖）给其他公司。因此，这为公司产生少于配额的排放提供了激励，同时也对超标者进行惩。对于加密挖矿公司来说，这可能意味着它从其他公司购买碳额度来抵消其产生的排放，或者切换到更绿能源，以便通过出售自己的额度获利。\n\
  \n# 区块链的环境未来\n\n根据 `Digiconomis’s` 的估计，在 2022 年，电力成本每年消耗了 `Bitcoin` 挖矿利润的预计 28%。\n\
  \n类似于 `Ethereum` 实现的智能合约将允许公司自动处理许多复杂的支付和业务流程系统，通过自动检查来确保订单等符合合同的条款和条件。这可能允许公司减少需要通勤到办公室处理订单的员工人数，从而减少与交通相关的碳排放。\n\
  \n尽管在未来几年内我们可能无法完全知区块链技术绿色应用的全部潜力，但已经有关于使用它来应对重大问题的讨论，例如帮助公司更好地记录碳排放，甚至在一种真正的“元级别”操作中，利用区块链驱动的碳额度迈向碳中和未来。\n\
  \n区块链是一个强大的工具，可以显著提高温室气体排放的透明度、问责制和追溯性。它帮助公司提供更准确、可靠、标准化且易于获取的碳排放数据。区块链通过代币化（使用数字房地产代币代表物理资产），具有简化寻找和购买房地产的潜力。\n\
  \n# 非法内容\n\n非法内容通常是指道德上不道德或不可接受的、被视为社会禁止的内容。在 `Chapter 1, Overview of Blockchain`\
  \ 中，我们了解到每笔 `Bitcoin` 交易都存储在分布式数据库中。几年前，人们开始注意到嵌入在 `Bitcoin` 区块链中的各种事物。\n\n\n\n\
  区块链是对任何类型数据的永久记录，从图像到简短信息等等。用户应该意识到其中存在某些危险，因为每个参与者都必须在本地复制整个区块链，包括任何潜在的有害材料。专家调查发现，区块链上超过\
  \ 1600 个文件（其中 99% 以上是文本或图像）由于包含某些内容（例如非法色情），仅仅拥有该区块链就可能导致违法。这些文件包含明显冒犯性且狡猾的内容，包括与所有比特币用户共享的儿童色情链接。\n\
  \n# 诈骗者\n\n通常情况下，`spam`（垃圾邮件）是指未经请求的电子邮件、即时消息或社交媒体消息。这些信息很容易识别，如果你打开或回复，可能会造成损害。`Scammers`（诈骗者）使用电子邮件或短信骗你提供他们的个人信息。他们可能会尝试窃取你的密码、账户号码或社会安全号码。如果他们获取了这些信息，就可以访问你的电子邮件、银行或其他账户。\n\
  \n诈骗者每天发起数千次类似的网络钓鱼攻击，并且往往成功。`Phishing`（钓鱼）是网络罪分子发送的伪装成来自合法、可信来源的电子邮件。`Phishing`\
  \ 是一种在线诈骗，通过向消费者发送看似看似来自知名来源（如互联网服务提供商、银行或抵押公司）的电子邮件来针对他们。它要求消费者提供个人身份信息。\n\n在加密货币世界，诈骗和网络钓鱼攻击有许多形式。以下是你应该警惕的一些常见诈骗手段列表：\n\
  \n*   **冒充**：你可能会通过电话、社交媒体或电子邮件收到伪装成 `Blockchain.com` 员工的来信。员工绝不会在社交媒体上打电话或与你联系。所有邮件将源自官方的\
  \ `Blockchain.com` 电子邮件账户，后缀为 `blockchain.com` 或 `blockchain.info`。在任何情况下都不会索要登录凭据。如果你不确定，请打开支持中心工单（Support\
  \ Center Ticket）以验证请求的合法性。\n*   **钓鱼邮件或网站**：在收到并非你发起的电子邮件时，务必保持警惕。如果邮件要求你访问某个网站并重置密码，除非你明确请求过此操作，否则不要这样做。此类诈骗通常会导致恶意第三方记录你的登录详情并窃取你的资金。`Blockchain.com`\
  \ 员工绝不会向你索要 `Secret Private Key`（私钥）或 `Recovery Phrase`（恢复助词）。如果有人要求你提供这些信息，你可以在支持中心报告。\n\
  *   **虚假投资建议**：此类诈骗可能会要求你“支付费用”或“缴税”，以便向你释放更多资金。诈骗者通常引用官方机构，如 `SEC` 或其他。欺诈者甚至会伪造像官方的文件或假身份证。\n\
  *   **虚假退款**：`Blockchain.com` 不提供第三方平台丢失资金的退款服务。如果有人要求付款以找回/退还来自第三方平台或旧遗忘钱包的丢失或此前被骗资金，那么这种请求绝对是诈骗。此类服务绝不会收费。\n\
  *   **情感诈骗**：这是一种欺骗行为，涉及冒充未来的伴侣或承诺虚假关系，可以作为说服技术来操纵受害者，以提取资金或敏感数据（如登录凭据、恢复助词等）。在社交媒体上遇到新人时，请务必小心。\n\
  *   **资金转账/存款/取款**：绝不要代表他人进行资金转账，无论是为他们代办还是通过提供你的登录详情。这不仅可能违反反洗钱和恐怖主义融资的规定，如果你让他人访问你的账户，你也将使自己的资金面临风险。\n\
  *   **平台克隆版**：警惕修改过的 URL，如 `b1ockchain.com`、`bl0ckchain.com`、`blockchain.io` 等。确保你正在使用带有正确\
  \ URL 的官方网站访问账户。`Wallet` 平台的登录页为 `https://login.blockchain.com/#/login`，其交易所平台为\
  \ `https://exchange.blockchain.com/trade/login`。\n\n其他类型的诈骗和钓鱼攻击可能包括勒索、假交易所、假空投、可以影响\
  \ `Clipboard` 的恶意软件、带有恶意链接作为 `MEMO` 的 `XLM` 交易、SIM 卡攻击（Sim Swap）以及“拉高出货”计划等。\n\n\
  请同样注意以下点：\n\n*   任何非 `blockchain.com` 或 `blockchain.info` 域名结尾但看起来像来自官方的邮件很可能是恶意的。\n\
  *   如果你接到一个冒充 `Blockchain` 员工的电话，这可能是诈骗，因为他们从不主动打电话。\n*   如果邮件进入了你的垃圾邮件箱或订阅邮件箱，请检查邮件头以确保发件者确实是其所称的人。\n\
  *   通常避免点击未请求的邮件或来源中的链接或下载文件。\n\n# 资金转账\n\n\n\n基于区块链的反洗钱（AML）平台中的智能合约集成功能实现了系统欺诈检测的自动化。内置算法对每笔交易进行持续检查，自动为可疑交易生成警报并立即拦截该交易。因此，在反洗钱中使用区块链能够实现对所有交易的监管。\n\
  \n# 区块链交易所\n\n该交易所侧重于主流采用和易用性。\n\n在这里，比特币追随者可以查看市场、检查之前的订单状态、进行存款、提现资金并交易加密资产。在某些地区，你还可以使用法币购买加密货币。该区块链交易所的构建目标是那些寻找快速、直观且简单交易体验的交易者。\n\
  \n加密货币交易所是指人们可以购买、出售或将法币兑换数字货币的网站或服务。这与加密货币钱包不同，后者允许投资者保留所有加密货币的程序。\n\nCoinbase\
  \ Global, Inc. 销售品牌 `Coinbase`，是一家运营加密货币交易所平台的美国公司。Coinbase 是一家分布式公司；尽管没有实体总部，但每位员工都远程工作。按交易量计算，它是美国最大的加密货币交易所，处理超过\
  \ 30 种不同的加密货币。\n\nCoinbase Pro 是支持 Coinbase 的强力交易所，是目前规模最大、最安全的平台之一。\n\n根据彭博亿富翁指数，加密货币交易所\
  \ Binance 的创始人赵长鹏（Changpeng Zhao）的估计价值为 960 亿美元，使成为加密货币领域最富有的人。\n\nFTX 是一个快速发展的加密货币交易所，提供融资交易和期货交易等高级交易选项。虽然美国居民由于严格限制无法使用它，但提供一个独立的交易所\
  \ `FTX.US`，不过提供的加密货币种类较少。除了现货交易，FTX 还提供广泛的服务。它支持比特币和以太坊衍生品交易以及 NFT 交易。美国居民无法在 FTX\
  \ 全球平台进行交易：由于美国对加密货币领域的严格监管，美国居民访问 FTX 的权限有限。该交易所有一个美国合作伙伴 `FTX.US`，但其产品比全球平台更有限。\n\
  \n`FTX.US` 和 Coinbase 都优先考虑安全，且截至 2022 年 4 月为止拥有良好的记录。在这两个中，Coinbase 存在时间长得多，没有发生过任何数据泄露或黑客攻击。但从安全角度来看，这些加密货币交易所表现均良好。`FTX.US`\
  \ 和 Coinbase 均提供双重身份验证（2FA）。\n\n# 以太坊 MetaMask 交易所\n\nMetamask 应用包含一项集成服务，通过聚合多个去中心化交易所（DEXs）来寻找最佳汇率以交换\
  \ `Ethereum` 代币。此功能被称为 MetaMask Swaps，收取交易金额 0.875% 的服务费。\n\nMetaMask 为区块链新手、代币交易者、加密游戏玩家和开发者提供了基本的工具。MetaMask\
  \ 提供了连接区块链应用最简单且最安全的方式。在新的去中心化 Web2 上交互时，你始终拥有控制权。MetaMask 在你的设备上生成密码和密钥，因此只有你访问自己的账户和数据。你始终决定分享什么以及保留什么隐私。Web\
  \ 3.0 的吸引力在于它是去中心化的，这意味着消费者不再通过 Google、Apple 或 Facebook 等公司提供的服务访问互联网，而是由个人拥有并治理互联网的部分。Web\
  \ 3.0 通过利用去中心化网络确保用户始终对其在线数据拥有控制权。互联网的下一个版本预计由于其去中心化的本质将更加可靠，因为它消除了单点故障的可能性。但它与\
  \ VPN 有很大不同。\n\nWeb 2.0（也称为参与式网络或社交网络）指的是强调用户生成内容、易用性、参与式文化以及终端用户互操作性（即与其他产品、系统和设备的兼容性）的网站。\n\
  \nWeb 3.0 也称为万维网的下一次演进。有些文献称之为第 4 代 Web。它提供了一种数据驱动的语义网，利用机器对数据的理解，目标是为用户开发更智能、更具连接性的\
  \ Web 体验。Web 3.0 的三个关键基石是人工智能（AI）、物联网（IoT）和区块链技术。区块链将帮助实现去中心化的数据存储，并增强对虚拟世界的信任。Web3\
  \ 是一些技术人员对这种新型互联网服务的命名，该服务使用去中心化区块链构建——即比特币和以太坊等加密货币使用的共享账本系统。这个术语已经存在了多年，但它在 2021\
  \ 年左右开始流行。\n\n# 脆弱性\n\n脆弱性通常被定义为与年龄相关的生理衰退综合征，其特征是对不良健康结果具有显著的易脆弱性。一些比特币观察者（如 Swanson）也担心大型交易所之一可能会被当局突然关闭的风险。\n\
  \n7 月，美国当局关闭了 `BTC-e` 交易所网站，称其便利了涉及勒索软件、计算机黑客、身份盗窃、退税诈骗计划、公职腐败和毒品交易的交易。\n\n不再运营的\
  \ `BTC-e` 无法联系。根据数据提供商 Bitcoinity 的数据，在百多个交易所中排名前名的 Bitfinex、GDAX 和 bitFlyer 占所有交易量的\
  \ 60% 以上。\n\n在互联网中断的情况下，比特币区块链将停止同步。账本将停止记录比特币交易，导致交易处理暂时中断。如果交易保持一致，网络将恢复。基于区块链的替代方案可以通过将互联网巨头替换为去中心化的点对点网络来解决这个问题。在这种替代方案中，社区成员将拥有并运营用于存储和计算的基础设施。\n\
  \n如果发生互联网中断将会？对于普通人来说，某些手机和服务短信将无法使用，所有移动应用程序和社交网站将宕机，云存储无法访问，任何处理中的电子支付将失败。\n\n\
  没有个人、公司、组织或政府运行互联网。它是一个由许多自愿连接的自治网络组成的全球分布式网络。它没有中央治理机构，每个组成网络都设定并执行自己的政策。加密货币比特币引起了全球政府的财务担忧。尽管用于购买商品和服务，但目前还没有统一的国际法律来监管比特币。\n\
  \n如今，银行和其他金融机构使用的虚拟账本持有世界上 93% 的货币。随着金融服务的日益数字化，不可否认我们正在走向无现金未来；唯一的问题是这种未来将是什么样。\n\
  \n加密货币的寿命是多少？\n\n此外，区块链项目的平均寿命约为 1.22 年。\n\n然而，随着 2021 年比特币使用的激增，有一个好消息：非法活动处于历史低水平。根据\
  \ Chainalysis 的数据，涉及非法地址的加密货币交易比例从 2020 年的 0.62% 降至 2021 年的 0.15%。\n\n\n\n\n# 元宇宙\n\
  \n元宇宙是一个专注于社交连接的 3D 虚拟世界网络。在未来主义和科幻小说中，它通常被描述为互联网的一种假设性迭代，即一个单一的、通用虚拟世界，通过使用虚拟现实和增强现实头设备来实现。\n\
  \n“元宇宙”一词指的是一种混合技术环境，用户在其中“生活”在虚拟现实、增强现实和视频之中。元宇宙的支持者认为，用户可以参与其中的任何活动，从虚拟国际旅行到演唱会和会议，以及工作、游戏和与朋友保持社交联系。\n\
  \n元宇宙可以定义为一种模拟的数字环境，它利用 `augmented reality (AR)`、`virtual reality (VR)` 和 `blockchain`，结合社交媒体的概念，创造出模拟现实世界的丰富用户交互空间。\n\
  \n元宇宙还被描述为一个用户可以在多个数字位置之间连接、互动并传输自身及其所属物品的地方。通过元宇宙，客户将能够使用 `VR` 平台和硬件进行 3D 虚拟酒店之旅，并研究他们考虑入住的酒店位置。在预订酒店房间之前，旅行者可以穿上自己的\
  \ 3D 数字化身，对设施进行虚拟游览。\n\n关于元宇宙——这种由虚拟现实驱动的下一代 Web 版本可能是什么样子，存在争议。然而，尽管这种混合物理/虚拟景观具有不确定性，元宇宙不可避免地将成为一个功能齐全的市场（以及其他功能），用户可以作为自己的数字副本在不同地点之间快速穿梭，并在虚拟商店中购买商品。\n\
  \n虽然元宇宙不属于任何单一公司——`Google`、`Microsoft` 和 `Samsung` 也与 `Facebook` 一起参与了 `XR Association`\
  \ 的活动——但 `Facebook` 通过一场复杂的营销活动在这片虚拟土地上投入了最大份额，该活动包括将其重命名为 `Meta`。\n\n想象一下《头号玩家》，但更易于获取且更务实。想象一下现在的社交媒体，但更具整合且更具沉浸感。元宇宙的概念——近期因\
  \ `Facebook` 改名为 `Meta` 被推向主流——将改变我们居住周围世界的方式。\n\n这具有几点影响：\n\n*   除了二维数字空间外，用户现在将拥有一个偶尔可以居住的沉浸式现实。\n\
  *   内容创作者和设计师（特别是 3D 建模和 `VR` 世界构建专家）可以预见到未来道路上的新机会。\n*   元宇宙开启了一个新的经济体，可以使用与现实世界不同但与之相关的货币来创造、交易和增强财富。\n\
  *   元宇宙的执行需要新技术的演进。例如，你需要一个“数字我”或一个人的数字孪生来模拟现实世界的存在感。\n*   人们对数据隐私、安全、多样性和伦理行为存在担忧——这些现实世界的问题在虚拟世界中可能会呈现出新的维度。\n\
  \n# 元宇宙的起源\n\n虽然“元宇宙”一词对某些人来说可能是新的，但它作为一个概念已经存在了近三十年。美国科幻作家 `Neal Stephenson` 在他\
  \ 1992 年的小说《崩溃边缘》（Snow Crash）中引入了元宇宙。在小说中（以及同类型的其他作品中），用户利用元宇宙来逃避一个未来的、很大程度上是反乌托邦的世界。\n\
  \n在过去的 30 年里，行业一砖一瓦地为非构元宇宙奠定了基础。`Virtual reality` 头设备变得更加符合人体工程学且价格更加廉。全球互联网渗透率的提高，使得想象\
  \ `virtual reality` 体验、`augmented reality` 功能甚至 `blockchain` 交易成为可能。`Facebook` 在\
  \ 2021 年 9 月宣布了自己的元宇宙。\n\n## 结论\n\n所有 `fiat` 法币在主要国家都具有法律地位。\n\n在下一章中，我们将探讨与 `blockchain`\
  \ 相关的某些实际问题。\n\n## 参考文献\n\n1.  什么是 `NFT`？非同质化代币。\n2.  与数字所有权相关的风险、问题和担忧。\n3.  为什么比特币消耗这么多能量？\n\
  \n\n\n\n\n## 构建网络\n\n## 实践 1：如何开始 Docker 容器\n\n安装并理解 Docker 容器、`Node.js`、`Java`、Hyperledger\
  \ Fabric` 以及 `Ethereum`。在本地机器上进行必要的软件安装或在云端创建实例以运行。参考以下链接：\n\n* [`github.com/hyperledger/`](https://github.com/hyperledger/)\n\
  * [`docs.docker.com/get-started/`](https://docs.docker.com/get-started/)\n* [`console.ng.bluemix.net/docs/services/blockchain/index.htm`](https://console.ng.bluemix.net/docs/services/blockchain/index.htm)\n\
  \n## 容器\n\n完全隔离的可编程应用程序环境被称为容器。换句话说，它们共享相同的操作系统内核，但每个容器都可以拥有自己的网络接口、挂载点、进程和服务，就像虚拟机一样。\n\
  \n计算机操作系统的核心是一个称为内核的计算机程序，它对所有系统功能具有完全权限。它是操作系统代码中永久存储在内存中的区域，允许软件和硬件相互进行通信。\n\n\
  ![](img/Figure-11.1.jpg)\n\n**图 11.1：** 操作系统内核\n\n需要注意的是，容器并不是 Docker 新出的东西。\n\n\
  容器已经存在了十年了。在各种容器中包括 `LXC`、`LXD`、`LXCFS` 等。Docker 利用了 `LXC` 容器。由于这些容器环境使用了非常底层的代码应用，因此设置过程非常复杂。相反，Docker\
  \ 为像我们这样的终端用户提供了一系列非常易用的高级工具，这些工具具有许多强大的功能。\n\n![](img/Figure-11.2.jpg)\n\n**图 11.22：**\
  \ 容器与 Docker 管理\n\nDocker 技术利用了多种容器技术，如图 11.2 所示。\n\n## Linux 容器 (LXC)\n\nLinux\
  \ 容器 (`LXC`) 设计为一种操作系统级的虚拟化方法，用于使用单个 Linux 内核在控制宿主机上运行多个隔离的 Linux 系统（容器）。`LXC` 是一种广名的\
  \ Linux 容器运行时，由工具、模板以及库和语言绑定组成。\n\nLinux 容器设计用于运行应用程序，而虚拟机设计用于运行操作系统。Docker 是用 `Go`\
  \ 语言开发的，并利用了 `LXC`、`cgroups` 和 Linux 内核本身。由于它基于 `LXC`，Docker 容器不包含独立的操作系统；相反，它依赖于底层基础设施提供的操作系统本身的功能。`Go`\
  \ 最初是为网络和基础设施相关的程序构建的，旨在替代 `Java` 和 `C++` 等流行的高性能服务器语言。今天，`Go` 用于各种应用程序，如云和服务端应用、DevOps、命令行工具等。\n\
  \n控制组 (`cgroups`) 是 Linux 内核的一个特性，用于限制、统计和隔离一组进程或进程容器的资源使用（CPU、内存、磁盘 I/O、网络等）。`cgroups`\
  \ 的设计目标之一是为许多不同的用例提供统一的接口，从控制单个进程（例如使用 `nice`）到完全的操作系统级虚拟化。\n\n## Docker Dashboard\n\
  \nDocker Dashboard 允许用户快速查看其机器上运行的容器。Docker Dashboard 适用于 Mac 和 Windows。用户可以简单地管理容器的生命周期（停止、删除等），可以轻松访问容器日志，并在容器内部获取\
  \ shell。\n\nDocker Dashboard 提供了一个简单的界面，让你能够直接从机器上管理容器、应用程序和镜像，而无需使用命令行界面 (`CLI`)\
  \ 来执行核心操作。\n\n记住 `CLI` 是一个非图形化界面，用户输入命令，计算机随后执行。`Terminal` 是提供给用户的命令行界面环境。\n\n##\
  \ Docker 容器\n\nDocker 是一套使用操作系统级虚拟化来交付容器的平台即服务 (PaaS)，该服务提供免费和付费版本。托管容器的软件称为 `Docker\
  \ Engine`。它于 2013 年首次发布，由 Docker Inc. 开发。\n\n以下是 Docker 容器的特征：\n\n* 包含依赖项的可执行包被称为容器。\n\
  * 容器由于包含了所有依赖项（如库、二进制文件和框架），非常紧凑。\n* 容器本身非常易传输。\n* 运行时的完全隔离是一个额外的优势。即使在运行虚拟机时，它也能保证容器不受宿主机操作系统安全措施或特殊配置的影响。\n\
  * 容器内存可以在容器之间共享，这对于当你具有定义内存的虚拟机时非常有用。\n\n容器是使用 镜像构建的，运行这些镜像的命令是 `Run`。\n\n让我们在本节中通过实践\
  \ 1 运行 Docker 镜像的基本步骤。\n\n## Docker 工作原理\n\n首先，让我们回顾一些基础的操作原理 1。检查 Windows、`Fedora`、`Ubuntu`\
  \ 和 `CentOS` 等操作系统。它们由操作系统内核和一组程序组成。运行在操作系统内核（在此处为 Linux）之上的软件区分了不同的操作系统。不同的用户界面驱动程序、编译器、文件管理器、开发工具等可能包含在软件中。因此，所有操作系统都使用相似的\
  \ Linux 内核，某些特定的软件将每个操作系统与其他区分来。只要基于相同的内核，任何操作系统版本都可以运行在 Docker 之上。\n\n\n\n\nDocker\
  \ 可以通过读取 `Dockerfile` 中的指令来自动构建镜像。`Dockerfile` 是一个文本文件，包含了用户在命令行上可以调用的组装镜像的所有命令。它会在当前镜像之上执行任何命令，并创建一个新层来生成结果。\n\
  \n`RUN <command>`（该命令在 shell 中运行）\n\n`CMD`:- `CMD` 命令定义了容器启动时运行的默认命令。\n\n`Dockerfile`\
  \ 中使用的重要指令：\n\n* `RUN`: `RUN` 指令用于运行指定的命令。 \n\n    `ENTRYPOINT`: `ENTRYPOINT` 和\
  \ `CMD` 之间的区别在于，如果你尝试在 `docker run` 命令中指定默认参数，它不会忽略 `ENTRYPOINT` 的参数。例如，`WORKDIR\
  \ /usr/src/app`。\n\n* `EXPOSE`: \n\n    Docker 有四个个组成部分：\n\n    * Docker 客户端 (client)\n\
  \n    * Docker 服务端 (server)\n\n    * Docker 镜像 (image)\n\n    * Docker 注册表镜像 (registry\
  \ Image)\n\n# Docker 客户端和服务端\n\n这种解决方案需要你利用 Mac 或 Linux 计算机上的终端从 Docker 客户端向 Docker\
  \ 守护进程（daemon）发送命令。使用 REST API 来促进 Docker 宿主机与客户端之间的通信。可以发出类似的指令，例如 Docker `Pull`\
  \ 命令，它指示守护进程通过与其他组件（镜像、容器、注册表）交互来执行任务。实际上，Docker 守护进程充当与操作系统通信并提供服务的服务器。正如预期的，Docker\
  \ 守护进程持续扫描 REST API 请求以检查是否需要执行任何特定请求。如果你想从头开始进程，可以使用 Docker 守护进程内部的 `Docker` 命令启动所有性能。随后可以在\
  \ Docker 宿主机上执行客户端客户端。\n\n# Docker 镜像\n\n带有 Docker 容器指令的模板被称为 Docker 镜像。另一种标记语言（YAML）是编写该模板的语言。\n\
  \nYAML 文件包含 Docker 镜像，镜像随后作为文件托管在 Docker 注册表中。`Docker-compose.yml` 仅用于本地项目的设置。镜像中有多个重要的层，每一层都依赖于其下方的层。`Dockerfile`\
  \ 中的每个命令都会被执行以产生镜像层，该层是只读格式。在你的基础层之上有一个依赖层，这通常是你的基础镜像和基础操作系统所在的地方。这些构成了最终形成你的 `Dockerfile`（包括指令）的只读文件。\n\
  \n指令通过四层交付：`From`、`Pull`、`Run` 和 `CMD`。以下是它们目标的说明：\n\n* `From`: 在使用 `From` 命令创建基于\
  \ Ubuntu 的层后，来自 Docker 仓库的文件会被添加到该基础层的基础基础命令中。\n\n* `Pull`: 使用 `Pull` 从你的 Docker\
  \ 仓库添加文件。\n\n* `Run`: 构建容器。\n\n* `CMD`: 指明在容器内部执行的命令。在这种情况下，运行 Python 就是命令。当我们添加更多容器时发生的事情之一是，每个新容器都会为\
  \ Docker 环境引入新的镜像层。\n\n由于 Docker 环境中的每个容器都与其他容器独立\n\n# Docker 注册表\n\nDocker 注册表是一个存储和分发\
  \ Docker 镜像的服务。你可以使用像 Docker Hub 这样的公共注册表或托管自己的私有注册表。注册表允许你推取镜像。当你使用 `pull` 命令时，Docker\
  \ 从注册表下载镜像。当你使用 `push` 命令时，Docker 将镜像上传到注册表。\n\n## 容器化 Docker\n\nDocker 容器封装和运行应用程序的一种方式。它们是轻级、可移植且隔离的。你可以使用\
  \ Docker 创建、运行和管理容器。以下是运行容器的示例：\n\n```\ndocker run hello-world\n```\n\n# 在 Windows\
  \ 上分步安装 Docker\n\n以下是安装 Docker Desktop 的步骤说明：\n\n1. 访问网站 [`docs.docker.com/desktop-windows/install/`](https://docs.docker.com/desktop-windows/install/)\
  \ 并下载 Docker 文件。 \n\n   ***注意：64 位处理器和 4GB 系统内存是成功运行 Docker 的硬件前提。*** \n\n2. 然后，双击\
  \ `Docker Desktop Installer.exe` 运行安装程序。 \n\n   ***注意：假设没有下载安装程序 (`Docker Desktop\
  \ Installer.exe`)；你可以从 Docker Hub 获取它并在需要时运行。***\n\n3. 一旦开始安装过程，请务必在配置页面上启用 Hyper-V\
  \ Windows 功能。Windows  Docker 安装是一个操作系统级别的虚拟化软件平台，帮助用户构建和管理应用程序。\n\n4. 随后，按照安装过程允许安装程序运行并等待过程完成。\n\
  \n5. 安装过程完成后，点击 Close 并重启所有库依赖。\n\n# 启动 Docker Desktop 工具\n\n安装过程完成后，工具不会自动启动。要启动\
  \ Docker 工具，请搜索该工具并在桌面搜索结果中选择 Docker Desktop。\n\n在启动应用程序之前，Docker 提供了一个入入引导教程。该教程解释了如何构建\
  \ Docker 镜像和运行容器。你现在已成功在 Windows 上运行了 Docker Desktop。\n\n接下来，按照下面的指令在你的系统上安装 Docker\
  \ 引擎。访问 Docker CLI 并运行 `docker version` 以验证系统上 Docker 安装的版本。\n\n\n\n\n在 Practical\
  \ 1 的这项练习中，用户旨在学习如何：\n\n* 构建并运行一个镜像作为容器\n* 使用 Docker Hub 共享镜像\n* 使用多个容器和数据库部署 Docker\
  \ 应用程序\n\n# 使用 Docker Compose 运行应用程序\n\n此外，你还将学习构建镜像的最佳实践，包括如何扫描镜像以发现安全漏洞的说明。\n\n\
  如果你正在寻找如何使用你喜爱的语言将应用程序容器化的信息，请参阅针对特定语言的入门指南。\n\n## 下载和安装 Docker\n\n本教程假设你已经在机器上安装了当前版本的\
  \ Docker。如果你还没有安装 Docker，请在下方选择你优操作系统来下载 Docker：\n\n* 带有 Intel 芯片的 Mac\n* 带有 Apple\
  \ 芯片的 Mac\n* Windows\n* Linux\n\n如果你已经运行了开始教程的命令，恭喜你！如果没有，请打开命令提示符或 bash 窗口，并运行以下命令：\n\
  \n```\n$ docker run -d -p 80:80 docker/getting-started\n```\n\n你会注意到使用了一些标志（flags）。以下是上述命令的解释：\n\
  \n* `-d`: 它在分离模式下（后台）运行容器。\n* `-p 80:80`: 将主机的端口 80 映射到容器的端口 80。\n* `docker/getting-started`:\
  \ 用于创建容器的 Docker 镜像名称。\n\n*提示：你可以组合单字符标志以缩短完整命令。例如，上面的命令可以写为：*\n\n```\n$ docker\
  \ run -dp 80:80 docker/getting-started\n```\n\n# Docker Dashboard\n\n在继续深入学习之前，我们将重点介绍\
  \ Docker Dashboard，它可以让你快速查看机器上运行的容器。Docker Dashboard 可用于 Mac 和 Windows。\n\n要访问仪表板，请遵循\
  \ Docker Desktop 手册中的说明。\n\n# 在 Windows 上使用 Docker 的优势\n\n在 Windows 上使用 Docker 的一些主要优势如下：\n\
  \n* 允许使用集成用户界面查看和监控 Docker 容器\n* 在十秒内快速启动 Docker\n* 轻松使用 Linux 工作空间 (Workspaces)\n\
  * 分配所需的资源和内存空间\n* 包含 CA 同步\n* 支持 HTTP 代理设置\n\n# 重温容器\n\n现在你已经运行了容器，那么什么是容器？\n\n\
  简单来说，容器是一个与主机上所有其他进程隔离的进程，并运行在你计算机的沙箱中。这种分离利用了内核命名空间 (namespaces) 和控制组 (cgroups)，这是两个长期存在的\
  \ Linux 特性。Docker 致力于简化并让这些特性变得可用。总之，容器：\n\n* 是镜像的可执行版本。可以使用 `DockerAPI` 或 `CLI`\
  \ 来创建、停止、迁移或销毁容器。\n* 可以安装在云端、在本地运行或在虚拟机中运行。\n* 是操作系统无关的（意味着它可以在任何 PC 上运行）。\n\n每个容器相互独立运行，每个容器都有自己的软件、二进制文件和配置。\n\
  \n**容器镜像：** 在运行容器时，它使用隔离的文件系统。容器镜像提供了这种自定义的文件系统。运行应用程序所需的所有依赖项、配置、脚本、二进制文件和其他组件都必须包含在镜像中，因为它托管了容器的文件系统。额外的容器选项，包括环境变量、默认运行命令和其他元数据，也包含在镜像中。\n\
  \n# 实践练习 2：创建和部署区块链网络\n\n*使用 Java 版 Hyperledger Fabric SDK 创建并部署区块链网络。设置并初始化通道，安装并实例化链码，并在你的区块链网络上执行调用（invoke）和查询（query）。*\n\
  \n# 代码模式\n\n区块链是一种安全、分布式且开放的技术，它正在降低成本、加速流程并在事务应用程序中建立新层次的信任。这种开发者代码模式通过向你展示如何使用\
  \ VS Code 的 IBM Blockchain Platform 扩展以及 IBM Cloud 上的 IBM Blockchain Platform 构建区块链网络，带你进入区块链领域。\n\
  \n当区块链这样的大技术出现时，理解并能够实现该技术的开发者将处于主导地位。但首先，你必须学习它。在这个开发者模式中（这是一系列“你好，世界”区块链模式中的第一个），你将学习如何使用\
  \ Hyperledger Fabric 构建区块链网络。你将创建一个定义了参与者、可交易资产和允许交易的智能合约。然后，你将封装好的合约部署到 IBM Cloud\
  \ 上 IBM Hyperledger Platform 中配置的 Hyperledger 网络上。\n\n当你完成此代码模式后，你将理解如何：\n\n* 使用\
  \ VS Code 的 IBM Blockchain Platform 扩展封装你的区块链智能合约。\n* 在 IBM Blockchain Platform\
  \ 上设置 Hyperledger Fabric 网络。\n* 通过 IBM Blockchain Platform 安装并实例化智能合约包。\n* 通过运行带有\
  \ Hyperledger Fabric SDK 的 `Node.js` 来测试区块链网络，通过发布事务与部署的网络进行交互。\n* 发现设置和配置一个包含节点\
  \ (peer)、排序器 (orderer)、通道 (channel) 和证书机构 (certificate authority) 的基础网络是多么简单。参考\
  \ IBM Cloud Docs 中的《IBM Blockchain Platform 入门》，了解更多关于区块链这些重要组件的信息。业务网络还包括与其交互的参与者，每个参与者在多个业务网络中都可以与唯一的身份相关联。这是你登上区块链列车并建立每个业务都需要的技能的机会。完成此开发者模式，关注未来的区块链模式，让自己变得不可或缺。\n\
  \n图 11.3：Hyperledger Fabric 中创建节点的架构流图\n\n1. 开发者使用 `Node.js` 创建智能合约。\n2. 使用 VS Code\
  \ 的 IBM Blockchain Platform 扩展封装智能合约。\n3. 配置并启动 IBM Blockchain Platform 应用程序。\n\
  4. 通过 IBM Blockchain Platform 实现智能合约在网络上的安装和实例化可能，它促进了在 IBM Kubernetes 服务上构建网络的实现。\n\
  5. `Node.js` 程序与 IBM Blockchain Platform 部署的网络通信，并通过 Fabric 软件开发包 (`SDK`) 执行事务。\n\
  \n# 区块链网络\n\n应用程序可以通过区块链网络访问账本和智能合约服务，这是一种技术基础设施。智能合约的主要功能是启动事务。这些事务会被发送到网络中的所有节点节点，并永久地记录在每个节点的账本副本上。应用用户包括使用客户端应用的终端用户和区块链网络管理员。\n\
  \n区块链可以跟踪订单、账户、支付、生产等许多内容。\n\n由于所有成员都可以访问相同版本的真理，你可以从头到尾看到交易的每一个细节，从而给你更多的信心，以及更多的机会和效率。\n\
  \n# 区块链网络类型\n\n构建区块链网络有许多方法。它们由人员联盟构建，也可以是私有的、公有的、授权的或两者兼有。\n\n# 使用 IBM Blockchain\
  \ Platform 创建区块链网络-IBPV20\n\n\n\n\n\n区块链平台允许用户和开发者对现有的区块链基础设施创建新的用途。以太坊为例，它拥有一种名为\
  \ `ether` (`ETH`) 的原生加密货币。但以太坊区块链还允许创建智能合约、用于首次代币发行（ICO）的可编程代币以及非同质化代币（NFTs）。这些都是围绕太坊基础设施构建的，并由太坊网络上的节点提供安全。\n\
  \n# 使用 IBM Blockchain Platform 构建区块链应用程序\n\n你将在第一部分中学习如何在 IBM Cloud 上配置你的区块链网络。对于初级开发者来说，这些将是利用\
  \ IBM Blockchain Platform 的标准“Hello World”风格的 Hyperledger 示例。在本次实践中，使用了 Hyperledger\
  \ Fabric V1.4 网络。\n\n使用 VS Code 的 IBM Blockchain Platform 扩展打包你的智能合约并将其发布到网络中的模式，演示了如何测试你的网络。\n\
  \nLinux 基金会（The Linux Foundation）运行的 Hyperledger 计划之一是名为 Hyperledger Fabric 的区块链框架实现。Hyperledger\
  \ Fabric 旨在作为一个模块化设计创建解决方案或应用程序的基础，该设计允许成员服务和共识等插件插入插用。完成此代码模式后，你将学会如何：\n\n* 使用\
  \ VS Code 的 IBM Blockchain Platform 扩展打包智能合约。\n* 在 IBM Blockchain Platform 上使用 Hyperledger\
  \ Fabric 创建网络。\n* 设置 IBM Blockchain Platform 以托管智能合约包。\n* 使用 `SDK` 与合约交互并执行交易。\n\
  \n## IBM Blockchain Platform 组件\n\n* IBM Blockchain Platform 具有直观的用户界面，可以加速并简化在\
  \ IBM Cloud Kubernetes Service 上部署和管理区块链组件的过程，使你对自己的区块链网络拥有完全的控制权。\n* IBM Cloud\
  \ Kubernetes Service 部署高可用容器并创建一个计算主机的集群。你可以通过以安全的方式使用 Kubernetes 集群管理你所需的资源，从而快速构建、扩展和更新应用。\n\
  * VS Code 的 IBM Blockchain Platform 扩展帮助用户创建、测试和实现智能合约，以及与 Hyperledger Fabric 设置建立连接。\n\
  \n## 亮点功能\n\n* Hyperledger Fabric v1.4 的分布式账本平台基于模块化设计构建，提供了卓越的机密性、韧性、灵活性可扩展性。\n\
