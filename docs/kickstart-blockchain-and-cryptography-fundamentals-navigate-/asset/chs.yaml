  \n## 区块链与跨境转账\n\n考虑到目前技术在跨境支付方面的缺陷，区块链技术和分布式账本的概念已在银行业受到青睐。银行内部也经常讨论分布式账本区块链，这在过去几年中一直是讨论的话题。区块链是一个开放账本，存在于分布式网络中并对所有用户开放。\n\
  \n结果是网络中的每个节点都拥有整个数据库或账本的完整副本，对其进行的任何更改都需要其他节点或双方进行适当的验证，以确认所做的更改。因此，为了使账本被认为是真实的，所有节点必须对其当前状态达成共识。这意味着由于没有涉及中介或代理银行，直接转账可以瞬间完成，而无需担心操纵，即使对于跨境支付也是如此。得益分布式账本的基本理念，结算机构将对银行间双边、可见且不可逆转的价值转移做出决策。\n\
  \n![](img/Figure-7.3.jpg)\n\n\n\n\n\n## 区块链的优势\n\n图 7.3：区块链从银行 A 到银行 D 的资金转账，如图所示，消除了第三方。\n\
  \n如 `图 7.3` 所示，区块链提供了以下优势：\n\n*   它规定了所有的中间人、中央机构和代理行都将被排除在支付流程之外。交易可以在签署了双边协议的双方之间进行，确保相互信任。\n\
  *   总成本较低，整个支付过程中收取的费用较少。此外，如果信息通过 `SWlFT` 路由，会产生处理费用。由于中央机构和代理行征收了这些费用，在将数据和确认重新传输给相应机构之前，接收、汇总和结算支付消息等任务的支付处理变得更加昂贵。由于不需要中央机构或信息移动，结算周期可能非常短。\n\
  *   网络节点维护余额副本，因为这些余额维护在与其他银行的结算账户中，因此无需确保日间流动性。\n*   由于交易细节经过加密和哈希处理，数据被修改的可能性极小。\n\
  *   与标准化相关的挑战也随之减少。\n*  由于发送者和接收者是网络或链的节点，分布式账本增加了支付的透明度。私有链或许可区块链（用户无法匿名加入网络并成为节点）可能有助于缓解一些隐私和数据保护问题。为了访问网络中信任方之间涉及\
  \ `private key` 的交易，双方需要注册或签署双边协议。每个人也都知道破解区块底层哈希交易有多么困难。约有 11 家银行签署了由 `R3` 集团支持的私有对等传输分布式账本，以便在全球范围内私有网络上测试分布式账本。`Ethereum`\
  \ 技术托管在基于公共云平台 `Microsoft Azure` 构建的虚拟私有网络上。\n\n但由于最近宣布一些大公司正在离开该集团，`R3` 财团正面临一些问题。区块链正在变成一个战场，竞争现在是主要的焦点。\n\
  \n这一点是显而易见的，目前该游戏尚没有既定的标准或法规，但大多数重要方面似乎都可以进行公平结算。监管报告方面是最大的障碍。许多区块链用例都主张消除中间机构（例如监管机构）。鉴于银行和其他金融机构众知的保守立场，这些提议旨在促进合作，以尽量减少该行业的干扰。每项监管报告和交易监控活动都寻求完全的支付透明度和相关方的细节，以便执行客户尽职调查、制裁筛选、`FATF`、`Dodd-Frank`、`AML/KYC`、`Basel\
  \ III` 以及其他要求。行业研究表明，认为导致区块链采用内部阻力的两个主要因素是监管和合规问题，这些问题必须得到适当解决。\n\n## 跨境转账的缺点\n\n\
  在同一金融机构或任何其他金融机构的两个账户之间转账被称为汇款。`SWlFT` 在跨境支付中所做的只是管理跨越支付链的消息流。另一方面，代理行通过在银行之间执行真实的借贷操作，协助将价值传递给最终受益人。\n\
  \n但由于最近宣布一些大公司正在离开该集团，`R3` 财团正面临一些问题。区块链正在变成一个战场，竞争现在是主要的焦点。\n\n作为一个说明，`Bank A`\
  \ 正在向以下转账：\n\n1. `Bank A` 在 `US` 使用 `MT103`（一种 `SWIFT` 格式）。\n2. `Bank A` 使用 `Fedwire`\
  \ 将请求发送给其代理行 `Bank B`。\n3. `Bank B` 进行必要的修改并使用 `SWIFT` 与其代理行 `Bank C` 通信。\n4. `Bank\
  \ C` 通过 `SEPA`（单一欧元区）接收价值。\n5. `Bank D` 账户账户。\n\n## 了解客户 (KYC)\n\nKYC 是对客户身份进行识别和验证的过程，通过应用一系列控制措施，避免与涉及恐怖主义、腐败或洗钱等的人员建立商业关系。\n\
  \n\n\n\n\nKYC 流程涉及验证客户确实是其所声称的人，并为其提供所需的服务或产品的访问权限。这种验证通过不同的方法进行，尽管并非所有方法都符合法律要求。\n\
  \nKYC 流程是以这种方式进行的：想要成为公司客户的用户通过具有法律约束力的证据来证明其身份。为此，使用了诸如流媒体视频识别和视频会议等方法，用户在这些过程中展示并验证其身份证明、文件的真实性以及面部，此外还有生物识别测试和安全检查。\n\
  \n了解客户（KYC）过程可以在远程在线进行，也可以在商业办事处或商店现场进行。当通过远程在线进行或流程数字化时，我们称之为 `eKYC`（电子化了解客户）流程。\n\
  \n根据 KYC 规则，金融服务专业人员需要尝试确认身份、状况以及与维持业务关系相关的风险。这些协议属于机构反洗钱（AML）指南的更大范畴。各种规模的企业也使用\
  \ KYC 程序来确保潜在客户、代表、顾问或分销商符合反贿赂法律，且身份属实。银行、保险公司、出口债权人和其他金融机构要求客户提交越来越详尽的尽职调查信息。\n\
  \n一个合理的公司或个人通常在与另一方签订合同或协议之前，或者在按照特定标准采取行动之前，需要进行尽职调查。\n\nKYC 指南目的是防止犯罪分子利用企业作为洗钱手段。企业还可以通过相关程序更深入地了解客户的财务交易。这使他们能够审慎地管理风险。如今，银行和各种互联网公司必须遵守\
  \ KYC 指南。通常，它们在 KYC 政策中包含以下四个核心组成部分：\n\n*   客户接受政策；\n*   客户识别流程；\n*   交易监控；以及\n\
  *   风险控制。\n\n由于严格的监管环境，KYC 是金融和非金融公司必关重要且强制性的流程。因为它在客户与业务的互动早期识别可疑特征，从而减少了欺诈机会。\n\
  \n## KYC 涉及的步骤\n\nKYC 涉及几个步骤：\n\n1. 建立客户身份；\n2. 了解客户活动的性质并确认资金来源合法；以及\n3. 评估与客户相关的洗钱风险。\n\
  \n客户/用户可以定义为（出于 KYC 政策的考虑）：\n\n*   与报告实体维持账户或建立业务关系的实体或个人；\n*   代表账户维护的机构（即受益所有人）；\n\
  *   法律允许的专业中介（如股票经纪人、特许会计师或律师）所开展交易的任何或所有受益人；或\n*   与财务交易相关的未知个人或实体，其可能对银行构成重大的声誉或其他风险，例如单笔交易的电汇或签具高额汇票。\n\
  \n区块链分析和加密货币合规专家可以帮助完善您的 KYC 生命周期的执行，让您在确保符合监管要求的同时，放心地招募更多客户。这涉及到以下技术的独特组合：\n\n\
  *   人工智能，\n*   光学字符识别，\n*   自然语言处理和自动化，\n\n这些技术的独特组合为合规团队提供了其所有企业、中小企业和个人客户的单一实实来源。\n\
  \nKYC 流程包括：\n\n1. 身份卡验证，\n2. 人脸识别，\n3. 验证文件，如作为地址证明的公用事业账以及生物识别验证。\n\n此外，实时跨境支付严重依赖\
  \ KYC 合规，这降低了风险并提升了信任、透明度和合作的水平。为了加速合规流程并开发应对金融犯罪的新型合作策略，需要一种社区方法。\n\n## SWIFT 的\
  \ KYC 注册表\n\n目前，约 6,000 家金融机构通过 `SWIFT` KYC 注册表发布和接收代理行的 KYC 数据。代理银行尽职调查的公认基准是 `SWIFT\
  \ KYC`。为了简化银行与企业之间的 KYC 流程，注册范围现已扩大到企业 `SWIFT` 客户。客户尽职调查和 KYC 对于保护全球金融系统免受洗钱以及非法犯罪活动的资助至关重要。\n\
  \n截至 2018 年，约一半的高价值跨境支付使用了 `SWIFT` 网络，在 2015 年，来自 200 多个国家和地区的 11,000 家金融机构每天平均交换\
  \ 3200 万条信息。`SWIFT’s KYC registry` 是一个安全的全球平台，提供预定义的数据字段和文档类型，以标准化和简化数据收集。\n\n迄为止，约\
  \ 6,000 家金融机构正在使用 `SWIFT’s KYC` 发布其 KYC 数据并接收来自交易对手的数据。`SWIFT KYC` 被认为是代理银行尽职调查的接受标准。该注册表现在已扩展到企业客户，以帮助简化银行与企业之间的\
  \ KYC 流程。\n\n# 印度：2002 年印度储备银行银行的 KYC 指南\n\nKYC 指南的目的是防止犯罪分子无论是有意还是无意利用银行进行洗钱。得益于这些\
  \ KYC 程序，银行可以更好地了解和理解其客户及其财务交易，这也有于他们管理风险。银行应将以下核心部分整合到其 KYC 政策中：\n\n*   客户接受政策\n\
  *   客户识别程序\n*   交易监控\n\n# 区块链应用\n\n据我们所知，`Bitcoin` 的区块链在区块中存储财务交易信息。目前有超过 10,000\
  \ 个其他加密货币系统运行在区块链上。到 2022 年，包括 `Walmart`、`Pfizer`、`AIG`、`Siemens`、`Unilever` 在内的许多企业将使用区块链技术。例如，`IBM`\
  \ 开发了 `Food Trust` 区块链来追踪食品到达目的地的路径。\n\n历史告诉我们，`Blockchain` 最初于 2009 年引入市场作为支持 `Bitcoin\
  \ exchanges` 的技术，但它在商业世界中的实际用途远超加密货币交易。例如，在金融领域，区块链网络允许证券交易在几分钟内结算而非数几天。在供应链中，区块链网络允许对货物和支付的流动进行实时追踪和记录。\n\
  \n可能会提出以下问题以确定您的用例是否适合区块链：\n\n*   是否涉及业务网络？\n*   是否使用共识机制来验证交易？\n*   是否需要审计追踪或溯源？\n\
  *   交易记录是否应是不可篡改或防篡改的？\n*   争议解决是否应该是最终性的？\n\n\n\n\n即使你对第一个问题的回答是“是”，并且对至少至少一个问题也是“是”，你的用例也可以从区块链技术中受益。为了让区块链成为正确的解决方案，始终需要网络参与，但网络有许多形式。网络可以存在于组织之间（例如供应链），也可以存在组织内部。在组织内部，区块链网络可以用于在部门之间共享参考数据，或者创建一个审计或合规网络等。网络也可以存在于个人之间，例如，他们可能需要在区块链上存储数据、数字资产或合同。\n\
  \n## 食品行业中的区块链\n\n如果发现某种食品被污染，就可以沿着每个停靠点追溯到源头。不仅如此，这些公司现在还可以看到该食品可能接触过的其他东西，从而能够更早地识别问题，并可能挽救生命。这是区块链应用中的一个例子，但还有许多其他形式的区块链实现。\n\
  \n在食品行业，已经有多份关于 `E. Coli` 感染、沙门菌爆发和李斯特斯特菌爆发的报告，此外还有食品中意外接触危险物质的报告。以前，确定这些爆发的原因或人们因食物生病的原因需要几周时间。区块链技术允许品牌从源头开始到每一个停靠点，一直到交付追踪食品产品。\n\
  \n## 抵押贷款处理中的区块链\n\n物业贷款是抵押贷款的另一种术语，或直接称为抵押贷款。可以使用抵押贷款进行再融资、购买或建造房屋。在之前的贷款仍在偿还期间为物业获得新贷款被称为被称为再融资。通常，目标是获得条件优越的贷款。\n\
  \n区块链加速器和区块链技术在抵押贷款市场仍然相对较新，但它们具有潜力。了解标准抵押贷款流程的每一步以及总共耗多久，将帮助你充分理解区块链抵押贷款的优势。\n\n\
  ## 传统贷款程序\n\n通过传统途径获得抵押贷款的时间可能从 30 到约 60 天不等，取决于季节以及特定时刻想要购买物业的人数。获得抵押贷款的正常阶段如下：\n\
  \n*   **预审**：抵押贷款人会评估您的信用状况，并在整个过程中为您提供估算。\n*   **申请**：提交申请是下一步要采取的行动。房屋买家通常会填写统一住宅贷款申请表。申请中包含了抵押贷款人批准或拒绝您的申请所需的所有相关信息，包括您的收入、资产和工作经历。\n\
  *   **处理**：接下来的行动涉及验证申请上的所有信息或处理贷款。评估您想要购买的房屋以确保其价值至少相当于您支付的金额，是贷款审批过程中的另一个步骤。\n\
  *   **核保**：即使在贷款处理人员检查并批准了一切之后，抵押贷款尚未准备好。随后，核保人员收到文件，审查所有内容，并决定批准还是拒绝贷款。特别是，核保人员正在评估风险程度，并确定某些申请人是否是有问题的借款人。\n\
  *   **结算**：如果核保人员批准了抵押贷款，最后一个阶段就是结算，也称为交割。一旦抵押贷款结算完成，买家就可以搬进新家。\n\n## 抵押贷款流程与区块链\n\
  \n通过提高生产力和降低与抵押贷款流程相关的成本，区块链技术可以帮助简化抵押贷款部门。\n\n抵押贷款业务可以通过多种方式从区块链技术中受益。它有助于加速交易时间，从而更快地结算。它还可以为参与过程的所有方提供更准确的文档和更低的成本。\n\
  \n区块链加速器和区块链技术在抵押贷款市场仍然相对较新，但它们具有潜力。了解标准抵押贷款流程的每一步以及总共耗多久，将帮助你充分理解区块链抵押贷款的优势。对区块链技术的初步了解可以帮助你看到它是如何简化抵押贷款申请流程的。\n\
  \n## 区块链抵押贷款流程示例\n\n潜在房主已经获得了抵押贷款预审。他们找到了想要购买的房屋。\n\n在他们完成抵押贷款申请后，它变成了一个区块。参与抵押贷款过程的所有人员都可以访问该区块，申请提交的信息几乎立即得到验证。\n\
  \n融资获得批准后，买家获得一个加密密钥来签署报价。买家的签名记录作为一个独立的区块添加到链中。将贷款资金转给买家是下一步。所有权转让和资金转账都成为链中的链接。综合考虑，利用区块链技术将获得抵押贷款批准和结算贷款的时间从几周减少到几天。\n\
  \n在抵押贷款获得批准和关闭后，区块链技术仍然相关。抵押贷款服务商可以使用区块链技术监控借款人的还款情况。区块链可以帮助想要出售或再融资物业的房主证明物业所有权。如果有人希望将其贷款出售给另一家抵押贷款公司，区块链可以帮助抵押贷款业务验证原始服务商是否拥有贷款的所有权。\n\
  \n## 区块链抵押贷款的优势\n\n对于参与抵押贷款过程的所有方，区块链技术都有优势。以下是该技术的一些可能收益：\n\n*   **更精确的记录**：正如每个买过房的人所知，传统的抵押贷款申请过程需要大量的文档。买家必须证明他们的资产、收入和工作经历。核保人员和贷款处理人员可能会发现自己淹没在堆积文件中。区块链将所有所需的文件和数据收集到数字记录中，只需点击按钮即可访问。\n\
  *   **买家更低的交割成本**：区块链技术通过消除结算过程中对第三方的要求来帮助降低费用。\n*   **更容易确认所有权链**：通过传统方式购买房屋时，买家通常需要购买所有权保险以防物业存在留置。由于区块链技术大大简化了所有权链验证过程，不再需要所有权保险。\n\
  *   **智能合约实施**：智能合约是代码指令集，会在预定事件发生时开始执行。例如，如果买家购买了房屋保险，抵押贷款程序会自动进入下一个阶段。\n\n## 区块链驱动的贸易\n\
  \n加密货币行业的价值在 2021 年底达到 3 万亿美元巅峰。区块链技术是 `Ethereum` 和 `Bitcoin` 等加密货币的基础。区块链技术的使用及其赋能的产品和服务将继续对企业运营产生重大影响。\n\
  \n\n\n\n然而，区块链技术远不止是一种安全的加密货币传输方法。它可以应用于金融以外的领域，例如投票、医疗保健、保险、福利补贴、游戏和艺术家版税。\n\n\
  区块链革命正在来临，得益于技术已经在许多方面对社会和业务的影响，世界经济正做好了准备。如果你认为“革命”这个词听起来很戏剧化，请考虑一下：世界前十大企业中有八家正在开发一系列基于区块链的产品。\n\
  \n## 金融与银行业中的区块链\n\n区块链帮助银行和金融服务公司使贷款申请和支付记录更加高效。\n\n银行业可能是从将区块链技术整合到运营中获益最大的领域之一。金融机构每周仅营业五天，即常规营业时间内。这意味着，如果你在周五下午\
  \ 6 点尝试存支票，可能要等下周一早上资金才会出现在你的账户中。\n\n由于银行有大量的交易需要结算，即使你在营业时间内存款，交易可能仍需要一到三天才才能验证。然而，区块链是一个\
  \ 24/7 全天系统。\n\n**银行业**：银行和其他金融服务机构正在利用区块链来实现支付记录和贷款处理的自动化。无论节日、白天还是周末，通过将区块链整合到银行，客户最快只需\
  \ 10 分钟即可完成交易。这在本质上与向区块链添加一个区块的时间相同。由于区块链技术，银行现在可以在机构之间更快速、更安全地转移资金。例如，在股票交易行业，资金和股票在结算和清算过程中会被冻结长达三天（如果是海外交易则更长）。由于涉及金额巨大，即使是资金在途的几天对银行来说也非常昂贵且充满风险。\n\
  \n区块链通常与比特币等加密货币联系在一起，尽管它还有广泛的其他可能用途。\n\n**货币**：在没有中央银行协助的情况下，加密货币独立运行。与任何其他货币一样，人们使用它们来购买物品——主要是在线购买。虽然比特币是最著名的加密货币之一，但也存在其他货币。\n\
  \n以下是区块链技术的一些现有和可能的应用。\n\n## 物流中区块链技术的使用\n\n企业可以使用区块链确认其产品中所用材料的来源，或向消费者保证物品来自经过验证的源。\n\
  \n## 房地产文件中的区块链\n\n区块链技术可用于确认或建立物业所有者的身份。它还可以帮助降低产权查询和物业保险的费用。\n\n**抵押贷款**：区块链技术可能帮助抵押贷款行业有多种方式。它有助于加速交易时间，从而实现更快的结算。它还可以为参与过程的所有方提供更准确的文档并降低成本。\n\
  \n## 医疗领域中的区块链\n\n医疗保健专业人员可以使用区块链技术安全地保存患者病历。通过在医疗记录创建并签名后将其写入区块链，患者可以确保他们的记录是不可更改的。为了确保隐私，这些私人健康记录可以使用\
  \ `private key` 加密并存储在区块链上，使其对特定人员可用。\n\n在涉及电子患者数据存储时，患者隐私和安全至关重要。得益区块链技术的安全性，患者信息可以保持保密。区块链技术也更容易与其他医生和其他医疗提供者交换患者数据。\n\
  \n区块链在医疗领域的其他主要应用还包括：\n\n* 健康数据保护\n* 个人健康记录数据管理\n* 点基因组管理\n* 电子健康记录数据管理\n\n这些该领域的一些创新区块链应用：\n\
  \n* **MedicalChain**：提供区块链解决方案，创建一个以用户为中心的数字健康记录，可以方便地与医生共享。所有信息都以可审计、安全且透明的形式记录。\n\
  \n* **Guardtime**：该公司正在帮助医疗机构和政府在其网络安全系统中实施区块链，以确保关键数据的安全。\n\n* **Curisium**：该区块链平台旨在通过使用创新的数字合同来简化返扣谈判和合同管理。\n\
  \n* **Robomed**：该平台利用远程医疗会议、聊天机器人和可穿戴设备收集患者数据，并将其记录在区块链上，以便安全地与医疗保健人员共享。\n\n* **The\
  \ MediLedger Project**：由 Chronicled 于 2019 年最初启动，MediLedger 项目旨在提高处方药的追溯能力。该区块链医疗项目为满足《美国药品供应链法》（`DSCSA`）的要求而构建，既符合法律要求，又支持制药行业的运营需求。\n\
  \n## 选举与投票中的区块链\n\n选举官员可以使用区块链技术立即捕获并统计人们的选票。由于该技术比其他方案更安全，它还将减少选民欺诈和篡改的风险。\n\n\
  如前所述，区块链可用于促进现代投票系统。正如西弗吉尼亚州在 2018 年中期选举中测试的那样，使用区块链投票具有消除选举欺诈和提高投票率的潜力。像这样使用区块链将使选票几乎不可能被篡改。区块链协议还将维护选举过程的透明度，减少开展选举的人员，并为官员提供近乎实时的结果。这将消除重新计票的需求，或对欺诈可能威胁选举的任何真实担忧。\n\
  \n## 企业级区块链需求\n\n我们相信区块链是一项真正颠覆性的技术，可以改变业务网络。我们还认为这种创新必须在公开范围内进行，与其他技术公司和行业合作。为此，IBM\
  \ 持续向数个活跃的 `Hyperledger` 项目贡献代码。\n\n从 IBM 的角度来看，工业级区块链技术具有以下特征：\n\n* 共享的许可账本是只追加的记录系统（`SOR`）和单一事实来源。它对业务网络通道中经过验证的成员可见。\n\
  \n* 由业务网络所有参与成员同意的共识协议确保账本仅通过网络验证的交易进行更新。\n\n* 密码学确保了交易的防篡改安全性、身份验证和完整性。\n\n* `Chaincode`（也称为智能合约）封装了参与者对网络上业务的协议条款；`chaincode`\
  \ 存储在区块链的验证节点节点上。\n\n\n\n\n*   除了这些属性，企业区块链技术还需要满足关键的行业需求，如性能、经过验证的身份以及私有和机密交易。`Hyperledger\
  \ Fabric` 的架构设计为了满足这些需求。它还设计了可插拔的共识模型，允许企业为其网络选择最优算法。\n\n## 货币\n\n区块链为比特币等加密货币奠定了基石。美元由`Federal\
  \ Reserve`（联邦储备银行）控制。在这种中心权威体系下，用户的数据和货币在技术上取决于其银行或政府的意愿。如果用户的银行遭到黑客攻击，客户的隐私将面临风险。如果客户的银行崩溃，或者客户所在的政府不稳定的国家，其货币价值可能会面临风险。2008\
  \ 年，几家倒闭的银行获得了救助——部分资金使用了纳税人的钱。这些正是比特币最初构思和开发的忧虑之源。\n\n通过将其操作分遍到整个计算机网络中，区块链允许比特币和其他加密货币在不需要中央权威的情况下运行。这不仅降低了风险，还消除了许多处理费用和交易费用。它还可以为那些货币不稳定或缺乏金融基础设施的国家提供更稳定的货币，并提供更多应用，以及更广泛的个人和机构网络，供其在国内外业务。\n\
  \n使用加密货币钱包作为储蓄账户或支付手段，对于那些没有国家身份证明的人来说具有深远意义。某些国家可能饱受战争，或政府缺乏任何提供身份证明的真实基础设施。国家的公民可能无法获得储蓄或经纪账户——因此，没有办法安全地存储财富。\n\
  \n## 房产记录\n\n如果你曾在当地的登记处待过时间，你就会知道记录房产的过程既繁琐又低效。今天，区块链有潜力在人工操作的地方记录房产。\n\n## 供应链\n\
  \n`Bloom`：这家初创公司正将区块链应用于信用评分，通过构建一个管理风险、身份和信用评分的协议。\n\n## 区块链技术颠覆金融服务\n\n预测将继续演变的领域是\
  \ `Ripple`：总部位于旧金山的软件供应商 `Ripple` 自 2014 年来一直专注于基于区块链的实时支付。他们最近与总部位于迪拜的技术公司 `Pyypl`\
  \ 合作，后者创建了一个基于区块链的平台，通过智能手机提供非银行服务。\n\n\n\n\n\n区块链技术对业务具有巨大影响，其采纳的主要驱动因素是更高的收入、更低的成本以及更高效的时间利用。企业采用区块链的示例包括：\n\
  \n* `ConsenSys Quorum`：最初由摩根大通开发，`Quorum`是一种企业级服务，帮助公司增长和管理大规模区块链网络。\n* `LVMH`：这家奢侈品公司正在通过区块链追踪货物并打击假货。它在普拉达（Prada）和卡迪华（Cartier）合作开发的平台上注册了超过\
  \ 1000 万产品。\n* `MediaChain`：该区块链数据库被 Spotify 收购用于管理版权和版税支付，并解决权利人问题。\n\n## 区块链在法律领域的应用\n\
  \n在法律领域，区块链技术可用于创建智能合约，并验证所有权文件（如证书）。如果用于验证、认证和保护法庭证据，区块链可以提高刑事司法系统的效率。\n\n智能合约是维护法律合同本质的数字合同。合同条款以代码形式编写，并在满足约定条件时自动执行，无需任何干预或中介。当这种情况发生时，区块链将更新，只有具有权限的方才能看到结果。\n\
  \n美国的一些州已开始允许在某些法律背景下使用智能合约。这包括亚利桑那州（双方可以通过智能合约创建具有法律执行力的法律协议）以及加利福尼亚州（可以通过区块链颁发结婚证）。\n\
  \n## 区块链在房地产中的使用\n\n房地产交易通常价格昂贵、文件繁琐，并且需要代理的帮助。区块链有潜力通过代币化简化寻找和购买房地产的过程，即使用数字房地产代币来代表物理资产。这将：\n\
  \n* 通过消除中间环节，简化买卖双方之间的转让。\n* 通过分布式数字账本提供不可否认的所有权证明。\n* 促进小规模的房地产投资，因为代币可以像比特币一样被分割。\n\
  * 提高市场安全性和透明度，因为每笔交易都由他人处理和批准。\n\n使用区块链技术的房地产示例包括`Deedcoin`，它将房地产中介与买家连接起来并将佣金降至\
  \ 1%，以及`Harbor`，它实现了私募证券、REITs、土地权证和土地登记记录的代币化。\n\n## 通过区块链实现物流与供应链\n\n**供应链**：货物创造与分发之间的环节一直受到创新的冲击。如今的供应链极其复杂，跨越多个大洲，包括大量的发票和付款，涉及无数实体，并可能持续数月。\n\
  \n由于这种复杂性，区块链成为转型供应链和物流行业的一种极具手段。当货物转移到供应链的下一个步骤时，该过程可以安全、永久地记录，创建从源头到销售点的不可更改且可审计的历史。\n\
  \n以下是一些专注于物流和供应链的创新型区块链应用示例：\n\n* `TradeLens`：由 IBM 开发，这种用于物流和供应链的区块链解决方案通过区块链提供了透明度和更高的效率，提供了货运数据和文件的全局视图。世界上超过一半的集装箱船在该平台上注册，在\
  \ 2020 年处理了 10 亿次运输。\n* `Provenance`：消费者日益要求其购买产品的透明度，以确保产品来源和生产符合伦理。Provenance\
  \ 使用区块链来证明供应链的监管链和认证。\n* `Honeywell`：这家美国大集团与`iTRACE`和`SecureMarking`合作，在全球范围内保护、追踪和溯其航天零件。它通过在零件上使用激光刻蚀和隐形墨水，将这些信息编码到区块链账本上以实现数字真实性。\n\
  * `De Beers`：戴比开采、交易和销售了全球 30%以上的钻石供应。该公司使用区块链账本追踪从矿山到客户购买的钻石，并帮助确认钻石并非冲突钻石。\n\n\
  ## 区块链创新对业务的影响\n\n描述的工具和平台只是区块链技术应用于各行业的少数示例。这凸显了该技术对业务、贸易以及整个经济产生的影响，并强调了业务领袖、贸易从业者和决策者熟悉这项技术是多么重要。\n\
  \n德勤 2021 年全球区块链调查显示，81%的业务领袖认为区块链具有广泛的可扩展性，并已实现主流采用。区块链技能已成为世界上最受追逐的能力之一，其需求从 2020\
  \ 年底到 2021 年初增加了 59%。\n\n## 贸易\n\n金融交易中的区块链意味着透明的定价、新的替代市场、更快的付款处理和不可篡改的交易记录。区块链的账本技术通过提供不同方（无论是公司、供应商网络、投资池还是国际供应链）之间交易的实时信息，使数据能够以安全的数字格式记录。这项技术使人们能够比以前任何时候都更低的成本和更快的速度进行交易。\n\
  \n它为所有方提供了一个安全、加密、透明、易于访问且无法篡改的记录。虽然区块链随着加密货币`Bitcoin`的发布出现在金融体系中，但今天它被应用于各种活动，包括直接或间接与外贸相关的活动。\n\
  \n国际贸易长期价值链涉及巨大复杂的领域，如物流、运输、海关管理、融资以及公司之间的行政程序，所有这些都可以通过采用这种技术简化。\n\n区块链优化了流程，使货物可追溯，保证了支付和融资的安全，促进了数字质量和来源认证的验证，实现了贸易不同阶段信息的实时共享，并有助于改善相关公共和私营服务的运营，其他利益如此。\n\
  \n区块链通过简化跨境贸易、贡献于竞争提升和降低交易成本为贸易运营提供了解决方案。虽然区块链在外贸中已使用了多年，但自 COVID-19 健康危机以来，其重要性有所增加，预计在后疫情时代将发挥更显重要的作用。\n\
  \n目前区块链如何使用的一个具体例子来自法国零售商安信（Auchan），它在其整个供应链中实施了基于区块链的国际食品追溯系统。在越南试点该解决方案后，它与`Te-Food`合作，将该技术用于追踪源自法国、意大利、西班牙、葡萄牙和塞内加尔的和服务。该系统能够通过二维码追踪从农场到餐桌的不同产品，并记录食品质量数据（以及相关的物流信息）。\n\
  \n## 国际贸易\n\n\n\n\n国际贸易是一个规模达 16 万亿美元的市场，涵盖了资本、货物和服务的跨国界或跨领土交换。它大致分为两类：\n\n- 75%\
  \ 是通常通过集装箱或陆路运输的各种货物\n- 25% 是大宗商品\n\n从运输和物流的角度来看，贸易和金融行业主要面临出口商和进口商之间缺乏信任与协调的问题，特别是在新兴与发达市场之间。此外，由于国际商品贸易运营流程的复杂性，该行业存在各种运营效率低的问题。例如，运输和贸易仍然严重依赖人力，并受到人工和纸质流程的影响，这些流程成本高昂、速度慢且容易出错。\n\
  \n出口商和进口商在融资或担保交易方面面临挑战，这阻碍了增长并限制了全球化的收益。从历史上看，尽管某些技术如大宗商品交易和风险管理（CTRM）解决方案已被证明有用，但该领域对技术进步和数字化一直非常抵触。\n\
  \n## 区块在全球贸易和商业中的优势\n\n在过去的 10-15 年里，许多初创公司和技术公司尝试开发产品，但结果参差不齐——直到区块链技术的出现，国际贸易被确定为它的主要用例。区块链技术对国际贸易融资的潜在影响促使许多公司和财团更新其过时的技术。除了开启数字化时代外，区块链还实现了现有文件、信用证等的代币化（tokenization）。智能合约将通过协议、业务事件以及其他人工密集型流程的自动化，改进出口商和进口商之间的协调。区块链技术在全球范围内的采用，将为跨国协调、贸易结算和标准化带来更大的益处。\n\
  \n在确认的事件序列对业务至关重要的场景下，区块链是有效的。而且当网络中的多个节点需要遵守预定义的业务逻辑且没有篡改空间时，区块链的运行非常出色。到目前为止，几家初创公司已尝试用区块链解决贸易融资问题。然而，我们发现他们的方法在两个关键方面存在缺陷。\n\
  \n首先，他们的通常目标是将现有流程映射到区块链中，而不是从根本上重新思考底层的业务模型和信息流。\n\n这种方法导致了多种解决方案提供“数字信用证”。这些解决方案未能解决的问题是：当信用可以即时发行、确认且支付可以立即启动时，是否还需要这种信用证。\n\
  \n其次，他们倾向于只映射价值链中单一、孤立的部分，通常关注信用证或提运单。他们较少关注作为更广泛流程一部分的和咨询方面。如今的进口商和出口商为这些领域的服务付费，而且这些服务非常昂贵。但在实践中，这些服务往往被忽视，客户体验很糟糕。相比之下，在整个贸易融资交易中，我们预见到区块链将解决两个根本挑战：\n\
  \n- **自动化发行**：假设各种网络参与者已采用所提的平台。现在他们将把信用发行、货物装运或交易支付等事件实时记录在区块链上，这反又将这些信息广播到整个网络。鉴于这些事件的公共记录，不再需要追踪纸质轨迹的运营团队。工作流中的后续步骤可以可靠地以自动化方式启动。\n\
  - **全审计透明化**：货物运输容易发生欺诈或非法活动。标记为装载香蕉的集装箱实际上可能在运输武器。显然需要有效的控制。\n\n区块链可以通过网络控制机制非常有效地满足这种需求，通过参与建立一个`shared\
  \ truth`（共享真相）。此外，对于参与者建立的各种事实、协议、货运或支付，区块链可以有效运作。如果平台主导者决定采用开放开发，区块链可以为全球参与者提供访问。这让参与者能够将信息实时接入系统，从而增加公司的收入潜力。我们见证了整个贸易融资生态系统的产生。这些应用将根据不同参与者（如协调员、银行或买家）的需求进行定制。\n\
  \n![](img/Figure-7.5.jpg)\n\n**图 7.5：** 被解释为区块链序列的贸易融资环境\n\n正如 `TCP/IP`、`HTML` 和\
  \ `HTTP` 等大多数互联网协议让互联网变成今天的样子，区块链及相关技术也可以为全球贸易和商业创造一个更扁平化、更智能、更紧密且更好的世界。\n\n## 贸易融资\n\
  \n贸易融资是对从供应商到最终买家的贸易或交易中的货物或服务的融资。它占全球贸易的 3%，每年价值约 3 万亿美元。“贸易融资”是一个伞括术语，包含了进口商或出口商使用的各种金融工具。\n\
  \n这些包括：\n\n- 采购订单融资\n- 库存融资\n- 结构化大宗商品融资\n- 发票融资（贴现和保理）\n- 供应链金融\n- 信用证 (LCs)\n\
  - 债券和担保\n\n`进口融资`和`出口融资`这两个术语与`贸易融资`通用。\n\n## 贸易融资对业务的益处\n\n在业务中，贸易融资通过确保购买`货物和库存`所需的资金来促进业务增长。管理现金和流动资金对于任何企业的成功至关重要。贸易融资是一种用于从公司现有库存或应收账款释放资金，或根据公司贸易周期增加额外融资设施的工具。\n\
  \n总之，贸易融资可能允许您通过减少贸易周期中的支付差距，为供应商和客户提供更有竞争力的条款。它对供应链关系和增长的益如下：\n\n- 中短期流动资金，以进出口的基础产品或服务作为担保。它增加了公司的收入潜力，早期的付款可以获得更高的利润。\n\
  - 贸易融资允许公司要求更大数量的库存或向供应商下更大的订单，实现规模经济和批量折扣。\n- 贸易融资有助于加强买卖双方的关系，提高利润率。它使公司更具竞争力。\n\
  \n\n\n\n-   需要注意的是，贸易融资更多关注的是贸易本身而非基础借款人，也就是说，它不是由资产负债表驱动的。因此，资产负债表较弱的小型企业可以使用贸易融资进行规模更大的货物或服务的贸易，并与实力更强的终端客户合作。\n\
  \n由于贸易融资贷款和工具周围环绕着嵌入的风险缓解因素，这使得贸易公司能够拥有多样化的供应商基础。更多样化的供应商网络增加了市场和供应链的竞争与效率。\n\n\
  贸易公司还可以通过使用适当的贸易融资结构来降低业务风险。债务人的逾期付款、坏账、库存过剩和严苛的债权人可能对业务产生不利影响。外部融资或循环信贷额度可以通过有效为贸易流融资来缓解这种压力。\n\
  \n**注意：** 国际商会（ICC）是全球最大的商业组织，在 100 多个国家拥有超过 600 万名成员。\n\n## we.trade：最大的区块链支持贸易网络\n\
  \n在 `we.trade` 启动之前，开岸账户贸易或单证交贸易的通用解决方案是使用纸质文件。但缓慢的过程导致了大量的重复工作，企业主需要为不同的贸易伙伴填写相同的文档，这使得他们更容易受到伪造和人为错误的影响。\n\
  \n幸运的是，已经有企业在寻找像 `we.trade` 这样基于区块链的解决方案。\n\n`we.trade` 已经是投入运行最大的区块链支持贸易网络之一，旨在改进贸易融资贷款流程，支持公司扩大业务并进入新市场。从\
  \ 2020 年开始，在过去的几个月里，随着公司开始用数字化解决方案取代纸质贸易融资流程，`we.trade` 的势头持续增长。从 2020 年 7 月开始，`we.trade`\
  \ 将服务扩展到欧洲更多的银行和客户，随后从亚洲开始将网络扩展到全球。\n\n`we.trade` 是一个数字平台，用于在一个地方安全地管理、跟踪和结算中小企业（SMEs）之间的贸易交易。其目标是利用分布式账本技术，让欧洲公司的国内和跨境贸易变得更容易。\n\
  \n`we.trade` 平台构建在 `IBM` 的区块链平台上，使用了开源的 `Hyperledger Fabric`。\n\n`we.trade` 是世界上首个企业级区块链支持的贸易融资平台。它为买卖双方提供了一个安全且更可靠的平台，构建在最新版本的\
  \ `IBM Blockchain Platform` 之。它得到了全球顶级银行的支持，包括 CaixaBank、Deutsche Bank、Erste Group、HSBC、KBC、Nordea、Rabobank、Santander、Société\
  \ Générale、UBS 和 UniCredit。它有能力在网络中连接买双方、银行、保险公司和物流组织，从而简化跨境贸易。\n\n`we.trade` 还自动化了贸易融资周围的许多流程，并为交易员提供保险、信用评级和物流服务的渠道。一旦进入网络，交易员就可以发起订单、管理从订单到付款的过程并获得融资。他们还可以搜索网络以发现新的贸易伙伴，利用分布式账本技术和智能合约进行全球贸易。\n\
  \n`we.trade` 于 2017 年通过七家欧洲银行的合资成立为位于爱尔兰的独立公司。如今，该公司由 12 家银行、技术领导者 `IBM` 以及全球商业信誉和商业信息提供商\
  \ `CRIF` 所有，股东来自 CaixaBank、Deutsche Bank、Erste Group、HSBC、KBC、Nordea、Rabobank、Santander、Societe\
  \ Generale、UBS 和 UniCredit 等机构。2019 年，公司以 SaaS 模型将 `we.trade` 技术推向市场，并已有来自 15 个国家的\
  \ 16 家银行加入平台。\n\n任何支持 `we.trade` 平台的欧洲银行财团的客户都可以轻松注册并开始交易。银行 `Flattered` —— 作为 Nordea（北欧地区领先银行以及\
  \ `we.trade` 的创始成员）的客户是早期采用者之一，他们意识到如何利用 `we.trade` 的优势来解决现金流问题并扩大业务。\n\n## we.trade\
  \ 与中小企业 (SMEs)\n\n如 `Flattered AB` 等中小企业代表了全球 90% 的企业和 50% 的就业人数。根据世界银行的数据，中小企业通常无法获得银行担保、发票融资或信用保险来帮助维持和扩大规模。\n\
  \n## 供应链融资\n\n根据定义，`供应链融资`（也称为`供应商融资`或`反向保理`）是一系列通过允许企业延长付款期限来优化现金流的解决方案。当买方的信用评级比卖方更好并能够以较低成本获得资金时，供应链融资的效果最好。此外，供应链融资是为中大型企业提供的服务。\n\
  \n`贸易融资`与`供应链融资`的区别在于，虽然贸易融资和供应链融资都是为资国际供应链设计的，但贸易融资提供了更广泛的解决方案。根据最新的《全球供应链融资报告》，近年来供应链融资规模增长显著，2020\
  \ 年总值达到 1.31 万亿美元。\n\n全球大型制造商（如飞机制造商 `Boeing Co.`）以及其他全球性公司（包括软饮料生产商 `Keurig Dr\
  \ Pepper Inc.`）是供应链融资的积极用户，以此延长付款期限。\n\n## 区块链中的数字身份\n\n自互联网诞生以来，身份管理一直是一个关键问题。尽管投入了巨大资金，管理数字身份仍然受到三个\
  \ C 问题的困扰：繁琐（Cumbersome）、昂贵（Costly）和挑战性（Challenging）。\n\n区块链可以赋予使用户对自己的身份拥有更大的控制权。\n\
  \n组织可以在获得客户同意的情况下使用信息，且中央实体无法破解消费者的身份。\n\n## 身份的含义\n\n区块链促进了所谓的“自主身份”，这种身份在本质上是不可更改的，并且比传统的身份系统更安全。因此，它具有完全改变我们使用身份连接到不同在线服务方式的潜力。个人将使用其自主身份验证自己的身份，从而消除对密码的需求。\n\
  \n\n\n\n\n## 图 7.6：区块链交易中身份的特征\n\n正如每一项改变生活的创新一样，它也经历了一个漫长的演变过程，专家们不断交流想法，但对于“主权身份”的含义尚未达成共识！这一概念源于一种信念：个人必须对自己的身份管理拥有控制权。\n\
  \n`ID` 不能被锁定在单一网站，并且在用户同意的前提下，`ID` 在多个平台之间需要具有互操作性。\n\n大多数专家一直在思考如何汇总各种识别信息，例如人口统计和就业相关数据，甚至由他人披露的关于个人的信息。\n\
  \n从原则上说，主权身份将允许用户以以下方式控制其身份：\n\n1. 访问并更新信息（尽管某些声明可能需要第三方验证）\n2. 选择他们希望保持私密的信息\n\
  3. 传输数据（传输到另一个组织，如果搬迁，甚至传输到另一个司法管辖区）\n4. 如果需要，可以删除该身份\n\n这样的系统需要确保以下几点：\n\n* 用于验证身份及其声明的强有力算法\n\
  * 独立于特定的平台或架构\n* 身份具有长久的有效期（理想情况下是永久的）\n* 互操作性（使其广泛可用）\n* 仅在获得用户同意的情况下共享数据\n* 组织应能够访问所需内容，而非完整信息\n\
  * 保护用户权利\n\n## 管理多个身份\n\n**多身份的使用**：个人在多个平台上可能拥有一个身份，也可能希望拥有不同的身份来支持职场、朋友、家庭等不同的“人格”。\n\
  \n值得注意的是，区块链可以支持这种灵活性，并为这些身份中的每一个提供一个密钥，赋予用户在特定情况下决定使用哪种人格格的权力。\n\n## 匿名身份认证\n\n\
  该方案部署了匿名认证以确保最大的安全性。如果访问一个人的数字身份需要公钥，那么该密钥容易受到黑客攻击。匿名认证允许个人使用识别其身份的唯一属性，消除了对`public\
  \ key`的需求。\n\n**拥有数字身份的优势：**\n\n* 它将个人数据的控制权交回给你手中，而不是掌握在行业巨头手中。\n* 解决了难民面临的问题。他们无法进入所属国家。他们没有适当的文件证明。他们无法贷款、开户、买房或创业。他们仍然作为“非实体”存在，无法参与社会。\n\
  * 消除了处理护照制作官僚程序的需要。\n* 增强了医疗记录和知识产权的安全性和隐私性，同时有助于遵守保护患者数据的法规。\n* 简化了 KYC（了解您的客户）流程。目前，每家银行和金融机构都单独执行\
  \ KYC 流程，验证信息和文件并存储数字化版本。通过在共享账本维护数字身份，银行可以在获得客户同意的情况下访问存储数据的相关部分并进行尽职调查。\n\n##\
  \ 区块链：政府面临的挑战\n\n为了使这些利益成为现实，拉丁美洲和加勒比国家的政府需要应对实施区块链带来的挑战。\n\n这些挑战分为三类：\n\n* 第一类涉及技术问题，包括实施相关的困难。\n\
  * 第二类涉及管理和治理，包括对开放标准和框架的需求。\n* 第三类问题是大规模实施，包括所有利益相关者的参与。\n\n该技术通过支持这种灵活性并为这些身份中的每一个提供一个密钥，赋予用户在特定情况下决定使用哪种人格的权力，提供了一种解决这些挑战的方法。\n\
  \n\n\n\n塔塔钢铁（Tata Steel）集团是全球领先的钢铁公司之一，年粗钢产量达 3300 万吨。它是全球地理分布最多元化的钢铁生产商之一，业务遍布全球。在截至\
  \ 2021 年 3 月 31 日的财政年度，该集团的合并营业额为 210.6 亿美元。\n\n## 区块链的优势\n\n区块链可用于 ⁸：\n\n* 促进货物的可追溯性，有助于降低物流成本并确保从开始到结束的操作安全；\n\
  * 助力原产地规则流程全阶段的数字化，这是简化认证和海关结算的关键；\n* 解决公共机构或当局与私营公司之间跨境数据交换的挑战。通过 IDB（拉丁美开发银行）促成的\
  \ CADENA 计划，拉丁美地区的八个海关部门现在根据其相互认可协议共享来自认证为授权经营者（AEOs）的企业的数据；\n* 现代化对外贸易单一窗口（UCEs），通过增加参与方之间的互操作性并为所有方提供信息来简化运营并降低交易成本；\n\
  * 比目前的 SWIFT 网络更快、更廉价地传输资金，且区块链手续费较低，这对中小企业（SMEs）特别有利；\n* 将信用证的开具时间从 10 天缩短至 4 小时。\n\
  \n## 结论\n\n在本章中，我们学习了区块链技术如何通过更快速、更便宜和更透明的交易来简化跨境支付。我们了解 KYC 流程及其在金融监管中的重要性。此外，我们能够识别企业中可以区块链实施的关键领域，例如货币管理和供应链。通过学习本章，我们全面理解区块链技术如何应用于各个行业，从而带来更高效、透明和安全的格局。在下一章中，我们将学习\
  \ Hyperledger 和智能合约。\n\n## 参考文献\n\n¹ 区块链如何用于跨境支付，Murali Ramakrishnan，高级首席顾问，2021\
