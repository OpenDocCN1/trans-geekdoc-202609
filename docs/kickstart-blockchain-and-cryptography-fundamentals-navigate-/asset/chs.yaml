  \ Rozemberg\n\n# 第 8 章：Hyperledger 和智能合约\n\n## 引言\n\n智能合约和投票系统是使区块链技术流行的额外功能。我们在第\
  \ 4 章（c04.xhtml）*开放环境下的分布式共识*中学习了分布式开放环境，在第 6 章（c06.xhtml）*封闭环境下的分布式共识*中学习了类似的封闭环境，这些为许可链区块链提供了共识模型信息。Fabric\
  \ 是第一个完全可扩展的分布式应用程序区块链系统，因为它支持模块化共识协议。这后来成为了 Hyperledger 的一部分。Hyperledger 于 2016\
  \ 年启动，拥有 200 多个全球成员，涵盖金融服务、医疗保健、供应链、制造业和技术领域。知名成员包括沃尔玛、Visa、联邦快递、华为、Aetna 和西班牙电信等。\n\
  \n我们将学习 Hyperledger Fabric 网络的各种组件。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* Hyperledger\
  \ Fabric\n* Hyperledger 架构\n* 编写区块链应用程序\n* 身份\n* Hyperledger Fabric 中的策略\n* 访问控制\n\
  * 成员服务提供 (MSP)\n* Hyperledger 系统中的通道\n* 交易验证\n* 在区块链中执行合约\n* 智能合约平台\n* 智能合约的优势\n\
  * 智能合约技术的挑战\n\n## Hyperledger Fabric\n\nFabric 是第一个完全可扩展的分布式应用程序区块链系统，因为它支持模块化共识协议。这意味着系统可以进行定制以适应特定的用例和信任模型。此外，Fabric\
  \ 是第一个不依赖原生加密货币即可使用通用编程语言编写的分布式应用程序的区块链系统。这与目前的区块链平台形成鲜明对比，后者要求智能合约依赖加密货币或用领域特定语言编写。\n\
  \n作为 Linux 基金会托管的 Hyperledger 项目之一，“Fabric” 是一种模块化且可扩展的开源架构，用于实现和运行许可链。这后来被扩展为 Hyperledger。\n\
  \n通过使用可移植的成员身份概念（可以与行业标准的身份管理相结合），Fabric 实现了许可模型。Fabric 提供了一种全新的全新的区块链设计，并重构了区块链处理非确定性、资源耗尽和性能威胁的方式，以适应这种灵活性。\n\
  \n## Hyperledger Fabric 架构的优势\n\nHyperledger Fabric 架构提供了以下优势 ¹：\n\n* 链框架：Hyperledger\
  \ Fabric 是一个具有模块化架构（即插即用）的许可链框架。它利用容器技术托管包含应用程序逻辑的智能合约（`Chaincode`）。在详细介绍每个组件之前，让我们看看高层交易流程和涉及的基础组件。\n\
  * 开源区块链：Hyperledger Fabric 平台是 Linux 基金会托管的开源区块链框架。它拥有活跃且不断增长的开发者社区。Hyperledger\
  \ Fabric 网络是许可制的，这意味着所有参与成员的身份都是已知且经过验证的。\n\n\n\n\n- **链码信任灵活性**：Hyperledger 架构区分了用于排序链码（即区块链应用）的排序服务之间的信任假设。换句话说，一组节点（排序节点）可以提供排序服务，并接受其中某些节点的故障或行为异常，而每个链码可以拥有一套独立的背书节点集合。\n\
  - **扩展能力**：如果这些角色由相同节点执行，系统的扩展性可能会更好，因为负责特定链码的背书节点与排序节点之间是无关的（正交的）。具体来说，当不同的链码指定了不连续的背书节点时，就会引入跨越背书节点的链码分区，并允许链码同时执行（背书）。此外，排序服务的关键路径从可能的高昂链码执行中中解放出来。\n\
  - **属性**：该架构使得实现对交易、状态更新和内容有秘密要求的链码变得更容易。\n- **共识模块化**：由于其模块化设计，可以实现排序服务或可插共识实现。\n\
  \n# Hyperledger 架构\n\n区块链是由许多节点组成的去中心化网络，这些节点相互交换消息。区块链存储状态和账本数据，执行交易，并运行被称为链码的程序。由于交易是在链码上执行的操作，因此链码充当了焦点。Hyperledger\
  \ 网络上的所有交易都必须“背书”，只有经过批准的交易才能执行并影响状态。系统链码是用于管理功能和参数的特殊链码。可能存在这些代码类型中的一种或多种。\n\n\
  ## 交易\n\n交易分为两类：\n\n- **实现交易（Implement transactions）**创建一个新的链码并传入一个程序。在 `deploy\
  \ transaction` 成功执行后，链码被安装在“区块链”上。\n- 使用交易在先先实现的链码框架内执行任务。链码及其其中一个功能被称为 `invoke\
  \ transactions（调用交易）`。如果链码运行成功，它将执行指定的动作，可能包括更改关联状态并产生输出。\n\n`invoke transactions`\
  \ 是 `deploy transactions` 的特殊情况；系统链码上的 `invoke transaction` 对应于生成新链码的 `deploy transaction`。\n\
  \n## 区块链中的数据结构\n\n区块链数据结构由一组有序的带有回链的交易块组成。它可以存储在简单的数据库中，也可以作为平铺文件。每个块都可以通过其 `hash`\
  \ 唯一标识，该哈希是在块头通过 `SHA256` 加密哈希算法产生的。以下是结构的各个组件：\n\n## 状态\n\n账本状态记录了关于特定业务对象的系列事实。在区块链和加密货币的背景下，“状态”类似于数据库在某一时刻的内容。对于比特币而言，“状态”是该瞬间存在的比特币数量以及转移其中每一个比特所必需的条件。对于\
  \ XRP，“状态”是存在多少 XRP、哪些账户持有它们、这些账户的安全设置、存在哪些其他资产、谁持有它们、做出了哪些以一种资产交换另一种资产的报价等。\n\n\
  “转换（transition）”是不连续的变化，也就是说，需要跳跃的变化。因此，“状态转换（state transition）”是从一个状态到另一个状态的跳跃。对于比特币，每当接受一个区块时，就会发生一次\
  \ `state transition`，导致比特币所有权的变更。对于 XRP，每当接受一个新的账本时，就会发生一次 `state transition`，导致\
  \ XRP 所有权、账户设置、去中心化交易所上的报价和其他类型状态的变化。\n\n几乎所有区块链最重要的属性之一是，从分钟到分钟，系统中的每位参与者都可以监控发生的每一个\
  \ `state transition`，如果该转换不符合系统规则，将拒绝接受该转换。因此，如果你现在有一个比特币，说服比特币参与者你不再拥有那枚比特币的唯一方法就是向他们展示你已授权的转移。\n\
  \n对等节点（Peers）而非客户或排序节点负责维护状态。因为只有链内的交易才能维护状态。\n\n（注：此处原文中存在部分重复/混乱的描述，已按原意逻辑翻译）\n\
  \n\n\n\n\n同行节点还可以承担`背书节点`（endorsing peer）或`背书者`（endorser）的特殊角色。背书节点的特殊功能针对特定的链码，并在事务提交之前对其进行背书。每个链码都可以指定一个`背书策略`（endorsement\
  \ policy），该策略可以引用一组背书节点。策略定义了有效事务背书的充分必要条件（通常是一组背书者的签名）。在安装新链码的部署事务这一特殊情况下，`（部署）背书策略`被指定为系统链码的背书策略。\n\
  \n### 排序服务节点 (Orderers)\n\n`orderers` 形成了排序服务，即一个提供交付保证的通信织网。排序服务可以通过不同的方式实现：从中心化服务（例如，在开发和测试中）到针对不同网络和节点故障模型的分布式协议。\n\
  \n排序服务为 `clients`（客户端）和 `peers`（同行节点）提供了一个句共享的通信通道，为包含事务的消息提供`广播服务`。客户端连接到通道，并可以在`通道`上广播消息，这些消息会被递送给所有同行节点。通道支持所有消息的原子递送，即具有全序交付和（取决于具体实现）可靠性的消息通信。换句话说，通道向所有已连接的同行节点输出相同的消息，并按照相同的逻辑顺序向所有同行节点输出。这种原子通信保证在分布式系统的背景下也称为`全序广播`、`原子广播`或`共识`。通信的消息是待包含在区块链状态中的候选事务。\n\
  \n## 分区（排序服务通道）\n\n排序服务可以支持多个通道，类似于发布/订阅（pub/sub）消息系统的主题。客户端可以连接到指定的通道，发送消息并获取到达的消息。通道可以被看作分区，连接到某一通道的客户端感知不到其他通道的存在，但客户端可以连接到多个通道。Hyperledger\
  \ Fabric 自带的某些排序服务实现为了演示的简单起见，支持多个通道。\n\n### 排序服务 API\n同行节点通过排序服务提供的接口连接到排序服务提供的通道。排序服务\
  \ API 包含两个基本操作（更通用地说是异步事件）：\n\nTODO 添加根据客户端/同行节点指定的序列号获取特定区块的 API 部分。\n\n## 账本和区块形成\n\
  账本包含排序服务输出的所有数据。简而言之，它是一系列 `deliver (seqno, prevhash, blob)` 事件，根据之前描述的 `prevhash`\
  \ 计算，它形成了一个哈希链。\n\n大多数情况下，出于效率考虑，排序服务不会输出单个事务（`blobs`），而是将 `blobs` 分组（批处理）并在单个 deliver\
  \ 事件中输出区块。在这种情况下，排序服务必须实施并传递每个区块内 `blobs` 的确定性排序。区块中 `blobs` 的数量由排序服务的实现动态选择。\n\n\
  Hyperledger Fabric 网络包含以下组件：\n* 资产\n* 共享账本\n* 智能合约\n* 同行节点\n* 通道\n* 组织\n* 成员服务提供者\
  \ (MSP)\n* 排序服务\n\nHyperledger 孵化并支持一系列区块链业务技术、框架、库和应用程序。Hyperledger 项目托管了多个区块链框架，包括\
  \ Hyperledger Fabric。\n\n# Hyperledger Fabric 网络的组件\n\n一个 Fabric fabric 称为 Hyperledger\
  \ Fabric 网络具有以下组件：\n\n* **资产 (Assets)**：资产是任何具有价值的物品。它具有状态和所有权。在 Hyperledger Fabric\
  \ 中，资产以键值对集合的形式表示。\n* **共享账本 (Shared Ledger)**：账本记录资产的状态和所有权。它由两个部分组成：\n    * 世界状态（world\
  \ state）描述账本在给定时刻的状态。它是账本的数据库。\n    * 区块链（blockchain）是记录所有事务的事务日志历史。\n* **智能合约 (Smart\
  \ Contract)**：Hyperledger Fabric 智能合约被称为链码。链码是定义资产和相关事务的软件；句话说，它包含了系统的业务逻辑。当应用程序需要与账本交互时会调用链码。可以使用\
  \ Golang 或 Node.js 编写。\n* **同行节点 (Peer Nodes)**：节点网络的基础元素，因为它们托管了账本和智能合约。节点执行链码、访问账本数据、背书事务并与应用程序交互。某些节点可以是背书节点或背书者。每个链码都可以指定一个背书策略，该策略定义了有效事务背书的充分必要条件。\n\
  * **通道 (Channel)**：通道是由同行节点组成的逻辑结构。这种能力允许一组同行节点创建一个独立的事务账本。\n* **组织 (Organizations)**：Hyperledger\
  \ Fabric 网络由网络成员不同组织拥有并贡献的节点构建。网络之所以存在是因为组织将其个人资源贡献给集体网络。节点由其所属组织的成员服务提供者（MSP）分配一个身份（数字证书）。不同组织的节点可以位于同一个通道上。\n\
  * **成员服务提供者 (MSP)**：MSP 实现为证书权威（CA），用于管理用于验证成员身份和角色的证书。没有任何未知身份可以在 Hyperledger Fabric\
  \ 网络中进行。它管理用户 ID 并验证网络上的所有参与者，使得 Hyperledger Fabric 成为一个私有的许可网络。\n* **排序服务 (Ordering\
  \ Service)**：排序服务是一个开源协作项目，旨在推进用于业务的跨行业区块链技术。这项全球协作由 Linux 基金会托管。\n\n排序服务将事务打包成区块并递送给通道上的节点。它保证了网络中的事务交付。它与节点和背书节点通信。排序服务支持的配置机制有\
  \ `Solo` 和 `Kafka`。\n* **开发包 (SDK)**：SDK 是（通常）硬件平台、操作系统（OS）或编程语言的制造商提供的工具集。Hyperledger\
  \ Fabric SDK 允许应用程序与 Fabric 区块链网络交互。它提供了一个简单的 API，可以用极少的代码向账本提交事务或查询账本内容。\n\n软件开发包（SDK）是一组工具，为开发者提供了构建自定义应用程序的能力，该程序可以添加或连接到另一个程序。SDK\
  \ 允许程序员为特定平台开发应用。\n\nSDK 在客户端应用程序与 Hyperledger Fabric 区块链网络交互时使用的线级基于 protobuf 的通信协议之上了一个抽象层。它允许\
  \ Java 应用程序管理 Hyperledger 通道和用户链码的生命周期。\n\n\n\n\n\n`API` 是一组库，这些库构成了你可以开箱即用的核心语言，而\
  \ `SDK` 是一套便于使用 `API` 的开发工具包。从概念上讲，两者都是你的程序与另一个软件进行交互并控制其提供的资源的方式。\n\n![](img/Figure-8.1.jpg)\n\
  \n**图 8.1:** Hyperledger Fabric 网络组件（为了简单起见，未显示通道）\n\n# 编写区块链应用程序(#toc.xhtml#s285a)\n\
  \n在区块链解决方案中，Hyperledger Fabric 网络作为后端，配合应用前端与网络进行通信[^([2])](#c08.xhtml#ftn2)。`SDKs`\
  \ 帮助你建立前端和后端之间的通信，例如 `Node.js SDK` 和 `Java SDK`。`SDK` 提供了执行用户链码、在网络中执行事务、监控事件等方法。\n\
  \n要编写一个区块链应用程序，你需要：\n\n*   使用支持的编程语言（如 `Go`）编写 `chaincode`。\n*   在 Hyperledger Fabric\
  \ 网络上部署 `chaincode`。\n*   使用 `SDK` 开发客户端应用程序。\n*   了解如何执行区块链事务。\n\nHyperledger Fabric\
  \ 网络中事务的高层请求流如下：\n\n1.  客户端使用 `Node.js` 或 `Java SDK` 连接到 Hyperledger Fabric 网络。使用\
  \ `SDK API`，客户端创建一个事务并将其发送到背书节点（endorsing peer）。\n2.  背书节点验证客户端签名，模拟事务，并发送背书签名。\n\
  3.  如果事务通过背书，客户端将事务提交给排序服务。否则，事务将被取消。\n4.  排序服务将事务交付给所有节点（peers）。所有节点提交并应用相同的事务序列，并更新它们的状态。\n\
  \n# 身份(#toc.xhtml#s286a)\n\n身份是许可链区块链平台的一个重要特性。在 Hyperledger Fabric 中，每个组件在访问 fabric\
  \ 网络之前都需要经过身份标识。身份由 `X.509` 数字证书表示。证书通过认证机构（`Certification Authorities`，简称 `CA`）进行管理。`Fabric\
  \ CA` 是 Hyperledger 对 `Certification Authority` 的实现。\n\n为了使身份可被验证，它必须来自受信任的机构。\n\
  \n在与 fabric 网络交互时，参与者（actor）指定并出数字证书，fabric 网络根据策略接受或拒绝。\n\n区块链网络中的不同参与者包括 `peers`、`orderers`、`client\
  \ applications`、`administrators` 等等^([3])](#c08.xhtml#ftn3)。这些参与者中的每一个一个——即网络内部或外部的可消费服务的活动元素——都有一个封装在\
  \ X.509 数字证书中的数字身份。这些身份非常重要，因为它们决定了参与者在区块链网络中对资源的精确权限以及对信息的访问权限。\n\n此外，数字身份具有一些\
  \ Fabric 用于确定权限的附加属性。它将身份与相关属性的结合赋予一个特殊名称，称为 `principal`（主体）。`Principals` 就像 `userIDs`\
  \ 或 `groupIDs`，但更灵活，因为它们可以包含参与者身份的广泛属性，例如参与者的组织、组织单元、角色，甚至是参与者的特定身份。当我们谈论 `principals`\
  \ 时，它们决定了权限。\n\n# 解释身份使用的简单场景(#toc.xhtml#s287a)\n\n想象你去超市买杂货。在结账处，你看到一个牌子，写着只接受\
  \ `Visa`、`Mastercard` 和 `AMEX`。\n\n![](img/Figure-8.2.jpg)\n\n**图 8.2:** 身份的使用\n\
  \n拥有有效的证书是不够的——`PKIs` 和 `MSPs` 共同工作以确保成员身份。\n\n# 公钥基础设施 (PKI)（#toc.xhtml#s288a)\n\
  \n`PKI` 是提供安全通信的互联网技术集合。如果你正在阅读此文档，你可能在使用 `HTTPS`。\n\n![](img/Figure-8.3.jpg)\n\n\
  **图 8.3:** PKI 证书过程的使用：元素\n\n`PKI` 由`Certificate Authorities` 组成，它们向双方颁发数字证书，随后使用这些证书进行身份验证。`CA`\
  \ 的`证书吊销列表`（`CRL`）构成不再有效证书的参考。证书的吊销可能由于多种原因发生。\n\n# 数字证书(#toc.xhtml#s289a)\n\n数字证书是一种持有与证书持有者相关属性的文档。最常见的证书类型是符合\
  \ `X.509` 标准的证书。`数字签名证书`（`DSC`）是物理或纸质证书的数字等价物。\n\n\n\n\n认证机构是根据 2000 年信息技术法（IT Act,\
  \ 2000）的规定由认证机构控制官（`CCA`）任命的。共有八个获得`CCA`授权颁发数字签名证书（`DSCs`）的认证机构。\n\n### 认证机构\n\n\
  认证机构（`CA`）根据印度 2000 年信息技术法第 24 条获得了颁发数字签名证书的许可。人们可以从任何认证机构获取第 2 类或第 3 类证书。其中一些包括：\n\
  \n* 国家信息中心 (`NIC`）\n* IDRBT 认证机构\n\n## Hyperledger Fabric 中的策略\n\nHyperledger Fabric\
  \ 块链网络的配置由策略（policies）管理。这些策略通常存在于通道配置（channel configuration）中。本文档的主要目的是解释策略如何在通道配置中定义以及如何与通道配置交互。然而，策略也可能指定在其他地方，例如链码（chaincodes）。因此，这些信息在通道配置范围之外也可能具有价值。\n\
  \n## 理解策略\n\n在最基础的层，策略是定义决策结构和实现特定结果的规则集。为此，策略通常描述了“谁”和“什么”，例如个人对资产拥有的访问权限或权利。我们可以看到，策略贯穿我们的日常生活以保护价值资产，从汽车租赁、健康、家居等许多方面。\n\
  \n例如，保险单定义了支付保险赔金的条件、条款、限制和有效期。保单由保单人和保险公司共同签署，并定义了双方的权利和责任。\n\n在 Hyperledger Fabric\
  \ 中，策略是基础设施管理的机制，类似于为了风险管理而设立保险单。在 Fabric 中，策略代表成员如何就接受或拒绝对网络、通道或智能合约的变化达成共识。策略在网络最初配置时由联盟成员达成，但也可以随着网络的演进进行修改。例如，它们描述了从通道中添加或移除成员的标准，改变区块的形成方式，或指定背书智能合约所需的组织数量。这些动作由策略描述，策略定义了谁可以执行该动作。总之，你想在\
  \ Fabric 网络上执行的所有操作都由策略控制。\n\n在最基础的层，策略是一个函数，它接受一组签名数据作为输入并进行成功评估，或者因为签名数据的某些方面未满足策略要求而返回错误。\n\
  \n更准确地说，策略测试某些数据的签名者或多个签名者是否满足这些签名被视为“有效”所需的某些条件。这对于确定正确的当已同意某项交易或更改有用。\n\n例如，在\
  \ Hyperledger Fabric 中，策略可以定义以下任何内容：\n\n* 必须来自 5 个可能的不同组织中的 2 个管理员的签名。\n* 任何组织中的任何成员都必须签名。\n\
  * 两个特定的证书必须由双方签名。\n\n这些策略规则仅为示例，可以构建其他强大的规则。\n\n# Hyperledger Fabric 中策略的必要性\n\n\
  正是策略使得 Hyperledger Fabric 区别于以太坊或比特币等其他区块链。在这些系统中，交易可以由网络中的任何节点生成和验证。治理网络的策略在任何时间点都是固定的，并且只能使用与管理代码相同的流程进行更改。由于\
  \ Fabric 是一条许可块链，其用户由底层基础设施识别，因此这些用户有能力在网络启动之前决定网络治理方案，并可以在运行的网络中更改治理方案。\n\n策略的内容允许成员决定哪些组织可以访问或更新\
  \ Fabric 网络，并提供执行这些决策的机制。策略包含了有权访问给定资源（如用户或系统链码）的组织列表。它们还规定了需要多少个组织对更新资源（如通道或智能合约）的提案达成一致。一旦写入策略，策略将评估附加在交易和提案上的签名集，并验证签名是否符合网络达成的治理规定。\n\
  \n# 策略在 Fabric 全范围内的实现\n\n在 Fabric 中，策略在网络的不同层次实现。每个策略域（policy domain）治理网络运行的不同方面。\n\
  \n![](img/Figure-8.4.jpg)\n\n图 8.4：Fabric 策略层级的视觉表示\n\n每个 fabric 网络都从排序系统通道（ordering\
  \ system channel）开始。必须有一个排序系统通道，它是第一个创建的通道。系统通道还包含排序服务的成员组织（排序组织）以及位于网络上的组织（联盟组织）。\n\
  \n系统通道区块中存在的策略治理排序服务所使用的共识，并定义了区块的创建方式。系统通道还治理联盟中哪些成员允许创建新通道。\n\n# 应用通道配置\n\n应用通道用于提供组织之间的私有通信机制。\n\
  \n从通道中添加或移除成员的能力由应用通道中的策略治理。当最初创建应用通道时，它默认从系统通道继承所有的排序参数。然而，这些参数（以及治理它们的策略）可以在每个通道中进行自定义。\n\
  \n## 访问控制列表 (ACLs)\n\n访问控制列表（ACL）是规则列表，指定哪些用户或系统被授予或拒绝访问特定的对象或系统资源。网络管理员会对 Fabric\
  \ 使用 ACL 特别感兴趣，ACL 通过将这些资源与现有策略关联提供了配置资源访问的能力。这些资源可以是系统链码上的函数（例如 `qscc` 系统链码上的 `GetBlockByNumber`）或其他资源（例如，谁可以接收区块事件）。ACL\
  \ 引用应用通道配置定义的策略并扩展它们以控制额外的资源。\n\n## 策略类型\n\n目前实现了三种不同的策略：\n\n* **签名策略 (Signature\
  \ Policy)**：它是最强大的，并将策略指定为 MSP 主体评估规则的组合。它支持 *AND*、*OR* 和 *NOutOf* 的任意组合，允许构建极其强大的规则，例如，“组织\
  \ A 的管理员和 2 个其他管理员，或者 20 个组织管理员中的 11 个”。\n\n* **隐式元策略 (Implicit Meta Policy)**：比签名策略灵活灵活，且仅在配置上下文中有效。它聚合配置层次结构深处策略评估的结果，这些策略最终由签名策略定义。它支持良好的默认规则，例如，“组织管理员策略的多数”。\n\
  \n\n\n\n\n- **背书策略**：Hyperledger Fabric 充当背书节点的一项指令，用于验证交易是否已妥当背书。在 Hyperledger\
  \ Fabric 中，每个节点在接收到交易提议后，每个链码的交易都会在该节点上调用一个有效系统链码 (`VSCC`)。它的目的是比较背书签名与交易签署的签名，因为一个交易包含来自多个背书节点的一个或多个背书。\n\
  \n## 有效系统链码 (VSCC)\n\n验证系统链码根据为链码指定的背书策略评估交易中的背书。`VSCC` 被引入以确定：\n\n- 所有的交易背书都是有效的（即它们包含来自授权源的有效证书的有效签名）。\n\
  - 交易背书的数量与背书策略中声明的背书需求匹配。\n- 背书来自授权的预期源。\n\n`VSCC` 检查背书策略中允许的角色：\n\n* Peer（节点）\n\
  * Client（客户端）\n* Member（成员）\n* Admin（管理员）\n\n注意：这些角色必须在通过任何 SDK 实现通过 `CA` 在区块链上注册用户后，在\
  \ `setEnrollment` API 中仅以字符串形式定义。\n\n`VSCC` 根据定义的背书策略检查签名身份的角色。该角色必须是上述角色之一，才能通过背书策略的审批，否则背书节点将抛出\
  \ `ENDORSEMENT_POLICY_FAILURE` 错误，原因是签名集不满足背书策略，或者无法收集到策略所需的签名数量。\n\n让我们了解用于为基于\
  \ Node SDK 的客户端与区块链通信时定义的背书策略格式。\n\n## 访问控制\n\n访问控制是一种限制他人对你的代码访问的设备。同一个包可以访问彼此的变量和方法，私有成员除外。外部包可以访问公共类。此外，可以访问公共成员。\n\
  \n显而易见，Fabric 使用访问控制列表 (`ACL`) 通过将策略与资源关联来管理对资源的访问。Fabric 包含许多默认 ACL。\n\n## Hyperledger\
  \ Fabric 中基于属性的访问控制 (ABAC)\n\nABAC 用于限制对证书中具有必要属性的特定用户的访问。首先，让我们讨论带有属性的证书创建。\n\n\
  通常，创建证书的过程是：\n\n1. 入组 (Enrollment)\n2. 注册 (Register)\n\n入组是用户从指定的 `CA` 请求并获取数字证书的过程。注册通常由\
  \ `Registrar` 完成，告诉 `CA` 发行数字证书。一个 `admin`（注册员）入组到 `CA`。然后，`admin` 接收该 `admin` 的签名密钥和证书。\n\
  \n首先，`admin` 用适当信息将 `user1` 注册到 `CA`。`CA` 返回一个密钥。然后使用该密钥将 `user1` 入组到 `CA`。结果是 `user1`\
  \ 的签名密钥和证书。\n\n所有平台如 Hyperledger Fabric 区块链和 IoT 设备都展示了访问控制并为 IoT 设备建立了信任根。因此，Hyperledger\
  \ Fabric 设计为通过加密协议、访问限制和加密算法来防止未经授权的访问和使用。\n\n访问控制系统旨在保护资源免受未经授权的访问。审计性功能发挥着重要作用，在公共和私有管理方面其重要性日益增加，并且可以扩展到基于区块链的访问控制系统中。Hyperledger\
  \ Fabric 将利用一种旨在减少对机密信息的未经授权访问的同时在访问控制方面实现去中心化的解决方案。这项工作行动不仅将关注此类概念证明的实现，还将利用有效技术对其进行配置和部署。\n\
  \n基于区块链技术构建这样的系统是非常具有挑战性的，因为此类分布式账本技术确实是复杂的分布式系统。关于区块链访问控制，有两个主要挑战：\n\n- 为具有权限、数据隐私和安全要求的场景提供功能配置。\n\
  - 缺乏开发和运行的标准化流程，即持续集成、持续部署和持续改进。\n\n实习目标是：\n\n- 通过推进区块链访问控制的最新技术为开源社区做出贡献。\n- 使用\
  \ Hyperledger Fabric 创建一个基于区块链的访问控制系统。\n- 开发一个高效、实用的 DevOps 框架来配置和部署所创建的系统。\n- 对\
  \ Fabric 进行修改以促进此类系统的创建（例如创建教程或脚本）。\n- 如果时间允许，开发一个小型 Web 来帮助可视化解决方案。\n\n## 成员服务提供者\
  \ (MSP)\n\n成员服务提供者 (`MSP`) 是 Hyperledger Fabric 的一个组件，提供了成员操作的抽象。特别是，`MSP` 抽象了背后的所有加密机制和协议、发行证书、验证证书和用户身份验证。\n\
  \n不而说，成员服务提供者 (`MSP`) 是 Fabric 中受信任的权威。\n\n`MSP` 可以定义自己的身份概念以及治理这些身份的规则（身份验证）和身份验证（签名生成和验证）。\n\
  \n一个或多个 `MSPs` 可以管理 Hyperledger Fabric 区块链网络。这提供了成员操作的模块化，以及不同成员标准和架构之间的互操作性。\n\n\
  ## Hyperledger 系统中的通道\n\n通道是 Amazon Managed Blockchain 上 Hyperledger Fabric 网络中两个或多个成员之间的隐私通信路径，其中\
  \ Hyperledger Fabric 网络上的每笔交易都发生在通道中。Hyperledger Fabric 中的所有通道都是主区块链的子网。此外，一个网络必须包含至少通道，Managed\
  \ Blockchain 上的网络可以多多八个通道。\n\n节点订阅通道的排序服务，然后当区块创建时从其接收通道相关的区块。在此过程中：\n\n- 通道化意味着拆分区块链（分区），因此，你应该想象每个通道都像一条独立的区块链，具有自己的自增序列号\
  \ (`seqno`)。\n- 每笔交易的广播必须在特定通道的范围内进行（带有默认公共通道）。\n- 通道用于创建子网络（私有）。该网络有许多节点（成员）。此通道目的是准备私有网络并执行机密交易。\n\
  - 网络的每笔交易都在通道上执行。\n- 每个通道都有独立的账本，存储在通道的每个节点上。\n- 通道被视为独立的链，增加了隐私性，交易在特定通道上进行。\n\n\
  ## 多通道\n\nFabric 的一个内置功能，其能力不仅限于在一个节点上拥有多个通道。在链码内部，用户能够调用其他链码。如果节点是该通道的一部分，且链码已安装在节点上，则可以调用其他的链码。但在另一个通道上，没有交易被添加到账本中，因此你只能对另一个链码进行查询（读取）。\n\
  \n\n\n\n我们刚刚了解到 `Channels`（通道）类似于分区。用户可以创建通道并邀请同伴加入通道。这样，用户就可以定义哪些成员可以访问该通道。`Channels`\
  \ 增加了隐私性，因为连接到某个通道的客户端感知不到其他通道的存在。\n\n在隐私方面，我们可以为每个机密域建立单独通道，只有允许的同伴才能进行订阅。发送到通道的事务将在通道内相互排序。因此，一个批次（batch）只包含该通道的事务，而不包含任何其他通道的事务。\n\
  \n`Batch` 意味着块。因此，每个 `Channel` 都是一个独立的事务块链，仅包含该特定 `Channel` 的事务。因此，通过 `Fabric`，你可以在同一套基础设施（排序服务、成员关系服务等）中运行多个\
  \ `Blockchains`（区块链）。\n\n## 事务验证\n\n在背书者模拟事务期间，会为事务准备一个读写集。读集包含事务在模拟期间读取的唯一键列表及其提交的版本。写集包含事务要写入的唯一键列表及其新值，尽管这些键可能与读集中存在的键存在重叠。如果事务执行的更新是删除该键，则会在该键的新值位置设置一个删除标记。如果事务对一个键写入了多次值，则只保留最后写入的值。此外，如果事务在提交之前已经更新了某个键的值，返回的将是提交状态中的值。换句话说，不支持“读你自己的写”（read-your-writes）语义。键的版本仅记录在读集中；写集仅包含由事务设置的唯一键列表及其最新值。\n\
  \n实现版本有多种方案。版本方案的最小要求是为给定的产生产生重复的标识符。例如，使用单调递增的数字作为版本是一种方案。在当前的实现中，我们使用基于高度的版本方案，事务的高度被用作所有键的最新版本。在这种方案中，事务的高度由元组\
  \ `txNumber` 表示。\n\n以下是一个模拟事务时准备的读写集示例。在以下示例中，增量数字代表版本。\n\n```xml\n<TxReadWriteSet>\n\
  <NsReadWriteSet name=\"chaincode1\">\n  <read-set>\n    <read key=\"K1\", version=\"\
  1\">\n    <read key=\"K2\", version=\"1\">\n  </read-set>\n  <write-set>\n    <write\
  \ key=\"K1\", value=\"V1\">\n    <write key=\"K3\", value=\"V2\">\n    <write key=\"\
  K4\", isDelete=\"true\">\n  </write-set>\n</NsReadWriteSet>\n</TxReadWriteSet>\n\
  ```\n\n此外，如果事务在模拟期间执行范围查询，范围查询及其结果将作为查询数据添加到读写集中。\n\n# 读写集事务验证\n\n在现实，每个提交者都利用读写集中的写集来更改影响键的版本和值，并验证事务的合法性。假设所有之前的事务（包括块中的事务）都已提交，如果事务读集中的每个键的版本与世界状态中的相同键匹配，则在验证阶段该事务被认为是有效的。如果读写集中包含一个或多个查询部分，则执行额外的验证。\n\
  \n确保范围（即记录在查询中的范围并集）中没有键被添加、删除或更改，是额外验证的目标。换句话说，如果在提交期间检测到幻读对象（phantom objects），此检查将确保事务被标记为无效。任何地方存在的单个对象都被称为幻读，而提交表示对任何操作的有意执行。链代码中的\
  \ `GetStateByRange` 函数是尚未其他查询实现这种幻读保护的查询类型，除非应用程序能够确保模拟和提交时间之间的结果集保持稳定。\n\n当事务通过有效性检查时，提交者使用写集更新世界状态。在更新阶段，写集中每个键的值被更新为世界状态中对应键的值。此外，通过更改其版本，键的最新版本反映在世界状态中。\n\
  \n# 事务流\n\n事务流描述了典型资产交换涉及的事务过程。买卖萝卜的两个客户端 A 和 B 参与了场景。他们与账本通信，并向对方在网络上的节点发送事务。\n\
  \n**假设：**\n\n事务流假设通道已建立并运行。在与组织的证书颁发机构（CA）注册并注册后，应用程序用户收到所需的加密材料，用于网络身份验证。因此，链代码被发布到通道并放置在节点上。它包含了一系列反映萝卜市场初始状态的键值对。定义一组事务指令和萝卜约定价格的逻辑包含在链代码中。对于此链代码，还建立了背书策略，规定\
  \ peerA 和 peerB 必须批准每个事务。\n\n![](img/Figure-8.5.jpg)\n图 8.5：客户端 A 发起事务\n\n客户端 A\
  \ 正在发送购买萝卜的请求。该请求针对 peerA 和 peerB，它们分别代表客户端 A 和 B。背书策略规定两个节点必须背书任何事务，因此请求发送到 peerA\
  \ 和 peerB。\n\n接下来，构建事务建议。利用支持的 SDK（`Node`、`Java`、`Python`）的应用程序使用可用 API 之一生成事务建议。建议是调用带有特定输入参数的链代码函数，目的是读取和/或更新账本。软件开发包（SDK）作为垫层（shim），将事务建议封装成适当的架构格式（基于\
  \ gRPC 的 protocol buffer），并使用用户的加密凭据为此事务建议生成唯一签名。在 Hyperledger Fabric 环境中，Shim 为链代码提供了访问其状态变量、事务上下文和调用其他链代码的\
  \ API。Shim 包含了链代码和验证节点相互通信的通用手段。\n\n![](img/Figure-8.6.jpg)\n图 8.6：背书节点、验证签名并执行事务\n\
  \n背书节点验证：\n\n*   事务建议格式是否正确。\n*   是否在过去是否已经提交过（防止重放攻击）。\n*   签名是否有效（使用 MSP）。\n\n\
  \n\n\n*   提交者（示例中为客户端 A）已获得适当授权，在该通道上执行提议的操作（即每个背书节点都确保提交者满足通道的写入策略 Writers policy）。\n\
  \n背书节点将交易提议输入作为被调用的链码函数的参数。随后，针对当前状态数据库执行该链码，以产生交易结果，包括响应值、读集和写集（即代表要创建或更新资产的键/值对）。在此时，尚未对账本进行任何更新。这些值的集合连同背书节点的签名，将作为“提议响应”传回给\
  \ SDK，再由 SDK 解析负载以供应用程序使用。\n\n# 在区块链中执行合约\n\n计算机科学家*尼克·萨博（Nick Szabo）*于 1994 年提出了智能合约的概念，并在他在其中讨论了如何将合同嵌入计算机代码中的方法[^(\\\
  [7\\]](#c08.xhtml#ftn7)。区块链技术的出现，特别是以太坊的发布，使得这种可能性变得更加切实。这种方法确保了发布在网络上的所有记录的安全性和透明性。\n\
  \n所有利益相关者都对智能合约共享和访问的效率赞叹不已。事实上，智能合约可以*自动化、计算*并*安排支付*，然后自动执行其条款和条件。当满足义务时，合约可以立即执行，*具有节省时间、消除中间环节并允许基于共识的验证的优势*。\n\
  \n众所周知，区块链技术的首个知名应用是比特币，这是一种*点对点*系统，专门设计用于在不依赖中心节点的情况下实现价值传输。它运行得非常好，并且在今天仍然保持高效运行，可以说是区块链应用中最稳健的部署。但是，创新的区块链技术智能合约进一步阐述了加密革命。选择使用智能合约将带来许多业务优势，包括*信任、透明性、安全性、自主性和准确性*。\n\
  \n这种核心概念是：`smart contract`（智能合约）一词指的是由一组区块链节点独立执行的计算机程序，用于记录最新的程序状态。\n\n# 智能合约的基本定义\n\
  \n智能合约被定义为两个人之间以计算机代码形式存在的协议。它们运行在区块链上（除了其他几种格式外），因此它们存储在公共数据库中且无法更改。智能合约中发生的交易由区块链处理，这意味着它们可以自动发送，无需第三方（如中央或联邦政府、储备银行等）的干预。\n\
  \n值得注意的是，智能合约是由区块链节点在处理用户提交的交易时执行的。一个区块链交易包含以下内容：\n\n*   一个指定的智能合约函数。\n*   一个包含函数调用输入值的负载。\n\
  *   始终带有提交者的签名。区块链网络中的任何节点都可以接收交易，然后该交易会被广播到网络中的所有其他节点以实现可见性。每个节点都会在某时刻使用目标智能合约中的可执行程序来完成交易。如果交易执行成功，区块链的内部状态将得到更新。如果智能合约判断输入无效并拒绝交易失败，则状态将保持不变。\n\
  \n大多数区块链节点必须执行智能合约。与传统数据库不同，区块链没有权威且是去中心化的。值得注意的是，通过使用智能合约代码执行交易，每个节点都保持了自己的状态。\n\
  \n如何确保所有节点之间状态的一致性？如果所有三个组件都相同，最终状态将始终相同。在区块链节点之间达成共识最重要的因素之一是区块链，其链接的哈希值反映了每个完整的交易列表（输入值）和当前状态（初始状态）。最后，不同的区块链协议使用各种方法来确保使用相同的智能合约代码处理交易。对于加密货币以太坊，智能合约代码直接作为状态保留在链上。而在\
  \ Hyperledger Fabric 和 Corda（另外两个流行的商业区块链系统）中，合约代码保留在链外；智能合约的预期版本由链上哈希表示。\n\n智能合约是可执行程序[^(\\\
  6\\]](#c08.xhtml#ftn6)。维护程序状态是智能合约的主要目的。状态是通过执行执行进行更新的任意数据点。从这个意义上说，区块链可以被视为数据库，尽管其架构强调数据一致性和不可变性，而牺牲了查询支持和性能。\n\
  \n因此，每个智能合约都保留自己的状态集。除了不需要智能合约的纯价值传输外，提交到区块链的大多数交易旨在触发智能合约。目标智能合约在交易执行后修改其状态。此外，智能合约有调用另一个智能合约来更新或查询下游合约的能力。\n\
  \n根据 IBM 的说法，智能合约本质上是基于区块链的算法，在满足特定标准时执行。通常，它们被用于自动化协议的实现，因此不需要中间环节，任何参与方都无需延迟即可获知。为了让智能合约引擎能够支持广泛的用例，语言必须是图灵完备的——计算机科学中的一个术语，意味着该语言可以处理任何计算问题。这就是为什么比特币不被认为具有智能合约，尽管由于功能限制，在脚本语言中编程是可行的。当以太坊首次提供对智能合约的支持时，它开启了一个快速发明时期，以解决社会和技术面临的一些最困难的问题。\n\
  \n# EOSIO 区块链\n\nEOSIO 区块链旨在模拟真实计算机的性能，软件本身的操作中使用了一些熟悉的计算概念。有三种资源驱动着 EOSIO 区块链。EOSIO\
  \ 是电光系统输入输出的缩，是一种智能合约平台，它消除了交易费用，并且每秒执行数百万次交易。\n\n\n\n\n\n通过电子方式（通常通过互联网）进行建模、签署和完成的协议被称为在线合同或电子合同。\n\
  \n在线合同的撰写方式与典型的纸质合同相同，使用了非常相似的概念。在在线合同中，想要销售商品的供应商必须向潜在客户展示其商品、价格和购买条款。对购买商品感兴趣的购买者可以选择以电子方式签署，或者考虑使用“我同意”或“点击以同意”选项来表示他们对供应商所陈条款的接受。\n\
  \n在现实中，有多种执行电子签名的方法，例如在指定的签名字段中输入签名者的姓名、复制并粘贴签名的扫描副本，或选择合适的选项。一旦达成一致并收到资金，交易即可完成。本质上，服务器提供了两台计算机之间的通信。\n\
  \n在电子合同中，要约、要约邀请、反要约或接受等均通过电子手段进行。这种形式的电子通信导致了协议合同的起草。\n\n`bilateral contract` 是双方之间具有约束力的协议，双方均承诺履行并完成交易的一方义务。\n\
  \n**注意**：任何人都可以编写智能合约并将其部署到网络。你只需要学习如何用智能合约语言对其进行编码，并拥有足够的 `ETH` (`Ethereum**）来部署你的合约。\n\
  \n简而言之，智能合约是自动执行双方之间交易的`digital agreements`，提高了支付和执行的速度、准确性和完整性。值得注意的是，如果智能合约符合合同法，它们是具有法律执行力的。\n\
  \n智能合约还可能包含尽可能多的条款，以确保相关方的工作能令他们满意完成。参与者必须对管理这些交易的“如果/当……那么……”规则达成一致，调查任何潜在的异常，设计解决争议的框架，并决定交易及其数据在区块链上的表示方式，以构建各项条款。\n\
  \n在这些情况下，开发者可以创建智能合约。然而，越来越多使用区块链技术的企业提供了模板、网页界面和其他在线工具，使创建智能合约的过程变得更容易。\n\n# 智能合约的优势\n\
  \n智能合约的优势如下：\n\n*   **准确性、速度和效率**：如果满足条件，将立即执行。因为智能合约是数字化和自动化的，在这种情况下不需要处理纸质文件，也不会浪费时间去核对手动填写文档时可能产生的错误。\n\
  *   **信任和透明度**：不需要担心信息是否为了个人利益而被更改，因为没有第三方参与，参与者交换的是加密的交易记录。\n*   **安全性**：由于区块链交易记录是加密的，因此无法破解。此外，为了让黑客修改分布式账本上的单条记录，他们需要修改整个链，因为每条记录都与其前后的记录相关。\n\
  *   **节省**：由于智能合约在不需要中间人的情况下处理交易，可以实现成本和延迟的节省。\n\n# 智能合约结构\n\n将智能合约视为程序函数，具有输入、输出和处理输入的逻辑。这将帮助你理解智能合约是如何工作的。智能合约经常产生更新的状态。交易的有效性由嵌入区块链中的逻辑逻辑进行验证。根据区块链的设计，无效交易会被拒绝或添加。当交易提交到区块链时，智能合约可能会向监听者发出通知。\n\
  \n`transfer(amount, to)`\n`approve(sum)`\n`convey(amount, from)`\n`mint(quantity,\
  \ to)`\n`burn(amount, from)`\n`accountOf`\n\n# 智能合约的生命周期\n\n智能合约必须在区块链上部署才能处理交易。确保每个区块链节点拥有完全相同的代码是部署程序的要求。不同的区块链设计对这一要求的处理方式不同。但通常有两种处理方式：要么将代码本身存储在区块链中，以确保全球共识（链上）；或者让每个节点所有者决定节点是否应本地安装代码，并使用离链引用进行代码完整性校验（区块链中基于哈希的承诺）。\n\
  \n# 智能合约的应用\n\n包括金融、房地产、医疗保健、保险甚至选举在内的许多行业已经在经历由智能合约带来的转型。广泛的领域可以利用智能合约来执行任务：监管合规、合同的可执行性、国际金融交易、房地产所有权、购房、供应链管理、材料溯源、文档管理以及许多其他用途。\n\
  \n\n\n\n\n*   **供应链管理**：这是一个可以从智能合约应用中受益的领域。利用智能合约增加供应链的透明度有助于商品流动，并重新建立贸易信任。当产品通过供应链时，智能合约可以追踪所有权，并验证在任何给定时刻由谁负责货物。在交付给客户之前，完成后的产品可以在流程的每个阶段进行检查。\n\
  \n*   **保险**：保险业目前缺乏自动化管理，未来可能从智能合约的使用中受益。保险理赔的处理和支付可能需要几个月。当特定情况发生时，智能合约可以自动触发理赔，有助于简化并优化流程。因此，精确的信息可能会记录在区块链上，以确定确切的赔偿金额。\n\
  \n*   **抵押贷款**：智能合约使贷款申请过程变得更加简单。在这里，贷款的条件是通过评估借款人的收入、支出、信用评分和其他因素来决定的。对于贷方和借款人来说，进行这些检查（通常通过第三方）的要求可能导致程序冗长且具有挑战性。消除中间环节允许双方直接进行交易。\n\
  \n*   **金融行业**：随着货币和相关文档单向电子化发展，该行业继续广泛采用智能合约。金融服务业为智能合约的使用提供了各种潜力，例如高效的“了解您的客户”（KYC）认证、贸易融资、支付处理以及金融工具的清算与结算。\n\
  \n*   **减少贸易融资中的昂贵错误**：由于智能合约可以简化流程并改进计算，它们还可以减少工时。智能合约将使金融服务行业的基础和程序发生重大调整。他们认为，分布式账本将成为处理大量交易的首选方案。到\
  \ 2022 年，这些节省每年总计在 150 亿至 200 亿美元之间。\n\n*   **房地产中的物业数据追踪**：通过消除对律师或经纪人的需求，该领域的智能合约被用于记录任何结构的所有权，并最大限地提高交易速度和效率。卖家可以选择直接引导流程。区块链领域的知名人物\
  \ Rob Massey 声称，智能合约使得产权管理更加廉价且透明。由于产权缺陷导致的转 own 受阻，可能会产生法律费用。另一方面，智能合约维护了物业的历史、位置以及产权评估所需的所有其他关键信息。通过安全、防篡改的加密代码，它们有助于防止欺诈。\n\
  \n*   **保护私人健康信息**：越来越多的医疗机构正在使用区块链来提供可靠的自动化和现代安全功能。由于拥有大量敏感数据，医院是网络攻击者的首要目标。在影响了如\
  \ UCLA Health 等知名公司的数据泄露事件中，约 450 万份患者记录被盗取。在这种背景下，确保医疗提供者之间患者数据的交换对于维持护理标准至关重要。通过使用智能合约，患者数据可以安全地存储在区块链上，只有通过患者的私钥才能访问。通过这种方式，患者可以确保他们的信息受到保护，并确保医疗专业人员始终能够访问所需的信息。\n\
  \n*   **提高选举便利性和诚信**：区块链投票技术可能是未来选举的方式。区块链投票系统通过允许数字通道进行安全简单的投票，具有增加可访问性、提高投票率并加速选票统计和报告的潜力。选举黑客经常防止重复投票，而智能合约能够验证选民身份以防止这种情况发生。\n\
  \n*   **减少保险行业理赔欺诈**：在保险业务中，理赔处理每年花费数百万美元。虚假理赔导致了更多的损失。智能合约通过定期的错误检查加强理赔处理，协助管理个人或公司的保险业务。此外，由于处理时间加快，客户的总体支出更少，即使是保费率也是如此。\n\
  \n*   **另一个更灵活的示例**：智能合约的其他应用包括点对点交易、供应链管理、产品创建和盘点等。尽管在创新和发展方面仍有空间，但智能合约使用的增加强调了它们预期的效率、问责和透明等效益。\n\
  \n智能合约是许多用例的关键，并为我们提供了使交易和流程更加高效和自动化的机会。智能合约将长期存在；部署量的逐年增长进一步强调了它们在区块链生态系统中的重要性。开源社区完全拥抱了这一概念，并在各种智能合约语言中开发了许多高质量库。例如，`OpenZeppelin`\
  \ 在基于 `Ethereum` 的区块链 `Solidity` 开发者社区中被广泛使用。\n\n名为 `Enterprise Ethereum` 的货币具有\
  \ `Ethereum` 的继承性，提供了一个简单的一步部署智能合约的过程。部署通过交易完成，这在本质上是一项全链操作。智能合约代码以状态的形式保存在链上。因此，所有节点都保证可以访问代码，并且它们都拥有相同的版本。\n\
  \n另一种加密货币 `Corda` 采用了点对点的交易协调架构，而不利用全局维护的公共交易账本。因此，智能合约的部署是基于执行双边或多边交易的需求按节点进行的。与\
  \ `Fabric` 类似，`Corda` 节点的管理员负责确保处理交易所需的智能合约已安装在节点上。\n\n# 智能合约使用模式\n\n“智能”通常与基于海量数据并采用计算密集型算法的人工智能相关联。尽管名字如此，智能合约并不智能，也不具有法律约束力。智能合约的存在是为了通过去中心化建立信任，在其中多个方独立地执行相同的代码并保持相同的状态。在此类应用中，为了安全，通过重复计算牺牲了效率。这意味着智能合约并不是通过机器学习构建智能或执行任何深度分析的绝佳场所。\n\
  \n注意：除了计算的重复外，智能合约还会导致状态数据存储在每个节点中。在考虑智能合约应该维护什么数据时，最佳实践是仅使用它来跟踪以下信息：要么代表对在其他处存储的数据承诺（以便在事后无法更改），要么需要更新的信息。法律文件通常非常冗长，并包含大量的模板内容。将整个法律文件保存在智能合约中将是利用区块链的一种非常低效的方法。\n\
  \n## 智能合约平台\n\n\n\n\n\n如今，存在许多智能合约平台。可以根据技术、终端用户（银行、政府、供应链、房地产、保险等）以及地区（面向欧洲、北美、亚洲或世界其他地区）等维度对它们进行分类。\n\
  \n它们的区别体现在：\n\n*   用于编程的编程语言。\n*   区块链共识机制。\n*   应用程序内智能合约的维护成本。\n*   区块链安全性的差异。\n\
  *   对主网节点的信任度。\n*   交易确认速度以及许多其他因素。\n\n1. **Ethereum (太坊)**：以太坊率先将智能合约引入更广泛的加密货币生态系统，是编写和执行智能合约最复杂的平台。由于这个开源平台拥有最大的开发者网络之一，它能够适应区块链领域不断变化的格局。\n\
  \n然而，以太坊是第一个专门为 dApp 创建编写代码的区块链平台。由于它们的出现涌出了许多平台，包括 `Aeternity`、`Cardano`、`Qtum`、`Stellar`\
  \ 和 `Waves`。\n\n2. **Aeternity**：Aeternity 提供了一种运行所谓的图灵完备合约的方法，这些合约可以在链外执行。这是通过结合提供保护和隐私的\
  \ `Proof-of-Work`（工作量证明）和 `Proof-of-Stake`（权益证明）架构实现的。\n\n3. **Cardano**：Cardano\
  \ 是一种加密货币和去中心化区块链计划。与其他加密货币计划一样，Cardano 是开源的。随着 `Goguen` 的发布，Cardano 平台旨在整合智能合约能力。这将使其更加先进。\n\
  \n4. **Qtum (量子链)**：这个开源区块链应用平台最重要的两个特性是安全性和适应性。\n\n`Qtum` 团队付出了大量努力确保智能合约的安全执行，这使得该平台成为公司及其企业客户的理想选择。`Qtum`\
  \ 使用 `Proof-of-Stake`（权益证明）和去中心化治理协议。\n\n5. **Stellar (星芒)**：与许多加密货币不同，Stellar 是开发者为开发者开发的，这使其能够管理极其复杂的智能合约。对于寻求创建更高效智能合约的开发者来说，Stellar\
  \ 是基础智能合约清晰且易于使用的替代方案。\n\n6. **Waves**：Waves 是一个开源区块链项目，广泛利用 Web 3.0 技术和 dApps。对于可能选择使用\
  \ Waves 的开发者，公司提供了各种在线课程来帮助他们保持智能合约项目的简单性，此外还有其他形式的支持。与几个智能合约计划类似，Waves 使用 `Proof-of-Stake`（权益证明）。\n\
  \n# 智能合约的优势\n\n智能合约系统为各行业提供了比传统合同得多的优势。从理论上讲，它们比传统的合同法更高效、更可靠，由于所有操作都经过记录和验证，还认为认为提供更好的安全性。因此，它们可以减少不必要的成本和时间支出，同时增强透明度。\n\
  \n*   **更高的效率和速度**：智能合约是自动化的，因此不需要花费大量时间处理文书工作以及纠正文档中手动编写的错误。它们可以在几分钟内执行，成本仅为一部分，无论参与方在哪里，且不需要律师。智能合约能够提高商业安排执行的效率和速度。\n\
  *   **准确性和透明度**：由于代码化的条款对所有相关方完全可见可访问，一旦智能合约建立，就无法争议。这些功能实现了交易透明化，并可能消除操纵、偏见或错误的可能性。这反过来导致监控成本的降低和投机行为风险的减少。\n\
  *   **信任**：智能合约可能为双方提供某种程度的信任，因为：\n    *   它们根据预设法律自动执行交易。\n    *   这些交易的加密文档在参与者之间分发。\n\
  \    *   合约信息和条款是直接的。\n    *   它们经过每个人的特定验证。\n    *   工作的不可篡改性保证了不会被破坏。\n*   **安全性**：由于所有操作都经过记录和验证，智能合约也被认为可以提供更好的安全性。这是因为它是加密的，这使其极难被破解。\n\
  \n# 智能合约面临的挑战\n\n智能合约面临许多阻碍大规模采用的挑战：\n\n*   **人为错误**：与纸质合同类似，智能合约仍可能由于人为错误出错。由于智能合约是代码，而这些代码是由人编写的，因此存在漏洞。它们可能会被延迟、拦截和损坏。某些错误已被证明是非常昂贵的。\n\
  *   **机密性、安全性和隐私**：与传统合同不同，通过智能合约执行的所有交易都在网络中的所有节点中传播。\n*   **隐私问题**：当账户与已知实体相关时，可能会产生隐私问题。即使双方依赖伪匿名账户，某些识别技术也可以识别与特定智能合约交易的身份。\n\
  *   **缺乏工程经验**：随着智能合约的激增，需要新型密码学专家和取证专家来验证软件代码并将其转换为人类可读的形式。制作完美的智能合约需要大量的工程知识。然而，经验丰富的程序员难以寻找且成本高昂。\n\
  *   **法律和监管挑战**：还有许多法律和监管挑战正在阻止智能合约的广泛利用。智能合约缺乏明确的法律地位，没有官方政府监管适用于它们。\n*   **解释和执行性**：如果对智能合约是否准确记录了双方意图或一方是否违约产生争议，双方可能仍进行法律诉讼或参与替代性纠纷解决。智能合约的可执行性取决于司法管辖区的法律差异。\n\
  *   **管辖问题**：智能合约还引发了管辖问题。但由于区块链作为去中心化账本运行，智能合约可以在全球范围内形成和访问。它们不存在于任何单一地点，而是同时存在于多个地点。然而，现有法律是基于管辖区的。\n\
  \n## 结论\n\n我们学习了 Fabric 是一种实现和运行许可区块链的模块化且可扩展的开源架构。这后来被扩展为 Hyperledger。\n\n\n\n\n\
  区块链存储状态和账本数据，执行交易并运行被称为 `chaincode` 的程序。我们已经学习了 Hyperledger Fabric 网络的各种组件：`Assets`（资产）、`Shared\
  \ Ledger`（共享账本）、`Smart Contract`（智能合约）和 `Peer`（节点）节点。我们还学习了编写区块链应用以及 `PKI` 的要素。此外，我们讨论了\
  \ Hyperledger Fabric 策略及其类型。另外，我们学习了数字证书以及从 `Certifying Authority`（认证机构）获取 `DSC`\
  \ 的过程。\n\n在下一章中，我们将学习 `Blockchain Interoperability`（区块链互操作性）、其需求以及用例。\n\n## 参考文献\n\
