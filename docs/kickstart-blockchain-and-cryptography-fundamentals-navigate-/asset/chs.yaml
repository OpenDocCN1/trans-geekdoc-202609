  \n# 第 2 章\n\n## 加密哈希函数\n\n## 引言\n\n加密学在区块链中用于使消息传输变得非常秘密和安全。为了这个目的，使用了哈希函数，它通过数学函数和随机概率使脚本变得复杂。我们将在本章学习所有内容。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 加密哈希函数 (CHF)\n* 随机数 (Nonce)\n* 单向哈希简介\n* 哈希指针和 Merkle\
  \ 树（哈希树）\n* 数字签名\n* 公钥加密或非对称加密\n\n### 加密哈希函数简介\n\n希腊术语“cryptography”最初的意思是“秘密写作”。加密货币的历史可以追溯到学术和军事用例，这些用例最终被用于私人通信。\n\
  \n值得注意的是，符号 `#`（在信息技术中被称为 `hash`）大多数时候用于显示任何项目的编号或计数，但在现代数字加密学中，它被用于加密消息，反之亦然。\n\
  \n为了形成数据的一个按时间排序的单一真相来源，区块链存储加密的数据块，这些数据块在区块链技术中被链在一起。由于数字资产是通过分布而非复制或传输来创建不可篡改记录的，因此创建的资产是去中心化的，允许完全实时访问，从而对使用它的公众是透明的。这种变更账本的透明性维护并保护了文档的完整性，为用户对资产的信任。\n\
  \n区块链系统提供的固有安全措施，加上其作为公共账目的特性，使其成为几乎每个行业的首选技术。因此，区块链是一项充满前景且无疑是革命性的技术，因为它有助于 (i)\
  \ 降低风险，ii) 消除欺诈以及 (iii) 提高透明度。因此，它是可扩展的，并以许多方式用于无数用途。\n\n哈希函数的作用是将随机输入的数据（`keys`）转换为具有固定长度和结构的字节字符串\
  \ `hash value`。在 `[图 2.1]` 中，加密的哈希消息每个案例都包含 10 个字节。加密哈希函数从任何长度的数据记录（如左所示）生成固定长度的字符字符串。任何块的数据记录都可以是一个\
  \ `word`、一个 `sentence`、一段 `longer text` 或整个一个文件。\n\n哈希函数已成为加密安全的支柱。哈希提供了一种易于识别区块链上交易的方法。\n\
  \n![](img/Figure-2.1.jpg)\n\n**图 2.1：**文本生成的哈希函数\n\n哈希提供了一种易于识别区块链上交易的方法。\n\n采用\
  \ `timestamp` 来证明数据存在已发布。每个区块包含：\n\n* 上一个区块的 `Cryptographic hash`\n* `timestamp`\n\
  \n区块链系统提供的固有安全措施，加上其作为公共账目的特性，使其成为几乎每个行业的首选技术。因此，区块链是一项充满前景且无疑是革命性的技术，因为它有助于 (i)\
  \ 降低风险，ii) 消除欺诈以及 (iii) 提高透明度。参与这一运动的研究人员和其他称自己为“密码朋克”（cypherpunks），并自 20 世纪 80\
  \ 年代后期以来提倡向更大的隐私和控制转变。\n\n### 哈希 (Hashing)\n\n哈希简单意味着将某些数据通过产生结果的公式，该结果被称为 `hash`。无论你输入多少数据，任何创建的哈希通常都具有相同的\
  \ `length`。\n\n`hash rate`（哈率）是衡量区块链网络、群体或个人计算能力的指标。`hash rate` 取决于每秒进行多少猜测。生成加密哈希是为了保护公共网络上传输的数据。\n\
  \n### 矿工 (Miners)\n\n比特币矿工下载区块链的完整历史并将有效交易组造成区块。如果组装的交易区块被其他矿工接受并验证，那么矿工将获得 `reward`。\n\
  \n交易手续费为比特币矿工参与这一过程提供了另一种激励。\n\n目前，`Antminer S19 Pro-ASIC` 是最好的比特币挖矿硬件解决方案之一。该硬件还可以用于挖掘其他\
  \ `SHA-256` 加密货币。该硬件的优势如下：\n\n* 最高哈率\n* 效率和功耗\n* 据说它定期产生大约 $12，电力成本为 $0.1/千瓦时。\n\
  \n以太坊以 `750.00 MH/s` 的挖矿哈率消耗 `1350.00 watts` 的功率，价格为每千瓦 $0.10，区块奖励为 `2 ETH`。\n\n\
  在继续之前，让我们学习一些定义：\n\n* **hash rate** 是衡量区块链网络、群体或个人计算能力的指标。`hash rate` 取决于每秒进行多少猜测。\n\
  * **Hashing power**（又称为 `Hash power`）是你的计算机或硬件用于运行和解决不同哈希算法的功率。这些算法用于生成新的加密货币并允许它们之间进行交易。这一过程被称为挖矿。\n\
  \n\n\n\n\n- `Mining difficulty`（挖矿难度）是比特币等加密货币挖掘过程中使用的测量单位，指的是为每个区块找到正确哈希值的难度和所需的时间。\n\
  - `ETH` 是以太坊的缩写。\n\n以下是最流行的（2022 年）比特币矿机列表：\n\n1. Antminer S19 Pro\n2. Antminer\
  \ T9+\n3. Minedollars\n4. AvalonMiner A1166 Pro\n5. WhatsMiner M30S++\n6. AvalonMiner\
  \ 1246\n7. WhatsMiner M32-62T\n8. Ebang EBIT E11++\n9. Bitmain Antminer S5\n10.\
  \ DragonMint T1\n\n表 2.1 显示了前六名比特币矿机硬件列表及其算力和所使用的算法：\n\n| 比特币矿机硬件 | 算力 | 挖掘的算法/加密货币\
  \ | 价格 |\n| :--- | :--- | :--- | :--- |\n| Antminer S19 Pro | 110 Th/s | SHA-256\
  \ | $2,860 |\n| AvalonMiner A1166 Pro | 81ST/s | SHA-256 | $1,550 |\n| Minedollars\
