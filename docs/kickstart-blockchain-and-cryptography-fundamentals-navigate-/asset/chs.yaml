- "# 区块链与密码学基础入门：掌握现代区块链、密码学、智能合约与 Hyperledger 复杂机制，驱动现实世界转型\n\n\n\n\n\n\n![](img/line.jpg)\n\
  \n\n![](img/line.jpg)\n\n\n![](img/logo.jpg)\n\n\n\n\n\n\n\n\n\n# 献给\n\n献我的妻子 Heera\
  \ Jain，感谢她在本书编写期间在许多方面提供的日日夜夜的支持。\n\n# 关于作者\n\n![](img/ata.jpg)\n\n**V.K. Jain 教授**于\
  \ 1966 年毕业于博哈尔的 Azad 技术学院（MACT），获得电气工程学位。他于 1968 年在 MACT 和 BHEL（博哈尔重型电气设备）完成了重型电气设备设计与生产专业的\
  \ `M.Tech` 学位。这门以行业为导向的课程是在 1968 年在联合国教科文组织的赞助下在乌贾因的维克拉姆大学举办。他被分配到 BHEL 的电子应用工程部门。\n\
  \n他提交了一篇题为“使用快速响应积分器型 AVR 分析大型水力发（15 MW）速度和励磁调节系统的性能分析”的论文。该研究重点是在印度顶尖机构之一的坎普尔理工学院（IIT），通过模拟和数字计算机从电子控制系统的角度（基于奈奎斯特准则）研究电力系统。他早在\
  \ 1968 年就在坎普尔理工学院亲自编写了一个使用 `FORTRAN IV` 的数字计算机程序，并在当时印度最快的计算机 `IBM 7044 主机`上进行了编译。\n\
  \n他于 1968 年 5 月 20 日通过印度联邦公共服务委员会举行的中央电气工程服务（现称为 `IES`）全印度竞争性考试以电气工程师身份加入公共工程部（CPWD），并在\
  \ CPWD 服务了 35 年。\n\nV.K. Jain 教授是一位知名的实践型工程师，在工程、管理和计算机科学领域编写了 125 多本书。他因其以下书籍而尤为盛名：\n\
  \n1. 现代加密学\n2. 信息技术（面向图书员）\n3. 软件测试与分析\n4. 大数据与 Hadoop\n5. 数据科学与分析\n6. 机器学习与深度学习\n\
  7. 物联网\n8. 人工智能\n\n# 致谢\n\n我想感谢几位个人，感谢他们在本书编写期间向我提供的持续不断的支持。\n\n# 前言\n\n加密货币是一种由加密技术保护的数字货币，这使其难以伪造或双重花费。加密货币作为货币的新新形式出现，它是去中心化的，这意味着它不受任何银行等中央机构的控制。\n\
  \n最流行的加密货币是比特币，它由一个名为 Satoshi Nakamoto 的匿名个人或团体在 2009 年创建。比特币是第一种加密货币，并为许多其他货币铺平了道路。从那时起，出现了许多其他加密货币，如以太坊、莱特币和瑞币。\n\
  \n加密货币有多种用途，包括支付、投资和投机。它们还被构建新的应用程序，例如去中心化金融（DeFi）和去中心化自治组织（DAOs）。\n\n加密货币背后的技术——区块链仍在演变中，未来具有巨大的创新潜力。本书将提供加密货币和区块链技术的全面概述。\n\
