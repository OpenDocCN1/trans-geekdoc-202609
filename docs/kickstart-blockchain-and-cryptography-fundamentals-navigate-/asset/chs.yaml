  \n# 评价\n\n请留下您的评价。在您阅读并使用这本书后，为什么不在购买网站上留下评价呢？潜在的读者可以参考您的公正意见做出购买决策。Orange Education\
  \ 非常想知道您对产品的看法，我们的作者也可以从您的反馈中学习。感谢！\n\n，我们将学习区块链技术的基本概念及其原理，包括不同类型的账本以及公共账本与传统账本系统之间的区别。然后，我们将讨论比特币、智能合约以及构成区块链基础的构建区块。我们将学习交易类型、分布式共识以及区块链的许可模型。最后，我们将探讨安全性、优缺点以及区块链技术的演进。\n\
  \n\n\n*   智能合约\n*   交易类型\n*   区块链的优缺点\n\n## 区块链技术简介\n\n`Blockchain` 技术简单的定义是：`去中心化的分布式账本`，它记录了数字资产的所有属性、所有权和来源（溯源）。目前区块链是基于互联网的，所有数据/信息都保存为多个区块组成的链。由于其内在设计，存储在区块链上的数据以后无法被修改，这使其成为`支付、网络安全和医疗保健`等行业的合法变革者。\n\
  \n区块链技术被认为是分布式账本技术（DLT）。在实际应用中，区块链使得：\n\n*   任何数字资产的历史都是不可篡改的\n*   通过去中心化和加密哈希处理实现透明化\n\
  \n我们可以将其类比为使用 Google Docs 的操作。当我们在 Google Docs 中创建一个文档并与一群人共享时：\n\n*   文档是分发的而不是被复制或传输的。这相当于创建了一个去中心化的分发链，让每个人都能同时访问该文档。\n\
  *   此外，没有用户（某一方）会因为等待另一方的更改而被排除在操作之外。对文档的所有修改都在实时记录，使更改完全透明。\n\n区块链是：\n\n*   一个没有任何中心化控制和管理员（按国家或地区划分）的交易来源，但费用极低。\n\
  *   一种共享的分布式账本技术，以公共或私有的防篡方式以数字形式维护所有所需`交易、资产、加密货币或财产`的记录。\n*   一种点对点（即主对主）基于互联网的网络，分发到网络中的所有成员节点，每个节点都拥有平等的权利。\n\
  *   一个在由加密哈希链接的区块构成的顺序链中永久维护记录的账本。\n*   一种系统，在区块链网络的设定的限制内，无限数量的成员只能查看与他们相关的交易。\n\
  *   一种防篡包装，可提醒消费者产品是否被恶意破坏或损坏。当防篡包装因试图拆除或操纵而触发时，它会留下这些行为的证据。任何潜在消费者都会被提醒产品已被篡改，且不安全。\n\
  \n“区块链”一词源于这样一个想法：每个交易区块一旦通过验证和确认，就会连接到链开始处的后续区块。区块的分布式账本在节点之间交换。区块链作为数据库，以电子方式数字持有数据。它对加密货币系统（包括比特币）内业务数据的安全和分发做出了重大贡献而受到认可。\n\
  \n点对点（P2P）网络是一种网络系统，其中一组计算机连接在一起，在处理数据方面具有平等的权限和责任。与互联网上部署的传统客户端-服务器网络相比，P2P 网络中没有设备被指定专门用于提供或接收数据。\n\
  \n\n\n\n我们需要理解，区块链是一种共享数据库，其中数据存储在区块中，然后通过加密技术将这些区块连接在一起，通常运行在互联网上。\n\n当新数据进入时，它会被输入到一个新的块中。一旦块被填满数据，它就会链到上一个块上，使得数据按时间顺序链在一起。这在“区块链的工作原理”章节中会有进一步阐述。\n\
  \n区块链的名称源于这样一个事实：所有已确认并验证的交易块从链的开始到最当前的区块都是相互链接并链在一起的。\n\n区块的分布式数据库在计算机网络的节点之间共享。作为一种数据库，区块链以数字格式以电子化方式存储信息。区块链目前广为人知的是它们在加密货币系统（如`Bitcoin`）中起着关键作用，用于维护安全且去中心化的交易记录。\n\
  \n区块链技术被设计成一系列被称为区块（或其他块）的机密数据链。这条链特意以去中心化的方式通过网络进行传输。区块链这种数据结构本质上被设计为不可逆的数据时间线。\n\
  \n每当收到新数据时，就会被添加到新块中。一旦块被填满数据并附加到前一个块上，数据就会按时间顺序链在一起。所有通过标准数据库链接引用远程服务器的数据库应用程序都会在`local\
  \ database`和`remote database`之间建立连接。在区块链应用中，它仅仅是一种新型数据库，其数据存储方式与传统数据库（`SQL`或`NoSQL`，后者由单一实体控制）不同。相反，在智能合约或任何加密货币应用中，区块链可以由一组互不信任的方共享，而不需要`central\
  \ administrator`。\n\n为了让其他节点有效处理和利用存储库中的用户数据，数据会被转换为开放数据格式并通过区块链流进行共享。智能合约在确认并执行了约定的数据使用条款后，将用数字代币奖励用户。去中心化的理念是所有用户共同维护控制权，而不是由任何个人或团体拥有该权限。由于这些去中心化区块链中的每一个都是不可篡改的，任何输入的数据都无法撤销。这意味着涉及`Bitcoin`的交易是公开可见并永久记录的。\n\
  \n由于`Bitcoin`构建在公共账本——区块链之上，因此您的加密钱包地址是对所有人可见的。账本（即区块链）存储在参与网络的每台计算机（节点）上。因此，没有管理一切的中心枢纽，它是一个无法在特定点关闭的去中心化网络；它无法被“静音”。\n\
  \n# 区块链架构\n\n*   与其他数据管理系统一样，区块链系统由硬件、软件和协议组成。\n*   区块链硬件由特殊的计算机组成，用于执行网络共识规则。\n\
  *   区块链协议制定了治理网络及其参与者的规则集。根据`Bitcoin`白皮书，这基于`proof-of-work`（工作量证明），其中一个`CPU`等于一票，以激励诚信活动。\n\
  *   区块链软件提供了交易处理器与协议规则集之间的桥梁，将工作传递给网络的其他部分。\n\n![](img/Figure-1.1.jpg)\n\n**图 1.1:**\
  \ 区块链\n\n# 区块链原理\n\n根据麻理工科技评论》（MIT Technology Review），利用区块链的核心在于实现各方之间安全且不可更改的数据共享，特别是对于那些互不信任的人。区块、节点和矿工是区块链技术中的三个核心概念。\n\
  \n## 区块\n\n每条链由多个区块组成，每个区块都有三个基本组件：\n\n*   区块数据\n*   一个`nonce`，这是一个 32 位的整数。当创建区块时，`nonce`是随机生成的，从而产生区块头哈希\n\
  *   `nonce`和一个`256-bit`整数构成了哈希值。哈希值以大量的零开头（也就是说，它需要变得非常微小）。\n\n`nonce`在链中第一个区块创建时产生加密哈希。在它被挖矿之前，区块中的数据被视为已签名，并永久与`nonce`和`hash`绑定。在加密通信中只能使用一次的任意数字被称为`nonce`，是“number\
  \ once”（一次性数字）的缩写。\n\n然而，为了防止之前的通信被用于重放攻击，身份验证协议经常会分配一个随机数或伪随机数。一个名为`Nonce`的 32\
  \ 位（4 字节）字段由矿工随机分配一个整数，这使其适用于对区块值进行哈希处理。\n\n在密码学中，`nonce`是一个用于通过防止重放攻击来保护私有通信的数字。`Authentication\
  \ protocols`为通信附加一个数字，出于安全考虑，这些数字必须是`random or pseudo-random`的。`nonce`是添加到区块链中加密区块中的数字，当重新哈希时，它满足`difficulty\
  \ level limitations`。`nonce`是数字矿工正在求解的数字，当找到解决方案时，区块链矿工将获得加密货币作为回报。\n\n为了防止攻击者在不同语文中重放请求，`nonces`被用于使请求变得唯一。攻击者获取`nonce`并没有区别；其核心思想是他们无法使用数据，因为数据包含了`nonce`。每个`Ethereum`交易都有一个唯一的`nonce`。从特定地址发送的交易总数被称为`nonce`。每次发送交易时，`nonce`都会增加\
  \ 1。`nonce`用于执行有关有效交易的规则。\n\n一个完美的`nonce`是时间，例如 2012 年 1 月 18 日下午 5 点 13 分 12 秒只能发生一次。`nonce`的读音与“nonsense”中的“nons”相同，但它实际上是一个英语单词，意为“当前或特定场合”。\n\
  \n`nonce`是以区块链等平台用于排序和组织交易的方法。它是密码学中用于通过防止重放攻击来保护通信的数字。身份验证协议为通信附加数字，出于安全目的，这些数字必须是`random\
  \ or pseudo-random`的。`Nonce`的概念将在本书的[第二章，加密哈希函数（CHF）]中讨论。\n\n在发送成功挖矿的交易后，您的账户会将一个名为`nonce`的值加一。这个`nonce`记录了随时间推从特定地址发送的交易次数。\n\
  \n`nonce`是`Ethereum`交易中最重要且最不被理解的部分之一。\n\n## 节点\n\n\n\n\n\n要在任何区块链应用中进行通信，去中心化是区块链技术的核心思想之一。链不能由某台计算机或一个组织所有。相反，它通过链上的节点作为分布式账本运行。任何保留区块链副本并保持网络运行的电子设备都可以被称为节点。区块链允许轻松地检查和查看每笔账本交易，因为它是透明的。每个参与者都会获得一个显示其交易的个人字母数字数字识别码。每个节点都有一份区块链副本，为了更新、信任并验证该链，网络必须通过算法批准每个新挖掘的区块。将区块链的公开信息与制衡机制相结合，有助于维护区块链的完整性并培养用户信任。从本质上说，区块链只是信任在技术上的扩展。\n\
  \n# 矿工\n\n必须使用某种形式的数据挖掘来获取加密货币，或者出于这个原因，使用任何区块链技术。挖矿是矿工向链中添加新区块的过程。在区块链中挖掘区块是困难的，特别是在长链上，因为每个区块都有唯一的\
  \ `nonce` 和 `hash`，并且引用了链中前一个区块的 `hash`。矿工使用专门的软件解决定位产生被接受的 `hash` 的 `nonce` 这一极其困难的数学问题。在找到正确的组合之前，有约四十亿可能的\
  \ `nonce-hash` 组合需要被挖掘，因为 `nonce` 只有 32 位，而 `hash` 是 256 位。矿工被认为在那个点发现了“黄金 `nonce`”，他们的区块被附加到链上。区块链技术非常难以操纵，因为要对链中之前的任何（区块中的）数据进行简单更改，必须重新挖掘所有后续区块，而不仅仅是发生更改的区块。可以将其视为“数学安全”，因为寻找黄金\
  \ `nonce` 的过程需要大量的时间、计算力和电力。当区块成功挖掘且网络所有节点都接受更改时，矿工将获得财务补偿。这在 `图 1.2` 中以图示所示。\n\n\
  ![](img/Figure-1.2.jpg)\n\n**图 1.2:** 比特币传输的全过程\n\n区块链中有两种节点：`full node` 和轻量节点。\n\
  \n全节点是需要拥有整个区块链副本的节点，因此区块链上发生过的每笔交易和区块都必须下载。\n\n轻量节点通过简化支付验证（SPV）确认交易。这种方法允许节点检查交易是否已添加到区块中，而无需下载整个区块链。全节点通过促进轻量节点连接网络并告知它们任何相关交易来支持轻量节点。轻量节点只需要下载区块链的区块头，这意味着其下载和存储需求远低于全节点。\n\
  \n比特币挖矿的合法性完全取决于你的地理位置。比特币的概念威胁了所有当前法币货币的主导地位，因此也威胁了政府对金融市场的控制。由于这个原因，比特币挖矿在某些地方是完全非法的。\n\
  \n![](img/Figure-1.3.jpg)\n\n**图 1.3:** 区块链的特征\n\n然而，并非所有的“区块链”实际上都是区块链。某些所谓的“区块链”只是私有和许可的账本，它们不能保证不可篡改性。\n\
  \n| **非真实区块链** | **真实区块链** |\n| --- | --- |\n| 某些所谓的“区块链”只是私有和许可的账本，不能保证不可篡改性 |\
  \ 真正的区块链应该以分布式方式维护并公开可验证，这有助于（结合工作量证明）确保其不可篡改性 |\n| 特定技术（如 `DLT`）没有具有加密链接的、排序的交易区块\
  \ | 真正的区块链应该记录按时间排序的业务事件（支付或数据交易），并通过此类交易的加密链接区块对它们进行安全保护 |\n\n**表 1.1:** 真实区块链与非真实区块链的区别\n\
  \n## 公共账本\n\n区块链是公共账本的一种形式，是一系列区块（或链），在经过指定参与者适当的身份验证和验证后，在区块上记录交易详情。区块链支持不可篡改性，这意味着数据一旦写入就无法被删除或替换。不可篡改性的概念意味着网络内部无法进行数据篡改。传统数据库不具备不可篡改性，因此更容易被违规管理员或第三方黑客操纵。\n\
  \n分布式账本利用被称为节点的独立计算机在它们的电子账本内记录、共享和同步交易，而不是像传统账本那样将数据中心化。这些账本将数据组织成区块，并以仅追加的方式链接在一起。这项技术具有变革金融部门的潜力，使其更高效、更有韧性和更可靠。\n\
  \n从本质上说，区块链和分布式账本技术（`DLT`）是在互联网上创建和传输价值的基础。它们允许点对点地记录交互并传输这种价值，而不需要中央协调实体。这种价值可以包括资产的所有权，如货币、证券、土地证、投票权和艺术品，以及身份和健康记录等个人信息的所有权。这给金融领域带来了持续挑战，并改变了金融部门利益相关者的角色。`DLT`\
  \ 有潜力变革许多其他部门，例如制造业、政府财务管理系统和清洁能源。\n\n由于这项技术仍处于处于阶段，世界银行集团对其在国际开发中的应用还没有通用建议。我们正在与标准制定机构、政府、中央银行和其他利益相关者对话，监控、研究和试点基于区块链和\
  \ `DLT` 的应用。\n\n## 分布式账本\n\n分布式账本（见 `图 1.4`）是一种新型数据库，去中心化网络的成员对其共享、复制和同步。分布式账本跟踪所有网络参与者的交易，包括资产和数据的交换。账本记录的更新由所有潜在网络参与者的共识决定。不涉及清算所、金融机构或其他中央机构或第三方中介。由于分布式账本是所有交易的可审计且不可更改的记录，每条记录都有时间戳和网络中独特的加密签名。\n\
  \n区块链的分布式账本技术正在改变组织进行业务交易的方式。\n\n![](img/Figure-1.4.jpg)\n\n**图 1.4:** 分布式账本与传统账本的概念\n\
  \n## 业务账本\n\n\n\n\n\n在当今互联且集化的世界中，经济活动发生在跨越国家、地理和司法管辖边界的业务网络中。当生产者、消费者、供应商、合作伙伴、市场制造者/促进者以及其他利益相关者拥有、控制并行使对被称为资产的贵价值对象的权利、特权和权益时，他们就形成了业务网络。股票证书、专利和契据等无形虚拟资产可能与汽车、房屋和草莓等有形资产一样价值。业务网络中的价值是由涉及资产所有权转移的交易创造的。参与交易的所有方，包括买家、卖方和中间机构（银行、审计师或公证员），都有记录在账本中的合同和业务协议。企业通常使用多个账本来记录其不同业务线参与者之间的资产所有权和转移。企业财务运营和追求的记录系统被称为账本。\n\
  \n资产可以是实体的物理性的，例如汽车、房屋或草莓；也可以是无形虚拟的，例如契据、专利和股票证书。资产所有权和转移是在业务网络中创造价值的交易。\n\n交易通常涉及各种参与者，如买家、卖方和中间机构（如银行、审计师或公证员），他们的业务协议和合同记录在账本中。企业通常使用多个账本来跟踪其各业务线参与者之间的资产所有权和资产转移。账本是企业经济活动和利益的记录系统。\n\
  \n一个典型的账本可能像这样：\n\n![](img/Figure-1.5.jpg)\n\n**图 1.5:** 典型的账本\n\n## 传统业务账本的问题\n\
  \n当前现代业务账本采用的方法在许多方面存在缺陷。它们可以被滥用和操纵，而且成本高昂且效率低下。缺乏透明度以及对欺诈和腐败的脆弱性导致了争议。解决争议以及可能反转交易或提供交易保险是一个昂贵的过程。这些风险和不确定性导致了业务机会的流。此外，每个网络参与者系统上不同步的业务账本副本，导致了基于错误和临时数据的误导性业务决策。调和不一致的账本副本最多会导致做出充分信息决策的能力出现延迟。\n\
  \n## Hyperledger\n\nHyperledger 是一项旨在推动用于业务的跨行业区块链技术的开源工作。它是一项全球协作，由 Linux 基金会（The\
  \ Linux Foundation®）托管，包含了金融、银行、物联网、供应链、制造业和技术领域的领导者。这 183 多个多样化的成员和九个正在进行的项目（包括\
  \ `Hyperledger Fabric`）协同工作，旨在创建一个开放、标准化且企业级的分布式账本框架和代码库。\n\n为了使其有效，Hyperledger\
  \ Fabric 框架支持许可网络上的分布式账本解决方案，在这些网络中，跨行业的成员是彼此相知的。其模块化架构最大化了区块链解决方案的机密性、韧性和灵活性。\n\
  \n我们将在本书的[第 8 章]详细介绍 Hyperledger 和 Hyperledger Fabric 框架。\n\n## 区块链去中心化\n\n考虑一种场景：一个企业拥有由\
  \ 10 台服务器组成的服务器农场。去中心化网络由单个节点控制……这对客户拥有控制权。在这种情况下，它提供了便利。但仍有各种风险需要考虑：\n\n1. 如果供应突然失败了怎么办？\n\
  2. 如果其中一个中断了，该如何处理？\n3. 如果一个被删除了，该如何恢复？\n4. 如果一个被损坏了，状态会如何？\n\n为了解决这个问题，去中心化网络促进了存储在那里的数据。例如，如果恶意行为者更改任何内容，将不会影响。为了批准这一点，权力必须在多数手中。共识机制，如工作量证明（`PoW`）或权益证明（`PoS`），确保了区块链停止欺诈交易。当没有单个节点控制时，这些机制仍然能够实现共识。\n\
  \n## 透明性\n\n由于比特币区块链的去中心化本质，每个节点都有链的副本，当新区块添加并确认时副本就会更新。这意味着任何人都可以使用个人节点或允许任何人的区块浏览器透明地查看所有交易。这意味着如果你愿意，你可以追踪比特币的每一个行踪。例如，过去曾发生过针对交易所的黑客攻击，持有比特币的用户损失了一切。被提取的比特币可以被追踪，尽管黑客可能保持完全匿名。在任何情况下，如果这些黑客攻击中盗取的比特币被转账或花费，将是公开的。自然，记录在比特币区块链（以及大多数其他区块链）上的记录是加密的。这意味着只有所有者才能（使用私钥对）对记录进行解密以显示其身份。因此，区块链用户可以在保持匿名的同时维持透明度。\n\
  \n## 比特币\n\n![](img/Bitcoin-Picture.jpg)\n\n比特币 (₿) 与许多其他区块链货币一样，是一种没有单一管理员（中央或储备银行）的去中心化数字货币。它可以在点对点比特币网络上的用户之间传输，无需中间机构。交易通过加密技术由网络节点验证，并记录在名为区块链的公共分布式账本中。\n\
  \n加密货币是由名为中本聪聪托（Satoshi Nakamoto）的匿名个人或团体于 2008 年发明的。比特币实现作为开源软件发布时开始使用。截至 6 月 13\
  \ 日下午 1:22，一个比特币约等于 56,65,129.18 卢比，而 2022 年 2 月 16 日为 29,86,942.83 卢比。\n\n\n\n\n\
  2008 年的美国金融危机导致许多人对银行作为该国受信任的第三方的身份失去了信任。这种情况在印度的许多银行也发生了。许多用户和潜在投资者都产生了怀疑，并质疑银行是否是全球金融系统的最佳守护者。大型银行的错误投资决策被证明是灾难性的，并产生了连锁反应。同样于\
  \ 2008 年提出的比特币提供了一种替代方案。\n\n比特币是一种基于区块链技术的“点对点（每个节点对许多其他节点具有平等的权限和特权）电子现金系统”，该系统“允许在线支付直接从一方发送到另一方，而无需通过金融机构”。\n\
  \n# 比特币的可信度\n\n比特币使得没有“受信任中介”的数字交易成为可能。这项技术使得这种交易能够在全球范围内大规模发生，由加密学承担了曾经由金融监管机构、中央银行和商业银行执行的功能：确认交易的有效性并维护底层资产的完整性。由于账本不受信赖第三方的控制，比特币是一个去中心化的公共账本。任何拥有比特币的人都可以发送和接收比特币、使用该网络，如果他们愿意，还可以保留此账本的副本。在这方面，账本是透明的且“无需信任”的。新加入的参与者做到这一点是可行的。一种资产由比特币账本跟踪和维护，即比特币。\n\
  \n（注：小写的“bitcoin”指的是比特币账本上的货币或账户单位，而大写的“Bitcoin”指的是比特币账本或协议）。我们将在本书第`Chapter 3`\
  \ 的“比特币的创建”章节中介绍有关获取比特币的过程。\n\n以下规则使其更加受欢迎和值得信赖：\n\n*   账本的维护取决于编码在其中的几条规则，这些规则必须被遵守；其中一条规定了世界上只会产生\
  \ 2100 万个比特币。由于对流通比特币数量的这种限制（上限），加密货币被设计为抵抗由于稀缺性不足导致的通货膨胀。没有机会随心所欲地创建更多比特币降低货币的总价值。它目前价值\
  \ 63 亿卢比或 6.3 Peta（即 10⁹）卢。\n*   比特币系统非常重要的一个方面是，所有参与者必须同意账本规则才能使用它。\n*   任何参与者都被分配到该网络的一个单一专用节点。比特币在政治上是去中心化的——没有单一实体运行比特币——但所有参与者（节点）对账本的状态及其规则达成共识。这被称为共识。\n\
  *   比特币或交易无法被更改、删除、复制或伪造。\n*   此主题在本书的 `Chapter 3` 中有进一步阐述。\n\n比特币是第一种基于区块链的数字货币，由全球各地的数百万人挖掘。比特币的匿名创建者中本·中聪（Satoshi\
  \ Nakamoto）创建了它的去中心化系统，使任何人都可以使用它，但没有人能拥有它。巧合的是，比特币交易理论上应该是匿名的，尽管它们对所有人都是开放的。2009\
  \ 年创建比特币的目标是创建一种可以在几分钟内传输的全球电子货币。然而，得益于某些特性，比特币也充当了价值存储和支付网络。大银行甚至华尔街最初被比特币价格的指数级增长所吸引。\n\
  \n在所有加密货币中，比特币的所有权集中度最低。前 100 名比特币持有者仅控制总供应量的 17.3%，而在以坊（Ether）中，前 100 名投资者控制了所有发行货币的\
  \ 40%。对于其他基于区块链的货币如 `Gnosis`、`Storj` 和 `Qtum`，大股东控制了 90%，而且他们都是这些项目团队的成员。行业观察人士估计，也许大约\
  \ 1,000 名用户持有 40% 的比特币。\n\n我们可以想象他们在市场中存在的价值。由于加密货币的生存能力取决于其网络规模，比特币的价值是美国航空的四倍，是\
  \ Uber 的两倍。不用说，比特币的创始人现在是世界上第 15 位富豪（例如在 2021 年）。\n\n中聪拥有 750,000 到 1,100,000 个比特币。截至\
  \ 2021 年 11 月，他的净值高达 730 亿亿美元，这使他成为世界第 15 位的富豪。\n\n持有大量比特币的人在行业内被称为“鲸鱼”。这些鲸鱼在比特币被嘲笑的先驱时代一直持有它，并彼此认识多年。最大的比特币交易所是门头哥（Mt.\
  \ Gox），它已被宣布破产。几年前，基于区块链的比特币交易所门头哥发生了毁灭和崩溃。当它申请破产时，由于代码问题，大量比特币从账户中消失了。\n\n在讨论技术问题时，中聪从未披露过个人信息，但偶尔会分享对银行和部分准备金制度的观点。根据他在\
  \ 2012 年在 P2P Foundation 的简介，中聪称自己是一个居住在日本的 37 岁男性。然而，由于他流利的英语写作，一些专家怀疑他的日本国籍。\n\
  \n有人猜测中聪可能是一个团队而不是个人。审查过比特币代码的安全研究人员丹·坎明斯基（Dan Kaminsky）暗示中聪可能是一个“团队”或者一个“天才”。\n\
  \n众所周知，中聪直到 2010 年年中一直与其他开发者合作开发比特币软件，并亲自管理所有代码修改。随后，他将代码库的控制权和网络警报交给了加文·安德森（Gavin\
  \ Andresen），将相关域名转交给比特币社区成员，并停止了对项目的公开参与。\n\n尽管如此，比特币底层的区块链技术使得创建一个每个用户都知晓过去的独特数字资产成为可能。适用于任何市场的供需规律也适用于比特币，这意味着它的价值并非内在的。比特币的价格与需求的增长成正比。资产的价值是由其内在价值决定的。这种衡量并不是利用资产当前的市场价格，而是通过客观计算或复杂的财务模型得出的。在许多因素中，机构投资者的组合组合、零售投资者买入热门资产以及对比特币去中心化哲学的支持者都可能是推动需求的驱动力量。最终，投资者的情绪以及用户是否继续发现比特币的价值，将决定它是否被视为“泡沫”。虽然不是保证，但崩溃随时可能。到\
  \ 2021 年 10 月底，比特币的总市值将达到 1 万亿美元。\n\n\n\n\n\n加密货币资产价格历史上最大的跌幅之一是由于 2020 年 3 月 COVID-19\
  \ 引发的全球市场崩盘造成的。在此期间，比特币的价格在单日内暴跌了近 50%。然而，在随后的几个月里，随着投资者在波动市场中寻求价值存储手段，价格随着黄金和其他贵金属等避险投资而上涨。到\
  \ 2021 年 4 月，比特币的价格已从一年多年前的低点增长了 16 倍，超过了 64,000 美元。此外，可以说，一些分析师认为 COVID-19 可能通过增强“加密货币是避险资产”的理念来增加对比特币的需求。世界上其他相似但最受欢迎的加密货币如下：\n\
  \n比特币的两个最大竞争对手是 `Ethereum` 和 `Darkcoin`（现 Dash）。\n\n毫无疑问，作为仅次于比特币著名的加密货币，`Ethereum`\
  \ 运行在区块链的独特协议上。以太坊不仅发行货币，还允许程序和平台运行在其之上。如 `ConsenSys` 等公司已与 `Microsoft` 合作开发以太坊应用程序。随着该技术的机构不断增加，区块链技术将无处不在。\n\
  \n作为比特币的竞争对手，这种新的支付方法需要比竞争对手更快、更安全且更易用以吸引用户。在这三项标准上，比特币和其他其他数字货币都表现逊色。`Dash` 提供了解决这些问题以及大多数其他货币未解决的缺陷特征功能。此外，Dash\
  \ 为用户提供了快速发送选项，就像使用信用卡一样简单。此外，任何未来的项目都必须提交给拥有 1,000 个或更多硬币的人进行投票。这种系统的优势是作为一个去中心化网络，能够实现快速决策并防止像比特币那样的冲突——比特币缺乏强制用户采用新版本的能力。Dash\
  \ 即将推出的版本将具有受控交易等功能，以防范欺诈和盗窃。在此类功能的帮助下，资金只有在收到货物后才能释放，金库账户可以防止在一天内发生的资金提现。其理念是拥有一种让日常业务交易更简单的交易媒介。Dash\
  \ 独特的治理结构是其迄为止最具创新的特征，且不可复制。\n\n# 智能合约\n\n共同合约是两个实体或个人之间的协议，为跨越边界的潜在业务交易双方提供法律保护。\n\
  \n企业在海外或国际市场运营时用于降低风险的主要法律工具是国际合同，这是一个非常有用的功能。当企业意图将其商品或服务扩展到国际市场时，可能需要来自货运代理和销售税代理等各方的一份或多份合同。《关税与贸易总协定》（`GATT`）是一种历史性的国际贸易协定。它由包括加拿大在内的\
  \ 23 个国家于 1947 年签署，并于 1948 年 1 月 1 日生效。八轮谈判促成了它的完善以及世界贸易组织（`WTO`）的成立。一项被称为《关税与贸易总协定》（`GATT`）的法律协议在维持若干重要规定的同时，减少或消除了关税、配额和津贴，从而最大限度地减少了国际贸易的障碍。\n\
  \n`WTO` 代替了 GATT，因为它在三个方面比 GATT 好：\n\n- `WTO` 涵盖了服务和知识产权。\n- `WTO` 的争议解决系统比旧的 GATT\
  \ 系统更快、更自动。\n- 它的裁决无法被阻止。\n\nGATT 崩溃的主要原因之一是该组织倾向于工业国家，失去了发展中中国家的信任。\n\n大多数托管（定金）协议的建立，是因为一方想确保另一方在推进交易之前满足某些条件或义务。在托管协议中，通常一方（通常是存款人）将资金或资产存放在托管代理人（第三方担保方）处，直到协议履行完毕。一旦合同条件履行，托管代理人会将资金或资产交付给受益人。托管是一种物品的法律持有账户，在满足预设条件之前无法释放。通常，物品在财务交易完成之前会保存在托管中。托管的价值可以包括房地产、资金、股票和证券。例如，卖方可能会建立一个托管协议，以确保潜在购买方在交易前获得融资。\n\
  \n基于区块链的智能合约是可以在无需人工交互的情况下部分或完全执行或强制的拟议合约。智能合约的许多主要目标之一是自动托管。托管为技术和用户提供了宝贵的安全感。当你创建一个托管合约时，开发者的软件源代码或其他知识产权被放在托管代理人（受信的第三方）持有的安全托管账户中。\n\
  \n智能合约的特点是由区块链网络自动执行合同，消除了对受托人等受信第三方来调解签约双方争议的需求。结果是，实体之间的价值转移可能会减少冲突和摩擦，从而为更先进的交易自动化铺平道路。作为一个\
  \ 190 个国家组成的组织，国际货币基金（`IMF`）旨在维护金融稳定、促进国际贸易、鼓励高就业和可持续经济增长，并减轻全球贫困。各国加入该组织时向 IMF\
  \ 缴纳的资本缴款（配额）提供了其大部分部分资金。每个 IMF 成员都有一个配额，主要取决于其在全球经济中的排名。当国家遇到财务困难时，它们就可以从资金池中借款。\n\
  \n\n\n随着业务流程日益数字化，探究如何创建可信的数字业务协议正变得越来越重要。传统合同往往错综复杂、耗时且成本高昂，可以被智能合约有效取代。智能合约在全球范围内的应用日益广泛，且在极短时间内创建变得更加简单。`Hyperledger`\
  \ 等区块链联盟的发展，使得智能合约如今能够优化广泛的金融和业务流程。鉴于社会数字化程度的不断提高，现在研究如何创建可信的数字业务协议已变得至关重要。在这方面，智能合约是传统复杂、繁琐且昂贵合同的极佳替代方案。根据其明确的条款的定义，智能合约是一种自动执行、自我强制的协议，它利用区块链技术来存储和执行合同条款。为了签署基于区块链的智能合约，相关方必须首先讨论并对合同条款达成一致，然后这些条款部分或全部记录在存储在区块链上的智能合约代码中。智能合约最有利的方面在于它们能够在没有其他第三方参与的情况下进行可信的交易。由于这是一种去中心化的方法，在确认交易时不需要中间人。智能合约按照自己的日程运行。\n\
  \n## 智能合约的核心要素\n\n智能合约由几个核心要素组成，包括`signatories, subjects, and specific terms`：\n\
  \n*   智能合约的签署者可以是提供最终“通过”的两个或多个双方中的任何。通过数字签名，他们确认双方都同意建议的条款。\n*   协议的标的物（限制在智能合约的范围内）是第二个核心要素。\n\
  *   智能合约的精确条款是第三个核心要素。它们在编程语言中的实现必须与智能合约的区块链兼容，并包含详细的数学描述。\n\n合约至少将根据这三个条款自动执行。\n\
  \n## 智能合约与区块链\n\n智能合约技术利用区块链技术来验证、确认、捕获和执行多方之间约定的条款。这些合约的关键在于被称为区块链的`decentralized\
  \ network`。\n\n### 智能合约的主要特征：\n\n*   区块链上的智能合约允许匿名双方之间进行交易和协议。\n*   协议是相互的，不需要中心实体、外部执行机构或法律系统。\n\
  *   交易是透明的。\n*   交易是不可逆且可追溯的。\n*   交易易于追溯，并具有有效的内部和外部密钥。\n*   区块链是智能合约的完美环境，因为所有存储的数据都是不可篡改且安全的。\n\
  *   智能合约的数据经过加密并存在于账本上，这意味着记录在区块中的信息永远不会丢失、修改或删除。\n\n本主题将在本书的`Chapter 8`中进行详细讨论。\n\
  \n## 智能合约平台\n\n如今，有许多智能合约平台。它们可以根据技术、终端用户（银行、政府、供应链、房地产、保险等）以及地区（欧洲）进行划分。\n\n##\
  \ 区块链的构建模块\n\n如前所述，区块链由链接的区块组成。当它们结合在一起时，就创建了一个无法更改的账本。\n\n\n\n每个区块包含两种类型的信息：描述该区块如何与其他区块链接并提供安全性的内部信息，以及特定于应用程序的信息（也称为“有效负载”），用于记录交易或智能合约（智能合约由数据和代码组成，可由节点执行）。区块在整个网络中自动共享、验证，并通过哈希值进行连接。这是我们将在本书的`第\
  \ 2 章，加密哈希函数 (CHF)]`中讨论的内容。\n\n![](img/Figure-1.7.jpg)\n\n**图 1.7：** 交易集中的成功区块链\n\
  \n每个区块链都有两个内置的安全特征，以及一个额外的可选第三种特征。第一节课程教你如何将每个区块与其前一个区块链接起来，这种方式在计算上难以撤销。第一种方法涉及使用哈希树为每个区块计算哈希值，其中包含了上一个区块的哈希值（这对于每个创建的新区块都会执行，但第一个区块除外，第一个区块被称为“创世纪区块”，它没有前置区块）；第二种方法涉及在每个区块中添加一个被称为区块“随机数”（nonce）的唯一数字。通过插入正确的随机数，可以确定整个区块的特定哈希值。由于计算随机数在计算上非常困难，因此也被称为工作证明（PoW）。当随机数插入到正确的位置时，对区块进行哈希函数计算将得到一个特定的哈希值（以指定数量的零开头）。我们将在本书的`第\
  \ 4 章]`中学习工作证明。\n\n简而言之，PoW 是区块链网络中的原始共识算法。该算法用于确认交易并为链创建一个一个新区块。在该算法中，矿工（一群人）相互竞争以完成网络上的交易。\n\
  \n更改一个区块将需要为随后链接到它的每个区块重新计算随机数，因为随机数很难计算。人们通常认为，在链扩展了大约六个区块后，考虑到目前的算法状态和计算能力，对其进行修改是不可行的。第二种保护机制要求大多数节点对扩展链的下一个区块达成一致，这是由点对点的内置共识机制提供的。这意味着不存在可以被攻击的单一控制点。区块链在点对点模型中运行，所有节点都是平等的，不依赖于中心且可靠的实体。节点在彼此之间缺乏信任的情况下，依靠共识过程来验证交易。共识机制依赖于每个节点验证其接收到的数据符合一组规则，并由每个节点验证随机数。应用程序功能特定于应用程序，而内置规则验证提议的交易符合这些规则。例如，在虚拟货币的情况下，首先确认支付者拥有其想要花费的硬币的所有权（如通过使用公钥基础设施\
  \ (PKI)密钥对的私钥进行签名，该签名可以成功验证），并且交易遵循必要的结构。然后，工作证明验证过程需要显示节点投入了必要的计算投入。\n\n在两个节点同时广播下一个区块的不同版本的情况下，某些节点可能会先收到其中一个。在这种情况下，每个节点都将对收到的第一个区块进行工作，但会保存另一个分支以防它变得更长。当发现下一个随机数且一个分支变得更长时，平局将被打破；在另一个分支上工作的节点将会切换到较长的分支。\n\
  \n第三种（可选）保护机制源于区块链有两种不同的类型：无许可的许可的。每个节点都可以参与（读取、添加条目或通过对具有正确随机数的候选区块进行确认来扩展区块链）的公共系统和类比特币系统被标记为无许可的。\n\
  \n许可性区块链允许有限的已知且接受的节点处理交易并扩展链。由于此类类型的链通常由已知且同意的组织设置，并具有假设的信任水平，因此共识机制可以基于不那么密集的计算过程（它们不需要向对方证明自己在确认交易时投入了足够的计算能力）。\n\
  \n目前，大多数活跃的区块链和先驱技术包括**比特币 (Bitcoin)、以太坊 (Ethereum)** 和 **Ripple**，以及应用了新扩展性方法的以太坊为后续项目，如\
  \ **Tendermint、Hydrachain** 和 **Hyperledger**。Ripple 是一种清算和结算技术。还有一类更具扩展性的设计，如**闪电网络\
  \ (Lightning Network)、Raiden、BigchainDB、RChain** 和 **Aeternity**。此外还有连接多个区块链的超级链，包括\
  \ Interledger 和 Cosmos，以及其他的，如 Cord，它们带有独立的“事实”数据库，其中数据保持一致，但并不是所有人都有所有数据的副本。\n\n\
  # 交易 (#toc.xhtml#s22a)\n\n在交易添加到区块链之前，必须经过身份验证和授权。\n\n# 区块链交易的关键步骤 (#toc.xhtml#s23a)\n\
  \n交易在添加到区块链之前必须经过几个关键步骤（参见`图 1.8`[^(\\[5\\])](#c01.xhtml#ftn5)。我们必须理解使用加密密钥进行身份验证以及通过工作证明进行授权的过程，以及挖掘的作用，以及后期区块链网络中新采用的权益证明协议。\n\
  \n![](img/Figure-1.8.jpg)\n\n**图 1.8：** 区块链交易的步骤（感谢：Euromoney Learning 2020）\n\n\
  # 身份验证 (#toc.xhtml#s24a)\n\n虽然原始区块链设计为在没有中央机构的情况下运行（即没有银行或监管机构控制谁进行交易），交易仍然必须经过身份验证。\n\
  \n身份验证是使用加密密钥完成的，这是一个识别用户的字符串（如密码），并允许访问系统上的价值“**账户**”或“**钱包**”。\n\n为此，每个用户必须有自己的`private\
  \ key`（私钥）和所有人都能看到的`public key`（公钥）。使用它们可以创建一个安全的数字身份，通过数字签名验证用户，并“解锁”他们想要执行的交易。\n\
  \n# 授权 (#toc.xhtml#s25a)\n\n一旦用户双方对交易达成一致，在将其添加到链中的区块之前，需要经过*批准*或*授权*。\n\n对于*公共*区块链，将交易添加到链中的决策通过达成**共识**做出的。这意味着网络中的大多数“节点”（在不同的计算机上）必须同意交易是有效的。网络中拥有计算机的人通常通过奖励被激励验证交易。这一过程被称为“工作证明”。\n\
  \n# 工作证明 (PoW) (#toc.xhtml#s26a)\n\n工作证明 (POW) 过程要求网络中拥有计算机的人解决一个复杂的数学问题（通过挖矿），以便能够向链中添加区块。\n\
  \n# 矿工 (#toc.xhtml#s27a)\n\n这种解决问题的过程被称为**挖矿**，“**矿工**”通常因其加密货币工作获得奖励。\n\n\n\n\n\
  该数学问题只能通过尝试法来解决，解决该问题的概率约为 5.9 万亿分之一 1，因此采矿过程非常繁琐，一点也不容易。它需要巨大的计算能力，并涉及大量的能量。这意味着进行采矿的奖励必须大于计算机成本和运行计算机的电费，因为仅单台计算机就需要多年时间才能找到该数学问题的解决方案。\n\
  \n## 采矿过程中的能量消耗\n\n全球范围内用于支出或交易而创建比特币的过程每年消耗约 910 亿瓦时的电力，这超过了人口约 550 万的芬兰的用电量。剑桥比特币电力消耗指数估计，比特币挖矿网络每年消耗近\
  \ 700 亿瓦时（TWh）的电力，按“国家”位列第 40 位。相比之下，根据 CIA 编写的 2016 年数据，爱尔兰（排名第 68）的使用量仅为比特币的三分之一，即\
  \ 250 亿瓦时；而排名 42 的奥地利每年消耗 646 亿瓦时的电力。\n\n## 工作量证明的问题\n\n为了产生规模效应，矿工通常通过汇总大量矿工的资源将其资源整合在一起。这些潜在的矿工随后共享区块链网络提供的奖励和手续费。\n\
  \n问题变得越来越困难，网络也越来越大，从理论上讲，由于区块链的增长，链得到了进一步扩展。越来越多的计算机加入并尝试解决问题，使得破坏或黑客攻击变得日益困难。然而在实践中，算力已经集中在少数矿池手中。这些大型组织拥有了巨大的计算和电力，现在维护和增长基于\
  \ `Proof of Work`（工作量证明）验证的区块链网络所需的巨大计算和电力。\n\n## 权益证明\n\n为了解决这个问题，后来的区块链网络演进并采用了“Proof\
  \ of Stake”（权益证明）验证共识协议处理过程。在这些协议中，参与者必须在区块链中拥有权益——通常是持有某些加密货币——才才有机会选择、验证和确认交易。这节省了大量的计算资源，因为不需要挖矿。\n\
  \n此外，区块链技术已经演进到包含了“智能合约”，它可以在满足特定条件时自动执行交易。\n\n## 交易过程\n\n区块链技术的基本（或核心）特征之一是其确认和授权交易的方式。例如，如果两个个人希望分别使用\
  \ `private and public`（私钥和公钥）进行交易，甲方会将交易信息附加到第二方的公钥上。这些所有信息被收集在一个区块中。\n\n## 分布式共识\n\
  \n分布式共识确保分布式系统中节点之间的数据共识，或者对某项提议达成一致[⁶]](#c01.xhtml#ftn6)。\n\n分布式计算和多代理系统中的一个基本问题是在存在多个故障进程的情况下实现整个系统的可靠性。这通常需要协调各个进程以达成\
  \ `consensus`（共识），或对计算期间所需的某些数据值达成一致。共识的示例应用包括：就以什么顺序将哪些交易提交到数据库、状态机复制以及原子广播。需要共识的现实世界应用包括云计算、时钟同步、PageRank、意见形成、智能电网、状态估计、无人机控制（以及泛指的多个机器人/代理）、负载均衡、区块链等。\n\
  \n实现共识的过程需要多个 `processes`（进程，或代理）对单个数据值达成一致。某些进程（代理）可能会失败或以其他方式变得不可靠，因此共识协议必须具有容错性或弹性。这些进程必须以某种方式提出它们的候选值，相互通信，并对单一的共识值达成一致。\n\
  \n在多代理系统的控制中，共识问题是基础性的。生成共识的一种方法是所有进程（代理）对一个多数值达成一致。在这种背景下，多数意味着至少比可用票数的一出一张（每个进程被赋予一票）。然而，一个或多个故障进程可能会偏斜最终结果，导致无法达成共识或可能错误地达成共识。\n\
  \n解决共识问题的协议设计用于处理数量有限的故障进程。这些协议必须满足多项要求才有用。例如，一个平庸的协议可以由所有进程输出二值值 1。这没有用处，因此要求被修改为输出必须以某种方式依赖于输入。也就是说，共识协议的输出值必须是某些进程的输入值。另一个要求是进程只能对输出值做出一次决策，且该决策是不可撤销的。如果一个进程在执行过程中没有经历故障，则该进程是正确的。容忍停止故障的共识协议必须满足以下属性[⁷]](#c01.xhtml#ftn7)：\n\
  \n1. **一致性（Agreement）**：每个正确的进程必须就相同的值达成一致。\n2. **完整性（Integrity）：如果所有正确的进程提议相同的值，那么任何正确的进程必须对该值做出决策。**\n\
  3. **终止性（Termination）**：最终，每个正确的进程都会决定某个值。\n4. 共识算法可以定义为区块链网络达成共识的机制。\n\n`Agreement`（一致性）是一种安全属性，意味着所有正确的进程都选择了相同的值，且这些值在协议规定范围内是有效的。换句话之，“正确”状态取决于有多少其他进程共享你的值（全部、部分法定人数，甚至是一个）。\n\
  \n`Integrity`（完整性）涉及从参与节点故障中恢复的能力。根据应用，完整性定义的变体可能是合适的。例如，一种较弱的完整性是决策值等于某些正确进程提议的值——而不是所有进程[⁷]](#c01.xhtml#ftn7)。完整性条件在文献中也称为有效性（validity）。\n\
  \n`Termination`（终止性）是一种活跃属性，意味着如果所有正确（非故障）进程最终没有产生值，一致将停止。公共（去中心化）区块链作为分布式系统构建的，由于它们不依赖中央权威，分布式节点需要对交易的有效性达成一致。这就是共识算法发挥作用的地方。它们确保遵循协议规则，并保证所有交易以无信任的方式进行。\n\
  \n## 区块链的属性\n\n区块链表现出多种属性，使其成为多个应用领域的合适候选者[⁸]](#c01.xhtml#ftn8)。这些属性如下：\n\n* **链状态的分布式共识**：任何区块链的关键属性之一是它能够在不依赖任何受信第三方的情况下，对链的状态达成分布式共识。这为构建和利用此类系统开启了机会，在该系统中状态和交互可以被公共区块链系统的矿工或私有区块链系统中的**授权实体**验证。\n\
  \n\n\n\n\n*   **链状态的不可变性与不可逆性**：通过大量节点的参与达成分布式共识，确保了链状态在经过一段时间后在实践上是不可变且不可逆的。这同样适用于智能合约，从而使得不可变计算机程序的部署和执行成为可能。\n\
  *   **数据（交易）持久化**：区块链中的数据以分布式方式存储，只要 `P2P` 网络中存在参与的节点，数据就能保持持久化。\n*   **数据溯源性**：任何区块链的数据存储过程都是通过一种称为“交易”的机制来实现的。每笔交易都需要使用公钥密码法进行数字签名，以确保数据源的真实性。将此与区块链的不可变性和不可逆性相结合，为区块链中的任何数据提供了强有力的不可否赖性。\n\
  *   **分布式数据控制**：区块链确保了存储在链中或从链中检索的数据可以以分布式方式进行，且不会产生单点故障。\n*   **可责性与透明度**：由于链的状态以及参与实体之间的每一次交互都可以由任何授权实体进行验证，因此区块链促进了可责性和透明度。\n\
  \n## 区块链层级\n\n区块链系统包含多个组件，其功能涵盖了收集交易、传播区块、挖矿、达成共识以及为其底层加密货币维护账本。\n\n上述组件可以根据其功能通过不同的层进行分组，类似于众名的\
  \ `TCP/IP` 层。事实上，已经有一些建议建议使用分层方法来设计区块链系统。其动机是分层设计将更具模块化且易于维护。例如，如果在区块链系统的某一层级组件中发现漏洞，它只会影响该对应层的功能，而其他层则不受影响。\n\
  \n例如，David 等人提出了四层：\n\n1.  共识\n2.  挖矿\n3.  传播\n4.  语义\n\n然而，人们认为所提出的层级并没有反映出功能的合理分组。例如，共识和挖矿应该属于同一层，因为挖矿可以被视为实现共识的内在组成部分。此外，某些区块链系统可能没有与其关联的任何挖矿算法。\n\
  \n然而，Md Sadek Ferdous 等人提出了四层（见 `Figure 1.9`）：网络、共识、应用和元应用。这些层级的功能简要介绍如下：\n\n* \
  \  **元应用层**：区块链系统中元应用层的功能（见 `Figure 1.9`）是在应用层之上提供一个叠加层，以利用区块链系统的语义解释来服务于各种应用领域的其他目的。例如，比特币已尝试应用于多个应用领域，如类\
  \ DNS 的去中心化命名系统、去中心化的不可变时间戳哈希记录，以及诸如 Certcoin 的去中心化公钥基础设施 (`PKI`）。\n\n    ![](img/Figure-1.9.jpg)\n\
  \n    **图 1.9：**区块链层级\n\n*   **应用层**：应用层（见 `Figure 1.9`）定义了区块链系统的语义解释。语义解释就是定义一种加密货币，然后设定此类货币如何在不同实体之间交换的协议。\n\
  \n另一个例子是建立协议以在区块链内部维护一个体现编程能力的状态机，这可以被用于创建和部署不可变代码（所谓的智能合约）。应用层还定义了区块链系统中的奖励机制（如果有的话）。\n\
  \n*   **共识层**：如 `Figure 1.9` 所示，共识层负责为区块链提供分布式共识机制，该机制本质上管理着区块的顺序。该层的一个关键组件是证明协议（例如\
  \ `PoW` 和 `PoS`），它通常被用于验证每一个区块，最终用于实现系统所需的共识。\n\n*   **网络层**：网络层中的组件负责处理网络功能，包括加入网络。\n\
  \n\n\n\n\n- **节点类型**：指共识算法为了达成共识而与之交互的不同类型的节点。\n- **结构类型**：指在共识算法中利用“委员会”概念对不同节点进行组织的方式。委员会本身可以是两种类型：单委员会和多委员会。\n\
  - **底层机制**：指共识算法部署的用于选择特定节点的特定机制。该机制可以利用抽奖机制，即基于密码学的概率机制或其他随机机制。在投票机制中，`voting`（投票）可以在单轮或多轮中进行。另一方面，`coinage`（硬币产生）利用了一种特殊属性，该属性取决于所有者持有特定硬币有多长时间。\n\
  \n## 交易类型\n\n现在，让我们探索不同的区块链网络。\n\n## 区块链类型\n\n共有四种类型的区块链。它们如下：\n\n### **私有区块链网络**\n\
  私有区块链运行在封闭网络上，通常适用于私企业和机构。公司可以使用私有区块链来定制其访问和授权偏好、网络参数以及其他重要的安全选项。只有一个权威负责管理私有区块链网络。\n\
  \n### **公有区块链网络**\n比特币和其他加密货币起源于公有区块链，公有区块链在普及分布式账本技术（DLT）方面也发挥了作用。公有区块链有助于消除某些挑战和问题，例如安全漏洞和中心化。通过\
  \ DLT，数据分布在点点网络中，而不是存储在单一位置。使用`consensus algorithm`来验证信息的真实性；`PoS`和`PoW`是两种常用的共识方法。\n\
  \n### **许可链区块链网络**\n有时也称为混合区块链，许可链网络是允许授权人员获得特殊访问权限的私有区块链。机构通常建立此类区块链以兼顾两者的优点，它允许在分配谁可以参与网络以及参与哪些交易时能够提供更好的结构。\n\
  \n### **联盟链**\n与许可链区块链类似，联盟链同时具有公有和私有属性，不同的是由多个组织管理同一个联盟链区块链网络。虽然这类区块链最初的搭建可能更为复杂，但一旦开始运行，它们就能提供更好的安全性。此外，联盟链是多个组织协作的理想选择。\n\
  \n# 私有交易\n\n许多区块链网络作为公共数据库运行，这意味着任何连接互联网的人都可以查看网络交易历史列表。尽管用户可以访问交易详情，但无法访问执行这些交易的用户识别信息。一种常见的误区是认为比特币等区块链网络是匿名的，而实际上它们只是机密性的。\n\
  \n当用户进行公共交易时，他们唯一的代码——如前提到的`public key`（公钥）会被记录在区块链上，而他们的个人信息则不会。如果某人在一个需要身份验证的交易所进行了`Bitcoin`购买，那么该人的身份仍然与其区块链地址相关——但交易即使与人的姓名关联，也不会泄露任何个人信息。\n\
  \n为了了解银行与区块链有何不同，让我们把银行系统与比特币的区块链实现进行对比。[表 1.2] 提供了其他细节。\n\n# 加密货币：区块链技术兴起的起点\n\n\
  区块链最为人知的用途（可能也最具争议）是加密货币。加密货币是数字货币（或代币），例如`Bitcoin`、`Ethereum` 或`Litecoin`，可购买商品和服务。就像数字形式的现金一样，加密货币可以购买从午餐到下一套房子的一切物品。与现金不同，加密货币使用区块链作为公共账本和增强的加密安全系统，因此在线交易始终会被记录和保护。\n\
  \n加密货币是由密码学保护的数字或虚拟货币，这使其几乎无法伪造或双花费。许多加密货币是基于区块链技术的去中心化网络——一种由异地计算机网络强制执行的分布式账本。加密货币的一个定义特征是它们通常不由任何中央权威发行，使得它们在理论上不受政府干预或操纵。\n\
  \n“Crypto”指的是保护这些条目的各种加密算法和加密技术，例如椭曲线加密、公私钥对和哈希函数。\n\n加密货币可以被视为基于跨越大量计算机网络的数字资产。这种去中心化的结构允许它们存在于政府和中央权威的控制之外。专家认为，区块链及相关技术将包括金融和法律在内的许多行业。\n\
  \n加密货币可以通过加密货币交易所挖掘或购买。并不是所有电子商务网站允许使用加密货币购买。事实上，即使是像`Bitcoin`这样流行的加密货币也很少用于零售交易。然而，加密货币价值的飙升使其作为交易工具变得流行。在有限范围内，它们也被用于跨境传输。\n\
  \n# 作为区块链的加密货币\n\n区块链技术是比特币或其他加密货币实用性和吸引力的核心。正如其名称所示，区块链基本上是来自在线账本的链接区块集合。每个网络参与者都独立地验证了构成每个区块的一组交易。这使得伪造交易历史几乎不可能，因为每个节点在每个新生成的区块确认之前必须验证它。保存账本副本的节点或个人网络上的每台机器都对进入在线账本的信息达成一致。根据行业专家介绍，区块链技术适用于多种行业和流程，包括在线投票和众筹。参与金融业的公司（如`JPMorgan\
  \ Chase & Co.`）正在测试使用区块链技术，通过加速支付处理来降低交易成本。\n\n# 加密货币：工作原理\n\n在实践中，所有加密货币都应该是使用区块链技术记录和保护每笔交易的数字货币。加密货币（例如`Bitcoin`）应该以数字现金的形式，用于支付从日常用品到汽车和房屋等大额购买费用。这些物品可以使用各种交易平台发行的多种数字钱包之一进行购买，然后在购买物品后进行数字传输，由区块链记录交易和新所有者。通过加密货币进行交易的妙之处在于，一切都记录在公共账本上，并使用密码学进行保护，为每笔付款提供了不可否认的、带有时间戳的安全的记录。\n\
  \n\n\n\n在编写此段落时（2022 年 1 月），全球大约有 6,700 种加密货币，总市值约为 1.6 万亿美元，其中比特币占据大部分价值。在过去的几年里，这些代币变得极其流行，一个比特币曾价值\
  \ 60,000 美元。以下是大家突然关注加密货币的一些主要原因：\n\n*   区块链的安全性使得盗窃变得变得困难得多，因为每种加密货币都有一个与所有者相关的、不可否认的身份标识。\n\
  *   加密货币减少了对个人货币和中央银行的需求。通过区块链，任何加密货币都可以发送到世界上任何地方、任何人手中，而无需本位货币兑换，也不受中央银行的干预。\n\
  * 加密货币让某些人变得富有，早期者已成为万富翁。这是否是一个正面特征仍有待观察，因为一些反对者认为，投机者并没有考虑加密货币长期利益。\n* 越来越多的大型企业对基于区块链的数字货币支付想法感到着迷。2021\
  \ 年 2 月，特斯拉著名地宣布将向比特币投资 15 亿美元，并接受比特币作为其电动汽车的支付方式。\n\n## 加密货币的类型\n\n今天市场上存在数千种加密货币。其中，比特币是最受欢迎、最有价值的加密货币。一位名为中本聪（Satoshi\
  \ Nakamoto）的匿名人士在 2008 年通过白皮书发明并向世界介绍了它。\n\n比特币于 2009 年面向公众，仍然是交易最广泛、覆盖最广的加密货币。截至\
  \ 2021 年 11 月，流通的比特币超过 1880 万个，总市值约为 1.2 万亿美元。比特币总共只会存在 2100 万个。\n\n大多数加密货币提供商声称拥有不同的规格和一系列吸引人的功能。例如，以太坊的太营销为底层智能合约平台的加速器。Ripple\
  \ 的 XRP 被银行用于促进不同地区之间的传输。\n\n比特币是迄为止最流行的加密货币，其次是 `Ethereum`、`Binance Coin`、`Solana`\
  \ 和 `Cardano` 等其他加密货币。\n\n随着比特币的成功，许多被称为 `altcoins`（alternative coins 的缩写）的其他加密货币相继推出。其中一些是比特币的克隆或分叉，而另一些是从零开始构建的新货币。它们包括\
  \ `Solana`、`Litecoin`、`Ethereum`、`Cardano` 和 `EOS`。到 2021 年 11 月，所有现有加密货币的总价值已超过\
  \ 2.1 万亿美元——比特币占该总值的约 41%。\n\n## 加密货币的优缺点\n\n引入和交易加密货币是为了彻底改变金融基础设施。然而，与革命一样，这涉及到权衡。加密货币的一些优缺点如下：\n\
  \n### 优点：\n\n* 加密货币代表了一种全新的去中心化货币范式。该系统消除了对银行和其他金融机构等中心化中间人维护信任和监督交易间交易的需求。因此，基于加密货币的系统消除了单点故障（如大银行）引发类似于\
  \ 2008 年因美国机构失败而引发的全球金融危机连锁反应的可能性。\n* 加密货币的目标是促进两个人之间直接进行资金转账，而不涉及信用卡发卡机构或银行（这些银行是可靠的第三方）。这些去中心化的传输通过植入公钥、私钥以及各种激励机制（如\
  \ `PoS` 或 `PoW`）来保障。\n* 与传统的货币转账相比，两个交易方之间的加密货币转账更快，因为它们不涉及第三方作为中间人。在去中心化金融中，闪电贷款（flash\
  \ loans）是这种去中心化传输的极佳示例。这些贷款用于交易，可以在秒钟内完成而不需要抵押。\n* 硬币投资具有产生利润的潜力。在过去的 10 年里，加密货币市场价值急剧增长，在\
  \ 12 月 1 日达到近 2 万亿美元。截至 2021 年，比特币在加密货币市场中的价值超过了 8620 亿美元。\n* 汇款经济正在进行一项实验。\n\n\
  ### 缺点：\n\n* 尽管它们声称是匿名形式的交易，但加密货币实际上是伪名的。它们留下了数字足迹，像联邦调查局（FBI）或印度的中央调查局（CBI）等机构可以破解。这为政府或联邦/中央机构追踪普通公民的财务交易提供了可能。\n\
  * 加密货币已成为犯罪分子进行洗钱和非法购买等有害活动的流行工具。恐惧海盗·罗伯茨（Dread Pirate Roberts）在暗网上运行销售毒品的市场的案例已广为人知。加密货币也成为黑客用于勒索软件活动的最爱。\n\
  * 理论上，加密货币在操作上应保持去中心化，其财富分布在区块链上的许多方之间。在现实生活中，所有权高度集中。例如，麻省理工学院（MIT）的一项研究发现，仅 11,000\
  \ 名投资者就持有比特币飙升价值的约 45%。\n* 加密货币的优点之一是任何人都可以使用连接互联网的计算机进行挖掘。然而，挖掘流行的加密货币需要大量的能量，有时消耗的能量相当于整个国家的消耗量。昂贵的能源成本加上挖矿的不可预测性，使得挖矿集中在收入数十亿美元的大公司手中。根据麻省理工学院的一项研究，10%\
  \ 的矿工占据了 90% 的矿能力。\n* 尽管加密货币区块链高度安全，但其他加密存储库（如交易所和钱包）可能会被攻击。多年来，许多加密货币交易所和钱包被黑客，有时导致数百万美元的“硬币”被盗。\n\
  * 在公开市场交易的加密货币受到价格波动的影响。比特币的价值经历了快速的飙升和下跌，在 2017 年 12 月飙升至 17,738 美元，然后在几个月后下跌至\
  \ 7,575 美元。因此，一些经济学家认为加密货币是短暂的时尚或投机泡沫。\n* 加密货币是 `money` 的新范式。它们的承诺是精简现有金融架构，使其更快更便宜。它们的技术和架构去中心化了现有货币系统，使得交易双方能够独立于银行等中间机构交换价值和货币。\n\
  * 加密货币通过挖矿产生。例如，比特币是通过 `Bitcoin mining` 生成的。\n\n## 区块链的许可模型\n\n\n\n\n无需赘言，区块链技术是基于去中心化账本技术（`DLT`）原理的。DLT\
  \ 为寻求创新的公司开启了许多机会。它并非新鲜；区块链技术是那些从根本上改变行业运作方式的技术之一。\n\n# 许可链（Permissioned Blockchains）\n\
  \n许可链是一种需要访问权限的区块链网络。在这种区块链类型中，区块链之上运行着一个控制层，用于管理允许参与者执行的操作。如你所见，许可链的工作方式与私有链和公有链完全不同。它们的设计目标是在利用区块链优势的同时，不牺牲中心化系统的权威性。\n\
  \n基本上，`permissioned`（许可）与`permissionless`（非许可）区块链之间的主要区别在于参与者与网络的方式。许可系统也被认为对共识参与者有限制，这使得许可网络被高度配置并由所有者控制。然而，这并不是坏事，关键在于构建一个合适的区块链网络。\n\
  \n目前，市场上有许多流行的许可链区块链框架，包括 `Hyperledger`、`Quorum`、`Corda` 等。\n\n# 许可链的优势\n\n让我们来了解许可链的益处特性。\n\
  \n*   由于节点数量有限，许可链提供的性能优于非许可链，这消除了达到共识时不必要的计算，并提升了整体性能。此外，许可网络具有预先定义的节点来验证交易。\n\n\
  *   许可网络具有结构化的治理系统，与公有链相比，它允许更快速地更新规则。公有链面临共识问题，因为并非所有节点都会协作实施更新，导致网络更新较慢。相比之下，许可链的节点共同工作以实现更快的更新。\n\
  \n*   许可网络有效利用区块链进行去中心化数据存储。\n\n*   许可区块链技术为各行业提供了成本效益高的解决方案。\n\n# 许可链的局限性\n\n许可链具有以下缺点：\n\
  \n*   **安全性受损**：由于所有节点都正确参与共识过程，非许可公有链或私有链具有更好的安全性。然而，这可能并不许可链。许可网络的安全性取决于其成员的完整性。这意味着许可系统内部的少数小组可能会协作修改网络存储的数据。通过这种方式，网络的完整性可能会受到威胁。系统应该设置正确的权限，以防止那些坏分子勾结并产生预期的的效果。\n\
  \n*   **控制、审查与监管**：在理想的世界中，许可链在严格的指导下运行类似于公有链。监管机构有能力对交易施加限制或完全阻止交易，从而向网络引入审查。任何使用许可网络的公司或组织都面临这些风险。此外，这种策略阻止了许可网络从整个区块链生态系统中受益。\n\
  \n# 许可链与非许可链的区别\n\n当我们回顾这两种类型区块链技术的工作方式时，存在许多差异。表 1.2 为你快速提供了许可链与非许可链的对比：\n\n| 属性\
  \ | 许可链 (Permissioned Blockchain) | 非许可链 (Permissionless Blockchain) |\n| --- |\
  \ --- | --- |\n| 通用描述 | 用户在访问网络之前必须获得区块链权威的许可。用户只有在收到邀请时才能加入 | 一种开放的网络系统，所有设备都可以自由访问，无需任何权限。账本是共享且透明的\
  \ |\n| 速度 | 更快 | 较慢 |\n| 隐私性 | 私有成员持有者也可以成为成员 | 对任何人透明且开放 |\n| 合法性 | 合法 | 非法（注：此处可能指监管合规性）\
  \ |\n| 所有权 | 节点预定义网络 | 由公共所有权管理 - 无人拥有 |\n| 去中心化 | 部分去中心化 | 真正的去中心化 |\n| 成本 | 成本效益高\
  \ | 成本效益不高 |\n| 安全性 | 安全性较低 | 安全性较高 |\n\n**表 1.2:** 许可链 vs 非许可链\n\n图 1.12 显示了公有（非许可）区块链与私有（许可）区块链的分布式网络。\n\
  \n![Figure 1.2]\n\n# 区块链安全\n\n去中心化的安全和信任已通过多种区块链技术实现。新区块最初按时间顺序和线性保存。换句话说，它们被持续追加到区块链的“末尾”。除非网络大多数节点达成共识这样做，否则一旦区块添加到末尾，想要回溯并更改内容非常困难。这是因为每个区块都有自己的哈希值，并伴随着前一个区块的哈希以及之前提到的时间戳。数字信息通过数学函数转换为数字字母字符串以创建哈希值。如果数据被任何方式修改，哈希值也将发生改变。想象一下，一个同时作为区块链网络节点的黑客试图更改区块链并窃取其他用户的加密货币。想象一下，如果他们更改了自己拥有的副本，它将不再与其他所有人的副本匹配。当其他副本相互比对时，黑客版本的链会被拒绝为非法，因为他们会发现这一个副本格颖而出。为了使攻击成功，至少需要\
  \ 51% 的区块链副本被黑客同时控制并修改，以便他们的新副本能够成为多数副本和被认可的链。此外，这种攻击还需要大量的资金和资源。\n\n# 区块链的优势与缺点\n\
  \n尽管区块链技术错复杂，但它为去中心化数据存储提供了几乎无限的可能性。除了上述用途外，区块链技术可能在提高安全性、降低处理成本和保护用户隐私等领域找到应用。\n\
  \n**优势：**\n\n*   通过消除人工验证提高准确性\n*   通过消除第三方验证降低成本\n*   去中心化增加了篡改交易的难度\n*   安全、隐私且高效的交易\n\
  *   透明技术\n*   为不稳定或发展不发达国家的公民提供银行替代方案和个人信息保护手段\n\n**缺点：**\n\n除了上述优势，区块链技术存在某些缺点。这些包括：\n\
  \n*   挖掘比特币所需的高技术成本\n*   每秒交易数（TPS）有限\n*   过去与暗网非法活动的关联\n\n\n\n\n*   不同司法管辖区法律法规的不确定性和差异\n\
  *   数据存储容量的限制\n*   速度与数据效率问题\n\n# 非法行为\n\n在区块链网络上，秘密性保护了用户隐私并使其免受黑客攻击，但它允许非法行为和交易。丝绸之路（Silk\
  \ Road）是一个从 2011 年 2 月运营到 2013 年 10 月（被美国 FBI 关闭）的非法药物和洗钱在线暗网市集，它可能是最常引用的区块链用于犯罪活动的案例。\n\
  \n使用 `Tor Browser`，用户可以在暗网上不被发现的情况下买卖非法物品。他们还可以进行非法 `Bitcoin` 或加密货币购买。根据目前的美国规定，金融服务提供商在客户开户时必须收集客户数据、对每个客户进行身份验证，并确保客户未出现在任何认可或怀疑的恐怖组织列表中。\n\
  \n我们可以看到这种安排的优缺点。金融账户任何人都可以访问，但也让小偷更容易进行交易。许多人声称，加密货币的优点（如为没有银行服务的群体提供银行服务）大于其缺点，特别是考虑到大多数非法活动仍在使用无法追踪的现金进行。\n\
  \n虽然比特币最初被用于此类活动，但它的透明度和作为金融工具的发展实际上导致犯罪行为转向了其他加密货币，如 `Dash` 和 `Monero`。如今，只有极小比例的\
  \ `Bitcoin` 交易是非法活动。\n\n# 区块链的业务优势\n\n让我们对比一下这两种不同的金融系统。传统业务网络的所有成员都有自己的账簿，这些账簿容易出现重复和不一致，导致分歧、结算周期延长，以及对中间人及其相应运营开支的需求。然而，组织利用基于区块链的共享账簿可以在降低风险的同时节省时间和金钱，因为交易一旦写入账簿并经过共识认证，就无法更改。\n\
  \n区块链共识技术还提供了近实时的参考数据、一个整合、一致且错误更少的数据集，以及用户修改其所持资产描述的能力。\n\n由于没有参与成员拥有存储在共享账簿中的信息源，区块链技术促进了参与成员之间交易信息流的信任和完整性。区块链固有的不可篡性机制降低了审计成本并增加了合规性，同时提高了透明度。此外，由于在业务网络上使用区块链技术执行合同，企业从更快的执行速度、更低的成本和更低的风险中受益。这些因素允许企业与客户互动并创造新的收入来源。\n\
  \n![](img/Figure-1.13.jpg)\n\n**图 1.13:** 区块链的应用\n\n# 区块链的演进\n\n尽管区块链是一项非常新的技术，但它已经拥有丰富且有趣的历史。以下是区块链发展过程中一些重要和著名的事件的简要时间线。\n\
  \n为了理解区块链属于什么类型的数据系统，让我们看看日常场景中处理的数据软件和系统。\n\n过去，我们一直在处理以下数据库技术：\n*   用户电脑上的电子表格\n\
  *   用户公司数据管理系统中的电子表格\n*   远程云端工作模式\n*   区块链：一种分布式且公开的数据管理系统\n\n让我们探索这四种系统的优缺点。\n\
  \n## 1. 用户电脑上的电子表格\n\n当你创建一个新的电子表格时，你本质上是在构建信息的电子版本，以便将其作为数据存储在计算机的内置硬盘中。电子表格软件以及你的内置硬盘（硬件）都是为单人一次使用而设计的。\n\
  \n### 优点：\n*   只要你的电脑保持安全，你就是唯一可以访问数据的人。\n*   电子表格软件允许你使用公式根据硬盘上存储的另一个数据单元格或电子表格中的数据来自动计算值。\n\
  \n如果你的电子表格软件与你的数据库工具兼容，你将能够实现两者数据交互的自动化。\n\n### 缺点：\n*   如果你的电脑被盗或硬盘损坏，你所有的数据将消失。\n\
  *   你的电脑可能被黑客攻击，导致未经授权的人访问你的数据。\n*   如果你想让其他人在同一个电子表格上协作工作，你必须将文件发送给他们。然后他们必须返回文件的最新版本。文件来回传输，导致同一个电子表格产生许多不同的版本。\n\
  \n## 2. 公司数据管理系统中的电子表格\n\n当你在工作的电脑系统上创建电子表格时，电子数据将存储在位于楼下 IT 部门的计算机（服务器）上。很可能，你的公司会有备份服务器保留整个数据库的副本——无论是在本地还是云端。\n\
  \n由于公司服务器存储了每个人和每个部门产生的所有数据，只要他们知道去哪里寻找，具有正确权限的人就可以访问整个数据库。\n\n### 优点：\n*   任何可以访问服务器的人都可以被授予读取和/或写入同一个电子表格的权限，以改进协作。\n\
  *   取决于公司软件（`ERP system`）的复杂程度，你将能够在多个软件工具之间实现数据交互自动化。例如，如果其中一个程序计算的预期利润率低于某个水平，你的电子邮件软件将自动向相关人员发送通知。\n\
  \n### 缺点：\n*   每个可以访问数据的人都可以编写、重写或删除数据，且不保留任何更改记录。一旦发生错误或或蓄意的数据操纵，将很难检测并将其追溯到源头进行纠正，并追究过错者的责任。\n\
  *   当审计时间到来时，你需要一个审计师团队对存储在服务器不同位置的数据进行筛选，并将其合并成一份单一、连贯的报告。由于他们必须依赖文件的最新版本，而对过程中发生的任何更改（合法或非法的）没有任何记录，因此无法保证他们所报告的数据的准确性。审计失败可能导致公司面临罚款或其他处罚。\n\
  *   其他部门或地区分处可能使用与你的系统不兼容的不同的软件系统。这造成了数据孤岛，限制了协作，并防止任何人获得运营的全局概览。\n*   公司负责系统的整个所有成本，包括计算机、服务器、软件、安全以及聘用\
  \ IT 人员的成本。\n*   公司服务器宕机会导致业务停工。\n*   公司服务器是网络攻击的首要目标。如果你的服务器被破解，客户个人信息和公司机密等敏感数据可能会泄露。勒索软件攻击可能会加密你的数据并向你索要以获取解密密钥。\n\
  \n\n\n\n\n如果发生网络攻击，及早检测并隔离受影响的机器至关重要。然而，由于你的数据库允许人们读取、写入和删除数据，黑客可以擦除他们访问的痕迹。这让他们能够潜伏在你的服务器中，直到能够对你的系统造成最大的破坏。\n\
  \n## 3. 远程云端工作模式\n\n在远程办公设置中，你将通过云端软件创建电子表格，并将数据存储在云服务器上，例如 `Google Drive`。\n\n\
  在云计算模型中，运行你的软件并存储你的数据的服务器由位于特殊远程仓库（数据中心）的强大计算机组成。成百甚至数千台计算机结合计算和存储能力，以便许多客户端（即不同的公司）和用户能够同时访问数据库。要从该数据中心访问你的数据，可以使用互联网连接或更安全的直接线路。\n\
  \n### 优势\n\n*   如果你的服务器连接到互联网，你就可以与世界上任何人协作，无论他们身在何处。\n*   根据你软件的复杂程度（云端 ERP 系统），你将能够实现软件工具之间数据交互的自动化。\n\
  \n### 缺点\n\n*   任何访问数据的人都可以写入、重写或删除数据，且不保留更改的记录。如果发生错误或蓄意的数据操纵，将很难检测并将其追溯到源头。\n\
  *   公司审计员必须假设系统中的数据是准确的，尽管在数据记录到现在之间可能已经发生了变化。\n*   如果你的公司需要与其他组织合作，其他方将必须使用相同的软件。或者，你需要一位软件集成专家来构建一个桥梁，允许不同的程序相互进行通信。\n\
  *   虽然云提供商承担了基础设施的支出、维护和安全费用，但你仍需要支付订阅费用来使用它。不同类型的数据涉及不同的成本。例如，客户访问其归档数据时需要支付入站和出站费用。如果是免费产品，提供商可能正在出售你的数据以资助其业务模式。\n\
  *   当你的提供商服务器宕机时，你的数据将无法访问。\n*   云服务器可能会被黑客攻击，或误与未经授权的人共享你的数据。\n\n## 4. 区块链：一种分布式且公开的数据管理系统\n\
  \n区块链模型源于比特币的发明。因此，我们将比特币区块链视为区块链系统的原型。更多信息请参阅`第 4 章，开放环境中的分布式共识`。\n\n1.  如果你的公司运行在公共区块链系统，数据库的精确副本将存储在分布在全球的计算机网络（服务器）上。\n\
  2.  每当有人更改数据时，就会发布一条记录以指示最新版本。最新版本不会覆盖你数据的任何以前版本，而是显示整个更改历史。\n3.  此外，记录将显示哪一方负责每项更改，并指示日期和时间。\n\
  4.  区块链数据库也是公开访问的。除非数据在记录之前经过加密，否则任何访问数据库（通过互联网上的区块链浏览器）的人都能筛选数据。他们将无法理解数据如何与其他数据相关，也无法知道是谁创建或更改了任何特定的数据记录。这是因为区块链以区块链地址的形式为与它交互的每一个人分配了伪名。而且，除非他们向你揭露他们的伪名，否则你需要极其复杂的算法来破译区块链地址背后的身份。\n\
  \n![](img/Figure-1.14.jpg)\n\n**图 1.14：** 通用区块链技术的等轴测视图\n\n# 区块链历史\n\n*   **1990**：20\
  \ 世纪 90 年代后期，密码朋克尼克·萨博（Nick Szabo）主张用区块链保护一种名为 `bit gold`（从未实现）的数字支付系统。\n*   **1991**：数学家斯图亚特·哈伯（Stuart\
  \ Haber）和 W. Scott Stornetta 在 1991 年首次提出了区块链技术概念。他们的目标是创建一个文档时间戳无法被篡更改的系统。\n* \
  \  **2008**：名为中本聪（Satoshi Nakamoto）的匿名个人或团体发布了《比特币：点对点电子现金系统》。\n*   **2009**：计算机科学家哈尔·芬尼（Hal\
  \ Finney）和神秘的中本聪进行了了第一笔成功的比特币（`BTC`）交易。\n*   **2010**：两个披萨王披萨是佛罗里达州程序员 Laszlo Hanycez\
  \ 首次用比特币购买的物品。Hanycez 发送了 10,000 个 `BTC`，当时相当于约 60 美元。现在它价值 8000 万美元。官方上，比特币的市值超过了\
  \ 100 万。\n*   **2011**：加密货币达到与美元的平价。尽管在数据记录到现在可能已经发生了变化，公司审计员必须假设系统中的数据是准确的（注：此处原文逻辑似乎有跳跃，按原意翻译）。\n\
  *   **2012**：比特币进入流行文化。比特币创始人之一的维塔利克·布特林（Vitalik Buterin）创立了《比特币杂志》。\n*   **2013**：比特币的市值突破了\
  \ 10 亿美元。比特币首次达到 100 美元/BTC`。\n*   **2014**：Overstock.com、拉斯维加斯酒店和游戏公司 Zynga 开始接受比特币。通过首次代币发行（ICO），布特林的以太筹集了\
  \ 1800 万美元。\n*   **2015**：有超过 10,000 家零售商接受比特币。为了测试交换股份的技术，旧金区块链初创公司 Chain 和美国股票交易所\
  \ `NASDAQ` 开始合作。\n*   **2016**：IBM 宣布了针对云端应用的区块链策略。日本政府承认了加密货币和区块链技术的合法性。\n*   **2017**：比特币首次突破\
  \ 1000 美元/BTC。加密货币市值达到 1500 亿美元。摩根大通执行官詹米·戴蒙（Jamie Dimon）表达了对区块链技术的信念，并在华尔街的支持下认可账本系统。比特币达到\
  \ 19783.21 美元/BTC 的历史新高。迪拜宣布到 2020 年其政府将运行在区块链上。\n*   **2018**：Facebook 表示将成立一个专注于区块链技术的团体，并暗示可能推出自己的代币。\n\
  *   **2019**：当中国央行宣布正在开发自己的加密货币时，中国国家公开欢迎区块链技术。Twitter 和 Square 的执行官杰克·多塞（Jack Dorsey）表示\
  \ Square 将聘请区块链开发人员负责公司的加密加密货币计划。此外，纽约证券交易所（NYSE）宣布成立加密货币交易和数字钱包初创公司 `Bakkt`。\n\
  *   **2020**：比特币接近 3 万。PayPal 宣布用户将购买、出售和持有加密货币。\n\n\n\n\n巴哈马被恰切地称为“沙滩美元”，引入了世界上第一种数字货币。区块链出现作为对抗\
  \ COVID-19 的主要武器，特别是用于数据的安全存储和研究。\n\n### 2021 年\n2021 年对于加密投资者来说是一场过山车之旅，`bitcoin`\
  \ 的价值飙升至 64,829 美元（最高点），并下降至 35,000 美元。3 月份，世界上最富有的人埃隆·马斯克宣布接受 `Bitcoins` 作为支付方式。随后，由于环境问题他撤回了这一声明，因为挖掘\
  \ `bitcoin` 需要巨大的算力。\n\n萨尔瓦多成为第一个接受 `Bitcoin` 作为法定货币的国家。\n\n随后，非同质化代币（NFT）`NFTs`\
  \ 的巨潮为创作者带来了巨大的盈利机会。`NFT` 是如数字艺术、音乐、视频等独特且可交易的资产。像 `OpenSea` 这样流行的 `NFT` 市场为艺术家和交易者提供了舞台。`Blockchain`、`AR/VR`\
  \ 和 `web3` 的交叉催生了 `Metaverse`（元宇宙）。\n\n10 月 28 日，社交网络巨头 CEO 马克·扎克伯格将公司更名为 `Meta`。与此同时，印度禁止了加密货币的使用。`web3`\
  \ 的理念在全球范围内得到推广。\n\n### 2022 年\n持续的 2022 年随着 `NFTs` 的知名度增加，并带来了更多交易选择和盈利机会。像 `Nike`、`Adidas`、`Walmart`、`Puma`、`Gucci`、`Ferrari`\
  \ 甚至 `Disney` 等许多知名公司都在开发 `NFT` 设计。与此同时，印度政府宣布对数字资产转移征收 30% 的税。但这并不意味着在该国它是合法的。然而，各种其他区块链用例正在被探索、测试和发布，例如用于卫星通信的\
  \ `blockchain`，以及供应链、医疗、交通、房地产、自动化等行业。由于俄罗斯和乌克兰最近的紧张局势，`Bitcoin` 社区为受伤的士兵和平民提供了财务援助。\n\
  \n### 2023 年\n领先的区块链有 `Bitcoin`、`Ethereum`、`Solana`、`Avalanche` 和 `BNB Chain`。每一个都提供了独特的属性和进步，在去中心化技术领域脱颖而出。加密货币行业的知名人物、FTX\
  \ CEO Sam Bankman-Fried 在 2023 年 11 月 3 日被纽约陪审团定有罪。指控包括两项电信诈骗、两项电信诈骗共谋以及三项额外的共谋罪。\n\
  \n### 2024 年\n`Bitcoin` 等加密货币背后的区块链技术已远超最初的利基市场。各行业迅速意识到这种安全的去中心化账本系统对于从金融到供应链管理的潜力。\n\
  \n# 可能的未来趋势\n区块链技术远不止是一个安全传输加密货币的系统。该行业在 2019 年到 2025 年间的复合年增长率（CAGR）达到惊人的 69%。在此期间，区块链不再仅仅适用于加密货币，基于区块链的应用支持许多需要去中心化数据存储和访问的场景。\n\
  \n区块链正在引发重大的经济变革。然而，加密货币市场仍然缺乏监管的“荒西部”。根据最近的报告，美国证券交易委员会准备在 2022 年更严密地监管加密货币行业。\n\
  \n此外，由于许多技术的实际应用已经得到实施和探索，区块链最终因为 `bitcoin` 和加密货币而声得一席之地。作为国家每个投资者口中谈论的热词，区块链将使业务和政府运营更加准确、高效、安全和廉价，且中间人更少。\n\
  \n当我们准备进入区块链的第三十年时，传统公司是否会掌握这项技术已不再问题，而是何时的问题。今天，即在 2022 年初，我们看到了 `NFTs` 的泛滥和资产的代币化。未来十年将证明是区块链增长的重要时期。\n\
  \n# 附加信息\n### 区块链数量\n截至 2022 年，已有超过 10,000 种基于区块链的活跃加密货币以及数百个非加密货币区块链。\n\n### 区块链平台\n\
  尽管如此，区块链平台允许用户和开发者创建现有区块链基础设施的新用途。例如是 `Ethereum`，它有一种原生加密货币被称为 `ether` (`ETH`)。\n\
  \n然而，`Ethereum` 区块链替代方案还允许创建用于首次币发行（ICO）和非同质化代币（NFTs）的智能合约和编程令牌。这些都构建在 `Ethereum`\
  \ 基础设施之上，并由 `Ethereum` 网络上的节点保护。\n\n## 结论\n在本章中，我们详细学习了区块技术、其起源和部分采用。它的应用主要在金融领域，以及生成和获取如\
  \ `bitcoins` 和 `Ethereum` 等加密货币。我们还了解到这项技术超出了几个政府和其他政治力量的控制。它涉及许多复杂性，需要大量的技能和时间。\n\
  \n在下一章中，我们将学习核心部分，例如加密哈希函数，它有助于防止恶意滥用。\n\n\n\n\n- 区块链共识算法：综，Md Sadek Ferdous, IEEE\
