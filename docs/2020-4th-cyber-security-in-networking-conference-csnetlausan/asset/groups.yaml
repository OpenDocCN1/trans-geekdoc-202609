    +   - **Split**: A split occurs when the network is partitioned into several network
    partitions. Each network partition remains disconnected from the other network
    partitions. In the blockgraph when a split happens, the consensus parameters need
    to be updated. For instance, in a vote-based consensus algorithm as raft [11]
    or pbft [12], the majority criteria defines the minimum number of nodes to reach
    consensus, and this needs to be changed when the topology changes

    - **Merge**: A merge occurs when several independent network partitions become
    into one connected network. In a split, consensus parameters need to be updated.
    However, the merge of network partitions should not depend on the different versions
    of the blockgraph involved in the merging. To merge, it is needed that the block
    management module synchronizes all versions of the blockgraph.


    +   2) **Blockgraph as DLT**: The blockgraph concept refers to DLT for MANETs.
    It is a means for disseminating information through the network by guaranteeing
