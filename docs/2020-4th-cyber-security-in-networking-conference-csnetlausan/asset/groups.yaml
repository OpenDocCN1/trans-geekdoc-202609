    **共识（Consensus）**：大多数用于许可环境的共识算法（如 PoW、PoS 和 PoET）假设网络稳定，并实施安全机制来识别诚实节点可以处理的身份。使用区块结构不仅违反块图的性质，而且可能导致资源浪费。另一方面，由于块图是许可性网络，对分区的严格控制可以通过传统的算法（如
