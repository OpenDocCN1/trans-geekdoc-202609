    \n*摘要—区块链是极具前景的技术之一，能够提供维护分布式数据库的能力，确保去中心化系统中数据的完整性和真实性。然而，在动态社区（如自接网络和网格网络中的移动节点）中使用区块链时，现有的结构不足以处理使用基于\
    \ DAG 的区块链用于移动自接网络（MANETs）时面临的移动性挑战，我们将其称为“Blockchaingraph”。我们详细说明了所提区块链数据结构的设计；\n\
    \n最后，我们在离散事件网络 NS-3 中实现了我们的框架，作为区块链的方案验证。\n\n索引—区块链，网格网络，MANETS\n\n我们还认为，这种技术可能会为物联网（IoT）、车载自接网络（VANETs）和业务网络（“现场”）等行业带来新的应用机会，在这些领域中，区块链结构无法保证，且很可能发生节点移动。\n\
    \n当网络是动态的（如 MANETs 情况），网络可能会在一段时间内分裂成几个网络分区。在这种情况下，由于节点社区不断变化，很难维持单一的区块链。高移动性会导致网络分裂。为了维持单一的链结构，网络中的所有节点必须对领导者和状态达成共识。我们认为链结构不足以解决这个问题。因此我们在\
    \ MANETs 中使用有向无环图（DAG）结构来解决这个问题。\n\n区块链由 Satoshi Nakamoto 在 2008 年引入 [1]，作为我们今天所知的点对现金系统（比特币）。它也确立了自己作为能够有效保护数据完整性和真实性的技术。然而，网络分区阻止了该技术解决分区问题。尽管在物联网（IoT）等结构中网络分区并不频繁，但网络分区可能会导致区块链的分叉，产生两条不同的链。由于链无法共存，通常会删除其中一条（较短的条条）以维护主全局的一致性。区块链的关键优势在于能够解决分区，但它在\
    \ MANETs 中可能无法发挥其基础设施优势。事实上，通过为这些网络提供区块链的属性，我们可以改进已在灾后恢复地区、自然监测中使用此类网络的现有应用。\n\
    \n我们将分区定义为网络中的一组节点，当图的拓扑发生变化时识别。我们设计了区块链框架来解决拓扑变化，从而为实现提供了机会。在我们的工作中，我们将框架结构化为三个不同的模块：共识、Blockchaingraph\
    \ 和组管理。每个模块的设计都可以相互解耦以解决分区问题。此外，节点之间是相对独立的，因此它们可以轻松适应应用程序的需求。我们区块链框架的架构是本文的主要贡献。我们在第\
