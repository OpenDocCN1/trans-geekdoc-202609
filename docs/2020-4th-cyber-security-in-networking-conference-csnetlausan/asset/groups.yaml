    avoiding collisions when electing a leader. Since a leader is already well-known
    to the system there is no need to reach consensus when a block occurs. We can
    achieve consensus by using a state replication algorithm as paxos [15], raft [11]
    or pbft [12] to elect a unique leader to ensure data consistency.

    - **Transaction conflict**: A transaction is a digital piece of information replicated
