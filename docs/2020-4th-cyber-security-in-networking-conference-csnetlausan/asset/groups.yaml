    ## V. CONCLUSIONS


    In this paper we have introduced a new generation of, called blockgraph, which
    is resilient to network partitions. The blockgraph can be used in MAN where it
    takes into account the characteristics of networks. Finally, we evaluated the
    first drafts of blockgraph. Further results will follow.

