    节点和网络：在系统中，一组 n 个独立节点在移动自接网络上进行通信。节点被定义为运行区块链框架的电子设备。在该系统中，一个共识算法、一个区块管理系统和一个组管理系统，移动自接网络是指部分节点通过一系列无线链路进行通信的网络，其中可能包含一个或多个节点。由于节点是移动的，网络中的分区可能会发生。网络分区是无线链路的结果，当两个节点在彼此范围内时发生。与此相反，无线链路的断形成发生在两个节点彼此距离太远而无法通信时，即它们正在离开网络。每个节点都能够创建事务和区块。节点具有唯一标识。\n\
