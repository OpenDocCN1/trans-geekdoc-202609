    ## IV. 算法与结果


    为了验证分块图（blockgraph）框架的逻辑，并获得支持分块图的移动网格网络的初步性能。经过仔细开发，我们在本章中降低了算法的复杂度，同时确保了我们框架的良好运行。具体而言，我们将首先展示两种场景：在没有网络分区的情况下的操作性能，以及在网络分区后紧随整个网络重组（即“分裂-合并”）的情况。


    ## A. 仿真器描述与参数


    我们为框架使用的仿真器是离散事件仿真器 NS-3。该软件由多个能够模拟不同网络的模型组成，特别是让我们能够模拟具有移动性的网格网络。我们使用 NS3 的多个模型开发了一个分块图应用程序，以便在与环境相对应的协议栈上测试我们的算法。我们对两个场景的描述是详尽的：


    在第一个“分裂”场景中，网络中的所有节点在分区期间并行移动。在这种情况下没有发生网络分区。第二种场景“分裂后合并”涉及网络的分区（分裂）和重组（合并）。第一个场景用于验证分块图机制；第二个场景用于观察网络分区后整个网络重组的影响。


