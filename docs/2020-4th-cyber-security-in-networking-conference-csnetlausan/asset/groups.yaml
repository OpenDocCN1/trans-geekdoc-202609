    ## IV. ALGORITHM AND RESULTS


    To verify the logic of the blockgraph framework and obtain a first performance
    of the mobile mesh networks supporting a blockgraph. After a careful development
    we reduced the complexity of the algorithm in this chapter while ensuring the
    good functioning of our framework. More specifically, we are going to show firstly
    scenarios: the performance of the operation when there are no network partitions
    and the case where a network partition is followed by a regrouping of the complete
    network (split by a merge).


    ## A. Description of the simulator and parameters


    The simulator that we use for our framework is a discrete event simulator NS3.
    This software consists of models capable of simulating different networks and
    in particular us to simulate mesh networks with mobility. We developed a blockgraph
    application using several models of NS3 to test our algorithms with the protocol
    stack corresponding to our environment. The description of our two scenarios is
    extensive:


    In the first "split" scenario, all nodes in the network move in parallel during
    the partition phase. There are no network partitions in this case. The second
    scenario "Split followed by a merge" involves a partition (split) and a regrouping
    (merge) of the network. The first scenario is to validate the blockgraph mechanism
    by maintaining a DAG-DLT on a mesh and network; and second, to see the impact
    that a network partition can have on the functioning of the system. From our operations,
    we tracked the following metrics:


    Each scenario corresponds to a relative duration of 15 minutes (900s). For each
    scenario we made a simulation for a network composed of 10 nodes. Table I and
    II describe the description of the scenario and simulation times for each scenario
    respectively.


    | TABLE I: Mobility for "No Split" scenario |

    | Simulation time | Description |

    | --- | --- |

    | < 900s | All nodes move towards the same direction in a single connected network.
    |


    The creation of a block by a leader node occurs when the leader''s mempool reaches
    130 transactions. Each size of transaction is generated by a random variable that
    follows a uniform distribution between 300 and 600 bytes. On average, each block
    has a size of 58.5 KB which does not exceed the theoretical limit of a UDP packet
    which is defined at 65.5 KB. Each node generates transactions are propagated to
    all groups belonging to them. The generation of transactions in each node is modeled
    as follows: each node generates a random variable that follows an exponential
    law to represent the time between two arrivals. We can then model the arrival
    of transactions as a Poisson process with a lambda ($\lambda$) parameter, where
    $\lambda$ represents the transaction arrival rate per node is defined as the inverse
    of the time between two arrivals. For our first simulation, we chose to set $\lambda$
    to a relatively low rate to ensure that we do not saturate the network. Each scenario
    is set to a simulation of 2 hours.


    | TABLE II: Mobility description for "Split followed by a merge" scenario |

    | Simulation time | Description |

    | --- | --- |

    | < 900s | All nodes move towards the same direction in a single connected network.
    |

    | 300 - 600s | A partition in the network occurs. Nodes 0 to 4 form an independent
    partition and nodes 5 to 9 form another independent partition |

    | > 600s | All nodes regroup into one connected network. They all move in the
    same direction as connected network. |


    ## B. No split scenario


    Fig 3 shows the number of confirmed transactions in the leader''s mempool. Every
    time mempool reaches 130 transactions, a block is created and transactions disappear
    from the mempool. The figure shows the expected behavior of the system. With a
    lambda of 0.5 and a connected network of 10 nodes, we had a global transaction
    rate of 5 tx/s. We were able to form blocks every 26s and have a total of 276
    blocks at the end of the simulation. The results of the simulation are consistent
    with the theoretical results. From the simulation we can see that both the number
    of blocks created during the simulation and the number of transactions generated
    correspond to the theoretical results.


