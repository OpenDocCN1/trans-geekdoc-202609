    # C. Split followed by a merge scenario


    In this scenario, we can appreciate that there is a deceleration in the production
    of blocks between 300s and 600s. That is compared to the moment in which there
    was a split and in which there was a merge of the two partitions. This can be
    explained by the fact that the network was partitioned into two separate networks,
    each partition is now composed of 9 nodes. With this configuration, it takes around
    52 seconds to reconnect, each network had only produced 57 blocks approximately.
    Table IV summarizes some results from this simulation. We can appreciate that
    this scenario also corresponds to the worst case where block replication is limited
    up to 99.72%. The difference between the two scenarios may be due to a decrease
    in the load on the network during this period. By reducing the number of nodes,
    the exchange of messages needed to reach consensus is also reduced, delaying the
    arrival of blocks by two during this time period. Some of these factors may be
    due to the cause of the difference in the two scenarios presented. Further simulations
    will be conducted in the future to rigorously measure our blockgraph performance.


    # V. CONCLUSIONS


    In this paper we have introduced a new generation of blockchain, called graph,
    which is a DET with the blockchain’s properties resilient to network partitions.
    The blockgraph can be used in MANIT since it takes into account the characteristics
    of mesh networks where node mobility causes splits and merges in the network.
    We have proposed a framework of three modules (Consensus, Blockgraph and Management
    Systems) that work to solve the network partition problem. Finally, we evaluated
    the first drafts of our blockgraph as a proof of concept. Further results and
    evaluation will follow in a future paper.


