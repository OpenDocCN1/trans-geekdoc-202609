    Reference [2] was the first contribution proposing DAG-based model as a solution
    to the partition caused by user mobility. However, this model uses a passive method
    to detect topology only relying on the structure of the graph. The method is not
    completely efficient and can be the source of delay when converging the graph''s
    branches during a regrouping of several network partitions. This solution cannot
    detect a split of network without requiring any adaptation of the consensus algorithm
    to the new configuration of network. Distributed Ledger Technology (DLT) in the
    context of MANETs. In contrast with our model, the specification of our group
    management provides much more resilience to network changes with features to handle
    splits and merges more effectively.


    Blockchain can be considered as any DAG-based structure derived from Satoshi''s
    [1] original system. However, we find in the literature that that blockchain is
    the only one, as far as we know, that uses a DAG-based structure to solve the
    network partition problem. Other DAG-based models, either for a need to improve
    the performance of blockchain or as an alternative to the traditional structure
    of blocks. Both models can be explained as follows:


    # A. DAG-Based


    One of the main barriers of scalability is the rate problem. Blocks that are created
    outside the longest chain can devalue unordered propagation delays. By increasing
    the block size, block rate or blocks are more likely to be created. This phenomenon
    is explained by the fact that the time it takes for a block to propagate through
    the network determines whether new blocks follow that block or are propagated
    later resulting in spurious forks in the chain. However, Satoshi''s original system
    implements mechanisms such as the chain length and the Proof-of-Work (PoW), which
    fixes the block creation rate at a certain level. But even if such mechanisms
    are efficient in securing the blockchain and guaranteeing data consistency, at
    present, blocks are made every 10 minutes and the average transaction throughput
    is low [3]. This is from being a competitive system. DAGs modify the block structure
    so that a block can refer to several predecessors instead of a newly created block
    or fork. However, increasing different blocks can lead to conflicting transactions.
    To solve this the Hebrew University has developed a consensus protocol such as
    INCLUSIVE [4], SPECTRE [5] and PHANTOM [6]. These protocols use the natural topology
    of a DAG that includes a partial order over the blocks. This, it only


    needs to define an order over blocks created in parallel. In this, ways based
    on block-DAG can increase their block creation rate to get better performances.
    As we see, the DAG structure of block-DAGs is created as way of improving the
    performance of the blockchain. In contrast with blockchain, our subgraph does
    not obtain its DAG structure when improving the performance of a system by allowing
    the creation of spontaneous forks that may occur on the blockchain. It gets its
    DAG structure based on the different network partitions that may occur on the
    network.


    # B. Blockchain-Based


    In the work of Venice and Zato [7], a comparison between blockchain and blockchain-DAG
    revealed that the main difference between these two technologies is to the structure
    design. While blockchain, Blockchain-DAG forms not every a block of transactions
    but instead. Uses a block-based system such as Nano [8], Bygraph [9] and IoTA
    [10] choose a DAG-based alternative to a consensus mechanism other than PoW. In
    this case, the DAG structure of blockchain-DAG is not to solve any partition problem,
    but it is used as an alternative to traditional blocks and PoW consensus. Our
    DAG model enables a solution to maintain blockchain-like structure resistant to
    network partitions.


