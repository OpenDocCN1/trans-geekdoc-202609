  md: '# Blockchaingraph: A blockchain for mobile ad hoc networks


    David Cordova, Alexandre Laube, Thi-Mai-Trang Nguyen

    Sorbonne Université, CNRS, LIP6, 7525 Paris, France

    Email: (firstname.Lastname)@lip6.fr

    Guy Pujolle

    Green Communications, Paris, France

    Email: Guy.Pujolle@green-communications.com


    *Abstract—Blockchain is one of the most promising technologies to offer the ability
    to maintain a distributed database, ensuring the integrity and authenticity of
    data in a decentralized system. However, when using blockchain in a dynamic community,
    such as mobile nodes in ad hoc and mesh networks, the structure is no longer enough
    to handle the mobility challenges of using a DAG-based blockchain for mobile ad
    hoc networks (MANETs) that we call “Blockchaingraph”. We detail the design of
    the proposed blockchain data structure;


    Finally, we implemented our framework in the discrete event network NS-3 as a
    proof-of-concept for blockchain.


    Index—blockchain, mesh networks, MANETS


    zones. We also believe that this technology could lead to new application opportunities
    in industries such as the Internet-of-things (IoT), Vehicular ad Hoc networks
    (VANETs) and operational networks “the field” where a blockchain structure is
    not guaranteed and node mobility is likely to happen.


    When the network is dynamic as the case of MANETs, a network can split into several
    network partitions for a period of time. Under such circumstances, it is difficult
    to maintain a single chain of blocks because the community of nodes changes. High
    mobility can lead to the split of the network. To maintain a single chain structure,
    all nodes in the network must agree upon the leader and status. We argue that
    the chain of structure is not enough to solve this problem. In we use a Directed
    Acyclic Graph (DAG) structure to solve this problem in MANETs.


    Blockchain was introduced by Satoshi Nakamoto in 2008 [1], as a peer-to-peer cash
    system that we know today as Bitcoin. It has also established itself as a technology
    capable of efficiently safeguarding the integrity and authenticity of data. However,
    network partitions prevent the technology to resolve partitions. Even though network
    partitions are not frequent in structures such as the Internet-of-things (IoT),
    a partition in the network can cause the bifurcation of the blockchain, creating
    two different chains. Since chains cannot coexist, usually one of them (the shorter
    one) is erased to maintain a main global consistency. The key benefit of blockchain
    is that to resolve partitions, but it may find its benefit of infrastructure in
    MANETs. Indeed, by providing these networks with blockchain’s properties, we can
    contribute to the improvement of already existing applications using this kind
    of network in disaster recovery areas, nature monitoring and


    We defined the partition as a set of nodes in a network, identified when the topology
    of the graph changes. We design the blockchain framework to resolve to topology
    changes opening up opportunities in the implementation. In our work, we structure
    our framework in three different modules: Consensus, Blockchaingraph and Group
    Management. Each module is designed in a way that it can be de-coupled to solve
    the partition problem. Moreover, nodes are relatively independent from one other,
    so they can be easily adapted to the application requirements. The architecture
    of our blockchain framework is our main contribution in this paper. We evaluate
    the proposed framework in section VI. We review relevant papers related to the
    blockchain with a DAG-based structure; Section III introduces the blockchain which
    is used for ad hoc and mesh networks and we describe the characteristics of this
    new generation of blockchains; section IV we present our first results from an
    implementation of our framework in a simulation environment and section V concludes
    this paper.


