    # C. Blockgraph specification


    We decompose the blockgraph into three subsystems for the correct operation of
    the global system. We define them as follows:


    +   - **Consensus:** The consensus algorithm is responsible for providing a suitable
    leader to the protocol in order to propose new blocks to be added to the blockgraph.
    It needs to be able to adapt to topology changes during partition.

    - **Block management:** The block management is in charge of changing the local
    blockgraph data structure. This includes creating and validating blocks, ensuring
    the partial order of blocks, recovering missing blocks and managing the list of
    transactions of a node.


    **Group Management:** The module responsible for detecting changes in the network
    topology as well as reducing the nature of changes so that they can be transmitted
    to the consensus and block management modules. It is also responsible for the
    creation of groups.


    **Consensus:** Most of the consensus algorithms used in a permissionless environment
    as PoW, PoS and PoET assume a stable connectivity to the network and implement
    security mechanisms to identify pseudo-identities that honest nodes can process
    blocks. Using a block-based structure for the blockgraph is not only contrary
    to the permitted nature of blockgraph, but could also lead to a waste of resources
    as they are not writable. On the other hand, as blockgraph is a permissionless
    network, tight control over the partitions in the process can be achieved through
    legacy, state-machine-based algorithms such as pasos [15], raft and [11] may be
    used. Once more, such consensus algorithms consider a stable network and do not
    fail to deal with partition problems. In order to work in MANETs, where current
    consensus algorithms in the literature are not fit to the particular circumstances
    of our context, we are developing a modified version of raft that is tolerant
    to the network partition problem. We believe that a graph-based algorithm has
    the advantage of a flexible leader protocol that reaches consensus with a minimum
    of messages exchanged.


    We address the problem of reaching consensus in MANETs by decomposing the network
    into two different subsets:


    +   - **Leader election:** The leader election algorithm is responsible for selecting
    a suitable leader for every partition (groups) in the system. The leader is then
    tasked with the responsibility of proposing new blocks to all peer-nodes in the
    group. As blockgraph is a permissionless network, we can carry out this task easily.

    - **Log Replication:** The leader propagates its blocks to all others in the group
    so they replicate. When a block is included in the majority of copies, the replication
    condition is met. The block management module is also responsible for the replication
    process. It ensures that all group members have the blocks recovered during a
    synchronization process.


