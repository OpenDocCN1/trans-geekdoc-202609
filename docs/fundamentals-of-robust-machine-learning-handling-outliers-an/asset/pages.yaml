- pgno: 73
  md: '# 2.7 Least Squares Estimation (LSE)


    We are now ready to examine the least squares method in a more formal setting
    using the proper notation. Consider the multiple linear model in matrix form as
    follows:


    ```

    y = Xβ + ε, \\

    (2.7.1)

    ```


    where y = (y1, ..., yn)^T is a response vector, X is an n × (d + 1) design matrix
    of constants with an embedded column of 1’s, and ε = (ε1, ..., εn)^T is the error
    term. Here we assume ε ~ N(0, σ^2 I_n), the normal distribution with mean 0 and
    variance-covariance matrix σ^2 I_n. Regression parameters β = (β0, ..., βd)^T
    are the d + 1 coefficients of interest.


    The solution to a multidimensional problem is no longer a line but rather a plane
    or hyperplane. An example of a two-variable regression model and its solution
    is illustrated in Figure 2.6. In this case, the slopes are β1 and β2, while the
    intercept on the y-axis is β0. The slopes represent the angle of the plane in
    each dimension. Beyond two dimensions, the plane becomes a hyperplane. For obvious
    reasons, the hyperplanes cannot be visualized; however, the same concepts apply.


    We can write the L2 loss function in two different ways. The first uses matrix
    notation, as follows:


    ```

    J(β) = (y - Xβ)^T (y - Xβ). \\

    (2.7.2)

    ```


    This is just the sum of the squares of the errors written in matrix notation.
    To obtain the least squares estimates, β^LS, we minimize this loss function by
    taking the derivative of J(β) w.r.t. β and setting it to 0, that is


    ```

    \frac{\partial J(β)}{\partial β} = -2X^T (y - Xβ) = 0. \\

    (2.7.3)

    ```


    Then, it follows that


    ```

    -X^T y + X^T X β = 0, \\

    (2.7.4)

    ```


    ![](img/f26d7f591c2a080d86425985301266a4_73_0.png)


    Figure 2.6 A plane with slopes β1 and β2 and intercept β0 representing the solution
    for a multiple linear regression problem with two variables.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'which can then be rearranged to produce the well-known closed-form solution:


    \(\hat{\boldsymbol{\beta}}^{\text{LS}} = (\boldsymbol{X}^{\text{T}} \boldsymbol{X})^{-1}
    \boldsymbol{X}^{\text{T}} \boldsymbol{y}.\) (2.7.5)


    This is the direct matrix solution for LSE and it produces the best linear unbiased
    estimate (BLUE), provided \(\boldsymbol{X}^\text{T}\boldsymbol{X}\) is invertible.
    By best, we mean the one with the _lowest variance_. It is also referred to in
    the literature as the ordinary least squares (OLS) estimator. There are volumes
    of books and information available about OLS which we will not cover here.


    Another way to obtain the least squares estimates is to apply an iterative method.
    We saw earlier that the L<sub>2</sub> loss function is given by


    \(L_2 \text{ loss} = \frac{1}{2} \sum_{i=1}^n r_i^2 = \frac{1}{2} \sum_{i=1}^n
    (y_i - \boldsymbol{x}_i^{\text{T}} \boldsymbol{\beta})^2 .\) (2.7.6)


    Then, the least squares solution is obtained as follows:


    \(\hat{\boldsymbol{\beta}}^{\text{LS}} = \operatorname{argmin}_{\boldsymbol{\beta}
    \in \mathbb{R}^{d+1}} \left[ \frac{1}{2} \sum_{i=1}^n (y_i - \boldsymbol{x}_i^{\text{T}}
    \boldsymbol{\beta})^2 \right] .\) (2.7.7)


    Rather than try to solve this equation in closed form, it is more appropriate
    to use gradient descent to find the minimum. If we take the derivative of the
    loss function w.r.t. \(\beta_j\) and use it in the gradient descent iterative
    equation, we obtain:


    \(\beta_j^{(t+1)} = \beta_j^{(t)} - \ell'' \sum_{i=1}^n (y_i - \boldsymbol{x}_i^{\text{T}}
    \boldsymbol{\beta})(-x_{ij}).\) (2.7.8)


    At each iteration, _t_, we simply update each \(\beta_j^{(t)}\), _j_ = 0, ...
    , _d_, with the gradient term to produce \(\beta_j^{(t+1)}\) until convergence.
    The direct matrix approach and the iterative approach produce identical results,
    if the matrix is well conditioned. However, the iterative approach does not require
    a matrix inversion and therefore avoids issues posed by a large **X** matrix,
    or the possibility of an ill conditioned or singular matrix. To avoid multicollinearity
    problems, it is also well suited to the application of a penalty function, such
    as ridge or LASSO (as described in Chapter 5).


    We can gain further insight into the solution if we state the loss function in
    terms of residuals in the form of an M-estimator as follows:


    \(L_2 \text{ loss} = \frac{1}{2} \sum_{i=1}^n \rho_{L_2}(r_i) = \frac{1}{2} \sum_{i=1}^n
    r_i^2\) (2.7.9)


    which is just a restatement of an earlier MLE result. Then, taking the derivative
    w.r.t. _r<sub>i</sub>_ and setting it to 0, we obtain:


    \(\sum_{i=1}^n r_i = 0 .\) (2.7.10)


    The solution of the _L_<sub>2</sub> loss function is a set of estimates that forces
    the sum of the residuals to be identically 0. Hence, in effect, we are seeking
    the **mean** line through the data such that the average error is 0.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 2.8 Least Absolute Deviation (LAD)


    An alternative approach to LS to mitigate the effects of outliers is to use the
    LAD approach whereby an \(L_1\) loss function is used as follows:


    ```

    \( L_1 \text{ loss} = \sum_{i=1}^n |r_i| = \sum_{i=1}^n |y_i - \mathbf{x}_i^\top
    \boldsymbol{\beta}|. \) (2.8.1)

    ```


    The goal is to minimize the sum of the magnitudes of the residuals rather than
    the squares of the residuals. This can be stated as follows:


    ```

    \( \hat{\boldsymbol{\beta}}^{\text{LAD}} = \underset{\boldsymbol{\beta} \in \mathbb{R}^{d+1}}{\text{argmin}}
    \left[ \sum_{i=1}^n |y_i - \mathbf{x}_i^\top \boldsymbol{\beta}| \right]. \) (2.8.2)

    ```


    The solution to this equation is not as straightforward as it looks so care must
    be taken to select the proper way to find the minimum. For LAD, the loss function
    is piecewise linear and continuous. Therefore, a linear programming method or
    equivalent is needed to obtain a solution. The issues are that there may be an
    infinite number of localized solutions and a numerical optimization method such
    as gradient descent may struggle with \(L_1\) since the derivative is discontinuous.
    We will see an alternate approach shortly that is more effective than \(L_1\).


    We can gain further insight into the solution if we state the loss function in
    terms of residuals in the form of an M-estimator as follows:


    ```

    \( L_1 \text{ loss} = \sum_{i=1}^n \rho_{L_1}(r_i) = \sum_{i=1}^n |r_i|, \) (2.8.3)

    ```


    which is just a restatement of an earlier MLE result. Then, taking the derivative
    w.r.t. \(r_i\) and setting it to 0, we obtain:


    ```

    \( \sum_{i=1}^n \text{sgn}(r_i) = 0. \) (2.8.4)

    ```


    The minimum of the \(L_1\) loss function occurs where the number of positive residuals
    equals the number of negative residuals. Hence, *the number of points above the
    line should be equal to the number of points below the line*. This is the fundamental
    difference between \(L_1\) and \(L_2\). In one case, the points above and below
    the line are balanced and, in the other case, the sum of the residuals must be
    equal to 0 (within a numerical tolerance level). We can begin to see why the \(L_1\)
    loss leads to robust estimates: it is effectively counting and equalizing the
    points above and below the line without any concern about how far they are away
    from the line. Hence, we are obtaining the **median** line through the data. Two
    problems with \(L_1\) are that there may be an infinite number of solutions, and
    we cannot use gradient descent since the first derivative of the loss function
    is discontinuous and the second derivative is undefined at one location. These
    issues open the door to a plethora of other techniques to achieve robust results
    while avoiding these problems.


    **Exercise**: The residuals from two different estimators, known to be LSE and
    LAD, are given as follows: \(\mathbf{r}_1 = (1.3, 2.3, 4.5, -2.3, -1.3, -2.5,
    -2.5, 1.0)^\top\) and \(\mathbf{r}_2 = (1.3, 2.3, 6.0, -2.3, -1.3, -2.5, -2.5,
    -1.0)^\top\). Which one produced \(\mathbf{r}_1\) and which one produce \(\mathbf{r}_2\)?'
