    may be costly.


    Ideally, we would like to obtain the results shown in Figure 1.2 given the data
    of Figure 1.3. Robust methods offer this possibility along with the methodologies
    to achieve this outcome. Robust ML involves methods that are suitable for datasets
    with or without outliers. They produce models as if the data were outlier-free.
    This is the key benefit of using robust methods. You do not need to wonder what
    the effect of outliers may be in the dataset or where they are located. You simply
    use this class of methods on all problems without any concerns about outliers.
    In some applications, you may be interested mainly in detecting and removing the
    outliers. This issue is also addressed by robust methods, as detailed in this
    book.


    # 1.3.3 What Is Robust Data Science?


    Data science involves a set of application-specific tasks that focus on creating
    a coherent dataset from a large number of observations, performing thorough exploratory
    data analysis (EDA), and carefully interpreting results obtained from machine
    learning tools and statistical analysis. It is a rather expansive field with many
    layers of depth and a wide variety of applications. We will briefly describe some
    of these layers and emphasize the key aspects of this discipline. If we step back
    and look at statistics and machine learning from a higher perspective, we can
    understand their roles in data science. Figure 1.4 shows the traditional view.
    We start with the ground truth in the form of a probability distribution (assumed
    to be the true distribution of a population). By sampling this distribution, we
    generate a dataset. Once we have a dataset, then traditional statistics/ML seeks
    to find a model that best approximates the ground truth (i.e. the original distribution).
    From this model, we can do whatever we want, such as making predictions. Unfortunately,
    this is an idealized view of the world of data science.


    # 1.3.4 Noise in Datasets


    In the real world, there is noise that will add outlier observations to our dataset.
    Consider a slightly modified version of Figure 1.4 as shown in Figure 1.5. Here,
    the data generation path is modified to include additive noise. It is the “signal”
    plus “noise” that combine to produce more realistic datasets.


    ![](img/f26d7f591c2a080d86425985301266a4_28_0.png)


    Figure 1.4 Traditional view of the model building process.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '![](img/f26d7f591c2a080d86425985301266a4_29_0.png)


    Figure 1.5 Realistic view of the model building process.


    This is not the typical Gaussian noise that is usually taken into account. Rather,
    the noise is disruptive enough to produce bad models if special care is not taken.
    As a result, in order to construct a model that best approximates the ground truth,
    we must turn to robust statistics/ML that effectively removes noise and generates
    a better model. Without robust methods, we may not be able to produce high-quality
    models that approximate the ground truth when outliers are present.


    In robust data science, the focus is on identifying outliers, utilizing data cleaning
    methods to remove unwanted outliers or applying procedures that are largely insensitive
    to such outliers. We believe that the field will naturally migrate in this direction,
    given the fundamentals and benefits of the methods to be presented.


    # 1.3.5 Training and Testing Flows


    Data science involves building models using datasets and a number of supervised
    and unsupervised ML tools. A typical flow for supervised learning is shown in
    Figure 1.6. We are given an initial dataset with a design matrix X and known responses
    Y. Here, Y is usually a vector but can also be a matrix of responses depending
    on the application. The dataset is divided into a training set and a test set.
    We build models using training data and then assess the accuracy using test data.
    There are many different ways to determine the overall accuracy as described in
    later chapters. Not shown in the figure are the potential iterations that are
    needed to experiment with different hyperparameters, which are user-specified
    values that steer the optimization methods toward a desirable model.


    The sequence of steps is as follows. Let us assume that the dataset contains outliers.
    First, the data is randomly split into a training set and a test set. We will
    have no idea where the outliers have landed; they could be all in the training
    set, all in the test set, or in both. In practice, we must assume they are in
    both and develop methodologies and metrics under that assumption. The training
    data, shown as


    ![](img/f26d7f591c2a080d86425985301266a4_29_1.png)


    Figure 1.6 Training and test sets for supervised learning.'
