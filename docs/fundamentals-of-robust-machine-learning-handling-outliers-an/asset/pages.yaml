    # 8.9 Outlier Detection


    In binary classification problems, it is possible to identify potential outliers
    in the dataset after logistic regression is performed. The basic idea is to examine
    the histogram of the residuals. Since this is a binary classification problem,
    the difference between the predicted probabilities and the ground truth for all
    points lies between -1 and +1. Outlier diagnosis simply requires a plot of the
    histogram of the residuals from a robust regression. Residuals located in the
    vicinity of -1 and +1 are outliers. Detection simply involved counting the number
    of outliers in those two regions.


    Consider the histograms shown in Figure 8.17. The left panel is the histogram
    for residuals of CELR while the right panel shows the residuals using LCLR. The
    outliers in this case all reside at -1, as detected by LCLR. Note that in the
    case of CELR, the errors are more distributed compared to LCLR. In general, LCLR
    is more likely to distinguish outliers from inliers as will be demonstrated in
    Chapter 12.'
