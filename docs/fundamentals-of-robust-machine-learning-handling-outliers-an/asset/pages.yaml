    # 8.11 Summary


    In this chapter, we explored various robust approaches to binary classification.
    Initially, we discussed the cross-entropy loss in the context of logistic regression,
    namely CELR, which lacks tolerance for outliers. This was followed by an introduction
    to an outlier-tolerant logistic regression method using the log-cosh loss, namely,
    LCLR. Even in the absence of outliers, LCLR''s robust estimates can outperform
    the standard cross-entropy method in prediction accuracy, albeit potentially requiring
    additional iterations. Notably, robust techniques like LCLR serve as large-margin
    classifiers, offering both probability values and insights into variable importance
    (more details are given in Chapter 12). Implementing these robust methods is straightforward,
    involving minimal code alterations within an existing ML framework. Furthermore,
    data scientists can leverage this approach for outlier detection. In Chapter 12,
    further comparisons of CELR and LCLR are carried out on the Titanic dataset, including
    outlier detection and removal.


    Next, we explored the robustness of existing binary classifiers and found that
    only decision trees and the random forest methods were deemed to be robust. This
    implies that the other methods are prone to generate models that may not be accurate
    enough for the data science task at hand when outliers are present. However, random
    forest does not allow for model interpretation and therefore may not be suitable
    in all applications. Overall, LCLR provides all the key requirements for binary
    classification problems.


