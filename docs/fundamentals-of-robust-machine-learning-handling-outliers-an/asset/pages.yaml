    $\lambda_{opt} = 3 \times 10^{-6}$. The holdout test set requires a higher $\lambda
    = 10^{-5}$ but this should not be taken into account. In fact, the $\lambda_{opt}$
    value found by 5-fold CV is intended to be located in such a way as to provide
    acceptable accuracy for all possible test sets. This is the meaning of the term
    “generalized model.” It is the best overall value since some test sets would prefer
    a smaller $\lambda$, while others a larger $\lambda$. The estimates are indicated
    by the vertical line in the LC-ridge traces in the lower panel.


    It is important to note that the CV test MSE plots show the signature bias-variance
    trade-off. The vertical bars indicate the range of the min/max MSE values of the
    CV test set. The holdout test set MSE plot is included only to show that its minimum
    value may not occur at the same point as the CV test MSE. Normally, it would not
    be shown. Notice the long seemingly flat region of the MSE plot. One may wonder
    why we choose $\lambda = 3 \times 10^{-6}$ when the MSE is essentially constant
