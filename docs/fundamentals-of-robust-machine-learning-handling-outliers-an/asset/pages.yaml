  md: 'DBSCAN is much faster than $k$-NN for large problems and produces the desired
    results if eps and MinPts are selected properly. Its computation time is similar
    to $k$-means clustering since it is performing a similar task. However, the proper
    selection of the two hyperparameters is not straightforward and may require a
    few iterations which increases the overall computation time. Hence, it could be
    rather expensive for extremely large datasets.


    # 11.2.3 Isolation Forest


    One of the fastest methods available for anomaly detection is referred to as Isolation
    Forest (IF). It is a popular and effective method for very large problems based
    on decision trees (see Chapter 8). A large number of random trees are built and
    then used to identify anomalies by examining the average tree depth of each data
    point. Those with the shortest average depth are declared as anomalies, based
    on an anomaly score. The approach can be viewed as an unsupervised version of
    Random Forest (RF), a robust supervised learning method for regression and classification
    problems. However, the goals of IF and RF are completely different.


    The basic idea in IF is that anomalies tend to be “loners,” isolated from the
    rest of the data. Because of this characteristic, if a random tree is constructed
    from the data, outliers tend to end up near the root of the tree. However, building
    one gigantic tree using the data would be expensive. Instead, the approach in
    IF is to subsample the dataset multiple times (like RF) and create a tree for
    each subsample. Figure 11.7 is a representation of 100 possible trees generated
    based on different selected subsets of the data. Not all points may appear in
    all trees due to the effect of subsampling (see data points 1 and 2 in the figure).
    Outliers are identified if their depth, on average, is shallow across all of the
    generated trees. For example, point 1 in the figure is embedded deep in many of
    the trees so it is unlikely to be an anomaly. However, point 2 has a shallow depth
    so it is likely to be an anomaly. To classify each point, an anomaly score based
    on the average depth is used along with a threshold to declare it an outlier or
    inlier.


    ![](img/f26d7f591c2a080d86425985301266a4_332_0.png)


    Figure 11.7 Illustration of random tree generation for Isolation Forest.'
  merge: -1
  img_proc: true
