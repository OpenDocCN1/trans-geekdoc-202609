    # 12.2.6 Correlation Coefficients


    Finally, we return to the issue of computing the correlation coefficients. In
    statistics, a correlation coefficient is a numerical measure that quantifies the
    strength and direction of the linear relationship between two variables. The value
    of a correlation coefficient ranges from –1 (strong negative correlation) to 1
    (strong positive correlation). We noted earlier in Table 12.1 that the correlation
    coefficients relative to the response variable MEDV could not be trusted due to
    the presence of outliers. But how do we obtain values that are trustworthy? We
    must use the outlier-free data. There is no choice here.


    Figure 12.8 plots two sets of correlation coefficients for the explanatory variables
    relative to MEDV. One set is directly taken from Table 12.1. The other set is
    obtained in the same manner using outlier-free data. Note that most of the values
    change noticeably when the outliers are removed. Some are higher, while others
    are lower. For example, the original value of the correlation coefficient is 0.25
    for the DIS variable. After removing the outliers, the value jumps to 0.50. This
    is a significant change in the value. For AGE, the value drops from –0.4 down
    to –0.6. If accurate values of the correlation coefficients are important for
    a particular data science application, then outliers must be removed before applying
    the necessary computations. Again, the iterative boxplot method (see Chapter 4)
    is the most reliable way to find and remove outliers.'
