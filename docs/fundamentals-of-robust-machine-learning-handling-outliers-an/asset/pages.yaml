    statement that all outliers are either fp or fn. However, not all fp and fn are
    outliers. For example, the fp near the boundary line is a classification error.
    This can be corrected using a better classifier. Unfortunately, all the outliers
    will remain as fp or tn regardless of the classifier used. In this example, the
    best classifier will still produce two fp’s and one fn. Therefore, outliers set
    an upper limit on the accuracy of classification methods. This is something to
    keep in mind when trying to produce better results using different classifiers
    with no apparent improvement: it could be that the upper limit due to outliers
    has been reached.


    As shown in Table 9.1, the combination of true values along the diagonal and false
    values on the off-diagonals forms a confusion matrix. This matrix is very useful
    in telling us what type of error we are making using a particular classifier.
    One classifier may be prone to making a lot of false positive errors while another
    may make more false negative errors. Choosing the right classifier depends on
    the data science problem being solved. This is where the confusion matrix comes
    in handy because it contains the needed information. To obtain it, we can simply
    discretize each predicted probability using a threshold $P_T$ and enter the totals
    into each of the four categories in the confusion matrix. Typically, $P_T = 0.5$
    but it can be adjusted to improve performance. Using the discretized information,
    we compute the recall and precision, which are both standard metrics in binary
    classification. Finally, the $F_1$ score is computed using these two quantities
    to assess the overall effectiveness of the model.


