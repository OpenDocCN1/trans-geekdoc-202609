    # ## 9.8.2 Receiver Operating Characteristics (ROCs)


    It is possible to improve the performance of a classifier by simply adjusting
    the threshold, $p_T$. For example, in Figure 9.8, the decision boundary can be
    shifted a bit to the right by increasing $p_T$. Then, only outliers would not
    be properly classified, which is the best that can be achieved. Therefore, different
    values of $p_T$ should be selected to find the optimal one for a given dataset
    to maximize the $F_1$ score.


    An interesting issue arises when we have two classifiers, A and B, and we want
    to carry out a fair comparison between them. What if we adjusted $p_T$ to improve
    the quality of classifier A while ignoring such adjustments for classifier B?
    That would be unfair but it may also be time consuming to adjust the $p_T$ of
    both until all possible values are exhausted to find the best value for each one.
    The receiver operating characteristics (ROC) is an effective measure when comparing
    of the performance of two classifiers for different $p_T$ settings. It is a plot
    of the true positive rate (TPR) against the false positive rate (FPR) for different
    values of $p_T$ as follows. For each $p_T$, the TPR is given by


    ```

    $\text{TPR} = \frac{\text{tp}}{\text{tp} + \text{fn}}$

    ```'
