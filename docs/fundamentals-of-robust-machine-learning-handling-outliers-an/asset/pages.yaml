  md: 'as if it was drawn from a Gaussian distribution, the outliers (if any) tend
    to be hidden by a shift in \(\hat{\mu}\) and an increase in \(\hat{\sigma}\).
    In other words, the distribution is modified to accommodate outliers as if they
    were inliers. This was shown earlier in Figure 4.8. Therefore, we must turn to
    a robust alternative instead. In particular, the mean and standard deviation should
    be replaced by


    \(\tilde{\mu}_j = \text{median}(\boldsymbol{x}_j)\) (4.9.2)


    and


    \(\tilde{\sigma}_j = \text{MADN}(\boldsymbol{x}_j)\). (4.9.3)


    respectively. These are the appropriate choices for non-Gaussian distributions
    of explanatory variables. Then, the robust z-scores are obtained using


    \(\boldsymbol{z}_j^{\text{robust}} = \frac{\boldsymbol{x}_j - \tilde{\mu}_j}{\tilde{\sigma}_j},
    \quad \text{for } j = 1, \dots, d.\) (4.9.4)


    One caveat on the use of robust standardization is that it cannot be applied blindly
    to binary or categorical data. The reason is that it may result in MADN(\(\boldsymbol{x}\))
    = 0 which presents a problem in Eq. (4.9.4) as it appears in the denominator.
    Instead, for these types of variables, the options are to use the standardization
    based on the non-robust equations presented earlier or to leave them alone as
    unstandardized variables.


    **Exercise:** Given \(\boldsymbol{x}_1 = (0, 1, 1, 0, 0, 1, 0)^\top\), compute
    median\((\boldsymbol{x}_1)\) and MADN\((\boldsymbol{x}_1)\). What problem exists
    if we attempt to compute the robust z-scores? To resolve this issue, compute the
    standard z-scores for this variable or suggest another approach.


    **Ans.:** We find that median\((\boldsymbol{x}_1)\) = 0 and MADN\((\boldsymbol{x}_1)\)
    = 0 so Eq. (4.9.4) is not applicable. However, the mean is \(\hat{\mu} = 0.429\)
    and the standard deviation is \(\hat{\sigma} = 0.535\). Therefore, the z-scores
    of \(\boldsymbol{x}_1\) are \(\boldsymbol{z}_1 = (-0.802, 1.069, 1.069, -0.802,
    -0.802, 1.069, -0.802)^\top\). Or, we could skip the entire process and simply
    use \(\boldsymbol{x}_1 = (0, 1, 1, 0, 0, 1, 0)^\top\).


    The effects of robust standardization compared to Gaussian standardization are
    illustrated in Figure 4.23. For the Swiss and Diabetes datasets, the differences
    are not pronounced but it is clear that more outliers remain noticeable and influential
    in the case of robust standardization. On the other hand, the Boston dataset shows
    a stark difference between the two approaches. Most of the outliers have been
    confined to the region between -4 and 4 in the case of Gaussian standardization
    whereas most, if not all, of the outliers have been preserved after robust standardization.
    It is hard to detect outliers if the process of standardization reduces their
    "outlierness." In fact, most anomaly detectors require some form of standardization
    of the data before their application and it would be counterproductive if that
    process tended to hide the outliers. That is why Gaussian standardization is problematic
    and robust standardization is preferable.'
