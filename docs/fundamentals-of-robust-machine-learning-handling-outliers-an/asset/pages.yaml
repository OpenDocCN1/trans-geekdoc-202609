  md: 'In machine learning, it is formulated by letting \(\lambda_1 = \lambda \alpha\)
    and \(\lambda_2 = \lambda(1 - \alpha)/2\) to produce


    \(P(\boldsymbol{\beta}) = \lambda \left[ \alpha \sum_{j=1}^d |\beta_j| + \frac{(1
    - \alpha)}{2} \sum_{j=1}^d \beta_j^2 \right] .\)


    If \(\alpha = 0\), we are using ridge while if \(\alpha = 1\), we are using LASSO.
    In practice, we must seek optimal values of both \(\lambda\) and \(\alpha\) by
    selecting a number of discrete values of each one and then trying all possible
    combinations of these values to find the best model—a procedure referred to as
    a grid search.


    **Exercise:** Write the objective function for a log-cosh loss with an elastic
    net penalty function.


    **Ans.:** The full expression is


    \(J^{\text{LC-Enet}}(\boldsymbol{\beta}) = \frac{1}{a} \sum_{i=1}^n \log(\cosh(ar_i))
    + \lambda \left[ \alpha \sum_{j=1}^d |\beta_j| + \frac{(1 - \alpha)}{2} \sum_{j=1}^d
    \beta_j^2 \right] .\)


    # 5.9 Adaptive LASSO (aLASSO) Penalty


    Model reduction using LASSO is very important when the number of parameters is
    large. In a dataset with many variables, most of them will not be important in
    terms of their impact on the response variable. One can imagine a dataset with
    \(d = 50\) being reduced to \(d_0 = 30\) by variable selection, and ideally only
    the important explanatory variables would be retained in the compact model. A
    penalty function with an inherent ability to order the variables from most important
    to least important is said to have the *oracle property*.


    Unfortunately, the LASSO penalty does not have this property. It is effective
    at removing variables but not necessarily in their order of importance. As a consequence,
    it is possible that the wrong variables may inadvertently be removed by setting
    them to 0. For example, let \(d = 7\) and assume we know *a priori* that \(\beta_4
    = \beta_6 = 0\) (hence they should be removed) while all other parameters are
    nonzero. If LASSO is used, it might remove two variables but not necessarily \(\beta_4\)
    and \(\beta_6\). Thus, such a penalty estimator does not have the oracle property.
    However, it may still produce a compact model but the parameter values may not
    be as meaningful if the wrong variables have been removed. This is important because
    of model interpretability. We want to be able to eliminate parameters from the
    model that are not explanatory in terms of the response variable, leaving only
    those that are important. If an estimator possesses the oracle property, it behaves
    asymptotically (i.e. with enough data) as if it has prior knowledge of the true
    model. Whenever model reduction and interpretability are important, we require
    the oracle property to be present in the penalty function.


    Improved methods have been developed that do indeed possess the oracle property.
    One in particular is relevant to the discussion here: aLASSO. In the original
    LASSO, the same \(\lambda\) value is used for all parameters. In aLASSO, an additional
    weight is applied to each parameter as follows:


    \(P(\boldsymbol{\beta}) = \lambda \sum_{j=1}^d w_j |\beta_j|, \qquad (5.9.1)\)


    where \(w_j\) is the weight for each parameter. The only matter to resolve is
    to choose \(w_j\).'
