  md: 'In practice, we are given the data but no access to the ground truth. Assume
    all we know is that the hyperparameter is fixed at $K = 2$. The question is, can
    we reconstruct the Gaussian mixture using only the given data to close the loop
    in Figure 1.4? The answer is yes. We can do this using a clustering algorithm
    followed by the estimation of the parameters of $\Theta$.


    The $k$-means clustering technique can be invoked using `KMeans` in the `sklearn`
    Python library. The $k$-medians approach is not available in `sklearn` so a simple
    version can be written in Python for comparison purposes.


    If we run the `KMeans` algorithm to convergence, the resulting cluster centers
    are $\hat{\mu}^{(1)} = (-1.92, 1.17)^T$ and $\hat{\mu}^{(2)} = (4.93, -0.17)^T$.


    These values are close to the cluster centers associated with the original distribution
    of Eq. (1.10.1). If we run the $k$-medians algorithm, we obtain


    $\hat{\mu}^{(1)} = (-1.89, 1.46)^T$ and $\hat{\mu}^{(2)} = (5.48, 0.30)^T$.


    These centers are also close to the original distribution values.


    The results are shown graphically in Figure 1.11. The $k$-means and $k$-medians
    methods produce roughly the same two clusters and centers (indicated by $\otimes$
    in the figure). Both sets of results are acceptable as they are close to the two
    centers of the original distribution. To close the loop of Figure 1.4, we need
    the variances of each cluster by computing the covariance matrix of the form $\sigma^2\mathbf{I}_2$,
    and also the probability weights based on the ratio of points in each cluster
    relative to the total number of points. In doing so, using $k$-means, we obtain:


    $f_{\hat{\Theta}}(x) = 0.6\mathcal{N}_2((-1.9, 1.0)^T, 2.4\mathbf{I}_2) + 0.4\mathcal{N}_2((4.9,
    -0.2)^T, 3.8\mathbf{I}_2)$ (1.10.2)


