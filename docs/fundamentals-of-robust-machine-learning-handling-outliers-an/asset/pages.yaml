  md: '![](img/f26d7f591c2a080d86425985301266a4_72_0.png)


    The question that immediately arises is: How do we come up with a better M-estimator?
    The answer is to try out different options and compare them against one another.
    In particular, if you want to find the median of the data and you find that the
    \(L_1\) loss function is not suitable, then any other \(\rho(r_i)\) function that
    seeks the median would be a suitable replacement. In a later section, we will
    consider the Huber estimator as our first M-estimator in this chapter, followed
    by the log-cosh estimator in the next chapter.


    Notation: The general form of an M-estimator is given by:


    \[

    \hat{\boldsymbol{\beta}}^* = \operatorname*{argmin}_{\beta} \left[ \sum_{i=1}^n
    \rho(y_i - \mathbf{x}_i^T \boldsymbol{\beta}) \right].\]


    The use of **argmin** indicates the loss function should be minimized to find
    the associated \(\boldsymbol{\beta}\) located at the minimum. The superscript
    * is usually replaced by acronyms such as L1, L2, LS, LAD, LC, and H to refer
    to the specific type of loss function used.'
