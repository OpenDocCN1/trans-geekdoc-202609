    # ## 9.8 Classification Metrics and Outliers


    We close this chapter by examining the metrics associated with binary classification
    problems. Assume we have a machine learning tool that performs binary classification
    on a training set to create a model which predicts the responses on the same training
    set. Although it is desirable to obtain a high level of prediction accuracy on
    the training set, the more important result is the accuracy on an unseen test
    set. In either case, to assess the accuracy of a binary classification model,
    we could simply take the number of correct predictions and divide by the total
    number of observations to determine the success rate, i.e.


    ```

    Accuracy = \(\frac{\text{Total number of correct predictions}}{\text{Total number
    of observations}} .\)

    ```


    However, this type of analysis, although useful as a first-order assessment, may
    be misleading if only a few of the true responses are, say 1, and all the remaining
    are 0. Then by guessing 0 in all cases, a high accuracy can be obtained but it
    would not be a proper indication of the accuracy of the model. Alternative methods
    are available to assess the quality of prediction in binary classification, as
    described below.


    # ### 9.8.1 Precision, Recall, \( F_1 \) Score


    When dealing with binary responses, it is common practice to compute the \( F_1
    \) score on both the training set and test set. For this purpose, we need to build
    a table of outcomes based on whether or not the model predicted the correct label
    of 1 or 0. There are four possible scenarios as listed in Table 9.1. For example,
    if the true value is 1 and the prediction is 1, it is referred to as a true positive
    (tp). Similarly, a true value'
