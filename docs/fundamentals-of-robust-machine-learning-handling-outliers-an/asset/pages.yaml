    5-fold training process, we will have five sets of estimates that we can average
    to obtain the generalized model. The final model can be tested on the holdout
    set to confirm the results.


    One often-neglected issue concerning k-fold cross-validation is the impact of
    outliers. The question that arises is whether or not a k-fold CV can be used to
    mitigate the effects of outliers since it produces a more general solution. To
    answer this question, consider the diagram in Figure 6.6. Each dot represents
    a potential outlier in the dataset. When applying k-fold CV, it is not clear where
    the outliers will land. They could be in the holdout set or in the CV test set
    or in the CV training set or sprinkled throughout all of them, depending on the
    number of outliers. Without knowing the exact location, one cannot blindly use
    a non-robust method. Therefore, the k-fold CV method should not be viewed as a
    solution to the problem of outliers. However, a robust method in conjunction with
    k-fold CV will certainly be more appropriate for model generalization in the presence
    of outliers.'
