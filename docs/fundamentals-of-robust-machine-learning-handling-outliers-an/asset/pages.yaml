- pgno: 223
  md: '# ## 7.8 Maximum-Likelihood Procedure for SMRQ


    Since the SMRQ loss function is a smoother version of the check function, it is
    possible to use maximum-likelihood estimation (MLE), as described in Chapter 3.
    To derive the SMRQ loss using the maximum-likelihood procedure, we need a probability
    density function (PDF), \( f_X(x) \). Since we only have a loss function as a
    starting point, the reverse MLE rule can be used here (see Section 3.5). That
    is, we know that \( \rho(x) = -\log f_X(x) \). Then, it follows from the reverse
    MLE procedure that


    \( f_X(x) = \frac{1}{\kappa} e^{-\rho_{SMRQ}(x;\tau)}, \tag{7.8.1} \)


    where


    \( \rho_{SMRQ}(x;\tau) = \frac{1}{3} \log \left( \cosh \left( \frac{3x}{2} \right)
    \right) + \left( \tau - \frac{1}{2} \right)x, \tag{7.8.2} \)


    using \( a = 1.5 \) as in Eq. (7.5.7). Applying the procedure, the form of the
    PDF is given by


    \( f_X(x) = \frac{e^{-(\tau - \frac{1}{2})x}}{\kappa \cosh(3x/2)^{\frac{1}{3}}},
    \tag{7.8.3} \)


    where the normalizing constant \(\kappa\) will vary as a function of the selected
    \(\tau\). For \(\tau = 0.5\), we obtain \(\kappa\) as follows


    \(\kappa = \int_{-\infty}^{\infty} \frac{e^{-(\frac{1}{2}-\frac{1}{2})x}}{\cosh(3x/2)}
    = 4.857,\)


    and for \(\tau = 0.25\), we find \(\kappa\) using


    \(\kappa = \int_{-\infty}^{\infty} \frac{e^{-(\frac{1}{4}-\frac{1}{2})x}}{\cosh(3x/2)^{\frac{1}{3}}}
    = 6.546.\)


    For \(\tau = 0.75\), we find \(\kappa\) using


    \(\kappa = \int_{-\infty}^{\infty} \frac{e^{-(\frac{3}{4}-\frac{1}{2})x}}{\cosh(3x/2)^{\frac{1}{3}}}
    = 6.546.\)


    ![](img/f26d7f591c2a080d86425985301266a4_223_0.png)'
