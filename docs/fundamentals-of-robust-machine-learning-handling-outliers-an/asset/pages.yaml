  md: '![](img/f26d7f591c2a080d86425985301266a4_277_0.png)


    Figure 9.4 Sigmoid and relu activation functions. Typically, relu is applied to
    hidden units to speed up convergence whereas sigmoid is applied to the output
    layer to provide probabilities.


    The sigmoid function is given by


    sigmoid(z) = a(z) = \frac{1}{1 + \exp(-z)}, \quad (9.3.3)


    as shown on the left side of Figure 9.4. It takes the linear combination of the
    inputs, which can be any real value, and forces it to lie in the range [0,1].
    We will need the derivative of the activation function for use in gradient descent
    during optimization. The derivative of the sigmoid function is


    \frac{\partial \text{sigmoid}(z)}{\partial z} = \frac{\exp(-z)}{(1 + \exp(-z))^2}
    = a(z)(1 - a(z)). \quad (9.3.4)


    We could use the sigmoid function for activation throughout the neural network
