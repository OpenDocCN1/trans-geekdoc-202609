- pgno: 228
  md: 'this approach, the crossing problem can be reduced or removed entirely depending
    on the selection of the robustness coefficient, \( a \). Notably, the loss function
    can be optimized using gradient descent, which is routinely used in machine learning.


    A number of qualitative and quantitative techniques were presented to compare
    different methods of carrying out quantile regression. The number of non-monotonic
    events, called dips, can be detected using a QP plot as a measure of the severity
    of the crossing problem. Other metrics such as the maximum error, average error,
    and sum of errors can also be computed. These values can be used to select the
    robustness coefficient suitable for the smooth check function since there is an
    inherent monotonicity-error trade-off which needs to be balanced.


    The use of the log-cosh formulation also leads to a deeper understanding of quantile
    regression. The source of the crossing problem can be identified as partially
    due to the kinks in the check function and partially due to infinite solutions
    possible when solving the standard quantile loss function using linear programming
    methods. In addition, the maximum-likelihood procedure can be applied to explore
    the distributions associated with the quantiles in the log-cosh case. Furthermore,
    the PDFs of different quantiles can be plotted and statistical quantities, such
    as expectation and variance, can be computed. Indeed, this formulation is a promising
    approach for use in robust machine learning for quantile regression.


