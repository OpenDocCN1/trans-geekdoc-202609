    LCLR produces a flat characteristic implying that any value of pT between 0.1
    and 0.8 will produce roughly the same F1 score. Therefore, LCLR is robust in terms
    of the selection of pT, whereas CELR will require a certain amount of adjustment
    to obtain satisfactory results. In other words, the robust method is not as sensitive
    to the specific choice of pT compared to the non-robust approach. This is why
    the ROC may not be as useful when used with outliers and robust methods. The average
    F1 score would be a more appropriate metric in this case.


