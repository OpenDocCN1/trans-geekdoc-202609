    # 4.5 Outlier Removal


    Now that the different methods of outlier detection have been described, we can
    move to the final phase of outlier removal. There are two options available at
    this stage: the first is to delete all detected outliers, called _trimming_, and
    the second is to keep all outliers but adjust their location, a process called
    _winsorization_. Both are discussed in the sections to follow.


    # 4.5.1 Trimming Methods


    The conventional approach to outlier removal is called trimming. The idea is to
    simply remove observations associated with predictors and responses that are considered
    outliers. It is used in conjunction with the detection methods described above
    (3-sigma, 4.5-MAD, and 1.5-IQR). Often, a quantile-based approach, targeting a
    specific percentage of outliers (such as 5%), is used rather than the results
    of the detection methods. Trimming can be symmetric where both the highest and
    lowest values of potential outliers are removed, or asymmetric where only the
    highest or the lowest values of potential outliers are removed. This simple approach
    is illustrated in Figure 4.9. The original data is diagnosed for outliers and
    then those observations are removed from the dataset. While this method is widely
    used in data science, the main problem is that if it is applied using explanatory
    and response variables individually, then inliers may be thrown out with the outliers,
    while some outliers still remain in the dataset. This may eventually lead to inaccurate
    models. Also, the edit criteria are all heuristic in nature and the quality of
    the results depends on the specific application.


