  md: 'It is somewhat remarkable that after all the calculus and algebra used, the
    final form is a simple quantity that we have seen several times throughout this
    book. This is due to the form of the softmax function and the fact that \(y_1
    + y_2 + y_3 = 1\) which conveniently reduces the equation into a compact form.
    As a final step, we can use the values associated with the one-hot encoding in
    the first row of the dataset. Since \(y_1 = 1\), \(y_2 = 0\) and \(y_3 = 0\),
    the final result is


    ```

    \frac{\partial \mathbb{L}_{r1}^{CE}}{\partial w_1} = -(1 - p_1)a_1.

    ```


    Interestingly, this is the same result that would be obtained by applying one-hot
    encoding of 100 to an earlier step in the derivation as follows


    ```

    \frac{\partial \mathbb{L}_{r1}^{CE}}{\partial w_1} = -1(1-p_1)a_1 - 0(-p_1p_2)a_1
    - 0(-p_1p_3)a_1 = -(1-p_1)a_1.

    ```


    The next gradient of interest is associated with \(w_2\). It proceeds in the same
    manner as the above but with different partial derivatives involving the cross-terms.
    We begin with the equation for the loss as before,


    ```

    \mathbb{L}_{r1}^{CE} = -y_1 \log p_1 - y_2 \log p_2 - y_3 \log p_3.

    ```


    Again, the gradient will be composed of three terms, since there are three arrows
    leaving \(z_2\), but they will be different for the case of \(w_2\) compared to
    \(w_1\) as follows:


    ```

    \frac{\partial \mathbb{L}_{r1}^{CE}}{\partial w_2} = \frac{\partial \mathbb{L}_{r1}^{CE}}{\partial
    p_1} \frac{\partial p_1}{\partial z_2} \frac{\partial z_2}{\partial w_2} + \frac{\partial
    \mathbb{L}_{r1}^{CE}}{\partial p_2} \frac{\partial p_2}{\partial z_2} \frac{\partial
    z_2}{\partial w_2} + \frac{\partial \mathbb{L}_{r1}^{CE}}{\partial p_3} \frac{\partial
    p_3}{\partial z_2} \frac{\partial z_2}{\partial w_2}

    = -\frac{y_1}{p_1}(-p_1p_2)a_1 - \frac{y_2}{p_2}p_2(1-p_2)a_1 - \frac{y_3}{p_3}(-p_3p_2)a_1

    = y_1p_2a_1 - y_2(1-p_2)a_1 + y_3(p_2)a_1

    = -y_2a_1 + (y_1 + y_2 + y_3)(p_2)a_1 = -(y_2 - p_2)a_1 = p_2a_1.

    ```


    Finally, for \(w_3\), we follow the same steps and obtain


    ```

    \frac{\partial \mathbb{L}_{r1}^{CE}}{\partial w_3} = -(y_3 - p_3)a_1 = p_3a_1.

    ```


    It is abundantly clear why the categorical cross-entropy loss works well with
    softmax: the terms cancel in such a way as to produce simple and familiar gradients.
    Therefore, the implementation of softmax with categorical CE is common practice
    in deep learning applications.


    **Example**: This example carries out a similar process to find the gradients
    for the categorical LC loss function when used in conjunction with softmax activation.
    We select \(w_1\), \(w_2\), and \(w_3\), and repeat the same steps as above. Using
    the categorical LC loss for row 1, represented as \(\mathbb{L}_{r1}^{LC}\) below,
    we find that


    ```

    \mathbb{L}_{r1}^{LC} = y_1 \log cosh(y_1 - p_1) + y_2 \log cosh(y_2 - p_2) + y_3
    \log cosh(y_3 - p_3).

    ```


    Since \(y_1 = 1\), \(y_2 = 0\), and \(y_3 = 0\), we can write the gradient as
    simply


    ```

    \frac{\partial \mathbb{L}_{r1}^{LC}}{\partial w_1} = \frac{\partial \mathbb{L}_{r1}^{LC}}{\partial
    p_1} \frac{\partial p_1}{\partial z_1} \frac{\partial z_1}{\partial w_1}

    = - \tanh(1-p_1)p_1(1-p_1)a_1.

    ```'
