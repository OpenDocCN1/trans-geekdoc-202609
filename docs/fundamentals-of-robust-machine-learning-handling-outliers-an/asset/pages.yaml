    # ## 11.6 Summary


    In this chapter, the subject of anomaly detection was described in detail, focusing
    primarily on k-NN, DBSCAN, and Isolation Forest. Anomalies are an important subset
    of outliers. They are extreme outliers that have unusual characteristics compared
    to the rest of the data and oftentimes are symptomatic of suspicious activity
    such as spam or bank fraud. The three main methods for anomaly detection were
    compared and contrasted. The k-NN approach works well but is very expensive on
    large datasets. DBSCAN is a cluster-based method which can handle much larger
    datasets but requires careful hyperparameter tuning. Isolation Forest is among
    the fastest and most widely used for very large datasets. However, it also requires
    manual tuning and can generate more false positives and false negatives than the
    other methods due to the heuristic approach it takes for outlier detection. A
    new technique called MADmax was introduced which uses robust statistics and k-medians
    clustering to detect anomalies. Its speed is comparable to DBSCAN but has no requirement
    to tune any hyperparameter to obtain acceptable results. Finally, the techniques
    and metrics used to evaluate anomaly detectors were described, including precision,
    recall, and the AUROC metrics.


