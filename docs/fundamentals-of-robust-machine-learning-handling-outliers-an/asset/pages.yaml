    multidimensional problems with \( n \le 20,000 \) (due to limits on \( k \)-NN).
    Detailed analysis can be performed in this manner to build confidence in the tool
    that is finally selected for the anomaly detection task. Alternatively, comparisons
    across many benchmarks can be done in a similar fashion using row numbers of the
