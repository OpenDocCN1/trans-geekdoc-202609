    \frac{x - \theta}{\sigma} \right) \right).$$


    Typically, the location is 0 for distributions used to derive loss functions.
    Hence, for $\theta = 0$, the CDF is given by


    $$F_X(x; \sigma) = \frac{1}{2} + \frac{1}{\pi} \arctan \left( \sinh \left( \frac{x}{\sigma}
    \right) \right).$$


    It is interesting to compare the four main distributions we have mentioned thus
    far: Gaussian, Laplace, Huber, and Cosh. This is provided in Figure 3.5. Both
    Cosh and Huber ($\delta = 1.345$) look similar to one another, whereas Laplace
    and Gaussian are quite different. In robust statistics, the Laplace distribution
    is considered to have heavy tails. It is outlier-friendly because heavy tails
    imply a higher probability for the occurrence of outliers. That is, outliers are
    easily accommodated by the PDF of the Laplace distribution without affecting the
    model greatly, specifically, the mean and the variance. This makes it more robust
    to outliers. In contrast, the Gaussian distribution has light tails so outliers
    can have a significant effect on the mean and variance. Therefore, the Gaussian
    distribution is less suitable for outliers. Notice that the Cosh distribution
    has heavier tails which is similar to the Laplace distribution. In the case of
    Huber, the moderate tails are not as heavy as Cosh due to the fact that $\delta
    = 1.345$. However, it can be made heavier by reducing the value of $\delta$, or
    lighter by increasing its value.


    The importance of the different distributions should now be clear. Each one has
    a different sensitivity to outliers. When we select a certain loss function, we
    are forcing the residuals of the regression to follow'
