    # ## 12.4.2 Case Study: Neural Networks


    In the previous section, the focus was on the issue of model interpretability
    in the context of logistic regression but this comprises only one component of
    the field of XAI. In a broader context, XAI refers to a set of processes and methods
    that make the results and workings of AI models understandable to humans. It involves
    interpretability, transparency, trust, and bias. Most of the activity is focused
    on neural networks where the challenges are much greater.


    Consider Figure 12.20 which shows a 4-input, 1-output model for logistic regression,
    and a neural network. There are only 5 parameters in logistic regression but there
    are 65 parameters in the neural network. Interpretability is straightforward in
    logistic regression because there is a one-to-one correspondence between the variables
    and the parameters. This is not the case in the neural network. It is very difficult
    to sequence through the same steps as done in the previous section to understand
    how each weight in the neural network controls the outcome and how to interpret
    the results. There are so many parameters and nonlinearities in the network that
    the complex relationships between the input and output are hard to unwind.


    Taking it to the extreme, in generative AI today, there are up to 32,000 inputs
    (referred to as tokens), and up to 50,000 probabilistic (i.e. softmax) outputs
    in the large language models (LLMs) of tools like ChatGPT. The number of trained
    parameters exceeds 1.5 trillion. The meaning of XAI is quite different in this
    setting. Due to the “black-box” nature of neural networks, especially for deep
