  md: 'It is commonly known as the mean of the distribution. We are also interested
    in the second moment as follows:


    \(\mathbb{E}[X^2] = \int_{-\infty}^{\infty} x^2 f_X(x) dx.\)


    The reason for our interest in the second moment is that the variance can be expressed
    in terms of this quantity. In particular, the variance of X can be expressed using
    the two expectations above as


    \(\text{Var}(X) = \mathbb{E}[X^2] - \mathbb{E}[X]^2;\)


    that is, the second moment minus the first moment squared is the variance. Intuitively,
    this gives us a measure of spread or variability of the random variable about
    the mean.


    For those unfamiliar with the expectation represented as \(\mathbb{E}[X]\), there
    is a simple way to think about it. Every time it is encountered, view E as an
    averaging operator on X. If you draw \(x_i\) (an observation of X) from a distribution
    n times, then the average, \(\frac{1}{n} \sum_{i=1}^n x_i\), is an estimate of
    the expectation. Now if you draw \(x_i\) an infinite number of times and take
    the average, you obtain the true mean of the distribution which is expressed as
    \(\mathbb{E}[X]\). More rigorously,


    \(\lim_{n \to \infty} \frac{1}{n} \sum_{i=1}^n x_i = \mathbb{E}[X].\)


    In the case of \(\mathbb{E}[X^2]\), it can be viewed simply as \(\frac{1}{n} \sum_{i=1}^n
    x_i^2\), where n goes to infinity. More rigorously,


    \(\lim_{n \to \infty} \frac{1}{n} \sum_{i=1}^n x_i^2 = \mathbb{E}[X^2].\)


    These results follow directly from the Law of Large Numbers and limit theory.


    # ## 2.5 Estimation Background


    Having described the goals of linear regression, the models, the errors, the residuals,
    and two competing loss functions, we will now step back and build up the knowledge
    of how to derive the functions that will lead to the estimates of the slope and
    intercept. We will briefly explore desirable characteristics of estimators and
    how to use them for comparison purposes. This section concludes with a rudimentary
    description of numerical optimization using gradient descent which is how the
    estimates are actually computed.


    # ### 2.5.1 Linear Models


    For problems with one explanatory variable, the equation was shown earlier to
    be


    \(\mathbf{y} = \beta_0 + \beta_1 \mathbf{x}_1 + \varepsilon = \mathbf{X}\beta
    + \varepsilon.\)


    This is referred to as the **simple linear model**. For problems with more than
    one variable, the equation becomes


    \(\mathbf{y} = \beta_0 + \beta_1 \mathbf{x}_1 + \beta_2 \mathbf{x}_2 + \cdots
    + \beta_d \mathbf{x}_d + \varepsilon = \mathbf{X}\beta + \varepsilon.\)


    This is referred to as the **multiple linear model**. If there are n observations
    and d variables, then \(\mathbf{y} \in \mathbb{R}^n\), \(\beta \in \mathbb{R}^{d+1}\),
    \(\mathbf{X} \in \mathbb{R}^{n \times (d+1)}\), and \(\varepsilon \in \mathbb{R}^n\).
    The only difference relative to the simple linear model is that we'
