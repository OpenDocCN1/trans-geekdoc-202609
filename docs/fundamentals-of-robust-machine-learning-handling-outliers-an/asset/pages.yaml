- pgno: 334
  md: '$h(\mathbf{x}_1) = 3$ for Tree 1 and $h(\mathbf{x}_1) = 1$ for Tree 2. Therefore,
    $\mathbb{E}[h(\mathbf{x}_1)] = (3 + 1)/2 = 2.0$. After all the trees are created,
    the average depth of every point is computed in this way. Each data point can
    now be assigned an anomaly score. The following equation is used to calculate
    the anomaly score:


    $s(\mathbf{x}, n) = 2^{-\frac{\mathbb{E}[h(\mathbf{x})]}{c(n)}}, \quad (11.2.1)$


    where $\mathbb{E}[h(\mathbf{x})]$ is replaced with the average depth of a given
    data point $\mathbf{x}$ across all trees. For a dataset with $n$ points, $c(n)$
    is a normalizing factor based on the average of the path lengths of all data points.
    It can be computed using


    $c(n) = 2(\log(n-1) - 0.577) - \frac{2(n-1)}{n}. \quad (11.2.2)$


    Table 11.1 shows the anomaly scores based on Figure 11.8. Points 1 and 4 seem
    to have the highest scores. Examining Figure 11.8, both points seem to be at the
    edge of the dataset. On the other hand, point 8 is deeply embedded in the data
    so it has the lowest score. This provides some insight into the inner workings
    of the IF approach in identifying anomalies. Points on the periphery of the data
    are candidates for being outliers while points embedded inside the bulk of the
    data are not. Using a threshold of 0.4 would be effective at finding the two anomalies
    in this example (although the example is too small to declare any points as anomalies).


    **Exercise:** For the Isolation Forest shown in Figure 11.8, compute the anomaly
    scores for points 4 and 10.


    **Ans.:** Since $n = 12$, we find that $c(n) = 2(\log(n-1) - 0.577) - \frac{2(n-1)}{n}
    = 1.8$. For point 10, $\mathbb{E}[h(\mathbf{x})] \approx (4 + 7)/2 = 5.5$. Therefore,
    we have


    $s(\mathbf{x}, n) = 2^{-\frac{\mathbb{E}[h(\mathbf{x})]}{c(n)}} = 2^{-\frac{5.5}{1.8}}
    = 0.121.$


    Table 11.1 Anomaly score calculations for Isolation Forest.


    | Point | Tree1 depth | Tree2 depth | E[h(x)] | Anomaly score |

    | :--- | :--- | :--- | :--- | :--- |

    | 1 | 3 | 1 | 2.0 | 0.465 |

    | 2 | 3 | 4 | 3.5 | 0.261 |

    | 3 | 4 | 4 | 4.0 | 0.216 |

    | 4 | 2 | 2 | 2.0 | 0.465 |

    | 5 | 4 | 7 | 5.5 | 0.121 |

    | 6 | 4 | 7 | 5.5 | 0.121 |

    | 7 | 4 | 6 | 5.0 | 0.147 |

    | 8 | 5 | 7 | 6.0 | 0.100 |

    | 9 | 5 | 6 | 5.5 | 0.121 |

    | 10 | 4 | 7 | 5.5 | 0.121 |

    | 11 | 4 | 5 | 4.5 | 0.178 |

    | 12 | 4 | 5 | 4.5 | 0.178 |'
