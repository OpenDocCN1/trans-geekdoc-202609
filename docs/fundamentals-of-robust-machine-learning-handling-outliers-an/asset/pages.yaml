  md: '![](img/f26d7f591c2a080d86425985301266a4_362_0.png)


    # Figure 12.3 Neural network used for Boston Housing dataset.


    As described in Chapter 9, this neural network creates 13 x 39 + 39 = 546 parameters
    which increases the parameter space dramatically. This will allow for a better
    fitting of the model to the data, although there is a high risk of overfitting.
    As a result, we need to establish a methodology to produce a regularized model
    to avoid overfitting.


    Regularization was discussed in detail in Chapter 6. For example, reducing model
    complexity and the use of a ridge penalty function are effective methods to regularize
    models. Regularization can also be performed by controlling the number of iterations
    and this is how we will proceed here. Rather than letting the network converge
    to a set of final parameter values, an early-stopping criteria will be established
    so that a regularized model is produced. To accomplish this, we first divide the
    dataset into a training set and a test set using an 80–20 split. The resulting
    training set has 404 observations and the test set contains the remaining 102
    observations. Then, we place the test set to one side and work with only the training
    set to build the model. To generalize the model, a 10-fold cross-validation (CV)
    scheme (as described in Chapter 6) can be used to find the optimal number of iterations
    with the smallest error.


    The internal workings of a k-fold CV scheme are somewhat opaque to the user. An
    alternative, which is more transparent, is to use a related iterative method whereby
    the training set is randomly divided into CV training and test sets several times.
    In each pass, the two sets are used as if they were one fold of a k-fold CV scheme.
    This so-called k-randomized validations scheme is repeated a number of times,
    say 10 times, to get a similar effect as a 10-fold CV scheme. Accordingly, each
    CV training set can be processed over a large number of iterations to find the
    iteration at which the prediction error on the CV test set is minimized. Then,
    the optimal number of iterations across the 10-folds can be used to build a regularized
    model.


    The results of this procedure are shown in Figure 12.4. The motivation behind
    this idea is based on the bias–variance trade-off. If we iterate too long, we
    end up overfitting. If we do not iterate enough, we are underfitting. The sweet
    spot between the two provides the optimal amount of fitting. The measurement criteria
    of the prediction error on each generated test set are the root-mean-square error
    (RMSE) and'
  merge: -1
  img_proc: true
