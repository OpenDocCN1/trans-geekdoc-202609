    # ## 8.7 Regularization of Logistic Regression


    Binary classification problems also face issues related to the bias–variance trade-off
    (see Chapter 6), more commonly known as overfitting and underfitting. In overfitting,
    we may produce a model that predicts the training set with high accuracy but fails
    to reach the same level of accuracy on the test set. Such a model is said to have
    a high variance and low bias, which implies overfitting. In underfitting, the
    model with high bias and low variance is unable to attain sufficient training
    accuracy due to the lack of enough features. In machine learning, we always seek
    a general model to balance overfitting and underfitting using a variety of different
    techniques.'
