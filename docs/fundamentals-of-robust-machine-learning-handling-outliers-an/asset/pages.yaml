- pgno: 93
  md: 'Any desired function may be used for the loss term, \(\rho(x_i)\), as long
    as it satisfies some minimal set of conditions. Say we are interested in estimating
    some quantity \(\boldsymbol{\beta}\) which is associated with the explanatory
    variables of an \(n \times (d + 1)\) design matrix \(\mathbf{X}\) and the response
    vector \(\mathbf{y}\). Then the M-estimator of \(\boldsymbol{\beta}\) is defined
    as,


    ```

    \(\hat{\boldsymbol{\beta}} = \underset{\boldsymbol{\beta} \in \mathbb{R}^{d+1}}{\text{argmin}}
    \sum_{i=1}^n \rho(r_i),\)

    ```


    where \(r_i = \mathbf{y}_i - \mathbf{x}_i^\top \boldsymbol{\beta}\) is the residual,
    for \(i = 1, \dots, n\). The solution is typically carried out using numerical
    optimization employing some form of gradient descent in the context of machine
    learning.


    For the log-cosh loss, we already determined the loss term to be


    ```

    \(\rho_{\text{LC}}(x) = \log(\cosh(x)).\)

    ```


    Then, it follows that


    ```

    \(\psi_{\text{LC}}(x) = \rho''_{\text{LC}}(x) = \tanh(x)\)

    ```


    and


    ```

    \(\psi''_{\text{LC}}(x) = \rho''''_{\text{LC}}(x) = \text{sech}^2(x).\)

    ```


    Hence, the first and second derivatives can be easily derived and all functions
    are continuous. This is important for machine learning applications. We desire
    functions that are continuously differentiable to avoid numerical issues in convergence
    during gradient descent.


    The three functions are illustrated in Figure 3.2. Since \(\psi''_{\text{LC}}(x)\)
    is always positive, this implies that the loss function is strictly convex and
    optimizing it provides a unique solution (unlike \(L_1\)). The corresponding log-cosh
    (LC) estimator, given by


    ```

    \(\hat{\boldsymbol{\beta}}^{\text{LC}} = \underset{\boldsymbol{\beta} \in \mathbb{R}^{d+1}}{\text{argmin}}
    \sum_{i=1}^n \log(\cosh(r_i)),\)

    ```


    can be solved in a straightforward manner using convex optimization due to the
    fact that it is globally convex. That is, the second derivative of \(\rho_{\text{LC}}(x)\)
    is always non-negative which is the condition for convexity of the loss function.


    # ### 3.4.1 Asymptotic Behavior


    The asymptotic behavior of \(\log(\cosh(x))\) involves analysis as \(x \to \infty\),
    \(x \to -\infty\) and \(x \to 0\). Recall that


    ```

    \(\cosh(x) = \frac{e^x + e^{-x}}{2}.\)

    ```


    Starting with the first case, as \(x \to \infty\), \(\cosh(x) \to e^x/2\). Then,
    in the limit,


    ```

    \(\log(\cosh(x)) \approx x - \log(2).\)

    ```'
