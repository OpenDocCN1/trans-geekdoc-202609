    underfitting.


    If we were to blindly carry out the two options, we would likely select the overfitted
    case because the errors are small. But there is a better solution between the
    overfitted and underfitted cases that is more general. Here, a simple linear model
    would suffice. We could try several models in between and choose the best one
    but the problem is that if we use the errors as a guide, we would always pick
    the overfitted case. Another approach is needed to address the problem of selecting
    the proper **model complexity**, and it is based on the bias–variance trade-off.


    Note: The next section provides details of the bias–variance trade-off for those
    who want to understand it at a fundamental level. It contains mathematical analysis
    to clarify and reinforce the concepts. It is possible to skip this section without
    any loss of continuity, although it is highly recommended as it is an important
    concept in machine learning.


    # 6.3 The Bias–Variance Trade-Off


    Since the error of a model between the true value and predicted value, \( y -
    \hat{y} \), cannot help us to decide which model is better, a different metric
    is needed. For example, the error between the estimated parameter and the true
    parameter, \( \hat{\theta} - \theta \), is a viable option. This quantity can
    be positive or negative for different'
