    # ### 12.3.4 Robustness Coefficient for Log-Cosh


    In this section, the goal is to select an appropriate value for the robustness
    coefficient, a, for LCLR. The loss function for logistic regression using the
    log-cosh function is given by


    ```

    $$J^{\text{LCLR}}(\boldsymbol{\beta}) = \sum_{i=1}^n \frac{1}{a} \log(\cosh(a(y_i
    - p_i)))$$

    ```


    where \(p_i = 1/(1 + e^{-x_i^T \boldsymbol{\beta}})\) as described in Chapter
    8.


    To demonstrate how to select a suitable value of a, we use the Titanic dataset,
    but this value will be suitable for all other binary classification problems.
    Four values of a are considered for comparison purposes, specifically a = 1, 2,
    5, and 10. Using these values, the histograms of the residuals are plotted in
    Figure 12.12 for the four cases along with all the metrics and confusion matrices
    described in the previous section. The histogram in the top-left corner is very
    similar to the one for CELR in Figure 12.10. In fact, the accuracy and F1 scores
    are about the same as CELR. This is why a = 1 is not a suitable level of robustness.
    Also note that with a = 1 or 2, the outliers are not clearly visible based on
    the histograms. Some can be observed near +1 but only a few at -1. However, as
    a increases, the outliers begin to emerge'
