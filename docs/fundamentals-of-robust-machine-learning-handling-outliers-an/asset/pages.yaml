    Next, consider multiple outliers in the dataset, as in Figure 4.2. There are four
    different cases to study the effects of increasing the number of outliers in the
    data. The datasets of Figure 4.2 (a), (b), (c) and (d) have 0, 2, 4, and 6 outliers,
    respectively. As more outliers are added, the line associated with LS shifts toward
    the outliers, while the line based on LC remains relatively stable. This figure
    gives us an indication of how easily LS estimates can shift due to a few outliers.
    The question is, why is this happening? The details were described earlier in
    the book but the simple answer is that the quadratic loss function associated
    with LS amplifies the error due to the outlier by squaring it. That makes outliers
    more important than the data itself. Therefore, in order to reduce the error and
    satisfy the LS condition (the residuals must sum to 0), the regression line is
    forced to be closer to the outliers. Unfortunately, this is the opposite of what
    should happen because we want the line to be closer to the inliers. Again, the
    results are different in all four cases for LS but stable for LC.


