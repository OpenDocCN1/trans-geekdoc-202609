  md: 'comparison of this sort. For higher dimensional problems, it is impossible
    to render the results in this way. We need better qualitative and quantitative
    measures to compare two or more approaches, especially in higher dimensions.


    This section describes ways to properly compare and evaluate different methods
    for quantile regression. The most important criteria should be related to monotonicity,
    but others related to the severity of crossing problems are also important. In
    Section 7.9, the standard errors will be used as another comparison measure. However,
    if a quantile regression method has crossing problems, then all the other error
    measures would seem to be less important.


    # 7.6.1 Qualitative Assessment


    One way to check for the crossing problem is to count the number of points below
    a line or hyperplane against the target number implied by the \(\tau\) parameter.
    The larger the value of \(\tau\), the more points we expect below the line. This
    way, the overall performance of different methods can be evaluated against the
    ideal case or by comparing the total number of crossing problems encountered by
    each method. This method scales easily to multiple dimensions since it reduces
    to a counting exercise.


    For example, the 0th percentile (\(\tau = 0\)) should have 0 points below the
    corresponding regression line. As \(\tau\) increases from 0.0 to 1.0, the number
    of points should increase monotonically from 0 to \(n\). The 100th percentile
    (\(\tau = 1.0\)) should have all \(n\) points below the regression line. If these
    requirements are not satisfied, then the desired monotonicity property of quantiles
    has been violated. In effect, the quantile method has encountered the crossing
    problem.


    Rather than plotting the data and the regression lines, the procedure is to plot
    the “points below line” or “points below hyperplane” (as the case may be) against
    \(\tau\). We call this type of plot a quantile-points (QP) plot. Such a plot is
    reminiscent of the QQ plot of Chapter 4 and can be interpreted in a similar way.
    Hence, the ideal line is a diagonal line from corner to corner as in a QQ plot.
    Likewise, we want the QP plot of a quantile regression method to closely follow
    the ideal one when plotted together.


    To illustrate the nature of a QP plot, consider Figure 7.7. In this small dataset
    with \(n = 10\), the \(x\)-axis is between 0.0 and 1.0 and the \(y\)-axis is between
    0 and 10. Ideally, the points should lie directly on the diagonal line, as shown
    in the left panel, which means that the quantile method is working perfectly.
    On the right panel, a more realistic QP plot is shown which clearly does not trace
    a path along the diagonal. Each point on the plot is the result of a quantile
    regression with a specific value of \(\tau\) followed by a counting of the points
    below the line or hyperplane. This provides a qualitative assessment of the associated
    method for quantile regression. The QP plot can have peaks and valleys as well
    as flat regions.


    We define a “dip” as any point along the QP plot where there is a decrease in
    value, rather than an increase or a flat region. To understand the definition
    of a dip, consider the following example. We compute the number of points below
    the line beginning at the 0th percentile and ending at the 100th percentile, visiting
    each percentile in between. Assume that, after running standard quantile regression
    up to the 76th percentile, we obtain the results shown in Table 7.1.


