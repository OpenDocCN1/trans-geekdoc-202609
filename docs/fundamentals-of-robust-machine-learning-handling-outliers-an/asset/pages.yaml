  md: '# 4.10 Summary


    This chapter began with methods for diagnosis, detection, and removal of outliers.
    Often, there is a need to have outlier-free datasets since much of the current
    infrastructure for machine learning is built on this assumption. There are also
    many statistical procedures that require clean datasets. One of the key points
    of this chapter is that the best way to deal with outliers is to examine the residuals
    of a robust regression rather than the explanatory and response variables.


    The diagnosis phase involves checking whether any outliers exist in the dataset.
    Boxplots and histograms are useful for this purpose. In detection, the goal is
    to determine the approximate number of such outliers. Here, various edit rules
    can be applied. Robust rules, such as 4.5-MAD or 1.5-IQR, are most effective.
    A quad-plot for residuals that incorporates a boxplot, a QQ-plot, a histogram,
    and ordered absolute residuals was introduced. In the removal phase, the process
    of deleting outlier rows of the dataset must be done carefully or risk removing
    rows with valuable data. An iterative boxplot approach was described for this
    purpose. This is a simple but effective method of removing outliers without inadvertently
    removing inliers.


    The chapter concluded with the topics of robust metrics and standardization. Robust
    metrics should be used alongside non-robust metrics in order to ensure that models
    are accurate. In particular, MAE is robust and should always be used alongside
    MSE or RMSE. In addition, standardization should be carried out using robust statistics
    to retain information about outliers, as traditional methods tend to hide them.


