- pgno: 282
  md: 'which would be lengthy and somewhat repetitive, we focus on three specific
    cases that are representative of all the other cases: $w_3, b_0, \text{and } w_{23}$.
    Each one is highlighted in the figure with an arrow that starts from the loss
    function at the output and traces a path backwards to the weight or bias of interest.
    The arrows represent the sequence of partial derivatives that are needed for the
    gradient computation, as will be seen shortly.


    The process begins by finding the partial derivatives of the cross-entropy loss
    function with respect to each of the parameters. The loss function for the \(i\)th
    row of the training set is given by


    ```

    J^{\text{CE}}(p_i) = -y_i \log(p_i) - (1-y_i) \log(1-p_i). \quad (9.5.5)

    ```


    Consider weight \(w_3\) as the first parameter of interest to us since it is directly
    related to the output. The question is, how should we change \(w_3\) to reduce
    the loss? The answer is to find its associated gradient, which provides information
    about the amount and direction of the change. To obtain the gradient for \(w_3\),
    we use the chain rule:


    ```

    \frac{\partial J^{\text{CE}}(\boldsymbol{w})}{\partial w_3} = \frac{\partial J^{\text{CE}}(p_i)}{\partial
    p_i} \frac{\partial p_i}{\partial z_{\text{out},i}} \frac{\partial z_{\text{out},i}}{\partial
    w_3}. \quad (9.5.6)

    ```


    The arrow associated with \(w_3\) in the diagram of Figure 9.5 refers to this
    chain rule of partial derivatives. Using the cross-entropy loss and sigmoid functions,
    the needed partial derivatives are multiplied to obtain


    ```

    \frac{\partial J^{\text{CE}}(\boldsymbol{w})}{\partial w_3} = \left( -\frac{y_i}{p_i}
    + \frac{1-y_i}{1-p_i} \right) p_i (1-p_i) a_{i3} = -(y_i - p_i) a_{i3}. \quad
    (9.5.7)

    ```


    Then, considering all \(n\) rows of the training set,


    ```

    w_3^{(t+1)} = w_3^{(t)} - \ell \times \frac{\partial J^{\text{CE}}(\boldsymbol{w})}{\partial
    w_3} = w_3^{(t)} - \ell \times \sum_{i=1}^n (y_i - p_i)(-a_{i3}). \quad (9.5.8)

    ```


    Now we know exactly how to change \(w_3\) in each iteration.


    The general expression for all four weights connected to the output is


    ```

    w_k^{(t+1)} = w_k^{(t)} - \ell \times \frac{\partial J^{\text{CE}}(\boldsymbol{w})}{\partial
    w_k} = w_k^{(t)} - \ell \times \sum_{i=1}^n (y_i - p_i)(-a_{ik}), \quad (9.5.9)

    ```


    for \(k=1, 2, 3, 4\), which are the indices for the hidden units.


    The update equation for the bias term \(b_0\) can be obtained with minor changes
    to the above equation. Specifically, the arrow in Figure 9.5 associated with \(b_0\)
    has a fixed input value of \(a_0 = 1\). After using this value in the above equation,
    the update equation for \(b_0\) becomes


    ```

    b_0^{(t+1)} = b_0^{(t)} - \ell \times \frac{\partial J^{\text{CE}}(b_0)}{\partial
    b_0} = b_0^{(t)} - \ell \times \sum_{i=1}^n (y_i - p_i)(-1). \quad (9.5.10)

    ```


    In summary, the weight and bias update equations are (Step 5)


    ```

    \begin{bmatrix} w_1 \\ w_2 \\ w_3 \\ w_4 \end{bmatrix}^{(t+1)} = \begin{bmatrix}
    w_1 \\ w_2 \\ w_3 \\ w_4 \end{bmatrix}^{(t)} - \ell \begin{bmatrix} \frac{\partial
    J^{\text{CE}}(\boldsymbol{w})}{\partial w_1} \\ \frac{\partial J^{\text{CE}}(\boldsymbol{w})}{\partial
    w_2} \\ \frac{\partial J^{\text{CE}}(\boldsymbol{w})}{\partial w_3} \\ \frac{\partial
    J^{\text{CE}}(\boldsymbol{w})}{\partial w_4} \end{bmatrix},

    ```'
