    # 2.5.4 Gradient Descent


    The majority of the techniques to be described in the rest of this book involve
    optimizing a loss function to obtain estimates of the parameters of interest.
    Therefore, it is worth spending some time on the desirable characteristics of
    loss functions and, in particular, the convexity property.


    Figure 2.4 shows two hypothetical loss functions, labeled as f(x). The one in
    the left panel is a non-convex function. It has three minima: one global minimum
    (A) and two local minima (B and C). This type of function is difficult to optimize
    in general since the techniques typically used may end up at one of the two local
    minima instead of the global minimum. The panel on the right shows a convex function
    with only one minimum value and it is rather straightforward to optimize this
    type of function. Whenever possible, the loss function that we use in machine
    learning applications should be convex with a unique solution. However, it is
    not always possible to find such a function, especially in the case of neural
    networks. Nevertheless, we usually find a minimum (whether it be local or global)
    using a numerical optimization technique and generate estimates associated with
    this point.


    One of the many ways to check for convexity is to take the second derivative of
    the loss function and see if it is non-negative. If so, then the function is convex
    and there is a unique solution available. If not, then there may be multiple solutions
    or an infinite number of solutions. In fact, having a strictly convex loss function
    is highly desirable and leads to unique solutions.


    ![](img/f26d7f591c2a080d86425985301266a4_68_0.png)'
