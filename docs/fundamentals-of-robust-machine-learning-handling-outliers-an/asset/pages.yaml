- pgno: 16
  md: '# Preface


    Outliers are part of almost every real-world dataset. They can occur naturally
    as part of the characteristics of the data being collected. They can also be due
    to statistical noise in the environment that might be unavoidable. More commonly,
    they are associated with measurement error or instrumentation error. Another source
    is human error, such as typographical errors or misinterpreting the measurements
    of a device. If there are extreme outliers, they are often referred to as anomalies.
    Sometimes, the true data is differentiated from outliers by calling them inliers.
    While outliers may represent a small portion of the dataset, their impact can
    be quite significant.


    The machine learning and data science techniques in use today largely ignore outliers
    and their potentially harmful effects. For many, outliers are somewhat of a nuisance
    during model building and prediction. They are hard to detect in both regression
    and classification problems. Therefore, it is easier to ignore them and hope for
    the best. Alternatively, various ad hoc techniques are used to remove them from
    the dataset even at the risk of inadvertently removing valuable inlier data in
    the process. But we have reached a point in data science where these approaches
    are no longer viable. In fact, new methods have emerged recently with great potential
    to properly address outliers and they should be investigated thoroughly.


    The cost of ignoring this under-reported and often overlooked aspect of data science
    can be significant. In particular, outliers and anomalies in datasets may lead
    to inaccurate models that result in making bad business decisions, producing questionable
    explanations of cause-and-effect, arriving at the wrong conclusions, or making
    incorrect medical diagnoses, just to name a few. A prediction is only as good
    as the model on which it is based, and if the model is faulty, so goes the prediction.
    Even one outlier can render a model unusable if it happens to be in the wrong
    location. Machine learning practitioners have not yet fully embraced a class of
    robust techniques that would provide more reliable models and more accurate predictions
    than is possible with present-day methods. Robust methods are better-suited to
    data science, especially when outliers are present. The overall goal of this book
    is to provide the rationale and techniques for robust machine learning and then
    build on that material toward robust data science.


    This book is a comprehensive study of outliers in datasets and how to deal with
    them in machine learning. It evaluates the robustness of existing methods such
    as linear regression using least squares and Huber’s method, and binary classification
    using the cross-entropy loss for logistic regression and neural networks, as well
    as other popular methods including k-nearest neighbors, support vector machines
    and random forest. It provides a number of new approaches using the log-cosh loss
    which is very important'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'in robust machine learning. Furthermore, techniques that surgically remove
    outliers from datasets for both regression and classification problems are presented.
    The book is about the pursuit of methods and procedures that recognize the adverse
    effects that outliers can have on the models built by machine learning tools.
    It is intended to move the field toward robust data science where the proper tools
    and methodologies are used to handle outliers. It introduces a number of new ideas
    and approaches to the theory and practice of robust machine learning and encourages
    readers to pursue further investigation in this field.


    This book offers an interdisciplinary perspective on robust machine learning.
    The prerequisites are some familiarity with probability and statistics, as well
    as the basics of machine learning and data science. All three areas are covered
    in equal measure. For those who are new to the field and are looking to understand
    key concepts, we do provide the necessary introductory and tutorial material in
    each subject area at the beginning of each chapter. Readers with an undergraduate-level
    knowledge of the subject matter will benefit greatly from this book.


    You may have heard the phrase “regression to the mean.” In this book, we discuss
    “regression to the median.” The methods currently in use target the **mean** of
    the data to estimate the model parameters. However, the **median** is a better
    target because it is more stable in the presence of outliers. It is important
    to recognize that data science should be conducted using methods that are reliable
    and stable which is what the median-based approach can offer. There are good reasons
    why we frequently hear phrases like “the median house price” or “the median household
    income.” It holds the key to building outlier-tolerant models. Furthermore, robust
    methods offer stability and accuracy with or without outliers in the dataset.


    We use the term “robust machine learning” as many of the techniques originate
    in the field of robust statistics. The term “robust” may seem somewhat unusual
    and confusing to some, but it is a well-established term in the field of statistics.
    It was coined in the 1950s and has been used ever since. Note that the term robust
    machine learning has been used in other contexts in the literature, but here we
    specifically refer to “outlier-tolerant” methods.


    One may wonder why robust methods have not already been incorporated into machine
    learning tools. This is in part due to the long history of the non-robust estimation
    methods in statistics and their natural migration to the machine learning community
    over the past two decades. Attempts to use the L1 loss function (which is robust)
    were not successful in the past, whereas the L2 loss (which is not robust) was
    much easier to understand and implement. It is strongly tied to the Gaussian distribution
    which made it even more compelling, especially in terms of the maximum likelihood
    procedure. The same can be said of the cross-entropy loss used in binary classification.
    Most practitioners today are still employing least squares and cross-entropy methods,
    both of which are not robust in the presence of outliers. We will show that the
    log-cosh loss is robust, that it can be derived using maximum likelihood principles
    and inherits all the nice properties required of a loss function for use in machine
    learning. This removes all the past reasons for not using robust methods.


    The approach taken in this book regarding outliers is to show how to robustify
    existing methods and apply them to data science problems. It revisits a number
    of the key machine tasks such as clustering, linear regression, logistic regression,
    and neural networks, and describes how they can all be robustified. It also covers
    the use of penalty estimators in the context of robust methods. In particular,
    the ridge, LASSO, and aLASSO methods are described. They are evaluated in terms
    of their ability to mitigate the effects of outliers. In addition, some very interesting
    approaches are described for variable ordering using aLASSO.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Outlier detection for regression and classification problems are addressed
    in detail. Previous approaches have not been able to perform this function without
    removing valuable data along with the outliers. The methods are essentially ad
    hoc in nature. In this book, practical solutions are provided using robust techniques.
    Of note is an iterative boxplot method for linear regression and a histogram-based
    method for classification problems. Anomaly detection is another form of outlier
    detection where the outliers are at extreme locations and represent unusual and
    unexpected occurrences in the dataset. Identifying such anomalies is very important
    in the detection of suspicious activity such as bank fraud, spam in emails, and
    network intrusion. The techniques to be described in this book include k-nearest
    neighbors (k-NN), DBSCAN, and Isolation Forest as they are popular techniques
    in this category. Also included is a new method based on robust statistics and
    k-medians clustering called MADmax, which is shown to provide better results than
    current methods.


    We wanted to write a book suitable for senior-level (or fourth year) undergraduate
    and first/second-year graduate students, that is also useful as a stand-alone
    guide for researchers or practitioners in the field. As a result, there are equal
    parts of the theory and practice. Detailed derivations, theoretical support for
    the methods, as well as a substantial amount of “know-how” and experience are
    part of every chapter with code segments that can be executed by the reader to
    improve understanding. We found that when we view existing methods through the
    lens of outliers, it leads to a deeper understanding of how current methods work
    and why they may fail. In this sense, some new knowledge will be gained in every
    chapter.


    The programming code provided in this book are based on Python which is the workhorse
    language for the machine learning community. Many libraries and utilities are
    available in Python. We introduce code segments for all of the techniques for
    regression and classification, as well as the code for outlier removal in the
    form of projects at the end of each chapter. The reader would be well-served to
    follow along the descriptions in the book while implementing the code wherever
    possible in Python. This is the best way to get the most out of this book.


    The book is spread out over 12 chapters. Chapter 1 begins with an introduction
    to machine learning and the importance of considering outliers in both regression
    and classification problems. Then, the k-means clustering algorithm is described
    and transformed into a k-medians algorithm as an example of the robustification
    of an existing method. Chapter 2 covers the L1 and L2 loss functions and describes
    a combination of the two called Huber’s method. Chapter 3 provides a detailed
    analysis of the log-cosh loss function. Chapter 4 discusses outlier detection,
    metrics, and standardization. Chapters 5 and 6 address robust penalty estimation
    using ridge, LASSO, and aLASSO. Chapter 7 introduces a flexible log-cosh loss
    function for quantile regression. Chapters 8–10 address the binary and multi-class
    classification problems and the robustness of various methods for these tasks.
    Chapter 11 addresses the important topic of anomaly detection. Finally, Chapter
    12 concludes with applications of robust methods to some well-known data science
    problems.


    A suitable undergraduate course in robust machine learning would consist of Chapters
    1–6 and a graduate course would consist of Chapters 7–12. For practitioners, we
    recommend Chapters 1, 4, and 8–12. For researchers, we recommend Chapters 1–3,
    5–7, and 12. It is our hope that readers will find something of value in each
    chapter, and that it will lead to many fruitful areas of future research and development.


