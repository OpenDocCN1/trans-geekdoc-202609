  img_proc: true
- pgno: 120
  md: 'data (25th, 50th, and 75th percentiles) and determine if any data points lie
    well above the 75th percentile or well below the 25th percentile. If so, they
    are declared as outliers.


    The process for creating a boxplot is as follows:


    +   - First, find the median (Q2), the 25th percentile (Q1), and 75th percentile
    (Q3). The data between the 25th and 75th percentiles defines the inter-quartile
    range (IQR) where 50% of the data resides.

    +   - For visualization purposes, place a bounding box between the 25th and the
    75th percentiles and a line inside the box at exactly the 50th percentile (the
    median). The rest of the data lies outside this box.

    +   - Next, we want to identify a reasonable range of values outside this box
    where the data would still be considered inliers. A rule-of-thumb is to use 1.5
    × IQR as the range on each side. We indicate this range in the boxplot with a
    line-and-whiskers demarcation.

    +   - The whiskers extend from Q1 to the smallest data point above Q1 – 1.5 ×
    IQR and from Q3 to the largest data point below Q3 + 1.5 × IQR. This may lead
    to asymmetry in the whisker length on each side.

    +   - All values outside this range are flagged as outliers and marked with circles
    above and below the whiskers, as the case may be.


    Three examples of boxplots for three different variables are shown in Figure 4.3.
    In each case, the line in the middle of the box represents the median of the plotted
    data. The box itself shows the range from the 25th percentile (Q1) to the 75th
    percentile (Q3), which is the IQR. The extended lines terminate at the whiskers,
    and this represents the degree of dispersion of the given data. The lower and
    upper bounds are calculated as Q1 – 1.5 × IQR and Q3 + 1.5 × IQR, respectively,
    with whiskers terminating at the lowest and highest data values in those regions,
    respectively.


    ![](img/f26d7f591c2a080d86425985301266a4_120_0.png)


    Figure 4.3 Example boxplots for different sample sets. Note that the rightmost
    plot clearly shows outliers outside the whiskers.'
