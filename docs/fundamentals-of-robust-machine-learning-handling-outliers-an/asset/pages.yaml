- pgno: 329
  md: '# 11.2.2 DBSCAN


    To handle very large datasets, an approach based on clustering can be very effective.
    The idea is that if clusters can be formed using the data, then any points not
    in the clusters must be anomalies. This is the rationale behind an approach called
    DBSCAN which was originally developed for robust clustering. As such, it is an
    alternative to the k-medians clustering approach described in Chapter 1. DBSCAN
    stands for Density-Based Spatial Clustering of Applications with Noise. This density-based
    clustering method attempts to identify high-density regions of the feature space
    to create many clusters that can take on arbitrary sizes and shapes. The regions
    between clusters are defined as low-density areas where outliers will be found.


    Every data point in the dataset is placed into one of three categories. A core
    point is one that is in close proximity to a given number of other points in its
    immediate vicinity defined by a radius, ε. A border point is defined as a point
    with not enough neighbors within this radius. The remaining points that are not
    identified as core or border points are declared as outliers. Hence, outliers
    are found as a side effect of the clustering process. The user-defined hyperparameters
    in DBSCAN are the radius, (referred to as eps), and the minimum number of points
    to identify a core point (referred to as MinPts).


    Figure 11.4 illustrates the DBSCAN definitions on a small dataset showing the
    core points, border points, and outliers. The radius value used to decide on the
    core vs. border points is eps = 0.2 in this example, and the minimum number of
    neighboring points is MinPts = 10. Regardless of their shapes, DBSCAN will be
    able to find all clusters in the dataset. Originally, DBSCAN was intended to be
    used as a clustering method but it inherently detects outliers so it is often
    repurposed as an anomaly detector. For our purposes, core and border points will
    be considered as inliers. The rest are declared as anomalies.


    To understand the effect of eps and MinPts on the results, consider Figure 11.5
    which shows DBSCAN used as an anomaly detector on a dataset given earlier in Figure
    11.1. Each plot shows the


    ![](img/f26d7f591c2a080d86425985301266a4_329_0.png)


    Figure 11.4 Example of DBSCAN applied to a randomly generated dataset showing
    the border and core points, and the outliers, given that eps = 0.2 and MinPts
    = 10.'
  merge: -1
  img_proc: true
