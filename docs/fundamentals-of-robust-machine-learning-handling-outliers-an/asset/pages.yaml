    to determine the softmax probabilities of the three outputs along with their partial
    derivatives with respect to the raw output of interest $z_1$:


    $p_1 = \frac{e^{z_1}}{e^{z_1} + e^{z_2} + e^{z_3}} \Rightarrow \frac{\partial
    p_1}{\partial z_1} = \frac{e^{z_1}(e^{z_2} + e^{z_3})}{(e^{z_1} + e^{z_2} + e^{z_3})^2}
    = p_1(1 - p_1),$

    $p_2 = \frac{e^{z_2}}{e^{z_1} + e^{z_2} + e^{z_3}} \Rightarrow \frac{\partial
    p_2}{\partial z_1} = - \frac{e^{z_1 + z_2}}{(e^{z_1} + e^{z_2} + e^{z_3})^2} =
    -p_1 p_2,$

    $p_3 = \frac{e^{z_3}}{e^{z_1} + e^{z_2} + e^{z_3}} \Rightarrow \frac{\partial
    p_3}{\partial z_1} = - \frac{e^{z_1 + z_3}}{(e^{z_1} + e^{z_2} + e^{z_3})^2} =
    -p_1 p_3.$


    We also know that $p_1 + p_2 + p_3 = 1$ which we will make use of later. Using
    the categorical CE loss for row 1, represented as $\mathbb{L}_{r1}^{CE}$, we find
    that


    $\mathbb{L}_{r1}^{CE} = -y_1 \log p_1 - y_2 \log p_2 - y_3 \log p_3.$


    Next, we need to select a weight and find its associated gradient. Initially,
    we select $w_1$ which is multiplied by $a_1$ to produce one component of $z_1$
    as indicated by the arrow in Figure 10.2. Hence, $\partial z_1 / \partial w_1
    = a_1$. The full gradient will be composed of three terms, one for each output
    (see three arrows leaving $z_1$) as follows:


    $\frac{\partial \mathbb{L}_{r1}^{CE}}{\partial w_1} = \frac{\partial \mathbb{L}_{r1}^{CE}}{\partial
    p_1} \frac{\partial p_1}{\partial z_1} \frac{\partial z_1}{\partial w_1} + \frac{\partial
    \mathbb{L}_{r1}^{CE}}{\partial p_2} \frac{\partial p_2}{\partial z_1} \frac{\partial
    z_1}{\partial w_1} + \frac{\partial \mathbb{L}_{r1}^{CE}}{\partial p_3} \frac{\partial
    p_3}{\partial z_1} \frac{\partial z_1}{\partial w_1}$

    $= - \frac{y_1}{p_1} p_1 (1 - p_1) a_1 - \frac{y_2}{p_2} (-p_1 p_2) a_1 - \frac{y_3}{p_3}
    (-p_1 p_3) a_1$

    $= -y_1 (1 - p_1) a_1 - y_2 (-p_1) a_1 - y_3 (-p_1) a_1$

    $= -y_1 a_1 - (y_1 + y_2 + y_3)(-p_1) a_1 = -(y_1 - p_1) a_1.$


    ![](img/f26d7f591c2a080d86425985301266a4_306_0.png)


    Figure 10.2 A four-layer neural network with a softmax activation.'
