  md: '# 10

    Multi-class Classification and Adam Optimization


    # 10.1 Introduction


    This chapter addresses multi-class classification problems using neural networks
    (NNs) and the details of their optimization during training. First, the loss functions
    for multi-class problems are described which require categorical versions of the
    cross-entropy and log-cosh loss functions. Then, the sigmoid function is extended
    to incorporate multiple outputs leading to the softmax activation function. The
    implementation of the softmax activation function is described in detail. It involves
    a slightly more complicated calculation of the gradients than the sigmoid function
    used in Chapters 8 and 9. This is followed by an example of a multi-class problem
    solved using neural networks. Specifically, the MNIST dataset is used as the demonstration
    vehicle to identify the advantages of using a robust loss function for this type
    of problem.


    To close the chapter, a number of different algorithms that comprise the Adam
    optimization technique will be described. Advanced algorithms are required in
    deep learning to navigate through the complicated optimization landscapes posed
    by neural networks, such as plateaus and ravines. These techniques include momentum,
    rmsprop and warm-up procedures. It should be noted that deep learning (see Haykin
    2009; James et al. 2023) would not be possible without these advanced methods.
    While the primary aim of this chapter is to compare the cross-entropy neural network
    (CNN) with the log-cosh network (LCNN), it is important to understand that the
    foundational elements such as multi-class classification, categorical loss functions,
    the softmax activation function, and the Adam optimizer are crucial for the development
    of large language models (LLMs) used in today''s generative AI tools. These components
    will be explained in detail, and it is highly recommended that readers study this
    material carefully.


    # 10.2 Multi-class Classification


    In the last two chapters, we focused on classification problems with binary outcomes—either
    0 or 1. However, there are more complex classification scenarios where multiple
    outcomes are possible, but only one is the correct response. For instance, consider
    predicting which of three stores a customer should visit to purchase a certain
    type of product. The outcomes can only be Store A, Store B, or Store C. In this
    case,'
