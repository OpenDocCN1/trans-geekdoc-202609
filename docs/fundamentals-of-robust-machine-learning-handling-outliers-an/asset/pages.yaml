  md: '# Table 11.3 Computing the AUROC for different anomaly detectors using the
    ranks of inliers and outliers. 0 = inliers and 1 = outliers.


    | Rank | Ground truth | Detector 1 | Detector 2 | Detector 3 |

    |------|--------------|------------|------------|------------|

    | 1    | 1            | 1          | 0          | 0          |

    | 2    | 1            | 0          | 0          | 0          |

    | 3    | 0            | 0          | 1          | 0          |

    | 4    | 0            | 0          | 1          | 0          |

    | 5    | 0            | 1          | 0          | 0          |

    | 6    | 0            | 0          | 0          | 0          |

    | 7    | 0            | 0          | 0          | 0          |

    | 8    | 0            | 0          | 0          | 0          |

    | 9    | 0            | 0          | 0          | 1          |

    | 10   | 0            | 0          | 0          | 1          |


    To understand this equation, consider Table 11.3 where the ground truth and the
    hypothetical results of three anomaly detectors are provided. There are only 10
    data points in this small example of which two are outliers. The outliers are
    indicated with 1 and inliers with 0. The rankings of inliers and outliers are
    based on their respective anomaly scores, and rank 1 is the highest while rank
    10 is the lowest. In the Ground Truth column, the two outliers are ranked 1 and
    2. The AUROC for this case is always 1.0. A brute-force way to obtain this value
    is to carry out rank comparisons of outliers with inliers while counting the number
    of inliers above each outlier. A total of M × N comparisons will be performed.
    Starting with a count of 0, each time an inlier is ranked higher than an outlier,
    we add one to the count. Since there are no inliers above the outliers for the
    Ground Truth, the sum is 0. This is divided by M × N and then subtracted from
    1.0. The same steps would be carried out for the three detectors to obtain their
    AUROC values.


    There is an easier way to do this (without the tedious counting process) using
    Eq. (11.5.1). First, we sum the ranks of outliers. Then, we subtract the ideal
    value of this sum which, in general, for M outliers is M(M + 1)/2. For most practical
    anomaly detectors, the sum of the outlier ranks will likely be higher than the
    ideal value. Finally, the difference between the two sums is divided by the total
    number of comparisons, and then subtracted from 1.0 to produce the AUROC. This
    a much easier method because it only requires the ranks of the outliers.


    # Exercise: What is the AUROC of each of detectors 1, 2, and 3 of Table 11.3 based
    on the formula given in Eq. (11.5.1)?


