  md: '# 11

    Anomaly Detection and Evaluation Metrics


    # ## 11.1 Introduction


    Anomaly detection (see Aggarwal 2017) is a form of outlier detection where the
    outliers are at extreme locations and represent unusual and unexpected occurrences
    in the dataset. Identifying such anomalies is typically an unsupervised activity.
    There are a wide variety of anomaly detection methods reported in the literature
    and in common use in machine learning. The techniques to be described in this
    chapter generally involve repurposing well-known machine learning methods, such
    as k-nearest neighbors (k-NN), clustering methods, and tree-based approaches.
    The details of k-NN, DBSCAN, and Isolation Forest will be described as they are
    popular techniques in this category. This will be followed by a new method based
    on robust statistics and k-medians clustering called MADmax which is shown to
    provide better results than current methods.


    For our purposes here, the datasets to be considered are those that would be used
    for clustering. In these datasets, there are data points near each other forming
    one or more clusters, along with other isolated data points far from all clusters
    that we seek to identify using an anomaly detector. Sometimes, a few points will
    be declared as anomalies when they are actually inliers. These are called false
    positives. In other cases, some anomalies are left undetected. These are the false
    negatives. Methods are required to evaluate different anomaly detectors based
    on their ability to limit the number of false designations. The chapter includes
    an examination of various metrics to compare different anomaly detectors.


    # ## 11.2 Anomaly Detection Methods


    In terms of definitions, the term “outlier” is an all-encompassing term whereas
    an “anomaly” is a specific type of outlier that is far from the rest of the data.
    In other words, an anomaly is an extreme outlier that is considered a rare or
    unusual event associated with suspicious activity such as bank fraud, spam, and
    network intrusion. More generally, anomalies are data points in a dataset that
    are somewhat isolated from all other data and occur infrequently. While the difference
    between outliers and anomalies is somewhat subjective, the terms are often used
    interchangeably since many of the techniques find both outliers and anomalies
    depending on the settings of various hyperparameters. However, keep in mind that
    the overall objective here is to find the isolated points in the dataset.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 11.2.1 k-Nearest Neighbors


    The k-NN algorithm is a supervised learning technique that was originally developed
    for classification and regression problems (see Section 8.10.3). In this section,
    it will be redirected toward solving the anomaly detection problem as an unsupervised
    learning technique. The basic idea is to use the average distance of a given data
    point to its k nearest data points to determine whether it should be considered
    as an outlier. If the average distance is large, it is an outlier; if it is small,
    then it is an inlier.


    The quality of the results depends on the number of points, k, used in the computation.
    In the supervised k-NN algorithm, k is some small odd number in binary classification
    so that a majority vote of the neighbors determines the prediction of a new point.
    In regression, it is the average of a small number of k neighbors. In anomaly
    detection, the average distance needs to be computed over many neighbors, so k
    is typically much larger. Usually, the Euclidean distance is used in the distance
    calculation. In some cases, the Manhattan distance can be used as well. Once the
    average distances for all n points in the dataset are calculated, a threshold
    distance is needed to determine if a given point is an inlier or an outlier. Both
    k and the threshold are user-specified hyperparameters. Their proper selection
    is essential in obtaining useful results.


    After choosing k, it is common practice to plot the average distances as a histogram
    to identify the cutoff point between outliers and inliers. The histogram can be
    very useful in identifying the threshold beyond which the outliers can be easily
    identified. However, it is somewhat of a subjective decision since the locations
    of points in a multidimensional space cannot be visualized and therefore the line
    between outliers and inliers is often based on experience. The selection of k
    is somewhat easier. A number of different values of k could be used to find a
    suitable value that clearly separates outliers from inliers. Typically, a larger
    value of k such as k = √n produces better results since the average is taken over
    many points. This makes the average distance more stable for the purposes of threshold
    selection.


    Figure 11.1 shows a sample dataset on the left with four anomalies strategically
    positioned for demonstration purposes. In this example, we assume two features,
    namely x1 and x2. The figure also shows what appears to be three separate clusters.
    Forming these clusters using k-means clustering could be troublesome due to the
    presence of the four anomalies (see Chapter 1). If we found these anomalies and
    removed them, then a clean dataset could be provided to the k-means approach.
    This is one of the reasons to use anomaly detection in data science. As shown,
    the anomalies are far from the clusters and are isolated from the inlier data.
    Therefore, this is a suitable example to illustrate the inner workings of a k-NN
    anomaly detector.


    The k-NN algorithm can be used to identify these anomalies assuming a particular
    size of the neighborhood, say k = 3. First, the average distance of the three
    nearest neighbors is calculated for all data points. Then a histogram plot, shown
    on the right of Figure 11.1, is produced. A suitable number of bins must be selected
    to provide the necessary fidelity for selecting a threshold. In this example,
    10 bins are chosen. The majority of the average distances are squeezed into the
    first two bins which is expected. The anomalies are identified as the extreme
    cases far away from the majority. These outliers can be separated out using a
    threshold, such as 0.3, in which case any data point with a distance above this
    threshold is considered an anomaly.


    Figure 11.2 on the left shows the same dataset with the anomalies identified in
    gray and the inliers in black after using the k-NN method with k = 3 and threshold
    = 0.3. After removal of four detected anomalies from the dataset, the histogram
    on the right is produced. Note that the distribution of distances'
