  md: '# Exercise: What is the AUROC of the anomaly detector represented by the ROC
    curve in Figure 11.17?


    Ans.: Here $N = 90$ and $M = 10$. Then $M(M + 1)/2 = 55$. The sum of the ranks
    is $\sum \text{ranks} = 5 + 8 + 9 + 11 + 12 + 13 + 18 + 23 + 37 + 57 = 193$. Therefore,
    $\text{AUROC} = 1 - \frac{193-55}{10(90)} = 1 - 138/900 = 762/900 = 0.847$.


    If several detectors are plotted together, the ROC tells us how quickly an anomaly
    detector will find most of the outliers and which one is the first to find all
    outliers. Typically, the TPR will increase quickly from the origin. This is because
    at the origin all data are inliers so TPR = 0. Then, as we find outliers the TPR
    increases until we run out of outliers. In some sense, we only care about the
    early part of the ROC curve. After detecting all the outliers, one of the anomaly
    detectors can be declared the winner. Again, the AUROC value provides this information
    in one metric.


