    does not get trapped in the aforementioned plateaus and ravines as readily as
    in the case of the sigmoid function.


    There may be a concern that this relu function is too simple to be useful. In
    contrast, relu works extremely well with gradient descent and is straightforward
    to implement. The relu function is used instead of the sigmoid function in all
    neurons except the output layer. The problem with using the relu function at the
    output is that it can take on values greater than 1. Once the a relu output exceeds
    1, it can no longer be viewed as a probability. Since classification outputs must
    lie in the range [0,1], a sigmoid activation is required at the output.


    > Note: The subject matter in the next two sections is very important. If you
    can follow the descriptions in detail, you will have a deeper understanding of
    how neural networks build a model through a process called training: i.e. finding
    an appropriate a set of values for the weights and biases via optimization. It
    is the core idea that allows training of neural networks to proceed in an orderly
    and efficient manner.


    # 9.4 Training of Neural Networks


    In order to train multilayered neural networks, an approach based on gradient
    descent is used. This is a numerical method that involves finding the minimum
    of a convex region of the objective function using an iterative approach. Essentially,
    given an initial guess of the weights and biases, the slope of the objective function
    at that point is used to decide which direction to take for the next step. So
    we will need to take partial derivatives of the objective function with respect
    to every parameter in the network. The size of the step taken is controlled by
    the learning rate, \(\ell\). If the step is too small, many iterations will be
    required. If too large, the process may not converge at all. After a proper selection
    of \(\ell\), the objective function is evaluated, gradients are computed, and
    parameters are updated in a repeated loop until the iterations converge to some
    nearby minimum.


    While this approach is theoretically appealing, the landscape of the optimization
    space will dictate the number of iterations needed to converge. The true nature
    of the solution space is hard to grasp since the number of dimensions is very
    high. In particular, it is not a convex optimization problem since there may be
    many local minima. Adaptive learning rate adjustments can only go so far in navigating
    a complex configuration space. Many different learning rates must be tried before
    a suitable one is found. But even with a suitable learning rate adjustment strategy,
    the optimization procedure for neural networks may get stuck in ravines with sharp
    edges on each side or plateaus with flat regions in all directions. It may take
    hundreds of thousands of iterations to escape the ravine or find the edge of a
    plateau, if it happens at all.


    To address this type of problem, a well-known improvement to gradient descent
    called **momentum** has been developed to speed up convergence in difficult solution
    spaces. It can be enhanced with'
