    # 8.7.2 k-Fold Cross-Validation


    The standard approach for generalization in logistic regression is to use k-fold
    cross-validation. This subject was described in detail in Chapter 6 and will not
    be repeated here. However, its use in connection with outliers in datasets is
    relevant to our discussion. The main issue is the presence of outliers in the
    training set and the test set and how to interpret the results. First, the training
    set will be partitioned into k folds and each one may have outliers. Therefore,
    the CELR approach will be influenced by outliers as described in the previous
    section, whereas LCLR will exhibit its characteristic robustness to outliers.
    Therefore, the results obtained using k-fold cross validation will usually be
    better for LCLR with outliers present.


    Second, there is a problem with the test set accuracy when outliers are present.
    It is difficult to control the number of outliers in the test set without any
    knowledge of the decision boundary since the test set is constructed using random
    selection from the dataset (before any training). However, after the decision
    boundary has been established, it may result in a number of outliers in the test
    set which would be manifested as classification errors. These outliers can be
    detected and removed using the techniques described in Section 8.9, but this is
    not generally done in practice. Recall that the unseen test set is mainly used
    to confirm the results of the trained model. We are not permitted to adjust its
    contents to achieve better results. The test accuracy might be higher or lower
    than what was achieved during training, but we expect it to be in the same ballpark
    to validate the model. In Figure 8.10, imagine if only outliers appeared in the
    test set. The accuracy would be 0% which is not reflective of the actual performance
    of the robust model. Therefore, it is important to use both the cross-validation
    scores after training and the test scores to evaluate the model due to unpredictable
    effects of outliers in the unseen test set. In general, the two results tend to
    line up if there is enough data to work with using LCLR.


    # 8.7.3 Penalty Functions


    Penalty functions, such as ridge, LASSO, aLASSO, and Enet, were detailed in Chapters
    5 and 6. They are useful for fine-tuning a linear regression model to balance
    overfitting and underfitting—a process called regularization. The cross-entropy
    loss for logistic regression can be regularized using penalty functions in the
    same manner. Regularization in this context can be viewed as a way to adjust the
    parameters until a high accuracy is achieved during cross-validation. This is
    particularly important for CELR since it requires tuning a hyperparameter λ to
    obtain acceptable results. However, for robust logistic regression, there is some
    amount of “auto-regularization” built-in to the loss function so that penalty
    functions are not as essential. For that reason, we present results only for the
    regularization of CELR.'
