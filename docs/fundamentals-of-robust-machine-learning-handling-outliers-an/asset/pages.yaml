    # 6.6 Robust Generalization and Regularization


    The combination of robust generalization and regularization will now be applied
    to the diabetes dataset to select \(\lambda\). Before applying any of these methods,
    one should check to see if there are outliers in the dataset. One approach is
    to use a boxplot on the residuals following a linear regression, as shown in Figure
    6.7. Here, both least squares (LS) and log-cosh (LC) losses are used on the full
    dataset to obtain residuals to create the boxplots (see Chapter 4). The boxplot
    of the LS residuals indicates only one outlier (below the boxplot). The boxplot
    of LC residuals indicates three outliers (one above and two below). The latter
    is of course correct since LS is not robust and therefore not able to find all
    the outliers. This is a key point to remember: detecting outliers requires the
    use of a robust method since LS will try to distribute the residuals as a Gaussian
    which tends to hide some of the outliers.


    Having found three outliers, it is prudent to use robust methods even though the
    inclination would be to ignore the outliers and forge ahead with LS. It is not
    possible to tell how the three outliers will impact the estimates. For the diabetes
    dataset, these three outliers may not have a significant impact but we will not
    take the risk and utilize robust regularization with ridge. One thing to note
    is that the ridge penalty acts in roughly the same manner for robust and non-robust
    methods for linear regression.


