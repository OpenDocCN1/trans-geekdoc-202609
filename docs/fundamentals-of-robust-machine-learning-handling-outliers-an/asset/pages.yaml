  md: 'fluctuates (i.e. moves above and below), and its range of fluctuation around
    that mean remains bounded over time. Neither of these requirements are satisfied
    by the time series of Figure 12.21. Because it is not stationary, it will be difficult
    to build a good model for prediction using AR(p) due to an underlying assumption
    in AR(p) that the time series is stationary. However, there is a well-known solution
    to this problem: we can apply a *difference operation* to the time series which
    increases the likelihood that it is stationary. If it is still not stationary,
    we can apply a second difference operation (usually two is sufficient) and then
    apply AR(p) on the resulting time series. This process is the *Integrated* part
    of ARIMA and uses the notation I(d), where the parameter d (unrelated to the dimensions
    of the problem) specifies the desired number of differencing operations (which
    can be set to 0, 1, or 2).


    The effect of differencing is to *de-trend* the time series and make it stationary.
    That is, we want to remove any dependence of each point with its prior point or
    future point so that the points used in the regression are independent and come
    from the same distribution. The differencing operation itself is rather straightforward.
    The first difference is simply


    \(\delta_t^{(1)} = x_t - x_{t-1} \quad t = 2, ..., n.\) (12.5.4)


    The notation \(\delta_t^{(d)}\) refers to \(d\) differencing operations at time
    \(t\). In the process, the length of the new time series is reduced by one relative
    to the original series. The second difference is given by


    \(\delta_t^{(2)} = \delta_t^{(1)} - \delta_{t-1}^{(1)} \quad t = 3, ..., n.\)
    (12.5.5)


    Again, the length of the newer time series is reduced by two relative to the original
    series. The result after two differencing operations is shown in Figure 12.26
    for the average land temperature time series. Note


    ![](img/f26d7f591c2a080d86425985301266a4_393_0.png)


    **Figure 12.26** Results of second differences of the average land temperature
    time series which produces a stationary time series.'
