- pgno: 225
  md: 'The MLE can be derived for a given \(\tau\) using the following steps. First,
    the likelihood function is


    \(\begin{aligned} L(\mathbf{x}_1, ..., \mathbf{x}_n | \tau) = \prod_{i=1}^n \left(
    \frac{e^{-(r - \frac{1}{2}) x_i}}{\kappa \cosh (3\mathbf{x}_i / 2)^{\frac{1}{i}}}
    \right). \end{aligned}\)


    Then, the negative log-likelihood is


    \(\begin{aligned} -\ell(x_1, ..., x_n | \tau) = \sum_{i=1}^n \left[ \frac{1}{3}
    \log \left( \cosh \left( \frac{3x_i}{2} \right) \right) + \left( \tau - \frac{1}{2}
    \right) x_i \right] + n \log(\kappa). \end{aligned}\)


    Therefore, after removing the constant term, we obtain the loss function as


    \(\begin{aligned} J^{\text{SMRQ}}(\boldsymbol{\beta} | \tau) = \sum_{i=1}^n \left[
    \frac{1}{3} \log \left( \cosh \left( \frac{3x_i}{2} \right) \right) + \left( \tau
    - \frac{1}{2} \right) x_i \right]. \end{aligned}\)


    The estimates are obtained by selecting \(\tau\) and then carrying out the optimization
    as follows:


    \(\begin{aligned} \hat{\boldsymbol{\beta}}^{\text{SMRQ}} = \text{argmin}_{\boldsymbol{\beta}
    \in \mathbb{R}^{d+1}} \sum_{i=1}^n \left[ \frac{1}{3} \log \left( \cosh \left(
    \frac{3r_i}{2} \right) \right) + \left( \tau - \frac{1}{2} \right) r_i \right].
    \end{aligned}\)


    In the above, the dummy variable \(x_i\) is replaced with residuals \(r_i = y_i
    - \mathbf{x}_i^\top \hat{\boldsymbol{\beta}}^{\text{SMRQ}}\) for \(i = 1, ...,
    n\).


    # ## 7.9 Standard Error Computation


    Standard errors (s.e.’s) represent the uncertainty around the estimates, as described
    in Chapter 3. It is essentially the computed value of the standard deviation for
    each estimate. In the case of quantile regression using log-cosh, the same general
    formulation of Chapter 3 can be used to obtain the standard errors. However, there
    will be a different set of s.e.’s for each \(\tau\) so they must be computed separately
    for each case. For large \(n\), we treat the estimates as normally distributed
    so that we can use


    \(\text{Var}(\hat{\boldsymbol{\beta}}^{\text{SMRQ}}) = \nu^2 (\mathbf{X}^\top
    \mathbf{X})^{-1},\)


    and then define the term \(\nu^2\) as follows:


    \(\nu^2 = s^2 \frac{\text{E}[\psi_{\text{SMRQ}}(z)^2]}{\text{E}[\psi''_{\text{SMRQ}}(z)]^2},\)


    where \(z = (r - \mu) / s\), which has an unbiased estimate that can be obtained
    by replacing expectations with averages (as described in Chapter 3):


    \(\hat{\nu}^2 = s^2 \frac{ \frac{1}{n} \sum \psi_{\text{SMRQ}}(r_i / \hat{s})^2
    }{ [\frac{1}{n} \sum \psi''_{\text{SMRQ}}(r_i / \hat{s})]^2 } \frac{n}{n - d -
    1}.\)


    In the above, we assume \(\tau = 0.5\) with


    \(\psi_{\text{SMRQ}}(r_i / \hat{s}) = \frac{1}{2} \tanh \left( \frac{3r_i}{2\hat{s}}
    \right) + \left( \tau - \frac{1}{2} \right),\)


    and


    \(\psi''_{\text{SMRQ}}(r_i / \hat{s}) = \frac{3}{4} \text{sech}^2 \left( \frac{3r_i}{2\hat{s}}
    \right),\)'
