    # ## 1.8 Creating Synthetic Data for Clustering


    In the development of ML tools, we will often create representative datasets to
    validate the workings of the program. These are referred to as *synthetic datasets*.
    Synthetic data is also used to test corner cases, introduce artificial outliers,
    and augment existing real-world datasets to improve the quality of the models
    generated by ML tools. Before we solve the clustering problem, we need a way to
    generate synthetic datasets that are composed of any number of clusters in a multi-dimensional
    space. We start with a probability distribution of some sort as depicted in Figure
    1.4. For clustering, an appropriate distribution is a linear combination of several
    Gaussian distributions called a **Gaussian mixture**. For simplicity, we start
    the case of two clusters and then generalize to \( K \) clusters. For testing
    purposes, we also need to generate clusters of points in 1-dimension, 2-dimensions,
    or any size up to \( d \)-dimensions.


