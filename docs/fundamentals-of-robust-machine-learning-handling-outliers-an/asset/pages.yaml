- pgno: 116
  md: '# 4 Outlier Detection, Metrics, and Standardization


    # 4.1 Introduction


    This chapter addresses three important topics related to outliers and robust linear
    regression. First, we describe techniques for finding and removing outliers to
    produce outlier-free datasets, which are needed for many different types of statistical
    analysis. Included in this chapter are standard methods such as boxplots, histograms,
    and quantile–quantile plots. Each of these methods will be used to diagnose a
    number of datasets to demonstrate how outlier detection should proceed. This chapter
    also provides practical solutions to the problem. An algorithm is presented to
    find all the outliers, while leaving the true data intact, based on an iterative
    scheme using the boxplot. Traditional methods have not been adequate in this task
    because the least squares method forces the residuals to follow a Gaussian distribution.
    This tends to hide the outliers, making them hard to detect. In fact, we will
    show that robust methods provide the most reliable means to diagnose, detect,
    and remove outliers.


    Second, the proper selection of evaluation metrics for tools that operate on datasets
    with outliers is presented. If an unsuitable metric is chosen to evaluate accuracy
    in the presence of outliers, the results can be misleading or hard to interpret.
    A detailed analysis of the mean square error (MSE), root mean square error (RMSE),
    and median absolute error (MAE) metrics is provided. Once established, these metrics
    can also be used to select the robust hyperparameters, such as α in log-cosh methods
    (see Chapter 3) and δ for Huber’s method (see Chapter 2).


    Finally, to close out the chapter, procedures used to standardize datasets are
    discussed. Typically, machine learning methods work best with variables that have
    similar ranges of values. Some methods require that datasets be standardized in
    order to function properly. We present a robust standardization method which is
    needed when the explanatory variables have outliers.


    # 4.2 Effect of Outliers


    Outliers are a major concern in data science and machine learning. They can significantly
    impact statistical procedures beyond just the mean and standard deviation, as
    described in previous chapters. For instance, in the clustering problem, they
    can distort cluster shapes significantly leading to incorrect cluster centers
    (see Chapter 1). Linear regression slope and intercept estimates are skewed when'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'outliers are present, as seen in Chapters 2 and 3. There are other issues caused
    by outliers in statistical applications. For example, they can lead to correlation
    coefficients that are either higher or lower than the true values (see Chapter
    12). The analysis of variance (ANOVA) can be affected, making it harder to detect
    differences between groups. The process of imputation, that is replacing missing
    values in a dataset, can be skewed by outliers because it relies on the mean and
    variance of the data. Outliers can also affect t-tests (see Chapter 5) or chi-square
    tests in hypothesis testing, one of the mainstays of statistical analysis, potentially
    leading to incorrect conclusions. These are just a few of the many procedures
    requiring outlier-free datasets.


    Unfortunately, outliers are generally viewed as nuisance observations in a dataset
    and so robust methods have not been widely embraced as yet. Their effects are
    often considered to be relatively benign, especially if there are only a few of
    them. As a result, they are usually overlooked or ignored completely. However,
    ignoring outliers is a risky proposition and can result in misleading conclusions
    or significant issues in data analysis. Instead, there are better options involving
    the removal of the outliers before using the statistical procedures. If done carefully,
    it can be a very effective way to circumvent the problem of outliers.


    Before describing different strategies for outlier removal, we first demonstrate
    that even a single outlier can substantially impact the results when using the
    least squares (LS) approach. And second, we illustrate the impact as the number
    of outliers in the data is steadily increased. The results are contrasted with
    the robust log-cosh (LC) approach which, as detailed in Chapter 3, is quite tolerant
    to outliers.


    To demonstrate the potential issues with only one outlier, we show four different
    cases in Figure 4.1 based on the Belgian telephone dataset of Chapter 2. The explanatory
    variable is year and the response variable is calls. In each case, one outlier
    is manually inserted in different locations. We will find that a single outlier
    can have unpredictable effects on LS estimates but little or no effect on LC estimates,
    depending on its position relative to other observations in the dataset. For example,
    in Figure 4.1(a), the insertion of one outlier at (year = 1963, calls = 12.5)
    produces only a small difference between LS and LC. Both produce acceptable results.
    This is a low-impact outlier that leads many to believe their effects are relatively
    benign. However, when the outlier is moved to (year = 1985, calls = 12.5), as
    in Figure 4.1(b), the LS and LC results begin to differ; hence, this is a medium-impact
    outlier in this dataset. When we try to explain any prediction results from LS,
    we have to somehow account for the fact that all the data points are not represented
    accurately by the model. In other words, we have to justify the inaccurate model
    in some plausible manner. In contrast, LC produces the same result in both cases.


    Now consider the case of the outlier at (year = 1950, calls = 12.5) in Figure
    4.1(c). This position constitutes a high-impact outlier for this dataset. In fact,
    LS tells us that there is no relationship between calls and year, which we know
    is incorrect. Any business decision made using this result will also be incorrect.
    In a multidimensional setting, this variable may be inadvertently removed during
    model reduction by a penalty function (see Chapter 5). Trying to explain the removal
    of a critical variable would be challenging and ultimately misleading to others.
    In the last case, Figure 4.1(d), the outlier placed at (year = 1940, calls = 12.5)
    is called a high-leverage point since the value of year is well outside the domain
    of the rest of the data. This type of outlier can have serious consequences on
    the results of LS. In fact, it shows a negative correlation between year and calls
    which is clearly wrong. High-leverage points can be detected and removed, but
    it requires additional effort. However, the LC method is not significantly affected
    in either case.


    The point of all these examples is to illustrate the unpredictability of LS when
    even a single outlier is present, let alone a number of outliers and their effects.
    They show that outliers have varying impacts on'
