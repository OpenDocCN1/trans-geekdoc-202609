    # 12.5.1 Autoregressive Model


    The first component of ARIMA is the autoregressive (AR) model. In such a model,
    the future value of the time series is constructed as a linear combination of
    past values of the time series. We use the notation AR(p) to refer to models that
    use a total of p previous values in time to predict the value at time p + 1. More
    concretely, assume we have a time series given by {x1, x2, ..., xn}. If we have
    a model with p = 6, we use the first 6 time points to predict the 7th time point.
    Likewise, the values from positions 2 to 7 are used to predict the value at the
    8th time point, and so on. It is possible to create a matrix X with p values in
    each row and n - p rows, and a response vector y with the (p + 1)st values associated
