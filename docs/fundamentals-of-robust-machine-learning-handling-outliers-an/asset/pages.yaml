    due to the fact that they lie beyond the whiskers.


    Boxplots are used on explanatory variables and the response variable during EDA
    to get a sense of the data and the likelihood of finding outliers in the dataset.


    # 4.3.2 Histogram Plots


    A histogram plot is a graphical representation of the approximate distribution
    of a given sample set. If properly generated, it enables a rapid assessment of
    the existence of outliers. To create a histogram, a set of equal-sized bins are
    defined based on the min–max range of the data. All values that lie within the
    bounds of a given bin are counted and the counts in each bin are plotted to form
    the histogram. Hence, the histogram is a frequency plot of the number of occurrences
    of values in each bin. The width of a bin or the number of bins can be controlled
    by the user. Outliers may be found in bins that are separated at a distance from
    the bulk of the data on either side with relatively low frequencies. The key issue
    is the proper selection of the bin size. If the bin size is too small, the frequency
    within each bin will be too low to identify outliers. If the bin size is too large,
    the outliers may be lumped within inliers.


