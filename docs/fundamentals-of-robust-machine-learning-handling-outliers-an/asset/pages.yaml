  md: 'In the second case, as \(x \to -\infty\), \(\cosh(x) \to e^{-x}/2\) and, in
    the limit,


    \(\log(\cosh(x)) \approx -x - \log(2).\) (3.4.8)


    Therefore, far from \(x = 0\), the function behaves as


    \(\log(\cosh(x)) \approx |x| - \log(2)\) (3.4.9)


    which is like \(L_1\) except for the constant term (which is of no consequence).


    Finally, consider its behavior around the origin. As \(x \to 0\), we can take
    a Taylor series expansion at \(x = 0\) as follows:


    \(\log(\cosh(x)) = \frac{x^2}{2} - \frac{x^4}{12} + \frac{x^6}{45} + O(x^8)\)
    (3.4.10)


    and therefore it is, to first order, like \(L_2\). That is, for small \(x\) values,


    \(\log(\cosh(x)) \approx \frac{x^2}{2}.\) (3.4.11)


    Since it behaves like \(L_2\) close to the origin and \(L_1\) far from the origin,
    one can view it as the best of both worlds. This single function can replace the
    three-segment function used in the Huber loss. For robust regression, the log-cosh
    loss should be considered as the function of choice.


    # 3.4.2 Linear Regression Using Log-Cosh


    Before proceeding further into a theoretical study, it is instructive to solve
    a simple linear problem using the log-cosh loss to demonstrate that it is indeed
    a robust estimator. The LC estimator is given by


    \(\hat{\beta}^{\text{LC}} = \underset{\beta \in \mathbb{R}^{d+1}}{\text{argmin}}
    \sum_{i=1}^n \log(\cosh(r_i)),\) (3.4.12)


    where \(r_i = y_i - \mathbf{x}_i^T \boldsymbol{\beta}\) are the residuals. The
    LC loss function is


    \(\text{LC loss} = \sum_{i=1}^n \log(\cosh(y_i - \mathbf{x}_i^T \boldsymbol{\beta})).\)
    (3.4.13)


    If we take the derivative of the loss function w.r.t. \(\beta_j\) and use it in
    the gradient descent iterative equation, we obtain:


    \(\beta_j^{(t+1)} = \beta_j^{(t)} - \ell'' \sum_{i=1}^n \tanh(y_i - \mathbf{x}_i^T
    \boldsymbol{\beta})(-x_{ij}),\) (3.4.14)


    where \(\ell''\) is the learning rate. At each iteration, \(t\), we simply update
    each \(\beta_j^{(t)}, j = 0, \dots, d\) with the gradient term to produce \(\beta_j^{(t+1)}\)
    until convergence. The obvious point of comparison is with the least squares (LS)
    estimator which was detailed in the previous chapter. The LS estimator is given
    by:


    \(\hat{\boldsymbol{\beta}}^{\text{LS}} = \underset{\boldsymbol{\beta} \in \mathbb{R}^{d+1}}{\text{argmin}}
    \sum_{i=1}^n \frac{r_i^2}{2}.\) (3.4.15)


