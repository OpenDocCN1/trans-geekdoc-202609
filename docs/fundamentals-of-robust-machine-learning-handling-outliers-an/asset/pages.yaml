    # ## 7.4 Standard Quantile Loss Function


    Quantile regression is described in this section starting with the original method
    for studying the effect of explanatory variables on the entire conditional distribution
    of the response variable. It has been used extensively since the initial concepts
    were developed in the late 1970s and early 1980s. It is based on the so-called
    check function whereby the quantile of interest is obtained by setting a parameter,
    \(\tau\).


    Different regression quantiles (RQ) represented by lines or hyperplanes are obtained
    by minimizing the conditional loss function in M-estimator form given by,


    ```

    \(J^{RQ}(\beta|\tau) = \sum_{i=1}^n \rho_{RQ}(r_i; \tau), \quad (7.4.1)\)

    ```


    with


    ```

    \(\rho_{RQ}(r_i; \tau) = \left\{\begin{array}{ll} -(1-\tau)r_i & \text{if } r_i
    < 0 \\ \tau r_i & \text{if } r_i \ge 0 \end{array}\right., \quad (7.4.2)\)

    ```'
