  md: 'Collecting all terms with $y_i$ (i.e. taking $y_i$ as a common factor from
    both terms) and then rearranging in the GLM canonical form, we obtain


    $P(Y_i = y_i|p_i) = \exp \left( y_i \log \frac{p_i}{1-p_i} + \log (1-p_i) \right)
    .$ (8.3.11)


    The term next to $y_i$ in this formulation is called the link function. We take
    that term and postulate that it is representable by a linear model as follows:


    $\log \frac{p_i}{1-p_i} = \beta_0 + x_{i1}\beta_1 + \cdots + x_{id}\beta_d.$ (8.3.12)


    The right-hand side is the linear model we seek. The left-hand side is referred
    to as the **logit link function**. This form is particularly useful since it will
    eventually lead to a convex loss function. Rearranging Eq. (8.3.12) and solving
    for $p_i$, we obtain the logistic function,


    $p_i = \frac{1}{1 + \exp(-x_i^\top \beta)}.$ (8.3.13)


    This is same the equation we used earlier but now we have derived it from first
    principles so we can proceed from here using the maximum-likelihood procedure
    outlined before to obtain the CE loss function.


    # 8.3.2 Understanding Logistic Regression


    Now, suppose we find the estimates $\hat{\beta}$ using the estimator described
    in Eq. (8.3.8), or any other similar classifier. What is the meaning of the estimates
    and what can we do with them? We know the estimates establish the decision boundary,
    but since we cannot plot such a boundary in high dimensions, how do we use them?
    The answer is that we can use a **probability test** for some new data point $x$
    to decide if it should be categorized as being in Class 0 or Class 1. A second
    option is to use a **sign test** on $x^\top \hat{\beta}$ to determine if it belongs
    to Class 1 or Class 0.


    Conceptually, any point that satisfies $x^\top \hat{\beta} = 0$ represents a point
    on the boundary line or hyperplane with a 50% probability of belonging to Class
    0 or Class 1. In Eq. (8.3.13), $p_i = 0.5$ when $x^\top \hat{\beta} = 0$. Thus,
    the linear boundary in $d$ dimensions (i.e. the hyperplane boundary) is defined
    where


    $\hat{\beta}_0 + \hat{\beta}_1 x_1 + \cdots + \hat{\beta}_d x_d = 0.$ (8.3.14)


    Note that $\hat{\beta}_0$ serves as the intercept while the rest of the coefficients,
    $\hat{\beta}_1, \dots, \hat{\beta}_d$, establish the angle of the hyperplane in
    each dimension.


    Using a sign test, we can tell if $x$ falls on one side of the boundary or the
    other. Therefore, we would predict Class 1 if


    $\hat{\beta}_0 + \hat{\beta}_1 x_1 + \cdots + \hat{\beta}_d x_d > 0,$ (8.3.15)


    and Class 0 if


    $\hat{\beta}_0 + \hat{\beta}_1 x_1 + \cdots + \hat{\beta}_d x_d < 0.$ (8.3.16)'
