    $\frac{\partial J^{CE}(p_i)}{\partial p_i} \frac{\partial p_i}{\partial z_{\text{out},i}}
    \frac{\partial z_{\text{out},i}}{\partial a_{i_3}} = -(y_i - p_i)w_3 \text{ and
    } \frac{\partial a_{i_3}}{\partial z_{i_3}} \frac{\partial z_{i_3}}{\partial w_{23}}
    = I(z_{i_3})x_{i_2}. \tag{9.5.14}$


    The equation on the left can be precomputed and saved while processing layer 2,
    while the equation on the right is a new computation specifically for $w_{23}$.
    At a basic level, this is how backprop saves time in the gradient computations—by
    storing precomputed data for later use.


    Multiplying the terms together, the final result for all $n$ rows is


    $\frac{\partial J^{CE}(\mathbf{w})}{\partial w_{23}} = \sum_{i=1}^n (y_i - p_i)w_3
    I(z_{i_3})(-x_{i_2}). \tag{9.5.15}$


    This looks complicated because of the indicator function but recall that it is
