  md: 'of the line that “best fits” the given points shown in the plot. The best fit
    is based on some objective function used during optimization. We are, in effect,
    training the model to learn about the dataset. Once the estimates of these parameters
    are obtained, predictions can be made for values that are not in the original
    dataset. For example, we can now test our model by asking the question: “what
