    # 9.9 Summary


    In this chapter, it has been shown that the log-cosh loss function is effective
    when used with neural networks. In fact, it is robust to outliers for binary classification
    problems. The cross-entropy loss commonly used in neural networks is affected
    by outliers but it can be made more tolerant with the use of the ridge penalty
    for regularization. However, the log-cosh loss was shown to have an auto-regularization
    feature such that penalty functions are not required. Chapters 10 and 12 take
    these concepts to several data science problems to illustrate their use in real-world
    applications. A number of other capabilities provided by using this robust loss
    function in neural networks will also be described in those chapters.


    To close out this chapter, various metrics used to compare different binary classification
    tools were presented. Prediction accuracy by itself is not sufficient as an evaluation
    metric. Instead, metrics such as recall, precision, and F1 score are more appropriate.
    In addition, the AUROC is also useful when comparing different classifiers. In
    Chapter 12, the effect of outliers on the AUROC metrics is considered in detail.


