    # 2.9.2 Location Problem


    To emphasize the other key issue with the L1 loss function compared to L2, we
    will examine the location problem which is the simplest regression problem to
    tackle but offers additional insight into the inner workings of the two approaches.
    The location problem involves a one-dimensional dataset and is used to estimate
    the center of a sample of n observations, x1, ..., xn, for some random variable
    X. This could be the sample mean or median or any other similar type of estimate
    depending on the overall objective. The formulation of the location model is given
    by


    ```

    x_i = \theta + \varepsilon_i, \quad i = 1, ..., n

    ```


    where \theta is the location parameter and \varepsilon_1, ..., \varepsilon_n are
    i.i.d. random variables representing the errors. To estimate the location parameter,
    we could use LSE by minimizing the loss function given by


    ```

    L_2(\theta) = \frac{1}{2} \sum_{i=1}^n (x_i - \theta)^2. \quad (2.9.1)

    ```


    The mean is obtained using the L2 loss function. The gradient function is


    ```

    L_2''(\theta) = - \sum_{i=1}^n (x_i - \theta). \quad (2.9.2)

    ```


    Alternatively, another way to estimate the location parameter is to use the LAD
    estimator which minimizes the loss function


    ```

    L_1(\theta) = \sum_{i=1}^n |x_i - \theta|. \quad (2.9.3)

    ```'
