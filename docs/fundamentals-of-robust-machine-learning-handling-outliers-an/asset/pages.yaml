    $$L(y_1, \dots, y_n; p_1, \dots, p_n) = \prod_{i=1}^n p_i^{y_i} (1 - p_i)^{(1-y_i)}.$$
    (8.3.4)


    Then, the negative log-likelihood expression is given by:


    $$-\ell(y_1, y_2, \dots, y_n; p_1, \dots, p_n) = -\sum_{i=1}^n [y_i \log(p_i)
    + (1 - y_i) \log(1 - p_i)].$$ (8.3.5)


    This is the cross-entropy loss function and is expressed as follows:


    $$\text{CE loss} = -\sum_{i=1}^n [y_i \log(p_i) + (1 - y_i) \log(1 - p_i)].$$
    (8.3.6)


    The equation computes the total cross-entropy between \(y_i\) and \(p_i\) over
    \(n\) observations. During the optimization process, the loss function of Eq.
    (8.3.6) will do its best to match each \(p_i\) to each \(y_i\) because when they
    match, the loss function is identically 0. It is easy to check this condition
