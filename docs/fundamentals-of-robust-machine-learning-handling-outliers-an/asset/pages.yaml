  md: 'It should be well understood at this stage that the variance is a measure of
    the uncertainty in the estimates but closed-form expressions of variance may be
    hard to derive. An alternative is to generate a large number of estimates of each
    parameter using many datasets, but unfortunately we only have one to work with.
    However, we can use a well-known approach called the bootstrap method to generate
    the distribution of the estimates in histogram form using only one dataset.


    The basic idea in bootstrapping is to sample a given dataset multiple times and
    compute estimates for each sample. That is, we can create what are called sampling
    distributions of the estimates. Ideally, we would like to do this with many different
    datasets but since we only have one to work with, we use a sample with replacement
    strategy. This means we will draw an observation from the original dataset randomly
    and then put that observation back into the original dataset and repeat the process
    until we have constructed the new dataset in full.


    More concretely, in the Swiss dataset, there are 47 observations (i.e. rows).
    When we apply bootstrapping, we randomly select 47 observations (with replacement)
    to create a new dataset, which implies that we may have repeated observations
    in our synthesized dataset. We then compute the estimates using some method (LS
    in this case) and repeat this procedure multiple times to generate parameter distributions.
    The spread of the estimates around the mean captures the variance and this can
    be computed easily. Figure 5.6 shows the distribution of LS estimates (\(\lambda
