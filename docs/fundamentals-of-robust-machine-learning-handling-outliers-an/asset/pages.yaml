- pgno: 272
  md: '# # 9 Neural Networks Using Log-Cosh


    # ## 9.1 Introduction


    Our objective in this chapter is to build on Chapter 8, which addressed logistic
    regression using the log-cosh loss function, and investigate the feasibility of
    applying the log-cosh loss to neural networks. The question here becomes: Can
    log-cosh methods be effectively used in conjunction with neural networks? Since
    we already know that log-cosh methods are applicable to logistic regression, it
    naturally follows that they should be immediately applicable to neural networks.
    Therefore, the issue at hand is to determine the advantages of log-cosh neural
    networks over cross-entropy neural networks for machine learning and what new
    capabilities they may provide, if any. This is the main question to be explored
    in this chapter.


    We begin with a brief history of neural networks (see Haykin 2009; James et al.
    2023) and then describe the basic units and architecture in the next section,
    including the activation functions, which are the non-linear part of the units
    that allow neural networks to learn patterns and characteristics of the input
    data. Then, details of training neural networks will be described, along with
    the steps involved in computing gradients needed for training. The chapter concludes
    with examples of binary classification and a number of metrics typically used
    to assess accuracy.


    # ## 9.2 A Brief History of Neural Networks


    Work on neural networks (NNs) began in earnest in the mid-to-late 1980s and early
    1990s by computer scientists in the pursuit of artificial intelligence (AI) systems.
    Neural networks were initially touted as a way to mimic the behavior and operation
    of neurons in the brain, although that connection is not fully embraced today.
    There was much excitement at the time regarding the potential of NNs to solve
    many unsolvable problems due to breakthroughs such as the use of the sigmoid function
    for activation in conjunction with the development of efficient methods for back
    propagation. But there were many technological barriers to its success at that
    time and it quickly fell out of favor. In particular, computers were relatively
    slow and the era of big data had not yet arrived. As skepticism grew, NNs were
    relegated to being a stagnant technology with no future and, as a result, lay
    dormant for many years. In the intervening years, the speed of computers increased
    significantly, new and efficient algorithms for neural networks'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'were developed, and the Internet emerged as a way to deliver large datasets
    and open-source software to users around the world.


    By 2010, the neural network had emerged from its dormant state and made an impact
    in many important applications, most notably speech recognition, image processing,
    and natural language processing. In medical applications, it was able to quickly
    and accurately identify cancerous tissue and gained a strong foothold in radiology.
    Other advances in optimization methods and NN architectures with many layers of
    neurons were made in the same period. Some of the most difficult problems became
    tractable and were solved using these advanced techniques. The promise of AI systems
    of the 1980s was finally being realized. Collectively, these methods were rebranded
    as “deep learning.” This term caught the attention of academics and practitioners
    alike and is now used to describe almost all neural networks in use today. The
    key driver from the early use of NNs to its ubiquitous presence today is the availability
    of big data. Images, video files, audio files, etc. are well-known forms of data
    for deep learning, but there are an uncountable number of other datasets that
    are also being processed using deep NNs. Eventually, NNs led to the development
    of large language models (LLMs) which are at the heart of recent generative AI
    systems used by hundreds of millions of people today.


    Our purpose in this chapter is rather limited to a comparison of traditional cross-entropy
    NNs (CENNs) against robust log-cosh NNs (LCNNs). Here, we view NNs as simply multiple
    layers of logistic regression modified only by the activation functions used in
    each layer. If we have a single layer (i.e. no hidden layers), it is standard
    logistic regression. If we have two or three layers it is a shallow NN. If there
    are many layers of logistic regression, it is called a deep NN, which is used
    for deep learning. This view may be somewhat oversimplified but it is something
    to keep in mind as a good starting point to understand neural networks. The meaning
    of layers and networks will become clear later in this chapter but the basic idea
    is that complex relationships between the independent variables and the response
    variable can be realized by increasing the parameter space of the problem. Training
    of these types of networks is carried out using gradient descent but they are
    usually accelerated using *momentum* and *rmsprop*, which will be described when
    the Adam optimization technique is detailed in Chapter 10. However, the method
    of creating the gradient terms through back propagation will be described in this
    chapter. Then, a simple circular dataset from Chapter 8 will be used to compare
    and contrast LCNN and CENN. A more advanced application using the MNIST dataset
    will be used to compare the two methods in Chapter 10. Finally, in the last section,
    binary classification metrics such as the $F_1$ score and AUROC will be described.


    > Nomenclature: You may have heard the terms **sigmoid function** and **logistic
    function** and wondered about the difference between them. The logistic function
    and the sigmoid function are equivalent. Statisticians typically use the term
    “logistic function,” while those in machine learning prefer “sigmoid function.”
    Generally, the term “logistic function” is used when referring to equations or
    computing probabilities. In contrast, “sigmoid function” is used when discussing
    activation functions in neural networks.


    # 9.3 Defining Neural Networks


    In this section, we describe the basic building blocks of neural networks. These
    building blocks will be used to construct a prototypical neural network. As a
    simple way of thinking about neural networks, one'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'can view it as a natural extension of logistic regression. Recall that in logistic
    regression (as described in Chapter 8), one of the problems was that in order
    to increase the feature space, a technique called polynomial expansion is needed.
    However, it is not clear how many terms are required in the expansion to obtain
    acceptable results. This is where neural networks can play a key role. Think of
    NNs as a way to increase the feature space by introducing many layers of logistic
    regression between the inputs and outputs. By doing so, we have a better chance
    to fit the data because there will be many parameters in the neural network to
    work with. But how many layers should be used and how should the NN be constructed?
    These and other questions will be addressed in this section.


    # 9.3.1 Basic Computational Unit


    Consider the diagram in Figure 9.1. This is another way to represent the operation
    of logistic regression. In this case, there are four independent variables, \(x_1,
    x_2, x_3,\) and \(x_4\), plus the intercept term, \(b\), and one dependent variable,
    \(y\). Each input, \(x_i\), is multiplied by its respective parameter, \(w_i\),
    and summed together to form z as follows:


    \(z = b + w_1x_1 + w_2x_2 + w_3x_3 + w_4x_4.\) (9.3.1)


    Then \(z\) is applied to the logistic function to produce the probability


    \(a(z) = \frac{1}{1 + \exp(-z)},\) (9.3.2)


    which is the same as the output, hence, \(y = a(z)\).

    For neural networks, we simply need to change the terminology. The computation
    involves a linear combination of the inputs and the application of an activation
    function. We say that, in this computational unit, the inputs are multiplied by
    their edge **weights**, \(w_i\), and then a **bias**, \(b\), is added before applying
    the **sigmoid** activation function, \(a(z)\), to produce the output. The **activation
    function** is not necessarily the sigmoid function but can be any nonlinear function
    that operates on the linear combination of inputs to produce useful results. What
    we have just described is the basic unit of all neural networks: an **activated
    sum-of-products unit**. The only step remaining is to replicate this unit many
    times to construct a fully connected neural network.


    Figure 9.1 Computational unit (one neuron) in neural networks.


    ![](img/f26d7f591c2a080d86425985301266a4_274_0.png)'
