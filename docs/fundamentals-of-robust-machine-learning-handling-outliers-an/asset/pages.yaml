    # 5.10.2 Geometric Interpretation of Bias


    In order to understand the bias of a penalty estimator, we now consider geometric
    interpretations of the three penalty functions, ridge, LASSO, and aLASSO, using
    two variables. These interpretations also provide insight into the inner workings
    of each penalty estimator but are only meant as a qualitative view of their differences.
    They are based on a multiple linear model given by


    \(y = \beta_0 + \beta_1 x_1 + \beta_1 x_2 + \epsilon,\) (5.10.1)


    where least squares estimation is used for linear regression. The concepts to
    be described apply to robust regression in the same manner.


    We begin with the ridge penalty. One can show that the \(L_2\) penalty function
    effectively places a circular constraint on the two parameters, \(\beta_1\) and
    \(\beta_2\), given by


    \(\beta_1^2 + \beta_2^2 \le c,\) (5.10.2)


    where \(c\) is a constant. These circular regions centered at the origin are shown
    in Figure 5.8. The figure represents the two-dimensional space of possible \(\beta_1\)
    and \(\beta_2\) values. The circles represent the constraint \(\beta_1^2 + \beta_2^2
    = c\) due to the ridge penalty function for different values of \(c\), which corresponds
    to \(\lambda\) in the penalty function. The point marked “x” represents the unbiased
    LS estimates. Imagine that the unbiased solution sits at the bottom of a valley
    with contours around it. The elliptical contours represent lines of equal value
    of the original loss function while the circles represent the constraints due
    to the penalty function.'
