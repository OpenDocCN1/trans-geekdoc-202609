    This completes the update equations for the second layer.


    The next goal is to derive the update equations for the first layer. We use $w_{23}$
    for illustration purposes but the same steps apply to all the other gradients
    in that layer. We pose the same question as before: How should we change $w_{23}$
    to reduce the loss? The answer is somewhat more complicated because we must account
    for all the sum-of-products and activation functions between $w_{23}$ and the
    loss function at the output. Equivalently, we can work backward from the output
    to $w_{23}$, as indicated by the long back arrow of Figure 9.5. In particular,
    it takes a path backward from the output loss function through unit $z_{i_3}$
    to $w_{23}$.


    The corresponding chain rule for the ith row is as follows:


    $\frac{\partial J^{CE}(\mathbf{w})}{\partial w_{23}} = \frac{\partial J^{CE}(p_i)}{\partial
    p_i} \frac{\partial p_i}{\partial z_{\text{out},i}} \frac{\partial z_{\text{out},i}}{\partial
    a_{i_3}} \frac{\partial a_{i_3}}{\partial z_{i_3}} \frac{\partial z_{i_3}}{\partial
    w_{23}} \tag{9.5.11}$


    The first two terms have been computed already during the calculation of the second
    layer gradients so this information would be saved for reuse. The third term is
    just the weight associated with $a_{i_3}$ which is $w_3$, as evident from Eq.
    (9.5.3). The fourth term depends on the type of activation function in layer 1,
    which in this case is a relu function. The relu derivative is either 1 or 0, since
    it is a “keep or kill” term that depends on the value of $z_{i_3}$. We need an
    expression for $a_{i_3}$ to obtain this derivative. From Figure 9.5, the forward
    arrows pointing into $z_{i_3}$ in layer 1 imply that


    $z_{i_3} = w_{1_3}x_{i_1} + w_{2_3}x_{i_2} + b_3 \tag{9.5.12}$


    and, therefore, using the definition of relu given earlier, we can write


    $a_{i_3} = \text{relu}(z_{i_3}) = z_{i_3} I(z_{i_3}) \tag{9.5.13}$


    where $I(\cdot)$ is the indicator function. Then, using the fact that $\partial
    a_{i_3}/\partial z_{i_3} = I(z_{i_3})$ and $\partial z_{i_3}/\partial w_{23} =
    x_{i_2}$, which is the fifth and final term of Eq. (9.5.11), we can compute the
