  md: '![](img/f26d7f591c2a080d86425985301266a4_91_0.png)


    **Figure 3.1** Developing a continuous $L_1$ function using log-cosh.


    methods for optimization. If an alternative can be found that retains the robust
    property of $L_1$ and does not suffer from discontinuity issues while offering
    a unique solution to the minimization problem using gradient descent, then it
    will be better suited for machine learning.


    The objective is now clear: we seek a loss term that has continuous first and
    second derivatives to replace the $L_1$ function. Consider how one might do this
    starting with the $L_1$ loss term, as shown in Figure 3.1 on the top left panel.
    The absolute value loss term, $|x|$, is clearly piecewise continuous with a V-shaped
    kink. When we take its derivative, we obtain sgn(x) which is discontinuous at
    $x = 0$ as seen in the bottom left panel. This discontinuity will invite a certain
    amount of trouble in gradient-based methods. What if we were to replace the discontinuous
    derivative function with a continuous function, such as the tanh(x) function?
    Since tanh(x) is continuous in all regions and ranges from -1 to 1, it appears
    to be a very good option to replace sgn(x). This is shown in the bottom right
    panel. The two functions, sgn(x) and tanh(x), look about the same but we know
    that one is discontinuous and the other is continuous.


    Having found a suitable replacement for the derivative, all that remains is to
    obtain the loss term by integrating the tanh(x) function, whereby we obtain log(cosh(x)).
    This is shown in the top right panel. It is a continuous function that is smooth
    around the origin. That is, it has the characteristic V-shape of $L_1$ but does
    not have a kink (although it may appear to have one in the figure). Therefore,
    rather than using $|x|$ as the loss term, we can replace it with log(cosh(x))
    and hopefully all of the issues associated with $L_1$ can be resolved in this
    manner. This is the key motivation for the so-called log-cosh (LC) loss function.'
