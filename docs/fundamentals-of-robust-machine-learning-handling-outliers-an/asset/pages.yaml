    # ## 8.5 Algorithms for Logistic Regression


    This section describes the algorithms for binary classification problems using
    cross-entropy and log-cosh loss functions. Recall that the cross-entropy loss
    function is


    \(J^{\text{CE}}(\boldsymbol{\beta}) = -\sum_{i=1}^n [y_i \log(p_i) + (1 - y_i)
    \log(1 - p_i)],\) (8.5.1)


    and the log-cosh loss function is


    \(J^{\text{LC}}(\boldsymbol{\beta}) = \frac{1}{a} \sum_{i=1}^n \log(\cosh(a(y_i
    - p_i))).\) (8.5.2)


    Simplified algorithms in the form of pseudo-code for the two methods, referred
    to as CELR and LCLR, are provided in Algorithms 8.1 and 8.2, respectively. Actual
    implementations can be much more involved but, perhaps more importantly, they
    are almost identical except for lines 5 (loss update) and 7 (gradient calculation).
    Therefore, the implementation of the log-cosh approach in existing software is
    rather straightforward.


