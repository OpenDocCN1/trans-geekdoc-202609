    can still be viewed as acceptable if the crossing occurs outside the convex hull.
    Lines crossing within the convex hull often leads to non-monotonicity, but not
    always, whereas if non-monotonicity is detected, there is implicitly a crossing
    problem inside the convex hull. Therefore, we need a way to monitor any non-monotonic
