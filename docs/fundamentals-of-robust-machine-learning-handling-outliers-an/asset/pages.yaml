    # ## 6.5 Generalization using Robust Estimators


    The procedures described above are useful for comprehension of the bias–variance
    trade-off but cannot be used directly in machine learning. This is because the
    bias and variance are not usually available in closed form. What we actually take
    away from that exercise is an understanding of the important trade-off which will
    show up time and time again in different forms. In fact, we are more interested
    in generalizing the model in terms of prediction accuracy on a test set whereas
    in the previous section we optimized for quadratic risk on a training set. Furthermore,
    if there are outliers in the dataset, LS is not effective so different loss functions
    and metrics are needed.


    # ### 6.5.1 Training and Test Sets


    The first issue to resolve is that of not having any test data to evaluate a candidate
    model against other possible models. The approach used in machine learning is
    to divide the given dataset into two parts: a training set (say, 80% of the data)
    and a test set (the remaining 20% of the data), as in Figure 6.4. The training
    set contains $n - m$ rows while the test set contains $m$ rows. Then, the model
    can be built using only the training data and then applied to the test data to
    determine the prediction error.


    The error measure on the test set can be any suitable metric, such as the MSE,
    root mean square error (RMSE), or median absolute error (MAE), depending on the
    situation at hand. For example, the test error could be measured as


    \(\text{MSE}_{\text{test}} = \frac{1}{m} \sum_{i=1}^m (y_i - \hat{y}_i)^2,\quad
    (6.5.1)\)


    where \(y_i\) and \(\hat{y}_i\) are the true and predicted values of the $i$th
    response on the test set, respectively. Alternatively, the RMSE given by


    \(\text{RMSE}_{\text{test}} = \sqrt{\frac{1}{m} \sum_{i=1}^m (y_i - \hat{y}_i)^2},\quad
    (6.5.2)\)'
