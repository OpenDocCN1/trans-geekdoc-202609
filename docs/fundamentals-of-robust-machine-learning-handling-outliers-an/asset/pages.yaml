- pgno: 61
  md: 'for $i = 1, \dots, n$. We will frequently use the more general form $r_i =
    y_i - \mathbf{x}_i^\top \boldsymbol{\beta}$ for convenience. Then, the $L_1$ loss
    function is the sum of the absolute values of the residuals, given by


    $L_1 \text{ loss} = \sum_{i=1}^n |r_i|,$ (2.4.5)


    while the $L_2$ loss function is half the sum of the squares of the residuals,
    given by


    $L_2 \text{ loss} = \frac{1}{2} \sum_{i=1}^n r_i^2.$ (2.4.6)


    Minimizing the $L_1$ loss is commonly referred to as least absolute deviation
    (LAD) while minimizing the $L_2$ loss is called least squares estimation (LSE).
    These loss functions are minimized to obtain their respective estimates of $\beta_0$
    and $\beta_1$ which may be quite different. We will derive both functions and
    explore their differences shortly.


    **Exercise:** Assume that we know the true values of the regression parameters
    to be $\beta_0 = 3$ and $\beta_1 = 1$. Using LSE, we find that $\hat{\beta}_0
    = 3.2$ and $\hat{\beta}_1 = 1.1$. Compute the residuals and errors (the two are
    different) assuming that $\mathbf{y} = (3.3, 4.1, 5.5)^\top$ and $\mathbf{x} =
    (0, 1, 2)^\top$.


    **Ans.:** The residuals are given by $r_i = y_i - (\hat{\beta}_0 + \hat{\beta}_1
    x_i): r_1 = 3.3 - (3.2 + 1.1 \times 0) = 0.1, r_2 = 4.1 - (3.2 + 1.1 \times 1)
    = -0.2, \text{ and } r_3 = 5.5 - (3.2 + 1.1 \times 2) = 0.1$. On the other hand,
    the errors are given by $\epsilon_i = y_i - (\beta_0 + \beta_1 x_i): \epsilon_1
    = 3.3 - (3 + 1 \times 0) = 0.3, \epsilon_2 = 4.1 - (3 + 1 \times 1) = 0.1, \text{
    and } \epsilon_3 = 5.5 - (3 + 1 \times 2) = 0.5$. Note that ideally $\sum r_i
    = 0$ (a property of least squares), whereas $\sum \epsilon_i = 0.9 \neq 0$.


    **Note:** It is important to recognize that the roots of machine learning lie
    in the field of probability and statistics. The fundamentals of probability distributions,
    estimators and estimation, convexity and convergence, and error measures are all
    based on theoretical underpinnings provided in this field. Essentially, they ensure
    that the ML techniques will work; that is, they will converge to the desired values
    with a certain amount of assurance and a certain level of accuracy. As such, it
    is necessary to cover the basics of probability and statistics as it relates to
    the subject matter at hand.


    # 2.4.3 Distribution of Residuals


    We are now ready to carry out a statistical analysis of the probability distribution
    of regression errors. Since we do not have access to the true errors, our focus
    will be on the residuals which we can compute after estimation. The starting point
    of the statistical analysis is to examine the properties of random variables because
    the residuals are themselves random variables. In this section, we use $X$ as
    a generic random variable but you should view it as the random variable representing
    residuals. More formally, we define $X$ as an independent and identically distributed
    (i.i.d.) random variable (r.v.). This type of assumption will be carried throughout
    the book.


    A random variable may be distributed in a variety of different ways. The probability
    density function (PDF) specifies a continuous distribution denoted by $f_X(x)$.
    The cumulative distribution function (CDF) gives the probability that the random
    variable is less than a particular value and is denoted as $F_X(x)$.'
