    # ## 2.9 Comparison of LSE and LAD


    In order to gain further insight into the two methods, we examine results for
    the simple linear model and the location model. The simple linear model is used
    to illustrate the differences between the two in estimating the slope and the
    intercept. The location problem is used to explore the nature of the minimization
    process.


    # ### 2.9.1 Simple Linear Model


    For the simple linear model (see Section 2.5.1), we will use the Belgium telephone
    dataset provided in Table 2.1. It contains the number of calls (in units of 10s
    of millions) made in Belgium in the years between 1950 and 1973. There are 24
    data points, with 6 outliers due to a change in measurement technique (call length
    instead of number of calls) for a 6-year period from 1964 to 1969.


    Figure 2.7 shows the results of linear regression using LSE and LAD. The scatter
    points represent the data in Table 2.1. Note that most of the points occur in
    the lower portion of the plot. The points in the upper portion are outliers due
    to differences in measurement techniques in those intervening years. The two lines
    are based on estimates from Eq. (2.7.7) for LSE and Eq. (2.8.2) for LAD.


    In the case of LSE, we notice that the line traces a path through the middle of
    the data whereas the LAD regression line is located in such a way as to split
    the data in half. This is due to the fact that the LSE method seeks the line that
    averages the errors to 0 while the LAD method seeks the line that equalizes the
    number of data points above and below the line. We can observe that LAD is ignoring
    the outlier data and capturing the essence of the true data.


