  md: '![](img/f26d7f591c2a080d86425985301266a4_83_0.png)


    From the exercise above, it is clear that the Huber loss does not have a continuous
    second derivative. As a result, various improvements have been devised to make
    it continuously differentiable using smoothing techniques which will not be elaborated
    here since they introduce other issues as a side effect. Perhaps more troubling
    is that the optimization problem begins to look like \(L_1\) as \(\delta\) decreases
    which implies that gradient descent is not as effective, and the results become
    unreliable. In spite of these issues, Huber''s method is a popular alternative
    to LSE when outliers are present.


    Some insight into the inner workings of Huber''s method can be gained by expressing
    the loss in an alternative form as follows:


    ```

    \(\text{Huber loss} = \sum_{i=1, |r_i| \le \delta}^n r_i^2 / 2 + \sum_{i=1, |r_i|
    > \delta}^n \delta(|r_i| - \delta / 2).\) (2.10.6)

    ```


    Setting \(\delta = 1\) for convenience, if we take the derivative of the loss
    function in the various regions and set it to 0, we would obtain


    ```

    \(\sum_{i=1, |r_i| \le 1}^n r_i + \sum_{i=1, |r_i| > 1}^n \text{sgn}(r_i) = 0.\)
    (2.10.7)

    ```


    What Eq. (2.10.7) expresses is that the sum of the signs of the residuals in the
    two \(L_1\) regions plus the sum of the residuals in the \(L_2\) region must equal
    0. One way to satisfy this condition is that we can have an equal number of residuals
    in the two \(L_1\) regions, and the remainder of the residuals in the \(L_2\)
    region. In the \(L_1\) regions, the terms that are summed can only be -1 or +1.
    Therefore, a balance must be reached that sums to 0; otherwise, the \(L_2\) region
    will have to make up the difference to make the total sum equal to 0. The method
    is robust since the magnitude of the residuals in the \(L_1\) region can be any
    (large) value but they will only contribute -1 or +1 to the sum. Hence, Huber
    is robust to outliers provided the proper \(\delta\) is selected.'
