  md: '# ## 2.11 Summary


    This chapter introduced \(L_1\), \(L_2\), and Huber loss functions for linear
    regression. The \(L_1\) loss function is robust to outliers but has mathematical
    and numerical issues that make it difficult to use in practice. The \(L_2\) loss
    function, which produces the ordinary least squares estimates, is not tolerant
    to outliers. Huber''s method combines the advantages of the \(L_1\) and \(L_2\)
    loss functions and is tolerant to outliers. However, it also has problems in that
    its second derivative is not continuous and we must be able to find a suitable
    value for \(\delta\) along with the estimates themselves. Furthermore, small values
