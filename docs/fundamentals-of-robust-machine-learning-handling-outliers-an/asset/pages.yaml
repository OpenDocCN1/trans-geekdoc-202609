    However, for \(\tau = 0.75\), we obtain


    \(\mathbb{E}[X] = -3.7\) (7.8.6)


    and


    \(\text{Var}(X) = \mathbb{E}[X^2] - \mathbb{E}[X]^2 = 34.4 - (-3.7)^2 = 20.7\).
    (7.8.7)


    All of the distributions encountered in this book thus far have a mean that is
    0 but in quantile regression, the associated PDFs do not have a mean of 0 except
    for \(\tau = 0.5\). From the above, the mean of the distribution for \(\tau =
    0.75\) is negative rather than 0 and for \(\tau = 0.25\) it would be positive
