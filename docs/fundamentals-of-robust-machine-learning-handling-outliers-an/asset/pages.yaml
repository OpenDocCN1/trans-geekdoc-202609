    # 4.6.4 Quantile–Quantile Plot


    The quantile–quantile (or QQ) plot (see Maronna et al. 2019) is perhaps the most
    important statistical tool in post-regression analysis. At a very basic level,
    it assesses whether the residuals belong to a Gaussian distribution. If so, then
    the LS method is a suitable linear regression method for the data since the residuals
    fit the associated distribution. Therefore, one of the first steps after LS regression
    should be to perform a QQ-plot on the residuals to determine if robust regression
    is required. Hence, it provides another qualitative way to determine whether there
    are outliers in a dataset. The only issue against this reasoning is that LS forces
    the residuals to be Gaussian, so even if the residuals appear to be Gaussian,
    there may still be undetected outliers. For reasons cited earlier, LC residuals
    may be preferable when generating a QQ-plot.


    The QQ-plot is a way to visually compare the quantiles of the data to the theoretical
    quantiles. By default, the theoretical quantiles are placed along the x-axis.
    The quantiles were shown earlier in Figure 4.8 associated with the true distribution.
    To understand quantiles in the context of a QQ-plot, we start with the cumulative
    distribution function (CDF) for the Gaussian, denoted as u = Φ(x), where u ∈ [0,
    1]. The CDF is simply the area under the Gaussian normal curve up to a point x.
    If the area is 0.5, then u = 0.5 and Φ−1(0.5) = 0. This quantile is at the center
    of the x-axis in Figure 4.8. We also note that Φ−1(0) = -∞ and Φ−1(1) = ∞ so those
    values imply that the area under the curve as being 0 at −∞ and 1 at ∞. All quantiles
    for a QQ-plot will lie between these two extremes.


    To obtain the theoretical quantiles, we choose evenly spaced points between 0
    and 1 along the vertical axis of the CDF. If there are n values in our data, then
    the quantiles are based on n uniformly spaced points between 0 and 1. In particular,
    the points would be located at u = 1/(n + 1), 2/(n + 1), ..., n/(n + 1). The inverse
    CDF, Φ−1(u), is performed on these values to obtain the theoretical quantiles.2
    The sample order statistics are placed along the y-axis. If the (x, y) points
    line-up along a diagonal, then we view the sample'
