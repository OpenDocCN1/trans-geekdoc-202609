    As we are considering various loss functions for use in machine learning, we should
    check if they are convex or non-convex. We can do this using the second derivative
    of a function. First, let x ∈ I where I is some interval of interest. Then the
    function f(x) is convex in interval I if and only if f''''(x) ≥ 0 for all x ∈
    I, and strictly convex if and only if f''''(x) > 0. So we can test for convexity
    using this criterion. For most of the loss functions used in practice, this will
    be true but the condition should be checked with any new loss functions. However,
    in machine learning, especially in deep neural networks, this may not be true
    and a local minimum is acceptable. In such cases, the optimization techniques
    will be much more complex than the simple gradient descent described above, as
    presented later in Chapters 9 and 10.


    # 2.6 M-Estimation


    In our search for a robust loss function for machine learning, we will need a
    method to compare different candidates that we encounter along the way. In robust
    statistics, there is a class of estimators called M-estimators (see Maronna 2019)
    that will be useful throughout this book for this purpose. M-estimators are used
    for robust regression, where the objective is to minimize a function of the residuals.
    The simplest way to view these estimators is that they are all defined by a generic
    loss function, as follows:


    ```

    M-loss = \sum_{i=1}^{n} \rho(r_i) = \sum_{i=1}^{n} \rho(y_i - x_i^\top \beta).

    ```


    The idea is that the function ρ(r_i) is selected to deliver robust estimates.
    The function itself depends solely on your ingenuity and not necessarily on rigorous
    derivations carried out using MLE. If we can specify the ρ(r_i) function such
    that it is convex and gives desirable estimates, then we can optimize it to obtain
    a robust model. Here we do not need to specify the distribution or carry out any
    steps of the MLE procedure. We simply develop an estimator based on some ρ(r_i)
    that satisfies a few requirements of continuity and convexity. The derivative
    of the ρ(r_i) is given by


    ```

    \psi(r_i) = \frac{\partial \rho(r_i)}{\partial r_i}.

    ```


    The continuity requirement is needed to carry out differentiation so that gradients
    can be used to numerically solve the equation. Assuming that ρ(r_i) is differentiable,
    the estimates are the set of values that satisfy the following condition:


    ```

    \sum_{i=1}^{n} \psi(r_i) = 0.

    ```'
