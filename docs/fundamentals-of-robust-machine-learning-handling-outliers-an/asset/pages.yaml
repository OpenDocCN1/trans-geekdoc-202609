    # 5.7 Ridge Traces


    It is instructive to know what happens to each parameter as we vary \(\lambda\)
    in a multivariate setting. As we increase \(\lambda\), the estimates tend to decrease
    but exactly how they decrease is not as easy to predict. However, in a previous
    section, we saw that the trajectory of one estimate as \(\lambda\) is increased
    is either a gradual decay to zero or an abrupt drop to zero. For the multivariate
    case, the estimates can be plotted as a function of \(\lambda\) to obtain the
    true trajectories which are called penalty traces.


    In this and other chapters, we will be using these traces to illustrate many of
    the characteristics and properties of penalty estimators. We use ridge to introduce
    the traces and their meaning but the reader is encouraged to become very familiar
    with these traces as they will be used in the same way for other penalty functions.
    The process of creating the traces is very simple: choose a number of values of
    \(\lambda\), compute the estimates at those values, and plot the results as a
    function of \(\lambda\). Typically, the estimates are plotted as a function of
    \(log(\lambda)\) because it is more informative due to the large scales over which
    shrinkage occurs.


    The Swiss dataset was introduced in Chapter 3. It is a linear regression problem
