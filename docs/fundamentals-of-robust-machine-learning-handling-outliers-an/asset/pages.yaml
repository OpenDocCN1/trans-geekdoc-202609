    \(f_X(x) = \frac{1}{\pi} \frac{1}{\text{cosh}(x)}\) . (3.5.4)


    The resulting PDF is sometimes referred to as the *hyperbolic secant distribution*
    but we will use the term **Cosh distribution** to keep in mind its connection
    to the log-cosh loss function.


    The cumulative distribution function (CDF) is obtained by integrating the PDF
    function up to some desired point, \(x\), as follows:


    \(F_X(x) = \int_{-\infty}^{x} f_X(x)dx\) . (3.5.5)


    For the Cosh distribution, the CDF is found using


    \(F_X(x) = \int_{-\infty}^{x} \frac{1}{\pi} \frac{1}{\text{cosh}(x)} dx\) . (3.5.6)


    Then, integrating and setting the constant of integration to 1/2, the CDF is given
    by:


    \(F_X(x) = \frac{1}{2} + \frac{1}{\pi} \text{arctan}(\text{sinh}(x))\) . (3.5.7)


    The CDF is plotted in Figure 3.4(a) along with the PDF in Figure 3.4(b).


    More generally, we have a location-scale family of distributions of the form


    \(f_X(x; \theta, \sigma) = \frac{1}{\pi\sigma \text{cosh}(\frac{x-\theta}{\sigma})},\)
    (3.5.8)


    where \(\theta\) is the location parameter and \(\sigma\) is the scale parameter
    (not to be confused with the standard deviation). We note here that


    \(\mathbb{E}[X] = \theta \quad \text{and} \quad \mathbb{E}[X^2] = \frac{\pi^2\sigma^2}{4}
    + \theta^2\)


    so the asymptotic variance of the distribution is


    \(\text{Var}(X) = \mathbb{E}[X^2] - \mathbb{E}[X]^2 = \frac{\pi^2\sigma^2}{4}.\)
    (3.5.9)


    The location and scale parameters can be estimated from the data (i.e. residuals)
    as


    \(\hat{\theta} = \frac{1}{n} \sum_{i=1}^n x_i \quad \text{and} \quad \hat{\sigma}
    = 2\sqrt{\widehat{\text{Var}(X)} / \pi},\) (3.5.10)


    respectively, where


    \(\widehat{\text{Var}(X)} = \frac{1}{n-1} \sum_{i=1}^n (x_i - \hat{\theta})^2.\)
    (3.5.11)'
