    # ## 2.5.2 Desirable Properties of Estimators


    In this book, we will investigate several estimators for robust regression so
    we have to follow certain rules of engagement in order to ensure that they are
    well-suited for the machine learning task. Hence, we should understand certain
    properties of estimators that are considered desirable. Specifically, we prefer
    estimators that are consistent, asymptotically normal, and have a low bias and
    a low variance. While the material to be presented here is essential in the theoretical
    sense, it is not needed to follow most of the material in the rest of this book.
    However, in the interest of completeness, we provide the definitions below


    Let \(\theta\) be a scalar parameter of interest and \(\hat{\theta}_n\) be an
    estimate obtained using some estimator with sample size \(n\). Then, such an estimator
    is **consistent** if


    \(\hat{\theta}_n \xrightarrow{\text{p}} \theta \text{ as } n \to \infty.\)


    In simple terms, we want an estimator that is able to produce the true value given
    an infinite number of observations. That is, we want our estimator to converge
    “in probability” (denoted by \(\xrightarrow{\text{p}}\) above) to the true value
    as the number of observations in our dataset goes to infinity. This is an expression
    of the *Law of Large Numbers*. In practice, we have a finite amount of data but
    if the estimator is consistent, we can reasonably expect our estimate to be near
    the true value. Otherwise, we have little or no hope of finding its correct value.


    We prefer estimators that exhibit **asymptotic normality**, that is


    \(\sqrt{n}(\hat{\theta}_n - \theta) \xrightarrow{D} \mathcal{N}(0, \sigma^2),
    \text{ as } n \to \infty.\)


    This is a complicated looking expression, but we are expressing the desire to
    have an estimator that produces estimates that are distributed as a Gaussian.
    In simple terms, we want the distribution of the estimates obtained by using many
    different samples to be a Gaussian centered at the true value \(\theta\) with
    variance \(\sigma^2\) as \(n \to \infty\). More formally, we would like to have
    convergence “in distribution” (denoted by \(\xrightarrow{D}\) above) of the quantity
    \(\sqrt{n}(\hat{\theta}_n - \theta)\) to a Gaussian with a mean 0 and asymptotic
    variance \(\sigma^2\) (i.e. the asymptotic variance of \(\hat{\theta}\)). This
    property is derived from the *Central Limit Theorem* and says that the estimates
    have a Gaussian distribution which makes it easier to compute the uncertainty
    around each estimated value.


    Finally, the **bias** of an estimator is given as


    \(\text{bias} = \mathbb{E}[\hat{\theta}] - \theta.\)


    That is, how close is the expected value of our estimator to the true value. Ideally,
    the bias should be 0 in which case the estimator is said to be **unbiased**. Most
    of the estimators in this book will be unbiased except for the ones where we purposely
    introduce bias to reduce the variance. One notable example of a biased estimator
    is that of the sample variance. Most readers are familiar with the equation,


    \(\hat{\sigma}^2 = \frac{1}{n} \sum_{i=1}^n (x_i - \bar{x})^2,\)'
