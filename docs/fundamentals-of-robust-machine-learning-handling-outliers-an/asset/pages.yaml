  md: '# ### 1.9.2 k-Medians Clustering


    One problem with k-means clustering is that it is not robust to outliers. This
    issue will be highlighted in sections to follow, but there are many clustering
    problems that contain outliers and they will disrupt the ability to obtain acceptable
    results using k-means. A logical alternative is to use k-medians clustering which
    employs different distance, cost, and center calculations. The distance is typically
    given by the Manhattan distance (although Euclidean distance can also be used)
    as follows:


    ```

    \(\text{distance}(i,j) = \| \boldsymbol{x}^{(i)} - \boldsymbol{\mu}^{(i)} \|_1\)

    \(= |x_1^{(i)} - \mu_1^{(i)}| + |x_2^{(i)} - \mu_2^{(i)}| + \dots + |x_d^{(i)}
    - \mu_d^{(i)}|.\) (1.9.3)

    ```


    This \(L_1\) distance measure is used to determine the assignment of observations
    to clusters. Although this is typically used in k-medians, the \(L_2\) distance
    is also suitable for this purpose. The reason is that distance is a relative measure
    here so either of the two options may be used. What is crucial for robustness
    is the computation of the centers. After assignment, the centers are subsequently
    determined as the column-wise medians of the observations in each cluster:


    ```

    \(\boldsymbol{\mu}^{(i)} = \text{median}(\boldsymbol{C}_j) \quad \forall j = 1,
    \dots, K,\)

    ```


    where matrix \(\boldsymbol{C}_j\) contains the subset of rows of \(\boldsymbol{X}\)
    that belong in cluster \(j\).


    The cost is computed as follows:


    ```

    \(\text{cost} = \sum_{j=1}^K \sum_{\boldsymbol{i} \in \boldsymbol{C}_j} \| \boldsymbol{x}^{(i)}
    - \boldsymbol{\mu}^{(i)} \|_1.\) (1.9.4)

    ```


    The use of the median for center computation is what robustifies the algorithm.
    The centers are no longer controlled by outliers and reasonable values of centers
    that truly represent each each cluster will be found using this approach. To summarize,
    both the cost and distance measures of k-means can be used in the k-medians approach,
    so long as the centers are computed using the median.


    **Exercise:** Let cluster \(C_1\) consist of 3 elements of \(\boldsymbol{X} \in
    \mathbb{R}^{60 \times 2}\) given by \(\boldsymbol{x}^{(1)}, \boldsymbol{x}^{(2)}\),
    and \(\boldsymbol{x}^{(60)}\) of the matrix


    ```

    \(\boldsymbol{X} = \begin{pmatrix} 1 & 2 \\ 1 & 4 \\ \vdots & \vdots \\ 100 &
    100 \end{pmatrix}.\)

    ```


    Hence, \(C_1 = \{1, 2, 60\}\) in this case. What is the cluster median?


    **Ans.:** The data points in \(C_1\) are \(\boldsymbol{x}^{(1)} = (1, 2)^\top\),
    \(\boldsymbol{x}^{(2)} = (1, 4)^\top\) and \(\boldsymbol{x}^{(60)} = (100, 100)^\top\).
    The center is the coordinate-wise median. Therefore, \(\boldsymbol{\mu}^{(1)}
    = (1, 4)^\top\). This is about the same as the centroid \((4/3, 3)^\top\) found
    in an earlier exercise even though this dataset has an outlier at \((100, 100)^\top\)
    which is part of cluster \(C_1\). \(\square\)


    **Exercise:** Let \(\boldsymbol{X} \in \mathbb{R}^{60 \times 2}\) be defined as
    above. What is the Manhattan distance from \(\boldsymbol{x}^{(2)}\) to a cluster
    median \(\boldsymbol{\mu}^{(1)} = (1, 4)^\top\)?


    **Ans.:** The Manhattan distance is given by

    \(\text{distance}(2, 1) = \| \boldsymbol{x}^{(2)} - \boldsymbol{\mu}^{(1)} \|_1
    = |x_1^{(2)} - \mu_1^{(1)}| + |x_2^{(2)} - \mu_2^{(1)}|.\)

    Therefore, \(|1 - 1| + |4 - 4| = 0\). \(\square\)'
