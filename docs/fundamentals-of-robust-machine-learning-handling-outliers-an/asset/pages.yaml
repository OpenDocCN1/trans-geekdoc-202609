    \ = \\frac{1}{\\kappa}e^{-\\rho(x)},$$ (3.5.1)\n\nwhere $\\kappa$ is a normalization\
    \ coefficient. Here, $f_X(x)$ is the PDF we seek. We should keep in mind that\
    \ the distribution associated with a loss function must be centered at 0; in other\
    \ words, we expect it to be symmetric about 0. Hence, the mean of the distribution\
    \ is 0, or mathematically $\\mathbb{E}[X] = 0$. The reverse MLE procedure can\
    \ be applied to well-known loss functions, such as $L_1$, $L_2$, and Huber. We\
    \ illustrate the steps for $L_1$ and $L_2$ in the following examples and leave\
    \ the derivation of the Huber distribution as an exercise for the reader.\n\n\
    **Example**: To find the distribution associated with the $L_1$ loss function,\
    \ we begin with the term\n\n$$\rho_{L_1}(x) = |x|.$$\n\nThen we apply the reverse\
    \ MLE rule above to obtain\n\n$$f_X(x) = \\frac{1}{\\kappa}e^{-|x|}.$$\n\nWe can\
    \ find $\\kappa$ as follows:\n\n$$\\kappa = \\int_{-\\infty}^{\\infty} e^{-|x|}\
    \ dx = 2.$$\n\nHence, the basic form of the distribution for the $L_1$ loss is\n\
    \n$$f_X(x) = \\frac{1}{2}e^{-|x|},$$ (3.5.2)\n\nwhich is called the *Laplace distribution*.\n\
    \n**Example**: To find the distribution associated with the $L_2$ loss function,\
    \ we begin with the term\n\n$$\rho_{L_2}(x) = x^2/2.$$\n\nThen we apply the reverse\
    \ MLE rule above to obtain\n\n$$f(x) = \\frac{1}{\\kappa}e^{-x^2/2}.$$\n\nWe can\
    \ find $\\kappa$ as follows:\n\n$$\\kappa = \\int_{-\\infty}^{\\infty} e^{-x^2/2}\
    \ dx = \\sqrt{2\\pi}.$$\n\nHence, the basic form of the distribution for the $L_2$\
    \ loss function is\n\n$$f_X(x) = \\frac{1}{\\sqrt{2\\pi}}e^{-x^2/2},$$ (3.5.3)\n\
