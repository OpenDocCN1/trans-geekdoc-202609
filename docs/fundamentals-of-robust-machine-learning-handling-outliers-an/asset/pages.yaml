    The four visualization methods for detecting outliers can be combined into a “quad-plot”
    for residuals. The quad-plot encapsulates all four diagnostic methods, namely,
    the OAR-plot, boxplot, histogram, and QQ-plot. By examining all four plots together,
    it is much easier to determine whether or not the dataset has outliers. To illustrate
    the process, we compare the Swiss fertility dataset (which has no outliers) with
    the Boston Housing dataset (which has over 50 outliers).


    The quad-plot for the Swiss Fertility dataset based on LC residuals is given in
    Figure 4.17. If we examine each one separately, we may get conflicting results.
    For example, the boxplot indicates that there are no outliers. This is confirmed
