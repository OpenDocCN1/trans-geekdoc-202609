    now a matrix Y whereby each element $y_{ij} \in [0, 1]$. The neural network is
    then trained on a dataset of images, each with 784 inputs and 10 outputs with
    one-hot encoded labels.


    # 10.3.1 Neural Network Architecture


    The NN architecture to be used is as follows: 784 inputs, 25 units in the hidden
    layer, and 10 units in the output layer as shown in Figure 10.4. Each image is
    unrolled and normalized into 784 pixel values to be used as input. The output
    activation is based on softmax. The 25 hidden units all use relu activation. Roughly
    speaking, this amounts to 20,000 parameters. Each image is labeled from 0 to 9
    and then one-hot encoded to form a binary output for the NN. These are all standard
    steps in mapping an image and label for training purposes onto a fully connected
    neural network.


    Exercise: How many total parameters are there in the neural network of Figure
    10.4. Include all weights and biases.


    Ans.: For the first layer, there are 784 x 25 + 25 = 19,625 parameters. For the
    second layer, there are 25 x 10 + 10 = 260. Thus, the total number of parameters
    19,885.


