  md: 'the model parameters. The hyperparameter \(\lambda\) plays the role of \(c\)
    in the original constrained minimization problem of Eq. (5.2.3). The solution
    to the regression problem of the form


    ```

    \(\hat{\boldsymbol{\beta}}^{\text{loss-penalty}} = \underset{\boldsymbol{\beta}
    \in \mathbb{R}^d}{\text{argmin}} J^{\text{loss-penalty}}(\boldsymbol{\beta})\)

    ```


    is called a penalty estimator.


    Penalized loss functions can be used to solve regression problems even in the
    absence of multicollinearity, and that is what is done in practice. The notion
    of multicollinearity is more of legacy justification and is rarely mentioned because
    of the enormous benefits obtained when using penalty functions. For example, they
    can be used to prevent overfitting or for variable selection to reduce model complexity
    and improve model interpretability. These are major advantages that are achieved
    through penalized estimators, making them critical to many data science problems.


    # ## 5.3 Ridge Penalty


    The most widely used form of penalty estimation is the one we have encountered
    already called ridge regression. The objective function using the least squares
    loss and ridge penalty is given by


    ```

    \(J^{\text{LS-ridge}}(\boldsymbol{\beta}) = \frac{1}{2} \sum_{i=1}^n (y_i - \mathbf{x}_i^\mathsf{T}
    \boldsymbol{\beta})^2 + \lambda \sum_{j=1}^d \beta_j^2.\)

    ```


    Surprisingly, it is equivalent to Eq. (5.2.2) although it seems to bear little
    or no resemblance to it except for the use of \(\lambda\). But they are indeed
    both penalized least squares. Because of its formulation seen above, the ridge
    penalty function is sometimes referred to as an L\(_2\) penalty since it is based
    on the L\(_2\)-norm. Its primary purpose is to shrink the parameters thus moving
    the estimates away from the unbiased value and toward \(\boldsymbol{\beta} = \mathbf{0}\).
    By properly tuning \(\lambda\), it is possible to apply enough shrinkage to the
    parameters such that the resulting biased estimates provide a lower variance and
    a more accurate model for prediction. Note that \(\boldsymbol{\beta} = (\beta_0,
    \beta_1, \dots, \beta_d)^\mathsf{T}\) but the intercept is not included in the
    penalty function. That is, \(\beta_0\) is typically left out of the shrinkage
    process and is instead adjusted to accommodate the overall level of shrinkage
    of the other parameters.


    To simplify the function, if we let \(r_i = y_i - \mathbf{x}_i^\mathsf{T} \boldsymbol{\beta}\),
    the objective function becomes


    ```

    \(J^{\text{LS-ridge}}(\boldsymbol{\beta}) = \frac{1}{2} \sum_{i=1}^n r_i^2 + \lambda
    \sum_{j=1}^d \beta_j^2.\)

    ```


    The objective function using the log-cosh (LC) loss and ridge penalty is given
    by


    ```

    \(J^{\text{LC-ridge}}(\boldsymbol{\beta}) = \frac{1}{a} \sum_{i=1}^n \log(\cosh(ar_i))
    + \lambda \sum_{j=1}^d \beta_j^2.\)

    ```


    For linear regression, \(a = 2\) as discussed in Chapter 4.


    For the Huber case, we use


    ```

    \(J^{\text{H-ridge}}(\boldsymbol{\beta}) = \sum_{i=1}^n \rho_H(r_i) + \lambda
    \sum_{j=1}^d \beta_j^2,\)

    ```'
