    But how far is CELR from the ground truth, and what changes in variable values
    would be needed for LCLR to make the wrong decision? These types of questions
    are referred to as **counterfactuals**. It involves the adjustment of the test
    data values (typically one at a time) to obtain a desired outcome. For each variable,
    the data is increased and decreased to understand how it affects the response.
    In the case of LCLR, we want to know what specific changes in values would lead
    to an incorrect decision. Conversely, since CELR is not correct, we would ask
    what changes in data values would lead to a correct decision. These are unusual
    questions in that we are trying to coerce the opposite outcome from what the algorithm
    produces, hence the name counterfactuals.


    When testing counterfactual hypotheses, it is important to bound the values of
    the variables to the appropriate ranges. For example, an `Age` value of 150 is
    unreasonable so it should not be allowed. Likewise, `Pclass` cannot be set to
    4 since it can only hold values of 1, 2, or 3. Given these types of constraints
    on the Titanic dataset, it is difficult to flip the decision in LCLR unless `Parch`
    and `SibSp` are increased. This implies that *the decision made by LCLR is quite
    robust and tolerant to small changes in the data*. However, the incorrect decision
    made by CELR can be flipped easily by adjusting either `Pclass`, `Age`, `Fare`,
    or `Embarked`. The decision is not robust and reflects the characteristics of
    CELR itself. Therefore, when faced with the choice of robust methods and non-robust
    methods, it is clear that robust methods offer the opportunity to make intuitive
    and reasonable explanations for binary decisions made in classification problems
    because they are quite stable. For CELR, the explanations are not as reliable
    in the presence of outliers.


