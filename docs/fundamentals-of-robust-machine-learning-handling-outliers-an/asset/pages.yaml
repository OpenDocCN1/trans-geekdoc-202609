    # 1.6 Review of Gaussian Distribution


    One of the most important distributions in statistics is the well-known Gaussian
    or normal distribution. This subject has been covered in countless papers, books,
    and online resources. It will be referenced many times throughout this book, so
    it is presented here for completeness. It is assumed that the reader is well-versed
    in this area as a prerequisite, but a brief tutorial is provided for review purposes.'
