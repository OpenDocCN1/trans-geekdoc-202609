    criteria, the generic algorithm becomes a specific algorithm.


    # 1.9.1 k-Means Clustering


    The first approach is called k-means clustering. In phase 1, points are assigned
    to their closest center based on an L2 distance measure. Each distance is computed
    as follows:


    ```

