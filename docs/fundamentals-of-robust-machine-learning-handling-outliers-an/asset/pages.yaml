  md: 'The above equation can also be written in matrix form as


    \(\boldsymbol{y} = \begin{bmatrix} 1 & x_1 \\ 1 & x_2 \\ \vdots & \vdots \\ 1
    & x_n \end{bmatrix} \begin{bmatrix} \beta_0 \\ \beta_1 \end{bmatrix} + \begin{bmatrix}
    \varepsilon_1 \\ \varepsilon_2 \\ \vdots \\ \varepsilon_n \end{bmatrix} = \boldsymbol{X}\boldsymbol{\beta}
    + \boldsymbol{\varepsilon},\)

    (2.4.2)


    where \(\boldsymbol{\beta} = (\beta_0, \beta_1)^\top\) and \(\boldsymbol{X}\)
    is now a matrix with 1''s inserted in the first column. The equation for the error
    term is


    \(\boldsymbol{\varepsilon} = \boldsymbol{y} - \boldsymbol{X}\boldsymbol{\beta}.\)

    (2.4.3)


    **Exercise:** A dataset has \(\boldsymbol{x} = (1, 2, 3, 4, 5)^\top\) and \(\boldsymbol{y}
    = (1.1, 1.9, 3.4, 4.1, 4.8)^\top\). Write the matrix equation in the form of Eq.
    (2.4.2).


    **Ans.:** The equation takes the form:


    \(\begin{bmatrix} 1.1 \\ 1.9 \\ 3.4 \\ 4.1 \\ 4.8 \end{bmatrix} = \begin{bmatrix}
    1 & 1 \\ 1 & 2 \\ 1 & 3 \\ 1 & 4 \\ 1 & 5 \end{bmatrix} \begin{bmatrix} \beta_0
    \\ \beta_1 \end{bmatrix} + \begin{bmatrix} \varepsilon_1 \\ \varepsilon_2 \\ \varepsilon_3
    \\ \varepsilon_4 \\ \varepsilon_5 \end{bmatrix}.\)


    The 1''s in the first column of the \(\boldsymbol{X}\) matrix are needed to incorporate
    the intercept parameter, \(\beta_0\).


    In the exercise above, the two parameters should be considered the true values
    of \(\beta_0\) and \(\beta_1\). Unfortunately, we do not know them so we have
    no way to obtain the true errors. However, we can compute the residuals using
    the estimates of the parameters and use them as a proxy for the true errors. The
    residuals are given by


    \(\boldsymbol{r} = \boldsymbol{y} - (\hat{\beta}_0 + \hat{\beta}_1 \boldsymbol{x})
    = \boldsymbol{y} - \boldsymbol{X}\hat{\boldsymbol{\beta}}.\)

    (2.4.4)


    Again, the true errors are based on the true parameter values while the residuals
    are based on the estimated parameter values.


    # ## 2.4.2 Residuals in Loss Functions


    Our goal in estimation is to minimize the *sum of terms that are a function of
    the residuals* to obtain \(\hat{\boldsymbol{\beta}}\). This can be done in a variety
    of different ways but they will all require the use of the residuals. In addition,
    we need to assume that the residuals are distributed in a certain way so that
    we can apply suitable techniques to estimate the slope and the intercept. *Making
    assumptions about the error distribution will, in turn, define the loss function.*
    This is an important point. When we choose a loss function, we are implicitly
    requiring that the residuals obey a particular distribution associated with that
    loss function. After regression, the computed residuals may be used to check if
    our assumptions about their distribution are correct.


    Two important loss functions that arise from well-known distributions are the
    \(L_1\) and \(L_2\) loss functions. We saw how the \(L_1\)- and \(L_2\)-norms
    were used in Chapter 1 and they will be the two competing loss functions for simple
    linear regression in this chapter. First, we define the \(i\)th residual as, \(r_i
    = y_i - (\hat{\beta}_0 + x_i \hat{\beta}_1),\)'
