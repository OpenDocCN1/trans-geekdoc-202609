    Algorithm 4.1 Iterative boxplot method for outlier removal.

    1: Input: entire dataset X, y;

    2: set n=number of observations, d=number of variables,

    outliers= n, Ifactor=1.5

    3: while outliers > 0 do

    4: run LC regression

    5: compute residuals r_i = y_i - X_i^T β^LC for i = 1, ..., n

    6: compute U = Q3 + Ifactor×IQR for residuals

    7: compute L = Q1 - Ifactor×IQR for residuals

    8: compute outliers = Σ_{i=1}^n(r_i > U) + Σ_{i=1}^n(r_i < L)

    9: for i = 1, ..., n

    10: remove row i from dataset if r_i > U or r_i < L

    11: end for

    12: Ifactor = Ifactor + 50/n

    13: end while

    14: run LS regression

    15: use quad-plot of LS residuals on reduced dataset as a final check

    16: Output: outlier-free dataset;

    ```


    # # 4.8 Regression Metrics with Outliers


    A variety of metrics are used to evaluate the performance of various machine learning
    tools relative to one another. These metrics are statistical in nature and some
    are prone to be misleading if not used carefully, especially with outliers in
    datasets. In particular, if a robust metric such as MAE is not used, then it is
    possible that a non-robust regression such as LS will look better according to
    the MSE metric, when in reality a robust regression is performing better. How
    can we tell if a metric is not robust? As a general rule, every time the word
    “mean” appears in a metric, it should be interpreted as non-robust and somewhat
    unstable in the presence of outliers. The goal of this section is to compare and
    contrast MSE and MAE and provide recommendations for their proper usage.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 4.8.1 Mean Square Error (MSE)


    The MSE is one of the most popular metrics used with LS. It is given by


    \( MSE = \frac{1}{n} \sum_{i=1}^n (y_i - \hat{y}_i)^2 = \frac{1}{n} \sum_{i=1}^n
    r_i^2, \qquad (4.8.1) \)


    where \( n \) is the number of data points in the dataset, \( r_i = y_i - \hat{y}_i
    \), and \( y_i \) represents the \( i \text{th} \) true response while \( \hat{y}_i
    \) is the predicted response. There is a problem using this metric with outliers
    that we will illustrate using the Belgium telephone dataset (see Section 4.2).
    For simple linear regression using least squares and log-cosh methods, which one
    provides a smaller error?


    The results of the regressions and histograms of the associated residuals of LS
    and LC are plotted in Figure 4.19. If we compute the MSE for the two cases, we
    find that for LS regression, MSE = 29.0, and for LC regression, MSE = 42.4. This
    informs us that LS is better than LC. Unfortunately, the opposite is actually
    true. The six outliers in the dataset force the LS regression to produce a line
    that does not represent the true data. Consider the values of the two residuals
    shown in the figure as \( r_i \). In the LS case, the residuals are all smaller
    due to the proximity of the line to the outliers. However, in LC, there is a large
    distance to the outliers from the regression line so the MSE will be necessarily
    higher. This is also shown clearly by examining the two histograms in Figure 4.19.
    In the LC case, the large residuals will lead to a large MSE. Therefore, we must
    not be tempted to use MSE as a reliable metric with outliers.


    ![](img/f26d7f591c2a080d86425985301266a4_138_0.png)


    Figure 4.19 Regression lines and residual histograms for LS and LC on the Belgium
    telephone data with six outliers.'
  merge: -1
