    # ### 8.7.1 Overfitting and Underfitting


    In Figure 8.10, the concepts of overfitting and underfitting in binary classification
    are illustrated in a two-dimensional space. The 1''s represent Class 1 and the
    0''s represent Class 0. The model parameters define the decision boundary between
    the two classes. In Figure 8.10(a), the decision boundary is shown to be some
    complex path through the data to separate 1''s and 0''s. This overfitted situation
    produces high accuracy on the training data. Note that if there are outliers present,
    as shown in the figure, they will not be predicted correctly. Therefore, 100%
    accuracy may not be achieved in training sets with outliers even if the model
    is overfitted. In any case, the nonlinear decision boundary may not be general
    enough to obtain good accuracy on test data. The reason is that there are overfitted
    regions that are stretched out to capture 0''s and this may cause errors in classification
    on a test set.


