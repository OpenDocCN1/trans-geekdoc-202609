- pgno: 106
  md: 'The slope of the tanh(x) function around the origin is quite shallow. However,
    it can be made tunable by introducing a hyperparameter, a, as follows:


    $\rho(x; a) = \tanh(ax).$


    The new hyperparameter controls the steepness of the slope as the function transitions
    from -1 to 1. By integrating, we obtain


    $\rho(x; a) = \frac{1}{a} \log(\cosh(ax)).$


    This is the general loss term for log-cosh with a hyperparameter a which gives
    it more flexibility. This flexibility, in effect, controls the degree of robustness
    of the general log-cosh loss. We called this hyperparameter the robustness coefficient.


    The general form of the loss function can be written as


    $J^{\text{LC}}(x; a) = \sum_{i=1}^n \frac{1}{a} \log(\cosh(ax_i)) = \sum_{i=1}^n
    \rho(x; a),$


    where a is the robustness coefficient that can be adjusted as needed. We have
    been using a = 1 thus far in this chapter but we will find that most of the useful
    values are associated with a > 1.


    The loss term $\rho(x; a)$ is shown for different values of a in Figure 3.6 in
    the top panel along with the $L_1$ loss term with the V-shape given in bold. The
    derivative is given by


    $\psi(x; a) = \tanh(ax).$


    The effect of increasing a on the derivative is to sharpen the slope of the transition
    from -1 to 1 as shown in Figure 3.6 in the lower panel. The derivative of the
    $L_1$ loss is given in bold for comparison purposes.


    The general log-cosh estimator is defined as


    $\hat{\beta}^{\text{LC}} = \underset{\beta \in \mathbb{R}^{d+1}}{\text{argmin}}
    \sum_{i=1}^n \frac{1}{a} \log(\cosh(ar_i)).$


    The importance of the robustness coefficient cannot be overstated. It determines
    whether the loss function is weakly robust, that is, slightly better than $L_2$,
    or strongly robust, that is, approaching $L_1$.


    The distribution from which this loss function arises can be derived by running
    the MLE procedure in reverse, as shown earlier in Section 3.5. We first take one
    term of the summation and note that it was the result of the negative log-likelihood.
    Therefore, we should negate it to obtain


    $-\rho(x) = -\frac{1}{a} \log(\cosh(ax)).$


    Next we can move the leading coefficient inside the log expression


    $-\rho(x) = \log(\cosh(ax)^{-\frac{1}{a}}).$


    Then we exponentiate the expression to obtain


    $e^{-\rho(x)} = \frac{1}{(\cosh(ax))^{\frac{1}{a}}}.`


    If we integrate this from $-\infty$ to $\infty$, it will produce the normalization
    coefficient,


    $\int_{-\infty}^{\infty} \frac{1}{((\cosh(ax))^{\frac{1}{a}})} = \kappa_a.$'
