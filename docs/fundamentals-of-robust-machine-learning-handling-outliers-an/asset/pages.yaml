    # 3.5 Deriving the Distribution for Log-Cosh


    It is important to understand the log-cosh loss function from both theoretical
    and foundational perspectives in order to appreciate its true value. Therefore,
    we need to study probability-based statistical models associated with this loss
    function and relate the results to the underlying distributions. In this section,
    we show how to derive this loss function and then provide a more mathematically
    rigorous view of its origin.


    The log-cosh loss function can be derived from a probability density function
    (PDF) using the maximum-likelihood procedure. The challenge is to figure out which
    probability distribution to use as a starting point when only the loss function
    is known. The goal in this section is to find the associated PDF, $f_X(x)$. To
    do this, consider the relationship between $f_X(x)$ and one term of the loss function,
    $\rho(x)$. Since we know that the maximum-likelihood procedure (after constants
    are removed) produces


    ```

    $\rho(x) = -\log f_X(x)$,

    ```'
