  md: 'datasets so we could simply square it to obtain \((\hat{\theta} - \theta)^2\)
    and define a metric called the **quadratic risk** (QR) (see Saleh et al. 2022)
    which is given by$^1$


    \(\text{QR} = E[(\hat{\theta} - \theta)^2].\)


    The idea behind this metric is to monitor the expected value of the squared difference
    between the estimated value \(\hat{\theta}\) and the true value \(\theta\). We
    can use this quantity to compare various estimators. In practice, the expected
    value is replaced with the average of the squared error.


    It is difficult to use the equation in this form because we do not know \(\theta\),
    but there are two fundamental quantities that make up the QR: the bias and variance.
    These two quantities tend to go in opposite directions to one another and this
    becomes the basis for the trade-off in the QR. We can obtain the bias-variance
    relationship by starting with the equation for the variance of a random variable
    \(X\) (see Chapter 2),


    \(\text{Var}(X) = E[X^2] - E[X]^2,\)


    and rearranging it to obtain


    \(E[X^2] = \text{Var}(X) + E[X]^2.\)


    Then letting \(X = \hat{\theta} - \theta\), we obtain


    \(E[(\hat{\theta} - \theta)^2] = \text{Var}(\hat{\theta} - \theta) + (E[\hat{\theta}
    - \theta])^2 = \text{Var}(\hat{\theta}) + (E[\hat{\theta}] - \theta)^2.\)


    The first term is obviously the variance of \(\hat{\theta}\). The second term
    is simply the bias squared. Recall from Chapter 2 that the bias is given by


    \(\text{bias} = E[\hat{\theta}] - \theta.\)


    This is a measure of how close the expected value of our estimator is to the true
    value. Ideally, the bias should be 0 in which case the estimator is said to be
    **unbiased**.


    More concretely, if we have 100 datasets and compute 100 estimates of \(\theta\)
    using those datasets, we can measure _how close the average of those estimates
    is to the true value of \(\theta\)._ Now imagine an infinite number of datasets
    and carrying out the same measurements. Surely, the average will be equal to the
    true value. Not necessarily. It is only true if the estimator is unbiased. Perhaps
    an equivalent way to think about it would be “how close is the average estimate
    to the true value if we had an infinite number of datasets?”.


    With this understanding of the QR, we can now write that


    \(\text{QR}(\hat{\theta}) = E[(\hat{\theta} - \theta)^2] = \text{Var}(\hat{\theta})
    + \text{bias}^2(\hat{\theta}).\)


    This equation lies at the heart of the bias–variance trade-off, a key part of
    many machine learning procedures.


    **Exercise:** An estimator is used on \(N = 5\) datasets and each dataset produces
    a different estimate as follows: 0.25, 0.27, 0.29, 0.23, and 0.24. The true value
    is 0.25. Calculate the bias. (Hint: replace the expectation with an average.)


    **Ans.:** \(E[\hat{\theta}] \approx \frac{1}{5} \sum_{i=1}^5 \hat{\theta}_i =
    (0.25 + 0.27 + 0.29 + 0.23 + 0.24)/5 = 0.256\). Therefore, \(E[\hat{\theta}] -
    \theta \approx 0.256 - 0.25 = 0.006\).


    1 The quadratic risk is often referred to as the mean-squared error but we will
    continue to use quadratic risk to avoid confusion with the MSE metric of Chapter
    4.'
