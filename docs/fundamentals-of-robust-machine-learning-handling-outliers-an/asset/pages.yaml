  md: '![](img/f26d7f591c2a080d86425985301266a4_36_0.png)


    Figure 1.7 Dataset before and after clustering.


    assigning data points to their closest center. In the second phase, the centers
    of each group are recomputed using the data points assigned to it. Then a suitable
    cost function is computed for the new arrangement. The iterations continue through
    the two phases until convergence is achieved. This occurs when the cost function
    is minimized and the K groups no longer change. The loop is referred to as a Lloyd-style
    iteration process.


    The algorithm is sensitive to the initial guesses so it is worth discussing some
    of the options for initialization. The simplest approach is to pick K random points
    from the n total points in the dataset as suggested in the algorithm. Unfortunately,
    these random values may be close to one another and that is not desirable because
    it may lead to unbalanced clustering. Another way is to choose K + m initial centers
    and later remove m centers to produce K clusters. This is sometimes used to find
    outliers in the data. A third initialization scheme involves picking K centers
    that are far away from each other. This allows a more balanced set of clusters
    to form. In any case, some clever method should be used to pick the K centers.
    Otherwise, the results may not be satisfactory for their intended purpose.


    # Algorithm 1.1 Generic clustering algorithm using Lloyd-style iteration.


    ```

    1: Input: dataset X, number of clusters = K;

    2: Initialize centers using K random points of X, cost_old = 0, cost_new = maxcost;

    3: repeat until (|cost_new - cost_old| < ε):

    4: Define K new clusters, C1, ..., Ck, by assigning each point to the nearest
    center;

    5: Recompute K cluster centers of C1, ..., Ck;

    6: cost_old = cost_new;

    7: Compute cost_new using a distance-based cost function;

    8: end repeat

    9: Output: final clusters, C1, ..., Ck;

    ```'
