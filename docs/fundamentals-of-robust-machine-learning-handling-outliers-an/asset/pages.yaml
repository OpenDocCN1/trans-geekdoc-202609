    # Figure 12.4 Using RMSE and MAE to find iteration count for regularization.


    median-absolute error (MAE), as described in Chapter 4. The RMSE criteria is effective
    when outliers are **not** present in the test set whereas MAE is more suitable
    for test sets with outliers. When splitting the data into random CV training and
    test sets, there may be an unknown number of outliers in the test set. Therefore,
    it is better to use the sum of the RMSE and MAE to find the optimal number of
    iterations.


    In Figure 12.4, each gray trajectory represents a different combination of CV
    training and test sets, as described above. The dark trajectory is the average
    of the 10 trajectories and it indicates that an iteration count in the neighborhood
    of 300 is suitable for this dataset. This value is now fixed for all further comparisons
    using the neural network.


    # 12.2.3 Comparison of LSNN and LCNN


    The next step is to use the above methodology to compare least squares NN (LSNN)
    and log-cosh NN (LCNN). For the purposes of the comparison, we consider four different
    cases involving outlier inclusion and removal. First, we remove all outliers that
    were found during EDA (see Table 12.1) and run a comparison between the robust
    and non-robust regressions. Second, we remove only the $50K data that look suspicious
    (see Figure 12.1) and rerun the regressions. These two cases will allow us to
    gain some insight into the inherent problems of the removal of outliers detected
    during EDA using only boxplots, histograms and quantiles of explanatory and response
    variables. Third, we keep all the outliers in the dataset and re-run the regressions.
    Finally, we remove all outliers using the iterative boxplot method (see Chapter
    4), which is a very effective method, and rerun the regressions.


    A comparison of the four cases, with the number of outliers removed in parentheses,
    is shown in Table 12.2. The comparison metrics are the RMSE and the MAE. There
    are several things to note in Table 12.2. First, the RMSE and MAE metrics are
    higher for LSNN compared to LCNN in all cases on the training set. However, the
    true measure of the quality of a model is the prediction accuracy on the test
    set. We see that the first column has the highest errors of the four cases. This
    is the problem with using EDA as the guide to outlier detection. It removes some
    inliers along with some outliers, but not necessarily all outliers.'
