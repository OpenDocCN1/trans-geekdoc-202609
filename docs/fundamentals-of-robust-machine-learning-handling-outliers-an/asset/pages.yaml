    # ## 4.7 Regression-Based Outlier Removal


    The task of actually removing outliers is fraught with peril. It is a risky business
    which is why we have been advocating the use of robust methods. However, many
    users of machine learning tools prefer to remove outliers rather than switch to
    robust methods. Some statistical methods require outlier-free data. There may
    also be no choice in some settings other than to remove outliers so we must develop
    methods that are fast and accurate for the intended purposes. We describe a method
    for surgically removing outliers using robust LC regression and the boxplot metrics.


