    # 8.10.3 k-Nearest Neighbors (k-NN)


    The k-nearest neighbors (k-NN) approach is rather simple and straightforward.
    It offers good results in a short amount of time and has robust characteristics.
    It operates by first computing the distance from a given test point to all points
    in the training data. Then, as its name implies, the nearest k neighbors are used
    to predict the binary outcome based on a simple majority vote of the neighbors,
    or a weighted combination based on the distance from the test point. For example,
    if k = 3, then three nearest neighbors of the test point are used to determine
    the class of the test point. If two neighbors are from Class 0 and one neighbor
    is from Class 1, the test point is assigned to Class 0. Odd numbers of k are preferred
    to avoid ties. The distance can be computed in a variety of ways including the
    Euclidean distance, the Manhattan distance, or any other suitable measure. The
    dataset should be standardized to obtain good results.'
