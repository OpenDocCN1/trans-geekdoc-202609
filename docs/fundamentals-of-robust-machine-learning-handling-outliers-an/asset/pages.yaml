    # 8.10.2 Support Vector Machines (SVMs)


    The basic SVC approach described above can only produce linear boundaries with
    large margins. Polynomial expansion can be used to produce nonlinear boundaries.
    However, the SVM is a more powerful formulation based on duality to allow for
    nonlinear boundaries without resorting to polynomial expansion. First, recall
    that \(\beta\) represents the model parameters for each data column in the training
    set. Next, let \(\alpha\) be the model parameters associated with each row of
    the training data, as shown in Figure 8.21. This is not something we have considered
    thus far but it is quite feasible to formulate the problem in a dual form. Now,
    we want to relate \(\beta\) and \(\alpha\) in our formulation as follows:


    ```

    \(\beta = \sum_{i=1}^n \alpha_i y_i x_i.\) (8.10.4)

    ```


    In other words, there is a relationship captured above between the optimal column
    coefficients and the optimal row coefficients based solely on the data. Notice
    that we now have n parameters, essentially one


    | | \(\beta_1\) | \(\beta_2\) | \(\cdots\) | \(\beta_d\) | y |

    |---|---|---|---|---|---|

    | \(\alpha_1\) | \(X_{11}\) | \(X_{12}\) | \(\cdots\) | \(X_{1d}\) | 1 |

    | \(\alpha_2\) | \(X_{21}\) | \(X_{22}\) | \(\cdots\) | \(X_{2d}\) | 0 |

    | \(\alpha_3\) | \(X_{31}\) | \(X_{32}\) | \(\cdots\) | \(X_{3d}\) | 1 |

    | \(\vdots\) | \(\vdots\) & Dataset & \(\vdots\) | \(\vdots\) | \(\vdots\) |

    | \(\alpha_n\) | \(X_{n1}\) | \(X_{n2}\) | \(\cdots\) | \(X_{nd}\) | 0 |


    Figure 8.21 Relationship between \(\alpha\)''s and \(\beta\)''s in SVMs.'
