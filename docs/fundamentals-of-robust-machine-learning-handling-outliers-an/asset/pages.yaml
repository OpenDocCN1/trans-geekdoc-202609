    In this section, we discuss two common methods of outlier diagnosis where the
    objective is to determine if any outliers exist in the data. These methods are
    typically employed during exploratory data analysis (EDA). Without running any
    form of regression, only the explanatory and response variables are available
    for diagnosis. This is where the problem of inadvertently removing inliers occurs
    because it is difficult to tell outliers from inliers at this stage. However,
    after running a linear regression, the residuals are available for examination
    and they can be used to more accurately identify outliers. In a later section,
    we address detection and removal using residuals.


    # ## 4.3.1 Boxplots


    The easiest way to identify outliers is by using a boxplot. This compact graphical
    tool visually represents a one-dimensional set of data values, offering a quick
    snapshot of the inliers and outliers. The idea of a boxplot is to order the data
    values from smallest to largest and then identify where the bulk of the values
    reside to assess whether there are outliers beyond this range. Specifically, we
    identify the quartiles of the'
