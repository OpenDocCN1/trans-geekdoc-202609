    # 8.10.4 Decision Trees and Random Forest


    In this last section, we briefly describe tree-based methods for binary classification.
    Generally speaking, both decision trees and random forest methods are robust to
    outliers. Figure 8.25 shows a decision tree on the left for three variables, a,
    b, and c. The tree is built by starting at the root node and sequencing through
    the variables. For each selected variable, a threshold t is chosen such that the
    rows in the training set with that variable value t follow one branch of the tree
    while those below t follow the other branch. The thresholds for a, b, and c are
    found separately for each variable and are labeled ta, tb, and tc, respectively.
    Since the threshold is typically selected at some midpoint in the data, the outliers
    do not affect this part of the process. The number of levels in the tree is referred
    to as the tree depth. Once built, the tree is used for prediction. Each new data
    point starts at the root node and follows a path through the tree based on the
    thresholds until some leaf node is reached. At that point, the prediction is based
    on the points in that leaf node of the tree.


    Decision trees can be overfit by having too many levels and only one point in
    each leaf node. In this case, outliers may cause problems in the prediction phase.
    The depth of the tree can be controlled by restricting the number of levels in
    the tree and the minimum number of samples in a leaf node. For regularization
    purposes, the tree is often constrained by two hyperparameters, `max_depth` and
    `min_samples`. Assuming the decision tree has been regularized properly, outliers
    may not play a significant role in the prediction of new points in binary classification.
    Furthermore, decision trees have much more explanatory power than k-NN and SVMs.
    Data scientists are usually interested in the relative importance of each variable
    and they prefer methods for which the results can be rationalized. In the decision
    tree of Figure 8.25, the binary outcome of any new point can be easily interpreted
    based on the path it takes through the tree from the root node at the top to some
    leaf node at the bottom because a clear decision is made at each intermediate
    node.


    Random forests are quite robust to outliers but for a different reason. Consider
    the illustration on the right side of Figure 8.25. It shows m random trees created
    by selecting different subsets of the rows and columns of the training set. For
    prediction, the results from many trees are combined to produce the result. When
    combining the trees for prediction, it is more tolerant to outliers since a bad
    prediction in one tree is usually compensated by good predictions in the other
    trees. Also, random forests are regularized by design so they are not prone to
    overfitting which causes the sensitivity to outliers. This is a very effective
