  md: 'If we set $w_j = 1/|\hat{\beta}_j^*|$, where $\hat{\beta}_j^*$ is a known quantity
    typically set to the unpenalized estimate for $\beta_j$, we obtain the new penalty
    function


    $P(\boldsymbol{\beta}) = \lambda \sum_{j=1}^d \frac{|\beta_j|}{|\hat{\beta}_j^*|}
    = \sum_{j=1}^d \lambda_j |\beta_j|, \qquad (5.9.2)$


    where $\lambda_j = \lambda / |\hat{\beta}_j^*|$. Hence, each parameter has its
    own effective $\lambda_j$ based on the unpenalized estimates. Then, small $\hat{\beta}_j^*$
    values will lead to large weights which is equivalent to a high $\lambda_j$, while
    large $\hat{\beta}_j^*$ values would be equivalent to a small $\lambda_j$. This
    makes sense intuitively since the unpenalized solution has valuable information
    about the magnitude of the estimates, which in turn can be used as a weighting
    factor to guide the aLASSO estimation in the right direction for the removal of
    unimportant variables. Although somewhat more complicated than ridge or LASSO,
    the aLASSO approach provides a powerful mechanism for model reduction.


    The objective function for a least squares loss with an aLASSO penalty function,
    assuming that the unpenalized estimates are known and given by $\hat{\beta}_j^{\text{LS}}$
    for $j = 1, ..., d$, is


    $J^{\text{LS-aLASSO}}(\boldsymbol{\beta}) = \frac{1}{2} \sum_{i=1}^n r_i^2 + \lambda
    \sum_{j=1}^d \frac{|\beta_j|}{|\hat{\beta}_j^{\text{LS}}|}$.


    The objective function for a log-cosh loss with an aLASSO penalty function, assuming
    that the unpenalized estimates are known and given by $\hat{\beta}_j^{\text{LC}}$
    for $j = 1, ..., d$, is


    $J^{\text{LC-aLASSO}}(\boldsymbol{\beta}) = \frac{1}{a} \sum_{i=1}^n \log(\cosh(ar_i))
    + \lambda \sum_{j=1}^d \frac{|\beta_j|}{|\hat{\beta}_j^{\text{aLC}}|}$.


    Finally, in the Huber case, assuming that the unpenalized estimates are known
    and given by $\hat{\beta}_j^{\text{H}}$ for $j = 1, ..., d$, we use


    $J^{\text{H-aLASSO}}(\boldsymbol{\beta}) = \sum_{i=1}^n \rho_H(r_i) + \lambda
    \sum_{j=1}^d \frac{|\beta_j|}{|\hat{\beta}_j^{\text{H}}|},$


    where $\rho_H(r_i)$ was defined earlier in Eq. (5.3.5).


