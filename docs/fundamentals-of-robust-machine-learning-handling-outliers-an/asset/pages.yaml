  md: '# ## 6.4.2 Example: Diabetes Dataset


    We now consider using the closed-form expressions of Eqs. (6.4.4)-(6.4.6) on the
    diabetes³ dataset to obtain the optimal λ. It has n = 442 observations and d =
    10 explanatory variables. The reason for the selection of this dataset is that
    the estimates have large variances so that the benefits of penalty estimation
    are more pronounced. We proceed by using LS-ridge and progressively picking larger
    and larger values of λ to find a better set of estimates. For the moment, other
    details of the dataset are not pertinent to the discussion here, and we will use
    the full dataset in the regularization process to find out if we can do better
    than the standard LS estimates.


    The results are shown in Figure 6.2. If we use the MSE metric of Eq. (6.4.3) to
    find the optimal λ, we obtain the results shown in the upper portion of Figure
    6.2. Unfortunately, the MSE increases as λ increases. Therefore, λ = 0 is the
    optimal value if MSE is used as the metric. This makes sense since LS is designed
    to find the minimum MSE but does not offer a way to improve the model.


    Our goal is now clear: use the QR metric instead of MSE to find the optimal value
    λ that balances the bias and variance. We have plotted the results for the bias
    squared, variance, and QR in the lower portion of Figure 6.2. We see that the
    bias is initially zero when λ = 0 and the variance is large. This is the overfitted
    situation.


    Next, consider what happens as λ is increased. Initially the variance alone determines
    the value of the QR. As we increase λ, the variance drops while the bias increases
    exactly as we would expect.⁴ Eventually, the bias alone determines the QR. This
    is the underfitted situation. Between the two extremes, the QR reaches a minimum
    at λ_opt = 0.0025 for this dataset. It may appear that the QR has not been reduced
    by much but remember that the variances have all been reduced significantly which
    implies a more general model with less uncertainty.


    The LS estimates (λ = 0) and the resulting LS-ridge estimates (λ = 0.0025) are
    provided in Table 6.1 along with their corresponding variances. Notice that the
    estimates and variances are all smaller for LS-ridge compared to LS for the variables
    that started with large variances (s1, s2, s3, s4, and s5). However, the remaining
    variables (age, sex, bmi, bp, and s6) did not change much in both their estimates
    and their variances. That is because they already had good estimates for the general
    model.


    It is also instructive to visualize the regularization process graphically. In
    the upper panel of Figure 6.3, the ridge traces for the diabetes dataset are shown
    with a vertical line in the plot at the optimal value. Each intersection of the
    line with one of the traces is the corresponding estimate for that parameter.


    To complete the picture, we also plot the variances as a function of λ in the
    lower panel of Figure 6.3. Note the large drop in the variances for s1, s2, s3,
    s4, and s5. This is exactly what we would like to happen since they are exceedingly
    high. Further reduction beyond the optimal point acts to increase the bias so
    it is not effective to go beyond it. Meanwhile the variables age, sex, bmi, bp,
    and s6 all begin and end with essentially the same variances. Through this example,
    it is clear that using the ridge penalty is very effective at reducing the variances
    of certain offending parameters while leaving other parameters with low variances
    about the same.


    3 This dataset can be obtained from the sklearn Python library of datasets and
    accessed using diab = datasets.load_diabetes().


    4 Note that we are using β = β^LS in Eq. (6.4.5).'
