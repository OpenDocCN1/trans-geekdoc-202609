    # 5.8 Elastic Net (Enet) Penalty


    A penalty function that combines the ridge and LASSO penalties into a single composite
    penalty function referred to as the Elastic Net as follows:


    ```

    P(β) = λ₁ Σ |βⱼ| + λ₂ Σ βⱼ². (5.8.1)

    ```


    There are now two tuning hyperparameters, λ₁ and λ₂. If λ₁ = 0, we obtain the
    ridge penalty, whereas if λ₂ = 0, we obtain the LASSO penalty. The two hyperparameters,
    λ₁ and λ₂, are adjusted until the desired bias/variance trade-off is achieved
    (i.e. balancing overfitting and underfitting).'
