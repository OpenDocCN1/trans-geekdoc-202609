    and the true negative rate (TNR), sometimes called the *specificity*, is given
    by


    TNR = \frac{tn}{tn + fp}. (9.8.5)


    Then, the FPR is given by


    FPR = 1 - TNR = 1 - \frac{tn}{tn + fp} = \frac{fp}{tn + fp}. (9.8.6)


    In Figure 9.9, we show a few hypothetical plots of TPR against FPR to illustrate
    the concepts discussed above. The trajectory of the plot starts from (0,0) and
    traces a path to (1,1). At (0,0), the classifier predicts all 0''s, meaning no
    false positives, while at (1,1), the classifier predicts all 1''s, meaning no
    false negatives. All other cases fall in between these two extremes as the ROC
    traces a path from one corner to the other. Three such paths are shown. First,
    the diagonal line represents the case of a random value classifier. That is, a
    classifier that simply guesses the outcomes would produce a diagonal line which
    represents a worst-case classifier. Second, the curve labeled A is the plot for
    classifier A that is clearly better than the random guess classifier since its
    trajectory lies above the diagonal line. Third, the curve labeled B is the plot
    for classifier B that is better than A because its curve is above A.


    **Example:** Let \( p_T \) be the threshold for deciding whether a probability
    value from a classifier should be considered a 0 or a 1. Next, select different
    values of \( p_T \) starting at 0 and ending at 1 in steps of 0.01—a total of
    101 points. For each \( p_T \), the TPR and FPR are plotted to produce the ROC
    curve. The quality of a classifier can be established by finding the area under
    the ROC curve (AUROC). Three classifiers are compared in Figure 9.9. Specifically,
    the AUROC of a random guess classifier is 0.5. However, the total AUROC of classifier
    A is 0.75 whereas the total area under the ROC of classifier B is 0.8. Therefore,
    B is considered to be better than A. The AUROC can be loosely interpreted as the
    probability that the classifier has assigned the correct class to the data points.
    The ideal value under this interpretation is of course AUROC = 1.0.'
