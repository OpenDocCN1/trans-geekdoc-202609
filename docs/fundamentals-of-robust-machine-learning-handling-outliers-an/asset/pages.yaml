    and the standard errors may be inflated. Therefore, the ordering may be incorrect.
    The most reliable option is a robust loss function with aLASSO to produce the
    correct ordering.


    # 5.12 Summary


    In this chapter, we have presented properties and practical aspects of penalized
    robust estimators and its application to machine learning. Several new ideas and
    concepts have been introduced to enable robust linear regression and model building
    that deserve further investigation. These topics will be covered in the next chapter.
    We have demonstrated the importance of penalty estimators in reducing variance
    and identifying variable importance. The ridge penalty is a smooth shrinkage mechanism,
    whereas aLASSO has the oracle property and is best-suited for variable ordering.
    One can view the LASSO as being somewhere in between. The LASSO penalty typically
    sets some parameters to zero, but not necessarily in the proper order since it
    does not have the oracle property. There are some numerical challenges in the
    implementation of LASSO and aLASSO due to the _L_<sub>1</sub> nature of their
    respective penalty functions, especially for large \(\lambda\).


    The motivation for the use of robust penalty estimators in machine learning is
    due to the presence of outliers in datasets. The LS method is not outlier-tolerant
    so penalty estimation with an LS loss is equally problematic. This is why robust
    methods should supersede the least squares approach where appropriate. In the
    next chapter, methods of regularization with penalty estimators and _k_-fold cross-validation
    techniques will be described which will complete the picture on the value of these
    methods.'
