    here is to establish a line that best separates the “•” points from the “x” points.
    Finding the dividing line between the two classes is referred to as *linear classification*.
    The data is linearly separable in this case and the separating line does a good
    job of defining a *decision boundary* between the two sets of points. We say that
    the model was trained using the given data, which actually means that we optimized
