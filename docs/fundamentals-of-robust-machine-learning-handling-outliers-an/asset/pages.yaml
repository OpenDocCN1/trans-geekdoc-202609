  md: 'Regularization can be applied to cross-entropy logistic regression using ridge
    as follows:


    ```

    \( J^{\text{CELR-ridge}}(\boldsymbol{\beta}) = - \sum_{i=1}^n [y_i \log(p_i) +
    (1 - y_i) \log(1 - p_i)] + \frac{\lambda}{2} \sum_{j=1}^d \beta_j^2, \) (8.7.1)

    ```


    where \(\lambda > 0\) is the regularization hyperparameter. The hyperparameter
    \(\lambda\) can be moved to the first term by defining a hyperparameter \(C\),
    where \(C = 1/\lambda\) to conform to notation used in logistic regression packages
    in Python. Therefore,


    ```

    \( J^{\text{CELR-ridge}}(\boldsymbol{\beta}) = - C \sum_{i=1}^n [y_i \log(p_i)
    + (1 - y_i) \log(1 - p_i)] + \frac{1}{2} \sum_{j=1}^d \beta_j^2. \) (8.7.2)

    ```


    Often, the equation is written in the form


    ```

    \( J^{\text{CELR-ridge}}(\boldsymbol{\beta}) = \frac{1}{2} \sum_{j=1}^d \beta_j^2
    - C \sum_{i=1}^n [y_i \log(p_i) + (1 - y_i) \log(1 - p_i)]. \) (8.7.3)

    ```


    For LCLR, the use of ridge may act to offset its robustness and produce misleading
    results. However, \(k\)-fold cross-validation is important for generalizing both
    CELR and LCLR independent of the use of ridge.


