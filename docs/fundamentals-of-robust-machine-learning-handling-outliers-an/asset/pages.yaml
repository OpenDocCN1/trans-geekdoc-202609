    is appropriate.


    There is still a problem with this overall approach. If we tune the model to one
    test set, we run the risk of not being able to handle other test sets. We need
    more training sets and test sets to produce a general model. There is a simple
    way to resolve this issue. Any number of training and test sets can be generated
    using randomized splits of the original dataset. This is referred to as the _k-random
    validations_ approach. It produces a more general model because of the randomized
    nature of the validation scheme. When _k_ training sets are used to build _k_
    models and validated on _k_ test sets, the average of those models is considered
    to be generalized. Typically, _k_ in the range of 5–10 is sufficient to generalize
    the model.


    # ## 6.5.2 _k_-Fold Cross-validation


    In standard machine learning applications, a more coherent scheme is used called
    _k_-fold cross-validation (see James et al. 2023). The previous approach may have
    overlapping training and test sets. However, once we build the final model with
    the whole dataset, there is no longer a test set to validate the overall results.
    If our goal is to produce a generalized model, then we should use the dataset
    in a way that reflects this goal by creating several “independent” datasets. But
    how do we do this?


    Given a dataset, we first divide it into a training set and a test set (which
    we now view as an unseen test set called the “holdout” set). The test set can
    be used to assess our final model prediction accuracy. We do not want to inadvertently
    tune \(\lambda\) to a specific test set or even a randomized (and potentially
    overlapping) subsets as described above since the prediction accuracy may not
    completely generalize to arbitrary test sets.


    Instead, it is common practice to further subdivide the training set into _k_
    disjoint sets, called cross-validation (CV) sets or “folds.” The decomposition
    of the dataset into a 5-fold cross-validation scheme is illustrated in Figure
    6.5. The partitioning on the right represents one of the five folds. The four
    unshaded areas collectively form the CV training set for one fold while the one
    shaded area is the CV test set for that fold. Similarly, each of the other segments
    represents a different fold. At the end of the'
