    Figure 3.6 Plots of \(\rho(x)\) and \(\psi(x)\) for different values of \(a\)
    along with the \(L_1\) loss term.


    Hence, the PDF is


    \(f_X(x) = \frac{1}{\kappa_a} \frac{1}{((\cosh(ax))^{\frac{1}{a}}}.\quad (3.8.12)\)


    Here, \(\kappa_a\) is different for each selected value of \(a\). We can choose
