    have outliers either. However, the OAR-plot indicates there may be three outliers.
    But the QQ-plot tells us that they are just three extreme values (one at the top
    and two at the bottom) that should not be considered as outliers.


    For the Boston Housing dataset, the residuals of the LC estimator are presented
    as a quad-plot in Figure 4.18. These plots give a clear picture regarding the
