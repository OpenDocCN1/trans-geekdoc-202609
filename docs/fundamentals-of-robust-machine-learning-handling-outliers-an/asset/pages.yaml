  md: 'Note: The softmax function is perhaps the most important activation function
    in deep learning. It is important to understand this topic in detail because you
    will encounter it frequently in many applications including generative AI tools
    such as ChatGPT.


    # 10.2.2 Softmax Activation Function


    One of the key aspects of multi-class problems involves the use of the softmax
    function. This is essentially a multi-dimensional version of the sigmoid function.
    Recall that the sigmoid function generates a probability value for a single output
    in binary classification. In the multi-class problem, there are k outputs which
    is equal to the number of classes. It is possible to use the sigmoid activation
    at each of the k outputs but one inconsistency would arise. Since the outputs
    of the neural network are interpretable as probabilities, the total sum of these
    probabilities at the outputs should be equal to 1. The sigmoid activation cannot
    guarantee this probability axiom whereas the softmax function is designed such
    that it is always true. That is why, with multiple classes and multiple outputs,
    the softmax activation function is required.


    Assume we have k outputs that are one-hot encoded for training purposes. After
    forward propagation, we will have k raw outputs, z1, z2, ..., zk. In the softmax
    operation, given by S(zi), the raw outputs of the neural network are used in the
    following way to compute the probability for the ith output:


    \(\mathbb{S}(z_i) = \frac{e^{z_i}}{e^{z_1} + e^{z_2} + \dots + e^{z_k}} = p_i.\)
    (10.2.6)


    Effectively, the probabilities of all k outputs are scaled such that they will
    always add up to 1. The scaling could have been done using the raw outputs, z1,
    z2, ..., zk, but there is a good reason why the form of normalization in Eq. (10.2.6)
    is used—it is shift invariant. That is, a constant can be added to all raw outputs
    and their probabilities will not change.


    The gradients of softmax have simple expressions that include the effects of all
    k outputs rather than just a single output. We will show (through an example)
    that


    \(\frac{\partial \mathbb{S}(z_i)}{\partial z_i} = \frac{\partial p_i}{\partial
    z_i} = p_i(1 - p_i) \text{ (regular term)}\)

    and

    \(\frac{\partial \mathbb{S}(z_i)}{\partial z_j} = \frac{\partial p_i}{\partial
    z_j} = -p_j p_i \text{ (cross terms)},\)


    for all j = 1, ..., k, j ≠ i. Instead of one term for the derivative, there will
    now be k terms: one regular term and k − 1 cross-terms.


    To understand how the softmax activation function works, consider Figure 10.2.
    It is the four-layer neural network of Figure 9.3 with the fourth layer replaced
    by the softmax function since there are three outputs in the store selection problem.
    A slight modification has been made to show the dependencies between the fourth
    layer outputs, i.e. the raw zi values, and the softmax function. For example,
    when z1 is generated as a sum-of-products quantity, it contributes to all three
    softmax outputs, p1, p2, and p3. In the figure, the three lines emanating from
    z1 are used to indicate this dependence. Likewise, z2 affects p1, p2, and p3 so
    three more lines are used for the same purpose. The same holds for z3. These arrows
    do not represent weights as they do in the rest of the network; they only indicate
    the dependencies between the raw outputs and the softmax probabilities.'
