  md: 'By doing so, the product in Eq. (2.5.8) has now been converted to a sum in
    Eq. (2.5.9). Next, we use a numerical optimizer to produce \(\hat{\theta}\). However,
    most optimizers are designed to find the minimum (rather than the maximum) so
    we need one more adjustment to the equation: we negate the quantity. Thus, the
    negative log-likelihood expression is given by


    \(-\ell(x_1, x_2, ..., x_n; \theta) = - \sum_{i=1}^n \log(f_\theta(x_i)).\) (2.5.10)


    The estimator \(\hat{\theta}\) is the solution to the equation


    \(\frac{\partial \ell(x_1, x_2, ..., x_n; \theta)}{\partial \theta} = 0.\) (2.5.11)


    In some simple one-dimensional cases, a closed-form solution can be found. But
    this is not generally true. However, the equation can be solved in a straightforward
    manner using an optimization technique, as described in the next section, the
    steps for which can be expressed compactly as


    \(\hat{\theta} = \underset{\theta \in \mathbb{R}}{\operatorname{argmin}} \left[
    - \sum_{i=1}^n \log f_\theta(x_i) \right].\) (2.5.12)


    **Example:** Suppose we believe that the distribution associated with a random
    variable \(X\) has the form \(f_\theta(x) = \theta e^{-\theta x}\) and we would
    like to estimate \(\theta\) using the maximum-likelihood procedure. An i.i.d sample
    of \(X\) produces the following five observations: 0.1, 0.2, 0.5, 1, and 3. The
    likelihood function is


    \(L(x_1, x_2, ..., x_5; \theta) = \prod_{i=1}^5 \theta e^{-\theta x_i} = \theta^5
    e^{-\theta(0.1+0.2+0.5+1+3)} = \theta^5 e^{-4.8\theta}.\)


    If the likelihood function is plotted to find \(\theta\), it produces the left
    panel of Figure 2.3 which has a maximum at the quantity we seek.


    The MLE procedure uses the negative log-likelihood which produces


    \(-\ell(x_1, x_2, ..., x_5; \theta) = -5 \log \theta + 4.8\theta,\)


    as shown on the right in Figure 2.3 and then takes the derivative and sets it
    to zero. Doing so, we find that it has a minimum at \(\hat{\theta} = 25/4\). The
    true value is \(\theta = 1\). The estimate using the MLE procedure is close to
    the actual value with only five observations. A larger number of observations
    would move the estimate increasingly closer to the true value since MLE produces
    a consistent estimator.


    **Exercise:** Using MLE, derive the \(L_2\) loss function assuming that residuals
    \((r_1, r_2, ..., r_n)\) are i.i.d values drawn from random variable \(R \sim
    f(r) = e^{-r^2/2} / \sqrt{2\pi}\), where \(r_i = y_i - \mathbf{x}_i^\top \boldsymbol{\beta}\).


    **Ans.:** The likelihood function is


    \(L(r_1, r_2, ..., r_n; \boldsymbol{\beta}) = \prod_{i=1}^n \frac{1}{\sqrt{2\pi}}
    e^{-r_i^2/2}.\) (2.5.13)


    The negative log-likelihood expression is


    \(-\ell(r_1, r_2, ..., r_n; \boldsymbol{\beta}) = \frac{n}{2} \log(2\pi) + \frac{1}{2}
    \sum_{i=1}^n r_i^2.\) (2.5.14)'
