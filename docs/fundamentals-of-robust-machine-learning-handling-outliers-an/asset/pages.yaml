    In each case, an integration of Eq. (3.8.11) is needed for \(\kappa_a\) but to
    simplify the process, we can use a fitted equation given by \(\kappa_a = (\pi
    - 2)/a + 2\). This is shown in Figure 3.7. Some of the computed values are indicated
