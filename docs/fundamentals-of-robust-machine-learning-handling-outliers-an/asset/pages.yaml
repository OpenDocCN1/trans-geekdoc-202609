  md: '# 8.3.3 Gradient Descent


    The numerical optimization technique used to find \(\hat{\boldsymbol{\beta}}\)
    is usually some form of gradient descent. The objective function to be minimized
    in logistic regression with cross-entropy, written as \(J^{\text{CE}}(\boldsymbol{\beta})\)
    to emphasize its dependence on \(p_i\), is given by


    ```

    \(J^{\text{CE}}(\boldsymbol{\beta}) = -\sum_{i=1}^n [y_i \log p_i + (1 - y_i)
    \log(1 - p_i)].\) (8.3.18)

    ```


    We will describe only the simplest form of gradient descent for our purposes here.
    Basically, we compute the loss function for an initial guess, \(\boldsymbol{\beta}^{(0)}\),
    and then take a step in the opposite direction of the gradient to reduce the value
    of \(J^{\text{CE}}(\boldsymbol{\beta})\). The process is repeated until the minimum
    of \(J^{\text{CE}}(\boldsymbol{\beta})\) is found. This iterative method requires
    partial derivatives of \(J^{\text{CE}}(\boldsymbol{\beta})\) in Eq. (8.3.18) with
    respect to each of the parameters in the vector \(\boldsymbol{\beta}\).


    We begin with the case involving only one observation, \(\mathbf{x}\), and one
    known binary response, \(y\), and a predicted value, \(p\). Starting with the
    loss function, \(J^{\text{CE}}(\boldsymbol{\beta})\), we can apply the chain rule
    to obtain the needed gradients. For some parameter, \(\beta_j\), we have that


    ```

    \(\frac{\partial J^{\text{CE}}(\boldsymbol{\beta})}{\partial \beta_j} = \frac{\partial
    J^{\text{CE}}(p)}{\partial p} \frac{\partial p}{\partial \beta_j}.\) (8.3.19)

    ```


    Then, the partial derivative in the first term of Eq. (8.3.19) is


    ```

    \(\frac{\partial J^{\text{CE}}(p)}{\partial p} = -\frac{y}{p} + \frac{1 - y}{1
