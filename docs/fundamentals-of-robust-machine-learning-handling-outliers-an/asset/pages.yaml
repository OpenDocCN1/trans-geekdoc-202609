  md: '**Figure 9.3** Four-layer neural network with relu activation (denoted as "r")
    for hidden layers and sigmoid activation (denoted as "s") for the output layer
    (bias terms are not shown). This is a fully connected architecture.


    ![](img/f26d7f591c2a080d86425985301266a4_276_0.png)


    the number of units in each layer may vary considerably, and the number of layers
    used depends on the characteristics of the application and the associated dataset.


    The question that arises is, what is the benefit of doing this? First, the number
    of parameters has increased dramatically. This allows the NN to learn more about
    inherent relationships in the data and to look for potential solutions in very
    high dimensions. Second, every output of the computational units is a nonlinear
    function of their respective inputs. The nonlinearity in the different layers
    is the mechanism by which the neural network is able to produce complex solutions.
    Without the nonlinearity, it would be one big linear function with no real advantage
    over a logistic regression approach. In other words, the key to the neural network
    is parameter-space expansion and nonlinearity in all computational units.


    We call this a _fully connected_ neural network because every output of a prior
    layer connects to every input of a subsequent layer. In some sense, it seems like
    a waste of resources. But when the initial values are set (usually to very small
    random non-zero values), each one produces a different result. Therefore, we prefer
    to keep the fully connected structure and let the neural network figure out which
    ones to use. We could remove some of them if we wanted to but it is not clear
    which ones to keep and which ones to kill. _Dropout_ is a heuristic approach that
    randomly keeps and kills neurons in each cycle for regularization purposes.


    Each arrow in the diagram of Figure 9.3 represents a different parameter. We can
    easily count the number of parameters associated with the four-layer neural network.
    There are 3 layers with 20 parameters per layer (16 arrows plus 4 more for the
    bias terms, which are not shown), and the output layer has 4 + 1 parameters, for
    a total of 65 parameters. We have greatly increased the parameter space from 5
    to 65 using this neural network architecture. Unfortunately, this architecture
    with 65 parameters could lead to overfitting. As we increase the depth of the
    neural network and the number of hidden units in each layer, the number of parameters
    in the network (and the likelihood of overfitting) increases considerably. Therefore,
    regularization using dropout is needed to counteract this effect.


    # 9.3.3 Activation Functions


    The nonlinearity of the neural network is provided by the activation functions
    at the output of each unit. However, the sigmoid function is not the only option.
    In fact, there are a host of other choices for this function: relu(z), leaky-relu(z),
    tanh(z), elu(z), linear(z), softmax(z), maxout(z), and so on. We will focus on
    the most widely used activation functions in this chapter, namely, the sigmoid
    and relu functions.'
