  md: '# 8.6 Example: Motor Trend Cars


    We begin with a simple illustration of a binary classification problem with a
    single outlier. The dataset to be used is called mtcars. It contains information
    about whether or not a car has automatic or manual transmission (am) based on
    its horsepower (hp) and weight (wt). Hence, the binary response is am, while the
    explanatory variables are hp and wt. The dataset was shown earlier as a scatter
    plot in Figure 8.3 along with an ideal decision boundary line. Now, imagine a
    hypothetical setting as an employee in a car company. Your manager gives you the
    mtcars dataset and asks you to determine whether a soon-to-be-designed car with
    hp = 125 and wt = 3.0 Mg (where 1 Mg = 1000 kg) should use an automatic or manual
    transmission. How can you decide which type of transmission the car should use?
    Based on the fact that the response variable is binary, logistic regression is
    a suitable choice.


    If we apply the cross-entropy method using CELR, we obtain the separation boundary
    shown in Figure 8.8(a). This is a somewhat surprising result at first glance because
    it is visually clear where the separating line should go and CELR does not produce
    it because of the influence of one outlier. Unfortunately, this is the main issue
    with CELR—the decision boundary is altered by the presence of outliers. As a result,
    the linear boundary actually incurs four misclassifications in this example. There
    are also two points straddling the line that are close enough to be called a 1
    or 0. Therefore, even in this ideal setting where a clear delineation exists between
    0 and 1 responses, CELR may make a few mistakes if outliers are present. To answer
    the manager’s question about the newly designed car with 125 hp and a weight of
    3.0 Mg (shown using a the symbol $\Delta$ in the figure), the decision would be
    to make it a manual transmission based on CELR.


    Now consider the results with LCLR shown in Figure 8.8(b). This is exactly what
    one would expect without any outliers present, and visually this seems like the
    correct result as discussed previously. The use of log-cosh effectively ignores
    the outlier in this case. It also behaves like a large margin classifier, similar
    to SVCs (to be described in a later section). As an answer to the manager’s question,
    LCLR recommends an automatic transmission (indicated by the $\Delta$ located on
    the other side of the boundary). This is the correct decision. Clearly, the robust
    solution ignored the outlier and produced a higher-quality result (which could
    save your job in the end!)


    One important point to note is that we can obtain probability information using
    logistic regression. The probability can be used to decide whether the point is
    a 0 or a 1, or can be used unaltered to provide more information for a business
    decision. The reason for its importance is 2-fold. First, in a high-dimensional
    setting, we cannot plot the decision boundary associated with p = 0.5 and examine
    it visually. The probability is more informative than simply stating the class.
    Second, the threshold for determining whether a point belongs to Class 0 or Class
    1 is nominally set to 0.5, but if the more appropriate setting for a particular
    application, say in the case of deciding on whether to give out a loan, may be
    much higher, such as 0.7. In many data science problems, we may be interested
    in the probability value rather than the class and logistic regression provides
    this information.


    A contour map is shown in Figure 8.9 based on the probabilities computed using
    the logistic function. The decision boundary line is the case where p = 0.5. Other
    probability contours are parallel to this line and reach p = 1.0 on the left-hand
    side and p = 0.0 on the right-hand side. It is only out of convenience that we
    plot only the p = 0.5 line and call it the decision boundary. As a practical matter,
    it can be set to any desired value between 0 and 1.'
