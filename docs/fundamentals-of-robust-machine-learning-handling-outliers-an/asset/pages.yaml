    # ## 3.9 Summary


    The log-cosh loss function is perhaps one of the most important loss functions
    in machine learning because it offers robustness along with all of the attendant
    regularity conditions that allow for a thorough mathematical treatment. In this
    chapter, the distribution from which the loss function arises has been identified,
    followed by a maximum-likelihood derivation of the loss function. Its statistical
    properties were provided along with the computation of standard errors. The s.e.’s
    for log-cosh were compared to the least squares case and found to be smaller than
    least squares for datasets with outliers, and similar for datasets with no outliers.
    As a result of the detailed analysis, a strong case can be made for using the
    general log-cosh loss to replace many other loss functions in machine learning.


