- pgno: 304
  md: 'conveniently provided by the one-hot encoding. A categorical version of the
    cross-entropy (CE) loss for use with multi-class problems will be described first.
    The categorical CE loss function is


    categorical CE loss = - \sum_{i=1}^{n} \sum_{k=1}^{c} y_{ik} log p_{ik} .


    where c is the number of classes and n is the number of rows in the dataset. Similar
    to binary classification terminology, y_{ik} is the ground truth and p_{ik} is
    the predicted probability. Keep in mind that all but one of the y_{ik}’s are 0
    due to one-hot encoding so only one term will contribute to the loss in each row
    of the dataset.


    Recall from Chapter 9 that, in stochastic gradient descent, only one row of the
    dataset is processed at a time. Let us focus on this case to simplify the understanding
    of the modified loss function. The categorical CE loss for a single row is


    categorical CE loss = - \sum_{k=1}^{c} y_{k} log p_{k} .


    For the first row of the dataset in Figure 10.1, we would obtain


    - \sum_{k=1}^{c} y_{k} log p_{k} = -(y_{1} log p_{1} + y_{2} log p_{2} + y_{3}
    log p_{3}) .


    Since Store A was selected, we have that y_{1} = 1, y_{2} = 0, and y_{3} = 0.
    Therefore,


    - \sum_{k=1}^{c} y_{k} log p_{k} = - log p_{1} .


    Using the categorical loss and one-hot encoding, we obtain a very simple loss
    term. Each row of the training set will contribute one such term. The total loss
    is then the sum of the loss terms for all rows, as prescribed by Eq. (10.2.1).


    **Exercise:** Determine the expression for the categorical CE loss for the first
    four rows of the dataset in Figure 10.1 using Eq. (10.2.1).


    **Ans.:** For the first row, the loss is – log p_{11}. For the second row, the
    loss is – log p_{22}. For the third row, the loss is – log p_{33}. For the fourth
    row, the loss is – log p_{43}.


    The categorical loss function for log-cosh (LC) is given by


    categorical LC loss = \sum_{i=1}^{n} \sum_{k=1}^{c} y_{ik}logcosh ( y_{ik} - p_{ik}
    ).


    **Exercise:** Determine the categorical LC loss terms separately for rows 1, 2,
    3, and 4 of the dataset in Figure 10.1 using Eq. (10.2.5).


    **Ans.:** For the first row, the loss is logcosh (y_{11} – p_{11}). For the second
    row, the loss is logcosh (y_{22} – p_{22}). For the third row, the loss is logcosh
    (y_{33} – p_{33}). For the fourth row, the loss is logcosh (y_{43} – p_{43}).'
