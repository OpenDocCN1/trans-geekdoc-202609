- pgno: 186
  md: 'where \(\boldsymbol{X} \in \mathbb{R}^{n \times d}\) and \(\boldsymbol{y} \in
    \mathbb{R}^n\). This is the best linear unbiased estimator as discussed in Chapter
    2. However, we want to add flexibility to see if a better model can be found.
    One way to do this is to apply a penalty function, namely, ridge (see Saleh et
    al. 2019). The LS-ridge estimator from Chapter 5 had the following closed-form
    expression:


    \(\hat{\boldsymbol{\beta}}^{\text{LS-ridge}}(\lambda) = (\mathbf{X}^T \mathbf{X}
    + \lambda \mathbf{I}_d)^{-1} \mathbf{X}^T \boldsymbol{y},\)


    where \(\mathbf{I}_d\) is a \(d \times d\) identity matrix and \(\lambda\) is
    the ridge hyperparameter. We can build a number of different models just by changing
    \(\lambda\) and then choose the model associated with the optimal \(\lambda\).
    This is how we intend to regularize the model.


    To understand the regularization procedure, we start by reviewing the aforementioned
    bias-variance trade-off at a more basic level. We know the meaning of variance—it
    is the degree of uncertainty around an estimate. In a multidimensional setting,
    there will be one variance for each parameter. We need to construct a covariance
    matrix (see Chapter 3, Section 3.6) and then add up the terms along the diagonal
    to obtain the sum of the variances. This is called the *trace of the covariance
    matrix*. Notationally, the trace of a matrix \(\mathbf{C}\) is represented as
    \(\text{tr}(\mathbf{C})\).


    For the bias, a working definition in a multidimensional case is the \(L_2\) distance
    between the expected value of a given estimator and the true value, \(\| \mathbb{E}(\hat{\boldsymbol{\beta}})
    - \boldsymbol{\beta} \|_2\). An estimator is said to be unbiased if \(\mathbb{E}(\hat{\boldsymbol{\beta}})
    = \boldsymbol{\beta}\). Although one would think it is desirable to have an unbiased
    estimator, there are no guarantees that the variances will be low for unbiased
    estimators. In fact, we are more interested in models with a smaller variance
    at the cost of a slightly higher bias by choosing the appropriate \(\lambda\).


    **Exercise:** Let \(\mathbb{E}[\hat{\boldsymbol{\beta}}] = (-3.2, 0.1, 1.1)^\top\)
    and \(\boldsymbol{\beta} = (-3, 0, 1)^\top\). Compute the bias. Then, given \(\sigma^2
    = 0.25\) for the covariance matrix,


    \[\sigma^2 (\mathbf{X}^T \mathbf{X})^{-1} = \sigma^2 \begin{pmatrix} 3 & 1 & 1
    \\ 1 & 2 & 1 \\ 1 & 1 & 2 \end{pmatrix},\)


    compute the trace of the covariance matrix. Finally, compute the quadratic risk.
    What can you say about the relative sizes of the bias and variance terms?


    **Ans.:** First, \(\|\text{bias}(\hat{\boldsymbol{\beta}})\|_2^2 = \| \mathbb{E}[\hat{\boldsymbol{\beta}}]
    - \boldsymbol{\beta} \|_2^2 = (-0.2)^2 + 0.1^2 + 0.1^2 = 0.06\). Next, the variance
    is \(\text{Var}(\hat{\boldsymbol{\beta}}) = \text{tr}(\sigma^2 (\mathbf{X}^T \mathbf{X})^{-1})
    = 3(0.25) + 2(0.25) + 2(0.25) = 1.75\). Therefore, \(\text{QR} = 0.06 + 1.75 =
    1.81\). Note that the variance is high and the bias is low in this case. \(\square\)


    # **6.4.1 Selection of Hyperparameter** \(\lambda\)


    To select the optimal value of \(\lambda\), there are two possible options. One
    option is to use the mean-squared error (MSE) as follows:


    \(\text{MSE} = \frac{1}{n} \sum_{i=1}^n (y_i - \hat{y}_i)^2,\)'
