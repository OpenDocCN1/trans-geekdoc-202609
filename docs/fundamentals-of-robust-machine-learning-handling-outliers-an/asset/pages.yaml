  md: '# # 1


    # Introduction


    The field of machine learning (ML) has been advancing very rapidly since 2010
    when it gained momentum in both academia and industry. In the intervening years,
    many innovative ideas have been implemented and applied to some very challenging
    data science problems with great success. Underpinning the work in these areas
    are the mathematical foundations within the field of probability and statistics.
    The relationships between the three areas of data science, machine learning, and
    probability and statistics are conceptualized in Figure 1.1. The interdependence
    of the three disciplines is perhaps the most important point to note here. Data
    science relies heavily on probability and statistics and the machine learning
    tools that build the models for a particular application domain. Applications
    drive the investigation of the type of mathematics and machine learning capabilities
    that need to be developed. Likewise, machine learning relies on the foundations
    that lie in probability and statistics and also on the requirements of the applications
    that will eventually be used to develop the necessary tools. There is a symbiotic
    relationship between these three disciplines. This book places a strong emphasis
    on all three areas in equal measure to introduce the ideas and concepts to be
    described. As such, some familiarity with one of these three areas will be helpful
    in navigating through the material to be presented.


    This book is about robust machine learning. It addresses an under-reported and
    often overlooked aspect of data science which is the effect of outliers on the
    model building process. A prediction is only as good as the model on which it
    is based, and if the model is faulty, so is the prediction. In particular, outliers
    and anomalies in datasets can lead to inaccurate models, resulting in bad business
    decisions, questionable explanations of cause-and-effect, incorrect conclusions,
    or inaccurate medical diagnoses, just to name a few. Even one outlier can render
    a model unusable if it happens to be in the wrong place. Robust methods are better-suited
    to data science, especially when outliers are present. ML practitioners have not
    yet fully embraced a class of robust techniques that would provide more reliable
    models and more accurate predictions than is possible with present-day methods.
    The overall goal of this book is to provide the rationale and techniques for robust
    ML and then build on that material toward robust data science.


    The topics to be covered in this book span a wide variety of subjects and there
    is substantial ground to cover to gain deep knowledge in this field. This opening
    chapter covers introductory material and a number of basic concepts in machine
    learning. Initially, descriptions of robust machine learning and robust data science
    are provided as a backdrop for the material to be presented in the rest of the
    book. Then, we focus on robustifying one ML algorithm. There are several options
    to choose from in this initial chapter to demonstrate the value of using robust
    methods. Among the options, the one selected is simple'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/f26d7f591c2a080d86425985301266a4_23_0.png)


    Figure 1.1 Synergistic relationships between data science, machine learning, and
    probability and statistics.


    and yet provides a clear picture of the power of robust methods in general. Since
    clustering is one of the well-known applications of machine learning, it will
    be used as the first vehicle to understand the way that robust methods can be
    applied to handle outliers in datasets. It will also serve as a template for the
    rest of the book.


    # 1.1 Defining Outliers


    **Outliers** are typically a small subset of data that deviates from the majority
    of the data within the same dataset. Sometimes the true data is differentiated
    from outliers by calling them **inliers**. The sources of outliers can vary significantly.
    Outliers can occur naturally as part of the characteristics of the data being
    collected. Outliers can also be due to significant noise in the environment that
    might be unavoidable. More commonly, they are associated with measurement error,
    or instrumentation error. Another source is due to human error such as typographical
    errors or perhaps misinterpreting the units of measure of a device. If there are
    large variances in the features of a dataset and a small amount of data, this
    could lead to some of the data being declared as outliers. And other times, it
    is just inherently part of the data collection process. Unusual or extreme outliers
    are often referred to as **anomalies**.


    There are basically two options of handling outliers. The first is to build machine
    learning tools that are tolerant to outliers. These are the robust machine learning
    tools. This involves understanding how the current ML tools work and then seeking
    an alternative approach that is more effective in the presence of outliers. Conceptually,
    the current approaches in ML seek the mean of the data to build a model. Robust
    methods seek the median instead which makes the models much more stable and reliable.
    This is one of the main thrusts of the book. The problems surrounding the use
    of the mean will be presented, followed by the advantages of using the median.
    More generally, the first approach is to convert a non-robust machine learning
    method into a robust one. Many of the existing techniques are not robust and those
    should be identified and updated accordingly. However, if a method is inherently
    robust, it should be preferred over its non-robust counterpart.


    A second option is to detect and remove outliers and then apply the current ML
    tools or extract outliers from a dataset for further inspection. In current practice,
    there is a large investment in non-robust methodologies that are hard to change
    or replace, so it is easier to find ways to eliminate outliers and use the existing
    infrastructure. Since robust methods are not widely used in Python (or well-understood),
    it seems easier to remove outliers rather than build a new infrastructure based
    on robust methods.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'However, as appealing as it may sound, it is not straightforward and requires
    an extra level of care to ensure that inliers are not inadvertently removed with
    outliers. There are other cases where the goal of the project is to find the outliers
    or anomalies in the dataset rather than to build a model. The detected outliers
    would be inspected to learn something about the anomalies or any unusual aspects
    of the data being collected. And finally, there are statistical tools and procedures
    that rely on the data being outlier-free in order to produce meaningful results
    (e.g. correlation coefficients and analysis of variance). Hence, the secondary
    thrust of the book is to describe efficient and effective methods to detect and
    remove both outliers and anomalies.


    # ## 1.2 Overview of the Book


    With the background and preliminaries covered, we will now move to the main thrust
    of this book which is the study of standard machine learning techniques and their
    robust counterparts. Table 1.1 provides a roadmap of the topics to be described
    and their associated chapters.


    # ## 1.3 What Is Robust Machine Learning?


    Machine learning involves the development of software that analyzes data and produces
    predictive models based on algorithms and mathematics developed by computer scientists,
    engineers, and statisticians. One can view it as the programming portion of the
    problem to build software tools and flows to process data in furtherance of some
    specific data science objective. Most of the existing techniques are essentially
    based on finding the **mean** of the data. Robust methods to be described in this
    book are based on finding the **median** of the data. Thus far, robust methods
    have not seen widespread use due to their somewhat mysterious nature. These techniques
    borrow heavily from *robust statistics* (see Maronna et al. 2019) which is a well-known
    and long-standing field in its own right. However, robust methods have only been
    of recent interest in machine learning. The objective of this chapter, and indeed
    the whole book, is to demystify robust methods so that more data scientists can
    gain access to such methods when the need arises.


    Truth be told, most realistic datasets have outliers in one form or another. Some
    are harmless relative to the rest of the data while others may cause significant
    errors, especially during inference or prediction. The problem is that it is difficult
    to know a *a priori* which case you are dealing with. You may not be able to tell
    if the results are reliable unless additional steps are taken to ensure reliability.
    If, for example, the outliers could be removed in some effective manner, then
    the traditional methods are quite effective. However, outlier detection and removal
    are prone to error so this may not be a reliable approach either. It is often
    considered to be tampering with the data. Unless you can successfully diagnose
    and detect outliers in large datasets, the models generated by standard ML methods
    on these modified datasets should be viewed as suspect. The more prudent approach
    is to employ machine learning tools that use robust procedures wherever possible
    to avoid the problems altogether.


    Generally speaking, robust ML is the development of tools, procedures, and methodologies
    that are tolerant to outliers. In its most simplistic form, it implies the use
    of the median (or some neighboring quantile) rather than the mean thereby producing
    outlier-tolerant models. It also includes the detection and removal of outliers
    using robust ML. Of course, robust methods introduce a set of different issues
    that must be addressed before they can be used effectively. As we will show throughout
    this book,'
