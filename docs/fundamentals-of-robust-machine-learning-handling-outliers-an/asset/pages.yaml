    # 12.5 Time Series Example: Climate Change


    Thus far in this book, we have examined ways to build outlier-tolerant machine
    learning tools and identified methods for outlier detection and removal. Once
    the concepts described herein have been fully digested and mastered, the reader
    is encouraged to seek new opportunities to apply these methods. The basic ideas
    can be extended to many other application areas. To close out the book, we consider
    one such application to demonstrate how future work in data science can be conducted
    using the knowledge gained from this book.


    Consider the problem of climate change. This is currently a topic of great concern
    around the world due to the potentially disruptive effects of high CO₂ levels
    heating the Earth’s atmosphere. In 1968, the measured level of CO₂ was roughly
    322 parts per million (ppm) whereas by 2025, it reached 425 ppm. That is an increase
    of about 30% in less than 6 decades. Atmospheric CO₂ creates a “greenhouse” effect
    which leads to the heating of the land and oceans around the Earth. As a consequence,
    the ice fields around the North and South poles are melting which increases sea
    levels and releases methane (another greenhouse gas) trapped in the ice. Climate
    disruption is the net result and it may have severe consequences if not dealt
    with in the near future.


    As a measurable indicator of heating effects over time, the average land temperature
    from 1750 to 2015 is shown in Figure 12.21. From 1750 to 1900, there are wild
    fluctuations in temperature but the average is roughly 8°C. Beyond 1900, the start
    of the Industrial Revolution, there is a noticeable upward trend in the temperature.
    This is the effect of climate change. Going forward, we want to be able to predict
    the temperature increase using machine learning by treating this data as a time
    series. Thus, we need to consider using the techniques available in time series
    analysis.


    A univariate time series is constructed by measuring some quantity of interest
    in uniform increments of time, e.g. each day, month, or year. Since the measurements
    are evenly spaced, the time series can be represented as a sequence of numbers
    occurring at different integer values of time. Based on this'
