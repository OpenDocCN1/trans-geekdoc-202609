    information, we can establish the boundary point. It occurs where \(\boldsymbol{x}^\top
    \hat{\boldsymbol{\beta}} = 0\) which means that \(\hat{\beta}_0 + \hat{\beta}_1
    x = 0\), i.e. \(x = -\hat{\beta}_0 / \hat{\beta}_1 = 5.8\) as shown in the figure.
    For some new data \(x = 2\), since \(\hat{\beta}_0 + \hat{\beta}_1 x = 58 + (-10)(2)
    > 0\), then \(x\) is considered to be in Class 1; similarly, if \(x = 7\), then
    \(\hat{\beta}_0 + \hat{\beta}_1 x = 58 + (-10)(7) < 0\) and therefore \(x\) is
    assigned to Class 0.


    **Example:** Consider the two-dimensional problem back in Figure 8.3. A classifier
    has produced estimates of \(\hat{\beta}_0 = 10\), \(\hat{\beta}_1 = -4\), and
    \(\hat{\beta}_2 = 0.02\) for this problem. The decision boundary occurs where
    \(10 + (-4)x_1 + 0.02x_2 = 0\). It corresponds to the line \(x_2 = -\hat{\beta}_0
    / \hat{\beta}_2 - \hat{\beta}_1 / \hat{\beta}_2 x_1 = -500 + 200x_1\). Therefore,
    for some new data point at \((4, 100)\), we find that \(10 + (-4)(4) + 0.02(100)
    < 0\) and it is considered to be in Class 0. Likewise, a new point at \((2, 300)\)
    is considered to be in Class 1 since \(10 + (-4)(2) + 0.02(300) > 0\).


    A graphical view of the two ways to use \(\hat{\boldsymbol{\beta}}\) is provided
    in Figure 8.5. Assume that \(\boldsymbol{x}_i\) is to be assigned to a specific
    class. Starting with Figure 8.5(a), if \(\boldsymbol{x}_i^\top \hat{\boldsymbol{\beta}}
    > 0\), we declare the data point as belonging to Class 1, which is on one side
    of the boundary. If \(\boldsymbol{x}_i^\top \hat{\boldsymbol{\beta}} < 0\), it
    belongs to Class 0, which is on the other side of the boundary. Alternatively,
    we can use a probability test by computing \(p_i = \mathrm{P}(Y_i = 1 | \boldsymbol{x}_i)\)
    using

    \[p_i = p(z_i) = \frac{1}{1 + e^{-z_i}}, \tag{8.3.17}\]


    where \(z_i = \boldsymbol{x}_i^\top \hat{\boldsymbol{\beta}}\). The way to determine
    the class of \(\boldsymbol{x}_i\) is depicted in Figure 8.5(b). On one side of
    the plot is the region where \(p_i < 0.5\), which is Class 0, and on the other
    side is where \(p_i > 0.5\), which is Class 1. When \(z_i = 0\), the probability
    is 0.5. So the boundary line is indeed where \(p_i = 0.5\). This is a key point
    to understand about the decision boundary. It is defined as the linear or nonlinear
    boundary where the probability is 0.5.


