  md: '# 1.7.1 Clustering Example


    Clustering (see James et al. 2023) is a well-known and widely understood problem
    in ML so it serves as a good entry point into our study of robust methods. The
    procedure in clustering involves taking a set of unassigned multi-dimensional
    data points, \(\boldsymbol{X} \in \mathbb{R}^{n \times d}\), and assigning them
    to one of \(K\) groups or clusters based on their proximity to one another. The
    value of \(K\) is always an integer and serves as a hyperparameter specified by
    the user based on the application of interest with \(K > 1\) (since \(K = 1\)
    is a trivial case). We will walk through the basics of clustering starting with
    simple problems and then work our way up to the complete set of algorithms for
    both non-robust and robust methods. In the process, we will follow the loops of
    Figures 1.4 and 1.5.


    Exercise: Let the matrix \(\boldsymbol{X}\) be defined as follows:


    \(\boldsymbol{X} = \begin{pmatrix} 1 & 2 \\ 1 & 4 \\ 2 & 3 \end{pmatrix} .\)


    What is the value of \(n\) and \(d\) in this case? In this chapter, we will be
    referring to row \(i\) of this matrix using the notation \(\boldsymbol{x}^{(i)}\).
    What is \(\boldsymbol{x}^{(2)}\)? What is \(\boldsymbol{x}^{(2)} - \boldsymbol{x}^{(1)}\)?


    **Ans.:** Throughout this book, the notation \(\boldsymbol{X} \in \mathbb{R}^{n
    \times d}\) will be used to refer to a real matrix \(\boldsymbol{X}\) with \(n\)
    rows and \(d\) columns. In this trivial example, \(n = 3\) since there are 3 rows,
    and \(d = 2\) since there are 2 columns. Then, \(\boldsymbol{x}^{(2)} = (1, 4)^\top\).
    Also, \(\boldsymbol{x}^{(2)} - \boldsymbol{x}^{(1)} = (0, 2)^\top\). \(\square\)


    # 1.7.2 Clustering Problem Specification


    Given a set of \(n\) points in \(\mathbb{R}^d\), and an integer hyperparameter,
    \(K\), the goal of clustering is to assign each point to one of \(K\) clusters,
    \(C_1, \dots, C_k\), based on their proximity to a set of defined cluster centers,
    \(\mu_1, \dots \mu_K\), such that it minimizes a distance-based cost function.
    The cluster centers are computed using the set of points assigned to each cluster.
    The algorithm used for clustering starts with an initial assignment of points
    to clusters and then proceeds in an iterative fashion until convergence of cluster
    assignments is achieved.


    To understand the clustering process, consider Figure 1.7. The figure on the left
    is the original dataset in \(\mathbb{R}^2\) represented by variables \(x_1\) and
    \(x_2\) for each point. The number of clusters is chosen to be \(K = 3\) in this
    case and the clustering procedure after several iterations produces the figure
    on the right. The representative centers are indicated with the symbol \(\oslash\).
    The three circular/elliptical boundaries around the data are shown only as a visual
    aid to identify the different clusters. Often, different colors or symbols are
    used to represent different clusters.


    The problem of clustering is harder than it looks; in fact, it belongs to the
    class of NP-hard problems, meaning that it cannot be solved in polynomial time
    as the problem size increases. Therefore, locally optimal solutions are usually
    sought using “greedy” algorithms, starting with an initial guess for the centers
    and then repeating the process of clustering the data and recomputing the centers
    until convergence. Results may vary significantly depending on the choice of initial
    starting points.


    A generic unsupervised clustering algorithm is shown in Algorithm 1.1. It begins
    by randomly picking \(K\) centers. Then, the iterative loop is entered. In the
    first phase of the loop, \(K\) groups are defined by'
