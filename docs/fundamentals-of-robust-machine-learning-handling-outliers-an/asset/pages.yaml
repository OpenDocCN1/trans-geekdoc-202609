- pgno: 335
  md: 'For point 4, we follow the same steps as above to obtain


    $s(x, n) = 2^{-\frac{E[h(x)]}{c(n)}} = 2^{\frac{2.0}{1.8}} = 0.465.$


    Based on the calculations, point 4 is more likely to be an anomaly compared to
    point 10. Again, in this small example, there are no outliers or anomalies but
    the purpose here is to illustrate the basic operation of the Isolation Forest.


    The required number of random trees needed in IF is based on when the average
    depth of the points converges to a consistent set of values. Typically 100 trees
    are sufficient to obtain acceptable results. The shapes and sizes of the trees
    will all vary but after about 100 trees, the average depth does not change significantly.
    Furthermore, the values used to split the features are randomized. In this way,
    the average of all the trees is regularized and suitable for scoring and anomaly
    detection.


    To evaluate the performance of IF, we use the same dataset shown earlier in Figure
    11.1. IF uses 100 subsampled trees for this dataset with 201 points. Figures 11.9(a),
    (b), (c), and (d) show the different anomalies obtained with the anomaly score
    threshold set to 0.87, 0.86, 0.78, and 0.5, respectively. In Figure 11.9(a), only
    three anomalies were detected using 0.87 as the threshold. Lowering it to 0.86
    identifies four anomalies, as shown in Figure 11.9(b). Figures 11.9(c) and (d)
    show the behavior if the threshold is reduced further. It appears that the IF
    approach always focuses on the peripheral points of the dataset, as we found earlier.
    These examples demonstrate the fact that IF can occasionally fail to identify
    anomalies if the threshold hyperparameter is set incorrectly. In practice, there
    is a contamination parameter that is accessible to the user rather than the threshold
    hyperparameter, but it acts in a similar manner. It is the fraction of the dataset
    that is expected to be anomalies and is typically set to a low value.


    Figure 11.10 shows four cases (the same cases used to evaluate DBSCAN in the previous
    section) when IF is applied with contamination=0.02 in all cases. Note that in
    the first case in the top-left corner, the results are quite good. However, if
    the parameter is not adjusted on a case-by-case basis using domain knowledge,
    the results are unpredictable as seen in the other three plots. In each case,
    the level of contamination needs to be adjusted to obtain only the anomalies.
    If this is not done, the IF approach may declare that some data are outliers as
    shown in the bottom-left plot. Notice that IF “eats away at the data” from both
    ends in this case.


    The main advantage of IF is its ability to handle high-dimensional data and very
    large datasets in a way that is much faster than other methods. This is due to
    the subsampling feature of the approach which naturally reduces the dimensionality
    of the data used to generate each tree. On the other hand, the random nature of
    subsampling implies that results tend to vary from one run to another. This nondeterministic
    behavior may require multiple runs to gain confidence in the results. Another
    issue is that clusters of outliers may present some difficulty in detection since
    IF attempts to isolate individual anomalies. There may also be some issues with
    binary and categorical features. Finally, the manual setting of the level of contamination
    controls the quality of the results. Regardless of these shortcomings, it is one
    of the most widely used detection methods today.'
