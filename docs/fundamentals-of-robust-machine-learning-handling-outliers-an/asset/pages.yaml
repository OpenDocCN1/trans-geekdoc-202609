  md: 'Using a Lagrange multiplier formulation, we obtain the following objective
    function:


    $$J^{\text{SVC}}(\beta) = \frac{1}{2} \sum_{j=1}^d \beta_j^2 + C \sum_{i=1}^n
    \max(0, 1 - y_i(\mathbf{x}_i^T \beta + \beta_0)), \quad (8.10.3)$$


    where $C$ is the regularization hyperparameter and the second term uses the **hinge
    loss** to enforce the requirement, $y_i(\mathbf{x}_i^\top \boldsymbol{\beta} +
    \beta_0) > 1$. Effectively, this is just a replacement of the cross-entropy loss
    of Eq. (8.10.1) with the hinge loss. This convex optimization problem can be minimized
    in a straightforward manner. Not all points may be properly categorized at the
    minimum but it will be optimal relative to any given problem.


    Consider the two plots in Figure 8.19. The results shown for the case with no
    outliers in the left-hand panel would be produced using SVC. The decision boundary
    lies in the middle of two dotted lines that define the margins. This approach
    is very effective as a large-margin linear classifier. The two support vectors
    lie on the margins running in parallel to the decision boundary. They are the
    only points involved in defining the decision boundary. None of the other points
    matter in the solution. In that sense, this is a robust method.


    However, it is not robust to outliers, and that is one of the weak points for
    standard SVCs. This is shown in the plot on the right-hand side of Figure 8.19.
    When two outliers are introduced, the results clearly shift to the left. The reason
    for this should be clear: the loss function penalizes errors in classification
    and each outlier adds a large error to the objective function. If we look back
    at Eq. (8.10.3), we note that if the classification of a point is correct, the
    term inside the summation of the loss function is identically 0. However, if it
    is incorrect, as will always occur with outliers on the wrong side of the margins,
    the term will be greater than 1 and make a large contribution to the total loss.
    Points inside the margins will contribute to the loss but these values will be
    small.


    The complete picture is illustrated in Figure 8.20 where the hinge loss is plotted
    with various segments indicating the cost for each type of data point. Regularization
    may help somewhat in this situation but it depends on the location and impact
    of the outliers during cross-validation. Therefore, we can conclude that outliers
    present a problem to the SVC method, although it is robust in terms of the support
    vectors at the margins of the decision boundary.


    ![](img/f26d7f591c2a080d86425985301266a4_258_0.png)


