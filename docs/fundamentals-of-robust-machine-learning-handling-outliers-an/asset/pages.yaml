  md: 'In this form, the derivative is being scaled by \(\sqrt{\boldsymbol{r}_{dw}}\)
    rather than the absolute value of the gradient. Since the new formulation is intended
    to modify the learning rate, we could conveniently rewrite it for better understanding
    as follows:


    \(\boldsymbol{w}^{(t+1)} = \boldsymbol{w}^{(t)} - \frac{\ell}{\sqrt{(\boldsymbol{r}_{dw})^{(t+1)}}}
    \left( \frac{\partial J(\boldsymbol{w})}{\partial \boldsymbol{w}} \right)^{(t)}.\)
    (10.4.7)


    Now the square root of the exponentially weighted squared gradients is in the
    denominator of the learning rate and implies that each parameter adjusts the learning
    rate based on its own exponential history of gradients. This has been found to
    be a very effective update equation. However, if the derivative is 0, the equation
    goes to infinity. To resolve this issue, we can add a small value, such as \(\varepsilon
    = 10^{-8}\), to the denominator as follows:


    \(\boldsymbol{w}^{(t+1)} = \boldsymbol{w}^{(t)} - \frac{\ell}{(\sqrt{(\boldsymbol{r}_{dw})^{(t+1)}}
    + \varepsilon)} \left( \frac{\partial J(\boldsymbol{w})}{\partial \boldsymbol{w}}
    \right)^{(t)}.\) (10.4.8)


    **Exercise:** Given that \(dw^{(0)} = (\partial J(w)/\partial w)^{(0)} = 5\),
    \(r_{dw}^{(0)} = 0\), and \(w^{(0)} = 0.1\) compute the value of \(w^{(1)}\) using
    the rmsprop equation with \(\alpha_2 = 0.999\), \(\varepsilon = 0\), and \(\ell
    = 0.05\).


    **Ans.:** The rmsprop term is given by


    \(r_{dw}^{(1)} = \alpha_2 r_{dw}^{(0)} + (1 - \alpha_2) dw^{(0)} \times dw^{(0)}
    = 0.999 \times 0 + 0.001 \times 5^2 = 0.025\)


    Therefore, \(w^{(1)} = 0.1 - \frac{0.05}{\sqrt{0.025}} \times 5 = -1.48\). \(\square\)


    # 10.4.3 Optimizer Warm-Up Phase


    When applying momentum or rmsprop, there is a startup problem due to the fact
    that there is no history to draw from for the exponentially weighted gradients
    at the beginning. In fact, it is not until roughly 10 iterations have been computed
    that the requisite amount of history is available (assuming \(\alpha_1 = 0.9\)).
    Therefore, some mechanism is needed to "warm-up" the two methods until enough
    iterations of history exist. One way to do this is to divide the corresponding
    terms for each method by a quantity that starts with a large fraction of the initial
    gradients and then reaches the steady-state value when enough history exists;
    i.e. the corrected values are


    \(\boldsymbol{m}_{dw}^{\text{corr}} = \frac{\boldsymbol{m}_{dw}^{(t+1)}}{1 - \alpha_1^{t+1}}\)


    and


    \(\boldsymbol{r}_{dw}^{\text{corr}} = \frac{\boldsymbol{r}_{dw}^{(t+1)}}{1 - \alpha_2^{t+1}},\)


    respectively. Assuming \(t = 0\) at the start, the denominator for momentum is
    initially \((1 - \alpha_1)\). Then for \(t = 1\), we use \((1 - \alpha_1^2)\),
    for \(t = 2\), we use \((1 - \alpha_1^3)\), and so on. The same holds for rmsprop
    with \(\alpha_2\). Eventually, the denominator approaches 1 in both cases (given
    that \(\alpha_1\) and \(\alpha_2\) are always less than 1), thereby ending the
    warm-up phase.'
