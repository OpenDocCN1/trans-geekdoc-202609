    # 4.8.4 Selecting Hyperparameters for Robust Regression


    Now that the MAE metric and its proper use have been described, it can immediately
    be applied to the selection of the robustness coefficient \(a\) for linear regression
    using log-cosh and \(\delta\) for Huber''s method. Recall from Chapter 3 that
    the general log-cosh loss has the form


    ```

    \(J^{\text{LC}}(x; a) = \frac{1}{a} \sum_{i=1}^n \log(\cosh(ax)).\) (4.8.5)

    ```


    A suitable value for \(a\) can be obtained by selecting six different values and
    comparing the MAE values. In addition, since this loss function is meant to deliver
    a median solution, the number of points below the line or hyperplane should be
    50% of the data. This criteria can also be used to select the value of \(a\).


    Table 4.3 provides the MAE and number of points below the line (and percentage)
    for the Boston Housing dataset using six different values of \(a\). Effectively,
    we are comparing six different robust estimators from the same family. The results
    indicate that \(a = 2\) is a suitable value. Below this value, the MAE is higher
    and the “points below the line” exceeds 50% which does not satisfy the definition
    of the median. Above this value, the “points below the line” drops below 50%.
    Clearly, there is a trade-off between the MAE and the need to satisfy the requirements
    of the median. The value of \(a = 2\) is a good balance between the two objectives
    and is applicable with all datasets.'
