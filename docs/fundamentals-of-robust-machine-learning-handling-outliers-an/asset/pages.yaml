  md: 'In addition to the choice of robust methods over non-robust methods, there
    is a similar choice in the penalty functions. In particular, for problems where
    many of the parameter values are ideally 0, the LASSO penalty function (see Chapters
    5 and 6) is often coupled with CELR. The combined loss function is


    ```

    J^{CELR-LASSO}(\beta) = -\sum_{i=1}^n (y_i \log p_i - (1 - y_i) \log(1 - p_i))
    + \sum_{j=1}^d |\beta_j|.

    ```


    Unfortunately, CELR is not robust and LASSO does not possess the oracle property
    and therefore may not asymptotically produce the proper variable ordering. On
    the other hand, using LCLR with aLASSO provides robustness and the oracle property.
    The combined loss function is given by


    ```

    J^{LCLR-aLASSO}(\beta) = \frac{1}{10} \sum_{i=1}^n \log(\cosh(10(y_i - p_i)))
    + \sum_{j=1}^d \frac{|\beta_j|}{|\beta_j^*|},

    ```


    where \beta_j^* is a known quantity typically set to the unpenalized estimate,
    \hat{\beta}_j^{LC}. The difference between the two approaches is illustrated in
    Figure 12.19 using the Titanic dataset. The CELR–LASSO and LCLR-aLASSO traces
    are shown and there are notable differences. In the CELR–LASSO case, Pclass is
    considered to be as important as Sex. However, we know that this is not true.
    In fact, the LCLR-aLASSO trace shows that the Sex of the passenger is the most
    important variable, far more important than the Pclass. In addition, CELR–LASSO
    indicates that the Age is as important as the remaining of the variable whereas
    LCLR-aLASSO indicates it is less important. The previous analysis of the contributions
    of each variable to the predicted outcome shows that Age should not be considered
    as important as SibSp and that is exactly what LCLR-aLASSO shows in its traces.
    Furthermore, many Age values were imputed as they were missing so its true importance
    would be hard to gauge. Hence, CELR and LASSO both fall short of the desired goals
    of XAI and lead to explanations that may not be correct. This is why the LCLR
    and aLASSO combination is preferable. Conclusions reached using this combination
    may have more credibility and stability, and hence explainability.


