    16. The ranks of the outliers for each detector can be summed easily by looking
    at the first column in the table. The AUROC of the three detectors are:

    Detector 1: AUROC = 1 − (1+5)−3 / 16 = 1 − 3/16 = 13/16 = 0.8125'
