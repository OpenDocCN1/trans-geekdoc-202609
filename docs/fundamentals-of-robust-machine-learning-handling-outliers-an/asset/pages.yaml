- pgno: 143
  md: 'learning algorithms. During this step, explanatory variables with differing
    units and ranges are standardized to ensure consistency and comparability.


    Standardization is required in certain machine learning tasks such as logistic
    regression, neural networks, anomaly detection, and determining variable importance.
    For example, during gradient descent in logistic regression or neural networks,
    the iterations may not converge if the data is not normalized4 in some way. Certain
    anomaly detectors do not work well unless the data is standardized. It is also
    good practice to standardize the data (unless they are categorical data with discrete
    values) in order to obtain reliable information about variable importance.5


    Standardization is applied to the data on a column-by-column basis using the formula
    for z-scores as follows:


    $z_j = \frac{x_j - \hat{\mu}_j}{\hat{\sigma}_j}, \quad \text{for } j = 1, \dots,
    d, \quad (4.9.1)$


    where $\hat{\mu}_j$ and $\hat{\sigma}_j$ are the computed mean and standard deviation
    of the $j$th column, respectively. Essentially, we are making all the explanatory
    variables behave as standard normal variables such that $\mathbf{Z} \sim \mathcal{N}_d(\mathbf{0},
    \mathbf{I}_d)$. This implies that the optimization space is much more uniform
    and leads to faster convergence.


    The results of such a procedure can be visualized as shown in Figure 4.22 for
    the Swiss Fertility, diabetes, and Boston Housing datasets. In each case, the
    non-standardized and standardized values are shown side by side. The original
    variables (left panels) and the z-scores (right panels) are plotted horizontally
    and stacked one on top of the other for ease of comparison. The explanatory variables
    are labeled from $\mathbf{x}_1$ to $\mathbf{x}_d$ in each case. The unstandardized
    values could have a different ranges and completely different units of measure,
    as in the case of the Boston Housing.6 Therefore, it is mandatory to standardize
    this data set. The values for Swiss Fertility are roughly in the same range so
    standardization may be optional here. The diabetes values are in the same range
    so standardization is not needed. For illustrative purpose, we apply standardization
    to all of them.


    After standardization, a majority of the standardized values fall between -4 and
    4. There are a few values that lie outside this range (indicated with a square)
    which we may be tempted to declare as outliers. They are potentially high-leverage
    points which could be removed. However, they may also be valuable data points
    which we may want to keep. Robust methods are better-equipped to handle these
    types of outliers properly, as described in Chapters 2 and 3.


