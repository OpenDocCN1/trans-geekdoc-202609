    # ## 5.11 Variable Importance


    One of the key objectives in data science is to determine the importance of different
    explanatory variables relative to the response variable. There are many tools
    and techniques used to obtain the variable importance, two of which will be described
    in this section. For linear regression, we could look at the size of the estimates
    to gain some insight into its importance. However, this requires that the dataset
    be standardized and does not take the variance into account. Instead, it is common
    practice to use the t-statistic to obtain a first-order assessment of the relative
    importance of different variables. Another approach is to use LASSO and aLASSO
    traces to provide an ordering of the variables from most important to least important.
    These two penalty functions perform better if combined with robust methods, especially
    if there are outliers in the dataset. In this section, we compare and contrast
    these different approaches.


