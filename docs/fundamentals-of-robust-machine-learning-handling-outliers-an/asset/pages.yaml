    # 12.3 Example: Titanic Dataset


    The Titanic dataset is well-known in data science circles as a standard binary
    classification problem. It contains information about the passengers who survived
    and those who did not on the ill-fated maiden voyage of the Titanic in April 1912,
    which struck an iceberg 400 miles off the coast of Canada. Our objective is to
    use a training set to analyze a random subset of Titanic passengers and their
    survival rates. By applying logistic regression, we can build a model and use
    it to predict which passengers would survive based on a given test set. This approach
    seeks to determine whether survival was random or if there were underlying patterns
    that could be captured in a predictive model.


    We first illustrate basic elements of data science and EDA. Then, the dataset
    is processed to create the needed X and y values for both training and testing
    purposes. There are 891 rows in the training set and 418 rows in the test set.3
    Next, two approaches to binary classification are compared and contrasted, namely,
    CELR and LCLR, which were covered in Chapter 8. The Titanic dataset is expected
    to have many outliers by its very nature, leading us to believe that robust methods
    would be better suited for this application. Another goal of this section is to
    demonstrate that robust methods offer a number of other advantages, in addition
    to better prediction accuracy.


