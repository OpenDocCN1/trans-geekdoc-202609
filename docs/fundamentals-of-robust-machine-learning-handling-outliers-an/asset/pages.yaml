  md: 'The convexity condition is needed to find a unique minimum. We can assess the
    convexity of the loss function using the second derivative:


    \(\psi''(r_i) = \frac{\partial^2 \rho(r_i)}{\partial^2 r_i}.\) (2.6.4)


    Then, the **convexity property** is satisfied if and only if


    \(\psi''(r_i) \ge 0 \text{ for all } r_i\) (2.6.5)


    and it is strictly convex if \(\psi''(r_i) > 0\) for all \(r_i\).


    The M-estimation approach to specifying loss functions can also be used for non-robust
    estimators. For \(L_2\), we have that


    \(\rho_{L_2}(r_i) = \frac{r_i^2}{2}.\)


    Therefore,


    \(\psi_{L_2}(r_i) = r_i\)


    and


    \(\psi''_{L_2}(r_i) = 1.\)


    So \(L_2\) has a strictly convex loss function. Now if we check \(L_1\) we find
    that


    \(\rho_{L_1}(r_i) = |r_i|.\)


    Therefore,


    \(\psi_{L_1}(r_i) = \text{sgn}(r_i)\)


    and


    \(\psi''_{L_1}(r_i) = \begin{cases} \text{undefined} & \text{if } r_i = 0 \\ 0
    & \text{if } r_i \neq 0 \end{cases} .\) (2.6.6)


    The function is convex but not strictly convex and is undefined at \(r_i = 0\).
    So we cannot guarantee that a unique solution exists. In fact, there may be an
    infinite number of localized solutions using \(L_1\).


    Figure 2.5 plots the \(\rho(r_i)\) and \(\psi(r_i)\) functions for \(L_1\) and
    \(L_2\). Note that \(L_1\) follows an absolute function, \(|r_i|\), while \(L_2\)
    follows a quadratic function, \(r_i^2/2\). The problem with using \(L_2\) is that
    the residuals are squared, which amplifies the importance of large residuals.
    During linear regression, outliers are considered to be, in some sense, more important
    than the majority of the data since outliers tend to have larger residuals. Thus,
    it is highly sensitive to outliers. This is the main problem with the \(L_2\)
    estimator.


    The \(L_1\) estimator is not as sensitive to outliers because it sums the absolute
    value of the residuals in the loss function, but it has other problems. The \(\rho(r_i)\)
    function has a distinctive kink at \(r_i = 0\). When we examine its first derivative
    in the lower-left panel of Figure 2.5, we note that it is a discontinuous function
    whereas the first derivative of \(L_2\) is continuous, as seen in the lower-right
    panel. The discontinuity of \(L_1\) poses problems both mathematically and in
    numerical optimization when used for machine learning. Further, the second derivative
    of \(L_1\) produces an impulse function at the origin while the second derivative
    of \(L_2\) is flat and continuous at a value of 1. Clearly, \(L_1\) and \(L_2\)
    both have notable disadvantages so alternative methods are needed to handle outliers.'
