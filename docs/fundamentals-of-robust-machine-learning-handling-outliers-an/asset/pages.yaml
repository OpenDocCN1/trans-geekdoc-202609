    For the robust procedure, we start with the distribution of residuals of the form
    \(r_i = y_i - p_i\). We postulate that the residuals are distributed according
    to the Cosh distribution and then use the maximum-likelihood procedure (see Chapter
    3). The likelihood function based on the Cosh distribution is given by:


    \(L(r_1, r_2, ..., r_n; \beta) = \prod_{i=1}^n \frac{1}{\pi \cosh(r_i)}\).


    The negative log-likelihood expression is given by:


    \(-\ell(r_1, r_2, ..., r_n; \beta) = n \log \pi + \sum_{i=1}^n \log(\cosh(r_i))\).


    The first term is constant for a given \(n\) and ignored during minimization.
    This gives rise to the log-cosh loss function in terms of residuals,


    \(\text{LC loss} = \sum_{i=1}^n \rho_{LC}(r_i) = \sum_{i=1}^n \log(\cosh(y_i -
    p_i))\).


    Following the steps outlined earlier for gradient descent, we obtain


    \(\frac{\partial J^{LC}(\boldsymbol{\beta})}{\partial \beta_j} = \sum_{i=1}^n
    p_i(1 - p_i) \tanh(y_i - p_i)(-x_{ij})\).


