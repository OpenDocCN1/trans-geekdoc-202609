    # 11.3 Anomaly Detection Using MADmax


    The methods described previously require the specification of certain hyperparameters
    in order to obtain reasonable results. Furthermore, they do not directly make
    use of existing robust techniques or robust statistics. In this section, we describe
    an anomaly detection method that does not require user assistance and is based
    on various robust methods described throughout this book. It is called MADmax
    for reasons that will be clear shortly. The method utilizes a combination of the
    k-medians clustering algorithm of Chapter 1 and k-NN anomaly detection described
    earlier in this chapter. The automatic detection of anomalies without user intervention
    is a distinct advantage over other methods since they are usually prone to error
    if the hyperparameters are not set properly. In the case of MADmax, the parameters
    are automatically determined based on robust statistics, although external tuning
    is still possible if desired. The steps leading to the MADmax approach will be
    outlined in the sections to follow.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# 11.3.1 Robust Standardization


    The first step in any anomaly detection method is to carry out some form of standardization
    of the data. This produces a dataset where all features are centered and scaled
    to lie in the same range of values. Typically, the mean and standard deviation
    are used to compute z-scores (see Chapter 4) which are then used in place of the
    original data. However, these statistics are not robust and they tend to hide
    outliers. Hence, in the pre-processing of data containing outliers, it is prudent
    to compute robust z-scores. The robust equivalent involves the use of the median
    and the MAD (see Chapters 1 and 4). In particular, the robust z-scores for each
    column j can be computed using


    ```

    z_j = \frac{x_j - \text{median}(x_j)}{\text{MADN}(x_j)}, \quad j = 1, \dots, d.
    \quad (11.3.1)

    ```


    Recall from Chapter 1 that MADN(x_j) = 1.426 x MAD(x_j), where


    ```

    MAD(x_j) = \text{median}_{1 \le i \le n} (|x_{ij} - \text{median}(x_j)|). \quad
    (11.3.2)

    ```


    In the MADmax approach, it is essential that all data be robustly standardized,
    and it is also good practice for all other anomaly detection methods.


    # 11.3.2 k-Medians Clustering


    The second step in MADmax is to perform k-medians clustering, as described in
    Chapter 1. This is a robust version of k-means clustering. The number of clusters
    is usually specified by the user based on domain knowledge and experience. The
    difference here is that the number of clusters is computed automatically as


    ```

    K = \lfloor \frac{n}{m} \rfloor, \quad (11.3.3)

    ```


    where n is the number of points in the dataset and m is the average size of a
    cluster. The notation used above is the floor function to define K as the integer
    portion of n/m. In MADmax, the use of k-medians clustering is not to find clusters
    but rather to create as many mini-clusters as needed containing roughly m points
    in order to facilitate the process of finding a suitable threshold for anomaly
    detection. Typically, m = 30 for MADmax. For a dataset with 91 points, 3 mini-clusters
    will be created. For a larger dataset with 907 points, 30 mini-clusters will be
    created even if the dataset contains only 3 actual clusters. In contrast, DBSCAN
    will create three clusters in this case because there are only three clusters
    in the dataset. The large number of mini-clusters allows MADmax to handle any
    random shapes that the actual clusters may have, and any variations in density
    across clusters.


    Example: The reason for k-medians clustering in MADmax is best understood through
    a detailed example. Consider Figure 11.11 which illustrates the manner in which
    a suitable threshold is determined. The original dataset shown in the top-left
    corner contains 420 points. It appears there are three clusters and four anomalies.
    The results of k-medians clustering are shown in the top-right corner. A total
    of K = [n/m] = [420/30] = 14 mini-clusters are created even though there are only
    three observable clusters. Each one has its own MAD value which is related to
    the density of the mini-cluster. We want to create circular regions around the
    median of each mini-cluster to try to encompass all the points in each mini-cluster.
    A good rule-of-thumb is to use the 4.5-MAD edit rule to compute the radius.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '![](img/f26d7f591c2a080d86425985301266a4_339_0.png)


    Figure 11.11 Development of the MADmax anomaly detection method. (a) Original
    dataset, (b) 14 mini-clusters indicated with circles of radius 4.5-MAD around
    the medians, (c) 14 mini-clusters with radius 6.8-MAD circles around the medians,
    and (d) 14 mini-clusters with radius 6.8-MADmax circles around the medians.


    This is a robust statistic that was described in Chapter 4. Then, circular regions
    around each median can be produced, as shown in the top-right corner. Unfortunately,
    they do not cover all the points in the three clusters. Therefore, we need to
    increase the radius by a factor larger than 4.5.


    For that purpose, a radius of 6.8-MAD is better at capturing more inlier data
    in the region around each median, as in the bottom-left figure. However, even
    6.8-MAD does not cover all the points. This is true in this example and also for
    most datasets. Rather than using individual MAD values for each mini-cluster,
    it is better to use a single value for all mini-clusters. A sensible choice is
    the largest MAD value among the set of 14 clusters. The maximum of all 14 of the
    MAD values, called MADmax, is used to define a radius of 6.8xMADmax to create
    circular regions (or hyperspherical regions in higher dimensions) around'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'all mini-clusters.$^3$ This covers all the inliers, as shown in the bottom-right
    corner. The mini-clusters all use the same MADmax value which establishes the
    boundary between inliers and outliers. Note that a cloud-like shape covers the
    inliers while the outliers and anomalies all lie outside the cloud.


    As mentioned before, one of the advantages of creating many mini-clusters is that
    it allows any cluster shape and density to be accommodated in the procedure. For
    example, a cluster in the form of a U-shape or S-shape can be decomposed into
    a number of mini-clusters of approximately 30 points each. The original shape
    of the clusters in the dataset becomes irrelevant, as does any variation in density
    within or between clusters.


    # ## 11.3.3 Selecting MADmax


    We now provide specific details of the third step in the approach involving the
    selection of MADmax. After _k_-medians clustering is performed on robustly standardized
    data to create _K_ mini-clusters, the median and MAD are computed for each mini-cluster.
    The maximum of the mini-cluster MAD values is computed as follows:


    ```

    `MADmax = max { MAD(_d_<sub>1</sub>), MAD(_d_<sub>2</sub>), ..., MAD(_d<sub>K</sub>)}
    ,`  (11.3.4)

    ```


    where _**d**_<sub>_i_</sub>, _i_ = 1, ..., _K_, represents the distances from
    all points in mini-cluster _i_ to its median. The maximum MAD value across all
    mini-clusters, MADmax, can then be multiplied by a given amount, Cfactor, to establish
    a threshold for finding anomalies. That is, any point further than a threshold
    _t_MC = Cfactor × MADmax away from the median of its own mini-cluster will be
    considered an anomaly candidate. In our earlier example, we have been using Cfactor=6
    . 8 which is a good default setting. This method is quite reliable since it uses
    robust statistics to determine the threshold.


    To understand why this approach is reasonable, recall that MAD is simply a robust
    version of the standard deviation which is a measure of the dispersion or spread
    of the data. If the data spread is large, then MAD will be large. However, if
    the data is tightly packed in a region, then the MAD will be small. Therefore,
    the MAD for each mini-cluster represents the local density of that mini-cluster
    and can be used to define an edit rule to trim data. However, one MAD value for
    all mini-clusters is required. Rather than using the smallest MAD or an average
    MAD, it is best to use the largest MAD in order to cover all the inliers. The
    data cloud associated with Cfactor × MADmax defines the region where outliers
    will not exist. In particular, anything outside the cloud of say 6.8×MADmax is
    a potential anomaly. Unfortunately, we cannot guarantee that it is an anomaly
    so further checking is necessary, as described next.


    # ## 11.3.4 _k_-Nearest Neighbors (_k_-NN)


    The fourth step is to take the candidate anomalies that lie outside the inlier
    cloud and apply the _k_-NN algorithm. Used in this way, there are two advantages
    over the _k_-NN method described earlier. The first is that only a few points
    are subjected to the _k_-NN test since only a small number of candidate anomalies
    are expected. The second is that the threshold and _k_ are also determined automatically.
    For clarity, we use _k_NN to refer to the number of nearest neighbors to be considered
    in the algorithm and _t_NN as the threshold. Typically, _k_NN is set to a high
    number such as _k_NN = 25. This means that the distances to the nearest 25 neighbors
    are averaged. The threshold is automatically set to _t_NN = Afactor × MADmax,'
  merge: -1
  img_proc: true
- pgno: 341
  md: '![](img/f26d7f591c2a080d86425985301266a4_341_0.png)


    Figure 11.12 Post-processing of anomaly candidates using k-NN with acceptance
    criteria determined by a circular region defined using the radius Afactor × MADmax.


    where Afactor = 11.0 by default for reasons similar to those given for Cfactor.
    In doing so, all of the limitations of the basic k-NN approach are circumvented.
    In fact, this is a more effective use of k-NN since only a few points are involved
    (i.e. only anomaly candidates) and the threshold is automatically computed using
    MADmax.


    The procedure is shown in Figure 11.12. The candidate anomalies have a circular
    region around them with a radius given by Afactor × MADmax. If the average distance
    of 25 nearest neighbors of a candidate anomaly is greater than this threshold,
    then it is declared an anomaly. In the figure, five of the candidates will be
    declared as anomalies, but the one near the inlier data will be not, because its
    radius encroaches on nearby inliers. Therefore, the average distance to the 25
    nearest neighbors will be less than Afactor × MADmax. The three points in a group
    (in the lower part of the figure) will all be declared anomalies because each
    of their average distances to their nearest 25 neighbors will greatly exceed the
    size of the individual circles. In fact, all points in any small mini-clusters
    (those with less than five points) will be subjected to the k-NN test. In this
    manner, it is straightforward to check each candidate one by one using k-NN without
    incurring a large penalty.


    # 11.3.5 k-Nearest Medians (k-NM)


    With the basic ideas of MADmax covered, there are some special cases that need
    to be addressed. For example, creating mini-clusters in the manner described may
    produce some cases of mini-clusters that consist only of anomalies. If these points
    are far from each other, it results in a large MAD value which impacts the chosen
    MADmax. There may also be cases where we may have mini-clusters containing both
    inliers and outliers. These types of cases have to be identified and treated separately.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'One approach to handling such special cases is to use the k-nearest medians
    (k-NM) approach which is a variant of k-NN that uses medians of mini-clusters
    rather than the original data points. In some sense, the medians are representatives
    of each mini-cluster and we can inspect their proximity to one another to assess
    whether or not the median is associated with the inliers or anomalies.


    Assume that we have identified the K medians of the mini-clustered data. Then,
    when applying k-NM, we have effectively reduced the dimensionality of the problem
    space from R^n to R^K. The problem is O(K^2) instead of O(n^2) which is a much
    lower computational complexity. In doing so, if we find any medians to be outliers,
    their associated mini-clusters will not be included in the specification of MADmax.
    Then, all data associated with that median are potential anomalies and they all
    need to be checked using k-NN as described in the previous section. The value
    of the threshold for the mini-cluster median test is dictated by t_NM = Mfactor
    x MADmax, where Mfactor is another internal parameter used in the MADmax algorithm
    with a default value of 14.8.


    Figure 11.13 illustrates this case with a scatter plot of medians for the inlier
    data and one median in the bottom-right corner for the outlier data. The mini-cluster
    associated with the outlier median may contain many anomalies, each of which must
    be checked using the k-NN algorithm. Of course, there may be many outlier medians
    to deal with. Therefore, one last issue involves choosing the proper value of
    k for k-NM, which we refer to as k_NM. In this case, a small value such as k_NM
    = 1 to 5 is appropriate. It specifies how many mini-clusters containing outliers
    are allowed to be in the same vicinity of one another. In particular, if we decide
    that three outlier mini-clusters are permitted next to each other as neighbors,
    then we set k_NM = 3. Beyond the overall steps of the MADmax algorithm that have
    been described, additional heuristics can be introduced to address any corner
    cases that may arise. The key aspect to note is that once the internal parameters
    are set, the MADmax approach is able to find anomalies in a variety of datasets
    without user intervention.


    To summarize, the definitions of the internal parameters and multiplying factors
    for MADmax are:


    +   • MADmax: the largest MAD value of all mini-clusters.

    +   • t_MC: this defines a circle of radius Cfactor x MADmax around mini-cluster
    centers that contains all points associated with the mini-cluster.

    +   • t_NN: this defines a circle of radius Afactor x MADmax around anomaly candidates
    to declare them as anomalies or inliers.


    **Figure 11.13** Scatter plot of medians to check if there are any mini-clusters
    of anomalies using a test criteria determined by Mfactor x MADmax.


