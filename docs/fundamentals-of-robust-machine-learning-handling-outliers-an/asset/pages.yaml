  md: 'The CE loss is given by


    CE loss = -\(\frac{1}{n} \sum_{i=1}^n [y_i \log p_i + (1 - y_i) \log(1 - p_i)]\).
    (8.3.1)


    where the \(y_i\)’s are the true responses and the \(p_i\)’s are the predicted
    values, for \(i = 1, \dots, n\). It is also referred to as the *log loss* function.


    This loss function does not have the same form as any of the loss functions we
    have encountered thus far, but remember that we are now doing logistic regression,
    not linear regression. The term \(p_i\) is a probability that depends on the explanatory
    variables \(\mathbf{x}_i\) and the model parameters \(\boldsymbol{\beta} \in \mathbb{R}^{d+1}\)
    in the following way:


    \(p_i = \frac{1}{1 + \exp(-\mathbf{x}_i^\top \boldsymbol{\beta})}\). (8.3.2)


    Rather than predicting 0 or 1, the goal of logistic regression is to predict the
    probability of a response of 1 for each observation using this **logistic function**.
    If the probability is high, the predicted response is considered to be 1, whereas
    if the probability is low, it is considered to be 0. Because of its importance,
    we will also derive this equation, but consider it to be known for the moment.
    The estimate of \(\boldsymbol{\beta}\) associated with the minimum of the CE loss
    function defines a point, line, plane, or hyperplane (depending on the dimensions
    of \(\boldsymbol{\beta}\)) that forms the decision boundary.


    *Note*: While the goal of the next section is to derive the cross-entropy loss
    from first principles in some easy to understand form, it may require several
    passes to fully grasp it. This is an important derivation to follow carefully.
    One way to deal with the derivation in *d*-dimensional space is to imagine that
    we are trying to find a linear boundary in a two-dimensional space. This may be
    helpful in keeping things clear in your mind. The section may also be skipped
    without loss of continuity.


    # ### 8.3.1 Deriving the Cross-Entropy Loss


    To set up the derivation, we need to specify the distribution associated with
    the response variable \(Y\) as a starting point. Since we can only have a response
    of 1 or 0, the random variable \(Y\) follows a Bernoulli distribution with some
    unknown probability, \(p\). That is, \(Y \sim \text{Ber}(p)\). The probability
    mass function (PMF) of the Bernoulli distribution is shown in Figure 8.4. This
    discrete distribution describes our view of \(Y \in \{0, 1\}\), where the probabilities
    of being 0 or 1 are \(1 - p\) and \(p\), respectively. This particular distribution
    can be written in an elegant form as follows:


    \(f_p(y) = p^y(1 - p)^{(1-y)}\). (8.3.3)


    To check if this is the correct formulation, we note that if \(y = 1\), then \(f_p(y)
    = p\), and if \(y = 0\), we have that \(f_p(y) = 1 - p\). So it is indeed the
    Bernoulli distribution.


