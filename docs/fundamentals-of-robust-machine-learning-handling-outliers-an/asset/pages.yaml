- pgno: 187
  md: 'and choose the \(\lambda\) that minimizes this metric. There is one major problem
    with this approach: the optimal value is \(\lambda = 0\) because the MSE is minimized
    using LS. It can only grow larger as \(\lambda\) is increased.


    The other option is to use the quadratic risk which is the sum of the variance
    and the bias squared. In short, the proper value of \(\lambda\) should be based
    on balancing overfitting and underfitting to build our model. Note that an optimal
    \(\lambda\) value is unique to each estimator and generally cannot be compared
    or transferred between estimators. Additionally, the most suitable \(\lambda\)
    usually lies in a range of values in practice, as opposed to being one unique
    value, so it is not critical that an ideal value be found. A near-optimal value
    is sufficient in machine learning.


    By applying a penalty function, we can increase the bias and decrease the variance
    until the estimates minimize the QR statistic. But how do we know this is happening
    as we change \(\lambda\)? This was already illustrated in Chapter 5 in a qualitative
    way. Here, we provide quantitative evidence of these effects. For LS-ridge, there
    are closed-form expressions available (see Montgomery et al. 2012) that allow
    us to gain insight into what is happening.


    The QR of estimates in a multidimensional setting is given by


    ```

    QR(\hat{\beta}^{\text{LS-ridge}}) = \text{tr}(\text{Var}(\hat{\beta}^{\text{LS-ridge}}))
    + \|\text{bias}(\hat{\beta}^{\text{LS-ridge}})\|_2^2 \qquad \text{(6.4.4)}

    ```


    where \(\text{tr}(\text{Var}(\hat{\beta}^{\text{LS-ridge}}))\) is the trace of
    the covariance matrix and involves adding up its diagonal terms. For Eq. (6.4.2),
    the formulas for bias and variance for LS-ridge are given by\(^2\)


    ```

    \|\text{bias}(\hat{\beta}^{\text{LS-ridge}})\|_2^2 = \lambda^2 \beta^T (X^T X
    + \lambda I_d)^{-2} \beta. \qquad \text{(6.4.5)}

    ```


    which is a scalar quantity, and


    ```

    \text{Var}(\hat{\beta}^{\text{LS-ridge}}) = \sigma^2 (X^T X + \lambda I_d)^{-1}
    (X^T X) (X^T X + \lambda I_d)^{-1}, \qquad \text{(6.4.6)}

    ```


    which is a matrix quantity (for which the trace is taken to produce a scalar).


    The above expressions look rather unwieldy and are too complicated to provide
    any understanding of the bias-variance trade-off. To simplify the analysis and
    develop intuition, let \(X^T X = I_d\). This yields


    ```

    \|\text{bias}(\hat{\beta}^{\text{LS-ridge}})\|_2^2 = \frac{\lambda^2}{(1+\lambda)^2}
    \beta^T \beta, \qquad \text{(6.4.7)}

    ```


    and


    ```

    \text{tr}(\text{Var}(\hat{\beta}^{\text{LS-ridge}})) = \frac{d\sigma^2}{(1+\lambda)^2}.
    \qquad \text{(6.4.8)}

    ```


    Hence, the quadratic risk is given by


    ```

    \text{QR}(\hat{\beta}^{\text{LS-ridge}}) = \frac{d\sigma^2}{(1+\lambda)^2} + \frac{\lambda^2}{(1+\lambda)^2}
    \beta^T \beta. \qquad \text{(6.4.9)}

    ```


    We see that if \(\lambda = 0\), then the bias term is zero and the variance term
    is given by \(d\sigma^2\). As we increase \(\lambda\), the bias increases while
    the variance decreases. In the limit, as \(\lambda \to \infty\), the variance
    approaches zero while the bias converges to \(\beta^T \beta\), provided this quantity
    is bounded. This situation is also undesirable because the bias is now too large.
    The trade-off between the bias and variance is clearly evident in this equation.
    This search for the best \(\lambda\) is what we call regularization in the context
    of penalty estimators.'
