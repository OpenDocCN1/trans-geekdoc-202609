- pgno: 34
  md: 'The Gaussian distribution has a probability density function (PDF) given by


    ```

    $f_X(x) = \frac{1}{\sqrt{2\pi\sigma^2}} e^{-\frac{(x-\mu)^2}{2\sigma^2}} , \qquad
    (1.6.1)$

    ```


    where \(\mu\) is the mean and \(\sigma^2\) is the variance. A random variable,
    \(X\), is said to follow a Gaussian distribution if any sample is distributed
    according to the equation above. A more compact notation is


    ```

    $X \sim \mathcal{N}(\mu, \sigma^2). \qquad (1.6.2)$

    ```


    This is equivalent to Eq. (1.6.1) except that we are now explicitly stating that
    \(X\) is a random variable distributed as a Gaussian with mean \(\mu\) and variance
    \(\sigma^2\).


    The cumulative distribution function (CDF) of the Gaussian is defined as


    ```

    $F_X(x) = \mathbb{P}(X \le x) = \int_{-\infty}^x f_X(t)dt. \qquad (1.6.3)$

    ```


    The CDF gives the probability that a random variable \(X\) is less than a specific
    number \(x\). It is obtained by taking the integral of the PDF from \(-\infty\)
    to \(x\). The total area under any PDF is 1.0 as an axiom of probability theory.
    Therefore, the results of the integral will always lie in the range \([0, 1]\)
    as probabilities cannot exceed this range.


    We are often interested in computing probabilities from the CDF of the Gaussian
    distribution but since the integral in Eq. (1.6.3) does not have a closed form,
    we resort to lookup tables using \(z\)-scores which have a normal distribution.
    The \(z\)-score is computed as


    ```

    $z = \frac{x - \mu}{\sigma}, \qquad (1.6.4)$

    ```


    where \(z\) is the standardized value of \(x\) and \(Z \sim \mathcal{N}(0, 1)\).
    For notational convenience, we refer to the PDF of the Gaussian as \(\mathcal{N}(\mu,
    \sigma^2)\) and the CDF of the Gaussian as \(\Phi(x)\).


    The multivariate Gaussian distribution for a random variable, \(\boldsymbol{X}
    \in \mathbb{R}^d\), is denoted by


    ```

    $\boldsymbol{X} \sim \mathcal{N}_d(\boldsymbol{\mu}, \boldsymbol{\Sigma}), \qquad
    (1.6.5)$

    ```


    where \(\boldsymbol{\mu}\) is a \(d \times 1\) vector and \(\boldsymbol{\Sigma}\)
    is a \(d \times d\) covariance matrix, with the corresponding PDF given by


    ```

    $f_{\boldsymbol{X}}(\boldsymbol{x}) = \frac{1}{\sqrt{(2\pi)^d |\boldsymbol{\Sigma}|}}
    e^{-\frac{1}{2}(\boldsymbol{x}-\boldsymbol{\mu})^\top \boldsymbol{\Sigma}^{-1}(\boldsymbol{x}-\boldsymbol{\mu})},
    \qquad (1.6.6)$

    ```


    where \(\boldsymbol{\Sigma}^{-1}\) is the inverse of the covariance matrix and
    \(|\boldsymbol{\Sigma}|\) is the determinant.


    While the Gaussian distribution is invaluable in statistics, we will later discover
    that we need to move away from this elegant distribution in favor of other lesser-known
    distributions to achieve robustness.


