  md: 'which was derived in Chapter 2. Here \(\mathbf{X} \in \mathbb{R}^{n \times
    d}\) and \(\mathbf{y} \in \mathbb{R}^n\). The \(\mathbf{X}\) matrix has been standardized
    (see Chapter 4) such that the intercept is 0. Therefore, the intercept is not
    included in Eq. (5.2.1). Hence, estimates of the regression coefficients are given
    by \(\hat{\boldsymbol{\beta}}^{\text{LS}} = (\hat{\beta}_1^{\text{LS}}, \dots,
    \hat{\beta}_d^{\text{LS}})^\top\). A key requirement of this formulation is that
    the matrix \(\mathbf{X}^\top \mathbf{X}\) be invertible to produce the solution.
    Recall that \((\mathbf{X}^\top \mathbf{X})^{-1}\) is also used in constructing
    the covariance matrix so the invertibility of \(\mathbf{X}^\top \mathbf{X}\) deserves
    some discussion.


    Two potential problems may arise when applying Eq. (5.2.1). First, if \(d > n\),
    then the matrix \(\mathbf{X}^\top \mathbf{X}\) is not invertible and the parameters
    are indeterminate. This is easy to check and can be resolved by either adding
    more data points or reducing the number of parameters. Second, if any of the variables
    are linearly related, then \(\mathbf{X}^\top \mathbf{X}\) may not be invertible
    and the parameters again indeterminate. This second case gives rise to the *collinearity*
    problem, which is harder to solve.


    As a simple illustration, let \(d = 20\) such that we have 20 column vectors in
    the \(\mathbf{X}\) matrix given by \(\mathbf{x}_1, \dots, \mathbf{x}_{20}\). Further,
    assume that


    ```

    \(\mathbf{x}_7 = 2\mathbf{x}_2,\)

    \(\mathbf{x}_1 = 0.6\mathbf{x}_{11} + 0.4\mathbf{x}_4.\)

    ```


    Then, we will encounter collinearity in \(\mathbf{X}\) due to the first equation,
    since \(\mathbf{x}_2\) and \(\mathbf{x}_7\) are linearly related. Furthermore,
    we will encounter *multicollinearity*\(^1\) in \(\mathbf{X}\) due to the second
    equation, since \(\mathbf{x}_1\), \(\mathbf{x}_4\), and \(\mathbf{x}_{11}\) are
    all linearly related. The respective variables in both equations are said to be
    highly correlated and, therefore, the matrix will not be invertible for reasons
    cited above. Strong correlations between variables are manifested as large off-diagonal
    values in the covariance matrix making it harder to invert.


    Multicollinearity occurs when three or more variables exhibit a strong relationship
    even though any two variables appear not to have any correlation. If there are
    hundreds of variables, there is likely to be some form of multicollinearity. This
    is a more difficult condition to identify but may lead to instability in the parameter
    values and make interpretability of the results more challenging. Outliers could
    also play a role in this context. High-leverage observations, which are data points
    with extreme values in the predictor variables, can introduce apparent multicollinearity.
    This happens because these outliers can disproportionately influence the regression
    coefficients, making it seem like there is a linear relationship between variables
    when, in fact, this relationship is driven by the outliers. When the outliers
    are removed, the multicollinearity may disappear, revealing that the variables
    are not actually collinear in the absence of these high-leverage points. However,
    multicollinearity may still exist even in outlier-free datasets. Interestingly,
    the search for methods to address multicollinearity eventually led to the discovery
    and use of penalty functions in machine learning, often for reasons unrelated
    to this problem.


    There are several ways to determine if multicollinearity exists which we will
    not detail here. The more important point is that it is crucial for variables
    to be relatively independent of one another for accurate regression modeling.
    If the covariance matrix is diagonal, then the variables are completely independent.
    Any large off-diagonal terms are indicative of correlations between variables.
    In regression problems, the standard method to address multicollinearity is to
    somehow force the matrix to become invertible by'
