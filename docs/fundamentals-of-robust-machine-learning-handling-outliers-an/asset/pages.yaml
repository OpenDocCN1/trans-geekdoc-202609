    # ## 1.5 $L_1$ and $L_2$ Norms


    There are two vector norms that are pertinent to our discussion of traditional
    methods vs. robust methods: the so-called $L_1$-norm and $L_2$-norm. These norms
    are simply measures of the magnitude of a vector or the distance between two vectors.
    In particular, the two norms of a vector $\mathbf{v}$ with $n$ elements are given
    as follows:


    $L_1 = \|\mathbf{v}\|_1 = \sum_{i=1}^n |v_i| = |v_1| + |v_2| + ... + |v_n|,$'
