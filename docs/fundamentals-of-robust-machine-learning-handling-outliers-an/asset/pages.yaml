    # 10.4.1 Momentum


    There are a number of different ways to speed up the training process. One simple
    way is to adjust the learning rate, $\ell$. The number of iterations needed to
    reach an acceptable level of accuracy is controlled by the learning rate. If $\ell$
    is too large, convergence may not occur due to oscillations from one iteration
    to the next. If $\ell$ is too small, the rate of convergence can be very slow
    which implies a large number of iterations. Therefore, adaptive learning rate
    adjustment is a requirement in neural networks. A general rule is to reduce the
    learning rate as the minimum is approached.


    The more important issue to be addressed is oscillations in the gradients in one
    or more dimensions in the optimization space, which slows down convergence. If
    we damp out the oscillations by averaging the gradients over several past iterations,
    it would allow for a more rapid convergence. A method called gradient descent
    with momentum does exactly that. It makes use of the history of gradients for
    each parameter using a weighted average of some number of past gradients. It is
    a smoothing mechanism that prevents wild fluctuations in the gradients which allows
    larger learning rates to be used.


    Momentum works by taking a combination of the past gradients and the latest gradient
    to produce an exponentially weighted moving average using the following equation:


    ```

    $m_{dw}^{(t+1)} = \alpha_1 m_{dw}^{(t)} + (1 - \alpha_1) \left( \frac{dJ(w)}{dw}
    \right)^{(t)} \quad (10.4.2)$

    ```


    Basically, the latest gradient is scaled by $(1 - \alpha_1)$ and added to the
    previous history of gradients $m_{dw}^{(t)}$ which is scaled by $\alpha_1$, where
    $\alpha_1 \in [0, 1]$. The rolling exponentially weighted average is used to update
    the parameters. The smoothing parameter, $\alpha_1$, controls the number of gradients
    used from past iterations in the averaging process and is typically set to 0.9.
    For example, with $\alpha_1 = 0.9$, the last 9 gradients are'
