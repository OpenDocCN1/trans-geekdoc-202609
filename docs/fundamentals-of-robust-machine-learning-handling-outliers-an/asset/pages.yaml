    # ## 8.10 Robustness of Binary Classifiers


    In the realm of binary classification, a number of other methods are available
    that have been routinely used in practice for several decades. However, they have
    not been fully investigated in terms of their robustness to outliers. In this
    section, we review these methods, including SVMs, _k_-nearest neighbors (_k_-NN),
    and decision trees to illustrate to what degree they may be impacted by outliers.
    We begin with the SVC and conclude the section by examining the random forest
    method.


    # ### 8.10.1 Support Vector Classifier (SVC)


    A large margin classifier is one that places a decision boundary that is maximally
    distant from points in Class 0 and Class 1, assuming the data is linearly separable
    and no outliers exist. We already saw this property in LCLR but not in CELR. Other
    binary classifiers also possess this property, specifically the SVC which is the
    subject of this section. To develop intuition about SVCs, recall the regularized
    version of CELR given earlier as


    ```

    J^{\text{CELR-ridge}}(\boldsymbol{\beta}) = \frac{1}{2} \sum_{j=1}^d \beta_j^2
    - C \sum_{i=1}^n [y_i \log p_i + (1 - y_i) \log(1 - p_i)],

    ```


    where _C_ is the regularization hyperparameter. If we want to change the characteristics
    of this classifier, we simply need to choose a different loss function, which
    is the term after _C_ (i.e. the cross-entropy loss in this case).


    To understand SVC, consider the diagram in Figure 8.18 where a linearly separable
    dataset is shown. If the goal were to find a decision boundary with the maximum
    margin size, the result would be the dark line shown. The so-called margins are
    represented by the dotted lines on each side. Any points that lie on the margins
    are called _support vectors_,<sup>2</sup> labeled as **SV**. The size of the margin
    is \(2/||\boldsymbol{\beta}||_2\), where \(\boldsymbol{\beta}\) is value


    <sup>2</sup> The term “vector” is derived from the simple fact that all **x**_<sub>i</sub>_
    can be viewed as vectors in the _d_-space.'
