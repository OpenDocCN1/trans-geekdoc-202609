  md: '# # 6 Robust Regularized Models


    # ## 6.1 Introduction


    When building a model using machine learning, there is a concerted effort to balance
    the possibilities

    of overfitting and underfitting on a given dataset. This issue has its roots in
    the bias–variance trade-off.

    In this chapter, we explore the details of this trade-off and then examine the
    effects of outliers on the

    standard procedures used in model building to generalize the results. This chapter
    is a companion to the

    previous chapter and covers a number of practical regularization techniques that
    can be used to build bet-

    ter models. One of the key questions to be answered is regarding the selection
    of the \(\lambda\) hyperparameter

    associated with the penalty functions. The overall goal is to produce a compact,
    robust model that gener-

    alizes to unseen test datasets when outliers are present. This involves feature
    selection, penalty functions,

    and/or the application of _k_-fold cross-validation, all of which will be described.


    The chapter begins with illustrations of overfitting and underfitting in linear
    regression problems.

    Then, an in-depth study of the bias–variance trade-off is provided as it pertains
    to choosing the optimal \(\lambda\).

    This is followed by the effect of outliers in datasets when they are divided into
    training and test sets. Next,

    penalty estimation with various cross-validation schemes will be described as
    methods of generalization.

    We also address the question of whether generalization procedures can mitigate
    the effects of outliers. The

    application of penalty functions to the task of feature selection is also described.
    In this case, the objective

    is to select the best subset of the available features. A methodology is described
    that combines robust

    penalty estimation with feature selection to find a compact model with good overall
    prediction accuracy.


    # ## 6.2 Overfitting and Underfitting


    An illustration of overfitting and underfitting in linear regression is provided
    in Figure 6.1. A simple way

    to understand overfitting is “too many parameters” for the given data. For underfitting,
    it can be viewed

    as “too few parameters” for the given data. For example, in the left panel of
    Figure 6.1, the data fitting is

    carried out using linear regression with a polynomial expansion of variable _x_.
    In particular, if we expand

    the parameter space using _x_, _x_<sup>2</sup>, _..._, _x_<sup>9</sup>, then a
    solution can be produced that follows the data quite closely

    leading to a small error. The regression model for this case is


    ```

    \(\boldsymbol{y} = \beta_0 + \beta_1 x + \beta_2 \boldsymbol{x}^2 + \cdots + \beta_9
    \boldsymbol{x}^9 + \epsilon.\) (6.2.1)

    ```'
