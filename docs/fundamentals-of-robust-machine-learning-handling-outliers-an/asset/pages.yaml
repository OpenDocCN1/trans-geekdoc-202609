- pgno: 208
  md: '# 7


    # Quantile Regression Using Log-Cosh


    # 7.1 Introduction


    We have studied the log-cosh loss function in Chapter 3 as a way of resolving
    the problems of the _L_<sub>1</sub> loss function. It was shown to be a robust
    approach for linear regression and useful for other tasks in machine learning
    such as outlier detection. In simple linear regression, the log-cosh loss establishes
    a median line through the points in a dataset. As we know, the median line represents
    the 50th percentile of a given set of data points, dividing it in half: 50% of
    the points lie above the line and the remaining 50% below it. However, what if
    we are interested in other quantiles? For instance, rather than the 50th percentile,
    what if we want to find the line associated with the 25th percentile (also known
    as the first quartile)? In this case, 25% of the points would lie below the line,
    while the remaining 75% would be above it. Similarly, what about the lines associated
    with the 10th or 20th percentiles (called deciles)?


    Methods for obtaining such lines associated with a desired percentile, decile,
    or quartile are referred to collectively as quantile regression (see Koenker and
    Bassett 1978; Koenker 2005). This chapter focuses on quantile regression which
    has been successfully applied to problems in econometrics, as well as in survival
    analysis and computational biology. The method is well established in these areas
    and is naturally robust to outliers. However, there exists a known problem with
    the original approach to quantile regression: the so-called crossing problem.
    This issue is widely recognized and understood to be troublesome. Specifically,
    it refers to the lack of monotonicity in the estimation of the conditional and
    structural quantile functions. Unfortunately, the crossing problem has confounded
    researchers and practitioners for over four decades. Numerous attempts have been
    made to find a simple and general solution.


    To tackle this challenge, an intriguing alternative lies in the log-cosh function.
    This flexible function offers a solution that is easy to understand and implement.
    The basic idea is to replace the piecewise linear quantile loss function with
    a smooth log-cosh counterpart. This approach, akin to what was done in Chapter
    3 for the _L_<sub>1</sub> loss, greatly reduces or even eliminates the crossing
    problem entirely.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# ## 7.2 Understanding Quantile Regression


    At a very basic level, quantile regression serves as a natural extension of robust
    linear regression. Unlike the usual form of robust regression, which seeks a single
    line dividing the data in half, quantile regression allows us to divide the data
    using any desired percentile, decile, or quartile. The term “quantile” encompasses
    all possible cases and is typically specified as a value between 0.0 and 1.0.


    Consider Figure 7.1, which displays a scatter plot of a dataset along with different
    regression lines representing various quantiles. Notably, the data exhibits heteroscedasticity—a
    phenomenon where the spread of data widens like a cone as the explanatory variable
    increases. This implies that the variance increases proportionally. Such heteroscedasticity
    has implications for the quality and reliability of statistical procedures. In
    standard regression, we assume homoscedasticity, meaning that the standard errors
    remain consistent as we move along the x-axis. However, this assumption may not
    hold in cases like the one in Figure 7.1. Quantile regression, with its flexibility,
    becomes well suited for addressing such issues, as a single regression line may
    not adequately capture the true characteristics of the data.


    Each set of estimates from a quantile regression produces a line in Figure 7.1
    that divides the data based on the specified value of a quantile parameter \(\tau
    \in [0, 1]\).


    +   - For \(\tau = 0.0\), we obtain the 0th percentile line located just below
    all the data points.

