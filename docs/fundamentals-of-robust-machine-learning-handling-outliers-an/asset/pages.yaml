    # 3.7 Statistical Properties of Log-Cosh Loss


    In this section, we derive the maximum-likelihood estimator (MLE) to understand
    the statistical properties

    of the log-cosh estimator. For readers who prefer to skip the detailed mathematical
    explanations, you

    may proceed to the next section without loss of continuity in the overall subject
    matter. While it may not

    be critical to machine learning to understand this material, it is useful to know
    some of these key prop-

    erties when comparing one estimator against another and to carry out further mathematical
    analysis.


    # 3.7.1 Maximum-Likelihood Estimation


    Let us begin by deriving the log-cosh estimator for a location parameter \(\theta\)
    starting with the probability

    distribution. If \(x_1, x_2, \dots, x_n\) are i.i.d. random variables drawn from
    the distribution,


    ```

    \(f(x; \theta) = \frac{1}{\pi \sigma \cosh(\frac{x_i - \theta}{\sigma})},\) (3.7.1)

    ```


    then the likelihood function is given by:


    ```

    \(L(x_1, x_2, \dots, x_n; \theta) = \prod_{i=1}^n \frac{1}{\pi \sigma \cosh(\frac{x_i
    - \theta}{\sigma})}.\) (3.7.2)

    ```'
