    # ## 12.2.4 Predicting Housing Prices


    We now have a model based on the 546 parameters generated using the neural network.
    This model can be used to predict the price of any new house that is up for sale
    in the same region. For our purposes, we can predict the prices for the original
    dataset and compare the predictions against the original prices. The predictions
    are based on the model from the third column of Table 12.2. This is shown in Figure
