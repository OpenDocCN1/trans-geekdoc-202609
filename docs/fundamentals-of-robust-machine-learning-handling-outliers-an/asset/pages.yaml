    Figure 9.5 Back propagation in a two-layer neural network. In this example, $w_3,
    w_{23}$, and $b_0$ are to be computed using backprop.


    In order to produce the full set of gradients during backward propagation, we
    must compute a gradient for every parameter inside the network with respect to
    the loss function. More specifically, starting with the loss function at the output,
    we must produce five gradients for layer 2, i.e. one for each of the weights $w_1,
    ..., w_4$, and one for the bias, $b_0$. For layer 1, eight gradients must be computed
    for weights $w_{11}, w_{12}, w_{13}, ..., w_{24}$, and four gradients for biases
    $b_1, b_2, b_3$, and $b_4$. The weights and biases are organized as matrices and
    vectors for ease of storage and retrieval, and to facilitate vectorized computations.
    A total of 17 gradients are needed for this small network but the question becomes,
    how do we scale this up for a large neural network with many layers to enable
    deep learning?


    Back propagation is a formalized procedure to compute the vectors and matrices
    of gradients by starting at the output of the neural network and working backwards
    to the input, hence its nickname, backprop. The basic idea of backprop is to use
    the chain rule to systematically compute the gradients. We simply need to apply
    it recursively as we traverse the entire network backwards. However, the number
    of paths grows exponentially as the number of layers increases and this type of
    computation along all paths would make deep learning unfeasible. To address this
    problem, the backprop algorithm stores data during a forward propagation setup,
    and then re-uses that stored data, and any newly computed data, during backward
    propagation to compute the gradients. In other words, the backprop algorithm is
    a very efficient way to store and retrieve partial data when computing gradients.
    This is what makes deep learning computationally feasible.


    # 9.5.1 Forward Propagation


    During forward propagation, an input $\mathbf{x}_i$ is applied to the neural network
    and propagated to the output to produce $p_i$, as in Figure 9.5. This is accomplished
    through a series of matrix–vector computations'
