    ask another question: “if a new point is introduced at wt = 2.5 and hp = 90, what
    class does it belong to?” and the answer would come back as “it belongs to the
    ‘x’ class.” A large portion of the supervised machine learning tools involve this
    type of classification.


    # 1.3.2 Effect of Outliers


    Now consider the effect of outliers on the two cases above. This is shown in Figure
    1.3. On the left side, there is one new data point which is an outlier. The effect
    on traditional linear regression is to shift the line and make it more horizontal
    than in Figure 1.2. Now if the question is asked, “what is the expected sales
    for year = 1968?,” the answer comes back as “sales = 6.5” which is not accurate.
    Apparently, the one outlier has produced misleading results. If used to make a
    business decision, this outlier may prove to be very costly.


    ![](img/f26d7f591c2a080d86425985301266a4_27_0.png)'
