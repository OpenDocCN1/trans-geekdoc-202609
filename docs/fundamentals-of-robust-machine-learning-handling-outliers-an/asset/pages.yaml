    # 1.3.1 Machine Learning Basics


    Before launching into the key ideas of this book, it is useful to provide some
    background material on ML and robust methods. ML grew out of the computer science
    field in the 1980s but went dormant for a time in the 1990s, during which it was
    viewed as a dead-end field. It experienced a reawakening around 2000'
