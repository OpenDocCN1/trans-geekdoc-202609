- pgno: 105
  md: 'The negative log-likelihood expression is given by


    \(-\ell(x_1, x_2, \dots, x_n; \theta) = n \log \pi\sigma + \sum_{i=1}^n \log \left(
    \cosh \left( \frac{x_i - \theta}{\sigma} \right) \right) . \quad (3.7.3)\)


    Assume we are interested in estimating \(\theta\). Then, after removing the constant
    term, the estimator \(\hat{\theta}\) can be written as


    \(\hat{\theta}^{\text{LC}} = \operatorname{argmin}_{\theta \in \mathbb{R}} \sum_{i=1}^n
    \log \left( \cosh \left( \frac{x_i - \theta}{\sigma} \right) \right) . \quad (3.7.4)\)


    Since the log-cosh estimator was derived using MLE and assumes some mild regularity
    conditions, we find that asymptotic normality holds. That means that the uncertainty
    around the estimates will follow a Gaussian distribution. More formally (using
    the notation given in Section 2.5.2), as \(n \to \infty\), the Central Limit Theorem
    tells us that


    \(\sqrt{n} \left( \hat{\theta}^{\text{LC}}_n - \theta \right) \xrightarrow{D}
    \mathcal{N} \left( 0, \operatorname{Var} \left( \hat{\theta}^{\text{LC}}_n \right)
    \right) , \quad (3.7.5)\)


    where \(\operatorname{Var}(\hat{\theta}^{\text{LC}}_n)\) is the asymptotic variance
    which can be derived⁵ to obtain \(2\sigma^2\). Hence, we find the distribution
    of \(\hat{\theta}^{\text{LC}}\) is


    \(\hat{\theta}^{\text{LC}}_n \sim \mathcal{N} \left( \theta, \frac{2\sigma^2}{n}
    \right) . \quad (3.7.6)\)


    We can also state that the MLE estimator of \(\theta\) is consistent such that


    \(\hat{\theta}^{\text{LC}}_n \xrightarrow{\text{P}} \theta \quad (3.7.7)\)


    and that the asymptotic bias is


    \(\text{bias} = \mathbb{E}[\hat{\theta}^{\text{LC}}_n] - \theta = 0 .\)


    That is, the log-cosh estimator of \(\theta\) is unbiased. In summary, the log-cosh
    estimator has all the nice properties of least squares but is robust to outliers.


    # 3.8 A General Log-Cosh Loss Function


    There is one more improvement needed to the log-cosh loss to make it a superior
    robust method and that is the subject of this section. We begin with the standard
    loss term using M-estimation notation,


    \(\rho(x) = \log(\cosh(x)) , \quad (3.8.1)\)


    and its derivative,


    \(\psi(x) = \tanh(x) . \quad (3.8.2)\)'
