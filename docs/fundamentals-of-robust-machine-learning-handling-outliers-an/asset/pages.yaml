- pgno: 59
  md: 'An important point to mention here is that estimates inherently have some amount
    of uncertainty associated with them. More specifically, they have a variance which
    is a measure of the uncertainty around the estimates. Different estimators have
    different variances, and we seek ones that have small variances. Further, there
    are many ways to estimate parameters, so we should not view any one estimator
    as the gold standard but rather as one of many options for the application at
    hand. There are many trade-offs to consider, and variance is just one of the factors.
    Another factor is robustness to outliers. The well-known ordinary least squares
    (OLS) method seeks the mean of the data to obtain the estimates. However, it is
    not robust. Methods that seek the median of the data are robust since they are
    tolerant to outliers. The goal of this chapter is to illustrate why the median
    is so important in robust regression.


    > Notation: Estimates always use the “hat” notation from statistics. For example,
    if β₀ is the true intercept, then β̂₀ is the estimate of the intercept. If β₁
    is the true slope, then β̂₁ is the estimate of the slope. Similarly ŷ is the predicted
    response using the parameter estimates. For a multidimensional problem, we use
    a bold version, i.e. β or β̂ as the case may be. Sometimes θ will be used as a
    scalar parameter of interest in one-dimensional problems, such as the location
    problem, and θ̂ is the estimate.


    # 2.4 Importance of Residuals


    In this section, we discuss the errors made by a model relative to the original
    data used to build the model. These errors can be computed after using regression
    and are called **residuals**. They play an important role in defining loss functions,
    selecting a loss function based on their probability distribution, and in outlier
    detection. Therefore, we will spend some time to understand what they are and
    why they are important.


    # 2.4.1 Defining Errors and Residuals


    Observe that, on the right panel of Figure 2.2, the regression line does not necessarily
    go through all the points or any of the points in the data. This is typical of
    the results of linear regression. The regression line is actually a summary of
    the data so that prediction can be performed. There is a vertical distance between
    the original points and the line. The vertical differences are referred to as
    **residuals** and their distribution plays a key role in defining the loss function,
    as we shall see shortly. Figure 2.2 on the right panel highlights the set of residuals
    for this dataset as vertical bars between the regression line and the data points.


    If we include errors in the equation given earlier for a line, it can be rewritten
    to accurately reflect the relationship between the data and the line. This gives
    rise to the simple linear model, which takes the form


    ```

    **y** = β₀ + β₁**x** + ε, (2.4.1)

    ```


    where ε represents the errors between the **true line** and the data points. These
    errors arise due to a variety of sources such as effects unaccounted for in our
    model or random noise in the system. There is valuable information within the
    errors and their distribution that will lead us to the right type of estimator.'
