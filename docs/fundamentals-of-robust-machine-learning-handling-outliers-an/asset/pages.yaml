  md: '# 12 Case Studies in Data Science


    # 12.1 Introduction


    In this chapter, we consider robust data science using the algorithms and procedures
    described in the previous chapters. The focus here is to compare the log-cosh
    (LC) methods with the traditional log-likelihood methods, namely least squares
    (LS) and cross-entropy (CE), using two well-known datasets. In particular, we
    compare the competing approaches on linear regression, logistic regression, and
    neural networks. Examples include the Boston Housing and Titanic datasets. Data
    science problems of model building, prediction, and feature importance are addressed
    in the context of datasets with outliers. In each case, an outlier-centric approach
    is taken to demonstrate the enormous advantages of conducting data science in
    this manner. In addition, future directions for work in this area are described,
    namely, time series analysis of climate change and explainable artificial intelligence
    (XAI).


    # 12.2 Example: Boston Housing Dataset


    The Boston Housing dataset was used throughout this book to evaluate and compare
    different forms of machine learning. The dataset itself has 506 observations with
    13 explanatory variables that factor into the median home prices in the Boston
    area, circa 1970–1975. The response variable and the 13 explanatory variables
    were all defined in Chapter 6. It is of particular interest to us in this book
    because it is also known to have many outliers. Housing prices vary considerably
    in an area or region and therefore the median price is often quoted, rather than
    the average price or a specific price, to account for outliers. For the moment,
    assume that the actual number of outliers is unknown but their existence is known.
    The question is, how do we handle a dataset when we know it may have potentially
    harmful outliers?


    Three data science tasks will be carried out using this dataset. The first is
    to perform exploratory data analysis (EDA) to understand the dataset in some detail.
    The second is to build an accurate, compact model for prediction purposes, as
    was the case for most of the problems in this book. With the model, it will be
    possible to predict the median price of any home in the region provided that the
    needed information in terms of the explanatory variables is given. The model will
    be generated using linear regression'
  merge: -1
  img_proc: true
