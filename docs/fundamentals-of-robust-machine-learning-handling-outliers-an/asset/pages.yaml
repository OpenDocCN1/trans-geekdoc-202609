    # 6.7 Model Complexity


    The complexity of a model generally refers to the number of parameters used by
    the model. A model with only a few parameters is a low-complexity model, and one
    with a large number of parameters is a high-complexity model. It is a goal in
    data science to produce a model that uses the fewest variables while still retaining
    high predictive power. There are many reasons for this. One is that fewer variables
    produce'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'a more compact model which is highly desirable to avoid overfitting. It is
    also easier to assess their relative importance if there are fewer of them. The
    second issue is that there are variables that add noise to the model, and it is
    preferable to remove these variables. Third, and perhaps more subtly, the variance
    of the residuals (which ideally should be small) can be large if there are too
    many variables in the model. To understand this point, consider the unbiased estimator
    of residual variance which is given by


    \(\hat{\sigma}^2 = \frac{1}{n - (d + 1)} \sum_{i=1}^n (r_i - \bar{r})^2.\) (6.7.1)


    As \((d + 1)\) approaches \(n\), the residual variance goes to infinity. Hence,
    keeping \(d\) small will reduce the variance of all parameters because they all
    depend on \(\hat{\sigma}^2\).


    In effect, we have another bias-variance trade-off involving the number of variables
    in our model. If we have too many variables, we risk overfitting the dataset and
    that leads to a high variance. If we have too few variables, we risk underfitting
    which creates a high bias situation. Our next objective will be to seek the optimal
    number of variables using some form of feature selection.


    # 6.7.1 Variable Selection Using LS-LASSO


    One useful application of penalty functions involves using the LASSO penalty to
    select the optimal number of parameters. The diabetes dataset will be used to
    demonstrate the procedures. It has 10 variables, namely, s1, s2, s3, s4, s5, s6,
    age, bmi, bp, and sex. With domain knowledge, the relative importance of each
    variable may already be known. However, the approach to be described can be used
    with or without domain knowledge. The first step is to generate the LS-LASSO traces
    as shown in Figure 6.10. In contrast to the LS-ridge traces, the LS-LASSO traces
    all terminate abruptly on the \(\lambda\)-axis. The zero points are indicated
    with a "\(\bullet\)" for each parameter. By selecting a suitable \(\lambda\),
    a subset of the variables can be removed. This is how it is able to perform variable
    selection by setting some variables to 0.


    To clarify the procedure, if a vertical line is drawn at \(\lambda = 0.25\) on
    the LS-LASSO traces, then any variable to the left of the line can be removed,
    while those on the right are kept. In this case, s1, age, s2, s4, and s6 are all
    set to 0, meaning that they are removed from the model. By doing so, a compact
    model is produced for the diabetes dataset involving only s3, s5, bp, bmi, and
    sex. The LS-ridge traces do not provide this ability since all variables tend
    to reach 0 gradually rather than abruptly (cf. see Figure 6.3).


    # 6.7.2 Variable Ordering Using LC-aLASSO


    There are many different ways to assess variable importance but most of them rely
    on an outlier-free dataset. For example, the adjusted-R\(^2\), BIC, AIC, and \(C_p\)
    metrics used for subset selection (see James et al. 2023)\(^5\) require either
    the mean or the standard deviation, which are not robust. Therefore, we suggest
    removing outliers (see Chapter 4) before using these techniques. Another approach
    is to use the absolute value of the t-statistic (see Chapter 5) obtained from
    an LC linear regression. In this section, we describe an alternative method using
    an oracle penalty function, specifically aLASSO. This method provides a visualization
    of variable ordering using penalty traces (see Saleh et al. 2022).'
