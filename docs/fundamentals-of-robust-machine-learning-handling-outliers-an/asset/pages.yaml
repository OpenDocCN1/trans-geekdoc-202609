  md: '# # 2 Robust Linear Regression


    # ## 2.1 Introduction


    Supervised learning is the most common form of machine learning (ML) and will
    be covered extensively in the rest of the book. As linear regression is the simplest
    form of supervised learning, it serves as a launching point to understand this
    category of ML in a familiar setting. The subject of linear regression has been
    thoroughly studied over many decades and is widely used in many applications in
    data science. In fact, it predates ML itself. Our goal here is to address linear
    regression from the perspective of **outliers** in the data, covering the essentials
    needed for our study of robust methods.


    In this and the next chapter, we will be describing a number of different estimators
    for robust linear regression. In this context, we need to understand how to derive
    these estimators and provide mechanisms to compare them against one another. Several
    different criteria will be presented to assess which one performs best and under
    what conditions. The chapter begins with a brief tour of the techniques and issues
    associated with linear regression. Then we will make the case for robust regression
    using Huber’s method and identify certain shortcomings of the approach. This will
    lead to an alternative approach to be presented in Chapter 3. Once the basics
    of robust linear regression are understood, it can be applied to more advanced
    ML methods such as quantile regression, logistic regression, and neural networks
    in subsequent chapters.


    # ## 2.2 Supervised Learning


    Supervised learning takes on a variety of different forms because there are a
    wide variety of suitable applications for machine learning. Typical applications
    include predicting the value of a home in a certain region of the country given
    the housing data associated with that region; or deciding who should get a loan
    based on the loan history of existing and previous customers; or recognizing handwritten
    digits from 0 to 9 based on a large dataset of labeled digits. The applications
    are endless and the techniques used in supervised machine learning are, in turn,
    quite diverse.


    The basic idea in supervised learning is to use a set of data to build a model
    with predictive power. This is the value proposition of machine learning: take
    a training set, possibly with noise, define a suitable'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'model, estimate the model parameters (i.e. train the model), and use this parameterized
    model to make predictions on test data with (hopefully) a high degree of accuracy.
    Since we do not know the true value of the parameters, the best we can do is estimate
    them using some well-grounded mathematical procedures and the given data. This
    leads to the development of suitable estimators, the functions that will allow
    us to carry out the estimation.


    Estimates are the numerical values of the parameters produced by an estimator.
    Naturally, we want to find the best parameter values that fit the data closely
    so that the model is able to make good predictions. But how do we know if it is
    a good model if outliers are present? We need to check the accuracy using an unseen
    test set with a known ground-truth to validate the whole process. The overall
    goal in this book is to develop robust models for both regression and classification
    such that outliers in the dataset do not adversely affect the prediction results
    and we want to eventually apply these methods to neural networks (see Chapters
    9 and 10). However, understanding the principles of neural networks begins with
    an in-depth study of linear regression and logistic regression. The study of advanced
    ML methods is built on top of these fundamentals, so it is important to fully
    understand these topics on our journey toward robust ML.


    # # 2.3 Linear Regression


    Assume we are given a pair of vectors, x and y, and asked to fit a line to the
    data by computing its slope and intercept based on the data. For n observations,
    we usually write x \in R^n to denote a real vector with n elements associated
    with the explanatory variable, and y \in R^n to denote the vector associated with
    the response variable. The data is composed of a set of (x_i, y_i) pairs, with
    i = 1, ..., n. A suitable model for the data in this case is a straight line.
    We could try to fit a more complex curve to the data but assume we have a priori
    knowledge that there is a linear relationship between the x and y values so we
    need to fit a line to the data. Therefore, the objective in linear regression
    (see Montgomery et al. 2012) is to estimate the slope and intercept of the line
    that best fits the data.


    Figure 2.1 shows a scatter plot of the points with the two parameters of interest
    labeled on the line. The true line (which is unknown to us) is given by a well-known
    equation,


    ```

    $y = \beta_0 + \beta_1 x,$ (2.3.1)

    ```


    where $\beta_0$ is the intercept and $\beta_1$ is the slope. Unfortunately, it
    is not possible to find the exact values of these two parameters unless we have
    access to the entire population. The best we can do is estimate $\beta_0$ and
    $\beta_1$ from a given sample of the population. This is the purpose of linear
    regression.


    An estimator tries to minimize a loss function to produce an optimal set of estimates
    of the parameters. This is usually carried out using a numerical optimization
    method such as gradient descent. A loss function is essentially a cost function
    that evaluates the total error associated with specific values for the slope and
    intercept. Of course, if we could somehow compute the exact parameter values,
    they would not be considered as estimates. But since we will only have access
    to a finite amount of data (i.e. a finite sample set), the parameter values we
    produce must be viewed as estimates. Once we estimate the two parameters, now
    denoted as $\hat{\beta}_0$ and $\hat{\beta}_1$ to distinguish them from the true
    values, we can use


    ```

    $\hat{y} = \hat{\beta}_0 + \hat{\beta}_1 x$ (2.3.2)

    ```'
