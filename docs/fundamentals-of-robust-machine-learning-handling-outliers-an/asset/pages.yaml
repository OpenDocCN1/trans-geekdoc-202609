    # ## 11.5 Quantitative Evaluation Methods


    To develop quantitative metrics to compare different outlier detectors, the concepts
    described in Section 9.8 of Chapter 9 can be used as a starting point. The first
    step is to tabulate the results of an anomaly detector based on whether or not
    outliers and inliers were properly categorized. The definitions are provided in
    Table 11.2. If a true outlier is detected by an anomaly detector, it is considered
    a true positive (tp). If an inlier is erroneously considered an outlier, that
    is a false positive (fp). If an outlier is erroneously considered an inlier, that
    is a false negative (fn). Finally, if an inlier is declared to be an inlier, that
    is a true negative (tn). In evaluating the results of an anomaly detector, the
    recall and precision are both good metrics. The **precision** expresses what percentage
    of outliers detected by the anomaly detector are actually outliers. Typically,
    there is a preference for anomaly detectors with a higher precision. The **recall**
    expresses what percentage of the true outliers is detected by the anomaly detector.
    Together, these two metrics can be used as the initial quantitative assessment
    of the anomaly detector.


    The **AUROC** can also be used to compare different approaches by plotting the
    true positive rate (TPR) against the false positive rate (FPR). Unlike the binary
    classification case, the meanings of true positive and false positive refer to
    whether or not an outlier was detected properly. As before, it is possible to
    plot the ROC curves to compare different detectors visually. However, for outliers,
    the plot is a sequence of steps (resembling an uneven staircase) with the number
    of steps equal to the number of outliers. Because of this, we use a different
    approach than for binary classification when computing the AUROC metric. Specifically,
    if we rank the outliers and inliers using their anomaly scores, we can formulate
    a compact equation for AUROC as follows,


    ```

    AUROC = 1.0 - \frac{\sum_{i=1}^M (\text{rank of outlier } i) - M(M + 1)/2}{M \times
    N},\quad (11.5.1)

    ```


    where \( N \) is the number of inliers and \( M \) is the number of outliers.


    Table 11.2 Interpretation of confusion matrix for outliers. The four possible
    outcomes of tn, fn, tp, or fp are accumulated in this tabular format from the
    ground truth and detected outliers.


    | | True Inlier | True Outlier | Interpretation of Matrix Entries |

    |---|---|---|---|

    | Detected-Inlier | tn | fn | tn = true negative, fn = false negative |

    | Detected-Outlier | fp | tp | fp = false positive, tp = true positive |'
