- pgno: 62
  md: 'These two functions are directly related to one another. If we know the CDF,
    we can obtain the PDF by differentiation:


    $f_X(x) = \frac{dF_X(x)}{dx}$.

    (2.4.7)


    Likewise, if we know the PDF, we can integrate to obtain the CDF. That is,


    $F_X(x) = \mathbb{P}(X \le x) = \int_{-\infty}^x f_X(t)dt$.

    (2.4.8)


    Recall that the Gaussian distribution has a PDF given by:


    $f_X(x) = \frac{1}{\sqrt{2\pi\sigma^2}} e^{-\frac{x^2}{2\sigma^2}}$

    (2.4.9)


    where \(\sigma^2\) is the variance. A random variable, \(X\), is said to follow
    a Gaussian distribution if any sample of \(X\) is distributed according to the
    equation above. The compact notation used for random variable \(X\) following
    a Gaussian distribution is


    \(X \sim \mathcal{N}(0, \sigma^2)\).

    (2.4.10)


    Here, the \(\mathcal{N}\) symbol refers to the normal distribution and, inside
    the parentheses, 0 is the mean and \(\sigma^2\) is the variance. In some sense,
    both Eq. (2.4.9) and Eq. (2.4.10) are saying the same thing; one is just a compact
    version of the other. The normal distribution is important for a variety of reasons
    but for our purposes, it leads to the \(L_2\) loss function which is not tolerant
    to outliers.


    Another important but less well-known distribution is the Laplace distribution,
    which is commonly referred to as the double-exponential distribution. The basic
    form is given by


    $f_X(x) = \frac{1}{2} e^{-|x|}$.

    (2.4.11)


    The interesting part for our purposes is that this distribution leads us to the
    \(L_1\) loss function which is tolerant to outliers in the dataset. For this reason,
    we will be encountering this distribution several times in this and other chapters.


    The distribution of well-behaved errors is usually taken to be \(\epsilon \sim
    \mathcal{N}(0, \sigma^2)\). That is, the mean is always zero but the variance
    may differ from dataset to dataset. The tacit assumption is that the residuals
    of linear regression follow a Gaussian distribution. Outliers cause the distribution
    to depart from this standard assumption which is why robust methods, involving
    the use of the \(L_1\) loss, are considered. This is a subtle but important point.
    If the residuals are not normally distributed, then robust methods are likely
    to produce better results.


    Two quantities of great interest when working with probability distributions are
    the expected value and the variance. The expected value of \(X\) is the first
    moment of the PDF, given by


    \(\mathbb{E}[X] = \int_{-\infty}^{\infty} x f_X(x) dx\).

    (2.4.12)


    We use the notation \(\mathbb{E}[X]\) for convenience to represent this integral.
    It can be viewed as the expected value operator \(\mathbb{E}[\cdot]\) acting on
    \(X\). In simpler terms, this is the value you would expect if you ran an experiment
    of independently selecting \(X\) a large number of times (approaching infinity)
    and then taking the average.'
