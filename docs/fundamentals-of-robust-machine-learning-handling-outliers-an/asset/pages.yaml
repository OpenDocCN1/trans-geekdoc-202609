- pgno: 232
  md: '# # 8 Robust Binary Classification


    # ## 8.1 Introduction


    This chapter addresses machine learning algorithms for binary classification.
    The fundamental concept involves analyzing a dataset where the combined values
    of the explanatory variables lead to one of two possible outcomes, which are referred
    to as classes. The objective is to establish a boundary that separates the two
    classes. Predictions are made by adding new data points and assessing their positions
    relative to the boundary to determine class affiliation. While the idea may seem
    straightforward conceptually, there are many ways to address the problem, and
    the theory and its practical implementation can be quite complex. However, it
    becomes interesting at this stage because logistic regression (see James et al.
    2023), one of the techniques employed, shares many characteristics with linear
    regression, which has been thoroughly explored earlier in this book.


    We begin this chapter with a detailed treatment of logistic regression which is
    a well-known approach to binary classification. Then, we modify it to use robust
    techniques based on the log-cosh loss function, unveiling its untapped potential
    for data science and machine learning applications. Specifically, we compare the
    robust log-cosh method with the conventional cross-entropy approach, highlighting
    their advantages and inherent limitations. This discussion sets the stage for
    a subsequent exploration of neural networks in Chapter 9, making it crucial to
    grasp the foundational concepts presented here.


    There are several other well-known approaches to binary classification. Some are
    robust to a certain degree (but not relative to outliers) while others are truly
    robust (but still require some tuning to obtain acceptable results). Our main
    interest here is to evaluate their degree of robustness. We first develop the
    insights that lead to the support vector classifier (SVC). Then we extend the
    concepts learned to the support vector machine (SVM). SVMs are considered to be
    among the best large-margin classifiers. This method, developed by the computer
    science community, is not based on fundamental statistics or any known distributions,
    but it has emerged as an important classification method. Then, we take a look
    at the robustness characteristics of k-NN and finish with tree-based methods.


    All the traditional methods have been widely studied and documented in the literature.
    Therefore, we will not go into great depth here. The primary goal of this chapter
    is to broaden the reader’s understanding of the importance and advantages of robust
    methods in binary classification.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 8.2 Binary Classification Problem


    Binary classification is a machine learning problem whereby a given set of data
    falls into one of two possible classes with the goal of finding a suitable decision
    boundary, either linear or nonlinear, that acts to separate members of one class
    from the other. As an example, let us consider a bank that is issuing loans and
    wants to classify each potential customer as either eligible for a loan or not,
    based on data from existing and previous customers. This is a classic binary classification
    problem since we want to identify the characteristics of customers who tend to
    pay back loans as the criteria for giving out future loans. Our target group would
    be those who received loans and paid them back, labeled as being in Class 1, and
    the alternate group would be composed of those who received loans and did not
    pay back, labeled as being in Class 0. The goal is to build a model that predicts
    whether a new customer belongs to Class 1 or Class 0.


    For data science, logistic regression is one of the workhorse methods for binary
    classification and we will focus most of this chapter on robustifying this approach.
    One of the main advantages of logistic regression over other methods is that it
    is possible to compute probabilities of being in one class or the other (if needed)
    for all points in the dataset, or any new points. Furthermore, it allows us to
    access feature importance in ways similar to what is done in linear regression.
    These two aspects of logistic regression make it preferable in many applications
    in data science.


    # 8.2.1 Why Linear Regression Fails


    Without knowing about logistic regression, our first inclination may be to use
    linear regression to see what happens. Consider the two datasets shown in Table
    8.1. In Set 1, the values for x and y are quite suitable for linear regression.
    The (xi, yi) pairs consist of real values which fits the necessary requirements.
    We can try to fit the data using the robust linear regression of previous chapters,
    noting here that an outlier is present in the data table (due to data point (5.4,
    9.73)). However, in Set 2, the response variable is binary; i.e. yi ∈ {0, 1}.
    Therefore, the rules of the game must change. Although it is possible to attempt
    some sort of fitting using linear regression, this type of data does not inherently
    lend itself to this approach. This is why we turn to alternative methods such
    as logistic regression.


    For binary responses, we talk in terms of two classes of observations, Class 0
    and Class 1. Each class is typically represented in plots with a different symbol.
    We are still seeking a line (more generally, a plane or hyperplane) but now we
    want the line that divides the data into two classes rather than one that fits
    the data. Often, the data is almost separable but not quite. There may also be
