    # 1.10.3 Detection and Removal of Outliers


    One way to produce better results using k-means is to detect and remove outliers.
    This requires some techniques that are themselves robust in nature since the non-robust
    methods fail to address the issue. Consider the dataset with 1 outlier as described
    in the previous section. We must first run k-medians clustering since the results
    from k-means results are not meaningful. More generally, in order to find outliers,
    a robust method is always part of the methodology.


    Once we have the results of robust clustering, we can apply simple rules to remove
    outliers. One approach is to use the “3-sigma edit” rule. This rule is used to
    detect and delete any points that are greater than 3\(\sigma_j\) away from the
    center of cluster \(C_j\), where \(j = 1, ..., K\). This rule uses the criteria
    that, if point \(\mathbf{x}^{(i)}\) is in matrix \(\mathbf{C}_j\),


    delete \(\mathbf{x}^{(i)}\) if \(\|\mathbf{x}^{(i)} - \hat{\mu}^{(j)}\|_2 > 3\hat{\sigma}_j\)
    for \(i = 1, ..., n\),


    where \(\hat{\mu}^{(j)}\) and \(\hat{\sigma}_j\) are the mean and standard deviation
    of the points in cluster \(j\). Unfortunately, the computation of the cluster
    mean and standard deviation will be skewed by outliers so they cannot be trusted.


    A better approach is to use a robust form of the 3-sigma edit rule. Since the
    mean and variance cannot be computed reliably under outlier conditions, robust
    statistics can be used in their place. Data will only'
