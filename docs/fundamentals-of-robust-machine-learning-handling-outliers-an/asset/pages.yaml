    # 12.4 Application to Explainable Artificial Intelligence (XAI)


    The robust machine learning techniques described in this book have a wide range
    of applications in data science, as detailed in this chapter. However, they also
    play an important role in an emerging field of research known as explainable artificial
    intelligence (XAI). The goal is to be able to explain the “why?” of a decision
    or prediction generated by an AI tool, not just the “how?.” The machine learning
    tools presented in this book, along with many of the generative AI tools such
    as ChatGPT, can provide a predicted response but often lack transparency in their
    decision-making process. XAI aims to address this by providing insights into how
    AI tools arrive at their results to foster more trust and confidence.


    Consider the conceptual diagram of Figure 12.16. It is a qualitative view of the
    accuracy of different machine learning tools against their ease of interpretability.
    Tools such as linear regression, logistic regression, and decision trees are model-based
    techniques that are largely considered to be interpretable. On the other hand,
    neural networks, random trees, support vector machines (SVMs), and k-nearest neighbors
    are called post hoc techniques and are more difficult to interpret. For example,
    in a deep neural network, there may be hundreds of thousands of parameters that
    are learned but it is very difficult to comprehend how a prediction is made with
    the final model. The same is true for random forest and SVMs. It is easy to create
    thousands of trees and make a decision but it is not easy to figure out how a
    specific decision was made, and if it is a reasonable decision. For SVMs, the
    decision boundary


