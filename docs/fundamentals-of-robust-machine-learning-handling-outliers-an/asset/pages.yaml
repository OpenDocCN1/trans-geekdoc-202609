    we refer to the set of outcomes as classes and the type of data as **categorical**.
    Typically, each class is assigned a numerical label: Store A = 1, Store B = 2,
    and Store C = 3. To represent these labels in a dataset for processing by a neural
    network (NN), we use **one-hot encoding** whereby each label is converted to a
    binary vector where only one element is set to 1, while the others are set to
    0. Specifically, we can use the following one-hot encoding: Store A = 100, Store
    B = 010, and Store C = 001. More generally, for a response with c classes, a one-hot
    coding requires c bits with only one bit set to 1 to indicate the class. By doing
    so, the **y** vector used in binary classification now becomes a **Y** matrix
    for multi-class classification.


    Consider the hypothetical dataset for the store selection problem depicted in
    Figure 10.1 that captures customer purchasing behavior for each product. The four
    key variables are product price, product rating, amount of discount available,
    and store distance from the customer. They are listed as column headings x₁, x₂,
    x₃, and x₄ in the table. In row 1 of the table, only one of the three possible
    responses is set to 1, reflecting the one-hot encoding of the label associated
    with Store A. Row 2 refers to Store B, rows 3 and 4 to Store C, and so on.


    With the dataset in hand, the next step is to build a neural network with four
    inputs and three outputs. The NN architecture will involve three hidden layers
    and four hidden units in each layer. The output activation will be performed using
    the softmax function. Next, a loss function is needed that is specifically designed
    for categorical outputs. Finally, an optimization technique is required to minimize
    the loss function to produce the model that can be used for inference. Each of
    these steps will be outlined in the rest of this chapter.


    # 10.2.1 Multi-class Loss Functions


    In order to carry out machine learning with the dataset of Figure 10.1, we need
    to modify the two loss functions discussed in earlier chapters because we now
    have a large matrix of responses that are either 0 or 1. In particular, we want
    to use loss functions that focus on the 1’s in the responses which have been'
