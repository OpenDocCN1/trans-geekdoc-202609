    as numbers and therefore can be considered as outliers. This is a potentially
    valuable capability arising from the use of robust methods on the MNIST dataset.


    # 10.4 Optimization of Neural Networks


    To conclude this chapter, we shift our focus to the critical aspect of optimization
    of neural networks. Optimization lies at the heart of training deep learning models.
    It determines how quickly and how effectively the neural network adapts its weights
    and biases to minimize the loss function. While gradient descent serves as the
    foundation, recent advancements have introduced more sophisticated optimization
    algorithms. Among these, the Adam optimizer stands out as a powerful and widely
    used technique. In this section, the goal is to bridge the gap between neural
    networks and optimization by describing the Adam optimizer and its role in deep
    learning. We cover gradient descent with momentum and rmsprop to provide a complete
    picture for the Adam optimizer. This optimization algorithm can also be used for
    linear and logistic regression, in addition to neural networks for which it was
    originally intended.


    To review the basic operation of gradient descent, recall that the parameters
    are updated at each iteration using some fraction of the gradient based on the
    learning rate, \(\ell\), shown symbolically as follows, with \(t\) as the iteration
    count


    ```

    \(\mathbf{w}^{(t+1)} = \mathbf{w}^{(t)} - \ell \times \left( \frac{\partial J(\mathbf{w})}{\partial
    \mathbf{w}} \right)^{(t)} .\) (10.4.1)

    ```'
