    # 12.5.5 Finding Outliers in Time Series


    As with other topics in this book, the alternative to robust methods is to detect
    outliers and handle them in some manner. Outliers occur in time series because
    time series tend to be noisy and may have significant fluctuations, as seen in
    Figure 12.21. The average land temperature varies significantly in the early years
    of this figure, but it stabilizes as time progresses. The effect of outliers is
    dependent on the nature of the analysis being conducted. Statistical quantities
    such as mean, variance, and autocorrelation will all be skewed by outliers in
    the context of time series. They can also make forecasts less reliable. Therefore,
    outlier detection is an important part of time series analysis.


    There are many ways to find outliers in a time series. Visualization is one way
    to quickly identify the existence of outliers, especially in the case of a one-dimensional
    time series. However, the robust statistical approaches described in Chapter 4
    are better suited for outlier detection. In particular, box-plots applied to the
    first or second difference of the time series (since they are de-trended) would
    be very effective in detecting outliers. Robust z-scores can also be used in conjunction
    with an edit rule between 4.5-MAD and 15-MAD, depending on the time series of
    interest. Advanced methods, such as Isolation Forest and DBSCAN described in Chapter
    11, can also be evaluated for this purpose. Furthermore, the robust clustering
    techniques of MADmax may be useful along with the associated outlier detection
    methodology.


    For outlier removal, rather than trimming the data (which can be dangerous), it
    is more appropriate to winsorize the data since every time point requires some
    data. There are methods to place upper and lower bounds on the data, and then
    these bounds can be used to replace outliers. Different quantiles, such as the
    5th/95th or 1st/99th combinations, are suitable for upper and lower bounds. Careful
    attention must be paid to their use on de-trended time series rather than the
    original time series. These and other details of'
