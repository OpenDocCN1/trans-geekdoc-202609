    # ## 3.6 Standard Errors for Robust Estimators


    Standard error (s.e.) is a measure of the uncertainty around an estimate (see
    Montgomery et al. 2012). Since we know that different samples of a population
    will produce different estimates, it is desirable to get a handle on the degree
    of this uncertainty. In fact, it is possible to show that the estimates from a
    log-cosh estimator are asymptotically normal, meaning they follow a Gaussian distribution.$^2$
    This makes life a lot easier since we can follow the usual procedures to obtain
    the standard errors, which is an estimate of the standard deviation of each parameter.


    Consider the multiple linear regression model in matrix form as follows:


    ```

    $y = X\beta + \epsilon, \qquad (3.6.1)$

    ```


    where $y = (y_1, ..., y_n)^\top$ is a response vector, $X$ is an $n \times (d
    + 1)$ design matrix of constants with $X_1 = (1, ..., 1)^\top$, and $\epsilon
    = (\epsilon_1, ..., \epsilon_n)^\top$ is the error term. Regression parameters
    $\beta = (\beta_0, ..., \beta_d)^\top$ are the $d + 1$ coefficients of interest.
    Here we assume $\epsilon$ has some known distribution with mean $0 = (0, ...,
    0)^\top$.


    2 To be clear, the residuals follow the Cosh distribution while the estimates
    follow a Gaussian distribution.'
