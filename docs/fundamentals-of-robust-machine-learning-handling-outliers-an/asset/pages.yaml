    However, when examining points 3–11, it is a different matter. Their initial distances
    to nearest neighbors (with _k_ = 1) are relatively small because there are other
    outliers in their immediate vicinity. It is only when _k_ is increased to a large
    enough value that their average distances begin to increase significantly. These
    points emerge from the average distances associated with the inliers to join the
    average distances of the other outliers (points 1 and 2). Clearly, a large value
    of _k_ is needed to separate inliers from outliers when there are groups of outliers.


    As an example, a value of _n_/3 would be sufficient to separate out all the outliers
    from inliers as indicated by the vertical line at _k_ = 60, which represents a
    suitable value of _k_. More generally, a value of _k_ = _n_/5 gives good results.
    This fixed value can be used with most datasets, assuming that fewer than 20%
    of the data are outliers.


    Next, if we examine the vertical axis, it represents the range of average distances
    in our dataset. We need to define a horizontal line that separates the outliers
    from the inliers. A suitable choice would be 10.0. In fact, the threshold for
    this example could be set to any value between 10 and 12.5 to obtain the same
    results. A value less than 10.0 would incorrectly make point 12 an anomaly. The
    _threshold_ value (horizontal line) is usually obtained from a histogram of the
    distances produced by binning the values along the vertical line at _k_ = 60,
    as shown in Figure 11.3.


    It is possible to take the histogram data and find an appropriate threshold by
    identifying the distances that are large (outliers) from the ones that are small
    (inliers). This can be done automatically with a suitable algorithm that takes
    the frequency counts of the average distances, with say 30 bins, and looks through
    the bins to select the threshold. Using this strategy, the _k_-NN anomaly detection
    method can be fully automated. It is referred to as **auto-_k_NN** later in this
    chapter.


    The _k_-NN algorithm is simple and can be very effective in identifying anomalies
    and outliers. However, one of the main drawbacks is the amount of computation
    needed to calculate the average distances for all points. If the number of features
    and/or number of data points is large, the computational cost may be prohibitive.
    The total number of distance calculations is \(\frac{n^2-n}{2}\), thus the computational
    complexity is O(_n_<sup>2</sup>), where _n_ is the number of data points.<sup>1</sup>
    Therefore, it can only handle small to medium-sized datasets.'
