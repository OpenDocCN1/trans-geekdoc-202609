  md: '# 3


    # The Log-Cosh Loss Function


    # 3.1 Introduction


    In the previous chapter, we introduced the $L_1$ loss function (more commonly
    known as the least absolute deviation (LAD)) and the Huber loss function as our
    first encounter with robust estimators. In this chapter, we explore a more recent
    entry into the robust category, the log-cosh loss function, which is central to
    the robust methods to be presented in this book. This loss function belongs to
    the class of associated robust estimators because, like Huber, it also prefers
    solutions in the vicinity of the median rather than the mean. Another view is
    that it is more tolerant to outliers in the dataset because the family of associated
    estimators is related to the $L_1$ estimator. One standout feature is that it
    is a single, continuously differentiable function that is parametric in nature
    and therefore possesses all the desirable properties of estimators such as convexity,
    consistency and asymptotic normality. This is in contrast to the Huber loss which
    has multiple segments and a discontinuous second derivative.


    In this chapter, we demonstrate that the log-cosh loss function is superior to
    other robust estimators for machine learning. The chapter provides a detailed
    and thorough treatment of the log-cosh loss function by deriving it from first
    principles, starting with its distribution. Then, we will study properties such
    as the bias, variance, and standard errors of estimation. We will also explore
    various extensions to the basic log-cosh loss using the location and scale parameters.
    Finally, the general M-estimator form of the log-cosh loss will be shown to be
    a very powerful tool for robust machine learning.


    # 3.2 An Intuitive View of Log-Cosh


    In order to gain an intuitive understanding of log-cosh, we need to go back to
    the $L_1$ loss function and identify its primary weakness. Minimization of this
    loss function results in the median as the estimate, dividing the data in half.
    However, it has a kink in the loss term which leads to a discontinuous first derivative
    and an undefined second derivative.$^1$ This implies that the optimization of
    the loss function may not produce a unique solution, and the solution may require
    methods other than gradient descent. In fact, one of the reasons that $L_2$ is
    in widespread use today is that the $L_1$ loss requires linear programming


    1 More accurately, the second derivative is an impulse function at the origin
    and zero elsewhere.'
