    response variables were presented in Chapter 4 to address these questions. The
    boxplots indicate the presence of outliers; so we will have to be extra careful
    about any operations performed that assume outlier-free data. Some preliminary
    analysis involves extraction of descriptive statistics such as the min, max, mean,
    median, quartiles, and standard deviation. These values are inspected to determine
    if standardization is required to enhance the performance and accuracy of downstream
    machine learning tools. The numerical ranges of the features were provided graphically
    in Chapter 4 which tells us that robust standardization will be needed.


