- pgno: 48
  md: 'be removed if any \(\mathbf{x}^{(i)}\) belonging in cluster \(j\) satisfies
    the “3-MADN edit” rule. That is, for all points \(\mathbf{x}^{(i)}\) in matrix
    \(\mathbf{C}_j\),


    delete \(\mathbf{x}^{(i)}\) if \(\|\mathbf{x}^{(i)} - \text{median }(\mathbf{C}_j)\|_2
    > 3\text{MADN}(\mathbf{C}_j)\) for \(i = 1, ..., n\).


    This robust version will find and delete all the outliers, regardless of their
    number and location outside the cluster region.


    To compare the two methods, first consider the standard 3-sigma edit rule for
    the previous dataset with only one outlier. If we use a Gaussian distribution
    for each cluster, then we find that \(\hat{\sigma}_2 = 64.8\) which is too large
    to be of any value. The 3-sigma edit rule would force us to reject points that
    are \(3 \times 64.8 = 194.4\) units in all directions from the center. It will
    not delete any points and therefore the 3-sigma statistic is not useful. Contrast
    this with the robust criteria. The estimate of MADN(\(\mathbf{C}_2\)) = 11.2 and
    so the 3-MADN edit rule would yield \(3 \times 11.2 = 33.6\). This is a much more
    reasonable distance to use as a threshold for identifying and deleting outliers,
    especially since the median is used as the cluster center. This would delete the
    single outlier in the data. Once this is done, the mean and variance computations
    will be reasonably accurate. Furthermore, the `KMeans` tool can be used to build
    the model after the outlier is removed.


    **Exercise:** Given the one-dimensional dataset \(\{1, -2, 5, -4, -6, 3\}\) and
    \(K = 2\), compute the centers using \(k\)-means. Next, recompute the centers
    using \(k\)-medians.


    **Ans.:** \(k\)-means \(\{-4, 3\}\). \(k\)-medians \(\{-4, 3\}\).


    **Exercise:** Given the one-dimensional dataset \(\{1, -2, 5, -4, -66, 3\}\) and
    \(K = 2\), compute the centers using \(k\)-means. Next, recompute the centers
    using \(k\)-medians.


    **Ans.:** \(k\)-means \(\{-24, 3\}\). \(k\)-medians \(\{-4, 3\}\).


    The 3-MADN edit rule is somewhat arbitrary and may be too strict for most datasets.
    In practice, we may need to adjust the rule to avoid declaring inliers as outliers.
    For example, a 10-MADN edit rule may be better to ensure that true outliers are
    found far from the centers of the clusters. Some tuning may be needed to find
    the proper multiplier. On the other hand, the 3-sigma rule would fail because
    the value of \(\hat{\sigma}\) would be unreliable. The key point here is that
    outlier detection requires the use of robust procedures and robust statistics.


    # 1.11 Summary


    This chapter highlighted the use of the median as a key to robust methods. It
    provided a case study of how to robustify an existing algorithm in machine learning
    and how to detect and remove outliers. It is clear that the \(k\)-medians approach
    is robust to outliers and superior to \(k\)-means in this regard. Using \(k\)-medians
    avoids having to find and remove outliers or be concerned with centers that do
    not represent the data well enough for use in other applications. The \(k\)-means
    method can be safely used only if there'
