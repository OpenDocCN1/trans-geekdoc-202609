- pgno: 344
  md: '# 11.4 Qualitative Evaluation Methods


    It is a challenge to compare different anomaly detection methods for a variety
    of reasons. For example, if there are four detection methods and three require
    manual adjustment of hyperparameters while the fourth does not, how should the
    comparison be carried out? Second, some methods are faster or can easily handle
    larger datasets compared to others but do not have the same level of accuracy
    as the others. Third, if all 4 methods detect 10 anomalies but they do not all
    agree on which ones are true positives and which ones are either false positives
    or false negatives, then how do we determine which one is best, especially in
    a multidimensional setting where visualization is not an option? And finally,
    if the correct number of anomalies is 10, what if each method obtains a different
    number of anomalies and only one predicts 10. How should we view the quality of
    the other detectors.


    As a general statement, we have to accept the fact that anomaly detectors are
    hard to compare. Ideally, if a method automatically detects the anomalies without
    user intervention, it would be preferable. Then, if a method produces the correct
    number of anomalies, that makes it even more attractive. However, if it requires
    an inordinate amount of computer runtime, then its value may only be demonstrated
    on small to medium-sized datasets. The k-NN and MADmax approaches are accurate
    and can be made to work in an automated fashion. k-NN is more suitable for small
    or medium-sized problems. Both DBSCAN and MADmax can handle larger datasets although
    DBSCAN may require some tuning. Isolation Forest can operate on extremely large
    datasets but requires some amount of domain knowledge and user intervention.


    With this backdrop, we now carry out qualitative comparisons of k-NN, DBSCAN,
    Isolation Forest and MADmax using a specific publicly available dataset. The four
    methods have noticeably different approaches to the problem but, at a basic level,
    they all measure some form of “distance” in their algorithms. These are converted
    into scores which are then used to rank data points. The rankings determine the
    designation of outliers or inliers based on a threshold. The overall methodology
    involves using each method as an unsupervised learning task on the same design
    matrix X ∈ R^{nxd}, with the option to tune certain hyperparameters if necessary.
    The goal is to assess their ability to find a set of known anomalies/outliers.


    To illustrate the complications of comparing different methods, consider the wine
    dataset4 which is known to contain outliers. The dataset consists of 130 observations
    (n = 130) and 13 features (d = 13). Therefore, it is not possible to visually
    examine results in a 13-dimensional space to compare different methods. In that
    case, how should we proceed and how do we adjudicate the identification of a data
    point as an outlier or inlier?


    A good first step would be to invoke the auto-kNN approach to find the outliers
    and anomalies. This was mentioned in Section 11.2.1 whereby the values of k and
    the threshold are set automatically using heuristics. Although this method may
    be unsuitable for large datasets, it is quite suitable for the role of identifying
    true outliers on small datasets, which serves as a baseline when comparing other
    methods. Typically, a higher number of outliers are identified using this method,
    some of which are anomalies. If auto-kNN is applied to the wine dataset, a total
    of 14 outliers and anomalies are found. The next problem is to somehow visualize
    these outliers so that a comparison can be carried out.'
