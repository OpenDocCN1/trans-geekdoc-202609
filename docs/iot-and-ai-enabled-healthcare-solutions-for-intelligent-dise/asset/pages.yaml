  md: 'Only precautionary measures from the population’s side (as added sugar products
    might never be banned) and proper treatment are the way forward in combating diabetes.
    Timely detection of diabetes plays a crucial role in controlling the disease from
    its onset. If left unchecked, diabetes can cause complications in various bodily
    functions and, more critically, lead to the destruction of an individual’s immune
    system. If symptoms such as frequent urination or unexpected weight loss are observed,
    immediate medical consultation is advised to check for diabetes. While not severe
    initially, diabetes is often diagnosed around the age of 40, by which time it
    may already be too late to prevent irreversible complications. Alarmingly, approximately
    12% of deaths among the adult population are attributed to diabetes. Other contributing
    factors to this disease include poor diet, physical inactivity, and excessive
    weight, which, when combined, often result in further complications such as heart
    problems and kidney failure. The medical fraternity has long been concerned with
    detecting sugar in a person’s body. Historically, this involved methods such as
    manually tasting urine or observing the attraction of ants to a patient’s urine.
    Over time, diagnostic techniques evolved from urine testing to blood testing,
    providing more accurate and reliable results, facilitating earlier diagnosis and
    treatment of diabetes. However, blood testing posed challenges in cases requiring
    continuous glucose monitoring due to its invasive nature. To address this, advancements
    were made with the integration of Machine Learning (ML) and artificial intelligence
    (AI). These technologies were incorporated into wearable devices, enabling patients
    to monitor their glucose levels continuously and non-invasively. While these innovations
    raised privacy concerns and required extensive data for accuracy, they also introduced
    Explainable Artificial Intelligence (XAI). The purpose of XAI was to explain,
    as comprehensively as possible, the processes and methods used in a patient’s
    treatment. This transparency fostered greater trust in these systems and enabled
    more personalised treatment, considering individual differences in lifestyle,
    diet, and physical activity. Since no two individuals have identical lifestyles,
    XAI provided tailored approaches for effective disease management. Despite current
    challenges, the future of XAI appears promising, and its widespread adoption is
    anticipated. However, ethical considerations must be addressed, alongside efforts
    to make these technologies more accessible and affordable, ensuring that everyone
    can benefit from their advancements [2, 3].


    # 2. Progression of Blood Glucose Monitoring Methods


    Blood Glucose level monitoring or Blood Sugar level monitoring is basically a
    way wherein we measure the fluctuations of glucose (sugar) levels in our body.
    The glucose level in the body can vary in response to various factors like that
    of diet, exercise and medications already prescribed to a person. If a certain
    range of glucose level is not maintained or if it drops down or shoots up to unexpectedly
    low or high measures, respectively, then it will lead to a life-threatening situation
    which can be both short term or can have effects which last till the last breath.


    The condition associated with such irregularities is commonly known as diabetes,
    and monitoring glucose levels aims to control it to allow individuals to lead
    healthy lives and avoid complications such as heart attacks. Monitoring'
