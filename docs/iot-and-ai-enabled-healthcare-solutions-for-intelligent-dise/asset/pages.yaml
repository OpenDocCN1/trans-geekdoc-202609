    # ## 3. The Need for Intelligent Heart Rate Monitoring


    # ### 3.1 Heart Health in Modern Medicine


    CVDs are considered to be among the most prevalent casualties that the world bears,
    claiming several millions lives each year [9]. It is important that heart conditions
    are diagnosed as early as possible and then regularly checked so that they do
    not become severe. The other parameter that can be monitored to represent CVS
    is the simplest one – pulse rate. Supervising heart rate is helpful in assessing
    the functionality of the heart, and is useful in the early identification of potentially
    critical conditions including arrhythmia, tachycardia as well as bradycardia before
    they culminate into more severe conditions such as heart attacks or strokes.


    It is imperative to health care practice in today’s medicine, not only for the
    identification of heart disorders but also for the treatment and management of
    ailments such as hypertension, chronic heart failure, and atrial fibrillation,
    etc. [10] It is also used in the evaluation of general physique and the measurement
    of stress. Because patients with high risks for further CVD or reinfarction require
    constant supervision for early clinical manifestations of CVD, the patients in
    this study were monitored after the initial visit to the outpatient clinic and
    during the follow-up visits. Due to a rapid increase in CVDs, the demand for effective
    and prolonged heart rate control has become one of the most important priorities
    in many healthcare facilities.


    However, there are challenges with traditional approaches for monitoring heart
    rate that include: often, data is only collected at a specific endpoint or in
    clinics, in short periods of time, or during a few days. This is a problem in
    diagnosing any transient heart ailments or even getting a complete overview of
    the cardiovascular wellness of a given patient over time. Lack of sophisticated
    HRMs has often led to calls for RMHS that are real-time, intelligent, and can
    track the state of heart function continuously.


    # ### 3.2 Limitations of Traditional Monitoring


    Currently, ECG or Holter monitoring is also a possible method of heart rate monitoring
    in clinical practices. Although these methods give correct readings, they are
    sometimes constrained in their use in a process. ECGs, for instance, are normally
    taken in hospitals or clinics and only present a brief view of how the heart is
    functioning at a certain instance. Likewise, Holter monitors, although effective
