  md: 'requirements vary depending on the severity of the condition. For mild cases,
    finger-pricking methods, performed intermittently, suffice to measure glucose
    levels. In many cases, insulin therapy is also adequate. For severe cases, however,
    continuous blood glucose monitoring becomes necessary. This practice, introduced
    in the late 20th century, initially faced numerous complications. Over the years,
    advancements in technology significantly improved its reliability, reducing associated
    risks to almost negligible levels. Despite its effectiveness, continuous monitoring
    remains expensive, making it inaccessible to individuals without health insurance
    or financial support. Consequently, many rely on affordable yet less effective
    methods to monitor their glucose levels. While recent advancements in invasive
    monitoring methods have enhanced accuracy and safety, the financial burden persists.
    In low- and middle-income countries, the situation is exacerbated by large populations,
    making it challenging for governments to subsidise or provide such facilities
    widely. Indigenous populations and ethnic minorities, often excluded due to socio-economic
    disparities, face even greater difficulties in accessing basic healthcare facilities.
    For these marginalised groups, a lack of government outreach and persistent socio-economic
    challenges leaves them disproportionately affected by diabetes and its complications
    [4].


    # ## 2.1 Middle Ages and Uroscopy


    Even before the concept of diabetes or glucose levels in the body was well understood,
    medical professionals in the Middle Ages studied urine samples to identify underlying
    health issues. During this period, blood extraction was not a feasible option
    due to the lack of precise incision techniques, which often led to infections.
    As a result, urine analysis became the most practical method for diagnosing problems.
    The doctors of that time developed a method known as uroscopy, which involved
    visually examining urine stored in a specially designed flask called a _matula_.
    Through careful visual inspection, physicians could identify hormonal imbalances
    and determine the appropriate treatments or diagnostic steps needed to address
    the underlying issues.


    As the need to measure glucose levels in the body arose, techniques were developed
    that involved tasting and smelling urine, in addition to its visual analysis.
    Physicians created urine wheels and flowcharts as standard references for estimating
    glucose levels. This practice dates back to around 1500 BCE in ancient Egypt when
    health issues in the general population began to receive serious attention from
    professionals. A peculiar problem was observed where individuals experienced sudden
    weight loss and frequent urination. These observations prompted further study
    of urine, and experiments revealed that some samples attracted ants. Additionally,
    evaporating certain urine samples left behind solid sugar crystals with unique
    viscosity properties. These findings laid the groundwork for future advancements
    in diabetes detection and management [5, 6].


    # ## 2.2 Urine Testing in the Modern Era


    Advancements in medical science led to significant progress in understanding diabetes,
    and by 1670, the term _diabetes mellitus_ was coined to describe the condition'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'characterised by sugary urine. In 1776, an English physician discovered the
    sugary nature of urine in diabetic individuals, establishing it as a key diagnostic
    parameter. However, it was also recognised that sugary urine was not always indicative
    of diabetes, as other underlying issues could be responsible. The first clinical
    test to detect sugar in urine emerged in the 19th century, involving acid hydrolysis
    of urine samples. However, these early methods were inaccurate, inefficient, and
    unreliable. By the 20th century, more refined techniques such as Benedict''s reagent
    and Clinitest effervescent tablets provided significantly improved accuracy and
    reliability, enabling better diagnostic capabilities. Clinitest was further refined,
    leading to the development of Acetest and eventually urine test strips.


    By the mid-20th century, urine test strips became a standard diagnostic tool.
    These strips were paired with colour charts to compare results and could detect
    multiple substances such as proteins, ketones, and glucose. Despite these advancements,
    urine testing retained several limitations. For instance, the presence of strong
    oxidising agents could yield false positives, and hypoglycaemia could not be detected
    using these methods. Nevertheless, urine testing remains a valuable option for
    individuals uncomfortable with invasive blood tests, offering a less expensive
    and simpler alternative [7].


    # 2.3 Advent of Blood Testing


    Urine testing, despite its historical significance, had inherent limitations that
    often hindered timely diagnosis and treatment of diabetes. These shortcomings
    sometimes resulted in missed diagnoses, which in severe cases led to fatal outcomes.
    As a result, blood testing emerged as an alternative diagnostic method. Unlike
    urine, blood does not naturally exit the body and must be extracted using syringes
    or by making incisions on the skin. Early blood testing for glucose measurement
    required large volumes of blood and yielded slow and often inaccurate results.
    The process could take over a minute to deliver findings, and excessive blood
    extraction posed additional health risks to patients. Recognising these issues,
    researchers focused on developing less invasive methods that required smaller
    blood samples while improving the speed and accuracy of results. The refinement
    of blood glucose testing led to significant advancements, particularly for patients
    requiring frequent monitoring due to severe cases of diabetes. Initial tools like
    Dextrostix required substantial amounts of blood, but modern glucose test strips
    now need only microscopic amounts. This innovation has enabled critical patients
    to monitor their glucose levels regularly. Traditional comparison with standard
    colour charts has been replaced by digital meters, which provide near-instantaneous
    results depending on the sophistication and cost of the device. Although blood
    testing remains a widely used method due to its affordability and availability,
    its invasive nature limits its application for continuous glucose monitoring.
    To address this limitation, non-invasive techniques leveraging advanced sensors
    are being developed. These methods are better suited for continuous monitoring,
    as blood sampling cannot provide the same level of convenience and consistency.
    The evolution of blood glucose monitoring continues to enhance diabetes management,
    providing patients with more reliable and patient-friendly solutions [8, 9].'
