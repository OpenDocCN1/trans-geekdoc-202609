    (ROC) curve in this exploratory data analysis (EDA). The true positive rates (TPR)
    are plotted on the y-axis and the false positive rates (FPR) are plotted on the
    x-axis in the ROC curve. The ROC curve is a crucial tool for illustrating binary
    classifiers’ capacity for diagnosis. The trade-off between sensitivity (true positive
    rate) and specificity (1 - false positive rate) is represented by each point on
    the ROC curve, which denotes a distinct threshold. These measures allow us to
    plot and evaluate how well different algorithms (e.g., Decision Tree, Random Forest,
    and LightGBM) differentiate between the positive and negative classes. Figure
    8 is a receiver characteristics curve, which depicts a detailed graphical plot
    showing the behavior and performance of a receiver in response to all different
    possible input signals. In other words, this is the curve showing how differently
    the receiver will open, that is to say, be able to correctly interpret and then
    process the received signal, as a function of items like signal strength, frequency,
    or noise levels. The curve gives an understanding of the sensitivity, selectivity,
    and efficiency state of the receiver under different conditions. Such analysis
    is one of the most important in the optimization of receiver design in the name
