  md: 'This is because, in many cases, obtaining pertinent data can be expensive and
    time-consuming. A set of techniques known as data augmentation are used to generate
    new data points from existing data in order to fictitiously enhance the volume
    of data.


    Applying deep neural networks to create more data samples or making small changes
    to the existing data is a speedy and effective technique to increase the dimensionality
    of training data and enhance generalization to new, unseen samples. In the disciplines
    of computer vision, natural language processing [13], signals, and voice, data
    augmentation is widely used. Multiple picture transformations are used for computer
    vision augmentations of the original dataset in order to enhance model training
    and minimize overfitting. Among these techniques are geometric modifications,
    flipping, color space, random rotations, random cropping, and noise injections.
    Models are more generalizable and yield better predictions when they are trained
    using distributions other than the training data. Image augmentations were carried
    out using an open-source Python module named Albumenatations to create a new collection
    of images through a range of transformation techniques, such as transposition,
    random rotation (90°, 180°, 270°), and horizontal and vertical flips. This allowed
    for an increase in the size of the dataset. The intention of using albumenatations
    was preservation.


    # 3.3 Algorithm


    +   1) Data Collection:

    +   Collect data from three data sets FIGSHARE, SARTAJ, and BR35H.


    +   2) Data Preprocessing:

    +   Perform data cleaning, normalization, data augmentation, and feature extraction.


    +   3) Split the dataset into training and testing sets as shown in Table 1.


    +   4) Develop custom convolution neural network.


    +   5) Pre-trained Models:

    +   Load pre-trained CNN models (VGG16, VGG19, InceptionV3, ResNet50) without
    their top classification layers.

    +   For each model, apply global average pooling to the output of the base model
    to reduce the dimensionality.


    +   6) Model Ensemble:

    +   Concatenate the outputs of the global average pooling layers from each model
    and the output of the custom CNN model as shown in Table 2. Add a dense layer
