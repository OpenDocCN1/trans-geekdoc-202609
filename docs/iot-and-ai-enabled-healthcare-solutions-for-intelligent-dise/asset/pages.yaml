    # 4.2 Data Collection and Transmission


    However, the primary advantage of IoT based heart rate monitoring systems is the
    capturing of the real time data [12]. IoT devices have sensors that are always
    collecting data on the heart rate, which is then transmitted across secure networks
    to cloud servers or local storage and endpoints for analysis.


    +   • Data Collection: The sensors in wearables, including heart rate monitors,
    collect values through physiological signals acquired continuously. This data
    can range from simple values such as heart rate to more complex metrics like heart
    rate variability, which provide information on autonomic function and the general
    health of the cardiovascular system. The information is stored temporarily in
    the device before being sent to higher layers of the system hierarchy.


    +   • Data Transmission: To make it easier for diagnosis and analysis, registration
    data that is collected by IoT devices must be transferred securely to other servers
    or healthcare providers. Many wearable devices rely on the wireless communication
    technologies such as Bluetooth, Wi-Fi or cellular networks for data transmission.
    Bluetooth is typically used for short-range communication of data whereas Wi-Fi
    and cell phone networks are employed for long-range data exchange. As a security
    measure in addressing heath information, most data is encrypted during transmission
    to prevent unauthorized access or interference.


    Another important feature of IoT-aided heart rate monitors is that the collected
    data is transferred in real-time. This makes it easier to identify abnormalities
    during the initial stages, enabling treatment before the situation becomes critical.
    Telemetry is especially relevant in the transfer of real-time information for
    high-risk patients who need continuous monitoring due to cardiovascular problems
    like arrhythmias or heart failure.


