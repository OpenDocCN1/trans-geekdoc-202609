    **Movement and Navigation:** Sensors aid nanorobots in navigating through intricate
    settings, including the human body. By identifying barriers and modifying their
    route accordingly, individuals can make sure they arrive at their destination
    [[13]].


    # ## 4. Mechanical Design of Nanorobots


    A nanorobot consists of a flexible and very small size robotic device. Their diameter
    ranges from 1 to 5.5 microns, and they are made of molecular or nanoscale components.
    The parts can vary in size from 1 to 100 nanometers and are built at the nanoscale.
    The terms “nanorobotics” and “nanobot” are commonly used to describe devices that
    range in size from 0.5 to 15 micrometres. Because of their small size and the
    difficulty of their jobs, nanorobots require the use of various sophisticated
    approaches for control [[14]]. Typical techniques for manipulating nanorobots
    include the following:


    **Electric Field:** By exerting forces that propel nanorobots in the correct directions,
    electric fields can be used to manipulate them. Microfluidic settings frequently
    employ this technique.'
