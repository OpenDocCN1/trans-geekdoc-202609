- pgno: 150
  md: '# 3. Fundamentals of Convolutional Neural Networks (CNN)


    # 3.1 Introduction to Deep Learning and CNNs


    # Basics of Deep Learning


    Deep learning is a branch of machine learning that focuses on modelling complicated
    patterns in data using many-layered neural networks—thus the term “deep”—in training
    sets. Deep learning models could automatically learn hierarchical representations
    of data through numerous layers of abstraction, in contrast to typical machine
    learning techniques that frequently require manual feature extraction.


    +   1. Neural Networks: Neural networks, which consist of linked nodes (neurons)
    arranged in layers, are the fundamental building blocks of deep learning. Neurons
    introduce non-linearity by applying activation functions to their inputs, and
    each connection has a corresponding weight.


    +   2. Layers in Neural Networks: Raw data is received by the input layer.


    Hidden Layers: In-between layers that give the input a more ethereal appearance.
    There are several hidden layers in deep networks. The output layer generates the
    final categorization or prediction [8].


    # Deep Neural Network Training


    +   1. Forward Propagation: To create forecasts, data is sent through the network.


    +   2. Loss Function: Calculates the discrepancy between the intended and actual
    output.


    Backward Propagation: Using optimization techniques like gradient descent, the
    error is spread back through the network to update weights [7].


    +   3. Advantages of Deep Learning:


    +   o Automatic Feature Extraction: Learns features directly from data, reducing
    the need for manual feature engineering.


    +   o Scalability: Can handle large and complex datasets with high-dimensional
    data.


    +   o Performance: Achieves state-of-the-art results in various tasks, such as
    image recognition, natural language processing, and speech recognition.


    # Historical Development and Success of CNNs


    A specific kind of deep learning model called Convolutional Neural Networks (CNNs)
    is used to interpret structured grid data, like photographs. Their design is influenced
    by how the human brain processes visual information.


    +   1. Origins and Early Work:


    +   o The concept of convolutional neural networks dates to the 1980s with the
    work of Yann LeCun and others on the non-cognition and LeNet models. One of the
    earliest effective uses of CNNs for handwritten digit recognition was LeNet-5,
    which was created in 1998 [10].'
  merge: -1
  img_proc: true
- pgno: 151
  md: '+   o **Convolutional Layers:** Perform convolution operations to detect spatial
    hierarchies in images. These layers apply a set of filters to the input image
    to produce feature maps.


    +   o **Pooling Layers:** Lower the feature maps’ spatial size to preserve the
    most crucial data while lowering computational complexity.


    +   o **Fully Connected Layers:** The output is flattened and sent via fully connected
    layers for final classification following several convolutional and pooling layers
    [9].


    # ## 2. Breakthroughs and Milestones:


    +   o **AlexNet (2012):** Easily won the ImageNet Large Scale Visual Recognition
    Challenge (ILSVRC), signalling a major advance. Alex Net showcased the potential
    of deep CNNs in conjunction with GPUs for processing in parallel.


    +   o **VGGNet (2014):** Introduced deeper networks with smaller convolutional
    filters, showing that increasing depth improves performance.


    +   o **GoogLeNet/Inception (2014):** Introduced the Inception module, which allows
    for multi-scale processing within the network.


    +   o **ResNet (2015):** Addressed the problem of vanishing gradients in deep
    networks by introducing residual connections, enabling the training of networks
    with hundreds of layers.


    # ## 3. Applications and Impact:


    +   o CNNs have revolutionized facial image and video analysis, attaining innovative
    results in tasks including facial recognition, image segmentation, and object
    detection.


    +   o Beyond image processing, CNNs have been adapted for various other domains,
    including medical image analysis, where they are used to detect abnormalities
    and diseases from medical scans.


    In summary, deep learning and CNNs have transformed the field of artificial intelligence
    by providing powerful tools for automated feature extraction and high-accuracy
    predictions. The historical development of CNNs highlights a trajectory of innovation
    and success, positioning them as the leading approach for image-based tasks, including
    the detection of brain tumors from MRI scans.


    # ## 3.2 Architecture of CNNs


    Convolutional neural networks, or CNNs, are especially made to handle input that
    has a structure resembling a grid, like photographs. CNNs are built with a variety
    of layers that cooperate to extract characteristics from the input data and carry
    out tasks like regression or classification. Convolutional layers, pooling layers,
    fully linked layers, and activation functions are the main parts of the CNN architecture.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Convolutional Layers


    # 1. Function:


    +   CNN’s fundamental building components are called convolutional layers.

    +   They carry out convolution operations, which generate feature maps by

    +   swiping a filter (or kernel) across the input data.


    # 2. Operation:


    +   Filters: Small matrices (such as 3 × 3 or 5 × 5) that are applied to the input

    +   data are known as filters or kernels. Unique features, including edges, textures,

    +   or patterns, are detected by different filters.


    +   Stride: The filter’s step size as it passes through the input. Greater steps

    +   decrease the resulting feature map’s spatial dimensions.


    +   Padding: Increasing the number of pixels surrounding the input border to

    +   regulate the output’s spatial dimensions. “Same” (padding to retain input
    size)

    +   and “valid” (no padding) are common kinds [11].


    # 3. Output:


    +   The result of a convolution operation is a feature map, which highlights the

    +   presence of specific features detected by the filters.


    # Pooling Layers


    # 1. Function:


    +   Pooling layers reduce the spatial dimensions of the feature maps, retaining

    +   the most significant information while decreasing the computational load and

    +   reducing overfitting.


    # 2. Types of Pooling:


    +   Max Pooling: Selects the maximum value from each region of the feature

    +   map. Commonly used for its ability to capture the most prominent features.


    +   Average Pooling: Computes the average value of each region. Less common

    +   than max pooling but useful in certain contexts.


    # 3. Operation:


    +   Pooling Size: The dimensions of the pooling window (e.g., 2 × 2, 3 × 3).


    +   Stride: The step size for moving the pooling window across the feature map.


    # 4. Output:


    +   A down sampled feature map that retains the most notable features while

    +   reducing spatial dimensions.


    # Fully Connected Layers


    # 1. Function:


    +   Fully connected (FC) layers connect every neuron in one layer to every neuron

    +   in the next layer. They are used at the end of the CNN to perform high-level

    +   reasoning and classification.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# 2. Operation:


    +   o **Flattening:** The output from the last convolutional or pooling layer
    is flattened into a 1D vector.


    +   o **Weight Matrix:** Each input is connected to each output through a weight
    matrix. These weights are learned during training.


    # 3. Output:


    +   o The final classification or regression result, often represented as a vector
    of class scores or probabilities.


    # Activation Functions


    +   1. **Use:** The network gains non-linearity via activation functions, which
    helps it to understand intricate patterns and representations.


    +   2. **Typical Activation Purposes:** Rectified Linear Units, or ReLUs. Output
    zero if the input is negative; otherwise, the input is positive. Because of how
    easy and successful it is at preventing vanishing gradients, it is commonly employed.


    +   o **Sigmoid:** Maps the input to a range between 0 and 1, useful for binary
    classification problems.


    +   o **Tanh:** Maps the input to a range between -1 and 1, often used in practice
    because it centres the data and can accelerate convergence.


    +   o **SoftMax:** Often used in the output layer for multi-class classification,
    it converts the output scores into probabilities that sum to one.


    The architecture of CNNs is designed to learn spatial hierarchies of features
    automatically and efficiently from input images. Convolutional layers extract
    low-level features such as edges and textures, pooling layers reduce spatial dimensions
    and highlight the most notable features, fully connected layers integrate these
    features to make final predictions, and activation functions introduce non-linearity,
    allowing the network to model complex patterns. Together, these components enable
    CNNs to achieve outstanding performance in tasks such as image recognition and
    medical image analysis, including brain tumor detection from MRI scans [12].


    # 3.3 Training CNNs


    Training Convolutional Neural Networks (CNNs) involves optimizing the model parameters
    to minimize the difference between the predicted outputs and the actual targets.
    This process is driven by backpropagation and gradient descent - key components
    in the learning process. Additionally, selecting appropriate loss functions and
    optimization algorithms is crucial for efficient training [13].


    # Backpropagation and Gradient Descent


    # 1. Backpropagation:


    +   • **Purpose:** Backpropagation is the algorithm used to calculate the gradient
    of the loss function with respect to each weight in the neural network. This gradient
    is then used to update the weights to reduce the loss.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '+   • Process:

    +       • Forward Pass: Input data is passed through the network layer by layer
    to generate predictions.

    +       • Compute Loss: The loss function measures the difference between the
    predicted output and the actual target.

    +       • Backward Pass: The loss is propagated backward through the network,
    layer by layer, to compute the gradient of the loss with respect to each weight.
    This involves applying the chain rule of calculus to compute these gradients efficiently.

    +       • Weight Update: The gradients are used to update the weights in the direction
    that reduces the loss.


    # 2. Gradient Descent:


    +   • Purpose: Gradient descent is the optimization algorithm used to update the
    network''s weights using the gradients computed by backpropagation.

    +   • Variants:

    +       • Batch Gradient Descent: Computes the gradient using the entire training
    dataset. It provides accurate gradients but can be slow and computationally expensive
    [15].

    +       • Stochastic Gradient Descent (SGD): Computes the gradient using a single
    training example. It is faster but introduces more noise into the weight updates.

    +       • Mini-Batch Gradient Descent: Computes the gradient using a small subset
    (mini-batch) of the training data. It balances the efficiency and accuracy of
    the gradient estimation [14].


    # 3. Mathematical Formulation:


    +   • For each weight www in the network, the update rule in gradient descent.


    Loss Functions and Optimization


    # 4. Loss Functions:


    +   • Purpose: The loss function quantifies how well the predictions of the neural
    network match the actual targets. It guides the optimization process by providing
    a measure to minimize.

    +   • Common Loss Functions:

    +       • Mean Squared Error (MSE): Used for regression tasks, it calculates the
    average squared difference between the predicted and actual values.

    +       • Cross-Entropy Loss: Commonly used for classification tasks, it measures
    the difference between the predicted probability distribution and the actual distribution.

    +       • Binary Cross-Entropy: Used for binary classification problems.'
