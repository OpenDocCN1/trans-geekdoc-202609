    # 2.5 InceptionV3


    Another pre-trained network model, called GoogleNet, was unveiled by Google in
    2014 and is called the Inception network [25]. Initially, a network consisting
    of 22 layers and 5 million parameters was created, using filter sizes of 1 × 1,
    3 × 3, and 5 × 5 at different scales for feature extraction and maximum pooling.
    One reason to use 1 × 1 filters is to reduce computation time. Later in 2015,
    Google upgraded the Inception model to InceptionV3 [26], which factorizes convolutional
    layers to lower parameter values. One can reduce computation without compromising
    network speed by switching from five 5 × 5 convolutional filters to two 3 × 3
    filters. The InceptionV3 model consists of 48 layers. In our experiment, we used
    the InceptionV3 model and made the necessary adjustments.'
