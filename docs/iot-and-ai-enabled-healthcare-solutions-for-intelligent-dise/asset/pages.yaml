    # ## 9. Conclusion


    Healthcare systems consist of components with complex structures, different processes,
    and various stakeholders. These systems aim to prevent patient illnesses and provide
    medical care. Healthcare systems can be divided into three models. The Universal
    Healthcare Model provides access to essential medical care without requiring financial
    contributions from individuals and offers benefits such as ease of access, health
    equity, and social and financial protection. The Social Health Insurance Model
    is supported by financial contributions from individuals and employers. It provides
    financial protection, easy access to care, flexibility in plan choices, and preventive
    care. The Private Health Insurance Model offers benefits such as greater choice
    of coverage and flexibility in plans but faces challenges like affordability,
    adverse selection, and disparities in coverage.


    Human-Computer Interaction (HCI) consists of multiple healthcare disciplines involving
    interactive computing systems designed for human interaction. In healthcare systems,
    HCI plays an important role in designing the usability of devices, often integrating
    IoT. HCI is typically designed around user-centered design (UCD), which defines
    user goals, tasks, and the context of use. Usability determines how easily a system
    can be understood and used.


