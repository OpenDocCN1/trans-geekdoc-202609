    or adverse patient outcomes from the disease. Various models of blood sugar levels
    have promising results in using machine learning and deep learning for diabetes
    prediction, such as random forest, XGboost, and dominance artificial neural networks,
    where optimal accuracy has been achieved [6]. They could identify significant
    predictors, such as HbA1c, LDL and hypertension medication, for prediction [7].'
