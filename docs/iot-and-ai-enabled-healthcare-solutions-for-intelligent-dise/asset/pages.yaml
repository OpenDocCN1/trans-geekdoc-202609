    plotting techniques like partial dependence plots (PDP) and individual conditional
    expectation (ICE) are used for the above-mentioned purpose. In the plots, one
    can see the variations that occur whenever glucose levels change depending on
    various factors which are further different for different types of persons as
    it’s impossible that everyone has the same life situations and lifestyle. These
    variations give an idea in the simplest possible way of interpreting which can
    easily move forward with the treatment and the things to take care of [22, 23].


