  md: '# ## 2. Architectures


    This section explains the classification algorithm (CNN) used, and the transfer
    learning architectures VGG16, VGG19, InceptionV3, and EfficientNetB4 [14] constructed
    using this technique as a basis.


    # ### 2.1 Convolutional Neural Network


    Convolutional neural networks (CNNs) are a type of deep neural network. Unlike
    standard neural networks, which primarily rely on matrix multiplications, CNNs
    use a technique called convolution. CNN is a deep learning architecture that employs
    a fully connected layer and activation function to interpret an image. Convolutions
    and pooling are then applied to produce an output. This output typically consists
    of a classification of the contents of an image or information on the positions
    of various convolutions (shown in Fig. 1).


    Convolution is a mathematical process that merges two functions to create a third
    function, illustrating how one function modifies the shape of another. To generate
    a prediction, further processing stages, such as pooling and passing through fully
    connected layers and activation functions, are necessary. An example of a CNN’s
    architecture is outlined below.


    Through the convolution process, the convolutional layers of a CNN efficiently
    scan the image and extract important features such as edges, textures, and shapes.
    These features are subsequently processed using various layers and methods, such
    as pooling and activation functions, to create a simplified but valuable representation
    of the entire image. The fully connected layers of the network then use this compressed
    representation as input to produce the final predictions.


    The proprietary CNN model has a sequential design and incorporates advanced elements
    like Xception-inspired convolutional layers. These layers are distinguished by
    depth-wise separable convolutions, an approach that effectively reflects the spatial
    and channel-wise dependencies found in MRI images.


    This design choice is particularly effective for medical imaging tasks, such as
    brain tumor prediction, where accurate feature extraction is crucial for optimal
    diagnosis. Following the Xception-inspired convolutional layers, the model employs
    a flattening approach. This method transforms the multidimensional output of the
    convolutional layers into a single vector representation. This adjustment is essential
    to prepare the extracted features for input into dense (fully connected) layers.
