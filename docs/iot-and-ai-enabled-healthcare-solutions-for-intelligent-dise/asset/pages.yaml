- pgno: 89
  md: 'The database was created using a graphics tablet, where patients used a digitized
    pen to draw a spiral on a monitor. The C# platform software with API functions
    is used to collect information like X,Y,Z coordinates, pressure applied during
    writing with pen on the screen, stylus grip angle and time taken to complete the
    drawing.


    Three different kinds of tests were performed and data was collected—Static Spiral
    Test (SST), Dynamic Spiral Test (DST) and Stability Test on Certain Point (STCP).


    **SST:** It is frequently used by clinical department for determining the motor
    performance of people. Here, patients were instructed to retrace the spiral which
    was appearing on the screen using digital pen and the data related to it was stored
    into the database.


    **DST:** In this test, the spiral is visible for a limited time before disappearing.
    Patients were instructed to reproduce the spiral from memory. It was observed
    that most patients deviated from the pattern while drawing the spiral.


    **STCP:** Here, a point with red color appears on the screen and the patients
    are advised to hold the digital pen on the red point without touching the screen.
    This test measures the tremor level in the patient’s hand.


    # ## 4.2 Variable Table


    There are seven variables of metrics, details of which are given Table 1. This
    table doesn’t contain any NULL values.


    Table 1. The description of variables.


    | Variable Name | Role | Type | Description | Units | Missing values |

    |---|---|---|---|---|---|

    | X | Feature | Integer | It defines the X coordinate value. | Degree | No |

    | Y | Feature | Integer | It defines the Y coordinate value. | Degree | No |

    | Z | Feature | Integer | It defines the Z coordinate value. | Degree | No |

    | Pressure | Feature | Integer | Physical force using hand is applied on the tablet.
    | Pascal | No |

    | Grip Angle (Position) | Feature | Integer | It is the angle made between pen
    and tablet. | Degree or Radian | No |

    | Time Stamp | Feature | Integer | Time when image or text was drawn. | Seconds
    | No |

    | TestID | Feature | Integer | It consists of 3 values 0/1/2. 0- SST,1- DST,2-
    STCP | - | No |'
