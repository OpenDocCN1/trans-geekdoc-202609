  md: 'various pre-existing techniques for the treatment of cancer: although a permanent
    cure has not been yet discovered, the pre-existing ones are not that effective
    as they all have an immense impact on the life of the patient after the treatment.
    All these existing techniques have a huge amount of side effects on the body of
    patients. It affects the social, and emotional aspects of the people. Sometimes
    in some people, it can lead to depression [22].


    # 5.1 Drawbacks of Existing Techniques


    We’ve got to know that every existing technique has its own very powerful side
    effects on the body of the patient during and after the treatment. All the side
    effects of the treatment are due to its chemical orientation or the way of procedure
    of the treatment. Every technique has its reason for its side effects and it is
    also different for different patients whether they got the same treatment. The
    side effects depend on the type of treatment given to the patient. Some of the
    treatments along with their side effects and reasons are listed below.


    # 5.1.1 Chemotherapy


    The treatment of cancer using chemotherapy involves administering drugs containing
    powerful chemicals to kill fast-proliferating cancerous cells. Since these cells
    exhibit rapid and uncontrolled proliferation, different drugs are utilized to
    inhibit this growth and angiogenesis [23]. In chemotherapy, drugs are introduced
    into the patient’s body through various methods such as intravenous injections,
    oral medications, shots, pills, and creams. The mode and frequency of administration
    depend on the cancer stage and diagnosis. Once administered, the drugs target
    specific phases of the cancer cell life cycle. These drugs interact with cancerous
    cells, release their active components within the cells, and destroy them during
    a particular phase of the cycle. Scientists design these drugs to attack cancer
    cells at precise moments in their lifecycle. However, a major limitation of this
    approach is that the drugs cannot distinguish between normal cells and cancerous
    cells. Normal cells, which also proliferate, are affected during treatment, although
    they can heal faster than cancerous cells. Nevertheless, normal cells lack the
    mutant properties of cancerous cells, leading to significant collateral damage
    [24]. Chemotherapy is also associated with severe side effects, including loss
    of appetite, mouth sores, constipation, bleeding, lung damage, risk of secondary
    cancers, infertility, and nerve damage.


    # 5.1.2 Surgery


    Surgery involves the dissection and removal of body parts where the presence of
    cancerous cells is detected. This treatment is typically employed for external
    cancers. A team of doctors uses specialized tools, such as scalpels and other
    precision instruments, to remove the tumour. The primary goal is to excise only
    the tumour by opening the patient’s body. However, if the tumour has proliferated
    into larger areas and cannot be entirely removed, amputation of the affected body
    part becomes the final option. This method is primarily used to treat benign tumours,
    which remain localized in one area. However, it is ineffective for malignant tumours
    because these tumours do not remain confined to a single location. Malignant cells
    migrate via'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'the bloodstream, spreading to other parts of the body and proliferating there
    [25]. Major limitations of this method include immense pain, risk of infection,
    permanent disability, emotional distress, and depression.


    # 5.1.3 Radiotherapy


    Radiotherapy, also known as radiation therapy, is a cancer treatment that uses
    highly intensifed energy beams to destroy cancer cells. This therapy predominantly
    uses X-rays, although photon particles may also be employed [26]. The procedure
    involves placing a small solid implant near the tumour cells. This implant generates
    radiation that damages the genetic material of the tumour cells, ultimately eradicating
    the tumour. The process begins with imaging scans such as MRIs to locate the tumour
    accurately. A linear accelerator is then used to generate X-rays, which bombard
    the cancer cells, leading to their destruction. However, a significant drawback
    of radiation therapy is that the use of X-rays also damages surrounding healthy
    cells. This damage may result in mutations in healthy cells, potentially leading
    to the development of new cancers. Furthermore, prolonged exposure to X-rays poses
    a risk to the treating medical professionals, who may also develop cancer due
    to radiation exposure [27]. Other limitations of radiation therapy include hair
    loss (sometimes permanent), shortness of breath, thickened saliva, and sexual
    dysfunction.


    # 5.2 Replacement with Nanorobots


    Nanorobots are artificially engineered, nanoscale structures known for their high
    versatility and biomimicry properties. These attributes make them a superior alternative
    to pre-existing cancer treatments. While nanorobots do not guarantee complete
    cancer eradication, they offer a highly targeted approach to destroying cancerous
    cells with minimal or no side effects compared to conventional treatments. Nanotechnology
    has been extensively utilized over the past few decades in fields such as communication
