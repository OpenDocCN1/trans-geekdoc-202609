    of bias and weight. Muntasir Hoq, Mohammed Nazim Uddin and Seung-Bo Park presented
    a work related to “Vocal Feature Extraction-Based Artificial Intelligent Model
    for Parkinson’s Disease Detection” [15] but space auto encoder makes it hard to
    understand the features.


    # ## 3. Proposed Method


    The handwritten dataset (HWDS) is used for the PD detection and prevention. In
    this chapter, DLNN classification method is used to differentiate the values of
    each text dataset. The overall view of proposed framework can be shown in Fig.
    2.


    +   1. Data preprocessing: It is the preliminary step by which the quality of
    data is increased. During this step, HWDS is collected, subsets are created and
    feature selection is performed.


    +   • Handwritten Dataset extraction: Collecting of HWDS from HWDS repository.


    +   • Subsets: Here subsets of the given HWDS are created by separation. Each
    subset contains instances of the same type. A total of 77 samples, each with seven
    instances, are created. Without this step, classification results cannot be obtained.'
