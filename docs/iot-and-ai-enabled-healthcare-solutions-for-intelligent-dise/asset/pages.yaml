- pgno: 76
  md: '![](img/a797255277085a0fa8aa2736cb720e31_76_0.png)


    Fig. 7. Implementation challenges of metaheuristic algorithm.


    video base data that are inspired by metaheuristics. Below is a representation
    of some of the principal implementation difficulties (Fig 7).


    +   **1. Data Pre-processing.** It is the most critical phase in developing efficient
    AI and machine learning approaches with a metaheuristic algorithm for breast cancer
    diseases. This disease data obtained from different resources is in many layouts,
    concluding structured, semi-structured, and unstructured data, and cannot be used
    right away in AI and machine learning methods. To employ the metaheuristic algorithm
    for additional procedures, various pre-processing techniques are therefore needed.
    For precise medical disease detection and prediction, data pre-processing approaches
    convert it into a more exact format that can be used with metaheuristic frameworks.


    +   **2. Imbalance Data.** A dataset has a class imbalance when one class has
    a substantially higher number of records than the other. The majority of ML algorithms
    favour the class that is in the majority. As a consequence of this, models frequently
    prefer to concentrate on accuracy over spotting unusual events, like a patient’s
    emergency state. Different approaches, including sampling, kernel and cost-based
    methods, can be utilized to address class imbalances. One of the challenges of
    using a metaheuristic framework is determining the best way to deal with the class
    inequality problem of bioinformatics data for cancer recognition and prediction.


    +   **3. Selection of Classifiers.** Hybrid approaches take into account both
    the precision of attribute subset predictions and the computational efficiency
    of attribute selection. The overall structure of a hybrid method is separated
    into two steps. First, using an independent-classifier criterion, less significant
    genes are removed from a given attribute collection in order to reduce its size
    without losing any possibilities for discriminating information. Then, several
    classification algorithms are utilized to recognize pertinent attributes for prognostication
    execution using a number of valuation criteria. Conventional selection methods
    primarily focus on a unique attribute subset with a single classifier, which'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'contributes minimally to the prediction task. In order to choose significant
    attributes using various classifiers, numerous attribute selection techniques
    have been created. Choosing the suitable classifiers for all the frameworks for
    attribute selection that are inspired by metaheuristics is therefore the most
    challenging task.


    # 4. Learning Process and Size of Training Data.


    The distribution of classes in medical data, which has been gathered from a variety
    of sources, is uneven and high-dimensional. In order to enhance the efficacy of
    ML and deep learning algorithms, the best cross-validation methods are also required.
    One of the most important requirements for overcoming cancer recognition issues
    is the way one learns with varying amounts of training data. The framework’s learning
    process is difficult with highly dimensional medical disease image expression
    data due to many computational and statistical limitations of metaheuristic methods.


    # 5. Performance of the Exploration Phase and the Exploitation Phase.


    The balance between stage of the exploration and exploitation is essential for
    the effective application of metaheuristic algorithms. A hybrid, metaheuristic
    context for forecasting and categorizing cancer performs best when some metaheuristic
    algorithms are used in the stage of exploration and others in the stage of exploitation.
    Finding the perfect balance between the stages of investigation and exploitation
    is an important and difficult task.


    # 4.2 Summary of the Review


    The rapid expansion selection of feature algorithms with metaheuristic ML methods
    in the area of cancer analysis greatly facilitates the precise prediction of the
    existence of a particular type of breast cancer. It would be advantageous to develop
    a variety of hybrid models with metaheuristic algorithms for classifying breast
    cancer disease in order to minimize barriers to further research and to improve
    classification performance and computing effectiveness. The global hybridization
    method of a metaheuristics algorithm is depicted in Fig. 8 in order to improve
    machine learning (ML) performance for classification and prediction of breast
    cancer or to establish current reign mining for even more study on biomedical
    data of high dimensionality.


    # 5. Conclusion


    Cancer and other types of diseases are vital for evaluating and diagnosing an
    extensive variety of human illnesses, and the development of numerous algorithmic
    techniques has elevated illness detection to an important issue that is relevant
    in both medical image processing and the broader field of medical imaging research.
    In order to effectively monitor the ongoing developments in AI techniques and
    apply them in accordance with their unique therapeutic requirements, physicians
    are given a considerable opportunity and corresponding responsibility. Finding
    useful auxiliary equipment for their medical practices is made easier with this
    method. As a result of a special focus on the use of metaheuristic algorithms,
    and Artificial Intelligence'
