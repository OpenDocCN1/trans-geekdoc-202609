    # 2. Fundamentals of Healthcare Systems


    Healthcare system comprises numerous stakeholders and processes, making it inherently
    complex. Understanding its structure is challenging due to the intricate implementation
    processes involved. This chapter explores the foundational elements and detailed
    functioning of healthcare systems [4].


    Different countries have varying healthcare systems due to regional differences.
    However, the primary goal across all systems is to provide the best medical facilities
    to prevent diseases and ensure access to care for all members of the community
    [5]. Healthcare systems can be classified into various models based on organization,
    financing mechanisms, and service delivery. Common models include:


    # 2.1 Universal Healthcare


    Across the world, different countries provide universal healthcare coverage to
    their citizens that guarantees medical financial assistance, regardless of their
    financial status. This model allows individuals to access medical benefits without
    financial constraints. Benefits include access to care, health equity, financial
    protection, and improved efficiency [6]. However, this model faces challenges
    such as funding shortages and policy gaps. Improving funding mechanisms and recruiting
    policymakers and stakeholders can strengthen the system and enhance services.


    # 2.2 Social Health Insurance


    In the social health insurance model, contributions are made both by individuals
    and the government under specific regulations. This system provides benefits such
    as accident coverage, flexible care options, and access to individual healthcare.
    However, it faces challenges in areas such as funding, equity, access, and care
    quality [7]. Policymakers and stakeholders aim to strengthen this system by improving
    policies to enhance healthcare outcomes.


    # 2.3 Private Health Insurance


    Private health insurance involves policies designed by private companies under
    government regulations. These policies are purchased by individuals to access
    healthcare services. While offering enhanced plans and service options, this model
    faces challenges like affordability, risk selection, and coverage gaps due to
    governmental restrictions. Policymakers and stakeholders continue to work on improving
    financial support and access to benefits for individuals. Countries like the United
    States and Switzerland have implemented this model [8].'
