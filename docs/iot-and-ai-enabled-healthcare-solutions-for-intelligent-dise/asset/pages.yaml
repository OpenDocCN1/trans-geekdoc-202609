    # 4.2 Private Datasets


    Researchers frequently use proprietary datasets, which include patient information
    and medical imaging, obtained from hospital archives in addition to publicly available
    datasets. The datasets that are selected from certain medical centers provide
    more varied patient populations and higher sample sizes, which improve the robustness
    and generalizability of machine learning models that are trained on them. In addition,
    the incorporation of actual clinical data from hospital environments guarantees
    that the algorithms produced are more appropriate for realistic use in clinical
    practice, mirroring the subtleties and intricacies found in actual patient situations.
    A lot of research also mentions using proprietary datasets that were assembled
    from medical center-specific imaging and patient records. The ML models trained
    on these datasets tend to be more broadly applicable due to their size and variety
    of patient demographics [25].


    # 4.3 Measures of Performance


    When assessing how well machine learning algorithms work, performance measures
    are crucial. Common measurements consist of:


    +   - *Accuracy:* This is expressed as the proportion of successfully predicted
    instances to all instances within the dataset. It provides a broad indication
    of how well the model works in both courses.

    +   - *Sensitivity (True Positive Rate):* This one is important for conditions
    like glaucoma where it might be harmful to miss a positive instance. It quantifies
    the percentage of real positives that the model properly recognized.

    +   - *Specificity (True Negative Rate):* Represents the percentage of real negatives
    that are accurately detected; this is crucial to prevent patients who don''t have
    the disease from receiving the incorrect diagnosis.

    +   - *Area Under Curve (AUC):* The model''s capacity to differentiate between
    classes at different threshold settings is indicated by the Area Under the Curve
    (AUC).'
