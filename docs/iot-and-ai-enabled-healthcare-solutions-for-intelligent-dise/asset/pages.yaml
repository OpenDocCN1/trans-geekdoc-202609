    # 2.1 Difficulties with Feature Selection


    Feature selection is the fundamental problem in machine Learning. The main goal
    of feature selection challenge is to reduce the feature set’s dimension while
    maintaining efficacy and accuracy. To categorize the datasets, numerous techniques
    have been developed. However, metaheuristic algorithms have prompted a lot of
    curiosity in the treatment of numerous optimisation issues. The two inconsistent
    standards that are displayed by metaheuristic algorithms are the exploitation
    of the seek space and the exploration of the best possible outcome. Not every
    FS problem can be solved in the study’s domain using a metaheuristic-based approach.
    Execution of metaheuristic algorithms can be enhanced by offsetting exploration
    and exploitation of the search space, though improvements or alterations can be
    prepared to initiate a most recent version. Most of our efforts to build a model
    that predicts using hybridization techniques for resolving subsets of issues by
    minimizing the number of weakly essential and unnecessary features are motivated
    by this stimulus. In reality, a subset that is ideal is most likely to include
    only significantly relevant features.


