    The optic nerve is the main organ affected by glaucoma; it is a vital component
    that relays visual information from the eye to the brain. Intraocular pressure,
    or IOP, is the internal pressure inside the eye and can affect the optic nerve’s
    health. One important risk factor for optic nerve injury in glaucoma patients
    is elevated intraocular pressure. The ciliary body’s production and the trabecular
    meshwork and uveoscleral pathway’s drainage are the two main aqueous humor dynamics'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'components that contribute to intraocular pressure. If there is an imbalance
    in this equilibrium, it can raise IOP, which increases the risk of injury to the
    optic nerve and glaucoma [13].


    Measure intraocular pressure (tonometry), check the drainage angle (gonioscopy),
    examine the optic nerve (ophthalmoscopy), and assess the visual field are some
    of the classic approaches used to diagnose glaucoma. Tonometry and ophthalmoscopy
    are the most widely utilized of these. When a patient is at danger of developing
    glaucoma, tonometry measures the eye''s pressure; in contrast, an ophthalmoscopy
    directly visualizes the optic nerve to look for damage. Visual field testing is
    particularly essential since glaucoma first affects peripheral vision and then
    progresses to affect central vision [14, 15].


    Technical issues with data quality and model training are the main obstacles to
    the development and use of machine learning in glaucoma detection. Good, annotated
    datasets are essential for training successful machine learning models, but they
    are frequently hard to gather. Problems including inconsistent imaging methods,
    disparities in picture resolution, and inconsistencies across various devices
    can greatly impact the quality of the data gathered. Because of these difficulties,
    complex preprocessing methods are required to standardize images before using
    them in training, guaranteeing the accuracy and resilience of the models created.


    # 3. Machine Learning Algorithms for Glaucoma Detection


    When it comes to examining retinal images for indications of the condition, machine
    learning algorithms are vital to the identification and treatment of glaucoma.
    To accurately detect important characteristics like the optic disc and retinal
    nerve fiber layer, preprocessing methods like visibility improvement and artifact
    removal are crucial for enhancing image quality and lowering noise. Support Vector
    Machines (SVM) and Decision Trees (DT) are supervised learning algorithms that
    are frequently used for feature extraction and classification. SVM is particularly
    useful in distinguishing between normal and glaucomatous eyes based on parameters
    such as the cup-to-disc ratio. Additionally, by automatically deriving complicated
    patterns from retinal pictures, advances in deep learning—particularly through
    Convolutional Neural Networks (CNNs)—have revolutionized the detection of glaucoma.
    In situations where there is a lack of labeled data, transfer learning substantially
    improves the performance of deep learning models. Though they often outperform
    traditional machine learning techniques in terms of accuracy and sensitivity,
    deep learning approaches necessitate substantial computer resources and big labeled
    datasets. But compared to conventional methods that depend on human feature designation,
    their capacity to automatically identify complex patterns presents a substantial
    advantage. Glaucoma detection depends significantly on machine learning, which
    includes four crucial parts that are listed in Fig. 2 and detailed insights discussed
    in Table 2 below. These include deep learning techniques, supervised learning
    techniques for feature extraction and classification, unsupervised learning strategies
    for disease pattern recognition, and preprocessing techniques to improve image
    quality and reduce noise.'
