    Wojciech Froelich, Krzysztof Wrobel, and Piotr Porwik proposed “Diagnosis of Parkinson’s
    Disease Using Speech Samples and Threshold-Based Classification [10]”. Savitha
    S. Upadhyay, and A. N. Cheeran proposed “Discriminating Parkinson and Healthy
    People Using Phonation and Cepstral Features of Speech [11]”. Ondrej Klempíř,
    and Radim Krupicka proposed “Machine Learning Using Speech Utterances For Parkinson
    Disease Detection [12]”. Srishti Grover, Saloni Bhartia, Akshama, Abhilasha Yadav,
    and Seeja K. R. presented a work “Predicting Severity Of Parkinson’s Disease Using
    Deep Learning [13]”. But linear algebra knowledge is required and tensor flow
    has low computation speed. Aarushi Agarwal, Spriha Chandrayan and Sitanshu S.
    Sahu presented a work “Prediction of Parkinson’s Disease using Speech Signal with
