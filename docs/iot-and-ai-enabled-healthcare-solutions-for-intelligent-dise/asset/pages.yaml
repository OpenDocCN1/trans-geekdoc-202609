  md: '# # Brain Tumor Prediction using MRI Images Employing Convolutional Neural
    Network (CNN)


    T. Swapna1,* and B. Manjula2


    # ## 1. Introduction


    An intracranial tumor, also referred to as a brain tumor, is the result of aberrant
    brain cell development and multiplication that appears to be unregulated by the
    systems that regulate normal brain cells. A popular non-invasive imaging method
    that offers precise pictures of the structure of the brain, magnetic resonance
    imaging (MRI) is essential for the identification of brain malignancies. Traditional
    diagnostic methods rely heavily on the expertise of radiologists, which can lead
    to variability in interpretations and potential delays in diagnosis. Advances
    in machine learning and artificial intelligence offer promising solutions to these
    challenges by enabling automated, accurate, and efficient analysis of MRI images.


    Tumors can be classified as malignant, benign, or pituitary. Brain tumors that
    are malignant begin in the brain, grow quickly, and actively spread to the surrounding
    tissues. It has the potential to impact the central nervous system and spread
    to other areas of the brain. These tumors are called gliomas, and they are malignant.
    Since a primary malignant brain tumor can spread and harm other brain and spinal
    cord regions, prompt treatment is very important. Non-cancerous benign malignant
    tumors grow gradually and do not move to nearby tissues. Thus, improving therapy
    options and the chance of successfully treating the condition can depend on the
    early detection of brain tumors. Pituitary tumors that are not malignant develop
    in the pituitary gland, which is close proximity to the brain’s base.'
  merge: -1
  img_proc: true
