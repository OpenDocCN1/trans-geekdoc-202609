  md: '# ## 4.3 Evaluation Metrics


    The accuracy of the proposed method is evaluated using three metrics: accuracy,
    sensitivity, and specificity. Their respective formulas are given in Equations
    1–3.


    Accuracy = \frac{True Positive + True Negative}{True Positive + True Negative
    + False Positive + False Negative} (1)


    Sensitivity = \frac{True Positive}{True Positive + False Positive} (2)


    Specificity = \frac{True Negative}{True Negative + False Positive} (3)


    # ## 4.4 Results and Discussion


    Multiple classifiers, including Decision Tree, Naive Bayes, and Deep Learning
    Neural Network (DLNN), were applied to the HWDS. Pearson coefficient correlation
    was used for feature selection. The performance of these classifiers was measured
    using accuracy, sensitivity, and specificity. As shown in Table 2, the DLNN classifier
    outperformed the others in accuracy. Additionally, Table 3 compares the performance
    of the DLNN classifier using voice-based and handwritten datasets, demonstrating
    that HWDS achieves higher accuracy than the voice-based dataset.


    Table 2. Results after applying multiple classifiers on HWDS.


    | Classifier | Feature Selection | Accuracy % | Sensitivity % | Specificity %
    |

    |---|---|---|---|---|

    | Decision Tree | Pearson coefficient correlation | 89 | 88 | 90 |

    | Naive Bayes | Pearson coefficient correlation | 90 | 88 | 88 |

    | Deep Learning Neural Network | Pearson coefficient correlation | 92 | 90 | 89
    |


    Table 3. Comparing accuracy of voice based and hand written data sample.


    | Classifier | Feature Selection | Sample | Accuracy % |

    |---|---|---|---|

    | Deep Learning Neural Network | Pearson coefficient correlation | Voice Based
    Data Sample | 89 |

    | Deep Learning Neural Network | Pearson coefficient correlation | Hand Written
    Data Sample | 92 |'
