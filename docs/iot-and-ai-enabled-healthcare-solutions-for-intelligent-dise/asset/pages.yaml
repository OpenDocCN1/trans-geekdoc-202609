    # ## 1. Introduction


    Skin diseases encompass a wide range of conditions affecting the skin, the body’s
    largest organ. Skin diseases can be caused by a variety of factors, including
    genetic predisposition, environmental influences, allergic reactions, infections,
    and underlying health conditions. Common skin diseases include acne, eczema, psoriasis,
    rosacea, and infections such as impetigo and cellulitis [1]. These diseases can
    vary greatly in symptoms and severity, ranging from mild irritations and cosmetic
    concerns to severe and life-threatening conditions such as skin cancer [2].


    Skin cancer is one of the most serious skin diseases, characterized by the uncontrolled
    growth of abnormal skin cells. Human skin anatomy is composed of three primary
    layers: the epidermis, the dermis, and the hypodermis (subcutaneous tissue) as
    shown in Fig. 1. Skin cancer is primarily caused by excessive exposure to ultraviolet
    (UV) radiation from the sun or tanning beds. Other risk factors include genetic
    predisposition, fair skin, a history of sunburns, and exposure to certain chemicals.
    There are several types of skin cancer, including basal cell carcinoma, squamous
    cell carcinoma, and melanoma, with melanoma being the most aggressive and deadly.
    Early detection and treatment are crucial for improving the prognosis and survival
    rates of individuals affected by skin cancer.'
