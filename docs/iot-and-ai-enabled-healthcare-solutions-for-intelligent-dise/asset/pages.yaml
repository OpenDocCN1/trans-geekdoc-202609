    the target variables from a lot of different kinds of raw data. This predictor
    can be used in a number of ways. This is because making choice based on a set
    of input data is not a hard thing to do. The DT approach is a nonparametric supervised
    learning method that can be used to solve regression and classification problems
    as long as it is used properly. A decision tree splits the data based on various
    features to make a prediction, while a random forest combines multiple trees for
    more accuracy and robustness. These work well with risk factors of high importance
    associated with diabetes. SVMs are appropriate for binary classification tasks,
    such as determining whether an individual is diabetic or not. They can process
    high-dimensional data and handle linear and non-linear functions [11].


    Gradient boosting models, like XGBoost, are well-known for their high predictive
