  md: '# 5.2 Future Directions


    Overcoming these challenges and properly addressing them will help us in moving
    forward and extracting more and more value out of that technology. As far as methods
    of XAI are concerned, the future looks bright but still care needs to be taken
    while blindly accepting the results provided by it and providing treatment facilities
    to the patients as sometimes the case could be sophisticated also. But despite
    the above-mentioned challenges, the future looks promising.


    # 5.2.1 Wearable Devices


    Historically, patients needed to visit hospitals or clinics for diagnostic readings.
    Over time, advancements led to digital devices that provided easier-to-read results.
    Today, wearable devices have become a reality, allowing individuals to monitor
    their health continuously by wearing devices on their bodies. These devices offer
    real-time readings, helping to prevent unexpected medical emergencies.


    # 5.2.2 Personalization Facility


    No two persons have the same lifestyle and the factors which affect their health
    also vary as there is a wide range of variation in meals being taken and the physical
    activity being carried out by the person concerned. However, all these problems
    can be effectively handled by the XAI methods. Personalization is a great thing
    that provide the facility of change in treatment as now everyone can have their
    own tailored treatment. This personalization also leads to better involvement
    of the patients in the diagnostic process as their engagement increases and it
    can be easily understood that how are they being operated.


    # 5.2.3 Feedback in Real Time


    A person suffering from diabetes is always in a state of risk if the situation
    is extreme. For these types of situations, getting real-time feedback is a necessity
    as anytime anything can happen. This also helps in making immediate decisions,
    especially in the cases of acute glycaemic events. Providing real-time feedback
    in itself is not a problem as almost all of the methods of XAI try to achieve
    this—some in the form of visualizations and some in the form of providing explanations
    in the form of human interpretable language.


    # 5.2.4 Need for Standardization


    Although any policy related to health is strictly monitored, it needs to be standardized
    in cases when any new technology is starting to get adopted on a large scale.
    This is what is happening with the methods of explainable artificial intelligence.
    As time passes by, because of its numerous benefits, it will surely be adopted
    on a large scale in the future. A lot of focus will also shift to how privacy
    concerns are addressed as the methods used require a lot of data to provide their
    findings. Standardization will also help in moving forward in a certain way which
    increases the efficiency of the process.'
