  img_proc: true
- pgno: 199
  md: '# 5.1.3 Processing in Real Time


    The methods of XAI which seek to provide explanations to the procedure being used
    in measuring glucose levels also need to provide it in real-time but the problem
    is that these methods are computationally very hardcore in nature and this intensive
    nature poses a serious challenge in providing explanations in real-time. In cases
    which are normative in nature, it would still suffice even if the explanations
    are not provided in real-time, but if the situation is extreme then it becomes
    a necessity that provision of explanations should be in real-time. As mentioned
    earlier, this is not always feasible and hence is a serious challenge.


    # 5.1.4 Integration Problem


    Whenever a new technology is discovered, it is integrated with an already existing
    technology which sometimes is easy but in some cases, it so happens that there
    occurs the problem of integrating the new technology with existing technology.
    In the case of XAI, this same problem arises. Since it''s a matter of health,
    privacy concerns also arise and when integrating the methods of explainable artificial
    intelligence, there could occur instances when somehow this sensitive type of
    information gets leaked. A high amount of efficient coordination is required along
    with a high level of technical expertise as sensitive information is involved
    - mainly the electronic health records of a patient which includes his or her
    history. This is still fine but integrating it with existing CGM systems poses
    a greater problem because of the dynamic nature as in many cases, readings are
    required to be taken all the time.


    # 5.1.5 Ethical and Regulation Concerns


    Whenever health policies are designed for any country, meticulous care is taken
    to ensure that no lapses occur, as health is one of the most sensitive and critical
    issues for any nation. Consequently, health policies are formulated to avoid ethical
    concerns and eliminate any form of bias against particular groups or identities.
    This focus on equity results in the implementation of strict regulatory policies,
    with measures in place to ensure that such stringency is maintained in the future.
    However, the high level of regulation and strictness often complicates the provision
    of holistic and comprehensive treatment, particularly when healthcare providers
    attempt to integrate XAI methods into their services. Addressing every concern
    while maintaining compliance with regulations makes the task of employing XAI
    significantly complex.


    # 5.1.6 Resource and Cost Constraints


    The adoption of any new technology necessitates substantial expertise, and XAI
    methods are no exception. Highly skilled professionals with specialised knowledge
    in this domain must be employed to utilise the technology effectively. Additionally,
    implementing XAI methods involves significant financial investment, which has
    limited its use primarily to top-tier hospitals and affluent individuals. Resource
    and cost constraints have further restricted the availability of these methods,
    making them inaccessible even for many well-off individuals in some cases [28-31].'
