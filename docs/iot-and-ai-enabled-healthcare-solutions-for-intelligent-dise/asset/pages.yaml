    # ## 3.3 Feature Importance Analysis


    As the name suggests, this is a procedure wherein all the features are assessed
    and it is then decided which of the features is more beneficial to the person
    undergoing treatment, then those features are more frequently made use of. In
    other words, this method in which features are analyzed enhances the decision-making
    ability of the concerned person whose end goal is to get a personalized features,
    which is suitable to his or her needs and the same thing is achieved by this method
    in a very elegant way. The features which are more desirable are then explained
    to the customer according to the norms of XAI which further enhances the decision-making
    capabilities of the person in question. This method employs the facility of permutation
    and tree-based models to produce its results. In the permutation, various selections
    of features are'
