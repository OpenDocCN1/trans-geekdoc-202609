    # 5. Challenges and Future Directions in XAI for CBGM


    # 5.1 Challenges


    No technology, however easy it makes life for human beings, is not foolproof;
    some uncertainties ought to be there and there would be some or the other challenges
    which could occur while trying to make full use of the technology. Explainable
    artificial intelligence methods have many types of challenges associated with
    them which need to be addressed to be able to use the methods to their proper
    fructification.


    # 5.1.1 Complex Data


    Someone who is suffering from diabetes and undergoing treatment requires a lot
    of care if the situation is on the end of the scale and the problem increases
    even more if it is a situation when anytime anything can happen. For this type
    of case, it becomes a necessity that almost all of the factors which could influence
    the health of that person are monitored and taken care of. Now if almost all the
    factors are taken care of then it would also lead to the generation of a lot of
    data talking about the handling of huge amount of data in future. Various readings
    involved could be the readings of glucose levels, meal which is consumed by the
    patient, the amount of physical activity done by the patient, and if applicable,
    the doses of insulin the patient is provided with.


    # 5.1.2 Model Comprehensibility


    XAI methods, when used for diabetes treatment, aim to make it easier for the patient
    to understand what the results mean but in many cases, it happens that in order
    to provide results which are easy to comprehend, it leads to compromises being
    made on the accuracy of the results. In the long term, it does more harm than
    good to the treatment procedure. So, this needs to be properly taken care of and
    a proper balance needs to be made which is actually a major challenge.'
