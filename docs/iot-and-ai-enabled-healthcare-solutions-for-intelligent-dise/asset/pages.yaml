  md: '# ## 3. Intelligent-Computer Interaction


    Human computer interaction (HCI) consists of various fields in which we study
    about the design, evaluation and applications of how humans interact with the
    computer system and how to use it. It involves studying the design, evaluation,
    and application of systems that enable humans to interact with computers. This
    interdisciplinary field covers topics such as interaction design, cognitive psychology,
    usability engineering, and user interface design. HCI plays a critical role in
    healthcare by facilitating user demands, aiding caretakers and health professionals,
    and optimizing IoT usability within the healthcare system [9, 10].


    # ### 3.1 Principles of HCI


    At its core, HCI is guided by several key principles that underpin the design
    of interactive systems. The idea of user-cantered design (UCD), which prioritizes
    the requirements, preferences, and abilities of users in the design process, is
    one essential idea. UCD places a strong emphasis on the value of comprehending
    users’ objectives, tasks, and usage contexts in order to design user interfaces
    that are simple to use, effective, and fulfilling [11].


    HCI usability is defined as the degree up to which a system may be used by the
    user effectively, efficiently and satisfactorily to achieve the specific goal.
    Usability can be defined as the learnability, efficiency, to keep in memory, to
    prevent an error and to make user happy. In designing the usability, it needs
    to conduct the user research, interactive prototyping, and test the usability
    to identify and address the various issues generated throughout the design process.
    In addition to these, HCI mainly focuses on the importance of consistency, feedback
    taken from the user, and how it is affordable to the design process. Consistency
    confirms that different actions taken from different portions of the interface
    provide the same consistent results; nonetheless, it will increase the ability
    to learn and lower the cognitive burden for the users. With the help of the feedback,
    timely information is given to the users about the results of the actions, which
    helps the users to understand and system respond so that they can take the decisions
    accordingly. The user is guided on how to use the system and interact with the
    interface, which helps in doing the task without the need for external support.


    # ### 3.2 Importance of HCI in IoT Healthcare Systems


    In the healthcare system supported by the IoT, HCI plays a critical role in designing
    the interface between the IoT devices, applications, services and users who will
    use these devices, services and applications. These systems take benefits with
    the help of IoT technologies with the uses of sensors, wearable devices and data
    analytics platforms with the help of which it can be continuously monitored. Despite
    that, IoT healthcare depends on the quality of HCI and it ensures how effectively
    a user can interact with the system and how much benefits it can take from the
    technologies [12, 13].'
