  md: '# ## 5. Conclusion and Future Work


    The number of Parkinson’s disease patients is increasing daily, and it has been
    observed that Parkinson’s disease is not strictly age-related. While it previously
    affected mainly elderly individuals, early-onset Parkinson’s disease is now being
    observed, possibly due to stress and lifestyle factors. Detecting Parkinson’s
    disease in its early stages has become a significant challenge. The handwritten-based
    detection method is considered a viable alternative to voice-based samples. Handwritten
    text samples were collected, preprocessed for feature extraction, and classified
    using multiple classifiers. Among these, the DLNN classifier demonstrated superior
    accuracy. A comparison of voice-based and handwritten datasets further confirmed
    the higher accuracy of HWDS.


    Future efforts may combine voice and text samples to develop a hybrid detection
    method that provides more accurate results with reduced time complexity.


