    # ## 3.3 Meta-Heuristic Algorithms in FS


    This ongoing study includes numerous metaheuristic algorithms, including the Harris
    Hawk Optimisation (HHO), Binary Bat Algorithm (BBA), Genetic Algorithm (GA), Grey
    Wolf Optimizer (GWO), and Cuckoo Search Optimisation (CSO). The next section presents
    an overview of these metaheuristic algorithms: HHO, BBA, GA, GWO, and CSO.


    # ### 3.3.1 Genetic Algorithm


    In 1960, John Holland devised the genetic approach (GA) to actually implement
    the assumption of “Darwin’s theory of evolution” [70–71]. This notion moves in
    the direction of fitness survival, removing species from the ecosystem that cannot
    fit or survive in the right environment. The algorithm starts with a random population
    and then applies three biological evolution operators: selection, mutation, and
    crossover, which are iteratively repeated until the desired outcome or series
    of ending circumstances is achieved. The desired properties of the realisation
    algorithm, namely exploration and exploitation, are mathematically realised using
    crossover and mutation operators. Various research problems are optimized using
    GA; the most common methods are image segmentation and image classification.


    **Application of Genetic Algorithm:** Hung and Wu [72] pioneered FCM (fuzzy c-means),
    a new clustering method that uses evolutionary algorithms to overcome FCM’s inadequacies
    in cluster finding. The use of genetic algorithms improves the accuracy of identifying
    the cluster center, detecting illnesses, and visualizing anatomical structure.
    The GFCM2G technique has been proposed to implement GAFCM on a range of embedded
    graphics processing unit-based devices. The proposed algorithm executes two parallel
    programming models to implement algorithmically and computationally. The first
    is Message-Passing Interface (MPI), which is a broadcast mechanism that carries
    out algorithm execution, and the second is Compute Unified Device Architecture
    (CUDA), which is used to improve the computational features of the MRI segmentation.
    De Carvalho Filho and colleagues developed a GA for detecting and categorizing
    solitary lung nodules. In terms'
