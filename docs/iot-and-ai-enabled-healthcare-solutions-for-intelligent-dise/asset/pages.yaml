  img_proc: true
- pgno: 207
  md: '# 2. Fundamental Concepts of IoT and AI


    # 2.1 What is IoT?


    The Internet of Things is basically a system of connected tangible physical objects
    through the use of sensors, software and any other appropriate technologies that
    enable them to share and gather information over the world wide web [5]. Internet
    of Things has presented itself as an influential technology in healthcare as it
    helps support constant and real-time tracking of patient condition. The notion
    of Internet of Things is not limited to medical tool only; it refers to wearable
    tools and applications, home automation applications, smart mobile applications,
    sensors, and even implantable sensors which constantly provide information and
    updates regarding a patient’s health condition.


    Connected devices in the health care sector are intended to monitor some of the
    essential body metrics including the heartbeat rate, blood pressure, glucose levels,
    oxygen in the blood, etc. Such devices capture information without need for daily
    interfacing with health care providers making the process cheaper and more effective.
    For example, smart watches and fitness trackers are not only able to provide real-time
    information about a patient’s heart rate to the patient but also to the physician
    as well, which is extremely helpful in cardiovascular health.


    There is no doubt that chronic disease and preventive care are where IoT in healthcare
    has a specific applicability. It also helps patients who have hypertension, diabetes,
    or heart diseases since the continuous data collected will help identify any form
    of abnormality early enough. Secondly, IoT aids RPM especially for the elderly
    patients or those in rural areas, hence they do not require to be physically present
    in the hospital to receive continuous check-up.


    IoT devices also provide real time information and therefore help enhance patient
    care by delivering individual treatment as per his peculiarities and habits. This
    changes the paradigm from bulk treatment to patient-oriented treatment resulting
    in better results and lower healthcare expenses.


    # 2.2 AI in Healthcare


    Artificial Intelligence can be defined as an application of computing systems
    to understand the human intelligence and conduct their tasks in a similar manner.
    AI has advanced enormously especially in areas such as forecasting the likelihood
    of a disease, diagnosing a condition and even devising a proper treatment regime.


    Machine Learning is a major part of AI, and as the name suggests, it is a process
    by which systems are designed to learn from data and become more efficient over
    time without code input [4]. Using sets of parameters, it is possible to train
    the ML algorithms to perform identification of certain patterns, highlighting
    that certain actions/objects are different from others, and making predictions.
    For example, imaging data can be used where the AI system would look through the
    images in an effort to identify signs of cancer or scan through EHRs to determine
    patients who are most likely to suffer complications.


    Another significant category of AI is deep learning that resembles the function
    of the human brain’s neurons through artificial neural networks. [3] Medical and'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'genomic applications represent some of the major areas where deep learning
    has been a success due to its capabilities in analyzing huge volumes of data as
    well as complicated information such as images. NLP is where AI has also been
    employed to evaluate unstructured data like clinical notes and reach other conclusions
    that the healthcare providers would otherwise not be able to identify.


    This brief includes some of the healthcare advantages that have now been made
    possible due to the use of artificial intelligence; perhaps one of the most beneficial
    of these is forecasting, where artificial intelligence uses prior data to anticipate
    a health-related event. These include using predictive models for such things
    as determining likely disease outbreaks, the rates of readmissions of patients
    to the hospitals, and the overall likelihood of a patient''s response to certain
    forms of treatment. This makes for a more preventive healthcare system which puts
    less pressure on healthcare facilities and offers better results in terms of the
    health of patients.


    # 2.3 Convergence of IoT and AI


    Although each of these technologies has disrupted the health care industry their
    impact is most profound when integrated together. IoT gives a constant feed of
    the real time data from different sensors and other devices while AI uses this
    data and churns out meaningful information as illustrated in Fig. 3. Collectively,
    they support smart surveillance systems that would allow for the early identification,
    early warning, and timely intervention on health events.


    From a heart rate point of view, smart wearables and other IoT devices capture
    ''heart rate variability,'' which is an indication of some conditions like stress,
    sleep problems, or other heart complications. Nonetheless, the amount of data
    yielded by IoT devices poses a challenge in the sense that the data generated
    is huge. This is where AI comes in. To put it simply, AI can take out the middleman.
    By the use of machine learning algorithms, AI can analyze data from IoT devices
    and identify existing health risks, as shown in Fig. 4.


    ![](img/a797255277085a0fa8aa2736cb720e31_208_0.png)'
