  md: '# ## 2.4 Artificial Intelligence Era


    Apart from blood testing, several other methods have emerged, each bringing unique
    functionalities and testing different biological indicators. For instance, the
    HbA1c test measures average blood sugar levels over two to three months, offering
    a broader perspective compared to point-in-time blood sugar checks. Additionally,
    interstitial fluids such as tears, sweat, and saliva have been explored for glucose
    level testing.


    Despite these advancements, continuous glucose monitoring remained a significant
    challenge until the advent of artificial intelligence (AI), the most transformative
    technological innovation to date. Initially, AI applications were concentrated
    in technology-related fields, but its immense potential led to its integration
    across various domains, with the medical field becoming one of its primary beneficiaries
    over time.


    AI has been incorporated into glucose level monitoring through wearable devices
    worn on the body, typically on the wrist, during the required measurement periods.
    These devices are equipped with sensors that measure glucose levels in real-time.
    Data related to insulin levels is transmitted via a wireless system to digital
    devices such as smartphones or smartwatches. This integration enables patients
    to self-monitor their glucose levels and take timely actions without constantly
    relying on medical supervision, as other aspects of life also demand attention.


    While a smartwatch specifically designed for glucose monitoring has yet to be
    developed—even by industry leaders like Apple—advancements in AI suggest that
    it is only a matter of time before such innovations become reality. Once realised,
    this development will revolutionise glucose monitoring, significantly reducing
    costs and making the technology accessible even to low-income individuals in developing
    nations [10].


    # ## 2.4.1 Why XAI?


    Using AI is fine, but what about the ethical implications and privacy concerns
    that come along with it? Not everyone is comfortable giving data related to their
    health to these so-called AI-enabled companies. However, AI relies on extensive
    datasets to improve its functionality, providing more accurate and efficient outcomes.
    To address these challenges and build trust, Explainable AI (XAI) was introduced.
    XAI serves as a framework to clarify the implications and consequences of using
    AI, helping individuals understand how their data is used and processed. By doing
    so, it alleviates discomfort and fosters confidence in data sharing. XAI employs
    a range of tools and methodologies to achieve its goal of transparency and trust-building,
    making it particularly valuable in the healthcare sector, where trust underpins
    the entire system. Through XAI, patients can better understand the role of their
    data in AI-driven medical analyses, encouraging them to share data when using
    glucose monitoring devices integrated with AI. Once enabled, this data can be
    analysed by AI to provide actionable insights, guiding patients in managing their
    glucose levels and avoiding severe complications. The trust fostered by XAI also
    enhances the reliability of machine learning (ML) models, as patients can raise
    questions and receive detailed explanations about the analysis process. Although
    implementing XAI involves selecting suitable methods and effectively communicating
    the results'
  merge: -1
  img_proc: true
