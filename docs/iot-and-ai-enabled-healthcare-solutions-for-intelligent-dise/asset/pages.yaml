    # 3.2.1 Support Vector Machine


    The approach of supervised learning can be used to explain regression and classification
    problems [66]. It is used to solve optimal classifying issues by determining the
    best line or hyperplane that distinguishes the classes from the data bounds of
    a feature vector or many vectors. SVM algorithms are commonly employed to categorize
    issues as a result of their promising results in a variety of applications. The
    margin and support vectors form the hyperplane. The data points or features nearest
    to the decision boundary (referred to as the hyperplane) that best illustrate
    the idea described by the term “support vector” are identified. SVM is an effective
    method for categorizing a large number of high-dimensional datasets for both linear
    and nonlinear data, which is one of its key advantages. SVM works well in high-dimensional
    data and is extremely successful since more samples have more features or genes
    than features or genes.


    # 3.2.2 Naïve Bayes


    It is one of the simplest classifiers, employing simple computations to classify
    new cases among assumptions of equal relevance to the predictor. It is initially
    based on the Bayes theorem [67]. It computes the posterior probability for each
    attribute across all classes based on the supplied data. It is based on the premise
    that feature values can be precisely approximated even when applied to massive
    datasets. This classifier can be used on data that is linear, exponential, or
    nonlinear. The key advantage of this classifier is that it can handle large amounts
    of data and perform better in complex models. However, because it is based on
    a presumption, the algorithm is imprecise, and the estimation probability is frequently
