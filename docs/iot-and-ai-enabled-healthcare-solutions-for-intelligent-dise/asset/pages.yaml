  md: '# # Nanorobots in the Treatment of Cancer

    A Revolutionizing and Precision Medicine

    With Advantages and Limitations


    Ayush Ranjan,¹ Ayasha Malik² * and Ayush Kumar Singh¹


    # ## 1. Introduction


    Earth has a total population of approx 8.2 billion and every year approximately
    9.7 million people die because of cancer, because of its late discovery, expensive
    treatment, painful treatment or no permanent treatment at all. Every year approximately
    17.5 million cases are encountered by doctors among which maximum cases lead to
    the death of the patient. The incidence rate has been increased by 33%. Cancer
    is the second cause of maximum death in people. The main cause of cancer is the
    lifestyle of the individual, habits like alcoholism, smoking which lead to the
    development of Carcinogens in the body of the individual.


    These Carcinogens lead to the formation of cancerous cells causing the uncontrolled
    multiplication of the cells leading to the formation of lumps initially and the
    formation of benign tumours. Some of these tumour cells are malignant having metastasis.
    This metastatic property leads to incurable cancer within the patient''s body.
    These cells migrate from one cancerous part to the other, and due to their angiogenic
    properties, they begin proliferating at the new location, leading to the development
    of cancer in a different part of the body.


    Some cancerous cells also possess the property of masking, allowing them to disguise
    themselves as normal cells. This enables them to evade detection and migrate from
    one location to another. Despite advancements in cancer treatment techniques such
    as chemotherapy, surgery, and radiation therapy, these methods'
  merge: -1
  img_proc: true
