    However, these methods are complex, difficult to understand, and prone to problems
    with extreme values, failing to cover the full range of data. Yasin Ozkanca, Miraç
    Göksu Öztürk, Merve Nur Ekmekci, David C. Atkins, Cenk Demiroglu, Reza Hosseini
