    # 3.3.2 Cuckoo Search Optimization


    Cuckoo optimization is the simulation of the behaviour of the “Cuckoo” bird. Cuckoo
    birds have a habit of laying eggs in the nests of other birds rather than their
    own. They pick the best spot for putting their eggs while simultaneously keeping
    the eggs secure. The host birds may learn that the eggs are not theirs. In that
    case, they will either dump the eggs or move their nest to a different area. The
    best location for egg laying is found by comparing the similarity of the host
    bird’s eggs to the availability of food [76].


    Application of Cuckoo Search Optimization: In their study, the researchers proposed
    an algorithm to aid in the diagnosis of lung tumours based on CT (computed tomography)
    images of the lungs. The programme also discovered stages and nodules of lung
    cancer. The Naive Bayes classifier categorized pictures by employing a neuro-fuzzy
    classifier with Cuckoo Search optimization [77]. Similarly, an algorithm was employed
    to predict diabetes and detect heart abnormalities. To extract and select the
    characteristics, Rough Sets and the Cuckoo Search Optimisation method were utilized.
    The solution outperformed current strategies as the number of attributes was lowered
    using Rough Sets. It was evaluated on datasets from Cleveland, Hungary, and Switzerland
    for heart illness and real-time data for diabetes prediction [78]. Jiang et al.
    proposed a hybrid feature selection approach that utilized mutually beneficial
