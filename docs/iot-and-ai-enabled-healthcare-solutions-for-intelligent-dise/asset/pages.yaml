    # 4. IoT-Based Heart Rate Monitoring Systems


    # 4.1 Wearable Devices and Sensors


    In the context of connected health and wellness, wearables as well as sensors
    are regarded as essential tools that can constantly track people''s heart rates
    [9]. Such gadgets are designed to be as unobtrusive as possible, comfortable to
    wear and operate, with the aim of monitoring physiological data constantly without
    interfering with the normal functioning of a person. The two widely known types
    of monitoring techniques that apply sensors to record heart rates are photoplethysmography
    (PPG) sensors and electrocardiographic (ECG) sensors. A comparison of PPG and
    ECG for heart rate monitoring is shown in Table 3.


    +   * Photoplethysmography (PPG): PPG is an optical method that is non-contact
    in nature and commonly employed in wearable systems such as smartwatches and fitness
    trackers to track heartbeat rates. PPG sensors establish alterations in blood
    volume under the skin surface by sending light and analyzing the returned signal.
    Due to the pulsatile nature of blood flow, which changes every time the heart
    beats, the amount of time taken to capture such a waveform is appropriate while
    ensuring the device delivers continuous heart rate monitoring. PPG is'
