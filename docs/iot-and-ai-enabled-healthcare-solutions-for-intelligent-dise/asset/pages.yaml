  md: '# # 1.3.1.3 Measuring Accuracy


    A confusion matrix is a key tool to evaluate a classification model. It gives
    you a breakdown of the model’s predictions so you can see the accuracy, precision,
    recall and other metrics in detail in Table 5.


    +   - **True Positives (TP):** Where it finds out the exact position of class.

    +   - **True Negatives (TN):** Where it finds out the negative nature of class.

    +   - **False Positives (FP):** Where it finds out the negative class as positive.

    +   - **False Negatives (FN):** Where it finds out the positive class as negative.


    The Confusion Matrix has the following metrics in the classification report: accuracy,
    precision, recall, F1-score, and specificity. Accuracy is the percentage of values
    that were expected. Precision is the percentage of positive values that were correctly
    predicted. The recall can be described as the proportion of true positives and
    all positively forecasted cases while precision is the percentage of perfect positive
    forecasts among all positively anticipated instances. F1-Score is the Harmonic
    mean of precision and recall. The specificity represents the proportion of truly
    recognized negatives to actual negatives.


