    # 4.1 Virtual Care


    Sometimes, due to the severity of a health condition or advanced age, individuals
    are unable to visit a hospital for treatment. This issue has been addressed through
    the use of virtual telehealth services, where treatment is provided remotely by
    healthcare professionals. This approach offers a significant advantage: unexpected
    situations can be effectively managed, as a healthcare provider is always available
    virtually to assist with diagnosis and treatment. Telehealth services also enhance
    personalised care by ensuring that patients can be attended to at any time by
    a specialist. It is worth noting that individuals with type 2 diabetes often have
    underlying conditions requiring attention alongside diabetes management. This
    form of addressing patient needs was first highlighted in Clinical Diabetes. Since
    these services are accessible at all times, patient outcomes have significantly
    improved, with better maintenance of glucose levels. Telehealth services frequently
    employ SHAP, an XAI method, to personalise treatment based on factors such as
    diet and physical activity, which are crucial to each individual’s lifestyle [25].


