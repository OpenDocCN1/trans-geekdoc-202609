  md: '# Chapter 5


    # Deep Learning Applications for Chronic Disease Detection and Prevention


    Shaheen Layqa¹,* and B. Manjula²


    # 1. Introduction


    Parkinson disease (PD) is a type of chronic disease which gets worst as time passes.
    In a survey by World Health Organization, it was found that PD is the second most
    common neurodegenerative disorder in the United States. PD cannot be trimmed completely
    by its root but it can be detected and prevented. To prevent and control PD, the
    Parkinson disease patient has to visit the clinic at regular basis and have medical
    examinations under supervision of trained medical staff. This is an inconvenient
    task as it is mostly found in aged people [1–2]. To make it convenient for all
    age group people, most of the medical doctors are dependent on the telemonitoring
    applications, which are found to be more reliable decision support systems. Parkinson’s
    disease patients can now collect data or perform tests at home, and through the
    internet, this data can be transmitted to a dedicated server.


    The cause of Parkinson disease may vary; however, it is mostly related to the
    genetic disorder, injury in brain, personal stress, nerve injury, life style and
    environmental related health problems and poor diet. It is observed that Parkinson
    disease shows impact mostly on speech, handwriting and walking [3]. As it is becoming
    a burning issue, most of the researchers are working on it and have suggested
    detection techniques which were dependent on voice data samples. The drawback
    with voice or speech data is that accuracy is very low and unreliable results
    were found due to lack of proper validation methodologies. If a patient is suffering
    with simple cough, cold, throat infection, stammer or dysarthria, then the voice
    samples are not so efficient to predict PD.


    ¹ Department of Computer Science, Singareni Women’s Degree & PG College, Kothagudem,
    Telangana, India.

    ² Department of Computer Science, Kakatiya University, Warangal, Telangana, India.

    * Corresponding author: mdshafeen1905@gmail.com'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'In this chapter, handwriting of a PD patient is considered as an alternative
    to voice data samples. The handwriting of a PD patient can be obtained using manual
    methods (paper and pencil) or computer-based methods. The computer based method
    is the most appropriate and commonly used nowadays.


    Due to the shaking or trembling caused by PD, patients are often unable to write
    legibly. Their handwriting becomes too small, unclear, and slanted. Therefore,
    handwritten data samples are more appropriate than the voice samples for PD detection.
    After collecting the handwritten dataset, the classification is done using one
    of the popular deep learning techniques known as Neural Network.


    Deep Learning Neural Network (DLNN) is based on artificial neural networks, and
    mimic the structure and function of the human brain. The DLNN is also able to
    support large amount of data. The block diagram of DLNN is shown in Fig. 1. The
    DLNN consists of three layers: input layer, hidden layer and output layer.


    As the PD cannot be detected using a single layer, multiple hidden layers are
    required, which can be efficiently done by the DLNN. Consequently, this chapter
    focuses on deep learning techniques instead of machine learning techniques. Finally,
    a comparison between machine learning technique and DLNN has been done, revealing
    that handwritten datasets perform better when analyzed using deep learning techniques.


    ![](img/a797255277085a0fa8aa2736cb720e31_85_0.png)


    # 2. Literature Survey


    Mahnaz Behroozi and Ashkan Sami worked on “A Multiple-Classifier Framework for
    Parkinson’s disease Detection Based on Various Vocal Tests [4]”. They tried to
    resolve the problems related to summarizing of vocal test data and single classifier.
    G. Dimauro, V. D. Nicola, V. Bevilacqua, D. Caivano, and F. Girardi proposed “Assessment
    of Speech Intelligibility in Parkinson’s Disease Using a Speech-To-Text System”
    [5]. The Google speech is used to convert speech into text but it requires language
    skills. Md. Tahmid Rahman Laskar, Md. Tahmid Hossain,'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Abu Raihan Mostofa Kamal, and Nafiul Rashid proposed “Automated Disease Prediction
    System (ADPS)” [6]. “User Input-based Reliable Architecture for Disease Prediction”
    completely depends on relevant attributes. L. Berus, S. Klancnik, M. Brezocnik
    and M. Ficko worked on Classifying Parkinson’s Disease Based on Acoustic Measures
    Using Artificial Neural Networks [7]. Betul Erdogdu Sakar, M. Erdem Isenkul, C.
    Okan Sakar, Ahmet Sertbas, Fikret Gurgen, Sakir Delil, Hulya Apaydin, and Olcay
    Kursun proposed “Collection and Analysis of a Parkinson Speech Dataset with Multiple
