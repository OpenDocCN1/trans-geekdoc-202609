    terminology. Here come the rule-based systems which give rule-based explanations
    which are in human-readable language. This system has been necessitated by the
    fact that a large majority of people who are undergoing diabetes treatment are
    not well versed with the jargon used when XAI methods are employed for measuring
    glucose levels continuously. Although many methods are available, many of them
    don’t provide easily interpretable results but the visualization achieve this
    goal with a certainty.


    As they say, “a picture speaks a thousand words”. So, what if instead of getting
