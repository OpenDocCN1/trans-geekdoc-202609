    # 4.2.1 Ensuring Transparency, Obtaining Consent from Patients


    Establishing trust in IoT-AI healthcare solutions will require attention to transparency
    and patient consent. This would imply that it has to be ensured that the patients
    are well-informed about their health data utilization, and specific consent must
    be acquired regarding its usage [24–25]. Apart from that, it should ensure explainability
    of AI algorithms to health providers and patients for transparency on decision-making.
    The entire process is shown in Fig. 4.


    This would entail some education on how data is collected, transmitted, and analyzed,
    together with the benefits and risks that such AI-driven healthcare solutions
    might pose, with clear and express consent for the use of personal health information
    [26]. AI decision-making processes have to be transparent, in the sense that health
    professionals and the patient have a right to know how AI algorithms come up with
    the decisions. It will build confidence in AI-led healthcare solutions and attract
    their use.


    ![](img/a797255277085a0fa8aa2736cb720e31_16_0.png)


    # Fig. 4. Process of obtaining patient consent for AI data usage.'
