    Fig. 1. Retinal fundus image structure [1].


    patterns connected to the illness, these models make use of a range of learning
    techniques, including supervised, unsupervised, and semi-supervised learning.
    This ability not only improves the precision of glaucoma prognoses but also facilitates
    more individualized methods in the diagnostic procedures, adjusting to the distinct
    ways that the illness presents itself in each patient. Furthermore, improvements
    in algorithm development and data availability have had a significant positive
    impact on the field of machine learning in glaucoma detection.


    The area of ophthalmology has seen a change in the diagnostic environment due
    to the integration of artificial intelligence, alongside technological improvements.
    The screening and early diagnosis of glaucoma can greatly benefit from artificial
    intelligence’s and machine learning’s capacity to process vast amounts of data
    quickly and accurately. These tools help doctors by offering thorough assessments
    of intricate imaging data, which lowers the possibility of human error and speeds
    up diagnosis. The use of AI technologies not only optimizes diagnostic processes
    but also guarantees prompt and precise evaluations for patients, which may save
    vision in vulnerable populations [2].


    # 2. Related Work


    Identification and tracking of glaucoma progress mostly through retinal imaging.
    Even though early glaucoma is frequently characterized by a lack of distinct symptoms,
    retinal imaging can provide information on the condition of the optic nerve and
    retinal nerve fiber layer (RNFL) [3]. An ophthalmologist can accurately inspect
    the back of the eye to look for any telltale signs of glaucomatous damage using
    a high-resolution retinal image. A retinal exam is the term for this process.
    Two examples of these include RNFL weakening, which is an abnormal expansion of
    the layer of nerve fibers that transmits visual information to the brain, and
    optic disc cupping [4, 5]. Ophthalmologists can diagnose and treat glaucoma before
    it causes clinically significant vision loss by looking for these characteristics
    on retinal'
