  md: '# 2.6 ResNet50


    A 50-layer residual network with 26 million parameters is called ResNet50. Microsoft
    unveiled the residual network, a deep convolutional neural network model, in 2015
    [27]. Instead of learning features, we learn from residuals in a residual network,
    which are the features that are subtracted from the inputs of each layer (as shown
    in Fig. 5). ResNet propagated information between layers via the skip connection.
    ResNet allows for the direct connection of nth layer input to some (n+x)th layer,
    allowing for the stacking of further layers and the establishment of a deep network.
    In our experiment, we employed and refined a pre-trained ResNet50 model.


