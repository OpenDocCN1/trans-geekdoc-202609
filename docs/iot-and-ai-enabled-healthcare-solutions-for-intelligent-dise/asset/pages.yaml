  md: 'images, Convolutional Neural Networks have successfully predicted diabetes
    complications. When compared to more conventional diagnostic methods, CNN-based
    models have shown to be more sensitive and specific in detecting diabetic retinopathy
    and other complications [17].


    +   - **Support Vector Machines (SVM) and Random Forests:** In medical field,
    these ML systems were used to forecast diabetes from pictures. The classification
    of whether a patient has diabetes or not by analysing picture structures could
