    # 2.3 VGG-19


    The pre-trained VGG-19 has an input size of 224 x 224 x 3 and is recommended for
    use in deep network techniques. They are taught to recognize human genders, fingerprints
    and signatures.


    VGG-19 has 16 convolutional layers, 5 convolutional layers, and 3 correlation
    layers in total. The size of the resulting feature map is 224 x 224 x 64, and
    the first convolutional layer has 64 channels of length 3X3. VGG-19 uses a Linear
    Adjustment Unit, a non-linear activation function that transforms the output of
    a convolutional layer into a non-linear product, which is shown in Fig. 3. ReLU
    is defined to replace negative values with zero.


    # 2.4 EfficientNet


    Convolutional neural networks in the EfficientNet family scale up effectively
    in terms of input resolution, layer width, layer depth, or a combination of all
    three, which is shown in Fig. 4. Using EfficientNet, we can extract features from
    images and feed them into a classifier. This makes it possible for EfficientNet
    to function as the foundation for numerous additional models, including the object
    detection model family EfficientDet. These days, we can import a custom dataset
    and train EfficientNet with just a few lines of code because this version of EfficientNet
    is implemented in abstracted Keras.'
