  md: '# 3.1 Preprocessing Techniques for Retinal Images


    +   * Visibility Enhancement: Key features including the optic disc and retinal
    nerve fibre layer become more visible when contrast is adjusted.


    +   * Artifact Removal: Two techniques are used to remove noise from the photos:
    median filtering and Gaussian blurring.


    +   * Study focus: By identifying retinal regions of interest (ROI), one can lower
    processing demands and focus the investigation on areas crucial to accuracy [16].


    # 3.2 Machine Learning in Glaucoma Detection


    It is well known that supervised learning algorithms may be used to recognize
    glaucoma in retinal pictures by using labeled data to find traits that are suggestive
    of the illness. The role played by supervised learning techniques includes:


    +   * Support Vector Machine (SVM): This technique effectively differentiates
    between normal and glaucomatous eyes by classifying images based on parameters
    like the cup-to-disc ratio.


    +   * Decision Trees: These provide a clear path for decision-making by classifying
    data based on a hierarchy of picture feature decisions.


    +   * Neural Networks: Before deep learning took over, conventional neural networks
    were utilized for feature extraction and classification, albeit they had issues
    with unstructured picture data [17].


    # 3.3 Exploring Unsupervised and Semi-supervised Learning


    As unsupervised learning advances, it has great potential for glaucoma diagnosis.
    Without labeled data, it is mostly used to identify disease patterns or subtypes
    that may have gone undetected in the past. This method makes it possible to investigate
    innate structures in the data, which may provide fresh perspectives on the appearance
    or course of the illness. In addition, unsupervised learning methods can help
    group comparable data points together, which makes it easier to identify different
    glaucoma phenotypes or subgroups. However, by using both labeled and unlabeled
    data, semi-supervised learning fills the gap between supervised and unsupervised
    methods. This approach is especially useful in situations where there are few
    annotated images, which is a common shortcoming in medical imaging datasets. The
    role of unsupervised learning in glaucoma detection is developing; it is mostly
    applied to identify disease patterns or subtypes that have not been identified
    before without labelled data. By utilizing both labelled and unlabelled data,
    semi-supervised learning fills the gap and is especially helpful when the number
    of annotated photos is restricted [18].'
