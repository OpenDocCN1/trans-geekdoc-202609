    Table 5. The below metrics were used to evaluate the performance of the machine
    learning model.


    | Metric | Definition |

    | :--- | :--- |

    | Accuracy | The proportion of correctly predicted instances among the total cases.
    |

    | Sensitivity (Recall) | The ability of the model to correctly identify positive
    cases (true positives/(true positives + false negatives)). |

    | Specificity | The ability of the model to correctly identify negative cases
    (true negatives/(true negatives + false positives)). |

    | Precision | The proportion of true positives among all optimistic predictions
    (true positives/(true positives + false positives)). |

    | F1 Score | The harmonic mean of precision and recall balances the two metrics.
    |

    | Area Under the Curve (AUC) | Fig. 2 shows the area under the Receiver Operating
    Characteristic (ROC) curve indicates the model''s ability to distinguish between
    positive and negative cases. |

    | Confusion Matrix | This table describes the classification model''s performance,
    showing true positives, false positives, and false negatives. |'
