- pgno: 87
  md: '![](img/a797255277085a0fa8aa2736cb720e31_87_0.png)


    Fig. 2. Framework for the proposed model.


    +   • Feature selection: The feature selection is done to make the overall process
    accurate. Feature selection is the process of selecting a subset of relevant features
    (variables). There are three feature selection methods: Wrapper Method, Filter
    Method and Embedded Method. In the proposed method, deep learning is one of the
    most important filter based technique, i.e., Pearson correlation coefficient is
    used. The mostly and highly correlated features are identified by the pearson
    correlation. The Pearson correlation coefficient of each feature is calculated
    by using following formula.


    ```

    r = \frac{n(\sum xy) - (\sum x)(\sum y)}{\sqrt{[n \sum x^2 - (\sum x)^2][n \sum
    y^2 - (\sum y)^2]}}

    ```


    +   where,

    +   r = Pearson Coefficient

    +   n = Number of pairs of the stock

    +   \sum xy = Sum of products of the paired stocks

    +   \sum x = Sum of the x scores

    +   \sum y = Sum of the y scores

    +   \sum x^2 = Sum of the squared x scores

    +   \sum y^2 = Sum of the squared y scores


    All the HWDS features are not relevant, so only important features are considered.


    +   2. Classification and Majority Voting: Once feature selection for each subset
    is completed, a DLNN classifier is built for each subset. Subsequently, majority'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'voting is performed across classifiers to determine the class to which a person
    belongs. If the voting value equals one, the individual belongs to the Parkinson''s
    disease class (PD = 1); otherwise, if the voting value equals zero, the individual
    belongs to the non-Parkinson''s disease class (NPD = 0).


    # 3.1 Proposed Algorithm


    Algorithm: Handwritten Parkinson Disease Detection (HWPDD).

    [This algorithm is proposed for detection of Parkinson disease using handwritten
    dataset]

    Input: Handwritten dataset (HWDS) consist of a1,a2,...,an attributes (variables)
    which represents label of class and b1,b2,...,bn records.

    Output: By applying majority voting, the count of healthy individuals and Parkinson''s
    disease patients is determined.


    +   Step 1: Handwritten dataset samples are extracted and stored in TBDS

    +   Import pandas as pd

    +   TBDS <- pd.read_csv (''HWD.csv'')


    +   Step 2: Each record of TBDS is extracted and stored in subset dataset (SubsetDS).

    +   Each subset consists of same type of instances.

    +   SubsetDS <- TBDS . iloc[1:77]


    +   Step 3: On each subset dataset, feature selection is performed and stored
    in feature selection Text Based Dataset (fsTBDS).

    +   for i <- 1 to 77

    +   fsTBDS<- Pearson_cofficient_correlation (SubsetDS[i])


    +   Step 4: The Deep Learning Neural network classifier is performed on the feature
    selection Text Based Dataset (fsTBDS) and stored in classified Text Based Dataset
    (ClassifiedfsTBDS ).

    +   ClassifiedfsTBDS <- DLNN_Classifier(fsTBDS)


    +   Step 5: Each DLNN classifier produces 0 or 1 values: ‘0’ means NPD and ‘1’
    means PD.

    +   Later, using these values, majority voting is done and final decision has
    been taken.

    +   VotingClassifier(classifiedfsTBDS)


    +   Step 6: End.


    The overall time complexity for proposed algorithm is O(n).


    # 4. Experimental Results and Discussion


    # 4.1 Dataset


    The Parkinson''s disease and control handwriting database was created by the Department
    of Neurology at the Cerrahpaşa Faculty of Medicine, Istanbul University [16].
    The database consists of a total of 77 handwriting samples, 62 of which are from
    Parkinson''s disease patients, while the remaining 15 are from healthy individuals.'
