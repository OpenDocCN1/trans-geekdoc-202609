    layers, flattening operations, dense layers for pattern detection, and dropout
    for regularization.


    # 2.2 VGG16


    The VGG16 architecture is currently one of the most effective vision network architectures.
    VGG16 distinguishes itself by prioritizing the use of 3 × 3 filter convolution
    layers over creating large hyperparameters. The architecture employs 2 × 2 max
    pooling layers and padding consistently. This organization places the max pooling
    layers after the convolution layers throughout the entire architecture. The network
    begins with 64 3 × 3 single filters to detect lines, corners, and edges in images.
    A convolution layer follows the max pooling layer, utilizing a 2 × 2 kernel size
    to summarize the values from the image array. Each convolution layer in the architecture
    maintains the layout and uses 128, 256, and 512 filters with 3 × 3 dimensions.
    The ReLU (Rectified Linear Unit) activation function is applied at every convolution
    layer to activate the network''s neurons (shown in Fig. 2). To classify the brain
    tumor, two fully connected layers with ReLU activation are included in the architecture,
    followed by the softmax function for the final classification [12].


    The VGG16 network has more than 138 million parameters, making it one of the largest
    models available. More convolution layers aid in the VGG16''s ability to extract
    information from the image that is hidden. The image dimension (224, 224, 3) is
    the network input. The first two layers assume 64 channels with a 3*3 filter size
    and the same amount of padding. Two layers have convolution layers with 256 filter
    size and (3,3) filter size after the stride of max pooling layer (2,2) [12]. The
    greatest pooling layer of stride (2,2), which is like the previous layer, comes
    after it. Next, two sets of three convolution layers with 256 and (3,3) filter
    sizes are present. Next, these sets consists of max pool and convolution layer.
    Each one has 512 filters with the same (3,3) size.


    It makes use of 1*1 pixels in some layers to change the quantity of input channels.
    To avoid the spatial image feature, a 1-pixel padding (or comparable padding)
    is applied after each convolution layer. Following the stacking, max-pooling,
    and convolution processes, seventy-seven thousand feature maps are obtained. Feature
    vectors are used to flatten the output. Then, there are three FL layers: the first
