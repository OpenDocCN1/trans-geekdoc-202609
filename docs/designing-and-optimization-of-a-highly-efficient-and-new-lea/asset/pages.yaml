    # 3.5. machine learning


    As discussed in the methodology section, machine learning (ML) algorithm was used
    to develop an ML model, trained on a dataset of 1008 data points. This model was
    employed to plot the values predicted by the ML model, achieving an R² of 0.9985,
    as shown in Fig. 10. The trained model was used to generate a SHAP plot to relate
    the effects of each layer on performance. stability of cell, the power conversion
    efficiency (PCE) is shown in Fig. 11. SHAP plot confirms that Thickness is the
    most influential factor in PCE prediction, with higher density leading to higher
    PCE. Defect Density has a negative effect on PCE, while higher roughness shows
    positive relationship with PCE. Its impact might depend on the values of other
    features.


    This model was further illustrated to calculate root square error (RMSE) of 0.2712.


    absorber thickness enhances the efficiency and performance of $Cs_{2}RbGaIn_{6}$
    solar cells. Fig. 9 shows the effect of Absorber thickness on PCE parameters.
    Thickness was measured in 100 nm, while keeping other parameters constant. PCE
    reached a peak of 22.72 at 110 nm due to better absorption. However, beyond 110
    nm, recombination causes a decline in efficiency. Fill Factor (FF) and $V_{OC}$
    showed a decrease with increase in absorber thickness, whereas increase was also
    observed with an increase in PCE. It was also observed that after 600 nm, further
    gains in PCE were minimal due to recombination [37]. However, 600 nm was identified
    as the optimal thickness. Thickness selection is crucial to minimize recombination
    while maintaining performance, as excessive thickness increases losses and reduces
    $V_{OC}$ and FF due to higher series resistance [26]. Optimum PCE of 22.17 was
    observed at the thickness of 600 nm.'
