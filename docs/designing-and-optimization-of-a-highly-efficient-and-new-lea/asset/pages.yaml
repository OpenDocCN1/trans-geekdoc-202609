    # Designing and optimization of a highly efficient and lead-free $Cs_2RbGa_6$,
    based perovskite solar cell through SCAPS-1D and machine learning


    Vishal Deshmal*, Sarita Baghel*


    Renewable Energy Research Laboratory, Department of Applied Physics, Delhi Technological
    University, India


    # ARTICLE INFO


    # ABSTRACT


    +   Keywords:

    - Machine Learning

    - Double Perovskite Solar Cell (DPSC)

    - SCAPS-1D


    Lead-free perovskite materials have emerged as an alternative non-toxic semiconductor
    material for cells with exceptional performance, stability and stability. This
    work focuses on optimizing Cs2RbGa6 based perovskite solar cell (DPSC) through
    SCAPS-1D simulation and machine learning. We calculated material properties, like
    the density of states and carrier mobility, using data reported in the literature.
    Some other properties, like electron affinity, defect density, and absorber thickness,
    were optimized using SCAPS-1D software. The suitable Electron Transport Layer
    and Hole Transport Layer were also considered. We found optimized parameters to
    achieve a PCE of 22.17%. Machine learning helps verify scientific claims and scientific
    discovery and research gaps. In the recent increase in the use of machine learning
    in science, we developed a machine learning model with SHAP summary plot to analyze
    the impact of thickness and depth of absorber layer, with device operating temperature
    of the DPSC. To develop this machine learning model, 1008 data points were generated
    through SCAPS-1D simulations.


    # 1. Introduction


    Perovskite materials have emerged as contender to replace traditional Si-based
    solar cells due to their remarkable optoelectronic properties [1–5]. Stability
    of highly and efficient perovskite solar cells is based on limiting their usage
    [6–8]. To overcome these limitations, the scientific community has discovered
    double perovskite materials (DP). These double perovskite solar cells (DPSCs)
    offer many advantages like high stability and non-toxicity to make them both stable
    and efficient an excellent choice.


    In a recent study, Cs2RbGa6, having a band gap of 1.8 eV has reported its interesting
    optoelectronic properties for photovoltaics in [9]. The material requires further
    exploration to investigate its use as a solar cell. In this study we used of reported
    material properties to calculate density of states and carrier mobility, thereby
    designing a DPSC based on Cs2RbGa6, and optimized various properties like defect
    density, electron affinity, thickness of absorber layer, thickness of ETL and
    HTL,


    operating temperature.


    The implementation of machine learning (ML) techniques in photovoltaics is helping
    to streamline the process of device design and improve efficiency (PCE) [10].
    Compared to traditional simulation methods, ML models provide a faster, more time-efficient
    approach, even without deep expertise in processing or interpreting the simulation
    results [11]. Many ML techniques such as artificial neural networks (ANNs), support
    vector machines (SVMs), random forests (RFs), and XGBoost (XGB), have become easily
    accessible [12]. These algorithms use large datasets to produce predicted results,
    which are based on input variables, and target characteristics. Their ability
    to detect patterns and correlations within the data allows ML models to capture
    insights that investigators might not reveal.


    Moreover, as ML continually learns from available data, they become better at
    predicting PCE by adapting to factors like evolving material properties, changing
    environmental conditions, and,


