    Additionally, we developed a machine learning (ML) model capable of analyzing
    the various feature values and predicting the solar cell efficiency with these
    inputs. We trained the model with 1000 data points from simulations in SCAPS-1
    using device operating temperature, layer thickness, and defect density, achieving
    an R² of 0.9985, indicating a high predictive accuracy. A SHAP summary plot was
    used to interpret the model, showing among the three features, temperature has
    the most significant impact on PCE. Additionally, defect density showed a complex
    relationship with PCE, indicating that its impact depends on the values of other
    features. Using a custom Python script, we obtained ML predicted PCE of 22.56
    %, matching the 22.17% from simulations.


    This study explores the potential of perovskite-based solar cells through experiments,
    with the findings here are helpful for enhancing PCE durability. It highlights
    the value of ML in analyzing the impact of various factors on solar cell performance
    and emphasizes the importance of simulation-based methods for achieving accurate
    results in shorter time.


