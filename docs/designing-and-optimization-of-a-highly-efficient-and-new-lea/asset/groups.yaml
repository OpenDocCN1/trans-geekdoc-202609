    # 2. 方法论


    ## 2.1. 仿真方法


    在本研究中，我们使用太阳能电池模拟器 (SCAPS) 对太阳能电池器件进行数值仿真，同时考虑了太阳能电池特性之间的解耦关系。


    我们首先制造并设计了器件结构，包括吸收层、电子传输层 (ETL) 和空穴传输层 (HTL)。这些层的材料属性来自之前的研究。计算了吸收层的某些材料属性。计算了载流子密度和迁移率，并在工作中优化了其他电子亲和力、密度和厚度。


    优化器件结构后，我们开发了一个机器学习模型。在几个模型中，选择了随机森林，因为它产生的 $R^2$ 值为 1。该模型使用 1008 个点的数据集训练，然后通过改变参数进行仿真优化。吸收层受太阳能电池温度变化的影响。这些值取决于功率效率
    (PCE) 的定义。生成了比较结果与机器学习模型预测值的对比图表。同样，我们创建了 SHAP 摘要图，有助于识别各种参数对 PCE 的影响并进行比较。我们还添加了一个
    Python 脚本，可以根据三个输入参数预测设备的 PCE。最后，我们将机器学习预测的 PCE 与仿真得到的结果进行了比较。图 2 详细表示了机器学习分析的工作流程。


