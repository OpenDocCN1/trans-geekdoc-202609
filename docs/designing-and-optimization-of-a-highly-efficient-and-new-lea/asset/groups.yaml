    # 基于 SCAPS-1D 和机器学习的高效无铅 $Cs_2RbGa_6$ 钙钛矿太阳能电池的设计与优化


    Vishal Deshmal*, Sarita Baghel*


    印度德里科技大学应用物理系，可再生能源研究实验室


    # 文章信息


    # 摘要


    - 关键词：

    - 机器学习

    - 双钙钛矿太阳能电池 (DPSC)

    - SCAPS-1D


    无铅钙钛矿材料已成为具有卓越性能、稳定性和可靠性的替代无毒半导体材料。本工作重点关注通过 SCAPS-1D 仿真和机器学习优化 $Cs_2RbGa_6$ 基钙钛矿太阳能电池
    (DPSC)。我们利用文献报道的数据计算了态密度和载流子迁移率等材料属性。使用 SCAPS-1D 软件优化了电子亲和力、缺陷密度和吸收层厚度等其他属性。还考虑了合适的电子传输层（ETL）和空穴传输层。我们找到优化参数实现了
    22.17% 的 PCE。机器学习有助于验证科学主张、科学发现以及研究空白。随着近期机器学习在科学领域使用的日益增加，我们开发了一个带有 SHAP 摘要图的机器学习模型，以分析吸收层厚度和深度对
    DPSC 设备工作温度的影响。为了开发这一机器学习模型，通过 SCAPS-1D 仿真生成了 1008 个数据点。


    # 1. 引言


    钙钛矿材料因其卓越的光电性能已成为取代传统硅基太阳能电池的竞争者 [1–5]。高效钙钛矿太阳能电池的稳定性取决于对其使用范围的限制 [6–8]。为了克服这些限制，科学界发现了双钙钛矿材料
    (DP)。这些双钙钛矿太阳能电池 (DPSCs) 具有高稳定性和无毒等优点，使其成为既稳定又高效的极佳选择。


    在最近的研究中，带隙为 1.8 eV 的 $Cs_2RbGa_6$ 在 [9] 中报道了其有趣的光电特性。该材料需要进一步探索以研究其作为太阳能电池的应用。在本研究中，我们利用报道的材料属性计算态密度和载流子迁移率，从而设计了基于
    $Cs_2RbGa_6$ 的 DPSC，并优化了缺陷密度、电子亲和力、吸收层厚度、ETL 和 HTL 厚度以及工作温度等属性。


    机器学习 (ML) 技术在光伏领域的应用有助于简化设计流程并提高效率 (PCE) [10]。与传统的仿真方法相比，机器学习模型提供了更快速、更高效的方法，即使在没有处理或解释仿真结果深层专业知识的情况下
    [11]。许多机器学习技术如人工神经网络 (ANN)、支持向量机 (SVM)、随机森林 (RF) 和 XGBoost (XGB) 已经变得容易获取 [12]。这些算法利用大型数据集产生基于输入变量和目标特性的预测结果。它们检测数据内部模式和相关性的能力允许机器学习模型捕捉研究人员可能未发现的见解。


    此外，随着机器学习从可用数据不断学习，它们通过适应不断演变的材料属性、变化的环境条件和设备架构的转变，变得越来越能够预测 PCE [12–15]。这种适应性允许基于机器学习的模型在计算效率和速度上超过仿真器，而牺牲了准确性。这对于钙钛矿太阳能电池
    (PSC) 设计、优化和材料筛选等任务特别有利。


    由于 DFT 计算的耗时性，对于研究人员并不合适。为了仿真获得这些特性的近似值，我们可以重复 DFT 计算或使用泛函半导体方程。


    机器学习在处理复杂数据集和可靠预测方面正变得越来越普遍 [16]。这些整合多种机器学习算法的模型能够处理大数据集和稳健的变化，使其成为提高 PCE 和光伏研究的价值资产。


    $$q_m = \frac{\mu_e \mu_h}{\mu_e + \mu_h}$$


    与传统的仿真技术相比，PSC 可以更加灵活、准确和高效 [10]。


    $$L_m = \sqrt{\mu_h \tau_h}$$


