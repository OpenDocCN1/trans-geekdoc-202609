    使用 SCAPS-10 仿真生成了一个包含 1008 个点的初始数据集，随后用于训练我们的机器学习模型。通过 SHAP 摘要分析进行测试，显示了 PCE 的清晰度、缺陷和密度性能。我们的机器学习模型预测的结果与值几乎相同，这由高
    $R^2$ 值所示。


    $$40qa = \frac{\mu_e \mu_h}{\mu_e + \mu_h}V_n$$


    在这里，$\mu_h$ 是电子/空穴的迁移率，$m^{e,h}$ 是它们的有效质量。$\tau$ 是弛豫时间，$L_m$ 是平均路径。$V_t$ 代表 300
