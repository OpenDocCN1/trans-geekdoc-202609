    | 参考文献 | [17] | [14,17,18] | [21,29] |


    用于仿真的材料属性


    ## 3.2. 吸收层的优化


    吸收层与 ETL 之间的带对齐在控制界面复合方面起着作用，从而影响开路电压 ($V_{oc}$)。调整吸收层的亲和力会影响 $J_{sc}$、填充因子 (FF)
    和光电效率 (PCE)。图 7 显示了电子亲和力对各种 PSC 参数的影响。结果从 3.5 eV 变化到 6 eV，当亲和力为 0.4 eV（例如 3.5
    eV）时器件表现出最佳性能；亲和力过低会作为吸收层/ETL 界面空穴流的屏障，从而增加复合，导致较低的 PCE 和 FF，如 [35,36] 所示。然而，与
    ZnO 结合时为了增强钙钛矿太阳电池 (PSC) 性能，分别实现了 22.17% 和 21.86% 的效率，因此建议 CBTS 作为最佳 HT 材料，它具有可调的光隙和光吸收。其非中心对称晶体结构和尺寸使其使其太阳电池
    PCE 的理想选择 [24,34]。


    ## 3.3. 缺陷密度优化


    ![](img/77993b86c321119fe49a6d1f762f7a1_2_0.png)


    图 1. 不同 DPSC 层的结构和带对齐。


    ![](img/77993b86c321119fe49a6d1f762f7a1_3_0.png)


    图 2. 机器学习工作流。


    ![](img/77993b86c321119fe49a62d1f762f7a1_3_1.png)


    图 (a) 带 HTL 和 IGTO 的 PSC J-V 曲线，(b) 带 HTL 和 IGTO 的 PSC PCE、FF 和 $V_{OC}$。PCE 为
    22.17%。


    在保持厚度为 600 nm 时，吸收层中的缺陷密度 ($N_t$) 以 10 为增量进行变化。改变了 ETL、HTL 和吸收层的所有参数。发现高缺陷密度会导致电池效率降低。当
    $N_t$ 为 $10^{14}$ $cm^{-3}$ 时， PCE 为 23.76%，之后开始下降，并在 $N_t$ 超过 $10^{15}$ $cm^{-3}$
    时观察到 PCE 显著下降。如下所示，在 $N_t$ 为 $10^{16}$ $cm^{-3}$ 时，FF 和 $V_{OC}$ 也观察到类似的趋势。从这些结论中，我们可以优化
    $N_t$ 为 $10^{14}$ $cm^{-3}$ 的器件值，使其获得 22.17% 的 PCE。活性层中的缺陷浓度是决定器件效率的关键因素。高缺陷水平会导致复合率，引发膜降解、针孔形成和稳定性下降等问题，所有这些都会负面影响器件性能
    [17]。


    ## 3.4. 厚度优化


    使用 SCAPS-1D 进行批量仿真以评估


    ![](img/77993b86c321119fe49a62d1f762f7a1_4_0.png)


    图 4. (a) 带 HTL 和 TiO 的 DPSC J-V 曲线，(b) 带 HTL 和 TiO2 的 DPSC PCE、$J_{SC}$ 和 $V_{OC}$。


    ![](img/77993b86c321119fe49a62d1f762f7a1_4_1.png)


    图 5. (a) 带 HTL 和 ZnSe 的 DPSC J-V 曲线，(b) 带 HTL 和 ZnSe 的 DPSC PCE、FF、$J_{SC}$ 和
    $V_{OC}$。


    ## 3.5. 机器学习


    如方法论所述，使用机器学习 (ML) 算法开发了模型，实现了 0.9985 的 $R^2$，如图 1 所示。SHAP 图证实了厚度是影响 PCE 最大的因素。缺陷密度对
    PCE 有负面影响，较高的密度会导致较低的 PCE。


