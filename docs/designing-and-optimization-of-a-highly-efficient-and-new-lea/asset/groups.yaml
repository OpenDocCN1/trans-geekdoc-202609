    PCE 增加了近 2%。这一观察表明，较薄的 ETL 会导致更好的太阳电池效率。然而，由于这种 ETL 厚度的 PCE 增加并不显著，对于 HT 的 200
    nm 阈值，选择了文献 [31] 所示的 ETL 厚度，以确保吸收层更大的透明度。


    # 表 3


    | 材料属性 | ZnO | TiO2 | IGZO |

    |---|---|---|---|

    | 厚度 (nm) | 100 | 100 | 100 |

    | $V_{oc}$ (V) | 0.69 | 2.81 | 3.05 |

    | $J_{sc}$ (mA/cm²) | 5.8 | 9 | 6.10 |

    | $FF$ (%) | - | 8 | 16 |

    | $N_t$ ($cm^{-3}$) | $2.2 \times 10^{16}$ | 18 | $5 \times 10^{18}$ |

    | $N_d$ ($cm^{-3}$) | $1.8 \times 10^{18}$ | $1.8 \times 10^{17}$ | $5 \times
    10^{14}$ |

    | $V_c$ (cm) | 1 | 1 | 1 |

    | $N_t$ | $10^{16}$ | $10^{16}$ | $10^{16}$ |

    | $\mu_e$ ($cm^2/Vs$) | 400 | 20 | 15 |

    | $N_d$ ($cm^{-3}$) | 1 | 10 | $9 \times 10^{16}$ |

    | $N_a$ ($cm^{-3}$) | 1 | 1 | $1 \times 10^{17}$ |

