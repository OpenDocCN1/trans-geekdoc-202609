    ETL 和 HTL 在光伏器件内部电荷传输中非常重要。吸收层的电子必须离开，而 ETL 确保空穴的有效运动。空穴传输对于避免复合至关重要，有助于产生更有效的电流并提高光伏设备的
    PCE。


    选择这些 ETL 和 HTL 材料是因为它们在研究中的成功应用，我们在其中研究了它们集成到太阳能电池中的效率和其他优势属性 [17,19,21-32]。表
