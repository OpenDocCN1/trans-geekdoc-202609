    该模型将预测相同器件的 PCE。对于经过 SCAPS 优化的 DPSC 测试，在运行代码时在提示词中输入了特征值，即：600 nm 的厚度、10⁴ cm⁻¹
    的缺陷密度以及 300 K 的温度。ML 模型预测的 PCE 为 22.56%，这与模拟的 22.17% 非常接近。


    ### 4. 结论


    在本研究中，我们全面研究并优化了 Cs2RbGaIn 无铅双钙钛矿太阳能电池 (DPSCs)，这是一种用于太阳能应用的高效材料。我们计算了 Cs2RbGaIn
    的基本材料属性，如密度、导带以及载流子迁移率。还模拟了包括电子亲和力、密度和吸收层厚度在内的属性。


    我们还优化了电子传输层 (ETL) 和空穴传输层 (HTL)，发现 ZnO 和 CsBT 具有最佳的光电转换效率 (PCE)，并以此推荐。通过等线图分析了
    ETL 和 HTL 厚度的影响，发现较厚的 HTL (100 nm) 可以提高效率。我们还研究了电子亲和力对器件的影响，确定 4 eV 为最佳值。进一步分析了缺陷密度对器件性能的影响，结果显示，电池在优化选取值
    10⁴ cm⁻¹ 的这一较高缺陷密度下即可实现高效率。吸收层厚度在 100 nm 到 160 nm 之间变化，选择 600 nm 为理想厚度。


    图 10. ML 模型预测的 PCE 与通过模拟获得的实际 PCE 值的对比图。ML 模型的 R 值高达 0.9985。


    此外，我们开发了一个机器学习 (ML) 模型，该模型能够分析各种特征值并根据这些输入预测太阳能电池效率。我们使用来自 SCAPS-1 真的 1000 个数据点对模型进行训练，包括器件工作温度、层厚度和缺陷密度，其
    R² 达到 0.9985，表明具有高的预测准确性。使用 SHAP 摘要图来解释模型，显示在三个特征中，温度对 PCE 的影响最显著。此外，缺陷密度与 PCE
    之间存在复杂的关系，表明其影响取决于其他特征的值。通过使用自定义的 Python 脚本，我们获得的 ML 预测 PCE 为 22.56%，与模拟的 22.17%
    相匹配。


    一旦我们开发并训练了 ML 模型，它的重要性在于它可以给出未来的值。为了实现这一点，我们在代码中添加了一个简单的 Python 脚本，以便我们输入特征值后，ML
    模型即可预测 Cs2RbGaIn 基电池的 PCE。


    ![](img/77993b86c321119fe49a62d1f762f7a1_7_0.png)


    图 11. 特征值（缺陷密度、层厚度和层粗糙度）影响的 SHAP 摘要分析。


    本研究通过实验探索了钙钛矿太阳能电池的潜力，其发现对于提高 PCE 耐用性很有帮助。它强调了机器学习在分析各种因素对太阳能电池影响方面的价值，并强调了基于模拟的方法在更短时间内获得准确结果的重要性。


