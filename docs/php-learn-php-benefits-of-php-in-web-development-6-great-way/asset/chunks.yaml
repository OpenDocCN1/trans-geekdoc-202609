    # Codeigniter

    Codeigniter may be a robust PHP framework that''s simple to use and also features
    an excellent toolkit to make web applications. additionally, to be extremely lightweight,
    this framework comes with excellent documentation that''s very easy to know. it''s
    an honest collection of libraries, making it easy to find out, adopt, and deploy.
    Codeigniter is understood to supply flexibility and straightforward management
    with the assistance of an MVC-based framework. Codeigniter allows you to use its
    own existing scripts alongside your personal core libraries. it''s a framework
    that''s free from complex structures and tedious developmental procedures. If
    you are a newbie PHP coder, Codeigniter may be a good place to start out.


    # 3. Express.js

    Before you start with Node.JS, we propose you give Express.js a fast look. Express.js
    may be a prebuilt Node.js framework that permits you to make server-side web applications
    faster, smarter, and with more flexibility and scalability. You get, firstly,
    a performance level that matches that of a Node.js framework and, secondly, a
    strong set of features for web and mobile apps. you''ll build a single-page, multi-page,
    or hybrid web application with Express.js. Express is written in JavaScript, making
    it very easy to program. Some developers argue that performing on Express cuts
    down their programming time in half. With 5 years of development behind Express,
    it''s safe to mention that this is often a mature platform to figure with. The
    error handling is often a touch frustrating as you''ll stray within the middleware.
    This framework is suggested for advanced developers.


    # 4. AngularJS

    AngularJS may ring a bell to you if you''ve got been following the event of YouTube
    and Netflix. it''s an open-source framework that''s maintained by Google and a
    couple of other development communities. AngularJS is one of the foremost popular
    javascript frameworks. This framework allows developers to increase HTML vocabulary
    for website development. it''s a brief loading time and is great for testability.
    AngularJS is great for video streaming apps, user-review apps, travel apps, weather
    apps, e-commerce, and social media apps (LinkedIn uses AngularJS for its mobile
    app). AngularJS implements the MVC method. As it uses HTML as a declarative language,
    it''s pretty intuitive. AngularJS is great for rapid front-end development because
    it doesn''t need the other plugins or frameworks. AngularJS is managed by Google,
    so there is a huge community out there for you to find out from.


    # 5. Ember.js

    Any description of Ember.js would be incomplete without stating its grand purpose:
    Ember.js is meant "for creating ambitious web applications". deem instance Apple
    Music; now that''s an ambitious application, an incontestable proof that Ember.js
    may be a serious framework. From single-page web applications to mobile apps and
    even desktop apps, Ember.js supports it all. Ember.js also focuses on the model
    and controller aspects of MVC that the majority of other frameworks don''t do
    justice to. Ember has addressed these issues and slapped on an excellent UI for
    amazing client-side functionality. Ember offers an entire development stack and
    plenty of stability. Although most developers tend to select frameworks like Angular,
    Ember''s backward compatibility feature puts it in a unique position as a framework.


    # 6. CakePHP

    CakePHP offers a full-stack framework and is taken into account to be one of the
    foremost comprehensive PHP frameworks out there. Its seamless configuration makes
    it highly popular among developers. CakePHP allows developers to tug any utility
    classes into their own apps or use custom router classes to make a microframework.
    CakePHP boasts an upscale query API and supports all types of database drivers
    or database types for both PDO and native drivers. CakePHP is ideal for budget-friendly
    web app development and also works with the MVC coding method.


    # 7. Phalcon

    Phalcon is an open-source PHP framework. it''s also one of the fastest PHP frameworks
    out there. Phalcon was developed with innovative architecture and features a number
    of rock bottom overheads for an MVC-based application. Phalcon uses fewer resources
    and yet gives high performance. It can handle more HTTP requests than other frameworks
    because it''s written within the C language. Phalcon is definitely modifiable
    and may be compiled for customized use.


    # 8. Zend Framework

    Zend framework is an open source objectoriented web application framework for
    PHP 5. Zend framework provides a complicated MVC implementation which will be
    wont to establish a basic structure for Zend framework web applications. Zend
    also supports multiple database systems and vendors. it''s a versatile caching
    subsystem with support for several sorts of back-ends. AJAX is additionally supported
    via JSON on the Zend framework, thus proving to be advantageous to both the customer
    and therefore the developer. Zend may be a fan favorite amongst veteran developers
    and continues to be popularly utilized.


    # 9. ASP.net

    ASP.net may be a web development platform that''s perfect for building desktop
    and mobile applications. ASP.net uses the HTTP protocol and optimizes HTTP commands.
    Built on Common Language Runtime (`CLR`), ASP.net is great for creating large
    apps with less coding. Writing code for ASP.net is as easy as deploying it. ASP.net
    may be a strong environment where memory leaks and infinite loops are often spotted
    and neutralized.


    # 10. Symfony

    Symfony may be a PHP development framework. Performance testing may be a core
    feature of Symfony one of the explanations developers prefer to work with. additionally,
    multiple developers can effortlessly manage a Symfony project. However, Symfony
    is suggested for veteran developers who know their way around multiple frameworks,
    because the training curve are often steep.


    ## Rules for Coding

    Agreeing to the defined standards and coding rules is a must in PHP development
    because it results in high-quality coding and efficient output. Moreover, professional
    web programmers have always been using PHP programming technologies with many
    struggles. PHP development consistently passes through a series of changes in
    varied aspects just like the syntax or architecture. Also, each of the versions
    brings in new features, quirk techniques, and hacks that it becomes quite terrible
    for website owners and developers to stay track of the problems. Here are certain
    coding rules and technical standards that you simply got to follow while developing
    an answer in PHP. These guidelines when followed well will help website developers
    or programmers to shine through and make a difference between just a technically
    okay code and a mature well-advanced solution.


    ### Rule 1: PHP Coding need Naming Conventions

    One of the crucial conventions in PHP is providing names to the functions, variables
    also as other codes. By names, it means relevant and contextually matched names
    with grammatically correct and sensible wordings. Further, you ought to attempt
    to keep words separated with an underscore as that creates code easy to read and
