    $$m = \frac{\sum_{i=1}^{n}(g_i)}{b} \ast \left(1 + \frac{1}{n}\right) \tag{4}$$


    为了估计标签 $i$ 的偏移量，我们传递仅包含其他标签的批次 $\forall j \in [1,n] : j \ne i$，每个批次仅包含一个标签，每个运行一个批次。我们对各种批次大小重复此操作。总运行次数为
    $t$。在这些运行中，标签 $i$ 的梯度在一定程度上反映了模型错误预测该标签时标签 $i$ 受到的惩罚。因此，我们计算这些梯度的均值作为我们估计的偏移量。


    $$s_i = \frac{\sum_{k=1}^{t}(g_{ik})}{t} \tag{5}$$


    ## E. 来自梯度的标签泄露算法


    基于属性 1 和 2 以及估计的影响 $m$ 和偏移 $s_i$，我们提出了 LLG，其在算法 1 中进行了说明。(1) 我们首先基于梯度的负值提取标签。因此，每个负值的标签都会被添加到提取的标签列表中。(2)
    我们通过从梯度中减去它来消除偏移。在没有辅助知识的情况下，偏移被假定为零。(3) 我们选择梯度中的最小值并将对应的标签添加到提取的标签列表中。我们重复步骤
    (3)，直到提取的标签列表的大小与批次大小匹配。每次在步骤 (1) 和 (3) 中将标签添加到提取的标签中时，我们都会从相应的梯度中减去影响。算法的输出是提取的标签列表，其中包含批次中每个数据样本的对应标签。


    ```

    **Algorithm 1** Label Leakage from Gradients (LLG)


    **Require:** $G = \{g_1, \ldots, g_n\}$: set of gradients, $m$: impact,

    $S = \{s_1, \ldots, s_n\}$: set of offsets, $b$: batch size


    **Ensure:** $lbls$: empty list for extracted labels


    1: **for all** $g_i \in G$ **do**

    2: &nbsp;&nbsp;&nbsp;&nbsp;**if** $g_i < 0$ **then**

    3: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;append $i$ to $lbls$

    4: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$g_i \leftarrow g_i - m$

    5: &nbsp;&nbsp;&nbsp;&nbsp;**end if**

    6: **end for**

    7: $G \leftarrow G - S$

    8: **while** $|lbls| < b$ **do**

    9: &nbsp;&nbsp;&nbsp;&nbsp;Find $g_i : g_i = \min(G)$

    10: &nbsp;&nbsp;&nbsp;&nbsp;append $i$ to $lbls$

    11: &nbsp;&nbsp;&nbsp;&nbsp;$g_i \leftarrow g_i - m$

    12: **end while**

    13: **return** $lbls$

    ```


    ## IV. 实验


    本节报告了对梯度值的实证分析，以证明属性 1 和 2 的有效性，并评估 LLG 算法在有无辅助知识情况下的准确性。


    我们在两个数据集 MNIST [3] 和 CIFAR-100 [2] 上的分类任务上运行实验。为了与之前的工作进行适当的未来比较，我们复制了 [6] 中使用的设置。因此，我们使用
    LeNet [3] 结构作为神经网络。作为优化器，我们使用学习率为 1 的 L-BFGS。我们在大小为 $2^k$ 的批次上训练神经网络，其中 $k \in
    [0,7]$。在分布式学习中，参与者的数据可以是 *独立同分布* (IID) 或 *非独立同分布* (non-IID)。我们在实验中考虑了两者。对于 IID
    数据，批次的样本是从数据集中随机选择的。对于非 IID 数据，我们从一个随机标签 $i$ 中选择 50% 的批次样本，从另一个标签 $j$ 中选择 25%。剩余的
    25% 批次随机选择。我们使用随机初始化的网络重复所有实验 1,000 次并报告平均值。


    ### A. 梯度分析


    在我们的分析中，我们关注梯度 $G = \{g_1, \ldots, g_n\}$，其中 $g_i$ 如公式 (1) 所定义。我们研究的梯度数量对应于标签的数量。对于
    MNIST，我们有 $n = 10$ 个值，而在 CIFAR-100 中，我们检查 $n = 100$ 个值。考虑到实验设置的多种多样性和重复性，我们总共分析了
    1,760,000 个梯度。


    为了证明属性 1 的有效性，我们审计了梯度的符号。我们发现 100% 的负梯度对应于批次中存在的标签，如表 I、关系 1 所示，这与属性 1 相符。因此，所有不存在的标签都对应于正值。然而，我们也在关系
    2 中注意到 6%-18% 的现有标签具有正梯度。我们假设这是我们在第 III-B 节中引入的偏移参数造成的。


    为了更详细地说明影响和偏移参数，我们绘制了 IID 数据的梯度值分布，如图 1.(a,b) 所示。x 轴表示批次中标签 $i : \forall i \in
    [1,n]$ 出现的次数，而 y 轴表示相应梯度 $g_i$ 的值。对于所有批次大小，我们可以看到梯度的值随着出现次数的增加而持续下降（以大致恒定的步长）。这反过来符合属性
    2 和我们对影响参数的定义。我们还观察到，不同出现次数之间梯度值的下降在标签之间大致恒定，因为图包含所有标签。这证实了我们之前讨论的假设，即影响是不依赖于标签的。此外，我们注意到影响的幅度与批次大小负相关。也就是说，批次中样本越多，不同出现次数的梯度变化越小。


    我们看到梯度在负值和正值之间的分布。如前所述，偏移到正值的值使得标签提取更加困难。因此，我们在算法 1 中通过从梯度中减去偏移来修剪梯度。我们按第 III-D
    节解释的方式估计偏移值。在图 1.(d,e) 中，我们可以看到修剪后的梯度，以及它们如何变得主要为负值。修剪过程消除了偏移的影响，使值更加一致，从而更容易用于提取标签。


