    ### B. 标签提取准确率


    准确率表示正确提取的标签数量除以提取的标签总数。我们在上述所有实验中应用我们的算法并评估其在有无辅助知识情况下的准确性。我们将具有辅助知识的算法称为 LLG+。我们将准确率与随机猜测作为基线进行比较。图
    1.(c) 显示了 MNIST 的准确率。我们可以看到 LLG+ 成功检测到批次大小 ≤ 128 时 > 98% 的真实标签。LLG 在 IID 和非 IID
    数据上的准确率分别为 > 80% 和 > 85%。我们注意到，对于增加的批次大小（> 64）和 IID 数据，LLG 的表现与随机猜测相似。有趣的是，如图
    1.(f) 所示，LLG 在 CIFAR-100 数据集上的表现几乎与 LLG+ 相同。LLG 和 LLG+ 在 IID 和非 IID 数据上的准确率均 >
    96%。与 MNIST 相比，随机猜测在 CIFAR-100 上的表现较差，因为 CIFAR-100 中的标签数量远大于 MNIST。


    ## V. 结论与未来工作


    我们提出了 Label Leakage from Gradients (LLG)，一种从分布式机器学习中共享的梯度中提取真实标签的算法。我们通过初步实证分析证明了我们方法的有效性。作为下一步，我们将使用神经网络的各种超参数、其结构和额外数据集进行更广泛的实验。我们将评估
    DLG 攻击 [7] 与我们算法结合的保真度。最后，我们目前正在研究能够减轻 LLG 风险的防御机制。


