    ## II. BACKGROUND & RELATED WORK


    Training a neural network consists of optimizing the weights of the network W
    to minimize the loss function l. The gradients ∇W are the derivatives of the loss
    function l w.r.t. the weights W. The gradients ∇W represent the direction and
    magnitude that is used to update the weights in the correct direction.


    Zhu et al. [7] propose an attack that uses shared gradients in distributed learning
    to reconstruct the training data. The authors generate dummy input data and output
    labels, then attempt to optimize them to generate dummy gradients that match the
    shared ones. By that, the dummy data and labels will converge to the real data
    and labels used by the participants in the training process. However, it is observed
    that their method to generate the correct labels is not optimal [6].


    Zhao et al. [6] have addressed this issue by proposing an analytical approach
    to extract the ground-truth labels from the shared gradients. The authors demonstrated
    that the gradients

    of classification (cross-entropy) loss w.r.t. the last layer weights have negative
    values for the correct labels. Thus, detecting the negative gradients is sufficient
    to extract correct labels. However, their approach works only in the case of gradients
    generated from one sample. Meaning, the batch used in the training by the participants
    must contain one sole sample. Using a batch with the size of one is highly unlikely
    scenario in real-world applications. Participants typically are expected to have
    multiple samples, and they would train the model on these samples (a batch of
    them at least) before sharing the gradients with other parties. In our work, we
    consider this issue and propose an algorithm that works with arbitrary batch sizes.


    ## III. METHODOLOGY


    In this section, we present our problem setting, then elaborate on two gradient
    properties upon which we base our algorithm. Derived from these properties, we
    define two parameters, impact and offset. Then, we describe our algorithm LLG
    to extract the ground-truth labels from shared gradients.


    ### A. Problem Setting


    We consider a distributed ML scenario, where a participant trains a neural network
    for one iteration on a batch of their data samples (in particular, we assume that
    the batch contains more than one data sample). Then, the participant shares the
    gradients resulted from the training process with other parties, e.g., the service
    provider. We assume that the neural network model consists of L layers and is
    trained with cross-entropy loss over one-hot labels for a classification task.


    For our algorithm, we consider the gradients ∇WL wrt. the last-layer weights WL
    (between the output layer and the layer before). The gradient vector ∇WiL represents
    gradients connected to the label i on the output layer. We note gi to refer to
    the sum of the elements of ∇WiL.


    gi = 1/|T| · ∇WiL


    For the sake of simplicity, we refer to gi as the gradient of label i in the rest
    of the paper.


    ### B. Gradient Properties


    We derive two properties of gradients through empirical analysis. In Section IV,
    we present additional evidence to back these properties.


    - Property 1: A negative value of the gradient gi indicates that label i appeared
    in the batch of training data.

    - Our empirical analysis suggests that the appearance of a negative gradient corresponds
    to a label in the batch of training data.

    - Property 2: The magnitude of the gradient gi is an indicator for the number
    of occurrences of label i in the batch of training data.

    - In our analysis, we found indicators that the value of the gradient correlates
    with the number of occurrences. For example, a single appearance of label i in
    the batch of training data results in a gradient value of −x whereas the two occurrences
    of label j result in a gradient value of −2x.


    ### C. Impact and Offset Parameters


    Driven by our observations, we define the impact m as the change of the gradient
    value caused by a single occurrence of a label in a batch. This value is always
    negative (see Property 1). As the change on gradients values is the same regardless
    the corresponding label, we assume that impact m is label-agnostic.


    We also noticed that in some cases the values of the gradients are shifted by
    an unknown positive value. We call this value offset s. Based on our observations,
    we presume that the offset s occurs as a result of misclassification penalty during
    the weight optimization process. Meaning, if a sample of label i was misclassified
    as label j, the optimization algorithm adds a penalty (i.e., a positive value)
    to the gradients of label j. As this offset value might vary from label to another,
    we consider it a label-specific value.


    As summarized in Eq. (2), the number of occurrences ci multiplied by the impact
    m and corrected by the offset si acts as an estimator for the value of the gradient
    of label i.


    ci * m + si ≈ gi


    From Eq. (2), it follows easily that the number of occurrences ci of label i can
    be derived from the parameters m, si, and gi. Next, we discuss our proposals to
    estimate the impact m and offset si.


    ### D. Parameter Estimation


    We present two scenarios that enable us to estimate both the impact m and offset
    si.


    - Shared gradients In this scenario, the adversary has access to the shared gradients.
    As mentioned earlier, the impact refers to the change in the value of the gradients
    corresponding to one occurrence for a label. Thus, the mean of the changes seems
    to be a good estimation. Based on Property 1, we know that all negative gradients
    are indicating existing labels in the batch of training data. Therefore, we propose
    to derive the estimated impact as the sum of the gradients with negative values
    divided by the batch size b. However, empirically, we noticed that multiplying
    by a factor of (1+1/n) improves the accuracy of extracting labels, where n is
    the total number of labels.


    m = ∑i;gi<0 (gi) / b * (1 + 1/n)


    In this scenario, the offset si cannot be estimated and is neglected. Our results
    show that the accuracy is still sufficiently high to perform a successful attack.


