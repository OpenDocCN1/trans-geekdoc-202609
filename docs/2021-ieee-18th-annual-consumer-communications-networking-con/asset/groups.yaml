    magnitude that is used to update the weights in the correct direction.


    Zhu et al. [7] propose an attack that uses shared gradients in distributed learning
    to reconstruct the training data. The authors generate dummy input data and output
    labels, then attempt to optimize them to generate dummy gradients that match the
    shared ones. By that, the dummy data and labels will converge to the real data
    and labels used by the participants in the training process. However, it is observed
    that their method to generate the correct labels is not optimal [6].


    Zhao et al. [6] have addressed this issue by proposing an analytical approach
    to extract the ground-truth labels from the shared gradients. The authors demonstrated
    that the gradients'
