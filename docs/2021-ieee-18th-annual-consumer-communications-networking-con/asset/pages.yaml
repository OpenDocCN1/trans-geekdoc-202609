    # B. Label Extraction Accuracy


    The accuracy is expressed as the amount of the correctly extracted labels divided
    by the total number of the extracted labels. We apply our algorithm in all the
    aforementioned experiments and evaluate its accuracy with and without auxiliary
    knowledge. We refer to our algorithm with auxiliary knowledge as LLG+. We compare
    the accuracy with random guessing as a baseline. Fig. 1.(c) shows the accuracy
    for MNIST. We can see that LLG+ successfully detects the ground-truth labels with
    > 98% for batch sizes ≤ 128. LLG has accuracy > 80% and > 85% for IID and non-IID
    data, respectively. We notice that for increasing batch sizes (> 64) and IID data,
    LLG performs similarly to random guessing. Interestingly, LLG performs almost
    equally to LLG+ on the CIFAR-100 dataset, as shown in Fig. 1.(f). Both, LLG and
    LLG+ have > 96% accuracy for IID and non-IID data. Random guessing performs poorly
    for CIFAR-100 compared with MNIST, as the number of labels in CIFAR-100 is much
    bigger than in MNIST.


    # V. CONCLUSION & FUTURE WORK


    We presented Label Leakage from Gradients (LLG), an algorithm that extracts the
    ground-truth labels from shared


    gradients in distributed machine learning. We demonstrated the validity of our
    approach through an initial empirical analysis. As next steps, we will conduct
    more extensive experiments with various hyper parameters of the neural network,
    its structures, and additional datasets. We will assess the fidelity of DLG attack
    [7] combined with our algorithm. Lastly, we are currently researching defense
    mechanisms that are capable of mitigating the risk of LLG.


