  md: '# Label Leakage from Gradients in Distributed Machine Learning


    Aidmar Wainakh, Till Müßig*, Tim Grube, Max Mühlhäuser

    Telecooperation Lab, Technical University of Darmstadt, Darmstadt, Germany

    {wainakh, grube, max}@tk.tu-darmstadt.de, *till.muessig@stud.tu-darmstadt.de


    Abstract—Empowered by the high connectivity of manifold devices in today’s world,
    distributed machine learning enables multiple, distributed users to build a joint
    model by sharing their gradients over a network. In this paper, we highlight the
    privacy risk of sharing gradients by proposing LLG, an algorithm to disclose the
    labels of the users’ training data from their shared gradients. We conduct an
    empirical analysis on two datasets to demonstrate the validity of our algorithm.
    Results show that our approach effectively extracts the labels with high accuracy
    in different scenarios.


    Index Terms—Distributed machine learning, privacy, leakage from gradients


    # I. INTRODUCTION AND MOTIVATION


    The emergence of the Internet enables many services to ease and enrich everyone’s
    life, e.g., online shopping and social networking. Many of the service providers
    employ Machine Learning (ML) models to further improve their services, e.g., to
    enable personalization of kinds. These models are mostly trained in a centralized
    fashion, where user data is collected and processed in central servers. These
    developments and rising awareness of potential threats led to many user concerns
    about the usage of their personal data and, consequently, about their privacy.
    In this light, companies, e.g., Google, introduced distributed ML settings like
    the emerging Federated Learning (FL) [5]. This movement is also facilitated by
    current advancements of fog and edge computing.


    FL enables service providers and users to utilize the power of ML without collecting
    personal information in central places. As such, users cooperate to train the
    ML model in a distributed way. The users’ individual models are then collected
    and aggregated to establish the joint model with similar properties as the traditional,
    centralized-trained ML model. This lifts some pressure from privacy concerns as
    the personal information will never leave the users’ devices. However, to aggregate
    the individual users’ models, they share their model’s gradients, i.e., they share
    model updates. Sharing gradients was believed to be secure and private as gradients
    were thought to not reveal information about the users’ training datasets [7].


    Recently, Zhou et al. [7] have proposed an attack, Deep Leakage from Gradients
    (DLG), that reconstructs the training data and labels from the shared gradients.
    In their attack, they consider the classification task, where the label refers
    to the class of the input data, which can be highly sensitive information, e.g.,
    in case of a model for cancer classification. However, DLG is not able to reliably
    extract the ground-truth


    labels [6]. Zhao et al. [6] have suggested Improved Deep Leakage from Gradients
    (iDLG), a simple approach to extract the ground-truth label based on the sign
    of the gradients w.r.t. the last-layer weights of a neural network. Although their
    approach is reliable and detects the correct label with 100% accuracy, it works
    only for gradients generated from a single data sample. This limitation renders
    the proposed approach inapplicable in real-world scenarios, where the gradients
    are typically shared after training the model on a batch of samples.


    In this paper, we propose Label Leakage from Gradients (LLG), an algorithm to
    extract the ground-truth labels from shared gradients. Unlike iDLG [6], LLG is
    designed to consider gradients generated by training the model with a batch of
    samples. Our algorithm is based on two properties of the values of the last layer
    gradients that reveal relationships between labels and the resulting values of
    gradients. We derive these properties through an empirical analysis of gradients
    and their changes over the course of the model training. We evaluate our algorithm
    on MNIST and CIFAR-100 datasets. First results show that LLG can extract the ground-truth
    labels with very high accuracy.


    The remainder of this paper is organized as follows. In Section II, we present
    background and related work on information leakage from gradients. We elaborate
    on our approach in Section III. Then, in Section IV we present intermediate results
    of our analysis. Finally, we conclude the paper and introduce directions for future
    work in Section V.


    Training a neural network consists of optimizing the weights of the network W
    to minimize the loss function l. The gradients ∇W are the derivatives of the loss
    function l w.r.t. the weights W. The gradients ∇W represent the direction and
    magnitude that is used to update the weights in the correct direction.


    # II. BACKGROUND & RELATED WORK


    Training a neural network consists of optimizing the weights of the network W
    to minimize the loss function l. The gradients ∇W are the derivatives of the loss
    function l w.r.t. the weights W. The gradients ∇W represent the direction and
    magnitude that is used to update the weights in the correct direction.


    Zhu et al. [7] propose an attack that uses shared gradients in distributed learning
    to reconstruct the training data. The authors generate dummy input data and output
    labels, then attempt to optimize them to generate dummy gradients that match the
    shared ones. By that, the dummy data and labels will converge to the real data
    and labels used by the participants in the training process. However, it is observed
    that their method to generate the correct labels is not optimal [6].


    Zhao et al. [6] have addressed this issue by proposing an analytical approach
    to extract the ground-truth labels from the shared gradients. The authors demonstrated
    that the gradients'
