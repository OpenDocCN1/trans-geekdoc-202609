    \n# UNIT V\n\nGenetic Algorithms\n\nMotivation, Genetic Algorithms: Representing\
    \ Hypotheses, Genetic Operator, Fitness Function and Selection, An Illustrative\
    \ Example, Hypothesis Space Search, Genetic Programming, Models\n\n![image](d2d_images/image040.png)\n\
    \nof Evolution and Learning: Lamarkian Evolution, Baldwin Effect, Parallelizing\
    \ Genetic Algorithms.\n\n## Motivation\n\nGenetic algorithms (GAS) provide a learning\
    \ method motivated by an analogy to biological evolution. Rather than search from\
    \ general-to-specific hypotheses, or from simple-to-complex, GAS generate successor\
    \ hypotheses by repeatedly mutating and recombining parts of the best currently\
    \ known hypotheses. At each step, a collection of hypotheses called the current\
    \ population is updated by replacing some fraction of the population by offspring\
    \ of the most fit current hypotheses. The process forms a generate-and-test beam-search\
    \ of hypotheses, in which variants of the best current hypotheses are most likely\
    \ to be considered next. The popularity of GAS is motivated by a number of factors\
    \ including:\n\n  Evolution is known to be a successful, robust method for adaptation\
    \ within biological systems.\n\n  GAS can search spaces of hypotheses containing\
    \ complex interacting parts, where the impact of each part on overall hypothesis\
    \ fitness may be difficult to model.\n\n  Genetic algorithms are easily parallelized\
    \ and can take advantage of the decreasing costs of powerful computer hardware.\n\
    \n## 9.2 Genetic Algorithms\n\nThe problem addressed by GAS is to search a space\
    \ of candidate hypotheses to identify the best hypothesis. In GAS the \"best hypothesis\"\
    \ is defined as the one that optimizes a predefined numerical measure for the\
    \ problem at hand, called b the hypothesis fitness. For example, if the learning\
    \ task is the problem of approximating an unknown function given training examples\
    \ of its input and output, then fitness could be defined as the accuracy of the\
    \ hypothesis over this training data. If the task is to learn a strategy for playing\
    \ chess, fitness could be defined as the number of games won by the individual\
    \ when playing against other individuals in the current population.\n\nAlthough\
    \ different implementations of genetic algorithms vary in their details, they\
    \ typically share the following structure: The algorithm operates by iteratively\
    \ updating a pool of hypotheses, called the population. On each iteration, all\
    \ members of the population are evaluated according to the fitness function. A\
    \ new population is then generated by probabilistically selecting the fit individuals\
    \ from the current population. Some of these selected individuals are carried\
    \ forward into the next generation population intact. Others are used as the basis\
    \ for creating new offspring individuals by applying genetic operations such as\
    \ crossover and mutation.\n\n![image](d2d_images/image040.png)\n\n![image](d2d_images/image110.jpg)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nThe inputs to this algorithm\
    \ include the fitness function for ranking candidate hypotheses, a threshold defining\
    \ an acceptable level of fitness for terminating the algorithm, the size of the\
    \ population to be maintained, and parameters that determine how successor populations\
    \ are to be generated: the fraction of the population to be replaced at each generation\
    \ and the mutation rate. Notice in this algorithm each iteration through the main\
    \ loop produces a new generation of hypotheses based on the current population.\
    \ First, a certain number of hypotheses from the current population are selected\
    \ for inclusion in the next generation. These are selected probabilistically,\
