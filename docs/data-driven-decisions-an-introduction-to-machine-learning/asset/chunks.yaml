    \ Assumption**:\nHomoscedasticity is a situation when the error term is the same\
    \ for all the values of independent variables. With homoscedasticity, there should\
    \ be no clear pattern distribution of data in the scatter plot.\n- **Normal distribution\
    \ of error terms**:\nLinear regression assumes that the error term should follow\
