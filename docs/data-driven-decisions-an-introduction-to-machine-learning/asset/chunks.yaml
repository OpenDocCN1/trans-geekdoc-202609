  trans: "\n此时这里，你可能已经注意到了一些东西。`k-means` 的基本概念建立在数学计算（均值、欧几里得距离）之上。但如果我们的数据是非数值的，或者说是分类的呢？例如，假设有上一个例子中五个人的\
    \ ID 代码和出生日期，而不是他们的身高和体重。\n\n我们可以考虑将分类值转换为数值，最终应用 `k-means`。但要小心：`k-means` 使用的是数值距离，因此它可能会将两个实际上相远的对象归为一类，仅仅是因为它们被分配了两个接近的数字。\n\
    \n`k-modes` 是 `k-means` 的扩展。它不使用距离，而是使用不相似性（dissimilarities，即两个对象之间总不匹配程度的量化：该值越小，两个对象越相似）。它不使用均值，而是使用众（mode）。众是一个元素向量，它可以最小化向量本身与数据中每个对象之间的不相似性。我们的众数量与所需的簇数量相同，因为它们充当了质心。\n\
    \n![image](img/image040.png)\n\n# 第三单元：集成学习与概率学习\n\n集成学习：模型组合方案、投票、纠错输出码、Bagging：随机森林树、Boosting：Adaboost、Stacking。\n\
    \n概率学习：高斯混合模型 - 期望极大（EM）算法、信息准则、最近邻方法 - 最近邻平滑、高效距离计算：KD 树、距离度量。\n\n## 3. 引言：集成学习\n\
    \n集成学习通常产生比单一模型更准确的解决方案。\n\n![image](img/image040.png)\n\n集成学习是一种创建多个模型并将它们组合以改进结果的技术。集成学习通常产生比单一模型更准确的解决方案。\n\
    \n* 集成学习方法同样适用于回归和分类。\n* 用于回归的集成学习创建多个回归器，即多个回归模型，如线性、多项式等。\n* 用于分类的集成学习创建多个分类器，即多个分类模型，如逻辑回归、决策树、KNN、SVM\
    \ 等。\n\n![image](img/image156.png)\n\n图 1：集成学习视图\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- |\
    \ --- | --- |\n\n![image](img/chapter_title_above.png)\n\n# 组合哪些组件？\n\n![image](img/chapter_title_below.png)\
    \ \n\n* 不同的学习算法\n* 以不同方式训练的相同学习算法\n* 以相同方式训练的相同学习算法\n\n集成学习包含两个步骤：\n\n使用相同或不同的机器学习算法生成多个机器学习模型。这些被称为“基模型”。基于基模型进行预测。\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png)  ||  || ![image](img/chapter_title_corner_decoration_right.png)\
    \  |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n# 集成学习中的技术/方法\n\
    \n## 模型组合方案\n\n集成学习通常产生比单一模型更准确的解决方案。\n\n![image](img/chapter_title_below.png)\n\
    \n投票、纠错输出码、Bagging：随机森林树、Boosting：Adaboost、Stacking。\n\n## 通用思想 - 组合学习者\n\n我们在前面的章节中讨论了许多学习算法。尽管这些算法是成功的，但没有哪种单一算法总是最好的。现在，我们将讨论由多个模型组成的模型，通过组合它们来获得更高的精度。\n\
    \n![image](img/image040.png)\n![image](img/image017.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- |\
    \ --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 图 2：组合学习者\n\n集成学习有两个步骤：\n\
    \n使用相同或不同的机器学习算法生成多个机器学习模型。这些被称为“基模型”。基于基模型进行预测。\n\n![image](img/image040.png)\n\
    ![image](img/image017.png)\n\n## 多级组合\n\n多级方法使用串行方法，后一个学习器在前一个输出的基础上进行训练。\n* 在全局方法中（也称为融合），给定输入，所有基学习器生成输出。\n\
    * 在局部方法中（或选择方法），例如专家混合，有一个门控模型来选择一个或几个\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- |\
    \ --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 多级组合\n\n假设有 L 个基学习器。用\
    \ `dj(x)` 表示基学习器 `Mj` 给任意输入 `x` 的预测。在多输出的情况下，每个学习器有 K 个输出 `dji(x)`，`i = 1, ...,\
    \ K` 以及 `j = 1, ..., L`，通过组合它们，我们生成 K 个值 `yi`，`i = 1, ..., K`，然后对于分类，我们选择 `yi`\
    \ 值最大的类：\n\n```\ny = f(d1, d2, ..., dL | Φ)\n```\n\n其中 `f(·)` 是组合函数，`Φ` 表示它的参数。\n\
    \n![image](img/image040.png)\n\n![image](img/image138.png)\n\n图 1：基学习器为 `dj`，它们的输出通过\
    \ `f(·)` 进行组合。这是针对单一输出；在分类情况下，每个基学习器的输出分别计算 `yi`。注意这里所有学习器都观察输入；不同学习器可能观察同一对象或事件的不同表示。\n\
    \n### 投票\n\n组合多个分类器简单的方法是投票，这对应于学习器的线性组合，参考图 1。\n\n![image](img/image071.png)\n\
    \n这被称为集成（ensemble）和线性意见池（opinion pools）。在最简单的情况下，所有学习器被赋予相同的权重，我们进行简单投票，对应于取平均值。尽管如此，取（加权）和只是可能之一，还有其他的组合规则，如表\
    \ 1 所示。如果输出不是后验概率，这些规则要求输出被归一化到相同的量程\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- |\
    \ --- | --- |\n\n![image](img/chapter_title_above.png)\n\n# 表 1 - 分类器组合规则\n\n\
    ![image](img/image131.png)\n"
- fmt: "\nAn example of the use of these rules is shown in table 2, which demonstrates\
    \ the effects of different rules. Sum rule is the most intuitive and is the most\
    \ widely used in practice. Median rule is more robust to outliers; minimum and\
    \ maximum rules are pessimistic and optimistic, respectively. With the product\
    \ rule, each learner has veto power; regardless of the other ones, if one learner\
    \ has an output of 0, the overall output goes to 0. Note that after the combination\
    \ rules, `yi` do not necessarily sum up to 1.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\n# ![image](d2d_images/image157.png)\n\
    \nTable 2: Example of combination rules on three learners and three classes\n\n\
    ![image](d2d_images/chapter_title_below.png) \n\nIn weighted sum, `dji` is the\
    \ vote of learner `j` for class `Ci` and `wj` is the weight of its vote. Simple\
    \ voting is a special case where all voters have equal weight, namely, `wj = 1/L`.\
    \ In classification, this is called plurality voting where the class having the\
    \ maximum number of votes is the winner.\n\nWhen there are two classes, this is\
    \ majority voting where the winning class gets more than half of the votes. If\
    \ the voters can also supply the additional information of how much they vote\
    \ for each class (e.g., by the posterior probability), then after normalization,\
    \ these can be used as weights in a weighted voting scheme. Equivalently, if `dji`\
    \ are the class posterior probabilities, `P(Ci | x,Mj )`, then we can just sum\
    \ them up (`wj = 1/L`) and choose the class with maximum `yi`.\n\nIn the case\
    \ of regression, simple or weighted averaging or median can be used to fuse the\
    \ outputs of base-regressors. Median is more robust to noise than the average.\n\
    \nAnother possible way to find `wj` is to assess the accuracies of the learners\
    \ (regressor or classifier) on a separate validation set and use that information\
    \ to compute the weights, so that we give more weights to more accurate learners.\n\
    \nVoting schemes can be seen as approximations under a Bayesian framework with\
    \ weights approximating prior model probabilities, and model decisions approximating\
    \ model-conditional likelihoods.\n\n![image](d2d_images/image179.png)\n\n––––––––\n\
    \n![image](d2d_images/scene_break.png) \n\nSimple voting corresponds to a uniform\
    \ prior. If we have a prior distribution preferring simpler models, this would\
    \ give larger weights to them. We cannot integrate over all models; we only choose\
    \ a subset for which we believe `P(Mj )` is high, or we can have another Bayesian\
    \ step and calculate `P(Ci | x,Mj )`, the probability of a model given the sample,\
    \ and sample high probable models from this density.\n\nLet us assume that `dj`\
    \ are iid with expected value `E[dj]` and variance `Var(dj )`, then when we take\
    \ a simple\n\n![image](d2d_images/image040.png)\n\naverage with `wj = 1/L`, the\
    \ expected value and variance of the output are\n\n![image](d2d_images/image054.png)\n\
    \nthe expected value and variance of the output are\n\nthe expected value and\
    \ variance of the output are\n\nthe expected value and variance of the output\
    \ are\n\nwe see that the expected value does not change, so the bias does not\
    \ change. The expected value and variance of the output are. In the general case,\n\
    \n![image](d2d_images/image164.png)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \nwhich implies that if learners are positively correlated, the error.\n\n## Error-Correcting\
    \ Output Codes\n\nThe Error-Correcting Output Codes (ECOC) method is a technique\
    \ that allows a multi-class problem (K > 2) to be defined in terms of dichotomies\
    \ (K = 2), using any learning algorithm to implement the dichotomizer base-learners.\n"
  raw: "An example of the use of these rules is shown in table 2, which demonstrates\
    \ the effects of different rules. Sum rule is the most intuitive and is the most\
    \ widely used in practice. Median rule is more robust to outliers; minimum and\
    \ maximum rules are pessimistic and optimistic, respectively. With the product\
    \ rule, each learner has veto power; regardless of the other ones, if one learner\
    \ has an output of 0, the overall output goes to 0. Note that after the combination\
    \ rules, yi do not necessarily sum up to 1.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\n# ![image](d2d_images/image157.png)\
    \  \n\nTable 2: Example of combination rules on three learners and three classes\n\
    \n![image](d2d_images/chapter_title_below.png) \n\nIn weighted sum, dji is the\
    \ vote of learner j for class Ci and wj is the weight of its vote. Simple voting\
    \ is a special case where all voters have equal weight, namely, wj \\= 1/L. In\
    \ classification, this is called plurality voting where the class having the maximum\
    \ number of votes is the winner.\n\nWhen there are two classes, this is majority\
    \ voting where the winning class gets more than half of the votes. If the voters\
    \ can also supply the additional information of how much they vote for each class\
    \ (e.g., by the posterior probability), then after normalization, these can be\
    \ used as weights in a weighted voting scheme. Equivalently, if dji are the class\
    \ posterior probabilities, P(Ci | x,Mj ), then we can just sum them up (wj \\\
    = 1/L) and choose the class with maximum yi .\n\nIn the case of regression, simple\
    \ or weighted averaging or median can be used to fuse the outputs of base-regressors.\
    \ Median is more robust to noise than the average.\n\nAnother possible way to\
    \ find wj is to assess the accuracies of the learners (regressor or classifier)\
    \ on a separate validation set and use that information to compute the weights,\
    \ so that we give more weights to more accurate learners.\n\nVoting schemes can\
    \ be seen as approximations under a Bayesian framework with weights approximating\
    \ prior model probabilities, and model decisions approximating model-conditional\
    \ likelihoods.\n\n![image](d2d_images/image179.png)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\nSimple voting corresponds to a uniform prior. If we have a prior distribution\
    \ preferring simpler models, this would give larger weights to them. We cannot\
    \ integrate over all models; we only choose a subset for which we believe P(Mj\
    \ ) is high, or we can have another Bayesian step and calculate P(Ci | x,Mj ),\
    \ the probability of a model given the sample, and sample high probable models\
    \ from this density.\n\nLet us assume that dj are iid with expected value E\\\
    [dj\\] and variance Var(dj ), then when we take a simple\n\n![image](d2d_images/image040.png)\n\
    \naverage with wj \\= 1/L, the expected value and variance of the output are\n\
    \n![image](d2d_images/image054.png)\n\nWe see that the expected value does not\
    \ change, so the bias does not change. But variance, and therefore mean square\
    \ error, decreases as the number of independent voters, L, increases. In the general\
    \ case,\n\n![image](d2d_images/image164.png)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\nwhich implies that if learners are positively correlated, variance (and\
    \ error) increase. We can thus view using different algorithms and input features\
    \ as efforts to decrease, if not completely eliminate, the positive correlation.\n\
    \n## Error-Correcting Output Codes\n\nThe Error-Correcting Output Codes method\
    \ is a technique that allows a multi-class classification problem to be reframed\
    \ as multiple binary classification problems, allowing the use of native binary\
    \ classification models to be used directly.\n\nUnlike [one-vs-rest and one-vs-one\
    \ methods ](https://machinelearningmastery.com/one-vs-rest-and-one-vs-one-for-multi-class-classification/)that\
    \ offer a similar solution by dividing a multi-class classification problem into\
    \ a fixed number of binary classification problems, the error-correcting output\
    \ codes technique allows each class to be encoded as an arbitrary number of binary\
    \ classification problems. When an overdetermined representation is used, it allows\
    \ the extra models to act as “error- correction” predictions that can result in\
    \ better predictive performance.\n\nIn error-correcting output codes (ECOC), the\
    \ main classification task is defined in terms of a number of subtasks that are\
    \ implemented by the base-learners. The idea is that the original task of separating\
    \ one class from all other classes may be a difficult problem. Instead, we want\
    \ to define a set of simpler classification problems, each specializing in one\
    \ aspect of the task, and combining these simpler classifiers, we get the final\
    \ classifier.\n\nBase-learners are binary classifiers having output −1/ \\+ 1,\
    \ and there is a code matrix W of K × L whose K rows are the binary codes of classes\
    \ in terms of the L base-learners dj. For example, if the second row of W is \\\
    [−1,+1,+1,−1\\], this means that for us to say an instance belongs to C2, the\
    \ instance should be on the negative side of d1 and d4, and on the positive side\
    \ of d2 and d3. Similarly, the columns of the code matrix defines the task of\
    \ the base-learners. For example, if the third column is \\[−1,+1,+1\\]T , we\
    \ understand that the task of the third base-learner, d3, is to separate the instances\
    \ of C1 from the instances of C2 and C3 combined. This is how we form the training\
    \ set of the base-learners. For example\n\nin this case, all instances labeled\
    \ with C2 and C3 form X^+ and instances labeled with C1 form X^−, and d3 is\n\n\
    3 3\n\ntrained so that x^t ∈ X^+ give output +1 and x^t ∈ X^− give output −1.\n\
    \n3 3\n\nThe code matrix thus allows us to define a polychotomy (K > 2 classification\
    \ problem) in terms of dichotomies (K \\= 2 classification problem), and it is\
    \ a method that is applicable using any learning\n\n![image](d2d_images/image040.png)\n\
    \nalgorithm to implement the dichotomizer base-learners—for example, linear or\
    \ multilayer perceptrons (with a single output), decision trees, or SVMs whose\
    \ original definition is for two-class problems.\n\nThe typical one discriminant\
    \ per class setting corresponds to the diagonal code matrix where L \\= K. For\
    \ example, for K \\= 4,\n\n––––––––\n\n![image](d2d_images/scene_break.png) \n\
    \n![image](d2d_images/image077.png)\n\nwe have\n\nThe problem here is that if\
    \ there is an error with one of the baselearners, there may be a misclassification\
    \ because the class code words are so similar. So the approach in error-correcting\
    \ codes is to have L > K and increase the Hamming distance between the code words.\
    \ One possibility is pairwise separation of classes where there is a separate\
    \ baselearner to separate Ci from Cj, for i < j. In this case, L\n\n\\= K(K −\
    \ 1)/2 and with K \\= 4, the code matrix is\n\n![image](d2d_images/image145.png)\n\
    \nwhere a 0 entry denotes “don’t care.” That is, d1 is trained to separate C1\
    \ from C2 and does not use the training instances belonging to the other classes.\
    \ Similarly, we say that an instance belongs to C2 if d1 \\=\n\n−1 and d4 = d5\
    \ = +1, and we do not consider the values of d2, d3, and d6. The problem here\
    \ is that L is O(K²), and for large K pairwise separation may not be feasible."
