    \ the tan hyperbolic function is used to approximate output from the actual net\
    \ input. The function is defined as:\n\n```\nF(x) = (1/1 + exp(-????x))\n```\n\
    Where `????` is considered the Steepness parameter.\n\n### Types of Artificial\
    \ Neural Network:\nThere are various types of Artificial Neural Networks (`ANN`)\
    \ depending upon the human brain neuron and network functions, an artificial neural\
    \ network similarly performs tasks. The majority of the artificial neural networks\
    \ will have some similarities with a more complex biological partner and are very\
