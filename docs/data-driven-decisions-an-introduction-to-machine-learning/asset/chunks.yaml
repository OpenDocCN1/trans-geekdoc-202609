    - Training examples are obtained by taking random samples from `X`. We assume
    that the samples are randomly generated from `X` according to the probability
    distribution `F`.


    Now, we give below an informal definition of PAC-learnability.


    ## Definition (informal)


    Let `X` be an instance space, `C` a concept class for `X`, `h` a hypothesis in
    `C` and `F` an arbitrary, but fixed, probability distribution. The concept class
    `C` is said to be PAC-learnable if there is an algorithm `A` which, for samples
    drawn with any probability distribution `F` and any concept `c Є C`, will with
    high probability produce a hypothesis `h Є C` whose error is small.


    # Examples


    To illustrate the definition of PAC-learnability, let us consider some concrete
    examples.


    ![image](d2d_images/image121.png)

    Figure : An axis-aligned rectangle in the Euclidean plane


    ## Example


    - Let the instance space be the set `X` of all points in the Euclidean plane.
    Each point is represented by its coordinates `(x; y)`. So, the dimension or length
    of the instances is `2`.

    - Let the concept class `C` be the set of all “axis-aligned rectangles” in the
    plane; that is, the set of all rectangles whose sides are parallel to the coordinate
    axes in the plane (see Figure).

    - Since an axis-aligned rectangle can be defined by a set of inequalities of the
    following form having four parameters `a ≤ x ≤ b, c ≤ y ≤ d` the size of a concept
    is `4`.

    - We take the set `H` of all hypotheses to be equal to the set `C` of concepts,
    `H = C`.


    Given a set of sample points labeled positive or negative, let `L` be the algorithm
    which outputs the hypothesis defined by the axis-aligned rectangle which gives
    the tightest fit to the positive examples (that is, that rectangle with the smallest
    area that includes all of the positive examples and none of the negative examples)
    (see Figure bleow).


    ![image](d2d_images/image109.png)

    Figure : Axis-aligned rectangle which gives the tightest fit to the positive examples


    It can be shown that, in the notations introduced above, the concept class `C`
    is PAC-learnable by the algorithm `L` using the hypothesis space `H` of all axis-aligned
    rectangles.


    ## Vapnik-Chervonenkis (VC) dimension


    The concepts of Vapnik-Chervonenkis dimension (`VC dimension`) and probably approximate
    correct (`PAC`) learning are two important concepts in the mathematical theory
    of learnability and hence are mathematically oriented. The former is a measure
    of the capacity (complexity, expressive power, richness, or flexibility) of a
    space of functions that can be learned by a classification algorithm. It was originally
    defined by Vladimir Vapnik and Alexey Chervonenkis in 1971. The latter is a framework
    for the mathematical analysis of learning algorithms. The goal is to check whether
    the probability for a selected hypothesis to be approximately correct is very
    high. The notion of PAC learning was proposed by Leslie Valiant in 1984.


    ## VC dimension


    Let `H` be the hypothesis space for some machine learning problem. The Vapnik-Chervonenkis
    dimension of `H`, also called the `VC dimension` of `H`, and denoted by `VC(H)`,
    is a measure of the complexity (or capacity, expressive power, richness, or flexibility)
    of the space `H`. To define the `VC dimension` we require the notion of shattering
    of a set.


    ## Shattering of a set


    Let `D` be a dataset containing `N` examples for binary classification problem
    with class labels `0` and `1`. Let `H` be a hypothesis space for the problem.
    Each hypothesis `h` in `H` partitions `D` into two disjoint subsets. Such a partition
    of `S` is called a “dichotomy” in `D`. It can be shown that there are `2^N` possible
    dichotomies in `D`. To each dichotomy of `D` there is a unique assignment of the
    labels “1” and “0” to the elements of `D`. Conversely, if `S` is any subset of
    `D` then `S` defines a unique hypothesis `h` as follows:


    Thus to specify a hypothesis `h`, we need only specify the set `{x Є D | h(x)
    = 1}`. Figure 3.1 shows all possible dichotomies if `D` has three elements. In
    the figure, we have shown one of the two sets in a dichotomy, namely the set `{x
    Є D | h(x) = 1}`. The circles and ellipses represent such sets.


    ## Definition


    A set of examples `D` is said to be shattered by a hypothesis space `H` if and
    only if for every dichotomy of `D` exists some hypothesis in `H` consistent with
    the dichotomy of `D`. The following example illustrates the concept of Vapnik-Chervonenkis
    dimension.


    ## Example


    In figure, we see that an axis-aligned rectangle can shatter four points in two
    dimensions. Then `VC(H)`, when `H` is the hypothesis class of axis-aligned rectangles
    in two dimensions, is four. In calculating the `VC dimension`, it is enough that
    we find four points that can be shattered; it is not necessary that we be able
    to shatter any four points in two dimensions.


    Fig: An axis-aligned rectangle can shattered four points. Only rectangle covering
    two points are shown.


    VC dimension may seem pessimistic. It tells us that using a rectangle as our hypothesis
    class, we can learn only datasets containing four points and not more.


