    \ \n\nLearning a perceptron involves choosing values for the weights `w0, ...,\
    \ wn`. Therefore, the space `H` of candidate hypotheses considered in perceptron\
    \ learning is the set of all real-valued weight vectors.\n\n![image](d2d_images/image149.png)\n\
    \n### Representational Power of Perceptrons:\nWe can view the perceptron as representing\
    \ a hyperplane decision surface in the n-dimensional space of instances (i.e.,\
    \ points). The perceptron outputs a 1 for instances lying on one side of the hyperplane\
    \ and outputs a -1 for instances lying on the other side, as illustrated in Figure\
    \ below\n\n![image](d2d_images/image199.png)\n\nThe equation for this decision\
    \ hyperplane is `w. x = 0`. Of course, some sets of positive and negative examples\
    \ cannot be separated by any hyperplane. Those that can be called linearly separable\
    \ sets of examples.\n\n![image](d2d_images/image008.png)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\nThe decision surface represented by a two-input perceptron. (a) A set of\
