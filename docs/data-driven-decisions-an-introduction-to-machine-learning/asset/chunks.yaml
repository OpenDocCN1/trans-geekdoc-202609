    -   训练样本是通过从 `X` 中随机抽样获得的。我们假设样本是根据概率分布 `F` 从 `X` 中随机生成的。


    现在，我们给出一个关于 PAC 可学习性的非正式定义。


    ## 定义（非正式）


    设 `X` 为实例空间，`C` 为 `X` 的一个概念类，`h` 为 `C` 中的一个假设，`F` 为一个任意但固定的概率分布。如果概念类 `C` 是 PAC
    可学习的，则存在一个算法 `A`，对于以任何概率分布 `F` 抽取的样本和任何概念 `c Є C`，都能以高概率产生一个误差很小的假设 `h Є C`。


    # 示例


    为了说明 PAC 可学习性的定义，让我们考虑一些具体的例子。


    ![image](img/image121.png)

    图：欧几里得平面上的轴对齐矩形


    ## 示例


    -   令实例空间为欧几里平面上所有点的集合 `X`。每个点由其坐标 `(x; y)` 表示。因此，实例的维度或长度为 `2`。

    -   令概念类 `C` 为平面上所有“轴对齐矩形”的集合；即平面上所有边与平面坐标轴平行的矩形集合（见图）。

    -   由于一个轴对齐矩形可以用一组如下形式的不不等式来定义，具有四个参数 `a ≤ x ≤ b, c ≤ y ≤ d`，因此一个概念的大小为 `4`。

    -   我们取所有假设的集合 `H` 等于概念的集合 `C`，即 `H = C`。


    给定一组标记为正例或负例的样本点，令 `L` 为输出由轴对齐矩形定义的假设的算法，该矩形对正样本提供最紧凑的拟合（即包含所有正样本且不包含任何负样本的面积最小的矩形）（见下方图）。


