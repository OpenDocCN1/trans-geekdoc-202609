    [content]


    泛化（generalization）一词描述了将关于存储数据的知识转换为可用于未来行动的形式的过程。这些行动将在与之前见过的任务相似但不完全相同的任务上执行。在泛化过程中，目标是发现数据中与未来任务最相关的属性。


    # 4. 评估


    评估是学习过程的最后一个组成部分。它是向用户提供反馈以衡量所学知识的实用性的过程。这些反馈随后被用于改进整个学习过程。


    # 机器学习的应用


    将机器学习方法应用于大型数据库被称为数据挖掘。在数据挖掘中，通过处理大量数据来构建具有高价值用途的简单模型，例如具有高预测准确率的模型。


    以下是机器学习的一些典型应用列表：


    1. 在零售业务中，机器学习被用于研究消费者行为。

    2. 在金融领域，银行分析历史数据以建立模型，用于信贷申请、欺诈检测和股票市场。

    3. 在制造业中，学习模型用于优化、控制和故障排除。

    4. 在医学领域，学习程序被用于医学诊断。

    5. 在电信领域，分析通话模式以进行网络优化和业务质量最大化。

    6. 在科学领域，物理、天文学和生物学中的大量数据只能通过计算机进行快速分析。世界维网是巨大的；它在不断增长，无法通过人工搜索相关信息。

    7. 在人工智能领域，它被用于教系统学习并适应变化，使得系统设计人员无需预见并为所有可能的情况提供解决方案。

    8. 它用于为视觉、语音识别和机器人领域的许多问题寻找解决方案。

    9. 机器学习方法应用于计算机控制车辆的设计中，以便在各种道路上行驶时能够正确转向。

    10. 机器学习方法已用于开发国际象棋、跳棋和围棋等游戏。


    # 学习模型


    机器学习关注如何使用正确的特征构建正确的模型以完成正确的任务。学习模型的基本思想分为三类。


    对于给定的问题，所有可能结果的集合代表样本空间或实例空间。


    * 使用逻辑表达式。（`Logical models`）

    * 使用实例空间的几何结构。（`Geometric models`）

    * 使用概率对实例空间进行分类。（`Probabilistic models`）

    * 分组与分级


    ## 逻辑模型


    逻辑模型使用逻辑表达式将实例空间划分为若干段，从而构建分组模型。逻辑表达式是一个返回 `Boolean` 值的表达式，即 `True` 或 `False`
    结果。一旦使用逻辑表达式对数据进行分组，数据就会分为我们正尝试解决问题的同质组。例如，对于分类问题，组中的所有实例都属于一类。


    逻辑模型主要有两种类型：树模型和规则模型。


    规则模型由一组蕴含或 `IF-THEN` 规则组成。对于基于树的模型，`if-part` 定义了一个片段，`then-part` 定义了模型在该片段的行为。规则模型遵循相同的推理逻辑。


    # 逻辑模型与概念学习


    为了进一步理解逻辑模型，我们需要理解概念学习（Concept Learning）的概念。概念学习涉及从示例中学习逻辑表达式或概念。概念学习与机器学习的思想非常契合，即从特定的训练示例中推断出通用函数。概念学习构成了基于树和基于规则模型的基础。更正式地说，概念学习涉及从给定的某类正样本和负样本训练集中获取该类别的通用定义。概念学习的形式化定义是“从其输入和输出的训练示例推断出一个
    `Boolean` 值函数”。在概念学习中，我们只学习正类别的描述，并将不符合该描述的所有内容标记为负类。


    以下示例详细地解释了这一思想。


    ## 几何模型


    在上一节中，我们看到在逻辑模型（如决策树）使用逻辑表达式来划分实例空间。当两个实例落在同一个逻辑片段时，它们是相似的。在本节中，我们考虑通过考虑实例空间的几何结构来定义相似性。在几何模型中，特征可以被描述为二维（`x`
    和 `y`轴）或三维空间（`x`、`y` 和 `z`）中的点。即使特征本身不是几何的，也可以以几何方式进行建模（例如，随时间变化的温度可以使用轴建模）。


    在几何模型中，我们有两种方法来设定相似性：


    * 我们可以使用直线或平面等几何概念来分割（分类）实例空间。这些被称为 `Linear models`。

    * 另一种，我们可以使用几何距离的概念来表示相似性。在这种情况下，如果两个点距离很，它们的特征值就相似，因此可以归类为相似。我们将此类模型称为 `Distance-based
    models`。


    '
- fmt: '

    ![image](d2d_images/scene_break.png)


    # Linear models


    Linear models are relatively simple. In this case, the function is represented
    as a linear combination of its inputs. Thus, if `x1` and `x2` are two scalars
    or vectors of the same dimension and `a` and `b` are arbitrary scalars, then `ax1
    + bx2` represents a linear combination of `x1` and `x2`. In the simplest case
    where `f(x)` represents a straight line, we have an equation of the form `f (x)
    = mx + c` where `c` represents the intercept and `m` represents the slope.


    ![image](d2d_images/image014.jpg)


    Linear models are parametric, which means that they have a fixed form with a small
    number of numeric parameters that need to be learned from data. For example, in
    `f (x) = mx \+ c`, `m` and `c` are the parameters that we are trying to learn
    from the data. This technique is different from tree or rule models, where the
    structure of the model (e.g., which features to use in the tree, and where) is
    not fixed in advance.


    Linear models are stable, i.e., small variations in the training data have only
    a limited impact on the learned model. In contrast, tree models tend to vary more
    with the training data, as the choice of a different split at the root of the
    tree typically means that the rest of the tree is different as well. As a result
    of having relatively few parameters, Linear models have low variance and high
    bias. This implies that Linear models are less likely to overfit the training
    data than some other models. However, they are more likely to underfit. For example,
    if we want to learn the boundaries between countries based on labelled data, then
    linear models are not likely to give a good approximation.


    # Distance-based models


    Distance-based models are the second class of Geometric models. Like Linear models,
    distance- based models are based on the geometry of data. As the name implies,
    distance-based models work on the concept of distance. In the context of Machine
    learning, the concept of distance is not based on merely the physical distance
    between two points. Instead, we could think of the distance between two points
    considering the mode of transport between two points. Travelling between two cities
    by plane


    ![image](d2d_images/image199.png)


    covers less distance physically than by train because a plane is unrestricted.
    Similarly, in chess, the concept of distance depends on the piece used – for example,
    a `Bishop` can move diagonally. Thus, depending on the entity and the mode of
    travel, the concept of distance can be experienced differently. The distance metrics
    commonly used are Euclidean, Minkowski, Manhattan, and Mahalanobis.


    ![image](d2d_images/image080.jpg)


    Distance is applied through the concept of neighbours and exemplars. Neighbours
    are points in proximity with respect to the distance measure expressed through
    exemplars. Exemplars are either centroids that find a centre of mass according
    to a chosen distance metric or medoids that find the most centrally located data
    point. The most commonly used centroid is the arithmetic mean, which minimises
    squared Euclidean distance to all other points.


    Notes:


    - The most commonly used centroid is the arithmetic mean, which minimises squared
    Euclidean distance to all other points.

    - Medoids find the most centrally located data point.

    - Centroids find a centre of mass according to a chosen distance metric.

    - Neighbours are points in proximity with respect to the distance measure expressed
    through exemplars.

    - The distance metrics commonly used are Euclidean, Minkowski, Manhattan, and
    Mahalanobis.

    - The concept of distance depends on the piece used – for example, a `Bishop`
    can move diagonally.


    # Probabilistic models


    The third family of machine learning is probabilistic models. In this section,
    we see how probabilistic models use probability. There are two types of probabilistic
    models: Predictive and Generative. Predictive models predict `Y | X` from `X`.
    Generative models estimate the joint distribution `P (Y, X)`. Once we know the
    joint distribution, it is possible to infer new data points. Conditional probability
    is based on the probability that something will happen, given that something else
    already happened. The task of the algorithm is to look at the evidence and determine
    the likelihood of a specific class and assign a label accordingly.


    - Theative models use the idea of probability.

    - The models use the idea of distance, e.g., K-means clustering.


    Naïve Bayes is an example of a probabilistic classifier. We can do this using
    Bayes rule:


    ![image](d2d_images/image199.png)


    ![image](d2d_images/image172.jpg)


    # Designing a Learning System


    For any learning system, we must be knowing the three elements — `T` (Task), `P`
    (Performance Measure), and `E` (Training Experience). At a high level, the process
    of learning system looks as below.


    ![image](d2d_images/image049.jpg)


    The learning process starts with task `T`, performance measure `P` and training
    experience `E` and objective are to find an unknown target function. The target
    function is an exact knowledge to be learned from the training experience and
    its unknown. For example, in a case of credit approval, the learning system will
    have customer application records as experience and task would be to classify
    whether the given customer application is eligible for a loan. So in this case,
    the training examples can be represented as


    ![image](d2d_images/image199.png)


    (x1,y1)(x2,y2)..(xn,yn) where `X` represents customer application details and
    `y` represents the status of credit approval.


    # Some broad categories of models:


    ![image](d2d_images/title_below.png)


    | Geometric models | Probabilistic models | Logical models |

    | :--- | :--- | :--- |

    | K-nearest neighbors, linear regression, support vector machine, logistic regression
    | Naïve Bayes, Gaussian process regression, conditional random field | Decision
    tree, random forest


    # Grouping and Grading


    Grading vs grouping is an orthogonal categorization to geometric-probabilistic-logical-compositional.


    - Grouping models break the instance space up into groups or segments and in each
    segment apply a very simple method (such as majority class). E.g. decision tree,
    KNN.

    - Grading models form one global model over the instance space. E.g. Linear classifiers
    – Neural networks

