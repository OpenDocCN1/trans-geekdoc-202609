    ## GENETIC PROGRAMMING


    Genetic programming (GP) is a form of evolutionary computation in which the individuals
    in the evolving population are computer programs rather than bit strings. The
    basic genetic programming approach and presents a broad range of simple programs
    that can be successfully learned by GP.


    ## Representing Programs


    ![image](d2d_images/image139.png)


    Programs manipulated by a GP are typically represented by trees corresponding
    to the parse tree of the program. Each function call is represented by a node
    in the tree, and the arguments to the function are given by its descendant nodes.
    For example, below Figure illustrates this tree representation for the


    ![image](d2d_images/image056.png)![image](d2d_images/image026.png)


    `sin(x) + x2 + y`


    To apply genetic programming to a particular domain, the user must define the
    primitive functions to be considered (e.g., `sin`, `cos`, `+`, `-`, `exponential`),
    as well as the terminals (e.g., `x`, `y`, constants such as `2`). The genetic
    programming algorithm then uses an evolutionary search to explore the vast space
    of programs that can be described using these primitives. As in a genetic algorithm,
    the prototypical genetic programming algorithm maintains a population of individuals
    (in this case, program trees). On each iteration, it produces a new generation
    of individuals using selection, crossover, and mutation. The fitness of a given
    individual program in the population is typically determined by executing the
    program on a set of training data. Crossover operations are performed by replacing
    a randomly chosen subtree of one parent program by a subtree from the other parent
    program.


    ![image](d2d_images/image084.png)


    ![image](d2d_images/image040.png)


    ![image](d2d_images/image079.png)


    Above Figure illustrates a typical crossover operation. It describes a set of
    experiments applying a GP to a number of applications. In his experiments, 10%
    of the current population, selected probabilistically according to fitness, is
    retained unchanged in the next generation. The remainder of the new generation
    is created by applying crossover to pairs of programs from the current generation,
    again selected probabilistically according to their fitness. The mutation operator
    was not used in this particular set of experiments.


    ## Illustrative Example


    One illustrative example presented by Koza (1992) involves learning an algorithm
    for stacking the blocks shown in below Figure. The task is to develop a general
    algorithm for stacking the blocks into a single stack that spells the word "universal,"
    independent of the initial configuration of blocks in the world. The actions available
    for manipulating blocks allow moving only a single block at a time. In particular,
    the top block on the stack can be moved to the table surface, or a block on the
    table surface can be moved to the top of the stack.


    ![image](d2d_images/image040.png)


    ![image](d2d_images/image127.png)


    As in most GP applications, the choice of problem representation has a significant
    impact on the ease of solving the problem. In Koza''s formulation, the primitive
    functions used to compose programs for this task include the following three terminal
    arguments:


    - `CS` (current stack), which refers to the name of the top block on the stack,
    or F if there is no current stack.

    - `TB` (top block), which refers to the name of the topmost block on the stack,
    such that it and those beneath it are in the correct order.

    - `NN` (next necessary), which refers to the name of the next block needed above
    `TB` in the stack, in order to spell the word "universal," or F if no more blocks
    are needed.


    As can be seen, this particular choice of terminal arguments provides a natural
    representation for describing programs for manipulating blocks for this task.
    Imagine, in contrast, the relative difficulty of the task if we were to instead
    define the terminal arguments to be the `x` and `y` coordinates of each block.


    In addition to these terminal arguments, the program language in this application
    included the following primitive functions:


    - `MS(x)` (move to stack), if block `x` is on the table, this operator moves `x`
    to the top of the stack and returns the value T. Otherwise, it does nothing and
    returns the value F.

    - `MT(x)` (move to table), if block `x` is somewhere in the stack, this moves
    the block at the top of the stack to the table and returns the value T. Otherwise,
    it returns the value F.

    - `EQ(x, y)` (equal), which returns T if `x` equals `y`, and returns F otherwise.

    - `NOT(x)`, which returns T if `x = F`, and returns F if `x = T`.

    - `DU(x, y)` (do until), which executes the expression `x` repeatedly until expression
    `y` returns the value T.

