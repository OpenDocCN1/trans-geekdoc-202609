    \ a number like 123. Working Now that we know what a Decision Tree is, we’ll see\
    \ how it works internally. There are many algorithms out there which construct\
    \ Decision Trees, but one of the best is called as ID3 Algorithm. ID3 Stands for\
    \ Iterative Dichotomiser 3. Before discussing the ID3 algorithm, we’ll go through\
    \ few definitions. Entropy Entropy, also called as Shannon Entropy is denoted\
    \ by H(S) for a finite set S, is the measure of the amount of uncertainty or randomness\
    \ in data.\n\n![image](d2d_images/image122.jpg)\n\nIntuitively, it tells us about\
    \ the predictability of a certain event. Example, consider a coin toss whose probability\
    \ of heads is 0.5 and probability of tails is 0.5. Here the entropy is the highest\
    \ possible, since there’s no way of determining what the outcome might be. Alternatively,\
    \ consider a coin which has heads on both the sides, the entropy of such an event\
    \ can be predicted perfectly since we know beforehand that it’ll always be heads.\
    \ In other words, this event has no randomness hence it’s entropy is zero. In\
    \ particular, lower values imply less uncertainty while higher values imply high\
    \ uncertainty. Information Gain Information gain is also called as Kullback-Leibler\
    \ divergence denoted by IG(S,A) for a set S is the effective change in entropy\
    \ after deciding on a particular attribute A. It measures the relative change\
    \ in entropy with respect to the independent variables\n\nIG(S, A) \\= H (S )−\
