  trans: "\n\n在一组实验中，他们探索了两种新遗传算子的添加，这些算子的灵感来自许多符号学习方法中常见的泛化算子。第一种算子 `AddAlternative`\
    \ 通过将对应属性子字符串中的 `0` 改为 `1` 来泛化对特定属性的约束。例如，如果一个属性的约束由字符串 `10010` 表示，该算子可能会将其更改为\
    \ `101 10`。该算子在每一代中以 `.O1` 的概率应用于种群中的选定成员。第二个算子 `Dropcondition` 执行了更激进的泛化步骤，通过将特定属性的所有位替换为\
    \ `1`。该算子对应于通过完全放弃对属性的约束来泛化规则，并在每一代中以 `.60` 的概率应用。作者报告说，这种改进后的系统在上述系列合成学习任务中实现了\
    \ 95.2% 的平均性能，而基础 `GA` 算法的性能仅为 92.1%。\n\n在上述实验中，这两个新算子以相同的概率应用于每一代种群中的每个假设。在第二个实验中，假设的位字符串表示被扩展，包含了两个位，用于决定这些算子哪些可以应用于该假设。在这一扩展表示中，一个典型规则集假设的位字符串将是\n\
    \n![image](img/image195.png)\n\n––––––––\n\n![image](img/scene_break.png) \n\n\
    在这种情况下，最后两个位表示 `AddAlternative` 算子可以应用于此位字符串，但 `Dropcondition` 算子不能应用。这两个新位定义了\
    \ `GA` 使用的搜索策略的一部分，并且本身也使用与处理字符串中其他位相同的交叉和变异算子进行更改和演化。虽然作者报告这种方法的结果不不齐（即在某些问题上性能提高，在另一些问题上性能下降），但它提供了一个有趣的说明，展示了\
    \ `GAS` 在原则上如何用于演化它们自身的假设搜索方法。\n\n## 假设空间搜索\n\n如所示，`GAS` 采用随机束搜索方法来寻找拟合度最大的假设。这种搜索与我们在本书书中考虑过的其他学习方法非常不同。为了将\
    \ `GAS` 的假设空间搜索与神经网络的 `BACKPROPAGATION` 进行对比，例如，`BACKPROPAGATION` 中的梯度下降搜索平滑地从一个假设移动到一个非常相似的新假设。相比之下，`GA`\
    \ 搜索可以移动得剧得多，通过一个可能与父假设完全不同的后代来替换父假设。因此注意，`GA` 搜索不太陷入可能困扰梯度下降方法的同类局部最小值。\n\n在某些\
    \ `GA` 应用中，一个实际的困难是拥挤（crowding）问题。拥挤是一种现象，种群中某些适应度高于其他个个体迅速繁殖，导致该个体的副本和非常相似的个体占据种群的大部分。拥挤的负面影响是减少了种群的多样性，从而减慢了\
    \ `GA` 的进一步进展。人们已经探索了多种减少拥挤的策略。一种方法是改变选择函数，使用锦标选择或排名选择等标准来代替适应度比例轮盘选择。另一种相关策略是“适应度共享”（fitness\
    \ sharing），其中由于种群中存在其他相似的个体，该个体的测得适应度会降低。第三种方法是限制允许组合形成后代的个体类型。例如，通过只允许最相似的个体进行组合，我们可以鼓励\n\
    \n![image](img/image040.png)\n\n相似个体聚类的形成，或种群中多个“亚种”的形成。这些技术的许多灵感源于对生物演化的模拟。\n\
    \n## 种群演化与模式定理\n\n有趣的问题是是否可以用数学方法刻画 `GA` 内部种群随时间的演化。模式定理（schema theorem）提供了这样一种刻画。它基于模式（schemas）或描述位字符串集合的模式的概念。准确来说，模式是任何由\
    \ `0`、`1` 和 `*` 组成的字符串。每个模式代表包含指示的 `0` 和 `1` 的位字符串集合，其中每个 `*` 被解释为“忽略关心”（don't\
    \ care）。例如，模式 `0*10` 代表恰好包含 `0010` 和 `01 10` 的位字符串集合。\n\n单个位字符串可以被看作它匹配的每个不同模式的代表。例如，位字符串\
    \ `0010` 可以被看作 `2⁴` 个不同模式的代表，包括 `00**`、`0*10`、`****` 等。同样，位字符串种群可以根据它所代表的模式集合以及与每个这些模式相关的个体数量来观察。\n\
    \n模式定理根据代表每个模式的实例数量来刻画 `GA` 内部种群的演化。令 `m(s, t)` 表示时间 `t` 时种群中模式 `s` 的实例数量（即第 `t^{th}`\
    \ 代）。模式定理描述了 `m(s,t+1)` 的期望值，其取决于 `m(s, t)` 以及模式、种群的属性和 `GA` 算法参数的其他属性。\n\n`GA`\
    \ 中种群的演化取决于选择步骤、重组步骤和变异步骤。让我们先考虑选择步骤的影响。令 `f (h)` 表示\n\n单个位字符串 `h` 的\n\n...\n\n\
