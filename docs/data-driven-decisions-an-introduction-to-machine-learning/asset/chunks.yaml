  trans: "\n\n![image](img/scene_break.png)\n\n# 线性模型\n\n线性模型相对简单。在这种情况下，函数被表示为其输入的线性组合。因此，如果\
    \ `x1` 和 `x2` 是两个维度相同的标量或向量，且 `a` 和 `b` 是任意标量，那么 `ax1 + bx2` 就代表 `x1` 和 `x2` 的线性组合。在\
    \ `f(x)` 代表直线的简单情况下，我们有形式为 `f (x) = mx + c` 的方程，其中 `c` 代表截距，`m` 代表斜率。\n\n![image](img/image014.jpg)\n\
    \n线性模型是参数化的，这意味着它们具有固定的形式，并包含少量需要从数据中学习的数值参数。例如，在 `f (x) = mx \\+ c` 中，`m` 和 `c`\
    \ 就是我们试图从数据中学习的参数。这种技术与树模型或规则模型不同，在后者中模型的结构（例如在树中使用哪些特征、以及在哪里使用）并不是预先固定的。\n\n\
    线性模型是稳定的，也就是说训练数据的微小变化对学习到的模型的影响有限。相比之下，树模型往往会随着训练数据产生更大的变化，因为在树的根节点选择不同的划分方式通常意味着树的其他部分也会随之改变。由于参数较少，线性模型具有低方差和高偏的。这意味着与其他一些模型相比，线性模型较不容易拟合训练数据。然而，它们更容易出现欠拟合。例如，如果我们想根据有标记数据学习国家之间的边界，那么线性模型可能无法给出良好的近似。\n\
    \n# 基于距离的模型\n\n基于距离的模型是几何模型的第二类。与线性模型一样，基于距离的模型也是基于数据的几何结构。正如其名所示，基于距离模型基于距离的概念。在机器学习的语境下，距离的概念并非仅仅基于两点之间的物理距离。相反，我们可以考虑两点之间的交通方式来思考两点之间的距离。乘坐飞机在城市之间旅行\n\
    \n![image](img/image199.png)\n\n在物理上覆盖的距离比坐火车要短，因为飞机不受限制。同样，在国际象棋中，距离的概念取决于所使用的棋子——例如，`Bishop`（象）可以对角线移动。因此，取决于实体和旅行方式，距离的概念可以有不同的体验。常用的距离度量包括欧几里得距离、闵可夫斯距离、曼哈顿距离和马拉宾尼距离。\n\
    \n![image](img/image080.jpg)\n\n距离通过邻居和样本的概念应用。邻居是相对于样本所表示的距离度量而接近的点。样本既可以是根据所选距离度量找到质心的质心（centroids），也可以是找到最中心的数据点的形（medoids）。最常用的质心是算术平均值，它最小了到所有其他点的平方欧几里得距离。\n\
    \n笔记：\n\n- 最常用的质心是算术平均值，它最小了到所有其他点的平方欧几里得距离。\n- 形寻找位置最中心的数据点。\n- 质心根据所选距离度量找到质心。\n\
    - 邻居是相对于通过样本表示的距离度量而接近的点。\n 常用的距离度量包括欧几里得距离、闵可夫斯距离、曼哈顿距离和马拉宾尼距离。\n- 距离的概念取决于所使用的棋子——例如，`Bishop`可以对角线移动。\n\
    \n# 概率模型\n\n机器学习的第三类是概率模型。在本节中，我们将看到概率模型如何使用概率。概率模型有两种：预测型和生成型。预测型模型从 `X` 预测 `Y\
    \ | X`。生成型模型估计联合分布 `P (Y, X)`。一旦我们知道了联合分布，就可以推导出新的数据点。条件概率基于在某事已经发生的情况下，某事发生的概率。算法的任务是观察证据并确定特定类的概率，并相应地分配标签。\n\
    \n- 生成模型使用了概率的思想。\n- 模型使用了距离的思想，例如 K-means 聚类。\n\n朴贝叶斯（Naïve Bayes）是概率分类器示例。我们可以使用贝叶斯规则来实现：\n\
    \n![image](img/image199.png)\n\n![image](img/image172.jpg)\n\n# 设计学习系统\n\n对于任何学习系统，我们必须了解三个要素：`T`（任务）、`P`（性能度量）和\
    \ `E`（训练经验）。在高层面上，学习系统的过程如下。\n\n![image](img/image049.jpg)\n\n学习过程从任务 `T`、性能度量\
    \ `P` 和训练经验 `E` 开始，目标是找到一个未知的目标函数。目标函数是从训练经验中学习的精确知识。例如，在贷款审批的案例中，学习系统将客户申请记录作为经验，任务将是分类给定的客户申请是否符合贷款条件。在这种情况下，训练示例可以表示为\n\
    \n![image](img/image199.png)\n\n(x1,y1)(x2,y2)..(xn,yn) 其中 `X` 代表客户申请详情，`y` 代表贷款审批的状态。\n\
    \n# 模型的一些分类：\n\n![image](img/title_below.png)\n\n| 几何模型 | 概率模型 | 逻辑模型 |\n| :---\
    \ | :--- | :--- |\n| K 最近邻、线性回归、支持向量机、逻辑回归 | 朴贝叶斯、高斯过程回归、条件随机场 | 决策树、随机森林 |\n\n\
    # 分组与分级\n\n分级与分组是与几何-概率-逻辑-组合分类正交的。\n\n- 分组模型将实例空间划分为若干组或段，并在每个段内应用非常简单的方法（如多数类法）。例如：决策树、KNN。\n\
    - 分级模型在整个实例空间上形成一个全局模型。例如：线性分类器——神经网络。\n\n"
