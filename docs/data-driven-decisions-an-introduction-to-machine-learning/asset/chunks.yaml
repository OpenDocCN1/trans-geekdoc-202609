    \nWhere,\n\n––––––––\n![image](d2d_images/scene_break.png) \n\n`N`=Total number\
    \ of observation, `Yi` = Actual value\n`(a1xi+a0)`= Predicted value.\n\n**Residuals**:\
    \ The distance between the actual value and predicted values is called residual.\
    \ If the observed points are far from the regression line, then the residual will\
    \ be high, and so cost function will high. If the scatter points are close to\
    \ the regression line, then the residual will be small and hence the cost function.\n\
    \n## Gradient Descent\n\n- Gradient descent is used to minimize the MSE by calculating\
    \ the gradient of the cost function.\n- A regression model uses gradient descent\
    \ to update the coefficients of the line by reducing the cost function.\n- It\
    \ is done by a random selection of values of coefficient and then iteratively\
    \ update the values to reach the minimum cost function.\n\n# Model Performance\n\
    \nThe Goodness of fit determines how the line of regression fits the set of observations.\
    \ The process of finding the best model out of various models is called optimization.\
    \ It can be achieved by below method:\n\n1. **R-squared method**:\n    - R-squared\
    \ is a statistical method that determines the goodness of fit.\n    - It measures\
    \ the strength of the relationship between the dependent and independent variables\
    \ on a scale of 0-100%.\n    - The high value of R-square determines the less\
    \ difference between the predicted values and actual values and hence represents\
    \ a good model.\n    - It is also called a coefficient of determination, or coefficient\
    \ of multiple determination for multiple regression.\n    - It can be calculated\
    \ from the below formula:\n\n![image](d2d_images/image103.png)\n\n# Assumptions\
    \ of Linear Regression\n\nBelow are some important assumptions of Linear Regression.\
    \ These are some formal checks while building a Linear Regression model, which\
    \ ensures to get the best possible result from the given dataset.\n\n- **Linear\
    \ relationship between the features and target**:\nLinear regression assumes the\
    \ linear relationship between the dependent and independent variables.\n- **Small\
    \ or no multicollinearity between the features**:\nMulticollinearity means high-correlation\
    \ between the independent variables. Due to multicollinearity, it may difficult\
    \ to find the true relationship between the predictors and target variables. Or\
    \ we can say, it is difficult to determine which predictor variable is affecting\
