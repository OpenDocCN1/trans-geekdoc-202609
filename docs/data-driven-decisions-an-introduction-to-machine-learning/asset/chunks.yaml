    虽然我们对学习许多互连单元的网络感兴趣，但让我们先从如何学习单个感知器的权重开始。这里精确的学习问题是确定一个权重向量，使得感知器对每个给定的训练示例产生正确的
    `±1` 输出。


    已知有几种算法可以解决这个学习问题。这里我们考虑两种：`perceptron rule`（感知机规则）和 `delta rule`（delta 规则）。这两种算法在不同的条件下保证收敛到某种不同的接受假设。它们对于
    `ANNs`（人工神经网络）非常重要，因为它们为学习多单元网络提供了基础。


    ### 感知机规则


    学习接受权重向量的一种方法是从随机权重开始，然后迭代地对每个训练示例应用`perceptron`，每当它错误分类一个示例时，就修改`perceptron`的权重。这个过程重复进行，根据需要迭代训练示例，直到感知器能够正确分类所有训练示例为止。在每一步中，权重都会根据`perceptron
    training rule`进行修改，该规则根据以下规则修订与输入 `xi` 相关的权重 `wi`：


    ![image](img/image182.png)


    在这里，`t` 是当前训练示例的目标输出，`o` 是由


    ![image](img/image040.png)


    感知机生成的输出，而 `η` 是一个称为学习率的正常数。学习率的作用是调节每一步权重改变的程度。它通常被设置为某个小值（例如 `0.1`），并且有时随着权重调优迭代次数的增加而衰减。


    为什么这个更新规则应该收敛到成功的权重值？为了获得直观的感受，考虑一些特定情况。假设训练示例已经由


    ![image](img/image040.png)


    感知机正确分类。在这种情况下，`(t - o)` 为零，导致 `Δ wi` 为零，因此不更新任何权重。假设目标输出为 `+1` 时，感知机输出了 `-1`。为了在这种情况下让感知机输出
    `+1` 而不是 `-1`，必须更改权重以增加 `w. x` 的值。例如，如果 `xi>0`，那么增加 `wi` 将使感知机更接近正确分类该示例。注意训练规则将增加
    `w`，在这种情况下，因为 `(t - o)`、`η` 和 `xi` 都是正数。例如，如果 `xi = .8`，`η = 0.1`，`t = 1` 且 `o
    = -1`，则权重更新为：


    `Δ wi = η (t - o)xi = O.1(1 - (-1))0.8 = 0.16`。相反，如果 `t = -1` 且 `o = 1`，则与正 `xi`
    相关的权重将减少而不是增加。事实上，只要训练示例是线性可分的并且使用了足够小的 `η`，上述学习过程可以证明在有限次应用`perceptron training
    rule` 后收敛到一个能够正确分类所有训练示例的权重向量。如果数据不是线性可分的，则不能保证收敛。


    ## 梯度下降和 delta 规则


    尽管`perceptron rule` 在训练示例线性可分时能找到成功的权重向量，但如果示例不是线性可分的，它可能无法收敛。第二种训练规则称为 `delta
    rule`，旨在克服这种困难。如果训练示例不是线性可分的，`delta rule` 将收敛于目标概念的最优拟合近似。`delta rule` 背后的核心思想是使用
    `gradient descent`（梯度下降）在可能权重向量的假设空间中搜索，以找到最适合训练示例的权重。该规则很重要，因为 `gradient descent`
    为 `BACKPROPAGATION`（反向传播）算法提供了基础，该算法可以学习具有许多互连单元的网络。它同样重要，因为 `gradient descent`
    提供了 `BACKPROPAGATION` 算法的基础，该算法可以学习具有许多互连单元的网络。`gradient descent` 搜索可能权重向量的假设空间，以找到最适合训练示例的权重。该规则很重要，因为
    `gradient` 搜索 image 训练示例的权重。


