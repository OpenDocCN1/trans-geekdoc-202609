    支持向量机或 `SVM` 是最流行的监督学习算法之一，用于分类问题和回归问题。然而，在机器学习中，它主要用于分类问题。`SVM` 算法的目标是创建一个最佳的直线或决策边界，将
    n 维空间划分为不同的类别，以便我们将来能够轻松地将新数据点归入正确的类别中。这种最佳决策边界被称为超平面（hyperplane）。`SVM` 选择有助于创建超平面的极点/向量。这些极情况被称为`支持向量`（support
    vectors），因此该算法被称为`支持向量机`（Support Vector Machine）。考虑下图，其中有两个不同的类别，通过决策边界或`超平面`进行分类：


    ![image](img/image025.jpg)


    示例：`SVM` 可以通过我们在 `KNN` 分类器中使用的例子来理解。假设我们看到一只奇怪的猫，它也具有一些狗的特征，如果我们想要一个能够准确识别它是猫还是狗的模型，那么就可以使用
    `SVM` 算法创建一个这样的模型。我们首先用大量的猫和狗图像来训练模型，使其能够学习猫和狗的不同特征，然后用这个奇怪的生物对其进行测试。因此，由于支持向量在两个数据（猫和狗）之间创建了决策边界并选择极端情况（`支持向量`），它将看到猫和狗的极端情况。根据`支持向量`，它将将其分类为猫。考虑下图：


    `SVM` 算法可以用于人脸检测、图像分类、文本分类等。`SVM` 的类型


    ## `SVM` 可以分为两种类型：


    ![image](img/image040.png)


    *   `线性 SVM`：`线性 SVM` 用于线性可分数据，这意味着如果一个数据集可以使用一条直线分类为两类，那么此类数据就被称为线性可分数据，使用的分类器称为`线性
    SVM 分类器`。

    *   `非线性 SVM`：`非线性 SVM` 用于非线性分离数据，这意味着如果一个数据集不能用直线分类，那么此类数据就被称为非线性数据，使用的分类器称为`非线性
    SVM 分类器`。


    ### `SVM` 算法中的超平面和支持向量：


    **超平面**：可以使用多条直线/决策边界来分割 n 维空间中的类别，但我们需要找到有助于分类数据点的最佳决策边界。这种最佳边界被称为 `SVM` 的`超平面`。


    `超平面`的维度取决于数据集中存在的特征，这意味着如果有 2 个特征（如图所示），`超平面`将是一条直线。如果有 3 个特征，那么`超平面`将是一个二维平面。


    我们总是创建一个具有最大间隔（maximum margin）的`超平面`，这意味着数据点之间的最大距离。


    ### `支持向量`：


    离`超平面`最近且影响超平面位置的数据点或向量被称为`支持向量`。由于这些向量支持超平面，因此被称为`支持向量`。`SVM`是如何工作的？


    ### `线性 SVM`：


    ![image](img/image005.png)


    可以通过例子来理解 `SVM` 算法的工作原理。假设我们有一个有两个标签（绿色和蓝色）的数据集，该数据集有两个特征 `x1` 和 `x2`。我们想要一个分类器，可以将坐标对`pair(x1,
    x2)` 分类为绿色或蓝色。考虑下图：


    由于由于是二维空间，因此只需使用一条直线，我们就可以轻松地分离这两个类别。但可能有多条线可以分离这些类别。考虑下图：


    ![image](img/image040.png)


    因此，由于是二维空间，我们仅用一条直线就可以轻松地分离这两个类别。但`是``可以`。


    ![image](img/image125.png)


    因此，这些点被称为`支持向量`。`SVM` 的目标是最大化这些间隔。这被称为`超平面`。


    ### `非线性 SVM`：


    如果数据是线性排列的，我们可以使用直线分离，但对于非线性数据，我们无法画出直线。如下：


    ![image](img/image018.png)


    因此我们需要增加一个维度来分离这些数据。


    ![image](img/image022.png)


    ![image](img/image040.png)


    由于我们处于三维空间，因此 `z` `，`超平面` 如下：


    ![image](img/image166.png)


    因此 `支持`，`SVM` 的工作方式如下：


    ![image](img/image193.png)


    ## `SVM 核`


    在实践中，`SVM` 算法通过核来实现，核将输入空间转换为：


    ![image](img/image040.png)


    所需的形状。这使得 SVM 更加强大、灵活和准确。以下是 SVM 使用的一些核类型。


    ### 线性核


    它可以作为两个观测值之间的点积。线性核的公式如下


    ```

    K(x,xi)=sum(x∗xi)

    ```


    从上面的公式中，我们可以看到 `x` 和 `xi` 之间的乘积之和。


