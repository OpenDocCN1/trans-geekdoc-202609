    \ Variance in the estimate. Even if the hypothesis accuracy is measured over an\
    \ unbiased set of test examples independent of the training examples, the measured\
    \ accuracy can still vary from the true accuracy, depending on the makeup of the\
    \ particular set of test examples. The smaller the set of test examples, the greater\
    \ the expected variance.\n\n## Estimating Hypothesis Accuracy Sample Error –\n\
    \nThe sample error of a hypothesis with respect to some sample S of instances\
