  trans: "\n\n这些规则的使用示例如表 2 所示，该表展示了不同规则的效果。求和规则是最直观的，且在实践中应用最广泛。中值规则对异常值更具鲁棒性；最小规则和最大规则分别是悲观和乐观的。通过乘法规则，每个学习器都拥有否决权；无论其他学习器如何，只要有一个学习器的输出为\
    \ 0，整体输出就会变为 0。注意，在应用组合规则之后，`yi` 并不一定之和为 1。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- |\
    \ --- | --- |\n\n![image](img/chapter_title_above.png) \n\n# ![image](img/image157.png)\n\
    \n表 2：三个学习器和三个类的组合规则示例\n\n![image](img/chapter_title_below.png) \n\n在加权求和中，`dji`\
    \ 是学习器 `j` 对类 `Ci` 的投票，`wj` 是该投票的权重。简单投票是所有投票者权重相等的特例，即 `wj = 1/L`。在分类中，这被称为少数服投票，即票数最多的类为获胜者。\n\
    \n当存在两个类时，这是多数投票，获胜类获得超过一半的票数。如果投票者还能提供关于对每个类投票数的额外信息（例如通过后验概率），那么在归一化之后，这些可以作为加权投票方案中的权重。等地，如果\
    \ `dji` 是类后验概率 `P(Ci | x,Mj )`，我们只需要将它们求和（`wj = 1/L`）并选择 `yi` 最大的类即可。\n\n在回归情况下，可以使用简单平均、加权平均或中值来融合基回归器的输出。与平均值相比，中值对噪声更具鲁棒性。\n\
    \n寻找 `wj` 的另一种方法是在独立的验证集上评估学习器（回归器或分类器）的准确率，并利用这些信息计算权重，从而给更准确的学习器分配更大的权重。\n\n\
    投票方案可以看是贝叶斯框架下的近似，其中权重近似先验模型概率，模型决策近似模型条件似然。\n\n![image](img/image179.png)\n\n\
    ––––––––\n\n![image](img/scene_break.png) \n\n简单投票对应于均匀先验。如果我们有一个倾向于更简单模型的先验分布，这将给它们分配更大的权重。我们无法对所有模型进行积分；只选择我们认为\
    \ `P(Mj )` 较高的子集，或者我们可以进行另一个贝叶斯步骤并计算 `P(Ci | x,Mj )`（给定样本的模型概率），并从该密度中采样高概率模型。\n\
    \n假设 `dj` 是独立同分布的（iid），期望值为 `E[dj]`，方差为 `Var(dj )`，那么当我们取\n\n![image](img/image040.png)\n\
    \n`wj = 1/L` 的简单平均值时，输出的期望值和方差为\n\n![image](img/image054.png)\n\n输出的期望值和方差为\n\n\
    输出的期望值和方差为\n\n输出的期望值和方差为\n\n我们看到期望值没有改变，因此偏差没有改变。输出的期望值和方差为。在一般情况下，\n\n![image](img/image164.png)\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n这意味着如果学习器是正相关的，则误差。\n\n## 纠错输出码\n\
    \n纠错输出码（ECOC）方法是一种允许将多分类问题（K > 2）转化为二分类问题（K = 2）的技术，并使用任何学习算法来实现二分类器基学习器。\n\n"
- fmt: "\nIf we can have `L` high, we can just randomly generate the code matrix with\
    \ $-1/ \\+ 1$ and this will work fine, but if we want to keep `L` low, we need\
    \ to optimize `W`. The approach is to set `L` beforehand and then find `W` such\
    \ that the distances between rows, and at the same time the distances between\
    \ columns, are as large as possible, in terms of Hamming distance. With `K` classes,\
    \ there are $2^{((K\\-1)) − 1$ possible columns, namely, two-class problems. This\
    \ is because `K` bits can be written in $2^K$ different ways and complements (e.g.,\
    \ “0101” and “1010,” from our point of view, define the same discriminant) dividing\
    \ the possible combinations by 2 and then subtracting 1 because a column of all\
    \ 0s (or 1s) is useless. For example, when `K \\= 4`, we have\n\n![image](d2d_images/image191.png)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png)\n\nWhen `K` is large, for a\
    \ given value of `L`, we look for `L` columns out of the $2^{((K\\-1))−1}$. We\
    \ would like these columns of `W` to be as different as possible so that the tasks\
    \ to be learned by the base-learners are as different from each other as possible.\
    \ At the same time, we would like the rows of `W` to be as different as possible\
    \ so that we can have maximum error correction in case one or more base-learners\
    \ fail.\n\nECOC can be written as a voting scheme where the entries of `W`, `wij`,\
    \ are considered as vote weights:\n\n![image](d2d_images/image040.png)\n\n![image](d2d_images/image160.png)\n\
    \n![image](d2d_images/image188.png)\n\nand then we choose the class with the highest\
    \ `yi`. Taking a weighted sum and then choosing the maximum instead of checking\
    \ for an exact match allows `dj` to no longer need to be binary but to take a\
    \ value between $-1$ and $+1$, carrying soft certainties instead of hard decisions.\
    \ Note that a value `pj` between 0 and 1, for example, a posterior probability,\
    \ can be converted to a value `dj` between $-1$ and $+1$ simply as\n\nOne problem\
    \ with ECOC is that because the code matrix `W` is set a priori, there is no guarantee\
    \ that the subtasks as defined by the columns of `W` will be simple.\n\n## Bagging\n\
    \nBootstrap aggregating, often abbreviated as bagging, involves having each model\
    \ in the ensemble vote with equal weight. In order to promote model variance,\
    \ bagging trains each model in the ensemble using a randomly drawn subset of the\
    \ training set. As an example, the [random](https://en.wikipedia.org/wiki/Random_forest)\
    \ [forest ](https://en.wikipedia.org/wiki/Random_forest)algorithm combines random\
    \ decision trees with bagging to achieve very high classification accuracy.\n\n\
    The simplest method of combining classifiers is known as bagging, which stands\
    \ for bootstrap aggregating, the statistical description of the method. This is\
    \ fine if you know what a bootstrap is, but fairly useless if you don’t. A bootstrap\
    \ sample is a sample taken from the original dataset with replacement, so that\
    \ we may get some data several times and others not at all. The bootstrap sample\
    \ is the same size as the original, and lots and lots of these samples are taken:\
    \ `B` of them, where `B` is at least 50, and could even be in the thousands. The\
    \ name bootstrap is more popular in computer science than anywhere else, since\
    \ there is also a bootstrap loader, which is the first program to run when a computer\
    \ is turned on. It comes from the nonsensical idea of ‘picking yourself up by\
    \ your bootstraps,’ which means lifting yourself up by your shoelaces, and is\
    \ meant to imply starting from nothing.\n\nBootstrap sampling seems like a very\
    \ strange thing to do. We’ve taken a perfectly good dataset, mucked it up by sampling\
    \ from it, which might be good if we had made a smaller dataset (since it would\
    \ be faster), but we still ended up with a dataset the same size. Worse, we’ve\
    \ done it lots of times. Surely this is just a way to burn up computer time without\
    \ gaining anything. The benefit of it is that we will get lots of learners that\
    \ perform slightly differently, which is exactly what we want for an ensemble\
    \ method. Another benefit is that estimates of the accuracy of the classification\
    \ function can be made without complicated analytic work, by throwing computer\
    \ resources at the problem (technically, bagging is a variance reducing algorithm;\
    \ the meaning of this will become clearer when we talk about bias and variance).\
    \ Having taken a set of bootstrap samples, the bagging method simply requires\
    \ that we fit a model to each dataset, and then combine them by taking the output\
    \ to be the majority vote of all the classifiers. A NumPy implementation is shown\
    \ next, and then we will look at a simple example.\n\n### Compute bootstrap samples\n\
    \n```python\nsamplePoints = np.random.randint(0,nPoints,(nPoints,nSamples))\n\
    classifiers = []\n\nfor i in range(nSamples):\n    sample = []\n    sampleTarget\
    \ = []\n    for j in range(nPoints):\n        sample.append(data[samplePoints[j,i]])\n\
    \        sampleTarget.append(targets[samplePoints[j,i]])\n```\n\n![image](d2d_images/image040.png)\n\
    \n### Train classifiers\n\n```python\nclassifiers.append(self.tree.make_tree(sample,sampleTarget,features))\n\
    ```\n\nThe example consists of taking the party data that was used to demonstrate\
    \ the decision tree, and restricting the trees to stumps, so that they can make\
    \ a classification based on just one variable\n\n![image](d2d_images/image072.png)\n\
    \nWhen we want to construct the decision tree to decide what to do in the evening,\
    \ we start by listing everything that we’ve done for the past few days to get\
    \ a suitable dataset (here, the last ten days):\n\nThe output of a decision tree\
    \ that uses the whole dataset for this is not surprising: it takes the two largest\
    \ classes, and separates them. However, using just stumps of trees and 20 samples,\
    \ bagging can separate the data perfectly, as this output shows:\n\n![image](d2d_images/image065.jpg)\n\
    \n## RANDOM FORESTS\n\nA random forest is an ensemble learning method where multiple\
    \ decision trees are constructed and then they are merged to get a more accurate\
    \ prediction.\n\nIf there is one method in machine learning that has grown in\
    \ popularity over the last few years, then it is the idea of random forests. The\
    \ concept has been around for longer than that, with several different people\
    \ inventing variations, but the name that is most strongly attached to it is that\
    \ of Breiman, who also described the CART algorithm in unit 2.\n\nFigure 3: Example\
    \ of random forest with majority voting\n\n![image](d2d_images/image040.png)\n\
    \n![image](d2d_images/image116.jpg)\n\nThe idea is largely that if one tree is\
    \ good, then many trees (a forest) should be better, provided that there is enough\
    \ variety between them. The most interesting thing about a random forest is the\
    \ ways it creates randomness from a standard dataset. The first of the methods\
    \ that it uses is the one we have just seen: bagging. If we wish to create a forest\
    \ then we can make the trees different by training them on slightly different\
    \ data, so we take bootstrap samples from the dataset for each tree. However,\
    \ this isn’t enough yet. The other obvious place where it is possible to add randomness\
    \ is to limit the choices that the decision tree can make. At each node, a random\
    \ subset of the features is given to the tree, and it can only pick from that\
    \ subset rather than from the whole set.\n\nAs well as increasing the randomness\
    \ in the training of each tree, it also speeds up the training, since there are\
    \ fewer features to search over at each stage. Of course, it does introduce a\
    \ new parameter (how many features to consider), but the random forest does not\
    \ seem to be very sensitive to this parameter; in practice, a subset size that\
    \ is the square root of the number of features seems to be common. The effect\
    \ of these two forms of randomness is to reduce the variance without effecting\
    \ the bias. Another benefit of this is that there is no need to prune the trees.\
    \ There is another parameter that we don’t know how to choose yet, which is the\
    \ number of trees to put into the forest. However, this is fairly easy to pick\
    \ if we want optimal results: we can keep on building trees until the error stops\
    \ decreasing.\n"
