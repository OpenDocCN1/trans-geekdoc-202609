    # 1. 分类树（是/否类型）


    我们上面看到的是分类树的一个示例，其中结果是一个类似于 `fit` 或 `unfit` 的变量。这里决策变量是 `Categorical`（类别/分类型）。


    # 2. 回归树（连续数据类型）


    在这里，决策或结果变量是 `Continuous`（连续型），例如像 `123` 这样的数字。现在我们已经知道了什么是 `Decision Tree`（决策树），我们将看到它内部是如何工作的。有很多算法可以构建
    `Decision Trees`，但最好的算法之一被称为 `ID3 Algorithm`。`ID3` 代表 `Iterative Dichotomiser
    3`（迭代二分决策 3）。在讨论 `ID3` 算法之前，我们将通过几个定义。


    ### 熵


    `Entropy`（熵），也称为 `Shannon Entropy`（香农熵），对于有限集合 `S` 用 `H(S)` 表示，它是数据不确定性或随机性的量。


    ![image](img/image122.jpg)


    直观地说，它告诉我们某个事件的可预测性。例如，考虑一个硬币投掷，其正面的概率为 `0.5`，反面的概率为 `0.5`。这里的熵是可能的最大，因为无法确定结果是什么。另一种，考虑一个两面都是面的硬币，这种事件的熵是可以被完美预测的，因为我们预先知道它将一直是正面。换句话说，这个事件没有随机性，因此它的熵为零。特别，较低的值意味着不确定性较小，而较高的值意味着不确定性较高。


    ### 信息增益


    Information gain（信息增益）也称为 `Kullback-Leibler divergence`（ Kullback-Leibler 散度），对于集合
    `S` 用 `IG(S,A)` 表示在决定特定属性 `A` 后熵的有效变化。它衡量了熵相对于独立变量的相对变化。


    `IG(S, A) = H(S) - H(A)`


    ![image](img/image199.png)


    或者，


    ––––––––


    ![image](img/scene_break.png)


    ![image](img/image178.png)


    `IG(S, A) = H(S) - ∑ P(x) * H(x)` = 0


    其中 `IG(S, A)` 是应用特征 `A` 带来的信息增益。`H(S)` 是整个集合的熵，而第二项计算应用特征 `A` 后的熵，其中 `P(x)` 是事件
    `x` 的概率。


    通过例子来理解这一点。考虑在 14 天内收集的数据数据，特征为 `Outlook`（天气）、`Humidity`（湿度）、`Wind`（风力），结果变量是是否玩
    `Golf`（高尔夫）。现在我们的任务是建立一个预测模型，获取上述参数并预测当天是否会玩 `Golf`。我们将使用 `ID3` 构建一个决策树来完成。


    | 天 | 天气 | 温度 | 风力 | 是否玩高尔夫 |

    | :--- | :--- | :--- | :--- | :--- |

    | D1 | Sunny | Hot | Weak | No |

    | D2 | Sunny | Hot | Strong | No |

    | D3 | Overcast | Hot | Weak | Yes |

    | D4 | Rain | Mild | Weak | Yes |

    | D5 | Rain | Cool | Normal | Yes |

    | D6 | Rain | Cool | Strong | No |

    | D7 | Overcast | Cool | Strong | Yes |

    | D8 | Sunny | Mild | Weak | No |

    | D9 | Sunny | Cool | Normal | Yes |

    | D10 | Rain | Mild | Normal | Yes |

    | D11 | Sunny | Mild | Strong | Yes |

    | D12 | Overcast | Mild | Strong | Yes |

    | D13 | Overcast | Hot | Normal | Yes |

    | D14 | Rain | Mild | Strong | No |


    ### ID3


    `ID3 Algorithm` 将递归地执行以下任务：

    1. 为树创建根节点。

    2. 如果所有示例都是正例，返回叶子节点 `positive`。

    3. 否则，如果所有示例都是负例，返回叶子节点 `negative`。

    4. 计算当前状态的熵 `H(S)`。

    5. 对于每个属性，计算相对于属性 `x` 的熵，用 `H(S, x)` 表示。

    6. 选择 `IG(S, x)` 最大值的属性。

    7. 从属性集合中移除提供最高 `IG` 的属性。

    8. 重复直到我们用完所有属性，或者决策树拥有所有叶子节点。


    现在我们将继续生长决策树。第一步是计算当前状态的熵 `H(S)`。在上面的示例中，我们可以看到总共有 5 个 `No` 和 9 个 `Yes`。


    | Yes | No | 总计 |

    | :--- | :--- | :--- |

    | 9 | 5 | 14 |


    ![image](img/image134.jpg) 其中 `x` 是属性的可能可能取值。在这里，属性 `Wind`（风力）在样本数据中取两个可能的值，因此
    `x = {Weak, Strong}`，我们需要计算：


    ![image](img/image020.jpg)


    ––––––––


    ![image](img/scene_break.png)


    在所有 14 个示例中，我们有 8 处风力是弱的，6 处风力是 `Strong`（强力的）。


    | Wind = Weak | Wind = Strong | 总计 |

    | :--- | :--- | :--- |

    | 8 | 6 | 14 |


    ![image](img/image199.png)![image](img/image69.jpg)


    在 8 个 `Weak` 示例中，有 6 个是 `Yes`（玩高尔夫），2 个是 `No`（不玩）。同样，在 6 个 `Strong` 示例中，有 3 个是
    `Yes`，3 个是 `No`。


    ![image](img/image133.jpg)


    ––––––––


    ![image](img/scene_break.png)


    记住，在这里有一半的项属于一类，而另一半属于另一类。因此我们无法完美预测随机性。现在我们有了足够的部分来计算信息增益，


    ![image](img/image60.jpg)


    ––––––––


    ![image](img/scene_break.png)


    通过考虑 `Wind` 作为特征告诉我们信息增益为 `0.048`。现在我们必须同样计算所有特征的信息增益。


    ![image](img/image202.jpg)


    我们可以清楚地看到 `IG(S, Outlook)` 具有最大的信息增益 `0.246`，因此我们选择了 `Outlook` 属性作为根节点。此时，决策树看起来如下：


    ![image](img/image021.jpg)![image](img/image_076.jpg)


    在这里观察到，只要天气是 `Overcast`（阴天），`Play Golf` 总是 `Yes`。这不是偶然，是因为信息增益是由该属性给出的。现在从这里如何继续？我们可以简单地应用递归，你可能想看之前的算法步骤。现在在使用
    `Outlook` 后，我们剩下三个：`Humidity`、`Temperature`、`Wind`。而且 `Outlook` 有三个可能的值：`Sunny`、`Overcast`、`Rain`。由于
    `Overcast` 节点已经变成了叶子节点 `Yes`，所以我们剩下两个子树需要计算：`Sunny` 和 `Rain`。


    ![image](img/image123.jpg)


    天气值为 `Sunny` 的表格如下：


    | 温度 | 湿度 | 风力 | 是否玩高尔夫 |

    | :--- | :--- | :--- | :--- |

    | Hot | High | Weak | No |

    | Hot | High | Strong | No |

    | Mild | High | Weak | No |

    | Cool | Normal | Weak | Yes |

    | Mild | Normal | Strong | Yes |


    ![image](img/image099.jpg)


    我们可以看到最高的信息增益是由 `Humidity` 给出的。以相同的方式处理


    ![image](img/image027.jpg)![image](img/image019.jpg)


    将得到 `Wind` 是信息增益最大的一个。最终的决策树看起来像这样。最终的决策树看起来像这样。


    ––––––––


    ![image](img/scene_break.png)


