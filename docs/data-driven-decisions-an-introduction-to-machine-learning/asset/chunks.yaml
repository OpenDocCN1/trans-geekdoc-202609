  trans: "\n\n*   无监督学习针对未标记和未分类的数据运行，这使得无监督学习变得更加重要。\n*   在现实世界中，我们并不总是拥有具有对应输出的输入数据，为了解决此类情况，我们需要无监督学习。\n\
    \n## 无监督学习的工作原理\n\n![image](img/image129.jpg)\n\n无监督学习的工作原理可以通过下图来理解：\n\n在这里，我们取了一个未标记的输入数据，这意味着它没有被分类，也没有给出相应的输出。现在，将这些未标记的输入数据输入到机器学习模型中进行训练。首先，它将解释原始数据以从数据中找到隐藏模式，然后应用合适的算法，如`k-means\
    \ clustering`、`Decision tree` 等。\n\n一旦应用了适的算法，该算法将根据对象之间的相似性和差异将数据对象分为组。\n\n##\
    \ 无监督学习算法的类型\n\n无监督学习算法可以进一步分为两类问题：\n\n![image](img/image083.jpg)\n\n![image](img/image040.png)\n\
    \n*   **聚类 (Clustering)**：聚类是一种将对象分组到簇中的方法，使得具有大多数相似性的对象保留在一组，而与另一组对象的相似性较小或没有相似性。聚类分析发现数据对象之间的共同点并根据这些共同点的存在与否对它们进行分类。\n\
    *   **关联 (Association)**：关联规则是一种无监督学习方法，用于发现大型数据库中变量之间的关系。它确定了数据集中同时出现的项目集。关联规则使营销策略更有效。例如，购买了\
    \ X 项目（假设是面包）的人也倾向于购买 Y 项目（黄油/果酱）。关联规则的一个典型例子是购物篮子分析。\n\n––––––––\n\n![image](img/scene_break.png)\
    \ \n\n## 无监督学习算法\n\n以下是一些常用的无监督学习算法的列表：\n\n*   `K-means clustering`\n*   `KNN`\
    \ (`k-nearest neighbors`)\n*   `Hierarchal clustering`\n*   `Anomaly detection`\n\
    *   `Neural Networks`\n*   `Principle Component Analysis`\n*   `Independent Component\
    \ Analysis`\n*   `Apriori algorithm`\n*   `Singular value decomposition`\n\n##\
    \ 无监督学习的优势\n\n*   与监督学习相比，无监督学习用于更复杂的任务，因为在无监督学习中我们没有标记数据。\n*   无监督学习是优选的，因为与标记数据相比，未标记数据更容易获得。\n\
    \n## 无监督学习的缺点\n\n*   无监督学习在本质上比监督学习更困难，因为它没有相应的输出。\n*   无监督学习算法的结果可能不准确，因为输入数据没有标记，且算法不知道确切的输出。\n\
    \n![image](img/image040.png)\n\n| 监督学习 | 无监督学习 |\n| --- | --- |\n| 监督学习算法使用标记数据进行训练。\
    \ | 无监督学习算法使用未标记数据进行训练。 |\n| 监督学习模型通过直接反馈来检查预测输出是否正确。 | 无监督学习模型不接收反馈。 |\n| 监督学习模型预测输出。\
    \ | 无监督学习模型发现数据中的隐藏模式。 |\n| 在监督学习中，输入数据随输出一起提供。 | 在无监督学习中，只向模型提供输入数据。 |\n| 监督学习的目标是训练模型，使其在给定新数据时能预测输出。\
    \ | 无监督学习的目标是从未知数据集中发现隐藏模式和有用的见解。 |\n| 监督学习需要监督来训练模型。 | 无监督学习不需要任何监督来训练模型。 |\n\
    | 监督学习可以分类为分类和回归问题。 | 无监督学习可以分类为聚类和关联问题。 |\n| 监督学习可以根据相似性将数据对象分组。 | 无监督学习可以根据相似性将对象分组。\
    \ |\n| 监督学习模型产生准确的结果。 | 无监督学习模型通过计算距离产生结果。 |\n| 监督学习模型预测正确的输出。 | 无监督学习模型可能产生不准确的结果。\
    \ |\n| 监督学习在处理新数据时预测正确的输出。 | 无监督学习模型在处理新数据时更接近真实情况。 |\n| 监督学习包括分类、回归、支持向量机等。 |\
    \ 无监督学习包括聚类、关联规则、逻辑回归、贝叶斯等。 |\n| | 无监督学习包括聚类、关联规则、逻辑回归、贝叶斯等。 |  算法等。 |\n\n## k-means\
    \ 聚类算法\n\n### k-means 聚类\n\nk-means 聚类是数据常用的算法之一。假设我们有 5 个人（例如身高和体重），我们要将其分成 k=2\
    \ 类。\n\n首先，我们选择两个中心 `c1=(120,32)` 和 `c2=(113,33)`。现在计算每个点到这两个质心的欧氏距离。如果你完成了计算，应该得到以下数字：\n\
    \n| | 到 `c1` 的距离 | 到 `c2` 的距离 |\n| --- | --- |\n| 人 1 | 52.3 | 58.3 |\n| 人 2 |\
    \ 0 | 7.1 |\n| 人 3 | 7.1 | 0 |\n| 人 4 | 70.4 | 75.4 |\n| 人 5 | 13.9 | 9.4 |\n\n\
    在此处，我们将每个对象分配给距离最近的簇（即取两个计算距离的最小值）。我们可以将点安排如下：\n\n*   人 1 -> 簇 1\n*   人 2 -> 簇\
    \ 1\n*   人 3 -> 簇 2\n*   人 4 -> 簇 1\n*   人 5 -> 簇 2\n\n让我们迭代，这意味着通过计算每个簇成员的平均值来重新定义质心。\n\
    \n所以 `c’1 = ((167+120+175)/3, (55+32+76)/3) = (154, 54.3)` 且 `c’2 = ((113+108)/2,\
    \ (33+25)/2) = (110.5, 29)`。然后我们再次计算距离并重新分配点。我们重复这个过程，直到质心不再移动（或它们之间的差异小于某个特定阈值）。\n\
    \n在我们的情况下，结果如图所示。你可以看到两个不同颜色的标记簇，以及用交叉标记的质心位置。\n\n![image](img/image040.png)\n\
    \n![image](img/image167.jpg)\n\n## 如何应用 k-means？\n\n正如你可能已经知道，我使用 Python 库来分析数据。k-means\
    \ 算法实现在 `scikit-learn` 包中。要使用它，你只需要在脚本中包含以下行：\n\n## 如果我们的数据是是非数值的呢？\n\n"
- fmt: "\nAt this point, you will maybe have noticed something. The basic concept\
    \ of `k-means` stands on mathematical calculations (means, euclidian distances).\
    \ But what if our data is non-numerical or, in other words, categorical? Imagine,\
    \ for instance, to have the ID code and date of birth of the five people of the\
    \ previous example, instead of their heights and weights.\n\nWe could think of\
    \ transforming our categorical values in numerical values and eventually apply\
    \ `k-means`. But beware: `k-means` uses numerical distances, so it could consider\
    \ close two really distant objects that merely have been assigned two close numbers.\n\
    \n`k-modes` is an extension of `k-means`. Instead of distances it uses dissimilarities\
    \ (that is, quantification of the total mismatches between two objects: the smaller\
    \ this number, the more similar the two objects). And instead of means, it uses\
    \ modes. A mode is a vector of elements that minimizes the dissimilarities between\
    \ the vector itself and each object of the data. We will have as many modes as\
    \ the number of clusters we required, since they act as centroids.\n\n![image](d2d_images/image040.png)\n\
    \n# Unit III: Ensemble and Probabilistic Learning\n\nEnsemble Learning: Model\
    \ Combination Schemes, Voting, Error-Correcting Output Codes, Bagging: Random\
    \ Forest Trees, Boosting: Adaboost, Stacking.\n\nProbabilistic Learning: Gaussian\
    \ mixture models - The Expectation-Maximization (EM) Algorithm, Information Criteria,\
    \ Nearest neighbour methods - Nearest Neighbour Smoothing, Efficient Distance\
    \ Computations: the KD-Tree, Distance Measures.\n\n## 3. Introduction: Ensemble\
    \ Learning\n\nEnsemble learning usually produces more accurate solutions than\
    \ a single model would.\n\n![image](d2d_images/image040.png)\n\nEnsemble Learning\
    \ is a technique that create multiple models and then combine them them to produce\
    \ improved results. Ensemble learning usually produces more accurate solutions\
    \ than a single model would.\n\n* Ensemble learning methods is applied to regression\
    \ as well as classification.\n* Ensemble learning for regression creates multiple\
    \ repressors i.e. multiple regression models such as linear, polynomial, etc.\n\
    * Ensemble learning for classification creates multiple classifiers i.e. multiple\
    \ classification models such as logistic, decision tress, KNN, SVM, etc.\n\n![image](d2d_images/image156.png)\n\
    \nFigure 1: Ensemble learning view\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Which\
    \ components to combine?\n\n![image](d2d_images/chapter_title_below.png) \n\n\
    * different learning algorithms\n* same learning algorithm trained in different\
    \ ways\n* same learning algorithm trained the same way\n\nThere are two steps\
    \ in ensemble learning:\n\nMultiples machine learning models were generated using\
    \ same or different machine learning algorithm. These are called “base models”.\
    \ The prediction perform on the basis of base models.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Techniques/Methods\
    \ in ensemble learning\n\n## Model Combination Schemes\n\nEnsemble learning usually\
    \ produces more accurate solutions than a single model would.\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nVoting, Error-Correcting Output Codes, Bagging: Random Forest Trees, Boosting:\
    \ Adaboost, Stacking.\n\n## General Idea - Combining Learners\n\nWe discussed\
    \ many learning algorithms in the previous chapters. Though these are successful,\
    \ no single algorithm is always the most. Now, we are going to discuss models\
    \ composed of multiple so that by combining them, we attain higher accuracy.\n\
    \n![image](d2d_images/image040.png)\n![image](d2d_images/image017.png)\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n## Figure2:\
    \ Combining Learners\n\nThere are two steps in ensemble learning:\n\nMultiples\
    \ machine learning models were generated using same or different machine learning\
    \ algorithm. These are called “base models”. The prediction perform on the basis\
    \ of base models.\n\n![image](d2d_images/image040.png)\n![image](d2d_images/image017.png)\n\
    \n## Multistage combination\n\nMultistage methods use a serial approach where\
    \ the next learner is trained on the outputs of the previous.\n\n* In the global\
    \ approach, also called fusion, given an input, all base-learners generate outputs.\n\
    * In the local approach, or learner selection, for example, mixture of experts,\
    \ there is a gating model, which chooses one or few\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n## Multistage\
    \ combination\n\nLet us say we have L base-learners. We denote by `dj(x)` the\
    \ prediction of base-learner `Mj` given arbitrary input `x`. In the case of multiple\
    \ outputs, for each learner there are K outputs, `dji(x)`, `i = 1, ..., K`, and\
    \ `j = 1, ..., L`, and, combining them, we also generate K values, `yi`, `i =\
    \ 1, ..., K`, and then for example in classification, we choose the class with\
    \ the maximum `yi` value:\n\n```\ny = f(d1, d2, ..., dL | Φ)\n```\n\nwhere `f(·)`\
    \ is the combining function with `Φ` denoting its parameters.\n\n![image](d2d_images/image040.png)\n\
    \n![image](d2d_images/image138.png)\n\nFigure 1: Base-learners are `dj` and their\
    \ outputs are combined using `f(·)`. This is for a single output; in the case\
    \ of classification, each base-learner has K outputs that are separately used\
    \ to calculate `yi`. Note that here all learners observe the input; it may be\
    \ the case that different learners observe different representations of the same\
    \ object or event.\n\n### Voting\n\nThe simplest way to combine multiple classifiers\
    \ is by voting, which corresponds to taking a linear combination of the learners,\
    \ Refer figure 1.\n\n![image](d2d_images/image071.png)\n\nThis is also known as\
    \ ensembles and linear opinion pools. In the simplest case, all learners are given\
    \ equal weight and we have simple voting that corresponds to taking an average.\
    \ Still, taking a (weighted) sum is only one of the possibilities and there are\
    \ also other combination rules, as shown in table 1. If the outputs are not posterior\
    \ probabilities, these rules require that outputs be normalized to the same scale\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n| --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n\
    # Table 1 - Classifier combination rules\n\n![image](d2d_images/image131.png)\n"
