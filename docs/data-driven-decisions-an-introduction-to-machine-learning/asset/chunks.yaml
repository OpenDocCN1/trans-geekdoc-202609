  trans: '


    在上一个主题中，我们学习了简单线性回归，其中使用单个独立变量/预测变量（`X`）来对响应变量（`Y`）建模。但在许多情况下，响应变量受到多个预测变量的影响；对于这类情况，则使用多元线性回归（Multiple
    Linear Regression）算法。


    此外，多元线性回归是简单线性回归的扩展，因为它使用多个预测变量来预测响应变量。


    我们可以将其为：


    “多元线性回归是重要的回归算法之一，它对单个连续因变量与多个独立变量之间的线性关系进行建模。”


    ### 示例

    根据汽车发动机尺寸和缸数预测 CO2 排放量。


    ### 关于 MLR 的关键点：

    - 对于 MLR，因变量或目标变量（`Y`）必须是连续的/实数的，但预测变量或独立变量可以是连续型或分类型。

    - 每个特征变量都必须与因变量建立线性关系模型。

    - MLR 试图在数据点的多维空间中拟合一条回归线。


    ### MLR 方程：

    在多元线性回归中，目标变量（`Y`）是多个预测变量 `x1`、`x2`、`x3`, ..., `xn` 的线性组合。由于它是简单线性回归的增强，因此多元线性回归方程采用相同的原理，方程变为：


    `Y= b<sub>0</sub>+b<sub>1</sub>x<sub>1</sub>+ b<sub>2</sub>x<sub>2</sub>+ b<sub>3</sub>x+......
    bnxn (a)`


    其中：

    - `Y`= 输出/响应变量

    - `b0`, `b1`, `b2`, `b3`, `bn`= 模型的系数。

    - `x1`, `x2`, `x3`, `x4`= 各种独立/特征变量


    ### 多元线性回归的假设：

    - 目标变量与预测变量之间应该存在线性关系。

    - 回归残差必须符合正态分布。

    - MLR 假设数据中存在极少或没有共线性（独立变量之间的相关性）。


    # 神经网络 (ANN - 人工神经网络)


    ## 引言

    “人工神经网络”一词源于形成人类大脑结构的生物神经网络。类似于人类脑中神经元相互连接的方式，人工神经网络在网络的不同层中也有相互连接的神经元。这些神经元被称为节点。


    ![image](img/image199.png)


    ![image](img/image169.jpg)


    ![image](img/image013.png) 给图展示了生物神经网络的典型结构。典型的人工神经网络类似于所示。


    生物神经网络中的树突代表人工神经网络中的输入，细胞核代表节点，突触代表权重，轴突代表输出。


    ### 生物神经网络与人工神经网络之间的关系：


    | 生物神经网络 | 人工神经网络 |

    | --- | --- |

    | 树突 | 输入 |

    | 细胞核 | 节点 |

    | 突触 | 权重 |

    | 轴突 | 输出 |


    人工智能领域的人工神经网络试图模仿构成人类大脑的神经元网络，以便计算机能够以类人类的方式理解事物并做出决策。人工神经网络通过编程计算机，使其行为类似于相互连接的脑细胞。


    人类大脑中约有 1000 亿个神经元。每个神经元在 1,000 到 100,000 的范围内范围内有一个连接点。在大脑中，数据以分布式方式存储，我们在需要时可以并行地从内存中提取出多部分此类数据。我们可以说，人类大脑是由不可惊叹的并行处理器组成的。


    ![image](img/image199.png)


    ![image](img/scene_break.png)


    我们可以通过一个例子来理解人工神经网络，考虑一个接收输入并给出输出的数字逻辑门。“或（OR）”门有两个输入。如果其中一个或两个输入为“开启”（On），则输出就是“开启”。如果两个输入都是“关闭”（Off），则输出就是“关闭”。在这里，输出取决于输入。我们的大脑并不执行相同的任务。由于大脑中神经元正在“学习”，输入与输出的关系在不断变化。


    ## 人工神经网络的架构：


    ![image](img/image093.png)


    ![image](img/scene_break.png)


    ### 输入层：

    如其名，它接受程序员提供的几种不同格式的输入。


    ### 隐藏层：

    隐藏层位于输入层和输出层之间。它执行所有计算以寻找隐藏的特征和模式。


    ### 输出层：

    输入通过隐藏层经过一系列变换，最终导致通过该层传递的输出。


    人工神经网络接收输入并计算输入的加权和，并包含偏置（bias）。这种计算以传递函数的形式表示。


    ![image](img/image155.png)


    ![image](img/scene_break.png)


    它确定加权总和作为输入传递给激活函数以产生输出。激活函数选择节点是否应该触发。只有被触发的节点才能到达输出层。


    ### 人工神经网络 (ANN) 的优点

    - **并行处理能力**：人工神经网络可以同时处理多项任务。

    - **全网数据存储**：数据存储在整个网络中，而不是数据库中。网络中某处数据的丢失不会影响其工作。

    - **处理不完整知识的能力**：即使在数据不全的情况下，ANN 也能产生输出。image 的性能取决于缺失数据的重要性。

    - **具有记忆分布**：为了让 ANN 能够适应，确定示例并根据预期输出来引导网络至关重要。

    - **容错性**：ANN 的一个或多个细胞故障不会阻止生成输出，这种特性使得网络具有容错性。


    ### 人工神经网络的缺点

    - **网络结构的保证**：确定人工神经网络结构没有特定的指南。正确的网络结构通过经验和试错来实现。

    - **行为不可解释**：这是 ANN 最主要的问题。当 ANN 提供测试解决方案时，它并不提供关于为什么和如何做的见解。这降低了对网络的信任。

    - **硬件依赖性**：根据结构，人工神经网络需要具有并行处理能力的处理器。因此，实现取决于设备。

    - **运行时间未知**。


