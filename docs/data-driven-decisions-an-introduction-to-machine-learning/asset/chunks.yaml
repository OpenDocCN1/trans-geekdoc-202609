    \ determines how strongly the selection favors actions with high \U0001D444̂ values\n\
    \n## Evaluating Hypotheses\n\nMotivation\n\nIt is important to evaluate the performance\
    \ of learned hypotheses as precisely as possible.\n\n  One reason is simply to\
    \ understand whether to use the hypothesis.\n\n  A second reason is that evaluating\
    \ hypotheses  is an integral component of many learning methods.\n\nTwo key difficulties\
    \ arise while learning a hypothesis and estimating its future accuracy given only\
    \ a limited set of data:\n\n1.  Bias in the estimate. The observed accuracy of\
    \ the learned hypothesis over the training examples is often a poor estimator\
    \ of its accuracy over future examples. Because the learned hypothesis was derived\
    \ from these examples, they will typically provide an optimistically biased estimate\
    \ of hypothesis accuracy over future examples. This is especially likely when\
    \ the learner considers a very rich hypothesis space, enabling it to overfit the\
    \ training examples. To obtain an unbiased estimate of future accuracy, test the\
