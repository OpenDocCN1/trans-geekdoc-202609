    # The Q learning algorithm does not specify how actions are chosen by the agent.


    ![image](d2d_images/chapter_title_below.png)


    - One obvious strategy would be for the agent in state `s` to select the action
    `a` that maximizes `Q̂(s, a)`, thereby exploiting its current approximation `Q̂`.

    - However, with this strategy the agent runs the risk that it will overcommit
    to actions that are found during early training to have high Q values, while failing
    to explore other actions that have even higher values.

    - For this reason, Q learning uses a probabilistic approach to selecting actions.
    Actions with higher `Q̂` values are assigned higher probabilities, but every action
    is assigned a nonzero probability.

    - ![image](d2d_images/image141.jpg)


    One way to assign such probabilities is:


    - Where, `P(ai |s)` is the probability of selecting action `ai`, given that the
    agent is in state `s`, and `k > 0` is a constant that determines how strongly
    the selection favors actions with high `Q̂` values.


    ## Evaluating Hypotheses


    ### Motivation


    It is important to evaluate the performance of learned hypotheses as precisely
    as possible.


    - One reason is simply to understand whether to use the hypothesis.

    - A second reason is that evaluating hypotheses is an integral component of many
    learning methods.


    Two key difficulties arise while learning a hypothesis and estimating its future
    accuracy given only a limited set of data:


    1. **Bias in the estimate.** The observed accuracy of the learned hypothesis over
    the training examples is often a poor estimator of its accuracy over future examples.
    Because the learned hypothesis was derived from these examples, they will typically
    provide an optimistically biased estimate of hypothesis accuracy over future examples.
    This is especially likely when the learner considers a very rich hypothesis space,
    enabling it to overfit the training examples. To obtain an unbiased estimate of
    future accuracy, test the hypothesis on some set of test examples chosen independently
    of the training examples and the hypothesis.


    ![image](d2d_images/image040.png)


    2. **Variance in the estimate.** Even if the hypothesis accuracy is measured over
    an unbiased set of test examples independent of the training examples, the measured
    accuracy can still vary from the true accuracy, depending on the makeup of the
    particular set of test examples. The smaller the set of test examples, the greater
    the expected variance.


    ## Estimating Hypothesis Accuracy Sample Error –


    The sample error of a hypothesis with respect to some sample `S` of instances
    drawn from `X` is the fraction of `S` that it misclassifies.


    **Definition:** The sample error (`errors(h)`) of hypothesis `h` with respect
    to target function `f` and data sample `S` is:


    ![image](d2d_images/image104.jpg)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Where `n` is the number of examples in `S`, and the quantity `δ(f(x), h(x))` is
    1 if `f(x) ≠ h(x)`, and 0 otherwise.


    ## True Error –


    The true error of a hypothesis is the probability that it will misclassify a single
    randomly drawn instance from the distribution `D`.


    **Definition:** The true error (`errorD (h)`) of hypothesis `h` with respect to
    target function `f` and data sample `D`, is the probability that `h` will misclassify
    an instance drawn at random according to `D`.


    ![image](d2d_images/image137.jpg)


    ## Confidence Intervals for Discrete-Valued Hypotheses


    Suppose we wish to estimate the true error for some hypothesis, based on its sample
    error. Under these conditions, statistical theory allows to make the following
    assertions:


    1. Given no other information, the most probable value of `errorD (h)` is `errors(h)`.

    2. With approximately 95% probability, the true error `errorD (h)` lies in the
    interval:


    ![image](d2d_images/image040.png)


    ![image](d2d_images/image035.png)


