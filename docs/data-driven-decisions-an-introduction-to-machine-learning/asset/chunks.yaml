    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\n# Techniques/Methods\
    \ in ensemble learning\n\n![image](d2d_images/chapter_title_below.png) \n\nVoting,\
    \ Error-Correcting Output Codes, Bagging: Random Forest Trees, Boosting: Adaboost,\
    \ Stacking.\n\n## Model Combination Schemes - Combining Multiple Learners\n\n\
    We discussed many different learning algorithms in the previous chapters. Though\
    \ these are generally successful, no one single algorithm is always the most accurate.\
    \ Now, we are going to discuss models composed of multiple learners that complement\
    \ each other so that by combining them, we attain higher accuracy.\n\nThere are\
    \ also different ways the multiple base-learners are combined to generate the\
    \ final\n\noutput:\n\n## Figure2: General Idea - Combining Multiple Learners\n\
    \n![image](d2d_images/image040.png)\n\n![image](d2d_images/image017.png)\n\n|\
    \ ![image](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n\n| --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\
    \n# Multiexpert combination\n\n![image](d2d_images/chapter_title_below.png) \n\
    \nMultiexpert combination methods have base-learners that work in parallel. These\
    \ methods can in turn be divided into two:\n\n*   In the global approach, also\
    \ called learner fusion, given an input, all base-learners generate an output\
    \ and all these outputs are used.\n\nExamples are voting and stacking.\n\n*  \
    \ In the local approach, or learner selection, for example, in mixture of experts,\
    \ there is a gating model, which looks at the input and chooses one (or very few)\
    \ of the learners as responsible for generating the output.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\n# Multistage\
    \ combination\n\n![image](d2d_images/chapter_title_below.png) \n\nMultistage combination\
    \ methods use a serial approach where the next base-learner is trained with or\
    \ tested on only the instances where the previous base-learners are not accurate\
    \ enough. The idea is that the base-learners (or the different representations\
    \ they use) are sorted in increasing complexity so that a complex base-learner\
    \ is not used (or its complex representation is not extracted) unless the preceding\
    \ simpler base-learners are not confident.\n\nAn example is cascading.\n\nLet\
    \ us say that we have L base-learners. We denote by dj(x) the prediction of base-learner\
    \ Mj given the arbitrary dimensional input x. In the case of multiple representations,\
    \ each Mj uses a different input representation xj . The final prediction is calculated\
    \ from the predictions of\n\nthe base-learners:\n\ny \\= f (d1, d2, . . . , dL\
    \ |Φ)\n\nwhere f (·) is the combining function with Φ denoting its parameters.\n\
    \n![image](d2d_images/image040.png)\n\n![image](d2d_images/image138.png)\n\nFigure\
    \ 1: Base-learners are dj and their outputs are combined using f (·). This is\
    \ for a single output; in the case of classification, each base-learner has K\
    \ outputs that are separately used to calculate yi, and then we choose the maximum.\
    \ Note that here all learners observe the same input; it may be the case that\
    \ different learners observe different representations of the same input object\
    \ or event.\n\nWhen there are K outputs, for each learner there are dji(x), i\
    \ \\= 1, . . . , K,\n\nj \\= 1, . . . , L, and, combining them, we also generate\
    \ K values, yi, i \\= 1, . . . , K and then for example in classification, we\
    \ choose the class with\n\n![image](d2d_images/image074.jpg)\n\nthe maximum yi\
    \ value:\n\n## Voting\n\nThe simplest way to combine multiple classifiers is by\
    \ voting, which corresponds to taking a linear combination of the learn\n\ners,\
    \ Refer figure 1.\n\n![image](d2d_images/image071.png)\n\nThis is also known as\
    \ ensembles and linear opinion pools. In the sim plest case, all learners are\
    \ given equal weight and we have simple voting that corresponds to taking an average.\
    \ Still, taking a (weighted) sum is only one of the possibilities and there are\
    \ also other combination rules, as shown in table 1. If the outputs are not posterior\
    \ probabilities, these rules require that outputs be normalized to the same scale\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n\n| --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\
    \n# ![image](d2d_images/image131.png)  \n\nTable 1 - Classifier combination rules\n\
    \n![image](d2d_images/chapter_title_below.png) \n\n![image](d2d_images/image040.png)"
