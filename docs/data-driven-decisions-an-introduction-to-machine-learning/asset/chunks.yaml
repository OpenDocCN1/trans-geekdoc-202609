    \n![image](d2d_images/image098.jpg)\n\n## The Binomial Distribution\n\nConsider\
    \ the following problem for better understanding of Binomial Distribution\n\n\
      Given a worn and bent coin and estimate the probability that the coin will\
    \ turn up heads when tossed.\n\n  Unknown probability of heads p. Toss the coin\
    \ n times and record the number of times r that it turns up heads.\n\nEstimate\
    \ of p = r / n\n\n  If the experiment were rerun, generating a new set of n coin\
    \ tosses, we might expect the number of heads r to vary somewhat from the value\
    \ measured in the first experiment, yielding a somewhat different estimate for\
    \ p.\n\n  The Binomial distribution describes for each possible value of r (i.e.,\
    \ from 0 to n), the probability of observing exactly r heads given a sample of\
    \ n independent tosses of a coin whose true probability of heads is p.\n\nThe\
    \ general setting to which the Binomial distribution applies is:\n\n1.  There\
    \ is a base experiment (e.g., toss of the coin) whose outcome can be described\
    \ by a random variable ‘Y’. The random variable Y can take on two possible values\
    \ (e.g., Y = 1 if heads, Y = 0 if tails).\n\n2.  The probability that Y = 1 on\
    \ any single trial of the base experiment is given by some constant p, independent\
    \ of the outcome of any other experiment. The probability that Y = 0 is therefore\
    \ (1 - p). Typically, p is not known in advance, and the problem is to estimate\
    \ it.\n\n3.  ![image](d2d_images/image170.jpg)  \n\n    A series of n independent\
