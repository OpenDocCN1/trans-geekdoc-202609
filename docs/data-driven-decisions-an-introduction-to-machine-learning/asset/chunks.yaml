    ![image](d2d_images/image029.png)![image](d2d_images/image029.png)![image](d2d_images/image029.png)they
    sum up to 1. This has the effect that the probability of a correctly classified
    instance is decreased, and the probability of a misclassified instance increases.
    Then a new sample of the same size is drawn from the original sample according
    to these modified probabilities, `p^t` with replacement, and is used to train
    `dj+1`.


    This has the effect that `dj+1` focuses more on instances misclassified by `dj`
    ; that is why the base-learners are chosen to be simple and not accurate, since
    otherwise the next training sample would contain only a few outlier and noisy
    instances repeated many times over. For example, with decision trees, decision
    stumps, which are trees grown only one or two levels, are used. So it is clear
    that these would have bias but the decrease in variance is larger and the overall
    error decreases. An algorithm like the linear discriminant has low variance, and
    we cannot gain by AdaBoosting linear discriminants.


    # Stacking - Stacked Generalization


    Stacked generalization is a technique proposed by Wolpert (1992) that extends
    voting in that the way the output of the base-learners is combined need not be
    linear but is learned through a combiner system, `f (·|Φ)`, which is another learner,
    whose parameters `Φ` are also trained. (see the below given figure)


    ![image](d2d_images/image115.png)


    Figure: In stacked generalization, the combiner is another learner and is not
    restricted to being a linear combination as in voting.


    `y \= f (d1, d2, . . . , dL |Φ)`


    The combiner learns what the correct output is when the base-learners give a certain
    output combination. We cannot train the combiner function on the training data
    because the base-learners may be memorizing the training set; the combiner system
    should actually learn how the baselearners make errors. Stacking is a means of
    estimating and correcting for the biases of the base-learners. Therefore, the
    combiner should be trained on data unused in training the base-learners.


    If `f (·|w1, . . . , wL)` is a linear model with constraints, `wi ≥ 0`, `∑ 𝑗Wj
    \= 1`, the optimal weights can be found by constrained regression, but of course
    we do not need to enforce this; in stacking, there is no restriction on the combiner
    function and unlike voting, `f (·)` can be nonlinear. For example, it may be implemented
    as a multilayer perceptron with `Φ` its connection weights.


    The outputs of the base-learners `dj` define a new `L`-dimensional space in which
    the output discriminant/regression function is learned by the combiner function.


    In stacked generalization, we would like the base-learners to be as different
    as possible so that they will complement each other, and, for this, it is best
    if they are based on different learning algorithms. If we are combining classifiers
    that can generate continuous outputs, for example, posterior probabilities, it
    is better that they be the combined rather than hard decisions.


    When we compare a trained combiner as we have in stacking, with a fixed rule such
    as in voting, we see that both have their advantages: A trained rule is more flexible
    and may have less bias, but adds extra parameters, risks introducing variance,
    and needs extra time and data for training. Note also that there is no need to
    normalize classifier outputs before stacking.


    # Probabilistic Learning


    In machine learning, a probabilistic classifier is able to predict the most likely
    class the observation should belong to. Probabilistic classifiers provide one
    criticism that is often made of neural networks—especially the MLP—is that it
    is not clear exactly what it is doing.


    ![image](d2d_images/image040.png)


    In this topic we look at methods that are based on statistics and are therefore
    more transparent, in that we can always extract the probabilities and see what
    they are.


    ––––––––


    ![image](d2d_images/scene_break.png) GAUSSIAN MIXTURE MODELS


    However, suppose that we have the same data, but without labels. This requires
    unsupervised learning, Suppose the different classes each come from their own
    Gaussian. This is known as multi-modal data, since there is one distribution (mode)
    for each class. We can’t fit one Gaussian to the data, because it doesn’t look
    Gaussian.


    There is, however, something we can do. If we know how many classes there are
    in the data, then we can try to estimate the parameters for that many Gaussians,
    all at once. If we don’t know, then we can try different numbers and see which
    one works. We will talk about this issue more for a different method (the k-means
    algorithm) in Unit 2. It is perfectly possible to use any other distribution instead
    of a Gaussian, but Gaussians are by far the most common choice. Then the output
    for any particular datapoint that is input to the algorithm will be the sum of
    the values expected by all of the M Gaussians:


    ![image](d2d_images/image186.png)


    where `_(x ; μm, ∑ 𝑚)` is a Gaussian function with mean `μm` and covariance matrix
