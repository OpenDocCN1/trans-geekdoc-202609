    # Example: Suppose there is a marketing company A, who does various advertisement
    every year and get sales on that. The below list shows the advertisement made
    by the company in the last 5 years and the corresponding sales:


    ![image](d2d_images/image199.png)

    ![image](d2d_images/image197.jpg)


    Now, the company wants to do the advertisement of $200 in the year 2019 and wants
    to know the prediction about the sales for this year. So to solve such type of
    prediction problems in machine learning, we need regression analysis.


    Regression is a supervised learning technique which helps in finding the correlation
    between variables and enables us to predict the continuous output variable based
    on the one or more predictor variables. It is mainly used for prediction, forecasting,
    time series modeling, and determining the causal-effect relationship between variables.


    In Regression, we plot a graph between the variables which best fits the given
    datapoints, using this plot, the machine learning model can make predictions about
    the data. In simple words, "Regression shows a line or curve that passes through
    all the datapoints on target-predictor graph in such a way that the vertical distance
    between the datapoints and the regression line is minimum." The distance between
    datapoints and line tells whether a model has captured a strong relationship or
    not.


    Some examples of regression can be as:

    - Prediction of rain using temperature and other factors

    - Determining Market trends

    - Prediction of road accidents due to rash driving.


    ## Terminologies Related to the Regression Analysis:


    - **Dependent Variable**: The main factor in Regression analysis which we want
    to predict or understand is called the dependent variable. It is also called target
    variable.

    - **Independent Variable**: The factors which affect the dependent variables or
    which are used to predict the values of the dependent variables are called independent
    variable, also called as a predictor.

    - **Outliers**: Outlier is an observation which contains either very low value
    or very high value in comparison to other observed values. An outlier may hamper
    the result, so it should be avoided.

    - **Multicollinearity**: If the independent variables are highly correlated with
    each other than other variables, then such condition is called Multicollinearity.
    It should not be present in the dataset, because it creates problem while ranking
    the most affecting variable.

    - **Underfitting and Overfitting**: If our algorithm works well with the training
    dataset but not well with test dataset, then such problem is called Overfitting.
    And if our algorithm does not perform well even with training dataset, then such
    problem is called underfitting.


    ![image](d2d_images/image199.png)


    ## Why do we use Regression Analysis?


    As mentioned above, Regression analysis helps in the prediction of a continuous
    variable. There are various scenarios in the real world where we need some future
    predictions such as weather condition, sales prediction, marketing trends, etc.,
    for such case we need some technology which can make predictions more accurately.
    So for such case we need Regression analysis which is a statistical method and
    used in machine learning and data science. Below are some other reasons for using
    Regression analysis:

    - Regression estimates the relationship between the target and the independent
    variable.

    - It is used to find the trends in data.

    - It helps to predict real/continuous values.

    - By performing the regression, we can confidently determine the most important
    factor, the least important factor, and how each factor is affecting the other
    factors.


    ## Types of Regression


    There are various types of regressions which are used in data science and machine
    learning. Each type has its own importance on different scenarios, but at the
    core, all the regression methods analyze the effect of the independent variable
    on dependent variables. Here we are discussing some important types of regression
    which are given below:


    ### Linear Regression

    - Logistic Regression

    ### Polynomial Regression

    - Support Vector Regression

    ### Decision Tree Regression

    - Random Forest Regression

    ### Ridge Regression

    - Lasso Regression


    ![image](d2d_images/image086.jpg)


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## Linear Regression:


    - Linear regression is a statistical regression method which is used for predictive
    analysis.

    - It is one of the very simple and easy algorithms which works on regression and
    shows the relationship between the continuous variables.

    - It is used for solving the regression problem in machine learning.

    - Linear regression shows the linear relationship between the independent variable
    (`X-axis`) and the dependent variable (`Y-axis`), hence called linear regression.


    ![image](d2d_images/image199.png)


    - If there is only one input variable (`x`), then such linear regression is called
    simple linear regression. And if there is more than one input variable, then such
    linear regression is called multiple linear regression.

    - The relationship between variables in the linear regression model can be explained
    using the below image. Here we are predicting the salary of an employee on the
    basis of the year of experience.


    ![image](d2d_images/image015.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Below is the mathematical equation for Linear regression:


    ```

    Y= aX+b

    ```


    Here, `Y` = dependent variables (target variables), `X`= Independent variables
    (predictor variables), `a` and `b` are the linear coefficients.


    Some popular applications of linear regression are:

    - Analyzing trends and sales estimates

    - Salary forecasting

    - Real estate prediction

    - Arriving at ETAs in traffic.


    ## Logistic Regression:


    - Logistic regression is another supervised learning algorithm which is used to
    solve the classification problems. In classification problems, we have dependent
    variables in a binary or discrete format such as `0` or `1`.

    - Logistic regression algorithm works with the categorical variable such as `0`
    or `1`, `Yes` or `No`, `True` or `False`, `Spam` or not spam, etc.

    - It is a predictive analysis algorithm which works on the concept of probability.

    - Logistic regression is a type of regression, but it is different from the linear
    regression algorithm in the term how they are used.


    ![image](d2d_images/image004.png)

    ![image](d2d_images/image143.png)


    Logistic regression uses sigmoid function or logistic function which is a complex
    cost function. This sigmoid function is used to model the data in logistic regression.
    The function can be represented as:

    - `f(x)`= Output between the 0 and 1 value.

    - `x`= input to the function

    - `e`= base of natural logarithm.


    When we provide the input values (data) to the function, it gives the S-curve
    as follows:


    ![image](d2d_images/image034.png)


    - It uses the concept of threshold levels, values above the threshold level are
    rounded up to `1`, and values below the threshold level are rounded up to `0`.


    There are three types of logistic regression:

    - Binary(`0/1`, `pass/fail`)

    - Multi(`cats`, `dogs`, `lions`)

    - Ordinal(`low`, `medium`, `high`)


    ## Linear Regression in Machine Learning


    Linear regression is one of the easiest and most popular Machine Learning algorithms.
    It is a statistical method that is used for predictive analysis. Linear regression
    makes predictions for continuous/real or numeric variables such as sales, salary,
    age, product price, etc.


    Linear regression algorithm shows a linear relationship between a dependent (`y`)
    and one or more independent (`y`) variables, hence called as linear regression.
    Since linear regression shows the linear relationship, which means it finds how
    the value of the dependent variable is changing according to the value of the
    independent variable.


    The linear regression model provides a sloped straight line representing the relationship
    between the variables. Consider the below image:


    ![image](d2d_images/image199.png)

    ![image](d2d_images/image135.png)

