    The term generalization describes the process of turning the knowledge about stored
    data into a form that can be utilized for future action. These actions are to
    be carried out on tasks that are similar, but not identical, to those what have
    been seen before. In generalization, the goal is to discover those properties
    of the data that will be most relevant to future tasks.


    # 4. Evaluation


    Evaluation is the last component of the learning process. It is the process of
    giving feedback to the user to measure the utility of the learned knowledge. This
    feedback is then utilised to effect improvements in the whole learning process.


    # Applications of machine learning


    Application of machine learning methods to large databases is called data mining.
    In data mining, a large volume of data is processed to construct a simple model
    with valuable use, for example, having high predictive accuracy.


    The following is a list of some of the typical applications of machine learning:


    1. In retail business, machine learning is used to study consumer behaviour.

    2. In finance, banks analyze their past data to build models to use in credit
    applications, fraud detection, and the stock market.

    3. In manufacturing, learning models are used for optimization, control, and troubleshooting.

    4. In medicine, learning programs are used for medical diagnosis.

    5. In telecommunications, call patterns are analyzed for network optimization
    and maximizing the quality of service.

    6. In science, large amounts of data in physics, astronomy, and biology can only
    be analyzed fast enough by computers. The World Wide Web is huge; it is constantly
    growing and searching for relevant information cannot be done manually.

    7. In artificial intelligence, it is used to teach a system to learn and adapt
    to changes so that the system designer need not foresee and provide solutions
    for all possible situations.

    8. It is used to find solutions to many problems in vision, speech recognition,
    and robotics.

    9. Machine learning methods are applied in the design of computer-controlled vehicles
    to steer correctly when driving on a variety of roads.

    10. Machine learning methods have been used to develop programmes for playing
    games such as chess, backgammon and Go.


    # Learning Models


    Machine learning is concerned with using the right features to build the right
    models that achieve the right tasks. The basic idea of Learning models has divided
    into three categories.


    For a given problem, the collection of all possible outcomes represents the sample
    space or instance space.


    * Using a Logical expression. (`Logical models`)

    * Using the Geometry of the instance space. (`Geometric models`)

    * Using Probability to classify the instance space. (`Probabilistic models`)

    * Grouping and Grading


    ## Logical models


    Logical models use a logical expression to divide the instance space into segments
    and hence construct grouping models. A logical expression is an expression that
    returns a `Boolean` value, i.e., a `True` or `False` outcome. Once the data is
    grouped using a logical expression, the data is divided into homogeneous groupings
    for the problem we are trying to solve. For example, for a classification problem,
    all the instances in the group belong to one class.


    There are mainly two kinds of logical models: Tree models and Rule models.


    Rule models consist of a collection of implications or `IF-THEN` rules. For tree-based
    models, the `if-part` defines a segment and the `then-part` defines the behaviour
    of the model for this segment. Rule models follow the same reasoning.


    # Logical models and Concept learning


    To understand logical models further, we need to understand the idea of Concept
    Learning. Concept Learning involves learning logical expressions or concepts from
    examples. The idea of Concept Learning fits in well with the idea of Machine learning,
    i.e., inferring a general function from specific training examples. Concept learning
    forms the basis of both tree-based and rule-based models. More formally, Concept
    Learning involves acquiring the definition of a general category from a given
    set of positive and negative training examples of the category. A Formal Definition
    for Concept Learning is “The inferring of a `Boolean`-valued function from training
    examples of its input and output.” In concept learning, we only learn a description
    for the positive class and label everything that doesn’t satisfy that description
    as negative.


    The following example explains this idea in more detail.


    ## Geometric models


    In the previous section, we have seen that with logical models, such as decision
    trees, a logical expression is used to partition the instance space. Two instances
    are similar when they end up in the same logical segment. In this section, we
    consider models that define similarity by considering the geometry of the instance
    space. In Geometric models, features could be described as points in two dimensions
    (`x` and `y`-axis) or a three-dimensional space (`x`, `y`, and `z`). Even when
    features are not intrinsically geometric, they could be modelled in a geometric
    manner (for example, temperature as a function of time can be modelled in two
    axes).


    In geometric models, there are two ways we could impose similarity:


    * We could use geometric concepts like lines or planes to segment (classify) the
    instance space. These are called `Linear models`.

    * Alternatively, we can use the geometric notion of distance to represent similarity.
    In this case, if two points are close together, they have similar values for features
    and thus can be classed as similar. We call such models as `Distance-based models`.

