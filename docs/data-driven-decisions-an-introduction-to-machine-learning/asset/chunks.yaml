    # 1. Classification trees (Yes/No types)


    What we have seen above is an example of classification tree, where the outcome
    was a variable like `fit` or `unfit`. Here the decision variable is `Categorical`.


    # 2. Regression trees (Continuous data types)


    Here the decision or the outcome variable is `Continuous`, e.g. a number like
    `123`. Working Now that we know what a `Decision Tree` is, we’ll see how it works
    internally. There are many algorithms out there which construct `Decision Trees`,
    but one of the best is called as `ID3 Algorithm`. `ID3` Stands for `Iterative
    Dichotomiser 3`. Before discussing the `ID3` algorithm, we’ll go through few definitions.


    ### Entropy


    `Entropy`, also called as `Shannon Entropy` is denoted by `H(S)` for a finite
    set `S`, is the measure of the amount of uncertainty or randomness in data.


    ![image](d2d_images/image122.jpg)


    Intuitively, it tells us about the predictability of a certain event. Example,
    consider a coin toss whose probability of heads is `0.5` and probability of tails
    is `0.5`. Here the entropy is the highest possible, since there’s no way of determining
    what the outcome might be. Alternatively, consider a coin which has heads on both
    the sides, the entropy of such an event can be predicted perfectly since we know
    beforehand that it’ll always be heads. In other words, this event has no randomness
    hence it’s entropy is zero. In particular, lower values imply less uncertainty
    while higher values imply high uncertainty.


    ### Information Gain


    Information gain is also called as `Kullback-Leibler divergence` denoted by `IG(S,A)`
    for a set `S` is the effective change in entropy after deciding on a particular
    attribute `A`. It measures the relative change in entropy with respect to independent
    variables.


    `IG(S, A) = H(S) - H(A)`


    ![image](d2d_images/image199.png)


    Alternatively,


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image178.png)


    `IG(S, A) = H(S) - ∑ P(x) * H(x)` = 0


    where `IG(S, A)` is the information gain by applying feature `A`. `H(S)` is the
    Entropy of the entire set, while the second term calculates the Entropy after
    applying feature `A`, where `P(x)` is the probability of event `x`.


    Let’s understand this with the help of example Consider a piece of data collected
    over the course of 14 days where the features are `Outlook`, `Humidity`, `Wind`
    and the outcome variable is whether `Golf` was played. Now our job is to build
    a predictive model which takes above parameters and predicts whether `Golf` will
    be played on the day. We’ll build a decision tree to do that using `ID3`.


    | Day | Outlook | Temperature | Wind | Play Golf |

    | :--- | :--- | :--- | :--- | :--- |

    | D1 | Sunny | Hot | Weak | No |

    | D2 | Sunny | Hot | Strong | No |

    | D3 | Overcast | Hot | Weak | Yes |

    | D4 | Rain | Mild | Weak | Yes |

    | D5 | Rain | Cool | Normal | Yes |

    | D6 | Rain | Cool | Strong | No |

    | D7 | Overcast | Cool | Strong | Yes |

    | D8 | Sunny | Mild | Weak | No |

    | D9 | Sunny | Cool | Normal | Yes |

    | D10 | Rain | Mild | Normal | Yes |

    | D11 | Sunny | Mild | Strong | Yes |

    | D12 | Overcast | Mild | Strong | Yes |

    | D13 | Overcast | Hot | Normal | Yes |

    | D14 | Rain | Mild | Strong | No |


    ### ID3


    `ID3 Algorithm` will perform following tasks recursively:

    1. Create root node for the tree.

    2. If all examples are positive, return leaf node `positive`.

    3. Else if all examples are negative, return leaf node `negative`.

    4. Calculate the entropy of current state `H(S)`.

    5. For each attribute, calculate the entropy with respect to the attribute `x`
    denoted by `H(S, x)`.

    6. Select the attribute which has maximum value of `IG(S, x)`.

    7. Remove the attribute that offers highest `IG` from the set of attributes.

    8. Repeat until we run out of all attributes, or the decision tree has all leaf
    nodes.


    Now we’ll go ahead and grow the decision tree. The initial step is to calculate
    `H(S)`, the Entropy of the current state. In the above example, we can see in
    total there are 5 `No`s and 9 `Yes`s.


    | Yes | No | Total |

    | :--- | :--- | :--- |

    | 9 | 5 | 14 |


