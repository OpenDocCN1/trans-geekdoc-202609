    These are examples of simple binary classifications where the categorical dependent
    variable can assume only one of two, mutually exclusive values. In other cases,
    you might have to predict among a number of different variables. For instance,
    you may have to predict which type of smartphone a consumer may decide to purchase.


    In such cases, there are multiple values for the categorical dependent variable.
    Here’s what a classic classification tree looks like


    ![image](d2d_images/image199.png)


    ![image](d2d_images/image058.png)


    ## Regression Trees


    A regression tree refers to an algorithm where the target variable is and the
    algorithm is used to predict it’s value. As an example of a regression type problem,
    you may want to predict the selling prices of a residential house, which is a
    continuous dependent variable.


    This will depend on both continuous factors like square footage as well as categorical
    factors like the style of home, area in which the property is located and so on.


    ![image](d2d_images/image042.jpg)


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## When to use Classification and Regression Trees


    Classification trees are used when the dataset needs to be split into classes
    which belong to the response variable. In many cases, the classes `Yes` or `No`.


    In other words, they are just two and mutually exclusive. In some cases, there
    may be more than two classes in which case a variant of the classification tree
    algorithm is used.


    Regression trees, on the other hand, are used when the response variable is continuous.
    For instance, if the response variable is something like the price of a property
    or the temperature of the day, a regression tree is used.


    In other words, regression trees are used for prediction-type problems while classification
    trees are used for classification-type problems.


    ## How Classification and Regression Trees Work


    A classification tree splits the dataset based on the homogeneity of data. Say,
    for instance, there are two variables; `income` and `age`; which determine whether
    or not a consumer will buy a particular kind of phone.


    If the training data shows that 95% of people who are older than 30 bought the
    phone, the data gets split there and `age` becomes a top node in the tree. This
    split makes the data “95% pure”. Measures of impurity like `entropy` or `Gini
    index` are used to quantify the homogeneity of the data when it comes to classification
    trees.


    ![image](d2d_images/image199.png)


    In a regression tree, a regression model is fit to the target variable using each
    of the independent variables. After this, the data is split at several points
    for each independent variable.


    At each such point, the error between the predicted values and actual values is
    squared to get “A Sum of Squared Errors” (`SSE`). The `SSE` is compared across
    the variables and the variable or point which has the lowest `SSE` is chosen as
    the split point. This process is continued recursively.


    ![image](d2d_images/image031.png)


    ## Advantages of Classification and Regression Trees


    The purpose of the analysis conducted by any classification or regression tree
    is to create a set of if-else conditions that allow for the accurate prediction
    or classification of a case.


    ### (i) The Results are Simplistic


    The interpretation of results summarized in classification or regression trees
    is usually fairly simple. The simplicity of results helps in the following ways:


    - It allows for the rapid classification of new observations. That’s because it
    is much simpler to evaluate just one or two logical conditions than to compute
    scores using complex nonlinear equations for each group.

    - It can often result in a simpler model which explains why the observations are
    either classified or predicted in a certain way. For instance, business problems
    are much easier to explain with if-then statements than with complex nonlinear
    equations.


    ### (ii) Classification and Regression Trees are Nonparametric & Nonlinear


    The results from classification and regression trees can be summarized in simplistic
    if-then conditions. This negates the need for the following implicit assumptions:


    - The predictor variables and the dependent variable are linear.

    - The predictor variables and the dependent variable follow some specific nonlinear
    link function.

    - The predictor variables and the dependent variable are monotonic.


    Since there is no need for such implicit assumptions, classification and regression
    tree methods are well suited to data mining. This is because there is very little
    knowledge or assumptions that can be made beforehand about how the different variables
    are related.


    As a result, classification and regression trees can actually reveal relationships
    between these variables that would not have been possible using other techniques.


    ### (iii) Classification and Regression Trees Implicitly Perform Feature Selection


    Feature selection or variable screening is an important part of analytics. When
    we use decision trees, the top few nodes on which the tree is split are the most
    important variables within the set. As a result, feature selection gets performed
    automatically and we don’t need to do it again.


    ## Limitations of Classification and Regression Trees


    ![image](d2d_images/image199.png)


    Classification and regression tree tutorials, as well as classification and regression
    tree ppts, exist in abundance. This is a testament to the popularity of these
    decision trees and how frequently they are used. However, these decision trees
    are not without their disadvantages.


    There are many classification and regression trees examples where the use of a
    decision tree has not led to the optimal result. Here are some of the limitations
    of classification and regression trees.


    ### (i) Overfitting


    Overfitting occurs when the tree takes into account a lot of noise that exists
    in the data and comes up with an inaccurate result.


    ### (ii) High variance


    In this case, a small variance in the data can lead to a very high variance in
    the prediction, thereby affecting the stability of the outcome.


    ### (iii) Low bias


    A decision tree that is very complex usually has a low bias. This makes it very
    difficult for the model to incorporate any new data.


    ## What is a CART in Machine Learning?


    A Classification and Regression Tree (`CART`) is a predictive algorithm used in
    machine learning. It explains how a target variable’s values can be predicted
    based on other values.


    It is a decision tree where each fork is a split in a predictor variable and each
    node at the end has a prediction for the target variable.


    The `CART` algorithm is an important decision tree algorithm that lies at the
    foundation of machine learning. Moreover, it is also the basis for other powerful
    machine learning algorithms like bagged decision trees, random forest and boosted
    decision trees.


    ## Summing up


    The Classification and regression tree (`CART`) methodology is one of the oldest
    and most fundamental algorithms. It is used to predict outcomes based on certain
    predictor variables.


    They are excellent for data mining tasks because they require very little data
    pre-processing. Decision tree models are easy to understand and implement which
    gives them a strong advantage when compared to other analytical models.


    ## Regression


    ### Regression Analysis in machine learning


    Regression analysis is a statistical method to model the relationship between
    a dependent (target) and independent (predictor) variables with one or more independent
    variables. More specifically, Regression analysis helps us to understand how the
    value of the dependent variable is changing corresponding to an independent variable
    when other independent variables are held fixed. It predicts continuous/real values
    such as temperature, age, salary, price, etc.


