  trans: "\n\n1. **探索**：在强化学习中，智能体通过其选择的动作序列来影响训练样本的分布。这引发了一个问题：哪种实验策略能产生最有效的学习？学习者在选择时面临着权衡：是倾向于对未知状态和动作进行探索，还是对已经学习会产生高奖励的状态和动作进行利用。\n\
    \n2. **部分可观测状态**：智能体的传感器在每个时间步可以感知环境的整个状态，但在许多实际情况下，传感器只能提供部分信息。在这种情况下，智能体在选择动作时需要考虑其之前的观测以及当前的传感器数据，而最佳策略可能是专门为了提高环境的可观测性而选择的动作。\n\
    \n3. **终身学习**：机器人需要在同一个环境内、使用相同的传感器学习多个相关任务。例如，移动机器人可能需要学习如何对接电池充电器、如何穿过狭窄的走廊以及如何取出激光打印机的输出物。这种设定使得在学习新任务时，利用之前获得的经验或知识来减少样本成为可能。\n\
    \n## 学习任务\n\n* 考虑马尔可夫决策过程 (`MDP`)，其中智能体可以感知环境的一组不同状态 `S`，并拥有一个可以执行动作集合 `A`。\n\
    * 在每个离散时间步 `t`，智能体感知当前状态 `st`，选择一个当前动作 `at` 并执行它。\n\n![image](img/image040.png)\n\
    \n* 环境通过给予智能体一个奖励 `rt = r(st, at)` 并产生后续状态 `st+l = δ(st, at)` 来做出响应。这里函数 `δ(st,\
    \ at)` 和 `r(st, at)` 仅取决于当前状态和动作，而不取决于较早的状态或动作。\n\n智能体的任务是学习一个策略 `π: S → A`，基于当前观测到的状态\
    \ `st` 选择其下一个动作 `a`；即 `(st) = at`。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | ---\
    \ | --- |\n![image](img/chapter_title_above.png) \n\n# 我们应该如何精确指定想要智能体学习的策略 `π`？\n\
    \n![image](img/chapter_title_below.png)\n\n1. 一种方法是要求策略随时间为机器人产生最大的累积奖励。\n   \
    \ * ![image](img/image177.jpg)\n    为了更精确地表述这一要求，定义从任意初始状态 `st` 开始遵循任意策略 `π` 所得的累积值\
    \ `Vπ (st)` 如下：\n    * 其中，奖励序列 `rt+i` 是通过从状态 `st` 开始并重复使用策略 `π` 选择动作生成的。\n   \
    \ * 这里 `0 ≤ γ ≤ 1` 是一个决定延迟奖励与即时奖励相对价值的常数。如果我们设置 `γ = 0`，则只考虑即时奖励。当我们设置 `γ` 接近\
    \ 1 时，未来奖励相对于即时奖励被更大的权重。\n    * 数值 `Vπ (st)` 被称为策略 `π` 从初始状态 `s` 开始实现的折扣累积奖励。对未来奖励相对于即时奖励进行折扣是合理的，因为在许多情况下，我们更倾向于尽早获得奖励而不是晚获得。\n\
    \n2. ![image](img/image113.jpg)\n    总奖励的另一种定义是有限视界奖励，\n    考虑有限步数 `h` 内不打折扣的奖励总和。\n\
    \n3. 另一种方法是平均奖励\n![image](img/image094.jpg)\n\n考虑智能体整个生命周期内每个时间步的平均奖励。\n我们要求智能体学习一个对于所有状态\
    \ `s` 都使 `Vπ (st)` 最大化的策略 `π`。这样的策略被称为最优策略，并记为 `π*`\n\n![image](img/image040.png)\n\
    ![image](img/image030.jpg)\n\n将最优策略的价值函数 `Vπ*(s)` 称为 `V*(s)`。`V*(s)` 给出了智能体从状态\
    \ `s` 开始获得的最大折扣累积奖励。\n\n## 示例：\n\n![image](img/image102.jpg)\n\n图中描述简单的网格世界环境\n\
    * 图中的六个网格单元代表智能体的六种可能状态或位置。\n* 图中的每个箭头代表智能体从一个状态移动到另一个状态可以采取的可能动作。\n* 与每个箭头关联的数字代表智能体执行相应的状态-动作转移时获得的即时奖励\
    \ `r(s, a)`。\n* 在环境中，除了进入标记为 `G` 的状态外，所有状态-动作转移的即时奖励均为零。状态 `G` 为目标状态，智能体进入该状态即可获得奖励。\n\
    \n一旦了状态、动作和即时奖励，选择折扣因子 `γ` 的值，确定最优策略 `π *` 及其价值函数 `V*(s)`。\n\n让我们选择 `γ = 0.9`。图底部的图显示了该设置的一种最优策略。\n\
    \n![image](img/image040.png)\n![image](img/image047.jpg)\n\n`V*(s)` 和 `Q(s, a)`\
    \ 的值\n`V*(s)` 和 `Q(s, a)` 分别显示从状态 `s` 执行动作 `a` 后的折扣累积奖励。（简化上下文）\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | ---\
    \ | --- |\n## Q 学习\n\n![image](img/\n______ an_ an.png)\n\n![image](img/chapter_title_above.png)\
    \ \n\n\n智能体可以学习策略吗。\n\n## 智能体应该尝试学习什么评估函数？\n\n![image](img/chapter_title_below.png)\
    \ \n\n一个明显的选择是 `V\\*`。智能体应该倾向于选择 `sl` 而非 `s2`（`V*(sl) > V*(2)`）来学习。\n\nddddd___________the_evaluation_function.png)\n\
    \n![image](img/image089.jpg)\n![image](img/image040.png)\n\n## Q 函数\n\n评估函数 `Q(s,\
    \ a)` 的值是从状态 `s` 执行动作 `a` 立即获得的奖励，加上之后遵循最优策略的价值（折扣为 `γ`）。\n\n![image](img/image120.jpg)\n\
    \n![image](img/image097.jpg)\n\n![image](img/image068.jpg)\n\n![image](img/image048.jpg)\n\
    \nQ(s, a)\n\n## Q Q 的算法\n\n* 学习 Q 函数对应于学习最优策略。\n* 关键问题是在给定分布在时间的即时奖励序列 `r` 的情况下，找到一种可靠的方法来估计\
    \ `Q` 的训练值。可以通过迭代近似来实现\n\n![image](img/image136.jpg)\n\n![image](img/image113.jpg)\n\
    \nQ 学习算法假设奖励和动作是确定的。折扣因子 `γ` 可以是任何满足 `0 ≤ γ < 1` 的常数。\n\n![image](img/image040.png)\n\
