- fmt: '

    To illustrate, imagine some new change in the environment of some species, such
    as a new predator. Such a change will selectively favor individuals capable of
    learning to avoid the predator. As the proportion of such self-improving individuals
    in the population grows, the population will be able to support a more diverse
    gene pool, allowing evolutionary processes (even non-Lamarckian generate-and-test
    processes) to adapt more rapidly. This accelerated adaptation may in turn enable
    standard evolutionary processes to more quickly evolve a genetic (nonlearned)
    trait to avoid the predator (e.g., an instinctive fear of this animal). Thus,
    the Baldwin effect provides an indirect mechanism for individual learning to positively
    impact the rate of evolutionary progress. By increasing survivability and genetic
    diversity of the species, individual learning supports more rapid evolutionary
    progress, thereby increasing the chance that the species will evolve genetic,
    nonlearned traits that better fit the new environment.


    There have been several attempts to develop computational models to study the
    Baldwin effect. For example, Hinton and Nowlan (1987) experimented with evolving
    a population of simple neural networks, in which some network weights were fixed
    during the individual network "lifetime," while others were trainable. The genetic
    makeup of the individual determined which weights were


    ![image](d2d_images/image040.png)


    trainable and which were fixed. In their experiments, when no individual learning
    was allowed, the population failed to improve its fitness over time. However,
    when individual learning was allowed, the population quickly improved its fitness.
    During early generations of evolution the population contained a greater proportion
    of individuals with many trainable weights. However, as evolution proceeded, the
    number of fixed, correct network weights tended to increase, as the population
    evolved toward genetically given weight values and toward less dependence on individual
    learning of weights. Additional computational studies of the Baldwin effect have
    been reported by Belew (1990), Harvey (1993), and French and Messinger (1994).
    An excellent overview of this topic can be found in Mitchell (1996). A special
    issue of the journal Evolutionary Computation on this topic (Turney et al 1997)
    contains several articles on the Baldwin effect.


    ## Parallelizing Genetic Algorithms


    GAS are naturally suited to parallel implementation, and a number of approaches
    to parallelization have been explored. Coarse grain approaches to parallelization
    subdivide the population into somewhat distinct groups of individuals, called
    demes. Each deme is assigned to a different computational node, and a standard
    GA search is performed at each node. Communication and cross- fertilization between
    demes occurs on a less frequent basis than within demes. Transfer between demes
    occurs by a migration process, in which individuals from one deme are copied or
    transferred to other demes. This process is modeled after the kind of cross-fertilization
    that might occur between physically separated subpopulations of biological species.
    One benefit of such approaches is that it reduces the crowding problem often encountered
    in nonparallel GAS, in which the system falls into a local optimum due to the
    early appearance of a genotype that comes to dominate the entire population. Examples
    of coarse-grained parallel GAS are described by Tanese (1989) and by Cohoon et
    al. (1987).


    In contrast to coarse-grained parallel implementations of GAS, fine-grained implementations
    typically assign one processor per individual in the population. Recombination
    then takes place among neighboring individuals. Several different types of neighborhoods
    have been proposed, ranging from planar grid to torus. Examples of such systems
    are described by Spiessens and Manderick (1991). An edited collection of papers
    on parallel GAS is available in Stender (1993).

