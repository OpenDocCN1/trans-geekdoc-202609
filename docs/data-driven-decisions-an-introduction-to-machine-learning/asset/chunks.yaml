  trans: "\n\n![image](img/image124.png)\n\n因此，一个假设被选中的概率与其自身的适应度正比，与当前种群中其他竞争假设的适应度成反比。\n\
    \n一旦这些当前代的成员被选中纳入下一代种群，将将通过交叉操作生成额外的成员。交叉在下一节中详细定义，它从当前代中选取两个父假设，并通过重新组合两个父的部分来创建两个后代假设。父假设是从当前种群中概率选择的，同样使用公式\
    \ (9.1) 给出的概率函数。在通过此交叉操作创建新成员后，新代种群现在包含了所需的成员数量。\n\n![image](img/image040.png)\n\
    \n此时，随机选择这些成员中的某比例 `m`，并执行所有随机变异以改变这些成员。\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n因此，该遗传算法（GA）对根据适应度函数表现良好的假设进行随机的并行光束搜索。在接下来的子节中，我们将更详细地描述该算法中使用的假设表示和遗传算子。\n\
    \n## 假设的表示\n\nGAS 中的假设通常用位字符串表示，这样它们就可以被变异和交叉等遗传算子轻松处理。这些位字符串表示的假设可能非常复杂。例如，if-then\
    \ 规则集可以通过这种方式表示，通过选择规则的编码，为每个规则的前置和后置条件分配特定的字符串。\n\n为了了解如何用位字符串编码 if-then 规则，首先考虑我们如何使用位字符串来描述对单个属性值的约束。举个例子，考虑属性\
    \ `Outlook`（天气），它可以取 `Sunny（晴）、Overcast（多云）或 Rain（雨）` 这三个值之一。表示对 `Outlook` 约束的一种明显方法是使用长度为三的位字符串，其中每个位位置对应其三个可能值之一。在某些位置放置\
    \ `1` 表示该属性允许取相应的值。例如，字符串 `010` 表示 `Outlook` 必须取这些值中的第二个，即 `Outlook = Overcast`。同样，字符串\
    \ `011` 表示更通用的约束，允许两个可能的值，或 `(Outlook = Overcast v Rain)`。注意 `111` 表示最通用的约束，表示我们不在乎该属性取其哪一个可能的值。\n\
    \n给定这种表示单个属性约束的方法，多个属性约束的逻辑与集可以通过拼接相应的位字符串轻松地表示。例如，考虑第二个属性 `Wind`（风力），它可以取 `Strong（强）`\
    \ 或 `Weak（弱）` 值。一个规则前置条件如：\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- |\
    \ --- | --- |\n![image](img/chapter_title_above.png) \n\n# (Outlook = Overcast\
    \ v Rain) (Wind = Strong)\n\n前置条件（如 `Outlook = Overcast, Wind = Strong`）可以通过以下长度为五的位字符串表示\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png)  ||  || ![image](img/chapter_title_corner_decoration_right.png)\
    \  |\n| --- | --- | --- |\n![image](img/chapter_title_above.png) \n\n# (Outlook\
    \ = Overcast, Wind = Strong)\n\n![image](img/below.png) 01110\n\n后置条件（如 `THEN\
    \ Sunny`）可以以类似的方式表示。因此，整个规则可以通过拼接描述前条件的位字符串与描述后置条件的位字符串来表示。例如，`IF Outlook = Overcast,\
    \ Wind = Strong THEN Sunny` 将通过如下\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- |\
    \ --- | --- |\n![image](img/chapter_title_above.png) \n\n# Outlook = Overcast,\
    \ Wind = Strong THEN Sunny\n\n![image](img/below.png) 11110\n\n其中前三个位表示对 `Outlook`\
    \ 的不关心，接下来的两个位表示对 `Wind`，最后两个位表示后置条件（这里假设 `Sunny` 可以取 `Yes or No`）。注意 `11110`\n\
    \n`IF Outlook = Overcast, Wind = Strong THEN Sunny` 将通过\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- |\
    \ --- | --- |\n![image](img/chapter_title_above.png) \n\n# Outlook = Overcast,\
    \ Wind = Strong THEN Sunny\n\n![image](img/below.png) 01110\n\n这种位字符串显示了特定位置的约束。对于这种规则的表示，我们可以通过拼接单个规则的位表示来表示规则集。\n\
    \n![image](img/scene_break.png)\n\n在为某些假设空间设计位字符串编码时，让每个语法正确的位字符串都表示一个定义的假设是有用的。为了说明，注意上段落中的位字符串\
    \ `11 1011` 表示一个规则定义的规则。如果我们想避免考虑这种假设，我们可以采用不同的编码（例如，为 `THEN Sunny` 后置条件仅分配一个位以指示该值是或否），修改遗传算子以显式避免构造此类位字符串，或者简单为此类位字符串分配很低的适应度。\n\
    \n在某些 GAS 中，假设由符号描述而非位字符串表示。\n\n## 遗传算子\n\n遗传算法后代的生成取决于一组重组和变异当前种群成员的算子。这些算子对应于生物进化中遗传操作的理想化版本。两种常用的算子是交叉和变异。\n\
    \n交叉算子通过复制每个父的选择位产生两个新的后代。每个后代中位置 `i` 的位是从其中一个父的位置 `i` 处复制的。哪个父提供位置 `i` 的位由一个称为交叉掩码（crossover\
    \ mask）的额外字符串决定。为了说明，考虑表顶部的单点交叉算子。在这种情况下，考虑两个后代中的上方。该后代前五个位来自第一个父，其余六位来自第二个父，因为交叉掩码\
    \ `11 11 000000` 指定了每个位位置的选择。第二个后代使用相同的交叉掩码，但交换了两个父的角色。因此，它包含了第一个后代没有使用的位。在单点交叉中，交叉掩码始终构造为以一个包含\
    \ `n` 个连续 `1` 的字符串开头，随后是完成字符串所需的数量的 `0`。这产生了后代，前 `n` 位由一个父提供，剩余位由第二个父提供。每当应用单点交叉算子时，随机选择交叉点\
    \ `n`，然后创建并应用交叉掩码。\n\n"
- fmt: "\nIn two-point crossover, offspring are created by substituting intermediate\
    \ segments of one parent into the middle of the second parent string. Put another\
    \ way, the crossover mask is a string beginning with no zeros, followed by a contiguous\
    \ string of `nl` ones, followed by the necessary number of zeros to complete the\
    \ string. Each time the two-point crossover operator is applied, a mask is generated\
    \ by randomly choosing the integers `no` and `nl`.\n\n## Fitness Function and\
    \ Selection\n\nThe fitness function defines the criterion for ranking potential\
    \ hypotheses and for probabilistically selecting them for inclusion in the next\
    \ generation population. If the task is to learn classification rules, then the\
    \ fitness function typically has a component that scores the classification accuracy\
    \ of the rule over a set of provided training examples. Often other criteria may\
    \ be included as well, such as the complexity or generality of the rule. More\
    \ generally, when the bit-string hypothesis is interpreted as a complex procedure\
    \ (e.g., when the bit string represents a collection of `if-then` rules that will\
    \ be chained together to control a robotic device), the fitness function may measure\
    \ the overall performance of the resulting procedure rather than performance of\
    \ individual rules.\n\nIn our prototypical GA shown in above Table , the probability\
    \ that a hypothesis will be selected is given by the ratio of its fitness to the\
    \ fitness of other members of the current population as seen in Equation above\
    \ . This method is sometimes called fitness proportionate selection, or roulette\
    \ wheel selection. Other methods for using fitness to select hypotheses have also\
    \ been proposed. For example, in tournament selection, two hypotheses are first\
    \ chosen at random from the current population. With some predefined probability\
    \ `p` the more fit of these two is then selected, and with probability `(1 - p)`\
    \ the less fit hypothesis is selected. Tournament selection often yields a more\
    \ diverse population than fitness proportionate selection. In another method called\
    \ rank selection, the hypotheses in the current population are first sorted by\
    \ fitness. The probability that a hypothesis will be selected is then proportional\
    \ to its rank in this sorted list, rather than its fitness.\n\n![image](d2d_images/image040.png)\n\
    \n## 5.3. An Illustrative Example\n\nA genetic algorithm can be viewed as a general\
    \ optimization method that searches a large space of candidate objects seeking\
    \ one that performs best according to the fitness function. Although not guaranteed\
    \ to find an optimal object, GAS often succeed in finding an object with high\
    \ fitness. GAS have been applied to a number of optimization problems outside\
    \ machine learning, including problems such as circuit layout and job-shop scheduling.\
    \ Within machine learning, they have been applied both to function-approximation\
    \ problems and to tasks such as choosing the network topology for artificial neural\
    \ network learning systems.\n\nTo illustrate the use of GAS for concept learning,\
    \ we briefly summarize the GABIL system described by DeJong et al. (1993). GABIL\
    \ uses a GA to learn boolean concepts represented by a disjunctive set of propositional\
    \ rules. In experiments over several concept learning problems, GABIL was found\
    \ to be roughly comparable in generalization accuracy to other learning algorithms\
    \ such as the decision tree learning algorithm C4.5 and the rule learning system\
    \ AQ14. The learning tasks in this study included both artificial learning tasks\
    \ designed to explore the systems' generalization accuracy and the real world\
    \ problem of breast cancer diagnosis.\n\nThe specific instantiation of the GA\
    \ algorithm in GABIL can be summarized as follows:\n\n**Representation.** Each\
    \ hypothesis in GABIL corresponds to a disjunctive set of propositional rules,\
    \ encoded as described in Section 9.2.1. In particular, the hypothesis space of\
    \ rule preconditions consists of a conjunction of constraints on a fixed set of\
    \ attributes, as described in that earlier section. To represent a set of rules,\
    \ the bit-string representations of individual rules are concatenated. To illustrate,\
    \ consider a hypothesis space in which rule preconditions are conjunctions of\
    \ constraints over two Boolean attributes, `a1` and `a2`. The rule postcondition\
    \ is described by a single bit that indicates the predicted value of the target\
    \ attribute `c`. Thus, the hypothesis consisting of the two rules\n\n`IF a1=T\
    \ and a2=F THEN c=T; IF a2=T THEN c=F`\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\n```\na1  a2 c  a1 a2 c\n10 01 1  11 01 0\n```\n\nNote the length of the\
    \ bit string grows with the number of rules in the hypothesis. This variable bit-\
    \ string length requires a slight modification to the crossover operator, as described\
    \ below.\n\n**Genetic operators.** GABIL uses the standard mutation operator of\
    \ above Table in which a single bit is chosen at random and replaced by its complement.\
    \ The crossover operator that it uses is a fairly standard extension to the two-point\
    \ crossover operator described in Table 9.2. In particular, to accommodate the\
    \ variable-length bit strings that encode rule sets, and to constrain the system\
    \ so that crossover occurs only between like sections of the bit strings that\
    \ encode rules, the following approach is taken. To perform a crossover operation\
    \ on two parents, two crossover points are first chosen at random in the first\
    \ parent string. Let `dl` (`dz`) denote the distance from the leftmost (rightmost)\
    \ of these two crossover points to the rule boundary immediately to its left.\
    \ The crossover points in the second parent are now randomly chosen, subject to\
    \ the constraint that they must have the same `dl` and `d2` value. For example,\
    \ if the two parent strings are\n\n![image](d2d_images/image040.png)\n\n![image](d2d_images/image059.png)\n\
    \nand the crossover points chosen for the first parent are the points following\
    \ bit positions 1 and 8,\n\n![image](d2d_images/image073.png)\n\n––––––––\n\n\
    ![image](d2d_images/scene_break.png) \n\nwhere `[` and `1` indicate crossover\
    \ points, then `dl = 1` and `dz = 3`. Hence the allowed pairs of crossover points\
    \ for the second parent include the pairs of bit positions (1,3), (1,8), and (6,8).\
    \ If the pair (1,3) happens to be chosen,\n\n![image](d2d_images/image108.png)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nthen the two resulting\
    \ offspring will be\n\n![image](d2d_images/image050.png)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\nAs this example illustrates, this crossover operation enables offspring\
    \ to contain a different number of rules than their parents, while assuring that\
    \ all bit strings generated in this fashion represent well defined rule sets.\n\
    \n**Fitness function.** The fitness of each hypothesized rule set is based on\
    \ its classification accuracy over the training data. In particular, the function\
    \ used to measure fitness is\n\n![image](d2d_images/image105.png)\n\nwhere `correct\
    \ (h)` is the percent of all training examples correctly classified by hypothesis\
    \ h.\n\nIn experiments comparing the behavior of GABIL to decision tree learning\
    \ algorithms such as C4.5 and ID5R, and to the rule learning algorithm AQ14report\
    \ roughly comparable performance among these systems, tested on a variety of learning\
    \ problems. For example, over a set of 12 synthetic problems, GABIL achieved an\
    \ average generalization accuracy of 92.1 %, whereas the performance of the other\
    \ systems ranged from 91.2 % to 96.6 %.\n"
