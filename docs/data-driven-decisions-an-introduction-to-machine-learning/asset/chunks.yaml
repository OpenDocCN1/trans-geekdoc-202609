    ![image](img/image184.png)![image](img/image062.png)![image](img/image142.png)AdaBoost
    要求学习器是弱学习器，即 `Є j < 1/2`,`∀ j`；如果不是如此，我们就停止添加新的基学习器。注意，这个错误率不是针对原始问题的，而是针对第 `j`
    步使用的数据集。我们


    ![image](img/image040.png)


    ![image](img/image029.png)定义 `βj \= Є j /(1 −Є j) < 1`，如果 `dj` 正确分类了 `xt`，则我们设置
    `p^t \= βj p^t`；否则，`p^t \= p^t`


    ![image](img/image029.png)由于 `p^t` 应该是概率，因此存在一个归一化，我们将 `p^t` 除以 `∑ 𝑡 p^t`，使得


    ![image](img/image029.png)![image](img/image029.png)![image](img/image029.png)它们的和为
    1。这种方法的效果是：正确分类实例的概率降低了，而分类错误实例的概率增加了。然后，根据这些修改后的概率 `p^t`，从原始样本中放回地抽取一个相同大小的新样本，并用于训练
    `dj+1`。


    这种方法的效果是 `dj+1` 更加关注被 `dj` 分类错误的实例；这就是为什么基学习器被选择得是简单且不准确的，因为否则下一次训练样本将只包含少数重复多次的离群值和噪声实例。例如，在决策树中，使用了决策树桩（decision
    stumps），即只生长一或两层的树。因此显然，这些模型会有偏差，但方差的降低更大，且整体误差会减少。像线性判别器这样的算法方差较低，我们无法通过 AdaBoosting
    线性判别器获得增益。


    # Stacking - 堆叠泛化 (Stacked Generalization)


    堆叠泛化是 Wolpert (1992) 提出的一种技术，它是对投票法的扩展，区别在于基学习器输出组合的方式不需要是线性的，而是通过组合器系统 `f (·|Φ)`
    来学习的，这로另一个学习器，其参数 `Φ` 也会经过训练。（见下图）


    ![image](img/image115.png)


    图：在堆叠泛化中，组合器是另一个学习器，并且不像投票法那样受限于线性组合。


    `y \= f (d1, d2, . . . , dL |Φ)`


    组合器学习当基学习器给出特定的输出组合时，正确的输出是什么。我们不能在训练数据上训练组合器函数，因为基学习器可能会记住训练集；组合器系统实际上应该学习基学习器是如何产生错误的。Stacking
    是一种用于估计和纠正基学习器偏差的方法。因此，组合器应该在训练基学习器时未使用的数据上训练。


    如果 `f (·|w1, . . . , wL)` 是带约束的线性模型，`wi ≥ 0`，`∑ 𝑗Wj \= 1`，则可以通过约束回归找到最优权重，但当然我们不需要强制执行这一点；在
    stacking 中，对组合函数没有限制，且与投票法不同，`f (·)` 可以是非线性的。例如，它可以被实现为多层感知器，其中 `Φ` 是其连接权重。


    基学习器 `dj` 的输出定义了一个新的 `L` 维空间，在该空间中，通过组合器函数学习输出判别/回归函数。


    在堆叠泛化中，我们希望基学习器尽可能不同，以便它们能够互补，为此，最好是让它们基于不同的学习算法。如果我们正在组合可以生成连续输出的分类器（例如，后验概率），那么让它们输出组合后的结果而不是硬决策（hard
    decisions）会更好。


    当我们把 stacking 中训练过的组合器与投票法中的固定规则进行比较时，我们发现二者各有优劣：训练过的规则更灵活且可能偏差较小，但增加了额外的参数，存在引入方差的风险，并且需要额外的时间和数据进行训练。另外注意，在堆叠之前不需要对分类器的输出进行归一化。


    # 概率学习 (Probabilistic Learning)


    在机器学习中，概率分类器能够预测观测值可能所属的最优类别。概率分类器提供了一个经常针对神经网络（尤其是 MLP）的批评点——即我们并不完全清楚它究竟在做什么。


    ![image](img/image040.png)


    在这个主题中，我们研究基于统计学的方法，因此它们更具透明度，因为我们总是可以提取概率并查看它们是什么。


    ––––––––


    ![image](img/scene_break.png)高斯混合模型 (GAUSSIAN MIXURE MODELS)


    然而，假设我们拥有相同的数据但没有标签。这需要无监督学习。假设不同的类别分别来自自己的高斯分布。这被称为多峰态数据，因为每个类都有一个分布（模式）。我们无法为数据拟合一个高斯分布，因为它看起来不像高斯分布。


    然而，我们确实可以做什么。如果我们知道数据中有多少类，就可以一次性估计相应数量的高斯分布参数。如果我们不知道，可以尝试不同的数量并看哪种有效。我们将在第 2
    节通过另一种方法（k-means 算法）详细讨论这个问题。完全可以使用任何其他分布代替高斯分布，但高斯分布是最常见的选择。那么，输入算法的任何特定数据点的输出将是
    M 个高斯分布期望值的和：


    ![image](img/image186.png)


    其中 `_(x ; μm, ∑  Mullen)` 是均值为 `μm`、协方差矩阵为 `∑  Mullen`的高斯函数，而 `αm` 是![image](img/image126.png)权重，满足约束
    `∑𝑀 𝛼𝑚 \=1`。


    图 4 展示了两个示例，数据（直方图所示）来自两个高斯分布，模型是通过这两个高斯分布的和或混合计算的。


    ![image](img/image171.jpg)


    图 4：来自双高斯混合训练数据的直方图以及拟合的模型（线图所示）。左侧的模型拟合良好，但右侧的模型产生的两个高斯分布重叠，没有很好地拟合数据。


    该图还给你提供了在创建混合模型后如何使用它的思路。输入 `xi` 属于类别 `m` 的概率可以写为（其中变量上的加帽 (ˆ·) 表示我们正在估计该变量的值）：


    ![image](img/image009.png)


    问题在于如何选择权重 `αm`。常见的方法是目标最大化。'
- fmt: "\nLikelihood solution (the likelihood is the conditional probability of the\
    \ data given the model, and the maximum likelihood solution varies the model to\
    \ maximise this conditional probability). In fact, it is common to compute the\
    \ log likelihood and then to maximise maximise that; it is guaranteed to be negative,\
    \ since probabilities are all less than 1, and the logarithm spreads out the values,\
    \ making the optimisation more effective. The algorithm that is used is an example\
    \ of a very general one known as the expectation- maximisation (or more compactly,\
    \ `EM`) algorithm.\n\n## The Expectation-Maximisation (EM) Algorithm\n\nThe basic\
    \ idea of the `EM` algorithm is that sometimes it is easier to add extra variables\
    \ that are not actually known (called hidden or latent variables) and then to\
    \ maximise the function over those variables. This might seem to be making a problem\
    \ much more complicated than it needs to be, but it turns out for many problems\
    \ that it makes finding the solution significantly easier.\n\nIn order to see\
    \ how it works, we will consider the simplest interesting case of the Gaussian\
    \ mixture model: a combination of just two Gaussian mixtures. The assumption now\
    \ is that sample from that Gaussian. If the probability of picking Gaussian one\
    \ is `p`, then the entire model looks like this (where `N(μ, σ²)` specifies a\
    \ Gaussian distribution with mean `μ` and standard deviation `σ`):\n\n![image](d2d_images/image181.png)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nIf the probability distribution\
    \ of `p` is written as `π`, then the probability density is:\n\n![image](d2d_images/image000.png)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nFinding the maximum likelihood\
    \ solution (actually the maximum log likelihood) to this problem is then a case\
    \ of computing the sum of the logarithm of Equation over all of the training data,\
    \ and differentiating it, which would be rather difficult. Fortunately, there\
    \ is a way around it. The key insight that we need is that if we knew which of\
    \ the two Gaussian components the datapoint came from, then the computation would\
    \ be easy. The mean and standard deviation for each component could be computed\
    \ from the datapoints that belong to that component, and there would not be a\
    \ problem. Although we don’t know which component each datapoint came from, we\
    \ can pretend we do, by introducing a new variable `f`. If `f` = `0` then the\
    \ data came from Gaussian one, if `f` = `1` then it came from Gaussian two.\n\n\
    This is the typical initial step of an `EM` algorithm: adding latent variables.\
    \ Now we just need to work out how to optimise over them. This is the time when\
    \ the reason for the algorithm being called expectation-maximisation becomes clear.\
    \ We don’t know much about variable `f` (hardly surprising, since we invented\
    \ it), but we can compute its expectation (that is, the value that we ‘expect’\
    \ to see, which is the mean average) from the data:\n\n![image](d2d_images/image016.png)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nwhere `D` denotes the data.\
    \ Note that since we have set `f` = `1` this means that we are choosing Gaussian\
