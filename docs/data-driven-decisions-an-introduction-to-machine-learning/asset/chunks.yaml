    \ attributes, a1 and a2.The rule postcondition is described by a single bit that\
    \ indicates the predicted value of the target attribute c. Thus, the hypothesis\
    \ consisting of the two rules\n\nIF al\\=T^a2\\=F THEN c=T; IF a2\\=T THEN c=F\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nwould be represented by\
    \ the string\n\na1  a2 c a1 a2 c\n\n10 01 1 11 01 0\n\nNote the length of the\
    \ bit string grows with the number of rules in the hypothesis. This variable bit-\
    \ string length requires a slight modification to the crossover operator, as described\
    \ below.\n\nGenetic operators. GABIL uses the standard mutation operator of above\
    \ Table in which a single bit is chosen at random and replaced by its complement.\
    \ The crossover operator that it uses is a fairly standard extension to the two-point\
    \ crossover operator described in Table 9.2. In particular, to accommodate the\
    \ variable-length bit strings that encode rule sets, and to constrain the system\
    \ so that crossover occurs only between like sections of the bit strings that\
    \ encode rules, the following approach is taken. To perform a crossover operation\
    \ on two parents, two crossover points are first chosen at random in the first\
    \ parent string. Let dl (dz) denote the distance from the leftmost (rightmost)\
    \ of these two crossover points to the rule boundary immediately to its left.\
    \ The crossover points in the second parent are now randomly chosen, subject to\
    \ the constraint that they must have the same dl and d2 value. For example, if\
    \ the two parent strings are\n\n![image](d2d_images/image040.png)\n\n![image](d2d_images/image059.png)\n\
    \nand the crossover points chosen for the first parent are the points following\
    \ bit positions 1 and 8,\n\n![image](d2d_images/image073.png)\n\n––––––––\n\n\
    ![image](d2d_images/scene_break.png) \n\nwhere \"\\[\" and \"1\" indicate crossover\
    \ points, then dl = 1 and dz = 3. Hence the allowed pairs of crossover points\
    \ for the second parent include the pairs of bit positions (1,3), (1,8), and (6,8).\
    \ If the pair (1,3) happens to be chosen,\n\n![image](d2d_images/image108.png)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nthen the two resulting\
    \ offspring will be\n\n![image](d2d_images/image050.png)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\nAs this example illustrates, this crossover operation enables offspring\
    \ to contain a different number of rules than their parents, while assuring that\
    \ all bit strings generated in this fashion represent well- defined rule sets.\n\
    \nFitness function. The fitness of each hypothesized rule set is based on its\
    \ classification accuracy over the training data. In particular, the function\
    \ used to measure fitness is\n\n![image](d2d_images/image105.png)\n\nwhere correct\
    \ (h) is the percent of all training examples correctly classified by hypothesis\
    \ h.\n\nIn experiments comparing the behavior of GABIL to decision tree learning\
    \ algorithms such as C4.5 and ID5R, and to the rule learning algorithm AQ14report\
    \ roughly comparable performance among these systems, tested on a variety of learning\
    \ problems. For example, over a set of 12 synthetic problems, GABIL achieved an\
    \ average generalization accuracy of 92.1 %, whereas the performance of the other\
