- fmt: "\n*   Unsupervised learning works on unlabeled and uncategorized data which\
    \ make unsupervised learning more important.\n*   In real-world, we do not always\
    \ have input data with the corresponding output so to solve such cases, we need\
    \ unsupervised learning.\n\n## Working of Unsupervised Learning\n\n![image](d2d_images/image129.jpg)\n\
    \nWorking of unsupervised learning can be understood by the below diagram:\n\n\
    Here, we have taken an unlabeled input data, which means it is not categorized\
    \ and corresponding outputs are also not given. Now, this unlabeled input data\
    \ is fed to the machine learning model in order to train it. Firstly, it will\
    \ interpret the raw data to find the hidden patterns from the data and then will\
    \ apply suitable algorithms such as `k-means clustering`, `Decision tree`, etc.\n\
    \nOnce it applies the suitable algorithm, the algorithm divides the data objects\
    \ into groups according to the similarities and difference between the objects.\n\
    \n## Types of Unsupervised Learning Algorithm\n\nThe unsupervised learning algorithm\
    \ can be further categorized into two types of problems:\n\n![image](d2d_images/image083.jpg)\n\
    \n![image](d2d_images/image040.png)\n\n*   **Clustering**: Clustering is a method\
    \ of grouping the objects into clusters such that objects with most similarities\
    \ remains into a group and has less or no similarities with the objects of another\
    \ group. Cluster analysis finds the commonalities between the data objects and\
    \ categorizes them as per the presence and absence of those commonalities.\n*\
    \   **Association**: An association rule is an unsupervised learning method which\
    \ is used for finding the relationships between variables in the large database.\
    \ It determines the set of items that occurs together in the dataset. Association\
    \ rule makes marketing strategy more effective. Such as people who buy X item\
    \ (suppose a bread) are also tend to purchase Y (Butter/Jam) item. A typical example\
    \ of Association rule is Market Basket Analysis.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\n## Unsupervised Learning algorithms\n\nBelow is the list of some popular\
    \ unsupervised learning algorithms:\n\n*   `K-means clustering`\n*   `KNN` (`k-nearest\
    \ neighbors`)\n*   `Hierarchal clustering`\n*   `Anomaly detection`\n*   `Neural\
    \ Networks`\n*   `Principle Component Analysis`\n*   `Independent Component Analysis`\n\
    *   `Apriori algorithm`\n*   `Singular value decomposition`\n\n## Advantages of\
    \ Unsupervised Learning\n\n*   Unsupervised learning is used for more complex\
    \ tasks as compared to supervised learning because, in unsupervised learning we\
    \ don't have labeled data.\n*   Unsupervised learning is preferable as it is easy\
    \ to get unlabeled data in comparison to labeled data.\n\n## Disadvantages of\
    \ Unsupervised Learning\n\n*   Unsupervised learning is intrinsically more difficult\
    \ than supervised learning as it does not have corresponding output.\n*   The\
    \ result of unsupervised learning algorithm might be less accurate as input data\
    \ is not labeled, and algorithms do not know the exact output.\n\n![image](d2d_images/image040.png)\n\
    \n| Supervised Learning | Unsupervised Learning |\n| --- | --- |\n| Supervised\
    \ learning algorithms are trained using labeled data. | Unsupervised learning\
    \ algorithms are trained using unlabeled data. |\n| Supervised learning model\
    \ takes direct feedback to check if is predicting correct output or not. | Unsupervised\
    \ learning model does not take feedback. |\n| Supervised learning model predicts\
    \ the output. | Unsupervised learning model finds the hidden patterns in data.\
    \ |\n| In supervised learning, input data is provided along with the output. |\
    \ In unsupervised learning, only input data is provided to the model. |\n| The\
    \ goal of supervised learning is to train the model so it can predict the output\
    \ when is given new data. | The goal of unsupervised learning is to find hidden\
    \ patterns and useful insights from unknown dataset. |\n| Supervised learning\
    \ needs supervision to train the model. | Unsupervised learning does not need\
    \ any supervision to train the model. |\n| Supervised learning can be categorized\
    \ in Classification and Regression problems. | Unsupervised learning can be classified\
    \ in Clustering and Associations problems. |\n| Supervised learning can be used\
    \ for those cases where we know the input as well as corresponding outputs. |\
    \ Unsupervised learning can be used for those cases where we have only input data\
    \ and corresponding output. |\n| Supervised learning model produces an accurate\
    \ result. | Unsupervised learning model may give less accurate result as compared\
    \ to supervised learning. |\n| Supervised learning is not close to true Artificial\
    \ intelligence as in this, first train the model for each data, and then only\
    \ can predict the correct output. | Unsupervised learning is more close to the\
    \ true Intelligence as it learns similarly as child learns daily things by experiences.\
    \ |\n| It includes various algorithms such as `Linear Regression`, `Logistic Regression`,\
    \ `Support Vector Machine`, `Multi-class Classification`, `Decision tree`, `Bayesian\
    \ Logic`, etc. | It includes various algorithms such as `Clustering`, `KNN`, and\
    \ `Apriori algorithm`. |\n\n## K-Mean Clustering\n\n### k-means clustering algorithm\n\
    \nOne of the most used clustering algorithm is `k-means`. It allows to group the\
    \ data according to the existing similarities among them in k clusters, given\
    \ as input to the algorithm. I’ll start with a simple example. Let’s imagine we\
    \ have 5 objects (say 5 people) and for each of them we know two features (height\
    \ and weight). We want to group them into k=2 clusters. Our dataset will look\
    \ like this:\n\n![image](d2d_images/image040.png)\n\n![image](d2d_images/image061.png)\n\
    \nFirst of all, we have to initialize the value of the centroids for our clusters.\
    \ For instance, let’s choose Person 2 and Person 3 as the two centroids `c1` and\
    \ `c2`, so that `c1=(120,32)` and `c2=(113,33)`.\n\nNow we compute the euclidian\
    \ distance between each of the two centroids and each point in the data. If you\
    \ did all the calculations, you should have come up with the following numbers:\n\
    \n| | Distance of object from `c1` | Distance of object from `c2` |\n| --- | ---\
    \ | --- |\n| Person 1 | 52.3 | 58.3 |\n| Person 2 | 0 | 7.1 |\n| Person 3 | 7.1\
    \ | 0 |\n| Person 4 | 70.4 | 75.4 |\n| Person 5 | 13.9 | 9.4 |\n\nAt this point,\
    \ we will assign each object to the cluster it is closer to (that is taking the\
    \ minimum between the two computed distances for each object). We can then arrange\
    \ the points as follows:\n\n*   Person 1 → cluster 1\n*   Person 2 → cluster 1\n\
    *   Person 3 → cluster 2\n*   Person 4 → cluster 1\n*   Person 5 → cluster 2\n\
    \nLet’s iterate, which means to redefine the centroids by calculating the mean\
    \ of the members of each of the two clusters.\n\nSo `c’1 = ((167+120+175)/3, (55+32+76)/3)\
    \ = (154, 54.3)` and `c’2 = ((113+108)/2, (33+25)/2) = (110.5, 29)`\n\nThen, we\
    \ calculate the distances again and re-assign the points to the new centroids.\
    \ We repeat this process until the centroids don’t move anymore (or the difference\
    \ between them is under a certain small threshold).\n\nIn our case, the result\
    \ we get is given in the figure below. You can see the two different clusters\
    \ labelled with two different colours and the position of the centroids, given\
    \ by the crosses.\n\n![image](d2d_images/image040.png)\n\n![image](d2d_images/image167.jpg)\n\
    \n## How to apply k-means?\n\nAs you probably already know, I’m using Python libraries\
    \ to analyze my data. The k-means algorithm is implemented in the `scikit-learn`\
    \ package. To use it, you will just need the following line in your script:\n\n\
    ## What if our data is... non-numerical?\n"
