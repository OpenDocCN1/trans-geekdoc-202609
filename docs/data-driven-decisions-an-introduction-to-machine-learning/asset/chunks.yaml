    为了说明这一点，想象某些物种的环境发生了某种变化，例如出现了一种新的捕食者。这种变化会选择性地有利于那些学会避开捕食者的个体。随着种群中这类自我改进个体的比例增加，种群能够支持更多样化的基因池，允许进化过程（即使是非拉马尔克式的“产生与测试”过程）更快速地适应。这种加速的适应反过来可能使标准的进化过程更快地演化出遗传性的（非学习性）性状以规避捕食者（例如对这种动物产生本能恐惧）。因此，鲍尔温效应为个体学习积极影响进化进展速率提供了一种间接机制。通过增加物种的生存能力和遗传多样性，个体学习支持了更快速的进化进展，从而增加了物种演化出更适应新环境的遗传性、非学习性状的机会。


    目前已有多次尝试通过开发计算模型来研究鲍尔温效应。例如，Hinton 和 Nowlan (1987) 实验了演化一个简单神经网络种群，其中某些网络权重在单个网络的“生命周期”内是固定的，而另一些则是可训练的。个体的遗传组成决定了哪些权重是可训练的，哪些是固定的。


    ![image](img/image040.png)


    在实验中，当不允许个体学习时，种群无法随时间推移提高其适应度。然而，当允许个体学习时，种群迅速提高了适应度。在进化的早期，种群中具有许多可训练权重的个体比例较高。但随着进化的进行，固定的正确网络权重数量往往会增加，因为种群向遗传给定的权重值演化，并减少对权重学习的依赖。Belew
    (1990)、Harvey (1993) 以及 French 和 Messinger (1994) 报告了关于鲍尔温效应的其他计算研究。在 Mitchell
    (1996) 中可以找到关于该主题的极佳综述。《进化计算》杂志关于该主题的特刊（Turney et al 1997）包含了几篇关于鲍尔温效应的文章。


    ## 遗传算法的并行化


    遗传算法（GAS）天生适合并行实现，人们已经探索了多种并行化方法。粗粒度并行方法将种群划分为若干彼此独立的个体组，称为“亚种群”（demes）。每个亚种群分配到一个不同的计算节点，并在每个节点上执行标准的遗传算法搜索。亚种群之间的通信和交叉授粉频率低于种群内部。亚种群之间的传输通过迁移过程实现，即将个体从一个亚种群复制或传输到其他亚种群。该过程模拟了生物物种在物理上分离的亚种群之间可能发生的交叉授粉。这种方法的益处之一是它减少了非并行遗传算法中经常遇到的拥挤问题，在非并行算法中，由于某种基因型过早出现并主导整个种群，系统会陷入局部最优。Tanese
    (1989) 和 Cohoon 等 (1987) 描述了粗粒度并行遗传算法的示例。


    与遗传算法的粗粒度并行实现相比，细粒度实现通常为种群中的每个个体分配一个处理器。随后，重组在邻近个体之间进行。人们提出了几种不同类型的邻域，从平面网格到环面结构不等。Spiessens
    和 Manderick (1991) 描述了此类系统的示例。Stender (1993) 提供了一本关于并行遗传算法的论文辑。

