  trans: "\n网络被减少到一个特定的误差值，而这个值并不能带我们获得最优结果。“在 20 世纪中叶进入世界的科学人工神经网络正在以指数级速度发展。在现在，我们已经研究了人工神经网络的优点以及在使用过程中遇到的问题。不应该忽视的是，人工神经网络（ANN）作为一个蓬勃发展的科学分支，其缺点正在被逐一消除，而优点则在日益增加。这意味着，人工神经网络将逐渐成为我们生活中不可或缺的一部分，变得愈发重要。”\n\
    \n### 人工神经网络是如何工作的？\n\n人工神经网络可以最好地表示为一个加权有向图，其中人工神经元形成节点。神经元输出与神经元输入之间的关联可以看作带有权重的向边。人工神经网络从外部源接收输入信号，形式为模式，并以向量形式呈现图像。然后，这些输入通过符号\
    \ `x(n)` 对每一个 `n` 个输入进行数学上的赋值。\n\n![image](img/image199.png)\n\n![image](img/image189.png)\n\
    \n随后，每个输入都与其相应的权重相乘（这些权重是人工神经网络解决特定问题时利用的细节）。通来说，这些权重通常代表了人工神经网络内部神经元之间相互连接的强度。所有加权输入都在计算单元内部汇总。\n\
    \n如果加权之和等于零，则添加一个偏置（bias）以使输出非零，或者是其他值来缩放系统响应。偏置具有相同的输入，且权重等于 1。这里，加权输入的总和可以在\
    \ 0 到正无穷之间。在这里，为了保持响应在期望值的范围内，会设定一个最大值作为基准，并将加权输入的总和通过激活函数。\n\n激活函数是指用于实现预期输出的传递函数集。有不同类型的激活函数，但主要是线性或非线性函数集。一些常用的激活函数集包括二元（Binary）、线性以及双曲正切（Tan\
    \ hyperbolic sigmoidal）激活函数。让我们详细查看每一种：\n\n#### 二元（Binary）：\n在二元激活函数中，输出为 1 或\
    \ 0。在这里，为了实现这一点，设置了一个阈值。如果加权输入大于阈值，则输出为 1，否则为 0。\n\n#### Sigmoidal 双曲（Sigmoidal\
    \ Hyperbolic）：\nSigmoidal 双曲函数通常表现为“S”型曲线。在这里，双曲正切函数定义为：\n```\nF(x) = 1/(1 + exp(-x))\n\
    ```\n其中 `????` 是参数。\n\n### 人工神经网络的类型：\n存在多种类型的人工神经网络。根据输入模式的分类，人工神经网络（ANN）可以分为不同的类型。这些网络在处理复杂的分类任务时是极其有效的。\n\
    \n#### 反馈（Feedback）：\n在这种 `ANN` 类型中，输出会反馈回网络内部。这种反馈机制用于解决问题。\n\n#### 前馈（Feed-Forward）：\n\
    前馈神经网络由一个输入层、输出层以及至少一个中间层组成。它通过处理输入来识别模式。\n\n![image](img/image199.png)\n\n###\
    \ 前提条件（Prerequisite）：\n在开始之前不需要特定的专业知识。\n\n### 受众（Audience）：\n人工神经网络教程是为初学者和专业人士开发的。##\
    \ 感知机（PERCEPTRONS）\n\n感知机是一种人工神经网络（ANN）类型，如图所示。感知机接收一组输入，计算这些输入的线性组合，如果结果大于某个阈值，则输出\
    \ 1，否则输出-1。\n\n![image](img/image063.png)\n\n––––––\n\n![image](img/scene_break.png)\
    \ \n\n![image](img/image118.png)\n\n其中 `wi` 是实值常数，即权重，决定了 `xi` 的贡献![image](img/image199.png)\n\
    \n注意 `w0` 是一个阈值，必须超过它才能使感知机输出 1。\n\n为了简化符号，我们想象一个额外的常量输入 `x0 = 1`，使得我们可以将不等式写为\
    \ `∑wi xi > w0`，或者以向量形式写作 `w > 0`。\n\n![image](img/image196.png)\n\n––––––\n\n\
    ![image](img/scene_break.png) \n\n学习感知机涉及选择 `w0, ..., wn` 的值。因此，感知机学习中考虑的假设空间\
    \ `H` 是所有实值权重向量。\n\n![image](img/image149.png)\n\n### 感知机的表示能力：\n我们可以将感知机看作实例空间（即点）中的超平面表示。感知机对于位于超平面一侧的实例输出\
    \ 1，对于位于另一侧的实例输出-1，如图所示\n\n![image](img/image199.png)\n\n该决策平面的方程为 `w. x = 0`。当然，某些正样本和负样本无法被任何超平面分开。那些可以分离的被称为线性可分集。\n\
    \n![image](img/image008.png)\n\n––––––\n\n![image](img/scene_break.png) \n\n由双输入感知机表示的决策面。(a)\
    \ 是一组训练样本和一个能够正确分类它们的感知机决策面（直线）。(b) 是一组非线性可分的训练样本（即无法通过任何直线正确分类的样本）。`xl` 和 `x2`\
    \ 是感知机的输入。正样本用“+”表示，负样本用“-”表示。输入被馈到多个单元，这些单元的输出然后输入到第二个、最终的阶段。\n"
- fmt: "\nAlthough we are interested in learning networks of many interconnected units,\
    \ let us begin by understanding how to learn the weights for a single perceptron.\
    \ Here the precise learning problem is to determine a weight vector that causes\
    \ the perceptron to produce the correct `±1` output for each of the given training\
    \ examples.\n\nSeveral algorithms are known to solve this learning problem. Here\
    \ we consider two: the `perceptron rule` and the `delta rule`. These two algorithms\
    \ are guaranteed to converge to somewhat different acceptable hypotheses, under\
    \ somewhat different conditions. They are important to `ANNs` because they provide\
    \ the basis for learning networks of many units.\n\n### The Perceptron Rule\n\n\
    One way to learn an acceptable weight vector is to begin with random weights,\
    \ then iteratively apply the `perceptron` to each training example, modifying\
    \ the `perceptron` weights whenever it misclassifies an example.  This process\
    \ is repeated, iterating through the training examples as many times as needed\
    \ until the perceptron classifies all training examples correctly. Weights are\
    \ modified at each step according to the `perceptron training rule`, which revises\
    \ the weight `wi` associated with input `xi` according to the rule\n\n![image](d2d_images/image182.png)\n\
    \nHere `t` is the target output for the current training example, `o` is the output\
    \ generated by the\n\n![image](d2d_images/image040.png)\n\nperceptron, and `η`\
    \ is a positive constant called the learning rate. The role of the learning rate\
    \ is to moderate the degree to which weights are changed at each step. It is usually\
    \ set to some small value (e.g., `0.1`) and is sometimes made to decay as the\
    \ number of weight-tuning iterations increases.\n\nWhy should this update rule\
    \ converge toward successful weight values? To get an intuitive feel, consider\
    \ some specific cases. Suppose the training example is correctly classified already\
    \ by the\n\n![image](d2d_images/image040.png)\n\nperceptron. In this case, `(t\
    \ - o)` is zero, making `Δ wi` zero, so that no weights are updated. Suppose the\
    \ perceptron outputs a `-1`, when the target output is `+1`. To make the perceptron\
    \ output a `+1` instead of `-1`\n\n in this case, the weights must be altered\
    \ to increase the value of `w. x`. For example, if `xi>0`, then increasing `wi`\
    \ will bring the perceptron closer to correctly classifying this example. Notice\
    \ the training rule will increase `w`, in this case, because `(t - o)`, `η`, and\
    \ `xi` are all positive. For example, if `xi = .8`, `η = 0.1`, `t = 1`, and `o\
    \ = -1`, then the weight update will be\n\n`Δ wi = η (t - o)xi = O.1(1 - (-1))0.8\
    \ = 0.16`. On the other hand, if `t = -1` and `o = 1`, then weights associated\
    \ with positive `xi` will be decreased rather than increased. In fact, the above\
    \ learning procedure can be proven to converge within a finite number of applications\
    \ of the `perceptron training rule` to a weight vector that correctly classifies\
    \ all training examples, provided the training examples are linearly separable\
    \ and provided a sufficiently small `η` is used. If the data are not linearly\
    \ separable, convergence is not assured.\n\n## Gradient Descent and the Delta\
    \ Rule\n\nAlthough the `perceptron rule` finds a successful weight vector when\
    \ the training examples are linearly separable, it can fail to converge if the\
    \ examples are not linearly separable. A second training rule, called the `delta\
    \ rule`, is designed to overcome this difficulty. If the training examples are\
    \ not linearly separable, the `delta rule` converges toward a best-fit approximation\
    \ to the target concept. The key idea behind the `delta rule` is to use `gradient\
    \ descent` to search the hypothesis space of possible weight vectors to find the\
    \ weights that best fit the training examples. This rule is important because\
    \ `gradient descent` provides the basis for the `BACKPROPAGATION` algorithm, which\
    \ can learn networks with many interconnected units. It is also important because\
    \ `gradient descent` can serve as the basis for learning algorithms that must\
    \ search through hypothesis spaces containing many different types of continuously\
    \ parameterized hypotheses.\n\nThe `delta training rule` is best understood by\
    \ considering the task of training an unthresholded perceptron; that is, a linear\
    \ unit for which the output `o` is given by\n\n![image](d2d_images/image174.png)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nThus, a linear unit corresponds\
    \ to the first stage of a perceptron, without the threshold.\n\n![image](d2d_images/image087.png)\n\
    \nIn order to derive a weight learning rule for linear units, let us begin by\
    \ specifying a measure for the training error of a hypothesis (weight vector),\
    \ relative to the training examples. Although there are many ways to define this\
    \ error, one common measure that will turn out to be especially convenient is\
    \ where `D` is the set of training examples, `td` is the target output for training\
    \ example `d`, and `od` is the output of the linear unit for training example\
    \ `d`. By this definition, `E (w)` is simply half the squared\n\n![image](d2d_images/image040.png)\n\
    \n![image](d2d_images/image106.png)\n\ndifference between the target output `td`\
    \ and the hear unit output `od`, summed over all training examples. Here we characterize\
    \ `E` as a function of `(w)`, because the linear unit output `o` depends on this\
    \ weight vector. Of course `E` also depends on the particular set of training\
    \ examples, but we assume these are fixed during training, so we do not bother\
    \ to write `E` as an explicit function of these. In particular, there we show\
    \ that under certain conditions the hypothesis that minimizes `E` is also the\
    \ most probable hypothesis in `H` given the training data.\n\n## Multi-layer Perceptron\n\
    \n![image](d2d_images/image168.jpg)\n\nMulti-layer Perceptron (MLP) is a supervised\
    \ learning algorithm that learns a function `f(⋅):R^m→R^o` by training on a dataset,\
    \ where `m` is the number of dimensions for input and `o` is the number of dimensions\
    \ for output. Given a set of features `X=x¹,x²,...,x^m` and a target `y`, it can\
    \ learn a non- linear function approximator for either classification or regression.\
    \ It is different from logistic regression, in that between the input and the\
    \ output layer, there can be one or more non-linear layers, called hidden layers.\
    \ Figure shows one hidden layer MLP with scalar output.\n\nThe leftmost layer,\
    \ known as the input layer, consists of a set of neurons `{xi|x1,x2,...,xm}` representing\
    \ the input features. Each neuron in the hidden layer transforms the values from\
    \ the previous layer with a weighted linear summation `w1x1+w2x2+...+wmxm`, followed\
    \ by a non-linear activation function `g(⋅):R→R` - like the hyperbolic tan function.\
    \ The output layer receives the values from the last hidden layer and transforms\
    \ them into output values.\n\nThe module contains the public attributes `coefs_`\
    \ and `intercepts_`. `coefs_` is a list of weight matrices, where weight matrix\
    \ at index `i` represents the weights between layer `i` and layer `i+1`. `intercepts_`\
    \ is a list of bias vectors, where the vector at index `i` represents the bias\
    \ values added to layer i+1.\n\nThe advantages of Multi-layer Perceptron are:\n\
    \n- Capability to learn non-linear models.\n- Capability to learn models in real-time\
    \ (on-line learning) using `partial_fit`. The disadvantages of Multi-layer Perceptron\
    \ (MLP) include:\n\n- MLP with hidden layers have a non-convex loss function where\
    \ there exists more than one local minimum. Therefore different random weight\
    \ initializations can lead to different validation accuracy.\n- MLP requires tuning\
    \ a number of hyperparameters such as the number of hidden neurons, layers, and\
    \ iterations.\n- MLP is sensitive to feature scaling.\n\n![image](d2d_images/image040.png)\n\
    \n## Support Vector Machines\n\n![image](d2d_images/image070.png)\n"
