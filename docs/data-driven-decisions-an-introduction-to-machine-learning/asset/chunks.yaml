    \ variable is used to predict the value of a numerical dependent variable, then\
    \ such a Linear Regression algorithm is called Simple Linear Regression.\n\n-\
    \ **Multiple Linear regression**:\nIf more than one independent variable is used\
    \ to predict the value of a numerical dependent variable, then such a Linear Regression\
    \ algorithm is called Multiple Linear Regression.\n\n## Linear Regression Line\n\
    \nA linear line showing the relationship between the dependent and independent\
    \ variables is called a regression line. A regression line can show two types\
    \ of relationship:\n\n### Positive Linear Relationship:\nIf the dependent variable\
    \ increases on the Y-axis and independent variable increases on X-axis, then such\
    \ a relationship is termed as a Positive linear relationship.\n\n![image](d2d_images/image199.png)\n\
    ![image](d2d_images/image158.png)\n\n### Negative Linear Relationship:\nIf the\
    \ dependent variable decreases on the Y-axis and independent variable increases\
    \ on the X-axis, then such a relationship is called a negative linear relationship.\n\
    \n![image](d2d_images/image146.png)\n\n––––––––\n![image](d2d_images/scene_break.png)\
    \ \n\n# Finding the best fit line\n\nWhen working with linear regression, our\
    \ main goal is to find the best fit line that means the error between predicted\
    \ values and actual values should be minimized. The best fit line will have the\
    \ least error.\n\nThe different values for weights or the coefficient of lines\
    \ (`a0`, `a1`) gives a different line of regression, so we need to calculate the\
    \ best values for `a0` and `a1` to find the best fit line, so to calculate this\
    \ we use cost function.\n\n## Cost function\n\n- The different values for weights\
    \ or coefficient of lines (`a0`, `a1`) gives the different line of regression,\
    \ and the cost function is used to estimate the values of the coefficient for\
    \ the best fit line.\n- Cost function optimizes the regression coefficients or\
    \ weights. It measures how a linear regression model is performing.\n- We can\
    \ use the cost function to find the accuracy of the mapping function, which maps\
    \ the input variable to the output variable. This mapping function is also known\
    \ as Hypothesis function.\n\nFor Linear Regression, we use the Mean Squared Error\
    \ (MSE) cost function, which is the average of squared error occurred between\
