    In the previous topic, we have learned about Simple Linear Regression, where a
    single Independent/Predictor(`X`) variable is used to model the response variable
    (`Y`). But there may be various cases in which the response variable is affected
    by more than one predictor variable; for such cases, the Multiple Linear Regression
    algorithm is used.


    Moreover, Multiple Linear Regression is an extension of Simple Linear regression
    as it takes more than one predictor variable to predict the response variable.


    We can define it as:


    “Multiple Linear Regression is one of the important regression algorithms which
    models the linear relationship between a single dependent continuous variable
    and more than one independent variable.”


    ### Example

    Prediction of CO2 emission based on engine size and number of cylinders in a car.


    ### Key points about MLR:

    - For MLR, the dependent or target variable(`Y`) must be the continuous/real,
    but the predictor or independent variable may be of continuous or categorical
    form.

    - Each feature variable must model the linear relationship with the dependent
    variable.

    - MLR tries to fit a regression line through a multidimensional space of data-points.


    ### MLR equation:

    In Multiple Linear Regression, the target variable(`Y`) is a linear combination
    of multiple predictor variables `x1`, `x2`, `x3`, ..., `xn`. Since it is an enhancement
    of Simple Linear Regression, so the same is applied for the multiple linear regression
    equation, the equation becomes:


    `Y= b<sub>0</sub>+b<sub>1</sub>x<sub>1</sub>+ b<sub>2</sub>x<sub>2</sub>+ b<sub>3</sub>x+......
    bnxn (a)`


    Where:

    - `Y`= Output/Response variable

    - `b0`, `b1`, `b2`, `b3`, `bn`= Coefficients of the model.

    - `x1`, `x2`, `x3`, `x4`= Various Independent/feature variable


    ### Assumptions for Multiple Linear Regression:

    - A linear relationship should exist between the Target and predictor variables.

    - The regression residuals must be normally distributed.

    - MLR assumes little or no multicollinearity (correlation between the independent
    variable) in data.


    # Neural Networks (ANN - Artificial Neural Network)


    ## Introduction

    The term "Artificial Neural Network" is derived from Biological neural networks
    that develop the structure of a human brain. Similar to the human brain that has
    neurons interconnected to one another, artificial neural networks also have neurons
    that are interconnected to one another in various layers of the networks. These
    neurons are known as nodes.


    ![image](d2d_images/image199.png)


    ![image](d2d_images/image169.jpg)


    ![image](d2d_images/image013.png) The given figure illustrates the typical diagram
    of Biological Neural Network. The typical Artificial Neural Network looks something
    like the given figure.


    Dendrites from Biological Neural Network represent inputs in Artificial Neural
    Networks, cell nucleus represents Nodes, synapse represents Weights, and Axon
    represents Output.


    ### Relationship between Biological neural network and artificial neural network:


    | Biological Neural Network | Artificial Neural Network |

    | --- | --- |

    | Dendrites | Inputs |

    | Cell nucleus | Nodes |

    | Synapse | Weights |

    | Axon | Output |


    An Artificial Neural Network in the field of Artificial intelligence where it
    attempts to mimic the network of neurons makes up a human brain so that computers
    will have an option to understand things and make decisions in a human-like manner.
    The artificial neural network is designed by programming computers to behave simply
    like interconnected brain cells.


    There are around 1000 billion neurons in the human brain. Each neuron has an association
    point somewhere in the range of 1,000 and 100,000. In the human brain, data is
    stored in such manner as to be distributed, and we can extract more than one piece
    of this data when necessary from our memory parallelly. We can say that the human
    brain is made up of incredibly amazing parallel processors.


    ![image](d2d_images/image199.png)


    ![image](d2d_images/scene_break.png)


    We can understand the artificial neural network with an example, consider an example
    of a digital logic gate that takes an input and gives an output. "OR" gate, which
    takes two inputs. If one or both the inputs are "On," then we get "On" in output.
    If both the inputs are "Off," then we get "Off" in output. Here the output depends
    upon input. Our brain does not perform the same task. The outputs to inputs relationship
    keep changing because of the neurons in our brain, which are "learning."


    ## The architecture of an artificial neural network:


    ![image](d2d_images/image093.png)


    ![image](d2d_images/scene_break.png)


    ### Input Layer:

    As the name suggests, it accepts inputs in several different formats provided
    by the programmer.


    ### Hidden Layer:

    The hidden layer presents in-between input and output layers. It performs all
    the calculations to find hidden features and patterns.


    ### Output Layer:

    The input goes through a series of transformations using the hidden layer, which
    finally results in output that is conveyed using this layer.


    The artificial neural network takes input and computes the weighted sum of the
    inputs and includes a bias. This computation is represented in the form of a transfer
    function.


    ![image](d2d_images/image155.png)


    ![image](d2d_images/scene_break.png)


    It determines weighted total is passed as an input to an activation function to
    produce the output. Activation functions choose whether a node should fire or
    not. Only those who are fired make to the output layer.


    ### Advantages of Artificial Neural Network (ANN)

    - **Parallel processing capability**: Artificial neural networks have a numerical
    value that can perform more than one task simultaneously.

    - **Storing data on the entire network**: Data that is used in traditional programming
    is stored on the whole network, not on a database. The disappearance of a couple
    of data in one place doesn''t prevent the network from working.

    - **Capability to work with incomplete knowledge**: After ANN training, the information
    may produce output even with inadequate data. The loss of ![image](d2d_images/image199.png)
    performance here relies upon the significance of missing data.

    - **Having a memory distribution**: For ANN is be able to adapt, it is important
    to determine the examples and to encourage the network according to the desired
    output. The succession of the network is directly proportional to the chosen instances,
    and if the event can''t appear to the network in all its aspects, it can produce
    false output.

    - **Having fault tolerance**: Extortion of one or more cells of ANN does not prohibit
    it from generating output, and this feature makes the network fault-tolerance.


    ### Disadvantages of Artificial Neural Network

    - **Assurance of proper network structure**: There is no particular guideline
    for determining the structure of artificial neural networks. The appropriate network
    structure is accomplished through experience, trial, and error.

    - **Unrecognized behavior of the network**: It is the most significant issue of
    ANN. When ANN produces a testing solution, it does not provide insight concerning
    why and how. It decreases trust in the network.

    - **Hardware dependence**: Artificial neural networks need processors with parallel
    processing power, as per their structure. Therefore, the realization of the equipment
    is dependent.

    - **Difficulty of showing the issue to the network**: ANNs can work with numerical
    data. Problems must be converted into numerical values before being introduced
    to ANN. The presentation mechanism to be resolved here will directly impact the
    performance of the network. It relies on the user''s abilities.

    - **The duration of the network is unknown**.

