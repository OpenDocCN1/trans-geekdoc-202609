    As was mentioned above, computing the distances between all pairs of points is
    very computationally expensive. Fortunately, as with many problems in computer
    science, designing an efficient data structure can reduce the computational overhead
    a lot. For the problem of finding nearest neighbours the data structure of choice
    is the KD-Tree. It has been around since the late 1970s, when it was devised by
    Friedman and Bentley, and it reduces the cost of finding a nearest neighbour to
    O(log N) for O(N) storage. The construction of the tree is O(N log² N), with much
    of the computational cost being in the computation of the median, which with a
    naïve algorithm requires a sort and is therefore O(N log N), or can be computed
