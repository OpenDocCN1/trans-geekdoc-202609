    # 示例：假设有一家营销公司 A，每年都会投放各种广告并以此获得销售。以下列表显示了公司过去 5 年内投放的广告以及相应的销售额：


    ![image](img/image199.png)

    ![image](img/image197.jpg)


    现在，公司想在 2019 年投入 200 美元的广告，并想知道今年销售额的预测。因此，为了解决机器学习中的此类预测问题，我们需要回归分析。


    回归是一种监督学习技术，有助于找到变量之间的相关性，并使我们能够根据一个或多个预测变量来预测连续输出变量。它主要用于预测、预测、时间序列建模以及确定变量之间的因果关系。


    在回归中，我们在变量之间绘制一张与给定数据点拟合程度最理想的图表，通过该图表，机器学习模型可以对数据进行预测。简单来说，“回归显示出一条直线或曲线，它穿过目标-预测图上的所有数据点，使得数据点与回归线之间的垂直距离最小。”数据点与直线之间的距离告诉我们模型是否捕捉到了强关系。


    回归的一些示例如下：

    - 使用温度和其他因素预测降雨情况

    - 确定市场趋势

    - 预测由于鲁莽驾驶导致的交通事故


    ## 与回归分析相关的术语：


    -   **因变量 (Dependent Variable)**：回归分析中我们想要预测或理解的主要因素称为因变量。它也被称为目标变量。

    -   **自变量 (Independent Variable)**：影响因变量的因素或用于预测因变量数值的因素称为自变量，也称为预测变量。

    -   **离群值 (Outliers)**：离群值是指与其他观测值相比，包含极低值或极高值的观测值。离群值可能会干扰结果，因此应该避免。

    -   **多重共线性 (Multicollinearity)**：如果自变量彼此之间的相关性高于与其他变量，则这种状态被称为多重共线性。它不应该出现在数据集中，因为它在排名最影响的变量时会产生问题。

    -   **欠拟合与过拟合 (Underfitting and Overfitting)**：如果我们的算法在训练数据集上运行良好，但在测试数据集上表现不好，则这种问题被称为过拟合。如果我们的算法即使在训练数据集上表现也不良好，则这种问题被称为欠拟合。


    ![image## 为什么我们使用回归分析？如上所述，回归分析有助于预测连续变量。现实世界中有许多场景需要对未来进行预测，例如天气状况、销售预测、营销趋势等，对于这些情况，我们需要某种能够更准确进行预测的技术。因此，对于这种情况，我们需要回归分析，这是一种用于机器学习和数据科学的统计方法。以下是使用回归分析的其他原因：-
    回归估计了目标变量与自变量之间的关系。- 它被用于发现数据中的趋势。- 它有助于预测真实/连续值。- 通过执行回归，我们可以有信地确定最重要的因素、最不重要的因素，以及每个因素如何影响其他因素。##
    回归的类型数据科学和机器学习使用了多种类型的回归。每种类型在不同场景下都有其重要性，但从核心上，所有的回归方法都分析自变量对因变量的影响。这里我们讨论下面的一些重要的回归类型：###
    线性回归- 逻辑回归### 多项式回归- 支持向量回归### 决策树回归- 随机森林回归### 岭回归- Lasso 回归![image](img/image086.jpg)


    ––––––––


    ![image](img/scene_break.png)


    ## 线性回归：


    - 线性回归是一种用于预测分析的统计回归方法。

    - 它是非常简单易懂的算法之一，基于回归并显示连续变量之间的关系。

    - 它用于解决机器学习中的回归问题。

    - 线性回归显示了自变量（`X-axis`）与因变量（`Y-axis`）之间的线性关系，因此被称为线性回归。


    ![image](img/image199.png)


    - 如果只有一个输入变量（`x`），这种线性回归被称为简单线性回归。如果有多个输入变量，则这种线性回归被称为多元线性回归。

    - 线性回归模型中变量之间的关系可以通过下面的图片来解释。在这里我们根据工作年限预测员工的工资。


    ![image](img/image015.png)


    ––––––––


    ![image](img/scene_break.png)


    以下是线性回归的数学方程：


    ```

    Y= aX+b

    ```


    这里，`Y` = 因变量（目标变量），`X`= 自变量（预测变量），`a` 和 `b` 是线性系数。


    线性回归的一些流行应用是：

    - 分析趋势和销售估算

    - 工资预测

    - 房地产预测

    - 交通中的预计到达时间 (ETAs)


    ## 逻辑回归 (Logistic Regression)：


    - 逻辑回归是另一种用于解决分类问题的监督学习算法。在分类问题中，我们的因变量是二值或离散格式的，例如 `0` 或 `1`。

    - 逻辑回归算法适用于类别类型变量，如 `0` 或 `1`、`Yes` 或 `No`、`True` 或 `False`、`Spam` 或非垃圾邮件等。

    - 它是一种基于概率概念的预测分析算法。

    - 逻辑回归是回归的一种，但在使用上与线性回归算法有所不同。


    ![image](img/image004.png)

    ![image](img/image143.png)


    逻辑回归使用 sigmoid 函数或逻辑函数，这是一种复杂的代价函数。这种 sigmoid 函数用于逻辑回归的建模。该函数可以表示：

    - `f(x)`= 输出在 0 到 1 之间的值

    - `x`= 函数输入

    - `e`= 自然对数的底


    当我们向函数提供输入值（数据）时，它会产生如下的 型曲线：


    ![image](img/image034.png)


    - 它使用了阈值概念，高于阈值的值向上取值为 `1`，低于阈值的值向上取值为 `0`。


    逻辑回归有三种类型：

    - 二分类（`0/1`、`pass/fail`）

    - 多分类（猫、狗、狮）

    - 序数分类（低、中、高）


    ## 机器学习中的线性回归


    线性回归是最简单且流行的机器学习算法之一。它是一种用于预测分析的统计方法。线性回归对连续/真实或数值变量进行预测，例如销售、工资、年龄、产品价格等。


    线性回归算法显示了因变量（`y`）与一个或多个自变量（`y`）之间的线性关系，因此被称为线性回归。由于线性回归显示了线性关系，这意味着它找到了因变量的值是如何随着自变量的值而变化的。


    线性回归模型提供了一条倾斜的直线表示变量之间的关系。请看下面的图片：


    ![image](img/image199.png)

    ![image](img/image135.png)


