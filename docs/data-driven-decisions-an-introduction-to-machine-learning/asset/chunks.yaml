  trans: "\n在数学上，我们可以将线性回归表示为：\n\n`y= a0+a1x+ ε`\n\n这里，\n\n- `Y`= 因变量（目标变量）\n- `X`=\
    \ 自变量（预测变量）\n- `a0`= 直线的截距（提供了额外的自由度）\n- `a1` = 线性回归系数（对每个输入值的缩放因子）。`ε` = 随机误差\n\
    \n`x` 和 `y` 变量的值是线性回归模型表示的训练数据集。\n\n# 线性回归的类型\n\n线性回归算法可以进一步分为两种：\n\n- **简单线性回归\
    \ (Simple Linear Regression)**：\n如果使用单个自变量来预测数值因变量的值，则这种线性回归算法被称为简单线性回归。\n\n-\
    \ **多元线性回归 (Multiple Linear regression)**：\n如果使用多个自变量来预测数值因变量的值，则这种线性回归算法被称为多元线性回归。\n\
    \n## 回归线\n\n显示因变量和自变量之间关系的直线被称为回归线。回归线可以显示两种类型的关系：\n\n### 正线性关系：\n如果因变量在 Y 轴上增加，而自变量在\
    \ X 轴上增加，则这种关系被称为正线性关系。\n\n![image](img/image199.png)\n![image](img/image158.png)\n\
    \n### 负线性关系：\n如果因变量在 Y 轴上减少，而自变量在 X 轴上增加，则这种关系被称为负线性关系。\n\n![image](img/image146.png)\n\
    \n––––––––\n![image](img/scene_break.png) \n\n# 寻找最佳拟合线\n\n在使用线性回归时，我们的主要目标是找到最佳拟合线，这意味着预测值与实际值之间的误差应该最小。最佳拟合线将具有最小的误差。\n\
    \n权重或直线系数（`a0`, `a1`）的不同值产生不同的回归线，因此我们需要计算 `a0` 和 `a1` 的最佳值以找到最佳拟合线，为了计算这一点，我们使用代价函数。\n\
    \n## 代价函数\n\n- 权重或直线系数（`a0`, `a1`）的不同值产生不同的回归线，代价函数用于估计最佳拟合线的系数值。\n- 代价函数优化回归系数或权重。它衡量了线性回归模型的性能。\n\
    - 我们可以使用代价函数来寻找输入变量映射到输出变量的映射函数的准确性。该映射函数称为假设函数（Hypothesis function）。\n\n对于线性回归，我们使用均方误差\
    \ (MSE) 代价函数，它是预测值与实际值之间产生的平方误差的平均值。它可以写为：\n\n![image](img/image199.png)\n\n对于上面的线性方程，MSE\
    \ 可以计算为：\n\n![image](img/image038.png)\n\n––––––––\n![image](img/scene_break.png)\
    \ \n![image](img/image199.png)\n\n其中，\n\n––––––––\n![image](img/scene_break.png)\
    \ \n\n`N`= 总观测数，`Yi` = 实际值\n`(a1xi+a0)`= 预测值。\n\n**残差 (Residuals)**：实际值与预测值之间的距离被称为残差。如果观测点远离回归线，则残差将很高，代价函数也会很高。如果散点接近回归线，则残差将很小，因此代价函数也很小。\n\
    \n## 梯度下降\n\n- 梯度下降用于通过计算代价函数的梯度来最小化 MSE。\n- 回归模型使用梯度下降通过减少代价函数来更新直线的系数。\n- 它通过随机选择系数值然后迭代更新这些值以达到最小代价函数。\n\
    \n# 模型性能\n\n拟合优度（Goodness of fit）决定了回归线与一组观测值的拟程度。从各种模型中寻找最佳模型的过程被称为优化。可以通过以下方法实现：\n\
    \n1. **R 方方法 (R-squared method)**：\n    - R 方是一种用于确定拟合优度的统计学方法。\n    - 它在 0-100%\
    \ 的量程上衡量因变量和自变量之间关系的强度。\n    - R 方值的值越高，决定预测值与实际值之间的差异越小，因此代表一个良好的模型。\n    - 它也被称为判定系数，或多元回归中的多元判定系数。\n\
    \    - 它可以通过以下公式计算：\n\n![image](img/image103.png)\n\n# 线性回归的假设\n\n以下是线性回归的一些重要假设。这些是在构建线性回归模型时的一些正式检查，确保从给定的数据集中获得可能的结果。\n\
    \n- **特征与目标之间存在线性关系**：\n线性回归假设因变量和自变量之间存在线性关系。\n- **特征之间存在较小或无共线性**：\n共线性意味着自变量之间存在高相关性。由于共线性，可能很难找到预测变量和目标变量之间的真实关系。或者说，很难确定哪个预测变量影响了目标变量而哪个没有。因此，模型假设特征或自变量之间的共线性很小或完全没有。\n\
    - **同方差假设 (Homoscedasticity Assumption)**：\n同方差是指误差项对于所有自变量的值都是相同的情况。在同方差的情况下，散点图中不应有明显的模式分布。\n\
    - **误差项的正态分布**：\n线性回归假设误差项服从正态分布。如果误差项不是正态分布，则信区间将变得太宽或太窄，从而导致系数系数困难。可以通过 q-q\
    \ 图进行检查。如果图显示为没有偏离的直线，则意味着误差是正态分布的。\n- **无自相关**：\n线性回归模型假设误差项不存在自相关。如果误差项存在任何相关性，将大幅降低模型的准确性。自相关通常发生在残差之间存在依赖关系时。\n\
    \n# 机器学习中的简单线性回归\n\n简单线性回归是一种对因变量与单个自变量之间关系的回归算法。简单线性回归模型显示的关系是线性或倾斜直线，因此被称为简单线性回归。\n\
    \n简单线性回归的关键点是因变量必须是连续值。然而，自变量可以是连续值或分类值。简单线性回归算法主要有两个目标：\n\n- 建立两个变量之间的关系。例如收入与支出、经验与薪水等。\n\
    - 预测新的观测值。例如根据温度预测天气、根据年度投资预测公司收入等。\n\n## 多元线性回归\n\n"
