  trans: "\n如果我们能让 `L` 足够大，只需随机生成包含 $-1$ 和 $+1$ 的代码矩阵即可，这样运行良好良好；但如果我们想保持低数值的 `L`，就需要优化\
    \ `W`。方法是预先设置 `L`，然后找到一个 `W`，使得行之间的距离以及同时列之间的距离在汉明距离上尽可能大。对于 `K` 个类，有 $2^{((K\\\
    -1)) − 1}$ 种可能的列，即二分类问题。这是因为 `K` 位比特可以用 $2^K$ 种不同的方式和互补形式表示（例如，从我们的角度来看，“0101”和“1010”定义了相同的判别器），将可能的组合除以\
    \ 2 再减去 1，因为全为 0 的列（或全为 1）是没用的。例如，当 `K=4` 时，我们有\n\n![image](img/image91.png)\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n当 `K` 很大时，对于给定的值 `L`，我们寻找 $2^{((K\\\
    -1))−1}$ 个列。我们希望这些 `W` 的列尽可能不同，以便基础学习器学习的任务尽可能不同。同时，我们希望 `W` 的行也尽可能不同，以便在一个或多个基础学习器失败时具有最大的纠错能力。ECOC\
    \ 可以写成一种投票方案，其中 `W` 的元素被视为权重：\n\n![image](img/image040.png)\n\n![image](img/image160.png)\n\
    \n![image](img/image188.png)\n\n然后我们选择最高的 `yi`。通过取加权和并选择最大值，允许 `dj` 不再仅仅是二值化的，而是\
    \ $-1$ 到 $+1$ 之间的值，携带的是软性确定而非硬性决策。注意，0 到 1 之间的值 `pj`（例如后验概率）可以转换为 $-1$ 到 $+1$\
    \ 之间的值。ECOC 的一个问题是，由于代码矩阵 `W` 是预设的，由 `W` 定义的子任务将是简单的。\n\n## 自助聚合 (Bagging)\n\n\
    自助聚合（Bootstrap aggregating，通常称为 bagging）涉及对集成中的每个模型进行等权投票。为了促进模型方差，bagging 使用训练集的随机抽取子集来训练集成中的每个模型。例如，[随机森林](https://en.wikipedia.org/wiki/Random_forest)\
    \ 算法将决策树与 bagging 结合，以实现非常高的分类准确率。\n\n组合分类器的简单方法被称为 bagging，它是自助聚合的统计描述。如果你知道什么是自助，这种方法很好；但如果你不知道，它毫无用处。自助样本是从原始集中有放地抽取的，这样我们可能会多次获得某些数据，而另一些完全没有。自助样本与原始数据集的大小相同，并且提取了大量的此类样本：`B`，至少为\
    \ 50，甚至可以是数千。bootstrap 这个词在计算机科学中比其他任何地方都流行，因为还有自助加载器，它是计算机启动时运行的第一个程序。它源于一个荒谬的想法“通过鞋带提自己”（picking\
    \ yourself up by your bootstraps），意思是通过鞋带把自己提起来，意指从零开始。\n\n自助采样似乎是一件非常奇怪的事情。我们取了一个完美的数据集，通过对其采样把它搞砸了，如果我们能做一个较小的数据集（那样会更快），但我们仍然得到了一个相同大小的数据集。糟糕的是，我们做了很多次。这显然是在浪费计算机时间而没有任何收获。它的用处是我们将获得许多表现略有不同的学习器，这正是集成方法所需要的。另一个好处是，不需要复杂的分析工作，通过投入计算资源就可以估计分类函数的精度（从技术上讲，bagging\
    \ 是一种降低方差算法；当我们讨论偏差和方差时，这一点会变得更加清晰）。获得自助样本后，bagging 方法只需要对每个数据集拟合一个模型，然后通过所有分类器的多数投票将它们结合。接下来展示一个\
    \ NumPy 实现，然后看一个简单的示例。\n\n### 计算自助样本\n\n```python\nsamplePoints = np.random.randint(0,nPoints,(nPoints,nSamples))\n\
    classifiers = []\n\nfor i in range(nSamples):\n    sample = []\n    sampleTarget\
    \ = []\n    for j in range(nPoints):\n        sample.append(data[samplePoints[j,i]])\n\
    \        sampleTarget.append(targets[samplePoints[j,i]])\n```\n\n![image](img/image040.png)\n\
    \n### 训练分类器\n\n```python\nclassifiers.append(self.tree.make_tree(sample,sampleTarget,features))\n\
    ```\n\n该示例采用了用于演示决策树的派对数据，并将树限制为决策子树（stumps），以便它们仅根据单个变量进行分类。\n\n![image](img/image072.png)\n\
    \n当我们想要构建决策树来决定晚上做什么时，我们首先列出我们过去几天所做的事情，以获得一个合适的数据集（这里是最后十天）：\n\n使用整个数据集的决策树输出并不意外：它取了最大的两个类并将它们分离开。然而，仅使用决策子树和\
    \ 20 个样本，bagging 就能完美地分离数据，如输出所示：\n\n![image](img/image065.jpg)\n\n## 随机森林 (RANDOM\
    \ FORESTS)\n\n随机森林是一种集成学习方法，其中构建了多个决策树，然后将它们合并以获得更准确的预测。\n\n如果机器学习中有一种在过去几年里日益流行的方法，那就是随机森林的想法。这个概念出现的时间比那更早，许多人发明了变体，但与其关联最紧密的名字是\
    \ Breiman，他在第 2 单元也描述了 CART 算法。图 3：带有多数投票的随机森林\n\n![image](img/image040.png)\n\
    \n![image](img/image116.jpg)\n\n这种想法在基本上是因为如果一棵树是好的，那么许多树（森林）应该更好，只要它们之间有足够的差异。随机森林最有趣的地方在于它从标准数据集创建随机性的方式。它使用的第一个方法是我们刚刚看到的：bagging。如果我们想创建一个森林，可以通过在略有不同的数据上训练来使其不同，因此我们对数据集进行自助样本。然而，这还不够。另一个明显的添加随机性的地方是限制决策树可以做的选择。在每个节点，都会给树一个随机特征子集，树只能从该子集中选择，而不是整个集合。\n\
    \n除了增加树训练的随机性外，它还加快了训练，因为每个阶段搜索的特征更少了。当然，它引入了一个新参数（考虑特征的数量），但随机森林似乎对该参数并不敏感；在实践中，特征数量的平方根子集大小似乎是常见的。这两种随机形式的效果是降低方差而不影响偏差。这种方法的另一个益处是不需要剪枝树。我们还有一个不知道如何选择的参数，即放入森林的树的数量。然而，如果我们想要最优结果，这很容易选择：继续构建树，直到误差停止下降。\n"
- fmt: "\nOnce the set of trees are trained, the output of the forest is the majority\
    \ vote for classification, as with the other committee methods that we have seen,\
    \ or the mean response for regression. And those are pretty much the main features\
    \ needed for creating a random forest. The algorithm is given next before we see\
    \ some results of using the random forest.\n\n# Algorithm\n\nHere is an outline\
    \ of the random forest algorithm.\n\n1. The random forests algorithm generates\
    \ many classification trees. Each tree is generated as follows:\n\n   a) If the\
    \ number of examples in the training set is `N`, take a sample of `N` examples\
    \ at random - but with replacement, from the original data. This sample will be\
    \ the training set for generating the tree.\n\n   b) If there are `M` input variables,\
    \ a number `m` is specified such that at each node, `m` variables are selected\
    \ at random out of the `M` and the best split on these `m` is used to split the\
    \ node.\n\n   ![image](d2d_images/image040.png)\n\n   The value of `m` is held\
    \ constant during the generation of the various trees in the forest.\n\n   c)\
    \ Each tree is grown to the largest extent possible.\n\n2. To classify a new object\
    \ from an input vector, put the input vector down each of the trees in the forest.\
    \ Each tree gives a classification, and we say the tree “votes” for that class.\
    \ The forest chooses the classification.\n\nThe implementation of this is very\
    \ easy: we modify the decision to take an extra parameter, which is `m`, the number\
    \ of features that should be used in the selection set at each stage. We will\
    \ look at an example of using it shortly as a comparison to boosting.\n\nLooking\
    \ at the algorithm you might be able to see that it is a very unusual machine\
    \ learning method because it is embarrassingly parallel: since the trees do not\
    \ depend upon each other, you can both create and get decisions from different\
    \ trees on different individual processors if you have them. This means that the\
    \ random forest can run on as many processors as you have available with nearly\
    \ linear speedup.\n\nThere is one more nice thing to mention about random forests,\
    \ which is that with a little bit of programming effort they come with built-in\
    \ test data: the bootstrap sample will miss out about 35% of the data on average,\
    \ the so-called out-of-bootstrap examples. If we keep track of these datapoints\
    \ then they can be used as novel samples for that particular tree, giving an estimated\
    \ test error that we get without having to use any extra datapoints.\n\nThis avoids\
    \ the need for cross-validation.\n\nAs a brief example of using the random forest,\
    \ we start by demonstrating that the random forest gets the correct results on\
    \ the Party example that has been used in both this and the previous chapters,\
    \ based on 10 trees, each trained on 7 samples, and with just two levels allowed\
    \ in each tree:\n\n![image](d2d_images/image176.jpg)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\nAs a rather more involved example, the car evaluation dataset in the UCI\
    \ Repository contains 1,728 examples aiming to classify whether or not a car is\
    \ a good purchase based on six attributes. The following results compare a single\
    \ decision tree, bagging, and a random forest with 50 trees, each based on 100\
    \ samples, and with a maximum depth of five for each tree. It can be seen that\
    \ the random forest is the most accurate of the three methods.\n\n![image](d2d_images/image040.png)\n\
    \n![image](d2d_images/image096.png)\n\n## Strengths and weaknesses\n\n### Strengths\n\
    \nThe following are some of the important strengths of random forests.\n\n* It\
    \ runs efficiently on large data bases.\n* It can handle thousands of input variables\
    \ without variable deletion.\n* It gives estimates of what variables are important\
    \ in the classification.\n* It has an effective method for estimating missing\
    \ data and maintains accuracy when a large proportion of the data are missing.\n\
    * Generated forests can be saved for future use on other data.\n* Prototypes are\
    \ computed that give information about the relation between the variables and\
    \ the classification.\n* The capabilities of the above can be extended to unlabeled\
    \ data, leading to unsupervised clustering, data views and outlier detection.\n\
    * It offers an experimental method for detecting variable interactions.\n* Random\
    \ forest run times are quite fast, and they are able to deal with unbalanced and\
    \ missing data.\n* They can handle binary features, categorical features, numerical\
    \ features without any need for scaling.\n\n### Weaknesses\n\n* The weakness of\
    \ random forests is that they can be black boxes.\n\n![image](d2d_images/image040.png)\n\
    \n* They can be hard to interpret.\n* They may require large memory.\n\n## Boosting\n\
    \nIn bagging, generating complementary-learners is left to chance. In boosting,\
    \ we actively try to generate complementary-learners by training the next learner\
    \ on mistakes of previous learners. The original algorithm combines weak learners\
    \ to generate a strong learner.\n\n### Original Boosting Concept\n\nGiven a large\
    \ training set, we divide it into three: `X1`, `X2`, and `X3`. We use `X1` to\
    \ train `d1`. We then take `X2` and feed it to `d1`. The instances on which `d1`\
    \ err form the training set of `d2`. We then take `X3` and feed it to `d1` and\
    \ `d2`. The instances on which `d1` and `d2` disagree form the training set of\
    \ `d3`. During testing, given an instance, we give it to `d1` and `d2`; if they\
    \ agree, that is the response, otherwise the response of `d3` is taken.\n\nThe\
    \ error rate can be arbitrarily reduced recursively.\n\n### AdaBoost\n\nFreund\
    \ and Schapire (1996) proposed a variant, named `AdaBoost`, short for adaptive\
    \ boosting, that uses the same training set over and over and thus need not be\
    \ large, but the classifiers should be simple so that they do not than. AdaBoost\
    \ can also combine an arbitrary number of baselearners, not three.\n\n#### AdaBoost\
    \ algorithm\n\n![image](d2d_images/image040.png)\n\n![image](d2d_images/image064.png)\n\
    \n![image](d2d_images/image142.png)\n\nThe idea is to modify the probabilities\
    \ of drawing the instances as a function of the error. Let us say `p^t` denotes\
    \ the probability that the instance pair `(x^t, r^t)` is drawn to train the `jth`\
    \ base-learner.\n\n![image](d2d_images/image165.png)\n\nInitially, all `p^t =\
    \ 1/N`. Then we add new base-learners as follows, starting from `j = 1`: `Є` denotes\
    \ the error rate of `dj`.\n"
