    \ the pixel values as features. Then we use the nearest neighbour algorithm that\
    \ we’ve just seen to identify each face. Even if we ensure that all of the photos\
    \ are taken fully face-on, there are still a few things that will get in the way\
    \ of this method. One is that slight variations in the angle of the head (or the\
    \ camera) could make a difference; another is that different distances between\
    \ the face and the camera (scaling) will change the results; and another is that\
    \ different lighting conditions will make a difference. We can try to fix all\
    \ of these things in preprocessing, but there is also another alternative: use\
    \ a different metric that is invariant to these changes, i.e., it does not vary\
    \ as they do. The idea of invariant metrics is to find measures that ignore changes\
    \ that you don’t want. So if you want to be able to rotate shapes around and still\
    \ recognize them, you need a metric that is invariant to rotation.\n\nA common\
    \ invariant metric in use for images is the tangent distance, which is an approximation\
    \ to the Taylor expansion in first derivatives, and works very well for small\
    \ rotations and scalings; for example, it was used to halve the final error rate\
    \ on nearest neighbor classification of a set of handwritten letters. Invariant\
    \ metrics are an interesting topic for further study, and there is a reference\
    \ for them in the Further Reading section if you are interested.\n\n![image](d2d_images/image040.png)\n\
    \n# Unit IV\n\nReinforcement Learning and Evaluating Hypotheses\n\nIntroduction,\
    \ Learning Task, Q Learning, Non deterministic Rewards and actions, temporal-\
    \ difference learning, Relationship to Dynamic Programming, Active reinforcement\
    \ learning, Generalization in reinforcement learning.\n\nMotivation, Basics of\
    \ Sampling Theory: Error Estimation and Estimating Binomial Proportions, The Binomial\
    \ Distribution, Estimators, Bias, and Variance\n\nReinforcement learning addresses\
    \ the question of how an autonomous agent that senses and acts in its environment\
    \ can learn to choose optimal actions to achieve its goals.\n\n## Introduction\n\
    \n  Consider building a learning robot. The robot, or agent, has a set of sensors\
    \ to observe the state of its environment, and a set of actions it can perform\
    \ to alter this state.\n\n  Its task is to learn a control strategy, or policy,\
    \ for choosing actions that achieve its goals.\n\n  The goals of the agent can\
    \ be defined by a reward function that assigns a numerical value to each distinct\
    \ action the agent may take from each distinct state.\n\n  This reward function\
    \ may be built into the robot, or known only to an external teacher who provides\
    \ the reward value for each action performed by the robot.\n\n  The task of the\
    \ robot is to perform sequences of actions, observe their consequences, and learn\
    \ a control policy.\n\n  The control policy is one that, from any initial state,\
    \ chooses actions that maximize the reward accumulated over time by the agent.\n\
    \n## Example:\n\n  A mobile robot may have sensors such as a camera and sonars,\
    \ and actions such as \"move forward\" and \"turn.\"\n\n  The robot may have\
    \ a goal of docking onto its battery charger whenever its battery level is low.\n\
    \n  The goal of docking to the battery charger can be captured by assigning a\
    \ positive reward (Eg.,\n\n+100) to state-action transitions that immediately\
    \ result in a connection to the charger and a reward of zero to every other state-action\
    \ transition.\n\n## Reinforcement Learning Problem\n\n  An agent interacting\
    \ with its environment. The agent exists in an environment described by some set\
    \ of possible states S.\n\n  Agent perform any of a set of possible actions A.\
    \ Each time it performs an action a, in some state st the agent receives a real-valued\
    \ reward r, that indicates the immediate value of this state-action transition.\
    \ This produces a sequence of states si, actions ai, and immediate rewards ri\
    \ as shown in the figure.\n\n  The agent's task is to learn a control policy,\
    \ \U0001D745: S → A, that maximizes the expected sum of these rewards, with future\
    \ rewards discounted exponentially by their delay.\n\n![image](d2d_images/image040.png)\n\
    \n![image](d2d_images/image152.jpg)\n\n## Reinforcement learning problem characteristics\n\
    \n1.  Delayed reward: The task of the agent is to learn a target function \U0001D70B\
    \ that maps from the current state s to the optimal action a = \U0001D70B (s).\
    \ In reinforcement learning, training information is not available in (s, \U0001D70B\
    \ (s)). Instead, the trainer provides only a sequence of immediate reward values\
    \ as the agent executes its sequence of actions. The agent, therefore, faces the\
    \ problem of temporal credit assignment: determining which of the actions in its\
    \ sequence are to be credited with producing the eventual rewards."
