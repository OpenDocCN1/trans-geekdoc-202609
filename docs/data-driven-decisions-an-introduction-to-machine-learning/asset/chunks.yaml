    Reinforcement learning is the problem of getting an agent to act in the world
    so as to maximize its rewards. A learner (the program) is not told what actions
    to take as in most forms of machine learning, but instead must discover which
    actions yield the most reward by trying them. In the most interesting and challenging
    cases, actions may affect not only the immediate reward but also the next situations
    and, through that, all subsequent rewards.


    ### Example


    Consider teaching a dog a new trick: we cannot tell it what to do, but we can
    reward/punish it if it does the right/wrong thing. It has to find out what it
    did that made it get the reward/punishment. We can use a similar method to train
    computers to do many tasks, such as playing backgammon or chess, scheduling jobs,
    and controlling robot limbs. Reinforcement learning is different from supervised
    learning. Supervised learning is learning from examples provided by a knowledgeable
    expert.


    # Perspectives in Machine Learning


    One useful perspective on machine learning is that it involves searching a very
    large space of possible hypotheses to determine one that best fits the observed
    data and any prior knowledge held by the learner.


    For example, consider the space of hypotheses that could in principle principle
    output by the above checkers learner. This hypothesis space consists of all evaluation
    functions that can be represented by some choice of values for the weights `w0`
    through `w6`. The learner''s task is thus to search through this vast space to
    locate the hypothesis that is most consistent with the available training examples.
    The `LMS` algorithm for fitting weights achieves this goal by iteratively tuning
    the weights, adding a correction to each weight each time the hypothesized evaluation
    function predicts a value that differs from the training value. This algorithm
    works well when the hypothesis representation considered by the learner defines
    a continuously parameterized space of potential hypotheses.


    Many of the chapters in this book present algorithms that search a hypothesis
    space defined by some underlying representation (e.g., linear functions, logical
    descriptions, decision trees, artificial neural networks). These different hypothesis
    representations are appropriate for learning different kinds of target functions.
    For each of these hypothesis representations, the corresponding learning algorithm
    takes advantage of a different underlying structure to organize the search through
    the hypothesis space.


    Throughout this book we will return to this perspective of learning as a search
    problem in order to characterize learning methods by their search strategies and
    by the underlying structure of the search spaces they explore. We will also find
    this viewpoint useful in formally analyzing the relationship between the size
    of the hypothesis space to be searched, the number of training examples available,
    and the confidence we can have that a hypothesis consistent with the training
    data will correctly generalize to unseen examples.


    # Issues in Machine Learning


    Our checkers example raises a number of generic questions about machine learning.
    The field of machine learning, and much of this book, is concerned with answering
    questions such as the following:


    *   What algorithms exist for learning general target functions from specific
    training examples? In what settings will particular algorithms converge to the
    desired function, given sufficient training data? Which algorithms perform best
    for which types of problems and representations?

    *   How much training data is sufficient? What general bounds can be found to
    relate the confidence in learned hypotheses to the amount of training experience
    and the character of the learner''s hypothesis space?

    *   When and how can prior knowledge held by the learner guide the process of
    generalizing from examples? Can prior knowledge be helpful even when it is only
    approximately correct?

    *   What is the best strategy for choosing a useful next training experience,
    and how does the choice of this strategy alter the complexity of the learning
    problem?

    *   What is the best way to reduce the learning task to one or more function approximation
    problems? Put another way, what specific functions should the system attempt to
    learn? Can this process itself be automated?

    *   How can the learner automatically alter its representation to improve its
    ability to represent and learn the target function?


    # Version Spaces


    **Definition (Version space).** A concept is complete if it covers all positive
    examples.


    A concept is consistent if it covers none of the negative examples. The version
    space is the set of all complete and consistent concepts. This set is convex and
    is fully defined by its least and most general elements.


    The key idea in the `CANDIDATE-ELIMINATION` algorithm is to output a description
    of the set of all hypotheses consistent with the training examples.


    ## Representation


    The Candidate – Elimination algorithm finds all describable hypotheses that are
    consistent with the observed training examples. In order to define this algorithm
    precisely, we begin with a few basic definitions. First, let us say that a hypothesis
    is consistent with the training examples if it correctly classifies these examples.


    **Definition:** A hypothesis `h` is consistent with a set of training examples
    `D` if and only if `h(x) = c(x)` for each example `(x, c(x))` in `D`.


    Note difference between definitions of consistent and satisfies


    *   An example `x` is said to satisfy hypothesis `h` when `h(x) = 1`, regardless
    of whether `x` is a positive or negative example of the target concept.

    *   An example `x` is said to consistent with hypothesis `h` iff `h(x) = c(x)`.


    **Definition: version space.** The version space, denoted `V(H, D)` with respect
    to hypothesis space `H` and training examples `D`, is the subset of hypotheses
    from `H` consistent with the training examples.


    ## The LIST-THEN-ELIMINATION algorithm


    The `LIST-THEN-ELIMinate` algorithm first initializes the version space to contain
    all hypotheses in `H` and then eliminates any hypothesis found inconsistent with
    any training example.


    1. `VersionSpace` c list containing every hypothesis in `H`

    2. For each training example, `(x, c(x))` remove from `VersionSpace` any hypothesis
    `h` for which `h(x) ≠ c(x)`

    3. Output the list of hypotheses in `VersionSpace`


    *   `List-Then-Eliminate` works in principle, so long as version space is finite.

    *   However, since it requires exhaustive enumeration of all hypotheses in practice
    it is not feasible.


    ## A More Compact Representation for Version Spaces


    The version space is represented by its most general and least general members.
    These members form general and specific boundary sets that delimit the version
    space within the partially ordered hypothesis space.


    **Definition: The general boundary G,** with respect to hypothesis space `H` and
    training data `D`, is the set of maximally general members of `H` consistent with
    `D`


    `G ≡{g ∈ H | Consistent (g, D) ∧ (¬∃g'' ∈ H)[g'' > g) ∧ Consistent(g'', D)]}`


    `g`


    **Definition: The specific boundary S,** with respect to hypothesis space `H`
    and training data `D`, is the set of minimally general (i.e., maximally specific)
    members of `H` consistent with `D`.

