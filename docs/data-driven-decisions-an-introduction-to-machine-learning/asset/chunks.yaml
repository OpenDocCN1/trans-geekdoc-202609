  trans: "\n似然解（似然性是在给定模型条件下数据的条件概率，而极大似然解是通过改变模型来使该条件概率最大化）。事实上，通常做法是计算对数似然（log likelihood）然后对其进行极大化；由于结果保证为负数，因为概率都小于\
    \ 1，且对数会扩大数值范围，使得优化更加有效。所使用的算法是一种非常通用的算法示例，被称为期望极大化（或更简洁地称为 `EM`）算法。\n\n## 期望极大化\
    \ (EM) 算法\n\n`EM` 算法的基本思想是，有时添加一些实际上未知的额外变量（称为隐藏变量或潜变量），然后在这些变量上对函数进行极大化更容易。这似乎在让问题变得比需要的复杂得多，但事实证明对于许多问题，这会让寻找解决方案变得显著更容易。\n\
    \n为了了解它是如何工作的，我们将考虑高斯混合模型中最简单有趣的情况：仅由两个高斯混合组成的组合。现在的假设是样本自于这些高斯分布。如果选择第一个高斯分布的概率为\
    \ `p`，那么整个模型所示（其中 `N(μ, σ²)` 指定均值为 `μ`、标准差为 `σ` 的高斯分布）：\n\n![image](img/image181.png)\n\
    \n––––––––\n\n![image](img/scene_break.png) \n\n如果 `p` 的概率分布写为 `π`，那么其概率密度为：\n\
    \n![image](img/image000.png)\n\n––––––––\n\n![image](img/scene_break.png) \n\n\
    寻找该问题的极大似然解（实际上是极大对数似然））涉及对所有训练数据计算公式对数的求和并对其进行求导，这会相当困难。幸运的是，有一种绕过它的方法。我们需要的关键洞察是：如果我们知道数据点来自两个高斯分量中的哪，那么计算就会变得简单。每个组件的均值和标准差可以从属于该组件的数据点计算出来，没有任何问题。尽管我们不知道每个数据点来自哪个组件，但我们可以通过引入一个新变量\
    \ `f` 来假装知道。如果 `f` = `0`，则数据来自第一个高斯分布；如果 `f` = `1`，则来自第二个高斯分布。\n\n这是 `EM` 算法的典型初始步骤：添加潜变量。现在我们只需要找出如何对这些变量进行优化。此时，该算法被称为期望极大化的原因就变得清晰了。我们对变量\
    \ `f` 并不了解（这并不意外，因为是我们自己发明的），但我们可以从数据中计算它的期望（即我们“期望”看到的数值，即平均平均值）：\n\n![image](img/image016.png)\n\
    \n––––––––\n\n![image](img/scene_break.png) \n\n其中 `D` 表示数据。注意，由于我们设置了 `f` = `1`，这意味着我们正在选择第二个高斯分布。\n\
    \n![image](img/image040.png)\n\n计算这个期望值被称为 `E-step`。然后是在模型参数（两个高斯分布的参数和混合参数 `π`）上对该估计进行极大化，即\
    \ `M-step`。这需要对每个模型参数对期望求导。这两个步骤不断迭代直到算法收敛。注意，估计值永远不会变小，事实证明 `EM` 算法保证达到局部极大值。为了看到这对于双分量高斯混合模型是什么样的，我们将仔细观察该算法：\n\
    \n![image](img/image198.jpg)\n\n将 `EM` 算法应用于问题的技巧在于识别要包含的正确潜变量，然后简单地执行这些步骤。它们是各种统计学习问题的非常强大的方法。我们现在把注意力转向简单得多的领域，即如何利用附近数据点的信息来决定分类输出。对于这一点，我们完全不使用数据模型，而是直接使用可用数据。\n\
    \n## 信息准则\n\n我们引入了验证集的概念，或者在数据不足时使用交叉验证。然而，用计算时间取代了数据，因为许多模型是在不同的数据集上训练的。\n\n\
    另一种想法是识别某些度量，告诉我们预期该模型表现有多好。这用计算时间取代了数据。概率模型选择（或“信息准则”）为模型之间的评分和选择提供了一种分析技术。通常有两种常用的此类准则：\n\
    \n![image](img/image43.png)\n\n––––––––\n\n![image](img/scene_break.png) \n\n\
    在这些方程中，`k` 是参数数量，`N` 是示例数量，`L` 是模型的似然性。在两种情况下，根据它们的写法，都取的是最大值。\n\n![image](img/image040.png)\n\
    \n## 最近邻域方法\n\n假设你在一家夜店并决定跳舞。你不太可能知道所有的动作，所以你可能会选择离你最近的人并模仿他们。然而，由于大多数离你近的人也不可能知道，你可能会多看几个人。这基本上就是最近邻方法背后的思想：如果我们没有描述数据的模型，那么最好的办法就是查看相似的数据并进行选择。\n\
    \n我们将数据点放置在输入空间内，因此我们只需要找出训练数据中哪些靠近它。这需要计算到训练集中每个数据点的距离，这是相当昂贵的：如果我们处于标准的欧几里得空间中，就必须计算减法和平方运算（我们可以忽略根号，因为我们只想知道哪些点最近，而不是实际距离），并且这必须执行\
    \ `O(N²)` 次。然后我们可以识别出测试点的 `k` 个最近邻居，然后将测试点的类别设置为这些邻居中最常见的类别。`k` 的选择并非易事。设置得太小，方法对噪声很敏感；设置得太大，由于考虑了较远的点，准确率会下降。改变\
    \ `k` 的大小对决策边界的一些可能影响如图 5 所示。\n\n![image](img/image023.jpg)\n\n图 5：最近邻决策边界，左侧：一个邻居，右侧：两个邻居。\n\
    \n这种方法受到维度灾难的影响。首先，如上所示，随着维度的增加，计算成本变得更高。这并没有表面上看起来那么糟糕：有一组方法如 `KD-Trees`（将在后续主题中讨论）可以在\
    \ `O(N log N)` 时间内完成计算。然而，更重要的是，随着维度的增加，到其他数据点的距离往往也会增加。此外，它们在许多不同的方向上可能都很远——某些点在某些维度上相对接近，但在其他维度上很远。处理这些问题的方法被称为自适应最近邻方法，在章节末尾的延伸阅读部分有对它们的引用。\n"
