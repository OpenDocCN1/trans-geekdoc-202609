    \ \n\n## Unsupervised Learning algorithms:\n\nBelow is the list of some popular\
    \ unsupervised learning algorithms:\n\n*   K-means clustering\n\n*   KNN (k-nearest\
    \ neighbors)\n\n*   Hierarchal clustering\n\n*   Anomaly detection\n\n*   Neural\
    \ Networks\n\n*   Principle Component Analysis\n\n*   Independent Component Analysis\n\
    \n*   Apriori algorithm\n\n*   Singular value decomposition\n\n## Advantages of\
    \ Unsupervised Learning\n\n*   Unsupervised learning is used for more complex\
    \ tasks as compared to supervised learning because, in unsupervised learning,\
    \ we don't have labeled input data.\n\n*   Unsupervised learning is preferable\
    \ as it is easy to get unlabeled data in comparison to labeled data.\n\n## Disadvantages\
    \ of Unsupervised Learning\n\n*   Unsupervised learning is intrinsically more\
    \ difficult than supervised learning as it does not have corresponding output.\n\
    \n*   The result of the unsupervised learning algorithm might be less accurate\
    \ as input data is not labeled, and algorithms do not know the exact output in\
    \ advance.\n\n![image](d2d_images/image040.png)\n\n| Supervised Learning || Unsupervised\
    \ Learning |\n\n| --- | --- |\n\n| \n\nSupervised learning algorithms are trained\
    \ using labeled data.\n\n || Unsupervised learning algorithms are trained using\
    \ unlabeled data. |\n\n| \n\nSupervised learning model takes direct feedback to\
    \ check if it is predicting correct output or not.\n\n || \n\nUnsupervised learning\
    \ model does not take any feedback.\n\n |\n\n| \n\nSupervised learning model predicts\
    \ the output.\n\n || \n\nUnsupervised learning model finds the hidden patterns\
    \ in data.\n\n |\n\n| \n\nIn supervised learning, input data is provided to the\
    \ model along with the output.\n\n || In unsupervised learning, only input data\
    \ is provided to the model. |\n\n| \n\nThe goal of supervised learning is to train\
    \ the model so that it can predict the output when it is given new data.\n\n ||\
    \ \n\nThe goal of unsupervised learning is to find the hidden patterns and useful\
    \ insights from the unknown dataset.\n\n |\n\n| \n\nSupervised learning needs\
    \ supervision to train the model.\n\n || \n\nUnsupervised learning does not need\
    \ any supervision to train the model.\n\n |\n\n| \n\nSupervised learning can be\
    \ categorized\n\nin Classification and Regression problems.\n\n || \n\nUnsupervised\
    \ Learning can be classified in Clustering and Associations problems.\n\n |\n\n\
    | \n\nSupervised learning can be used for those cases where we know the input\
    \ as well as corresponding outputs.\n\n || \n\nUnsupervised learning can be used\
    \ for those cases where we have only input data and no corresponding output data.\n\
    \n |\n\n| \n\nSupervised learning model produces an accurate result.\n\n || \n\
    \nUnsupervised learning model may give less accurate result as compared to supervised\
    \ learning.\n\n |\n\n| \n\nSupervised learning is not close to true Artificial\
    \ intelligence as in this, we\n\nfirst train the model for each data, and then\
    \ only it can predict the correct output.\n\n || \n\nUnsupervised learning is\
    \ more close to the true Artificial\n\nIntelligence as it learns similarly as\
    \ a child learns daily routine things by his experiences.\n\n |\n\n| \n\nIt includes\
    \ various algorithms such as Linear Regression, Logistic\n\nRegression, Support\
    \ Vector Machine, Multi-class Classification, Decision tree, Bayesian Logic, etc.\n\
    \n || \n\nIt includes various algorithms such as Clustering, KNN, and Apriori\
    \ algorithm.\n\n |\n\n## K-Mean Clustering\n\nk-means clustering algorithm\n\n\
    One of the most used clustering algorithm is k-means. It allows to group the data\
    \ according to the existing similarities among them in k clusters, given as input\
    \ to the algorithm. I’ll start with a simple example.\n\nLet’s imagine we have\
    \ 5 objects (say 5 people) and for each of them we know two features (height and\
    \ weight). We want to group them into k=2 clusters.\n\nOur dataset will look like\
    \ this:\n\n![image](d2d_images/image040.png)\n\n![image](d2d_images/image061.png)\n\
    \nFirst of all, we have to initialize the value of the centroids for our clusters.\
    \ For instance, let’s choose Person 2 and Person 3 as the two centroids c1 and\
    \ c2, so that c1=(120,32) and c2=(113,33).\n\nNow we compute the euclidian distance\
    \ between each of the two centroids and each point in the data. If you did all\
    \ the calculations, you should have come up with the following numbers:\n\n| \
    \ || \n\nDistance of object from c1\n\n || \n\nDistance of object from c2\n\n\
    \ |\n\n| --- | --- | --- |\n\n| Person 1 || \n\n52.3\n\n || \n\n58.3\n\n |\n\n\
    | Person 2 || \n\n0\n\n || \n\n7.1\n\n |\n\n| Person 3 || \n\n7.1\n\n || \n\n\
    0\n\n |\n\n| Person 4 || \n\n70.4\n\n || \n\n75.4\n\n |\n\n| Person 5 || \n\n\
    13.9\n\n || \n\n9.4\n\n |\n\nAt this point, we will assign each object to the\
    \ cluster it is closer to (that is taking the minimum between the two computed\
    \ distances for each object).\n\nWe can then arrange the points as follows:\n\n\
    Person 1 → cluster 1\n\nPerson 2 → cluster 1\n\nPerson 3 → cluster 2\n\nPerson\
    \ 4 → cluster 1 Person 5→ cluster 2\n\nLet’s iterate, which means to redefine\
    \ the centroids by calculating the mean of the members of each of the two clusters.\n\
    \nSo c’1 \\= ((167+120+175)/3, (55+32+76)/3) = (154, 54.3) and c’2 \\= ((113+108)/2,\
    \ (33+25)/2) = (110.5, 29)\n\nThen, we calculate the distances again and re-assign\
    \ the points to the new centroids.\n\nWe repeat this process until the centroids\
    \ don’t move anymore (or the difference between them is under a certain small\
    \ threshold).\n\nIn our case, the result we get is given in the figure below.\
    \ You can see the two different clusters labelled with two different colours and\
    \ the position of the centroids, given by the crosses.\n\n![image](d2d_images/image040.png)\n\
    \n![image](d2d_images/image167.jpg)\n\n## How to apply k-means?\n\nAs you probably\
    \ already know, I’m using Python libraries to analyze my data. The k-means algorithm\
    \ is implemented in the scikit-learn package. To use it, you will just need the\
    \ following line in your script:\n\n## What if our data is... non-numerical?"
