- fmt: '

    To allow the system to evaluate the fitness of any given program, Koza provided
    a set of 166 training example problems representing a broad variety of initial
    block configurations, including problems of differing degrees of difficulty. The
    fitness of any given program was taken to be the number of these examples solved
    by the algorithm. The population was initialized to a set of 300 random programs.
    After 10 generations, the system discovered the following program, which solves
    all 166 problems.


    ```

    (EQ (DU (MT CS)(NOT CS)) (DU (MS NN)(NOT NN)) )

    ```


    Notice this program contains a sequence of two `DU`, or "Do Until" statements.
    The first repeatedly


    ![image](d2d_images/image040.png)


    moves the current top of the stack onto the table, until the stack becomes empty.
    The second "Do Until" statement then repeatedly moves the next necessary block
    from the table onto the stack. The role played by the top level `EQ` expression
    here is to provide a syntactically legal way to sequence these two "Do Until"
    loops.


    Somewhat surprisingly, after only a few generations, this GP was able to discover
    a program that solves all 166 training problems. Of course the ability of the
    system to accomplish this depends strongly on the primitive arguments and functions
    provided, and on the set of training example cases used to evaluate fitness.


    ## Remarks on Genetic Programming


    As illustrated in the above example, genetic programming extends genetic algorithms
    to the evolution of complete computer programs. Despite the huge size of the hypothesis
    space it must search, genetic programming has been demonstrated to produce intriguing
    results in a number of applications. A comparison of GP to other methods for searching
    through the space of computer programs, such as hillclimbing and simulated annealing,
    is given by O''Reilly and Oppacher (1994).


    While the above example of GP search is fairly simple, Koza et al. (1996) summarize
    the use of a GP in several more complex tasks such as designing electronic filter
    circuits and classifying segments of protein molecules. The filter circuit design
    problem provides an example of a considerably more complex problem. Here, programs
    are evolved that transform a simple fixed seed circuit into a final circuit design.
    The primitive functions used by the GP to construct its programs are functions
    that edit the seed circuit by inserting or deleting circuit components and wiring
    connections. The fitness of each program is calculated by simulating the circuit
    it outputs (using the `SPICE` circuit simulator) to determine how closely this
    circuit meets the design specifications for the desired filter. More precisely,
    the fitness score is the sum of the magnitudes of errors between the desired and
    actual circuit output at 101 different input frequencies. In this case, a population
    of size 640,000 was maintained, with selection producing 10% of the successor
    population, crossover producing 89%, and mutation producing 1%. The system was
    executed on a 64-node parallel processor. Within the first randomly generated
    population, the circuits produced were so unreasonable that the `SPICE` simulator
    could not even simulate the behavior of 98% of the circuits. The percentage of
    unsimulatable circuits dropped to 84.9% following the first generation, to 75.0%
    following the second generation, and to an average of 9.6% over succeeding generations.
    The fitness score of the best circuit in the initial population was 159, compared
    to a score of 39 after 20 generations and a score of 0.8 after 137 generations.
    The best circuit, produced after 137 generations, exhibited performance very similar
    to the desired behavior.


    In most cases, the performance of genetic programming depends crucially on the
    choice of representation and on the choice of fitness function. For this reason,
    an active area of current research is aimed at the automatic discovery and incorporation
    of subroutines that improve on the original set of primitive functions, thereby
    allowing the system to dynamically alter the primitives from which it constructs
    individuals. See, for example, Koza (1994).


    ## Models of Evolution and Learning


    In many natural systems, individual organisms learn to adapt significantly during
    their lifetime. At the same time, biological and social processes allow their
    species to adapt over a time frame of many generations. One interesting question
    regarding evolutionary systems is "What is the relationship between learning during
    the lifetime of a single individual, and the longer time frame species-level learning
    afforded by evolution?"


    ## Lamarckian Evolution


    Larnarck was a scientist who, in the late nineteenth century, proposed that evolution
    over many generations was directly influenced by the experiences of individual
    organisms during their lifetime. In


    ![image](d2d_images/image040.png)


    particular, he proposed that experiences of a single organism directly affected
    the genetic makeup of their offspring: If an individual learned during its lifetime
    to avoid some toxic food, it could pass this trait on genetically to its offspring,
    which therefore would not need to learn the trait. This is an attractive conjecture,
    because it would presumably allow for more efficient evolutionary progress than
    a generate-and-test process (like that of `GAS` and `GPs`) that ignores the experience
    gained during an individual''s lifetime. Despite the attractiveness of this theory,
    current scientific evidence overwhelmingly contradicts Lamarck''s model. The currently
    accepted view is that the genetic makeup of an individual is, in fact, unaffected
    by the lifetime experience of one''s biological parents. Despite this apparent
    biological fact, recent computer studies have shown that Lamarckian processes
    can sometimes improve the effectiveness of computerized genetic algorithms (see
    Grefenstette 1991; Ackley and Littman 1994; and Hart and Belew 1995).


    ## Baldwin Effect


    Although Lamarckian evolution is not an accepted model of biological evolution,
    other mechanisms have been suggested by which individual learning can alter the
    course of evolution. One such mechanism is called the Baldwin effect, after J.
    M. Baldwin (1896), who first suggested the idea. The Baldwin effect is based on
    the following observations:


    - If a species is evolving in a changing environment, there will be evolutionary
    pressure to favor individuals with the capability to learn during their lifetime.
    For example, if a new predator appears in the environment, then individuals capable
    of learning to avoid the predator will be more successful than individuals who
    cannot learn. In effect, the ability to learn allows an individual to perform
    a small local search during its lifetime to maximize its fitness. In contrast,
    nonlearning individuals whose fitness is fully determined by their genetic makeup
    will operate at a relative disadvantage.


    - Those individuals who are able to learn many traits will rely less strongly
    on their genetic code to "hard-wire" traits. As a result, these individuals can
    support a more diverse gene pool, relying on individual learning to overcome the
    "missing" or "not quite optimized" traits in the genetic code. This more diverse
    gene pool can, in turn, support more rapid evolutionary adaptation. Thus, the
    ability of individuals to learn can have an indirect accelerating effect on the
    rate of evolutionary adaptation for the entire population.

