  trans: "\n\n在两点交叉中，通过将一个父代的中间段落替换到另一个父代字符串的中间来创建后代。换句话说，交叉掩码是一个不以零开头的字符串，随后是一段连续的\
    \ `nl` 个 1，最后是完成字符串所需的数量的零。每当应用一次两点交叉算子时，都会通过随机选择整数 `no` 和 `nl` 来生成掩码。\n\n## 适应度函数与选择\n\
    \n适应度函数定义了对潜在假设进行排序的标准，以及按概率选择它们包含在下一代种群中的。如果任务是学习分类规则，那么适应度函数通常包含一个组件，用于对规则在提供的训练示例集上的分类准确率进行评分。通常还可能包含其他标准，例如规则的复杂性或通用性。更广泛地说，当位字符串假设被解释为一个复杂的程序时（例如，当位字符串表示一组将链在一起以控制机器人设备的\
    \ `if-then` 规则时），适应度函数可能会测量生成过程的整体性能，而不是单个规则的性能。\n\n在我们上表 9 所示的原型遗传算法（GA）中，假设被选中的概率由其适应度与其当前种群其他成员适应度的比值给出，如上式所示。这种方法有时被称为适应度成比例选择，或轮盘选择。目前还提出了其他使用适应度选择假设的方法。例如，在锦标赛选择中，首先从当前种群中随机选择两个假设。根据某些预定义的概率\
    \ `p`，选择这两个中适应度较高的一个，并以 `(1 - p)` 的概率选择适应度较低的假设。锦标赛选择通常产生比适应度成比例选择更具化的种群。在另一种名为排序选择的方法中，首先按适应度对当前种群中的假设进行排序。假设被选中的概率与其在该排序列表中的排名成比，而不是与其适应度成比。\n\
    \n![image](img/image040.png)\n\n## 5.3. 示例说明\n\n遗传算法可以视为一种通用的优化方法，它在候选对象的大空间中搜索，寻找根据适应度函数表现最好的对象。虽然不能保证找到最优对象，但\
    \ GAS 往往能够找到具有高适应度的对象。GAS 已应用于机器学习之外的许多优化问题，包括电路布局和车间调度等问题。在机器学习领域，它们已被应用于函数近似问题以及诸如为人工神经网络学习系统选择网络拓扑等任务。\n\
    \n为了说明 GAS 用于概念学习，我们简要总结了 DeJong 等人 (1993) 描述的 GABIL 系统。GABIL 使用遗传算法学习由析取命题规则集表示的布尔概念。在对多个概念学习问题进行实验中，发现\
    \ GABIL 的泛化准确率与决策树学习算法 C4.5 和规则学习系统 AQ14 等学习算法相当。该研究中的学习任务包括用于探索系统泛化准确率的人工学习任务，以及乳腺癌诊断的现实世界问题。\n\
    \nGABIL 中遗传算法的具体实例化可以总结如下：\n\n**表示法。** GABIL 中的每个假设对应于一个析取命题规则集，并按照第 9.2.1 节描述的方式编码。特别是，规则前提的假设空间由对一组固定属性的约束的合取组成，如前一节所述。为了表示一组规则，将单个规则的位字符串表示连接起来。为了说明，考虑一个假设空间，其中规则前提是关于两个布尔属性\
    \ `a1` 和 `a2` 约束的合取。规则后件由一个位描述，指示目标属性 `c` 的预测值。因此，由两个规则组成的假设为：\n\n`IF a1=T and\
    \ a2=F THEN c=T; IF a2=T THEN c=F`\n\n––––––––\n\n![image](img/scene_break.png)\
    \ \n\n```\na1  a2 c  a1 a2 c\n10 01 1  11 01 0\n```\n\n注意位字符串的长度随着假设中规则数量的增加而增长。这种变位字符串长度需要对交叉算子进行修改，如下所示。\n\
    \n**遗传算子。** GABIL 使用上表的标准变异算子，其中随机选择一个位并将其替换为其反数。它使用的交叉算子是对表 9.2 中描述的两点交叉算子的相当标准的扩展。特别是，为了适应编码规则集的变长位字符串，并限制系统仅交叉发生在编码规则的位字符串相似部分之间，采取了以下方法。对两个父代执行交叉操作，首先在第一个父代字符串中随机选择两个交叉点。让\
    \ `dl` (`dz`) 表示这两个交叉点中最左侧（最右侧）到其左侧相邻规则边界的距离。现在随机选择第二个父代的交叉点，条件是它们必须具有相同的 `dl`\
    \ 和 `d2` 值。例如，如果两个父代字符串为：\n\n![image](img/image040.png)\n\n![image](img/image059.png)\n\
    \n并且为第一个父代选择的交叉点是位 1 和 8 之后的点，\n\n![image](img/image073.png)\n\n––––––––\n\n![image](img/scene_break.png)\
    \ \n\n其中 `` 和 `1` 表示交叉点，那么 `dl = 1` 且 `dz = 3`。因此，第二个父代允许的交叉点对包括位 (1,3)、(1,8)\
    \ 和 (6,8)。如果正好选择了 (1,3)，\n\n![image––––––––![image](img/scene_break.png) \n\n\
    那么生成的两个后代将为\n\n![image](img/image050.png)\n\n––––––––\n\n![image](img/scene_break.png)\
    \ \n\n正如示例所示，这种交叉操作允许后代包含与父代数量不同的规则，同时确保以这种方式生成的所有位字符串都代表良好的规则集。\n\n**适应度函数。**\
    \ 每个假设规则集的适应度基于其在训练数据上的分类准确率。特别是，用于测量适应度的函数为：\n\n![image](img/image105.png)\n\n\
    其中 `correct (h)` 是假设 h 正确分类的所有训练示例的百分比。\n\n在将 GABIL 的行为与决策树学习算法（如 C4.5 和 ID5R）以及规则学习算法\
    \ AQ14 进行比较的实验中，在各种学习问题上的测试显示这些系统的性能大致相当。例如，在 12 个合成问题上，GABIL 的平均泛化准确率为 92.1%，而其他系统的性能范围在\
    \ 91.2% 到 96.6% 之间。\n\n"
- fmt: "\nIn one set of experiments they explored the addition of two new genetic\
    \ operators that were motivated by the generalization operators common in many\
    \ symbolic learning methods. The first of these operators, `AddAlternative`, generalizes\
    \ the constraint on a specific attribute by changing a `0` to a `1` in the substring\
    \ corresponding to the attribute. For example, if the constraint on an attribute\
    \ is represented by the string `10010`, this operator might change it to `101\
    \ 10`. This operator was applied with probability `.O1` to selected members of\
    \ the population on each generation. The second operator, `Dropcondition` performs\
    \ a more drastic generalization step, by replacing all bits for a particular attribute\
    \ by a `1`. This operator corresponds to generalizing the rule by completely dropping\
    \ the constraint on the attribute, and was applied on each generation with probability\
    \ `.60`. The authors report this revised system achieved an average performance\
    \ of 95.2% over the above set of synthetic learning tasks, compared to 92.1% for\
    \ the basic `GA` algorithm.\n\nIn the above experiment, the two new operators\
    \ were applied with the same probability to each hypothesis in the population\
    \ on each generation. In a second experiment, the bit-string representation for\
    \ hypotheses was extended to include two bits that determine which of these operators\
    \ may be applied to the hypothesis. In this extended representation, the bit string\
    \ for a typical rule set hypothesis would be\n\n![image](d2d_images/image195.png)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nwhere the final two bits\
    \ indicate in this case that the `AddAlternative` operator may be applied to this\
    \ bit string, but that the `Dropcondition` operator may not. These two new bits\
    \ define part of the search strategy used by the `GA` and are themselves altered\
    \ and evolved using the same crossover and mutation operators that operate on\
    \ other bits in the string. While the authors report mixed results with this approach\
    \ (i.e., improved performance on some problems, decreased performance on others),\
    \ it provides an interesting illustration of how `GAS` might in principle be used\
    \ to evolve their own hypothesis search methods.\n\n## Hypothesis Space Search\n\
    \nAs illustrated above, `GAS` employ a randomized beam search method to seek a\
    \ maximally fit hypothesis. This search is quite different from that of other\
    \ learning methods we have considered in this book. To contrast the hypothesis\
    \ space search of `GAS` with that of neural network `BACKPROPAGATION`, for example,\
    \ the radiant descent search in `BACKPROPAGATION` moves smoothly from one hypothesis\
    \ to a new hypothesis that is very similar. In contrast, the `GA` search can move\
    \ much more abruptly, replacing a parent hypothesis by an offspring that may be\
    \ radically different from the parent. Note the `GA` search is therefore less\
    \ likely to fall into the same kind of local minima that can plague gradient descent\
    \ methods.\n\nOne practical difficulty in some `GA` applications is the problem\
    \ of crowding. Crowding is a phenomenon in which some individual that is more\
    \ highly fit than others in the population quickly reproduces, so that copies\
    \ of this individual and very similar individuals take over a large fraction of\
    \ the population. The negative impact of crowding is that it reduces the diversity\
    \ of the population, thereby slowing further progress by the `GA`. Several strategies\
    \ have been explored for reducing crowding. One approach is to alter the selection\
    \ function, using criteria such as tournament selection or rank selection in place\
    \ of fitness proportionate roulette wheel selection. A related strategy is \"\
    fitness sharing,\" in which the measured fitness of an individual is reduced by\
    \ the presence of other, similar individuals in the population. A third approach\
    \ is to restrict the kinds of individuals allowed to recombine to form offspring.\
    \ For example, by allowing only the most similar individuals to recombine, we\
    \ can encourage\n\n![image](d2d_images/image040.png)\n\nthe formation of clusters\
    \ of similar individuals, or multiple \"subspecies\" within the population. A\
    \ related approach is to spatially distribute individuals and allow only nearby\
    \ individuals to recombine. Many of these techniques are inspired by the analogy\
    \ to biological evolution.\n\n## Population Evolution and the Schema Theorem\n\
    \nIt is interesting to ask whether one can mathematically characterize the evolution\
    \ over time of the population within a `GA`. The schema theorem provides one such\
    \ characterization. It is based on the concept of schemas, or patterns that describe\
    \ sets of bit strings. To be precise, a schema is any string composed of `0`s,\
    \ `1`s, and `*`s. Each schema represents the set of bit strings containing the\
    \ indicated `0`s and `1`s, with each `*` interpreted as a \"don't care.\" For\
    \ example, the schema `0*10` represents the set of bit strings that includes exactly\
    \ `0010` and `01 10`.\n\nAn individual bit string can be viewed as a representative\
    \ of each of the different schemas that it matches. For example, the bit string\
    \ `0010` can be thought of as a representative of `2^4` distinct schemas including\
    \ `00**`, `0*10`, `****`, etc. Similarly, a population of bit strings can be viewed\
    \ in terms of the set of schemas that it represents and the number of individuals\
    \ associated with each of these schema.\n\nThe schema theorem characterizes the\
    \ evolution of the population within a `GA` in terms of the number of instances\
    \ representing each schema. Let `m(s, t)` denote the number of instances of schema\
    \ `s` in the population at time `t` (i.e., during the `t^{th}` generation). The\
    \ schema theorem describes the expected value of `m(s,t+1)` in terms of `m(s,\
    \ t)` and other properties of the schema, population, and `GA` algorithm parameters.\n\
    \nThe evolution of the population in the `GA` depends on the selection step, the\
    \ recombination step, and the mutation step. Let us start by considering just\
    \ the effect of the selection step. Let `f (h)` denote the\n\n...\n\nfitness of\
    \ the individual bit string `h` and `f (t)` denote the average fitness of all\
    \ individuals in the\n\n![image](d2d_images/image128.png)\npopulation at time\
    \ `t`. Let `n` be the total number of individuals. Let `h∈s∩t` indicate\n\n![image](d2d_images/image183.png)\n\
    that the individual `h` is both a representative of schema `s` and a member of\
    \ the population at time `t`. Finally, let `u(s, t)` denote the average fitness\
    \ of instances of schema `s` at time `t`.\n\nWe are interested in calculating\
    \ the expected value of `m(s,t+1)`, which we denote `E[m(s,t+1)]`. We can\n\n\
    calculate `E[m(s,t+1)]` using the probability distribution for selection given\
    \ in Equation, which can be restated using our current terminology as follows\n\
    \n![image](d2d_images/image100.png)\n\nNow if we select one member for the new\
    \ population according to this probability distribution, then the probability\
    \ that we will select a representative of schema `s` is\n\n![image](d2d_images/image151.png)\n\
    \n![image](d2d_images/image040.png)\n\nThe second step above follows from the\
    \ fact that by definition,\n\n![image](d2d_images/image045.png)\n\n––––––––\n\n\
    ![image](d2d_images/scene_break.png) \n\nEquation gives the probability that a\
    \ single hypothesis selected by the `GA` will be an instance of schema\n\n`s`.\
    \ Therefore, the expected number of instances of `s` resulting from the `n` independent\
    \ selection steps that create the entire new generation is just `n` times this\
    \ probability.\n\n![image](d2d_images/image163.png)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\nEquation states that the expected number of instances of schema `s` at generation\
    \ `t+1` is proportional to\n\n∧\n\nthe average fitness `u(s, t)` of instances\
    \ of this schema at time `t`, and inversely proportional to the\n\n...\n\naverage\
    \ fitness `f (t)` of all members of the population at time `t`. Thus, we can expect\
    \ schemas with\n"
