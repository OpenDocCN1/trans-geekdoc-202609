    ## Target Function Representation: `^V = w0 + w1 · x1(b) + w2 · x2(b) + w3 · x3(b)
    + w4 · x4(b) + w5 · x5(b) + w6 · x6(b)`


    The first three items above correspond to the specification of the learning task,
    whereas the final two items constitute design choices for the implementation of
    the learning program.


    ## Choosing an approximation algorithm for the Target Function


    ### Generating training data —


    To train our learning program, we need a set of training data, each describing
    a specific board state `b` and the training value `V_train(b)` for `b`. Each training
    example is an ordered pair `<b,V_train(b)>`.


    For example, a training example may be `<(x1 = 3, x2 = 0, x3 = 1, x4 = 0, x5 =
    0, x6 = 0), +100>`. This is an example where black has won the game since `x2
    = 0` or red has no remaining pieces. However, such clean values of `V_train(b)`
    can be obtained only for board value `b` that are clear win, loss or draw.


    In above case, assigning a training value `V_train(b)` for the specific boards
    `b` that are clean win, loss or draw is direct as they are direct training experience.
    But in the case of indirect training experience, assigning a training value `V_train(b)`
    for the intermediate boards is difficult. In such case, the training values are
    updated using temporal difference learning. Temporal difference (TD) learning
    is a concept central to reinforcement learning, in which learning happens through
    the iterative correction of your estimated returns towards a more accurate target
    return.


    Let `Successor(b)` denotes the next board state following `b` for which it is
    again the program’s turn to move. `^V` is the learner’s current approximation
    to `V`. Using these information, assign the training value of `V_train(b)` for
    any intermediate board state `b` as below:


    `V_train(b) ← ^V(Successor(b))`


    ### Adjusting the weights


    Now its time to define the learning algorithm for choosing the weights and best
    fit the set of training examples. One common approach is to define the best hypothesis
    as that which minimizes the squared error `E` between the training values and
    the values predicted by the hypothesis `^V`.


    ![image](d2d_images/image032.jpg)


    The learning algorithm should incrementally refine weights as more training examples
    become available and it needs to be robust to errors in training data. Least Mean
    Square (LMS) training rule is the one training algorithm that will adjust weights
    a small amount in the direction that reduces the error.


    The LMS algorithm is defined as follows:


    ![image](d2d_images/image199.png)


    ![image](d2d_images/image162.jpg)


    ## Final Design for Checkers Learning system


    The final design of our checkers learning system can be naturally described by
    four distinct program modules that represent the central components in many learning
    systems.


    1. The performance System — Takes a new board as input and outputs a trace of
    the game it played against itself.

    2. The Critic — Takes the trace of a game as an input and outputs a set of training
    examples of the target function.

    3. The Generalizer — Takes training examples as input and outputs a hypothesis
    that is output.

    4. The Experiment Generator — Takes the hypothesis (initial state) as input and
    outputs a new board state.


    ![image](d2d_images/image066.png)


    ## Types of Learning


    In general, machine learning algorithms can be classified into three:

    * Supervised learning

    * Unsupervised learning

    * Reinforcement learning


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) | || | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](d2d_images/chapter_title_above.png)


    # Supervised learning


    ![image](d2d_images/chapter_title_below.png)


    A “supervised learning” is so called because the process of learning from training
    dataset can be thought of as a teacher. We know the correct answers (that is,
    correct outputs), the algorithm iteratively makes predictions on the training
    data and is corrected by the teacher.


    In supervised learning, a wide range of supervised learning algorithms are available,
    each with its strengths and weaknesses. There is no single learning algorithm
    that works best on all problems.


    ![image](d2d_images/image010.jpg)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) | || | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](d2d_images/chapter_title_above.png)


    Example:Consider the following data regarding patients entering a clinic. The
    data consists of the gender and age of the patients and each patient is labeled
    as “healthy” or “sick”.


    ![image](d2d_images/image051.png)


    ## Unsupervised learning


    Correct responses are not provided, but instead the algorithm tries to identify
    similarities between the inputs so that inputs that have something in common are
    categorized together. The statistical approach to unsupervised learning is known
    as density estimation.


    Unsupervised learning is a type of machine learning algorithm used to draw inferences
    from datasets consisting of input data without labeled responses. In unsupervised
    learning algorithms, a classification or categorization is not included in the
    observations. There are no output values and so there is no estimation of functions.
    Since the examples given to the learner are unlabeled, the accuracy of the structure
    that is output by the algorithm cannot be evaluated. The most common unsupervised
    learning method is cluster analysis, which is used for exploratory data analysis
    to find hidden patterns or grouping in data.


    ![image](d2d_images/image199.png)


    Example:Consider the following data regarding patients entering a clinic. The
    data consists of the gender and age of the patients. Based on this data, can we
    infer anything regarding the patients entering the clinic?


    ![image](d2d_images/image036.png)


    ## Reinforcement learning


    This is somewhere between supervised and unsupervised learning. The algorithm
    gets told when the answer is wrong, but does not get told how to correct it. It
    has to explore and try out different possibilities until it works out how to get
    the answer right. Reinforcement learning is sometime called learning with a critic
    because of this monitor that scores the answer, but does not suggest improvements.

