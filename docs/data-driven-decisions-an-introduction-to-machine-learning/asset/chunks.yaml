    图：对正样本提供最紧凑拟合轴对齐矩形


    可以证明，在上述引入的符号中，概念类 `C` 通过算法 `L` 并使用所有轴对齐矩形的假设空间 `H` 是 PAC 可学习的。


    ## Vapnik-Chervonenkis (VC) 维度


    Vapnik-Chervonenkis 维度（`VC dimension`）和概率近似正确（`PAC`）学习是学习性数学理论中的两个重要概念，因此它们是数学性的。前者是分类算法可以学习的函数空间容量（复杂度、表达能力、丰富性或灵活性）的度量。它最初由
    Vladimir Vapnik 和 Alexey Chervonenkis 在 1971 年定义。后者是学习算法数学分析的框架。其目标是检查所选假设近似正确的概率是否非常高。PAC
    学习的概念由 Leslie Valiant 于 1984 年提出。


    ## VC 维度


    设 `H` 为某个机器学习问题的假设空间。`H` 的 Vapnik-Chervonenkis 维度也称为 `H` 的 `VC dimension`，记为 `VC(H)`，它是空间
    `H` 复杂度（或容量、表达能力、丰富性或灵活性）的度量。为了定义 `VC dimension`，我们需要集合的打散（shattering）概念。


    ## 集合的打散


    设 `D` 为一个包含 `N` 个二分类问题示例的数据集，类别标签为 `0` 和 `1`。设 `H` 为该问题的假设空间。`H` 中的每个假设 `h` 将
    `D` 分为两个不相交的子集。`S` 的这种划分称为 `D` 中的一个“二分”（dichotomy）。可以证明 `D` 中存在 `2^N` 种可能的二分。对于
    `D` 的每种二分，`D` 的元素都有唯一的标签“1”和“0”赋值。相反，如果 `S` 是 `D` 的任意子集，则 `S` 如下定义了一个唯一的假设 `h`：


    因此，要指定假设 `h`，只需要指定集合 `{x Є D | h(x) = 1}`。图 3.1 显示了当 `D` 有三个元素时所有可能的二分。在图中，我们展示了二分分中的两个集合之一，即集合
    `{x Є D | h(x) = 1}`。圆圈和椭圆表示此类集合。


    ## 定义


    当且仅当对于 `D` 的每种二分都存在 `H` 中的某个与 `D` 的二分一致的假设时，称示例集合 `D` 被假设空间 `H` 打散。下面的示例说明了 Vapnik-Chervonenkis
    维度的概念。


    ## 示例


    在图中，我们看到轴对齐矩形可以打散二维空间中的四个点。那么，当 `H` 是二维轴对齐矩形的假设类时，`VC(H)` 为四。在计算 `VC dimension`
    时，只需找到四个可以被打散的点即可；不需要能够打散二维空间中的任意四个点。


    图：轴对齐矩形可以打散四个点。仅显示了覆盖两个点的矩形。


    VC 维度可能看起来很悲观。它告诉我们，使用矩形作为假设类，我们只能学习包含四个点的数据集，而更多。


