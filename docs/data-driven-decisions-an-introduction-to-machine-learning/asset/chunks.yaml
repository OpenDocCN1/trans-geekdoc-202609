    - 估计偏差：是估计量的期望值与参数真实值之间的差异。\n\n定义：对于任意参数 `p`，估计量 `Y` 的估计偏差为\n\n![image](img/image140.jpg)\n\
    \n# 第五章\n\n## 遗传算法\n\n动机、遗传算法：假设的表示、遗传算子、适应度函数与选择、一个说明性示例、假设空间搜索、遗传编程、进化与学习模型：拉马克主义进化、鲍尔文效应、遗传算法的并行化。\n\
    \n![image](img/image040.png)\n\n## 动机\n\n遗传算法（GAS）提供了一种受生物进化启发的学习方法。与其从通用到特定或从简单到复杂的搜索，GAS\
    \ 通过反复变异和重组已知的部分来生成后代假设。在每一步中，一个被称为种群的集合通过替换部分适应良好的假设进行更新。遗传算法的流行受多种因素驱动，包括：\n\
    \n- 进化被认为是生物系统内一种成功且稳健的方法。\n- GAS 可以搜索包含相互作用部分的假设空间，其中每个部分对整体适应度的影响难以建模。\n- 遗传算法容易并行化，并利用硬件成本降低的优势。\n\
    \n## 9.2 遗传算法\n\nGAS 解决的问题搜索假设空间以识别最佳假设。在 GAS 中，“最佳假设”定义为优化预定义数值指标（适应度）的假设。例如，如果任务是给定输入输出示例来近似未知函数，那么适应度可以定义为假设在训练数据上的准确率。如果任务是学习下棋策略，适应度可以定义为个体与当前种群成员比赛时的胜利次数。\n\
    \n尽管遗传算法的实现不同，但它们通常共享以下结构：算法通过迭代更新一个被称为种群的假设池来运行。在每次迭代中，对种群的所有成员进行评估。然后，通过概率性选择当前种群中的适应良好个体生成新种群。被选中的某些个体将完整地带入下一代种群。另一些则将作为创建新后代的基础，应用交叉和变异等遗传操作。\n\
    \n![image](img/image040.jpg)\n\n![image](img/image110.jpg)\n\n该算法的输入包括用于排名候选假设的适应度函数、定义算法终止的可接受水平阈值、维护种群的大小以及决定如何生成后续种群的参数：每代替换种群的比例和变异率。注意在该算法中主循环的每次迭代基于当前种群产生新的假设。首先，从当前种群中选择一定数量的假设纳入下一代。这些假设是通过概率选择的，选择假设\
    \ `hi` 的概率由给出\n\n"
- fmt: "\n![image](d2d_images/image124.png)\n\nThus, the probability that a hypothesis\
    \ will be selected is proportional to its own fitness and is inversely proportional\
    \ to the fitness of the other competing hypotheses in the current population.\n\
    \nOnce these members of the current generation have been selected for inclusion\
    \ in the next generation population, additional members are generated using a\
    \ crossover operation. Crossover, defined in detail in the next section, takes\
    \ two parent hypotheses from the current generation and creates two offspring\
    \ hypotheses by recombining portions of both parents. The parent hypotheses are\
    \ chosen probabilistically from the current population, again using the probability\
    \ function given by Equation (9.1). After new members have been created by this\
    \ crossover operation, the new generation population now contains the\n\n![image](d2d_images/image040.png)\n\
    \ndesired number of members. At this point, a certain fraction `m` of these members\
    \ are chosen at random, and random mutations all performed to alter these members.\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png)\n\nThis GA algorithm thus performs\
    \ a randomized, parallel beam search for hypotheses that perform well according\
    \ to the fitness function. In the following subsections, we describe in more detail\
    \ the representation of hypotheses and genetic operators used in this algorithm.\n\
    \n## Representing Hypotheses\n\nHypotheses in GAS are often represented by bit\
    \ strings, so that they can be easily manipulated by genetic operators such as\
    \ mutation and crossover. The hypotheses represented by these bit strings can\
    \ be quite complex. For example, sets of if-then rules can easily be represented\
    \ in this way, by choosing an encoding of rules that allocates specific substrings\
    \ for each rule precondition and postcondition.\n\nTo see how if-then rules can\
    \ be encoded by bit strings, .first consider how we might use a bit string to\
    \ describe a constraint on the value of a single attribute. To pick an example,\
    \ consider the attribute `Outlook`, which can take on any of the three values\
    \ `Sunny, Overcast, or Rain`. One obvious way to represent a constraint on `Outlook`\
    \ is to use a bit string of length three, in which each bit position corresponds\
    \ to one of its three possible values. Placing a `1` in some position indicates\
    \ that the attribute is allowed to take on the corresponding value. For example,\
    \ the string `010` represents the constraint that `Outlook` must take on the second\
    \ of these values, or `Outlook = Overcast`. Similarly, the string `011` represents\
    \ the more general constraint that allows two possible values, or `(Outlook =\
    \ Overcast v Rain)`. Note `111` represents the most general possible constraint,\
    \ indicating that we don't care which of its possible values the attribute takes\
    \ on.\n\nGiven this method for representing constraints on a single attribute,\
    \ conjunctions of constraints on multiple attributes can easily be represented\
    \ by concatenating the corresponding bit strings. For example, consider a second\
    \ attribute, `Wind`, that can take on the value `Strong` or `Weak`. A rule precondition\
    \ such as\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png) \
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n|\
    \ --- | --- | --- |\n![image](d2d_images/chapter_title_above.png) \n\n# (Outlook\
    \ = Overcast ^Rain) A (Wind = Strong)\n\n![image](d2d_images/chapter_title_below.png)\
    \ \n\ncan then be represented by the following bit string of length five:\n\n\
    | ![image](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n| --- | --- | --- |\n![image](d2d_images/chapter_title_above.png) \n\n#\
    \ Outlook Wind\n\n![image](d2d_images/chapter_title_below.png) \n\n01 110\n\n\
    Rule postconditions (such as `PlayTennis = yes`) can be represented in a similar\
    \ fashion. Thus, an entire rule can be described by concatenating the bit strings\
    \ describing the rule preconditions, together with the bit string describing the\
    \ rule postcondition. For example, the rule\n\n`IF Wind = Strong THEN PlayTennis\
    \ = yes`\n\nwould be represented by the string\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\
    | --- | --- | --- |\n![image](d2d_images/chapter_title_above.png) \n\n# Outlook\
    \ Wind   PlayTennis\n\n![image](d2d_images/chapter_title_below.png) \n\n111 10\
    \ 10\n\nwhere the first three bits describe the \"don't care\" constraint on `Outlook`,\
    \ the next two bits describe the constraint on `Wind`, and the final two bits\
    \ describe the rule postcondition (here we assume `PlayTennis` can take on the\
    \ values `Yes or No`). Note the bit string representing the rule contains a substring\
    \ for each attribute in the hypothesis space, even if that attribute is not constrained\
    \ by the rule preconditions. This yields a fixed length bit-string representation\
    \ for rules, in which substrings at specific locations describe constraints on\
    \ specific attributes. Given this representation for single rules, we can represent\
    \ sets of rules by similarly concatenating the bit string representations of the\
    \ individual rules.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\nIn\
    \ designing a bit string encoding for some hypothesis space, it is useful to arrange\
    \ for every syntactically legal bit string to represent a well-defined hypothesis.\
    \ To illustrate, note in the rule encoding in the above paragraph the bit string\
    \ `11 1 10 11` represents a rule whose postcondition does not constrain the target\
    \ attribute `PlayTennis`. If we wish to avoid considering this hypothesis, we\
    \ may employ a different encoding (e.g., allocate just one bit to the `PlayTennis`\
    \ postcondition to indicate whether the value is Yes or No), alter the genetic\
    \ operators so that they explicitly avoid constructing such bit strings, or simply\
    \ assign a very low fitness to such bit strings.\n\nIn some GAS, hypotheses are\
    \ represented by symbolic descriptions rather than bit strings.\n\n## Genetic\
    \ Operators\n\nThe generation of successors in a GA is determined by a set of\
    \ operators that recombine and mutate selected members of the current population.\
    \ These operators correspond to idealized versions of the genetic operations found\
    \ in biological evolution. The two most common operators are crossover and mutation.\n\
    \nThe crossover operator produces two new offspring from two parent strings, by\
    \ copying selected bits from each parent. The bit at position `i` in each offspring\
    \ is copied from the bit at position `i` in one of the two parents. The choice\
    \ of which parent contributes the bit for position `i` is determined by an additional\
    \ string called the `crossover mask`. To illustrate, consider the single-point\
    \ crossover operator at the top of Table Consider the topmost of the two offspring\
    \ in this case. This offspring takes its first five bits from the first parent\
    \ and its remaining six bits from the second parent, because the crossover mask\
    \ `11 11 1000000` specifies these choices for each of the bit positions. The second\
    \ offspring uses the same crossover mask, but switches the roles of the two parents.\
    \ Therefore, it contains the bits that were not used by the first offspring. In\
    \ single-point crossover, the crossover mask is always constructed so that it\
    \ begins with a string containing `n` contiguous `Is`, followed by the necessary\
    \ number of `0s` to complete the string. This results in offspring in which the\
    \ first `n` bits are contributed by one parent and the remaining bits by the second\
    \ parent. Each time the single-point crossover operator is applied the crossover\
    \ point `n` is chosen at random, and the crossover mask is then created and applied.\n\
    \n![image](d2d_images/image040.png)\n\n![image](d2d_images/image147.png)\n"
  raw: "![image](d2d_images/image124.png)\n\nThus, the probability that a hypothesis\
    \ will be selected is proportional to its own fitness and is inversely proportional\
    \ to the fitness of the other competing hypotheses in the current population.\n\
    \nOnce these members of the current generation have been selected for inclusion\
    \ in the next generation population, additional members are generated using a\
    \ crossover operation. Crossover, defined in detail in the next section, takes\
    \ two parent hypotheses from the current generation and creates two offspring\
    \ hypotheses\n\nby recombining portions of both parents. The parent hypotheses\
    \ are chosen probabilistically from the current population, again using the probability\
    \ function given by Equation (9.1). After new members have been created by this\
    \ crossover operation, the new generation population now contains the\n\n![image](d2d_images/image040.png)\n\
    \ndesired number of members. At this point, a certain fraction m of these members\
    \ are chosen at random, and random mutations all performed to alter these members.\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nThis GA algorithm thus\
    \ performs a randomized, parallel beam search for hypotheses that perform well\
    \ according to the fitness function. In the following subsections, we describe\
    \ in more detail the representation of hypotheses and genetic operators used in\
    \ this algorithm.\n\n## Representing Hypotheses\n\nHypotheses in GAS are often\
    \ represented by bit strings, so that they can be easily manipulated by genetic\
    \ operators such as mutation and crossover. The hypotheses represented by these\
    \ bit strings can be quite complex. For example, sets of if-then rules can easily\
    \ be represented in this way, by choosing an encoding of rules that allocates\
    \ specific substrings for each rule precondition and postcondition.\n\nTo see\
    \ how if-then rules can be encoded by bit strings, .first consider how we might\
    \ use a bit string to describe a constraint on the value of a single attribute.\
    \ To pick an example, consider the attribute Outlook, which can take on any of\
    \ the three values Sunny, Overcast, or Rain. One obvious way to represent a constraint\
    \ on Outlook is to use a bit string of length three, in which each bit position\
    \ corresponds to one of its three possible values. Placing a 1 in some position\
    \ indicates that the attribute is allowed to take on the corresponding value.\
    \ For example, the string 010 represents the constraint that Outlook must take\
    \ on the second of these values, or Outlook \\= Overcast. Similarly, the string\
    \ 011 represents the more general constraint that allows two possible values,\
    \ or (Outlook \\= Overcast v Rain). Note 11 1 represents the most general possible\
    \ constraint, indicating that we don't care which of its possible values the attribute\
    \ takes on.\n\nGiven this method for representing constraints on a single attribute,\
    \ conjunctions of constraints on multiple attributes can easily be represented\
    \ by concatenating the corresponding bit strings. For example, consider a second\
    \ attribute, Wind, that can take on the value Strong or Weak. A rule precondition\
    \ such as\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png) \
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\n# (Outlook\
    \ = Overcast ^Rain) A (Wind = Strong)\n\n![image](d2d_images/chapter_title_below.png)\
    \ \n\ncan then be represented by the following bit string of length five:\n\n\
    | ![image](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n\n| --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\
    \n# Outlook Wind\n\n![image](d2d_images/chapter_title_below.png) \n\n01 1 10\n\
    \nRule postconditions (such as PlayTennis \\= yes) can be represented in a similar\
    \ fashion. Thus, an entire rule can be described by concatenating the bit strings\
    \ describing the rule preconditions, together with the bit string describing the\
    \ rule postcondition. For example, the rule\n\nIF Wind \\= Strong THEN PlayTennis\
    \ \\= yes\n\nwould be represented by the string\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\n# Outlook\
    \ Wind   PlayTennis\n\n![image](d2d_images/chapter_title_below.png) \n\n111 10 10\n\
    \nwhere the first three bits describe the \"don't care\" constraint on Outlook,\
    \ the next two bits describe the constraint on Wind, and the final two bits describe\
    \ the rule postcondition (here we assume PlayTennis\n\n![image](d2d_images/image040.png)\n\
    \ncan take on the values Yes or No). Note the bit string representing the rule\
    \ contains a substring for each attribute in the hypothesis space, even if that\
    \ attribute is not constrained by the rule preconditions. This yields a fixed\
    \ length bit-string representation for rules, in which substrings at specific\
    \ locations describe constraints on specific attributes. Given this representation\
    \ for single rules, we can represent sets of rules by similarly concatenating\
    \ the bit string representations of the individual rules.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\
    \ \n\nIn designing a bit string encoding for some hypothesis space, it is useful\
    \ to arrange for every syntactically legal bit string to represent a well-defined\
    \ hypothesis. To illustrate, note in the rule encoding in the above paragraph\
    \ the bit string 11 1 10 11 represents a rule whose postcondition does not constrain\
    \ the target attribute PlayTennis. If we wish to avoid considering this hypothesis,\
    \ we may employ a different encoding (e.g., allocate just one bit to the PlayTennis\
    \ postcondition to indicate whether the value is Yes or No), alter the genetic\
    \ operators so that they explicitly avoid constructing such bit strings, or simply\
    \ assign a very low fitness to such bit strings.\n\nIn some GAS, hypotheses are\
    \ represented by symbolic descriptions rather than bit strings.\n\n## Genetic\
    \ Operators\n\nThe generation of successors in a GA is determined by a set of\
    \ operators that recombine and mutate selected members of the current population.\
    \ These operators correspond to idealized versions of the genetic operations found\
    \ in biological evolution. The two most common operators are crossover and mutation.\n\
    \nThe crossover operator produces two new offspring from two parent strings, by\
    \ copying selected bits from each parent. The bit at position i in each offspring\
    \ is copied from the bit at position i in one of the two parents. The choice of\
    \ which parent contributes the bit for position i is determined by an additional\
    \ string called the crossover mask. To illustrate, consider the single-point crossover\
    \ operator at the top of Table Consider the topmost of the two offspring in this\
    \ case. This offspring takes its first five bits from the first parent and its\
    \ remaining six bits from the second parent, because the crossover mask 11 11\
    \ 1000000 specifies these choices for each of the bit positions. The second offspring\
    \ uses the same crossover mask, but switches the roles of the two parents. Therefore,\
    \ it contains the bits that were not used by the first offspring. In single-point\
    \ crossover, the crossover mask is always constructed so that it begins with a\
    \ string containing n contiguous Is, followed by the necessary number of 0s to\
    \ complete the string. This results in offspring in which the first n bits are\
    \ contributed by one parent and the remaining bits by the second parent. Each\
    \ time the single-point crossover operator is applied the crossover point n is\
    \ chosen at random, and the crossover mask is then created and applied.\n\n![image](d2d_images/image040.png)\n\
    \n![image](d2d_images/image147.png)"
