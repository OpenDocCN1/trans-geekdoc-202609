    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nProbably approximately\
    \ correct learning\n\nIn computer science, computational learning theory (or just\
    \ learning theory) is a subfield of artificial intelligence devoted to studying\
    \ the design and analysis of machine learning algorithms. In computational learning\
    \ theory, probably approximately correct learning (PAC learning) is a framework\
    \ for mathematical analysis of machine learning algorithms. It was proposed in\
    \ 1984 by Leslie Valiant.\n\nIn this framework, the learner (that is, the algorithm)\
    \ receives samples and must select a hypothesis from a certain class of hypotheses.\
    \ The goal is that, with high probability (the “probably” part), the selected\
    \ hypothesis will have low generalization error (the “approximately correct” part).\
    \ In this section we first give an informal definition of PAC-learnability. After\
    \ introducing a few nore notions, we give a more formal, mathematically oriented,\
    \ definition of PAC-learnability. At the end, we mention one of the applications\
