    - 一个显而易见的策略是让智能体在状态 `s` 下选择使 `Q̂(s, a)` 最大的动作 `a`，从而利用其当前的近似值 `Q̂`。

    - 然而，使用这种策略，智能体面临的风险是可能会过度投入于训练早期发现具有高 Q 值的动作，而未能探索其他具有更高值的动作。

    - 出于此，Q 学习使用概率方法来选择动作。具有较高 `Q̂` 值的动作被分配较高的概率，但每个动作都会被分配一个非零概率。

