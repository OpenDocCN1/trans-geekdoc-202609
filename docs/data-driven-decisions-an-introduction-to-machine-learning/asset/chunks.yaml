  raw: 'Support Vector Machine or SVM is one of the most popular Supervised Learning
    algorithms, which is used for Classification as well as Regression problems. However,
    primarily, it is used for Classification problems in Machine Learning. The goal
    of the SVM algorithm is to create the best line or decision boundary that can
    segregate n-dimensional space into classes so that we can easily put the new data
    point in the correct category in the future. This best decision boundary is called
    a hyperplane. SVM chooses the extreme points/vectors that help in creating the
    hyperplane. These extreme cases are called as support vectors, and hence algorithm
    is termed as Support Vector Machine. Consider the below diagram in which there
    are two different categories that are classified using a decision boundary or
    hyperplane:


    ![image](d2d_images/image025.jpg)


    Example: SVM can be understood with the example that we have used in the KNN classifier.
    Suppose we see a strange cat that also has some features of dogs, so if we want
    a model that can accurately identify whether it is a cat or dog, so such a model
    can be created by using the SVM algorithm. We will first train our model with
    lots of images of cats and dogs so that it can learn about different features
    of cats and dogs, and then we test it with this strange creature. So as support
    vector creates a decision boundary between these two data (cat and dog) and choose
    extreme cases (support vectors), it will see the extreme case of cat and dog.
    On the basis of the support vectors, it will classify it as a cat. Consider the
    below diagram:


    SVM algorithm can be used for Face detection, image classification, text categorization,
    etc. Types of SVM


    ## SVM can be of two types:


    ![image](d2d_images/image040.png)


    *   Linear SVM: Linear SVM is used for linearly separable data, which means if
    a dataset can be classified into two classes by using a single straight line,
    then such data is termed as linearly separable data, and classifier is used called
    as Linear SVM classifier.


    *   Non-linear SVM: Non-Linear SVM is used for non-linearly separated data, which
    means if a dataset cannot be classified by using a straight line, then such data
    is termed as non-linear data and classifier used is called as Non-linear SVM classifier.


    Hyperplane and Support Vectors in the SVM algorithm:


    Hyperplane: There can be multiple lines/decision boundaries to segregate the classes
    in n- dimensional space, but we need to find out the best decision boundary that
    helps to classify the data points. This best boundary is known as the hyperplane
    of SVM.


    The dimensions of the hyperplane depend on the features present in the dataset,
    which means if there are 2 features (as shown in image), then hyperplane will
    be a straight line. And if there are 3 features, then hyperplane will be a 2-dimension
    plane.


    We always create a hyperplane that has a maximum margin, which means the maximum
    distance between the data points.


    ## Support Vectors:


    The data points or vectors that are the closest to the hyperplane and which affect
    the position of the hyperplane are termed as Support Vector. Since these vectors
    support the hyperplane, hence called a Support vector. How does SVM works?


    ## Linear SVM:


    ![image](d2d_images/image005.png)


    The working of the SVM algorithm can be understood by using an example. Suppose
    we have a dataset that has two tags (green and blue), and the dataset has two
    features x1 and x2. We want a classifier that can classify the pair(x1, x2) of
    coordinates in either green or blue. Consider the below image:


    So as it is 2-d space so by just using a straight line, we can easily separate
    these two classes. But there can be multiple lines that can separate these classes.
    Consider the below image:


    ![image](d2d_images/image040.png)


    ![image](d2d_images/image125.png)


    Hence, the SVM algorithm helps to find the best line or decision boundary; this
    best boundary or region is called as a hyperplane. SVM algorithm finds the closest
    point of the lines from both the classes. These points are called support vectors.
    The distance between the vectors and the hyperplane is called as margin. And the
    goal of SVM is to maximize this margin. The hyperplane with maximum margin is
    called the optimal hyperplane.


    ## Non-Linear SVM:


    If data is linearly arranged, then we can separate it by using a straight line,
    but for non-linear data, we cannot draw a single straight line. Consider the below
    image:


    ![image](d2d_images/image018.png)


    So to separate these data points, we need to add one more dimension. For linear
    data, we have used two dimensions x and y, so for non-linear data, we will add
    a third dimension z. It can be calculated as:


    z=x² +y²


    By adding the third dimension, the sample space will become as below image:


    ![image](d2d_images/image040.png)


    ![image](d2d_images/image022.png)


    So now, SVM will divide the datasets into classes in the following way. Consider
    the below image:


    ![image](d2d_images/image119.png)


    Since we are in 3-d Space, hence it is looking like a plane parallel to the x-axis.
    If we convert it in 2d space with z=1, then it will become as:


    ![image](d2d_images/image166.png)


    Hence we get a circumference of radius 1 in case of non-linear data.


    ## SVM Kernels


    In practice, SVM algorithm is implemented with kernel that transforms an input
    data space into


    ![image](d2d_images/image040.png)


    the required form. SVM uses a technique called the kernel trick in which kernel
    takes a low dimensional input space and transforms it into a higher dimensional
    space. In simple words, kernel converts non- separable problems into separable
    problems by adding more dimensions to it. It makes SVM more powerful, flexible
    and accurate. The following are some of the types of kernels used by SVM.


    ## Linear Kernel


    It can be used as a dot product between any two observations. The formula of linear
    kernel is as below


    K(x,xi)=sum(x∗xi)


    From the above formula, we can see that the product between two vectors say 𝑥
    & 𝑥𝑖 is the sum of the multiplication of each pair of input values.


    ## Unsupervised Machine Learning:


    Introduction to clustering


    As the name suggests, unsupervised learning is a machine learning technique in
    which models are not supervised using training dataset. Instead, models itself
    find the hidden patterns and insights from the given data. It can be compared
    to learning which takes place in the human brain while learning new things. It
    can be defined as:


    “Unsupervised learning is a type of machine learning in which models are trained
    using unlabeled dataset and are allowed to act on that data without any supervision.”


    Unsupervised learning cannot be directly applied to a regression or classification
    problem because unlike supervised learning, we have the input data but no corresponding
    output data. The goal of unsupervised learning is to find the underlying structure
    of dataset, group that data according to similarities, and represent that dataset
    in a compressed format


    Example: Suppose the unsupervised learning algorithm is given an input dataset
    containing images of different types of cats and dogs. The algorithm is never
    trained upon the given dataset, which means it does not have any idea about the
    features of the dataset. The task of the unsupervised learning algorithm is to
    identify the image features on their own. Unsupervised learning algorithm will
    perform this task by clustering the image dataset into the groups according to
    similarities between images.


    ![image](d2d_images/image193.jpg)


    ## Why use Unsupervised Learning?


    ![image](d2d_images/image040.png)


    Below are some main reasons which describe the importance of Unsupervised Learning:


