    The only part of this that requires any care during the implementation is what
    to do when there is more than one class found in the closest points, but even
    with that the implementation is nice and simple:


    ![image](d2d_images/image040.png)


    ![image](d2d_images/image173.jpg)


    We are going to look next at how we can use these methods for regression, before
    we turn to the question of how to perform the distance calculations as efficiently
    as possible, something that is done simply but inefficiently in the code above.
    We will then consider briefly whether or not the Euclidean distance is always
    the most useful way to calculate distances, and what alternatives there are.


    ![image](d2d_images/image012.png)


    For the `k`-nearest neighbours algorithm the bias-variance decomposition can be
    computed as:


    The way to interpret this is that when `k` is small, so that there are few neighbours
    considered, the model has flexibility and can represent the underlying model well,
    but that it makes mistakes (has high variance) because there is relatively little
    data. As `k` increases, the variance decreases, but at the cost of less flexibility
    and so more bias.


    ### Nearest Neighbour Smoothing


    Nearest neighbour methods can also be used for regression by returning the average
    value of the neighbours to a point, or a spline or similar fit as the new value.
    The most common methods are known as kernel smoothers, and they use a kernel (a
    weighting function between pairs of points) that decides how much emphasis (weight)
    to put onto the contribution from each datapoint according to its distance from
    the input.


    Here we shall simply use two kernels that are used for smoothing. Both of these
    kernels are designed to give more weight to points that are closer to the current
    input, with the weights decreasing smoothly to zero as they pass out of the range
    of the current input, with the range specified by a parameter `λ`.


    ![image](d2d_images/image081.png)


    They are the Epanechnikov quadratic kernel:


    ![image](d2d_images/image040.png)


    ![image](d2d_images/image107.png)


    and the tricube kernel:


    The results of using these kernels are shown in below Figure 6 on a dataset that
    consists of the time between eruptions (technically known as the repose) and the
    duration of the eruptions of Mount Ruapehu, the large volcano in the centre of
    New Zealand’s north island. Values of `λ` of 2 and 4 were used here. Picking `λ`
    requires experimentation. Large values average over more datapoints, and therefore
    produce lower variance, but at the cost of higher bias.


    ![image](d2d_images/image088.jpg)


    ![image](d2d_images/image040.png)


    ![image](d2d_images/image114.jpg)


    FIGURE 6: Output of the nearest neighbour method and two kernel smoothers on the
    data of duration and repose of eruptions of Mount Ruapehu 1860–2006.


    ### Efficient Distance Computations: the KD-Tree


    As was mentioned above, computing the distances between all pairs of points is
    very computationally expensive. Fortunately, as with many problems in computer
    science, designing an efficient data structure can reduce the computational overhead
    a lot. For the problem of finding nearest neighbours the data structure of choice
    is the `KD-Tree`. It has been around since the late 1970s, when it was devised
    by Friedman and Bentley, and it reduces the cost of finding a nearest neighbour
    to `O(log N)` for `O(N)` storage. The construction of the tree is `O(N log² N)`,
    with much of the computational cost being in the computation of the median, which
    with a naïve algorithm requires a sort and is therefore `O(N log N)`, or can be
    computed with a randomised algorithm in `O(N)` time.


    The idea behind the `KD-tree` is very simple. You create a binary tree by choosing
    one dimension at a time to split into two, and placing the line through the median
    of the point coordinates of that dimension. The points themselves end up as leaves
    of the tree. Making the tree follows pretty much the same steps as usual for constructing
    a binary tree: we identify a place to split into two choices, left and right,
    and then carry on down the tree. This makes it natural to write the algorithm
    recursively. The choice of what to split and where is what makes the `KD-tree`
    special. Just one dimension is split in each step, and the position of the split
    is found by computing the median of the points that are to be split in that one
    dimension, and putting the line there. In general, the choice of which dimension
    to split


    ![image](d2d_images/image040.png)


    alternates through the different choices, or it can be made randomly. The algorithm
    below cycles through the possible dimensions based on the depth of the tree so
    far, so that in two dimensions it alternates horizontal and vertical splits.


    The centre of the construction method is simply a recursive function that picks
    the axis to split on, finds the median value on that axis, and separates the points
    according to that value, which in Python can be written as:


    ```python

    ![image](d2d_images/image194.jpg)

    ```


    Suppose that we had seven two-dimensional points to make a tree from: (5, 4),
    (1, 6), (6, 1), (7, 5), (2, 7), (2, 2), (5, 8) (as plotted in Figure 7).


    ![image](d2d_images/image185.png)


    FIGURE 7: The initial set of 2D data.


    The algorithm will pick the first coordinate to split on initially, and the median
    point here is 5, so the split is `x=5`. Of those on the left of the line, the
    median y is 6, and for those on the right it is 5. At this point we have separated
    all the points, and so the algorithm terminates with the split shown in Figure
    8 and the tree shown in 9.


    ![image](d2d_images/image040.png)


    ![image](d2d_images/image039.png)


    FIGURE 8: The splits and leaf points found by the KD-tree.


    ![image](d2d_images/image095.jpg)


    FIGURE 9:


    Searching the tree is the same as any other binary tree; we are more interested
    in finding the nearest neighbours of a test point. This is fairly easy: starting
    at the root of the tree you recurse down through the tree comparing just one dimension
    until you find a leaf that is in the region containing the test point. Using the
