    \ gain by applying feature A. H(S) is the Entropy of the entire set, while the\
    \ second term calculates the Entropy after applying the feature A, where P(x)\
    \ is the probability of event x. Let’s understand this with the help of an example\
    \ Consider a piece of data collected over the course of 14 days where the features\
