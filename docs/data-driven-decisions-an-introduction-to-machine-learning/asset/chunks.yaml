    \n## 二项分布\n\n为了更好地理解二项分布，考虑以下问题：\n\n- 给定一枚磨损且弯曲的硬币，估计其投掷时朝正面的概率。\n- 未知的正面概率 `p`。投掷硬币\
    \ `n` 次，并记录朝正面的次数 `r`。\n\n`p` 的估计值 = `r / n`\n\n- 如果重新进行实验，生成一组新的 `n` 次硬币投掷，我们预计正面的次数\
    \ `r` 与第一次实验中测量的值有所不同，从而产生对 `p` 的一个不同的估计。\n- 二项分布描述了对于每个可能的 `r` 值（即从 0 到 `n`），在已知真实正面概率为\
    \ `p` 的硬币进行 `n` 次独立投掷的样本中，观测到恰好 `r` 次正面的概率。\n\n二项分布应用的通用设置如下：\n\n1. 有一个基础实验（例如投掷硬币），其结果可以用随机变量\
    \ `Y` 描述。随机变量 `Y` 可以取两个可能的值（例如，如果是正面则 `Y = 1`，如果是反面则 `Y = 0`）。\n2. 在基础实验的任何单次中，`Y\
    \ = 1` 的概率由常数 `p` 给出，且独立任何其他实验的结果。因此，`Y = 0` 的概率为 `(1 - p)`。通常，`p` 是未知的，问题目标是估计它。\n\
    3. ![image](img/image170.jpg) 执行一系列 `n` 次底层实验的独立试验（例如，`n` 次独立硬币投掷），产生独立同分布随机变量序列\
    \ `Y1, Y2, . . , Yn`。令 `R` 表示在该系列 `n` 次实验中 `Yi = 1` 的试验次数。\n4. 随机变量 `R` 取特定值 `r`\
    \ 的概率（例如观测到恰好 `r` 次正面的概率）由二项分布给出\n\n![image](img/image040.png)\n\n![image](img/image011.jpg)\n\
    \n## 均值、方差和标准差\n\n均值（期望值）是对应随机变量进行重复采样时所取值的平均值\n\n![image](img/image044.jpg)\n\
    \n定义：考虑一个随机变量 `Y`，取可能的值 `y1, . . yn`。`Y` 的期望值（均值）`E[Y]` 为\n\n方差衡量了随机变量期望偏离其均值值的程度。\n\
