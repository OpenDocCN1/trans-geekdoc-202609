    - 第二个原因是评估假设是许多学习方法不可或缺的组成部分。


    在仅根据少量数据集学习假设并估计其未来准确性时，会出现两个主要困难：


    1. **估计中的偏差。** 观测到的准确性往往是对未来准确性的较差估计。由于该假设是基于训练样本得出的，其对未来样本的估计可能是乐观的。

    2. **估计中的方差。** 即使假设对测试样本的平均估计是无偏的，它仍然会根据测试样本的组成而变化。测试样本越小，预期的方差越大。


    ## 误差估计


    - 从分布 `D` 收集一个包含 `n` 个独立实例的随机样本 `S`，然后测量样本误差 `errors(h)`。重复此实验多次，每次抽取不同的随机样本 `Si`，我们预计会观察到不同的
    `errorsi(h)` 值，这取决于 `Si` 的组成。我们说 `errorsi(h)`（第次实验的结果）是一个随机变量。


    - 假设我们运行 `k` 次随机实验，测量随机变量 `errors1(h)`、`errors2(h)` . . . `ersk(h)` 并绘制直方图显示观察到可能的错误值的频率。


