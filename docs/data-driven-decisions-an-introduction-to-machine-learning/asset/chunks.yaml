    \ H)[(s > s') \\wedge Consistent(s', D)]\\}$\n\ng\n\n## Theorem: Version Space\
    \ representation theorem\n\nTheorem: Let $X$ be an arbitrary set of instances\
    \ and Let $H$ be a set of Boolean-valued hypotheses defined over $X$. Let $c:\
    \ X \\to \\{O, 1\\}$ be an arbitrary target concept defined over $X$, and let\
    \ $D$ be an arbitrary set of training examples\n\n![image](d2d_images/image199.png)\n\
    \n$\\{(x, c(x))\\}$. For all $X, H, c$, and $D$ such that $S$ and $G$ are well\
    \ defined,\n\n$VS = \\{h \\in H | (\\exists s \\in S)(\\exists g \\in G) (g \\\
    geq h \\geq s)\\}$\n\n$H,D$ $g$ $g$\n\n### To Prove:\n\n1. Every $h$ satisfying\
    \ the right hand side of the above expression is in $VS$\n$H, D$\n2. Every member\
    \ of $VS$ satisfies the right-hand side of the expression\n$H, D$\n\n### Sketch\
    \ of proof:\n\n1. let $g, h, s$ be arbitrary members of $G, H, S$ respectively\
    \ with $g \\geq h \\geq s$\n   - By the definition of $S$, $s$ must be satisfied\
    \ by all positive examples in $D$. Because $h \\geq s$, $h$ must also be satisfied\
    \ by all positive examples in $D$.\n   - By the definition of $G$, $g$ cannot\
    \ be satisfied by any negative example in $D$, and because $g \\geq h$, $h$ cannot\
    \ be satisfied by any negative example in $D$. Because $h$ is satisfied by all\
    \ positive examples in $D$ and by no negative examples in $D$, $h$ is consistent\
    \ with $D$, and therefore $h$ is a member of $VS_{H,D}$.\n   - It can be proven\
    \ by assuming some $h$ in $VS_{H,D}$, that does not satisfy the right hand side\
    \ of the expression, then showing that this leads to an inconsistency\n\n## CANDIDATE-ELIMINATION\
