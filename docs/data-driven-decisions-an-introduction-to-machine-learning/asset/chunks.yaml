    \ Measures of impurity like entropy or Gini index are used to quantify the homogeneity\
    \ of the data when it comes to classification trees.\n\n![image](d2d_images/image199.png)\n\
    \nIn a regression tree, a regression model is fit to the target variable using\
    \ each of the independent variables. After this, the data is split at several\
    \ points for each independent variable.\n\nAt each such point, the error between\
    \ the predicted values and actual values is squared to get “A Sum of Squared Errors”\
    \ (SSE). The SSE is compared across the variables and the variable or point which\
    \ has the lowest SSE is chosen as the split point. This process is continued recursively.\n\
    \n![image](d2d_images/image031.png)\n\n## Advantages of Classification and Regression\
    \ Trees\n\nThe purpose of the analysis conducted by any classification or regression\
    \ tree is to create a set of if-else conditions that allow for the accurate prediction\
    \ or classification of a case.\n\n## (i) The Results are Simplistic\n\nThe interpretation\
    \ of results summarized in classification or regression trees is usually fairly\
    \ simple. The simplicity of results helps in the following ways.\n\n  It allows\
    \ for the rapid classification of new observations. That’s because it is much\
    \ simpler to evaluate just one or two logical conditions than to compute scores\
    \ using complex nonlinear equations for each group.\n\n  It can often result\
    \ in a simpler model which explains why the observations are either classified\
    \ or predicted in a certain way. For instance, business problems are much easier\
    \ to explain with if-then statements than with complex nonlinear equations.\n\n\
    ## (ii) Classification and Regression Trees are Nonparametric & Nonlinear\n\n\
    The results from classification and regression trees can be summarized in simplistic\
    \ if-then conditions. This negates the need for the following implicit assumptions.\n\
    \n  The predictor variables and the dependent variable are linear.\n\n  The\
    \ predictor variables and the dependent variable follow some specific nonlinear\
    \ link function.\n\n  The predictor variables and the dependent variable are\
    \ monotonic.\n\nSince there is no need for such implicit assumptions, classification\
    \ and regression tree methods are well suited to data mining. This is because\
    \ there is very little knowledge or assumptions that can be made beforehand about\
    \ how the different variables are related.\n\nAs a result, classification and\
    \ regression trees can actually reveal relationships between these variables that\
    \ would not have been possible using other techniques.\n\n## (iii) Classification\
    \ and Regression Trees Implicitly Perform Feature Selection\n\nFeature selection\
    \ or variable screening is an important part of analytics. When we use decision\
    \ trees, the top few nodes on which the tree is split are the most important variables\
    \ within the set. As a result, feature selection gets performed automatically\
    \ and we don’t need to do it again.\n\n## Limitations of Classification and Regression\
    \ Trees\n\n![image](d2d_images/image199.png)\n\nClassification and regression\
    \ tree tutorials, as well as classification and regression tree ppts, exist in\
    \ abundance. This is a testament to the popularity of these decision trees and\
    \ how frequently they are used. However, these decision trees are not without\
    \ their disadvantages.\n\nThere are many classification and regression trees examples\
    \ where the use of a decision tree has not led to the optimal result. Here are\
    \ some of the limitations of classification and regression trees.\n\n## (i) Overfitting\n\
    \nOverfitting occurs when the tree takes into account a lot of noise that exists\
    \ in the data and comes up with an inaccurate result.\n\n## (ii) High variance\n\
    \nIn this case, a small variance in the data can lead to a very high variance\
    \ in the prediction, thereby affecting the stability of the outcome.\n\n## (iii)\
    \ Low bias\n\nA decision tree that is very complex usually has a low bias. This\
    \ makes it very difficult for the model to incorporate any new data.\n\n## What\
    \ is a CART in Machine Learning?\n\nA Classification and Regression Tree (CART)\
    \ is a predictive algorithm used in machine learning. It explains how a target\
    \ variable’s values can be predicted based on other values.\n\nIt is a decision\
    \ tree where each fork is a split in a predictor variable and each node at the\
    \ end has a prediction for the target variable.\n\nThe CART algorithm is an important\
    \ decision tree algorithm that lies at the foundation of machine learning. Moreover,\
    \ it is also the basis for other powerful machine learning algorithms like bagged\
    \ decision trees, random forest and boosted decision trees.\n\n## Summing up\n\
    \nThe Classification and regression tree (CART) methodology is one of the oldest\
    \ and most fundamental algorithms. It is used to predict outcomes based on certain\
    \ predictor variables.\n\nThey are excellent for data mining tasks because they\
    \ require very little data pre-processing. Decision tree models are easy to understand\
    \ and implement which gives them a strong advantage when compared to other analytical\
    \ models.\n\n## Regression\n\nRegression Analysis in Machine learning\n\nRegression\
    \ analysis is a statistical method to model the relationship between a dependent\
    \ (target) and independent (predictor) variables with one or more independent\
    \ variables. More specifically, Regression analysis helps us to understand how\
    \ the value of the dependent variable is changing corresponding to an independent\
    \ variable when other independent variables are held fixed. It predicts continuous/real\
    \ values such as temperature, age, salary, price, etc.\n\nWe can understand the\
    \ concept of regression analysis using the below example:"
