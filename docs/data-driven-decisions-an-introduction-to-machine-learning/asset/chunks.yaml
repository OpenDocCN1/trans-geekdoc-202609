    \ models are black boxes that are very hard to interpret.\n\nBoosting\n\n*   Boosting:\
    \ train next learner on mistakes made by previous learner(s)\n\nIn bagging, generating\
    \ complementary base-learners is left to chance and to the unstability of the\
    \ learning method. In boosting, we actively try to generate complementary base-learners\
    \ by training the next learner on the mistakes of the previous learners. The original\
    \ boosting algorithm combines three weak learners to generate a strong learner.\
    \ A weak learner has error probability less than 1/2, which makes it better than\
    \ random guessing on a two-class problem, and a strong learner has arbitrarily\
    \ small error probability.\n\n## Original Boosting Concept\n\nGiven a large training\
    \ set, we randomly divide it into three. We use X1 and train d1\\. We then take\
    \ X2 and feed it to d1\\. We take all instances misclassified by d1 and also as\
