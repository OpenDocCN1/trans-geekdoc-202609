- fmt: "\n1. **Exploration**: In reinforcement learning, the agent influences the\
    \ distribution of training examples by the action sequence it chooses. This raises\
    \ the question of which experimentation strategy produces most effective learning.\
    \ The learner faces a trade-off in choosing whether to favor exploration of unknown\
    \ states and actions, or exploitation of states and actions that it has already\
    \ learned will yield high reward.\n\n2. **Partially observable states**: The agent's\
    \ sensors can perceive the entire state of the environment at each time step,\
    \ in many practical situations sensors provide only partial information. In such\
    \ cases, the agent needs to consider its previous observations together with its\
    \ current sensor data when choosing actions, and the best policy may be one that\
    \ chooses actions specifically to improve the observability of the environment.\n\
    \n3. **Life-long learning**: Robot requires to learn several related tasks within\
    \ the same environment, using the same sensors. For example, a mobile robot may\
    \ need to learn how to dock on its battery charger, how to navigate through narrow\
    \ corridors, and how to pick up output from laser printers. This setting raises\
    \ the possibility of using previously obtained experience or knowledge to reduce\
    \ sample complexity when learning new tasks.\n\n## Learning Task\n\n* Consider\
    \ Markov decision process (`MDP`) where the agent can perceive a set `S` of distinct\
    \ states of its environment and has a set `A` of actions that it can perform.\n\
    * At each discrete time step `t`, the agent senses the current state `st`, chooses\
    \ a current action at `at`, and performs it.\n\n![image](d2d_images/image040.png)\n\
    \n* The environment responds by giving the agent a reward `rt = r(st, at)` and\
    \ by producing the succeeding state `st+l = δ(st, at)`. Here the functions `δ(st,\
    \ at)` and `r(st, at)` depend only on the current state and action, and not on\
    \ earlier states or actions.\n\nThe task of the agent is to learn a policy, `π:\
    \ S → A`, for selecting its next action `a`, based on the current observed state\
    \ `st`; that is, `(st) = at`.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \  ||  ![image](d2d_images/chapter_title_corner_decoration_right.png)  |\n| ---\
    \ | --- | --- |\n![image](d2d_images/chapter_title_above.png) \n\n# How shall\
    \ we specify precisely which policy `π` we would like the agent to learn?\n\n\
    ![image](d2d_images/chapter_title_below.png)\n\n1. One approach is to require\
    \ the policy that produces the greatest possible cumulative reward for the robot\
    \ over time.\n    * ![image](d2d_images/image177.jpg)\n    To state this requirement\
    \ more precisely, define the cumulative value `Vπ (st)` achieved by following\
    \ an arbitrary policy `π` from an arbitrary initial state `st` as follows:\n \
    \   * Where, the sequence of rewards `rt+i` is generated by beginning at state\
    \ `st` and by repeatedly using the policy `π` to select actions.\n    * Here `0\
    \ ≤ γ ≤ 1` is a constant that determines the relative value of delayed versus\
    \ immediate rewards. if we set `γ = 0`, only the immediate reward is considered.\
    \ As we set `γ` closer to 1, future rewards are given greater emphasis relative\
    \ to the immediate reward.\n    * The quantity `Vπ (st)` is called the discounted\
    \ cumulative reward achieved by policy `π` from initial state `s`. It is reasonable\
    \ to discount future rewards relative to immediate rewards because, in many cases,\
    \ we prefer to obtain the reward sooner rather than later.\n\n2. ![image](d2d_images/image113.jpg)\n\
    \    Other definitions of total reward is finite horizon reward,\n    Considers\
    \ the undiscounted sum of rewards over a finite number `h` of steps.\n\n3. Another\
    \ approach is average reward\n![image](d2d_images/image094.jpg)\n\nConsiders the\
    \ average reward per time step over the entire lifetime of the agent.\nWe require\
    \ that the agent learn a policy `π` that maximizes `Vπ (st)` for all states `s`.\
    \ such a policy is called an optimal policy and denote it by `π*`\n\n![image](d2d_images/image040.png)\n\
    ![image](d2d_images/image030.jpg)\n\nRefer the value function `Vπ\\*(s)` an optimal\
    \ policy as `V\\*(s)`. `V\\*(s)` gives the maximum discounted cumulative reward\
    \ that the agent can obtain starting from state `s`.\n\n## Example:\n\n![image](d2d_images/image102.jpg)\n\
    \nA simple grid-world environment is depicted in the diagram\n* The six grid squares\
    \ in this diagram represent six possible states, or locations, for the agent.\n\
    * Each arrow in the diagram represents a possible action the agent can take to\
    \ move from one state to another.\n* The number associated with each arrow represents\
    \ the immediate reward `r(s, a)` the agent receives if it executes the corresponding\
    \ state-action transition\n* The immediate reward in this environment is defined\
    \ to be zero for all state-action transitions except for those leading into the\
    \ state labelled `G`. The state `G` as the goal state, and the agent can receive\
    \ reward by entering this state.\n\nOnce the states, actions, and immediate rewards\
