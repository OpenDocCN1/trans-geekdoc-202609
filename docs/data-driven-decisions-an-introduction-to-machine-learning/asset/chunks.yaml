    ## An Illustrative Example


    - ![image](d2d_images/image101.jpg)


    To illustrate the operation of the Q learning algorithm, consider a single action
    taken by an agent, and the corresponding refinement to `Q̂` shown in below figure:


    - The agent moves one cell to the right in its grid world and receives an immediate
    reward of zero for this transition.


    - ![image](d2d_images/image159.jpg)


    Apply the training rule of Equation to refine its estimate `Q` for the state-action
    transition it just executed.


    - ![image](d2d_images/image085.jpg)


    According to the training rule, the new `Q̂` estimate for this transition is the
    sum of the received reward (zero) and the highest `Q̂` value associated with the
    resulting state (100), discounted by `γ` (.9).


    ## Convergence


    Will the Q Learning Algorithm converge toward a `Q` equal to the true Q function?


    Yes, under certain conditions.


    1. Assume the system is a deterministic MDP.

    2. Assume the immediate reward values are bounded; that is, there exists some
    positive constant `c` such that for all states `s` and actions `a`, `| r(s, a)|
    < c`

    3. Assume the agent selects actions in such a fashion that it visits every possible
    state-action pair infinitely often.


