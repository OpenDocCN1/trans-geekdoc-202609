  trans: "\n一旦训练好树集，森林的输出对于分类而言是多数投票结果，正如我们见过的其他委员会方法一样；对于回归任务，它则是平均响应。这些基本上就是创建随机森林所需的主要特征。在看到随机森林的使用结果之前，接下来将给出该算法。\n\
    \n# 算法\n\n这里是随机森林算法的轮廓。\n\n1. 随机森林算法生成许多分类树。每棵树的生成过程如下：\n\n   a) 如果训练集中样本数量为 `N`，则从原始数据中随机抽取（有放回地）`N`\
    \ 个样本的样本。该样本将作为生成树的训练集。\n\n   b) 如果有 `M` 个输入变量，则指定一个数字 `m`，使得在每个节点上，从 `M` 个变量中随机选择\
    \ `m` 个变量，并使用这 `m` 个变量的最优划分方式来分裂节点。\n\n   ![image](img/image040.png)\n\n   在森林中生成各种树的过程中，`m`\
    \ 的值保持不变。\n\n   c) 每棵树都尽可能地生长到最大程度。\n\n2. 为了对输入向量中的新对象进行分类，将输入向量放入森林中的每棵树中。每棵树给出一个分类结果，我们称该树对该类别“了票”。由森林选择最终的分类结果。\n\
    \n这种实现非常简单：我们修改决策以引入一个额外参数 `m`，即在每个阶段选择集中应使用的特征数量。我们很快会看一个示例，作为与提升（boosting）方法的对比。\n\
    \n观察该算法可能会发现它是一种非常特殊的机器学习方法，因为具有极其并行（embarrassingly parallel）的特性：由于树与树之间不相互依赖，如果你有多个处理器，你可以在不同的处理器上同时创建并从不同的树中获取决策。这意味着随机森林可以在可用的任意数量上运行，并获得近乎线性的加速。\n\
    \n关于随机森林还有一点值得提到的优点，即通过少量的编程工作，它们就自带了测试数据：自助采样（bootstrap sample）平均会丢失大约 35% 的数据，即所谓的“袋外样本”（out-of-bootstrap\
    \ examples）。如果我们跟踪这些数据点，它们就可以作为该特定树的新颖样本，从而获得一个估计的测试误差，而无需使用任何额外的数据点。\n\n这避免了对交叉验证的需求。\n\
    \n作为使用随机森林的一个简短示例，我们首先演示随机森林在在本章和上一章中使用的 Party 示例上可以得到正确的结果。该结果基于 10 棵树，每棵树在 7\
    \ 个样本上进行训练，且每棵树仅允许两层：\n\n![image](img/image176.jpg)\n\n––––––––\n\n![image](img/scene_break.png)\
    \ \n\n作为一个更为复杂的示例，UCI 仓库中的汽车评估数据集包含 1,728 个示例，旨在根据六个属性对汽车是否值得购买进行分类。以下结果比较了单决策树、装袋法（bagging）以及具有\
    \ 50 棵树的随机森林（每棵树都基于 100 个样本，且每棵树的最大深度为五）。可以看出，随机森林是这三种方法中最准确的。\n\n![image](img/image040.png)\n\
    \n![image](img/image096.png)\n\n## 优点与缺点\n\n### 优点\n\n以下是随机森林的一些重要优点。\n\n* 它在大型数据库上运行高效。\n\
    * 它可以在不删除变量的情况下处理数千个输入变量。\n* 它提供了关于哪些变量在分类中较重要的估计。\n* 它有一种估计缺失数据的有效方法，并在大量数据缺失时仍能保持准确性。\n\
    * 生成的森林可以保存以供未来在其他数据上使用。\n* 计算出的原型提供了关于变量与分类之间关系的信息。\n* 上述能力可以扩展到无标记数据，实现无监督聚类、数据视图和异常值检测。\n\
    * 它提供了一种检测变量交互的实验方法。\n* 随机森林的运行速度很快，并且能够处理不平衡和缺失数据。\n* 它们可以处理二分类特征、分类特征和数值特征，无需任何缩放。\n\
    \n### 缺点\n\n* 随机森林的缺点是它们可能是黑箱。\n\n![image](img/image040.png)\n\n* 它们可能难以解释。\n\
    * 可能需要大量的内存。\n\n## 提升 (Boosting)\n\n在装袋法中，生成互补学习器取决于运气。在提升法中，我们积极尝试通过在之前学习器的错误上训练下一个学习器来生成互补学习器。原始算法结合弱学习器来生成强学习器。\n\
    \n### 原始提升概念\n\n给定一个大型训练集，我们将其分为三个：`X1`、`X2` 和 `X3`。我们使用 `X1` 来训练 `d1`。然后取 `X2`\
    \ 并将其输入 `d1`。`d1` 出错的实例形成 `d2` 的训练集。然后我们取 `X3` 并将其输入 `d1` 和 `d2`。`d1` 和 `d2` 意见不一致的实例形成\
    \ `d3` 的训练集。在测试期间，误差率可以递归地降低。\n\n### AdaBoost\n\nFreund 和 Schapire (1996) 提出了一种变体，命名为\
    \ `AdaBoost`（自适应提升法 adaptive boosting 的缩写），它反复使用同一个训练集，因此训练集不需要很大，但分类器应该足够简单以防过拟。AdaBoost\
    \ 还可以结合任意数量的基学习器，而不仅仅是三个。\n\n#### AdaBoost 算法\n\n![image](img/image040.png)\n\n\
    ![image](img/image064.png)\n\n![image](img/image142.png)\n\n其思想是根据误差的函数修改抽取实例的概率。假设\
    \ `p^t` 表示实例对 `(x^t, r^t)` 被抽取以训练第 `j` 个基学习器的概率。\n\n![image](img/image165.png)\n\
