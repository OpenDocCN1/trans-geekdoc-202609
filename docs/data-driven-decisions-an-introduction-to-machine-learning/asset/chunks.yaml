- fmt: "\nAs `k` grows, the histogram would approach a particular probability distribution\
    \ called the Binomial distribution which is shown in below figure.\n\nA Binomial\
    \ distribution is defined by the probability function\n\n![image](d2d_images/image046.jpg)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png) \n\nIf the random variable\
    \ `X` follows a Binomial distribution, then:\n\n- The probability `Pr(X = r)`\
    \ that `X` will take on the value `r` is given by `P(r)`\n\n![image](d2d_images/image040.png)\n\
    \n![image](d2d_images/image098.jpg)\n\n## The Binomial Distribution\n\nConsider\
    \ the following problem for better understanding of Binomial Distribution\n\n\
    - Given a worn and bent coin and estimate the probability that the coin will turn\
    \ up heads when tossed.\n- Unknown probability of heads `p`. Toss the coin `n`\
    \ times and record the number of times `r` that it turns up heads.\n\nEstimate\
    \ of `p` = `r / n`\n\n- If the experiment were rerun, generating a new set of\
    \ `n` coin tosses, we might expect the number of heads `r` to vary somewhat from\
    \ the value measured in the first experiment, yielding a somewhat different estimate\
    \ for `p`.\n- The Binomial distribution describes for each possible value of `r`\
    \ (i.e., from 0 to `n`), the probability of observing exactly `r` heads given\
    \ a sample of `n` independent tosses of a coin whose true probability of heads\
    \ is `p`.\n\nThe general setting to which the Binomial distribution applies is:\n\
    \n1. There is a base experiment (e.g., toss of the coin) whose outcome can be\
    \ described by a random variable `Y`. The random variable `Y` can take on two\
    \ possible values (e.g., `Y = 1` if heads, `Y = 0` if tails).\n2. The probability\
    \ that `Y = 1` on any single trial of the base experiment is given by some constant\
    \ `p`, independent of the outcome of any other experiment. The probability that\
    \ `Y = 0` is therefore `(1 - p)`. Typically, `p` is not known in advance, and\
    \ the problem is to estimate it.\n3. ![image](d2d_images/image170.jpg) A series\
    \ of `n` independent trials of the underlying experiment is performed (e.g., `n`\
    \ independent coin tosses), producing the sequence of independent, identically\
    \ distributed random variables `Y1, Y2, . . , Yn`. Let `R` denote the number of\
    \ trials for which `Yi = 1` in this series of `n` experiments.\n4. The probability\
    \ that the random variable `R` will take on a specific value `r` (e.g., the probability\
    \ of observing exactly `r` heads) is given by the Binomial distribution\n\n![image](d2d_images/image040.png)\n\
    \n![image](d2d_images/image011.jpg)\n\n## Mean, Variance and Standard Deviation\n\
    \nThe Mean (expected value) is the average of the values taken on by repeatedly\
    \ sampling the random variable\n\n![image](d2d_images/image044.jpg)\n\nDefinition:\
    \ Consider a random variable `Y` that takes on the possible values `y1, . . yn`.\
    \ The expected value (Mean) of `Y`, `E[Y]`, is\n\nThe Variance captures how far\
    \ the random variable is expected to vary from its mean value.\n\nDefinition:\
    \ the variance of a random variable `Y`, `Var[Y]`, is\n\n![image](d2d_images/image024.jpg)\n\
    \nThe variance describes the expected squared error in using a single observation\
    \ of `Y` to estimate its mean `E[Y]`.\n\nThe square root of the variance is called\
    \ the standard deviation of `Y`, denoted `σy`\n\n![image](d2d_images/image092.jpg)\n\
    \nDefinition: the standard deviation of a random variable `Y`, `σy`, is\n\nIn\
    \ case the random variable `Y` is governed by a Binomial distribution, then the\
    \ Mean, Variance and standard deviation are given by\n\n![image](d2d_images/image028.jpg)\n\
    \n![image](d2d_images/image091.jpg)\n\n## Estimators, Bias, and Variance\n\n![image](d2d_images/image117.jpg)\n\
    \nLet us describe `errors(h)` and `errorD(h)` using the terms in Equation (1)\
    \ defining the Binomial distribution. We then have\n\nWhere,\n\n- `n` is the number\
    \ of instances in the sample `S`,\n\n![image](d2d_images/image040.png)\n- `r`\
    \ is the number of instances from `S` misclassified by `h`\n- `p` is the probability\
    \ of misclassifying a single instance drawn from `D`\n- Estimator: `errors(h)`\
    \ an estimator for the true error `errorD(h)`: An estimator is any random variable\
    \ used to estimate some parameter of the underlying population from which the\
    \ sample is drawn\n- Estimation bias: is the difference between the expected value\
    \ of the estimator and the true value of the parameter.\n\nDefinition: the estimation\
    \ bias of an estimator `Y` for an arbitrary parameter `p` is\n\n![image](d2d_images/image140.jpg)\n\
    \n# UNIT V\n\n## Genetic Algorithms\n\nMotivation, Genetic Algorithms: Representing\
    \ Hypotheses, Genetic Operator, Fitness Function and Selection, An Illustrative\
    \ Example, Hypothesis Space Search, Genetic Programming, Models of Evolution and\
    \ Learning: Lamarkian Evolution, Baldwin Effect, Parallelizing Genetic Algorithms.\n\
    \n![image](d2d_images/image040.png)\n\n## Motivation\n\nGenetic algorithms (GAS)\
    \ provide a learning method motivated by an analogy to biological evolution. Rather\
    \ than search from general-to-specific hypotheses, or from simple-to-complex,\
    \ GAS generate successor hypotheses by repeatedly mutating and recombining parts\
    \ of the best currently known. At each step, a collection of hypotheses called\
    \ the population is updated by replacing some fraction of the population by offspring\
    \ of the fit current hypotheses. The process forms a generate-and-test beam-search\
    \ of hypotheses most likely to be considered. The popularity of GAS is motivated\
    \ by a number of factors including:\n\n- Evolution is known to be a successful,\
    \ robust method for adaptation within biological systems.\n- GAS can search spaces\
    \ of hypotheses containing complex interacting parts, where the impact of each\
    \ part on overall fitness may be difficult to model.\n- Genetic algorithms are\
    \ easily parallelized and can take advantage of the decreasing costs of powerful\
    \ hardware.\n\n## 9.2 Genetic Algorithms\n\nThe problem addressed by GAS is to\
    \ search a space of candidate hypotheses to identify the best hypothesis. In GAS\
    \ the \"best hypothesis\" is defined as the one that optimizes a predefined numerical\
    \ measure for the problem called fitness. For example, if the learning task is\
    \ the problem of approximating an unknown function given training examples of\
    \ its input and output then fitness could be defined as the accuracy of the hypothesis\
    \ over this training data. If the task is to learn a strategy for playing chess,\
