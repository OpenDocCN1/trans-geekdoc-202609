    \ It means that artificial neural networks will turn into an irreplaceable part\
    \ of our lives progressively important.”\n\n### How do artificial neural networks\
    \ work?\n\nArtificial Neural Network can be best represented as a weighted directed\
    \ graph, where the artificial neurons form the nodes. The association between\
    \ the neurons outputs and neuron inputs can be viewed as the directed edges with\
    \ weights. The Artificial Neural Network receives the input signal from the external\
    \ source in the form of a pattern and image in the form of a vector. These inputs\
    \ are then mathematically assigned by the notations `x(n)` for every `n` number\
    \ of inputs.\n\n![image](d2d_images/image199.png)\n\n![image](d2d_images/image189.png)\n\
    \nAfterward, each of the input is multiplied by its corresponding weights ( these\
    \ weights are the details utilized by the artificial neural networks to solve\
    \ a specific problem ). In general terms, these weights normally represent the\
    \ strength of the interconnection between neurons inside the artificial neural\
    \ network. All the weighted inputs are summarized inside the computing unit.\n\
    \nIf the weighted sum is equal to zero, then bias is added to make the output\
    \ non-zero or something else to scale up to the system's response. Bias has the\
    \ same input, and weight equals to 1. Here the total of weighted inputs can be\
    \ in the range of 0 to positive infinity. Here, to keep the response in the limits\
    \ of the desired value, a certain maximum value is benchmarked, and the total\
    \ of weighted inputs is passed through the activation function.\n\nThe activation\
    \ function refers to the set of transfer functions used to achieve the desired\
    \ output. There is a different kind of the activation function, but primarily\
    \ either linear or non-linear sets of functions. Some of the commonly used sets\
    \ of activation functions are the Binary, linear, and Tan hyperbolic sigmoidal\
    \ activation functions. Let us take a look at each of them in details:\n\n####\
    \ Binary:\nIn binary activation function, the output is either a one or a 0. Here,\
