    为了让系统能够评估任何给定程序的适应度，Koza 提供了一组包含 166 个训练示例的问题，这些问题代表了各种初始区块配置，包括不同难度的题目。任何给定程序的适应度被定义为算法解决的示例数量。种群初始化为包含
    300 个随机程序的集合。在进化 10 代后，系统发现了以下程序，它解决了所有的 166 个问题。


    ```

    (EQ (DU (MT CS)(NOT CS)) (DU (MS NN)(NOT NN)) )

    ```


    注意，该程序包含连续两个 `DU`（或“Do Until”，执行直到”）语句。第一个语句重复地


    ![image](img/image040.png)


    将当前栈顶的区块移动到桌子上，直到栈变为空。第二个“Do Until”语句随后重复地将下一个所需的区块从桌子上移动到栈中。在这里，最顶层 `EQ` 表达式的作用是提供一种语法上合法的方式来将这两个“Do
    Until”循环连接起来。


    令人惊讶的是，仅经过几代，这个遗传程序（GP）就能发现一个解决所有 166 个训练问题的程序。当然，系统实现此点的能力很大程度上取决于所提供的原语参数和函数，以及用于评估适应度的训练用例集。


    ## 关于遗传编程的备注


    如上面的示例所示，遗传编程将遗传算法扩展到完整计算机程序的演化。尽管其必须搜索的假设空间巨大，但遗传编程已被证明在许多应用中能够产生引人入胜的结果。O''Reilly
    和 Oppacher (1994) 对 GP 与其他搜索计算机程序空间的方法（如爬山算法和模拟退火算法）进行了比较。


    虽然上面的 GP 搜索示例相当简单，但 Koza 等人 (1996) 总结了 GP 在若干更复杂任务中的应用，例如设计电子滤波器电路和对蛋白质分子片段进行分类。滤波器电路设计问题提供了一个复杂得多的例子。在这里，通过演化出的程序将一个简单的固定种子电路转换为最终的电路设计。GP
    构建其程序时使用的原语函数是通过插入或删除电路组件和布线连接来编辑种子电路的函数。每个程序的适应度通过模拟其输出的电路（使用 `SPICE` 电路仿真器）来计算，以确定该电路在多大程度上满足目标滤波器的设计规范。更准确地说，适应度得分是
    101 个不同输入频率下期望输出与实际输出之间误差值的之和。在这种情况下，维持了一个规模为 640,000 的种群，其中选择产生了 10% 的后代种群，交叉产生了
    89%，变异产生了 1%。该系统在 64 节点并行处理器上运行。在第一个随机生成的种群中，产生的电路是非常荒的，以至于 `SPICE` 仿真器无法模拟 98%
    电路的行为。不可模拟的电路百分比在第一代后下降到 84.9%，第二代后下降到 75.0%，并在后续代中平均为 9.6%。初始种群中最佳电路的适应度分为 159，而
    20 代后为 39，137 代后为 0.8。在 137 代后产生的最佳电路表现出与预期行为非常相似。


    在大多数情况下，遗传编程的性能取决于表示方法的选择以及适应度函数的选择。由于于原因，目前的一个活跃研究领域是自动发现和整合改进原始原语函数集的子程序，从而允许系统动态地改变其构建个体的原语。例如参见
    Koza (1994)。


    ## 演化与学习模型


    在许多自然系统中，个体生物在其寿命内会学习并显著适应。同时，生物和社会过程允许它们的物种在许多代的时间跨度内适应。关于演化系统的一个有趣问题是：“单个个体终身期间的学习与演化提供的更长时间的物种级学习之间是什么关系？”


    ## 拉马尔克演化


    拉马力是一位科学家，他在 19 世纪后期提出，跨越许多代的演化直接受到个体生物在其寿命内经历的影响。在


    ![image](img/image040.png)


    特别是，他提出单个个体的经历会直接影响其后代的遗传组成：如果一个个体在寿命内学会了避免某些有毒食物，它就可以将这种遗传遗传传给后代，因此后代就不再需要学习这种特征了。这是一个非常有吸引力的假设，因为它可能允许比忽略个体寿命内获得经验的“生成并测试”过程（如
    `GAS` 和 `GPs`）更高效的进化进展。尽管这一理论很有吸引力，但目前的科学证据压倒性地反驳了拉马尔克模型。目前的观点是，个体的遗传组成实际上不受其生物父母一生经历的影响。尽管有这一生物学事实，最近的计算机研究表明，拉马尔克过程有时可以提高计算机遗传算法的有效性（见
    Grefenstette 1991；Ackley and Littman 1994 以及 Hart and Belew 1995）。


    ## 鲍尔文效应


    虽然拉马尔克演化不是接受的生物演化模型，但人们提出了其他个体学习可以改变演化的机制。其中一种机制被称为鲍尔文效应（Baldwin effect），以 J.
    M. Baldwin (1896) 命名，他首次提出了这一观点。鲍尔文效应基于以下观察：


    - 如果一个物种在变化的环境中演化，那么进化压力将有利于具有终身学习能力的个体。例如，如果环境中出现了一种新的捕食者，那么能够学习避开捕食者的个体将比不会学习的个体更成功。实际上，学习能力允许个体在其寿命内进行较小的局部搜索以使适应度最大化。相比之下，适应度完全由其遗传组成决定的非学习个体将处于相对劣势。


    - 那些学习许多特征的个体将较少依赖其遗传代码来“硬编码”特征。结果是，这些个体可以支持更多样化的基因池，依靠个体学习来克服遗传代码中“缺失”或“未充分优化的”特征。这种更具多样性的基因池反过来可以支持更快速的进化适应。因此，个体学习的能力对整个种群的演化适应速度具有间接的加速作用。


