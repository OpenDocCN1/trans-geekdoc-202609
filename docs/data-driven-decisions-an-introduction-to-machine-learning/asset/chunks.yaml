    `sin(x) + x2 + y`


    要将遗传编程应用于特定领域，用户必须定义要考虑的原始函数（例如 `sin`、`cos`、`+`、`-`、`exponential`）以及终结（例如 `x`、`y`、常量如
    `2`）。遗传编程算法随后使用进化搜索来探索使用这些原始函数可以描述的巨大程序空间。与遗传算法一样，典型的遗传编程算法维护一个个体种群（在本例中为程序树）。在每次迭代中，它通过选择、交叉和变异产生新一代个体。种群中给定个体程序的适应度通常通过在组训练数据上执行该程序来确定。交叉操作通过用一个父代程序中随机选择的子树替换另一个父代程序的子树来完成。


    ![image](img/image084.png)


    ![image](img/image040.png)


    ![image](img/image079.png)


    上图展示了一个典型的交叉操作。它描述了一组将 GP 应用于若干应用的实验。在这些实验中，当前种群的 10%（根据适应度概率选择）在下一代中保持不变。新一代的其余部分通过对当前种群中的程序对进行交叉来创建，这些程序同样是根据其适应度进行概率选择的。在组特定的实验中没有使用变异算子。


    ## 示例说明


    Koza (1992) 提供的一个说明示例涉及学习一种用于堆叠下图积木的算法。该任务是开发一种通用算法，将积木堆叠成一个能够拼出“universal”（通用）单词的单一栈，这取决于积木的初始配置。操纵积木的操作允许一次只移动一个块。特别地，栈顶的块可以移动到桌面，或者桌面上的块可以移动到栈顶。


    ![image](img/image040.png)


    ![image](img/image127.png)


    大多数大多数 应用一样，问题表示的选择对解决问题有显著影响。在 Koza 的公式中，用于组合该任务程序的原始函数包括以下三个终结参数：


    - `CS`（当前栈）：指栈顶部块的名称，如果没有当前栈则为 F。

    - `TB`（顶部块）：指栈中最上方块的名称，使其及其下方的块顺序正确。

    - `NN`（下一个需要的）：指栈中 `TB` 上方需要的下一个块的名称，以拼出“universal”，如果不再需要更多块则为 F。


    可见，这种特定的终结参数选择为描述操纵积木程序提供了自然的表示。相比之下，想象一下如果我们将终结参数定义为每个块的 `x` 和 `y` 坐标，任务的相对难度将如何。


    除了这些终结参数外，该应用的程序语言包含了以下原始函数：


    - `MS(x)`（移动栈）：如果块 `x` 在桌子上，该算子将 `x` 移动到栈顶并返回 T。否则不做操作并返回 F。

    - `MT(x)`（移动桌面）：如果块 `x` 在栈中某处，将栈顶块移动到桌面并返回 T。否则返回 F。

    - `EQ(x, y)`（等于）：如果 `x` 等于 `y` 则返回 T，否则返回 F。

    - `NOT(x)`：如果 `x = F` 则返回 T，如果 `x = T` 则返回 F。

    - `DU(x, y)`（执行直到）：重复执行表达式 `x` 直到表达式 `y` 返回值 T。


