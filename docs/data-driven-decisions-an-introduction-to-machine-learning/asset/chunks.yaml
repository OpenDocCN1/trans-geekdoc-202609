    \ correctly. (b) A set of training examples that is not linearly separable (i.e.,\
    \ that cannot be correctly classified by any straight line). `xl` and `x2` are\
    \ the Perceptron inputs. Positive examples are indicated by \"+\", negative by\
    \ \"-\". The inputs are fed to multiple units, and the outputs of these units\
    \ are then input to a second, final stage.\n"
