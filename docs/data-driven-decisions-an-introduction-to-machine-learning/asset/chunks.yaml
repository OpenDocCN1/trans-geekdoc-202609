    So the target function to be learned in the credit approval learning system is
    a mapping function `f:X →y`. This function represents the exact knowledge defining
    the relationship between input variable `X` and output variable `y`.


    # Design of a learning system


    Just now we looked into the learning process and also understood the goal of the
    learning. When we want to design a learning system that follows the learning process,
    we need to consider a few design choices. The design choices will be to decide
    the following key components:


    1. Type of training experience

    2. Choosing the Target Function

    3. Choosing a representation for the Target Function

    4. Choosing an approximation algorithm for the Target Function

    5. The final Design


    We will look into the game - checkers learning problem and apply the above design
    choices. For a checkers learning problem, the three elements will be:


    1. Task `T`: To play checkers

    2. Performance measure `P`: Total percent of the game won in the tournament.

    3. Training experience `E`: A set of games played against itself


    ## Type of training experience


    During the design of the checker''s learning system, the type of training experience
    available for a learning system will have a significant effect on the success
    or failure of the learning.


    1. Direct or Indirect training experience — In the case of direct training experience,
    an individual board states and correct move for each board state are given. In
    case of indirect training experience, the move sequences for a game and the final
    result (win, loss or draw) are given for a number of games. How to assign credit
    or blame to individual moves is the credit assignment problem.


    2. Teacher or Not — Supervised — The training experience will be labeled, which
    means, all the board states will be labeled with the correct move. So the learning
    takes place in the presence of a supervisor or a teacher. Unsupervised — The training
    experience will be unlabeled, which means, all the board states will not have
    the moves. So the learner generates random games and plays against itself with
    no supervision or teacher involvement.


    ![image](d2d_images/image199.png)


    Semi-supervised — Learner generates game states and asks the teacher for help
    in finding the correct move if the board state is confusing.


    3. Is the training experience good — Do the training examples represent the distribution
    of examples over which the final system performance will be measured? Performance
    is best when training examples and test examples are from the same/a similar distribution.


    The checker player learns by playing against oneself. Its experience is indirect.
    It may not encounter moves that are common in human expert play. Once the proper
    training experience is available, the next design step will be choosing the Target
    Function.


    ## Choosing the Target Function


    When you are playing the checkers game, at any moment of time, you make a decision
    on choosing the best move from different possibilities. You think and apply the
    learning that you have gained from the experience. Here the learning is, for a
    specific board, you move a checker such that your board state tends towards the
    winning situation. Now the same learning has to be defined in terms of the target
    function.


    Here there are 2 considerations — direct and indirect experience.


    - During the direct experience, the checkers learning system, it needs only to
    learn how to choose the best move among some large search space. We need to find
    a target function that will help us choose the best move among alternatives. Let
    us call this function `ChooseMove` and use the notation `ChooseMove : B →M` to
    indicate that this function accepts as input any board from the set of legal board
    states `B` and produces as output some move from the set of legal moves `M`.

    - When there is an indirect experience, it becomes difficult to learn such function.
    How about assigning a real score to the board state.


    So the function be `V : B →R` indicating that this accepts as input any board
    from the set of legal board states `B` and produces an output a real score. This
    function assigns the higher scores to better board states.


    ![image](d2d_images/image037.jpg)


    If the system can successfully learn such a target function `V`, then it can easily
    use it to select the best move from any board position.


    ![image](d2d_images/image199.png)


    Let us therefore define the target value `V(b)` for an arbitrary board state `b`
    in `B`, as follows:


    1. if `b` is a final board state that is won, then `V(b) = 100`

    2. if `b` is a final board state that is lost, then `V(b) = -100`

    3. if `b` is a final board state that is drawn, then `V(b) = 0`

    4. if `b` is not a final state in the game, then `V (b) = V (b'')`, where `b''`
    is the best final board state that can be achieved starting from `b` and playing
    optimally until the end of the game.


    The (4) is a recursive definition and to determine the value of `V(b)` for a particular
    board state, it performs the search ahead for the optimal line of play, all the
    way to the end of the game. So this definition is not efficiently computable by
    our checkers playing program, we say that it is a nonoperational definition.


    The goal of learning, in this case, is to discover an operational description
    of `V`; that is, a description that can be used by the checkers-playing program
    to evaluate states and select moves within realistic time bounds.


    It may be very difficult in general to learn such an operational form of `V` perfectly.
    We expect learning algorithms to acquire only some approximation to the target
    function `^V`.


    ## Choosing a representation for the Target Function


    Now that we have specified the ideal target function `V`, we must choose a representation
    that the learning program will use to describe the function `^V` that it will
    learn. As with earlier design choices, we again have many options. We could, for
    example, allow the program to represent using a large table with a distinct entry
    specifying the value for each distinct board state. Or we could allow it to represent
    using a collection of rules that match against features of the board state, or
    a quadratic polynomial function of predefined board features, or an artificial
    neural network. In general, this choice of representation involves a crucial tradeoff.
    On one hand, we wish to pick a very expressive representation to allow representing
    as close an approximation as possible to the ideal target function `V`.


    On the other hand, the more expressive the representation, the more training data
    the program will require in order to choose among the alternative hypotheses it
    can represent. To keep the discussion brief, let us choose a simple representation:


    for any given board state, the function `^V` will be calculated as a linear combination
    of the following board features:


    - `x1(b)` — number of black pieces on board `b`

    - `x2(b)` — number of red pieces on `b`

    - `x3(b)` — number of black kings on `b`

    - `x4(b)` — number of red kings on `b`

    - `x5(b)` — number of red pieces threatened by black (i.e., which can be taken
    on black’s next turn)

    - `x6(b)` — number of black pieces threatened by red


    ```

    ^V = w0 + w1 · x1(b) + w2 · x2(b) + w3 · x3(b) + w4 · x4(b) + w5 · x5(b) + w6
    · x6(b)

    ```


    Where `w0` through `w6` are numerical coefficients or weights to be obtained by
    a learning algorithm. Weights `w1` to `w6` will determine the relative importance
    of different board features.


    ![image](d2d_images/image199.png)


    Specification of the Machine Learning Problem at this time — Till now we worked
    on choosing the type of training experience, choosing the target function and
    its representation. The checkers learning task can be summarized as below.


    - Task `T`: Play Checkers

    - Performance Measure: % of games won in world tournament

    - Training Experience `E`: opportunity to play against itself

    - Target Function: `V : Board → R`

