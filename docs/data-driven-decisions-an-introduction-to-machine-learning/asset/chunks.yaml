    # 1. Introduction


    ## UNIT I Introduction to Machine Learning


    ![image](d2d_images/image199.png)


    ## What Is Machine Learning?


    Machine learning is programming computers to optimize a performance criterion
    using example data or past experience. We have a model defined up to some parameters,
    and learning is the execution of a computer program to optimize the parameters
    of the model using the training data or past experience. The model may be predictive
    to make predictions in the future, or descriptive to gain knowledge from data,
    or both.


    Arthur Samuel, an early American leader in the field of computer gaming and artificial
    intelligence, coined the term “Machine Learning” in 1959 while at IBM. He defined
    machine learning as “the field of study that gives computers the ability to learn
    without explicitly programmed.” However, there is no universally accepted definition
    for machine learning.


    ## Definition of learning


    A computer program is said to learn from experience `E` with respect to some class
    of tasks `T` and performance measure `P`, if its performance at `T`, measured
    by `P`, improves with `E`.


    ### Examples


    i) Handwriting recognition problem

    - `T`: Recognising and classifying handwritten words

    - `P`: Percent of words correctly classified

    - `E`: A dataset of images


    ii) A robot driving problem

    - `T`: Driving on highways using vision sensors

    - `P`: Average distance traveled before error

    - `E`: A sequence of images and steering commands


    iii) A chess learning problem

    - `T`: Playing chess

    - `P`: Percent of games won against opponents

    - `E`: Playing games against itself


    A computer program which learns from experience is called a machine learning program
    or simply a learning program. referred to as a learner.


    ## Components of Learning


    The learning process, whether by a human or a machine, can be divided into four
    components, namely, data storage, abstraction and evaluation. Figure 1.1 illustrates
    the various components and the steps in the learning process.


    ![d2d_images/image007.png)


    # 1. Data storage


    Facilities for storing and retrieving huge amounts of data are an important component
    of the learning process. Humans and computers alike utilize data storage as a
    foundation for advanced reasoning.


    - In a human being, the data is stored in the brain and data is retrieved using
    electrochemical signals.

    - Computers use hard disk drives, flash memory, random access memory and similar
    devices to store data and use cables and other technology to retrieve data.


    # 2. Abstraction


    The second component of the learning process is known as abstraction. Abstraction
    is the process of extracting knowledge about stored data. This involves creating
    general concepts about the data as a whole. The creation of knowledge involves
    application of known models and creation of new models.


    The process of fitting a model to a dataset is known as training. When the model
    has been trained, the data is transformed into an abstract form that summarizes
    the original information.


    # 3. Generalization


    The third component of the learning process is known as generalisation.

