    \ happened. The task of the algorithm then is to look at the evidence and to determine\
    \ the likelihood of a specific class and assign a label accordingly to each entity.\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png)  ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \  |\n\n| --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png) \n\
    \n# Some broad categories of models:\n\n![image](d2d_images/chapter_title_below.png)\
    \ \n\nGeometric models Probabilistic models Logical models\n\n![image](d2d_images/image199.png)\n\
    \nE.g. K-nearest neighbors, linear regression, support vector machine, logistic\
    \ regression, ...\n\nNaïve Bayes, Gaussian process regression, conditional random\
    \ field, ...\n\nDecision tree, random forest, ...\n\nGrouping and Grading\n\n\
    Grading vs grouping is an orthogonal categorization to geometric-probabilistic-logical-compositional.\n\
    \n  Grouping models break the instance space up into groups or segments and in\
    \ each segment apply a very simple method (such as majority class).\n\no  E.g.\
    \ decision tree, KNN.\n\n  Grading models form one global model over the instance\
    \ space.\n\no  E.g. Linear classifiers – Neural networks\n\nDesigning a Learning\
    \ System\n\nFor any learning system, we must be knowing the three elements — T\
    \ (Task), P (Performance Measure), and E (Training Experience). At a high level,\
    \ the process of learning system looks as below.\n\n![image](d2d_images/image049.jpg)\n\
    \nThe learning process starts with task T, performance measure P and training\
    \ experience E and objective are to find an unknown target function. The target\
    \ function is an exact knowledge to be learned from the training experience and\
    \ its unknown. For example, in a case of credit approval, the learning system\
    \ will have customer application records as experience and task would be to classify\
    \ whether the given customer application is eligible for a loan. So in this case,\
    \ the training examples can be represented as\n\n![image](d2d_images/image199.png)\n\
    \n(x1,y1)(x2,y2)..(xn,yn) where X represents customer application details and\
    \ y represents the status of credit approval.\n\n## With these details, what is\
    \ that exact knowledge to be learned from the training experience?"
