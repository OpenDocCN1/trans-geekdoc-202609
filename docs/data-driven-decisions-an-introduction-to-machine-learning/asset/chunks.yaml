    ## 目标函数表示：`^V = w0 + w1 · x1(b) + w2 · x2(b) + w3 · x3(b) + w4 · x4(b) + w5 ·
    x5(b) + w6 · x6(b)`


    上述前三项对应学习任务的规范，而最后两项构成了学习程序实现的设计选择。


    ## 为目标函数选择近似算法


    ### 生成训练数据 —


    为了训练我们的学习程序，我们需要一组训练数据，每条数据描述一个特定的棋面状态 `b` 以及 `b` 的训练值 `V_train(b)`。每个训练示例都是一个序对`<b,V_train(b)>`。


    例如，一个训练示例可能是 `<(x1 = 3, x2 = 0, x3 = 1, x4 = 0, x5 = 0, x6 = 0), +100>`。这是一个黑方赢了游戏的例子，因为
    `x2 = 0` 或红方没有剩余棋子。然而，只有对于明确胜、负或平的棋面值 `b`，才能获得此类准确的 `V_train(b)`。


    在上述情况下，为明确胜、负或平的特定棋面 `b` 分配训练值 `V_train(b)` 是直接的，因为它们是直接的训练经验。但在间接经验的情况下，为中间棋面分配训练值
    `V_train(b)` 是困难的。在这种情况下，使用时序差来更新训练值。时序差（TD）学习是强化学习的核心概念，它通过迭代修正估计的收益以趋向更准确的目标收益来实现学习。


    令 `Successor(b)` 表示在 `b` 之后的下一个棋面状态，此时又轮到程序移动。`^V` 是学习者对 `V` 的当前近似。利用这些信息，如下所示为任何中间棋面状态
    `b` 分配训练值 `V_train(b)`：


    `V_train(b) ← ^V(Successor(b))`


    ### 调整权重


    现在是定义学习算法来选择权重并最优化拟合训练示例集了。一种常用的方法是将最佳假设定义为训练值与假设 `^V` 预测值之间的平方误差 `E` 最小的项。


    ![image](img/image032.jpg)


    学习算法应该随着训练示例的增加而增量地完善权重，并且需要对训练数据中的错误具有鲁健性。最小均方（LMS）训练规则是其中一种沿着减少误差的方向微调权重的训练算法。


    LMS 算法定义如下：


    ![image](img/image199.png)


    ![image](img/image162.jpg)


    ## 国际棋学习系统的最终设计


    我们国际棋学习系统的最终设计自然地由四个不同的程序模块描述，这些模块代表了许多学习系统的核心组件。


    1. 性能系统（System）——接收新棋面作为输入，并输出它对自己对弈的游戏轨迹。

    2. 评论者（Critic）——接收游戏轨迹作为输入，并输出一组目标函数的训练示例。

    3. 泛化器（Generalizer）——接收训练示例作为输入，并输出假设。

    4. 实验生成器（Experiment Generator）——接收假设（初始状态）作为输入，输出一个新的棋面状态。


    ![image](img/image066.png)


    ## 学习类型


    通常，机器学习算法可以分为三类：

    * 监督学习

    * 无监督学习

    * 强化学习


    | ![image](img/chapter_title_corner_decoration_left.png) | || | ![image](img/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](img/chapter_title_above.png)


    # 监督学习


    ![image](img/chapter_title_below.png)


    “监督学习”之所以如此，是因为从数据集学习的过程可以被视为教学。我们知道正确答案（即正确输出），算法在训练数据上进行迭代预测并由老师纠正。


    在监督学习中，有广泛的监督算法可用，每种都有其优缺点。没有一种单一的学习算法适用于所有问题。


    ![image](img/image010.jpg)


    | ![image](img/chapter_title_corner_decoration_left.png) | || | ![image](img/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](img/chapter_title_above.png)


    示例：考虑以下关于就诊患者的数据。该数据包含患者的性别和年龄，且每个患者被标记为“健康”或“患病”。


    ![image](img/image051.png)


    ## 无监督学习


    不提供正确响应，而是算法尝试识别输入之间的相似性，使具有共同点的输入归类。无监督学习的统计方法被称为密度估计。


    无监督学习是一种机器学习算法，用于从标签响应的数据集中得出推断。在无监督学习算法中，观测值不包含分类或分类。由于没有输出值，因此没有函数估计。由于给学习者的示例没有标签，无法评估算法输出结构的准确性。常见的无监督学习方法是聚类分析，它用于探索性数据分析，以发现数据中的隐藏模式或分组。


    ![image](img/image_image199.png)


    示例：考虑以下关于就诊患者的数据。该数据包含患者的性别和年龄。基于这些数据，我们能对就诊患者推断出任何东西吗？


    ![image](img/image036.png)


    ## 强化学习


    介于监督学习和无监督学习之间。算法会被告知答案是错误的，但不会被告知如何纠正。它必须探索并尝试不同的可能性，直到学会如何获得正确答案。由于这种能够评分但不提供改进建议的监控，强化学习有时被称为“带评论者的学习”。


