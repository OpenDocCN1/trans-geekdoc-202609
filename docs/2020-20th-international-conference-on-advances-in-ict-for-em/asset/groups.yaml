    # 基于深度学习的低资源语音识别


    Hurunaka Karunathilaka, Viraj Belgama, Thilini Nadudagege, Ruvan Weerasinghe

    *斯里兰卡科伦坡大学计算学院

    †hurunakakarunathilaka@gmail.com, **@ucse.cmb.ac.lk, ^@indusc.cmb.ac.lk, &aw@ucsc.cmb.ac.lk


    **摘要**——在过去的十年里，自动语音识别在大多数欧洲语言方面取得了显著进展，但对于大多数低资源语言而言，它仍然是一个重要的研究领域。本文介绍了一项使用
    Kaldi 工具包构建辛哈拉语自动语音识别（ASR系统）的研究，该语言具有丰富的词汇变化。我们探索了各种神经网络架构，如 DNN、TDNN、TDNN-LSTM
    和 LSTM，以增强深度学习方法的有效性。同时训练了 GMM-HMM 统计模型进行比较。对于该语言，使用了包含 200 多个辛哈拉语句子的语料库。实验在 25
    小时语音数据的平衡训练数据集上进行。结果表明，深度神经网络在测试集上的性能比统计基准高出 12.48%。


    **索引**——语音识别，深度神经网络，Kaldi


    ## I. 引言


    在过去的几十年里，人们对让计算机理解只有人类才能理解的内容感到好奇。机器学习范式的显著发展帮助语音识别、自然语言处理、图像处理等取得了难以置信的成功。许多研究人员对开发语音识别感兴趣，因为它用于实现人机之间的交互。语音是最有效、方便的通信方式，包括
    Google Assistant、Apple 的 Siri 和 Alexa 等商业产品正在快速使用这种 ASR 技术 [3]。人口较少的研究开发贡献较少的语言没有获得同等的投资和发展。辛哈拉语是一种低资源语言。


    辛哈拉语是斯里兰卡大部分人口使用的官方语言之一。这种语言具有丰富的词汇变化，导致了巨大的词汇量。缺乏基于资源的语音识别系统阻碍了本地系统和大多数商用现设备（COTS）实现可达的性能。因此，包括本地和全球性机构在内的许多组织可以利用辛哈拉语自动语音识别（ASR）工具来增强识别能力。本研究的目标是为辛哈拉语开发一个
    ASR 系统。为此，我们打算采用深度学习方法和对辛哈拉语语音表现良好的深度神经网络架构。在声学建模方面，深度神经网络是目前先进的方法，并在英语和其他欧洲语言中显示出显著的改进
    [5], [6]。我们使用了多种 DNN 模型进行辛哈拉语语音识别。每个 DNN 模型的性能将与传统的统计模型 GMM-HMM 进行比较评估。


    本文的结构组织如下：第二节提到相关工作，第三节描述方法论和训练配方，第四节描述实验结果和评估，第五节给出结论。


    ## II. 相关工作


    典型 ASR 系统的目标是将输入转换为单词序列。ASR 的内部过程由几个阶段组成：特征提取，将音频转换为声学特征向量序列；声学建模，将语音转换为音素；自然语言建模，定义目标语言中期望的单词类型、序列及其概率。


    由于语音识别的模式匹配方法已经经历了多种不同的方法 [7]。从基于模板的、动态时间规整、基于统计的和基于神经网络的方法，其中一些已得到广泛讨论。研究人员已尝试使用统计的
    GMM-HMM 方法为辛哈拉语构建语音识别系统 [8]–[11]。然而，在语音识别初步研究工作中，实现了 4% 的词错误率（WER）。但是，该模型是 100%
    依赖说话人的。这项工作需要与人无关 [8], [9]。但该 ASR 系统的精度取决于它能处理的数据量。在这里，这项工作提出了一个通用领域的领域无关 ASR
    系统。最近，基于神经网络（ANN）的声学模型相比 GMM 显示了显著的性能提升。Hinton 等人 (2013) 在研究论文中通过四个研究小组展示了使用深度网络实现成功的语音识别模型的深度概述。作者在这里表明，当数据有限时，预训练比浅层网络更有帮助。Alexey
    (2017) 显示深层架构优于浅层架构。Xu 和 Liang (2016) 报告说深层架构优于原生 LSTM。Daniel 等人 (2015) 显示在该领域深度架构优于
    LSTM。时间延迟神经网络（TDNN）在学习更好的时间依赖关系方面有效。DNN 在土耳其语、阿萨姆语、孟加拉语等许多语言中显示出显著改进 [16], [17],
    [19]。


    ## III. 方法


    ### A. 数据准备


    本研究使用的语音语料库收集自女性和男性（25 小时语音）。数据用于训练、验证和测试，其中音频文件组是由说话者朗读脚本录制的（700 小时语音）。


    ### B. 特征提取


    首先，对音频文件进行预处理以获得数值向量，这通常被称为“梅尔频率频谱图”，它包含了声学信息。然后，从梅尔频率中提取语音特征。


    ![](img/59c760b9b61b24fc4c0cb7d0749ecc2_1_0.png)


    图 1. 研究设计的高层架构


    经过 13 维倒谱方差归一化后的梅尔频率谱系数（MFCC）特征。


    ### C. 从 GMM-HMM 模型获取对齐


    对于神经网络的监督训练需要一组标注数据。由于很难为每个特征到对应的音素标注标签，因此通过训练如图 2 所示的 GMM-HMM 统计模型生成对齐。然后，使用展示音素与音频对齐的标注帧来启动
    DNN 训练。


    ![](img/59c760b9b61b24fc4c0cb7d0749ecc2_1_1.png)


    图 2. DNN 从 GMM-HMM 的对齐中启动


