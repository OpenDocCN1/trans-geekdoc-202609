    **Abstract**—Automatic speech recognition has progressed significantly in the
    past decades for most of the European languages, but still, it is a prominent
    research area for most of the low-resource languages. This paper presents a study
    to build an automatic speech recognition (ASR system) using the Kaldi toolkit
    for Sinhala language, a language with a large lexical variety. We explore various
    neural architectures such as DNN, TDNN, TDNN-LSTM and LSTM to enhance the effectiveness
    of the deep learning approach. A statistical model of GMM-HMM is also trained
    for comparison. For the language, a corpus containing more than 200 sentences
    from Sinhala was used. The experiments are conducted with a balanced training
    dataset of twenty-five hours of speech data. The results show that deep neural
    network achieved better performance than the statistical baseline by 12.48% on
    the test set.


    **Index Terms**—Speech recognition, Deep neural network, Kaldi


