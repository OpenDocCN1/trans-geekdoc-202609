    # D. Acoustic Modeling with DNNs


    The two main approaches for developing ASR systems can be considered as DNN-HMM
    [21] and End-to-end (E2E) DNN. DNN-HMM is a hybrid architecture which uses DNNs
    for acoustic modeling with a HMM enriches with the strong learning power of DNNs
    and the sequential modeling of HMMs. The End-to-end DNN is a single integrated
    approach lacks flexibility. ASR systems suffer from limitations such as over-fitting
    when the training data is limited. Hence, we use the DNN-HMM for approach.


    This section will shortly describe the neural network architectures that were
    used for the experiments. All the experiments were conducted using the Kaldi toolkit.
    All deep networks and the decoding of the models were carried out on a single
    GPU - GeForce RTX 2080 Ti of 10.8GB


    +   1 Pre-trained DNN: According to [12], supervised optimization from pre-trained
    networks yields vastly better performance than randomly initialized weights in
    neural network. For our approach, the pre-trained weights were obtained by training
    a Deep Belief Network (DBN). The features are then connected to a fully connected
    feed forward network which is trained directly with training and validation data.


    +   2 Feed Forward Neural Networks: Pre-training DNN models with many layers helps
    but the computational time is also more stable than a regular layer feed-forward
    network. However, fully connected feed forward networks with randomly initialized
    weights were experimented on the training and validation data. The other network
    settings were kept as same as for the pre-trained DNNs.


    +   3 Time Delay Neural Networks: In research such as [22], [15] and [23], time-delay
    neural networks with sub-sampling have been proposed for effective modeling of


    ![](img/59c760b9b61b24fc4c06cb7d0749ecc2_2_0.png)


    ![](img/59c760b9b61b24fc4c06cb7d0749ecc2_2_1.png)


    long contexts of speech. DNNs represent a mapping between past and present values.
    Although the same memory capture can be achieved by RNNs, when learning time dependencies
    with RNNs, the "vanishing/exploding" gradient problem is avoided.

    Unsupervised training


    +   4 DNN+LSTM: The next choice of neural architecture was a DNN network followed
    by an LSTM layer. In research that has been conducted for Russian Mandarin Chinese
    [23] uses embeddings of LSTMs for better results as well. Experiments of this
    architecture were conducted using both DNN and TDNN factored neural networks.


