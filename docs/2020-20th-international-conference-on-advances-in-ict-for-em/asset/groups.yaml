    ## D. 基于 DNN 的声学建模


    开发自动语音识别（ASR）系统的两种主要方法可以认为是 DNN-HMM [21] 和端到端 (E2E) DNN。DNN-HMM 是一种混合架构，它使用 DNN
    进行声学建模，并利用 DNN 的强大学习能力和 HMM 的序列建模能力进行增强。端到端 DNN 是一种单一的集成方法，缺乏灵活性。当训练数据有限时，ASR
    系统会受到过拟合等局限性。因此，我们采用了 DNN-HMM 方法。


    本节将简要介绍实验中使用的神经网络架构。所有实验都是使用 Kaldi 工具包进行的。所有深度网络和模型解码均在单块 GPU——GeForce RTX 2080
    Ti (10.8GB) 上完成。


    - 1 预训练 DNN：根据 [12]，来自预训练网络的监督优化所产生的性能远优于神经网络中的随机初始化权重。对于我们的方法，预训练权重是通过训练深度置信网络
    (DBN) 的。然后将特征连接到全连接前馈网络，并直接使用训练和验证数据对其进行训练。


    - 2 前馈神经网络：使用许多层预训练 DNN 模型是有帮助的，但计算时间也比普通的层前馈网络更稳定。然而，我们在训练和验证数据上对随机初始化权重的全连接前馈网络进行了实验。其他网络设置与预训练
    DNN 保持一致。


    - 3 时延神经网络：在如 [22], [15] 和 [23] 等研究中，提出了具有子采样的时延神经网络，用于对语音长上下文进行有效建模。


    ![](img/59c760b9b61b24fc4c06cb7d0749ecc2_2_0.png)


    ![](img/59c760b9b61b24fc4c06cb7d0749ecc2_2_1.png)


    DNN 代表了过去与现在值之间的映射。虽然 RNN 可以实现相同的记忆捕捉，但在使用 RNN 学习时间依赖时，可以避免梯度“消失/爆炸”问题。


    ### 无监督训练


    - 4 DNN+LSTM：下一个神经网络架构选择是 DNN 网络后接一个 LSTM 层。在针对俄语标准汉语进行的研究 [23] 中，也使用了 LSTM 的嵌入以获得更好的结果。该架构的实验是使用
    DNN 和 TDNN 分因子神经网络共同进行的。


    ## E. 语言模型与词表


    建模语言中单词如何连接成句子的方式。使用语料库、词表、静音函数和非静音素构建了三元模型。为此，使用了 SRI 语言工具包 [20]。


    我们研究词表是 graphene 类型。我们的大型词表包含 22 万条目，具有唯一的音字母前缀。该词表用于生成 UCSC LTRI 语音平衡语料库的转录。根据语音翻译规则转换为英文字母。为此，使用了
    "SubIn" 字幕翻译软件。使用的非静音素集长度为 47。


