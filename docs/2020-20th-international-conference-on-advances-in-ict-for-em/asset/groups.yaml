    what only humans can understand. The remarkable development in machine learning
    paradigms has helped to achieve unbelievable success in speech recognition, natural
    language processing, processing images, etc. Many of the researchers are interested
    in developing speech recognition because it is used to enable interactions between
    humans and robots. Speech has been the most efficient and convenient mode of communication,
    including commercial products like Google Assistant, Siri from Apple and Alexa
    are rapidly using this ASR technology [3]. Languages spoken by smaller populations,
    that have fewer contributions towards research development, have not seen the
    same level of investment and development. Sinhala is a low-resource language.


