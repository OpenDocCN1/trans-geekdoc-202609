    该 ASR 的性能根据在安静环境中录制的记录的准确率方面进行了评估。准确率使用词错误率 (WER) 计算，这是评估 ASR 系统性能的标准衡量。测试数据集还包含五位女性和两位男性说话者，他们总共说了
    150 个句子。验证和测试数据长度为 1.6 小时。


