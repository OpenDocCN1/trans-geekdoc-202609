  md: 'pre-training is more helpful in deep neural nets than shallow ones, when limited
    amounts of labeled training data are available. It also has reducing over-fitting,
    and the time required for discriminative fine-tuning with back-propagation. Alexey
    Karpov (2017) have shown that the number of layers has only a slight influence
    on the speech recognition and increasing the number of hidden units leads to increasing
    WER when data is small. Xu and Liang (2015) reported that constructing deep LSTM
    architectures outperform shallow LSTM networks and DNNs. By Wei-Nheng Hsu et al.
    (2016) it also suggests that deep grid LSTM architectures outperform the vanilla
    LSTM model. Introduction to Time Delay Neural Networks (TDNN) presents research
    work by Daniel Pavel et al. (2015), where the researchers have achieved a significant
    improvement in the field of speech recognition.


    TDNN architecture is effective in learning better temporal dependencies in both
    small and large datasets. Although DNNs outperformed the statistical models in
    numerous languages based ASR, some recent tests[16], [17], [19] investigated on
    low resource languages such as Turkish, Assamese, Bengali speech recognition,
    shows that the use of DNNs for acoustic modeling has resulted in a small improvement
    compared to GMM-HMM.


    # III. APPROACH


    # A. Data Preparation


    The speech corpus used in this research is collected from females and 20 males
    from the USCT LTRI, and it is 25 hours of speech. The data is used for training,
    validation, and testing, where sets of the speech (22.1, 21.6, and 700) of audio
    files were recorded from test and validation sets as the speakers were reading
    some script/sents pre-processed and possibly that can bias the performance of
    the model by giving a too-to-low error rate.


    # B. Feature Extraction


    First, the audio files were pre-processed to obtain a vector of numeric values,
    which are often referred to as ''Mel frequency spectrograms'', which contains
    the acoustic information. Then the speech features were extracted from Mel Frequency
    Frequency


    ![](img/59c760b9b61b24fc4c06cb7d0749ecc2_1_0.png)


    Fig. 1. High-level architecture of the research design


    Cepstral Coefficients (MFCC) features after normalizing by a standard 13-dimensional
    cepstral mean variance.


    # C. Getting alignments from GMM-HMM model


    For a supervised training of neural networks, a set of labeled data is required.
    Since it is difficult to annotate the labels for each feature to its corresponding
    phone, the alignments are generated by training the GMM-HMM statistical model
    as displayed in figure 2. Then, the DNN training is bootstrapped using labeled
    frames which present the phone-to-audio alignment.


    ![](img/59c760b9b61b24fc4c06cb7d0749ecc2_1_1.png)


    Fig. 2. DNN is bootstrapped on the alignments from GMM-HMM model


    A speaker recognizes the audio signal into successive frames where each frame
    outputs corresponding phones and then recognizes the recognized phones into a
    text. This research design develops a method that takes the speakers of audio
    as signals and the texts to corresponding. Figure 1 demonstrates the high level
    research design.


    The GMM-HMM model that is trained on the same data is also taken as the baseline
    model to evaluate the performance of DNN-HMM models. The block diagram of an acoustic
    model of the GMM is presented in figure 3. Mobile HMMs act as building blocks
    to the triplets since they depend only on the contextual information of a single
    phone. Phone HMMs represent the phone variant in the context of following phones
    typically.


    A pass of alignment is repeated after each phone to pass the correct predictions
    between the text transcriptions and audio to have the proper latest alignments
    for the latest model in each case.'
