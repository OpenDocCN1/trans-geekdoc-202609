    # V. CONCLUSION AND FUTURE WORK


    In this research, we have developed a speech recognition system for the Sinhala
    language using a deep learning approach for acoustic modeling. The results show
    that the deep learning improved the performance of the statistical GMM-HMM by
    a 7.8% on the test data. When Time Delay Neural Networks were used as the acoustic
    model, it resulted in the lower WER of 36.15%. This addition to the main conclusion
    of this research is that TDNN perform better than regard forward DNNs, pre-trained
    DNNs


