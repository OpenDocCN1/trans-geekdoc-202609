  md: '# # Low-resource Speech Recognition using Deep Learning


    Hurunaka Karunathilaka, Viraj Belgama, Thilini Nadudagege, Ruvan Weerasinghe

    *University of Colombo School of Computing, Sri Lanka

    †hurunakakarunathilaka@gmail.com, **@ucse.cmb.ac.lk, ^@indusc.cmb.ac.lk, &aw@ucsc.cmb.ac.lk


    **Abstract**—Automatic speech recognition has progressed significantly in the
    past decades for most of the European languages, but still, it is a prominent
    research area for most of the low-resource languages. This paper presents a study
    to build an automatic speech recognition (ASR system) using the Kaldi toolkit
    for Sinhala language, a language with a large lexical variety. We explore various
    neural architectures such as DNN, TDNN, TDNN-LSTM and LSTM to enhance the effectiveness
    of the deep learning approach. A statistical model of GMM-HMM is also trained
    for comparison. For the language, a corpus containing more than 200 sentences
    from Sinhala was used. The experiments are conducted with a balanced training
    dataset of twenty-five hours of speech data. The results show that deep neural
    network achieved better performance than the statistical baseline by 12.48% on
    the test set.


    **Index Terms**—Speech recognition, Deep neural network, Kaldi


    # I. INTRODUCTION


    Over the past few decades, there has been a curiosity in making computers understand
    what only humans can understand. The remarkable development in machine learning
    paradigms has helped to achieve unbelievable success in speech recognition, natural
    language processing, processing images, etc. Many of the researchers are interested
    in developing speech recognition because it is used to enable interactions between
    humans and robots. Speech has been the most efficient and convenient mode of communication,
    including commercial products like Google Assistant, Siri from Apple and Alexa
    are rapidly using this ASR technology [3]. Languages spoken by smaller populations,
    that have fewer contributions towards research development, have not seen the
    same level of investment and development. Sinhala is a low-resource language.


    (ASR) tool to utilize to enhance recognition. The objective of this research is
    to develop an ASR system for Sinhala language. For that we intend to follow, a
    deep learning approach and a deep neural architecture which performs well for
    the Sinhala speech. For acoustic modeling, Deep Neural Networks have been the
    state-of-the-art method and have shown significant improvement for English and
    other European languages [5], [6]. We use various DNN models for Sinhala speech
    recognition. The performances of each DNN model will be evaluated with the traditional
    statistical model which is GMM-HMM.


    The paper is organized as follows: Section II mentions relevant work, Section
    III describes the methodology and training recipe Section IV describes the results
    and evaluation Section V presents the conclusions and


    # II. RELEVANT WORK


    A typical ASR system''s goal is to transform the input into sequence of words.
    The internal process of an ASR consists of several stages: feature extraction
    which is transforming the audio into a sequence of vectors of acoustic features;
    acoustic modeling which converts speech to phonemes and natural language modeling
    which defines what kind of word and sequences are expected in the target language
    and their probabilities.


    Since different approaches for pattern matching speech recognition have been experienced
    [7]. From template-based, dynamic time warping, statistical-based, and neural
    network-based approaches, some of the above have been discussed extensively. Several
    attempts have been made for building speech recognition systems for Sinhala using
    the statistical GMM-HMM approach [8]–[11]. In the research work which has been
    done in an initial approach to speech recognition, however, 4% of WER has been
    achieved. However, the model was 100% speaker-dependent. The work needs to be
    speaker independent [8], [9]. But, the accuracy of this ASR system depends on
    the number of data it can handle. Here, this work proposes a speaker independent
    ASR system for general domain. Recently, neural-based (ANN) acoustic models have
    shown significant performance improvement over GMM. An in-depth overview of the
    usage of deep networks to achieve a successful model for speech recognition is
    presented by four research groups in the research article by Hinton et al. (2013)
    [12]. The authors of here have shown


    Sinhala is the one of the official languages used by a large majority of Sri Lanka.
    This language has a rich lexical variety which has resulted in a vast vocabulary.
    Unavailability of an on-resource speech recognition system has hindered achievable
    performance of local systems and services from most commercial-off-the-shelf (COTS).
    Therefore, many organizations, including both local and global establishments,
    can make use of a Sinhala Automatic Speech Recognition'
