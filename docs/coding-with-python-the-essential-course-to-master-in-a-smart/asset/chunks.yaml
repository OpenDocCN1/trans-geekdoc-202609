    当满足条件时，通过代入下图中的 ![](img/image_rsrcYZ.jpg 公式完成点积计算。反向方法可以用于确定两个向量之间的角度。这可以通过首先识别向量、获取其模以及点积来实现。![](image_rsrcZ0.jpg
    下图可以指导如何将值代入方程。从方程和数学角度来看，我们知道当角度的余弦为 0 时，构成该角度的直线相互垂直。由此，我们可以得出结论：当向量 `w` 和 `x`
    的点积为 0 时，直线 `w` 垂直于直线 `x`。这就是点积与两个向量角度之间的关系。


    ### 使用感知机表示问题 ![](image_rsrcZ1.jpg 该示例集将用于判断某人是否会选择一部电影，图中指示的数据和输入。图中提供的输入数据既有正值（+）也有负值（-）。实际值代表该人员观看的电影。我们将使用这些数据来观察感知机学习算法如何在数据集中估计权重。为了简单起见和清晰可视化，我们将使用
    2D 表示法。


    ### 使用感知机学习算法

    这里的主要目标是识别可以分离正值（+）输入和负值（-）输入的向量，例如示例中使用的向量 `(w)`。我们将使用下面的算法。![](img/image_rsrcZ2.jpg
    第一步是用任何其他向量调整向量 `(w)`。初始化后，我们重新陈述数据提供的示例，在本例中，指标是 `P`、`U` 和 `N`。这些示例代表了正向和负向的标准。


    进入代入阶段，输入 `x`（随机选取的向量）对应值 `P`，在 `w, x` 中要确定的点积应陈述为零（0）或大于零。实际值并不重要，因为感知机只会给出“是”或“否”的答案。在另一种情况下，当向量
    `x` 对应值 `N` 时，计算出的点积给出一个 ![](img/image_rsrcZ3.jpg 零（0）结果。上述语句可以用 while 循环中的一个
    IF 情况表示为：从这些表示的推断可以得出两种结果。第一种结果是向量 `x` 对应 `P-value`，且两个向量 `(w, x)` 的点积小于零（`w.x
    < 0`）。第二种结果是向量 `x` 对应值 `N`，且两个向量 `(w, x)` 的点积显著大于零（`w.x>0`）。


    ### 评估上述更新规则的可行性

    感知机的基本规则帮助我们确定了向量 `x` 对应值 `P`。因此；任务的剩余部分是使方程变为 `w.x > 0`。该方程也可以解释为：当向量 `x` 对应
    `P` 时，两个向量 `(w, x)` 之间的角度应该小于 90 度。为什么会有这种推论？两个向量 `(w,x)` 之间角度的余弦等于这两个向量的点积。因此，![](image_rsrcZ4.jpg
    该角度应该小于 90 度。


    从上述解释中我们得到，只要向量 `w` 与给定的特征向量形成小于 90 度的角，我们就不需要知道向量。在这种情况下，向量必须是一个正值。另一方面，向量 `w`
    应该与具有负值的特征向量形成大于 90 度的角。![](image_rsrcZ5.jpg 这种表示如下所示。在此时，我们可以放心地说，对于 `x` 对应于值
    `P` 的给定情况，向量 `x` 和 `w` 之间的角度应该小于 90 度。同样，我们可以得出结论，对于向量 `x` 对应值 `N` 的给定情况，向量 `w`
    和 `x` 之间的角度应该大于 90 度。


    ### 收敛性证明

    并没有精确的解释能让人们相信研究的向量最终会收敛。这是由于不同数据集中变化的条件导致的。尽管看起来存在向量不收敛的情况，但事实是该算法被证明会在某点收敛。许多类型的研究都研究了这些模式并得出了这些证明。


