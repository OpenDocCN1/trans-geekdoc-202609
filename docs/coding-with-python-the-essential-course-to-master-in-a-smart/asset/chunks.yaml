- raw: 'Chapter 1  Phython Programming Basics ![00002.jpeg](image_rsrcY7.jpg)How to
    Install Python  In this time and age, being techy is a demand of the times, and
    the lack of knowledge, classifies one as an outback. This can result to being
    left out from the career world, especially in the field of programming.  Numerous
    big shot companies have employed their own programmers for purposes of branding,
    and to cut back on IT expenses.  In the world of programming, using Python language
    is found to be easier and programmer-friendly, thus, the universal use.  In this
    particular demo, we have chosen windows because it’s the most common worldwide
    – even in not so progressive countries. We want to cater to the programming needs
    of everyone all over the globe. Python 2.7.12 version was selected because this
    version bridges the gap between the old version 2 and the new version 3.  Some
    of the updated functions/applications of version 3 are still not compatible with
    some devices, so 2.7.12 is a smart choice. Steps in downloading Python 2.7.12,
    and installing it on Windows   Type python on your browser and press the Search
    button to display the search results. Scroll down to find the item you are interested
    in. In this instance, you are looking for python. click “python releases for windows”,
    and a new page opens. See image below: ![00003.jpeg](image_rsrcY8.jpg)Select the
    Python version, python 2.7.12, and click, or you can select the version that is
    compatible to your device or OS.  ![00004.jpeg](image_rsrcY9.jpg)The new page
    contains the various python types. Scroll down and select an option: in this instance,
    select Windows x86 MSI installer and click. ![00005.jpeg](image_rsrcYA.jpg)Press
    the Python box at the bottom of your screen. Click the “Run” button and wait for
    the new window to appear. ![00006.jpeg](image_rsrcYB.jpg)Select the user options
    that you require and press “NEXT”. Your screen will display the hard drive where
    your python will be located.  ![00007.jpeg](image_rsrcYC.jpg)Press the “NEXT”
    button. Press yes, and wait for a few minutes. Sometimes it can take longer for
    the application to download, depending on the speed of your internet.  After that,
    click the FINISHED button to signify that the installation has been completed
    ![00008.jpeg](image_rsrcYD.jpg)Your python has been installed in your computer
    and is now ready to use. Find it in drive C, or wherever you have saved it. There
    can be glitches along the way, but there are options which are presented in this
    article. If you follow it well, there is no reason that you cannot perform this
    task.  It’s important to note that there’s no need to compile programs. Python
    is an interpretive language and can execute quickly your commands. ![00009.jpeg](image_rsrcYE.jpg)Follow
    the step by step instructions prompted by the program itself. Save and run the
    program in your computer. For Mac To download Python on Mac, you can follow a
    similar procedure, but this time, you will have to access the “Python.mpkg” file,
    to run the installer.  For Linux For Linux, Python 2 and 3 may have been installed
    by default. Hence, check first your operating system. You can check if your device
    has already a Python program, by accessing your command prompt and entering this:
    python—version, or python3—version. If Python is not installed in your Linux,
    the result “command not found” will be displayed. You may want to download both
    Python 2.7.12 and any of the versions of Python 3 for your Linux. This is due
    to the fact that Linux can have more compatibility with Python 3. For windows
    users, now that you have downloaded the program, you’re ready to start. And yes,
    congratulations! You can now begin working and having fun with your Python programming
    system.  Basic Python Terms You Must Learn  Python is a language used in computer
    programming. As such, you must be familiar with the most commonly used lingo to
    facilitate your understanding of the language. It’s like learning the ABCs before
    you can read or write your first letters.  It’s important to remember that there
    may be slight variations with the different Python versions. The example here
    is from version 2. So, here goes: Strings– are the values enclosed inside double,
    single quotes, or triple quotes. They can be a word/text, or a group of words,
    or a Unicode, or other items.  Example: mystring =‘welcome’ mystring =“welcome”
    mystring =‘My little corner.’ mystring =“My little corner.” The advantage of the
    double quotes is that you can include values within the double quotes.  The triple
    quotes signify long or lengthy strings. They are useful to avoid getting an EOL
    (End of the Line) error. Variables –are containers for the strings. In the Python
    language, these are usually objects.  These can be numbers or strings. Remember
    that you have to declare the variables, prior to using them. The numbers can be
    floating point numbers or integers.  Use this syntax to define integers and floating
    point numbers. Integers are whole numbers, while floating point numbers are usually
    numbers with decimal points. Example: myint = 9 myfloat = 9.0 Statements –are
    stated sentences or syntax used to call a function to compute, to write a value,
    or other procedures needed in executing or performing Python commands.  Lists
    –are just like your ordinary lists for items you want to create. They can contain
    any variable/s that you want to include in your list. They can be comparable to
    arrays. The variables are usually enclosed in brackets, and the items or values
    are separated by commas. The semi-colon can be used between lists.Lists are immutable
    files–meaning they cannot be changed.  The word-values are enclosed in single
    or double quotes, while numbers are not. Example: mylist1= \[‘chemistry’,‘anatomy’,
    2015, 2016\]; mylist2 = \[10, 20, 30, 40, 50\]; mylist3 = \[‘grades’,‘names’,‘addresses\]
    When you add the function ‘print’ and press ‘enter’ or execute, this will appear:
    ![00010.jpeg](image_rsrcYF.jpg)Take note of the variations of colors that can
    identify the command or function (red colored word), from the variables (green),
    and from the results (blue colored words).  Examples of double quotes:  mystring4=\[“Vanessa
    Redgrave”, “Tom Cruise”, “Mel Gibson”, “Matt Damon”\] Loops – are statements that
    can be performed or executed one after the other – repeatedly,or once. There are
    two general types of loops, the‘for’and the ‘while’ loops.. Function –a piece
    of chord that executes some functions or logic. Examples are‘print’, which prints
    your entry or variables; pow (power), which gets the answer for your numbers raised
    to a certain power. A specific example is this:  To know the value of 89, you
    can use the Python function (pow). On your Python shell enter this statement:
    pow(8,9) When you press the‘enter’ or the execute key, the answer will appear: 
    In the specific example above, the answer is 134217728. ![00011.jpeg](image_rsrcYG.jpg)Modules
    –are files that contain various items, such as variables, definitions of functions,
    and executable statements, among others. Modules are used in cases when you want
    to save functions that you have created for easier accessibility.  This is because
    after using the Python interpreter, all the definitions, variables and functions
    you have created will be lost.  Hence, you need to compile them in modules, so
    you can use them again, whenever necessary.  Python will automatically ask you
    to save your files, so you will never forget this function. Your modules should
    be saved with the name you assigned to them, and the suffix - .py.  It’s best
    to assign names based on the object, or the purpose of your module. This way,
    you can recall the names of the modules easily. Shells –are the blank boxes where
    you write your Python commands or statements.  Tuples – are similar to lists;
    they are immutable. You cannot change them. However, you can create new Tuples
    to modify the old ones. They can also be used as keys to dictionaries.  Classes
    – are groups of related data, similar to strings, integers, and lists that use
