  fmt: '

    Let’s explore each of these topics and learn a bit more about how they are all
    going to work, and some of the basics of when and how you are going to be able
    to use them for your own needs with machine learning.


    ### Clustering Algorithms


    The first machine learning that we will look at is called the clustering algorithm.
    With the clustering algorithm, we are going to keep it pretty simple. This method
    can take our data and then classify it into clusters. Before the program even
    starts, you get the benefit of picking out how many clusters you would like all
    the information to fit into. For example, you may decide that you want to combine
    the data into five different clusters. The program would then go through and divide
    up all the information you have into five different clusters so that you could
    look through it.


    The beautiful thing about this algorithm is that it is responsible for doing most
    of the work for you. This is because it is in charge of how many of your data
    points are going to fit into those clusters that you chose. To keep things organized,
    we are going to call all of the main clusters that you picked `cluster centroids`.


    So, when you are looking at one of your clusters, and you notice that there are
    a lot of points inside of it, you can safely assume that all those particular
    data points have something in common or they are similar. There is some attribute
    or another that all the data points in one cluster have in common with each other.


    You can do this several times, creating more divisions as you go through the steps.
    You could potentially go through this enough time that the `centroids` will stop
    changing. This is when you know you are done with the process.


    There are several reasons why you would want to work with a clustering algorithm
    to help you get a program started when doing machine learning. First, doing your
    computations with the help of a clustering algorithm can be easy and cost efficient,
    especially compared to some of the supervised learning options. If you would like
    to do a classification problem, the clustering algorithms are efficient at getting
    it done. With that said, you do need to use some caution here though. This algorithm
    is not going to do the work of showing predictions for you. If you end up with
    `centroids` that are not categorized the right way, then you may end up with a
    project that is done the wrong way.


    ### Markov Algorithm


    The next type of unsupervised machine learning is the Markov algorithm. This is
    a nice one to use because it can take any or all of the data that you add to the
    system, and then translates this information so that it can work with another
    coding language. You will be able to set this up with any or all of the rules
    that you would like to be present ahead of time, based on how you would like this
    to work. There are times when doing this is going to be useful because it can
    take a string of data, and make it more useful when you learn the parameters for
    how your data is going to behave.


    There are a lot of different ways that you can work with this Markov algorithm.
    One available option is if you decide to do some work with DNA. You would be able
    to take some of the DNA sequences that you have, and use this particular algorithm
    to take that information and translate it over to numerical values. When you are
    working with this on a computer, you will find that reading out numerical values
    is going to be so much easier compared to looking at a random strand of DNA, and
    hoping that you will be able to read through it.

    '
  trans: '

    让我们探索这些主题，并进一步了解它们是如何运作的，以及在机器学习需求中，你可以在何时以及如何使用它们的一些基础知识。


    ### 聚类算法


    我们将查看的第一种机器学习被称为聚类算法。对于聚类算法，我们将保持其操作非常简单。这种方法可以获取我们的数据并将其分类为不同的类。在程序启动之前，你就可以获得选择希望让所有信息拟合到多少个类中的好处。例如，你可能决定将数据合并为五个不同的类。然后，程序将遍历并将你拥有的所有信息分为五个不同的类，以便你进行查看。


    这种算法的妙之处在于，它负责为你完成大部分工作。这是因为它负责决定你的数据点将拟合到你选择的那些类中。为了保持条理，我们将你所选的所有主要类称为 `cluster
    centroids`（聚类中心）。


    所以，当你观察其中一个类并注意到里面有很多点时，你可以放心地假设所有这些特定数据点都有某些共同点或彼此相似。同一个类中的所有数据点之间在某个属性上具有共同性。


    你可以进行多次这种操作，在执行步骤的过程中创建更多的划分。你可能会进行足够多次，以至于 `centroids` 停止变化。这时你就知道你完成了该过程。


    有几个原因使你在进行机器学习时可能想要使用聚类算法来帮助启动程序。首先，在聚类算法的帮助下进行计算既简单又具有成本效益，特别是与某些监督学习选项相比。如果你想解决分类问题，聚类算法在完成任务方面非常高效。尽管如此，你在这里确实需要谨慎。这种算法不会为你完成显示预测的工作。如果你得到的
    `centroids` 没有被正确分类，那么你最终可能会得到一个执行错误的项目。


    ### 马尔可夫算法


    下一种类型的无监督机器学习是马尔可夫算法。这是一个很好用的工具，因为它可以获取你添加到系统中的任何或所有数据，然后翻译这些信息以便其与另一种编程语言配合。你可以根据你希望它的运作方式，预先设置你想要存在的任何或所有规则。在某些情况下，这样做是非常用的，因为它可以获取一段数据，并在你学习了数据行为方式的参数后，使其变得更有用。


    有很多不同的方法可以处理这种马尔可夫算法。一种可选的方案是你决定对 DNA 进行一些工作。你可以获取你拥有的一些 DNA 序列，并使用这种特定算法提取这些信息并将其翻译为数值。当你从计算机上处理这些内容时，你会发现，读取数值比观察随机的
    DNA 链并指望能够读懂它要容易得多。

    '
