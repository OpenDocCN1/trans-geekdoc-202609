    # 第 8 章 - 人工神经网络中的学习


    ## 人工神经网络的定义

    人工神经网络是机器学习中广泛应用的方法，其灵感源于人类大脑系统。神经网络的目标是模拟人脑的学习方式。神经网络系统由输入层、输出层和一个隐藏层组成，隐藏层将输入层转换为有用信息并传递到输出层。通常，人工神经网络中会实现多个隐藏层。


    下图展示了一个由 2 个隐藏层组成的神经网络系统 ![](img/image_rsrcYP.jpg)示例：人工神经网络的示例


    在进一步探讨和解释神经网络如何工作之前，让我们先定义什么是神经元。神经元简单来说是一个表示为加权输入和的数学方程。假设 `X={x1, x2,….xM}`
    是一个包含 `N` 个输入的向量，神经元是所有输入的线性组合，定义如下：


    `F(X={x1, x2,….xM})=w1x1+w2x2+….+wMxM;`


    其中 `w1, w2,…wM` 是分配给每个输入的权重。函数 `F` 也可以表示为：`F(X) = WX,`，其中 `W` 是权重矩阵，`X` 是数据向量。这种公式形式在编写神经网络模型时非常方便。权重是在训练过程中确。事实上，训练人工神经网络意味着找到提供最准确输出的最优权重
    `W`。对于每个神经元，会对加权求和输入 `X` 应用一个激活函数。激活函数的作用是根据模型的预测来决定神经元是否应该被激活。这一过程应用于网络的每一层。在接下来的子阶段中，我们将详细讨论激活函数的作用和类型，以及不同类型的神经网络。


    ## 什么是激活函数及其在神经网络模型中的作用？

    激活函数被表述为数学函数。这些函数是人工神经网络模型的关键组件。每个神经元都关联着一个激活函数。激活函数决定是否激活该神经元。例如，考虑一个神经元的输出，其为：`Y=∑
    (weight*input) +bias`。输出 `Y` 可以是任何值。神经元对于 `Y` 可取值的合理范围没有任何信息。为了此目的，在神经网络中实现激活函数来检查
    `Y` 值，并决定神经连接是否应该认为该神经元已激活。


    激活函数有多种类型。最直观的函数是阶跃函数。该函数设置一个阈值，并根据是否超过该阈值来决定是否激活神经元。换句话说，如果 `Y` 大于阈值，该函数的输出为
    1，否则为 0。形式上，激活函数为：如果 `Y> threshold`，则 `F=’activated’ or F=1;`；否则 `F=’not-activated’
    or F=0;`。这种激活函数可以用于输出为否（即 0 或 1）的分类问题。然而，它也有一些缺点。例如，考虑一组若干类别（即 `class1`、`class2`、……等），输入可能属于这些类别。如果使用这种激活函数并且激活了多个神经元，则所有神经元的输出都为
    1。在这种情况下，很难区分类别并判断输入属于哪一类，因为所有神经元的输出都是 1。简而言之，阶跃函数不支持多个输出值。


    线性激活函数与阶跃函数不同，它提供激活值的范围。它计算出一个与输入成比例的输出。形式上：`F(X)=WX,`，其中 `X` 是输入。该函数支持多个输出，而不仅仅是
    0 或 1 值。该函数由于是线性的，因此不支持训练的反向传播。反向传播是依赖导数来更新参数的过程，特别是线性激活函数的导数（即梯度）是一个常数，等于 `W`，且不与输入
    `X` 的变化有关。因此，它无法提供关于输入可以给出准确预测的信息，无法进行有效的训练。此外，当所有层都使用线性函数时，最终层是输入 `X` 的线性函数。


    大多数神经网络使用非线性激活函数，因为在大多数现实世界应用中，输出和输入之间的关系是非线性的。非线性函数允许神经网络处理复杂的模式，如图像、音频等。非线性函数克服了阶跃函数的缺点。它们支持反向传播（即导数不是常数而是取决于输入的变化），并允许堆叠层（即非线性函数）。


    Sigmoid 函数是人工神经网络中最常用的激活函数之一。该函数通常只应用于输出层，当需要将输入分类为几个不同的类别时。事实上，Sigmoid 函数支持多个类别，并提供输入属于特定类别的概率。它将每个类别的输出归一化到
    0 和 1 之间，然后除以它们的总和以提供该概率。考虑到所有这些激活函数，每个都有其优缺点，现在的问题是神经网络中应该用哪一个？答案是，对手头的问题有更好的理解将引导选择特定的激活函数，特别是当预先知道待近似函数的特征时。例如，Sigmoid
    函数是分类问题的良好选择。形式上，Sigmoid 函数等于输入的指数：`F(X) =1/(1+exp (-X))`。Sigmoid 函数的输出被限制在 0
    和 1 之间。事实上，当 `X` 大于 2 或小于 -2 时，曲线的输出接近 0 或 1（image_rsrcYR.jpg）。这种激活函数的缺点是输入在边缘处输出的变化非常小，这个问题被称为“梯度消失”，这使得神经网络在接近边缘时学习非常缓慢。


    Tanh 函数是另一种激活函数，与 Sigmoid 函数类似。该函数的数学公式为：`F(X)=tanh(X)=[2/(1+exp(-2X))`。该函数是缩放后的
    Sigmoid 函数。因此，它具有与 Sigmoid 函数相同的特征。然而，该函数的输出范围在 -1 到 1 之间，且梯度比 Sigmoid 函数的梯度更明显。与
    Sigmoid 函数不同，Tanh 函数是零中心化的，使其非常适用于负值、中性和正值输入。该函数的缺点与 Sigmoid 函数一样，存在梯度消失问题且计算开销。


    修正线性单元函数，又被称为 `ReLU` 函数，也是一种广泛使用的激活函数，它是计算高效的。该函数使用简单的数学公式，允许神经网络比 Sigmoid 和 Tanh
    函数更快地收敛。`ReLU` 函数在 `X` 为正时返回 `X` 作为输出，否则返回 0。形式上，这种激活函数表述为 `F(X)=max(0,X)`。这种激活函数没有边界，取值从
    0 到 +inf。尽管它的形状与线性函数相似（即该函数在正值时等于恒等），但 `ReLU` 函数有导数。`ReLU` 的缺点是当输入为负时，导数（即梯度）为
    0。这意味着对于线性函数，除非输入大于 0，否则无法处理反向传播过程。`ReLU` 在输入为负时梯度等于 0 的这一特性被称为死亡 ReLU 问题。


    为了防止死亡 ReLU 问题，可以使用两种 ReLU 变变体，即 Leaky ReLU 函数和 Parametric ReLU 函数。Leaky ReLU
    函数输出 `X` 和 `0.1*X` 之间的最大值。换句话说，当 `X` 大于 0 时，Leaky ReLU 等于恒等函数；当 `X` 小于 0 时，它等于
    0.1 与 `X` 的积。该函数提供如下：`F(X)=max (0.1*X, X)`。该函数具有一个值为 0.1 的小正梯度，使得该函数支持负值的反向传播。然而，它可能无法为这些负值提供一致的预测。


    Parametric ReLU 函数类似于 Leaky ReLU 函数，它将梯度作为参数引入神经网络以定义 `X` 为负时的输出。该函数的数学公式如下：`F(X)=max
    (aX, X)`。ReLU 函数还有其他变体，例如指数线性 ReLU。这种函数与 Leaky ReLU 和 Parametric ReLU 等变体不同，在
    `X` 的负值处具有对数曲线，而不是 Leaky ReLU 和 Parametric ReLU 函数那样的线性曲线。该函数的缺点是它在较大的负 X 值处会饱和。存在其他变体，它们都依赖于同一个概念：当
    `X` 为负值时定义大于 0 的梯度。


    Softmax 函数是另一种用途不同的激活函数。该函数通常只应用于输出层，当需要将输入分类为几个不同的类别时。事实上，Softmax 函数支持多个类别，并提供输入属于特定类别的概率。它将每个类别的输出归一化到
    0 和 1 之间，然后除以总和以提供该概率。考虑到所有这些激活函数，每个都有其优缺点，现在的问题是神经网络中应该用哪一个？答案是，对手中问题有更好的理解将有助于选择特定的激活函数，特别是如果预先知道待近似函数的特征。例如，Sigmoid
    函数是分类问题的良好选择。在未知待近似函数的性质的情况下，建议从 `ReLU` 函数开始，而不是尝试其他激活函数。总来说，ReLU 函数在广泛的应用中效果良好。这是一项持续进行的研究，你也可以尝试自己的激活函数。


    '
