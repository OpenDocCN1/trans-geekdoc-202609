    # Chapter 7 - Unsupervised Machine Learning


    Now that we have explored a bit about supervised machine learning, it is time
    to explore other options that you can work with when it comes to machine learning.
    The first one that we spent some time talking about was supervised learning. Learning
    is designed in a way where you will show the computer some examples, and then
    you teach that computer how you would like it to respond based on the given examples.
    There are going to be a lot of programs where this technique is going to end up
    working well for you. But, when you think about showing hundreds or thousands
    of different examples to your computer, it is all going to seem pretty tedious.
    And then there are times when the program isn’t going to be able to learn this
    way and still give you the expected results. This is where the other two types
    of machine learning are going to come into play. This is where you will find unsupervised
    machine learning is going to come into play. This Phase is going to spend some
    more time talking about unsupervised machine learning and what it is all about.
    Unsupervised machine learning is going to be a type of learning that is going
    to happen if your algorithm makes mistakes and can learn from these mistakes along
    the way. And the program can do it even without having an associated response
    to work from. This may sound a bit confusing, but it is going to be teach the
    computer through trial and error, without it having to work with a million examples
    to make sure it behaves how you would like it to do. With these different algorithms,
    it is possible they figure out and analyze the patterns in the data based on any
    provided input from you or the user. The good news here is that there are going
    to be a few different algorithm types that you can work with when you decide to
    choose unsupervised machine learning. The algorithm that you choose to work with
    is going to take the data that you have, and it will restructure it so that the
    data can fall into one of your classes. These classes are nice because they make
    it easier for you to see the information nice and sorted out, and it makes it
    so much easier for you to look through the information. There are many times when
    you will use this machine learning because it can set up your computer, or another
    device, to do most of the work of learning, without having a person sit there
    and writing out all of the instructions. The computer will do some trial and error
    and figure out how it should act over time.


    Let’s take a look at an example. If you have a company that has a considerable
    amount of data that they want to read through, such as data they want to use to
    make predictions and make decisions about how to act in the future, and you may
    want to work with the machine learning. You don’t want to have one or two people
    go through this information. It would take up too time and effort to get this
    all done. But unsupervised machine learning is going to do the work for you. Search
    engines also often use unsupervised machine learning.


    ## Working With Unsupervised Learning


    Before we get too far into some of the techniques that can be used with unsupervised
    machine learning, it is essential to understand a little bit about it. When you
    are working in a real-world environment, when are going to be times your machine,
    either in artificial intelligence or a robotic role, won’t be able to access the
    optimal answer with the information that you provided. Maybe there isn’t even
    an optimal answer to the question. You want to make sure that this robot or machine
    can explore the world all on its own, and learn how to do things just by taking
    a look at the patterns available. In most cases, unsupervised learning is for
    learning the structure, or even the probability distribution of data. But what
    does this mean? We are going to spend some time talking about some of the different
    examples where you can use unsupervised learning to help get things done. There
    are a few different ways you will be able to work with unsupervised learning.
    Often, it is to help the computer or the machine find the answers or needed results,
    without you having to explain it out. With unsupervised learning, the computer
    is going to learn how to behave based on past performance and feedback. This can
    be nice because you will be able to insert the information that you want, and
    the computer will do the work.


    ### Density Estimation


    You should know at this point that we use the probability density function, or
    `PDF`, to tell us the probability that will occur of a random variable. Density
    estimation is the process of taking samples of data of the random variable and
    figuring out the probability density function. After you learn the distribution
    of the variable, you will be able to use machine learning to generate your samples
    of the variable based on this information. For example, at a higher level, you
    could take Shakespeare and learn its distribution. You can then take this information
    and generate out a text that looks very similar to what you would find with Shakespeare.


    ### Latent Variables


    Many times, you will want to know some of the underlying or the hidden causes
    of the data you are looking at. You can consider these hidden, missing, or latent
    variable. For example, say that someone gives you a set of documents, but they
    don’t tell you what these documents are. You would be able to use the clustering
    option with machine learning to find out that there are a few distinct groups
    of information in the document. The machine learning would be able to tell you
    this information rather than you having to read through it all. After you have
    done clustering, you can read through a few of the documents in this data set
    and find out that maybe one is children’s books, one is a romance novel, and so
    on. There are several different types of clustering that you can work with. You
    would use this information any time when the data is too big that it doesn’t make
    sense to go through all of it on your own. The clustering process will be able
    to summarize the data to help you sort it all out. There are a few different techniques
    that you can use when it is time to work with machine learning of this kind. Some
    of the methods or the algorithms that tend to work the best here are going to
    include:


    - Neural networks

    - Markov algorithm

    - Clustering algorithm

    '
