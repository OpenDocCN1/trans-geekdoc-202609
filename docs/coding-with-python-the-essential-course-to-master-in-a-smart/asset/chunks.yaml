    # Conclusion


    Practice makes perfect. When learning a new language like Chinese or Spanish,
    experts recommend you use it every day in the form of speaking and going through
    an exercise or so. It’s no different with a programming language. The more you
    practice, the more the basic syntax will become second nature to you, and you’ll
    instinctively know when to use concepts like conditionals and loops. There are
    lots of resources (which you find in the appendix) that provide exercises and
    sample programs you can work on right away.


    ## Write by hand


    When you’re taking notes (and you should take notes), write them out by hand.
    Studies show that the process of taking physical pen to physical paper facilitates
    the best long-term memory retention. Writing by hand includes writing code by
    hand, and then checking it on your computer, so you know for sure if it’s accurate.
    Outlining code and ideas this way can help you stay organized, as well, before
    starting actually to build a program.


    ## Find other beginners


    Learning to code by yourself can get annoying and frustrating. One of the best
    ways to learn and improve is to find others who are in the same phase as you.
    You can bounce ideas off each other, help out on projects, and more. If you don’t
    know anyone in your immediate circle, you can check out groups online and find
    local events through Meetups and Facebook. Always exercise caution and employ
    safe practices when first meeting people you only know online. Stick to public
    places during daylight hours, and don’t go anywhere alone with someone you don’t
    know well until you feel comfortable.


    ## Try explaining Python out loud


    Sometimes explaining something you just learned to someone is the best way to
    really cement it into your mind. It allows you to reframe concepts into your own
    words. You don’t even have to talk to a real person; it can be an inanimate object.
    This is such a common practice among programmers that it’s known as “rubber duck
    debugging,” which references talking to a rubber duck about bugs in a program.
    Pick a topic in `Python` like conditionals or variables, and see if you can explain
    it. If you have trouble or realize there’s a gap in your knowledge, it’s time
    to go back and keep learning.


    ## Check out other languages


    This is about `Python`, so obviously we believe that should be your priority,
    but getting to know a little bit about other languages can be very helpful, too.
    It will definitely make you a better programmer in the future. Checking out other
    languages can help you discover what typical architecture is built into every
    language as well as the differences between them and `Python`. Even if you just
    read about other languages and never write much code in anything besides `Python`,
    you’ll be improving your knowledge and skill.


    ## Have a plan for when you get stuck


    When you get stuck while coding, take a step back. What are you trying to get
    the code to do? What have you tried? And what’s happening? Write the answers down
    and be as specific and detailed as possible. Then, you can go to someone else
    for help, and you won’t have to spend a ton of time trying to explain the problem.
    The answers are also really useful just for your own thought process. Take a close
    look at any error messages you’re getting. Work your way backward to try and spot
    any mistakes.


    Another response to getting stuck is just to start over. If your code is really
    long, it can be discouraging to start from scratch, but that means you don’t have
    to go through the whole thing, picking it apart and wearing out your eyes. Starting
    over may actually be easier.


    ## Take a break


    Whether you choose to begin again or go through the code with a fine-toothed comb,
    you should take breaks. When you work on a problem for too long, your brain gets
    stuck in a groove, and it’s difficult to come up with new solutions. Do something
    that doesn’t use the exact same muscles as coding. Exercise your body instead,
    take a long shower, lie down for a nap, or bake some cookies. Einstein would often
    come up with solutions to his problems while he played the violin, and who doesn’t
    want to think a little bit like Einstein?

