- raw: 'Chapter 10                     \- Execution and Repetitive Tasks This phase
    deals with if-else statement and different types of loop structures that help
    in repetitive tasks in programming. If Structure So far, the Python programs we’ve
    seen have been instruction-based. In a program, computer instructions are executed
    sequentially. Instructions cannot be skipped, nor repeated backward. The first
    programs were all like this. For example, to make a light come on ten times, repeat
    ten lines of instructions to make the light come on. In order to make the program
    flexible, early programming languages added the function of “jump.” With jump
    instructions, we can jump to any line in the program during execution and continue
    down. For example, to repeat execution, jump to a line that has already been executed.
    Programmers frequently jump forward and backward in their programs, for convenience.
    As a result, the program runs in a sequence that looks like a tangle of noodles,
    hard to read and prone to error. Programmers have come to realize that the main
    function of a jump is to execute a program selectively or repeatedly. Computer
    experts have also argued that with the grammatical results of “selection” and
    “loop,” “jump” is no longer necessary. Both structures change the flow of program
    execution and the order in which instructions are executed. Programming languages
    have entered a structured age. Compared with the “Spaghetti Program” brought about
    by the “jump,” the structured program becomes pleasing to the eye. In modern programming
    languages, the “jump” syntax has been completely abolished. Let’s start with a
    simple example of a choice structure: if a house sells for more than $200,000,
    the transaction rate 3% or 4%. We write a program using a selection structure.
    Below is the program code: Price = 340000 If Expected price> 200000: Fixed tax=
    0.04 Else: Fixed tax= 0.03 Print (fixed tax) #prints 0.03 Output is: 0.04 In this
    process, there’s an if that we haven’t seen before. In fact, the function of this
    sentence is easy to understand. If the total price exceeds 200,000, then the expected
    tax is 4%: otherwise, the transaction rate is 3%. The keywords, if and else, each
    have a line of code attached to them, with a four-space indentation at the beginning
    of the dependent code. The program will eventually choose whether to execute the
    if dependent code or the else dependent code, depending on whether the condition
    after the if holds. In short, the if structure branches off from the program.
    If and else can be followed by more than one line: Price = 340000 If Total > 200000:
    Print ("rate is above 200,000") Fixed tax= 0.04 Else: Print ("rate is below 200,000")
    Fixed tax= 0.03 Print (fixed tax) \# the result is 0.04 Output is: Rate is above
    200,000 As you can see, code that is also an if or else has four spaces indented.
    Keywords if and else are like two bosses, standing at the head of the line. There’s
    a little brother standing back from the boss. The boss only by the terms of winning,
    standing behind his younger brother, has a chance to appear. The last line of
    the print statement also stands at the beginning of the line, indicating that
    it is on an equal footing with it and else. The program doesn’t need conditional
    judgment; it always executes this sentence. Else is not necessary; we can only
    write if program. For example: price= 340000 if price > 200000: Print ("total
    price over $200,000")  Without else, it is effectively equivalent to an empty
    else. If the condition after it doesn’t hold, then the computer doesn’t have to
    do anything. Stand Back Python features indentation to indicate the dependencies
    of your code. As we show, the design for indenting code relationships is derived
    from the ABC language. For comparison, let’s look at how C is written: If (price
    > 0) { Selling= 1; Buying= 2; } The program means that if the variable price is
    greater than 0, we will do the two assignments included in the parentheses. In
    C, a curly brace is used to represent a block of code that is subordinate to the
    if. The average programmer also adds indentation to the C language to distinguish
    the dependencies of instructions. But indenting is not mandatory. The following
    does not indent the code, in the C language can also be normal execution, and
    above the results of the program run no difference: In Python, the same program
    must be written in the following form: If price> 0: Selling= 1 Buying= 2 In Python,
    the parentheses around 0 are removed, the semicolon at the end of each statement
    is removed, and the curly brackets around the block are also removed. There’s
    more—the colon (:) and the indentation of four spaces in front of 1 and 2. By
    indenting, Python recognizes that both statements are subordinate to the if. Indenting
    in Python is mandatory in order to distinguish between dependencies. The following
    procedure will have an entirely different effect: if price> 0: selling= 1 buying=
    2 Here, only selling that is 1 is subordinate to if, and the second assignment
    is no longer subordinate to if. In any case, buying will be assigned to 2. It
    should be said that most mainstream languages today, such as C, C++, Java, JavaScript,
    mark blocks with curly braces, and indentation is not mandatory. This syntax is
    derived from the popularity of the C language. On the other hand, while indenting
    is not mandatory, experienced programmers write programs in these languages with
    indenting in order to make them easier to read. Many editors also have the ability
    to indent programs automatically. Python’s forced indentation may seem counterintuitive,
    but it’s really just a matter of enforcing this convention at the syntactic level
    so that programs look better and are easier to read. This way of writing, with
    four spaces indented to indicate affiliation, is also seen in other Python syntax
    constructs. If Nesting and Elif And then back to the choice of structure. The
    choice of structure frees the program from the tedium of command-and-control permutations.
    A program can have a branching structure inside of it. Depending on the conditions,
    the same program can work in a volatile environment. With Elif Syntax and nested
    use of if, programs can branch in a more colorful way.’ The next program uses
    the elif structure. Depending on the condition, the program has three branches:
    Result= 1 If result > 0:# Condition 1. Since I is 1, this part will perform. Print
    ("positive result") Result= result + 1 Elif result == 0: \# Condition 2. This
    part is not executed. Print ("result is 0")  Result= result\*10 Else: \# Condition
    3. This part is not executed. Print ("negative result") Result= result - 1 There
    are three blocks, led by if, Elif, and else. Python first detects the condition
    of the if, skips the block that belongs to the if the condition is false, and
    executes the else block if the condition of the Elif is still false. The program
    executes only one of three branches, depending on the condition. Since the result
    has a value of 1, only the if part is executed in the end. In the same way, you
    can add more elif between it and else to branch your program. We can also nest
    an if structure inside another if structure: Result = 5 If result> 1:   # this
    condition holds, execute the Internal Code  Print ("result bigger than 1") Print
    ("nice") If result > 2:   # nested if structure, the condition holds. Print ("result
    bigger than 2") Print ("It’s good than before") After making the first if judgment,
    if the condition holds, the program runs in sequence and encounters the second
    if construct. The program will continue to judge and decide whether to execute
    based on the conditions. The second subsequent block is indented four more spaces
    relative to the if to become the “little brother.” Programs that further indent
    are subordinate to the inner if. In general, with the if construct, we branch
    the program. Depending on the conditions, the program will take a different path.
    For Loop Loops are used to iterate through blocks of code. In Python, loops are
    either for or while. Let’s start with the for loop. From the selection structure
    in phase 2.3, we have seen how to use indentation to represent the membership
    of a block. Loops use similar notation. Programs that are part of a loop and need
    to be repeated are indented, such as: for input in \[4,6.8,"love"\]:  print(c)
    #prints each element in the list in turn The loop is to take an element from the
    list \[4,6,8, “love”\] one at a time, assign it to c, and execute the line belongs
    to the program for, which calls the print() function to print out the element.
    As you can see, one of the basic uses of for is to follow in with a sequence:
    For Element in Sequence The number of elements in a sequence determines the number
    of iterations. There are three elements in the example, so print() will be executed
    three times. That is, the number of repetitions of the for loop is fixed. The
    for loop, in turn, takes elements from the sequence and assigns them to the variable
    immediately after the for (a) in the example above. Therefore, even though the
    statements executed are the same, the effect of the same statement changes after
    three executions because the data also changes. One of the conveniences of a for
    loop is to take an element from a sequence, assign it to a variable, and use it
    in a membership program. But sometimes, if we simply want to repeat a certain
    number of times and don’t want to create a sequence, we can use the range() function
    provided by Python: for result in range(3): print("This is crazy")   # print "This
    is crazy" Three Times The 3-way range() function in the program indicates the
    number of times you want to repeat. As a result, the program that belongs to for
    is executed five times. Here, after the for loop, there is still the variable
    I, which counts for each loop: for result in range(7): print(result, "This is
    crazy") # prints the sequence number and "This is crazy"  As you can see, the
    count provided by range() in Python also starts at 0, the same as the index of
    the table. We also saw a new use of print(), which is to specify multiple variables
    in parentheses, separated by commas. The function print() prints them all. Let’s
    look at a practical example of a for loop. We have used Tuples to record the yearly
    interest rate on a mortgage. thisisinteresttuple= (0.06, 0.07, 0.08, 0.1, 0.3) 
    If there is a 200,000-dollar mortgage, and the principal is unchanged, then the
    annual interest to pay is how much? Using the for loop: price= 200000 for interest
    in thisisinteresttuple: debt= price\* interest Print ("you need to pay ", debt)
    While Loop There is also a loop structure in Python, the while loop. The use of
    the While is: check= 0 while check< 20: print(check) check= check+ 1 \# prints
    from 0 to 19  A while is followed by a condition. If the condition is true, the
    while loop continues to execute the statements that belong to it. The program
    will only stop if the condition is false. In the while membership, we change the
    variable I that participates in conditional judgments until it becomes 10 so that
    the loop is terminated before the condition is met. This is a common practice
    for the while loop. Otherwise, if the while condition is always true, it becomes
    an infinite loop. Chapter 11                     \- Variables and Strings A software
    application consists of two fundamental parts: Logic and Data. Logic consists
    of the functionalities that are applied on data to accomplish a particular task.
    Application data can be stored in memory or hard disk. Files and databases are
    used to store data on hard disk. In memory, data is stored in the form of variables.
    Definition of Variable  Variable in programming is a memory location used to store
    some value. Whenever you store a value in a variable, that value is actually being
    stored at physical location in memory. Variables can be thought of as reference
    to physical memory location. The size of the memory reserved for a variable depends
    upon the type of value stored in the variable.  Creating a Variable It is very
    easy to create a variable in Python. The assignment operator “=” is used for this
    purpose. The value to the left of the assignment operator is the variable identifier
    or name of the variable. The value to the right of the operator is the value assigned
    to the variable. Take a look at the following code snippet.  Name = ‘Mike’ # A
    string variable  Age = 15 # An integer variable  Score = 102.5 # A floating type
    variable  Pass = True # A Boolean variable In the script above we created four
    different types of variables. You can see that we did not specify the type of
    variable with the variable name. For instance we did not write “string Name” or
    “int Age”. We only wrote the variable name. This is because Python is a loosely
    typed language. Depending upon the value being stored in a variable, Python assigns
    type to the variable at runtime. For instance when Python interpreter interprets
    the line “Age = 15”, it checks the type of the value which is integer in this
    case. Hence, Python understands that Age is an integer type variable.  To check
    type of a variable, pass the variable name to “type” function as shown below:
    type( Age)  You will see that the above script, when run, prints “int” in the
    output which is the type of Age variables Python allows multiple assignment which
    means that you can assign one value to multiple variables at the same time. Take
    a look at the following script:  Age = Number = Point = 20 #Multiple Assignment 
    print (Age) print (Number) print (Point) In the script above, integer 20 is assigned
    to three variables: Age, Number and Point. If you print the value of these three
    variables, you will see 20 thrice in the output.  For any programming language,
    the basic part is to store the data in memory and process it. No matter what kind
    of operation we are going to perform, we must have the object of operation. It
    is difficult for a skillful woman to cook without rice. In Python language, constants
    and variables are the main ones. Both of them are identification codes used by
    program designers to access data contents in memory. The biggest difference between
    the two is that the contents of variables will change with the execution of the
    program, while the contents of constants are fixed forever. In the process of
    program execution, it is often necessary to store or use some data. For example,
    if you want to write a program to calculate the mid-term exam results, you must
    first input the students'' results, and then output the total score, average score
    and ranking after calculation. This phase describes how to store and access this
    data.  Variable Naming and Assignment  In a program, program statements or instructions
    tell the computer which Data to access and execute step by step according to the
    instructions in the program statements. These data may be words or numbers. What
    we call variable is the most basic role in a programming language, that is, a
    named memory unit allocated by the compiler in programming to store changeable
    data contents. The computer will store it in "memory" and take it out for use
    when necessary. To facilitate identification, it must be given a name. We call
    such an object "variable." For example: \> > firstsample = 3  \> > > second sample
    = 5  \> > > result = firstsample + secondsample  In the above program statement,
    firstsample, secondsample, result are variables, and number 3 is the variable
    value of firstsample. Since the capacity of memory is limited, in order to avoid
    wasting memory space, each variable will allocate memory space of different sizes
    according to requirements, so "Data Type" is used to regulate it.  Variable Declaration
    And Assignment  Python is an object-oriented language, all data are regarded as
    objects, and the method of an Object reference is also used in variable processing.
    The type of variable is determined when the initial value is given, so there is
    no need to declare the data type in advance. The value of a variable is assigned
    with "=" and beginners easily confuse the function of the assignment operator
    (=) with the function of "equal" in mathematics. In programming languages, the
    "=" sign is mainly used for assignment.  The syntax for declaring a variable is
    as follows:  variable name = variable value  e.g. number = 10.  The above expression
    indicates that the value 10 is assigned to the variable number. In short, in Python
    language, the data type does not need to be declared in advance when using a variable,
    which is different from that in C language, which must be declared in advance
    before using a variable. Python interpretation and operation system will automatically
    determine the data type of the variable according to the value of the variable
    given or set. For example, the data type of the above variable number is an integer.
    If the content of the variable is a string, the data type of the variable is a
    string.  Variable Naming Rules For an excellent programmer, readability of program
    code is very important. Although variable names can be defined by themselves as
    long as they conform to Python''s regulations, when there are more and more variables,
    simply taking variables with letter names such as abc will confuse people and
    greatly reduce readability. Considering the readability of the program, it is
    best to name it according to the functions and meanings given by variables. For
    example, the variable that stores height is named "Height" and the variable that
    stores weight is named "Weight." Especially when the program scale is more significant,
    meaningful variable names will become more critical. For example, when declaring
    variables, in order to make the program readable, it is generally used to start
    with lowercase letters, such as score, salary, etc. In Python, variable names
    also need to conform to specific rules. If inappropriate names are used, errors
    may occur during program execution. Python is a case-sensitive language. In other
    words, number and Number are two different variables. Variable names are not limited
    in length. Variable names have the following limitations: the first character
    of a variable name must be an English letter, underlined "\_" and cannot be a
    number. Subsequent characters can match other upper- and lower-case English letters,
    numbers, underlined "\_,” and no space character is allowed. You cannot use Python''s
    built-in reserved words (or keywords). Although Python version 3. X supports foreign
    language variable names; it is recommended that you try not to use words to name
    variables. On the one hand, it is more troublesome to switch input methods when
    inputting program code. On the other hand, the reading of program code will not
    be smooth. The so-called reserved word usually has special meaning and function,
    so it will be reserved in advance and cannot be used as a variable name or any
    other identifier name.  The following is an example of a valid variable name:
    pageresponse  fileName4563 level Number\_ dstance The following is an example
    of an invalid variable name:  2\_sample for $ levelone The user name learning
    classroom uses the help () function to query Python reserved word. The help ()
    function is Python''s built-in function. If you are not sure about the method
    and property usage of a specific object, you can use the help () function to query. 
    The Python reserved words mentioned above can be viewed by using the help () function.
    As long as "help ()" is executed, the help interactive mode will be entered. In
    this mode, the instructions to be queried will be input, and the relevant instructions
    will be displayed.  We can continue to input the instructions we want to query
    in help mode. When we want to exit help interactive mode, we can input Q or quit.
    You can also take parameters when entering the help () command, such as help ("
    keywords "), Python will directly display help or description the information
    without entering help interactive mode. Although Python uses dynamic data types,
    it is very strict in data processing, and its data type is "strong type." For
    example:  \> > > firstsample = 5  \> > > secondsample = "45"  \> > > print (firstsample
    + secondsample) #  shows that TypeError variable firstsample is of numeric type
    and variable secondsample is of string type.  Some programming languages will
    convert the type unconsciously and automatically convert the value A to the string
    type, so firstsample + secondsample will get 545. Python language prohibits different
    data types from operating, so executing the above statement obviously Indicates
    information about the wrong type.  There is a difference between "strongly typed"
    and "weakly typed" in the data types of strong and weak type programming languages
    in small classrooms. One of the trade-offs is the safety of data type conversion.
    The strong type has a strict inspection for data type conversion.  Different types
    of operations must be explicitly converted, and programs will not automatically
    convert. For example, Python and Ruby prefer durable types.  However, most weak
    type programming languages adopt Implicit Conversion. If you don''t pay attention
    to it, unexpected type conversion will occur, which will lead to wrong execution
    results. '
