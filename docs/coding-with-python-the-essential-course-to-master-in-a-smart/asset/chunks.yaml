    # Chapter 5 - Machine Learning Datasets


    Numerous concepts underpin the general knowledge of machine learning. These components
    lay the foundation for understanding the field as well as making the processes
    a go.


    ## Data

    As we have seen earlier, machine learning algorithms learn from examples. The
    most crucial element to note in this phase is the input data and various terms
    used to describe these sets of data. In this phase, I would like to explain data
    in terms of rows and columns, similar to an excel spreadsheet. Data analyzed in
    this method reflects the traditional structure that is commonly used in machine
    learning. The image below is a representation of sets of data used in machine
    learning algorithms.


    ### An image of data sets

    - **Instance**: an instance is a single line (row) of data in a machine learning
    algorithm. A case is an inference from the realm.

    - **Feature**: a feature is a single column of data. An element is a constituent
    of observation and is also known as the attribute of a data instance. A function
    may also be called a metric or a parameter. Some of these metrics may be data
    inputs to an algorithm (the training data, also called the predictors) while others
    may be outputs (the parameters to be determined or predicted).

    - **Data Type**: metrics have different forms of data. Types of data may be actual
    or integer-valued. In other instances, the type of data may have a clear-cut or
    standard value. Additional classes may be in the form of strings, times, lengths,
    etc. When traditional machine learning techniques are used, the various types
    of data are reduced to real values.

    - **Datasets**: a dataset can be defined as a group of instances. Machine learning
    models usually require a few sets of data for various functions.

    - **Training Dataset**: a set of data that is fed into the system to help guide
    the algorithm is called a training dataset. As the name suggests, they train the
    system.

    - **Testing Dataset**: After training the machine learning model, it is essential
    to test their performance. The sets of data that are used to evaluate the accuracy
    of the algorithm are called testing datasets. In other terms, they are called
    validation or evaluation datasets.


    ## Learning

    The focus here is based on machine learning. As seen, machine learning is all
    about training algorithms to perform tasks. In this perspective, lets take a look
    at some concept of learning.


    - **Induction**: the algorithms in various models of machine learning are and
    known as induction or inductive learning. Induction is a process of deciding sweeping
    statements (generalization) from detailed information (training datasets).

    - **Generalization**: The notion is also called sweeping statements. The process
    is vital because the representation set by a machine learning algorithm is required
    to make forecasts. Such findings are based on specific data instances not present
    at the training phase.

    - **Over-Learning**: over-learning is described as the situation where an algorithm
    of machine learning observes the features in the training data too much but still
    fails to perform generalization. This situation is brought about by poor performance
    on data other than the training dataset. This instance is also known as over-fitting.

    - **Under-Learning**: under-learning is a situation whereby machine learning algorithms
    do not observe the training datasets to completion. The process may be caused
    by early termination of the training process — under-learning results in good
    at all but poor performance on all data, not excluding the training dataset. The
    situation is also described as under-fitting.

    - **Online Learning**: online learning methods are instances when the data instance
    form a domain is used to update the system as the data become available. In online
    learning, robust processes that are not affected by noisy data are used. These
    methods can produce models that correspond to the current state domain.

    - **Offline Learning**: Offline learning is when a technique is produced on data
    that is pre-prepared to be used operationally on unlearned data. The process of
    training the system can be carefully tuned since the training dataset is known.
    After the preparation of the model, no further updates are made. This scenario
    may lower the performance in case there is a change in domain.

    - **Supervised Learning**: This is a method of machine learning that is used to
    generalize problems where a forecast is necessary. A “training process” compares
    predictions by the model to known answers and makes corrections in the model.

    - **Unsupervised Learning**: as we talk earlier, unsupervised learning is the
    process of generalization without any training data set being fed to the system.
    In this technique, naturally occurring structures are observed and utilized to
    interpret the relationship between the instances.


    ## Modeling

    A structure that is created by the process of machine learning is considered a
    model. The method of producing models is modeling.


    - **Model Selection**: the process of model selection can be described as the
    process in which configuration and training of a model are done. In every given
    time, the system should present different models to modify, use, or discard. The
    choice of which algorithm to install in machine learning is also a part of model
    selection. For a given problem, the algorithms of machine learning will pick a
    model in which it operates.

    - **Inductive Bias**: a bias is an impartial input in a given model of machine
    learning. All machine learning models are biased to induce an error in the model.
    The failure caused is usually used to test the model or to act as a control set
    of data. Bias can be produced in a model during the configuration phase of the
    training phase. A machine learning algorithm can have a low or high preference
    depending on the input data. There are methods to remove high bias in algorithms.

    - **Model Variance**: variance the sensitivity of a model towards a training data
    set. Generally put, a variation is how a model responds to data input for training.
    A machine learning model can show high or low variance to training datasets. The
    best way to reduce the difference is by running the machine on a dataset over
    and over again. This process is done under different parameters and conditions.
    When variance has diminished the accuracy of the model is enhanced.

    - **Bias-Variance Tradeoff**: a model selection process can be regarded as a trade-off
    of the bias and the variance. The relationship between bias and variance is inverse
    proportionality. A model with low bias will possess high variation and will require
    longtime and continuous training to get a usable model. On the other hand, a model
    with high bias will maintain low variance, which makes it learn faster, but realizes
    adverse and limited performance.

