- raw: "Chapter 9  \\- The Perceptron ![](image_rsrcYS.jpg)Defining Perceptron A perceptron\
    \ is a layer of the neural network that is capable of doing the following. Configuring\
    \ arithmetic values to the core of the data pool and estimating the sum of the\
    \ positive return to the value of 1 for positive (+) outcomes.  In a different\
    \ point of view, a perceptron can also be considered as a model for computation\
    \ that draws a boundary (a line in two-dimensional cases) to isolate two classes\
    \ in a given space.  Initially, the weights and the bias which represents the\
    \ classification hyperplane is usually unknown. In this case, unsystematic weights\
    \ and bias are allocated to the model. The random assignment leads to misclassification\
    \ of points. The Perceptron Trick The objective of the perception trick is decreasing\
    \ the amount of misclassified points. The reduction can be made by sliding the\
    \ line over the space. In other words, it is altering the expression of the hyperplane.\
    \ For all the wrongly categorized points, we adjust the weights and prejudice\
    \ to move the hyperplane closer to the points that are improperly classified.\
    \ After some time, the algorithm will rectify the problem to classify the points\
    \ correctly. However, in this phase, I choose to look at the perceptron differently.\
    \ The approach taken is to identify perceptron in the context of the machine learning\
    \ algorithm. Here, the perceptron is defined as an algorithm that predicts whether\
    \ a given feature belongs to a specific class or not. From this angle, the algorithm\
    \ is considered a binary classifier that is used for supervised machine learning.\
    \ In most cases, the feature to be studied is always represented by a number with\
    \ both magnitude and direction. As a classifier, the perceptron is used for linear\
    \ classification and representation of data in graphical forms. The graphical\
    \ representation model can take either two-dimension or the multi-dimension way.\
    \ The perceptron identifies a feature, weighs its sum, and give an outcome of\
    \ value that is 1 if the weighted summation is higher than the result from other\
    \ function. The equation supports this statement in the image below ![](image_rsrcYT.jpg)When\
    \ the equation edge is substituted (second equation in the image above) and made\
    \ to be constant with the weight of a given parameter, the equation in the image\
    \ below is arrived at. ![](image_rsrcYU.jpg)A single unit of a perceptron algorithm\
    \ can be used to perform a divisible linear equation. The only group works by\
    \ weighting or assigning a weight to both Boolean and positive metrics, with a\
    \ corresponding partiality.  Using a Perceptron to Perform an OR Function ![](image_rsrcYV.jpg)In\
    \ the image above, conditions have been defined in line with the OR function.\
    \ Such terms are meant to meet the optimum model, which requires the summation\
    \ of weighted data to be zero (0) or more than it, for a given outcome of value\
    \ one (1). The summations of the weights have been done a straight line that separates\
    \ the positive (+) values from negative (-) values established.  The Minsky proposal\
    \ set out the standards of learning the features by the use of sample data. The\
    \ proposed models have been described below. Basic Components of Linear Algebra\
    \ Vector The vector value can represent a lot of things depending on the type\
    \ of data and the user. Thus, there is more than one way of describing a vector.\
    \ It may be a feature in space with both directing and magnitude, a structure\
    \ or a database used to keep large amounts of data, etc. for this study; we will\
    \ look at a vector as a line with an arrow being the head and the other point\
    \ without an arrow as the origin. This is not the best definition. However, I\
    \ want you just to grab the end. The images used in this presentation are mined\
    \ from 3Blue1Brown.  Representing a Vector A vector can be expressed in a two-dimension\
    \ and a three-dimension plane, depending on the choice of the user and the function.\
    \ Below is a two-dimensionally described vector(the first image) and a 3-D one\
    \ (the second image. ![](image_rsrcYW.jpg)![](image_rsrcYX.jpg)Calculating the\
    \ Dot Product of Two Vectors Given two vectors (n+1, w) and (n+1, x), their dot\
    \ product is calculated using the formula below. For substitution of value, the\
    \ formula I written in a matrix form. ![](image_rsrcYY.jpg)From the equation,\
    \ the vectors /w/ and /x/ are represented by a line with an arrow. The dimension\
    \ of the vectors is the (n+1) value. The outcome of the computation represents\
    \ the dot product of vectors /w/ and /x/. This result shows the extent to which\
    \ a single vector goes to the direction of the other vector. A perceptron creates\
    \ a line that separates the positive value from the negative ones. This line is\
