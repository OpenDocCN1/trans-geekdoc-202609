- raw: 'Chapter 8  \- Learning in Artificial Neural Networks Definition Of Artificial
    Neural Network A widely used approach in machine learning, the employment of artificial
    neural network is inspired by the brain system of humans. The objective of neural
    networks is replicating how the human brain learns. The neural network system
    is an ensemble of input and output layers and a hidden layer that transforms the
    input layer into useful information to the output layer. Usually, several hidden
    layers are implemented in an artificial neural network. The figure below presents
    an ![](image_rsrcYP.jpg)example of a neural network system composed of 2 hidden
    layers: Example of an artificial neural network Before going further and explaining
    how neural networks work, let’s first define what is a neuron. A neuron is simply
    a mathematical equation expressed as the sum of the weighted inputs. Let’s consider
    X={x1, x2,….xM} a vector of N inputs, the neuron is a linear combination of all
    inputs defined as follows:  F(X={x1, x2,….xM})=w1x1+w2x2+….+wMxM; With w1, w2,…wM
    is the weights assigned to each input. The function F can also be represented
    as: F(X) =WX, With W a weight matrix and X a vector of data. The second formulation
    is very convenient when programming a neural network model. The weights are determined
    during the training procedure. In fact, training an artificial neural network
    means finding the optimal weights W that provide the most accurate output. To
    each neuron, an activation function is applied the resulted weighted sum of inputs
    X. The role of the activation function is deciding whether the neuron should be
    activated or not according to the model’s prediction. This process is applied
    to each layer of the network. In the next sub-phases, we will discuss in details
    the role and types of activation functions as well as the different types of neural
    networks.  What Is An Activation Function And Its Role In Neural Network Models?
    Activation functions are formulated as mathematical functions. These functions
    are a crucial component of an artificial neural network model. For each neuron,
    an activation function is associated. The activation function decides whether
    to activate the neuron or not. For instance, let’s consider the output from a
    neuron, which is: Y=∑ (weight\*input) +bias. The output Y can be of any value.
    The neuron does not have any information on the reasonable range of values that
    Y can take. For this purpose, the activation function is implemented in the neural
    network to check Y values and make a decision on whether the neural connections
    should consider this neuron activated or not.  There are different types of activation
    functions. The most instinctive function is the step function. This function sets
    a threshold and decides to activate or not activate a neuron if it exceeds a certain
    threshold. In other words, the output of this function is 1 if Y is greater than
    a threshold and 0 otherwise. Formally, the activation function is: F=’activated’
    or F=1; if Y> threshold F=’not-activated’ or F=0; otherwise. This activation function
    can be used for a classification problem where the output should be yes or no
    (i.e., 0 or 1). However, it has some drawbacks. For example, let’s consider a
    set of several categories (i.e., class1, class2, …, etc.) to which input may belong
    to. If this activation function is used and more than one neuron is activated,
    the output will be 1 for all neurons. In this case, it is hard to distinguish
    between the classes and decide into which class the input belong to because all
    neuron outputs are 1. In short, the step function does not support multiple output
    values and classification into several classes.  Linear activation function, unlike
    the step function, provides a range of activation values. It computes an output
    that is proportional to the input. Formally: F(X)=WX, where X is the input. This
    function supports several outputs rather than just a 1 or 0 values. This function,
    because it is linear, does not support backpropagation for model training. Backpropagation
    is the process that relies on function derivative or gradient to update the parameters,
    in particular, the weights. The derivative (i.e., gradient) of the linear activation
    function is a constant which is equal to W and is not related to changes in the
    input X. Therefore, it does not provide information on which weights applied to
    the input can give accurate predictions. Moreover, all layers can be reduced to
    one layer when using the linear function. The fact that all layers are using a
    linear function, the final layer is a linear function of the first layer. So,
    no matter how many layers are used in the neural network, they are equivalent
    to the first layer, and there is no point of using multiple layers. A neural network
    with multiple layers connected with a linear activation function is just a linear
    regression model that cannot support the complexity of input data.  The majority
    of neural networks use non-linear activation functions because, in the majority
    of real-world applications, relations between the output and the input features
    are non-linear. The non-linear functions allow the neural network to map complex
    patterns between the inputs and the outputs. They also allow the neural network
    to learn the complex process that governs complex data or high dimension data
    such as images, audios, among others. The non-linear functions allow overcoming
    the drawbacks of linear functions and step functions. They support backpropagation
    (i.e., the derivative is not a constant and depends on the changes of the input)
    and stacking several layers (i.e., the combination of non-linear functions is
    non-linear). Several non-linear functions exist and can be used within a neural
    network. In this phase, we are going to cover the most commonly used non-linear
    activation functions in machine learning applications.  The sigmoid function is
    one of the most used activation functions within an artificial neural network.
    Formally, a sigmoid function is equal to the inverse of the sum of 1 and the exponential
    of inputs: F(X) =1/ (1+exp (-X)) Outputs of a sigmoid function are bounded by
    0 and 1. More precisely, the outputs take any value between 0 and 1 and provide
    clear predictions. In fact, when the X is greater than 2 or lower than -2, the
    value of Y is close to the edge of the curve (i.e., closer to 0 or 1).  ![](image_rsrcYR.jpg)Sigmoid
    activation function The disadvantage of this activation function, as we can see
    from the figure above, is the small change in the output for input values under
    -4 and above 4. This problem is called ‘vanishing gradient’ which means that the
    gradient is very small on horizontal extremes of the curve. This makes a neural
    network using the sigmoid function, learning very slow when they approach the
    edges and computational expensive.  The tanh function is another activation function
    used that is similar to the sigmoid function. The mathematical formulation of
    this function is: F(X)=tanh(X)=\[2/(1+exp(-2X)\]-1. This function is a scaled
    sigmoid function. Therefore, it has the same characteristics as the sigmoid function.
    However, the outputs of this function range between -1 and 1, and the gradient
    are more pronounced than the gradient of the sigmoid function. Unlike the sigmoid
    function, the tanh function is zero-centered, which makes it very useful for inputs
    with negative, neutral, and positive values. The drawback of this function, as
    for the sigmoid function, is the vanishing gradient issue and computationally
    expensive.  The Rectified Linear Unit function or what is known as ReLu function,
    is also a widely used activation function, which is computationally efficient.
    This function is efficient and allows the neural network to converge quickly compared
    to the sigmoid and tanh function because it uses simple mathematical formulations.
    ReLu returns X as output if X is positive or 0 otherwise. Formally, this activation
    function is formulated as  F(X)=max(0,X). This activation function is not bounded
    and takes values from 0 to +inf. Although it has a similar shape as a linear function
    (i.e., this function is equal to identity for positive values), the ReLu function
    has a derivative. The drawback of the ReLu is that the derivative (i.e., the gradient)
    is 0 when the inputs are negative. This means as for the linear functions, the
    backpropagation cannot be processed, and the neural network cannot learn unless
    the inputs are greater than 0. This aspect of the ReLu, gradient equal to 0 when
    the inputs are negative, is called dying ReLu problem. To prevent the dying ReLu
    problem, two ReLu variations can be used, namely the Leaky ReLu function and the
    Parametric ReLu function. The Leakey ReLu function returns as output the maximum
    of X and X by 0.1. In other words, the leaky ReLu is equal to the identity function
    when X is greater than 0 and is equal to the product of 0.1 and X when X is less
    than zero. This function is provided as follows:  F(X)=max (0.1\*X, X) This function
    has a small positive gradient which o.1 when X has negative values, which make
    this function support backpropagation for negative values. However, it may not
    provide a consistent prediction for these negative values.  The parametric ReLu
    function is similar to the Leaky ReLu function, that takes the gradient as a parameter
    to the neural network to define the output when X is negative. The mathematical
    formulation of this function is as follows: F(X)=max (aX, X) There are other variations
    of the ReLu function such as the exponential linear ReLu. This function, unlike
    the other variations of the ReLu the Leaky ReLu and parametric ReLu, has a log
    curve for negative values of X instead of the linear curves like the Leaky ReLu
    and the parametric ReLu functions. The downside of this function is it saturates
    for large negative values of X. Other variations exist which all relies on the
    same concept of defining a gradient greater than 0 when X has negative values. 
    The Softmax function is another type of activation function used differently.
    This function is usually applied only to the output layer when a classification
    of the inputs into several different classes is needed. In fact, the Softmax function
    supports several classes and provides the probability of input to belong to a
    specific class. It normalizes outputs of every category between 0 and 1 then divides
    by their sum to provide that probability.  Given all these activation functions,
    where each one has its pros and cons, the question now which one should be used
    in a neural network? The answer is simply having a better understanding of the
    problem in hand will help guide into a specific activation function, especially
    if the characteristics of the function being approximated are known beforehand.
    For instance, a sigmoid function is a good choice for a classification problem.
    In case the nature of the function being approximated is unknown, it is highly
    recommended to start with a ReLu function than try other activation function.
    Overall, ReLu function works well for a wide range of applications. It is an ongoing
    research, and you may try your own activation function.  '
