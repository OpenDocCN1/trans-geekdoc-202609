    # 第一章 Python 编程基础


    ## 如何安装 Python

    在当今，精通技术是时代的需求，而知识的匮乏会让人被归类为落后。这可能导致在职业世界中被边缘，特别是在编程领域。许多大公司为了品牌建设以及削减 IT 成本，雇佣了自己的程序员。在编程世界中，事实证明使用
    `Python` 语言被认为更简单且对程序员更友好，因此被广泛使用。


    在本次特定的演示中，我们选择了 Windows，因为它是全球最常用的系统——即使在一些不那么发达的国家也是如此。我们希望满足全球每个人的编程需求。选择 `Python
    2.7.12` 版本是因为该版本桥接了旧版本 2 和新版本 3 之间的鸿沟。版本 3 的某些更新函数/应用程序仍然与某些设备兼容，因此 `2.7.12` 是一个聪明的选择。


    ### 在 Windows 上下载并安装 Python 2.7.12 的步骤

    1. 在浏览器中输入 `python` 并按搜索按钮显示搜索结果。

    2. 向下滚动找到你感兴趣的项目。在本例中，你正在寻找 `python`。

    3. 点击“python releases for windows”，打开一个新页面。

    4. 选择 Python 版本，`python 2.7.12` 并点击，或者你可以选择与你的设备或 `OS` 兼容的版本。

    5. 新页面包含各种 `python` 类型。向下滚动并选择一个选项：在本例中，选择 `Windows x86 MSI installer` 并点击。

    6. 点击屏幕底部的 Python 框。点击 `Run` 按钮并等待新窗口出现。

    7. 选择你需要的用户选项并按 `NEXT`。你的屏幕将显示你的 `python` 将所在的硬盘。

    8. 点击 `NEXT` 按钮。点击 `yes`，然后等待几分钟。有时取决于你的互联网速度，应用程序下载可能需要更的时间。

    9. 之后，点击 `FINISHED` 按钮表示安装完成。

    10. 你的 `python` 已经安装在计算机中并现在已准备可以使用。在 `C` 盘或你保存它的任何地方找到它。在此过程中可能会出现故障，但本文中提供了选项。如果你遵循得良好，没有理由无法完成这项任务。


    注意的是，不需要编译程序。`Python` 是一种解释型语言，可以快速执行你的命令。遵循程序本身提示的逐步说明。在你的计算机中保存并运行程序。


    ### 对于 Mac

    要在 Mac 上下载 `Python`，你可以遵循类似的步骤，但这次你将不得不访问 `Python.mpkg` 文件来运行安装程序。


    ### 对于 Linux

    对于 Linux，`Python` 2 和 3 可能已经默认安装。因此，首先检查你的操作系统。你可以通过访问命令提示符并输入内容：`python--version`
    或 `python3--version` 来检查设备是否已拥有 `Python` 程序。如果 Linux 中没有安装 `Python`，将显示结果 `command
    not found`。你可能需要下载 `Python 2.7.12` 以及任何版本的 `Python 3`。这是由于 Linux 与 `3` 有更好的兼容性。


    对于 Windows 用户，现在你已经下载了程序，已经准备好开始了。是的，祝喜！你现在可以开始使用你的编程系统工作并享受乐趣。


    ## 你必须学会的基础 Python 术语

    Python 是一种用于计算机编程的语言。因此，你必须熟悉最常用的术语以方便使用语言。这就像在阅读或写下第一个字母之前学习 ABC 一样。重要的是，不同版本之间可能存在细微的差异。


    **字符串 (Strings)**：封装在双引号、单引号或三引号内部的值。它们可以是单词/文本、一组单词、一个 Unicode 或其他项目。例如：

    `string = ''welcome''`

    `string = "welcome"`

    `string = ''My little corner.''`

    双引号的优势是你可以在双引号内包含值。三引号表示长字符串或冗长的字符串。它们对于避免获取 `EOL (行末符)` 错误很有用。


    **变量 (Variables)**：用于字符串的容器。在 `Python` 语言中，这些通常是对象。它们可以是数字或字符串。记住，你必须在使用变量之前对其进行声明。数字可以是浮点数或整数。使用此语法定义整数和浮点数。整数是整数，而浮点数通常是带有小数点的数字。例如：

    `int = 9`

    `float = 9.0`


    **语句 (Statements)**：陈述性句子或语法，用于调用函数进行计算、写入值或其他在执行或执行命令时所需的程序。


    **列表 (Lists)**：用于你想要创建的项目的普通列表。它们可以包含你想要包含在列表中的任何变量。它们可以比较数组。变量通常封装在括号中，项目或值用逗号分隔。列表之间可以使用分号。列表是不可变文件——意味着它们不能被更改。值封装在单引号或双引号中，而数字不是。例如：

    `list1 = [''chemistry'', ''anatomy'', 2015, 2016]`

    `list2 = [10, 20, 30, 40, 50]`

    `list3 = [''grades'', ''addresses'']`

    当你添加函数 `print` 并按回车或执行时，这将出现。请注意颜色的变化，这些颜色可以识别命令或函数（红色单词）、变量（绿色）以及结果（蓝色单词）。例如：

    `string4 = ["Vanessa Redgrave", "Tom Cruise", "Mel Gibson", "Matt Damon"]`


    **循环 (Loops)**：可以一个接一个重复执行或执行一次的语句。循环循环有两种通用类型：`for` 循环和 `while` 循环。


    **函数 (Function)**：执行某些功能或逻辑的代码段。例如 `print`，它打印你的输入或变量；`pow`（幂），它获取你的数字的特定幂的答案。一个特定的例子是：为了知道
    `89` 的值，你可以使用 Python 函数 `pow`。在你的 Python 壳中输入此语句：

    ```python

    pow(8,9)

    ```

    当你按下回车或执行键时，答案将出现：在上面的特定示例中，答案是 `134217728`。


    **模块 (Modules)**：包含各种项目的文件，例如变量、函数定义和可执行语句等。当你想要保存创建的函数以便于访问时，就会使用模块。这是因为在在使用
    Python 解释器之后，你创建的所有定义、变量和函数都将丢失。因此，你需要将它们编译在模块中，以便在任何需要的时候再次使用它们。Python 会自动要求你保存文件，所以你永远不会忘记这个功能。你的模块应该用分配给它们的名称和后缀
    `.py` 保存。


    **外壳 (Shells)**：你编写 Python 命令或语句的空白框。


    **元组 (Tuples)**：与列表类似；它们是不可变的。你不能更改它们。然而，你可以创建新的元组来修改旧的。它们也可以用作字典的键。


    **类 (Classes)**：相关数据的组，类似于使用相关函数的字符串、整数和列表。要引入或识别一个类，你可以使用函数词 `class`。


    **对象 (Objects)**：在 `Python` 语言中大量使用，因为 Python 是面向对象的。这意味着用户可以根据它们是什么来命名文件。一个例子是当用户将地理数据命名为
    `Geo`，或将气候变化的研究数据命名为 `climchange` 时。


    **拼接 (Concatenation)**：Python 中连接的字符串或变量。你可以通过 `join()` 程序或 `+` 符号将小字符串组合成较大的字符串。


    ## 机器学习

    机器学习是由许多不同部分组成的，这些部分可以以人类的方式检索、存储和处理数据。通过做到这些，它将自己从不确定状态带到自学习模式。


    ### 机器学习历史

    Deep Blue 是一种智能电子设备，它在 1997 年在国际象棋中击败了冠军。这是偶然发生的吗？不，这台电子设备是专门为了这这一点而编程的。如果被赋予不同的挑战，这台电子设备可能会发生故障。所以，是时候回到图纸，用新的程序、新的感知和新的规则重新开始了。如此，你可以使用精通新原型的算法，而不是依赖硬编码的规则。


    ### 机器学习类型

    使用这种学习的想法在几年前就已经出现了，但让电子设备独立提供复杂的数学思想（如测量或统计）是几年前在这一行业内完成的新想法。同样，有不同类型的机器学习，它们与固定类型的机器学习算法工作。在指南阶段，我们将讨论这些类型。


    ### 监督机器学习

    监督机器学习只能处理简单的任务和它识别的算法。只有当电子设备可以访问预编程的输入-输出数据时，这些任务才能被执行。


    '
