    # 第 3 章 - Python 中的核心库与工具


    我们需要查看的库被称为 `PyTorch`。这是一个基于 Python 的包，用于科学计算，它依赖于图形处理器（GPU）提供的动力。该库也是研究领域最常用且最首选的深度学习平台之一，能够在我们在处理过程中提供最大的灵活性和极高的速度。这种库具有许多优势，并以提供其他所有深度学习库中具备的两个最高级特性而闻名。这些特性包括支持强
    GPU 加速的张量计算，以及可以在基于带（tape-based）的自动梯度系统上构建深度神经网络。Python 中有很多不同的库可以帮助我们处理想要开展的许多人工智能和深度学习项目，而
    `PyTorch` 库就是其中之一。该库如此成功的关键原因之一是它是完全 Python 风格（Pythonic）的，几乎可以毫不费力地构建你想要构建的神经网络模型。这是一个较新的深度学习库，但该领域也充满了动力。


    ## PyTorch 的起源


    正如我们上面提到的，`PyTorch` 是目前支持 Python 运行并帮助进行深度学习的最新库之一。尽管它在 2016 年 1 月才刚刚发布，但它已经成为数据科学家喜欢使用的首选库之一，主要因为它可以轻松构建复杂的神经网络。这对于许多过去完全无法处理这些神经网络的初学者来说是完美的。即使编程经验有限，他们也可以使用
    `PyTorch` 并在短时间内构建出自己的网络。


    这个 Python 库的创建者设想，当他们想要尽可能地运行许多数值计算时，这个库将是至关重要的。这是理想的方法论之一，而且完美契合了我们在 Python 中看到的编程风格。该库结合
    Python 库，允许神经网络的调试器、机器学习开发者和深度学习科学家不仅能够运行，而且能够实时测试代码的部分。这是一个好消息，因为这意味着这些专业人士不再需要等待整个代码完成并执行，就可以检查这段代码是否有效，或者他们是否需要修复某些部分。


    除了 `PyTorch` 库自带的一些功能外，请记住你还可以通过添加其他 Python 包来扩展该库的功能。像 `Cython`、`SciPy` 和 `NumPy`
    这样的 Python 包也与 `PyTorch` 配合得很好。


    尽管有这些优势，我们可能仍然对为什么 `PyTorch` 库如此特殊，以及为什么在需要为深度学习构建所需模型时我们想要使用它感到疑问。答案很简单，主要是因为
    `PyTorch` 被视为动态库。这意味着该库是灵活的，你可以根据自己的任何需求和更改来使用它。它在完成这项工作做得非常出色，以至于被许多行业的人工智能开发者、学生和研究人员所使用。事实上，在一次
    Kaggle 竞赛中，几乎所有进入前十的个人都使用了这个库。虽然 `PyTorch` 库具有许多优势，但我们需要从各行专业人士如此喜爱这种语言的一些亮点开始说起。其中一些亮点包括：


    1. 界面简单易用。`PyTorch` 接口将为我们提供一个易于使用的 API。这意味着发现像使用 Python 一样操作和运行它非常简单。

    2. 它在本质上是 Python 风格的。由于该库被认为是 Python 风格的，它将平滑地集成到 Python 数据科学栈中进行工作。那些不想在此过程中使用其他编程语言、只想坚持
    Python 基础知识和某些强大功能的人，可以通过这个库来实现目标。你将利用 Python 环境提供的所有功能和服务优势。

    3. 计算图：`PyTorch` 库的另一个亮点是它将为我们提供带有动态计算图的平台。这意味着你甚至可以在运行时更改这些图。每当你需要处理某些图且不确定在创建神经网络模型时需要使用多少内存时，这将非常有用。


    '
