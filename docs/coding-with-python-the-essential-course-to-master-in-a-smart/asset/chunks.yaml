    ## 第 2 章 - 什么是 Scikit-Learn，我为什么应该学习它？


    在涉及到 Scikit-Learn 环境和库时，你会有很多令你享受的内容。这是你使用 `Python` 工作时可以提供的最佳选择之一，它将让你的机器学习项目比以前成功得多。如果你是一个正在学习如何处理机器学习流程的程序员，或者你想在你的
    `Python` 代码中实现更多功能，那么你就需要确保自己对这个库及其工作原理有良好的理解。


    `Scikit-Learn` 库开发于 2007 年。后来，公司开始成长，并随着时间的推移发生了许多变化。目前，它拥有超过 30 个活跃贡献者，甚至还有来自
    `INRIA`、`Google` 和 `Python Software Foundation` 的部分付费赞助，以确保该库能够持续开发。而且这一切都是以一种确保用户无需付费即可使用的方式完成的！但这引发了一些关于该库以及它本质是什么的问题。这个库将确保计算机程序员对于他们想要做的无监督学习和监督学习都有大量的算法。这些算法经过了调整，以保持与
    `Python` 环境的一致。这意味着你可以使用这些算法并完全在 `Python` 上进行某些机器学习项目的工作。


    这个特定的库将根据所谓的“许可性简化版 BSD 许可证”（permissive simplified BSD license）进行授权，许多 Linux 发行版也可以使用它。它将使用
    `SciPy` 库构建，这有助于让事情变得更加简单。该库内部包含的你在处理机器学习时会发现它非常有用的技术栈包括：


    1. `NumPy`: 这是一个非常好用的工具，因为它允许你处理 n 维数组包

    2. `SciPy`: 如果你希望在科学领域进行计算，这将是一个需要使用的基础性库。

    3. `Matplotlib`: 这是一个很好用的库，因为它可以帮助你进行一些绘图，无论是 2D 还是 3D。

    4. `IPython`: 这是一个很好用的库，因为它能为你提供一个比其他工具更增强、交互性控制台。

    5. `Sympy`: 如果你想在符号数学中进行一些操作，这是一个运行良好的库。

    6. `Pandas`: 这是你需要使用的第一部分，因为它包含了使机器学习成功所需的所有分析和数据结构。


    你可以与 `SciPy` 一起使用的不同扩展和模块统称为 `SciKits`。这就是为什么我们提供所需学习算法的模块被称为 Scikit-Learn 库。这个库带来的愿景将包含比你探索的其他某些主题多得多的支持和稳健性。这是一件好事，因为这两者都需要较高水平，以确保生产系统按照我们预期和想要的方式运行。在这一过程中，必须对关注点有更深入的关注，包括易用性、协作、文档、代码质量和性能，否则它无法按照我们的意运行。


