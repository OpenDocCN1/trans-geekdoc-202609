- raw: "SLR comprises a single independent variable, while MLR, as the name suggests,\
    \ has multiple independent variables. To find the best-fit line, one needs to\
    \ fit a curvilinear or polynomial regression.  Sometimes, instead of a straight\
    \ line, a curve may represent the relationship between two different variables.\
    \ Nevertheless, in terms of linear regression, this does not mean that such relationships\
    \ are non-linear. Rather, this is a type of relationship where an increase in\
    \ one variable will lead to an increase in the other variable up to a certain\
    \ level. Afterward, as continues to increase, the other one will decrease. Therefore,\
    \ graphing this type of curvilinear relationship will produce an inverted-U. A\
    \ curvilinear relationship might also happen whereas one variable goes up, the\
    \ other one goes down up to a certain point, after which, both go up together,\
    \ which will produce a U-shaped curve.   A real-world example of this type of\
    \ relationship is the relationship between customer satisfaction and employee\
    \ satisfaction. When the level of employee satisfaction is high, customer satisfaction\
    \ tends to go up as well, but up to a certain point. When employees are too cheerful\
    \ or happy, customers may perceive it to be annoying or fake, which would lower\
    \ their level of satisfaction. Polynomial regression fits a non-linear relationship\
    \ between the independent variable and the corresponding conditional mean of the\
    \ dependent variable. Developers hypothesize certain relationships as curvilinear.\
    \ Often, such relationships will have a polynomial term. If they try to fit a\
    \ linear model to such relationships, the result achieved will not be appropriate.\
    \ In usual MLR, the assumption is that all independent variables are independent;\
    \ however, this assumption does satisfy polynomial regression. Often, developers\
    \ use polynomial regression to describe or define this type of non-linear relationships,\
    \ which might include: 1.    The spread of disease epidemics 2.    Tissue growth\
    \ rates 3.    Carbon isotope distribution in lake sediments By using polynomial\
    \ regression, developers or researchers can fit a wide range of functions under\
    \ it to fit a wide range of curvature. In addition, this regression model offers\
    \ the best approximation of the relationships between independent and dependent\
    \ variables. However, it is important to understand that polynomial regression\
    \ is extremely sensitive to outliers in the data. Logistic Regression Whereas\
    \ predictions for linear regression are continuous values, those applying to logistic\
    \ regression are discrete values after employing a transformation function. This\
    \ model is ideal for binary classification, which refers to data sets where (y\
    \ = 1 or 0), where 1 identifies the default class. Suppose a researcher wants\
    \ to predict whether something will happen or not. In this case, there are only\
    \ two possibilities; i.e., it will happen, which he will denote as (1), or it\
    \ will not happen, which will be (0). That said, in spite of its name, it is important\
    \ to understand that this is a classification algorithm, not a regression technique.\
    \ Many experts, however, insist it is a regression model. Essentially, this algorithm\
    \ estimates discrete values, such as true/false, yes/no, or 0/1, based on independent\
    \ variables. For example, if a teacher gives a student a puzzle to solve, the\
    \ student will either solve it or fail to solve it.  In linear regression, the\
    \ assumption is that data follows a linear function. In the same way, logistic\
    \ regression algorithms apply the sigmoid function when it comes to modeling data.\
    \ Only after reaching the decision threshold does logistic regression become a\
    \ classification model; therefore, this threshold is a critical aspect of this\
    \ type of algorithm.  The values of precision and recall are the main determinants\
    \ of the value of the threshold. Ideally, both should be 1; however, this is rarely\
    \ the case. Therefore, to choose the right threshold value, the following factors\
    \ come into play: \n\n1.  High Recall/Low Precision \n\nIn programs where developers\
    \ want to minimize false negatives without reducing the number of false positives,\
    \ they often go for a threshold value with a high value for recall and low value\
    \ for precision. A real-world application of this model is an application to diagnose\
    \ cancer.  Users do not want the application to classify patients with cancer\
    \ as healthy without considering the possibility of a wrong diagnosis. This is\
    \ because further medical issues or procedures can confirm the absence of cancer,\
    \ but the detection of cancer cannot happen in an already cleared or rejected\
    \ candidate.  \n\n2.  Low Recall/High Precision \n\nIn programs where developers\
    \ want to lower the occurrence of false positives without lowering the number\
    \ of false negatives, they choose this decision or threshold value. For example,\
    \ if their aim is to classify consumers based on their positive or negative reaction\
    \ to a certain type of marketing strategy, they want to be sure of a positive\
    \ reaction. Otherwise, a negative reaction can have a terrible impact on the company's\
    \ sales and revenue. Therefore, based on the broad range of categories, logistic\
    \ regression can be ordinal, multinomial, or binomial. In other words, it can\
    \ focus on target variables with ordered categories, target variables with more\
    \ than two possible disordered categories, or target variables with only two possible\
    \ types of categories. Decision Tree This is one of the most popular algorithms\
    \ used in machine learning. Every time people ask themselves a question before\
    \ making a choice or decision, their brain is working like a decision tree. For\
    \ example, is it raining outside? If yes, I will take an umbrella. Essentially,\
    \ the aim of this algorithm is to break down information into smaller pieces of\
    \ data based on a particular feature value, until all variables targeted fall\
    \ under a single category.  For instance, suppose a developer wants to build a\
    \ decision tree to determine whether an individual is a child or an adult based\
    \ on height and weight. He could break down the data points based on a set of\
    \ values of one of the two characteristics, such as, for a weight greater than\
    \ 40 kg, the individual is an adult. However, if it is less than that, his subset\
    \ will contain two kids and one adult, which means he will need to separate it\
    \ again, until only one class remains, or until all his subsets are pure.  This\
    \ is a type of supervised machine learning. The aim of this type of algorithm\
    \ is to solve both classification and regression problems. Decision tree algorithms\
    \ use the representation of a tree to solve problems, whereby each leaf node represents\
    \ a class label, while the internal node of the tree represents attributes. Using\
    \ this algorithm, developers can represent any type of Boolean function on certain\
    \ attributes.  This type of algorithm makes several assumptions, including: 1.   \
    \ There is a recursive distribution of records based on attribute values 2.   \
    \ The whole training set is the root at the beginning 3.    The use of statistical\
    \ methods to order attributes as the internal node or root 4.    Feature values\
    \ should be categorical The major challenge in a decision tree algorithm is the\
    \ process of identifying the attribute for the root node, also referred to as\
    \ attribute selection. "
