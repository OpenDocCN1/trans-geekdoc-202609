    # Chapter 3 - Essential Libraries And Tools In Python


    The library that we need to take a look at is known as `PyTorch`. This is going
    to be a Python-based package that works for scientific computing that is going
    to rely on the power that it can receive from graphics processing units. This
    library is also going to be one of the most common, and the preferred, deep learning
    platforms for research to provide us with maximum flexibility and a lot of speed
    in the process. There are a lot of benefits that come with this kind of library.
    And it is known for providing two of the most high-level features out of all the
    other deep learning libraries. These will include tensor computation with the
    support of a strong GPU acceleration, along with being able to build up the deep
    neural networks on an autograd-system that is tape-based. There are a lot of different
    libraries through Python that can help us work with a lot of artificial intelligence
    and deep learning projects that we want to work with. And the `PyTorch` library
    is one of these. One of the key reasons that this library is so successful is
    because it is completely Pythonic and one that can take some of the models that
    you want to build with a neural network almost effortlessly. This is a newer deep
    learning library to work with, but there is a lot of momentum in this field as
    well.


    ## The Beginnings of PyTorch


    As we mentioned above, `PyTorch` is one of the newest libraries out there that
    works with Python and can help with deep learning. Even though it was just released
    in January 2016, it has become one of the go-to libraries that data scientists
    like to work with, mainly because it can make it easy to build up complex neural
    networks. This is perfect for a lot of beginners who haven’t been able to work
    with these neural networks at all in the past. They can work with `PyTorch` and
    make their network in no time at all, even with a limited amount of coding experience.


    The creators of this Python library envisioned that this library would be imperative
    when they wanted to run a lot of numerical computations as quickly as possible.
    This is one of the ideal methodologies that also fits in perfectly with the programming
    style that we see with Python. This library, along with the Python library, as
    allowed debuggers of neural networks, machine learning developers, and deep learning
    scientists to not only run but also to test, parts of their code in real-time.
    This is great news because it means that these professionals no longer have to
    wait for the entire code to complete and execute before they can check out whether
    this code works or if they need to fix certain parts.


    In addition to some of the functionality that comes with the `PyTorch` library,
    remember that you can extend out some of the functionalities of this library by
    adding in other Python packages. Python packages like `Cython`, `SciPy`, and `NumPy`
    all work well with `PyTorch` as well.


    Even with these benefits, we still may have some questions about why the `PyTorch`
    library is so special, and why we may want to use this when it is time to build
    up the needed models for deep learning. The answer with this is simple, mainly
    that `PyTorch` is going to be seen as a dynamic library. This means that the library
    is flexible and you can use it with any requirements and changes that you would
    like. It is so good at doing this job that it is being used by developers in artificial
    intelligence, students, and researchers in many industries. In fact, in a Kaggle
    competition, this library was used by almost all of the individuals who finished
    in the top ten. While there are a lot of benefits that can come with the `PyTorch`
    library, we need to start with some of the highlights of why professionals of
    all sorts love this language so much. Some of these include:


    1. The interface is simple to use. The `PyTorch` interface is going to offer us
    an API that is easy to use. This means that we will find it simple to operate
    and run as we do with Python.

    2. It is Pythonic in nature. This library, since it is considered Pythonic, will
    smoothly integrate to work with the Python data science stack. Those who do not
    want to work with other coding languages along the way, and want to just stick
    with the basics, and some of the power, of Python, will be able to do so with
    this library. You will get the leverage of using all of the functionalities and
    services that are offered through the environment of Python.

    3. Computational graphs: Another highlight that comes with the `PyTorch` library
    is that it is going to provide us with the platform with some dynamic computational
    graphs. This means that you can change these graphs up even during runtime. This
    is going to be useful any time that you need to work on some graphs and you are
    not sure how much memory you need to use while creating this model for a neural
    network.

    '
