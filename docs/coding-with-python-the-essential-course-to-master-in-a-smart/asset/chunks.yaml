    # Chapter 6 - Training Simple Machine Learning Algorithms for Classification


    People are living in one of the most defining periods of human history. However,
    it is not what is happening now that makes the period so exciting; rather, it
    is what is coming in the near future. Today, data scientists and developers can
    use complex algorithms to build powerful data-crunching machines that would have
    seemed like something out of science fiction only a few years ago. There are two
    ways to group the main algorithms, these are:


    1. Grouping them by their similarity in function or form

    2. Grouping them by their learning style


    Grouping algorithms by their similarity in terms of how they work is a useful
    method of categorization. However, it is important to understand that certain
    algorithms can easily fit into several different categories. On the other hand,
    it is common in artificial intelligence and machine learning to first look at
    the different learning styles that an algorithm can use. Algorithms have a small
    number of machine-learning models and learning styles. This way of grouping them
    is useful because it forces developers to consider the model preparation process
    and the roles of the input data to find the most appropriate option needed to
    achieve the best results. The main learning styles in algorithms include supervised
    learning, unsupervised learning, and semi-supervised learning.


    ## 1. Supervised Learning


    Supervised learning aims to predict a target/dependent variable from a given set
    of independent variables or predictors. Using these predictors, developers generate
    functions that match inputs to desired outputs. The training or learning process
    continues until the algorithm achieves the desired level of accuracy. Examples
    of this type of learning model include `Logistic Regression`, `KNN`, `Random Forest`,
    `Decision Tree`, and others.


    ## 2. Unsupervised Learning


    An algorithm using unsupervised learning does not have any outcome or target variable
    to estimate or predict. It is ideal for clustering or grouping population, which
    is helpful when it comes to segmenting consumers in different groups to achieve
    certain objectives. Examples of this type of algorithm are `K-means` and `Apriori
    algorithm`.


    ## 3. Reinforcement Learning


    Developers use this type of algorithm to train machines to take specific actions.
    Essentially, they expose their machine to certain environments where it continually
    trains itself using trial and error, thereby learning from experiences. In the
    process, the machine gains more knowledge to make accurate decisions. An example
    of this type of machine learning is the `Markov Decision Process`.


    ## 4. Semi-Supervised Learning


    This model falls somewhere between supervised and unsupervised learning. Developers
    combine some features present in both models to produce the desired outcome. It
    is one of the most important and useful algorithms for real-world scenarios, where
    all the information available is a combination of unlabeled and labeled data.


    ## Common Machine Learning Algorithms


    Most machine-learning algorithms are applicable to almost any data problem. Some
    of the commonly used learning algorithms include:


    ### Linear Regression


    Initially developed to analyze the relationship between input and output numerical
    values in statistics, linear regression soon caught the attention of the machine
    learning community. Developers use it to estimate or predict real values based
    on continuous variables. These values can include total sales, home costs, number
    of calls, and more. It works by establishing a relationship between dependent
    variables and independent variables by fitting a regression line, also called
    the best-fit line.


    A regression line in the form of `y = a + bx` represents linear regression, where
    `y` is the output variable and `x` is the input variable. The goal, therefore,
    is to determine the values of coefficients `a`, which is the intercept, and `b`,
    which is the slope of the regression line. The aim is to plot a line that is near
    most of the points, which would minimize the error or distance between the line
    and the `y` value of the data point.


    A good way to understand this concept is to use the example of a kid asked to
    arrange his/her classmates based on their weights without measuring their weights
    or asking them to state their weights. Obviously, the kid will analyze them visually
    by looking at their build and height and arrange them accordingly. This is a real-life
    application of linear regression. Essentially, he/she will know that build and
    height would have a relationship to the weight, which explains the equation above.


    There are two types of linear regression. These are:


    1. Simple linear regression

    2. Multiple linear regression

    '
