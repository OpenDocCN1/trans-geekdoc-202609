    # 第 7 章 - 无监督机器学习


    现在我们已经对监督机器学习进行了一些探索，是时候探索一下在处理机器学习时你可以使用的其他选项了。我们之前花了一些时间讨论的第一种方法是监督学习。这种学习的设计方式是向计算机展示一些示例，然后根据给定的示例教计算机你希望它如何做出反应。在很多程序中，这种技术最终都会运行得很好。但是，当你考虑向计算机展示成百上千个不同的示例时，这看起来一切会变得非常繁琐。而且，某些程序无法通过这种方式学习并仍然给你预期的结果。这就是另外两种机器学习大显用场的地方。你会发现无监督机器学习派上了用场。阶段我们将花更多时间讨论无监督机器学习以及它的本质。无监督机器学习是一种学习类型，当你的算法产生错误并在过程中从中学习时它就会发生。程序即使在没有关联响应作为依据的情况下也可以做到。这听起来可能有点困惑，但它将通过试错来教计算机，而不需要通过处理数百万个示例来确保其行为符合你的要求。通过这些不同的算法，它们能够根据你或用户提供的任何输入来发现并分析数据中的模式。好消息是，当你决定选择无监督机器学习时，会有几种不同的算法类型供你选择。你选择的算法将获取你拥有的数据并对其进行重构，使数据属于你的类别之一。这些类别非常有用，因为它们让你更容易看到分类整齐的信息，并让查阅信息变得容易得多。很多时候你会使用这种机器学习，因为它可以设置你的计算机或其他设备来完成大部分学习工作，而不需要人坐在那里编写所有的指令。计算机将进行一些试错，并随着时间的推移确定它应该如何行动。


    让我们来看一个例子。如果你有一家拥有大量数据的公司，例如你想使用这些数据进行预测并对未来如何行动做出决策，你可能想使用机器学习。你不想让一或两个人处理这些信息，完成这些工作将花费太多的时间精力。但无监督机器学习将为你完成这项工作。搜索引擎也经常使用无监督机器学习。


    ## 使用无监督学习


    在我们深入研究用于无监督机器学习的一些技术之前，了解一下它是是有关重要的。当你在现实环境中工作时，会有某些时候你的机器（无论是人工智能还是机器人角色）无法根据你提供的信息获取最优答案。也许该问题根本没有最优答案。你希望确保这个机器人或机器能够独立探索世界，并通过观察可用模式来学习如何做事情。在大多数情况下，无监督学习用于学习数据的结构，甚至是概率分布。这意味着什么呢？我们将花一些时间讨论一些不同的示例，你可以使用无监督学习来帮助完成任务。你有几种不同的方法可以使用无监督学习。通常，它是为了帮助计算机或机器找到答案或所需的结果，而无需你对其进行解释。通过无监督学习，计算机将根据过去的性能和反馈学习如何行为。这可能很棒，因为你可以插入你想要的信息，由计算机来完成工作。


    ### 密度估计


    此时你应该知道，我们使用概率密度函数，即 `PDF` 来告诉我们随机变量发生的概率。密度估计是获取随机变量的数据样本并推出概率密度函数的过程。在学习了变量的分布后，你就可以利用机器学习根据这些信息生成变量的样本。例如，在更高层次的上，你可以获取莎士比亚的作品并学习其分布。然后你可以利用这些信息生成看起来与莎士比亚作品非常相似的文本。


    ### 隐变量


    很多时候，你想知道你所观察的数据某些底层或隐藏原因。你可以将这些视为隐藏的、缺失或潜变量。例如，假设某人给你一组文档，但他们没有告诉这些文档是什么。你可以使用机器学习中的聚类选项来发现文档中存在几组不同的信息。机器学习将能够告诉你这些信息，而不需要你阅读所有内容。在完成聚类后，你可以阅读数据集中的几份文档，并发现其中一本可能是儿童读物，另一本可能是浪漫小说，等等。你有几种不同类型的聚类可以进行工作。每当数据大到让你不适合自己处理所有内容时，你就可以使用这些信息。聚类过程能够总结数据以帮助你理清所有内容。当需要处理这类机器学习时，可以使用几种不同的技术。在这里通常效果最好的某些方法或算法包括：


    - 神经网络

    - 马尔可夫算法

    - 聚类算法


    '
