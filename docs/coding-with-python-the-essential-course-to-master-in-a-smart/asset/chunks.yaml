    # 简介


    Python 是最受欢迎的计算机语言工具之一，由 `Guido Van Rossum` 在 20 世纪 80 年代最初创建设计。自从引入计算领域以来，Python
    经历了多次修改和改进，因此成为开发者使用的领先编程语言之一。该工具是动态类型、面向对象、多范式和命令式的。它适用于包括 `Windows`、`Linux`、`Android`、`macOS`
    和 `iOS` 设备在内的不同操作系统。此外，它还兼容手机、笔记本电脑和桌面电脑的 32 位和 64 位。尽管包含了程序员所需的几个领域，但 Python
    非常容易学习，特别是对于计算机编程知识极少的初学者。与大多数编程语言不同，Python 拥有易于使用的语法，初学者可以轻松练习并在几周内成为专家。然而，编程过程可能会根据学习者的编程目的而异。尽管伴随着多种词汇和有时用于学习不同编程技术的复杂教程，但使用
    Python 开发出色的程序是值得的。


    ## Python 编程特性


    ### 简单语言

    大多数编程语言都有复杂且冗长的代码语言，这对初学者来说可能非常繁琐。此外，长且具有挑战性的语言可能难以学习和记忆，从而阻碍业余者的学习能力。Python 拥有非常简单奇奇的语法，让初学者能够轻松地阅读和编写程序。与
    `Java` 和 `C++` 相比，Python 让你能够轻松工作并专注于结果。


    ### 可移植性

    凭借在任何操作系统上运行的能力，Python 提供了可移植性，你可以轻松地将代码和通用程序从一个设备传输到另一个设备，而不影响你的进度。这种编程工具对于更换设备或从一个平台传输数据到另一个平台的开发者非常有用。因此，你可以在有限调整的情况下在新机器上无缝运行你的程序。此外，Python
    允许你将应用程序继续到主系统，并按预期有效运行。


    ### 标准库

    如今，所有编程语言都由库组成，你可以在其中快速选择一个程序、进行必要的修改并执行你的代码。其中某些库的代码行数有限，因此将要求你编写自己的程序。另一方面，Python
    带有极其丰富的标准库，涵盖了你所有的编程需求。例如，它包含 `MySQLdb` 库，允许你在无需创建路径的情况下连接到 `MySQL` 数据库。因此，在处理成千上万的数据时，Python
    成为领先的商业编程工具之一，因为你可以快速检索并轻松运行。


    ### 免费开源

    Python 还提供了一个极佳的免费开源平台，你可以在不同领域使用该工具，例如用于商业用途。与其他编程工具不同，开发者可以选择对程序进行更改，或者选择合适的数据集以适应当前领域，这主要在
    Python 源代码中实现。随着在计算社区多个领域的广泛使用，Python 的使用量不断增加，因此变得更加简单，让初学者受益匪浅。


    ## 下载和安装 Python


    Python 和大多数计算机软件一样，可以下载、运行和安装到系统中以便轻松运行。然而，取决于操作系统，该工具在下载或更新期间可能会具有挑战性。某些系统如 `macOS`
    和 `Linux` 通常带有预装的 Python 版本，但这些通常是过时的。因此，这些 Python 版本需要更新，通常需要使用独特的技术。相反，其他操作系统如
    `Windows` 和 Android 设备需要用户访问 Python 首页。


    ## Python 开发与应用


    Python 开发通常由 `Python 增强提案 (PEP)` 进行，这导致了最先进、最新版本的创建。PEP 增强了功能、Python 文档以及错误修复的创建。当
    Python 在 20 世纪 80 年代首次发布时，它带有许多优点，但工具内部存在许多缺陷。多年来，Python 软件基金进行了重大修改，表明了 Python
    1.0 与今天使用的 Python 3.7 之间的差异。因此，Python 时间的推移日益受欢迎，应用于计算社区的各个领域。例如，该编程软件已用于创建不同网站的
    Web 应用。


    ## Python 变量


    Python 变量是命名的阶段，用于存储系统内存中的代码，主要用于开发程序。变量在 Python 中至关重要，特别是对于需要多个代码值的复杂程序的程序员。与
    `Java` 和 `C++` 等其他编程软件不同，Python 不需要变量声明，因为它们在命名后会立即更改。因此，Python 变量是内存保留空间，用于在需要时存储输入程序的值。保存的数据通常取决于数据类型；例如，它们可以以`数字`、`列表`、`元组`或`字典`的形式存储。


    '
