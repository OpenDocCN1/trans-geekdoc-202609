    # 结论


    熟能生巧。在学习中文或西班牙语等新语言时，专家建议你每天通过口语交流和完成练习来使用它们。编程语言也是如此。你练习得越多，基础语法就会越成为你的本能，你也会直性地知道何时使用条件判断和循环等概念。有很多资源（你可以在附录中找到）提供了你可以立即开始练习的练习题和示例程序。


    ## 手写


    当你在做笔记时（你应该做笔记），请用手写下来。研究表明，用实体笔在实体纸张上书写的过程最利于长期记忆留。手写也包括手写代码，然后在你的电脑上检查它，这样你就能确定它是否准确。通过这种方式勾勒代码和思路，也可以帮助你在正式开始构建程序之前保持条理。


    ## 寻找其他初学者


    独自学习编程可能会让人感到厌烦和沮丧。学习和提高最好的方法之一是找到与你处于相同阶段的人。你们可以互相交流想法、在项目中提供帮助等等。如果你在自己的圈子里不认识任何人，可以查看在线小组，并通过
    Meetups 和 Facebook 寻找本地活动。在第一次结识仅在网上认识的人时，始终要谨慎并采取安全措施。在白天留在公共场所，在感到舒适自在之前，不要与不熟悉的人单独去任何地方。


    ## 尝试大声解释 Python


    有时，向别人解释你刚刚学到的东西是将其巩固在脑海中的最好方法。它允许你用自己的语言重新表述概念。你甚至不需要和真人交谈；对着一个物体也可以。这在程序员中是一种非常常见的做法，被称为“橡皮鸭调试”，指的是对着橡皮小鸭谈论程序中的
    bug。挑选一个 `Python` 中的主题，如条件判断或变量，看看你是否能解释它。如果你遇到困难或发现自己的知识体系中存在空白，那么该是回去继续学习了。


    ## 查看其他语言


    虽然这是关于 `Python` 的，所以我们显然认为它应该是你的首要任务，但了解一下其他语言也会非常有帮助。这绝对会让你在未来成为一名更好的程序员。查看其他语言可以帮助你发现每种语言中内置的典型架构，以及它们与
    `Python` 之间的差异。即使你只是阅读关于其他语言的内容，而在 `Python` 之外的语言中从未写过多少代码，你也会提升自己的知识和技能。


    ## 为卡壳时做好计划


    当你在编码时卡住时，请往后退一步。你想让代码做什么？你尝试了什么？发生了什么？将答案写下来，并尽可能具体、详尽。这样，你就可以向他人寻求帮助，而不需要花费大量时间尝试解释问题了。这些答案对于你自己的思维过程也非常有用。仔细查看你收到的任何错误信息。反向思考尝试发现任何错误。


    应对卡住的另一种方法是直接重新开始。如果你的代码非常长，从零开始可能会令人气馁，但这意味着你不需要回过整个代码，对其进行拆解并耗费眼力。重新开始可能实际上更容易。


    ## 休息一下


    无论你选择重新开始，还是仔细检查代码，你都应该休息一下。当你攻克一个问题太久时，你的大脑会陷入定式，很难产生新的解决方案。做一些与编码使用完全相同的肌肉的事情。相反，运动身体、洗个长澡、睡个午觉或烤一些饼干。爱因斯坦经常在弹小提琴时想出问题的解决方案，谁不想像爱因斯坦那样思考呢？


    '
