    \ false.\n\nWe can also nest an `if` structure inside another `if` structure:\n\
    \n```python\nResult = 5\nIf result> 1: # this condition holds, execute the Internal\
    \ Code\n    Print (\"result bigger than 1\")\n    Print (\"nice\")\n    If result\
    \ > 2: # nested if structure, the condition holds.\n        Print (\"result bigger\
    \ than 2\")\n        Print (\"It’s good than before\")\n```\n\n### Loop\n\nLoops\
    \ are used to iterate through blocks of code. In Python, loops are either `for`\
    \ or `while`. Let’s start with the `for` loop.\n\n```python\nfor input in [4,\
    \ 6, 8, \"love\"]:\n    print(c) #prints each element in the list in turn\n```\n\
    The loop is to take an element from the list `[4, 6, 8, \"love\"]` one at a time,\
    \ assign it to `c`, and execute the line belongs to the program `for`, which calls\
    \ the `print()` function to print out the element.\n\nIf we simply want to repeat\
    \ a certain number of times and don’t want to create a sequence, we can use `range()`\
    \ function provided by Python:\n\n```python\nfor result in range(3):\n    print(\"\
    This is crazy\") # print \"This is crazy\"\n```\n\nThere is also a loop structure\
    \ in Python, the `while` loop:\n\n```python\ncheck = 0\nwhile check < 20:\n  \
    \  print(check) # prints from 0 to 19\n    check = check + 1\n```\n\n# Chapter\
    \ 11 - Variables and Strings\n\nA software application consists of two fundamental\
    \ parts: Logic and Data. Logic consists of the functionalities that are applied\
    \ on data to accomplish a particular task. Application data can be stored in memory\
    \ or hard disk. Files and databases are used to store data on hard disk. In memory,\
    \ data is stored in the form of variables.\n\n## Definition of Variable\n\nVariable\
    \ in programming is a memory location used to store some value. Whenever you store\
    \ a value in a variable, that value is actually being stored at physical location\
    \ in memory. Variables can be thought of as reference to physical memory location.\n\
    \n## Creating a Variable\n\nIt is very easy to create a variable in Python. The\
    \ assignment operator `=` is used for this purpose. The value to the left of the\
    \ assignment operator is the variable identifier or name of the variable. The\
    \ value to the right of the operator is the value assigned to the variable.\n\n\
    ```python\nName = 'Mike' # A string variable\nAge = 15 # An integer variable\n\
    Score = 102.5 # A floating type variable\nPass = True # A Boolean variable\n```\n\
    \nTo check type of a variable, pass the variable name to `type()` function as\
    \ shown below:\n\n```python\ntype(Age)\n```\n\nPython allows multiple assignment\
    \ which means that you can assign one value to multiple variables at the same\
    \ time.\n\n```python\nAge = Number = Point = 20 #Multiple Assignment\nprint(Age)\n\
    print(Number)\nprint(Point)\n```\n\n## Variable Naming and Assignment\n\nIn a\
    \ program, program statements or instructions tell the computer which Data to\
    \ access and execute step by step according to the instructions in the program.\
    \ These data may be words or numbers. What we call variable is the most basic\
    \ role in programming language, is a memory unit allocated by the compiler to\
    \ store changeable data. To facilitate identification, it must be given a name.\n\
    \n```python\nfirstsample = 3\nsecondsample = 5\nresult = firstsample + secondample\n\
    ```\n\n## Variable Declaration And Assignment\n\nPython is an object-oriented\
    \ language, all data are regarded as objects, and the type of variable is determined\
    \ when the initial value is given, so there is no need to declare the data type\
    \ in advance. In programming languages, the `=` sign is mainly used for assignment.\n\
    \n```python\nnumber = 10\n```\n\n## Variable Naming Rules\n\nFor an excellent\
    \ programmer, readability of program code is very important. Although variable\
    \ names can be defined by themselves as long as they conform to Python's regulations,\
    \ when there are more and more variables, simply taking variables with letter\
    \ names as `abc` will confuse people.\n\nUse the `help()` function to query Python\
    \ reserved word. The `help()` function is Python's built-in function. If you are\
    \ not sure about the method and property usage of a specific object, you can use\
    \ the `help()` function to query.\n\n```python\nhelp(\"keywords\") own```\n\n\
    Although Python uses dynamic data types, it is very strict in data processing,\
    \ and its data type is \"strong type.\" For example:\n\n```python\nfirstsample\
    \ = 5\nsecondample = \"45\"\nprint(firstsample + secondample) # shows that TypeError\
    \ variable firstsample is of numeric type and variable secondample is of string\
    \ type.\n```\n"
  trans: "\n\n# 第 10 章 - 执行与重复任务\n\n本阶段涉及 `if-else` 语句和不同类型的循环结构，这些结构在编程的重复任务中提供了帮助。\n\
    \n## If 结构\n\n到目前为止，我们看到的 Python 程序都是基于指令的。在程序中，计算机指令是按顺序执行的。指令不能被跳过，也不能向后重复。早期的程序都是这样的。例如，为了让灯亮十次，需要重复十行让灯点亮的指令。为了让程序更具灵活性，早期的编程语言增加了“跳转”功能。通过跳转指令，我们可以在执行期间跳转到程序中的任意一行并继续向下执行。例如，为了重复执行，可以跳转到已经执行过的某行。为了方便起见，程序员经常在程序中向前或向后跳转。结果导致程序的运行顺序看起来像一团乱麻，难以阅读且容易出错。程序员已经意识到，跳转的主要功能是选择性或重复性地执行程序。计算机专家还认为，有了“选择”和“循环”的语法结果，“跳转”已不再有必要。这两种结构都改变了程序执行的流和指令执行的顺序。编程语言进入了结构化时代。与“跳转”带来的“意大利面程序”相比，结构化程序变得更加美观。在现代编程语言中，“跳转”语法已被完全废除。\n\
    \n让我们从一个简单的选择结构示例开始：如果一个房子的价格超过 200,000 美元，交易税率为 3% 或 4%。我们使用选择结构来编写一个程序。以下是程序代码：\n\
    \n```python\nPrice = 340000\nIf Expected price > 200000:\n    Fixed tax= 0.04\n\
    Else:\n    Fixed tax= 0.03\nPrint (fixed tax) #prints 0.03\n```\n输出结果为：0.04\n\n\
    在这个过程中，出现了一个我们之前没见过的 `if`。事实上，这个语句的功能很容易理解。如果总价格超过 200,000，那么预期的税率为 4%；否则，交易税率为\
    \ 3%。`if` 和 `else` 关键字各自分附带了一行代码，并且在依赖代码开头有四个空格的缩进。程序将根据 `if` 后面条件是否成立，最终选择执行\
    \ `if` 依赖代码还是 `else` 依赖代码。简之，`if` 结构使程序发生了分支。\n\n`if` 和 `else` 后面可以跟随多行：\n\n```python\n\
    Price = 340000\nIf Total > 200000:\n    Print (\"rate is above 200,000\")\n  \
    \  Fixed tax= 0.04\nElse:\n    Print (\"rate is below 200,000\")\n    Fixed tax=\
    \ 0.03\nPrint (fixed tax) # the result is 0.04\n```\n输出结果为：Rate is above 200,000\n\
    \n如你所示，属于 `if` 或 `else` 的代码都有四个空格缩进。关键字 `if` 和 `else` 像两个老板，站在队首。后面还站着一个小小弟。\n\
    \n### 嵌套与 Elif\n\n通过 `elif` 语法，程序可以以更丰富的方式分支。下一个程序使用了 `elif` 结构：\n\n```python\n\
    Result= 1\nIf result > 0: # Condition 1. 因为 I 是 1，这部分将执行。\n    Print (\"positive\
    \ result\")\n    Result= result + 1\nelif result == 0: # Condition 2. 这部分不执行。\n\
    \    Print (\"result is 0\")\n    Result= result * 10\nElse: # Condition 3. 这部分不执行。\n\
    \    Print (\"negative result\")\n    Result= result - 1\n```\n有三个块，分别由 `if`、`elif`\
    \ 和 `else` 引导。Python 首先检测 `if` 的条件，如果条件为假，则跳过属于 `if` 的块；如果 `elif` 的条件仍然为假，则执行\
    \ `else` 块。\n\n我们还可以将一个 `if` 结构嵌套另一个 `if` 结构中：\n\n```python\nResult = 5\nIf result>\
    \ 1: # 此条件成立，执行内部代码\n    Print (\"result bigger than 1\")\n    Print (\"nice\"\
    )\n    If result > 2: # 嵌套 if 结构，条件成立。\n        Print (\"result bigger than 2\"\
    )\n        Print (\"It’s good than before\")\n```\n\n### 循环\n\n循环用于遍历代码块。在 Python\
    \ 中，循环有 `for` 或 `while` 之分。让我们从 `for` 循环开始。\n\n```python\nfor input in [4, 6,\
    \ 8, \"love\"]:\n    print(c) #依次打印列表中的每个元素\n```\n循环是每次从列表 `[4, 6, 8, \"love\"\
    ]` 中取出一个元素，将其赋值给 `c`，并执行属于 `for` 程序的行，该行调用 `print()` 函数打印出元素。\n\n如果我们只想简单地重复某些次数而不想创建一个序列，可以使用\
    \ Python 提供的 `range()` 函数：\n\n```python\nfor result in range(3):\n    print(\"\
    This is crazy\") # 输出 \"This is crazy\"\n```\n\nPython 中还有 `while` 循环结构：\n\n```python\n\
    check = 0\nwhile check < 20:\n    print(check) # 从 0 到 19\n    check = check +\
    \ 1\n```\n\n# 第 11 章 - 变量与字符串\n\n程序由两个部分组成：逻辑和数据。逻辑是用于完成特定任务的语句，数据可以存储在内存或硬盘中。在内存中，数据以变量的形式存储。\n\
    \n## 变量定义\n\n变量是用于存储某些值的内存位置。当你将值存储在变量时，变量被视为内存的引用。\n\n## 创建变量\n\n在 Python 中创建变量非常简单。使用赋值运算符\
    \ `=`。运算符左侧是变量的标识符或名称，右侧是赋值给变量的值。\n\n```python\nName = 'Mike' # 字符串变量\nAge = 15\
    \ # 整数变量\nScore = 102.5 # 浮点变量\nPass = True # 布尔变量\n```\n\n检查变量的类型，将变量名传递给 `type()`\
    \ 函数所示：\n\n```python\ntype(Age)\n```\n\nPython 允许变量赋值，这意味着你可以同时为多个变量赋值一个值。\n\n\
    ```python\nAge = Point = 20 # 多变量赋值\nprint(Age)\nprint(Point)\n```\n\n## 变量命名\n\
    \n在程序中，指令告诉计算机访问和执行哪些数据。这些数据可能是单词或数字。我们说的变量是编程语言中最基本的角色，是编译器分配用于存储数据的内存单元。为了方便识别，必须给它一个名字。\n\
    \n```python\nfirstsample = 3\nsecondsample = 5\nresult = firstsample + secondample\n\
    ```\n\n## 变量声明与赋值\n\nPython 是一种面向对象的语言，所有数据都被视为对象，变量类型在给出初始值时确定，因此不需要预先声明数据类型。在编程语言中，`\
    \ 主要用于赋值。\n\n```python\nnumber = 10\n```\n\n## 变量命名规则\n\n对于优秀的程序员来说，代码的可读性非常重要。虽然变量名只要符合\
    \ Python 的规定就可以自行定义，当变量越来越多时，简单地使用字母 `abc` 命名变量会让人困惑。\n\n使用 `help()` 函数查询 Python\
    \ 关键字。`help()` 函数是 Python 的内置函数。如果你不确定对象的方法和属性用法，可以使用 `help()` 函数进行查询。\n\n```python\n\
    help(\"keywords\")\n```\n\n"
