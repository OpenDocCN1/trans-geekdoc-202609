    # 第 9 章 - 感知机 (Perceptron)


    ## 定义感知机

    感知机是神经网络层，能够执行以下操作：为数据池的核心配置算术值，并对于正(+) 结果估计其正回报之和值为 1。从另一个角度来看，感知机也可以被视为一种计算模型，它通过绘制一条边界（在二维情况下为一条线）来隔离给定空间中的两个类别。最初，代表分类平面的权重（weights）和偏置（bias）通常是未知的。在这种情况下，模型会分配到非系统的权重和偏置。随机分配会导致点的分类错误。


    ## 感知机技巧

    感知机技巧的目标是减少分类错误的点点数量。这种减少可以通过在空间中移动直线来实现。换句话说，它是在改变超平面的表达式。对于所有分类错误的点，我们会调整权重和偏置，使超平面更靠近这些分类不当的点。经过一段时间后，算法将纠正问题并正确地分类这些点。


    然而，在这个阶段，我选择以不同的方式看待感知机。采用的方法是在机器学习算法的语文中识别感知机。在这里，感知机被定义为一种预测给定特征是否属于特定类别的算法。从这个角度来看，算法被认为是一种用于监督学习的二分类器。在大多数情况下，所研究的特征始终用具有大小和方向的数字表示。作为一种分类器，感知机用于线性分类和数据图形形式的表示。图形表示模型可以采用二维或多维的方法。感知机识别一个特征，对其求和加权，如果加权总和高于其他函数的结果，则给出一个值为
    1 的结果。


    下图中的方程支持这一陈述 ![](img/image_rsrcYT.jpg)。当代入方程边（上图中的第二个方程）并与给定参数的权重保持常数时，就得到了底部的方程
    ![](img/image_rsrcYU.jpg)。感知机算法的单个单元可以用于执行可分的线性方程。唯一组的工作通过对布尔和正向指标进行加权或分配权重，并具有相应的偏向。


    ## 使用感知机执行 OR（或）函数

    在上方 ![](img/image_rsrcYV.jpg) 中，条件是根据 OR 函数定义的。这些术旨在满足最优模型，即对于给定的值为一 (1) 的结果，加权数据的总和必须为零
    (0) 或更多。权重的总和已通过直线完成，建立了一条分离正(+) 值和负(-) 值的线。Minsky 的提议规定了通过样本数据学习特征的标准。所提出的模型描述如下。


    ## 线性代数的基础组件

    ### 向量 (Vector)

    向量值可以根据数据类型和用户代表许多内容。因此，描述向量的方法有多种。它可以是空间中具有方向和大小的特征，用于存储大量数据的结构或数据库等；对于本研究，我们将向量视为一条线，带箭头的点是头部，没有箭头的点是原点。这不是最好的定义。但是，我想让你只需抓住要点。演示中使用的图像提取自
    3Blue1Brown。


    ### 表示向量

    向量可以在二维和三维平面上表示，取决于用户的选择和函数。下面是二维描述的向量（第一幅图）和一个三维向量（第二幅图 ![](img/image_rsrcYW.jpg)）[](image_rsrcYX.jpg)


    ### 计算两个向量的点积

    给定两个向量 `(n+1, w)` 和 `(n+1, x)`，它们的点积使用下面的公式计算。为了代入数值，我以矩阵形式写出的公式 ![](img/image_rsrcYY.jpg)。从方程可以看出，向量
    `/w` 和 `/x` 由带箭头的线表示。向量的维度是 `(n+1)` 值。计算结果代表向量 `/w` 和 `/x` 的点积。此结果显示了单个向量在另一个向量方向上的程度。感知机创建了一条分离正值和负值的线。这条线被称为分离边界
    (separating boundary)。对于我们示例中的函数，表示为 `w. x = o`。


    ### 两个向量之间的角度

    上述提到的点积可以使用不同的方法计算。但是，必须满足某些条件：

    1. 向量之间的角度必须是知的。

    2. 向量的大小必须是知的。


    '
