    ## Variables & Assignment


    Example 08: Multiple assignment.


    ```php

    <?php

    $firstPanda = $secondPanda = $thirdPanda = 1337;

    ```


    The snippet above might look a little crazy, but it makes more sense if you read
    from left to right. The $thirdPanda is assigned the value 1337, next the $secondPanda
    is assigned the value of the $thirdPanda, and finally the $firstPanda is set to
    the value of the $secondPanda. This means that all variables are set to the final
    value. Neat, right?


    ## Just my type


    Until now we have been working with numbers. It would be boring if those were
    the only types of values we can use, right? I think it''s about time we examine
    the other possibilities. Here are some of the common values used within PHP applications.


    - integer

    - float

    - boolean

    - string

    - null

    - array


    There are a few more, but let''s not complicate matters right away. We need to
    learn little by little. You don''t want knowledge overload!


    Let''s take a look at these types one by one. First we have integers. These are
    whole numbers, we''ve been using these in our previous examples.


    Example 09: Integers.


    ```php

    <?php

    $panda = 2;

    $redPanda = -23;

    ```


    Floats are floating numbers. They have decimal points, and thus contain fractions.
    They can be used in a similar fashion to integers. In fact, we''ve used one already.
    Do you remember our friend $pi? That was a float. Let''s move on to something
    new shall we?


    ## Example 10: Floats.


    ```php

    <?php

    $panda = 2.34;

    $redPanda = -23.43;

    ```


    Booleans are binary data types. Don''t panic! We''re going to do any binary arithmetic.
    It''s just a way of expressing that they be one of two values. A boolean can either
    be true or false. Later on, we''ll take a look at how boolean values can be used
    to change the flow of our application.


    ## Example 11: Booleans.


    ```php

    <?php

    $panda = false;

    $redPanda = true;

    ```


    Next up we have the ''string'' value. Strings are used to store a word, a character,
    or a sequence of text. Strings are special, so I''ve decided to dedicate a short
    chapter to them. We''ll come back to this!


    ## Example 12: Strings.


    ```php

    <?php

    $panda = ''Normal Panda'';

    $redPanda = ''Red Panda'';

    ```


    Null is a special value. It is nothing. Nil. Zero. Well actually it''s not zero.
    Zero is numeric, and we can use integer for that. Nulls are exactly nothing. The
    value of that variable has before assignment has been performed. It''s a really
    useful value, and you''re going to see a lot of it in the future.


    ## Example 13: Null values.


    ```php

    <?php

    $noPanda = null;

    ```


    Arrays are another special type of value. In fact, this is my favourite one of
    all. So much that I''ve decided to dedicate a full chapter to them. For now, all
    you need to know is that it''s a value that holds a collection of other values.
    Woah! Inception stuff, right?


    ## Example 14: Arrays.


    ```php

    <?php

    $countThePandas = [1, 2, 3];

    $morePandas = array(5, 6, 7, 8);

    ```


    ## Advanced Assignment


    In a previous chapter we discovered the operators that we can use on variables,
    and we''ve mastered the assignment operator. So what happens when we put them
    both together? It will create a new black hole and consume the entire universe?
    I''m feeling a little daring, what shall we find out?


    ## Example 15: Assignment with addition.


    ```php

    // Set a value.

    $panda = 3;


    // Attempt to create a black hole.

    $panda += 1;


    // Universe withstanding, dump the value.

    var_dump($panda);

    ```


    First we set a variable to the integer value of three. Next, we''ve plopped the
    addition operator onto the front of the assignment operator and supplied another
    integer value of one.


    We can use the function var_dump() (more on functions later!) to interrogate only
    the value held within a variable, but also its type!

    What did we get back from the dump?


    ## Example 16: Output.


    ```

    int(4)

    ```


    Awesome! The universe is saved. It looks like we have a four? Well, I suppose
    that makes sense. We know that $sa + $sb returns a value without setting it, and
    we know


    ## Variables & Assignment


    that the assignment operator is used to set the value of variables. This does
    both.

    We''re telling PHP to set the value of $panda to its current value plus one.


    You can use this syntax with any of the operators we''ve discovered so far. There''s
    only one catch. Don''t place the operator on the other side of the equals sign.
