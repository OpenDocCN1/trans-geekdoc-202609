    \ We'll use these techniques to allow a piece of code to run repeatedly until\
    \ (or while) a condition is met.\n\nSome loops are like saying \"Knock on a door\
    \ until someone answers.,\" and others are more similar to \"Count every body\
    \ buried in my basement.\" Let's take a closer look at how these structures might\
    \ be implemented in PHP.\n\n# While\n\nThe while loop will continue to run a snippet\
    \ of code while the provided condition is true. Let's construct an example using\
    \ a counter.\n\nExample 01: The while loop.\n\n```\n<?php\n// Set the panda counter\
    \ to zero.\n$pandas = 0;\n// Iterate while $pandas less than 50.\nwhile ($pandas\
    \ < 50) {\n    // Output the number of panda butlers.\n    echo \"We have {$pandas}\
    \ panda butlers!\\n\";\n    // Increment the counter.\n    $pandas++;\n}\n```\n\
    \nWe'll set a counter $pandas to zero. Now we can begin creating our first loop.\
