  mdcn: "\n\n## 类\n\n- 标题。\n- 作者。\n- 出版者。\n- 出版年份。\n\n让我们在我们的 `Book` 类中反映这些属性。开始吧！\n\
    \n示例 02：类属性。\n\n```php\n<?php\nclass Book {\n    var $title;\n    var $author;\n\
    \    var $publisher;\n    var $yearOfPublication;\n}\n```\n\n属于类的变量被称为“类属性”（class\
    \ properties）。目前，我们将使用 `var` 关键字并结合典型的变量表示法来定义类属性。不用太担心 `var` 关键字，我们稍后会查看一些替代方案。\n\
    \n我们现在准备好开始操作我们的类了。\n\n## 实例\n\n我们定义的类实际上是一个蓝图。我们可以使用它来创建一个 `Book` 对象的新实例。这里的关键词是\
    \ `new`。实例是我们可以使用的类实体。我们可以拥有同一个类的多个实例。这用文字描述很难解释清楚，所以让我们来看一个代码示例。\n\n### 示例 03：创建类的实例。\n\
    \n```php\n<?php\nclass Book {\n    var $title;\n    var $author;\n    var $publisher;\n\
    \    var $yearOfPublication;\n}\n\n$book = new Book;\n```\n\n我们创建了 `Book` 类的新实例，并将其赋值给\
    \ `$book` 变量。我们使用 `new` 关键字，后跟想要实例化的类名来实现。现在我们有了一个类的实例，就可以操作它的属性了。让我们先为我们的书设置属性。\n\
    \n### 示例 04：设置类属性。\n\n```php\n<?php\n// 定义 Book 类。\nclass Book {\n    // 声明属性。\n\
    \    var $title;\n    var $author;\n    var $publisher;\n    var $yearOfPublication;\n\
    }\n\n// 创建一个新的书籍实例。\n$book = new Book;\n\n// 设置属性。\n$book->title = 'Game of Thrones';\n\
    $book->author = 'George R Martin';\n```\n\n```php\n$book->publisher = 'Voyager\
    \ Books';\n$book->yearOfPublication = 1996;\n```\n\n你可以通过对象运算符 `->` 来设置类实例的属性，该运算符由一个连字符符和一个大于号符号组成。接下来，你指定想要访问的属性名称。\n\
    \n在上面的示例中，我们使用赋值运算符 `=` 来设置实例的类属性。我们也可以使用对象运算符来获取它们。让我们打印每个类属性，并在末尾加上一个换行符。\n\n\
    示例 05：获取类属性。\n\n```php\n<?php\n// 定义 Book 类。\nclass Book\n{\n    // 声明属性。\n  \
    \  var $title;\n    var $author;\n    var $publisher;\n    var $yearOfPublication;\n\
    }\n\n// 创建一个新的书籍实例。\n$book = new Book;\n\n// 设置属性。\n$book->title = 'Game of Thrones';\n\
    $book->author = 'George R Martin';\n$book->publisher = 'Voyager Books';\n$book->yearOfPublication\
    \ = 1996;\n\n// 输出属性。\necho $book->title . PHP_EOL;\necho $book->author . PHP_EOL;\n\
    echo $book->publisher . PHP_EOL;\necho $book->yearOfPublication . PHP_EOL;\n```\n\
    \n我们再次使用对象运算符 `->` 来输出书籍实例的属性。执行我们的代码将得到以下输出。\n\n### 示例 06：输出。\n\n- Game of Thrones\n\
    George R Martin\nVoyager Books\n1996\n\n早些时候我提到我们可以拥有类的多个实例，所以让我们定义两本书，每本书都有不同的属性。为了简化示例，我现在将省略类的声明。\n\
    \n### 示例 07：多个类实例。\n\n```php\n<?php\nclass Book {\n    // 声明属性\n    var $title;\n\
    \    var $author;\n    var $publisher;\n    var $yearOfPublication;\n}\n// 创建第一个实例\n\
    $first = new Book;\n\n// 设置属性\n$first->title = 'Game of Thrones';\n$first->author\
    \ = 'George R Martin';\n$first->publisher = 'Voyager Books';\n$first->yearOfPublication\
    \ = 1996;\n\n// 创建另一个实例\n$second = new Book;\n\n// 设置属性\n$second->title = 'The\
    \ Colour of Magic';\n$second->author = 'Terry Pratchett';\n$second->publisher\
    \ = 'Colin Smythe';\n$second->yearOfPublication = 1983;\n\n在上面的示例中，我们创建了两个书籍实例。它们都有自己的属性值。我们所做的是创建信息的机制。我们为什么不使用数组来存储这些信息呢？\n\
    \n## 默认值\n\n我们的类是实例的蓝图。有时，属性会有默认值。例如，大多数书籍是平装的（paperback）。我们将书籍标记为精装（hardback）。我们可以通过给类属性一个默认值\
    \ 'Paperback' 来节省时间。让我们查看以下代码。\n\n示例 08：带有默认值的类属性。\n\n```php\n<?php\nclass Book\
    \ {\n    var $title;\n    var $author;\n    var $publisher;\n    var $yearOfPublication;\n\
    \    var $format = 'Paperback';\n}\n```\n\n我们已经为 `$format` 属性赋值了默认值。这行代码以分号结束。让我们确保我们的\
    \ `$format` 属性设置了默认值。\n\n示例 09：检查默认值。\n\n```php\n<?php\n// 定义 Book 类。\nclass Book\
    \ {\n    // 声明属性。\n    var $title;\n    var $author;\n    var $publisher;\n  \
    \  var $yearOfPublication;\n    var $format = 'Paperback';\n}\n// 创建一个新的书籍实例。\n\
    $book = new Book;\n// 输出默认值。\necho $book->format;\n```\n\n我们只是实例化了书籍并输出了该值。我们得到了什么？\n\
    \n示例 10：输出。\n\n- Hardback\n\n正如预期的那样！当然，我们可以随意更改这个值。默认值有助于简化创建书籍的过程。\n\n示例 11：修改带有默认值的属性。\n\
    \n```php\n<?php\n// 定义 Book 类。\nclass Book {\n    // 声明属性。\n    var $title;\n\
    \    var $author;\n    var $publisher;\n    var $yearOfPublication;\n    var $format\
    \ = 'Paperback';\n}\n\n// 创建一个新的书籍实例。\n$book = new Book;\n\n// 修改 format 值。\n\
    $book->format = 'Hardback';\n\n// 输出 format 值。\necho $book->format;\n```\n\n如果我们再次执行代码，将得到以下值。\n\
    \n示例 12：输出。\n\n- Hardback\n\n太棒了！你可以为所有类型设置默认值，包括字符串、整数、浮点数，甚至是关联数组和索引数组。但有一个陷阱，记住总会有小问题。在定义默认值时，你不能将其设置为函数的结果。这是非法的。如果你尝试这样做，PHP警察会来带你。这意味着下面的操作是不可能的。\n\
    \n示例 13：非法设置默认值。\n\n```php\n<?php\n// 创建一个书籍类。\nclass Book\n{\n    var $bar =\
    \ strtoupper('foo');\n}\n```\n\n> 注意 `strtoupper()` 函数是一个内置 PHP 函数，用于将字符串转换为大写。所以\
    \ `foo` 会变成 `FOO`。但在在此上下文中，为类属性设置默认值会导致语法错误。\n\n## 方法\n\n是时候开始使用方法（methods）了。我们把属于类的称为方法。让我们再次查看这些用词上的区别，好吗？\n\
    \n| 通用 | 类 |\n| --- | --- |\n| 变量函数 | 属性 / 属性方法 |\n\n当你在寻求帮助时，知道函数和方法的区别将与其他开发者交流变得简单得多。现在花时间学习这些名称是值得的。\n\
    \n如何在我们的类上定义方法呢？很简单。事实上，你已经知道这种格式了！让我们创建一个简单的函数来打招呼。\n\n示例 14：创建类方法。\n\n```php\n\
    <?php\n// 定义 Book 类。\nclass Book {\n// 声明属性。\nvar $title;\nvar $author;\nvar $publisher;\n\
    \n// 声明方法。\nfunction sayHello() {\n    return 'Hello!';\n}\n}\n// 创建一个新的书籍实例。\n\
    $book = new Book();\n// 修改 format 值。\n$book->format = 'Hardback';\n// 执行 hello\
    \ 方法。\necho $book->sayHello();\n```\n\n"
