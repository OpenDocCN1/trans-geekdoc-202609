    ## Example 02: Create a new Eddard.


    ```php

    <?php

    // app/routes.php

    $eddard = new Eddard();

    ```


    Dayle, I know some PHP...


    Okay, okay sorry. Basically, we can think of this class as being in the ''global''
    namespace. I don''t know if that''s the right term for it, but it sounds quite
    fitting to me. It essentially means that the class exists without a namespace.
    It''s just a normal class.


    ## Simple Namespacing


    Let''s create another class alongside the original, global Eddard.


    ## Example 03: The Stark namespace.


    ```php

    <?php

    namespace Stark;

    // app/models/another.php

    class Eddard

    {

    }

    ```


    Here we have another Eddard class, with one minor change. The addition of the
    namespace directive. The line `namespace Stark` informs PHP that everything we
    do is relative to the Stark namespace. It also means that any classes created
    within this file will live inside the ''Stark'' namespace.


    Now, let''s try to use the ''Stark'' class once again.


    ## Example 04: Create Eddard again.


    ```php

    <?php

    // app/routes.php


    $eddard = new Eddard();

    ```


    Once again, we get an instance of the first class we created in the last section,
    and not the one within the ''Stark'' namespace. Let''s try to create an instance
    of the ''Eddard'' within the ''Stark'' namespace.


    ## Example 05: Create a StarkEddard.


    ```php

    <?php

    // app/routes.php


    $eddard = new Stark\Eddard();

    ```


    We can instantiate a class within a namespace, prefixing it with the name of the
    namespace, and separating the two with a backward \ slash. Now we have an instance
    of the ''Eddard'' class within the ''Stark'' namespace. Aren''t we magical?

    You should know that namespaces can have as many levels of hierarchy as they need
    to. For example:


    ## Example 06: A horrible, but legal namespace.


    `This\Namespace\And\Class\Combination\Is\Silly\But\Works`


    ## The Theory of Relativity


    Remember how I told you that PHP always reacts relative to the current namespace?
    Let''s take a look at this action.


    ## Namespaces


    ## Example 07: Create Eddard within Stark namespace.


    ```php

    <?php

    namespace Stark;

    // app/routes.php

    $eddard = new Eddard();

    ```


    By adding the namespace directive to the instantiation example, we have moved
    the execution of the PHP script into the ‘Stark’ namespace. Since we are inside
    the same namespace as the one we put ‘Eddard’ into, this time we receive the namespaced
    ‘Eddard’ class. Do you see how it''s all relative?


    Now that we have changed namespace, we have created a little problem. Can you
    guess what it is? How do we instantiate the original ‘Eddard’ class? The one not
    in the namespace.


    Fortunately, PHP has a trick for referring to classes that are located within
    the global namespace, we simply prefix them with a backward (\ slash).


    ## Example 08: Create a global Eddard instance.


    ```php

    <?php

    // app/routes.php

    $eddard = new \Eddard();

    ```


    With the leading backward (\) slash, PHP knows that we are referring to the ‘Eddard’
    in the global namespace, and instantiates that one.


    Use your imagine a little, like how Barney showed you. Imagine that we have another
    namespaced class called Tully\Edmure. We want to use this class from within the
    ‘Stark’ framework. How do we do that?


    ## Example 09: Root namespace prefix.


    ```php

    namespace Stark;

    // app/routes.php

    $edmure = new \Tully\Edmure();

    ```


    Again, we need the prefixing backward slash to bring us back to the global namespace,
    before instantiating a class from the ‘Tully’ namespace.

    It could get tiring, referring to classes within other namespaces by their full
    hierarchy each time. Luckily, there''s a nice little shortcut we can use. Let''s
    see it in action.


    ## Example 10: Create a Tully\Edmure instance.


    ```php

    <?php

    namespace Stark;

    use Tully\Edmure;

    // app/routes.php

    $edmure = new Edmure();

    ```


    Using the use statement, we can bring one class from another namespace into the
    current namespace. This will allow us to instantiate it by name only.

    Let me show you another neat trick. We can give our imported classes little nicknames,
    like we used to do in the PHP playground. Let me show you.


    ## Namespaces


    ## Example 11: Namespace aliasing.


    ```php

    <?php

    namespace Stark;

    use Tully\Brynden as Blackfish;

    // app/routes.php

    $Brynden = new Blackfish();

    ```


    By using the ''as'' keyword, we have given our ''Tully\Brynden'' class the ''Blackfish''
    nickname. This will allow us to use the new nickname to identify within the current
    namespace. Neat trick? It''s also really handy if you need to use two similarly
    named classes within the same namespace. For example:


    ## Example 12: Similar named classes.


    ```php

    <?php

    namespace Targaryen;

    use Dothraki\Daenerys as Khaleesi;

    // app/routes.php

    class Daenerys {

    }

    // Targaryen

    $daenerys = new Daenerys();

    // Dothraki\Daenerys

    $khaleesi = new Khaleesi();

    ```


    By giving the ''Daenerys'' within the ''Dothraki'' namespace a nickname of ''Khaleesi'',
    we are able to use two ''Daenerys'' classes by name only. Handy right? The game
    is all about avoiding conflicts, and grouping them by purpose.


    You can use as many classes as you need to.


    ## Namespaces


    ## Example 13: Use multiple classes.


    ```php

    <?php

    namespace Targaryen;

    use Dothraki\Daenerys;

    use Stark\Eddard;

    use Lannister\Tyrion;

    use Snow\Jon as Bastard;

    ```


    ## Structure


    Namespaces aren''t just about avoiding conflicts. We can also use them for organisation,
    and ownership. Let me explain with another example. Let''s say I want to create
    a library I''d love for others to use my code. The trouble is, I don''t want to
    cause any name conflicts for the wonderful. That would be terribly inconvenient.
    Here''s how I can avoid hassle for the open source embracing, individual.


    ## Example 14: Namespace structure.


    ```

    Day\Blog\Content\Post

    Day\Blog\Content\Page

    Day\Blog\Tag

    ```


    Here we have used my name to show that I created the original code, and to separate
    my code from that. Inside the base namespace, I have created number of sub-namespaces
    to organise my application by its internal structure.


    ## Limitations


    In truth, I feel a little guilty for calling this ‘Limitations’. What I''m about
    to talk about isn''t really bug. You see, in other languages, namespaces are implemented
    in a similar way, and those languages provide an additional feature when interacting
    with namespaces.


    ## Namespaces


    For example, you are able to import number of classes into the current namespace
    by using the import statement with a wildcard. In Java, ''import'' is equivalent
    to ''use'', and uses dots to separate the nested namespaces (or packages). Here''s
    an example.


    ## Example 15: Namespace importing.


    ```

    import dayle.blog.*;

    ```


    This would import all of the classes. In PHP you can''t do that. You have to import
    each class individually. Actually, why am I saying sorry? Go and complain to the
    PHP team instead, they have given us a lot of cool stuff recently. Here''s a neat
    trick you can use. Imagine that we have this namespace structure, as in the previous
    example.


    ## Example 16: Example structure.


    - Day\Blog\Content\Page

    - Day\Blog\Content\Page

    - Day\Blog\Tag


    We can give a sub-namespace nickname, to use its child classes. Here''s an example:


    ## Example 17: Namespace aliasing for relative access.


    ```php

    <?php

    namespace Baratheon;

    use Day\Blog as Cms;

    // app/routes.php

    $post = new Cms\Content\Post;

    $page = new Cms\Content\Page;

    $tag = new Cms\Tag;

    ```


    This should prove useful if you need to use many classes within the same namespace.


    ## What now?


    Oh no! You''ve gone and ran out of book, haven''t you? I suppose that means that
    we''ve come to the end of our journey, for now. You see, I''m constantly updating
    my books to include new content, better explanations, and a bunch of other neat
    stuff. Don''t worry, all the updates are free! If you haven''t downloaded a fresh
    copy in a while, you very much want to do so.


    Hopefully, you''ve found inspiration to start building some applications with
    PHP, and I very much encourage you to do so! Practical experience is something
    that every developer will need to further their skillset.


    Did you find something missing from the book, or is there something you didn''t
    quite understand? Send me an email to me@dayelere.com to let me know, and I''ll
    update the book to help both you and others.


    Didn''t find anything missing? Send me an email to say hi! I love hearing from
    my readers.


    If you''re eager to learn more about PHP, then let me share with you a little
    secret. PHP Pandas is part of a bigger series of books that I like to call ''PHP
    for Everyone''. The next instalment in the series will be a book about using PHP
    on the web. Be sure to follow @dayelerees on twitter, and keep your eyes open
    for future updates!


    If you''ve enjoyed reading PHP Pandas, then please share your enjoyment with the
    world. Recommend the book to your friends, tweet about it, or post whenever someone
    is learning to learn the language. I''d love more than anything for this book
    to become the #1 resource for learning the PHP language.


    What, you''re still here? Our journey may have come to an end, but if you''re
