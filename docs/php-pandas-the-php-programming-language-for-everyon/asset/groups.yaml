  mdcn: "\n\n## Functions\n\n### 示例 16：输出。\n\n- 1 欢迎来到 PHP Pandas，读者！\n\n做得好！我们收到了热烈的欢迎。我们为什么不尝试一些不同的值呢？这将证明该函数现在是动态的。\n\
    \n### 示例 17：不同的参数。\n\n```php\n1 <?php\n2 // 欢迎某人！\n3 function welcome($name) {\n\
    4 echo \"Welcome to PHP Pandas, {$name}!\\n\";\n5\n6 }\n7\n8 // 调用 welcome 函数。\
    \ // 就是你！\n9 welcome('reader');\n10 welcome('Captain Jon Morgan'); // 这是一个很棒的家伙！\n\
    11 welcome('Arno Dorian'); // 万事皆虚...\n12 welcome(64.54); // 那不是名字！\n```\n\n在这里，我们调用了四次函数。每次，我们都提供了一个不同的值。第四个值是一个浮点数（float），这证明了向我们的函数提供什么类型的数据并不重要。我还在\
    \ echo 语句中添加了一个换行符 (\\n) 以让它看起来更清晰。让我们执行这段代码段。\n\n### 示例 18：输出。\n\n```\n- 1 Welcome\
    \ to PHP Pandas, reader!\n2 Welcome to PHP Pandas, Captain Jon Morgan!\n3 Welcome\
    \ to PHP Pandas, Arno Dorian!\n4 Welcome to PHP Pandas, 64.54!\n```\n\n我们看到函数的结果每次都发生变化，取决于我们提供的输入。这让我们对函数有了更多的控制权，并能够对不同的值做出不同的反应。正如你从第四个值看到的，传递到函数中的数据类型是什么并不重要，我们的代码运行得很愉快。\n\
    \n我们并不局限于一个参数。我们可以在函数中使用尽可能多的参数。让我们充分滥用一下这个特性吧，好吗？让我们创建一个带有……整整五个参数的函数！我们是多么叛逆啊！\n\
    \n### 示例 19：多个参数。\n\n```php\n<?php\n// 累加一些值。\nfunction addify($first, $second,\
    \ $third, $fourth, $fifth) {\n    return $first + $second + $third + $fourth +\
    \ $fifth;\n}\n\n// 调用 addify。\necho addify(1, 1, 2, 3, 5);\n```\n\n我们写了一个函数，它将接受\
    \ 5 个值作为参数，并返回它们的和。使用我们的 addify() 函数，顺序并不重要，但值得注意的是，你提供的参数顺序与函数签名中的占位符是匹配的。在上面的示例中，$first\
    \ 的值将是 1，$fifth 的值将是 5。\n\n五个参数很棒，但感觉对于像 addify() 这样的函数不应该有限制。我们应该能够累加任意数量的参数。我刚刚得了一个主意！让我们使用\
    \ `func_get_args()`。这是一个特殊的 PHP 函数，它将返回一个包含所有参数传递给函数的数值数组。更棒的是，我们不需要定义任何参数就可以工作。这里有一个例子。\n\
    \n### 示例 20：无限参数。\n\n```php\n<?php\nfunction welcome() {\n    // 获取所有函数参数。\n \
    \   $names = func_get_args();\n\n    // 遍历名称并欢迎他们。\n    foreach ($names as $name)\
    \ {\n        echo \"Welcome, $name!\\n\";\n    }\n}\n```\n\n我们在自己的函数内部使用了另一个名为\
    \ `func_get_args()` 的函数。这意味着，函数也可以使用其他函数！当我们使用 `func_get_args()` 时，我们以索引数组的形式接收传递给函数的任何参数。我们甚至不需要为它们创建占位符变量。这意味着上面的函数可以接受任意数量的参数。这里有一个\
    \ true例：\n\n### 示例 21：大量参数。\n\n```php\nwelcome('Dayle', 'James', 'Andrea', 'Ben',\
    \ 'Mateusz');\n```\n\n我们使用五个名字调用该函数，并收到了以下响应。\n\n### 示例 22：输出。\n\n```\nWelcome,\
    \ Dayle!\nWelcome, James!\nWelcome, Andrea!\nWelcome, Ben!\nWelcome, Mateusz!\n\
    ```\n\n所有五个人都收到了欢迎。如果我们改变参数的数量会发生什么？让我们尝试用两个名字。\n\n### 示例 23：两个参数。\n\n```php\n\
    <?php\nwelcome('Anthony', 'Alex');\n```\n\n我们的函数不在乎。从 `func_get_args()` 返回的数组现在将包含两个值，循环将正常继续。\n\
    \n### 示例 24：输出。\n\n```\nWelcome, Anthony!\nWelcome, Alex!\n```\n\n## 类型提示 (Type\
    \ Hinting)\n\n在本章稍早些时候，我们提到了那些函数。即接收特定参数的函数。我确定你已经见过它们。那么，如果你把一个数组放在参数所在的位置会发生什么呢？你认为它能工作吗？它会造成一个巨大的混乱！\n\
    \n你说得对！我们会得到到处都是错误。有时候，函数只是为了接收特定类型而设计的。如果我们想确保参数是某种类型，我们可以使用名为“类型提示”（type-hinting）的技术。让我们来看看实际操作。\n\
    \n### 示例 25：对数组进行类型提示。\n\n```php\n<?php\n// 向一组人打招呼。\nfunction sayHello($names)\
    \ {\n    foreach ($names as $name) {\n        echo \"Hello, $name!\\n\";\n   \
    \ }\n}\nsayHello(['Katie', 'Corissa', 'Lucy']);\n```\n\n我们得到了另一个名为 sayHello()\
    \ 的函数。在这个例子中，我们遇到的唯一情况是输入 $names 在参数占位符之前被类型提示为数组（array）。如果我们执行代码，就会得到预期的输出。\n\
    \n### 示例 26：输出。\n\n```\nHello, Katie!\nHello, Corissa!\nHello, Lucy!\n```\n\n\
    让我们改变函数调用以传递一个数字。我们是不是很调皮？\n\n### 示例 27：调皮。\n\n```php\n<?php\nsayHello(4);\n```\n\
    \n现在发生了什么？\n\n### 示例 28：输出。\n\n```\nPHP fatal error: Argument 1 passed to sayHello()\
    \ must be of the type array, integer given.\n```\n\n有趣！PHP 现在对我们发火了。有了类型提示，PHP\
    \ 将仅允许将数组传递给 sayHello() 函数。如果我们传递其他任何内容，就会得到一个致命错误。`catchable` 部分意味着我们可以使用 `try`\
    \ 块来处理此错误，但我们稍后会说。类型提示非常有用，不是吗？很好，你可以类型提示 `string`、`boolean` 或 `float` 等值。这很痛苦，但你必须处理它。这看起来很奇怪，不是吗？很好，你可以类型提示参数，不是吗？好，你将发现你可以类型提示类（classes），但我们会在学习类后对其进行详细解释。一步一步来，小学徒。\n\
    \n## 14. 闭包 (Closures)\n\n我们要来点 closure 吗？好的，那个很糟糕。虽然这个词很奇怪，不是吗？闭包是特殊的函数。这些类型的函数没有名字。就像武士一样！\n\
    \n### 谁需要名字？\n\n### 示例 01：闭包。\n\n```php\n<?php\nfunction () {\n    return 'bar';\n\
    }\n```\n\n太棒了！等等。如何调用一个没有名字的函数？由于闭包是特殊的，我们可以像赋值简单值一样赋值它们。让我们来看看语法。\n\n### 示例 02：将闭包赋值给变量。\n\
    \n```php\n<?php\n$cat = function () {\n    echo 'Oh long Johnson!';\n}\n```\n\n\
    在这里我们将匿名函数（或“闭包”）赋值给变量 $cat。该函数返回与流行迷因相关的字符串。\n\n注意我们在函数后面添加了分号。这是因为它是赋值语句的一部分，就像任何其他单行\
    \ PHP 代码一样。\n\n现在我们把这个闭包捕获在变量中，我们可以像调用任何其他函数一样调用它！例如：\n\n### 示例 03：执行赋值的闭包。\n\n\
    ```php\n<?php\n$cat();\n```\n\n我们只需在变量上加上括号，代码就会执行。\n\n### 示例 04：输出。\n\n```\n\
    Oh long Johnson!\n```\n\n### 将函数传递给函数...\n\n闭包出现在 PHP 5.3 中，这意味着它们相当新了！它们是 PHP\
    \ 世界的游戏规则改变者，因为它们允许你将小逻辑段传递给函数。没错，你可以将闭包传递给函数。让我们来看看实际操作。\n\n噢，顺便说一下，我确实提到过可以类型提示\
    \ Closure？只需在参数之前放置 Closure 即可确保只将闭包作为参数传递给方法。如果你对闭包调用 get_type()，你将得到值 closure。它是\
    \ PHP 中的一个复杂对象。稍后我们会看到其他此类型的对象。\n\n"
