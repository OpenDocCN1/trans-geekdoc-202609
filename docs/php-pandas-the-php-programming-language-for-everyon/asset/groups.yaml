    \ functions with the same name.\n\n# Includes\n\nSo why do we have two functions?\
    \ Well we're twice. When including PHP code into your application, Decide whether\
    \ require or require_once is more appropriate.\n\nExample 09: Requiring a file\
    \ only\n\n```php\nrequire_once 'welcome.php';\nrequire_once 'welcome.php';\necho\
    \ welcome('Alastair');\n```\n\nExample 10: Output.\n\n```\nWelcome, Alastair!\n\
    ```\n\nHurray! It works. You see, the require_once statement will only include\
    \ a file. The second time the statement is executed, the file is ignored, and\
    \ the collision is avoided.\n\n# 16. Classes\n\nWell, now we're really cooking\
    \ with fire. We get to learn about classes!\n\nClasses give our applications structure.\
    \ They allow for object-oriented programming. You've probably heard of that term\
    \ before? It means treating our code as objects, bringing familiarity to how we\
    \ use objects the real world. Let's stick with the baby steps, though, shall we?\n\
    \n# First Class\n\nSo how do we create a class? Let's take a look at some code.\
    \ First we're going to need a purpose for our class. We get started with object-oriented\
    \ programming, and create a class that will represent a book. We'll call the class\
    \ Book.\n\nExample 01: Creating a class.\n\n```php\n<?php\nclass Book{\n}\n```\n\
    \nThe syntax for a class, is fairly similar to that of a function. You may have\
    \ already spotted the block surrounded by { } braces. On the first line we have\
    \ the keyword class and the name of the class that we want to create.\n\nIt's\
    \ good practice to name your classes with an uppercase letter at the beginning.\
    \ It's also good practice to have a separate file for your class, with a similar\
    \ name. For example, the class above would be contained in a file called Book.php.\n\
    \nFor the purpose of simplifying the examples of the book. We will be keeping\
    \ classes in the same file for now.\n\nWe can't really do much with the class\
    \ as it stands, let's give it some properties. Properties are used to store data\
    \ within the class. For our book, they'll be used to further describe the book.\n\
    \nLet's think about the properties of a book for a moment. I can think of several.\n"
