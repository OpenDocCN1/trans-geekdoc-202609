    $first->title = 'Game of Thrones';\n$first->author = 'George R R Martin';\n$first->publisher\
    \ = 'Voyager Books';\n$first->yearOfPublication = 1996;\n\n// Create another book\
    \ instance.\n$second = new Book;\n\n// Set properties.\n$second->title = 'The\
