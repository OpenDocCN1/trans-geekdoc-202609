    \        // 处理其他食物。\n        default:\n            echo \"The panda eats the {$food}\"\
    ;\n    }\n}\n```\n\n让我们从小开始。让我们处理熊猫被喂了巧克力的情况。这是我们可能实现这一点的方法。\n\n## 示例 15: 捕获异常。\n\
    \n```php\n<?php\n// 设置食物类型。\n$food = 'chocolate';\ntry {\n    feedPanda($food);\n\
    } catch (PandaChocolateException $exception) {\n    echo 'That was a close one!\
    \ No chocolate for the panda.';\n}\n```\n\n这里有一些新语法，不是吗？让我们把它从代码中提取出来以便清晰。\n\n\
    示例 16: 捕获任何异常。\n\n```php\n<?php\ntry {\n    // 可能会触发异常的代码。\n} catch (Exception\
    \ $exception) {\n    // 处理异常的代码。\n}\n```\n"
