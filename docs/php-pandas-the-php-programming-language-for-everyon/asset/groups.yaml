  - "[PAGE 110]\n\nIn the above example, we've created two book instances. They both\
    \ have their own unique set of properties. They are individuals. What we've done,\
    \ is created a complex storage mechanism for information. Right now, our classes\
    \ don't have a huge advantage over using an array to store this information. Why\
    \ don't we unlock some other secrets that classes have to offer?\n\n# Default\
    \ Values\n\nOur classes are blueprints for new instances of objects. Sometimes,\
    \ the values that we expose may have defaults. For example, the majority of books\
    \ will be in a paperback format. However, rarely, you may need to mark a book\
    \ as hardback format.\n\nLet's add a format to our book class. We can save time\
    \ for ourselves by giving the class property a default value of 'Paperback'. Let's\
    \ examine the following code snippet.\n\nExample 08: Class property with default\
    \ value.\n\n```\n<?php\n// Define the Book class.\nclass Book {\n    // Declare\
    \ properties.\n    var $title;\n    var $author;\n    var $publisher;\n    var\
    \ $yearOfPublication;\n    var $format = 'Paperback';\n}\n```\n\nWe've assigned\
    \ a default value to the $format property, providing an assignment operator, followed\
    \ by the default value. This line ends with a semicolon. Let's check to make sure\
