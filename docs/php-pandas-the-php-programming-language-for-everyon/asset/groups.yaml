    \ ($pandas as $position => $panda) {\n    if ($position == 'second') {\n     \
    \   // 跳过迭代。\n        continue;\n    }\n    // 输出。\n    echo \"You are the {$position}\
    \ panda, {$panda}!\\n\";\n}\n```\n\n看看循环。我们有一个 `if` 语句，如果 `$position` 数组键等于字符串\
