  mdcn: "\n\n# 示例 07：初始化计数器。\n\n```php\n<?php\n$i = 0;\n```\n\n在这个实例中，我们设置了一个名为 $i\
    \ 的变量为 0。通常情况下，我鼓励你为变量使用描述性的名称，但 $i 某种程度上是一种传统。事实上，在构建 `for` 循环期间使用的大多数变量都是单字母，而\
    \ $i 似乎是所有字母中最常见的。老实说，我不确定为什么是这样，但这是一个自古以来的传统。如果阅读此书的读者恰好知道这个传统源于哪里，请告诉我！我会更新这本书。我最乐观的推测是\
    \ $i 代表迭代计数器（iteration counter）！\n\n接下来，我们有我们的条件。\n\n# 示例 08：设置条件。\n\n```php\n\
    <?php\n$i < 50;\n```\n\n这是我们在之前的章节中已经熟悉的循环部分。我们正在告诉 PHP，只要 $i 的值小于 50，就继续执行我们的代码块。\n\
    \n最后，我们有一个调整数值的语句。\n\n# 示例 09：修改计数器。\n\n```php\n<?php\n$i++;\n```\n\n我们可以用它来增加我们的计数器变量。该语句会在循环的每次迭代中执行。这意味着我们\
    \ `for` 循环的第一行可以表示为以下格式。\n\n# 示例 10：语法。\n\n```php\n<?php\nfor (_BEFORE; _CONDITION;\
    \ _AFTER_EACH_)\n```\n\n第一部分在每次循环执行之前执行。第二个语句（或条件）在每次循环执行时进行评估。最后，第三个语句在每次循环迭代后执行。\n\
    \n正如你从示例中较少的行数看到的，当涉及某种形式的计数器时，`for` 循环是实现循环的一种极佳方法。\n\n> 不要忘记！你不局限于纯粹递增计数器。你可以通过更大的步长来增加计数器，甚至对其进行乘法！\n\
    \n# Foreach\n\n`foreach` 循环在与可迭代类型（如数组）结合使用时非常有用。此循环的迭代次数由我们数组中项的数量决定。让我们来看一个例子。\n\
    \n# 示例 11：foreach 循环。\n\n```php\n<?php\n// 创建一个 pandas 数组。\n$pandas = ['Lushui',\
    \ 'Pali', 'Jasmina'];\n\n// 遍历我们的 panda 数组。\nforeach ($pandas as $panda) {\n \
    \   echo \"Hello there {$panda}!\\n\";\n}\n```\n\n我们创建了一个小小的 pandas 数组。我们已经是数组的大师了，不是吗？这对我们来说完全没有问题。让我们关注下一行。\n\
    \n# 示例 12：遍历数组。\n\n```php\n<?php\nforeach ($pandas as $panda)\n```\n\n循环以 `foreach`\
    \ 关键字开始。抱歉，剧透警告！我说的对吧？接下来是一组 ( ) 括号。在括号内，我们有两个由 `as` 关键字分隔的变量。我们正在告诉 PHP 遍历数组中的所有元素，并在每次迭代中将\
    \ $panda 赋值给当前数组元素。\n\n循环的最后部分当然是大括号内的代码块。我们现在对这些代码块已经非常熟悉了。它们包含了随着循环迭代而执行的代码。\n\
    \n在循环的第一次迭代中，$panda 将被设置为 'Lushui'，在下一次迭代中，$panda 将被设置为 'Pali'，在最后一次迭代中，$panda\
    \ 将被设置为 'Jasmina'。\n\n这是我最常用的循环。我每天大约使用它 23,543 次。大概这么多！这是因为我喜欢处理数组。\n\n在之前的章节中，我们发现了如何为数组提供自己的键（keys）。你可能想在循环中访问数组的键及其值。很好，别担心，哥们！PHP\
    \ 可以为你做到这些。让我们来看看语法。\n\n# 示例 13：带有键的 foreach 循环。\n\n```php\n<?php\n// 创建一个 pandas\
    \ 数组。\n$pandas = [\n    'first' => 'Lushui',\n    'second' => 'Pali',\n    'third'\
    \ => 'Jasmina'\n];\n\n// 遍历我们的数组。\nforeach ($pandas as $position => $panda) {\n\
    \    echo \"You're the {$position} panda, {$panda}!\\n\";\n}\n```\n\n这一次，我们有一个带有自定义键的数组。我们对键和值都使用了字符串，但它们可以是任何内容。我们没有简单地为每次循环迭代分配新变量，而是提供了一个由\
    \ `=>` 符号分隔的临时键和值占位符。\n\n让我们看看每次循环迭代这两个变量的值。\n\n# 循环\n\n- 第一次迭代 ($position = 'first')\
    \ ($panda = 'Lushui')\n- 第二次迭代 ($position = 'second') ($panda = 'Pali')\n- 第三次迭代\
    \ ($position = 'third') ($panda = 'Jasmina')\n\n我们可以使用这些临时变量来完成我们的任何疯狂的小计划。\n\
    我们完全可以随心所欲。\n\n值得注意的是，数组元素的副本会被传递到 `foreach` 循环块中。这意味着在循环内部对变量的任何更改在循环完成后将不会反映。\n\
    \n> 如果你想在 `foreach` 循环期间更改元素的值，只需使用 `key => value` 格式，并访问 `key => value` \n\n\
    这是我最常用的循环。我每天大约使用它 23,543 次。大概这么多！这是因为我喜欢处理数组。\n\n在之前的章节中，我们发现了如何为数组提供自己的键。你可能想在循环中访问数组的键及其值。很好，别担心，哥们！PHP\
