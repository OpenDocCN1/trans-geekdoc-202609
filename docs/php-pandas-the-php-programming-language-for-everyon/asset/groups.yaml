    \ that the function is a public one.\n\nSo we haven't learned any new tricks in\
    \ this section, have we? At least we found a way to make our code more descriptive.\
    \ Don't worry! In the next section we'll be learning something new. I promise!\n\
    \n## Private\n\nIn the previous section, we used the public keyword to mark our\
    \ class properties and methods as public. Let's try marking a class property as\
    \ private instead, shall we?\n\nWe'll start by modifying our previous example.\n\
    \nExample 05: A private property.\n\n```php\n<?php\nclass Panda\n{\n    // Declare\
    \ a private property...\n    private $coat = 'fluffy';\n    // ... and a public\
    \ method.\n    public function getCoat()\n    {\n        return $this->coat;\n\
    \    }\n}\n```\n\nIn the above example, you'll notice that the $coat property\
    \ has now been marked as private by using the private keyword. For now, we'll\
    \ leave the getCoat() method as public.\n\nLet's try to play with that private\
    \ $coat property. We'll just try to echo it out.\n\n## Scope 123\n\nExample 06:\
    \ Access a private property.\n\n```php\n// Create a new panda.\n$panda = new Panda;\n\
    // Try to echo the coat property.\necho $panda->coat;\n```\n\nWhat do you think\
    \ will happen when we execute the above piece of code? Well let's find out!\n\n\
    Example 07: Output.\n\nFatal error: Cannot access private property Panda::$coat\n\
    \nBecause our property is now marked as private, we can't access it from outside\
    \ the class. We will receive a fatal error if we decide to do so. We've protected\
    \ the $coat property from our grubby little hands!\nYou can't set the property\
    \ either! Let's give it a go.\n\nExample 08: Setting a private property.\n\n```php\n\
    <?php\n// Create a new panda.\n$panda = new Panda;\n// Try to set the coat property.\n\
    $panda->coat = 'slime';\n```\n\nLet's execute the code once again.\n\nExample\
    \ 09: Output.\n\nFatal error: Cannot access private property Panda::$coat\n\n\
    We receive the same error message as when we tried to retrieve the value of the\
    \ property.\nLet's try accessing that public method. I'll attach the class to\
    \ the example once again to refresh your memory.\n\nScope\n\n## Example 10: Access\
    \ public method.\n\n```php\n<?php\nclass Panda\n{\n    // Declare a private property...\n\
    \    private $coat = 'fluffy';\n\n    // and a public method.\n    public function\
    \ getCoat() {\n        return $this->coat;\n    }\n}\n\n// Create a new panda.\n\
    $panda = new Panda;\n\n// Try to echo the coat property.\necho $panda->coat;\n\
    ```\n"
  mdcn: "\n## 18. 作用范围 (Scope)\n\n我们都有秘密，不是吗？我的秘密就是我从卡迪夫动物园偷了无数只小熊猫。我把它们都藏在我的地下室里，在那里训练它们参加第三次世界大战。实际上，假装你没听到刚才那些话就好了。\n\
    \n如果你有一些不想让别人碰的东西，你会希望让它保持**私有 (private)**。有些东西注定是要分享的，并且将**公开 (publicly)** 可。有时，你愿意分享你的秘密，但你会想要**保护\
    \ (protect)** 它们，以免它们伤害到你。\n\n你的代码也不大区别。其他人可能想使用你的类，这没关系，你不希望他们乱改可能会破坏其功能的东西。我们可以通过在方法和属性上定义作用范围，帮助他人以合理的方式使用我们的代码。\n\
    \n## 公有 (Public)\n\n目前为止，我们一直在使用 `var` 来声明类属性，并仅使用 `function` 来创建类方法。以这种方式声明变量会使其变成公共的。\n\
    \n公共属性可以使用对象运算符 `->` 从类实例外部访问。例如：\n\n**示例 01**: 访问类属性。\n\n```php\n<?php\n$panda\
    \ = new Panda;\necho $panda->name;\n```\n\n公共方法可以再次使用对象运算符 `->` 在实例上调用。\n\n作用范围\
    \ (Scope)\n\n## 示例 02: 访问类方法。\n\n```php\n<?php\n$panda = new Panda;\necho $panda->squeak();\n\
    ```\n\n由于我们目前的属性和方法都是公共的，为什么我们不开始使用具描述性的关键字来指示它们的作用范围呢？\n\n事实是，大多数程序员不会使用 `var`\
    \ 来声明他们的类属性。相反，使用 `public` 关键字更好。让我们来看一个例子，好吗？\n\n## 示例 03: 一个公共属性\n\n```php\n\
    <?php\nclass Panda {\n    public $coat = 'fluffy';\n}\n```\n\n从现在起你就这样声明类属性，不是吗？去吧，答应我！这只是更好的实现方法！\n\
    \n那些公共方法呢？我们也可以对它们应用 `public` 关键字，而且你应该这样做。让我们来看一个快速的例子。\n\n## 示例 04: 一个公共方法\n\
    \n```php\n<?php\nclass Panda {\n    public $coat = 'fluffy';\n    public function\
    \ getCoat() {\n        return $this->coat;\n    }\n}\n```\n\n## 作用范围 (Scope)\n\
    \n我们将 `public` 关键字放在 `function` 关键字之前。这不会产生任何区别，但现在更清楚了该函数是公共的。\n\n所以我们在这一节中没有学到任何新花样，对吧？至少我们找到了一种让代码更具描述性的方法。别担心！在下一节中我们将学习一些新东西。我保证！\n\
    \n## 私有 (Private)\n\n在上一一节中，我们使用 `public` 关键字将我们的类属性和方法标记为公共。让我们尝试将一个类属性标记为私有，好吗？\n\
    \n我们将从修改之前的示例开始。\n\n示例 05: 一个私有属性。\n\n```php\n<?php\nclass Panda\n{\n    // 声明一个私有属性...\n\
    \    private $coat = 'fluffy';\n    // ... 以及一个公共方法。\n    public function getCoat()\n\
    \    {\n        return $this->coat;\n    }\n}\n```\n\n在上面的示例中，你会注意到 $coat 属性现在已使用\
    \ `private` 关键字标记为私有。目前，我们将 `getCoat()` 方法保持为公共。\n\n让我们尝试玩玩那个私有的 $coat 属性。我们只尝试把它输出出来。\n\
    \n## 作用范围 Scope 123\n\n示例 06: 访问私有属性。\n\n```php\n<?php\n// 创建一个新的熊猫。\n$panda =\
    \ new Panda;\n// 尝试输出 coat 属性。\necho $panda->coat;\n```\n\n你认为执行上述代码时会发生什么？让我们来发现吧！\n\
    \n示例 07: 输出。\n\nFatal error: Cannot access private property Panda::$coat\n\n由于我们的属性现在被标记为私有，因此我们无法从类外部访问它。如果我们决定这样做，将会收到致命错误（fatal\
    \ error）。我们从我们肮脏的小手中保护了 $coat 属性！\n你同样不能设置该属性！让我们试一看。\n\n示例 08: 设置私有属性。\n\n```php\n\
    <?php\n// 创建一个新的熊猫。\n$panda = new Panda;\n// 尝试设置 coat 属性。\n$panda->coat = 'slime';\n\
    ```\n\n让我们再次执行代码。\n\n示例 09: 输出。\n\nFatal error: Cannot access private property\
    \ Panda::$coat\n\n我们和尝试获取属性值时收到的相同的错误信息。\n让我们尝试访问那个公共方法。\n"
