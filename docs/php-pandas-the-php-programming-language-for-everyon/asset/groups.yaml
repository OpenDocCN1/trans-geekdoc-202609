    # #9. Casting


    Things don''t always go the way you planned, do they? Variables aren''t always
    the right type. Fortunately, with PHP we can use a method known as ''casting''
    to force one data type to be another.


    # ## Basic Usage


    Let''s say we have a string with the following content.


    Example 01: Nothing new here.


    ```

    <?php

    $Panda = ''3'';

    ```


    Sure, it''s a 3, but internally PHP is holding it as a string, and treating it
    as a string. We can see this by dumping the value. If we use var_dump() on the
    $Panda variable, we''ll receive the following output


    Example 02: Output:


    ```

    string(1) "3"

    ```


    See PHP knows. Sure, when you perform arithmetic on the above string, PHP will
    cast the value to a numeric one internally, but what if we want to do it ourselves?
    What if we want to ensure that the variable is holding an integer instead. This
    is where casting is useful.


    In PHP, there are a number of functions to help cast, but as we''ve not started
    on functions yet, let''s use the ones available to us. We can cast a value into
    another data type by specifying the new data type during the assignment process.
    It sounds complicated, but it''s actually quite simple. Let''s take a look at
    an example in code.'
  - '[PAGE 57]


    # Example 03: Casting to integer.


    ```

    <?php

    // Set a string value.

    $spanda = ''3'';


    // Cast to integer.

    $spanda = (int) $spanda;


    // Dump result.

    var_dump($spanda);

    ```


    We set a string representation of the number three on the first line. There''s
    nothing new. On the next line we use rounded ( brackets ) containing a new data
    type to cast the provided value (in this case) of whatever data type was placed
    between the brackets. We''ve decided that it should be an integer, so we''ve provided
    the type int to our casting brackets. We could also have provided the type integer,
    they are interchangeable, but I find int is much faster to type, and much neater!


    Let''s take a look at the result.


    # Example 04: Output.


    ```

    int(3)

    ```


    Fantastic! Our panda is now an integer instead of a string. Shall we try casting
    the string to a float? Can you guess the syntax? It''s simple!


    # Example 05: Casting to float.


    ```

    <?php

    // Set a string value.

    $spanda = ''3'';


    // Cast to float.

    $spanda = (float) $spanda;


    // Dump result.

    var_dump($spanda);

    ```


    That''s right, we just use the type float instead of int. Let''s take a look at
    the result.'
  - '[PAGE 58]


    # Example 06: Output.


    ```

    float(3)

    ```


    Great! Our value is now a float.


    Our casts can also work in reverse. If we want a float value represented as a
    string, we could use the following example.


    # Example 07: Casting to string.


    ```

    <?php

    // Set a float value.

    $panda = 3.4567;

    // Cast to string.

    $panda = (string) $panda;

    // Dump result.

    var_dump($panda);

    ```


    If we dump out the result, we''ll find that our float value for $panda is now
    a string.


    # Example 08: Output.


    ```

    string(6) "3.4567"

    ```


    It''s clear what these casting examples achieve. I think that it''s what we expected
    of it. Arrays are a little more difficult, though. What do you think will happen
    if we try to cast a string to an array?


    When we have a question such as this, it always makes sense to write a little
    snippet to experiment with. Sometimes in my day-to-day work I forget what will
    happen with complicated casts or arithmetic, and I will construct a small demo
    snippet just to confirm my own understanding.'
