    \ 时，我们得到了：\n\n## 示例 11：输出。\n\n`The Panda munches on some tasty leaves.`\n\n许多开发者使用这些公共静态方法来创建它们所所属类的实例。例如……\n\
    \n## 示例 12：工厂方法。\n\n```php\n<?php\nclass RedPanda\n{\n    protected $name;\n \
    \   public function __construct($name = null)\n    {\n        $this->name = $name;\n\
    \    }\n    public static function make()\n    {\n        return new self('Hamish');\n\
    \    }\n    public function getName()\n    {\n        return $this->name;\n  \
    \  }\n}\n```\n\n在上面的示例中，我们的 `RedPanda` 类通过构造函数接收一个可选的 `$name` 参数。然后，它将受保护属性 `$name`\
    \ 设置为你传递的值。公共函数 `getName()` 可用于访问熊猫的名字。\n\n我们还有一个 `make()` 公共静态方法，它通过返回 `new self()`\
    \ 来创建当前类的新实例并将其返回。它甚至将 'Hamish' 作为名称传递，因此我们可以使用 `RedPanda::make()` 快速创建一个新的 Hamish\
    \ 熊猫实例。\n\n> 我们提到过你不能从静态方法中访问实例方法，但反过来是完全允许的！例如，你可以在非静态方法中使用 `self::staticMethodHere()`，PHP\
    \ 会完全没问题的。\n\n## 晚期静态绑定 (Late Static Binding)\n\n晚期静态绑定是 PHP 5.3 版本引入的一个特性。它的名字非常令人困惑，所以让我们用代码来演示。首先，我们需要两个类，并涉及一点继承。\n\
    \n## 示例 13：带有继承的静态方法。\n\n```php\n<?php\nclass Panda\n{\n    public static function\
    \ whoAmI()\n{\n        return self::getType();\n    }\n    public static function\
    \ getType()\n{\n        return 'I am a Giant panda!';\n    }\n}\nclass RedPanda\
    \ extends Panda\n{\n    public static function getType()\n{\n        return 'I\
    \ am a Red panda!';\n    }\n}\n```\n\n这里有两个类。`Panda` 是我们的基类，代表大熊猫。`RedPanda` 继承自\
    \ `Panda`，代表红熊猫……显而易见。基类有一个名为 `getType()` 的静态方法，它告诉你是大熊猫。这个方法在 `RedPanda` 类中被重写（overridden），让你知道它是一只红熊猫。\n\
    \n我们可以在两个类上使用静态方法 `whoAmI()` 来找出我们拥有什么种类型的熊猫。我们现在调用它……\n\n## 示例 14：我是谁？\n\n```php\n\
    <?php\necho Panda::whoAmI() . PHP_EOL;\necho RedPanda::whoAmI();\n```\n\n运行这段代码后，我们得到了以下输出。\n\
    \n## 示例 15：输出。\n\n```\n1 I am a Giant panda!\n2 I am a Giant panda!\n```\n\n等等，为什么它们都是大熊猫？！我们在\
    \ `RedPanda` 类中重写了 `getType()` 方法，所以 PHP 不应该尊重继承关系吗？实际上，`self` 关键字只会引用基类。。如果我们想使用晚期静态绑定，我们需要将\
    \ `self` 关键字替换为 `static`。让我们来看看这种转换。\n\n## 示例 16：晚期静态绑定。\n\n```php\n<?php\nclass\
    \ Panda\n{\n    public static function whoAmI()\n    {\n        return static::getType();\n\
    \    }\n    public static function getType()\n    {\n        return 'I am a Giant\
    \ panda';\n    }\n}\nclass RedPanda extends Panda\n{\n    public static function\
    \ getType()\n    {\n        return 'I am a Red panda';\n    }\n}\n```\n\n你会注意到，我们所做的只是将\
    \ `self` 替换为 `static`。现在尝试执行一次代码。\n\n## 示例 17：输出。\n\n```\n1 I am a Giant panda!\n\
    2 I am a Red panda!\n```\n\n搞定！PHP 现在尊重了继承关系以及对 `getType()` 方法的重写。理解静态方法的概念是一件棘手的事。在我职业生涯的很晚之后，我才开始有效地使用它们。如果你觉得这一章有点困惑，我建议暂时先使用实例继续进行，等积累了更多经验后再回到这一章。至少，你已经知道如何通过关键字识别静态属性和方法。\n\
    \n## 异常 (Exceptions)\n\n异常让我们知道程序运行没有达到预期。如果出现问题且我们的代码无法按预期继续，那么我们就使用异常来让用户知道。\n\
    \n## 抛出 (Throwing)\n\n让我们创建一个函数。最好先确保如何使用它。\n\n## 示例 01：熊猫喂食函数。\n\n```php\n<?php\n\
    /**\n * 给熊猫喂一些食物。\n * @param string $food\n * @return void\n */\nfunction feedPanda($food)\n\
    {\n    echo \"The panda eats {$food}\";\n}\n```\n\n做得好！现在我想起来了。这里有一个函数让我们给熊猫喂食，对吧？让我们给它喂一些苹果。\n\
    \n## 示例 02：给熊猫喂一个苹果。\n\n```php\n<?php\nfeedPanda('apple');\n```\n\n让我们运行代码。\n\n\
    ## 示例 03：输出。\n\n```\nThe panda eats the apple.\n```\n\n太棒了！那巧克力呢？你认为熊猫喜欢巧克力吗？不，因为巧克力对熊猫是有毒的。我们不想让它们吃巧克力。\n\
    \n嘿，我有一个主意。如果有人给熊猫喂巧克力，我们不要抛出一个异常怎么样？让我们试试看。\n\n## 示例 04：抛出异常。\n\n```php\n<?php\n\
    /**\n * 给熊猫喂一些食物。\n * @param string $food\n * @return void\n */\nfunction feedPanda($food)\n\
    {\n    if ($food === 'chocolate') {\n        throw new Exception('NO CHOCOLATE\
    \ FOR THE PANDA!');\n    }\n    echo \"The panda eats {$food}\";\n}\n```\n\n首先，检查我们要给熊猫喂的食物是否等于字符串\
    \ 'chocolate'。如果字符串匹配，我们需要使用异常。让我们孤立地看这段代码。\n\n## 示例 05：抛出异常。\n\n```php\n<?php\n\
    throw new Exception('NO CHOCOLATE FOR THE PANDA!');\n```\n\n完美，我们的熊猫是安全的。我保证熊猫不会受到伤害。让我们执行代码。\n\
    \n## 示例 06：给熊猫喂巧克力。\n\n```php\n<?php\nfeedPanda('chocolate');\n```\n\n## 示例 07：输出。\n\
    \n```\nPHP Fatal error: Uncaught exception 'Exception' with message 'NO CHOCOLATE\
    \ FOR THE PANDA!' in file:<line>\n```\n\n"
