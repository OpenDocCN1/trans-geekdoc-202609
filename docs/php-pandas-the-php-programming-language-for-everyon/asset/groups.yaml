  - "[PAGE 106]\n\n# Classes\n\n96\n\n+   * Title.\n* Author.\n* Publisher.\n* Year\
    \ of publishing.\n\nLet's reflect these properties on our Book class. Here goes\
    \ nothing!\n\nExample 02: Class properties.\n\n```\n<?php\nclass Book {\n    var\
    \ $title;\n    var $author;\n    var $publisher;\n    var $yearOfPublication;\n\
    }\n```\n\nVariables that belong to a class, are called 'class properties'. For\
    \ now, we'll use the var keyword, along with the typical variable notation to\
    \ define class properties. Don't worry about the var keyword too much, we'll take\
    \ a look at some alternatives later.\n\nWe're now ready to start working with\
    \ our class.\n\n# Instances\n\nThe class that we've defined, is actually a blueprint.\
    \ We can use it to make a new instance of a Book object. The key word there is\
    \ new. An instance, is a class that we can use. We can have multiple instances\
    \ of the same class. It's something that' really hard to explain in text, so let's\
    \ look at a code sample."
  - "[PAGE 107]\n\n# Example 03: Creating an instance of a class.\n\n```\n<?php\n\
    class Book {\n    var $title;\n    var $author;\n    var $publisher;\n    var\
    \ $yearOfPublication;\n}\n\n$book = new Book;\n```\n\nWe create a new instance\
    \ of the Book class, and assign it to the $book variable. We do this using the\
    \ new keyword, and then the class name that we wish to instantiate. Now that we\
    \ have an instance of class, we can play with its properties. Let's start by setting\
    \ the properties for our book.\n\n# Example 04: Setting class properties.\n\n\
    ```\n<?php\n// Define the Book class.\nclass Book {\n    // Declare properties.\n\
    \    var $title;\n    var $author;\n    var $publisher;\n    var $yearOfPublication;\n\
    }\n\n// Create a new book instance.\n$book = new Book;\n\n// Set properties.\n\
    $book->title = 'Game of Thrones';\n$book->author = 'George R Martin';\n```"
