    ## 基础算术


    - 乘法

    - 除法

    - 取模

    - 加法

    - 减法


    优先级最高的运算符位于表格的顶部。这意味着当 PHP 检查 `4 + 3 * 2 / 1` 时，它会先计算 `3 * 2 = 6`，然后是 `/ 1 = 6`，最后是
    `4 + 6` 得到答案 10。


    当我编写数学类的代码行时，我喜欢使用括号来避免任何混乱。我发现这有助于明确行的意图，使其更具可读性。


    ## 过程


    PHP 代码是按过程解析的。这意味着它是逐条语句被读取和执行的。虽然可以在同一行上放置多个语句，但这在 PHP 开发者中并不常见。这意味着我们也可以逐行来处理代码。我们可以通过在
    PHP 文件中添加更多语句来看到这一点。


    示例 11：多语句。


    ```php

    <?php

    echo 2 + 2;

    echo 3 + 3;

    echo 4 + 4;

    echo 5 + 5;

    ```


    现在，让我们执行该文件...


    示例 12：输出。


    ```

    46810

    ```


    四万六千吉瓦！


    冷静点，读者！我们只是告诉 PHP 输出结果，而不是在输出中放入空格或换行符。这意味着 PHP 正确计算了数值。如果我们像这样在 PHP 给我们的结果之间加上空格...


    ## 示例 13：增加清晰度的输出。


    + 1 4 6 8 10


    ...那么我们看到计算实际上是正确的。只是 PHP 非常听话，它直接一个接一个地输出了这些值。

    我之前提到过很多 PHP 是一门灵活且宽容的语言。让我们来测试一下，好吗？到目前为止，我们的语句在每个“单词”（或数字）之间只有一个空格。让我们以不一致的格式添加额外的空格看看会发生什么。这是我们修改后的代码。


    ## 示例 14：空白字符。


    ```php

    <?php

    echo      2      + 2;

    echo            3      +3;

    echo 4+4;

    echo      5+      5      ;

    ```


    虽然它看起来并不漂亮，但如果你执行这段代码，你会发现它运行得完美。PHP 并不关心代码中单词之间空白字符的数量。它只是处理它们。（插入一只戴墨镜的狗...）


    你会注意到某些算术操作，例如 4+4，完全不需要空格。虽然事实确实如此，但在所有的语法变化中并不一致。例如，考虑以下代码段。


    ## 示例 15：echo 后无空格。


    ```php

    <?php

    echo5 + 5;

    ```


    如果你尝试执行此脚本，你会发现 PHP 会抛出一个通知“使用未定义的常量 echo5 - 假设为 ''echo5''”。这是因为并不知道 echo5 这个单词是在告诉它做什么。由于由于原因，最好在你的单词之间至少放置一个空格。


    至于语句，如果我们是自虐虐狂的，我们可以选择将所有语句放在同一行上。这是一个示例。


    ## 基础算术


    示例 16：多语句，单行。


    ```php

    <?php echo 2 + 2; echo 3 + 3; echo 4 + 4; echo 5 + 5;

    ```


    这是完全有效的 PHP，但你找不到很多开发者会这样做。每行保留一个语句会让源文件更容易阅读和理解。这也会给版本控制系统带来问题！


    我们已经看到 PHP 不在乎你是否在源代码中使用多个空格，它也将换行符视为空白字符。这意味着下面的代码段是完全合法的。


    示例 17：单语句，多行。


    ```php

    <?php

    echo

    4

    5

    ;

    ```


    不相信吗？去试试吧！虽然代码按预期运行，但它并不是最有可读性的代码。如果我抓到你写这样的代码，你就得挨板抽子了！


    然而，换行有一个实际用途。如果某一行非常长，就会变成一个可读性问题。我们可以通过在适当的阅读长度处应用换行来解决这个问题。许多开发者还会在下一行使用四个空格（或你当前的
    tab 设置）来表示这是上一行的延续。这与正式文本使用缩进句子来表示新段落的方式类似。


    这是一个为了可读性而进行换行的示例。


    示例 18：整洁的换行。


    ```php

    <?php

    echo (3 * 5) / (7 / 12) * (7 * 6) + (7 % 3)

    + (6 + 7) * (12 / 3);

    ```


    那是些很厉害的数学，但希望你会发现它更容易阅读。


    值得注意的是，你可以在代码中插入空行来增加清晰度。这是一个示例。


    ## 基础算术


    示例 19：为了清晰而额外的换行。


    ```php

    <?php

    echo 3 + 2;

    echo 7 * 7;

    echo 5;

    ```


    所以你看到，PHP 可以非常灵活。


    ## 变量与赋值


    变量就像我们存储信息的容器。你可以向变量中放入一个值，稍后使用它。在 PHP 中，我们使用 $ 符号来表示变量。这是一个示例。


    ```php

    <?php

    $name = "John";

    echo $name;

    ```


    在这个示例中，$name 是变量，“John" 是存储在其中的值。我们可以随时更改变量的值。


    ```php

    <?php

    $name = "John";

    $name = "Jane";

    echo $name;

    ```


    变量可以持有不同类型的数据，例如整数、字符串和布尔值。


    ```php

    <?php

    $age = 25;

    $name = "Alice";

    $is_student = true;

    ```


    我们还可以在数学表达式中使用变量。


    ```php

    <?php

    $x = 10;

    $y = 20;

    $sum = $x + $y;

    echo $sum;

    ```


