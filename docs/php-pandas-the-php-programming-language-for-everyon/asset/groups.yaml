    \n// Cast to string.\n$panda = (string) $panda;\n\n// Dump result.\nvar_dump($panda);\n\
    ```\n\nIf we dump out the result, we'll find that our value for $panda is now\
    \ a string.\n\nExample 08: Output.\n\n```\nstring(6) \"3.4567\"\n```\n\nIt's clear\
    \ what these casting examples achieve. I think it's what we expected. Arrays are\
    \ a little more difficult, though. What do you think will happen if we try to\
    \ cast a string to an array? When we have such a question, it always makes sense\
    \ to write a little snippet to experiment with. Sometimes in day-to-day work I\
    \ forget what happens with complicated casts, and I will construct a small snippet\
    \ just to confirm my understanding.\n\nExample 09: Casting to array.\n\n```php\n\
    <?php\n$panda = 'Lushui';\n\n// Cast to array.\n$panda = (array) $panda;\n\n//\
    \ Dump result.\nvar_dump($panda);\n```\n\nWe'll use the array type to cast to\
    \ an array. So, what happened?\n\nExample 10: Output.\n\n```\narray(1) {\n  [0=>string(6)\
    \ \"Lushui\"\n}\n```\n\nWell, that's interesting! It looks like PHP has wrapped\
    \ our string within an indexed array. In other languages, a statement as this\
    \ might have split our string into an array of characters (letters), but PHP doesn't\
    \ have the concept of a character type, and so it handles the statement little\
    \ differently.\n\nThis wrapping of a string is actually fairly useful. If a piece\
    \ of our code demands that the variable it uses is an array, then we can simply\
    \ cast it to an array to have the value wrapped. What happens if we try to cast\
    \ a float value to an array? I suppose it will wrap that too, shall we check?\n\
    \nExample 11: Casting float to array.\n\n```php\n<?php\n$panda = 1.98765;\n\n\
    // Cast to array.\n$panda = (array) $panda;\n\n// Dump result.\nvar_dump($panda);\n\
    ```\n\nExample 12: Output.\n\n```\narray(1) {\n  [0]->float(1.98765)\n}\n```\n\
    \nGreat! As we had expected, our float has been wrapped in an array too. Don't\
    \ be afraid to use casting to bully your values into the right data type. They\
    \ are here to work for you, after all!\n\nIn the next chapter we'll learning more\
    \ about comments.\n\n# 10. Comments\n\nWe've been using single line comments up\
    \ until now to help explain what happens within our code snippets. It's time to\
    \ take a look at the other types of comments available to us, so that we have\
    \ better methods of learning for when our snippets become a little more complicated.\n\
    \n## Single Line\n\nSingle line comments are the ones that we've been using so\
    \ far. They begin with a double // slash, and can occupy a single line. Like this.\n\
    \nExample 01: Single line comments.\n\n```php\n<?php\n// This is a single line\
    \ comment.\n```\n\nWhitespace doesn't affect them; they begin at the double forward\
    \ slash, and terminate at the end of the line. This means that we could place\
    \ them after our code if we wanted.\n\n(Note: The OCR text became highly repetitive/broken\
    \ in the later pages, I have processed the available coherent sections.)\n"
  mdcn: "\n# 9. 类型强制转换 (Casting)\n\n事情并不总是按照你的计划进行，不是吗？变量的类型也不总是正确的。幸运的是，在 PHP 中，我们可以使用称为“强制转换”的方法将一种数据类型强制转换为另一种数据类型。\n\
    \n## 基础用法\n\n假设我们有一个包含以下内容的字符串。\n\n示例 01：这里没有新内容。\n\n```php\n<?php\n$Panda = '3';\n\
    ```\n\n当然，它是一个 3，但在 PHP 内部它存储为字符串，并将其视为字符串。我们可以通过转储（dump）值来看到这一点。如果我们对 $Panda\
    \ 变量使用 `var_dump()`，我们将得到以下输出：\n\n示例 02： 输出：\n\n```\nstring(1) \"3\"\n```\n\n\
    看，PHP 是知道的。当然，当你对上述字符串进行算术运算时，PHP 会在内部将值转换为数值类型，但如果我们想自己进行转换呢？如果我们想确保变量持有的是整数呢？这正是强制转换很有用的地方。\n\
    \n在 PHP 中，有很多函数可以帮助进行转换，但由于我们还没有开始学习函数，让我们先使用现有的方法吧。我们可以通过指定过程将一个值转换为另一种数据类型。听起来很复杂，但实际上非常简单。让我们来看一个代码示例。\n\
    \n示例 03：转换为整数。\n\n```php\n<?php\n$spanda = '3';\n\n// 转换为整数。\n$spanda = (int)\
    \ $spanda;\n\n// 转储结果。\nvar_dump($spanda);\n```\n\n我们在第一行设置了数字的字符串表示。在下一行中，我们使用\
    \ `(int)` 加上放在括号之间的任何数据类型。我们决定它应该是一个整数，所以我们在强制转换括号中提供了 `int`。我们也可以以更快速、更整洁的方式提供类型！\n\
    \n示例 04： 输出。\n\n```\nint(3)\n```\n\n太棒了！我们的 panda 现在是一个整数而不是字符串。我们要不要尝试将字符串转换为浮点数（float）吗？你能猜出语法是什么吗？\n\
    \n示例 05：转换为浮点数。\n\n```php\n<?php\n$spanda = '3';\n\n// 转换为浮点数。\n$spanda = (float)\
    \ $spanda;\n\n// 转储结果。\nvar_dump($spanda);\n```\n\n没错，我们只需用 `float` 代替 `int` 即可。让我们看看结果。\n\
    \n示例 06： 输出。\n\n```\nfloat(3)\n```\n\n太棒了！我们的值现在是一个浮点数。转换也可以反向操作。如果我们想将一个浮点数值表示为字符串，可以使用下面的示例。\n\
    \n示例 07：转换为字符串。\n\n```php\n<?php\n$panda = 3.4567;\n\n// 转换为字符串。\n$panda = (string)\
    \ $panda;\n\n// 转储结果。\nvar_dump($panda);\n```\n\n如果我们转储结果，会发现 $panda 的值现在是一个字符串了。\n\
    \n示例 08： 输出。\n\n```\nstring(6) \"3.4567\"\n```\n\n这些强制转换示例实现的效果显而易见。我想这就是我们预期的。不过，数组稍微困难一点。你认为如果我们尝试将字符串转换为数组会发生什么？当我们遇到这类问题时，写一小段代码进行实验总是有意义的。在日常工作中，我有时会忘记复杂的转换会发生什么，我会构建一个小的片段来确认我的理解。\n\
    \n示例 09：转换为数组。\n\n```php\n<?php\n$panda = 'Lushui';\n\n// 转换为数组。\n$panda = (array)\
    \ $panda;\n\n// 转储结果。\nvar_dump($panda);\n```\n\n我们使用数组类型来转换为数组。那么，发生了什么？\n\n\
    示例 10： 输出。\n\n```\narray(1) {\n  [0=>string(6) \"Lushui\"\n}\n```\n\n噢，这很有意思！看起来\
    \ PHP 将我们的字符串封装在一个索引数组中。在其他语言中，这样的语句可能会将我们的字符串拆分为字符（字母）数组，但 PHP 没有字符类型的概念，因此它处理该语句的方式略有不同。\n\
    \n这种对字符串的封装实际上非常有用。如果我们的代码某部分要求使用的变量必须是数组，那么我们只需要将其转换为数组以使值被封装。如果我们尝试将浮点数值转换为数组会发生什么？我想它也会被封装，我们要检查一下吗？\n\
    \n示例 11：将浮点数转换为数组。\n\n```php\n<?php\n$panda = 1.98765;\n\n// 转换为数组。\n$panda =\
    \ (array) $panda;\n\n// 转储结果。\nvar_dump($panda);\n```\n\n示例 12： 输出。\n\n```\narray(1)\
    \ {\n  [0]->float(1.98765)\n}\n```\n\n太棒了！正如我们预期的，我们的浮点数也被封装在数组中了。不要害怕使用强制转换将你的值转换为正确的数据类型。毕竟，它们是为了为你服务的！\n\
    \n在下一章节中，我们将学习更多关于注释的内容。\n"
