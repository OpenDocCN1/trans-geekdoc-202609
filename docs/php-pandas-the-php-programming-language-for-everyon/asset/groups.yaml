    # 18. Scope


    We''ve all got secrets, haven''t we? Mine is that I''ve stolen countless red pandas
    from Cardiff Zoo. I''ve got them all stashed away in my basement, where I''m training
    them for a third world war. Actually, just pretend you didn''t hear all that.


    If you''ve got something that you don''t want people messing with, you''re going
    to want to keep it **private**. Some things are meant to be shared, and will be
    **publicly** available. Sometimes, you''re willing to share your secrets, but
    you''ll want to **protect** them so that they can''t damage you.


    Your code is no different. Others may want to use your class, and that''s just
    fine, you don''t want them fiddling with things that might break its functionality.
    We can help others to use our code in a sensible manner by defining scope on our
    methods and properties.


    # Public


    Up until now, we''ve been using `var` to declare class properties, and only `function`
    to create our class methods. Declaring variables in this way makes them public.


    A public property can be accessed from outside a class instance by using the object
    `->` operator. For example:


    **Example 01**: Access a class attribute.


    ```

    <?php

    $panda = new Panda;

    echo $panda->name;

    ```


    Public methods can be called on an instance using the object `` operator once
    more.'
  - "[PAGE 131]\n\nScope\n\n# Example 02: Access a class method.\n\n```\n<?php\n$panda\
    \ = new Panda;\necho $panda->squeak();\n```\n\nSince our properties and methods\
    \ so far have been public, why don't we start indicating their scope with a more\
    \ descriptive keyword?\n\nThe truth is, most programmers won't use var to declare\
    \ their class properties. Instead, it's better to use the public keyword. Let's\
    \ take a look at an example, shall we?\n\n# Example 03: A public property\n\n\
    ```\n<?php\nclass Panda {\n    public $coat = 'fluffy';\n}\n```\n\nThis is how\
    \ you're going to declare your class properties from now on, isn't it? Go on,\
    \ promise me! It's just a better way of doing it!\n\nHow about those public methods?\
    \ Well we can apply the public keyword to those too, and you definitely should.\
    \ Let's take a look at a quick example.\n\n# Example 04: A public method\n\n```\n\
    <?php\nclass Panda {\n    public $coat = 'fluffy';\n    public function getCoat()\
    \ {\n        return $this->coat;\n    }\n}\n```"
