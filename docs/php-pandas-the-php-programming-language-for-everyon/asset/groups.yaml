  - "[PAGE 91]\n\n# Example 14: Function parameters.\n\n```\n<?php\n// Welcome someone!\n\
    function welcome($name) {\n    echo \"Welcome to PHP Pandas, {$name}!\";\n}\n\
    ```\n\nBetween the rounded brackets within our function signature, just after\
    \ the function name, we have our single parameter. We're calling it $name. These\
    \ parameters are placeholders for values we will be giving to the function when\
    \ we use it. This is what makes the function dynamic.\n\nThe parameters that are\
    \ given to the function are available for use within the function block. In the\
    \ above example, we use the $name parameter handled to the function, and echo\
    \ a welcome statement using the provided name.\n\nOf course, this snippet of code\
    \ won't do anything unless we tell PHP to execute, or 'call', the function. Let's\
    \ add the call line to our snippet.\n\n# Example 15: Passing parameters to functions.\n\
    \n```\n<?php\n// Welcome someone!\nfunction welcome($name) {\n    echo \"Welcome\
    \ to PHP Pandas, {$name}!\";\n}\n\n// Call the function\nwelcome('reader');\n\
    ```\n\nWe call the method using its name and rounded brackets. However, this time\
    \ we provide a string value reader within the brackets as our parameter. This\
    \ means that the $name parameter of our function will be set to reader. It will\
    \ only be set to this value for this one execution, and any later calls to the\
    \ function will be replaced by whichever parameter value we provide to it. Our\
    \ function doesn't have any state.\n\nLet's take a look at the result that we\
    \ see in our terminal, shall we?"
