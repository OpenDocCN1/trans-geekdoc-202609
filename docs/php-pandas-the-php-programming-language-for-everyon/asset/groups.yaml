  - "[PAGE 126]\n\n# Inheritance 116\n\nWe can also override class methods from parent\
    \ classes. All you need to do is redeclare the property or method that you want\
    \ to override in the child class.\nIf it’s not clear yet, the ‘parent’ class is\
    \ the class that you extend. In the above example, the parent class is Panda.\
    \ The ‘child’ class is the one that implements the extend keyword. This was GiantPanda\
