  - "[PAGE 65]\n\n# Example 09: Doc block with metadata.\n\n```\n1 <?php\n2 \n3 /**\n\
    4 * Description of pandas.\n5 *\n6 * @var string\n7 */\n8 $pandas = 'awesome!';\n\
    ```\n\nWe can provide extra metadata to our doc blocks using properties that are\
    \ prefixed with an @ symbol. Parameters associated with these properties are placed\
    \ on the same line, and multiple parameters can be separated with spaces.\n\n\
    With the provided @var property, our documentation system knows that the $panda\
    \ variable contains a string value, and can display this information to help others\
    \ learn more about the code.\n\nDon't worry too much about these doc blocks, we'll\
    \ stick to the other comments for now. In a later chapter I'll start to introduce\
    \ them. I just wanted you to be aware of them, just in case you happen to see\
    \ them somewhere else.\n\nIn the next chapter, we'll be taking a look at forks,\
    \ so you better go and raid your cutlery drawer!"
  - "[PAGE 66]\n\n# 11. Forks\n\nRight now your application follows the sequence of\
    \ lines that you've placed in your source files. Life isn't like that, though,\
    \ is it? We don't just blindly follow orders. We make decisions based on the information\
    \ around us.\n\nIn PHP, our information is held within variables. To make decisions\
    \ based on the value of these variables we can use forks. They fork the flow of\
    \ our application, changing its path depending on the result of a comparison.\
    \ In PHP, we can call this an if statement.\n\n# If\n\nLet's take a look at a\
    \ basic if statement. I think it might be best if we lead with an example, don't\
    \ you?\n\nExample 01: The if statement.\n\n```\n<?php\nif (true) {\n  echo 'Yey,\
    \ panda time!';\n}\n```\n\nAn statement always begins with an if. Well, I'm sure\
    \ you'd worked that out. We have two sections. The code within the { } brackets\
    \ is the condition. If the condition evaluates to a true value, then the code\
    \ within the { } braces will be executed.\n\nLet's execute this snippet to see\
    \ what happens.\n\nExample 02: Output.\n\nYey, panda time!\n\nAwesome! It's great\
    \ when it's panda time. The echo statement within the curly braces is executed\
    \ because the condition evaluates to true. Well, the condition is true, but that\
    \ still evaluates to a boolean true.\n\nLet's see what happens if we change the\
    \ condition to something that evaluates to a boolean false. How about this?"
  - "[PAGE 67]\n\n# Example 03: Another if statement.\n\n```\n<?php\nif (false) {\n\
    \    echo 'Yey, panda time!';\n}\n```\n\nLet's go ahead and execute the code one\
    \ more time.\n\n# Example 04: Output.\n\n```\n(nothing)\n```\n\nThere we go, nothing\
    \ happened. The code within our curly braces isn't executed when our condition\
    \ evaluates to false.\n\nYou might be asking yourself why this is useful? Why\
    \ can't just add or remove the line of code when we need it? Well, it's because\
    \ providing simply a boolean doesn't make the if statement very useful. It was\
    \ just a clean way of explaining conditions are evaluated as booleans.\n\nConsider\
    \ the following variation. There's a slight difference, can you spot it?\n\n#\
    \ Example 05: Comparing strings.\n\n```\n<?php\n$panda = 'Lushui';\nif ($panda\
    \ == 'Lushui') {\n    echo 'Yey, panda time!';\n}\n```\n\nThis time, we're comparing\
    \ the value of a string variable to another string. Once again, the echo statement\
    \ will be executed. This is because $panda does equal 'Lushui'. This means that\
    \ the condition once again evaluates to true.\n\nLet's change the value of $panda\
    \ to see what happens."
  - "[PAGE 68]\n\n# Example 06: Comparing different strings.\n\n```\n<?php\n$panda\
    \ = 'Pali';\nif ($panda == 'Lushui') {\n    echo 'Yey, panda time!';\n}\n```\n\
    \nWe’ll execute the code once more.\n\n# Example 07: Output.\n\n(nothing)\n\n\
    There we go. This time, $panda does not equal ‘Lushui’. This means that the condition\
    \ will equate to false, and the code within the curly braces (actually, we call\
    \ this ‘block’) will not be executed.\n\nRight now, we’re controlling the value\
    \ of $panda, but what if $panda was set as the result of user input? If we set\
    \ $panda to whatever our user typed into our application. Perhaps it could be\
    \ data acquired from another part of a big application. This data would be able\
    \ to change the flow of our application, allowing sections of code to be executed\
    \ under certain conditions. This is when programming exciting.\n\nAny statement\
    \ within the condition will be evaluated. Go ahead and experiment statement for\
    \ a while before moving to the next section. It will be a very important part\
    \ of your new career in programming.\n\n# Else\n\nElse! Else?! Sorry. It just\
    \ sounded like one of those dramatic moments in a soap opera. You, know. When\
    \ someone threatens someone else with a ‘or else!’. Actually, else is just another\
    \ extension to the if statement. Shall we take a closer look?"
  - "[PAGE 69]\n\n# Example 08: If with an else.\n\n```\n<?php\n$panda = 'Pali';\n\
    if ($panda == 'Lushui') {\n    echo 'Yey, Lushui time!';\n} else {\n    echo 'Oh\
    \ hey there Pali!';\n}\n```\n\nThe else portion of our statement functions in\
    \ a similar fashion to the if portion. The only difference is that else doesn't\
    \ require a condition. The code within the else curly brackets will be executed\
    \ only if the condition within the if statement equates to false.\n\nThis means\
    \ that our statement can now react to both circumstances, whether the condition\
    \ evaluates to true or false. This is a definite fork. Two different parts of\
    \ the application can execute depending upon a condition.\n\nWell that was simple,\
    \ wasn't it? Let's get to the final component of the if statement.\n\n# Elseif\n\
    \nWoah! That's of those words combined! Now things are getting really serious.\
    \ Right now, you know how this works by now. Let's get started with an example.\n\
    \n# Example 09: The elseif statement.\n\n```\n<?php\n$panda = 'Pali';\nif ($panda\
    \ == 'Lushui') {\n    echo 'Yey, Lushui time!';\n} elseif ($panda == 'Pali') {\n\
    \    echo 'Oh hey there Pali!';\n} elseif ($panda == 'Jasmina') {\n    echo 'Looking\
    \ pretty Jasmina!';\n}\n```"
  - "[PAGE 70]\n\n# Forks\n\nHey look! More paths! Using the elseif blocks we are\
    \ able to provide alternate conditions for our fork. PHP will work its way down\
    \ the list of conditions, and execute the code block for the first one that evaluates\
    \ to true.\n\nIn the above example, we can see that if we were to alter the $panda\
    \ variable, there are four possible outcomes to that snippet of code. Let's list\
    \ them for clarity.\n\n+   * $panda is Lushui - Yey, Lushui time!\n* $panda is\
    \ Pali - Oh hey there Pali!\n* $panda is Jasmina - Looking pretty Jasmina!\n*\
    \ $panda is something else. - (nothing)\n\nIf we want to, we can also use else\
    \ alongside elseif to provide a default execution path when none of the other\
    \ conditions match. Let's take a look at an example.\n\n# Example 10: The else\
    \ statement.\n\n```\n<?php\n$panda = _PANDA_;\nif ($panda == 'Lushui') {\n   \
    \ echo 'Yey, Lushui time!';\n} elseif ($panda == 'Pali') {\n    echo 'Oh hey there\
    \ Pali!';\n} elseif ($panda == 'Jasmina') {\n    echo 'Looking pretty Jasmina!';\n\
    } else {\n    echo 'Sorry, who are you?';\n}\n```\n\nExperiment with the different\
    \ combinations of if, elseif and else to see how different outcomes of conditions\
    \ effect the flow of execution within your code. We're starting to become real\
    \ developers now, can you feel it?\n\n# Switch\n\nIf you find yourself using many\
    \ elseif statements to compare the same variables, you're probably going to use\
    \ a switch statement instead. It's a much cleaner and more efficient way of reacting\
    \ to different values in different ways.\n\nLet's take a look at an example switch\
    \ statement. We'll start small. First, let's take a look at the switch block."
  - "[PAGE 71]\n\n# Example 11: An empty switch block.\n\n```\n<?php\nwitch ($panda)\
    \ {\n\n}\n```\n\nThe switch statement takes a similar shape to that of the if\
    \ statement. Except this time, it's not a condition that is contained within the\
    \ curly braces. Instead it's the value that we wish to compare.\nLet's add some\
    \ case statements to the example so we can see how it works.\n\n# Example 12:\
    \ A switch block with a case.\n\n```\n<?php\n$panda = _SOMETHING;\nwitch ($panda)\
    \ {\n    case 'Lushui':\n        echo 'Yey, Lushui time!';\n}\n```\n\nWithin the\
    \ curly braces of our switch statement, we provide our case's. Case's let us compare\
    \ the value of the variable provided to the switch, and execute lines of code\
    \ if there is a match.\nIn the above example, we create a line beginning with\
    \ the word case. Next, we provide the comparison value followed by a : colon.\
    \ On the next line(s) we provide the code that we wish to be executed if there\
    \ is a match.\n\nWe can add as many case statements as we like. Here's another\
    \ example with multiple comparisons."
