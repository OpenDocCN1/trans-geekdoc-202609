    # #7. Strings


    We''ve encountered strings already, haven''t we? Well, I think they are a really
    interesting data type. That''s why I''ve chosen to dedicate a short chapter to
    them.


    # ## Interpolation


    Strings are the name that programmers have given to sequences of text held within
    the variables of our applications. Let''s assign a string to a variable for some
    catch-up.


    Example 01: Different quotes for different folks.


    ```

    <?php

    // String with single quotes.

    $panda = ''Pandas rule!'';

    // String with double quotes.

    $panda = "Pandas rule!";

    // Output.

    echo $panda;

    ```


    Okay, so I know the second line is pointless. I left it in there to remind you
    of the two different types of quotes that can be used to enclose string values.


    Right then, if we have two options, what''s the difference? It can''t just be
    for clarity, right? I mean, both look equally clean to me.


    Well, there is actually a difference. String values that are enclosed in double
    quotes are a little smarter. They have a trick that their single-quoted brethren
    just aren''t able to do. It''s called String interpolation.


    That''s a horrible term, isn''t it? It''s very confusing. It simply means that
    we can embed values within a string. Let''s take a look at this in action.'
