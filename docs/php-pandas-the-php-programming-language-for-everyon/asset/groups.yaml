    # Example 05: Multi-line comment with asterisks for alignment.


    As you can see, all of the star * characters of the comment are in alignment,
    and the comment looks much, much neater.


    These types of comments can be really useful using a process known as ''commenting
    out'' to aid the debugging process. Here''s an example.


    # Example 06: Some code.


    ```

    <?php

    // Set a string.

    $pandas = ''awesome!'';


    // Set a string.

    $pandas = ''fantastic!'';


    // Output.

    echo ''Pandas are '' . $pandas;

    ```


    We know that this piece of code will output Pandas are fantastic!. Let''s imagine
    that we want to try and see how it looks if pandas are awesome, instead. We might
    want to go back to them being fantastic for later, so this test is only temporary.
    Let''s comment out the middle bit.'
  - "[PAGE 64]\n\n# Example 07: Commented code.\n\n```\n<?php\n// Set a string.\n\
    $pandas = 'awesome!';\n\n/*\n// Set a string.\n$pandas = 'fantastic!';\n*/\n\n\
    // Output.\necho 'Pandas' . $pandas;\n```\n\nWe've used the multi-line comment\
    \ comment symbols to skip the middle statement so that PHP ignores the code and\
    \ pandas are awesome again. If we'd like them to be fantastic once, we simply\
    \ remove the symbols.\n\nThere's one final form of comment that we need to take\
    \ a look at. It's a little advanced, but I think you can take it! You're a smart,\
    \ beautiful AND / OR handsome reader after all.\n\n# Doc Blocks\n\nDoc blocks\
    \ are a special type of comment. Other programs known as documentation generators\
    \ can read these special types of comments, and use the information provided within\
    \ to generate documentation for your project.\n\nDoc blocks look similar to multi-line\
    \ comments, except that the opening tag uses two stars instead of one. Here's\
    \ an example.\n\n# Example 08: Doc block.\n\n```\n<?php\n/**\n * Description of\
    \ pandas.\n */\n$pandas = 'awesome!';\n```\n\nWhen our automated documentation\
    \ system runs, our $pandas variable will have a description of what it does. If\
