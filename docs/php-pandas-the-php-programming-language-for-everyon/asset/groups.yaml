    \n```php\n<?php\nclass Panda implements PandaInterface\n{\n    public function\
    \ eat($food)\n    {\n        echo \"Eating $food...\";\n    }\n\n    public function\
    \ poop()\n    {\n        echo \"Pooping...\";\n    }\n\n    public function sleep($time)\n\
    \    {\n        echo \"Sleeping for $time hours...\";\n    }\n}\n```\n\nBy implementing\
    \ the interface, the Panda class is no longer abstract. We can now instantiate\
    \ it.\n\nExample 04: Instantiate a panda instance.\n\n```php\n$panda = new Panda();\n\
    $panda->eat('bamboo');\n$panda->poop();\n$panda->sleep(8);\n```\n\nOutput:\nEating\
    \ bamboo...\nPooping...\nSleeping for 8 hours...\n\n## Polymorphism\n\nPolymorphism\
    \ is a horrible word, but a wonderful technique. All of the explanations I found\
    \ online were overcomplicated and scary. Instead, let's lead with an example.\
    \ We'll make use of our PandaInterface. It enforces the implementation of three\
    \ methods.\n\nExample 05: Polymorphism in action.\n\n```php\n<?php\nclass Panda\
    \ implements PandaInterface\n{\n    public function eat($food)\n    {\n      \
    \  echo \"Eating $food...\";\n    }\n\n    public function poop()\n    {\n   \
    \     echo \"Pooping...\";\n    }\n\n    public function sleep($time)\n    {\n\
    \        echo \"Sleeping for $time hours...\";\n    }\n}\n\nclass Bear implements\
    \ PandaInterface\n{\n    public function eat($food)\n    {\n        echo \"Eating\
    \ $food...\";\n    }\n\n    public function poop()\n    {\n        echo \"Pooping...\"\
    ;\n    }\n\n    public function sleep($time)\n    {\n        echo \"Sleeping for\
    \ $time hours...\";\n    }\n}\n\n$animals = [\n    new Panda(),\n    new Bear()\n\
    ];\n\nforeach ($animals as $animal) {\n    $animal->eat('food');\n    $animal->poop();\n\
    \    $animal->sleep(8);\n}\n```\n\nThe beauty of polymorphism is that we can treat\
    \ different objects as the same type, as long as they implement the same interface.\
    \ This makes our code much more flexible and extendable.\n"
  mdcn: "\n\n## 20. 抽象 (Abstracts)\n\n在之前的章节中，我们学习了如何使用继承在类之间共享公共属性和方法，有效地创建一个模板。在本章中，我们将基于之前的知识继续学习。感到兴奋吗？让我们直接开始吧。\n\
    \n## 抽象类 (Abstract Classes)\n\n对于某些类来说，它们的唯一目的是提供公共的属性和方法。它们为此而生。当它们在晚上睡觉时，梦的都是这个。\n\
    \n它们永远无法被实例化，因为它们本身没有意义。考虑以下类，为了清晰起见，我将它们留空了。\n\n示例 01：类继承。\n\n虽然 `Animal` 类可能为\
    \ `Panda`（熊猫）、`Owl`（猫头鹰）和 `Giraffe`（长颈鹿）类提供许多共享特征，但直接实例化是没有意义的。我们的 `Animal` 类是抽象类的典型例子。让我们把它变成抽象类吧。\n\
    \n## 抽象 (Abstracts)\n\n### 示例 02：抽象类 Animal。\n\n```php\n<?php\nabstract class\
    \ Animal {\n    /**\n     * 动物是否很棒（都是如此）。\n     * @var boolean\n     */\n    private\
    \ $awesome = true;\n\n    /**\n     * 获取 awesome 属性。\n     * @return boolean\n\
    \     */\n    public function isAwesome() {\n        return $this->awesome;\n\
    \    }\n}\n```\n\n在上面的示例中，我们仅通过在类定义开头使用 `abstract` 关键字将类声明为抽象类。其他所有内容应该看起来都很熟悉。如果我们扩展这个类，我们所有的动物都会继承\
    \ `isAwesome()` 方法。\n\n让我们尝试直接实例化 `Animal` 类。\n\n### 示例 03：创建一个新的 Animal 实例。\n\
    \n```php\n$animal = new Animal();\n```\n\n当我们执行代码时会发生什么？\n\n### 示例 04：输出。\n\n\
    Fatal error: Cannot instantiate abstract class Animal in <file> on line <line>.\n\
    \n现在我们的类被标记为抽象类，它不再可以被实例化。这是符合预期的，因为该类只有一个目的，就是为其他类提供功能。\n\n## 抽象方法 (Abstract\
    \ Methods)\n\n抽象方法用在抽象类内部。再次，使用 `abstract` 关键字来定义抽象方法。让我们从一个示例开始。\n\n示例 05：一个抽象方法。\n\
    \n```php\n<?php\nabstract class Animal\n{\n    abstract public function makeNoise();\n\
    }\n```\n\n我们在作用域之前使用 `abstract` 关键字定义了一个名为 `makeNoise()` 的新方法。你会注意到 `makeNoise()`\
    \ 方法没有方法体，而是直接以分号结束。\n\n多么毫无意义的方法！\n\n你说得对。就其本身而言，它确实毫无意义。事实上，抽象方法甚至无法被调用。那么为什么要费心呢？嗯，抽象方法与所有扩展它的类形成了一种类型的“合同”。它在告诉\
    \ PHP：“任何扩展此类的类**必须**定义一个 `makeNoise()` 方法。”让我们通过添加另一个类来演示这一点。\n\n示例 06：扩展 Animal\
    \ 类。\n\n```php\n<?php\nabstract class Animal\n{\n    abstract public function\
    \ makeNoise();\n}\nclass Dog extends Animal\n{\n}\n```\n\n我们在 `Dog` 类中扩展了基类 `Animal`。让我们尝试实例化一个新的\
    \ `Dog` ，好吗？\n\n### 示例 07：创建一个新的 dog 实例。\n\n```php\n$dog = new Dog;\n```\n\n现在我们只需执行代码然后……哦不不。\n\
    \n### 示例 08：输出。\n\n```\nPHP Fatal error: Class Dog contains 1 abstract method\
    \ and must therefore be declared abstract or implement the remaining methods (Animal::makeNoise)\
    \ in <file> on line <line>.\n```\n\n幸运的是，我一直觉得 PHP 错误很容易理解。PHP 正在告诉我们我们的 `Dog`\
    \ 类包含一个来自基类 `Animal` 的抽象方法 `Animal::makeNoise`。\n\nPHP 给了两个选项。首先，我们可以让 `Dog` 类也变成抽象类，这意味着它同样无法被实例化。这不是我们想要的，因为该类只有一个目的，即为其他类提供功能。第二个选项是实现该方法。让我们通过这种方式来完善。\n\
    \n示例 09：实现 makeNoise 方法。\n\n```php\n<?php\nclass Dog extends Animal\n{\n    public\
    \ function makeNoise()\n    {\n        echo \"Woof!\";\n    }\n}\n```\n\n通过实现方法，该类不再是抽象的。我们现在可以实例化了。\n\
    \n示例 10：实例化一个 dog。\n\n```php\n$dog = new Dog();\n```\n\n输出：\nWoof!\n\n## 21. 接口\
    \ (Interfaces)\n\n在之前的章节中，我们学习了如何使用继承在类之间共享公共属性和方法，有效地创建一个模板。\n\n示例 01：抽象类。\n\n\
    ```php\n<?php\nabstract class Animal\n{\n    echo 'I am!';\n\n    abstract function\
    \ sleep();\n}\n```\n\n接口与抽象类非常相似，但它们不能包含逻辑。它们纯粹是为了定义类必须做什么。\n\n示例 02：接口。\n\n```php\n\
    <?php\ninterface PandaInterface\n{\n    /**\n     * Eat food.\n     */\n    public\
    \ function eat($food);\n\n    /**\n     * Poop!\n     */\n    public function\
    \ poop();\n\n    /**\n     * Sleep time!\n     */\n    public function sleep($time);\n\
    }\n```\n\n我们使用 `interface` 关键字定义接口。像抽象类一样，它们不能被实例化。虽然不是强制的，但在名称后添加 `Interface`\
    \ 后缀是一个良好的习惯。\n\n示例 03：实现接口。\n\n```php\n<?php\nclass Panda implements PandaInterface\n\
    {\n    public function eat($food)\n    {\n        echo \"Eating $food...\";\n\
    \    }\n\n    public function poop()\n    {\n        echo \"Pooping...\";\n  \
    \  }\n\n    public function sleep($time)\n    {\n        echo \"Sleeping for $time\
    \ hours...\";\n    }\n}\n```\n\n通过实现接口，`Panda` 类不再是抽象的。我们现在可以实例化它。\n\n示例 04：实例化一个\
    \ panda 实例。\n\n```php\n$panda = new Panda();\n$panda->eat('bamboo');\n$panda->poop();\n\
    $panda->sleep(8);\n```\n\n输出：\nEating bamboo...\nPooping...\nSleeping for 8 hours...\n\
    \n## 多态 (Polymorphism)\n\n多态是一个糟糕的词，但是一种极佳的技术。我在网上找到的所有解释都复杂且令人恐惧。相反，让我们从一个示例开始。我们将利用我们的\
    \ `PandaInterface`。它强制实现三个方法。\n\n示例 05：实际中的多态。\n\n```php\n<?php\nclass Panda implements\
    \ PandaInterface\n{\n    public function eat($food)\n    {\n        echo \"Eating\
    \ $food...\";\n    }\n\n    public function poop()\n    {\n        echo \"Pooping...\"\
    ;\n    }\n\n    public function sleep($time)\n    {\n        echo \"Sleeping for\
    \ $time hours...\";\n    }\n}\n\nclass Bear implements PandaInterface\n{\n   \
    \ public function eat($food)\n    {\n        echo \"Eating $food...\";\n    }\n\
    \n    public function poop()\n    {\n        echo \"Pooping...\";\n    }\n\n \
    \   public function sleep($time)\n    {\n        echo \"Sleeping for $time hours...\"\
    ;\n    }\n}\n\n$animals = [\n    new Panda(),\n    new Bear()\n];\n\nforeach ($animals\
    \ as $animal) {\n    $animal->eat('food');\n    $animal->poop();\n    $animal->sleep(8);\n\
    }\n```\n\n多态的优之处在于，只要它们实现了相同的接口，我们就可以将不同的对象视为相同的类型。这使得我们的代码更加灵活且易于扩展。\n\n"
