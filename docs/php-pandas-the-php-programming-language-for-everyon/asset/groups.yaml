    name has been replaced with the value of the variable.


    Woah! That''s super useful. Isn''t it?


    I want to offer you a little advice. It''s best to wrap interpolated values within
    { curly braces }. It makes the interpolation much cleaner, and you''ll find it
    will work better when you start using arrays.


    Here''s an example.


    Example 04: Neater string interpolation.


    ```php

    <?php

    // Set a string.

    $value = ''pandas'';

    // Insert value.

    $result = "We love {$value}!";

    // Output.

    var_dump($result);

    ```


    Much cleaner, isn''t it? Stick with the curly braces. Trust me, you will grow
    to love them.


    ## Concatenation


    Concatenation is the process of joining two strings end to end. Like creating
    a bead necklace, or the human centipede... oh my. Let''s take a look at an example
    of this process in action.


    Example 05: String concatenation.


    ```php

    <?php

    // First value.

    $first = ''Pandas are'';

    // Second value.

    $second = ''awesome!'';

    // Concatenate.

    var_dump($first . $second);

    ```


    We create two string values, and then we output the result of concatenation. In
    PHP we use the period . character to perform concatenation. Let''s take a look
    at the result, shall we?


    Example 06: Output.


    - Pandas are awesome!


    Great! Our strings have been stuck together. We can concatenate as many values
    as we like. Here''s an example.


    Example 07: More values.


    ```php

    <?php

    // First value.

    $first = ''Pandas'';

    // Second value.

    $second = ''are'';

    // Third value.

    $third = ''completely'';

    // Fourth value.

    $fourth = ''awesome!'';

    // Concatenate.

    var_dump($first . $second . $third . $fourth);

    ```


    We can also concatenate different types of variables; PHP will simply treat them
    as strings. To prove this, let''s concatenate a string and a float value.


    Example 08: Concatenating different types.


    ```php

    <?php

    // First value.

    $first = ''Value of '';

    // Second value.

    $second = 27.325;

    // Concatenate.

    var_dump($first . $second);

    ```


    Example 09: Output.


    - Value of 27.325


