  - '[PAGE 27]


    # Basic Arithmetic


    +   * Multiplication

    / Division

    % Modulus

    + Addition

    - Subtraction


    The operator with the highest priority can be found at the top of the table. This
    means when PHP examines 4 + 3 * 2 / 1 it will first calculate 3 * 2 = 6, then
    / 1 = 6 and finally 4 + 6 to give us the answer 10.


    When I''m writing mathematical lines of code, I like to use brackets to avoid
    any confusion. I also find that it helps to clarify the intent of the line, causing
    it to be more readable.


    # Procedure


    PHP code is parsed procedurally. This means that it is read and executed on a
    statement by statement. While it''s possible to put more than one statement on
    a line, this is uncommon amongst PHP developers. This means we can also approach
