    \ `->` 运算符，最后是属性。最后，我们添加了 PHP 换行符以便清晰。\n\n### 示例 19：执行 summary 方法。\n\n```php\n\
    <?php\n// 创建一个新的书籍实例。\n$book = new Book();\n\n// 设置类属性。\n$book->title = 'Reaper\
