    # Example 02: String interpolation.


    ```

    <?php

    // Set a string.

    $value = ''pandas'';


    // Single quotes.

    $first = ''We love $value!'';


    // Double quotes.

    $second = "We love $value";


    // Output.

    var_dump($first);

    var_dump($second);

    ```


    We''ll try inserting a variable by name into both types of strings. Let''s take
    a look at the result of dumping out both types of strings.


    # Example 03: Output.


    ```

    string(15) "We love $value!"

    string(15) "We love pandas!"

    ```


    As you can see, with single quotes the name of the variable is presented as if
    it were part of the string. However, within the double quoted string, our variable
    name has been replaced with the value of the variable.

    Woah! That''s super useful. Isn''t it?

    I want to offer you a little advice. It''s best to wrap interpolated values within
    { curly braces }. It makes the interpolation much cleaner, and you''ll find it
    will work better when you start using arrays.


    Here''s an example.'
