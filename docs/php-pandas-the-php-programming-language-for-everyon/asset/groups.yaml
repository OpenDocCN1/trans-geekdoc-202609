    # 1. Introduction


    Well hello there! Aren''t you the most handsome AND/OR beautiful reader on the
    planet! Well done you for buying PHP Pandas, and for taking the first step towards
    your career as a world-famous web developer.


    Who am I? Well that''s a simple question! My name''s Dale, and I''ll be your author
    for this adventure. I''ve been writing books for beginners for a few years now,
    and have taken many other charming readers like yourself on adventures to learning
    new skills. We''ll make new discoveries together, all along the journey, assured
    that I''ll be right by your side.


    Why do you write like a crazy person?


    Excuse me? Oh this.. Well see, this is the only way that I know how to write.
    If you''re looking for a technical book-f-ull of science teacher stern-ness(Is
    that a word? I hope that''s a word.) I''m afraid you''ve come to the wrong place.
    I write my books for people. I like to think that we''re buddies, sitting in the
    pub, talking about PHP over a pint of Special Bre... Fosters.


    The truth is, the beginners I''ve written for to like my writing style. They''re
    not looking to gain a maths degree from this book, instead they''re looking to
    learn a thing or two about PHP, and that, I can promise you!


    Oh well, also notice that we''re talking right now. You don''t get that from other
    authors do you? You see, I have this magic power that will make you talk to me
    and ask your questions.


    Wait, how did you do tha...


    That would be trade secret. Sorry, we can''t share that just yet, but don''t you
    feel glad that you get to be a part of this adventure, and not just an observer?


    I guess so... Sure''ll give it a go.


    Excellent.


    Well now''s about the time where any other book would be telling you PHP, it''s
    whole history, its application, its author and about million other things. Well
    we''ve already established that I''m not the most traditional author, and I''m
    not fond'
  - '[PAGE 12]


    # Introduction


    of chapters. You''ve bought this book to learn about PHP, so you''ve already built
    up a little curiosity about the language. I think this is all you''re going to
    need.


    PHP is a programming language that powers most of the sites out there on the big,
    wide or interwebs. It was originally written by a guy called Rasmus Lerdorf, who
    can often be seen smiling in pretty much any image you find on Google. Now, Rasmus
    is a great guy, and in my own way I thank him and every day for this language
    that has given me a truce, and I think that''s all you need to know about. Other
    PHP books would probably be telling you your favourite carol about, but instead,
    how about we actually jump in start learning?


    This book is for absolute beginners. This means if you''ve never tried programming
    in your life then you''re in my friend! If you''ve already tried programming,
    then you''re a PHP expert, then now''s a time for a refresh of your skills, and
    maybe you''ll pick up a few tips and tricks to bring back


    I''ve been using my girlfriend (no experience), my non-technical colleagues, and
    random people on the street, forcing my book upon them as guinea pigs to see if
    it goes down well with folks that have no prior knowledge of PHP. My little guinea
    pigs did exceedingly well, so now it''s your turn, squeak squeak!


    My goal for this book, is to become the most fun, factual, and fantastic PHP book
    that''s on the market. I want it to be the book that gets recommended when someone
    is about to become a PHP developer. I''ve worked really hard to make it accessible
    to everyone, so if you enjoy this adventure then tweet about it, blog about it,
    buy copies for friends and family, or just print it out and slap people in the
    face with it as you pass them on the street.


    This book is a syntax book for PHP. It''s not going to teach you how to make websites
    (I''m working on the title in the series for this). Instead, it''s the first step
    that will build your foundation knowledge of the language so that when you come
    to build your first website, you''re gonna be %@ f hot, baby!


    If you read the book and feel like something is missing, that certain chapter
    is confusing, or there''s anything else bothering you, then please send me an
    email to me@day.com to let me know! I''m incredibly responsive (thanks to all
    my media queries...haha... programmer joke), and I want this book to be perfect
    for everyone.


    If you read the book and you didn''t find anything wrong, well send an email to
    tell me you enjoyed it! I''d love to hear from you.


    Right then, let''s not waste any more time. You''ve got some skills to learn!
    Flip the page, imagine the Jurassic Park theme when you open the gates, and prepare
    to enter the world of development!'
  - '[PAGE 13]


    # # 2. Installation


    Before we begin working with PHP, we must first install it. You see, PHP is an
    application like any other. It needs to be installed on our system before it can
    process PHP code.


    The method of installation varies greatly depending on the operating system that
    we are using. For that reason, Ive provided three different guides for installing
    PHP. The first section will explain how to install PHP on a Linux distribution,
    namely Ubuntu due to popularity. The second section will explain how to install
    PHP on an Apple Mac OSX system. Finally, the third section will explain how to
    install PHP on the Windows operating system.


    We''ll only be installing the console version of PHP. We won''t be setting up
    a web server just. We''ll get to that in a later time. The console version of
    PHP is all we need to get with our learning process.


    > Remember, you only need to read the appropriate section for your computer. Once
    you have PHP installed, go ahead and skip to the next chapter of the book.


    # # Linux


    The best way to install PHP on a unix-based Linux distribution is to use a package
    manager. The package manager depends greatly upon the distribution of Linux that
    you have chosen. I''ve decided to provide instructions for installing PHP on Ubuntu,
    one of the more popular distributions of Linux.


    Ubuntu uses the apt manager to install its packages. To install the console version
    of PHP we need to install the php5-cli package. Let''s do this now. First open
    a new terminal. You''ll need to type the following instruction.


    ```

    $ sudo apt-get install php5-cli

    ```


    You don''t need to type the dollar sign, that''s the terminal prompt to show you
    we''re typing it into the console. Once you hit enter, apt will retrieve the PHP
    application package, and install it for you.


    That''s it! You''re done. well you should be. Let''s check, shall we? Simply type...'
  - '[PAGE 14]


    # Installation


    $ php -v


    This command is used to show the current version of PHP installed. You should
    see something similar to the following.


    +   PHP 5.5.13 (cli) (built: Jun 5 2014 19:13:23)

    Copyright (c) 1997-2014 The PHP Group

    Zend Engine v2.5.0, Copyright (c) 1998-2014 Zend Technologies


    Yours won''t be exactly the same as ours, we''re all, aren''t we? In the example
    above, the PHP version is 5.5.13. Hopefully your PHP version number should be
    5.4.0 or greater.


    If your version isn''t right you''ll have to consult the documentation for your
    Linux distribution to find out how to install the appropriate version.


    Go ahead and skip to the next chapter, you''re done!


    # Mac OSX


    On the Macintosh operating system, PHP comes pre-installed. Go ahead, open up
    the Terminal application and type the following to find the version of PHP you''re
    using.


    $ php -v


    Don''t you the dollar sign, that''s the terminal prompt! You should see something
    similar to the following, but not exactly the same.


    +   PHP 5.4.24 (cli) (built: Jan 19 2014 21:32:55)

    Copyright (c) 1997-2013 The PHP Group

    Zend Engine v2.4.0, Copyright (c) 1998-2013 Zend Technologies


    The PHP version in the example above is 5.4.24. As long as your version of PHP
    is greater than 5.4 then you''re fine, and move to the next chapter.


    If isn''t that okay. We can use a third party package manager for OSX to install
    a newer version of PHP.


    We''re going to use a package manager called ''Homebrew'' or just ''Brew'' for
    short. To install Homebrew, follow the instructions found on the following site:'
