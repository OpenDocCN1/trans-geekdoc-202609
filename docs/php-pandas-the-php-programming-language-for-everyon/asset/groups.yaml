    \ optional, but let's take a. If the code is terminated within the catch then\
    \ it will never reach the finally. Let's take a look at the.\n\nExample 21: The\
    \ finally block.\n\n```php\n<?php\ntry {\n    // Code that might trigger the exception.\n\
    } catch (Exception $exception) {\n    // Code to handle the exception.\n}\nfinally\
    \ {\n    // Code to run after the try and catch.\n}\n```\n\nNow we can examine\
    \ this construct as a three stage process.\n\n1. try to execute a piece of code.\n\
    2. Attempt to catch any problems that might arise.\n3. finally execute some additional\
    \ code.\n\nLet's look at a practical example for this construct.\n"
  mdcn: "\n你会注意到，除了扩展 `Exception` 类之外，我们还定义了一个属性。你还记得 `protected`（保护级）是如何工作的吗？如果不记得，现在是检查范围（scope）章节进行复习的绝佳时机。\n\
    \n你会发现，`Exception` 类有一个名为 `$message` 的属性。这通常会被设置为我们在构造函数中传递给它的参数。由于该属性是 `protected`\
    \ 的，我们是否可以在我们的对象类中重写它的值？这意味着我们在定义扩展时，不再需要传递消息了。\n\n让我们抛出我们的 `PandaException` 吧。\n\
    \n## 示例 09: 抛出 PandaException。\n\n```php\n<?php\n/**\n * 给熊猫喂一些食物。\n * @param\
    \ string $food\n * @return void\n */\nfunction feedPanda($food) {\n    if ($food\
    \ === 'chocolate') {\n        throw new PandaException();\n    }\n\necho \"The\
    \ panda eats {$food}\";\n}\n```\n\n```我们在没有传递任何参数的情况下抛出了 `PandaException`。让我们看看给函数传递一些巧克力时会发生什么。\n\
    \n## 示例 10: 输出。\n\n```\nPHP error: Uncaught exception 'PandaException' with message\
    \ 'NO CHOCOLATE\\nFOR THE PANDA!' in <file>:<line>\n```\n\n太棒了！我们的异常现在更具描述性，而且仍然带有我们想要的消息。让我们再进一步，将我们的单个异常扩展为两个。\n\
    \n## 示例 11: 两个异常。\n\n```php\n<?php\nclass PandaChocolateException extends Exception\n\
    {\n    protected $message = 'NO CHOCOLATE FOR THE PANDA!';\n}\nclass PandaChilliException\
    \ extends Exception\n{\n    protected $message = 'NO CHILLI FOR THE PANDA. OUCH!';\n\
    }\n```\n\n现在我们有两个异常：`PandaChocolateException` 和 `PandaChilliException`，分别对应熊猫脆弱的消化系统难以处理的两种食物。\n\
    \n我们可以抛出的异常数量上没有限制，所以让我们继续修改我们的代码吧。\n\n## 示例 12: 抛出两个异常。\n\n```php\n<?php\n/**\n\
    \ * 给熊猫喂一些食物。\n * @param string $food\n * @return void\n */\nfunction feedPanda($food)\
    \ {\n    // 根据食物进行分支。\n    switch ($food) {\n        // 处理巧克力。\n        case 'chocolate':\n\
    \            throw new PandaChocolateException;\n        // 处理辣椒。\n        case\
    \ 'chilli':\n            throw new PandaChilliException;\n    }\n}\n```\n\n##\
    \ 异常\n\n```\n// 处理其他食物。\ndefault:\n    echo \"The panda eats the {$food}\";\n\
    }\n```\n\n在这里，我们使用了 `switch` 来处理不同类型的食物。为什么要用 `switch` 呢？这是一个确保你学会了它们如何工作的绝佳理由。\n\
    \n在 `switch` 部分，我们发现应该使用 `break` 关键字来停止应用程序的执行。等一下，我们在上面的 `switch` 语句中没有使用 `break`\
    \ 关键字。你认为这是为什么呢？\n\n嗯，异常也会停止执行线程，所以我们不需要 `break` 语句了。让我们尝试触发 `PandaChilliException`\
    \ 吧，好吗？\n\n示例 13: 输出。\n\n+ 1 Fatal error: Uncaught exception 'PandaChilliException'\
    \ with message 'NO CHILLI FOR THE PANDA. OUCH!' in <file> on line <line>\n\n太棒了！看起来我们已经是抛出异常的大师了。问题是，这比仅仅使用\
    \ PHP 函数如 `exit()` 或 `die()` 来停止执行要好在哪里呢？我们能获得什么？嗯，我们还没有完全掌握！\n\n> `exit()` 或\
    \ `die()` 函数可以终止 PHP 应用程序。如果你传递一个字符串作为参数，它将在退出前显示该字符串。非常有用！\n\n## Try & Catch（尝试与捕获）\n\
    \n现在我们学会了如何抛出异常，是时候学习如何捕获它们了。戴上你的棒球手套。\n\n如果我们的代码抛出了异常，我们可以使用 `try` 和 `catch`\
    \ 来妥善处理它们。这样，我们的代码就可以恢复，并捕捉它真正的终点。\n\n让我们考虑上一个部分的代码片段。\n\n## 示例 14: 再次抛出异常。\n\n\
