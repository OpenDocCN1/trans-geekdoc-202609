    ## 示例 02：创建一个新的 Eddard。


    ```php

    <?php

    // app/routes.php

    $eddard = new Eddard();

    ```


    Dayle，我懂一些 PHP...


    好吧，好吧，抱歉。基本上，我们可以把这个类看作是位于“全局”（global）命名空间中的。我不知道这个术词是否准确，但对我来说听起来很合适。它本质上意味着这个类在没有命名空间的情况下存在。它只是一个普通的类。


    ## 简单命名空间 (Simple Namespacing)


    让我们在原始的全局 Eddard 旁边创建另一个类。


    ## 示例 03：Stark 命名空间。


    ```php

    <?php

    namespace Stark;

    // app/models/another.php

    class Eddard

    {

    }

    ```


    在这里我们有另一个 Eddard 类，有一个微小的变化：添加了命名空间指令。`namespace Stark` 这一行告诉 PHP，我们所做的一切都是相对于
    Stark 命名空间的。这也意味着在此文件中创建的任何类都存在于 ''Stark'' 命名空间内。


    现在，让我们再次尝试使用 ''Stark'' 类。


    ## 示例 04：再次创建 Eddard。


    ```php

    <?php

    // app/routes.php


    $eddard = new Eddard();

    ```


    我们再次得到了我们在上一节中创建的第一个类的实例，而不是 ''Stark'' 命名空间中的那个。让我们尝试在 ''Stark'' 命名空间内创建一个 ''Eddard''
    实例。


    ## 示例 05：创建一个 StarkEddard。


    ```php

    <?php

    // app/routes.php


    $eddard = new Stark\Eddard();

    ```


    我们可以在命名空间内实例化类，在前面加上命名空间的名字，并用反斜杠 `\` 将两者分隔。现在我们有一个 ''Stark'' 命名空间下的 ''Eddard''
    类实例。我们不是很神奇吗？

    你应该知道，命名空间可以根据需要具有任意级别的层次结构。例如：


    ## 示例 06：一个糟糕但合法的命名空间。


    `This\Namespace\And\Class\Combination\Is\Silly\But\Works`


    ## 相对性理论？ (The Theory of Relativity)


    记得我告诉过你 PHP 总是相对于当前命名空间做出反应吗？让我们来看看这个操作。


    ## 命名空间 (Namespaces)


    ## 示例 07：在 Stark 命名空间内创建 Eddard。


    ```php

    <?php

    namespace Stark;

    // app/routes.php

    $eddard = new Eddard();

    ```


    通过在实例化示例中添加命名空间指令，我们将 PHP 脚本的执行移动到了 ‘Stark’ 命名空间中。由于我们和放入 ‘Eddard’ 的在同一个命名空间内，这次我们收到了带命名空间的
    ‘Eddard’ 类。你看到这一切是如何相对的了吗？


    既然我们更改了命名空间，就产生了一个小问题。你能猜到是什么吗？我们如何实例化原始的 ‘Eddard’ 类？就是那个不在命名空间里的类。


    幸运的是，PHP 有一个技巧可以引用位于全局命名空间中的类，我们只需要在它们前面加上反斜杠（`\`）即可。


    ## 示例 08：创建一个全局 Eddard 实例。


    ```php

    <?php

    // app/routes.php

    $eddard = new \Eddard();

    ```


    有了开头的反斜杠（`\`），PHP 就知道我们引用的是全局命名空间中的 ‘Eddard’，并实例化了它。


    发挥一下你的想象力，就像 Barney 向你展示的那样。假设我们有另一个带命名空间的类叫做 Tully\Edmure。我们想在 ‘Stark’ 框架内部使用这个类。我们该怎么做呢？


    ## 示例 09：根命名空间前缀。


    ```php

    namespace Stark;

    // app/routes.php

    $edmure = new \Tully\Edmure();

    ```


    再次，我们需要前缀反斜杠来回到全局命名空间，然后再实例化 ‘Tully’ 命名空间中的类。

    每次都通过完整层次结构来引用其他命名空间中的类可能会很累。幸运的是，我们可以使用一个非常棒的小快捷方法。让我们看看它的效果。


    ## 示例 10：创建一个 Tully\Edmure 实例。


    ```php

    <?php

    namespace Stark;

    use Tully\Edmure;

    // app/routes.php

    $edmure = new Edmure();

    ```


    使用 `use` 语句，我们可以从另一个命名空间将一个类引入到当前命名空间。这将允许我们仅通过名称来实例化它。

    让我给你们展示另一个酷技巧。我们可以为导入的类起一些小 nickname，就像我们以前在 PHP 游乐场做的那样。我给你们。


    ## 命名空间 (Namespaces)


    ## 示例 11：命名空间别名 (Namespace aliasing)。


    ```php

    <?php

    namespace Stark;

    use Tully\Brynden as Blackfish;

    // app/routes.php

    $Brynden = new Blackfish();

    ```


    通过使用 ''as'' 关键字，我们为 ''Tully\Brynden'' 类取了 ''Blackfish'' 昵号。这将允许我们在当前命名空间中使用新的昵号来识别它。很酷的招吧？如果你需要在同一个命名空间中使用两个命名相似的类，这也非常非常有用。例如：


    ## 示例 12：同名类。


    ```php

    <?php

    namespace Targaryen;

    use Dothraki\Daenerys as Khaleesi;

    // app/routes.php

    class Daenerys {

    }

    // Targaryen

    $daenerys = new Daenerys();

    // Dothraki\Daenerys

    $khaleesi = new Khaleesi();

    ```


    通过使用 ''as'' 关键字，我们为 ‘Tully\Brynden’ 类取了 ‘Blackfish’ 昵号。这将允许我们在当前命名空间中使用新的昵号来识别它。很酷的招吧？如果你需要在同一个命名空间中使用两个命名相似的类，这也非常非常有用。


