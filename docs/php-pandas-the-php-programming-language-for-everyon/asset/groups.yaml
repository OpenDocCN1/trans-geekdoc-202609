  - "[PAGE 138]\n\n# 19. Constants\n\nIn a previous chapter, we discovered variables,\
    \ and how they could be used to store a variety of different types of information.\
    \ You could re-assign a variable to a new value, and PHP wouldn't give you hoots\
    \ about it!\n\nSometimes, things aren't meant to change. Old people will always\
    \ prefer to wear beige. The government will continually attempt to throw your\
    \ money away. Red pandas will consistently become excitable in periods of cold\
    \ weather.\n\n# Defined Constants\n\nThere are values in your code that might\
    \ not want to change too. For example, let's use that wobobbly-wobbly fading technique\
    \ they use on TV shows to go back in time and take another look at the assignment\
    \ of the $pi variable.\n\nExample 01: A PI variable.\n\n```\n$pi = 3.14159265359;\n\
    ```\n\nThere is. Beautiful.\n\nDo you think that the value of PI is ever going\
    \ to change? I mean sure, it can always be calculated to additional decimal places\
    \ by clever white coat wearing boffins, but is it likely to change within your\
    \ program?\n\nI doubt it. In fact, if someone was to do this...\n\nExample 02:\
    \ Set PI to 5.\n\n```\n$pi = 5;\n```\n\n... then our circumference calculations\
    \ would be in big trouble. We'd have our middle school Math professor frowning\
    \ at us, and we don't want that. \n\nIt would be great if we could lock our $pi\
    \ variable to a value, so that it couldn't be changed at all. Well, as it turns\
    \ out, a variable isn't what we need at all. We need something called a constant.\n\
    \nConstants used outside of classes (I like to call this the Global scope.) are\
    \ defined using a special function. Let's take a look."
  - '[PAGE 139]


    # Constants


    # Example 03: Define a PI constant.


    ```

    define(''PI'', 3.14159265359);

    ```


    We use the define() function to set our PI constant to the correct value. As you
    can see, the constant name is the first parameter to the function, and its value
    is the second.


    > You''ll notice that the constant name is written in uppercase. This isn''t only
    true for the PI constant. A convention for programmers is to write constants in
    uppercase, and use underscores for spaces. THIS_IS_A_CONSTANT.


    Let''s try to use our constant. It''s very similar to a variable, only that it
    doesn''t begin with a $ sign. Let''s attempt to execute our constant.


    # Example 04: Use the PI constant.


    ```

    // Define our constant.

    define(''PI'', 3.14159265359);


    // Echo the value of PI.\echo PI;

    ```


    Executing our snippet of code yields the result:


    # Example 05: Output.


    3.14159265359


    Great! This is exactly what we''d get using a variable. Let''s now try to re-define
    the constant. For example:


    # Example 06: Attempt to re-define a constant.


    ```

    // Re-define our constant.

    define(''PI'', 42);

    ```


    What do you think will happen when we try to execute our code? Let''s give it
    a go.'
  - "[PAGE 140]\n\n# Example 07: Output.\n\nNotice: Constant PI already defined in\
    \ <file> on line <number>\n\nA notice! It's telling us that we've already defined\
    \ PI, and that we can't change its value. The notice won't break our code, but\
    \ it will protect us from accidentally changing the value of the constant. Our\
    \ circumference calculations are safe.\n\nThe naming limitations of constants\
    \ are identical to those of variables, and you can define as many constants as\
    \ you need. Constants are best described as 'immutable', and will not be changed.\n\
    \n# Class Constants\n\nThe constants defined in the previous section are considered\
    \ 'global', and are accessible by all parts of our application. Sometimes, we\
    \ only need constants that are to be used by our classes.\n\nFor example, let's\
    \ make a simple circle class.\n\n# Example 08: The circle class.\n\n```\n<?php\n\
    class Circle {\n    /**\n     * The value of PI.\n     * @var float\n     */\n\
    \    private $pi = 3.14159265359;\n\n    /**\n     * Calculate the circumference\
    \ of a circle from diameter.\n     * @param mixed diameter\n     * @return mixed\n\
    \     */\n    public function circumference($diameter) {\n        return $diameter\
    \ * $this->pi;\n    }\n}\n```"
  - "[PAGE 141]\n\n# Constants\n\nOur circle class has a private property $pi, which\
    \ contains the appropriate float value. It also has a public method called circumference(),\
    \ which takes a diameter of the circle as a parameter to calculate its circumference.\n\
    \nLet's test this class.\n\nExample 09: Using the Circle class.\n\n```\n$circle\
    \ = new Circle;\necho $circle->circumference(32);\n```\n\nExecuting the above\
    \ code snippet yields the value 100.53096491488\n\nExample 10: Alter the PI property.\n\
    \n```\n<?php\nclass Circle {\n    /**\n     * The value of PI.\n     * @var float\n\
    \     */\n    private $pi = 3.14159265359;\n\n    /**\n     * Calculate the circumference\
    \ of a circle from diameter.\n     * @param mixed $diameter\n     * @return mixed\n\
    \     */\n    public function circumference($diameter) {\n        $this->pi =\
    \ 48;\n        return $diameter * $this->pi;\n    }\n}\n```"
  - "[PAGE 142]\n\n# Constants 132\n\nThis time our value would be incorrect, due\
    \ to the re-assignment of the $pi class property. It may seem an unlikely change,\
    \ but within a large class with many functions, the risk of change increases dramatically.\n\
    \nWe like PI. Especially cherry pie. We don't want it to change. Let's make it\
    \ a class constant instead.\n\nWithin classes, constants can be defined using\
    \ the const keyword. Let's take a look at an example.\n\nExample 11: PI as a class\
    \ constant.\n\n```\n<?php\n\nclass Circle\n{\n    /**\n     * The value of PI.\n\
    \     */\n    const PI = 3.14159265359;\n\n    /**\n     * Calculate the circumference\
    \ of a circle from diameter\n     * @param mixed $diameter\n     * @return mixed\n\
    \     */\n    public function circumference($diameter)\n    {\n        return\
    \ $diameter * self::PI;\n    }\n}\n\n```\n\nWe've used the const keyword to define\
    \ our PI class constant, and have given it a value.\n\nExample 12: Defining a\
    \ class constant.\n\n```\nconst PI = 3.14159265359;\n```\n\nThe value of PI is\
    \ now immutable, and PHP will throw an error if you attempt to change it. You\
    \ can't use $this to access a class constant, and I'll explain why shortly. For\
    \ now, you'll need to trust me, and instead use the self keyword, followed by\
    \ the double :: operator, and finally the constant name. Like this:"
  - '[PAGE 143]


    # Example 13: Accessing a class constant.


    ```

    return $diameter * self::PI;

    ```


    Simple! Now our value for PI can be used, but will never change. What''s this
    self:: stuff all about?


    Well, you may have noticed that the constant we created did not include any scope
    (public/private/protected/static). Our constant cannot be changed, and because
    of its, value will be the same across all instances of our Circle class.


    For this reason, constants are not accessed in the same manner as class properties.
    In fact, you don''t need a class instance to access the constant. Confused? Take
    a look at the following piece of code, which makes use of our Circle class.


    # Example 14: Accessing a constant on the class definition.


    ```

    echo Circle::PI;

    ```


    > If we execute the snippet above, we''ll receive the correct value for PI. We
    don''t need a class instance. Using the double :: colon operator, we can access
    the PI constant directly on the class definition. This means that constants can
    be considered somewhat public, since their values can be accessed (but never modified!)
    from outside of a class instance.


    The double :: colon operator is actually known as the Scope Resolution Operator,
    or even the Paamayim Nekudotay. Both of these sound terrifying, so let''s stick
    with the double colon for now.


    It''s worth noting that we can access the constant in a similar fashion from a
    class instance. For example, the following code is entirely valid, and yields
    an identical result to the previous example.


    # Example 15: Access the constant on the instance.


    ```

    $circle = new Circle;

    echo $circle::PI;

    ```


    Within the class, self is used as a reference to the current class definition.
    On the following line...'
  - '[PAGE 144]


    # Example 16: The self reference.


    ```

    return $diameter * self::PI;

    ```


    ... we could have also accessed the PI constant using the class definition itself...


    # Example 17: Accessing through class definition.


    ```

    return $diameter * Circle::PI;

    ```


    ... and the code would execute as expected.

    However, if we later decide to rename the Circle class, we''d also have to replace
    all constant accessors within the class to match. For this reason, using self
    to address the current class definition is far more convenient.


    > When defining variables, always take a moment to think about their purpose,
    and whether their value is needed/likely to change. Use constants where appropriate
    to protect the functionality of your code.'
