    # Example 10: Create another dog.


    ```

    1 $dog = new Dog;

    ```


    What''s the point of defining the abstract method, if we''re just going to / write
    the full method in all of our classes?


    I thought you might ask this question. Let''s consider a scenario. We change our
    / Animal base class and remove the abstract method.


    # Example 11: Remove abstract method.


    ```

    1 <?php

    2

    3 abstract class Animal

    4 {

    5

    6 }

    ```


    We can still define makeNoise() on all of our animal classes. However, what if
    we / don''t implement it on one of them. When we attempt to call the makeNoise()
    method, / our code is going to break.


    Using the abstract method to build a contract with the classes that extend our
    / abstract class, means that we have built some trust. We can use the makeNoise()
    / method without checking that it first exists. We have confidence that all animals
    / will have this method.


    In the next chapter, we''ll take a look at a technique called polymorphism, and
    while / it sounds scary, I promise that you''ll find it quite useful.


    > Remember that abstract classes can contain both normal and abstract / methods.
    This is what makes them different from the interfaces that you''ll / discover
    in the next chapter.'
  - "[PAGE 150]\n\n# 21. Interfaces\n\nExample 01: An abstract class.\n\n```\n<?php\n\
    abstract class Animal\n{\n    public function huggle()\n    {\n        echo 'I\
    \ am hugged!';\n    }\n\n    abstract public function makeNoise();\n}\n```\n\n\
    Interfaces are very similar to abstract classes, except that they cannot contain\
    \ logic. They are purely to shape the classes that implement them. This means\
    \ that the huggle() method above, would not be possible within an interface.\n\
    Let's define a new interface.\n\nExample 02: An interface.\n\n```\n<?php\ninterface\
    \ PandaInterface\n{\n    /**\n     * Eat some food!\n     */\n    public function\
    \ eat($food);\n\n    /**\n     * Poop! (Normally after eating).\n     */\n}\n\
    ```"
  - "[PAGE 151]\n\n# Interfaces\n\n# 141\n\n```\npublic function poop();\n\n/**\n\
    \ * Sleepy time!\n */\npublic function sleep($time);\n}\n```\n\nWe define interfaces\
    \ using the interface keyword. As you can see, we don't use class at this time.\
    \ Like abstract classes, interfaces cannot be instantiated.\n\nWe've called our\
    \ interface PandaInterface, and while not required, it's considered good practice\
    \ to add the 'Interface' suffix to the name.\n\nOur PandaInterface defines a number\
    \ of methods that are common to pandas. All pandas eat, sleep and poop. They may\
    \ do so differently, but they will definitely take part in these activities.\n\
    \nThis means that any class which implements this interface must provide these\
    \ methods, and the logic for them. Let's take a look at how we can implement the\
    \ panda interface in our new class, the 'RedPanda'.\n\nExample 03: Implement an\
    \ interface.\n\n```\n<?php\nclass RedPanda implements PandaInterface\n{\n}\n```\n\
    \nInstead of the extends keyword that we might use to indicate inheritance, this\
    \ time we use the implements keyword to indicate that our class must implement\
    \ the methods within the interface.\n\nEarlier, we discovered that a PHP class\
    \ can only extend one class. This same is not true for interfaces. A PHP class\
    \ may implement as many interfaces as necessary. For example, the following is\
    \ perfectly legal."
  - '[PAGE 152]


    # Example 04: Implement multiple interfaces.


    ```

    <?php

    class RedPanda implements PandaInterface, FurryInterface, CuteInterface

    {

    }

    ```


    The class above, implements three different interfaces, and **must** implement
    the methods held within each of the interfaces.

    A class can even extend another class while implementing interfaces, for example:


    # Example 05: Extend and implement.


    ```

    class RedPanda extends Animal implements PandaInterface, FurryInterface, CuteInterface

    {\}

    ```


    In the above example, either RedPanda or its parent class Animal must implement
    the methods held within the interfaces. As long as all are present, with each
    method either of the classes, then the RedPanda class can be instantiated.


    It took me a while to understand interfaces, their ideal use case, but once I''d
    worked it out, I couldn''t stop using them! Simply put, interfaces create contracts
    so that you can trust that a class has the methods you want inside.


    # Polymorphism


    Polymorphism is a horrible word, but a wonderful technique. All of the explanations
    I found online were overcomplicated and scary. Instead, let''s lead with an example.
    We''ll make use of our PandaInterface. It enforces the implementation of three
    methods.'
  md: "\n## 20. Abstracts\n\nIn a previous chapter, we learned how we could use inheritance\
