    \n// 设置类属性。\n$book->title = 'Reaper Man';\n$book->author = 'Terry Pratchett';\n\
    $book->publisher = 'Victor Gollancz';\n\n// 输出书籍摘要。\n$book->summary();\n```\n\n\
    这是一大段代码，不是吗？让我们把它拆分一下。首先我们来看 `summary()` 方法。\n\n### 示例 18：检查当前实例的属性。\n\n```php\n\
    <?php\n// 声明一个方法。\nfunction summary() {\n    echo 'Title: ' . $this->title . PHP_EOL;\n\
