    我们得到了书籍的清晰表示。如你所见，通过 `$this` 属性正确地访问了属性。\n\n我们还可以使用 `$this` 来调用实例方法。让我们来看一个例子，好吗？\n\
    \n### 示例 21：从类方法调用类方法。\n\n```php\n1\n<?php\n\n// 定义 Example 类。\nclass Example\n\
    {\n    // 第一个函数。\n    function first()\n    {\n        return $this->second();\n\
