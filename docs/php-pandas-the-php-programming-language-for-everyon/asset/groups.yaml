    \ `=>` 符号分隔的临时键和值占位符。\n\n让我们看看每次循环迭代这两个变量的值。\n\n# 循环\n\n- 第一次迭代 ($position = 'first')\
    \ ($panda = 'Lushui')\n- 第二次迭代 ($position = 'second') ($panda = 'Pali')\n- 第三次迭代\
    \ ($position = 'third') ($panda = 'Jasmina')\n\n我们可以使用这些临时变量来完成我们的任何疯狂的小计划。\n\
    我们完全可以随心所欲。\n\n值得注意的是，数组元素的副本会被传递到 `foreach` 循环块中。这意味着在循环内部对变量的任何更改在循环完成后将不会反映。\n\
    \n> 如果你想在 `foreach` 循环期间更改元素的值，只需使用 `key => value` 格式，并访问 `key => value` \n\n\
    这是我最常用的循环。我每天大约使用它 23,543 次。大概这么多！这是因为我喜欢处理数组。\n\n在之前的章节中，我们发现了如何为数组提供自己的键。你可能想在循环中访问数组的键及其值。很好，别担心，哥们！PHP\
    \ 可以为你做到这些。让我们来看看语法。\n\n# 控制\n\n当你发现某段代码在应用程序中重复多次时，它是一个良好的指标，说明你应该使用函数代替。\n\n\
    # 示例 14：跳出循环。\n\n```php\n<?php\n// 创建一个 pandas 数组。\n$pandas = ['Lushui', 'Pali',\
    \ 'Jasmina'];\n\n];\n    'first' => 'Lushui',\n    'second' => 'Pali',\n    'third'\
    \ => 'Jasmina'\n];\n\n// 遍历我们的数组。\nforeach ($pandas as $panda) {\n    echo \"\
    You're the {$position} panda, {$panda}!\\n\";\n    break;\n}\n```\n\n正如你所看到的，一旦\
    \ PHP 遇到 `break` 语句，它将退出循环并进入下次迭代（等等，“跳过”和“继续”混在一起了）。\n\n让我们来看一个例子。\n\n# 示例 15：继续迭代。\n\
    \n```php\n<?php\n// 创建一个 pandas 数组。\n$pandas = [\n    'first' => 'Lushui',\n \
