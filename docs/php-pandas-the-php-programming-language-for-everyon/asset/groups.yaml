    \        $panda->eat();\n        $panda->poop();\n        $panda->sleep();\n \
    \   }\n}\n```\n\nZooKeeper 类包含一个照顾熊猫的单一方法。我们没有直接对 `RedPanda` 或 `GiantPanda` 类进行类型提示，而是对接口本身进行了类型提示。\n\
    \n这意味着，任何实现了 `PandaInterface` 接口的类都可以作为参数传递给 `care()` 方法。不仅如此，由于我们直接对接口进行了类型提示，我们可以确定传递给方法的实例将拥有三个方法：`eat()`、`poop()`\
    \ 和 `sleep()`。\n\n让我们尝试一下我们的 ZooKeeper 类。\n\n# 示例 10: 成为一名动物园员。\n\n```php\n<?php\n\
    // 创建熊猫实例\n$redPanda = new RedPanda;\n$giantPanda = new GiantPanda;\n\n// 创建动物园员。\n\
    $keeper = new ZooKeeper;\n\n// 照顾两只熊猫。\n$keeper->care($redPanda);\n$keeper->care($giantPanda);\n\
    ```\n\n首先，我们实例化两个熊猫的实现。接下来，我们创建了一个新的 ZooKeeper 实例。最后，我们调用了两次 `care()` 方法，传递了两个熊猫实现。\n\
    \n让我们检查结果。\n\n# 示例 11: 输出。\n\n- 小熊猫吃了一些水果。\n- 小熊猫拉了一次便。\n- 小熊猫爬上树去睡觉。\n- 大熊猫吃了一些竹子。\n\
    - 大熊猫拉了一次大便。\n- 大熊猫在地上睡觉。\n\n你看到，我们拥有的是什么种类的熊猫 并不重要。只要它符合熊猫的正确形状，我们就能确定它能吃、睡觉和泄便。类型提示接口是我们对这些方法存在的保证。\n\
    \n多态。一个简单的概念，却是一个复杂的世界！它也极其有用。假设你写了一个 `Tax` 类，它需要将一些税收信息写入长期数据存储器。我们可以创建一个带有 `read()`\
    \ 和 `write()` 方法的 `DataStoreInterface`。这样，我们就可以创建写入磁盘、写入数据库或写入远程文件系统的数据存储器，而它们都是可以互换的。我们可以让用户来决定。这就是创建优秀应用程序的方法。这就是力量。\n\
    \n# 22. 静态 (Static)\n\n静态就是你在调好所有频道之前，在电视机上看到的那些像素点点。好了，下一章。等一下，你是一个年轻又英俊/漂亮/兼有的开发者，不是吗？你太年轻了，还不知道如何调地面电视。那么让我们来看看静态方法和属性吧，好吗？\n\
    \n# 静态属性\n\n首先，你需要一个类。\n\n示例 01: 一个类！\n\n```php\n<?php\nclass RedPanda\n{\n}\n\
