  mdcn: "\n\n# 示例 02: 输出。\n\n- 1 所以拍下照片，并在脑海中定格这些画面。\n2 在健康和美好的时光里，把它们挂在架子上。\n3 纹身、记忆和老掉的皮肤正在接受审判。\n\
    4 无论值多少几何，这一切都是值得的。\n\n我们看到了一首经典歌曲的歌词。如果你能说出艺术家和歌名，会加分。朋友们，请在明信片上写下答案！实际上你也可以直接发推特给我！\n\
    \n我们应该看一眼函数的定义。在函数（小机器）被使用之前，我们必须告诉 PHP 它是做什么的。这就是我们的定义。这里是我要说的部分。\n\n# 示例 03:\
    \ 函数定义。\n\n```php\n<?php\nfunction echoSong() {\n    echo \"So take the photographs,\
    \ and still frames in your mind.\\n\";\n    echo \"Hang it on a shelf in good\
    \ health and good time.\\n\";\n    echo \"Tattoos and memories and dead skin on\
    \ trial.\\n\";\n    echo \"For what it's worth, it was worth all the while.\\\
    n\";\n}\n```\n\n我们知道 `echo` 是做什么的，所以为了清晰起见，让我们去掉函数定义的体。\n\n# 示例 04: 函数框架。\n\n\
    ```php\n<?php\nfunction echoSong() {\n    // 在此处执行操作。\n}\n```\n\n示例中的第一行被称为方法签名（method\
    \ signature）。它描述了方法及其它的形状。对于这样一个简单的函数，我们真正拥有的只有一个名字。我们用关键字 `function` 开始函数定义，后面跟着我们正在定义的函数名。函数的命名规则与变量相似，因此为了保持一致性，我们将使用驼峰命名法（camelCase）。\n\
    \n# 函数\n\n接下来，我们有一对圆括号。稍后我们将学习如何给函数传递参数，这些括号将会变得更有趣，但现在让它们保持为空！最后，我们有一个大括号括起来块。这与我们在前面的章节中看到的循环和分支类似。\n\
