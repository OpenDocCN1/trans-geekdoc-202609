    > 噢，天，那个开发者一定是个机器人。他们知道所有的代码单词、函数以及它们是如何运作的。


    没有开发经验的人往往会假设开发者是拥有数学荣誉学学位的天才。也许对于某些开发者来说这是事实，但对我来说绝对不是。我想其他开发者也会同意我的观点。


    事实是，我们并不完美。我们甚至离完美还很远。如果你认为开发者能记住所有这些 PHP 函数和代码段，那你就是在自欺欺人，认为自己永远没有能力跟上。


    事实并非如此。我们并不背诵所有内容。事实上，我们每天使用的代码大部分都是参考得来的。我们是“Google 战士”。PHP 中有些函数可以对文本行进行最简单的操作，而我几乎每周都会查看一次
    PHP 文档，以找到我传递给它们的参数顺序。


    当我完全卡住时，我会尝试使用 Google 看看是否有其他开发者遇到过类似的挑战。通常，我会找到另一个开发者发现的合适解决方案，或者足够引导我找到答案的信息。当然，这也是双向的，我会尝试把我的解决方案回馈社区。我会在
    Stack Overflow 上发布回答，并参与论坛或讨论。回馈社区是非常重要的。


    所以你看，我们不是机器人。我们并不了解这种语言的一切，也不是对每个问题都有解决方案。然而，我们是出色的研究人员。我们是机会主义者。我们是资源丰富的问题的解决者。我们是开发者。


    ## Google 的艺术


    当别人让你去 Google 某件事时，很容易把它看作是一种侮辱。或者也许是讽刺？其实不是。Google 成为我们的首页是有原因的。让我们学习如何找到常见开发问题的答案。


    我们正在写一个程序，在某处我们需要反转一个句子，让 ''Pandas rules!'' 变成 ''lear sadna''。我们完全不知道如何处理这项任务。我们刚开始学习
    PHP。


    我们知道在 PHP 中，一序列文本被称为“string”（字符串）。我们知道这一点，是因为我们没有放弃这本充满熊猫 示例的疯狂书籍，而且我们在后后的章节中发现了这个事实。对吧？


    所以知道要做什么。我们想要反转一个字符串。让我们为 Google 构建一个查询语句。


    ```

    reverse string

    ```


    不，等一下！这里的问题是有成千上万种编程语言。真的，计算机已经存在很久了！


    如果我们搜索 ''reverse string''，我们会得到 C++、ASP.NET 的答案。我们的重点是 PHP。我们不在乎其他语言。等我们成为 PHP
    大师后，会有时间玩它们的。让我们通过把语言添加到查询语句来解决这个问题。


    ```

    php reverse string

    ```


    完美。让我们看看从 Google 搜索返回的结果。现在可能是时候提到，我不是为 Google 工作的，我也不拿佣金。如果你喜欢 Bing，尽管去用，但结果在哪里呢？


    '
