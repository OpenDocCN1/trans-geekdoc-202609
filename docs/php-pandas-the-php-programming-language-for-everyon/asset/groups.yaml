    \    var $title;\n    var $author;\n    var $publisher;\n\n    // 声明一个方法。\n  \
    \  function summary() {\n        echo 'Title: ' . $this->title . PHP_EOL;\n  \
    \      echo 'Author: ' . $this->author . PHP_EOL;\n        echo 'Publisher: '\
