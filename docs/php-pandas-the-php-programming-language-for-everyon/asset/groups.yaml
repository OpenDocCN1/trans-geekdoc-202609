  - '[PAGE 7]


    # Acknowledgements


    First of all I would like to thank my girlfriend Emma, for not only putting up
    with all my nerdy antics, but also for taking the amazing red panda shots for
    both books!

    Love you Emma!


    Thanks to my parents, who have been supporting my interest in these math boxes
    for thirty years! Also thanks for buying a billion copies or so of the first book
    for family members!


    I''d also like to thank all of my wonderful colleagues at JustPark for their continued
    support!

    You guys rock!


    Thank you to everyone who bought my other books Code Happy and Code Bright, and
    all of the Laravel community. Without your support I''d never have had the confidence
    to continue writing.'
  - '[PAGE 8]


    # Errata


    This may be my third book and my writing may have improved since the last one,
    but I assure you that there will be many, many errors.


    You can help support the title by sending an email with any errors you have found
    to me@daylerees.com^1 along with the section title.


    Errors will be fixed as they are discovered. Fixes will be released within future
    updates to the book.


    > ^1mailto:me@daylerees.com'
