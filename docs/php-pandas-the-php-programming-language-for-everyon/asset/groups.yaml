    # Simple Namespacing


    Let''s create another class alongside the original, global Eddard.


    Example 03: The Stark namespace.


    ```

    <?php

    namespace Stark;

    // app/models/another.php

    class Eddard

    {

    }

    ```


    Here we have another Eddard class, with one minor change. The addition of the
    namespace directive. The line namespace Stark informs PHP that everything we do
    is relative to the Stark namespace. It also means that any classes created within
    this file will live inside the ''Stark'' namespace.


    Now, let''s try to use the ''Stark'' class once again.'
