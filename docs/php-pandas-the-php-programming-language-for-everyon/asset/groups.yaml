  mdcn: "\n\n## 示例 13：带有多个 case 的 switch 块。\n\n```php\n<?php\n$panda = _SOMETHING_;\n\
    switch ($panda) {\n    case 'Lushui':\n        echo 'Yey, Lushui time!';\n   \
    \ case 'Pali':\n        echo 'Oh there Pali!';\n    case 'Jasmina':\n        echo\
    \ 'Looking pretty Jasmina!';\n}\n```\n\n在这里我们可以看到多个 `case` 语句。但要小心！代码段中有一个陷阱。你会发现，无论匹配哪个\
    \ `case` 语句，下方其他 `case` 语句的代码都会被执行。如果我们希望执行它们，这可能会非常有用。\n\n这意味着如果 $panda 的值为 `Lushui`，那么所有三个\
    \ `echo` 语句都将被执行，但现在我们并没有！那么，我们如何确保只执行一个 `echo` 语句呢？很简单！我们需要一个 `break`，或者三个！\n\
    \n## 示例 14：break 语句。\n\n```php\n<?php\n$panda = _SOMETHING_;\nswitch ($panda)\
    \ {\n    case 'Lushui':\n        echo 'Yey, Lushui time!';\n        break;\n \
    \   case 'Pali':\n        echo 'Oh there Pali!';\n        break;\ncase 'Jasmina':\n\
    \    echo 'Looking pretty Jasmina!';\n    break;\n}\n```\n\n如果我们在 `echo` 语句之后的行放置一个\
    \ `break` 语句，就可以在该点停止 `switch` 语句的执行。执行流将跳出 `switch` 并在最后的闭合括号 `}` 之后继续执行。\n\n\
    这些 `break` 语句的效果与 `elseif` 和 `else` 语句类似。`break` 是一个会中断当前执行分支执行的关键字。这是一个非常值得记住的用法！\n\
    \n我们的 `switch` 语句还缺少最后一点东西。目前，它类似于一个末尾没有 `else` 的 `elseif` 语句。那么，我们如何实现带有 `else`\
    \ 的功能呢？很简单，我们只需要提供一个默认值（default）即可！\n\n让我们修改一下示例吧？\n\n## 示例 15：default。\n\n```php\n\
    <?php\n$panda = _SOMETHING_;\nswitch ($panda) {\n    case 'Lushui':\n        echo\
    \ 'Yey, Lushui time!';\n        break;\n    case 'Pali':\n        echo 'Oh hey\
    \ there Pali!';\n        break;\n    case 'Jasmina':\n        echo 'Looking pretty\
    \ Jasmina!';\n        break;\n    default:\n        echo 'Sorry, who are you?';\n\
    }\n```\n\n`default` 语句的工作方式与 `case` 语句类似，不同之处在于不需要提供比较值。如果其他 `case` 语句都没有匹配，将执行\
    \ `default` 下方的代码。\n\n`default` 语句不需要 `break`，因为它是 `switch` 语句的最后部分。不过，如果你为了清晰起见添加它，也不会产生任何功能上的区别。\n\
    \n在下一章中我们将学习迭代器。期待一下！来，我挑战你！\n\n## 12. 循环\n\n当你拥有一个值集合时，迭代器是非常用的。有时，“循环（loop）”是描述迭代器更好的词汇。我们将使用这些技术允许一段代码反复运行，直到（或只要）满足某个条件。\n\
    \n有些循环就像是在说“敲门直到有人回答”，而另一些则更像是“数数我地下室里埋的每一个体”。让我们仔细看看这些结构在 PHP 中是如何实现的。\n\n###\
    \ While\n\n`while` 循环会在提供的条件为真（true）时持续运行代码段。让我们使用计数器构造一个示例。\n\n示例 01：while 循环。\n\
    \n```php\n<?php\n// 将熊猫计数器设置为 0。\n$pandas = 0;\n// 当 $pandas 小于 50 时迭代。\nwhile\
    \ ($pandas < 50) {\n    // 输出熊猫管家的数量。\n    echo \"We have {$pandas} panda butlers!\\\
    n\";\n    // 计数器加1。\n    $pandas++;\n}\n```\n\n我们将计数器 $pandas 设置为 0。现在我们可以开始创建第一个循环了。万岁！我们需要用\
    \ `while` 单词开始 `while` 循环，后面跟着 `()` 圆括号内的条件，最后是一个包含在 `{}` 大括号内的代码块。\n\n`while`\
    \ 循环的形式与 `if` 语句相似。区别在于，当条件等于真时，`{}` 部分的代码将不断反复一次地执行。\n\n让我们执行代码看看发生了什么，我很期待见到这些熊猫。\n\
    \n示例 02：输出。\n\n```text\n1 We have 0 panda butlers!\n2 We have 1 panda butlers!\n\
    3 We have 2 panda butlers!\n4 We have 3 panda butlers!\n5 We have 4 panda butlers!\n\
