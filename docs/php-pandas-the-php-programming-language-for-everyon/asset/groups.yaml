    3 to 2 first? Or maybe divide 2 by 1 first. Hmmm. Tricky!


    Of course, in mathematics we learn to use rounded brackets to separate the concerns
    of an equation. We can do the same with PHP. Let''s give it to a go.


    # Example 07: Brackets for separation of concerns.


