  md: '# 25. Namespaces


    In PHP version 5.3, a new feature known as namesacing was added to the language.
    Many modern languages have already had this feature for some time, but PHP was
    a little late to the scene. None the less, every new feature has a purpose. Let''s
    find out why PHP namespaces can benefit our applications.


    The truth is, I stole this chapter from one of my blog articles. It was actually
    one of the most popular blog articles I''ve ever written, and for that reason,
    I''d rather use this than have another attempt and not be so successful. I''m
    a little bit sorry for the lazy-reuse, but only a bit. Now you''re learning one
    of the most important parts about being a programmer. DONT REPEAT YOURSELF (DRY).


    In PHP, you can''t have two classes that share the same name. They have to be
    unique. With this restriction, is that if you are making use of someone else''s
    code, and they have a class named User, then you can''t create your own class
    called User. This is a real shame, because that''s a pretty convenient class name,
    am I?


    PHP namespaces allow us to circumvent this issue. In fact, we can have as many
    User classes as we like. Not only that, but we can use namespaces to contain our
    similar code into neat packages, or even to show ownership.


    Let''s take a look at a normal class. Yes... I know you have used them before.
    Just trust me on this one okay?


    # Global Namespace


    Here''s a really simple class.


    Example 01: The Eddard class.


    ```

    <?php

    // app/models/Eddard.php

    class Eddard

    {

    }

    ```


    There''s nothing special to it. If we want to use it then we can do with this.'
  merge: -1
  img_proc: true
