    \ us from accidentally changing the value of the constant. Our circumference calculations\
    \ are safe.\n\nThe naming limitations of constants are identical to those of variables,\
    \ and you can define as many constants as you need. Constants are best described\
    \ as 'immutable', and will not be changed.\n\n# Class Constants\n\nThe constants\
    \ defined in the previous section are considered 'global', and are accessible\
    \ by all parts of our application. Sometimes, we only need constants that are\
