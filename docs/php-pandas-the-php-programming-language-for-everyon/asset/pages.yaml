  md: "# Type-hinting classes\n\nIn a previous chapter, we discovered how to type\
    \ hint function parameters so that we can ensure that they are of the correct\
    \ type. We demonstrated this technique using arrays, but they aren't the only\
    \ types of variables that can be type-hinted.\n\nIn PHP functions and methods,\
    \ we can type-hint classes. With a parameter type-hinted to a class, only instances\
    \ of the specified class can be passed to the method or function.\n\nLet's demonstrate\
    \ this functionality by first creating two classes.\n\nExample 09: Type-hinting\
    \ a class.\n\n```\n<?php\nclass Sephiroth\n{\n    function equipWeapon(Weapon\
    \ $weapon)\n    {\n        echo 'Die cloud die!';\n    }\n}\nclass Weapon\n{\\\
    }\n```\n\nOur first class, Sephiroth has a single method called equipWeapon(),\
    \ which has a parameter type-hinted to the second class named Weapon. (Don't worry\
    \ about the functionality of the equipWeapon() method for now, we're merely thinking\
    \ about structure at this point.) This means that you will only be able to pass\
    \ instances of the Weapon class as parameters for this method.\n\nLet's attempt\
    \ this."
