    While variable names can contain underscores and start with capitals, it''s a
    common practice to use a naming format known as camelCase. Don''t worry, it doesn''t
    require a camel.


    camelCased names start with a lowercase character. Variables that are to be named
    with multiple words will have the first character of subsequent words capitalized.
    Here are some examples.


