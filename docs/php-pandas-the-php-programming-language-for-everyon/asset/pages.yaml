- pgno: 31
  md: '# 6. Variables & Assignment


    Now we''re getting to the meat and potatoes! Variables are an extremely useful
    and well abused part of the developers toolkit. Let''s get started, shall we?


    # Tiny Boxes


    I''d like to think of variables as tiny little boxes that we keep things in. Variables
    are words that start with a $ sign. Let''s take a look at an example.


    Example 01: Basic assignment.


    ```

    <?php


    $three = 3;

    ```


    If you think of the variable $three as a little box, then we''ve put the value
    3 into it. That''s what the equals sign does. In math we use the equals sign to
    indicate the result of an equation, however, in PHP it''s an entirely different
    story.


    In PHP the equals = sign is known as the assignment operator. It''s used to set
    something. We are telling PHP to set the variable $three to the number 3.


    If you execute the script we created above, you''ll find PHP doesn''t output anything
    at all. This is because assignment is purely assignment. We aren''t telling PHP
    to output anything. However, now that we have set the variable $three to we can
    use the echo construct on it.


    Example 02: Echoing a value.


    ```

    <?php


    // Set our variable to the value three.

    $three = 3;


    // Output the value of our variable.

    echo $three;

    ```'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Variables & Assignment


    First we set our variable, and then we use the echo construct to output the value
    that it''s holding. If we execute our code, then we receive 3 as output.


    This is great because it means we can give nicknames to things. You know, just
    like those kids at school. For example, the number ''3.141592653539'' is a very
    beautiful number to lovers of circles, but it''s awfully hard to remember, isn''t
    it? Let''s give it a nickname. We''ll call it Pete. No wait, I have a better idea.


    # Example 03: An appropriate variable name.


    ```

    <?php

    $pi = 3.141592653539;

    ```


    There, now we have created a new variable called $pi that holds the value 3.141592653539.
    This means that we can use the variable anywhere in our code to perform calculations.
    Here are some examples.


    # Example 04: Using variables in statements.


    ```

    <?php

    // Assign pi to a variable.

    $pi = 3.141592653539;


    // Perform circumference calculations.

    echo $pi * 5;

    echo $pi * 3;

    ```


    After setting $pi, we can use it in other statements to perform calculations.

    We can declare and assign as many variables as we like, but there are a number
    of rules that we need to follow when choosing names. Variable names can contain
    numbers, letters and underscores. However, they must start with either a letter
    or underscore, never a number! They are case sensitive, which means $pi is different
    from $panda. Here are a few examples.'
  merge: -1
