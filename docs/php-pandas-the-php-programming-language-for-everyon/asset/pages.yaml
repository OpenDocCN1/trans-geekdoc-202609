- pgno: 143
  md: '# Example 13: Accessing a class constant.


    ```

    return $diameter * self::PI;

    ```


    Simple! Now our value for PI can be used, but will never change. What''s this
    self:: stuff all about?


    Well, you may have noticed that the constant we created did not include any scope
    (public/private/protected/static). Our constant cannot be changed, and because
    of its, value will be the same across all instances of our Circle class.


    For this reason, constants are not accessed in the same manner as class properties.
    In fact, you don''t need a class instance to access the constant. Confused? Take
    a look at the following piece of code, which makes use of our Circle class.


    # Example 14: Accessing a constant on the class definition.


    ```

    echo Circle::PI;

    ```


    > If we execute the snippet above, we''ll receive the correct value for PI. We
    don''t need a class instance. Using the double :: colon operator, we can access
    the PI constant directly on the class definition. This means that constants can
    be considered somewhat public, since their values can be accessed (but never modified!)
    from outside of a class instance.


    The double :: colon operator is actually known as the Scope Resolution Operator,
    or even the Paamayim Nekudotay. Both of these sound terrifying, so let''s stick
    with the double colon for now.


    It''s worth noting that we can access the constant in a similar fashion from a
    class instance. For example, the following code is entirely valid, and yields
    an identical result to the previous example.


    # Example 15: Access the constant on the instance.


    ```

    $circle = new Circle;

    echo $circle::PI;

    ```


    Within the class, self is used as a reference to the current class definition.
    On the following line...'
