- pgno: 47
  md: '# 8. Arrays


    It''s time for my favourite data type. I absolutely love arrays! They are fantastically
    fun, and really useful. Arrays are great for when one value isn''t enough, and
    for some reason the collection of values are related.


    # Indexed


    Let''s say that we want to store the names of all of our pandas within our application.
    They are all pandas. They are related. It doesn''t make sense to create separate
    variables for each of them.


    Let''s store them in an array, shall we? What?! Don''t tell me you didn''t see
    that coming. You saw the title, didn''t you?


    Example 01: Creating arrays.


    ```

    // Create an array.

    $pandas = array(''Lushui'', ''Jasmina'', ''Pali'');


    // Create an array as well.

    $pandas = [''Lushui'', ''Jasmina'', ''Pali''];

    ```


    We have two examples of arrays. Both work out the same, but the second example
    was a syntax that was added in PHP version 5.4. This means that it won''t work
    on versions before 5.4. However, I highly recommend using the second format, since
    the PHP world is moving forward, and we''ll all see it using version 5.6.


    Some people like to use the first type of array that they intend to share with
    others, so that it remains compatible with all versions of PHP. We''ll be using
    the new array syntax for most of the examples in this book. You''re free to use
    the older ones if you choose to do so.


    Array values are held either between an array( ) or between [ ] (square brackets).
    Each element of an array must be separated by a comma: . The last option in an
    array can also take an optional comma, but I prefer to leave it out. In the example
    above, we''ve added three string values to an array. Arrays can hold strings,
    other data types, or even other variables!


    Here are more examples.'
  merge: -1
  img_proc: true
