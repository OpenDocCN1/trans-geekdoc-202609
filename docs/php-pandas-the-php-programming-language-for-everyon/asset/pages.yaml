- pgno: 78
  md: '# Loops


    Well, did you work it out? First let''s take a look at the syntax. We begin with
    a do keyword. Unlike the while loop, next we have the block section of our loop
    container within curly braces. Next, we have the while keyword, followed by our
    condition.

    The works in an identical way to the while loop. The only difference between these
    two loops is that the while loop will always execute the code block at least once.
    It will execute the block before it checks the condition for the first time.


    # For


    It''s time to take a look at a for loop. This one will be a little tricky to explain,
    so we had best lead with an example.


    Example 05: The for loop.


    ```

    ```php

    <?php

    // Iterate for 50 repetitions.

    for ($i = 0; $i < 50; $i++) {

    // Output the number of panda butlers.

    echo "We have {$i} panda butlers!\n";n}

    ```

    ```


    In the above example we''ve recreated a similar loop to our original while loop,
    except that we don''t need to manage the counter variable ourselves.

    We''re more than familiar with the code block held between the curly braces, so
    let''s take a close look at the first line.


    Example 06: The first line.


    ```

    ```php

    <?php

    for ($i = 0; $i < 50; $i++)

    ```

    ```


    Of course, our for loop begins with a for keyword. Next, we have a set of ( rounded
    brackets ). These are normally used to hold a strict condition, but the for loop
    is a little different. Within the brackets we find three short statements.

    The first statement is used to set the counter for our loop to its initial value.'
