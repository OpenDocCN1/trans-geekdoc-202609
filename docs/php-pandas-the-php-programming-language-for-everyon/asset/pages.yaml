  md: '# 24. Traits


    In the inheritance chapter, we learned how to extend classes to share common functionality.
    The problem with extending classes, is that you can only extend one other. This
    is a little limiting.


    # Implementation


    In PHP 5.4 a new construct, called a ''trait'', was introduced to the language.
    Using traits, it was possible for PHP classes to inherit methods and properties
    from multiple sources. A direct solution to the problem of single inheritance.


    Let''s take a look at a trait, shall we?


    Example 01: My first trait.


    ```

    ```php

    trait SomethingTrait

    {

    }

    ```

    ```


    As you can see, a trait looks very similar to a class. Instead, it is declared
    using the trait keyword. The convention of naming a trait with the Trait suffix
    is quite a popular one, so it might be something that you should consider adopting.


    Unlike a class, what''s important to remember, is that you cannot add extends
    or implements to a trait. You cannot instantiate a trait, either. Their sole purpose
    is to support our classes, and not to replace them.


    Traits can have methods, just like classes do. For a moment, let''s think back
    to our Animal class. Do you remember it? Here it is once again to refresh our
    memory.'
  merge: -1
  img_proc: true
