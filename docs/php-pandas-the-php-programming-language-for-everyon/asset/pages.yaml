- pgno: 138
  md: "# 19. Constants\n\nIn a previous chapter, we discovered variables, and how\
    \ they could be used to store a variety of different types of information. You\
    \ could re-assign a variable to a new value, and PHP wouldn't give you hoots about\
    \ it!\n\nSometimes, things aren't meant to change. Old people will always prefer\
    \ to wear beige. The government will continually attempt to throw your money away.\
    \ Red pandas will consistently become excitable in periods of cold weather.\n\n\
    # Defined Constants\n\nThere are values in your code that might not want to change\
    \ too. For example, let's use that wobobbly-wobbly fading technique they use on\
    \ TV shows to go back in time and take another look at the assignment of the $pi\
    \ variable.\n\nExample 01: A PI variable.\n\n```\n$pi = 3.14159265359;\n```\n\n\
    There is. Beautiful.\n\nDo you think that the value of PI is ever going to change?\
    \ I mean sure, it can always be calculated to additional decimal places by clever\
    \ white coat wearing boffins, but is it likely to change within your program?\n\
    \nI doubt it. In fact, if someone was to do this...\n\nExample 02: Set PI to 5.\n\
    \n```\n$pi = 5;\n```\n\n... then our circumference calculations would be in big\
    \ trouble. We'd have our middle school Math professor frowning at us, and we don't\
    \ want that. \n\nIt would be great if we could lock our $pi variable to a value,\
    \ so that it couldn't be changed at all. Well, as it turns out, a variable isn't\
    \ what we need at all. We need something called a constant.\n\nConstants used\
    \ outside of classes (I like to call this the Global scope.) are defined using\
    \ a special function. Let's take a look."
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Constants


    # Example 03: Define a PI constant.


    ```

    define(''PI'', 3.14159265359);

    ```


    We use the define() function to set our PI constant to the correct value. As you
    can see, the constant name is the first parameter to the function, and its value
    is the second.


    > You''ll notice that the constant name is written in uppercase. This isn''t only
    true for the PI constant. A convention for programmers is to write constants in
    uppercase, and use underscores for spaces. THIS_IS_A_CONSTANT.


    Let''s try to use our constant. It''s very similar to a variable, only that it
    doesn''t begin with a $ sign. Let''s attempt to execute our constant.


    # Example 04: Use the PI constant.


    ```

    // Define our constant.

    define(''PI'', 3.14159265359);


    // Echo the value of PI.\echo PI;

    ```


    Executing our snippet of code yields the result:


    # Example 05: Output.


    3.14159265359


    Great! This is exactly what we''d get using a variable. Let''s now try to re-define
    the constant. For example:


    # Example 06: Attempt to re-define a constant.


    ```

    // Re-define our constant.

    define(''PI'', 42);

    ```


    What do you think will happen when we try to execute our code? Let''s give it
    a go.'
  merge: -1
  img_proc: true
