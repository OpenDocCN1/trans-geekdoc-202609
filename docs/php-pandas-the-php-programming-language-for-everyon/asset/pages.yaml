    # Concatenation


    Concatenation is the process of joining two strings end to end. Like creating
    a bead necklace, or the human centipede... oh my. Let''s take a look at an example
    of this process in action.


    # Example 05: String concatenation.


    ```

    <?php

    // First value.

    $first = ''Pandas are'';

    // Second value.

    $second = ''awesome!'';

    // Concatenate.

    var_dump($first . $second);

    ```


    We create two string values, and then we output the result of concatenation. In
    PHP we use the period . character to perform concatenation. Let''s take a look
    at the result, shall we?'
  merge: -1
