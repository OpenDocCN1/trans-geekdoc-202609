- pgno: 166
  md: "# 23. Exceptions\n\nExceptions let us know that our programs haven't worked\
    \ as expected. If something goes wrong, and our code can't continue to work as\
    \ expected, then we use an exception to let the user know.\n\n# Throwing\n\nLet's\
    \ create a function. We've been using lots of classes recently, let's make sure\
    \ we still know how to use a function. It's best to make sure, isn't it?\n\nHere\
    \ we go...\n dear, I've forgotten how to create a function. Do you mind reminding\
    \ me?\n\n> Sure thing Dayle, not a problem!\n\nExample 01: Panda feeding function.\n\
    \n```\n<?php\n/**\n * Feed the panda some food.\n * @param string $food\n * @return\
    \ void\n */\nfunction feedPanda($food)\n{\n    echo \"The panda eats the {$food}\"\
    ;\n}\n```\n\nGood job! Now I remember. Here we've got a function that lets us\
    \ feed a panda, right? Let's feed it some apple. They like apple."
  merge: -1
  img_proc: true
- pgno: 167
  md: "Exceptions\n\n157\n\n# Example 02: Feed the panda an apple.\n\n```\n```php\n\
    <?php\nfeedPanda('apple');\n```\n```\n\nLet's run the code.\n\n# Example 03: Output.\n\
    \n+    The panda eats the apple.\n\nAwesome! What about chocolate? Do you think\
    \ the panda would like some chocolate? No? Well that's probably because chocolate\
    \ is poisonous to pandas. We definitely don't want any chocolate being fed to\
    \ them.\n\nHey, I got an idea. Why don't we throw an exception if someone tries\
    \ to feed the panda some chocolate? Let's try it out.\n\n# Example 04: Throw an\
    \ exception.\n\n```\n```php\n<?php\n/**\n * Feed the panda some food.\n *\n *\
    \ @param string $food\n * @return void\n */\nfunction feedPanda($food) \n{\n \
    \   if ($food === 'chocolate') {\n        throw new Exception('NO CHOCOLATE FOR\
    \ THE PANDA!');\n    }\necho \"The panda eats {$food}\";\nn```\n```\n\nFirst,\
    \ we check to see whether the food we're trying to feed the panda is equal to\
    \ the string value 'chocolate'. If the string matches, we'll need to use an exception.\
    \ Let's take a look at that piece of code in isolation."
  merge: -1
  img_proc: true
- pgno: 168
  md: "Exceptions\n\n# Example 05: Throwing an exception.\n\n```\n```php\n<?php\n\
    throw new Exception('NO CHOCOLATE FOR THE PANDA!');\n```\n```\n\nExceptions are\
    \ classes like any other; they need to be instantiated with the new keyword. The\
    \ first parameter to constructor of the Exception class, is the message that will\
    \ be associated with the exception.\n\nExceptions are thrown, like a tennis ball,\
    \ or a party. The throw keyword is used to trigger an exception. Once this exception\
    \ has been thrown, then the program will be halted, and the user will be alerted\
    \ to the error. Let's give it a go, shall we?\n\n# Example 06: Feed the panda\
    \ chocolate.\n\n```\n```php\n<?php\nfeedPanda('chocolate');\n```\n```\n\nIt's\
    \ ok. I promise that the panda won't be harmed. Let's execute the code.\n\n# Example\
    \ 07: Output.\n\nPHP Fatal error: Uncaught exception 'Exception' with message\
    \ 'NO CHOCOLATE FOR THE PANDA!' in file:<line>\n\nExcellent, our panda is safe.\n\
    \nSince exceptions are classes like any other, we are able to extend them. We\
    \ can do this to make the nature of the problem a bit clearer. Let's go ahead\
    \ and extend the Exception class.\n\n# Example 08: A PandaException.\n\n```\n\
    ```php\n<?php\nclass PandaException extends Exception\n{\n    protected $message\
    \ = 'NO CHOCOLATE FOR THE PANDA!';\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "You'll notice that in addition to the extension of the Exception class, we've\
    \ also\ndefined a property. Do you remember how protected works? If not, now\n\
    is a great time to check the scope chapter for a refresh.\n\nYou see, the Exception\
    \ class has a property called $message. This normally gets set to\nthe parameter\
    \ that we give it in the constructor. Since the property is protected,\nare we\
    \ able to override its value within our object class. This means that we no longer\n\
    have to pass the message when defining our extension.\n\nLet's go ahead and throw\
    \ our PandaException instead.\n\n# Example 09: Throw the PandaException.\n\n```\n\
    <?php\n/**\n * Feed the panda some food.\n * @param string $food\n * @return void\n\
    \ */\nfunction feedPanda($food) {\n    if ($food === 'chocolate') {\n        throw\
    \ new PandaException();\n    }\n\necho \"The panda eats {$food}\";\n}\n```\n\n\
    We're throwing our PandaException without any parameters. Let's see what happens\n\
    when we pass the function some chocolate.\n\n# Example 10: Output.\n\n```\nPHP\
    \ error: Uncaught exception 'PandaException' with message 'NO CHOCOLATE\\nFOR\
    \ THE PANDA!' in <file>:<line>\n```\n\nGreat! Our exception is now more descriptive,\
    \ and still has the message that we\ndesired. Let's go one step further and expand\
    \ our single exception into two."
  merge: -1
  img_proc: true
- pgno: 170
  md: "# Example 11: Two exceptions.\n\n```\n<?php\nclass PandaChocolateException\
    \ extends Exception\n{\n    protected $message = 'NO CHOCOLATE FOR THE PANDA!';\n\
    }\nclass PandaChilliException extends Exception\n{\n    protected $message = 'NO\
    \ CHILLI FOR THE PANDA. OUCH!';\n}\n```\n\nNow we have two exceptions, PandaChocolateException\
    \ and PandaChilliException, for the two kinds of food that the panda's delicate\
    \ digestive tract would struggle with.\n\nThere's no limit to the number of exceptions\
    \ that we can throw, so let's go ahead and modify our code.\n\n# Example 12: Throw\
    \ two exceptions.\n\n```\n<?php\n/**\n * Feed the panda some food.\n * @param\
    \ string $food\n * @return void\n */\nfunction feedPanda($food) {\n    // Switch\
    \ on food.\n    switch ($food) {\n        // Handle chocolate.\n        case 'chocolate':\n\
    \            throw new PandaChocolateException;\n        // Handle chillies.\n\
    \        case 'chilli':\n            throw new PandaChilliException;\n    }\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 171
  md: "# Exceptions\n\n21\n22\n23\n24\n25\n26\n\n```\n// Handle other food.\ndefault:\n\
    \    echo \"The panda eats the {$food}\";\n}\n```\n\nHere, we've used a switch\
    \ to deal with the different types of food. Why a switch? It's a great excuse\
    \ to make sure you've learned how they work.\n\nIn the switches section, we discovered\
    \ that the break keyword should be used to halt the execution of the application.\
    \ Hold on, we've not used the break keyword in the switch statement above. Why\
    \ do you think that is?\n\nWell you, exceptions also halt the thread of execution,\
    \ so we don't need the break statements. Let's try and trigger the PandaChilliException,\
    \ shall we?\n\nExample 13: Output.\n\n+   1 Fatal error: Uncaught exception 'PandaChilliException'\
    \ with message 'NO CHILL F OR THE PANDA. OUCH!' in <file> on line <line\n\nAwesome!\
    \ Well it looks like we are masters of throwing exceptions. The trouble is, how\
    \ this better than just using a PHP function such as exit() or die() to halt execution\
    \ instead? What do we have to gain? Well, we're not quite yet!\n\n> The exit()or\
    \ die() functions can be used to terminate the PHP application. If you pass a\
    \ string as a parameter, it will display the string before exiting. Pretty useful!\n\
    \n# Try & Catch\n\nNow we've learned to throw exceptions, it's time to learn how\
    \ to catch them. Go ahead and put on your baseball mitt.\n\nIf our code throws\
    \ exceptions, we can use try and catch to handle them appropriately. This way,\
    \ our code can recover, and catch it's true end.\n\nLet's consider the final code\
    \ snippet from the previous section."
  merge: -1
  img_proc: true
- pgno: 172
  md: "Exceptions\n\n# Example 14: Throwing exceptions again.\n\n```\n<?php\n/**\n\
    \ * Feed the panda some food.\n * @param string $food\n * @return void\n */\n\
    function feedPanda($food) {\n{\n    // Switch on food.\n    switch ($food) {\n\
    \        // Handle chocolate.\n        case 'chocolate':\n            throw new\
    \ PandaChocolateException;\n        // Handle chillies.\n        case 'chilli':\n\
    \            throw new PandaChilliException;\n        // Handle other food.\n\
    \        default:\n            echo \"The panda eats the {$food}\";\n    }\n}\n\
    ```\n\nLet's start small. Let's handle the situation where the panda is fed some\
    \ chocolate. Here's how we might achieve this.\n\n# Example 15: Catch an exception.\n\
    \n```\n<?php\n// Set the type of food.\n$food = 'chocolate';\ntry {\n    feedPanda($food);\n\
    } catch (PandaChocolateException $exception) {\n```"
  merge: -1
  img_proc: true
- pgno: 173
  md: "# Exceptions\n\n```\necho 'That was a close one! No chocolate for the panda.';\n\
    }\n```\n\nThere's some new syntax here, isn't there? Let's pull it out of the\
    \ code for clarity.\n\nExample 16: Catch any exception.\n\n```\n<?php\ntry {\n\
    \    // Code that might trigger the exception.\n} catch (Exception $exception)\
    \ {\n    // Code to handle the exception.\n}\n```\n\nWhat we have here, is two\
    \ connected code blocks. They can be broken down into two purposes.\n\nThe try\
    \ block wraps around the code that might trigger an exception. Any exceptions\
    \ that are thrown by the code executed within this block, are handled to the catch\
    \ section.\n\nThe catch block traps the exceptions that are throwing in the try.\
    \ Instead of halting the execution of the code, you can handle them here, allowing\
    \ for a chance at recovery. For, in the code snippet above, we're trapping exceptions\
    \ of type Exception. Note that this will also trap exceptions which inherit from\
    \ the Exception class, so that's all of them!\n\nWhatever exception class you\
    \ type-hint in the catch block, will become trapped when it is thrown within the\
    \ try. The instance that is thrown, will be passed as a parameter. This allows\
    \ you to access properties such as the message, or error code. Or if you have\
    \ decided that it couldn't be handled, you could throw it once more.\n\nNow then,\
    \ let's take a look at our original code snippet once more."
  merge: -1
  img_proc: true
- pgno: 174
  md: "# Example 17: Catch the chocolate exception.\n\n```\n<?php\n// Set the type\
    \ of food.\n$food = 'chocolate';\n\ntry {\n    feedPanda($food);\n} catch (PandaChocolateException\
    \ $exception) {\n    echo 'That was a close one! No chocolate for the panda.';\n\
    }\n```\n\nWe've wrapped the feedPanda() function within the try catch, because\
    \ we know that's the code that might throw an exception.\nnIn the catch section\
    \ we've typed the PandaChocolateException, so when this gets thrown, it will be\
    \ caught within the second catch block. Instead of letting the exception trigger\
    \ an error, we've decided to echo a useful message to our users.\nLet's go ahead\
    \ and execute the code.\n\n# Example 18: Output.\n\n+   - That was a close one!\
    \ No chocolate for the panda.\n\nPerfect! We've prevented the panda from being\
    \ ill. That shouldn't we try to catch both of them? After all, what use is only\
    \ catching one exception? Let's give this a go, shall?\n\n# Example 19: Catch\
    \ both exceptions.\n\n```\n<?php\n// Set the type of food.\n$food = 'chilli';\n\
    \ntry {\n    feedPanda($food);\n} catch (PandaChocolateException $exception) {\n\
    \    echo 'That was a close one! No chocolate for the panda.';n} catch (PandaChilliException\
    \ $exception) {\n    echo 'That was a close one! No chilli for the panda.';\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 175
  md: "# Exceptions\n\nTo catch additional exceptions, we can simply chain additional\
    \ catch blocks onto our try-catch block. We type-hint a different exception within\
    \ each block, so that we can deal with our exceptions in different ways.\n\nLet's\
    \ execute the code once more.\n\nExample 20: Output.\n\n```\nThat was a close\
    \ one! No chilli for the panda.\n```\n\nGreat. There's one final... heh... section\
    \ to the try-catch block. It's optional, but let's take a anyway.\n\n# Finally\n\
    \nThe finally block allows for some code to be executed after the try and catch.\
    \ If the code is terminated within the catch then it will never reach the finally.\
    \ Let's take a look at the structure.\n\nExample 21: The finally block.\n\n```\n\
    <?php\ntry {\n    // Code that might trigger the exception.\n} catch (Exception\
    \ $exception) {\n    // Code to handle the exception.\n}\nfinally {\n    // Code\
    \ to run after the try and catch.\n}\n```\n\nNow we can examine this construct\
    \ as a three stage process.\n\n+   1. try to execute a piece of code.\n2. Attempt\
    \ to catch any problems that might arise.\n3. finally execute some additional\
    \ code.\n\nLet's look at a practical example for this construct."
  merge: -1
  img_proc: true
- pgno: 176
  md: "# Example 22: A database connection.\n\n```\ntry {\n    $database->connect('username',\
    \ 'password');\n} catch (DatabaseException $databaseException) {\n    echo 'Unable\
    \ to connect to the database.';\n    die();\n} \nfinally {\n    $database->fetchRecords();\n\
    }\n```\n\nWe wrap the code for connecting to the database within a try block.\
    \ We can't be sure that the username and password is correct, and if this is not\
    \ the case, then an exception is thrown.\n\nTo prevent this exception from halting\
    \ the code in an ugly manner, we catch the exception, and exit the application\
    \ with a useful error message.\n\nIf the connection to the database is successful,\
    \ we can use it to retrieve the record that we want to, and our application can\
    \ continue as normal.\n\nUse exceptions in your applications to handle errors\
    \ in an elegant manner, and use try blocks to ensure that these exceptions are\
    \ dealt with in an appropriate manner. I promise that this will make you a better\
    \ programmer."
