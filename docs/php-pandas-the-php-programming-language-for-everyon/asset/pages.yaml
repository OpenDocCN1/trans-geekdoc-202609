  md: 'Interfaces


    # Example 10: Be a ZooKeeper.


    ```

    <?php

    // Create panda instances

    $redPanda = new RedPanda;

    $giantPanda = new GiantPanda;


    // Create the zookeeper.

    $keeper = new ZooKeeper;


    // Care for both pandas.

    $keeper->care($redPanda);

    $keeper->care($giantPanda);

    ```


    First, we instantiate both panda implementations. Next, we create a new ZooKeeper
    instance. Finally, we call the care() method twice, passing both panda implementations.


    Let''s check the result.


    # Example 11: Output.


    +   - The red panda eats some fruit.

    - The red panda takes a poop.

    - The red panda sleeps up a tree.

    - The giant panda eats some bamboo.

    - The giant panda takes a giant poop.

    - The giant panda sleeps on the ground.


    You see, it doesn''t matter what type of panda we have. As long as it''s the right
    shape for a panda, we can be sure that it can eat, sleep and poop. Type-hinting
    the interface is our guarantee that these methods are present.


    Polymorphism. A complicated world, for a simple concept! It''s also one that''s
    incredibly useful. Imagine that you have written a Tax class, and it needs to
    write some tax information to a long-term data store. We could create a DataStoreInterface
    with read() and write() methods. This way we could create data stores for writing
    to the disk, writing to a database, or writing to a remote filesystem, and all
    of them would be interchangeable. We could let the user decide. That is how you
    create good applications. That is power.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# 22. Statics


    Static is that pixely-dotty stuff that you get on your television before you tune
    all your channels in. Right, next chapter. Wait, you''re a young handsome/beautifulful/both
    developer aren''t you? You''re going to be too young to know about tuning terrestrial
    televisions. Let''s take a look at static methods and properties instead then,
    shall we?


    # Static Properties


    First you''re going to need a class.


    Example 01: A class!


    ```

    <?php

    class RedPanda

    {

    }

    ```


    There she is, bushy tail, fine fluffy coat... what a fine specimen of a class!
    Normally, we''d have to create an instance of our class to use it, wouldn''t we?
    Something like this...


    Example 02: Create a class instance.


    ```

    <?php

    $panda = new RedPanda;

    ```


    As we''ve learned previously, each instance can contain different values and states
    to other instances of the RedPanda class. For example, if the class had a name
    property, one instance might have the name ''Hamish'' while another might be called
    ''Daniel''. The instances of the classes have state.


    Well... unless you cheat a little. You see, the class itself can have state. Let''s
    add a static property to our RedPanda class, shall we?'
  merge: -1
  img_proc: true
- pgno: 158
  md: "# Example 03: A static property.\n\n```\n<?php\nclass RedPanda\n{\n    /**\n\
    \     * The panda's name!\n     * @var string\n     */\n    public static $name;\n\
    }\n```\n\nBy adding the keyword static after our new property's scope, we've made\
    \ it static. What does that mean exactly? Well, we can actually use this property\
    \ without creating an instance of the class. Here's a simple example...\n\n# Example\
    \ 04: Setting static property.\n\n```\n<?php\nRedPanda::$name = 'Hamish';\necho\
    \ RedPanda::$name;\n```\n\nIn the example above, you'll notice that we're not\
    \ creating an instance of RedPanda. Instead, we're setting the $name static property\
    \ using the 'scope resolution operator'... or.. :: Don't forget that you still\
    \ need to use the $, when pointing out the property. This is a common gotcha,\
    \ since $this->name wouldn't require the dollar sign.\n\nUsing this method, we\
    \ can set and retrieve static properties on the class, as if they were public\
    \ instance properties. That's not all! The instances that we create of this class\
    \ will also retain the state of that variable across all instances. For example,\
    \ let's take a look at the following snippet."
  merge: -1
  img_proc: true
- pgno: 159
  md: "# Example 05: Access a static property\n\n```\n<?php\nRedPanda::$name = 'Hamish';\n\
    $panda = new RedPanda;\necho $panda::$name;\n```\n\nIn the example above, we're\
    \ setting the static parameter to 'Hamish' on the class directly. We then create\
    \ a new instance of the class, and echo the static property directly from instance.\
    \ We receive the result 'Hamish'. No matter whether you are working with the class\
    \ directly, or an instance of that class, the state of that variable will be common\
    \ across circumstances.\n\nDo you think you're limited to only static properties?\
    \ Oh no! Think again dear reader...\n\n# Static Methods\n\nClasses may also have\
    \ methods that are static. Let's create an example.\n\n# Example 06: A static\
    \ method.\n\n```\n<?php\nclass RedPanda\n{\n    /**\n     * Make the panda be\
    \ cute!\n     * @return void\n     */\n    public static function beCute()\n \
    \   {\n        echo 'The Red Panda rolls around in the snow.';\n    }\n}\n```\n\
    \nOnce again, we simply add the keyword static to the method declaration to make\
    \ it a static one. Now let's try to use this method on the class itself, rather\
    \ than an instance of a RedPanda class."
  merge: -1
  img_proc: true
- pgno: 160
