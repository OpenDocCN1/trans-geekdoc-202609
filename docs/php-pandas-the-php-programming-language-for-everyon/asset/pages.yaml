- pgno: 85
  md: "# 13. Functions\n\nFunctions are a great way to organise your applications.\
    \ They can be used to avoid repetition in your codebase. When you find a similar\
    \ piece of code duplicated many times within your application, it's a good indicator\
    \ that you should be using a function instead.\n\nYou can think of functions as\
    \ little factory machines. Your variables (little boxes) go into a slot on one\
    \ side of the machine, some cogs spin, crunching noises happen and something else\
    \ comes out of the other side.\n\n# Basic Usage\n\nLet's take a look at a function.\
    \ You've been with me for many chapters, I'm sure you know how this works!\n\n\
    Example 01: My first function.\n\n```\n<?php\nfunction echoSong() {\n    echo\
    \ \"So take the photographs, and still frames in your mind.\\\\n\";n    echo \"\
    Hang it on a shelf in good health and good time.\\\\n\";n    echo \"Tattoos and\
    \ memories and dead skin on trial.\\\\n\"\n    echo \"For what it's worth, it\
    \ was worth all the while.\\\\n\"\n}\n\nechoSong();\n```\n\nRight, this is all\
    \ new! Before we begin the explanation, let's go ahead and execute the code. What's\
    \ the output that we receive?"
  merge: -1
  img_proc: true
