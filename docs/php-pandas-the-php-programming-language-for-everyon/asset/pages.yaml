    \ points in if you can name the artist and song title. Answers on a postcard folks!\
    \ Actually, you can just tweet me!\n\nWe should take a look at the function definition.\
    \ Before a function (little machine) can be used, we must tell PHP what it does.\
    \ This is our definition. Here's the section I'm talking about.\n\n# Example 03:\
    \ Function definition.\n\n```\n?php\nfunction echoSong() {\n    echo \"So take\
    \ the photographs, and still frames in your mind.\\\\n\"\n    echo \"Hang it on\
    \ a shelf in good health and good time.\\\\n\"\n    echo \"Tattoos and memories\
    \ and dead skin on trial.\\\\n\"\n    echo \"For what it's worth, it was worth\
    \ all the while.\\\\n\"\n}\n```\n\nWe know what the echo do, so let's strip out\
    \ the body of the function definition for clarity.\n\n# Example 04: Function outline.\n\
    \n```\n?php\nfunction echoSong() {\n    // Do stuff here.\n}\n```\n\nThe first\
    \ line in the example is called the method signature. It describes the method,\
    \ and its shape. With a function this simple, all we really have a name. We start\
