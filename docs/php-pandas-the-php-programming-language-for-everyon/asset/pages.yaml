- pgno: 161
  md: "# Statics\n\nhas no instance to play with. Since there is no instance, $this\
    \ resolves to nothing. Any attempts to use it will result in a PHP fatal error.\n\
    \nThis also means that we cannot call other non-static methods from a static method\
    \ on a class, because we'd have to use $this->otherMethod() to do so.\n\nDoes\
    \ that mean our static methods can call to other methods? Well not entirely. Our\
    \ static methods can call to other static methods. Here's an example.\n\n# Example\
    \ 10: Chain a static method.\n\n```\nphp\nclass RedPanda {\n    public static\
    \ function eat() {\n        return self::eatLeaves();\n    }\n    private static\
    \ function eatLeaves() {\n        return 'The Panda munches on some tasty leaves.';\n\
    \    }\n}\n```\n\nRight, let's run through this. We have a public static method\
    \ called eat(), calls to the eatLeaves() method and returns the result. Note that\
    \ the eatLeaves() method is private, and cannot be called directly on the class.\
    \ It can only be called from within another method of the class.\n\nWe're using\
    \ the self keyword in the above example. It's used to refer to itself, or the\
    \ current class. So self::eatLeaves() means, please make a static call to the\
    \ eatLeaves() method of this class.\n\nWhen we run RedPanda::eat() we get.\n\n\
    # Example 11: Output.\n\nThe Panda munches on some tasty leaves.\n\nMany developers\
    \ use these public static methods to create instances of the classes that they\
    \ are attached to. For example..."
  merge: -1
  img_proc: true
- pgno: 162
  md: "# Example 12: A factory method.\n\n```\n<?php\nclass RedPanda\n{\n    protected\
    \ $name;\n    public function __construct($name = null)\n    {\n        $this->name\
    \ = $name;\n    }\n    public static function make()\n    {\n        return new\
    \ self('Hamish');\n    }\n    public function getName()\n    {\n        return\
    \ $this->name;\n    }\n}\n```\n\nIn the above example, our RedPanda class takes\
    \ an optional $name parameter through its constructor. Then, it sets the $name\
    \ protected property to the value you have passed. The public getName() function\
    \ can be used to access the name of the panda.\n\nWe've also got the make() public\
    \ static method, which returns new self() to create a new instance of the current\
    \ class, and return it. It even passes 'Hamish' as the name, so we can use RedPanda::make()\
    \ to create a new Hamish panda instance quickly.\n\n> We mentioned that you cannot\
    \ access instance methods from a static method, but the reverse is perfectly acceptable!\
    \ For example, you could use self::staticMethodHere() from a non-static method\
    \ and PHP would be perfectly happy.\n\n# Late Static Binding\n\nLate static binding\
    \ is a feature that was introduced in version 5.3 of PHP. It has a really confusing\
    \ name, so let's demonstrate with code instead. First we need two"
  merge: -1
  img_proc: true
- pgno: 163
  md: "classes, with a touch of inheritance.\n\n# Example 13: Statics with inheritance.\n\
    \n```\n<?php\nclass Panda\n{\n    public static function whoAmI()\n{\n       \
    \ return self::getType();\n    }\n    public static function getType()\n{\n  \
    \      return 'I am a Giant panda!';\n    }\n}\nclass RedPanda extends Panda\n\
    {\n    public static function getType()\n{\n        return 'I am a Red panda!';\n\
    \    }\n}\n```\n\nHere we have two classes. Panda is our base class, and represents\
    \ a giant panda. RedPanda extends Panda, and represents a red panda... duh. The\
    \ base class has a static method called 'getType()', which tells you it's a Giant\
    \ Panda. This method is overriden in the RedPanda class to let you know that it's\
    \ a RedPanda.\n\nWe can use the static whoAmI() method on both classes to find\
    \ out what type of panda we have. We call it now...\n\n# Example 14: Who am I?\n\
    \n```\n<?php\necho Panda::whoAmI() . EOL;\necho RedPanda::whoAmI();\n```\n\nUpon\
    \ running this snippet, we receive the following output."
  merge: -1
  img_proc: true
- pgno: 164
  md: "# Example 15: Output.\n\n```\n1 I am a Giant panda!\n2 I am a Giant panda!\n\
    ```\n\nWait, why are they both Giant pandas?! We've overridden the `getType()`\
    \ method in the RedPanda class, so shouldn't PHP respect the inheritance?\nActually,\
    \ the `self` keyword will only reference the base class. If we wish to use late\
    \ static binding, we need to replace the `self` keyword with `static`. Yes, I\
    \ know... we are sure of using this keyword. Let's take a look at the transformation.\n\
    \n# Example 16: Late static binding.\n\n```\n1 <?php\n2 \n3 class Panda\n4 {\n\
    5     public static function whoAMI()\n6     {\n7         return static::getType();\n\
    8     }\n9 \n10    public static function getType()\n11    {\n12        return\
    \ 'I am a Giant panda';\n13    }\n14 }\n15 \n16 class RedPanda extends Panda\n\
    17 {\n18     public static function getType()\n19     {\n20         return 'I\
    \ am a Red panda';\n21     }\n22 }\n```\n\nYou'll notice that all we've done is\
    \ replaced `self` with `static`. Now let's try executing the code once more."
  merge: -1
  img_proc: true
