- pgno: 183
  md: "# Traits\n\nExample 13: Set our gauntlet.\n\n```\n<?php\n// Define a class\
    \ which extends the baseclass\n// and implements the trait.\nclass Testing extends\
    \ TestClass\n{\n    use TestTrait;\n}\n\n$test = new Testing;\n\nRun the test\
    \ method.\n$test->test();\n```\n\nWe've created a class which extends the TestClass\
    \ and uses the TestTrait. By calling the shared method test(), we can find out\
    \ which one takes priority from the output. Let's give it a go.\n\nExample 14:\
    \ Output.\n\nThis is the trait method.\n\nSometimes, it's better to let the code\
    \ answer our questions, don't you find? As we can see, the method within the trait,\
    \ has taken priority over the method within the inherited class.\n\nThis means\
    \ we can use traits to override the functionality inherited from abstract classes.\
    \ This is useful knowledge to a budding young programmer such as yourself. Use\
    \ it wisely!"
