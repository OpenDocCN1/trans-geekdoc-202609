    \nWe'll start by modifying our previous example.\n\nExample 05: A private property.\n\
    \n```\n<?php\nclass Panda\n{\n    // Declare a private property...\n    private\
    \ $coat = 'fluffy';\n    // ... and a public method.\n    public function getCoat()\n\
