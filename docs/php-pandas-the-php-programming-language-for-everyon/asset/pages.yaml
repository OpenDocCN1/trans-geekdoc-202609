- pgno: 188
  md: '# Example 09: Root namespace prefix.


    ```

    <?php

    namespace Stark;

    // app/routes.php

    $edmure = new \Tully\Edmure();

    ```


    Again, we need the prefixing backward slash to bring us back to the global namespace,
    before instantiating a class from the ‘Tully’ namespace.

    It could get tiring, referring to classes within other namespaces by their full
    hierarchy each time. Luckily, there''s a nice little shortcut we can use. Let''s
    see it in action.


    # Example 10: Create a Tully\Edmure instance.


    ```

    <?php

    namespace Stark;

    use Tully\Edmure;

    // app/routes.php

    $edmure = new Edmure();

    ```


    Using the use statement, we can bring one class from another namespace into the
    current namespace. This will allow us to instantiate it by name only.

    Let me show you another neat trick. We can give our imported classes little nicknames,
    like we used to do in the PHP playground. Let me show you.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Namespaces


    Example 11: Namespace aliasing.


    ```

    <?php

    namespace Stark;

    use Tully\Brynden as Blackfish;

    // app/routes.php

    $Brynden = new Blackfish();

    ```


    By using the ''as'' keyword, we have given our ''Tully\Brynden'' class the ''Blackfish''
    nickname. This will allow us to use the new nickname to identify within the current
    namespace. Neat trick? It''s also really handy if you need to use two similarly
    named classes within the same namespace. For example:


    # Example 12: Similar named classes.


    ```

    <?php

    namespace Targaryen;

    use Dothraki\Daenerys as Khaleesi;

    // app/routes.php

    class Daenerys {

    }

    // Targaryen

    $daenerys = new Daenerys();

    // Dothraki\Daenerys

    $khaleesi = new Khaleesi();

    ```


    By giving the ''Daenerys'' within the ''Dothraki'' namespace a nickname of ''Khaleesi'',
    we are able to use two ''Daenerys'' classes by name only. Handy right? The game
    is all about avoiding conflicts, and grouping them by purpose or faction.


    You can use as many classes as you need to.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Namespaces


    Example 13: Use multiple classes.


    ```

    <?php

    namespace Targaryen;

    \use Dothraki\Daenerys;

    use Stark\Eddard;

    use Lannister\Tyrion;

    use Snow\Jon as Bastard;

    ```


    # Structure


    Namespaces aren''t just about avoiding conflicts. We can also use them for organisation,
    and for ownership. Let me explain with another example.


    Let''s say I want to create an open source library. I''d love for others to use
    my code. It would be great! The trouble is, I don''t want to cause any problematic
    name conflicts for the person using my code. That would be terribly inconvenient.
    Here''s how I can avoid causing hassle for the wonderful, open source embracing,
    individual.


    Example 14: Namespace structure.


    ```

    Dayle\Blog\Content\Post

    Dayle\Blog\Content\Page

    Dayle\Blog\Tag

    ```


    Here we have used my name to show that I created the original code, and to separate
    my code from that of the person using my library. Inside the base namespace, I
    have created a number of sub-namespaces to organise my application by its internal
    structure.


    # Limitations


    In truth, I feel a little guilty for calling this sub-heading ‘Limitations’. What
    I''m about to talk about is isn''t really a bug.


    You see, in other languages, namespaces are implemented in a similar way, and
    those other languages provide an additional feature when interacting with namespaces.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Namespaces


    In Java for example, you are able to import a number of classes into the current
    namespace by using the import statement with a wildcard. In Java, ''import'' is
    equivalent to ''use'', and it uses dots to separate the nested namespaces (or
    packages). Here''s an example.


    Example 15: Java namespace importing.


    ```

    import dayle.blog.*;

    ```


    This would import all of the classes that are located within the ''dayle.blog''
    package. In PHP you can''t do that. You have to import each class individually.
    Sorry. Actually, why am I saying sorry? Go and complain to the PHP internals team
    instead, go gentle. They have given us a lot of cool stuff recently.


    Here''s a neat trick you can use. Imagine that we have this namespace class structure,
    as in the previous example.


    Example 16: Example structure.


    +   1 Day\Blog\Content\Page

    2 Day\Blog\Content\Page

    3 Day\Blog\Tag


    We can give a sub-namespace nickname, to use its child classes. Here''s an example:


    Example 17: Namespace aliasing for relative access.


    ```

    <?php

    namespace Baratheon;

    use Dayle\Blog as Cms;

    // app/routes.php

    $post = new Cms\Content\Post;

    $page = new Cms\Content\Page;

    $tag = new Cms\Tag;

    ```


    This should prove useful if you need to use many classes within the same namespace.'
