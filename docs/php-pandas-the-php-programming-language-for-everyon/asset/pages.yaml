    Let''s craft a different example. We''ll show the state of a value before the
    operator is used. We will examine the result of the statement when the operation
    is used, and finally, we examine the value after the operator is used. We don''t
    expect the after-value to be any different.


    # Example 21: The stages of -


    ```

    <?php

    // Set a value.

    $panda = 3;


    // Dump BEFORE.

    var_dump($panda);


    // Dump DURING.

    var_dump(--$panda);


    // Dump AFTER.

    var_dump($panda);

    ```


    Let''s execute the code. What are the three values we receive?'
