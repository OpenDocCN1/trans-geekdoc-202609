- pgno: 102
  md: '# Example 03: Including a file.


    ```

    <?php

    include ''welcome.php'';

    echo welcome(''Tamas'');

    ```


    We use include() to include the welcome.php file. It''s PHP copying and pasting
    the code in welcome.php to where we''ve put the include statement. We can now
    use the welcome() function like before.


    The include statement is followed by the path to the file that we want to include.
    This path is relative to the file that you execute with the php command. If our
    welcome.php file was located in a subfolder, then we could use slashes / like
    we would in a unix filesystem to denote its location.


    # Example 04: Including within subdirectories.


    ```

    <?php

    include ''foo/bar/baz/welcome.php'';

    ```


    You can use as many includes as you like! Go ahead and modularise your code into
    re-usable files. You can also include from your included files. Kind of that dream
    movie.


    > You can use the __DIR__ constant to refer to the directory that the current
    file is in. This can be useful when include()ing other files!


    # Require


    If you try to include a file that doesn''t exist, then PHP will show a warning
    message, and continue executing. If this is a problem in our applications, we
    can use the require statement instead of the include to have PHP throw a fatal
    error when the file cannot be loaded.


    The syntax is exactly the same as the include statement. Let''s load an imaginary
    file.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Example 05: Requiring a file.


    ```

    <?php

    require ''foo.php'';

    ```


    Let''s see what PHP has to say about the imaginary foo.php file, shall we?


    # Example 06: Output.


    ```

    Fatal error: require(): Failed opening required ''foo.php''

    ```


    Great! That''s going to put an end to that program. Come back when the file exists,
    you crazy loon!


    # Require Once


    What would happen if we were to include the welcome.php file twice? You know,
    the one with the welcome() function inside? Let''s find out, shall we?


    It''s going to look a litle like this:


    # Example 07: Requiring a file twice.


    ```

    <?php

    require ''welcome.php'';

    require ''welcome.php'';

    echo welcome(''Alastair'');

    ```


    Let''s go ahead and execute the code.


    # Example 08: Output.


    ```

    Fatal error: Cannot redeclare welcome() (previously declared)...

    ```


    Uh oh! What''s going on here? The problem is that you can''t define two functions
    with the same name. They collide, and you get this error. You can''t re-declare
    the welcome() function.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Includes


    So why do we have two functions anyway? Well we''re requiring welcome.php twice.
    So we''re loading the welcome() function twice. How do we get around this problem?
    What if we forget that we''ve already required the file, and then require it again
    later in the application? This can happen easily if you''re using files that include
    other files.


    Hey, how about that subchapter title? That might help us, right? I mean, it normally
    does. Take a look at this snippet.


    # Example 09: Requiring a file only once


    ```

    php

    require_once ''welcome.php'';

    require_once ''welcome.php'';

    echo welcome(''Alastair'');

    ```


    We''ve done here, is replaced the word require with require_once. What''s the
    effect? Well let''s execute our program and find out.


    # Example 10: Output.


    ```

    Welcome, Alastair!

    ```


    Hurray! It works. You see, the require_once statement will only include a file
    once. The second time the statement is executed, the file is ignored, and the
    welcome() function collision is avoided.


    When including PHP code into your application, be sure to consider the effects
    of including the file twice. Decide whether require OR require_once is more appropriate.


    Well thats another short chapter read! Don''t worry, the next one''s going to
    be a fair bit longer, but extremely exciting!'
  merge: -1
  img_proc: true
