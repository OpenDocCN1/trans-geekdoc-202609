  md: '# 20. Abstracts


    In a previous chapter, we learned how we could use inheritance to share common
    properties and methods between our classes, effectively creating a template. We''re
    going to build on our previous knowledge within this chapter. Excited? Then let''s
    jump right in.


    # Abstract Classes


    For some classes, their sole purpose is to provide common properties and methods.
    They live for it. When they go to sleep at night, they dream of it.


    They''ll never be instantiated, because they make no sense on their own. Consider
    the following classes, that I''ve left empty for clarity.


    Example 01: Class inheritance.


    While the Animal class might provide lots of shared features to the Panda, Owl
    and Giraffe classes, it doesn''t make sense to instantiate it directly. Our Animal
    class is a prime example of an abstract class. Let''s go ahead and make it one.'
  merge: -1
  img_proc: true
- pgno: 146
  md: "# Abstracts\n\n# Example 02: Abstract class Animal.\n\n```\n```php\n<?php\n\
    abstract class Animal {\n    /**\n     * * Is the animal awesome (all are).\n\
    \     * @var boolean\n     */\n    private $awesome = true;\n\n    /**\n     *\
    \ Access the awesome attribute.\n     * @return boolean\n     */\n    public function\
    \ isAwesome() {\n        return $this->awesome;\n    }\n}\n```\n```\n\nIn the\
    \ above example, we've declared our class as abstract, simply by starting the\
    \ class definition with the keyword abstract. Everything else should feel familiar.\
    \ If we were to extend this class, all of our animals would inherit the isAwesome()\
    \ method.\n\nLet's try to instantiate the Animal class directly.\n\n# Example\
    \ 03: Create a new Animal instance.\n\n```\n```$animal = new Animal();\n```\n\n\
    What happens when we execute the code?\n\n# Example 04: Output.\n\nFatal error:\
    \ Cannot instantiate abstract class Animal in <file> on line <line>.\n\nNow that\
    \ our class is marked as abstract, it can no longer be instantiated. This is desirable,\
    \ since the class has only a single purpose, to provide functionality to other\
    \ classes."
  merge: -1
  img_proc: true
- pgno: 147
  md: "# Abstract Methods\n\nAbstract methods are used within abstract classes. Once\
    \ again, the keyword-abstract is used to define an abstract method. Let's lead\
    \ with an example.\n\nExample 05: An abstract method.\n\n```\n<?php\nabstract\
    \ class Animal\n{\n    abstract public function makeNoise();\n}\n```\n\nWe, have\
    \ defined a new method called makeNoise() using the abstract keyword before the\
    \ scope. You'll notice that the makeNoise() method has no body, instead it's simply\
    \ terminated with a semi ; colon.\n\nWhat a pointless method!\n\nYou're quite\
    \ right. On it's, it is quite pointless. In fact, an abstract method can't even\
    \ be called. So why bother with it? Well see, the abstract method forms a type\
    \ of 'contract' with all classes that extend it. It's telling PHP “Any classes\
    \ which extend this one, MUST define a makeNoise() method.\\nLet's demonstrate\
    \ this by adding another class.\n\nExample 06: Extend the Animal class.\n\n```\n\
    <?php\nabstract class Animal\n{\n    abstract public function makeNoise();\n}\n\
    class Dog extends Animal\n{\n}\n```\n\nWe've extended the base Animal class within\
    \ our Dog class. Let's try to instantiate a new Dog, shall we?"
  merge: -1
  img_proc: true
- pgno: 148
  md: "# Abstracts\n\n# Example 07: Create a new dog instance.\n\n```\n$dog = new\
    \ Dog;\n```\n\nNow we'll simply execute the code and... oh no.\n\n# Example 08:\
    \ Output.\n\n```\nPHP Fatal error: Class Dog contains 1 abstract method and must\
    \ therefore be dec\\nlared abstract or implement the remaining methods (Animal::makeNoise)\
    \ in <file> \\non <line>.\n```\n\nFortunately, I've always found PHP errors to\
    \ be easy to understand. PHP is telling us that our Dog class contains an abstract\
    \ method from the Animal base class called Animal::makeNoise.\n\nPHP has given\
    \ two options. Firstly, we could make the Dog class an abstract class too, which\
    \ would mean that we couldn't instantiate it, but it could be extended. Our second,\
    \ and more appropriate option is to implement the makeNoise() method on the Dog\
    \ class.\n\nUsing the second option, would fulfil the 'contract' that our abstract\
    \ class defines. Let's do that.\n\n# Example 09: Implement the makeNoise() method.\n\
    \n```\n<?php\nclass Dog extends Animal\n{\n    public function makeNoise()\n{\n\
    \        echo 'Woof!';\n    }\n}\n```\n\nAs you can see, we don't put the abstract\
    \ keyword in this time. This is because we're implementing the method, and we\
    \ want it to be callable. When implementing an abstract method, it's important\
    \ to note that the method signature (scope, name and parameters) must be identical\
    \ to that of the abstract method.\n\nNow that we've implemented makeNoise() method,\
    \ our Dog class can finally be instantiated."
  merge: -1
