    4 $pandas = 0;

    5

    6 // Iterate...

    7 do {

    8

    9 // Output the number of panda butlers.

    10 echo "We have {$pandas} panda butlers!\n";n11

    12

    13 // Increment the counter.

    14 $pandas++;

    15

    16 // ... while $pandas less than 50.

    17 } while ($pandas < 50);

    ```'
