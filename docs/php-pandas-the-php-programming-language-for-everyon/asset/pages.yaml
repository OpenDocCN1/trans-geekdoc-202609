  md: '# Example 16: The self reference.


    ```

    return $diameter * self::PI;

    ```


    ... we could have also accessed the PI constant using the class definition itself...


    # Example 17: Accessing through class definition.


    ```

    return $diameter * Circle::PI;

    ```


    ... and the code would execute as expected.

    However, if we later decide to rename the Circle class, we''d also have to replace
    all constant accessors within the class to match. For this reason, using self
    to address the current class definition is far more convenient.


    > When defining variables, always take a moment to think about their purpose,
    and whether their value is needed/likely to change. Use constants where appropriate
    to protect the functionality of your code.'
