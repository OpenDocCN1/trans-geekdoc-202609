  md: '# Example 06: Harder math.


    ```

    <?php

    echo 4 + 3 * 2 / 1;

    ```


    So, what''s the result? Well it can be difficult to calculate in our heads because
    we don''t know which order to process the pairs of calculations. Should we add
    3 to 2 first? Or maybe divide 2 by 1 first. Hmmm. Tricky!


    Of course, in mathematics we learn to use rounded brackets to separate the concerns
    of an equation. We can do the same with PHP. Let''s give it to a go.


    # Example 07: Brackets for separation of concerns.


    ```

    <?php

    echo (4 + 3) * (2 / 1);

    ```


    Now we can be sure that 4 + 3 and 2 / 1 are evaluated first, and the resulting
    values are multiplied. Great, we run our script and get the result...


    # Example 08: Output.


    ```

    14

    ```


    Awesome, but isn''t that cheating? What would we get without the brackets? Let''s
    take them out again.


    # Example 09: Without brackets.


    ```

    <?php

    echo 4 + 3 * 2 / 1;

    ```


    So what''s the result? Let''s run our script.


    # Example 10: Output.


    ```

    10

    ```


    That''s a totally different figure. Why is that? Well, it''s because PHP isn''t
    handling our operators in the same order. Let''s take a little time to learn about
    the order of our operators.


    Here''s how PHP handles the order of operators.'
