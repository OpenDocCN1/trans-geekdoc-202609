    \ 02: Here it is again.\n\n```\n<?php\n\nfunction welcome($name) {\n    return\
    \ \"Welcome, {$name}!\";\n}\n```\n\nNow then, let's create a new file, called\
    \ program.php. We'll place this file next to the welcome.php file. We want to\
