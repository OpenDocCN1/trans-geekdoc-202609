  md: '# 16. Classes


    Well, now we''re really cooking with fire. We get to learn about classes!


    Classes give our applications structure. They allow for object-oriented programming.
    You''ve probably heard of that term before? It means treating our code as objects,
    bringing familiarity to how we use objects in the real world. Let''s stick with
    the baby steps, though, shall we?


    # First Class


    So how do we create a class? Let''s take a look at some code. First we''re going
    to need a purpose for our class. We get started with object-oriented programming,
    and create a class that will represent a book. We''ll call the class Book.


    Example 01: Creating a class.


    ```

    <?php

    class Book{

    n}

    ```


    The syntax for a class, is fairly similar to that of a function. You may have
    already spotted the block surrounded by { } braces. On the first line we have
    the keyword class and the name of the class that we want to create.


    It''s good practice to name your classes with an uppercase letter at the beginning.
    It''s also good practice to have a separate file for your class, with a similar
    name. For example, the class above would be contained in a file called Book .php.


    For the purpose of simplifying the examples of the book. We will be keeping classes
    in the same file for now.


    We can''t really do much with the class as it stands, let''s give it some properties.
    Properties are used to store data within the class. For our book, they''ll be
    used to further describe the book.


    Let''s think about the properties of a book for a moment. I can think of several.'
