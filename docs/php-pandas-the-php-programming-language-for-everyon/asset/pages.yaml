  md: "# Interfaces\n\n# 141\n\n```\npublic function poop();\n\n/**\n * Sleepy time!\n\
    \ */\npublic function sleep($time);\n}\n```\n\nWe define interfaces using the\
    \ interface keyword. As you can see, we don't use class at this time. Like abstract\
