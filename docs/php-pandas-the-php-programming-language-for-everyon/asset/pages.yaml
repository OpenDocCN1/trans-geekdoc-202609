    / Division

    % Modulus


    Now, I''m sure you''ll have seen some of these operators before. I know that multiplication
    and division look a little different to the signs that you may have learned about
    school. It''s common to most programming languages, and you''ll find that the
    division sign is definitely easier to type on a keyboard. Don''t let them worry
    you, before too long you''ll be completely used to them.


    If you''ve not used the ''Modulus'' operator before, then it''s simple to explain.
    It can be used to calculate the remainder of a division. For example, the operation
    ''3 % 2'' would result in the figure ''1''. It''s commonly used to determine whether
