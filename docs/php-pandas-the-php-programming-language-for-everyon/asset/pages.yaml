  md: "# 17. Inheritance\n\nWhen a mommy panda and a daddy panda love each other very\
    \ much, they might decide to have baby pandas together. Of course, I'm not talking\
    \ about those lazy black and white pandas. They aren't parentally motivated. I\
    \ mean the beautiful red ones.\n\nThe baby pandas will likely share a number of\
    \ properties with their parents. Not only their bright fluffy coat, but also their\
    \ eating habits, sleeping patterns, and general personality. They inherit these\
    \ properties from their parents.\n\nIf I wanted a biology lesson, I'd have bought\
    \ a biology book.\n\nWell look at you! Aren't you a little antsy today?\n\nWell,\
    \ as it happens, pandas aren't the only things that inherit properties. You see,\
    \ classes can also have parents. I'm not entirely sure how the breeding takes\
    \ place, but I can certainly teach you about the result.\n\nLet's take a look\
    \ at a simple class.\n\nExample 01: A simple class!\n\n```\n<?php\nclass Panda\n\
    {\n    // Properties\n    var $coat = 'fluffy';\n    var $colour;\n\n    // Method\n\
    \    function getCoat()\n{\n        return $this->coat;\n    }\n\n    // Method\n\
    \    function getColour()\n{\n        return $this->colour;\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 123
  md: "# Inheritance\n\n19 }\n20 }\n\nHere's our simple class. It's got two properties,\
    \ $coat and $color. We've also got class methods called getCoat() and getColour(),\
    \ which simply return our property values. It doesn't get more simple, does it?\
    \ You've got this buddy!\n\nLet's push our comfort zones. Let's do something new.\n\
    \nExample 02: Extending a class.\n\n```\n<?php\nclass Panda {\n    // Properties\n\
    \    var $coat = 'fluffy';\n    var $colour;\n\n    // Method\n    function getCoat()\
    \ {\n        return $this->coat;\n    }\n\n    // Method\n    function getColour()\
    \ {\n        return $this->colour;\n    }\n}\n\nclass GiantPanda extends Panda\
    \ {\n    // DUN DUN DUUUUUUN!\n}\n```\n\nHurray! There's some new syntax. That\
    \ means we're about to add a new tool to our arsenal!\n\nWhat's this extends keyword\
    \ doing? We're actually telling PHP that the GiantPanda class should inherit from\
    \ the Panda class. You could say that the GiantPanda class is going to borrow\
    \ genetic material from the Panda. This means that GiantPanda gains access to\
    \ all of the properties and methods from Panda."
