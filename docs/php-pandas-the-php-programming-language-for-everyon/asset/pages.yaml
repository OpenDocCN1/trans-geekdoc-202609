    Trust me, I tried it. A portal opened to a dark underworld, half dinosaur, half
    human creatures broke through and began to terrorise Cardiff. With the aid of
    a home made flamethrower (powered by PHP) I was able to fend off the vicious creatures.
    I''d hate to see it happen to you. Be careful!


    Next up, we have the incremental operator. Actually, let''s not forget the decre
    operator too. She tends to get a little less attention. In fact, let''s showcase
    her.


    I prefer to lead with an example. Consider the following snippet:


    Example 17: – After.


    ```

    <?php

    // Set a value.

    $panda = 3;

    // Decrease the value.

    $panda--;

    // Dump the value.

    var_dump($panda);

    ```


    In the middle, do you see her? The beautiful decremental operator. We simply place
    two minus signs after the variable. What does it do? Well, here''s the result
    of the code snippet.


    Example 18: Output.


    ```

    int(2)

    ```


    As we can see, the value of $panda has been decreased by one. It''s a quick shortcut
    to decreasing a value. Likewise, using a ++ can be used to increase a value. Those
    are the only two operators that work, though. Don''t be cheeky and try to use
    the multiplication operator. It just''t work as you expect it to!


    I wonder what will happen if we put the operator before the value? Let''s have
    a go, shall?'
