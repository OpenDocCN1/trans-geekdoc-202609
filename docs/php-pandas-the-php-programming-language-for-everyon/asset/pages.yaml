  md: "# Traits\n\n```\n* @var string\n*/\nprivate $name = 'Jasmina';\n}\n```\n\n\
    Use traits to enhance the functionality of your classes. Of course, you can only\
    \ use them on PHP version 5.4 or higher, so keep that in mind.\n\n# Priority\n\
    \nNow that you've learned about inheritance and traits, you might be asking yourself\
    \ a very fair question. What happens if we extend a class, and use a trait that\
    \ both have a method of the same name.\n\nThe best way to demonstrate this, is\
    \ by testing it out. Consider the following code sample.\n\nExample 12: Create\
    \ test classes and traits.\n\n```\n<?php\ntrait TestTrait\n{\n    public function\
    \ test()\n{\n        echo 'This is the trait method.';\n    }\n}\nclass TestClass\n\
    {\n    public function test()\n{\n        echo 'This is the class method.';\n\
    \    }\n}\n```\n\nHere we have a TestTrait and a TestClass. They both have a method\
    \ method called test(), which indicates the source of the method call.\n\nIt's\
    \ time to set up our test-case."
