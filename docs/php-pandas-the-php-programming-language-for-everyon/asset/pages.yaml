- pgno: 90
  md: "# Functions\n\n9\n// Dump the result of the function.\nvar_dump(getMeaningOfLife());\n\
    \nThis time we're deumping the result of the function directly, instead of assigning\
    \ it to. There's one final thing that we need to keep in mind when using the return\
    \ keyword. As soon as PHP comes across our return line, it will exit the function,\
    \ returning the value. For example, consider the following code sample.\n\n# Example\
    \ 12: Return terminates a function.\n\n```\n<php\n// Create a function.\nfunction\
    \ getMeaningOfLife() {\n    return 42;\n    echo 'Here I am, rock you like a hurricane!';\n\
    }\n\n// Dump the result of the function.\nvar_dump(getMeaningOfLife());\n```\n\
    \nIn the above, when the function getMeaningOfLife() is executed, it will return\
    \ the value 42, but the echo statement will not be executed.\nIt's worth noting\
    \ that you can use return without a value to end a function before it's natural\
    \ exit point. Doing this is the same as returning null. Here's an example.\n\n\
    # Example 13: Empty return statement.\n\n```\n<php\nfunction getMeaningOfLife()\
    \ {\n    return;\n    echo 'This line will never be executed!';\n}\n```\n\n# Parameters\n\
    \nSome machines take input. For example, a 3D printer takes plastic and a blueprint.\
    \ An espresso machine will take one of those coffee pods and some water.\nFunctions\
    \ can also take input. We call these arguments or parameters; they may up part\
    \ of the method signature, or the description of how the function works. Let's\
    \ take a look at a simple function parameter."
  merge: -1
  img_proc: true
- pgno: 91
  md: "# Example 14: Function parameters.\n\n```\n<?php\n// Welcome someone!\nfunction\
    \ welcome($name) {\n    echo \"Welcome to PHP Pandas, {$name}!\";\n}\n```\n\n\
    Between the rounded brackets within our function signature, just after the function\
    \ name, we have our single parameter. We're calling it $name. These parameters\
    \ are placeholders for values we will be giving to the function when we use it.\
    \ This is what makes the function dynamic.\n\nThe parameters that are given to\
    \ the function are available for use within the function block. In the above example,\
    \ we use the $name parameter handled to the function, and echo a welcome statement\
    \ using the provided name.\n\nOf course, this snippet of code won't do anything\
    \ unless we tell PHP to execute, or 'call', the function. Let's add the call line\
    \ to our snippet.\n\n# Example 15: Passing parameters to functions.\n\n```\n<?php\n\
    // Welcome someone!\nfunction welcome($name) {\n    echo \"Welcome to PHP Pandas,\
    \ {$name}!\";\n}\n\n// Call the function\nwelcome('reader');\n```\n\nWe call the\
    \ method using its name and rounded brackets. However, this time we provide a\
    \ string value reader within the brackets as our parameter. This means that the\
    \ $name parameter of our function will be set to reader. It will only be set to\
    \ this value for this one execution, and any later calls to the function will\
    \ be replaced by whichever parameter value we provide to it. Our function doesn't\
    \ have any state.\n\nLet's take a look at the result that we see in our terminal,\
    \ shall we?"
  merge: -1
  img_proc: true
