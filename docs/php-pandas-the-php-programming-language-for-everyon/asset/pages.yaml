- pgno: 45
  md: '# Example 09: Output.


    string(16) "Value of: 27.325"


    Just as we expected! The float value has been converted to a string, and stuck
    to the end of the other value. The same would happen for all basic data types.


    I''ve got a question. Actually, I know the answer... it''s just that sometimes
    I find asking questions is a great way to get that brain of yours ticking!


    Why can''t we use the addition operator to concatenate strings? I mean, we''re
    just adding two strings together, aren''t we?


    In other languages, for example, you can use + to concatenate strings. In fact,
    it''s the most accepted way to do so. In PHP, the addition operator is purely
    mathematical. Let''s see what happens if we attempt to perform addition on two
    strings.


    # Example 10: Addition on strings.


    ```

    <?php

    // First value.

    $first = ''Pandas '';

    // Second value.

    $second = ''awesome!'';

    // Concatenate.

    var_dump($first + $second);

    ```


    What''s the result? It''s *nothing* impressive!


    # Example 11: Output.


    ```

    int(@)

    ```


    PHP understands that our strings are complicated, and so, it treats them as the
    integer value of zero. Two zeroes equal zero.


    If our strings represented real numbers in string format, then PHP would be able
    to do something a little more sensible with them. Let''s try it!'
