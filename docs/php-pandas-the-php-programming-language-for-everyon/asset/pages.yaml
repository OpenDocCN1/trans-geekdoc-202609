- pgno: 80
  md: "# Example 10: The syntax.\n\n```\n<?php\nfor (_BEFORE; _CONDITION; _AFTER_EACH_)\n\
    ```\n\nThe first section is executed before every time the loop is executed. The\
    \ second statement, or the condition, is evaluated every time the loop is executed.\
    \ Finally, the third statement is executed after each loop iteration.\n\nAs you\
    \ can see from the fewer amount of lines in the example, a for loop is a great\
    \ way of implementing a loop when some form of counter is involved.\n\n> Don't\
    \ forget! You're not limited to purely incrementing counters. You could increase\
    \ the counter by a greater amount for a larger step, or even multiply it!\n\n\
    # Foreach\n\nForeach loops are useful when used in combination with iterable types\
    \ such as arrays. The number of iterations of this loop is determined by the number\
    \ of items within our array. Let's take a look at an example.\n\n# Example 11:\
    \ The foreach loop.\n\n```\n<?php\n// Create an array of pandas.\n$pandas = ['Lushui',\
    \ 'Pali', 'Jasmina'];\n\n// Iterate our panda array.\nforeach ($pandas as $panda)\
    \ {\n    echo \"Hello there {$panda}!\\n\";n}\n```\n\nWe've created a small array\
    \ of pandas. We're masters of arrays already, aren't we? This is no problem for\
    \ us at all. Let's focus on the next line instead."
  merge: -1
  img_proc: true
- pgno: 81
  md: "# Example 12: Iterating an array.\n\n```\n<?php\nforeach ($phpas as $panda)\n\
    ```\n\nThe loop starts with a foreach keyword. Sorry, spoiler alert! Am I right?\
    \ Next we have a set of ( rounded ) brackets. Within the brackets we have two\
    \ variables separated by the keyword as. We're telling PHP to loop through all\
    \ of the elements in the array, and for each iteration $panda to the current array\
    \ element.\n\nThe final part of the loop is of course the code block within curly\
    \ brackets. We're more than familiar with these code blocks by now. They contain\
    \ the code that is executed with iteration of the loop.\n\nFor the first iteration\
    \ of our loop $panda will be set to 'Lushui', for the next iteration $panda will\
    \ be set to 'Pali', and for the final iteration $panda will be set to 'Jasmina'.\n\
    \nThis is my most used loop. I say I use it roughly 23,543 times a day. Something\
    \ like that! It's because I enjoy working with arrays.\n\nIn a previous chapter,\
    \ we discovered how to provide our own keys for arrays. You might want access\
    \ to the array key, as well as its value within your loop. Well don't worry buddy!\
    \ PHP can do that for you. Let's take a look at the syntax.\n\n# Example 13: foreach\
    \ loop with keys.\n\n```\n<?php\n// Create an array of pandas.\n$pandas = [\n\
    \    'first' => 'Lushui',\n    'second' => 'Pali',\n    'third' => 'Jasmina'\n\
    ];\n\n// Iterate over our array.\nforeach ($pandas as $position => $panda) {\n\
    \    echo \"You're the {$position} panda, {$panda}!\\n\"\n}\n```\n\nThis time,\
    \ we have an array with custom keys. We're using strings for both keys and values,\
    \ but they could be anything. Instead of simply assigning a new variable for each\
    \ loop iteration, we provide a temporary key and value placeholder separated by\
    \ a => symbol.\n\nLet's take a look at the values of both variables with each\
    \ loop iteration."
  merge: -1
  img_proc: true
- pgno: 82
  md: "# Loops\n\n+   - First Iteration ($position = 'first') ($panda = 'Lushui')\n\
    - Second Iteration ($position = 'second') ($panda = 'Pali')\n- Third Iteration\
    \ ($position = 'third') ($panda = 'Jasmina')\n\nWe can use these temporary variables\
    \ to accomplish any of our sick little master plans.\nWe are completely at our\
    \ disposal.\n\nIt's worth noting that a copy of your array elements are passed\
    \ into the foreach loop block. This means that any changes to the variable within\
    \ the loop, will not be reflected once the loop has completed.\n\n> If you'd like\
    \ to change the value of the element during the foreach loop, simply use the key\
    \ => value format, and access the property by key through the original array.\
    \ For example $pandas[$position] = 'Foo';-\n\nThis was the final loop that I have\
    \ to share in this chapter, but before we call it quits, let's take a look at\
    \ some of the control keywords available to us for within our loops.\n\n# Control\n\
    \nIn the forks chapter, we discovered how to use break to exit out of a fork and\
    \ continue with the execution of our code. We can also use break inside a loop\
    \ to exit out and continue processing our application. It's a handy statement\
    \ like that. Here's a quick example.\n\nExample 14: Breaking a loop.\n\n```\n\
    <?php\n// Create an array of pandas.\n$pandas = [\n  'first' => 'Lushui',\n  'second'\
    \ => 'Pali',\n  'third' => 'Jasmina'\n];\n// Iterate our pandas array.\nforeach\
    \ ($pandas as $position => $pandas) {\n  echo \"You're the {$position} panda,\
    \ {$pandas}!\\n\";\n  break;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: "This loop will only output for the first iteration of the loop. As soon as\
    \ PHP reaches the break statement, it will exit the loop and continue processing\
    \ the application.\n\nThe next continue statement is continue. Using continue\
    \ in the code block will instruct PHP to complete the current iteration at that\
    \ point, and continue to the next iteration. It's useful for 'skipping' loop iterations.\n\
    \nLet's take a look at an example. Why don't we throw an if statement into the\
    \ mix? We're a master of those now, aren't we?\n\n# Example 15: Continuing iteration.\n\
    \n```\n```php\n// Create an array of pandas.\n$pandas = [\n    'first' => 'Lushui',\n\
    \    'second' => 'Pali',\n    'third' => 'Jasmina'\n];\n\n// Iterate over panda\
    \ array.\nforeach ($pandas as $position => $panda) {\n    if ($position == 'second')\
    \ {\n        // Break the iteration.\n        continue;\n    }\n    // Output.\n\
    \    echo \"You are the {$position} panda, {$panda}!\\n\";\n}\n```\n```\n\nTake\
    \ a look inside the loop block. We have an if statement that will continue to\
    \ the next iteration if the $position temporary array key variable is equal to\
    \ the string 'second'. Let's take a look at the result, shall we?"
  merge: -1
  img_proc: true
