  md: "# Traits\n\nExample 02: An abstract class.\n\n```\n<?php\nabstract class Animal\n\
    {\n}\n```\n\nOur class called Animal is an abstract one. This means that it's\
    \ meant to be extended by our classes that represent actual animals.\n\nConsider\
    \ the possibility that we'd like to add a stroke() method. For example, we'd like\
    \ to stroke() our red pandas to make them purr. We could add something like the\
    \ following.\n\nExample 03: The stroke method.\n\n```\n<?php\nabstract class Animal\n\
    {\n    /**\n     * Stroke the animal.\n     * @return void\n     */\n    public\
    \ function stroke()\n    {\n        echo 'This animal purrs contentedly.';\n \
    \   }\n}\n```\n\nSure! That would work, right? The trouble is, you wouldn't stroke\
