- pgno: 17
  md: '# 3. Finding Answers


    I know. That''s a kinda fluffy title isn''t it? You''re going to have to trust
    me when I say that this is important stuff. This chapter is about your confidence
    as an up and coming developer. Learning is hard, but don''t worry; I''m going
    to help you through this.


    # Developers are robots.


    Why did you decide to pursue development? No, wait! Let me guess. You saw a rockstar
    PHP developer swagger out of a Limousine into one of New York''s hottest night
    spots, order 5 bottles of Cristal with Jay-Z and the ghost of Tupac.


    It''s true, a developer life is a glamorous one. I have to write these chapters
    within my 5 hours of sobriety a day. You''ve probably seen a developer writing
    some code and thought...


    > Oh, man, that dev must be a robot. They know all of those code words and functions
    and how they all work.


    When people without development experience developers assume they are geniuses
    with mathematics honour degree. Perhaps this is true for some developers, but
    it''s certainly not true for me. I''d like to think that other developers would
    agree.


    The truth is, we''re not perfect. We''re not even close to perfect. If you think
    developers know all of these PHP functions and snippets from memory you are fooling
    yourself thinking that you will never have the capacity to keep up.


    It''s just not true. We don''t memorise everything. In fact, a majority of the
    code we use every day is from reference. We are google warriors. There are functions
    in PHP that do the simplest things to lines of text, and I look at the PHP documentation
    almost every week to find the order of the parameters that I pass into them.


    When I''m completely stuck I''ll try using Google to see if another developer
    has found a similar challenge. Often I''ll find a suitable solution that another
    developer has discovered, or enough information to point me to a solution. Of
    course'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'works both ways, I''ll try and give my solutions back to the community. I''ll
    post an-swers on Stack Overflow and I''ll contribute to forums or discussions.
    It''s important to give back to the community.


    So you see, we aren''t robots. We don''t know everything about the language, and
    we don''t have a solution to every problem. However, we are fantastic researchers.
    We are opportunists. We are resourceful problem solvers. We are developers.


    # The art of Googling


    When people tell you to Google something, it''s easy to take it as an insult.
    Or perhaps sarcasm? It''s not. Google is our homepage for a good reason. Let''s
    learn how we can find answers to common development issues.


    We''re writing a program, and somewhere we need to reverse a sentence so that
    ''Pandas rules!'' becomes ''lear sadna''. We have no idea how to approach this
    task. We''re just started with PHP.


    We know that in PHP a sequence of text is called a ''string''. We know this because
    we didn''t give up on this crazy book with the Panda examples, and we discovered
    this fact in a later chapter. Right?


    So know what we want to do. We would like to reverse a string. Let''s construct
    a search query for google.


    ```

    reverse string

    ```


    Nope, wait! The problem here is that there are thousands of programming lan-gauges.
    Seriously, computers have been around for a while!


    If we search for ''reverse string'' then we''re going to get answers for C++,
    ASP.NET,,, it. Our focus is on PHP. We don''t care about these other languages.
    We''ll have time to play with them later when we become PHP masterinds. Let''s
    fix this problem by adding the language to the search query.


    ```

