  md: '# There’s methods to the madness.


    It''s time to start using methods. Methods are what we call functions that belong
    to classes. Let''s examine these wording differences one more, shall we?


    | General | Class |

    | --- | --- |

    | Variable Function | Property / Attribute Method


    When you''re looking for help, knowing the distinction between a function and
    a method will make it much simple to communicate with other developers. It''s
    worth taking the time now to learn these names.


    How do we define a method on our class? Well it''s simple. In fact, you already
    know the format! Let''s create a simple function to say hello.


    Example 14: Creating class methods.


    ```

    <?php

    // Define the Book class.

    class Book {

    // Declare properties.

    var $title;

    var $author;

    var $publisher;


    // Declare a method.

    function sayHello() {

    return ''Hello!'';

    }

    }

    // Create a new book instance.

    $book = new Book();

    // Change the value of format.

    $book->format = ''Hardback'';

    // Execute the hello method.

    echo $book->sayHello();

    ```'
