- pgno: 93
  md: "# Functions\n\n83\n\n# Example 19: Multiple parameters.\n\n```\n<?php\n// Sum\
    \ some values.\nfunction addify($first, $second, $third, $fourth, $fifth) {\n\
    \    return $first + $second + $third + $fourth + $fifth;\n}\n\n// Call the addify.\n\
    echo addify(1, 1, 2, 3, 5);\n```\n\nWe've written a function that will take 5\
    \ values as parameters, and return the sum of them. With our addify() function,\
    \ the order doesn't matter, but it's worth noting that the order that you provide\
    \ your parameters matches up to the placeholders in the signature. In the above\
    \ example, the value of $first will be 1, and the value of $fifth will be 5.\n\
    \nFive parameters are great, but it feels like there shouldn't be a limit on a\
    \ function like addify(). We should be able to sum as many parameters as we like.\
    \ I just got an idea! Let's use func_get_args(). This is a special PHP function\
    \ that will return an array of all the values that have been passed as parameters\
    \ to our function. What's better, is that we don't need to define any parameters\
    \ at all to work. Here's an example.\n\n# Example 20: Infinite parameters.\n\n\
    ```\n<?php\nfunction welcome() {\n    // Get all function parameters.\n    $names\
    \ = func_get_args();\n\n    // Iterate the names and welcome them.\n    foreach\
    \ ($names as $name) {\n        echo \"Welcome, $name!\\n\"\n    }\n}\n```\n\n\
    Here've used another function called func_get_args() within our own function.\
    \ That's, functions can use other functions too! When we use func_get_args() we\
    \ receive any parameters that are given to the function in the form of an indexed\
    \ array. We don't even need to create placeholder variables for them. This means\
    \ that the function above can take as many parameters as you like. Here's an example:"
  merge: -1
  img_proc: true
