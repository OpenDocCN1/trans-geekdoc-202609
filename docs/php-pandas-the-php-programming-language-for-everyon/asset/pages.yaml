- pgno: 61
  md: '# 10. Comments


    We''ve been using single line comments up until now to help explain what''s happen-
    within our code snippets. It''s time to take a look at the other types of comments
    available to us, so that we have better methods of learning for when our snippets
    become a little more complicated.


    # Single Line


    Single line comments are the ones that we''ve been using so far. They begin with
    a double // slash, and can occupy a single line. Like this.


    Example 01: Single line comments.


    ```

    ```php


    // This is a single line comment.

    ```

    ```


    Whitespace doesn''t effect them; they begin at the double forward slash, and terminate
    at the end of the line. This means that we could place them after our code if
    we prefer. Here''s an example.


    Example 02: Another single line comment.


    ```

    ```php


    $panda = ''Awesome''; // Set panda to awesome.

    ```

    ```


    This works just fine. However, I prefer to place my comments on the line above
    my code. This makes the line much shorter and easier to read. Within the examples
    in this book, I''ll be placing my comments on the line above the code that they
    are describing. You''re welcome to the same, or to choose your own position.


    If we want for our comment to span multiple lines, we can quite happily provide
    more single line comments, like this.'
  merge: -1
  img_proc: true
- pgno: 62
  md: "# Example 03: Many single line comments.\n\n```\n1 <?php\n2 \n3 // Pandas are\
    \ awesome.\n4 // It's because they are kind of like cats.\n5 // Except more fluffy,\
    \ and they kind of look like\n6 // how cats look in anime.\n```\n\nThere's a much\
    \ better way though.\n\n> It's worth noting that a hash # character can also be\
    \ used in the place of a double slash to begin a comment. However, the double\
    \ slash is preferred, and the hash comments are simply a relic of a bygone era!\n\
    \n# Multi-Line\n\nIf we want a comment to span multiple lines, we can use the\
    \ multi-line syntax instead. Let's take a closer look, shall we?\n\nExample 04:\
    \ Multi-line comment.\n\n```\n1 <?php\n2 \n3 /* Pandas are awesome.\n4 It's because\
    \ they are kind of like cats.\n5 Except more fluffy, and they kind of look like\n\
    6 how cats look in anime.\n7 */\n8 $pandas = 'Awesome!';\n```\n\nEverything between\
    \ the /* and the * / will count as a comment. Even if it spans multiple lines.\
    \ The comment looks a little unbalanced though, so what many developers like to\
    \ do use additional stars on each line for alignment. Here's an example."
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Example 05: Multi-line comment with asterisks for alignment.


    As you can see, all of the star * characters of the comment are in alignment,
    and the comment looks much, much neater.


    These types of comments can be really useful using a process known as ''commenting
    out'' to aid the debugging process. Here''s an example.


    # Example 06: Some code.


    ```

    <?php

    // Set a string.

    $pandas = ''awesome!'';


    // Set a string.

    $pandas = ''fantastic!'';


    // Output.

    echo ''Pandas are '' . $pandas;

    ```


    We know that this piece of code will output Pandas are fantastic!. Let''s imagine
    that we want to try and see how it looks if pandas are awesome, instead. We might
    want to go back to them being fantastic for later, so this test is only temporary.
    Let''s comment out the middle bit.'
  merge: -1
  img_proc: true
- pgno: 64
  md: "# Example 07: Commented code.\n\n```\n<?php\n// Set a string.\n$pandas = 'awesome!';\n\
    \n/*\n// Set a string.\n$pandas = 'fantastic!';\n*/\n\n// Output.\necho 'Pandas'\
    \ . $pandas;\n```\n\nWe've used the multi-line comment comment symbols to skip\
    \ the middle statement so that PHP ignores the code and pandas are awesome again.\
    \ If we'd like them to be fantastic once, we simply remove the symbols.\n\nThere's\
    \ one final form of comment that we need to take a look at. It's a little advanced,\
    \ but I think you can take it! You're a smart, beautiful AND / OR handsome reader\
    \ after all.\n\n# Doc Blocks\n\nDoc blocks are a special type of comment. Other\
    \ programs known as documentation generators can read these special types of comments,\
    \ and use the information provided within to generate documentation for your project.\n\
    \nDoc blocks look similar to multi-line comments, except that the opening tag\
    \ uses two stars instead of one. Here's an example.\n\n# Example 08: Doc block.\n\
    \n```\n<?php\n/**\n * Description of pandas.\n */\n$pandas = 'awesome!';\n```\n\
    \nWhen our automated documentation system runs, our $pandas variable will have\
    \ a description of what it does. If we want to, we can provide additional information\
    \ that might be useful to our documenter. Let's have another example, shall we?"
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Example 09: Doc block with metadata.\n\n```\n1 <?php\n2 \n3 /**\n4 * Description\
    \ of pandas.\n5 *\n6 * @var string\n7 */\n8 $pandas = 'awesome!';\n```\n\nWe can\
    \ provide extra metadata to our doc blocks using properties that are prefixed\
    \ with an @ symbol. Parameters associated with these properties are placed on\
    \ the same line, and multiple parameters can be separated with spaces.\n\nWith\
    \ the provided @var property, our documentation system knows that the $panda variable\
    \ contains a string value, and can display this information to help others learn\
    \ more about the code.\n\nDon't worry too much about these doc blocks, we'll stick\
    \ to the other comments for now. In a later chapter I'll start to introduce them.\
    \ I just wanted you to be aware of them, just in case you happen to see them somewhere\
    \ else.\n\nIn the next chapter, we'll be taking a look at forks, so you better\
    \ go and raid your cutlery drawer!"
  merge: -1
  img_proc: true
- pgno: 66
  md: "# 11. Forks\n\nRight now your application follows the sequence of lines that\
    \ you've placed in your source files. Life isn't like that, though, is it? We\
    \ don't just blindly follow orders. We make decisions based on the information\
    \ around us.\n\nIn PHP, our information is held within variables. To make decisions\
    \ based on the value of these variables we can use forks. They fork the flow of\
    \ our application, changing its path depending on the result of a comparison.\
    \ In PHP, we can call this an if statement.\n\n# If\n\nLet's take a look at a\
    \ basic if statement. I think it might be best if we lead with an example, don't\
    \ you?\n\nExample 01: The if statement.\n\n```\n<?php\nif (true) {\n  echo 'Yey,\
    \ panda time!';\n}\n```\n\nAn statement always begins with an if. Well, I'm sure\
    \ you'd worked that out. We have two sections. The code within the { } brackets\
    \ is the condition. If the condition evaluates to a true value, then the code\
    \ within the { } braces will be executed.\n\nLet's execute this snippet to see\
    \ what happens.\n\nExample 02: Output.\n\nYey, panda time!\n\nAwesome! It's great\
    \ when it's panda time. The echo statement within the curly braces is executed\
    \ because the condition evaluates to true. Well, the condition is true, but that\
    \ still evaluates to a boolean true.\n\nLet's see what happens if we change the\
    \ condition to something that evaluates to a boolean false. How about this?"
  merge: -1
  img_proc: true
- pgno: 67
  md: "# Example 03: Another if statement.\n\n```\n<?php\nif (false) {\n    echo 'Yey,\
    \ panda time!';\n}\n```\n\nLet's go ahead and execute the code one more time.\n\
    \n# Example 04: Output.\n\n```\n(nothing)\n```\n\nThere we go, nothing happened.\
    \ The code within our curly braces isn't executed when our condition evaluates\
    \ to false.\n\nYou might be asking yourself why this is useful? Why can't just\
    \ add or remove the line of code when we need it? Well, it's because providing\
    \ simply a boolean doesn't make the if statement very useful. It was just a clean\
    \ way of explaining conditions are evaluated as booleans.\n\nConsider the following\
    \ variation. There's a slight difference, can you spot it?\n\n# Example 05: Comparing\
    \ strings.\n\n```\n<?php\n$panda = 'Lushui';\nif ($panda == 'Lushui') {\n    echo\
    \ 'Yey, panda time!';\n}\n```\n\nThis time, we're comparing the value of a string\
    \ variable to another string. Once again, the echo statement will be executed.\
    \ This is because $panda does equal 'Lushui'. This means that the condition once\
    \ again evaluates to true.\n\nLet's change the value of $panda to see what happens."
  merge: -1
  img_proc: true
- pgno: 68
  md: "# Example 06: Comparing different strings.\n\n```\n<?php\n$panda = 'Pali';\n\
    if ($panda == 'Lushui') {\n    echo 'Yey, panda time!';\n}\n```\n\nWe’ll execute\
    \ the code once more.\n\n# Example 07: Output.\n\n(nothing)\n\nThere we go. This\
    \ time, $panda does not equal ‘Lushui’. This means that the condition will equate\
    \ to false, and the code within the curly braces (actually, we call this ‘block’)\
    \ will not be executed.\n\nRight now, we’re controlling the value of $panda, but\
    \ what if $panda was set as the result of user input? If we set $panda to whatever\
    \ our user typed into our application. Perhaps it could be data acquired from\
    \ another part of a big application. This data would be able to change the flow\
    \ of our application, allowing sections of code to be executed under certain conditions.\
    \ This is when programming exciting.\n\nAny statement within the condition will\
    \ be evaluated. Go ahead and experiment statement for a while before moving to\
    \ the next section. It will be a very important part of your new career in programming.\n\
    \n# Else\n\nElse! Else?! Sorry. It just sounded like one of those dramatic moments\
    \ in a soap opera. You, know. When someone threatens someone else with a ‘or else!’.\
    \ Actually, else is just another extension to the if statement. Shall we take\
    \ a closer look?"
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Example 08: If with an else.\n\n```\n<?php\n$panda = 'Pali';\nif ($panda\
    \ == 'Lushui') {\n    echo 'Yey, Lushui time!';\n} else {\n    echo 'Oh hey there\
    \ Pali!';\n}\n```\n\nThe else portion of our statement functions in a similar\
    \ fashion to the if portion. The only difference is that else doesn't require\
    \ a condition. The code within the else curly brackets will be executed only if\
    \ the condition within the if statement equates to false.\n\nThis means that our\
    \ statement can now react to both circumstances, whether the condition evaluates\
    \ to true or false. This is a definite fork. Two different parts of the application\
    \ can execute depending upon a condition.\n\nWell that was simple, wasn't it?\
    \ Let's get to the final component of the if statement.\n\n# Elseif\n\nWoah! That's\
    \ of those words combined! Now things are getting really serious. Right now, you\
    \ know how this works by now. Let's get started with an example.\n\n# Example\
    \ 09: The elseif statement.\n\n```\n<?php\n$panda = 'Pali';\nif ($panda == 'Lushui')\
    \ {\n    echo 'Yey, Lushui time!';\n} elseif ($panda == 'Pali') {\n    echo 'Oh\
    \ hey there Pali!';\n} elseif ($panda == 'Jasmina') {\n    echo 'Looking pretty\
    \ Jasmina!';\n}\n```"
  merge: -1
  img_proc: true
- pgno: 70
  md: "# Forks\n\nHey look! More paths! Using the elseif blocks we are able to provide\
    \ alternate conditions for our fork. PHP will work its way down the list of conditions,\
    \ and execute the code block for the first one that evaluates to true.\n\nIn the\
    \ above example, we can see that if we were to alter the $panda variable, there\
    \ are four possible outcomes to that snippet of code. Let's list them for clarity.\n\
    \n+   * $panda is Lushui - Yey, Lushui time!\n* $panda is Pali - Oh hey there\
    \ Pali!\n* $panda is Jasmina - Looking pretty Jasmina!\n* $panda is something\
    \ else. - (nothing)\n\nIf we want to, we can also use else alongside elseif to\
    \ provide a default execution path when none of the other conditions match. Let's\
    \ take a look at an example.\n\n# Example 10: The else statement.\n\n```\n<?php\n\
    $panda = _PANDA_;\nif ($panda == 'Lushui') {\n    echo 'Yey, Lushui time!';\n\
    } elseif ($panda == 'Pali') {\n    echo 'Oh hey there Pali!';\n} elseif ($panda\
    \ == 'Jasmina') {\n    echo 'Looking pretty Jasmina!';\n} else {\n    echo 'Sorry,\
    \ who are you?';\n}\n```\n\nExperiment with the different combinations of if,\
    \ elseif and else to see how different outcomes of conditions effect the flow\
    \ of execution within your code. We're starting to become real developers now,\
    \ can you feel it?\n\n# Switch\n\nIf you find yourself using many elseif statements\
    \ to compare the same variables, you're probably going to use a switch statement\
    \ instead. It's a much cleaner and more efficient way of reacting to different\
    \ values in different ways.\n\nLet's take a look at an example switch statement.\
    \ We'll start small. First, let's take a look at the switch block."
  merge: -1
  img_proc: true
- pgno: 71
  md: "# Example 11: An empty switch block.\n\n```\n<?php\nwitch ($panda) {\n\n}\n\
    ```\n\nThe switch statement takes a similar shape to that of the if statement.\
    \ Except this time, it's not a condition that is contained within the curly braces.\
    \ Instead it's the value that we wish to compare.\nLet's add some case statements\
    \ to the example so we can see how it works.\n\n# Example 12: A switch block with\
    \ a case.\n\n```\n<?php\n$panda = _SOMETHING;\nwitch ($panda) {\n    case 'Lushui':\n\
    \        echo 'Yey, Lushui time!';\n}\n```\n\nWithin the curly braces of our switch\
    \ statement, we provide our case's. Case's let us compare the value of the variable\
    \ provided to the switch, and execute lines of code if there is a match.\nIn the\
    \ above example, we create a line beginning with the word case. Next, we provide\
    \ the comparison value followed by a : colon. On the next line(s) we provide the\
    \ code that we wish to be executed if there is a match.\n\nWe can add as many\
    \ case statements as we like. Here's another example with multiple comparisons."
  merge: -1
  img_proc: true
- pgno: 72
  md: "# Example 13: A switch block with multiple cases.\n\n```\n<?php\n$panda = _SOMETHING_;\n\
    switch ($panda) {\n    case 'Lushui':\n        echo 'Yey, Lushui time!';\n   \
    \ case 'Pali':\n        echo 'Oh there Pali!';\n    case 'Jasmina':\n        echo\
    \ 'Looking pretty Jasmina!';\n}\n```\n\nHere we can see multiple case statements.\
    \ Be careful, though! There's a gotcha in the snippet. You see, whichever case\
    \ statement matches, the code from the other case statements below will be executed.\
    \ This could be really useful if we wanted them to be executed.\n\nThis means\
    \ that if the value of $panda is Lushui then all three echo statements will be\
    \ executed, but right now, we don't! So how can we make sure that only a single\
    \ echo statement is executed? Simple! We'll take a break or three!\n\n# Example\
    \ 14: The break statement.\n\n```\n<?php\n$panda = _SOMETHING_;\nswitch ($panda)\
    \ {\n    case 'Lushui':\n        echo 'Yey, Lushui time!';\n        break;\n \
    \   case 'Pali':\n        echo 'Oh there Pali!';\n        break;\n```"
  merge: -1
  img_proc: true
- pgno: 73
  md: "```\ncase 'Jasmina':\n    echo 'Looking pretty Jasmina!';\n    break;\n}\n\
    ```\n\nIf we place a break statement on the line after our echo statements, we\
    \ can stop the execution of the switch statement at that point. The flow of execution\
    \ will break out of the switch and continue after the final } closing brace.\n\
    \nThese break statements will also have the same effect as if, elseif and else\
    \ statements. Break is a keyword that will break the execution of the current\
    \ fork. It's a useful one to remember!\n\nThere's one final thing that's missing\
    \ from our switch statement. Right now, it's similar to how our elseif statement\
    \ functioned without the else on the end. So, how do we replicate the functionality\
    \ with the else? Well it's simple, we must simply provide a default!\n\nLet's\
    \ change our example, shall we?\n\n# Example 15: Default.\n\n```\n<?php\n$panda\
    \ = _SOMETHING;\nswitch ($panda) {\n    case 'Lushui':\n        echo 'Yey, Lushui\
    \ time!';\n        break;\n    case 'Pali':\n        echo 'Oh hey there Pali!';\n\
    \        break;\n    case 'Jasmina':\n        echo 'Looking pretty Jasmina!';\n\
    \        break;\n    default:\n        echo 'Sorry, who are you?';\n}\n```"
  merge: -1
  img_proc: true
- pgno: 74
  md: 'The default statement works in a similar fashion to the case statement, except
    that you don''t need to provide a comparison value. The code below the default
    will be executed if none of the other case statements have matched.


    The default statement doesn''t require the break because it''s the last part of
    the switch statement. However, if you''d like to add it for clarity, then it won''t
    make a functional difference.


    In the next chapter we''ll be taking a look at iterators. Get excited! Go on,
    I dare you!'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# 12. Loops\n\nIterators are useful when you have a collection of values. Sometimes,\
    \ the word 'loop' is a better way to describe an iterator. We'll use these techniques\
    \ to allow a piece of code to run repeatedly until (or while) a condition is met.\n\
    \nSome loops are like saying \"Knock on a door until someone answers.,\" and others\
    \ are more similar to \"Count every body buried in my basement.\" Let's take a\
    \ closer look at how these structures might be implemented in PHP.\n\n# While\n\
    \nThe while loop will continue to run a snippet of code while the provided condition\
    \ is true. Let's construct an example using a counter.\n\nExample 01: The while\
    \ loop.\n\n```\n<?php\n// Set the panda counter to zero.\n$pandas = 0;\n// Iterate\
    \ while $pandas less than 50.\nwhile ($pandas < 50) {\n    // Output the number\
    \ of panda butlers.\n    echo \"We have {$pandas} panda butlers!\\n\";\n    //\
    \ Increment the counter.\n    $pandas++;\n}\n```\n\nWe'll set a counter $pandas\
    \ to zero. Now we can begin creating our first loop. Hurray! We need to begin\
    \ our while loop with the word while followed by a condition within the ( ) brackets,\
    \ and finally a block of code held within { } braces.\n\nThe while loop takes\
    \ a similar form to the if statement. The difference is that the code within the\
    \ { } portion will continue to execute, over and over again, while the condition\
    \ is equal to true.\n\nLet's execute the code and see what happens, I'm excited\
    \ to meet the pandas."
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Example 02: Output.


    ```

    1 We have 0 panda butlers!

    2 We have 1 panda butlers!

    3 We have 2 panda butlers!

    4 We have 3 panda butlers!

    5 We have 4 panda butlers!

    6 We have 5 panda butlers!

    7 ... ...

    8 We have 41 panda butlers!

    9 We have 42 panda butlers!

    10 We have 43 panda butlers!

    11 We have 44 panda butlers!

    12 We have 45 panda butlers!

    13 We have 46 panda butlers!

    14 We have 47 panda butlers!

    15 We have 48 panda butlers!

    16 We have 49 panda butlers!

    ```


    Woah! That''s a lot of pandas. The loop begins and checks that the value of $pandas
    is less than 50. If it is less than 50, in fact, it''s set to 0, so the code within
    the block portion of the loop is executed. This means that the count of pandas
    is echoed out, and the $pandas counter is incremented.


    The loop begins again, this time with a $panda value of one. It''s still less
    than 50, so the block is executed again. This process happens over and over again,
    until the 51st iteration of the loop, when the value of $pandas is finally greater
    than 50. The condition is not evaluated as false, the block isn''t executed this
    time, and our code continues to the next line while the loop.


    While loops are a fantastic way of waiting for something. Let''s try a more applicable
    way that will demonstrate this loop in action.


    # Example 03: Waiting.


    ```

    1 <?php

    2

    3 // Create an empty database connection.

    4 $database = null;

    5

    6 // Iterate while the database isn''t set.

    7 while ($database == null) {

    8

    9 // Attempt to connect to the database.

    ```'
