  md: '# Conclusion


    This paper presents a highly-accurate, time-efficient and complex intelligent
    approach for efficiency prediction and device structure optimization of perovskite-crystalline-silicon
    tandem solar cells. A fully-connected deep neural network is designed to predict
    current properties including short-circuit current Isc, bottom short-circuit current
    and reflection loss I at higher layers ($H_{sc}, H_{oc}, H_{ff}, H_{pp}$).


    Thanks to the efficiency of CNN, the optimal thickness set to maximize the short-circuit
    current performance of tandem cells using heuristic algorithms including GA, PSO
    and SA. By searching in the parameter space, we find the optimal thickness for
    each cell layer.


    With a FDDM simulation data, the method is trained and verified with an accuracy
    of 98.3%. Meanwhile, it can take on about $10^{-5}$ seconds to run the prediction
    on a laptop, which reduces the simulation time from second to micro-second order
    compared to standard numerical methods.


    Note in addition to the thickness considered in this paper, we also explored the
    optimal morphology structure and size of nanostructures, interface roughness and
    light mapping/texture structures. It is important to further extend the deep learning
    approach to include more diverse parameters for efficiency prediction and optimization
    of tandem solar cells.


