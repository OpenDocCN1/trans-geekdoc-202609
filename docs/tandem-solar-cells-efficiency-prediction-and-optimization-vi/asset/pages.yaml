    # 1 Introduction


    Developing renewable energy is a promising way to support the sustainable development
    of human beings. Solar cells of renewable energy are a promising candidate to
    prevent the continuous increase of global temperature by reducing the carbon dioxide
    emitted from conventional energy sources such as are still dominated by silicon
    solar cells with a record power conversion efficiency (PCE) of 27.6% for a single
    junction. Tandem solar cells, an emerging type of solar cell, have been extensively
    studied due to their simplicity, easy fabrication and cost, and the device efficiency
    has increased rapidly with a PCE of 25.2% for a single junction. Additionally,
    perovskite is an excellent top-cell in a tandem solar cell owing to the flexible
    bending nature of perovskites. With high current absorption material perovskites/


    tandem solar cells have been proposed, to be an effective way to surpass the current
    efficiency record of tandem cells. To further improve cell efficiency, and the
    optimization of layers and nanostructures using plasmonic and photonic crystal
    structures are necessary to enhance the light absorption in the active layer for
    both single junction and tandem cells. In the optical design process, time difference
    method (FDTD) or finite control variable methods, are normally used to calculate
    the absorption spectrum by swapping the parameters of the structure.⁶ With the
    achieved high short-circuit current (MACD) and other parameters are found, such
    as the thickness of layers or specific structure parameters of nanostructures.
    A traversal process of parameter optimization for solar cells and other optoelectronic
    devices is time and resource consuming. Furthermore, many existing methods require
    a large amount of manual intervention...


    To overcome these limitations of the design process, learning methods were proposed
