    # Tandem solar cells efficiency prediction and optimization via deep neural learning†


    Chuqiao Yi, ᵃᵇ Yuliang Wu, ᵇ Yayo Gao ᵃᵇ* and Qingguo Du ¹ᵇ**


    Cite this: Phys. Chem. Chem. Phys., 2021, 23, 2991


    Optical design plays an important role in improving the performance of opto-electronic
    devices. However, conventional design processes using finite time difference (FDTD)
    or finite element methods are usually time resource consuming, and often result
    in sub-optimal solutions due to an incomplete search of the parameter space. In
    this paper, we propose a deep learning approach to predict and optimize the performance
    of perovskite/crystalline-silicon solar cells. In particular, a deep neural network
    is implemented to predict the short-circuit current for tandem cells with given
    cell structure. Training the network achieves an accuracy of 98.3% and micro-second
    scale simulation, which is as fast. Heuristic algorithms are also used to optimize
    the device structure, where the optimal set of layers is chosen to maximize the
    achieved short-circuit current. According to the calculated results, the expected
    short-circuit power conversion efficiency 15.79 cm⁻² and 23.245%, which is improved
    by 14.2% and 28.4%, respectively, compared to the benchmark cells.


    Received 11 November 2020;

    Accepted 9th December 2020


    DOI: 10.1039/D0CP05882X


