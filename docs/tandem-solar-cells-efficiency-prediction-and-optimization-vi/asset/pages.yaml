    **3.1 Time-consumption.** As CPN coincides with FDTD in training property simulation,
    we can now compare their time efficiency. For each prediction over 12500 epochs,
    CPN only needs ~5 seconds to run an algorithm on a equipped with i7-7700 CPU (4
    cores and 8 threads) and 16GB RAM, while FDTD requires about 460 seconds on average
    on a server with two Xeon-E5 v4 CPUs (12 cores and 24 threads for each) and 128GB
    RAM. That is, CPN is more time-efficient than FDTD (micro-second grade versus
    second grade), and less consuming on resources.


