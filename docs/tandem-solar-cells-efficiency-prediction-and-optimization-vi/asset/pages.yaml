    # 2 Methodology


    # 2.1 Tand solar cell structure


    The perovskite/Si tandem cell structure is illustrated in Fig. 1. To fully absorb
    the light transmitted to the bottom solar cell, the thickness of the Si cell is
    often chosen to be 35 μm. Consequently, the efficiency of the layers of the top
    cell determine the performance of the tandem solar cells. Hₐ, H₋, and H₆ denote
    the thickness of layers, Indium Tin Oxide (ITO), [6,6]-phenyl-C-butyl ester (ETM),
    and poly(3,4-ethylenedioxythiophene) (PEDOT), respectively, from top to bottom
    of the top cell. The MACs of top and bottom solar cells are denoted as I₁ and
    I₀.


    Additionally, the current difference between top and bottom solar cells would
    cause current accumulation and decrease the performance of the tandem solar cell.
    I� = I₁ - I₀.


    4.0 mA cm² or < 0.4 mA cm² is acceptable for a tandem solar cell.²⁸²⁹. Here, for
    the optimization process, which is 10 times smaller than the experimental approach,


