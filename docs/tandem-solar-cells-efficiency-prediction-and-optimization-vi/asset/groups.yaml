    # 通过深度学习进行叠层太阳电池效率的预测与优化†


    Chuqiao Yi, ᵃᵇ Yuliang Wu, ᵇ Yayo Gao ᵃᵇ* and Qingguo Du ¹ᵇ**


    引用此文：Phys. Chem. Chem. Phys., 2021, 23, 2991†


    光学设计在提高光电器件的性能方面起着重要作用。然而，使用有限时域差分法（FDTD）或有限元法的传统设计过程通常耗时耗资源，且由于对参数空间的搜索不完全，往往会导致次优解决方案。在本文中，我们提出了一种深度学习方法来预测和优化钙钛矿/晶硅太阳能电池的性能。特别地，实现了一种深度神经网络，用于预测给定电池结构的叠层太阳电池的短路电流。训练该网络实现了
    98.3% 的准确率和微秒级的仿真，速度非常快。还使用了启发式算法来优化器件结构，通过选择最佳层组合以最大化所实现的短路电流。根据计算结果，预期的短路光电转换效率分别为
    15.79% 和 23.245%，与基准电池相比分别提升了 14.2% 和 28.4%。


    接收于 2020年11月11日；

    接受于 2020年12月9日


    DOI: 10.1039/D0CP05882X


    rsc/pcp


    # 1 引言


    开发可再生能源是支持人类可持续发展的一种非常有前景的方法。可再生太阳能电池是防止全球温度持续上升的重要候选，通过减少传统能源源排放的二氧化碳，目前领域仍由硅太阳能电池主导，单结的记录功率转换效率（PCE）为
    27.6%。叠层太阳电池作为一种新型太阳能电池，因其简单、易于制造和成本低而受到广泛研究，其器件效率迅速提高，单结 PCE 达到 25.2%。此外，由于钙钛矿具有柔性弯曲特性，钙钛矿是叠层太阳电池中优良的顶电池材料。具有高电流吸收材料的钙钛矿/叠层太阳电池已被提出，作为超越目前叠层太阳电池效率记录的有效方法。为了进一步提高电池效率，利用等离子体激元和光子晶体结构优化层和纳米结构，对于增强单结和叠层电池活性层的光吸收是必要的。在光学设计过程中，通常使用时间差分法（FDTD）或有限控制变量法通过交换结构参数来计算吸收光谱。⁶
    获得高短路电流（MAC）以及其他参数，如层厚度或纳米结构的特定结构参数。太阳电池及其他光电器件的参数优化过程是耗时耗资源的。此外，许多现有方法需要大量的人工干预……


