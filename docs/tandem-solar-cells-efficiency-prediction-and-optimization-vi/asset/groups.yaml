    # 2.4.2 Discrete optimization, Note that the above obtains the optimal thickness
    of each layer in the real number space. Nevertheless, in current practical design
    the thickness of the layer is normally limited to 1 mm, indicating that the real-number
    optimal thickness may be unable to maintain in manufacturing process. To deal
    with this, a discrete optimization approach is further adopted to search for the
    optimal thickness as integer (in unit of 1 mm). The problem in discrete space
    can be further with


    $$\max C_P = \min(I_t, I_o) + L_D,$$


    (5)


    where

    $$L_D = \begin{cases} 0 & \text{if each thickness is an integer and } |I_k - I_o|
    < 0.4 \ |I_k - I_o| & \text{otherwise} \end{cases}$$


    Note that the integer constraint is included as a continuous constraint in the
    objective function. The optimization problems in (3)-(4) and (5)-(6) are a multimodal
    and multiobjective NP-Hard optimization problem. To search for the optimal solution,
    three representative heuristic algorithms, Genetic Algorithm (GA)$^{38}$, Particle
    Swarm Optimization (PSO)$^{39}$ and Simulated Annealing (SA)$^{32}$ are considered
    in this paper, respectively which will be explained in Section 3.2.


    # 3 Results and discussions


    # 3.1 Network training


    The data set formulated by FDTD is randomly divided into five folds for five-fold
    cross validation while four are adopted as training sets and the other is either
    validation and test set. In this paper, we adopt Keras$^{31}$ as the deep learning
    framework. Mean Square Error (MSE), Mean Absolute Error (MAPE) and Mean Absolute
    Error (MAE) are considered as key performance metrics and are defined in Table
    2, where $I_o$ and $P_i$ denote the $th$ value in FDTD data and the $th$ prediction,
    respectively. MSE is chosen as the loss function for training. As shown in Figure
    3, MAE of training and validation can vary. With it we can see from Fig. 5, MSE
    and MAE all decrease as the number of epochs, and the training process converges
    about 600 epochs. CNN is not over-fitting in the training set and validation loss
    also stays low.


    # 3.1.2 Accuracy of the performance in CNN prediction


    The performance of CNN is evaluated in terms of MAE of $I_o$, MSE of $I_o$, MAPE
    and MAE, as defined in Table 2, are calculated and presented in Fig. 6. As shown
    in figure, the average MAE of $I_o$ and $I_t$ is small, indicating that CNN can
    achieve an accuracy of 98.3% of FDTD simulations. MSE is 0.19 and 0.052, respectively
    which shows that the current properties predicted by CNN are matched with the
    numerical comparison using FDTD. With limited space, we have randomly selected
    50 sets out of test data for the sake of usage. The complete results can be found
    from GitHub$^{29}$. As shown in Fig. 7, a good match can be observed between CNN
    and FDTD results for $I_o$, $I_t$ and $I_{mo}$, indicating that the proposed CNN
    is an accurate model for the prediction of properties of solar cells.


    Table 2 Definitions of metrics


