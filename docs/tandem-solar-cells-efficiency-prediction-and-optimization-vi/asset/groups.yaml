    图 1 钙钛矿/硅叠层电池结构。


    # 2 方法


    ## 2.1 叠层结构


    钙钛矿/硅叠层电池结构如图1所示。为了充分吸收透射到底电池的光，硅电池的厚度通常选择为 35 μm。因此，顶电池层的效率决定了叠层电池的性能。Hₐ、H 和
    H 分别代表从顶电池顶部到部的层、氧化�锡（ITO）、[6,6]-苯基丙丁酯（ETM）和聚乙（3,4-乙二噻吩）（PEDOT）的厚度。顶电池和底电池的 MAC
    分别表示为 I₁ 和 I₀。


    此外，顶底电池之间的电流差异会导致电流积累并降低叠层电池的性能。I = I₁ - I₀。


    4.0 mA cm² 或 < 0.4 mA cm² 对于叠层太阳电池是可以接受的⁸²⁹。为了 PCE 叠层电池，需要对每层的厚度进行仔细设计和优化，使 I₁
    和 I₀ 尽可能接近。MAC 由下式给出：


    ```

    I_{MAC} = \int_{λ_{min}}^{λ_{max}} I(λ)A(λ)d\λ

    ```


    (1)


    其中 λ_min 和 λ_max 是叠层太阳电池吸收波范围的上下限


    2.2 学习方法描述


    为了解决数值仿真的局限性，我们提出了一种用于叠层太阳电池设计的深度学习方法，如图3部分所示：：设计并训练了一个名为电流预测网络（CPN）的全连接网络，用于预测给定层厚度的叠层太阳电池的电流特性，取代
    FDTD 数值仿真。


