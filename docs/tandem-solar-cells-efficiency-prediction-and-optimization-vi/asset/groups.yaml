    ## 2.3 Data set and network architecture of prediction network


    In this paper, we formulate a data set with 12,500 sets of numerical simulation
    data from FDTD, comprising the set of layer thicknesses (in nm) and the current
    properties of tandem solar cells. Table 1 presents the space and the size of each
    layer in the FDTD simulation set. For each layer thickness, we run the FDTD simulation
    of the tandem solar cell and obtain the corresponding MAC of top-sub cell $l_t$
    and reflection loss $l_t$. The data set and queries require to reproduce results
    as can


    Fig. 4 represents the architecture of CPN, which is a 15-deep neural network with
    layers of tandem solar cells ($H_i, H_{ij}, H_{ijk}, H_i$) as input data. CPN
    produces a series-parallel-parallel structure to reduce the number of training
    parameters in the network. The first segment is an input network (SIN) where the
    thickness of five layers is the input data. Each layer is adopted by CPN to prevent
    over-fitting and reduce redundant calculations. SIN is followed by a parallel
    network (PNW), which consists of three parallel parts each with fully-connected
    layers, which have 12, 10, 10, 8, and 5 hidden nodes, respectively.


    ## 2.4 Heuristic algorithms for structure optimization


    ### 2.4.1 Continuous optimization. Based on the predicted results using CPN, we
    now further search for the layer thickness ($H_i, H_{ij}, H_{ijk}$) in real space
    to maximize the short-circuit current of the top and bottom sub-cells, $C_p$.
    The tandem solar cell is made up of top and bottom sub-cells in a series circuit
    and the short-circuit current of the tandem solar cells is bounded by the short-circuit
    current of any sub-cells. Moreover, the difference between the top and bottom
    sub-cell current $|I_c|$ should not exceed 0.4 mA cm² as mentioned in Section
    2.1. The optimization problem is formulated as


    ```

    $C_p = \min(I_t, I_b) + L_c$.

    ```


    where


    ```

    $L_c = \begin{cases} |K_c| < 0.4 \ -5 \ \text{otherwise.} \ \end{cases}$

    ```


    ![](img/0e32c2668a2c025ade29653effb380fd_2_2.png)


    ![](img/0e32c2668a2c025ade29653effb380fd_2_3.png)


    Fig. 3 Graphic illustration of prediction and optimization procedure for tandem
    solar cells proposed in this paper.


    Table 1 Set space and size of layer thickness of: ITO, PCBM, MAPbi, and PEDOT
    in the data set


    | Layer | Min value (nm) | Max value (nm) | Step size (nm) |

    |---|---|---|---|

    | $H_e$ | 10 | 100 | 10 |

    | $H_f$ | 20 | 60 | 10 |

    | $H_p$ | 15 | 35 | 5 |

    | $H_{mn}$ | 160 | 250 | 10 |

    | $H_x$ | 10 | 100 | 10 |


    with traditional simulation-based design methods, this process provides a time
    and computing resource-saving and global optimization solution for tandem solar
    cell design, requires little professional knowledge or manual intervention.


