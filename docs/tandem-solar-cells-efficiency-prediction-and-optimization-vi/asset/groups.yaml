    | FDTD | 90 | 20 | 200 | 15 | 15 | 19.2172 | 5.5099 | 19.0660 | 0.0152 |

    | GA-C | 86.96 | 16.22 | 244.10 | 11.20 | 11.02 | 20.3482 | 3.8577 | 20.2440 |
    0.0102 |

    | PSO-B | 82.96 | 15.01 | 243.90 | 10.10 | 11.02 | 20.4222 | 3.7691 | 20.4182
    | 0.0048 |

    | SA-C | 76.71 | 15.10 | 243.90 | 10.10 | 10.96 | 21.3748 | 3.7148 | 20.4017 |
    0.0037 |

    | PSO-D | 91 | 15 | 250 | 10 | 10 | 19.6857 | 4.5111 | 19.2863 | 0.3994 |

    | SA-D | 69 | 15 | 242 | 10 | 10 | 20.5821 | 23.3038 | 20.7305 | 0.2038 |


    根据先验经验，层 $\{H_g, H_i, H_m, H_d, H_e\}$ 的边界分别为 $\{10, 15, 16, 10, 10\}$ 和 $\{100,
    80, 50, 50, 30\}$。启发式算法的源代码可以在 GitHub。


    ## 3.2.2 优结构和可实现的短路电流。


    图 8 展示了 GA、PSO 和 SA 的进化曲线，其中 -D 表示优化的短电流和离散优化结果。从图 8 可以看出，所有算法都在 300 次迭代内收敛。由于参数敏感性的性质，GA
    的优化更加稳定，并且比其离散情况获得更高的最大可实现短路电流。


    表 4 给出了每种启发式算法实现的最大预测可实现短路电流和的最的最层厚度。我们可以发现，通过连续优化，三种算法实现的最大预测可实现短路电流均高于 FDTD
    仿真集中的最佳值，其中 SA 略高于其他算法。在考虑层厚度具有整数约束 (1) 的短路电流优化时，GA 和 PSO 的最大预测可实现短路电流显著优于 SA。


    相应的层厚为 $\{H_g, H_i, H_m, H_d, H_e\} = \{69, 15, 24, 10, 100\}$ nm。


    ## 3.3 结果中优结构的预期性能


    为了研究优结构的电池性能是否理想，我们使用了投影电流和投影 PCE 来估计叠层电池在优化厚度实验下可以实现的短路电流和 PCE。


    ```

    $I_{sc(Opt)} = I_{sc,OP}, \quad I_{sc,RE}; \quad (7)$

    ```


    其中 $I_{sc,RE}$ 和 $I_{sc}$ 代表参考叠层电池的实验和计算短路电流，$I_{sc(Opt)}$ 和 $I_{sc,OP}$ 代表我们优结构的投影和计算短路电流。具有抗反射层的
    MAP3/Si 叠层电池的测量短路电流 $I_{sc} = 13.8 cm^{-2}$，$I_{sc,RE} = 17.2 cm^{-2}$ 是从吸收光谱（图
    1a）中提取的。需要澄清的是，$PCE_{RE}$ 是参考叠层电池的 18.1%。在正向方向，我们优结构的投影 PCE $PCE_{(Opt)}$ 为：


    ```

    $PCE_{(Opt)} = PCE_{OP}, \quad PCE_{RE}; \quad (8)$

    ```


    根据公式 (8)，计算出的 PCE 为 23.24%，与参考叠层电池的 PCE 相比提高了 28.4%。


    > 注意：基于种群的进化策略和启发式算法搜索的最优解可能不同。表 4 所示的结果是重复实验的结果。


    ## 结论


    本文提出了一种高精度、高效且复杂的方法，用于钙钛矿-硅叠层电池的效率预测和器件优化。设计了一个全连接神经网络来预测包括短路电流、底部短路电流和反射损耗的效率（$H_{sc},
    H_{oc}, H_{ff}$）。得益于 CNN，我们通过在参数空间搜索包括 GA、PSO 和 SA 在内的启发式算法找到了每一层的优化厚度。FPDM 方法经过训练和验证，精度为
    98.3%。同时，在笔记本电脑上运行大约需要 $10^{-5}$ 秒。除了本文考虑的厚度，我们还探索了纳米结构的形貌和尺寸、界面粗糙度和纹理。


