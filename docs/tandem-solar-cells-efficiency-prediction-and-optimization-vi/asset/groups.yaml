    ## 2.4.2 Discrete optimization, Note that the above obtains the optimal thickness
    of each layer in the real space. Nevertheless, in practical design the thickness
    of the layer is normally limited in manufacturing process. To deal with this,
    a discrete optimization approach is further adopted to search for the optimal
    thickness as integer (in unit of nm). The problem in discrete space can be further
    with


    $$\max C_p = \min(I_t, I_b) + L_D,$$


    where

    $$L_D = \begin{cases} 0 & \text{if each thickness is an integer and } |I_c - I_o|
    < 0.4 \\ |I_c - I_o| & \text{otherwise}\end{cases}$$


    Note that the integer constraint is included as a continuous constraint in the
    objective function. The optimization problems in (3)-(4) and (5) are multimodal
    and NP-Hard optimization problem. To search for the optimal solution, three representative
    heuristic algorithms, Genetic Algorithm (GA), Particle Swarm Optimization (PSO),
    and Simulated Annealing (SA) are considered in this paper, respectively will be
    explained in Section 3.


    ## 3 Results and discussions


    ### 3.1 Network training


    The data set formulated by FDTD is randomly divided into five folds for five-fold
    cross validation while four are adopted as training sets and the other is test
    set. In this paper, we adopt Keras as deep learning framework. Mean Square Error
    (MSE), Mean Absolute Percentage Error (MAPE) and Mean Absolute Error (MAE) are
    considered key performance metrics and are defined in Table 2, where $O_o$ and
    $P_i$ denote the value in FDTD data and the prediction, respectively. MSE is chosen
    as loss function for training. As shown in Figure 3, MAE of training and validation
    can vary. With it we can see from Fig. 5, MSE and MAE all decrease as the number
    of epochs, and the training process converges about 600 epochs. CNN is not overfitting
    in the training set and validation loss stays low.


    ### 3.1.2 Accuracy of the CNN prediction


    The performance of CNN is evaluated in terms of MAE of $I_o$, MSE of $I_o$, MAPE
    and MAE, as defined in Table 2, are calculated and presented in Fig. 6. As shown
    in figure, the average MAE of $I_o$ and $I_t$ is small, indicating that CNN can
    achieve an accuracy of 98.3% of FDTD simulations. MSE is 0.19 and 0.052, respectively
    which shows that the properties predicted by CNN are matched with numerical comparison
    using FDTD. With limited space, we have randomly selected 50 sets out of test
    data for the sake of usage. The complete results can be found from GitHub. As
    shown in Fig. 7, a good match can be observed between CNN and FDTD results for
    $I_o, I_t$ and $I_{mo}$, indicating that the proposed CNN is an accurate model
    for the prediction of properties of solar cells.


