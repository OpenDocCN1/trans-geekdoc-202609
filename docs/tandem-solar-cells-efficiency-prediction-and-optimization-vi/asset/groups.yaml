    ## 3.2.2 Optimal structure and achievable short-current circuit.


    Fig. 8 illustrates the evolution curves of GA, PSO and SA, and where -D denotes
    the optimized short current and discrete optimization results. It can be seen
    from Fig 8 that all algorithms converge within 300 iterations. Due to the nature
    of parameter sensitivity, the optimization of GA is more stable and can achieve
    a higher maximum achievable short-current circuit than its discrete case.


    Table 4 presents the maximum predicted achievable short-current circuit and the
    optimal layer thickness achieved by each heuristic. We can find that with continuous
    optimization, the maximum predicted achievable short-current circuit achieved
    by all three algorithms are higher than the best in the FDTD simulation set, where
    SA is slightly higher than the other. When it comes to the optimization of short
    current with the integer constraint (1) on layer thickness, the maximum predicted
    achievable short-current circuit of GA and PSO significantly outperforms SA.


    The corresponding layer thickness is $\{H_g, H_i, H_m, H_d, H_e\} = \{69, 15,
    24, 10, 100\}$ nm.


    ## 3.3 Expected performance of the optimal structure in results


    To investigate whether the cell performance of the optimal structure in perform,
    we used the projected current and projected PCE to estimate the short-circuit
    current and PCE that the tandem solar cell can achieve in experiments with optimal
    thickness, respectively.


    ```

    $I_{sc(Opt)} = I_{sc,OP}, \quad I_{sc,RE}; \quad (7)$

    ```


    where $I_{sc,RE}$ and $I_{sc,RE}$ denote the experimental and calculated short
    circuit current of the referred cell, $I_{sc(Opt)}$ and $I_{sc,OP}$ denote projected
    short circuit current and calculated short-circuit current of our optimal structure,
    We obtain the optimal performance from the referenced tandem solar cells, the
    MAPb3/Si tandem tandem solar cell without an anti-reflective layer which has a
    short-current of $I_{sc} = 13.8\text{ cm}^{-2}$. The measured short-circuit current
    of $I_{sc,RE} = 17.2\text{ cm}^{-2}$ is measured from the absorption spectrum
    (ESF; Fig. 1(a)) with FDTD method with the extracted parameters of the referred
    tandem cells. We need to clarify that $PCE_{RE}$ is the PCE of the referred Si
    hole transport layer in tandem.


    With the structure of 18.1% ($PCE_{RE}$) in the forward direction, the projected
    PCE ($PCE_{(Opt)}$) of our optimized structure is:


    ```

    $PCE_{(Opt)} = PCE_{OP}, \quad PCE_{RE}; \quad (8)$

    ```


    The projected PCE is calculated to be 23.24% according to eqn (8), which is enhanced
    by 28.4% compared to the PCE of the referenced tandem solar cells by thickness
    optimization.


    > Note that heuristics algorithms run on population-based evolution strategy and
    the optimal solution of each search might be different. The results shown in Table
    4 are optimal ones from repeated experiments.


    ## Conclusion


    This paper presents a highly-accurate, time-efficient and complex approach for
    efficiency prediction and device optimization of perovskite-silicon tandem solar
    cells. A fully-connected neural network is designed to predict current properties
    including short-circuit current, bottom short-circuit current and reflection loss
    at higher layers ($H_{sc}, H_{oc}, H_{ff}$). Thanks to efficiency of CNN, we find
    the optimal thickness for each layer by searching in parameter space using heuristic
    algorithms including GA, PSO and SA. The FPDM method is trained and verified with
    an accuracy of 98.3%. Meanwhile, it can take about $10^{-5}$ seconds to run on
    a laptop compared to standard numerical methods. In addition to the thickness
    considered in this paper, we also explored the morphology and size of nanostructures,
    interface roughness and texture. It is important to further extend deep learning
    to include more diverse parameters for optimization of tandem cells.


