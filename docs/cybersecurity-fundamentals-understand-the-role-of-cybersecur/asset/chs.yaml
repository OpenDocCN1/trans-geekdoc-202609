  \ 月。\n- 25 Aleksandar Lazarevic, Levent Ozgur, Vipin Kumar，“异常检测的比较研究”，SDM 2003。\n\
  \n# 4. 入侵检测与防御\n\n基于入侵的攻击现在是关注的焦点，而现有的安全措施（如入侵检测）无法有效触达。本章主要强调追踪路径，并详细介绍用于到达网络犯罪源头的技术。\n\
  \n## 4.1 结构\n\n在本章中，我们将涵盖以下主题：\n* 网络取证\n* 回溯溯源中的假设\n* 回溯溯源方案的分类\n* 睡眠追踪 (SWT) 的评估\n\
  \n## 4.2 目标\n\n本章的主要目标是详述用于到达源头的技术。在本章中，你将理解网络取证及其详细架构。通过不同参数对这些机制进行评估，将帮助你理解在检测到入侵时**睡眠追踪（SWT）**的益处。\n\
  \n### 4.2.1 网络取证\n\n在物理世界中，人们认为犯罪分子总会在现场留下一些东西，并带走一些有助于安全人员找到罪犯的线索[1]。网络取证是指对恶意活动期间留下的数字证据进行识别、封存、收集、认证、分析和保存的科学过程。它基本上是一门从相关硬件和软件中提取可供法律诉讼提交信息的科学。虽然网络取证与网络安全之间存在互补关系，但为了确保联网环境的安全，网络取证过程起着至关重要的作用。网络取证主要关注网络犯罪发生后数字证据的收集、保存和分析，而网络安全通常是在网络犯罪发生前应用的程序。\n\
  \n### 4.2.2 入侵活动\n\n入侵检测、入侵防御、入侵容性和入侵响应是有效处理网络入侵需要执行的主要活动[1]。入侵检测系统如图 4.1 所示将入侵活动分为四类。入侵检测意味着检测网络流量中的恶意代码。入侵防御是指确保特定节点或基础设施免受恶意威胁的程序。入侵性是指系统和基础设施承受入侵的能力，同时确保系统的可用性和完整性[19]。入侵响应意味着应用防御措施来修复原因以防止未来的攻击；它是针对入侵所出的反应，用以中断攻击路径。\n\
  \n![](img/Figure-4.1.jpg)\n\n**图 4.1:** 入侵活动\n\n\n\n\n\n在源头附近快速确定基于网络的入侵，对于保护从机计算机和基础设施免受损害至关重要。目前有多种方法用于防御网络入侵，但大多数方法本质上是被动的，这意味着这些方法需要存储网络流量以便进一步分析。海量数据流量的存储限制了被动方法的实际应用。主动入侵检测方法可以在不存储数据流量的情况下动态识别恶意包。它不需要通过对比传入的数据流量与并发输出的数据流量来感知偏差。\n\
  \n# 4.3 溯源与回溯\n\n我们互联的数字环境现在面临着更高的风险，极易受到受财务和政治动机驱动的侵害。暗网黑市场上廉价黑客工具的可用使得形势变得更加严重。这些工具帮助初学者在不需要技术和黑客技能的情况下转化为网络犯罪分子。一个针对良好的恶意包就可以降低性能，甚至使关键网络服务失效\
  \ [4]。为了追究产生恶意包的犯罪分子的责任，必须识别这些包。\n\n`溯源`是指确定网络犯罪分子身份或位置的过程。网络犯罪分子的身份包含地理位置、`IP`\
  \ 地址、账户和以太网地址 [3]。溯源不仅涉及源头，还涉及识别系统遭受攻击的中间节点。一个理想的溯源过程始终通过具体证据确定恶意包的真实源头。确定网络犯罪的真实源极其困难；犯罪分子正在使用复杂的工具隐藏在匿名的数字盾牌之后。他们通过分布在不同国家的数百到数千个受损计算机组成的链来发起攻击。在实践中，大多数国家在对网络犯罪的调查和起诉过程中没有表现出积极且及时的合作。此外，由于担心国际平台上的形象受损，这些国家限制调查机构调查犯罪现场及其源头。\n\
  \n如果我们不知道恶意包的真实源头，就无法在正确的位置采取适当的反措施。结果是，未来攻击的可能性依然存在，罪犯逃避了惩罚。回溯是一种从受害者计算机到达攻击源头的方法。它指的是一种了解恶意包起源的程序，从防御计算机开始，跨攻击路径递归向后移动到攻击计算机\
  \ [3]。遗憾的是，`IP` 协议的匿名性使得难以准确识别攻击计算机，并方便了犯罪分子隐藏自己。\n\n# 4.4 为什么溯源很困难？\n\n理想情况下，回溯机制应该定位到实施犯罪的本人，但现实中，识别出的是发起恶意活动的计算机。犯罪分子隐藏其计算机的\
  \ `IP` 地址以避免检测并伪装成另一台计算机。David A. Wheeler 等人 [3] 详细介绍了一些隐藏实施犯罪的计算机 `IP` 地址的常用方法。这些方法详细如下：\n\
  \n1. 伪造和修改源 `IP` 地址是隐藏实施犯罪的实际 `IP` 地址的一种流行方法。这种伪造被称为 `spoofing`（欺骗），它基于这样一个事实：数据包源在到达目的地之前一直不使用。犯罪分子将恶意包发送到目标计算机，并伪造他们的\
  \ `IP` 地址伪装成另一台计算机，如图 4.2 所示。每当目标主机对犯罪计算机做出响应时，会发现响应缺失：\n\n   ![](img/Figure-4.2.jpg)\n\
  \n   **图 4.2:** 伪造 IP 地址\n\n2. 使用反射主机（reflector host）隐藏犯罪分子的真实位置，使得犯罪分子可以通过它将恶意包传递到目标主机，但不允许受害者与犯罪分子通信。反射主机充当隐藏犯罪分子的盾牌。每当受害者主机为犯罪分子生成响应时，反射主机作为原始数据包发送主机与其进行通信：\n\
  \n   ![](img/Figure-4.3.jpg)\n\n   **图 4.3:** 反射主机\n\n上述 [图 4.3] 显示反射主机捕获了犯罪主机的\
  \ `IP` 并与受害者通信。反射主机与犯罪主机之间的通信变为单向。因此，反射主机仅遵循从犯罪主机收到的指令。\n\n3. 有时使用 `time-to-live`\
  \ (`TTL`) 逻辑来在极短的时间内临时设置一个主机。恶意包通过这个临时主机递送，随后它被移除。\n\n4. 网络犯罪分子产生恶意包交付与其激活之间的时间差。洗钱主机（Laundering\
  \ hosts）在数据包中注入延迟，使其在特定时期保持非活动状态。洗钱主机为犯罪分子提供了充足的机会让他们逃离犯罪现场。\n\n5. 犯罪分子现在更聪明了；他们将整个恶意程序分解为若干模块，并将其保留在主计算机控制的位于不同地理位置的不同先前受损计算机上。恶意模块通过不同的源和路由传输，并在目标计算机上组装以触发攻击。\n\
  \n# 4.5 回溯中的假设\n\n基于网络的攻击会导致巨大的财务损失，并可能中断全球的关键服务。现有的网络安全机制（如 `IDS` 和防火墙）不足以保护系统和网络基础设施，因为它们没有阻止恶意包的源，相反，这些机制保护的是系统和个人网络基础设施。理想情况下，回溯系统应该能够识别通过网络传输的任何数据的源，无论其是否包含恶意代码。在形成回溯系统时，应该考虑以下几个假设，如下\
  \ [4]：\n\n* 数据包可能指向多一台计算机\n* 网络中可能存在数据包重复\n* 路由器性能可能低于标准\n* 攻击者装备精良、精明且知道自己正被追踪\n\
  * 数据包大小在网络信道中是相同的\n* 目标和中间节点可能受到资源限制\n* 回溯不是一种频繁的操作\n\n# 4.6 IP 地址与回溯机制\n\n`Internet\
  \ Protocol address`（网协议地址）唯一标识网络上的设备。它指的是用于表示计算机网络上源和目的地址的 32 位数值标签。它标识计算机也标识网络，并分配给联网计算机，以便在互联网上进行通信并在需要时便于进行识别\
  \ [14]。`IPv4` 结构结构结构用于互联网协议地址划分。`Internet Protocol Version 4` (`IPv4`) 面临局限，因为它支持的总地址少于\
  \ 43 亿个，而互联网的增长表明 `IPv4` 不再具有可持续性。`Internet Protocol Version 6` (`IPv6`) 解决了上述问题并提供了\
  \ 128 位地址空间，这比 `IPv4` 大得多。\n\n\n\n\nIP 数据包带有源地址和目的地址。在目的地址的帮助下，数据包从源端传输到目的地。遗憾的是，IP\
  \ 网络路由基础设施仍然缺乏一种有效的机制来验证源地址的真实性。由于互联网的架构，没有任何实体可以对源地址的正确性负责 [[5]](#c04.xhtml#ref5a)。这几乎类似于邮政服务，其中目的地址对于信件的投递至关重要，而源地址的认证往往被忽略。因此，IP\
  \ 协议的内部架构和数据包转发机制使得定位数据包源变得困难。这些缺陷诱使网络犯罪分子实施犯罪并隐藏他们的身份和来源 [[5]](#c04.xhtml#ref5a)。\n\
  \nIP 溯源系统的目的是确定数据包的来源，这不仅仅是恶意数据包，也包括真实的数据包。目前已经提出了几种解决此问题的方法，可以分为两类：记录（logging）和标记（marking）\
  \ [[6]](#c04.xhtml#ref6a)。在记录方案中，路由器在特定数据包通过其时会记录该数据包的信息，以确保怀疑的数据包是否已由特定路由器转发。在标记方案中，路由器用其之前的路径链路标记数据包。数据包传输的所有路由器都会记录有关数据包的信息。当数据包通过路由器时，之前的路径链路会被添加到数据包中，这有助于进一步重建恶意数据包路径。数据包信息通过两种方式附加在数据包上：第一种方法是将数据包信息插入数据包中，即入站标记（inbound\
  \ marking）。显然，入站标记不需要额外的带宽。另一种方法是在数据包旁附加一个保留数据包详细信息的额外 ICMP 数据包，称为出站标记（outbound\
  \ marking）。\n\n为了找到一种高效且可扩展的方法定位 IP 数据包源并追踪其跨通道传输，仍有许多挑战需要解决。恶意数据包的源可能属于网络的入口点、主机内部或被攻击的路由器。在攻击期间，某些路由器可能被破解，恶意数据包通过这些路由器传输。当通过溯源定位源时，被破解的路由器会逃避自身，并在整个数据传输过程中标记自己的缺失。通过这样，攻击的实际路径被改变，并向安全管理员提供误导信息，以将他们的注意力从实际路径和受影响设备转移开。\n\
  \n# 4.7 溯源方案的分类 (#toc.xhtml#s139a)\n\nZhiqiang Gao 和 Nirwan Ansari [[6]](#c04.xhtml#ref6a)\
  \ 将溯源方案分为五不同的类别。他们根据基本原理、处理模式、功能实现、位置和基础设施要求对溯源方案进行分类。`图 4.4` 所示的溯源分类包含了`概率数据包标记`\
  \ (`PPM`）、`互联网控制消息协议` (`ICMP`，即著名的 `iTraceback`）、`源路径隔离引擎` (`SPIE`，同样基于哈希的溯源）、`基于代数的溯源方法`\
  \ (`ATA`) 以及`确定性数据包标记` (`DPM`)，涵盖了执行溯源的重要方法：\n\n![](img/Figure-4.4.jpg)\n\n**图 4.4:**\
  \ 主要溯源方案\n\n基于基本原理的分类进一步归类为标记和记录组。数据包标记是 IP 溯源中最常见且最重要的技术。标记使用 IP 报头的字段来存储审计轨迹。（注：原文此处有大量重复句子，翻译已去重）。\n\
  \n\n\n\n`确定性数据包标记` (`DPM`) 的提出是为了解决概率数据包标记方法存在的问题。在 `PPM` 中，可以注入带有错误信息的数据包并使其成功通过路由器进行标记。这通俗被称为\
  \ `标记伪造` (`mark spoofing`)。Andrey Belenky 等人 9 认为标记伪造可以通过特殊编码来控制。如果所有指向受害者的数据包都被正确标记，那么就不需要这种复杂且消耗处理器的编码了。在\
  \ `DPM` 中，尝试通过路由器正确标记跨网络的所有数据包，这样如果攻击者尝试用数据包伪造标记，他的伪造标记将被正确标记所覆盖 9：\n\n![](img/Figure-4.5.jpg)\n\
  \n**图 4.5:** IP 头部\n\nAndrey Belenky 等人 9 在 IP 数据报文中观察到，在攻击源识别方面，全路径回溯与入口点地址的效果相当。从概念上讲，每个数据包都是从源地到目的地单独路由的，即使源和目的相同，数据包也可以选择不同的路由。ISP\
  \ 使用公共网络和其自主开发的私有网络来为客户提供服务。在这种情况下，全路径回溯变得非常重要。在 `DPM` 中，IP 地址被分为两个片段，如图图 4.5, 16。数据包在进入网络时被标记，且数据包在离开网络之前一直保持该标记不变。靠近数据包源的最近接口在入口路由器的边缘处对数据包进行标记。\n\
  \n在 `DPM` 中，需要将 32 位长 IP 地址传递给受害者。16 位的 `ID` 字段和 1 位的预留标记有助于标记数据包，如图图 4.5, 21, 22。显然，这\
  \ 17 位不足以向受害者提供整个 IP 地址。因此，`DPM` 使用两个数据包组成完整的 IP 地址。每个输入数据包的 `ID` 字段可以代表这部分部分之一，如果\
  \ `ID` 字段代表第一部分，则预留标记位被设置为零；否则，它被设置为一以代表第二部分 9。\n\n# 4.7.3 基于代数的回溯方法 (ATA)\n\n攻击可能包含通过不同从机计算机传输的数据包，这些计算机大多数情况下受远端计算机的控制。此类数据包的传输通过显式或隐式方式实现。在显式方式中，直接直接攻破单个计算机（从机）以执行指定任务，而反射器则以隐式方式向从机发送虚假请求。Drew\
  \ dean 等人 11 认为通过路由器进行数据包标记，并以代数函数概念为基础开发了代数回溯方法 10。在 `ATA` 中，使用代数技术通过数据包嵌入路径信息，并将路径信息编码为点。该方法对于任何次数为\
  \ `d` 的多项式 `f(x)` 的基本思想是在 `d+1` 个唯一点上恢复 `f(x)`。考虑 `A[1]`、`A[2]`……`A[n]` 是路径 `P`\
  \ 上路由器的 32 位地址 10。路径函数可以表示为 `fp(x)=A[n-1]+A[n-2]+.........A[n]`。我们添加一个带有第 `j` 个数据包的数据包\
  \ `x[j]`，然后在数据包跨越路径时计算 `fp(x[j])`。当足够的数据包从同一条路径到达目的地时，通过插值法重构函数 `fp` 10。\n\n# 4.7.4\
  \ ICMP 回溯或 iTrace 方法\n\n在该方法中，路由器产生低概率的回溯消息，该消息沿目的地发送并返回其源地。通过路径上的路由器生成的回溯消息决定了伪造数据包的流量源和路径\
  \ 12。理解 ICMP 回溯，我们需要了解以下术语：\n\n- `Element`（元素）：指的是消息的基本组件，通过 `type code` 显式识别并用\
  \ `类型-长度-值` (`TLV`) 编码。\n- `Field`（字段）：也指消息组件，通过其在消息中的相对位置进行识别。\n- `Generator`（生成器）：指生成\
  \ ICMP 回溯消息的路由器 12。\n- `Link`（链路）：指连接生成器与其他实体的逻辑链路 12。\n- `Peer`（对等体）：指链路另一端的接收回溯包的实体。\n\
  - `Traced packet`（回溯数据包）：指 ICMP 回溯消息的主体。\n\nICMP 的主要目标是诊断网络并报告错误。`traceroute` 和\
  \ `ping` 等网络操作使用 ICMP 来检测故障。随后的图 4.6 显示了 ICMP 的格式，其中 `TYPE` 字段负责识别控制消息。`checksum`\
  \ 字段包含了携带的错误检测数值：\n\n![](img/Figure-4.6.jpg)\n\n**图 4.6:** ICMP 回溯消息\n\nICMP 消息的主体由一系列具有自识别性质的元素组成。这些元素遵循\
  \ `类型-长度-值` 方案，如图图 4.7 所示：\n\n![](img/Figure-4.7.jpg)\n\n**图 4.7:** 类型-长度-值 (TLV)\n\
  \n消息封装在 ICMP 包中，`TYPE` 字段包含由互联网数字分配机构 (`IANA`) 分配的单字节值 12。其范围从 `0x01` 到 `0x7f` 代表顶级元素，`0x81`\
  \ 到 `0xff` 代表子元素 12。Steve Bellovin 以以下方式定义了顶级类型代码和子元素类型代码，如表 4.1 和表 4.2 所示，与 ICMP\
  \ 回溯相关：\n\n| TYPE | 元素名称 |\n| --- | :--- |\n| 0x01 | 反向链路 |\n| 0x02 | 前向链路 |\n|\
  \ 0x03 | 时间戳 |\n| 0x04 | 回溯数据包内容 |\n| 0x05 | 概率 |\n| 0x06 | 路由器 ID |\n| 0x07 | HMAC\
  \ 认证数据 |\n| 0x08 | 密钥披露列表 |\n\n**表 4.1:** 顶级类型代码\n\n| TYPE | 元素名称 |\n| --- | :---\
  \ |\n| 0x81 | 接口名称 |\n| 0x82 | IPv4 地址对 |\n| 0x83 | IPv6 地址对 |\n| 0x84 | MAC 地址对\
  \ |\n| 0x85 | 运营商定义的链路标识符 |\n| 0x86 | 密钥披露 |\n| 0x87 | 披露签名 |\n\n**表 4.2:** 子元素类型代码\n\
  \n`CODE` 字段被设置为值为零并被接收者忽略 12。`Checksum` 包含 `Type` 字段开始的 ICMP 消息之和的 16 位反码 12。在生成实际校验和之前，默认校验和被设置为零\
  \ 13。\n\n\n\n\n\n在 ICMP 溯源方案中，攻击的全路径是通过配置路由器统计性地选择数据包，并生成如图 4.6](#toc.xhtml#s144a)\n\
  \n`源路径隔离引擎`（`SPIE`）技术使用 Bloom 过滤器来追踪恶意包的源头，并获取其目的地及接收时间 15。Bloom 过滤器用于存储数据包摘要的空间高效型数据结构。该技术不需要存储整个数据包，而是只需要摘要。路由器将带有时间戳的数据包摘要存储在摘要表中，并对通过它的每个转发数据包维护日志。SPIE\
  \ 减少了被窃听的漏洞，并在单位时间内减少了高达链路带宽 0.5% 的内存需求 [16]。\n\n在 SPIE 中，路由器维护一个缓存以保存每个转发数据包的信息，当入侵检测系统检测到数据包存在攻击性活动时，就会向\
  \ SPIE 查询相关时间段的数据包摘要。收到的响应结果被用于定位数据包源，并使用`反向路径泛洪`（`RPF`）算法重构反向攻击路径。\n\n### 4.7.5.1\
  \ SPIE 架构\n\n数据包审计、查询处理和攻击图生成是 SPIE 执行的主要活动。SPIE 中的每个路由器都配备了`数据生成代理`（`DGA`），它在每个数据包离开路由器时生成该数据包的摘要。DGA\
  \ 以软件代理的形式部署，为交换总线或辅助设备提供接口。在哈函数的帮助下，数据包摘要映射到摘要表中。摘要表频繁刷新，以代表特定时间段通过路由器的流量模式：\n\n\
  ![](img/Figure-4.8.jpg)\n\n**图 4.8:** SPIE 架构\n\n图 4.8 展示了 SPIE 架构，其中取了名为 `A`、`B`\
  \ 和 `C` 的三个网段。这三个网段属于三个不同的组织，拥有各自的数字基础设施。DGA 维护自己的摘要表，当对数据流量模式产生兴趣并请求时，它将其交付给同一网络的\
  \ SCAR 代理。SCAR 代表`SPIE 收集与简化代理`，用于存储数据包摘要和摘要表以便进行长时间的存储和分析。每个网段都有自己的 SCAR 代理，控制所有路由器及其活动。SCAR\
  \ 检查特定网段内使用的拓扑结构，密切监控数据包通过所有路由器的移动，并促进跨网段的数据包溯源。由于规模巨大，一个网段可以有多个 SCAR 代理以覆盖其包含的所有区域。SCAR\
  \ 代理负责在其自身的覆盖范围内准备攻击图。完整的攻击图由`SPIE 溯源管理器`（`STM`）通过合并来自所有网段的每个 SCAR 代理收到的攻击图来准备。\n\
  \nSTM 控制 SPIE 系统，并作为入侵检测系统请求恶意包溯源的接口。当 IDS 向 STM 提交查询以了解数据包跨网段的传输路由时，STM 验证请求并与相应的\
  \ SCAR 通信，收集攻击路径信息以形成完整的攻击路由 15。\n\n## 4.8 IP 溯源方案的评估\n\nIP 溯源技术并非用于停止网络攻击，而是用于定位执行恶意活动的真实源头\
  \ 17。犯罪分子经常努力使追踪网络犯罪源头变得复杂，并通过伪造来隐藏原始 IP 地址。文献显示有多种溯源机制，每种机制都以自己的方式声称其优越性。对现有溯源机制的评估至关重要，因为它有助于了解每种机制的优缺点，并对开发更好的溯源方案有利。Vijayalakshmi\
  \ Murugesan 等人 7 对溯源机制进行了简要综述，评估参数如图图 4.9 所示。下一节描述了用于衡量和评估溯源方案的相同参数。\n\n### 4.8.1\
  \ 可部署性\n\n`可部署性`意味着在网段上安装硬件和软件。溯源方案可能需要安装软件和硬件，应该在不对基础设施进行过多且不必要的更改的情况下支持网络环境 7。大多数现有的溯源方案现在需要对数字基础设施进行更改才能激活，因为路由器不支持标记和日志记录。\n\
  \n### 4.8.2 可扩展性\n\n`可扩展性`指的是如果在溯源方案中添加一个设备，需要在其他设备上更新的额外配置数量。它是溯源方案调整自身以便在规模不断增长的网络中运行的能力。设备之间过多的配置依赖性会降低可扩展性。在理想的溯源方案中，应该是零影响的可扩展性，这意味着设备的配置更改或新硬件的插入不需要更新。\n\
  \n### 4.8.3 内存需求\n\n内存需求是了解溯源方案有效性的另一个重要指标。某些溯源方案在路由器和专用服务器上留出额外的存储空间，存储数据包以分析恶意活动。理想的溯源方案不应需要额外的存储，因为它会引入开销并干扰网络性能。大多数溯源方案（如标记和日志记录）需要路由器存储，但\
  \ iTraceback 方案不需要存储来分析数据包：\n\n![](img/Figure-4.9.jpg)\n\n**图 4.9:** 溯源方案评估参数\n\n\
  ### 4.8.4 路由器处理开销\n\n数据包的传输及其路由共享相同的网络带宽，且数据包的移动涉及路由器，因为每个数据包都必须经过它们。溯源方案中的路由器处理开销是不希望的，因为这些会降低网络性能并由于额外的功能使路由器忙碌。理想情况下，溯源方案应该具有最小的路由器处理开销，但实际上这似乎是不可能的，因为数据包移动意味着为路由器产生了开销。\n\
  \n### 4.8.5 可靠性\n\n`可靠性`意味着对结果的置信。较小的覆盖范围和网络设备的较少参与产生可靠的结果。这是因为它们受到了频繁的监控。溯源方案需要高水平保护，因为网络设备统计数据的操纵可能会误导安全管理员组装攻击路径。溯源方案中的保护意味着只产生可靠的溯源，排除假阳性和假阴性。对于一个汇总每个路由器统计数据的溯源方案，如果其中一个路由器未能产生结果，就有更大的失败可能性。\n\
  \n### 4.8.6 单包溯源\n\n\n\n\n大多数溯源方案通过分析流量模式来检测入侵行为。这些方案需要分析多个数据包才能获取完整的攻击路径。攻击者现在已经改变了攻击方式，并通过单个数据包触发攻击。因此，追踪单个恶意数据包现在已成为溯源方案中亟需纳入的功能需求。`SPIE`\
  \ 方案具有追踪单个恶意数据包的能力，但其余方案仍需要多个数据包和路由器来检测入侵行为。\n\n# 4.8.7 对不同攻击的适用性\n\n网络攻击可以分为两大类：泛洪攻击（flooding\
  \ attacks）和软件漏洞攻击[`7`。在泛洪攻击中，犯罪分子通过发送冗余请求来过载系统；而在软件漏洞攻击中，只需少数恶意数据包就足以控制系统。软件漏洞攻击的发生由于受害者机器操作系统中存在漏洞。溯源方案应该具备处理泛洪攻击和软件漏洞攻击的能力，并应适用于这些攻击的每个子类。\n\
  \n# 4.8.8 对网络拓扑的先验知识\n\n某些溯源方案在运行前会预先考虑底层拓扑。这些方案使用固定算法工作，不采用策略的即时变化。犯罪分子现在变得更加聪明，并且非常清楚所用于溯源的算法；因此，溯源方案能够纳入即时变化以获得可靠的追踪是理想的。使用预建立的拓扑意味着为犯罪分子提供了利用溯源方案及其机制的机会。\n\
  \n### 4.8.9 准确性\n\n溯源方案应当完全避免误报（false positive）和假阴性（false negative）。误报意味着将合法节点标记为犯罪节点，而假阴性是指将犯罪节点标记为合法节点。由于\
  \ `DPM` 和 `PPM` 溯源方案依赖于多个数据包来存储 IP 地址，这可能会导致误报。`SPIE` 创建数据包摘要并维护带有布隆过滤器的哈希表；因此，哈希中的覆盖可能会产生误报和假阴性。\n\
  \n### 4.8.10 攻击后分析\n\n如果网络犯罪分子成功实现了他的目标，那么网络犯罪带来的利益将必然促使他再次犯罪。这意味着无论他们是否正在实施犯罪，识别犯罪分子都是至关重要的。某些溯源方案需要攻击处于“活跃”状态才能工作以准备攻击图，这并不是理想的情况。溯源方案应该在攻击停止后仍能运行并能够准备攻击图。\n\
  \n# 4.8.11 攻击者对方案的挑战\n\n溯源方案及其运行机制的持续变化是理想的。如果犯罪分子知道特定溯源方案背后的工作算法，那么他也将意识到其优缺点。缺点可以被利用来规避检测并隐藏位置。假设攻击者知道某个机构使用基于泛洪的溯源方案来识别恶意数据包的来源，那么他将不会使用泛洪方法实施犯罪，因为他有替代方案可以采用基于签名的方法进行攻击。\n\
  \n# 4.8.12 路由器在溯源中的参与\n\n路由器是数据包传输到目标的路径。攻击者还将恶意数据包与合法数据包一同发送以实施犯罪。路由器记录每个数据包的源和路由信息。由于路由器负责传递恶意数据包，意味着路由器可以被犯罪分子访问并根据其要求进行配置。不需要路由器即可追踪恶意数据包的溯源方案被认为是良好的。`DPM`、`PPM`\
  \ 和 `iTraceback` 方案通过受害者端追踪攻击者，不需要路由器支持。\n\n# 4.8.13 IP 头部中覆盖的位数\n\nIP 头部并不便于存储审计日志。管理员利用很少使用的字段（如\
  \ `identification` 字段）来存储审计日志。溯源方案覆盖 `Identification` 字段的内容来写入审计日志。同样，`fragment\
  \ offset`（分片偏移）、`TOS` 和 `flag` 字段也会被覆盖以容纳追踪信息。被覆盖的字段会影响分片流量，因此支持覆盖位越少的溯源方案被认为更好。\n\
  \n# 4.8.14 溯源所需的数据包数量\n\n需要最少数据包即可追踪来源的溯源方案被认为是更好的。在路由器之间存储少量数据包是容易的，它们的分析需要较少的时间来提取攻击路径细节。最少数量数据包的参与减少了误报和假阴性的概率。\n\
  \nVijayalakshmi Murugesan 等人 ``7`] 评估并比较了流行的溯源方案，如下表表 4.3` | `确定性标记 (DPM)` | `基于代数的溯源方法\
  \ (ATA)` | `iTraceback` | `源隔离引擎 (SPIE) 或基于哈希的溯源` |\n| :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| **部署** | 平均 | 平均 | 好 | 好 | 好 |\n| **可扩展性** | 差 | 一般 | 中等 |\
  \ 好 | 平均 |\n| **内存需求** | 网络侧不需要，受害者侧需要 | 中等需求 | 中等需求 | 中等需求 | 有限需求 |\n| **路由器处理开销**\
  \ | 中等 | 中等 | 高 | 低 | 低 |\n| **可靠性** | 好 | 好 | 可能会产生误报和假阴性 | 好 | 误报和假阴性的概率有限 |\n\
  | **单数据包溯源** | 不需要大量数据包 | 与 PPM 相比需要较少数据包 | 需要溯源   | |\n| **对不同类型攻击的适用性** | DoS/DDoS\
  \ 泛洪攻击 | DoS/DDoS 泛洪攻击 | 适用于网络攻击 | 适用于网络层攻击 | 适用于基于网络的攻击 |\n| **对网络拓扑的先验知识** | 不需要\
  \ | 不需要 | 需要 | 不需要 | 需要 |\n| **准确性** | DDoS 攻击中误报率高 | 好 | 中等 | 好 | 好 |\n| **攻击后分析**\
  \ | 可能 | 可能 | 不可能 | 可能 | 可能 |\n| **攻击者对方案的挑战** | 差 | 差 | | | | |\n| **路由器在溯源中的参与**\
  \ | 不需要 | 不需要 | 需要 | 不需要 | 需要 |\n\n表 4.3：溯源方案评估与比较\n\n# 4.9 主动响应特性\n\n为了应对网络入侵，有效且快速的响应是必要的。主动追踪方法是理想的，因为这些方法不需要额外的存储和对存储的网络流量进行检查来检测威胁。理想情况下，有效的主动追踪响应应具备以下特性：\n\
  \n1. 它应该能够实时消除检测到的入侵。\n2. 它应该具备防止犯罪分子进一步攻击目标的能力。\n3. 它应该有助于通过法律证据识别犯罪分子。\n4. 它应该能够恢复受攻击的计算机和服务器，将其恢复到之前的状态。\n\
  \n\n\n\n5. 它应该能够识别从源节点到目标的恶意包传输路径，以便对完整的恶意路径有一个了解。\n\n6. 它应该具备防止未来与之前检测到的入侵相似的入侵的能力。\n\
  \n# 4.10 休眠水印追踪 (SWT)\n\n`Sleepy Watermark Tracing`（`SWT`）方法是一种主动追踪方法。它之所以被称为`休眠`，是因为在没有检测到任何入侵时，它不会产生开销\
  \ 18。当目标节点感知到入侵时，它会在反向连接中注入水印，并使入侵路径上的所有中间路由器变为激活状态。与现有的追踪方案相比，SWT 许多优势。这些优势描述如下：\n\
  \n1. SWT 将入侵追踪与入侵检测区分开来，且除了目标节点外，入侵路径上的所有节点都不需要具备入侵检测能力 18。\n\n2. 它的工作方式与指纹识别、基于时间和基于偏差的方法不同，且不需要存储所有入站和出站连接以通过计算相关性来检测入侵\
  \ 19。\n\n3. SWT 不需要时钟同步。\n\n4. SWT 对重传变动具有鲁棒性。\n\n5. 它在需要时会追踪入侵和恶意包。\n\n6. 在 SWT\
  \ 方法中，攻击者在入侵检测活动期间不需要一直处于激活状态，攻击者的一次按键操作就足以将入侵连接链追溯到其源头 18。\n\n7. 它不会给路由器带来可观的开销。\n\
  \n8. 它在目标主机上需要少量的网络服务器应用程序来注入水印。\n\n### 4.10.1 SWT 概念\n\n为了密切观察针对主机的网络入侵，观察主机到最近的路由器或网关是理想的。主机最近的路由器或网关被称为该主机的`守护网关`（Guardian\
  \ Gateway）。主机 `H` 的`入站守护网关`（Incoming Guardian Gateway）被定义为向其转发网络流量的最近路由器。从主机 `H`\
  \ 进一步转发网络流量的最近路由器被称为`出站守护网关`（Outgoing Guardian Gateway）。网络中的一个主机可能有多个入站守护网关和出站守护网关：\n\
  \n![](img/Figure-4.10.jpg)\n\n**图 4.10:** 守护网关集\n\n`入站守护网关`和`出站守护网关`的并集被称为`守护网关集`（Guardian\
  \ Gateway Set）。图 4.10 中的路由器集 `{GW[in1], GW[in2], GW[in3],GW[out1],GW[out2]}`被称为守护网关集。假设\
  \ `G`是一个守护网关集，`G`中的主机被称为`受保护主机`（Guarded hosts），它们的守护网关集是 `G` 的子集 18, 19。Xinyuan\
  \ Wang 等 18, 19 将`leap`（跳）定义为连接链中主机之间的连接步骤。从主机 `H1` 到主机 `H2` 的网络连接被称为图 4.11 所示的`追踪模型中的跳`：\n\
  \n![](img/Figure-4.11.jpg)\n\n**图 4.11:** 追踪模型\n\n一个跳可以包含多个跳数，并为两个端主机两个守护网关。一个跳通过具有以下字段五元组指定：\n\
  \n1. 协议号\n2. 源 IP 地址\n3. 目的 IP 地址\n4. 源端口号\n5. 目的端口号\n\n# 4.10.2 SWT 基本假设\n\nXinyuan\
  \ Wang 等 18, 19 基于以下假设构建了休眠水印追踪框架：\n\n1. 入变为交互性和双向的\n2. 假设路由器是可信的，而主机则不然\n3. 每个主机至少有一个\
  \ SWT 守护网关\n4. 连接的链路之间不存在加密\n\n第一个假设与入侵的性质有关。SWT 中的入侵是指以未经授权访问为目标的攻击，而非泛洪。Xinyuan\
  \ Wang 等 18, 19 在 CERT 安全事件研究中得出，大多数未经授权的访问事件发生在主机上，而不是包含其中的路由器上。因此，在第二个假设中，主机被认为比路由器更容易受到。为了简化\
  \ SWT 架构的阐述，认为每个主机至少有一个守护网关，但实际上，它可能有多个守护主机。Xinyuan Wang 等 18, 19 注意到连接中缺乏链路间的加密，并关联跨入站和出站连接的网络流量来检测入侵。这就是在第四个假设中忽略跨连接网络流量加密的原因。\n\
  \n# 4.10.3 SWT 架构\n\n休眠水印追踪架构包含两个重要组件：`SWT 受保护主机`（SWT guarded host）和`SWT 守护网关`（SWT\
  \ guardian gateway）。SWT 受保护主机需要来自 SWT 和 SWT 守护网关的保护，而 SWT 守护网关帮助 SWT 运行以实现对受保护主机的保护。Xinyuan\
  \ Wang 等 18, 19 在其图 4.12 所示的 SWT 架构中为每个受保护主机使用了唯一的 SWT 守护网关。一个 SWT 守护网关可以保护一个或多个受保护主机。受保护主机的列表与其相应的守护网关一起准备，以便更好地控制：\n\
  \n![](img/Figure-4.12.jpg)\n\n**图 4.12:** SWT 架构\n\nSWT 受保护主机包括入侵检测系统（Intrusion\
  \ Detection System）和水印启用应用程序（Watermark Enabled Application）作为支持组件。SWT 受保护主机中的入侵检测系统有一个连接外部\
  \ IDS 的接口。该接口负责 SWT 追踪。一旦检测到主机内部发生入侵，入侵检测系统就会与 SWT 子系统通信并触发主动水印追踪以追踪恶意包。水印启用应用程序指的是网络服务程序，如\
  \ `telnetd` 和 `rlogind`，可以根据请求注入水印。\n\nXinyuan Wang 等 18, 19 在其 SWT 架构中主要强调了三个交互组件：`休眠入侵响应`（`SIR`）、`水印相关性`（`WM`）和`主动追踪`（`AT`），并详细说明了如何检测和追踪活动以保护基础设施不受损害。`休眠入侵响应`（SIR）接收入侵检测系统的追踪请求并与主动追踪组件协作密切监控入侵。SWT\
  \ 守护网关处的`水印相关性`（WM）单元关联入站和出站连接。主动追踪负责与架构中的所有其他组件通信，并协作追踪恶意包的完整路径并检测其源头。\n\n# 4.10.4\
  \ 休眠入侵响应\n\n\n\n\n\n`Sleepy Intrusion Response` (`SIR`) 单元在 SWT 追踪中起着至关作用。它属于 SWT\
  \ 受保护主机，并与同一主机上的入侵检测系统和启用水印的应用程序通信，以追踪入侵。为了避免开销并提高效率，`SIR` 在 SWT 架构中引入了“睡眠性”（Sleepiness）。睡眠性意味着追踪系统在入侵发生被入侵检测系统检测之前处于非活动状态。默认情况下，SWT\
  \ 系统保持非活动模式，当 IDS 检测到入侵并通过 `SIR` 通知活动追踪单元时会被激活。`Sleepy Intrusion Response` 最初以活动模式记录入侵连接，并触发其守护网关上的活动追踪单元。`SIR`\
  \ 还会通知启用水印的应用程序断开入侵连接并注入水印，以便反向追踪以到达源头。`SIR` 管理从 SWT 守护网关接收的关于入侵的追踪信息，并在 IDS 请求时向入侵检测系统提供这些细节。如果在规定的超时时间内未收到来自\
  \ SWT 守护网关的任何关于入侵的内或通知，`Sleepy Intrusion Response` 单元将进入睡眠模式。\n\n### 4.10.5 启用水印的应用程序\n\
  \n`Watermark`（水印）是指注入网络中的一小部分信息，用于唯一标识连接链。理想情况下，水印代表几乎可以不计的代码，易于通过网络流量注入，并具有对普通用户不可见且能够自我规避网络应用程序软件检测的能力。`Watermark`\
  \ 预期保持不变，因为它被用于衡量跨连接的入站和出站网络流量之间的相关性。水印的主要挑战是让它对终端用户可见。在如 `telnet` 和 `rlogin` 等基于文本的网络应用程序中，它类似于用于在文本中隐藏数据的加密。Xinyuan\
  \ Wang 等 [18], [19] 倾向于使用空白空间法通过操作空白来隐藏文本中的数据。在空白空间方法中，机信息的位通过在文中添加额外的空白来实现。这些空白添加在行末尾，并可以放在段落末尾\
  \ [20]。为了更清楚地说明，假设跨网络应用程序显示的字符串可能与实际显示的并不完全相同。可以通过以下示例理解这一点：\n\n假设以下字符串\n\n“Computer\
  \ Network\\b\\b\\b\\b\\b”传输到 `telnet` 或 `rlogin`，显示如下：\n\n“Computer Network”\n\n\
  在这里 `\\b` 代表一个空格。\n\nXinyuan Wang 等 [18], [19] 定义网络应用程序的虚拟空字符串为对终端用户看起来为空的字符串。在上述述字符串中，“\\\
  b\\b\\b\\b\\b”是 `telnet` 和 `rlogin` 的虚拟空字符串。因此，虚拟空字符串是使水印对网络应用程序不可见的方便方法。\n\n`Watermark`\
  \ 变得特定特定，需要由应用程序本身插入反向流量中 [18]。`Watermark-enabled application` 指服务器端网络应用程序，可以被修改为在每次被请求时向其响应流量中注入水印\
  \ [19]。如图 [图 4.12] 所示，启用水印的应用程序需要处理来自 `SIR` 单元的两个请求。第一个请求是 `WM-Start`，通知启用水印的应用程序在指定的时间段向网络流量中注入水印。第二个请求是\
  \ `WM-End`，指示启用水印的应用程序停止向网络流量中注入水印。\n\n### 4.10.6 水印相关性\n\n为了追溯连接链上的入侵，我们需要一种机制来比较入站网络流量和出站网络流量，以匹配位于同一连接链上的相邻连接。连接匹配机制定义为\
  \ `correlation`（相关性）。SWT 方法不信任主机，而是认为路由器是可靠。因此，SWT 比较并关联跨 SWT 守护网关的网络流量。对于受保护主机，通过\
  \ SWT 守护网关的网络流量大致分为两类：`guarded`（受保护）和 `bypassing`（旁路），如图 [图 4.13] 所示。`guarded` 流量指的是终止于或自属于\
  \ SWT 守护网关的主机的网络流量。入站跳和出站跳之间的相关性也被计算，以获 SWT SWT 网关处的匹配程度：\n\n![](img/Figure-4.13.jpg)\n\
  \n**图 4.13:** 网络流量传输\n\n守护网关的主要挑战是在当单个守护网关存在多个入站和出站跳时计算相关性。Xinyuan Wang 等 [18],\
  \ [19] 在他们的单个 SWT 受保护主机模型中考虑了 `m` 个入站跳和 `n` 个出站跳，并测量了 `mxn` 种可能的相关的组合以匹配跨受保护主机的流量。\n\
  \n## 结论\n\n在本章中，我们认为仅检测入侵尚不足以减少网络犯罪的负面影响，相反，我们还需要追踪恶意流量传输的攻击路径，以了解网络犯罪的真实源头。我们定义了网络取证，并展示了入侵活动的分类，以了解它们在预防网络犯罪中的作用。我们详细说明了罪分子如何在网络基础设施中实现匿名性，以避免检测并用他人的身份犯罪。本章对追溯方案进行了分类，并详细说明了它们的实现，以便找到恶意数据包传输的路由。本书的下一章将详细介绍互联网上的问责问题，并展示跳板如何使刑事识别过程复杂化。入侵响应系统被分类，并阐述了每种系统的活动，以了解它们在互联数字环境中的适用性。\n\
  \n## 记忆点\n\n* `Cyber forensic`（网络取证）指的是一种科学过程，对恶意活动期间留下的数字证据进行识别、封存、收集、认证、分析、记录和保存。\n\
  * `Cyber forensic` 基本上是一门从相关硬件和软件中提取取证信息的科学，这些信息可以在法律诉讼期间作为证据提交。\n* `Intrusion detection`（入侵检测）意味着检测网络流量中的恶意代码。\n\
  * `Intrusion prevention`（入侵预防）指的是确保特定节点或基础设施免受恶意威胁的程序。\n* `Intrusion tolerance`（入侵容忍）是系统和基础设施承受入侵的能力，同时确保系统的可用性和完整性。\n\
  * `Intrusion response`（入侵响应）意味着应用对抗措施来修复原因，以防止未来的攻击。\n* `Attribution`（归因）指的是确定网络犯罪分子身份或位置的过程。\n\
  * `Identity of cybercriminal`（网络犯罪分子身份）整合地理位置、IP 地址、账户和以太网地址。\n* 伪造和修改源 IP 地址是隐藏实施犯罪的实际\
  \ IP 地址的流行方法。这种伪造被称为 `spoofing`（欺骗）。\n\n\n\n\n\n- `Time-to-live (TTL)` 逻辑被用于临时设置一个主机以触发网络攻击。\n\
  - `Laundering hosts`（洗钱主机）在数据包中注入延迟，以便在特定时期内保持不活跃状态。\n- `Internet Protocol`（网协议）地址唯一地标识网络上的设备。\n\
  - 在日志方案（logging scheme）中，路由器在数据包通过其时记录关于该数据包的信息，以确保怀疑的数据包是否由特定路由器转发。\n- 在标记方案（marking\
  \ scheme）中，路由器用之前的路径链路对数据包进行标记。\n- 当数据包通过路由器转发时，数据包会添加之前的路径链路信息，这有助于进一步重建恶意数据包的路径。\n\
  - `Inbound marking`（入站标记）不需要额外的带宽。\n- 数据包附带一个额外的 `ICMP` 数据包，其中保留了数据包详情，被称为 `outbound\
  \ marking`（出站标记）。\n- 在日志方案中，数据包摘要、签名和 `IP header` 字段等信息存储在所有传输数据包的所有路由器或少数路由器上。\n\
  - 在 `Probabilistic Packet marking (PPM)`（概率数据包标记）方案中，路由器以某种概率对数据包进行标记。\n- 误报是 `PPM`\
  \ 方案的主要缺点，它会干扰数据包的排序和概率。\n- `False negative`（漏报）是指路由器参与了真实攻击路径，但未包含在重建的路径中的情况。\n\
  - 在 `PPM` 中，可以注入带有错误信息的数据包并使其通过路由器成功标记。这通常被称为“标记伪造（mark spoofing）”。\n- 在 `Deterministic\
  \ Packet Marking (DPM)`（确定性数据包标记）中，`IP address` 被分成两个片段，每个片段包含 16 位。数据包在进入网络时被标记，并且在离开网络之前，数据包保持此标记不变。\n\
  - 在 `Algebraic-based traceback approch (ATA)`（基于代数的溯源方法）中，使用代数技术通过路由器将路径信息嵌入数据包中，并将路径信息编码为多项式上的点。\n\
  - 在 `ICMP traceback scheme` 中，通过配置路由器统计性地选择数据包来确定攻击的全路径。\n- `Bloom filter`（布隆过滤器）是一种用于存储数据包摘要的空间高效型数据结构。\n\
  - `Scalability`（可扩展性）指的是如果在溯源方案中添加一个设备，需要更新其他设备上的额外配置数量。\n- 距离主机最近的路由器或网关被称为该主机的“Guardian\
  \ Gateway”（守护网关）。\n- 主机 `H` 的 `Incoming Guardian Gateway`（入站守护网关）定义为向其转发网络流量的最近路由器。\n\
  - 从主机 `H` 进一步转发网络流量的最近路由器被称为“Outgoing Guardian Gateway”（出口守护网关）。\n- `Incoming Guardian\
  \ Gateway` 和 `Outgoing Guardian Gateway` 的并被称为“守护网关集（Guardian Gateway Set）”。\n-\
  \ `Watermark`（水印）是指注入网络中的一小段信息，用于唯一标识连接链。\n- 需要最少数据包即可追踪溯的溯源方案被认为更好。\n\n## 单选题\n\
  \n1. **以下哪项不是针对入侵的行为？**\n    1. 入侵收集（Intrusion collection）\n    2. 入侵检测（Intrusion\
  \ detection）\n    3. 入侵防御（Intrusion prevention）\n    4. 入侵响应（Intrusion response）\n\
  2. **Reflector host（反射器主机）的功能是：**\n    1. 注入水印\n    2. 隐藏罪分子\n    3. 检测入侵\n    4.\
  \ 在恶意数据包中注入延迟\n3. **Laundering host（洗钱主机）的功能是：**\n    1. 注入水印\n    2. 在数字盾牌后隐藏罪分子。\n\
  \    3. 在数据包中注入延迟\n    4. 从 `SIR` 单元收集信息。\n4. **网协议版本 6 (IPv6) 提供了：**\n    1. 16\
  \ 位地址空间\n    2. 32 位地址空间\n    3. 64 位地址空间\n    4. 128 位地址空间\n5. **以下哪项支持标记？**\n\
  \    1. `PPM`\n    2. `ATA`\n    3. `ICMP`\n    4. `SPIE`\n6. **SPIE 代表：**\n   \
  \ 1. 搜索路径隔离引擎 (Search Path Isolation Engine)\n    2. 源路径隔离引擎 (Source Path Isolation\
  \ Engine)\n    3. 最短路径隔离引擎 (Shortest Path Isolation Engine)\n    4. 适用路径隔离引擎 (Suitable\
  \ Path Isolation Engine)\n7. **以下哪项不是溯源的评估参数？**\n    1. 部署 (Deployment)\n    2.\
  \ `Scalability`（可扩展性）\n    3. 可用性 (Usability)\n    4.可靠性 (Reliability)\n8. **SWT\
  \ 代表：**\n    1. 源水印技术 (Source Watermark Techniques)\n    2. 睡眠水印技术 (Sleepy Watermark\
  \ Techniques)\n    3. 源水印溯源 (Source Watermark Tracing)\n    4. 睡眠水印溯源 (Sleepy Watermark\
  \ Tracing)\n\n## 答案\n\n1. a\n2. b\n3. c\n4. d\n5. a\n6. b\n7. d\n\n## 问题\n\n1. 详细描述网络取证（Cyber\
  \ forensic）。\n2. 定义入侵（Intrusion）并详细说明入侵活动的分类。\n3. 描述罪分子隐藏其位置的各种策略。\n4. 什么是溯源（traceback）？详述在开发有效溯源方法时考虑的各种假设。\n\
  5.  `IP address` 在溯源机制中的作用。\n6. 解释以下概念：\n    1. Reflector Host（反射器主机）\n    2. Laundering\
  \ hosts（洗钱主机）\n    3. Guardian Gateway（守护网关）\n    4. Sleepy Intr Response（睡眠入侵响应）\n\
  \    5. Watermark（水印）\n7. 详细解释溯源方案（Traceback Schemes）的分类。\n    1. `PPM` 与 `DPM`\n\
  \    2. `Incoming Guardian Gateway` 与 `Outgoing Guardian Gateway`\n    3. `IDS`\
  \ 与 `SIR`\n    4. Guarded Host（受保护主机）与 Guarded Traffic（受保护流量）\n8. 定义源路径隔离引擎（Source\
  \ Path Isolation Engine）及其架构。\n9. 为什么我们需要评估溯源方案？描述用于评估溯源方案的参数。\n10. 响应（Active Response）的主要特征是什么？\n\
  11. 详细描述 Sleepy 溯源方法及其架构。\n12. Sleepy 溯源方法的假设假设？\n\n## 参考文献\n\n1. Susan C. Lee and\
