  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 关键国家基础设施\n* 机密性-完整性-可用性三元组\n* 防御生命周期\n* 入侵检测系统\n\
  * IDS 的特性\n\n## 目标\n\n本章的目标是解释关键国家基础设施的重要性，并详细阐述它如何面临网络犯罪分子的风险。通过 CIA 三元组和防御生命期的帮助，我们试图向读者解释信息安全的基础知识，并详细介绍经常被用于犯罪的可能漏洞类别。在本章中，你将了解入侵检测系统的运行机制及其详细架构，并掌握入侵检测与防御原理的知识。\n\
  \n## 3.1 关键国家基础设施\n\n20 世纪 90 年代中期，`关键基础设施`一词出现在文献中，指的是为了向公民提供基本服务、运行政府运作以及维持国家经济所需的物理和非物理资产、网络资源和系统\
  \ [1]。`关键国家基础设施`（`CNI`）是关键基础设施的子集，包含了那些政府认可并被认为具有国家战略重要性的关键基础设施元素 [2]。这些元素的失效甚至部分崩溃可能会对国家安全造成巨大的性后果。这些元素的丢失和泄露也可能对一个国家的经济和社会福祉造成严重而广泛的影响\
  \ [3]。关键国家基础设施包括对一个国家的财务和社会健康、安全、防护或经济福祉至关重要的过程、系统、设施、技术、网络、资产和服务 [4]。关键国家基础设施可以是独立的，也可以在世界各国之间共享。\n\
  \n关键国家基础设施就像是为在该国生存提供的服务的生命支持系统。大多数国家依靠高度复杂且先进的网络基础设施，以及互联的机构进行数据共享，以向公民提供快速可靠的服务\
  \ [5]。这些生命支持系统不断更新，以满足公民的需求。政府正努力使这些系统更高效、更有力，并采用了许多技术进步来保障公民的健康、安全、防护和经济福祉。全球互联性和全球化允许对关键国家基础设施进行远程监控、运行和控制，如果控制权落入错误的人之手将是有害的\
  \ [5]。对这些的高度依赖和实时连接使其极易受到威胁，并增加了成为频繁攻击目标的风险。跨国界的组织、机构和个人之间的依赖关系和互连性可能会导致攻击产生深远影响，甚至单次攻击就能对多个关键系统造成中断和破坏，并中断其服务交付过程\
  \ [5]。\n\n## 3.2 机密性-完整性-可用性三元组\n\n一种简单但广泛使用的系统安全模型是 CIA 三元组，它解释了在系统和数据安全领域中名为机密性、完整性和可用性的这三个关键参数的重要性\
  \ [21]。为了确保数据和系统安全，在分析中应纳入这三个参数以满足安全标准。如果这三个参数中的一个被攻破，可能会对系统安全造成严重的后果。`图 3.1` 显示了\
  \ CIA 三元组，该模型至今仍被用于规划信息安全框架，并在组织内部制定安全指南：\n\n![](img/Figure-3.1.jpg)\n\n**图 3.1:**\
  \ CIA 三元组\n\n安全管理员根据威胁对任何组织数字资产机密性、完整性和可用性的影响来评估威胁。这些描述如下：\n\n* **机密性**：机密性是指防止未经授权的人查看敏感数据信息的能力。维护机密性的常用方法是使用加密技术，如\
  \ `SSL`（安全套接层）和 `TLS`（传输层安全）。访问控制也在这一方面为我们提供帮助，因为它只允许合法用户访问。\n* **数据完整性**：数据完整性是对数据原始性的保证。它是确保可用数据副本是原始数据准确且未被修改的表示的能力。维护数据完整性最常用的技术是数字签名，此外，`SSL`、`TLS`\
  \ 和介质访问控制（`MAC`）也被用于保护原始数据。\n* **可用性**：确保合法用户在需要时随时访问数据和相关资源至关重要。需要身份验证机制、访问控制和系统共同工作，以确保数据和资源的可用性。可以通过硬件维护、软件补丁和网络优化来保障可用性。\n\
  \n## 3.3 防御生命周期\n\n安全威胁现在迅速出现，导致不仅具有财务价值而且带有商业秘密的数据泄露。监控在线活动的威胁可能会泄露你的个人信息，破坏你的社会形象，并允许陌生人窥探。防御生命周期检查互联的数字环境并发出系统入侵的信号。当系统和网络的机密性、完整性和可用性被破坏时，它会警告安全管理员。`图\
  \ 3.2` 所示的防御生命周期分为四个阶段工作，即分析、缓解、预防和维护：\n\n![](img/Figure-3.2.jpg)\n\n**图 3.2:**\
  \ 防御生命周期\n\n\n\n\n在分析阶段，会进行审计以搜索漏洞和配置错误。对操作系统文件和数据文件的完整性进行评估，并通过统计分析检测异常活动以了解攻击模式。一旦检测到入侵的发生，将通知安全管理员，以保护互联的数字基础设施并减轻其负面影响。在缓解阶段，会识别并对入侵模式进行分类，并将其与已识别的攻击模式进行匹配，以获得快速解决方案。缓解过程处理减少入侵影响的程序。它还涉及漏洞补丁过程，并防止恶意流量在网络中传输。防御阶段通过快速丢弃恶意数据包并重新配置连接以将数据传输到后续节点。防御阶段通过快速阻止可疑威胁来做出响应，以防止其进一步传输。更改恶意数据包的内容并对安全控制进行重新配置以中断攻击。\n\
  \n## 3.4 入侵及其类型\n\n入侵是指软件、节点、网络和 IT 基础设施内部的恶意活动。它是一系列违反安全策略的行为，包括违反数据的完整性、机密性以及服务的可用性，同时也通过利用系统、网络、软件和基础设施中的漏洞。`[\
  \ 3.3 ]` 显示了各种类别的入侵：\n\n![](img/Figure-3.3.jpg)\n\n**图 3.3:** 入侵分类\n\n尽管已经开发了加密、防火墙和安全通信访问控制等多种防御机制，但所有反威胁系统都有自己的局限性。防火墙主要保护前线系统访问受到威胁和攻击。加密有助于安全通信，而访问控制处理权限和身份验证目的。然而，这些反威胁机制保护系统免受外部威胁，但不足以检测内部威胁。以下\
  \ `[ 表 3.1 ]` 详细列出了入侵的不同类别：\n\n| 攻击类型 | 攻击名称 | 描述 |\n| :--- | :--- | :--- |\n| **主动攻击**\
  \ | 恶意数据包丢弃 | 在流量中注入恶意数据包 |\n| | 路由攻击 | 黑洞 | 路由器删除需要转发的数据包。 |\n| | | 灰洞 | 充恶意节点注入恶意流量并恢复正常。\
  \ |\n| | | 拥塞 | 帮助实现数据包丢失和延迟。 |\n| | | 睡眠剥夺 | 帮助特定节点的功耗最大化。 |\n| | | 欺骗 | 设备伪装另一个设备以接收数据包或发动攻击。\
  \ |\n| | | 世女攻击 | 节点创建多个虚假身份以获得不成比例的影响。 |\n| **被动攻击** | 窃听 | 恶意捕获网络流量供以后分析。 |\n\
  | | 流量分析 | 分析通信模式以发动攻击。 |\n| | 位置泄露 | 捕获有关节点位置和网络结构的信息。 |\n| **欺诈** | 劫持 | 犯罪分子控制网络并将通信置于自己的控制之下\
  \ |\n| | 篡改 | 攻击者渗透网站并更改其外观和内容。 |\n| | 钓鱼 | 试图窃取个人数据，如登录凭据和信用卡号。 |\n| | 非法投资 | 非法使用他人账户进行投资。\
  \ |\n| | 账户劫持 | 导致受损银行账户产生欺诈交易。 |\n| | 非法购买 | 使用盗取的、损坏的虚假的信用卡和借记卡支付账单。 |\n| | 彩票诈骗\
  \ | 这种犯罪始于一封意外邮件，通知某人中了大笔资金，并要求其支付预付款以获取更多详情。 |\n| | 未授权交易 | 涉及从劫持的银行账户或盗取的信用卡支付费用。\
  \ |\n| | 伪劣物品 | 以原装产品的价格交付劣质物品。 |\n| **嗅探器攻击** | | | 攻击者密切监控通过通道的数据流量。 |\n| **隐蔽通道攻击**\
  \ | 存储通道攻击 | 在这种攻击中，关键信息被交给犯罪分子供恶意使用。 |\n| | 通道攻击 | 与操作有关，用于发动攻击。 |\n| **侧信道攻击**\
  \ | 时间攻击 | 分析通信模式以发动攻击。 |\n| | 功耗攻击 | 通过消耗能量来破解算法。 |\n| | 功耗分析 | 利用功耗破解加密系统。 |\n\
  | | 故障分析 | 通过引入计算中的故障来发现秘密。 |\n| | 缓存侧信道 | 利用共享内存检索敏感信息。 |\n| | 硬件侧信道 | 利用硬件特性，如运行时间和电流。\
  \ |\n| **低速率 TCP 攻击** | | 通过大量发送恶意数据包破坏 TCP 拥塞机制。 |\n| **漏洞攻击** | | | 漏洞是利用漏洞和安全缺陷的恶意代码。\
  \ |\n| **内部攻击** | 用户到 root | 恶意代码中断 root 用户并防止访问根目录。 |\n| | 端口扫描 | 端口扫描有助于发现可利用的漏洞和缺陷。\
  \ |\n| | 洪水攻击 | 洪水用于填充内存缓冲区。 |\n| **恶意攻击** | 僵尸网络 | 受攻击者控制的计算机组。 |\n| | 恶意软件 | 秘密安装在他人计算机上的软件，以获取个人和财务信息。\
  \ |\n| | 恶意软件托管 | 在合法服务器上托管恶意网站或放置恶意代码。 |\n| **DDoS/DoS** | 缓冲区溢出 | 导致流量导向超过其处理能力的节点或服务器。\
  \ |\n| | Ping 死亡 | 发送大量 ICMP 数据包，使试图处理请求的服务器过载。 |\n| | Smurf 攻击 | 一种资源消耗攻击，利用所有可用带宽并使系统处于不可状态。\
  \ |\n| | UDP 洪水 | 发送大量 UDP 数据包，使试图处理请求的服务器过载。 |\n| | SYN 洪水 | 发送大量 SYN 请求消耗服务器资源，导致合法用户无法响应。\
  \ |\n| **网络骚扰** | 网络欺凌 | 在网上编写或发布内容，旨在伤害、骚扰或让他人感到不快。 |\n| | 网络跟踪 | 利用互联网技术进行骚扰或恐吓某人。\
  \ |\n| | 宗教 | 在互联网上对特定宗教进行批评并煽动社区暴力。 |\n| | 种族 | 人因其种族在电子媒体上收到负面和攻击性的评论 |\n\n\n\n\
  \n\n| 类别 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| **内容相关** | 国家 | 泄露与国家安全的机密。 |\n\
  | | 知识产权 | 泄露具有经济价值的创新、新研究、方法、模型和公式。 |\n| | 色情 | 在互联网上传播描述或展示性器官的印刷或视频材料，如书籍、杂志、照片和视频片段。\
  \ |\n| **SQL 注入** | | SQL 注入是用于从企业数据库中非法获取记录的恶意数据库查询。 |\n| **垃圾邮件** | 垃圾邮件中继 | 攻击者拦截两人之间的通信并破坏消息的完整性。\
  \ |\n| | 垃圾邮件 | 指在电子邮件或手机上接收大量未请求的邮件。 |\n| **远程到本地用户** | | 涉及远程获取本地用户的权限。 |\n| **分布式攻击**\
  \ | 后门程序 | 一种通常用于绕过身份验证程序以访问系统的恶意代码。 |\n| | 木马 | 一种对系统造成破坏并干扰存储数据的恶意代码。 |\n| **应用层**\
  \ | | | 这些攻击中断了应用层的服务，如 `HTTP GET` 和 `HTTP POST`。 |\n| **密钥被泄露** | | | 攻击者通过盗取的数字密钥非法获得安全网络的访问。\
  \ |\n| **密码攻击** | 字典攻击 | 指通过输入字典中的每个单词来尝试破解密码。 |\n| | 登录暴力破解 | 指连续尝试使用可能的组合来猜测密码。\
  \ |\n| | 混合攻击 | 指尝试结合字典攻击和登录暴力破解的方法来猜测密码。 |\n\n**表 3.1:** 入侵分类\n\n为了开发有效的防威胁机制，了解攻击模式以及其在哪些领域产生负面影响至关重要，因为这些影响会破坏数据的完整性、可用性和机密性。例如，如果攻击破坏了数据库的完整性，则需要迅速做出响应以确保数据完整性；而对于网络攻击，则需要适当的响应来提高资源可用性和网络性能。\n\
  \n## 3.5 入侵检测系统\n\n入侵利用漏洞并可能造成巨大的损害。入侵背后的基本动机从间谍活动、利用到数据泄露和网络干扰不等。**入侵检测**（**ID**）是指监控计算机系统内部或网络中发生的事件和活动，并分析其是否存在入侵迹象以及寻求被攻破的可能性\
  \ [6]。它识别了破坏计算机和网络机密性、完整性和可用性的尝试。还会评估绕过安全机制的尝试，以发现漏洞路径。\n\n检测入侵需要三项活动 [7]：\n\n*\
  \   记录与安全相关的事件的能力。\n*   应该有一个稳健的程序来确保定期对日志进行监控。\n*   一旦检测到入侵，提供做出响应的措施。\n\n与安全相关的事件包括身份验证事件、审计事件、入侵事件和防毒病毒事件，这些事件被注册并存储在操作系统日志、安全日志或数据库日志中\
  \ [8]。非常关注其安全策略的组织需要定期在间隔时间内对安全事件进行监控和评估，以确定漏洞和破解其互联基础设施的尝试。存储在安全日志中的信息对于重建事件序列至关重要，这对于了解网络攻击的路径和时间线是必不可少的。当事件序列和相关活动进行关联分析时，我们就能获得有关攻击影响、性质和启动程序的信息，这对于开发防御措施至关重要。\n\
  \n**入侵检测系统**（**IDS**）是指软件或硬件系统，或者软硬件结合，它们自动监控计算机系统或网络内部发生事件的过程，并通过分析日志来识别安全问题的迹象\
  \ [6]。IDS 的硬件和软件组件共同工作，以检测意外事件，这些事件可能报警攻击即将发生、正在发生或已经发生 [9]。检测过程可能包含不同的技术和策略来检测入侵，这些方法随系统而异。假设，如果我们的\
  \ IDS 使用基于特征的识别技术，它将立即发现告警的理由。然而，如果它使用基于统计的技术，那么由于配置管理单元的参与，入侵检测可能会延迟 [9]。\n\n入侵检测系统的目标是检测与其它合法系统和网络活动共同运行的恶意活动。恶意攻击是一种通过漏洞损害系统的瞬态活动。漏洞代表了暴露并为恶意活动的发生提供了机会。IDS\
  \ 让组织保护其资产和数字基础设施免受威胁和恶意攻击。在最近的场景中，由于对网络技术的严重依赖，恶意活动和网络攻击的机会增加，因此对于安全专业人员来说，是否使用\
  \ IDS 问题已变得无关紧要。\n\n### 3.5.1 入侵检测系统的功能\n\n入侵检测系统执行以下任务 [10]：\n\n*   入侵检测系统监控路由器、防火墙、服务器的操作，以帮助安全控制，从而检测、预防和从网络攻击中恢复。\n\
  *   它监控并记录与安全相关的事件。\n*   它帮助管理员组织操作系统审计跟踪。\n*   它保留备份并突出显示不同检查点配置的变化。\n*   它提供用户友好的界面以确保系统安全管理。\n\
  *   它监控并记录人类活动，以绘制用户行为模式。\n*   检查持续配置检查过程，以寻找可能的漏洞并进行评估。\n*   通过文件系统管理执行单元级记录，并进行持续评估以风险降至最低。\n\
  *   它存储异常系统活动模式并对其可能性的风险进行评估。\n*   根据行为、模式和频率对恶意活动进行分类。\n*   持续评估系统的安全状态，以了解异常活动的影响。\n\
  *   对系统的安全状态建立基准，以便于跟踪和追溯。\n*   当安全被攻破时，向管理员发出告警并识别检查点。\n*   阻止入侵者和恶意活动源。\n\n##\
  \ 3.6 IDS 的特征\n\nIDS 是一种硬件设备、软件应用程序或两者的结合，它通过检查网络流量、集成系统配置来定位恶意活动及其来源并快速做出响应 [11]。IDS\
  \ 检测策略违规行为并报告给安全管理员。无论基于什么机制，IDS 都应该具有以下特征 [12], [13]：\n\n*   **最少的人工监督**：IDS 不需要人工努力和监督即可运行。\n\
  \n\n\n\n\n- **容错性**：良好的 IDS 具有容错性，这意味着即使在系统故障期间，入侵检测也不会影响其正常运行。\n- **持久性本质**：它能够在后台持续运行，且不会干扰系统和网络配置配置设置。\n\
  - **可恢复性**：如果发生系统崩溃，IDS 仍不受影响，并完全避免了重建知识库的情况。\n- **抗攻击性**：IDS 定期对自身进行评估，以确保其安全性和无漏洞。\n\
  - **低开销**：IDS 应该包含有限的硬件和软件资源，以减少开销。\n- **自更新性**：自更新能力是 IDS 的一个理想特性，旨在减少人工干预。\n-\
  \ **准确性**：高准确性在 IDS 中始终是理想的，以便产生最少量的误报和漏报报警。\n- **完整性**：IDS 能够检测到来自企业内部或外部的各种恶意模式和攻击。\n\
  - **快速响应**：IDS 应该足够快速地检测入侵并做出适当响应，以最大限度地减少损害。\n\n### 3.6.1 IDS 对业务组织的重要性\n\n计算机与设备之间的连接性，以及通过互联网快速共享信息使人们之间变得更加紧密。网络现在已成为技术转移和知识共享的基础。网络的阴暗面是入侵威胁，这可能导致对数字基础设施的渗透，从而引发数据被盗、数据损坏并泛指数字生活的破坏。入侵检测系统检查所有进入和的流量，并寻找入侵的可能性。每当它发现跨越计算机和网络运行的任何漏洞和恶意活动时，就会发出警报。入侵检测系统为组织提供了多种益处，从识别漏洞到对罪犯者采取行动。入侵检测系统测量针对数字基础设施各组件的攻击频率，并分析威胁，以了解其功能、复杂性甚至其来源。它强调了现有基础设施的缺点，并建议了需要实施的安全措施，以获得更佳、更有效的控制。它不仅评估了现有的威胁状况，还识别了它们的行动模式并预测了相关的未来风险。\n\
  \nIDS 提供了第二道防线，对于增强企业底层数字基础设施的安全性起着至关重要的作用。虽然很难开发出完整且具体的解决方案来快速响应恶意活动以防止攻击，但它能检测威胁并做出相应响应，例如通知管理员和终止破坏性的网络连接，以最大限度地降低风险。\n\
  \n### 3.6.2 IDS 的组件\n\nIDS 有三个主要组件，分别称为`Data Collection`单元、`Intrusion Detection`单元和`Response`单元。如`Figure\
  \ 3.4`所示，数据收集单元位于网络入口处，对传入流量的初始检查与存储恶意活动模式的日志文件记录进行匹配。如果网络流量模式与日志文件记录匹配，最初会发出警报并拦截流量。然而，如果数据收集单元未能检测到攻击，则由入侵检测单元负责消除攻击。入侵检测单元不仅用于捕获入侵，还响应攻击：\n\
  \n```\nimages/Figure-3.4.jpg\n```\n\n**图 3.4:** 入侵检测系统\n\n入侵检测单元处理组织间和组织内部的威胁，防止其在组织的各个功能单元之间扩散。响应单元向安全管理员发送警报，并努力减少攻击的影响。随后，它会立即断开网络连接并通知所有功能单元恶意模式的发生。\n\
  \n### 3.6.3 IDS 架构\n\n入侵检测系统旨在检测恶意活动，阻止这些活动以减少损害机会，并通知安全管理员将其注册到数据库中作为已知威胁特征。`Figure\
  \ 3.5`显示了 IDS 的架构：\n\n```\nimages/Figure-3.5.jpg\n```\n\n**图 3.5:** 入侵检测系统架构\n\n\
  **中央网络控制单元**是网络的入口，网络从这里分发到组织的所有功能单元。入侵者最频繁地针对此单元，因为每个功能单元都可以通过此单元提供的数据进行控制。该单元充当入侵者与企业之间的桥梁，在攻击发生时对企业有利，可以防止大规模损害。该单元负责入侵者的位置并判断这些是内部还是外部人员。攻击响应模块直接连接到中央网络单元，该单元仔细检查网络流量。可疑流量模式在此被识别。\n\
  \n**数据收集模块**是受保护系统的集合，与中央网络单元连接并接收所需的网络流量，以提供其在企业数字基础设施中的指定位置。数据包源在此被识别并验证，以验证数据包的真实性和机密性。包含恶意软件、病毒和虫的数据包在此被识别并丢弃。\n\
  \n**审计追踪和网络监控**单元处理审计并帮助追究责任。审计通过用户日志和其会话跟踪进行，并监控其他安全控制的功能。如果系统无法验证个人行为，就无法对任何人的特定行为追责，并且由于无法产生证据，罪犯无法对其行为承担责任。日志有助于追溯操作和事件，为起诉提供关键证据，并在追踪犯罪源头期间重新生成恶意活动路径。审计是指对日志的检查过程。它是入侵检测系统的一种固有功能。审计追踪是日志事件的顺序收集，记录在运行文件中，并在起诉期间作为记录证据呈交。审计追踪帮助安全管理员了解违反安全策略的尝试，监控随时间推移的用户活动，并识别互联数字基础设施中最脆弱的区域。值得注意的是，审计追踪不是一种保护性控制，而是一个维护用户日志及其活动的记录保存模块。\n\
  \n**IDS 知识数据库**单元记录有关以前入侵尝试的信息，以及其方法、模式和来源。它帮助入侵检测单元识别入侵尝试，并将恶意流量与正常流量区分开来 [[17]](#c03.xhtml#ref17a)。每当捕获到入侵尝试时，其攻击程序、路由、属性、目标区域和模式等细节都会记录在\
  \ IDS 知识数据库单元中备后用。如果入侵检测单元感知到可疑入侵活动，其特征将与之前的尝试进行匹配，以验证该尝试是否为恶意。\n\n\n\n\n`Intrusion\
  \ Detection` 单元负责检测入侵行为并向安全管理员发出警报。它无法阻止或响应恶意攻击。入侵检测单元由传感器节点和汇聚点（sinks）组成，用于检测网络流量的恶意属性并将其与正常流量区分开来。传感器具有自愈和自组织的属性，因此其功能不会被中断，且入侵检测单元在恶意攻击期间保持激活状态。在多跳中间节点架构中，传感器的组织保持去中心化和分布式，以便获取跨越整个企业的快速入侵检测信号。传感器的目标是从周围环境收集入侵信息，并立即将其传输到汇聚点以发出警报。\n\
  \n`Attack Response Module` 是一个控制系统，当企业的任何功能单元报告发生入侵时时，它会采取采取行动。它是一个自主控制系统，能够独立检查所有单元的功能，并在自身的中央控制下捕获入侵。如果响应模块诊断出基线单元（base-line\
  \ unit）存在操控并感知到危险状态，则响应模块尝试将入侵检测系统所有单元的功能恢复到基线点，并将它们恢复到之前的某个安全状态。\n\n基线（Base-line）是最小配置标准，使入侵检测系统处于安全状态，意味着如果发现基线单元中的配置标准未被中断，则认为所有功能单元均正常工作且未受入侵。基线单元满足了跨企业多个单元的路由器、交换机、防火墙和服务器运行所需的最小配置标准要求。\n\
  \n## 3.7 入侵检测系统的主要类型\n\nIDS 是一种防御机制，它还从系统、网络以及连接的设备（如路由器、网接器和交换机）中收集信息，以获知系统内部或跨网络的可疑活动。从上述来源收集的信息经过分析后，用于检测入侵风险和漏洞。这种分析从多个方面为安全管理员提供了帮助。首先，它为管理员建议了处理入侵、漏洞和其他恶意活动的最佳解决方案。其次，它鼓励他们设计更好的安全框架以应对未来的此类问题。此外，这种分析还让安全管理员能够更轻松地处理审计踪迹管理、日志记录和监控等复杂问题。\n\
  \n### 3.7.1 基于主机的入侵检测系统\n\n基于主机的入侵检测系统（`HIDS`）监控运行在特定机器、工作站、服务器、移动设备等设备上的活动。通过对这些活动进行检查，以检测特定主机中的入侵和漏洞。如果检测到系统配置中的入侵、漏洞和异常，将通知安全管理员。HIDS\
  \ 充当代理，定期进行检查，以确保其安装的主机免受内部或外部威胁的侵害。基于主机的 IDS 功能依赖于操作系统的审计踪迹和系统日志。操作系统的审计踪迹包含安全相关的时间顺序记录、记录的源和目的地址，以及证明活动序列及其来源的文档证据。审计踪迹按顺序维护所有影响特定操作、程序和事件的记录。系统日志是计算机系统管理的重要资源，承载了计算机各个组件在日常运行期间产生的信息。提取出的信息通常对于检测系统问题具有意义，并帮助安全管理员发现异常和安全违规。由于对审计踪迹和系统日志的高度依赖，对审计层和系统日志的保护至关重要，以消除产生误导信息的可能。\n\
  \n在对从审计踪迹和系统日志获得的信息进行严密检查后，HIDS 能够确定跨系统的攻击模式和异常活动。它能确定细微的误用模式、恶意事件的责任主体以及受影响的硬件组件和软件模块。HIDS\
  \ 具有恢复系统内部触发事件进程的能力，并能追溯其源头。显然，处理后的信息对于阻止未来的攻击和设计更好的入侵检测系统至关重要。基于主机的入侵系统是非常理想的，因为它能提供*谁访问了什么*方面的结果，并将时间限制的异常情况追溯到特定的用户\
  \ ID。在某些情况下，需要判断在公共访问计算机上工作的人员是否属于企业非法活动的一部分。HIDS 能够很好地判定这一点，因为它通过可靠的证据跟踪个人具有时间限制的行为。\n\
  \n### 3.7.1.1 基于主机系统的优势\n\n基于主机的入侵检测系统实际上比其网络对应的系统慢得多，但在发现漏洞和检测入侵方面具有若干优势。这些优势涵盖了更强的取证分析、对审计踪迹更深入的检查以及低成本的需求：\n\
  \n* **验证攻击的成功或失败**：系统日志和审计踪迹有助于安全管理员了解恶意活动及其对计算机的不利。基于主机的 IDS 使用包含一系列时间限制事件的日志，并突出由于外部活动引起的变化。通过对日志和系统基线的检查，可以更准确地衡量攻击是否成功。\n\
  * **监控特定的系统活动**：基于主机的 IDS 不仅监控用户执行的活动，还跟踪安全管理员正在进行的更改。基于主机的 IDS 在这些更改执行后立即检测到不当更改，并在相关文件的指定位置创建记录。要删除这些条目，必须拥有多级权限，这在没有安全管理员配合的情况下无法实现。基于主机的\
  \ IDS 监控文件访问活动（如文件访问、覆盖和文件权限更改），并尝试对添加、删除或修改的用户账户进行密切监控。\n* **检测键盘攻击**：基于网络的 IDS\
  \ 往往无法检测通过键盘突然触发的攻击。基于主机的 IDS 检测此类攻击的能力。\n* **适用于加密和交换环境**：基于主机的 IDS 配置在企业内的多个主机上，为基于网络的\
  \ IDS 面临的挑战提供了更好的解决方案。基于网络的 IDS 在交换和加密环境中并不有效，因为它们无法有效检测到恶意活动模式并让其通过。交换机允许通过许多小型网络分段来管理大型网络，在决定部署基于网络\
  \ IDS 的最佳位置以实现足够的网络覆盖方面存在问题。在加密和交换环境中，基于主机的 IDS 非常适用，因为入侵是通过网络流量监控检测的。\n\n\n\n\n\
  \n*   **无需额外的软件和硬件需求**：基于主机的入侵检测系统运行在包含客户端和服务器的现有网络基础设施上，不需要额外的软件和硬件来保护系统。因此，基于主机的\
  \ IDS 成本效益更高，维护工作也更少。\n\n### 3.7.2 网络型入侵检测系统\n\n入侵带来了多种恶意威胁，使得互联的数字基础设施出人意料地被破解。基于网络的恶意攻击破坏网络的稳定性，并使存储在多个节点上以及通过这些节点传输的信息安全面临危险。基于网络的入侵涵盖了广泛的恶意活动，包括破坏整个网络的稳定性、获取文件和权限的未经授权访问，以及破坏在系统中安装的软件。**基于网络的入侵检测系统**（`NIDS`）用于确定跨网络的恶意尝试。用于检测恶意尝试和异常的信息从网络流中收集，网络流是指数据从一个节点传输到另一个节点的过程\
  \ [14]。NIDS 检查数据流在入口和出口点的异常行为；检查整个网络所有数据包的内容和头部信息。广泛网络传感器的可用使得入侵检测变得更容易，因为传感器会将之前的恶意尝试模式与当前模式进行比较，并丢弃相似的。高级传感器是可以定制的，并根据单个网络的需求和用途进行安装。某些入侵检测系统允许用户将自己的签名与通过的数据流量相结合，从而允许传感器识别攻击流量\
  \ [14]。\n\n### 3.7.2.1 网络系统的优势\n\n**基于网络的 IDS**（`NIDS`）是策略性地部署在网络上的设备，用于被动检查通过网络的数据流量。NIDS\
  \ 应用于跨网络数据的入口和出口点。在某些情况下，这些设备也被应用于战略位置，并附接在路由器、交换机、以太网、`FDDI` 等网络设备上。NIDS 具有如下所示各种优势：\n\
  \n*   **与操作系统无关**：基于网络的 IDS 与操作系统无关，对所有类型的操作系统都具有相同的功能。\n*   **检测未成功的攻击和恶意意图**：网络攻击可以被视为成功或未成功。在成功的情况下，恶意尝试实现了其启动的目标，且其工作模式没有受到任何入侵检测系统的干扰。另一方面，由于某些检测和防御系统未能控制系统和网络而失败的恶意攻击被视为未成功。为了开发更好的入侵检测系统，我们需要了解恶意尝试的工作程序和攻击模式，无论其成功还是失败。攻击成功意味着我们保护系统和网络的策略不足，互联数字基础设施中现有的漏洞正使情况恶化。事实上，在某些情况下，我们的系统消除了恶意尝试，但这些不能完全忽略。基于主机的\
  \ IDS 不能有效检测未成功的恶意尝试，但在基于网络的 IDS 中，这些尝试会被意外地监控和检测，这对于完善安全策略起着至关重要的作用。\n*   **实时检测和响应**：如果我们能在源头检测并防止恶意活动，就可以保护整个基础设施；但如果从源头未被检测到，问题就会随着进一步增长而变得日益严重。基于主机的\
  \ IDS 没有检测恶意活动来源的能力，因为它只在恶意流到达主机时才采取行动。基于网络的 IDS 能够在源头限制恶意活动并防止其进一步增长。基于网络的 IDS\
  \ 执行实时入侵检测，因为不需要为了检查而存储网络流量。\n*   **消除很困难**：基于网络的入侵是实时检测的，不需要存储数据流量以进行入侵检查。在实时网络流量中进行数据操纵非常困难，需要高技能的专家。安全机构检查通过网络攻击呈现证据以确定源头并逮捕罪犯。为了逃避逮捕和隐藏犯罪源头，罪犯会移除证据。与基于主机的入侵检测相比，跨网络实时数据流量中的证据消除困难得多或几乎不可能。为了让罪犯消除证据，我们需要操纵正常的数据流量，这只有在流量被转向且导致网络拥堵时才可能。基于网络的\
  \ IDS 使用实时网络流量检测入侵。因此，在基于网络的系统中消除证据几乎是不可能的。\n\n## 3.8 基于主机的 IDS 与网络 IDS\n\n基于主机的入侵检测是指在系统上安装软件，以评估运行在系统上的活动。用于检测入侵的分析数据来自系统日志和审计跟踪。基于主机的\
  \ IDS 不仅监控可疑活动，还结合特定主机入口和出口的数据包评估系统内部。基于主机的 IDS 监控系统文件的完整性，并根据完整性违反情况评估系统行为。基于网络的\
  \ IDS 遵循不同的原理，它在网络设备上扫描网络包，审计网络包信息，维护特殊的日志文件以调查日志记录。由于互联网和数据流量的快速增长，基于网络的 IDS 现在非常受到欢迎，它可以扫描大量的网络活动以识别可疑的网络模式。表\
  \ 3.2 显示了基于主机的 IDS 与网络 IDS 之间的主要差异 [18]：\n\n| 标准 | 基于主机的 IDS | 网络 IDS |\n| :---\
  \ | :--- | :--- |\n| 威慑 | 当罪犯是内部人员时，在组织边界内具有强大的威慑。 | 当罪犯是外部人员时，在组织边界外具有强大的威慑。 |\n\
  | 检测 | 检测内部人员创建的恶意尝试。 | 检测外部人员创建的恶意尝试。 |\n| 存储 | 日志摘要和原始网络数据。 | 不需要存储日志摘要。 |\n|\
  \ 通知 | 向系统控制台报警。 | 向安全管理员报警。 |\n| 响应 | 实时响应能力差。 | 实时响应能力强。 |\n| 损害范围 | 损害限于系统和相关组织。\
  \ | 损害范围不可预测。 |\n| 攻击检测周期 | 检测入侵需要较短的时间段。 | 检测恶意尝试需要长时间的时间段。 |\n| 误报和漏报 | 误报和漏报的数量有限。\
  \ | 误报和漏报无法预测。 |\n| 源头识别 | 犯罪源头可以很容易识别。 | 犯罪源头识别困难，通常需要国际合作。 |\n\n\n\n\n基于主机的入侵是由于系统权限的滥用引起的，而在基于网络的入侵中，漏洞起着至关重要的作用。基于网络的入侵是一个困难的过程，需要寻找漏洞以进入组织的私有网络，随后捕获系统权限。然而，在基于主机的入侵情况下，内部人员不需要利用网络漏洞，因为他们已经在网络内部并拥有自己的权限。一旦外部人员通过网络漏洞访问了组织的私有网络并获得了权限，这些外部人员就会被视为内部人员。\n\
  \n## 3.9 入侵检测与防御原理\n\n入侵检测试图识别对计算机安全策略和标准安全实践的违规行为。入侵有多种原因，例如恶意软件、通过互联网获取未经授权访问的攻击者，以及滥用权限并努力获取其未被授权的额外权限的合法用户\
  \ [6]。入侵检测系统是一种能够自动检测入侵并向安全管理员报警以修补安全漏洞的软件。`入侵防御系统`（`IPS`）执行两项任务：首先，它检测入侵，随后采取行动中和恶意尝试。`IPS`\
  \ 基本上是 `IDS` 的扩展，其中提供了带有恶意尝试的数据流量，并过滤掉导致安全违规的威胁。少数研究人员 [6] 将 `IPS` 描述为 `入侵检测防御系统`（`IDPS`），它有助于安全管理员禁用防御模块以获取入侵检测的功能。\n\
  \n### 3.9.1 IDPS 的功能\n\n有多种类型的 `IDPS`，主要根据它们能够识别的事件和用于检测入侵的方法论进行区分。除了监控和识别恶意尝试外，`IDPS`\
  \ 还能识别系统内部以及跨网络的非预期活动。`IDPS` 执行以下功能：\n\n### 3.9.1.1 维护系统日志\n\n系统日志是通信系统管理细节的重要资源。系统日志如\
  \ `windows Event logs` 或 `Linux system logs` 保留了文本消息，这些消息包含了从各种附加资源中提取的时间范围操作详情。系统日志消息突出了系统中的问题，无论这些问题是微不足道的还是严重的；还能检测异常和安全违规。对系统日志进行定期监控和维护对于更好更快速的诊断至关重要\
  \ [19]。`IDPS` 定期更新系统日志以确保系统的安全。\n\n### 3.9.1.2 维护审计追踪\n\n审计和记录是任何数字架构安全的要素组成部分。安全管理员了解正在做什么、在哪里执行、何时执行以及由谁执行是至关重要的。日志记录、特定会话中执行的活动以及发生的事件详情，为调查恶意尝试提供了极佳的手段。审计追踪有助于了解攻击期间使用的系统资源以及安全控制中存在的配置错误。`IDPS`\
  \ 包含一个管理控制台，将系统日志与应用程序日志整合并记录审计追踪 [20]。\n\n### 3.9.1.3 记录恶意尝试信息\n\n了解网络攻击的模式至关重要，因为它有助于防止未来发生类似的攻击。即使流量经过加密，也会存储并检查网络流量以推断相关信息。记录恶意尝试信息及其详细检查结果，使安全管理员能够了解在入侵计算机上执行的恶意活动的严重性，并提供最可能的解决方案，以保护个人数据不被滥用、数字资产不被盗窃以及基础设施免受损坏。有关恶意尝试的信息通常记录在本地，并可以发送到远程集中日志服务器进行详细检查。\n\
  \n### 3.9.1.4 通知管理员已观察到的关键事件\n\n将带有突出关键事件的网络流量分析结果发送给安全管理员或网络管理员，以了解恶意活动背后的动机，确定来源和路径，并了解发生频率。一旦检测到攻击并报告给安全管理员，将观察关键事件以了解恶意流量是如何与正常流量混合的，并确定看似目标的区域。关键事件有助于网络管理员定位漏洞并修补它们，并减少未来发生相同攻击的机会。\n\
  \n### 3.9.1.5 产生报告\n\n`IDPS` 报告总结了计算机系统或网络中发生的事件，并突出了可能违反计算机安全和网络安全策略的事件迹象。它包含每个活动的时间段日志信息，并与安全管理员共享以进行立即响应，最大限度地减少损害风险。所有成功的违规行为都记录在报告中，初步目的是为了了解威胁及其激活模式以及频率。失败的恶意尝试也需要进行分析，因为它们暴露了现有系统中的漏洞。\n\
  \n### 3.9.1.6 入侵防御\n\n`IDPS` 监控网络流量并对其检查以寻找可能攻击的迹象。当检测到恶意活动时，它会采取适当行动停止它并通知安全管理员寻求永久解决方案。`IDPS`\
  \ 使用现有的数据库识别恶意威胁，并测量网络流量和行为异常以了解其不利影响。对于可疑活动，始终期望 `IDPS` 做出快速响应以防止其完全成功。\n\n`IDPS`\
  \ 执行以下功能以防止恶意活动 [22], [23]：\n\n*   终止发生恶意活动的网络连接或用户会话\n*   阻止违规用户及相关 IP 地址访问目标\n\
  *   封锁对目标主机的各种访问\n*   对网络设备（如 `firewall`、`router` 和 `switches`）的配置进行必要的更改，以阻止来自犯罪方的访问\n\
  *   从网络流量中移除恶意部分以禁用攻击\n*   修补目标主机上的漏洞\n*   其代理的角色使得归一化输入请求成为可能，重新封装请求的负载并丢弃头部信息，从而作为归一化过程的一部分丢弃恶意尝试\n\
  \n# 3.9.2 通用检测方法论\n\n`IDPS` 现在是组织不可或缺的一部分，因为它保护数字基础设施免受网络分子的侵害。它使用多种威胁检测方法论，通过单独执行或集成方式进行，以提供广泛且准确的检测。最常用的方法是`基于特征的`、`基于异常`和`状态协议分析`，这些方法在全球范围内大规模使用。\n\
  \n### 3.9.2.1 基于特征的检测\n\n\n\n\n基于特征的检测包括一个过程，即建立与已知威胁相对应的唯一标识符 [[22]](#c03.xhtml#ref22a)。这是最简单的检测方法，因为它通过字符串操作将事件或威胁的到达过程与特征列表进行比较。任何与可用特征或模式表现出对称性的活动都会被标记为威胁。特征列表可以是一个数据库，也可以是一个已知恶意威胁的列表，描述了它们的入侵和激活模式\
  \ [[24]](#c03.xhtml#ref24a03.xhtml#ref24a)。基于特征的检测技术非常有效，非常适用于已知威胁，但对于新威胁或已知威胁的变体仍然无效。它的开销很小，因为它不需要检查整个网络流量中的每项活动并寻找与已知特征的对称性。基于特征的检测存在局限性，在处理较新的请求时无法记住之前的请求。这种局限性为基于特征的检测方法检测包含多个事件的攻击构成了障碍。\n\
  \n### 3.9.2.2 基于异常的检测\n\n异常检测方法为正常数据流量构建模型并设置基准配置。基准配置包含了对用户、主机、网络连接或应用程序的行为研究，并衡量了诸如发送和接收消息、登录成功和失败的尝试以及处理器利用率等活动。基准配置指的是被监控系统经过检查的正常行为，其目的是与某些可疑事件进行比较。这种比较衡量了网络流量与正常行为之间的显著偏差，并有助于判断新发生的事件属于正常流量还是表现出异常行为。在异常检测方法中，针对基准配置的扰动意味着存在诱导的攻击、故障、缺陷等\
  \ [[24]](#c03.xhtml#ref24a), [25]](#c03.xhtml#ref25a)。基于异常的方法的优点是其在检测未未知威胁方面的有效性。\n\
  \n## 3.9.2.3 状态协议分析\n\n使用统计数据检测可能入侵的入侵检测系统现在更有效了，因为这些系统包含了每个用户的长期行为并将其记录下来以准备配置文件。该配置文件被附加到相应的用户上，并在需要时与基准进行比较。状态协议分析可以被视为基于特征的检测方法的扩展，并结合了协议分析来检测入侵\
  \ [[24]](#c03.xhtml#ref24a)。它衡量了当协议被用作开发 IDPS 的基础时其应该如何表现。这种检测方法建立了对接口的深度理解，并阐述了协议和应用程序应该如何交互以减少入侵的影响\
  \ [[25]](#c03.xhtml#ref25a)。在状态协议分析中，将通常接受的良性协议定义的预定义配置文件与观察到的事件进行比较，以识别偏差 [[22]](#c03.xhtml#ref22a)。它信赖通用构建的厂商开发配置文件，并设置协议在特定状态下的规范。`stateful`（状态的）一词描述\
  \ IDPS 通过状态标记跟踪网络、传输和应用协议的状态 [[22]](#c03.xhtml#ref22a)。\n\n## 3.9.3 方法论评估\n\n访问控制和身份验证是防止入侵者的两种基本技术，但往往无法防止复杂的攻击。入侵检测和防御系统预计在入侵发生时立即检测到它，并立即采取应对措施以减少损害的可能性。IDPS\
  \ 的开发需要检测方法来确保其适当有效地运行，安全管理员在选择其中一种时感到困难。David Mudzingwa 和 Rajeev Agrawal 如表 3.3*所示所示评估并比较了各种检测方法：\n\
  \n| **评估参数** | **基于特征的方法** | **基于异常的检测** | **状态协议分析** |\n| --- | --- | --- | ---\
  \ |\n| **抗规避能力** | 低 | 中 | 低 |\n| **准确率** | 中 | 高 | 中 |\n| **市场份额** | 高 | 中 | 中\
  \ |\n| **可扩展性** | 高 | 中 | 高 |\n| **成熟度** | 高 | 高 | 高 |\n| **对监控系统的开销** | 低 | 中 |\
  \ 低 |\n| **维护性** | 中 | 低 | 中 |\n| **性能** | 高 | 中 | 高 |\n| **配置** | 是 | 否 | 是 |\n\
  | **易用性** | 低 | 中 | 低 |\n| **对新攻击的有效性** | 低 | 高 | 中 |\n| **误报率** | 低 | 高 | 低 |\n\
  | **漏报率** | 中 | 高 | 中 |\n\n**表 3.3:** 方法论比较\n\n## 3.9.4 IDPS 技术\n\n组织使用 IDPS 技术来确定安全策略中的危害，准备现有威胁数据库并识别违反策略的人。IDPS\
  \ 技术根据其监控的事件和部署方式分为四类。\n\n### 3.9.4.1 网络型 IDPS\n\n网络入侵检测和防御系统应用于入口，监控通过特定分段的关联设备的流量。它检查网络流量以及应用程序协议，以识别恶意流量并防止其造成损害。通过整个区域的网络流量模式和行为与数据库中的可用攻击模式进行匹配，判断流量是恶意的还是正常的。网络型\
  \ IDPS 由传感器、管理服务器、多接口、控制台和数据库服务器组成，并应用于两个网络、路由器、虚拟专用网络（VPN）服务器、远程访问服务器和无线网络的公共边界\
  \ [[22]](#c03.xhtml#ref22a)。网络型 IDPS 主要关注应用层，并检查用于超文本传输协议（HTTP）、简单邮件传输协议（SMTP）和域名系统（DNS）的完整数据。工作传输层的协议如传输控制协议（TCP）和用户数据报协议（UDP）也会被分析以发现可疑活动。\n\
  \n网络型 IDPS 可以以两种模式激活：在线或被动模式。在在线模式下，传感器被部署以检查通过它们的实时网络流量；而在被动模式下，对实际流量的副本进行可疑活动检查。被动传感器通过镜像端口和网络分流器维持网络流量监控。镜像端口确保通过交换机监控所有网络流量，而网络分流器建立了传感器与网络之间的直接连接。在线网络型\
  \ IDPS 在检测到可疑活动时会拦截流量，而被动传感器会通知安全管理员。\n\n\n\n\n\n无线网络允许网络设备进行远程通信，并在无需物理连接的情况下传输数据传输。这只需要设备位于规定的无线网络基础设施范围之内。无线入侵检测与防御系统（Wireless\
  \ IDPS）会检查无线网络流量是否存在异常，并检查无线网络是否存在配置错误。`Institute of Electrical and Electronics\
  \ Engineers`（`IEEE`）802.11 代表了`WLAN`（无线局域网）标准族，包含两个基础架构组件，称为`station`（`STA`）和`Access\
  \ Point`（`AP`）。站代表无线设备，并通过接入点在逻辑上连接到组织的有线网络。WLAN 上的每个接入点都用名为`service set identifier`（`SSID`）的名称表示，它在区分不同的\
  \ WLAN 时起着关键作用。无线传感器由于复杂性，工作方式有所不同，使用采样流量来检查网络流量。频率使用了 2.4 GHz 和 5 GHz 两个频段，并划分为不同的通道。\n\
  \n# 3.9.4.3 网络行为分析 (NBA)\n\n网络行为分析在检测入侵方面起着至关重要的作用。网络流量及其相关统计数据使安全管理员能够区分恶意流量和合法流量。NBA\
  \ 包含了传感器、控制台和管理服务器。传感器检测异常流量的发生，管理服务器在控制台的帮助下共享流量负载。NBA 传感器的行为类似于 IDPS 传感器，它们通过嗅探数据包来检查网络不同分段的活动，并通过放置在网络边界来以主动或被动的方式工作。传感器收集通过路由器和其他网络设备的网络流统计信息，并将这些统计数据与基准标准比较以衡量偏差。网络流是指会话中两个主机之间的数据传输，使用源和目的端的\
  \ IP 地址。NBA 扫描源目的 TCP 和 UDP 端口，确定 ICMP 类型以衡量偏差并感知这些端口的入侵。会话中传输的数据包数量和字节数通过时间戳进行分析，以确定两个主机或网络设备之间是否存在漏洞。\n\
  \nNBA 技术主要使用基于异常的检测和状态协议分析技术来检测异常流量，并允许自定义过滤器来检测或停止特定攻击。NBA 传感器主要协助检测`Denial-of-service\
  \ (DoS)`攻击和端口扫描，并完全阻止意外应用程序的激活。这些传感器仔细检查恶意事件以定位源源，并重构反向链以确定攻击的真实起源。尽管 NBA 技术最适合恶意流量过滤，但它也面临巨大的局限性。入侵检测的延迟是最常见的问题，这是由于数据源配置的障碍造成的。\n\
  \n# 3.9.4.4 基于主机的 IDPS\n\n基于主机的 IDPS 检测主机内部发生的每个事件以寻找可疑活动。它监控通过节点的网络流量，分析保留在磁盘上的文件访问权限，并检查系统和网络配置以跟踪非法更改。基于主机的\
  \ IDPS 俗称为代理（agents），安装在相关的主机上。这些代理访问主机的内部架构，并在现有的代码层之间放置一个 SHIM。`System Health\
  \ and Intrusion Monitoring`（`SHIM`）用于验证每个运行的进程，并感知加密人际通信中的恶意数据包。它应用于从一个代码段传递到另一个代码段的点，并分析网络流量以决定允许或拒绝。\n\
  \n基于主机的 IDPS 使用检测到的恶意代码标本进行代码分析，并在虚拟环境或沙箱中执行它，以了解其对存储库、系统文件、操作系统层及其内部架构的负面影响。数据保留在磁盘上并传输到内存进一步到微处理器的过程会被分析，以确保栈和堆缓冲区的安全性。将内存部分分配给某些文件和进程的指令序列通过验证，以确保其免受恶意代码的影响。它有助于完整性检查并为系统文件生成加密和，以确定其完整性是否被破坏。某些基于主机的\
  \ IDPS 允许检查文件属性以验证文件所有权权限。\n\n## 结论\n\n在本章中，我们讨论了 CIA 三要素及其关键参数，即机密性、完整性和可用性，并详细阐述了具有四个主要阶段的防御生命周期。展示了入侵的详细分类，以便广泛理解不同类型的网络攻击。定义了入侵检测系统的架构及其主要组件。我们还讨论了它的特性、功能和主要类型。此外，我们解释了入侵检测与防御系统（IDPS）及其主要功能，并详细说明了用于检测入侵的方法。详细阐述了基于特征的检测、基于异常的检测和状态协议分析，以检测已知威胁和未知数据流量。\n\
  \n在下一章中，我们将关注网络取证，并详细介绍犯罪分子用来隐藏其真实位置的技术。将讨论主要的追溯方案，以便对溯源系统及其在预防网络犯罪中的利用进行广泛概述。\n\
  \n# 知识点回顾\n\n*   关键国家基础设施包括过程、系统、设施、技术、网络、资产和服务，这些对于一个国家的财务和社会健康、安全、保障或经济福祉至关重要。\n\
  *   关键国家基础设施就像为公民在国家内生存而提供的服务的生命支持系统。\n*   机密性是指防止未经授权的人查看而隐藏敏感数据和信息的能力。\n*   数据完整性是指对数据原始性的保证。它是确保可用的数据副本是原始数据准确且未经修改的表示的能力。\n\
  *   入侵是指软件、节点、网络和 IT 基础设施内部的恶意活动。\n*   入侵检测系统 (IDS)是指软件或硬件系统，或软硬件结合，它自动执行监控计算机系统或网络内部发生事件的过程，分析日志以识别安全问题的迹象。\n\
  *   恶意攻击是一种通过漏洞损害系统的瞬态活动。\n*   入侵检测系统监控路由器、防火墙、服务器的操作，以帮助安全控制措施进行检测、预防和从网络攻击中恢复。\n\
  *   入侵检测系统 (IDS) 提供了第二道防线，对于增强企业底层数字基础设施的安全起着至关重要的作用。\n*   IDS 有三个主要组件，称为数据收集单元、入侵检测单元和响应单元。\n\
  *   入侵检测单元处理组织间和组织内部威胁，并防止其在组织功能单元之间扩散。\n\n\n\n\n\n- 基线（Baseline）是最小配置标准，它使入侵检测系统处于安全状态，这意味着如果发现基线单元中的配置标准未被破坏，则认为所有功能单元均正常工作且未受入侵。\n\
  - `基于主机的入侵检测系统 (HIDS)` 监控运行在特定机器、工作站、服务器、移动设备及其他设备上的活动。\n- 操作系统审计日志包含与安全相关的按顺序记录、记录的源和目的地址，以及用于证明活动顺序及其来源的记录性证据。\n\
  - 审计日志顺序维护所有影响特定操作、过程和事件的活动记录。\n- 系统日志和审计日志有助于安全管理员了解恶意活动及其对计算机的不利影响。\n- `基于网络的入侵检测系统\
  \ (NIDS)` 确定确定跨越网络的恶意企图。\n- `NIDS` 检查入口和出口点数据流的异常行为；检查跨网络所有数据包的内容和报头信息。\n- 入侵防御系统\
  \ (IPS) 执行两项任务：首先，它检测入侵，随后它采取行动中和恶意企图。\n- 系统日志（如 Windows 事件日志或 Linux 系统日志）保留了文本消息，其中包含从各种附加资源中提取的时间限制操作的细节。\n\
  - `IDPS` 使用现有的数据库识别恶意威胁，并测量网络流量和行为异常以了解其不利影响。\n- 基于特征的检测包括一个过程，即建立与已知威胁相对应的唯一标识符。\n\
  - 基于特征的检测技术非常有效，非常适用于已知威胁，但对新威胁或已知威胁的变体仍然无效。\n- 异常检测方法为正常数据流量构建模型并设置基线配置。\n- 基线配置整合了对用户、主机、网络连接或应用程序的行为研究，并衡量诸如发送和接收消息、登录成功和失败的尝试、处理器利用率等活动。\n\
  - 基线配置指的是被监控系统检查的正常行为，其构建目的是与某些发生的可疑事件进行比较。\n- 基于异常的方法的优点在于其在检测以前未知的威胁方面的有效性。\n\
  - 基于网络的 IDPS 主要关注应用层，并检查专门用于超文本传输协议 (HTTP)、简单邮件传输协议 (SMTP) 和域名系统 (DNS) 的整个数据流量。\n\
  \n## 单选题\n\n1. **以下哪项不属于 CIA 三要素模型？**\n   1. 机密性 (Confidentiality)\n   2. 完整性 (Integrity)\n\
  \   3. 可用性 (Availability)\n   4. 真实性 (Authenticity)\n\n2. **TLS 代表？**\n   1. 传输层套接\
  \ (Transmission Layer Socket)\n   2. 传输层安全 (Transport Layer Security)\n   3. 传输层秘密\
  \ (Transport Layer Secrecy)\n   4. 传输日志会话 (Transmission Logs Session)\n\n3. **以下哪一项不属于防御生命周期？**\n\
  \   1. 分析 (Analysis)\n   2. 预防 (Prevention)\n   3. 检测 (Detection)\n   4. 维护 (Maintenance)\n\
  \n4. **基于网络的 IDPS 主要关注 \\_\\_\\_\\_\\_\\_\\_\\_ 层协议？**\n   1. 数据链路层 (Data link)\n\
  \   2. 物理层 (Physical)\n   3. 表示层 (Presentation)\n   4. 应用层 (Application)\n\n5. **基于特征的检测不适用于：**\n\
  \   1. 已知威胁 (Known Threats)\n   2. 未知威胁 (Unknown Threats)\n   3. 已知特征 (Known Signature)\n\
  \   4. 已知数据流量 (Known Data Traffic)\n\n6. **基于异常方法的优点包括：**\n   1. 对已知威胁的有效性\n   2.\
  \ 对未知数据流量的有效性\n   3. 对已知特征的有效性\n   4. 对已知数据流量的有效性\n\n7. **SHIM 代表：**\n   1. 系统健康与入侵监控\
  \ (System Health and Intrusion Monitoring)\n   2. 系统健康与入侵管理 (System Health and Intrusion\
  \ Management)\n   3. 安全托管与互联网监控 (Secure Hosting and Internet Monitoring)\n   4.\
  \ 安全托管与入侵管理 (Secure Hosting and Intrusion Management)\n\n8. **SSID 代表：**\n   1.\
  \ 服务集标识符 (Service Set Identifier)\n   2. 安全集标识符 (Secure Set Identifier)\n   3. 安全套接字标识符\
  \ (Secure Socket Identifier)\n   4. 安全套接入侵检测 (Secure Socket Intrusion Detection)\n\
  \n## 答案\n\n1. **d**\n2. **b**\n3. **c**\n4. **d**\n5. **b**\n6. **b**\n7. **a**\n\
  8. **a**\n\n# 答题\n\n1. 详细描述关键国家基础设施及其安全性。\n2. 详细解释机密性-完整性-可用性三要素（CIA triad）。\n3.\
