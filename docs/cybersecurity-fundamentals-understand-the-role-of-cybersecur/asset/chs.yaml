  \    3. 解密网络数据包\n    4. 避免加密\n\n3. **实现隧道技术（Tunneling）需要以下哪项？**\n    1. 多态\n   \
  \ 2. 继承\n    3. 封装\n    4. 虚拟化\n\n4. **CITRA 代表：**\n    1. 协调入侵溯源与响应架构 (Coordinated\
  \ Intrusion Traceback and Response Architecture)\n    2. 相关入侵溯源与响应架构 (Co-related\
  \ Intrusion Traceback and Response Architecture)\n    3. 通用入侵溯源与响应架构 (Common Intrusion\
  \ Traceback and Response Architecture)\n    4. 协作入侵溯源与响应架构 (Cooperative Intrusion\
  \ Traceback and Response Architecture)\n\n5. **MAC 泛洪发生在：**\n    1. 数据链路层\n    2.\
  \ 网络层\n    3. 传输层\n    4. 会话层\n\n6. **IDIP 代表：**\n    1. 入侵检测与入侵防御\n    2. 入侵检测与隔离协议\
  \ (Intrusion Detection and Isolation Protocol)\n    3. 初始检测与初始保护\n    4. 国际发现互联网协议\n\
  \n7. **INFOCON 代表：**\n    1. 信息运营连接\n    2. 信息性运营连接\n    3. 信息运营状态 (Information\
  \ Operations Condition)\n    4. 信息性开放连接\n\n8. **VoIP 代表：**\n    1. 互联网协议中的漏洞操作\n\
  \    2. 互联网协议中的语音操作\n    3. 互联网协议的漏洞\n    4. 语音 IP (Voice Over IP)\n\n9. **SIP 代表：**\n\
  \    1. 会话建立协议 (Session Initiation Protocol)\n    2. 安全互联网协议\n    3. 单指令协议\n   \
  \ 4. 会话集成协议\n\n## 答案\n\n1. **a**\n2. **b**\n3. **c**\n4. **d**\n5. **a**\n6. **b**\n\
  7. **c**\n8. **d**\n9. **a**\n\n## 问答\n\n1. 什么是 COTS 软件？它们为什么网络安全危险？解释。\n2. 详细解释漏洞周期（Vulnerability\
