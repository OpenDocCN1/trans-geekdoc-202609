  \ of IEEE Symposium on Security and Privacy, Oakland, CA, 1995, pp. 39-49.\n[4]\
  \ Yin Zhang and Vern Paxson, “Detecting stepping Stones”,In Proceedings of the 9th\
  \ conference on USENIX Security Symposium - Volume 9, August 2000.\n[5] L.T Heberlein,\
  \ B. Mukherjee,K.N Levitt, “Internet security Monitor: An Intrusion-Detection system\
  \ for large-scale network”, In Proceeding of 15th National Computer Security Conference,\
  \ pp. 262-271, October 1992.\n[6] Active and Passive monitoring, available at `solutionsreview.com/network-monitoring/active-monitoring-whats-difference/`\n\
  [7] Passive monitoring\n[8. Internet: A Primer\n9. From Intrusion Detection to\n\
  10. Techniques for Cyber Attack\n11. The Nature of\n12. Wide-Area\n13. Detecting\
  \ Anomalies\n14 Stepping Stone Attacks\n15. Correlating Perturbed Flows with\n16.\
  \ Temporal Thumbprints\n17. A survey of research in stepping stone\n18. Improving\
  \ Stepping Detection Algorithms using Anomaly Detection\n[19]\n\n# 第 6 章\n\n## 基础设施漏洞与\
  \ DDoS 洪水攻击\n\n在数字时代，各国正在开发和使用新技术以实现自动化。技术为社会带来了更大的利益，但也给人们带来了新的挑战。信息技术领域也不例外，互联网和网络空间的发展在不考虑物理边界的情况下拉近了人们，并在短时间内满足了他们信息和通信的需求。犯罪分子也利用基础设施的缺陷来实现财务和政治目标。\n\
  \n### 结构\n\n* 通用现成（COTS）软件与网络安全\n* 漏洞生命周期\n* 互联网结构的缺陷\n* 协作入侵溯源与响应架构 (CITRA)\n\n\
  \n\n\n\n- DDoS 洪泛攻击\n\n## 目标\n\n本章将解释商用现货（COTS）软件对数字基础设施的危害，并说明其为大规模犯罪提供了大量的漏洞。它描述了漏洞的生命周期，并向您介绍了互联网结构中的各种缺陷，这些缺陷使得犯罪分子更容易进行恶意活动。通过\
  \ `CITRA` 架构，文中详细说明了如何在无需人工干预的情况下进行入侵分析。此外，本文向读者解释了 DDoS 洪泛攻击，并提供了完整的分类法，以便更好地理解其不同形式，并了解这些攻击对\
  \ OSI 层的影响。\n\n## 6.1 COTS 软件与网络安全\n\nCOTS 软件是指商用现货（Commercial-off-the-shelf software）。这些指的是市场上可以直接供商业使用的、无需经过任何修改的成品软件产品\
  \ [1]。这些软件的安装不需要技术专业知识，使用服务也不需要定制。Howard F. Lipson [2] 认为，每个连接到互联网的系统都需要保护，以确保网络空间的安全。由于\
  \ COTS 易于获取且功能日益强大，它们被安装在世界范围内大量的计算机上。遗憾的是，如果在 COTS 中检测到漏洞，该漏洞就会变成犯罪分子的机会。由于 COTS\
  \ 安装在数百万台计算机上，因此每个系统都包含漏洞，并邀请犯罪分子进行利用和实施犯罪。因此，为犯罪分子留下了数百万个开放的入口。\n\n## 6.2 漏洞生命周期\n\
  \n漏洞生命周期代表了漏洞在其生命周期内的状态。“生命周期”一词显示了明确且线性的进展，以及从一个阶段到另一个阶段的转换。然而，在系统和软件漏洞的情况下，并不遵循这种模式。对于漏洞而言，进展的变化取决于受影响系统与利用漏洞入侵入侵恶意程序之间的多次交互。William\
  \ A. Arbaugh 等 [3] 描述了漏洞的独特状态，命名为出生（Birth）、发现（Discovery）、披露（Disclosure）、修复程序的发布、出版（Publication）以及利用的自动化。这些漏洞状态的图示及其随时间推移发生的情况如图\
  \ 6.1 所示：\n\n![](img/Figure-6.1.jpg)\n\n**图 6.1:** 漏洞状态\n\n漏洞似乎从出生状态开始转换，一直持续到修复程序的发布：\n\
  \n**出生 (Birth)**：这指的是软件中产生某些缺陷的瞬间。该缺陷是在大型项目开发过程中无意中产生的。\n\n**发现 (Discovery)**：指的是首次检测到安全和存活性缺陷。“零日漏洞”一词代表通常由供应商而非用户发现的软件缺陷。这些漏洞没有可以修复缺陷的补丁\
  \ [23]。\n\n**披露 (Disclosure)**：这是一个事件，发现者向更广泛的受众公开揭示漏洞存的细节。\n\n**出版 (Publication)**：当披露失去控制时，人们会在公共报告中批评该漏洞。随着犯罪分子获得发起攻击的切入点，这种活动变得具有危害性。\n\
  \n**利用的自动化 (Automation of the exploitation)**：如果漏洞在公共范围内暴露，犯罪分子将自动在全球范围内开始利用漏洞以发动攻击。\n\
  \n**修复程序的发布 (Release of Fix)**：每当开发者知道漏洞时，他们就会发布修改和配置更改代码，俗称为补丁（`patches`），以处理并纠正底层缺陷。\n\
  \n## 6.3 互联网结构中的缺陷\n\n与互联网更多的交互使犯罪分子能够暴露其结构并突破其关键组件。老化和过时的互联网基础设施增加了我们暴露在恶意威胁之下的风险，并成为数字灾难和网络攻击的原因。Howard\
  \ F. Lipson [2] 描述了互联网结构的以下缺陷：\n\n### 6.3.1 互联网结构不利于追踪和溯源用户行为\n\n互联网的基本构建是为了形成一个具有共同利益的人群，并为技术研究人员社区开发一个合作和协作的全球平台，以便进行技术转移和知识共享。它不像电话系统那样便于通信双方的跟踪和计费能力，且费用需要根据每次通话对参与方收费。互联网的结构从未设想过基于主机到主机的通信进行收费，因此从未便于对参与主机进行追踪和溯源。\n\
  \n### 6.3.2 互联网基础设施无法抵抗高度不可信的用户\n\n互联网为所有类型的用户提供了平等的机会。高素质、高技能的犯罪分子也利用其服务来获取货币利益和政治优势。互联网基础设施设计的主要考量是使其即使在外部物理攻击或导致路由基础设施遭受严重损坏的事故时也能保持运行。在当前情况下，如果部分网络基础设施受损，数以十计带有网络设备的跳到跳连接提供了数百万条替代路由，以将网络流量传输到目标主机。互联网结构仍然缺乏通过外表和行为识别犯罪分子的技术，因此犯罪分子获得了所有权限的访问。由于互联网基础设施即使在损坏后也能正常工作，因此很难知道一个用户是可靠的还是犯罪分子。我们未能识别和限制犯罪分子的另一个原因是互联网缺乏关联其用户所执行活动的技术。\n\
  \n### 6.3.3 恶意数据包源地址保持模糊，严重阻碍了追踪和溯源\n\n犯罪分子利用恶意数据包实施犯罪，隐藏这些数据包交付的来源，并将另一个源作为恶意数据包的原始源。这些活动严重阻碍了追踪和溯源过程，并对犯罪的真实起源呈现出不清晰的。互联网协议设计的背后理念是形成一个良性和可信的用户社区；因此，它缺乏对\
  \ IP 数据包中信息的加密认证的规定。因此，熟练的犯罪分子可以操纵 IP 数据包包含的任何信息并修改源地址进行伪造。在单向通信中，犯罪分子只需在源字段中插入虚假地址即可伪造源地址。在双向通信中，使用反射器来误导追踪机制。数据包清洗（Packet\
  \ laundering）对于阻止溯源过程也有效，但它要求犯罪活动之间存在延迟。\n\n### 6.3.4 犯罪分子与网络技术专业人员之间更好的协调与协作\n\n\
  \n\n\n正如我们之前讨论过的，互联网的根本开发目标是为了服务研究人员和教育工作者，而不是为了服务犯罪分子，因此像密码保护之类的安全机制似乎足以防止行为不当的用户。在我们看来，互联网目前的形态和扩张，以及它融入我们生活的方方面面并对电子商务、交通、通信、银行和国防的包含，在其实构建期间从未被考虑过。因此，稳健的安全机制并没有得到开发。互联网上的金融交易吸引了犯罪分子在其运行过程中进行拦截以获取利润，因此他们既单独行动也进行团队合作实施犯罪。犯罪分子和网络技术专业人士合作，突破互联网基础设施及其安全措施，并以快速的速度开发新方法来实施网络犯罪。另一方面，用于网络安全的安全机制尚未被发明和实施以跟上这种速度，因此犯罪分子往往能成功破解网络安全。\n\
  \n### 6.3.5 缺乏中央安全机制\n\n在开始，连接到网络的系统很少，且每个系统都通过中央安全策略和单一机制进行管理，因此攻破这些系统非常困难。如果由于任何原因发生了突破，会迅速得到处理以防止损害。由于互联网允许个人在不验证身份的情况下加入和访问，中央安全机制变得失灵了。互联网基础设施在没有安全措施的情况下快速增加新设备，这使得情况变得恶化，因为这些系统的用户既不保护自己的设备，也不拒绝犯罪分子通过自己的设备进入互联网基础设施。这些缺乏技能的用户对互联网基础设施构成了危险，因为他们所拥有的设备充当了“跳板”，并被用于网络犯罪。\n\
  \n# 6.3.6 网络安全受限于跨多个行政、司法管辖和国家界限的影响\n\n在最初，网络化系统、关联设备、布线和协议设计是在完全的中央行政控制下实施并运行的。硬件、系统软件、应用程序软件、插件和软件补丁在单一管理域内进行安装和控制，因此漏洞的利用是不可能的。此外，这些网络化计算机的用户是单一中央管理面板的成员，因此这些成员擅长处理这些系统和互联基础设施。这些成员能够快速识别漏洞并发布立即且适当的补丁解决方案。现在，互联网是世界上共同且最大的信息资源，包含了数亿计的计算机和网络化设备、布线以及遍布在全球的网络型基础设施。整个基础设施现在不再由单一行政机构控制，而是通过在跨多个国家的不同地理区域工作的数百万服务提供商进行控制。由于多个国家对于网络犯罪预防没有共同法律，法律和管辖权成为互联网基础设施正确实施的障碍。\n\
  \n### 6.3.7 高速网络流量阻止追踪\n\n由于大部分人口正在使用互联网满足各种需求，大量的数据访问现在是至关重要的。高速互联网对于观看视频、享受直播游戏或玩在线游戏是所需要的。研究机构也需要高带宽来满足其高计算需求。具有高速带宽的互联网要求数据包在可能的路由之间快速移动。中间件路由器需要尽可能地传递数据包，因此路由器经常忽略对数据包的处理，导致恶意数据包逃逸。分析和处理数据包并判断其恶意属性会减慢网络速度，这对于快速互联网来说是不理想的。\n\
  \n在快速互联网服务期间，通常有助于在传输期间追踪和溯源以及知其来源的数据包信息，由于存储容量限制，不会在路由表中存储较长时间。\n\n### 6.3.8 隧道为追踪和溯源设置了障碍\n\
  \n“隧道”基本上指的是一种促进数据从一个网络到另一个网络安全传输的协议。它允许私有网络数据包通过互联网等公共网络进行传输，并具有更好的保护。封装在这里起着关键作用，它将私有网络通信数据包封装在各种外部包内部。因此，将私有网络数据包封装在外部包内部通常被称为`encapsulation`，它允许私有网络数据包通过公共网络传输，因为这些被视为公共网络数据包\
  \ [3], [22]。封装包保护了恶意包并帮助它们到达目标，而追踪机制只记录公共网络数据包的细节。\n\n### 6.3.9 日志和审计数据的销毁\n\n日志指的是接入网络设备内部发生事件的详细记录\
  \ [4]。从日志和审计数据中获得的信息对于了解攻击性质、攻击模式、目标区域、频率具有价值，甚至可以借此追溯其路线并确定来源。为了逃避检测，犯罪分子经常销毁日志和审计数据，对防病毒软件日志和安全日志进行细致的清理。日志信息的保护至关重要，因为被破坏的日志会误导安全调查并保护犯罪分子免受法律行动\
  \ [4]。\n\n## 6.4 协作入侵溯源与响应架构 (CITRA)\n\n`Cooperative intrusion traceback and Response\
  \ Architecture`（`CITRA`）是一种基于代理的系统，促进了其组件（如路由器、防火墙安全管理单元和传感器）之间更好的协调。该架构利用网络边界检测入侵，通过邻居节点回溯到入侵源，并将这些细节通信给中央安全管理单元\
  \ [5]。Dan Schnackenberg 等人 [6] 引入了 CITRA 架构以执行以下任务：\n\nCITRA 用于执行以下任务：\n\n1. 它识别网络边界并检测跨越这些边界的入侵。\n\
  2. 向中央安全管理单元快速报告入侵。\n3. 它有助于防止或减少跨网络边界入侵造成的后续损害。\n4. 它试图在入侵检测系统的组件之间建立更好的协调。\n\n\
  \n\n\n在 CITRA 架构中，`neighbourhood 2` 和 `neighbourhood 3`（如`图 6.2`所示）用于追踪和响应入侵。CITRA\
  \ 使用`Intrusion Detection and Isolation Protocol`（IDIP）来快速、集中地报告恶意入侵事件，并对这些入侵产生即时的有效响应\
  \ [\\[10\\]](#c06.xhtml#ref10a)。CITRA 架构通过审计其各个设备的网络流量，借助 `IDIP` 协议有助于回溯。如果检测到入侵，CITRA\
  \ 将检查审计轨迹以追踪恶意数据包，并在源头附近对其进行适当响应。回溯机制按以下三个步骤执行：\n\n第一步，启用 CITRA 的检测器设备检测入侵。\n\n\
  第二步，检测器设备向所有包含的设备发送警告信号，并向每个周围的 CITRA 邻居发布回溯消息。\n\n第三步，被包含的边界控制器使用其相应的本地网络审计轨迹来确定它们是否通过了恶意数据包。如果边界控制器发现自己参与了转发恶意数据包，则该边界控制器将通知其后续的边界控制器和主机。重复此步骤直到检测到恶意数据包的源头：\n\
  \n```\n![](img/Figure-6.3.jpg)\n```\n\n**图 6.3:** IDIP 入侵检测与响应机制\n\nCITRA 通过最窄的网络响应来停止主动攻击。响应机制使用过滤规则从网络流量中过滤掉恶意数据包。入侵检测系统准备详细报告并发送给发现协调员（Discovery\
  \ Coordinator）。每个邻居都由自己的入侵检测系统保护。因此，CITRA 架构包含的入侵检测系统数量与架构中存在的邻居数量相同。每个邻居单元向发现协调员通知其入侵报告，以形成整个架构的入侵全局视图。借助此入侵全局视图和架构拓扑，发现协调员确定攻击的完整路径并生成最优系统响应。CITRA\
  \ 促进了社区范围的攻击聚合与关联，有助于发现协调员全面了解系统的安全状态。`INFOCON` 代表`Information Operations Condition`（信息运行状况），代表更新的网络状况以及评估对存储信息和数字基础设施攻击风险的努力。CITRA\
  \ 最有趣的特性是对 `INFOCON` 变化的快速适应。CITRA 使用额外的硬件将 `INFOCON` 变化广播到 CITRA 社区下的所有可用节点，并准备节点采用这些变化。\n\
  \n边界控制器为组织提供边界防御并为自动回溯提供主要机制。如果网络流量包含恶意数据包，它们能够在源头附近拦截特定的流量。CITRA 审计机制利用中间边界控制器追踪犯罪分子到其源头。以下`图\
  \ 6.4`表示执行扫描的 CITRA 响应架构：\n\n```\n![](img/Figure-6.4.jpg)\n```\n\n**图 6.4:** CITRA\
  \ 响应架构\n\n该架构响应入侵需要八个步骤，讨论如下：\n\n1. `Discovery Coordinator` 根据邻居的报告识别脆弱区域，并借助 CITRA\
  \ 扫描代理调度入侵检测的扫描。\n2. `CITRA Scan Agent` 通知 CITRA 检测器密切监控端口扫描过程，并向检测器发送消息以准备关于入侵的详细报告。\n\
  3. `CITRA Scan agent` 启用扫描器对脆弱区域和各种端口进行恶意威胁扫描。\n4. CITRA 的每个功能区域都有自己的检测器并向发现协调员报告。\n\
  5. 中央 CITRA 检测器收集所有子检测器的入侵报告并准备详细报告。\n6. 完成扫描任务后，扫描器与 CITRA 检测器通信状态。\n7. CITRA 扫描代理直接向发现协调员通知检测到的入侵。\n\
  8. 如果 `INFOCON` 建议某些更新或补丁，它直接与发现协调员通信，帮助借助 CITRA 检测器在整个架构中实施这些建议。\n\n### 6.4.1 CITRA\
  \ 关联工具\n\n关联工具用于确定和减少误报。借助关联工具，可以在发现协调员实现文件系统管理。发现协调员处的 `IDIP` 协议确保接收来自所有检测单元的入侵报告以减少重复。在此架构中，集成了各种关联器以了解文件的对称性，并与以下组件执行各种关联任务：\n\
  \n- `Merger`：由于扫描器负责扫描所有包含的邻居以寻找漏洞和入侵，有时，相同的条目会被记录在多个邻居的入侵报告中。这些记录的重复增加了在发现协调员准备单份详细报告的开销和复杂性。`Mergers`\
  \ 唯一识别来自所有文件的记录并记录在发现协调员的单个文件中。\n- `Graph-based Intrusion Detection System (GrIDS)`：S.\
  \ Staniford-Chen 等人 [\\[7\\]](#c06.xhtml#ref7a) 表示了分配给计算机内部运行的不同活动的网络流量图形视图。这种图形视图有助于确定恶意活动并聚合应用于它们的流量。`GrIDS`\
  \ 的主要吸引力在于分析 TCP/IP 网络上多达数千计算机的网络 [\\[7\\]](#c06.xhtml#ref7a)。在 CITRA 架构中，`GrIDS`\
  \ 有助于消除冗余并在发现协调员处准备具有唯一记录的详细报告。\n- `Filters`：使用基于 Perl 的硅过滤器从所有邻居以及发现协调员处移除误报。\n\
  - `Event processor`：CITRA 架构像分布式系统一样工作，因为它包含多个向发现协调员报告的邻居。`event processor`的主要功能是分析邻居内部发生的事件以寻找入侵\
  \ [\\[8\\]](#c06.xhtml#ref8a)。\n- `EMERALD`：`EMERALD` 术代表 Event Monitoring Enabling\
  \ Responses to Anomalous Live Disturbances（启用事件监控响应异常实时干扰）。它是一个分布式可扩展工具套件，用于识别恶意活动、追踪恶意数据包传输路径并定位恶意流量源头。\n\
  \n## 6.5 DDoS 洪水攻击\n\n\n\n\n\nDDoS 的分布式特性为追溯真实源头增加了复杂性。攻击者通常伪造源地址以隐藏其身份，并使追踪过程复杂化\
  \ [[11]](#c06.xhtml#ref11a)。为了开发针对 DDoS 攻击的防御机制，我们需要了解 DDoS 洪水攻击的各个方面及其分类。根据协议层，Saman\
  \ Taghavi Zargar 等人 [[11]](#c06.xhtml#ref11a) 将 DDoS 洪水攻击分为两类，如下方的 图 6.5 所示。\n\n\
  ### 6.5.1 网络/传输层 DDoS 洪水攻击\n\n这些 DDoS 攻击通过要求超过可用范围的带宽来使受害者系统过载。此类攻击的目标包括过度消耗网站带宽、降低服务器处理速度以及减慢\
  \ CPU 操作。这些 DDoS 洪水攻击利用 `TCP`、`UDP` 和 `ICMP` 协议中的现有缺陷，通过淹没网络路由和设备来减慢请求和交付过程：\n\n\
  ![](img/Figure-6.5.jpg)\n\n**图 6.5:** DDoS 洪水攻击分类\n\n### 6.5.1.1 洪水攻击\n\n洪水攻击是规避恶意网络流量检测的一种方法。攻击者通过通信信道传输大量流量。入侵检测机制无法在有限的时间限制检查如此大量的数据，并在未经检查的情况下将流量传递给目标。通过洪水攻击，攻击者试图通过耗尽沉重的流量负载来破坏合法用户的网络连接。Saman\
  \ Taghavi Zargar 等人 [[11]](#c06.xhtml#ref11a) 列出了一些常见的洪水攻击示例，如下：\n\n*   伪造和非伪造的\
  \ UDP 洪水\n*   `ICMP flood`\n*   `DNS flood`\n*   `VoIP`（基于 IP 的语音传输）洪水\n\n### 6.5.1.2\
  \ 协议利用洪水攻击\n\n协议和接口允许合法用户通过连接与设备交互。接口和协议的剧变化可能会限制合法用户访问网络和资源。攻击者更改协议和接口的代码以利用特定功能，并添加恶意代码来占用受害者的资源导致过载。Saman\
  \ Taghavi Zargar 等人 [[11]](#c06.xhtml#ref11a) 提出了几个协议利用洪水攻击的示例，如下 [[11]](#c06.xhtml#ref11a)：\n\
  \n*   `TCP SYN flood`\n*   `TCP SYN-ACK flood`\n*   `ACK` 和 `PUSH ACK flood`\n*\
  \   `RST/FIN flood`\n\n### 6.5.1.3 基于反射的洪水攻击\n\n攻击者通过使用反射器隐藏自己并实现匿名化。攻击者在反射器后面工作并接收受害者的响应，而受害者则认为反射器是合法用户并与其通信。`ICMP\
  \ echo request`、`Smurf attacks` 和 `Fraggle attacks` 是基于反射的洪水攻击的一些示例 [[11]](#c06.xhtml#ref11a)。\n\
  \n### 6.5.1.4 基于放大的洪水攻击\n\n犯罪分子通过对接收到的单个查询生成相同消息的副本来利用服务。在洪水攻击中，这些重复响应消息的生成被称为`放大`。响应消息的放大是通过僵尸网络实现的，僵尸网络是指一系列被入侵并远程控制的计算机，通常用于耗尽网络通道和目标以破坏服务。基于放大的洪水攻击最常见的示例如下\
  \ [[12]](#c06.xhtml#ref12a)：\n\n*   `Synonymous IP flooding`\n*   `Excessive VERB`\n\
  *   `Media data flooding`\n*   `Ping flooding`\n\n### 6.5.2 应用层 DDoS 洪水攻击\n\n如果我们认为犯罪分子总是是外部人员，那就完全错误了，因为组织的员工也会为了个人利益而发起攻击。对于内部人员，犯罪分子会被识别为合法用户，并被授予访问应用程序的权限\
  \ [[13]](#c06.xhtml#ref13a)。应用层攻击通过耗尽服务器资源（如 `sockets`、`CPU`、`主内存`、`磁盘存储`、`I/O 带宽`、`数据库`）使服务器失效\
  \ [[11]](#c06.xhtml#ref11a)。在应用层洪水攻击中，某些关键应用（如 `HTTP`、`DNS` 和 `SIP` 会话发起协议）的特征成为目标并被破坏，导致它们无法处理请求和提供服务\
  \ [[11]](#c06.xhtml#ref11a)。\n\n### 6.5.2.1 基于反射/放大的洪水攻击\n\n在基于放大的洪水攻击中，犯罪分子向僵尸网络发送恶意代码。在该代码的帮助下，僵尸网络中的每台计算机都会指示路由器通过广播地址范围内的所有\
  \ IP 地址。此外，僵尸网络计算机接收到的来自犯罪子的恶意流量通过路由器的放大，并传输到所有 IP 地址。这种放大过程由参与僵尸网络的每台计算机执行。在基于反射或放大的洪水攻击中，反射器的角色至关重要，因为它会发送网络包。反射器是指能够发起放大攻击增加通道负载并消耗受害者带宽的中间节点\
  \ [[11]](#c06.xhtml#ref11a)。因此，Web 服务器、DNS 服务器和路由器充当反射器，因为这些设备使用 `SYN`、`ACK` 和 `RST`\
  \ 信号响应 TCP [[14]](#c06.xhtml#ref14a)。\n\n### 6.5.2.2 HTTP 攻击\n\nHTTP 攻击是一种特殊的攻击，当大量流量以无数查询的形式引导时，服务器会失去响应。攻击者试图通过从不同地点的计算机发送访问请求来使服务器或应用程序崩溃。HTTP\
  \ 攻击通过 `GET` 和 `POST` 请求发起。`GET` 请求用于从服务器接收静态内容（如图像和文本），而通过 `POST` 请求我们接收动态内容（如数据库记录）\
  \ [[15]](#c06.xhtml#ref15a)：\n\n*   会话攻击：当攻击者的会话请求率高于合法用户率时，就会发生会话攻击。`HTTP GET/POST`\
  \ 洪水攻击属于此类，并耗尽服务器资源 [[11]](#c06.xhtml#ref11a)。\n*   请求攻击：当会话包含大量请求并超过查询的正常容量时，就会发生这种攻击。`excessive\
  \ VERB` 是最流行的请求攻击。\n*   非对称洪水攻击：在这种攻击中，从僵尸网络交付的查询请求相同的资源，以耗尽服务器以满足所有查询。`ReDoS` 中的\
  \ `Regex` 解析和 `Slowloris` 中的 `connection pool` 是此类攻击的主要漏洞区域 [[16]](#c06.xhtml#ref16a)。非对称洪水攻击下的故障应用攻击利用网站糟糕的设计结构和不合理的数据库设计来破坏服务器。`SQL\
  \ injections` 可应用于故障应用程序以锁定数据库访问 [[11]](#c06.xhtml#ref11a)。多个 `HTTP get/post flood`\
  \ 允许在单个数据包的单个会话中封装多个 `HTTP requests`，导致传输此类数据包的复杂性；结果是服务器不响应所有封装的查询 [[11]](#c06.xhtml#ref11a)。\n\
  \n\n\n\n\n*   **慢请求/慢响应攻击**：通过伪造数据包在通信通道中制造拥塞，缓慢向服务器发送请求，导致大量请求在队列中等待响应。这导致服务器处于无响应状态并无法响应。在\
  \ Slowloris 攻击中，服务器端处理部分 HTTP 连接请求；结果服务器无法响应客户端请求 [11]。HTTP 分段攻击让 HTTP 连接挂起更长时间，以击垮服务器。攻击者将合法的\
  \ HTTP 数据包分成多个较小的片段，并在每个片段之间设置时间延迟，将每个片段发送到服务器，导致服务器超时 [11]。Thomas Lukaseder 等 [17\
  \ 定义 定义了慢 POST 攻击，并强调了其以文本文件形式上传请求实体的能力，而通常请求是通过包含 IP 地址的报头传输的。慢 POST 攻击被称为慢 Body\
  \ HTTP 攻击。在慢读攻击中，犯罪分子产生大量请求，从单个服务器索要资源。在发送请求后，犯罪分子在通道中制造拥塞，使服务器保持繁忙状态并产生显著延迟 [17]。\n\
  \n# 6.6  OSI 层的 DDoS 攻击 (#toc.xhtml#s234a)\n\nOSI 模型是指用于全球数字通信的 ISO 标准。它是一个通信框架，其中安排了协议和接口以促进快速通信。犯罪分子通过拦截通信或破坏合法方之间建立的连接，从而在信息交换中制造障碍。DDoS\
  \ 快速指南[18] 总结了针对 OSI 模型不同层触发的最常见 DDoS 攻击，以实施不同类型的犯罪。下表 6.1 总结了所有这些攻击及其发生的对应层 [19]：\n\
  \n| 层名称 | 流量传输 | 层的功能 | 协议和标准 | OSI 层上常见的 DDoS 攻击 |\n| --- | --- | --- | --- | ---\
  \ |\n| 应用层 | 数据传输 | 虚拟终端管理、文件传输、文件访问、文件管理、邮件服务 | FTP, HTTP, POP3, SMTP | PDF GET\
  \ 请求、HTTP GET、HTTP POST、反射/放大攻击、应用请求洪水、数据库连接池耗尽、资源耗尽。 |\n| 表示层 | 数据传输 | 格式化和交付、加密、解密、压缩\
  \ | SSL, AppleTalk Filing Protocol, Telnet | SSL 耗尽、犯罪分子使用 SSL 隧道攻击 HTTP 以破坏服务器功能。\
  \ |\n| 会话层 | 数据传输 | 会话管理、令牌管理、同步、作为对话控制器。 | 登录、注销 | 犯罪分子利用 Telnet 服务器和已安装应用程序中的漏洞使服务器无响应。\
  \ |\n| 传输层 | 段传输 | 连接控制、分段与重组、流量控制、错误控制 | TCP, UDP | SYN 洪水、UDP 洪水、TCP 伪造和非伪造洪水、TCP\
  \ 连接耗尽、IPSec 洪水、慢传输率、长连接 TCP。 |\n| 网络层 | 数据包传输 | 多个网络的融合、路由、逻辑寻址、分段。 | IP, ICMP,\
  \ ARP, RIP | ICMP 洪水、Smurf 攻击、IP/ICMP 分段 |\n| 数据链路层 | 帧传输 | 数据包生成、成帧、添加源和目的地址、访问控制、流量控制\
  \ | (点对点协议) PPP, 802.3, 802.5 | MAC 洪水 |\n| 物理层 | 比特传输 | 建立连接、固定数据传输速率、通信数据传输的方向。\
  \ | 100 Base-T, 1000 Base-X | 通道拥塞阻塞位流接收。 |\n\n**表 6.1：** OSI 层上的 DDoS 洪水攻击\n\n\
  # 6.7 网络战 (#toc.xhtml#s235a)\n\n互联网的发展和信息革命带来了网络战的风险。Catherine A. Theohary 等 [20]\
  \ 定义网络战为对其他国家等同于武装攻击的行动。这种基于技术的行动会导致比例的军事反应。网络战是指利用互联网和网络技术破坏敌方的计算机，类似于配备武器和导弹士兵。互联网技术正被用作武器。因此，各国正在为网络空间做好准备\
  \ [21]。各国进行网络间谍活动和网络侦察，以获取关键信息并检查网络空间的能力。各国现在更关注网络安全，并希望确保其基础设施服务的连续性。因此，他们开始开发进攻性网络战能力和国家战略\
  \ [21]。网络战现在已成为热词，因为它更常见，并涉及政治冲突、经济冲突和具有国际维度的军事冲突 [21]。网络空间充当这些冲突的战场。\n\n## 为什么网络战具有吸引力？\
  \ (#toc.xhtml#s236a)\n\n网络战是为了冻结联网设备的计算机、使关键通信服务器失效，并挫败实现数据保障的技术。Fred Schreier [21]\
  \ 提到了导致网络战受到青的原因。原因如下：\n\n*   网络战对国家来说是经济的，因为不需要大量的军队和武器。\n*   开始网络战的成本很低，只需要计算机和互联网访问。\n\
  *   网络战可以在全球范围内秘密启动。\n*   网络战中使用的工具主要是软件，可以很容易购买或从网上下载。\n*   恶意工具的大量可用性以及向任何人交付且不受限制。\n\
  *   恶意工具和服务的扩散和利用上缺乏技术、财务和法律障碍。\n*   网络空间由于其匿名性隐藏了犯罪分子，使溯源变得困难。\n*   网络空间为无关紧要的人物和犯罪分子提供了不成比例的力量。\n\
  *   网络战是有利的且能拯救生命。\n*   在网络战中，很难评估损害。\n*   不需要参与战斗行动。\n*   网络战不使用战场，但会对对手国家产生长期负面影响。\n\
  *   网络战可以通过计算机上的单点击进行。\n*   防止网络攻击和解决网络战是困难的，因为这些需要具有网络领域深厚知识和经验的熟练硬件和软件工程师，而寻找这些人很难。\n\
  *   IT 基础设施的快速扩张为网络犯罪创造了无数机会。\n*   网络战是一种获得无血征服的方式。\n\n\n\n\n\n网络空间是各国在陆、海、空、太空之后新演化出的第五大战场。它包含了全球所有国家的\
  \ IT 基础设施，使其成为一个整体。网络空间可以被视为一个实验室，恶意软件在此被开发，漏洞在此产生，并试图破坏对手的 IT 基础设施以干扰任何国家关键基础设施的服务。因此，网络战争发生在网络空间中。下表\
  \ 6.2 详细说明了与网络战争常用的一些术语：\n\n| 术语 | 解释 |\n| --- | --- |\n| 网络力量 (Cyber Power) | 指一个国家控制网络空间内及其通过\
  \ IT 系统、计算机网络和数字互联基础设施的能力。 |\n| 网络恐怖分子 (Cyberterrorists) | 网络恐怖分子可以定义为国家支持的行为者，他们利用网络空间并进行有组织的网络犯罪以实现其所属国家的目标。\
  \ |\n| 网络间谍 (Cyberspies) | 指秘密窃取政府或私营组织用于财务和政治利益的专利信息的人。 |\n| 网络窃犯 (Cyberthieves)\
  \ | 通过网络犯罪获取货币利益的人员。 |\n| 网络战士 (Cyberwarriors) | 这些是熟练的硬件和软件工程师，保护计算机系统及其相关设备、IT\
  \ 基础设施和通信基础设施免受网络攻击，并赋予国家制定针对恶意威胁的策略的能力。 |\n| 网络活动分子 (Cyberactivists) | 这些是为了乐趣而非金钱利益而网络犯罪的恶徒。\
  \ |\n| 网络武器 (Cyber-weapons) | 网络武器是恶意程序和代码，在它们的帮助下系统被渗透和破解，IT 基础设施被黑入或损坏，并可能导致国家之间发生网络战争。\
  \ |\n| 网络流氓 (Cyber hooliganism) | 网络流氓代表广泛的网络冲突形式，引起了巨大的公众关注。 |\n| 网络间谍 (Cyber espionage)\
  \ | 网络间谍是指密切监控敌方的计算机及其 IT 基础设施，以获取其秘密、意图和能力。 |\n\n**表 6.2:** 网络战争术语\n\n网络空间现在已转变为作战领域。各国在没有进行军事行动的情况下实现了其政治和战略目标。国家支持的网络犯罪分子试图破坏关键国家基础设施，如政府、电力、健康、交通、金融、安全、经济、教育等，以维持全球霸权。\n\
  \n## 结论\n\n人们正在采用互联网技术来满足各种需求，并在不担心硬件和软件设计中严重危险和漏洞以及互联网基础设施设计严重缺陷的情况下共享机密。基本上，互联网的设计是为了让信赖的学者和研究人员进行知识共享，服务交付中断非常罕见。现在，情况发生了变化，互联网涵盖了所有国家，并整合了合法用户以及犯罪分子以满足他们广泛的政治和经济需求。本章从\
  \ COTS 软件开始，详细介绍了这些软件如何帮助犯罪分子攻破系统并破坏数字基础设施的安全。本文对互联网基础设施进行了检查和评估，以确定固有漏洞并识别导致溯源跟踪过程难以找到真实犯罪源头的问题。此外，还解释了\
  \ CITRA 架构以便在无需人工干预的情况下自动溯源过程。我们还介绍了关于 DDoS 洪水攻击的详细研究，并根据其应用层对其进行了分类。我们检查了 OSI 层的功能，并确定了哪层接收什么种的\
  \ DDoS 洪水攻击。最后，我们概述了网络战争并详细说明了其流行的原因。\n\n## 记忆要点\n\n*   `COTS` 软件意味着“现货可用软件”（Commercial-off-the-shelf\
  \ software）。这些指的是在市场上可以直接用于商业用途而无需任何修改的成品软件产品。\n*   `COTS` 软件既不需要安装方面的技术知识，也不需要定制即可获得服务。\n\
  *   硬件、软件和基础设施中的漏洞被犯罪分子转化为机会。\n*   `COTS` 安装在数百万台计算机上，因此每个系统都包含漏洞，并邀请犯罪分子进行利用和实施犯罪。\n\
  *   漏洞生命周期代表了漏洞在其生命周期内的状态。\n*   每当开发者知道漏洞时，他会发布修改和配置更改代码，通称为“补丁”（patches），以处理并纠正底层缺陷。\n\
  *   互联网并不像电话系统那样能够提供通信双方的跟踪和计费能力。\n*   Internet 结构并不便于跟踪用户行为。\n*   互联网缺乏中央安全机制。\n\
  *   网络安全面临跨行政、司法管辖和国家边界的问题。\n*   互联网是世界上共同且最大的信息资源，包含了遍布全球的计算机和网络设备、布线和网络基础设施。\n\
  *   隧道（Tunneling）基本上指的是一种从一个网络到另一个网络安全传输数据的协议。\n*   将私有数据包封装在外部数据包内部通常被称为“封装”（encapsulation）。\n\
  *   封装包保护了恶意包并帮助它们到达目标，而跟踪机制仅记录公共数据包的细节。\n*   协作入侵追踪和响应架构（CITRA）是一种基于代理的系统，有助于路由器、防火墙安全管理单元和传感器之间的良好协作。\n\
  *   `CITRA` 使用入侵检测和隔离协议（IDIP）来快速集中地报告入侵事件并对这些入侵产生立即有效的响应。\n*   发现协调器（Discovery Coordinator）确定攻击的路径并生成优化系统响应。\n\
  *   在 CITRA 架构中，GrIDS 有助于消除冗余并在发现协调器准备详细报告。\n*   `EMERALD` 是分布式可扩展工具包，用于识别恶意活动、跟踪恶意包传输路径以及定位恶意流量的源。\n\
  *   通过洪水攻击，攻击者试图通过耗尽大量的流量负载来破坏合法用户的网络连接。\n*   攻击者通过使用反射器隐藏自己并实现匿名。\n*   反射器（Reflectors）是指能够启动放大攻击的中间节点，以增加通道流量负载并消耗受害者带宽。\n\
  *   `HTTP 洪水攻击` 是一种特殊的攻击，当大量网络流量以无数查询的形式转向时，服务器将变得无响应。\n*   `HTTP 洪水攻击` 通过 `GET`\
  \ 和 `POST` 请求发起。`GET` 请求用于从服务器接收静态内容（如图像和文本），而通过 `POST` 请求我们接收动态内容（如数据库记录）。\n* \
  \  当攻击者的会话连接速率高于合法用户的速率时，就会发生会话洪水攻击。\n\n\n\n\n\n*   非对称泛洪攻击下的故障应用程序攻击利用网站糟糕的结构设计和不合理的数据库设计来破坏服务器。\n\
  *   HTTP 分段攻击通过让 HTTP 连接挂起更长时间来导致服务器崩溃。\n*   网络战争可以定义为国家对另一个国家采取的、在网络空间中等同于武装攻击或军事行动的行动。\n\
  *   网络空间是政治冲突、经济冲突和军事冲突等冲突的场所。\n*   网络战争的目的是冻结带有联网设备的计算机、使关键服务器失效、导致通信基础设施中断，并阻碍用于实现数据保障的技术策略。\n\
  *   网络空间是新演进的第五战场战场。\n\n## 单选题\n\n1. **COTS 软件代表：**\n    1. 商业现成软件 (Commercial-off-the-shelf\
  \ Software)\n    2. 商业上架软件 (Commercial-on-the-shelf Software)\n    3. 商业税收软件\n \
