  \n# 2.8 网络犯罪地下黑市 #toc.xhtml#s75a\n\n市场使人们能够获得产品；某些人生产产品并投放市场，以交付交付客户并换货币。黑客世界现在已形成一个市场，卖家为其产品寻求最佳价格，而客户则寻求满足其需求的最佳产品。网络犯罪黑市是一个非法市场，网络犯罪分子在其中买卖实施各种网络犯罪所需的恶意工具和被攻破的信息。\n\
  \n网络犯罪即服务是一个相对新的现象，诸如 DDoS 攻击、雇佣垃圾邮件发送者和租用僵尸网络是一些提供给客户的常用价格服务。被攻破的银行账户和信用卡详情是黑市上的热门商品。网络犯罪分子通过租赁基础设施访问、漏洞工具包和被盗账户来获取定期收入。随着全球范围内电子化完成买卖，黑市的规模和复杂性不断增长。要了解其整体、复杂性和速度非常困难，因为它在地理上是分布的、多样化的、分化的、隐形的且具有加密特性。黑客市场的快速发展对企业、政府、金融和国防机构构成了严峻的挑战和严重的威胁。\n\
  \n恶意工具复杂性、专业化和可用性的提高，使得黑市在商人和新手之间广受欢迎。黑市中的企业家和营销人员是受尊敬的客户，他们使用黑客工具和被攻破的信息在业务中领先并击败业务竞争对手。黑客、供应商和客户之间的通信是创新且安全的。加密技术被应用于非记录消息中，以应用隐私机制，使其对他人无知且无用。加密货币中的财务交易规避了媒体报道，并消除了财务崩盘的可能性。从被盗记录和漏洞工具包，到被攻破的卡和网上银行等金融服务，海量的商品和服务吸引了客户在业务和财务上获得竞争优势。\n\
