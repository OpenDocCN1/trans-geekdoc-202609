  \ 年。\n- 18 Harley Kozushko，“入侵检测：基于主机和基于网络的入侵检测系统”，独立研究，2003 年。\n- 19 Sivan Sabato,\
  \ Elad Yom-Tov, Aviad Tsherniak, Saharon Rosset，“分析系统日志：对重要性的新视角”，2007 年。\n- 20\
  \ [`www.stigviewer.com/stig/idps_security_requirements_guide_srg/2012-03-08/finding/SRG-NET-000112-IDPS-000072`](https://www.stigviewer.com/stig/idps_security_requirements_guide_srg/2012-03-08/finding/SRG-NET-000112-IDPS-000072)\n\
  - 21 Saman Shojae Chaeikar, Mohammadreza Jafari, Hamed Taherdoost 和 Nakisa Shojae\
  \ Chaeikar，“电子投票系统中 CIA 安全三角形的定义与标准”，国际高级计算机科学与信息技术期刊，2012 年 10 月。\n- 22 Karen Scarfone\
  \ 和 Peter Mell，“入侵检测与防御系统 (IDPS) 指南”，美国国家标准与技术研究院，美国商务部，2007 年 2 月。\n- 23 报告，“入侵检测与防御系统”，访问自\
  \ [`tsapps.nist.gov/publication/get_pdf.cfm?pub_id=901146#:~:text=IDPS%20technologies%20use%20many%20methodologies,more%20broad%20and%20accurate%20detection`](https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=901146#:~:text=IDPS%20technologies%20use%20many%20methodologies,more%20broad%20and%20accurate%20detection)\n\
