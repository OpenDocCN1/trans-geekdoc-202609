  \ 2.8.1.1 黑市的结构\n\n黑市的快速扩张为有技术的犯罪分子提供了一个平台。技能以货币形式计价，并向客户交付。黑市对有技术的犯罪分子的吸引力是显而易见的，因为只需极小甚至几乎忽略不计的投入即可获得巨额财富。各种通信渠道的发展让网络犯罪分子能够相互发现并联系，便于获取工具、共享技术和基础设施。犯罪分子在数字匿名性的保护下感到安全，并在低风险和有利的环境下肆意欺骗。架构和法律漏洞让网络犯罪分子能够伪装成合法用户，并有足够的时间犯罪后逃避。黑市与正常市场并不相似，因为它主要处理活动而非实体产品。由于缺乏证据，要判断市场规模和追踪犯罪分子非常困难。黑市可以与毒品市场进行比较，区别在于其风险较低且收益更高：\n\
  \n大多数情况下，攻击者并不具备启动和控制网络攻击的所有技能，因此他们必须依赖其他犯罪分子。服务和工具在犯罪分子之间共享，知识进行共享以互相帮助。\n\n###\
  \ 2.8.1.2 黑市的参与者\n\n拥有软技能和网络知识的人可以参与黑市。寻找漏洞和系统渗透需要高级的计算技能、犯罪软件工具和基础设施。熟练的程序员、工具包操作员和基础设施所有者成为了黑市社区的一部分。\n\
  \n\n\n\n\n为了开展复杂的协同网络攻击（范围从针对个人到企业破入），通常需要巨额资金。这些资金被用于准备基础设施和招聘专业人员。资助者为实施网络犯罪提供资金，并确保其在产生的利润中获得份额。\n\
  \n## 结论\n\n在本章中，我们学习了计算机的历史演变，以及它如何转变为一种不仅能够进行计算，还能参与通信的设备。我们了解了计算机的发展及其在通信、银行、教育、商业、创新、娱乐和国防领域的参与，如何为犯罪分子提供了进行非法活动以获取利润和其他更多利益的机会。我们理解到互联网不仅是一个获取利润的媒介，还是一个熟练的网络犯罪分子联手开展组织化犯罪、共享恶意工具和基础设施、培训新手将其转化为熟练的人力资源，并发展一个平行的非法经济的平台。在本章中，我们对网络犯罪的成本进行了分类，并给出了分析框架，以确定除直接损失之外的后果。我们解释了各种形式的网络犯罪及其对个人和社会的影响。此外，我们还确定了导致互联网成为犯罪分子的安全区，以及形成全球性网络犯罪立法和起诉障碍的因素。我们还解释了网络犯罪地下黑市场的庞大结构，并列出了吸引新手和学生进入黑市场的热门产品列表和服务。\n\
  \n本书的下一章将详细介绍用于检测入侵的策略，并介绍了通过各种类型的入侵检测系统减轻此类入侵影响的方法。\n\n## 记忆要点\n\n*   1642 年，著名数学家布莱斯·帕斯卡（Blaise\
  \ Pascal）制造了第一台非电子机械机器，为用户提供了数字加减法辅助。\n*   1813 年，另一位名为查尔斯·巴贝奇（Charles Babbage）的英国数学家设计了一种能够执行高达\
  \ 20 位计算的机械计算器。\n*   19 世纪 80 年代中期，赫曼·何乐（Herman Hollerith）在计算机的发展中发挥了关键作用，为美国的人口普查引入了机械电气数据处理系统。\n\
  *   破坏电话网络并非法配置以拨打免费长途电话的行为被称为`Phreaking`（骗号）。\n*   1961 年，麻理工的伦纳德·克莱因岩（Leonard\
  \ Kleinrock）发表了一篇关于分组交换理论的论文，这成为数据包形式数据传输的基石。\n*   1965 年，罗伯特通过拨号连接将加州的`TX-2`计算机与`Q-32`计算机连接起来。\n\
  *   1969 年，美国国防部和 ARPA-Net 联合为通信目的安装了两个节点。第一个节点配置在加利福尼亚大学洛杉矶分校，另一个节点安装在斯坦福研究所（隶属于犹他大学），以便相互通信。1969\
  \ 年 10 月 29 日晚上 10:30，配置在加利福尼亚大学洛杉矶分校的节点向斯坦福研究所节点发送了一条消息。\n*   康奈尔大学的学生罗伯特·塔普潘·莫里斯（Robert\
  \ Tappan Morris）创建了第一个蠕虫并将其释放到互联网。\n*   网络犯罪是一个风险收益率处于领先的领域。\n*   预期成本（Anticipation\
  \ cost）是指为了防止受网络犯罪侵害而采取防御措施的支出。\n*   `Consequence Cost`（后果成本）：后果成本是指网络犯罪直接产生的总损失成本。\n\
  *   用于在网络犯罪发生后产生适当响应的成本被称为响应成本（response costs）。\n*   `Indirect cost`（间接成本）包括对组织和公司的声誉损害、个人和企业对在线交易信任下降、收入减少以及地下黑市经济的增长。\n\
  *   `Criminal revenue`（犯罪收入）指犯罪产生的货币等值总收入。\n*   `Direct losses`（直接损失）指由于网络犯罪导致的损失、破坏和损害的价值。\n\
  *   `Indirect losses`（间接损失）指恶意活动给社会带来的损失价值和机会成本。\n*   `Defence cost`（防御成本）指预防努力的货币等值。\n\
  *   直接损失、间接损失和防御成本的总和被称为社会成本。\n*   `Cyber Stalking`（网络跟踪）是一种技术辅助的跟踪，攻击者使用电子邮件、社交媒体账户、即时消息、聊天室等网络技术来骚扰人员。\n\
  *   `Cyber Stalking`（网络跟踪）是一种威胁他人以导致其痛苦、焦虑和恐惧的行为。\n*   `Intellectual property`（知识产权）指的是独特的无形人类创作，如创新、文学、艺术、模型、符号、公式、标志和图像，并具有商业价值。\n\
  *   `Copyright laws`（版权法）保护书籍、软件、文学、音乐、绘画、电子游戏、电影等。\n*   `trademark`（商标）指的是独特的符号、标志和单词。\n\
  *   `Phishing`（网络钓鱼）是一种窃取敏感信息（如银行详情、登录凭据）的欺诈尝试。\n*   `Identity theft`（身份盗用）发生在犯罪分子使用他人姓名时。\n\
  *   `Trojan Horse`（特木马）是看似合法的恶意代码。\n*   `defacement`（篡改）攻击通过用几乎相似的页面替换网站原始网页来实施。\n\
  *   `denial of service (DoS)`（拒绝服务攻击）攻击是指试图关闭计算机或整个网络的尝试。\n*   `Distributed denial-of-service\
  \ (DDoS)`（分布式拒绝服务攻击）使用大量受控计算机攻击服务。\n*   `Pornography`是文本、视觉和视听形式的感官内容。\n*   `Ransomware`（勒索软件）是加密文件索要威胁。\n\
