  ### 计算机科学系\n### 勒克瑙大学\n### 勒克瑙\n\n![](img/logo.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  ![](img/logo1.jpg)\n\n\n\n## 献给\n\nBrijendra Singh 教授\n他鼓励我撰写了这本书\n\n## 关于作者\n\n\
  **Rajesh Kumar Goutam 博士**是勒克瑙大学计算机科学系的助理教授。他在计算机科学领域拥有超过 10 年的教学和研究经验。他在勒克瑙的北方邦拉普技术大学获得\
  \ `MCA` 学位，并在勒克瑙的 Babasaheb Bhimrao Ambedkar 大学获得计算机科学 `Ph.D.` 学位。\n\nGoutam 的兴趣在于开发开发。\n\
  \n## 关于审稿人\n\n**Rajesh Kumar Goutam 博士**是勒克瑙大学计算机科学系的助理教授。他在计算机科学领域拥有超过 10 年的教学和研究经验。他在勒克瑙的北方邦拉普技术大学获得\
  \ `MCA` 学位，并在勒克瑙的 Babasaheb Bhimrao Ambedkar 大学获得计算机科学 `Ph.D.` 学位。\n\n## 致谢\n\n\
  首先，我要感谢“全能的神”和我的父母。我要感谢勒克瑙大学校长 `Alok Rai 教授`、勒克瑙大学计算机科学系的 `Brijendra Singh 教授`、Babasaheb\
  \ Bhimrao Ambedkar 大学计算机科学系的 `Sanjay Dwivedi 教授`以及勒克瑙大学的 `Suresh Prasad Kannojia\
  \ 教授`。我感谢 `Sudhir Singh` 和 `Ranjana`。我还要向我的妻子 `Anupam Lata`、兄弟 `Rakesh Kumar` 和嫂子\
  \ `Janki` 表以最特别的谢意。\n\n## 前言\n\n今天，我们拥有一个被称为网络空间的虚拟且本质的世界，它使我们能够在线进行个人、社交经济活动。尽管互联网被认为是数字化变革强大且不可缺的工具，但它是脆弱的，并为犯罪分子获取非法资金以及获得社会利益提供了巨大机会。犯罪分子利用其代码发起攻击，骚扰个人、破解机密业务数据、远程控制基础设施并限制对设备的合法访问。这些攻击在全球范围内数量迅速增加，是由专业人士有组织发起的，旨在扩大破坏范围并造成更大的经济和社会损害。网络犯罪分子现在对国家保护关键基础设施和瘫痪机构运行面临严峻风险。\n\
  \n我们现在生活的数字时代，互联网在我们的生存中起着关键作用。网络用户包括学生、青少年、成年人和老兵正在与犯罪分子共享网络空间并在互联网上发布信息，引入了风险。为了避免这些风险，网络用户必须了解其危险与好处。现在是成为明智用户了，这样我们就可以享受信息通信技术的好处，并在不影响我们安全访问网络空间和联网设备的情况下，挫败分子的恶意尝试。\n\
  \n**本书共包含六章。**\n\n\n\n\n\n第 1 章 介绍了数据和信息的概念，并探索了数据如何转换为有意义的信息。详细阐述了数据通信模型及其组成部分。此外，我们解释了互联网、网络化和万维网，并区分了它们之间的区别，为深入理解网络安全这一学科奠定了坚实的基础。本书将“安全”一词划分为信息安全、网络安全、万维网安全和网络安全，并解释了网络安全现在如何变成一个共同的、全球性的共享的问题。\n\
  \n第 2 章 详细介绍了网络犯罪的历史及其在全球范围内的扩张。我们讨论了用于威胁人们的各种网络犯罪形式。此外，我们讨论了网络安全领域面临的挑战，这些挑战一直是减少不利影响的障碍。我们讨论了网络犯罪如何以及为何获得支持并在全球范围内作为一种职业被采用。\n\
  \n第 3 章 讨论了国家关键基础设施对任何国家的重要性，并详细阐述了其对数字环境的依赖。详细阐述了入侵检测系统的需求及其架构、分类和功能。从入侵检测和防御的角度解释了\
  \ CIA 三要素模型和防御生命周期。本章还详细介绍了入侵的主要类型及其分类。\n\n第 4 章 处理识别网络犯罪真实来源的方法。它详细介绍了网络犯罪分子在实施犯罪时隐藏身份并逃避检测的各种程序。解释了使网络犯罪来源识别困难的障碍。本章详细介绍了溯源机制的完整剖析和分类，这些机制用于追踪和追捕网络犯罪分子。\n\
  \n第 5 章 定义了网络犯罪中的“跳板”。详细阐述了用于检测跳板的算法及其基础假设。此外，根据被动响应和自动响应定义并分类了入侵响应系统。还总结了入侵响应系统（IRS）响应入侵时所采取行动的剖析。\n\
  \n第 6 章 定义了具有漏洞生命周期的通用通用（COTS）软件，以凸显互联网结构的缺陷。本章的主要吸引点包括协作入侵溯源与响应架构（CITRA），它在没有入侵的情况下不会增加额外开销。此外，本章还详细介绍了\
  \ DDoS 攻击及其分类。\n\n## 下载彩色图片：\n\n请点击链接下载书籍的：\n\n彩色图片：\n\n## `https://rebrand.ly/qkhcqzq`\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 第 1 章\n\n## 网络安全简介\n\n互联网是一个巨大的知识库，所有人都可以轻松访问。有趣的是，它为犯罪分子提供了平等的机会。网络犯罪分子利用现代技术开发复杂的工具和技术，并利用它们执行旨在扭曲、破坏和/或窃取敏感数据信息的恶意活动，主要是为了获取利益。他们正在创新、知识共享、经济增长和信息的自由流动制造障碍。在本章中，假设您已经具有计算机网络的基础知识，而本章重点是从网络安全的角度理解数据和信息术语。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   数据和信息\n*   万维网联盟 (W3C)\n*   网络、万维网与互联网的关系\n*\
  \   信息安全\n*   万维网安全\n*   网络安全\n*   网络安全\n\n## 目标\n\n本章的目标是向读者传授数据和信息的基础知识，并让他们意识到数字基础设施中固有风险和问题。阅读本章后，您将理解保护包括互联网、网络和万维网在内的数字基础设施的必要性。您将熟悉网络犯罪的关键动机，并理解信息安全、万维网安全和网络安全等核心概念。我们的重点是介绍网络安全及其涵盖范围，并帮助您理解网络犯罪的恶性架构和分类。\n\
  \n## 1.1 数据和信息\n\n\n\n\n数据可以定义为在实时环境中收集的事实、测量和统计数据。该术语与科学研究相关，并用于推理、讨论和决策。最初，数据以文本、数字或两者的结合形式表示。随着多媒体的引入，“数据”这一术语扩展了其边界，将音频、图像、图形和视频纳入其中。然而，尽管存在多种类型的数据，但它们都以数字形式存储。\n\
  \n信息是存储数据在特定语境下对其预期接收者的意义。在任何阶段，信息对于计算机而言都是数据。当数据以特定目的以有组织的方式经过准确处理，并向用户呈现某些相关意义时，它被称为信息。如果信息没有导致终端用户知识的显著增加，它就会变得毫无用。\n\
  \n### 1.1.1 数据与信息\n\n新手经常在相同的语境下使用`data`和`information`这两个术语，这在技术上是不准确的。数据通常指原始事实或未处理的事实，包含数字、字母、字符和多媒体对象。它代表了特定时间范围内某一组物品的定性或定量测量。当对数据进行处理以得出某些结论时，它被称为信息。数据和信息之间的主要区别如下：\n\
  \n*   数据被用作计算机系统的输入以生成信息。\n*   数据指的是无结构和无组织的事实，当这些事实在特定时间范围内以有组织和结构化的方式进行处理时，我们就得到了信息。\n\
  *   数据本身是独立的，而信息的存在需要数据支持。\n*   数据是无意义的，而信息带有相关意义并对终端用户有益。\n*   我们可以将数据视为生成信息的原材料（类似于产品）。\n\
  \n### 1.1.2 信息的特征\n\n将数据转换为信息需要许多步骤，如数据处理、数据清洗以及数据分析和解释。在信息为用户的知识增加新内容之前，它始终是无关的。它具有五个主要特征：\n\
  \n*   **准确性 (Accuracy)**：它是为用户提供正确事实的分析程度。它意味着无错误、清晰、更新且没有偏差的状态。\n*   **完整性 (Completeness)**：这是另一个重要属性，确保所有必要的数据都已以正确的方式收集和处理，以得出结论。\n\
  *   **一致性 (Consistency)**：指的是信息的一致性，但在局部不包含结论。\n*   **唯一性 (Uniqueness)**：指的是在全球范围内接受的、顺序一致且无歧的事实。\n\
  *   **及时性 (Timeliness)**：它使用户能够根据交付的信息做出快速决策。\n\n## 1.2 数据通信\n\n计算机基本上用于从不同源收集数据，并将这些数据转换为有意义的信息。生成的信息在被正确的时间交付给正确的人之前，是毫无用处的。为了全球用户的利益，快速传输信息同样重要。为了在世界范围内传输信息，我们使用连接良好的数字网络基础设施。在远程信息共享中，通信需要跨越距离。数据通信是指在通信媒介的帮助下，两个或多个计算机之间的信息交换。这种通信媒介可以是有线介质或无线媒介。\n\
  \n### 1.2.1 数据通信模型\n\n数据通信模型包含五个关键组件：\n\n*   **源 (Source)**：源是指生成传输信息的设备。源可以是计算机、手机、电话等。\n\
  *   **消息 (Messages)**：消息是要传送到目的地端的信息。消息可能包括文本、图片、音频、视频或这些者的任何组合。\n*   **传输媒介 (Transmission\
  \ medium)**：传输媒介是指连接源和目的地的物理路径或网络，消息通过此路径从发送者传输到接收者。传输媒介路径可能由同轴电缆、绞线、光纤和卫星微波组成。\n\
  *   **目的 (Destination)**：目的地是指通过传输媒介接收来自发送端信息的设备。\n*   **协议 (Protocols)**：协议是指一组规范双方之间数字通信的规则和惯例。它代表了通信双方之间关于如何进行通信的约定。\n\
  \n### 1.2.2 数据通信系统\n\n数据通信系统的有效性取决于以下特征：\n\n*   **接口 (Interface)**：为了通过通信媒介进行通信，发送端和接收端的设备必须具有接口。由于所有形式的通信都取决于电磁信号的产生，两端的通信接口都起着关键作用。从传输器生成的具有形状和强度等属性的数据信号由通信端的接口接收。这里必须确保通道接口能够接收从传输器生成的原始格式信号。同样，在从信道交付时，接口应将原始信号交付到目的地。\n\
  *   **交付 (Delivery)**：系统必须将信息传输给授权的接收者或正确的目的地。\n*   **准确性 (Accuracy)**：数据必须从源端准确传输，并在接收端以其原始传输形式接收。\n\
  *   **同步 (Synchronization)**：数据包到达目的地的计时和顺序非常重要。传输器和接收者之间必须存在同步。在良好的通信通道中，接收者知道信号何时到达通信媒介，以及它们到达接收端需要多长时间。可以通过现场板球赛的例子轻松理解。如果板球赛正在直播，而我们电视上的数据包是以无序且延迟的方式接收的，我们就无法享受板球赛。\n\
  *   **错误检测与纠错 (Error detection and correction)**：为了检查接收端信号的原始性，通信必须具备错误检测和纠错功能，因为在数据通信中，无法容忍错误（数字和顺序错误）。\n\
  *   **流量控制 (Flow control)**：需要流量控制来补偿传输器、接收者和通信媒介的速度和容量。\n*   **安全性 (Security)**：这是良好通信媒介的必要措施。信息的发送者总是希望确保其发送的信息仅由预期的接收者接收，而不被其他人接收。\n\
  \n\n\n\n计算机网络是一组通过有线或无线介质连接的计算机。网络中的计算机在其所属的网络组内共享信息，并允许来自同一网络其他计算机的远程访问。信息共享是计算机加入网络的首要要求。连接到网络的计算机可以被其他计算机访问。并入网络中的每台计算机被称为节点（node）或终端（terminal）。我们构建计算机网络的目的是数据通信和资源共享。如今最常见的共享资源是与全球维网（World\
  \ Wide Web）的连接，我们可以从中获取全球信息。机构严重依赖网络，以便共享应用程序软件并在有限的空间内提高生产力。\n\n网络有许多分类方法，例如其规模、能力和覆盖的地理区域。这里详细介绍了一些最常见的无处不在类型。\n\
  \n### 1.3.1 局域网 (LAN)\n\n这是规模最小且私有的网络，用于在单个办公室、大楼和校园等较小的覆盖区域内连接两台或多台计算机。`LAN` 中的每台计算机都有自己的识别号，通过该编号在通信过程中进行身份识别。\n\
  \n### 1.3.2 城域网 (MAN)\n\n这种网络跨越的地理区域大于`局域网`（`LAN`）但小于`广域网`（`WAN`）。该术语通过单一大型网络实现跨城市和大学校园的互连。`城域网`（`MAN`）通常通过互连多个`LAN`来形成，以覆盖几公里的区域。\n\
  \n### 1.3.3 广域网 (WAN)\n\n这种类型的网络连接了比`LAN`和`MAN`大得多的地理区域内的计算机或其他网络设备。尽管`WAN`不限于特定的地理位置，但它可能受限于州或国家的边界。连接到`WAN`的计算机和手机等网络设备使用电话系统和卫星系统等公共网络来促进大规模数据传输。`WAN`连接了各种较小的电信网络，包括多个局域网（`LANs`）和广域网（`WANs`）。\n\
  \n### 1.3.4 个人局域网 (PAN)\n\n`个人局域网`（`PAN`）是在个人附近进行信息和数据交换的网络。网络中的系统通常使用无线技术，并在 10\
  \ 米的范围内进行通信。它允许计算机、智能手机和智能手表等设备进行通信和数据共享。在我们的手机中，`手机热点共享`（smart phone tethering）选项就是`PAN`网络的示例，如果将其设置为个人热点，它允许周围的设备进行通信。\n\
  \n### 1.3.5 存储区域网络 (SAN)\n\n`存储区域网络`（`SAN`）是一种高速存储网络架构，允许企业访问连接到多个服务器的共享存储池。它被用于需要高吞吐量和低延迟的关键业务应用程序。它提供基于块的存储，并可以从任何连接服务器上运行的所有应用程序访问。\n\
  \n### 1.3.6 企业私有网 (EPN)\n\n企业私有网旨在保护数据，并使公司不同部门（如办公室、生产地、商店和仓库）之间的资源可共享。不同部门的数字化集成确保了资源的移动性，同时通过加密和隧道协议等各种安全措施实现数据保护。`路由器`（`Routers`）被编程完成注册过程，并决定设备是否可以访问`EPN`。\n\
  \n### 1.3.7 虚拟专用网络 (VPN)\n\n虚拟专用网络为使用互联网等公共或共享基础设施的机构提供私有网络服务。这些私有网络服务经过加密，以确保敏感数据安全地交付给私有公司内的正确人员。它是为有特定需求的机构提供的受控通信分区。\n\
  \n### 1.4 全球维网\n\n全球维网通俗称为`W3`，由英国科学家蒂姆·伯纳斯-李于 1989 年发明。它是虚拟且无边界的网页文档集合。它包含了可以通过网络浏览器访问的网页、图片、视频和其他其他在线内容。它是体现人类知识的、可通过网络访问的信息的集合。全球维网实际上是托管网站的虚拟空间。网页文档由`统一资源定位符`（`URLs`）指定。全球维网向所有人开放，任何想上传文档或网站的人都可以借助`文件传输协议`（`FTP`）和自己的域名轻松实现。全球维网的规模随着时间的推移不断扩大，包含了丰富的信息。其快速扩张背后有几个原因，详细说明如下：\n\
  \n1. 全球维网作为一种媒介，任何人都可以通过它广告并推广自己的业务。\n2. 它消除了信息分发中的地理边界和限制。\n3. 它被用作知识共享平台。\n4.\
  \ 它是言论自由的平台。\n5. 广告覆盖整个世界。\n6. 广告和通信的最快、高科技且可靠的媒介。\n7. 能够传达有关业务的所有信息。\n8. 与市场上的其他替代方案相比，它的成本非常低。\n\
  9. 它不需要太多的人力。\n\n尽管蒂姆·伯纳斯-李发明了全球维网，但它现在的任何规模和形状都是由于人口的。我们所有人都丰富了全球维网，因为无论我们向网络上传什么（无论是文档还是网站），都会成为我们所有人的信息，并通过搜索引擎进行检索。通过这种方式，我们可以说搜索引擎的运行取决于全球维网中可用的文档。全球维网流行的另一个原因是它包含了所有人的信息。来自医疗、工程和研究等领域的人将文档上传到全球维网，这些文档就成了我们的信息。\n\
  \n#### 1.4.1 全球维网的特征\n\n全球维网的主要特征如下：\n\n*   **全球覆盖**：互联网和`W3`的巨大增长代表了信息技术最奇的变革。现在，我们可以体验到借助互联网和全球维网服务器工作的开放、分布的全球信息基础设施。全球维网覆盖了所有存在连接的地理区域。它向所有人开放，上传文本、图片、音频和视频并在需要交付。\n\
  *   **虚拟**：全球维网是一个基于超文本的全球分散信息系统。在参考全球维网，“虚拟”一词指的是持久性和交互性特征。全球维网为我们提供服务并为我们提供知识共享的共同平台，但它本质上是非实体的。\n\
  \n\n\n\n\n*   **无边界**：互联网和万维网的构建使公民能够参与全球数字经济，不受地理限制地获取知识，并无论位置或设备类型，都能与世界其他地方进行合法通信。万维网结构中组织的所有信息都可以被视为一个中央存储。从哪个国家上传并不重要，这意味着文档从世界各个角落被上传到网络，并从这个单一仓库中检索，不受物理边界的限制，以满足搜索者的需求。\n\
  \n## 1.5 互联网\n\n互联网是由许多不同的小网络组成的异构集合，主要由小型公司拥有和运营，以覆盖整个地理区域。小型网络可以通过一组通用的协议相互互联，这些协议解释了如何转换和交换信息。它是各种网络的集合，包含了万维网服务以使其正常运行。它是使万维网内容对用户可用且实用的媒介。\n\
  \n## 1.6 万维网联盟 (W3C)\n\n`World Wide Web Consortium`（`W3C`）是一个国际社区，负责制定规则、法规和标准以确保\
  \ Web 的长期增长。W3C 成立于 1994 年 10 月，旨在促进其扩张和演进，以提供一个全球知识共享平台。它在发明者兼主管 Tim Berners-Lee\
  \ 和首席执行官 Jeffrey Jaffe 的监督下运行，约 450 个机构、70 名员工和公众共同开发 W3 准则和软件。\n\n### 1.6.1 W3C\
  \ 的功能\n\nW3C 的使命是将 Web 带成一种我们能够充分利用其潜能的形式。W3C 创建规范、指南、软件和工具，为信息、商业、独立思想和集体理解提供一个全球平台。W3C\
  \ 执行以下功能：\n\n*   **通用访问**：W3C 正在持续努力提高 Web 作为网络可访问信息宇宙的标准。这些信息可以通过计算机、移动设备、电视机或其他网络设备快速地提供给用户。它的首要任务是为所有人提供一个人类交流的论坛和知识共享的机会。这个论坛让用户能够能够获取信息并独立地分享他们喜欢的内容。它为用户在硬件、软件、网络基础设施、母语言、文化、地理位置或身体或心理能力方面提供了自由。\n\
  \n*   **信任建立**：Web 是一个协作平台，向所有人开放以分享他们的任何感受和经历。个人的观点可能会转移大众的注意力并在社会中引发爆炸性局面。为了促进信任环境，W3C\
  \ 努力创建 `Web of Trust` 以维护机密性、可靠性和完整性。它还开发了追溯系统，使人们对在网络上发布的任何内容负责。\n\n*   **互操作性**：所有人对信息的需求至关重要，而\
  \ Web 是随处可自由获取的各种信息的巨大来源。对于 W3C 来说，满足所有人的需求并提供信息是一项挑战，因为他们使用不同的平台、基础设施和软件。所有用户无法在软件和界面上保持一致。W3C\
  \ 持续努力采用其基础设施的变革，以支持所有用户使用的各种软件来满足他们的信息需求。\n\n*   **演进性**：W3C 相信演进性……（为了简洁省略了内容）……它遵循原则性、模块化、兼容性和扩展性。\n\
  \n*   **去中心化**：W3C 相信去中心化……（为了简洁省略了内容）……想要保持保密。\n\n## 1.7 网络、W3 与关系\n\n`internet`\
  \ 和 `W3` 术语经常互换使用，但实际上两者是不同的。互联网是一个包含许多子网络的庞大网络，所有地理区域的人都可以访问。网络技术有助于将数据从一个服务器传输到另一个服务器。万维网是互联网页的虚拟集合。超链接方便用户在网页之间进行导航。如今，W3\
  \ 可以在网络技术的帮助下，为信息寻求者提供相关且所需的信息。用户通过互联网作为中介连接到互联网，然后互联网将用户带到万维网，并帮助用户访问存在于网路上的文档。万维网是由遍布宇宙各地的众多服务器组成的。\n\
  \n## 1.8 信息安全\n\n在这个数字时代，保护我们的信息与保护我们的物理资产一样重要。信息安全涉及保护数字信息免受破坏、盗取和未经授权的访问。我们可能拥有医疗报告或财务记录，我们希望对其他人（甚至是家人）保持保密。我们还希望自己的邮件和社交媒体帖子拥有隐私。我们不希望向任何人披露互联网密码、信用卡号和银行详情，并担心它们落入别有用手。由于快速且频繁的需求，我们将文档、照片和视频存储在在线存储中。信息安全对于所有组织和企业也至关重要，因为他们与客户和列出的交易者进行业务，并且他们希望保密。这里提到的信息安全有八个相互交织的领域：\n\
  \n*   **机密性**：机密性处理保护信息免受未经授权的侵害。\n*   **完整性**：完整性确保收到的信息与发送时是真实且准确的，没有被入侵者进行任何修改。\n\
  *   **可用性**：它涉及用户在所需的地点和时间以原始形式访问信息的能力。\n*   **真实性**：真实性指的是确保消息、财务交易或通信来自其所声称的来源。没有身份识别，真实性就是不完全的。\n\
  *   **可靠性**：可靠性涉及系统产生真实且可靠信息的能力。\n*   **非否认性**：非否认性是指系统防止参与通信的用户否认真实性的能力。\n\n\n\n\
  \n\n- **问责制 (Accountability)**：该术语指的是系统能够为在互联网互联环境中进行活动的用户分配身份的能力。\n- **可审计性 (Auditability)**：可审计性是指对整个信息系统进行系统的评估，衡量其符合既定信息安全标准的程度。\n\
  \n## 1.9 万维网安全\n\n万维网是一个由分布在世界的大量高容量服务器组成的系统。每台服务器都维护从特定区域上传的信息存储。此外，所有服务器的信息合并成一个整体系统，通过搜索引擎和网络浏览器的帮助在此进行信息检索。搜索引擎是帮助信息搜索者从万维网获取结果的软件。通常，信息搜索者无法直接与万维网交互。搜索引擎允许搜索者提出查询，并在清理后将查询词与万维网中的可用网页内容进行匹配。响应查询，搜索引擎会给出一个包含网页链接和摘要的列表。\n\
  \n由于互联网的处处优势，政府、军队、研究和教育机构、金融机构、安全机构甚至个人每天都在发布数百万份文档，并在网络上共享机密信息。大多数公共服务如电子商务、交通、通信、广播、医疗等完全依赖于互联网。互联网最重要的点是其对所有人的可用性和实用性。好人利用其潜力创造社会利益，而另一些人利用它获取非法利润、政治和公司利益、分发受限内容以及个人报复。人们将其作为制造谣言和扩大社区暴力的工具。网络犯罪造成了以下问题：\n\
  \n1. 他们创建恶意代码以获得未经授权的访问并利用漏洞。\n2. 他们远程控制整个系统并防止合法用户进行利用。\n3. 破坏机密性以获取政治、公司和社会利益。\n\
  4. 在数据传输过程中破坏信息的机密性和完整性。\n\n考虑到上述事实，互联网和万维网的安全对于保持这一基础设施免受网络犯罪者的触及变得重要且至关重要。\n\n\
  ## 1.10 网络安全\n\n社会改变了通信方式。现在，我们使用基于互联网的通信通道与家人、朋友或同事建立联系。我们使用即时消息、电子邮件和电话通话进行通信，并通过视频会议进行会议。信息和数据通过网络从一个地方立即传输到另一个地方。一旦你系统中的数据从外部被访问，它就网络的一部分。这是入侵者可以窃取、扭曲和破坏你的数据的另一个领域，而你只有有限的控制权。网络安全是一种不让入侵者访问网络并维护网络秘密性、身份验证、不可否认性和完整性的活动。有效的网络安全识别合法用户并让他们访问网络，同时阻止各种威胁和病毒进入或在网络中传播。\n\
  \n计算机网络基于**开放系统互连接**模型（**OSI**）及其七层。各层通过固定顺序的接口进行通信，在发送者和接收者之间提供通信和数据传输。协议是为了指导网络应用和层如何运行的规则和标准。在通过一个层后，协议具有某些固定状态，每个状态在固定时间线上产生某些事件。入侵者经常操纵和干扰这些事件，以破坏信息及其完整性。虽然通过网络的所有数据流量并非恶意的，但某些数据包可能会导致问题。识别那些恶意包并将其从正常数据流量中排除是非常关重要的。此类数据包的识别和拒绝是借助用于确保网络保护的安全策略执行的。最常见的情况是，入侵者利用安全策略中的弱点并绕过安全规则造成损害。\n\
  \n为了理解双方之间的通信，了解每一层的功能及其存在漏洞的内部结构至关重要。OSI 模型每一层的漏洞和风险如下：\n\n- OSI 模型中的最顶层是应用层，它最接近终端用户。该层负责检查用户的真实性并保护网络免受非法访问，以维护网络隐私。一旦用户的真实性得到确认，就可以运行文件传输、电子邮件和\
  \ FTP 等应用服务。该层为终端用户提供接口并处理操作的语法和语义。通常，入侵者利用该层实施浏览器克隆和与电子邮件相关的犯罪。\n- 表示层位于应用层之下，负责信息数据的加密、解密、压缩和封装。它根据应用程序的需求转换数据。该层的漏洞吸引了基于\
  \ Unicode 和隐写术的攻击。\n- OSI 模型中倒数第三层是会话层。它建立和终止连接，以启动和结束计算机与应用程序之间的对话、交换和对话。会话劫持和欺骗由于会话层漏洞的最常见的犯罪。\n\
  - 传输层是 OSI 模型中的第四层，确保完整且无错误的数据传输。它关注数据流、可靠交付、错误检测以及通信通道上传输信息的重传。该层支持传输控制协议（**TCP**）和用户数据报协议（**UDP**），向指定的计算机传递无错误信息。由于\
  \ TCP 和 UDP 中的一些端口未受保护，导致网络犯罪分子利用漏洞造成危害。\n- 网络层服务包括在节点到节点传输数据时的路由、地址和错误处理。拥塞控制和数据包排序也是其服务的不可缺的一部分。它在传输期间将逻辑地址（`IP`）转换为物理地址（`MAC`）。它支持\
  \ `ICMP`、`IP` 和 `ARP` 协议。该层的漏洞会导致泛洪、嗅探和监听攻击，使犯罪分子能够在数据传输期间获取登录密码。\n- OSI 参考模型中的链路层负责提供相邻机器之间可靠高效的通信。它将数据分解成帧，并确定帧边界，以便物理层在介质上传输。Kai-Hau\
  \ Yeung 等[18]](#c01.xhtml#ref18a) 认为链路层没有多少安全措施，且非常脆弱。它由带有生成树协议（**STP**）和动态主机配置协议（**DHCP**）的交换机组成，执行动态\
  \ IP 分配。该层的交换机负责提供局域网连接，并引入来自组织内部的威胁。该层最常见的攻击是 MAC 泛洪或 ARP 毒化。\n\n\n\n\nOSI 模型的的最底层是物理层，它连接到硬件手段，用于在载体上发送和接收比特流。数据在物理层通过\
  \ `Fast Ethernet`、`RS232` 和 `ATM` 等协议的帮助进行传输和接收。在这一层，大多数安全威胁都会导致企业网络遭受`拒绝服务`（`DoS`），阻止合法用户访问信息和资源。这种破坏是通过干扰连接和操纵无线信号来实现的。\n\
  \n## 1.11 网络安全\n\n随着互联网的出现，以最少的人力快速获取信息已成为可能。据我们所知，它是唯一能够在极短时间内在全球范围内推广业务的媒介。互联网的指数级增长也对全球经济产生了积极影响，因为在过去的三十里，与网络相关的活动大幅增加。互联网和网络使用的的增长赋予了个人力量，同时也给政府和网络空间管理带来了新的挑战。网络安全现在已成为全球关注的焦点，因为它正受到犯罪分子、黑客和恐怖分子的威胁，他们试图身份盗窃和金融欺诈。恐怖分子正将互联网作为武器开展活动并窃取不同国家的信息。移动手机的出现也为网络世界增加了更多复杂性。此外，复杂且恶意的软件经常会损害计算机系统并阻塞网络。这一切都使网络安全成为影响经济发展和国家安全的全球性问题。\n\
  \n### 1.11.1 网络安全的重要性\n\n“Cyber”一词源自“Cybernetic”（控制论）世界，意为使用计算机 [19]。控制论涵盖了调节反馈的通信和控制理论。网络安全包括用于保护网络、计算机硬件、软件、程序、信息和数据免受攻击、损坏或未经授权访问的技术、流程和实践。网络安全涵盖了为了防止信息被盗取、破坏或攻击的预防性策略。它要求识别损害数据和信息机性和完整性的威胁和其他恶意代码的卓越能力。\n\
  \n网络安全术语涵盖以下三个方面：\n\n*   网络安全包含了旨在保护计算机、网络、硬件和软件的技术性和非技术性活动及措施。\n*   通过技术和非技术活动及措施实现的保护程度。\n\
  *   对所实施的措施进行研究和分析，以提高其有效性和质量。\n\nRossouw von Solms 和 Johan van Niekerk [12] 将网络安全定义为工具、政策、安全概念、安全保障措施、指南、风险管理方法、行动、培训、最佳实践、保证和技术的集合，这些工具可用于保护网络环境、组织以及用户的资产。组织和用户的资产包括连接的计算设备、人员、基础设施、应用程序、服务、电信系统，以及网络环境中传输和/或存储的信息的总量\
  \ [12]。\n\n随着数据重要性的提高，世界正面临着全球范围的信息战。预计在未来几年中，这种战争将更占主导。为了社会、政治、财务利益而进行的数据窃取使人们处于弱境地。网络安全是政府、军队、研究和教育机构、金融机构、安全机构甚至个人必须考虑的必要因素。对于家庭和父母来说，由于这个数字互联环境非常重要，儿童和家庭成员的安全也至关重要。即时消息、聊天室和电子邮件可能在金融欺诈方面为儿童和家人带来严重麻烦。国家的地理边界为网络犯罪分子提供了安全覆盖，而\
  \ W3 的无形和无国界性质为他们提供了无数目标。\n\n### 1.11.2 网络安全——一个国际问题\n\n互联的数字技术在世界各国创新、知识共享和全球贸易繁荣中起着至关重要的作用。它为我们提供了思想实时无国界交流的机会。网络犯罪分子为我们进步的道路设置了障碍，影响了全球数百万的人以及无数企业、企业家和每个国家的政府。网络犯罪现在已变成一种业务，由于在线欺诈、身份盗窃以及某些在线非法活动，每年产值超过万亿美元。网络犯罪分子利用匿名性，在各国之间缺乏信任的情况下建立自己的企业，在全球范围内实施网络犯罪。为了使追踪和溯变得困难，有时犯罪集团会按照特定的顺序，从世界不同地点分阶段触发攻击。\n\
  \n### 1.11.3 共同与共享责任\n\n网络安全现在是全球范围内日益关注的问题，在过去的二十年里，网络攻击的复杂性、敏感信息泄露和资金损失正以指数级增长。技术的快速发展在立法和监管网络安全框架之间造成了中间差距，这种差距源于对新出现犯罪行为识别延迟以及对现有法律修订的采纳。网络安全是一个跨国国际问题，网络犯罪的法律和条款不能孤立地制定。各国政府必须在同一方向上共同努力，为有效的区域和国际框架发展制定法律、法规、标准和必要的指南\
  \ [6]。\n\n\n\n\n网络犯罪是一个非常严重的问题，也是对全球经济最危险的犯罪威胁。所有国家都在努力应对其触目惊心的影响。尽管大多数国家已经制定了自己的策略来应对新兴的安全问题并处理网络犯罪，但这些措施仍然远远不够。其复杂性和国际化特征需要一种多方利益相关者的方法，必须明确定义所有国家、安全机构和其他潜在伙伴的角色和职责，以保护网络空间。参与者必须拥有一清晰的原则，明确如何识别、管理和减轻风险，以便起草法律并制定安全框架。\n\
  \n### 1.11.4 网络空间\n\n“网络空间”（Cyberspace）一词指的是大量通信、网络、各种数据库和不同信息通道融合。它是一个互联的全球数字基础设施，由互联网、电信网络、计算机系统、处理器以及不同机构中的各种控制器组成[\\\
  [4\\]](#c01.xhtml#ref4a)。网络空间不仅包含互联网和计算机，还连接了可以通过其他设备直接或间接到到的电子系统或设备。这些设备可能包括`自动取款机`\
  \ (`ATMs`)、`监控控制与数据采集` (`SCADA`) 系统以及其他的电信处理器[\\[7\\]](#c01.xhtml#ref7a)。网络空间还包括计算机上的软件和数据。电缆等传输介质以及`路由器`、`桥`、`服务器`等设备也是的一部分。\n\
  \n特定国家的网络空间是全球网络空间的一部分。它无法被某个国家隔离并通过地理边界控制。它有自己的地图和复杂的电子制图技术，有助于网络管理和故障检测[\\[7\\\
  ]](#c01.xhtml#ref7a)。其匿名性和无界性使其独特性。与受地理边界的物理世界不同，网络空间正在不断扩张。技术的快速发展加速了数据传输速度，并方便用户进行视频、图片交换和资金转移。\n\
  \n### 1.11.5 网络犯罪\n\n网络犯罪是指在互联的数字环境中利用计算机和互联网进行的非法行为。它利用网络空间进行非法活动，并利用其速度、即时性和加密等独特特征隐藏非法活动和犯罪分子。网络犯罪涵盖了广泛的犯罪，包括针对数据和系统的犯罪、基于网络的伪造和诈骗、传播色情和盗版内容。网络犯罪目前尚没有全球公认的定义。美国律师无法在美国特定的法律框架下来界定网络犯罪[\\\
  [8\\]](#c01.xhtml#ref8a)。网络犯罪有三元理论，即针对计算机的犯罪、计算机中的犯罪以及通过计算机进行的犯罪[\\[11\\]](#c01.xhtml#ref11a)。\n\
  \n### 1.11.6 网络犯罪的恶性结构\n\n网络犯罪正变得复杂，比传统犯罪具有更严重的经济影响。依赖信息技术和技能且具有全球范围的方法，使得网络犯罪在结构上与传统犯罪不同。与身体暴力、抢劫、盗窃、伪造等针对本人的传统犯罪相比，网络犯罪高度依赖技能，其影响是持久的。在传统犯罪中，存在物理证据的风险可以帮助警方和安全机构找到犯罪分子，但在网络犯罪中，有大量机会让犯罪分子逃避侦查，甚至不被怀疑。网络犯罪现在变得越来越复杂，其检测和报告也同样如此。大多数技术高明的犯罪分子由于经济利益大且被发现的概率低，正将其作为全职职业。此外，传统的执法渠道仍然没有任何国际公认的指南和立法来界定网络犯罪并惩罚犯罪分子。\n\
  \n如`图 1.1`所示的恶性结构显示了网络犯罪分子、网络受害者和执法机构的特征如何相互支撑。受害者不相信执法机构，认为他们无法获得重要的帮助。他们缺乏足够的技能和保护性基础设施来应对网络犯罪，这促使网络犯罪分子实施犯罪。大多数时候，网络犯罪未被报告，是因为担心失去客户信任、损害公司声誉以及由于害怕社会羞辱而损害个人。银行、金融机构、国防组织和其他拥有敏感数据和财务信息的企业不会突出其与网络犯罪相关的受害新闻：\n\
  \n![](img/Figure-1.1.jpg)\n\n**图 1.1:** 网络犯罪的恶性结构\n\n警方和司法部门等执法机构没有足够的经验来处理新型犯罪。大多数国家的警察都有自己的本地边界和法律障碍，导致他们在处理网络犯罪的全球性质时感到不从心。技术的快速进步和响应机制的缺乏允许犯罪分子利用复杂的工具实施网络犯罪，这些工具帮助他们隐藏身份并篡改、干扰或误导调查。遗憾的是，执法机构采用先进技术的速度没有网络犯罪分子快。网络犯罪调查极其复杂，需要丰富的资源和专业知识来惩罚犯罪分子。各国及其内部机构之间缺乏协作和协调也使得局势变得更加严峻。\n\
  \n网络犯罪是目前增长最快的犯罪领域。网络犯罪分子利用互联网的速度、便利性和全球互联性实施不分国界的各种犯罪活动，造成了严重损害并给世界带来每天的新挑战。具有国际维度的网络犯罪调查和预防非常困难，因为这需要熟练的人力资源跨国合作。几年前，网络犯罪是由个人或小组为了个人利益实施的，但现在趋势已经改变，从全球选出的高技能网络犯罪分子网络正在实时形成，以空前的规模获利。\n\
  \nWall 将网络犯罪定义为通过网络技术进行的犯罪和有害行为转化，并将网络犯罪分为三类\\[8, [10\\]](#c01.xhtml#ref10a)：\n\n\
  1. 违反计算机系统完整性和运行秩序犯罪（黑客）。\n2. 利用网络空间的犯罪（犯罪分子之间的加密通信以及伪造和非法销售产品）。\n3. 包括非法信息传输的犯罪（窃密、传播有害内容）。\n\
  \n### 1.11.7 网络犯罪的分类\n\n网络犯罪包括对网络空间的非法利用。网络空间的速度、即时性、远程操作、加密和模糊等特征被利用，使得识别犯罪及其来源以及犯罪分子变得困难[\\\
  [10\\]](#c01.xhtml#ref10a)。网络犯罪可以分为两类。在第一类中，计算机被用来实施网络犯罪的工具；而在另一类中，计算机成为目标：\n\n\
  | **内容的访问和传播** | **数据的恶意破坏或修改** | **通信的使用** |\n| --- | --- | --- |\n| *秘密*<br>*知识*<br>*版权内容*<br>*色情内容*<br>*社区谣言*<br>*公司信息*\
  \ | | |\n\n\n\n\n\n* 身份否认\n* 财务统计\n* EMP 电磁脉冲供应\n* 硬件破坏\n* 账户劫持\n* 图像破坏\n* 骚扰\n\
  * 垃圾信息\n* 勒索\n* 禁止材料和信息的业务\n\n**表 1.1:** 以计算机为工具的网络犯罪\n\n当计算机被用工具时，会发生以下非法活动：\n\n\
  * 内容的非法访问和传播\n* 对数据的恶意破坏或修改\n* 使用通信工具\n\n这些非法活动涉及的犯罪见*表 1.1*。\n\n当计算机成为犯罪分子的目标时，会发生以下非法活动：\n\
  \n1. 未经授权的访问\n2. 注入恶意代码\n3. 破坏操作\n4. 服务盗取\n\n*表 1.2* 显示了网络犯罪第二类中的各种犯罪：\n\n| **未经授权访问**\
  \ | **注入恶意代码** | **破坏操作** | **服务盗取** |\n| --- | --- | --- | --- |\n| | | | |\n\n\
  * 黑客攻击\n* 系统劫持\n* 网络劫持\n* IP 欺骗\n* 恶意软件\n* 间谍软件\n* 病毒\n* 勒索软件\n* DoS\n* DDoS\n*\
  \ 未经授权的使用\n\n**表 1.2:** 以计算机为目标的网络犯罪\n\n# 1.11.8 网络犯罪背后的动机 (#toc.xhtml#s34a)\n\n\
  网络犯罪的数量迅速增加。潜在的犯罪者发现了新机会，针对不同的目标、以不同的规模和不同的动机发动各种形式的网络攻击。为了减少网络犯罪的数量，了解复杂的非法网络活动背后的动机至关重要。李新欣\
  \ [\\[9\\]](#c01.xhtml#ref9a) 揭示了人员实施网络犯罪的各种原因。这些如下：\n\n1. 经济利益\n2. 政治利益\n3. 以声望为目标\n\
  4. 负面思想\n5. 接受技术挑战\n6. 寻求新知识的奇奇\n7. 展示编程技能\n8. 通过黑客攻击改变学术成绩\n9. 动员政治运动\n10. 骚扰动机\n\
  11. 为黑客社区而黑客\n12. 破坏信息系统中包含的证据\n13. 性驱动的滥用\n14. 心理抑郁\n\n# 1.11.9 网络攻击、威胁、漏洞和恶意软件\
  \ (#toc.xhtml#s35a)\n\n网络攻击是指指向计算机系统、网络和数字基础设施的行为，旨在破坏设备运行、更改处理、获取未经授权的访问并损坏存储的数据。它是计算机与计算机、计算机与网络之间的攻击，违反了计算机的机密性、完整性和可用性，并干扰通过的信息。犯罪分子引发网络攻击以获取社会、政治和财务利益。\n\
  \n在网络安全中，威胁是指可能对计算机、网络及其硬件造成严重危害的恶意代码、代理或活动。安全专家将威胁分为结构化和非结构化两类。结构化威胁通过复杂的工具变得复杂且获得良好支持。这些是在拥有大量资金和情报支持的国家赞助下创建，旨在对数字基础设施造成破坏并干扰敌国的服务。在结构化威胁的情况下，追踪和寻找元首需要技巧和耐心。另一方面，非结构化威胁是为了获得对网络的隐藏访问，其短期目标如信息窃取、间谍活动和破坏。这些威胁是由资金和技能有限的个人或小团体创建，旨在干扰他人。\n\
  \n漏洞是指计算机、网络和数字基础设施中的缺陷，这些缺陷会导致风险并引发犯罪分子实施犯罪。恶意用户寻找通过这些漏洞获得对计算机和其他网络设备未经授权控制的方法。互联的数字环境包含两个基本组件：硬件和软件，两者都可能存在设计和运行问题。有时，损坏的硬件和故障的软件运行良好并满足用户需求，但同时通过其漏洞吸引犯罪分子。与软件漏洞相比，识别和修复硬件漏洞非常困难。硬件漏洞的识别需要在模块耦合之前进行兼容性和互操作测试。\n\
  \n恶意软件是恶意（malicious）和软件（software）两个词的结合。它是插入系统的软件或程序代码，通过创建漏洞来从远程控制系统。它可以损坏硬件、破坏存储的数据并拒绝合法用户的访问。一旦恶意软件驻留在系统中，它就会隐藏自己的踪迹并禁用安全措施，在系统和入侵者之间建立桥梁。这一切都发生在未经所有者许可和不知情的情况下\
  \ [\\[13\\]](#c01.xhtml#ref13a)。入侵者根据需要访问存储在远程系统上的信息，并对其实际用户进行加密以索要赎金。\n\n# 1.11.10\
  \ 网络恐怖主义 (#toc.xhtml#s36a)\n\n网络恐怖主义是非法暴力的活动，利用互联网技术破坏国家的关键基础设施。关键基础设施包括政府向公民提供的基本服务以及主要的公共部门模块，如能源、交通、教育、医疗、银行、金融和国防。网络恐怖主义是有政治动机的行为，往往以宗教和意识形态为核心，造成巨大的破坏。恐怖分子煽动大部分人口并将意识形态强加于他们身上，让他们变得暴力。他们渗透关键基础设施以夺取政府服务。然而，直到目前，我们还没有发现全球认可的网络恐怖主义定义，但\
  \ Denning [\\[15\\]](#c01.xhtml#ref15a) 将网络恐怖主义定义如下 [\\[14\\]](#c01.xhtml#ref14a)[\\\
  [15\\]](#c01.xhtml#ref15a)[\\[16\\]](#c01.xhtml#ref16a) [\\[17\\]](#c01.xhtml#ref17a):\n\
  \n```\n“网络恐怖主义是恐怖主义与网络空间的汇。它通常被理解为对计算机、网络及其中存储的信息进行的非法攻击和威胁，目的是为了实现政治或社会目标而恐吓或胁迫政府及其人民。此外，要符合网络恐怖主义的定义，攻击会对人员或财产造成暴力，或至少产生足够的恐惧。导致死亡或人身、爆炸、飞机坠毁、水污染或严重经济损失的攻击都是例子。针对关键基础设施的严重攻击取决于其影响，可能是网络恐怖主义行为。干扰非基本服务或主要是昂贵骚扰的攻击不是。”\n\
  ```\n\n网络恐怖主义是基于国家及其关键基础设施对互联网和通信技术的依赖的活动。高技能恐怖分子了解其潜力，并通过电子网络攻击进入计算机和网络，控制能源、交通、教育和医疗等公共部门模块。它还会中断基本服务，如电力供应、饮用水供应、燃料供应和水坝控制。通过这种方式，网络恐怖主义威胁了国家安全以及数百万生命。\n\
  \n有几个原因导致恐怖分子被网络恐怖主义吸引。这些原因如下：\n\n1. 比传统的活动更便宜，不需要武器和爆炸材料。\n2. 它是安全的，因为恐怖分子不需要面对面。他们通过躲在匿名的数字盾牌后发动攻击。\n\
  3. 在如此巨大的数字互联环境中，追踪和溯源非常困难。\n\n\n\n\n\n4. 恐怖分子与目标之间的距离被认为几乎可以忽略不计。\n\n5. 消除政治、社会和文化障碍。\n\
  \n6. 目标的数量及其种类极其丰富。\n\n7. 恐怖分子不需要前往战场，而是从他们合适且理想的地方发起攻击。\n\n8. 网络恐怖主义比传统活动留更巨大的影响。\n\
  \n## 1.12 从信息安全到网络安全\n\n“网络安全”和“信息安全”这两个术经常交叉使用，但它们之间存在显著差异。网络安全的定义超出了信息安全的边界，包含了与网络空间程序的通信技术。信息安全涉及保护信息的机密性、完整性和可用性，特别是当信息无法通过信道可用且从\
  \ `W3` 资源访问时。`图 1.2`显示了在网络设备和万维网存在，信息安全是如何转换为`网络安全`的。\n\n![](img/Figure-1.2.jpg)\n\
  \n**图 1.2:** 从信息安全到网络安全的转换\n\n当计算机信息通过信道传输并经过`routers`和`switches`等其他设备，但无法通过网络空间访问时，则被称为网络安全`12`。网络安全包含了信息安全和网络安全，并增加了更多维度，例如普通家用电器的安全、社会利益以及国家关键基础设施的安全性。网络安全需要被视为信息安全以及网络安全的扩展。它关关于利用信息和通信技术来保护易受攻击的物品。信息安全仅处理无形资产的安全，而网络安全则保护无形和有形两种类型的资产`12`。\n\
  \n网络安全是一个复杂的问题，技术的快速进步和新非技能互联网用户的增加使得形势变得严峻。我们距离能够保护信息、网络和资产的永久有效解决方案仍然遥远。网络安全包含了一系列工具、技术、风险管理技术、培训和最佳实践，有助于保护网络、通信设备、操作系统和数据免受恶意攻击和未经授权的访问。当信息存储于没有互联网连接的计算机时，它更安全且被破解的概率较小，但一旦它通过不同的通信信道和设备，就需要更多的安全措施和保障。换句话说，信息安全所需的保护相对于网络安全所需的保护来说要少得多。\n\
  \n## 1.13 风险分析在网络安全中的作用\n\n风险分析的作用是在互联数字环境中问题发生之前，识别出可能对安全计划产生负面影响的潜在问题。它是为了缓解网络和网络环境中威胁和漏洞带来的不利影响的准备。\n\
  \n网络安全风险评估过程首先确定可能受影响的资产，随后识别产生不利影响的风险。进行风险分析的组织寻求各种组件之间的相对重要性和相互作用：威胁、漏洞、资产、价值、保护和保障措施，如`图\
  \ 1.3`所示：\n\n![](img/Figure-1.3.jpg)\n\n**图 1.3:** 风险分析过程\n\n风险分析是一个持续、多维度且前瞻性的过程，有助于预测可能的安全威胁并估算相关成本，以便对数字基础设施的安全有一个了解。风险管理分为三个阶段：可能风险的调查、风险识别和风险分析。\n\
  \n## 结论\n\n在本介绍章节中，你学习了数据、信息和数据系统的基本概念。你不仅学习了互联网、网络和万维网，还学习了它们之间的关系、特征和安全方面。本章详细介绍了侵入者如何利用互联技术及其全球范围产生数十亿的利润，并隐藏在匿名的数字盾牌之后。本章揭示了计算安全格局如何发生剧变。起初，是孤立系统的安全；随后变为信息安全和网络安全，现在合并并转换为网络安全。\n\
  \n*   数据是指为了分析而收集的事实和统计数据。数据可以以电信号的形式传输并存储在磁性和光介质上。\n\n*   信息是关于某人或某事的事实。它是在特定背景下经过处理、组织和结构化的数据，对人类有用。\n\
  \n*   信息具有以下特征：\n    *   准确性\n    *   完整性\n    *   一致性\n    *   唯一性\n    *   及时性\n\
  \n*   数据通信是指在某些通信媒介的帮助下，两台或两台以上计算机之间的信息交换。\n\n*   数据通信模型具有以下五个组件：\n    *   源\n \
  \   *   消息\n    *   传输介质\n    *   目的\n    *   协议\n\n*   数据通信系统具有以下特征：\n    *   接口\n\
  \    *   交付\n    *   准确性\n    *   同步\n    *   错误检测与纠正\n    *   流量控制\n    *   安全\n\
  \n*   如果两个或两个以上的系统通过引导介质或非引导介质连接，并能够相互交换数据，则称它们处于网络中。\n\n*   互联网是一个由许多小型网络组成的全球网络，具有在万维网中获取和存储数据的能力。\n\
  \n*   万维网联盟（俗称`W3C`）成立于 1994 年。这是一个国际社区，负责制定规则、法规和标准，以确保 Web 的长期增长。\n\n*   信息安全的八个交织领域是机密性、完整性、可用性、真实性、可信性、不可否认性、责任追溯性和审计性。\n\
  \n\n\n\n\n*   网络安全是工具、策略、安全概念、安全防护、指南、风险管理方法、行动、培训、最佳实践、保证和技术的集合，这些可用于保护网络环境、组织以及用户的资产。\n\
  \n*   万维网促进了以下功能：\n    *   通用访问\n    *   信任建立\n    *   互操作性\n    *   可演性\n    *\
  \   去中心化\n\n*   网络空间指的是巨大的所有通信、网络、各种数据库和不同信息通道的融合。它在本质上是无形、无边界且虚拟的。\n\n*   网络犯罪是指在互联的数字环境中利用计算机和互联网进行的非法行为。\n\
  \n*   网络犯罪具有三元理论，即针对计算机的犯罪、计算机中的犯罪以及通过计算机进行的犯罪。\n\n*   网络攻击是指指向计算机系统、网络和数字基础设施的行动，旨在破坏设备运行、更改处理过程、获取未经授权的访问以及损坏存储的数据。\n\
  \n*   威胁是指恶意代码、代理或活动，具有对安装在计算机、网络及其硬件上的软件造成严重损害的潜力。\n\n*   漏洞是指计算机、网络以及数字基础设施中的缺陷，这些缺陷使相关人员处于风险之中。\n\
  \n*   网络恐怖主义是利用互联网技术破坏国家关键基础设施的非法暴力活动。\n\n*   关键基础设施包括政府提供给公民的基本服务以及主要的公共部门模块，如能源、交通、教育、医疗、银行、金融和国防。\n\
