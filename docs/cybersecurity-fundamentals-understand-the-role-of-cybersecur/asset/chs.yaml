  \n\n\n\n\n在过去的二十年里，全球网络犯罪的规模、速度和复杂性大幅增加。犯罪分子与计算机专业人士汇合，将组织化的网络犯罪作为业务，以最小的风险获取最大的利润。人们在使用互联网和网络空间时，并不知道其中隐藏的风险，在无意中帮助了犯罪者的成功。并非所有犯罪分子都是计算机专业人士，但他们渴望参与网络犯罪，地下黑市为他们提供了帮助，提供了各种恶意工具、租赁技能和技术。黑市的产品让普通人也能发起犯罪活动并帮助扩大全球网络犯罪的版图。本章将概述网络犯罪的历史发展及其带来的后果，例如增加的财务和法律责任以及恢复成本。此外，还描述了导致世界经济面临风险的各种网络犯罪形式。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 计算机与网络犯罪的历史\n* 网络犯罪——作为一种职业\n* 网络犯罪的成本\n* 网络犯罪的各种形式\n\
  * 网络安全面临的挑战\n* 网络犯罪地下黑市\n\n## 目标\n\n本章的目标是向你介绍互联网发展的各个阶段，并详细说明犯罪分子如何开始利用互联网技术发起他们的恶意活动。阅读本章后，你将理解网络犯罪的成本，并了解用于分析它的框架。你将了解导致网络犯罪无法控制并成为产生非法利润的流行媒介的主要挑战。了解网络犯罪地下黑市将很有趣，因为它展示了其结构，详细说明了参与者，并描述了其热门的产品和服务及其价格范围。\n\
  \n## 2.1 计算机与网络犯罪的历史\n\n网络犯罪是在互联网和电信通道帮助下进行的恶意活动。它与传统犯罪在许多方面不同，例如它很容易远程实施，且对潜在损害所需的资源极少。最重要的是，它可以在全球范围内执行，而无需物理出现在相关的管辖区。计算机、网络、互联网和`World\
  \ Wide Web`(`W3`)的发明是为了便于政府、公司和个人机密信息的创建、存储并快速传输给正确的人。数字时代和电子通信通道的发展为研究人员、科学家、商人、学者和学生提供了一个知识传输和受益的绝佳媒介。遗憾的是，所有设施对犯罪分子同样可用。\n\
  \n1642 年，著名的数学家布莱斯·帕斯卡（Blaise Pascal）制造了第一台非电子机械机器，方便用户进行数字的加法和减法。这台机器也能执行乘法和除法，但只能通过重复的加减操作来实现。1813\
  \ 年，另一位名为查尔斯·巴别奇（Charles Babbage）的英国数学家设计了一种机械计算器，能够执行多达 20 位的计算。1833 年，他勾勒了分析引擎的设计以执行数学计算，但在两个阶段的工作后，它仍然不完整\
  \ [\\[1\\]](#ref1a)。1801 年，法国纺织工兼商人约瑟夫·玛丽·雅卡尔（Joseph-Marie Jacquard）生产了一种机器，使用打孔卡形成无限循环，用于地毯纺织设计中的重复图案。这台机器能够根据所需的次数重复执行织造步骤。这台机器的发明在员工中引起了恐惧，因为他们担心自己的工作安全。此后，这种事件的重复变成了计算机编程的基础。这台机器的发明被认为是历史上首次有案记录的网络犯罪，因为它对公共利益产生了负面影响。19\
  \ 世纪 80 年代中期，赫曼·霍勒礼（Herman Hollerith）在计算机发展中发挥了关键作用，为美国的人口普查引入了机械和电气数据处理系统。1896\
  \ 年左右，他发明了第一种自动进卡机构和键盘打字机。1911 年，赫曼·霍勒礼与其他四人共同建立了计算制表记录公司，后来更名为国际商业机器公司（IBM）。1946\
  \ 年 2 月，在宾夕法尼亚大学的摩尔电子学院，第一台电子数字计算机问世，其中引入了电子计算概念。这台电子机器在计算机史上通俗被称为`Electronic Numerical\
  \ Integrator and Computer`(`ENIAC`），发明这件杰作的人士是 J·普雷斯珀·埃克尔特（J. Presper Eckert）和约翰·W·莫奇利（John\
  \ W. Mauchly） [\\[2\\]](#ref2a)。随后，他们根据美国政府的提案进行工作，开发了一个更改进的版本，广为人所知的`Universal\
  \ Automatic Computer`(`UNIVAC`），并于 1950 年交付给政府。这现在被认为第一台商业营销的计算机，具有以快速经济方式处理多种信息的能力。通用自动计算机适用于高等数学，也适用于日常办公工作。这些计算机能够处理数字和字母信息，并将结果自动存储在内存中。\n\
  \n1960 年，开发了如`Programmed Data Processor`(`PDP-1`）之类的商业计算机。然而，由于体积巨大、价格昂贵且供应短缺，它们的安装非常困难，导致它们是以分时共享的方式使用的，允许授权和未经授权的用户在同一台计算机上工作。因此，授权用户创建的数据和程序非常脆弱，容易受到未经授权用户的干扰。这是一个危险的情况。因此，计算机相关犯罪随之开始。20\
  \ 世纪 70 年代，计算机在全球范围内普及，特别是在通信基础设施中。一组来自`麻省理工学院`(`MIT`）的好奇者希望中断电话线以获取拨免费电话的优势。来自\
  \ MIT 的斯图特·尼尔森（Stewart Nelson）成功通过自己的程序突破了通信通道以拨免费电话，这种在不支付的情况下访问电信系统连接他人的未经授权行为在计算机历史上被称为“电话入侵”（Phreaking）。作为后果，美国政府宣布入侵电信系统为可惩罚的罪行。\n\
  \n\n\n\n\n1957 年，美国总统德怀特·艾森豪威尔（Dwight Eisenhower）有兴趣开发一种利用新技术进行快速交互的通信基础设施，并批准了“高级研究计划局”（`ARPA`）在该方向进行研究。J.C.R\
  \ Licklider 被任命为计算机研究计划的首负责人。他说服了他的继任者 Ivan Sutherland、Bob Taylor 以及麻省理工的研究员 Lawrence\
  \ G. Roberts 关于网络概念[\\[3\\]](#c02.xhtml#ref3a)。1961 年，麻省理工的列纳德·克莱因拉克（Leonard Kleinrock）发表了一篇关于分组交换理论的论文，这成为数据包形式传输的基准。另一个问题仍然存在：如何将一组计算机连接在一起进行通信。1965\
  \ 年，Roberts 解决了这个问题，通过拨号连接将加州的 `TX-2` 计算机与 `Q-32` 计算机连接起来[\\[3\\]](#c02.xhtml#ref3a)。1969\
  \ 年，美国国防部与 `ARPA-Net` 合作并为通信目的安装了两个节点。第一个节点部署在加州大学洛杉矶分校，另一个则安装在斯坦福研究院（隶犹州大学），以便它们相互通信。1969\
  \ 年 10 月 29 日晚上 10:30，部署在加州大学的节点向斯坦福研究院的节点发送了一条条消息[\\[4\\]](#c02.xhtml#ref4a)。1972\
  \ 年 10 月，Robert E. Kahn 在“国际计算机通信会议”（`ICCC`）上成功地代表 `ARPANET` 进行了展示。这是网络技术首次在公共领域进行演示[\\\
  [3\\]](#c02.xhtml#ref3a)。\n\n20 世纪 70 年代，`Altair 8800` 计算机在市场上面世，个人可以以负担负担得起的价格购买。现在，平台已准备好让具备编程技能的人攻入计算机。如果我们观察早期的计算机攻击，会发现这些并不是为了财务利益，而是为了好玩或骚扰某人。独立系统更加安全，因为要获得访问或共享文件，用户必须登录该系统。是网络使得攻击者能够未经许可远程访问他人的计算机。康奈尔大学的学生罗伯特·塔潘·莫里斯（Robert\
  \ Tappan Morris）创建了第一个蠕虫并在互联网上释放[\\[5\\]](#c02.xhtml#ref5a)。该蠕虫在网络中自我复制，阻塞了感染计算机的内存。在这次事件中，存储研究内容的数千台计算机遭受了不利影响，但有趣的是，Morris\
  \ 意识到自己的错误并以极小的努力停止了蠕虫。\n\n## 2.2 网络犯罪 – 一种职业](#toc.xhtml#s48a)\n\n网络犯罪的复杂程度和频率每天都在增加，使数十亿美元的资金、声誉和数据面临风险。人们，尤其是年轻人，正将网络犯罪视为一种职业，因为这现在正被发展为在极短时间内非法获取巨额资金的最简单方式，而且被捕的概率非常小。网络犯罪现在已变成一种巨大的经济，由具有各种技能组合的人共同工作，以获得财务和政治优势。专业人士和许多不同个人携手，运行复杂的业务来入侵他人的计算机并发动攻击。\n\
  \n网络犯罪现在由来自不同地理地区的团伙实施，他们具有相同的目标。组织性最大的犯罪集团通过团队合作的帮助将网络犯罪作为合法业务运营，以实现共同目标。参与的犯罪分子接受适当培训，并获得相关专业人士的指导以提高他们的技能。复杂的网络犯罪集团伪装成合法组织，在全球范围内通过合作伙伴、特许商、销商和关联者的网络运营，以获取最大利润。网络犯罪集团共享工具、软件、技术并协调他们的行动以实现共同利益，如钓鱼攻击、盗取和克隆卡片数据等；网络犯罪组织将其恶意软件、工具和基础设施作为服务租赁或授权给合作伙伴，以夺占黑客市场的大份额。合作伙伴根据良好的条款和条件工作，并将这些恶意服务带到不同的地方以产生最大的利润。\n\
  \n## 2.3 网络犯罪成本](#toc.xhtml#s49a)\n\n网络犯罪是一个风险回报比极佳的领域[\\[21\\]](#c02.xhtml#ref21a)。犯罪分子可以在一分钟内赚取数百万美元，而被捕概率极低。在网络上追踪犯罪分子并让他们对恶意活动负责是一项艰巨的任务。由于对犯罪分子有利，恶意活动在更广泛的范围内增加，导致网络犯罪成本增加。\n\
  \nSteve Morgan [\\[20\\]](#c02.xhtml#ref20a) 对网络犯罪成本的描述如下：\n\n“网络犯罪成本包括数据的损坏和破坏、被盗的资金、生产力损失、知识产权被盗、个人和财务数据被盗、挪用、欺诈、攻击后对正常业务流程的中断、取证调查、被黑数据和系统的恢复与删除，以及声誉损害。”\n\
  \n网络犯罪成本可以分为四个部分：预期成本、后果成本、响应成本和间接成本[\\[22\\]](#c02.xhtml#ref22a)[\\[23\\]](#c02.xhtml#ref23a)：\n\
  \n- **预期成本 (Anticipation cost)**：该成本是指为了防止网络犯罪而采取的防御措施的支出。在反病毒软件上的支出就是预期成本的一个例子。\n\
  - **后果成本 (Consequence cost)**：该成本是指网络犯罪发生后产生的总损害成本。财产损失和资金损失属于此类。\n- **响应成本 (Response\
  \ cost)**：用于在网络犯罪发生后产生适当响应的成本被称为响应成本。在调查机构、警方力量上的支出是响应成本的例子。\n- **间接成本 (Indirect\
  \ cost)**：这种成本包括对组织和公司的声誉损害、个人和企业对在线交易信心的丧、收入减少以及地下市场的增长。\n\n## 2.4 分析成本的框架](#toc.xhtml#s50a)\n\
  \n网络犯罪的总成本定义了网络犯罪的严重性。犯罪成本包括其对组织和国家经济造成的损害。知识产权、财务资产欺诈、敏感业务信息披露以及网络安全的成本需要适当的估算，以便预测为了减少网络犯罪风险需要分配的预算[\\\
  [25\\]](#c02.xhtml#ref25a)。Ross Anderson 等[\\[23\\]](#c02.xhtml#ref23a)[\\[24\\\
  ]](#c02.xhtml#ref24a) 开发了所示的图 2.1 框架，用于估算网络犯罪成本：\n\n![](img/Figure-2.1.jpg)\n\n\
  图 2.1：分析成本的框架\n\n在框架中，成本类别可以总结如下：\n\n- **犯罪收入 (Criminal revenue)**：犯罪收入是指犯罪产生的货币等值总收入。为了准确衡量收入，排除了犯罪分子的*合法*支出[\\\
  [23\\]](#c02.xhtml#ref23a)。\n- **直接损失 (Direct losses)**：这些是指由于网络犯罪造成的损失、破坏和损害的价值。以下是直接损失的一些例子：\n\
  \    - 从受害者账户中非法提取的资金。\n    - 恢复账户详情和凭据所需的时间精力。\n    - 受害者的痛苦。\n    - 二次成本，例如在需要资金时无法获得资金。\n\
  \n\n\n\n\n- **间接损失**：指由于恶意活动给社会造成的损失价值和机会成本。间接成本并非由个人受害者承担，而是由群体或组织受到影响并承担成本。假设一家银行因恶意攻击导致网上银行声誉受损，该银行可能会面临在线交易收入减少，并需承担管理人力资源和促进票据结算的间接成本。需要更多资金将损坏的数字基础设施和设备更换为新的\
  \ [23 [24]。\n\n- **防御成本**：防御成本是指预防措施的货币等值费用。它包括直接防御成本，如预防措施的创建、部署和维护成本。间接防御成本包括由于安全措施而产生的不便和机会成本\
  \ [23 [24]。\n\n防御成本包含以下内容：\n\n- 用于安全产品的支出，如垃圾邮件过滤器、防病毒软件和防火墙\n- 用于安全服务的支出，如针对个人和员工的培训和意识计划\n\
  - 犯罪检测、追踪和溯源成本\n- 执法部门的货币等值费用\n\n- **社会成本**：直接损失、间接损失和防御成本的总和被称为社会成本。\n\n## 2.5\
  \ 各种形式的网络犯罪\n\n网络犯罪是指犯罪活动，包括互联网、计算机或其他任何互联的设施。该术语还涵盖了网络钓鱼、信用卡欺诈、非法下载、工业间谍、儿童色情、诈骗、网络恐怖主义、病毒创建和/或分发、垃圾邮件等。\n\
  \n## 2.5.1 网络跟踪扰\n\n网络跟踪扰基本上是一种技术辅助跟踪，攻击者利用电子邮件、社交媒体账户、即时消息、聊天室等网络技术骚扰他人。这是一种威胁他人以导致其产生痛苦、焦虑和恐惧的行为\
  \ [7]。这是犯罪分子的一种重复性行为，他在互联网上公开对某人发表辱性评论，使某人感到害怕和不安。网络跟踪扰者入侵受害者的私人生活并进行心理骚扰，因此也被称为`心理强奸`或`心理恐怖主义`\
  \ [7]。犯罪分子在互联网上追踪受害者，并通过传播虚假指控、谣言和色情内容发起针对他的诋毁活动。\n\n网络跟踪扰涵盖：\n\n- 发送不想要的、令人恐惧或淫秽邮件、消息或视频\n\
  - 在社交媒体上用辱性词汇骚扰或威胁某人\n- 在互联网上跟踪追踪某人的活动\n- 通过 GPS 技术跟踪位置\n- 在社交网络和约友网站上使用他照片、身份和地址创建假账号，并代表受害者建立联系\n\
  \n网络跟踪扰者通常遭受焦虑、抑郁、压力或其他成瘾，最常见的是与社会隔离并在朋友中感到不适。由于缺乏社交支持和伴侣的忽视，他们大部分时间都花在网上，并通过日常在线活动窥视他人的生活。他们经常使用\
  \ `Facebook`、`Twitter` 甚至 `Instagram` 等社交媒体平台实施行为，并上传受害者或亲人的虚假或真实的冒犯图像。有趣的是，网络跟踪扰者通常不是受害者的陌生人，而是熟人，如性伴、朋友、同学、同事和亲属\
  \ [26]。研究表明，女性经常成为受害者，网络跟踪扰占了约 80.5% 的案例，而男性则是犯罪行为的主体 [7, 19]。\n\nGisela Wurm [30]\
  \ 将跟踪者的不同类别描述如下：\n\n- **被拒绝型跟踪者**：在亲密关系破后开始跟踪的人被称为`被拒绝型跟踪者`。这些跟踪者渴望与伴侣和解报复。\n- **寻求亲密型跟踪者**：由于生活孤独而渴望关系的跟踪者被称为`寻求亲密型跟踪者`。这些跟踪者对陌生人的单方面爱和情感产生回应。这种跟踪的单一目标是与某建立建立联系\
  \ [31]。\n- **无能追求者**：这一类别的跟踪者渴望非情感关系，无论是为了约会还是为了满足性需求。\n- **怨恨型跟踪者**：这些人是受过对待的人，也是不公和侮辱的受害者。这种跟踪行为源于对他们认为是罪犯的人产生的报复欲望。\n\
  - **捕食型跟踪者**：捕食型跟踪者通常是男性跟踪者在互联网上追求女性以获得性满足。\n\n### 2.5.2 知识产权盗窃\n\n知识产权指的是独特的人类创作，如创新、文学、艺术、模型、符号、科学公式、标志和具有商业价值的图像。知识产权的保护要求归其真正的创造者所有，法律上允许所有者使用它们来盈利。通过知识产权，个人对其在创新和独特创作上投入的时间精力获得回报。这些权利防止了潜在竞争对手对独特创作的复制和盗窃。\n\
  \n这里描述了各种类型的知识产权盗窃：\n\n- **版权盗**：为了激励创作者和创新者，版权保护非常重要，因为它确保了创意作品的版税支付。版权法保护创意工作者的权利，帮助创作者获得丰厚报酬。基本上，这是授予创作者的法律保护，防止他人抄袭。版权法保护书籍、软件、文学、音乐、绘画、电子游戏、电影等：\n\
  \n  版权法允许创作者：\n\n- 产生所需数量的作品副本\n- 允许对其原始作品进行修改和扩展\n- 允许版权所有者进行销售、租赁、租借或所有权转让\n-\
  \ 允许公开展示版权作品\n\n- **商标盗**：商标是指属于公司或其产品的独特符号、标志、单词和引言。如果注册商标被既不是注册所有者也没有相关产品销售许可的人使用，则被称为商标盗窃。商标和公司名称经常被用作同义词，消除了在市场上多种可识别产品中选择原始产品时的困惑。公司一旦注册了商标，就拥有了法律权利，防止他人尝试使用足以误导客户的行为。\n\
  \n- **商业秘密盗**：商业秘密是一个广术，涵盖了不仅制造、工业和商业秘密。它还包括销售流程、配送流程、广告以及供应商、合作伙伴和客户的名单。如果其他人未经所有者同意使用此类信息，将被视为不公平行为并违反了贸易政策。\n\
  \n### 2.5.3 萨拉米攻击\n\n\n\n\n计算有时会进行四舍五入以获得整数，这就是“萨腊肠肉攻击”之所以成功的因素。犯罪分子从数百万账户中偷取微不足道的金额，并将这些微小金额累加，转化成巨大的抢劫。银行账户持有者成为了这种攻击的受害者，但令人惊讶的是，他们既没有察觉这些扣款，也没有向银行报告。假设一个犯罪分子创建一个软件，从每个账户中扣除\
  \ `Rs. 0.01` 并将其转移到犯罪分子的银行账户，客户并没有注意到这些微不足道的扣款，并集体向犯罪分子转移了巨额资金。\n\n### 2.5.4 邮件炸弹\
  \ (e-Mailbomb)\n\n这指的是向目标账户发送大量未经请求的邮件，旨在填满接收者邮件服务器上的收件箱。无法控制的邮件洪流呈现出大流行式的局面，导致人员无法在其账户中找到相关的邮件。邮件炸弹通常通过\
  \ `zombie` 或或 `bot` 计算机实施，会导致资源消耗、网络带宽丢失和系统崩溃 [8][9]。邮件炸弹也称为邮件泛洪（e-mail flooding），其目标是运行商业网站和处理企业业务邮件账户的主机。\n\
  \n### 2.5.5 钓鱼攻击 (Phishing)\n\n网络犯罪分子总是寻找具有经济价值的信息，而 `Phishing` 是实施者获取个人和财务信息不可或缺的恶意活动。钓鱼是指通过电子邮件通过欺诈手段窃取敏感数据和有用信息，例如银行详情、登录凭据、财务数据和公司信息。这些攻击始于一封看似来自可靠来源的邮件，诱导受害者立即采取行动，如点击包含的恶意链接、打开附件、回复消息和下载文件。遭受钓鱼攻击的组织往往会面临严重的财务损失、市场份额下降和客户信任丧失。\n\
  \n### 2.5.6 身份盗窃 (Identity theft)\n\n这是最常见的犯罪类型，身份盗窃的受害者在收到通知或被机构告知之前对针对自己的犯罪一无所知。身份盗窃发生在犯罪分子非法使用他人的身份并以其名义犯罪时\
  \ [10]。个人身份包括姓名、地址、社会安全号码、出生证明、死亡证明、借记卡和信用卡、银行账户号码、驾驶执照号码和护照 [11]。犯罪分子使用这些被盗的身份进行欺诈，如开设新账户、租公寓、申请贷款、拥有护照，以及政府随时向其公民提供的其他福利。\n\
  \n### 2.5.7 欺骗 (Spoofing)\n\n欺骗是指一种技术，犯罪分子获取带有 IP 地址的联网计算机，并通过用自己的服务和通信替换其原始服务来伪冒该计算机。犯罪分子伪装成真实人物与他人通信以获取秘密、访问其他系统、窃取数据等。通过欺骗，犯罪分子欺骗了系统、个人和组织，并伪装成合法用户参与通信。David\
  \ A. Wheeler 等人 [8] 详细介绍了一些犯罪分子利用这些方法，在互联的数字环境中占据他人的位置，并作为合法方实施网络犯罪。\n\n普通互联网用户并不关心信息的来源。无论他们如何获取信息或获取服务，他们想要获得的信息才是首要考虑的。网络犯罪分子经常更改发送者身份或伪造发送者身份，并以真实来源或服务提供者的身份与用户通信，这被称为\
  \ `Spoofing` [5][6][8]。换句话说，欺骗是一种欺诈和恶意的做法，其中一个方一方被掩盖，其响应和确认等活动由网络犯罪分子执行，以向另一方显示正在与已知且信任的源进行通信。\n\
  \n### 2.5.8 蠕虫、木马、病毒\n\n病毒的创建目的是为了创建和利用计算机中的漏洞，以便进行远程未经授权的控制和非法访问。这些是跨越计算机和网络传播的恶意程序，会导致从损坏软件到破坏存储数据等潜在损害。计算机病毒通过可移动介质、下载内容和邮件附件自我传播，并在用户不知情的情况下在目标系统中创建自己的多个副本。病毒需要至少执行一次才能创建其多个副本，并附在系统文件上以启动复制过程。蠕虫能够自我复制，不需要人类努力即可造成损害。它发送多个从计算机到计算机的副本，且不附在系统文件上。木马是恶意代码，但看起来是合法的\
  \ [12]。它不会自我复制，而是通过打开邮件、下载文件和安装软件等人类努力在网络中传播。事实上，病毒、蠕虫和木马在复制方式上遵循不同的方法，但为了共同的目标工作。这些共同目标如下：\n\
  \n*   生成烦人的信息并弹出窗口\n*   删除、修改、重命名、隐藏和替换存储的文件\n*   耗尽附属资源，如驱动器存储和网络带宽\n*   使整个网络过载\n\
  *   漏洞的创建和利用\n*   将控制权转移给远程计算机和犯罪分子\n*   破坏控制和安全设置\n*   损坏计算机附属资源\n*   损坏网络资源\n\n\
  ### 2.5.9 DoS 和 DDoS\n\n在线购物、电子商务和社交媒体网站处理海量流量，人们在社交媒体上分享情感、活动，并在电子商务中进行业务和财务交易。这些网站的故障会给其用户带来麻烦，并破坏其所有者的信誉和信任。`拒绝服务`\
  \ (`DoS`) 攻击是指一种通过使用临时中断或暂停服务，使其授权用户无法使用计算机、服务器或网络资源的尝试。如果某个特定网站现在运行变慢，那么可能存在 DoS\
  \ 攻击的。DoS 攻击通过向目标 URL 发送超过服务器能够处理的请求量来阻止用户利用网络资源。DoS 攻击通过泛洪攻击实现。\n\n流行的泛洪攻击如下：\n\
  \n*   **缓冲区溢出攻击 (Buffer overflow attacks)**：指的是最常见的 DoS 攻击，重定向到网络地址的流量超过了处理能力。缓冲区是分配的连续内存块，用于包含从数值值到整数数组的数据。缓冲区溢出（或缓冲区越界）发生在大量数据被放入固定大小的缓冲区且超过了缓冲区能处理范围时。这些额外数据必须在某处调整，可能会获取相邻的内存块，导致损坏或覆盖该空间中已存在的数据。这种溢出会导致系统崩溃，并为攻击者运行恶意代码以入侵系统创造机会。\n\
  \n\n\n\n\n- **ICMP flood 攻击**：`Internet Control Message Protocol`（`ICMP`）是一种用于 IP\
  \ 操作、错误诊断和故障检测的无连接协议。ICMP 洪泛攻击也称为 ping 攻击，其通过大量 `ICMP` 数据包同时向服务器反复发送请求，以阻碍其处理请求的能力。\n\
  \n- **SYN flood 攻击**：`SYN` 术语指的是客户端与服务器之间建立连接时的同步。这是另一种类型的 DoS 攻击，服务器被用于与多个非真实客户端建立连接。如果服务器接收到客户端的\
  \ `SYN` 请求，它将处理该请求并通过向客户端发送确认信号“SYN-ACK”来完成连接。在 SYN 洪泛攻击中，客户端的单个 `SYN` 请求被转换为多个\
  \ `SYN` 请求，这些请求看起来像是来自多个不同的源并指向单个服务器，使服务器忙于识别真实源及其身份真实性，从而延迟了连接的建立过程。在大多数情况下，服务器无法向合法客户端回传“SYN-ACK”，导致无法处理请求。\n\
  \nDoS 攻击是指试图通过临时中断或暂停服务，使计算机、服务器或网络资源对授权用户不可用的尝试。在图 2.2 中，犯罪分子使用激活时间极短的伪 ID 与服务器通信。发送请求后，这些\
  \ ID 会被移除，服务器会搜索这些 ID 的响应并浪费时间，导致无法处理合法请求：\n\n![](img/Figure-2.2.jpg)\n\n**图 2.2：**\
  \ 拒绝服务攻击\n\n- **分布式拒绝服务**（`DDoS`）攻击是指大量受恶意影响的计算机针对单个系统，阻止合法用户访问目标系统。海量涌入的请求和消息迫使目标系统关闭，导致真实用户无法获得服务。最初，攻击者利用网络中系统的漏洞，并将该系统制备为僵尸主机（botmaster）以发动攻击。僵尸主进一步识别出许多可以远程控制的漏洞系统，并作为目标系统与僵尸主之间的中间系统。这些远程控制的中间系统俗被称为“从代理”或“僵尸”（Zombies），它们听从僵尸主的指令并直接与受害者通信。通常，网站是拒绝服务的首选目标，因为客户、合作伙伴和粉丝通过网站与组织进行互动。\n\
  \nDDoS 不关注黑客攻击或数据窃取，而是一种让服务器一直忙碌的过程，使其无法进一步服务客户。网络犯罪分子发动 DDoS 攻击以使特定组织的网站和在线服务崩溃，损害其在客户中的声誉。在线服务的暂停也会对搜索引擎排名产生负面影响，减少流向其的流量。业务中的潜在竞争对手利用\
  \ DDoS 作为工具在激烈的竞争中胜出。攻击者通过 DDoS 让网站消失并索要赎金以恢复在线服务。下图图 2.3 了发动 DDoS 攻击的流程：\n\n![](img/Figure-2.3.jpg)\n\
  \n**图 2.3：** 分布式拒绝服务\n\n### 2.5.10 色情\n\n色情是以文本、视觉和视听形式存在的显性性材料，用于引起观众兴奋并提供性满足。色情材料包括电子形式的书籍、杂志、照片和视频片段，其中包含裸体男性、女性甚至儿童暴露性器官并进行性行为。色情产业对犯罪分子来说是最暴利的，并在互联网的帮助下进行着数十亿的业务。网络犯罪分子以所需的格式向观众提供色情材料并收取高额费用。\n\
  \n### 2.5.11 网页篡改攻击\n\n网页篡改攻击是通过未经所有者同意，将特定网站的原始网页替换为相似但具有某些隐藏更改的网页来实现的。篡改发生在流行且受信任的网站上，因为用户不会犹豫在这些网站上提交自己的数据。在这样的攻击中，网络犯罪的意图是收集用户的个人信息，如信用卡号、手机号、密码等。\n\
  \n### 2.5.12 勒索软件\n\n勒索软件是一种加密文件和文档并将计算机/数据劫质的威胁，直到支付赎金作为费用。勒索软件不仅加密单台计算机上的文件和文件夹，还有能力感染整个网络，包括服务器。第一例勒索软件于\
  \ 2005 年至 2006 年间在俄罗斯发现，它能够对文件进行压缩并进行密码保护 19。最初，这种勒索软件感染 `.DOC`、`.XLS`、`.JPG`、`.ZIP`、`.PDF`\
  \ 等普通文件并将其扣留。后来，它捕获了主引导记录（`MBR`）并阻止操作系统的加载。勒索软件涉及资金，目标是企业而非个人。除了感染计算机和移动设备外，它还会感染共享的可移动驱动器和服务器\
  \ 19。某些勒索软件家族针对税务相关文件和数据库文件以确保更大的利润。\n\n## 2.6 网络安全面临的挑战\n\n随着信息技术在全球范围内快速增长，数字活动的显著增加和互联网的大量利用导致网络犯罪的机会增加。缺乏足够的系统保护知识以及匿名性的可能性导致了社会网络犯罪。若干国家目睹了垃圾邮件、病毒感染和蠕虫感染的显著增加。印度也面临着具有各种挑战的网络安全问题\
  \ 17。这些挑战如下：\n\n### 2.6.1 网络安全无国界\n\n对于我们大多数人来说，互联网是日常生活中不可或缺的一部分，用于社交媒体、学术交流、在线购物和支付账单。在我们的专业领域，我们也利用互联网和其他信息技术提高效率、服务质量并访问全球新市场。由于互联网提供了许多益处，但也存在与其相关的安全挑战。互联网的快速普及为犯罪分子和恐怖分子获取我们的个人和公司信息提供了新机会。网络安全的主要问题是其无国界性\
  \ 13。由于网络空间连接了全球系统，因此定位攻击源往往变得困难。\n\n### 2.6.2 攻击者的匿名性\n\n尽管我们正在积极打击并防止网络犯罪活动破坏硬件和基础设施，但很难定位攻击源。在虚拟网络空间中，定位政治边界和罪祸首也变得困难\
  \ 13。网络安全的主要问题是在虚拟空间中识别攻击者，在那里获取匿名性很容易，且入侵者的行为与其影响之间存在时间差 18。此外，技能人口中复杂计算机技术的持续快速增长也使得攻击者的识别变得极其困难。\n\
  \n### 2.6.3 术语的模糊性\n\n\n\n\n\n术语的模糊性也是制定全球网络安全规则时面临的一个主要问题，这削弱了决策者为全球人口制定规则的能力 14。此外，网络安全有多种不同的定义方式，且几个不同的网络术语被用于相同的意图。目前还没有全球认可的网络安全和网络犯罪定义，多种具有相关含义的术语在使用。\n\
  \n### 2.6.4 巨大且无形态\n\n网络空间本质上是巨大、无形态且持续增长的。它是虚拟的，在全球范围内互联。它不涵盖任何物理或地理区域。由于计算机、手机、平板电脑、服务器、路由器和其他互联网基础设施组件之间的，网络空间的复杂性日益增加。网络空间包含了复杂的技术，这些技术的扩张、建设和存在仅在维护过程中才能被想象。很难对网络空间进行绘图或映射。\n\
  \n### 2.6.5 技术发展速度\n\nIT 仍认为是一个创新且动态的领域，不断快速产生新技术。新漏洞出现到能够防御网络攻击的复杂工具或技术开发之间的时间间隔正在缩短。换句话说，我们开发的技术在长期来看并不高效。我们仍然无法开发出能够永久防止网络攻击的技术。我们需要持续努力来解决这一问题。由于证实世界在创建强大的网络军队方面面临着问题，极少数专家能够对复杂的网络攻击提供解决方案。另一方面，网络攻击者、犯罪分子、黑客和网络恐怖分子正以更有组织的方式执行他们的计划。对我们来说，建立一支保护我们免受金融诈骗和信息损失的强大网络军队至关重要。\n\
  \n### 2.6.6 追踪犯罪起源\n\n跨互联网用户行为的跟踪和追踪仍然是一个大问题，需要永久性的解决方案将用户与其活动和时间范围联系起来 8。互联网构建背后的基本思想是为科学家和研究人员提供一个共享知识的共同平台，而不是像现在这样将每个人连接起来\
  \ 16。它的构建是为了扩展网络的不同可能用途。对于一个国家来说，跟踪和追踪任何网络攻击和基础设施的起源非常重要，以阻止此类攻击，确保国家的长期生存和繁荣。更好的网络安全跟踪和追踪基础设施可以限制未来的网络攻击。跟踪和追踪网络攻击的过程通常会产生关于攻击中使用的技术以及关于犯罪分子的足够细节。时间在识别和追踪网络威胁期间也是一个重要因素。你识别网络攻击并提供中断攻击进展的解决方案有多快同样重要。\n\
  \n### 2.6.7 网络专家短缺\n\n今天，世界面临政府部门、私人组织和公司网络攻击数量快速增加。全球范围内对能够保护组织免受网络犯罪的熟练网络安全专家的需求很高，但在政府机构短缺尤为严重，这些机构通常无法提供与私营部门一样的高薪。填补供需差距迫迫切。Martin\
  \ C Libickiet 等人 15 对五个美国政府机构、五所教育机构、两家安全公司、一个国防组织和一名外部专家代表进行了半结构化研究。作者得出了以下结论：\n\
  \n* 能够足够检测高级威胁存在的网络专家通常要求的年薪超过 200,000 至 250,000 美元 16。\n* 正常情况下，组织避免为员工提供昂贵的网络培训，因为担心员工会将技能带到其他雇主那里\
  \ 16。\n* 现在，组织不再等待个人获得专业学位毕业。他们现在更关注那些与网络安全需求关联度最好的性格特征。\n\n基于这三点，我们可以说，由于昂贵且先进的培训，国家往往无法形成强大的网络军队。\n\
  \n### 2.6.8 缺乏国际合作\n\n互联网是一个巨大的网络，由散布在世界的数百万台计算机组成，为网络犯罪分子快速获取和交换信息提供了机会。电子货币、在线银行、电子金融交易和电子商务的发明成为新网络犯罪出现的关键因素。今天，执法机构在调查和打击网络犯罪分子方面面临着跨国挑战。在这种情况下，犯罪现场和罪疑犯可能属于不同的领土，因此领土之间的合作对于网络犯罪的调查和处罚至关重要。遗憾的是，大多数国家在调查中互不合作，反而可能利用网络犯罪分子的技术对敌国。执法机构在调查期间经常遇到引渡问题等障碍。\n\
  \n网络犯罪分子使用复杂的工具和计划周密的策略实施犯罪，这使得他们很难被追踪。犯罪被碎片化并通过跨国路线触发，使得调查犯罪现场变得困难，并且需要获得相关政府和行政部门的许可才能接触到罪犯。各国之间迫切需要合作以减少网络犯罪，保护关键基础设施并防止电子间谍活动、大数据拦截以及导致巨大经济和社会损害的攻击行动。\n\
  \n### 2.6.9 缺乏国际立法\n\n网络犯罪正呈指数级增长，给全球每个国家带来了每天的经济和社会挑战。商业组织、政府机构和金融机构等正被黑客攻击，以获取政治和财务优势。最重要的是，网络犯罪的发生频率极快，每次都使用独特且复杂的技术，具有瘫痪经济和损害国家关键基础设施的能力。从其全球规模和世界性的负面影响来看，制定国际立法来打击网络犯罪至关重要。\n\
  \n遗憾的是，我们仍然缺乏全球认可的网络犯罪定义，以及在调查和起诉网络犯罪方面建立障碍的有效立法。匿名性和边界缺失使互联网变成网络犯罪分子易于获取、高效且危险的武器。由于其无形态和无国界的性质，没有任何国家可以独立应对网络犯罪。有效打击网络犯罪需要完善国际立法以及针对犯罪活动的合作。尽管一些主权国家正在采取积极行动并在调查和起诉中进行合作，但其他国家对其边界之外的网络犯罪仍然采取松散态度。\n\
  \n## 2.7 网络犯罪 – 服务即服务\n\n\n\n\n\n犯罪在网上发生已不再是秘密。网络犯罪现在是关注的焦点，并被确定为社会和全球经济最大的风险。网络犯罪激增的主要原因在于低成本黑客工具的易于获取以及“网络犯罪即服务”（CaaS）行业的发展。我们普遍认为，发起网络攻击应该在技术上过硬过关，并具备编程和网络技能，但事实并非如此。图\
  \ 2.4 显示了员工的层级及其技能水平。\n\n网络犯罪不仅被视为一种恶意的爱好，更是网络犯罪分子维持生活的手段。它已演变成一种业务，熟练的攻击者相互合作、共同工作，使利润最大化并降低被捕的风险。从职业角度来看，网络犯罪具有吸引青少年并让他们参与恶意活动的能力。在过去的二十年里，网络犯罪已成为一个成熟的行业，估计其每年产生约\
  \ 1 万亿美元的收入 [[27]](#c02.xhtml#ref27a)。网络犯罪分子现在正通过攻击代码和服务为缺乏技术智能的新手犯罪分子赋能。他们向新手收取巨额资金，以完成他们的恶意任务：\n\
  \n![](img/Figure-2.4.jpg)\n\n**图 2.4：** 员工层级\n\n以下 表 2.1 显示了向新手提供的常用工具和服务类别，以鼓励他们实施网络犯罪：\n\
