  \ “利用路由器接口的单包 ICMP 回溯技术”,信息科学与工程杂志, 第 31 卷, 第 5 期, 2015。\n\n[\\[22\\]](#c04.xhtml#ref22)\
  \ 东东, Nirwan Ansari, “实现 IP 回溯：视角”,信息保证讨会, 美国, 2002 年。\n\n## 5. 问责制\n\n用户与计算机之间的跟踪通过网络连接实现。网络连接是网络上的共享资源，有助于将会话活动绑定到相关用户并进一步连接到网络标识符（NID）。例如，如果位于**COM1**上的用户**A**在**COM2**上创建一个远程登录会话（称为会话\
  \ 2），如图图 5.1 所示，IDS 最初确定的是计算机到计算机的连接（net-rsrc）。在我们的情况下，它是 COM1 到 COM2 的连接。\n\n###\
  \ 5.1 网络标识符\n\n**入侵检测系统**（IDS）是为了网络上的问责而设计的。为了实现问责，当用户登录时会分配一个**网络标识符**（NID）。在网络上执行的所有活动都被映射，以了解做了什么。例如，如果用户\
  \ A 通过远程登录以 B 的身份从计算机(*COM1*)访问另一台计算机(*COM2*)，那么 IDS 跟踪 *A@COM1* 到 *B@COM2*。同样，如果该用户以\
  \ C 的身份从计算机(*COM2*)再次远程登录到计算机(*COM3*)，C. L. Heber 等人 5 对这些操作总结如下：\n\n```\nNID(C@COM3)\
  \ = NID(B@COM2)\nNID(B@COM2) = NID(A@COM1)\n```\n\n公式(1)和公式(2)得出 C@COM3 的 NID 与\
  \ A@COM1 相同。\n\n## 5.2 目标\n\n在本章中，我们将涵盖以下内容：\n\n*   问责问题\n*   跳板\n*   基于网络的算法\n\n\
  ### 5.3 问责问题\n\n用户与计算机之间的跟踪通过网络连接实现。网络连接是网络上的共享资源，有助于将会话活动绑定到相关用户并进一步连接到 NID。例如，如果位于**COM1**上的用户**A**在**COM2**上创建一个远程登录会话（称为会话\
  \ 2），如图图 5.1 所示，IDS 最初确定的是计算机到计算机的连接（net-rsrc）。在我们的情况下，它是 COM1 到 COM2 的连接。\n\n\n\
  \n\n入侵检测系统会定位特定的会话并确定该会话所属的 NID（网络标识符）；随后，会对该 NID 进行调查，以确定生成该标识的原始系统和用户。\n\n众所周知，互联网是一个包含大量小型网络的巨型网络。遗憾的是，存在于不同网络上的计算机不支持主机监控（host\
  \ monitors），这使得跨互联网的问责溯源变得更加困难。主机监控承载了用户在特定会话以及网络中不同计算机上的活动信息，这有助于安全管理员追踪用户。\n\n\
  遗憾的是，在许多环境中，网络上的并非所有计算机都支持主机监控，而主机监控提供了该特定主机的问责性，或跨网络追踪用户所需的信息。在这样的环境下，可以使用网络监控器（如\
  \ `Network Security Monitor` (`NSM`））来提高安全性和问责性。\n\n## 5.1.2 时间指纹\n\n假设在特定的会话中，客户端（主机\
  \ 1）与服务器（主机 2）进行通信。观察到客户端发送的请求以及从服务器接收的确认包连同“回显”（Echo）数据包。杨建华等人 [16] 详细阐述了时间指纹，其是由从主机\
  \ 1 发送到主机 2 的系列数据包 `<p[1], p[2], …, p[n+1]>` 以及相应的时间戳 `<t[1], t[2], …, t[n+1]>`。时间指纹是指序列`<t[2]-t[1],\
  \ t[3]-t[2], t[4]-t[3], …, t[n+1]-t[n]]`，其中每个元素代表连续传输的数据包之间的时间间隔 [16]。时间指纹的长度取决于数据包从客户端传输时在服务器端收到的数据包数量\
  \ [16]。借助 1 分钟、2 分钟或 3 分钟间隔等时间单位，可以将时间指纹划分为子序列。时间指纹可以针对入站连接和出站连接定义，通常分别表示为 `iT-thumbprint`\
  \ 和 `oT-thumbprint`。`iT-thumbprint` 和 `oT-thumbprint` 的计算对于跨连接追踪犯罪分子至关重要。我们通过计算\
  \ `iT-thumbprint` 和 `oT-thumbprint` 之间的相关性，来确定抖动（jitter）和干扰流量（chaff）在网络攻击中的参与程度\
  \ [16]。\n\n## 5.2 跳板\n\n互联网的匿名性使得网络犯罪分子能够隐藏身份并冒用他人的身份实施犯罪。结果是他们被发现和逮捕的概率几乎微乎其微。网络犯罪分子不断努力获取匿名并操纵攻击路径以规避检测。获取匿名的一种广泛使用的方法是利用跳板（stepping\
  \ stones），跳板是已经被攻破的中间计算机，攻击者通过这些计算机向最终目标发起攻击。David A. Wheeler 等 [19] 将跳板定义为洗钱主机，它们允许数据在不经过检查和处理的情况下直接通过。最初，入侵者识别网络中的被攻破计算机，并准备这些计算机的链，以便从上一个系统控制当前系统。计算机通过登录其上一个系统被控制，并通过访问它来释放资源并获得对下一个系统的控制权。由于跳板是异构的、全球分布的且管理各样的计算机，追溯犯罪的真实起源非常困难且不切。跳板检测具有以下优势：\n\
  \n1. 标记可疑活动\n2. 确定网络犯罪背后的罪魁，无论其是属于自身组织还是外部\n3. 识别你互联数字基础设施的易受区域\n4. 确保网络中的特定系统没有参与网络犯罪\n\
  5. 切断可疑的连接链\n\n在入侵检测、防御和容忍中存在一个主要问题。如果检测到入侵，发起攻击的最后一个系统将对恶意活动负责，而实际的罪犯分子甚至可能仍未被识别。Staniford-Chen\
  \ 和 Heberlein [3] 最初处理了跳板问题，并解释了它们的存在如何使网络变得脆弱。\n\n当一个人登录到一台计算机并控制另一台计算机，而通过登录这第二台计算机来操作第三台计算机，其余计算机以相同的方式被控制时，就形成了一系列登录操作，这一系列登录被称为\
  \ `connection chain`（连接链）[4]。跳板检测过程的复杂性取决于连接链的长度。包含数千台计算机、分散在不同国家并受不同法律管辖的连接链，使得溯源过程变得困难且不切实际。属于连接链的中间主机被称为\
  \ `Stepping Stone`（跳板）。如果两个网络连接都属于同一个连接链，则这对网络连接被称为 `Stepping Stone Connection Pair`（跳板连接对）[4]。连接链上的数据流可以是单向的或双向的。双向连接链由两个单向流组成，它们方向相反\
  \ [4]。为了理解跳板和连接链的概念，我们需要了解以下符号：\n\n* `h[1]↔h[2]`：表示主机 `h[1]` 和 `h[2]` 之间的双向网络连接。\n\
  * `h[1]→h[2]`：表示从主机 `h[1]` 到 `h[2]` 的单向数据流。\n* `C[1], C[2],.....,C[n]`：表示网络连接。\n\
  * `C[1]≡steppingC[2]`：表示 `C[1]` 和 `C[2]` 之间的跳板连接对。\n\n通常用于检测跳板的通用方法是网络流量特征，这些特征在跳板连接对之间保持不变或高度相关\
  \ [4]。用于比较两个连接对之间网络流量的参数包括连接内容、包间隔间隔、流量流的开启/关闭模式、流量容量或速率，或这些因素的组合。\n\n### 5.2.1\
  \ 直接跳板与间接跳板\n\n假设 `h[1]``,`h[2]``,`h[3]``,`h[4]` 是一个连续的连接链。如果我们观察 `h1↔h2` 和 `h2↔h3`\
  \ 的网络流量，会在两个连接对中发现几乎相同的数据包。如图 5.2 所示，排除攻击者和目标的所有中间主机（`h[2]`、`h[3]`）被称为 `直接跳板`：\n\
  \n```\nimages/Figure-5.2.jpg\n```\n图 5.2：直接跳板\n\n两个连接对 `h[1]↔h2` 和 `h2↔h3` 是不相交的，无法通过比较来检查连接内容、包间隔和开启/关闭模式的相似性：\n\
  \n```\nimages/Figure-5.3.jpg\n```\n图 5.3：间接跳板\n\n为了处理这种情况，两个连接对通过一个临时主机 `hr` 连接起来（如图\
  \ 5.3 所示），并进行比较以了解网络流量特征的变化。这个临时主机被称为 `间接跳板`。\n\n### 5.2.2 跳板检测算法考虑量\n\n\n\n`Intrusion\
  \ detection system` (`IDS`) 通常在攻击发生很久后才识别出攻击，这导致了基础设施损坏、数据窃取、财务损失和隐私泄露。此类频繁攻击的发生以及起诉的延迟不仅破坏了受害者的士气和信心，还为犯罪分子逃逸提供了充足的机会。在所有可能的损害发生后才识别攻击几乎毫无意义。`IDS`\
  \ 必须能够在威胁激活之前检测到它们，以避免可能的损害。在这种情况下，实时威胁检测变得至关重要。这意味着在威胁于网络环境中启动时立即识别它们。实时威胁检测不需要存储整个网络流量的数据，因为其量非常巨大。\n\
  \n在本节中，我们将详细介绍设计跳板石检测算法所需的几个基本假设。跳板石连接对（stepping stone connection pair）根据某些关联的网络流量特征与随机选取的连接对区分开来。跳板石连接意味着连接链中的一部分，其中在连续位置上至少存在两个跳板计算机，而在随机选取的连接对中，关于连接链上是否存在连续跳板石的先验或观点是不确定的。检测跳板石的方法利用了在两个或多个连续跳板计算机之间保持不变或至少高度相关的网络流量特征。对于任意连接对，这些网络流量特征可能会变化。用于比较连接对之间网络流量的主要网络流量特征包括连接内容、数据包间隔、开启/关闭的活动模式、流量体积和流量速率。\n\
  \n### 5.2.3 主动与被动监控\n\n有两种方法名为主动网络监控和被动网络监控，用于实时检查网络流量中的威胁并衡量网络性能。主动监控评估用户在网络上的行为，并检测作为跳板石的主机。在连接对之间注入测试数据集，以根据`第\
  \ 4 章` `网络犯罪溯源识别技术` 中讨论的，评估在不同评估参数下的网络性能。如果在网络连接之间检查到显著变化，则连接对中存在跳板石的可能性就会增加。主动监控的主要优点是能够快速检测威胁，并维护整个网络的完整可见性。主动监控的阴暗方面包括产生额外的网络流量，且测试数据集包可能会干扰网络的正常运行。被动监控收集现场数据（实时）并按定期间隔进行分析，以识别入侵者在网络上相对于正常用户的行为变化。被动监控依靠统计学来识别网络流中的异常情况，并且不注入测试数据来预测跨越网络的漏洞。它测量进出网络中特定设备的流量，并对其进行比较以发现差异。希望差异越小，以避免入侵者的存在。\n\
  \n### 5.2.4 单点与多点测量\n\n检测入侵并对针对系统和底层硬件的恶意尝试提供保护的能力，取决于从底层软件和网络设备收集的信息。为了开发防御入侵的稳健安全机制，从各种网络设备和软件（如操作系统和协议接口）收集实时且准确的数据至关重要，如果网络设备保留关于其利用情况以及通过它们的网络流量的详细且未经修改的信息，这是可能的。为了诊断恶意尝试和漏洞，安全管理员需要对通过每个底层网络设备、计算机和服务器的数据流量进行持续监控和及时检查，并且必须意识到导致网络流量偏离和分布的配置更改。\n\
  \n网络流量测量是指对正在进行的数据传输进行严密检查，提供有关丢失和损坏的数据包、数据包交付、到达延迟和排序的详细信息。执行网络流量测量是为了确定网络中产生数据包交付扰动的位置，同时对正常流量流进行波动和拦截，以实施恶意活动。流量测量对于准备网络的详细视图起着至关作用，并有助于安全管理员根据每个测量点流量负载和数据包丢失的定期总结来检测跨网络的拥塞。\n\
  \n在整个网络中确定测量点的位置与选择性能指标来比较特定网络入口处和出口处的性能同样重要，这包括了路由器、网接器和交换机等网络设备：\n\n![](img/Figure-5.4.jpg)\n\
  \n图 5.4：入侵检测测量位置\n\n性能指标是根据这些参数对网络流量进行比较，并希望在入口处和出口处几乎保持相关。Yin Zhang 和 Vern Paxson\
  \ 将网络流量与连接内容、数据包间隔、活动开启/关闭模式、流量体积和流量速率进行了比较。跨越网络的多个测量点无论在组织内部还是外部总是优的，因为这增加了在恶意活动从任何主机传播时立即捕获它们的几率。单点测量应用在路由器上，如`图\
  \ 5.4`所示。如果安全机制应用于入口处（`路由器 A`）和出口处（`路由器 B`），则来自任何中间主机 `<H[1], H[2], H[3], H[4]……,H[7],\
  \ H[8]>` 的恶意活动可能会影响其领先系统。然而，如果我们应用多个测量点，每个主机在其入口和出口处各设置一个点，那么恶意代码就可以很容易地识别并捕获以防止进一步的损害。\n\
  \n### 5.2.5 过滤\n\n\n\n\n网络流量包含多种类型的数据包，并根据各种参数进行分类，例如数据包的发送和目标端口号、所属协议以及这些协议提供的服务。对每个数据包进行怀疑并进行处理以识别其恶意本质是没用的，因为某些数据包是网络的一部分。处理每个数据包会增加复杂性并消耗更多时间。理想情况下，跳板检测活动只需要识别那些携带恶意代码并可能造成损害的数据包。引起异常和注入抖动（jitter）的恶意包与非恶意包分离离开，这是通过一段单独的代码实现的。抖动是指数据包从源主机到达目的主机时时间间隔的变化。识别恶意数据包是一项困难的任务，因为单个恶意程序由不同的数据包携带，而包含部分信息的数据包无法轻易标记为恶意。过滤数据包会增加丢失关联上下文的概率，并有助于掩盖意图数据包。在图\
  \ 5.5 中，犯罪分子使用命名为 `A` 和 `B` 的两个网络段传输多个恶意数据包：\n\n![](img/Figure-5.5.jpg)\n\n**图 5.5：**\
  \ 流量过滤\n\n犯罪分子没有一次性传输整个恶意程序，因为存在被检测的风险。犯罪分子将恶意程序分成若干部分，并通过不同的网络段作为不同的数据包传输这些部分。如之前的图\
  \ 5.5 所示，完整的恶意程序被分为六个命名为 `Part A`、`Part B`、`Part C`、`Part D`、`Part E` 和 `Part F`的数据包，并通过两个不同的网络段传输。`Part\
  \ A`、`Part B` 和 `Part C` 通过网络段 `A`传输，而 `Part D`、`Part E` 和 `Part F` 通过网络段 `B`传输。这些恶意包被组合并排列成原始完整的恶意程序，以对目标发起攻击。此外，预定义的过滤标准提醒犯罪分子规避检测，并间接帮助他们制定策略。因此，过滤技术应该定期更新，我们不应长期遵循相同的模式和水平。误报和漏报会误导安全管理员，并改变检查和调查的方向以寻找恶意数据包。误报是指一种指示、信号或消息，显示测试结果为正性，但实际上是负性的。在跳板检测的情况下，是指非跳板连接被错误或故意标记为跳板连接。还有另一个类似的概念，广为人知的“漏报”，即得到了负性结果，而实际上是正性的。跳板连接被表示为非跳板连接以规避其检测。\n\
  \n## 5.2.6 最小化连接对的状态 (#toc.xhtml#s186a)\n\n连接链中可能存在大量的活动跳板，因此由于存在 `N²` 内存需求，对每个连接对进行严密检查通常被认为是不可行的\
  \ [[4]](#c05.xhtml#ref4a)。`N` 是连接链中跳板的数量。图 5.2 包含六个连接对，三个在正向，其余的在反向，因为网络流量是双向的。正向连接对为\
  \ `C[1]≡steppingC[2]`、`C[2]≡steppingC[3]` 和 `C[3]≡steppingC[4]`，其中 `C[1]`、`C[2]`、`C[3]`\
  \ 和 `C[4]` 分别是主机 `h[1]`、`h[2]`、`h[3]`、`h[4]` 的连接。同样，反向连接对为 `C[4]≡steppingC[3]`、`C[3]≡steppingC[2]`\
  \ 和 `C[2]≡steppingC[1]`。当主机作为连接链的一部分时，了解它在流量中增加了什么是非常重要的。在图 5.2 中，我们需要比较所有六个连接对以测量网络流量的变化，如果我们在正向进行前三次比较，发现主机\
  \ `h[1]` 和 `h[4]` 处的网络流量差异几乎忽略不计，那么可以假设该连接链没有遭受入侵。正如我们所知，要触发攻击我们需要几行恶意代码，而这些代码无法在如此短的时间内轻易输入完成。因此，这些代码从外部注入到连接链中，导致连接链中各主机之间的网络流量发生。事实上，为了规避检测，入侵者将恶意代码分布在多个主机上，并以这种方式执行它们，使得子程序的输出成为后续子程序的输入。如果我们发现图\
  \ 5.2 中主机 `h[1]` 和 `h[4]` 的网络流量保持不变，那么我们可以将主机 `h[1]↔h[2]`、`h[2]↔h[3]`、`h[3]↔h[4]`\
  \ 之间的三次比较替换为单一比较 `h[1]↔h[4]`。\n\n## 5.2.7 流量模式 (#toc.xhtml#s187a)\n\n网络流量分析是一项记录、审查和检查流量及其模式的活动，旨在衡量性能、确保安全以及管理如定时交付和数据包接收等操作。网络流数据带有数据包头部数据，以便源和目的之间的通信。通信流通过头部包含的协议级信息和数据包流中的时间接近性来区分。网络流包含所有单个数据包的头部信息，每个数据包在指定的时间窗口内使用相同的协议设置。详细的网络流量模式报告被汇总，以记录从几个月到几内的整个通信细节。分析该报告以提取恶意通信模式并将其从通信中剔除，并在源头对其拦截。网络流量模式包含足够的指示信息，协助安全管理员寻找威胁的源头，发现威胁激活的方法，并寻找减少不利影响的方法。从\
  \ Web 服务器到客户端计算机的网络流量具有高字节量和相对较少包数量特点，变得很快。在正常情况下，这三个参与者（时间、字节量和数据包）构成了基准。如果检测到从服务器到客户端的流量在基准时间内数据包量巨大，则可以对其质疑并标记为异常。基准的扰动会引发安全警报，并检查网络流中的异常流发生情况以识别可疑活动。\n\
  \n### 5.2.7.1 路径、流量和需求矩阵 (#toc.xhtml#s188a)\n\n\n\n\n\n网络流量流表示对于执行路由更改、流量分类、过滤和容量规划等控制操作是必须的\
  \ 7。据所知，共有三种标准的流量表示法，分别为`path matrix`（路径矩阵）、`traffic matrix`（流量矩阵）和 `demand matrix`（需求矩阵）。这些表示以描述性的方式提供了网络当前状态以及通过网络的流量流的信息，并使我们能够对执行假设控制操作后的网络状态做出预测。\n\
  \n为了理解这些表示，请考虑如果网络工程师对端到端连接拥有完全控制权，他将如何管理网络流量。有两种常见的表示方法有助于网络工程师检查、检测和诊断问题，并对跨整个网络的安全控制进行评估。第一种表示是`path\
  \ matrix`，如图 5.6 所示，它测量了跨越路径 `P` 的源到目的之间的数据量 `V (P)`：\n\n![](img/Figure-5.6.jpg)\n\
  \n**图 5.6:** 路径矩阵\n\n`path matrix` 通过对通过网络流量流的详细描述代表了网络的当前状态和行为 7。如图 5.7 所示的`traffic\
  \ matrix`代表了每对源-目的对的数据量 `V(S, D)`，并规定了网络上的产生负载：\n\n![](img/Figure-5.7.jpg)\n\n**图\
  \ 5.7:** 流量矩阵\n\n`traffic matrix`是一种抽象模型，用于表示在不同源-目的对之间流动的流量量 8。`traffic matrix`中的每个元素代表源-目的对之间的网络流量数量。在这里，数量单位是字节数或数据包数\
  \ 8。`Traffic matrices` 用于实现各种工程目标，例如未来流量需求预测、网络优化、协议设计和异常检测，也有助于检测由于异常和恶意活动导致的流量突变\
  \ 8。`traffic matrix` 假设产生负载相对于网络状态和行为保持不变 7。网络服务运营商对网络的一小部分或特定组织的小型自治系统（AS）具有有限的控制权。\n\
  \n在`autonomous system`（`AS`）环境中，捕捉网络流量并检查是否存在中断正常流量流以执行恶意活动的尝试更容易容易。`path matrix`涵盖了\
  \ AS 内部的不同路径，而 `traffic matrix` 则是在入口点到出口点之间指定的。在域间和域内路由完全解耦的情况下，`path matrix` 和\
  \ `traffic matrix` 的表示法是充分的，这意味着本地控制操作不对入口和出口点产生影响 7。管理单个 AS 意味着在较小规模上为特定目的构建类似互联网的结构\
  \ 7。与`traffic matrix` 密相关的另一个主题是 `demand matrix`，如图 5.8 所示，它处理的是承载负载（carried load），而前者代表的是产生负载\
  \ 8：\n\n![](img/Figure-5.8.jpg)\n\n**图 5.8:** 需求矩阵\n\n如果没有拥塞，`traffic matrix` 和\
  \ `demand matrix` 可能具有相同的元素。\n\n### 5.2.7.2 响应性\n\n响应性是另一个在设计期间需要充分关注的参数。它涉及检测和响应的时间持续时间。显然，在问题发生之前感知到它是理想的。\n\
  \n在这个数字时代，基于信息技术的系统面临更高的风险，可能被破解以侵犯个人隐私，并破坏组织的财务状况和声誉。恶意活动、欺诈和欺骗的快速增长让组织感到，仅防御威胁并不是唯一的解决方案，它们需要一个适当的响应系统，能够对威胁进行高级感知并采取行动。由于连接到外部网络，网络设备和数据是不安全的，而攻击现在更加复杂和自动化，很容易突破防护，并在组织面前带来严重的安全挑战。下面的图\
  \ 5.9 了入侵响应系统的分类：\n\n![](img/Figure-5.9.jpg)\n\n**图 5.9:** IRS 分类\n\n主动响应机制在没有任何人工干预的情况下立即响应入侵以保护数据资产和网络设备。被动响应机制不是自动激活的，需要人类努力保护数字基础设施不受恶意活动的影响。被动响应系统的缺点是调查期间数据集的机密性泄露，以及流量的不必要的延迟，因为如果收到负面响应，流量将被阻塞并标记为恶意事件。图\
  \ 5.10 显示了检测到入侵时，主动 IRS 和被动 IRS 可能执行的动作。\n\n```\n![](images/Figure-5.10.jpg\n```\n\
  \n\n\n\n\n自动入侵响应系统进一步分为三类：自适应型、专家型和基于关联型。在自适应响应系统中，使用结合了主动和被动响应机制功能的混合方法，并根据攻击的性质以弹出窗口、通知和报告的形式生成动态响应\
  \ 9。系统会通过反馈回路根据先前的响应生成更好的响应。\n\n专家系统遵循定义良好的规则，并执行一系列 `if-then` 语句生成最合适且经过修改的响应。它使用基于特征（`signature`）和基于异常（`anomaly-based`）的方法检测入侵并向安全管理员做出响应。专家系统面临着一个严重的问题，因为它需要大量的初始训练，并在生命周期内需要额外的维护来更新各种决策案例。在基于关联的入侵响应系统（IRS）中，会激活预定义的响应，这些响应是预先生成并与攻击关联的。基于关联的\
  \ IRS 本质上是静态的，这意味着它的验证案例仅制定一次，如果关联漏洞和攻击发现升级需求，则无法进一步修改 9。\n\n## 5.2.7.3 规避攻击者\n\n\
  入侵检测系统（IDS）被广泛用于增强数字资产、互联基础设施和网络防御恶意威胁的安全。IDS 的功能与物理世界中的防盗报警器相似。与所有报警器一样，IDS 也有弱点和缺陷，这有助于攻击者攻破安全措施并在整个入侵和攻击过程中隐藏踪迹。我们认为，构建一个稳健的\
  \ IDS 并不重要，其维护和改进同样重要。攻击者经常尝试获取访问权限并突破安全，而不关心系统的安全性有多高。攻击者采用各种技术让恶意流量通过 IDS，并将这些流量伪装成合法流量以规避检测。混淆（`Obfuscation`）、分片（`fragmentation`）、拒绝服务（`Denial\
  \ of Service`）和应用程序劫持（`application hijacking`）是一些常用的入侵技术。\n\n## 5.2.7.4 IDS 特征与基线\n\
  \n基于知识的入侵检测系统，也俗称为基于特征（`signature-based`）入侵检测系统，管理一个以前发生过的攻击数据库。这些系统评估攻击模式，识别受影响区域并确定系统漏洞，以维护完整记录以防止未来的攻击。IDS\
  \ 特征（`signature`）指的是记录的证据，如`攻击模式`、`时间间隔`、`激活频率`。事实上，每次秘密访问都会留下一些足迹，如`数据包性质`、`激活应用程序尝试失败`、`登录失败`、`系统文件和文件夹的删除`以及重命名，它们共同提供了有关攻击的宝贵信息，在许多情况下还提供了它们的来源。这些足迹被称为特征（`signatures`），用于防止未来发生类似的攻击。基于知识的\
  \ IDS 可能会被新的恶意代码绕过，因为其细节未记录在相关的数据库中。因此，基于特征的 IDS 需要不断更新以维护特征数据库。基于行为的入侵检测系统（也称为基于异常（`Anomaly-based`）入侵检测系统）工作方式不同。这些系统维护系统正常活动的基线（`baseline`）或学习模式（`learned\
  \ patterns`）以识别恶意访问。通过测量偏离基线（`baseline`）或模式（`pattern`）的情况触发安全警报。\n\n### 5.2.7.5\
  \ 混淆\n\n混淆（`Obfuscation`）是指对数据流量进行操纵，使得 IDS 特征（`signature`）无法与恶意包匹配的过程。换句话说，混淆恶意流量规避\
  \ IDS 特征（`signatures`）以帮助攻击者进行秘密访问。Corbin Carlo 10 以以下方式解释了混淆：\n\n让我们考虑以下字符串：\n\n\
  `../../c:\\winnt\\system32\\xevent.exe`\n\nIDS 对此字符串的识别方式与以下字符串不同：\n\n`%5d%5de%2d%2e%2e%2f%2e%2e%2fc:\\\
  winnt\\system32\\xevent.exe`\n\nWeb 服务器通过超文本传输协议（`HTTP`）的解释规则，能够识别出这两个字符串是相同的 10。\n\
  \n## 5.3 基于时间的跳板石检测方法\n\n在本节中，我们将解释基于时间的跳板石检测算法。Yin Zhang 等人 4 分析了网络流量，并检查了链式连接中不同终端之间的行为。节点的网络流量与其前一个节点的网络流量相关，通过测量变化来寻找可疑的犯罪源。一个包含\
  \ `N` 个节点的连接链至少需要 `N` 次关联。网络流量或数据流量指的是在给定特定时刻通过网络传输的数据量 11。流（`flow`）和数据流量（data traffic）之间存在细微差别，流包含了数据流量。流基本上指的是连接两个节点并使其能够通信的不同协议的数据。网络流量代表万维网数据、用户个人数据或某些组织的内网数据。流是一个连续的过程，而网络流量是离散的。\n\
  \nYin Zhang 和 Vern Paxson 4 设计了基于时间的跳板石检测算法。为了更好地理解该算法，我们需要知道 `ON`（开启）和 `OFF`（关闭）周期。如果流在\
  \ `T[idle]` 秒内没有检测到网络流量，则认为该连接链处于 OFF 周期；否则，视为 ON 周期 4。在 `ON` 期间，网络流量中的数据包包含新数据（new\
  \ data）。`new data` 术语表示 TCP 载负载中的非重传和非保跳数据。网络流量以 OFF 周期结束，以 ON 周期开始，持续时间直到连接对上发现\
  \ `T[idle]` 秒的新数据为止 4。Giovanni Di Creszenzo 等人 14, 18 展示了如何在两个网络连接之间通过 `ON` 和 `OFF`\
  \ 周期计算关联性，见图 5.11：\n\n![](img/Figure-5.11.jpg)\n\n图 5.11 基于时间的连接 C1 和 C2 数据包关联\n\
  \nYin Zhang 等人 4 尝试区分交互流量和非交互流量，并利用击键之间的时间间隔来判断这些是机器驱动还是人类行为。V. Paxson 等人 4, 12\
  \ 检查了互联网流量，并借助帕托分布（`Pareto distribution`）描述了关键词之间时间间隔的重要性。在两项研究中，都得出结论：两次连续击键之间的大间隔是不常的，约\
  \ 25% 的关键词间隔为 500 毫秒。约 15% 的关键词间隔为一秒，而 1.6% 的关键词显示的间隔为 10 秒或以上。\n\n### 5.3.1 OFF\
  \ 周期结束时的时间关联\n\n\n\n\n\n在基于时间的踏板石检测算法中，我们根据连接在 OFF 周期结束时或 ON 周期开始时的巧合情况来关联连接的相关性\\\
  [4, [12\\]](#c05.xhtml#ref12a)。假设两个连接 `C[1]` 和 `C[2]` 属于同一连接链的一部分，并形成踏板石连接对 `C[1]≡steppingC[2]`。从概念上讲，`C[1]`\
  \ 和 `C[2]` 应在相似的时间留下 OFF 周期。换句话说，如果用户按下按键并最初通过 `C[1]` 随后通过 `C[2]` 通过，那么跨越这两个连接的关键词\
  \ OFF 周期是重合的。反之亦然，即如果一个关键词最初通过 `C[2]` 随后通过 `C[1]` 传输，那么连接对 `C[1]≡steppingC[2]` 的\
  \ OFF 周期将与 `C[2]≡steppingC[1]` 重合。这一概念被用于衡量相关性。\n\n假设两个 OFF 周期的结束时间差在 `≤ δ` 以内，则认为它们相关，`δ`\
  \ 表示控制参数。\n\n对于两个连接 `C[1]` 和 `C[2]`，`OFF[1]` 和 `OFF[2]` 分别代表每个连接中的 OFF 周期数量，而 `OFF[1],\
  \ 2` 代表相关的 OFF 周期数量。Yin Zhang 和 Vern Paxson \\[4, [14\\]](#c05.xhtml#ref14a) 推导出了以下关系：\n\
  \n![](img/Image31878.jpg)\n\n其中 `γ` 代表控制参数并固定为 `0.3`。\n\n这种方法的用处在于只需要计算具有显著空闲周期的相关性[\\\
  [4\\]](#c05.xhtml#ref4a)。对于繁忙且非空闲的连接，我们不计算连接对之间的相关性，因为如果连接是活跃或空闲，可以忽略。在任何给定时间点，我们只需要少数可能的连接对。我们需要识别从空闲转为活跃的连接对，这种情况发生并不频繁，因为需要连接最初在很长时间处于非活跃状态\\\
  [4。我们在 ON 周期开始时计算跨连接的相关性。假设两个连接 `C[1]≡steppingC[2]`，如果 `C[1]` 的吞吐容量小于 `C[2]`，则 `C[2]`\
  \ 的 ON 周期结束得早于 `C[1]`。否则，其持续时间应该几乎相似。采用上述方法是因为其简单，且对该算法的某些改进可以提高其准确性。在改进中，时间因果关系起着重要作用\\\
  [13。假设同一条流链上存在两个流 `F[1]` 和 `F[2]`，那么它们的时间相关性要求在顺序上保持一致。换句话说，如果 `F[1]` 在 `F[2]` 之前以\
  \ OFF 周期结束，这种顺序在未来应该一直持续。为了增强该算法的准确性，我们计算连续巧合的次数以抑制巧合的频率，并将真实的踏板石与意外巧合的连接区分开。Yin\
  \ Zhang 等人 \\[4, 12, 14 如果两个连接 `C[1]` 和 `C[2]` 都构成连接对，则推导出了以下关系：\n\n![](img/Image31890.jpg)\n\
  \n和\n\n![](img/Image31898.jpg)\n\n其中 `![](img/Image31907.jpg)` 代表连续巧合的次数，`mincsc`\
  \ 和 `![](img/Image31914.jpg)` 是控制参数。\n\n### 5.3.1.1 使用抖动（Jitter）规避\n\n数据包以连续的方式从发送端交付，包之间有固定时间间隔。在接收端，这种时间间隔可能会由于网络拥塞而变化。**抖动**指的是数据包接收时的计时变化\\\
  [17。攻击者故意在连接链中注入延迟以干扰相关性，避免检测。Giovanni Di Creszo 等人 \\[14 分析了基于时间的踏板石检测算法，并认为抖动是一种可以规避安全措施的媒介。基于时间的踏板石检测算法容易受到抖动的影响，如果攻击者在连接中注入超过\
  \ `δ msec` 的抖动，由于 OFF 周期只有在结束时间差小于 `δ` 时才被认为相关\\[14。\n\n### 5.3.1.2 使用填充包（Chaff）规避\n\
  \n**填充包**指的是插入到数据流量中的无意义填充包，意在接收端产生延迟\\[15, 17。攻击者在连接中注入填充包以降低相关 OFF 周期与总 OFF 周期的比例\\\
  [14。只要注入了足够的填充包，上述比例就会下降，有利于犯罪。\n\n# 5.4 暴力破解内容算法\n\n暴力破解内容算法基于以下概念：对于踏板石，如果没有使用加密机制，用户输入的文本在两个连接之间是逐字复制的。因此，具有相同内容的公共连接中的文本可以被识别出来。Yin\
  \ Zhang 等人 \\[4 建议需要分析某些手动检查来识别踏板石以推导出该算法。该算法的工作原理如下：\n\n1. 从跟踪中所有出现的会话提取 Telnet\
  \ 和 Rlogin 输出并汇总到一个文件中\\[4。\n2. 统计输出中每条行的出现频率。\n3. 忽略所有没有其他行副本的行。这些行被认为是踏板石的良好候选。\n\
  4. 将包含这些行的连接列在文件中。该文件记录每个连接中的唯一行并保存在数据库中。在这些唯一行与第一步创建的文件行之间执行连接操作。任何没有自身副本的行都会被忽略\\\
  [4。\n5. 使用 `join` 工具识别在两个连接中都出现过两次的行对。\n6. 拥有五个或更多此类具有副本行的连接对现在被认为是踏板石的候选。\n7. 再次分析连接对的方向，丢弃方向相同的连接\\\
  [4。\n8. 对剩余的连接对进行进一步的视觉检查，以确认这些确实在作为踏板石。\n\n## 5.5 简单内容算法\n\n\n\n\n\nYin Zhang 和\
  \ Vern Paxson [\\[4\\]](#c05.xhtml#ref4a) 设计了两种基于内容的算法来检测跳板机（stepping stones）。这些算法基于登录之间的文本相似性概念。假设\
  \ `L[1]` 和 `L[2]` 是两个连续的登录，如果在 `L[1]` 中看到的文本在 `L[2]` 中被进一步检测到，则这些登录被认为具有关联 [\\[4\\\
  ]](#c05.xhtml#ref4a)。这些算法强调于搜索此类唯一文本的实例。显然，所有的登录会话在各个方面都变得独特且不同，很难找到证据来确定它们之间的不同之处\
  \ [\\[4\\]](#c05.xhtml#ref4a)。\n\n第一种算法认为，很少有 Telnet 客户端会传输 X-Windows `DISPLAY`\
  \ 变量，其目的是通过远程 X 命令定位用户的 X 显示服务器。在该算法中，`DISPLAY` 的值保持唯一，因为它在全球范围内识别了特定的硬件实例。Yin Zhang\
  \ 等 [\\[4\\]](#c05.xhtml#ref4a) 使用了 `Bro`（一种开源、基于 Unix 的`网络入侵检测系统` `NIDS`）来被动检查网络流量并检测恶意活动。在该算法的实现过程中，`Bro`\
  \ 被修改为与每个 telnet 会话链接，并将 `DISPLAY` 变量的值附加到值上以标记会话 [\\[4\\]](#c05.xhtml#ref4a)。\n\
  \n在第二种算法中，当一个新的交互会话开始时，登录对话框包含一条状态行。不同时间戳和之前访问过的主机的可能组合使得状态行在回溯过程中变得独特性 [\\[4\\\
  ]](#c05.xhtml#ref4a)。该算法存在假误报的问题，每当两个或多个交互会话指向同一个用户时，负责这些会话的计算机被视为跳板机 [\\[4\\]](#c05.xhtml#ref4a)。\n\
  \n## 5.6 异常检测技术\n\n犯罪分子向网络流量中注入抖动（jitter）和填充（chaff）以逃避检测。Giovanni Di Crescenzo 等\
  \ \\[14, [18\\]](#c05.xhtml#ref18a) 设计了以下三种算法来检测网络流量中基于抖动和填充的异常：\n\n1. 基于响应时间的算法\n\
  2. 基于编辑距离的算法\n3. 基于因果关系的算法\n\n一个不知道回溯机制检测的攻击者很容易被基于时间的跳板机检测算法捕获，但如果他注入了抖动和填充，就很难检测到他。响应时间算法用于检测抖动，而基于编辑距离和基于因果关系的算法均用于检测网络流量中的填充\
  \ \\[14, [18\\]](#c05.xhtml#ref18a)。\n\n# 5.6.1 基于响应时间的算法\n\n基于响应时间的异常检测算法认为，在特定时间槽内的交互会话中发送请求时，会收到服务器的响应。假设\
  \ `C` 是客户端和服务器之间的交互连接。`C[12]` 代表从客户端到服务器的封包流，而 `C[21]` 代表从服务器到客户端的反向响应。该算法假设每当从客户端向服务器发送请求时，客户端都会立即收到来自服务器的回显（Echo）形式响应\
  \ \\[14。涉及请求 `C[12]` 的封包通过参数 `T[idle]` 分为 ON 和 OFF 周期。将请求分为 ON 和 OFF 周期显著减少了数据包的处理数量，且不影响结果\
  \ [\\[18\\]](#c05.xhtml#ref18a)：\n\n```\n![](img/Figure-5.12.jpg)\n```\n\n**图 5.12:**\
  \ 基于响应时间的异常检测\n\nGiovanni Di Crescenzo 等 \\[14 使用 300 到 500 毫秒不同的 `T[idle]` 值对该算法进行了测试，并得出该算法的结果不受\
  \ `T[idle]` 参数变化的影响。假设跨连接 `C[12]` 传输的数据包从一个 ON 周期开始，如果在 `RTT+δ[RT]` 时间内未连接 `C[21]`\
  \ 上没有收到响应包，则该 ON 周期被标记为异常，如*图 5.12* 所示。`RTT` 代表往返时间，而 `δ[RT]` 被视为固定时间槽（50 毫秒），代表服务器的响应时间\
  \ [\\[17\\]](#c05.xhtml#ref17a)。计算异常 ON 周期占总 ON 周期的比例，如果发现大于 `γ[RT]`，则该连接被视为异常。Giovanni\
  \ Di Crescenzo 等 \\[14 将 `γ[RT]` 设置为 0.67，并得出 `γ[RT]` 值过小会导致许多假报，而值大则意味着许多假漏。当服务器被客户端查询极度负载且所需时间超过\
  \ `δ[RT]` 时，该算法产生假报。如果犯罪分子以极快的速度生成查询，且连接 `C[12]` 上的所有相关包都在 `Ti[dle]` 时间内传输且未划分 ON\
  \ 和 OFF 周期，则会导致假漏。如果在小于 `δ[RT]` 的时间段内注入抖动，也无法被检测。\n\n### 5.6.2 基于编辑距离的算法\n\n基于编辑距离的算法认为，对于正常连接，双向（`C[12]`\
  \ 和 `C[21]`）的 ON 和 OFF 间隔的时间序列是相同的，或者至少非常相似 \\[14, [18\\]](#c05.xhtml#ref18a)。对于相同的时间序列，编辑距离为零；对于相似的连接，编辑距离设置为零\
  \ \\[14。如果在连接中注入填充，时间序列会变得不同，并在 ON 和 OFF 间隔之间测量出正编辑距离。这种正编辑距离随着填充量的增加按比例增加 [\\[18\\\
  ]](#c05.xhtml#ref18a)。\n\nGiovanni Di Crescenzo 等 \\[14 利用连接 `C[12]` 和 `C[21]` 的传输序列设计了该算法。在该算法中，包被分为\
  \ ON 和 OFF 周期，保持 `T[idle]` 为 300 毫秒。测量两个连续 ON 周期之间的时间差，用于构建 `C[12]` 和 `C[21]` 的序列。传输序列被分为若干子序列，并计算每个子序列的局部编辑距离。允许子序列的编辑距离为\
  \ `β` 以视为合法。如果子序列的累计编辑距离超过子序列数量的 `β` 倍，则连接被标记为异常且可疑 \\[14, [18\\]](#c05.xhtml#ref18a)。\n\
  \n### 5.6.3 基于因果关系的算法\n\n这种异常检测方法用于检测网络流量中填充的存在。Giovanni Di Crescenzo 等 \\[14] 在拆分为\
  \ ON 和 OFF 周期之前分析了犯罪分子的行为，观察到犯罪分子在执行触发攻击的恶意程序运行时等待输出 \\[14。如果犯罪分子尝试成功，他们将尝试下一个恶意代码。这种类型和等待机制被认为是该算法的基准\
  \ \\[14。基于因果关系的异常检测方法考虑了以下两个假设：\n\n*   对于连接 `C[12]` 上的两个连续 ON 周期，在连接 `C[21]` 上计算一个\
  \ ON 周期。\n*   同样，对于连接 `C[21]` 上的两个连续 ON 周期，在连接 `C[12]` 上计算一个 ON 周期。\n\n\n\n\n\n\
  如果在连接 `C[12]` 出现另一个 ON 周期之前，在连接 `C[21]` 上观察到零个或多个 ON 周期，则连接 `C[12]` 上的 ON 周期被标记为异常且反常的。图\
  \ 5.13 显示了连接 `C[12]` 和 `C[21]` 上连续 ON 周期的基于因果关系的异常检测：\n\n![](img/Figure-5.13.jpg)\n\
  \n**图 5.13:** 基于因果关系的异常检测\n\nGiovanni Di Crescenzo 等人 [\\[14\\]](#c05.xhtml#ref14a)\
  \ 计算了 `γ[forward]`，该值定义为连接 `C[12]` 上异常 ON 周期与总 ON 周期的比率。同样，为连接 `C[21]` 计算了 `γ[reverse]`。在正常连接的情况下，`γ[forward]`\
  \ 和 `γ[reverse]` 的数值均较低，但如果这些衡量值的值大于 `0.67`，则该连接被认为是异常的，并认为渗透是通过欺杂流量（chaff）实现的。\n\
  \n基于因果关系的异常检测方法在交互式连接被用于批量文件传输或处理具有大输出的命令时，会受到误报的影响。如果犯罪分子使用欺杂流量的速率高于 `T[idle]`，它也会受到漏报的影响。这种更高速率的欺杂流量引入是由于自定义服务器的参与实现的。\n\
  \n## 结论\n\n互联网的主要问题是缺乏一种有效技术来将用户身份与其在互联网上执行相应的活动相关起来。我们解释了通过网络标识符来解决这一问题，并展示了网络标识符如何帮助识别谁执行了什么活动。指纹（thumbprints）的用途在关联计算以及判断两个网络连接链的对称性水平中得到了阐述。此外，我们解释了跳板（stepping\
  \ stones）及其在规避犯罪检测中的秘密利用。本章的主要吸引点是基于时间的跳板检测方法，该方法利用跨越连接链的网络流量的 ON 和 OFF 模式来确定中间受损和被攻破的计算机。由于犯罪分子使用抖动（jitter）和欺杂流量（chaff）来操纵网络流量并产生\
  \ ON 和 OFF 周期的变化，我们解释了基于内容的暴力破解算法和简单基于内容的算法，以检测网络流量中的抖动和欺杂流量。最后，我们阐述了基于响应时间的算法、基于编辑距离的算法和基于因果关系的算法，以确定网络流量中的异常并对其进行修复以消除\
  \ ON 和 OFF 模式中的变化。\n\n在下一章中，我们将学习用于检测跨网络连接链欺造包的方法，并将讨论一些通常用于防止基于欺造包攻击的先进技术。\n\n\
  ## 要点回顾\n\n*   构建有效网络防御措施的主要障碍是缺乏犯罪源识别。\n*   当用户访问远程计算机以检索所需信息并进行通信时，要让某人对其互联网上的活动承担责任所需的证据分布在网络中。\n\
  *   身份验证机制通过关联的密码验证用户，而审计机制记录已验证用户所执行的活动。\n*   当用户首次登录网络时，会被分配一个网络标识符（`NID`）。\n\
  *   时间指纹是指序列 `<t[2]-t[1], t[3]-t[2], t[4]-t[3], …, t[n+1]-t[n]>`，其中每个元素代表两个连续传输包之间的时间间隙。\n\
  *   犯罪分子通过跳板实现匿名性。\n*   跳板是先前受损和被攻破的中间计算机，恶意代码通过这些计算机传输以触发最终攻击。\n*   当一个人登录一台计算机并控制另一台计算机，通过登录这第二台计算机操作第三台计算机，并以相同的方式控制剩余计算机时，就形成了一系列登录操作，这一登录序列被称为连接链。\n\
  *   属于连接链的中间主机称为跳板（Stepping stone）。\n*   如果两个网络连接都是同一个连接链的一部分，这对网络连接被称为跳板连接对。\n\
  *   连接链上的数据流可以是单向的也可以是双向的。\n*   双向连接链由两个单向流组成，两者的方向相反。\n*   用于比较连接对之间网络流量的主要网络流量特征包括：连接内容、包间间距、ON/OFF\
  \ 活动模式、流量体积和流量速率。\n*   主动监控的主要优势是能够快速检测威胁并维护整个网络的完全可见性。\n*   被动网络监控依靠统计数据来识别网络流中的不规则情况，而不注入测试数据来预测网络中的漏洞。\n\
  *   网络流量测量是指对正在进行的数据传输进行密切检查，提供有关丢失和损坏的数据包、数据交付、到达延迟以及排序的详细信息。\n*   误报（false positive）是指显示测试结果为正但实际为负的指示、信号或消息。\n\
  *   漏报（false negative）是指显示测试结果为负但实际为正的指示、信号或消息。\n*   网络流包含所有单个数据包的头部信息，每个数据包在指定的时间窗口使用相同的协议设置。\n\
  *   网络流量模式包含足够的指示信息，协助安全管理员寻找威胁的源头，发现威胁激活的方法，并寻找减少不利影响的方法。\n*   通过分析详细的流量模式报告来确定未来的风险，并相应开发安全机制以修补未来的漏洞并消除进一步的攻击。\n\
  *   路径矩阵（Path matrix）用于了解源到目的之间的数据量。\n*   流量矩阵（Traffic matrix）用于了解源与目的对之间的网络流量。\n\
  *   需求矩阵（Demand matrix）处理载荷。\n*   响应机制执行的最常见操作包括挂起 IP 地址、阻塞 IP 地址、阻塞端口、注入 TCP 重置以终止连接、重新配置路由器和防火墙。\n\
  *   混淆（Obfuscation）是指操纵数据流量，使得 IDS 签名无法与恶意包匹配。\n*   如果流在 `T[idle]` 秒内没有到网络流量，则认为是该连接链的\
  \ OFF 周期；否则认为是 ON 周期。\n*   抖动（jitter）是指包在目的端接收时的时间变化。\n*   欺杂流量（chaff）是指为了产生接收延迟而插入数据流量的无填充包。\n\
  \n## 单选题\n\n1.  NSM 代表：\n    1.  网络安全监控\n    2.  网络安全管理\n    3.  网络安全操控\n    4.\
  \  国家安全管理\n\n2.  关于跳板正确的是：\n    1.  这些是犯罪分子直接发起攻击的计算机\n    2.  这些是中间受损和被攻破的计算机\n\
  \    3.  这些是目标系统\n    4.  这些系统不是连接链的一部分\n\n3.  什么是时间指纹（temporal thumbprint）？\n \
  \   1.  数据包序列\n    2.  时间戳序列\n    3.  每个元素代表包之间时间间隙的序列\n\n\n\n\n\n## 4. 带有时间戳的伪包收集\n\
  \n### 4. RTT 代表：\n1. 反向往返时间 (Reverse Trip Time)\n2. 反向时间戳 (Reverse Time Time-stamps)\n\
  3. 反向往返时间戳 (Reverse Trip Time-stamps)\n4. 往返时间 (Round Trip Time)\n\n### 5. 以下哪项不参与基线（base-lining）？\n\
  1. 抖动 (Jitter)\n2. 时序 (Timing)\n3. 字节量 (Byte volume)\n4. 数据包 (Packets)\n\n### 6.\
  \ 需求矩阵处理的是：\n1. 提供负载 (Offered load)\n2. 负载负载 (Carried load)\n3. 数据量 (Data Volume)\n\
  4. 抖动与干扰流量 (Jitter and Chaff)\n\n### 7. 混淆（Obfuscation）是指：\n1. 测量提供负载的技术\n2. 测量通过负载的技术\n\
  3. 规避 IDS 签名检测恶意代码的技术\n4. 测量数据量的技术\n\n### 8. 以下哪一项不是异常检测技术？\n1. 基于响应时间的算法\n2. 基于编辑距离的算法\n\
  3. 基于因果关系的算法\n4. 基于时间戳的算法\n\n## 答案\n\n1. **a**\n2. **b**\n3. **c**\n4. **d**\n5.\
  \ **a**\n6. **b**\n7. **c**\n8. **d**\n\n## 问题\n\n1. 什么是互联网基础设施中的问责问题（problem of\
  \ accountability）？\n2. 讨论网络标识符在确定用户问责制中的作用？\n3. 什么是时间指纹（temporal thumbprint）？详细讨论其效用。\n\
  4. 定义跳板（stepping stones）及其主要类型。阐述跳板检测的优势？\n5. 如何最小化连接对的状态？请解释。\n6. 解释以下内容：\n   \
  \ 1. 使用网络标识符会话管理\n    2. 网络测量点\n    3. 流量过滤\n    4. 流量模式及其用途\n7. 详细定义路径矩阵（path matrix）、流量矩阵（traffic\
  \ matrix）和需求矩阵（demand matrix）。\n8. 区分以下内容：\n    1. 直接跳板与间接跳板\n    2. 主动监控与被动监控\n\
  \    3. IDS 签名与基线检测\n    4. 抖动与干扰流量（chaff）\n9. 将主动入侵响应系统（IRS）和被动 IRS 中的入侵活动进行分类。\n\
  10. 详细描述基于时序的跳板检测方法。\n11. 详细阐述基于内容的暴力破解算法。\n12. 详细解释简单的基于内容的算法及其效用。\n13. 详细解释以下异常检测技术：\n\
  \    1. 基于响应时间的算法\n    2. 基于编辑距离的算法\n    3. 基于因果关系的算法\n\n## 参考文献\n\n[1] A pwc report,\
