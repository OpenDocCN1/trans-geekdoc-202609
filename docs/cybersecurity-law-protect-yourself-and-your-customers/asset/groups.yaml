    ## 第3章


    ### 企业网络安全要求是什么？


    ### 本节详细介绍了公司需要采取哪些行动，以确保完全遵守信息安全法规


    本章将讨论管理层需要确保到位的一些事项，以避免在发生网络安全事件时遭到愤怒客户的诉讼。如果你在加拿大（全部或部分）运营业务，公司应首先关注的立法是一项名为PIPEDA的法案，即《个人信息保护和电子文件法》“Wasser,
    L. A., Lyons, C., & Koczerginski, M. (2017年10月)。” 这项联邦立法适用于所有受联邦监管的企业，适用于员工个人信息的保护以及商业活动过程中个人信息的保护。PIPEDA不适用于加拿大业务运营的唯一情况是，当省份有实质性相似的立法时，在这种情况下，省级立法将取代PIPEDA适用。目前，唯一有取代PIPEDA立法的其他省份是：阿尔伯塔省《个人信息保护法》，SA
    2003, c P-6.5.；不列颠哥伦比亚省《个人信息保护法》，SBC 2003, c 63.；魁北克省《关于私营部门保护个人信息的法案》，CQLR c.
    P-39.1。


