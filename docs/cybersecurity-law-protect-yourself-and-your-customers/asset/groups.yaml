  - '[PAGE 97]


    it''s very important you meet industry standard with your security measures.


    We discussed the importance of having a cyber security specific insurance as a
    failsafe in case your company does suffer from a data breach and suffers financial
    losses. Many traditional insurance plans will not cover cybersecurity costs, therefore
    it is important that you ensure that your service does or get one that will cover
    you.


    Another contingency plan we discussed offloading the responsibility onto third
    parties. One way you can do this is through cloud solutions, by offloading the
    storage of your data into a cloud solution any data breaches that occur will no
    longer be a liability for you but for your service provider, provided security
    is one of the features they promised you. This is a good alternative if you are
    a small company and don''t want to be burdened with implementing all these different
    cybersecurity measures.


    Lastly, I looked at what type of people you should be looking to hire to ensure
    that you are fully compliant with information security law in your area. When
    hiring you need to make sure your acquire the right talent for your department.
    It should include people with knowledge of the industry, knowledge of the laws
    in your specific geographical area and the areas in which your company operates
    and collects data and lastly you need someone with the technical knowledge to
    understand how your company infrastructure works and what changes you need to
    make to be fully compliant.'
