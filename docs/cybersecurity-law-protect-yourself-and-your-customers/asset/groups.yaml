    ## 第 5 章


    ### 所需加密标准


    本章将讨论为贵公司持有的任何信息使用一定级别加密的重要性，无论该信息是在您掌握之中还是在传输过程中（在您的网站上、发送给第三方合作伙伴等），以及如何找到可为您完成此操作的软件。


    加密是指将信息转换为代码以防止未经授权访问该信息的做法。加密是保护客户信息的重要组成部分，如果发生安全事件，调查人员首先检查的内容之一就是加密。加密之所以如此重要，是因为即使信息从贵公司的掌握中被盗，如果已正确加密，则该信息将毫无意义，对罪犯完全无用。在涉及诉讼时，如果您能证明从贵公司被盗的信息不是明文，而是加密文本（密文），则将显著减少或完全免除您需要支付的款项。


    首先，我将解释在制定加密政策时您需要了解的加密的不同方面。在开展业务时，您会遇到两种数据状态：静态数据和传输中数据。静态数据是指公司存储在公司数据库、公司计算机和笔记本电脑上的信息，等等。而传输中数据是指通过互联网发送给客户和从客户发送过来的信息，例如当客户在您的网站上使用信用卡进行在线支付时，您有责任确保其信息在整个过程中都经过加密。加密的第二个重要方面是哈希函数和数字签名之间的区别。哈希函数是指对信息进行打乱或更改，使其在恢复到原始形式之前无法被人类读取。数字签名是指算法可以对文档进行编码，使其非常难以复制。它相当于数字指纹，确保当某人签署文档（例如合同）时，签署者是与该文档关联的唯一人员并对其进行记录。数字签名使用一种称为公钥基础设施（PKI）的标准格式。


    ### 加密类型


    单个文件和文件夹加密：这种加密仅在软件被直接指示时加密特定文件或文件夹，最适合计算机上只有少数文件需要加密的情况。


    卷加密：在此类型中，保存在某个位置的所有文件都会自动加密，适合中等数量的敏感信息。


    全盘或整盘加密：这是指笔记本电脑或计算机上的所有文件都被加密。在这种情况下，您需要在开机时输入密码或提供来自USB的加密密钥，以解锁您的文件。


    幸运的是，良好的加密已内置到现代Windows和Mac OS X操作系统中，并且在某些Linux系统上也可用。在Windows上，您有Microsoft BitLocker，这是一款包含在Windows
    7以及Windows 8.1和Windows 10的专业版和企业版中的磁盘加密工具。要激活Microsoft BitLocker，请打开文件资源管理器，右键单击C盘，然后单击“启用BitLocker”。如果您看不到此选项，则您的Windows版本不支持BitLocker。启用BitLocker后，系统会提示您保存一份恢复密钥的副本。这非常重要，因为您需要此密钥才能访问您的数据。您可以将其打印出来、写下来或保存到文件中——随您方便。Apple
    FileVault是Mac OS X的内置加密软件。要启用Apple FileVault，请单击左上角的Apple图标，进入系统偏好设置，然后单击安全性与隐私，接着单击FileVault。与BitLocker类似，启用Apple
    FileVault后，系统会提示您在iCloud账户中保存恢复密钥，但您也可以选择将其写下来或拍照，我建议您这样做。关于第三方加密程序，以下是市场上几款顶级产品：


    - VeraCrypt：此软件免费，兼容Windows、Mac OS X和Linux。它是最受欢迎的选项之一，并获得用户和第三方测试者的高评价。

    - AxCrypt：这是一款提供免费版和高级版的加密软件。它附带密码管理器，并具有允许您与他人共享加密数据的功能。

    - Gpg4win：此软件为加密以及对文件和电子邮件进行数字签名提供军事级安全性。


    另一种替代方案是使用您当前的防病毒/反恶意软件解决方案。许多（如Symantec、Kaspersky和Sophos）在其安全套件中包含加密功能，或将其作为单独产品提供。要对一些最佳零售软件进行并排比较，您可以访问此网站：Top
    10 Reviews。


    处理传输中信息的加密的另一个重要方面包括通过电子邮件发送信息或将其放在USB随身携带。需要注意的是，一旦信息通过电子邮件发送或复制到USB上，它就不再受您复制来源机器上存在的加密保护。为了在这些情况下保护数据，公司USB应具有自己的加密保护。您可以使用Microsoft的BitLocker
    To Go等程序，或购买预装加密软件的USB，例如IronKey、SanDisk和Kanguru。


    说到电子邮件加密，需要注意的是，电子邮件加密可能不方便，因此您作为企业不希望加密发送的每封电子邮件。这简直太耗时了，而且除非用户精通技术，否则他们很可能不知道如何解密。但是，在发送高度敏感信息的情况下，电子邮件加密非常重要；否则，任何窃听者都将能够访问您消息的内容。幸运的是，大多数企业不需要将此作为法律责任来担心。因为在大多数情况下，您使用的是另一家公司的电子邮件服务，除非贵公司存在某些疏忽（例如将电子邮件发送到错误地址），否则如果有人能够访问传输中的电子邮件，您通常不承担责任——这将由电子邮件提供商承担。


    如果您为政府或另一家拥有您真正希望不泄露的敏感信息的公司工作，那么以下是您加密电子邮件的一些选择。首先，大多数电子邮件套件（如Gmail、Outlook等）都自带您可以使用的内置加密选项。我将讨论如何在三个不同平台（Outlook、iOS、Mac
    OS X、Android和Gmail）上配置此功能，以及讨论如何拥有一个一次性电子邮件地址（匿名发送电子邮件）。


    Outlook：使用Outlook启动加密的第一步是拥有数字证书。如果您的组织不提供，则您需要自行创建。请按照以下步骤操作：


    - 转到“文件” > “选项” > “信任中心” > “信任中心设置” > “电子邮件安全性”，获取数字ID。

    - 选择您希望从中获取数字ID的证书颁发机构。

    - 您将在电子邮件中收到数字ID。


    现在，设置以便数字签名可以附加到已签名的电子邮件：


    - 选择“工具” > “选项”并单击“安全”选项卡。

    - 将您选择的名称输入到“安全设置名称”字段中。


