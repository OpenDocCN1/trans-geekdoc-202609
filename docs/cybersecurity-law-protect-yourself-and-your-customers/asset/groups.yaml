    ## 第 4 章


    ### 信息安全立法的财务和声誉影响是什么？


    ### 不遵守现行信息安全法律的公司可能面临哪些类型的诉讼，代价有多高？


    如果您的公司被认定违反了我在第 2 章中概述的任何立法，您将面临潜在诉讼的风险。本章我将讨论您的公司可能面临的不同类型的诉讼，以及这对您的公司意味着什么样的财务影响。在加拿大，集体诉讼通常分为三类：(1)
    员工失误、(2) 员工不当行为和 (3) 数据泄露。


    **员工失误**：这是指员工无意中做了一些事情，导致个人隐私泄露的情况。例如，员工丢失了一个包含客户信息的未受保护的闪存驱动器。


    **员工不当行为**：这是指员工故意访问其无权查看的信息的情况。需要注意的是，仅仅因为某人是公司员工，并不意味着他们应该能够访问公司拥有的所有信息。为保安全，员工只应获得完成工作所必需的信息访问权限，而不应获得更多。在信息安全领域，这涵盖在“最小权限”原则下。


    **数据泄露**：这些诉讼涵盖因外部方恶意活动导致信息泄露的情况。例如，黑客入侵计算机网络并窃取用户名和密码、信用卡信息等。为了降低因这些泄露被认定承担责任的可能性，您的安全措施符合行业标准非常重要。这些诉讼往往给公司带来最大的财务负担，例如，Ashley
    Madison 案涉及 7.6 亿美元，Equifax 案涉及 5.5 亿美元。原告通常会就违约、违反消费者保护立法、疏忽、侵犯隐私、违反隐私权和公开私生活等事项达成一致。


    ### 美国网络安全法律


    ### 联邦法律


    1996 年《健康保险可携性和责任法案》(HIPAA)：这是美国联邦法律，旨在保护医疗保健患者的隐私。它仅影响医疗行业的某些成员，例如医疗保健提供者、健康保险公司和健康交换组织。HIPAA
    涵盖组织创建或接收的所有个人可识别信息。除了 HIPAA，健康信息还受州法律的管辖。


    1999 年《格拉姆-莱奇-比利法案》：该法案要求金融机构（定义为提供消费者金融产品或服务的公司，例如贷款、金融/投资建议或保险）向客户解释其信息共享做法并保护客户数据。Gramm-Leach-Bliley
    Act (n.d.)。


    2002 年《国土安全法》，其中包含《联邦信息安全管理法》(FISMA)：FISMA 是一个框架，提供了如何保护政府信息、资产和运营免受自然和人为威胁的指导。它要求项目官员和各机构负责人每年对信息安全计划进行审查，旨在将风险保持在或低于可接受水平。


    美国国家标准与技术研究院 (NIST) 概述了符合 FISMA 的九个步骤：


    - 1. 对受保护信息进行分类。

    - 2. 选择最低基准控制措施。

    - 3. 使用风险评估程序完善控制措施。

    - 4. 在系统安全计划中记录控制措施。

    - 5. 在适当的信息系统中实施安全控制措施。

    - 6. 实施安全控制措施后评估其有效性。

    - 7. 确定机构层面的任务或业务风险。

    - 8. 授权信息系统进行处理。

    - 9. 持续监控安全控制措施。


    这三部法律共同规定，医疗保健组织、金融机构和联邦机构必须以“合理”的安全级别保护其系统和信息。


    2015 年《联邦交易所数据泄露通知法案》：该法案要求健康保险交易所在发现泄露后尽快但不迟于 60 天内，通知每个人，其个人信息已知因交易所维护的任何系统的安全漏洞而被获取或访问。


    ### 州法律


    加利福尼亚州于 2003 年实施了一项名为《安全泄露通知法》的法律，要求任何持有加州公民个人信息的公司在发生泄露时通知他们。从那以后，其他几个州也实施了类似的法律，因此如果您在美国开展业务，请注意，在发生网络安全事件时，您应通知受影响的人。


    纽约州金融服务部 (DFS) 于 2017 年 3 月 1 日通过了《纽约网络安全法规》。这要求所有受影响的公司必须从 2018 年 2 月 15 日起，每年向纽约州金融服务部提交一次符合网络安全法规的合规认证。


    ## 您需要哪些技术要求来降低法律责任风险？


    以下是您的公司可以实施的一些最佳实践，以确保您满足“合理信息安全”的标准。此列表由互联网安全中心（Center for Internet Security）的关键安全控制（CIS
    Controls™ (n.d.)。检索自 https://cisecurity.org/controls/）定义的 20 项控制措施组成，加州总检察长 Otto
    和 Kennedy (2016) 在“合理安全”变得相当清晰一文中表示，这代表了“信息安全的最低水平”：


    - 1. 授权和未授权设备清单

    - 2. 授权和未授权软件清单

    - 3. 移动设备、笔记本电脑、工作站和服务器上硬件和软件的安全配置

    - 4. 持续漏洞评估和修复

    - 5. 受控使用管理特权

    - 6. 审计日志的维护、监控和分析

    - 7. 电子邮件和 Web 浏览保护

    - 8. 恶意软件防御

    - 9. 网络端口、协议和服务的限制和控制

    - 10. 数据恢复能力

    - 11. 网络设备（如防火墙、路由器和交换机）的安全配置

    - 12. 边界防御

    - 13. 数据保护

    - 14. 基于需要知道的受控访问

    - 15. 无线访问控制

    - 16. 账户监控和控制

    - 17. 安全技能评估和适当培训以弥补差距

    - 18. 应用程序软件安全

    - 19. 事件响应和管理

    - 20. 渗透测试和红队演练


    其他建议：Otto 和 Kennedy (2016)。


    除此之外，加州总检察长还表示，仅凭用户名和密码不足以保护用户的个人信息。建议组织为面向消费者的在线账户提供多因素身份验证。多因素身份验证意味着，除了要求用户提供他们知道的东西（例如用户名或密码）之外，他们还必须提供他们拥有的东西（例如在提供用户名和密码后通过短信生成并发送的一次性代码）或他们本身的东西（例如指纹或视网膜扫描）。这样做，黑客攻破账户的难度会大大增加。一些提供此解决方案的热门网站包括
    LinkedIn 和 WordPress。


    还强烈建议组织对公司笔记本电脑和其他便携设备（如手机和 USB 驱动器）上的个人信息使用强加密实践。您还应考虑对未使用的系统使用全盘加密。电子设备上未加密数据的盗窃或丢失是最常见的数据泄露类型之一，强加密在很大程度上可以消除这一风险。在第
    4 章中，我们将更详细地讨论您可选择的不同类型的加密选项。


    鼓励受影响的客户在其信用档案上设置欺诈警报，有助于减少数据泄露的影响，并让客户放心，您正在尽一切努力帮助保护他们。信用警报会通知商家该账户可能存在欺诈行为，并提示他们要求对该人身份进行额外验证。通常，此功能可以免费添加。


