    ## 使用 iOS 加密电子邮件


    进入高级设置，打开 S/MIME 并将“加密”从默认值改为“是”。现在，当您创建电子邮件时，应该会看到一个锁图标，点击它将其关闭，电子邮件将被加密。如果图标是蓝色，则表示可以向该


    人发送加密电子邮件；如果图标是红色，则表示无法向该人发送加密电子邮件。这通常是因为对方不在您的 Exchange 环境中（例如不同的公司），或者您尚未安装其数字签名。


    与 Outlook 类似，如果您想发送加密消息，收件人之间必须交换数字签名：


    - 进入高级设置菜单，您将看到一个选项，可以将您的数字签名附加到电子邮件。

    - 收到电子邮件后，点击发件人地址

    - 将出现一个红色问号图标，指示签名不受信任。点击“查看证书”

    - 点击“安装”。完成后，安装按钮将变为红色并显示“移除”。点击右上角的“完成”。

    - 现在，当您向该人撰写消息时，锁图标将变为蓝色。点击它关闭锁并加密您的消息。


    ## OS X 电子邮件加密


    要在默认邮件程序中使用 OS X 加密，您首先需要与收件人交换数字签名。但是，为了确保加密有效，您需要确保您发送信息的对象正在使用支持您所使用的加密类型的服务。例如，在
    Gmail 的情况下，为了使用 Gmail 加密，接收者必须使用支持 TLS 加密的服务。


    为了确保您公司的信息得到正确加密，您首先要做的是决定使用哪种加密算法。在数字签名生成方面，一些可接受的算法是 DSA、RSA 和 EC。在哈希函数方面，最好使用
    SHA-2 或 SHA-3。避免使用以下算法：RC4、DES、Triple DES、SHA-1 和 MD5。无论您选择哪种加密解决方案，都要花些时间查看它们使用的加密算法类型，您要确保它们运行的是可接受的算法，否则，尽管


    信息被加密，攻击者破解它可能非常简单，以至于基本上毫无用处。您通常可以在配置过程中找到这些信息，也可以查找供应商的联系信息，询问他们使用什么加密算法。


