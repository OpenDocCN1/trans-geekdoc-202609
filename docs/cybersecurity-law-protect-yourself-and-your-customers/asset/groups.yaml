    ## CHAPTER 1


    ### Introduction to Information Security Law


    ### This Will Explain the Current Laws Around Information Security that Businesses
    Need to Be Aware of


    One of the most important responsibilities of a business is to protect the sensitive
    information of their customers. While conducting business you will gather all
    sorts of personal information such as credit card numbers, home addresses, phone
    numbers, bank account information and much more. Not only do you have a moral
    obligation to properly protect this information but as a business you also have
    several legal obligations to your customers and if these obligations are not met
    you can face severe financial repercussions. In this book I will break down the
    current legal risks that management needs to be aware of to avoid being found
    legally liable if any data breaches do occur. Firstly, I''ll give some context
    on why you need to be concerned about data breaches. In 2015, the total amount
    of digital assets stolen via Cybercrime was estimated to be about $3 trillion
    USD and is expected to grow to $6 trillion USD, which is more than the sale of
    all major illegal drugs combined. Most people tend to think that most of this
    money is made by e-transferring money to foreign bank accounts or something of
    that nature, while a fair amount of that does happen, a much larger amount of
    that $6 trillion is made using information that is stolen “Morgan (January 23,
    2018).” “Top five cybersecurity facts, figures and statistics for 2018.” When
    cyber criminals break into a company’s network they are looking for any information
    that can be leveraged, things like credit card numbers, phone numbers, usernames
    and passwords, first and last names, and so on. From there the hackers can use
    this information in a couple of ways to make a profit:


    - 1. Offload cards: any financial information like credit card numbers or usernames
    and passwords to bank accounts can be used to directly commit financial fraud
    and rob your customers of their money.

    - 2. Sell customer information: They can sell this personal information to other
    people who will use it to commit financial fraud or use their contact information
    to try to scam the individual by impersonating an entity they trust like a bank
    for example. A full set of someone’s personal information can sell from anywhere
    between $1 to $450, with the median price being $21.35 “Collins (September 15,
    2015).” “Here’s what your stolen identity goes for on the Internet’s black market.”

    - 3. Thirdly, they can hijack that person’s account using the username and password
    they found, and usually because people tend to use similar passwords across accounts
    they can then go and compromise other accounts that individual has on different
    platforms. In 2012 Dropbox was breached by someone that used login information
    they obtained from a LinkedIn data breach that occurred earlier that year.


    These are just a few of the potential ways that information can be used once it
    has been stolen from your company. This is where the legal aspect comes in, if
    your company is found to be negligent in your handling of your customers personal
    information and that data is stolen and used in a way that causes harm to the
    customer, you could be found liable and incur even more costs in settling lawsuits.
    Due to the increase in cybercrime activity in the last decade, governments have
    begun to implement more cybersecurity legislation demanding the businesses implement
    specific types of security practices. In the United States in 2017 alone, 42 states
    combined to pass more than 240 bills related to cybersecurity “Cybersecurity Legislation
    2017 - Legislative News, Studies ... (December/January, 2017).” I’ll use two of
