    ## CHAPTER 5


    ### Required Encryption Standards


    This Chapter Will Discuss the Importance of Using a Certain Level of Encryption
    for any Information that Your Company Holds While It Is in Your Possession and
    When It Is in Transit (on Your Website, Sent to Third Party Partners, and so on)
    and How You Can Find Software that Will Do This for You


    Encryption refers to the practice of converting information into a code in order
    to prevent unauthorized access to that information. Encryption is a huge part
    of protecting customer information and it will be one of the first things that
    investigators check for if there is a security incident. The reason encryption
    is so important is because even if information is stolen from your company''s
    possession, if it''s properly encrypted, then the information will have no meaning
    and be completely useless to the criminal. When it comes to lawsuits, if you can
    show that the information that was stolen from your company was not in plain text,
    but encrypted (ciphertext), it will significantly reduce or completely eliminate
    the money you would have to payout.


    Firstly, I will explain some of the different aspects of encryption that you need
    to be aware of when coming up with an encryption policy. There are two states
    of data that you will come across while doing business, data at rest and data
    in transit. Data at rest refers to information that is stored by the company on
    company databases, on company computers and laptops, and so on. While data in
    transit refers to information while it is being sent to and from customers over
    the Internet, for example when a customer makes a payment online with their credit
    card on your website, it''s your responsibility to ensure that their information
    is encrypted throughout the process. The second important aspect of encryption
    is the difference between hash functions and digital signatures. Hash functions
    refer to taking information and scrambling or changing it so that it is no longer
    readable by a person until it is changed back to its original form. A digital
    signature is when the algorithm can encode a document that is very difficult to
    duplicate. It is the equivalent of a digital fingerprint that ensures that when
    a person signs a document, such as a contract, the signer is the only one associated
    with that document and records it. Digital signatures use a standard format called
    Public Key Infrastructure (PKI).


    ### Types of Encryption


    Individual file and folder encryption: This type of encryption only encrypts specific
    files or folders when the software is directly told to, and is best when there
    are only a few files on a computer that need encryption.


    Volume encryption: In this type, all files saved in a certain location will automatically
    be encrypted and is good for medium-sized volumes of sensitive information.


    Full disk or whole-disk encryption: This is when all files on a laptop or computer
    are encrypted. In this situation, you will need to enter a password or provide
    an encryption key from a USB when powering on the computer in order to unlock
    your files.


    Fortunately, good encryption is built into modern Windows and Mac OS X operating
    systems, and it is available on some Linux systems as well. On Windows, you have
    Microsoft BitLocker, a disk encryption tool included in Windows 7 and the Pro
    and Enterprise versions of Windows 8.1 and Windows 10. In order to activate Microsoft
    BitLocker, open file explorer and right-click on your C drive and click on “Turn
    on BitLocker.” If you do not see this option, then your version of Windows doesn''t
    support BitLocker. After enabling BitLocker, you will be prompted to save a copy
    of the recovery key. This is very important because you will need this key in
    order to access your data. You can print it off, write it down, or save it to
    a file—whatever is most convenient for you. Apple FileVault is the built-in encryption
    software for Mac OS X. To turn on Apple FileVault, click on the Apple symbol on
    the top left, go to System Preferences, then click on Security and Privacy, and
    then FileVault. Similar to BitLocker, once you enable Apple FileVault, you will
    be prompted to save a recovery key in your iCloud account, but you can also choose
    to write it down or take a picture, which I would recommend. In terms of third-party
    encryption programs, here are a few of the top ones on the market:


    - VeraCrypt: This software is free and is compatible with Windows, Mac OS X, and
    Linux. It is one of the most popular options and receives high ratings from both
    users and third-party testers.

    - AxCrypt: This is an encryption software with a free and premium version. It
    comes with a password manager and has a feature that allows you to share encrypted
    data with others.

    - Gpg4win: This software provides military-level security for encryption and to
    digitally sign files and e-mails.


    Another alternative is to use your current anti-virus/anti-malware solution. Many,
    such as Symantec, Kaspersky, and Sophos, include encryption in their security
    suites or will offer it as a separate product. For a side-by-side comparison of
    some of the best retail software, you can visit this website: Top 10 Reviews.


    Another important aspect of encryption dealing with information that is in transit
    includes sending information via e-mail or carrying it around on a USB. It''s
    important to note that once information is sent via e-mail or copied over onto
    a USB, it is no longer protected by the encryption that is present on the machine
    that you copied it from. To protect data even in these situations, company USBs
    should have their own encryption protection. You can use programs like Microsoft''s
    BitLocker To Go or purchase USBs that come with encryption software pre-installed,
    such as IronKey, SanDisk, and Kanguru.


    When it comes to e-mail encryption, it''s important to note that e-mail encryption
    can be inconvenient, so you don''t want to encrypt every e-mail that you send
    as a business. It would simply be time-consuming, and unless the user is tech-savvy,
    there is a good chance they won''t know how to decrypt it. However, in situations
    where you are sending highly sensitive information, e-mail encryption is very
    important; otherwise, anyone eavesdropping will be able to access the contents
    of your messages. Fortunately, most businesses won''t need to worry about this
    as a legal liability. Since, in most cases, you are using another company''s e-mail
    service, unless there is some negligence on your company''s part, such as sending
    an e-mail to the wrong address, you generally won''t be liable if someone is able
    to access the e-mail in transit—that would fall on the e-mail provider.


    If you work for the government or another company that has sensitive information
    that you really wish not to get out, then here are some of your options for encrypting
    e-mails. Firstly, most e-mail suites such as Gmail, Outlook, and so on come with
    their own built-in encryption options that you can use. I will be discussing how
    to configure this on three different platforms: Outlook, iOS, Mac OS X, Android,
    and Gmail, as well as discuss how to have a burner e-mail address (send e-mails
    anonymously).


    Outlook: The first step to initiating encryption with Outlook is to have a digital
    certificate. If your organization doesn''t provide one, then you will have to
    create one. Follow these steps:


    - Go to File > Options > Trust Center > Trust Center Settings > E-mail Security,
    Get a Digital ID.

    - Choose which certification authority you want to receive a digital ID from.

    - You will receive the digital ID in an e-mail.


    Now, to set it up so that the digital signature can be attached to signed e-mails:


    - Select Tools > Options and click the Security tab.

    - Input a name of your choice into the Security Settings Name field.

