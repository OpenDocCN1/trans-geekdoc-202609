    - 2. Personal information must be protected by safeguards appropriate to the sensitivity
    of the information. This one can be tricky because it''s not very specific but
    I will be discussing in this book the industry standard of security measures used
    to protect the different types of information companies use and make sure that
    you can prove if necessary that you did have the proper level of protection. These
    safeguards must protect against theft/loss as well as unauthorized access, disclosure,
    copying and use or modification. The types of safeguards used by a business should
    include: (1) Physical protection like locked cabinets, securing company property.
    (2) Organizational measures such as security clearances and protocols to be followed
    on collecting and handling customer information. (3) Technology measures such
    as the use of passwords and mandatory complexity of passwords and the use of encryption.
    If your company is holding client information in a database you need to ensure
    that it is encrypted so that even if someone is able to steal the information
    it will be useless to them unless they can decrypt the information, which can
    take up to several years if you are using just an average or better encryption
    algorithm. So if you''re a management level employee, business owner or someone
    responsible for the legal aspects of your business you want to make sure that
    your data is being protected by an encryption algorithm. In Chapter 4, I will
    go into more depth on the different types of encryption standards, their pros
    and cons and how you can go about implementing them.


    - 3. As of June 2015 PIPEDA requires that organizations notify the Office of Privacy
    Commissioner of Canada (the OPC), affect individuals and organizations or government
    institutions that can reduce the risk of harm if you believe that a breach of
    your security safeguards poses a "real risk of significant harm" to the individuals
    whose information you are protecting. Companies are also required to keep a record
    of all breaches and if you are found to knowingly not report a breach you can
    be fined up to $100,000 CAD.


    - 4. Most jurisdictions in Canada have specific laws when it comes to protecting
    health information that is collected, disclosed by health custodians and the protection
    of personal information held by government bodies.


    - 5. Some provinces have passed torts where customers can bring a claim for breach
    of their privacy even if they have no proof of actual damages caused.


    - 6. In Canada it is illegal to install a computer program on a person''s computer
    without consent, cause a program to be installed without consent and to cause
    a computer program to communicate with other electronic devices without consent
    of the owner and this applies if the installer or the target is in Canada.


    - 7. PIPEDA puts limitations on what data can leave the country and gives restrictions
    how data can be transferred outside the country.


    ## What Data Must Stay in Canada (G., & Server Cloud Canada (July 13, 2018))


    PIPEDA makes all private organizations accountable for protecting information
    during transit and outsourcing, while generally it is legal for information to
    cross Canadian borders the Canadian business remains liable for any problems with
    that information. Federal government institutions are subject to the country''s
    Privacy Act, which outlines how personal information is stored and collected.
    If you work for a federal government, you will be held to a higher standard when
    it comes to information security. There is currently a proposal that would prohibit
    classified data from leaving the country, period. In Alberta and Quebec, the transfer
    of public sector personal data outside of the country is restricted and in some
    cases it''s prohibited outside of the province. British Columbia and Nova Scotia
    prohibit government institutions, Crown agents and their service providers from
    moving any personal data outside of Canada, with very few exceptions. If you are
    a business that collects health-related information operating out of Ontario,
    you can''t disclose any of that information without that individual''s expressed
    consent in PHIPA, the Personal Health Information Protection Act. If you want
    to move that health data outside of the province, your company must adhere to
    PHIPA. Depending on where your company is located in Canada and what type of business
    you operate, you might be unable to transfer data outside your province or the
    country or you may only be able to transfer it with certain security measures
    in place.


    ## Rules that Affect Data Leaving Canada


    PIPEDA dictates that companies are responsible for the information they''ve collected
    even when you transfer it to a third party. PIPEDA requires that you use "contractual
    or other means to provide a comparable level of protection while the information
    is being processed by a third party." Here is a breakdown of what this regulation
    means:


    - **Transfer:** When information is transferred for processing, it must only be
    used for the original purpose of collection (for instance, marketing).

    - **Comparable Level of Protection:** The third party processor must provide an
    equivalent level of protection the data would have received if it remained with
    the Canadian company.

    - **Transparency:** The organization must be transparent about their practices
    handling personal information. Organizations must tell customers that their data
    is sent elsewhere for processing, and state that personal information sent to
    another jurisdiction may still be accessed by Canadian law enforcement, courts,
    or national security personnel.


    ## Rules Around Data Storage and Transfers


    As I mentioned previously even after transferring personal information outside
    of your jurisdiction, your company remains accountable for the information even
    after a third party takes possession of it and starts processing it. Your primary
    means for protecting yourself from liability once you''ve transferred information
    to a third party is a contract where you get the third party to agree to properly
    protect and handle the information that they are taking into their possession.
    You also want to take time to question any third-party provider you''re considering
    on their data security practices and make sure they have a level of security that
    is required by provincial and federal data storage and privacy laws. Another responsibility
    you have is informing your customers about how their data will be handled, this
    includes informing them that you are sending the information to another jurisdiction.
    Keep in mind that once data is transferred outside of Canada it becomes subject
    to the laws of the country where the data is stored, so you need to be mindful
    of that before agreeing to transfer the data and do a risk assessment to make
    sure you will not be violating any of these new laws that you''re operating under.
    If possible it''s much better to use local cloud service providers because you
    only have to adhere to Canadian and provincial privacy laws and Canadian providers
    have the best knowledge of the country''s privacy laws, so they''re in the best
    position to securely store data.


    In addition to these laws that affect all businesses that do business in Canada,
    there are also sector-specific laws that affect you depending on what your business
    does. The first I will discuss its effect on financial institutions:


    The Office of the Superintendent of Financial Institutions (OSFI) regulates all
    Federal Regulated Financial Institutions (FRFI) which include banks, most insurance
    companies, and federal pension plans, released a cybersecurity self-assessment
    guide in 2013 for all FRFI to assess their preparation in case of cybersecurity
    breach and to assist in implementing useful cybersecurity practices. The template
    is comprised of six categories: organization and resources; cyber risk and control
    assessment; situational awareness; threat and vulnerability risk management; cybersecurity
    incident management; and cybersecurity governance. It''s important to note that
    while this is a useful template, the OSFI "expects FRFI Senior Management to review
    cyber risk management policies and practices to ensure that they remain appropriate
    and effective in light of changing circumstances and risks." Other regulators
    in Canada that you need to be aware of:

