    # Abstract


    Information security refers to a set of strategies for managing the processes,
    tools, and policies necessary to prevent, detect, document and counter threats
    to digital and non-digital information. Infosec responsibilities include establishing
    a set of business processes that will protect information assets regardless of
    how the information is formatted or whether it is in transit, being processes
    or is at rest in storage “Definition from WhatIs. com (n.d.). Retrieved from https://searchsecurity.techtarget.com/definition/information-security-infosec.”
    With the growth and popularization of the Internet, the Internet of things (IOT)
    and e-commerce information security has become extremely important in most organizations.
    The IOT refers to the connection of physical devices such as laptops, home appliances,
    cars, senors and other electronics to one another through the Internet. This mass
    connection of devices is constantly collecting information on their usage, location
    and user behaviors and this information is usually sent to and stored in a database
    somewhere on the Internet. The result of all of this is that organizations now
    hold and are responsible for a larger volume of information than ever before.
    Organizations collect this information because information holds financial value,
    they can use it to create better products, make targeted marketing campaigns and
    much more. When holding such valuable digital assets organizations need to ensure
    that they have an adequate amount of information security for the sake of the
    company and the customers whose information you are holding. In some cases business
    partners may demand proof of your company’s current information security measures
    before engaging in electronic commerce with you. In addition to demands made by
    potential business partners, your company is also subject to federal laws, state/provincial
    laws and industry specific laws. The penalties for not adhering to these laws
    include a number of lawsuits by customers that are affected in the event of a
    data breach and fines by the government or state/province. Cybersecurity law has
    three main components that I will be discussing:


    +   1. Refers to the legislation that dictates the extent to which organizations
    must protect their data, in particular personally identifiable information (PII)
    “Rouse, M. (n.d.). What is personally identifiable information (PII).” This refers
    to any data that could potentially identify'
