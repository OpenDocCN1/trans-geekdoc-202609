    ## CHAPTER 2


    ### Cyber Law and Intellectual Property


    ### This Chapter Will Address an Important Aspect of Cyber Law Related to Protecting
    a Company''s IP


    Intellectual property refers to a work or invention that are a result of creativity
    to which a person has rights and you may apply for a patent, copyright, trademark,
    and so on in order to make that product of creativity your own property “What
    is Intellectual Property? (n.d.). Retrieved from http://wipo.int/about-ip/en/”
    For examples are Music, Literature, and Software apps. There are many items that
    are offered over the Internet that are considered Intellectual Property and you
    need to ensure you have properly registered any of your creations or you may have
    it stolen by somebody else, simply because they knew how the laws worked and you
    did not.


    ### Copyright:


    This is the most common and most important Intellectual Property Law, especially
    when it comes to the Internet. It covers any original work of authorship such
    as text for a webpage, a software program, blogs, music, and so on. One of the
    most common ones that are overlooked on the Internet is getting copyright for
    your software applications. Remember all software apps are created by someone
    writing code, and just like any written work no two independent works will look
    exactly the same, if you are found with an app that has the exact same code as
    someone else you can be sued and vice versa. Be sure to get copyright on IP that
    involves computer code.


    ### Patents:


    This is another important form of IP that is usually used to protect your claim
    to an invention. When it comes to business on the Internet it is usually used
    for one of two reasons. Firstly, it is commonly used in conjunction with a copyright
    to protect a new software by excluding others from making, using, selling or importing
    your invention. Secondly, it is used for new online business methods. There are
    four main types of patents: a design patent which affects the inventor’s concept
    such as how a product looks and last for 14 years. A utility patent which refers
    to how a product functions and lasts for 20 years. Software patents (which is
    considered a type of utility patent), which cover how a computer process works.
    Lastly, there are plant patents, which are used if you have a business where you
    work with genetically modified plants, it prevents other companies from creating
    a new species of plant and lasts for 20 years. It’s important to keep in mind
    the type of patent when you are applying to the USPTO to ensure that you are applying
    to the right one or you will be denied. The average cost of a design, utility
    and plant patent are $1,000, $8,500, and $1,000 respectively and that doesn’t
    include insurance, which is an additional $2,500, $12,500, and $2,500 respectively.


    ### Trademark/Service Marks:


    Popularized by companies like Nike with their signature tick and phrase “just
    do it” a trademark is a mark that distinguishes you from other companies and it
    can be a logo, phrase, tune or a symbol. Trademark is used to represent a company’s
    product while a service mark refers to companies that provide services. The benefit
    of registering your mark is that once you become established, other companies
    will not be able to use a similar mark in order to draw from your customer base.
    Also, you don’t want a situation where you’ve been using a mark for some time,
    building your brand and then someone else comes along, trademarks it and now they
    have sole access to a symbol you worked so hard to build up. When making a trademark
    or service mark application here are some things you want to consider:


    - Is my mark too similar to any other businesses?

    - Is my mark provocative or immoral?

    - Does my mark include any government symbols or anything that might be included
    on a national flag?

    - Does your mark include anything that is location based that may not be solely
    applicable to your company?

    - Is your mark misleading for your product or service?


    The laws regarding if you need to register your mark and how to go about it vary
    depending on your country, state, and province. However if you are operating in
    the US, generally it is sufficient to register it online with the United States
    Patent and Trademark Office (USPTO).


    ### Privacy:


    Any online business is required to protect their customers privacy in regards
    to their personal information and online activity when interacting with your website.
    Depending on where you are, the industry you are in and the type of information
    you collect the level of protection required will vary. This is discussed in detail
    in the later chapters.


    ### Trade Secrets:


    A trade secret is any information about a business or business process that would
    give another person or business a competitive advantage. It must be something
    that is not generally known or easily obtainable to the public. Some common examples
    of this are recipes, designs, ideas, algorithms, and formulas. In the event that
    a trade secret is stolen you as the holder are entitled to payments of money and
    getting a court order to prevent the secret from being used. You are required
    to provide the following if you make a claim:


    - That your trade secret meets the definition and qualifies for protection.

    - Prove that you took reasonable care to prevent the secret from being revealed
    to others (such as confidentiality agreements).

    - You need to prove that the accused party has obtained the secret using “improper
    means.”


    ### Employment Contracts:


    Some important aspects you want to include are how employees are to use their
    company e-mail or any other company digital resources. You also want to make sure
    that your non-disclosure and non-compete clauses explicitly mention the Internet.


