    ## Provide Training for Your Employees


    Ninety percent of all cyber attacks are executed with information stolen from
    employees who unwittingly give away their access credentials to hackers. Hackers
    often use a method called spear phishing where they send out fake e-mails, text
    messages or phone calls to trick employees into giving up sensitive information
    that they can use to gain unauthorized access or to get them to unknowingly download
    malware onto company systems. If it is found that a data breach occurred because
