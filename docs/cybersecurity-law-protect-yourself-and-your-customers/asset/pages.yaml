- pgno: 74
  md: 'looking to hire people you want to have an Information Security Lawyer either
    on staff or one that you can call in the event of an emergency. It''s important
    that you have legal counsel that is specialized in dealing with cases regarding
    technology, which can be very difficult to find because many of the devices that
