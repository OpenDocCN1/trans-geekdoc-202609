    +   - Type of risk your company faces

    +   - Reasonable protections available to a company


    # Processing by Third Parties


    The FTC has several rules such as the Safeguards Rule, the Affiliate Sharing RUle
    and Affiliate Marketing Rule, which limit the sharing and use of financial information
