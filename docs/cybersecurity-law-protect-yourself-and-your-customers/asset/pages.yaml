    prepared. Many small business owners feel that their company is too small to be
    known and targeted by attackers but that is not the case. SMBs are one of the
    most preferred targets by hackers because they lack the staff and expertise of
    larger corporations. According to a study by Ponemon Institute’s “2017 State of
    Cybersecurity in Small and Medium-Sized Businesses” report (see Chapter 6 appendix),
    61 percent of SMBs had at least one cyberattack in the last 12 months. One of
    the best ways for a small business to make up for their lack of cybersecurity
    specific staff is to outsource it to a larger, specialized company. For larger
    corporations outsourcing still has many benefits that make it worthwhile. Firstly,
