    # National Regulator for HIPAA


    HIPAA is enforced by the Office of Civil Rights within the Department of Health
    and Human Services. They have the power to initiate an investigation into a covered
    entities information handling practices to determine whether you are complying
    with the HIPAA privacy rule and allows individuals to file complaints about privacy
    violations.


    # HIPAA Sanctions


    HIPAA authorizes civil penalties from US$100 to US$1.5 million depending on the
    following factors:


    +   - Did the operator know the act was a violation

    +   - How quickly was the violation corrected

    +   - Was the operator willfully negligent


    Criminal penalties can be up to US$250,000 and/or up to 10 years in jail if the
    offence was committed under false pretenses or with intent to sell the data for
