- pgno: 35
  md: '# Notification Requirements


    HIPAA requires all entities to provide notice to data owners of your privacy practices
    and of the data owner’s rights under HIPAA. You are also required to notify individuals
    when their unsecured personal health information has been breached.


    # Main Obligations on Data Collectors


    +   - You must use, request and disclose the minimum amount of PHI necessary to
    complete a transaction.

    +   - You should implement data security procedures, protocols and policies at
    administrative, technical, physical and organizational levels to protect customer
    information.


    # Is Consent of Data Subjects Required Before Processing?


    HIPAA requires covered entities to obtain consent in written form from all data
    subjects before disclosing data, with few exceptions such as providing emergency
    medical treatment. Consent consists of acquiring the signature of the data subject
    and the date and should be in writing. The HIPAA Privacy Rule contains specific
    statements that must be included in the consent of data subjects. The notice must
    contain the statement: “THIS NOTICE DESCRIBES HOW MEDICAL INFORMATION ABOUT YOU
    MAY BE USED AND DISCLOSED AND HOW YOU CAN GET ACCESS TO THIS INFORMATION. PLEASE
    REVIEW IT CAREFULLY.” The notice then needs to include:


    +   - The uses and disclosures of PHI that you intend to make

    +   - How a person can access their information

    +   - How to complain about a HIPAA violation

    +   - An effective date


    # Special Rules


    There are specific rules that regulate the disclosure of psychotherapy notes,
    which means notes made by a health care provider, who is a mental'
