  md: '# # CHAPTER 10


    # # Recap and Conclusion


    # ## This Chapter Will Recap the Most Important Elements of the Previous Chapters
    and Highlight Key Takeaways for the Readers


    With the increasing number of cybersecurity threats, there are more risks to data
    breaches then at any point in time. If you are a business that collects significant
    amounts of data from your customers it’s very important that you meet your national,
    state/provincial and industry cybersecurity standards. In most places you will
    be required by law to provide adequate protection of your clients information
    or else you will be liable for any losses to privacy or financial losses that
    your customers suffer as a result of leaked information. In order to meet this
    standard you company will typically be expected to have the following in place:


    +   1. Physical Protection: This includes things like making sure you have locks
    on your doors, security staff. All the necessary tools to secure the companies
    physical location and physical documentation. This is usually one of the more
    neglected areas of information security but many times in the workplace people
    will leave documents on their desk or in unlocked cabinets and that is a security
    risk. If someone has bad intent they can quickly take a picture of the document
    and all of your other security measures have been made meaningless.


    +   2. Organizational Measures: This means having protocols on how employees should
    conduct themselves to reduce the likelihood of security incidents due to negligence.
    This includes have procedures on what information should be collected from customers,
    how'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'the information should be handled, who should have access to the employee information
    and making sure controls are put in place to enforce these boundaries. It''s become
    commonplace in some industries such as financial institutions to implement mandatory
    information security training for their employees, through online modules course
    that they must complete. It''s a cost effective way to provide training and once
    completed you know how proof that they were properly trained, so in the event
    of employee misconduct they can''t claim that they didn''t know what they were
    doing was wrong.


    +   3. Technology Measures: In regards to this, your company should require that
    employee passwords have a certain level of complexity in order to prevent them
    from being easy for a hacker to brute force attack. Typically companies will require
    that the password be at least eight characters long with at least one lower and
    uppercase letter, a number and a special character. Your company computers should
    have an active anti-malware suite running on it and it should have an active encryption
    algorithm on it, if it contains highly sensitive information. This also includes
    encryption of information resting on company assets such as laptops, information
    that is contained on USB''s and e-mails containing highly sensitive information.


    All of these measures are meant to protect lawsuits by proving that you did your
    due diligence to protect your customers information, the three main types of lawsuits
    you need to be concerned about are as follows:


    +   Employee Errors: This is a situation where an employee does something unintentionally
    that results in a breach of privacy of an individual.


    +   Employee Misconduct: This is a situation where an employee intentionally accesses
    information that are not authorized to see. To be safe employees should only be
    given access to information that is essential for them to do their job and nothing
    more, in information security this is covered under the principle of “least privilege.”


    +   Data Breaches: This lawsuits covered situations where information is leaked
    due to malicious activity by an external party. In order to reduce the likelihood
    of being found liable for these breaches'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'it''s very important you meet industry standard with your security measures.


    We discussed the importance of having a cyber security specific insurance as a
    failsafe in case your company does suffer from a data breach and suffers financial
    losses. Many traditional insurance plans will not cover cybersecurity costs, therefore
    it is important that you ensure that your service does or get one that will cover
    you.


    Another contingency plan we discussed offloading the responsibility onto third
    parties. One way you can do this is through cloud solutions, by offloading the
    storage of your data into a cloud solution any data breaches that occur will no
    longer be a liability for you but for your service provider, provided security
    is one of the features they promised you. This is a good alternative if you are
    a small company and don''t want to be burdened with implementing all these different
    cybersecurity measures.


    Lastly, I looked at what type of people you should be looking to hire to ensure
    that you are fully compliant with information security law in your area. When
    hiring you need to make sure your acquire the right talent for your department.
    It should include people with knowledge of the industry, knowledge of the laws
    in your specific geographical area and the areas in which your company operates
    and collects data and lastly you need someone with the technical knowledge to
    understand how your company infrastructure works and what changes you need to
    make to be fully compliant.'
