- pgno: 50
  md: 'are two states of data that you will come across while doing business, data
    at rest and data in transit. Data at rest refers to information that is stored
    by the company on company databases, on company computers and laptops, and so
    on. While data in transit refers to information while it is being sent to and
    from customers over the Internet, for example when a customer makes a payment
    online with their credit card on your website, it’s your responsibility to ensure
    that their information is encrypted throughout the process. The second important
    aspect of encryption is the difference between hash functions and digital signatures.
    Hash functions refer to taking information and scrambling or changing it so that
    it is no longer readable by a person until it is changed back to its original
    form. A digital signature is when the algorithm can encode a document that is
    very difficult to duplicate. It the equivalent of a digital fingerprint ensures
    that when a person signs a document, such as a contract, that the signer is the
    only one associated with that document and records it. Digital signatures use
    a standard format called Public Key Infrastructure (PKI).


    # Types of Encryption


    Individual file and folder encryption: This type of encryption only encrypts specific
    files or folders when the software is directly told to and is best when there
    are only a few files on a computer that need encryption.


    Volume encryption: In this type, all files saved in a certain location will automatically
    be encrypted and is good for medium sized volumes of sensitive information.


    Full disk or whole-disk encryption: This is when all file on a laptop or computer
    are encrypted, in this situation you will need to enter a password or provide
    an encryption key from a USB when powering on the computer in order to unlock
    your files.


