  md: 'available. For the purposes of the GLB act a consumer is defined as someone
    who has obtained a financial product or service but doesn’t have an ongoing relationship,
    while a customer refers to a person who has an ongoing relationship with the institution.


    # What Acts Are Regulated?


    The GLB act regulates the collection, use, sharing and disclosure of non-public
    financial information. Companies are required to implement a security program
    to protect non-public personal information and there are requirements to obtain
    consent before collecting information and providing opportunities to opt-out of
    non-essential information disclosures. Companies are also require to give written
    notice of privacy procedures. The requirements of obtaining consent, giving written
    notice of privacy procedures and providing opt-out opportunities vary depending
    on whether its a consumer or a customer.


    # Jurisdictional Scope


    It applies to financial institutions, affiliated and non-affiliated third parties
    that receive the nonpublic personal information. It also applies to any person
    who obtain or attempt to obtain, or cause or attempt to cause disclosure of that
    non-public personal information.


    # Exemptions


    A company can disclose a consumer’s non-public personal information with an affiliated
    entity, as long as you provide notice. You do not need to obtain consent for the
    disclosure. An affiliated entity is any company that controls, or is controlled
    by or is under common control with another company, they can be non-financial
    institutions.


    A financial institution can disclose a consumer’s non-public information with
    a non-affiliated entity without providing the right to opt out if:


    +   - The disclosure is to a third party that uses information to perform services
