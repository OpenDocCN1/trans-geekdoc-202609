    # Rules that Affect Data Leaving Canada


    PIPEDA dictates that companies are responsible for the information they''ve collected
    even when you transfer it to a third party. PIPEDA requires that you use “contractual
    or other means to provide a comparable level of protection while the information
    is being processed by a third party.” Here is a breakdown of what this regulation
    means:


    +   - **Transfer:** When information is transferred for processing, it must only
    be used for the original purpose of collection (for instance, marketing).

    +   - **Comparable Level of Protection:** The third party processor must provide
    an equivalent level of protection the data would have received if it remained
    with the Canadian company.

    +   - **Transparency:** The organization must be transparent about their practices
    handling personal information. Organizations must tell customers that their data
    is sent elsewhere for processing, and state that personal information sent to
    another jurisdiction may still be accessed by Canadian law enforcement, courts,
    or national security personnel.


    # Rules Around Data Storage and Transfers


    As I mentioned previously even after transferring personal information outside
    of your jurisdiction, your company remains accountable for the information even
    after a third party takes possession of it and starts processing it. Your primary
    means for protecting yourself from liability once'
