- pgno: 81
  md: '# CHAPTER 9


    # Interacting with Law Enforcement


    # What Rights Do Government Officials Have When It Comes to Accessing a Companies
    Data on Clients/Customers? When Do You Have the Right to Say No to an Investigator?


    With the growing reliance on electronic devices such as smartphones and laptops,
    they now play a major part in criminal investigations. In 2016 there was a huge
    debate over whether Apple should comply with a US court order to hack into one
    of their iPhone''s to help with the investigation of the San Bernardino Shooters.
    On one hand it could be viewed as a violation of people''s privacy to release
    data that the company has agreed to keep confidential, between the customer and
    the company holding the data. However, businesses are also legally obligated to
    obey with court orders, so it can be quite a grey area and a difficult decision
    to make.


    # Legal Situations in Canada


    In June of 2014 the Supreme Court of Canada ruled “police need a search warrant
    to get information from Internet service providers (ISPs) about their subscribers’
    identities when they are under investigation.” According to this ruling a warrant
    is required by law enforcement except for the following circumstances:'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   1. If there is a reasonable law authorizing access.

    +   2. If there are urgent circumstances, where the information required may prevent
    immediate bodily harm.

    +   3. If the information being sought does not raise a reasonable expectation
    of privacy.


    In a separate ruling in December 2014, the Supreme Court of Canada then said that
    police may conduct a limited search of suspect’s cellphone without a warrant,
    but they must follow certain rules and the search must be directly related to
    the circumstances of a person’s arrest and the police officers must keep a detailed
    record of the search. The rules are as follows: Bogart (2016).


    +   1. The arrest must be lawful—This is the case for any situation; it just means
    if the arrest isn’t lawful, then neither is the search.

    +   2. The search must be incidental to the arrest and police need an “objectively
    reasonable” reason to conduct the search. These include: protecting police/the
    accused/the public; preserving evidence; discovering evidence such as finding
    more suspects.

    +   3. The nature and extent of the search are tailored to the purpose of the
    search. This means police activity on the phone must be directly linked to the
    purpose they give.

    +   4. Police must take detailed notes of what they looked at on the device as
    well as how it was searched (for example, which applications or programs they
    looked at, the extent of search, the time of search, its purpose and duration).


    For law enforcement officials to proceed without a warrant they would need one
    of three purposes: protecting police or the public, preserving evidence or discovering
    evidence. According to this ruling, whether or not the phone is password-protected
    is not a determining factor, a suspect is within their right to remain silent
    and not unlock their phone, however police are also within their rights to confiscate
    the phone and attempt to unlock it. Furthermore, in a statement to Global News
    a spokesperson for the Department of Justice Canada made a comment on some of
    the rights of a police officers during investigations'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The Criminal Code provides a wide range of judicially authorized powers that
    police can use to carry out investigations. These powers range from wiretap authorizations,
    which allow the interception of private communications, to search warrants, which
    allow the search of property including computers and smartphones and general production
    orders, which compel the production of personal information by third parties.


    However, according to the statement before police can resort to these tools they
    must convince a judge that there are reasonable grounds to believe an offence
    has been or will be committed and that these actions will produce evidence. The
    representative went on to say:


    > “Further, a wiretap authorization, a search warrant and a general warrant can
    also be accompanied by an assistance order issued by a court, which compels a
    third party to provide assistance where that assistance may reasonably be considered
    as required to give effect to the authorization or warrant.” “However, there is
    no specific power in the Criminal Code to compel a third party to decrypt or develop
    decryption tools, nor is there any requirement for telecommunications services
    to provide these services.”


    # Legal Situations in the United States


    The fourth Amendment of the U.S Constitution protects its citizens from unreasonable
    government searches and seizures and this protection extends to information held
    on computers and other electronic devices. The fourth Amendment applies across
    the entire country and in some states they have additional state laws that put
    further requirements on law enforcement that they must fulfill before have the
    right to an individual’s information. In order for law enforcement to require
    access to customer information or to perform functions of an investigation such
    as wiretaps they will need a legal court order to do so. However, it’s important
    to note that depending on where the data is stored affects whether or not the
    court order has jurisdiction. For example in a court case between Microsoft and
    the U.S government, Microsoft refused to comply with a warrant for e-mails on
    a drug trafficking suspect because the servers'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'with the information where stored in Dublin, the capital of Ireland and therefore
    they would need an Irish court order in order to legally access the information.


    # # The California Electronic Communications Privacy Act


    This law prohibits any state law enforcement agency from taking user data from
    a company without first obtaining a warrant from a judge. This includes private
    user data such as e-mails, digital documents like word and pdf documents, text
    messages and location information stored on electronic devices. In the past law
    enforcement agencies could request user data from tech companies without having
    a warrant and naturally people would feel pressured into complaining out of fear
    of getting into trouble with law enforcement. This may seem like a foreign concept,
    something that wouldn''t happen very often but according to the authors of this
    bill state Sens. Mark Leno and Joel Anderson AT&T received over 64,000 requests
    for location information in 2014, Verizon received over 15,000 requests for location
    data in the first half of 2014 with only a third coming with a warrant. In twitter''s
    transparency (https://transparency.twitter.com) report they stated that they received
    4,363 government data requests in the first half of 2015 and complied 80 percent
    of the time. With the increase in digital communication since 2015 and all indicators
    suggest it will only increase, it''s important to know that you are legally obligated
    not to give out information on California residents without a warrant. The exceptions
    to this rule is if the owner of a device gives a government entity permission
    to access his data or if a government entity believes a device has been lost or
    stolen they can access it in an attempt to identify the owner and return it to
    them. There is also an emergency provision, if a government entity believes that
    “an emergency involving danger of death or serious physical injury to any person
    requires access to the electronic device information” then they can access the
    information without having a government warrant. However, the agency will be required
    to file for a warrant within three days of obtaining data. There are similar data
    privacy protections in Maine and Utah.'
  merge: -1
  img_proc: true
