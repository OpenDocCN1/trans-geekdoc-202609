  md: '# # Rules if Your Business Operates Within the United States


    The United States doesn’t have a single comprehensive federal law for regulating
    the collection and use of personal information, the laws that govern business
    activities are a mix of various state and federal legislation. In addition to
    these they are guidelines develop by government agencies and industry specific
    standards that aren’t necessarily force of the law but make up what are considered
    best practices, which are standards that companies are expected to meet. These
    guidelines can be used by enforcement agencies and regulators in evaluating your
    business in the event of a data breach. Here are some of the most important legislation
    to be aware of “(Jolly, L. 2017, July 1”): Please note* for simplicity the format
    used was based off of the original content but content of the heading themselves
    are my own original words.


    The Federal Trade Commission Act (FTC Act): Is a federal consumer protection law
    that protects against unfair or deceptive practices related to privacy and data
    security policies that don’t protect consumer’s personal information.


    # ## To Whom Does It Apply?


    The FTC act applies to most companies doing business in the US with the exception
    of certain transportation, telecommunications and financial companies because
    they are primarily regulated by other national agencies.


    # ## What Data Is Regulated?


    The FTC act doesn’t regulate a specific type of information, it prohibits unfair
    and deceptive practices put consumer personal information at risk.


    # ## What Acts Are Regulated?


    The FTC has been used to charge companies that:


    +   - Failed to adequately protect consumer personal data, leaving it open to
    cyberattacks.'
  merge: -1
