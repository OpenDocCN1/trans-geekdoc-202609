  md: '# CHAPTER 1


    # Introduction to Information Security Law


    # This Will Explain the Current Laws Around Information Security that Businesses
    Need to Be Aware of


    One of the most important responsibilities of a business is to protect the sensitive
    information of their customers. While conducting business you will gather all
    sorts of personal information such as credit card numbers, home addresses, phone
    numbers, bank account information and much more. Not only do you have a moral
    obligation to properly protect this information but as a business you also have
    several legal obligations to your customers and if this obligations are not met
    you can face severe financial repercussions. In this book I will breaking down
    the current legal risks that management needs to be aware of to avoid being found
    legally liable if any data breaches do occur. Firstly, I''ll give some context
    on why you need to be concerned about data breaches. In 2015, the total amount
    of digital assets stolen via Cybercrime was estimated to be about $3 trillion
    USD and is expected to grow $6 trillion USD, which is more than the sale of all
    major illegal drugs combined. Most people tend to think that most of this money
    is made by e-transferring money to foreign bank accounts or something of that
    nature, while a fair amount of that does happen a much larger amount of that $6
    trillion is made using information that is stolen “Morgan (January 23, 2018).”
    “Top five cybersecurity facts, figures and statistics for 2018.” When cyber criminals
    break into a company’s network they looking for any information that can be leveraged,
    things like credit card numbers,'
  merge: -1
  img_proc: true
- pgno: 14
  md: "phone numbers, usernames and passwords, first and last names, and so on. From\
    \ there the hackers can use this information in a couple of ways to make a profit:\n\
    \n+   1. Offload cards: any financial information like credit card numbers or\
    \ usernames and passwords to bank accounts can be used to directly commit financial\
    \ fraud and rob your customers of their money.\n+   \n+   2. Sell customer information:\
    \ They can sell this personal information to other people who will use it to commit\
    \ financial fraud or use their contact information to try to scam the individual\
    \ by impersonating an entity they trust like a bank for example. A full set of\
    \ someone’s personal information can sell from anywhere between $1 to $450, with\
    \ the median price being $21.35 “Collins (September 15, 2015).” “Here’s what your\
    \ stolen identity goes for on the Internet’s black market.”\n+   \n+   3. Thirdly,\
    \ they can hijack that person’s account using the username and password they found,\
    \ and usually because people tend to use similar passwords across accounts they\
    \ can then go and compromise other accounts that individual has on different platforms.\
    \ In 2012 dropbox was breached by someone that used login information they obtained\
    \ from a linkedin data breach that occurred earlier that year.\n\nThese are just\
    \ a few of the potential ways that information can be used once it has been stolen\
    \ from your company. This is where the legal aspect comes in, if your company\
    \ is found to be negligent in your handling of your customers personal information\
    \ and that data is stolen and used in a way that causes harm to the customer,\
    \ you could be found liable and incur even more costs in settling lawsuits. Due\
    \ to the increase in cybercrime activity in the last decade, governments have\
    \ begun to implement more cybersecurity legislation demanding the businesses implement\
    \ specific types of security practices. In the United States in 2017 alone, 42\
    \ states combined to pass more than 240 bills related to cybersecurity “Cybersecurity\
    \ Legislation 2017 - Legislative News, Studies ... (December/January, 2017).”\
    \ I’ll use two of these as examples of what a company needs to be cautious of:"
  merge: -1
  img_proc: true
- pgno: 15
  md: 'H.B. 180 enacted in Delaware: Amends Chapter 12B of Title 6 to update Delaware’s
    law regarding computer security breaches by doing the following; creates a requirement
    that any person who conducts business in Delaware and maintains personal information
    must safeguard that information; updates the definition of breach of security
    by including the unauthorized access, use, modification, or disclosure of personal
    information and the information that is included in the definition of personal
    information.


    H.B. 2371 enacted in Illinois: Amends the Data Security on state Computers Act,
    requires certain state employees to annually undergo training by the Department
    of Innovation and Technology concerning cybersecurity, allows the department to
    make the training an online course, requires the training to include detecting
    phishing scams, preventing spyware infections and identity theft, and preventing
    and responding to data breaches, allows the department to adopt rules to implement
    the program.


    I chose these two examples because they illustrate two of the key things that
    a company needs to beware of when it comes to avoiding cybersecurity related lawsuits,
    which I will go into more depth later on. The first is it is your responsibility
    to safeguard any information that your company collects. This includes things
    like making sure your data has some form of encryption, ensuring only the necessary
    employees have access to certain information, collecting non-essential information
    from customers, collecting information without making it explicitly clear to your
    clients, and so on.


    The second portion has to do with your employees, about 50 percent of all cybersecurity
    breaches occur as a result of human error. The human element of our business is
    just as likely, if not more likely to cause you security issues than any of your
    computer systems themselves. Therefore, it is very important that you provide
    your employees with the proper training when it comes to dealing with sensitive
    information. Some examples would include how to properly dispose of paperwork,
    how to recognize fake e-mails (phishing campaigns), how to securely use remote
    access and much more. If a data breach occurs as a result of employee negligence
    and the employee was not properly trained, the liability for any damages the customer
    incurs usually falls on the shoulders of the company and that’s not a situation
    you want to be in.'
  merge: -1
  img_proc: true
