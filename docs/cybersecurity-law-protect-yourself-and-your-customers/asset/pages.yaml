  md: '# Chapter 9—How to Automate Cybersecurity Compliance


    This chapter will discuss options for making your companies IT compliance more
    efficient. There are two main areas of compliance that companies needs to worry
    about. The first is internal compliance, this refers to making sure that the procedures
    outlined by management is followed all of the employees within the company. Many
    times employees may not understand why management mandates that things be down
    a certain way and are tempted to not adhere to the rules for convenience or some
    other perceived benefit. One unfortunately common example is that many people
    still use company computers to visit pornographic websites, which not only is
    time wasting from a management perspective but searching untrusted websites like
    this also opens up the company to being exposed to potentially dangerous malware
    and is a security risk. From a legal point of view this type of compliance is
    less important because even though it is serious someone does break the rules
    and opens you up to a security risk, your company is typically not going to suffer
    a lawsuit as a result of this because it is an internal rule governed and enforced
    by your company itself. The more serious of the two is external compliance, which
    refers to adhering to rules laid out for your company by an external regulatory
    entity such as the government. External compliance can be quite tricky for a couple
    of reasons. Firstly, companies are not always fully aware of the rules within
    the industry or location and it''s very difficult for you to ensure you are in
    compliance if you are not aware of what is required on your part. There are new
    laws being put in place almost every year regarding data privacy and staying on
    top of that it is a very difficult task. This is the first reason you should look
    into of using an automated tool to help your IT team stay ahead of what is required
    by your company. Secondly, external requirements can demand significantly more
    work by your company. Government rules can require things such as e-mail retention,
    installation of supervisory controls, hidden back doors for law enforcement, mandatory
    data breach notifications to all customers and more. Staying on top of the different
    laws is difficult enough for many companies that are more focused on developing
    their product and acquiring customers'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'but you also need to know what each of these laws requires of you on a practical
    level to ensure that you are compliant. Unfortunately many cybersecurity laws
    tend to use somewhat vague language that makes it difficult for you to pinpoint
    exactly what needs to be done. Some of laws I mentioned earlier used to terms
    such as “reasonable” information security practices, which is not very specific.
    You want a solution that can help you clearly identify what is required from your
    end. Lastly, you want a service provider that can help you determine what the
    financial implications of non-compliance would be. At the end of the day the main
    purpose of being complaint to external entities is usually more about avoiding
    lawsuits and fees than just compliant for compliance sake. Therefore, getting
    a solution that can you help you do a cost benefit analysis of the potential dangers
    of being found in non-compliance with an external compliance is invaluable in
    ensuring that your business is as profitable as possible. Before I talk about
    potential solutions to IT compliance I want to highlight some of the most difficult
    areas for IT compliance and what makes them so difficult. As I discuss potential
    solutions I will look at how this solution could help you manage these areas of
    your IT infrastructure:


    +   - Bring your own devices (BYOD)—This refers to personal mobile devices like
    smartphones and tablets, because these devices are not owned and configured by
    your company itself they bring along with them unique security vulnerabilities.
    Even though they are not owned by your company, if one of your company’s employees
    bring a device into your environment that doesn’t comply with external security
    requirements and a data breach occurs, you will still be considered liable for
    that security incident. (Google Mobile Device Management, (Schiff 2018).

    +   - Patch Management—Another important area of compliance is patch management,
    which can be a huge source of security vulnerabilities. Rami Sass, co-founder
    of WhiteSource Software stated that “In 2017, the number of third-party vulnerabilities
    discovered in commercial and open source software more than doubled, requiring
    CIOs to ensure that'
  merge: -1
