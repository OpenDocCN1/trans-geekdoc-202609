    # Enforcement and Sanctions


    The FTC is the primary US enforcer of national privacy laws, including the FTC
    act and penalties for breaking this act can be up to US$16,000 for each offence.
    In 2006, a data broker agreed to pay US$15 million to settle charges by the FTC
    for inadequate protection of data. Criminal penalties include imprisonment for
    up to 10 years. Settling with government agencies can also include reporting requirements
    such as agreeing to audits and being monitored by third-parties. There have been
    cases where the audit of a guilty party’s data security system lasted for 20 years.


    **The Financial Services Modernization Act/Gramm-Leach-Bile Act (GLB):** This
    act regulates the collection, use and disclosure of financial information. It
    affects all businesses that provide financial services and products such as banks,
    securities firms and insurance companies. It limits the disclosure of non-public
    personal information and in some situations require that the company provide notice
    of their privacy practices and give their customers the option of opting out of
    having their information shared.


    # To Whom Does It Apply?


    It applies to financial institutions, which are defined by the FTC as businesses
    significantly engaged in financial activities. It also applies to third parties
    that are not financial institutions but receive personal information from financial
    institutions.


    # What Data Is Regulated?


    Non-public personal information collected by a financial institution that is provided
    by, results from or otherwise obtained in connection with consumers or customers
    who obtain financial products or services primarily for personal, family or household
    purposes from a financial institution. Non-public information applies to information
    that is capable of personally identifying a consumer or customer and is not publicly'
