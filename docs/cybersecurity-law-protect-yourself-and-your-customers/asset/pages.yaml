  md: '# CHAPTER 8


    # What Type of People and Policies Should You Have to Ensure You Are Complying
    with Regulations


    This Chapter Will Talk About the Type of Experience You Want to Look for When
    Hiring an Employee into Your Cybersecurity Department to Ensure that They Will
    Be Mindful of the Legal Implications Your Company Will Be Facing


    This chapter will apply to businesses that are looking to have their own internal
    legal teams to make sure that your business is compliant with all legal requirements.
    Firstly, I''ll talk some policy practices to help ensure that your company will
    operate under their intended guidelines.


    # Establish an Information Security Policy (ISP)


    An Information Security Policy (ISP) is a set of rules outlined by an organization
    to ensure that all the employees, contracts and third-party entities that work
    with your companies information will be expected to abide by. The purpose of creating
    this outline is to create a companywide approach to information security and ensure
    that all of your workers act'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'in a way that will protect your companies information and make sure that your
    company is not breaking any laws.


    # # Identify Your Companies Data and Systems


    Your ISP should address all of the data, systems, facilities and users of information
    in your company identifying all of these identities is first step in creating
    an ISP. You need to know what information your company collects, where it is stored
    and who is handling that information within your organization. Start this by classifying
    you data because not all company information needs to be handled with as much
    care. By classifying your data, it helps you ensure that all of the information
    you have in your company has the appropriate type of security measures in place.
    There are typically four classifications of data within a company:


    **Public Information:** This information can be distributed freely and doesn''t
    need much policy around its handling and use. It''s information can be freely
    distributed with no adverse effects because it is produced for public consumption.
    For example news releases and job announcements.


    **Business use only Information:** This is information that is used in business
    processes and is unauthorized disclosure, modification or destruction is not expected
    to cause any serious problems for the organization, customers or partners. Some
    examples of this is internal policy manuals or company phone lists. For this level
    of information you will want to have moderate guidelines and policy in place but
    most of the Cybersecurity Legislations will not regulate this type of information.


    **Confidential Information:** This is information that is used in sensitive business
    processes and its unauthorized disclosure, modification or destruction will have
    adverse effects to the company, its customers and/or its business partners. This
    includes information such as personally identifiable information, payment card
    information, protected health data, and bank account information. For this type
    of information and further you want to make sure you have very detailed policies
    regulating how this information is handled throughout your company. The information'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'found in this category has significant regulation around it and those requirements
    need to be outlined and use in the creation of your company''s security policies.


    **Restricted/Secret Information:** This classification is the highest level of
    confidentiality and refers to extremely sensitive information used in business
    processes and its disclosure, modification or destruction will have serious consequences
    for the organization, its customers or its business partners. Some examples of
    this type of information would be medical records relating to mental health or
    sexually transmitted diseases and organizational information such as documents
    about mergers and strategic plans. Is this type of information is leaked there
    is going to huge financial and legal implications.


    Once you have identified what type of information you are caring, the next step
    will be to ensure that all information is being handled with security measurements
    appropriate to their risk level. There are two main components to this, firstly
    you want to make sure you are aware of the legal requirements your company needs
    to do to be compliant. Secondly, you want to make sure that you have security
    measures in place that will protect the information from people who will try to
    steal it. As previously mentioned there is an interesting statistic found by UPS
    capital that found that 55 percent of small businesses reported at least one data
    breach per year and 60 percent of those small businesses would be out of business
    within six months. You want to do your best to ensure that information of the
    confidential or restricted level have strict policies on how they are to handled
    by workers within your organization. Most users do not know or frankly care that
    much about cybersecurity, about 50 percent of cybersecurity incidents can be attributed
    to user error. One of the most important ways to prevent this is to have strict
    rules on confidentiality, this means making rules that dictate exactly who in
    an organization is authorized to view, edit and destroy certain types of information.
    One of the best ways to prevent data leakages are to ensure that the information
    is known to as few people as possible and is stored on as few systems as possible.
    Information should only be accessible to people who only need it for their job
    functions and no one else, there should also be penalties in place for someone
    who shares information that is confidential to someone'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'who is not suppose to have access to it. For those who do have access to information
    they should not have full discretion for what or how they use the information.
    There need to be parameters put on how information is to be used in this company
    so that everyone knows what is expected of them and how to do their daily processes
    in a secure way. Once you have established documentation on how each of the major
    processes of your business should be carried out, it makes it much easier to evaluate
    the processes to see how secure and effective they are and make improvements.
    With new regulations being introduced on a regular basis it’s important to be
    able to not only make changes to your business processes but also be able to prove
    that you had the right security measures in place in the event that there is a
    breach and you are being audited by an external body. This framework will be utilized
    by:


    +   - Internal auditors

    +   - External auditors

    +   - Third parties

    +   - Employees


    When creating an ISP you need to make sure that the policy is put into very simple
    and concise language to ensure that it is understood by everyone. Avoid ambiguous
    terms that could to misinterpretations and be sure that you know the exact meaning
    of the words you are using. For example I would suggest using terms like “must”
    or “need” rather than using terms like “should” or “its recommended,” if something
    is to be done make sure that is plainly stated in the policies.


    However, usually all the rules don’t apply to all members of staff equally. In
    most ISPs more authority and flexibility are given to management and senior management
    to use their discretion in deciding who they share data with within the company.
    This is rightfully so because often times business situations are dynamic and
    you need to be able to act accordingly, but you should also capture this in your
    ISP. You can put in the policy what rules can be overruled by certain levels of
