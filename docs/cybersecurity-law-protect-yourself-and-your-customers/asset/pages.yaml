  md: '# CHAPTER 4


    # What Are the Financial and Reputational Implications of Information Security
    Legislation


    # What Types of Lawsuits Can Be Brought Against a Company that Doesn''t Comply
    with the Current Information Security Laws and How Costly Are They?


    If your company is found in a breach of any of the legislation I outlined in Chapter
    2 you will be at risk of a potential lawsuit. This chapter I''m going to discuss
    the different types of lawsuits that your company would be facing and what the
    financial implications this would mean for your company. In Canada, class action
    lawsuits tend to fall into three categories: (1) Employee errors (2) Employee
    misconduct, and (3) data breaches.


    **Employee Errors**: This is a situation where an employee does something unintentionally
    that results in a breach of privacy of an individual. For example an employee
    loses a unprotected flash drive that contains the information of customers.


    **Employee Misconduct**: This is a situation where an employee intentionally accesses
    information that are not authorized to see. It''s important to note that just
    because someone is an employee of a company, doesn''t'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'mean they should have access to all of the information the company possesses.
    To be safe employees should only be given access to information that is essential
    for them to do their job and nothing more, in information security this is covered
    under the principle of “least privilege.”


    **Data Breaches:** This lawsuits covered situations where information is leaked
    due to malicious activity by an external party. This would be situations where
    a hacker breaks into a computer network a steals usernames and passwords, credit
    card information, and so on. In order to reduce the likelihood of being found
    liable for these breaches it’s very important you meet industry standard with
    your security measures. These lawsuits tend to have the largest financial burden
    on a company, for example, $760 million USD with Ashley Madison and $550 million
    to Equifax. Plaintiff’s tend to agree things such as breach of contract, breach
    of consumer protection legislation, negligence, intrusion upon seclusion, breach
    of privacy and publicity given to private life.


    # Cybersecurity Laws in the United States


    # Federal Laws


    1996 Health Insurance Portability and Accountability Act (HIPAA): This is US federal
    law meant to protect health care patients privacy. It only affects certain members
    of the health industry such as health care providers, health insurers, and health
    exchange organizations. HIPAA covers all personally identifiable information that
    is created or received by the organizations. In addition to HIPAA, health information
    is also governed by state laws.


    1999 Gramm-Leach-Bliley Act: This act requires financial institutions, which is
    defined as companies that offer consumer financial products or services such as
    loans, financial/investment advice or insurance to explain their information sharing
    practices to customers and to safeguard the customers data. Gramm-Leach-Bliley
    Act (n.d.).


    2002 Homeland Security Act, which included the Federal Information Security Management
    Act (FISMA): FISMA is a framework that gives guidelines on how to protect government
    information, assets and'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'operations against natural and manmade threats. It requires program officials
    and the head of each agency to conduct annual reviews of information security
    programs with the intent of keeping risks at or below acceptable levels.


    The National Institute of Standards and Technology (NIST) outlines nine steps
    toward compliance with FISMA:


    +   1. Categorize the information to be protected.

    +   2. Select minimum baseline controls.

    +   3. Refine controls using a risk assessment procedure.

    +   4. Document the controls in the system security plan.

    +   5. Implement security controls in appropriate information systems.

    +   6. Assess the effectiveness of the security controls once they have been implemented.

    +   7. Determine agency-level risk to the mission or business case.

    +   8. Authorize the information system for processing.

    +   9. Monitor the security controls on a continuous basis.


    These three laws together mandate that Healthcare Organizations, Financial Institutions,
    and Federal Agencies must protect their systems and information with a “reasonable”
    level of security.


    Federal Exchange Data Breach Notification Act of 2015: This bill requires a health
    insurance exchange to notify each individual whose personal information is known
    to have been acquired or accessed as a result of a breach of security of any system
    maintained by the exchange as soon as possible but not later than 60 days after
    discovery of the breach.


    # State Laws


    California implemented a law in 2003 called the Notice of Security Breach act
    that required any company that maintains personal information of California citizens
    to notify them in the event of a breach. Since then several other states have
    implemented similar laws, so if you are conducting business in the United States
    be aware that in the event of cyber-security incident, you are expected to notify
    those that have been affected.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'The New York State Department of Financial Services (DFS) passed the New York
    Cyber Security Regulation on March 1st 2017, this requires that all affected companies
    must submit a yearly Certification of Compliance with the New York State Department
    of Financial Services Cybersecurity Regulations starting February 15, 2018.


    # What Are the Technology Requirements You Need to Reduce the Risk of Legal Liability?


    Here are some the best practices that your company can implement to make sure
    that you meet the standard of “reasonable information security,” this list consists
    of 20 controls defined by the Center for Internet Security’s Critical Security
    Controls (CIS Controls™ (n.d.). Retrieved from https://cisecurity.org/controls/)
    which the California Attorney General Otto and Kennedy (2016). “Reasonable Security”
    Becomes Reasonably Clear to the California Attorney General stated represented
    “the minimum level of information security”:


    +   1. Inventory of Authorized and Unauthorized Devices

    +   2. Inventory of Authorized and Unauthorized Software

    +   3. Security Configurations for Hardware and Software on Mobile Devices, Laptops,
    Workstations, and Servers

    +   4. Continuous Vulnerability Assessment and Remediation

    +   5. Controlled Use of Administrative Privileges

    +   6. Maintenance, Monitoring, and Analysis of Audit Logs

    +   7. Email and Web Browsing Protection

    +   8. Malware Defenses

    +   9. Limitation and Control of Network Ports, Protocols, and Services

    +   10. Data Recovery Capability

    +   11. Secure Configurations for Network Devices such as Firewalls, Routers,
    and Switches

    +   12. Boundary Defense

    +   13. Data Protection

    +   14. Controlled Access Based on the Need to Know

    +   15. Wireless Access Control

    +   16. Account Monitoring and Control'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   17. Security Skills Assessment and Appropriate Training to Fill Gaps

    +   18. Application Software Security

    +   19. Incident Response and Management

    +   20. Penetration Tests and Red Team Exercises


    Additional Recommendations Otto and Kennedy (2016).


    In addition to these the California Attorney General also stated that usernames
    and passwords alone were not sufficient to protect a user’s personal information.
    It was recommended that organizations make multi-factor authentication available
    for consumer-facing online accounts. Multi-factor authentication means that in
    addition to requiring users to provide something that they know (like a username
    or password) they must also provide something they have (like a onetime code that
    is generated and sent via text after the username and password are provided) or
    something they are (like a fingerprint or retina scan). By doing so it becomes
    significantly harder for a hacker to compromise the account. Some popular websites
    that offer this solution are Linkedin and Wordpress.


    It is also strongly encouraged that organizations use strong encryption practices
    for personal information on company laptops and other portables devices like phones
    and USB. You should also consider using full disk encryption on systems that are
    not in use. Theft or loss of unencrypted data on electronic devices in one of
    the most common types of data breaches and strong encryption can negate it for
    the most part. In Chapter 4, we will discuss in more detail the different types
    of encryption options you have.


    Encouraging affected customers the option of placing a fraud alert on their credit
    files can help to reduce the impact of a data breach and give customers reassurance
    that you are doing all that you can help protect them. A credit alert informs
    merchants that there may be fraud with this account and prompts them to request
    additional verification for that person’s identity, often times this feature can
    be added free of charge.


