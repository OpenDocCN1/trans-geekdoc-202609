  md: '+   - Changed their consumer privacy policies without providing reasonable
    notice to consumers.

    +   - Failed to adhere to their posted privacy policies.


    # Jurisdictional Scope


    It applies to companies and individuals who are doing business in the United States.


    # Exemptions


    You can be exempt from the privacy rules and guidelines of the FTC for law enforcement
    purposes (provided they have a court order/warrant).


    # Notification Requirements


    The FTC doesn''t have any requirements, but it suggests that website operators
    disclose their data collection practices related to behavioral advertising, provide
    consumers with an option to opt out of these practices and properly notify consumers
    that they can opt out of these practices.


    # Main Obligations on Data Collectors


    +   - Ensure that you comply with your privacy policies.

    +   - When you retroactively change a privacy policy, you must give data subjects
    the opportunity to opt out of a new privacy practice.


    Violating the FTC has resulted in lawsuits of up to $100 million, which occurred
    in a penalty against LifeLock in 2010 for failing to secure customer''s personal
    data.


    The FTC suggest that website operators gets express consent (can be online) for
    sensitive data, which includes:


    +   - Financial data

    +   - Data about children'
