    # The Health Insurance Portability and Accountability Act (HIPAA):


    This act regulates medical information.


    # To Whom Does It Apply?


    It applies to health care provider, data processors, pharmacies and any other
    entities that come into contact with medical information. It also applies to business
    associates, which is a person or entity that performs certain functions or activities
    that involve the use or disclosure of personal health information (PHI) on behalf
    of, or provides services to, a covered entity. Some common examples of this are
    data analysis and processing, quality assurance and billing.


    # What Data Is Regulated?


    HIPAA regulations PHI, which is individually identifiable health and medical information
    that is maintained or transmitted by a covered entity or its business associate.


    # What Acts Are Regulated?


    HIPAA regulates the use and disclosure of PHI and the collection, use, maintenance
    or transmission of electronic PHI. HIPAA also requires that you make customers
    aware of your privacy practices.


    # Jurisdictional Scope


    HIPAA covers all entities defined in the (to whom does it apply) section, over
    which the US Government has enforcement authority, additionally business associates
    of covered entities may have contractual obligations to protect PHI, even those
    operating outside of US jurisdiction.


    # Exemptions


    HIPAA does not apply to health information that is not personally identifiable.'
