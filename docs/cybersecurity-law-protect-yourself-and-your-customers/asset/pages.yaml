    Lastly, two important privacy related torts that your company needs to be aware
    of when collecting information from your customers. In 2012, the Ontario Court
    of Appeal recognized the tort of “ intrusion upon seclusion.” “One who intentionally
    [or recklessly] intrudes, physically or otherwise, upon the seclusion of another
    or his [or her] private affairs or concerns, is subject to liability to the other
    for invasion of his privacy, if the invasion would be highly offensive to a reasonable
    person.” This tort makes companies liable for collecting personal information
    without making it explicitly clear to the individual and first getting permission,
    otherwise it is seen as an invasion of privacy and a lawsuit can be filled.


    The second tort your company needs to be aware of was introduced in February 2016
    Jane Doe 464533 v ND: One who gives publicity to a matter concerning the private
    life of another is subject to liability to the other for invasion of the other’s
    privacy, if the matter publicized or the act of the publication (a) would be highly
    offensive to a reasonable person, and (b) is not of legitimate concern to the
    public. This law’s main purpose is to hold people accountable for cyberbullying
    but it can affect companies if your employees are not careful about releasing
