    notes, even for the purposes of treatment.


    # Rights of the Data Subject


    Under HIPAA, the Data Subject has the right to request access to their information,
    make corrections to their own PHI and can request an account the manner in which
    his PHI has been used and disclosed.


    # Security Requirements


    The HIPAA requires covered entities to:


    +   - Use and disclose the minimum amount of PHI necessary to complete a transaction.

    +   - Implement data security procedures and policies to protect data.

    +   - Comply with certain standards established for electronic transactions.


    There is a separate HIPAA guide for the Remote Use of and Access to Electronic
    Protected Health Information which outlines the risks for storing, accessing and
    transferring of medial data on laptops, wireless devices, home computers, flash
    drives, e-mail and public workstations.


    # Third Party Processing Requirements


    HIPAA allows for regulated entities to disclose PHI to business associates if
    you enter into an agreement that your requires your associates to use the information
