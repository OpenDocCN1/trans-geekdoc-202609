  md: '# THE BUSINESS EXPERT PRESS DIGITAL LIBRARIES


    # EBOOKS FOR BUSINESS STUDENTS


    Curriculum-oriented, born-digital books for advanced business students, written
    by academic thought leaders who translate real-world business experience into
    course readings and reference materials for students expecting to tackle management
    and leadership challenges during their professional careers.


    # POLICIES BUILT BY LIBRARIANS


    +   - Unlimited simultaneous usage

    +   - Unrestricted downloading and printing

    +   - Perpetual access for a one-time fee

    +   - No platform or maintenance fees

    +   - Free MARC records

    +   - No license to execute


    The Digital Libraries are a comprehensive, cost-effective way to deliver practical
    treatments of important business issues to every student and faculty member.


    For further information, a free trial, or to order, contact: sales@businessexpertpress.com
    www.businessexpertpress.com/librarians


    # Cybersecurity Law


    # Protect Yourself and Your Customers


    # Shimon Brathwaite


    This book gives insight into the legal aspects of data ownership in the 21st century.
    With the amount of information being produced and collected growing at an ever
    accelerating rate, governments are implementing laws to regulate the use of this
    information by corporations. Companies are more likely than ever to face heavy
    lawsuits and sanctions for any misuse of information, which includes data breaches
    caused by cybercriminals.


    This book serves as a guide to all companies that collect customer information,
    by giving instructions on how to avoid making these costly mistakes and to ensure
    they are not liable in the event of stolen information.


    Shimon Brathwaite, is a graduate of Ryerson University''s business technology
    management program who specializes in cyber security. He is cyber threat intelligence
    specialist that has worked with multiple financial institutions. He works as a
    freelance writer on information technology for bussinessnewsdaily.com, an author
    at ThreatTracer.ca and a published author with Business Expert Press with books
    on information security law and cyber threat intelligence. During his time at
    Ryerson University he accumulated three years of experience in information technology
    and worked in cybersecurity in the areas of cyber threat intelligence and access
    management at CIBC, TD and Scotiabank. He then founded ThreatTracer, a cyber threat
    intelligence company in Ryerson''s digital media zone, the number one ranked business
    incubator in Canada. ThreatTracer is a cyber threat intelligence service provider
    for small to medium sized businesses looking for a proactive cyber-security solution
    to improve their security posture.


    # BUSINESS LAW AND CORPORATE RISK MANAGEMENT COLLECTION


    John Wood, Editor


