- pgno: 64
  md: '# What Are the Types of Coverage


    Cybersecurity insurance comes in two forms, first party and third party.


    # First Party Cybersecurity Insurance


    This is the type of coverage that you will need to file a claim if your business
    experiences a data breach. Any company that holds customer data can benefit from
    the protection of first-party cybersecurity insurance. For most non-IT firms,
    first part insurance will enough to cover you for the risks you will be facing.
    The benefits of first party insurance include getting compensated for:


    +   - Notifying clients that there information was leaked

    +   - Buying credit monitoring for customers affected by a breach

    +   - Funding campaigns to restore your company''s reputation after a data breach

    +   - Compensation for income lost while you deal with the effects of the data
    breach

    +   - Money for paying a ransom to the person who is holding your data hostage
    or threatening an attack (cyber extortionist)

    +   - Money stolen through the crime


    # Third-Party Cyber Risk Insurance


    Third party insurance covers businesses that are responsible for the systems that
    allowed the data breach to occur. This refers to tech companies and contractors
    that are responsible for ensuring the protection of the information such as cloud
    service providers, network administrators and cyber security personnel. If your
    company is responsible for handling the information of other companies this type
    of insurance is very important, if you''re company only handles its own information
    then first-party cybersecurity insurance is probably all you need. The benefits
    of third party insurance include getting compensated for:


    +   - The misuse, disclosure or theft of information that was on a system that
    you set up and were responsible for protecting.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '+   - Failure to prevent the transmission of malware to a third party.


    +   - Security breaches of employee confidentiality.


    It’s important to note that when a lawsuit is filed everyone that worked on the
    systems at fault will be considered liable for the breach in security. Therefore
    even if your business only worked a portion of the project, you could still face
    legal action if a security incident occurs, which is why it’s important that if
    you do any work that involves another companies information that you have this
    type of insurance. This includes businesses and contractors/freelancers.


    # Things Cybersecurity Insurance Won’t Cover


    Cybersecurity insurance is a relatively new area and therefore they still don’t
    cover all of the problem areas that companies face. Many insurance plans won’t
    cover things like damaged reputations resulting in lower sales and theft of intellectual
    property such as product design and software code because it is hard to quantify.
    It’s important to realize if you’re company suffers a data breach and customers
    realize that there private information has been lost, you will lose some customers.
    Especially, if that information is used against them, for example they start to
    see weird purchases on their credit cards or people use the login information
    they got from your company to hack into their accounts on other websites. This
    loss of trust, will impact your clientele and eventually your revenue and you
    will have a hard time getting an insurance provider to cover your for that.


    # How to Select the Type of Cybersecurity Insurance My Business Needs?


    The first thing to do is prepare a risk assessment and impact analysis. Here you
    need to review what your assets are, understand what the companies risks are and
    what the impact of a breach would be. You also need to identify the main vulnerabilities
    that exist in your current IT systems. Once you have a good idea of what assets
    you have and what risks exist for them, you should begin by seeking legal counsel.
    There'
