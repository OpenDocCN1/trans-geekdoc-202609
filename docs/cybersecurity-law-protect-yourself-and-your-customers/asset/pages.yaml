- pgno: 78
  md: 'the most important aspect. For example one process that I often find gets overlooked
    are companies hiring processes. I’ll often see on job postings, companies will
    say things such as “looking for a programmer with strong skills in Java” or “looking
    for someone with experience with Windows 10 OS.” At face value it might seem like
    nothing is wrong, but making such specific statements on a job posting that will
