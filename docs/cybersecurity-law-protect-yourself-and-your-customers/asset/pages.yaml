    # # Make Backing Up Data a Regular Function


    In the event that your company is hit with a malware that encrypts or destroy
    company data, you will want to ensure that you have up to date backup of your
    information available to keep your business running smoothly. How often you backup
    your information depends on how valuable those particular files are. Records that
    are essential to your business should be backed up at least once per day, files
    that are moderately important or less should be backed up one per week or biweekly
    at the least. These backups can be keep on the network for easy access but it''s
    more secure to keep a copy on an offsite location so that there''s not a single
    point of failure in the event of an incident. Whether you do you backups manually
    or automatically its best to create a backup schedule so that you don''t forget
    or miss a backup at a critical time. Some general tips for creating a backup routine
    are:


    +   1. Backup your most important files at least once a day, sometimes even more
    depending on how critical it is to your business.'
