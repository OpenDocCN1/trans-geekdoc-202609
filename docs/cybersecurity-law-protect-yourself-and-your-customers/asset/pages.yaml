  md: 'their software was patched in order not to expose their organization to unnecessary
    risks,” says Rami Sass, co-founder and CEO of WhiteSource Software, an open source
    security and license compliance management platform. Some common examples of the
    problems that can be caused by poor patch management are the Meltdown and Spectre
    vulnerabilities found in late 2017 or the Equifax breach that was caused because
    of the exploitation of a vulnerability in their web app. The vulnerability and
    the patch was published in march of 2017 but they failed to do the patch and were
    breached shortly after that in an incident that affected approximately 147.9 million
    U.S customers Sweet (2018). Equifax finds additional 2.4 million in U.S. impacted
    by 2017 data breach. Due to the amount of people affected and sensitive of the
    information, which was mostly social security numbers it is considered the largest
    leak of personal information in history.


    +   • GDPR—This stands for the General Data Protection Regulation which went into
    effect on May 25th 2018. It affects all companies that collect or process data
    about Europeans, goods or services in Europe or receive, store or process EU personal
    data for corporate customers. Attorney Daniel L. Farris, the chair of the technology
    group at the law firm Fox Rothschild LLP had this to say “It is pervasive, impacting
    the entire enterprise, and [will require] active management/oversight of third
    party vendors.” “Companies that collect or process data about Europeans, offer
    goods or services in Europe, or even receive, store or process EU personal data
    for corporate customers will likely have to comply. [And] compliance means ...
    enterprise-wide data mapping and a data inventory, generally only using personal
    data as permitted by individuals after consent/opt-in, managing vendors, regularly
    auditing or assessing privacy compliance programs and respecting an individual’s
    ‘right to be forgotten,’” he explains. “Non-compliance can cost a company up to
    4 percent of global turnover [gross revenue].” To help with GDPR he suggests “begin'
  merge: -1
