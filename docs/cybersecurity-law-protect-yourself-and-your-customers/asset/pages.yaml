- pgno: 88
  md: 'documenting data processing and resulting risk, including any applicable rights
    of the data subject, if you have not already,” says Hawke. “GDPR Article 30 requires
    that every organization subject to the regulation must maintain a record of data
    processing activities.” However, there are free tools, such as this template provided
    by Everlaw, that can help guide organizations. Hawke (2018). Open-Sourcing our
    GDPR Compliance Preparation for Articles 30, 32, and 35.


    +   Vendor Management—Similar to the difficulties with BYOD, getting third party
    vendors to comply with all of the regulations affecting your company is a difficult
    problem for IT personnel. If you outsource your data processing to any third party
    vendors, it is considered your responsibility just as much as theirs to ensure
    that they are handling your customer’s information in a way that is in compliance
    with all of your regulatory requirements.


    +   Internet of Things (IoT)—The Internet of things refers to increasing number
    of devices that are connected to one another via the Internet. All of these devices
    are endpoints that can be used as a point of attack by a cybercriminal. Due to
    the large number of devices combined with how quickly new items can be added to
    a company’s IoT architecture, it makes it very difficult for a company to ensure
    that all of these devices are adhering to the rules that they need them to follow.


    +   Lack of Subject Matter Experts—Some companies don’t have the financial resources
    to spend on a department dedicated to IT compliance and hiring Subject Matter
    Experts can be very costly. Higgins (2018).


    Now that we have outlined some of the most serious issues when it comes to security
