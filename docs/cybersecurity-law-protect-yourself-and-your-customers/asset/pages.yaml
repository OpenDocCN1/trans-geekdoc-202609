  md: '# CHAPTER 3


    # What Are the Corporate Requirements for Cybersecurity?


    # This Goes into Detail About What Actions Companies Need to Take to Ensure that
    They Are in Full Compliance with Information Security Legislation


    This chapter will discuss some of the things management needs to ensure is in
    place to avoid lawsuits from angry customers in the event of a cyber-security
    incident. The first piece of legislation your company should be concerned with
    if you a business operating within Canada (in whole or in part) is an act known
    as PIPEDA which stands for the Personal Information Protection and Electronic
    Document Act “Wasser, L. A., Lyons, C., & Koczerginski, M. (2017, October).” This
    federal legislation to all businesses that are federally regulated and applies
    to the protection of employee personal information and the protection of personal
    information during the course of commercial activities. The only time PIPEDA would
    not apply to business operations in Canada is when the province has substantially
    similar legislation, in that case the provincial legislation will be applicable
    in place of PIPEDA. Currently the only other provinces with legislation that would
    replace PIPEDA are Alberta Personal Information Protection Act, SA 2003, c P-6.5.,
    British Columbia Personal Information Protection Act, SBC 2003, c 63. and Quebec
    An Act respecting the Protection of Personal Information in the Private Sector,
    CQLR c. P-39.1,'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'which I will all discuss later on. PIPEDA has several security requirements
    for business, with some of the most important ones highlighted as follows:


    +   1. Businesses are responsible for all personal information under their control
    and must designate at least one individual to ensure compliance with the principles
    set out in schedule one of PIPEDA.


    +   2. Personal information must be protected by safeguards appropriate to the
    sensitivity of the information. This one can be tricky because it’s not very specific
    but I will be discussing in this book the industry standard of security measures
    used to protect the different types of information companies use and make sure
    that you can prove if necessary that you did have the proper level of protection.
    These safeguards must protect against theft/loss as well as unauthorized access,
    disclosure, copying and use or modification. The types of safeguards used by a
    business should include: (1) Physical protection like lock cabinets, securing
    company property. (2) Organizational measures such as security clearances and
    protocols to be followed on collecting and handling customer information. (3)
    Technology measures such as the use of passwords and mandatory complexity of passwords
    and the use of encryption. If your company is holding an client information in
    a database you need to ensure that it is encrypted so that even if someone is
    able to steal the information it will be useless to them unless they can decrypt
    the information, which can take up to several years if you are using just an average
    or better encryption algorithm. So if you’re a management level employee, business
    owner or someone responsible for the legal aspects of your business you want to
    make sure that you’re data is being protected by an encryption algorithm. In Chapter
    4, I will go into more depth on the different types of encryption standards, their
    pros and cons and how you can go about implementing them.


    +   3. As of June 2015 PIPEDA requires that organizations notify the Office of
    Privacy Commissioner of Canada (the OPC), affect individuals and organizations
    or government institutions that can reduce the risk of harm if you believe that
    a breach of your security safeguards poses a “real risk of significant harm” to
    the individuals whose'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'information you are protecting. Companies are also required to keep a record
    of all breaches and If you are found to knowingly not report a breach you can
    be fined up to $100,000 CAD.


    +   4. Most jurisdiction in Canada have specific laws when it comes protecting
    health information that is collected, disclosed by health custodians and the protection
    of personal information held by government bodies.


    +   5. Some provinces have passed torts where customers can bring a claim for
    breach of their privacy even if they have no proof of actual damages caused.


    +   6. In Canada it is illegal to install a computer program on a person’s computer
    without consent, cause a program to be installed without consent and to cause
    a computer program to communicate with other electronic devices without consent
    of the owner and this applies if the installer or the target is in Canada.


    +   7. PIPEDA puts limitations on what data can leave the country and gives restrictions
    how data can be transferred outside the country.


    # What Data Must Stay in Canada (G., & Server Cloud Canada (July 13, 2018))


    PIPEDA makes all private organizations accountable for protecting information
    during transit and outsourcing, while generally it is legal for information to
    cross Canadian borders the Canadian business remains liable for any problems with
    that information. Federal government institutions are subject to the country’s
    Privacy Act, which outlines how personal information is stored and collected.
    If you work for a federal government, you will be held to a higher standard when
    it comes to information security. There is currently a proposal that would prohibit
    classified data from leaving the country, period. In Alberta and Quebec, the transfer
    of public sector personal data outside of the country is restricted and in some
    cases it’s prohibited outside of the province. British Columbia and Nova Scotia
    prohibit government institutions, Crown agents and their service providers from
    moving any personal data outside of Canada, with very few exceptions. If you are
    a business that collects health-related information operating out of Ontario,
    you can’t disclose any of that information'
  merge: -1
