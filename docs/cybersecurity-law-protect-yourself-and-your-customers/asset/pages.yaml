  md: '# CHAPTER 7


    # The Importance of Cybersecurity Specific Insurance


    A Common Mistake Companies Make Is Assuming Their General Insurance Plan Will
    Cover Cybersecurity Incidents, Which It Often Won''t. It''s Important that Companies
    Have a Cybersecurity Specific Insurance Plan. This Chapter Will Discuss This and
    Give Some Options


    In this chapter I will be looking at ways that a company can make sure they have
    coverage in the event of a data breach. The first important thing to note is that
    most general insurance plans will not cover you in the event of a Cybersecurity
    incident. Since, cybercrime is a fairly new liability for business, most insurance
    plans have not been revised to include it. You will most likely have to purchase
    it as a standalone service from an insurance provider. Cybersecurity insurance,
    referred to as cyber liability or data-breach liability insurance will provide
    you with coverage on things like data loss from data breaches, network outages,
    service interruptions and more depending on your provider. Unlike like other more
    general forms of insurance, cybersecurity insurance can vary significantly in
    price and coverage depending your provider.'
