    # Other Social Engineering Studies


    The status of social engineering being the number one root exploit cause by far
    is backed by nearly every study any vendor reports. My KnowBe4 colleague and friend,
    Javvad Malik, did a meta-analysis study (https://info.knowbe4.com/threat-intelligence-to-build-your-data-driven-defense)
    of a hundred vendor reports (from 43 different vendors) he retrieved from AlienVault’s
    Open Threat Exchange (otx.alienvault.com). The percentage of attacks attributed
    to social engineering varied by report and vendor, but for almost every report,
    social engineering was the top threat. I’ve seen some reports temporarily list
    some other hacking root cause as the top root cause (e.g., remote access, password
    hacking, etc.), but usually those other categories were only the top vote-getter
    for a temporary period of time. Usually, social engineering or phishing reshowed
    up as the top hacking cause in the next report and over the long term.


    But most reports that track initial root causes list social engineering or phishing
    as their consistent top cause. This was the case 10 years ago and is still the
    case in nearly every vendor report I read today which discusses hacking root causes
    in aggregate. Most don’t agree on the percentage of hacking attributed to social
    engineering or phishing, but they all agree that social engineering or phishing
    is the number one root hacking method. Recent years provide some noteworthy examples.


