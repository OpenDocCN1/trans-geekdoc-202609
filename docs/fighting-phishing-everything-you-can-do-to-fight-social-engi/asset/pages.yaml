    # Homoglyphs and Punycode Attacks


    As stated previously, URLs can contain letters, numbers, and symbols. The characters
    a URL can contain are limited to what is known as the *Unicode Transformation
    Format 8-bit* (or *UTF-8*) character set. You’ll also hear UTF-8 called *Punycode*,
    although they are slightly different sets of characters. UTF-8 is a subset of
    a larger character set known as *Unicode*. Unicode is a set of millions of characters
    that make up every known language, including ancient languages and hieroglyphics.
    You can’t use every possible Unicode character in a URL, but you can use whatever
    is defined under UTF-8, which is over a million different characters. Unicode
    covers most of today’s modern languages and most of the characters and symbols
    they utilize.


    The problem is that completely different characters, belonging to different languages,
    often look identical to each other. For example, the Unicode Latin “a” (U+0061
    hex) and Cyrillic “a” (U+0430 hex) may look the same in a browser URL but are
    different characters represented in different languages. There are dozens of look-alike
    Unicode characters. This, unfortunately, allows phishers to create new domain
    names that look just like other domain names, but they are really different URLs.
    When phishers create look-alike DNS domains using look-alike Unicode characters,
    it’s known as a Punycode or *homoglyph attack*.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Traditional Homoglyph Attack


    The first time homoglyph attacks were theorized and publicly published was in
    2017 (www.xudongz.com/blog/2017/idn-phishing). In this first test example, the
    “a” in apple.com was represented using a Cyrillic “a” (U+0430 hex) instead of
    the normal Latin “a” (U+0061 hex). So even though apple.com looked like apple.com,
    if clicked, it took the user somewhere else. If the test attack was a real attack,
    the phisher could have created a fake, look-alike Apple website.


    Today, homoglyph attacks are uncommon but do appear in the real world. Here are
    some more recent examples of homoglyph attacks:


    +   - https://arstechnica.com/security/2023/10/google-hosted-malvertising-leads-to-fake-keepass-site-that-looks-genuine

    +   - https://blogs.microsoft.com/on-the-issues/2021/07/19/cybercrime-homoglyphs-dcu-court-order

    +   - https://krebsonsecurity.com/2022/11/disneyland-malware-team-its-a-puny-world-after-all

    +   - https://techcommunity.microsoft.com/t5/microsoft-365-defender-blog/xdr-attack-disruption-in-action-defending-against-a-recent-bec/ba-p/3749822


    # Right-to-Left Override Trick


    One particularly tricky Punycode attack involves using Unicode control characters.
    All character sets (e.g., ASCII, UTF-8, Unicode, etc.) contain control characters,
    which instead of representing visible or printable characters, actually perform
    an action. For example, some control characters will indicate a “linefeed,” which
    tells a screen or printer to place'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'or print the next characters on a new line. Or a control character may represent
    the “end of a file,” which tells the computer that whatever characters it is processing
    is the end of the current file and any other following characters belong to another
    file. When present, control characters aren’t normally visible. They are usually
    non-viewable and non-printable. A viewer will not normally see a control character
    or maybe they might see a slight spacing issue or blank.


    In this particular phishing example, the Unicode control character involved is
    the Right-to-Left Override (RLO). Most languages read from left to right, but
    some, like Arabic and Hebrew, read from right to left. When the RLO control character
    is detected, any characters following it will be placed in the reverse direction
    of what they currently look like.


    Phishers use RLO to their advantage. For example, they create a phishing email
    claiming to be related to a missed phone call with a file attachment named voicemessage
    exe.mp3. But what most viewers don’t realize is that the blank space between voicemessage
    and exe is really the RLO control character. A potential victim might click on
    the file attachment thinking it is a harmless mp3 audio file, but once they click
    on the file attachment and “activate” the RLO control character, the file attachment
    is renamed voicemessage3pm.exe. The file attachment wasn’t a harmless MP3 file.
    It was a very dangerous and malicious .EXE file. Figure 13-24 shows a real-world
    phishing example with a similar RLO trick deployed. You can read more about it
    here: www.vadesecure.com/en/blog/how-hackers-are-using-a-20-year-old-text-trick-to-phish-microsoft-365-users.


    Hopefully, you have a much better understanding of legitimate URLs and hacker
    URL tricks than before you started reading this chapter. There are at least a
    half dozen other ways, if not dozens of other ways, to trick a user into thinking
    they are clicking on one thing, but then take them somewhere else. The only'
  merge: -1
  img_proc: true
- pgno: 357
  md: '(quick and easy) defense is for the user to inspect URLs the best they can
    and to be aware of where you end up after you click a URL. If it says ups .com
    and you end up somewhere else completely different, then be suspicious.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_357_0.png)


    FIGURE 13-24 An example of a real-world phishing using the RLO trick.


    # Summary


    Chapter 13 covered how to decipher a URL into its various parts. It discussed
    how the most important skill a user can have is in determining what part of the
    URL is the DNS domain, and then deciding if the involved domain is legitimate
    or rogue. Chapter 13 then showed many common tricks that phishers use to obscure
    URLs and trick users into clicking on rogue URLs.


    Chapter 14, “Fighting Spear Fishing,” will discuss how to fight spear phishing.'
