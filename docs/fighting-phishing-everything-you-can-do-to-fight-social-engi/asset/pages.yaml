  img_proc: true
- pgno: 358
  md: '# # CHAPTER 14


    # Fighting Spear Phishing


    Spear phishing is one of the top cybersecurity threats if not *the* top cybersecurity
    threat. Chapter 14 is going to cover different types of spear phishing and discuss
    how to specifically defend against it.


    # ## Background


    Social engineering is involved in 70% to 90% of successful compromises. It is
    the number one way that hackers and malware successfully attack devices and networks.
    No other initial cyber-attack root cause comes close (exploiting unpatched software
    and firmware are a distant second, being involved in about 20% to 40% of attacks).


    A particular type of social engineering is responsible for more successful compromises
    than any other type of attack: spear'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'phishing. As previously covered in Chapter 2, “Phishing Terminology and Examples,”
    *spear phishing* is defined as focused, targeted phishing that attempts to exploit
    a specific person, position, team, organization, or group, often leveraging previously
    learned information related to the target. Spear phishers often use the information
    they find on publicly available websites, on social media, or private websites
    or use confidential information they have previously learned from using other
    exploits. General phishing rarely has or uses confidential information on the
    intended targeted victims, whereas, spearphishing often does.


    In May 2023, Barracuda Networks released a report (https://assets.barracuda.com/assets/docs/dms/2023-spear-phishing-trends.pdf)
    revealing a lot of relevant statistics regarding the seriousness of spear phishing.
    The research found that over half of organizations fell victim to spear phishing
    each year. The average organization received five spear phishing attempts a day
    with an average “click-through rate” of 11%. But the most startling fact that
    beat all the others was although spear phishing attacks only make up less than
    0.1% of all email-based attacks, they are responsible for 66% of all successful
    breaches.


