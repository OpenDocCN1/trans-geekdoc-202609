    # In-Person Attacks


    When Kevin Mitnick was young and hacking (and as an older, legitimate penetration
    tester), he was particularly known as a great in-person social engineer. He would
    dress up as a delivery man, hold branded delivery boxes, and get “buzzed” through
    security turnstiles. He would dress up as a telephone company employee, hold branded
    telephone equipment boxes, and get taken to internal telephone closets. Kevin
    would pose as an interested renter to be let into skyscraper areas where he could
    then enter particular company headquarters. Kevin would call HR and accounts receivable
    departments, learn information about a company, and then use that information
    when he showed up for in-person social engineering attacks. Every SAT program
    should include training on in-person attacks, give common examples, and tell employees
    how to recognize, mitigate, and report potential attacks.


    # Champion Programs


    The best SAT programs include “champion programs” where various trusted, knowledgeable
    employees are used to teach cyber defense lessons to other employees. Champion
