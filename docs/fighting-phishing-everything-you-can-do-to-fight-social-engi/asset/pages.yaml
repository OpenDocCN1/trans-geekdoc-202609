    Social engineering is as old as humanity. There are many ancient, early written
    examples of people complaining of scams and being taken advantage of. You can
    find an example of an early financial scam documented back in 300 B.C. at www
    .investopedia.com/articles/financial-theory/ 09/history-of-fraud.asp.


    Social engineering is exploiting the inherent trust one human gives another. We
    are built to trust each other by default. In general, this default trust serves
    us well. Most of what we do every day only works because our default assumptions
    and inherent trust in other human beings work most of the time without harming
    our interests. Most of our civilization only works because that trust is usually
    well-founded most of the time. But scammers take advantage of this default trust.


    Commonly, scams are done for monetary advantage, but they can be done for many
    other reasons, such as romance, revenge, jealousy, physical harm, and really in
    response to any emotion, even happiness. People often socially engineer friends
    and loved ones into situations that will benefit all those involved (for example,
    a surprise birthday party or giving rewards for a desired behavior). In the context
    of this book, however, we are talking about malicious social engineering scams
