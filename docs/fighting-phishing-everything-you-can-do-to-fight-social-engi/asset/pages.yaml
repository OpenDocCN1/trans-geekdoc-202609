- pgno: 258
  md: '# CHAPTER 10 Advanced Defenses


    Chapter 10 will round out Part III, “Technical Defenses,” by discussing advanced
    defenses, which covers everything from more sophisticated defenses to good defenses
    either difficult to deploy or rarely used. But make no mistake about it, these
    technical defenses, if implemented, could significantly diminish cybersecurity
    risks related to fighting social engineering and phishing.


    # AI-Based Content Filters


    Previous chapters have covered the importance of having phishing-mitigating content
    filters at both the network and endpoint levels. Any technical defense that can
    prevent a malicious message from making it to the end user is worthwhile. There
    are many dozens of Artificial Intelligence-based (AI-based) and otherwise, free
    and commercial systems, that will detect phishing messages.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The only downside is that most anti-phishing content filtering tools are directed
    only toward emails and maybe browser-based attacks. It is difficult to impossible
    to have the same level of content-filtering leveled at SMS-based messages, voice-based
    calls, productivity apps (like Microsoft Teams, Slack, etc.), and certainly in-person
    scams. The best future state we can imagine has some form of content-filtering
    tool involved no matter how the message arrives.


    One definition of AI is the intended simulation of human intelligence, including
    a computer system being capable of producing brand-new content, thought, selection,
    and direction, beyond what it was directly instructed to do originally. These
    days AI is in the news because of the transformative impact of long language models
    (LLMs) on Internet search and application results. LLM-based AI can recognize
    and generate human-like text and other content after being “trained” on huge related
    data sets. Make no mistake, AI-based and LLM-based systems are significantly changing
    the world.


    AI-based systems have been around for decades, mostly in experimental systems,
    but have also been used in real-world cybersecurity defenses for nearly a decade.
    KnowBe4, my employer, has had AI-based features for over half a decade. Unfortunately,
    the bad guys can use AI-based systems for their own needs and goals. Using AI,
    it is easier for an untrained malicious developer to write malicious software.
    Using AI, it is easier for an untrained social engineer to write malicious phishing
    messages. AI-based systems will surely make all social engineers and malware writers
    more successful. And that’s what a lot of the news is about these days (i.e.,
    how AI can be used by bad people to do bad things).


    But it''s also important to recognize that the good guys invented AI and have
    been using AI-based systems for much longer than the bad guys. It isn’t just going
    to be the bad guys using AI. It’s important that you implement an AI-based content
    filtering tool if'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'at all possible. AI-based cybersecurity defense tools are simply going to be
    more capable and more accurate at defending against cyberattacks than systems
    that aren''t AI-enabled.


    # Single-Sign-Ons


    Single-sign-on (SSO) systems allow a user to log on once, and then the SSO handles
    the rest of the user''s logon to other sites, services, and applications. Popular
    SSO vendors are Okta and OneLogon. The use of SSO portals decreases the risk of
    social engineering and phishing because the user becomes accustomed to accessing
    all (or part) of their applications from the SSO portal. So, if a phishing email
    shows up asking the user to log on to one of their applications via email or over
    the web (not using the SSO portal), there is a chance the user will get suspicious
    and not use the alternative logon.


    > There is also the risk that a hacker will gain access to an SSO admin portal
    and use the access to compromise the victim''s entire environment or even leverage
    an organization''s SSO portal to access other organizations. SSOs are single-point-of-failure
    risks. Even so, the average organization using an SSO will have less cybersecurity
    risk than otherwise.


    # Application Control Programs


    Application control programs, like Microsoft''s Windows Defender Application Control,
    allow an admin to specify allowlists and blocklists of applications that a user
    can run in a controlled'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'environment. Application control programs can prevent unauthorised software
    installs and executions, including the installation and execution of malware.
