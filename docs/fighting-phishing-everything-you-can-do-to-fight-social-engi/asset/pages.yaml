    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_124_0.png)


    # FIGURE 5-4 KnowBe4’s “The Red Flags of Rogue URLs” PDF poster.


    Anyone can download, share, and print this PDF post. You can download the one-page
