    # Password-Protected File Attachments


    It is very common for malicious emails to include password-protected file attachments.
    The file attachments will be password-protected so that any defensive software
    the potential victim may be running cannot open and inspect the file. If the file
    attachment is password-protected, the phishing email will have to let the potential
    victim know it is password-protected and what the password is. I’ve never come
    across an unexpected legitimate email that included a password-protected file
    attachment. If you don’t recognize the sender and the file attachment is password
    protected, then the email is likely malicious.


    # Spotting Rogue URLs


    Rogue-looking URLs, as thoroughly covered in Chapter 13, “Recognizing Rogue URLs,”
    are common signs of malicious messages.


    # File-Type Mismatches


    When reviewing emails, if a file attachment type is pretending to be a type that
    it is not, that email is likely to be malicious. For example, a file tries to
    look like an Adobe PDF file but is a higher-risk Microsoft Word document file
    (docx), or a file tries to look like a harmless TXT file but is a far riskier
    HTM or HTML file. Figure 15-6 shows a real-world phishing example where a potentially
    dangerous HTML file is named ADOBE-FILE in an attempt to make some users think
    the file is a PDF file.'
