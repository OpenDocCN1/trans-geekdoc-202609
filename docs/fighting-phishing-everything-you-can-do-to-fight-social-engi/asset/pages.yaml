- pgno: 419
  md: '# What Is a Security Culture?


    There isn''t a definitive definition of security culture. It means different things
    to different people and organizations. But I like to think of security culture
    as how someone will naturally respond to a computer security scenario and how
    the involved parent organization, in aggregate, will do the same. Culture includes
    the collective values, norms, and responses from a group sharing one or more attributes.
    It''s the behaviors often taught over time that become deeply embedded in everything
    within a group, so that the emotional responses of individuals are the same, without
    anyones. For example, in some organizations, everyone locks their computer screen
    (screensaver lock) when walking away from it. In other organizations, few to no
    one does it even if the organizational policy at both places is to lock screens
    when going away from your computer. In the former organization, where everyone
    locks their screens, a brand new employee would likely see the behavior demonstrated
    by multiple other employees and mimic that behavior in their own individual actions
    without being told.


    Or conversely can be true. There can be laws that state something that nearly
    everyone in society ignores because the culture says to ignore it. For example,
    in the US, most car drivers drive over the posted speed limit, often 5-10 mph
    faster, and often'
  merge: -1
  img_proc: true
- pgno: 420
  md: 'much more. Every day most Americans are speeding and taking a chance at getting
    a speeding ticket. In fact, someone going “only” the posted maximum speed limit
    will often back up traffic and be seen as a troublemaker.


    The ultimate goal of security awareness training is to make organizations have
    good, strong cybersecurity cultures, where most people are performing the appropriate
    actions and taking the appropriate decisions to significantly reduce cybersecurity
    risk. We want employees to hover over URL links before clicking on them. We want
    employees to have a healthy level of skepticism toward any unexpected request
    that could harm their self-interests or those of their organization. We want employees
    making the right cybersecurity decisions every time.


    # Seven Dimensions of a Security Culture


    Another way to define and measure security culture, according to Carpenter and
    Roer, are these seven attributes:


    +   - Attitudes

    +   - Behaviors

    +   - Cognition

    +   - Communication

    +   - Compliance

    +   - Norms

    +   - Responsibilities


    We will discuss each in more detail below.


    # Attitudes


    *Attitude* is how someone feels about something. Attitude accounts for a significant
    portion of the outcomes and the way we feel'
  merge: -1
  img_proc: true
- pgno: 421
  md: 'about something. Unfortunately, attitudes about the same event often vary significantly
    due to people''s former experiences, outcomes, and emotions. For example, a person
    flying in a plane for the first time is often elated at the experience. They will
    talk about how quickly the trip went, how great the food was, brag about the cushion
    seats and movie selection, and compliment the flight attendant''s service. An
    experienced traveler, sitting in the same level of comfort, may say the whole
    experience was terrible because of a single negative attribute (e.g., maybe the
    passenger in front of them was declining their seat). As another example, people
    who tend to stay married see the quirks (e.g., leaving the cap off of the toothpaste
    container after brushing your teeth) in their loved ones'' behavior as cute or
    endearing. Or they at least accept it as a minor annoyance (“Don’t sweat the little
    stuff!”). People who tend to get divorced can see the same quirk, and it causes
    nothing but continued frustration and anger.


    You want to foster a security culture that understands the importance of performing
    actions that decrease cybersecurity risk. You want followers to understand that
    it is in their own best interests to follow policies and reduce the risk from
    their actions. You want to avoid a culture that sees cybersecurity requirements
    as unnecessary detriments to the business.


    You can reinforce better attitudes by publicly sharing examples of incidents with
    good outcomes and positive reinforcement. For example, you could share a story
    of an employee with a great attitude self-reporting that they accidentally got
    tricked into clicking on a URL link in a real-phishing email, then embarrassingly
    admitting their mistake to IT, and having to get their computer completely re-installed.
    Showing an employee and IT laughing gently about the whole experience, but also
    showing the seriousness, can help spread similar attitudes.'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# Behaviors


    Behavior is what we do. It’s our actions. If something happens, this is how we
    respond to it. In programming vernacular, it’s an IF-THEN statement. The person
    involved perceives an event, is motivated to respond in a particular way, and
    can perform the desired action. A person’s attitude often shapes their behaviors.


    We want behaviors to decrease cybersecurity risk. The behavior can be directly
    taught and reinforced (e.g., a formal training class), indirectly learned (i.e.,
    watching others), or instinctual. For example, a parent of a young child holds
    the child’s hand as they cross a street. The parent teaches the child to look
    right, left, and right again to make sure the path is clear, before proceeding.
    If reinforced enough, looking both ways before you cross a street becomes automatic.
    The child doesn’t think much about it, if at all, before performing the desired
    behavior before crossing the street. Not only that, but the child is going to
    teach their child the same behavior when they have children. No one has to tell
    the original child that they should teach their child how to appropriately cross
    a street. It’s just assumed and expected.


    In some scenarios, some humans are resistant to being told what to do. One common
    body of thought is we want to “nudge” people towards good behaviors. As Perry
    Carpenter stated, “The strongest nudge possible is to make the action your employees
    to take the easiest or the most obvious choice available.” This is one reason
    why KnowBe4 gives away their Phish Alert Button (www .knowbe4 .com/free-phish-alert)
    for free. If a PAB user sees a suspected phishing email, it’s very easy to simply
    click on a button.


    > Here’s a whole book dedicated to nudging, Nudge: The Final Edition (www.amazon.com/Nudge-Final-Richard-H-Thaler/dp/014313700X).'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# Cognition


    *Cognition* is how we interpret and understand situations and information. Two
    people can easily perceive the same event differently and react differently. An
    example of cognition is teaching employees how to recognize different types of
    phishing. Sharing more examples of phishing and discussing the common signs and
    symptoms of most phishing events, will help the employee recognize and respond
    to a phishing message.


    # Communication


    *Communication* is the exchange of information. It goes without saying that organizations
    that are better at communication and do it more frequently are going to get better
    results. Different cultures need to be communicated differently. The most straightforward
    example is that everyone needs to be communicated to in a language that they understand.
    Simply directly translating one language, word for word, often isn’t enough to
    deliver clear and concise communication. Words and concepts in one language may
    have different meanings in another.


    # Compliance


    *Compliance* is the act of cooperating with a requirement or wish. Your employees
    will have to to comply with dozens to hundreds of required compliance regulations
    as part of their normal duties. Like security awareness training, making people
    understand the “why” they have to do something often goes a long way to them readily
    agreeing to cooperate.


    # Norms


    *Norms* are often unwritten rules of an organization and culture that define how
    the group behaves and responds. They can be'
  merge: -1
  img_proc: true
- pgno: 424
  md: 'shared beliefs, values, and expected behavior. Storytelling is a common way
    that cultures communicate norms. For example, the story of the “The Boy Who Cried
    Wolf” teaches people not to unreasonably and repeatedly panic in every situation.
    One culture may teach that trying your best to return a dropped wallet with the
    money intact is morally right and what you should do. Another culture, maybe even
    a sub-culture within the larger culture, may believe in “finders keepers.”


    # Responsibilities


    Responsibilities are the state of accepting or assigning accountability. A good
    security culture makes each individual accountable for particular actions and
    makes them feel like an integral and beloved part of the organization. Employees
    who feel responsible are more likely to make appropriate decisions when faced
    with unexpected or misunderstood scenarios.


    All of these personal dimensions can help an organization have a good security
    culture or if done poorly cause the opposite. Business culture leader, John R.
    Childress (www.johnrchildress.com) says, “You get the culture you ignore.”


    # Improving Security Culture


    There are different levels of cybersecurity culture maturity (covered below).
    All security cultures should be in a constant state of continually improving.


    # Baseline Measurement


    First, take a baseline measure of where you think your security culture currently
    is. This can be done using surveys, conversations, assessments, and quizzes. You
    are ultimately trying'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'to get a sense of where your organization’s maturity is regarding security
    cultures. There are five levels of increasing security culture maturity (taken
    from www.knowbe4.com/security-culture-maturity-model):


    | Level | Name | Characteristics |

    |---|---|---|

    | 1 | Basic Compliance | • Bare minimum of training<br>• Limited metrics<br>•
    “Check the box” |

    | 2 | Security Awareness Foundation | • At least annual and onboarding training<br>•
    Occasional phishing simulations<br>• Focus on a variety of content |

    | 3 | Programmatic Security Awareness & Behavior | • Intentional awareness program
    with integrated tools<br>• Quarterly training with simulated phishing<br>• Focus
    on security-aware behaviors |

    | 4 | Security Behavior Management | • Continuous training across varied delivery
    methods and audiences<br>• Heavy use of integrated tools to inform training strategy<br>•
    Program focused on real behavior change |

    | 5 | Sustainable Security Culture | • Program that intentionally measures, shapes,
    and reinforces security culture<br>• Multiple methods of behavior-based encouragement<br>•
    Security values woven through the fabric of the entire organization |


    This table of levels and characteristics is just a general summary of the key
    differences between security culture majority levels. You can make your own assessment
    characteristics tied to the'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'various maturity levels. Many admins tie specific, often measurable traits
    to the various majority levels. For example, the percentage of employees reporting
    real and simulated phishing emails to IT could be at least 10% at level 1, 30%
    at level 2, 60% at level three, 80% at level 4, and 90% or better at level 5.
    You can choose what assessable traits indicate what desired level of maturity.


    # Set a Goal


    Set a goal of where you want your organization’s maturity to be in a particular
    time period. It’s foolish to expect most organizations to go from low levels of
    maturity to high levels of maturity in a single year. But stepping up one or two
    levels of maturity in a given year is reasonable. Goals must be time-constrained
    and measurable.


    # Identify Gaps and Apply Tactics


    Identify the gaps that prevent the current maturity level from being higher and
    then create strategies and tactics to close the gaps. For example, an organization
    noticed that the percentage of reported phishes (real and simulated) by employees
    is low, let’s say 50%. Create and deploy a new advertising campaign that emphasizes
    the importance of reporting phishing, get senior management to speak on its importance,
    and give prizes to groups that significantly improve their reporting.


    # Remeasure Maturity Level


    Remeasure and report on security maturity level at least annually. Assess how
    well your tactics are working to close gaps. Create new tactics and strategies
    when gaps remain open (at the same level). When a tactic or strategy succeeds,
    reassess existing gaps, and repeat.'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'The key is you want your fantastic security awareness program and your fight
    against social engineering and phishing to become part of an ongoing, maturing,
    cybersecurity culture. You don''t do anything with a goal of just trying to improve
    only one value, one aspect of cybersecurity. Your ultimate goal should be to improve
    and continually improve your organization''s cybersecurity culture, so that everyone
    is benefitting and making better decisions.


    # Other Resources


    Here are other resources you may find useful from Perry Carpenter and Kai Roer:


    +   - Security Culture whitepaper www.knowbe4.com/security-culture-maturity-model

    +   - 2022 Security Culture Report www.knowbe4.com/organizational-cyber-security-culture-research-report

    +   - Security Culture How To Guide https://info.knowbe4.com/wp-security-culture-how-to-guide

    +   - The Right and Wrong Way to Do Security Culture Surveys https://info.knowbe4.com/wp-wrong-right-way-security-culture-surveys


    # Summary


    Every organization should strive to have a strong, mature level of security culture.
    You want all the employees of the organization to make the correct decisions and
    actions when faced with a cybersecurity threat. You do this by assessing your
    organization''s security maturity level, identifying gaps, and then implementing
    tactics and strategies to move to the next level.'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# Conclusion


    Every threat is best mitigated with the best, defense-in-depth, combination of
    policies, technical defenses, and educational best practices that can be deployed.
    This book covered those three major components: policies, technical defenses,
    and education, in separate sections. The policy section covered all the policies
    that each organization should create and publish to fight social engineering and
    phishing. This started with a generic acceptable use policy (AUP) and ended up
    covering specific phishing mitigation policies. The technical defense section
    of the book covered network and endpoint defenses that every organization and
    everyone should evaluate and consider to prevent social engineering and phishing
    from making it to endusers. The biggest weak link in most organizations is they
    don’t do enough aggressive security awareness training (SAT). Every organization
    should focus more on educating employees on how to recognize, mitigate, and report
    social engineering and phishing attempts. This should include monthly training
    and at least monthly simulated phishing tests.


    It is my hope that all readers have learned at least a few ideas and concepts
    that they can take away and apply in their new environment. Few organizations
    will apply every recommendation listed in this book, but the best organizations
    will focus on doing a better job of fighting social engineering and phishing.'
  merge: -1
  img_proc: true
- pgno: 429
  md: 'How well an organization focuses on mitigating social engineering and phishing
    will likely determine if they are or aren''t compromised in a given time period.


    Thanks for joining me (and Dr. John N. Just) on this journey. Keep fighting the
    good fight and may your organization be one of the few that never gets hacked!
    If you have any thoughts, questions, or criticism, feel free to send them to me,
    roger@banneretcs.com.'
