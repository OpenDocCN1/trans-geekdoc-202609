    # The Preponderance of Evidence


    Even when you have all the investigation you can do and all the available information,
    it can still be tough to determine whether a message is phishing or not. Rarely
    does all the available information point in the same direction. Often there is
    conflicting information, some pointing to it being a phishing message and other
    information saying it is not. The best you can do is look at the preponderance
    of evidence and see what the majority of the evidence points to.'
