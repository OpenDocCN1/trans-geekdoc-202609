    # Policy Goal


    The goal of this policy is to significantly reduce Acme’s cybersecurity risk due
    to participant actions and decisions when faced with social engineering threats,
    by using security awareness training and education. Participants should be able
    to better recognize cybersecurity risks and understand how to treat them.


    # Control Mapping


    The United States National Institute of Standards and Technology (NIST) requires
    a Security Awareness Training (SAT) program as part of NIST Special Publication
    800-53, release 5, “Security and Privacy Controls for Information Systems and
    Organizations,” (https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf).
    In particular, section 3.2, Awareness and Training, subsections (1) and (3) states
    the following:


    > “Provide practical exercises in literacy training that simulate events and incidents...Practical
    exercises include no-notice social engineering'
  merge: -1
  img_proc: true
