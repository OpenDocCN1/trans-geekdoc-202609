    # The Solution


    Chapters 3 through 17 are about how you and your organization can better protect
    yourself against social engineering and phishing threats. It will involve your
    best possible defense-in-depth combination plan of policies, technical defenses,
    and security awareness training. That is what this book is all about.


    But if I were to give one best practice secret away now, one of the single best
    things you can do is to teach yourself, your coworkers, your family, and your
    friends how to detect, treat, and report social engineering and phishing scams.
    Education is a key element in defeating those threats.


    Phishing messages are usually brand-new messages that the receiver was not expecting—not
    always, but usually. Teach everyone that when they get a new, unexpected message
    that asks them to do something potentially harmful to themselves or their organization,
    they should research it first in a more trustworthy way, before performing the
    requested action. These actions are summarized in Figure 1-3.'
