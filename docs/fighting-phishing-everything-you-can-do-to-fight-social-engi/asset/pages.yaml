  md: '# Which Metrics to Use


    Your SAT program policy should define what metrics are used to measure the success
    of the program. Most organizations should do a simulated phishing exercise before
    their SAT program begins, and periodically thereafter, to give the program a baseline
    to measure the program’s overall effectiveness. An effective SAT program will
    result in a significant reduction of cybersecurity risk to the organization.


    The metrics that will be used should be defined here. Let’s look at some example
    metrics.


    # Metrics for participants:


    +   - Total number of participants covered by the SAT program


    +   - Overall baseline of participants at the start of the SAT program and/or
    during subsequent baseline testing


    # Metrics for required training:


    +   - Total and types of required training


    +   - Individual training and testing results


    +   - Total number/percentage of participants and/or individual names of participants
    who completed all training and/or specifically required training in a timely manner


    +   - Total number/percentage of participants and/or names of individuals who
    did not complete all training and/or specifically required training in a timely
    manner


    # Metrics for individual simulated phishing campaigns:


    +   - Total number/percentage of participants and/or names of individuals who
    were sent a specific phishing campaign


    +   - Total number/percentage and/or names of individuals who “passed” or “failed”
    a particular simulated phishing campaign'
  merge: -1
  img_proc: true
- pgno: 150
  md: '+   - Total number/percentage of participants reporting simulated phishing
    attempt using appropriate method/tool (e.g., Phish Alert button, etc.)

    +   - Total number/percentage and/or names of individuals who entered their login
    credentials within a particular simulated phishing campaign

    +   - Total number/percentage and/or names of individuals who “clicked on a URL”
    within a particular simulated phishing campaign

    +   - Total number/percentage and/or names of individuals who downloaded a simulated
    malicious payload within a particular simulated phishing campaign

    +   - Total number/percentage and/or names of individuals who ran a simulated
    malicious payload within a particular simulated phishing campaign

    +   - Total number/percentage and/or names of individuals who completed information
    requested by a particular simulated phishing campaign

    +   - Totals or percentages of actions performed by participants across one, multiple,
    or all, simulated phishing campaigns


    Even when deciding on all metrics taken and reported on, establish ahead of time
    which metrics define the overall success or failure of an SAT program. Decide
    whether routine reports will be run and distributed to those who manage the program
    to help increase the effectiveness of the SAT program. For example, should managers
    always be notified of participant failures? Should a manager be given the statistics
    of how their team is performing over time or the corrective actions taken with
    a particular participant? What should managers be notified of and how frequently
    so they can gauge the effectiveness of the SAT program?'
