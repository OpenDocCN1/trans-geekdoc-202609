    # Email Header Inspection


    Every email sent ends up with a lengthy “header” attached to it. Every device
    involved in sending the email from source to destination adds to the email header.
    You can examine that header and get many pieces of information that are not readily
    learned any other way. To do so, you have to know how to read email headers. To
    the untrained eye, they can seem full of garbage, and they are. The trick is in
    determining what is useful information and what is garbage. Even some of that
    garbage can be further deciphered to learn more information.


    An email header contains only text. It is written and extended by each system
    (e.g., server, gateway, inspection service, client, etc.) that “touches” it. As
    covered in a previous chapter, these systems are officially known as Mail Transfer
    Agents (MTAs). Each MTA creates or adds to the header and each successive MTA
    writes its header information on top of the previous header information so that
    when you read a header, it is in reverse time order. The most recent information
    is at the top of the header and the earliest is at the bottom of the header. You
    can use it to follow the email’s path from source to destination (in reverse time
    order).'
