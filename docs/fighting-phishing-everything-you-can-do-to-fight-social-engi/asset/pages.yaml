    # Avoid Controversial Simulated Phishing Subjects


    Some SAT admins like running simulated phishing tests using “controversial topics”,
    like fake pay raises, employee gift cards, and free Taylor Swift tickets. They
    do so because many end-users are highly emotionally motivated by these topics
    and the “failure rate” of a simulated phishing campaign can be quite high. They
    like using controversial topics because many of their users who would not normally
    fall for a normal simulated phishing campaign, might fall for these controversial
    topics.


    I recommend caution when using controversial subjects in simulated phishing tests
    as they may generate too much anger if used incorrectly. I’ve even heard of SAT
    admins being punished'
  merge: -1
  img_proc: true
- pgno: 413
  md: 'and even fired for sending out the wrong simulated phishing topics.


    If you decide to use a controversial topic, it is better if it mimics a real-world
    phishing scenario than simply a brand-new idea that has never been used before.
    But in general, security awareness training (SAT) programs should strive to win
    “hearts and minds” and proponents versus opponents. Creating an angry workforce
    that reacts negatively against an SAT program because of some outlier topics is
    not a great outcome.


    It’s complicated because real-world bad actors often use “controversial” social
    engineering attacks that create immediate emotional responses. Bad actors use
    politics, and our love or hatred of a particular politician or ideology, against
    us. Bad actors intentionally pick and use news events with two highly charged
    sides. They pick subjects like pay raises, awards, and celebrity news to motivate
    us to click without taking the time to verify that the email is real. Bad actors
    intentionally use “controversial” topics so that we will throw away our normal,
    healthy skepticism, and react without to in-the-wild malicious phishing. If a
    big part of real-world phishing is intentionally causing emotionally charged responses,
    it would make sense for some simulated phishing campaigns to include them. You
    want users who fail emotionally charged simulated phishing tests to understand
    how those emotions motivated them, how to recognize the feelings of a highly charged,
    emotional response, and how to effectively and safely deal with it. If done correctly,
    a user seeing a highly emotionally charged email will understand that it is exactly
    the reason why they need to slow down and better inspect the email for other signs
    of social engineering. Simulated phishing tests are trying to introduce common
    scenarios used by'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'real-world bad actors and make the user’s thoughtful inspection and response
    an innate part of their behavior. You want the inspection of every email to be
    a natural part of their behavior, especially if that email seems to be intentionally
    going out of its way to motivate an immediate response.


    We want to expose our workforce to common phishing scenarios and use any failures
    as teachable moments to improve more secure behavior. Without exposing the user
    to common phishing tactics, including now and then emotionally charged simulated
    phishing attacks, they are not being truly exposed to the real-world of phishing.
    And training gaps can be destructive and expensive to an organization.


    So, in general, SAT administrators should use, at least as part of their program,
    simulated phishing emails that generate highly emotional responses. But there
    is a delicate balance between trying to give the most effective training possible
    and sending out topics that seem tone-deaf and highly “unfair” to management or
