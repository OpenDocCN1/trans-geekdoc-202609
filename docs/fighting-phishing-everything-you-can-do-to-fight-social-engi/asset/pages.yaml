    # How to Use DMARC


    It''s important to realize that a DMARC success or failure doesn''t mean a particular
    email is or isn''t a malicious email. DMARC informs you (or your agent on your
    behalf) about whether the SPF and DKIM authentication mechanisms are successfully
    passing and aligning with the relevant email domains (the 5321. MailFrom matching
    with 5322.From address domain for SPF and the d= domain matching with the 5322.From
    address domain for DKIM). No more, no less. Still, this is important information
    that can be used to help determine if an email is malicious or not.


    Many to most phishing emails pass all DMARC checks. This is because spammers and
    phishers realized that if they didn''t enable and use DMARC, their emails would
    more than likely end up in quarantine folders most of the time, drastically undermining
    their conversion rates and numbers of victims. So, phishers aggressively adopted
    DMARC, and most phishing emails will pass all DMARC checks. Although, most of
    the time, the phishers have their DMARC policy set to None, so that even failures
    won''t get quarantined or rejected.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'It is mentally a little disappointing to have the most malicious emails pass
    all their DMARC validation checks, but that doesn''t mean DMARC was an overall
    failure. No, DMARC forced phishers to stop domain spoofing nearly as often as
    they used to. They can no longer as easily pretend to be from microsoft.com, google.com,
    paypal.com, etc. Yes, all they do now is come up with (legitimate) domains that
    are near look-alikes, such as accountingmicrosoftcom.com or paypalpayables.com,
    and enable DMARC on them. And sadly, the vast majority of users don''t pay attention
    to the claimed domains anyway and miss the differences.


    But if you''re paying attention to the domains, whether or not an email passes
    or fails DMARC checks will verify if the claimed email domains are truly where
    the emails are from or not. So, if an email claims to be from paypalpayables.com
    and the DMARC checks confirm that fact, then I know that email really was from
    paypalpayables.com and not paypal.com where legitimate emails from PayPal would
    be coming from. DMARC is a success and can help you determine if an email is a
    phishing email or not. You just have to understand what DMARC does and doesn''t
    tell you.


    # What DMARC Doesn''t Do


    DMARC doesn''t tell you whether an email is or isn''t malicious. There are also
    many ways beyond using look-alike domains a phisher can abuse (although that is
    the main one) that DMARC doesn''t have a clue about. Some of the problems are
    weaknesses in the DMARC protocol and the way it works. For example, all forwarded
    emails lose their prior email header information (it gets wiped blank), which
    causes forwarded messages to fail DMARC authentication.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Here are some other DMARC issues:


    +   - DMARC is often misconfigured, causing legitimate emails to have failure
    statuses.

    +   - Many legitimate organizations have DMARC set to None, which basically defeats
    the purpose of DMARC.

    +   - Sometimes, email clients/services don’t treat DMARC failures as instructed
    or expected.

    +   - Many phishing emails are sent using large, public email providers (e.g.,
    Google, Microsoft, Sendgrid, etc.), and they will usually show DMARC passes even
    when being abused by phishers.

    +   - DMARC is domain validation, not specific email address validation.

    +   - A phisher can use a compromised legitimate domain to send email.


    This is to state, DMARC, as good as it is, isn’t perfect. But you can use it as
    another tool when forensically examining suspected phishing emails.


    # Other DMARC Resources


    Here are other resources on DMARC you can explore:


    +   - **DMARC Overview:** https://easydmarc.com/blog/what-is-dmarc-overview

    +   - **History of DMARC:** https://easydmarc.com/blog/what-is-dmarc-a-bit-of-history

    +   - **Understanding DMARC reports:** https://easydmarc.com/blog/understanding-dmarc-reports'
