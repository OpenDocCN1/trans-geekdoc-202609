    # Why Do Social Engineering Statistics Vary So Much?


    The main reasons different vendors report different social engineering statistics
    are the customers involved and the scope of the survey. Some vendors only include
    customers that they did direct business with. Some vendors work with mostly small
    businesses and others with large businesses. Some vendors specialize in particular
    industries, and others (like the UK report) are only surveying their country’s
    organizations.


    Another big reason is because, sadly, there is no agreed-upon standard set of
    initial root cause access categories. Many times, the vendors categorize a particular
    type of attack as a root access method when really it is the outcome of a root
    access method. For example, many vendors have a category called ransomware, remote
    access, or credential theft. All of those are outcomes of other root access methods.
    For example, if credential theft was involved, how did the credentials get stolen?
    I can tell you—probably through social engineering (although it can be other things
    too).


    The Privacy Rights Clearinghouse database has a category called HACK, which it
    defines as “Hacked by an Outside Party or Infected by Malware.” This doesn’t tell
    you almost anything about how that particular hack occurred. Was it due to social
    engineering, unpatched software, or something else? Many vendors have a category
    entitled “Malware” or “Ransomware.” Again, how did that ransomware or malware
    actually exploit that system to get on it? There is a good chance that if all
    vendors agreed to use the same category descriptions, their social engineering
    category percentages would be larger than they report today.'
