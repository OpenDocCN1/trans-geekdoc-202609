- pgno: 85
  md: 'The world''s early computer viruses, like Elk Cloner, Stoned, Pakistani Brain,
    and the Jerusalem virus, spread around the world, causing havoc in the days before
    the Internet existed as the Internet. The defender has to be nearly perfect in
    their defense. The attacker just needs to find one weakness to get in. There are
    literally tens of millions of new malware programs trying to break into places
    and tens to hundreds of thousands of malicious human hackers, all trying to see
    if they can exploit otherwise innocent people and organizations. Defending is
    so tough that no single person or organization appears to have done it right.
    The joking conventional wisdom is that for a computer to be completely safe it
    has to be encased in concrete and locked in a closet. Even then, you''d have to
    make sure its network is turned off. Defending is hard.


    # Compliance


    It''s not for a lack of advice and recommendations. Our world is full of excellent
    cybersecurity frameworks and guidelines. There are dozens of them, including the
    following:


    +   - NIST Cybersecurity Framework (NIST CSF)

    +   - ISO/IEC 27001 Framework

    +   - Center for Internet Security Controls (CIS)

    +   - Health Insurance Portability and Accountability Act of 1996 (HIPAA)

    +   - Federal Energy Regulatory Commission (FERC)/ North American Electric Reliability
    Corporation (NERC)

    +   - Sarbanes–Oxley Act of 2002 (SOX)

    +   - General Data Protection Regulation (GDPR)

    +   - Payment Card Industry Data Security Standard (PCI-DSS)'
