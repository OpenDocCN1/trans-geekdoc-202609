  md: '# CHAPTER 3


    # 3x3 Cybersecurity Control Pillars


    Chapter 3 will discuss compliance, risk management, defense-in-depth planning,
    and the concept of the 3x3 cybersecurity control pillars. If you are bored just
    thinking about compliance and risk management, this chapter is short and will
    go fast. But I guarantee you will learn something that will improve your cybersecurity
    career going forward. So, don’t skip it.


    # The Challenge of Cybersecurity


    Cybersecurity is among the most difficult jobs in the world. There are tens of
    thousands of threats trying to compromise any person, device, or network connected
    to the Internet. And it doesn’t even take the Internet to spread cyber threats.'
