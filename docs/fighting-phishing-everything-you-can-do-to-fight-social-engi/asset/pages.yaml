    a “surprise.” To clarify, everyone should receive “no notice” simulated phishing
    tests, but the fact that your organization does (i.e., performs “no notice” simulated
    phishing campaigns) should not be a surprise to anyone.


    # Frequency


    If simulated phishing is used, the program should only indicate the frequency
    (e.g., once a month, once a week, etc.), but not the specific dates. A policy
    statement should say something like, “Simulated phishing campaigns are used as
    part of our SAT program, and participants can expect a simulated phishing attempt
