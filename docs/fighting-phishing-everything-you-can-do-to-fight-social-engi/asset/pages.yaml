    # Building/Selecting and Reviewing Training Content


    Here are the processes you should go through when selecting or building content.


    # Selecting Content


    Selecting the right content for your organization can be a challenge. When you
    are planning for the entire year, it''s also important to mix up the types of
    content and include media like games and videos with the self-paced interactive
    eLearning, which, as already stated, should be the centerpiece of the program.
    Making sure that you use the steering committee to vet all of your possible choices
    for content as part of the campaign is also a best practice. Sometimes you might
    choose some edgy content or use humor to make a statement. Being able to say you
    had the buy-in of all of the steering committee members, just in case you do get
    some complaints, is always a good idea. HR will often want to'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'know why a certain content was chosen and what the process was for vetting
    that content. It''s often a good idea to have someone from HR on the committee
    or at least provide feedback in some sort of review.


    Don''t forget about diversity on your committee as well. If you look around the
    table and your entire steering committee is the same ethnic background and/or
    sex, start recruiting others to help you review from different perspectives. Make
    sure it''s clear you want their feedback about what others might find offensive
    or ineffective, even if they don''t, so you can have the focus be on learning
    the phishing content and not on other distractions.


    # Create or Buy?


    When it comes to deciding to build or buy training content, the answer is often
    not one or the other. Most effective training programs have both. The content
    you can buy very often has high-production value and proven efficacy. The content
    you can create yourself can be very customized, mentioning your company and involving
    people every employee knows.


    If you are doing monthly training, two of the monthly training lessons (out of
    the year) should focus on your environment and have very specific education for
    your organization. One great idea to further the buy-in with leadership is to
    have one of the organization''s leaders record a video talking about how important
    it is to the mission of the organization to report and not fall for phishing attacks.


    Most of the attacks are the same across many industries and organizations, so
    taking advantage of high-production value content created by any of the security
    awareness training content providers is a no-brainer these days. The cost is a
    fraction of what it would cost your organization to create it yourself. There
    is also some free anti-phishing content around the web, but in general, you get
    what you pay for.'
