    QR phishing has become very popular these days. Phishers will send out emails
    with QR codes instead of URLs because they more easily evade most content filters
    and users often seem more willing to go to QR code-enabled URLs. These days, it
    is very common for malicious QR codes to be sent posing as popular brands, such
    as Microsoft.


    It can be difficult to impossible to inspect a QR-encoded URL before your device’s
    browser heads there. So, you have two options. One, do not follow *any* untrusted
    QR codes. Two, if you do follow a QR code, pay attention to the destination URL
    where the QR code takes you.


    Users should be educated about malicious QR codes and how to investigate (i.e.,
    look at the resulting URL) and treat them. Organizations should perform simulated
    QR code tests, just like they do with simulated email phishing tests.


