    # Passkeys


    FIDO passkeys are a great improvement to login names and passwords. Any authentication
    labeled as FIDO (or FIDO2) is inherently phishing-resistant. FIDO passkeys aren’t
    the best, strongest authentication choice for every login scenario, but they are
    supported by the major OS vendors (e.g., Apple, Google, and Microsoft), and supported
    on the major cell phone platforms. If you aren’t using passkeys, it’s likely that
