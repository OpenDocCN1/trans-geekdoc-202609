- pgno: 170
  md: '# # CHAPTER 7


    # DMARC, SPF, and DKIM


    Chapter 7 covers DMARC, SPF, and DKIM in detail. Anyone involved in anti-phishing
    activities should understand the benefits of these three anti-phishing email standards.
    Every organization should have all three standards implemented for both sending
    and receiving email.


    This chapter is one of the longer chapters in this book, but it should be required
    reading for anyone not familiar with DMARC that is involved in fighting phishing.


    # ## The Core Concepts


    Domain-based Message Authentication, Reporting and Conformance (DMARC), Sender
    Policy Framework (SPF), and Domain Keys Identified Mail (DKIM) are related global
    anti-phishing standards that allow email receivers to verify if an email that
    claims to be from a'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'particular sending domain is really from the domain it claims. In short, it
    helps to prevent email domain spoofing. DMARC relies on SPF and DKIM. DMARC provides
    proactive protection even without either SPF and/or DKIM being enabled (although
    you’ll want both enabled to get the most complete protection).


    > The acronym DMARC can refer to just the DMARC standard by itself or can refer
    to the collection of all three related standards. Most of the time, you can figure
    out how it is being used depending on the overall context, although you may need
    to clarify that. In most of the places in this book, except in the specific DMARC
    section, when I use DMARC, I’m usually referring to the umbrella of all three
    standards.


    Email senders can use DMARC to protect their email domains from spoofing by spammers
    and phishers. Email receivers can use DMARC to verify that received emails were
    truly sent from the domains claimed. Every organization sending or receiving email
    should enable DMARC. With DMARC, email senders configure and publish their DMARC,
    SPF, and DKIM records (in DNS). Email receivers (e.g., email servers, email clients,
    mail user agents, mail transfer agents, mail delivery agents, etc.) can access
    those records and use them to verify emails claiming to be sent by related domains.


    > Email clients are known as mail user agents in email standards, and email servers
    and gateways are known as mail transfer agents. I’ll call them agents in this
    chapter.


    DMARC was created so that if an email claims it’s from microsoft.com, for instance,
    you can actually verify if it is really from microsoft.com. DMARC was intended
    to reduce, if not kill, malicious domain spoofing. And for the most part, it'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'has worked! Before DMARC came into existence, it was very common for a phishing
    email to lie about what domain it came from. And now, because of DMARC, most phishing
    emails do not try to claim that they came from a highly valuable, branded domain
    (like `microsoft.com`). They still have lots of little tricks where they absolutely
    still fool lots of victims into thinking they came from those valuable branded
    domains, but with just a little bit of inspection, potential victims can verify
    if the email did or didn’t come from the claimed domain. On that one point, DMARC
    has been a huge success!


    Today, DMARC is often enabled by default for systems receiving email but often
    must be manually enabled for sending email domains. I’ll tell you how to verify
    either way. But, if you are not sure whether your organization has enabled DMARC
    for both sending and receiving, verify it. And if it’s not enabled, enable it.
    There is no harm in enabling DMARC (if configured correctly), and it can be a
    significant tool in fighting phishing.


    On the negative side, DMARC has been so successful in what it does that phishers
    often use it. In fact, the percentage of phishers enabling and using DMARC exceeds
    legitimate domain usage (at least so far). This has significantly changed how
    we originally envisioned using DMARC to detect and mitigate phishing, but DMARC
    is still a fantastic tool in our fight against phishing. You cannot be a serious
    anti-phishing professional without understanding what DMARC is, how it works,
    and how you can use it to your benefit.


    # # A US and Global Standard


    DMARC is used throughout the world and is likely to become one of the US’s few
    required Internet security standards. To understand DMARC’s importance, you must
    realize that it’s very difficult to impossible to get a new Internet security
    standard'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'approved and then globally enforced. I’ve been reading about new, great, proposed
    Internet security standards for decades (e.g., IPSEC, DNSSEC, TLS, etc.), and
    although they may be proposed and accepted by a majority of Internet security
    experts as a good thing, they rarely are made a required standard.


    However, it seems DMARC is likely to become a required US standard in the near
    future. In the 2021 National Defense Authorization Act, it states the Department
    of Homeland Security (DHS) must implement DMARC US-wide. Well, what it actually
    states in statutory language is “...Homeland Security shall develop and submit
    to Congress a strategy...to implement across all United States-based email providers,
    [DMARC]...” (see Figure 7-1).


    SEC. 9006. STRATEGY TO SECURE EMAIL.


    (a) IN GENERAL.—Not later than December 31, 2021, the Secretary of Homeland Security
    shall develop and submit to Congress a strategy, including recommendations, to
    implement across all United States-based email providers, Domain-based Message
    Authentication, Reporting, and Conformance standard at scale.


    (b) ELEMENTS.—The strategy required under subsection (a) shall include the following:


    (1) A recommendation for the minimum-size threshold for United States-based email
    providers for applicability of Domain-based Message Authentication, Reporting,
    and Conformance.


    (2) A description of the security and privacy benefits of implementing the Domain-based
    Message Authentication, Reporting, and Conformance standard at scale, including
    recommendations for national security exemptions, as appropriate, as well as the
    burdens of such implementation and an identification of the entities on which
    such burdens would most likely fall.


    (3) An identification of key United States and international stakeholders associated
    with such implementation.


    (4) An identification of any barriers to such implementation, including a cost-benefit
    analysis where feasible.


    (5) An initial estimate of the total cost to the Federal Government and implementing
    entities in the private sector of such implementation, including recommendations
    for defraying such costs, if applicable.


    (c) CONSULTATION.—In developing the strategy and recommendations under subsection
    (a), the Secretary of Homeland Security may, as appropriate, consult with representatives
    from the information technology sector.


    FIGURE 7-1 Excerpt from the 2021 National Defense Authorization Act discussing
    likely future US enforcement of DMARC.


    The Defense Authorization Act is essentially telling DHS to assess implementing
    DMARC US-wide, but that’s the first step before forcing use. Budget impacts are
    even being required. Will'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'DMARC ultimately be enforced, and if so, to what minimal extent across US email
    providers? I''m not sure, but I''ve never seen another global Internet standard
    considered by the US government for enforcement. Even PKI and HTTPS are not US-enforced
    standards.


    Each year, more and more email senders and receivers are voluntarily enabling
    it, so statutory enforcement may not be needed. Still, it would be nice if DMARC
    was globally enforced somehow (and not just enforced in the US) to help get the
    stragglers onboard.


    > PCI DSS is “future dating” DMARC, SPF, and DKIM use. See: https://easydmarc.com/blog/dmarc-mandatory-for-pci-dss-compliance.


    OK, enough about the background of DMARC, let''s learn how to enable and use it.


    # Email Addresses


    To understand DMARC, you have to understand email addresses. All emails have multiple
    sender email addresses (or types) attached to them in different places. Some are
    easy to see, some are not. In most people''s emails, all the email addresses are
    the same. But marketing, auto-replies, spam, and phishing emails often have different
    email addresses listed in different locations in an email. You must understand
    the various email addresses and what they mean to best understand DMARC. Let''s
    start with an example of a legitimate email (see Figure 7-2).


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_174_0.png)


    FIGURE 7-2 Email excerpt showing sender''s email addresses.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Friendly From Name


    In Figure 7-2, I sent an email from my KnowBe4 corporate email account (i.e.,
    `rogerg@knowbe4.com`) to my personal email address. We can ignore the receiver''s
    email address for DMARC purposes. DMARC is all about the sender''s claimed email
    addresses. In Figure 7-2, the email address you see in the angled brackets is
    known as the `5322.From` email address, which we will cover shortly. The text,
    before the 5322.From email address, representing my formal name, Roger A. Grimes,
    is known as the _Friendly From Name_, _Friendly-From_, _Friendly Name_, or _Display
    Name_.


    The Friendly From name can be nearly any text. It is usually created when someone
    creates an email account in their email client (e.g., Google Gmail, Microsoft
    Outlook, Apple Mail, Mozilla Thunderbird, etc.) for the first time. You can update
    it anytime you like and it does not impact your real email address. People often
    update it as needed, due to marriages, divorces, name changes, fixing typos, etc.
    Your real email address needs to be unique on the Internet (in order to send and
    receive email across the Internet using it), but your Friendly From name can be
    nearly anything at any time. You can change it at will. What it says will not
    impact your email delivery beyond how it looks in an email.


    This is important to know for two reasons. First, it has nothing to do with the
    mechanics of sending and receiving email. It''s just something we can add to better
    identify who the email is from. Second, it can be a complete lie and not impact
    the email. I can say that I''m Bill Gates in the Friendly From field and my email
    will send and receive the same as if I had Roger A. Grimes there. It also means
    you absolutely cannot rely on what is in the Friendly From name. Hackers and phishers
    love that fact and often use it to fool suspecting victims.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 5322.From Name


    The 5322.From email address, on the other hand, although typed into our email
    client the same way as the Friendly From name, does matter. It must be unique
    on the Internet for someone to reply to an email that you sent. It’s called the
    5322.From email address because it was first defined in an early email Request
    for Comment (RFC) known as the 5322 RFC (www.rfc-editor.org/rfc/rfc5322) in section
    4.3. You may also see this email address called Display From, 5322.Display From,
    From Address, or P2 Sender. DMARC works with the domain specified in the 5322.From
    address. It’s one of two “real” email addresses every email has, although in this
    case, you can see it when you open the email. The second one we’ll discuss in
    a minute isn’t as easily visible when you first open or preview an email.


    Figures 7-3 and 7-4 show examples of two real-world phishing emails, each with
    a fraudulent Friendly From name and their 5322.From addresses.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_176_0.png)


    FIGURE 7-3 An example of a real-world phishing email with Friendly From name and
    5322.From email addresses called out.


    In Figure 7-3, the phisher’s “real” email address ends with the domain entertainingworkshop.com,
    while the Friendly From name claims to be from Apple@Service.com. This phishing
    email is claiming to be from Apple and so the phisher faked the Apple@Service.com
    email address. Many potential victims would see Apple@Service.com and think this
    email must have come from Apple. It didn’t. Further, the phisher’s 5322'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'email address contains the words “apple” and “icloudsupport.” All those mentions
    of “apple” and “icloud” probably convinced a lot of potential victims that this
    email was really from Apple when it was not. A real email from Apple would come
    from apple.com. Let’s look at another phishing example.


    Figure 7-4 shows the stark difference between the sender’s claimed Friendly From
    name (Ryan Campbell) and the 5322 .From email address (Don.Payanall@mobilebank247.org).


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_177_0.png)


    # FIGURE 7-4 An example of a phishing email showing the stark difference between
    the Friendly From name and 5322.From email address.


    The Friendly From name states this email is from Ryan Campbell, but the 5322 email
    address states it’s from someone called Don Payanal. Huh? It’s a pretty distinct
    difference and many emails that have these sort of disjointed email addresses
    are fraudulent. But not all.


    I’m not sure why the phisher didn’t change the Friendly From name to Don Payanal
    before they sent the phishing email in Figure 7-4 so it would look more authentic,
    but it must have to do with the state of their phishing automation tools. Most
    phishers are sending millions to tens of millions of phishing emails at once,
    as fast as their computers can send them. They feed the phishing automation tool
    millions of email addresses, and the tool sends out millions of phishing emails.
    You would think that a phisher’s email automation tool would be smart enough to
    “tie” the 5322 email address to the Friendly From name displayed. But alas, apparently
    not most of the time.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'When display names and both types of email addresses (we''ll cover the second
    type shortly) match, we say they are _aligned_. DMARC only cares that two real
    email addresses match (5322 and 5321, covered shortly). It doesn''t care about
    the Friendly From name. With DMARC, when the two real email addresses come from
    the same domain, they are considered aligned. The only entity that cares about
    the Friendly From name are humans, and we know that Friendly From display names
    can''t be trusted.


    Disjointed email addresses are very common in the spam and phishing (and legitimate
    marketing) worlds, but not very common in most individual people''s emails. Most
    people''s Friendly From names are their names (or something close) and their 5322
    .From addresses bear some resemblance to their Friendly From name (e.g., Roger
    A. Grimes and rogerg@knowbe4). But spam and phishing emails often have starkly
    different Friendly From names and 5322.From email addresses. They really stand
    out as not belonging to each other. When I see an email claiming to be from a
    person and it has a starkly different Friendly From name and 5233 email address,
    I start to suspect it''s a malicious email.


    However, it is important to note that many legitimate marketing emails also have
    disjointed email addresses, especially when they don''t want you to reply using
    the email address they used to send you the email. Figure 7-5 shows an example
    of a disjointed email address of a legitimate marketing email.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_178_0.png)


    # FIGURE 7-5 An example of a legitimate marketing email with disjointed email
    addresses.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Figure 7-5 is a legitimate email from the Wall Street Journal that I get into
    my email inbox each morning. It is from a reporter named Emma Tucker, but it is
    sent from an email address of access@interactive.wsj.com. If I reply to this email,
    it is very unlikely to go directly to Emma Tucker. And that’s on purpose and OK
    (most of the time). That’s how mass marketing emails work.


    The key points are that phishing emails often have starkly, unexplained, disjointed
    email addresses (as demonstrated again in Figure 7-6), and they are doing so to
    be intentionally deceptive to potential victims. A disjointed email address doesn’t
    absolutely always mean that the sender intends to be malicious, but a disjointed
    email address along with other likely malicious signs and symptoms is something
    to be concerned about.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_179_0.png)


    FIGURE 7-6 Real-world phishing email claiming to be from Netflix, but with a 5322.From
    email address of support@toofav.com.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Oftentimes the domains involved in a phishing email are made up on the fly
    by the millions because the phishers use dynamic DNS services or “borrow” (i.e.,
    use maliciously) otherwise innocent domains. The `toofav.com` domain shown in
    Figure 7-6 is a legitimate domain, and it is a legitimate website selling items
    much like Amazon does. Years ago, when this phishing email was sent, it was temporarily
    taken over by a phisher for use in their phishing campaign but was eventually
    recovered by the legitimate owner. The process of legitimate domains being stolen
    and used by phishers in a scam campaign happens thousands to tens of thousands
    of times a day.


    For now, just know that DMARC cares about the 5322.From domain address and not
    at all about the Friendly From display name.


    # 5321.MailFrom Email Address


    Another, important “real” email address that is in every email is the 5321.MailFrom
    email address (also known as MAIL FROM, smtp.mailfrom, P1 Sender, Return-Path,
    and Envelope Sender). Most users can’t readily see this email address in their
    email client unless they choose to reply to an email they were sent. Then the
    email address that auto-populates the reply email is the 5321.MailFrom email address.


    Many times, especially in regular, individual user emails, the 5321.MailFrom email
    address matches the 5322.From email address. They are aligned. Unfortunately,
    this is also true in phishing and malicious emails, but they can be different
    (as shown in Figure 7-6).'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'SPF cares only about the 5321.MailFrom email address domain. When the 5321
    email address domain matches the 5322 email address domain, we consider the real
    email addresses aligned. Again, as with 5322 email addresses, many legitimate
    mass marketing emails have different 5321.MailFrom and 5322 .From email addresses.
    For example, in Figure 7-7, the 5321 .MailFrom email address is 10point@wsj.com,
    and the 5322 .From email address is access@interactive.wsj.com.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_181_0.png)


    # FIGURE 7-7 Legitimate mass marketing email showing aligned 5321 and 5322 email
    addresses because they share the same domain.


    It''s key that both the 5321 and the 5322 email addresses, although different,
    are coming from the same legitimate domain (i.e., wsj.com). They are aligned.
    This is something DMARC cares about.


    To resummariize, SPF focuses on verifying the 5321 .MailFrom domain address. DKIM,
    which we will cover shortly, is concerned with ensuring that the message was sent
    by the domain specified in the DKIM signature (usually the 5322 domain) and was
    not altered between source and destination. DMARC wants the 5322.From domain address
    to match the DKIM domain used to sign the email. DMARC cares about SPF and/or
    DKIM passing and aligning. In other words, for DMARC to succeed and be marked
    as a pass, SPF and/or DKIM must be validated and the authenticated domain must
    match (i.e., align)'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'with the domain in the visible 5322.From address. This part can be confusing
    to some. Just know that DMARC wants the 5321 and 5322 email domains to match.
    The entire email address doesn’t have to match, just the domain portion.


    Of course, in the world of malicious emails, all the included email addresses
    and domains can be completely faked. Sometimes phishers don’t care that they aren’t
    real or aren’t aligned. They don’t care if they fail DMARC. They use fake email
    addresses to get their phishing message to potential victims and then hope the
    potential victim clicks on the embedded link or downloads the attached file. But
    DMARC allows you to determine if the sending domains being claimed were truly
    the sending domains. No more, no less.


    # HELO Email Domain


    When two email servers (or clients, agents, etc.) connect, they will usually send
    an SMTP command known as HELO (or EHLO). This is the way two “mail transfer agents”
    (as they are known in the SMTP RFCs) say hello and connect to each other. Usually,
    the sending email agent says HELO followed by their valid domain name. The receiving
    agent will record the sender’s domain in its security logs and, if it is an email
    server receiving emails from that sending server, will often place the sending
    server’s domain in each of the email’s (from that domain) headers. Thus, an email
    header will often have at least three email domains listed in it: 5321, 5322,
    and the HELO domain. Each of these can be used when forensically investigating
    emails.


    # Sender Policy Framework (SPF)


    When SPF is enabled and enforced, receiving email servers or clients can use it
    to verify the claimed 5321.MailFrom email address domain. For example, if I send
    you an email from'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'rogerg@knowbe4 .com and claim that is my 5321.MailFrom email address, SPF can
    be used to verify if that email really came from an email server authorized for
    the knowbe4 .com domain.


    SPF must be first enabled on the email sender’s side using a DNS record called
    a “TXT record.” The TXT record for SPF is formatted similarly to:


    ```

    ```

    domainname IN TXT "v=spf1" ip4:publicIPAddressofemail

    server -all"

    ```

    ```


    For example, if the sending email domain you were trying to protect was called
    knowbe4 .com, your SPF record might look like the following:


    ```

    ```

    knowbe4.com. IN TXT "v=spf1 ip4:18.160.60.106 -all"

    ```

    ```


    In this instance, 18.160.60.106 would be the public IP address of the email server/service
    authorized to send email on behalf of the knowbe4 .com domain.


    There must be a separate TXT record in DNS for each protected domain name. You
    can also specify ip6: if you want to use IP version 6 addresses instead of IP
    version 4 addresses. The IP address can also be multiple IP addresses, a range
    of IP addresses, and a CIDR IP address range like 192.168.1.0/24 if you want to
    cover a large consecutive range of IP addresses. You can also include other domain
    names as desired that are officially allowed to send emails on behalf of your
    domain, which is often the case with legitimate businesses using very large email
    vendors (like Microsoft and Google) or marketing firms. If so, you can configure
    SPF to allow sending from “third-party” domains using the following syntax, which
    has an “include” statement:


    ```

    ```

    v=spf1[ip4/6:] [publicIPAddressesofemailservers]

    [include:[3rdpartydomainnames]] -all

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'A SPF DNS record can be quite lengthy. Here’s a partial excerpt of KnowBe4’s
    SPF record:


    ```

    Knowbe4.com IN TXT "v=spf1 include:mailsenders .netsuite.com include:_spf.google.com
    include:mail .zendesk.com include:stspg-customer.com mx:spf .intercom.io ip4:23.21.109.212
    ip4:23.21.109.197 ip4:52.49.201.246"

    ```


    > This book can’t go into all the intricacies of an SPF DNS record, but know there
    are many variations. But these examples are good representative examples to begin
    with if you are new to SPF.


    KnowBe4’s SPF record is about as complicated and lengthy as they come. It is essential
    that SPF senders state all the permitted third-party senders who can send email
    on behalf of the covered protected domain. KnowBe4’s SPF record includes Oracle
    Netsuite, Google (we are corporate Gmail users), Zendesk (our help desk software),
    and many other “permitted senders” as identified by domain name or public IP address.
    We have a lot of “third party” senders that can send mail on our behalf. Senders
    are identified by the public IP address(es) of the involved email server(s)/service
    and domain names.


    You can see a graphical, expanded view of KnowBe4’s SPF record by running EasyDMARC’s
    SPF checking tool here: https://easydmarc.com/tools/spf-lookup?domain=knowbe4.com.
    You’ll see we have over a dozen permitted senders who can send on KnowBe4’s behalf.
    If you are interested in what your organization’s SPF record might look like and
    if you don’t already have an SPF DNS record, you can run a graphical SPF tool
    that generates SPF DNS entries, such as EasyDMARC’s SPF generating tool: https://easydmarc.com/tools/spf-record-generator.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Here’s how SPF verification works. Anyone (actually their receiving email client,
    server/service, or agent on their behalf with SPF validation enabled) getting
    an email claiming to be from a particular 5321 domain can validate that email’s
    claimed 5321 domain. The receiving agent retrieves the sending email server’s
    SPF record from the sender’s DNS server and compares the information in the provided
    SPF record to the email’s claimed 5321 domain information. Again, the SPF record
    states what email servers (by IP address or domain name) are allowed to send email
    on behalf of that particular domain. If the comparison information matches, then
    the SPF check is a “PASS.” If they don’t match, then the SPF check is a “FAIL.”


    Most people’s email servers or clients are already doing SPF checks today whether
    they know it or not. To verify, all the user has to do is open up any email that
    they have received, look at the email header, and look for text that says “SPF=.”
    It will likely say “PASS,” “FAIL,” “NONE,” or something similar. Having any SPF
    validation message means the client agent (or some other agent in the receiving
    pathway) has SPF validation checking enabled.


    Figure 7-8 shows an example of an email which was an SPF pass.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_185_0.png)


    FIGURE 7-8 An example of an SPF pass.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'An SPF pass doesn’t mean that the email isn’t malicious. Many malicious emails
    pass SPF checks. It simply means that the email claimed a particular 5321 email
    address domain and SPF verified that it was or wasn’t sent by an email server/service
    authorized for that domain.


    Figure 7-9 shows an SPF check failure on a real-world phishing email.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_186_0.png)


    # FIGURE 7-9 An SPF check failure on a real-world phishing email.


    In Figure 7-9, you can see “spf=fail” on the first line of the header excerpt.
    The phishing email was trying to claim that its 5321 email domain was accountprotection.microsoft.com
    and it was not. Further, the email header indicates the email was really sent
    from the sim-networks.net domain instead.


    SPF failures aren’t always malicious. It can also be because the sender did not
    set up their SPF DNS records correctly. In fact, this is quite common. Still,
    if you suspect an email is a phishing email because of other reasons, failing
