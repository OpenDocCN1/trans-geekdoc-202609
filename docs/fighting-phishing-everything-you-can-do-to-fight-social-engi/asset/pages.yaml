    job sites (e.g., Indeed, Monster, Ziprecruiter, LinkedIn, etc.), or the resume
    of the person seeking employment and their contact information was located on
    a real job site and then used by the hacker.


    When the intent is financial gain, the hacker contacts the victim posing as a
    potential new employer, usually offering up the victim''s dream job: perfect job
    description, high paying, flexible, offering great benefits, etc. The hacker may
