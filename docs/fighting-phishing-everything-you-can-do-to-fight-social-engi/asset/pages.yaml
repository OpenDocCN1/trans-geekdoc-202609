- pgno: 303
  md: 'In this chapter we will discuss the three parts of building a security awareness
    training program:


    +   - Designing an effective security awareness training program

    +   - Building/selecting and reviewing content

    +   - Deploying and maintaining that content


    # Designing an Effective Security Awareness Training Program


    Seven main concepts go into designing and maintaining any training program,including
    security awareness training programs:


    +   - Set program objectives.

    +   - Get leadership support.

    +   - Form a steering Committee.

    +   - Decide on frequency (i.e., cadence) and amount of time allocated to training.

    +   - Do an audience analysis.

    +   - Make sure you have accessibility.

    +   - Do a regular reassessment of the training program and content.


    This is an ongoing process that should be repeated and refined every 12 to 18
    months as part of the overall planning for security and compliance training.


    # Set Program Objectives


    You must first determine what your security awareness training program will look
    like and how it will fit into the wider context of compliance and cybersecurity
    before building and/or selecting'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'content that has been created by a vendor. These two steps are often reversed
    by new program administrators. Although the old saying that “content is king”
    is true, determining the scope of the program before selecting or creating content
    is an important prerequisite. Great content can make a difference in engaging
    users and making learning relevant for them, but spending time on what the objectives
    and guidelines for the program should be will inform the selection and make for
    a more successful security awareness training program. Luckily, there are a lot
    of choices out there for high-quality content in various formats and some great
    tools for building your own content to supplement any content library. But this
    variety of choices can be overwhelming if you first start with content. So, starting
    with the overall training program design is the best practice and will narrow
    the content selection greatly.


    Why are you starting or running an anti-phishing program? What do you hope to
    accomplish? You must start with documenting these objectives and getting everyone
    involved to agree on those objectives. The objectives must be clearly defined
    and measurable. Some programs, sadly, might set the objective as simply creating
    a security awareness training program because it’s required by regulatory or compliance
    requirements. The best programs have an objective that includes “significantly
    decreasing cybersecurity risk through education” or something like that. Another
    common objective is to decrease the number of negative employee interactions (i.e.,
    “failures”) with phishing emails or to increase the percentage of phishing attempts
    reported to IT. Another could be “to deliver required annual compliance education
    using a common delivery method.” There are many reasons for creating or operating
    an anti-phishing program. What are yours? Begin by documenting them, getting agreement
    from the major parties involved, and then making sure whatever you do in the program
    supports the objectives.'
