    # # Domain-based Message Authentication, Reporting, and Conformance (DMARC)


    DMARC helps a sender indicate to a receiver how the receiver should treat emails
    claiming to be from the sender’s domain that fail SPF and/or DKIM (i.e., none,
    reject, or quarantine). DMARC also allows the sender to indicate to receivers
    if they would like to receive DMARC reports and, if so, in what amount of detail.
    DMARC is configured and enabled by email senders by creating another TXT record
    in DNS. Email receivers can download the DMARC DNS record and use it for DMARC
    validation.


    # ## DMARC Failed Email Treatment


    The most important thing DMARC allows a sender to do is to instruct receivers
    of emails claiming to be from the sender’s protected domain about how to treat
    emails that fail SPF and/or DKIM validation checks. A DMARC failure can be from
    an SPF failure, a DKIM failure, or both. In some DMARC instances, an email domain
    not having SPF or DKIM enabled could be treated as a failure. A DMARC-sending
    domain can instruct a receiver to treat a failed email with one of three policies:


    +   - None

    +   - Quarantine

    +   - Reject'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'A DMARC sending domain can instruct a receiver to accept a failed email as
    it would any other email regardless of the failure (this is from a DMARC policy
    instruction stated as *None*). *None* isn''t a good DMARC policy instruction to
    use most of the time because it defeats the main purpose of using DMARC, SPF,
    and DKIM. However, it can be used during the initial setting up, for troubleshooting
    DMARC issues, and to allow a sender to receive DMARC reports without blocking
    any failed emails.


    The most common DMARC policy instruction is *Quarantine*. This instructs the receiver
    to place failed emails in the user''s Spam, Quarantine, Junk Mail, or other similar
    folder, where it can languish until it is deleted or undergoes more inspection.
    The receiving email server/service can even place it in an administrative folder
    to undergo automated or manual inspection at the server level. The quarantine
    policy option concept is that a failed email undergoes further inspection or is
    marked as suspicious so either the user or admin can further inspect it.


    The most secure DMARC policy instruction is *Reject*. This instructs email receivers
    (such as email servers/services, email gateways, mail transfer agents, etc.) to
    delete the failed email and make sure it does not end up in the user''s email
    client inbox. In theory, this is where all DMARC senders want their policy to
    be set. But there are all kinds of reasons that legitimate email will fail DMARC,
    SPF, and DKIM checks (e.g., misconfigurations, expired digital certificates, domain
    name changes, new domains were not accounted for in DMARC policy, etc.), and most
    companies find the Quarantine policy instruction to be a safer risk-reward choice.
    That way, any legitimate emails that fail DMARC checks can still possibly be viewed
    and recovered by the user if they look in their quarantine folder. But in theory,
    every DMARC sender wants to eventually get their DMARC policy set to Reject in
    practice when they are ready and mature enough.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'It’s also possible for a DMARC record to not be configured or be in an error
    state that cannot be located or followed. The DMARC record can be marked as missing,
    not found, or in error (e.g., permerror or temperror) in email headers when it
    applies.


    You can check on an organization’s DMARC policy using DNS queries or an online
    DMARC checker, such as this one: https://easydmarc.com/tools/dmarc-lookup. Figure
    7-15 shows KnowBe4’s DNS DMARC record.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_194_0.png)


    # FIGURE 7-15 KnowBe4’s DMARC DNS record as shown by an online DMARC lookup tool.


    As you can see in Figure 7-15, KnowBe4’s DMARC policy is set to quarantine. This
    is because we have a very rapidly changing set of domains and IP addresses from
    which we send emails (including simulated phishing tests). It is very easy for
    our sending email domains to get out of synch from our published DMARC policy,
    so we choose quarantine as our default DMARC policy instruction.


    Another DMARC policy setting you might see is BestGuessPass, which means the sending
    domain did not have a DMARC policy set, but the involved validating receiving
    domain services think the sending domain is likely legit. Don’t rely on this statement
    and treat all emails with a BestGuessPass outcome as None or invalid. Many phishing
    emails have a BestGuessPass DMARC outcome.


    You can see the DMARC verification status of any email by opening its header and
    looking for the dmarc= statement. Figure 7-16 shows an example DMARC verification
    outcome from a real-world phishing email.'
