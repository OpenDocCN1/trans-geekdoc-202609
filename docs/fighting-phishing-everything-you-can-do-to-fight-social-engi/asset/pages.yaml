- pgno: 368
  md: '# # How to Defend Against Spear Phishing


    There are three main defenses: prevention, policies, and education. If you can
    prevent spear phishing from getting to people that''s the best plan. It''s really
    hard to do because, as demonstrated above, spear phishing comes in using all sorts
    of messaging channels (e.g., social media, voice calls, etc.) and not just email.
    We aren''t doing a great job of preventing phishing emails, and they are almost
    impossible to prevent on other communication mediums. But wherever and however
    you can, you should try to prevent spear phishing attempts from reaching people.


    Second, create policies and education that encourage employees not to share professional
    information in public areas. For example, don''t allow vendors to publicize that
    they are working with you on a new big project until that project is through.
    Educate people about spear phishing attacks. Tell them to be smart and to limit
    what they share on public forums. For some organizations and professions, policies
    should strictly prevent employees from sharing private company information publicly.


    But it mostly comes down to education. You have to educate everyone about the
    huge threat that spear phishing attacks are in the first place and how stopping
    them is the most important defense they can provide to themselves and the organization.


    Teach co-workers to be suspicious of any new request arriving asking them to perform
    potentially dangerous actions, even if that request comes from a trusted source
    or appears to have insider information. Phishing sophistication has moved on from
    the early days when strange email addresses and typos could be the primary indicators
    of a phishing attack. Create a healthy culture of skepticism, where every co-worker
    confirms any unexpected request using a known legitimate method before performing
    the action. The key is to let your co-workers know'
  merge: -1
  img_proc: true
