  md: '# # SAT Rhythm of the Business


    Every organization needs to decide upon the organization’s “rhythm of the business”
    for deploying SAT content. If your organization has not decided on an appropriate
    rhythm or is trying to improve it, a common rhythm of the business is this:


    +   - All new employees (and contractors and consultants) are given longer SAT
    training (e.g., 15 to 45 minutes) when hired and annually thereafter.

    +   - Shorter SAT training sessions (e.g., 1 to 5 minutes) are given at least
    once a month.

    +   - Simulated phishing tests are performed at least once a month.

    +   - More training and simulated phishing as indicated by previous successes
    and failures.


    Training and simulated phishing should be done at least once a month. The SAT
    programs that reduce the most risk do weekly training and simulated phishing.


    SAT programs should mix up the messaging and types of content over time. Figure
    11-5 shows an example of an SAT program.


