    # # Honeypots and Canaries


    In the cybersecurity world, a honeypot is a non-production computer device or
    application solely intended as a potential hacker or malware target. Its intent
    is to be reachable and accessible to a hacker or malware. It''s a non-production
    asset, so once fine-tuned, nothing legitimate in the production environment should
    connect or use it. Honeypots can be an excellent, early warning system to help
    defenders be aware of threats that might have otherwise so far escaped detection
    and mitigation. Common honeypots are workstations, servers, and network routers.


    A canary is a computer or data item intended solely as a way to detect malicious
    activity. A common canary could be one or more fake email or logon accounts, which
    should never be'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'accessed or used by a legitimate production system. But if found being used
    or leaked in some way, it could indicate malicious activity. For example, KnowBe4
    might create a fake email account called `fred_flintstone@knowbe4.com`. It’s a
    fake account, and besides being created, it is never used or published by anyone
    within KnowBe4. But if KnowBe4 IT detects spam or phishing emails suddenly being
    sent to `fred_flintstone@knowbe4.com`, it might be correct to theorize that somehow
    external attackers had gained access to internal email address lists. Both honeypots
    and canaries are part of what is known as *deception technologies*.


    Every midsize or larger organization should take advantage of and deploy deception
    technologies. Deception technologies are relatively low-cost. You can take an
    old computer or device and redeploy it simply as an early warning deception technology.
    There are dozens of open-source software tools and commercial options. Some of
    the better-known commercial vendors include Attivo Networks, Inc.; Cymmetria;
    Illusive Networks; Thinkst; and Trapx Security.


    A common honeypot scenario is to have a fake database server on the network near
    the other real production database servers. The fake honeypot database server
    should be named similarly to the real servers and potentially even have real data
    on it. Its only purpose in life is to sit otherwise unused waiting for an aberrant
    connection to alert on. In today’s noisy networks, all computers and devices get
    dozens to hundreds of unwanted but legitimate connection attempts. They happen
    all the time, sometimes thousands of times a day. That’s the way today’s networks
    work. They are very “noisy,” with servers and workstations constantly sending
    out otherwise unwanted connection attempts. Those unwanted, but legitimate connection
    attempts need to be filtered out so they don’t create alerts. But once all the
    legitimate connection attempts are filtered out, any new unexpected connection
    attempt should create an alert that is investigated to its'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'conclusion (i.e., a malicious connection that must be investigated and mitigated
    or an otherwise innocent connection attempt that must be added to the legitimate
    filtered list).


    Larger organizations should have several honeypots of different types of canary
    records and data items all throughout the organization. You want deception technology
    to be a routine and normal part of your defense-in-depth cybersecurity plan. Deception
    technology is low cost and high value. It can often be the only cyber defense
    detecting malfeasance after it has bypassed all other defenses.


    # Highlight New Email Addresses


    This is a feature I have not seen fully implemented in any email client, but I
    mention it here because I think its widespread implementation could prevent a
    lot of successful phishing attacks. It was a feature suggested to me by my very
    smart friend, Loren Kohnfelder, founder of PKI, and author of Designing Secure
    Software: A Guide for Developers (https://designingsecure software.com). You can
    find his Wikipedia page at https://en.wikipedia.org/wiki/Loren_Kohnfelder.


    Loren suggested that every email client be given a feature that tracks all incoming
    and used email addresses and warns the user when they are seeing/using a brand-new
    email address for the first time. The idea is that many phishing emails originate
    from new, look-alike email addresses, which are very similar to the real person’s
    email address, but are not that person’s real email address. Users often get tricked
    into responding to these new email addresses and don’t notice that the email address
    being used is brand new (at least to them). Loren suggests that every local email
    client keep track of every previously used email address and alert the user when
    they are responding to or using'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'a new email address for the first time. Perhaps, a colored banner frames the
    email the user is typing or responding to. Over the years, I have seen similar,
    partially-implemented features in various email clients. However, none were fully
    implemented and tracked all email addresses received or sent by an email user.


    And as much as I love this idea, I''m fully aware that it, by itself, is not a
    100% reliable solution. Phishers often compromise the user''s email accounts and
    use the victim''s true, real email address. And because so many email addresses
    would be new to any particular email user, a large percentage of users would become
    accustomed to seeing the banner warning them about using a new email address and
    be likely to miss the warning when they need it most. Still, this feature, to
    those who pay attention and use it, could help avoid many instances of otherwise
    successful phishing. I only hope that one day an email client fully implements
    it or someone creates a software package as an add-in to one or more email clients.


    # Fighting USB Attacks


    Universal Serial Bus (USB) devices are commonly used by social engineers to gain
    malicious access or to launch malware into a new environment. A common scenario
    is the social engineering “littering” an organization’s parking lot with maliciously
    modified USB keys. One or more organization employees pick up the USB storage
    drives and plug them into their computers. They are then tricked into launching
    an executable or opening a document which then launches malicious content. Another
    common scenario is when an employee of a particular organization is targeted by
    a social engineer and is being sent by postal mail what otherwise looks like a
    USB key from a legitimate vendor. For example, perhaps it appears as if Microsoft
    is emailing the'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'potential victim a free, branded, USB key celebrating a popular Microsoft conference.
    The victim thinks it’s a free gift from a trusted vendor. And again, the potential
    victim is tricked into executing malicious content.


    There is also a scenario where a disgruntled employee intentionally places malware
    into their organization on purpose. It can be part of an insider attack where
    the user is not a victim but is the attacker. It can be because the employee who
    was paid (or under a promise of future payment) uses a USB key to place malware
    inside the organization for an external attacker.


    All organizations should be aware of the threat posed by external storage devices,
    especially USB keys, and train their employees appropriately. All employees should
    be made aware of the threat of unverified USB devices (really any device that
    can be used to launch malicious content) and common social engineering attacks.
    Most organizations need to implement technical defenses that restrict how USB
    keys (and other devices) can be used on organization devices and networks.


    Many defenders do simulated phishing tests using USB drives dropped in the parking
    lot or common areas of their organization. This should be periodically done by
    any sufficiently capable organization and used as part of the education process.
    KnowBe4 has a feature and tool (www.knowbe4.com/usb-security-test) that creates
    these sorts of simulated USB keys and will track which employees open them, run
    active content, and provide login credentials in response to them. Most of our
    customers who have used our USB key test feature report employees who fall for
    the simulated social engineering attack. Don’t let real-world hackers be the only
    people who test your employees’ responses to randomly found USB drives.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Phone-Based Testing


    Many social engineering scams come via phone calls. Doing periodic simulated phone-based
    social engineering should be part of any cybersecurity defense plan. In the real
    world, a large majority of these vishing scams involve attempts to gain logon
    access to confidential systems but can involve trying to access confidential information
    (e.g., W-2 information, contract details, etc.). Just like you should do with
    all other forms of social engineering, employees should be educated about such
    attacks and taught how to recognize, mitigate, and report them.


    # Physical Penetration Testing


    Lastly, many social engineering attacks happen by a person physically gaining
    access to an organization’s physical building. With real-world attackers, unauthorized
    access can be accomplished for a variety of reasons, including accessing an organization’s
    computer assets, accessing confidential information, causing physical damage,
    harming a person, or stealing equipment.


    All organizations should have physical and logical security controls to prevent
    unauthorized physical access and periodically test those controls. Many organizations
    hire external professional penetration testing teams to see if they can successfully
    gain access. However, if a physical penetration test is to be performed, make
    sure to define what is and isn’t allowed by the penetration testing team. There
    have been some examples of penetration testing teams seemingly exceeding their
    agreed-upon in-scope objectives and law enforcement being involved. Always make
    sure to detail what is and isn’t in scope for a physical penetration test.'
  merge: -1
  img_proc: true
