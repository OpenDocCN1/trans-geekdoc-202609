    +   - **Email Security and DMARC:** https://easydmarc.com/blog/category/blog/email-security/dmarc

    +   - **Understanding DMARC Better:** www.linkedin.com/pulse/understanding-dmarc-better-roger-grimes

    +   - **DMARC Explained in Plain English:** www.youtube.com/watch?v=UAWurm5ANQg

    +   - **DMARC Explained:** www.youtube.com/watch?v=auOyF4HIEJM


    # Summary


    DMARC, SPF, and DKIM are global anti-phishing standards that can be used to prevent
    domain spoofing in emails. DMARC may become a US national or regulatory requirement
    in the near future. SPF works by verifying the 5321.MailFrom email address, and
    DKIM works by verifying the 5322.From email address. SPF does this by using a
    specialized DNS record. DKIM uses DNS along with digitally signing sent emails.
    DMARC allows senders to choose the treatment (e.g., accept, reject, or quarantine)
    for emails claiming to be from their domain and to select reporting modes. DMARC,
    SPF, and DKIM have been successful in stopping most email domain spoofing. However,
    phishers have largely adopted DMARC, SPF, and DKIM, so most phishing emails will
    pass the checks. Still, when DMARC, SPF, and DKIM are used, the phishers cannot
    as easily use or spoof the domains of well-known brands and domains. Anti-phishing
    defenders should use DMARC, SPF, and DKIM to help fight'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'phishing emails. All defenders should make sure that DMARC, SPF, and DKIM are
    enabled for both sending and receiving emails.


    Chapter 8, “Network and Server Defenses,” will cover additional tools and services
    that can be deployed at the network and server level to fight social engineering
    and phishing.'
