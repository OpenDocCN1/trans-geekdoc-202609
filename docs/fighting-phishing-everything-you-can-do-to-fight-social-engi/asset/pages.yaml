    # Smishing


    Smishing is phishing via SMS text. SMS stands for short messaging service. It
    is not the only type of texting service you can get on a cell phone, but it is
    the most popular. For many people, SMS is texting and vice-versa. SMS is very
    commonly used by phishers to send social engineering messages. Figure 2-7 shows
    a common example of smishing.


    Smishing messages often include strange-looking URL links. On the positive side,
    what you see as the link in an SMS message is what that link is. You don’t have
    to hover over the URL link to see what the link really links to (like you do in
    email and on the web). But on the negative side, smishing phishers often use “shortened”
    URLs. These URLs will begin with a shortened service’s main domain name (e.g.,
    bit.ly, g.co, t.co, etc.), followed by either some randomly-generated string of
    characters or some text as chosen by the person who generated the shortened link.
    In Figure 2-7, the phisher generated a shortened link that included the words
    “verification” and “Venmo” to make their fraudulent Venmo smish seem more realistic.
    When the user clicks on or opens a shortened URL link, it then takes the user
    to the original, expanded, URL the shortened link was representing.


    SMS messages can originate from phone numbers (which are not that hard to get
    or fake for an attacker) or using what is known as short codes. Short codes are
    4- to 6-digit numbers issued by the Common Short Code Administration (CSCA). Figure
    2-8 shows an example of a smishing message using a short code.'
