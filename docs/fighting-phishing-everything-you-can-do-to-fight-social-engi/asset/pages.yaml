    # ## Baiting


    Baiting is a social engineering tactic that plays on human curiosity and the desire
    for quick gratification. It can be applied to any social engineering and phishing
    scenario but is often mostly applied to physical types of social engineering.
    A common example is a hacker leaving a maliciously modified USB drive in the parking
    lot of a company, waiting for an employee to plug the drive in to see what’s on
    it. Once in a penetration test, I littered a company’s parking lot with USB drives
    that were externally labeled “Pending Layoffs”. Employees were plugging in the
    drives before I could even get back to my office.


    # ## QR Phishing


    Quick response (QR) codes can be used in social engineering and phishing schemes.
    Figure 2-11 shows a QR code.

    A QR code is a barcode-like image that can be used to encode text, numbers, and
    symbols, but is most frequently used to encode URLs. Social engineers like to
    place them in physical and virtual'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'locations to see how many people they can trick into going to the malicious
    URLs they represent. A common sophisticated scheme is for fraudulent QR codes
    to be placed over legitimate QR codes in scenarios where doing so has a high chance
    of fooling the user.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_80_0.png)


    FIGURE 2-11 An example of a legitimate QR code.


    For example, I’ve heard of a fraudulent QR code being placed over a legitimate
    business’ QR code placed on a window on the street outside of the business. The
    business’ real QR code was just a link to the business’ legitimate URL. But the
    fraudulent QR code took potential victims to a fake look-alike website that prompted
    them for their credit card information to supposedly get a heavily discounted
    deal. Another common QR code scam is when phishers place their QR codes over a
    city’s QR code placed on city public parking meters. The fake QR code entices
    the victim to make a parking meter payment, using their credit card, to the fake
    website.


    The only real defense for anyone following a QR code is to look at the eventual
    destination URL to determine if it is legit or not. We will cover this in detail
