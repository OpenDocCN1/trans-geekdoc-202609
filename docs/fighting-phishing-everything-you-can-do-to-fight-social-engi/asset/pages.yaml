    # FIGURE 13-16 A real-world example of a phishing message pretending to be associated
    with a video on CNN.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_342_0.png)


    # FIGURE 13-17 An example of a real-world phishing URL pretending to be from Microsoft.


    All of these examples had in common URLs that contained key branded words, but
    those words were not the official DNS domains used by the related brands. Users
    must always be on the lookout for look-alike DNS domains.


    # Strange Origination Domain


    Expect major brands (e.g., Microsoft, Google, AT&T, McDonald’s, etc.) to use their
    own legitimate domains when sending out emails and marketing. Major brands will
    usually not use third-party domains to send out marketing emails. Figure 13-18
    shows an example of a strange domain associated with a major company.'
  merge: -1
