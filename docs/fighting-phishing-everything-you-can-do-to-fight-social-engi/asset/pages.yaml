- pgno: 247
  md: '![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_247_0.png)


    # FIGURE 9-3 An example of a browser notification instance asking for permission
    to send browser notifications.


    Each site or app wanting to send notification messages to a user must first ask
    permission, in what is known as the notification request message (which is what
    is shown in Figure 9-3). If the user clicks on “Allow,” that site or application
    can send notification messages to the user (outside of the site or application)
    whenever they want. If the user clicks on “Cancel” instead, the site or application
    will not be able to send notification messages and cannot ask again. If the user
    just hits escape and/or doesn’t make a selection, the site or application can
    ask again the next time the user visits the site or application.


    If approved, browser and operating system notification messages can end up being
    used maliciously to send phishing messages. Every user should block browser and
    operating system notification messages when possible (unless you want to see them
    and can manage to pick out which ones are legitimate and which ones may be phishing
    attacks). Browsers and operating systems that support the notification standard
    allow users (and admins) to block or allow all notification messages by default,
    or to allow or block notification messages from particular sites and applications.
    Figure 9-4 shows an example of notification settings in Microsoft Edge.


    Each browser and operating system that support notification messages have their
    settings in a different place, but in Microsoft Edge, they are under Settings,
    in Cookies and site permissions. As you can see in Figure 9-4, some specific sites
    have been intentionally blocked and one application, Facebook Messenger, is specifically
    allowed. Users and administrators can manually'
