- pgno: 343
  md: '![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_343_0.png)


    # FIGURE 13-18 An example of a real-world phishing email address.


    In Figure 13-18, the email was pretending it was from the world''s largest shipping
    and shipping container company, Maersk. But the email''s origination address was
    from a DNS domain, onlinealxes.com.pl. If this email was really from Maersk, it
    would be from maersk.com.


    It is possible for a major brand to send out marketing that appears to come from
    some other domain, but most major brands are going to go out of their way to include
    their legitimate DNS domain so that receivers trust it more and don’t think it’s
    a phishing email.


    # Hover, Bait, and Switch


    It is solid, firm advice for everyone to “hover” their cursor over a URL link
    to inspect it before clicking on it. If what you see being displayed is different
    than where you end up when you click the URL, you should be suspicious of the
    link. Most of the time when you hover over a link and then click on it, you end
    up at the same URL as the hovering showed. But this is not guaranteed. There are
    several programming “tricks” that allow the URL that you see when you hover over
    it to be different than where you end up when you click on the URL.


    One method is for a programmer to use the <on click> HTML directive. Onclick tells
    a browser where to take a user if they click on the link using their mouse pointer.
    Here’s what a normal URL link coding looks like:


    ```

    <a href="https://www.google.com">Link to Google</a>

    ```'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'If you hover over that URL, which displays “Link to Google,” the hovering will
    reveal www.google.com as the underlying URL. And if you click on that URL, you
    will be taken to www.google.com. This is the way hovering is supposed to work.


    But if the Onclick directive is used, you can be taken somewhere else other than
    where the hovering showed you would be taken. Here’s an Onclick redirect link:


    ```

    <a onclick="this.href=''https://knowbe4.com/'';" href="https://www.google.com">Link
    to Google</a>

    ```


    In this coding example, “Link to Google” will be displayed on the page, hovering
    will reveal www.google.com, but clicking on the link will take you to https://knowbe4.com
    instead.


    In general, URLs that take you somewhere other than what the hovering revealed
    should be treated with more suspicion than those that go to the place the hovering
    revealed. This web page covers this issue in more detail: www.michaelhorowitz.com/HoverOverLink.php.


    # Shortened URLs


    Any URL can be converted to a “shortened URL.” There are dozens of services around
    the Internet (e.g., goo.gl, t.co, bit.ly, etc.) that allow anyone to submit any
    URL, which will then create a newly rendered URL that points to the shortening
    service. Initially, shortening services came about because Twitter (now X) originally
    only allowed 140 characters in a Twitter post, including any posted URLs, and
    URLs could contain more than 140 characters by themselves or take up a good portion
    of the post. Shortening services were invented so a long URL could be reduced
    to a 5- to 15-character long URL, saving room for more writing in the Twitter
    posting.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'The shortened URL can be a randomly generated string of characters (almost
    always shorter), or some shortening services allow the requestor to create a custom
    URL containing the desired words and letters. Both types of shortened URLs are
    often used by phishers, but the latter method allows the hacker to include brand
    names in the new custom, look-alike URL.


    When a user clicks on a shortened URL, it takes the user’s browser to the shortening
    service where it is then redirected to the longer URL that it is related to. For
    example, the shortened URL, https://tinyurl.com/5n92dk34, takes you to www .knowbe4
    .com/qr-code-phishing-security-test.


    It is very common for SMS-based phishing to include a shortened URL (see Figure
    13-19).


    In Figure 13-19, the phisher used the bit.ly shortening service and requested
    a custom URL containing ’Venmo.” If you’re not aware of how easy it is to get
    custom URLs from a shortening service, you might be fooled into believing this
    URL is a legitimate Venmo URL.


    Short URLs complicate URL inspection because the shortened URL gives you no context
    to determine if the destination URL it is taking you to is legitimate or not.
    The best you can do is go to the involved URL shortening service, input the shortened
    URL, and have the service tell you what longer URL it is converted to (before
    actually being taken to the longer destination URL). Most people, if they do not
    want to do the intermediate check with the URL shortening service first, are left
    with either not clicking on the shortened URL or clicking on it and then inspecting
    the URL that they ended up landing on as the final destination.'
  merge: -1
  img_proc: true
