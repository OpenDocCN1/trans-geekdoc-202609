- pgno: 276
  md: '# CHAPTER 11


    Security Awareness Training Overview


    No matter how good your policies and technical defenses are, some amount of social
    engineering and phishing will get to end users where they will need to make decisions.
    For that reason, end users must be taught how to recognize signs of maliciousness
    and how to deal with it. Chapter 11 discusses the great security awareness training
    program every organization should have in place to significantly reduce cybersecurity
    risk.


    # ## What Is Security Awareness Training?


    Every organization should have a formal Security Awareness Training (SAT) program.
    But why is it called Security Awareness Training? Why isn’t computer security
    training or computer security education a better descriptor?'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'First, the SAT focuses on computer security, both physical and logical, as
    opposed to comprehensive employee training across all disciplines. It doesn''t
    cover non-cybersecurity training topics, such as harassment, corruption, and OSHA
    workplace laws. Those fall under a broad topic generally known as compliance training.
    It does cover physical security as it exists to protect cyber assets. SAT training
    might not cover what a person should do to prevent their car from being stolen,
    but it might cover how to prevent your laptop from being stolen from your car.
    It certainly includes how to prevent an unauthorized person from physically accessing
    an organization''s work perimeter and cyber assets. SAT is about protecting and
    securing cyber assets and the confidential data they contain.


    A core component of the SAT is awareness. According to Google, awareness is “knowledge
    or perception of a situation or fact.” SAT makes users aware of various types
    of cybersecurity threats and how to recognize them. With traditional computer
    security training alone, I could simply tell you to follow a particular cybersecurity
    threat mitigation, such as, “Don’t click on URL links in unexpected emails without
    first hovering and inspecting.” That’s good advice, but it doesn’t explain the
    important “why.” SAT covers the reason why the security policy is recommended
    or required. There is a reason for the policy about inspecting URL links before
    clicking them. Many phishing emails contain URL links that point to fraudulent
    websites pretending to be from a particular brand that a potential victim might
    otherwise trust. These websites are trying to get the user to perform an action
    against their own self-interest. Clicking on a rogue URL link could compromise
    the user and their organization. Users who understand why they should follow a
    particular policy are more likely to remember and follow the related policy than
    if they were just told to follow it without justification.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Additionally, SAT usually gives lots of real-world examples (or simulations),
    and those examples help users to remember the threat and recommendation. A popular
    saying is “stories are the only way we ever learn anything.” Whether or not that
    is perfectly correct, stories and examples do help to better communicate lessons.


    A similar (non-computer) example, could be telling a brand-new driver to always
    look left and right before they enter an intersection, even if they have the right-of-way
    to enter and proceed. It always helps to reinforce the lesson by telling the brand-new
    driver that the reason why looking right and left is needed is someone coming
    from a perpendicular direction may not stop and if so, might crash into the side
    of the car of the driver who did have the right-of-way, causing a serious high-speed
    crash. Showing them a video of a related high-speed crash and its aftermath is
    even better. Stories and illustrations go a long way toward explaining motivation,
    which helps learners remember and repeat the desired behavior.


    One of the biggest questions in fighting social engineering and phishing is what
    personality traits make a person more or less susceptible to becoming a victim.
    For a long time, people outside the industry have long thought that intelligence
    played a big factor. The theory is that smarter people are less likely to fall
    victim than less smart people. This hasn’t proven true. Doctors, lawyers, and
    PhDs are just as likely to fall for a social engineering attack as someone who
    never graduated high school.


    Another mistaken belief was that some people are simply more gullible than others
    and more susceptible to falling for scams. This, too, hasn’t proven to be the
    case. It turns out that the number one associated trait of whether someone will
    or won’t fall for a particular social engineering scam is whether the potential
    victim was aware that the particular scenario was frequently used in a scam. Being
    made aware of particular attributes'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'used in a scam makes a potential victim less likely to become a confirmed victim.
    Being made “aware” of a scam is one of the most important things that can be done
    to reduce the success of a scam. For example, if you’re made aware that your electric
    company will never contact you and ask you to pay your electric bill using gift
    cards, the less likely you are to fall for such a scam. Awareness of various scams
    and scam traits is one of the most important things any SAT program can bring
    to reduce risk.


    To summarize, one of the most important things SAT does is to give users many
    stories and examples of common, popular, cybersecurity attacks. SAT makes users
    aware of the various types of threats, how to recognize them, and how to treat
    them.


    # Goals of SAT


    The ultimate goal of SAT is to better protect the individual (and their organization,
    if it applies) against cybersecurity attacks. It does this by using stories and
    examples of cybersecurity threats to help the user better recognize attempted
    attacks and teach the user how to mitigate and report them. SAT is attempting
    to lower the likelihood of a successful compromise.


    The primary objective of SAT is to help the user better recognize the signs and
    symptoms of an attempted cyberattack. For example, what are common signs of a
    phishing email? They might include arriving from a previously unknown email address,
    containing an unusual request that the receiver has not ever received before,
    or containing a suspicious URL link that points to an untrustworthy website.


    A good SAT program will give dozens of examples of common phishing attacks, such
    as smishing attacks that claim to be from USPS (see Figure 11-1) or a large US
    credit union (see Figure 11-2). This book has intentionally included dozens of
    real-world examples of social engineering and phishing because'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'real-world examples are a great way to learn about attack techniques and remember
    mitigations.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_280_0.png)


    FIGURE 11-1 A real-world example of a smishing message pretending to be from the
    United States Postal Service.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_280_1.png)


    FIGURE 11-2 A real-world example of a smishing message pretending to be from a
    large US credit union.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'Every SAT program wants to share as many examples of real-world attacks as
    it can because they inform attendees on how to detect (i.e., what are the signs?),
    mitigate, and report them.


    SAT attendees must be instructed on how to respond to social engineering and phishing
    attacks. Don’t assume that everyone understands exactly what to do. In home scenarios,
    the answer might be to simply delete or ignore the attack. But what if the user
    was tricked into inputting their login information or gave their credit card information
    to an attacker? What then? In the first case, the user needs to log on to the
    legitimate related service and change their login information as soon as possible.
    In the second case, they should subscribe to a credit monitoring service and look
    out for fraudulent transactions. The victim might want to proactively call the
    involved legitimate service and report the successful phishing attempt, to make
    the vendor aware of the involved malicious actor. That way, the vendor might be
    able to be more proactive about recognizing fraudulent actions or issuing the
    victim a new account and credit card.


    It’s especially important in organizational scenarios to instruct end users on
    how to appropriately report social engineering and phishing attacks. Many broader
    phishing campaigns, targeting many users within one organization, have gone on
    longer than they needed because individual recipients failed to report them to
    IT/IT Security, and so IT/IT Security couldn’t proactively respond and put down
    the attack. Recipients need to be instructed to report suspected social engineering
    and phishing attacks and how to best report them. Different communication channels
    may require different reporting mechanisms. For example, an organization may use
    a Phish Alert Button (PAB) in email but not have similar reporting tools for voice
    mail and SMS messages. In an organization, users must be instructed to report
    all suspected social engineering and phishing attacks, no matter how they arrive.
    They also need clear direction on how to report such attacks.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'There is also a very relevant saying from my friend and co-worker, Perry Carpenter’s,
    book, *Transformational Security Awareness: What Neuroscientists, Storytellers,
    and Marketers Can Teach Us About Driving Secure Behaviors* (www.amazon.com/Transformational-Security-Awareness-Neuro-scientists-Storytellers/dp/1119566347)
    that states, “People may be aware and still not care.”This means that general
    awareness is not enough. A good SAT program must give people enough information
    about how a particular problem can impact them *personally* that they care about
    mitigating it.


    For example, an SAT program should teach not only about what ransomware is but
    also share how it can impact people individually. Ransomware not only negatively
    impacts a business’s operations for weeks and months, but also impacts production,
    dissatisfies customers and stakeholders, and possibly leads to layoffs and even
    potentially shuts down the impacted company. Individual employees are more likely
    to care about preventing ransomware if they think it can impact their individual
    jobs.


    A good SAT program should teach desired behaviors in such a way that they become
    second nature, (without thought and “natural” to the end user). When parents are
    teaching our toddlers how to safely cross a street, we hold their hand and always
    make a big deal about stopping at the curb, looking right and left, then right
    again (or whatever directions make sense), making sure it’s safe to proceed, and
    then and only then going across the road. We teach them not to blindly run into
    roadways chasing balls, and so forth. All parents spend years teaching their young
    kids how to safely cross the road, until the habit of looking right and left is
    something they do without thinking about it. It’s the same thing with a good SAT
    program. We want to teach safe computer policies until they become natural security
    habits.


    If an SAT program has done the job well, all individuals will have a healthy level
    of initial skepticism towards any new, unexpected, requests that could harm their
    self-interests. They will'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'understand how to recognize signs of social engineering and phishing attempts,
    how to mitigate them, and how to appropriately report them.


    To summarize, the goals of an SAT program are to teach users how to do the following:


    +   - Recognize a scam.

    +   - Mitigate a scam.

    +   - Appropriately report a scam.


    # Senior Management Sponsorship


    All SAT programs should be owned and sponsored by senior management. The best
    SAT programs are supported by the CEO, who makes public displays of supporting
    the importance of the program. Each SAT program needs a budget, staffing commitments,
    and a well-defined reporting structure. Most SAT programs are tied to the IT/IT
    Security departments, but many are tied to the CEO or Human Resources offices.
    Either way, budgeting, staffing, and the reporting structure should be documented
    and well-known.


    # Absolutely Use Simulated Phishing Tests


    There used to be a time when IT and senior management questioned whether simulated
    phishing tests were a necessary part of SAT programs. In fact, back in the early
    days of SAT programs, administrators were punished and even fired for doing simulated
    phishing tests. Today, every organization should be doing simulated phishing tests,
    at least once a month. The data shows that simulated phishing tests are one of
    the best ways to train employees to recognize real phishing messages. According
    to the data'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'KnowBe4 has collected from over 65,000 customer organizations and over 650M
    simulated phishing tests, there is no other educational method that helps reduce
    cybersecurity risk more than simulated phishing tests. Here is a link to the related
    whitepaper: www.knowbe4.com/press/knowbe4-analysis-finds-security-awareness-training-and-simulated-phishing-effective-in-reducing-cybersecurity-risk.


    Your SAT program should include simulated phishing tests, for everyone. Don’t
    let senior management or IT argue their way out of needing to have simulated phishing
    tests. They are crucial in SAT education. Don’t let the real phishers be the only
    people testing your employees.


    # Different Types of Training


    Certainly, central to all SAT programs is training, training, training. Different
    people learn in different ways. A great SAT program has all sorts of different,
    enjoyable, and diverse training content. You don’t want an SAT program that delivers
    all content in only one way and only one style. You want to mix up different types
    of content, from different narrators, using different styles, and covering different
    topics.


    # Videos


    Most SAT programs include pre-recorded training videos. Those videos can be narrated
    by external people who do not work for the involved organization that’s showing
    them, or they can be created and produced by team members personally known to
    viewers. At KnowBe4, we currently have over 65,000 customer organizations that
    can pick from over 530 different videos. Most videos are narrated by a person,
    but we also have virtual videos,'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'cartoons, and nearly every type of video training content you can imagine.


    Our most popular training videos by far are anything done by Kevin Mitnick (see
    picture of Kevin from one of his training videos in Figure 11-3), KnowBe4’s late
    Chief Hacking Officer (he passed away in July 2023). Each year, Kevin created
    a new 10- to 20-minute video demonstrating the most popular types of social engineering
    hacks of the year.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_285_0.png)


    FIGURE 11-3 An example of Kevin Mitnick''s training video.

    Source: Kevin David Mitnick / www.knowbe4.com/products/who-is-kevin-mitnick /
    last accessed November 11, 2023.


    Kevin(www.knowbe4.com/products/who-is-kevin-mitnick) was one of the world’s most
    infamous hackers. As a teenager in the 1980s and a young adult in the early 1990s,
    Kevin was a notorious hacker. Although he would use any known exploit to achieve
    his goal, he was notorious for social engineering. Kevin was eventually arrested
    and spent time in jail. Upon his release, Kevin turned his life around, doing
