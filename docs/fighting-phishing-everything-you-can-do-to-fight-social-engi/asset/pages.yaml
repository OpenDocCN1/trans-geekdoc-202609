- pgno: 105
  md: '# Cryptography


    +   • All cryptography (e.g., encryption, digital signatures, hashing, etc.) must
    use industry-accepted cryptography and key sizes.


    +   • All confidential data must be access-controlled and encrypted at rest and
    when transmitted.


    +   • All information protected by cryptography must be accounted for in the cryptography
    inventory, detailing effective cryptography, cryptography protocol, current key
    size, and maximum possible key size.


    +   • Data protected by outdated cryptography must be re-protected by industry-accepted
    cryptography, removed from company devices and networks, or destroyed.


    # Account Management


