    Personnel should receive security awareness training upon being hired and once
    at least every twelve months thereafter. I love the idea that everyone gets security
    awareness training, although once every twelve months is definitely not enough.


    Still, it''s good to at least have a training requirement. Early versions of PCI-DSS
