  md: '# Reporting/Results


    Last, it is important to decide on what reporting and results your SAT program
    should provide and achieve. Desired results need to be defined ahead of time,
    including what indicates success and what indicates failure. For example, reporting
    could include the employees’ phish-prone percentage (i.e., how often employees
    fail a simulated phishing test). The desired result could be a falling phish-prone
    percentage over time, with a goal of getting under 5%. Other collected statistics
    could include the percentage of employees who take required SAT training and the
    percentage of employees who report simulated phishing tests. Whatever those stats
    are, each SAT program should decide on them ahead of time and specify the levels
    that indicate success and failure.


