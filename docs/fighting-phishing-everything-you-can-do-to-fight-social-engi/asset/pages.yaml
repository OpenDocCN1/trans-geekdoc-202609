- pgno: 208
  md: '# CHAPTER 8


    # Network and Server Defenses


    Chapter 8 will cover technical anti-phishing defenses (software, hardware, and
    services) that can or should be deployed at the network level or server level
    in most organizations.

    Creating a secure, trusted communications enclave where users and their devices
    can do their work is a requirement for good cybersecurity. Chapter 8 will cover
    many of the defenses necessary to secure a network against social engineering
    (where possible), phishing, and all cyberattacks. Many of these defenses should
    also be deployed on the server level and/or individual endpoint level (covered
    in Chapter 9, “Endpoint Defenses”) for a healthy defense-in-depth cyber defense
    plan. This chapter will cover super common network and server defenses as well
    as far less common ones.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Defining Network


    For this chapter and book, what is a network? A network is any collection of communicating
    nodes. The simplest example of a network is two or more computers connected to
    each other using a common communication medium (e.g., wired or wireless). Networks
    can be very large, like the Internet or other global- sized networks. Networks
    can cover one or more cities (i.e., a metropolitan network). And networks can
    be small like inside your house or car.


    Most of what this chapter discusses applies to organization- wide networks (e.g.,
    local area networks, wide area networks, etc.), or perhaps even home networks
    to a smaller extent. This chapter does not apply to very short-distance networks
    like personal area networks, Near Field Communication (NFC), Radio Frequency Identification
    (RFID), and Bluetooth, even though there have been research projects that showed
    potential phishing attacks on these types of networks. They are, at least today,
    mostly theory and not popularly attacked in the real world. Networks can even
    be virtual, connecting multiple virtual machines or using virtual network routing.
    Virtual networks can even be cre- ated using different protocols, such as HTTPS,
    TLS, IPSEC, etc. Different application-level technologies, such as DNS and Microsoft
    Active Directory can create virtual networks. Software Defined Networks (SDN)
    are a popular type of network virtual- ization in large organizations.


    If a network node funnels inbound traffic from one network to another, we can
    call it an ingress node. If a network node funnels outbound traffic between networks,
    we can call it an egress node. In terms of fighting phishing, this chapter is
    mostly con- cerned with protecting organizational IT assets. Typically, that will
    mean placing network-level protections on ingress nodes to prevent malicious items
    from reaching the protected nodes.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'Some defenders may want to also place network protections on egress nodes to
    prevent malicious actors (i.e., hackers or malware) from using one network to
    attack another.


    # # Network Isolation


    By definition, one network is isolated from another network using an ingress filter,
    node, device, or service of some sort to physically or logically segregate network
    traffic between networks. Traditionally, network isolation was done using a network
    router or firewall. A router or firewall can have one or more network segments
    reachable using the same router or firewall. In contrast, a network bridge, hub,
    or switch connects network nodes on the same network.


    Conventional wisdom asserts that every organization should create one or more
    isolated networks depending on what users and devices need to access to perform
    their official duties. People and devices that don''t have to access devices and
    services on another network should be prevented from connecting to those networks
    and assets. The idea is that if something malicious exploits a network, that isolation
    to other networks can prevent or slow the spread of malicious things to additional
    nodes on other networks. In theory, and sometimes in practice, this works. If
    a hacker or malware can''t access another network, they are likely prevented from
    causing it harm (although denial-of-service attacks are still an option).


    # # Network-Level Phishing Attacks


    Although this chapter is mostly about network- and server-level defenses, it''s
    a good place to warn about network-level phishing attacks. There have been network-level
    phishing attacks that'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'were able to attempt to scam one or more nodes on a single network all at the
    same time. Although not super common, there have been multiple instances of OS-level
    or network-level messaging platforms that allowed scammers to send a “system-wide”
    phishing message to everyone on the same network all at once.


    I remember reading, two to three decades ago, about network- wide phishing messages
    being sent using Novell Networks’ built- in messaging tools and the same with
    Microsoft Windows, but I can’t remember (or find) the built-in tool names all
    these years later. But I remember these network-level phishing scams were successful
    in creating at least some victims because people receiv- ing messages on what
    they perceive as their “internal network” were more likely to believe the scam
    message was from someone legit. These older network-level phishing attacks require
    that an attacker have access to an involved network node.


    These days network-level collaboration messaging platforms like Microsoft Teams
    and Slack are similarly targeted by attackers for the same reason. Microsoft Teams
    has been abused by many different phishing attacks. Here are some Microsoft Teams
    phishing campaign examples:


    +   - www.bleepingcomputer.com/news/security/ microsoft-teams-bug-allows-malware-delivery-
    from-external-accounts


    +   - https://abnormalsecurity.com/blog/microsoft- teams-impersonation


    +   - www.bleepingcomputer.com/news/security/ convincing-office-365-phishing-uses-fake-
    microsoft-teams-alerts


    +   - https://venturebeat.com/security/microsoft- teams-is-the-new-frontier-for-phishing-
    attacks


    Like the older network-level attacks, most Teams phishing attacks begin when an
    attacker has gained access to an authorized'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'network node inside the trusted network. They take over someone''s computer
    and use it to send Team messages. But attackers have also found ways, using external
    user accounts belonging to other organizations, to send phishing messages to other
    organizations they haven''t yet broken into because of the collaboration app''s
    ability to interact with other networks and nodes.


    The biggest messaging collaboration competitor to Microsoft Teams is an app known
    as Slack. It, too, can be used for phishing attacks, although most of the attacks
