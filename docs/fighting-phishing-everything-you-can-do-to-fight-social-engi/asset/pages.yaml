- pgno: 256
  md: '# Mobile Device Management


    Mobile Device Management (MDM) solutions should be deployed to decrease risk on
    mobile devices (e.g., cell phones, iPad devices, etc.) if they are managed by
    the company and have access to company systems and confidential data. MDM should
    be used to ensure that users must log on to their mobile devices (i.e., can’t
    just turn on the device and use it immediately), enable encryption, require secure
    authentication forms, ensure timely patching, install endpoint protection software
    (e.g., antivirus, etc.), and allow remote wiping of company data and applications
    if the device is missing or stolen.


    # Summary


    Chapter 9 covered the defenses an endpoint should deploy to help mitigate the
    risks of social engineering and phishing. Defenses included anti-malware, content
    filtering, patch management, secure configuration, phishing-resistant MFA, password
    managers, and DMARC.


    Chapter 10, “Advanced Defenses,” will cover some advanced defenses that some organizations
    may want to consider.'
