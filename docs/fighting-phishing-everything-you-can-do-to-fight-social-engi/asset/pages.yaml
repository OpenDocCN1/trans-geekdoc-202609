    You need to create and maintain a healthy level of skepticism regarding any new,
    unexpected request for an action that, if malicious, could cause harm, no matter
    how it arrives (e.g., in-person, phone call, text, email, web, social media, instant
    messaging, etc.). If a message arrives with those factors, then the recipient
    should research it further (e.g., call the person on a known good phone number,
    go to the real website, etc.) before performing the requested action. You can''t
    fully trust unknown persons, phone calls, emails, texts, or the web. There are
    just too many scammers.


    So, if I had only one recommendation to give, that would be it. Fortunately, I
    have a whole book of recommendations to give'
