    # Spear Phishing Examples


    Spear phishing can be accomplished in thousands of different ways, ranging from
    basic attacks to more advanced, longer-range attacks. Here are some common examples
    of spear phishing attacks.


    # Compromised Trusted Email Account


    Many phishers look into already compromised victims’ email Inboxes or Sent Item
    folders for useful email conversations (known as threads), which can be leveraged
    to trick an involved external recipient into reading a new fraudulent email. Because
    the email comes from a previously trusted partner, using the partner’s real email
    address, using a previously used legitimate email subject, it is easier to get
    the trusted recipient to open the email and do a new action. For example, “Hey
    Bob, check out this report. It seems to exactly support what we were saying would
    happen on the Apple news.” Or BEC scams that send legitimate invoices to payees
    but ask for the payment, when it is paid, to be made to a new bank account. It
    can be very difficult for new potential victims to figure out they are being pitched
    a new social engineering scam.


    According to the Barracuda report referenced earlier in this chapter, 24% of organizations
    report that an email account in their organization is taken over (i.e., account
    takeover or ATO) each year. Hackers send an average of 370 malicious emails from
    that seized account. Using a compromised email account to attack a trusting recipient
    is popular and it often works.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# Spearphishing on Inside Confidential Information


    One popular traditional spear phishing scam occurs when the attacker learns about
    some new confidential information or project within an organization and then uses
    that information to craft a new phishing email that uses the supposedly confidential
    information to gain trust in the new potential victim. Or the spear phishing attacker
    learns of some otherwise internal names and/or relationships to craft a spear
    phishing email with a pitch that communicates to the victim they have legitimately
    earned insider knowledge or relationships. For example, a spear phishing email
    may state something like, “I was talking to Brian in IT Security and he said I
    had to get with you to get my Salesforce account opened.” Or “Sheila in HR said
    you were the person I had to go to get that way overdue list of employee social
    security numbers we have to send to Kronos for processing now that we’ve switched.”


    I once talked with a company that had fallen for a spear phishing scam that cost
    them $2M. A BEC scam arrived in an internal email to an accounts payable team
    member. This particular accounts payable clerk very rarely received outside emails.
    But the spear phishers knew exactly who to send the phishing email to. It wouldn’t
    have worked on any other employee. The company was perplexed as to how the attacker
    learned exactly who to email inside the company that would normally be handling
    the type of transaction that they sent. After weeks of investigating, they finally
    tracked it to the internal accounts payable clerk’s email address being listed
    in a recent public 8-K filing. An 8-K filing is a report that US public companies
    must file with the Securities and Exchange Commission (SEC) to announce major
    events that may be important to shareholders or the markets. The BEC scam happened
    a day after the 8-K was made publicly available. Hackers and phishers often lurk
    in public data repositories looking for useful information.'
