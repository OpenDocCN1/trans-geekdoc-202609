  img_proc: true
- pgno: 86
  md: 'There are so many cybersecurity regulations and standards that many organizations
    have to follow multiple requirements, which sometimes conflict with each other.
    Most of the cybersecurity documents have dozens to hundreds of recommendations/requirements/controls,
    which people complying with have to follow.


    Compliance is the general act and specific actions of attempting to follow a prescribed
    guideline or requirement.


    When a compliance document states or covers a particular threat, say phishing,
    it will then usually list one or more controls the compliance follower should/must
    implement to mitigate the risk. For example, the PCI-DSS compliance document (https://docs-prv.pcisecuritystandards.org/PCI%20DSS/Standard/PCI-DSS-v4_0.pdf)
    lists the cybersecurity controls that any follower must establish, test, audit,
    and prove are enabled and being followed. PCI-DSS must be followed by any entity
    processing or storing credit card data of member card organizations (e.g., VISA,
    Mastercard, Discover, etc.) and their customers.


    For the purposes of this book, control stands for internal control or account
    control. It consists of the methods and procedures that are implemented by an
    organization to help ensure the validity and accuracy of the organization following
    a requirement. A compliance requirement will normally have one or more controls
    associated with it. A good organization will periodically audit its controls to
    ensure they are being consistently followed. If the controls adequately support
    the requirement and are audited to ensure they are being consistently followed,
    then it can be assumed the requirement is being met (unless a later event proves
    otherwise).


    The PCI-DSS 4.0 document has twelve principal requirements, with hundreds of supporting
    sub-requirements, over 356 pages. As an example, Requirement 12, Support Information'
  merge: -1
