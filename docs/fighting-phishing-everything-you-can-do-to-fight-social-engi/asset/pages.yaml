  md: '# # CHAPTER 13


    # Recognizing Rogue URLs


    Most phishing attempts include a rogue URL, which, if the potential victim clicks
    on it, will attempt to get the victim to perform an action against the victim’s
    self-interests. The link may take the potential victim to a malicious website,
    attempt to launch malicious content, or ask the victim for confidential information.
    Teaching a user how to tell the difference between a legitimate and a rogue URL
    is one of the best skills that can be learned. Chapter 13 will cover how any user
    can tell the difference between a rogue and a legitimate URL link.


    # ## How to Read a URL


    URL stands for *uniform resource locator* (URL), which is the formatting standard
    for representing the location of digital objects on networks. Simply, a URL is
    an address for an object on the'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Internet. The most common places people see URLs are in emails and the address
    location of their Internet browser. URLs most often represent objects and locations
    on the World Wide Web (WWW) but can point to objects using other protocols (e.g.,
    File Transfer Protocol (FTP), Telnet, and 3270 terminals). Figure 13-1 shows an
    example of a common URL with its components identified.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_329_0.png)


    # FIGURE 13-1 An example of a URL and its components.


    # Protocol Moniker


    The beginning of URLs may include a *moniker* representing the protocol used to
    retrieve the object pointed to by the URL. Most people are used to seeing https
    (hypertext transfer protocol secure) or http (hypertext transfer protocol), but
    it can contain many other text strings, recognized by the involved tool or operating
    system. The typical Microsoft Windows computer has dozens of predefined protocol
    monikers, including http, https, ftp, telnet, data, file, mailto, ssh, tel, and
    tn3270. Additional custom protocol monikers can be defined.


    When a protocol moniker is indicated, it instructs the browser (or whatever involved
    tool) to use a particular protocol and “well-known” network TCP/UDP port number
    to connect to the object. For example, http uses port 80, https uses port 443,'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'ftp uses port 21, and telnet uses port 23. Depending on the protocol moniker,
    an Internet browser may be able to work using that protocol and port, or the browser
    may launch another application linked to that particular protocol.


    Here is a list of the well-known port numbers: https://en.wikipedia.org/wiki/List_of_TCP_and_UDP_port_numbers.


    If the protocol moniker is missing in a stated URL, a browser or other tool might
    automatically add http or https as the default moniker. The URL protocol moniker
    always ends with a colon (:). Two or more forward slashes (//) usually follow
    the colon. Most URLs will have two forward slashes, but it’s normal for some URLs,
    depending on the moniker and protocol involved, to have more.


    A URL-enabled tool can be instructed to use a port number other than the well-known
    port number by placing the number at the end of the URL after a colon. Here’s
    an example: https://www.example.com:10446.


    This URL will instruct the tool to connect over the non-standard port of 10446
    instead of 443 (which is the default well-known port for https). Port numbers
    can range from 0 to 65,535, with a dozen or so of the numbers in that range not
    allowed because they are reserved for different reasons. You will see URLs with
    these non-default ports in them from time to time, but they aren’t super common.
    The most common place I see non-default ports used is by computer management tools.


    These are the only two times you will usually see a colon in a URL: following
    a URL moniker and at the end of a URL to indicate a non-default port. The first
    is mandatory, while the second is optional and not often seen.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# Hostname


    After the two forward slashes and the colon, usually what follows is the name
    of the host computer where the object being referenced in the URL is located.
    For example, if you see www, that means the hostname of the computer hosting the
    website is www. The hostname can be missing (in which case it might be guessed
    at by the involved tool after using the URL). The hostname can be the “real” hostname
    that the computer is logically labeled with, or it can be a virtual hostname advertised
    and published by the web server software. For example, www is the hostname in
    many URLs, but the hostname of the computer referenced in the URL is usually not
    really www. www is usually just a “virtual name” published and advertised by the
    web server software running on the host. If there is a hostname, it will be followed
    by a period.


    # DNS Domain Name


    The Domain Name Service (DNS) domain name follows the hostname and period (if
    there is a hostname and period). This is the logical location on the Internet
    as defined by the Domain Naming Service (DNS). The DNS domain name will end with
    a period and a “top-level” domain (TLD) name, such as .com, .pub, or .gov., followed
    by another period. Figure 13-2 shows two examples of URLs with the DNS domains
    highlighted between the brackets. The DNS domain name can simply be a “parent”
    domain name, like example.com, or include “child” domains, like child.example.com,
    which are located under their parent domain.


    The TLD names are officially controlled and approved by the Internet Assigned
    Numbers Authority (IANA). Years ago, when the Internet first started out, there
    were only a handful or'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'two of TLDs. But today there are hundreds of them (www.iana.org/domains/root/db).
    Dozens of them are “country codes” (e.g., ch for China, ru for Russia, us for
    the United States, etc.). Websites using a country code are supposed to be verified
    as physically located in that country. Many TLDs are “vanity-type” TLDs, such
    as biz for business or aaa for the American Automobile Association. DNS domain
    names (including the related TLDs) must be unique on the Internet. No two different
    unrelated servers or objects can have the same domain name. For example, knowbe4.com
    can only exist once in the Internet’s DNS infrastructure.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_332_0.png)


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_332_1.png)


    **FIGURE 13-2** Two examples of URLs with the DNS domain portion highlighted between
    the brackets.


    Some TLDs are considered more risky than others. Newer TLDs tend to be more abused
    by hackers and phishers than older TLDs (.com excepted). Most well-known brand
    names (e.g., Microsoft, Google, Apple, etc.) are located on the .com TLD. Seeing
    a well-known brand name on another TLD besides .com will usually be met with correct
    suspicion.


    There will be a single forward slash following the domain name (and TLD). The
    first single forward slash in a URL (reading left to right) will indicate the
    end of the DNS domain name. This is an important fact to remember.


    When a DNS domain name is typed into a browser, the browser or client operating
    system will then resolve the domain name to an IP address using a DNS service.
    Ultimately, all devices on the Internet connect to each other using IP addresses
    only.'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'DNS domain names are just easy ways for humans to recognize and re-type URLs
    instead of having to remember and type in IP addresses.


    # Resource Name or Path


    The static information following the domain name will indicate an object name,
    a path to the object name, or both. This information can also be missing, and
    if missing, it may be filled in by some Internet tools with default resource names
    and/or paths. Figure 13-3 shows an example of a URL with a resource path followed
    by the resource name.


    # Resource path name


    +   - Starts after first single slash

    +   - Ends at last slash


    ```

    https://www.example.com/subpath/subpath/resourcename

    ```


    FIGURE 13-3 An example of a URL with a resource path followed by the resource
    name.


    Resource paths can point to real file and folder directory structures on the host
    computer or virtualized or logical structures, as published and advertised by
    the involved web server software. The resource path can be a single static path
    or contain multiple “child” paths under the “parent” path. If there are child
    and parent paths they will be separated by single forward slashes or periods.


    The resource name, if one exists, will follow the resource path and may end the
    URL. The resource name can point to a web page (e.g., htm, html, etc.) or point
    to an actual object (e.g., resourcename.doc, resourcename.xml, resourcename.xls,
    resourcename.gif, etc.). Figure 13-4 shows an example resource name.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_334_0.png)


    FIGURE 13-4 An example of a URL ending with a resource name.


    This completes the “standard URL.” It begins with a URL moniker, which is followed
    by a colon and two forward slashes. The hostname, if used, comes next followed
    by a period. The DNS domain name will come next and can have multiple parts (child
    and parent domains). It will be ended by the first single forward slash. Next,
    the resource’s path may be shown. It may or may not contain multiple parts separated
    by single forward slashes (child and parent paths) and may end with a single forward
    slash. The resource name being pointed to by the URL will end the URL statement
    (if present).


    Here’s another example of a URL: www.knowbe4.com/hubfs/Social-Engineering-Red-Flags.pdf.


    In this instance, https is the URL moniker. www is the virtualized hostname of
    the server/service hosting the website. knowbe4.com is the DNS domain. hubfs is
    the resource path of where the object is located. And Social-Engineering-Red-Flags.pdf
    is the object to be downloaded when someone clicks on or inputs the URL.


    # Variables


    URLs can contain variables, which get passed back from the client to the hosting
    web server. See Figure 13-5 for a simple example format of a URL variable. Variables
    will always follow a question mark.


    +   - Anything after the first ? is a variable being passed back to the host to
    be evaluated

    +   - Often used to track users


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_334_1.png)


    FIGURE 13-5 An example format of a URL variable.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'The variable name/label after the question mark can be nearly any text string,
    but whatever it is, it is the name of the variable. Then there will be an equal
    sign (=) followed by the value of the variable. Variables can be nearly anything
    and are used by websites for a variety of purposes. One of the most common reasons
    is to indicate where the URL the user clicked on was located. Organizations like
    to track how a user came across a particular URL (i.e., what media source) for
    marketing purposes. Consider the following URL sent to me by KnowBe4:


    ```

    https://info.knowbe4.com/12-way-to-hack-two-factor-authentication?hsCtaTracking=512ec4b3

    ```


    The variable hsCtaTracking has a value of 512ec4b3. That means something to the
    web server and its marketing tracking software. The hsCtaTracking variable was
    created and tracked in a particular piece of marketing software. It is likely
    identical for every email sent out to anyone from the same marketing campaign.
    The value 512ec4b3 is likely unique (to me) and likely tracks back to a very specific
    piece of marketing material and/or email tied to my specific email address. When
    I clicked on that URL and it sent that variable back with it to the server, it
    likely told the marketing software attached to the web server what respondent
    (i.e., me), likely tracked by email address, had clicked on that particular URL
    link, and they likely knew how the URL link got to me (i.e., what marketing campaigns).


    But variables can be used for anything the administrators of the web server want
    them to be. Some variables are used to help identify and track the user as they
    move across the website. Some variables are used to indicate different selections
    the user made as they moved across the website. Variables can literally be used
    for almost any purpose limited only by imagination.


    Multiple variables can be defined in the same URL, and if multiple variables exist,
    they will be separated by ampersands (&). Figure 13-6 shows an example of a multi-variable
    URL.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_336_0.png)


    FIGURE 13-6 An example of a URL containing multiple variables separated by the
    ampersand (&).


    Variables can contain many different types of information. Once you are aware
    of URL variables, you can start to pay more attention to them, analyze them, and
    figure out what they mean. Most of the time they are used for marketing purposes,
    but they can be used for many different reasons. You can even change and manually
    manipulate the variables in a URL to see if it impacts the response of the web
    server. Most of the time it doesn’t. Sometimes it does. Many professional penetration
    testers often manipulate the variables to see if it will allow them to bypass
    authentication or see unauthorized data. Usually manipulating the variables doesn’t
    do anything, but occasionally you can find a web server weakness or hack.


    # Most Important URL Information


    Out of everything listed above, the most important piece of information in determining
    if a URL is legitimate or rogue is the DNS domain (see Figure 13-7). Is the URL
    pointing to a legitimate domain connected with the corresponding message being
    communicated or not?


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_336_1.png)


    FIGURE 13-7 An example of a URL with the DNS domain highlighting between brackets.'
