    people who were successfully phished, whether by a real phishing attack or a simulated
    one, were very busy. . .too busy. . .and accidentally clicked on and interacted
    with the phishing message while in their hurried state. Had they been less busy.
    . .more mindful, they might have had a better chance at seeing the clues that
    pointed to the message as being a phishing message.


