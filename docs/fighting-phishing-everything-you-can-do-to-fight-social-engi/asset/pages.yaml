- pgno: 434
  md: '# About the Author


    Roger A. Grimes, Data-Driven Evangelist at KnowBe4, Inc., is a 35-year computer
    security consultant, instructor, holder of dozens of computer certifications,
    and author of 13 previous books and more than 1,300 magazine articles on computer
    security. He has spoken at many of the world''s biggest computer security conferences
    (e.g., Black Hat, RSA, etc.), been in Newsweek™ magazine, appeared on television,
    been interviewed for NPR’s All Things Considered™ and the Wall Street Journal,
    and been a guest on dozens of radio shows and podcasts. He has worked at some
    of the world''s largest computer security companies, including: Foundstone, McAfee,
    and Microsoft. He has consulted for hundreds of companies, from the largest to
    the smallest, around the world. He specializes in social engineering, host and
    network security, ransomware, multifactor authentication, quantum security, identity
    management, anti-malware, hackers, honeypots, public key infrastructure, cloud
    security, cryptography, policy, and technical writing. His certifications have
    included CPA, CISSP, CISA, CISM, CEH, MSCE: Security, Security+, and yada-yada
    others, and he has been an instructor for many of them. His writings and presentations
    are often known for their real-world, contrarian views. He was the weekly security
    columnist for InfoWorld and CSO magazines between 2005–2019.'
