- pgno: 265
  md: '# # Email Server Checks


    If your organization has an on-premise email server, it should ensure that it
    is securely configured to stop phishing attacks. I have thirty-five years of experience
    in computer security. In my heart of hearts, I assume every single email server
    is appropriately and securely configured. But from reviewing the testing outcomes
    from thousands of potential customers who have used KnowBe4’s Mailserver Security
    Assessment tool (www.knowbe4.com/mailserver-security-assessment), the reality
    is that a large percentage of email servers have at least one insecure setting
    that allows phishing to be more successful than it otherwise should be.


    If you have an on-premise email server, you should periodically (at least once
    a year), test your email server to make sure it is securely configured. The most
    common misconfiguration we see (with KnowBe4’s testing tool) is an email server
    that allows an inbound email to be received even when it is claiming to be from
    an internally hosted email domain. For example, KnowBe4’s email server should
    not allow emails to arrive inbound with email origination addresses (remember
    RFC 5321 and 5322 email addresses from Chapter 7, “DMARC, SPF, and DKIM”) containing
    knowbe4.com. KnowBe4 doesn’t send internal-only email out on the Internet to be
    received inbound on its email servers. In fact, doing so would be very suspicious.
    A very common phishing trick is for an email to arrive claiming to be from the
    CEO or some other important figure, using the CEO or other officer’s real, internal
    email address. This (i.e., email origination domain spoofing) is often allowed
    on insecure email servers but should never be allowed on any email server or service
    today. Periodically running a tool that tests for insecure configurations will
    help to confirm the email server is appropriately secure (at least for the tests
    being performed).'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# # Proactive Doppelganger Searches


    A very common phishing tactic is for a phisher to use fraudulent domains that
    look similar to the brand being impersonated. For example, a phisher looking to
    simulate Microsoft might create new, fraudulent domains that contain the word
    “microsoft” or other similar terms in it. For example, the fraudulent domains
    might be something like: micr0soft.com, microsoftlogonaccount.com, or therealmicrosoftcom.com.


    Popular brands often end up with dozens to thousands of these fraudulent, look-alike
    domains that have been used in one or more phishing campaigns. A common advanced
    tactic is for the legitimate brand to search for these fraudulent look-alike phishing
    domains and, when found, contact the appropriate domain registrars to get them
    shut down.


    There are many open-source and commercial tools to assist administrators in looking
    for and finding these “evil twin” domains (for example, https://github.com/vpav/doppelganger).
    KnowBe4’s free Domain Doppelgänger (www.knowbe4.com/domain-doppelganger) tool
    can be used by any administrator to look for and find these look-alike domains.
    Figure 10-2 shows an example of KnowBe4’s Domain Doppelgänger tool being run against
    knowbe4.com.


    As you can see in Figure 10-2, some of the “evil twin” domains found included:
    knoweb4.com, knawbe4.com, and knoweb4.com. In all, the Domain Doppelgänger tool
    found 79 domains. That’s 78 fraudulent domains on top of our single legitimate
    domain. We run this tool each month on KnowBe4’s own domain. Some months we’ve
    found over 100 fraudulent, look-alike domains. Every organization with a brand
    that fears their brand is being used by phishers to fool otherwise unsuspecting
    victims should look for and mitigate fraudulent, look-alike domains.'
  merge: -1
  img_proc: true
- pgno: 267
