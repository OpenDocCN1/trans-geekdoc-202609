    # Recognizing Rogue URLs


    In the same light, one of the best ways to fight social engineering and phishing
    is to help potential victims recognize fraudulent, rogue URLs. Most (although
    not all) phishing messages contain rogue URLs. Many are created to'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'look similar to the legitimate brand or organization’s URL they are pretending
    to be. Hovering over (if possible) and inspecting all URLs before clicking on
