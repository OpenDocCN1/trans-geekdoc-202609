- pgno: 88
  md: 'How do you focus on the right controls, out of the hundreds of controls you
    need to implement, to have an effective cybersecurity defense that puts down the
    most risk? The answer is risk management.


    # Risk Management


    The question and answer to which controls to focus on is a very critical dilemma,
    and most organizations do it wrong. It''s easy to focus on the wrong things too
    intently and not enough on the most effective controls. Many times, it’s a side
    effect of our compliance documents.


    Consider PCI-DSS again. The very first main requirement is *Requirement 1: Install
    and Maintain Network Security Controls*. It has a lot to do with installing and
    maintaining firewalls and other network-level security isolations. It has nineteen
    sub-recommendations, thousands of words, and over twenty pages. That’s great.
    It’s important to have good network boundary isolation.


    The problem is that giving good security awareness training, which is a single
    requirement (as shown in Figure 3-1), is just forty-two words. It can easily be
    argued that if social engineering and phishing are involved in 70% to 90% of successful
    attacks, there is likely no better control that can be implemented than good security
    awareness training. Today’s biggest threats (e.g., phishers and unpatched software)
    are little affected by network security isolation. Nearly every organization and
    person today have one or more firewalls enabled and have for decades, and it hasn’t
    stopped malware or hackers. Most threats are *user-based* threats where the user
    accidentally performs or is tricked into performing an action that leads to a
    successful compromise, and firewalls and network isolation don’t help. The threat
    is on the end-user’s workstation already past the network defenses.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'This is a well-known fact. In fact, the ineffectiveness of firewalls and network
    isolation as a good security defense has been so thoroughly discounted that the
    entire world is now trying to get to what is known as *zero trust networking*,
    where it is assumed the attacker is likely past all network isolation boundaries.
    And that''s true of most attacks. In OMB memo M-22-09 (www.whitehouse.gov/wp-content/uploads/2022/01/M-22-09.pdf),
    released on January 26, 2002, the President of the United States requires all
    government agencies to have zero trust architectures by the end of fiscal year
    2024. Zero trust networks are a repudiation of the effectiveness of firewalls
    and network security isolation.


    This is not to say that firewalls and network isolation don’t work. They are still
    a required part of every security controls document I’ve seen. Many of the documents,
    like PCI-DSS, begin with requirements for firewalls and network security isolation.
    Most zero trust networks will have firewalls and network security isolation as
    part of their solution. It’s just that social engineering and phishing get around
    all of it, including zero trust networks.


    And yet, in PCI-DSS, firewalls and network security isolation are nineteen requirements
    over twenty pages compared to a single (weak) requirement for security awareness
    training with just forty-two words. If you are a compliance team required to comply
    with PCI-DSS, is your team going to spend more time complying with nineteen sub-recommendations
    over twenty pages or one sub-recommendation over forty-two words? I think I know
    the answer for most organizations. Any extra time spent complying with a less
    effective control is time and resources not spent meeting and exceeding the far
    more important requirements. It creates an ineffective cybersecurity defense.


    So, how do we fix this?


    The answer is *risk management*.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Most of today''s compliance documents discuss the importance of each complying
    organization determining what their risk is before applying the appropriate controls.
    Years ago, almost none of the documents discussed risk management, and today,
    most do. Some have dozens of pages on risk management. If you don''t already know
    this, cybersecurity is all about risk management. What threats do you focus on
    mitigating first and best? That''s basically everyone''s job in cybersecurity.
    You don''t want to focus on things that will never happen, and you don''t want
    to not focus on something that is likely to happen.


    # Assessing Risk Probability


    Risk can be thought of as a formula that states: Risk = Probability x Severity.
    Stated another way, Risk = Likelihood of Threat x Estimated Damage from Threat
    if it Occurs. Risk management is ensuring you focus on the critical threats that
    are more likely to happen or more likely to cause great damage if they occur (even
    if rare). Many risk managers visualize a “heat map” like Figure 3-2 when they
    think about risk.


    Risk management and cybersecurity defense are about figuring out which threats
    have a high probability of occurring and, if they occur, will cause significant
    damage. Those are the risks you should mitigate with controls first.


    Every organization should conduct its own threat risk assessment, not only including
    cybersecurity risks, but also physical risks, such as fire, flooding, and tornadoes.
    And once that organization figures out the top threats that they should mitigate,
    they should start implementing controls to mitigate them, at least first and best.


    If you have done a formal cybersecurity risk threat assessment, I can tell you
    that for most organizations, mitigating social'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'engineering and phishing is your number one threat, followed by making sure
    your software and firmware are patched. Every other threat added up altogether
    is a distant third. Get on it!


    My patching recommendations are written here: www .linkedin.com/pulse/patch-like-cisa-pro-roger-grimes.


    | | Catastrophic: 4 | Critical: 3 | Moderate: 2 | Marginal: 1 |

    |---|---|---|---|---|

    | Frequent: 5 | High - 20 | High - 15 | High - 10 | Medium - 5 |

    | Probable: 4 | High - 16 | High - 12 | Serious - 8 | Medium - 4 |

    | Occasional: 3 | High - 12 | Serious - 9 | Medium - 6 | Low - 3 |

    | Remote: 2 | Serious - 8 | Medium - 6 | Medium - 4 | Low - 2 |

    | Improbable: 1 | Medium - 4 | Low - 3 | Low - 2 | Low - 1 |


    FIGURE 3-2 Risk management “heat map”.


    # Defense-In-Depth


    Defense-in-depth is a security concept that there should be overlapping controls
    for your big threats, so that if one defense misses a threat, hopefully another
    mitigating control catches it. It’s like wearing your seatbelt in your car even
    though your car has an anti-collision system and anti-lock brakes. It can’t hurt
    to have multiple overlapping controls helping you, just in case.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Unfortunately, many cyber defenders take this concept to the nth level and
    have so many overlapping controls that it is simply wasted money and often leads
    to a lack of controls in other critical areas. You want to have a good defense-in-depth
    plan with a good spread of overlapping controls, but not miss any important controls
    or have unnecessary waste. Most cybersecurity defenders handle defense-in-depth
    using their gut feeling as they deploy controls. I don’t believe in gut feelings.


    Start with identifying your threats. What are the possible threats against your
    organization? Rank them and document them. Then, document what controls and systems
    you have that would give you good threat intelligence on those threats and newly
    emerging ones. Then, document what controls and systems you have that would detect
    those threats if they came against your environment or were in your environment.
    Next, document what controls and systems you have in place to mitigate the top
    threats. Then, perform a gap analysis to determine where you have good, overlapping
    coverage of the system and controls to threats and where you have gaps and excess.
    Then, update your systems and controls accordingly. This is how you get a “data-driven”
    cyber defense plan. Graphically this process is represented in Figure 3-3.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_92_0.png)


    FIGURE 3-3 A graphical representation of how to do a defense-in-depth gap analysis.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Once you have your top threats defined, you need to make sure you implement
    the right policies, technical defenses, and education to support your controls
    to mitigate the threats.


    # # 3x3 Cybersecurity Control Pillars


    You have three main defense objectives: prevent, detect, and recover. You want
    to prevent bad things from happening in the first place. To do this, you use *preventative
    controls*. You want to quickly detect any badness that has made it by your preventative
    controls, using *detective controls*. Once you detect something bad in your environment,
    say malware, you want a quick incident response, which minimizes damages and downtime.
    You accomplish this using *recovery controls*.


    Each control needs policy, procedures, and guidelines. You must document control
    expectations, so there is no ambiguity. Everyone needs to understand what the
    biggest, most likely threats are and how to mitigate them. You need to provide
    expectations, which helps with accountability if someone doesn’t do something
    right. Or perhaps everyone does everything right, and when something bad still
    happens, it means you missed something and you have to update the controls. Either
    way, documented and communicated controls help everyone to understand expectations
    and row in the same direction.


    Policies are written and communicated documentation on how someone should treat
    a particular event. For example, “Always lock your computer screen when away from
    your desk,” “Never type in your password in response to an email,” or “Never give
    your password to anyone. We will never ask for your password.” Policies are the
    beginning part of the security awareness process, but they are more than education.
    Policies also regulate and enforce expected behavior. We will cover policies in
    detail in Part II, “Policies.”'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Technical controls are all the mitigations you can implement using software
    or hardware to enforce a particular input, action, or output. Technical controls
    are things like anti-malware software, content filtering, secure configuration,
    firewalls, and endpoint detection and response software.


    Whenever possible, implement technical controls to mitigate your biggest threats.
    They help put down the majority of your risks and do so automatically. The best
    threat is the one that never makes it to your end user or into your environment.


    Some amount of badness will always get past your policy and technical controls.
    I don’t care what you implement; policy and technical controls alone are not perfect,
    and hackers and malware find ways around them. So, you need to educate your staff
    and workers as to how to spot badness when it gets past existing technical controls
    and what they should do when it happens (hopefully detect, report, and mitigate).


    Each critical threat and mitigation control should have policies, technical defenses,
    and education built around them. This is graphically represented in Figure 3-4
    and known as the “3x3 cybersecurity control pillars.”


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_94_0.png)


    FIGURE 3-4 The 3x3 cybersecurity control pillars.


    The idea is you need to create policies, technical defenses, and education around
    your preventative, detective, and recovery'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'controls that are used to fight your most critical threats. And said even better,
    make sure you have your best, defense-in-depth, combination of policies, technical
    defenses, and education to prevent, detect, and recover. Every time you create
    a control, ask yourself if you have the right policies in place to support the
    control. Do you have the right technical defenses to support the control? Do you
    have the right education to support the control? Do you have the right number
    of controls in the right places to do the right things? That is how you create
    a superior defense-in-depth defense plan.


    # Summary


    Chapter 3 covered compliance, risk management, defense-in-depth planning, and
    the concept of the 3x3 cybersecurity control pillars. There are three types of
    controls: preventative (which tries to prevent bad things from happening in an
    environment), detective (which attempts to quickly detect bad things that happen
    in an environment), and recovery (which attempts to minimize the damage from bad
    things by quickly removing them, fixing the damage, and getting the organization
    to a normal operational state). Every cyber defense control should have one or
    more policies, technical defenses, and educational components to best do defense-in-depth
    threat mitigation.


    Part II covers all the policies you should have to mitigate cybersecurity threats,
    including both general policies and specific policies that mitigate social engineering
    and phishing threats.


    Chapter 4, “Acceptable Use and General Cybersecurity Policies,” will begin by
    covering the general computer security policies you should have, including an
    acceptable use policy and general cybersecurity policies to mitigate cybersecurity
    attacks.'
  merge: -1
  img_proc: true
