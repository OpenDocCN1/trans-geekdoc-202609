    # HTTPS


    According to Google (https://blog.chromium.org/2023/08/towards-https-by-default.html)
    about 90% of Internet connections are made over an HTTPS connection, and that
    percentage is growing over time. When HTTPS is enabled and enforced as intended,
    it ensures that users can confirm that the URL they are connecting to is what
    it is displayed to be. It also means the data transferred by the involved nodes
    is encrypted between source and destination. This is true when the digital certificate
    involved in the HTTPS connection is valid and trusted. If the involved digital
    certificate is fraudulent or issued by an untrustworthy certification authority
    (CA), then the involved server site or application could be fraudulent.


    When browsing the Internet (or even the local network), everyone should try to
    ensure they are connecting over trusted HTTPS connections using trustworthy certificates.
    It decreases the risk that a phishing attack will be coming from another otherwise
    trusted URL (e.g., Facebook, Microsoft, Twitter, etc.). When HTTPS is not enforced
    (i.e., using unprotected HTTP'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'instead), it’s easier for a fraudulent site to claim to be something that it’s
    not or for another malicious node to do man-in-the-middle attacks or eavesdrop
    on confidential data.


    One big caveat to remember is that a large percentage of malicious websites involved
    in phishing also have valid, legitimate HTTPS digital certificates and connections.
    According to the Anti-Phishing Working 2021 Q2 Group’s Phishing Activity Trends
    Report (https://docs.apwg.org/reports/apwg_trends_report_q2_2021.pdf), 82% of
    phishing websites have valid HTTPS digital certificates (as shown in Figure 8-3).


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_220_0.png)


    FIGURE 8-3 Percentage of phishing attacks hosted on valid HTTPS-enabled websites
    according to the Anti-Phishing Work Group’s 2021 Q2 Group’s Phishing Activity
    Trends Report.


    This is similar to the situation discussed in Chapter 7, “DMARC, SPF, and DKIM.”
    There we discussed how most phishing domains are protected by DMARC and will have
    a DMARC status of “pass”. We would rather have phishing websites fail their DMARC
    checks, but instead, phishers have adopted using DMARC at even greater percentages
    than non-phishing websites. The same thing happens with HTTPS. Most phishing'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'domains have enabled the use of HTTPS digital certificates, so at first glance,
    someone might think that the HTTPS connection is “legit.”


    But HTTPS (and DMARC) were never designed to determine if a particular domain
    was or wasn’t malicious. No, they were created to allow a user to determine if
    the domain they were seeing advertised was indeed the real domain. Is the domain
    name shown really the domain name? With both HTTPS and DMARC that question can
    be answered. And that’s the way they (DMARC and HTTPS) need to be viewed and used.
    And this is a very good thing.


    If you have a valid HTTPS connection (e.g., using a valid HTTPS digital certificate
    from a trusted certification authority) then what you see being shown as the URL
    link is truly the URL link. So, if you see, for example, an HTTPS-enabled URL
    link that says microsoft.com, it really is microsoft.com. You can rely on that.
    Most phishing websites, even with valid HTTPS connections, will have URL links
    that point to look-alike websites (pretending to be legitimate brands), to a randomly
    picked domain, or a legitimate domain stolen from another otherwise innocent organization.
    But the key is that if it is HTTPS-enabled with a valid connection, you can trust
    that the URL you are seeing is what the URL really is. And this, as it does with
    DMARC, will help you to determine if the involved phishing message comes from
    a valid brand you should trust or someone else.


    # Content-Filtering


    Anywhere (e.g., network, server, endpoint, etc.) you can place content-filtering
    protection, you should. Content filters will block phishing messages, along with
    other types of unwanted content (e.g., porn, hate content, violence, spam, etc.).
    Content filters screen content to determine allowed or blocked sites and content.
    Content filters can be enabled on network ingress nodes, routers,'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'firewalls, servers, email systems, endpoints, mobile devices, and other locations.
    You definitely want content filtering enabled in multiple, overlapping layers.
    Content filters will absolutely not be able to stop *all* phishing messages, but
    they will catch and stop some of them.


    # Anti-Phishing Filters


    Anti-phishing filters are specifically designed to look for and stop phishing
    attacks. You should have multiple, overlapping anti-phishing filters where you
    can install them (e.g., network ingress nodes, routers, firewalls, servers, email
    systems, endpoints, mobile devices, and other locations). Some anti-phishing filters
    work by recognizing previously reported and confirmed phishing attacks, and others
    work using heuristics. *Heuristic* scanners work by looking for signs that something
    is likely to be malicious. The best content scanners use a combination of reported
    phishing messages and heuristics. Some anti-phishing filters use machine learning
    or artificial intelligence (AI) to look for and detect phishing messages.


    For example, KnowBe4 has a product known as PhishER Plus (www.knowbe4.com/products/phisher-plus).
    Users can report suspected phishing emails with it. This product also uses an
    AI model trained on phishing emails. Additionally, it uses human-curated human
    intel inputted by KnowBe4''s Threat Research Lab. So, humans and AI are used to
    identify phishing messages. When a phishing threat is identified, it can be deleted
    and proactively removed from other user''s inboxes where it may also appear. Additionally,
    the involved phishing URLs (if any) can be added to a blocklist (covered below).


    # Anti-Malware


    Today, about a third of all phishing emails contain some sort of attached malware
    program or a URL link that will retrieve'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'malware. Anti-malware software (e.g., antivirus, endpoint detection and response,
    etc.) can detect those malicious files and links and then block access or delete
    or quarantine the content. Every organization should have multiple, overlapping
    layers of anti-malware software and/or services.


    One huge caveat to keep in mind is that anti-malware products are notorious for
    not detecting malware when inspecting a malicious file (i.e., a false-negative).
    There are hundreds of millions of malware programs in existence and no anti-malware
    product seems to be able to detect a large percentage of these with great accuracy.
    You will see most anti-malware vendors advertise 100% detection rates. These rates
    are not to be believed, no matter what the vendor says. Still, anti-malware products
    do detect and prevent some percentage of malware, and for that alone, everyone
    needs one.


    # Email Gateways


    Most organizations should have an email service or gateway that is either a part
    of their email server/service or is upstream to it, which provides protective
    services like content filtering, anti-phishing services, and anti-malware services.
    If you have an on-premise email server, you need an email gateway ahead of it.
    If you use an email provider and aren’t sure if they use email gateways with those
    protective services, make an inquiry to confirm one way or the other. Many big
    email providers (e.g., Google, Microsoft, etc.) have huge investments in email
    gateway services and provide protective services by default (although you can
    often buy more).


    # Email Servers/Service


    It goes without saying, that your email servers/service should have anti-phishing
    protective services enabled on them by default. Not all do, so check and verify.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Email Search and Destroy


    Because email is the most common phishing vector, you should have a service capable
    of searching for phishing emails and removing them from user inboxes. Decades
    ago, I used a Microsoft utility called Exmerge to do email search and destroy
    missions. Most email servers and services offer a similar utility. They are essential
    for hunting down malicious emails and removing them before users can be exposed
    to them.


    KnowBe4 has a similar service in PhishER known as PhishRIP. Figure 8-4 shows an
    example message hunt query in PhishRIP. In this example, the phishing email had
    a common subject and body message but appeared to come from different senders
    and went to an unknown number of recipients. The PhishER admin created the query
    to find and eliminate matching emails.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_224_0.png)


    FIGURE 8-4 An example of a KnowBe4 PhishRIP phish hunting query.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# # Block Potentially Malicious File Attachments


    You should block potentially malicious file attachments. You don’t want end users
    receiving executables in email and launching them at their own discretion. Most
    major email clients and services already block dozens of potentially malicious
    file attachments. If your email client doesn’t, it should.


    For two decades, I used to track what types of files were used by phishers and
    hackers to launch malicious actions. When I started in the early 1990s, I had
    a dozen or so potentially malicious file types documented. By the late 2000s,
    I had well over a hundred different file types that could be used maliciously.
    I eventually gave up because it seemed that almost any file could be used maliciously.
    As I shared at the beginning of this book, even text files, with ansi-bombs, have
    been used maliciously. But most file type blocking lists used by email clients
    contain only a few dozen file types blocked by default (e.g., .exe, .dll, .com,
    .scr, etc.). You can usually modify the file-blocking lists to suit your needs.


    # ## Detonation Sandboxes


    Many anti-malware protection software/services offer what is known as detonation
    sandboxes or sandboxing. Detonation sandboxes are virtualized areas where Internet
    links and files can safely be opened and inspected. Early sandboxes, like Linux-based
    “chroot jail,” were manually created areas of storage and memory where potentially
    dangerous content could be examined and executed. Over time, various applications
    and operating systems started utilizing sandbox-like protections. I used a sandbox
    application called Sandboxie (https://sandboxie-plus.com/sandboxie) back in the
    days of Windows XP. It allowed me to run Microsoft Internet Explorer in a sandbox
    mode so that if'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'malware made a malicious modification during my browser session, Sandboxie
    would intercept the change and allow me to reverse it as if it never happened.
    Today, whether you know it or not, most antivirus scanners will “detonate” suspected
    malware in a safe sandbox to see if the executed program does one or more malicious
    things.


    Eventually, Microsoft even tried to implement parts of sandboxing in Microsoft
    Windows (starting in Windows Vista) as part of their User Account Control feature.
    Google attempted to provide sandboxing in its first browser, Google Chrome, with
    various levels of success. Microsoft Edge tries to do the same.


    There are even entire operating systems dedicated to enforcing sandboxing as much
    as it can be done in an operating system. QubesOS (www.qubes-os.org) is a hardware-enforced
    hypervisor system that keeps different apps from co-mingling with each other even
    though all the apps appear on a common desktop (so as not to complicate the end
    user’s use of them). It is probably the most sandbox-enabled operating system
    on the planet. If you want the most secure operating system available to the general
    public (and free), you want QubesOS. Microsoft, Apple, and Google each have a
    growing number of sandbox features in their operating systems and are striving
    to be something closer to what QubesOS already provides.


    Over the last decade or so, there has been a rush of defensive solutions that
    use sandboxing techniques to protect users. Most work by intercepting the end
    user’s email or browser downloads and temporarily blocking or preventing them
    from executing in the user’s current security context so they can do no harm.
    These solutions then open the downloads in a variety of virtual environments that
    attempt to realistically mimic the core components of a device’s existing environment
    where the blocked content would have otherwise executed or opened. The content
    and the outcome of executed content in the alternative, safe'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'location (i.e., the “sandbox”) are then analyzed to help determine safety and
    legitimacy versus potential malicious outcomes. If the content is deemed safe,
    it is then allowed to execute on the user’s device in the original, intended manner.


    Many vendors offer robust, sophisticated solutions. Oftentimes, all the user notices
    is a slight delay, perhaps a second or three, before the content is allowed to
    execute as the user desires. Other solutions will rewrite URL paths, replacing
    them with safer alternatives that the user will notice if they are paying attention.


    Many security experts, including this author, decry the URL rewriting, as the
    modified path renaming makes it difficult to impossible for a knowledgeable user
    to analyze for maliciousness using their own expertise as they could have with
    the original, untainted URL.


    Detonation sandboxes have gained widespread use but are still not as ubiquitous
    as other types of more common defenses, such as antivirus, firewalls, and content
    filters. As grand as they claim to be, they will sometimes fail to recognize and
    block malicious content, although they tend to have more accuracy than antivirus
    software. Figure 8-5 shows sandboxing being used by Microsoft O365.


    I’m a fan of sandboxes, but not when they rewrite URLs and make it harder for
    a user to inspect the destination URL.


    # Anti-Domain Spoofing


    You should have multiple, overlapping anti-domain spoofing capabilities on your
    network, starting with placing one on your network ingress node (and also on your
    email services, content filters, email clients, endpoint protections, etc.). You
    can start by enabling DMARC, SPF, and DKIM, as discussed in Chapter 7.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Any other security feature that verifies domain origination is a good feature
    to have.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_228_0.png)


    # FIGURE 8-5 An example of sandboxing being performed by Microsoft O365.


    # Blocklists


    There are many services, free and commercial, that publish blocklists (also known
    as blacklists). Blocklists are lists of URLs that'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'have been previously recognized as sending or being involved in malicious content
    or activity. The first blocklist I remember seeing over two decades ago was Spamhaus
    (www.spamhaus.org), and it is still around today. It maintains multiple lists
    that anyone can download and use that contain URLs known to be involved with sending
    spam and malware.


    Today, there are hundreds of similar blocklists. One good commercial site for
    blocklists is the Blacklist Master (www.blacklistmaster.com/blacklists). It contains
    dozens of other blocklists, some of which individually contain over 700,000 individual
    IP addresses that they believe involve malicious behavior.


    In most instances, blocklists can be configured to be automatically downloaded
    by servers and services (usually email servers, gateways, or DNS servers), where
    they are queried and used to check if an involved inspected URL is on the referenced
    blocklist before the server or service allows it to interact with an end user.


    The downside of blocklists (more so in the past than today, but it’s still a problem)
    is they often incorrectly contain innocent IP addresses and domains that were
    incorrectly identified as involved in malicious activity or were previously involved
    in malicious activity but no longer are (but still remain on the list). Good blocklists
    try to be as accurate as possible and allow potential victims to apply to have
    their IP address or domain removed from any blocklists. The removal process can
    be slow and imperfect. Still, the best-maintained blocklists are a good tool and
    should be used by servers and services that can take advantage of them.


    The opposite of a blocklist is an allowlist (or whitelist), which lists domains
    or IP addresses that should be allowed to communicate between networks. Often
    network ingress points using allowlists'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'block every connection not explicitly listed on the allowlist. Allowlists are
    harder to use in most scenarios because legitimate connections outweigh malicious
    connections.


    # Greylists


    A _greylist_ is a far less commonly used tool that is somewhat in between a blocklist
    and an allowlist. In a typical greylist application, every new incoming connection/email
    from a brand-new connection address is automatically rejected, at least temporarily.
    The connection may be placed on a greylist, which at first functions as a blocklist.
    Later on, after further investigation or determination, if the connection is defined
    to be legitimate, the connection is allowed and the originating node’s address
    is placed on an allowlist. Alternately, a greylisting application can simply always
    reject the first connection attempt, and no greylist is kept.


    The most common application of a greylist is used with email. When a user receives
    an email from someone they have never received an email from before, the email
    is temporarily blocked and the intended receiving user is notified of the new
    email (address) trying to connect to them. The receiver can approve the connection
    attempt, and if approved, the email address is added to the allowlist, and the
    email is delivered to the receiver. Next time, an email from the same email address
    arrives to the receiver without delay.


    Another greylist application treatment involving email is when a receiving email
    server automatically rejects all emails from new email addresses and instructs
    the sending email server/service that the email must be sent again in order for
    it to be delivered. Or the receiver’s email server IP address (denoted in their
    DNS MX record) contains two records, and the first one is bogus, and the second
    one is real. This is done on the theory that'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'most of the less mature email tools used by phishers don''t ever resend emails,
    but automatically resending previously rejected emails is usually done by regular
    email servers. Phishing email tools just send emails once, and so the initial
    rejection stops the phishing scam while regular emails eventually get through.


    A variety of undesirable usability issues led to greylisting not being adopted
    by the masses. First, greylisting delays all (brand new) emails, which end users
    don''t like. We like our email to be instantaneous. Second, and possibly more
    annoying, many legitimate emails end up never being delivered because their email
    servers/services don''t automatically resend rejected emails as expected.


    For more information on greylisting see https://en.wikipedia.org/wiki/Greylisting_(email).


    # Reputation Services


    Reputation services are a step up from blocklists. In most blocklists, someone
    complains about a malicious domain or IP address and it gets put on the blocklist.
    Reputation services usually go out of their way to confirm the suspected malicious
    address is truly involved with something malicious. They may monitor the address
    after it is reported or detected for the first time. They may look for and detect
    scam messages, malware, or simply malicious activity.


    Many vendors have reputation services either built into their products or offered
    as additional services. For example, Microsoft has reputation services built into
    Microsoft Windows (see Figure 8-6), Microsoft Edge, Microsoft O365, Microsoft
    Exchange, and other product offerings.


    In general, reputation services can be good things to use, but they aren''t perfect.
    I''ve seen a ton of real-world phishing scams'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'marked as “safe” by different reputation services. The phishing scammers often
    learn, through repeated tries, what does and doesn’t work to get past reputational
    services, so they can eventually craft the perfect-looking scam that doesn’t get
    flagged.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_232_0.png)


    FIGURE 8-6 An example of Reputation-based service options configurable in Microsoft
    Windows.


    # DNS Lookups


    DNS has the potential to put a significant dent in phishing scams, although most
    defenders don’t, or can’t, use it that way.


    # Domain Creation Dates


    Most phishing domains are created and then used in phishing scams within minutes
    to days of creation. It’s unusual for a regular, non-phishing domain, to only
    be'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'minutes to days old (after its initial creation). Legitimate services often
    have their domains registered for months to years when they begin to use them.
    Not always, but usually. So, most domains with very short lives are likely to
    be phishing domains. Any ingress service you use that can do a WHOIS lookup on
    a domain, as shown in Figure 8-7, can find the “Creation Date” and determine when
    the domain was first registered.


    | Name | Value |

    | --- | --- |

    | Domain Name | knowbe4.com |

    | Registry Domain ID | 1612400067_DOMAIN_COM-VRSN |

    | Registrar WHOIS Server | whois.registrar.amazon.com |

    | Registrar URL | https://registrar.amazon.com |

    | Updated Date | 2023-07-20T00:29:11Z |

    | Creation Date | 2010-08-23T16:24:14Z |


    # FIGURE 8-7 An example of a domain WHOIS query showing the domain''s Creation
    Date.


    Figure 8-7 shows a WHOIS query lookup (using mxtoolbox .com) of KnowBe4''s domain,
    knowbe4 .com. You can see it was created in 2010. If you knew nothing else, its
    age alone tells you it is not likely a malicious phishing domain.


    # Dynamic DNS Checks


    Some anti-phishing services also look to see if an incoming domain was registered
    by a dynamic DNS registrar. Dynamic DNS registrars were intended to let people
    who had frequently updated IP addresses register their DNS domain and have the
    IP address updated in the DNS record whenever needed. For example, most home Internet
    users have IP addresses that get frequently updated, or at least updated frequently
    enough that registering a permanent IP address would'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'be problematic. But over the years, many dynamic DNS registrars have become
    safe havens for malicious actors, including phishers who need to move their registered
    IP address frequently (e.g., every few hours to every day) as they continue to
    move around to escape being “put down” by defenders or law enforcement.


    Here’s a good article on dynamic DNS services and how they are used by phishers:
    https://umbrella.cisco.com/blog/on-the-trail-of-malicious-dynamic-dns-domains.


    Anti-phishing DNS services will often check to see if an incoming domain is registered
    with a dynamic DNS registrar, and if so, either block the incoming traffic or
    mark it up so that an anti-phishing and/or anti-malware service can better inspect
    it. Unfortunately, this is not an inherent feature in most DNS services (e.g.,
    Microsoft DNS or BIND), and those that do use it have to either create their own
    customized lookup or buy a commercial service.


    **DNSSEC** DNS was created in 1985 and was probably the essential translation
    service (domain name to IP addresses) that allowed the Internet to become the
    Internet. Without it (or something like it), we would all have to remember and
    type in IP addresses to go to our favorite websites. Unfortunately, it was not
    created with security in mind and has been a frequent target of hackers and scammers
    over the decades.


    All organizational networks should enable DNSSEC (Domain Name System Security
    Extensions) to prevent malicious domain spoofing. DNSSEC has been around for two
    decades. It uses asymmetric keys and digital signatures to sign and authenticate
    DNS responses from “authoritative” DNS servers. DNSSEC makes it harder for a scammer
    to do domain spoofing or'
  merge: -1
  img_proc: true
- pgno: 235
  md: '"poisoning." Without protections against DNS spoofing or poisoning, a potential
    victim can click on a URL that looks like a valid, well-known, domain and end
    up on a fraudulent website. DNSSEC is an open standard way to prevent those types
    of DNS scams.


    Unfortunately, DNSSEC is not super popular among admins who set up DNS servers
    and is not super easy to learn and set up. For that reason, most DNS servers/services
    do not have DNSSEC enabled. But every organization should.


    # Network Flow


    In most organizations'' networks, most end-user workstations do not connect to
    other end-user workstations. Most end-user workstations do not connect to every
    server in the network. Most servers don''t connect to other servers. Most servers
    don''t connect to every end-user workstation. Netflow (i.e., Network flow) analysis
    is the practice of understanding what the "normal" netflows in an environment
    are and then alerting when an anomalous connection is noted.


    For example, most companies with no customers in Russia should not see their servers
    connecting outbound to servers in Russia. If an unexpected server connection to
    Russia is noticed, it should probably be investigated to make sure something malicious,
    like ransomware, is not going on. If an end-user workstation is connecting to
    other end-user workstations without a valid reason, it should be investigated.


    Looking for anomalous netflows is one of the best ways to get an early warning
    that a malicious intrusion has successfully exploited a server or workstation
    in your network. Unfortunately, most network administrators do not have a good
    understanding'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'of what normal, non-malicious, network connections look like, so they can have
    a chance of noticing and alerting off something anomalous. There are netflow tools
    that will help admins figure out what is normal and what is abnormal. Some of
    the tools are open source and some are commercial. Many of the large network vendors
    often have netflow analysis tools, and they are often built into their routers
    and network management tools. If you want a tool that can help you detect hackers
    and malware when nothing else can, a netflow tool is the answer.


    This Wikipedia article has a decent listing of vendors and their names and protocols
    for netflow analysis: https://en.wikipedia.org/wiki/NetFlow.


    # Country-Blocks


    Some organizations block all network communications from entire countries, like
    Russia or China. It typically has to be done by a top-level domain (TLD) country
    code name (like .ru for Russia or .ch for China) or by Border Gateway Protocol
    (BGP) Autonomous System Numbers (www.thousandeys.com/learning/glossary/as-autonomous-system).
    Here is a list of TLD country codes: https://en.wikipedia.org/wiki/Country_code_top-level_domain.


    In general, blocking originating Internet traffic by country is a crude method
    to prevent hacking, phishing, and malware. It''s easy for those blocked countries
    to get around, and you''re preventing all the legitimate, possibly wanted traffic,
    from a whole country just to block the malicious traffic. However, many organizations
    do block Internet traffic by country, crudely or not, and find great success in
    doing so. So, who am I to argue with what works for a particular organization?'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Picture Badges


    This is a recommendation to prevent physical, in-person social engineering. Many
    organizations either don''t require employees to wear badges or don''t require
    the employee''s picture to be on the badge. Either one is a big mistake and increases
    the risk of in-person social engineering attacks.


    Every employee should have an official, company-branded, laminated, identification
    badge, with the employee''s current picture on it, worn where others can easily
    see and review it. Although it won''t absolutely prevent all in-person social
    engineering scams, it will make them more difficult to pull off and may actually
    help in identifying culprits after the fact.


    A little over a decade ago, a client I was consulting with in China had two employees
    from another competitor''s firm access their building looking for intellectual
    property secrets. The scanners did so by obtaining official employee badges from
    the compromised company''s badge printing system. But even as they did so, the
    scanners took and used real pictures of themselves to place on the unauthorized
    badges. Later on, when the intrusion was detected, the scammers were ultimately
    identified by their pictures left on the badging system, and later on they were
    detained and arrested by the appropriate law enforcement authorities.


    # Summary


    Chapter 8 discussed network- and server-level technical defenses an organization
    could deploy to mitigate social engineering and phishing. Many of these defenses
    (e.g., anti-malware, content filtering, or anti-phishing filters) are widely deployed
    in most organizations. Others, like greylisting and network flow, are not'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'as widely known or deployed. Hopefully, readers got introduced to one or more
    technical defenses they could deploy in their networks or on their servers to
    help mitigate social engineering and phishing.


    Chapter 9 will cover anti-phishing defenses that can or should be deployed at
    the endpoint or client level.'
  merge: -1
  img_proc: true
- pgno: 239
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 240
  md: '# # CHAPTER 9

    # Endpoint Defenses


    Chapter 9 will cover defenses that can be deployed on client endpoint computers
    and devices to fight social engineering and phishing.


    # ## Focusing on Endpoints


    Endpoints are nodes connected to a network. They can be almost anything but are
    often used to refer to end-user devices and computers. Most of the data we are
    trying to protect is either located on an endpoint or accessed through an endpoint.
    All our other defenses, located anywhere else, are trying to protect the data
    located on endpoints and users using endpoints.


    Much of this chapter is going to be a repeat of cybersecurity defense recommendations
    made in previous chapters (especially Chapter 8, “Network and Server Defenses”),
    because a great'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'defense-in-depth, multi-layered cybersecurity defense places similar good defenses
    in multiple places (i.e., network and endpoint). But there will be many recommendations
    that can only be deployed on endpoints that will be discussed in this chapter.
    The idea of this chapter is to remind readers of all the possible endpoint defenses
    that could be used to fight social engineering and phishing and, if lucky, possibly
    remind you of something you agree with but previously missed.


    # Anti-Spam and Anti-Phishing Filters


    Every endpoint capable of getting phishing messages should have anti-spam and
    anti-phishing filters installed. Most of the time, this means content filters
    on email and browsers, but expand that to whatever applications you have where
    you could get phishing messages (e.g., SMS, Microsoft Teams, Slack, collaboration
    apps, etc.).


    # Anti-Malware


    Every endpoint should have anti-malware software installed. Typically, this means
    antivirus software but can also mean installing and using endpoint detection and
    response software. Most endpoints should have both. Each will capture and block
    what the other might miss. Both types of software programs should, of course,
    be kept up-to-date.


    # Patch Management


    The second most common reason for cybersecurity compromise is hackers or malware
    exploiting unpatched software or firmware. All endpoints should have all critical
    patches applied within one to two weeks of being released by the vendor. It is'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'super important that if an endpoint has a vulnerability listed on CISA''s Known
    Exploited Vulnerability Catalog list (www .cisa.gov/known-exploited-vulnerabilities-catalog)
    that it gets patched ASAP! CISA only places vulnerabilities that are being actively
    exploited against real-world organizations by hackers and malware.


    # Browser Settings


    Most Internet browser settings have fairly strong default security settings. If
    those settings aren''t weakened, they are usually good enough to prevent most
    malicious manipulation of a browser by social engineering and phishing. This isn''t
    always true, and I''ll be covering some interesting hacker browser tricks in Chapter
    13, “Recognizing Rogue URLs.” But make sure you did not accidentally weaken browser
    security settings below their initial defaults.


    # Browser-Within-a-Browser


    One of two interesting hacker malicious browser tricks I want to cover here is
    known as browser-within-a-browser. It can''t necessarily be stopped using a browser
    security setting. It''s more that it must be looked for and noticed by an end
    user to prevent it. Browser-within-a-browser attacks are when a hacker presents
    what looks like an entirely different browser window to a user (representing a
    particular URL), but it isn''t a new browser window. It''s just some HTML code
    and content made to look like a new browser window, but entirely contained in
    the same original browser window.


    We are all used to going to websites that, for some reason or another, open up
    additional browser windows for us to interact with. Many times, it''s because
    we went to log on to a particular website or clicked on a particular logon option
    (such as Login with Facebook), and the original website then opened up a new'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'browser window to the other logon on another website. Figure 9-1 shows a legitimate
    example of that particular, non-malicious, situation:


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_243_0.png)


    FIGURE 9-1 An example of a browser window on one website opening up another browser
    window on another website.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Figure 9-1 shows a non-malicious example of a website opening another browser
    window to another website. In the example, I went to www.bestbuy.com, started
    to log on to my BestBuy account, then chose the offered alternative logon option,
    “Sign In with Google.” When I clicked that logon option, BestBuy’s website opened
    up another browser window to google.com so I could sign in using my Google account
    credentials. This is normal and legit. A website opening up another browser window
    is normal. If I type in my Google account credentials, in this example, those
    credentials would be captured and acted upon by google.com, and not the first
    website. This separation of URLs is very important for logon safety. You don’t
    want the first website, which may have nothing to do with google.com to get your
    login credentials to your Google account. Instead, the first website sends the
    user to google.com, the authentication happens there, and then the original website
    gets told the authentication event at google.com was successful, trusts it, and
    lets the user onto their website.


    But the whole process can be simulated. Instead of opening up a second browser
    window to the second website, malicious browser-within-a-browser attacks fake
    the entire experience, fooling the user into providing their secondary login credentials
    to the first malicious (or compromised) website. Malicious phishing websites will
    change their existing webpage that the user is currently viewing to look like
    they are opening a second browser window linked to a second website but are instead
    just showing what looks like a second browser window. It’s just for show, and
    most importantly, still linked to the first, malicious website. So, if an end
    user was tricked into inputting their Google account credentials, in this example,
    then those Google credentials would be inputted into and stolen by the first website.'
  merge: -1
  img_proc: true
- pgno: 245
