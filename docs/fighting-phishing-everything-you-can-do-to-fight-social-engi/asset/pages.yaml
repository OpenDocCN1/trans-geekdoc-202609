- pgno: 142
  md: '# Why?


    If simulated phishing is used, what will it be used for? In general, simulated
    phishing is used as part of the training and education in an SAT program. It is
    also used to collect stats on who specifically appears to need or not need more
    training.


    If you collect information on individuals regarding simulated phishing tests,
    you may need to update your employee monitoring policy to include that type of
    data collection. In some states and countries, collecting the results of simulated
    phishing tests may count as personal data collection. Consult with your privacy
    advisor, lawyer, or local works council.


    # Who


    Who will get simulated phishing exercises? All known security guides recommend
    that all staff, including senior management, IT, and IT Security, get “no notice”
    phishing exercises. Any excluded group increases the risk of a real-world phishing
    attack being successful. Do not let real-world phishing be the only test that
    specific groups of employees receive. However, it is critical that everyone understand
    the importance of “no notice” simulated phishing exercises. They should understand
    why such exercises are necessary and important. “No notice” phishing exercises
