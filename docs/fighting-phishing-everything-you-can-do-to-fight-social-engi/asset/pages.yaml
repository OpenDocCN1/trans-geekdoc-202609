    # How to Verify DMARC Checks


    There are two main ways to verify DMARC (i.e., DMARC, SPF, and DKIM) checks. One
    way is to just let the mail agents do their jobs. When DMARC is enabled on sending
    and receiving agents, the agents will verify the various enabled DMARC checks'
