  md: 'BEC phishing scams are very common and result in the second most amount of
    aggregate damage after ransomware attacks. Common BEC messaging subjects include
    the following:


    +   * Update payment instructions for pending payment.

    +   * Invoice overdue.

    +   * Employee asking for a change in their payroll information.

    +   * Emergency gift purchase needed.

    +   * Request for W2 or payroll information.


    One particular type of BEC scam, *real estate wire fraud*, involves scammers tricking
    real estate buyers into sending large payments to rogue bank accounts. Typically,
    these scammers break into real estate agents’, mortgage agents’, loan agents’,
    title agents’, or some fiduciary agents’ accounts that are involved in collecting
    real estate purchase payments, find pending real estate deals, and then wire the
    involved payers with fraudulent payment details.


    The hackers can be quite tricky, in that they monitor the pending deal and wait
    till the last day to send the BEC scam email to the buyers. Everything in the
    BEC scam email is legit (e.g., the name of the involved agent, the amount, other
    payment details, etc.) except for the bank wiring account number. As long as the
    scammer’s email gets to the payers before the real agent’s email does (and the
    BEC scammer usually deletes the real email without the legitimate agent realizing
    it), the money will get sent to the bogus bank. By the time everyone involved
    realizes a theft happened, it can be difficult to reverse the damage.


    The National Association of Realtors stated (www.nar.realtor/wire-fraud) that
    over 13,000 people were victims of Real Estate Wire Fraud in 2020 and lost over
    $213M. There’s been so much Real Estate Wire Fraud and its victims incurred such
    huge losses, that it begs calling out in this chapter separately. If you’re ever
    involved in paying a large real estate'
