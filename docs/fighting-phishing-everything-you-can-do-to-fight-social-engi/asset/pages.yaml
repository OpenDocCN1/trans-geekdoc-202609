- pgno: 74
  md: 'The telephone and SMS industry is trying to move legitimate participants away
    from short codes to a 10-digit number known as Ten Digit Long Codes (10DLCs) for
    SMS messages. 10DLC codes look like phone numbers and can be a telephone number.
    The industry plans to better regulate 10DLC codes and the firms that use them
    more closely and do away with the older, more abused, short codes.


    Nearly all of us, if not all of us, are used to getting smishing messages. Some
    days it seems like all I get on SMS is scam messages. You might think that no
    one falls victim to smishing messages, but the FTC states that US consumers lost
    over $330M in 2022 alone (www.ftc.gov/news-events/data-visualizations/data-spotlight/2023/06/iykyk-top-text-scams-2022),
    and that figure was higher than the previous years. This means that scammers are
    conducting more smishing scams, and/or consumers don’t appear to be getting better
    at recognizing them.


    The legitimate vendors involved with SMS understand how big of a problem smishing
    is. They are trying to evolve the current SMS standards into something better.
    10DLC codes are part of that. Also, many cell phones and SMS apps support a new
    standard called Rich Communication Suite (RCS), which is supposed to make it harder
    for scammers to use SMS. Many users, tired of SMS scams, have moved onto other
    messaging standards, such as iMessage, WhatsApp, Facebook Messenger, Signal, etc.,
    but most of those services have become places where texting scams happen as well
    (albeit less frequently). The lesson is anywhere two people can communicate, scammers
    will try to invade and exploit.


