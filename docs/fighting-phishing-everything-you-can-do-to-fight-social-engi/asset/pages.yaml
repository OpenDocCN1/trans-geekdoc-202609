- pgno: 135
  md: '# # Getting Started with Your SAT Policy


    Fighting any cybersecurity threat means crafting a detailed, layered, defense-in-depth
    set of mitigations, including policies, technical defenses, and training. So far,
    despite more than three decades of the best technical defenses, social engineering
    and phishing attacks continue to get to end users. End users must be taught how
    to recognize social engineering and phishing threats and how to treat and appropriately
    report them. Accordingly, security awareness training (SAT) is among the most
    high-value mitigations any organization can perform to significantly reduce cybersecurity
    risk.


    All security mitigations should have policies directing their application and
    use. All SAT programs should begin with or be driven by an SAT policy document.
    The beginning of this chapter covers the various components that should be covered
    by any SAT policy. The chapter finishes with a generic SAT policy example, which
    can be used as the basis of your organization’s SAT policy if desired. You can
    use this example to craft your organization’s first SAT policy document or use
    it to update or modify your existing document.


    > Any additions/deletions/changes to any policies or documents need to be reviewed
    by the management and legal departments before implementing them.


    # ## Necessary SAT Policy Components


    Creating an effective SAT program requires asking and answering many questions
    along with making sure that your policy covers all of the needed components.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Policy Header Information


    Every policy begins with a header section which includes information such as the
    following:


    +   - Policy title

    +   - Scope

    +   - Current document owner/sponsor/role owner

    +   - Document history by date and version

    +   - Current policy version number

    +   - Location of current policy version


    Your policy documents may contain more, less, or different information. Follow
    your organization’s policy standards and guidelines.


    # Goal


    Your SAT program policy should contain the intended goals and your organization’s
    reason for implementing them. A goal might be something like, “To significantly
    reduce the organization’s cybersecurity risk due to participant actions and decisions
    when faced with social engineering threats, by using security awareness training
    and education. Participants should be able to better recognize cybersecurity risks,
    understand how to report risks and threats, and where to go for help.”


    # Control Mapping


    Many security controls originate from computer security laws, requirements, recommendations,
    or best practice guides. Tying your SAT program back to one or more compliance
    document(s)'
