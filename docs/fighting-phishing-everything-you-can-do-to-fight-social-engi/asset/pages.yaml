  md: '# CHAPTER 16


    Miscellaneous Hints and Tricks


    Chapter 16 digs into a range of helpful and interesting anti-phishing suggestions
    and topics.


    # First-Time Firing Offense


    I occasionally run into bosses who tell me their organization’s anti-phishing
    policy is to fire anyone who inappropriately responds (i.e., fails) to a real-world
    or simulated phishing test. At the first offense, the person is fired. This policy
    is used to communicate the seriousness with which that organization takes phishing
    and to significantly reduce the number of phishing failures they experience. Although
    we don’t have data to back what'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'I’m about to say, I’m going to say it anyway: I think this policy is likely
    to reduce phishing failures below what the average organization faces. Some would
    say it’s a successful policy.


    Most anti-phishing experts and companies do not agree with this strategy, although
    perhaps some scenarios (e.g., stock trading floor, national security computer,
    etc.) may justify it better than others. But two facts make supporting this policy
    difficult (beyond the sheer human cruelty and the fact that the constant fear
    of impending termination doesn’t create the most productive and loyal workforce).


    First, anyone can be successfully phished. Anyone! The person who wrote that policy
    of firing someone for a first-time offense can be successfully phished. I’ve had
    dozens of people through the years tell me they could not be phished and ask me
    to do a simulated phishing test on them. In every case where I’ve agreed to do
    a phishing test on them, I’ve succeeded. I’ve never failed. And guess what? I’ve
    never seen an executive or high-level manager fire themselves for failing a phishing
    test. Not once. And if anyone can be successfully phished, this rule seems to
    be heavy-handed. It seems that luck, whether or not you got a certain phishing
    message that could fool you, is all that is involved.


    Second, it discourages reporting malicious activity that was successful against
    the victim. If you promise to fire the victim because they performed an incorrect
    action as a response to a phishing message, it’s very likely the victim will never
    report it if they have the realization that they were successfully phished later
    on. And that’s definitely against your company’s best interests. You should want
    an environment where everyone is made to feel that reporting a successful phishing
    event is in their own best interests and the organization’s best interests. That
    way the organization gets the quickest reporting and can respond the most quickly
    to the event.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# Text-Only Email


    Some organizations (i.e., national security government agencies) only allow text-based
    emails to be delivered to email inboxes, and everything else is removed. This
    is usually accomplished by using and configuring an email client, like Microsoft
    Outlook, that allows any email to be converted to text-only emails. When this
    policy is enabled, file attachments are removed, URLs are converted to non-clickable
    text, and other “active” objects are removed. Although users often hate this technique,
    this strategy does significantly reduce the risk of phishing emails.


    Keep in mind that the text of a phishing email can and often does motivate a victim
    to do things against their own interests. The text of a phishing email can still
    include a malicious link or email address. It can include a phone number for the
    victim to call. It can include instructions, which if followed, will harm the
    victim.


    For example, a snarky phishing email that gets sent around from time to time claims
    that the user’s computer is infected with a super computer virus that can do all
    sorts of harm. It then instructs the victim to look for certain supposed “computer
    virus” files, and if found, to delete them. Unfortunately, those “computer virus
    files” are just legitimate operating system files found on every system. When
    the user deletes them, their system becomes unstable to unusable. And it’s a pain
    to recover from this because you have to install the now missing files from installation
    disks or a proxy thereof.


    It is even possible for text alone to be malicious. It’s rare, but occasionally
    attackers learn how to manipulate text so that it ends up being converted to malicious
    executables or it causes an exploitable event. Sometimes simply opening a text
    file (e.g., “How to Get a Free HST Modem”) can cause damage. Lastly,'
  merge: -1
  img_proc: true
- pgno: 405
  md: 'keep in mind that phishing messages can come from more than just emails. If
    one day we defeat all email phishing, we still have every other communication
    channel to be worried about and have to educate potential victims about. But with
    that said, if your users can stand using text-only email, it can significantly
    reduce social engineering and phishing.


    # Memory Issues


    A friend of mine, Dr. Matt Canham, has been researching phishing-related topics
    as aggressively as anyone. Matt is especially interested in what makes some people
    more susceptible to phishing and others not. In one research project dealing with
    email, Matt identified users who had fallen for every simulated and real phishing
    attack, and conversely, users who had not fallen for a single simulated or real
    phishing attack. He then interviewed each individual twice separately.


    At the end of the first interview, Matt asked each person to pick a phrase that
    they could be asked for at the start of the second interview so he could link
    the first and second interviews together, without knowing the person’s name or
    any other personally identifiable information. But when he asked the individuals
    for their personally selected keywords at the start of the second interview, a
    strange fact became apparent. None of the people who had fallen for every phishing
    scam could remember their personally selected phrases, and conversely, every person
    who had not failed a single phishing attack successfully remembered their personally
    selected phrases. The results were startling.


    And it begs the question of whether someone who is or isn’t more susceptible to
    phishing might come down to more generalized memory issues. Are people who are
    more likely to forget things overall more likely to be phished? Matt doesn’t know
    for'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'sure, but he plans to design future experiments to test the hypothesis. But
    what if it is true? How would that change your approach to doing security awareness
    training?


    I''m not an expert in the field, but if generalized memory loss is involved, it
    would seem to me that more frequent training to better reinforce the lessons would
    be required. If your normal training cadence is once a month, perhaps for the
    most easily phishable people the cadence should be twice as frequent. I''m not
    sure if you should keep the overall training time the same or double it. You can
    try to test and see what works for your co-workers.


    Perhaps rewards-based training might work better. Offer more and bigger rewards
    and see if that works. Try adding more gamification if that seems like it might
    work. You can even talk to the people with memory issues, explain the situation,
    and ask if they know what works. Most people will tell you what works for them
    regarding learning better.


    # SAT Counselor


    Some organizations that take their security awareness training (SAT) seriously
    employ SAT counselors. KnowBe4, for one, utilizes them. These counselors get up
    with people who have failed multiple simulated phishing tests, with the goal of
    helping the struggling person be more resistant to real and simulated phishing
    tests. They often meet their goal.


    The counselors first review the types of simulated phishing emails that have been
    missed by the end user, asking them if they can spot similarities (e.g., message
    content, time, day, what was going on in the person’s life, etc.). Then they help
    the user walk through what might be some successful hints and actions going forward.'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'For example, this one end user who had failed multiple simulated phishing tests,
    by clicking on embedded links, determined they were just too reactionary and overly
    quick to click on any link. So, the counselor asked if the user might be open
    to configuring their email so that they arrived as text-only. After further discussion
    of how that might impact their work, the user agreed. This meant that any embedded
    link contained in an email came over as a text string, one that the user had to
    copy and paste into a browser in order to visit the URL. This act slowed the user
    down and allowed them to better inspect the URL before “clicking” on it. The suggestion
    worked! The end user no longer fell for any simulated phishing emails. After a
    few months, the user re-enabled their email to its normal, HTML-enabled, configuration
    state, and found that they were still better at inspecting URLs before clicking
    them. Both he and the counselor agreed that if their old, quick, clicking ways
    returned, the user could just re-enable the text-only email option.


    # Annual SAT User Conference


    Every organization should have an annual security awareness training meeting with
    all of the organization’s employees (or at least local employees of the home location
    if the company has many sites) invited to attend. The meeting should be one to
    two hours long and feature free food and drinks and dozens of gift giveaways.
    If possible, the CEO or senior management should kick off the meeting and tell
    the employees how important their SAT training is to the organization’s success.
    Make the session educational, with many examples of interesting phishing attacks.
    Have a quiz with 5 to 15 questions about phishing and cyber defense and give away
    prizes for correct answers. The meeting should be low-key, educational, and above
    all else, fun!'
