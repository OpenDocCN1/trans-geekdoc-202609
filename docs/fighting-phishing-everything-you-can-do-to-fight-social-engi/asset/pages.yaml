- pgno: 26
  md: '# # CHAPTER 1


    # Introduction to Social Engineering and Phishing


    Chapter 1 is going to discuss the importance of fighting social engineering and
    phishing. If you have to persuade your boss or colleagues why fighting against
    these threats matters, this chapter is for you.


    # ## What Are Social Engineering and Phishing?


    I think everyone knows what phishing is. It''s hard to go an entire day without
    being exposed to it in some way. It''s everywhere! We know it when we see it.
    Most of us are exposed to it daily, or nearly daily, usually through scam emails,
    text messages, or calls to our cell phones. Figure 1-1 shows a representative
    common example of a phishing email.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_27_0.png)


    # FIGURE 1-1 Common type of phishing email.


    Figure 1-1 is an example of a very common type of phishing email, likely the most
    common, where the phisher is attempting to make it look like an official email
    from Microsoft asking for an account password. If a victim were to click on the
