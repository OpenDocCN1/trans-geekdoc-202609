  md: 'engineering and phishing attacks. When in doubt as to whether your email client’s
    security settings have been overly weakened, most email clients have a “reset”
    settings option that allows you to quickly reset the email client back to its
    default behavior.


    One of the most commonly misunderstood email security settings has to do with
    how an email client treats pictures and other content when arriving in an email.
    By default, most email clients will not allow active content, such as pictures,
    scripts, and objects to be automatically downloaded and activated when the email
    is first received. This is a great security protection! Don’t change it.


    Most phishers and malware spreaders are hoping that users will open their emails
    and activate whatever content they contain. Even a simple, otherwise non-malicious,
    picture can be used maliciously to track the recipient and confirm their email
    address (known as _web beacons_). Allowing all content to be automatically downloaded
    and executed is a super high-risk activity. Because of this, all users (and admins)
    need to make sure their email clients do not automatically download and run non-text
    content contained in received emails. The location of this setting varies by email
    client, although Figure 9-5 shows an example of the relevant email security setting
    as it is covered in Microsoft Outlook.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_249_0.png)


