  md: 'Simulated phishing tests, where users are sent phishing tests and asked to
    report them, are a sort of game. Many users look forward to being tested to see
    if they can spot all simulated phishing tests or fail the bare minimum possible.


    # Quizzes


    SAT programs should include quizzes, either as part of the involved training module
    or as a stand-alone test. Quizzes should test relevant content, be fairly easy,
    and not require 100% success of all questions and answers to get a passing score.
    Quizzes are used to document a user''s understanding of the material, but also
    as a way to reinforce the material. You give the user the content in the training,
    then again in the quiz question, and then again in the answer.


    Some training content allows users to “test out,” meaning that the user can take
    a quiz about the relevant content, and if they pass, they don’t have to watch
    the relevant training. There are mixed feelings about the validity of testing
    out, but it’s up to each organization to determine if it reduces risk or not.
    But in general, making everyone view training content, with or without a quiz
    involved, will reduce cybersecurity risk more than everyone not viewing the content.


    # Mobile Apps


    Today’s world is a mobile world. A majority of Internet content is viewed through
    a cell phone. Your SAT program should have a way to view and train using mobile
    devices.


    # Immediate Lessons upon Failure


    In the SAT world, the best learning occurs immediately after the failure of a
    simulated phishing test (see Figure 11-4).'
