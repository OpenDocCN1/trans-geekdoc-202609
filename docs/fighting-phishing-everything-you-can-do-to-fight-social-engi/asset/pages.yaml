  md: '# SAT Policy Component Conclusion


    Now you have a pretty good understanding of the types of questions and answers
    that need to be decided before a formal SAT program policy is created. Every organization
    is going to have different needs and requirements based on the culture and policy
    requirements. Use the information discussed so far in this chapter as your guide
    to assist with creating your custom policy. The remainder of this chapter will
    provide an example of an SAT program policy, based on the previous material, that
    you can use to help you craft your policy if desired.


    # Example of Security Awareness Training Corporate Policy


    This is an example of security awareness training corporate policy which can be
    copied and adapted if desired. Consult senior management and legal departments
    before updating or adding any policies.


    # Acme Security Awareness Training Policy: Version 2.1


    | Senior Management Sponsor | Title/Role |

    | --- | --- |

    | Kathy Wattman | Chief Information Officer |

    | Policy Owner | Title/Role |

    | Anna Collard | Chief Information Security Officer |


    # Scope


    The scope of this policy includes all employees, contractors, partners, and third
    parties that handle Acme confidential information across the globe.'
