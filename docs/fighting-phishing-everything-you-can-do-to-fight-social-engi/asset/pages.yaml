- pgno: 32
  md: 'to compromise people and devices. Every single compromise and exploit I have
    ever learned about started with an attack method that falls under one of these
    categories.


    What most people don’t know is how often each attack type (also known as *initial
    root access exploit*) occurs in frequency relative to each other. There are sources
    that track and research the relative occurrence of each attack method. It turns
    out that social engineering is the number one most popular attack method by a
    big margin. Exploited unpatched software and firmware is the second most common
    attack type, and those two attack methods (i.e., social engineering and exploiting
    unpatched software and firmware) together account for 90% to 99% of cyberattacks.
    All the other attack types added up together don’t equate to more than 10% of
    attacks. Social engineering, by itself, is involved in 40% to 90% of all successful
    attacks, depending on which source you read and believe.


    # Social Engineering Statistics


    This section of the chapter will share my research and the findings of others
    in rendering how big of a percentage social engineering and phishing play in today’s
    digital world.


    **My Research** I’ve been tracking the prevalence of social engineering and phishing
    as an initial root access cause as compared to the other 12 attack types for over
    20 years. My data is based upon years of research, where I compared thousands
    of breaches listed in the Privacy Rights Clearinghouse Database (https://privacyrights.org)
    and tied them to their initial root causes. I was mostly interested in, “Why did
    the victim get hacked?”


    The not-for-profit Privacy Rights Clearinghouse organization began tracking breaches
    in 2005. Today, its database contains information on over 20,000 different breaches.
    It is the'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'largest public database tracking database of its kind. It used to be free to
    download, but it currently costs $250. That''s not bad for the aggregate information
    it contains.


    Even with the database as a starting point, it wasn''t always easy to determine
    the initial root cause for a variety of reasons. First, not all breaches included
    a root cause in the database or related public reports. Only in about a third
    to half of the publicly reported cases did a public source list the root cause
    of the hack. Most of the time, I had to do more digging. In those cases, I first
    tried to use my best Google and Bing skills to find official documents or interviews
    where the root cause was discussed. This allowed me to find the initial root cause
    for another third of the cases. Lastly, I tried to email or call people involved
    in the case to get the root causes.


    Other times, the root causes were incorrectly described in the database or related
    public sources. For example, many breaches were incorrectly tied to hacking or
    ransomware. Hacking doesn''t tell me what occurred. It''s all hacking. And ransomware
    is a potential outcome of an initial root cause, not a root cause itself. I would
    have to ask people, “How did the hacker or ransomware get into your company?”
    Sometimes they knew, and sometimes they didn’t. But in the cases where I could
    determine an initial root cause exploit, social engineering was involved in at
    least 70% of the cases.


    Over the decades, I''ve tracked unpatched software and firmware as being involved
    in 20% to 40% of the cases, depending on the year. Recently, in 2023, the computer
    security firm Mandiant said unpatched software and firmware were involved in 33%
    of successful breaches, so the percentages seem to be holding.


    Also, in my career, I was given access to huge proprietary databases of multiple
    companies that were involved in investigating hundreds to thousands or more customer
    data breaches.'
