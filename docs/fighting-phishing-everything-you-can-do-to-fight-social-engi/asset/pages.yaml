  md: '# Pretexting


    Pretexting is when a scammer presents a well-thought, fake scenario (known as
    the *lure* or *pretext*) to a potential victim in order to make them more likely
    to go along with the involved scam. For example, a scammer may call a potential
    victim in HR and claim to work for their external payroll processing company,
    state that they are late in getting a particular needed payroll file, and say
    that even though it was their mistake, they are wondering if they can get it now.


    Pretexting can even be multi-media and multi-staged, such as using a phone call
    to set up the scam followed by an email that is the main scam. For example, the
    scammer poses as an accounts receivable clerk of one company and calls another
    company that has an invoice of theirs that needs to be paid. They contact the
    accounts payable clerk of the second company fraudulently claiming that they have
    a new boss and he''s making them switch to a new system and bank. ..so to expect
    a change in banking details coming soon. The scammer is complaining about the
    new boss and having to learn and use a new system, which seems real enough. We''ve
    all been there. Then, the scammer waits a few days and sends the accounts payable
    clerk an email with new accounts payable instructions. Because the accounts payable
    clerk was waiting for the change, they didn''t find it suspicious. They update
    the banking details and send the payment to the new (unauthorized) bank account.


    A pretexting attack is often used to obtain private information that is then used
    in a follow-up attack. For example, a hacker calls a company''s Help Desk pretending
    to be a brand-new employee who hasn''t started yet and who was told to connect
    with the head of the company''s IT Security team so they could get added to their
    HR and payroll system. The scam caller pleads ignorance and is able to socially
    engineer both the payroll system''s name and the name and email address of the
    IT security'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'team lead. They thank the Help Desk technician and then use

    the newly learned information to start an email scam to get access

    to the payroll system. Pretexting is an advanced form of social

    engineering and has been used in many of the world’s most dam-

    aging phishes.


    # Open-Source Intelligence


    Alternately, scammers often do as much online research on their

    intended targets as they can, learning as much as they can before

    making a call or sending an email. The more the hacker can learn

    about their subject, the more likely they are to be successful in

    their scam. Hackers certainly use different search engines (e.g.,

    Google, Bing, etc.) to search for information and use public

    information repositories, but they can also choose between hun-

    dreds of open-source intelligence (OSINT) tools.


    OSINT tools are either usually cloud-based or can be

    installed on the hacker’s local computer. Each OSINT tool spe-

    cializes in a different type of search (for example, a search for

    valid email addresses, for revealing phone numbers, or for iden-

    tifying missing patches on devices connected to the Internet).

    Most scammers and hackers have their favorite OSINT tools

    that they use to discover information on their potential targets.

    If you are interested, this Github site has over 100 OSINT tools:

    https://github.com/jivoi/awesome-osint.


    To learn more about OSINT see this excellent webinar:

    https://info.knowbe4.com/osint-odw.


