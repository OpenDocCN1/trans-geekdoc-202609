    # DMARC Reporting


    The second most important thing DMARC allows is for DMARC senders to receive reports
    from participating receivers (who choose to send DMARC reports to senders) on
    the treatment and status of emails received from the sender. Senders can choose
    to get *aggregate* reports, which simply tell the sender how many emails claiming
    to be from the sender received at that particular receiving domain passed or failed
    DMARC checks, or *detailed* reports, which give more details on each failed email.
    The aggregate reports allow a sender to track how many emails are failing'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'DMARC checks (i.e., SPF and/or DKIM). The sender can be aware of trends and
    investigate anomalies. The detailed reports will help a sender understand why
    one or more emails failed the DMARC checks. Was it because of attempted phishing
    attacks, errors, or misconfiguration?


    There are many DMARC reporting options. I like EasyDMARC''s summary of them as
    shown in Figure 7-17.


    | TAG | TAG DESCRIPTION |

    | :--- | :--- |

    | v (required) | The version tag. The only allowed value is "DMARC1". If it is
    incorrect or the tag is missing, the DMARC record will be ignored. |

    | p (required) | The DMARC policy. Allowed values are "none", "quarantine", or
    "reject". The default is "none," which takes no action against non-authenticated
    emails. It only helps collect DMARC reports and gain insight into your current
    email flows and their authentication status. "quarantine" marks the failed emails
    as suspicious, while "reject" blocks them. |

    | rua | Aggregate report sending destination. It''s the "mailto:" URI that ESPs
    use to send failure reports. The tag is optional, but you won''t receive reports
    if you skip it. |

    | ruf | Forensic (Failure) report sending destination. It''s the "mailto:" URI
    that ESPs use to send failure reports. The tag is optional, but you won''t receive
    reports if you skip it. |

    | sp | The subdomain policy. The subdomain inherits the domain policy tag (p=)
    explained above unless specifically defined here. Like the domain policy, the
    allowed values are "none", "quarantine," or "reject." This option isn''t widely
    used nowadays. |

    | adkim | The DKIM signature alignment. This tag follows the alignment between
    the DKIM domain and the parent Header From domain. Allowed values are "r" (relaxed)
    or "s" (strict). "r" is the default and allows a partial match, while the "s"
    tag requires the domains to be the same. |

    | aspf | The SPF alignment. This tag follows the alignment between the SPF domain
    (the sender) and the Header From domain. Allowed values are "r" (relaxed) or "s"
    (strict). "r" is the default, and allows a partial match, while the "s" tag requires
    the domains to be exactly the same. |

    | fo | Forensic reporting options. Allowed values are "0", "1", "d", and "s".
    "0" is the default value, which generates a forensic report when both SPF and
    DKIM fail to produce an aligned pass. If either of the protocol outcomes is something
    other than pass, use "1". "d" generates a report when DKIM is invalid, while "s"
    does the same for SPF. Define the ruf tag to receive forensic reports. |

    | rf | The reporting format for failure reports. Allowed values are "afrf" and
    "iodef". |

    | pct | The percentage tag. This tag works on domains with a "quarantine" or "reject"
    policy only. It marks the percentage of failed emails given a policy should be
    applied to. The rest falls under a lower policy. For example, if "pct=70," on
    a domain with a "quarantine" policy, it applies only 70% of the time. The remaining
    30% goes under "p=none." Similarly, if "p=reject" and "pct=70," "reject" applies
    to 70% of failed emails, and 30% go into "quarantine." |

    | ri | Reporting interval. Marks the frequency of received XML reports in seconds.
    The default is 86400 (once a day). Regardless of the set interval, in most cases,
    ISPs send the reports at different intervals (usually once a day). |


    FIGURE 7-17 EasyDMARC''s summary of DMARC options, including reporting options.'
