- pgno: 297
  md: 'entertaining. I think most of us can readily remember the “caveman” Geico commercials,
    the ostrich Mutual Liberty commercials, and the BudLight frogs or Clydesdale horses.
    The more entertaining the content is, the more likely it is to be viewed, viewed
    longer, and remembered.


    SAT programs should train like mainstream marketers: frequent, redundant, and
    entertaining.


    # Compliance


    Every organization has its own compliance education requirements that must be
    covered every year. Examples include the Foreign Corrupt Practices Act, anti-sexual
    harassment, diversity, data collection privacy, etc. Most SAT programs incorporate
    compliance training along with their regular computer security education.


    # Localization


    Many organizations do business in multiple countries. SAT awareness programs should
    contain content that is localized for each different language and culture where
    it is provided. Or at least, they should cover as many different languages as
    possible. The best commercial SAT programs in the world, like KnowBe4’s, cover
    over 35 different languages and dialects.


    Localization should be more than a word-for-word re-translation. Localization
    means understanding the language changes needed in order for the SAT content to
    be best understood in each of the different languages and cultures. What makes
    sense in one culture may not make any sense in another.'
