- pgno: 351
  md: '# Malicious Open Redirects


    Malicious open redirects can be the trickiest of all social engineering hacker
    URL tricks. Every anti-phishing defender’s consistent long-term advice is for
    users to hover over URLs, and if the URL is pointing to a legitimate location
    (i.e., DNS domain), then click on it. Malicious open redirects take advantage
    of this advice by looking for and using legitimate websites that accidentally
    allow an unauthorized third party to add more information to the legitimate URL
    that will take any user clicking on the legitimate-looking URL to an additional,
    unauthorized website.


    For this to work, the involved legitimate website must have a coding vulnerability
    that allows other, unauthorized attackers to append the original, legitimate URL
    with the attacker’s destination URL. Here’s a representative format of what an
    open redirect looks like:


    ```

    https://legitURL.com/path/path?redirect variable=http://newURL.com

    ```


    You have the legitimate URL (represented by legitURL .com in that example) followed
    by a variable that directs the legitimate web server to switch (i.e., redirect)
    to a new website or page as indicated by the value in the redirectvariable variable.
    In real life, the redirect variable can be labeled anything the legit web server
    programmers defined it to be. It’s not called redirectvariable. (That’s just for
    example purposes.)


    The intent of the redirect variable is to allow the legitimate website to switch
    users to other legitimate websites or pages. It’s often used in marketing campaigns,
    to push users to the vendor’s main legitimate website for a moment followed by
    another legitimate website involved in the new marketing campaign.


    The problem is that legitimate website programmers sometimes don’t realize that
    the redirect variable can be rewritten by anyone (i.e., attackers) to send users
    to any other website and not'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'just the intended website of the original legitimate website. The legitimate
    website should only allow the valid redirects that the hosting vendor wants to
    use, but often they forget to put any restrictions on what can be submitted by
    anyone using the redirect variable. Instead, anyone can submit any redirect variable
    value and have the redirect work. That’s the “open” part of open redirect vulnerability.
    When an open redirect exists, phishers will create valid-looking phishing emails
    that contain the related valid DNS domain along with the redirect variable that
    ends up sending the victim to a look-alike phishing website.


    For example, in this malicious open redirect attack from years ago, the legitimate
    vendor Adobe had an open redirect variable allowed to be appended to any URL that
    involved legitimate adobe.com. In this particular case, the variable that allowed
    the open redirect was “p1.” Here is an example of that Adobe open redirect (now
    long fixed):


    ```

    http://t-info.mail.adobe.com/r/?id=hc43f43t4a,afd67070,affc7349&p1=t.mid.acor-mail.com/r/?id=159593f159593159593,hde43e13b13,ecdfafef,ee5cfa06&p1=www.maliciousdomain.com.

    ```


    Any URL associated with variable p1 would cause a visiting user’s browser to automatically
    be redirected to that website, in this example case, a fake www.maliciousdomain.com.
    Any user hovering over the original link would see adobe.com as the legitimate
    domain, and yes, that is where the user is at first going to be taken. But then
    because of a coding vulnerability, any attacker could use a phishing email or
    compromised website that contains the above link with the p1 variable utilized,
    which could then send the user to another unauthorized destination. Here’s a link
    to more discussion of this example redirect: www.reddit.com/r/sysadmin/comments/d9dnnf/heres_a_phishing_url_to_give_you_nightmares.'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'Figure 13-23 shows another real-world phishing attack using a malicious open
