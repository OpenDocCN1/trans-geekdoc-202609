  md: '# # CHAPTER 15


    # Forensically Examining Emails


    There are times when an email arrives in your inbox when you are not immediately
    sure if the email is a phishing email or not. Chapter 15 will cover many of the
    ways anyone can use to further inspect an email to see if it is likely to be a
    phishing attempt or not.


    # ## Why Investigate?


    Why would anyone want to further investigate a suspected or confirmed phishing
    message? Well, there are a lot of reasons, including the following:


    +   - Confirm the fraud.

    +   - Confirm details.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '+   - Recognize patterns and phishing campaigns.

    +   - Use findings to create future prevention, detection, and response controls.

    +   - See specific details and attempts to gain general education and awareness.

    +   - Spot new types of phishing and hacks.

    +   - Confirm who it is not from.


    If you are like me, you''re just curious about how a particular phishing message
    works, where it is from, and what tricks it uses to fool unsuspecting victims.
    I''m especially interested when a phishing message uses a new trick that hasn''t
    been used before (or at least I haven''t seen it before). My natural curiosity
    often sends me down the forensic investigation rabbit hole.


    # Why You Should Not Investigate


    Futilely hoping that you can identify the real sender of a phishing message and
    get them detained and prosecuted by the authorities is probably not a realistic
    reason for a forensic investigation. People who receive phishing messages frequently
    reach out to me because they want help in identifying the real-world identity
    of the criminal behind the scam, usually because they have lost a lot of money.
    I''m here to tell you that the odds of actually identifying the real-world identity
    of the scammer and getting them arrested, much less making a financial recovery
    is close to slim and none. In my over 35 years of doing cybersecurity, I have
    been involved in arresting just three people, and none of those were related to
    phishing scams.


    Most perpetrators are located in a country that will not work with you to help
    identify and detain the perpetrator, even if you could prove who the scammer is.
    And the reality is that it is very'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'hard to figure out who the scammer (person) is. You may be able to tie a phishing
    email to a particular email account or even a physical location (as I will show
    you in this chapter), but finding out the scammer''s real identity is very difficult.
    In the rare case that someone could identify the identity of the scammer behind
    a phishing scam, it’s extremely unlikely to result in that person getting in significant
    real trouble. It does happen, but it’s a lightning strike. It mostly doesn’t happen.


    So, if you want to start forensically examining phishing messages, do so because
    you want to learn more about phishing and how to stop it. Also, note that doing
    a forensic investigation of phishing messages can take up a lot of time. I’ve
    spent many hours, and sometimes days, running down clues and looking for confirming
    information. Most of us don’t get paid to forensically examine phishing messages,
    so you need to make sure you can fit it into your lifestyle or job without any
    negative consequences. Luckily, I’ve always had bosses who understand my natural
