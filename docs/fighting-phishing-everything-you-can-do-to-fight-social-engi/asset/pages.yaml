  md: '**It''s Likely Larger, Much Larger!** It is likely that the social engineering
    stats that are reported, large as they already are, are drastically undercounting
    the true breadth of social engineering scams. One major reason for this is that
    most vendor reports only report on corporate or industry customers. Most reports
    do not survey people at home using their personal computers and phones. If they
    did, they would likely find that most have been targets of attempted social engineering,
    often through email, but also through SMS texting. Who among us hasn''t been phished
    at home through our email, SMS messages, and even voice calls? Some days most
    of my text messages are scams. Most calls I get to my phone are scams. Has anyone
    been asked to extend their auto warranty lately? How many of us have had our parents
    and grandparents successfully scammed?


    The US Federal Trade Commission (FTC) says US consumers lost $330M in 2022 alone
    (www.ftc.gov/news-events/news/press-releases/2023/06/new-ftc-data-analysis-shows-bank-impersonation-most-reported-text-message-scam).
    The FTC''s stats undercount the true size of the losses because most people don''t
    report their losses to law enforcement or the FTC.


    If nearly everyone you know has been approached to be scammed via email and phone,
    how much larger should the social engineering stat be? Most people on social media
    (e.g., Facebook, Instagram, etc.) are routinely approached with scams on those
