- pgno: 392
  md: 'In the early days of the Internet, it used to be when you ran a Whois query
    that you would get the person or company who registered the domain. But these
    days those fields are almost always anonymized, even for legitimate domains. But
    I look for and pay attention to two fields. First is the Registrar Abuse Contact
    Email, which lists an email address of the registrar for reporting malicious actions
    involving the domain. Most of the time the malicious domain is registered with
    a registrar that doesn’t care that the domain is malicious, and sending an email
    to them doesn’t result in any useful action. But occasionally, if the registrar
    is honorable and legitimate, an email to them complaining about the domain may
    actually result in useful action—even a takedown of the domain. But most of the
    time your email is ignored and is simply a waste of time.


    Second, I note the creation date of the domain. If it is relatively recent (within
    days to a few weeks) to the day of your check, then it means the domain is more
    than likely malicious. Legitimate domains are usually registered many weeks to
    months to many years ahead of the time you would be checking them. Legitimate
    domains used with legitimate marketing campaigns are usually created and registered
    months ahead of the time they are used. But malicious domains are often just registered
    hours to a few days from the time they are used in phishing campaigns.


    **Blocklist Checking** It can’t hurt to see if the suspected phishing DNS domain
    is registered on a blocklist/blacklist. Most malicious phishing domains don’t
    end up on blocklists because they are created, used, and discontinued within a
    few days. It doesn’t allow there to be time to be reported to a blocklist, confirmed,
    and then published on the blocklist. But occasionally a malicious phishing domain
    will end up on a blocklist. Figure 15-16 shows an example of a blocklist check.'
