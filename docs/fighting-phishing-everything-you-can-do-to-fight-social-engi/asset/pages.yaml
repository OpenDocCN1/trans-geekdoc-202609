    # # Red/Green Defenses


    Red/green defense systems are a cybersecurity concept where there are two different
    systems for users to use. One, the red system, is only used for business purposes.
    It only has business applications and can only be connected to business networks.
    No non-business or personal tasks are to be performed on the red system. The other
    is the green system, where non-business and personal tasks can be performed. The
    idea is that the business understands that users like to use their work systems
    for personal and non-business reasons, but that those non-business systems and
    tasks expose the organization to too much risk. So, instead of allowing users
    to perform both business and personal tasks on the same work system, the employer
    provides two systems: one for work and the other for personal applications and
    tasks.


    Red/green systems can be provided in a variety of ways along a continuum from
    physical to virtual. Originally, all red/green systems were always two entirely
    different computer systems. Usually, they sat next to each other, marked in some
    way so that the end user could easily identify and be reminded of which system
    was which. This type of red/green system implementation absolutely reduces cybersecurity
    risk (although not all cybersecurity risk). The problem was that giving each user
    two systems doubled support costs. You have the cost of buying, operating, and
    maintaining two different physical systems. You have double the (or at least increased)
    support costs (i.e., two antivirus'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'programs, two operating systems, two asset management client programs, etc.).
    It requires double the electricity, space, and environmental conditioning systems
    to support.


    Some red/green environments use the same computer device but have different storage
    drives (i.e., hard drives) for red and green, and only one can be used at any
    one time. The user has to select, install, and start the hard drive for the environment
    they want to compute in, and when they need to change to the other environment,
    they have to close down computing and swap out the storage device for the other
    version. IT still has to maintain two different systems (e.g., software, etc.).


    Separate physical red/green systems are still used in some ultra-high security
    environments but have basically given way to some sort of virtualized solution.
    On the high end, you might have users given different virtualized workstations
    to use, such as provided by industry leader, Citrix (www.citrix.com). Citrix and
    Citrix-like solutions, can provide anything from a virtualized desktop to virtualized
    applications. The user logs into their real physical computer first and then into
    one or more virtualized desktop or application experiences, all hosted on a centralized
    server. The administrators of those servers highly control what the user can use
    and do. They often prevent unauthorized modification of the virtualized environment,
    preventing the installation of malicious software.


    Users can also run one or more virtualized machines (VMs) right from their own
    physical desktop. There are dozens of VM software programs. Vmware (www.vmware.com)
    is the most popular VM option, but there are many others, including Microsoft
    Hyper-V, Amazon Workspaces, and Oracle Xen. In these instances, both the red and
    green instances can be separate VMs,'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'or one of them can be the physical host while only the other runs

