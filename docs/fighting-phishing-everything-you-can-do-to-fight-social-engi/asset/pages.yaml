    **X-Originating-IP** If you see a header label titled “x-originating-ip” (see
    Figure 15-13), it serves the same purpose as the first “Received:” label, showing
    where the email originated from, by IP address. It doesn’t appear in most emails
    but does show up enough that you need to be aware of it. So, when looking to see
    where an email originated from, look for the bottommost (i.e., first) “Received:”
    or “x-originating-ip” labels.


