    # Physical Protections


    +   * Code-approved fire suppression systems must be deployed to protect computer
    rooms.

    +   * In multi-floor buildings, computer rooms should not be located below the
    second floor.

    +   * Computer rooms should not be located in areas directly exposed to external-facing
    windows or doors.

    +   * Do not leave company devices in unmonitored locations without securing them
    against unauthorized use or theft.'
