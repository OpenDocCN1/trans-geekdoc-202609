    # # End Users Should Not Be Logged on as Admin


    End users should not be logged on with an elevated account such as admin (e.g.,
    Administrator, root, member of Administrators, etc.) when performing regular end-user
    actions (e.g., email, Internet browsing, spreadsheets, word processing, etc.).
    Being logged in with an elevated account while performing those duties is unnecessarily
    risky and increases the chances of a social engineering or phishing success. Not
    being logged in with an elevated account doesn''t mean a social engineering or
    phishing scam won''t be successful, but it does, in many attack scenarios, make
    it harder to be successful. For example, if the scam is trying to get the user
    to install a malicious patch, there is a chance that installing the malicious
    patch requires that the end user be an elevated user to succeed. If they don''t
    have the necessary rights to install a patch, that sort of phishing scam will
    fail.


    # # Change and Configuration Management


    You must have Change Management and Configuration Management enabled on endpoints
    so that secure settings are enforced and unvetted changes cannot be made without
    prior approval.'
