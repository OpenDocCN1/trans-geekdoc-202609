- pgno: 246
  md: '![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_246_0.png)


    # FIGURE 9-2 An example of a full-screen scareware warning.


    Computer-savvy people have usually seen this type of trick enough that they don’t
    panic. They hit the escape key (Esc) to regain control or might even need to kill
    the browser instance or restart the computer. But they know the computer isn’t
    in some “full control mode” where they can’t regain easy control. Less knowledgeable
    users don’t have the same understanding and often fall for the trick and follow
    the screen’s commands. Make sure your security awareness training covers this
    easy-to-defeat, but sometimes frustrating, scam.


    # Browser Notifications


    As previously covered in Chapter 2, “Phishing Terminology and Examples,” browser
    notification phishing is a particular type of phishing that originates from the
    user’s operating system or browser notification features. Most of today’s most
    popular operating systems and browsers have an industry-standard message notification
    feature built into them, which allows websites and apps to ask for permission
    to send messages (see Figure 9-3 for an example).'
