    # Sextortion


    Sextortion is when a scammer uses the threat of revealing a victim’s secretly
    recorded sexual acts (often nude pictures or masturbation) to their family and
    friends to extort the victim for money or further nude photos. Although these
    scammers often don’t have any revealing information on the victim, they often
    do. It depends on the scam.


    In either case, many victims are extremely stressed by the situation, and sextortions
    result in many victims’ suicides each year. It is especially gut-wrenching when
    those suicides have occurred because of completely fraudulent scams where the
    phisher did not have any real evidence of the victim’s sexual proclivities. Victims
    need to understand that even if the scammer does have real evidence and does follow
    through with their exposure threats, it isn’t the end of the world. No matter
    how seemingly shameful at the time, the embarrassment will pass and become a long-forgotten
    (or at least lesser) memory over time.


    There are many resources available for victims and parents dealing with sextortion
    scams, including this one from the FBI: www . fbi . gov/how-we-can-help-you/safety-resources/scams-and-safety/common-scams-and-crimes/sextortion.


