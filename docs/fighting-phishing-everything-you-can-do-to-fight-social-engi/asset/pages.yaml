    need to educate your users about potential phishing threats and follow the vendor''s
    anti-phishing recommendations. Here are Microsoft''s best practice anti-phishing
    recommendations for Teams: https://learn.microsoft.com/en-us/microsoftteams/teams-security-best-practices-for-safer-messaging.
    Here is a link about Slack phishing attacks and how to avoid them: www.techradar.com/news/slack-users-targeted-for-phishing-attacks-heres-how-to-stay-protected.


    In a chapter on networking, it''s also important to note that a big current push
    in network defense is a paradigm known as zero trust security, which has a core
    assumption that adversaries and malware have or are capable of bypassing any network
    isolation. In traditional networking, people, devices, and resources inside'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'of the network perimeter are trusted more by others who are also inside the
    perimeter. A zero trust defense treats all people and devices as untrusted until
    verified, and are continually verified thereafter, even if they are inside the
    network perimeter. Zero trust defenses are strongly promoted by much of the world
    today and are even a requirement of multiple US Presidential Executive Orders
    in 2020 and 2021. For more information on zero trust security, see the following:


    +   • https://en.wikipedia.org/wiki/Zero_trust_security_model

    +   • www.cisa.gov/zero_trust-maturity-model


    # Network- and Server-Level Defenses


    This section of the chapter will cover network- and server-level defenses to fight
    social engineering and phishing.


    # Firewall


    What do firewalls have to do with preventing phishing? Well, as covered above,
    firewalls often separate networks and provide network isolation. If an attacker
    can’t get from one network to another, they can’t spread their phishing message.
    Network isolation can also prevent some network-level messaging attacks from spreading
    past the initial compromised network inside of a multi-network environment. Plus,
    today, most firewalls can do application-level content filtering, which can detect
    and prevent many types of attacks at the application level. If there is a particular
    type of phishing happening at the application level, say in Microsoft Teams or
    Slack, an application-level firewall may be a way to prevent a related phishing
    attack from reaching any users.


    For example, one of the previously listed Teams phishing exploits involves a trick
    where an external sender is allowed to'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'send a Teams message to another organization (www.bleepingcomputer.com/news/security/microsoft-teams-bug-allows-malware-delivery-from-external-accounts).
    This is typically prevented by Teams, by default, but a trick was discovered to
    get around the block. This is the type of scenario that might be prevented by
    an application-level firewall with the right filter enabled. For example, an application-level
    firewall could restrict any attempted inbound Teams or Slack connection attempt
    that originated outside the firewall.


    Or an application-level firewall could prevent external emails from arriving at
    an organization’s email server/service that carried a sender email address of
    the receiving organization (for example, an email stating it was from knowbe4.com
    arriving at knowbe4.com’s email servers but originating from outside KnowBe4’s
    network). Every email server should have this sort of filter put into place by
    default, but many don’t.


    KnowBe4 has a free tool called Domain Spoof Test (www.knowbe4.com/domain-spoof-test)
    that can test if your email server will allow external emails with your internal
    domain email address to arrive successfully.


    # Use Phishing-Resistant MFA


    Today, about half of all phishing attacks attempt to steal login credentials.
    All users should use phishing-resistant multifactor authentication (MFA) to log
    on to devices and applications protecting valuable data and systems. And for sure,
    all access to all network devices and servers should be protected by phishing-resistant
    MFA. If you’re still allowing logons to network devices or servers using regular
    logons and passwords, you’re not doing computer security right. If your network
    devices or servers don’t allow you to use phishing-resistant MFA, you need other
    network devices and servers.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'You need to use MFA, specifically phishing-resistant MFA. Phishing-resistant
    MFA means that the involved MFA solution cannot easily be hacked or bypassed by
    common social engineering or phishing attacks. Unfortunately, most of today’s
    MFA solutions are easily hacked or bypassed by social engineering or phishing.
    So, make sure you are using one of the phishing-resistant MFA solutions.


    **How Can MFA Be Phished?** There are many ways various MFA solutions can be phished
    and it depends on the type of MFA solution. MFA solutions that involve sending
    the user a code that they must type into the website or app (known as a one-time
    password) can be intercepted or learned by a social engineering hacker or phishing
    email. The most common way MFA is compromised is by a phishing email. With this
    type of attack, the end user is tricked into clicking on a rogue URL in a phishing
    email that redirects them to a man-in-the-middle (MitM) proxy service, which then
    connects to the user’s legitimate server/service they thought they were going
    to in the first place. It then captures everything the user types into what they
    think is their legitimate website (including their login name and any MFA login
    codes). Figure 8-1 demonstrates this type of attack graphically.


    You can find the best video demo of this one at www.youtube.com/watch?v=xaOX8DS-Cto.


    > This demo was created by Kevin Mitnick, KnowBe4’s former Chief Hacking Officer
    and a friend of many. He passed away on July 16, 2023, due to cancer. He and his
    many hacking demos on the Internet and YouTube will live in infamy.


    Probably the most popular form of MFA used on the Internet is SMS-based, where
