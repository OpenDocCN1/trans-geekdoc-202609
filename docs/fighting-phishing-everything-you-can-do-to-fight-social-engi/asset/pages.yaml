    # Domain Keys Identified Mail (DKIM)


    Email servers enabling and using DKIM use asymmetric keys (i.e., private/public
    key pairs) to digitally sign outgoing emails. DKIM email has a digital signature
    attached, which allows participating email receivers to verify that the sending
    domain matches the domain stated in a participating email''s DKIM digital signature.
    Did the email come from where it says it came from? It also allows the receiver
    to verify that the email was not modified between the time it is digitally signed
    at the sending email server and when it is opened and verified by the receiving
    user''s software. Further, when DMARC is involved, DMARC wants the DKIM email
    domain to match (i.e., align) to the 5322 email domain.


    > DKIM is about digital signatures and does not do any encryption.


    > DKIM does not require that asymmetric keys used to create DKIM signatures be
    issued by (trusted) Certification Authorities and the keys are not part of the
    PKI x.509 standard.


    DKIM is the harder of the three involved standards (i.e., DMARC, SPF, and DKIM)
    to set up and use. It’s the only one of the three standards to require something
    other than a DNS record to operate. The DKIM admin/service must create and/or
    install an asymmetric key pair on the participating sending email servers/service.
    Using the private key, a DKIM-enabled email'
