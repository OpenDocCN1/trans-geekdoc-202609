    # Simulated Phishing Campaigns


    Acme uses simulated phishing exercises to gauge an employee’s understanding of
    the training and their fitness against particular types of high-risk threats.
    One to two simulated phishing exercises will be sent per week without previous
    notice to participants. Simulated phishing exercises will have a “pass/fail” component.
    Any participant who clicks on a link, downloads an attached document, or follows
    instructions in a simulated phishing exercise will be deemed as having failed
    the exercise. Any participant simply opening a phishing email or message or listening
    to a message will not have been deemed to fail the exercise. Any participant reporting
    a suspected phishing exercise to IT Security or the Help Desk and not clicking
    on any links, downloading any files, or providing any credentials will be considered
    as having “passed” the exercise. Any participant simply deleting and not reporting
    a suspected simulated phish will not reported as passing the test, but will be
    reported as a “soft fail.” Two or more soft fails count as a full regular failure
    rating.


    Clicking on links, downloading documents, or providing login credentials to simulated
    phishing content may result in the end user immediately learning they failed a
    simulated phishing exercise. Afterward, they are shown the “red flags of social
    engineering,” which detail why they should have detected being duped by the simulated
    phishing exercise. A participant correctly'
