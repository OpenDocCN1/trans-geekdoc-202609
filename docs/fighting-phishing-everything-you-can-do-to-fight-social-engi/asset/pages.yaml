  img_proc: true
- pgno: 320
  md: '# Review by Steering Committee


    One of the next steps involving your steering committee is to get them to review
    some of the training content you have built or selected. So, the second meeting
    of the steering committee should be focused on providing feedback with some time
    in-between meetings to look at options. Often we can create a short proof of concept
    (or two) in in-house training using popular eLearning authoring tools. Examples
    of these are Articulate Storyline, Adobe Captivate, or tools built-in to your
    Learning Management Systems (LMS) for building interactive lessons or modules.


    > A Learning Management System (LMS) is a software automation platform for the
    delivery, tracking, administration, documentation, and reporting of educational
    courses and training programs. Many organizations have an LMS.


    # Interactivity


    Interaction is the cornerstone of any good learning activity. When we learn anything
    that we need to apply in our work or personal life, we normally don’t just read
    about it or watch videos on it, but there is a component of interacting with examples
    or questions about scenarios that not only help us to see the relevance but also
    allow us to apply the information we are learning, thus making it more lasting
    in our memories. When we started and throughout the pandemic, many people were
    taking recordings of their normal education programs they would do in person and
    putting them up for employees to watch.


    In this age of TikTok and Instagram Reels, it’s hard to keep people’s attention
    for more than 5 minutes, never mind a 45-minute'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'webinar recording. But eLearning authoring tools allow you to take longer content
    and make it into smaller presentation chunks of maybe 1 or 2 minutes, and then
    have what we call a knowledge check after each of these chunks.


    In the earlier example with the nurses without multimedia access, this could be
    a 1 minute or two of reading, reviewing, and infographics, or exploring (through
    interaction) material within a lesson. These knowledge checks are what we refer
    to as *formative assessments*. They are called this because they help with the
    formation of knowledge and are a teaching tool rather than assessing if the learner
    has understood the material. As such, they should guide the learner even if the
    learner didn’t understand the written/listening material; more interactive formative
    assessments can help them understand the actual content. This guided approach
    helps build knowledge and confidence in the material rather than frustrate the
    user.


    At the end of many lessons, there is often a more summative assessment. Summative
    assessments are more like tests, quizzes, or exams that assess competency about
    what you are trying to teach the learner. You should inform the learner at the
    beginning of the lesson that this summative assessment is coming and it will help
    them focus as they learn. The interactions and knowledge checks throughout have
    a real learning purpose and should not just be for the sake of interaction—like
    a useless recall of a term they just learned in the prior video. Instead, consider
    adding a question that asks them how they would react in a certain situation given
    a scenario.


    Better yet, give them an example of a simulated phishing email that they have
    to explore and identify the red flags that you just taught. If you do need to
    include a multiple-choice question, consider adding distractors (answer choices
    that are not correct but are plausible), avoid multiple correct answers (and all
    of the'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'above), and make sure your correct answer is not the longest answer choice.
    Writing questions and interactive knowledge checks is often harder than it seems
    at first glance, but the more you can pull from real examples to help with this,
    the more powerful they will be.


    # Learning Objectives


    Once you have a tool and a concept of what you want to build or select, the next
    thing is to look at the learning objectives. Learning objectives serve as a guide
    for educators, trainers, and instructional designers to ensure that the content
    and activities provided align with the desired educational goals.


    Learning objectives typically follow the “SMART” criteria, which means they are:


    +   * Specific

    +   * Measurable

    +   * Achievable

    +   * Relevant

    +   * Time-bound


    For anti-phishing training, we want to make sure each lesson has achievable objectives
    for the amount of time we are training and that we are considering where the end
    users are in their current state. One learning objective might be for a short
    training to get people to understand the importance of reporting and know how
    to use the phishing reporting button you have deployed. To make these objectives
    SMART, we can say the following:


    +   * **Specific:** By the end of the training, participants will understand the
    importance of reporting phishing attempts.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '+   - **Measurable:** Participants will correctly identify and explain at least
    three reasons why reporting phishing is crucial on a quiz at the end of the module.

    +   - **Achievable:** The information about the importance of reporting will be
    presented clearly during the training and provide examples and interactions showing
    how to report.

    +   - **Relevent:** Explaining the importance of reporting phishing aligns with
    our organization’s security and risk management goals.

    +   - **Time-bound:** We will allow 30 days for completion of the module.


    # Reviewing Content


    When reviewing content, it’s good to compare the phishing reporting percentage
    30 days before the training is released and 30 days after everyone has completed
    the training. Rather than taking on a bunch of concepts at once (i.e., reporting,
    red flags, URLs, attachments, ransomware, etc.), you should make the lesson a
    digestible chunk that the average end user can understand and master fairly quickly.
    Then you are further chunking that into even smaller and more digestible pieces
