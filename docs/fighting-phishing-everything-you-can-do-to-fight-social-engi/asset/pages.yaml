- pgno: 125
  md: 'common-rogue-url-tricks. You can also watch or share a one-hour webinar on
    how to spot rogue URLs here: https://info.knowbe4.com/rogue-urls.


    # Reporting


    An anti-phishing policy must include a requirement that social engineering and
    phishing attempts must be reported, specifying how they are to be reported and
    to whom. Don’t let a missing policy lead someone into not reporting something
    malicious. I was once consulting at a large Fortune 5 company. This company had
    thousands of contract employees helping to maintain their IT environment. While
    looking around one of their servers, I found a malicious hacking tool (Pwdump,
    a password-dumping tool). The contractor in charge of the server told me he had
    seen that show up months ago, but he hadn’t reported it because looking for and
    reporting malware wasn’t in his contract’s responsibilities. Never give someone
    an opportunity to not report maliciousness.


    You must require that everyone not only report suspected social engineering and
    phishing but also instruct them on how to report it. The easier and more consistent
    you make this process the better. People are far more likely to do simple and
    consistent things than harder-to-do or inconsistent things.


    > It is good to communicate that no one will ever get in trouble for reporting
    a suspected phishing event, no matter how late it is reported. You want to encourage
    people to report possible phishing and not stymie reporting accuracy by holding
    the threat of negative consequences over people’s heads.


    **Phish Alert Button** At KnowBe4, we are fans of our Phish Alert Button(PAB,see
    www.knowbe4.com/free-phish-alert-1).'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'PAB is a downloadable and installable feature that works with Google Gmail
    and Microsoft Outlook (including mobile versions) and gives users a very easy
    way to report suspected phishing emails. It puts a *fishing book* icon in your
    email client (as highlighted in Figure 5-5). When an email reader suspects they
    are reading a possible phishing email, they can click on the fishing hook, which
    forwards a copy to a predetermined email inbox (e.g., for IT Security, Help Desk,
    etc.) and deletes the email from the user’s email inbox.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_126_0.png)


    # FIGURE 5-5 KnowBe4’s easy way to report phishing emails.


    When the phishing email is reported, it can be forwarded to a special email inbox
    where an admin manually inspects it, and/ or it can be inspected by an automated
    phishing detection system (discussed more in Chapter 8, “Network and Server Defenses”).
    My only complaint is that there isn’t a PAB for SMS messages and other places
    where social engineering and phishing can happen. How nice it would be if someone
    was trying to scam you in person and you could just click the PAB, report them
    to the police, and make them disappear!'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Employees must know they need to report all suspected social engineering. Some
    people see an obvious phishing message and think the company’s anti-phishing team
    must surely already know about it. But sometimes, a company can be under a huge
    phishing campaign attack, but because no one is reporting it, IT security is unaware
    it’s happening and doesn’t get involved in putting it down. I was once consulting
    at a Fortune 50 company when it suddenly underwent a spear-phishing attack from
    a Russian adversary trying to learn the passwords of senior executives. It wasn’t
    until the 110th person receiving the spear-phishing attack finally reported it,
    that IT Security knew there was an ongoing phishing attack. When they checked
    other users’ email inboxes for emails related to the spear-phishing attack, they
    found over 1,500 people had been attacked by the spear phishing campaign and over
    one hundred people had sent their corporate password to the Russians in response.
