  md: 'There are lots of these social engineering scams where someone calls up pretending
    to be with a vendor you use. They will try to trick you out of our login name
    and password or send you a password reset code, which they hope you tell them.
    The problem is that you cannot trust whoever it is calling you to be who they
    claim to be. It might be the legitimate people or company calling or it could
    be scammers. You just don''t know. Just realize that SMS and phone calls can come
    from people who are not who they say they are.


    # Personal to Company Attack


    Many spear phishing scams start by abusing personal relationships outside the
    scope of normal business.


    For example, a spear phishing attacker may learn that their victim has a particular
    hobby, say fishing, from the victim''s public social media postings, and then
    send a message to the victim about their shared love of fishing. Since it is the
    victim''s loved hobby and the sender is not asking for anything suspicious, the
    victim is more likely to open up the unexpected message and engage with the sender.
    After just a few short emails, the potential victim may begin to trust the sender
    more than they should, and this misplaced trust is then used by the attacker to
    commit a large (possibly business-related) scam later on. Romance and pig-butchering
    scams fall under this category.


    No matter the type of scam, spear phishing attacks have a far greater chance of
    succeeding as compared to the most common generic types of phishing. This is because
    the attacker is using some sort of information that implies previous legitimate
    involvement with the potential victim. The phisher has “inside” information and
    may even be sending emails from a legitimate person’s email account. It makes
    potential victims more trusting than they should be.'
