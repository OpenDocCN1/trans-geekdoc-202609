- pgno: 102
  md: 'Every organization should have an AUP that is reviewed and signed by every
    stakeholder when hired and annually thereafter. If not, create one and have it
    reviewed and signed by all stakeholders.


    # General Cybersecurity Policy


    Every organization should have a cybersecurity policy, also known by many other
    similar names such as information security policy, InfoSec policy, or IT security
    policy. An organization''s cybersecurity policy is a written and communicated
    document detailing how an organization will protect its information and systems
    from cybersecurity threats. It contains procedures, processes, and requirements
    to protect the organization''s information system assets from physical and logical
    threats. Every employee should be required to review the organization''s cybersecurity
    policies when hired and at least annually thereafter. It should be reviewed and
    signed again when significant changes are made. The policy should protect the
    confidentiality, integrity, and availability (known as the CIA triad) of information
    and systems. It defines the expectations of stakeholders and the consequences
    of not following the requirements. Figure 4-2 shows a partial excerpt of the University
    of Pennsylvania''s Security Policy (www.isc.upenn.edu/ITPC/security-policy).


    # Recommended Best Security Practices


    Cybersecurity policies often include the organization''s required security practices.
    These can vary greatly across organizations and industries. The rest of this chapter
    will cover many common security policy best practices, although it is not an inclusive
    list and may not be appropriate for all organizations.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'I include them here just to highlight many common recommended best security
    practices to consider when making your organization’s cybersecurity policy.


