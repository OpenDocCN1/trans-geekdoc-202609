- pgno: 310
  md: 'You want to create a collaborative environment to help inform the training
    program.


    # Training Frequency and Time Allocation


    Another early decision point is on training frequency and time allocated for training.
    Time is money and leadership isn’t going to be happy if you want tons of hours
    per year where each employee is taken away from their normal productive role in
    the organization. You should reach a consensus with senior management and the
    steering committee on training frequency and time allocation. You want enough
    time and frequency for the training program to be effective, but you also don’t
    want to waste time or add training sessions just because you can.


    For best results, training should be conducted monthly and simulated phishing
    monthly or more frequently. Unfortunately, that’s not what most organizations
    currently do. A recent survey conducted at a 2021 user conference of a simulated
    phishing and security awareness training software showed that 34% of attendees
    trained monthly, 32% trained quarterly, 19% annually, and the rest had not begun
    training efforts or were only doing simulated phishing.


    The longer you go between training and simulated phishing tests, the lower the
    effective results. That is common sense with any training, but especially anti-phishing
    training, where hacker techniques and tricks are continually changing. Research
    has shown that if employees don’t get training on phishing at least every 3 to
    4 months, it is pretty much ineffective. For example, a study from Germany found,
    “... significantly improved performance of correctly identifying phishing and
    legitimate emails directly after and four months after the programme’s deployment.
    Unfortunately, this was not the case anymore after six months ...” (www.usenix.org/system/files/soups2020-reinheimer_0.pdf).'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'A review of KnowBe4’s customers shows that the more frequently customers did
    training and simulated phishing the better customer employees were able to recognize
    simulated phishing tests (and presumably, real phishing emails). You can read
    the whitepaper here: www.knowbe4.com/press/knowbe4-analysis-finds-security-awareness-training-and-simulated-phishing-effective-in-reducing-cybersecurity-risk.


    Program administrators facing frequency and timing challenges often state, “How
    are we going to train more frequently when we had enough trouble with training
    once per year?” Well, an interesting thing happens when you go to more frequent
    and thus shorter training. It gets easier to get people to complete. You start
    building muscle memory in the organization where people are not asking themselves
    “Where did I log in last year and what did I need to do?” and they start just
    getting used to completing their monthly or quarterly training. The short pieces
    also make it more digestible. You might have one 10- to 15-minute module at the
    beginning of the year (Quarter 1) and then each quarter after that is a 5- to
    10-minute module. Many organizations have gone with even shorter content on a
    monthly cadence.


    If you are moving from one, longer annual training session to more training sessions,
    it can be a helpful strategy if the overall time commitment doesn’t change (or
    changes too much). Then you can talk to the steering committee and leadership
    team and frame this as “this is the same amount of total training time as if we
    would do this annually but just spread out more.” It’s more effective and it’s
    less of a one-time big pill to swallow. You want to partner with the head of new
    hire training as well to help them pick a training module for new hire orientation
    and plan for how to integrate people that are hired throughout the year into the'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'training plan. The overall plan for content should cover a 12- to 18-month
    span with a variety of different types of media and topics that are directly informed
    by assessments that have been done including phishing tests, knowledge assessments,
    and surveys.


    Regardless of the decision, document the agreed-upon training frequency and time
    commitment, and get everyone to agree with them. You can share with employees
    how often you do training and simulated phishing tests, although you don''t want
    to tell anyone the exact days or times when you will be doing simulated phishing
    tests.


    # Audience Analysis


    You must accurately understand who your audience is, who will be trained, and
    what are their strengths and weaknesses. You might have to provide different training
    for different types of employees. For example, you might provide different training
    and approaches for white-collar office workers than for oil-rig engineers in the
    field. As part of the analysis of your audience, one of the first decisions you
    should consult with the steering committee about is whether all training will
    be identical for all groups, or you have the need to differentiate the training
    plan for different workers or parts of the organization.


    In one real-world example, a healthcare organization had rolled out multimedia
    training (video and audio) with interactive elements and a quiz at the end. The
    program was largely successful with most parts of the business, and many end users
    really liked the selection of the online lesson that was used. What they failed
    to consider was that they had a large group of workers who did not have speakers
    on their computers or access to headphones. The program leaders seriously considered
    handing out some headphones branded to the program or switching the'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'training plan to something less multimedia-focused for the next quarterly training.
    Smartly, they first conducted a small focus group with the involved workers where
    they discussed options and asked more open-ended questions. What they found was
    that the headphone idea would be too disruptive and hard to pull off because these
    nurses (and it could be any group of workers like this) often had shared workstations
    and a very irregular schedule or training. So, this organization decided to go
    with a completely different plan for the nurses—even shorter training modules
    that were even more frequent and did not involve any multimedia at all. They also
    deployed a mobile app from their learning provider so that this content could
    be consumed without the need to access it via a normal computing workstation.


    A common training program mistake is the fact that organizations think of their
    employees as a more cohesive, similar group than they really are. A real-world
    example of this involved a major multinational bank. They usually had very serious,
    staid training that they would roll out to all employees. Serious, formal training
    seems to make sense because they are a professional financial organization that
    is handling other people’s money. They are bankers. They are expected to be serious
    and formal. But not everyone in a bank is a banker. Within all their business
    units, they also have marketers, salespeople, maintenance workers, and call center
    employees. The serious videos were not going over so well with the non-banker
    business units. So, as an experiment, the bank’s steering committee decided to
    pick a training video that was more lighthearted and fun for their non-banking
    professional business lines. The new type of training went over so well that the
    steering committee ended up rolling it out companywide with equal success. Know
    your audience and know whether you have to train the different types of groups
    differently.


    There also might be people who can identify most phishing emails, for instance,
    but don’t understand the importance of'
