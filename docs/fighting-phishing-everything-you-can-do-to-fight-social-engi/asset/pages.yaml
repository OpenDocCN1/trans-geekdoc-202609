- pgno: 14
  md: '# Introduction


    Social engineering has been around since the beginning of humanity, and phishing
    has been around at least since the beginning of networked computers. I can remember
    my first brush with social engineering via computers in 1987. This was before
    most people had even heard of something called the Internet and before most people
    had personal computers. Many of us early adopters were on a precursor of the Internet
    called the FIDONet. Back in those days, you would use a 300 or 1200 BAUD or BPS
    (Bits Per Second) dial-up analog modem to call your local BBS (Bulletin Board
    System). This system would use a crude “store-and-forward” technology that would
    transmit and receive messages and files around the world in a day or so. We thought
    it all was pretty cutting-edge.


    On one of the BBSs, I came across a downloadable text file named “How to Get a
    Free HST Modem.” HST modems, made by US Robotics, were the fastest and best modems
    available at the time. They ran at an incredible 9600 BPS. They were expensive
    enough that only a few lucky, monied, people had them. They were mostly only used
    by Fortune 500 companies and well-funded universities. This file promised to tell
    anyone who read it how to obtain a free one. It was too enticing to pass up.


    I opened up the file and inside it contained only text that said, “Steal One!”
    “Well, that was disappointing!,” I thought. Then'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'the very next keyboard key I pressed formatted (i.e., permanently erased) my
    hard drive and rendered my computer useless. Well, at least until I reinstalled
    the operating system and redid everything all over again. I lost all files.


    It turns out the file was something called an “ansi-bomb.” It was a malicious
    file that took advantage of a feature of a legitimate operating system file called
    ansi.sys. Ansi.sys was a part of Microsoft’s DOS operating system, which most
    of us ran at the time. Ansi.sys was an optional file that allowed users to have
    extended, “cool,” features for their screen and keyboard, such as displaying special
    graphics and characters on your screen. It also allowed savvy users to map sequences
    of commands to a single key on their keyboard. It was meant to allow people to
    create “macros”—an automated shortcut that triggered a longer sequence of key
    presses. You could hit one or two keys and automate what would otherwise be a
    bunch of other key presses. Some malicious jerk had created a malicious file that
    instructed ansi.sys to map all the keys on the user’s keyboard to format the user’s
    hard drive when the next key was pressed.


    It was a lesson learned.


    There are malicious people in the world who want to harm other innocent people
    for no other reason than they can. Not everyone in the world is friendly and helpful,
    especially to strangers.


    Now, the impact of social engineering and phishing on cybercrime has been driven
    home to me tens of thousands of times during my career. Today, nearly everyone
    understands that social engineering and phishing are responsible for more cybercrime
    than any other single initial root cause method. No other root cause of hacking
    is even close. But just a decade ago, even though it was true then, it wasn’t
    as well known by all cybersecurity defenders. I think everyone knew social engineering
    and phishing was a problem, but few knew exactly how big of a problem it was.
    Few defenders knew it was the number one problem by far. Even I didn’t.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'I worked as a Principal Security Architect for Microsoft Corporation for nearly
    11 years, from 2007 to 2018. For much of that time, I did security reviews for
    customers and installed Public Key Infrastructures (PKI) and advanced security
    defense systems. I was promoted, usually well-liked by clients, and always installed
    systems on time and on budget, which isn’t so normal in the computer industry.
    For years I felt like I was greatly helping to protect my customers.


    Then I realized that *every single* customer I had, no matter what defenses we
    installed, was still falling prey to hackers and malware. This was despite installing
    the best computer security defense systems possible. Why? It was almost always
    due to social engineering (and, secondarily, unpatched software). Even though
    all my customers were spending hundreds of thousands to millions of dollars to
    protect themselves using the most advanced systems the industry could imagine
    and deliver, what was taking them down was the same things that were most often
    taking down companies since the beginning of computers—social engineering. And
    usually, phishing.


    That realization occurred to me in about 2016. It made me depressed. Instead of
    seeing myself as part of the solution, I realized I wasn’t really helping my clients
    to avoid hackers and malware. What I was doing was more smoke and mirrors. I was
    wasting their time and money. But it wasn’t like I was alone. Most computer security
    companies and consultants did what I did, which was concentrating on everything
    but defeating social engineering and phishing, even though they were clearly the
    biggest problem by far. Still, it bothered me tremendously.


    I eventually wrote the first edition of a book about my realization, *A Data-Driven
    Defense: A Way to Improve Any Computer Defense* (www.amazon.com/Data-Driven-Computer-Defense-Should-Using/dp/B0BR9KS3ZF)
    in 2018. The book sold over 50,000 copies (over three editions), and its'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'premise—social engineering is most companies’ biggest cybersecurity threat—led
    me to work for my current employer, KnowBe4. The CEO of KnowBe4, Stu Sjouwerman,
    was one of the first people to read my book and understood its value in not only
    recognizing the importance of fighting phishing and social engineering but also
    in creating an effective cybersecurity defense using data. In April 2018, Stu
    offered me a job and I accepted. I was delighted. Not only was I going to start
    working for a leading firm in security awareness training, which is one of the
    best ways to fight social engineering and phishing, but I was also going to be
    able to concentrate on helping customers fight the biggest weakness in their cybersecurity
    defense as my primary job. I was pretty elated and remain so to this day.


    In the over five years since, as KnowBe4’s Data-Driven Defense Evangelist, I have
    taught hundreds of in-person presentations and online webinars. You can see many
    of my webinars here: www.knowbe4.com/webinar-library. You can download and read
    many of my whitepapers here: www.knowbe4.com/security-awareness-whitepapers. And
    you can request that I do a presentation to your company here: www.knowbe4.com/security-awareness-training-advocates.
    You can see dozens of my presentations for free on YouTube. I speak about a lot
    of topics beyond social engineering, including multifactor authentication, quantum,
    ransomware, passwords, password managers, nation-state hacking, and cryptocurrencies,
    but most of my presentations include something about fighting social engineering
    and phishing even if that isn’t the primary topic. I never miss a chance to educate
    listeners about the importance of focusing on preventing social engineering and
    phishing.


    There is nothing else most organizations could do better to reduce their existing
    cybersecurity risk than to reduce social engineering and phishing threats. This
    book is the best advice for today’s world to help you fight social engineering
    and'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'phishing. I don’t know of another source that has more coverage and suggestions.
    Not humbly, I think I can best teach anyone how to reduce their social engineering
    and social engineering risk. I break down many of the necessary critical lessons
    and processes into the simplest recommendations and charts you’ll see anywhere.
    I cover every policy, technical defense, and best practice education practice
    you should be doing to best stop social engineering and phishing.


    Do you want to know how to best reduce cybersecurity risk from social engineering
    and phishing? Read this book.


    # Who This Book Is For


    This book is for anyone interested in fighting social engineering and phishing
    attacks—from entire organizations to single individuals, from dedicated anti-phishing
    employees to IT managers, and for any IT security practitioner. Because the book
    contains large, distinct, sections dedicated to policy and formal security awareness
    training programs, it can be argued that it is more appropriately focused on organizations,
    ranging in size from small businesses to the Fortune 500. But individuals and
    organizations of any size will benefit from learning the recommendations and best
    practices contained in this book. Many of the lessons in this book should be shared
    with friends and family, and many of them are universal. This is the book I wish
    I read when I first got into the industry.


    # What Is Covered in This Book


    _Fighting Phishing: Everything You Need to Know to Fight Social Engineering and
    Phishing_ contains 17 chapters separated into 4 parts.


    +   • Part I: “Introduction to Social Engineering Security.”


    Part I will begin by introducing all the data and terminology'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'associated with social engineering and phishing. There are dozens of distinct
    definitions that will help you better understand and talk about social engineering
    and phishing. Part I ends with a discussion about the three necessary components
    needed in any computer security defense, including one that fights social engineering
    and phishing.


    +   - Chapter 1: “Introduction to Social Engineering and Phishing.” Chapter 1
    discusses the data and facts around social engineering and phishing and why it
    is so important to defeat if you want to defeat hackers and malware. If you need
    to prove to management the importance of fighting social engineering and phishing
    in your organization, this chapter will help you deliver that argument.


    +   - Chapter 2: “Phishing Terminology and Examples.” Chapter 2 describes the
    dozens of definitions related to social engineering and phishing. There are many
    different types of social engineering and phishing, and understanding the differences
    will help you better understand the threat and how to best fight it. Different
    types of social engineering and phishing require different types of defenses.
    Many different examples of phishing attacks will be presented.


    +   - Chapter 3: “3x3 Cybersecurity Control Pillars.” All security defenses require
    a best risk-managed, defense-in-depth, combination of policies, technical defenses,
    and education to best fight cyber threats. Chapter 3 covers compliance, risk management,
    defense-in-depth, and the three defensive pillars all defenders must know and
    deploy to fight hackers and malware, not just against social engineering, but
    any cyber threat.


    +   - Part II: Policies. “Part II discusses all the general and specific policies
    that any organization should create and deploy to help fight social engineering
    and phishing.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   • Chapter 4: “Acceptable Use and General Cybersecurity Policies.” Chapter
    4 covers general Acceptable Use Policies and general cybersecurity policies that
    every organization should create and deploy to minimize cybersecurity risk. As
    part of the cybersecurity policy section, many general best practice security
    recommendations will be covered. Cybersecurity education begins with good policies
    and this chapter begins that educational process.


    +   • Chapter 5: “Anti-Phishing Policies.” Chapter 5 covers all the specific policies
    that every organization needs to create and deploy to minimize social engineering
    and phishing.


    +   • Chapter 6: “Creating a Corporate SAT Policy.” Chapter 6 is for larger organizations
    that require an official security awareness training program policy. It covers
    all the components a security awareness training policy should contain and finishes
    with an example policy that can be used by readers to create their own.


    +   • Part III: “Technical Defenses.” Part III covers all the software and hardware
    tools that someone can utilize to minimize social engineering and phishing attacks.


    +   • Chapter 7: “DMARC, SPF, and DKIM.” Chapter 7 covers the Domain-Based Message
    Authentication, Reporting and Conformance (DMARC), Sender Policy Framework (SPF),
    and Domain Keys Identified Mail (DKIM) anti-phishing standards and how to deploy
    them within your environment.


    +   • Chapter 8: “Network and Server Defenses.” Chapter 8 covers the most common
    types of network-deployed and server-level cyber defenses used to fight social
    engineering and malware threats. It includes content-filtering firewalls and gateways,
    anti-phishing filters, and network connection mapping.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   - **Chapter 9: “Endpoint Defenses.”** Chapter 9 covers the most common
    endpoint-deployed cyber defenses used to fight social engineering and malware.
    It includes anti-malware scanners, endpoint detection and response software, content
    filters, browser defenses, and email protections.


    +   - **Chapter 10: “Advance Defenses.”** Chapter 10 covers advanced defenses
    like using separate “red/green” systems, hypervisor-hardware-enforced isolation
    systems, DNS defenses, and sophisticated malware detection defenses.


    +   - **Part IV: “Creating a Great Security Awareness Training Program.”** One
    of the most neglected parts of fighting social engineering and phishing is creating
    a GREAT security awareness training program. The last part of this book is dedicated
    to telling anyone how they can create a GREAT security awareness training program.
    If you follow what this section contains, you can help significantly reduce cybersecurity
    risk in your organization.


    +   - **Chapter 11: “Security Awareness Training Overview.”** Chapter 11 gives
    a broad overview of how to create a sophisticated security awareness training
    program, including what it should contain, who should be involved, and what tools
    and methods should be used. If you want to know how to set up a great security
    training program, begin here.


    +   - **Chapter 12: “How to Do Training Right.”** Great training doesn’t just
    happen. It takes planning, preparation, logistics, and cooperation. Written by
    Dr. John Just, Chapter 12 covers the types and quality of training that all great
    security awareness training programs should have including quizzing, next steps,
    and quality feedback loops.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '+   - Chapter 13: “Recognizing Rogue URLs.” One of the best skills you can
    give anyone is how to recognize a phishing URL. Chapter 13 covers, in detail,
    how anyone can tell the difference between legitimate and rogue URLs. It includes
    dozens of examples of rogue URLs and how anyone can detect the fraudulent aspects.


    +   - Chapter 14: “Fighting Spear Phishing.” Spear phishing is responsible for
    more successful data breaches than any other single threat and takes specific
    training to defeat. Chapter 14 discusses how you need to modify your “regular”
    security awareness training program to address the very real risk of spear phishing.


    +   - Chapter 15: “Forensically Examining Emails.” Chapter 15 covers how to forensically
    examine any email to better determine if what you are looking at is a phishing
    email or not. It covers dozens of methods, including DMARC, reverse DNS lookups,
    domain name investigating, blacklisting, and physical address locating. If you
    have ever been stumped on whether an email you are looking at is a phishing email
    or not, this chapter is for you.


    +   - Chapter 16: “Miscellaneous Hints and Tricks.” Chapter 16 covers suggestions
    and hints that didn’t fit in other chapters, like strict anti-phishing policies,
    text-only emails, SAT counseling, and more.


    +   - Chapter 17: “Improving Your Security Culture.” The Holy Grail in the computer
    security defense community is to create a lasting culture of pervasive cybersecurity
    in the organization so that everyone practices excellent cyber hygiene resulting
    in a significant reduction in organizational cybersecurity risk. Chapter 17 will
    define the components of a security culture and discuss how you can get your organization
    there.'
  merge: -1
  img_proc: true
