    Here’s a big caveat. You cannot always rely on the true originating domain or
    IP address to be revealed in email headers. Foreign phishers often rent servers
    or services located in other countries (see Figure 15-14) to send phishing emails
    so they won’t be rejected by email servers that refuse to accept emails originating
    from particular countries (e.g., China, Russia, etc.). Many phishers rent servers
    on Microsoft Azure and Amazon AWS and intentionally rent US-based servers. Phishers
    can also use email services, like Sendgrid.net, Constantcontact.com, Hotmail.com,
    or Gmail.com to send phishing emails. Or they can use otherwise innocent compromised
    computers around the world to send their phishing messages. With that said, more
    often than not, the DNS domain or IP address location information in the header
    is the correct and accurate information.'
