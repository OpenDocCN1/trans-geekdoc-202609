    # How Prevalent Are Social Engineering and Phishing?


    A person, device, or network can be hacked in many ways. How prevalent are social
    engineering and hacking? First, you have to understand what other types of hacking
    social engineering and phishing are competing against. These methods include the
    following:


    +   * Programming bug (patch available or not available)

    +   * Authentication attack

    +   * Malicious instructions/scripting

    +   * Data malformation

    +   * Human error/misconfiguration

    +   * Eavesdropping/MitM

    +   * Side channel/information leak

    +   * Brute force/computational

    +   * Network traffic malformation

    +   * Insider attack

    +   * 3rd-party reliance issue (supply chain/vendor/partner/etc.)

    +   * Physical attack


    To the best of my knowledge, adding social engineering, this is an inclusive list
    of the methods used by hackers and malware'
