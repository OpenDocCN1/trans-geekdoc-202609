    login credentials if they have typed them into a simulated or real phishing campaign.


    # Rewards and Consequences


    The consequences of participants taking or avoiding education and simulated phishing
    campaigns should be documented within the policy. Most SAT experts recommend approaching
    this objective by using more positive reinforcement rather than using only the
    negative consequences, whenever possible. However, all organizations likely need
    to document what a participant can expect if they fail to take required training
    in a timely manner, fail educational quizzes, or fail one or more simulated phishing
    simulations.


    Start by defining the positive reinforcement that will be given for an employee
    completing all required testing in a timely manner and successfully reporting
    real and simulated phishing campaigns. For example, state that every successful
    report of a real or simulated phishing event will result in a positive notification
    to the participant. Another example is if all the employees of a business unit
    complete all required testing on time as a group, they will get a “pizza party.”
    Some organizations even offer individual and departmental bonuses for beneficial
    SAT program outcomes to individuals and business units or include the results
    as part of each employee’s annual review.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'As covered in the previous chapter, each SAT program should clearly communicate
    the actions that will be taken for an employee not taking required education in
    a timely manner, for failing educational quizzes (if involved), and for failing
    one or more simulated (or real) phishing campaigns. For example, an employee who
    falls less than two weeks behind on their required testing might have a meeting
    with their supervisor and HR and expect a possible separation of employment if
    they have not taken the required education within two months. Setting the expectation
    of what happens from one or more successive simulated (or real) phishing failures
    should also be clearly communicated.


    The key to the success of any SAT program is to make the employee understand that
    the actions are not meant to be individually punitive but are meant to help the
    employee understand the risk to the organization involved and help them improve
    their own cybersecurity risk posture. If your SAT policy only covers negative
    consequences, it probably needs to be rethought and recommunicated to be more
    reflective of positive reinforcement.


    SAT program administrators should be aware that repeated failures could be due
    to the design or misdesign of the SAT program. The administrator should always
    consider this in their review and ask why someone is having repeated failures.
    Even if the SAT program is truly sound, it might be better for the organization
    if you try something reasonably different to help people who are truly learning
    and taking better actions more often to succeed.


    A good SAT program administrator should ask users with repeated failures why they
    think they missed something or if there is anything the SAT program could do to
    make the user more successful. Sometimes little useful nuggets of information
    or new hints can be learned to improve the program and its success rate. A good
    SAT program includes a solid feedback loop'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'and self-inspection to help an organization reduce risk the most and fastest,
    without unnecessarily clinging to the “right way” if the evidence contradicts
    it.


    > This doesn’t mean that an SAT program should make the simulated phishing tests
    so easy that anyone can spot them with zero failures. A good program creates simulated
    phishing attempts that mimic the real-world ones, which, if used properly as the
    educational tool that they are, reduce the risk to the organization by making
    participants less likely to be fooled by similar real-world phishing attempts.
    Making simulated phishing attempts too easy or too hard could have a negative
    impact on an organization’s cybersecurity risk reduction.


    # Incident Response


    This was also covered in the previous chapter. If a participant “fails” a simulated
    or real social engineering or phishing campaign, what types of actions require
    an official incident response? For example, a failed simulated phishing event
    may require that IT reset the involved participant’s passwords, so they have to
    be changed within 24 hours. Multiple failed simulated phishing events may result
    in a participant’s device being “locked down” for a set period of time. Failure
    of a real phishing event may result in an official forensic response. Does simply
    opening a real phishing email result in an official incident response or does
    the participant have to have clicked on a URL, downloaded a file, or provided
    login credentials? Does the official incident response require a simple “cleaning”
    of the involved device or does most of the device have to be formatted or replaced,
    along with resetting the user’s login credentials? All of these decisions need
    to be made ahead of time and clearly communicated.'
