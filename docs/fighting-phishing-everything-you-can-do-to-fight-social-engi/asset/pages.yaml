    in a known “clean state,” before I send phishing emails and malware to it for
    testing. That way, if something goes wrong or the malware “escapes” on my virtual
    machine, I can quickly and easily reset it to a known clean state. Every month
    I update patching and re-snapshot the system in an up-to-date, known, good, clean
    state.


    # Submit Links and File Attachments to AV


    You can also submit URL links and/or file attachments to antivirus vendors who
    will scan both and tell you if they think it is malicious. My favorite site is
    to submit links and file attachments to Google’s VirusTotal (www.virustotal.com).
    VirusTotal supports over 70 antivirus (AV) engines, and any file or link submitted
    to it will be examined by all the capable AV engines and a malware detection score
    listed. For example, a score of 2/72 means 2 of the AV scanners detected the submitted
    sample as being malicious while the other 70 engines did not. Figure 15-18 shows
    an example of malware I once submitted to VirusTotal.


    In Figure 15-18, VirusTotal detected malware by 4 of the 71 AV engines involved.
    You can click on the various AV engines that detected malware to see what they
    identified the malware sample as being.


    If only a single AV engine on VirusTotal detects something as being malicious,
    more than likely it is a false-positive. I only trust VirusTotal if two or more
    of the AV engines detect something as being malicious.'
