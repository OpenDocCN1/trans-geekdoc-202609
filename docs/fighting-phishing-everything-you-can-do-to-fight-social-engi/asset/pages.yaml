- pgno: 141
  md: '# Training Specifics


    Your SAT program policy should cover the types of training and training content,
    training schedule, training frequency, and how it is performed. For example, an
    SAT policy should state if training is conducted using in-person instruction,
    remote instruction, pre-recorded videos, printed or electronic posters and newsletters,
    formal presentations, informal “lunch-n-learns,” games, quizzes, and so on. It
    should also document if simulated phishing is used as part of training or if that
    is out-of-scope. The frequency and timing of standard SAT training should also
    be documented. For example, is a longer computer security training done when each
    participant is hired and then a shorter one conducted monthly thereafter, with
    longer annual renewals? The position or person responsible for overseeing the
    security awareness training program should be documented here. If some training
    will require scored quizzes and/or pass/fail competency checks, it should be noted
    here.


    # Simulated Phishing Campaigns


    All organizations should do simulated phishing campaigns as a critical part of
    their SAT training process. Simulated phishing allows an organization to measure
    the success of its training program, measure security culture, and be able to
    identify people who need more training. Simulated phishing can also “gamify” the
    process of reporting suspected phishing attempts, where participants are actively
    looking out for the simulated phishes to report them. Simulated phishing helps
    participants report real phishing attempts with more accuracy.


    Your organization needs to decide if it will use simulated phishing or not. An
    SAT program without simulated phishing campaigns will rarely be as successful
    at truly reducing human risk as one that includes simulated phishing exercises.'
