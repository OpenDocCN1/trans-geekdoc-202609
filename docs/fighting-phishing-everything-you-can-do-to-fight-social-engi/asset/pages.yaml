    # Get Senior Management Approval and Sponsorship


    As with any security mitigation, senior management should be convinced of its
    need and supportive of its implementation. Senior management must drive the organization’s
    security culture. A successful security awareness program will enable other parts
    of the overall business to prosper, and this point should be effectively communicated
    to senior management to get their buy-in and support. Additionally, senior management’s
    ability to act as an evangelist and advocate for the program will yield lasting
    benefits in its adoption and engagement across the business. Every SAT program
    should have the support of senior management and have an official senior management
    sponsor.'
