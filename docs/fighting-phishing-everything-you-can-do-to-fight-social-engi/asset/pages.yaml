- pgno: 305
  md: '# Getting Leadership Support


    Every security awareness training program must have leadership support. It not
    only allows the involved resources to work on the program but also provides legitimacy
    and a budget and communicates the importance of the program to the organization.
    In research done on security culture by KnowBe4’s Perry Carpenter and Kai Roer
    (www.amazon.com/Security-Culture-Playbook-Executive-Developing/dp/1119875234)
    and covered in more detail in Chapter 17, “Improving Your Security Culture,” they
    identified leadership support as being a key factor in changing the behaviors
    and security culture of an organization, which is ultimately what we are doing
    with anti-phishing training. An anti-phishing program without leadership support
    is doomed to inefficient and ineffective outcomes, if not outright failure. If
    you don’t have strong leadership support, you must address it before beginning
    the program.


    On a related note, many organizations have executive leaders who are the worst
    of any group at completing training and failing simulated phishing tests. Usually,
    these two things are true at the same time: executives don’t do well with security
    awareness training, and they don’t (strongly) support the program. Getting senior
    leadership support often helps with training the leadership teams and vice-versa.


    The converse can also be true. Leadership can be incredibly supportive, but even
    that has some pitfalls to be concerned about. It can seem that your senior management
    sponsor is so personally supportive that you may even naturally assume they are
    going to educate the rest of the leadership team and be a continued, strong, advocate
    for the program. Although this is a far better position to be in (than lack of
    executive support), you don’t want to assume that executives are going to be your
    best long-term advocates or have all the right answers. You want to own'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'and be the leader of your program. You want to make sure that you''re educating
    senior leadership and providing the right information and answers. If you have
    strong senior management support, leverage that relationship to get time in executive
    leadership team meetings to present where you are in the process and be constantly
    telling the story of why the organization is on this journey.


    Some organizational cultures allow for executives and other influential leaders
    to be treated just like regular employees when it comes to communication and training,
    but many do not. In many cases, creating a separate plan for the executive team
    before ever creating a plan for the rest of the organization is a crucial step.
    As computer security professionals, we have a natural bias that we often have
    to overcome—we know security awareness training is important and we often assume
    everyone else knows how important it is. But not assuming that all of the leadership
    is automatically supportive, or even should be, is smarter. You may have to develop
    a separate training plan to begin to educate the leadership before even presenting
    them with the plan for the rest of the company.


    **The Importance of “Why”** As previously stated, co-worker Perry Carpenter stated
    in his book, *Transformational Security Awareness* (www.amazon.com/Transformational-Security-Awareness-Neuroscientists-Storytellers-ebook/dp/B07RDM1C2M),
    “People can be aware, but still not care.” You have to make people (both senior
    management and everyone else) understand why doing something is good for themselves,
    personally, and the organization. Although why you are implementing the security
    awareness training program is important for all of your users to understand, it’s
    even more so for senior leadership since their support will be a major driver
    of success or failure.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'The “why” can include the following:


    +   * Significantly decreasing cybersecurity risk

    +   * Decreasing the risk of ransomware

    +   * Decreasing the risk and cost of operational interruption

    +   * Decreasing the risk of loss of customer goodwill

    +   * Decreasing legal risk from stakeholders

    +   * Decreasing the risk that “you” will be known as the person who got tricked
    into taking down the company

    +   * Compliance with a required regulation or law (this alone will often motivate
    senior management)


    # # Winning Over Leadership


    Remember that leadership teams often have many fires going on at once and are
    often on to the next set of them, so restating the problem is a critical step
    in setting up a security awareness training program for success. In these first
    set of meetings with the executive leadership team, try to get on the agenda for
    at least 10 minutes. If you only get 10 minutes, there should be 5 minutes of
    the why you are doing this, some supporting numbers, and where you are in the
    training program process. It can be daunting to go in front of business leaders,
    but be clear and concise with communication and leave 5 minutes for feedback and
    discussion rather than just talking at them.


    A great tip here is to share the results of the simulated phishing test so far
    and how the organization is trending (execs love data and graphs). Follow that
    up with a good story or two—some recent incidents and/or close calls within the
    organization and/or industry. Finish with where you are in the process of developing
    the training plan.


    Sometimes we feel pressure to “have all the answers” and have a draft of the plan
    when we get into these big meetings, but'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'it’s better to talk about the process and convey that we are being thoughtful
    and ask for feedback and buy-in from the leadership team, as opposed to pushing
    a specific agenda. Laying out options and asking for participation from senior
    management is a good tip for this first meeting. Try to avoid using this time
    to make any decisions but use it as a recruitment tool for more program advocates.


    Sometimes the first leadership meeting doesn’t go the way you expected. You can
    have more critics and opponents than advocates. But even then, it’s better knowing
    where you stand with the leadership from this initial ten-minute meeting than
    starting your program not knowing what challenges you do or don’t face.


    You can think of it as a baseline assessment of where your executive leadership
    team is. You can then come up with a plan to work with the execs on an individual
    basis. Some of them might not need much help, but others might need convincing
    that they and their business unit need any help at all. Then you can meet with
    them individually for 15 to 20 minutes, not to overwhelm them with PowerPoint
    slides, but to actually engage with them in presenting your plan for the broader
    organization.


    The executive training program can happen in parallel with the development of
    the security awareness training program for the rest of your users, but it should
    start right after the aforementioned meeting and should be on at least a quarterly
    cadence (if not more often). Executive leadership often prefers shorter training
    content than you might send to the rest of the organization.


    # Form a Steering Committee


    The next step should be forming a steering committee. According to the International
    Association of Project Managers (IAPM), a steering committee is a group of individuals
    who provide guidance, oversight, and strategic direction for a program. Some'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'definitions include “high ranking” as a description of the individuals, but
    it is more important to have a more representative group on the steering committee
    for different layers within the organization. They cannot all be people that totally
    “get it” either, so recruiting for the steering committee beyond the people who
    are already super engaged can be key. Some of the best success stories have happened
    when people complain about simulation tests, are then engaged in conversations
    about the importance of these tests, and end up being asked to join the steering
    committee. You can turn an enemy into a friendly advocate and learn about weak
    points in the program in return.


    Steering committee meetings should be concise meetings that present options and
    get input, and not be open agendas soliciting all possible feedback about all
    the possible things that could be done. There can and should be an open part of
    the meeting for ideas, but I have seen too many of these meetings run like focus
    groups or even devolve into groupthink. I like focus groups, but work should be
    put into structuring steering committee meetings so that we make the best use
    of the attendees’ time and get the most out of these meetings to benefit the program.
    How you do that is going to vary based on where you are at from your first meeting
    with leadership, phishing test performance, and other factors. But make several
    work sessions for yourself and your team (if you are a team of one, use coworkers
    or your boss to vet ideas) and come away with a set agenda, concrete examples,
    and resources for the committee to pick from.


    This would be a good time to share and review phishing stats, survey results,
    and other assessment results. It’s important not to blame and shame at any point
    but to make sure to couch the results in a more companionate way. For instance,
    if departments like Sales and Operations have lower reporting percentages and
    lower assessment scores, point out that this makes sense due to the nature of
    their work and it’s something we need to consider.'
