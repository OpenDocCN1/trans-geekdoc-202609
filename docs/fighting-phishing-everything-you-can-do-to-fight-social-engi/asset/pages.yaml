  md: '> attempts to collect information, gain unauthorized access, simulate the adverse
    impact of opening malicious email attachments or invok- ing, via spear phishing
    attacks, malicious web links."


    and


    > "Provide literacy training on recognizing and reporting potential and actual
    instances of social engineering and mining."


    # Definitions


    This section defines various related definitions that may appear in the policy
    or SAT-related program documentation.


    +   **BEC** BEC is short for business email compromise, which is also known as
    CEO fraud. Malicious social engineering scams where the perpetrator tries to trick
    someone or a business into making a payment they should not otherwise make.


    +   **Cybercrime** The term cybercrime (or computer crime) encompasses a broad
    range of potentially illegal activities. In our context, it means crimes that
    target computer networks, devices, operating systems, applications, and their
    users.


    +   **Endpoint** Another word for the workstation that is used by an end user
    in an organization. Refers to a computer or device at the end of a network connection.


    +   **Exploit** An exploit (in French, meaning “achievement”) is (usually malicious)
    software that takes advantage of a bug, glitch, or vulnerability in other code
    to cause unintended or unanticipated behavior to occur and to gain control of
    a computer system.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '**Gamification** Gamification is the addition of gaming features or principles
    to something that typically does not have a gaming element—in our case, security
    awareness training and e-learning content. Gamification has been shown to improve
    user engagement by increasing people’s inherent ambition to compete, achieve,
    or master. Studies have shown that when people are intrinsically motivated to
    complete a task, they learn better and retain more information.


    **Hacker** Originally: A person who has advanced computer skills, is enthusiastic
    and skillful, regardless of intent. The definition has changed and can indicate
    someone who commits cyber-crimes or is involved in unethical cyber activity.


    **Information Security** Information security is the protection of information
    and information systems from unauthorized access, use, disclosure, disruption,
    modification, perusal, inspection, recording, or destruction.


    **Malware** Malware is a shorter version of the term “malicious software.” It
    is an umbrella term used to refer to a wide range of viruses, worms, Trojans,
    and other programs that a hacker can use to damage, steal from, or take control
    of endpoints and servers. Most malware is installed without the infected person
    ever realizing it.


    **Patch or Update** A software update intended to add features or repair a vulnerability
    that was discovered after the product was released for general use.


    **Phishing** Phishing is the process in which cybercriminals using a false identity
    try to trick a potential victim into revealing'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'sensitive information or taking a potentially dangerous action, like clicking
    on a link or downloading a malicious file attachment. It is commonly done using
    email, websites, instant messaging, SMS, voice-based calls, or in-person. It''s
    a form of criminally fraudulent social engineering. Also, see Spear Phishing.


    **PII** Personally identifiable information (PII) is defined as any instance of
    an individual''s information if it can be used to uniquely identify a specific
    individual. Most laws and regulations require that the possessor of other people''s
    PII must protect it against unauthorized access.


    **Ransomware** Ransomware is malware that cryptographically denies access to a
    device or files until a ransom has been paid. One of the most dangerous forms
    of malware today.


    **SAT** Security awareness training. Education to make participants aware of how
    to recognize particular types or signs of threats and take the appropriate action.


    **Security Policy** A written document that states how an organization plans to
    protect its physical assets and information.


    **Security Vulnerability** A programming or structural weakness that allows an
    attacker to gain unauthorized access or disrupt the normal operations of a network,
    device, operating system, or application.


    **Smishing** Phishing conducted via short message service (SMS), a telephone-based
    text messaging service. A smishing'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'text, for example, attempts to entice a victim into revealing personal information.


    **Social Engineering** Social engineering is the act of manipulating people into
    performing actions or divulging confidential information. While similar to a confidence
    trick or simple fraud, the term typically applies to trickery or deception for
    the purpose of information gathering, fraud, or computer system access; in most
    cases, the attacker never comes face-to-face with the victim.


    **Spam** An unsolicited, unwanted email or message.


    **Spear Phishing** Spear phishing is a small, focused, targeted attack via email
    on a particular person or organization to penetrate their defenses. The spear
    phishing attack is done after research on the target and has a specific personalized
    component designed to make the target do something against their own interest.


    **Trojan** A Trojan Horse program (shortened to Trojan) is a very common, non-self-replicating
    malware that pretends to perform a desirable function for the user, but instead
    facilitates unauthorized actions. The term is derived from the Trojan Horse story
    in Greek mythology.


    **Vishing** A phishing attack conducted by voice-call over a phone.


    **Whaling** Phishing attacks that target high-ranking executives at major organizations
    or other highly visible public figures.'
