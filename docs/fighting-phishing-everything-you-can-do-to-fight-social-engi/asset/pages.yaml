- pgno: 104
  md: '+   - Do not leave company devices in vehicles where they can be readily seen
    from outside the vehicle.


    +   - Employees must immediately report any lost or stolen IT assets.


    +   - Any device with access to company networks or data must require an authentication
    logon to access.


    +   - Any device with access to company networks or data must have disk encryption
    enabled using industry-accepted cryptography and key sizes.


    +   - Printed confidential information should be secured when not actively being
