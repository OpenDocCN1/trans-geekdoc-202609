  md: '# BEC Scams


    After ransomware, business email compromise (BEC) scams are the most financially
    destructive cyberattacks to most organizations. Every SAT program should include
    education about BEC scams.


    # Spear Phishing


    Every SAT program should define spear phishing, give lots of relevant examples,
    and tell employees how to mitigate and report it. Chapter 14, “Fighting Spear
    Phishing,” will cover this in more detail.


    # Increase Sophistication and Maturity over Time


    Like any other learning regimen, education should get more sophisticated and mature
    over time. Brand new SAT programs should start with very obvious, common examples
    of social engineering and phishing attacks and then move on to less obvious examples
    over time. In KnowBe4’s system, our simulated phishing templates are ranked on
    a scale from 1 to 5 as far as how hard it would be for a regular user to recognize
    them as phishing emails. The entire organization should, at first, be sent very
    obvious phishing emails. Then individual employees should be sent more and more
    mature, simulated phishing tests as they successfully pass each previous phishing
    maturity level. The overall goal is to get the entire organization moved to the
    most mature and sophisticated phishing tests possible over time.


    # Train Like You Are Marketing


    Have you ever noticed that your favorite (or most hated) commercials are advertised
    all the time on television? They aren’t'
