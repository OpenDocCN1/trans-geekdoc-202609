- pgno: 197
  md: '# Configuring DMARC, SPF, and DKIM


    Creating the DNS records, enabling, and configuring DMARC, SPF, and DKIM is beyond
    the scope of this book. It would take many dozens of additional pages to cover
    configuration options. There are dozens of different configuration options in
    each protocol and it is easy to make a mistake. Enabling each of them varies depending
    on the involved email and DNS service. But if you do a little Internet searching
    on DMARC, SPF, and DKIM, you will find hundreds of pages about these protocols
    and how to configure and enable them.


    There are many open-source tools related to DMARC, SPF, and DKIM. Most are related
    to DMARC data collection and reporting, graphically showing DMARC report data.
    You can also avail yourself of any of the commercial companies that will handle
    DMARC, SPF, and DKIM for you. Many organizations find it far easier to let someone
    else handle it for them. There are many good commercial services, including the
    following:


    +   * EasyDMARC

    +   * Dmarcian

    +   * Agari

    +   * Validity

    +   * Dmarcly


    KnowBe4 is an investor in EasyDMARC.


    In general, if you use a commercial service, you’re going to have a better DMARC
    experience and outcome.


    If you are interested in learning more about DMARC, SPF, and DKIM and how to enable
    and configure them, consider watching my related one-hour webinar: https://info
    .knowbe4.com/implementing-dmarc.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Putting It All Together


    DMARC, SPF, and DKIM work in conjunction with each other. When all are enabled
    on the sender''s side, a receiver can validate multiple pieces of information.
    SPF will validate the sender''s 5321 email address domain. DKIM will allow the
    receiver to verify the domain indicated in the sender''s DKIM signature (i.e.,
    the d= variable) and that the email was unadulterated from the time it was sent
    to the time it was received. DMARC will verify the alignment of the DKIM signature
    to the 5322 email address domain. Each of these services will have its own PASS
    or FAIL (or other designation). A FAIL from any of them will apply DMARC''s policy
    instruction (indicated in the p= variable) of how the receiver should handle failed
    emails (i.e., None, Quarantine, or Reject).


    From a path flow perspective, when a DMARC-enabled email arrives at a receiver''s
    email server/service, that email server/service will first apply all its normal
    cybersecurity checks (e.g., anti-phishing, anti-spam, anti-malware, content filtering,
    etc.) and then start to apply the DMARC checks (if enabled). If DMARC is determined
    to have been enabled (as indicated in the email headers), the receiving email
    server/service will connect to the sender''s DNS server and download the DMARC,
    SPF, and DKIM DNS records. It will then use those DNS records to do the involved
    validation and update the email headers as determined by the validation outcomes.
    Based on the DMARC, SPF, and DKIM checks, the email may or may not be sent to
    the recipient''s email inbox or quarantine folder. The email can also be rejected
    at the email server/service and never make it to the final recipient''s email
    client. This process is graphically summarized in Figure 7-18.'
  merge: -1
  img_proc: true
