- pgno: 46
  md: '# CHAPTER 2


    # Phishing Terminology and Examples


    Chapter 2 will define dozens of terms used when discussing phishing-related events.
    It will include examples of many different types of phishing. My hope is that
    everyone, whether new to phishing or not, will walk away with a stronger base
    understanding of what’s possible with social engineering and phishing.


    # Social Engineering


    Let’s revisit the definition of social engineering from Chapter 1, “Introduction
    to Social Engineering and Phishing.” As used in this book, social engineering
    is a malicious scam, where a perpetrator is often pretending to be someone else,
    a group, or a brand'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'that the potential victim might implicitly trust more (than an unknown person),
    attempting to get the victim to perform an action that is contrary to their self-interests.


    # # Phish


    As discussed in Chapter 1, *phishing* is a type of criminal social engineering
    that involves online digital media. Phishing can happen in many different ways,
    including email (the most popular method), voice calls, in-person, websites, text
    messages, instant messaging, collaboration apps, and social media. Figure 2-1
    is an example of a common type of phishing email.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_47_0.png)


    **FIGURE 2-1** Example of a common type of phishing email.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'In this example, a fake Netflix email is trying to get the potential victim’s
    Netflix login credentials or credit card number. You can see that the originating
    email address is not from netflix.com as it would be if the email was legitimate.
    If a victim were to click on the Update Profile button, they would be taken to
    a fake Netflix website where they would be asked to input their password and possibly
    credit card information.


    # Well-Known Brands


    Phishing messages will often fraudulently appear to come from a well-known brand
    (e.g., Microsoft, Facebook, Netflix, DocuSign, Amazon, DHL, USPS, etc.). Usually,
    some part of the email address will have the brand’s name in it, even though a
    phishing email is rarely truly from the brand or the brand’s Internet domain.
    We will cover how to tell the difference in later chapters, especially in Chapter
    7, “DMARC, SPF, and DKIM,” when we cover DMARC, and Chapter 13, “Recognizing Rogue
    URLs.”


    Phishing emails will typically include the brand’s recognizable trademarked logo
    and may contain text, objects, and other links from or pointing to the brand’s
    real website. It’s not unusual for a phishing email to contain all valid brand
    links, wording, and objects with the only completely fraudulent item being the
    single button or link the phishing message is trying to get the potential victim
    to click on. Phishing emails often include statements that the email is legitimate
    or virus-free. It costs the phisher nothing to add those statements.


    Many different anti-phishing companies publish monthly or quarterly reports detailing
    the most popular simulated brands. Here is an example report: https://blog.checkpoint.com/security/dhl-replaces-microsoft-as-most-imitated-brand-in-phishing-attempts-in-q4-2021.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# # Top Phishing Subjects


    Phishing messages must contain a subject, a *lure*, that induces the potential
    victim into viewing or opening it and thinking it is a legitimate message. There
    are hundreds of thousands of different possible phishing messages, although there
    are a few dozen subject headings that tend to be very popular in particular periods
    of time. If you search or subscribe to an anti-phishing newsletter or blog, you
    can often learn what the most popular email subjects and titles are at a particular
    moment. According to https://blog.knowbe4.com/q2-2023-top-clicked-phishing, these
    are the top ten most popular phishing message titles in the second quarter of
    2023:


    Common “In-The-Wild” Emails for Q2 2023:


    +   * HR: Staff Rewards Program.

    +   * Someone is trying to send you money.

    +   * IT: Important Email Upgrades.

    +   * ALERT: Mail Redirect Triggered.

    +   * Amazon: Action Needed: Purchase Attempt.

    +   * Microsoft 365: [[display_name]], MFA Security Review is Required.

    +   * A fax has arrived.

    +   * Google: [[manager_name]] invited you to join Google Chat Group.

    +   * Metamask Wallet Update.

    +   * Chase: Confirm Your Card Possession.


    Top Phishing Email Subjects Globally:


    +   * Possible typo.

    +   * HR: Important: Dress Code Changes.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '+   * HR: Please update W4 for file.

    +   * Adobe Sign: Your Performance Review.

    +   * HR: Vacation Leave Notice: Plan Your Time Off Now!

    +   * HR: Vacation Policy Update.

    +   * HR: Your training is past due.

    +   * Google: You were mentioned in a document: “Strategic Plan Draft.”

    +   * You Have A New Voicemail.

    +   * Bad customer review received: Please take action ASAP.


    HR phishing messages seem particularly popular because they are often opened by
    victims.


    These messages are normally trying to entice their victims to perform an action
    that is against their self-interests, typically by clicking on an Internet website
    link, downloading malware, paying a fraudulent invoice, or providing confidential
    information (such as login information, social security number, or banking information).


    # Stressor Statements


    Most phishing messages include a statement, known as the _stressor statement_,
    which is intended to induce the recipient into responding quickly without deliberate
    due consideration. Not all phishing attempts include them, but nearly all do.
    The phisher doesn’t want the recipient to spend a lot of time considering the
    relative risks of whether to perform the requested action or not. They want the
    intended victim to respond immediately (the “fight or flight” response), without
    using due caution. These are some common examples of stressor statements:


    +   * Your password is expiring, and you will permanently lose access to your
    account if you don’t respond now.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   - Your account has been hacked.

    +   - You will lose money if you don''t perform the requested action.

    +   - You are being charged for an unexpected payment.

    +   - A legal document signature is required.

    +   - Some confidential information or embarrassing facts will be released if
    you don''t respond now.


    Figure 2-2 gives a good example of a sophisticated phishing stressor statement
    from a 2023 phish.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_51_0.png)


    FIGURE 2-2 Example of a phishing email with a sophisticated stressor statement.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'The phishing email was related to an advanced phishing scheme that involved
    Kroll and FTX (https://krebsonsecurity.com/2023/08/kroll-employee-sim-swapped-for-crypto-investor-data).
    Kroll is a large cybersecurity vendor and they were handling the cryptocurrency
    accounts of customers of FTX, one of the largest cryptocurrency companies ever
    to go bankrupt and its executives to undergo federal indictment. FTX''s customers
    have likely lost billions of dollars. Kroll was picked to temporarily hold FTX''s
    customer information while all the legal and financial problems were being resolved.
    The idea was that FTX''s customers would get some of their money back in the future,
    and Kroll would be at least partially involved in making sure the appropriate
    amounts of recovered money made it to each customer.


    A hacker (or hacker group) was able to gain control of at least one Kroll employee
    account (using what''s known as a SIM swap attack) and gained access to FTX''s
    customer information, including email addresses. The hacker then sent FTX''s customers
    the phishing email shown in Figure 2-2. Some victims said they got the phishing
    email multiple times, up to 15 times. The stressor statement implication is that
    anyone still waiting to get their money back could click on the Withdraw Now button.
    So, all the FTX''s customers who thought they had lost either all or part of their
    money that was stored with FTX, could suddenly and surprisingly, get all their
    money back. That''s a huge motivator for FTX''s customers. But when victims followed
    the suggested action, they just lost further cryptocurrency or money. Any email
    arriving with a stressor statement should be immediately suspect until proven
    otherwise.


    Most phishes contain links they want the potential victims to click on. The victim
    may see the link or it may be embedded in a button they have to select or click.
    Today, about half of all phishing messages are an attempt to get the victim''s
    login credentials.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# # Malicious Downloads


    Currently, about a quarter of all phishing messages include a malicious download
    (or a link to a malicious download) that the scammer wants to trick the user into
    executing or opening. Malicious files can come in over a hundred different file
    formats. According to VirusTotal, these are some of their findings regarding the
    types of these malicious files (https://assets.virustotal.com/reports/2023emerging.pdf):


    +   - Often, the scammer is trying to get the user to run a Java-Script file,
    which contains malicious instructions.

    +   - About 20% of malicious files are compressed (e.g., .zip, .arc, etc.).

    +   - About 45% of malicious file attachments are .html files.

    +   - About 10% of malicious downloads are PDF files with harmful embedded instructions
    or links.

    +   - Microsoft Word and Excel files are decreasing in popularity since Microsoft
    automatically blocked macro execution a few years ago.

    +   - ISO and Microsoft OneNote file formats are increasing in hacker popularity
    in 2023.


    Many malicious files are often password-protected or locked so that anti-malware
    detectors cannot open them. In those cases, usually, the password or unlock code
    is part of the phishing message text so that the file gets past malware inspectors
    but is still able to be opened by potential victims. Locked or unlocked, sadly,
    a large percentage of malicious downloads are not detected by any antivirus scanner
    as malicious and can readily exploit the end user if opened.


    Links and files are often programmatically chained together so that when the user
    opens the first one, they get a second, which'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'opens a third, which opens a fourth, and so on. This is a clever way for the
    malicious code to be missed by anti-malware inspectors. The more links in the
    chain, the more likely maliciousness is to be missed by anti-malware inspectors.


    # # Malware


    Malware (short for Malicious Software) is any malicious program or set of instructions.
    Traditional malware was classified as one of three types: computer virus, computer
    worm, or trojan horse program. A virus is malware that replicates and travels
    by infecting other “host” programs, data, macros, or disk boot areas. A worm is
    a self-replicating malware that spreads using its own coding, although it often
    relies on exploiting services/daemons. A Trojan Horse program is malware that
    pretends to be a legitimate program to trick end users into spreading and opening
    it but contains rogue code that the user would not execute if they knew about
    it.


    Today, computer viruses are a minority of malware. Computer worms are not super
    popular but are among the fastest-spreading malware when they do spread (e.g.,
    MS-Blaster, Code Red, SQL Slammer Worm, Melissa, etc.). These days, most malware
    is either a trojan horse program or a hybrid using traits from two or more malware
    classes. The differences between the different malware classes aren’t as important
    to most people anymore, and it’s very popular just to use the term malware for
    any type of malicious program.


    # # Bots


    A bot is a malware program designed to act as a node in a larger collection of
    bots across a network known as a botnet. Bots are'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'programmed to perform specific sets of actions and instructions

    and can often be updated.


    A large percentage of phishing messages exist to spread bots,

    hoping to turn the victim’s network or device into a participating

    botnet node. Botnets can range in size from hundreds of bots to

    hundreds of thousands of bots in a single botnet. The owners of

    the botnet often rent it to other hackers for a variety of purposes,

    including malware distribution, sending phishing emails, distribu-

    ted denial-of-service (DDoS) attacks, login credential theft, and

    anything the hacker or botnet owner can think of. Millions of

    people around the world don’t realize that right now their com-

    puter or network device is part of a botnet, capable of intercept-

    ing their confidential information or being used to attack other

    computers and networks.


    # Downloader


    A _downloader_ program is malware designed to gain initial access

    to a victim’s device, potentially collect some rudimentary infor-

    mation (such as the host name, host IP address, network name,

    logon theft, etc.), and then “dial home” to its controlling

    Command-and-Control (C&C or C2) servers to send that collected

    information and receive more instructions. It is also known as a

    dropper. Often, instructions include downloading other malware

    and enabling remote backdoor access to victims’ computers for

    the hackers. It is very common for the initial program that com-

    promises a victim to be updated and replaced by one or more

    other malware programs over time.


    # Account Takeover


    _Account takeover_ is when a hacker takes control of a user’s online

    digital account, usually by stealing the legitimate user’s login'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'credentials, but it can be done by other means. The most common form of account
    takeover (ATO) is email account compromise, where a user''s email account is under
    the control of a hacker. This is a very common type of attack usually done by
    phishing and is accomplished by hackers millions of times a day to steal the legitimate
    user''s email login credentials.


    ATO can also be when the user''s social media account (e.g., Instagram, Facebook,
    Twitter, LinkedIn, etc.) is taken over. Again, this is usually accomplished by
    phishing for the legitimate user''s login credentials. Sadly, all the major social
    media services do a very poor job of helping legitimate ATO victims regain control
    of their accounts. Often, once taken over by a hacker, the legitimate user never
    regains access to their stolen account ever again.


    One lesson is to realize that social media accounts are not the user''s and if
    lost, the user may never regain control. If you only have one copy of the content
    in the social media account and you would be upset or harmed if it went away,
    back it up locally. Also, use phishing-resistant multifactor authentication (MFA)
    to protect your account logons. It is one of the best ways to protect yourself
    against ATOs.


    # Spam


    Spam is a type of unwanted message that is often attempting to sell you something.
    It is also known as unsolicited bulk email or junk mail (when it applies to physical,
    paper-based mail). Some people and groups include phishing as a type of spam,
    and others differentiate it because phishing is more often trying to steal money
    or get the potential victim to perform an unauthorized action—not just trying
    to sell something. If an email is trying to sell you porn or Viagra and will take
    your money and send you a product, it''s spam. If it''s trying to get your bank
    account details'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'or install malware, it’s phishing. Phishers don’t usually send victims anything
    but stress and heartache.


    Like spam, most phishing is of the bulk variety, where thousands to millions of
    phishing messages are sent to a variety of recipients without the phisher knowing
    any of the intended targets. Many phishers will send out tens of millions of phishing
    messages in a single *phishing campaign*. The phisher’s intent is to send out
    so many phishing messages that even if only a tiny fraction of potential victims
    respond (say 0.1% to 2%), it is still profitable for the phisher. In phishing
    vernacular, if a victim responds to a phishing campaign, this is known as a *conversion*.
    The percentage of victims who either respond or actually end up being exploited
    is known as the *conversion rate*. Phishing campaigns with good conversion rates
    will be repeated.


    # Spear Phishing


    *Spear phishing* is when a focused, targeted phishing attempts to exploit a specific
    person, position, team, organization, or group. For example, maybe the phisher
    is trying to compromise the employees of a particular bank. Or they are trying
    to socially engineer a particular accounts payable clerk at a particular company.
    Phishers doing spear phishing often research their intended targets and try to
    use information they find on publicly available websites and social media or use
    private or confidential information they have previously learned from other exploits.
    General phishing rarely has confidential information on the intended victims,
    whereas, spear phishing often does.


    A good example would be a spear phishing email sent to an accounts payable employee
    that includes a real existing PO number that was sent to a particular customer.
    The spear phishing email asks for the accounts payable employee to make the payment
    to a new bank, and because the request includes a valid PO number, it’s more likely
    to be followed than a request that doesn’t.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'A spear phishing email could mention a particular project the employee is working
    on and supposedly includes a related project document they need to read (which
    is booby-trapped with malware). For this reason, many defenders educate people
    to be aware that anything that appears on their personal website(s) or their social
    media accounts can be used against them.


    As mentioned in Chapter 1, in May 2023, Barracuda Networks reported that although
    spear phishing only accounted for less than 0.1% of all email-based attacks, it
    actually accounted for **66%** of successful compromises (www.barracuda.com/ reports/spear-phishing-trends-2023).
    If social engineering and phishing account for 70% to 90% of all successful compromises,
    and email attacks are most of that, it means email- based spear phishing is responsible
    for 46% to 60% of all compromises. That’s a huge percentage of cyber attacks attributable
    to just one type of attack. That’s why we will cover how to specifically defend
    against spear phishing attacks in a separate chapter, Chapter 14, “Fighting Spear
    Phishing.”


    # Whaling


    *Whaling* is spear phishing directed at one or a few top people within a specific
    group or organization. It could be targeting a particular executive at a company
    or perhaps anyone in the senior management team. The concept is that if the phisher
    is successful, they are more likely to have a bigger impact than their usual phishing
    target. With whaling, less actual phishing possibly produces a more profitable
    outcome.


    # Page Hijacking


    *Page hijacking* is when one or more pages on a legitimate website have been maliciously
    modified to contain rogue instructions.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Usually, the maliciously modified web page will quickly redirect the intended
    victim to a brand-new (rogue) website where the phishing scam can continue. The
    victim thinks they are on a legitimate website and does not know that it was maliciously
    modified. However, with redirects (covered more in Chapter 13), the new (rogue)
    website location will be indicated in the browser''s link location. All the potential
    victim has to do is reconfirm their website link location.


    Sometimes, only one or a few smaller components of a legitimate website will be
    modified, but the user is still on the real, legitimate website (and not redirected
    to a new rogue website). For example, it is common for maliciously altered retail
    websites to be modified so that when the user inputs their credit card information
    to make a purchase, a copy of their credit card information is also sent to the
    hackers. With this type of page hijacking, the link location shown in the browser
    will still point to the legitimate website and there is very little chance the
    victim will know about the malicious activity.


    The hacker may randomly swap out the legitimate website page for the redirect
    so that the legitimate website doesn''t wonder where all their buyers/visitors
    went all of a sudden. Or the hacker will ensure that only the legitimate website
    is displayed (and not redirected) when the owners or maintainers of the website
    connect to it. Some hackers keep a big list of the IP addresses of all the major
    cybersecurity vendors and their employees and put them on a rogue “blocklist”
    that ensures that the defenders only see the legitimate, unmodified web page when
    they connect. That way, it takes longer for defenders to diagnose the problem
    when someone finally starts checking.


    # SEO Pharming


    SEO stands for search engine optimization. Browser search engines like Google
    and Bing often index websites according to what'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'words and terms are located on the website (at least as part of their search
    algorithm). For example, a website with the word “dalmatian” on it a bunch of
    times is more likely to have content related to dalmatians. And so, when a user
    types “dalmatian” in a browser’s search field, a website with many instances of
    “dalmatian” is more likely to come up as a recommended link than a website without
    “dalmatian” on it.


    A whole consulting industry known as SEO developed in response, which promises
    website owners that they can seed their website with terms and features that guarantee
    that search engines will send more traffic their way when the user is looking
    for particular terms. Today, website developers must understand SEO and how to
    do it on websites they set up.


    Unfortunately, hackers and phishers use SEO maliciously. Phishers will seed their
    malicious websites with popular search terms. One example is a common operating
    system error. I’m making this specific example up, but let’s suppose I’m working
    in Microsoft Windows when I get a “fatal” error message stating, “Windows could
    not continue around the missing index file.” A user getting this error might type
    it into a search engine trying to discover why it occurred and how to fix it.
    Phishers will create dozens to hundreds of websites with that exact error message
    repeated dozens to thousands of times. Thus, the phisher (or pharmers as they
    may be called) fools legitimate search engines into sending potential victims
    to rogue websites. The potential victims, because they got referred to the website
    by the search engine, put more trust in the website than they should. The website
    will then usually try to trick the user into downloading a (malicious) fix program
    or booby-trapped document file. This is a very popular type of phishing scam,
    and users must be aware not to download programs or documents from such websites.
    Always go to the legitimate vendor’s website when looking for solutions to error
    messages. Chapter 13,'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'will tell you how to do that if you aren’t sure how to tell if the website
    is legitimate or not.


    # # Calendar Phishing


    It is very common for everyone to use online calendars and to send each other
    calendar invites. *Calendar phishing* is when a rogue calendar invite is sent
    to a potential victim in the hopes they will open it or save it to their calendar.
    Usually, the phishing invite arrives in a person’s email with a non-descript subject
    line. The potential victim either thinks it’s a meeting they forgot about or they
    think it is related to some other legitimate new business. We are all very busy,
    and it’s easy to get confused about what meetings we have confirmed and what meetings
    we still have to accept. Figure 2-3 shows an example of a simulated calendar phishing
    invite being created.


    Notice that the normal Zoom meeting link, which would normally say something like
    `https://company.zoom.us/ 99400013310?pwd=Nzd2TmlhWW9Xd2NXSXVkcyMaVp mUT09` has
    an `evil.com` domain in it. With real-life calendar phishing, the fake example
    of `evil.com` would be switched with the phisher''s intended rogue domain. Calendar
    phishing tends to be more successful when the receiver gets it on their mobile
    phone. What the user sees on their mobile device is typically less surface area
    of the total invite as compared to when displayed on a regular computer or the
    user is often busy doing something else, and they accept the invite without fully
    inspecting it.


    Kevin Mitnick, a notorious hacker in the 1980s and early 1990s, and KnowBe4''s
    Chief Hacking Officer for many years before he sadly passed in June 2023, used
    to send calendar phishes to reporters who were going to interview him. The reporter
    would call and talk to Kevin and often inquire how easy it was to'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'fool people with phishing. Kevin would respond, “You know that meeting with
    your boss tomorrow?” They would respond, “Yes,” wondering how Kevin knew they
    had a meeting with their boss. And Kevin would reveal it was just a calendar phish
    that he sent. The reporters would be amazed and always write about phishing risks
    more intently than they had previously intended.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_62_0.png)


    FIGURE 2-3 Example of a simulated calendar phishing invite being created.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Some calendar phishing scams are intended to simply fool the victim into taking
    an unnecessary meeting where the phisher can try to socially engineer the potential
    victim. Others include malicious downloads the victim is told they need to read
    before the meeting, and others include methods that can trick the user into executing
    malicious content. Always check any unexpected calendar invite to make sure it
    is coming from someone you know and trust about a known subject.


    # Social Media Phishing


    Social media services (e.g., Twitter, Facebook, Instagram, LinkedIn, Twitter,
    etc.) are very popular places for phishing attacks. It is very common for a hacker
    to take over a person’s legitimate social media account and then send phishing
    messages to all that person’s friends and contacts. The phishing message may state
    that the victim needs money or knows of a “fantastic,” free money program.


    One of the saddest social media instances I was peripherally involved in was when
    the leader of a squadron of US Korean War soldiers was compromised on Twitter.
    He was well respected and loved by his squadron. The scammer sent “hello” messages
    to his fellow squadron followers. When they responded, the scammer would tell
    them he was “doing great” because he had recently gotten $100K in free money because
    of a new veteran’s program. If the soldiers inquired further, which many did,
    the scammer would direct them to a rogue phone number that harvested their identification
    and banking details. Many of the soldiers lost tens of thousands of dollars. A
    daughter of one of the men contacted me because her father, already out of tens
    of thousands of dollars, could not be convinced that the program was a fraud and
    was still trying to send tens of thousands of'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'dollars more to “seal the deal.” He could not be convinced that his leader’s
    account was under the control of a scammer. She eventually had to take away her
    father''s legal capacity to manage his own money to stop him from losing more
    money (a not uncommon tactic when caring for the elderly involved in a phishing
    scam).


    # Romance Scams


    Another common scam on social media and dating sites is romance scams. With romance
    scams, the scammer pretends to be someone they aren’t and attempts to get the
    victim to fall in love with them to then commit financial fraud. The scammers
    are often very successful and tens of thousands of romance scam victims have lost
    their entire life savings and even committed fraud and crime themselves to send
    money to their online “lovers.”


    Because I''ve written a few articles on romance scams and how to help victims
    over the years, I frequently get emails from loved ones trying to help a victim
    get out of the hold of a romance scammer. Sometimes, the victims themselves write
    me, suspecting that their virtual loved one may not be who they say they are,
    and they ask for my help in how to confirm their suspicion. If you''re writing
    a stranger to confirm your “love connection,” you should probably reevaluate the
