- pgno: 106
  md: '# # Authentication


    +   - All user accounts will be protected by a secure password, a phishing-resistant
    multifactor authentication (MFA), or both.

    +   - Phishing-resistant MFA should be used whenever possible to protect the company’s
    confidential information.

    +   - Passwords must be at least twelve characters long and perfectly randomly
    generated (like you would get from a password manager) or if created by the end
    user, twenty characters or longer.

    +   - The company-approved password manager should be used to generate, store,
    and use passwords whenever possible (when MFA cannot be used).

    +   - An account should be locked out (disabled) until administrative review any
    time it has been entered in incorrectly more than five times in under five minutes.

    +   - Passwords must be changed at least once a year.

    +   - Passwords should not be shared between unrelated sites and services.

    +   - Passwords should never be given to another person.

    +   - Company employees, including company IT employees, management, or the Help
    Desk, should never request another person’s password.

    +   - Passwords should never be provided in response to an email, a voice call,
    or a text message.

    +   - Service accounts should follow the same password rules as stated above.

    +   - Local administrator passwords should be unique for each computer.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   - Users should be educated about the popular types of attacks against passwords
    and MFA solutions, how to recognize them, how to report them, and how to mitigate
    those attacks.


    # Access Control


    +   - Accounts will be granted access only to the resources, groups, rights, and
    privileges they need to perform their tasks and roles that are an official requirement
    of their job (i.e., least privilege).


    +   - Users performing administrative roles will be given both administrative
    and non-administrative accounts. Administrative tasks will only be performed while
    the admin user is logged into an administrative account on an approved administrative
    workstation. All general-purpose tasks (e.g., email, Internet browsing, file downloads,
    research, etc.) will only be done from non-administrative accounts.


    +   - There will be no shared accounts.


    +   - User access to protected resources will be inventoried at least once every
    three months, documented, and access approved by their team leader. If access
    is not approved, the user''s access to the protected resources will be blocked.


    # Backups and Recovery


    +   - All critical data and systems must be backed up on at least a daily basis.


    +   - The company will keep at least two backups from two sequential days. One
    backup will be stored offline, requiring a physical action to access.


    +   - All backups should be encrypted.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '+   - Access to backups and restoration processes must be protected by phishing-resistant
    MFA.

    +   - Restoration of multiple complete backups should be tested every six months
    and shown to be able to be completed in an acceptable period of time.


    # Patch Management


    +   - Automate patching should be enabled on all systems and software where possible.

    +   - Patching includes software and firmware.

    +   - Scanning for missing patches should be performed at least weekly.

    +   - All critical patches should be applied within two weeks of release and sooner
    if possible.

    +   - All vulnerabilities listed on the CISA Known Exploited Vulnerability Catalog
    (www.cisa.gov/known-exploited-vulnerabilities-catalog) should be patched within
    one week.


    # Vulnerability Scanning


    +   - Vulnerability scanning should be done weekly.

    +   - Critical vulnerabilities should be resolved within two weeks.

    +   - Vulnerabilities on the CISA Known Exploited Vulnerability Catalog (www.cisa.gov/known-exploited-vulnerabilities-catalog)
    must be resolved in one week. If the vulnerability cannot be resolved within one
    week, the involved asset must be removed from the network, unless senior management
    makes an exception and accepts the risk.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Internal Controls/Auditing


    +   * All security policies should be enforced using appropriate, documented,
    and communicated controls.

    +   * Controls should be audited every six months.

    +   * Controls should be risk-ranked for the threats they mitigate.

    +   * Missing or weak critical controls must be resolved within two weeks.


    # Event Log Management


    +   * Security logs must be enabled on each system and application (where applicable).

    +   * System time and date of all systems with security logs should be accurate
    and reported in UTC time.

    +   * Critical security events from log files must be copied to a centralized
    event log collection system and reviewed for critical events. Critical security
    events should automatically generate alerts to the appropriate incident response
    team members.

    +   * Security logs should never be proactively erased by users or administrators,
    but logs are allowed to overwrite older events (on a first-in, first-out basis)
    as needed for operational concerns.


    # Endpoint Protection


    +   * All endpoints should have up-to-date anti-malware installed and running.

    +   * All endpoints capable of receiving communications (e.g., email, text messaging,
    Slack, etc.) should have anti-phishing and anti-spam content filtering installed.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '+   - All endpoints should have host-based firewalls enabled with appropriate
    industry-recommended rules when available.

    +   - All endpoints should have intrusion detection software enabled.

    +   - All endpoints should have authentication logon screens and access control
    enabled.

    +   - All endpoints with user logon capabilities should have a locked screensaver
    for inactivity longer than three minutes.


    # Firewall/Network Isolation


    +   - The network should have one or more firewalls enabled using industry-recommended
    rules.

    +   - Firewalls should never have ANY-ANY rules enabled, except when needed briefly
    for troubleshooting purposes. Anytime an ANY-ANY rule is enabled, it must be approved
    by IT management before being implemented and proactively deleted immediately
    after the test is completed.

    +   - VPNs are required to connect to the network remotely. VPN should be protected
    by a phishing-resistant MFA.


    # Secure Coding (SDL Stuff and Signed Scripts)


    +   - All company programmers and contractors must be trained in secure development
    lifecycle (SDL) techniques.

    +   - All programmers must use type-safe languages and tools.

    +   - All programmers must develop on approved, programming-specific workstations.

    +   - Programmers are not allowed to use code found on non-company websites unless
    that code has been security-reviewed.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   - Programmers should never leave authentication logons or password information
    in code when uploading it to code repositories.

    +   - Programmers should never use production logons or customer data with programs
    run on non-production systems.

    +   - All programs must be security reviewed, including code reviews, static reviews,
    dynamic reviews, and penetration tested before deployment in production environments.

    +   - All scripts must be approved and digitally signed before running. Only signed
    and approved scripts should be able to run on company devices and networks.


    # Miscellaneous


    +   - Users and contractors noticing potential system vulnerabilities or maliciousness
    (e.g., intrusion, malware, hacking tool, etc.) must report it to IT/IT Security.


    These best practice recommendations are just scratching the surface of all the
    necessary security requirements needed to have a secure environment but can be
    useful in generating more ideas for additional production requirements.


    # Summary


    Chapter 4 discussed the acceptable use policy and general cybersecurity policies,
    along with examples of security best practice recommendations. Acceptable use
    policies define what is and isn''t allowed on an organization''s cyber assets.
    General cybersecurity policies define specific requirements that all users must
    follow when using an organization''s IT assets to help mitigate cybersecurity
    threats.


    Chapter 5, “Anti-Phishing Policies,” covers all the policies you should have to
    fight social engineering and phishing.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# CHAPTER 5


    # Anti-Phishing Policies


    Chapter 5 covers many of the policies you need to share with co-workers, family
    members, and friends, to fight social engineering and phishing.


    # The Importance of Anti-Phishing Policies


    A big part of mitigating the threat of malicious social engineering and phishing
    is education. In an organization, that education begins with enacting, documenting,
    and communicating policies that fight social engineering and phishing. This chapter
    will cover many of those policies. All employees should review anti-phishing policies
    and sign an acknowledgment of having done so when hired and annually thereafter.


    It is clear that all organizations need a specific anti-phishing policy. It can
    even be easily argued that not having specific'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'anti-phishing policies leads to a greater risk of successful compromise. As
    discussed in Chapter 1, “Introduction to Social Engineering and Phishing,” social
    engineering and phishing are likely involved in 70% to 90% of successful hacking
    attacks. It is, therefore, a little strange that most organizations do not have
    specific policies against the number one most popular type of hacking.


    Imagine if your house was being frequently robbed, and almost always by thieves
    coming through the windows. The thieves could break into the house using any number
    of other avenues (e.g., doors, garage, walls, floor, roof, chimney, attic, basement,
    etc.), but you have noticed that for over three decades they prefer to break in
    almost all the time through the windows. And in our imaginary world, this is true
    of nearly every house in that world. And yet, despite this fact, not only do homeowners
    not focus on better securing their windows, but law enforcement and most home
    security guides fail to mention it. This allegory would describe the state of
    most organizations’ cybersecurity policies. Rarely does an organization have policies
    tremendously focusing on fighting social engineering and phishing. But with the
    help of this book, we’re going to change that for you and your organization.


    # What to Include


    The rest of this chapter will cover what to include, at a bare minimum, in your
    anti-phishing policy document.


    # Introduction


    Any anti-phishing policy document should include an introduction and overview
    of the problems of social engineering and phishing. An introduction should define
    the overall problem,'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'communicate how big of a problem it is (i.e., it represents 70% to 90% of all
    successful cyberattacks), and what the possible damage from a successful attack
    can be. Readers must understand that a single failure to detect a social engineering
    or phishing attack can lead to devastating consequences, including devastating
    operational interruption and a reduction in customer goodwill and faith in the
    organization. Readers need to understand the importance of preventing successful
    hacking attacks. A good introduction might begin with a friendly letter from the
    CEO indicating their support and the entire organization’s support for the anti-phishing
    policy.


    # Definitions


    Make sure you define social engineering, phishing, ransomware, spear phishing,
    SMS, smishing, vishing, and patching. If you use an instant messaging app like
    Slack, Microsoft Teams, or Jabber, define those. Never assume that readers understand
    any technical terms. As an example, I frequently mention how important it is for
    users to patch their software and firmware in the presentations I do. In about
    one out of four in-person presentations I do, someone will come up to me after
    the presentation and quietly ask what I meant by “patching.” You can see they
    are aware it’s something they should know and don’t. They are embarrassed.


    The first time someone asked me what patching was (it was a senior member of the
    FBI), I chuckled and laughed because I thought it was a joke. Then I realized
    it wasn’t. Since then, I’ve had people of all ages and positions ask me what I
    meant by patching or updating. Sometimes you don’t realize that not everyone knows
    the very simple terms you know because you are in or exposed to the IT industry.


    By the way, if you haven’t tried to explain what patching is to someone not in
    the IT industry, it can be difficult to define it'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'to a non-IT person if you don''t think about it ahead of time. What I''ve come
    up with to say in response is this, “It’s similar to someone fixing a typo in
    something they wrote. It’s like they already published their document online,
    find out they have a typo, and then update the document so the typo is no longer
    there. If your computer is asking you to look for or apply updates, and you’re
    sure it’s the legitimate program or operating system asking, make sure you allow
    it to look for and apply updates. But in general, don’t apply updates if you’re
    in your browser surfing the web and your browser asks you to apply updates. It
    could be a social engineering or phishing attack. If that happens, quit your browser
    and restart your computer. If it was a valid patching request, it should patch
    when you restart your computer or ask you again before you are in the browser.”
    I’m not sure if this is the best explanation for patching, but it’s what I tell
    them. When in doubt about a technical term, define it for your audience.


    KnowBe4 has a large glossary you can use for definitions: www .knowbe4 .com/knowbe4-glossary.


    # Training


    It is very important to tell your audience how you will be training them to help
    mitigate the threat of social engineering and phishing. For most organizations,
    I recommend at least monthly security awareness training and simulated phishing
    campaigns. Explain the normal cadence of training and how it is done. Is it done
    by email only? Do you send only videos? Are there quizzes? Are there games? How
    often are they done? Is simulated phishing done? If so, how often? You don’t want
    to let users know the exact dates of the simulated phishing exercises, but you
    do want to communicate that you do them and the frequency with which you do them
    (e.g., weekly, monthly, etc.). If you have internal people who do training or
    help with your internal security'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'awareness training program, communicate that too. If you use an external security
    awareness training vendor, communicate that, including their name and how the
    vendor communicates with them.


    It’s important that you clearly define how the training is done, with what frequency,
    and if any external vendors are involved, and if so, how they will communicate
    with them. This can help, especially if a phishing email attempts to phish the
    user by posing as the user’s external security awareness company. Figure 5-1 shows
    an example of a real-world phishing attempt by a phisher posing as KnowBe4 to
    a KnowBe4 customer.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_116_0.png)


    FIGURE 5-1 A real-world phishing email posing as being from KnowBe4.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Figure 5-1 was taken from: https://blog.knowbe4 .com/theyre-back-bad-guys-spoof-knowbe4-again.
    This phishing email was sent to a KnowBe4 customer, which is pretending to be
    a training reminder notice, but which includes a fraudulent link. Our system can
    be configured to remind users of training deadlines, so this is a well-crafted
    phishing email. We were especially impressed that the fraudulent link was a doppelganger
    of knowbe4.com but was knowbe4.com, which would make the domain it pointed to
    .com, not knowbe4.com. Very tricky! But hovering over the link revealed that it
    really pointed to a URL in Russia (turboilder.ru). We don’t have any offices or
    customers in Russia.


    Fake emails to KnowBe4 customers pretending to be from KnowBe4 are not rare. Most
    of our customers don’t get them, but enough do that it is something that all anti-phishing
    policies should warn about. Customers using external security awareness training
    programs might want to include examples of what legitimate-looking emails involving
    those services would look like and warn against possible malicious social engineering.


    # Recognizing Common Signs of Social Engineering


    You absolutely need to educate everyone about the common signs of social engineering
    and phishing. I would start with the basic logic presented in Figure 5-2 (which
    you might recall from Chapter 1).


    Again, creating a strong culture of following this logic is crucial to having
    a successful security awareness program. Drill, drill, drill this into your own
    mind and the minds of your friends, family, and co-workers until it becomes almost
    impossible to forget. Not every phishing attempt begins this way, but 99% of them
    (I’m making this figure up because there’s no real data on this, but the real
    figure would be close) do. It’s important to stress that social engineering and
    phishing attempts can begin in a'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'bunch of different ways, including in-person, email, websites, text, instant
    messaging, and social media.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_118_0.png)


    FIGURE 5-2 The basic logic for spotting phishing and social engineering.


    # Signs of Social Engineering and Phishing


    There are dozens of other common signs of social engineering and phishing. They
    include the following:


    +   • Strange sender From email addresses

    +   • Sender''s From email address name doesn''t match the email address (e.g.,
    Patty O''Brien, roberttaylor2384@gmail.com)

    +   • Strange, unexpected requests

    +   • Strange, unexpected subjects'
  merge: -1
  img_proc: true
- pgno: 119
  md: '+   - Messages with a heightened sense of urgency (i.e., stressor statements)

    +   - Strange, unexpected file attachments

    +   - File attachment mismatch (e.g., file claims to be a PDF, but it is really
    a .html document)

    +   - Email message from someone you know, but from a new email address you’ve
    never seen before

    +   - When the subject line of an email doesn’t agree with the text of an email

    +   - When the sender’s From email address does not match the Reply To email address

    +   - Message includes a strange URL or a URL that is not the legitimate URL of
    the brand or organization involved

    +   - Messages sent at strange, late times of night

    +   - Many typos and language issues in the text of the message

    +   - The phone number shown on caller ID or given to you does not show up as
    belonging to the brand or organization it claims to belong to

    +   - Claim or offer seems too good to be true

    +   - Short-links in SMS messages

    +   - Short code or telephone number related to an SMS message is not registered
    to the brand or organization claimed in the message

    +   - Emails where the sender claims they are now going to be out-of-contact for
    the next few hours to days (e.g., traveling, in senior-level business meetings,
    etc.), so you cannot contact them for questions or clarification

    +   - Requests to move off initial communication service to another less monitored
    service (for example, you are contacted on LinkedIn or Craigslist, but they want
    to move to WhatsApp)'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   - Romantic partners asking for money

    +   - Someone asking for a late bill or invoice to be paid that the receiver was
    not previously aware of

    +   - Message to a video or content that then requires that you install a new
    software program or update

    +   - Message to content that then claims you need to approve a notification prompt
    to see the content

    +   - Sender or poster wants you to buy gift cards, provide payroll information,
    or change payment instructions

    +   - Buyers or sellers trying to move you off the initial selling platform to
    a more private, less monitored method

    +   - Buyers or sellers offering to pay full price plus shipping but forcing you
    to use their escrow company or shipper

    +   - Buyer sending you a check for more than the arranged-for selling price and
    tells you to cash it anyway

    +   - Seller of local deals (e.g., vacation rental, selling house, boat, motorcycle,
    etc.) that cannot meet you in person. Often claims to be a person in the military
    on deployment. Often claims to be selling items for a dead spouse, family member,
    or friend

    +   - Seller wants you to use a “personal mode” of online electronic payment service
    (e.g., PayPal Personal, Venmo Personal, etc.) that does not offer protected refunds
    in case of fraud

    +   - Seller is offering the item for tremendously below-market value

    +   - Emails claiming to be “Virus Free”


    Any of these signs can be found in legitimate requests and emails but are often
    found in social engineering and phishing'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'messages. The more examples you can provide of suspected social engineering
    and phishing behavior, the better.


    Many of the policy recommendations here will be repeated in later chapters. This
    is to establish that policy documents are part of the training and it’s OK to
    repeat training content in both places.


    **Personal Stories** Including real phishing examples that have been attempted
    against the organization is even better. It brings home the message and makes
    it more relevant. When I worked at Microsoft, one year’s annual required security
    awareness training included a pre-recorded video from one of Microsoft’s smartest
    guys. No one knows everything, and there are a lot of smart people at Microsoft.
    But this guy is recognized by most people in the tech industry as being not only
    one of the smartest guys at Microsoft but one of the smartest guys in the industry.
    He’s very well known and I don’t include his name only because I don’t have permission
    to do so.


    But he was successfully phished and shared his story. He had recently been in
    the news for a groundbreaking story that he brought to the world. For weeks he
    was being interviewed and written about. Towards the end of the media excitement,
    while watching the Super Bowl, he received an email from supposedly a co-worker’s
    personal email account, sending him a document that the sender claimed was relevant
    to the recent news. Without thinking, he opened the document and found, strangely,
    that it didn’t contain any information relevant to the project he was working
    on. He just thought it was strange and deleted the email. Hours later, he was
    bugged about why his co-worker would have sent such a strange message with a document
    that wasn’t about his project. He then started to wonder if he had been phished.
    This thought bothered him for another few hours. So, now, only'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'after many hours had passed did this employee finally report the possible phishing
    attempt to IT security.


    When IT security checked the email, it was confirmed to be a real-world phishing
    attempt and the opened document had indeed launched a successful exploit that
    compromised the victim’s laptop. Luckily, the phishing was reported and investigated
    quickly enough that the attackers had not yet used their successful exploit to
    move on and do anything more. Just pure luck. The Microsoft employee shared that
    he was even embarrassed for being successfully phished, and those sorts of thoughts
    crept up in his mind when he was thinking about reporting it. He had thought,
    “How is it going to look for one of the supposedly smartest guys in Microsoft
    to be successfully phished?” Vanity plays a bigger role in what we think and do
    than most people are willing to admit.


    This in-house video was a huge success! It showed that anyone in Microsoft, even
    one of the smartest guys, could be phished and not be sure they were phished.
    It showed that if you have doubts about whether something is a phish, even hours
    later, report it. To this day, I think this video was one of the most successful
    security awareness campaigns ever to be shown, not by just Microsoft, but anyone.
    Whoever in Microsoft thought of it and the person involved who put aside their
    own possible embarrassment are to be doubly applauded.


    I often recommend that if organizations have a similar story (i.e., of a successful
    phishing compromise) happening to their organization, they should share it with
    other employees. It shows that anyone can be phished and how important it is to
    report even suspected phishing to IT security.


    # Red Flags of Social Engineering Poster


    KnowBe4 has long offered a one-page “Social Engineering Red Flags” PDF poster
    (www.knowbe4.com/hubfs/Social-Engineering-'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Red-Flags .pdf) that anyone can download, print, and re-share. As shown in
    Figure 5-3, it includes twenty-two signs and symptoms that an email may be a malicious
    social engineering attempt. It’s a great piece of content to share with co-workers,
