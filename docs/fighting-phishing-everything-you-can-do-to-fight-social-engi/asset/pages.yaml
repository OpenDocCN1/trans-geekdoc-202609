    # Full-Screen Mode


    Another common technique malicious hackers and phishers use on malicious websites
    is forcing the user’s browser into “full-screen mode,” which converts the normal
    browser window with a frame and heading into a full-screen presentation without
    a frame or heading. This is usually done in conjunction with a hyper-aggressive
    warning of a (fraudulent) malware infection or a fraudulent warning supposedly
    from the FBI or law enforcement, known as scareware. Figure 9-2 shows an example
    of a full-screen scareware warning.


    Sometimes the involved website includes code that can make the cursor disappear
    or the keyboard become non-responsive, giving the full-screen display the appearance
