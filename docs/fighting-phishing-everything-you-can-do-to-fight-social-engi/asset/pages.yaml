- pgno: 337
  md: 'The DNS domain is where inputting or clicking on the URL is going to take you.
    If it points to a legitimate domain, then you can likely (most of the time) trust
    the URL. If it points to a domain name you don''t immediately recognize, you must
    use caution. For example, if you get an email that you think might be a phishing
    email, but you are not sure, check out the DNS domain name on the included URL.
    If it says microsoft.com, facebook.com, instagram.com, paypal.com, knowbe4.com,
    or some other legitimate DNS domain that is the normal legitimate domain name
    for the brand the email says it''s from, then more than likely you can trust the
    email. If the DNS domain is strange-looking or unusual (e.g., microwsoft.com,
    facebook.biz, know.be.4.com, etc.), then there is a greater chance than not that
    the email is rogue.


    One of the best skills any computer user can have is to determine if the indicated
    DNS domain name is legitimate or not. It isn''t always easy, especially with all
    the parent and child domains and different parts of a URL. See Figure 13-8.


    ![](img/49fb1c0c9ac2e62e5db4a36fa9f8b591_337_0.png)


    FIGURE 13-8 Examples of completely different domains that look similar.


    Suppose I told you that example.com was the only legitimate domain. When looking
    at the three different URLs in Figure 13-8, can you pick out which of the three
    URLs contains the legitimate domain, example.com? It can be confusing.


    The legitimate domain, example.com is in the second, middle, example. Remember,
    the DNS domain always ends with'
