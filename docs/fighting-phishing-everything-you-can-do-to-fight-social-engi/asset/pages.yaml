  md: '# Acme Champion Program


    Acme uses a “champion program” to assist with SAT education. Acme’s champion program
    is named “Acme We Are Aware.” Champions are recommended by their managers or can
    volunteer themselves. Duties include promoting the general cybersecurity defense
    initiatives of Acme, taking required and additional training proactively, scoring
    85% or better on SAT quizzes, and sharing what they know and learn with their
    business unit’s participants. Acme’s We Are Aware program is sponsored by IT Security
    and has monthly meetings. Participants will get t-shirts and other “swag” for
    themselves and to share. Participants will be formally recognized as having participated
    to better Acme, and it is a net positive trait to be placed on their annual evaluation
    for each year successfully completed and for staying a member in good standing.
    Champions may occasionally be given prizes (including possibly gift cards, tickets,
    or small bonuses) to thank them for their participation; although participants
    are invited to be a member simply for the joy of sharing information with their
    co-workers. Champions can be dismissed without cause by the sole discretion of
    the program’s leader. Dismissal from the program or quitting the program will
    not count negatively against the participant at any time.


