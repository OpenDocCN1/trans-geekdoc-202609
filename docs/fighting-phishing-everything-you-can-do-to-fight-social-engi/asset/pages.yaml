  img_proc: true
- pgno: 314
  md: 'appropriately reporting them to help others. We talked about understanding
    the media types that are appropriate for the various work environments and differentiating,
    but what is more important is differentiating for skill levels and current attitudes
    and behavior. This doesn’t mean that everyone should have a unique training plan
    and content like the executives might, but you can use formal assessments and
    phishing data to help group them into multiple groups (2 to 4) that best advance
    them on their phishing knowledge journey while not boring some of them or overwhelming
    others.


    Sure, some content during the year will be relevant for everyone, but often we
    want to challenge our most advanced phishing students. They are the ones with
    modern tools that are likely to alert us first, while also raising the level of
    the group that is most likely to fall for a phishing scam. Don’t forget those
    folks in the middle group either. They need reminders and reinforcement to keep
    them on the right track. You will need to mix the types of content for them and
    keep them engaged.


    # Accessibility


    Another important consideration is accessibility. Accessibility in eLearning refers
    to the design and delivery of online educational content and resources in a way
    that ensures all individuals, regardless of their abilities or disabilities, can
    access and effectively engage with the material. It involves creating an inclusive
    learning environment that accommodates a wide range of learners—examples include
    screen reader use by users with vision impairment, captions for users with hearing
    impairment, proper color contrast, and the ability to speed up, replay, or slow
    down the presentation just to name a few.


    There are considerations for compliance with laws and regulations, such as in
    the United States with the Americans with'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'Disabilities Act (ADA), that make this a legal requirement for the training
    you are going to push out to learners with these disabilities. Accommodate them
    as part of your training so users with disabilities get as close to equal experience
    as possible. One company I spoke with worked with the biggest security awareness
    content provider for all their security awareness training content. This company
    had a few thousand users and had been doing training for a couple of years. They
    decided to go to an outside development team for a custom module that addressed
    their specific company systems as part of their ongoing training. They did not
    communicate the need for the content to be accessible and when they put it out,
    they got a larger number of complaints than they would have ever thought from
    users of assistive technologies. At a conference presentation, the director of
    information security expressed this was his biggest takeaway from creating this
    training, “Make sure your content is accessible and get it tested.”


    # Assessment


    Your anti-phishing program should be frequently reassessed. Is it meeting the
    objectives? Is it effectively reducing cybersecurity risk? Some organizations
    get caught in the rut of treating security awareness training as a compliance-fulfilling,
    “checkbox”-training exercise, and this can be very detrimental to the overall
    program. Or, unfortunately, many organizations are giving employees the same training
    module year after year (or with only minor changes) and, not surprisingly, don’t
    see a continued reduction in successful phishing. Most compliance officers and
    human resources leaders know that checkbox-training will not efficiently change
    behavior at all and have in many ways resigned themselves to that fact.'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'With anti-phishing training, there are measurable statistics that we can look
    at: click/fail percentages of simulated phishing tests, percentages of employees
    reporting phishing simulations, as well as real-world phishing rates that are
    being received in the wild. Attaching the security awareness training program
    to these metrics with the express aim of driving reported (real-world and simulated)
    phishing rates up and clicking failure rates down should be one of the main goals
    of any security awareness training program.


    One organization I spoke with recently had done what I like to call the “big bang”
    approach because they had recently had a pretty big real-world phishing incident,
    so they had buy-in from the leadership. They rolled out a bunch of training, started
    monthly phishing simulations, and even had a message they recorded from the CEO
    expressing how important the security awareness training was going out to all
    employees.


    They reached out to me afterward and said although they had gotten good results
    in the first few months, these results tapered off pretty quickly and now they
    have a rising click failure rate and disengaged reporting. What they learned from
    this experience is that it’s hard to change behavior, and people have a lot more
    going on in their professional and personal lives, so we only get a small slice
    of it to teach them about phishing. We cannot treat phishing like it is the problem
    of the quarter that we have to handle and be done with. It is a persistent and
    constantly evolving threat to organizations, so it requires a persistent and evolving
    training program to address it.


    How do you measure training success? Well, there are the obvious things, like
    knowledge assessments, surveys, and simulated phishing test improvements. But
    the leading indicators of learner engagement are surveys done right after a training
    event. With KnowBe4’s eLearning training content, all learners are asked to rate
    the content, on a scale from 1 (least effective) to 5'
  merge: -1
  img_proc: true
- pgno: 317
  md: '(most effective), immediately after the training has concluded.

    There is always an open comment box so the learner can type in

    their feedback.


    There is a big difference between training content with an

    overall rating of 4.2 versus 4.6. You might initially think that

    because both are 4 out of 5 stars, they might roughly be in the

    same neighborhood of quality. But if you look at the comment

    data and do a detailed analysis, which by the way you should do

    every time, you will see a marked difference. A good training

    program usually will get 4.5 stars or higher. Programs on the

    lower side of 4 aren''t so great and need improvement. Here are

    real-world examples of training survey results across thousands

