  md: '# Security Awareness Training Program Summary


    This part of the policy summarizes Acme''s SAT program, which involves training,
    testing, and simulated phishing campaigns.


    All newly hired employees and others with access to Acme''s networks or data will
    be required to take a 30 to 45-minute SAT training education in the form of a
    pre-recorded video or training by in-person trainers. This SAT training is required
    when first hired or contacted and then at least annually thereafter, but Acme
    reserves the right to make any individual requiring additional training take it
    more frequently.


    All participants will be required to demonstrate their successful understanding
    of the material by taking a quiz on the information. A passing rate of 70% is
    required. Participants failing the quiz will be required to watch the material
    again, review new material, or receive training until they get the required passing
    rate. Participants who do not pass cannot have access to Acme networks, systems,
    or data.


    At least once a month, participants will be given access to required, additional,
    shorter (one to five minutes each) SAT content. All required training will be
    sent to each individual using email. Those without ready access to email should
    be instructed to check the company''s IT Security bulletin board (https://acme.it/bb)
    for information and updates. Quizzes may or may not be required with the additional
    content.


    All training is required, unless specifically marked as optional and must be completed
    within two weeks of assignment, unless on a pre-approved time-off event or emergency.
    If a participant is out on pre-approved leave or due to an emergency, they must
    take it within two weeks of coming back to work.


    All training and education are managed by Acme''s security awareness team, which
    is part of the Information Security business unit and is sponsored by the CISO
    and CIO. Results of the'
