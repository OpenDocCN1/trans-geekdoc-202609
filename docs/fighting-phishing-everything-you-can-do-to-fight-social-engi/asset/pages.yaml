    # Summary


    Chapter 1 introduced social engineering and phishing and explained why it is so
    important to mitigate them. They are the number one most popular type of cyberattack,
    involved in 70% to 90% of all successful hacker and malware attacks. No other
    cyberattack method comes close. All other cyberattack methods (e.g., unpatched
    software, eavesdropping, etc.) added up together do not equate to the risk from
    social engineering and phishing. Chapter 2 is going to build on this chapter''s
    foundation by discussing related terminology and showing many examples.'
