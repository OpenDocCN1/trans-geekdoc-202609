  img_proc: true
- pgno: 296
  md: 'shown once or a few times and retired. Nope, they are shown over and over and
    over again. They may even be shown twice, back-to-back. They may be shown so much
    that even original lovers of the commercial may end up hating it. If you wonder
    why commercials are shown over and over, it''s because it works. Decades of marketing
    have shown that repeatedly showing a commercial over and over is more likely to
    get more paying customers.


    The same thing happens with SAT programs. The more often you show a particular
    training, the more likely the viewer is to remember the lesson. However, I don''t
    recommend that you show the exact same content over and over. Instead, show similar
    types of content over and over. For example, if you want to help your co-workers
    not to be susceptible to BEC scams, show multiple BEC scam videos, have newsletters
    that include anti-BEC scam content, and hang anti-BEC scam posters in common areas.
    The more often you show content, the more likely viewers are to remember it.


    There is a marketing paradigm that says that potential customers must be made
    aware of a product''s name a dozen to over two dozen times before the customer
    is even “aware” of the product. Prior to that, the potential customer may not
    actually hear or view the product name or they may see it, but not remember it.
    Successful marketing campaigns show a product name over and over so that potential
    customers begin to remember and think about it.


    Most marketing commercials are also entertaining. They don’t just give the bland
    facts and hope the potential customer remembers them. Instead, today’s marketing
