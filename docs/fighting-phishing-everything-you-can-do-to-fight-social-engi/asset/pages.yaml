  md: 'phishers often use these encoding methods to make phishing messages harder
    to investigate.


    # IP Address Encoding


    The easiest encoding method is for the phisher to simply use the site''s IP address
    instead of the URL. For example, whenever you type or click on www.google.com
    it is converted by DNS to http://172.217.2.196. Phishers can just use the IP address
    version, http://172.217.2.196. When a user clicks on it, they are taken to the
    web server attached to the IP address.


    IP addresses can be used in a phishing trick where the IP addressisused.Let''stakeforexample,https://192.168.1.100,
    followed by a resource path statement that contains brand names: https://192.168.1.100/microsoft.com/logon.
    Many viewers of that URL might think it points to microsoft.com, but it doesn''t.


    # URL Percent Encoding


    English letters, numbers, characters, and control characters can be represented
    by encoding their American Standard Code for Information Interchange (ASCII) hexadecimal
    representations. Figure 13-20 shows a partial printout of ASCII characters and
    their hexadecimal representations.


    ASCII characters can be used in a URL by placing a % after the ASCII hexadecimal
    code. For example, a lowercase w can be represented by using 77%. You can see
    77 is the hexadecimal code for the lowercase w. Entire URLs (except for protocol
    monikers, slashes, and periods) can be represented like this. For example, https://%77%77%77.%6B%6E%6F%77%62%65%64.%63%6F%6D
    will be translated to www.knowbe4.com.


    Phishers can encode the entire URL with percent encoding or mix up regular letters
    and percent encoding to give them the best-looking URL possible. For example,
    perhaps they could do something like https://%77%77%77.%62%61%62%75%72%'
