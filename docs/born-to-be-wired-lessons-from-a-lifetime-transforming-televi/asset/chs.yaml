  \ 2023 年被拆分独立上市，但 Terry 和我仍聚在一起看比赛，分享我们最喜欢的故事。（由 John Malone 提供）\n\n# 跨越有线电视：TCI\
  \ 和 Liberty Media 的卓越崛起\n\n起初是 1973 年的一家小型区域有线运营商，演变成了现代史上最引注目的投资故事之一。在 John Malone\
  \ 的领导下，`Tele-Communications Inc. (TCI)` 通过战略收购不断增长，成为美国最大的有线电视。当 1999 年 `AT&T` 以\
  \ 480 亿美元收购 `TCI` 时，`TCI` 的转型进入了媒体、体育和娱乐领域。通过一系列分拆和重组，`Liberty Media` 创造的价值远超其同行。到\
  \ 2024 年，`Liberty Media` 的市值增长了 50 倍。\n\n\n\n\n\n约翰·马洛恩（JOHN MALONE）是自由媒体（Liberty\
  \ Media）、自由宽带（Liberty Broadband）和自由全球（Liberty Global）的主席。1973 年至 1999 年，他担任美国最大的电缆运营商电信公司（Tele-Communications\
  \ Inc.）的首席执行官，直到该公司与 AT&T 公司的合并完成。他是一位电视、互联网和数字领域的先驱，因在媒体和电信领域的领导作用而广受认可。作为医学和教育领域的慈善家，他现在美国最大的土地主之一，其中大部分土地已用于保护。马洛恩还是一位热情的牧场主、土地经理、环保主义者、酒店经营人和马商。约翰·马洛恩曾是耶鲁大学的优等生，在那里获得了电气工程和经济学学士学位。随后，他在约翰霍普金斯大学获得了工业管理硕士学位和运筹学博士。\n\
