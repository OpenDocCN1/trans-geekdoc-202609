  \n# 参考文献\n\n本书基于对一手资料广泛的研究，包括新闻报道、公司记录、口述历史、诉讼案件、政府研究和第一手叙述。我们已尽力核实事实并准确呈现，尽可能依赖信誉良好的来源并进行交叉比对信息。\n\
  \n这个故事也基于记忆，这种记忆本质上是选择性的，并在多年来受到观点和个人经验的影响。但这里描述的事件都是真实发生过的，在存在不同说法的情况下，我核对了了来源并权衡了背景，以尽可能接近真相。\n\
  \n联邦通信委员会（FCC）的大量记录无价之宝，而司法部等部门提起的诉讼每当我重新阅读它们时同样让我苦恼。\n\n在我所有的研究中，口述历史最好地捕捉到了电缆业务早期那种坚韧、拼搏和原始的创新。\n\
