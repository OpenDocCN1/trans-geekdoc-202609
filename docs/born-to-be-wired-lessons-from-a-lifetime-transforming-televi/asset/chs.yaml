- "# 天生互联：从转型电视、构建美国互联网，到发展一级赛、Discovery、Sirius XM 和亚特兰大勇士的职业教训\n\n\n\n\n\n\n\n\n\n\
  \n献给我挚爱的 Leslie\n\n# 第一章 开牌公道\n\n我在几十个不同的银行董事会议室做过上百次这件事，每一次场景都是如一样的：一个宽敞的木护板房间，摆放着一张擦得发亮的长红木长桌。周围坐着十几个穿着挺括白衬衫系着领带的老人，他们皱着眉，偶尔从面前文件上的财务数据中抬头。\n\
  \n但在 1975 年的那个下午，是银行要求会面，而不是我们。而且这里远不是装修精致的会议室，而是我们位于落洛基山脉长影中的一座棕色、单层办公楼里。我知道这次会议将与不同。\n\
  \n过去的几年对我们双方来说都是纯粹的地狱。鲍·马格斯（Bob Magness）是丹佛郊外一家陷入困境的电缆公司 `Tele-Communications Inc.`\
  \ 的主席，两年前请我担任新的 `CEO`。\n\n`TCI` 曾是快速发展的电缆电视业务中一颗亮眼的新星。我们正在全国范围内悬挂同轴电缆，为农村地区提供来自\
  \ `CBS`、`NBC` 和 `ABC` 更好的广播信号，并最终提供数百个新电视频道和互联网。\n\n总有一天，这将为美国最大的电缆运营商奠定基础，服务每四户家庭中的之一，并在美国催生一个强大的双向数字通信网络，为\
  \ `Amazon`、`Facebook` 和 `Google` 等平台提供支持，并释放新数字经济中巨大的价值。\n\n那时，鲍和我完全完全不知道这些潜力。那个早晨，我们仅仅希望能够熬过这一天。鲍是一位二战退伍军人，也是兼职农场主和棉籽经纪人，他在\
  \ 1956 年于德克萨斯州孟菲斯，在棉纺厂里与两个陌生人偶然交谈后创立了他的电缆公司。\n\n\n\n\n\n## 危机对峙\n\n银行家们到达后，他们在我们狭窄的会议室里围着桌散开来。在那群人中，唯一一张友善的面孔是我们\
  \ `TCI` 的财务 `Donne Fisher`，他看起来像是一个排在 `DMV`（车辆管理局）长队末尾等待的男人——既恼火又不耐烦，但又努力压抑着情绪。\n\
  \n我开启了会议，开场白中充满了承诺，却极少谈及数字，因为我知道数字救不了我们。然后，`Donne` 和我离开，让他们他们私下商量。\n\n`Bob` 走进我的办公室，询问进展如何。他看起来依然完全是十年前以前那个沉默寡言的棉花销售员，口中带着那种像糖浆一样缓慢的德克萨斯南方口音，几乎总是穿着一件白色西部风格衬衫，系着波洛领带，戴着一顶歪在梳得整齐的白发之上的牛仔帽。\n\
  \n当 `Donne` 和我向他汇报了现场情况时，他只是盯着远方发呆。在 `Bob` 的眼神里，我分不清那天下午我看到的是恐惧还是绝望，也许两者兼有。他表现得是地坚毅，仿佛在目睹一场慢动作状态下的事故。在很多方面，我想，他确实如此。\n\
  \n### 第一个离开者\n\n银行家们决定的第一件事是，他们中必须有一个离开：那是`美国教师保险与年金协会`的代表，该机构与银行有不同的协议；他现在被认为与公司关系太亲密。那个人在震惊和略显受挫中离开了会议，与\
  \ `Bob`、`Donne` 和我汇合在一起。\n\n当我们坐在我办公室的沙发上等待时，时钟真的在滴答作响，`Bob` 终于站起来，对着并不特定的某人说：“我受不了了。我要走了。”然后他开车回家了。\n\
  \n### 最后通牒\n\n在过了如永恒般之后，两个最大的债权人之一——`纽约银行`和`费城国家银行`的代表来到了我的办公室。`Donne` 和我相视一眼，然后看着他们。后来成为`纽约银行`\
  \ `CEO` 的 `Tom Renyi` 公布了判决。\n\n“好了，银行们已经商议过了，我们准备好给予你们请求的延期，”他宣布道。接着是一记致命的防守反击：“然而，我们认为，考虑到信用状况的恶化，银行有权提高利率。”\n\
  \n这个该死的蠢货。当我听到这些话时，我知道结束了。我呼吸一滞，感到皮肤都麻木了。\n\n“Tom，”我轻声说，“我一直担心你会说出这种话。我已经把这间公司的每一个旋钮都拧到了最紧。”然后我的声音开始变大。“我们有的人每周工作六十小时，却拿三十小时的工资。我们正在加班加点只是为了度过这个难关。而这仅仅是一个坎儿——一个坎儿。我们可以过去的。”我的声音听起来像个得到了某个可靠内幕消息的赌徒。\n\
  \n“但如果你们现在这样做，会害死我们的，”我继续道。“这会严重打击每个人的士气。如果你们那样做，我就无法继续经营这家公司了！”\n\n“既然*你*认为*你*能从这家公司里多榨出一点汁来……这是所有的钥匙。”我从裤子前兜里掏出一串办公室钥匙，把它扔在办公室的桌上。“你们来经营吧，告诉我你们过得如何。”\n\
  \n我掏出钥匙是为了增加效果，但事实是我是认真的。我也知道所有的银行都害怕接管客户的业务，因为他们对经营任何业务一无所知；他们只会把它搞砸。他们只知道钱。\n\n\
  此外，在我们与银行的贷款协议中，只有在我们批准的情况下，他们才被允许提高债务的利率。所以我直截了当地告诉他们：\n\n\n\n我掏出钥匙是为了增加效果，但事实是我是认真的。我也知道所有的银行都害怕接管客户的业务，因为他们对经营任何业务一无所知；他们只会把它搞砸。他们只知道钱。\n\
