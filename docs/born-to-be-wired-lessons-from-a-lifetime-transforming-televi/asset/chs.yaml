  \n\n\n当我独自坐在病房里陪着他时，我用闲聊填补了沉默。他感到倍感沮丧，我也满心郁忡，甚至没有意识到这将是我们的最后一次探望。一切发生得太突然了。坐在房间里的还有一份厚达英寸的鲍（Bob）遗嘱草案，那是我们一直在起草的，但他还没有签署这个最新版本。他也不会签。\n\
  \n在经过咨询后，莎伦（Sharon）将鲍送往了位于查洛特维尔的弗吉尼亚州大学医院，那里采用了新型伽玛刀射疗和化疗法来缩小肿瘤。两种方法均未奏效。\n\n在弗吉尼亚州大学医院癌症科部的一间私人病房里，鲍幸运地能够与他的亲友、两个儿子加（Gary）和金（Kim）以及三个孙辈告别。不到一个月后的，在\
  \ 1996 年 11 月 15 日星期五，鲍吐出了最后一口急促的呼吸；癌症夺走了他。莎伦一直陪伴他直到最后。\n\n但任何家庭团结在几个月后就消失殆尽，因为鲍的遗孀和儿子们分别提起诉讼，反抗鲍的遗愿，并要求分得他留下的更多遗产。这场关于金钱的、极其公开且恶毒的斗争，将对鲍和我共同建立的公司构成生存威胁。\n\
  \n在二十多年的时间里，鲍一直是我生活中的常态。他的建议从不宏大，也从不华丽。它们务实、简单，并以一种很少有言语能做到的方式引起共鸣。\n\n他教我如何从噪音中筛选并找到信号。“忘记那些批评者吧，”他会说，“专注于真正重要的事情。”这些如此容易被遗忘的话，却成了一句塑造我人生轨迹的准则。为了纪念这个男人的遗愿，我能做的主要事情就是将他的教诲传承下去，而我做到了。\n\
  \n五天后，在 11 月 20 日，近千名亲友汇聚在丹佛第一拿撒勒卫会公会，向罗伯特·约翰·马格内斯（Robert John Magness）致哀。他是一位忠诚的丈夫、一位勋功卓著的二战英雄、前棉花经纪人、一位真正的牛仔、白手起家的电缆电视大亨和慈善家——他是美国梦的化身。\n\
  \n他的棺材被白玫瑰簇拥，上面覆盖着一面美国星条旗，以彰显他的服役。鲍的牛仔帽和他那把黑色银钉马用鞍展示在他一张与其中一匹阿拉伯马的照片旁。教堂外，丹佛野马队的吉祥物“雷电”（Thunder）徘徊着，而它的主人的身体静静地躺在室内，那里合唱团正带领哀悼者唱着《共和国的战歌》。\n\
  \n家人、朋友以及似乎整个电缆行业的人坐满了长椅，其中包括泰德·特纳（Ted Turner）和他的妻子简·芳达（Jane Fonda）；电视福音传播士帕特·罗伯森（Pat\
  \ Robertson）之子、家庭频道负责人蒂姆·罗伯森（Tim Robertson）；附近琼斯电缆公司（Jones Intercable）的创始人格伦·琼斯（Glenn\
  \ Jones）；以及其他商业伙伴和竞争对手。\n\n“我爱上了鲍，”我在仪式上对聚在一起的哀悼者说，“他是一个品德高尚的人。安静。深邃。稳重。忠诚。在许多方面都很才华。谦逊。我们共同经历了许多经历。我们是合伙人。他是我的导师。在许多方面，他就像我的父亲。”\n\
  \n泰德·特纳和我一同担任抬棺人，他赞扬了鲍我和 1987 年挺身而出拯救了特纳广播公司（Turner Broadcasting），并赞誉了鲍的创业精神、牛仔风范以及对西部土地的热爱。“他是我见过最棒的男人，”特纳说，“我以前常说：‘你们来架电线，我们来让它们唱起来。’”\n\
  \n尽管教堂里气氛凝重，但我脑海中始终在不停地回旋着一个念头：鲍那 3200 万股超级投票股将会发生什么变化？\n\n***\n\n在鲍去世左右，仿佛这打击还不够大，`TCI`的股票由于数字产品延迟和卫星竞争，在华尔街的重击下创了新的\
  \ 52 周新低。\n\n正如我们经常谈论遗产税一样，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。我们经常讨论过遗产税以及如何规避它们，我看到鲍的遗产被如此压榨，感到非常震惊。\n\
