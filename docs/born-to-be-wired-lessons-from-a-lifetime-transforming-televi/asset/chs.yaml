  \ `Rupert` 和 `Charlie` 所发现的那样。这两位大亨无法融相处，无法在控制权上达成共识，这在一个看似微道的问题上达到了高潮。\n\n`Rupert\
  \ Murdoch` 向 `Charlie Ergen` 寄了一封信，坚持要求他们新的新的 Sky` 项目必须使用 `News Corp.` 的安全系统。`Charlie`\
  \ 表示不同意。\n\n在商业中往往是如此，尤其是当涉及到巨大的自尊和大型公司时，我们往往将法庭诉讼作为首选，而实际上如果双方坐下来共同寻求休战，情况本会更好。\n\
  \n1997 年 5 月，`EchoStar` 在联邦法院对 `News Corp.` 提起了价值 50 亿美元的违约诉讼，后者自然也提出了反诉。媒体对这对争斗的媒体大亨简直大快了喉。\n\
  \n`PrimeStar` 也是如此。随着 `Rupert` 与 `EchoStar` 的联盟在法庭上破裂，他仍然需要卫星接入——而我们恰好提供。我们重启了与\
  \ `Rupert` 的会议，希望找到一种方法让 `News Corp.` 加入，并让 `Sky` 业务的卫星停车位进入天空。\n\n`Rupert` 用新型微型卫星天线冲击有线电视的阴影把那些有线电视男们吓得够呛的，而好处是，他们的恐惧帮助我让他们认同让他加入我们的\
  \ `PrimeStar` 的想法。*但* `Time Warner` 仍然拒绝屈协。`Rupert` 在纽约对 `Time Warner` 提起的诉讼以及随之而来的谩骂让\
  \ `Ted Turner` 极其愤怒，他至于发誓永远不会原谅 `Murdoch`。\n\n我们再次有力地争论道，允许 `Rupert` 进入阵营解决的问题将比产生的问题多得多。凭借完整的卫星位、11\
  \ 亿现金以及 `TCI` 的卫星，`PrimeStar` 可以成为一个真正的参与者。\n\n`Rupert` 决心修复他与有线电视行业的关系，他提议放弃对 `Time\
  \ Warner` 的诉讼，并承诺投入 `News Corp.` 和 `MCI` 拥有的卫星位，前提是 `PrimeStar` 要保证传输 `News Corp.`\
  \ 的有电视网络。\n\n这位好斗的澳大利亚人给有线电视运营商的信息非常明确：我不再是你们的敌人。我是你们的朋友。\n\n`Time Warner` 的 `Levin`\
  \ 勉强妥协让 `Rupert` 的服务加入 `PrimeStar`，同时规定 `Murdoch` 的股份必须是非投票的，且 `Time Warner` 想要共享\
  \ `PrimeStar` 的运营控制权。因此在 1997 年 6 月，`PrimeStar`  `Murdoch` 进入合伙关系。我们将其整合为一家上市公司，其中\
  \ `News Corp.` 持有 30% 的非投票股份，70% 由原始有线电视伙伴持有。\n\n在那段缓和期内，`Liberty Media` 向 `News\
  \ Corp.` 卖掉了一项宝贵的资产——其对 `International Family Entertainment` 的控股股权，该实体拥有 `Family\
  \ Entertainment`。\n\n\n\n这为鲁伯特（Rupert）提供了另一个机会。凭借 1100 万订阅用户，`DirecTV` 仍然可以为他提供苦苦以求的美国付费电视市场准入证。\n\
  \n2003 年 12 月，`News Corp.` 出资 66 亿美元从 `General Motors` 手中购买 `Hughes Electronics`\
  \ 及其 `DirecTV` 卫星业务 35%的股份——令人震惊的是，这比两年前 `EchoStar` 对同一项业务的报价要低了约 200 亿美元。\n\n`News\
  \ Corp.` 找回了在 2002 年 1 月辞去共同首席运营官职位的 `Chase Carey`，担任 `Hughes` 的总裁兼首席执行官。`Murdoch`\
  \ 出任主席。\n\n当 `Charlie Ergen` 在 2001 年追逐这项业务时，`Murdoch` 曾准备好出资 200 亿美元竞标。`DirecTV`\
  \ 市场价值在短短几年内发生的惊人下跌，更多是归于市场因素，而非政府干预。\n\n在短短几年里，新颖的 `World Wide Web` 观众人数呈指数级增长。`Cable`\
  \ 的地面系统在铺设最新的、全数字的、光纤支撑的网络线路方面正在追赶，这些线路能够提供交互式的、高速互联网访问。太空中的卫星无法比拟这种能力；它们的设计初衷是单向向地球上的接收器传输电视信号。\n\
  \n***\n\n尽管如此，鲁伯特的 `News Corp.` 经营的是电视业务而非互联网接入业务，而 `DirecTV` 为他的网络提供了急需的分发渠道——并提供了一个绕过坚决拒绝与他进行哪怕一点业务的电缆运营商的捷径。\n\
  \n存在一个问题：我的公司 `Liberty Media` 也对购买 `DirecTV` 感兴趣。到此时，`Liberty` 不再与 `TCI` 关联，它拥有电缆频道的股份，但没有电缆系统。\n\
  \n为什么要买这颗曾经辉煌但现在已黯落的星呢？如果你能以廉价和税收优惠的条款收购它，即使是一个衰落的业务也具有良好的内在价值。此外，人们总是高估了“下一个大大事”何时到来并占据主。而我们也低估了旧的现有技术还能坚持多久。\n\
  \n通过投资落在这一差距地带资产，你可以获得丰厚的回报，`DirecTV` 就是其中之一。因此，我再次坐在桌子的另一侧，面对着那个创立了 `Fox News`\
  \ 的狡猾澳洲人，寻找机会。\n\n当我给 `Rupert Murdoch` 打那通电话时，我避开了直截了当，采取了微妙的方法：“天哪，鲁伯特，我们本以为 `DirecTV`\
  \ 会适合 `Liberty`。”潜台词是：我们有没有办法能共同拥有它？我想直接购买 `DirecTV` 的股权，或者间接地通过购买更多 `News Corp.`\
  \ 的股票。\n\n最后，我退一步，在交易中承担了较小的角色，为 `Rupert` 从 `GM` 手中购买 `DirecTV` 铺了道路，将其加入他在亚洲、英国和欧洲的\
  \ `Sky` 卫星业务中。`Liberty` 参与了 `Rupert` 的收购，换取价值 5 亿美元的 `News Corp.` 股票认股权证。\n\n`Rupert`\
  \ 曾试图与牌上的每一个参与者合作来实现他的愿景。他曾卖掉一切，然后又全部买回来。首先，他试图在 `PrimeStar` 与电缆行业合作，但遭到冷落。接着，他与\
  \ `MCI` 结盟并转向 `EchoStar`，目睹其破产后又回到了 `PrimeStar`。`Justice` 阻止了这一点，于是 `Rupert` 尝试购买\
  \ `DirecTV` 但被 `EchoStar` 击败，直到在两年后以旧价格的一小部分夺得了 `DirecTV`。\n\n整个过程中唯一的恒不变的就是 `Rupert\
  \ Murdoch` 本人。这个人是个永不言弃的人。\n\n# 第 19 章 反响冷淡\n\n我曾带领 `TCI` 渡过一些惊涛骇浪，但什么都不能让我对 1994\
  \ 年 2 月 `Bell Atlantic` 交易流产后随之而来的风暴做好准备。毕竟，在经历了所有的计划和努力之后，在告诉市场我们需要合作伙伴来构建交互式未来之后，现在\
  \ `TCI` 和 `Liberty` 只能独自完成这项任务了。\n\n到同年 7 月，当我们正准备再次在缅因州住下时，`Wired` 杂志登了一幅封面插画，将我描绘成一个身穿黑色皮质机车服、挥舞着刀和枪的“信息高速公路战士”。但事实上，我更担心自己看起来像是“信息高速公路”上一具被撞死的路尸。\n\
  \n`TCI` 在我们取消交易后迅速行动以安抚市场，然后制定了一份周密的计划来让 `TCI` 回归正轨。在接下来的两年里，我们开始把正确的环节安排到位，我开始觉得我们会没事的。抛弃对失败的恐惧后，我将注意力转向其他地方。接着，在\
  \ 1996 年夏天，现实像大西洋上的任何风暴一样，突然而严重地击溃了 `TCI`。\n\n一系列事件始于一次腹痛。1996 年夏天，在访问 `TCI International`\
  \ 在阿根廷的电缆业务途中，我感染了某种肠胃病毒，在回家的飞机上开始感到头晕和头脑发轻。等飞机落在 `丹佛` 时，我已经出现了类似流感的症状，几乎要把我击倒了。\n\
  \n但我不能在丹佛的家里真正好好休息，因为我和 `Liberty` 约要在缅因州庆祝周年日。我们正准备下水一名为 `Liberty` 的新船，那是我们共同精心设计的。我热爱`洛基山`，但缅因州对我有魔力。20\
  \ 世纪 80 年代，当 `TCI` 忙得快要散架时，我们几乎整个夏天都在那里，那种感觉像个青少年。\n\n\n\n\n在贝尔大西洋（Bell Atlantic）交易之后，每个人似乎都在问：“现在该怎么办？”我试图通过将公司分为四个独立的业务部门来简化故事：(1)\
  \ 核心电缆电视业务；(2) `Liberty Media` 的节目投资；(3) 包括新互联网投资在内的技术风险投资；以及(4) 国际电缆和节目。\n\n作为\
  \ `Liberty`（指公司，而不是那艘船）计划的一部分，TCI 创造了一类新的跟踪股票，这是一种分发给 TCI 股东的公开股，用于跟踪 TCI 内部 `Liberty`\
  \ 收益的表现。\n\n规模仍然是我们的目标，但政府成了绊路石。当时，TCI 受到来自司法部（Justice Department）和联邦贸易委员会（Federal\
  \ Trade Commission）关于几宗大交易的质询，他们担心 TCI 对电视行业施加了过大的影响力。\n\n在一项交易中，我谈了一项让 TCI 以 14\
  \ 亿美元收购 `TeleCable Corp.` 的交易，这对于另一位电缆先驱弗兰克·巴滕（Frank Batten）来说，这是一个公平的价格和健康的回报。他当时建立了第十八大的电缆运营商，在\
  \ 15 个州（大部分在南方）拥有 75 万名订阅用户。\n\n我们还与萨姆纳·雷德通（Sumner Redstone）的 `Viacom` 以及另一家名为 `Multimedia`\
  \ 的电缆运营商进行了电缆系统的交易。这些交换是我们聚类策略的一部分，旨在通过保持系统连续性来节省成本。但 `DOJ`（司法部）和 `FTC` 对 TCI 的覆盖范围感到困扰，在\
  \ 1994 年，这涵盖了美国 6000 万户电缆电视家庭的 26% 。\n\n`DOJ` 和 `FTC` 对尚未实施的与 `Comcast Corp.` 拟议的\
  \ 14 亿美元收购 `QVC` 的合资企业也感兴趣，尽管 `Comcast` 将持有 57% 的股份成为控股伙伴。TCI 在 `QVC` 的竞争对手家庭购物网络（Home\
  \ Shopping Network）中拥有 70% 的投票权引发了调查，但我们面对竞争的是整个零售行业！\n\n这一切都产生了一个不受人意的副作用，让 TCI\
  \ 的高高层忙于填写政府律师索要的文件，而不是专注于业务。一位联邦调查员估计，`FTC` 针对三次质询收集了大约九百箱 TCI 的记录，每箱超过 2000 页。我们对\
  \ `FTC` 和公众的表态是明确的：“`FTC` 员工对此处所涉及的法律和事实问题的立场完全是错误的。”\n\n我提醒自己，TCI 的律师可以处理这些。当我们的那辆巨大的房车旅行车终于通过缅因州州界时，我感觉我的热烧退了；我的血压缓解了，脉率也降到了正常水平。\n\
  \n***\n\n我们面临的逆风并未减弱。诚然，数字电缆电视盒将于 1996 年秋季从 `GI` 开始发货，我们的高速互联网服务 `@Home Network`\
  \ 计划在年底前在旧金山推出。但我们已经落后了近三年，而华尔街会对错失既定目标的公司进行严厉惩罚。从 1994 年 4 月到 1996 年 4 月，当`道琼斯工业平均指数`\
  \ 上涨 52% 时，TCI 的股票仅上涨了 24%。\n\n1996 年 2 月，克林顿总统签署了《1996 年电信法案》，为激进的新竞争发出了信号，该法案消除了电话和电缆电视行业之间几乎所有的竞争障碍。\n\
  \n`US West` 已经拥有 `Time Warner` 25% 的股份，它等不及墨水干了。1996 年 2 月 26 日，渴望电缆的“婴儿电话公司”（Baby\
  \ Bell）以 108 亿美元的现金、股票和债务购买了当时第三大电缆运营商 `Continental Cablevision`，该公司由创始人兼主席阿莫斯·霍斯特特（Amos\
  \ Hostetter）经营，他是一位电缆电视先驱，于 1963 年以 100 万美元的初始投资创立了 `Continental`。\n\n`DOJ` 和 `FTC`\
  \ 也对 1994 年美国 6000 万户电缆电视家庭中 26% 左右的 TCI 覆盖范围感到困扰。\n\n`DOJ` 和 `FTC` 还对与 `Comcast\
  \ Corp.` 拟议的尚未实施的 14 亿美元收购 `QVC` 的合资企业感兴趣，尽管 `Comcast` 将持有 57% 的股份成为控股伙伴。TCI 在 `QVC`\
  \ 的竞争对手家庭购物网络中拥有 70% 的投票权引发了调查，但我们面对竞争的是整个零售行业！\n\n这一切都产生了一个不受人意的副作用，让 TCI 的高高层忙于填写政府律师索要的文件，而不是专注于业务。一位联邦调查员估计，`FTC`\
  \ 针对三次质询收集了大约九百箱 TCI 的记录，每箱超过 2000 页。我们对 `FTC` 和公众的表态是明确的：“`FTC` 员工对此处所涉及的法律和事实问题的立场完全是错误的。”\n\
  \n我提醒自己，TCI 的律师可以处理这些。当我们的那辆巨大的房车旅行车终于通过缅因州州界时，我感觉我的热烧退了；我的血压缓解了，脉率也降到了正常水平。\n\n\
  ***\n\n我们面临的逆风并未减弱。诚然，数字电缆电视盒将于 1996 年秋季从 `GI` 开始发货，我们的高速互联网服务 `@Home Network` 计划在年底前在旧金山推出。但我们已经落后了近三年，而华尔街会对错失既定目标的公司进行严厉惩罚。从\
  \ 1994 年 4 月到 1996 年 4 月，当`道琼斯工业平均指数` 上涨 52% 时，TCI 的股票仅上涨了 24%。\n\n1996 年 2 月，克林顿总统签署了《1996\
  \ 年电信法案》，为激进的新竞争发出了信号，该法案消除了电话和电缆电视行业之间几乎所有的竞争障碍。\n\n`US West` 已经拥有 `Time Warner`\
