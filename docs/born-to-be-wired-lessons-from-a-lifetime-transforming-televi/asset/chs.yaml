  \ 亿美元收购了首都城市/ABC 公司及其梦寐以求的 ESPN 频道；就在第二天，威斯康西电气宣布计划用 54 亿美元现金购买 CBS。\n\n这引发了特德·纳纳（Ted\
  \ Turner）和 TBS 团队的焦虑。尽管 TBS 增长迅速，收入已接近 30 亿美元，但特德告诉我，他仍然感到“脆弱”，担心自己的公司有一天会成为被收购的目标。\n\
  \n为了给 TBS 寻找另一处收购对象，他已经耗尽了迈克·米尔肯（Mike Milken）那极具财务弹性的脑筋。由于柯克·柯科里安（Kirk Kerkorian）等人的收购威胁仍让他记忆犹新，加之周围的行业整合和垂直整合如火如荼，特德觉得是时候认真考虑与某人结盟了。\n\
  \n时至今日，三十年后的，我希望特德·纳纳能让 TCI 或自由媒体（Liberty Media）收购纳纳广播电视，正如我曾向他建议的那样。特德本可以留在原位，永远在内容端运营一切。他可以依靠我们一直支持他，并可以掌握确保他财务独立的投票控制权。\n\
  \n对特德来说，与 TCI 整合资产是世界上最容易的事情，到那时他可以永远运营下去他的帝国。我们会把 TBS 的这笔交易视为一项良好的投资*且*是一项良好的公共服务。\n\
  \n但特德，这位在一年前（1994 年）就加入了 TCI 董事会的人，每当我提到合并的想法时，他告诉我：“我爱爱你们，但你们对我来说太右翼了。我认为，如果 CNN\
  \ 要由某人控制或与某人契合，它需要与某个新闻行业的人契合——而时报公司（Time Inc.）可能是最合逻辑的选择。”事实上，我是一个自由意志主义者，信奉最小政府干预、自由市场和个人自由——但我无法向特德解释清楚其中的细微差别。很少有人能做到这一点。\n\
  \n特德正在考虑的几个选项，包括与比尔·盖斯和微软合资经营一个 CNN.com 的版本，在该版计划中，盖斯愿意投资 10 亿美元。但在与这些潜在合作伙伴的每一次讨论中，特德都因为他在获得救助后，与强大的新有线运营商董事成员签署的协议中的条款而受到阻碍。他在这些限制下感到焦躁难安。\n\
  \n特德还在与杰里·莱文（Jerry Levin）交谈，此时莱文已经是时报华纳（Time Warner）的 CEO，正是这个杰里·莱文曾在 1976 年与特德合作，将\
  \ WTBS 与 HBO 一起放在同一颗卫星上。时报华纳的股价正在低迷，莱文正寻求通过出售资产或购买新资产来提振股价。\n\n那是特德和我经常在他的农场共度时光的岁月，他偶尔会问我该如何打他的牌。当他终于告诉我他即将与时报华纳达成交易时，我曾感到非常失望。\n\
  \n华纳兄弟制片厂、时报旗下的杂志（包括《时间周刊》、《人物杂志》和《体育画报》）、HBO 以及特德的频道（包括 CNN、TBS 和 TNT）的结合，是一项令人深刻的资产组合，但在我看来，除了财务运作之外，它几乎没有提供真正的协同效应。时报公司几乎没有证明这种合并的价值。\n\
  \n\n\n华纳时（Time Warner）的品牌当时包括 Ted 的 CNN、TBS 以及其他频道、《时代》杂志，以及华纳兄弟和《乐尼兔卡通》，它们都是家喻户晓的名字，但这家娱乐巨头在网上的存在仍然有限。\n\
  \n它的 Pathfinder 门户——一个涵盖《时代》杂志和网络原创内容的综合性网站——于 1994 年上线，但对用户的吸引力远不如 Yahoo 和 Excite，在投入四年和\
  \ 1 亿美元后，它也被遗弃了。\n\n我知道 AOL 正在被出售。我听 AT&T 评估过这项互联网服务，但首席执行官迈克·阿姆（Mike Armstrong）并未动摇。当时，AOL\
  \ 是最大的互联网服务提供商，拥有 2500 万用户，其股价就像几乎任何其他带有“点点”名称的股票一样被炒高。\n\n宏伟计划是让“新媒体”美国在线为“旧媒体”华纳时这家全球最大的媒体公司之一注入动力，并将其转型一家成长型公司。AOL\
  \ 首席执行官史蒂夫·凯斯（Steve Case）和总裁鲍勃·皮特曼（Bob Pittman）正在全力推高公司，但其实质内容寥无几。它是一只泡沫股，就像许多其他推销其“点点时代”预言的股票一样。\n\
  \nAOL 的优势似乎在于它声称覆盖了美国 45% 的家庭，但这些数据具有欺骗性。线运营商提供的新一波高速互联网连接，加上网景（Netscape）等其他强大的新搜索引擎，已经悄悄在美国生根——这是一种*不需要*门户或像\
  \ AOL 那种“围墙花园”的网络新愿景。这些连接将允许消费者简单地接入互联网，不需要像 AOL 那样的“门户”服务。\n\n至于杰里·列文（Jerry Levin），他渴望通过一项转型性的交易让华纳时处于行业顶端，并由他来掌舵。但他买的是一个未经证明的概念，他没有问出蒙蒂·夏皮罗（Monty\
  \ Shapiro）的问题：“如果这行不通怎么办？”\n\n就像一个误判了浪头的冲浪者，他太早地上船了。互联网正在到来，但尚未到达，而且并不是 AOL 所推销的那种方式。\n\
  \n华纳时的业务在 1998 年创造了 268 亿美元的收入，是 AOL 的五倍。但在互联网泡沫增长期间那个疯狂的估值世界里，部分由于 AOL 的的净利润是华纳时的四倍，股票市场对\
  \ AOL 的估值是华纳时的 1.5 倍。正如政府调查人员后来发现的那样，公司的账目是虚假的。华纳时在任何合并中都犯了一个初级错误：对 AOL 的尽职调查不足。\n\
  \n创建 AOL/华纳时娱乐与互联网巨头的公告于 2000 年 1 月 10 日发布。AOL 利用其被推高的的股价，以约 1,650 亿美元的价格收购了华纳时，并还将承担华纳时约\
  \ 170 亿美元的债务。这到今天仍然是历史上最大的合并案，总市值达 3600 亿美元——美国商业史上最壮观的失败。\n\n2000 年 5 月，在合并宣布仅几个月后，Ted\
  \ 邀请我去他位于新墨西哥州的维尔梅霍公园牧场（Vermejo Park Ranch），那里就在我新墨西哥州北部拥有的牧场和土地旁边。我感谢了他的邀请，然后想出了一个我考虑了很久的想法：“Ted，你从未从空中游览过你的牧场吗？”\n\
  \n“没有！”\n\n“那好，我会租一架直升机飞过去接上你，带你从空中游览这两处牧场。这大约需要一小时，然后你我就可以坐下来谈谈。”\n\n我从 Ted 那里学到的最持久的教训之一是关于传承，以及一个人在离开这个星球后留下了什么。你可以实现美国梦，从贫民变成富翁，但你如何处理这些财富？他认为，拯救土地、保护土地并使其免受开发，只是有钱的人为让世界变得更好可以做的*一件事*。“钱放在银行里有什么用？”特纳曾说过，“把钱存在银行里是一件很可怜的事。”\n\
  \n当 Ted 与宾州石油（Penn Oil）谈判购买新墨西哥州的维尔梅霍牧场时（这是他的第一次大宗土地购买），我也感会到了这可能具有多大的战略意义和回报。当他在电话中谈判时，我坐在他身边，突然意识到：这是我应该做的事情。\n\
  \n于是，Ted 和我坐上了直升机，那是那种神奇的日子之一，你会希望按按下生命这台巨大录像机的暂停键。在直升机上飞行有时极其惊险，但景色是宏伟的，你可以看到无限远。Ted\
  \ 的牧场是一片令人惊叹的崎岖美景，横跨科罗拉州南部和新墨西哥州北部，约 875 平英的原始荒野。随着直升机飞过圣雷德·克里斯托山脉（Sangre de Cristo\
  \ Mountains），地形像梦境般变化：混合针叶林穿插着白杨林，点缀着灌木和松的平原，以及开满花朵和池塘的草地。野牛、驼鹿和鹿在浅绿色和金色的田野穿梭，溪流里游满了土产的鳟鱼。\n\
  \n除了牧场上的许多土地和水岸恢复项目外，Ted·特纳濒危物种基金与美国鱼类及野生动物管理局合作，恢复了几个物种，包括濒危的黑足栗，这种动物看起来非常像戴着黑色面具、尾巴尖尖的小毛茸小偷。\n\
  \n我最美好的记忆是在新墨西哥的牧场探访 Ted 和 Jane，在那里我们会去钓鱼、猎鹌鹑，或者只是在领地内散步。鉴于我们都如此热爱水和热爱航海，遗憾的是环境从未允许\
  \ Ted 和我进行长途航行。\n\n有一天，我们在牧场上散步时，Ted 突然提议去放了鱼的池塘钓鱼。拿着鱼竿，他终于劝我登上那艘停在岸边的 8 英尺小艇。\n\
  \n我真希望能拍张照片——我正和那位赢得过杯的男人在同一艘船上，而他正全速航行——速度只有两节！\n\n遵命，船长。\n\n那天由 Ted 掌舵，我比在最豪华的游艇上更有趣。\n\
  \n当 Ted 和我徒步到他最喜欢的景观处时，我看到，这是一个比雕塑或建筑伟大的生命纪念碑，也是对同胞更好的礼物。如果你做得好，你就可以拥有那些土地并为后代保护它们。\n\
  \n\n\n\n## AOL 与时代华纳合并：一个因果故事\n\n最初宣布，AOL 主席兼首席执行官 `Steve Case` 将成为新公司 `AOL Time\
  \ Warner` 的主席。时代华纳主席兼首席执行官 `Gerald Levin` 将成为合并后公司的首席执行官。而 AOL 的首席运营官、`MTV` 创始人之一的\
  \ `Bob Pittman` 将运营 `Turner` ——而不是那个创造了这些业务并仍想经营他们的人 `Ted Turner`。\n\n`Turner` 将担任两位副主席之一，并兼任高级顾问。AOL\
  \ 的首席运营官 `Pittman` 将担任两位联合首席运营官之一，负责如 `AOL`、`Time Warner Cable`、`HBO` 以及…… `Turner\
  \ Broadcasting` 等订阅服务。\n\nTed 的脸色变得惨白。他将不再经营他创立的那些公司了。“约翰，他们……他们怎么能这样做？我有一份合同上面写着，在未来的几年里，我有权管理我合并的那些业务。”\n\
  \n“嗯，Ted，我不认为你现在可以迫使履行那份合同中的特定条款，”我说，“他们只会支付欠你的薪水。然后你可以起诉他们……但你的赔偿金是多少？”\n\n“约翰，我该怎么办？”他问。\n\
  \n我告诉他他仍然是 `Time Warner` 的大股东，现在他将担任董事会主席。“如果我是你，我会和他们的董事成员谈谈，至少让自己处于一个位置，以便在未来的某个时刻能够反过来做出一些改变。”\n\
  \n接着，我道出了残酷的实情。“诚实地说，Ted，我觉得你被坑了。”\n\n他垂头丧气，对他这个相识数十年的男人的背叛感到真心的受伤。“`Jerry Levin`\
  \ 怎么能这样做？他是我的朋友。”\n\n“显然不是，Ted，”我观察到，“显然不是。”`Turner` 在给 `Levin` 和 `Case` 的电话中表示抗议，但无济于事。由于\
  \ `TCI` 的 `Time Warner` 股票处于盲信信托中，我们无法影响任何人。\n\n于是我打了 `Jerry Levin` 的电话，直接问他：“你对我们的朋友\
  \ Ted 打算？”\n\n“嗯，这是无法避免的，”他说，“首先，`Case` 和 `Pittman` 坚持这是交易的一项条款。其次，Ted 的行为让公司办公室感到丢脸。”\
  \ `Time Warner` 的高管理层并不习惯 Ted 在会议上的爆发和直言不讳的观察——在媒体面前也是如此。\n\nTed 很愤愤，这理所当然。他正在学习一个教训，几位领导者，比如\
  \ `Craig McCaw` 和我，都是惨痛经历过的：当你卖掉公司时，就套现。离开。不要进入董事会。不要徘留。你会被困住的。你会目睹错误的发生，你会知道如何修复它们，但你的想法会被忽视。你会过得非常痛苦。\n\
  \n***\n\n### 合并案的兴衰\n\n当 `AOL Time Warner` 合并案在新世纪初公布时，`Steve Case` 将其称为“新媒体真正成熟的历史性时刻”。它确实具有历史意义，但并不是因为它的远见卓识——而是因为它的短视、自大以及在合并破裂中损失的价值。最终，超过\
  \ `$100 billion` 的股东价值被化为乌有。\n\n许多观察者将 `AOL Time Warner` 合并案称为商业史上最大的错误，但即使是这种最高评价也无法描述价值毁灭的规模，或是损失、欺骗和背叛的程度。\n\
  \n然而，很容易忘记当时的泡沫市场曾变得多么狂热。任何没有跳入其中的人都是错过了轻松挣钱机会的傻瓜。在 `Levin` 和 `Case` 在舞台上完成了一切欢呼、击掌和拥抱之后，这段蜜月期并没有持续多久——发布会上表现出的乐观情绪像高地的夏晨露水一样挥发了。\n\
  \n随后，在 `2000` 年夏天，互联网泡沫开始了慢动作崩塌。在线广告随处开始放缓，使得 `AOL` 无法满足支持该交易的财务预测。\n\n`2000` 年\
  \ 5 月，`AOL` 同意支付 `$3.5 million` 的罚款并重报收益，以解决 `FCC` 的指控。该指控称其在 `1994` 年、`1995` 年和\
  \ `1996` 年由于入账营销费用的方式问题，在处于亏损的情况下报告了利润，这引发了一波股东诉讼潮。两年后，在《华盛顿邮报》报道后，`SEC` 对类似的非典型交易发起了调查，这次是针对虚高的广告收入。这一次，`AOL\
  \ Time Warner` 被迫支付 `$510 million` 的罚款并重报财务结果，`Time Warner` 再次被提醒了他们缺乏尽职调查。\n\n\
  书籍、文章和商学院的研究都在探讨这一难题是如何发生的。这次合并之所以注定失败是因为这个理念超前时代吗？还是因为首席执行官 `Jerry Levin` 太渴望达成交易了？抑或是因为这两家公司太不兼容，以至于文化无法融合？还是仅仅是因为缺乏尽职调查且存在太多互不关联的点？或者是\
  \ `AOL` 方面的欺诈？\n\n答案是以上所有。\n\n`Time Warner` 苦苦在互联网这个新世界中立足，我相信 `Jerry` 认为自己正在为公司做未来规划。任何拥有\
  \ `.com` 域的公司都被认为优于旧的主流媒体业务模式。而这场合并发生在互联网泡沫即将破裂之际。\n\n`1999` 年 12 月，`Time Warner`\
  \ 的股票价值达到了 `$254` 的历史高点；十年后仅为 `$25`。在十年间，公司 `90 percent` 的价值消失了。\n\n这场影响对许多投资者、员工和退休人员（包括\
  \ `TCI`）来说都是一场灾难，他们的股票也暴跌。Ted 的净资产随着交易崩溃——他损失了大约 `$7 billion`。对于 Ted 来说，连锁反应是残酷的。几年前，他承诺向联合国捐赠\
  \ `$1 billion`。尽管股票崩盘，他还是履行了承诺，这说明他是怎样的人。\n\n交易的核心架构师们不是主动离开，要么是被要求离开。`2001` 年 12\
  \ 月，`Levin` 宣布将退休，`Time Warner` 总裁 `Richard Parsons` 一位稳健著称的领导者将接任首席执行官职位。\n\n`2002`\
  \ 年 7 月，`Bob Pittman` 在董事会的持续审查下辞去了首席运营官。。同年，在愤怒的投资者仍在套现时，`AOL Time Warner` 报告了季度亏损\
  \ `$54 billion`，当时美国公司的最高记录。但九个月后，它刷新了这一纪录，宣布年度亏损 `$98 billion`。\n\n`2003` 年 1 月，在大股东投诉日益增加的背景下，`Steve\
  \ Case` 宣布辞去 `AOL Time Warner` 主席职务。同年晚些时候，`AOL` 从公司名称中移除，更名为更为简单的 `Time Warner`。\n\
  \n`Time Warner` 主席 `Dick Parsons` 在让股价回升的坚定努力下未告成功。`2006` 年，由于股价停滞不前，激进投资者兼金融家 `Carl\
  \ Icahn` 威胁要接管公司并将其拆分。\n\n翌年，由于 `Time Warner` 寻求改善资产负债表，`Liberty Media` 同意用其大额 `Time\
  \ Warner` 股票（约我们公司股份的三分之一）换取 `$1 billion` 现金和亚特兰大勇士队棒球队的所有权。Ted 对失去心爱的“勇士队”难免感到感性，但也知道这对\
  \ `Time Warner` 有很大帮助。此外，该球队将得到妥善照顾。\n\n\n\n\n于是，这家娱乐巨头开始自我拆分，首先是在 2004 年将 `Warner\
  \ Music Group` 拆分并卖给由 `Edgar Bronfman Jr.` 领导的集团，价格为 26 亿美元；四年后，它又将 `Time Warner\
  \ Cable` 拆分为一家独立的上市公司。最终，它剥离了旗下历史悠久的杂志品牌，随后将其主要的有线电视频道和节目卖给了 `AT&T`（后者又将其出售给了 `Discovery`）。\n\
  \n到 2009 年，`Time Warner` 决定再次将 `AOL` 拆分为其独立公司，结束了他们那不幸的缘分。`AOL` 最终在 2015 年以 44 亿美元的价格被\
  \ `Verizon` 收购，这仅是其合并时价值的一小部分。\n\n***\n\n我永远感谢 `Ted Turner`，他向我展示了一种看待世界的方式，让我觉得世界比我大得多，并教会我如何产生真正的影响。在\
  \ `AOL Time Warner` 交易的惨败之后，`Ted` 将重心转向了更宏大的目标：拯救世界。\n\n`Ted` 绝不仅仅是为了生意。1990 年，他创立了\
  \ `Turner Foundation` 以支持土地保护、野生动物保护、可再生能源以及抑制人口增长的努力。\n\n也许他最著名的保护工作涉及`美洲牛`，这种动物曾从`大平原`\
  \ 一直漫游到`墨西哥`，直到 19 世纪 80 年代末几乎被猎杀至几近灭绝。如今，他的牧场是北美最大的商业牛群群所在地——拥有超过四五万头动物。他通过 `Ted’s\
  \ Montana Grill` 将这一使命带给大众，提供源自他自己牛群的牛肉。\n\n甚至在他向 `联合国` 承诺之前，他就关注世界和平了。早些在冷战期间，`Ted`\
  \ 发起并电视播了`Goodwill Games`和平运动会），作为体育促进国际团结的姿态——尽管损失了超过 200 万美元，但他无所畏惧。\n\n如今，作为\
  \ `Turner Enterprises` 的董事长，他是北美第三大个人土地持有者，在 11 个州和阿根廷拥有约 200 万英亩土地。\n\n第二名由我本人占据，而在这\
  \ 220 万英亩土地中，绝大部分位于`科罗拉州`、`佛罗里达州`、`新罕布什州`、`新墨西哥州`、`缅因州`和`怀俄明州`，被用于我所谓的`可持续保护`，在我们离开很久之后依然如此。\n\
  \n2001 年，正当 `AOL` 崩溃之际，`Ted` 开始担心核大国问题。当年 1 月，他发起了`Nuclear Threat Initiative`，其目标是限制核、化学和生物武器的扩散。`Ted`\
  \ 邀请了前参议员 `Sam Nunn`（同为乔治亚人和前武装事务委员会主席）来领导该小组。`Ted` 承诺在五年内为 `NTI` 投入 2.5 亿美元，因为核武器在短期内代表了“人类面临的最大威胁”。\n\
  \n在这个行业里，有许多因其精力、专注和动力而我尊敬的人。还有一小部分人让我相处轻松，而让我感到亲近的人名单更短。`Ted` 曾说过他会为我的命效命，他对我以及这个行业的忠诚温暖了这位老工程师的心。这种感觉是相互的——我真的爱那哥们。\n\
  \n***\n\n我与 `Ted` 最后一次非常好的见面是在 2020 年，在他位于`蒙大拿州`的家中。尽管他需要一些帮助，但我们还是去体验了飞钓。我在`丹佛`的一次`美洲牛会议`上再次见了他，那是我最后一次见到他。\n\
  \n他仍然...\n\n\n\n\n在 1998 年出售 TCI 后，我 57 岁了，当时正在构建我一直梦想中 Liberty 应该拥有的形象：一个由世界上最成功的科技、媒体和娱乐公司组成的珍贵投资组合。我们积累了\
  \ `Time Warner`（9%）、巴里·迪勒的 `USA Networks`（21%）、`Gemstar–TV Guide International`（21%）的股份，当然，还有鲁伯特·默多奇的\
  \ `News Corp` 8%的股份。这些是 Liberty 的舱壁，即使其中任何一个公司遭受重创，这艘船依然能保持浮动。\n\n鲁伯特也有愿景——建立一个电视帝国，将源源不断的新闻、体育和娱乐节目传太空，然后直接传回全球数百万订阅者。他希望将公司的足迹扩大到\
  \ `British Sky Broadcasting` 之外，而与我们的这次交易可以增强他的筹码。\n\n随后在 2000 年 9 月，我们策划了另外一次股票交换，让鲁伯特获得了\
  \ `Gemstar` 44%的控股性股份，而当时 `Gemstar` 的市值正处于约 300 亿美元的高位。作为我们价值几乎翻倍的 20%股份的回报，Liberty\
  \ 获得了 `News Corp` 约占公司 10%的股份，当时其价值超过 60 亿美元。\n\n加上我们已经拥有的约 8%的 `News Corp.` 股票，这次交易让\
  \ Liberty 拥有 18%的无投票权，使其成为该公司除默多奇家族之外的最大股东。Liberty 还将获得鲁伯特计划公开上市的新型卫星业务的额外股份，包括欧洲的\
  \ `Sky`、亚洲的 `Star TV` 以及其他卫星资产，这使得我们在 `Sky` 上市（IPO）时的持股比例增加到约 6%。\n\n在 2000 年 9\
  \ 月 27 日与记者举行的电话会议上，鲁伯特分享了他对这次交易的热情，他提到了我们的伙伴关系，并用寥寥数语称我为“值得信赖的朋友和顾问”——言简意赅。“John\
  \ 是一个朋友，我们一直欢迎他加入我们的董事会。”\n\n“我们认为这像是一种‘三连贯’，”我对记者们说，“我们获得了更多 `News Corp.` 的股份，而我们一直认为这是整合媒体世界的极佳策略；我们获得了对\
  \ `Sky` 的直接投资……而且鲁伯特和我开始作为个人而互相了解，而不仅仅是业务伙伴。我们谈到了战略以及他潜在的角色。2000 年，当鲁伯特公开他患有前列腺癌并正在治疗时，他确实建议加入\
  \ `News Corp.` 董事会。如果不是因为一系列复杂的因素和潜在的冲突，我会这么做的。”\n\n***\n\n我们建立一个数字节目指南作为所有视频入口的梦想是短暂的——这并不是因为“创造性破坏”或互联网的兴起。是的，互联网泡沫处于破灭边缘，但终结我们梦想的并不是竞争或华尔街，而是一个名叫\
  \ `Henry Yuen` 的骗子。\n\n2002 年 4 月，一颗财务炸弹在 `Gemstar` 内部爆炸，造成的带损害是痛苦的，特别是对鲁伯特而言。公司公开披露其正困境地向华尔街重报财务状况。令我们震惊的是，`Gemstar`\
  \ 在 2000 年至 2002 年间非法记录了超过 2.25 亿美元的收入。\n\n`Yuen` 以其专利律师和发明家的资历令我们所有人印象深刻，并作为 CEO\
  \ 对专利采取了激进的防御，为使用由 `Gemstar`（包括 `Pioneer Electronics`、`EchoStar` 以及机顶盒制造商 `Scientific\
  \ Atlanta`）所创造的技术而支付费用。在 1999 年，在我们不知情的情况下，`Scientific Atlanta` 拒绝和解并提起反诉，停止支付给\
  \ `Gemstar` 的许可费，但 `Yuen` 仍然从 `SA` 等其他那里收取款项，仿佛支票是定期到账的一样。更令公司痛苦的是，2002 年底，一家联邦法院裁定\
  \ `Scientific Atlanta` 和其他电缆公司没有侵犯 `Gemstar` 的专利。\n\n`News Corp.` 迅速解雇了 `Yuen` 和首席财务官\
  \ `Elsie Leung`，两人因证券欺诈被美国证券交易委员会（SEC）起诉。随着他们内部戏码的不断扩大，`Yuen` 和 `Leung` 攫取约 1 亿美元的薪水、奖金、行权的股票期以及出售\
  \ `Gemstar` 虚高股票的巨款。`Leung` 同意支付超过 130 万美元来和解 `SEC` 的指控。\n\n2005 年，`Yuen` 对销毁传唤文件的刑事指控认了罪。次年，`SEC`\
  \ 赢得了诉讼并罚款他 2230 万美元，这是当时个人个人证券欺诈案件中最大的罚款之一。`Yuen` 从未支付过罚款，2008 年，在 `Yuen` 删除了 `Gemstar`\
  \ 财务欺诈相关的计算机文件后，司法部（`DOJ`）控其妨碍司法。\n\n`Henry Yuen` 现在在哪里？没有人知道，甚至美国政府也不知道，截至本文写作，他们仍在寻找他，并将他视为“逃避法网的逃犯”。\n\
  \n鲁伯特和我感到非常震惊和沮丧，尴尬于我们太专注于奖赏而分了心，从未考虑过自己正被欺骗。我们和许多人都信任了一个撒谎、偷窃并欺骗我们的人。你该如何对付一个病态的\
  \ CEO？在旧西部，他会被吊在最近的树上。但在现实生活中，你只能接受现实。然后继续前行。\n\n`Gemstar` 曾在华尔街一度是明星，股价在 70 美元左右，作为通往下一阶段电视的门户，未来一片光明。最终，随着丑闻大白，`Yuen`\
  \ 潜逃高飞，股价跌至几美元。\n\n`News Corp.` 遭受了沉重打击，记录了与 `Gemstar` 相关的 60 亿美元损失——包括股东诉讼和 `SEC`\
  \ 罚款——最终鲁伯特在 2007 年将其出售给 `Macrovision`，价格为 28 亿美元，这仅是我们在 2000 年估值的 300 亿美元的一小部分。\n\
  \n很少有人知道，虽然我们对一项公平的交易握了手，但条款从未落成纸面，最终没有证据证明我们同意了比口头承诺更多的，尽管 `Gemstar` 已经开始变得不妙。\n\
  \n当 `Henry Yuen` 背叛我们时，鲁伯特完全可以反悔我们的交易，而我将没有任何法律救济。他可以打电话告诉我：“这对我来说不再行通了。”但他遵守了诺言。对我来说，这意味着一切。\n\
  \n***\n\n几年前，1993 年，鲁伯特就盯上了国家橄榄球联盟（NFL）。他的理由很明确：他将体育视为他全球卫星公司的“冲撞器”。由于只有几个电台且没有体育经验，拥有最大的热门剧是《辛普森一家》的\
  \ `Fox` 面临着来自三大电视网的激烈竞争，这三大电视网自 1956 年联盟首次在电视上转播比赛以来一直统治 NFL。`CBS`、`NBC` 和 `ABC`\
  \ 各持有珍贵的 NFL 版权包，但受限于削减成本的 CEO `Laurence Tisch`，`CBS` 似乎不太出价过任何人。\n\n但默多特理解了别人忽略的：NFL\
  \ 比赛对他来说更有价值，因为它们提供了即时的信誉、关键的男性群体，并为 `Fox` 的节目阵容带来了收视率提升。通过仔细听取所有者的意见，他识别出了分歧：老牌所有者犹豫不决，但像牛仔队队主\
  \ `Jerry Jones` 这样的新声音则渴望新的收入和创新。\n\n\n\n\n这一举措最初被认为具有风险，但却具有变革性意义。这笔交易让福克斯获得了 `NFL`，重塑了媒体格局，并成为了《哈佛商业评论》中一个关于大胆谈判的案例研究。\n\
  \n两年后，在 1995 年，鲁伯特和我再次共舞。凭借着 `NFL` 的资源，`News Corp.` 收购了 `Liberty Media` 属 `Prime\
  \ Sports` 关联公司 50% 的股权，这是一系列播放当地比赛的区域性体育网络。正如我们之前与 `Gemstar–TV Guide` 合并资产一样，我们合并了十几个区域性电缆体育电视频道，以及福克斯的\
  \ `FX` —— 这是一个覆盖 3900 万家庭的娱乐频道。\n\n四年后，在 1999 年，我们将另一半股份卖给了默多奇，换取了价值 `$1.4 亿` 的更多\
  \ `News Corp.` 无投票权，这是一笔非纳税交易。对于 `Liberty Media` 来说这是一个丰厚的回报，对鲁伯特·默多奇来说也是一笔划算的交易。从那以后，`Fox\
  \ Sports` 一直是他他的摇钱树。\n\n***\n\n当我第一次对鲁伯特投资时，我已经认识特德十年了，他的身份既是大股东，又是顾问（`consigliere`），有时还当他的看门人。\n\
  \n鲁伯特·默多奇在英国以及现在美国的媒体扩张给我留下了深刻印象。因此，大约 20 世纪 80 年代后期，我给特德打了电话告诉他：“特德，如果你聪明的话，鲁伯特才刚刚起步，你应该去更好地了解他。”\n\
  \n“我不认识他，”特德怀疑地说，“我为什么要去讨好**他**呢？”\n\n我敦促他，建议在英国或 `U.S.` 进行潜在的合资经营，于是特德飞过去亲自见了鲁伯特。结果进展并不顺利。不久后，鲁伯特从伦敦打电给我，问了一个简单的问题：“嘿，约翰，你认为\
  \ `U.S.` 还有空间容纳另一个新闻网吗？”我立刻想到：特德应该想办法和这个人相处得更好一点。\n\n特德·特纳在 1980 年创立了 `CNN`，将最初被嘲笑为“鸡面汤网络”（`Chicken\
  \ Noodle Network`）的事业变成了一个优秀且自豪的全球新闻运营机构。坦率地说，如今 `CNN` 已是其创始人愿景的缩影，无论从财务角度还是全政治化的焦点来看都是。鲁伯特在十六年后创立了\
  \ `Fox News`，如今它主导了电缆新闻，观众人数超过了 `CNN` 和 `MSNBC` 的总和。\n\n因此，当我接到鲁伯特的电话，询问是否还有空间开辟一个新新闻频道时，我并不意外。有些广播电视节目在提供极右翼的新闻，但我还没在电缆上看到过任何此类。我向他保证，在\
  \ `TCI`（全美最大的电缆系统所有者），我们乐意提供空间来播放 `Fox News` 频道。\n\n为了运营这个网络，我建议邀请一位右翼的红新星 `Rush\
  \ Limbaugh`，他极度保守的观点每周通过纽约的 `ABC` 台台在美国直播，吸引了 500 万听众。但林姆鲍拒绝了，鲁伯特最终聘请了林姆鲍的前执行制人\
  \ `Roger Ailes`，他曾担任总统 `Ronald Reagan` 和 `George H. W. Bush` 的顾问、演讲稿撰写人和竞选经理。`Ailes`\
  \ 拥有运营新的 `CNBC` 业务频道的经验，后来还经营一个名为 `America’s Talking` 的网络。\n\n但尽管鲁伯特的足球和板球比赛卫星电视服务是英国、澳大利亚及其他地区主要的电视供应商，但电缆电视行业仍主导着\
  \ `U.S.` 的电视传输。\n\n即使在五百频道的世界里，随着系统向数字技术转型，在拥挤的调频上增加新频道仍然非常困难。由于许多电缆运营商已经拥有两个 24\
  \ 小时新闻频道（`CNN` 和 `MSNBC`），许多人最初对鲁伯特冷淡之。\n\n`TCI` 同意在我们的所有系统上推出 `Fox News`，作为交换，我们获得了在任何时候拥有\
  \ `Fox News` 20% 股权的期权，只需支付 `News Corp.` 对该网络原始净投资的 20% 即可。我们将其称为“准备好了就入场”选项（我们最终确实这么做了）。\n\
  \n当鲁伯特等人同意作为新转运协议的一部分，将新网络 20% 的股份提供给 `TCI` 时，他们都清楚这对业务的好处，他们也希望获得发行商与内容制作商之间的收益协同。同时，在我们的\
  \ `TCI` 系统上播放 `Fox News`，我们支付给 `Fox News` 与任何其他电缆运营商相同的费率——没有优惠待遇。\n\n考虑到其他电缆系统采用\
  \ `Fox News` 的速度缓慢，鲁伯特进行了另一个大胆的赌注……\n\n\n\n\n鲁珀特和他的团队说服了共和党州长乔治·E·帕塔基（George E.\
  \ Pataki）以及当时的市长鲁迪·朱利亚尼（Rudy Giuliani），代表新闻集团（News Corp.）向杰拉德·莱文（Gerald Levin）进行个人恳求，部分是因为福克斯新闻将为该市带来十五千个就业岗位，但也因为一个正当的政治视角被排除在新闻媒体首都之外。\n\
  \n由于担心纽约对其在该最富有市场提供有利且独家的有线电视合同进行审查，1997 年，时报华纳（Time Warner）最终同意转播福克斯新闻。\n\n最终，福克斯新闻的成功似乎是注定的。尽管怀疑者预测，福克斯新闻频道（FNC）在\
  \ 2002 年成为收视率最高的有线新闻频道，这一地位已连续保持了二十三年多。\n\n# 第 18 章 聚焦天空\n\n鲁珀特·默多奇与杰里·莱文因时报华纳拒绝在纽约市转播福克斯新闻而公开争吵，在双方放下武器于\
  \ 1997 年达成和解之前，这场冲突已演变成互相抹黑和人身攻击。作为我职业生涯中多次遭受这两种行为的受害者，我一直认为这很遗憾，并且我会避免这样做。难道我们就不能坐下来谈谈吗？\n\
  \n这场争端提醒了鲁珀特，他在美国缺乏一个关键要素，能将新闻集团提升到真正全球媒体帝国的地位：即在这里拥有大型分发平台。在亚洲，他控制着卫星广播电视公司星视卫星（Star\
  \ TV），在英国，他拥有卫星广播电视公司 BSkyB。在美国，他拥有内容但需要分发渠道。\n\n鲁珀特对有线电视垄断者阻止其频道的手段感到恼火，他寻求建立或购买一家美国卫星电视公司，以复制他在国外的成功。这一远大的愿景使他开启了一场史诗般的追求，引发了一系列大宗交易、公开斗争、人身攻击、诉讼、巨额损失，并最终导致了司法部的两次独立干预。\n\
