  \ (此处由于原文本身存在大量重复，译文已保留核心逻辑)\n\n\n\n这两位遗产执行人对完成 Bob 保护 TCI 长期价值的最后遗愿感到非常满意，他们于 1997\
  \ 年 6 月 16 日将 3250 万股股票卖回给 TCI，总价 5.29 亿美元，折合每股 16.52 美元，以偿还税款。\n\n由于 TCI 无法负担这些股票的费用，我用数学解决了这个问题：首先，遗产将会将\
  \ 3250 万股超级表决权 B 类股换为 TCI A 类股，后者的交易价格与 B 类股大致相同。然后 TCI 将从纽约的两家投资银行——美孚富士林和莱曼兄弟银行借入\
  \ 5.29 亿美元，以换取这 3250 万股 A 类股。随后，TCI 可以在接下来的两年内从这两家银行买回这些 A 类股。\n\n一切都平静了了两周。\n\n\
  ***\n\n我们的计划在几天后开始瓦解。那是 1997 年 6 月 24 日，当时莎伦·马格内斯（Sharon Magness）起诉废除 Bob 的遗嘱。她在遗嘱法庭上辩称，她应得的远超过遗嘱留给她的部分——总计\
  \ 5500 万美元资产，包括房子和马场。现在，她根据科罗拉多州的法律要求获得遗产至少的 50%，并请求就此问题进行陪审团审判，这与她的成年继子们展开了一场老式的西部对决。\n\
  \n这对兄弟在下个月带着杀气腾腾地回来了，他们发起了反诉，诉状中引用了一份 1989 年的婚前协议，该协议对莎伦的限制甚至比她在马格内斯遗嘱中获得的还要少。\n\
  \n这对于所有相关人员来说都是痛苦的，媒体也借此大做文章，渲染这种刻板印象：一个遗嘱混乱的七十多岁富翁和一个据 own 为捞金术的年轻金发妻子，对比科罗拉多州最大遗产争夺战中的两个被宠坏的儿子。人们感到痛苦、贪婪，而贪婪且如狼般的律师们却占了他们的先机。\n\
  \n与此同时，TCI 和我个人联系了投资者以加强控制，通过置换，尽可能多将来自 TCI 创始人投资者肯尔斯-论坛报公司（Kearns-Tribune Corp.，《盐湖城论坛报》的出版商）以及\
  \ TCI 股东纳特·里德（Knight Ridder）拥有的 A 类股换成 B 类超级表决权股，这使我的 TCI 投票权从约 18%提高到了 25%。但这仍然不足以阻止收购。\n\
  \n接着在 1997 年 9 月 11 日，Bob 的儿子们通过向法院申请撤销丹·里奇（Dan Ritchie）和唐·菲舍尔（Donne Fisher）执行人的身份停止了一切。下个月，他们起诉遗产，要求推翻向\
  \ TCI 的股票出售。\n\n双方都愤怒了。儿子们的申请书中写道，“代表与两个主要受益人之间不可调和的敌意决定了他们必须立即撤职。”兄弟俩声称，唐作为执行人存在利益冲突，因为他还是\
  \ TCI 的董事会成员，并且以每股 16.52 美元的价格谈判了出售，尽管当时有更高的报价。\n\n事实是，Bob 在任命唐时非常清楚他是 TCI 的董事会成员兼顾问，而且他也担心那些可能购买\
  \ TCI 控制权并将其拆分售卖的敌意收购者。\n\n这份匿名报价来自一家精品银行——拉扎德兄弟公司（Lazard Frères & Co.），他们曾向遗产执行人传真了一份类似的两页纸报价函。拉扎德代表一位匿名买家，“愿意支付超过每股\
  \ 20 美元的价格”购买遗产持有的 3200 万 B 系列股——但执行人不想与不愿透露身份的买家玩游戏。\n\n直到后来，这位神秘竞者才显现身份：是康讯公司（Comcast\
  \ Corporation），一家长期的合作伙伴！我本该知道的。就在同一个月，即 1997 年 6 月，比尔·盖斯在布莱恩·罗伯茨（Brian Roberts）的请求下，震惊了华街，让微软向康讯投资了\
  \ 10 亿美元现金。这项所未有的投资是对电缆互联网战略的蓝筹背书，消息传出股价飙升。\n\n当我向布莱恩·罗伯茨提及收购 TCI 控制权股份的报价约时，他基本上归咎于比尔·盖斯，盖斯说他将通过拉扎德为\
  \ TCI 报价。“你们可以加入我，但如果现在拒绝，你们就永远无法参与其中，”布莱恩引用了盖斯这样警告他的话。\n\n我不得不承认，这是一个非常大胆的举措。全球最大软件公司的创始人比尔·盖斯，试图将自己的手置于电缆行业，并为排名第三的康讯豪掷了\
  \ 10 亿美元。而仅仅几天后，他就试图夺取排名第一的 TCI 的控制权。\n\n这让我有点心痛。毕竟，我与微软有长期合作的历史，与康讯也保持了二十多年的合作关系，并在不同时期甚至提出过与康讯合并的设景。布莱恩和他的父亲拉尔夫（Ralph）都表示，他们他们的加入会让这一切变得“友善”。\n\
  \n“好吧，如果你们想让变得友善，你们知道电话号码是多少，”我说，“从正门进来谈谈吧。”我克制住没有发火。生意就像象棋。你可以为自己的失误感到懊悔，但为对手下了一着好棋而发火是浪费精力。\n\
  \n这次对 TCI 股票的猛击确实有些刺眼。\n\n\n\n\n失去鲍布（Bob）让我更多地思考这些问题。我意识到，工作之所以让我满足，是因为鲍布会为此感到自豪。我可以达到鲍布的期望，就像我渴望达到父亲的期望一样。现在鲍布·马格斯（Bob\
  \ Magness）离去了，我失去了我最重要的观众：我的导师、伙伴、朋友和父亲般的人物。随着他的离开，一切感觉似乎都有些不同。\n\n因此，在 1997 年 12\
  \ 月，我和里奥·辛德里（Leo Hindery）坐在一起进行了一次深度交谈，开诚地告诉他：让我们找一个大投资者——或买家——来帮助我们资助 TCI 进化的下一个阶段。\n\
  \n整个 1997 年，里奥一直拼命地增加现金流，部分是通过推动一种“合作伙伴与集群策略”，创造了十二个新的合作伙伴关系和十次系统交换，帮助 TCI 精简并加强了行业参与者之间的纽带。里奥将其称为“爱之夏”。\n\
  \n在里奥无限能量的推动下，1997 年的现金流强劲增长了 20%。他并履行了在 1997 年底为 500 万家庭提供数字视频服务的承诺；到 1998 年 2\
  \ 月，我们已经向 1400 万客户中的 80%营销数字有线。\n\n自然地，随着 TCI 股票的上涨，我的出售意愿变得更加强烈。自由集团（Liberty）的跟踪股票表现也很好，在\
  \ 1997 年飙升至 90%，得益于自由集团对时华（Time Warner）、探索探索（Discovery Communications）、Encore Media\
  \ Group、USA Networks 以及福克斯/自由（Fox/Liberty）体育合作伙伴关系的投资。\n\n当我们寻找合适的合作伙伴时，里我和回到了一家几年前在另一位首席执行官领导下曾拒绝过\
  \ TCI 的公司，那家公司是我开始职业生涯的地方：AT&T。\n\nAT&T 的年收入是 TCI1997 年 76 亿美元收入的六倍以上，它将为 TCI 提供真正构建一个全国性高速网络的资本。与当地的电话公司不同，AT&T\
  \ 缺乏进入客户家庭的“最后一里”布线，以及与之随之而来的直接客户关系。电缆运营商是唯一其他拥有进入数百万美国家庭直接管道的公司。\n\n然而，AT&T 真正的奖励将是`@Home`，电缆行业的高速互联网服务。它已经签约了十万名客户并获得了广如好评，并承诺成为提供高速互联网接入竞争的获胜者。凭借电缆的宽带宽和\
  \ AT&T 的品牌及资金支持，基于互联网服务的业务看起来是无限制的。\n\n`@Home`的覆盖范围远超 TCI 的 1400 万客户；它拥有向由`@Home`的众多合作伙伴——包括\
  \ TCI、Cox Communications、Comcast Corporation、Cablevision Systems Corporation 和 Rogers\
  \ Cable——拥有的电缆系统内的总计 5500 万家庭提供互联网服务的独权，其中 TCI 是持有 42%股份的大股东。\n\n我们认为现任的 AT&T 主席兼首席执行官迈克·阿姆斯特朗（Mike\
  \ Armstrong）可能会感兴趣。在 1997 年担任该职位之前，前 IBM 高管的阿姆斯特朗曾担任通用汽车公司（General Motors Corporation）休斯电子集团的首席执行官，他在那里发起了`DirecTV`。\n\
  \n迈克的任务（我也相信这一点）是将 AT&T 重造成一家多元化的电信和互联网公司。AT&T 面临着生存危机。尽管仍是 800 亿美元长途市场的之王并拥有 60%的份额，但它是一座沙堡：随着\
  \ IP 协议语音（VoIP）技术的繁荣和竞争加剧，长途每分钟费用在两年内下降了三分之二，从 15 分钱降到 5 分钱。这些费率将跌至零——如今，美国人拨打美国国内电话不再支付按分钟的长途费。\n\
  \n迈克在任职后不久就飞往丹佛进行会谈——我们在多年前的一场行业会议上见过面。在就新法引发的新联盟和竞争对彼此进行了几分钟的质询问答后，我们便转向了 TCI 和\
  \ AT&T 可能合作的途径。\n\n阿姆斯特朗在 1998 年 1 月率先出击，当时 AT&T 花费 113 亿美元收购了电波特通信集团（Teleport Communications\
  \ Group），这是与 Comcast 和 Cox 建立的、向企业提供电话服务的合作伙伴关系。这笔交易设计为免税股票交换，使得 TCI 在 Teleport\
  \ 中 30%的股份价值 29 亿美元，增长了超过 4000%。\n\n迈克·阿姆斯特朗观察到涌入科技公司和互联网初创企业的巨额风险投资，他感到时间正在逼近。我们也是如此。一天，在我们充分考虑了那个想法后，辛德里给我打电话说阿姆斯特朗准备好达成交易了，“他想进行得非常快。”当时，我拥有\
  \ TCI48%的投票权和自由集团 41%的投票权。而 TCI 拥有`@Home`72%的投票权。\n\n1998 年春春天，在 TCI 总部大楼十一楼的董事会议室里，迈克在原则上同意了合并条款，这在当时是商界规模最大的交易之一。这一切在八天内就完成了。自\
  \ 1964 年以来，我见过了每一位 AT&T 主席，而我想，这是第一位真正领会此意的人。\n\nAT&T 同意支付 483 亿美元的现金、股票并承担债务——每股\
  \ 50.71 美元，较于股价溢价 30%，但与几个月前股票在 30 美元水平的交易价相比，大约溢价 60%。\n\n\n\n\n\n“你交过税吗？”有一天，有人这样问我，就好像减少你的税单是一项犯罪一样。我说：“当然，我交过税——越少越好，越晚越好。”而且我是认真的。接着我发表了我那标准的演讲：“我把那看作是我股东的钱。不是政府的钱。我的工作是尽可能为股东省下这些钱。”\n\
  \n* * *\n\n在 TCI 股东对 AT&T 交易进行投票的前大约一周，即 1999 年 2 月 16 日星期二，许多 TCI 高管在丹佛一家时尚的 `Swan`\
  \ 餐厅聚进了一场庆祝晚宴，其中包括 `JC Sparkman`（在 `TCI` 工作了 32 年）、`Donne Fisher`（工作了 30 年）以及 `Larry\
  \ Romrell`（工作了 38 年）。\n\n菜单上有胡椒味煎牛肉薄片、蟹饼、夏托比牛肉以及配有姜饭和亚洲梨莎莎的金枪鱼排。在 20 世纪 70 年代，我们根本负担不起这种地方。这是一场私密的聚会，也是\
  \ Leslie 少数几次参加公司活动之一。在欢笑和冷笑话之，我用叉子敲了敲香槟杯，对着这个感觉像家一样的房间致辞。\n\n“我们是在巅峰时刻离开，”我对大家说。我特别表扬了\
  \ `Leo Hindery`，说：“是他真的让这次合并成为了可能——我们中许多人都怀疑交易能否达成。他凭借纯粹的能量完成了任务。他推动、推动、再推动，最终促成了交易的落地。感谢你，Leo，我非常感激。”\n\
  \n从 1973 年到 1999 年，`TCI` 实现了惊人的 30.3% 年均复合收益率，相比之下，其他上市电缆公司为 20%，同期间的 `S&P 500`\
  \ 为 14.3%。\n\n根据 `William N. Thorndike Jr.` 在《局外者》（*The Outsiders*）中的描述，在那二十五年里，1973\
  \ 年投资 `TCI` 的 1 美元（考虑到其分拆和拆股）到 1998 年年中已增长到惊人的 `$900`。同样的美元在同类电缆公司中将达到 `$180`，而在\
  \ `S&P 500` 中仅为微不足道的 `$22`。从纯粹的表现来看，`TCI` 的速度超过了大大市场四十倍以上，这是一个令我无比自豪的记录。\n\n“Bob\
  \ Magness 会喜欢这个的。`TCI` 股票和 `Liberty` 股票的涨幅接近千亿美元——我想这甚至能引起 Bob 的注意。多么伟大的历程啊，”我向我的电缆牛仔哥们和他们的妻子们说。AT&T\
  \ 股东的批准很快到来，`FCC` 也为这项交易亮了绿灯。\n\n几周后，在 `TCI` 的国家数字电视中心内部（这里是开启数字压缩时代的巨型卫星上行链路所在地），我召集了第\
  \ 26 次也是最后一次 `TCI` 股东大会。股东们热情地批准了 AT&T 对 `TCI` 为 `$48 billion` 的收购。\n\n我和 `TCI`\
  \ 总裁 `Leo Hindery` 以及 `Liberty Media` 总裁 `Dob Bennett` 一起站在台上，对投资者们说：“我们经历了一段了不起的历程，现在我们要开启一段新的冒险了。”我当时并没有意识到我用错了词：事实证明那是一场*不幸的*。\n\
  \n# 第 21 章 断开\n\nBob Magness 会喜欢这个的。`TCI` 股票和 `Liberty` 股票的涨幅接近千亿美元——我想这甚至能引起 Bob\
  \ 的注意。多么伟大的历程啊，”我向我的电缆牛仔哥们和他们的妻子们说。AT&T 股东的批准很快到来，`FCC` 也为这项交易亮了绿灯。\n\n几周后，在 `TCI`\
  \ 的国家数字电视中心内部（这里是开启数字压缩时代的巨型卫星上行链路所在地），我召集了第 26 次也是最后一次 `TCI` 股东大会。股东们热情地批准了 AT&T\
  \ 对 `TCI` 为 `$48 billion` 的收购。\n\n我和 `TCI` 总裁 `Leo Hindery` 以及 `Liberty Media` 总裁\
  \ `Dob Bennett` 一起站在台上，对投资者们说：“我们经历了一段了不起的历程，现在我们要开启一段新的冒险了。”我当时并没有意识到我用错了词：事实证明那是一场*不幸的*。\n\
  \n没过多久，平静就陷入了混乱。1999 年春天的一个周五下午，我给 Mike Armstrong 打了电话，告诉他从周一起，美国第四大电缆运营商 `Comcast`\
  \ 将对拥有全美 500 万用户的第三大运营商 `MediaOne` 发出 `$58 billion` 的收购报价。\n\n\n\n\n在 AT&T 甚至还没来得及从枪鞘里拔枪之前，他就完成了。这项交易将改变这家公司。`Comcast`\
  \ 的规模将近乎一倍，达到 1100 万用户，并增加了一项即用的电路交换电话业务。\n\n对我来说，在此时，`Comcast-MediaOne` 的交易已经板上钉钉。我们有充分的理由退出。\n\
  \n由于缺乏线电视追踪器，这意味着 `AT&T` 必须发行更多的自普通股来竞购 `MediaOne`。当你发行更多股票时，市场上每股存有股的价值就会下降（这被称为`稀释`），每股收益也会随之下降。因此，你在执行此操作的同时也损害了自己的股价。\n\
  \n为了压制 `AT&T` 竞标时必须发行的新股数量，`Armstrong` 必须用大量的现金来增加报价价格——这是一种极其低效的支付方式，要求 `MediaOne`\
  \ 的股东对现金收益缴纳联邦税。永远不要支付你可以在法律上规避支付的税费。就这么简单。\n\n此外，为了筹集资金，`AT&T` 必须借债，这会使其曾经完美无缺、获得\
  \ AAA 评级的资产负债表承受更大的压力。这些各种压力甚至可能威胁到 `AT&T` 神圣的股息，进一步压低公司股价。这将需要支付更多股票来抵消股价的下跌。\n\
  \n因此，`AT&T` 有许多理由让路，让 `Comcast` 继续对 `MediaOne` 进行昂贵的竞标；我与管理层通过礼貌且简短的对话讨论了这些原因。但没有人听。\n\
  \n在 `Comcast` 交易消息几周后，我本人在纽约市参加 `AT&T` 董事会。当我听到 `Mike Armstrong` 正在制定一项高额的反向报价来收购\
  \ `MediaOne` 时，我差点把咖啡喷出来。他听取了我的建议——并选择了完全忽视它。在 `Comcast` 宣布合并整整一个月后，`AT&T Corp.`\
  \ 对 `MediaOne` 发出了 620 亿美元的惊喜报价——其中 2000 亿美元为现金。\n\n对外部世界来说，这令人印象深刻。`Armstrong`\
  \ 接手了一个在有电视领域没有业务的公司，随后收购了头号玩家（`TCI`），现在又想要获得第三大玩家（`MediaOne`），以打造美国最大的有电视运营商，在覆盖全国近三分之一（11\
  \ 亿户家庭）的市场中拥有 1600 万户用户家庭。\n\n但在许多方面，`AT&T` 的报价是无知与傲慢的巅峰。首先，价格实在太高了，高出了数十亿美元。按某种标准衡量，有电视系统是以每户\
  \ 3000 美元的价格出售的，而 `Mike Armstrong` 现在出价超过了每户 5000 美元。此外，`AT&T` 愿意花 620 亿美元购买一家公司，而这家被称为\
  \ `US West` 的前“婴儿贝尔”公司是以低于 150 亿美元的代价组建的，其中包括几年前花费 108 亿美元购买 `Continental Cablevision`\
  \ 的费用。\n\n然而，最严重的罪过是 `AT&T` 和 `Mike Armstrong` 如何决定为竞标的现金部分资金。该公司正在借入 300 亿美元的短期商业票据，这些票据通常在几周或几个月内到期。\n\
  \n这就好像 `Mike Armstrong` 走进一家房产办公室，用他的 `Visa` 卡买了一栋新房子一样。\n\n\n\n这是利奥·亨德里（Leo Hindery）最后一根稻草，他于\
  \ 1999 年 10 月辞去了 AT&T 电缆业务首席的职位，导致 AT&T 在电缆电视行业没有任何真正的传承联系。与此同时，由于主营长途业务的压力，公司股价从`60`\
  \ 美元区间一路跌至 40 美元元中期。\n\n利奥·亨德里在 AT&T 新收购电缆业务上的继任者是公司首席财务官 `Dan Somers`，这个人总是让我想起康田德（Candide），一个永恒的乐观主义者，认为世界处于最理想的状态。对于保证\
  \ AT&T 股票的价值、借入短期资金，或花费巨资购买与合作伙伴的协议，他毫无压力。\n\n`@Home` 得到了十多家电缆公司的支持，作为他们想要向电缆客户销售的新互联网接入服务的选定网关。`AT&T`\
  \ 是 `@Home` 的最大股东，持有 26%的股份，这是它在收购 `TCI` 时继承的。`Cox` 和 `Comcast` 是其他主要的所有者。\n\n`@Home`\
  \ 的最初想法是一个赢家：汇集我们的资源，提供一项通用的北美业务，即提供高速网络以及诸如邮件、新闻、娱乐和体育主页等服务，每月收费 40 美元。因此，规模和经济效益本将是非凡的，而且我们拥有合理的收入分成。\n\
  \n`@Home` 的股价在 1999 年 2 月飙破了 `$125`，使这家仅成立一年的公司价值达到 12 亿美元。1999 年，在违背 `AT&T` 利奥·亨德里的意愿和建议的情况下，`@Home`\
  \ 的新首席执行官 `Tom Jermoluk` 利用这种通胀的货币，疯狂花费了 67 亿美元收购了 `Excite`，这在当时互联网泡沫狂热的日子里，是一家拥有数百万客户的二线互联网门户。\n\
  \n新合并的 `Excite@Home` 随后支付了 7.8 亿美元的股票和现金收购了一家在线问候卡公司 `Blue Mountain`，该公司收入微薄，却拥有数百万喜欢免费服务的忠实粉丝。随着每次交易的进行，电缆运营商的股份都被稀释了。\n\
  \n这是愚人金。2000 年互联网泡沫破裂后，`Blue Mountain` 更像是一个陨石，两年后以 3500 万美元卖给了 `American Greetings`，连同大量互联网公司资产价值暴跌一同被抛售。\n\
  \n在管理不善和动机复杂的混乱中，`Excite@Home` 首席执行官 `Jermoluk` 于 2000 年 4 月离开公司。管理层与电缆运营商所有者之间紧张关系的部分在于，硅谷派倾向于购买流量，而我们关注的是现金流。\n\
  \n2000 年初，由于电缆伙伴在 `Excite@Home` 合作方向上的不耐烦，`AT&T` 试图收购 `Cox` 和 `Comcast` 分别持有的 8%股份，将其出价提高到每股\
  \ 48 美元的严价，总共价值近 40 亿美元的新 `AT&T` 股票。凭借这个高昂的价格，`AT&T` 在现已成为 `Excite@Home` 中的投票控制权从\
  \ 56%上升到 74%。\n\n这是一笔极其丰厚的交易——而且实际上极其鲁莽。这就是当一家公司过于巨大且口袋太深时会发生的事情。`AT&T` 付出了钱是因为它付得起。这个问题在商业界依然存在。在\
  \ `AT&T` 同意为 `@Home` 及其新收购的 `Excite` 门户支付每股 48 美元后，股价跌至 10 美元——然而 `AT&T` 仍欠 `Comcast`\
  \ 和 `Cox` 约 30 亿美元，而这些股票现在的价值仅为 5.5 亿美元。\n\n`Excite@Home` 也面临着运营问题。当电缆伙伴想要一项具有良好回报的全国性高速接入业务时，`Excite@Home`\
  \ 开始追求一种更宏大的想法，即类似于 `AOL` 的模式，拥有独家内容的“围墙花园”。这彻底失败了。网络吞噬一切。\n\n到 2002 年 3 月，`Excite@Home`\
  \ 已完全关闭，在 `AT&T` 撤回对其电缆资产 3.07 亿美元的最后报价后，该公司申请了`Chapter 11`破产保护。`Excite@Home` 的股价已触及每股\
  \ 13 美元的底部。而在 1999 年 4 月，该股票曾以每股近 100 美元的价格交易。与此同时，价值 1650 亿美元的 `AOL Time Warner`\
  \ 交易的缓慢崩溃，在 2000 年 1 月宣布后几乎就开始了。\n\n\n\n自 TCI 交易完成以来，AT&T 的股价下跌了 38%，而自由公司的 A 类股（经拆股调整）飙升了\
  \ 78%。在接受采访时，我确保保持礼貌且乐观，坚持认为“AT&T 拥有巨大的资产、优秀的人和稳健的业务计划。我相信 AT&T 最终会取得成功。”我补充道：“我和其他人一样，感到有些沮丧，因为市场没有看到公司的价值。”\n\
  \n报道指出，自 3 月以来，AT&T 股价已损失了超过 40% 的价值，并在本周早些时候在纽约证券交易所创下了低于 32 美元的历史新低。我仿佛掌握了董事会的意见一样与记者交谈，列出了一系列\
  \ AT&T 可以采取来自救的措施，当然，我提出了对其持有电缆资产的宽带部门设立跟踪股的问题。\n\n有一天，我收到了迈克·阿姆斯特强的信（我私个人很喜欢他），他基本上承认了跟踪股确实可以解决这些许多问题。于是我们讨论了这个问题，他最终向外界提出了这一想法。但已经太晚了。\n\
  \n到 2000 年 10 月，阿姆斯特已忍无可忍，他宣布了等同于拆分的决定。突然，他成了跟踪股的大粉丝，并制定了新计划创建 `four` 个跟踪股。\n\n\
  AT&T 宣布了一项重组，让股东能够投资三个新自主部门的任何或全部，并设有四个独立的跟踪股：AT&T 无线、AT&T 宽带以及长途业务，后者将有两个跟踪股，一个与消费者业务相关的\
  \ AT&T 消费者股，以及针对企业账户的 AT&T 商业跟踪股。\n\n就这样，一个经过深思但执行力糟糕的重塑美国商业偶像的策略就此终结。AT&T 曾花费 1100\
  \ 亿美元建立了一个全国性的电信巨头，能够提供从本地电话、电缆电视到互联网的所有服务。随着 AT&T 股票的持续低迷，这一努力在分析师和投资者的严厉批评中化为乌有。\n\
  \n阿姆斯特之所以拆分 AT&T，并不是因为政府强制性的拆分（像 1984 年产生“婴儿电话”公司的那种拆分），而是因为管理不善。现在，通过将自己拆分，它将实现我一直以来说的话：允许投资者专注于高增长部门，而无需同时买入举履蹒跚的长途业务。\n\
  \n当然，通过采取这些步骤，阿姆斯特强在无意中将一个传奇的美国偶像变成了一个更容易被拆分和分块出售的目标。\n\n在 11 月，AT&T 最终同意剥离我的“宝贝孩子”——自由媒体（Liberty\
  \ Media）。自 TCI 交易以来，自由媒体一直通过一种跟踪股运行，脱离了母公司的控制，且其表现远优于 AT&T 股票。\n\n在 TCI 时，我们在 1991\
  \ 年成立了自由媒体，作为我们收购的电缆频道股权的控股公司（而不是 TCI 运营的电缆系统）。到 2000 年，自由媒体拥有了前 50 大电缆频道中 22 个的股权，包括\
  \ Encore 付费电视服务、探索世界通信（Discovery Communications）、USA Network 和 QVC。自由媒体是 AOL Time\
  \ Warner 的最大股东，持股 9%，还持有新闻集团（News Corp.）8% 的股份，我会随着时间的推移增加持股。\n\n几个月后，在 2001 年 7\
  \ 月初，我再次前往爱达荷州的太阳谷参加 Allen & Company 年度会议。早早，我遇到了康通（Comcast）的主席兼创始人拉尔夫·罗伯茨以及他的儿子兼继任布莱恩。我跳过了寒暄，直奔主题，基本上问他们：“你们为什么不让\
  \ AT&T 从痛苦中解脱出来？”\n\n我建议他们可以从这个蹒跚、债台累累的巨头手中买电缆系统，要么保留它们，要么将其剥离。我的理由是：“做点什么吧。因为此时，我是\
  \ AT&T 最大的个人股东，持有 2600 万股股票，我看出这些人根本不知道自己在做什么。”\n\n罗伯茨父已经在进行一项报价。2001 年 7 月 9 日（周一），康通公司宣布对\
  \ AT&T 宽带提出 445 亿美元的非要约收购报价，涵盖了 AT&T 曾花费 1100 亿美元收购的集合电缆系统。作为报价的一部分，康通将承担 135 亿美元的电缆债务。到此时，AT&T\
  \ 拥有 1350 万电缆用户，是美国最大的用户群。如果康通成功收购该业务，它将为美国十大市场中的八个市场提供空前的 2200 万客户的服务。\n\n瞬间，康通的报价标志着我和迈克·阿姆斯特强以及\
  \ AT&T 董事会良好关系的反转。事情很快变得敌对起来。\n\n作为成员，我本乐意向董事会汇报我对康通报价的看法——它太便宜了。遗憾的是，董事会没有邀请我参加讨论报价的会议，很大程度上是因为我很快就会成为局外人，自由媒体将于\
  \ 2001 年 8 月正式从 AT&T 剥离。\n\n大约那时，我提交了辞职信，并公开了要出售 500 万股 AT&T 股票的意图，约占我公司持股的 20%。\n\
  \n当自由媒体获得自由时，AT&T 的股东们目睁睁看着股价下跌。我深有同受。由于 AT&T 的失误，加上互联网破灭的影响，我估计在个人持有的自由媒体以及 AT&T\
  \ 股票价值上，账面上亏损了高达 40 亿美元。\n\n\n\n有些日子比其他日子好过，但在分拆后的几个月里，我经常会为了事情是如何结束的而陷入无声的自我审判。这些问题源于自我怀疑和无止尽的懊恨，而我知道这些东西在现实世界中毫无意义。\n\
  \n人生中分为两种遗憾。第一种遗憾会侵蚀你，每当你用一个负面问题折磨自己时，你都能感到能量在流失。\n\n第二种遗憾会驱动你，激发出你从未发现拥有的能量。看着\
  \ `AT&T` 这家美国电信业的巨头就这样分崩离析，是一件难忍的事。但那场肮脏的磨难已经在了我的后视镜里，我无法再回头了。\n\n# 第 22 章 走向全球\n\
  \n当我还在纠结那些导致旧 `AT&T` 最后残余走向不可避免且不光终结的鲁莽决策时，有一个人不断闯入我的脑海——一个抽着雪茄、喝着白兰、拍着大腿的德克萨斯老头，名叫\
  \ `Gene Schneider`。\n\n`Gene` 和他的兄弟 `Richard` 一起，在 `U.S.` 有线电视行业被广泛认为是早期的先驱。1952\
  \ 年，他和他兄弟在 `Laramie` 和 `Cheyenne` 之间的山顶上建立了一座巨大的微波发射塔，将 `Denver` 电视站的信号传输到他们位于怀俄明州\
  \ `Casper` 的有线系统中。通过与 `Bill Daniels` 合作，他们负责了怀俄明州呈现出的第一幅电视画面。\n\n`Gene` 最终将负责我在出卖给\
  \ `AT&T` 退出行业仅几个月后，像“炮弹跳”一样重回有线电视业务。但我的回归——如果可以那样称之的话——将在 `U.S.` 之外展开。`Gene` 为我打开了眼界，看到了一个大得可以复制我们在\
  \ `U.S.` 建立的模型：一条将语音、视频、互联网数据——以及无线信号传输到世界各地家庭的宽带管道。\n\n作为一名 `UT-Texas Longhorn`，`Gene`\
  \ 留着一口狂放的德克萨斯口音，爽朗响亮的笑声，还有一副遮住了大半张脸的大眼镜。这一切都隐藏了我所知的最敏锐的商业大脑之一。我们的关系可以追溯到我在 `Jerrold`\
  \ 的日子，当时我向 `Gene` 销售有线系统组件，一边打无数斯台斯球，一边和他讨论行业的未来。我们的愿景是在一大杯杯白兰地的催化下产生的，每晚都会出现在他在俄拉荷马州的家中。\n\
  \n`Gene` 和他的兄弟很早就上了有线电视的迷。他们出生起几乎形影不离，两人都自愿加入了 `U.S. Navy`，`Gene` 在航空和雷达电子部门服役，他们他们共同创业。到\
  \ 1980 年，他们已经建立了 `U.S.` 第八大有线运营商。\n\n自从在 `Jerrold` 的日子，我就一直与 `Gene` 保持着亲密的友谊，定期关注业务情况；他的兄弟\
  \ `Richard` 已去世，他的儿子 `Mark` 刚开始进入这一行业。在 `TCI` 时代，`Gene` 还是我们在 `U.S.` 有线系统的合作伙伴。\n\
  \n随着 `U.S.` 有线行业开始成熟，`Gene` 是最早意识到海外对美国娱乐节目渴望的人之一，到 20 世纪 80 年代后期，他已经收购了欧洲及其他地区的一些小型有线电视业务。全球观众，尤其是欧洲人，对视频充满了渴求，这为\
  \ `Gene` 进入那些寻求扩张的市场提供了极佳的切入点。\n\n\n\n\n-   而且我们自己通过 `Liberty Media International`\
  \ 部门在欧洲、亚洲和拉丁美洲运营了几个市场。\n\n这是行得通的。通过在棋盘上移动几枚棋子，`Liberty` 可能会成为北美以外领先的陆地宽带运营者。\n\n\
  在整个过程中，`Gene` 和我像老朋友一样深入地讨论了这一切。`Gene` 说，他的儿子 `Mark` 在欧洲发现了一些非凡的机遇，但只不过是操之过急了。我开始对成为美国境外最大电缆运营商的最大股东股东这一想法产生了兴趣。为什么不在在更广阔的画布上复制\
  \ `TCI` 的成功呢？\n\n`Gene` 说机会已经开启：当形势看起来好转时，`Goldman Sachs` 曾为 `UPC` 提供了一笔 10 亿美元的桥接贷款，但现在他们动了疑虑，并考虑退出。\n\
  \n我们将接替 `Goldman Sachs` 的角色，成为金融提供人和投资者，并在此过程中成为 `UPC` 的最大债权人。\n\n在接下来的两年里，我们执行了一些我参与过的最复杂的交易，所有目标都是修复\
  \ `UnitedGlobal` 的欧洲子公司，并纠正那个因杠杆过高而偏离航道的航船。\n\n一旦通过 `Goldman` 的桥接贷款和我们在市场上以折价价格购买的公共债务，`Liberty\
  \ Media` 成为 `UPC` 最重要的债权人，我们转过身对 `Gene`，提议用这些头寸加上约 10 亿美元现金，换取 `UnitedGlobal` 75%\
  \ 的股份和控制权。\n\n这对我们双方来说都非常有意义。`Gene` 将拥有他所需的工具来迫使他的欧洲债权人重组 `UPC`——债权人在九个月后同意了这一点，用\
  \ 105 亿美元债务中的 70 亿美元，换取了其欧洲业务 35% 的股份。他最终将用 `UnitedGlobal` 的股票回购债券持有者的股份，使他再次拥有了欧洲\
  \ 100% 更加健康的业务。\n\n到此时，我们已经向 `Gene` 的公司投资了约 20 亿美元，但我们的工作还没有结束。我的终极目标一直是将我们拥有的一切整合成一家大型国际电缆公司。\n\
  \n因此，在 2004 年，我们拆分了 `Liberty Media International`，它拥有 `UnitedGlobal` 75% 的股份以及部分自己的电缆业务，随后合并了\
  \ `UnitedGlobal` 剩余的 25%。\n\n2005 年，这家新合并的上市公司以 `Liberty Global` 的身份运营，并迅速成为美国境外最大的宽带提供商之一，业务服务于\
  \ 19 个国家的超过 1500 万客户，触达 3000 万家庭。`Gene` 慷地将主席职位交给了我。\n\n***\n\n我们比任何时候需要的都是一个全能全球领导者——一个理解金融市场、资本配置、`M&A`\
  \ 动态、不断变化的技术以及消费者需求的人。还需要一个能够向不同文化和语言国家的投资者和当地媒体讲述故事的人。\n\n但我们不需要招聘公司来寻找下一任 CEO。我们已经有一个本质上在做这项工作的人：`UnitedGlobal`\
  \ 总裁兼首席运营官 `Mike Fries`。\n\n`Mike` 于 1990 年初加入 `Schneiders` 公司，当时就在 `Gene` 创立其国际电缆业务后；他\
  \ 27 岁时就是公司的第五名员工，根据所有说法，他算是一个联合创始人。`Mike` 是少数几个能够快速适应复杂运营、当地政治、新法规和外国税制的美国人之一。\n\
  \n相比之下，几家美国电缆运营商和电信公司在 20 世纪 80 年代和 90 年代涌入国际市场，结果在放弃了海外业务的复杂性后撤回了美国本土。\n\n`Mike`\
  \ 也有充分的拼搏。和他的同事一样，2001 年欧洲业务的挑战抹掉了了他帮助建立的这家公司的大部分股权。在我们 2001 年至 2003 年间共同完成那些让 `UnitedGlobal`\
  \ 获得第二次机会的交易时，他一直站在 `Gene` 身边，事实证明正确的。\n\n从一开始起，`Mike` 就是 `UnitedGlobal` 全球扩张的驱动力。正如\
  \ 1990 年东欧开始开放时一样，`Mike` 和 `Nimrod Kovacs` 飞上飞机前往匈牙利。按照 `Mike` 的说法，他们基本上是租了一辆车开到了每个大城市。在其中\
  \ 13 个城市里，他们说服了新资本主义经济体前共产主义市长将他们质量平平的电缆网络私有化，价格约为 1000 万美元。那次在东欧的首次行动最终以 7 亿欧元的价格卖给了\
  \ `Vodafone`。\n\n在启动 `Liberty Global` 后，`Mike` 以极度专注的目光推动了快速增长——推出人们真正想要的产品，如当地体育和简洁的\
  \ `Netflix` 风格界面。2012 年，`Horizon TV` 将平板电脑和智能手机变成了遥控器或额外的电视屏幕，甚至允许用户将个人内容投射到电视上。\n\
  \n\n\n\n\n当欧洲业务正在整合时，我们在拉丁美洲的业务在 2015 年通过花费 80 亿美元收购 Cable & Wireless Communications\
  \ 实现了巨大飞跃，这使得我们在智利和波多黎现有的业务基础上增加了二十个新市场。\n\n到 2017 年底，按照典型的 Liberty 风格，我们将拉丁美洲业务分出了一家新的上市公司——`Liberty\
  \ Latin America`，由首席执行官 Balan Nair 领导，他是 Liberty Global 的长期高管，也是一位精通技术的战略家，始终关注未来的发展。最近，我们对瑞士的\
  \ Sunrise 也采取了同样的操作。作为 Liberty Global 的一部分，Sunrise 的估值仅为 EBITDA 的 5.5 倍。而现在，在瑞士证券交易所，它的交易倍数为\
  \ 8 倍。这就是我们追求的增长空间——通过明智、高税务效率的拆分来释放价值，利用强劲的市场倍数，同时专注于股票回购。自 2017 年以来，Liberty Global\
  \ 已花费近 150 亿美元回购了超过 60% 的股份，提升了长期投资者的价值。\n\n***\n\nLiberty Global 今日仍是欧洲领先的宽带和移动提供商之一，在英国、爱尔兰、荷兰、比利时和斯洛伐克合并业务。如今，Liberty\
  \ Global 拥有 30,000 名员工，服务于 3000 万户千兆家庭、8000 万固定和移动连接，并创造了 220 亿美元的总收入。在他担任 CEO 的二十年里，Mike\
  \ 集到的护照章比大多数外交官都要多。\n\n他还是名副其实的摇滚明星——一个由科罗拉多州 CEO 组成的乐队的主唱，他们把电子表格换成了 Stratocaster\
  \ 吉他。当他不在舞台上或会议室里时，他正冲下山山、直升滑雪，或在我只能从远处观察的地方骑山地车。法律部门曾试图在他的合同中加入一条“禁止从事危及生命的爱好”的条款。Mike\
  \ 礼貌地拒绝了。在一次董事会活动中，最后一次看到他在我的浮空飞机后面滑水，笑得像个从未听过“风险管理”这几个字的人。\n\nMike 最令我印象深刻的是他对团队中每个人的对待。多年来，他组建了一支非凡的忠诚高管团队，他们代表了业内顶尖的运营、法律、财务、技术和并购人才。我从未见过他独揽功劳，总是分享光芒。他在自己家里通过晚餐指导新入的成员，并通过回馈家乡来保持谦逊。\n\
  \n他建立了一种创业文化，这种文化与 Bob Magness 和我共同拥 DNA 非常相似。一个名为 `Liberty Growth` 的部门拥有 30 亿美元的媒体、技术和基础设施投资，看起来非常像我们刚开始时的\
  \ `Liberty Media` 一模一样。\n\n如今，Liberty Global 的首要任务是将有线和无线结合。在过去的二十年里，收入从 50 亿美元（主要是视频服务）增长到\
  \ 200 亿美元以上，其中一半归于移动服务，其余大部分则归于宽带。消费者希望获得无缝连接——无论是在家里还是途中——而提供这种连接比以往任何时候都有价值。\n\
  \n陆地和移动资产的结合在欧洲日益强大，推动了规模效应和协同效应，这未来在美国市场也会如此。\n\n因此，在 Liberty Global 的阵营中，连接性是王，而不是内容，这就是为什么它继续达成交易，将有线和无线融合为单一的无缝服务。现在未来将将这两个领域融合为一个单一的虚拟管道，通过陆地或空中、电缆或蜂窝提供各种功能、服务和内容。这一切到达你手心的过程将完全不可见，它采取了哪条路线也将不再重要。\n\
  \n# 第 23 章 清理账目\n\n到 2004 年总统大选时，鲁珀特·默奇（Rupert Murdoch）和我已经非常熟悉。我们建立了良好的友谊，在许多领域既竞争又合作，并建立了做生意至关重要的相互信任。\n\
  \n这种信任可能会因为一个电话而受损。或者因为缺少一个电话，而这就是在下一轮中发生在鲁珀特和我身上的事情。\n\n2004 年 11 月 2 日周二晚上，我和妻子正在看共和党乔治·W·布什（George\
  \ W. Bush）和民主党约翰·克里（John Kerry）的选举报道，电话响了。来电的人让我大吃一惊。\n\n我们在悉尼的富富林（Merrill Lynch）联系人回给我打电话，是为了确认之前的电话，在那在电话中他告诉我，由于某种无法解释的原因，大量的\
  \ `News Corp.` 投票股（即鲁珀特及其家族拥有的那种股票）将在澳大利亚股市上市出售。正如他之前问的那样，我们是否有兴趣购买？\n\n`News Corp.`\
  \ 的业务资产的价值已经超过了鲁珀特在澳大利亚的持股，他决定将公司股票从澳大利亚交易所等同于 `S&P 500` 的指数中下市，并使其加入美国的 `Nasdaq`。\n\
  \n将 `News Corp.` 移至 `Nasdaq` 迫使澳大利亚指数基金出售其股票，包括“澳大利亚指数基金”（Australian Index Fund）的一大块，根据其规则，它必须在当天结束前拍卖掉持股。正如富富林的来电人告诉我的：“该基金对\
  \ `News Corp.` 的所有持仓都将被清算。这是规则。所以，如果你对购买其中一些感兴趣，请派有权且有资金的人去竞标。”\n\n`Liberty` 已经通过无投票股积累了\
  \ `News Corp.` 9% 的股份，在默奇家族（持有 27%）之后，是该公司最大的单一股东。这对于我们来说是一个罕见的机会，让我们可以在澳大利亚公开市场上通过收购投票股来拥有更大的股份。\n\
  \n甚至从 `Liberty Media` 第一次投资 `News Corp.` 股票开始，我就一直潜意识地知道，在未来的某个时刻，鲁珀特和我坐下来，他会用资产换我们的股份。\n\
  \n***\n\n`Liberty Media` 进入了 `News Corp.` 股票的公开拍卖，用 2100 万股无投票股加现金换取了 9% 的投票股。2004\
  \ 年，`Liberty` 将该比例增加到 17%，成为持有 30% 的默奇家族之后的第二大投票股东。\n\n对我来说，这是我们在公开市场上累积 `News Corp.`\
  \ 股票策略的延续，因为我真心认为 `News Corp.` 被低估了，并且信任其领导层。如果我们将来与鲁珀特进行交换，拥有投票股会更好。\n\n\n\n\n\
  尽管如此，媒体仍然对 `Liberty` 的意图充满了疯狂的推测，急切地怀疑我们正计划利用持有的第二大投票权进行收购。\n\n回首过去，我犯下了一个致命的错误，特别是在处理朋友关系时：我未能让自己的意图保持绝对清晰。当我们第一次听说该股票即将出售时，我没能给\
  \ `Rupert` 打电话，在新闻传出后我本应该给他打电话告诉他发生了什么。但我没有这样做。结果，关于我们要对他的公司采取行动的推测愈演愈烈。\n\n《独立报》（`The\
  \ Independent`）的一篇文章在开头句就将我描述为`达斯·维达`，并说我“将坦克停在 `Rupert Murdoch` 的草坪上，大炮直指 `Murdoch`\
  \ 自己的媒体帝国”。文章接着写道，“怀疑他是否正处于全方位收购 `News Corp.` 的第一阶段，这并不合理，而 `News Corp.` 是《泰晤士报》、`BSkyB`、`Fox\
  \ Television` 以及无数其他资产的所有者。”这一定让 `Rupert` 感到不安。在公开场合，他显得从容不迫。一名记者问他是否担心。\n\n“不，完全不担心。我认为这是对公司的一种背书。我是非常诚恳地说这句话。我对此毫无彻夜难眠。”\n\
  \n好几天之后，他没有回我的电话，我也无法责怪他。我们都在试图弄清楚发生了什么。\n\n一定是有人出了错，一个家族王朝竟然会允许这么多股票进入公开市场。我从他的人与我们的人的交谈中得知\
  \ `Rupert` 气了，但我也知道他对自己的人要生气得多。\n\n但在那时，一种经过几十年磨练的深层、原始的防御本能在我那位老友心中觉醒，我几乎无能为力去让他感到安心。`Rupert`\
  \ 随后采取了一些非常公开的防御措施，集结盟友，包括一位试图在公开市场上收购 `5`% 股票的沙特王子。\n\n然而，`Rupert` 从未冲着电话对我大大叫要求给出答案。他从没有在公开场合攻击我或\
  \ `Liberty`。他一向是个绅士，这对我生意往来来说非常重要。\n\n在我们持有大量股份的所有媒体公司中，包括 `Discovery`、`QVC` 和 `Starz`，`News\
  \ Corp.` 的股份是 `Liberty` 最有价值的资产。我并没有收购计划，甚至没有威胁要收购。我知道一旦我们拿到了那块股票，我们就能与 `Rupert`\
  \ 达成某种互利共赢的方案。作为董事长/CEO`，增加 `Liberty` 股票的价值是我的义务。\n\n几天后当我终于和 `Rupert` 谈上时，语气并不敌对，但不友好。他没有指责，没有责备我，也没有说我本应该告诉他。他只是说：好吧，事实就是如此，我们打算怎么办？\n\
  \n我告诉他，如果他想买下大股，我们本不会干涉，但我们在拍卖会上没有看到 `News Corp.` 的人，而且我们喜欢他的公司，所以我们买了。\n\n“`Rupert`，我们的关系一直很好。没必要进入恐慌模式。”\n\
  \n随后我在媒体上尽力消除任何关于敌意意图的传言，并表达对 `Rupert` 的支持。我们发表了声明，称 `News Corp.` 是“运营最好、战略定位最具垂直优势的公司”。\n\
  \n\n\n\n我能看到鲁珀特和他的儿子们所看到的景象——即电缆运营商和宽带将凭借宽带容量盖过如 `DirecTV` 等卫星电视服务的日子。我们只是认为这种末日比所有人想象的要遥远得多，而且我们可以在未来几年内将其变成一项相当不错的资产。我们确实做到了。\n\
  \n在前百事公司高管 `Michael White` 的带领下，`DirecTV` 的净用户数每年增长，到 2010 年，它已经签了 1900 万用户。`DirecTV`\
  \ 几乎要夺得了 `Comcast` 作为美国最大付费电视提供商的地位。这只需要一点耐心。Liberty 将“延迟满足”转变成了一种投资哲学。我们愿意在不确定的环境中进行可能需要多年才能成熟的投资。\n\
  \n2010 年 6 月，在 Liberty 正式接管 `DirecTV` 仅两年后，我下了主席，，并与另外两位 Liberty `DirecTV` 董事会成员一同辞职。我们宣布了一项股票交换计划，旨在将我对这家卫星巨头的投票控制权从\
  \ 24%降至仅 3%。\n\n这并非出于意愿，而是政府的要求——`FCC` 担心 `Liberty Global` 在波多黎的电缆业务与其当地的 `DirecTV`\
  \ 分公司之间存在潜在重叠。这是一个相当不足道的观点，而且这往往恰恰是 `FCC` 存在的意义，但事实如此。让我也说一句，愿这些那些同样未经选举的官僚得到保佑。他们的命令最终变成了一次幸运的挫折，可能为\
  \ Liberty Media 在 `DirecTV` 避免了数十亿美元的损失。\n\n在 `FCC` 将我们踢出 `DirecTV` 五年后，`AT&T` 在你\
  \ 015 年以 670 亿美元的价格收购了该服务（包括 1800 万美元的 `DirecTV` 债务），此举是其无线业务之外的多元化举措，将其用户与 `AT&T`\
  \ 的视频客户相结合，夺得了全美最大付费电视提供商的称号，服务了 2600 万客户。\n\n所谓的“剪线”（cord-cutting）是电缆运营商中一个令人困扰的新词汇，因为观众开始放弃有线电视而转向流媒体视频。正当这种冲击来临时，`AT&T`\
  \ 在 2015 年以 6700 万美元的股票和债务收购了 `DirecTV`，并让局面变得更糟：它提高了价格，取消了促销活动，并在 2016 年至 2020\
  \ 年间目睹了近 800 万用户离开。那些年付费电视整体萎缩了 2000 万，但 `DirecTV` 的跌幅最为剧烈——从第一名跌到第三，并在 2021 年初经历了\
  \ 155 亿美元的减值。时机选择不佳，执行更糟糕。\n\n现如今，鲁珀特和我仍然保持着联系，偶尔我们仍在为同一个目标而竞争。然而，我们始终以同样的礼节和尊重运营，这是我们默契协议的一部分：我们将为获胜而战，但不会以牺牲我们的原则或声誉为代价。\n\
  \n2013 年，当我们以 233 亿美元购买英国付费电视公司 `Virgin Media` 时，Liberty Global 杀入了与英国 `BSkyB` 的竞争场。三年后，我们看到了投资方程式赛车（Formula\
  \ One）的机会，该赛事由 `CVC Capital Partners` 领导的财团拥有，并由长期 CEO `Bernie Ecclestone` 运营。\n\
  \n我们将方程式赛车视为一个有趣的扭转机会。在审视该领域后，我们列了一份竞标战中可能对手的短名单，前三名分别是 `Apple`、一位卡塔尔商人以及我的老友鲁珀特·默多奇（Rupert\
  \ Murdoch）。\n\n2016 年底，我接到了鲁珀特的另一个电话，这次他告诉我：“约翰，我想你已经知道那孩子们（`Lachlan` 和 `James`）将要在这件事上与你竞争。我不知道他们为什么想要它，但我觉得你应该知道。”这是一个绅士风度的举。\n\
  \n最终，Liberty 愿意支付更高的价格，在 2017 年 1 月以 44 亿美元的价格获得了方程式赛车 35.5%的股权，击败了 `News Corp.`，使整个企业的估值达到约\
  \ 80 亿美元。我们请了鲁珀特最信赖的一位高管担任方程式赛车的新主席，即 `21st Century Fox` 前执行副主席 `Chase Carey`。\n\
  \n# 第 2 章：所有者说明书\n\n对于任何投资者来说，最关键的问题是控制权，或者缺乏控制权。你需要多大的股份才能获得控制？\n\n在我的职业生涯中，我努力培养学习的好奇心。但尽管我积累了这么多知识，有些事情是我永远不会做的。我明白，无论你多么聪明，总会有比你更擅执行想法的人。如果你足够聪明，就会礼貌地退开，让他们去做。\n\
  \n\n\n\n\n尽管迪勒（Diller）在创建第四大广播网络方面取得了惊人的成就，但他意识到，无论自己表现得如何，他永远无法真正控制福克斯广播。它是新闻集团（News\
  \ Corp.）的一部分，鲁珀特（Rupert）已经明确表示，他的儿子拉克兰（Lachlan）和詹姆斯（James）将继承王位。（尽管这一一天已经徘了三十年，而鲁珀特仍在人世。）\n\
  \n因此，迪勒于 1992 年辞去了福克斯。他的下一个目标是担任购物频道 QVC 的首席执行官，他希望以此作为实现更大野负的平台。真的是宏大的野负：1994 年，他让\
  \ QVC 竞购了 CBS，并几乎成功。\n\n但在 CBS 和 QVC 董事会投票批准巴里（Barry）策划的合并前不到 24 小时，美国有线（Comcast）的所有者拉尔夫·罗伯茨（Ralph\
  \ Roberts）和布莱恩·罗伯茨（Brian Roberts）以 22 亿美元的报价收购 QVC，挫败了巴里的报价。他不久后离开，并对新起的互联网和万维网的互动购物前景产生了着迷。\n\
  \n巴里离开 QVC 后，我们保持了联系，因为他花越来越多的时间待在新游艇上，在地平线上寻找“下一个大趋势”。\n\n在他寻找期间，我们经常畅谈我们对帆船的共同爱好，乐此许多。我刚刚修复完我的船只\
  \ `Ragtime`，现在我正考虑建造一艘没有帆的新船。后来，我们将它命名为 `Liberty`（自由号），部分原因是因为我是少数几个让我感到摆脱了义务和责任枷锁的地方之一。\n\
  \n在我脑海那旋转旋转的飞轮中，我开始琢磨出一个主意。在电视购物网络（Home Shopping Network），创始人罗伊·斯尔（Roy Speer）即将离开，我们需要一位具有零售和电视经验的人来推动这项业务，该业务每年收入超过\
  \ 1 亿美元。\n\n我们已经得出结论，Liberty 的 CEO 罗伯特·（多）·本内特（Dob Bennett）和我都不是零售商人。巴里是完美的人选——考虑到他在节目制作方面的敏锐，以及他最近运营竞争对手\
  \ QVC 的经历，而 Liberty 也拥有 QVC 的股份。\n\n更重要的是，电视购物网络拥有一批 UHF 本地广播站，这些站最初是为了增加 HSN 收视率而购买的，但\
  \ Liberty Media 作为 HSN 的所有者，根据联邦交叉所有规定禁止拥有电台集团。因此，HSN 分拆了这些电台，并将新业务命名为银王通讯（Silver\
  \ King Communications）。\n\n我突然想到：还有谁比节目天才巴里·迪勒更适合经营这个新机构呢？因此，在 1994 年中，我向他介绍了了这个全国广播电台网络，它由十几个\
  \ UHF 电台组成，涵盖了纽约、芝加哥和洛杉矶等大大都市市场美国约 20%的地区。\n\n我们讨论了让他与银王合作创建一个网络。我告诉他，甚至可能将电视购物网络与其规模小得多的分拆公司合并，创建一个更具竞争力的资产负债表，用于收购和增长。\n\
  \n当我询问巴里是否有兴趣担任 HSN 和银王的共同负责人，承担更大的角色时，他停顿了。。他的回答直击核心，这是巴里在做了几十年员工后意识到的真相：拥有微不足道的股权，且几乎没有真正的正式控制权。\n\
  \n“我一直在为别人建立事业，”巴里真诚地说，指的是帕拉梅森（Paramount）、ABC 和福克斯，“而我最终却落了冷落。我从未‘拥有’过任何东西，我不想进入另一个因为我不是所有者而无法做决策的角色。”\n\
  \n他的话触动了我，因为我职业生涯的半部分时间都在 TCI 为别人工作。因此，我给了他一个千生难得的报价。“好了，巴里，办法是这样的：如果你同意为我合并后的 HSN/SK\
  \ 主席，你就拥有了终身代理权。只要你想做下去，你就有我们的选票，我们不会干涉。”\n\n尽管巴里拥有的投票权略低于 4%，但我会书面向他提供终身控制权。由于他不是所有者，我将向他提供终身控制权，包括投票股和普通股。这是一个非凡的安排，我以前从未考虑过。现在，巴里将拥有合并公司约\
  \ 70%的投票权，直到他离职或去世。\n\n巴里同意成为银王以及电视购物网络的董事和首席执行官，后者在 1996 年合并。巴里继续拥有 Liberty 约 20%的股份。\n\
