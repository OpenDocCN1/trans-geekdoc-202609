  \ County）购买了`I-25`西侧剩下的土地作为开放空间。\n\n\n\n\n我们回去参观了几处庄园，其中包括一座名为 `Humewood Castle`\
  \ 的真正的爱尔兰城堡，这是一座建成 19 世纪 60 年代的花岗岩堡垒，带有角楼和塔楼。我感到非常畏畏——它规模巨大，而且状况非常糟糕。但父亲是建筑师的 Leslie\
  \ 对承担这项历史修复项目充满热情。\n\n售价（1000 万美元）比七年前 2006 年爱尔兰经济巅峰时期下降了约 60%。随着 2008 年泡沫破灭，将其开发为豪华酒店和高尔夫球场的计划被取消，导致庄园开发商破产。该物业破产并归爱尔兰政府所有，拥有一个巨大的花园、马术四角场农场复合体——这是一笔极卖。\n\
  \n在两年里，我们费尽心思地修复并布置了这颗老宝石，在爱尔兰需要工作的时期，现场曾一度聚集超过 320 人。在此过程中，我们结识了更多优秀的人，度过了人生中最美好的时光——并深爱爱上了爱尔兰！\n\
  \n当两位自愿担任我们项目导师的人成为在爱尔兰购买、建造和运营酒店的伙伴时，修复工作变成了一次商业机会——`Paul Higgins` 和 `John Lally`——如今\
  \ `MLK Hotel Collection` 拥有多达十四处伟大的物业。这种情感随后促使我们购买了基尔郡的一座历史悠久的马场 `Ballylinch`，以及从基尔代郡破产中收购的如画般美丽的\
  \ `Castlemartin` 庄园，那里拥有自己的育种场和牛群——这两个地方都通过 Leslie 的魔幻触手实现了现代化。我们成功留住了著名马术训练师 `John\
  \ O’Conner` 担任我们`纯血马`活动的总经理，现在我们在赛场和育种场方面拥有欧洲最顶级的运营模式之一。\n\n我们热爱爱尔兰和爱尔兰人，特别是重新激发对该地历史的兴趣。这是一个能够让许多人延续历史的场所，并希望再持续几百年。\n\
  \n***\n\n## 环境与可持续性\n\n我深信保护环境，并在我们拥有的土地上对耕作、牧业和木材业追求`可持续`的方法。但我并没有完全认同环境、社会和治理（`ESG`）运动。\n\
  \n大多数“净零”承诺都是空洞的，源于利益相关者资本主义的缺陷理念——在这种理念下，公司似乎要对除所有者以外的所有人负责。\n\n我们所赞美的环境需要进行这样的管理：使其具有生产力、可持续性，并随着时间的推移得到增强。在我们缅因州拥有的林地上，风力发电场租赁山顶土地，以换取销售收入的比例作为回报。\n\
  \n并非每一棵树都是神圣的。我也将木材视为一种对人类有益的“作物”，我们可以将其作为一种可持续、长期农业的形式进行重新种植。在那些采伐木材的森林里，我们重新种植并肥沃土壤——增加植物多样性，并为野生动物提供更强的栖息地。这些不是松树林；我们森林中的硬木面积正在增加，而非萎缩。\n\
  \n一旦你购买土地是为了保护它，下一个决定就是：它的最佳用途是什么？仅仅看着一些漂亮东西是不够的。`Ted Turner` 和我经常争论这一点。\n\nTed\
  \ 和我都有经营中的牧场，但在土地所有权观念上，我不像 `Ted` 那样具有前殖时代。Ted 将野牛带回他的牧场，并与专家努力引回受威胁和濒危物种，甚至移除了他位于波兹曼的\
  \ `Flying D Ranch` 上任何人类居住的迹象。\n\n我正在尝试如何提高农场和牧场的土地生产力，以实现多种目的，包括可持续性。\n\n对我拥有的所有财产来说，一个大目标是从大气中隔离碳。这起初看起来可能很奇怪，因为一个人的土地大部分是养马牛的牧场。根据联合国的，牲畜贡献了约\
  \ 15% 的温室气体。\n\n我想指出，牧场和农场在帮助全球 80 亿饥饿人口提供食物方面做得很好。解决方案不能是全有或无。在生命的广阔方程中，地球应该维持并支持人类的生活质量，而我们足够聪明可以使其可持续甚至对其进行改进。\n\
  \n在我们西部的 `Silver Spur Ranches`，我们不断努力确保可持续放牧，保护健康的本土草类，并防止侵蚀。我们正试图优化生产力*以及*可持续性，这在一个以尘土景观、滚滚球和鼠尾草闻名的国家部分并不总是那么容易。\n\
  \n我们的牧场经理 `Thad York` 负责确保这一切发生。我们正在一个一个解决这些环境挑战。在我们位于科拉多州东南部五万五英亩的 `Red Top ranch`\
  \ 上，我们实验了卫星和高科技项圈，其原理非常像宠物主使用的“无形围栏”系统。当群中的动物靠近牧主创建的虚拟围栏边界时，它们会收到听觉警告，必要时会有微小的刺痛电，而牧主的坐标锁定在空间上方十二英里的\
  \ `GPS` 卫星上。\n\n这个想法是，你可以轮放牧区域，而不需要驱赶牛或使用围栏。在我与`自然保护协会`（我曾是董事会成员）以及其他小组的工作中，目标是帮助研究人员更好地理解为什么会在放牧地点做出那样选择。马对放食的对象也有选择性。\n\
  \n## 创新土地管理\n\n因此，在爱尔兰，我们每年两次将密集的羊群带入牧场，它们会把草吃光根，这有助于本土草的生长。否则，只有不理想、有毒或入侵性的杂草会占据主导地位，而没有自然草的竞争。\n\
  \n我们最兴奋的是多年生谷物的前景。我们的家族土地基金支持 `Land Institute` 的突破性工作，这是一个在多年生农业领域日益受到关注的非盈利组织。与一年作物不同，多年植物不需要每年重新播种、耕地或使用除草剂，这反防止了土壤侵蚀，改善了表土结构，并让碳封存在未受扰的土壤下方。\n\
  \n多年生谷物从大气中吸收碳，并产生根进入土壤深处的有机化合物。经过四十年的测试，Land Institute 最近推出了它的第一种商业多年生谷物，商标名为 `Kernza`，这是一种小麦草。他们正将同样的育种和研究应用于多年生水稻，这种水稻现在一次种植即可四年内获得八次收获。\n\
  \n想象这样一个世界，目前占全球耕地 70% 以上的谷物可以转变为再生模式，在那里没有人需要种植、耕地或喷毒药。想象一下如果我们能让农业变得可持续、可再生的，并且对环境的影响微乎其微，全球范围内能做什么？除了我们的投资，我们还加入了志同道合的投资者，他们分享我们的愿景和承诺。\n\
  \n\n\n\n\nCraig 是电信界的传奇人物，他在斯坦福大学读大四期间就闯入了电缆行业，在他父亲去世后，接手了位于华盛顿州中央特利亚亚（Centralia）的一家小型家族的电缆公司。\n\
  \nCraig 每天早上早餐像吃玉米片一样吞下风险，通过负债将这家只有几千名订阅者的微型公司扩张为麦考电缆电视（McCaw Cablevision），并在 20\
  \ 世纪 70 年代成为美国十大电缆运营商之一。\n\n到了 80 年代初，当联邦通信委员会（FCC）授予首批手机公司许可证时，Craig 尽可能地购买许可证。让分析师和竞争对手都感到恐惧的是，Craig\
  \ 背负了令人胆寒的债务水平。\n\n他的自信得到了回报。在“婴儿电话公司”（Baby Bells）出现之前，Craig 就抢购了足够的频谱，在新型手机的新市场中击败了他们。Cellular\
  \ One 被称为第一家真正意义上的全国手机公司，击败了电话行业的巨头们。\n\n1989 年，Craig 邀请我加入 Cellular One 的董事会。Craig\
  \ 和他的兄弟们最终以 115 亿美元的价格将 McCaw Cellular 卖给了 AT&T。该公司随后更名为 AT&T Wireless，并一度成为当时最大的无线运营商。\n\
  \n大约那时，Craig 和我都是自然保护会（Nature Conservancy）的董事，我们与该会的主席大卫·麦考马里克（David McCormick）计划了一次前往英国不列颠伦比亚省的小型考察，实地考察一片被称为“大熊雨林”（Great\
  \ Bear Rainforest）的 1800 万英亩土地。它沿着加拿大太平洋岸延伸 250 英里，包括离岸岛屿。\n\n当时的自然保护会参与了一项交易，旨在帮助解决涉及当地部落、BC\
  \ 省政府、伐木公司和其他组织的长期法律纠纷。\n\nCraig 和我是核心捐赠者，并为一个信托基金筹集了 1 亿资金，该基金如今为原住民提供教育和管理计划。\n\
  \n我们乘坐 Craig 那艘 80 英尺长的船沿着太平洋岸向上进，此前我们曾乘坐水上飞机勘察了那片土地翠绿的地形。沿途中，我们会在船上停下，与当地住民村庄的领袖会面。\n\
  \n有一天，Craig 和我划了两只皮划艇去探索沿海内陆，逆流穿过安静的小溪。当我们越越远，鲑鱼在我们身边游动，我沉浸在宁静的环境中——直到一声巨大的低沉噪音打破了平静。\n\
  \n听起来像是外挂机的声音，我困惑地看向 Craig：“这里怎么会有机船？”\n\n声音停止了。我们僵住了。然后，当我们绕过弯道时，来源清晰了：不是引擎，而是一只十英高的母熊，在五十码外的树桩后咆哮着。“稳住，”我紧握船桨低声说。我们一言不发，顺着水流游回去，尽可能拉开与她的距离。\n\
  \n几分钟后，我们开始疯狂地划水，并因侥幸逃离了一场 `grisly`（可怕）之死而带着紧张的能量大笑。\n\nCraig 和我与董事会其他成员合作过几个项目，但没有一个比大熊雨林项目规模更大的。最终，在经历了十多年的谈判后，自然保护会、英国不列颠伦比亚省政府、伐木公司和二十多个第一民族部落达成了协议，解决了诉讼，建立了教育基金，并保护了大部分土地免受砍伐。对我来说，那里仍然地球上最美丽的地方之一。\n\
  \n自然保护会、英国不列颠伦比亚省政府、伐木公司和二十多个第一民族部落达成协议，解决了诉讼，建立了教育基金，并保护了大部分土地免受砍伐。\n\n# 第 3 章：生存或死亡\n\
  \n我们似乎正处于一个慢动作时刻。得益于我和许多人帮助实现的许多进步，不可逆转的变革正在席卷媒体：数字、宽带、Wi-Fi、流媒体服务、5G，还有社交网络。在这些力量下会发生什么？像恒星一样，企业也有周期。有些公司因为年龄而淘汰。更大、更敏捷的玩家会通过改变来适应。正如他们一如既常那样。\n\
  \n20 世纪中期开创该行业的鲍勃·马格斯（Bob Magness）等早期 `电缆牛仔` 从未想象过，他们最初设计用于增强电视的系统有一天会成为科技巨头的基础。尽管关于传统订阅电缆电视衰落的报道层出牛毛，但电缆宽带已成为行业主要的增长引擎。这种转型从未关乎电缆与流媒体之争——而是关于技术和消费者需求的持续演进。\n\
  \n到 2024 年，超过 90% 的美国家庭可以使用固定宽带服务，下载速度至少为 100 Mbps，上传速度为 20 Mbps，实现了从远程办公到高清流媒体的一切功能。在过去的三十里，宽带提供商投入了近\
  \ 2 万亿美元来建设和维护这些网络，本质上是在资助当今数字巨头免费运行的基础设施。\n\n电缆公司，包括我投资的——`Charter`、`Liberty Global`\
  \ 和 `Liberty Latin America`——曾被纯粹地视为电视提供商，现在它们已重新定位为连接性领域的领导者，将互联网、Wi-Fi、流媒体订阅甚至移动无线服务捆绑。电缆运营商现在是美国增长最快的移动供应商之一，他们通过从主要运营商租赁网络接入并将其与宽带和电视捆绑提供电话服务——而无需建造一个基站或在基础设施上花费数十亿美元。\n\
  \n\n\n\n很少有行业像我们这样在基因中拥有如此强大的弹性，这使得我们在每一个转折点都能利用新技术。从最初的模拟电视频道开始，同轴电缆通过数字传输技术等开创性飞跃迅速演进，使电缆运营商能够提供数百个电视频道。在\
  \ 20 世纪 80 年代卫星技术出现时，我们利用了它，在几乎任何地方收发电视信号，迅速扩大了我们的市场范围。到了 20 世纪 90 年代，当网页浏览感觉像在看漆干涸时，电缆的高速调制解调器出现了出现，将互联网从爬行状态变成了冲刺状态。\n\
  \n电缆行业起步于，走向主导，而如今正面临一个转折点，因为消费者偏好的转变再次颠覆了整个行业。颠覆者反被颠覆了。这种循环并非孤例；所有行业的企业都经历着类似的以增长、成熟、颠覆和适应为特征的轨迹。\n\
  \n“不适应就死亡”不仅仅是一个朗上口的口号——这是一个残酷的现实。进化的公司会繁荣；而停留在过去的公司则会被遗弃。电缆行业从电视转向宽带、电话和无线连接的转型能力，恰恰证明了行业不仅能在颠覆中生存，还能顺着颠覆浪潮寻找新机会。适应能力是该行业持久成功的支柱。\n\
  \n***\n\n根据尼尔森（Nielsen）的数据，电缆和广播仍占电视收视时间的 45%%左右，但两者都在不可否认地下降。五十年前，《全家福》（*All in\
  \ the Family*）在 CBS 频道每周吸引 5000 万观众。而今天，《追踪者》（*Tracker*）仅有 700 万观众就受欢迎。观众并没有消失——他们分散到了电缆、流媒体和数字平台，而这些平台在当时几乎不存在。\n\
  \n付费电视订阅（传统电缆、电信或卫星电视——排除虚拟 MVPD）已大幅下降——从 2010 年 87% 的高覆盖率下降到目前仅占美国家庭的 35%。到 2024\
  \ 年底，仅剩 4600 万用户，较 9900 万的峰值相比下降了惊人的 54%。这意味着流失了 5300 万家庭，假设每月损失收入为 30 美元，每年损失收入超过\
  \ 1900 亿美元。与此同时，基础设施成本并未没有。\n\n广告随着观众迁移而迁移，美国数字广告在十年内增长了五倍，从 2014 年的不足 500 亿美元增长到\
  \ 2024 年的 2590 亿美元。相反，广播电视和电缆电视的广告下降了 20%。这种下降比看起来还要糟糕。在 2025 年，零售媒体（Amazon、Walmart.com\
  \ 等上的数字广告）预计将超过电视广告支出，因为广告商正将预算转向消费者购买物品的驱动驱动平台。\n\n正如所讨论的，电缆电视套餐最大的缺陷之一，是直播体育赛事价格的飙升——NFL、NBA\
  \ 和 MLB。像迪士尼（Disney）这样的节目制作商将 ESPN（历史上最昂贵出几个数量级的网络）捆绑在他们的批发包中。\n\n多年来，电缆行业一直将这些上升的成本转嫁给基础套餐客户，但当更便宜、无需合约的流媒体服务出现时，订阅用户逃失了。曾经辉煌一面的\
  \ ESPN 在巅峰时期拥有 1 亿电缆用户，现在仅剩 6600 万，且仍在下降。\n\n***\n\n最初，流媒体平台运营是基于以下信念的……（此处省略后续内容，按逻辑继续排版）\n\
  \n\n\n这种升级没有停止的迹象。2021 年，美国橄榄球联盟（NFL）锁定了一为期 11 年、价值 1100 亿美元的媒体交易——几乎是之前协议的两倍。仅\
  \ ESPN 一，就承诺到 2032 年每年投入 27 亿美元，增长了 42%。2024 年，ESPN 的母公司迪士尼（Disney）预计将在体育节目上花费近\
  \ 110 亿美元，长期承诺超过 5700 亿美元。\n\n察觉到转折点的到来，ESPN 宣布了计划在 2025 年推出一项独立的流媒体服务。此举将加速传统有线电视的衰落，并预示着一个根本性的转变——优质直播体育将日益绕过有线电视，直接迎合更年轻、精通流媒体的观众。而当那些目前正处于历史低位、且苦苦挣扎的当地广播商失去体育赛事时，他们将更难吸引观众了。\n\
  \n即使作为竞争对手，我也尊重 Dish 的查理·埃尔根（Charlie Ergen），他在体育成本上的坚定立场——在 2019 年放弃了辛克莱（Sinclair）的区域体育网络（RSN），在\
  \ 2022 年的 ESPN 停播事件中与迪士尼抗争，并拒绝让体育成为每个家庭必须缴纳的税收。\n\n如果你认为现在的体育版权很昂贵，那等一下吧——随着科技巨头的强势介入，下场竞标大战将更加残酷。直播体育仍然是电视预约式观看的最后堡垒，在\
  \ 2023 年排名前一百的节目中占据了九六席。科技巨头将其视为一张金门票。\n\n### 科技巨头的崛起\n\n亚马逊在 2021 年定下了基调，通过一份为期\
  \ 11 年、每年 10 亿美元的协议独家获得了周四橄榄球赛。Apple TV+紧随其后，在 2022 年拿下了周五晚的 MLB（美国大联盟）比赛，以及一份为期\
  \ 10 年、价值 25 亿美元的 MLS（美国职业足球）合同。到 2024 年，Peacock 已流媒体独家 NFL 季后赛比赛，而亚马逊收购了最大的区域体育网络运营商钻石体育的股份，使其获得了当地\
  \ NBA、MLB 和 NHL 比赛的直接渠道。\n\n随后，游戏规则改变者出现了：亚马逊、NBC（康姆斯特）和 ESPN（迪士尼）以一份价值 7600 亿美元、为期\
  \ 11 年的 NBA 版权协议打破了记录。亚马逊锁定了每年 18 亿美元，而长期的 NBA 合作伙伴特纳体育（Turner Sports）则被价格挤出市场。结果是？观众只能手忙脚乱地寻找哪里看他们的球队。\n\
  \n如果科技巨头接管了主要的体育赛事，可能会掏空广播电视。直播比赛是留住观众和广告资金的最后防线。没有了这些，观众流失将加速，广告收入将崩塌，当地电台将衰落为小众地位，除了新闻和重播外空无一物。\n\
  \n### 基础设施的压力\n\n现在考虑直播未来超级碗的压力：5000 万个*个人、同时*的 HD 和 4K 流媒体，这给运营商带来了巨大的负担，而他们并没有从需求的激增中获得任何额外收入。随着直播体育和超高清流媒体的持续增长，那些一直坐享其成的科技巨头将成为最大声、要求以更低成本扩大带宽的人。但如果我们想要一个快速、普及且负担得起的互联网，供应商难道不应该有权向那些消耗最多带宽的人收费吗？\n\
  \n一个潜在的解决方案：允许互联网服务提供商对亚马逊和 YouTube 等流媒体巨头收取高峰时段优质带宽访问的税费或费用，以确保直播活动的流畅、无延迟传输。针对高优先级流量的分级系统可以减少拥堵导致的网络变慢，提高可靠性——同时让系统对所有参与者更加公平。\n\
  \n### 监管格局\n\n科技巨头的迅速崛起不仅是创新的结果，也是监管红利的结果。当 2015 年网络中立法案通过时，它被誉为保持互联网开放且不受干扰的里程碑式政策。但实际上，这是一个在寻找问题的解决方案：除了一次涉及\
  \ BitTorrent（一个经常被用于盗版内容的平台）的短暂事件外，有线电视公司从未真正限制过内容。\n\n立法者曾收到警告，有线提供商可能会限制或阻止内容，优先考虑自己的服务而非竞争对手。科技巨头——如谷歌、Facebook\
  \ 等公司——曾积极游说这些规则，将其视为防止企业贪婪的必要保护。当联邦通信委员会（FCC）将网络中立归为《1934 年通信法》第 II 条下的电信服务时，支持者将其视为消费者的胜利。但在\
  \ 2017 年，共和党 FCC 主席阿吉·派（Ajit Pai）废除了该规则，当时批评者预言了灾难——速度变慢、内容封锁。派将这些声音斥为“末日预言”。他是正确的。美国固定带宽速度在五年内翻了一倍达到\
  \ 200 Mbps 以上，而在监管消失后，网络投资大增。\n\n真正的问题从未是内容限制，而是带宽接入的限制，特别是在农村地区。但这项政策禁止了基于容量的定价，迫使\
  \ Charter 和康姆斯特等互联网提供商承担了科技巨头的巨大流量成本——却没有得到补偿。到 2024 年，视频和音频占了所有流量的 70%以上，仅 Netflix\
  \ 一家就占了 15%。\n\n### 未来展望\n\n请考虑，截至 2025 年初，YouTube TV 拥有超过 900 万订阅用户，成为第四大付费电视提供商，并有望超越康姆斯特等巨头。与普通的\
  \ YouTube 不同，它不提供创作内容——它是一个提供 100 多个传统有线频道的直播服务。\n\n多年来，有线运营商一直受到层层监管的约束——《1984\
  \ 年有线电视法》、《1992 年有线电视消费者保护法》、《1996 年电信法》以及 2015 年的网络中立。与此同时，科技巨头在华盛顿几乎无损地穿行，避开了实质性限制并巩固了其统治地位。\n\
  \n整整十年后（足以让科技巨头统治市场），在 2025 年 1 月，一家联邦上诉法院为互联网服务提供商赢得了胜利，推翻了网络中立规则，裁定 FCC 在 2023\
  \ 年试图恢复奥巴时期的政策时越越了权限。这简直是关门猫医。\n\n* * 到目前为止，大型传统节目公司正在结联盟并捆绑服务以应对用户流失——讽刺的是模仿了多年前有线运营商开创的同样的捆绑策略。\n\
  \n\n\n\n## 有线电视运营商与流媒体演变\n\n有线运营商正在找回流失的客户，这些客户意识到零散订阅各项流媒体服务既方便又昂贵。`Charter` 现在是一家视频零售商，通过其\
  \ `Spectrum` 品牌提供将有线电视与流媒体服务相结合的创新方案；`Spectrum TV Select Signature` 包含 150 个频道，并免费赠送\
  \ `Disney+ Basic` 和带广告的 `HBO Max`。\n\n`Comcast` 提供了 `NBCUniversal 的 Peacock Premium`（带广告）、`Netflix\
  \ Basic`（带广告）和 `Apple TV+` 的组合包，并且最近还在这份每月 70 美元的 `Sports & News TV` 套餐中推出了极其丰富的选择：包括\
  \ `Peacock Premium`、五十个频道、一个云端 DVR 以及 100 多个免费的带广告支持流媒体频道。\n\n`Charter` 和其他有线运营商也在通过新功能和技术进步对其连接服务进行创新。例如，如果你是拥有高速宽的\
  \ `Charter` 客户，当你走进家时，你的移动设备会无缝切换到 `Wi-Fi`。这种自动转换显著提高了连接速度和质量，并让 `Charter` 避免了 `Verizon`\
  \ 蜂窝平台的费用。\n\n截至 2024 年，美国估计有 200 多种流媒体服务，满足各种偏好。传统的电视节目制作人在新的流媒体应用上提供其线性内容。`YouTube\
  \ TV`、`Hulu + Live TV` 和 `Sling` 等新型流媒体服务通过互联网提供直播电视频道，模仿传统的有线套餐。此外，一种新型免费广告支持流媒体电视（FAST）频道已经出现，如\
  \ `Plex`、`Tubi` 和 `Haystack`，它们就像旧的有线网络但不需要订阅。\n\n目前，`Netflix` 占据主地位，`Apple` 和 `Disney`\
  \ 随其后，而 `Warner Bros. Discovery 的 HBO Max`、`Apple` 和 `Paramount+` 则在竞争另一个竞争者。拥有\
  \ `NBC`、有线电视和主题公园的 `Comcast` 战略性地定位了其 `Peacock` 服务，并使其免受损失影响。\n\n未来，成功的内容公司必须具备全球规模，但将不再有所谓的“大众媒体”。内容世界正碎片化到无法辨认。\n\
  \n质量、故事和角色仍然比任何事情都重要，但容量是无限的，消费者的选择多到令人崩溃。\n\n技术将继续塑造观众体验。有线运营商曾受到流媒体的冲击，但内容创作者将面临来自\
  \ `AI` 的类似冲击。曾经统一数百万人的事物现在发生在个人屏幕上，每个屏幕都从海大的 AI 驱动数据库中获取数据，旨在精准提供个人想看的内容。\n\n然而，我对这个行业永不停歇的重塑感到充满活力。保持敏锐、预判变化并适应的公司将生存下来——因为媒体本质上是一个活的有机体。它进化或死亡。这种适应、在混乱中繁荣的本能，正是最初吸引我进入行业的原因。\n\
  \n# 结语\n\n你可能会对某事、任何事长时间抓得太紧。一项投资、整个公司、一个合作伙伴，甚至一个头衔。任何活到八十岁的人都知道，总有一个放手的时候。\n\n\
  我想起了我的老朋友（也是据称的宿敌）`Sumner Redstone`，他是一位远见的商人，曾统治着一个主导娱乐世界的节目帝国（`Viacom`）。尽管他的生活充满了商业成就，但他在\
  \ 2020 年 97 岁时惨淡收场，被背叛、法律斗争和公开的家族纷争所破坏。\n\n这是由 `Sumner Redstone` 造成的。`Sumner Redstone`\
  \ 在 1999 年将 `Viacom` 与 `CBS` 合并，市值达 800 亿美元。到 `Sumner Redstone` 在 2020 年去世时，价值已下降到约\
  \ 160 亿美元。`Sumner Redstone` 在 2023 年将控制权交给女儿 `Shari`，此举引发了关于家族信托的法律争议，并凸显了王朝继承的复杂性。`Shari`\
  \ 在 2024 年以 80 亿美元的价格促成了 `Paramount Global` 的交易。`Shari` 目前正试图出售 `Paramount Global`。`Sumner\
  \ Redstone` 的故事是一个严正的提醒。在 `Sumner Redstone` 2020 年去世后，价值缩水了 50%。\n\n在商业和生活中，正如老话所说，熟悉者生轻蔑，这通常是真的。但在与同一人交手多年后，我发现熟悉也会产生出乎意料的事物：友谊。\n\
  \n多年来，界限变得模糊了，某些对手——并非全部——变成了信赖的盟友。我们仍然会争论和斗争，但我们经历了太多的市场崩溃、公司倒闭和产品发布，以至于仅仅彼此视为对手。相反，我们被共同经历的历史和相互尊重联系在一起。\n\
  \n\n\n\n\n# 独立与传承\n\n我的孩子们对生意从未产生兴趣，我也从未真正尝试过强加于他们，尽管我在几次场合中测试过这一点，但他们都礼貌地拒绝了。某些经营业务的父母可能会因此感到失望，但我认为我的孩子应该拥有像我当年那样的独立性。没有人告诉我必须在农场工作，或者去我父亲工作过的地方任职。强迫你的孩子继承你的事业是令人作呕的；他们永远不会原谅夺走他们自由的人。\n\
  \n我可以给孩子们提供选择和机会，但是否接受取决于他们。我的儿子埃文是一位自力更生成功的商人，他已经在 `Liberty Media` 董事会担任了多年，还有\
  \ QVC 和 `SiriusXM` 的董事会，这是他与我合作最接近的一次。我曾目睹了建立 `TCI` 所花费的时间和压力、运营的复杂性，以及它至今仍对我产生的影响。\n\
  \n莱斯莉和我在一辈子的育儿和牺牲中所总结的经验就是：我们的孩子是独立的独立的个体，拥有自己的生活、兴趣和经历，事实就是如此。我们一如既往爱着他们。\n\n##\
  \ 教育的价值\n\n回首过去，让你感到满足的是你曾是他人资金的良好管理者，并且诚实、正直地对待他人。我的母亲，特别是我的父亲，他来自宾夕法尼亚州的一个奶农场，他会说传承是教育。他和他的四个兄弟姐妹都获得了大学学位，有些人还获得了\
  \ `PhD`。我的父母从未拥有过大钱，但他们留给我的更有价值：对学习的热爱，以及教育可以改变生活的证明。对他们来说，成功不是用金钱衡量的——而是用好奇心、努力和成长衡量。这就是我在慈善事业中所传承的遗产，试图给他人同样的机会。\n\
  \n如今，我的孩子们也有了自己的孩子，我尊重他们对独立的需求，并在他们寻求时提供指导和支持。我们努力传递同样的良好价值观，而且我们幸运地给了他们比金钱更多的东西——我们给了他们选择。那是真正的自由。\n\
  \n## 目前的角色\n\n我目前担任三家与 Liberty 相关的公司主席：`Liberty Global`（自 2005 年 6 月起），全球最大的国际电缆公司；`Liberty\
  \ Broadband`（自 2014 年 11 月起），拥有美国最大的电缆运营商 `Charter Communications` 的 26% 股份；以及 `Liberty\
  \ Media`（自 1991 年 3 月起，不包括与 `TCI` 和 `AT&T` 的合并），其主要资产是 `Formula One`。2024 年 11 月，`Charter`\
  \ 同意购买 `Liberty Broadband`，交易预计于 2026 年完成。但总的来说，我放弃的头衔和责任比过去几年承担的多。\n\n我经常自问：我作为\
  \ `CEO` 和大投资者的历史是否产生了更大的影响力，并导致今天的决策被毫无质疑地执行？我在做决策时挥下的斧头是否太重了？我投入的时间足够吗？每一位董事成员每天都应该问自己：“我有多大的意愿去学习，实时了解我需要的信息以便做一个良好的决策者，即使在我没有动力时也是如此？”\n\
  \n## 控制权的交接\n\n事实是，我在公司以及家中的角色一直在发生变化，我发现自己八十多岁比任何时候都更能适应。我比什么都怀念的是担任 `CEO` 以及那种拥有权力和资源去促成良好（甚至是伟大）事情发生的感觉。然而，从技术和书面上来说，我在二十年前就离开了我的上一个\
  \ `CEO` 职位，当时我在 2005 年 6 月将 `Liberty Global` 的最高职位交给了 `Mike Fries`。\n\n20 世纪 70\
  \ 年代经营 `TCI` 的 `CEO` 责任压力巨大，以至于我查看信箱时真的会畏缩一下，害怕里面是来自 `IRS`、`FCC` 或 `DOJ` 的信。尽管如此，直到现在，我怀念那种责任感，以及做出关键决策（无论好坏）启动事务的即时满足感。\n\
  \n如今，作为主席，影响力是有限的。这就像……我曾多年努力获得我所经营公司的控制权，抵御敌意的收购。但当你的继承人对此不感兴趣时，行使控制权失去了价值。而仅仅将我的股份卖给出价最高者听听起来很有吸引力是错误的，因为这对其他股东是不公平的。\n\
  \n\n\n\n\n# 关于转型与传承的思考\n\n最近，在 2025 年 4 月，我辞去了 `Warner Bros. Discovery` 董事会，转任名誉主席。这相当于向后退了一半步，减少了旅行，但我仍然在顾问职位上保持活跃。\n\
  \n在这些每一个案例中，我都仔细考虑过如何退出——即以一种能够确保所有股东都得到平等、公正对待的方式来放弃控制权。我正尝试慢慢放手，在不损害基础企业的情况下逐渐抽身，尽管某些股东可能仍然认为有我的参与是件件好事。\n\
  \n这始于 1973 年的一家小型区域有线运营商，演变成了现代金融史上最引注目的投资故事之一，这证明了集体毅力、时机良好的冒险以及命运的无形之手。根据 `Ashe\
  \ Capital Management` 的计算，到 1999 年 `AT&T` 以 480 亿美元收购 `TCI` 时，最初的 `$1` 投资已增长到 `$900`\
  \ 以上，表现超过了同类公司和整个大市场。随后，`Liberty Media` 扩张到媒体、体育和娱乐领域，到 2024 年，同样的 `$1` 投资已增长到 `$3,950`，而\
  \ `S&P 500` 则为 `$234`，年化收益率为 `17.4` 百。。不错吧，鲍勃？\n\n在 `Liberty Global`，我出于许多原因授予了\
  \ `Mike Fries` 对我所有 `B` 类股票的优先报价权，但首要原因是信任和连续性。\n\n今年早些时候，在 `Liberty` 首席执行官 `Greg\
  \ Maffei` 离后，`Liberty` 引入了新首席执行官 `Derek Chang`，他将推动 `Liberty Media` 进入下一个阶段。我从 20\
  \ 世纪 90 年代他在 `TCI` 工作起就认识 `Derek`，他带来了来自 `NBA`、`DirecTV`、`Scripps` 和 `Charter` 的经验。\n\
  \n当我逐渐退出公司职务并思考这些义务时，我仍然无法完全回答那个直视我的真实问题：我离开后会发生什么？\n\n***\n\n# 冬季之访\n\n最近的一个冬日，Leslie\
  \ 和我决定去住在大西洋城附近的儿子、妻子和他们的三个孩子那里看看。他们收养了来自东欧的寄养儿童，我们渴望看到新的孙子们。两个女孩分别是十一岁和七岁，以及他们八岁的弟弟在圣诞节前到达，他们只会说几个英语单词。\n\
  \nLeslie 和我在一个周六早上早早到达他们家。天气刺骨，但我们的心因期待而暖意融融。我们带孩子们去自行车商店买了新自行车、头盔和所有装备，然后在一个寒冷的日子走向了空旷的滨海木道。\n\
  \n他们兴奋的快乐具有感染力。在几个小时的骑行后，他们迫不及待要在周日再去一次，完全顾不得天气冷。我们裹得严严实实的，他们骑车时边走边聊天，他们的笑声在旧木板上回荡。看着他们放无抑制的喜悦，我感动得落泪，带回了我自己的童年。那一刻，我觉得自己又年轻了。\n\
  \n这是我们第一次和孙子们见面，我们像爱所有其他孙子一样爱上了他们。我被儿子和妻子深深触动，他们如何应对育儿过程中所有所未有的挑战——甚至学习烹饪保加利亚菜肴——他们为这些孩子的人生开辟了一条道路。看到我的儿子成为我想要成为的那种父亲，真是令人欣慰。我们同样幸运地有一个拥有这些天赋的女儿。\n\
  \n\n\n\nTCI 主席鲍勃·马格尼斯（Bob Magness，左 way）选择了一群合作了近三十年的顾问团队：担任财务主管的唐·菲舍尔（Donne Fisher，从左起第二）帮助我们躲避了破产。担任首席运营官的\
  \ JC·斯帕克曼（JC Sparkman，从左起第三）提供的季度数据是完全可以信赖的。我当时还是个新手，第一次担任首席执行官，而且比周围的那些“电缆牛仔”们要得多——尽管仍然被视为他们的一员。（感谢\
