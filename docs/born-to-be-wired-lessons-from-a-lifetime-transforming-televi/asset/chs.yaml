  \n***\n\n我们面临的逆风并未减弱。诚然，数字电缆电视盒将于 1996 年秋季从 `GI` 开始发货，我们的高速互联网服务 `@Home Network`\
  \ 计划在年底前在旧金山推出。但我们已经落后了近三年，而华尔街会对错失既定目标的公司进行严厉惩罚。从 1994 年 4 月到 1996 年 4 月，当`道琼斯工业平均指数`\
  \ 上涨 52% 时，TCI 的股票仅上涨了 24%。\n\n1996 年 2 月，克林顿总统签署了《1996 年电信法案》，为激进的新竞争发出了信号，该法案消除了电话和电缆电视行业之间几乎所有的竞争障碍。\n\
