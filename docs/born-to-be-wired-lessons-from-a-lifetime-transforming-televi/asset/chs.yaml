  \ 失去了 70,000 名基础订阅用户和 308,000 名付费电视用户，大部分是由于新的微型卫星接收竞争对手，部分是由于我们涨价导致的。自从 `TCI` 在\
  \ 1969 年首次公股以来，我们的总用户数首次下降而非增长。现金流增长仅为糟糕的 `3 percent`，而大多数分析师预期为 `10 percent`。\n\
  \n当 10 月下旬公布初步数据时，投资者们像着火了一样逃离。`TCI` 股票作为 `纳斯达克股市` 中最活跃的股票之一，收于五周新低 `$11.625`。`TCI`\
  \ 股价已 1995 年的高点下跌了 `40 percent`。\n\n`JC` 是对的。不仅计划很糟糕，而且我们太仓促了。支出已经膨胀。我们训练了华尔街在分析我们的财务状况时放大我们的现金流，但当我们关注一年左右后的回报时，却忽视了这一点。如果给予时间和金钱，`TCI`\
  \ 的改革本是有意义的，但我们两样都没有——由于资本支出，现金流已变成巨大的负值。\n\n我没有正式解雇 `Brendan`，至少最初不是。我的信息更多是：让开——我要强势介入了。\n\
  \n感觉就像重回 `1973` 年。我必须止血。我制定了新规定：任何超过 `$1,000` 的资本支出都必须经过我的批准，那些不直接贡献 `cash flow`\
  \ 的支出将被取消。\n\n我们削减了高管薪水，包括我自己的（我同意在我 `$800,000 的 salary` 中减薪 `20 percent`），并结合裁员冻结了其他人的工资。`TCI`\
  \ 裁了 2500 人，大部分在营销部门，我们卖掉了 `TCI` 的喷飞机。“我们将挤压整个公司，直到我们的现金流转向正确的方向，”我对任何听我说的人说。\n\n\
  我告诉团队简单停止支付过去几年里飙升的节目费用增加——或者停掉该频道。我采访了财务团队、营销负责人，甚至是线路施工经理。我们搜查了每个办公室的支出。我们解雇了顾问，并出售和外包了新的\
  \ `SUMMITrak` 结算系统。\n\n我解释说，即使在推迟网络升级，我们仍然可以部署数字顶盒，因为压缩技术不需要光纤。所以我们仍在订购数字盒，并计划明年进入\
  \ 40 个市场。这种更激进的部署将为所有客户提供更多更清晰的频道——并为 `TCI` 带来更多收入。\n\n接着我拿着扩喇器告诉全世界 `TCI` 是如何搞砸的，以及我们将如何修复它。尽管在私下里我觉得\
