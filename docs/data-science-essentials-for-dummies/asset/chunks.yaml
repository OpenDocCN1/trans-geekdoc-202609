    \ macro in Relative mode instead, you need to select the Use Relative References\
    \ option before recording the macro.\n\n![FIGURE 7-11: Using a macro to insert\
    \ empty cells between values.](images/9781394297009-fg0711.png)\n\n[FIGURE 7-11:](#c07.xhtml#rc07-fig-0011)\
