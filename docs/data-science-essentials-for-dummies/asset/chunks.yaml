    variance explained` (CVE) — for the components you keep is less than 95 percent,
    don’t use the components as derived features further downstream in machine learning
    models. In this case, the information lost within these derived features will
    cause the machine learning model to generate inaccurate, unreliable predictions.
    These derived components are, however, useful as a source for descriptive statistics
    or for building more general *descriptive analytics* — in other words, analytics
    that describe what happened in the past, and answer questions like “What happened?,”
    “When?,” “How many,?” and “Where?”

