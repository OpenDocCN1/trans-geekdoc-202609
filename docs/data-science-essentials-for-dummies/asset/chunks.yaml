    ![Tip](images/tip.png)Python coders often refer to lists, tuples, sets, and dictionaries
    as data *structures* rather than data *types. Data structures* are basic functional
    units that organize data so that it can be used efficiently by the program or
    application you''re working with.


    ![Remember](images/remember.png)Lists, tuples, sets, and dictionaries are data
    structures, but keep in mind that they’re still composed of one or more basic
    data types (numbers and/or strings, for example).


    #### Lists in Python


    A *list* is a sequence of numbers and/or strings. To create a list, you simply
    enclose the elements of the list (separated by commas) within square brackets.
    Here’s an example of a basic list:


    `>>> variable2=["ID","Name","Depth","Latitude", "Longitude"]>>> depth=[0,120,140,0,150,80,0,10]>>>
    variable2[3]''Latitude''`


    Every element of the list is automatically assigned an index number, starting
    from 0. You can access each element using this index, and the corresponding value
    of the list is returned. If you need to store and analyze long arrays of data,
    use lists — storing your data inside a list makes it fairly easy to extract statistical
    information. The following code snippet is an example of a simple computation
    to pull the mean value from the elements of the `depth` list created in the preceding
    code example:


    `>>> sum(depth)/len(depth)62.5`


    In this example, the average of the list elements is computed by first summing
    up the elements, via the `sum` function, and then dividing them by the number
    of the elements contained in the list — a number you determine with the help of
    the `len` function, which returns the *length* (the number of elements, in other
    words) in a string, an array, or a list. The `len` function in the denominator
    here is what’s returning the average value of items in the object. See? it’s as
    simple as 1-2-3!


    #### Tuples in Python


    *Tuples* are just like lists, except that you can’t modify their content after
    you create them. Also, to create tuples, you need to use normal brackets instead
    of squared ones.


    ![Remember](images/remember.png)“Normal brackets” refers to parentheses in the
    form of `(…)` or `(…, …, …)`.


    Here''s an example of a tuple:


    `>>> depth=(0,120,140,0,150,80,0,10)`


    In this case, you can’t modify any of the elements, as you would with a list.
    To ensure that your data stays in a read-only format, use tuples.


    #### Sets in Python


    A *set* is another data structure that’s similar to a list. In contrast to lists,
    however, elements of a *set* are unordered. This disordered characteristic of
    a set makes it impossible to index, so it’s not a commonly used data type.


    #### Dictionaries in Python


    *Dictionaries* are data structures that consist of pairs of keys and values. In
    a dictionary, every value corresponds to a certain key, and consequently, each
    value can be accessed using that key. The following code snippet shows a typical
    key/value pairing:


    `>>> variable4={"ID":1,"Name":"Valley City", "Depth":0,"Latitude":49.6, "Longitude":-98.01}>>>
    variable4["Longitude"]-98.01`


    ### Putting loops to good use in Python


    When working with lists in Python, you typically access a list element by using
    the element index number. In a similar manner, you can access other elements of
    the list by using their corresponding index numbers. The following code snippet
    illustrates this concept:


    `>>>variable2=["ID","Name","Depth","Latitude", "Longitude"]>>> print(variable2[3])Latitude>>>
    print(variable2[4])Longitude`


    ![Warning](images/warning.png)Don’t let the index numbering system confuse you.
    Every element of the list is automatically assigned an index number starting from
    0 — *not* starting from 1. That means the fourth element in an index actually
    bears the index number 3.


    When you’re analyzing considerable amounts of data and you need to access each
    element of a list, this technique becomes quite inefficient. In these cases, you
    should use a looping technique instead.


    You can use *looping* to execute the same block of code multiple times for a sequence
    of items. Consequently, instead of manually accessing all elements one by one,
    you simply create a loop to automatically *iterate* (pass through in successive
    cycles) each element of the list.


    You can use two types of loops in Python: the `for` loop and the `while` loop.
    The most often used looping technique is the `for` loop — designed especially
    to iterate through sequences, strings, tuples, sets, and dictionaries. The following
    code snippet illustrates a `for` loop iterating through the `variable2` list created
    in the preceding code snippet:


    `>>> for element in variable2:print(element)IDNameDepthLatitudeLongitude`


    The other available looping technique in Python is the `while` loop. Use a `while`
    loop to perform actions while a given condition is true.


    ![Remember](images/remember.png)Looping is crucial when you work with long arrays
    of data, such as when you''re working with raster images. Looping lets you apply
    certain actions to all data or apply those actions to only predefined groups of
    data.


    ### Having fun with functions


    Functions (and classes, which I describe in the following section) are the crucial
    building blocks of almost every programming language. They provide a way to build
    organized, reusable code. *Functions* are blocks of code that take an input, process
    it, and return an output. Function inputs can be numbers, strings, lists, objects,
    or other functions. Python has two types of functions: built-in and custom.


    *Built-in* functions are predefined inside Python. You can use them by just typing
    their names. The following code snippet is an example of the built-in `print`
    function:


    `>>> print("Hello")Hello`


    This oft-used, built-in `print` function prints a given input. The code behind
    `print` has already been written by the people who created Python. Now that this
    code stands in the background, you don''t need to know how to code it yourself
    — you simply call the `print` function. The people who created the Python library
    couldn’t guess every possible function to satisfy everyone’s needs, but they managed
    to provide users with a way to create and reuse their own functions when necessary.


    In the section “[Sorting out the various Python data types](#c06.xhtml#c06-sec-0004),”
    earlier in this chapter, the following code snippet from that section (listed
    again here) was used to sum up the elements in a list and calculate the average:


    `>>> depth=[0,120,140,0,150,80,0,10]>>> sum(depth)/len(depth)62.5`


    The preceding data represents snowfall and snow depth records from multiple point
    locations. As you can see, the points where snow depth measurements were collected
    have an average depth of 62.5 units. These are depth measurements taken at only
    one time, though. In other words, all the data bears the same time stamp. When
    modeling data using Python, you often see scenarios in which sets of measurements
    were taken at different times — known as *time series data.*


    Here’s an example of time series data:


    `>>> december_depth=[0,120,140,0,150,80,0,10]>>> january_depth=[20,180,140,0,170,170,30,30]>>>
    february_depth=[0,100,100,40,100,160,40,40]`


    You could calculate December, January, and February average snow depth in the
    same way you averaged values in the previous list, but that would be cumbersome.
    This is where custom functions come in handy:


    `>>> def average(any_list):return(sum(any_list)/ len(any_list))`'
