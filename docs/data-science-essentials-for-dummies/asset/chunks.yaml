- raw: " ![Credit: Python for Data Science Essential Training Part 2, LinkedIn.com\
    \ ¶ FIGURE 4-6: Linear regression used to predict home prices based on the number\
    \ of rooms in a house.](images/9781394297009-fg0406.png)\n\nCredit: Python for\
    \ Data Science Essential Training Part 2, [`LinkedIn.com`](http://LinkedIn.com)\
    \ ¶ [FIGURE 4-6:](#c04.xhtml#rc04-fig-0006) Linear regression used to predict\
    \ home prices based on the number of rooms in a house.\n\n![Remember](images/remember.png)Don’t\
    \ forget dataset size! A good rule of thumb is that you should have at least 20\
    \ observations per predictive feature if you expect to generate reliable results\
    \ using linear regression.\n\n### Logistic regression\n\nLogistic regression is\
    \ a machine learning method you can use to estimate values for a categorical target\
    \ variable based on your selected features. Your target variable should be numeric\
    \ and should contain values that describe the target’s class — or category. One\
    \ cool aspect of logistic regression is that, in addition to predicting the class\
    \ of observations in your target variable, it indicates the probability for each\
    \ of its estimates. Though logistic regression is like linear regression, its\
    \ requirements are simpler, in that:\n\n*   There doesn’t need to be a linear\
    \ relationship between the features and target variable.\n\n*   Residuals don’t\
    \ have to be normally distributed.\n\n*   Predictive features aren’t required\
    \ to have a normal distribution.\n\nWhen deciding whether logistic regression\
    \ is a good choice for you, consider the following limitations:\n\n*   Missing\
    \ values should be treated or removed.\n\n*   Your target variable must be binary\
    \ or ordinal.\n\n    ![Remember](images/remember.png)Binary classification assigns\
    \ a 1 for “yes” and a 0 for “no.”\n\n*   Predictive features should be independent\
    \ of each other.\n\nLogistic regression requires a greater number of observations\
    \ than linear regression to produce a reliable result. The rule of thumb is that\
    \ you should have at least 50 observations per predictive feature if you expect\
    \ to generate reliable results.\n\n![Tip](images/tip.png)Predicting survivors\
    \ on the *Titanic* is the classic practice problem for newcomers to learn logistic\
    \ regression. You can practice it and see lots of examples of this problem worked\
    \ out over on Kaggle ([`www.kaggle.com/c/titanic`](https://www.kaggle.com/c/titanic)).\n\
    \n### Ordinary least squares regression methods\n\n*Ordinary least squares* (OLS)\
    \ is a statistical method that fits a linear regression line to a dataset. With\
    \ OLS, you do this by squaring the vertical distance values that describe the\
    \ distances between the data points and the best-fit line, adding up those squared\
    \ distances, and then adjusting the placement of the best-fit line so that the\
    \ summed squared distance value is minimized. Use OLS if you want to construct\
    \ a function that’s a close approximation to your data.\n\n![Remember](images/remember.png)As\
    \ always, don’t expect the actual value to be identical to the value predicted\
    \ by the regression. Values predicted by the regression are simply estimates that\
    \ are most similar to the actual values in the model.\n\nOLS is particularly useful\
    \ for fitting a regression line to models containing more than one independent\
    \ variable. In this way, you can use OLS to estimate the target from dataset features.\n\
    \n![Warning](images/warning.png)When using OLS regression methods to fit a regression\
    \ line that has more than one independent variable, two or more of the variables\
    \ may be interrelated. When two or more independent variables are strongly correlated\
    \ with each other, this is called *multicollinearity.* Multicollinearity tends\
    \ to adversely affect the reliability of the variables as predictors when they’re\
    \ examined apart from one another. Luckily, however, multicollinearity doesn’t\
    \ decrease the overall predictive reliability of the model when it’s considered\
    \ collectively.\n\n## Detecting Outliers\n\nMany statistical and machine learning\
    \ approaches assume that your data has no outliers. Outlier removal is an important\
    \ part of preparing your data for analysis. In this section, you see a variety\
    \ of methods you can use to discover outliers in your data.\n\n### Analyzing extreme\
    \ values\n\n*Outliers* are data points with values that are significantly different\
    \ from the majority of data points comprising a variable. It’s important to find\
    \ and remove outliers because, left untreated, they skew variable distribution,\
    \ make variance appear falsely high, and cause a misrepresentation of intervariable\
    \ correlations.\n\nYou can use outlier detection to spot anomalies that represent\
    \ fraud, equipment failure, or cybersecurity attacks. In other words, outlier\
    \ detection is a data preparation method and an analytical method in its own right.\n\
    \nOutliers fall into the following three categories:\n\n*   **Point:** Point outliers\
    \ are data points with anomalous values compared to the normal range of values\
    \ in a feature.\n\n*   **Contextual:** Contextual outliers are data points that\
    \ are anomalous only within a specific context. To illustrate, if you’re inspecting\
    \ weather station data from January in Orlando, Florida, and you see a temperature\
    \ reading of 23°F, this would be quite anomalous because the average temperature\
    \ there is 70°F in January. But consider if you were looking at data from January\
    \ at a weather station in Anchorage, Alaska — a temperature reading of 23°F in\
    \ this context isn’t anomalous at all.\n\n*   **Collective:** These outliers appear\
    \ nearby one another, all having similar values that are anomalous to the majority\
    \ of values in the feature.\n\nYou can detect outliers using either a univariate\
    \ or a multivariate approach, as spelled out in the next two sections.\n\n###\
    \ Detecting outliers with univariate analysis\n\nUnivariate outlier detection\
    \ is where you look at features in your dataset and inspect them individually\
    \ for anomalous values. You can choose from two simple methods for doing this:\n\
    \n*   Tukey outlier labeling\n\n*   Tukey box plotting\n\nTukey box plotting is\
    \ an exploratory data analysis technique that’s useful for visualizing the distribution\
    \ of data within a numeric variable by visualizing that distribution with quartiles.\
    \ As you may guess, the Tukey box plot was named after its inventor, John Tukey,\
    \ an American mathematician who did most of his work back in the 1960s and 1970s.\
    \ Tukey outlier labeling refers to labeling data points (that lie beyond the minimum\
    \ and maximum extremes of a box plot) as outliers.\n\nUsing the Tukey method to\
    \ manually calculate, identify, and label outliers is cumbersome, but if you want\
    \ to do it, the trick is to look at how far the minimum and maximum values are\
    \ from the 25th and 75th percentiles. The distance between the first quartile\
    \ (at 25 percent) and the third quartile (at 75 percent) is called the *inter-quartile\
    \ range* (IQR), and it describes the data’s spread. When you look at a variable,\
    \ consider its spread, its Q1/Q3 values, and its minimum and maximum values to\
    \ decide whether the variable is suspect for outliers.\n\n![Tip](images/tip.png)Here’s\
    \ a good rule of thumb:\n\n> *a* = Q1 – 1.5 \\* IQR\n\nand\n\n> *b* = Q3 + 1.5\
    \ \\* IQR\n\nIf your minimum value is less than *a*, or your maximum value is\
    \ greater than *b*, the variable probably has outliers.\n\nOn the other hand,\
    \ it’s quite easy to generate a Tukey box plot and spot outliers using Python\
    \ or R. Each box plot has whiskers that are set at 1.5 \\* IQR. Any values that\
    \ lie beyond these whiskers are outliers. [Figure 4-7](#c04.xhtml#c04-fig-0007)\
    \ shows outliers as they appear within a Tukey box plot that was generated in\
    \ Python.\n\n### Detecting outliers with multivariate analysis"
