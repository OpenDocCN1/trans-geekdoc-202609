  trans: "\n\n![](img/cover.jpg)\n\n![封面：数据科学入门，作者：Lillian Pierson](img/cover.jpg)\n\
    \n# 数据科学入门（Data Science Essentials For Dummies®）\n\n要查看此书的快速上手表（Cheat Sheet），请访问\
    \ [www.dummies.com](http://www.dummies.com) 搜索框中搜索“Data Science Essentials For\
    \ Dummies Cheat Sheet”。\n\n# 目录\n\n1. 封面\n2. 标题页\n3. 版权信息\n4. 引言\n    1. 关于本书\n\
    \    2. 愚的假设\n    3. 书书中使用的图标\n    4. 后续学习指南\n5. 第一章：领悟数据科学\n    1. 看看谁可以使用数据科学\n\
    \    2. 审视数据科学拼图的碎片\n6. 第二章：挖掘数据工程的关键方面\n    1. 定义三个维度（3Vs）\n    2. 识别重要数据源\n\
    \    3. 掌握不同数据方法之间的差异\n    4. 为数据科学存储和处理数据\n    5. 识别生成式 AI 的影响\n7. 第三章：利用机器从数据学习\n\
    \    1. 定义机器学习及其流程\n    2. 考虑学习风格\n    3. 了解你能做什么\n8. 第四章：数学、概率与统计建模\n    1. 探索概率与推断统计\n\
    \    2. 量化相关性\n    3. 用线性代数降低数据维度\n    4. 用多准则决策进行建模\n    5. 引入回归方法\n    6. 检测异常值\n\
    \    7. 介绍时间序列分析\n9. 第五章：通过聚类实现精准预测\n    1. 从聚类基础开始\n    2. 在数据中识别簇\n    3. 使用决策树和随机森林算法对数据进行分类\n\
    \    4. 划分聚类与分类的界限\n    5. 通过最近邻分析理解数据\n    6. 用平均最近邻算法对数据进行分类\n    7. 使用 K 近邻算法分类\n\
    \    8. 用最近邻算法解决现实问题\n10. 第六章：编码数据洞察与决策\n    1. 了解 Python 如何适用于数据科学\n    2. 使用\
    \ Python 进行数据科学\n11. 第七章：通过软件应用生成洞察\n    1. 选择数据科学的最佳工具\n    2. 掌握 SQL 和关系型数据库\n\
    \    3. 投入精力设计数据库\n    4. 用 SQL 缩小范围\n    5. 用 Excel 让生活更简单\n12. 第八章：用数据讲述故事\n\
    \    1. 可视化：三要素\n    2. 根据观众需求进行设计\n    3. 选择合适的风格\n    4. 选择合适的数据类型\n    5. 测试图表\n\
    \    6. 添加上下文\n13. 第九章：十个免费或低成本数据库与平台\n    1. 使用 Beautiful Soup 爬取网页\n    2. 使用\
    \ `pandas` 清理数据](#c09.xhtml#h2-2)\n    3. 使用 `Looker Studio` 可视化数据](#c09.xhtml#h2-3)\n\
    \    4. 使用 `scikit-learn` 进行机器学习](#c09.xhtml#h2-4)\n    5. 使用 `Streamlit` 创建交互式仪表板](#c09.xhtml#h2-5)\n\
