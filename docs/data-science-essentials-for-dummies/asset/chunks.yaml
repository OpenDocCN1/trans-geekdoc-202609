    Looking more closely at Matplotlib, I can tell you that it’s a two-dimensional
    plotting library you can use in Python to produce figures from data. You can use
    Matplotlib to produce plots, histograms, scatterplots, and a variety of other
    data graphics. What’s more, because the library gives you full control of your
    visualization’s symbology, line styles, fonts, and colors, you can even use Matplotlib
    to produce publication-quality data graphics.


    ![Remember](images/remember.png)As is the case with all other libraries in Python,
    in order to work with Matplotlib, you first need to install and import the library
    into your script. After you complete those tasks, it’s easy to get started producing
    graphs and charts.


    To illustrate how to use Matplotlib, consider the following NumPy array (which
    I came up with in the “[Saying hello to the NumPy library](#c06.xhtml#c06-sec-0015)”
    section, earlier in this chapter):


    ```python

    >>> print(depth)[[ 0 120 140 0 150 80 0 10][ 20 180 140 0 170 170 30 30][ 0 100
    100 40 100 160 40 40]]

    ```


    With the following few lines of code, using just a `for` loop and a Matplotlib
    function — `pyplot` — you can easily plot all measurements in a single graph within
    Python:

    '
  trans: '


    ```python

    >>> array_2d=numpy.arange(8).reshape(2,4)

    >>> print(array_2d)

    [[0 1 2 3][4 5 6 7]]

    ```


    上一个示例是一个二维数组，也被称为 2 x 4 矩阵。它与之前的示例唯一的区别在于我调用了 `.reshape` 方法，并传入了 2 和 4 这两个值 ——
    告诉 `numpy` 将该数组转换为 2 x 4 矩阵。


    ![Remember](img/remember.png)


    标准的矩阵表示法是 `m` × `n`，其中 `m` 是行数，`n` 指定矩阵的列数。


    使用 `.arange` 和 `reshape` 方法只是创建 NumPy 数组的方法之一。你也可以从列表（lists）和元组（tuples）生成数组。


    在之前的一个章节“玩转函数之乐趣”中介绍的雪地数据集中，我将不同地点的雪深数据存储在三个独立的 Python 列表中 —— 每个月一个列表：


    ```python

    >>> december_depth=[0,120,140,0,150,80,0,10]

    >>> january_depth=[20,180,140,0,170,170,30,30]

    >>> february_depth=[0,100,100,40,100,160,40,40]

    ```


    将测量值存储在更整合的结构中会更高效。例如，你可以使用下面的代码段轻松地将所有列表放入单个 NumPy 数组中：


    ```python

    >>>depth=numpy.array([december_depth, january_depth,february_depth])

    >>> print(depth)

    [[ 0 120 140 0 150 80 0 10][ 20 180 140 0 170 170 30 30][ 0 100 100 40 100 160
    40 40]]

    ```


    使用这种结构允许你更高效地提取某些测量值。例如，如果你想计算三个月中每个地点的雪深平均值，你需要提取每行水平行的第一个元素（更准确地说，是值 0、20 和
    0）。你可以通过对数据集进行切片（slice）然后通过 NumPy 的 `mean` 函数计算平均值，从而在一行代码中完成提取。*切片*（slicing）一词指的是从数据集中取出一部分。这里是一个示例：


    ```python

    >>> numpy.mean(depth[:,1])

    133.33333333333334

    ```


    通过这段代码，我指示计算机前往列索引为 1 的位置，并计算该列值的平均值。索引为 1 的列的值是 120、180 和 100。当你计算这些数字的平均值时，得到
    133.3。


    除了使用 NumPy 从单个矩阵中提取信息外，你还可以用它与不同的矩阵进行交互 —— 例如，在矩阵之间应用标准的数学运算，甚至可以应用非标准的运算符，如矩阵求逆、汇总以及最小/最大值运算符。


    ![Remember](img/remember.png)


    数组对象（Array objects）拥有 Python 中任何其他对象相同的权利。你可以将它们作为参数传递给函数，将它们设置为类属性，或者遍历数组元素生成随机数。


    ### 深入了解 SciPy 库


    SciPy ([`https://scipy.org`](https://scipy.org/)) 是一个数学算法和高级函数的集合，扩展了 NumPy 库的功能。SciPy
    库为 Python 添加了一些专门的科学函数，用于数据科学中更特定的任务。要在 Python 中使用 SciPy 函数，你必须先安装并导入 SciPy 库。


    SciPy 为各种任务提供了功能和算法，包括矢量量化、统计函数、离散傅里变换算法、正交距离回归、Air 函数、稀疏特征值求解器、最大熵拟合程序、`n`-维图像操作、积分程序、插值工具、稀疏线性代数、线性求解器、优化工具、信号处理工具、稀疏矩阵以及其他
    Python 库未提供的工具。令人印象深刻，对吧？然而，这还不是 SciPy 工具的完整列表。如果你渴望获得完整列表，在 Python 中运行下面的代码段将打开一个详尽的帮助模块，解释
    SciPy 库：


    ```python

    >>> import scipy

    >>> help(scipy)

    ```


    ![Remember](img/remember.png)在你在使用此代码之前，需要先下载并安装 SciPy 库。


    上一个代码中使用的 `help` 函数返回一个脚本，列出了组成 SciPy 的所有工具并记录了 SciPy 的函数和类。这些信息帮助你理解构成 SciPy
    库的预写函数和算法背后的原理。


    ![Tip](img/tip.png)由于 SciPy 开发中，因此不断变化和增长，请定期检查 `help` 函数以查看变化。


    ### 窥探 pandas 的功能


    pandas 库 ([`https://pandas.pydata.org`](https://pandas.pydata.org/)) 以其易于访问且健壮的数据结构使数据分析变得更快、更简单。它精确的功能是通过集成
    Matplotlib 的一部分来提高数据可视化性能。这里是两种主要的 pandas 数据结构：


    *   `Series`：`Series` 是类似于数组的结构，可以是水平或垂直的。你可以将 `Series` 对象想象成 Excel 表格中的一行或一列。

    *   `DataFrame`：`DataFrame` 对象类似于 Python 中的数据表格。`DataFrame` 的每行或每列都可以被视为自己的 `Series`
    对象。


    索引被集成到这两种数据结构中，使其易于访问数据。pandas 提供了读取和写入数据的功能，支持你任何格式。最后，pandas 还提供了重塑数据、处理缺失值和删除异常值的功能，使其成为数据准备和基础数据分析的极选择。如果你想执行更高级的统计和机器学习方法，你需要使用
    scikit-learn 库。好消息是 scikit-learn 和 pandas 配合良好。


    ### 使用 Matplotlib 进行可视化


    通常情况下，数据科学项目最终以对象或现象的可视化告终。在 Python 中也不例外。在通过 NumPy 和 SciPy 走了入门（或一些不是入门步骤）之后，你可以使用
    Python 的 Matplotlib 库 ([`https://matplotlib.org`](https://matplotlib.org/)) 为你的数据集创建复杂的视觉表示。Matplotlib
    与 NumPy 和 SciPy 结合为解决数据问题提供了良好的环境。


    仔细观察 Matplotlib，我可以告诉你这是一个在 Python 中生成数据的二维绘图库。你可以使用 Matplotlib 制作直方图、散点图和各种其他数据图表。更重要的是，因为该库让你对可视化的符号、线条样式、字体和颜色拥有完全控制，你甚至可以使用
    Matplotlib 生成出版级的数据图表。


    ![Remember](img/remember.png)与 Python 中所有其他库一样，为了使用 Matplotlib，你首先需要安装并导入到脚本中。完成这些任务后，就可以开始生成图表和图形了。


    为了说明如何使用 Matplotlib，请考虑下面的 NumPy 数组（这是在本章前面的“向 NumPy 库打招呼”章节中提出的）：


    ```python

    >>> print(depth)[[ 0 120 140 0 150 80 0 10][ 20 180 140 0 170 170 30 30][ 0 100
    100 40 100 160 40 40]]

    ```


    通过接下来的几行代码，仅使用一个 `for` 循环和 Matplotlib 函数 —— `pyplot`，你就可以在 Python 的单张图中轻松绘制所有测量值：


    '
