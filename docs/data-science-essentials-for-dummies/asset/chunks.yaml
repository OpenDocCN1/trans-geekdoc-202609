- raw: '# Coding Up Data Insights and Decision Engines


    IN THIS CHAPTER


    ![Bullet](images/check.png)**Taking on Python programming for data science**


    ![Bullet](images/check.png)**Exploring data science Python libraries**


    Data science involves the skillful application of math, coding, and subject matter
    expertise in ways that allow data scientists to generate reliable and accurate
    predictions from data. In this chapter, I introduce you to the fundamental concepts
    of programming with Python (such as data types, functions, and classes). The machine
    learning models you build with this language can serve as the *decision engines*
    within artificial intelligence (AI) software as a service (SaaS) products you
    build for your company. I also introduce some of the best Python libraries for
    manipulating data, performing statistical computations, creating data visualizations,
    and completing other data science tasks.


    ## Seeing Where Python Fits into Your Data Science Strategy


    Would you be surprised to hear that not all data projects that are out there trying
    to turn a profit necessarily require data science? It may seem odd, but it’s true!
    Think about LinkedIn for a second: Imagine how much less useful that platform
    would be if it didn’t allow direct messaging between users. That feature directly
    improves the user experience, keeping users returning more often and keeping them
    more active on the platform for longer periods, thus increasing the overall profitability
    of the LinkedIn platform.


    The longer users stay active on the platform and the more often they return, the
    more likely they are to generate revenues for the platform — either by subscribing
    to LinkedIn Learning or by using Open to Work, a LinkedIn designation that encourages
    recruiters to contact them. (With Open to Work, the contacting of users is paid
    for by the recruiter as a form of indirect monetization of users on the platform.)
    The popular LinkedIn Premium feature allows users to message others directly on
    the platform, regardless of whether they know them. All these monetization features
    rely directly on LinkedIn’s direct messaging product. And do you know what it’s
    built on? It’s the data engineering technology called Apache Kafka. Not advanced
    machine learning models, not deep learning — just traditional, tried-and-tested
    data engineering (see [Chapter 2](#c02.xhtml)).


    But for those for-profit data projects that involve data science, you’ll want
    to make sure you have a well-formed and effective data science strategy in place,
    governing project implementation. A *data science strategy* is a technical plan
    that maps out each and every element required to lead data science projects in
    ways that increase the profitability of a business. Because Python is the lifeblood
    by which data science produces predictive insights designed to increase profits,
    you’d be hard-pressed to find a place where they don’t fit within an effective
    data science strategy.


    ## Using Python for Data Science


    Although popular programming languages like Java and C++ are good for developing
    stand-alone desktop applications, Python’s versatility makes it an ideal programming
    language for processing, analyzing, and visualizing data. For this reason, Python
    has earned a reputation of excellence in the data science field, where it has
    been widely adopted over the past decade. Python’s status as one of the more popular
    programming languages out there can be linked to the fact that it’s relatively
    easy to learn and it allows users to accomplish several tasks using just a few
    lines of code.


    ![Tip](images/tip.png)Though this book wasn’t designed to teach readers either
    the mechanics of programming or the implementation of machine learning algorithms,
    I have included plenty of helpful coding demonstrations and course recommendations
    over on this book’s companion website ([`https://businessgrowth.ai`](https://businessgrowth.ai/)).
    If you want to learn to get started with using Python to implement data science,
    you may want to check it out.


    You can use Python to do anything, from simple mathematical operations to data
    visualizations and even machine learning and predictive analytics. Here’s an example
    of a basic math operation in Python:


    `>>> 2.5+35.5`


    [Figure 6-1](#c06.xhtml#c06-fig-0001) shows an example — taken from Python’s Matplotlib
    library — of a more advanced output based on topographical data sets created by
    the National Oceanic and Atmospheric Administration (NOAA).


    ![FIGURE 6-1: Sample output from Python’s Matplotlib library.](images/9781394297009-fg0601.png)


    [FIGURE 6-1:](#c06.xhtml#rc06-fig-0001) Sample output from Python’s Matplotlib
    library.


    Regardless of the task at hand, you should always study the most basic concepts
    of a language before trying to delve into its more specialized libraries. So,
    to start you off, keep in mind that, because Python is an object-oriented programming
    language, everything in Python is considered an object. In Python, an *object*
    is anything that can be assigned to a variable or passed as an argument to a function.
    The following items are all considered objects in the Python programming language:


    *   Numbers


    *   Strings


    *   Lists


    *   Tuples


    *   Sets


    *   Dictionaries


    *   Functions


    *   Classes


    Additionally, all these items (except for the last two in the list) function as
    basic data types in plain ol’ Python, which is Python with no external extensions
    added to it. (I introduce you to the external Python libraries NumPy, SciPy, pandas,
    Matplotlib, and scikit-learn in the later section “[Checking out some useful Python
    libraries](#c06.xhtml#c06-sec-0014).” When you add these libraries, additional
    data types become available to you.)


    In Python, functions do basically the same thing as they do in plain math — they
    accept data inputs, process them, and output the result. Output results depend
    wholly on the task the function was programmed to do. Classes, on the other hand,
    are prototypes of objects that are designed to output additional objects.


    ![Remember](images/remember.png)If your goal is to write fast, reusable, easy-to-modify
    code in Python, you must use functions and classes. Doing so helps to keep your
    code efficient and organized.


    ### Sorting out the various Python data types


    If you do much work with Python, you need to know how to work with different data
    types. Here are the main data types in Python and the general forms they take:


    *   **Numbers:** Plain ol’ numbers, obviously


    *   **Strings:**`''…''` or `"…"`


    *   **Lists:**`[…]` or `[…, …, … ]`


    *   **Tuples:**`(…)` or `(…, …, …)`


    *   **Sets:** Rarely used


    *   **Dictionaries:**`{''Key'': ''Value'', …}`


    Numbers and strings are the most basic data types. You can incorporate them inside
    other, more complicated data types. All Python data types can be assigned to variables.


    ![Remember](images/remember.png)In Python, numbers, strings, lists, tuples, sets,
    and dictionaries are classified as both object types and data types.


    #### Numbers in Python


    The *numbers* data type represents numeric values that you can use to handle all
    types of mathematical operations. Numbers come in the following types:


    *   **Integer:** A whole-number format


    *   **Long:** A whole-number format with an unlimited digit size


    *   **Float:** A real-number format, written with a decimal point


    *   **Complex:** An imaginary-number format, represented by the square root of
    –1


    #### Strings in Python


    Strings are the most often used data type in Python — and in every other programming
    language, for that matter. Simply put, a *string* consists of one or more characters
    written inside single or double quotes. The following code represents a string:


    `>>> variable1=''This is a sample string''>>> print(variable1)This is a sample
    string`


    In this code snippet, the string is assigned to a variable and the variable subsequently
    acts like a storage container for the string value.'
