    # 编码数据洞察与决策引擎


    ## 本章内容


    ![Bullet](img/check.png) **上手数据科学的 Python 编程**


    ![Bullet](img/check.png) **探索数据科学 Python 库**


    数据科学涉及对数学、编码和领域专业知识的熟练应用，使数据科学家能够从数据生成可靠且准确的预测。在本章中，我将向你介绍使用 `Python` 编程的基础概念（例如数据类型、函数和类）。你用这种语言构建的机器学习模型可以作为你为公司构建的人工智能（AI）软件服务（SaaS）产品中的`决策引擎`。我还会介绍一些用于处理数据、执行统计计算、创建数据可视化以及完成其他数据科学任务的优秀
    `Python` 库。


    ## 了解 Python 如何融入你的数据科学战略


    如果你听到并不是所有试图获利的数据项目都都需要数据科学，你会感到惊讶吗？这听起来可能很奇怪，但事实如此！想一想 `LinkedIn`：想象一下如果平台不允许用户之间直接发送私信，它的实用性会降低多少。这一功能直接提升了用户体验，让用户更频繁地返回，并在平台上保持更长时间的活跃，从而增加了
    `LinkedIn` 平台的整体盈利能力。


    用户在平台上活跃的时间越长、返回频率越高，他们就越可能为平台产生收入——无论是通过订阅 `LinkedIn Learning`，还是使用 `Open to
    Work`（这是一个 `LinkedIn` 标识，鼓励招聘人员与他们联系）。（通过 `Open to Work`，联系用户的费用由招聘人员支付，作为对平台用户进行间接变现的一种形式。）流行的
    `LinkedIn Premium` 功能允许用户直接在平台上给其他人留言，无论他们是否认识对方。所有这些变现功能都直接依赖于 `LinkedIn` 的直接消息产品。你知道它是构建在什么之上吗？它是名为
    `Apache Kafka` 的数据工程技术。不是高级的机器学习模型，不是深度学习——只是传统的、经过测试的数据工程（参见第 2 章）。


    但对于那些涉及数据科学的营利数据项目，你需要确保有一套完善且有效的数据科学战略来指导项目实施。`数据科学战略`是一项技术计划，规划了领导数据科学项目所需的每一个元素，以增加业务利润能力的方式。由于
    `Python` 是数据科学产生旨在增加利润的预测性洞察的命脉，你很难找到一个它们不适用于有效数据科学战略的地方。


    ## 使用 Python 进行数据科学


    虽然 `Java` 和 `C++` 等流行编程语言非常适合开发独立的桌面应用程序，但 `Python` 的多功能性使其成为处理、分析和可视化数据的理想编程语言。出于这个原因，`Python`
    在数据科学领域赢得了卓越声誉，在过去的十年里它被广泛采用。`Python` 作为最流行的编程语言之一的地位可以归功于它相对容易学习，并且允许用户仅用几行代码就能完成多任务。


    ![Tip](img/tip.png) 虽然此本书的设计并不是为了教读者编程原理或机器学习算法的实现，但我已经在本书的配套网站（`https://businessgrowth.org`）上提供了许多实用的代码演示和课程推荐。

