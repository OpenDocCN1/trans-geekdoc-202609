- raw: '![Remember](images/remember.png)When considering the probability of an event,
    you must know what other events are possible. Always define the set of events
    as *mutually exclusive* — only one can occur at a time. (Think of the six possible
    results of rolling a die.) Probability has these two important characteristics:


    *   The probability of any single event never goes below 0.0 or exceeds 1.0.


    *   The probability of all events always sums to exactly 1.0.


    Probability distribution is classified per these two types:


    *   **Discrete:** A random variable where values can be counted by groupings


    *   **Continuous:** A random variable that assigns probabilities to a range of
    values


    ![Remember](images/remember.png)To understand discrete and continuous distribution,
    think of two variables from a dataset describing cars. A color variable would
    have a discrete distribution because cars have only a limited range of colors
    (black, red, or blue, for example). The observations would be countable per the
    color grouping. A variable describing cars’ miles per gallon (mpg) would have
    a continuous distribution because each car could have its own, separate value
    for mpg that it gets on average.


    *   **Normal distributions (numeric continuous):** Represented graphically by
    a symmetric bell-shaped curve, these distributions model phenomena that tend toward
    some most-likely observation (at the top of the bell in the bell curve); observations
    at the two extremes are less likely.


    *   **Binomial distributions (numeric discrete):** These distributions model the
    number of successes that can occur in a certain number of attempts when only two
    outcomes are possible (the old heads-or-tails coin-flip scenario, for example).
    Binary variables — variables that assume only one of two values — have a binomial
    distribution.


    *   **Categorical distributions (non-numeric):** These represent either non-numeric
    categorical variables or *ordinal variables* (ordered categorical variables).
    For example, the level of service offered by most airlines is ordinal because
    they offer first class, business class, and economy class seats.


    ### Conditional probability with Naïve Bayes


    You can use the Naïve Bayes machine learning method, which was borrowed straight
    from the statistics field, to predict the likelihood that an event will occur,
    given evidence defined in your data features — something called *conditional probability.*
    Naïve Bayes, which is based on classification and regression, is especially useful
    if you need to classify text data.


    To better illustrate this concept, consider the Spambase dataset that’s available
    from University of California, Irvine’s machine learning repository ([`https://archive.ics.uci.edu/ml/datasets/Spambase`](https://archive.ics.uci.edu/ml/datasets/Spambase)).
    That dataset contains 4,601 records of emails and, in its last field, designates
    whether each email is spam. From this dataset, you can identify common characteristics
    between spam emails. After you’ve defined common features that indicate spam email,
    you can build a Naïve Bayes classifier that reliably predicts whether an incoming
    email is spam, based on the empirical evidence supported in its content. In other
    words, the model predicts whether an email is spam — the *event* — based on features
    gathered from its content — the *evidence.*


    Naïve Bayes comes in these three popular flavors:


    *   **MultinomialNB:** Use this version if your variables (categorical or continuous)
    describe discrete frequency counts, like word counts. This version of Naïve Bayes
    assumes a multinomial distribution, as is often the case with text data. It doesn’t
    accept negative values.


    *   **BernoulliNB:** If your features are binary, you can use multinomial Bernoulli
    Naïve Bayes to make predictions. This version works for classifying text data
    but isn’t generally known to perform as well as MultinomialNB. If you want to
    use BernoulliNB to make predictions from continuous variables, that will work,
    but you first need to subdivide the variables into discrete interval groupings
    (also known as *binning*).


    *   **GaussianNB:** Use this version if all predictive features are normally distributed.
    It’s not a good option for classifying text data, but it can be a good choice
    if your data contains both positive and negative values (and if your features
    have a normal distribution, of course).


    ![Warning](images/warning.png)Before building a Bayes classifier naïvely, consider
    that the model holds an *a priori* assumption — meaning that its predictions are
    based on an assumption that past conditions still hold true. Predicting future
    values from historical ones generates incorrect results when present circumstances
    change.


    ## Quantifying Correlation


    Many statistical and machine learning methods assume that your features are independent.
    To test whether they’re independent, though, you need to evaluate their *correlation*
    (the extent to which variables demonstrate interdependency). In this section,
    you get a brief introduction to Pearson correlation and Spearman’s rank correlation.


    ![Tip](images/tip.png)Correlation is quantified per the value of a variable called
    *r*, which ranges between –1 and 1. The closer the *r*\-value is to 1 or –1, the
    more correlation there is between two variables. If two variables have an *r*\-value
    that’s close to 0, it could indicate that they’re independent variables.


    ### Calculating correlation with Pearson’s *r*


    If you wanted to uncover dependent relationships between continuous variables
    in a dataset, you’d use statistics to estimate their correlation. The simplest
    form of correlation analysis is the *Pearson correlation,* which assumes the following:


    *   Your data is normally distributed.


    *   You have continuous, numeric variables.


    *   Your variables are linearly related. You can identify a linear relationship
    by plotting the data points on a chart and looking to see if there is a clear
    increasing or decreasing trend within the values of the data points, such that
    a straight line can be drawn to summarize that trend. [Figure 4-1](#c04.xhtml#c04-fig-0001)
    is an illustration of what a linear relationship looks like.


    ![Warning](images/warning.png)Because the Pearson correlation has so many conditions,
    use it *only* to determine whether a relationship between two variables exists,
    but not to rule out possible relationships. If you were to get an *r*\-value close
    to 0, it would indicate that there is no linear relationship between the variables
    but that a nonlinear relationship between them still could exist.


    ![FIGURE 4-1: An example of a linear relationship between months and YouTube subscribers.](images/9781394297009-fg0401.png)


    [FIGURE 4-1:](#c04.xhtml#rc04-fig-0001) An example of a linear relationship between
    months and YouTube subscribers.


