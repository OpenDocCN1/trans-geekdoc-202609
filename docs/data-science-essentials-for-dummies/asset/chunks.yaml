- raw: "This list shows a few different types of popular comparative graphics:\n\n\
    *   **Bubble plots** (see [Figure 8-9](#c08.xhtml#c08-fig-0009)) use bubble size\
    \ and color to demonstrate the relationship between three parameters of the same\
    \ category.\n\n*   **Packed circle diagrams** (see [Figure 8-10](#c08.xhtml#c08-fig-0010))\
    \ use both circle size and clustering to visualize the relationships between categories,\
    \ parameters, and relative parameter values. ![FIGURE 8-9: A bubble chart.](images/9781394297009-fg0809.png)\n\
    \n    [FIGURE 8-9:](#c08.xhtml#rc08-fig-0009) A bubble chart.\n\n    ![FIGURE\
    \ 8-10: A packed circle diagram.](images/9781394297009-fg0810.png)\n\n    [FIGURE\
    \ 8-10:](#c08.xhtml#rc08-fig-0010) A packed circle diagram.\n\n*   **Gantt charts**\
    \ (see [Figure 8-11](#c08.xhtml#c08-fig-0011)) are bar charts that use horizontal\
    \ bars to visualize scheduling requirements for project management purposes. This\
    \ type of chart is useful when you’re developing a plan for project delivery.\
    \ It’s also helpful in determining the sequence in which tasks must be completed\
    \ in order to meet delivery timelines.\n\n    ![Tip](images/tip.png)Choose Gantt\
    \ charts for project management and scheduling.\n\n    ![FIGURE 8-11: A Gantt\
    \ chart.](images/9781394297009-fg0811.png)\n\n    [FIGURE 8-11:](#c08.xhtml#rc08-fig-0011)\
    \ A Gantt chart.\n\n*   **Stacked charts** (see [Figure 8-12](#c08.xhtml#c08-fig-0012))\
    \ are used to compare multiple attributes of parameters in the same category.\
    \ To ensure that it doesn’t become difficult to make a visual comparison, resist\
    \ the urge to include too many parameters. ![FIGURE 8-12: A stacked chart.](images/9781394297009-fg0812.png)\n\
    \n    [FIGURE 8-12:](#c08.xhtml#rc08-fig-0012) A stacked chart.\n\n*   **Tree\
    \ maps** (see [Figure 8-13](#c08.xhtml#c08-fig-0013)) aggregate parameters of\
    \ like categories and then use area to show the relative size of each category\
    \ compared to the whole. ![FIGURE 8-13: A tree map.](images/9781394297009-fg0813.png)\n\
    \n    [FIGURE 8-13:](#c08.xhtml#rc08-fig-0013) A tree map.\n\n*   **Word clouds**\
    \ (see [Figure 8-14](#c08.xhtml#c08-fig-0014)) use size and color to show the\
    \ relative difference in frequency of words used in a body of text. Colors are\
    \ generally employed to indicate classifications of words by usage type.\n\n ![FIGURE\
    \ 8-14: A simple word cloud.](images/9781394297009-fg0814.png)\n\n[FIGURE 8-14:](#c08.xhtml#rc08-fig-0014)\
    \ A simple word cloud.\n\n### Statistical plots\n\nStatistical plots, which show\
    \ the results of statistical analyses, are usually useful only to a deeply analytical\
    \ audience (and aren’t useful for making data art). Here are your statistical\
    \ plot choices:\n\n*   **Histograms** (shown in [Figure 8-15](#c08.xhtml#c08-fig-0015))\
    \ are diagrams that plot a variable’s frequency and distribution as rectangles\
    \ on a chart. A histogram can help you quickly get a handle on the distribution\
    \ and frequency of data in a dataset.\n\n    ![Tip](images/tip.png)Get comfortable\
    \ with histograms. You’ll see a lot of them in the course of making statistical\
    \ analyses.\n\n    ![Source: Lynda.com, Python for DS ¶ FIGURE 8-15: A histogram.](images/9781394297009-fg0815.png)\n\
    \n    Source: [`Lynda.com`](http://Lynda.com), Python for DS ¶ [FIGURE 8-15:](#c08.xhtml#rc08-fig-0015)\
    \ A histogram.\n\n*   **Scatterplots** (see [Figure 8-16](#c08.xhtml#c08-fig-0016))\
    \ plot data points according to their *x*\\- and *y*\\-values in order to visually\
    \ reveal any significant patterns. A scatterplot is a terrific way to quickly\
    \ uncover significant trends and outliers in a dataset. If you use data storytelling\
    \ or data showcasing, start by generating a quick scatterplot to get a feel for\
    \ areas in the dataset that may be interesting — areas that can potentially uncover\
    \ significant relationships or yield persuasive stories. ![Source: Lynda.com,\
    \ Python for DS ¶ FIGURE 8-16: A scatterplot.](images/9781394297009-fg0816.png)\n\
    \n    Source: [`Lynda.com`](http://Lynda.com), Python for DS ¶ [FIGURE 8-16:](#c08.xhtml#rc08-fig-0016)\
    \ A scatterplot.\n\n*   **Scatterplot matrixes** (see [Figure 8-17](#c08.xhtml#c08-fig-0017))\
    \ place a number of related scatterplots in a visual series that shows correlations\
    \ between multiple variables. A scatterplot matrix is a good choice when you want\
    \ to explore the relationships between several variables. Discovering and verifying\
    \ relationships between variables can help you to identify clusters among variables\
    \ and identify oddball outliers in your dataset.\n\n### Topology structures\n\n\
    *Topology* is the practice of using geometric structures to describe and model\
    \ the relationships and connectedness between entities and variables in a dataset.\
    \ You need to understand basic topology structures so you can accurately structure\
    \ your visual display to match the fundamental underlying structure of the concepts\
    \ you’re representing.\n\n![Source: Lynda.com, Python for DS ¶ FIGURE 8-17: A\
    \ scatterplot matrix.](images/9781394297009-fg0817.png)\n\nSource: [`Lynda.com`](http://Lynda.com),\
    \ Python for DS ¶ [FIGURE 8-17:](#c08.xhtml#rc08-fig-0017) A scatterplot matrix.\n\
    \nThe following list describes a series of topological structures that are popular\
    \ in data science:\n\n*   **Linear topological structures** (see [Figure 8-18](#c08.xhtml#c08-fig-0018))\
    \ represent a pure one-to-one relationship. They’re often used in data visualizations\
    \ that depict time series flow patterns. Any process that can occur only by way\
    \ of a sequential series of dependent events is linear, and you can effectively\
    \ represent it by using this underlying topological structure. ![FIGURE 8-18:\
    \ A linear topology.](images/9781394297009-fg0818.png)\n\n    [FIGURE 8-18:](#c08.xhtml#rc08-fig-0018)\
    \ A linear topology.\n\n*   **Graph models** (see [Figure 8-19](#c08.xhtml#c08-fig-0019))\
    \ underlie group communication networks and traffic flow patterns. You can use\
    \ graph topology to represent many-to-many relationships, like those that form\
    \ the basis of social media platforms.\n\n    ![Remember](images/remember.png)In\
    \ a *many-to-many* relationship structure, each variable or entity has more than\
    \ one link to the other variables or entities in that same dataset.\n\n    ![FIGURE\
    \ 8-19: A graph mesh network topology.](images/9781394297009-fg0819.png)\n\n \
    \   [FIGURE 8-19:](#c08.xhtml#rc08-fig-0019) A graph mesh network topology.\n\n\
    *   **Tree network topologies** (see [Figure 8-20](#c08.xhtml#c08-fig-0020)) represent\
    \ a *hierarchical* classification, where a network is distributed in top-down\
    \ order — nodes act as receivers and distributors of connections, and lines represent\
    \ the connections between nodes. End nodes act only as receivers and not as distributors.\
    \ Hierarchical classification underlies clustering and machine learning methodologies\
    \ in data science. Tree network structures can represent one-to-many relationships,\
    \ such as the ones that underlie a family tree or a taxonomy structure.\n\n###\
    \ Spatial plots and maps\n\nSpatial plots and maps are two different ways of visualizing\
    \ spatial data. A *map* is just a plain figure that represents the location, shape,\
    \ and size of features on the face of the earth. A *spatial plot,* which is visually\
    \ more complex than a map, shows the values for — and location distribution of\
    \ — a spatial feature’s attributes.\n\n![FIGURE 8-20: A hierarchical tree topology.](images/9781394297009-fg0820.png)\n\
    \n[FIGURE 8-20:](#c08.xhtml#rc08-fig-0020) A hierarchical tree topology.\n\nHere\
    \ are a few types of spatial plots and maps that are commonly used in data visualization:\n\
    \n*   **Cloropleth:** Despite its fancy name, a Cloropleth map (see [Figure 8-21](#c08.xhtml#c08-fig-0021))\
    \ is really just spatial data plotted out according to area boundary polygons\
    \ rather than by point, line, or raster coverage. On the map in [Figure 8-21](#c08.xhtml#c08-fig-0021),\
    \ each state boundary represents an *area boundary* polygon. The color and shade\
    \ of the area within each boundary represents the relative value of the attribute\
    \ for that state — where red areas have a higher attribute value and blue areas\
    \ have a smaller attribute value."
