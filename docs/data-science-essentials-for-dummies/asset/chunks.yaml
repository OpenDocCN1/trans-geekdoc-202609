- raw: 'In my Starbucks analogy, the *x*, *y*, *z* coordinates of the store reported
    to you by your smartphone are the most similar to the *x*, *y*, *z* coordinates
    of your current location. In other words, its location is closest in actual physical
    distance. The quantitative *attribute* being compared is distance, your current
    location is the *observation,* and the reported Starbucks coffeehouse is the *most
    similar observation.*


    ![Remember](images/remember.png)Modern nearest neighbor analyses are almost always
    performed using computational algorithms. The nearest neighbor algorithm is known
    as a *single-link algorithm* — an algorithm that merges clusters if the clusters
    share between them at least one *connective edge* (a shared boundary line, in
    other words). In the following sections, you can learn the basics of the average
    nearest neighbor algorithm and the *k*\-nearest neighbor algorithm.


    ## Classifying Data with Average Nearest Neighbor Algorithms


    Average nearest neighbor algorithms are basic yet powerful classification algorithms.
    They’re useful for finding and classifying observations that are most similar
    on average. Average nearest neighbor algorithms are used in pattern recognition,
    in chemical and biological structural analysis, and in spatial data modeling.
    They’re most often used in biology, chemistry, engineering, and geosciences.


    In this section, you can find out how to use average nearest neighbor algorithms
    to compare multiple attributes between observations and, subsequently, identify
    which of your observations are most similar. You can also find out how to use
    average nearest neighbor algorithms to identify significant patterns in the dataset.


    The purpose of using an average nearest neighbor algorithm is to classify observations
    based on the average of the arithmetic distances between them. If your goal is
    to identify and group observations by average similarity, the average nearest
    neighbor algorithm is a useful way to do that.


    With respect to nearest neighbor classifiers, a dataset is composed of observations,
    each of which has an *x*\- and *y*\-variable. An *x*\-variable represents the
    input value, or *feature,* and the *y*\-variable represents the data label, or
    target variable. To keep all these terms straight, consider the following example.


    Suppose your friendly neighborhood business analyst, Business Analyst Stu, is
    using average nearest neighbor algorithms to perform a classification analysis
    of datasets in his organization’s database. Stu is comparing employees based on
    the following five features:


    *   Age


    *   Number of children


    *   Annual income


    *   Seniority


    *   Eligibility to retire


    Here you can see that each employee in Stu’s organization is represented by a
    five-dimensional *tuple* — a finite ordered list (or *sequence*):


    *   **Employee Mike:** (34, 1, 120000, 9, 0)


    *   **Employee Liz:** (42, 0, 90000, 5, 0)


    *   **Employee Jin:** (22, 0, 60000, 2, 0)


    *   **Employee Mary:** (53, 3, 180000, 30, 1)


    These tuples were created from the data in the dataset shown in [Table 5-1](#c05.xhtml#c05-tbl-0001).
    Each tuple consists of data on the following five features: Age, Number of Children,
    Annual Income, Seniority, and Eligibility to Retire as predictive features. Business
    Analyst Stu calculates the average arithmetic differences between each of the
    employees. [Figure 5-8](#c05.xhtml#c05-fig-0008) shows the calculated distances
    between each of the employees.


    [TABLE 5-1](#c05.xhtml#rc05-tbl-0001) Business Analyst Stu’s Employee Data


    | **Employee Name** || **Age** || **Number of Children** || **Annual Income**
    || **Seniority** || **Eligibility to Retire** |


    | --- | --- | --- | --- | --- | --- |


    | Mike || 34 || 1 || $120,000 || 9 || 0 |


    | --- | --- | --- | --- | --- | --- |


    | Liz || 42 || 0 || $90,000 || 5 || 0 |


    | Jin || 22 || 0 || $60,000 || 2 || 0 |


    | Mary || 53 || 3 || $180,000 || 30 || 1 |


    After Business Analyst Stu has this arithmetic measure of distance between the
    employees, he finds the *average nearest neighbor* by taking an average of these
    separation distances. [Figure 5-9](#c05.xhtml#c05-fig-0009) shows that average
    similarity.


    Stu then groups the employees by the average separation distance between them.
    Because the average separation distance values between Mike, Liz, and Jin are
    the smallest, they’re grouped into class 0. Mary’s average separation distances
    are quite unlike the others, so she’s put into her own class — Class 1.


    ![FIGURE 5-8: The distances between the employees’ tuples.](images/9781394297009-fg0508.png)


    [FIGURE 5-8:](#c05.xhtml#rc05-fig-0008) The distances between the employees’ tuples.


    ![FIGURE 5-9: Finding the average similarity between employees.](images/9781394297009-fg0509.png)


    [FIGURE 5-9:](#c05.xhtml#rc05-fig-0009) Finding the average similarity between
    employees.


    Does this make sense? Well, you’re working with a labeled dataset and you can
    see that the attribute Eligibility to Retire assumes only one of two possible
    values. So, yes. If the algorithm predicts two classifications within the data,
    that’s a reasonable prediction. Plus, if Stu gets new incoming data points that
    are unlabeled with respect to a person’s eligibility to retire, he could probably
    use this algorithm to predict for that eligibility, based on the other four features.


    ## Classifying with K-Nearest Neighbor Algorithms


    The best way to define a *k*\-nearest neighbor is to call it a supervised machine
    learning classifier that uses the observations it memorizes from within a test
    dataset to predict classifications for new, unlabeled observations. *k*\-NN makes
    its predictions based on *similarity* — the more similar the training observations
    are to the new, incoming observations, the more likely it is that the classifier
    will assign them both the same class. *k*\-NN works best if the dataset is


    *   Low on noise


    *   Free of outliers


    *   Labeled


    *   Composed only of relevant selected features


    *   Composed of distinguishable groups


    ![Warning](images/warning.png)If you’re working with a large dataset, you may
    want to avoid using *k*\-NN, because it will probably take way too long to make
    predictions from larger datasets.


    ![Tip](images/tip.png)Over on the companion website to this book ([`https://businessgrowth.ai`](https://businessgrowth.ai/)),
    you’ll find a free training-and-coding demonstration of how to build a quick-and-easy
    *k*\-nearest neighbor classifier in Python.


    In the larger context of machine learning, *k*\-NN (like all instance-based learning
    classifiers) is known as a *lazy* machine learning algorithm — in other words,
    it has little to no training phase. It simply memorizes training data and then
    uses that information as the basis on which to classify new observations. The
    goal of the *k*\-NN is to estimate the class of the query point *P* based on the
    classes of its *k*\-nearest neighbors.


    The *k*\-NN algorithm is a generalization of the nearest neighbor algorithm. Instead
    of considering the nearest neighbor, you consider *k* numbers of nearest neighbors
    from within a dataset that contains *n* number of data points — *k* defines how
    many nearest neighbors will have an influence on the classification process. In
    *k*\-NN, the classifier classifies the query point *P* per the classification
    labels found in a majority of *k*\-nearest points surrounding the query point.


    If you know little about the distribution of your dataset, *k*\-NN is definitely
    a good classification method for you to use. What’s more, if you do have a solid
    idea about your dataset’s distribution and *feature selection criteria* (the criteria
    you’re using to identify and remove noise in the dataset), you can leverage this
    information to create significant enhancements in the algorithm’s performance.'
