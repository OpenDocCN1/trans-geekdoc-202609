    `k` 等于 3，图中显示根据距离计算，点 5 有三个最近的邻居。这些邻居是 4、4 和 6。因此，根据 `k`-NN 算法，查询点 `P` 将被分类为 4，因为
    4 是距离其最近的 `k` 个点中的多数数。类似地，`k`-NN 继续使用相同的多数原则来定义其他查询点。


