    book from cover to cover, however — you can glean a great deal from jumping around,
    although now and then you may miss some important context by doing so.


    Within this book, you may note that some web addresses break across two lines
    of text. If you’re reading this book in print and want to visit one of these web
    pages, simply key in the web address exactly as it’s noted in the text, pretending
    as though the line break doesn’t exist. If you’re reading this as an e-book, you’ve
    got it easy — just click the web address to be taken directly to the web page.


    ## Foolish Assumptions


    In writing this book, I’ve assumed that you’re comfortable with advanced tasks
    in Microsoft Excel — pivot tables, grouping, sorting, plotting, and the like.
    Having strong skills in algebra, basic statistics, or even business calculus helps
    as well. Foolish or not, it’s my high hope that all readers have subject matter
    expertise to which they can apply the skills presented in this book. Because data
    scientists need to know the implications and applications of the data insights
    they derive, subject matter expertise is a major requirement for data science.


