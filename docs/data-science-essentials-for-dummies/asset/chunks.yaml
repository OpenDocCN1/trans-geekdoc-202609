  trans: '


    聚类的质量在很大程度上取决于你指定的 `k` 值的正确性。如果你的数据是二维或三维的，可以通过肉眼判断确定 `k` 值的合理范围。在世界银行收入与教育数据散点图中进行目测法聚类（请参考图
    5-2），对 `k` 值的视觉估计等同于三个簇，即 `k = 3`。


    ![Remember](img/remember.png)


    在定义 `k` 值时，可以通过观察散点图（如果你的数据集是二维或三维的）或通过寻找数据集变量中明显且显著的分组来选择质心数量。你可以根据已知数据集中已存在的分组数量，或者你希望在数据集中存在的分组数量来选择质心数量。无论情况如何，在选择要建模的聚类数量时，请利用你对数据集的主观认知。


    然而，如果你的数据集超过了三个维度，你可以使用计算方法来生成一个良好的 `k` 值。其中一种方法是`轮廓系数`（该方法计算每个点到该簇内所有其他点的平均距离，然后将该值与每个其他簇中每个点的平均距离进行比较）。幸运的是，由于`k-means`算法效率很高，它不需要大量的计算机处理能力，你可以轻松地为广泛的
    `k` 值计算此系数。


    `k-means`算法的工作原理是将样本簇中心放置在 `n` 维图中，然后评估向任何单一方向移动它们是否会产生`密度`更高的新中心——换句话说，更多的观测值靠近它。质心从低密度区域移动到高密度区域，直到所有中心都位于局部最大密度区域内（簇的真实中心，每个簇都有最大数量的数据点靠近其簇中心）。尽可能，请尝试自己手动放置质心。如果这不可能，只需随机放置质心并运行几次算法，看看最终得到相同簇的频率有多高。


    `k-means`算法的一个缺点是，它可能会通过将簇中心放置在局部最小密度区域而产生错误结果。这种情况发生在质心丢失在低密度区域时（也就是说，图中绘制点相对较少的区域），且算法驱动的方向性移动（旨在增加点密度的移动）在遥远的簇之间开始反弹和震荡。在这种情况下，质心会被困位于两个高点密度区之间的低密度空间中。这导致了围绕在低局部最小密度区域收敛的中心的错误簇。讽刺的是，当底层数据聚类效果非常良好、即紧凑密集的区域被宽阔稀疏的区域隔开时，这种情况最容易发生。


    ![Tip](img/tip.png)通过本书配套网站托管的免费 `k-means` 聚类代码演示来获得实践经验：[`https://businessgrowth.ai`](https://businessgrowth.ai/)。


    ![Tip](img/tip.png)如需亲自尝试，可以使用 R 语言的 `cluster` 包或 Python 的 `scikit-learn` 库使用
    `k-means` 方法开始对数据进行聚类。有关 R 的 `cluster` 包的更多信息，请查看[`https://cran.r-project.org/web/packages/cluster/cluster.pdf`](https://cran.r-project.org/web/packages/cluster/cluster.pdf)；有关
    `scikit-learn` 的更多信息，请查看[`https://scikit-learn.org`](https://scikit-learn.org/)。


    ### 使用核密度估计估计聚类


    如果 `k-means` 算法不吸引你，另一种识别数据中簇的替代方法是使用密度平滑函数。`核密度估计`(KDE)就是这种平滑方法；它通过在数据集中的每个数据点上放置一个`核`（用于量化密度的加权函数），然后相加这些核来生成整个区域的核密度估计。点密度较大的区域相加后得到较大的核密度，而点密度较小的区域相加后得到较小的核密度。


    由于核平滑方法不依赖质心的放置和聚类技术来估计簇，因此它们没有通过将中心放置在局部最小密度区域而产生错误簇的风险。`k-means`算法在簇之间生成硬性定义，而
    `KDE` 生成的是渐进式的变化。在图 5-3 中，你可以看到空白区域已经减少。当你观察该图时，很明显你可以看到至少三个簇。


    ![FIGURE 5-3: 世界银行收入与教育散点图的 KDE 平滑。](img/9781394297009-fg0503.png)


    FIGURE 5-3: 世界银行收入与教育的 KDE 平滑。


    ### 使用层次算法进行聚类


    层次聚类算法是 `k-means` 的另一种替代方案。与 `k-means` 聚类相比，层次聚类算法是一种更慢、更笨拙的聚类算法。它通过计算距离并在每个观测值与其最近邻居之间生成连接来预测数据集中的分组。如果你正在进行统计研究或分析生物或环境数据，层次聚类可能是你理想的机器学习解决方案。


    为了直上检查层次聚类的结果，请生成一个`树图`（一种描述数据簇中组之间相似性和分支的可视化工具）。你可以使用几种不同的算法来构建树图，你选择的算法决定了分支在簇内何时以及如何发生。此外，树图可以以`自下而上`的方法（通过组合点对然后将它们聚合为越来越大的组）或`自上而下`的方法（从完整数据集开始并将其分成越来越小的组）构建。查看树图结果使得为你的数据集决定合适的聚类数量变得更容易。在图
    5-4 所示的树图示例中，数据集似乎有三个或四个簇。


    ![FIGURE 5-4: 样本树图的示意布局。](img/9781394297009-fg0504.png)


    FIGURE 5-4: 样本树图的示意布局。


    在层次聚类中，观测值之间的距离通过三种不同的方式衡量：`欧几里得`、`曼哈顿`或`余弦`。此外，连接由三种不同的方法形成：`沃德`、`完成`和`平均`。在决定使用什么距离和连接参数时，试错法是一种简单的方法。只需尝试每种组合，然后比较所有的模型结果。选择预测结果最准确的模型。


    '
