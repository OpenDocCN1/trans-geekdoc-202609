    4]`, and point `P` is equal to 5. [Figure 5-10](#c05.xhtml#c05-fig-0010) shows
    how `k`-NN would be applied to this dataset. By specifying that `k` is equal to
    3, the figure shows that, based on distance, there are three nearest neighbors
    to the point 5. Those neighbors are 4, 4, and 6. So, based on the `k`-NN algorithm,
    query point `P` will be classified as 4 because 4 is the majority number in the
    `k` number of points nearest to it. Similarly, `k`-NN continues defining other
    query points using the same majority principle.


    ![Remember](images/remember.png)When using `k`-NN, it’s crucial to choose a `k`
    value that minimizes `noise` (unexplainable random variation). At the same time,
    you must choose a `k` value that includes sufficient data points in the selection
    process. If the data points aren’t uniformly distributed, it’s generally harder
    to predetermine a good `k` value. Be careful to select an optimum `k` value for
    each dataset you’re analyzing.


    ![FIGURE 5-10: How k-NN works.](images/9781394297009-fg0510.png)


    [FIGURE 5-10:](#c05.xhtml#rc05-fig-0010) How `k`-NN works.


    ![Tip](images/tip.png)Large `k` values tend to produce less noise and more `boundary
    smoothing` (clearer definition and less overlap) between classes than small `k`
    values do.


    ### Knowing when to use the k-nearest neighbor algorithm


    `k`-NN is particularly useful for `multi-label learning` — supervised learning
    where the algorithm is applied so that it automatically `learns from` (detects
    patterns in) multiple sets of instances. Each of these sets could potentially
    have several classes of its own. With multi-label learning, the algorithm learns
    to predict multiple class labels for each new instance. With multi-label learning,
    the algorithm learns to predict multiple class labels for each new instance. The
    problem with `k`-NN is that it depends on `distance`.


    ### Solving Real-World Problems with Nearest Neighbor Algorithms


