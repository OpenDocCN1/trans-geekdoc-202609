    \ probably be `way` too slow. \n\n![Tip](images/tip.png)If you want to get started\
    \ working with hierarchical clustering algorithms, check out R’s `hclust` package\
    \ or (again) Python's `scikit-learn` library. (If you're curious about `hclust`,\
    \ check out this page: [`https://stat.ethz.ch/R-manual/R-patched/library/stats/html/hclust.html`](https://stat.ethz.ch/R-manual/R-patched/library/stats/html/hclust.html).)\n\
    \nNeither `k`-means nor hierarchical clustering algorithms perform well when clusters\
    \ are `nonglobular` (a configuration where some points in a cluster are closer\
    \ to points in a different cluster than they are to the center of their own cluster).\
    \ If your dataset shows nonglobular clustering, you can use neighborhood clustering\
    \ algorithms, like `DBScan`, to determine whether each point is closer to its\
    \ neighbors in the same cluster or closer to its neighboring observations in other\
    \ clusters. [Figure 5-5](#c05.xhtml#c05-fig-0005) shows an example of using the\
    \ `DBScan` neighborhood clustering algorithm to detect outliers in the classical\
    \ practice dataset called “Iris,” and the next section covers neighborhood clustering\
    \ in greater detail.\n\n### Dabbling in the DBScan neighborhood\n\n*Density-based\
    \ spatial clustering of applications with noise* (`DBScan`) is an unsupervised\
    \ learning method that works by clustering `core samples` (dense areas of a dataset)\
    \ while simultaneously demarking `noncore samples` (portions of the dataset that\
    \ are comparatively sparse). It’s a neighborhood clustering algorithm that’s ideal\
    \ for examining two or more variables together to identify outliers. It’s particularly\
    \ useful for identifying `collective outliers` (outliers that appear nearby to\
    \ one another, all having similar values that are anomalous to most values in\
    \ the variable). [Figure 5-5](#c05.xhtml#c05-fig-0005) shows `DBScan` at work.\n\
    \n![Remember](images/remember.png)With `DBScan`, you take an iterative, trial-and-error\
    \ approach to find the ideal number of outliers for inspection. When experimenting\
    \ with the `DBScan` model, outliers should comprise 5 percent or less of the dataset’s\
    \ observations. You must adjust the model parameters until you’ve isolated this\
    \ small select group of observations.\n\n![Credit: Python for Data Science Essential\
    \ Training Part 2, LinkedIn.com ¶ FIGURE 5-5: Using DBScan to detect outliers\
    \ (in black) within the Iris dataset.](images/9781394297009-fg0505.png)\n\nCredit:\
    \ Python for Data Science Essential Training Part 2, [`LinkedIn.com`](http://LinkedIn.com)\
    \ ¶ [FIGURE 5-5:](#c05.xhtml#rc05-fig-0005) Using `DBScan` to detect outliers\
    \ (in black) within the Iris dataset.\n\nNeighborhood clustering algorithms are\
    \ generally effective, but they’re subject to the following two weaknesses:\n\n\
    *   **Neighborhood clustering can be computationally expensive.** With every iteration\
    \ of this method, every data point may have to be compared to every other data\
    \ point in the dataset.\n*   **With neighborhood clustering, you may have to provide\
    \ the model with empirical parameter values for expected cluster size and cluster\
    \ density.** If you guess either of these parameters incorrectly, the algorithm\
    \ misidentifies clusters, and you must start the whole long process over again\
    \ to fix the problem. If you choose to use the `DBScan` method, you’re required\
    \ to specify these parameters. (As an alternative, you could try the average nearest\
    \ neighbor and `k`-nearest neighbor algorithms, discussed later in this chapter.)\n\
    \n![Tip](images/tip.png)To avoid making poor guesses for the cluster size and\
    \ cluster density parameters, you can first use a quick `k`-means algorithm to\
    \ determine plausible values.\n\n## Categorizing Data with Decision Tree and Random\
    \ Forest Algorithms\n\nIn cases where clustering algorithms fail, decision tree\
    \ and random forest algorithms may just offer you a perfect alternative machine\
    \ learning solution. At certain times, you can get stuck trying to cluster and\
    \ classify data from a non-numerical dataset. It’s times like these that you can\
    \ use a decision tree model to help cluster and classify your data correctly.\n\
    \nA `decision tree` algorithm works by developing a set of yes-or-no rules that\
    \ you can follow for new data to see exactly how it will be characterized by the\
    \ model. But you must be careful when using decision tree models, because they\
    \ run the high risk of `error propagation`, which occurs whenever one of the model\
    \ rules is incorrect. Errors are generated in the results of decisions that are\
    \ made based on that incorrect rule, and then propagated through every other subsequent\
    \ decision made along that branch of the tree.\n\nTo illustrate this type of algorithm,\
    \ consider a dataset that’s often used in machine learning demonstrations — the\
    \ list of passenger names from the *Titanic.* Using a simple decision tree model,\
    \ you can predict that if a passenger were female or were a male child with a\
    \ large family, that person probably survived the catastrophe. [Figure 5-6](#c05.xhtml#c05-fig-0006)\
    \ illustrates this determination.\n\nLastly, random forest algorithms are a slower\
    \ but more powerful alternative. Instead of building a tree from the data, the\
    \ algorithm creates random trees and then determines which one best classifies\
    \ the testing data. This method eliminates the risk of error propagation that\
    \ is inherent in decision tree models.\n\n![FIGURE 5-6: A decision tree model\
    \ predicts survival rates from the Titanic.](images/9781394297009-fg0506.png)\n\
    \n[FIGURE 5-6:](#c05.xhtml#rc05-fig-0006) A decision tree model predicts survival\
    \ rates from the Titanic.\n\n## Drawing a Line between Clustering and Classification\n\
    \nThe purpose of both clustering and classification algorithms is to make sense\
    \ of, and extract value from, large sets of structured and unstructured data.\
    \ If you’re working with huge volumes of unstructured data, it only makes sense\
    \ to try to partition the data into some sort of logical groupings before trying\
    \ to analyze it. Both clustering and classification methods allow you to take\
    \ a sweeping glance of your data all at once and then form some logical structures\
    \ based on what you find there, before digging deeper.\n\nAlthough a plain-vanilla\
    \ clustering algorithm — like the `k`-means method discussed earlier in this chapter\
    \ — can help you predict subgroups from within unlabeled datasets, there’s way\
    \ more to life than plain vanilla. I think it’s about time to take things one\
    \ step further, by exploring how we can make predictions by grouping labeled data\
    \ instead.\n\n### Introducing instance-based learning classifiers\n\n*Instance-based\
    \ learning classifiers* are supervised, lazy learners — they have no training\
    \ phase, and they simply memorize training data to predict classifications for\
    \ new data points. This type of classifier looks at instances (observations within\
    \ a dataset) and, for each new observation, the classifier searches the training\
    \ data for observations that are most similar and then classifies the new observation\
    \ based on its similarity to instances in the training set. Instance-based classifiers\
    \ include\n\n*   `k`-nearest neighbor (`k`-NN)\n*   Self-organizing maps\n*  \
    \ Locally weighted learning\n\nIf you’re unsure about your dataset’s distribution,\
    \ instance-based classifiers may be a good option, but first make sure that you\
    \ know their limitations. These classifiers aren’t well-suited for\n"
