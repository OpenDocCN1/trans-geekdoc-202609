    想象一下你正在决定是否要去海边。如果下雨，你绝不会去海边；如果室外温度低于 75°F，你就不去。这就是你决策的两个输入因素。你在下雨时不去海边的意愿远大于在温度低于
    75°F 时不去的意愿，因此你相应地为这两个输入分配了权重。对于任何决定是否要去海边的特定实例，你都会考虑这两个标准，将结果汇总，然后决定是否去。如果你决定去，说明你的决策阈值已经得到满足；如果你决定不去，说明你的决策阈值未被满足。这是对神经网络工作原理的一个简单类比。


    ![Remember](img/remember.png)


    现在，来看一个更技术性的定义。最简单的神经网络类型是 `perceptron`（感知机）。它接受多个输入，对它们进行加权，在处理器层上进行求和，然后根据你设置的激活函数和阈值输出结果。`activation
    function`（激活函数）是将输入转换为输出信号的数学函数。处理器层被称为 `hidden layer`（隐藏层）。`neural network`（神经网络）是连接的感知机层，它们作为一个单元共同工作，接受输入并返回指示是否满足某些标准的输出。神经网络的一个关键特点是它们是
    `self-learning`（自学习的——换句话说，它们会根据输入数据的变化进行适应、学习和优化。图 3-2 是感知机结构的示意图。


    *   **深度学习方法：** 该方法在连续层中整合传统的神经网络，提供深层训练以生成预测性输出。我将在下一节中为你详细介绍这个主题。

    *   **集成算法：** 你可以使用集成算法来结合机器学习方法，以获得比任何单一机器学习方法本身都优的结果。


    ![FIGURE 3-2: 神经网络是人工神经单元的连接层。](img/9781394297009-fg0302.png)


    FIGURE 3-2: 神经网络是人工神经单元的连接层。


    ![Tip](img/tip.png) 访问本书的配套网站（[`businessgrowth.ai``](https://businessgrowth.ai/))
    以获取针对你最紧迫需求选择最佳深度学习网络的快速上手指南。


    如果你使用 Gmail，你一定在使用它的自动回复功能（你可以从三条单行消息中选择一条作为对他人发给你信息的自动回复）。Gmail 中的这种自动回复功能被称为
    Smart Reply（智能回复），它是基于深度学习算法的。另一个基于深度学习的创新是 Facebook DeepFace，这是 Facebook 的一项功能，可以自动识别并
    Facebook 照片中出现的人推荐标签。图 3-3 是深度学习网络结构的示意图。


    ![FIGURE 3-3: 深度学习网络是具有多个隐藏层的神经网络。](img/9781394297009-fg0302.png)


    FIGURE 3-3: 深度学习网络是具有多个隐藏层的神经网络。


    ## 使用 Spark 生成实时分析


    Spark 是一种内存级分布式应用程序，你可以用它来分析持续流式数据。因为它以微批（microbatches）的形式处理数据，这些周期可以在几秒钟内完成，这就是为什么它被称为微批处理。


    *   **Spark SQL：** 你使用此模块来处理结构化数据。在 Spark 中，你还可以使用 Hive 查询数据。

    *   **GraphX：** GraphX 库是你存储和处理网络数据的方式。

    *   **Streaming：** Streaming 模块是数据处理的地方。该模块将持续流源分解为更小的数据流，称为 `Dstreams`（换句话说，即离散数据流）。

    *   **MLlib：** MLlib 是 Spark 中用于数据、统计和机器学习算法的。


    Spark 可以处理来自各种存储的数据，包括 Amazon Redshift、Amazon Web Services (AWS)、Apache Cassandra、Hadoop
    分布式文件系统 (HDFS) 和 MongoDB。Spark 由以下子模块组成：


    *   **深度学习方法：** 该方法在连续层中整合传统的神经网络，提供深层训练以生成预测性输出。我将在下一节中为你详细介绍这个主题。

    *   **集成算法：** 你可以使用集成算法来结合机器学习方法，以获得比任何单一机器学习方法本身都优的结果。


    # 第 4 章


    # 数学、概率与统计建模


    ### 本章内容


    *   介绍统计概率的核心基础

    *   量化相关性

    *   减少数据集维度

    *   使用多准则决策构建决策模型

    *   深入回归方法

    *   检测离群值

    *   探讨时间序列分析


    数学和统计并不是许多人所认为的那种可怕怪物。在数据科学中，对这些定量方法的需求仅仅是生活的事实——不必担心。虽然你需要掌握解决问题所需的数学和统计知识，但你不需要为了这些领域去读学位。

