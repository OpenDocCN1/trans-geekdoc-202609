- raw: 'Excel power users often graduate to programming their own macros using VBA.
    Because VBA is a full-fledged programming language, the possibilities from pairing
    Excel with VBA are almost endless. Still, ask yourself this question: If you’re
    going to invest time in learning a programming language, do you need to work within
    the confines of Excel’s spreadsheet structure? If not, you may consider learning
    a scientific computing language, like R or Python. These open-source languages
    have a more user-friendly syntax and are much more flexible and powerful.


    Chapter 8


    # Telling Powerful Stories with Data


    IN THIS CHAPTER


    ![Bullet](images/check.png)**Laying out the basics of data visualization and storytelling**


    ![Bullet](images/check.png)**Choosing the perfect data visualization type for
    the needs of your audience**


    ![Bullet](images/check.png)**Picking the perfect design style**


    ![Bullet](images/check.png)**Crafting clear and powerful visual messages with
    the right data graphic**


    ![Bullet](images/check.png)**Adding context**


    Any standard definition of data science will specify that its purpose is to help
    you extract meaning and value from raw data. Finding and deriving insights from
    raw data is at the crux of data science, but these insights mean nothing if you
    don’t know how to communicate your findings to others. Data visualization and
    storytelling are excellent means by which you can visually communicate your data’s
    meaning. To design effective data visualizations and stories, however, you must
    know and truly understand the target audience and the core purpose for which you’re
    communicating with members of that audience. You must also understand the main
    types of data graphics that are available to you, as well as the significant benefits
    and drawbacks of each one. In this chapter, I present you with the core principles
    of data visualization and data storytelling design.


    A *data visualization* is a visual representation that’s designed for the purpose
    of conveying the meaning and significance of data and data insights. Because data
    visualizations are designed for a whole spectrum of different audiences, different
    purposes, and different skill levels, the first step to designing an effective
    data visualization is to *know your audience.* Audiences come in all shapes, forms,
    and sizes. You might design a data visualization for the young and edgy readers
    of *Wired* magazine or convey scientific findings to a research group. Your audience
    might consist of board members and organizational decision-makers or a local grassroots
    organization.


    The one thing that’s consistent across all audiences, however, is the process
    you should follow when creating your data visualization:


    1.  **Determine the type of data visualization you’ll create, based on your audience
    and the purpose of your visualization.**


    2.  **Decide on a design style for your data visualization.**


    3.  **Choose which graphics make the most sense for your audience.**


    4.  **Test out different types of data graphics with the data, and then pick the
    ones that display the clearest and most obvious answers.**


    5.  **Arrange your data graphics within the data visualization.**


    6.  **Where appropriate, add context to enhance the meaning of the visualization.**


    In this chapter, I walk you through all these steps in sequential order.


    ## Data Visualizations: The Big Three


    Every audience is composed of a unique class of consumers, each with unique data
    visualization needs, so you have to clarify for whom you’re designing. Here are
    the types of data visualization and which audiences they’re best for:


    *   **Data storytelling:** Less-technical business decision-makers


    *   **Data showcasing:** Data implementers, analysts, engineers, scientists, or
    statisticians


    *   **Data art:** Idealists, dreamers, and social change-makers


    I cover each of these types of data visualization in greater detail in the following
    sections.


    ### Data storytelling for decision-makers


    Sometimes, you have to design data visualizations for a less technical-minded
    audience, perhaps in order to help members of this audience make better-informed
    business decisions. The purpose of this type of visualization is to tell your
    audience the story behind the data. In data storytelling, the audience depends
    on you to make sense of the data behind the visualization and then turn useful
    insights into visual stories that they can easily understand.


    With *data storytelling,* your goal should be to use data visualization, words,
    and presentation skills to create a narrative that tells the story — the *meaning,*
    in other words — of the data insights you seek to convey. With respect to the
    data visualization you use within a data story, you want it to be a clutter-free,
    highly focused visualization that enables your audience members to quickly extract
    meaning without having to make much effort. These visualizations are best delivered
    in the form of static images, but more adept decision-makers may prefer to have
    an interactive dashboard that they can use to do a bit of exploration and what-if
    modeling.


    Data storytelling involves more than just data visualization design, though. You
    need to use words and presentation skills to communicate the data story as well.
    You’ll want to use words sparingly within annotations on the data visualization
    itself. Maybe you present the data story with an accompanying slideshow, or maybe
    not — but you should present it with effective presentation skills.


    ### Data showcasing for analysts


    If you’re designing for a crowd of data implementers or other logical, calculating
    analysts, you can create data visualizations that are rather open-ended. The purpose
    of this type of visualization is to help audience members visually explore the
    data and draw their own conclusions.


    When using *data showcasing* techniques, your goal should be to display a lot
    of contextual information that supports audience members as they make their own
    interpretations. These visualizations should include more contextual data and
    less conclusive focus so that people can get in, analyze the data for themselves,
    and then draw their own conclusions. These visualizations are best delivered as
    static images or dynamic, interactive dashboards.


    ### Designing data art for activists


    You might design for an audience of idealists, dreamers, and change-makers. When
    designing for this particular audience, you want your data visualization to make
    a point! You can assume that typical audience members aren’t overly analytical.
    What they lack in math skills, however, they more than compensate for in solid
    convictions.


    These people look to your data visualization as a vehicle by which to make a statement.
    When designing for this audience, data art is the way to go. The main goal in
    using *data art* is to entertain, to provoke, to annoy, or to do whatever it takes
    to make a loud, clear, attention-demanding statement. Data art has little to no
    narrative and offers no room for viewers to form their own interpretations.


    ![Remember](images/remember.png)Data scientists have an ethical responsibility
    to always represent data accurately. A data scientist should never distort the
    message of the data to fit what the audience wants to hear — not even for data
    art! Nontechnical audiences don’t even recognize, let alone see, the possible
    issues. They rely on the data scientist to provide honest and accurate representations,
    thus amplifying the level of ethical responsibility that the data scientist must
    assume.


    ## Designing to Meet the Needs of Your Target Audience


    To make a functional data visualization, you must get to know your target audience
    and then design precisely for their needs. But to make every design decision with
    your target audience in mind, you need to take a few steps to make sure that you
    truly understand your data visualization’s target consumers.


    To gain the insights you need about your audience and your purpose, follow this
    process:'
