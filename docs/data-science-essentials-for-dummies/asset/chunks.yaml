    accent="true"><m:mi>y</m:mi><m:mo>&#175;</m:mo></m:mover></m:mrow><m:mo)</m:mo></m:mrow></m:mrow><m:mn>2</m:mn></m:msup></m:mrow></m:msqrt></m:mrow></m:mfrac></m:mrow></m:math>


    *   `ρ` = Spearman’s rank correlation

    *   `d` = difference between

    *   `n` = total number


    ### Reducing Dimensionality


    Okay, what can you do with all this? Well, for starters, you need to reduce the
    dimensionality. In this section, you see what’s involved in `value decomposition`
    (SVD), which decomposes a matrix into three resultant matrices. Because the linear
    algebra involved is rooted in SVD, let’s look at how it works. machine learning
    folks call `principal component analysis` (PCA). The product of these matrices,
    when multiplied together, gives you back your original matrix. SVD is handy when
    you want to compress or clean dataset uncover `latent variables` (inferred variables
    hidden within dataset). Here are the two main ways to use SVD:


    *   **Compressing sparse matrices:** If you have a clean yet sparse dataset, you
    don’t want to remove any of the information, but you do need to compress it down
    into a manageable number of variables, so you can use them. A handy thing about
    SVD is that it allows you to set the number of variables, it creates from your
    original dataset. And if you don’t remove any of those components, you’ll reduce
    the size of your dataset without losing any of its information. This process is
    illustrated in [Figure 4-3](#c04.xhtml#c04-fig-0003).

    *   **Cleaning and compressing dirty data:** In other cases, you can use SVD to
    do an algorithmic cleanse of a dirty, noisy dataset. In this case you’d apply
    SVD to uncover your components, and then decide which of them to keep by looking
    at their variance. The industry standard is that explained variance of the components
    you keep should add up to at least 75 percent. This ensures that at least 75 percent
    of the dataset’s original information has been retained within the components
    you’ve kept. This process is shown in [Figure 4-4](#c04.xhtml#c04-fig-0004).


