    ![Remember](images/remember.png) Whether you’re a data visualization designer
    or a consumer, be aware of some common pitfalls in data visualization. Simply
    put, a data visualization can be misleading if it isn’t constructed correctly.
    Common problems include pie charts that don’t add up to 100 percent, bar charts
    with a scale that starts in a strange place, and multicolumn bar charts with vertical
    axes that don’t match.


    ![FIGURE 8-23: A raster surface map.](images/9781394297009-fg0823.png)


    [FIGURE 8-23:](#c08.xhtml#rc08-fig-0023) A raster surface map.


    ## Testing Data Graphics


    Your data visualizations must convey clear and powerful visual messages. To make
    that happen, you have to test various data graphics and select only the most effective
    ones to include in the final data visualization. For example, the two data graphics
    shown in [Figure 8-24](#c08.xhtml#c08-fig-0024) represent exactly the same statistic.


    ![FIGURE 8-24: Here you see the importance of selecting effective data graphics.](images/9781394297009-fg0824.png)


    [FIGURE 8-24:](#c08.xhtml#rc08-fig-0024) Here you see the importance of selecting
    effective data graphics.


    Notice how the data graphic on the right does a much better job of visually emphasizing
    the difference in numeric values? You should always test different data graphics,
    to make sure that you use the one that most clearly and effectively displays your
    data. The graphic on the left is *not* effective. To choose only the most effective
    data graphics for inclusion in your data visualization, simply follow these four
    steps:


    1. **Make a list of the questions that your data is meant to answer.**

    2. **Determine the data visualization type: data storytelling, data showcasing,
    or data art.**

    3. **Select options from among appropriate data graphic types for that type of
    data visualization.**

    4. **Test those data graphics with your data — see for yourself which graphic
    type displays the most clear and obvious answers to your questions.**


    ![Tip](images/tip.png) After testing different data graphics and deciding what
    you want to use, arrange those graphics within your data visualization. You can
    do that using either Python or R or a spreadsheet (see [Chapter 6](#c06.xhtml)).
    Alternatively, to create your data visualization using an online data visualization
    design tool, you may find my guide helpful: *Web-Based Data Visualization Design
    Tools — Top 10.* You can find it at [`https://businessgrowth.ai`](https://businessgrowth.ai/).


    ## Adding Context


    After you know exactly which data graphics you’ll use, you need to decide whether
    and how you’ll create the necessary context to add more meaning to the data visualization.
    Adding context helps people understand the value and relative significance of
    the information your data visualization conveys. Adding context to calculating,
    exacting data visualization styles helps to create a sense of relative perspective,
    but in pure data art you may consider omitting additional context. That’s because,
    with data art, you’re only trying to make a single point and you don’t want to
    add information that would distract from that point.


    ### Creating context with data


    In data showcasing, you should include relevant contextual data for the key metrics
    shown in your data visualization — in a situation where you’re creating a data
    visualization that describes conversion rates for e-commerce sales, for example.
    The key metric would be represented by the percentage of users who convert to
    customers by making a purchase. Contextual data that’s relevant to this metric
    may include shopping cart abandonment rates, average number of sessions before
    a user makes a purchase, average number of pages visited before making a purchase,
    or specific pages that are visited before a customer decides to convert. This
    sort of contextual information helps viewers understand the why and how behind
    sales conversions.


    ![Remember](images/remember.png) Adding contextual data tends to decentralize
    the focus of the data.


    ### Creating context with annotations


    Sometimes, you can more appropriately create context by including annotations
    that provide a header and a small description of the data. Good annotation is
    helpful to both analytical and nonanalytical audiences.


    ### Creating context with graphical elements


    Another effective way to create context in a data visualization is to include
    graphical elements that convey the relative significance of the data. Such graphical
    elements include moving average trend lines, single-value alerts, target trend
    lines (as shown in [Figure 8-26](#c08.xhtml#c08-fig-0026)), and predictive benchmarks.

