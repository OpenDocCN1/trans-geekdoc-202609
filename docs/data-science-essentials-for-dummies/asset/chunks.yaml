- raw: 'In the following sections, I introduce concepts that are fundamental to data
    science and data engineering, as well as the hybrid machine learning engineering
    role. Then I show you how these roles function in an organization’s data team.


    ### Defining data science


    If *science* is a systematic method by which people study and explain domain-specific
    phenomena that occur in the natural world, you can think of *data science* as
    the scientific domain that’s dedicated to knowledge discovery via data analysis.


    Data scientists use mathematical techniques and algorithmic approaches to derive
    solutions to complex business and scientific problems. Data science practitioners
    use its predictive methods to derive insights that are otherwise unattainable.
    In business and in science, data science methods can provide more robust decision-making
    capabilities:


    *   **In business,** the purpose of data science is to empower businesses and
    organizations with the data insights they need in order to optimize organizational
    processes for maximum efficiency and revenue generation.


    *   **In science,** data science methods are used to derive results and develop
    protocols for achieving the specific scientific goal at hand.


    Data science is a vast and multidisciplinary field. To call yourself a true data
    scientist, you need to have expertise in math and statistics, computer programming,
    and your own domain-specific subject matter.


    Using data science skills, you can do cool things like the following:


    *   Use *machine learning* (the practice of applying algorithms to learn from
    — and make automated predictions from — data) to optimize energy usage and lower
    corporate carbon footprints.


    *   Optimize tactical strategies to achieve goals in business and science.


    *   Predict for unknown contaminant levels from sparse environmental datasets.


    *   Design automated theft- and fraud-prevention systems to detect anomalies and
    trigger alarms based on algorithmic results.


    *   Craft site-recommendation engines for use in land acquisitions and real estate
    development.


    *   Implement and interpret predictive analytics and forecasting techniques for
    net increases in business value.


    Data scientists must have extensive and diverse quantitative expertise to be able
    to solve these types of problems.


    ### Defining machine learning engineering


    A *machine learning engineer* is essentially a software engineer who is skilled
    enough in data science to deploy advanced data science models within the applications
    they build, thus bringing machine learning models into production in a live environment
    like a software as a service (SaaS) product or even just a web page.


    Contrary to what you may have guessed, the role of machine learning engineer is
    a hybrid between a data scientist and a software engineer, *not* a data engineer.
    A machine learning engineer is, at their core, a well-rounded software engineer
    who also has a solid foundation in machine learning and AI. This person doesn’t
    need to know as much data science as a data scientist, but they should know much
    more about computer science and software development than a typical data scientist.


    ### Defining data engineering


    If *engineering* is the practice of using science and technology to design and
    build systems that solve problems, you can think of *data engineering* as the
    engineering domain that’s dedicated to building and maintaining data systems for
    overcoming data processing bottlenecks and data handling problems that arise from
    handling the high volume, velocity, and variety of data.


    Data engineers use skills in computer science and software engineering to design
    systems for, and solve problems with, handling and manipulating datasets. Data
    engineers often have experience working with (and designing) real-time processing
    frameworks, as well as with RDBMSs. They generally code in Java, C++, Python,
    or Scala. They know how to deploy Spark to handle, process, and refine raw data
    into datasets with more manageable sizes. Simply put, with respect to data science,
    the purpose of data engineering is to engineer large-scale data solutions by building
    coherent, modular, and scalable data processing platforms from which data scientists
    can subsequently derive insights.


    ![Remember](images/remember.png)Most engineered systems are *built* systems —
    they’re constructed or manufactured in the physical world. Data engineering is
    different, though. It involves designing, building, and implementing software
    solutions to problems in the data world — a world that can seem abstract when
    compared to the physical reality of the Golden Gate Bridge or the Aswan High Dam.


    Using data engineering skills, you can, for example:


    *   Integrate data pipelines with the natural language processing (NLP) services
    that were built by data scientists at your company.


    *   Build mission-critical data platforms capable of processing more than 10 billion
    transactions per day.


    *   Tear down data silos by finally migrating your company’s data from a legacy
    on-premises data storage environment to a cutting-edge cloud warehouse.


    *   Enhance and maintain existing data infrastructure and data pipelines.


    Data engineers need solid skills in computer science, database design, and software
    engineering to be able to perform this type of work.


    ### Comparing machine learning engineers, data scientists, and data engineers


    The roles of data scientist, machine learning engineer, and data engineer are
    frequently conflated by hiring managers. If you look around at most position descriptions
    for companies that are hiring, they often mismatch the titles and roles or simply
    expect applicants to be the Swiss Army knife of data skills and be able to do
    them all.


    ![Tip](images/tip.png)If you’re hiring someone to help make sense of your data,
    be sure to define the requirements clearly before writing the position description.
    Because data scientists must also have subject matter expertise in the particular
    areas in which they work, this requirement generally precludes data scientists
    from also having much expertise in data engineering. And, if you hire a data engineer
    who has data science skills, that person generally won’t have much subject matter
    expertise outside of the data domain. Be prepared to call in a subject matter
    expert (SME) to help out.


    Because many organizations combine and confuse roles in their data projects, data
    scientists are sometimes stuck having to learn to do the job of a data engineer
    — and vice versa. To come up with the highest-quality work product in the least
    amount of time, hire a data engineer to store, migrate, and process your data;
    a data scientist to make sense of it for you; and a machine learning engineer
    to bring your machine learning models into production.


    ![Remember](images/remember.png)Lastly, keep in mind that data engineer, machine
    learning engineer, and data scientist are just three small roles within a larger
    organizational structure. Managers, midlevel employees, and business leaders also
    play a huge part in the success of any data-driven initiative.


    ## Storing and Processing Data for Data Science


    In the following sections, I explain the basics of what’s involved in both cloud
    and on-premises data storage and processing.


    ### Storing data and doing data science directly in the cloud


    After you’ve realized the upside potential of storing data in the cloud, it’s
    hard to look back. Storing data in a cloud environment offers serious business
    advantages:


    *   **Faster time to market (TTM):** Many cloud service providers take care of
    the bulk of the work that’s required to configure, maintain, and provision the
    computing resources that are required to run jobs within a defined system — also
    known as a *compute environment.* This dramatically increases ease of use and
    ultimately allows for faster TTM for data products.'
