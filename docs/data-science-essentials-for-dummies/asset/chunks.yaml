    ![Bullet](img/check.png)揭秘数据后的故事

    ![Bullet](img/check.png)查看重要数据源

    ![Bullet](img/check.png)区分数据科学与数据工程

    ![Bullet](img/check.png)将数据存储在本地或云端

    ![Bullet](img/check.png)探索其他数据工程解决方案


    尽管数据和人工智能（AI）在公众眼中是极具趣味的话题，但大多数外行人士并不真正了解数据是什么，也不了解它是如何被用来改善人们生活的。


    本章将为你介绍现代数据生态系统的完整故事；解释数据源自何处以及如何被使用；并概述了机器学习工程师、数据工程工程师和数据科学家所扮演的角色。在本章中，我将介绍与数据科学中存储和处理数据相关的基础概念，以便这些信息能够成为你制定利用数据科学提升业务性能计划的依据。


    ## 定义“三个 V” (The Three Vs)


    如果公司想要保持竞争力，就必须精通并擅长将数据洞察融入到其流程、产品，以及增长和管理策略中。考虑到由于 COVID-19 疫情直接导致的数字化转型爆炸式增长，这一点尤为真实。无论你的数据量是
    TB（太字节）级还是 PB（拍字节）级，数据工程解决方案的设计都必须满足数据预期去向和用途的要求。


    三个特征——也被称为“三个 V”——是你理解数据的关键标识：数据量（volume）、速度（velocity）和多样性（variety）。由于数据的三个 V
    在不断扩大，必须不断开发更新、更具创新性的技术来应对这些问题。


    ### 应对数据量 (Data Volume)


    在原始形式下，绝大多数数据都是`低价值`的——换句话说，原始数据中价值与数据数量的比例很低。许多数据是由大量各种格式的极微小交易组成的。这些增量组件只有在经过聚合和分析后才能产生真正的价值。粗略来说，数据工程师的工作是聚合数据，而数据科学家的工作是分析数据。


    ### 处理数据速度 (Data Velocity)


    如今，大多数数据是通过自动化流程和仪器创建的，由于数据存储成本相对低廉，系统速度在很多时候是限制因素。请记住，原始数据是低价值的。因此，你需要能够在短时间内接入大量数据的系统，以产生及时且有价值的洞察。


    在工程术语中，`data velocity` 是单位时间的数据。延迟（Latency）是所有数据系统的特征，它量化了系统在接收指令移动数据后的延迟。许多数据工程系统被要求延迟小于
    100 毫秒（衡量标准是从数据创建到系统响应的时间）。


    `吞吐量`（Throughput）是一个描述系统单位时间内工作能力的特征。在数据系统中，吞吐量需求可以轻松达到每秒 1,000 条消息！高速度、实时的移动数据为及时决策带来了障碍。数据处理技术和数据分析技术的能力往往限制了数据速度。


    将数据输入系统的工具——也被称为数据摄取工具（data ingestion tools）有多种类型。


    ### 处理数据多样性 (Data Variety)


    当你向结构化数据源中添加非结构化和半结构化数据时，数据的解释会变得更加复杂。这种`高多样性`（high-variety）数据来自多种来源。它最显著的点是，是由不同底层结构（结构化、非结构化或半结构化）的数据集组合而成的。异构的高多样性数据通常由图数据数据、JSON
    文件、XML 文件、社交媒体数据、结构化表格数据、Weblog 数据以及从网页用户点击产生的数据（也称为`click-streams`，点击流）的任何组合组成。


    `结构化数据`可以在关系数据库管理系统（RDBMS）中进行存储、处理和操作——这类系统的示例是使用 PostgreSQL 的数据库。这种类型系统最显著的点是由具有不同底层结构（结构化、非结构化或半结构化）的数据集组合而成的。使用行和列的数据库架构。`非结构化数据`是完全非结构化的，源于博客文章、电子邮件和
    Word 文档。`半结构化数据`不符合结构化数据库，但尽管通过标签进行组织，这种数据常见于日志文件、XML 文件或 JSON 文件。


    ![Tip](img/tip.png)熟悉`data lake`（数据湖）这一术语。从业人员使用该术语指的是一种非分层数据存储系统，用于存储海量的多结构化数据，且这些数据并非以任何方式关联的扁化存储架构。你可以使用
    Amazon Simple Storage Service (S3) 平台或类似的云存储解决方案来满足相同的需求。（Amazon S3 平台是目前流行的云架构之一。）


    ![Warning](img/warning.png)尽管`data lake`和`data warehouse`（数据仓库）这两个术语都用于存储数据，但它们指的是不同类型的系统。`Data
    lake`在前文中已有定义；`data warehouse`是一个仅用于存储和访问结构化数据的中央存储库。商业智能解决方案中常用的更传统的数据仓库系统是`data
    mart`（数据市）——一种你可以用于存储公司特定业务线关注领域数据的存储系统。


    ## 识别重要数据源


    海量数据不断由人类、机器和传感器产生。典型来源包括来自社交媒体、金融交易、健康记录、点击流、日志文件以及物联网（IoT）——一种连接消费者日常生活中使用的不断扩展的设备的数字网络。


    ## 理解数据方法之间的差异


    数据科学、机器学习工程和数据工程涵盖了`数据范式`（data paradigm）中的不同功能；这种范式是指对海量速度、多样性的结构化、非结构化和半结构化数据，使用与几十年前完全不同的技术进行捕、处理、存储和分析。


    所有这些功能对于从原始数据中获取知识和可操作的见解都是用的。它们都是任何综合决策支持系统的基本要素，在制定未来业务增长的稳健策略时也都非常有帮助。


