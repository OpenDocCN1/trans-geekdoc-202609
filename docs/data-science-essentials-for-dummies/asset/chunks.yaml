    Bridging the gap between no-code, low-code, SQL, and spreadsheets, SQL databases
    and spreadsheet applications such as Excel and Google Sheets provide just the
    no-code and low-code environments that knowledge workers can start using today
    to increase the productivity and profitability of their company’s data. These
    technologies are so accessible and represent so much upside potential to modern
    businesses that I include high-level coverage of them in the pages that follow.


    ## Getting a Handle on SQL and Relational Databases


    Some data professionals are resistant to learning SQL because of the steep learning
    curve involved. They think, “I’m not a coder, and Structured Query Language sure
    sounds like a programming language to me.” In the case of SQL, though, it’s not
    a programming language, as you’ll soon see. As far as the upside potential goes
    of learning to use SQL to query and access data, it’s worth the small degree of
    hassle.


    SQL is a standard for creating, maintaining, and securing relational databases.
    It’s a set of rules you can use to quickly and efficiently query, update, modify,
    add, or remove data from large and complex databases. You use SQL rather than
    Python or a spreadsheet application to do these tasks because SQL is the simplest,
    fastest way to get the job done. It offers a plain and standardized set of core
    commands and methods that are easy to use when performing these tasks. In this
    chapter, I introduce you to basic SQL concepts and explain how you can use SQL
    to do cool things like query, join, sort, and even structured datasets. Although
    the SQL standard is lengthy, a user commonly needs fewer than 20 commands, and
    the syntax is human-readable — for example, if you need to pull data on employees
    in finance department who earn more than $50,000 per year, you could use an SQL
    statement like the one shown in Figure 7-1. Making things even easier, SQL commands
    are written in all caps, which helps to keep the language distinct and separate
    in your mind from other programming languages.


    Although you can use SQL to work with structured data that resides in relational
    database systems, you can’t use standard SQL as a solution for unstructured data.
    I discuss data engineering in `Chapter 2`. For now, suffice to say that SQL is
    simply a tool you can use to manipulate and edit structured tables. It’s nothing
    exceedingly, but it can be helpful to use SQL for the data querying and manipulation
    tasks that arise in data science.


    One fundamental characteristic of SQL is that you can use it on structured data
    that sits in a relational database. SQL database management systems (DBMSs) optimize
    their own structure with minimal user input, which enables blazing-fast operational
    performance. An `index` is the lookup table. You create it in order to index,
    point to, and “look up” data in tables. Although DBMSs are known for their fast
    database querying capabilities, this speed and effectiveness are heavily dependent
    on good indexing. Good indexing is vital for fast data retrieval in SQL.


    Similar to how different web browsers comply with, add to, and ignore different
    parts of the HTML standard in different ways, SQL rules are interpreted a bit
    differently, depending on whether you’re working with open-source products or
    commercial vendor applications. Because not every SQL solution is the same, it’s
    a good idea to know something about the benefits and drawbacks of some the more
    popular SQL solutions on the market. Here are two popular open-source SQL implementations
    commonly used by data scientists:


    - MySQL: By far the most popular open-source version of SQL, `MySQL` offers a
    complete and powerful version of SQL. It’s used on the back end of millions of
    websites.

    - PostgreSQL: This `PostgreSQL` software adds object-oriented elements to SQL’s
    relational language, making it popular with programmers who want to integrate
    SQL objects into their own platforms’ object model.


    Other powerful SQL implementations, such as Oracle and Microsoft SQL Server, are
    great solutions as well, but they’re designed for use in a more traditional business
    context than as a data science tool.


    As you may guess from the name, the most salient aspect of relational databases
    is that they’re relational — they’re composed of related tables. To illustrate
    the idea of a relational database, first imagine an Excel spreadsheet with rows,
    columns, and predefined relationships between shared columns. Then imagine having
    an Excel workbook with many worksheets (tables), in which every worksheet has
    a column with the same name as a column in one or more other worksheets. Because
    these worksheets have a shared relationship, if you use SQL you can use that shared
    relationship to look up data in all related worksheets. This type of relationship
    is illustrated in Figure 7-2.


    The `primary key` of a table is a column of values that uniquely identifies every
    row in that table. A good example of primary keys is the use of ISBNs for a table
    of books or employee ID numbers for a table of employees. A `foreign key` is a
    column in one table that matches the primary key of another and is used to link
    tables.


    Keeping the focus on terminology, remember that proper database science often
    associates particular meanings to particular words, as you can see in this list:


    - Columns, called `fields`, `keys`, and `attributes`

    - Rows, called `records`

    - Cells, called `values`


    Database science uses a lot of synonyms. For simplicity’s sake, I try to stick
    to using the words `column`, `row`, and `cell`. And because `primary key` and
    `foreign key` are standard terms, I use them to describe these two special column
    types.


