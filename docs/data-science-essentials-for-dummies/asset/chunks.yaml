    ## About the Author


    **Lillian Pierson, PE,** is the founder and fractional CMO at Data-Mania, as well
    as a globally recognized growth leader in technology. To date, she has helped
    educate approximately 2 million professionals on topics related to AI, growth,
    data strategy, and data science.


    She is the author of dozens of data-intensive books and courses, in deep partnership
    with both John Wiley & Sons and LinkedIn Learning, among others. Lillian has supported
    a wide variety of organizations globally, from the United Nations and *National
    Geographic* to Ericsson and Saudi Aramco and everything in between.


    A licensed professional engineer in good standing, Lillian has been both a technical
    and marketing consultant since 2007 and a growth adviser since 2018.


    ## Dedication


    To Vitaly, Ariana, and Stasik. I love you all so much — you make my world go ’round.


