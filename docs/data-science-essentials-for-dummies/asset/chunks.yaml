    Visualization Design Tools: Top 10 Guide* at [`https://businessgrowth.ai`](https://businessgrowth.ai/).


    ![FIGURE 8-1: This design style conveys a calculating and exacting feel.](images/9781394297009-fg0801.png)


    [FIGURE 8-1:](#c08.xhtml#rc08-fig-0001) This design style conveys a calculating
    and exacting feel.


    ### Eliciting a strong emotional response


    If you’re designing a data visualization to influence or persuade people, incorporate
    design artistry that invokes an emotional response in your target audience. These
    visualizations usually fall under the data art category, but an extremely creative
    data storytelling piece can also inspire this sort of strong emotional response.
    Emotionally provocative data visualizations often support the stance of one side
    of a social, political, or environmental issue. These data visualizations include
    fluid, artistic design elements that flow and meander, as shown in [Figure 8-2](#c08.xhtml#c08-fig-0002).
    Additionally, rich, dramatic color choices can influence the emotions of the viewer.
    This style of data visualization leaves a lot of room for artistic creativity
    and experimentation.


    ![Tip](images/tip.png)Keep artistic elements relevant — and recognize when they’re
    likely to detract from the impression you want to make, particularly when you’re
    designing for analytical types.


    ![FIGURE 8-2: This design style is intended to evoke an emotional response.](images/9781394297009-fg0802.png)


    [FIGURE 8-2:](#c08.xhtml#rc08-fig-0002) This design style is intended to evoke
    an emotional response.


    ## Selecting the Appropriate Data Graphic Type


    Your choice of data graphic type can make or break a data visualization. In case
    it’s unclear, a `data graphic` is the graphical element that depicts your data
    insight in visual format (see [Figure 8-3](#c08.xhtml#c08-fig-0003)). Most data
    visualizations have more than one data graphic within them.


    ![FIGURE 8-3: Data visualization versus data graphics.](images/9781394297009-fg0803.png)


    [FIGURE 8-3:](#c08.xhtml#rc08-fig-0003) Data visualization versus data graphics.


    Because you probably need to represent many different facets of your data, you
    can mix and match among the different graphical classes and types. Even among
    the same class, certain graphic types perform better than others; therefore, it’s
    a good idea to create several different mockups to see which graphic type conveys
    the clearest and most obvious message.


    ![Warning](images/warning.png)This book introduces only the most commonly used
    graphic types (among hundreds that are available). Don’t wander too far off the
    beaten path. The further you stray from familiar graphics, the harder it becomes
    for people to understand the information you’re trying to convey.


    ![Remember](images/remember.png)Keep artistic elements relevant — and recognize
    when they’re likely to detract from the impression you want to make, particularly
    when you’re designing for analytical types.


