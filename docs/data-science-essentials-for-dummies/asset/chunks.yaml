    \ Excel tasks with macros\n\n*Macros* are prescripted routines written in Visual\
    \ Basic for Applications (VBA). You can use macros to decrease the amount of manual\
    \ processing you need to do when working with data in Excel. For example, within\
    \ Excel, macros can act as a set of functions and commands that you can use to\
    \ automate a wide variety of tasks. If you want to save time (and hassle) by automating\
    \ Excel tasks that you routinely repeat, use macros.\n\nTo access macros, first\
    \ activate Excel’s Developer tab from within the Options menu on the File tab.\
    \ (In other words, after opening the Options menu, choose Customize Ribbon from\
    \ your choices on the left and then click to select the Developer check box in\
