    \ some of the pressure off when you’re dealing with the time-consuming tasks of\
    \ storing and querying data, saving precious time and effort.\n\n## Narrowing\
    \ the Focus with SQL Functions\n\nWhen working with SQL commands, you use functions\
    \ to perform tasks, and arguments to more narrowly specify those tasks. To query\
    \ a particular set from within your data tables, for example, use the `SELECT`\
    \ function. To combine separate tables into one, use the `JOIN` function. To place\
    \ limits on the data that your query returns, use a `WHERE` argument. As I mention\
    \ earlier in this chapter, fewer than 20 commands are commonly used in SQL. This\
    \ section introduces `SELECT`, `FROM`, `JOIN`, `WHERE`, `GROUP`, `MAX()`, `MIN()`,\
    \ `COUNT()`, `AVG()`, and `HAVING`.\n\nThe most common SQL command is `SELECT`.\
    \ You can use this function to generate a list of search results based on designated\
    \ criteria. To illustrate, imagine the film-rating scenario mentioned earlier\
    \ in this chapter with a tiny database of movie ratings that contains the three\
    \ tables Film, Genre, and Rating.\n\nTo generate a printout of all data `FROM`\
    \ the Rating table, use the `SELECT` function. Any function with `SELECT` is called\
    \ a query, and `SELECT` functions accept different arguments to narrow down or\
    \ expand the data that is returned. An asterisk (`*`) represents a wildcard, so\
    \ the asterisk in `SELECT *` tells the interpreter (the SQL component that carries\
    \ out all SQL statements) to show every column in the table. You can then use\
    \ the `WHERE` argument to limit the output to only certain values. For example,\
    \ here is the complete Rating table:\n\n```\nRating timestamp id rating 2011-08-03\
    \ 16:04:23 1 4 2014-02-19 19:17:16 2 5 2010-04-27 10:05:36 2 4 2011-04-05 21:21:05\
    \ 3 4 2014-02-21 00:11:07 3 3\n```\n\nIf you want to limit your ratings to those\
    \ made after a certain time, you'd use code like the following:\n\n```\nSELECT\
    \ * FROM RatingWHERE Rating.timestamp >= date('2014-01-01')\ntimestamp id rating2014-02-19\
    \ 19:17:16 2 52014-02-21 00:11:07 3 3\n```\n\nHere, the `DATE()` function turns\
    \ a string into a date that can then be compared with the `timestamp` column.\n\
    \nYou can also use SQL to join columns into a new data table. Joins are made on\
    \ the basis of shared (or compared) data in a particular column (or columns).\
    \ You can execute a join in SQL in several ways, but the ones listed here are\
    \ probably the most popular:\n\n- **Inner join**: The default `JOIN` type; returns\
    \ all records that lie in the intersecting regions between the tables being queried\n\
    - **Outer join**: Returns all records that lie outside the overlapping regions\
    \ between queried data tables\n- **Full outer join**: Returns all records that\
    \ lie both inside and outside the overlapping regions between queried data tables\
    \ — in other words, returns all records for both tables\n- **Left join**: Returns\
    \ all records that reside in the leftmost table\n- **Right join**: Returns all\
    \ records that reside in the rightmost table\n\n![Remember](images/remember.png)\
    \ \nBe sure to differentiate between an inner join and an outer join, because\
    \ these functions handle missing data in different ways. As an example of a join\
    \ in SQL, if you want a list of films that includes genres, you use an inner join\
    \ between the Film and Genre tables to return only the results that intersect\
    \ (overlap) between the two tables.\n\nTo refresh your memory, here are the two\
    \ tables you're interested in:\n\n```\nFilm id title 1 The Even Couple 2 The Fourth\
    \ Man 3 All About Adam 4 Dr. Yes\n```\n\n```\nGenre id genre 2 Drama 3 Drama 4\
    \ Thriller\n```\n\nHere’s how you’d use an inner join to find the information\
    \ you want:\n\n```\nSELECT Film.id, Film.title, Genre.genreFROM FilmJOIN Genre\
    \ On Genre.id=Film.idid title genre2 The Fourth Man3 All About Adam4 Dr. Yes\n\
    ```\n"
  trans: "\n\n-   我本可以将 `Genre`（类型）指定为 `Film` 表中的单独列，但将其放在单独的表中更好，因为这允许存在缺失的数据值（`NULL`\
    \ 值）。看看刚刚显示的 `Film` 表。`Film 1` 没有被分配类型。如果将 `Genre` 列包含在此表中，那么 `Film 1` 在该处将有一个\
    \ `NULL` 值。与其拥有一个包含 `NULL` 值的列，不如创建一个单独的 `Genre` 数据表简单得多。`Genre` 表的主键与 `Film`\
    \ 表的主键并不完全一致，但在进行连接（join）时它们并不需要一致。\n\n![Tip](img/tip.png) \n当你运行 `SELECT` 查询时，`NULL`\
    \ 值可能会非常棘手。当你根据特定属性的值进行查询时，任何在该属性具有 `NULL` 值的记录将不会出现在查询结果中。当然，这些记录仍然存在，它们甚至可能落在你为查询定义的特定取值范围内，但如果记录具有\
    \ `NULL` 值，它就会从查询结果中被排除。在这种情况下，你可能会在分析中漏掉它们。\n\n任何称职的数据科学家在处理数据或科学问题时必须应对许多挑战。当你处理存储和查询数据这些耗时任务时，SQL\
    \ 可以减轻一些压力，节省宝贵的时间和精力。\n\n## 使用 SQL 函数缩小范围\n\n在操作 SQL 命令时，你使用函数来执行任务，并使用参数来更细致地指定这些任务。例如，要从数据表中查询特定集合，请使用\
    \ `SELECT` 函数。要将单独的表合并为一个表，请使用 `JOIN` 函数。要对查询返回的数据设置限制，请使用 `WHERE` 参数。正如在本章开头提到的，SQL\
    \ 中常用的命令少于 20 种。本节介绍了 `SELECT`、`FROM`、`JOIN`、`WHERE`、`GROUP`、`MAX()`、`MIN()`、`COUNT()`、`AVG()`\
    \ 和 `HAVING`。\n\n最常用的 SQL 命令是 `SELECT`。你可以使用此函数根据指定标准生成搜索结果列表。为了说明，请想象本章之前提到的电影评分场景，其中有一个包含\
    \ `Film`、`Genre` 和 `Rating` 三张表的微型电影评分数据库。\n\n要生成 `FROM` Rating 表所有数据的打印输出，请使用\
    \ `SELECT` 函数。任何带有 `SELECT` 的函数都被称为查询，`SELECT` 函数接受不同的参数来缩小或扩展返回的数据。星号（`*`）代表通配符，因此\
    \ `SELECT *` 中的星号告诉解释器（执行所有 SQL 语句的 SQL 组件）显示表中的每一列。你可以使用 `WHERE` 参数将输出限制为某些值。例如，这里是完整的\
    \ Rating 表：\n\n```\nRating timestamp id rating 2011-08-03 16:04:23 1 4 2014-02-19\
    \ 19:17:16 2 5 2010-04-27 10:05:36 2 4 2011-04-05 21:21:05 3 4 2014-02-21 00:11:07\
    \ 3 3\n```\n\n如果你想将评分限制为某个时间之后后的评分，你可以使用如下代码：\n\n```\nSELECT * FROM RatingWHERE\
    \ Rating.timestamp >= date('2014-01-01')\ntimestamp id rating2014-02-19 19:17:16\
    \ 2 52014-02-21 00:11:07 3 3\n```\n\n在这里，`DATE()` 函数将字符串转换为日期，然后可以与 `timestamp`\
    \ 列进行比较。\n\n你还可以使用 SQL 将列连接到新的数据表中。连接基于特定列（或多个列）中的共享（或比较）数据。你可以以几种方式在 SQL 中执行连接，但这里列出的可能是最流行的：\n\
    \n-   **内连接 (Inner join)**：默认的 `JOIN` 类型；返回位于查询表之间交叉区域的所有记录。\n-   **外连接 (Outer\
    \ join)**：返回查询数据表重叠区域之外的所有记录。\n-   **全外连接 (Full outer join)**：返回位于查询数据表重叠区域内外的所有——换句话说，返回两个表的所有记录。\n\
    -   **左连接 (Left join)**：返回位于最左侧表的所有记录。\n-   **右连接 (Right join)**：返回位于最右侧表的所有记录。\n\
    \n![Remember](img/remember.png) \n务必区分内连接和外连接，因为这些函数处理缺失数据的方式不同。作为 SQL 连接的示例，如果你想要一个包含类型的电影列表，你可以在\
    \ `Film` 表和 `Genre` 表之间使用内连接，以仅返回两个表之间交叉（重叠）的结果。\n\n为了唤起你的记忆，这里是你感兴趣的两张表：\n\n\
    ```\nFilm id title 1 The Even Couple 2 The Fourth Man 3 All About Adam 4 Dr. Yes\n\
    ```\n\n```\nGenre id genre 2 Drama 3 Drama 4 Thriller\n```\n\n以下是你如何使用内连接来找到你想要的信息：\n\
    \n```\nSELECT Film.id, Film.title, Genre.genreFROM FilmJOIN Genre On Genre.id=Film.idid\
    \ title genre2 The Fourth Man3 All About Adam4 Dr. Yes\n```\n\n"
