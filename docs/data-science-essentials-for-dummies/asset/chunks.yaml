- raw: "    Imagine that you’re deciding whether you should go to the beach. You never\
    \ go to the beach if it’s raining, and you don’t like going if it’s colder than\
    \ 75°F outside. These are the two inputs for your decision. Your preference to\
    \ not go to the beach when it’s raining is a lot stronger than your preference\
    \ to not go to the beach when it’s colder than 75°F, so you weight these two inputs\
    \ accordingly. For any given instance where you decide whether you’re going to\
    \ the beach, you consider these two criteria, add up the results, and then decide\
    \ whether to go. If you decide to go, your decision threshold has been satisfied.\
    \ If you decide not to go, your decision threshold was not satisfied. This is\
    \ a simplistic analogy for how neural networks work.\n\n    ![Remember](images/remember.png)Now,\
    \ for a more technical definition. The simplest type of neural network is the\
    \ *perceptron.* It accepts more than one input, weights them, adds them up on\
    \ a processor layer, and then — based on the activation function and the threshold\
    \ you set for it — outputs a result. An *activation function* is a mathematical\
    \ function that transforms inputs into an output signal. The processor layer is\
    \ called a *hidden layer.* A *neural network* is a layer of connected perceptrons\
    \ that all work together as a unit to accept inputs and return outputs that signal\
    \ whether some criteria is met. A key feature of neural nets is that they’re *self-learning*\
    \ — in other words, they adapt, learn, and optimize per changes in input data.\
    \ [Figure 3-2](#c03.xhtml#c03-fig-0002) is a schematic layout that depicts how\
    \ a perceptron is structured.\n\n*   **Deep learning method:** This method incorporates\
    \ traditional neural networks in successive layers to offer deep-layer training\
    \ for generating predictive outputs. I tell you more about this topic in the next\
    \ section.\n\n*   **Ensemble algorithm:** You can use ensemble algorithms to combine\
    \ machine learning approaches to achieve results that are better than would be\
    \ available from any single machine learning method on its own.\n\n![FIGURE 3-2:\
    \ Neural networks are connected layers of artificial neural units.](images/9781394297009-fg0302.png)\n\
    \n[FIGURE 3-2:](#c03.xhtml#rc03-fig-0002) Neural networks are connected layers\
    \ of artificial neural units.\n\n![Tip](images/tip.png)Visit the companion website\
    \ to this book ([`https://businessgrowth.ai`](https://businessgrowth.ai/)) to\
    \ get a quick-start guide to selecting the best deep learning network for your\
    \ most immediate needs.\n\nIf you use Gmail, you must be enjoying its autoreply\
    \ functionality (the three one-line messages from which you can choose an autoreply\
    \ to a message someone sent you). This autoreply functionality within Gmail is\
    \ called Smart Reply, and it’s built on deep learning algorithms. Another innovation\
    \ built on deep learning is Facebook DeepFace, the Facebook feature that automatically\
    \ recognizes and suggests tags for the people who appear in your Facebook photos.\
    \ [Figure 3-3](#c03.xhtml#c03-fig-0003) is a schematic layout that depicts how\
    \ a deep learning network is structured.\n\n ![FIGURE 3-3: A deep learning network\
    \ is a neural network with more than one hidden layer.](images/9781394297009-fg0303.png)\n\
    \n[FIGURE 3-3:](#c03.xhtml#rc03-fig-0003) A deep learning network is a neural\
    \ network with more than one hidden layer.\n\nDeep learning is a machine learning\
    \ method that uses hierarchical neural networks to learn from data in an iterative\
    \ and adaptive manner. It’s an ideal approach for learning patterns from unlabeled\
    \ and unstructured data. It’s essentially the same concept as the neural network,\
    \ except that deep learning algorithms have two or more hidden layers. In fact,\
    \ computer vision applications — like those that support facial recognition for\
    \ images uploaded to Facebook, or the self-driving cars produced by Tesla — have\
    \ been known to implement more than 150 hidden layers in a single deep neural\
    \ network. The more hidden layers there are, the more complex a decision the algorithm\
    \ can make.\n\n### Generating real-time analytics with Spark\n\nApache Spark is\
    \ an in-memory distributed computing application that you can use to deploy machine\
    \ learning algorithms on large volumes of data that are moving in near real time.\
    \ From there, generating analytics from these streaming sources is rather straightforward.\
    \ Whew!\n\nBecause it processes data in microbatches, with 3-second cycle times,\
    \ you can use it to significantly decrease time-to-insight in cases where time\
    \ is of the essence. It can be run on data that sits in a wide variety of storage\
    \ architectures, including Amazon Redshift, Amazon Web Services (AWS), Apache\
    \ Cassandra, Apache Solr, Hadoop Distributed File System (HDFS), and MongoDB.\
    \ Spark is composed of the following submodules: \n\n*   **Spark SQL:** You use\
    \ this module to work with and query structured data using Spark. Within Spark,\
    \ you can query data using Spark’s built-in Structured Query Language (SQL) package:\
    \ SparkSQL. You can also query structured data using Hive, but then you’d use\
    \ the HiveQL language and run the queries using the Spark processing engine.\n\
    \n*   **GraphX:** The GraphX library is how you store and process network data\
    \ from within Spark.\n\n*   **Streaming:** The Streaming module is where the data\
    \ processing takes place. This module basically breaks a continuously streaming\
    \ data source into much smaller data streams, called *Dstreams* (discreet data\
    \ streams, in other words). Because the Dstreams are small, these batch cycles\
    \ can be completed within three seconds, which is why it’s called microbatch processing.\n\
    \n*   **MLlib:** The MLlib submodule is where you analyze data, generate statistics,\
    \ and deploy machine learning algorithms from within the Spark environment. MLlib\
    \ has application programming interfaces (APIs) for Java, Python, R, and Scala.\
    \ The MLlib module allows data professionals to work within Spark to build machine\
    \ learning models in Python or R, and those models will then pull data directly\
    \ from the requisite data storage repository, whether that be on-premises, in\
    \ a cloud, or even in a multicloud environment. This helps reduce the reliance\
    \ that data scientists sometimes have on data engineers. Plus, computations are\
    \ known to be 100 times faster when processed in-memory using Spark as opposed\
    \ to the traditional MapReduce framework.\n\nYou can deploy Spark on-premises\
    \ by downloading the open-source framework from the Apache Spark website, at [`https://spark.apache.org/downloads.html`](https://spark.apache.org/downloads.html).\
    \ Another option is to run Spark on the cloud via the Apache Databricks service,\
    \ at [`www.databricks.com`](https://www.databricks.com/).\n\nChapter 4\n\n# Math,\
    \ Probability, and Statistical Modeling\n\nIN THIS CHAPTER\n\n![Bullet](images/check.png)**Introducing\
    \ the core basics of statistical probability**\n\n![Bullet](images/check.png)**Quantifying\
    \ correlation**\n\n![Bullet](images/check.png)**Reducing dataset dimensionality**\n\
    \n![Bullet](images/check.png)**Building decision models with multiple criteria\
    \ decision-making**\n\n![Bullet](images/check.png)**Diving into regression methods**\n\
    \n![Bullet](images/check.png)**Detecting outliers**\n\n![Bullet](images/check.png)**Talking\
    \ about time series analysis**\n\nMath and statistics are not the scary monsters\
    \ that many people make them out to be. In data science, the need for these quantitative\
    \ methods is simply a fact of life — and nothing to be alarmed about. Although\
    \ you need to have a handle on the math and statistics that are necessary to solve\
    \ a problem, you don’t need to study for degrees in those fields."
