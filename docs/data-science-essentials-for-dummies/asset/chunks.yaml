    Chapter 1


    # Wrapping Your Head Around Data Science


    IN THIS CHAPTER


    ![Bullet](images/check.png)**Deploying data science methods across various industries**


    ![Bullet](images/check.png)**Piecing together the core data science components**


    ![Bullet](images/check.png)**Identifying viable data science solutions to business
    challenges**


    ![Bullet](images/check.png)**Exploring data science career alternatives**


    For over a decade now, *everyone* has been absolutely deluged by data. It’s coming
    from every computer, every mobile device, every camera, and every imaginable sensor
    — and now it’s even coming from watches and other wearable technologies. Data
    is generated in every social media interaction we humans make, every file we save,
    every picture we take, and every query we submit; data is even generated when
    we do something as simple as ask a favorite search engine for directions to the
    closest ice cream shop.


    If you’re anything like I was, you may have wondered, “What’s the point of all
    this data? Why use valuable resources to generate and collect it?” Although even
    just two decades ago, no one was in a position to make much use of most of the
    data that’s generated, the tides today have definitely turned. Specialists known
    as *data engineers* are constantly finding innovative and powerful new ways to
    capture, collate, and condense unimaginably massive volumes of data. Other specialists
    known as *data scientists* are leading change by deriving valuable and actionable
    insights from that data.


    In its truest form, data science represents the optimization of processes and
    resources. Data science produces *data insights* — actionable, data-informed conclusions
    or predictions that you can use to understand and improve your business, your
    investments, your health, and even your lifestyle and social life. Using data
    science insights is like being able to see in the dark. For any goal or pursuit
    you can imagine, you can find data science methods to help you predict the most
    direct route from where you are to where you want to be — and to anticipate every
    pothole in the road between both places.


    In this chapter, I explain the difference between data science and data engineering.


    ## Seeing Who Can Make Use of Data Science


    The terms *data science* and *data engineering* are often misused and confused,
    so let me start off by clarifying that these two fields are, in fact, separate
    and distinct domains of expertise. *Data science* is the computational science
    of extracting meaningful insights from raw data and then effectively communicating
    those insights to generate value. *Data engineering,* on the other hand, is an
    engineering domain that’s dedicated to building and maintaining systems that overcome
    data processing bottlenecks and data handling problems for applications that consume,
    process, and store large volumes, varieties, and velocities of data.


    In both data science and data engineering, you commonly work with the following
    types of data:


    *   **Structured data:** Data that is stored, processed, and manipulated in a
    traditional *relational database management system* (RDBMS). An example of this
    type of data can be seen in the tabular schema of rows and columns you’d commonly
    encounter when working with corporate databases.


    *   **Unstructured data:** Data that is commonly generated from human activities
    and doesn’t fit into a structured database format. Examples of unstructured data
    are data that comprises email documents, Microsoft Word documents or audio or
    video files.


    *   **Semistructured data:** Data that doesn’t fit into a structured database
    system but is nonetheless organizable by tags that are useful for creating a form
    of order and hierarchy in the data. XML and JSON files are examples of data that
    comes in semistructured form.'
