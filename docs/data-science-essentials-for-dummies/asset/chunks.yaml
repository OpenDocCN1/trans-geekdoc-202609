    * **要点：** 点地图由根据特定点位置绘制的空间数据组成，点地图（请参图 8-22）以图形点形式呈现数据，而不是多边形、折线或栅格表面格式。

    * **栅格表面：** 栅格表面地图（请参见图 8-23）可以是从卫星图像地图到通过底层空间数据点插值得到的表面覆盖区域的任何形式。


    ![Tip](img/tip.png) 如果想学习如何使用 QGIS（一种开源地理信息系统 (GIS) 应用）从数据制作地图，请访问 [`https://businessgrowth.ai`](https://businessgrowth.ai/)。


