- raw: "The benefit of using Excel in a data science capacity is that it offers a\
    \ fast and easy way to get up close and personal with your data. If you want to\
    \ browse every data point in your dataset, you can quickly and easily do this\
    \ using Excel. Most data scientists start in Excel and eventually add other tools\
    \ and platforms when they find themselves pushing against the boundaries of the\
    \ tasks Excel is designed to do. Still, even the best data scientists out there\
    \ keep Excel as an important tool in their tool belt. When working in data science,\
    \ you may not use Excel every day, but knowing how to use it can make your job\
    \ easier.\n\n![Tip](images/tip.png)If you’re using Excel spreadsheets for data\
    \ analysis but finding it to be rather buggy and clunky, I recommend that you\
    \ instead test out Google Sheets — Google’s cloud-based version of a spreadsheet\
    \ application. It can be run offline on your computer, and it offers an ease of\
    \ use and a set of collaborative features that simply aren’t available within\
    \ the Microsoft Office environment today. Google Sheets offers all the same functions\
    \ discussed in this chapter, using all the same commands as Excel spreadsheets,\
    \ but most users find Sheets to be a far more intuitive, extensible tool for data\
    \ analysis, visualization, and collaboration.\n\n![Remember](images/remember.png)Although\
    \ you have many different tools available to you when you want to see your data\
    \ as one big forest, Excel is a great first choice when you need to look at the\
    \ trees. Excel attempts to be many different things to many different kinds of\
    \ users. Its functionality is well compartmentalized in order to avoid overwhelming\
    \ new users while still providing power users with the more advanced functionality\
    \ they crave.\n\nIn the following sections, I show you how you can use Excel to\
    \ quickly get to know your data. I also introduce Excel PivotTables and macros\
    \ and tell you how you can use them to greatly simplify your data cleanup and\
    \ analysis tasks.\n\n### Using Excel to quickly get to know your data\n\nIf you’re\
    \ just starting off with an unfamiliar dataset and you need to spot patterns or\
    \ trends as quickly as possible, use Excel. Excel offers effective features for\
    \ exactly these purposes. Its main features for a quick-and-dirty data analysis\
    \ are\n\n*   **Filters:** Filters are useful for sorting out all records that\
    \ are irrelevant to the analysis at hand.\n\n*   **Conditional formatting:** Specify\
    \ a condition, and Excel flags records that meet that condition. By using conditional\
    \ formatting, you can easily detect outliers and trends in your tabular datasets.\n\
    \n*   **Charts:** Charts have long been used to visually detect outliers and trends\
    \ in data, so charting is an integral part of almost all data science analyses.\n\
    \nTo see how these features work in action, consider the sample dataset shown\
    \ in [Figure 7-3](#c07.xhtml#c07-fig-0003), which tracks sales figures for three\
    \ employees over six months.\n\n#### Filtering in Excel\n\nTo narrow your view\
    \ of your dataset to only the data that matters for your analysis, use Excel filters\
    \ to filter out irrelevant data from the data view. Simply select the data and\
    \ click the Home tab’s Sort & Filter button; then choose Filter from the options\
    \ that appear. A little drop-down option appears in the header row of the selected\
    \ data so you can select the classes of records you want to have filtered from\
    \ the selection. Using the Excel Filter functionality allows you to quickly and\
    \ easily sort or restrict your view to only the subsets of the data that interest\
    \ you the most.\n\n![FIGURE 7-3: The full dataset that tracks employee sales performance.](images/9781394297009-fg0703.png)\n\
    \n[FIGURE 7-3:](#c07.xhtml#rc07-fig-0003) The full dataset that tracks employee\
    \ sales performance.\n\nTake another look at the full dataset shown in [Figure\
    \ 7-3](#c07.xhtml#c07-fig-0003). Say you want to view only data related to Abbie’s\
    \ sales figures. If you select all records in the Salesperson column and then\
    \ activate the filter functionality (as just described), from the drop-down menu\
    \ that appears you can specify that the filter should isolate only all records\
    \ named Abbie, as shown in [Figure 7-4](#c07.xhtml#c07-fig-0004). When filtered,\
    \ the table is reduced from 18 rows to only 6 rows. In this particular example,\
    \ that change doesn’t seem so dramatic, but when you have hundreds, thousands,\
    \ or even a million rows, this feature comes in very, very handy.\n\n ![FIGURE\
    \ 7-4: The sales performance dataset, filtered to show only Abbie’s records.](images/9781394297009-fg0704.png)\n\
    \n[FIGURE 7-4:](#c07.xhtml#rc07-fig-0004) The sales performance dataset, filtered\
    \ to show only Abbie’s records.\n\n![Warning](images/warning.png)Excel lets you\
    \ store only up to 1,048,576 rows per worksheet.\n\n#### Using conditional formatting\n\
    \nTo quickly spot outliers in your tabular data, use Excel’s Conditional Formatting\
    \ feature. Imagine after a data entry error that Abbie’s March total sales showed\
    \ $208,187.70 but was supposed to be only $20,818.77. You’re not quite sure where\
    \ the error is located, but you know that it must be significant because the figures\
    \ seem off by about $180,000.\n\nTo quickly show such an outlier, select all records\
    \ in the Total Sales column and then click the Conditional Formatting button on\
    \ the Ribbon’s Home tab. When the button’s menu appears, choose the Data Bars\
    \ option. Doing so displays the red data bar scales shown in [Figure 7-5](#c07.xhtml#c07-fig-0005).\
    \ With data bars turned on, the bar in the $208,187.70 cell is so much larger\
    \ than any of the others that you can easily see the error.\n\nIf you want to\
    \ quickly discover patterns in your tabular data, you can choose the Color Scales\
    \ option (rather than the Data Bars option) from the Conditional Formatting menu.\
    \ After correcting Abbie’s March Total Sales figure to $20,818.77, select all\
    \ cells in the Total Sales column and then activate the Color Scales version of\
    \ conditional formatting. Doing so displays the result shown in [Figure 7-6](#c07.xhtml#c07-fig-0006).\
    \ From the red-white-blue heat map, you can see that Abbie has the highest sales\
    \ total and Brian has been selling more than Chris. (Okay, you can’t see the red-white-blue\
    \ in my black-and-white figures, but you can see the light-versus-dark contrast.)\
    \ Now, if you only want to conditionally format Abbie’s sales performance relative\
    \ to her own total sales (but not Brian’s and Chris’s sales), you can select only\
    \ the cells for Abbie (and not the entire column).\n\n![FIGURE 7-5: Spotting outliers\
    \ in a tabular dataset with conditional formatting data bars.](images/9781394297009-fg0705.png)\n\
    \n[FIGURE 7-5:](#c07.xhtml#rc07-fig-0005) Spotting outliers in a tabular dataset\
    \ with conditional formatting data bars.\n\n#### Excel charting to visually identify\
    \ outliers and trends\n\nExcel’s Charting tool gives you an incredibly easy way\
    \ to visually identify both outliers and trends in your data. An XY (scatter)\
    \ chart of the original dataset (refer to [Figure 7-3](#c07.xhtml#c07-fig-0003))\
    \ yields the scatterplot shown in [Figure 7-7](#c07.xhtml#c07-fig-0007). As you\
    \ can see, the outlier is overwhelmingly obvious when the data is plotted on a\
    \ scatter chart.\n\nAlternatively, if you want to visually detect trends in a\
    \ dataset, you can use Excel’s Line Chart feature. The data from [Figure 7-6](#c07.xhtml#c07-fig-0006)\
    \ is shown as a line chart in [Figure 7-8](#c07.xhtml#c07-fig-0008). It’s worth\
    \ mentioning, I’ve fixed the outlier in this line graph, which is what allows\
    \ the *y*\\-axis to have a more readable scale compared to [Figure 7-7](#c07.xhtml#c07-fig-0007).\n\
    \nAs you can clearly see from the figure, Chris’s sales performance is low — last\
    \ place among the three salespeople but gaining momentum. Because Chris seems\
    \ to be improving, maybe management will want to wait a few months before making\
    \ any firing decisions based on sales performance data.\n\n![FIGURE 7-6: Spotting\
    \ outliers in a tabular dataset with color scales.](images/9781394297009-fg0706.png)"
