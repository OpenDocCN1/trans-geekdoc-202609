    分层聚类算法比 `k`-means 算法需要更多的计算资源，因为在分层聚类的每一次迭代中，必须将许多观测值与其他观测值进行比较。然而，它的优势在于，分层聚类算法不会受到局部最小密度区域中心收敛引起错误的影响（如
    `k`-means` 聚类算法所示）。


    ![Warning](img/warning.png)如果你正在处理大型数据集，请注意！分层聚类的速度可能`太`慢了。


    ![Tip](img/tip.png)如果你想开始学习分层聚类算法，可以查看 R 的 `hclust` 包或（再次提到）Python 的 `scikit-learn`
    库。（如果你对 `hclust` 感奇，请查看此页面[`https://stat.ethz.ch/R-manual/R-patched/library/stats/html/hclust.html`](https://stat.ethz.ch/R-manual/R-patched/library/stats/html/hclust.html)。）


    当聚类呈`非球形`时（一种配置，即聚类中的某些点距离另一个聚类点的距离比距离其自身聚类中心的距离还要近），`k`-means 和分层聚类算法的表现都不佳。如果你的数据集显示出非球形聚类，你可以使用邻域聚类算法（如
    `DBScan`）来确定每个点是靠近同聚类中的邻居，还是靠近其他聚类的邻域观测值。图 5-5 展示了使用 `DBScan` 邻域聚类算法检测经典数据集“Iris”示例，下一节将详细介绍邻域聚类。


    ### 尝试 DBScan 邻域


    *基于密度的应用空间聚类*（`DBScan`）是一种无监督学习方法，通过在聚类`核心样本`（数据集的密集区域）的同时标记`非核心样本`（数据集中相对稀疏的部分）来工作。它是一种邻域聚类算法，适用于同时检查两个或多个变量以识别离群值。它对于识别`集体离群值`（彼此相邻的离群值，它们的值对于该变量的大部分值来说都是异常的）特别有用。图
    5-5 展示了 `DBScan` 的工作。


    ![Remember](img/remember.png)通过 `DBScan`，你采用迭代、试错的方法来寻找待检查的理想离群值数量。在实验 `DBScan`
    模型时，离群值应占数据集观测值的 5% 或更少。你必须调整模型参数，直到分离出这一小部分观测值组。


    ![Credit: Python for Data Science Essential Training Part 2, LinkedIn.com ¶ FIGURE
    5-5: Using DBScan to detect outliers (in black) within the Iris dataset.](img/9781394297009-fg0505.png)


    图片来源：Python for Data Science Essential Training Part 2, [`LinkedIn.com`](http://LinkedIn.com)
    ¶ 图 5-5: 使用 `DBScan` 检测 Iris 数据集中的离群值（黑色部分）。


    邻域聚类算法通常是有效的，但它们存在以下两个缺点：


    *   **邻域聚类的计算开销可能很高。** 在该方法的每一次迭代中，每个数据点都可能必须与数据集中的其他数据点进行比较。

    *   **对于邻域聚类，你可能需要为模型提供预期聚类大小和聚类密度的经验参数值。** 如果对其中任一参数估计错误，算法将错误识别聚类，你必须重新开始整个长时间的过程来解决问题。如果你选择使用
    `DBScan` 方法，则要求指定这些参数。（如果你不确定这些参数，可以先尝试默认值。）


    ![Tip](img/tip.png)如果你不确定这些参数，可以先尝试默认值。

