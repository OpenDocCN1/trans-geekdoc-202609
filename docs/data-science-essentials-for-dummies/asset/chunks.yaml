    # [FIGURE 4-3:](#c04.xhtml#rc04-fig-0003) Applying SVD to compress a sparse, clean
    dataset.


    ![Remember](images/remember.png)The lower the CVE, the more you should take your
    model’s results with a grain of salt.


    ![Warning](images/warning.png)If you remove some components, then when you go
    to reconstruct your matrix, you’ll probably notice that the resulting matrix isn’t
    an exact match to your original dataset. Worry not! That’s the data that remains
    after much of the information redundancy and noise was filtered out by SVD and
    removed by you.


    Getting a little nitty-gritty about SVD, let’s look at the formula for SVD, but
    keep in mind: This is linear algebra not regular algebra, so we’re looking at
    matrix math not regular math. To take it from the beginning, you need to understand
    the concept of eigenvector. To do that, think of a matrix called `A`. Now consider
    a nonzero vector called `x` and that `Ax = λx` for a scalar `λ`. In this scenario,
    scalar `λ` is what’s called an `eigenvalue` of matrix `A`. It’s permitted to take
    on a value of 0. Furthermore, `x` is the eigenvector that corresponds to `λ`,
    and again, it’s not permitted to be a zero value. `λ` is simply the scale factor
    of the eigenvector. SVD decomposes the matrix down into three resultant matrices
    shown in [Figure 4-5](#c04.xhtml#c04-fig-0005). The product of these matrices,
    when multiplied together, gives you back your original matrix.


    ![FIGURE 4-4: Applying SVD to clean and compress a sparse, dirty dataset.](images/9781394297009-fg0404.png)


    [FIGURE 4-4:](#c04.xhtml#rc04-fig-0004) Applying SVD to clean and compress a sparse,
    dirty dataset.


    ![FIGURE 4-5: You can use SVD to decompose data down to u, S, and V matrices.](images/9781394297009-fg0405.png)


    [FIGURE 4-5:](#c04.xhtml#rc04-fig-0005) You can use SVD to decompose data down
    to u, S, and V matrices.


    Take a closer look at [Figure 4-5](#c04.xhtml#c04-fig-0005):


    ```

    A = u * S * v

    ```


    *   **A:** This is the matrix that holds all your original data.

    *   **u:** This is a left-singular vector (an eigenvector) of `A`, and it holds
    all the important, nonredundant information about your data’s observations.

    *   **v:** This is a right-singular eigenvector of `A`. It holds all the important,
    nonredundant information about columns in your dataset’s features.

    *   **S:** This is the square root of the eigenvalue of `A`. It contains all the
    information about the procedures performed during the compression.


    ### Reducing dimensionality with factor analysis


    *Factor analysis* is along the same lines as SVD in that it’s a method you can
    use for filtering out redundant information and noise from your data. An offspring
    of the psychometrics field, this method was developed to help you derive a root
    cause in cases where a shared root cause results in *shared variance* — when a
    variable’s variance correlates with the variance of other variables in the dataset.


    When you find shared variance in your dataset, that means information redundancy
    is at play. You can use factor analysis or principal component analysis to clear
    your data of this information redundancy. You see more on principal component
    analysis in the following section, but for now, focus on factor analysis and the
    fact that you can use it to compress your dataset’s information into a reduced
    set of meaningful, non-information-redundant *latent variables* — meaningful inferred
    variables that underlie a dataset but are not directly observable.


    Factor analysis makes the following assumptions:


    *   Your features are *metric* (numeric variables on which meaningful calculations
    can be made).

    *   Your features should be continuous or *ordinal.* (If you’re not sure what
    ordinal is, refer back to the first class, business class, and economy class analogy
    in the “[Probability distributions](#c04.xhtml#c04-sec-0003)” section of this
    chapter.)

    *   You have more than 100 observations in your dataset and at least 5 observations
    per feature.

    *   Your sample is homogenous.

    *   There is *r* > 0.3 correlation between the features in your dataset.


    In factor analysis, you do a regression (a topic covered later in this chapter)
    on features to uncover underlying latent variables, or *factors.* You can then
    use those factors as variables in future analyses to represent the original dataset
    from which they’re derived. At its core, factor analysis is the process of fitting
    a model to prepare a dataset for analysis by reducing its dimensionality and information
    redundancy.


    ### Decreasing dimensionality and removing outliers with PCA


    *Principal component analysis* (PCA) is another dimensionality reduction technique
    that’s closely related to SVD: This unsupervised statistical method finds relationships
    between features in your dataset and then transforms and reduces them to a set
    of non-information-redundant *principal components* — uncorrelated features that
    embody and explain the information that’s contained within the dataset (that is,
    its variance). These components act as a synthetic, refined representation of
    the dataset, with the information redundancy, noise, and outliers stripped out.
    You can then use these reduced components as input for your machine learning algorithms
    to make predictions based on a compressed representation of your data. (For more
    on outliers, see the “[Detecting Outliers](#c04.xhtml#c04-sec-0019)” section,
    later in this chapter.)


    The PCA model makes these two assumptions:


    *   *Multivariate normality* (MVN) — or a set of real-valued, correlated, random
    variables that are each clustered around a mean — is desirable, but not required.

    *   Variables in the dataset should be continuous.


    Although PCA is like factor analysis, they have two major differences: One difference
    is that PCA does not regress to find some underlying cause of shared variance,
    but instead decomposes a dataset to succinctly represent its most important information
    in a reduced number of features. The other key difference is that, with PCA, the
    first time you run the model, you don’t specify the number of components to be
    discovered in the dataset. You let the initial model results tell you how many
    components to keep, and then you rerun the analysis to extract those features.


    ![Remember](images/remember.png)Similar to the CVE discussion in the SVD part
    of this chapter, the amount of variance you retain depends on how you’re applying
    PCA, as well as the data you’re inputting into the model. Breaking it down based
    on how you’re applying PCA, the following rules of thumb become relevant:


    *   **Used for descriptive analytics:** If PCA is being used for descriptive purposes
    only (for example, when working to build a descriptive avatar of your company’s
    ideal customer), the CVE can be lower than 95 percent. In this case you can get
    away with a CVE as low as 75 percent to 80 percent.

    *   **Used for diagnostic, predictive, or prescriptive analytics:** If principal
    components are meant for downstream models that generate diagnostic, predictive,
    or prescriptive analytics, CVE should be 95 percent or higher. Just realize that
    the lower the CVE, the less reliable your model results will be downstream. Each
    percentage of CVE that’s lost represents a small amount of information from your
    original dataset that won’t be captured by the principal components.


    ![Tip](images/tip.png)When using PCA for outlier detection, simply plot the principal
    components on an *x-y* scatterplot and visually inspect for areas that may be
    outliers. Those data points correspond to potential outliers that are worth investigating.


    ## Modeling Decisions with Multiple Criteria Decision-Making

    '
