    \ 10:05:36 43 All About Adam Drama 2011-04-05 21:21:05 43 All About Adam Drama\
    \ 2014-02-21 00:11:07 34 Dr. Yes Thriller NULL`\n\nWhat happens if you find out\
    \ that *All About Adam* is a comedy rather than a drama? If the table were in\
    \ a simple spreadsheet, you’d have to open the data table, find all instances\
    \ of the film, and then manually change the genre value for that record. That’s\
    \ not so difficult in this sample table because only two records are related to\
    \ that film. But even here, if you forget to change one of these records, this\
    \ inconsistency would cause a loss of data integrity, which can cause all sorts\
    \ of unpredictable problems for you down the road.\n\nIn contrast, the relational\
    \ database solution is simple and elegant. Instead of one table for this example,\
    \ you’d have three:\n\n`Film id title 1 The Even Couple 2 The Fourth Man 3 All\
    \ About Adam 4 Dr. YesGenre id genre 2 Drama 3 Drama 4 ThrillerRating timestamp\
    \ id rating 2011-08-03 16:04:23 1 4 2014-02-19 19:17:16 2 5 2010-04-27 10:05:36\
    \ 2 4 2011-04-05 21:21:05 3 4 2014-02-21 00:11:07 3 3`\n\nThe primary key for\
    \ the Film and Genre tables is `id`. The primary key for the Rating table is `timestamp`\
    \ — because a film can have more than one rating, `id` is not a unique field,\
    \ so it can't be used as a primary key. In this example, if you want to look up\
    \ and change the genre for *All About Adam,* you’d use `Film.id` as the primary\
    \ key and `Genre.id` as the foreign key. You'd simply use these keys to query\
    \ the records you need to change and then apply the changes systematically. This\
    \ systematic approach eliminates the risk of stray errors.\n\n## Investing Some\
    \ Effort into Database Design\n\nIf you want to ensure that your database will\
