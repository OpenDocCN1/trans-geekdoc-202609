- raw: "Life is complicated. We’re often forced to make decisions where several different\
    \ criteria come into play, and it often seems unclear which criterion should have\
    \ priority. Mathematicians, being mathematicians, have come up with quantitative\
    \ approaches that you can use for decision support whenever you have several criteria\
    \ or alternatives on which to base your decision. You see those approaches in\
    \ [Chapter 3](#c03.xhtml), where I talk about neural networks and deep learning\
    \ — another method that fulfills this same decision-support purpose is *multiple\
    \ criteria decision-making* (MCDM).\n\n### Turning to traditional MCDM\n\nYou\
    \ can use MCDM methods in anything from stock portfolio management to fashion-trend\
    \ evaluation, from disease outbreak control to land development decision-making.\
    \ Anywhere you have two or more criteria on which you need to base your decision,\
    \ you can use MCDM methods to help you evaluate alternatives.\n\nTo use multiple\
    \ criteria decision-making, the following two assumptions must be satisfied:\n\
    \n*   **Multiple criteria evaluation:** You must have more than one criterion\
    \ to optimize.\n\n*   **Zero-sum system:** Optimizing with respect to one criterion\
    \ must come at the sacrifice of at least one other criterion. This means that\
    \ there must be trade-offs between criteria — to gain with respect to one means\
    \ losing with respect to at least one other.\n\nAnother important thing to note\
    \ about MCDM is that it’s characterized by binary membership. In mathematics,\
    \ a *set* is a group of numbers that share a similar characteristic. In traditional\
    \ set theory, membership is *binary* — in other words, an individual is either\
    \ a member of a set or it’s not. If the individual is a member, it’s represented\
    \ by the number 1, representing a “yes.” If it isn’t a member, it’s represented\
    \ by the number 0, for “no.”\n\nThe best way to gain a solid grasp on MCDM is\
    \ to see how it’s used to solve a real-world problem. MCDM is commonly used in\
    \ investment portfolio theory. Pricing of individual financial instruments typically\
    \ reflects the level of risk you incur, but an entire portfolio can be a mixture\
    \ of virtually riskless investments (U.S. government bonds, for example) and minimum-,\
    \ moderate-, and high-risk investments. Your level of risk aversion dictates the\
    \ general character of your investment portfolio. Highly risk-averse investors\
    \ seek safer and less lucrative investments, and less risk-averse investors choose\
    \ riskier, more lucrative investments. In the process of evaluating the risk of\
    \ a potential investment, you’d likely consider the following criteria:\n\n* \
    \  **Earnings growth potential:** Using a binary variable to score the earnings\
    \ growth potential, you could say that an investment that falls under a specific\
    \ earnings growth potential threshold gets scored as 0 (as in “no — the potential\
    \ is not enough”); anything higher than that threshold gets a 1 (for “yes — the\
    \ potential is adequate”).\n\n*   **Earnings quality rating:** Using a binary\
    \ variable to score earnings quality ratings, you could say that an investment\
    \ falling within a particular ratings class for earnings quality gets scored as\
    \ 1 (for “yes — the rating is adequate”); otherwise, it gets scored as a 0 (as\
    \ in “no — it’s earning quality rating is not good enough”).\n\n    For you non–Wall\
    \ Street types out there, *earnings quality* refers to various measures used to\
    \ determine how kosher a company’s reported earnings are; such measures try to\
    \ answer the question, “Do these reported figures pass the smell test?”\n\n* \
    \  **Dividend performance:** Using a binary variable to score dividend performance,\
    \ you could say that when an investment fails to reach a set dividend performance\
    \ threshold, it gets a 0 (as in “no — it’s dividend performance is not good enough”);\
    \ if it reaches or surpasses that threshold, it gets a 1 (for “yes — the performance\
    \ is adequate”).\n\nImagine that you’re evaluating 20 different potential investments.\
    \ In this evaluation, you’d score each criterion for each of the investments.\
    \ To eliminate poor investment choices, simply sum the criteria scores for each\
    \ of the alternatives and then dismiss any investments that don’t earn a total\
    \ score of 3 — leaving you with the investments that fall within a certain threshold\
    \ of earning growth potential, that have good earnings quality, and whose dividends\
    \ perform at a level that’s acceptable to you.\n\n![Tip](images/tip.png)For some\
    \ hands-on practice doing multiple criteria decision-making, go to the companion\
    \ website to this book ([`www.businessgrowth.ai`](http://www.businessgrowth.ai))\
    \ and check out the MCDM practice problem I’ve left for you there.\n\n### Focusing\
    \ on fuzzy MCDM\n\nIf you prefer to evaluate suitability within a range, rather\
    \ than use binary membership terms of 0 or 1, you can use *fuzzy multiple criteria\
    \ decision-making* (FMCDM) to do that. With FMCDM you can evaluate all the same\
    \ types of problems as you would with MCDM. The term *fuzzy* refers to the fact\
    \ that the criteria being used to evaluate alternatives offer a range of acceptability\
    \ — instead of the binary, crisp set criteria associated with traditional MCDM.\
    \ Evaluations based on fuzzy criteria lead to a range of potential outcomes, each\
    \ with its own level of suitability as a solution.\n\n![Tip](images/tip.png)One\
    \ important feature of FMCDM: You’re likely to have a list of several fuzzy criteria,\
    \ but these criteria may not all hold the same importance in your evaluation.\
    \ To correct for this, simply assign weights to criteria to quantify their relative\
    \ importance.\n\n## Introducing Regression Methods\n\nMachine learning algorithms\
    \ of the regression variety were adopted from the statistics field in order to\
    \ provide data scientists with a set of methods for describing and quantifying\
    \ the relationships between variables in a dataset. Use regression techniques\
    \ if you want to determine the strength of correlation between variables in your\
    \ data.\n\n![Warning](images/warning.png)As for using regression to predict future\
    \ values from historical values, feel free to do it, but be careful: Regression\
    \ methods assume a cause-and-effect relationship between variables, but present\
    \ circumstances are always subject to flux. Predicting future values from historical\
    \ ones will generate incorrect results when present circumstances change.\n\n\
    In this section, I tell you all about linear regression, logistic regression,\
    \ and the ordinary least squares method.\n\n### Linear regression\n\n*Linear regression*\
    \ is a machine learning method you can use to describe and quantify the relationship\
    \ between your target variable, *y* — the *predictant,* in statistics lingo —\
    \ and the dataset features you’ve chosen to use as predictor variables (commonly\
    \ designated as *dataset X* in machine learning). When you use just one variable\
    \ as your predictor, linear regression is as simple as the middle school algebra\
    \ formula *y* = *mx* + *b*. A classic example of linear regression is its usage\
    \ in predicting home prices, as shown in [Figure 4-6](#c04.xhtml#c04-fig-0006).\
    \ You can also use linear regression to quantify correlations between several\
    \ variables in a dataset — called *multiple linear regression.* Before getting\
    \ too excited about using linear regression, though, make sure you’ve considered\
    \ its limitations:\n\n*   Linear regression works with only numerical variables,\
    \ not categorical ones.\n\n*   If your dataset has missing values, it will cause\
    \ problems. Be sure to address your missing values before attempting to build\
    \ a linear regression model.\n\n*   If your data has outliers present, your model\
    \ will produce inaccurate results. Check for outliers before proceeding.\n\n*\
    \   The linear regression model assumes that a linear relationship exists between\
    \ dataset features and the target variable.\n\n*   The linear regression model\
    \ assumes that all features are independent of each other.\n\n*   Prediction errors,\
    \ or *residuals,* should be normally distributed."
  fmt: "\nLife is complicated. We’re often forced to make decisions where several\
    \ different criteria come into play, and it often seems unclear which criterion\
    \ should have priority. Mathematicians, being mathematicians, have come up with\
    \ quantitative approaches that you can use for decision support whenever you have\
    \ several criteria or alternatives on which to base your decision. You see those\
    \ approaches in [Chapter 3](#c03.xhtml), where I talk about neural networks and\
    \ deep learning — another method that fulfills this same decision-support purpose\
    \ is `multiple criteria decision-making` (MCDM).\n\n## Turning to traditional\
    \ MCDM\n\nYou can use `MCDM` methods in anything from stock portfolio management\
    \ to fashion-trend evaluation, from disease outbreak control to land development\
    \ decision-making. Anywhere you have two or more criteria on which you need to\
    \ base your decision, you can use `MCDM` methods to help you evaluate alternatives.\n\
    \nTo use multiple criteria decision-making, the following two assumptions must\
    \ be satisfied:\n\n*   **Multiple criteria evaluation:** You must have more than\
    \ one criterion to optimize.\n*   **Zero-sum system:** Optimizing with respect\
    \ to one criterion must come at the sacrifice of at least one other criterion.\
    \ This means that there must be trade-offs between criteria — to gain with respect\
    \ to one means losing with respect to at least one other.\n\nAnother important\
    \ thing to note about `MCDM` is that it’s characterized by binary membership.\
    \ In mathematics, a `set` is a group of numbers that share a similar characteristic.\
    \ In traditional set theory, membership is `binary` — in other words, an individual\
    \ is either a member of a set or it’s not. If the individual is a member, it’s\
    \ represented by the number `1`, representing a “yes.” If it isn’t a member, it’s\
    \ represented by the number `0`, for “no.”\n\nThe best way to gain a solid grasp\
    \ on `MCDM` is to see how it’s used to solve a real-world problem. `MCDM` is commonly\
    \ used in investment portfolio theory. Pricing of individual financial instruments\
    \ typically reflects the level of risk you incur, but an entire portfolio can\
    \ be a mixture of virtually riskless investments (U.S. government bonds, for example)\
    \ and minimum-, moderate-, and high-risk investments. Your level of risk aversion\
    \ dictates the general character of your investment portfolio. Highly risk-averse\
    \ investors seek safer and less lucrative investments, and less risk-averse investors\
    \ choose riskier, more lucrative investments. In the process of evaluating the\
    \ risk of a potential investment, you’d likely consider the following criteria:\n\
    \n*   **Earnings growth potential:** Using a binary variable to score the earnings\
    \ growth potential, you could say that an investment that falls under a specific\
    \ earnings growth potential threshold gets scored as `0` (as in “no — the potential\
    \ is not enough”); anything higher than that threshold gets a `1` (for “yes —\
    \ the potential is adequate”).\n*   **Earnings quality rating:** Using a binary\
    \ variable to score earnings quality ratings, you could say that an investment\
    \ falling within a particular ratings class for earnings quality gets scored as\
    \ `1` (for “yes — the rating is adequate”); otherwise, it gets scored as a `0`\
    \ (as in “no — it’s earning quality rating is not good enough”).\n    For you\
    \ non–Wall Street types out there, `earnings quality` refers to various measures\
    \ used to determine how kosher a company’s reported earnings are; such measures\
    \ try to answer the question, “Do these reported figures pass the smell test?”\n\
    *   **Dividend performance:** Using a binary variable to score dividend performance,\
    \ you could say that when an investment fails to reach a set dividend performance\
    \ threshold, it gets a `0` (as in “no — it’s dividend performance is not good\
    \ enough”); if it reaches or surpasses that threshold, it gets a `1` (for “yes\
    \ — the performance is adequate”).\n\nImagine that you’re evaluating 20 different\
    \ potential investments. In this evaluation, you’d score each criterion for each\
    \ of the investments. To eliminate poor investment choices, simply sum the criteria\
    \ scores for each of the alternatives and then dismiss any investments that don’t\
    \ earn a total score of `3` — leaving you with the investments that fall within\
    \ a certain threshold of earning growth potential, that have good earnings quality,\
    \ and whose dividends perform at a level that’s acceptable to you.\n\n![Tip](images/tip.png)For\
    \ some hands-on practice doing multiple criteria decision-making, go to the companion\
    \ website to this book (`www.businessgrowth.ai`](http://www.businessgrowth.ai))\
    \ and check out the `MCDM` practice problem I’ve left for you there.\n\n## Focusing\
    \ on fuzzy MCDM\n\nIf you prefer to evaluate suitability within a range, rather\
    \ than use binary membership terms of `0` or `1`, you can use `fuzzy multiple\
    \ criteria decision-making` (FMCDM) to do that. With `FMCDM` you can evaluate\
    \ all the same types of problems as you would with `MCDM`. The term `fuzzy` refers\
    \ to the fact that the criteria being used to evaluate alternatives offer a range\
    \ of acceptability — instead of the binary, crisp set criteria associated with\
    \ traditional `MCDM`. Evaluations based on fuzzy criteria lead to a range of potential\
    \ outcomes, each with its own level of suitability as a solution.\n\n![Tip](images/tip.png)One\
    \ important feature of `FMCDM`: You’re likely to have a list of several fuzzy\
    \ criteria, but these criteria may not all hold the same importance in your evaluation.\
    \ To correct for this, simply assign weights to criteria to quantify their relative\
    \ importance.\n\n## Introducing Regression Methods\n\nMachine learning algorithms\
    \ of the regression variety were adopted from the statistics field in order to\
    \ provide data scientists with a set of methods for describing and quantifying\
    \ the relationships between variables in a dataset. Use regression techniques\
    \ if you want to determine the strength of correlation between variables in your\
    \ data.\n\n![Warning](images/warning.png)As for using regression to predict future\
    \ values from historical values, feel free to do it, but be careful: Regression\
    \ methods assume a cause-and-effect relationship between variables, but present\
    \ circumstances are always subject to flux. Predicting future values from historical\
    \ ones will generate incorrect results.\n\nIn this section, I tell you all about\
    \ linear regression, logistic regression, and the ordinary least squares method.\n\
    \n### Linear regression\n\n`Linear regression` is a machine learning method you\
    \ can use to describe and quantify the relationship between your target variable,\
    \ `y` — the `predictant` in statistics lingo — and the dataset features you’ve\
    \ chosen to use as predictor variables (commonly designated as `dataset X` in\
    \ machine learning). When you use just one variable as your predictor, linear\
    \ regression is as simple as the middle school algebra formula `y = mx + b`. A\
    \ classic example of linear regression is its usage in predicting home prices,\
    \ as shown in [Figure 4-6](#c04.xhtml#c04-fig-0006). You can also use linear regression\
    \ to quantify correlations between several variables in a dataset — called multiple\
    \ linear regression. Before getting too excited about using linear regression,\
    \ though, make sure you’ve considered its limitations:\n\n*   Linear regression\
    \ works with only numerical variables, not categorical ones.\n*   If your dataset\
    \ has missing values, it will cause problems. Be sure to address your missing\
    \ values before attempting to build a linear regression model.\n*   If your data\
    \ has outliers present, your model will produce inaccurate results. Check for\
    \ outliers before proceeding.\n*   The linear regression model assumes a linear\
    \ relationship exists between dataset features and the target variable.\n*   The\
    \ linear regression model assumes that all features are independent of each other.\n\
    *   Prediction errors, or `residuals,* should be normally distributed.\n"
  trans: "\n生活是复杂的。我们往往被迫在多个不同标准共同作用的情况下做出决策，而通常我们并不清楚哪一个标准应该优先。数学家们发挥其职业特性，构想出了量化方法，每当你有多个标准或替代方案作为决策依据时，可以使用这些方法进行决策支持。你可以在第\
    \ 3 章中看到这些方法，我在该章节讨论了神经网络和深度学习——另一种实现同样决策支持目的的方法是`多准则决策`（MCDM）。\n\n## 转向传统的 MCDM\n\
    \n你可以将 `MCDM` 方法应用于从股票投资组合管理到时尚趋势评估，从疾病爆发控制到土地开发决策的任何领域。只要你有两个或多个需要作为决策依据的标准，你就可以使用\
    \ `MCDM` 方法来帮助你评估替代方案。\n\n要使用多准则决策，必须满足以下两个假设：\n\n*   **多准则评估：** 你必须有多个一个准则需要优化。\n\
    *   **零和系统：** 针对一个标准的优化必须以牺牲至少另一个其他标准为代价。这意味着准则之间存在权衡——在一个标准上的获得意味着在至少另一个标准上的失去。\n\
    \n关于 `MCDM` 的另一个重要一点是，它的特征是二元成员性。在数学中，`set` 是一组具有相似特征的数字。在传统的集合理论中，成员性是`binary`的——换句话说，一个个体要么是集合的成员，要么不是。如果个体是成员，则用数字\
    \ `1` 表示，代表“是”；如果不是成员，则用数字 `0` 表示，代表“否”。\n\n掌握 `MCDM` 的最好方法是观察它是如何用于解决现实问题的。`MCDM`\
    \ 通常用于投资组合理论。单个金融工具的定价通常反映了你所承担的风险水平，但整个投资组合可以是几乎无风险投资（例如美国政府债券）与低、中等、高风险投资的混合。你的风险厌恶程度决定了你投资组合的总体特征。高风险厌恶型投资者寻求更安全、收益更薄的投资，而风险厌恶程度较低的投资者则选择风险更高、收益更厚的投资。在评估潜在投资的风险过程中，你可能会考虑以下标准：\n\
    \n*   **收益增长潜力：** 使用二元变量对收益增长潜力进行评分，你可以说，落入特定收益增长潜力阈值的投资被评为 `0`（即“否——潜力不足”）；任何高于该阈值的投资都得\
    \ `1` 分（即“是——潜力足够”）。\n*   **收益质量评分：** 使用二元变量对收益质量评分进行评分，你可以说，落在收益质量特定评级内的投资被评为\
    \ `1`（即“是——评分足够”）；否则，它得 `0` 分（即“否——其收益质量评分不够”）。\n    对于你们这些非华尔街的人士来说，`earnings\
    \ quality`指的是用于确定公司报告收益的可靠性的各种衡量标准；这些标准试图回答这样一个问题：“这些报告数据是否通过了嗅觉测试（是否合理）？”\n*\
    \   **股息表现：** 使用二元变量对股息表现进行评分，你可以说，当投资未能达到设定的股息表现阈值时，它得 `0` 分（即“否——股息表现不够”）；如果它达到或超过了该阈值，它得\
    \ `1` 分（即“是——表现足够”）。\n\n想象你正在评估 20 不同的潜在投资。在这次评估中，你会为每项投资的每个标准进行评分。为了排除糟糕的投资选择，只需将每个替代方案的标准分相加，然后放弃任何总分未达到\
    \ `3` 分的投资——剩下的就是那些落在特定收益增长潜力阈值内、具有良好收益质量且股息表现达到你接受水平的投资。\n\n![Tip](img/tip.png)若想进行一些多准则决策的实践练习，请访问本书的配套网站（`www.businessgrowth.ai`](http://www.businessgrowth.ai)）并查看我在那里留给你的\
    \ `MCDM` 练习题。\n\n## 关注模糊 MCDM\n\n如果你更倾向于在一个范围内评估适用性，而不是使用 `0` 或 `1` 的二元成员性术语，你可以使用`模糊多准则决策`（FMCDM）来实现。通过\
    \ `FMCDM`，你可以评估与 `MCDM` 相同的所有类型的问题。`fuzzy`（模糊）一词是指用于评估替代方案的标准提供了一个接受范围——而不是与传统\
    \ `MCDM` 相关的二元的、清晰的集合标准。基于模糊准则的评估会导致一系列潜在结果，每种结果作为解决方案都有其自身的适用水平。\n\n![Tip](img/tip.png)`FMCDM`\
    \ 的一个重要特征：你可能会有一个多个模糊准则列表，但这些标准在你的评估中可能并不具有相同的重要性。为了修正这一点，只需为准则分配权重以量化它们的相对重要性。\n\
    \n## 引入回归方法\n\n回归类机器学习算法从统计领域引入，旨在为数据科学家提供一套描述和量化数据集中变量之间关系的方法。如果你想确定数据中变量之间相关性的强度，请使用回归技术。\n\
    \n![Warning](img/warning.png)至于使用回归从历史值预测未来值，尽管可以这样做，但要小心：回归方法假设变量之间存在因果关系，但目前的情况总是处于变化之中。从历史值预测未来值将产生错误的结果。\n\
    \n在本节中，我将为你详细介绍线性回归、逻辑回归和普通最小二乘法。\n\n### 线性回归\n\n`Linear regression`（线性回归）是你可以使用的一种机器学习方法，用于描述和量化你的目标变量\
    \ `y`——统计术语中的“预测变量”）与你选择作为预测变量的数据集特征（在机器学习中通常标记为 `dataset X`）之间的关系。当你只使用一个变量作为预测变量时，线性回归就像初中代数公式\
    \ `y = mx + b` 一样简单。线性回归的一个经典例子是它在预测房价中的应用，如图 4-6。你也可以使用线性回归来量化数据多个变量之间的相关性——被称为多元线性回归。不过，在使用线性回归感到过度兴奋之前，确保你已经考虑了它的局限性：\n\
    \n*   线性回归仅适用于数值变量，不适用于分类变量。\n*   如果数据集存在缺失值，将会产生问题。在尝试构建线性回归模型之前，务必处理你的缺失值。\n\
    *   如果你的数据存在离群值，模型将产生不准确的结果。在继续之前检查离群值。\n*   线性回归假设数据集特征与目标变量之间存在线性关系。\n*   线性回归模型假设所有特征都是相互独立的。\n\
    *   预测误差，即 `residuals`（残差），应呈正态分布。\n\n"
