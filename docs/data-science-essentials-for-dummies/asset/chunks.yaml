    \ to the following standards:\n\n*   **If *r* is close to +1,** there is a strong\
    \ positive correlation between the variables.\n\n*   **If *r* = 0,** the variables\
    \ are not linearly correlated.\n\n*   **If *r* is close to –1,** there is a strong\
    \ negative correlation between the variables.\n\n### Ranking variable pairs using\
    \ Spearman’s rank correlation\n\nThe Spearman’s rank correlation is a popular\
    \ test for determining correlation between ordinal variables. By applying Spearman’s\
    \ rank correlation, you’re converting numeric variable pairs into ranks by calculating\
    \ the strength of the relationship between variables and then ranking them per\
    \ their correlation.\n\nThe Spearman’s rank correlation assumes the following:\n\
    \n*   **Your variables are ordinal.**\n\n*   **Your variables are related nonlinearly.**\
    \ You can identify nonlinearity between variables by looking at a graph. If the\
    \ graph between two variables produces a curve (like the one shown in [Figure\
    \ 4-2](#c04.xhtml#c04-fig-0002)), then the variables have a nonlinear relationship.\
    \ This curvature occurs because, with variables related in a nonlinear manner,\
    \ a change in the value of *x* doesn’t necessarily correspond to the same change\
    \ in dataset’s *y*\\-value.\n\n*   **Your data is nonnormally distributed.**\n\
    \n![FIGURE 4-2: An example of a nonlinear relationship between watch time and\
    \ percent viewership.](images/9781394297009-fg0402.png)\n\n[FIGURE 4-2:](#c04.xhtml#rc04-fig-0002)\
    \ An example of a nonlinear relationship between watch time and percent viewership.\n\
    \nTo use Spearman Rank to test for correlation between ordinal variables, you’d\
    \ simply plug the values for your variables into the following formula and calculate\
    \ the result:\n\n![math](images/eq04005.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
    ><m:mrow><m:mi>&#961;</m:mi><m:mo>&#160;</m:mo><m:mo>=</m:mo><m:mn>1</m:mn><m:mo>&#8722;</m:mo><m:mfrac><m:mrow><m:mn>6</m:mn><m:mo>&#8721;</m:mo><m:msup><m:mi>d</m:mi><m:mn>2</m:mn></m:msup></m:mrow><m:mrow><m:mi>n</m:mi><m:mrow><m:mo>(</m:mo><m:mrow><m:msup><m:mi>n</m:mi><m:mn>2</m:mn></m:msup><m:mo>&#8722;</m:mo><m:mn>1</m:mn></m:mrow><m:mo>)</m:mo></m:mrow></m:mrow></m:mfrac></m:mrow></m:math>\
    \ \n\n*   *ρ* = Spearman’s rank correlation coefficient\n\n*   *d* = difference\
    \ between the two ranks of each data point\n\n*   *n* = total number of data points\
    \ in the dataset\n\n## Reducing Data Dimensionality with Linear Algebra\n\nAny\
    \ intermediate-level data scientist should have a good understanding of linear\
    \ algebra and how to do math using matrices. Array and matrix objects are the\
    \ primary data structure in analytical computing. You need them in order to perform\
    \ mathematical and statistical operations on large and *multidimensional datasets*\
    \ (datasets with many different features to be tracked simultaneously).\n\nIn\
    \ this section, you see exactly what’s involved in using linear algebra and machine\
    \ learning methods to reduce a dataset’s dimensionality — in other words, to reduce\
    \ a dataset’s feature count, without losing the important information the dataset\
    \ contains, by compressing its features’ information into synthetic variables\
    \ that you can subsequently utilize to make predictions or as input into another\
    \ machine learning model.\n\n### Decomposing data to reduce dimensionality\n\n\
    Okay, what can you do with all this theory? Well, for starters, using a linear\
    \ algebra method called *singular value decomposition* (SVD), you can reduce the\
    \ dimensionality of your dataset — in other words, reduce the number of features\
    \ that you track when carrying out an analysis. Dimension reduction algorithms\
    \ are ideal if you need to compress your dataset while also removing redundant\
    \ information and noise. In data science, SVD is applied to analyze principal\
    \ components from large, noisy, sparse datasets — an approach machine learning\
    \ folks call *principal component analysis* (PCA). Because the linear algebra\
    \ involved in PCA is rooted in SVD, let’s look at how SVD works.\n\nThe SVD linear\
    \ algebra method decomposes the data matrix into the three resultant matrices\
    \ shown in [Figure 4-4](#c04.xhtml#c04-fig-0004). The product of these matrices,\
    \ when multiplied together, gives you back your original matrix. SVD is handy\
    \ when you want to compress or clean your dataset. Using SVD enables you to uncover\
    \ *latent variables* (inferred variables hidden within your dataset that affect\
    \ how that dataset behaves). Here are the two main ways to use the SVD algorithm:\n\
    \n*   **Compressing sparse matrices:** If you have a clean yet sparse dataset,\
    \ you don’t want to remove any of the information that the dataset holds, but\
    \ you do need to compress that information down into a manageable number of variables,\
    \ so you can use them to make predictions. A handy thing about SVD is that it\
    \ allows you to set the number of variables, or components, it creates from your\
    \ original dataset. And if you don’t remove any of those components, you’ll reduce\
    \ the size of your dataset without losing any of its important information. This\
    \ process is illustrated in [Figure 4-3](#c04.xhtml#c04-fig-0003).\n\n*   **Cleaning\
    \ and compressing dirty data:** In other cases, you can use SVD to do an algorithmic\
    \ cleanse of a dirty, noisy dataset. In this case you’d apply SVD to uncover your\
    \ components, and then decide which of them to keep by looking at their variance.\
    \ The industry standard is that explained variance of the components you keep\
    \ should add up to at least 75 percent or more. This ensures that at least 75\
    \ percent of the dataset’s original information has been retained within the components\
    \ you’ve kept. This process is shown in [Figure 4-4](#c04.xhtml#c04-fig-0004).\n\
    \n![Warning](images/warning.png)If the sum of the explained variance — or *cumulative\
    \ variance explained* (CVE) — for the components you keep is less than 95 percent,\
    \ don’t use the components as derived features further downstream in other machine\
    \ learning models. In this case, the information lost within these derived features\
    \ will cause the machine learning model to generate inaccurate, unreliable predictions.\
    \ These derived components are, however, useful as a source for descriptive statistics\
    \ or for building more general *descriptive analytics* — in other words, analytics\
    \ that describe what happened in the past, and answer questions like “What happened?,”\
    \ “When?,” “How many,?” and “Where?”\n\n![FIGURE 4-3: Applying SVD to compress\
    \ a sparse, clean dataset.](images/9781394297009-fg0403.png)"
