    ![Tip](img/tip.png)

    Python 程序员通常将列表、元组、集合和字典称为数据`structures`，而不是数据`types`。数据`structures` 是基本功能单元，用于组织数据，以便你正在编写的程序或应用程序高效地使用它们。


    ![Remember](img/remember.png)列表、元组、集合和字典是数据结构，但请记住，它们仍然由一个或多个基本数据类型组成（例如，数字和/或字符串）。


    ## Python 中的列表


    `list` 是数字和/或字符串的序列。要创建一个列表，你只需将列表元素（用逗号分隔）放在方括号内。以下是一个基础列表的示例：


    ```python

    >>> variable2=["ID","Name","Depth","Latitude", "Longitude"]

    >>> depth=[0,120,140,0,150,80,0,10]

    >>> variable2[3]''Latitude''

    ```


    列表的每个元素都会自动分配一个索引数字，从 0 开始。你可以使用此索引访问每个元素，并返回列表对应的值。如果你需要存储和分析大量数据，请使用列表——将数据存储在列表中可以很容易地提取统计信息。下面的代码片段是一个从前面代码示例创建的
    `depth` 列表元素提取平均值的简单计算示例：


    ```python

    >>> sum(depth)/len(depth)62.5

    ```


    在这个示例中，列表元素的平均值的计算方法是：首先通过 `sum` 函数对元素求和，然后除以列表中包含的元素数量——这个数字是通过 `len` 函数确定的，该函数返回字符串、数组或列表的`length`（换句话说，就是元素的数量）。这里分母中的
    `len` 函数返回的是对象中项目的平均值。看到了吗？这就像 1-2-3 一样简单！


    ## Python 中的元组


    `Tuples` 与列表相似，区别在于你在创建它们后无法修改其内容。此外，要创建元组，你需要使用普通括号而不是方括号。


    ![Remember](img/remember.png)“普通括号”指的是形式如 `(…)` 或 `(…, …, …)` 的圆括号。


    这里是一个元组的示例：


    ```python

    >>> depth=(0,120,140,0,150,80,0,10)

    ```


    在这种情况下，你无法像操作列表那样修改任何元素。为了确保你的数据保持为只读格式，请使用元组。


    ## Python 中的集合


    `set` 是另一种类似于列表的数据结构。然而，与列表不同，`set` 的元素是无序的。集合这种无序特性使得无法对其索引，因此它不是一种常用的数据类型。


    ## Python 中的字典


    `Dictionaries` 是由键值值对组成的数据结构。在字典中，每个值都对应一个特定的键，因此可以使用该键访问每个值。下面的代码片段显示了键/值对：


    ```python

    >>> variable4={"ID":0,"Name":"City","Depth":1,"Latitude":-2,"Longitude":1}

    ```


    ## 在 Python 中有效利用循环


    在处理列表时，最常用的循环是 `for` 循环。下面的代码片段说明了这一点：


    ```python

    >>> for element in variable2:print(element)

    ```


    ![Warning](img/remember.png)不要让索引数字困扰你。下面的代码片段说明了 `while` 循环：


    ```python

    >>> while condition:print(element)

    ```


    Python 中其他可用的循环是 `while` 循环。当给定条件为真时，使用 `while` 循环。


    ## 尽情玩函数


    函数（以及我将在下一节中描述的类）是每种编程语言的关键构建块。函数是接收输入、处理输入并返回输出的代码块。函数的输入可以是数字、字符串、列表等……Python
    有两种类型：内置和自定义的。


    `Built-in` 函数在 Python 内部预定义。你只需输入它们的名称即可使用它们。下面的代码片段是一个示例：


    ```python

    >>> print("Hello")

    ```


    `print` 背后的代码已经由创建 Python 的人员写好了。现在这些代码已经就绪，你不需要知道如何编写它——你只需调用 `print` 函数即可。Python
    库的创建者无法预测满足所有人需求的每个可能的函数，但他们成功地为用户提供了在需要时创建和复用自己函数的方法。


    在本章较前的“理清各种 Python 数据类型”部分中，该部分的以下代码片段（在此处再次列出）被用于求和列表元素并计算平均值：


    ```python

    >>> depth=[0,120,140,0,150,80,0,10]

    >>> sum(depth)/len(depth)62.5

    ```


    前面的数据代表了多个点位置的降雪和雪深记录。你可以看到，收集雪深测量点的平均深度为 62.5 单位。不过，这些是在同一时间采集的深度测量。换句话说，所有数据具有相同的时间戳。在使用
    Python 进行数据建模时，你经常会看到在不同时间进行测量组的情况——被称为`时间序列数据`。


    这里是时间序列数据的示例：


    ```python

    >>> december_depth=[0,120,140,0,150,80,0,10]

    >>> january_depth=[20,180,140,0,170,170,30,30]

    >>> february_depth=[0,100,100,40,100,160,40,40]

    ```


    你可以用与之前列表相同的方法计算 12 月、1 月和 2 月的平均雪深，但那样会非常麻烦。这就是自定义函数派上用场的地方：


    ```python

    >>> def average(any_list):return(sum(any_list)/ len(any_list))

    ```


