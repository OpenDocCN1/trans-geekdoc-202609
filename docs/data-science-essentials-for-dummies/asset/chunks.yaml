  trans: "\n\n![Remember](img/remember.png)与许多纯统计学家想让你相信的相反，数据科学领域并不等同于统计学领域。数据科学家在一个或多个领域拥有实质性的知识，他们利用统计学、数学、编码和强大的沟通能力，帮助他们发现、理解并传达与其专业领域相关的原始数据集中的数据洞察。统计学是这一公式至关重要的组成部分，但并不比其他要素更重要。在本章中，我将为你介绍概率、相关性分析、降维、决策建模、回归分析、异常值检测和时间序列分析的基本概念。\n\
    \n## 探索概率与推断统计学\n\n概率是统计学中最基础的概念之一。要开始利用统计学来理解你的数据，你需要能够识别出基础内容，例如你看到的是`描述性统计`还是`推断统计学`。你还需要牢牢掌握概率分布的基础知识。\n\
    \n`statistic`（统计量）是对数值数据进行数学运算后得到的结果。通常情况下，你在决策中使用统计学。统计学分为两种：\n\n*   **描述性（Descriptive）：**\
    \ 描述性统计提供描述，阐明数值数据集的某些特征，包括数据集的分布、中心趋势（如`mean`、`min` 或 `max`）和离散程度（如标准差和方差）。为了明确，数据集的`mean`\
    \ 是其数据点的平均值，数据集的`min` 是其数据点的最小值，数据集的`max` 是其数据点的最大值。描述性统计并不是为了说明任何因果主张。\n\n  \
    \  ![Remember](img/remember.png)描述性统计可以突出 `X` 和 `Y` 之间的关系，但它们并不假设 `X` 导致了 `Y`。\n\
    \n*   **推断性（Inferential）：** 推断统计学不是关注对数据集的相关描述，而是从数据集中划分出一个较小部分，并尝试推导出关于较大数据集的重要信息。与描述性统计不同，推断方法（如`回归分析`）*确实*尝试通过研究因果关系来进行预测。使用推断统计学来获取你感兴趣的真实世界测量值的信息。\n\
    \n描述性统计描述数值数据集的特征，但这并不能告诉你你为什么要关注它。事实上，大多数数据科学家对描述性统计感兴趣仅仅是因为它们揭示了其所描述的真实世界测量值的某些信息。例如，描述性统计量通常与`准确度`相关，这表明该统计量作为真实世界测量值估计值的价值。\n\
    \n为了更好地理解这个概念，想象一位企业主想要估计下个季度的利润。所有主可能会取过去几个季度的利润平均值，作为对下个季度利润额的估计。但如果前几个季度的利润波动很大，那么估计该预测利润值`variation`（变异性，即该金额估计值与实际获得利润之间的差额）的描述性统计量，将指示预测值可能偏实际值有多远。（拥有这些信息不坏，对吧？）\n\
    \n![Tip](img/tip.png)你可以以许多方式使用描述性统计——例如，用于检测异常值，或为特征预处理需求制定计划，或者快速识别你可能想要（或不想）在分析中使用哪些特征。\n\
    \n与描述性统计一样，`推断统计学`被用于揭示关于真实世界测量值的某些信息。推断统计学通过提供关于一小数据选择的信息来实现这一点，以便你可以利用这些信息对取自它的较大数据集推断出结论。在统计学中，这个较小的数据选择被称为`sample`（样本），而从中提取样本的较大、完整数据集被称为`population`（总体）。\n\
    \n如果你的数据集太大而无法整体分析，可以从该数据提取一个较小的样本进行分析，然后根据你从分析样本中学到的知识对整个数据集进行推断。在无法负担为整个总体收集数据的情况下，你也可以使用推断统计学来估计缺失部分。\n\
    \n![Warning](img/warning.png)为了使推断有效，你必须仔细选择你的样本。即使你的样本具有代表性，数字总是会表现出一些`noise`（噪声）。\n\
    \n### 概率分布\n\n想象一位企业主想要估计下个季度的利润。可能会可能会过去几个季度的利润平均值，作为对下个季度利润额的估计。但如果前几个季度的利润波动很大，那么估计该预测利润值`variation`（变异性，即该金额估计值与实际获得利润之间的差额）的描述性统计量，将指示预测值可能偏实际值有多远。\n\
    \n与描述性统计一样，`推断统计学`被用于揭示关于真实世界测量值的某些信息。推断统计学通过提供关于一小数据选择的信息来实现这一点，以便你可以利用这些信息对取自它的较大数据集推断出结论。在统计学中，这个较小的数据选择被称为`sample`（样本），而从中提取样本的较大、完整数据集被称为`population`（总体）。\n\
    \n想象你刚刚来到拉斯维加斯并坐在你喜欢的桌旁。因为球可以以等概率落在任何槽中，所以存在一种`均匀概率分布`。但轮盘的槽位并不是完全相同的——轮盘有 18\
    \ 个黑色槽和 20 个红色或绿色的槽。\n\n![math](img/eq0401.png)<m:math xmlns:m=\"http://www.w3.org/1998/MathML\"\
    ><m:mrow><m:mi mathvariant=\"normal\">Probability</160;</m:mi><m:mo stretchy=\"\
    false\">(</m:mo><m:misoft=\"normal\">black</m:mi><m:mo stretchy=\"false\">)</m:mo><m:mo>=</m:mo><m:mfrac\
    \ bevelled=\"true\"><m:mrow><m:mn>18</m:mn></m:mrow><m:mrow><m:mn>38</m:mn></m:mrow></m:mfrac><m:mo>=</m:mo><m:mn>.4736</m:mn></m:mrow></m:math>\
    \ 由于这种安排，球落在黑色槽的概率是 47.36%。你这里的净收益可以被视为一个`random variable`（随机变量），它是与物体、人或地点（真实世界中的事物）相关的不可预测的特征或值的度量。然而，尽管这个特征或值是不可预测的，但并不意味着你对其一无所知。此外，你可以利用你*已知*的信息来帮助你决策。\n\
    \n`weighted average`（加权平均值）是对大量数据点量的平均值。如果你在概率分布上对你的收益（随机变量）取加权平均，这将产生一个`expectation\
    \ value`（期望值）——即连续投注后净收益的预期值。（期望值也可以被看作最佳猜测，如果你必须猜的话。）\n\n"
