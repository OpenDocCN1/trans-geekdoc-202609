- raw: 'Clustering is one of the two main types of machine learning: unsupervised
    machine learning. In *unsupervised machine learning,* the data in the dataset
    is unlabeled. Because the data is unlabeled, the algorithms must use inferential
    methods to discover patterns, relationships, and correlations within the raw dataset.
    To put clustering through its paces, I want to use a readily available sample
    dataset from the World Bank’s open datasets on country income and education. This
    data shows the percentage of income earned by the bottom 10 percent of the population
    in each country and the percentage of children who complete primary school in
    each country.


    ![Warning](images/warning.png)In datasets about the percentage of children who
    complete primary school, some are reported at more than 100 percent. That’s because
    some countries count this statistic at different ages, but the data was *normalized*
    so that the percentage distribution is proportionally scaled across the range
    of countries represented in the dataset. In other words, although the total scale
    exceeds 100 percent, the values have been normalized so that they’re proportional
    to one another and you’re getting an apples-to-apples comparison. Thus, the fact
    that some countries report completion rates greater than 100 percent has no adverse
    effect on the analysis you make in this chapter.


    ### Getting to know clustering algorithms


    You use clustering algorithms to subdivide unlabeled datasets into clusters of
    observations that are most similar for a predefined feature. If you have a dataset
    that describes multiple features about a set of observations and you want to group
    your observations by their feature similarities, use clustering algorithms.


    ![Tip](images/tip.png)Over on the companion website to this book ([`https://businessgrowth.ai`](https://businessgrowth.ai/)),
    you’ll find a free training-and-coding demonstration of how to use clustering
    in Python for a popular use case — customer profiling and segmentation.


    You can choose from various clustering methods, depending on how you want your
    dataset to be divided. The two main types of clustering algorithms are


    *   **Partitional:** Algorithms that create only a single set of clusters


    *   **Hierarchical:** Algorithms that create separate sets of nested clusters,
    each in its own hierarchical level


    You can read about both approaches later in this chapter, but for now, start by
    looking at [Figure 5-1](#c05.xhtml#c05-fig-0001), a simple scatterplot of the
    Country Income and Education datasets.


    In unsupervised clustering, you start with this data and then proceed to divide
    it into subsets. These subsets, called *clusters,* are composed of observations
    that are most similar to one another. In [Figure 5-1](#c05.xhtml#c05-fig-0001),
    it appears that the scatterplot has at least two clusters, and probably three
    — one at the bottom with low income and education, and then the high-education
    countries look like they may be split between low and high incomes.


    [Figure 5-2](#c05.xhtml#c05-fig-0002) shows the result of *eyeballing* (making
    a visual estimate of) clusters in this dataset.


    ![Tip](images/tip.png)Although you can generate visual estimates of clusters,
    you can achieve much more accurate results when dealing with much larger datasets
    by using algorithms to generate clusters for you. Visual estimation is a rough
    method that’s useful only on smaller datasets of minimal complexity. Algorithms
    produce exact, repeatable results, and you can use algorithms to generate clusters
    from multiple dimensions of data within your dataset.


    ![FIGURE 5-1: A simple scatterplot.](images/9781394297009-fg0501.png)


    [FIGURE 5-1:](#c05.xhtml#rc05-fig-0001) A simple scatterplot.


    ![FIGURE 5-2: A simple scatterplot, showing eyeballed estimations of clustering.](images/9781394297009-fg0502.png)


    [FIGURE 5-2:](#c05.xhtml#rc05-fig-0002) A simple scatterplot, showing eyeballed
    estimations of clustering.


    Clustering algorithms are appropriate in situations where the following characteristics
    are true:


    *   You know and understand the dataset you’re analyzing.


    *   Before running the clustering algorithm, you don’t have an exact idea of the
    nature of the subsets (clusters). Often, you don’t even know how many subsets
    are in the dataset before you run the algorithm.


    *   The subsets (clusters) are determined by only the single dataset you’re analyzing.


    *   Your goal is to determine a model that describes the subsets in a single dataset
    and only this dataset.


    ![Tip](images/tip.png)If you add more data to your dataset after you’ve already
    built the model, be sure to rebuild the model from scratch to produce more complete
    and accurate model results.


    ### Examining clustering similarity metrics


    Clustering is based on calculating the similarity or difference between two observations.
    If your dataset is *numeric* (composed of only numerical features) and can be
    portrayed on an *n*\-dimensional plot, you can use various geometric metrics to
    scale your multidimensional data.


    ![Remember](images/remember.png)An n*\-dimensional plot* is a multidimensional
    scatterplot that you can use to plot *n* number of dimensions of data.


    Here are some popular geometric metrics, used for calculating distances between
    observations:


    *   **Euclidean:** A measure of the distance between points plotted on a Euclidean
    plane.


    *   **Manhattan:** A measure of the distance between points where distance is
    calculated as the sum of the absolute value of the differences between two points’
    Cartesian coordinates.


    *   **Minkowski distance:** A generalization of the Euclidean and Manhattan distance
    metrics. Quite often, these metrics can be used interchangeably.


    *   **Cosine similarity:** The cosine metric measures the similarity of two data
    points based on their orientation, as determined by calculating the cosine of
    the angle between them.


    Lastly, for nonnumeric data, you can use metrics like the *Jaccard distance metric,*
    an index that compares the number of features that two observations have in common.
    For example, to illustrate a Jaccard distance, look at these two text strings:


    `Saint Louis de Ha-ha, QuebecSt-Louis de Ha!Ha!, QC`


    What features do these text strings have in common? And what features are different
    between them? The Jaccard metric generates a numerical index value that quantifies
    the similarity between text strings.


    ## Identifying Clusters in Your Data


    You can use many different algorithms for clustering, but the speed and robustness
    of the *k*\-means algorithm make it a popular choice among experienced data scientists.
    As alternatives, kernel density estimation methods, hierarchical algorithms, and
    neighborhood algorithms are also available to help you identify clusters in your
    dataset.


    ### Clustering with the k-means algorithm


    The k*\-means* clustering algorithm is a simple, fast, unsupervised learning algorithm
    that you can use to predict groupings within a dataset. For getting started with
    *k*\-means clustering, you first need to be familiar with the concept of centroid.
    A *centroid* is the most representative point within any given cluster group.
    With *k*\-means, you define the number of centroids the model should find as it
    generates its prediction. The *number of centroids* is represented by *k*, and
    the clusters are formed by calculating the nearest mean values to those centroids,
    measured by the Euclidean distance between observations.


    ![Warning](images/warning.png)Because the features of a dataset are usually on
    different scales, the difference of scales can distort the results of this distance
    calculation. To avoid this problem, scale your variables before using *k*\-means
    to predict data groupings.'
