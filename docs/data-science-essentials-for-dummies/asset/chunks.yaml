    #### Learning from data with scikit-learn


    scikit-learn ([`https://scikit-learn.org`](https://scikit-learn.org/)) is far
    and away Python’s best machine learning library. With it, you can execute all
    sorts of machine learning methods, including classification, regression, clustering,
    dimensionality reduction, and more. The library also offers a preprocessing module
    that is wonderfully supportive whenever you need to prepare your data for predictive
    modeling. Lastly, scikit-learn offers a model selection module that’s readily
    available with all sorts of metrics to help you build your models and choose the
    best-performing model among a selection.


