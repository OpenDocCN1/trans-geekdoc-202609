    \ technologies are so accessible and represent so much upside potential to modern\
    \ businesses that I include high-level coverage of them in the pages that follow.\n\
    \n## Getting a Handle on SQL and Relational Databases\n\nSome data professionals\
    \ are resistant to learning SQL because of the steep learning curve involved.\
    \ They think, “I’m not a coder, and Structured Query Language sure *sounds* like\
    \ a programming language to me.” In the case of SQL, though, it’s *not* a programming\
    \ language, as you’ll soon see. As far as the upside potential goes of learning\
    \ to use SQL to query and access data, it’s worth the small degree of hassle.\n\
    \nSQL is a standard for creating, maintaining, and securing relational databases.\
    \ It’s a set of rules you can use to quickly and efficiently query, update, modify,\
    \ add, or remove data from large and complex databases. You use SQL rather than\
    \ Python or a spreadsheet application to do these tasks because SQL is the simplest,\
    \ fastest way to get the job done. It offers a plain and standardized set of core\
    \ commands and methods that are easy to use when performing these particular tasks.\
    \ In this chapter, I introduce you to basic SQL concepts and explain how you can\
    \ use SQL to do cool things like query, join, group, sort, and even text-mine\
    \ structured datasets.\n\n![Remember](images/remember.png)Although the SQL standard\
    \ is lengthy, a user commonly needs fewer than 20 commands, and the syntax is\
    \ human-readable — for example, if you need to pull data on employees in the finance\
    \ department who earn more than $50,000 per year in salary, you could use an SQL\
    \ statement like the one shown in [Figure 7-1](#c07.xhtml#c07-fig-0001). Making\
    \ things even easier, SQL commands are written in all caps, which helps to keep\
    \ the language distinct and separate in your mind from other programming languages.\n\
    \n ![FIGURE 7-1: An example of how SQL is human-readable.](images/9781394297009-fg0701.png)\n\
    \n[FIGURE 7-1:](#c07.xhtml#rc07-fig-0001) An example of how SQL is human-readable.\n\
    \nAlthough you can use SQL to work with structured data that resides in relational\
    \ database management systems, you can’t use standard SQL as a solution for unstructured\
    \ or semistructured data. I give you more solutions for handling these types of\
    \ data in [Chapter 2](#c02.xhtml), where I discuss data engineering and its components.\
    \ For now, suffice it to say that SQL is simply a tool you can use to manipulate\
    \ and edit structured data tables. It’s nothing exceedingly innovative, but it\
    \ can be helpful to use SQL for the data querying and manipulation tasks that\
    \ often arise in the practice of data science. In this chapter, I introduce the\
    \ basics of relational databases, SQL, and database design.\n\n![Remember](images/remember.png)Although\
    \ the name Structured Query Language suggests that SQL is a programming language,\
    \ don’t be misled. SQL is not a programming language, like R or Python. Instead,\
    \ it’s a language of commands and syntax that you can use to create, maintain,\
    \ and search relational database systems. SQL supports a few common programming\
    \ forms, like conditionals and loops, but to do anything more complex, you’d have\
    \ to import your SQL query results into another programming platform and then\
    \ do the more complex work there.\n\nOne fundamental characteristic of SQL is\
    \ that you can use it on only structured data that sits in a relational database.\
    \ SQL database management systems (DBMSs) optimize their own structure with minimal\
    \ user input, which enables blazing-fast operational performance.\n\n![Remember](images/remember.png)An\
    \ *index* is the lookup table. You create it in order to index, point to, and\
    \ “look up” data in tables of a database. Although SQL DBMSs are known for their\
    \ fast structured database querying capabilities, this speed and effectiveness\
    \ are heavily dependent on good indexing. Good indexing is vital for fast data\
    \ retrieval in SQL.\n\nSimilar to how different web browsers comply with, add\
    \ to, and ignore different parts of the HTML standard in different ways, SQL rules\
    \ are interpreted a bit differently, depending on whether you’re working with\
    \ open-source products or commercial vendor software applications. Because not\
    \ every SQL solution is the same, it’s a good idea to know something about the\
    \ benefits and drawbacks of some of the more popular SQL solutions on the market.\
    \ Here are two popular open-source SQL implementations commonly used by data scientists:\n\
    \n*   **MySQL:** By far the most popular open-source version of SQL, MySQL offers\
    \ a complete and powerful version of SQL. It’s used on the back end of millions\
    \ of websites.\n\n*   **PostgreSQL:** This software adds object-oriented elements\
    \ to SQL’s relational language, making it popular with programmers who want to\
