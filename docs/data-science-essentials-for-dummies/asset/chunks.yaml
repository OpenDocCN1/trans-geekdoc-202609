    *   **脚本：** 大多数数据科学家都知道如何使用 Python 进行数据分析和可视化。这些脚本文件以 `.ply` 或 `.ipynb`（Python）扩展名结尾。


    *   **应用：** Excel 适用于中小型数据集进行快速、方便的抽检分析。这些应用文件具有 `.xls` 或 `.xlsx` 扩展名。


    *   **Web 编程：** 如果你正在构建自定义的 Web 数据可视化，你可能会使用 `D3.js` —— 即数据驱动文档，这是一个用于数据可视化的 JavaScript
    库。当你使用 `D3.js` 时，你会使用数据 `.html`、`.svg` 和 `.css` 文件来操作网页文档。


    ## 将数学建模应用于数据科学任务


    数据科学之所以高度依赖从业者的数学技能（以及下节介绍的统计学技能），正是因为这些是理解你的数据及其意义所需要的技能。这些技能在数据科学中也很有价值，因为你可以利用它们来执行预测预测、决策建模和假设检验。


    ![Remember](img/remember.png) `Mathematics` 使用确定性方法对世界进行 `定量`（或数值）描述；`statistics`
    是一门源自数学的科学，但它侧重于使用 `随机`（概率）方法和推断方法形成对世界的定量描述。（我将在第 4 章中为你介绍更多关于数学和统计学的知识）。数据科学家使用数学方法建立决策模型、生成近似值并对未来做出预测。第
    4 章介绍了许多在数据科学工作中非常有用的数学方法。


    ![Remember](img/remember.png)在本书中，假设你已经具备相当扎实的基础数学——如果你上过大学水平的微积分甚至线性代数，你将受益浅。然而，我会尽可能适应你的水平。我意识到你可能基于有限的数学知识（高等代数或可能是商业数学）进行工作，因此我用通俗易懂的方法传达高级数学概念，让每个人都能理解。


    ## 从统计方法中获取洞察


    在数据科学中，统计方法对于更好地理解数据的意义、验证假设、模拟场景以及对未来事件进行预测非常有帮助。高级统计技能即使在定量分析师、工程师和科学家中也相当稀缺。然而，如果你想在数据科学领域有所作为，请花些时间掌握一些基础统计方法，如线性回归和逻辑回归、朴素贝叶斯分类和时间序列分析。（这些方法在第
    4 章中涵盖）。


    ## 编码、编码、编码——这只是游戏的一部分


    在数据科学工作中，编码是不可避免的。你需要能够编写代码，以便指示计算机如何处理、分析和可视化你的数据。像 Python 这样的语言对于编写数据处理、分析和可视化的脚本至关重要。而
    SQL 则对于数据查询非常有用。


    尽管编码是数据科学的要求，但它不必像人们所描述的那样巨大且可怕。你的编码可以像你想要的那样精巧复杂，但你也可以采取相当简单的方法。虽然这些技能对成功至关重要，但你可以很容易地学习足够的编码知识来实践高级数据科学。我将第
    6 章和第 7 章专门用于帮助你了解 Python 入门和 SQL 查询的各个基础。


    ## 将数据科学应用于特定领域


    统计学家过去在接受数据科学的意义方面表现出某种程度的固执。许多统计学家曾大喊：“数据科学并不新奇——它只是我们一直以来所做事情的另一个名字！”尽管我能同情他们的观点，但我被迫站在数据科学家的阵营，他们明确声明数据科学是相互独立的，并且绝对与组成它的统计方法有本质区别。


    我对数据科学独有性的观点在某种程度上基于这样一个事实：数据科学家经常使用传统统计学未使用的计算机语言，并采用源自数学领域的方法。但统计学与数据科学之间的主要区别在于对领域专业知识（subject
    matter expertise）的需求。


    由于统计学家通常在统计之外领域的知识有限，他们几乎总是被迫咨询领域专家（SME）来验证他们的确切含义。


    以下是当今知识工作者将数据科学技能与其各自领域结合的一些方式：


    *   **临床信息学科学家**将医疗保健知识与数据科学技能相结合，产生个性化的医疗保健治疗方案。他们利用医疗信息学预测并预防高风险患者的未来健康问题。


    *   **营销数据科学家**将数据科学与营销专业知识相结合，以预测和预防客户流失（客户从产品或服务流向竞争对手）。他们还优化营销策略、构建推荐引擎并精调营销组合模型。


    *   **数据记者** `scrape` 网站（直接从网站页面上大量提取数据）以获取新鲜数据，以便发现并报道最新的新闻故事。（我将在第 8 章中更多地讨论数据故事）。


    *   **数据科学总监**通过额外的数据科学专业知识增强他们的技术项目管理能力。他们的工作包括领导数据项目，并努力保护他们负责的数据项目的盈利。他们还确保
    C 高管、业务经理与团队中负责执行工作的数据人员之间进行透明的沟通。


    *   **数据产品经理**利用数据科学的力量增强他们的产品管理能力。他们使用数据科学生成预测性洞察，更好地指导产品设计、开发、发布和策略的决策。


    *   **机器学习工程师**将软件工程的超能力与数据科学技能相结合，构建预测应用。这是一个经典的数据实现角色，我将在第 2 章中讨论。


    ## 沟通数据洞察


    作为数据科学家，你必须具备敏锐的口头沟通能力。如果一个数据科学家无法交流，世界上所有的知识和洞察对组织都没有用处。数据科学家需要以员工能够理解的方式来解释数据洞察。不仅如此，数据科学家还需要产生清晰且有意义的数据可视化和书面叙。大多数时候，人们需要亲眼看到一个概念才能真正理解它。数据科学家在沟通手段和方法上必须兼具创造性和务实。


    '
