  trans: '

    弥合无代码、低代码、SQL 和电子表格之间的差距，SQL 数据库以及如 Excel 和 Google Sheets 等电子表格应用程序提供了知识工作人员今天即可开始使用的无代码和低代码环境，以提高其公司数据的生产力和盈利能力。这些技术非常易于上手，并且对现代业务具有巨大的增长潜力，因此在随后的章节中，我对它们进行了高层概述。


    ## 掌握 SQL 和关系型数据库


    某些数据专业人员因为学习曲线陡峭而抵制学习 SQL。他们想：“我不是程序员，而结构化查询语言（Structured Query Language）听起来确实是一门编程语言。”然而，对于
    SQL 来说，它并不是一种编程语言，你很快就会发现。就学习使用 SQL 查询和访问数据的增长潜力来看，付出一点小的麻烦是值得的。


    SQL 是创建、维护和保护关系型数据库的标准。它是一组规则，你可以利用这些规则快速高效地对大型复杂数据库进行查询、更新、修改、添加或删除数据。你使用 SQL
    而不是 Python 或电子表格应用程序来完成这些任务，是因为 SQL 是完成工作最简单、快速的方法。它提供了一套简单且标准化的核心命令和方法，在执行这些任务时易于使用。在本章中，我将为你介绍基础
    SQL 概念，并解释你如何使用 SQL 执行诸如查询、连接、排序甚至结构化数据集等酷炫的操作。尽管 SQL 标准很长，但用户通常需要的少于 20 条命令，且其语法是人类可读的——例如，如果你需要提取年薪超过
    50,000 美元的财务部门员工数据，你可以使用如图 7-1 所示的 SQL 语句。为了让事情变得更容易，SQL 命令使用全大写字母编写，这有助于在你的脑海中将该语言与其他编程语言区分开并独立出来。


    尽管你可以使用 SQL 处理位于关系型数据库系统中的结构化数据，但你不能将标准 SQL 作为非结构化数据的解决方案。我在`第 2 章`中讨论了数据工程。目前，只需说
    SQL 仅仅是你可以用来操作和编辑结构化表格的工具即可。它并没有特别了不起，但对于数据科学中出现的数据查询和处理任务，使用 SQL 是很有用的。


    SQL 的一个基本特性是，你可以将其用于位于关系型数据库中的结构化数据。SQL 数据库管理系统（DBMSs）通过极少的用户输入优化其自身的结构，从而实现了极快的运行性能。`index`（索引）就是查找表。你创建它是为了对表中的数据进行索引、指向和“查找”。尽管
    DBMS 以其快速的数据库查询能力闻名，但这种速度和效率在很大程度上取决于良好的索引。良好的索引对于 SQL 中的快速数据检索至关重要。


    与不同的网络浏览器以不同方式遵循、添加或忽略 HTML 标准的不同部分类似，SQL 规则的解释方式也略有不同，这取决于你处理的是开源产品还是商业厂商应用程序。由于并不是每个
    SQL 解决方案都是相同的，因此了解市面上一些较流行的 SQL 解决方案的优缺点是一个好主意。以下是数据科学家常用的两种流行的开源 SQL 实现：


    -   MySQL：到目前为止最流行的开源 SQL 版本，`MySQL` 了一个了一个完整且强大的 SQL 版本。它被用于数百万网站的后端。

    -   PostgreSQL：该 `PostgreSQL` 软件在 SQL 的关系语言中添加了面向对象的元素，使其在想要将 SQL 对象集成到自己平台对象模型中的程序员中广受欢迎。


    其他强大的 SQL 实现，如 Oracle 和 Microsoft SQL Server，也是极出色的解决方案，但它们的设计是为了用于更传统的业务场景，而不是作为数据科学工具。


    正如你从名称猜的那样，关系型数据库最显著的特征是它们是“关系”——它们由相关的表组成。为了说明关系型数据库的概念，首先想象一个具有行、列以及列之间预定义关系的
    Excel 电子表格。然后想象一个包含许多工作表（表）的 Excel 工作簿，其中每个工作表都有与一个或多个其他工作表相同的列。由于这些工作表具有共享关系，如果你使用
    SQL，就可以通过这种共享关系查找所有相关工作表的数据。这种关系如图 7-2 所示。


    让我们用以下场景作为说明。此数据表描述了电影并列出了观众的评分：


    '
