    between variables by looking at a graph. If the graph between two variables produces
    a curve (like the one shown in [Figure 4-2](#c04.xhtml#c04-fig-0002)), then the
    variables have a nonlinear relationship. This curvature occurs because, with variables
    related in a nonlinear manner, a change in the value of `x` doesn’t necessarily
    correspond to the same change in dataset’s `y`-value.

    *   **Your data is nonnormally distributed.**


