    # Introduction


    This book was written as much for expert data scientists as it was for aspiring
    ones. Its content represents a new approach to doing data science — one that puts
    business vision and profitably at the heart of our work as data scientists.


    Data science and artificial intelligence (AI) have disrupted the business world
    so radically that it’s nearly unrecognizable compared to what things were like
    just 10 or 15 years ago. The good news is that most of these changes have made
    everyone’s lives and businesses more efficient, more fun, and dramatically more
    interesting. The bad news is that if you don’t yet have at least a modicum of
    data science competence, your business and employment prospects are growing dimmer
    by the moment.


    Since 2014, when this book was first written (throughout the first several editions),
    I’ve harped on this same point. Lots of people listened! So much has changed about
    data science over the years, however, that this book has needed two full rewrites
    since it was originally published. What changed? The math and scientific approach
    that underlie data science haven’t changed one bit. But over the years, with all
    the expansion of AI adoption across business and with the remarkable increase
    in the supply of data science workers, the data science landscape has seen a hundredfold
    increase in diversity with respect to what people and businesses are using data
    science to achieve.


    The original idea behind this book when it was first published was to provide
    “a reference manual to guide you through the vast and expansive areas encompassed
    by data science.” At the time, not too much information out there covered the
    breadth of data science in one resource. That’s changed!


    *Data scientist* as a title only really began to emerge in 2012. Most of us practitioners
    in the field back then were all new and still finding our way. In 2014, I didn’t
    have the perspective or confidence I needed to write a book like the one you’re
    reading now. Thank you so much to all the readers who have read this book previously,
    shared positive feedback, and applied what they learned to create better lives
    for themselves and better outcomes for their companies. The positive transformation
    of my readers is a big part of what keeps me digging deep to produce the very
    best version of this book that I possibly can.


    The internet is full of *information for the sake of information* — information
    that lacks the depth, context, and relevance that are needed to transform that
    information to true meaning in the lives of its consumers. Publishing more of
    this type of content doesn’t help people — it confuses them, overwhelms them,
    and wastes their precious time! When writing this book for a third time, I took
    a radical stance against “information for the sake of information.”


    I also want to make three further promises about the content in this book: It’s
    meaningful, it’s actionable, and it’s relevant. If it isn’t one of these three
    adjectives, I’ve made sure it hasn’t made its way into this book.'
