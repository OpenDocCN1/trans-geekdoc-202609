- raw: 'In the past, only large tech companies with massive funding had the skills
    and computing resources required to implement data science methodologies to optimize
    and improve their business, but that hasn’t been the case for quite a while now.
    The proliferation of data has created a demand for insights, and this demand is
    embedded in many aspects of modern culture — from the Uber passenger who expects
    the driver to show up exactly at the time and location predicted by the Uber app
    to the online shopper who expects the Amazon platform to recommend the best product
    alternatives for comparing similar goods before making a purchase. Data and the
    need for data-informed insights are ubiquitous. Because organizations of all sizes
    are beginning to recognize that they’re immersed in a sink-or-swim, data-driven,
    competitive environment, data know-how has emerged as a core and requisite function
    in almost every line of business.


    What does this mean for the average knowledge worker? It means that everyday employees
    are increasingly expected to support a progressively advancing set of technological
    and data requirements. Why? Because almost all industries are reliant on data
    technologies and the insights they spur. Consequently, many people are in continuous
    need of upgrading their data skills, or else they face the real possibility of
    being replaced by a more data-savvy employee.


    The good news is that upgrading data skills doesn’t usually require people to
    go back to college or earn a university degree in statistics, computer science,
    or data science. The bad news is that, even with professional training or self-teaching,
    it always takes extra work to stay industry-relevant and tech-savvy. In this respect,
    the data revolution isn’t so different from any other change that has hit industry
    in the past. The fact is, in order to stay relevant, you need to take the time
    and effort to acquire the skills that keep you current. When you’re learning how
    to do data science, you can take some courses, educate yourself using online resources,
    read books like this one, and attend events where you can learn what you need
    to know to stay on top of the game.


    Who can use data science? You can. Your organization can. Your employer can. Anyone
    who has a bit of understanding and training can begin using data insights to improve
    their lives, their careers, and the well-being of their businesses. Data science
    represents a change in the way you approach the world. When determining outcomes,
    people once used to make their best guess, act on that guess, and then hope for
    the desired result. With data insights, however, people now have access to the
    predictive vision that they need to truly drive change and achieve the results
    they want.


    Here are some examples of ways you can use data insights to make the world, and
    your company, a better place:


    *   **Develop key performance indicators (KPIs) for your business systems.** Use
    KPIs to track performance and optimize the return on investment (ROI) for measurable
    business activities.


    *   **Develop your marketing strategy.** Use data insights and predictive analytics
    to identify marketing strategies that work, eliminate underperforming efforts,
    and test new marketing strategies.


    *   **Keep communities safe.** Predictive policing applications help law enforcement
    personnel predict and prevent local criminal activities.


    *   **Help make the world a better place for those less fortunate.** Data scientists
    in developing nations are using social data, mobile data, and data from websites
    to generate real-time analytics that improve the effectiveness of humanitarian
    responses to disasters, epidemics, food scarcity issues, and more.


    ## Inspecting the Pieces of the Data Science Puzzle


    To practice data science, in the true meaning of the term, you need the analytical
    know-how of math and statistics, the coding skills necessary to work with data,
    and an area of subject matter expertise. Without this expertise, you may as well
    call yourself a mathematician or a statistician. Similarly, a programmer without
    subject matter expertise and analytical know-how may better be considered a software
    engineer or developer, but not a data scientist.


    The need for data-informed business and product strategy has been increasing exponentially
    for about a decade now, forcing all business sectors and industries to adopt a
    data science approach. As such, different flavors of data science have emerged.
    The following are just a few titles under which experts of every discipline are
    required to know and regularly do data science:


    *   Clinical biostatistician


    *   Data and tech policy analyst


    *   Data scientist–geospatial and agriculture analyst


    *   Data scientist–health care


    *   Digital banking product owner


    *   Director of data science–advertising technology


    *   Geotechnical data scientist


    *   Global channel ops–data excellence lead


    Nowadays, it’s almost impossible to differentiate between a proper data scientist
    and a subject matter expert (SME) whose success depends heavily on their ability
    to use data science to generate insights. Looking at a person’s job title may
    or may not be helpful, simply because many roles are titled *data scientist* when
    they may as well be labeled data strategist or product manager, based on the actual
    requirements. In addition, many knowledge workers are doing daily data science
    and not working under the title of *data scientist.* It’s an overhyped, often
    misleading label that’s not always helpful if you’re trying to find out what a
    data scientist does by looking at online job boards.


    To shed some light, in the following sections I spell out the key components that
    are part of any data science role, regardless of whether that role is assigned
    the *data scientist* label.


    ### Collecting, querying, and consuming data


    Data engineers have the job of capturing and collating large volumes of structured,
    unstructured, and semistructured *big data* (an outdated term that’s used to describe
    data that exceeds the processing capacity of conventional database systems because
    it’s too big, it moves too fast, or it lacks the structural requirements of traditional
    database architectures).


    ![Remember](images/remember.png)Data engineering tasks are separate from the work
    that’s performed in data science, which focuses more on analysis, prediction,
    and visualization. Despite this distinction, whenever data scientists collect,
    query, and consume data during the analysis process, they perform work similar
    to that of the data engineer (the role I tell you about earlier in this chapter).


    Although valuable insights can be generated from a single data source, often the
    combination of several relevant sources delivers the contextual information required
    to drive better data-informed decisions. A data scientist can work from several
    datasets that are stored in a single database, or even in several different data
    storage environments. At other times, source data is stored and processed on a
    cloud-based platform built by software and data engineers.


    No matter how the data is combined or where it’s stored, if you’re a data scientist,
    you almost always have to *query* data — in other words, write commands to extract
    relevant datasets from data storage systems. Most of the time, you use Structured
    Query Language (SQL) to query data. ([Chapter 7](#c07.xhtml) is all about SQL,
    so if the acronym scares you, jump ahead to that chapter now.)


    Whether you’re using a third-party application or doing custom analyses by using
    a programming language such as R or Python, you can choose from a number of universally
    accepted file formats:


    *   **Comma-separated values (CSV):** Almost every brand of desktop and web-based
    analysis application accepts this file type, as do commonly used scripting languages
    such as Python and R.'
