- raw: 'The quality of the clusters is heavily dependent on the correctness of the
    *k* value you specify. If your data is two- or three-dimensional, a plausible
    range of *k* values may be visually determinable. In the eyeballed approximation
    of clustering from the World Bank Income and Education data scatterplot (refer
    to [Figure 5-2](#c05.xhtml#c05-fig-0002)), a visual estimation of the *k* value
    would equate to three clusters, or *k* = 3.


    ![Remember](images/remember.png)When defining the *k* value, it may be possible
    to choose the number of centroids by looking at a scatterplot (if your dataset
    is two- or three-dimensional) or by looking for obvious, significant groupings
    within your dataset’s variables. You can pick the number of centroids based on
    the number of groupings that you know exist in the dataset or by the number of
    groupings that you want to exist in the dataset. Whatever the case, use your subjective
    knowledge about the dataset when choosing the number of clusters to be modeled.


    If your dataset has more than three dimensions, however, you can use computational
    methods to generate a good value for *k*. One such method is the *silhouette coefficient*
    (a method that calculates the average distance of each point from all other points
    in a cluster and then compares that value with the average distance to every point
    in every other cluster). Luckily, because the *k*\-means algorithm is efficient,
    it doesn’t require much computer processing power and you can easily calculate
    this coefficient for a wide range of *k* values.


    The *k*\-means algorithm works by placing sample cluster centers on an *n*\-dimensional
    plot and then evaluating whether moving them in any single direction would result
    in a new center with higher *density* — with more observations closer to it, in
    other words. The centers are moved from regions of lower density to regions of
    higher density until all centers are within a region of *local maximum density*
    (a true center of the cluster, where each cluster has a maximum number of data
    points closest to its cluster center). Whenever possible, try to place the centers
    yourself, manually. If that’s impossible, simply place the centers randomly and
    run the algorithm several times to see how often you end up with the same clusters.


    One weakness of the *k*\-means algorithm is that it may produce incorrect results
    by placing cluster centers in areas of *local minimum density.* This happens when
    centers get lost in *low-density regions* (in other words, regions of the plot
    that have relatively few points plotted in them) and the algorithm-driven *directional
    movement* (the movement that’s meant to increase point density) starts to bounce
    and oscillate between faraway clusters. In these cases, the center gets caught
    in a low-density space that’s located between two high-point density zones. This
    results in erroneous clusters based around centers that converge in areas of low,
    local minimum density. Ironically, this happens most often when the underlying
    data is very well clustered, with tight, dense regions that are separated by wide,
    sparse areas.


    ![Tip](images/tip.png)Get hands-on experience with the free *k*\-means clustering
    coding demo that’s hosted on the companion website for this book: [`https://businessgrowth.ai`](https://businessgrowth.ai/).


    ![Tip](images/tip.png)To try things out for yourself, start clustering your data
    with the *k*\-means methods by using either R’s `cluster` package or Python''s
    scikit-learn library. For more on R’s cluster package, check out [`https://cran.r-project.org/web/packages/cluster/cluster.pdf`](https://cran.r-project.org/web/packages/cluster/cluster.pdf);
    for more on scikit-learn, check out [`https://scikit-learn.org`](https://scikit-learn.org/).


    ### Estimating clusters with kernel density estimation


    If the *k*\-means algorithm doesn’t appeal to you, one alternative way to identify
    clusters in your data is to use a density smoothing function instead. *Kernel
    density estimation* (KDE) is that smoothing method; it works by placing a *kernel*
    (a weighting function that’s useful for quantifying density) on each data point
    in the dataset and then summing the kernels to generate a kernel density estimate
    for the overall region. Areas of greater point density will sum out with greater
    kernel density, and areas of lower point density will sum out with less kernel
    density.


    Because kernel smoothing methods don’t rely on cluster center placement and clustering
    techniques to estimate clusters, they don’t exhibit a risk of generating erroneous
    clusters by placing centers in areas of local minimum density. Where *k*\-means
    algorithms generate hard-lined definitions between points in different clusters,
    KDE generates a plot of gradual density change between observations. For this
    reason, it’s a helpful aid when eyeballing clusters. [Figure 5-3](#c05.xhtml#c05-fig-0003)
    shows what the World Bank Income and Education scatterplot looks like after KDE
    has been applied.


    In [Figure 5-3](#c05.xhtml#c05-fig-0003), you can see that the white spaces between
    clusters have been reduced. When you look at the figure, it’s fairly obvious that
    you can see at least three clusters, and possibly more, if you want to allow for
    small clusters.


    ![FIGURE 5-3: KDE smoothing of the World Bank’s Income and Education data scatterplot.](images/9781394297009-fg0503.png)


    [FIGURE 5-3:](#c05.xhtml#rc05-fig-0003) KDE smoothing of the World Bank’s Income
    and Education data scatterplot.


    ### Clustering with hierarchical algorithms


    A hierarchical clustering algorithm is yet another alternative to *k*\-means clustering.
    In comparison to *k*\-means clustering, the hierarchical clustering algorithm
    is a slower, clunkier unsupervised clustering algorithm. It predicts groupings
    within a dataset by calculating the distance and generating a link between each
    singular observation and its nearest neighbor. It then uses those distances to
    predict subgroups within a dataset. If you’re carrying out a statistical study
    or analyzing biological or environmental data, hierarchical clustering may be
    your ideal machine learning solution.


    To visually inspect the results of your hierarchical clustering, generate a *dendrogram*
    (a visualization tool that depicts the similarities and branching between groups
    in a data cluster). You can use several different algorithms to build a dendrogram,
    and the algorithm you choose dictates where and how branching occurs within the
    clusters. Additionally, dendrograms can be built either *bottom-up* (by assembling
    pairs of points and then aggregating them into larger and larger groups) or *top-down*
    (by starting with the full dataset and splitting it into smaller and smaller groups).
    Looking at the dendrogram results makes it easier to decide the appropriate number
    of clusters for your dataset. In the dendrogram example shown in [Figure 5-4](#c05.xhtml#c05-fig-0004),
    the underlying dataset appears to have either three or four clusters.


    ![FIGURE 5-4: A schematic layout of a sample dendrogram.](images/9781394297009-fg0504.png)


    [FIGURE 5-4:](#c05.xhtml#rc05-fig-0004) A schematic layout of a sample dendrogram.


    In hierarchical clustering, the distance between observations is measured in three
    different ways: Euclidean, Manhattan, or Cosine. Additionally, linkage is formed
    by three different methods: Ward, Complete, and Average. When deciding what distance
    and linkage parameters to use, trial-and-error is an easy approach. Just try each
    combination and then compare all your model results. Go with the model that produces
    the most accurate prediction.'
