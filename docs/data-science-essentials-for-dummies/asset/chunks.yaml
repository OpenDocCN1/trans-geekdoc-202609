    accent="true"><m:mi>y</m:mi><m:mo>&#175;</m:mo></m:mover></m:math>\= `y` 变量的均值

    *   `r` = 皮尔逊 `r` 相关系数


    在你得到皮尔逊 `r` 值后，你应该按照以下标准来解释其数值：


    *   如果 `r` 接近 +1，则变量之间存在强正相关。

    *   如果 `r` = 0，则变量之间没有线性相关。

    *   如果 `r` 接近 –1，则变量之间存在强负相关。


    ### 使用斯皮曼等级相关系数对变量对进行排序


    斯皮曼等级相关是确定定序变量之间相关性的流行方法。通过应用斯皮曼等级相关，你通过计算变量之间关系的强度，将数值变量对转换为等级，然后根据它们的相关性对它们进行排序。


    斯皮曼等级相关假设以下条件：


    *   **你的变量是定序的。**

    *   **你的变量是非线性的相关的。** 你可以通过观察图表来识别变量之间的非线性。如果两个变量之间的图表产生了曲线（如图 4-2 所示），则变量之间存在非线性关系。这种曲率的出现是因为当变量以非线性方式相关时，`x`
    值的变化并不一定对应数据集中 `y` 值的相同变化。

    *   **你的数据是非正态分布的。**


    ![FIGURE 4-2: 观看时间与观看百分比之间非线性关系的示例。](img/9781394297009-fg0402.png)


    图 4-2： 观看时间与观看百分比之间非线性关系的示例。


    要使用斯皮曼等级来测试相关性，你只需将变量的值代入以下公式即可：


    ![math](img/eq04002.png)<m:math xmlns:m="http://www.w3.org/1998/Math/MathML"><m:mrow><m:mi>r</m:mi><m:mo>=</m:mo><m:mfrac><m:mrow><m:mo>&#8721;</m:mo><m:mrow><m:mo>(</m:mo><m:mrow><m:mi>x</m:mi><m:mo>&#8722;</m:mo><m:mover
    accent="true"><m:mi>x</m:mi><m:mo>&#175;</m:mo></m:mover></m:mrow><m:mo)</m:mo></m:mrow><m:mrow><m:mo>(</m:mo><m:mrow><m:mi>y</m:mi><m:mo>&#8722;</m:mo><m:mover
    accent="true"><m:mi>y</m:mi><m:mo>&#175;</m:mo></m:mover></m:mrow><m:mo)</m:mo></m:mrow></m:mrow></m:mrow></m:msqrt></m:msqrt><m:mrow><m:mo>&#8721;</m:mo><m:msup><m:mrow><m:mrow><m:mo>(</m:mo><m:mrow><m:mi>x</m:mi><m:mo>&#8722;</m:mo><m:mover
    accent="true"><m:mi>x</m:mi><m:mo>&#175;</m:mo></m:mover></m:mrow><m:mo)</m:mo></m:mrow></m:mrow><m:mn>2</m:mn></m:msup><m:mo>&#8721;</m:mo><m:msup><m:mrow><m:mrow><m:mo>(</m:mo><m:mrow><m:mi>y</m:mi><m:mo>&#8722;</m:mo><m:mover
    accent="true"><m:mi>y</m:mi><m:mo>&#175;</m:mo></m:mover></m:mrow><m:mo)</m:mo></m:mrow></m:mrow><m:mn>2</m:mn></m:msup></m:mrow></m:msqrt></m:mrow></m:mfrac></m:mrow></m:math>


    ### 降维


    好的，有了这些后可以做什么呢？首先，你需要进行降维。在本节中，我们将看看什么是矩阵分解（SVD）。由于由于其中涉及的线性代数植根于 SVD，让我们来看看它是如何工作的。机器学习人员将其称为主成分分析（PCA）。将这些矩阵相乘即可还原原始矩阵。SVD
    在你想要压缩或清理数据集潜在变量（隐藏变量）时非常有用。这里是使用 SVD 的两种主要方式：


    *   **压缩稀疏矩阵：** 如果有一个干净但稀疏的数据集，你不想删除任何信息，但需要将其压缩到可管理的变量数量。SVD 的一个方便之处在于它允许你设置它创建的变量数量。如果你不移除这些任何组件，你将在不丢失任何信息的情况下缩小数据集的大小。这一过程在图
    4-3 中所示。

    *   **清理和压缩数据：** 在其他情况下，你可以使用 SVD 对脏数据进行算法清洗。在这种情况下，你应用 SVD 来发现你的组件，然后通过观察它们的方差来决定保留哪些。行业标准是保留组件的解释方差之和应至少达到
    75%。这确保了至少有 75% 的原始信息保留在你保留的组件中。这一过程在图 4-4 中所示。


    ![警告](img/warning.png)如果保留组件的解释方差之和（或累积解释方差（CVE））小于 95%，则不要将这些组件作为衍生特征继续用于下游的机器学习模型。在这些情况下，在这些衍生特征中丢失的信息会导致机器学习模型产生不准确、不可靠的预测。然而，这些衍生组件作为描述性统计的来源或用于构建更用的描述性分析——换句话说，描述过去发生了什么的分析，并回答“发生了什么？”、“什么时候？”、“有多少？”以及“在哪里？”等问题是有用的。


