- raw: '*   **Enhanced flexibility:** Cloud services are extremely flexible with respect
    to usage requirements. If you set up in a cloud environment and then your project
    plan changes, you can simply turn off the cloud service with no further charges
    incurred. This isn’t the case with on-premises storage, because after you purchase
    the server, you own it. Your only option from then on is to extract the best possible
    value from a noncancelable resource.


    *   **Security:** If you go with reputable cloud service providers — like Amazon
    Web Services (AWS), Google Cloud, or Microsoft Azure — your data is likely to
    be a whole lot more secure in the cloud than it would be on-premises. That’s because
    of the sheer number of resources that these megalith players dedicate to protecting
    and preserving the security of the data they store. I can’t think of a multinational
    company that would have more invested in the security of its data infrastructure
    than Amazon, Google, or Microsoft.


    A lot of different technologies have emerged in the wake of the cloud computing
    revolution. The next sections examine a few of these new technologies.


    #### Using serverless computing to execute data science


    When we talk about serverless computing, the term *serverless* is quite misleading
    because the computing, indeed, takes place on a server. *Serverless computing*
    really refers to computing that’s executed in a cloud environment rather than
    on your desktop or on-premises at your company. The physical host server exists,
    but it’s 100 percent supported by the cloud computing provider retained by you
    or your company.


    One great tragedy of modern-day data science is the amount of time data scientists
    spend on non-mission-critical tasks like data collection, data cleaning and reformatting,
    data operations, and data integration. By most estimates, only 10 percent of a
    data scientist’s time is spent on predictive model building; the rest of it is
    spent trying to prepare the data and the data infrastructure for that mission-critical
    task they’ve been retained to complete. Serverless computing has been a game changer
    for the data science industry because it decreases the downtime that data scientists
    spend in preparing data and infrastructure for their predictive models.


    Earlier in this chapter, I talk a bit about SaaS. Serverless computing offers
    something similar: *function as a service* (FaaS), a containerized cloud computing
    service that makes it much faster and simpler to execute code and predictive functions
    directly in a cloud environment, without the need to set up complicated infrastructure
    around that code. With serverless computing, your data science model runs directly
    within its container, as a sort of stand-alone function. Your cloud service provider
    handles all the provisioning and adjustments that need to be made to the infrastructure
    to support your functions.


    Examples of popular serverless computing solutions are AWS Lambda, Google Cloud
    Run functions, and Azure Functions.


    #### Containerizing predictive applications within Kubernetes


    *Kubernetes* is an open-source software suite that manages, orchestrates, and
    coordinates the deployment, scaling, and management of containerized applications
    across clusters of worker nodes. One particularly attractive feature about Kubernetes
    is that you can run it on data that sits in on-premises clusters, in the cloud,
    or in a hybrid cloud environment.


    The chief focus of Kubernetes is helping software developers build and scale apps
    quickly. Though it does provide a fault-tolerant, extensible environment for deploying
    and scaling predictive applications in the cloud, Kubernetes also requires quite
    a bit of data engineering expertise to set them up correctly.


    ![Remember](images/remember.png)A system is fault tolerant if it’s built to continue
    successful operations despite the failure of one or more of its subcomponents.
    This requires redundancy in computing nodes. A system is described as *extensible*
    if it’s flexible enough to be extended or shrunk in size without disrupting its
    operations.


    To overcome this obstacle, Kubernetes released its Kubeflow product, a machine
    learning toolkit that makes it simple for data scientists to directly deploy predictive
    models within Kubernetes containers, without the need for outside data engineering
    support.


    #### Sizing up popular cloud-warehouse solutions


    You have a number of products to choose from when it comes to cloud-warehouse
    solutions. Here are the most popular options:


    *   **Amazon Redshift (**[`https://aws.amazon.com/redshift`](https://aws.amazon.com/redshift)**):**
    A popular data warehousing service that runs atop data sitting within the Amazon
    cloud, Redshift is most notable for the incredible speed at which it can handle
    data analytics and business intelligence workloads. Because it runs on the AWS
    platform, Redshift’s fully managed data warehousing service has the incredible
    capacity to support petabyte-scale cloud storage requirements. If your company
    is already using other AWS products — like Amazon EMR, Amazon Athena, or Amazon
    Kinesis — Redshift is the natural choice to integrate nicely with your existing
    technology. Redshift offers both pay-as-you-go and on-demand pricing structures
    that you’ll want to explore further on its website.


    *   **Snowflake (**[`www.snowflake.com`](https://www.snowflake.com/)**):** This
    SaaS solution provides powerful, parallel-processing analytics capabilities for
    both structured and semistructured data stored in the cloud on Snowflake’s servers.
    Snowflake is the ultimate three-in-one solution, with its cost-effective data
    storage, analytical processing capabilities, and all the built-in cloud services
    you may need. Snowflake integrates well with analytics tools like Qlik and Tableau,
    as well as with technologies like Apache Kafka, Apache Spark, and Pentaho, but
    it wouldn’t make sense if you’re already relying mostly on Amazon services. Pricing
    for Snowflake is based on the amount of data you store, as well as on the execution
    time for compute resources you consume on the platform.


    *   **Google BigQuery (**[`https://cloud.google.com/bigquery`](https://cloud.google.com/bigquery)**):**
    Touted as a serverless data warehouse solution, BigQuery is a relatively cost-effective
    solution for generating analytics from data sources stored in the Google Cloud.
    Similar to Snowflake and Redshift, BigQuery provides fully managed cloud services
    that make it fast and simple for data scientists and analytics professionals to
    use the tool without the need for assistance from in-house data engineers. Analytics
    can be generated on petabyte-scale data. BigQuery integrates with Google Data
    Studio, Looker, Power BI, and Tableau for ease of use when it comes to post-analysis
    data storytelling. Pricing for BigQuery is based on the amount of data you store,
    as well as on the compute resources you consume on the platform, as represented
    by the amount of data your queries return from the platform.


    #### Introducing NoSQL databases


    An RDBMS is designed to handle only relational datasets constructed of data that
    is stored in clean rows and columns and, thus, is capable of being queried via
    Structured Query Language (SQL). RDBMSs are incapable of handling unstructured
    and semistructured data. Plus, RDBMSs simply lack the processing and handling
    capabilities that are needed for meeting data volume and velocity requirements.'
