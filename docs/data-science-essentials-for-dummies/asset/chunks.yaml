    The benefit of using Excel in a data science capacity is that it offers a fast
    and easy way to get up close and personal with your data. If you want to browse
    every data point in your dataset, you can quickly and easily do this using Excel.
    Most data scientists start in Excel and eventually add other tools and platforms
    when they find themselves pushing against the boundaries of the tasks Excel is
    designed to do. Still, even the best data scientists out there keep Excel as an
    important tool in their tool belt. When working in data science, you may not use
    Excel every day, but knowing how to use it can make your job easier.


    ![Tip](images/tip.png)


    If you’re using Excel spreadsheets for data analysis but finding it to be rather
    buggy and clunky, I recommend that you instead test out Google Sheets — Google’s
    cloud-based version of a spreadsheet application. It can be run offline on your
    computer, and it offers an ease of use and a set of collaborative features that
    simply aren’t available within the Microsoft Office environment today. Google
    Sheets offers all the same functions discussed in this chapter, using all the
    same commands as Excel spreadsheets, but most users find Sheets to be a far more
    intuitive, extensible tool for data analysis, visualization, and collaboration.


    ![Remember](images/remember.png)Although you have many different tools available
    to you when you want to see your data as one big forest, Excel is a great first
    choice when you need to look at the trees. Excel attempts to be many different
    things to many different kinds of users. Its functionality is well compartmentalized
    in order to avoid overwhelming new users while still providing power users with
    the more advanced functionality they crave.


    In the following sections, I show you how you can use Excel to quickly get to
    know your data. I also introduce Excel PivotTables and macros and tell you how
    you can use them to greatly simplify your data cleanup and analysis tasks.


    ### Using Excel to quickly get to know your data


    If you’re just starting off with an unfamiliar dataset and you need to spot patterns
    or trends as quickly as possible, use Excel. Excel offers effective features for
    exactly these purposes. Its main features for a quick-and-dirty data analysis
    are


    *   Filters: Filters are useful for sorting out all records that are irrelevant
    to the analysis at hand.

    *   Conditional formatting: Specify a condition, and Excel flags records that
    meet that condition. By using conditional formatting, you can easily detect outliers
    and trends in your tabular datasets.

    *   Charts: Charts have long been used to visually detect outliers and trends
    in data, so charting is an integral part of almost all data science analyses.


    To see how these features work in action, consider the sample dataset shown in
    [Figure 7-3](#c07.xhtml#c07-fig-0003), which tracks sales figures for three employees
    over six months.


    #### Filtering in Excel


    To narrow your view of your dataset to only the data that matters for your analysis,
    use Excel filters to filter out irrelevant data from the data view. Simply select
    the data and click the `Home` tab’s `Sort & Filter` button; then choose `Filter`
    from the options that appear. A little drop-down option appears in the header
    row of the selected data so you can select the classes of records you want to
    have filtered from the selection. Using the Excel `Filter` functionality allows
    you to quickly and easily sort or restrict your view to only the subsets of the
    data that interest you the most.


    ![FIGURE 7-3: The full dataset that tracks employee sales performance.](images/9781394297009-fg0703.png)


    [FIGURE 7-3:](#c07.xhtml#rc07-fig-0003) The full dataset that tracks employee
    sales performance.


    Take another look at the full dataset shown in [Figure 7-3](#c07.xhtml#c07-fig-0003).
    Say you want to view only data related to Abbie’s sales figures. If you select
    all records in the `Salesperson` column and then activate the filter functionality
    (as just described), from the drop-down menu that appears you can specify that
    the filter should isolate only all records named Abbie, as shown in [Figure 7-4](#c07.xhtml#c07-fig-0004).
    When filtered, the table is reduced from 18 rows to only 6 rows. In this particular
    example, that change doesn’t seem so dramatic, but when you have hundreds, thousands,
    or even a million rows, this feature comes in very, very handy.


    ![FIGURE 7-4: The sales performance dataset, filtered to show only Abbie’s records.](images/9781394297009-fg0704.png)


    [FIGURE 7-4:](#c07.xhtml#rc07-fig-0003) The sales performance dataset, filtered
    to show only Abbie’s records.


    #### Conditional formatting


    To quickly spot outliers in your data, use Excel’s `Conditional formatting` feature.
    Imagine you want to highlight all cells where the sales are greater than 5000.
    You can select the `Sales` column, click `Conditional formatting`, and then choose
    `Highlight Cells Rules` > `Greater Than...`. Enter `5000` and Excel will highlight
    all cells that meet this condition.


    You can also use conditional formatting to create heat maps. For example, you
    can apply a color scale that highlights higher values in green and lower values
    in red. This can help you to quickly identify patterns and trends in your data.


    #### Excel charting to visually identify outliers and trends


    Excel’s Charting tool gives you an incredibly easy way to visually identify outliers
    and trends in your data. An `XY` (scatter) chart of the original dataset (refer
    to [Figure 7-3](#c07.xhtml#c07-fig-0003)) yields the scatterplot shown in [Figure
    7-7](#c07.xhtml#c07-fig-0007). As you can see, the outlier is overwhelmingly obvious
    when the data is plotted on a scatter chart.


    Alternatively, if you want to visually detect trends in a dataset, you can use
    Excel’s Line Charting feature. The data from [Figure 7-6](#c07.xhtml#c07-fig-0006)
    is shown as a line chart in [Figure 7-8](#c07.xhtml#c07-fig-0008). It’s worth
    mentioning, I’ve fixed the outlier in this line graph, which is what allows the
    `y`-axis to have a more readable scale compared to [Figure 7-7](#c07.xhtml#c07-fig-0007).

