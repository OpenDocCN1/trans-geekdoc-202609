    ![Credit: Python for Data Science Essential Training Part 2, LinkedIn.com ¶ 图
    4-8: 使用 PCA 识别离群值。](img/9781394297009-fg0408.png)


    Credit: Python for Data Science Essential Training Part 2, [`LinkedIn.com`](http://LinkedIn.com)
    ¶ 图 4-8： 使用 PCA 识别离群值。


    ## 引入时间序列分析


    `time series` 只是随时间变化的属性值集合。进行时间序列分析是为了根据过去的观测数据预测该指标的未来实例。要根据数据集中的数据预测或估计未来值，请使用时间序列技术。


    ### 识别时间序列中的模式


    时间序列表现出特定的模式。请查看图 4-9 以更好地理解这些模式。`Constant`（常数）时间序列随时间推移保持在大致相同的水平，但受到一些随机误差的影响。相比之下，`trended`（趋势）序列显示出稳定的向上或向下线性移动。无论是常数还是趋势序列，时间序列有时也会表现出
    `seasonality`（季节性）——即在一年中季节性反复出现的可预测的周期性波动。季节性时间序列的一个例子是考虑许多企业在假日期间销售额的增长。


    ![图 4-9: 时间序列所表现模式的对比。](img/9781394297009-fg0409.png)


    图 4-9： 时间序列所表现模式的对比。


    如果你在模型中包含了季节性，请在合适的地方将其整合到季度、每月甚至每半年的周期中。时间序列可能会显示出 `nonstationary processes`（非平稳过程）——即与季节性无关的不可预测的周期性行为，这种行为是由经济或行业状况引起的。由于它们是不可预测的，因此非平稳过程无法进行预测。


    ![Tip](img/tip.png)如需帮助开始使用 R，请务必访问 [`https://growth.ai`](https://growth.ai/)
    上的培训。


    ### 单变量序列建模


    类似于多元分析是对多个变量的分析，`univariate analysis`（单变量分析）是对单个变量的分析。自回归移动平均 (`ARMA`) 是一类预测方法，它们假设之前的观测值是未来值的良好预测器。正如名称所示，`ARMA`
    结合了 `autoregressive`（自回归）和 `moving average`（移动平均）。如果你正在寻找一个适用于小型数据集的简单模型，那么该模型并不合适。在图
    4-10 中，你可以看到模型拟合得很好。


    ![Remember](img/remember.png)使用 ARMA 获得可靠的结果。


    # 通过分组实现准确预测


    ## 本章内容


    *   理解聚类、分类和其他分组算法的基础知识

    *   使用 `k-means` 算法和核密度估计对数据进行聚类

    *   在决策树和随机森林之间进行选择

    *   了解层次聚类和邻域聚类算法

    *   通过最近邻算法


    '
