    ## Investing Some Effort into Database Design


    If you want to ensure that your database will be useful to you for the foreseeable
    future, you need to invest time and resources into excellent database design.
    If you want to create databases that offer fast performance and error-free results,
    your database design has to be flawless — or as flawless as you can manage. Before
    you enter any data into a data table, first carefully consider the tables and
    columns you want to include, the kinds of data those tables will hold, and the
    relationships you want to create between those tables.


    ![Remember](images/remember.png)Every hour you spend planning your database and
    anticipating future needs can save you countless hours down the road, when your
    database may hold a million records. Poorly planned databases can easily turn
    into slow, error-ridden monstrosities — avoid them at all costs.


    Keep just a few concepts in mind when you design databases:


    * Data types

    * Constraints

    * Normalization


    In the next few sections, I offer a closer look at each topic.


    ### Defining data types


    When creating a data table, one of the first things you have to do is define the
    data type of each column. You have several data type options to choose from:


    * **Text:** If your column is to contain text values, you can classify it as a
    `Character` data type with a fixed length or a `Text` data type of indeterminate
    length.

    * **Numerical:** If your column is to hold number values, you can classify it
    as a `Numerical` data type. Numerical data types can be stored as integers or
    floats.

    * **Date:** If your column is to hold date- or time-based values, you can designate
    this as a `Date` data type or `Date-Time` data type.


    ![Remember](images/remember.png)If your column is to hold date- or time-based
    values, you can designate this as a `Date` data type or `Date-Time` data type.


    ### Designing constraints


    Think of constraints, in the context of SQL, as rules you use to control what
    data can enter. For example, if you have a column for `Price`, you might want
    to ensure that only positive numbers are entered. If you have a column for `Email`,
    you might want to ensure that the entry follows a valid email format.


    Think of constraints, in the context of SQL, as rules you use to control what
    data can enter. For example, if you have a column for `Price`, you might want
    to ensure that only positive numbers are entered. If you have a column for `Email`,
    you might want to ensure that the entry follows a valid email format.


    ### Normalizing your database


    After you’ve defined the data types and designed constraints, you need to deal
    with `normalization` (structuring your database so that any changes are made only
    once). There are many degrees and types of normalization, but a good, robust database
    should have at least the following properties:


    * **Primary keys:** Each table has a primary key, which is a unique value for
    every row.

    * **Nonredundancy of columns:** No two tables have the same column, unless it’s
    the primary key of one and the foreign key of the other.

    * **No multiple dependencies:** Every column’s value must depend on only one column
    whose value does not, in turn, depend on any other column. Calculated values —
    such as the total for an invoice, for example — must, therefore, be done on the
    fly for each query and not be hard-coded into the database.

    * **Column indexes:** As you may recall, in SQL an index is a lookup table that
    points to data in tables. When you make a column index — an index of a particular
    column — each record in that column is assigned a unique key that’s indexed in
    a lookup table. Column indexing enables faster data retrieval from that column.


    **Subject-matter segregation:** Another feature of good database design is that
    each table contains data for only one kind of subject matter. This isn’t exactly
    a normalization principle per se, but it helps to achieve a similar end.


    Consider again the film rating example, from earlier in this chapter:

