  trans: '


    - **增强的灵活性：** 云服务在用需求方面极其灵活。如果你在云环境中搭建了环境，然后项目计划发生了变化，你可以直接关闭云服务而不会产生任何额外费用。本地存储的情况并非如此，因为在购买服务器之后，你就拥有了它。从那时起，你唯一的选择就是从不可取消的资源中榨出最大的价值。

    - **安全性：** 如果你选择口碑良好的云服务提供商——例如 Amazon Web Services (AWS)、Google Cloud 或 Microsoft
    Azure——你的数据在云端的安全性可能比在本地存储高得多。这是因为这些巨头企业投入了海量资源来保护和维护它们所存储的数据安全。我实在不出哪家跨国公司在数据基础设施安全方面的投入会比亚马逊、谷歌或微软更多。


    在云计算革命的之后，涌现出了许多不同的技术。接下来的章节将探讨这些新技术中的几种。


    ### 使用无服务器计算执行数据科学


    当我们谈论无服务器计算时，`serverless` 这个词具有很强的误导性，因为计算确实发生在服务器上。`Serverless computing` 实际上是指在云环境中执行计算，而不是在你的桌面电脑或公司本地执行。物理主机服务器确实存在，但它
    100% 由你或你公司保留的云计算提供商支持。


    现代数据科学的一个巨大悲剧是，数据科学家花费了大量时间在非关键任务上，如数据收集、数据清洗和重新格式、数据操作和数据集成。根据大多数估计，数据科学家只有 10%
    的时间用于构建预测模型；其余时间都花在准备数据和数据基础设施上，以完成他们受请完成的那项关键任务。无服务器计算是数据科学行业的游戏规则改变者，因为它减少了数据科学家在为预测模型准备数据和基础设施上花费的停机时间。


    在本章较早之前，我提到了 SaaS。无服务器计算提供了类似的服务：`function as a service` (`FaaS`)，这是一种容器化的云计算服务，它可以更快速、更简单地直接在云环境中执行代码和预测函数，而无需在该代码周围搭建复杂的架构。通过无服务器计算，你的数据科学模型直接运行在其容器内，作为一种独立函数。你的云服务提供商会处理所有为了支持你的函数而对基础设施进行的配置和调整。


    流行的无服务器计算解决方案示例包括 AWS Lambda、Google Cloud Run 函数和 Azure Functions。


    ### 在 Kubernetes 内部容器化预测应用


    `Kubernetes` 是一个开源软件套，用于管理、编排和协调跨工作节点集群的容器化应用程序的部署、扩展和管理。Kubernetes 的一个特别吸引人的特性是，你可以在位于本地集群、云端或混合云环境的数据上运行它。


    Kubernetes 的核心重点是帮助软件开发者快速构建和扩展应用。虽然它为在云端部署和扩展预测应用提供了一个容错、扩展的环境，但 Kubernetes 也需要大量的数据工程专业知识来正确设置它们。


    ![Remember](img/remember.png)


    如果一个系统能够容错，意味着即使在一个或多个子组件故障也能继续成功运行。如果一个系统被描述为`extensible`，意味着它足够灵活，可以扩展或缩小规模而不影响其运行。为了克服这一障碍，Kubernetes
    发布了其 Kubeflow 产品，这是一个机器学习工具包，让数据科学家可以直接部署模型，而无需数据工程部门的支持。


    ### 评估流行的云仓库解决方案


    在选择云仓库解决方案时，你有许多产品可供选择。以下是最流行的：


    - **Amazon Redshift** (`[`https://aws.amazon.com/redshift`](https://aws.amazon.com/redshift)`):
    一种运行在 Amazon 云之上的流行数据仓库服务，以其处理数据分析和商业智能的惊人速度而闻名。因为它运行在 AWS 平台之上，Redshift 的全托管数据仓库服务具有支持
    PB 级存储的巨大能力。如果你的公司已经在使用其他 AWS 产品——如 Amazon EMR、Amazon Athena 或 Amazon Kinesis——那么
    Redshift 是自然之选。它提供了按需付费和预留定价结构，你可以在其网站上进一步探索。

    - **Snowflake** (`[`www.snowflake.com`](https://www.snowflake.com/)`): 这一 SaaS
    解决方案为存储在云端的结构化和半结构化数据提供了强大的并行处理分析。Snowflake 是终极的三合一解决方案，具有极具成本效益的数据存储、分析能力以及你可能需要的所有内置云服务。Snowflake
    与 Qlik、Tableau 等分析工具，以及 Apache Kafka、Apache Spark 和 Pentaho 等技术集成了良好，但如果你主要依赖亚马逊的服务，那么使用它可能就没有意义了。Snowflake
    的定价基于你存储的数据量，以及你在平台上消耗的计算资源执行时间。

    - **Google BigQuery** (`[`https://cloud.google.com/bigquery`](https://cloud.google.com/bigquery)`):
    被誉为无服务器数据仓库解决方案，BigQuery 是从存储在 Google Cloud 的数据源生成分析的性价比较高的解决方案。类似于 Snowflake
    和 Redshift，BigQuery 提供了全托管云服务，让数据科学家和分析专业人员能够快速简单使用该工具，而无需内部数据工程师的帮助。分析可以在 PB
    级的数据。BigQuery 与 Google Data Studio、Looker、Power BI 和 Tableau 集成，便于进行分析后的数据演示。BigQuery
    的定价基于你存储的数据量，以及你在平台上消耗的计算资源（由你的查询返回的数据量表示）。


    ### 介绍 NoSQL 数据库


    RDBMS 设计仅用于处理关系型数据集，这些数据构建在整洁的行列中，可以通过结构化查询语言 (SQL) 进行查询。RDBMS 无法处理非结构化和半结构化数据。此外，RDBMS
    缺乏满足数据量和速度需求所需的处理和处理能力。


    '
