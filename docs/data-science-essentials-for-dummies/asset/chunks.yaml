- raw: 'Before diving too deeply into a discussion of machine learning methods, you
    need to know about the (sometimes confusing) vocabulary associated with the field.
    Because machine learning is an offshoot of both traditional statistics and computer
    science, it has adopted terms from both fields and added a few of its own. Here’s
    what you need to know:


    *   **Instance:** The same as a *row* (in a data table), an *observation* (in
    statistics), and a *data point.* Machine learning practitioners are also known
    to call an instance a *case.*


    *   **Feature:** The same as a *column* or *field* (in a data table) and a *variable*
    (in statistics). In regression methods, a feature is also called an *independent
    variable* (IV).


    *   **Target variable:** The same as a *predictant* or *dependent* variable (DV)
    in statistics.


    ![Remember](images/remember.png)In machine learning, *feature selection* is a
    somewhat straightforward process for selecting appropriate variables; for *feature
    engineering,* you need substantial domain expertise and strong data science skills
    to manually design input variables from the underlying dataset. You use feature
    engineering in cases where your model needs a better representation of the problem
    being solved than is available in the raw dataset.


    ![Warning](images/warning.png)Although machine learning is often referred to in
    the context of data science and AI, these terms are all separate and distinct.
    Machine learning is a practice within data science, but there’s more to data science
    than just machine learning. AI often, but not always, involves data science and
    machine learning. *AI* is a term that describes autonomously acting agents. In
    some cases, AI agents are robots; in others, they’re software applications. If
    the agent’s actions are triggered by outputs from an embedded machine learning
    model, then the AI is powered by data science and machine learning. On the other
    hand, if the AI’s actions are governed by a rules-based decision mechanism, you
    can have AI that doesn’t actually involve machine learning or data science at
    all.


    ## Considering Learning Styles


    Machine learning can be applied in three main styles: supervised, unsupervised,
    and semisupervised. Supervised and unsupervised methods are behind most modern
    machine learning applications, and semisupervised learning is an up-and-coming
    star.


    ### Learning with supervised algorithms


    Supervised learning algorithms require that input data has labeled features. These
    algorithms learn from known features of that data to produce an output model that
    successfully predicts labels for new incoming, unlabeled data points. You use
    supervised learning when you have a labeled dataset composed of historical values
    that are good predictors of future events. Use cases include survival analysis
    and fraud detection, among others. Logistic regression is a type of supervised
    learning algorithm, and you see a little more about it in the “[Selecting algorithms
    based on function](#c03.xhtml#c03-sec-0010)” section.


    ### Learning with unsupervised algorithms


    Unsupervised learning algorithms accept unlabeled data and attempt to group observations
    into categories based on underlying similarities in input features, as shown in
    [Figure 3-1](#c03.xhtml#c03-fig-0001). Principal component analysis, k-means clustering,
    and singular value decomposition are all examples of unsupervised machine learning
    algorithms. Popular use cases include recommendation engines, facial recognition
    systems, and customer segmentation.


    ![FIGURE 3-1: Unsupervised machine learning breaks down unlabeled data into subgroups.](images/9781394297009-fg0301.png)


    [FIGURE 3-1:](#c03.xhtml#rc03-fig-0001) Unsupervised machine learning breaks down
    unlabeled data into subgroups.


    ### Learning with reinforcement


    Reinforcement learning is a behavior-based learning model. It’s based on a mechanic
    similar to how humans and animals learn. The model is given “rewards” based on
    how it behaves, and it subsequently learns to maximize the sum of its rewards
    by adapting the decisions it makes to earn as many rewards as possible.


    ## Seeing What You Can Do


    Whether you’re just becoming familiar with the algorithms that are involved in
    machine learning or you’re looking to find out more about what’s happening in
    cutting-edge machine learning advancements, this section has something for you.
    First, I give you an overview of machine learning algorithms, broken down by function;
    then I describe more about the advanced areas of machine learning that are embodied
    by deep learning and Apache Spark.


    ### Selecting algorithms based on function


    When you need to choose a class of machine learning algorithms, it’s helpful to
    consider each model class based on its functionality:


    *   **Regression:** You can use this model type to describe and quantify the relationships
    between independent variables and a dependent variable. This model helps you to
    identify how changes in the features influence an outcome and it’s a very commonly
    used approach for making predictions. You can read more on linear and logistic
    regression methods and ordinary least squares in [Chapter 4](#c04.xhtml).


    *   **Association rule learning:** This type of algorithm is a rule-based set
    of methods that you can use to discover associations between features in a dataset.
    For an in-depth training and demonstration on how to use association rules in
    Microsoft Excel, be sure to check out the companion website to this book ([`https://businessgrowth.ai`](https://businessgrowth.ai/)).


    *   **Instance-based:** If you want to use observations in your dataset to classify
    new observations based on similarity, you can use this type. To model with instances,
    you can use methods like k-nearest neighbor classification, covered in [Chapter
    5](#c05.xhtml).


    *   **Regularizing:** You can use regularization to introduce added information
    as a means by which to prevent model overfitting or to solve an ill-posed problem.
    In case the term is new to you, *model overfitting* is a situation in which a
    model is so tightly fit to its underlying dataset, as well as its noise or random
    error, that the model performs poorly as a predictor for new observations.


    *   **Naïve Bayes:** If you want to predict the likelihood of an event’s occurrence
    based on some evidence in your data, you can use this method, based on classification
    and regression. Naïve Bayes is covered in [Chapter 4](#c04.xhtml).


    *   **Decision tree:** A tree structure is useful as a decision support tool.
    You can use it to build models that predict for potential downstream implications
    that are associated with any given decision.


    *   **Clustering:** You can use this type of unsupervised machine learning method
    to uncover subgroups within an unlabeled dataset. Both k-means clustering and
    hierarchical clustering are covered in [Chapter 5](#c05.xhtml).


    *   **Dimension reduction:** If you’re looking for a method to use as a filter
    to remove redundant information, unexplainable random variation, and outliers
    from your data, consider dimension reduction techniques such as factor analysis
    and principal component analysis. These topics are covered in [Chapter 4](#c04.xhtml).


    *   **Neural network:** A neural network mimics how the brain solves problems
    by using a layer of interconnected neural units as a means by which to learn —
    and infer rules — from observational data. It’s often used in image recognition
    and computer vision applications.'
