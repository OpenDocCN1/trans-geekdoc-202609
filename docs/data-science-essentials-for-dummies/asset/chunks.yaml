    * **Point:** Composed of spatial data that is plotted out according to specific
    point locations, a point map (see [Figure 8-22](#c08.xhtml#c08-fig-0022)) presents
    data in a graphical point form rather than in a polygon, line, or raster surface
    format.

    * **Raster surface:** A raster surface map (see [Figure 8-23](#c08.xhtml#c08-fig-0023))
    can be anything from a satellite image map to a surface coverage with values that
    have been interpolated from underlying spatial data points.


    ![Tip](images/tip.png) For a training on how to make maps from data using QGIS,
    an open-source geographic information system (GIS) application, visit [`https://businessgrowth.ai`](https://businessgrowth.ai/).


