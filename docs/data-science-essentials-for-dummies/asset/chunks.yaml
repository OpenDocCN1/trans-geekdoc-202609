    ![Remember](img/remember.png)

    在考虑事件的概率时，你必须知道可能发生哪些其他事件。始终将事件集定义为`互斥`的——即一次只能发生一种。（想象掷骰子有六种可能的结果。）概率具有这两个重要特征：


    * 任何单个事件的概率永远不会低于 0.0 或超过 1.0。

    * 所有事件的概率之和始终恰好等于 1.0。


    概率分布根据这两个类型进行分类：


    *   **离散（Discrete）：** 取值可以通过分组进行计数的随机变量。

    *   **连续（Continuous）：** 为取值范围分配概率的随机变量。


    ![Remember](img/remember.png)

    为了理解离散分布和连续分布，请考虑描述汽车的数据集中两个变量。颜色变量具有离散分布，因为汽车的颜色范围有限（例如：黑色、红色或蓝色）。观测值可以根据颜色分组进行计数。描述汽车每加仑英里油耗（`mpg`）的变量具有连续分布，因为每辆汽车都有其各自的、独立的平均
    `mpg`值。


    *   **正态分布（数值连续）：** 在图形上用对称的钟形曲线表示，这些分布模拟了倾向于某些最可能观测值的现象（位于钟形曲线的顶部）；两个极端的观测值概率较低。

    *   **二项分布（数值离散）：** 这些分布模拟了在只有两种可能结果的情况下，在一定次数尝试中可能发生的成功次数（例如，旧的硬币正反面掷场景）。二值变量——假设只取两个值中的一个值的变量——具有二项分布。

    *   **分类分布（非数值）：** 这些代表非数值的分类变量或`序数变量`（有序分类变量）。例如，大多数航空公司提供的服务等级是序数的的，因为它们提供头等舱、商务舱和经济舱座位。


    ### 朴素贝叶斯的条件概率


    你可以使用直接从统计学领域借用的朴素贝叶斯（Naïve Bayes）机器学习方法，根据数据特征中定义的证据（evidence）来预测事件发生的概率——这被称为`条件概率`。朴素贝叶斯基于分类和回归，如果你需要对文本数据进行分类，它将特别有用。


    为了更好地说明这一概念，请考虑来自加州大学欧文分校机器学习仓库的 Spambase 数据集([`archive.ics.uci.edu/ml/datasets/Spambase`](https://archive.ics.uci.edu/ml/datasets/Spambase)）。该数据集包含
    4601 条电子邮件记录，并在最后一个字段中指定每封邮件是否为垃圾邮件。从该集中，你可以识别垃圾邮件之间的共同特征。在你定义了指示垃圾邮件的共同特征后，你可以构建一个朴素贝叶斯分类器，根据内容中支持的实证证据，可靠地预测传入的邮件是否为垃圾。换句话之，模型根据从内容中收集的特征（`证据`）来预测邮件是否为垃圾邮件（`事件`）。


    朴素贝叶斯有三种流行的类型：


    *   **MultinomialNB：** 如果你的变量（分类或连续）描述的是离散的频率计数（如词频），请使用此版本。此版本的朴素贝叶斯假设从多项分布，这在文本数据中很常见。它不接受负值。

    *   **BernoulliNB：** 如果你的特征是二值的，你可以使用多项伯尔努利朴素贝叶斯进行预测。此版本适用于分类文本数据，但通常认为其性能不如 `MultinomialNB`。如果你想用
    `BernoulliNB` 从连续变量进行预测，这是可行的，但你首先需要将变量划分为离散的区间分组（也称为分箱 `binning`）。

    *   **GaussianNB：** 如果所有预测特征都符合正态分布，请使用此版本。它不是分类文本数据的好选择，但如果你的数据包含正值和负值（当然，如果你的特征符合正态分布），它可以是一个很好的选择。


    ![Warning](img/warning.png)在朴素地构建贝叶斯分类器之前，请考虑该模型持有一个`先验`（a priori）假设——这意味着它的预测是基于过去条件仍然成立的假设。当情况变化时，从历史数据预测未来值会产生错误的结果。


    ## 量化相关性


    许多统计和机器学习方法假设你的特征是独立的。然而，为了测试它们是否独立，你需要评估它们的`相关性`（变量表现出相互依赖的程度）。在本节中，你将简要介绍皮尔逊相关和斯皮尔曼等级相关。


    ![Tip](img/tip.png)相关性通过一个名为 `r` 的变量值量化，范围在 –1 到 1 之间。`r`值越接近 1 或 –1，两个变量之间的相关性越强。如果两个变量的`r`值接近
    0，可能它们是独立变量。


    ### 使用皮尔逊 *r* 计算相关性


    如果你想发现数据集中连续变量之间的依赖关系，你将使用统计学来估计它们的相关性。相关分析最简单的形式是`皮尔逊相关`，它假设如下：


    *   你的数据呈正态分布。

    *   你拥有连续的数值变量。

    *   你的变量之间存在线性关系。你可以通过在图表上绘制数据点，并观察数据点值是否存在清晰的上升或下降趋势，从而画出一条直线来总结该趋势。图 4-1 由于皮尔逊相关有许多条件，请`仅`用它判断两个变量之间是否存在关系，而不是排除可能的关系。如果你得到的`r`值接近
    0，则表明变量之间没有线性关系，但它们之间可能存在非线性关系。


    ![图 4-1：月份与 YouTube 订阅数之间的线性关系示例](img/9781394297009-fg0401.png)


    [图 4-1：](#c04.xhtml#rc04-fig-0001）月份与 YouTube 订阅数之间的线性关系示例。


    要使用皮尔逊 `r` 测试两个变量之间的线性相关性，只需将数据代入以下公式并计算结果即可：


