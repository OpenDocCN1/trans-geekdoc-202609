- raw: "1.  **Brainstorm.**\n\n    Think about a specific member of your audience\
    \ and make as many educated guesses as you can about that person’s motivations.\n\
    \n    ![Tip](images/tip.png)Give this (imaginary) audience member a name and a\
    \ few other identifying characteristics. I always imagine a 45-year-old divorced\
    \ mother of two named Eve.\n\n2.  **Define the purpose of your visualization.**\n\
    \n    Narrow the purpose of the visualization by deciding exactly what action\
    \ or outcome you want audience members to make as a result of the visualization.\n\
    \n3.  **Choose a functional design.**\n\n    Review the three main data visualization\
    \ types (discussed earlier in this chapter) and decide which type can best help\
    \ you achieve your intended outcome.\n\nThe following sections spell out this\
    \ process in detail.\n\n### Step 1: Brainstorm (All about Eve)\n\nTo brainstorm\
    \ properly, pull out a sheet of paper and picture an imaginary audience member\
    \ — “Eve,” for example. Let’s practice together in creating a more functional\
    \ and effective data visualization. You’d want to start by answering the more\
    \ important questions you could ask about Eve in order to better understand her\
    \ and, thus, better understand and design for your target audience.\n\nStart by\
    \ forming a picture of what Eve’s average day looks like — what she does when\
    \ she gets out of bed in the morning, what she does over her lunch hour, and what\
    \ her workplace is like. Also consider how Eve will use your visualization. These\
    \ things tell you a little bit about her *psychographics* (the psychological characteristics\
    \ that drive her high-level needs and wants).\n\nTo form a more comprehensive\
    \ view of who Eve is and how you can best meet her needs, you can pull from the\
    \ following question bank:\n\n*   Where does Eve work? What does she do for a\
    \ living?\n\n*   What kind of technical education or experience, if any, does\
    \ she have?\n\n*   How old is Eve? Is she married? Does she have children? What\
    \ does she look like? Where does she live?\n\n*   What social, political, cause-based,\
    \ or professional issues are important to Eve? What does she think of herself?\n\
    \n*   What problems and issues does Eve have to deal with every day?\n\n*   How\
    \ does your data visualization help solve Eve’s work problems or her family problems?\
    \ How does it improve her self-esteem?\n\n*   Through what avenue will you present\
    \ the visualization to Eve (for example, over the internet or in a staff meeting)?\n\
    \n*   What does Eve need to be able to do with your data visualization?\n\nBecause\
    \ we’re doing this together, I’ll answer these questions for you by telling you\
    \ that Eve is the manager of the zoning department in Irvine County. She is 45\
    \ years old and a divorced mother of two children who are about to start college.\
    \ She is deeply interested in local politics and eventually wants to be on the\
    \ county’s board of commissioners. To achieve that position, she has to get some\
    \ major “oomph” on her county management résumé. Eve derives most of her feelings\
    \ of self-worth from her job and her keen ability to make good management decisions\
    \ for her department.\n\nUntil now, Eve has been forced to manage her department\
    \ according to her gut-level intuition, backed by a few disparate business systems\
    \ reports. She isn’t extraordinarily analytical, but she knows enough to understand\
    \ what she sees. The problem is that Eve lacks the visualization tools she needs\
    \ in order to display all the relevant data she should consider. She has neither\
    \ the time nor the skill to code something herself. Eve is excited that you’ll\
    \ attend next Monday’s staff meeting to present data insights you’ve discovered\
    \ that she hopes will enable her to make more effective data-driven management\
    \ decisions.\n\n### Step 2: Define the purpose\n\nAfter you brainstorm about the\
    \ typical audience member (see the preceding section), you can much more easily\
    \ pinpoint exactly what you’re trying to achieve with your data visualization.\
    \ Are you trying to get consumers to feel a certain way about themselves or the\
    \ world around them? Are you trying to make a statement? Are you seeking to influence\
    \ organizational decision-makers to make good business decisions? Or do you simply\
    \ want to lay all the data out there, for all viewers to make sense of, and deduce\
    \ from it what they will?\n\nReturning to the hypothetical Eve: What decisions\
    \ or processes are you trying to help her achieve? Well, you’d first need to make\
    \ sense of her data and uncover relevant data insights. Then you’d need to present\
    \ those data insights to her in a way that she can clearly understand and use\
    \ for improved decision-making. So, looking at the data — what do you see that’s\
    \ happening within the inner mechanics of Eve’s department? After you’ve discovered\
    \ some clear trends and predictions, it’s time to use data visualization skills\
    \ to guide Eve into making the most prudent and effective management choices.\n\
    \n### Step 3: Choose the most functional visualization type for your purpose\n\
    \nKeep in mind that you have three main types of visualization from which to choose:\
    \ data storytelling, data art, and data showcasing. Remember that, if you’re designing\
    \ for organizational decision-makers, you’ll most likely use data storytelling\
    \ to directly tell your audience what their data means with respect to their line\
    \ of business. If you’re designing for a social justice organization or a political\
    \ campaign, data art can best make a dramatic and effective statement with your\
    \ data. Lastly, if you’re designing for analysts, engineers, scientists, or statisticians,\
    \ stick with data showcasing so that these analytical types have plenty of room\
    \ to figure things out on their own.\n\nBack to Eve — because she’s not extraordinarily\
    \ analytical and because she’s depending on you to help her make excellent data-driven\
    \ decisions, you need to employ *data storytelling* techniques. Create either\
    \ a static or interactive data visualization with some, but not too much, context.\
    \ The visual elements of the design should tell a clear story about her business\
    \ unit, such that Eve doesn’t have to work through tons of complexity to get the\
    \ point of what you’re trying to tell her about her department.\n\n![Tip](images/tip.png)My\
    \ best practices for effective dashboard design are available to you over on [`https://businessgrowth.ai`](https://businessgrowth.ai/).\n\
    \n## Picking the Most Appropriate Design Style\n\nIf you’re the analytical type,\
    \ you might say that the only purpose of a data visualization is to convey numbers\
    \ and facts via charts and graphs — no beauty or design is needed. But if you’re\
    \ a more artistic-minded person, you may insist that you have to *feel* something\
    \ in order to truly understand it. Truth be told, a good data visualization is\
    \ neither artless and dry nor completely abstract in its artistry. Instead, its\
    \ beauty and design lie somewhere on the spectrum between these two extremes.\n\
    \nTo choose the most appropriate design style, you must first consider your audience\
    \ (discussed earlier in this chapter) and then decide how you want them to respond\
    \ to your visualization. If you’re looking to entice the audience into taking\
    \ a deeper, more analytical dive into the visualization, employ a design style\
    \ that induces a calculating and exacting response in its viewers. But if you\
    \ want your data visualization to fuel your audience’s passion, use an emotionally\
    \ compelling design style instead.\n\n### Inducing a calculating, exacting response"
  fmt: "\n## 1. Brainstorm.\n\nThink about a specific member of your audience and\
    \ make as many educated guesses as you can about that person’s motivations.\n\n\
    ![Tip](images/tip.png)Give this (imaginary) audience member a name and a few other\
    \ identifying characteristics. I always imagine a 45-year-old divorced mother\
    \ of two named `Eve`.\n\n## 2. Define the purpose of your visualization.\n\nNarrow\
    \ the purpose of the visualization by deciding exactly what action or outcome\
    \ you want audience members to make as a result of the visualization.\n\n## 3.\
    \ Choose a functional design.\n\nReview the three main data visualization types\
    \ (discussed earlier in this chapter) and decide which type can best help you\
    \ achieve your intended outcome.\n\nThe following sections spell out this process\
    \ in detail.\n\n### Step 1: Brainstorm (All about Eve)\n\nTo brainstorm properly,\
    \ pull out a sheet of paper and picture an imaginary audience member — “Eve,”`\
    \ for example. Let’s practice together in creating a more functional and effective\
    \ data visualization. You’d want to start by answering the more important questions\
    \ you could ask about `Eve` in order to better understand her and, thus, better\
    \ understand and design for your target audience.\n\nStart by forming a picture\
    \ of what `Eve`’s average day looks like — what she does when she gets out of\
    \ bed in the morning, what she does over her lunch hour, and what her workplace\
    \ is like. Also consider how `Eve` will use your visualization. These things tell\
    \ you a little bit about her `psychographics` (the psychological characteristics\
    \ that drive her high-level needs and wants).\n\nTo form a more comprehensive\
    \ view of who `Eve` is and how you can best meet her needs, you can pull from\
    \ the following question bank:\n\n*   Where does `Eve` work? What does she do\
    \ for a living?\n*   What kind of technical education or experience, if any, does\
    \ she have?\n*   How old is `Eve`? Is she married? Does she have children? What\
    \ does she look like? Where does she live?\n*   What social, political, cause-based,\
    \ or professional issues are important to `Eve`? What does she think of herself?\n\
    *   What problems and issues does `Eve` have to deal with every day?\n*   How\
    \ does your data visualization help solve `Eve`’s work problems or her family\
    \ problems? How does it improve her self-esteem?\n*   Through what avenue will\
    \ you present the visualization to `Eve` (for example, over the internet or in\
    \ a staff meeting)?\n*   What does `Eve` need to be able to do with your data\
    \ visualization?\n\nBecause we’re doing this together, I’ll answer these questions\
    \ for you by telling you that `Eve` is the manager of the zoning department in\
    \ Irvine County. She is 45 years old and a divorced mother of two children who\
    \ are about to start college. She is deeply interested in local politics and eventually\
    \ wants to be on the county’s board of commissioners. To achieve that position,\
    \ she has to get some major “oomph” on her county management résumé. `Eve` derives\
    \ most of her feelings of self-worth from her job and her keen ability to make\
    \ good management decisions for her department.\n\nUntil now, `Eve` has been forced\
    \ to manage her department according to her gut-level intuition, backed by a few\
    \ disparate business systems reports. She isn’t extraordinarily analytical, but\
    \ she knows enough to understand what she sees. The problem is that `Eve` lacks\
    \ the visualization tools she needs in order to display all the relevant data\
    \ she should consider. She has neither the time nor the skill.\n\n### Step 2:\
    \ Define the purpose\n\nAfter you brainstorm about your audience (see the preceding\
    \ section), you can much easily pinpoint exactly what you’re trying to achieve.\
    \ Returning to `Eve` — because she’s not extraordinarily analytical and because\
    \ she’s depending on you to make effective decisions. \n\n### Step 3: Choose the\
    \ most functional design\n\nKeep in mind that you have three main types of visualization\
    \ from which to choose: `data storytelling`, `data art`, and `data showcasing`.\
    \ Remember that, if you’re designing for decision-makers, you’ll most likely use\
    \ `data storytelling` to directly tell your audience what data means. If you’re\
    \ designing for a social justice organization or a political campaign, `data art`\
    \ can best make a statement. Lastly, if you’re designing for analysts, engineers,\
    \ or statisticians, stick with `data showcasing` so that these types have plenty\
    \ of room to figure things out.\n\nBack to `Eve` — because she’s not extraordinarily\
    \ analytical and because she’s depending on you to make effective decisions, you\
    \ need to employ `data storytelling` techniques. Create either a static or interactive\
    \ data visualization with some, but not too much, context. The visual elements\
    \ of the design should tell a clear story about her department, such that `Eve`\
    \ doesn’t have to work through tons of complexity to get the point of what you’re\
    \ trying to tell her.\n"
