- raw: "Beautiful Soup ([`https://beautiful-soup-4.readthedocs.io/en/latest`](https://beautiful-soup-4.readthedocs.io/en/latest))\
    \ is a popular Python library that’s built to support most web-scraping requirements.\
    \ If you need to extract data from websites, this is the library for you. It completely\
    \ simplifies the process of navigating, searching, and modifying web page content.\
    \ Beautiful Soup is especially useful for tasks like collecting large datasets\
    \ from the web, gathering information for research, or automating repetitive web\
    \ data collection.\n\n![Remember](images/remember.png)In web scraping*,* you set\
    \ up automated programs and then let those programs scour the web for the data\
    \ you need.\n\n## Wrangling Data with pandas\n\nPython’s pandas library ([`https://pandas.pydata.org`](https://pandas.pydata.org/))\
    \ is a free option that you can use to manipulate, clean, and analyze structured\
    \ data. Whether you’re working with comma-separated values (CSV) files, Microsoft\
    \ Excel files, or data from Structured Query Language (SQL) databases, pandas\
    \ provides an intuitive way to reshape, filter, and aggregate your data. With\
    \ its large community and extensive documentation, pandas is an excellent option\
    \ for any data-wrangling tasks you may find yourself up against.\n\n## Visualizing\
    \ Data with Looker Studio\n\nLooker Studio ([`https://lookerstudio.google.com`](https://lookerstudio.google.com/)),\
    \ formerly known as Google Data Studio, has evolved into a powerful data analytics\
    \ platform that enables users to analyze data from a wide variety of sources,\
    \ including databases, data warehouses, and third-party applications — not just\
    \ Google Analytics. It’s a free, cloud-based data visualization and business intelligence\
    \ tool that you can use to turn raw data into insightful, shareable reports and\
    \ dashboards. If you’re looking to make data-driven decisions with clear and interactive\
    \ reports, be sure to explore what Looker Studio can do for you.\n\n## Machine\
    \ Learning with scikit-learn\n\n*Machine learning* is the class of artificial\
    \ intelligence (AI) that’s dedicated to developing and applying algorithms to\
    \ data so that the algorithms can automatically learn and detect patterns in large\
    \ datasets. One of the most important libraries for machine learning is scikit-learn\
    \ ([`https://scikit-learn.org`](https://scikit-learn.org/)), a user-friendly and\
    \ versatile Python library that simplifies the process of building, training,\
    \ and evaluating machine learning models. It’s widely used for traditional machine\
    \ learning tasks like classification, regression, clustering, and dimension reduction.\n\
    \n## Creating Interactive Dashboards with Streamlit\n\nStreamlit ([`https://streamlit.io`](https://streamlit.io/))\
    \ is a powerful and easy-to-use Python library for building interactive web applications\
    \ and data dashboards. You can use it to quickly transform Python scripts into\
    \ web-based applications, even if you don’t have web development expertise. Streamlit’s\
    \ simplicity and flexibility have made it an increasingly popular choice for creating\
    \ data science prototypes, dashboards, and even machine learning model demonstrations.\n\
    \n## Doing Geospatial Data Visualization with Kepler.gl\n\nKepler.gl [`(https://kepler.gl`](https://kepler.gl/))\
    \ is an open-source, high-performance tool that was developed by Uber for visualizing\
    \ large-scale geospatial data. It makes it easy to explore, analyze, and present\
    \ data within a geographical context. The tool is especially good at processing\
    \ and displaying large datasets. It provides both flexibility and performance\
    \ for working with spatial data.\n\n## Making Charts with Tableau Public\n\nTableau\
    \ Public ([`www.tableausoftware.com/public`](http://www.tableausoftware.com/public)),\
    \ a free desktop application, aims to be a complete package for chart making.\
    \ As part of the freeware limitation, the application doesn’t let you save files\
    \ locally to your computer. All your work must be uploaded to Tableau Public’s\
    \ cloud server, unless you purchase the software.\n\nTableau Public creates three\
    \ levels of document: the worksheet, the dashboard, and the story. In the worksheet,\
    \ you can create individual charts from data you’ve imported from Access, Excel,\
    \ or a CSV file. You can then use Tableau Public to easily do things such as choose\
    \ between different data graphic types or drag columns to different axes or subgroups.\n\
    \n## Doing Web-Based Data Visualization with RAWGraphs\n\nYou can use RAWGraphs\
    \ ([`www.rawgraphs.io`](https://www.rawgraphs.io/)), a unique and unusual web\
    \ application, to make artistic and creative visualizations from your dataset.\
    \ The RAWGraphs layout has a simple drag-and-drop interface that you can use to\
    \ make unique and interesting data visualizations with just a few clicks of the\
    \ mouse. If you want to get funky and cool with your data visualization but you\
    \ lack the time or money it takes to learn how to code this sort of thing for\
    \ yourself, RAWGraphs is the perfect data visualization alternative.\n\n## Making\
    \ Cool Infographics with Infogram\n\nYou can use the online tool Infogram ([`https://infogram.com`](https://infogram.com/))\
    \ to make aesthetically appealing, *vertically stacked card infographics* (visualizations\
    \ that are composed of a series of cards, stacked vertically on top of one another,\
    \ each with its own set of data graphics). Infogram offers a variety of trendy\
    \ color schemes, design schemes, and chart types. With Infogram, you can import\
    \ your own images to make an infographic that’s much more personalized. Infogram\
    \ also provides you with sharing capabilities so you can spread an infographic\
    \ quickly and easily across social channels or via private email. The freemium\
    \ plan is robust enough to supply all your more basic infographic-making needs.\n\
    \n## Making Cool Infographics with Canva\n\nCanva ([`www.canva.com`](https://www.canva.com/))\
    \ is a versatile tool that you can use to design professional infographics, even\
    \ if you don’t have advanced design skills. Canva’s intuitive interface allows\
    \ users to easily create infographics by dragging and dropping elements like text,\
    \ images, and charts. No coding or design experience is required.\n\n# Index\n\
