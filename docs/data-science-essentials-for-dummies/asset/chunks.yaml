    \n在这种场景下，你希望创建一个类，生成一个包含每个月份雪深数据的列表。每个每月列表都由该类生成的对象实例。类本身会将 FTP 下载函数与将下载的记录存储在列表中的函数结合在一起。然后你可以根据需要的月份对类进行实例化，以进行彻底的分析。以下是实现此类操作的代码：\n\
    \n```python\nimport ftplib\nclass Download:\n    def __init__(self,site,dir,ftp=None,fileList=[]):\n\
