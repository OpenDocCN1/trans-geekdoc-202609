    \ Excel has no easy, out-of-the-box way to make this insertion. Using Excel macros,\
    \ however, you can ask Excel to record you while you step through the process\
    \ one time, and then assign a key command to this recording to create the macro.\
    \ After you create the macro, every time you need to repeat the same task in the\
    \ future, just run the macro by pressing the key command, and the script then\
    \ performs all required steps for you.\n\n![Remember](images/remember.png)Macros\
    \ have an Absolute mode and a Relative mode. The Absolute mode refers to a macro’s\
    \ routine that runs absolutely the way you recorded it — all the way down to the\
    \ spreadsheet cell positions in which the routine was recorded. Relative mode\
    \ macros run the same routine you record but can be placed in whatever cell position\
    \ you need within the spreadsheet.\n\n![Tip](images/tip.png)When you record a\
