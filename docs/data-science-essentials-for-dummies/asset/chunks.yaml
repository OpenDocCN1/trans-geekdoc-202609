  trans: '


    过去，只有拥有巨额资金的大型科技公司才具备实施数据科学方法来优化和改进业务所需的技能和计算资源，但这种情况已经过去有一段时间了。数据的激增产生了对洞察的需求，而这种需求根植于现代文化的许多方面——从期望
    Uber 司机完全按照 App 预测的时间和地点到达的乘客，到期望 Amazon 平台在购物者购买前为同类商品推荐最佳替代方案进行对比的在线购物者。数据以及对数据驱动洞察的需求无处不在。由于各种规模的组织都开始意识到，他们正身处一个“不生即死”的、数据驱动的竞争环境中，数据技能已成为几乎每一条业务的核心且必要的职能。


    对于普通知识工作者来说这意味着什么？


    这意味着普通员工日益被要求支持一套不断进步的技术和数据需求。为什么呢？因为几乎所有行业都依赖数据技术以及由此引发的洞察。因此，许多人不断需要升级自己的数据技能，否则他们将面临被更精通数据的员工取代的真实可能性。


    好消息是，升级数据技能通常不需要人们回到大学，或获得统计学、计算机科学或数据科学的大学学位。坏消息是，即使通过专业培训或自学，为了保持行业相关性和技术敏锐也总是需要付出额外的努力。在这方面，数据革命与过去冲击行业的任何其他变化并没有太大区别。事实是，为了保持相关性，你必须花费时间和精力去获取让你与时接的技能。当你学习如何做数据科学时，你可以参加一些课程，利用在线资源自我学习，阅读像这本书这样的书，并参加活动，在活动中你可以学习保持行业领先地位所需的知识。


    谁可以使用数据科学？你可以。你的组织可以。你的雇主可以。任何具有一定理解和接受过培训的人都可以开始利用数据洞察来改善他们的生活、职业以及业务的健康状况。数据科学代表了你对待世界方式的变化。在确定结果时，人们过去通常做出最好的推测，根据推测行动，然后希望获得理想的结果。然而，通过数据洞察，人们现在可以获得真正驱动变革并实现他们想要的结果所需的预测性视野。


    以下是你可以利用数据洞察来让世界（以及你的公司）变得更好的地方的一些示例方法：


    *   **为你的业务系统开发关键绩效指标 (KPIs)。** 使用 KPI 跟踪性能并优化可衡量业务活动的投资回报率 (ROI)。

    *   **开发你的营销策略。** 使用数据洞察和预测性分析来识别有效的营销策略，消除表现不佳的尝试并测试新的营销策略。

    *   **保持社区安全。** 预测性警务应用有助于执法人员预测和预防当地犯罪活动。

    *   **帮助为那些不幸运的人创造一个更好的世界。** 发展中国家的数据科学家正在使用社会数据、移动数据和网站数据来生成实时分析，以提高人道主义对灾害、流行病、粮食短缺等问题响应的效率。


    ## 检查数据科学拼图的碎片


    要在真正意义上实践数据科学，你需要数学和统计学的分析技巧、处理数据时所需的编码技能，以及某一领域的专业知识。没有这些专业知识，你还不如称自己为数学家或统计学家。同样，一个没有领域专业知识和分析技巧的程序员可能被更多地认为是软件工程师或开发人员，而不是数据科学家。


    对数据驱动的业务和产品策略的需求在过去十年中呈指数级增长，迫使所有业务领域和行业采用数据科学方法。因此，出现了不同风格的数据科学。以下是每个学科专家被要求了解并定期进行数据科学的几个头衔：


    *   临床生物统计学家

    *   数据与技术政策分析师

    *   数据科学家——地理空间与农业分析师

    *   数据科学家——医疗保健

    *   数字银行产品负责人

    *   广告技术数据科学总监

    *   地质数据科学家

    *   全球渠道运营——数据卓越主管


    现在，要区分真正的数据科学家和领域专家 (SME) 几乎是不可能的，因为后者的成功在很大程度上取决于他们利用数据科学产生洞察的能力。查看一个人的工作头衔可能有用，也可能没有帮助，仅仅因为根据实际要求，许多角色被命名为
    `data scientist`，但它们完全可以标记为数据战略师或产品经理。此外，许多知识工作者正在从事日常数据科学工作，并没有以 `data scientist`
    的名义。这是一个被过度炒、往往具有误导性的标签，如果你试图通过查看在线招聘板来了解数据科学家在做什么，这个标签并不总是有帮助。


    为了说明这一点，在接下来的章节中，我将详细说明构成任何数据科学角色的关键组成部分，无论该角色是否被赋予了 `data scientist` 的标签。


    ### 收集、查询和消费数据


    数据工程师的工作是捕获和整理大量的结构化、非结构化和半结构化 `big data`（这是一个过时的术语，用于描述超过传统数据库系统处理能力的数据，因为它们太大、移动得太快，或者缺乏传统数据库架构的结构要求）。


    ![Remember](img/remember.png)数据工程任务与数据科学中执行的工作是分开的，后者更多地关注分析、预测和可视化。尽管有这种区别，但每当数据科学家在分析过程中收集、查询和消费数据时，他们执行的工作与数据工程师（我在本章早期提到的角色）是类似的。


    虽然从单一数据源可以产生价值的洞察，但通常多个来源的结合可以提供驱动更好的数据决策所需的上下文信息。数据科学家可以处理存储在单个数据库中的多个数据集，甚至是不同的数据存储环境。其他情况下，源数据存储并处理在软件和数据工程师构建的云平台上。


    无论数据如何组合或存储，如果你是一个数据科学家，你几乎总是要`查询`数据——也就是说编写命令从数据存储系统中提取相关数据集。大多数情况下，你使用结构化查询语言
    (`SQL`) 来查询数据。（第 7 章 全是关于 `SQL` 的，所以如果你对这个缩写感到害怕，现在就跳到那一章。）


    无论你是使用第三方应用程序还是使用 R 或 Python 等编程语言进行自定义分析，你都可以从许多通用的文件格式中选择：


    *   **逗号分隔值 (CSV)：** 几乎每个品牌的桌面和网络端分析应用程序都接受这种文件类型，常用的脚本语言（如 Python 和 R）也是如此。


