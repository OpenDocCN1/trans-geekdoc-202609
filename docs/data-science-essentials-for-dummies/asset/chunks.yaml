    ¶ 图 4-6： 根据房屋房间数量预测房价的线性回归。


    ![Remember](img/remember.png)**记住数据集大小！** 别忘记数据集的大小！一个通用的经验法是，如果你希望使用线性回归生成可靠的结果，那么每个预测特征至少应该有
    20 个观测值。


    ## 逻辑回归


    逻辑回归是一种机器学习方法，你可以用它根据所选择的特征来估计分类目标变量的值。你的目标变量应该是数值型的，并且应该包含描述目标类别或范畴的值。逻辑回归的一个酷炫之处是，它除了可以预测目标变量中观测值的类别外，还能指示每个估计值的概率。虽然逻辑回归类似于线性回归，但它的要求更简单，体如下：


    - 特征与目标变量之间不需要存在线性关系。

    - 残差不需要符合正态分布。

    - 预测特征不要求符合正态分布。


    在决定逻辑回归是否是你的合适选择时，请考虑以下局限性：


    - 缺失值应该被处理或删除。

    - 你的目标变量必须是二元的或序数的。


    ![Remember](img/remember.png)二分类为“是”分配 1，为“否”分配 0。

    - 预测特征应该是相互独立的。


    逻辑回归比线性回归需要更多的观测值才能产生可靠的结果。经验法规则是，如果你希望生成可靠的结果，每个预测特征至少应该有 50 个观测值。


    ![Tip](img/tip.png)预测*泰坦尼克号*上的幸存者是学者学习逻辑回归的经典练习题。你对其进行练习，并在 Kaggle 上看到许多该问题的求解示例（[`www.kaggle.com/c/titanic`](https://www.kaggle.com/c/titanic)`）。


    ## 普通最小二法回归方法


    *普通最小二法* (OLS) 是一种对数据集拟合线性回归线的统计方法。通过 OLS，你通过对描述数据点与最佳拟合线之间距离的垂直距离值进行平方，将这些平方距离相加，然后调整最佳拟合线的位置，使得平方距离之和值最小。如果你想构建一个接近你数据的函数，请使用
    `OLS`。


    ![Remember](img/remember.png)一如既往，不要期望实际值与回归预测的值完全相同。回归预测的值值仅仅是模型中与实际值最相似的估计值。


    `OLS` 对于对包含多个独立变量的模型拟合回归线特别有用。通过这种方式，你可以使用 `OLS` 从数据集特征中估计目标值。


    ![Warning](img/warning.png)当使用 `OLS` 回归方法拟合具有多一个独立变量的回归线时，变量中的两个或多个之间可能会相互关联。当两个或多个独立变量彼此存在强相关时，这被称为*多重共线性*。当这两个或多个独立变量被分开检查时，多重共线性往往会影响它们作为预测变量的可靠性。幸运的是，当从整体考虑时，多重共线性并不会降低模型的预测可靠性。


    ## 检测离群值


    许多统计和机器学习方法假设你的数据没有离群值。删除离群值是为分析准备数据的重要部分。在本节中，你将看到用于发现数据中离群值的各种方法。


    ### 分析极值


    *离群值*是指与大多数数据点显著不同的值。发现离群值是重要的，因为如果不加处理，它们会偏偏分布，使方差看起来虚高并导致误导。


    你可以使用离群值检测来发现异常情况。离群值属于以下三类：


    - **点离群值**（Point）：与变量正常范围相比的异常数据点。

    - **情境离群值**（Contextual）：仅在特定情境下是异常的数据点。例如，如果你正在检查奥兰多 1 月的数据，并看到 23 摄氏度的读数，这将是异常的，因为那里的平均温度是
    70 摄氏度。但如果你查看阿拉斯加 1 月的数据，23 摄氏度完全并不异常。

    - **集体离群值**（Collective）：这些离群值彼此相邻，具有相似的异常值。


    你可以通过单变量或多变量方法来检测离群值，下两个节所示。


    ### 使用单变量分析检测离群值


    单变量离群值检测是指单独查看数据集中的特征并检查异常值。你可以从以下两种简单方法中选择：


    - 图基离群值标记

    - 图基箱线图


    图基箱图是一种探索性数据分析技术，通过分位数来可视化变量内部的数据分布。正如你可能猜到的，图基箱图是以其发明者约翰·图基（John Tukey）命名的，他是一位在
    20 世纪 6070 年代工作的美国数学家。图基离群值标记是指将箱线图最小值和最大值之外的数据点标记为离群值。


    使用图基方法手动计算、识别和标记离群值很麻烦，但如果你想这样做，诀窍在于观察最小值和最大值距离 25 分位数和 75 分位数有多远。第一四位数和第三四位数之间的距离被称为*四分位间距*（`IQR`），它描述了数据的离散程度。当你查看一个变量时，考虑它的离散程度、`Q1/Q3`
    值以及它的最小值和最大值，以决定该变量是否存在离群值疑。


    ![Tip](img/tip.png)这是一个很好的经验法则：


    ```a = Q1 – 1.5 * IQR

    ```


    和


    ```

    b = Q3 + 1.5 * IQR

    ```


    如果你的最小值小于 `a`，或者你的最大值大于 `b`，那么该变量可能有离群值。


    另一方面，使用 Python 或 R 生成图基箱线图并检测离群值是非常简单的。每个箱线图都有设置在 `1.5 * IQR` 的须线。位于这些须线之外的值都是离群值。[图
    4-7] 显示了在 Python 中生成的图基箱线图中显示的离群值。


    ### 使用多变量分析检测离群值


