  trans: "\n\nBeautiful Soup (`[https://beautiful-soup-4.readthedocs.io/en/latest]`)\
    \ 是一个流行的 Python 库，旨在支持大多数网络爬取需求。如果你需要从网站中提取数据，那么这个库非常适合你。它完全简化了导航、搜索和修改网页内容的过程。Beautiful\
    \ Soup 特别适用于从网络上收集大型数据集、为研究收集信息或自动执行重复性网页数据采集等任务。\n\n![Remember](img/remember.png)\n\
    在网络爬取中，你设置好自动化程序，然后让这些程序在网络上搜索你需要的数据。\n\n## 使用 pandas 处理数据\n\nPython 的 pandas\
    \ 库 (`[https://pandas.pydata.org]`) 是一个免费选项，你可以用它操作、清洗和分析结构化数据。无论你是在处理逗号分隔值 (CSV)\
    \ 文件、Microsoft Excel 文件还是来自结构化查询语言 (SQL) 数据库的数据，pandas 都提供了一种直观的方法来重塑、过滤和聚合你的数据。凭借其庞大的社区和详尽的文档，pandas\
    \ 是应对任何数据处理任务的绝佳选择。\n\n## 使用 Looker Studio 可视化数据\n\nLooker Studio (`[https://lookerstudio.google.com]`)\
    \ 旧称为 Google Data Studio，已演变为一个强大的数据分析平台，允许用户分析来自各种来源的数据，包括数据库、数据仓库和第三方应用程序——而不仅仅是\
    \ Google Analytics。它是一个免费的云端数据可视化和商业智能工具，你可以用它将原始数据转换为具有洞察力可共享的报告和仪表板。如果你希望通过清晰且交互式的报告做出数据驱动的决策，请务必探索\
    \ Looker Studio 能为你提供什么。\n\n## 使用 scikit-learn 进行机器学习\n\n机器学习是人工智能 (AI) 的一类，致力于开发和应用算法到数据上，以便算法自动学习并检测大型数据集中的模式。机器学习领域最重要的库之一是\
    \ scikit-learn (`[https://scikit-learn.org]`)，它是一个用户友好且多功能的 Python 库，简化了构建、训练和评估机器学习模型的过程。它被广泛用于传统的机器学习任务，如分类、回归、聚类和降维。\n\
    \n## 使用 Streamlit 创建交互式仪表板\n\nStreamlit (`[https://streamlit.io]`) 是一个强大且易于使用的\
    \ Python 库，用于构建交互式 Web 应用和数据仪表板。你可以用它快速将 Python 脚本转换为基于 Web 的应用程序，即使你没有 Web 开发专业知识。Streamlit\
    \ 的简单性和灵活性使其成为创建数据科学原型、仪表板甚至机器学习模型演示的日益受欢迎的选择。\n\n## 使用 Kepler.gl 进行地理空间数据可视化\n\
    \nKepler.gl (`(https://kepler.gl)`) 是一个由 Uber 开发的开源、高性能工具，用于可视化大规模地理空间数据。它使得在地理背景下探索、分析和展示数据变得简单。该工具特别擅长处理和显示大型数据集。它为处理空间数据提供了灵活性性能。\n\
    \n## 使用 Tableau Public 制作图表\n\nTableau Public (`[www.tableausoftware.com/public]`)\
    \ 是一款免费的桌面应用程序，旨在提供一套完整的图表制作方案。由于免费软件的限制，该程序不允许将文件保存到本地计算机。除非你购买该软件，否则你的所有工作必须上传到\
    \ Tableau Public 的云服务器上。\n\nTableau Public 创建三个层级的文档：工作表 (worksheet)、仪表板 (dashboard)\
    \ 和故事 (story)。在工作表中，你可以根据从 Access、Excel 或 CSV 文件导入的数据创建单个图表。然后你可以使用 Tableau Public\
    \ 轻松执行操作，例如在不同的数据图形类型之间进行选择，或将列拖到不同的轴或子组。\n\n## 使用 RAWGraphs 进行 Web 数据可视化\n\n\
    你可以使用 RAWGraphs (`[www.rawgraphs.io]`) 这种独特且不寻常的 Web 应用程序从你的数据制作艺术化和创意性的可视化。RAWGraphs\
    \ 的布局具有简单的拖拽界面，你只需点击几次鼠标即可创建独特且有趣的可视化。如果你想让你的数据可视化变得新颖、酷炫，但又缺乏学习编写这类代码的时间或金钱，RAWGraphs\
    \ 是完美的可视化替代方案。\n\n## 使用 Infogram 制作酷炫的信息图\n\n你可以使用在线工具 Infogram (`[https://infogram.com]`)\
    \ 制作具有美感的垂直堆叠卡片式信息图（由一系列卡片垂直堆叠组成的可视化，每张卡片都有自己的一套数据图形）。Infogram 提供了各种时尚配色、设计方案和图表类型。通过\
    \ Infogram，你可以导入自己的图片来制作更具个性化的信息图。Infogram 还提供了分享功能，让你能够通过社交渠道或私有邮件快速方便地传播信息图。其免费增值计划足以满足你所有基础的信息图制作需求。\n\
    \n## 使用 Canva 制作酷炫的信息图\n\nCanva (`[www.canva.com]`) 是多功能工具，你可以用它设计专业的信息图，即使你没有高级设计技能。Canva\
    \ 的直观界面允许你\n\n# 索引\n\n## A\n\n- a, `45`\n- Absolute, `139`, `140`, `141`\n- activation,\
