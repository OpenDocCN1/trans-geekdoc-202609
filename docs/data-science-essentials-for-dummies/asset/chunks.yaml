    来源：[`Lynda.com`](http://Lynda.com), Python for DS ¶ 图 8-21： 等级颜色图。


    ![FIGURE 8-22: A point map.](img/9781394297009-fg0822.png)


    图 8-22： 点地图。


    ![Remember](img/remember.png) 无论你是数据可视化设计师还是消费者，都要注意数据可视化中的一些常见陷阱。简单来说，如果数据可视化构建得不对，它可能会产生误导。常见问题包括：总和不为
    100% 的饼图、刻度起始位置奇怪的柱状图，以及垂直轴不匹配的多列柱状图。


    ![FIGURE 8-23: A raster surface map.](img/9781394297009-fg0823.png)


    图 8-23： 栅格表面地图。


    ## 测试数据图表


    你的数据可视化必须传达清晰且有力的视觉信息。为了实现这一点，你必须测试各种数据图表，并只选择最有效的包含在最终的数据可视化中。例如，图 8-24 中显示的两个数据图表代表完全相同的统计数据。


    ![FIGURE 8-24: Here you see the importance of selecting effective data graphics.](img/9781394297009-fg0824.png)


    图 8-24： 在这里你可以看到选择有效数据图表的重要性。


    注意右侧的数据图表在视觉上强调数值差异方面方面做得好得多。你应该始终测试不同的数据图表，以确保你使用的是最清晰、最有效地显示你的数据的图表。左侧的图表*不是*有效的。为了只选择最有效的数据图表包含在你的数据可视化中，只需遵循以下四个步骤：


    1. **列出你的数据旨在回答的问题列表。**

    2. **确定数据可视化类型：数据故事讲述、数据展示或数据艺术。**

    3. **从适用于此类数据可视化的适当图表类型中选择选项。**

    4. **用你的数据测试这些数据图表——亲眼观察哪种图表类型为你的问题提供了最清晰、最直的答案。**


    ![Tip](img/tip.png) 在测试不同的数据图表并决定你想使用什么后，在你的数据可视化中安排这些图表。你可以使用 Python、R 或电子表格来实现（参见第
    6 章）。或者，如果你想使用在线数据可视化设计工具创建数据可视化，你可能会发现我的指南有所帮助：*基于 Web 的数据可视化设计工具——前 10 名*。你可以在
    [`https://businessgrowth.ai`](https://businessgrowth.ai/) 上找到它。


    ## 添加上下文


    在你确切知道使用哪些数据图表后，你需要决定是否以及如何创建必要的上下文来为数据可视化添加更多意义。添加上下文有助于人们理解你的数据可视化所传达信息的价值和相对重要性。在计算、精确的数据可视化样式中添加上下文有助于建立相对视角，但在纯数据艺术中，你可能考虑省略额外的上下文。那是因为在数据艺术中，你只是试图传达一个观点，而不希望添加会分散该观点注意力的信息。


    ### 使用数据创建上下文


    在数据展示中，你应该为你数据可视化中显示的关键指标包含相关的上下文数据——例如，当你正在创建一个描述电子商务销售转化率的数据可视化时。此时关键指标将通过通过购买转变为客户的用户百分比来表示。与此指标相关的上下文数据可能包括购物车放弃率、用户购买前的平均会话次数、购买前的平均访问页面数，或客户决定转化之前访问的特定页面。这种上下文信息帮助观众理解销售转化的背后的原因和方式。


    ![Remember](img/remember.png) 添加上下文往往会导致数据焦去中心化。


    ### 通过注释创建上下文


    有时，通过包含提供标题和数据简短描述的注释可以更合适地创建上下文。良好的注释对分析性和非分析类读者都有帮助。


    ### 通过图形元素创建上下文


    在数据可视化中创建上下文的另一种有效方法是包含传达数据相对重要性的图形元素。此类图形元素包括移动趋势线、单值警报、目标趋势线（如图 8-26 所示）和预测基准。


