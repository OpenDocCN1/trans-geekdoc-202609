- raw: '    *   I could have designated `Genre` to be a separate column in the Film
    table, but it’s better off in its own table because that allows for the possibility
    of missing data values (`NULL`s). Look at the Film table just shown. Film 1 has
    no genre assigned to it. If the `Genre` column were included in this table, then
    `Film 1` would have a `NULL` value there. Rather than have a column that contains
    a `NULL` value, it''s much easier to make a separate Genre data table. The primary
    keys of the Genre table don’t align exactly with those of the Film table, but
    they don’t need to when you go to join them.


    ![Tip](images/tip.png)`NULL` values can be quite problematic when you’re running
    a `SELECT` query. When you''re querying based on the value of particular attribute,
    any records that have a `NULL` value for that attribute won’t be returned in the
    query results. Of course, these records would still exist, and they may even fall
    within the specified range of values you’ve defined for your query, but if the
    record has a `NULL` value, it''s omitted from the query results. In this case,
    you''re likely to miss them in your analysis.


    Any data scientist worth their salt must address many challenges when dealing
    with either the data or the science. SQL takes some of the pressure off when you’re
    dealing with the time-consuming tasks of storing and querying data, saving precious
    time and effort.


    ## Narrowing the Focus with SQL Functions


    When working with SQL commands, you use *functions* to perform tasks, and *arguments*
    to more narrowly specify those tasks. To query a particular set from within your
    data tables, for example, use the `SELECT` function. To combine separate tables
    into one, use the `JOIN` function. To place limits on the data that your query
    returns, use a `WHERE` argument. As I mention earlier in this chapter, fewer than
    20 commands are commonly used in SQL. This section introduces `SELECT`, `FROM`,
    `JOIN`, `WHERE`, `GROUP`, `MAX()`, `MIN()`, `COUNT()`, `AVG()`, and `HAVING`.


    The most common SQL command is `SELECT`. You can use this function to generate
    a list of search results based on designated criteria. To illustrate, imagine
    the film-rating scenario mentioned earlier in this chapter with a tiny database
    of movie ratings that contains the three tables Film, Genre, and Rating.


    To generate a printout of all data `FROM` the Rating table, use the `SELECT` function.
    Any function with `SELECT` is called a *query,* and `SELECT` functions accept
    different arguments to narrow down or expand the data that is returned. An asterisk
    (`*`) represents a wildcard, so the asterisk in `SELECT *` tells the *interpreter*
    (the SQL component that carries out all SQL statements) to show every column in
    the table. You can then use the `WHERE` argument to limit the output to only certain
    values. For example, here is the complete Rating table:


    `Rating timestamp id rating 2011-08-03 16:04:23 1 4 2014-02-19 19:17:16 2 5 2010-04-27
    10:05:36 2 4 2011-04-05 21:21:05 3 4 2014-02-21 00:11:07 3 3`


    If you want to limit your ratings to those made after a certain time, you''d use
    code like the following:


    `SELECT * FROM RatingWHERE Rating.timestamp >= date(''2014-01-01'')timestamp id
    rating2014-02-19 19:17:16 2 52014-02-21 00:11:07 3 3`


    Here, the `DATE()` function turns a string into a date that can then be compared
    with the `timestamp` column.


    You can also use SQL to join columns into a new data table. Joins are made on
    the basis of shared (or compared) data in a particular column (or columns). You
    can execute a join in SQL in several ways, but the ones listed here are probably
    the most popular:


    *   **Inner join:** The default `JOIN` type; returns all records that lie in the
    intersecting regions between the tables being queried


    *   **Outer join:** Returns all records that lie outside the overlapping regions
    between queried data tables


    *   **Full outer join:** Returns all records that lie both inside and outside
    the overlapping regions between queried data tables — in other words, returns
    all records for both tables


    *   **Left join:** Returns all records that reside in the leftmost table


    *   **Right join:** Returns all records that reside in the rightmost table


    ![Remember](images/remember.png)Be sure to differentiate between an inner join
    and an outer join, because these functions handle missing data in different ways.
    As an example of a join in SQL, if you want a list of films that includes genres,
    you use an inner join between the Film and Genre tables to return only the results
    that intersect (overlap) between the two tables.


    To refresh your memory, here are the two tables you''re interested in:


    `Film id title 1 The Even Couple 2 The Fourth Man 3 All About Adam 4 Dr. Yes`


    `Genre id genre 2 Drama 3 Drama 4 Thriller`


    Here’s how you’d use an inner join to find the information you want:


    `SELECT Film.id, Film.title, Genre.genreFROM FilmJOIN Genre On Genre.id=Film.idid
    title genre2 The Fourth Man Drama3 All About Adam Drama4 Dr. Yes Thriller`


    Here, I name specific columns (`Film.title` and `Genre.genre`) after the `SELECT`
    command. I do this to avoid creating a duplicate `id` column in the table that
    results from the `JOIN` — one `id` from the Film table and one `id` from the Genre
    table. Because the default for `JOIN` is inner, and inner joins return only records
    that are overlapping or shared between tables, `Film 1` is omitted from the results
    (because of its missing `Genre` value).


    If you want to return all rows, even ones with `NULL` values, simply do a full
    outer join, like the one shown here:


    `SELECT Film.id, Film.title, Genre.genreFROM FilmFULL JOIN Genre On Genre.id=Film.idid
    title genre1 The Even Couple NULL2 The Fourth Man Drama3 All About Adam Drama4
    Dr. Yes Thriller`


    To aggregate values so that you can figure out the average rating for a film,
    use the `GROUP` statement. (`GROUP` statement commands include `MAX()`, `MIN()`,
    `COUNT()`, or `AVG()`.)


    The following code shows one way you can aggregate values in order to return the
    average rating of each film. The `SELECT` function uses the `AS` statement to
    rename the column to make sure it was properly labeled. The Film and Ratings tables
    had to be joined and, because *Dr. Yes* had no ratings and an inner join was used,
    that film was left out.


    `SELECT Film.title, AVG(rating) AS avg_ratingFROM FilmJOIN Rating On Film.id=Rating.idGROUP
    BY Film.titletitle avg_ratingAll About Adam 3.5The Even Couple 4.0The Fourth Man
    4.5`


    To narrow the results even further, add a `HAVING` clause at the end, as shown
    here:


    `SELECT Film.title, AVG(rating) AS avg_ratingFROM FilmJOIN Rating On Film.id=Rating.idGROUP
    BY Film.titleHAVING avg_rating >= 4title avg_ratingThe Even Couple 4.0The Fourth
    Man 4.5`


    This code limits the data your query returns so you get only records of titles
    that have an average rating greater than or equal to 4.


    ## Making Life Easier with Excel


    Microsoft Excel holds a special place among data science tools. It was originally
    designed to act as a simple spreadsheet. Over time, however, it has become the
    people''s choice in data analysis software. In response to user demands, Microsoft
    has added more and more analysis and visualization tools with every release. As
    Excel advances, so do its data munging and data science capabilities. (*Data munging*
    involves reformatting and rearranging data into more manageable formats that are
    usually required for consumption by other processing applications downstream.)
    Excel includes easy-to-use tools for charting, PivotTables, and macros. It also
    supports scripting in Visual Basic so you can design scripts to automate repeatable
    tasks.'
