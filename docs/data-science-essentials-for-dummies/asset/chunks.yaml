    如果你正在为企业类型人员、工程师、科学家或组织决策者设计数据可视化方案，请保持设计简洁且洗练，使用数据展示或数据叙事类可视化。为了在受众中引发一种逻辑化、严谨的感觉，请包含大量的条形图、散点图和折线图。颜色选择应该较为传统且保守。其外观和感受应当体现出“企业时尚风”（参见图
    8-1）。这种风格的可视化旨在快速、清晰地传达数据正在发生的情况——直接、简洁且要到位。这种风格的最佳数据可视化传达出优雅的外观和感受。


    ![Tip](img/tip.png)如果你正在寻找关于数据可视化和叙事最佳网络应用程序的指导，请务必查看我在[`https://businessgrowth.ai`](https://businessgrowth.ai/)上的*基于网页的数据可视化设计工具：前
    10 指南*。


    ![FIGURE 8-1: 这种设计风格传达出严谨且精确的感觉。](img/9781394297009-fg0801.png)


    FIGURE 8-1: 这种设计风格传达出严谨且精确的感觉。


    ### 激发强烈的情感反应


    如果你正在设计旨在影响或说服他人的数据可视化方案，请融入能够激发目标受众情感反应的设计艺术性。这些可视化通常属于数据艺术类别，但一个极具创意的数据叙事作品也能激发这种强烈的情感反应。具有情感煽性的数据可视化通常支持社会、政治或环境问题某一方的立场。这些数据可视化包含了流动的、艺术化的设计元素，这些元素在流动和蜿蜒，如图
    8-2 所示。此外，丰富且戏剧化的色彩选择可以影响观众的情绪。这种风格的数据可视化为艺术创作和实验留下了大量空间。


    ![Tip](img/tip.png)保持艺术元素的相关性——并识别出它们何时可能会损害你想要留下的印象，特别是当你为分析分析型的人群进行设计时。


    ![FIGURE 8-2: 这种设计风格旨在激发情感反应。](img/9781394297009-fg0802.png)


    FIGURE 8-2: 这种设计风格旨在激发情感反应。


    ## 选择合适的数据图形类型


    你对数据图形类型的选择可能决定一个数据可视化的成败。如果不清楚，`data graphic`是指以视觉格式描绘你的数据洞察的图形元素（参见图 8-3）。大多数数据可视化内部包含一个以上数据图形。


    ![FIGURE 8-3: 数据可视化与数据图形。](img/9781394297009-fg0803.png)


    FIGURE 8-3: 数据可视化与数据图形。


    由于你可能需要代表数据的许多不同方面，你可以在不同的图形类别和类型之间进行混合和搭配。即使在同一类别中，某些图形类型的性能也优于其他类型；因此，创建几个不同的模型以查看哪种图形类型传达的最清晰、最直观的信息是一个好主意。


    ![Warning](img/warning.png)本书仅介绍了最常用的图形类型（在数百种可用类型中）。不要偏离正道太远。你偏离熟悉的图形越远，人们就越难以理解你试图传达的信息。


    ![Remember](img/remember.png)保持艺术元素的相关性——并识别出它们何时可能会损害你想要留下的印象，特别是当你为分析分析型的人群进行设计时。


