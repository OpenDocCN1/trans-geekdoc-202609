    *   包含不重要或无关特征的数据集

    *   包含缺失值的数据集


    为了尽可能简化这一介绍，我将坚持于解释 `k`-NN 分类算法。不过，`k`-NN 涉及的概念有点棘手，因此在深入介绍 `k`-NN 方法之前，我将先向你介绍更简单的平均最近邻居方法。


    ### 了解分类算法


    你可能听说过分类，并认为它和聚类是同一个概念。许多人都是这么想的，但事实并非如此。在`classification` 中，你的数据是有`labeled`的，因此在分析它之前，你已经知道它应该被分为几类。你也已经知道给每个数据点分配哪一类。相比之下，在`clustering`
    方法中，你的数据是未标记的，所以你对划分多少个类合适没有预定义的概念。你必须依靠聚类算法以最合适的方式对数据排序并聚类。


    通过分类算法，你利用对现有标记数据集的了解，生成一个用于分类未来观测值的预测模型。如果你的目标是使用数据集及其已知子集来构建一个模型，以预测未来观测值的分类，你将希望使用分类算法。在实施监督分类时，你已经知道了数据集的`labels`
    —— 即你用于将观测值划分为类别的标准。分类可以帮助你观察数据与数据集预定义类别的拟合程度，从而让你能够构建一个用于分类未来观测值的预测模型。


    图 5-7 展示了按地理区域对世界银行的收入和教育数据集进行分类的情况。


    ![FIGURE 5-7：使用大洲特征对世界银行数据进行分类。](img/9781394297009-fg0507.png)


    图 5-7： 使用大洲特征对世界银行数据进行分类。


    在图 5-7 中，你可以看到某些某些情况下你通过聚类技术识别出的子集确实对应大洲类别，但在其他情况下却并非如此。例如，看看非洲观测值中间那个孤独的亚洲国家。那是不丹。你可以使用此数据集中的数据构建一个模型，来预测新观测值的大洲类别，但如果你引入一个统计数据与不丹相似的新国家数据点，根据你如何定义模型，该国家可能被归类为亚洲洲，也可能被归类为非洲洲。


    现在想象一种情况：原始数据中不包含不丹，而你使用模型来预测不丹作为新数据点所属的大洲。在这种情况下，模型将错误地预测不丹属于非洲洲。这就是`model overfitting`（模型过拟合）的例子——模型紧密地拟合了底层数据集及其噪声或随机误差，以至于模型作为新观测值的预测器时表现糟糕。


    为了避免模型过拟合，请将数据划分为训练集和测试集。典型的比例是将 70% 分给训练集，30% 分给测试集。通过分类算法，你利用对现有标记数据集的了解，生成一个用于分类未来观测值的预测模型。如果你的目标是使用数据集及其已知子集来构建一个模型，以预测未来观测值的分类，你将希望使用分类算法。在实施监督分类时，你已经知道了数据集的`labels`
    —— 即你用于将观测值划分为类别的标准。分类可以帮助你观察数据与数据集预定义类别的拟合程度，从而让你能够构建一个用于分类未来观测值的预测模型。


    ### 使用最近邻分析理解数据


    最近邻方法的核心原理是：获取一个观测值属性（或特征）的值——也称为`attribute value`（属性值），然后找到另一个属性值在数值上与其最接近的观测值。注意，相似性比较可以基于任何定量属性，无论是距离、年龄、收入、体重或其他任何可以描述你所调查观测值的因素。


    '
