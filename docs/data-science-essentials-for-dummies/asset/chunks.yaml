  trans: '


    在接下来的章节中，我将介绍数据科学和数据工程的基础概念，以及机器学习工程师这一混合角色。然后，我将向你展示这些角色在组织数据团队中是如何运作的。


    ### 定义数据科学


    如果`science`（科学）是人们研究和解释自然界发生的特定领域现象的系统方法，那么你可以将`data science`（数据科学）视为专门通过数据分析进行知识的科学领域。


    数据科学家使用数学技术和算法方法为复杂的业务和科学问题寻求解决方案。数据科学从业者利用其预测方法来获取其他方式无法实现的洞察。在商业和科学领域，数据科学方法可以提供更稳健的决策能力：


    *   **在商业领域，**数据科学的目的是为企业和组织提供所需的数据洞察，以优化组织流程，实现效率和收益最大化。

    *   **在科学领域，**数据科学方法被用于得出结果，并为实现特定的科学目标制定方案。


    数据科学是一个庞大且多学科的领域。要称自己为真正的数据科学家，你需要在数学和统计学、计算机编程以及你自己的特定领域领域具备专业知识。


    使用数据科学技能，你可以做以下酷酷的事情：


    *   使用`machine learning`（应用算法从数据中学习并对数据进行自动预测的实践）来优化能源消耗并降低企业的碳足迹。

    *   优化战术策略以实现商业和科学目标。

    *   根据稀疏的环境数据集集预测未知的污染物水平。

    *   设计自动防盗和防欺诈系统，根据算法结果检测异常并触发警报。

    *   为用于土地收购和房地产开发的网站制作推荐引擎。

    *   实施和解释预测性分析和预测技术，以实现业务价值的净增长。


    数据科学家必须具备广泛且多元的定量知识，才能解决这些类型的问题。


    ### 定义机器学习工程师


    `machine learning engineer`（机器学习工程师）本质上是软件工程师，他们在数据科学方面足够熟练，可以在自己所构建的应用中部署先进的数据科学模型，从而将机器学习模型引入到诸如软件即服务（SaaS）产品甚至仅仅是网页等等实时生产环境中。


    与你可能猜测的相反，机器学习工程师的角色是数据科学家和软件工程师之间的混合体，`not`数据工程师。机器学习工程师的核心是一个全能软件工程师，同时在机器学习和人工智能方面拥有坚实的基础。这个人不需要像数据科学家那样了解大量数据科学，但他们在计算机科学和软件开发方面应该比典型的数据科学家了解得多。


    ### 定义数据工程


    如果`engineering`（工程）是利用科学技术设计和构建解决问题的系统的实践，那么你可以将`data engineering`（数据工程）视为工程领域，专门致力于构建和维护数据系统，以克服由于处理海量、高速和多样化数据而产生的数据处理瓶颈和数据处理问题。


    数据工程师使用计算机科学和软件工程技能来设计系统并解决处理和操作数据集的问题。数据工程师通常具有使用（以及设计）实时处理框架以及关系型数据库管理系统（RDBMS）的经验。他们通常使用`Java`、`C++`、`Python`
    或 `Scala` 进行编码。他们知道如何部署`Spark`来处理、加工并精原始数据变为易于管理的数据集。简单来说，对于数据科学而言，数据工程的目的是通过构建贯、模块化且可扩展的数据处理平台来构建大规模数据解决方案，数据科学家随后可以从中得出洞察。


    ![Remember](img/remember.png)

    大多数工程系统都是`built`（构建的）系统——它们是在物理世界中构造或制造的。然而，数据工程不同。它涉及设计、构建和实施解决数据世界问题的软件解决方案——与金门大桥或阿斯旺高水坝的物理现实相比，这个世界看起来很抽象。


    使用数据工程技能，例如你可以：


    *   将数据流水线与公司数据科学家构建的自然语言处理（NLP）服务集成。

    *   构建能够每天处理超过 100 亿次交易的关键任务数据平台。

    *   通过最终将公司数据从旧的本地数据存储环境迁移到尖端云数据仓库来打破数据孤岛。

    *   增强和维护现有的数据基础设施和数据流水线。


    数据工程师需要计算机科学、数据库设计和软件工程方面的扎实技能，才能执行此类类型的工作。


    ### 比较机器学习工程师、数据科学家和数据工程师


    数据科学家、机器学习工程师和数据工程师的角色经常被招聘经理混淆。如果你观察大多数招聘公司的职位描述，你会发现职位与角色往往不匹配，或者简单地期望申请者成为数据技能的“瑞士军刀”，并能够胜任所有工作。


    ![Tip](img/tip.png)

    如果你正在招聘某人来帮助理解你的数据，请确保在撰写职位描述之前明确定义需求。因为数据科学家必须必须具备工作特定领域的领域知识，这种要求通常阻止了数据科学家具备大量的数据工程专业知识。而且，如果你招聘了一个具有数据科学技能的数据工程师，这个人通常对数据领域之外的领域知识并不了解。准备好邀请领域专家（SME）来帮助。


    由于许多组织在数据项目中合并和混淆角色，数据科学家有时被迫学习数据工程师的工作——反之亦然。为了在最短时间内产出质量最高的成果，请聘数据工程师存储、迁移和处理你的数据；聘数据科学家为你分析数据；并聘机器学习工程师将你的机器学习模型引入生产。


    ![Remember](img/remember.png)

    最后，请记住，数据工程师、机器学习工程师和数据科学家只是更大组织结构中的三个小角色。经理、中层员工和业务领导对任何数据驱动计划的成功都起着巨大的作用。


    ## 为数据科学存储和处理数据


    在以下章节中，我将解释云和本地数据存储和处理的基础。


    ### 直接在云端存储数据并进行数据科学


    当你意识到在云端存储数据的积极潜力后，就很难回头了。在云环境中存储数据提供了重大的业务优势：


    *   **更快的上市时间（TTM）：** 许多云服务提供商承担了配置、维护和配置运行在定义系统（也称为`compute environment`）内作业所需的计算资源的大部分工作。这极地提高了易用性，并最终允许数据产品更快地上市。


    '
