- raw: '`>>> array_2d=numpy.arange(8).reshape(2,4)>>> print(array_2d)[[0 1 2 3][4
    5 6 7]]`


    The preceding example is a two-dimensional array, otherwise known as a *2 x 4
    matrix.* The only difference between this and the preceding example is that I
    called the `.reshape` method, and passed in a 2 and a 4 value — telling `numpy`
    to take the array and transform it into a 2 x 4 matrix.


    ![Remember](images/remember.png)Standard matrix notation is *m* × *n*, where *m*
    is the number of rows and *n* specifies the number of columns in the matrix.


    Using the `.arange` and `reshape` method is just one way to create NumPy arrays.
    You can also generate arrays from lists and tuples.


    In the snow dataset that I introduce in the earlier section “[Having fun with
    functions](#c06.xhtml#c06-sec-0012),” I store my snow depth data for different
    locations inside three separate Python lists — one list per month:


    `>>> december_depth=[0,120,140,0,150,80,0,10]>>> january_depth=[20,180,140,0,170,170,30,30]>>>
    february_depth=[0,100,100,40,100,160,40,40]`


    It would be more efficient to have the measurements stored in a better-consolidated
    structure. For example, you can easily put all those lists in a single NumPy array
    by using the following code snippet:


    `>>>depth=numpy.array([december_depth, january_depth,february_depth])>>> print(depth)[[
    0 120 140 0 150 80 0 10][ 20 180 140 0 170 170 30 30][ 0 100 100 40 100 160 40
    40]]`


    Using this structure allows you to pull out certain measurements more efficiently.
    For example, if you wanted to calculate the average of the snow depth for the
    first location in each of the three months, you''d extract the first elements
    of each horizontal row (values 0, 20, and 0, to be more precise). You can complete
    the extraction in a single line of code by taking a slice of the dataset and then
    calculating the mean by way of the NumPy `mean` function. The term *slicing* refers
    to taking a slice out of dataset. Here’s an example:


    `>>> numpy.mean(depth[:,1])133.33333333333334`


    With this code, I’ve instructed the computer to go to column index position 1
    and calculate the mean of the value in that column. The values in the column at
    column index 1 are 120, 180, and 100. When you calculate the mean value of the
    numbers, you get 133.3.


    Beyond using NumPy to extract information from single matrices, you can use it
    to interact with different matrices as well — applying standard mathematical operations
    between matrices, for example, or even applying nonstandard operators, such as
    matrix inversion, summarize, and minimum/maximum operators.


    ![Remember](images/remember.png)Array objects have the same rights as any other
    objects in Python. You can pass them as parameters to functions, set them as class
    attributes, or iterate through array elements to generate random numbers.


    #### Getting up close and personal with the SciPy library


    SciPy ([`https://scipy.org`](https://scipy.org/)) is a collection of mathematical
    algorithms and sophisticated functions that extends the capabilities of the NumPy
    library. The SciPy library adds some specialized scientific functions to Python
    for more specific tasks in data science. To use SciPy’s functions within Python,
    you must first install and import the SciPy library.


    SciPy offers functionalities and algorithms for a variety of tasks, including
    vector quantization, statistical functions, discrete Fourier transform algorithms,
    orthogonal distance regression, airy functions, sparse eigenvalue solvers, maximum
    entropy fitting routines, *n*\-dimensional image operations, integration routines,
    interpolation tools, sparse linear algebra, linear solvers, optimization tools,
    signal-processing tools, sparse matrices, and other utilities that aren’t served
    by other Python libraries. Impressive, right? Yet that’s not even a complete listing
    of the available SciPy utilities. If you’re dying to get hold of a complete list,
    running the following code snippet in Python opens an extensive help module that
    explains the SciPy library:


    `>>> import scipy>>> help(scipy)`


    ![Remember](images/remember.png)You need to first download and install the SciPy
    library before you can use this code.


    The `help` function used in the preceding code snippet returns a script that lists
    all utilities that comprise SciPy and documents all of SciPy''s functions and
    classes. This information helps you understand what’s behind the prewritten functions
    and algorithms that make up the SciPy library.


    ![Tip](images/tip.png)Because SciPy is still under development and, therefore,
    changing and growing, regularly check the `help` function to see what’s changed.


    #### Peeking into the pandas offering


    The pandas library ([`https://pandas.pydata.org`](https://pandas.pydata.org/))
    makes data analysis much faster and easier with its accessible and robust data
    structures. Its precise purpose is to improve Python’s performance with respect
    to data analysis and modeling. It even offers some data visualization functionality
    by integrating small portions of the Matplotlib library. Here are the two main
    pandas data structures:


    *   `Series`: A `Series` object is an array-like structure that can assume either
    a horizontal or vertical dimension. You can think of a pandas `Series` object
    as being similar to one row or one column from a Microsoft Excel spreadsheet.


    *   `DataFrame`: A `DataFrame` object acts like a tabular data table in Python.
    Each row or column in a `DataFrame` can be accessed and treated as its own pandas
    `Series` object.


    Indexing is integrated into both data structure types, making it easy to access
    and manipulate your data. pandas offers functionality for reading in and writing
    out your data, which makes it easy to use for loading, transferring, and saving
    datasets in whatever formats you want. Lastly, pandas offers excellent functionality
    for reshaping data, treating missing values, and removing outliers, among other
    tasks. This makes pandas an excellent choice for data preparation and basic data
    analysis tasks. If you want to carry out more advanced statistical and machine
    learning methods, you''ll need to use the scikit-learn library. The good news
    is that scikit-learn and pandas play well together.


    #### Bonding with Matplotlib for data visualization


    Generally speaking, data science projects usually culminate in visual representations
    of objects or phenomena. In Python, things are no different. After taking baby
    steps (or some not-so-baby steps) with NumPy and SciPy, you can use Python’s Matplotlib
    library ([`https://matplotlib.org`](https://matplotlib.org/)) to create complex
    visual representations of your dataset or data analysis findings. Matplotlib,
    when combined with NumPy and SciPy, creates an excellent environment in which
    to work when solving problems using data science.


    Looking more closely at Matplotlib, I can tell you that it’s a two-dimensional
    plotting library you can use in Python to produce figures from data. You can use
    Matplotlib to produce plots, histograms, scatterplots, and a variety of other
    data graphics. What’s more, because the library gives you full control of your
    visualization’s symbology, line styles, fonts, and colors, you can even use Matplotlib
    to produce publication-quality data graphics.


    ![Remember](images/remember.png)As is the case with all other libraries in Python,
    in order to work with Matplotlib, you first need to install and import the library
    into your script. After you complete those tasks, it’s easy to get started producing
    graphs and charts.


    To illustrate how to use Matplotlib, consider the following NumPy array (which
    I came up with in the “[Saying hello to the NumPy library](#c06.xhtml#c06-sec-0015)”
    section, earlier in this chapter):


    `>>> print(depth)[[ 0 120 140 0 150 80 0 10][ 20 180 140 0 170 170 30 30][ 0 100
    100 40 100 160 40 40]]`


    With the following few lines of code, using just a `for` loop and a Matplotlib
    function — `pyplot` — you can easily plot all measurements in a single graph within
    Python:'
