    \ of Absolute and Relative macros, consider this:\n\n*   **Relative:** Every action\
    \ and movement you make is recorded as relative to the cell that was selected\
    \ when you began the recording. When you run the macro in the future, it will\
    \ run in reference to the cell that’s selected, acting as though that cell were\
    \ the same cell you had initially selected when you recorded the macro.\n\n* \
    \  **Absolute:** After you start recording the macro, every action and movement\
    \ you make is repeated when you run the macro in the future, and those actions\
    \ or movements aren’t made in any relative reference to whatever cell was active\
    \ when you started recording. The macro routine is repeated exactly as you recorded\
