    [FIGURE 7-6:](#c07.xhtml#rc07-fig-0006) Spotting outliers in a tabular dataset
    with color scales.


    ![FIGURE 7-7: Excel XY (scatter) plots provide a simple way to visually detect
    outliers.](images/9781394297009-fg0707.png)


    [FIGURE 7-7:](#c07.xhtml#rc07-fig-0007) Excel XY (scatter) plots provide a simple
    way to visually detect outliers.


    ![FIGURE 7-8: Excel line charts make it easy to visually detect trends in data.](images/9781394297009-fg0708.png)


    [FIGURE 7-8:](#c07.xhtml#rc07-fig-0008) Excel line charts make it easy to visually
    detect trends in data.


    ### Reformatting and summarizing with PivotTables


    Excel developed the PivotTable to make it easier for users to extract valuable
    insights from large sets of spreadsheet data. If you want to generate insights
    by quickly restructuring or reclassifying your data, use a PivotChart. One of
    the main differences between a traditional spreadsheet and a dataset is that spreadsheets
    tend to be wide (with a lot of columns) and datasets tend to be long (with a lot
    of rows). [Figure 7-9](#c07.xhtml#c07-fig-0009) clearly shows the difference between
    a long dataset and a wide spreadsheet.


    ![FIGURE 7-9: A long dataset and a wide spreadsheet.](images/9781394297009-fg0709.png)


    [FIGURE 7-9:](#c07.xhtml#rc07-fig-0009) A long dataset and a wide spreadsheet.


    ![Remember](images/remember.png)A `PivotTable` is a table that’s derived from
    data that sits within a spreadsheet. The pivot allows for grouping, rearrangement,
    display, and summary of the raw data that’s stored within the underlying spreadsheet.


    The way that Excel is designed leads many users to intuitively prefer the wide
    format — which makes sense because it’s a spreadsheet application. To counter
    this preference, however, Excel offers the PivotTable feature so that you can
    quickly convert between long and wide formats. You can also use PivotTables to
    quickly calculate subtotals and summary calculations on your newly formatted and
    rearranged data tables.


    ![Tip](images/tip.png)Creating PivotTables is easy: Just select all cells that
    comprise the table you want to analyze. Then click the PivotTable button on the
    Insert tab. This action opens the Create PivotTable dialog box, where you can
    define where you want Excel to construct the PivotTable. Click OK, and Excel automatically
    generates a PivotField Interface on the page you’ve specified. From this interface,
    you can specify the fields you want to include in the PivotTable and how you want
    them to be laid out.


    The table shown in [Figure 7-10](#c07.xhtml#c07-fig-0010) was constructed using
    the long-format sales performance data shown in [Figure 7-9](#c07.xhtml#c07-fig-0009).
    It’s an example of the simplest possible PivotTable that can be constructed, but
    even at that, it automatically calculates subtotals for each column and those
    subtotals automatically update when you make changes to the data. What’s more,
    PivotTables come with `PivotCharts` — data plots that automatically change when
    you make changes to the PivotTable filters based on the criteria you’re evaluating.


    ![FIGURE 7-10: Creating a wide data table from the long dataset via a PivotTable.](images/9781394297009-fg0710.png)


    [FIGURE 7-10:](#c07.xhtml#rc07-fig-0010) Creating a wide data table from the long
    dataset via a PivotTable.


    ![Tip](images/tip.png)You can do a lot more sophisticated analytical work in Excel
    than just creating PivotTables, although they are handy. On the companion website
    to this book (`https://businessgrowth.ai`](https://businessgrowth.ai/)), I give
    you some basic training in how to use Excel and XLMiner to implement data science
    without needing to touch a single line of code.


    ### Automating Excel tasks with macros


    `Macros` are prescripted routines written in Visual Basic for Applications (VBA).
    You can use macros to decrease the amount of manual processing you need to do
    when working with data in Excel. For example, within Excel, macros can act as
    a set of functions and commands that you can use to automate a wide variety of
    tasks. If you want to save time (and hassle) by automating Excel tasks that you
    routinely repeat, use macros.


    To access macros, first activate Excel’s Developer tab from within the Options
    menu on the File tab. (In other words, after opening the Options menu, choose
    Customize Ribbon from your choices on the left and then click to select the Developer
    check box in the column on the right.) Using the Developer tab, you can record
    a macro, import one that was created by someone else, or code your own in VBA.


    To illustrate macros in action, imagine that you have a column of values and you
    want to insert an empty cell between each one of the values, as shown in [Figure
    7-11](#c07.xhtml#c07-fig-0011). Excel has no easy, out-of-the-box way to make
    this insertion. Using Excel macros, however, you can ask Excel to record you while
    you.


    ![Remember](images/remember.png)Macros have an Absolute mode and a Relative mode.
    The Absolute mode refers to a macro’s routine that runs absolutely the way you
    recorded it. Relative mode macros run the same routine but can be placed in whatever
    cell you need.


    ![Tip](images/tip.png)When you record a macro, it records in Absolute mode by
    default. If you want it to record the macro in Relative mode instead, you need
    to select the Use Relative References option before recording the macro.


    ![FIGURE 7-11: Using a macro to insert empty cells between values.](images/9781394297009-fg0711.png)


    [FIGURE 7-11:](#c07.xhtml#rc07-fig-0011) Using a macro to insert empty cells between
    values.


    For a more formal definition of Absolute and Relative macros, consider this:


    - Relative: Every action and movement you make is recorded as relative to the
    cell that was selected when you began the recording. When you run the macro in
    the future, it will run in reference to the cell that’s selected, acting as though
    that cell were the same cell you had initially selected when you recorded the
    macro.

    - Absolute: After you start recording the macro, every action and movement you
    make is repeated when you run the macro in the future, and those actions or movements
    aren’t made in any relative reference to whatever cell was active when you started
    recording. The macro routine is repeated exactly as you recorded it.


    In the preceding example, the macro was recorded in Relative mode. This enables
    the macro to be run continuously, anywhere, and on top of results from any preceding
    macros run. Because, in this scenario, the macro recorded only one iteration of
    the process, if it had been recorded in Absolute mode, every time it was run the
    macro would have kept adding a space between only the `one` and `two` values.


    ![Warning](images/warning.png)Macro commands aren’t entered into Excel’s Undo
    stack. If you use a macro to change or delete data, you’re stuck with that change.


    ![Tip](images/tip.png)Test your macros first and save your worksheets before using
    them so you can revert to the saved file if something goes wrong.

