    To simplify this introduction as much as possible, I stick to explaining the *k*\-NN
    classification algorithm. The concepts involved in *k*\-NN are a bit tricky, though,
    so first I introduce you to the simpler average nearest neighbor methods before
    going into the *k*\-NN approach.


    ### Getting to know classification algorithms


    You may have heard of classification and thought that it’s the same concept as
    clustering. Many people do, but this isn’t the case. In *classification,* your
    data is *labeled,* so before you analyze it, you already know the number of classes
    into which it should be grouped. You also already know which class you want assigned
    to each data point. In contrast, with *clustering* methods, your data is *unlabeled,*
    so you have no predefined concept of how many clusters are appropriate. You must
    rely on the clustering algorithms to sort and cluster the data in the most appropriate
    way.


    With classification algorithms, you use what you know about an existing labeled
    dataset to generate a predictive model for classifying future observations. If
    your goal is to use your dataset and its known subsets to build a model for predicting
    the categorization of future observations, you’ll want to use classification algorithms.
    When implementing supervised classification, you already know your dataset’s *labels*
    — the criteria you use to subset observations into classes. Classification helps
    you see how well your data fits into the dataset’s predefined classes so that
    you can then build a predictive model for classifying future observations.


    [Figure 5-7](#c05.xhtml#c05-fig-0007) illustrates how it looks to classify the
    World Bank’s Income and Education datasets geographically according to continent.


    ![FIGURE 5-7: Using the Continent feature to classify World Bank data.](images/9781394297009-fg0507.png)


    [FIGURE 5-7:](#c05.xhtml#rc05-fig-0007) Using the Continent feature to classify
    World Bank data.


    In [Figure 5-7](#c05.xhtml#c05-fig-0007), you can see that, in some cases, the
    subsets you may identify with a clustering technique do correspond to the Continent
    category, but in other cases, they don’t. For example, look at the lone Asian
    country in the middle of the African observations. That’s Bhutan. You could use
    the data in this dataset to build a model that would predict a Continent class
    for incoming observations, but if you introduced a data point for a new country
    that showed statistics similar to those of Bhutan, the new country could be categorized
    as being part of either the Asian continent or the African continent, depending
    on how you define your model.


    Now imagine a situation in which the original data doesn’t include Bhutan and
    you use the model to predict Bhutan’s continent as a new data point. In this scenario,
    the model would incorrectly predict that Bhutan is part of the African continent.
    This is an example of *model overfitting* — a situation in which a model is so
    tightly fit to its underlying dataset, as well as its noise or random error, that
    the model performs poorly as a predictor for new observations.


    To avoid overfitting your models, divide the data into a training set and a test
    set. A typical ratio is to assign 70 percent (or more) of the data to the training
    set and the remaining 30 percent to the test set. Build your model with the training
    set, and then use the test set to evaluate the model by pretending that the test
    set observations are unknown. You can evaluate the accuracy of your model by comparing
    the classes assigned to the test set observations to the true classes of these
    observations.


    Model overgeneralization can also be a problem. *Overgeneralization* is the opposite
    of overfitting: If you don’t train a machine learning model enough, it will be
    underfit. As a result, it will make inaccurate, overly general predictions. Naturally,
    it follows that overly general models end up assigning every class a low degree
    of confidence. To illustrate model overgeneralization, consider again the World
    Bank Income and Education datasets. If the model used the presence of Bhutan to
    cast doubt on every new data point in its nearby vicinity, you’d end up with a
    wishy-washy model that treats all nearby points as African, but with a low probability.
    This model would be a poor predictive performer.


    I can illustrate a good metaphor for overfitting and overgeneralization by using
    this well-known maxim:


    > If it walks like a duck and talks like a duck, then it’s a duck.


    Overfitting would turn the maxim into this statement:


    > It’s a duck if, and only if, it walks and quacks exactly in the ways that I
    have personally observed a duck to walk and quack. Because I’ve never observed
    the way an Australian spotted duck walks and quacks, an Australian spotted duck
    must not really be a duck at all.


    In contrast, overgeneralization would say:


    > If it moves around on two legs and emits any high-pitched, nasal sound, it’s
    a duck. Therefore, Fran Fine, who was Fran Drescher’s character in the 1990s American
    sitcom *The Nanny,* must be a duck.


    ![Remember](images/remember.png)Be aware of the constant danger of overfitting
    and overgeneralization. Find a happy medium between the two.


    When classifying data, keep these two points in mind:


    *   **Model predictions are only as good as the model’s underlying data.** In
    the World Bank data example, it could be the case that, if other factors such
    as life expectancy or energy use per capita were added to the model, its predictive
    strength would increase.


    *   **Model predictions are only as good as the categorization of the underlying
    dataset.** For example, what do you do with countries, like Russia, that span
    two continents? Do you distinguish North Africa from sub-Saharan Africa? Do you
    lump North America in with Europe because they tend to share similar features?
    Do you consider Central America to be part of North America or South America?


    ## Making Sense of Data with Nearest Neighbor Analysis


    At their core, nearest neighbor methods work by taking the value of an observation’s
    attribute (or feature) — also called an *attribute value* — and then locating
    another observation whose attribute value is numerically nearest to it. Because
    the nearest neighbor technique is a classification method, you can use it to perform
    tasks as scientifically oriented as deducing the molecular structure of a vital
    human protein or uncovering key biological evolutionary relationships or as business-driven
    as designing recommendation engines for e-commerce sites or building predictive
    models for consumer transactions. The applications are limitless.


    A good analogy for the nearest neighbor concept is illustrated in GPS technology.
    Imagine that you’re in desperate need of a Starbucks iced latte but you have no
    idea where the nearest store is located. What to do? One easy solution is simply
    to ask your smartphone where the nearest Starbucks is located.


    When you do that, the system looks for businesses named Starbucks within a reasonable
    proximity of your current location. After generating a results listing, the system
    reports back to you with the address of the Starbucks coffeehouse closest to your
    current location — the one that is your nearest neighbor, in other words.


    As the term *nearest neighbor* implies, the primary purpose of a nearest neighbor
    analysis is to examine your dataset and find the observation that’s quantitatively
    most similar to your observation. Note that similarity comparisons can be based
    on any quantitative attribute, whether that is distance, age, income, weight,
    or any other factor that can describe the observation you’re investigating. The
    simplest comparative attribute is distance.'
