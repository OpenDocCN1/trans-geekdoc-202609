    ## 1. 头脑风暴。


    思考受众中的一个特定成员，并尽可能对那个人的动机做出合理的推测。


    ![Tip](img/tip.png)给这个（想象中的）观众成员起一个名字和几个其他识别特征。我总是想象一个名为 `Eve` 的 45 岁离异双母亲。


    ## 2. 定义你的视化目的。


    通过决定你具体希望受众根据可视化结果采取什么行动或获得什么结果，来缩小可视化的目的。


    ## 3. 选择功能性设计。


    回顾三种主要的数据可视化类型（在本章前面已讨论），并决定哪种类型能最好帮助你实现预期目标。


    以下章节将详细说明这一过程。


    ### 步骤 1：头脑风暴（关于关于 Eve）


    要进行正确的头脑风暴，请拿一张纸，想象一个虚拟的观众成员——例如“Eve”。让我们一起练习创建一个更有功能性、更有效的数据可视化方案。你首先需要回答关于 `Eve`
    的更重要的问题，以便更好地理解她，从而更好地理解并为你的目标受众设计。


    首先构思 `Eve` 典型的一天是什么样子的——她早上起床后做什么，午餐时间在做什么，以及她的工作环境是种样的。还要考虑 `Eve` 如何使用你的可视化结果。这些内容能让你了解一些关于她的`心理特征`（驱动她高层次需求和欲望的心理特征）。


    为了更全面地了解 `Eve` 是谁以及你如何最好地满足她的需求，你可以从以下问题库中提取信息：


    *   `Eve` 在哪里工作？她的职业是什么？

    *   她拥有什么种技术教育或经验（如果有的话）？

    *   `Eve` 多大了？她结婚了吗？她有孩子吗？她长什么样？她住在哪里？

    *   哪些社会、政治、事业相关或专业问题对 `Eve` 很重要？她如何看待自己？

    *   `Eve` 每天必须处理哪些问题和挑战？

    *   你的数据可视化如何帮助解决 `Eve` 的工作问题或家庭问题？它如何提高她的自尊心？

    *   你将通过什么途径向 `Eve` 展示可视化结果（例如，通过互联网或在员工会议上）？

    *   `Eve` 需要能够用你的数据可视化做什么？


    因为我们是在一起操作，我会通过为你回答这些问题：`Eve` 是欧尔文县区分区部门的经理。她 45 岁，是一个离异的母亲，两个孩子即将上大学。她对当地政治有深厚兴趣，最终想进入县委员会董事会。为了获得那个职位，她必须在她的县管理简历上增加一些重大的“含金量”。`Eve`
    的大部分价值感来自于她的工作以及她为部门做出良好管理决策的敏锐能力。


    到目前为止，`Eve` 被迫根据她的直觉来管理部门，并由几份零散的业务系统报告支持。她并不擅长分析，但她足够的知识来理解她看到的内容。问题在于 `Eve`
    缺乏所需的可视化工具来展示她应该考虑的所有相关数据。她既没有时间也没有技能。


    ### 步骤 2：定义目的


    在对受众进行头脑风暴后（见前一节），你可以很容易地确定你正试图实现的的目标。回到 `Eve` 身上——因为她并不擅长分析，而且她依赖你来做出有效的决策。


    ### 步骤 3：选择最具功能性的设计


    记住，你有三种主要的可视化类型供选择：`data storytelling`、`data art` 和 `data showcasing`。记住，如果你是为决策者设计，你最可能使用
    `data storytelling` 来直接告诉受众数据的含义。如果你是为社会正义组织或政治竞选设计，`data art` 能最好表达观点。最后，如果你是为分析师、工程师或统计学家设计，请坚持使用
    `data showcasing`，让这些人员有足够的空间来发现问题。


    回到 `Eve`——因为她并不擅长分析，而且她依赖你来做出有效的决策，你需要运用 `data storytelling` 技术。创建一个带有某些背景但不过多背景的静态或交互式数据可视化。设计的视觉元素应该讲述一个关于她部门的清晰故事，使得
    `Eve` 不需要费力处理大量的复杂性就能理解你想传达给她的观点。


    '
