- raw: "*   **Point:** Composed of spatial data that is plotted out according to specific\
    \ point locations, a point map (see [Figure 8-22](#c08.xhtml#c08-fig-0022)) presents\
    \ data in a graphical point form rather than in a polygon, line, or raster surface\
    \ format.\n\n*   **Raster surface:** A raster surface map (see [Figure 8-23](#c08.xhtml#c08-fig-0023))\
    \ can be anything from a satellite image map to a surface coverage with values\
    \ that have been interpolated from underlying spatial data points.\n\n![Tip](images/tip.png)For\
    \ a training on how to make maps from data using QGIS, an open-source geographic\
    \ information system (GIS) application, visit [`https://businessgrowth.ai`](https://businessgrowth.ai/).\n\
    \n![Source: Lynda.com, Python for DS ¶ FIGURE 8-21: A Cloropleth map.](images/9781394297009-fg0821.png)\n\
    \nSource: [`Lynda.com`](http://Lynda.com), Python for DS ¶ [FIGURE 8-21:](#c08.xhtml#rc08-fig-0021)\
    \ A Cloropleth map.\n\n![FIGURE 8-22: A point map.](images/9781394297009-fg0822.png)\n\
    \n[FIGURE 8-22:](#c08.xhtml#rc08-fig-0022) A point map.\n\n![Remember](images/remember.png)Whether\
    \ you’re a data visualization designer or a consumer, be aware of some common\
    \ pitfalls in data visualization. Simply put, a data visualization can be misleading\
    \ if it isn’t constructed correctly. Common problems include pie charts that don’t\
    \ add up to 100 percent, bar charts with a scale that starts in a strange place,\
    \ and multicolumn bar charts with vertical axes that don’t match.\n\n![FIGURE\
    \ 8-23: A raster surface map.](images/9781394297009-fg0823.png)\n\n[FIGURE 8-23:](#c08.xhtml#rc08-fig-0023)\
    \ A raster surface map.\n\n## Testing Data Graphics\n\nYour data visualizations\
    \ must convey clear and powerful visual messages. To make that happen, you have\
    \ to test various data graphics and select only the most effective ones to include\
    \ in the final data visualization. For example, the two data graphics shown in\
    \ [Figure 8-24](#c08.xhtml#c08-fig-0024) represent exactly the same statistic.\n\
    \n ![FIGURE 8-24: Here you see the importance of selecting effective data graphics.](images/9781394297009-fg0824.png)\n\
    \n[FIGURE 8-24:](#c08.xhtml#rc08-fig-0024) Here you see the importance of selecting\
    \ effective data graphics.\n\nNotice how the data graphic on the right does a\
    \ much better job of visually emphasizing the difference in numeric values? You\
    \ should always test different data graphics, to make sure that you use the one\
    \ that most clearly and effectively displays your data. The graphic on the left\
    \ is *not* effective. To choose only the most effective data graphics for inclusion\
    \ in your data visualization, simply follow these four steps:\n\n1.  **Make a\
    \ list of the questions that your data is meant to answer.**\n\n2.  **Determine\
    \ the data visualization type: data storytelling, data showcasing, or data art.**\n\
    \n3.  **Select options from among appropriate data graphic types for that type\
    \ of data visualization.**\n\n4.  **Test those data graphics with your data —\
    \ see for yourself which graphic type displays the most clear and obvious answers\
    \ to your questions.**\n\n![Tip](images/tip.png)After testing different data graphics\
    \ and deciding what you want to use, arrange those graphics within your data visualization.\
    \ You can do that using either Python or R or a spreadsheet (see [Chapter 6](#c06.xhtml)).\
    \ Alternatively, to create your data visualization using an online data visualization\
    \ design tool, you may find my guide helpful: *Web-Based Data Visualization Design\
    \ Tools — Top 10.* You can find it at [`https://businessgrowth.ai`](https://businessgrowth.ai/).\n\
    \n## Adding Context\n\nAfter you know exactly which data graphics you’ll use,\
    \ you need to decide whether and how you’ll create the necessary context to add\
    \ more meaning to the data visualization. Adding context helps people understand\
    \ the value and relative significance of the information your data visualization\
    \ conveys. Adding context to calculating, exacting data visualization styles helps\
    \ to create a sense of relative perspective, but in pure data art you may consider\
    \ omitting additional context. That’s because, with data art, you’re only trying\
    \ to make a single point and you don’t want to add information that would distract\
    \ from that point.\n\n### Creating context with data\n\nIn data showcasing, you\
    \ should include relevant contextual data for the key metrics shown in your data\
    \ visualization — in a situation where you’re creating a data visualization that\
    \ describes conversion rates for e-commerce sales, for example. The key metric\
    \ would be represented by the percentage of users who convert to customers by\
    \ making a purchase. Contextual data that’s relevant to this metric may include\
    \ shopping cart abandonment rates, average number of sessions before a user makes\
    \ a purchase, average number of pages visited before making a purchase, or specific\
    \ pages that are visited before a customer decides to convert. This sort of contextual\
    \ information helps viewers understand the why and how behind sales conversions.\n\
    \n![Remember](images/remember.png)Adding contextual data tends to decentralize\
    \ the focus of a data visualization, so add this data only in visualizations that\
    \ are intended for an analytical audience. These folks are in a better position\
    \ to assimilate the extra information and use it to draw their own conclusions;\
    \ with other types of audiences, context is only a distraction.\n\n### Creating\
    \ context with annotations\n\nSometimes, you can more appropriately create context\
    \ by including annotations that provide a header and a small description of the\
    \ context of the data that’s shown (see [Figure 8-25](#c08.xhtml#c08-fig-0025)).\
    \ This method of creating context is most appropriate for data storytelling or\
    \ data showcasing. Good annotation is helpful to both analytical and nonanalytical\
    \ audiences alike.\n\n### Creating context with graphical elements\n\nAnother\
    \ effective way to create context in a data visualization is to include graphical\
    \ elements that convey the relative significance of the data. Such graphical elements\
    \ include moving average trend lines, single-value alerts, target trend lines\
    \ (as shown in [Figure 8-26](#c08.xhtml#c08-fig-0026)), and predictive benchmarks.\n\
    \n![Source: Lynda.com, Python for DS ¶ FIGURE 8-25: Using annotation to create\
    \ context.](images/9781394297009-fg0825.png)\n\nSource: [`Lynda.com`](http://Lynda.com),\
    \ Python for DS ¶ [FIGURE 8-25:](#c08.xhtml#rc08-fig-0025) Using annotation to\
    \ create context.\n\n![FIGURE 8-26: Using graphical elements to create context.](images/9781394297009-fg0826.png)\n\
    \n[FIGURE 8-26:](#c08.xhtml#rc08-fig-0026) Using graphical elements to create\
    \ context.\n\nChapter 9\n\n# Ten Free or Low-Cost Data Science Libraries and Platforms\n\
    \nIN THIS CHAPTER\n\n![Bullet](images/check.png)**Using open-source tools for\
    \ scraping, collecting, and handling data**\n\n![Bullet](images/check.png)**Exploring\
    \ your data with free open-source platforms**\n\n![Bullet](images/check.png)**Getting\
    \ creative with free and low-cost data visualization tools**\n\n![Bullet](images/check.png)**Having\
    \ fun with infographics**\n\nBecause data collection, analysis, and visualization\
    \ comprise the crux of the data scientist’s toolkit, it should come as no surprise\
    \ that you can use quite a few free libraries, tools, and platforms to carry out\
    \ these tasks with greater ease. In this chapter, I present ten free or low-cost\
    \ applications you can use to complete data science tasks.\n\n![Tip](images/tip.png)For\
    \ a little extra guidance on how to use the Python libraries discussed in this\
    \ chapter, check out my LinkedIn Learning courses, available at [`www.linkedin.com/learning/instructors/lillian-pierson-p-e`](https://www.linkedin.com/learning/instructors/lillian-pierson-p-e).\n\
    \n## Scraping the Web with Beautiful Soup"
