- raw: '![Remember](images/remember.png)Even though *k*\-NN is among the simplest
    and most easy-to-implement classification methods, it nevertheless yields competitive
    results when compared to some of the more sophisticated machine learning methods.
    Probably because of its simplicity and the competitive results it provides, the
    *k*\-NN algorithm has been ranked among the top ten most influential data mining
    algorithms by the academic research community.


    ### Understanding how the k-nearest neighbor algorithm works


    To use *k*\-NN, you simply need to pick a query point — usually called *P* — in
    the sample dataset and then compute the *k*\-nearest neighbors to this point.
    The query point *P* is classified with a label that’s the same as the label of
    most *k*\-nearest points that surround it. ([Figure 5-10](#c05.xhtml#c05-fig-0010)
    gives a bird’s-eye view of the process.)


    ![Remember](images/remember.png)*k*\-nearest neighbors are quantified by either
    distance or similarity based on another quantitative attribute.


    Consider the following example: A dataset is given by \[1, 1, 4, 3, 5, 2, 6, 2,
    4\], and point *P* is equal to 5. [Figure 5-10](#c05.xhtml#c05-fig-0010) shows
    how *k*\-NN would be applied to this dataset. By specifying that *k* is equal
    to 3, the figure shows that, based on distance, there are three nearest neighbors
    to the point 5. Those neighbors are 4, 4, and 6. So, based on the *k*\-NN algorithm,
    query point *P* will be classified as 4 because 4 is the majority number in the
    *k* number of points nearest to it. Similarly, *k*\-NN continues defining other
    query points using the same majority principle.


    ![Remember](images/remember.png)When using *k*\-NN, it’s crucial to choose a *k*
    value that minimizes *noise* (unexplainable random variation). At the same time,
    you must choose a *k* value that includes sufficient data points in the selection
    process. If the data points aren’t uniformly distributed, it’s generally harder
    to predetermine a good *k* value. Be careful to select an optimum *k* value for
    each dataset you’re analyzing.


    ![FIGURE 5-10: How k-NN works.](images/9781394297009-fg0510.png)


    [FIGURE 5-10:](#c05.xhtml#rc05-fig-0010) How *k*\-NN works.


    ![Tip](images/tip.png)Large *k* values tend to produce less noise and more *boundary
    smoothing* (clearer definition and less overlap) between classes than small *k*
    values do.


    ### Knowing when to use the k-nearest neighbor algorithm


    *k*\-NN is particularly useful for *multi-label learning* — supervised learning
    where the algorithm is applied so that it automatically *learns from* (detects
    patterns in) multiple sets of instances. Each of these sets could potentially
    have several classes of its own. With multi-label learning, the algorithm learns
    to predict multiple class labels for each new instance it encounters.


    The problem with *k*\-NN is that it takes a lot longer than other classification
    methods to classify a sample. Nearest neighbor classifier performance depends
    on calculating the distance function, as well as on the value of the neighborhood
    parameter *k*. You can try to speed things up by specifying optimal values for
    *k* and *n*.


    ### Exploring common applications of k-nearest neighbor algorithms


    *k*\-NN is often used for internet database management purposes. In this capacity,
    *k*\-NN is useful for website categorization, web page ranking, and other user
    dynamics across the web.


    *k*\-NN classification techniques are also quite beneficial in *customer relationship
    management* (CRM), a set of processes that ensure a business sustains improved
    relationships with its clients while simultaneously experiencing increased business
    revenues. Most CRM systems gain tremendous benefit from using *k*\-NN to data-mine
    customer information to find patterns that are useful in boosting customer retention.


    The method is so versatile that even if you’re a small-business owner or a marketing
    department manager, you can easily use *k*\-NN to boost your own marketing return
    on investment. Simply use *k*\-NN to analyze your customer data for purchasing
    patterns, and then use those findings to customize marketing initiatives so that
    they’re more exactly targeted for your customer base.


    ## Solving Real-World Problems with Nearest Neighbor Algorithms


    Nearest neighbor methods are used extensively to understand and create value from
    patterns in retail business data. In the following sections, I present two powerful
    cases where *k*\-NN and average-NN algorithms are being used to simplify management
    and security in daily retail operations.


    ### Seeing k-nearest neighbor algorithms in action


    Techniques associated with k-nearest neighbor algorithms are often used for theft
    prevention in the modern retail business. Of course, you’re accustomed to seeing
    closed-circuit television (CCTV) cameras around almost every store you visit,
    but most people have no idea how the data gathered from these devices is being
    used.


    Maybe you imagine someone in the back room resolutely monitoring these cameras
    for suspicious activity for hours at a time — and maybe that *is* how things were
    done in the past. But today a modern surveillance system is intelligent enough
    to analyze and interpret video data on its own, without the need for human assistance.
    The modern systems can now use *k*\-nearest neighbor for visual pattern recognition
    to scan and detect hidden packages in the bottom bin of a shopping cart at checkout.
    If an object is detected that is an exact match with an object listed in the database,
    the price of the spotted product can even automatically be added to the customer’s
    bill. Though this automated billing practice isn’t used extensively now, the technology
    has been developed and is available for use.


    Retail stores also use *k*\-nearest neighbor to detect patterns in credit card
    use. Many new transaction-scrutinizing software applications use *k*\-NN algorithms
    to analyze register data and spot unusual patterns that indicate suspicious activity.
    For example, if register data indicates that a lot of customer information is
    being entered manually rather than by automated scanning and swiping, it can indicate
    that the employee who’s using that register is stealing a customer’s personal
    information. Or, if register data indicates that a particular good is being returned
    or exchanged multiple times, it can indicate that employees are misusing the return
    policy or trying to make money from making fake returns.


    ### Seeing average nearest neighbor algorithms in action


    Average nearest neighbor algorithm classification and point pattern detection
    can be used in grocery retail to identify key patterns in customer purchasing
    behavior, and subsequently increase sales and customer satisfaction by anticipating
    customer behavior. Consider the following story.


    As with other grocery stores, buyer behavior at (the fictional) Waldorf Food Co-op
    tends to follow fixed patterns. Managers have even commented on the odd fact that
    members of a particular age group tend to visit the store during the same particular
    time window, and they even tend to buy the same types of products. One day, Manager
    Mike became extremely proactive and decided to hire a data scientist to analyze
    customer data and provide exact details about some recent trends that were noticeably
    odd. Data Scientist Danielle got in there and quickly uncovered a pattern among
    employed middle-aged male adults: They tended to visit the grocery store only
    during the weekends or at the end of the day on weekdays, and if they entered
    the store on a Thursday, they almost always bought beer.


    Armed with these facts, Manager Mike quickly used this information to maximize
    beer sales on Thursday evenings by offering discounts, bundles, and specials.
    Not only was the store owner happy with the increased revenues, but Waldorf Food
    Co-op’s male customers were also happy because they got more of what they wanted,
    when they wanted it.


