- raw: "If you’re designing a data visualization for corporate types, engineers, scientists,\
    \ or organizational decision-makers, keep the design simple and sleek, using the\
    \ data showcasing or data storytelling visualization. To induce a logical, calculating\
    \ feel in your audience, include a lot of bar charts, scatterplots, and line charts.\
    \ Color choices here should be rather traditional and conservative. The look and\
    \ feel should scream “corporate chic” (see [Figure 8-1](#c08.xhtml#c08-fig-0001)).\
    \ Visualizations of this style are meant to quickly and clearly communicate what’s\
    \ happening in the data — direct, concise, and to the point. The best data visualizations\
    \ of this style convey an elegant look and feel.\n\n![Tip](images/tip.png)If you’re\
    \ looking for guidance on the best web applications for data visualization and\
    \ storytelling, be sure to check out my *Web-Based Data Visualization Design Tools:\
    \ Top 10 Guide* at [`https://businessgrowth.ai`](https://businessgrowth.ai/).\n\
    \n![FIGURE 8-1: This design style conveys a calculating and exacting feel.](images/9781394297009-fg0801.png)\n\
    \n[FIGURE 8-1:](#c08.xhtml#rc08-fig-0001) This design style conveys a calculating\
    \ and exacting feel.\n\n### Eliciting a strong emotional response\n\nIf you’re\
    \ designing a data visualization to influence or persuade people, incorporate\
    \ design artistry that invokes an emotional response in your target audience.\
    \ These visualizations usually fall under the data art category, but an extremely\
    \ creative data storytelling piece can also inspire this sort of strong emotional\
    \ response. Emotionally provocative data visualizations often support the stance\
    \ of one side of a social, political, or environmental issue. These data visualizations\
    \ include fluid, artistic design elements that flow and meander, as shown in [Figure\
    \ 8-2](#c08.xhtml#c08-fig-0002). Additionally, rich, dramatic color choices can\
    \ influence the emotions of the viewer. This style of data visualization leaves\
    \ a lot of room for artistic creativity and experimentation.\n\n![Tip](images/tip.png)Keep\
    \ artistic elements relevant — and recognize when they’re likely to detract from\
    \ the impression you want to make, particularly when you’re designing for analytical\
    \ types.\n\n![FIGURE 8-2: This design style is intended to evoke an emotional\
    \ response.](images/9781394297009-fg0802.png)\n\n[FIGURE 8-2:](#c08.xhtml#rc08-fig-0002)\
    \ This design style is intended to evoke an emotional response.\n\n## Selecting\
    \ the Appropriate Data Graphic Type\n\nYour choice of data graphic type can make\
    \ or break a data visualization. In case it’s unclear, a *data graphic* is the\
    \ graphical element that depicts your data insight in visual format (see [Figure\
    \ 8-3](#c08.xhtml#c08-fig-0003)). Most data visualizations have more than one\
    \ data graphic within them.\n\n ![FIGURE 8-3: Data visualization versus data graphics.](images/9781394297009-fg0803.png)\n\
    \n[FIGURE 8-3:](#c08.xhtml#rc08-fig-0003) Data visualization versus data graphics.\n\
    \nBecause you probably need to represent many different facets of your data, you\
    \ can mix and match among the different graphical classes and types. Even among\
    \ the same class, certain graphic types perform better than others; therefore,\
    \ it’s a good idea to create several different mockups to see which graphic type\
    \ conveys the clearest and most obvious message.\n\n![Warning](images/warning.png)This\
    \ book introduces only the most commonly used graphic types (among hundreds that\
    \ are available). Don’t wander too far off the beaten path. The further you stray\
    \ from familiar graphics, the harder it becomes for people to understand the information\
    \ you’re trying to convey.\n\n![Remember](images/remember.png)Pick the graphic\
    \ type that most dramatically displays the data trends you’re seeking to reveal.\
    \ ([Figure 8-4](#c08.xhtml#c08-fig-0004) lists some general guidelines.) You can\
    \ display the same data trend in many ways, but some methods deliver a visual\
    \ message more effectively than others. The point is to deliver a clear, comprehensive\
    \ visual message to your audience so people can use the visualization to help\
    \ them make sense of the data presented.\n\n![FIGURE 8-4: Types of data graphics,\
    \ broken down by audience and data visualization type.](images/9781394297009-fg0804.png)\n\
    \n[FIGURE 8-4:](#c08.xhtml#rc08-fig-0004) Types of data graphics, broken down\
    \ by audience and data visualization type.\n\nAmong the most useful types of data\
    \ graphics are standard chart graphics, comparative graphics, statistical plots,\
    \ topology structures, and spatial plots and maps. The next few sections take\
    \ a look at each of these types.\n\n### Standard chart graphics\n\nWhen making\
    \ data visualizations for an audience of nonanalytical people, stick to standard\
    \ chart graphics. The more complex your graphics, the harder it is for nonanalytical\
    \ people to understand them. And not all standard chart types are boring. You\
    \ have quite a variety to choose from:\n\n*   **Area charts** (see [Figure 8-5](#c08.xhtml#c08-fig-0005))\
    \ are a fun-yet-simple way to visually compare and contrast attribute values.\
    \ You can use this type of chart to effectively tell a visual story when you’ve\
    \ chosen data storytelling and data showcasing. Not all area charts are 3-D, like\
    \ the one shown in [Figure 8-5](#c08.xhtml#c08-fig-0005), but they all represent\
    \ numerical values by the proportion of area those values consume visually on\
    \ the chart. ![Source: Lynda.com, Python for DS ¶ FIGURE 8-5: An area chart in\
    \ three dimensions.](images/9781394297009-fg0805.png)\n\n    Source: [`Lynda.com`](http://Lynda.com),\
    \ Python for DS ¶ [FIGURE 8-5:](#c08.xhtml#rc08-fig-0005) An area chart in three\
    \ dimensions.\n\n*   **Bar charts** (see [Figure 8-6](#c08.xhtml#c08-fig-0006))\
    \ are a simple way to visually compare and contrast values of parameters in the\
    \ same category. Bar charts are best for data storytelling and data showcasing.\n\
    \n*   **Line charts** (see [Figure 8-7](#c08.xhtml#c08-fig-0007)) most commonly\
    \ show changes in time series data, but they can also plot relationships between\
    \ two, or even three, parameters. Line charts are so versatile that you can use\
    \ them in all data visualization design types.\n\n*   **Pie charts** (see [Figure\
    \ 8-8](#c08.xhtml#c08-fig-0008)), which are among the most commonly used, provide\
    \ a simple way to compare values of parameters in the same category. Their simplicity,\
    \ however, can be a double-edged sword; deeply analytical people tend to scoff\
    \ at them, precisely because they seem so simple, so you may want to consider\
    \ omitting them from data-showcasing visualizations.\n\n ![FIGURE 8-6: A bar chart\
    \ showing the area of U.S. states by their acreage, in thousand acres.](images/9781394297009-fg0806.png)\n\
    \n[FIGURE 8-6:](#c08.xhtml#rc08-fig-0006) A bar chart showing the area of U.S.\
    \ states by their acreage, in thousand acres.\n\n![Source: Lynda.com, Python for\
    \ DS ¶ FIGURE 8-7: A line chart.](images/9781394297009-fg0807.png)\n\nSource:\
    \ [`Lynda.com`](http://Lynda.com), Python for DS ¶ [FIGURE 8-7:](#c08.xhtml#rc08-fig-0007)\
    \ A line chart.\n\n![Source: Lynda.com, Python for DS ¶ FIGURE 8-8: A pie chart.](images/9781394297009-fg0808.png)\n\
    \nSource: [`Lynda.com`](http://Lynda.com), Python for DS ¶ [FIGURE 8-8:](#c08.xhtml#rc08-fig-0008)\
    \ A pie chart.\n\n### Comparative graphics\n\nA *comparative graphic* displays\
    \ the relative value of multiple parameters in a shared category or the relatedness\
    \ of parameters within multiple shared categories. The core difference between\
    \ comparative graphics and standard graphics is that comparative graphics offer\
    \ you a way to simultaneously compare more than one parameter and category. Standard\
    \ graphics, on the other hand, provide a way to view and compare only the difference\
    \ between one parameter of any single category. Comparative graphics are geared\
    \ toward an audience that’s at least slightly analytical, so you can easily use\
    \ these graphics in either data storytelling or data showcasing. Visually speaking,\
    \ comparative graphics are more complex than standard graphics."
