    ### Keeping cool with classes


    *Classes* are blocks of code that put together functions and variables to produce
    other objects. As such, they’re slightly different from functions, which take
    an input and produce an output. The set of functions and classes tied together
    inside a class describes the blueprint of a certain object. In other words, classes
    spell out what has to happen in order for an object to be created. After you come
    up with a class, you can generate the actual object instance by calling a class
    instance. In Python, this is referred to as *instantiating* an object (creating
    an instance of that class).


    ![Remember](images/remember.png)Functions that are created inside a class are
    called *methods,* and variables within a class are called *attributes.* Methods
    describe the actions that generate the object, and attributes describe the actual
    object properties.


    To better understand how to use classes for more efficient data analysis, consider
    the following scenario: Imagine that you have snow depth data from different locations
    and times and you’re storing it online on an FTP server. The dataset contains
    different ranges of snow depth data, depending on the month of the year. Now imagine
    that every monthly range is stored in a different location on the FTP server.


    Your task is to use Python to fetch all monthly data and then analyze the entire
    dataset, so you need to use different operations on the data ranges. First, you
    need to download the data from within Python by using an FTP handling library,
    such as `ftplib`. Then, to be able to analyze the data in Python, you need to
    store it in proper Python data types (in lists, tuples, or dictionaries, for example).
    After you fetch the data and store it as recognizable data types in a Python script,
    you can then apply more advanced operations that are available from specialized
    libraries such as NumPy, SciPy, pandas, Matplotlib, and scikit-learn.


    In this scenario, you would want to create a class that creates a list containing
    the snow depth data for each month. Every monthly list would be an object instance
    generated by the class. The class itself would tie together the FTP downloading
    functions and the functions that store the downloaded records inside the lists.
    You could then instantiate the class for as many months as you need in order to
    carry out a thorough analysis. Here''s the code to do something like this:


    `import ftplibclass Download: def __init__(self,site,dir,ftp=None,fileList=[]):
    self.ftp =ftp self.site=site self.dir=dir self.fileList=fileList self.login_ftp()
    self.fileList = self.store_in_list() def Login_ftp(self): self.ftp=ftplib.FTP(self.site)
    self.ftp.login() def store_in_list(self): self.fileList = [] self.ftp.cwd("/")
    self.ftp.cwd(self.dir) self.ftp.retrlines(''NLST'', self.fileList.append) return
    self.fileList`


    Defining a class probably looks intimidating right now, but I simply want to give
    you a feeling for the basic structure and point out the class methods involved.


    Delving into the preceding code, the keyword `class` defines the class, and the
    keyword `def` defines the class methods. The `init` function is a default function
    that you should always define when creating classes, because you use it to declare
    class variables. The `login_ftp` method is a custom function that you define to
    log in to the FTP server. After you log in using the `login_ftp` method and set
    the required directory where the data tables are located, you then store the data
    in a Python list using the custom function `store_in_list`.


    After you finish defining the class, you can use it to produce objects. You just
    need to instantiate the class:


    `>>> Download("ftpexample.com","ftpdirectory")`


    And that''s it! With this brief snippet, you''ve just declared the particular
    FTP domain and the internal FTP directory where the data is located. After you
    execute this last line, a list appears, giving you data that you can manipulate
    and analyze as needed.


    ### Checking out some useful Python libraries


    In Python, a *library* is a specialized collection of scripts that were written
    by someone else to perform specialized sets of tasks. To use specialized libraries
    in Python, you must first complete the installation process. After you install
    your libraries on your local hard drive, you can import any library’s function
    into a project simply by using the `import` statement. For example, if you want
    to import the `ftplib` library, you write


    `>>> import ftplib`


    ![Remember](images/remember.png)Be sure to import the library into your Python
    project before attempting to call its functions in your code.


    After you import the library, you can use its functionality inside any of your
    scripts. Simply use *dot notation* (a shorthand way of accessing modules, functions,
    and classes in one line of code) to access the library. Here''s an example of
    dot notation:


    `>>> ftplib.any_ftp_lib_function`


    The dot notation you see here tells the computer to open the “any\_ftp\_lib\_function”
    that is found in the ftplib library.


    ![Remember](images/remember.png)Though you can choose from countless libraries
    to accomplish different tasks in Python, the Python libraries most commonly used
    in data science are Matplotlib, NumPy, pandas, scikit-learn, and SciPy. The NumPy
    and SciPy libraries were specially designed for scientific uses, pandas was designed
    for optimal data analysis performance, and Matplotlib was designed for data visualization.
    scikit-learn is Python''s premiere machine learning library.


    #### Saying hello to the NumPy library


    NumPy ([`https://numpy.org`](https://numpy.org/)) is the Python package that primarily
    focuses on working with *n*\-dimensional array objects, and SciPy, described next,
    extends the capabilities of the NumPy library. When working with plain Python
    (Python with no external extensions, such as libraries, added to it), you’re confined
    to storing your data in one-dimensional lists. If you extend Python by using the
    NumPy library, however, you’re provided a basis from which you can work with *n*\-dimensional
    arrays. (Just in case you were wondering, *n-dimensional* arrays are arrays of
    one dimension or of multiple dimensions.)


    ![Remember](images/remember.png)To enable NumPy in Python, you must first install
    and import the NumPy library. After that, you can generate multidimensional arrays.


    To see how generating *n*\-dimensional arrays works in practice, start by checking
    out the following code snippet, which shows how you’d create a one-dimensional
    NumPy array:


    `import numpy>>> array_1d=numpy.arange(8)>>> print(array_1d)[0 1 2 3 4 5 6 7]`


    The `numpy.arange` method returns evenly spaced values from within a user specified
    interval. If you don''t specify a number for `numpy.arange` to start with, it
    starts with 0. In this case, I specified that I want eight values, so numpy.arange
    returns `[0 1 2 3 4 5 6 7]`.


    After importing `numpy`, you can use it to generate *n*\-dimensional arrays, such
    as the one-dimensional array just shown. One-dimensional arrays are referred to
    as *vectors.* You can also create multidimensional arrays using the `reshape`
    method, like this:'
