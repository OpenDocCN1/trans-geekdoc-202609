- raw: '![Bullet](images/check.png)**Unraveling the data story**


    ![Bullet](images/check.png)**Looking at important data sources**


    ![Bullet](images/check.png)**Differentiating data science from data engineering**


    ![Bullet](images/check.png)**Storing data on-premises or in a cloud**


    ![Bullet](images/check.png)**Exploring other data engineering solutions**


    Though data and artificial intelligence (AI) are extremely interesting topics
    in the eyes of the public, most laypeople aren’t aware of what data really is
    or how it’s used to improve people’s lives.


    This chapter tells the full story of modern data ecosystems; explains where data
    comes from and how it’s used; and outlines the roles that machine learning engineers,
    data engineers, and data scientists play. In this chapter, I introduce the fundamental
    concepts related to storing and processing data for data science so this information
    can serve as the basis for laying out your plans for leveraging data science to
    improve business performance.


    ## Defining the Three Vs


    If companies want to stay competitive, they must be proficient and adept at infusing
    data insights into their processes and products, as well as their growth and management
    strategies. This is especially true in light of the digital adoption explosion
    that occurred as a direct result of the COVID-19 pandemic. Whether your data volumes
    rank on the terabyte or petabyte scales, data-engineered solutions must be designed
    to meet requirements for the data’s intended destination and use.


    Three characteristics — also called “the three Vs” — are the key identifiers by
    which you can understand your data: volume, velocity, and variety. Because the
    three Vs of data are continually expanding, newer, more innovative technologies
    must continuously be developed to manage these problems.


    ### Grappling with data volume


    In its raw form, most data is *low value* — in other words, the value-to-data-quantity
    ratio is low in raw data. Much data is composed of huge numbers of very small
    transactions that come in a variety of formats. These incremental components produce
    true value only after they’re aggregated and analyzed. Roughly speaking, data
    engineers have the job of aggregating data, and data scientists have the job of
    analyzing it.


    ### Handling data velocity


    Most data is created by using automated processes and instrumentation nowadays,
    and because data storage costs are relatively inexpensive, system velocity is,
    many times, the limiting factor. Keep in mind that raw data is low value. Consequently,
    you need systems that are able to ingest a lot of it, on short order, to generate
    timely and valuable insights.


    In engineering terms, *data velocity* is data volume per unit time. Latency is
    a characteristic of all data systems, and it quantifies the system’s delay in
    moving data after it has been instructed to do so. Many data-engineered systems
    are required to have latency less than 100 milliseconds, measured from the time
    the data is created to the time the system responds.


    *Throughput* is a characteristic that describes a system’s capacity for work per
    unit time. Throughput requirements can easily be as high as 1,000 messages per
    second in data systems! High-velocity, real-time moving data presents an obstacle
    to timely decision-making. The capabilities of data-handling and data-processing
    technologies often limit data velocities.


    Tools that intake data into a system — otherwise known as data ingestion tools
    — come in a variety of flavors.


    ### Dealing with data variety


    The data explanation gets even more complicated when you add unstructured and
    semistructured data to structured data sources. This *high-variety* data comes
    from a multitude of sources. The most salient point about it is that it’s composed
    of a combination of datasets with differing underlying structures (structured,
    unstructured, or semistructured). Heterogeneous, high-variety data is often composed
    of any combination of graph data, JSON files, XML files, social media data, structured
    tabular data, weblog data, and data that’s generated from user clicks on a web
    page — otherwise known as *click-streams.*


    *Structured data* can be stored, processed, and manipulated in a relational database
    management system (RDBMS) — an example of this type of system would be a PostgreSQL
    database that uses a tabular schema of rows and columns, making it easier to identify
    specific values within data that’s stored within the database. This data, which
    can be generated by humans or machines, is derived from all sorts of sources —
    from click-streams and web-based forms to point-of-sale transactions and sensors.
    *Unstructured data* comes completely unstructured — it’s commonly generated from
    human activities and doesn’t fit into a structured database format; such data
    can be derived from blog posts, emails, and Microsoft Word documents. *Semistructured
    data* doesn’t fit into a structured database system but is nonetheless structured
    by tags that are useful for creating a form of order and hierarchy in the data.
    Semistructured data is commonly found in databases and file systems. It can be
    stored as log files, XML files, or JSON data files.


    ![Tip](images/tip.png)Become familiar with the term *data lake.* It’s used by
    practitioners in the industry to refer to a nonhierarchical data storage system
    that’s used to hold huge volumes of multistructured, raw data within a flat storage
    architecture — in other words, a collection of records that come in uniform format
    and that are not cross-referenced in any way. You can use the Amazon Simple Storage
    Service (S3) platform — or a similar cloud storage solution — to meet the same
    requirements on the cloud. (The Amazon S3 platform is one of the more popular
    cloud architectures available for storing data.)


    ![Warning](images/warning.png)Although both the terms *data lake* and *data warehouse*
    are used to refer to storing data, the terms refer to different types of systems.
    *Data lake* is defined in the preceding paragraph; a *data warehouse* is a centralized
    data repository that you can use to store and access only structured data. A more
    traditional data warehouse system commonly employed in business intelligence solutions
    is a *data mart* — a storage system (for structured data) that you can use to
    store one particular focus area of data, belonging to only one line of business
    in the company.


    ## Identifying Important Data Sources


    Vast volumes of data are continually generated by humans, machines, and sensors
    everywhere. Typical sources include data from social media, financial transactions,
    health records, click-streams, log files, and the *internet of things* (IoT) —
    a web of digital connections that joins together the ever-expanding array of devices
    that consumers use in their everyday lives.


    ## Grasping the Differences among Data Approaches


    Data science, machine learning engineering, and data engineering cover different
    functions within the *data paradigm* — an approach wherein huge velocities, varieties,
    and volumes of structured, unstructured, and semistructured data are being captured,
    processed, stored, and analyzed using a set of techniques and technologies that
    are completely novel compared to those that were used in decades past.


    All these functions are useful for deriving knowledge and actionable insights
    from raw data. All are essential elements for any comprehensive decision-support
    system, and all are extremely helpful when formulating robust strategies for future
    business growth. Although the terms *data science* and *data engineering* are
    often used interchangeably, they’re distinct domains of expertise. Over the past
    five years, the role of machine learning engineer has risen up to bridge a gap
    that exists between data science and data engineering.'
