- "# 数据科学傻学者指南\n\n\n\n\n\n\n要查看此书的快速上手表（Cheat Sheet），请访问 [www.dummies.com](http://www.dummies.com)\
  \ 搜索框中搜索“Data Science Essentials For Dummies Cheat Sheet”。\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n184. 185\n\n\n\n\n\n\n\n\n\n# 引言\n\n这本书不仅是为专家数据科学家写的，也是为渴望成为数据科学家的人写的。其内容代表了一种新的方法，将业务愿景置于我们工作的核心。\n\
  \n数据科学和人工智能（AI）对商业世界的颠覆如此彻底，以至于与 10 或 15 年前相比几乎无法辨认。好消息是，这些变化让人的生活变得更加高效、更有趣、更加精彩。坏消息是，如果你还没有基础的数据科学能力，你的商业和就业前景正变得黯淡。\n\
  \n\n\n\n\n在本书中，我详细介绍了数据科学究竟是什么以及它的理论基础是什么。你会发现一些辅助材料的引用，这些材料直接支持你在这些页中所学习的内容。所有这些支持材料都托管在本书的配套网站上：`https://businessgrowth.ai`。我强烈建议你利用这些资源——我从我存档的限量版付费产品库中捐赠了其中的许多。\n\
  \n***注意：*** 如果你想让我向你展示如何实现书中讨论的数据科学方法，我在 LinkedIn Learning 上开设了两门“Python 数据科学核心技能培训”课程。非常欢迎你通过参加这些课程来跟进。你可以直接通过我在\
  \ LinkedIn Learning 上的课程作者页面访问这两个课程：`www.linkedin.com/learning/instructors/lillian-pierson-p-e`。\n\
  \n## 关于本书\n\n延续 `For Dummies`（傻瓜书）系列的传统，本书采用了模块化、易于获取的格式，让你可以将这本书当一本操作手册来使用。书的章节结构设计旨在引导你通过一个清晰的过程，因此按顺序阅读可能最有意义。不过，你并不非从头到尾读完——你可以通过跳着读来获得很多收获，尽管这样做偶尔可能会错过一些重要的背景信息。\n\
  \n在本书中，你可能会注意到某些网页地址跨越了两行文本。如果你读的是纸质版并想访问其中一个网页，只需按照文中注明的字样准确输入网址，假装换行符不存在即可。如果你读的是电子书，那就更简单了——只需点击网址即可直接跳转到该网页。\n\
  \n## 愚蠢的假设\n\n在编写本书时，我假设你已经熟练掌握 `Microsoft Excel` 中的高级任务——透视表、分组、排序、绘图等。在代代数、基础统计学甚至商业微积分方面拥有强大的技能也会有所帮助。无论这是否显得愚蠢，我由心希望所有读者都拥有相关的领域专业知识，并能应用书中介绍的技能。因为数据科学家需要了解他们推导出的数据洞察的含义和应用，因此领域专业知识是数据科学的一项主要要求。\n\
  \n## 本书中使用的图标\n\n在你阅读本书时，你会在页边栏看到以下图标：\n\n![Tip](img/tip.png)提示（Tip）图标标记了你可以用来更轻松掌握知识的技巧（当然了！）和快捷方法。\n\
  \n![Remember](img/remember.png)记住（Remember）图标标记了特别需要知道的信息。为了提取每章中最重要的信息，只需扫读这些图标旁边的材料即可。\n\
  \n![Warning](img/warning.png)警告（Warning）图标提醒你留心！它标记了可能会为你省去烦恼的重要信息。\n\n## 接下来该往何处\n\
  \n如果你是数据科学领域的新手，最好从第 1 章开始从头到尾阅读这本书。如果你已经了解了数据科学的基础知识，我建议你阅读第 1 章的最后部分，浏览一下第 2 章，然后深入研究书的其他部分。\n\
  \n本书与市场上的任何其他数据科学书籍或课程都不同。我如何知道？因为我是根据自己独特的经验和视角从零开始了它。这种视角是基于我在数据、技术和工程领域近 20 年的咨询经验。这本书并不是对其他专家在书中写内容的重制——它对我来说是一件原创艺术品，也是我的心血之作。如果你喜欢本书的内容，请通过\
  \ `lillian@data-mania.com` 联系我并告诉我。\n\n帮助像你这样的读者是我人生的使命！\n\n# 第 1 章\n\n# 深入理解数据科学\n\
  \n## 本章内容\n\n![Bullet](img/check.png)**在各行业中部署数据科学方法**\n![Bullet](img/check.png)**整合数据科学的核心组件**\n\
  ![Bullet](img/check.png)**为业务挑战识别可行的数据科学解决方案**\n![Bullet](img/check.png)**探索数据科学职业的备选方案**\n\
  \n十多年来，每个人都被数据彻底地淹没了。数据来自每一台电脑、每一台移动设备、每一台摄像头以及每一个可以想象的传感器——现在它甚至来自手表和其他可穿戴技术。数据产生于人类的每一次社交媒体互动、保存的每一个文件、拍摄的每一张照片以及提交的每一次查询中；甚至当我们做一些极其简单的事情，如向最喜欢的搜索引擎询问去最近的冰淇淋店的路线时，也会产生数据。\n\
  \n如果你和我以前一样，你可能想过：“所有这些数据有什么意义？为什么要使用宝贵的资源来生成和收集它们？”尽管仅仅在二十年前，还没有人能充分利用产生的大部分数据，但今天的局势已经发生了逆转。被称为数据工程师的专家不断发现创新且强大的新方法来捕获、汇总和压缩难以想象的海量数据。其他被称为数据科学家的专家则通过从这些数据中推导出有价值且可操作的洞察来引领变革。\n\
  \n在最本质的形式下，数据科学代表了过程和资源的优化。数据科学产生数据洞察——即基于数据的可操作结论或预测，你可以利用它们来理解和改进你的业务、投资、健康，甚至是你的生活和社交生活。使用数据科学洞察就像能够在黑暗中看一样。对于你可以想象的任何目标或追求，你都可以找到数据科学方法来帮助你预测从现在到你想去的地方的最直接路线——并预测路上的每一个坑洼。\n\
  \n在本章中，我将解释数据科学和数据工程之间的区别。\n\n## 看看谁可以使用数据科学\n\n“数据科学”和“数据工程”这两个术语经常被误用和混淆，因此让我先澄清这两个领域实际上是独立且不同的专业领域。数据科学是从原始数据中提取有意义的洞察并有效传播这些洞察以产生价值的计算科学。另一方面，数据工程是一个工程领域，致力于构建和维护系统，以解决对于消耗、处理和存储大量、多样和高速数据的应用的数据处理瓶颈和数据处理问题。\n\
  \n在数据科学和数据工程中，你通常处理以下类型的数据：\n\n* **结构化数据：**存储、处理和操作在传统关系型数据库管理系统 (`RDBMS`) 中的数据。这种类型数据的示例可以在你处理公司数据库时常见的行列表格中看到。\n\
  * **非结构化数据：**通常由人类活动产生且不符合结构化数据库格式的数据。非结构化数据的示例包括电子邮件文档、Microsoft Word 文档或音频视频文件。\n\
  * **半结构化数据：**不符合结构化数据库系统，但可以通过标签进行组织，这些标签有助于在数据中创建某种顺序和层次结构。`XML` 和 `JSON` 文件是半结构化形式数据的示例。\n\
  \n\n\n\n\n过去，只有拥有巨额资金的大型科技公司才具备实施数据科学方法来优化和改进业务所需的技能和计算资源，但这种情况已经过去有一段时间了。数据的激增产生了对洞察的需求，而这种需求根植于现代文化的许多方面——从期望\
  \ Uber 司机完全按照 App 预测的时间和地点到达的乘客，到期望 Amazon 平台在购物者购买前为同类商品推荐最佳替代方案进行对比的在线购物者。数据以及对数据驱动洞察的需求无处不在。由于各种规模的组织都开始意识到，他们正身处一个“不生即死”的、数据驱动的竞争环境中，数据技能已成为几乎每一条业务的核心且必要的职能。\n\
  \n对于普通知识工作者来说这意味着什么？\n\n这意味着普通员工日益被要求支持一套不断进步的技术和数据需求。为什么呢？因为几乎所有行业都依赖数据技术以及由此引发的洞察。因此，许多人不断需要升级自己的数据技能，否则他们将面临被更精通数据的员工取代的真实可能性。\n\
  \n好消息是，升级数据技能通常不需要人们回到大学，或获得统计学、计算机科学或数据科学的大学学位。坏消息是，即使通过专业培训或自学，为了保持行业相关性和技术敏锐也总是需要付出额外的努力。在这方面，数据革命与过去冲击行业的任何其他变化并没有太大区别。事实是，为了保持相关性，你必须花费时间和精力去获取让你与时接的技能。当你学习如何做数据科学时，你可以参加一些课程，利用在线资源自我学习，阅读像这本书这样的书，并参加活动，在活动中你可以学习保持行业领先地位所需的知识。\n\
  \n谁可以使用数据科学？你可以。你的组织可以。你的雇主可以。任何具有一定理解和接受过培训的人都可以开始利用数据洞察来改善他们的生活、职业以及业务的健康状况。数据科学代表了你对待世界方式的变化。在确定结果时，人们过去通常做出最好的推测，根据推测行动，然后希望获得理想的结果。然而，通过数据洞察，人们现在可以获得真正驱动变革并实现他们想要的结果所需的预测性视野。\n\
  \n以下是你可以利用数据洞察来让世界（以及你的公司）变得更好的地方的一些示例方法：\n\n*   **为你的业务系统开发关键绩效指标 (KPIs)。** 使用\
  \ KPI 跟踪性能并优化可衡量业务活动的投资回报率 (ROI)。\n*   **开发你的营销策略。** 使用数据洞察和预测性分析来识别有效的营销策略，消除表现不佳的尝试并测试新的营销策略。\n\
  *   **保持社区安全。** 预测性警务应用有助于执法人员预测和预防当地犯罪活动。\n*   **帮助为那些不幸运的人创造一个更好的世界。** 发展中国家的数据科学家正在使用社会数据、移动数据和网站数据来生成实时分析，以提高人道主义对灾害、流行病、粮食短缺等问题响应的效率。\n\
  \n## 检查数据科学拼图的碎片\n\n要在真正意义上实践数据科学，你需要数学和统计学的分析技巧、处理数据时所需的编码技能，以及某一领域的专业知识。没有这些专业知识，你还不如称自己为数学家或统计学家。同样，一个没有领域专业知识和分析技巧的程序员可能被更多地认为是软件工程师或开发人员，而不是数据科学家。\n\
  \n对数据驱动的业务和产品策略的需求在过去十年中呈指数级增长，迫使所有业务领域和行业采用数据科学方法。因此，出现了不同风格的数据科学。以下是每个学科专家被要求了解并定期进行数据科学的几个头衔：\n\
  \n*   临床生物统计学家\n*   数据与技术政策分析师\n*   数据科学家——地理空间与农业分析师\n*   数据科学家——医疗保健\n*   数字银行产品负责人\n\
  *   广告技术数据科学总监\n*   地质数据科学家\n*   全球渠道运营——数据卓越主管\n\n现在，要区分真正的数据科学家和领域专家 (SME) 几乎是不可能的，因为后者的成功在很大程度上取决于他们利用数据科学产生洞察的能力。查看一个人的工作头衔可能有用，也可能没有帮助，仅仅因为根据实际要求，许多角色被命名为\
  \ `data scientist`，但它们完全可以标记为数据战略师或产品经理。此外，许多知识工作者正在从事日常数据科学工作，并没有以 `data scientist`\
  \ 的名义。这是一个被过度炒、往往具有误导性的标签，如果你试图通过查看在线招聘板来了解数据科学家在做什么，这个标签并不总是有帮助。\n\n为了说明这一点，在接下来的章节中，我将详细说明构成任何数据科学角色的关键组成部分，无论该角色是否被赋予了\
  \ `data scientist` 的标签。\n\n### 收集、查询和消费数据\n\n数据工程师的工作是捕获和整理大量的结构化、非结构化和半结构化 `big\
  \ data`（这是一个过时的术语，用于描述超过传统数据库系统处理能力的数据，因为它们太大、移动得太快，或者缺乏传统数据库架构的结构要求）。\n\n![Remember](img/remember.png)数据工程任务与数据科学中执行的工作是分开的，后者更多地关注分析、预测和可视化。尽管有这种区别，但每当数据科学家在分析过程中收集、查询和消费数据时，他们执行的工作与数据工程师（我在本章早期提到的角色）是类似的。\n\
  \n虽然从单一数据源可以产生价值的洞察，但通常多个来源的结合可以提供驱动更好的数据决策所需的上下文信息。数据科学家可以处理存储在单个数据库中的多个数据集，甚至是不同的数据存储环境。其他情况下，源数据存储并处理在软件和数据工程师构建的云平台上。\n\
  \n无论数据如何组合或存储，如果你是一个数据科学家，你几乎总是要`查询`数据——也就是说编写命令从数据存储系统中提取相关数据集。大多数情况下，你使用结构化查询语言\
  \ (`SQL`) 来查询数据。（第 7 章 全是关于 `SQL` 的，所以如果你对这个缩写感到害怕，现在就跳到那一章。）\n\n无论你是使用第三方应用程序还是使用\
  \ R 或 Python 等编程语言进行自定义分析，你都可以从许多通用的文件格式中选择：\n\n*   **逗号分隔值 (CSV)：** 几乎每个品牌的桌面和网络端分析应用程序都接受这种文件类型，常用的脚本语言（如\
  \ Python 和 R）也是如此。\n\n\n\n\n\n*   **脚本：** 大多数数据科学家都知道如何使用 Python 进行数据分析和可视化。这些脚本文件以\
  \ `.ply` 或 `.ipynb`（Python）扩展名结尾。\n\n*   **应用：** Excel 适用于中小型数据集进行快速、方便的抽检分析。这些应用文件具有\
  \ `.xls` 或 `.xlsx` 扩展名。\n\n*   **Web 编程：** 如果你正在构建自定义的 Web 数据可视化，你可能会使用 `D3.js`\
  \ —— 即数据驱动文档，这是一个用于数据可视化的 JavaScript 库。当你使用 `D3.js` 时，你会使用数据 `.html`、`.svg` 和 `.css`\
  \ 文件来操作网页文档。\n\n## 将数学建模应用于数据科学任务\n\n数据科学之所以高度依赖从业者的数学技能（以及下节介绍的统计学技能），正是因为这些是理解你的数据及其意义所需要的技能。这些技能在数据科学中也很有价值，因为你可以利用它们来执行预测预测、决策建模和假设检验。\n\
  \n![Remember](img/remember.png) `Mathematics` 使用确定性方法对世界进行 `定量`（或数值）描述；`statistics`\
  \ 是一门源自数学的科学，但它侧重于使用 `随机`（概率）方法和推断方法形成对世界的定量描述。（我将在第 4 章中为你介绍更多关于数学和统计学的知识）。数据科学家使用数学方法建立决策模型、生成近似值并对未来做出预测。第\
  \ 4 章介绍了许多在数据科学工作中非常有用的数学方法。\n\n![Remember](img/remember.png)在本书中，假设你已经具备相当扎实的基础数学——如果你上过大学水平的微积分甚至线性代数，你将受益浅。然而，我会尽可能适应你的水平。我意识到你可能基于有限的数学知识（高等代数或可能是商业数学）进行工作，因此我用通俗易懂的方法传达高级数学概念，让每个人都能理解。\n\
  \n## 从统计方法中获取洞察\n\n在数据科学中，统计方法对于更好地理解数据的意义、验证假设、模拟场景以及对未来事件进行预测非常有帮助。高级统计技能即使在定量分析师、工程师和科学家中也相当稀缺。然而，如果你想在数据科学领域有所作为，请花些时间掌握一些基础统计方法，如线性回归和逻辑回归、朴素贝叶斯分类和时间序列分析。（这些方法在第\
  \ 4 章中涵盖）。\n\n## 编码、编码、编码——这只是游戏的一部分\n\n在数据科学工作中，编码是不可避免的。你需要能够编写代码，以便指示计算机如何处理、分析和可视化你的数据。像\
  \ Python 这样的语言对于编写数据处理、分析和可视化的脚本至关重要。而 SQL 则对于数据查询非常有用。\n\n尽管编码是数据科学的要求，但它不必像人们所描述的那样巨大且可怕。你的编码可以像你想要的那样精巧复杂，但你也可以采取相当简单的方法。虽然这些技能对成功至关重要，但你可以很容易地学习足够的编码知识来实践高级数据科学。我将第\
  \ 6 章和第 7 章专门用于帮助你了解 Python 入门和 SQL 查询的各个基础。\n\n## 将数据科学应用于特定领域\n\n统计学家过去在接受数据科学的意义方面表现出某种程度的固执。许多统计学家曾大喊：“数据科学并不新奇——它只是我们一直以来所做事情的另一个名字！”尽管我能同情他们的观点，但我被迫站在数据科学家的阵营，他们明确声明数据科学是相互独立的，并且绝对与组成它的统计方法有本质区别。\n\
  \n我对数据科学独有性的观点在某种程度上基于这样一个事实：数据科学家经常使用传统统计学未使用的计算机语言，并采用源自数学领域的方法。但统计学与数据科学之间的主要区别在于对领域专业知识（subject\
  \ matter expertise）的需求。\n\n由于统计学家通常在统计之外领域的知识有限，他们几乎总是被迫咨询领域专家（SME）来验证他们的确切含义。\n\
  \n以下是当今知识工作者将数据科学技能与其各自领域结合的一些方式：\n\n*   **临床信息学科学家**将医疗保健知识与数据科学技能相结合，产生个性化的医疗保健治疗方案。他们利用医疗信息学预测并预防高风险患者的未来健康问题。\n\
  \n*   **营销数据科学家**将数据科学与营销专业知识相结合，以预测和预防客户流失（客户从产品或服务流向竞争对手）。他们还优化营销策略、构建推荐引擎并精调营销组合模型。\n\
  \n*   **数据记者** `scrape` 网站（直接从网站页面上大量提取数据）以获取新鲜数据，以便发现并报道最新的新闻故事。（我将在第 8 章中更多地讨论数据故事）。\n\
  \n*   **数据科学总监**通过额外的数据科学专业知识增强他们的技术项目管理能力。他们的工作包括领导数据项目，并努力保护他们负责的数据项目的盈利。他们还确保\
  \ C 高管、业务经理与团队中负责执行工作的数据人员之间进行透明的沟通。\n\n*   **数据产品经理**利用数据科学的力量增强他们的产品管理能力。他们使用数据科学生成预测性洞察，更好地指导产品设计、开发、发布和策略的决策。\n\
  \n*   **机器学习工程师**将软件工程的超能力与数据科学技能相结合，构建预测应用。这是一个经典的数据实现角色，我将在第 2 章中讨论。\n\n## 沟通数据洞察\n\
  \n作为数据科学家，你必须具备敏锐的口头沟通能力。如果一个数据科学家无法交流，世界上所有的知识和洞察对组织都没有用处。数据科学家需要以员工能够理解的方式来解释数据洞察。不仅如此，数据科学家还需要产生清晰且有意义的数据可视化和书面叙。大多数时候，人们需要亲眼看到一个概念才能真正理解它。数据科学家在沟通手段和方法上必须兼具创造性和务实。\n\
  \n\n\n\n\n![Bullet](img/check.png)揭秘数据后的故事\n![Bullet](img/check.png)查看重要数据源\n![Bullet](img/check.png)区分数据科学与数据工程\n\
  ![Bullet](img/check.png)将数据存储在本地或云端\n![Bullet](img/check.png)探索其他数据工程解决方案\n\n尽管数据和人工智能（AI）在公众眼中是极具趣味的话题，但大多数外行人士并不真正了解数据是什么，也不了解它是如何被用来改善人们生活的。\n\
  \n本章将为你介绍现代数据生态系统的完整故事；解释数据源自何处以及如何被使用；并概述了机器学习工程师、数据工程工程师和数据科学家所扮演的角色。在本章中，我将介绍与数据科学中存储和处理数据相关的基础概念，以便这些信息能够成为你制定利用数据科学提升业务性能计划的依据。\n\
  \n## 定义“三个 V” (The Three Vs)\n\n如果公司想要保持竞争力，就必须精通并擅长将数据洞察融入到其流程、产品，以及增长和管理策略中。考虑到由于\
  \ COVID-19 疫情直接导致的数字化转型爆炸式增长，这一点尤为真实。无论你的数据量是 TB（太字节）级还是 PB（拍字节）级，数据工程解决方案的设计都必须满足数据预期去向和用途的要求。\n\
  \n三个特征——也被称为“三个 V”——是你理解数据的关键标识：数据量（volume）、速度（velocity）和多样性（variety）。由于数据的三个 V\
  \ 在不断扩大，必须不断开发更新、更具创新性的技术来应对这些问题。\n\n### 应对数据量 (Data Volume)\n\n在原始形式下，绝大多数数据都是`低价值`的——换句话说，原始数据中价值与数据数量的比例很低。许多数据是由大量各种格式的极微小交易组成的。这些增量组件只有在经过聚合和分析后才能产生真正的价值。粗略来说，数据工程师的工作是聚合数据，而数据科学家的工作是分析数据。\n\
  \n### 处理数据速度 (Data Velocity)\n\n如今，大多数数据是通过自动化流程和仪器创建的，由于数据存储成本相对低廉，系统速度在很多时候是限制因素。请记住，原始数据是低价值的。因此，你需要能够在短时间内接入大量数据的系统，以产生及时且有价值的洞察。\n\
  \n在工程术语中，`data velocity` 是单位时间的数据。延迟（Latency）是所有数据系统的特征，它量化了系统在接收指令移动数据后的延迟。许多数据工程系统被要求延迟小于\
  \ 100 毫秒（衡量标准是从数据创建到系统响应的时间）。\n\n`吞吐量`（Throughput）是一个描述系统单位时间内工作能力的特征。在数据系统中，吞吐量需求可以轻松达到每秒\
  \ 1,000 条消息！高速度、实时的移动数据为及时决策带来了障碍。数据处理技术和数据分析技术的能力往往限制了数据速度。\n\n将数据输入系统的工具——也被称为数据摄取工具（data\
  \ ingestion tools）有多种类型。\n\n### 处理数据多样性 (Data Variety)\n\n当你向结构化数据源中添加非结构化和半结构化数据时，数据的解释会变得更加复杂。这种`高多样性`（high-variety）数据来自多种来源。它最显著的点是，是由不同底层结构（结构化、非结构化或半结构化）的数据集组合而成的。异构的高多样性数据通常由图数据数据、JSON\
  \ 文件、XML 文件、社交媒体数据、结构化表格数据、Weblog 数据以及从网页用户点击产生的数据（也称为`click-streams`，点击流）的任何组合组成。\n\
  \n`结构化数据`可以在关系数据库管理系统（RDBMS）中进行存储、处理和操作——这类系统的示例是使用 PostgreSQL 的数据库。这种类型系统最显著的点是由具有不同底层结构（结构化、非结构化或半结构化）的数据集组合而成的。使用行和列的数据库架构。`非结构化数据`是完全非结构化的，源于博客文章、电子邮件和\
  \ Word 文档。`半结构化数据`不符合结构化数据库，但尽管通过标签进行组织，这种数据常见于日志文件、XML 文件或 JSON 文件。\n\n![Tip](img/tip.png)熟悉`data\
  \ lake`（数据湖）这一术语。从业人员使用该术语指的是一种非分层数据存储系统，用于存储海量的多结构化数据，且这些数据并非以任何方式关联的扁化存储架构。你可以使用\
  \ Amazon Simple Storage Service (S3) 平台或类似的云存储解决方案来满足相同的需求。（Amazon S3 平台是目前流行的云架构之一。）\n\
  \n![Warning](img/warning.png)尽管`data lake`和`data warehouse`（数据仓库）这两个术语都用于存储数据，但它们指的是不同类型的系统。`Data\
  \ lake`在前文中已有定义；`data warehouse`是一个仅用于存储和访问结构化数据的中央存储库。商业智能解决方案中常用的更传统的数据仓库系统是`data\
  \ mart`（数据市）——一种你可以用于存储公司特定业务线关注领域数据的存储系统。\n\n## 识别重要数据源\n\n海量数据不断由人类、机器和传感器产生。典型来源包括来自社交媒体、金融交易、健康记录、点击流、日志文件以及物联网（IoT）——一种连接消费者日常生活中使用的不断扩展的设备的数字网络。\n\
  \n## 理解数据方法之间的差异\n\n数据科学、机器学习工程和数据工程涵盖了`数据范式`（data paradigm）中的不同功能；这种范式是指对海量速度、多样性的结构化、非结构化和半结构化数据，使用与几十年前完全不同的技术进行捕、处理、存储和分析。\n\
  \n所有这些功能对于从原始数据中获取知识和可操作的见解都是用的。它们都是任何综合决策支持系统的基本要素，在制定未来业务增长的稳健策略时也都非常有帮助。\n\n\n\
  \n\n\n在接下来的章节中，我将介绍数据科学和数据工程的基础概念，以及机器学习工程师这一混合角色。然后，我将向你展示这些角色在组织数据团队中是如何运作的。\n\
  \n### 定义数据科学\n\n如果`science`（科学）是人们研究和解释自然界发生的特定领域现象的系统方法，那么你可以将`data science`（数据科学）视为专门通过数据分析进行知识的科学领域。\n\
  \n数据科学家使用数学技术和算法方法为复杂的业务和科学问题寻求解决方案。数据科学从业者利用其预测方法来获取其他方式无法实现的洞察。在商业和科学领域，数据科学方法可以提供更稳健的决策能力：\n\
  \n*   **在商业领域，**数据科学的目的是为企业和组织提供所需的数据洞察，以优化组织流程，实现效率和收益最大化。\n*   **在科学领域，**数据科学方法被用于得出结果，并为实现特定的科学目标制定方案。\n\
  \n数据科学是一个庞大且多学科的领域。要称自己为真正的数据科学家，你需要在数学和统计学、计算机编程以及你自己的特定领域领域具备专业知识。\n\n使用数据科学技能，你可以做以下酷酷的事情：\n\
  \n*   使用`machine learning`（应用算法从数据中学习并对数据进行自动预测的实践）来优化能源消耗并降低企业的碳足迹。\n*   优化战术策略以实现商业和科学目标。\n\
  *   根据稀疏的环境数据集集预测未知的污染物水平。\n*   设计自动防盗和防欺诈系统，根据算法结果检测异常并触发警报。\n*   为用于土地收购和房地产开发的网站制作推荐引擎。\n\
  *   实施和解释预测性分析和预测技术，以实现业务价值的净增长。\n\n数据科学家必须具备广泛且多元的定量知识，才能解决这些类型的问题。\n\n### 定义机器学习工程师\n\
  \n`machine learning engineer`（机器学习工程师）本质上是软件工程师，他们在数据科学方面足够熟练，可以在自己所构建的应用中部署先进的数据科学模型，从而将机器学习模型引入到诸如软件即服务（SaaS）产品甚至仅仅是网页等等实时生产环境中。\n\
  \n与你可能猜测的相反，机器学习工程师的角色是数据科学家和软件工程师之间的混合体，`not`数据工程师。机器学习工程师的核心是一个全能软件工程师，同时在机器学习和人工智能方面拥有坚实的基础。这个人不需要像数据科学家那样了解大量数据科学，但他们在计算机科学和软件开发方面应该比典型的数据科学家了解得多。\n\
  \n### 定义数据工程\n\n如果`engineering`（工程）是利用科学技术设计和构建解决问题的系统的实践，那么你可以将`data engineering`（数据工程）视为工程领域，专门致力于构建和维护数据系统，以克服由于处理海量、高速和多样化数据而产生的数据处理瓶颈和数据处理问题。\n\
  \n数据工程师使用计算机科学和软件工程技能来设计系统并解决处理和操作数据集的问题。数据工程师通常具有使用（以及设计）实时处理框架以及关系型数据库管理系统（RDBMS）的经验。他们通常使用`Java`、`C++`、`Python`\
  \ 或 `Scala` 进行编码。他们知道如何部署`Spark`来处理、加工并精原始数据变为易于管理的数据集。简单来说，对于数据科学而言，数据工程的目的是通过构建贯、模块化且可扩展的数据处理平台来构建大规模数据解决方案，数据科学家随后可以从中得出洞察。\n\
  \n![Remember](img/remember.png)\n大多数工程系统都是`built`（构建的）系统——它们是在物理世界中构造或制造的。然而，数据工程不同。它涉及设计、构建和实施解决数据世界问题的软件解决方案——与金门大桥或阿斯旺高水坝的物理现实相比，这个世界看起来很抽象。\n\
  \n使用数据工程技能，例如你可以：\n\n*   将数据流水线与公司数据科学家构建的自然语言处理（NLP）服务集成。\n*   构建能够每天处理超过 100 亿次交易的关键任务数据平台。\n\
  *   通过最终将公司数据从旧的本地数据存储环境迁移到尖端云数据仓库来打破数据孤岛。\n*   增强和维护现有的数据基础设施和数据流水线。\n\n数据工程师需要计算机科学、数据库设计和软件工程方面的扎实技能，才能执行此类类型的工作。\n\
  \n### 比较机器学习工程师、数据科学家和数据工程师\n\n数据科学家、机器学习工程师和数据工程师的角色经常被招聘经理混淆。如果你观察大多数招聘公司的职位描述，你会发现职位与角色往往不匹配，或者简单地期望申请者成为数据技能的“瑞士军刀”，并能够胜任所有工作。\n\
  \n![Tip](img/tip.png)\n如果你正在招聘某人来帮助理解你的数据，请确保在撰写职位描述之前明确定义需求。因为数据科学家必须必须具备工作特定领域的领域知识，这种要求通常阻止了数据科学家具备大量的数据工程专业知识。而且，如果你招聘了一个具有数据科学技能的数据工程师，这个人通常对数据领域之外的领域知识并不了解。准备好邀请领域专家（SME）来帮助。\n\
  \n由于许多组织在数据项目中合并和混淆角色，数据科学家有时被迫学习数据工程师的工作——反之亦然。为了在最短时间内产出质量最高的成果，请聘数据工程师存储、迁移和处理你的数据；聘数据科学家为你分析数据；并聘机器学习工程师将你的机器学习模型引入生产。\n\
  \n![Remember](img/remember.png)\n最后，请记住，数据工程师、机器学习工程师和数据科学家只是更大组织结构中的三个小角色。经理、中层员工和业务领导对任何数据驱动计划的成功都起着巨大的作用。\n\
  \n## 为数据科学存储和处理数据\n\n在以下章节中，我将解释云和本地数据存储和处理的基础。\n\n### 直接在云端存储数据并进行数据科学\n\n当你意识到在云端存储数据的积极潜力后，就很难回头了。在云环境中存储数据提供了重大的业务优势：\n\
  \n*   **更快的上市时间（TTM）：** 许多云服务提供商承担了配置、维护和配置运行在定义系统（也称为`compute environment`）内作业所需的计算资源的大部分工作。这极地提高了易用性，并最终允许数据产品更快地上市。\n\
  \n\n\n\n\n- **增强的灵活性：** 云服务在用需求方面极其灵活。如果你在云环境中搭建了环境，然后项目计划发生了变化，你可以直接关闭云服务而不会产生任何额外费用。本地存储的情况并非如此，因为在购买服务器之后，你就拥有了它。从那时起，你唯一的选择就是从不可取消的资源中榨出最大的价值。\n\
  - **安全性：** 如果你选择口碑良好的云服务提供商——例如 Amazon Web Services (AWS)、Google Cloud 或 Microsoft\
  \ Azure——你的数据在云端的安全性可能比在本地存储高得多。这是因为这些巨头企业投入了海量资源来保护和维护它们所存储的数据安全。我实在不出哪家跨国公司在数据基础设施安全方面的投入会比亚马逊、谷歌或微软更多。\n\
  \n在云计算革命的之后，涌现出了许多不同的技术。接下来的章节将探讨这些新技术中的几种。\n\n### 使用无服务器计算执行数据科学\n\n当我们谈论无服务器计算时，`serverless`\
  \ 这个词具有很强的误导性，因为计算确实发生在服务器上。`Serverless computing` 实际上是指在云环境中执行计算，而不是在你的桌面电脑或公司本地执行。物理主机服务器确实存在，但它\
  \ 100% 由你或你公司保留的云计算提供商支持。\n\n现代数据科学的一个巨大悲剧是，数据科学家花费了大量时间在非关键任务上，如数据收集、数据清洗和重新格式、数据操作和数据集成。根据大多数估计，数据科学家只有\
  \ 10% 的时间用于构建预测模型；其余时间都花在准备数据和数据基础设施上，以完成他们受请完成的那项关键任务。无服务器计算是数据科学行业的游戏规则改变者，因为它减少了数据科学家在为预测模型准备数据和基础设施上花费的停机时间。\n\
  \n在本章较早之前，我提到了 SaaS。无服务器计算提供了类似的服务：`function as a service` (`FaaS`)，这是一种容器化的云计算服务，它可以更快速、更简单地直接在云环境中执行代码和预测函数，而无需在该代码周围搭建复杂的架构。通过无服务器计算，你的数据科学模型直接运行在其容器内，作为一种独立函数。你的云服务提供商会处理所有为了支持你的函数而对基础设施进行的配置和调整。\n\
  \n流行的无服务器计算解决方案示例包括 AWS Lambda、Google Cloud Run 函数和 Azure Functions。\n\n### 在 Kubernetes\
  \ 内部容器化预测应用\n\n`Kubernetes` 是一个开源软件套，用于管理、编排和协调跨工作节点集群的容器化应用程序的部署、扩展和管理。Kubernetes\
  \ 的一个特别吸引人的特性是，你可以在位于本地集群、云端或混合云环境的数据上运行它。\n\nKubernetes 的核心重点是帮助软件开发者快速构建和扩展应用。虽然它为在云端部署和扩展预测应用提供了一个容错、扩展的环境，但\
  \ Kubernetes 也需要大量的数据工程专业知识来正确设置它们。\n\n![Remember](img/remember.png)\n\n如果一个系统能够容错，意味着即使在一个或多个子组件故障也能继续成功运行。如果一个系统被描述为`extensible`，意味着它足够灵活，可以扩展或缩小规模而不影响其运行。为了克服这一障碍，Kubernetes\
  \ 发布了其 Kubeflow 产品，这是一个机器学习工具包，让数据科学家可以直接部署模型，而无需数据工程部门的支持。\n\n### 评估流行的云仓库解决方案\n\
  \n在选择云仓库解决方案时，你有许多产品可供选择。以下是最流行的：\n\n- **Amazon Redshift** (`[`https://aws.amazon.com/redshift`](https://aws.amazon.com/redshift)`):\
  \ 一种运行在 Amazon 云之上的流行数据仓库服务，以其处理数据分析和商业智能的惊人速度而闻名。因为它运行在 AWS 平台之上，Redshift 的全托管数据仓库服务具有支持\
  \ PB 级存储的巨大能力。如果你的公司已经在使用其他 AWS 产品——如 Amazon EMR、Amazon Athena 或 Amazon Kinesis——那么\
  \ Redshift 是自然之选。它提供了按需付费和预留定价结构，你可以在其网站上进一步探索。\n- **Snowflake** (`[`www.snowflake.com`](https://www.snowflake.com/)`):\
  \ 这一 SaaS 解决方案为存储在云端的结构化和半结构化数据提供了强大的并行处理分析。Snowflake 是终极的三合一解决方案，具有极具成本效益的数据存储、分析能力以及你可能需要的所有内置云服务。Snowflake\
  \ 与 Qlik、Tableau 等分析工具，以及 Apache Kafka、Apache Spark 和 Pentaho 等技术集成了良好，但如果你主要依赖亚马逊的服务，那么使用它可能就没有意义了。Snowflake\
  \ 的定价基于你存储的数据量，以及你在平台上消耗的计算资源执行时间。\n- **Google BigQuery** (`[`https://cloud.google.com/bigquery`](https://cloud.google.com/bigquery)`):\
  \ 被誉为无服务器数据仓库解决方案，BigQuery 是从存储在 Google Cloud 的数据源生成分析的性价比较高的解决方案。类似于 Snowflake\
  \ 和 Redshift，BigQuery 提供了全托管云服务，让数据科学家和分析专业人员能够快速简单使用该工具，而无需内部数据工程师的帮助。分析可以在 PB\
  \ 级的数据。BigQuery 与 Google Data Studio、Looker、Power BI 和 Tableau 集成，便于进行分析后的数据演示。BigQuery\
  \ 的定价基于你存储的数据量，以及你在平台上消耗的计算资源（由你的查询返回的数据量表示）。\n\n### 介绍 NoSQL 数据库\n\nRDBMS 设计仅用于处理关系型数据集，这些数据构建在整洁的行列中，可以通过结构化查询语言\
  \ (SQL) 进行查询。RDBMS 无法处理非结构化和半结构化数据。此外，RDBMS 缺乏满足数据量和速度需求所需的处理和处理能力。\n\n\n\n\n\n\
  这就是 `NoSQL` 发挥用场的地方——它的数据库是非关系、分布式数据库系统，旨在应对存储和处理数据时面临的挑战。它们可以在本地运行，也可以在云环境中运行。NoSQL\
  \ 数据库跳出了关系型数据库架构，提供了更具扩展性、更高效的解决方案。NoSQL 系统支持对非关系或无模式、半结构化以及非结构化数据的非 SQL 数据查询。通过这种方式，NoSQL\
  \ 数据库能够处理数据系统中常见的结构化、半结构化和非结构化数据源。\n\nNoSQL 提供了四类非关系数据库：图数据库、文档数据库、键值存储和列族存储。由于\
  \ NoSQL 为这些不同的数据结构每种都提供了原生功能，因此它为大多数非关系数据类型提供了高效的存储和检索功能。这种适应性和效率使得 NoSQL 成为处理数据和克服随之而来的处理挑战日益受欢迎的选择。\n\
  \n如 `Apache Cassandra` 和 `MongoDB` 等 NoSQL 应用用于数据存储和实时处理。`Apache Cassandra` 是一种流行的键值型\
  \ NoSQL 数据库，而 `MongoDB` 是最流行的面向文档的 NoSQL 数据库。它使用动态模式并存储类 JSON 文档。\n\n### 实时处理数据\n\
  \n`实时处理框架`正如其名，是一种在数据流向进入系统时以实时（或近实时）方式处理数据的框架。实时框架以微批次（microbatches）的形式处理数据——它们在几秒钟内返回结果，而不是像\
  \ `MapReduce` 这样的批处理框架通常需要的几小时或几天。实时处理框架执行以下操作之一：\n\n* **提高系统的整体时间效率。** 此类别的解决方案包括用于近实时流处理的\
  \ `Apache Flink` 和 `Apache Spark`。\n* **部署创新查询方法以促进实时查询。** 此类别的某些解决方案包括 `Apache\
  \ Drill`、Google 的 `Dremel`、`Apache Hive` 的 `Shark` 以及 `Apache Impala`。\n\n`Apache\
  \ Spark` 是一种内存计算应用，你可以用它对传入的流数据进行近实时的查询、探索、分析，甚至运行机器学习算法。它的威力在于处理速度：在三秒钟内对流数据源进行处理并做出预测的能力绝非小事。\n\
  \n![Tip](img/tip.png)实时流处理框架在许多行业中都非常有用——从股票和金融市场分析到电子商务优化，从实时欺诈检测到优化的订单物流。无论你从事哪个行业，如果你的业务受到由人类、机器或传感器生成的实时数据流的影响，实时处理框架都将帮助你为组织优化并创造价值。\n\
  \n## 识别生成式 AI 的影响\n\n现在你已经对传统的数据存储和处理方法有了概述，是时候探索 AI 技术正在重塑数据工程格局的一些更前沿的方法了。\n\n\
  ### 数据工程的重塑\n\n当手动执行时，数据清洗、增强和预处理任务会消耗大量的时间和资源。这些任务现在通过使用生成式 AI (GenAI) 模型来加速，生成模拟真实数据集的合成数据，从而填补数据漏洞或扩展机器学习模型的训练数据量。这种能力提高了\
  \ AI 模型的质量和稳健性，同时减少了数据准备所需的人工工作。\n\nGenAI 还用于自动生成代码段，例如 `SQL` 查询和数据转换脚本。这无疑简化了数据流水线的开发并减少了错误。通过将\
  \ GenAI 集成到工作流中，数据工程师正在实现更快速、更高效的数据处理，同时显著增强了他们大规模部署机器学习模型的能力。\n\n### 支持 AI 负载的工具和框架\n\
  \n为了充分利用数据工程中 GenAI 的力量，有一系列专门的工具和框架可以支持 AI 负载。领先的是如 `TensorFlow` 和 `PyTorch` 等开源库，它们为开发、训练和部署复杂的\
  \ AI 模型提供了稳健的环境。这些框架正越来越多地集成到数据工程流水线，从而实现了对大型数据集的无缝处理和操作。\n\n此外，如 `Hugging Face\
  \ Transformers` 等框架提供了预训练模型和工具，简化了 GenAI 在包括 `NLP` 和数据生成在各种应用中的部署。云端 AI 服务如 `Amazon\
  \ SageMaker`、`Google AI Platform` 和 `Microsoft Azure AI` 通过提供可扩展的托管环境来满足实时训练和部署\
  \ AI 模型的需求，进一步增强了这一生态系统。\n\n这些服务为密集型 AI 负载提供了计算能力，同时也提供了数据管理的集成工具。这使得数据工程师更容易构建和维护注入了\
  \ AI 的流水线。\n\n# 第 3 章：使用机器从数据中学习\n\n## 本章内容\n\n![Bullet](img/check.png) **掌握机器学习过程**\n\
  ![Bullet](img/check.png) **探索机器学习风格和算法**\n![Bullet](img/check.png) **概述算法、深度学习和\
  \ Apache Spark**\n\n如果你在过去的十年里一直关注新闻，你无疑听过一个名为 `机器学习` 的概念——记者在报道人工智能 (AI) 最新的惊奇发明时经常会提到这个词。在本章中，你将涉足机器学习这一领域。\n\
  \n## 定义机器学习及其过程\n\n`机器学习` 是反复对数据应用算法模型的实践，以便你的计算机能够发现隐藏的模式或趋势，你可以利用这些趋势来做出预测。机器学习拥有广泛且不断扩展的用例，包括以下内容：\n\
  \n* 实时互联网广告\n* 互联网营销个性化\n* 互联网搜索\n* 垃圾邮件过滤\n* 推荐引擎\n* 自然语言处理 (`NLP`) 和情感分析\n* 自动脸部识别\n\
  * 客户流失预测\n* 信用评分建模\n* 机械设备的生存分析\n\n### 漫览机器学习过程的步骤\n\n机器学习涉及三个主要步骤：设置、学习和应用。设置涉及获取数据、对数据进行预处理、为当前任务选择最合适的变量（称为`特征选择`），并将数据拆分为训练集和测试集。你使用`训练数据`来训练模型，并使用`测试数据`来测试模型预测的准确性。学习步骤涉及模型实验、训练、构建和测试。应用步骤涉及模型部署和预测。\n\
  \n![Remember](img/remember.png)将数据拆分为测试集和训练集的经验法则：对原始数据集的三之二进行随机抽样，以便使用该样本来训练模型。使用剩余的三分之一数据作为测试数据，用于评估模型的预测结果。\n\
  \n### 熟悉机器学习术语\n\n\n\n\n\n在深入讨论机器学习方法之前，你得了解与该领域相关的（有时会令人困惑的）词汇。由于机器学习是传统统计学和计算机科学的产物，它吸收了这两个领域的术语，并加入了一些属于自己的术语。以下是你需要了解的：\n\
  \n*   **实例（Instance）：** 等同于数据表中的 `row`（行）、统计学中的 `observation`（观测值）以及 `data point`（数据点）。机器学习从业人员也将实例称为\
  \ `case`（案例）。\n*   **特征（Feature）：** 等同于数据表中的 `column`（列）或 `field`（字段），以及统计学中的 `variable`（变量）。在回归方法中，特征也被称为\
  \ `independent variable`（自变量 IV）。\n*   **目标变量（Target variable）：** 等同于统计学中的 `predictant`\
  \ 或 `dependent` variable（因变量 DV）。\n\n![记住](img/remember.png)\n在机器学习中，`feature selection`（特征选择）是一个相对直接的过程；而对于`feature\
  \ engineering（特征工程），你需要大量的领域知识和强大的数据科学技能，才能从底层数据集中手动设计输入变量。当你的模型对所解决问题的表示需要比原始数据集提供的更好时，就会用到特征工程。\n\
  \n![警告](img/warning.png)\n尽管机器学习经常在数据科学和 AI 的背景下被提到，但这些术语都是独立且不同的。机器学习是数据科学的一项实践，但数据科学不仅仅是机器学习。AI\
  \ 经常（并非总是）涉及数据科学和机器学习。`AI` 是一个描述自主行动代理的术语。在某些情况下，AI 代理是机器人；在其他情况下，它们是软件应用程序。如果代理的动作是由嵌入机器学习模型的输出触发的，那么该\
  \ AI 就是由数据科学和机器学习驱动的。另一方面，如果 AI 的动作是由基于规则的决策机制管理的，你也可以拥有完全不涉及机器学习或数据科学的 AI。\n\n\
  ## 考虑学习风格\n\n机器学习主要有三种风格应用：有监督、无监督和半监督。监督和无监督方法是大多数现代机器学习应用的基础，而半监督学习是一颗冉冉之星。\n\n\
  ### 使用监督算法学习\n监督学习算法要求输入数据具有带标签的特征。这些算法从数据的已知特征中学习，产生一个输出模型，从而成功预测新进入的无标签数据点的标签。当你有一个由历史值组成的有标签数据集，且这些值是未来事件良好的预测指标时，就可以使用监督学习。用例包括生存分析和欺诈检测等。逻辑回归是一种监督学习算法，你可以在“根据功能选择算法”部分看到更多信息。\n\
  \n### 使用无监督算法学习\n无监督学习算法接受无标签数据，并尝试根据输入特征中的底层相似性将观测值归类类别，如图 3-1 所示。主成分分析、k-means\
  \ 聚类和奇异值分解都是无监督机器学习算法的示例。常见的用例包括推荐引擎、脸识别系统和客户细分。\n\n![图 3-1：无监督机器学习将无标签数据划分为小组。](img/9781394297009-fg0301.png)\n\
  \n图 3-1： 无监督机器学习将无标签数据划分为子集。\n\n### 使用强化学习学习\n强化学习是一种基于行为的学习模型。它基于类似于人类和动物学习的机制。模型根据其行为被给予“奖励”，随后它通过调整所做的决策，以获得尽可能多的奖励，来学会使其奖励总和。\n\
  \n## 看看你能做什么\n\n无论你只是开始熟悉涉及机器学习的算法，还是想了解更多关于前沿机器学习进展的动态，本节都有你需要的内容。首先，我将为你提供机器学习算法的概述，并按功能进行分类；然后我将详细介绍由深度学习和\
  \ Apache Spark 体现的机器学习高级领域。\n\n### 根据功能选择算法\n当你需要选择一类机器学习算法时，根据每个模型的功能来考虑每个模型类是有帮助的：\n\
  \n*   **回归（Regression）：** 你可以使用这种模型来描述和量化自变量与因变量之间的关系。这种模型帮助你识别特征的变化如何影响结果，它是进行预测的一种常用方法。你可以在第\
  \ 4 章中阅读更多关于线性回归、逻辑回归方法和普通最小二法的知识。\n*   **关联规则学习（Association rule learning）：** 这种算法是一种基于规则的方法集，你可以用它来发现数据集中特征之间的关联。若要在如何在\
  \ Microsoft Excel 中使用关联规则进行深入训练和演示，请务必查看本书的配套网站（[`businessgrowth.ai``](https://businessgrowth.ai/)）。\n\
  *   **基于实例的（Instance-based）：** 如果你想使用数据集中的观测值根据相似性对新的观测值进行分类，可以使用这种类型。使用实例进行建模可以使用\
  \ k-最近邻分类等方法，该方法在第 5 章中介绍。\n*   **正则化（Regularizing）：** 你可以使用正则化引入额外信息，作为防止模型过拟合或解决病态问题的手段。如果这个术语对你来说是新的，`model\
  \ overfitting` 指的是这种情况：模型与其底层数据集以及噪声或随机误差拟得如此紧密，以至于模型作为新观测值的预测器性能糟糕。\n*   **朴素贝叶斯（Naïve\
  \ Bayes）：** 如果你想根据数据中的某些证据来预测事件发生的概率，可以使用这种基于分类和回归的方法。朴素贝叶斯在第 4 章中介绍。\n*   **决策树（Decision\
  \ tree）：** 树结构作为决策支持工具非常有用。你可以用它来构建模型，预测与任何给定决策相关的潜在下游影响。\n*   **聚类（Clustering）：**\
  \ 你可以使用这种无监督机器学习方法来发现无标签数据集中的子小组。k-means 聚类和层次聚类在第 5 章中都有介绍。\n*   **降维（Dimension\
  \ reduction）：** 如果你正在寻找一种过滤器来从数据中移除冗余信息、不可解释的随机变异和离群值，请考虑降维技术，如因子分析和主成分分析。这些主题在第\
  \ 4 章中都有介绍。\n*   **神经网络（Neural network）：** 神经网络通过使用层相互连接的神经单元作为从观测数据中学习并推断规则的手段，模仿大脑解决问题的方式。它通常用于图像识别和计算机视觉应用。\n\
  \n\n\n\n想象一下你正在决定是否要去海边。如果下雨，你绝不会去海边；如果室外温度低于 75°F，你就不去。这就是你决策的两个输入因素。你在下雨时不去海边的意愿远大于在温度低于\
  \ 75°F 时不去的意愿，因此你相应地为这两个输入分配了权重。对于任何决定是否要去海边的特定实例，你都会考虑这两个标准，将结果汇总，然后决定是否去。如果你决定去，说明你的决策阈值已经得到满足；如果你决定不去，说明你的决策阈值未被满足。这是对神经网络工作原理的一个简单类比。\n\
  \n![Remember](img/remember.png)\n\n现在，来看一个更技术性的定义。最简单的神经网络类型是 `perceptron`（感知机）。它接受多个输入，对它们进行加权，在处理器层上进行求和，然后根据你设置的激活函数和阈值输出结果。`activation\
  \ function`（激活函数）是将输入转换为输出信号的数学函数。处理器层被称为 `hidden layer`（隐藏层）。`neural network`（神经网络）是连接的感知机层，它们作为一个单元共同工作，接受输入并返回指示是否满足某些标准的输出。神经网络的一个关键特点是它们是\
  \ `self-learning`（自学习的——换句话说，它们会根据输入数据的变化进行适应、学习和优化。图 3-2 是感知机结构的示意图。\n\n*   **深度学习方法：**\
  \ 该方法在连续层中整合传统的神经网络，提供深层训练以生成预测性输出。我将在下一节中为你详细介绍这个主题。\n*   **集成算法：** 你可以使用集成算法来结合机器学习方法，以获得比任何单一机器学习方法本身都优的结果。\n\
  \n![FIGURE 3-2: 神经网络是人工神经单元的连接层。](img/9781394297009-fg0302.png)\n\nFIGURE 3-2: 神经网络是人工神经单元的连接层。\n\
  \n![Tip](img/tip.png) 访问本书的配套网站（[`businessgrowth.ai``](https://businessgrowth.ai/))\
  \ 以获取针对你最紧迫需求选择最佳深度学习网络的快速上手指南。\n\n如果你使用 Gmail，你一定在使用它的自动回复功能（你可以从三条单行消息中选择一条作为对他人发给你信息的自动回复）。Gmail\
  \ 中的这种自动回复功能被称为 Smart Reply（智能回复），它是基于深度学习算法的。另一个基于深度学习的创新是 Facebook DeepFace，这是\
  \ Facebook 的一项功能，可以自动识别并 Facebook 照片中出现的人推荐标签。图 3-3 是深度学习网络结构的示意图。\n\n![FIGURE 3-3:\
  \ 深度学习网络是具有多个隐藏层的神经网络。](img/9781394297009-fg0302.png)\n\nFIGURE 3-3: 深度学习网络是具有多个隐藏层的神经网络。\n\
  \n## 使用 Spark 生成实时分析\n\nSpark 是一种内存级分布式应用程序，你可以用它来分析持续流式数据。因为它以微批（microbatches）的形式处理数据，这些周期可以在几秒钟内完成，这就是为什么它被称为微批处理。\n\
  \n*   **Spark SQL：** 你使用此模块来处理结构化数据。在 Spark 中，你还可以使用 Hive 查询数据。\n*   **GraphX：**\
  \ GraphX 库是你存储和处理网络数据的方式。\n*   **Streaming：** Streaming 模块是数据处理的地方。该模块将持续流源分解为更小的数据流，称为\
  \ `Dstreams`（换句话说，即离散数据流）。\n*   **MLlib：** MLlib 是 Spark 中用于数据、统计和机器学习算法的。\n\nSpark\
  \ 可以处理来自各种存储的数据，包括 Amazon Redshift、Amazon Web Services (AWS)、Apache Cassandra、Hadoop\
  \ 分布式文件系统 (HDFS) 和 MongoDB。Spark 由以下子模块组成：\n\n*   **深度学习方法：** 该方法在连续层中整合传统的神经网络，提供深层训练以生成预测性输出。我将在下一节中为你详细介绍这个主题。\n\
  *   **集成算法：** 你可以使用集成算法来结合机器学习方法，以获得比任何单一机器学习方法本身都优的结果。\n\n# 第 4 章\n\n# 数学、概率与统计建模\n\
  \n## 本章内容\n\n*   介绍统计概率的核心基础\n*   量化相关性\n*   减少数据集维度\n*   使用多准则决策构建决策模型\n*   深入回归方法\n\
  *   检测离群值\n*   探讨时间序列分析\n\n数学和统计并不是许多人所认为的那种可怕怪物。在数据科学中，对这些定量方法的需求仅仅是生活的事实——不必担心。虽然你需要掌握解决问题所需的数学和统计知识，但你不需要为了这些领域去读学位。\n\
  \n\n\n\n![Remember](img/remember.png)与许多纯统计学家想让你相信的相反，数据科学领域并不等同于统计学领域。数据科学家在一个或多个领域拥有实质性的知识，他们利用统计学、数学、编码和强大的沟通能力，帮助他们发现、理解并传达与其专业领域相关的原始数据集中的数据洞察。统计学是这一公式至关重要的组成部分，但并不比其他要素更重要。在本章中，我将为你介绍概率、相关性分析、降维、决策建模、回归分析、异常值检测和时间序列分析的基本概念。\n\
  \n## 探索概率与推断统计学\n\n概率是统计学中最基础的概念之一。要开始利用统计学来理解你的数据，你需要能够识别出基础内容，例如你看到的是`描述性统计`还是`推断统计学`。你还需要牢牢掌握概率分布的基础知识。\n\
  \n`statistic`（统计量）是对数值数据进行数学运算后得到的结果。通常情况下，你在决策中使用统计学。统计学分为两种：\n\n*   **描述性（Descriptive）：**\
  \ 描述性统计提供描述，阐明数值数据集的某些特征，包括数据集的分布、中心趋势（如`mean`、`min` 或 `max`）和离散程度（如标准差和方差）。为了明确，数据集的`mean`\
  \ 是其数据点的平均值，数据集的`min` 是其数据点的最小值，数据集的`max` 是其数据点的最大值。描述性统计并不是为了说明任何因果主张。\n\n    ![Remember](img/remember.png)描述性统计可以突出\
  \ `X` 和 `Y` 之间的关系，但它们并不假设 `X` 导致了 `Y`。\n\n*   **推断性（Inferential）：** 推断统计学不是关注对数据集的相关描述，而是从数据集中划分出一个较小部分，并尝试推导出关于较大数据集的重要信息。与描述性统计不同，推断方法（如`回归分析`）*确实*尝试通过研究因果关系来进行预测。使用推断统计学来获取你感兴趣的真实世界测量值的信息。\n\
  \n描述性统计描述数值数据集的特征，但这并不能告诉你你为什么要关注它。事实上，大多数数据科学家对描述性统计感兴趣仅仅是因为它们揭示了其所描述的真实世界测量值的某些信息。例如，描述性统计量通常与`准确度`相关，这表明该统计量作为真实世界测量值估计值的价值。\n\
  \n为了更好地理解这个概念，想象一位企业主想要估计下个季度的利润。所有主可能会取过去几个季度的利润平均值，作为对下个季度利润额的估计。但如果前几个季度的利润波动很大，那么估计该预测利润值`variation`（变异性，即该金额估计值与实际获得利润之间的差额）的描述性统计量，将指示预测值可能偏实际值有多远。（拥有这些信息不坏，对吧？）\n\
  \n![Tip](img/tip.png)你可以以许多方式使用描述性统计——例如，用于检测异常值，或为特征预处理需求制定计划，或者快速识别你可能想要（或不想）在分析中使用哪些特征。\n\
  \n与描述性统计一样，`推断统计学`被用于揭示关于真实世界测量值的某些信息。推断统计学通过提供关于一小数据选择的信息来实现这一点，以便你可以利用这些信息对取自它的较大数据集推断出结论。在统计学中，这个较小的数据选择被称为`sample`（样本），而从中提取样本的较大、完整数据集被称为`population`（总体）。\n\
  \n如果你的数据集太大而无法整体分析，可以从该数据提取一个较小的样本进行分析，然后根据你从分析样本中学到的知识对整个数据集进行推断。在无法负担为整个总体收集数据的情况下，你也可以使用推断统计学来估计缺失部分。\n\
  \n![Warning](img/warning.png)为了使推断有效，你必须仔细选择你的样本。即使你的样本具有代表性，数字总是会表现出一些`noise`（噪声）。\n\
  \n### 概率分布\n\n想象一位企业主想要估计下个季度的利润。可能会可能会过去几个季度的利润平均值，作为对下个季度利润额的估计。但如果前几个季度的利润波动很大，那么估计该预测利润值`variation`（变异性，即该金额估计值与实际获得利润之间的差额）的描述性统计量，将指示预测值可能偏实际值有多远。\n\
  \n与描述性统计一样，`推断统计学`被用于揭示关于真实世界测量值的某些信息。推断统计学通过提供关于一小数据选择的信息来实现这一点，以便你可以利用这些信息对取自它的较大数据集推断出结论。在统计学中，这个较小的数据选择被称为`sample`（样本），而从中提取样本的较大、完整数据集被称为`population`（总体）。\n\
  \n想象你刚刚来到拉斯维加斯并坐在你喜欢的桌旁。因为球可以以等概率落在任何槽中，所以存在一种`均匀概率分布`。但轮盘的槽位并不是完全相同的——轮盘有 18 个黑色槽和\
  \ 20 个红色或绿色的槽。\n\n![math](img/eq0401.png)<m:math xmlns:m=\"http://www.w3.org/1998/MathML\"\
  ><m:mrow><m:mi mathvariant=\"normal\">Probability</160;</m:mi><m:mo stretchy=\"\
  false\">(</m:mo><m:misoft=\"normal\">black</m:mi><m:mo stretchy=\"false\">)</m:mo><m:mo>=</m:mo><m:mfrac\
  \ bevelled=\"true\"><m:mrow><m:mn>18</m:mn></m:mrow><m:mrow><m:mn>38</m:mn></m:mrow></m:mfrac><m:mo>=</m:mo><m:mn>.4736</m:mn></m:mrow></m:math>\
  \ 由于这种安排，球落在黑色槽的概率是 47.36%。你这里的净收益可以被视为一个`random variable`（随机变量），它是与物体、人或地点（真实世界中的事物）相关的不可预测的特征或值的度量。然而，尽管这个特征或值是不可预测的，但并不意味着你对其一无所知。此外，你可以利用你*已知*的信息来帮助你决策。\n\
  \n`weighted average`（加权平均值）是对大量数据点量的平均值。如果你在概率分布上对你的收益（随机变量）取加权平均，这将产生一个`expectation\
  \ value`（期望值）——即连续投注后净收益的预期值。（期望值也可以被看作最佳猜测，如果你必须猜的话。）\n\n\n\n\n\n![Remember](img/remember.png)\n\
  在考虑事件的概率时，你必须知道可能发生哪些其他事件。始终将事件集定义为`互斥`的——即一次只能发生一种。（想象掷骰子有六种可能的结果。）概率具有这两个重要特征：\n\
  \n* 任何单个事件的概率永远不会低于 0.0 或超过 1.0。\n* 所有事件的概率之和始终恰好等于 1.0。\n\n概率分布根据这两个类型进行分类：\n\n\
  *   **离散（Discrete）：** 取值可以通过分组进行计数的随机变量。\n*   **连续（Continuous）：** 为取值范围分配概率的随机变量。\n\
  \n![Remember](img/remember.png)\n为了理解离散分布和连续分布，请考虑描述汽车的数据集中两个变量。颜色变量具有离散分布，因为汽车的颜色范围有限（例如：黑色、红色或蓝色）。观测值可以根据颜色分组进行计数。描述汽车每加仑英里油耗（`mpg`）的变量具有连续分布，因为每辆汽车都有其各自的、独立的平均\
  \ `mpg`值。\n\n*   **正态分布（数值连续）：** 在图形上用对称的钟形曲线表示，这些分布模拟了倾向于某些最可能观测值的现象（位于钟形曲线的顶部）；两个极端的观测值概率较低。\n\
  *   **二项分布（数值离散）：** 这些分布模拟了在只有两种可能结果的情况下，在一定次数尝试中可能发生的成功次数（例如，旧的硬币正反面掷场景）。二值变量——假设只取两个值中的一个值的变量——具有二项分布。\n\
  *   **分类分布（非数值）：** 这些代表非数值的分类变量或`序数变量`（有序分类变量）。例如，大多数航空公司提供的服务等级是序数的的，因为它们提供头等舱、商务舱和经济舱座位。\n\
  \n### 朴素贝叶斯的条件概率\n\n你可以使用直接从统计学领域借用的朴素贝叶斯（Naïve Bayes）机器学习方法，根据数据特征中定义的证据（evidence）来预测事件发生的概率——这被称为`条件概率`。朴素贝叶斯基于分类和回归，如果你需要对文本数据进行分类，它将特别有用。\n\
  \n为了更好地说明这一概念，请考虑来自加州大学欧文分校机器学习仓库的 Spambase 数据集([`archive.ics.uci.edu/ml/datasets/Spambase`](https://archive.ics.uci.edu/ml/datasets/Spambase)）。该数据集包含\
  \ 4601 条电子邮件记录，并在最后一个字段中指定每封邮件是否为垃圾邮件。从该集中，你可以识别垃圾邮件之间的共同特征。在你定义了指示垃圾邮件的共同特征后，你可以构建一个朴素贝叶斯分类器，根据内容中支持的实证证据，可靠地预测传入的邮件是否为垃圾。换句话之，模型根据从内容中收集的特征（`证据`）来预测邮件是否为垃圾邮件（`事件`）。\n\
  \n朴素贝叶斯有三种流行的类型：\n\n*   **MultinomialNB：** 如果你的变量（分类或连续）描述的是离散的频率计数（如词频），请使用此版本。此版本的朴素贝叶斯假设从多项分布，这在文本数据中很常见。它不接受负值。\n\
  *   **BernoulliNB：** 如果你的特征是二值的，你可以使用多项伯尔努利朴素贝叶斯进行预测。此版本适用于分类文本数据，但通常认为其性能不如 `MultinomialNB`。如果你想用\
  \ `BernoulliNB` 从连续变量进行预测，这是可行的，但你首先需要将变量划分为离散的区间分组（也称为分箱 `binning`）。\n*   **GaussianNB：**\
  \ 如果所有预测特征都符合正态分布，请使用此版本。它不是分类文本数据的好选择，但如果你的数据包含正值和负值（当然，如果你的特征符合正态分布），它可以是一个很好的选择。\n\
  \n![Warning](img/warning.png)在朴素地构建贝叶斯分类器之前，请考虑该模型持有一个`先验`（a priori）假设——这意味着它的预测是基于过去条件仍然成立的假设。当情况变化时，从历史数据预测未来值会产生错误的结果。\n\
  \n## 量化相关性\n\n许多统计和机器学习方法假设你的特征是独立的。然而，为了测试它们是否独立，你需要评估它们的`相关性`（变量表现出相互依赖的程度）。在本节中，你将简要介绍皮尔逊相关和斯皮尔曼等级相关。\n\
  \n![Tip](img/tip.png)相关性通过一个名为 `r` 的变量值量化，范围在 –1 到 1 之间。`r`值越接近 1 或 –1，两个变量之间的相关性越强。如果两个变量的`r`值接近\
  \ 0，可能它们是独立变量。\n\n### 使用皮尔逊 *r* 计算相关性\n\n如果你想发现数据集中连续变量之间的依赖关系，你将使用统计学来估计它们的相关性。相关分析最简单的形式是`皮尔逊相关`，它假设如下：\n\
  \n*   你的数据呈正态分布。\n*   你拥有连续的数值变量。\n*   你的变量之间存在线性关系。你可以通过在图表上绘制数据点，并观察数据点值是否存在清晰的上升或下降趋势，从而画出一条直线来总结该趋势。图\
  \ 4-1 由于皮尔逊相关有许多条件，请`仅`用它判断两个变量之间是否存在关系，而不是排除可能的关系。如果你得到的`r`值接近 0，则表明变量之间没有线性关系，但它们之间可能存在非线性关系。\n\
  \n![图 4-1：月份与 YouTube 订阅数之间的线性关系示例](img/9781394297009-fg0401.png)\n\n[图 4-1：](#c04.xhtml#rc04-fig-0001）月份与\
  \ YouTube 订阅数之间的线性关系示例。\n\n要使用皮尔逊 `r` 测试两个变量之间的线性相关性，只需将数据代入以下公式并计算结果即可：\n\n\n\n\
