  \ accent=\"true\"><m:mi>y</m:mi><m:mo>&#175;</m:mo></m:mover></m:mrow><m:mo)</m:mo></m:mrow></m:mrow><m:mn>2</m:mn></m:msup></m:mrow></m:msqrt></m:mrow></m:mfrac></m:mrow></m:math>\n\
  \n## 降维\n\n好的，有了这些后可以做什么呢？首先，你需要进行降维。在本节中，我们将看看什么是矩阵分解（SVD）。由于由于其中涉及的线性代数植根于 SVD，让我们来看看它是如何工作的。机器学习人员将其称为主成分分析（PCA）。将这些矩阵相乘即可还原原始矩阵。SVD\
  \ 在你想要压缩或清理数据集潜在变量（隐藏变量）时非常有用。这里是使用 SVD 的两种主要方式：\n\n*   **压缩稀疏矩阵：** 如果有一个干净但稀疏的数据集，你不想删除任何信息，但需要将其压缩到可管理的变量数量。SVD\
  \ 的一个方便之处在于它允许你设置它创建的变量数量。如果你不移除这些任何组件，你将在不丢失任何信息的情况下缩小数据集的大小。这一过程在图 4-3 中所示。\n\
  *   **清理和压缩数据：** 在其他情况下，你可以使用 SVD 对脏数据进行算法清洗。在这种情况下，你应用 SVD 来发现你的组件，然后通过观察它们的方差来决定保留哪些。行业标准是保留组件的解释方差之和应至少达到\
  \ 75%。这确保了至少有 75% 的原始信息保留在你保留的组件中。这一过程在图 4-4 中所示。\n\n![警告](img/warning.png)如果保留组件的解释方差之和（或累积解释方差（CVE））小于\
  \ 95%，则不要将这些组件作为衍生特征继续用于下游的机器学习模型。在这些情况下，在这些衍生特征中丢失的信息会导致机器学习模型产生不准确、不可靠的预测。然而，这些衍生组件作为描述性统计的来源或用于构建更用的描述性分析——换句话说，描述过去发生了什么的分析，并回答“发生了什么？”、“什么时候？”、“有多少？”以及“在哪里？”等问题是有用的。\n\
  \n\n\n\n\n# 图 4-3: 应用 SVD 压缩稀疏且干净的数据集。\n\n![记住](img/remember.png)CVE 越低，你就越应该对你模型的结果持保留态度。\n\
  \n![警告](img/warning.png)如果你移除了一些组件，那么当你尝试重构矩阵时，可能会发现生成的矩阵与你的原始数据集并不完全匹配。别担心！那些数据是在经过\
  \ SVD 过滤掉大部分信息冗余和噪声，并由你移除后剩余的数据。\n\n深入了解一下 SVD 的细节，让我们来看 SVD 的公式，但请记住：这是线性代数而不是普通代数，所以我们看的是矩阵运算而非普通数学。从头开始，你需要理解特征向量的概念。为了做到这一点，想象一个名为\
  \ `A` 的矩阵。现在考虑一个非零向量 `x`，并使得 `Ax = λx`，其中 `λ` 是一个标量。在这种情况下，标量 `λ` 被称为矩阵 `A` 的`特征值`。它可以取值为\
  \ 0。此外，`x` 是对应于 `λ` 的特征向量，同样，它不允许为零。`λ` 仅仅是特征向量的缩放因子。SVD 将矩阵分解为三个结果矩阵，如图 4-5 所示。这些矩阵相乘将还原你的原始矩阵。\n\
  \n![图 4-4: 应用 SVD 清理并压缩稀疏且脏的数据集。](img/9781394297009-fg0404.png)\n\n图 4-4: 应用 SVD\
  \ 清理和压缩稀疏且脏的数据集。\n\n![图 4-5: 你可以使用 SVD 将数据分解为 u、S 和 V 矩阵。](img/9781394297009-fg0405.png)\n\
  \n图 4-5: 你可以使用 SVD 将数据分解为 u、S 和 V 矩阵。\n\n仔细观察图 4-5:\n\n```\nA = u * S * v\n```\n\
  \n*   **A:** 这是包含你所有原始数据的矩阵。\n*   **u:** 这是 `A` 的左奇异向量（一种特征向量），它包含了关于你数据观测值的所有重要且非冗余的信息。\n\
  *   **v:** 这是 `A` 的右奇异向量。它包含了关于你数据集中特征列的所有重要且非冗余的信息。\n*   **S:** 这是矩阵 `A` 特征值的平方根。它包含了压缩过程中所执行的操作的全部信息。\n\
  \n### 使用因子分析降低维度\n\n*因子分析*与 SVD 的异同之处在于，它也是一种可以用于从数据中过滤冗余信息和噪声的方法。这种方法是心理测量学领域的分支，旨在帮助你在共同根源导致*共享方差*的情况下推导出根原因——即当一个变量的方差与数据集中其他变量的方差相关时。\n\
  \n当你发现数据集中存在共享方差时，意味着信息冗余在起作用。你可以使用因子分析或主成分分析来清除数据中的这种信息冗余。你将在下一节中看到更多关于主成分分析的内容，但现在，请关注因子分析，以及你可以用它将数据集的信息压缩为一组减少的、有意义的非信息冗余的*潜变量*——即作为数据集基础但无法直接观测的有意义推断变量。\n\
  \n因子分析遵循以下假设：\n\n*   你的特征是*度量*的（可以进行有意义计算的数值变量）。\n*   你的特征应该是连续的或*定序的*。（如果你不确定什么是定序，请回看本章中“概率分布”部分中头等舱、商务舱和经济舱的类比。）\n\
  *   你的数据集中超过 100 个观测值，每个特征至少有 5 个观测值。\n*   你的样本是同质的。\n*   数据集中特征之间的相关性 *r* > 0.3。\n\
  \n在因子分析中，你对特征进行回归（本章稍后会介绍该主题），以揭示隐藏的潜变量或*因子*。然后你可以将这些因子作为未来分析中的变量，以代表它们所源的原始数据集。因子分析的核心是一个拟合模型的过程，通过降低维度信息冗余，为分析数据集做好准备。\n\
  \n### 使用 PCA 减少维度并移除离群值\n\n*主成分分析*（PCA）是另一种与 SVD 密切相关的降维技术：这种无监督统计方法发现数据集中特征之间的关系，然后将其转换并还原为一组非信息冗余的*主成分*——即体现并解释数据集中包含的信息（即其方差）的不相关特征。这些组件充当了数据集的合成的、精炼的表示，剔除了信息冗余、噪声和离群值。你可以将这些减少后的组件作为你机器学习算法的输入，基于数据的压缩表示进行预测。（有关关于离群值的更多信息，请参见本章稍后的“检测离群值”部分。）\n\
  \nPCA 模型基于这两个假设：\n\n*   *多变量正态性*（MVN）——或者一组围绕均值聚集的实值、相关的随机变量——是理想的，但不是必须。\n*   数据集中的变量应该是连续的。\n\
  \n尽管 PCA 类似于因子分析，但它们有两个主要区别：区别之一是 PCA 并不通过回归来寻找共享方差的某些底层原因，而是通过分解数据集以减少的特征数量来简洁地表示其最重要的信息。另一个关键区别是，使用\
  \ PCA 时，当你第一次运行模型时，并不指定要在数据集中发现的组件数量。你让初始模型的结果告诉你应该保留多少个组件，然后重新运行分析以提取这些特征。\n\n\
  ![记住](img/remember.png)与本章 SVD 部分关于 CVE 的讨论类似，你保留的方差量取决于你如何应用 PCA，以及你输入模型的数据。根据你应用\
  \ PCA 的方式，以下直觉性规则变得重要：\n\n*   **用于描述性分析：** 如果 PCA 仅用于描述性目的（例如，在构建公司理想客户的描述性画像时），CVE\
  \ 可以低于 95%。在这种情况下，CVE 低到 75% 到 80% 是可以的。\n*   **用于诊断、预测或决策性分析：** 如果主成分用于生成诊断、预测或决策分析的下游模型，CVE\
  \ 应该达到 95% 或更高。只需意识到，CVE 越低，下游模型的结果可靠性就越低。丢失的每个百分比 CVE 都代表原始数据集中未被主成分捕捉的小量信息。\n\n\
  ![提示](img/tip.png)在使用 PCA 检测离群值时，只需将主成分绘制在 *x-y* 散点图中，并视觉上检查可能是离群值的区域。这些数据点对应于值得调查的潜在离群值。\n\
  \n## 使用多准则决策进行决策建模\n\n\n\n\n生活是复杂的。我们往往被迫在多个不同标准共同作用的情况下做出决策，而通常我们并不清楚哪一个标准应该优先。数学家们发挥其职业特性，构想出了量化方法，每当你有多个标准或替代方案作为决策依据时，可以使用这些方法进行决策支持。你可以在第\
  \ 3 章中看到这些方法，我在该章节讨论了神经网络和深度学习——另一种实现同样决策支持目的的方法是`多准则决策`（MCDM）。\n\n## 转向传统的 MCDM\n\
  \n你可以将 `MCDM` 方法应用于从股票投资组合管理到时尚趋势评估，从疾病爆发控制到土地开发决策的任何领域。只要你有两个或多个需要作为决策依据的标准，你就可以使用\
  \ `MCDM` 方法来帮助你评估替代方案。\n\n要使用多准则决策，必须满足以下两个假设：\n\n*   **多准则评估：** 你必须有多个一个准则需要优化。\n\
  *   **零和系统：** 针对一个标准的优化必须以牺牲至少另一个其他标准为代价。这意味着准则之间存在权衡——在一个标准上的获得意味着在至少另一个标准上的失去。\n\
  \n关于 `MCDM` 的另一个重要一点是，它的特征是二元成员性。在数学中，`set` 是一组具有相似特征的数字。在传统的集合理论中，成员性是`binary`的——换句话说，一个个体要么是集合的成员，要么不是。如果个体是成员，则用数字\
  \ `1` 表示，代表“是”；如果不是成员，则用数字 `0` 表示，代表“否”。\n\n掌握 `MCDM` 的最好方法是观察它是如何用于解决现实问题的。`MCDM`\
  \ 通常用于投资组合理论。单个金融工具的定价通常反映了你所承担的风险水平，但整个投资组合可以是几乎无风险投资（例如美国政府债券）与低、中等、高风险投资的混合。你的风险厌恶程度决定了你投资组合的总体特征。高风险厌恶型投资者寻求更安全、收益更薄的投资，而风险厌恶程度较低的投资者则选择风险更高、收益更厚的投资。在评估潜在投资的风险过程中，你可能会考虑以下标准：\n\
  \n*   **收益增长潜力：** 使用二元变量对收益增长潜力进行评分，你可以说，落入特定收益增长潜力阈值的投资被评为 `0`（即“否——潜力不足”）；任何高于该阈值的投资都得\
  \ `1` 分（即“是——潜力足够”）。\n*   **收益质量评分：** 使用二元变量对收益质量评分进行评分，你可以说，落在收益质量特定评级内的投资被评为 `1`（即“是——评分足够”）；否则，它得\
  \ `0` 分（即“否——其收益质量评分不够”）。\n    对于你们这些非华尔街的人士来说，`earnings quality`指的是用于确定公司报告收益的可靠性的各种衡量标准；这些标准试图回答这样一个问题：“这些报告数据是否通过了嗅觉测试（是否合理）？”\n\
  *   **股息表现：** 使用二元变量对股息表现进行评分，你可以说，当投资未能达到设定的股息表现阈值时，它得 `0` 分（即“否——股息表现不够”）；如果它达到或超过了该阈值，它得\
  \ `1` 分（即“是——表现足够”）。\n\n想象你正在评估 20 不同的潜在投资。在这次评估中，你会为每项投资的每个标准进行评分。为了排除糟糕的投资选择，只需将每个替代方案的标准分相加，然后放弃任何总分未达到\
  \ `3` 分的投资——剩下的就是那些落在特定收益增长潜力阈值内、具有良好收益质量且股息表现达到你接受水平的投资。\n\n![Tip](img/tip.png)若想进行一些多准则决策的实践练习，请访问本书的配套网站（`www.businessgrowth.ai`](http://www.businessgrowth.ai)）并查看我在那里留给你的\
  \ `MCDM` 练习题。\n\n## 关注模糊 MCDM\n\n如果你更倾向于在一个范围内评估适用性，而不是使用 `0` 或 `1` 的二元成员性术语，你可以使用`模糊多准则决策`（FMCDM）来实现。通过\
  \ `FMCDM`，你可以评估与 `MCDM` 相同的所有类型的问题。`fuzzy`（模糊）一词是指用于评估替代方案的标准提供了一个接受范围——而不是与传统 `MCDM`\
  \ 相关的二元的、清晰的集合标准。基于模糊准则的评估会导致一系列潜在结果，每种结果作为解决方案都有其自身的适用水平。\n\n![Tip](img/tip.png)`FMCDM`\
  \ 的一个重要特征：你可能会有一个多个模糊准则列表，但这些标准在你的评估中可能并不具有相同的重要性。为了修正这一点，只需为准则分配权重以量化它们的相对重要性。\n\
  \n## 引入回归方法\n\n回归类机器学习算法从统计领域引入，旨在为数据科学家提供一套描述和量化数据集中变量之间关系的方法。如果你想确定数据中变量之间相关性的强度，请使用回归技术。\n\
  \n![Warning](img/warning.png)至于使用回归从历史值预测未来值，尽管可以这样做，但要小心：回归方法假设变量之间存在因果关系，但目前的情况总是处于变化之中。从历史值预测未来值将产生错误的结果。\n\
  \n在本节中，我将为你详细介绍线性回归、逻辑回归和普通最小二乘法。\n\n### 线性回归\n\n`Linear regression`（线性回归）是你可以使用的一种机器学习方法，用于描述和量化你的目标变量\
  \ `y`——统计术语中的“预测变量”）与你选择作为预测变量的数据集特征（在机器学习中通常标记为 `dataset X`）之间的关系。当你只使用一个变量作为预测变量时，线性回归就像初中代数公式\
  \ `y = mx + b` 一样简单。线性回归的一个经典例子是它在预测房价中的应用，如图 4-6。你也可以使用线性回归来量化数据多个变量之间的相关性——被称为多元线性回归。不过，在使用线性回归感到过度兴奋之前，确保你已经考虑了它的局限性：\n\
  \n*   线性回归仅适用于数值变量，不适用于分类变量。\n*   如果数据集存在缺失值，将会产生问题。在尝试构建线性回归模型之前，务必处理你的缺失值。\n*\
  \   如果你的数据存在离群值，模型将产生不准确的结果。在继续之前检查离群值。\n*   线性回归假设数据集特征与目标变量之间存在线性关系。\n*   线性回归模型假设所有特征都是相互独立的。\n\
  *   预测误差，即 `residuals`（残差），应呈正态分布。\n\n\n\n\n\n![Credit: Python for Data Science\
  \ Essential Training Part 2, LinkedIn.com ¶ FIGURE 4-6: Linear regression used to\
  \ predict home prices based on the number of rooms in a house.](img/9781394297009-fg0406.png)\n\
  \nCredit：Python for Data Science Essential Training Part 2, [`LinkedIn.com`](http://LinkedIn.com)\
  \ ¶ 图 4-6： 根据房屋房间数量预测房价的线性回归。\n\n![Remember](img/remember.png)**记住数据集大小！** 别忘记数据集的大小！一个通用的经验法是，如果你希望使用线性回归生成可靠的结果，那么每个预测特征至少应该有\
  \ 20 个观测值。\n\n### 逻辑回归\n\n逻辑回归是一种机器学习方法，你可以用它根据所选择的特征来估计分类目标变量的值。你的目标变量应该是数值型的，并且应该包含描述目标类别或范畴的值。逻辑回归的一个酷炫之处是，它除了可以预测目标变量中观测值的类别外，还能指示每个估计值的概率。虽然逻辑回归类似于线性回归，但它的要求更简单，体如下：\n\
  \n- 特征与目标变量之间不需要存在线性关系。\n- 残差不需要符合正态分布。\n- 预测特征不要求符合正态分布。\n\n在决定逻辑回归是否是你的合适选择时，请考虑以下局限性：\n\
  \n- 缺失值应该被处理或删除。\n- 你的目标变量必须是二元的或序数的。\n\n![Remember](img/remember.png)二分类为“是”分配\
  \ 1，为“否”分配 0。\n- 预测特征应该是相互独立的。\n\n逻辑回归比线性回归需要更多的观测值才能产生可靠的结果。经验法规则是，如果你希望生成可靠的结果，每个预测特征至少应该有\
  \ 50 个观测值。\n\n![Tip](img/tip.png)预测*泰坦尼克号*上的幸存者是学者学习逻辑回归的经典练习题。你对其进行练习，并在 Kaggle\
  \ 上看到许多该问题的求解示例（[`www.kaggle.com/c/titanic`](https://www.kaggle.com/c/titanic)`）。\n\
  \n## 普通最小二法回归方法\n\n*普通最小二法* (OLS) 是一种对数据集拟合线性回归线的统计方法。通过 OLS，你通过对描述数据点与最佳拟合线之间距离的垂直距离值进行平方，将这些平方距离相加，然后调整最佳拟合线的位置，使得平方距离之和值最小。如果你想构建一个接近你数据的函数，请使用\
  \ `OLS`。\n\n![Remember](img/remember.png)一如既往，不要期望实际值与回归预测的值完全相同。回归预测的值值仅仅是模型中与实际值最相似的估计值。\n\
  \n`OLS` 对于对包含多个独立变量的模型拟合回归线特别有用。通过这种方式，你可以使用 `OLS` 从数据集特征中估计目标值。\n\n![Warning](img/warning.png)当使用\
  \ `OLS` 回归方法拟合具有多一个独立变量的回归线时，变量中的两个或多个之间可能会相互关联。当两个或多个独立变量彼此存在强相关时，这被称为*多重共线性*。当这两个或多个独立变量被分开检查时，多重共线性往往会影响它们作为预测变量的可靠性。幸运的是，当从整体考虑时，多重共线性并不会降低模型的预测可靠性。\n\
  \n## 检测离群值\n\n许多统计和机器学习方法假设你的数据没有离群值。删除离群值是为分析准备数据的重要部分。在本节中，你将看到用于发现数据中离群值的各种方法。\n\
  \n### 分析极值\n\n*离群值*是指与大多数数据点显著不同的值。发现离群值是重要的，因为如果不加处理，它们会偏偏分布，使方差看起来虚高并导致误导。\n\n\
  你可以使用离群值检测来发现异常情况。离群值属于以下三类：\n\n- **点离群值**（Point）：与变量正常范围相比的异常数据点。\n- **情境离群值**（Contextual）：仅在特定情境下是异常的数据点。例如，如果你正在检查奥兰多\
  \ 1 月的数据，并看到 23 摄氏度的读数，这将是异常的，因为那里的平均温度是 70 摄氏度。但如果你查看阿拉斯加 1 月的数据，23 摄氏度完全并不异常。\n\
  - **集体离群值**（Collective）：这些离群值彼此相邻，具有相似的异常值。\n\n你可以通过单变量或多变量方法来检测离群值，下两个节所示。\n\n\
  ### 使用单变量分析检测离群值\n\n单变量离群值检测是指单独查看数据集中的特征并检查异常值。你可以从以下两种简单方法中选择：\n\n- 图基离群值标记\n\
  - 图基箱线图\n\n图基箱图是一种探索性数据分析技术，通过分位数来可视化变量内部的数据分布。正如你可能猜到的，图基箱图是以其发明者约翰·图基（John Tukey）命名的，他是一位在\
  \ 20 世纪 6070 年代工作的美国数学家。图基离群值标记是指将箱线图最小值和最大值之外的数据点标记为离群值。\n\n使用图基方法手动计算、识别和标记离群值很麻烦，但如果你想这样做，诀窍在于观察最小值和最大值距离\
  \ 25 分位数和 75 分位数有多远。第一四位数和第三四位数之间的距离被称为*四分位间距*（`IQR`），它描述了数据的离散程度。当你查看一个变量时，考虑它的离散程度、`Q1/Q3`\
  \ 值以及它的最小值和最大值，以决定该变量是否存在离群值疑。\n\n![Tip](img/tip.png)这是一个很好的经验法则：\n\n```a = Q1 –\
  \ 1.5 * IQR\n```\n\n和\n\n```\nb = Q3 + 1.5 * IQR\n```\n\n如果你的最小值小于 `a`，或者你的最大值大于\
  \ `b`，那么该变量可能有离群值。\n\n另一方面，使用 Python 或 R 生成图基箱线图并检测离群值是非常简单的。每个箱线图都有设置在 `1.5 * IQR`\
  \ 的须线。位于这些须线之外的值都是离群值。[图 4-7] 显示了在 Python 中生成的图基箱线图中显示的离群值。\n\n### 使用多变量分析检测离群值\n\
  \n\n\n\n有时，离群值只出现在不同变量数据点的组合中。这些离群值会对机器学习算法产生破坏性影响，因此检测并移除它们至关重要。你可以使用离群值的多元分析来实现这一点。多元离群值检测涉及同时考虑两个或多个变量，并共同检查它们是否存在离群值。你可以使用以下方法之一：\n\
  \n*   散点图矩阵\n*   箱线图\n*   基于密度的空间噪声聚类 (`DBScan`)，如第 5 章中讨论的\n*   主成分分析 (`PCA`)，如图\
  \ 4-8 所示\n\n![Credit: Python for Data Science Essential Training Part 1, LinkedIn.com\
  \ ¶ 图 4-7: 使用 Tukey 箱线图识别离群值。](img/9781394297009-fg0407.png)\n\nCredit: Python for\
  \ Data Science Essential Training Part 1, [`LinkedIn.com`](http://LinkedIn.com)\
  \ ¶ 图 4-7： 使用 Tukey 箱线图识别离群值。\n\n![Credit: Python for Data Science Essential Training\
  \ Part 2, LinkedIn.com ¶ 图 4-8: 使用 PCA 识别离群值。](img/9781394297009-fg0408.png)\n\n\
  Credit: Python for Data Science Essential Training Part 2, [`LinkedIn.com`](http://LinkedIn.com)\
  \ ¶ 图 4-8： 使用 PCA 识别离群值。\n\n## 引入时间序列分析\n\n`time series` 只是随时间变化的属性值集合。进行时间序列分析是为了根据过去的观测数据预测该指标的未来实例。要根据数据集中的数据预测或估计未来值，请使用时间序列技术。\n\
  \n### 识别时间序列中的模式\n\n时间序列表现出特定的模式。请查看图 4-9 以更好地理解这些模式。`Constant`（常数）时间序列随时间推移保持在大致相同的水平，但受到一些随机误差的影响。相比之下，`trended`（趋势）序列显示出稳定的向上或向下线性移动。无论是常数还是趋势序列，时间序列有时也会表现出\
  \ `seasonality`（季节性）——即在一年中季节性反复出现的可预测的周期性波动。季节性时间序列的一个例子是考虑许多企业在假日期间销售额的增长。\n\n\
  ![图 4-9: 时间序列所表现模式的对比。](img/9781394297009-fg0409.png)\n\n图 4-9： 时间序列所表现模式的对比。\n\n\
  如果你在模型中包含了季节性，请在合适的地方将其整合到季度、每月甚至每半年的周期中。时间序列可能会显示出 `nonstationary processes`（非平稳过程）——即与季节性无关的不可预测的周期性行为，这种行为是由经济或行业状况引起的。由于它们是不可预测的，因此非平稳过程无法进行预测。\n\
  \n![Tip](img/tip.png)如需帮助开始使用 R，请务必访问 [`https://growth.ai`](https://growth.ai/)\
  \ 上的培训。\n\n### 单变量序列建模\n\n类似于多元分析是对多个变量的分析，`univariate analysis`（单变量分析）是对单个变量的分析。自回归移动平均\
  \ (`ARMA`) 是一类预测方法，它们假设之前的观测值是未来值的良好预测器。正如名称所示，`ARMA` 结合了 `autoregressive`（自回归）和\
  \ `moving average`（移动平均）。如果你正在寻找一个适用于小型数据集的简单模型，那么该模型并不合适。在图 4-10 中，你可以看到模型拟合得很好。\n\
  \n![Remember](img/remember.png)使用 ARMA 获得可靠的结果。\n\n# 通过分组实现准确预测\n\n## 本章内容\n\n*\
  \   理解聚类、分类和其他分组算法的基础知识\n*   使用 `k-means` 算法和核密度估计对数据进行聚类\n*   在决策树和随机森林之间进行选择\n\
  *   了解层次聚类和邻域聚类算法\n*   通过最近邻算法\n\n\n\n\n\n聚类是机器学习的两种主要类型之一：无监督机器学习。在`无监督机器学习`中，数据集中的数据是没有标签的。由于数据没有标签，算法必须使用推断方法来发现原始数据集中的模式、关系和相关性。为了充分测试聚类算法，我将使用来自世界银行开放数据集中关于国家收入和教育的现成样本数据集。这些数据显示了每个国家底层\
  \ 10% 人口所得的收入百分比，以及每个国家完成小学教育的儿童百分比。\n\n![Warning](img/warning.png)在关于完成小学教育儿童百分比的数据集中，某些报告的百分比超过了\
  \ 100%。这是因为某些国家按不同的年龄段统计这一数据，但数据经过了`normalized`（归一化）处理，使得百分比分布在数据集代表的国家范围内按比例缩放。换句话说，尽管总比例超过了\
  \ 100%，但这些值已经过`normalized`处理，使它们相互成比例，你进行的是同等标准的比较。因此，某些国家报告的完成率大于 100% 的事实对你在本章中进行的分析不会产生不利影响。\n\
  \n### 了解聚类算法\n\n你使用聚类算法将无标签的数据集划分为在预定义特征上最相似的观测值簇。如果你有一个描述一组观测值多个特征的数据集，并且想根据这些特征的相似性对观测值进行分组，请使用聚类算法。\n\
  \n![Tip](img/tip.png)在本书的配套网站（[`https://businessgrowth.ai`](https://businessgrowth.ai/））上，你可以找到一个关于如何在\
  \ Python 中中使用聚类进行热门用例——用户画像分析和细分的免费培训和代码演示。\n\n你可以根据你希望划分数据集的方式选择各种聚类方法。聚类算法的两种主要类型是：\n\
  \n* `Partitional`（划分型）：仅创建一个单一簇集的算法。\n* `Hierarchical`（层次型）：创建相互独立的嵌套簇集的算法，每个簇都有自己的层次层级。\n\
  \n你可以在本章的后部分部分介绍这两种方法，但现在请先看图 5-1，这是国家收入和教育数据集的散点图。\n\n在无监督聚类中，你从这些数据开始，然后将其划分为若干子集。这些子集被称为`clusters`（簇），由彼此最相似的观测值组成。在图\
  \ 5-1 中，散点图似乎至少有两个簇，可能是三个——底部是一个收入和教育程度较低的簇，然后高教育国家看起来可能被分为低收入和高收入两个。\n\n图 5-2 显示了对该数据集进行`eyeballing`（肉眼估算）簇的结果。\n\
  \n![Tip](img/tip.png)虽然你可以对簇进行视觉估算，但在处理大得多的数据集时，通过算法为你生成簇，可以获得准确得的结果。视觉估算是一种粗略的方法，仅对复杂性极小的较小数据集有用。算法能产生精确的、可重复的结果，你可以使用算法根据数据集中多个维度的数据生成簇。\n\
  \n![FIGURE 5-1: 一个简单的散点图。](img/9781394297009-fg0501.png)\n\nFIGURE 5-1: 一个简单的散点图。\n\
  \n![FIGURE 5-2: 一个简单的散点图，显示了肉眼估算的聚类结果。](img/9781394297009-fg0502.png)\n\nFIGURE\
  \ 5-2: 一个简单的散点图，显示了肉眼估算的聚类结果。\n\n在满足以下特征的情况下，聚类算法是合适的：\n\n* 你知道并理解你正在分析的数据集。\n*\
  \ 在运行聚类算法之前，你对子集（`clusters`）的性质没有确切的想法。通常在运行算法之前，你甚至不知道数据中有多少个子集。\n* 子集（`clusters`）仅由你分析的单一数据集决定。\n\
  * 你的目标是确定一个描述该数据集（且仅限该数据集）子集的模型。\n\n![Tip](img/tip.png)如果你在构建模型后向数据添加了更多数据，请务必从头开始构建模型，以产生更完整准确的模型结果。\n\
  \n#### 检查聚类相似性指标\n\n聚类基于计算两个观测值之间的相似性或差异。如果你的数据集是`numeric`（仅由数值特征组成）并且可以在`n` 维图中表示，你可以使用各种几何指标来缩放你的多维数据。\n\
  \n![Remember](img/remember.png)`n`-维图是一种多维散点图，你可以用它绘制 `n` 数量维度的数据。\n\n以下是一些用于计算观测值之间距离的常用几何指标：\n\
  \n* `Euclidean`（欧几里得距离）：欧几里得平面点之间距离的测量。\n* `Manhattan`（曼哈顿距离）：点之间距离的测量，两点点笛卡尔坐标差的绝对值的和。\n\
  * `Minkowski distance`（闵可夫斯距离）：欧几里得和曼哈顿距离指标的推广。通常这些指标可以相互替使用。\n* `Cosine similarity`（余弦相似性）：余弦指标根据数据点的方向（通过计算它们之间角度的余弦值）来衡量相似性。\n\
  \n最后，对于非数值数据，你可以使用像 Jaccard 距离（杰卡距离）这样的指标，它是一种比较观测值共同特征数量的索引。例如，为了说明杰卡距离，请看这些字符串：\n\
  \n```\nSaint Louis de Ha-ha, Quebec\nSt-Louis de Ha!Ha, QC\n```\n\n这些字符串有什么共同特征？它们之间有什么区别？Jaccard\
  \ 指标生成一个量化字符串相似性的数值索引。\n\n## 在数据中识别簇\n\n你可以使用许多算法进行聚类，但 `k`-means 算法的速度和鲁棒性使其成为经验数据科学家的热门选择。作为替代，核密度估计方法、层次算法和邻域算法也可以帮助你识别数据集中的簇。\n\
  \n### 使用 k-means 算法进行聚类\n\nk-means 聚类算法是一种简单、快速的无监督学习算法，你可以用它预测数据集内部分组。在开始学习 k-means\
  \ 聚类之前，首先需要熟悉`centroid`（质心）的概念。`centroid` 是任何给定簇中最具代表性的点。在 `k-means` 中，你定义模型在生成预测时应该寻找的质心数量。质心数量由\
  \ `k` 表示，簇通过计算观测值到质心的最近平均值（通过欧几里得距离测量）来形成。\n\n![Warning](img/warning.png)由于数据集的特征尺度通常不同，尺度的差异会扭曲这种距离计算的结果。为了避免这个问题，在使用\
  \ k-means 预测数据分组之前，请对变量进行缩放。\n\n\n\n\n\n聚类的质量在很大程度上取决于你指定的 `k` 值的正确性。如果你的数据是二维或三维的，可以通过肉眼判断确定\
  \ `k` 值的合理范围。在世界银行收入与教育数据散点图中进行目测法聚类（请参考图 5-2），对 `k` 值的视觉估计等同于三个簇，即 `k = 3`。\n\n\
  ![Remember](img/remember.png)\n\n在定义 `k` 值时，可以通过观察散点图（如果你的数据集是二维或三维的）或通过寻找数据集变量中明显且显著的分组来选择质心数量。你可以根据已知数据集中已存在的分组数量，或者你希望在数据集中存在的分组数量来选择质心数量。无论情况如何，在选择要建模的聚类数量时，请利用你对数据集的主观认知。\n\
  \n然而，如果你的数据集超过了三个维度，你可以使用计算方法来生成一个良好的 `k` 值。其中一种方法是`轮廓系数`（该方法计算每个点到该簇内所有其他点的平均距离，然后将该值与每个其他簇中每个点的平均距离进行比较）。幸运的是，由于`k-means`算法效率很高，它不需要大量的计算机处理能力，你可以轻松地为广泛的\
  \ `k` 值计算此系数。\n\n`k-means`算法的工作原理是将样本簇中心放置在 `n` 维图中，然后评估向任何单一方向移动它们是否会产生`密度`更高的新中心——换句话说，更多的观测值靠近它。质心从低密度区域移动到高密度区域，直到所有中心都位于局部最大密度区域内（簇的真实中心，每个簇都有最大数量的数据点靠近其簇中心）。尽可能，请尝试自己手动放置质心。如果这不可能，只需随机放置质心并运行几次算法，看看最终得到相同簇的频率有多高。\n\
  \n`k-means`算法的一个缺点是，它可能会通过将簇中心放置在局部最小密度区域而产生错误结果。这种情况发生在质心丢失在低密度区域时（也就是说，图中绘制点相对较少的区域），且算法驱动的方向性移动（旨在增加点密度的移动）在遥远的簇之间开始反弹和震荡。在这种情况下，质心会被困位于两个高点密度区之间的低密度空间中。这导致了围绕在低局部最小密度区域收敛的中心的错误簇。讽刺的是，当底层数据聚类效果非常良好、即紧凑密集的区域被宽阔稀疏的区域隔开时，这种情况最容易发生。\n\
  \n![Tip](img/tip.png)通过本书配套网站托管的免费 `k-means` 聚类代码演示来获得实践经验：[`https://businessgrowth.ai`](https://businessgrowth.ai/)。\n\
  \n![Tip](img/tip.png)如需亲自尝试，可以使用 R 语言的 `cluster` 包或 Python 的 `scikit-learn` 库使用\
  \ `k-means` 方法开始对数据进行聚类。有关 R 的 `cluster` 包的更多信息，请查看[`https://cran.r-project.org/web/packages/cluster/cluster.pdf`](https://cran.r-project.org/web/packages/cluster/cluster.pdf)；有关\
  \ `scikit-learn` 的更多信息，请查看[`https://scikit-learn.org`](https://scikit-learn.org/)。\n\
  \n### 使用核密度估计估计聚类\n\n如果 `k-means` 算法不吸引你，另一种识别数据中簇的替代方法是使用密度平滑函数。`核密度估计`(KDE)就是这种平滑方法；它通过在数据集中的每个数据点上放置一个`核`（用于量化密度的加权函数），然后相加这些核来生成整个区域的核密度估计。点密度较大的区域相加后得到较大的核密度，而点密度较小的区域相加后得到较小的核密度。\n\
  \n由于核平滑方法不依赖质心的放置和聚类技术来估计簇，因此它们没有通过将中心放置在局部最小密度区域而产生错误簇的风险。`k-means`算法在簇之间生成硬性定义，而\
  \ `KDE` 生成的是渐进式的变化。在图 5-3 中，你可以看到空白区域已经减少。当你观察该图时，很明显你可以看到至少三个簇。\n\n![FIGURE 5-3:\
  \ 世界银行收入与教育散点图的 KDE 平滑。](img/9781394297009-fg0503.png)\n\nFIGURE 5-3: 世界银行收入与教育的\
  \ KDE 平滑。\n\n### 使用层次算法进行聚类\n\n层次聚类算法是 `k-means` 的另一种替代方案。与 `k-means` 聚类相比，层次聚类算法是一种更慢、更笨拙的聚类算法。它通过计算距离并在每个观测值与其最近邻居之间生成连接来预测数据集中的分组。如果你正在进行统计研究或分析生物或环境数据，层次聚类可能是你理想的机器学习解决方案。\n\
  \n为了直上检查层次聚类的结果，请生成一个`树图`（一种描述数据簇中组之间相似性和分支的可视化工具）。你可以使用几种不同的算法来构建树图，你选择的算法决定了分支在簇内何时以及如何发生。此外，树图可以以`自下而上`的方法（通过组合点对然后将它们聚合为越来越大的组）或`自上而下`的方法（从完整数据集开始并将其分成越来越小的组）构建。查看树图结果使得为你的数据集决定合适的聚类数量变得更容易。在图\
  \ 5-4 所示的树图示例中，数据集似乎有三个或四个簇。\n\n![FIGURE 5-4: 样本树图的示意布局。](img/9781394297009-fg0504.png)\n\
  \nFIGURE 5-4: 样本树图的示意布局。\n\n在层次聚类中，观测值之间的距离通过三种不同的方式衡量：`欧几里得`、`曼哈顿`或`余弦`。此外，连接由三种不同的方法形成：`沃德`、`完成`和`平均`。在决定使用什么距离和连接参数时，试错法是一种简单的方法。只需尝试每种组合，然后比较所有的模型结果。选择预测结果最准确的模型。\n\
  \n\n\n\n分层聚类算法比 `k`-means 算法需要更多的计算资源，因为在分层聚类的每一次迭代中，必须将许多观测值与其他观测值进行比较。然而，它的优势在于，分层聚类算法不会受到局部最小密度区域中心收敛引起错误的影响（如\
  \ `k`-means` 聚类算法所示）。\n\n![Warning](img/warning.png)如果你正在处理大型数据集，请注意！分层聚类的速度可能`太`慢了。\n\
  \n![Tip](img/tip.png)如果你想开始学习分层聚类算法，可以查看 R 的 `hclust` 包或（再次提到）Python 的 `scikit-learn`\
  \ 库。（如果你对 `hclust` 感奇，请查看此页面[`https://stat.ethz.ch/R-manual/R-patched/library/stats/html/hclust.html`](https://stat.ethz.ch/R-manual/R-patched/library/stats/html/hclust.html)。）\n\
  \n当聚类呈`非球形`时（一种配置，即聚类中的某些点距离另一个聚类点的距离比距离其自身聚类中心的距离还要近），`k`-means 和分层聚类算法的表现都不佳。如果你的数据集显示出非球形聚类，你可以使用邻域聚类算法（如\
  \ `DBScan`）来确定每个点是靠近同聚类中的邻居，还是靠近其他聚类的邻域观测值。图 5-5 展示了使用 `DBScan` 邻域聚类算法检测经典数据集“Iris”示例，下一节将详细介绍邻域聚类。\n\
  \n### 尝试 DBScan 邻域\n\n*基于密度的应用空间聚类*（`DBScan`）是一种无监督学习方法，通过在聚类`核心样本`（数据集的密集区域）的同时标记`非核心样本`（数据集中相对稀疏的部分）来工作。它是一种邻域聚类算法，适用于同时检查两个或多个变量以识别离群值。它对于识别`集体离群值`（彼此相邻的离群值，它们的值对于该变量的大部分值来说都是异常的）特别有用。图\
  \ 5-5 展示了 `DBScan` 的工作。\n\n![Remember](img/remember.png)通过 `DBScan`，你采用迭代、试错的方法来寻找待检查的理想离群值数量。在实验\
  \ `DBScan` 模型时，离群值应占数据集观测值的 5% 或更少。你必须调整模型参数，直到分离出这一小部分观测值组。\n\n![Credit: Python\
  \ for Data Science Essential Training Part 2, LinkedIn.com ¶ FIGURE 5-5: Using DBScan\
  \ to detect outliers (in black) within the Iris dataset.](img/9781394297009-fg0505.png)\n\
  \n图片来源：Python for Data Science Essential Training Part 2, [`LinkedIn.com`](http://LinkedIn.com)\
  \ ¶ 图 5-5: 使用 `DBScan` 检测 Iris 数据集中的离群值（黑色部分）。\n\n邻域聚类算法通常是有效的，但它们存在以下两个缺点：\n\n\
  *   **邻域聚类的计算开销可能很高。** 在该方法的每一次迭代中，每个数据点都可能必须与数据集中的其他数据点进行比较。\n*   **对于邻域聚类，你可能需要为模型提供预期聚类大小和聚类密度的经验参数值。**\
  \ 如果对其中任一参数估计错误，算法将错误识别聚类，你必须重新开始整个长时间的过程来解决问题。如果你选择使用 `DBScan` 方法，则要求指定这些参数。（如果你不确定这些参数，可以先尝试默认值。）\n\
  \n![Tip](img/tip.png)如果你不确定这些参数，可以先尝试默认值。\n\n\n\n\n*   `Noisy data`（具有不可解释的随机波动的数据）\n\
  *   包含不重要或无关特征的数据集\n*   包含缺失值的数据集\n\n为了尽可能简化这一介绍，我将坚持于解释 `k`-NN 分类算法。不过，`k`-NN 涉及的概念有点棘手，因此在深入介绍\
  \ `k`-NN 方法之前，我将先向你介绍更简单的平均最近邻居方法。\n\n### 了解分类算法\n\n你可能听说过分类，并认为它和聚类是同一个概念。许多人都是这么想的，但事实并非如此。在`classification`\
  \ 中，你的数据是有`labeled`的，因此在分析它之前，你已经知道它应该被分为几类。你也已经知道给每个数据点分配哪一类。相比之下，在`clustering`\
  \ 方法中，你的数据是未标记的，所以你对划分多少个类合适没有预定义的概念。你必须依靠聚类算法以最合适的方式对数据排序并聚类。\n\n通过分类算法，你利用对现有标记数据集的了解，生成一个用于分类未来观测值的预测模型。如果你的目标是使用数据集及其已知子集来构建一个模型，以预测未来观测值的分类，你将希望使用分类算法。在实施监督分类时，你已经知道了数据集的`labels`\
  \ —— 即你用于将观测值划分为类别的标准。分类可以帮助你观察数据与数据集预定义类别的拟合程度，从而让你能够构建一个用于分类未来观测值的预测模型。\n\n图 5-7\
  \ 展示了按地理区域对世界银行的收入和教育数据集进行分类的情况。\n\n![FIGURE 5-7：使用大洲特征对世界银行数据进行分类。](img/9781394297009-fg0507.png)\n\
  \n图 5-7： 使用大洲特征对世界银行数据进行分类。\n\n在图 5-7 中，你可以看到某些某些情况下你通过聚类技术识别出的子集确实对应大洲类别，但在其他情况下却并非如此。例如，看看非洲观测值中间那个孤独的亚洲国家。那是不丹。你可以使用此数据集中的数据构建一个模型，来预测新观测值的大洲类别，但如果你引入一个统计数据与不丹相似的新国家数据点，根据你如何定义模型，该国家可能被归类为亚洲洲，也可能被归类为非洲洲。\n\
  \n现在想象一种情况：原始数据中不包含不丹，而你使用模型来预测不丹作为新数据点所属的大洲。在这种情况下，模型将错误地预测不丹属于非洲洲。这就是`model overfitting`（模型过拟合）的例子——模型紧密地拟合了底层数据集及其噪声或随机误差，以至于模型作为新观测值的预测器时表现糟糕。\n\
  \n为了避免模型过拟合，请将数据划分为训练集和测试集。典型的比例是将 70% 分给训练集，30% 分给测试集。通过分类算法，你利用对现有标记数据集的了解，生成一个用于分类未来观测值的预测模型。如果你的目标是使用数据集及其已知子集来构建一个模型，以预测未来观测值的分类，你将希望使用分类算法。在实施监督分类时，你已经知道了数据集的`labels`\
  \ —— 即你用于将观测值划分为类别的标准。分类可以帮助你观察数据与数据集预定义类别的拟合程度，从而让你能够构建一个用于分类未来观测值的预测模型。\n\n###\
  \ 使用最近邻分析理解数据\n\n最近邻方法的核心原理是：获取一个观测值属性（或特征）的值——也称为`attribute value`（属性值），然后找到另一个属性值在数值上与其最接近的观测值。注意，相似性比较可以基于任何定量属性，无论是距离、年龄、收入、体重或其他任何可以描述你所调查观测值的因素。\n\
  \n\n\n\n\n在我的星巴克类比中，手机报告给你的商店 `x`, `y`, `z` 坐标与你当前位置的 `x`, `y`, `z` 坐标最相似。换句话说，它们在实际物理距离上最近。比较的量化`attribute`是距离，你当前的位置是`observation`，而报告的星巴克咖啡馆就是`most\
  \ similar observation`。\n\n![Remember](img/remember.png)\n\n现代近邻分析几乎总是使用计算算法执行。近邻算法被称为`single-link\
  \ algorithm`（单链算法）：如果类之间共享至少一个`connective edge`（换句话说，共享的边界线），算法就会合并这些类。在接下来的章节中，你可以学习平均近邻算法和`k`-最近邻算法的基础知识。\n\
  \n## 使用平均近邻算法对数据进行分类\n\n平均近邻算法是基础但强大的分类算法。它们对于寻找和分类平均最相似的观测值有用。平均近邻算法用于模式识别、化学和生物结构分析以及空间数据建模。它们最常用于生物学、化学、工程学和地球科学。\n\
  \n在本节中，你可以了解如何使用平均近邻算法比较多个观测值之间的多个属性，并识别哪些观测值最相似。你还可以了解如何使用平均近邻算法来识别数据集中的显著模式。\n\
  \n使用平均近邻算法的目的是根据它们之间算术距离的平均值对观测值进行分类。如果你的目标是通过平均相似性识别并分组观测值，那么平均近邻算法是一个实现该目标的有效方法。\n\
  \n对于近邻分类器，数据集由观测值组成，每个观测值都有一个`x`-和`y`-变量。`x`-变量代表输入值或`feature`（特征），而`y`-变量代表数据标签或目标变量。为了理清这些术语，请考虑以下示例。\n\
  \n假设你亲切的社区业务分析师业务分析师 Stu 正在使用平均近邻算法对其组织数据库中的数据集进行分类分析。Stu 正在根据以下五个特征对员工进行比较：\n\n\
  *   年龄\n*   子女数量\n*   年收入\n*   资历\n*   退休资格\n\n在这里你可以看到 Stu 组织中的每个员工都由一个五维`tuple`表示——一个有限的有序列表（或`sequence`）：\n\
  \n*   **员工 Mike:** (34, 1, 120000, 9, 0)\n*   **员工 Liz:** (42, 0, 90000, 5, 0)\n\
  *   **员工 Jin:** (22, 0, 60000, 2, 0)\n*   **员工 Mary:** (53, 3, 180000, 30, 1)\n\n\
  这些元组是根据表 5-1 所示数据集中的数据创建的。每个元组包含以下五个预测特征的数据：年龄、子女数量、年收入、资历和退休资格。业务分析师 Stu 计算了每个员工之间的平均算术差值。图\
  \ 5-8 显示了每个员工之间的计算距离。\n\nTABLE 5-1 业务分析师 Stu 的员工数据\n\n| **员工姓名** || **年龄** || **子女数量**\
  \ || **年收入** || **资历** || **退休资格** |\n| --- | --- | --- | --- | --- | --- |\n| Mike\
  \ || 34 || 1 || $120,000 || 9 || 0 |\n| Liz || 42 || 0 || $90,000 || 5 || 0 |\n\
  | Jin || 22 || 0 || $60,000 || 2 || 0 |\n| Mary || 53 || 3 || $180,000 || 30 ||\
  \ 1 |\n\n在业务分析师 Stu 拥有员工之间的这种算术距离测量后，他通过对这些距离取平均值来找到`average nearest neighbor`。图\
  \ 5-8 显示了每个员工之间的计算距离。\n\nTABLE 5-1 业务分析师 Stu 的员工数据\n\n在业务分析师 Stu 拥有员工之间的这种算术距离测量后，他通过对这些距离取平均值来找到`average\
  \ nearest neighbor`。\n\n## 使用 K-邻算法进行分类\n\n定义`k`-最近邻的最好方法是将其称为一种监督机器学习分类器，它利用从内部内部记忆的观测值来预测新的、未标记的数据。`k`-NN\
  \ 根据`similarity`（相似性）做出预测——训练观测值与新样本越相似，分类器就越可能为它们分配相同的类别。如果数据集满足以下条件，`k`-NN 效果最好：\n\
  \n*   低噪声\n*   无离群值\n*   已标记\n*   仅由相关特征组成\n*   由可区分组组成\n\n在机器学习更大的背景下，`k`-NN（与所有基于实例的学习分类器一样）被称为`lazy`（懒惰）机器学习算法——换句话说，它几乎没有训练阶段。它只是记忆训练数据，然后将这些信息作为分类新观测值的依据。`k`-NN\
  \ 的目标是根据其 `k`-最近邻的类别来估计查询点 `P` 的类别。\n\n`k`-NN 算法是近邻算法的泛化。它不是考虑最近的一个邻，而是考虑包含 `n`\
  \ 个数据点的数据集中 `k` 个最近的邻——`k` 定义了有多少个最近邻会对分类过程产生影响。在 `k`-NN 中，分类器根据围绕查询点的多数 `k`-最近点中找到分类标签来对查询点\
  \ `P` 进行分类。\n\n\n\n\n\n![Remember](img/remember.png)尽管 `k`-NN 是最简单且最易实现的分类方法之一，但与一些更复杂的机器学习方法相比，它仍然能产生具有竞争力的结果。可能因为其简单性以及所提供的具有竞争力的结果，`k`-NN\
  \ 算法已被学术研究界列为十大最具影响力的数据挖掘算法之一。\n\n### 理解 k-最近邻居算法的工作原理\n\n要使用 `k`-NN，你只需要在样本数据集中任选一个查询点（通常称为\
  \ `P`），然后计算与该点最近的 `k` 个邻点。查询点 `P` 的分类标签与其周围大多数 `k` 个最近邻居点的标签相同。（图 5-10 提供了该过程的俯瞰视图。）\n\
  \n![Remember](img/remember.png)`k`-最近邻居是根据基于另一个定量属性的距离或相似性来量化的。\n\n考虑以下示例：数据集为 `[1,\
  \ 1, 4, 3, 5, 2, 6, 2, 4]`，点 `P` 等于 5。图 5-10 显示了如何将 `k`-NN 应用于此数据集。通过指定 `k` 等于 3，图中显示根据距离计算，点\
  \ 5 有三个最近的邻居。这些邻居是 4、4 和 6。因此，根据 `k`-NN 算法，查询点 `P` 将被分类为 4，因为 4 是距离其最近的 `k` 个点中的多数数。类似地，`k`-NN\
  \ 继续使用相同的多数原则来定义其他查询点。\n\n![Remember](img/remember.png)使用 `k`-NN 时，选择一个能够尽可能减少 `noise`（无法解释的随机波动）的\
  \ `k` 值至关重要。同时，你必须选择一个在选择过程中包含足够数据点的 `k` 值。如果数据点分布不均匀，通常更难预先一个良好的 `k` 值。请注意为你分析的每个数据集选择一个最佳的\
  \ `k` 值。\n\n![图 5-10: k-NN 如何工作。](img/9781394297009-fg0510.png)\n\n图 5-10： `k`-NN\
  \ 如何工作。\n\n![Tip](img/tip.png)与小 `k` 值相比，大 `k` 值往往会产生更少的噪声和类别之间更多的 `boundary smoothing`（更清晰的定义和更少的重叠）。\n\
  \n#### 何时使用 k-最近邻算法\n\n`k`-NN 对`multi-label learning` 特别有用——这是一种监督学习，算法被应用于自动从多个组实例中`learns\
  \ from`（检测模式）。这些集合中的每个组都可能有自己的多个类别。通过多标签学习，算法学习为每个新实例预测多个类别标签。`k`-NN 的问题在于它依赖于`distance`。\n\
  \n### 使用最近邻算法解决现实世界问题\n\n`k`-NN 对`multi-label learning` 特别有用——这是一种监督学习，算法被应用于自动从多个组实例中`learns\
  \ from`（检测模式）。这些集合中的每个组都可能有自己的多个类别。通过多标签学习，算法学习为每个新实例预测多个类别标签。`k`-NN 的问题在于它依赖于`distance`。\n\
  \n### 观察 k-最近邻算法的应用\n\n`k`-NN 对`multi-label learning` 特别有用——这是一种监督学习，算法被应用于自动从多个组实例中`learns\
  \ from`（检测模式）。这些集合中的每个组都可能有自己的多个类别。通过多标签学习，算法学习为每个新实例预测多个类别标签。`k`-NN 的问题在于它依赖于`distance`。\n\
  \n### 观察平均最近邻算法的应用\n\n平均最近邻算法分类和点模式检测可以用于杂货零售，以识别客户购买行为中的关键模式，并通过预测客户行为来增加销售额和客户满意度。考虑以下故事。\n\
  \n\n\n\n# 编码数据洞察与决策引擎\n\n## 本章内容\n\n![Bullet](img/check.png) **上手数据科学的 Python 编程**\n\
  \n![Bullet](img/check.png) **探索数据科学 Python 库**\n\n数据科学涉及对数学、编码和领域专业知识的熟练应用，使数据科学家能够从数据生成可靠且准确的预测。在本章中，我将向你介绍使用\
  \ `Python` 编程的基础概念（例如数据类型、函数和类）。你用这种语言构建的机器学习模型可以作为你为公司构建的人工智能（AI）软件服务（SaaS）产品中的`决策引擎`。我还会介绍一些用于处理数据、执行统计计算、创建数据可视化以及完成其他数据科学任务的优秀\
  \ `Python` 库。\n\n## 了解 Python 如何融入你的数据科学战略\n\n如果你听到并不是所有试图获利的数据项目都都需要数据科学，你会感到惊讶吗？这听起来可能很奇怪，但事实如此！想一想\
  \ `LinkedIn`：想象一下如果平台不允许用户之间直接发送私信，它的实用性会降低多少。这一功能直接提升了用户体验，让用户更频繁地返回，并在平台上保持更长时间的活跃，从而增加了\
  \ `LinkedIn` 平台的整体盈利能力。\n\n用户在平台上活跃的时间越长、返回频率越高，他们就越可能为平台产生收入——无论是通过订阅 `LinkedIn\
  \ Learning`，还是使用 `Open to Work`（这是一个 `LinkedIn` 标识，鼓励招聘人员与他们联系）。（通过 `Open to Work`，联系用户的费用由招聘人员支付，作为对平台用户进行间接变现的一种形式。）流行的\
  \ `LinkedIn Premium` 功能允许用户直接在平台上给其他人留言，无论他们是否认识对方。所有这些变现功能都直接依赖于 `LinkedIn` 的直接消息产品。你知道它是构建在什么之上吗？它是名为\
  \ `Apache Kafka` 的数据工程技术。不是高级的机器学习模型，不是深度学习——只是传统的、经过测试的数据工程（参见第 2 章）。\n\n但对于那些涉及数据科学的营利数据项目，你需要确保有一套完善且有效的数据科学战略来指导项目实施。`数据科学战略`是一项技术计划，规划了领导数据科学项目所需的每一个元素，以增加业务利润能力的方式。由于\
  \ `Python` 是数据科学产生旨在增加利润的预测性洞察的命脉，你很难找到一个它们不适用于有效数据科学战略的地方。\n\n## 使用 Python 进行数据科学\n\
  \n虽然 `Java` 和 `C++` 等流行编程语言非常适合开发独立的桌面应用程序，但 `Python` 的多功能性使其成为处理、分析和可视化数据的理想编程语言。出于这个原因，`Python`\
  \ 在数据科学领域赢得了卓越声誉，在过去的十年里它被广泛采用。`Python` 作为最流行的编程语言之一的地位可以归功于它相对容易学习，并且允许用户仅用几行代码就能完成多任务。\n\
  \n![Tip](img/tip.png) 虽然此本书的设计并不是为了教读者编程原理或机器学习算法的实现，但我已经在本书的配套网站（`https://businessgrowth.org`）上提供了许多实用的代码演示和课程推荐。\n\
  \n\n\n\n要打印变量包含的字符，只需使用预定义的 `print` 函数即可。\n\n![Tip](img/tip.png)\nPython 程序员通常将列表、元组、集合和字典称为数据`structures`，而不是数据`types`。数据`structures`\
  \ 是基本功能单元，用于组织数据，以便你正在编写的程序或应用程序高效地使用它们。\n\n![Remember](img/remember.png)列表、元组、集合和字典是数据结构，但请记住，它们仍然由一个或多个基本数据类型组成（例如，数字和/或字符串）。\n\
  \n## Python 中的列表\n\n`list` 是数字和/或字符串的序列。要创建一个列表，你只需将列表元素（用逗号分隔）放在方括号内。以下是一个基础列表的示例：\n\
  \n```python\n>>> variable2=[\"ID\",\"Name\",\"Depth\",\"Latitude\", \"Longitude\"\
  ]\n>>> depth=[0,120,140,0,150,80,0,10]\n>>> variable2[3]'Latitude'\n```\n\n列表的每个元素都会自动分配一个索引数字，从\
  \ 0 开始。你可以使用此索引访问每个元素，并返回列表对应的值。如果你需要存储和分析大量数据，请使用列表——将数据存储在列表中可以很容易地提取统计信息。下面的代码片段是一个从前面代码示例创建的\
  \ `depth` 列表元素提取平均值的简单计算示例：\n\n```python\n>>> sum(depth)/len(depth)62.5\n```\n\n\
  在这个示例中，列表元素的平均值的计算方法是：首先通过 `sum` 函数对元素求和，然后除以列表中包含的元素数量——这个数字是通过 `len` 函数确定的，该函数返回字符串、数组或列表的`length`（换句话说，就是元素的数量）。这里分母中的\
  \ `len` 函数返回的是对象中项目的平均值。看到了吗？这就像 1-2-3 一样简单！\n\n## Python 中的元组\n\n`Tuples` 与列表相似，区别在于你在创建它们后无法修改其内容。此外，要创建元组，你需要使用普通括号而不是方括号。\n\
  \n![Remember](img/remember.png)“普通括号”指的是形式如 `(…)` 或 `(…, …, …)` 的圆括号。\n\n这里是一个元组的示例：\n\
  \n```python\n>>> depth=(0,120,140,0,150,80,0,10)\n```\n\n在这种情况下，你无法像操作列表那样修改任何元素。为了确保你的数据保持为只读格式，请使用元组。\n\
  \n## Python 中的集合\n\n`set` 是另一种类似于列表的数据结构。然而，与列表不同，`set` 的元素是无序的。集合这种无序特性使得无法对其索引，因此它不是一种常用的数据类型。\n\
  \n## Python 中的字典\n\n`Dictionaries` 是由键值值对组成的数据结构。在字典中，每个值都对应一个特定的键，因此可以使用该键访问每个值。下面的代码片段显示了键/值对：\n\
  \n```python\n>>> variable4={\"ID\":0,\"Name\":\"City\",\"Depth\":1,\"Latitude\"\
  :-2,\"Longitude\":1}\n```\n\n## 在 Python 中有效利用循环\n\n在处理列表时，最常用的循环是 `for` 循环。下面的代码片段说明了这一点：\n\
  \n```python\n>>> for element in variable2:print(element)\n```\n\n![Warning](img/remember.png)不要让索引数字困扰你。下面的代码片段说明了\
  \ `while` 循环：\n\n```python\n>>> while condition:print(element)\n```\n\nPython 中其他可用的循环是\
  \ `while` 循环。当给定条件为真时，使用 `while` 循环。\n\n## 尽情玩函数\n\n函数（以及我将在下一节中描述的类）是每种编程语言的关键构建块。函数是接收输入、处理输入并返回输出的代码块。函数的输入可以是数字、字符串、列表等……Python\
  \ 有两种类型：内置和自定义的。\n\n`Built-in` 函数在 Python 内部预定义。你只需输入它们的名称即可使用它们。下面的代码片段是一个示例：\n\
  \n```python\n>>> print(\"Hello\")\n```\n\n`print` 背后的代码已经由创建 Python 的人员写好了。现在这些代码已经就绪，你不需要知道如何编写它——你只需调用\
  \ `print` 函数即可。Python 库的创建者无法预测满足所有人需求的每个可能的函数，但他们成功地为用户提供了在需要时创建和复用自己函数的方法。\n\n\
  在本章较前的“理清各种 Python 数据类型”部分中，该部分的以下代码片段（在此处再次列出）被用于求和列表元素并计算平均值：\n\n```python\n>>>\
  \ depth=[0,120,140,0,150,80,0,10]\n>>> sum(depth)/len(depth)62.5\n```\n\n前面的数据代表了多个点位置的降雪和雪深记录。你可以看到，收集雪深测量点的平均深度为\
  \ 62.5 单位。不过，这些是在同一时间采集的深度测量。换句话说，所有数据具有相同的时间戳。在使用 Python 进行数据建模时，你经常会看到在不同时间进行测量组的情况——被称为`时间序列数据`。\n\
  \n这里是时间序列数据的示例：\n\n```python\n>>> december_depth=[0,120,140,0,150,80,0,10]\n>>>\
  \ january_depth=[20,180,140,0,170,170,30,30]\n>>> february_depth=[0,100,100,40,100,160,40,40]\n\
  ```\n\n你可以用与之前列表相同的方法计算 12 月、1 月和 2 月的平均雪深，但那样会非常麻烦。这就是自定义函数派上用场的地方：\n\n```python\n\
  >>> def average(any_list):return(sum(any_list)/ len(any_list))\n```\n\n\n\n\n此代码段定义了\
  \ `average` 函数，它接收任何列表作为输入并计算其元素的平均值。该函数尚未执行，但代码定义了函数在稍后接收某些输入值时的处理逻辑。在此段代码中，`any_list`\
  \ 只是一个变量，在函数执行时会被赋予给定值。要执行该函数，你只需要向它传递一个值。在这种情况下，该值是一个包含数值元素的真实列表：\n\n```\n>>> average(february_depth)72.5\n\
  ```\n\n执行函数非常简单。你可以使用函数对不同的输入值重复执行相同的操作，次数根据需要而定。这里的美之处在于，在构造函数之后，你可以直接复用它们，而无需重新编写计算算法。\n\
  \n### 使用类保持酷炫\n\n`classes`（类）是把函数和变量组合在一起以生成其他对象的代码块。因此，它们与接收输入并产生输出的函数略有不同。在类内部结合在一起的函数和类集合描述了特定对象的蓝图。换句话说，类规定了创建对象时必须发生的过程。一旦构思出一个类，你就可以通过调用类实例来生成实际的对象实例。在\
  \ Python 中，这被称为 `instantiating`（实例化）一个对象（创建该类的实例）。\n\n![Remember](img/remember.png)在类内部创建的函数称为\
  \ `methods`（方法），类内部的变量称为 `attributes`（属性）。方法描述生成对象的动作，而属性则描述对象的实际特征。\n\n为了更好地理解如何使用类进行更高效的数据分析，请考虑以下场景：假设你拥有来自不同地点和时间的雪深数据，并将其存储在在线的\
  \ FTP 服务器上。数据集包含不同范围的雪深数据，取决于年份的月份。现在想象一下每个月的范围都存储在 FTP 服务器上的不同位置。\n\n你的任务是使用 Python\
  \ 获取所有月度数据并分析整个数据集，因此你需要对不同的数据范围使用不同的操作。首先，你需要使用 FTP 处理库（如 `ftplib`）在 Python 内部下载数据。然后，为了能够在\
  \ Python 中分析这些数据，你需要将它们存储在适当的 Python 数据类型中（例如列表、元组或字典）。在获取数据并将其存储为 Python 脚本中识别的数据类型后，你就可以应用\
  \ NumPy、SciPy、pandas、Matplotlib 和 scikit-learn 等专业库提供的更高级操作。\n\n在这种场景下，你希望创建一个类，生成一个包含每个月份雪深数据的列表。每个每月列表都由该类生成的对象实例。类本身会将\
  \ FTP 下载函数与将下载的记录存储在列表中的函数结合在一起。然后你可以根据需要的月份对类进行实例化，以进行彻底的分析。以下是实现此类操作的代码：\n\n```python\n\
  import ftplib\nclass Download:\n    def __init__(self,site,dir,ftp=None,fileList=[]):\n\
  \        self.ftp =ftp\n        self.site=site\n        self.dir=dir\n        self.fileList=fileList\n\
  \        self.login_ftp()\n        self.fileList = self.store_in_list()\n    def\
  \ Login_ftp(self):\n        self.ftp=ftplib.FTP\n    def store_in_list(self):\n\
  \        self.ftp=ftplib.FTP(self.site)\n        self.ftp.cwd(self.dir)\n      \
  \  self.ftp.login()\n        fileList=[]\n        for file in self.ftp.nlst():\n\
  \            fileList.append(file)\n        return fileList\n```\n\n\n\n\n```python\n\
  >>> array_2d=numpy.arange(8).reshape(2,4)\n>>> print(array_2d)\n[[0 1 2 3][4 5 6\
  \ 7]]\n```\n\n上一个示例是一个二维数组，也被称为 2 x 4 矩阵。它与之前的示例唯一的区别在于我调用了 `.reshape` 方法，并传入了 2\
  \ 和 4 这两个值 —— 告诉 `numpy` 将该数组转换为 2 x 4 矩阵。\n\n![Remember](img/remember.png)\n\n\
  标准的矩阵表示法是 `m` × `n`，其中 `m` 是行数，`n` 指定矩阵的列数。\n\n使用 `.arange` 和 `reshape` 方法只是创建 NumPy\
  \ 数组的方法之一。你也可以从列表（lists）和元组（tuples）生成数组。\n\n在之前的一个章节“玩转函数之乐趣”中介绍的雪地数据集中，我将不同地点的雪深数据存储在三个独立的\
  \ Python 列表中 —— 每个月一个列表：\n\n```python\n>>> december_depth=[0,120,140,0,150,80,0,10]\n\
  >>> january_depth=[20,180,140,0,170,170,30,30]\n>>> february_depth=[0,100,100,40,100,160,40,40]\n\
  ```\n\n将测量值存储在更整合的结构中会更高效。例如，你可以使用下面的代码段轻松地将所有列表放入单个 NumPy 数组中：\n\n```python\n>>>depth=numpy.array([december_depth,\
  \ january_depth,february_depth])\n>>> print(depth)\n[[ 0 120 140 0 150 80 0 10][\
  \ 20 180 140 0 170 170 30 30][ 0 100 100 40 100 160 40 40]]\n```\n\n使用这种结构允许你更高效地提取某些测量值。例如，如果你想计算三个月中每个地点的雪深平均值，你需要提取每行水平行的第一个元素（更准确地说，是值\
  \ 0、20 和 0）。你可以通过对数据集进行切片（slice）然后通过 NumPy 的 `mean` 函数计算平均值，从而在一行代码中完成提取。*切片*（slicing）一词指的是从数据集中取出一部分。这里是一个示例：\n\
  \n```python\n>>> numpy.mean(depth[:,1])\n133.33333333333334\n```\n\n通过这段代码，我指示计算机前往列索引为\
  \ 1 的位置，并计算该列值的平均值。索引为 1 的列的值是 120、180 和 100。当你计算这些数字的平均值时，得到 133.3。\n\n除了使用 NumPy\
  \ 从单个矩阵中提取信息外，你还可以用它与不同的矩阵进行交互 —— 例如，在矩阵之间应用标准的数学运算，甚至可以应用非标准的运算符，如矩阵求逆、汇总以及最小/最大值运算符。\n\
  \n![Remember](img/remember.png)\n\n数组对象（Array objects）拥有 Python 中任何其他对象相同的权利。你可以将它们作为参数传递给函数，将它们设置为类属性，或者遍历数组元素生成随机数。\n\
  \n### 深入了解 SciPy 库\n\nSciPy ([`https://scipy.org`](https://scipy.org/)) 是一个数学算法和高级函数的集合，扩展了\
  \ NumPy 库的功能。SciPy 库为 Python 添加了一些专门的科学函数，用于数据科学中更特定的任务。要在 Python 中使用 SciPy 函数，你必须先安装并导入\
  \ SciPy 库。\n\nSciPy 为各种任务提供了功能和算法，包括矢量量化、统计函数、离散傅里变换算法、正交距离回归、Air 函数、稀疏特征值求解器、最大熵拟合程序、`n`-维图像操作、积分程序、插值工具、稀疏线性代数、线性求解器、优化工具、信号处理工具、稀疏矩阵以及其他\
  \ Python 库未提供的工具。令人印象深刻，对吧？然而，这还不是 SciPy 工具的完整列表。如果你渴望获得完整列表，在 Python 中运行下面的代码段将打开一个详尽的帮助模块，解释\
  \ SciPy 库：\n\n```python\n>>> import scipy\n>>> help(scipy)\n```\n\n![Remember](img/remember.png)在你在使用此代码之前，需要先下载并安装\
  \ SciPy 库。\n\n上一个代码中使用的 `help` 函数返回一个脚本，列出了组成 SciPy 的所有工具并记录了 SciPy 的函数和类。这些信息帮助你理解构成\
  \ SciPy 库的预写函数和算法背后的原理。\n\n![Tip](img/tip.png)由于 SciPy 开发中，因此不断变化和增长，请定期检查 `help`\
  \ 函数以查看变化。\n\n### 窥探 pandas 的功能\n\npandas 库 ([`https://pandas.pydata.org`](https://pandas.pydata.org/))\
  \ 以其易于访问且健壮的数据结构使数据分析变得更快、更简单。它精确的功能是通过集成 Matplotlib 的一部分来提高数据可视化性能。这里是两种主要的 pandas\
  \ 数据结构：\n\n*   `Series`：`Series` 是类似于数组的结构，可以是水平或垂直的。你可以将 `Series` 对象想象成 Excel 表格中的一行或一列。\n\
  *   `DataFrame`：`DataFrame` 对象类似于 Python 中的数据表格。`DataFrame` 的每行或每列都可以被视为自己的 `Series`\
  \ 对象。\n\n索引被集成到这两种数据结构中，使其易于访问数据。pandas 提供了读取和写入数据的功能，支持你任何格式。最后，pandas 还提供了重塑数据、处理缺失值和删除异常值的功能，使其成为数据准备和基础数据分析的极选择。如果你想执行更高级的统计和机器学习方法，你需要使用\
  \ scikit-learn 库。好消息是 scikit-learn 和 pandas 配合良好。\n\n### 使用 Matplotlib 进行可视化\n\n\
  通常情况下，数据科学项目最终以对象或现象的可视化告终。在 Python 中也不例外。在通过 NumPy 和 SciPy 走了入门（或一些不是入门步骤）之后，你可以使用\
  \ Python 的 Matplotlib 库 ([`https://matplotlib.org`](https://matplotlib.org/)) 为你的数据集创建复杂的视觉表示。Matplotlib\
  \ 与 NumPy 和 SciPy 结合为解决数据问题提供了良好的环境。\n\n仔细观察 Matplotlib，我可以告诉你这是一个在 Python 中生成数据的二维绘图库。你可以使用\
  \ Matplotlib 制作直方图、散点图和各种其他数据图表。更重要的是，因为该库让你对可视化的符号、线条样式、字体和颜色拥有完全控制，你甚至可以使用 Matplotlib\
  \ 生成出版级的数据图表。\n\n![Remember](img/remember.png)与 Python 中所有其他库一样，为了使用 Matplotlib，你首先需要安装并导入到脚本中。完成这些任务后，就可以开始生成图表和图形了。\n\
  \n为了说明如何使用 Matplotlib，请考虑下面的 NumPy 数组（这是在本章前面的“向 NumPy 库打招呼”章节中提出的）：\n\n```python\n\
  >>> print(depth)[[ 0 120 140 0 150 80 0 10][ 20 180 140 0 170 170 30 30][ 0 100\
  \ 100 40 100 160 40 40]]\n```\n\n通过接下来的几行代码，仅使用一个 `for` 循环和 Matplotlib 函数 —— `pyplot`，你就可以在\
  \ Python 的单张图中轻松绘制所有测量值：\n\n\n\n\n\n```python\nimport matplotlib.pyplot as plt\n\
  for month in depth: \n    plt.plot(month)\nplt.show()\n```\n\n这段代码段立即生成了你在图 6-2\
  \ 中看到的折线图。\n\n图中每条线代表同一月份不同地点的雪深。你用于构建此图的前置代码非常简单；如果你想获得更好的表现效果，可以向`plot` 函数添加颜色或文本字体属性。当然，你也可以使用其他类型的数据图形，取决于哪种类型最能展示你想要呈现的数据趋势。这里的重要的是，你知道何时使用这些重要的库，并且你理解如何如何使用\
  \ Python 编程语言让数据分析变得既简单又高效。\n\n![图 6-2：月度雪深数据时间序列图。](img/9781394297009-fg0602.png)\n\
  \n图 6-2： 月度雪深数据时间序列图。\n\n## 使用 scikit-learn 从数据中学习\n\nscikit-learn ([`scikit-learn.org``](https://scikit-learn.org/))\
  \ 无疑是 Python 最好的机器学习库。通过它，你可以执行各种机器学习方法，包括分类、回归、聚类、降维等。该库还提供了一个预处理模块，每当你需要为预测模型准备数据时，它都能提供极佳的支持。最后，scikit-learn\
  \ 还提供了一个模型选择模块，配备了各种指标，帮助你构建模型并从选项中选择性能最好的模型。\n\n# 第 7 章：使用软件应用程序生成洞察\n\n## 本章内容\n\
  \n- ![Bullet](img/check.png) 通过无代码和低代码直接实现数据变\n- ![Bullet](img/check.png) 掌握关系型数据库和\
  \ SQL\n- ![Bullet](img/check.png) 设计出色的关系型数据库\n- ![Bullet](img/check.png) 使用 SQL\
  \ 函数执行数据科学任务\n- ![Bullet](img/check.png) 使用 Microsoft Excel 电子表格检查你的数据\n- ![Bullet](img/check.png)\
  \ 在电子表格中对数据进行格式化和汇总\n- ![Bullet](img/check.png) 自动化 Excel 电子表格中的任务\n\n在如今，似乎每家公司都想雇用在\
  \ R 和 Python 编程方面拥有丰富经验的数据科学家，因此技术供应商提供工具帮助数据科学家生成的数据洞察实现民主化，这才是合理的。数据科学家的人数根本不够用，即使足够，整个世界也不需要每个人都成为数据科学家。我们需要能够在自己的专业领域出现并创造价值。商业世界也需要我们这样。\n\
  \n在本章中，你将看到一些极其强大的低代码或无代码工具，它们可以从你已经处理的数据中更快地产生更多利润，而无需停下工作去学习使用 R 或 Python 构建复杂的预测模型。\n\
  \n## 为你的数据科学策略选择最佳工具\n\n*数据科学策略*最好被描述为一种技术计划，它规划了领导能够提高业务利润的数据科学项目所需的所需的每一个元素。在第\
  \ 6 章中，我提到了 Python 往往是计划的一部分，这可能让你认为，在涉及数据科学策略时，Python 是回答“为了我的策略成功需要哪些工具？”的显而易见的答案。显而易见的答案总是最好的答案吗？我认为并非如此。一种*仅依赖*数据科学来提高数据利润的策略是局限的，它坚持使用代码来实现数据变现，这在早期就让自己失去了机会。\n\
  \n近年来，无代码和低代码平台取得了显著进展。它们整合了更多的人智能（AI）和机器学习（ML）能力，以进一步简化数据处理和自动化。通过让用户能够在不编写代码的情况下轻松构建复杂的应用程序，Google\
  \ AppSheet、Make 和 Airtable AI 等平台已将自己置于这场革命的前沿。这些工具使得构建数据驱动的应用程序变得简单，这些程序可以与流行的云服务（如\
  \ Amazon Web Services [AWS]、Google Cloud 和 Microsoft Azure）以及生成式 AI（GenAI）服务（如 OpenAI\
  \ 和 Hugging Face）缝集成。因此，这些工具是高级分析和 AI 自动化强大解决方案。\n\n例如，想象一个人力资源（HR）专业人员不需要编写一行代码，就能构建一个软件应用程序，自动收集申请人数据，将数据读入申请人的结构化查询语言（SQL）数据库，然后根据处理招聘申请的人力人员的手工判断对每位申请人执行自动回复。在适当的情况下，软件会自动推动候选人进入招聘流程。这种无代码应用消除了手动数据输入、数据清理、电子邮件跟进和候选人转交的需求。这直接节省了大量时间（换句话说就是钱）。\n\
  \n你是否知道任何预制软件，其供应商可以来配置它以在内部创建这种系统设置？是的，你可能知道，但考虑到在像 Airtable 等现代无代码环境中也可以实现相同的成果，这是一个漫长、昂且且灵活的路线——这些环境的设计同时像电子表格和数据库，并提供了一种协作、直观的云端类\
  \ SQL 解决方案。在我的业务中，我们所有的数据仓库和项目管理都在 Airtable 内部进行，我们可以在成员之间协作的同时构建应用程序，成本极低。通过利用\
  \ AI 驱动的功能和无缝云集成，这些平台实现了数据应用的快速开发和部署，反过来实现了数据洞察的民主化，并赋予知识工作者在没有大量技术知识的情况下创造更多价值。\n\
  \n*无代码*是一种开发平台，它利用图形用户界面（GUI），让编码人员和非编码人员都能构建他们自己的软件应用程序。如果你的初创公司或小企业没有复杂的数据架构，完全有可能将公司的数据存储在无代码环境中，而不必担心将该数据和平台与其他数据系统集成。\n\
  \n如果你的公司更大、更成熟，你可能想考虑*低代码*选项——这些平台允许用户在不需要使用任何代码的情况下构建应用程序，但需要在后端使用少量的代码进行配置，以便实现与公司其他数据系统和源的数据集成。常用的低代码解决方案有\
  \ Microsoft Power Platform（用于应用开发、自动化和分析），以及 Google Forms 和 Microsoft Access（用于自服务数据收集和集成）。\n\
  \n关于数据策略，我们在这里真正讨论的是利用低代码和无代码解决方案来部署并直接变现你更多的公司数据，而无需培训现有团队成员或聘佣经验丰富的数据科学家——换说，这是跨业务范围内数据和数据变现的真正民主化。\n\
  \n\n\n\n弥合无代码、低代码、SQL 和电子表格之间的差距，SQL 数据库以及如 Excel 和 Google Sheets 等电子表格应用程序提供了知识工作人员今天即可开始使用的无代码和低代码环境，以提高其公司数据的生产力和盈利能力。这些技术非常易于上手，并且对现代业务具有巨大的增长潜力，因此在随后的章节中，我对它们进行了高层概述。\n\
  \n## 掌握 SQL 和关系型数据库\n\n某些数据专业人员因为学习曲线陡峭而抵制学习 SQL。他们想：“我不是程序员，而结构化查询语言（Structured\
  \ Query Language）听起来确实是一门编程语言。”然而，对于 SQL 来说，它并不是一种编程语言，你很快就会发现。就学习使用 SQL 查询和访问数据的增长潜力来看，付出一点小的麻烦是值得的。\n\
  \nSQL 是创建、维护和保护关系型数据库的标准。它是一组规则，你可以利用这些规则快速高效地对大型复杂数据库进行查询、更新、修改、添加或删除数据。你使用 SQL\
  \ 而不是 Python 或电子表格应用程序来完成这些任务，是因为 SQL 是完成工作最简单、快速的方法。它提供了一套简单且标准化的核心命令和方法，在执行这些任务时易于使用。在本章中，我将为你介绍基础\
  \ SQL 概念，并解释你如何使用 SQL 执行诸如查询、连接、排序甚至结构化数据集等酷炫的操作。尽管 SQL 标准很长，但用户通常需要的少于 20 条命令，且其语法是人类可读的——例如，如果你需要提取年薪超过\
  \ 50,000 美元的财务部门员工数据，你可以使用如图 7-1 所示的 SQL 语句。为了让事情变得更容易，SQL 命令使用全大写字母编写，这有助于在你的脑海中将该语言与其他编程语言区分开并独立出来。\n\
  \n尽管你可以使用 SQL 处理位于关系型数据库系统中的结构化数据，但你不能将标准 SQL 作为非结构化数据的解决方案。我在`第 2 章`中讨论了数据工程。目前，只需说\
  \ SQL 仅仅是你可以用来操作和编辑结构化表格的工具即可。它并没有特别了不起，但对于数据科学中出现的数据查询和处理任务，使用 SQL 是很有用的。\n\nSQL\
  \ 的一个基本特性是，你可以将其用于位于关系型数据库中的结构化数据。SQL 数据库管理系统（DBMSs）通过极少的用户输入优化其自身的结构，从而实现了极快的运行性能。`index`（索引）就是查找表。你创建它是为了对表中的数据进行索引、指向和“查找”。尽管\
  \ DBMS 以其快速的数据库查询能力闻名，但这种速度和效率在很大程度上取决于良好的索引。良好的索引对于 SQL 中的快速数据检索至关重要。\n\n与不同的网络浏览器以不同方式遵循、添加或忽略\
  \ HTML 标准的不同部分类似，SQL 规则的解释方式也略有不同，这取决于你处理的是开源产品还是商业厂商应用程序。由于并不是每个 SQL 解决方案都是相同的，因此了解市面上一些较流行的\
  \ SQL 解决方案的优缺点是一个好主意。以下是数据科学家常用的两种流行的开源 SQL 实现：\n\n-   MySQL：到目前为止最流行的开源 SQL 版本，`MySQL`\
  \ 了一个了一个完整且强大的 SQL 版本。它被用于数百万网站的后端。\n-   PostgreSQL：该 `PostgreSQL` 软件在 SQL 的关系语言中添加了面向对象的元素，使其在想要将\
  \ SQL 对象集成到自己平台对象模型中的程序员中广受欢迎。\n\n其他强大的 SQL 实现，如 Oracle 和 Microsoft SQL Server，也是极出色的解决方案，但它们的设计是为了用于更传统的业务场景，而不是作为数据科学工具。\n\
  \n正如你从名称猜的那样，关系型数据库最显著的特征是它们是“关系”——它们由相关的表组成。为了说明关系型数据库的概念，首先想象一个具有行、列以及列之间预定义关系的\
  \ Excel 电子表格。然后想象一个包含许多工作表（表）的 Excel 工作簿，其中每个工作表都有与一个或多个其他工作表相同的列。由于这些工作表具有共享关系，如果你使用\
  \ SQL，就可以通过这种共享关系查找所有相关工作表的数据。这种关系如图 7-2 所示。\n\n让我们用以下场景作为说明。此数据表描述了电影并列出了观众的评分：\n\
  \n\n\n\n\nid title genre rating timestamp rating\n1 The Even Couple NULL 2011-08-03\
  \ 16:04:23 42\n2 The Fourth Man Drama 2014-02-19 19:17:16 5\n2 The Fourth Man Drama\
  \ 2010-04-27 10:05:36 4\n3 All About Adam Drama 2011-04-05 21:21:05 4\n3 All About\
  \ Adam Drama 2014-02-21 00:11:07 3\n4 Dr. Yes Thriller NULL\n\n如果你发现 `All About\
  \ Adam` 实际上是一部喜剧片而不是正剧，会发生什么呢？如果该表格在一个简单的电子表格中，你必须打开数据表，找到该电影的所有实例，然后手动更改该记录的类型（genre）值。在示例示例表中，这并不困难，因为只有两条记录与该电影有关。但即便如此，如果你忘记更改其中一条记录，这种不一致性就会导致数据完整性的丢失，从而在未来给你带来各种不可预知的问题。\n\
  \n相比之下，关系型数据库的解决方案既简单又优雅。在这个例子中，你不需要一个表，而是三个：\n\n```\nFilm id title 1 The Even Couple\
  \ 2 The Fourth Man 3 All About Adam 4 Dr. Yes\nGenre id genre 2 Drama 3 Drama 4\
  \ Thriller\nRating timestamp id rating 2011-08-03 16:04:23 1 4 2014-02-19 19:17:16\
  \ 2 5 2010-04-27 10:05:36 2 4 2011-04-05 21:21:05 3 4 2014-02-21 00:11:07 3 3\n\
  ```\n\n`Film` 表和 `Genre` 表的主键是 `id`。`Rating` 表的主键是 `timestamp` —— 因为一部电影可能有多个评分，`id`\
  \ 不是一个唯一字段，因此不能用主键。在这个示例中，如果你想查找并更改 `All About Adam` 的类型，你会使用 `Film.id` 作为主键，`Genre.id`\
  \ 作为外键。你只需使用这些键来查询你需要更改的记录，然后系统地应用这些更改。这种系统化的方法消除了疏漏错误的风险。\n\n## 在数据库设计上投入精力\n\n\
  如果你想确保你的数据库在可预见的未来对你有用，你就需要投入时间和资源进行卓越的数据库设计。如果你想创建提供快速性能和无错误结果数据库，你的数据库设计必须是完美无缺的——或者至少是你能做到的完美。在向数据表中输入任何数据之前，请先仔细考虑你想包含的表和列、这些表将存储的数据类型，以及你想要在这些表之间建立的关系。\n\
  \n![Remember](img/remember.png)你在规划数据库和预测未来需求上花费的每一小时，可以在未来节省无数小时的时间，那时你的数据库可能包含数百万记录。规划不当的数据库很容易变成缓慢且充满错误的怪物——请不惜代价地避免它们。\n\
  \n在设计数据库时，请记住以下几个概念：\n\n* 数据类型\n* 约束\n* 范式化\n\n在接下来的几个章节中，我将详细介绍每个主题。\n\n### 定义数据类型\n\
  \n在创建数据表时，你必须做的事情之一是定义每列的数据类型。你有几种数据类型可供选择：\n\n* **文本 (Text):** 如果你的列包含文本值，你可以将其分类为固定长度的\
  \ `Character` 数据类型或不确定长度的 `Text` 数据类型。\n* **数值 (Numerical):** 如果你的列存储数值，你可以将其分类为\
  \ `Numerical` 数据类型。数值数据类型可以存储为整数或浮点数。\n* **日期 (Date):** 如果你的列存储日期或时间值，你可以将其指定为 `Date`\
  \ 数据类型或 `Date-Time` 数据类型。\n\n![Remember](img/remember.png)如果你的列存储日期或时间值，你可以将其指定为\
  \ `Date` 数据类型或 `Date-Time` 数据类型。\n\n### 设计约束\n\n在 SQL 的语境下，将约束视为你用来控制哪些数据进入的规则。例如，如果你有一个\
  \ `Price`（价格）列，你可能想确保只输入正数。如果你有一个 `Email`（电子邮件）列，你可能想确保输入的内容遵循有效的电子邮件格式。\n\n在 SQL\
  \ 的语境下，将约束视为你用来控制哪些数据进入的规则。例如，如果你有一个 `Price`（价格）列，你可能想确保只输入正数。如果你有一个 `Email`（电子邮件）列，你可能想确保输入的内容遵循有效的电子邮件格式。\n\
  \n### 数据库范式化\n\n在定义了数据类型并设计了约束之后，你需要处理 `normalization 化`（结构化你的数据库，以便任何更改只发生一次）。范式化有很多程度和类型，但一个良好健壮的数据库应该至少具有以下属性：\n\
  \n* **主键 (Primary keys):** 每个表都有一个主键，它是每一行的唯一值。\n* **列的非冗余性 (Nonredundancy of columns):**\
  \ 除非一个的主键是另一个的外键，否则两个表中没有相同的列。\n* **无多重依赖 (No multiple dependencies):** 每个列的值必须只依赖于一个列，而该列的值反不依赖于任何其他列。因此，计算值（例如发票的总额）必须在每次查询时动态计算，而不是硬编码到数据库中。\n\
  * **列索引 (Column indexes):** 正如你可能记得的，在 SQL 中，索引是指向表中数据的查找表。当你创建一个列索引——即特定列的索引时，该列中的每个记录都被分配一个唯一键，该键在查找表中被索引。列索引能够更快速地从该列检索数据。\n\
  \n**主题分离 (Subject-matter segregation):** 良好的设计的另一个特征是每个表只包含一种主题的数据。这本身并不是一个严格意义上的范式化原则，但它有助于实现类似的目标。\n\
  \n再次考虑本章前面提到的电影评分示例：\n\n\n\n\n\n-   我本可以将 `Genre`（类型）指定为 `Film` 表中的单独列，但将其放在单独的表中更好，因为这允许存在缺失的数据值（`NULL`\
  \ 值）。看看刚刚显示的 `Film` 表。`Film 1` 没有被分配类型。如果将 `Genre` 列包含在此表中，那么 `Film 1` 在该处将有一个 `NULL`\
  \ 值。与其拥有一个包含 `NULL` 值的列，不如创建一个单独的 `Genre` 数据表简单得多。`Genre` 表的主键与 `Film` 表的主键并不完全一致，但在进行连接（join）时它们并不需要一致。\n\
  \n![Tip](img/tip.png) \n当你运行 `SELECT` 查询时，`NULL` 值可能会非常棘手。当你根据特定属性的值进行查询时，任何在该属性具有\
  \ `NULL` 值的记录将不会出现在查询结果中。当然，这些记录仍然存在，它们甚至可能落在你为查询定义的特定取值范围内，但如果记录具有 `NULL` 值，它就会从查询结果中被排除。在这种情况下，你可能会在分析中漏掉它们。\n\
  \n任何称职的数据科学家在处理数据或科学问题时必须应对许多挑战。当你处理存储和查询数据这些耗时任务时，SQL 可以减轻一些压力，节省宝贵的时间和精力。\n\n\
  ## 使用 SQL 函数缩小范围\n\n在操作 SQL 命令时，你使用函数来执行任务，并使用参数来更细致地指定这些任务。例如，要从数据表中查询特定集合，请使用\
  \ `SELECT` 函数。要将单独的表合并为一个表，请使用 `JOIN` 函数。要对查询返回的数据设置限制，请使用 `WHERE` 参数。正如在本章开头提到的，SQL\
  \ 中常用的命令少于 20 种。本节介绍了 `SELECT`、`FROM`、`JOIN`、`WHERE`、`GROUP`、`MAX()`、`MIN()`、`COUNT()`、`AVG()`\
  \ 和 `HAVING`。\n\n最常用的 SQL 命令是 `SELECT`。你可以使用此函数根据指定标准生成搜索结果列表。为了说明，请想象本章之前提到的电影评分场景，其中有一个包含\
  \ `Film`、`Genre` 和 `Rating` 三张表的微型电影评分数据库。\n\n要生成 `FROM` Rating 表所有数据的打印输出，请使用 `SELECT`\
  \ 函数。任何带有 `SELECT` 的函数都被称为查询，`SELECT` 函数接受不同的参数来缩小或扩展返回的数据。星号（`*`）代表通配符，因此 `SELECT\
  \ *` 中的星号告诉解释器（执行所有 SQL 语句的 SQL 组件）显示表中的每一列。你可以使用 `WHERE` 参数将输出限制为某些值。例如，这里是完整的\
  \ Rating 表：\n\n```\nRating timestamp id rating 2011-08-03 16:04:23 1 4 2014-02-19\
  \ 19:17:16 2 5 2010-04-27 10:05:36 2 4 2011-04-05 21:21:05 3 4 2014-02-21 00:11:07\
  \ 3 3\n```\n\n如果你想将评分限制为某个时间之后后的评分，你可以使用如下代码：\n\n```\nSELECT * FROM RatingWHERE\
  \ Rating.timestamp >= date('2014-01-01')\ntimestamp id rating2014-02-19 19:17:16\
  \ 2 52014-02-21 00:11:07 3 3\n```\n\n在这里，`DATE()` 函数将字符串转换为日期，然后可以与 `timestamp`\
  \ 列进行比较。\n\n你还可以使用 SQL 将列连接到新的数据表中。连接基于特定列（或多个列）中的共享（或比较）数据。你可以以几种方式在 SQL 中执行连接，但这里列出的可能是最流行的：\n\
  \n-   **内连接 (Inner join)**：默认的 `JOIN` 类型；返回位于查询表之间交叉区域的所有记录。\n-   **外连接 (Outer join)**：返回查询数据表重叠区域之外的所有记录。\n\
  -   **全外连接 (Full outer join)**：返回位于查询数据表重叠区域内外的所有——换句话说，返回两个表的所有记录。\n-   **左连接 (Left\
  \ join)**：返回位于最左侧表的所有记录。\n-   **右连接 (Right join)**：返回位于最右侧表的所有记录。\n\n![Remember](img/remember.png)\
  \ \n务必区分内连接和外连接，因为这些函数处理缺失数据的方式不同。作为 SQL 连接的示例，如果你想要一个包含类型的电影列表，你可以在 `Film` 表和 `Genre`\
  \ 表之间使用内连接，以仅返回两个表之间交叉（重叠）的结果。\n\n为了唤起你的记忆，这里是你感兴趣的两张表：\n\n```\nFilm id title 1\
  \ The Even Couple 2 The Fourth Man 3 All About Adam 4 Dr. Yes\n```\n\n```\nGenre\
  \ id genre 2 Drama 3 Drama 4 Thriller\n```\n\n以下是你如何使用内连接来找到你想要的信息：\n\n```\nSELECT\
  \ Film.id, Film.title, Genre.genreFROM FilmJOIN Genre On Genre.id=Film.idid title\
  \ genre2 The Fourth Man3 All About Adam4 Dr. Yes\n```\n\n\n\n\n\n在数据科学领域中使用 Excel\
  \ 的好处在于，它提供了一种快速简单的方法来让你近距离接触数据。如果你想浏览数据集中的每一个数据点，可以使用 Excel 快速轻松地实现这一点。大多数数据科学家都是从\
  \ Excel 开始，当他们发现自己的任务已经触及了 Excel 设计的边界时，最终会添加其他工具和平台。尽管如此，即使是最优秀的数据科学家也将 Excel 留作他们工具箱中重要的工具。在进行数据科学工作时，你可能不会每天使用\
  \ Excel，但知道如何使用它会让你的工作变得更轻松。\n\n![提示](img/tip.png)\n\n如果你正在使用 Excel 表格进行数据分析，但发现它相当漏洞且笨拙，我建议你尝试一下\
  \ Google Sheets —— Google 推出的云端电子表格应用程序。它可以在你的电脑上离线运行，并提供目前 Microsoft Office 环境中简单无法实现的易用性的一系列协作功能。Google\
  \ Sheets 提供了本章讨论的所有功能，并使用与 Excel 表格相同的命令，但大多数用户发现 Sheets 是一个在数据分析、可视化和协作方面更直观、扩展性更好的工具。\n\
  \n![记住](img/remember.png)虽然当你想要将数据看作一片大森林时有很多不同的工具可用，但当你需要查看“树木”时，Excel 是极佳的首选。Excel\
  \ 试图为许多不同的用户提供许多不同的功能。它的功能划分得很好，以避免让新用户感到无从从，同时为高级用户提供他们渴望的级功能。\n\n在接下来的章节中，我将向你展示如何使用\
  \ Excel 快速了解你的数据。我还会介绍 Excel 透视表（PivotTables）和宏，并告诉你如何使用它们来极大简化你的数据清理和分析任务。\n\n\
  ### 使用 Excel 快速了解你的数据\n\n如果你刚开始处理一个陌生的数据集，并且需要尽可能地识别模式或趋势，请使用 Excel。Excel 正好为这些目的提供了有效的功能。它用于快速粗略数据分析的主要功能包括：\n\
  \n*   筛选：筛选功能对于过滤掉与当前分析无关的所有记录非常有用用。\n*   条件格式：指定一个条件，Excel 就会标记符合该条件的记录。通过使用条件格式，你可以轻松检测到表格数据集中的离群值和趋势。\n\
  *   图表：图表长期以来一直用于视觉上检测数据中的离群值和趋势，因此绘图是几乎所有数据科学分析中不可或缺的一部分。\n\n要查看这些功能是如何运作的，请考虑图\
  \ 7-3 所示的示例数据集，它跟踪了三个员工六个月内的销售额。\n\n#### 在 Excel 中进行筛选\n\n要将数据集视图缩小为对你的分析重要的数据，请使用\
  \ Excel 筛选从数据视图中过滤无关数据。只需选择数据并点击`首页`(Home）选项卡上的`排序和筛选`(Sort & Filter）按钮；然后从出现的选项中选择`筛选`(Filter）。在所选数据的表头行会出现一个小下拉选项，你可以从中选择想要从选择中筛选出的记录类别。使用\
  \ Excel 的`筛选`功能允许你快速轻松地排序或限制视图，仅查看你最感兴趣的数据子集。\n\n![图 7-3：跟踪员工销售业绩的完整数据集。](img/9781394297009-fg0703.png)\n\
  \n图 7-3： 跟踪员工销售业绩的完整数据集。\n\n再次查看图 7-3 所示的完整数据集。假设你只想查看与 Abbie 的销售额相关的数据。如果你选择`销售人员`(Salesperson)列中的所有记录，然后激活筛选功能（如刚才所述），你可以从出现的下拉菜单中指定筛选出名为\
  \ Abbie 的记录，如图 7-4 所示。筛选后，表格从 18 行减少到 6 行。在这个特定的例子中这种变化并不显著，但当你有数百、数千甚至百万行数据时，这个功能将非常有用。\n\
  \n![图 7-4：筛选后显示 Abbie 记录的数据集。](img/9781394297009-fg0704.png)\n\n图 7-4： 筛选后显示 Abbie\
  \ 记录的数据集。\n\n### 条件格式\n\n要快速识别数据中的离群值，请使用 Excel 的`条件格式`功能。假设你想突出显示销售额大于 5000 的所有单元格。你可以选择`销售额`(Sales)列，点击`条件格式`，然后选择`突出显示规则>大于`。输入`5000`，Excel\
  \ 将突出显示符合此条件的单元格。\n\n你还可以使用条件格式创建热力图。例如，你可以应用色阶，将高值标记为绿色，低值标记为红色。这可以帮助你快速识别数据中的模式和趋势。\n\
  \n#### 使用 Excel 图表视觉识别离群值和趋势\n\nExcel 图表工具提供了一种极其简单的方法来从视觉上识别数据中的离群值和趋势。原始数据集（参考图\
  \ 7-3）的散图产生了图 7-7 所示的散点图。可以看出，当数据绘制在散点图上时，离群值显而易见。\n\n或者，如果你想视觉上检测数据集中的趋势，可以使用 Excel\
  \ 的折线图功能。来自图 7-6 的数据在图 7-8 中以折线图的形式显示。值得一提的是，我在该折线图中修复了离群值，这使得`y` 轴与图 7-7 相比具有更可读的刻度。\n\
  \n\n\n\n\nFIGURE 7-6: 使用颜色刻度在表格数据集中识别离群值。\n\n![FIGURE 7-7: Excel XY（散点）图提供了视觉检测离群值的简单方法。](img/9781394297009-fg0707.png)\n\
  \nFIGURE 7-7: Excel XY（散点）图提供了视觉检测离群值的简单方法。\n\n![![FIGURE 7-8: Excel 折线图可以轻松地直观检测数据趋势。](img/9781394297009-fg0708.png)\n\
  \nFIGURE 7-8: Excel 折线图可以轻松地直观检测数据趋势。\n\n### 使用数据透视表重新格式化和汇总\n\nExcel 开发数据透视表（PivotTable）是为了让用户更容易地从大型电子表格数据集中提取有价值的洞察。如果你想通过快速重组或重新分类数据来生成洞察，请使用数据透视表（PivotChart）。传统电子表格与数据集之间的主要区别之一是，电子表格往往是宽的（有很多列），而数据集往往是长的的（有很多行）。图\
  \ 7-9\n\nFIGURE 7-9: 长格式数据集和宽格式电子表格。\n\n![Remember](img/remember.png)`PivotTable`\
  \ 是派生自电子表格内数据的表格。透视（pivot）允许对存储在底层电子表格中的原始数据进行分组、重新排列、显示和汇总。\n\nExcel 的设计导致许多用户直觉地偏于宽格式——这是合理的，因为它是一个电子表格应用程序。然而，为了应对这种偏好，Excel\
  \ 提供了数据透视表功能，以便你可以快速在长格式和宽格式之间转换。你还可以使用数据透视表对新格式化并重新排列的数据表快速计算小计和汇总计算。\n\n![Tip](img/tip.png)创建数据透视表非常简单：只需选择构成你要分析的表格的所有单元格。然后点击“插入”选项卡上的数据透视表按钮。此操作将打开“创建数据透视表”对话框，你可以在其中定义让\
  \ Excel 在何处构建数据透视表。点击“确定”，Excel 在你指定的页面上自动生成透视字段界面。从此界面，你可以指定想要包含在数据透视表中的字段以及你希望如何布局它们。\n\
  \n图 7-10\n\nFIGURE 7-10: 通过数据透视表从长格式数据集创建宽格式数据表。\n\n![Tip](img/tip.png)你可以在 Excel\
  \ 中进行比比创建数据透视表多得复杂的分析工作，尽管它们非常实用。在本书的配套网站（`https://businessgrowth.ai`](https://businessgrowth.ai/)）上，我为你提供了一些关于如何使用\
  \ Excel 和 XLMiner 实现数据科学的入门培训，而不需要触碰任何代码。\n\n## 使用宏自动化 Excel 任务\n\n`Macros`（宏）是用\
  \ Visual Basic for Applications（VBA）编写的预设程序。你可以使用宏来减少在 Excel 中处理数据时所需的所需的处理量。例如，在\
  \ Excel 内部，宏可以作为一组函数和命令，你可以用它们来自动化各种任务。如果你想通过自动化经常重复的 Excel 任务来节省时间（并减少烦恼），请使用宏。\n\
  \n要访问宏，首先从“文件”选项卡上的“选项”菜单中激活 Excel 的“开发工具”选项卡。（换句话说，打开“选项”菜单后，从左侧选择中选择“自定义区区”，然后点击右侧列中的“开发工具”复选框。）使用“开发工具”，你可以录制宏、导入他人创建的宏，或在\
  \ VBA 中编写自己的宏。\n\n为了演示宏的操作，假设你有一列值，并且你想在每个值之间插入一个空单元格，如图 7-11 宏有绝对模式（Absolute）和相对模式（Relative）。绝对模式是指按照你录制的方式绝对运行的宏。相对模式宏运行相同的程序，但可以放在任何需要的单元格中。\n\
  \n![Tip](img/tip.png)当你录制宏时，默认以绝对模式录制。如果你希望以相对模式录制宏，需要在录制前勾选“使用相对引用”。\n\n![FIGURE\
  \ 7-11: 使用宏在值之间插入空单元格。](img/9781394297009-fg0711.png)\n\nFIGURE 7-11: 使用宏在值之间插入空单元格。\n\
  \n对于绝对和相对宏更正式的定义，请考虑：\n\n- 相对：你输入的每个动作和移动都记录为相对于开始录制时选中的单元格。将来运行宏时，它将相对于所选单元格运行，就好像该单元格是你录制宏时最初选择的单元格一样。\n\
  - 绝对：开始录制宏后，你输入的每个动作和移动在将来运行宏时都会重复，且这些动作或移动相对于相对于开始记录时的活动单元格的任何相对引用。宏程序将完全按照你录制的方式重复。\n\
  \n在之前的示例中，该宏是以相对模式录制的。这使得宏可以持续运行、在任何地方运行，并叠加在之前运行的任何宏的结果之上。因为在这种情况下，宏只录制了过程的一次迭代，如果它是以绝对模式录制的，那么每次运行时，宏都会一直在\
  \ `one` 和 `two` 两个值之间添加空格。\n\n\n\n\nExcel 高级用户通常会转向使用 `VBA` 编写自己的宏。由于 `VBA` 是一门完整的编程语言，将\
  \ Excel 与 `VBA` 结合产生的可能性几乎是无限尽的。尽管如此，请问自己一个问题：如果你打算投入时间学习一种编程语言，你真的需要在 Excel 表格结构的限制内进行工作吗？如果不需要，你可以考虑学习科学计算语言，如\
  \ `R` 或 `Python`。这些开源语言具有更符合用户习惯的语法，并且灵活强大得多。\n\n# 第 8 章：用数据讲述强大的故事\n\n## 本章内容\n\
  * ![Bullet](img/check.png) 介绍数据可视化和叙事的基础知识\n* ![Bullet](img/check.png) 根据观众需求选择完美的数据可视化类型\n\
  * ![Bullet](img/check.png) 挑选完美的设计风格\n* ![Bullet](img/check.png) 使用正确的数据图表构建清晰且有力的视觉信息\n\
  * ![Bullet](img/check.png) 添加背景信息\n\n任何对数据科学的标准定义都会规定，其目的是帮助你从原始数据中提取意义和价值。从原始数据中发现并推导出见解是数据科学的核心，但如果你不知道如何向他人传达你的发现，这些见解就毫无意义。数据可视化和叙事是你视觉化传达数据意义的极佳手段。然而，要设计有效的数据可视化和故事，你必须了解并真正理解目标观众，以及你与这些观众成员交流的核心目的。你还必须理解你可以使用的主要数据图表类型，以及每种类型的显著优缺点。在本章中，我将向你介绍数据可视化和数据叙事设计的核心原则。\n\
  \n`data visualization` 是为了传达数据及数据见解的意义意义设计的视觉表示。由于数据可视化是针对一系列不同的观众、目的和不同的技能水平设计的，设计有效数据可视化的第一步是*了解你的观众*。观众有各种形状、形式和大小。你可能会为《连线》杂志上年轻且前卫的读者设计数据可视化，或者向研究小组传达科学发现。你的观众可能由董事成员、组织决策者或当地草根组织组成。\n\
  \n然而，所有观众的一个共同点在于，你在创建数据可视化时应该遵循的流程：\n\n1. **根据你的观众和可视化的目的，确定你将创建的数据可视化类型。**\n2.\
  \ **为你的数据可视化决定一种设计风格。**\n3. **选择哪种图表对你的观众最有意义。**\n4. **用数据测试不同类型的数据图表，然后选择显示最清晰、最直观答案的那些。**\n\
  5. **在数据可视化中安排你的数据图表。**\n6. **在适当的情况下添加背景信息以增强可视化的意义。**\n\n在本章中，我将按照顺序带你完成所有这些步骤。\n\
  \n## 数据可视化：三大支柱\n每类观众都由一群独特的消费者组成，每人都有独特的数据可视化需求，因此你必须明确你是为谁设计。以下是数据可视化的类型以及它们最对应的观众：\n\
  \n* **数据叙事 (Data storytelling)：** 技术性较的业务决策者\n* **数据展示 (Data showcasing)：** 数据实施者、分析师、工程师、科学家或统计学家\n\
  * **数据艺术 (Data art)：** 理想主义者、梦想家和社会变革者\n\n我将在接下来的章节中详细介绍这每种类型的数据可视化。\n\n### 面向决策者的数据叙事\n\
  有时，你必须为技术背景较弱的观众设计数据可视化，也许是为了帮助这类观众的成员做出更明智的业务决策。这种可视化的目的是向你的观众讲述数据背后的故事。在数据叙事中，观众依赖你来理解可视化背后的数据，然后将有用的见解转化为他们易于理解的视觉故事。\n\
  \n通过*data storytelling*，你的目标应该是使用数据可视化、文字和演讲技巧来创建一个叙述，讲述你想要传达的数据见解背后的故事——换句话说，就是数据见解的*意义*。对于你在数据故事内部使用的数据可视化，你希望它是一个没有杂乱、高度聚焦的可视化，使你的观众成员能够快速提取意义，而不需要耗费太大精力。这些可视化以静态图像的形式呈现最佳，但更老练的决策者可能倾向于使用一个可以进行少量操作的交互式仪表板。\n\
  \n### 面向数据叙事\n有时，你必须为技术背景较弱的观众设计数据可视化，也许是为了帮助这类观众的成员做出更明智的业务决策。这种可视化的目的是向你的观众讲述数据背后的故事。在数据叙事中，观众依赖你来理解可视化背后的数据，然后将有用的见解转化为他们易于理解的视觉故事。\n\
  \n通过*data storytelling*，你的目标应该是使用数据可视化、文字和演讲技巧来创建一个叙述，讲述你想要传达的数据见解背后的故事——换句话说，就是数据见解的*意义*。对于你在数据故事内部使用的数据可视化，你希望它是一个没有杂乱、高度聚焦的可视化，使你的观众成员能够快速提取意义，而不需要耗费太大精力。这些可视化以静态图像的形式呈现最佳，但更老练的决策者可能倾向于使用一个可以进行少量操作的交互式仪表板。\n\
  \n### 面向分析师的数据展示\n如果你是为数据实施者或其他逻辑严密的分析师群体设计，你就可以创建开放式的数据可视化。这种可视化的目的是帮助观众成员在视觉上探索数据并得出自己的结论。\n\
  \n在使用*data showcasing*技术时，你的目标应该是展示大量的背景信息，支持观众成员做出自己的解释。这些可视化应该包含更多的背景信息和更少的结论性，以便人们可以自己分析数据并得出自己的结论。这些可视化以静态图像的形式呈现最佳。\n\
  \n### 面向活动人士的数据艺术\n你可能会为理想主义者、梦想家和社会变革者设计数据。当你为这一特定观众设计时，你希望你的数据可视化能够表达观点！你可以假设典型的观众成员没有过度分析能力。然而，他们在数学技能方面的缺失被他们坚定的信念所充分补偿了。\n\
  \n这些人将你的数据可视化视为一种表达声明的载体。当你为这类观众设计时，数据艺术是最佳选择。使用*data art*的主要目标是娱乐、挑衅、恼怒，或采取一切手段做出一个响亮、清晰、引人注目的声明。数据艺术几乎没有叙事，没有给观众形成自己的解释留出空间。\n\
  \n![记住](img/remember.png)数据科学家有伦理始终准确表示数据。数据科学家绝不应该扭曲数据信息来迎合观众想听的内容——即使是为了数据艺术！非技术观众无法识别，更不用说看到可能的问题。他们依赖数据科学家提供诚实准确的表示，从而放大了数据科学家必须承担的伦理责任。\n\
  \n\n\n\n## 1. 头脑风暴。\n\n思考受众中的一个特定成员，并尽可能对那个人的动机做出合理的推测。\n\n![Tip](img/tip.png)给这个（想象中的）观众成员起一个名字和几个其他识别特征。我总是想象一个名为\
  \ `Eve` 的 45 岁离异双母亲。\n\n## 2. 定义你的视化目的。\n\n通过决定你具体希望受众根据可视化结果采取什么行动或获得什么结果，来缩小可视化的目的。\n\
  \n## 3. 选择功能性设计。\n\n回顾三种主要的数据可视化类型（在本章前面已讨论），并决定哪种类型能最好帮助你实现预期目标。\n\n以下章节将详细说明这一过程。\n\
  \n### 步骤 1：头脑风暴（关于关于 Eve）\n\n要进行正确的头脑风暴，请拿一张纸，想象一个虚拟的观众成员——例如“Eve”。让我们一起练习创建一个更有功能性、更有效的数据可视化方案。你首先需要回答关于\
  \ `Eve` 的更重要的问题，以便更好地理解她，从而更好地理解并为你的目标受众设计。\n\n首先构思 `Eve` 典型的一天是什么样子的——她早上起床后做什么，午餐时间在做什么，以及她的工作环境是种样的。还要考虑\
  \ `Eve` 如何使用你的可视化结果。这些内容能让你了解一些关于她的`心理特征`（驱动她高层次需求和欲望的心理特征）。\n\n为了更全面地了解 `Eve` 是谁以及你如何最好地满足她的需求，你可以从以下问题库中提取信息：\n\
  \n*   `Eve` 在哪里工作？她的职业是什么？\n*   她拥有什么种技术教育或经验（如果有的话）？\n*   `Eve` 多大了？她结婚了吗？她有孩子吗？她长什么样？她住在哪里？\n\
  *   哪些社会、政治、事业相关或专业问题对 `Eve` 很重要？她如何看待自己？\n*   `Eve` 每天必须处理哪些问题和挑战？\n*   你的数据可视化如何帮助解决\
  \ `Eve` 的工作问题或家庭问题？它如何提高她的自尊心？\n*   你将通过什么途径向 `Eve` 展示可视化结果（例如，通过互联网或在员工会议上）？\n\
  *   `Eve` 需要能够用你的数据可视化做什么？\n\n因为我们是在一起操作，我会通过为你回答这些问题：`Eve` 是欧尔文县区分区部门的经理。她 45 岁，是一个离异的母亲，两个孩子即将上大学。她对当地政治有深厚兴趣，最终想进入县委员会董事会。为了获得那个职位，她必须在她的县管理简历上增加一些重大的“含金量”。`Eve`\
  \ 的大部分价值感来自于她的工作以及她为部门做出良好管理决策的敏锐能力。\n\n到目前为止，`Eve` 被迫根据她的直觉来管理部门，并由几份零散的业务系统报告支持。她并不擅长分析，但她足够的知识来理解她看到的内容。问题在于\
  \ `Eve` 缺乏所需的可视化工具来展示她应该考虑的所有相关数据。她既没有时间也没有技能。\n\n### 步骤 2：定义目的\n\n在对受众进行头脑风暴后（见前一节），你可以很容易地确定你正试图实现的的目标。回到\
  \ `Eve` 身上——因为她并不擅长分析，而且她依赖你来做出有效的决策。\n\n### 步骤 3：选择最具功能性的设计\n\n记住，你有三种主要的可视化类型供选择：`data\
  \ storytelling`、`data art` 和 `data showcasing`。记住，如果你是为决策者设计，你最可能使用 `data storytelling`\
  \ 来直接告诉受众数据的含义。如果你是为社会正义组织或政治竞选设计，`data art` 能最好表达观点。最后，如果你是为分析师、工程师或统计学家设计，请坚持使用\
  \ `data showcasing`，让这些人员有足够的空间来发现问题。\n\n回到 `Eve`——因为她并不擅长分析，而且她依赖你来做出有效的决策，你需要运用\
  \ `data storytelling` 技术。创建一个带有某些背景但不过多背景的静态或交互式数据可视化。设计的视觉元素应该讲述一个关于她部门的清晰故事，使得\
  \ `Eve` 不需要费力处理大量的复杂性就能理解你想传达给她的观点。\n\n\n\n\n\n如果你正在为企业类型人员、工程师、科学家或组织决策者设计数据可视化方案，请保持设计简洁且洗练，使用数据展示或数据叙事类可视化。为了在受众中引发一种逻辑化、严谨的感觉，请包含大量的条形图、散点图和折线图。颜色选择应该较为传统且保守。其外观和感受应当体现出“企业时尚风”（参见图\
  \ 8-1）。这种风格的可视化旨在快速、清晰地传达数据正在发生的情况——直接、简洁且要到位。这种风格的最佳数据可视化传达出优雅的外观和感受。\n\n![Tip](img/tip.png)如果你正在寻找关于数据可视化和叙事最佳网络应用程序的指导，请务必查看我在[`https://businessgrowth.ai`](https://businessgrowth.ai/)上的*基于网页的数据可视化设计工具：前\
  \ 10 指南*。\n\n![FIGURE 8-1: 这种设计风格传达出严谨且精确的感觉。](img/9781394297009-fg0801.png)\n\n\
  FIGURE 8-1: 这种设计风格传达出严谨且精确的感觉。\n\n### 激发强烈的情感反应\n\n如果你正在设计旨在影响或说服他人的数据可视化方案，请融入能够激发目标受众情感反应的设计艺术性。这些可视化通常属于数据艺术类别，但一个极具创意的数据叙事作品也能激发这种强烈的情感反应。具有情感煽性的数据可视化通常支持社会、政治或环境问题某一方的立场。这些数据可视化包含了流动的、艺术化的设计元素，这些元素在流动和蜿蜒，如图\
  \ 8-2 所示。此外，丰富且戏剧化的色彩选择可以影响观众的情绪。这种风格的数据可视化为艺术创作和实验留下了大量空间。\n\n![Tip](img/tip.png)保持艺术元素的相关性——并识别出它们何时可能会损害你想要留下的印象，特别是当你为分析分析型的人群进行设计时。\n\
  \n![FIGURE 8-2: 这种设计风格旨在激发情感反应。](img/9781394297009-fg0802.png)\n\nFIGURE 8-2: 这种设计风格旨在激发情感反应。\n\
  \n## 选择合适的数据图形类型\n\n你对数据图形类型的选择可能决定一个数据可视化的成败。如果不清楚，`data graphic`是指以视觉格式描绘你的数据洞察的图形元素（参见图\
  \ 8-3）。大多数数据可视化内部包含一个以上数据图形。\n\n![FIGURE 8-3: 数据可视化与数据图形。](img/9781394297009-fg0803.png)\n\
  \nFIGURE 8-3: 数据可视化与数据图形。\n\n由于你可能需要代表数据的许多不同方面，你可以在不同的图形类别和类型之间进行混合和搭配。即使在同一类别中，某些图形类型的性能也优于其他类型；因此，创建几个不同的模型以查看哪种图形类型传达的最清晰、最直观的信息是一个好主意。\n\
  \n![Warning](img/warning.png)本书仅介绍了最常用的图形类型（在数百种可用类型中）。不要偏离正道太远。你偏离熟悉的图形越远，人们就越难以理解你试图传达的信息。\n\
  \n![Remember](img/remember.png)保持艺术元素的相关性——并识别出它们何时可能会损害你想要留下的印象，特别是当你为分析分析型的人群进行设计时。\n\
  \n\n\n\n\n此列表展示了几种不同类型的流行对比图表：\n\n- **气泡图**（参见图 8-9）利用气泡的大小和颜色来展示同一类别中三个参数之间的关系。\n\
  - **紧凑圆图**（参见图 8-10）同时利用圆的大小和聚类来视觉化类别、参数和相对参数值之间的关系。![图 8-9: 气泡图。](img/9781394297009-fg0809.png)\n\
  \  图 8-9: 气泡图。\n  ![图 8-10: 紧凑圆图。](img/9781394297009-fg0810.png)\n  图 8-10: 紧凑圆图。\n\
  - **甘特图**（参见图 8-11）是一种使用水平条形来视觉化项目管理中调度需求的条形图。当你正在为项目交付制定计划时，这种图表非常有用。它对于确定为了满足交付时间表而必须完成的任务顺序也有帮助。\n\
  \  ![提示](img/tip.png)选择甘特图用于项目管理和调度。\n  ![图 8-11: 甘特图。](img/9781394297009-fg0811.png)\n\
  \  图 8-11: 甘特图。\n- **堆叠图表**（参见图 8-12）用于比较同一类别中参数的多个属性。为了确保视觉比较不会变得困难，请克制包含过多参数的冲动。![图\
  \ 8-12: 堆叠图表。](img/9781394297009-fg0812.png)\n  图 8-12: 堆叠图表。\n- **树形图**（参见图 8-13）聚合相似类别的参数，然后使用面积来显示每个类别相对于整体的比例。![图\
  \ 8-13: 树形图。](img/9781394297009-fg0813.png)\n  图 8-13: 树形图。\n- **词云**（参见图 8-14）利用大小和颜色来显示正文中词汇频率的相对差异。颜色通常用于根据用法对词汇进行分类。\n\
  \  ![图 8-14: 简单的词云。](img/9781394297009-fg0814.png)\n  图 8-14: 简单的词云。\n\n### 统计图\n\
  \n显示统计分析结果的统计图通常只对分析类受众有用（对于制作数据艺术没有用处）。以下是你的统计选择：\n\n- **直方图**（显示在图 8-15 中）是用矩形绘制变量的频率和分布的图表。直方图可以帮助你快速掌握数据集中分布和频率。\n\
  \  ![提示](img/tip.png)熟悉直方图。在进行统计分析的过程中，你会看到很多它。\n  ![来源: Lynda.com, Python for DS\
  \ 图 8-15: 直方图。](img/9781394297009-fg0815.png)\n  来源：`Lynda.com`, Python for DS 图\
  \ 15: 直方图。\n- **散点图**（参见图 8-16）根据数据点的 `x` 和 `y` 值绘制数据点，以视觉化揭示任何模式。散点图是快速发现数据集中趋势和离群值的极佳方法。如果你使用数据故事或展示，可以从生成快速的散点图开始，以感受数据集中可能揭示关系或产生有说服力故事的区域。\n\
  ![来源: Lynda.com, Python for DS 图 8-16: 散点图。](img/9781394297009-fg0816.png)\n  来源：`Lynda.com`,\
  \ Python for DS 图 16: 散点图。\n- **散点矩阵**（参见图 8-17）通过多个散点图展示变量之间的关系。\n\n### 拓扑\n\n\
  拓扑是指使用几何结构来视觉化数据之间关系的实践。拓扑结构用于理解数据中的结构，并以视觉化展示变量之间的相关性。\n\n  ![来源: Lynda.com, Python\
  \ for DS 图 17: 散点矩阵。](img/9781394297009-fg0817.png)\n  来源：`Lynda.com`, Python for\
  \ DS\n\n以下列表描述了在数据科学中常用的拓扑结构：\n\n- **线性结构**（参见图 8-18）是显示一对一关系的拓扑结构，它们通常用于随时间变化的事件。可以使用这种拓扑结构。![图\
  \ 8-18: 线性拓扑。](img/9781394297009-fg0818.png)\n  图 8-18: 线性拓扑。\n- **图结构**（参见图 8-19）是表示多对关系的拓扑结构，如社交媒体平台的基础。![图\
  \ 8-19: 图形拓扑。](img/9781394297009-fg0819.png)\n  图 8-19: 图形拓扑。\n- **树形网络结构**（参见图\
  \ 8-20）表示`分级`分类，其中网络从上到下分布。![图 8-20: 树形网络拓扑。](img/9781394297009-fg0820.png)\n  图\
  \ 8-20: 树形网络拓扑。\n\n### 空间图和地图\n\n空间图和地图是视觉化空间数据的两种不同方式。`地图`只是地球上特征位置、形状和大小的简单图形。`空间图`比地图视觉上更复杂，它显示了属性的值及其位置分布。\n\
  \n以下是数据可视化中常用的几种空间图和地图类型：\n\n- **分级图**（参见图 8-21）实际上是根据面积边界多边形绘制的空间数据，而不是通过点、线或栅格覆盖。在[图\
  \ 8-21]中，每个州边界代表一个`面积边界`多边形。\n\n\n\n\n\n* **要点：** 点地图由根据特定点位置绘制的空间数据组成，点地图（请参图 8-22）以图形点形式呈现数据，而不是多边形、折线或栅格表面格式。\n\
  * **栅格表面：** 栅格表面地图（请参见图 8-23）可以是从卫星图像地图到通过底层空间数据点插值得到的表面覆盖区域的任何形式。\n\n![Tip](img/tip.png)\
  \ 如果想学习如何使用 QGIS（一种开源地理信息系统 (GIS) 应用）从数据制作地图，请访问 [`https://businessgrowth.ai`](https://businessgrowth.ai/)。\n\
  \n![Source: Lynda.com, Python for DS ¶ FIGURE 8-21: A Cloropleth map.](img/9781394297009-fg0821.png)\n\
  \n来源：[`Lynda.com`](http://Lynda.com), Python for DS ¶ 图 8-21： 等级颜色图。\n\n![FIGURE\
  \ 8-22: A point map.](img/9781394297009-fg0822.png)\n\n图 8-22： 点地图。\n\n![Remember](img/remember.png)\
  \ 无论你是数据可视化设计师还是消费者，都要注意数据可视化中的一些常见陷阱。简单来说，如果数据可视化构建得不对，它可能会产生误导。常见问题包括：总和不为 100%\
  \ 的饼图、刻度起始位置奇怪的柱状图，以及垂直轴不匹配的多列柱状图。\n\n![FIGURE 8-23: A raster surface map.](img/9781394297009-fg0823.png)\n\
  \n图 8-23： 栅格表面地图。\n\n## 测试数据图表\n\n你的数据可视化必须传达清晰且有力的视觉信息。为了实现这一点，你必须测试各种数据图表，并只选择最有效的包含在最终的数据可视化中。例如，图\
  \ 8-24 中显示的两个数据图表代表完全相同的统计数据。\n\n![FIGURE 8-24: Here you see the importance of selecting\
  \ effective data graphics.](img/9781394297009-fg0824.png)\n\n图 8-24： 在这里你可以看到选择有效数据图表的重要性。\n\
  \n注意右侧的数据图表在视觉上强调数值差异方面方面做得好得多。你应该始终测试不同的数据图表，以确保你使用的是最清晰、最有效地显示你的数据的图表。左侧的图表*不是*有效的。为了只选择最有效的数据图表包含在你的数据可视化中，只需遵循以下四个步骤：\n\
  \n1. **列出你的数据旨在回答的问题列表。**\n2. **确定数据可视化类型：数据故事讲述、数据展示或数据艺术。**\n3. **从适用于此类数据可视化的适当图表类型中选择选项。**\n\
  4. **用你的数据测试这些数据图表——亲眼观察哪种图表类型为你的问题提供了最清晰、最直的答案。**\n\n![Tip](img/tip.png) 在测试不同的数据图表并决定你想使用什么后，在你的数据可视化中安排这些图表。你可以使用\
  \ Python、R 或电子表格来实现（参见第 6 章）。或者，如果你想使用在线数据可视化设计工具创建数据可视化，你可能会发现我的指南有所帮助：*基于 Web\
  \ 的数据可视化设计工具——前 10 名*。你可以在 [`https://businessgrowth.ai`](https://businessgrowth.ai/)\
  \ 上找到它。\n\n## 添加上下文\n\n在你确切知道使用哪些数据图表后，你需要决定是否以及如何创建必要的上下文来为数据可视化添加更多意义。添加上下文有助于人们理解你的数据可视化所传达信息的价值和相对重要性。在计算、精确的数据可视化样式中添加上下文有助于建立相对视角，但在纯数据艺术中，你可能考虑省略额外的上下文。那是因为在数据艺术中，你只是试图传达一个观点，而不希望添加会分散该观点注意力的信息。\n\
  \n### 使用数据创建上下文\n\n在数据展示中，你应该为你数据可视化中显示的关键指标包含相关的上下文数据——例如，当你正在创建一个描述电子商务销售转化率的数据可视化时。此时关键指标将通过通过购买转变为客户的用户百分比来表示。与此指标相关的上下文数据可能包括购物车放弃率、用户购买前的平均会话次数、购买前的平均访问页面数，或客户决定转化之前访问的特定页面。这种上下文信息帮助观众理解销售转化的背后的原因和方式。\n\
  \n![Remember](img/remember.png) 添加上下文往往会导致数据焦去中心化。\n\n### 通过注释创建上下文\n\n有时，通过包含提供标题和数据简短描述的注释可以更合适地创建上下文。良好的注释对分析性和非分析类读者都有帮助。\n\
  \n### 通过图形元素创建上下文\n\n在数据可视化中创建上下文的另一种有效方法是包含传达数据相对重要性的图形元素。此类图形元素包括移动趋势线、单值警报、目标趋势线（如图\
  \ 8-26 所示）和预测基准。\n\n\n\n\n\nBeautiful Soup (`[https://beautiful-soup-4.readthedocs.io/en/latest]`)\
  \ 是一个流行的 Python 库，旨在支持大多数网络爬取需求。如果你需要从网站中提取数据，那么这个库非常适合你。它完全简化了导航、搜索和修改网页内容的过程。Beautiful\
  \ Soup 特别适用于从网络上收集大型数据集、为研究收集信息或自动执行重复性网页数据采集等任务。\n\n![Remember](img/remember.png)\n\
  在网络爬取中，你设置好自动化程序，然后让这些程序在网络上搜索你需要的数据。\n\n## 使用 pandas 处理数据\n\nPython 的 pandas 库\
  \ (`[https://pandas.pydata.org]`) 是一个免费选项，你可以用它操作、清洗和分析结构化数据。无论你是在处理逗号分隔值 (CSV)\
  \ 文件、Microsoft Excel 文件还是来自结构化查询语言 (SQL) 数据库的数据，pandas 都提供了一种直观的方法来重塑、过滤和聚合你的数据。凭借其庞大的社区和详尽的文档，pandas\
  \ 是应对任何数据处理任务的绝佳选择。\n\n## 使用 Looker Studio 可视化数据\n\nLooker Studio (`[https://lookerstudio.google.com]`)\
  \ 旧称为 Google Data Studio，已演变为一个强大的数据分析平台，允许用户分析来自各种来源的数据，包括数据库、数据仓库和第三方应用程序——而不仅仅是\
  \ Google Analytics。它是一个免费的云端数据可视化和商业智能工具，你可以用它将原始数据转换为具有洞察力可共享的报告和仪表板。如果你希望通过清晰且交互式的报告做出数据驱动的决策，请务必探索\
  \ Looker Studio 能为你提供什么。\n\n## 使用 scikit-learn 进行机器学习\n\n机器学习是人工智能 (AI) 的一类，致力于开发和应用算法到数据上，以便算法自动学习并检测大型数据集中的模式。机器学习领域最重要的库之一是\
  \ scikit-learn (`[https://scikit-learn.org]`)，它是一个用户友好且多功能的 Python 库，简化了构建、训练和评估机器学习模型的过程。它被广泛用于传统的机器学习任务，如分类、回归、聚类和降维。\n\
  \n## 使用 Streamlit 创建交互式仪表板\n\nStreamlit (`[https://streamlit.io]`) 是一个强大且易于使用的 Python\
  \ 库，用于构建交互式 Web 应用和数据仪表板。你可以用它快速将 Python 脚本转换为基于 Web 的应用程序，即使你没有 Web 开发专业知识。Streamlit\
  \ 的简单性和灵活性使其成为创建数据科学原型、仪表板甚至机器学习模型演示的日益受欢迎的选择。\n\n## 使用 Kepler.gl 进行地理空间数据可视化\n\n\
  Kepler.gl (`(https://kepler.gl)`) 是一个由 Uber 开发的开源、高性能工具，用于可视化大规模地理空间数据。它使得在地理背景下探索、分析和展示数据变得简单。该工具特别擅长处理和显示大型数据集。它为处理空间数据提供了灵活性性能。\n\
  \n## 使用 Tableau Public 制作图表\n\nTableau Public (`[www.tableausoftware.com/public]`)\
  \ 是一款免费的桌面应用程序，旨在提供一套完整的图表制作方案。由于免费软件的限制，该程序不允许将文件保存到本地计算机。除非你购买该软件，否则你的所有工作必须上传到\
  \ Tableau Public 的云服务器上。\n\nTableau Public 创建三个层级的文档：工作表 (worksheet)、仪表板 (dashboard)\
  \ 和故事 (story)。在工作表中，你可以根据从 Access、Excel 或 CSV 文件导入的数据创建单个图表。然后你可以使用 Tableau Public\
  \ 轻松执行操作，例如在不同的数据图形类型之间进行选择，或将列拖到不同的轴或子组。\n\n## 使用 RAWGraphs 进行 Web 数据可视化\n\n你可以使用\
  \ RAWGraphs (`[www.rawgraphs.io]`) 这种独特且不寻常的 Web 应用程序从你的数据制作艺术化和创意性的可视化。RAWGraphs\
  \ 的布局具有简单的拖拽界面，你只需点击几次鼠标即可创建独特且有趣的可视化。如果你想让你的数据可视化变得新颖、酷炫，但又缺乏学习编写这类代码的时间或金钱，RAWGraphs\
  \ 是完美的可视化替代方案。\n\n## 使用 Infogram 制作酷炫的信息图\n\n你可以使用在线工具 Infogram (`[https://infogram.com]`)\
  \ 制作具有美感的垂直堆叠卡片式信息图（由一系列卡片垂直堆叠组成的可视化，每张卡片都有自己的一套数据图形）。Infogram 提供了各种时尚配色、设计方案和图表类型。通过\
  \ Infogram，你可以导入自己的图片来制作更具个性化的信息图。Infogram 还提供了分享功能，让你能够通过社交渠道或私有邮件快速方便地传播信息图。其免费增值计划足以满足你所有基础的信息图制作需求。\n\
  \n## 使用 Canva 制作酷炫的信息图\n\nCanva (`[www.canva.com]`) 是多功能工具，你可以用它设计专业的信息图，即使你没有高级设计技能。Canva\
