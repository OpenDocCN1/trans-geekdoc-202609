  \ `r` 接近 +1，则变量之间存在强正相关。\n*   如果 `r` = 0，则变量之间没有线性相关。\n*   如果 `r` 接近 –1，则变量之间存在强负相关。\n\
  \n### 使用斯皮曼等级相关系数对变量对进行排序\n\n斯皮曼等级相关是确定定序变量之间相关性的流行方法。通过应用斯皮曼等级相关，你通过计算变量之间关系的强度，将数值变量对转换为等级，然后根据它们的相关性对它们进行排序。\n\
  \n斯皮曼等级相关假设以下条件：\n\n*   **你的变量是定序的。**\n*   **你的变量是非线性的相关的。** 你可以通过观察图表来识别变量之间的非线性。如果两个变量之间的图表产生了曲线（如图\
  \ 4-2 所示），则变量之间存在非线性关系。这种曲率的出现是因为当变量以非线性方式相关时，`x` 值的变化并不一定对应数据集中 `y` 值的相同变化。\n*\
  \   **你的数据是非正态分布的。**\n\n![FIGURE 4-2: 观看时间与观看百分比之间非线性关系的示例。](img/9781394297009-fg0402.png)\n\
