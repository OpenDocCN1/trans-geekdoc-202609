    ## 6.3 Chapter Notes


    In this chapter, we have introduced the method of distributed momentum for reducing
    the gradient complexity of Robust DMGD, thereby obtaining an order-optimal robustness
    at a reduced computational cost. As we had seen in Chap. 5 that although the composition
    of a robust averaging with the pre-aggregation scheme of NNM yields an order-optimal
    training error, the resulting gradient complexity can be orders of magnitude higher
    than a traditional (non-robust) machine learning algorithm. Hence, Robust DMGD
    imposes a prohibitively high gradient complexity for achieving an order-optimal
    training error. We have shown that an efficient alternative to Robust DMGD is
    Robust DMHB, i.e., the robust variant of the *distributed mini-batch heavy-ball*
    method. Essentially, in Robust DMHB, the server uses the robust aggregation of
    local *gradient* *moments* to update a model. This


    method yields order-optimal training error in the presence of adversarial nodes,
    while imposing minimal overhead on gradient complexity (of honest nodes). We have
    shown that the incorporation of local gradient momentum diminishes the impact
    of gradient noise on the asymptotic convergence of the learning procedure. This
    holds true for both non-convex and strongly convex loss functions. For proving
    this result, we introduced a general technique of analyzing the convergence of
    an optimization algorithm, specifically the *Lyapunov analysis*. Further details
    on this proof technique can be found in [5]. In general, Lyapunov analysis is
    widely used for characterizing the stability of non-linear dynamical systems [12,
    14]. In the specific context of robust machine learning, these proofs are inspired
    from our recent work [3, 4, 8].


    The fundamental limitation of *memoryless* robust aggregation is due to their
    *permutation invariance property*. That is to say, the trajectory of the model
    parameter vector over the course of Robust DMGD, using a memoryless aggregation,
    remains invariant to arbitrary shuffling of the nodes across iterations. The use
    of *history* of past gradients breaks this permutation invariance property and
    has been shown to be effective for Byzantine resilience, e.g., see [1, 2]. Related
    adaptations using *Polyak''s momentum* were proposed and analyzed under standard
    machine learning assumptions in [3, 8, 11]. The effectiveness of distributed momentum
    has also been demonstrated empirically [7, 13]. The key property of Polyak''s
    momentum that makes it effective against adversarial nodes is variance reduction
    with *controllable bias*. Other variance-reduction techniques, specifically SAGA
    [6] and VR-MARINA [9], have also been shown to be effective [10, 15]. However,
    these variance-reduction techniques induce higher gradient complexity compared
    to Polyak''s momentum.


