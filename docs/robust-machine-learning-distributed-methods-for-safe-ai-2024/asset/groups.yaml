    ## 5.1.2 鲁棒性放大


    本节中，我们分析 NNM 的鲁棒性放大特性。我们证明 NNM 与 $(f, \kappa)$-鲁棒规则 $F$ 的组合产生一个新的聚合规则 $F'' :=
    F \circ \operatorname{NNM}$，其鲁棒系数相比于 $F$ 得到改善。分析分为两步。首先，我们在引理 5.1 中得到一个通用结果，该结果将
    NNM 输出的向量的经验方差与输入向量的方差联系起来。然后，我们在定理 5.1 中基于该结果精确刻画 NNM 的鲁棒性放大特性。


    ### 方差减小


    引理 5.1 允许我们证明 NNM 的方差减小特性。具体而言，我们任意考虑一个向量 $\mathbf{u} \in \mathbb{R}^d$，一个来自 $\mathbb{R}^d$
    的 $n$ 个向量集合 $\{\mathbf{v}_1, \ldots, \mathbf{v}_n\}$，以及一个包含 $n - f$ 个元素的子集 $S
    \subseteq [n]$。我们随后得到向量 $\mathbf{v}_i$, $i \in S$ 的平均值 $\overline{\mathbf{v}}_S$
    与 $\{\mathbf{v}_1, \ldots, \mathbf{v}_n\}$ 中 $\mathbf{u}$ 的最近邻的 $n - f$ 个向量的平均值之间的（欧几里得）距离的上界。该界限表明
    NNM 导致（经验）方差的减小，我们在给出引理 5.1（及其证明）后立即对此进行阐述。


    **引理 5.1** 考虑任意向量 $\mathbf{u} \in \mathbb{R}^d$ 和任意 $n$ 个向量集合 $\mathbf{v}_1, \ldots,
    \mathbf{v}_n \in \mathbb{R}^d$。令 $N_u \subseteq [n]$ 为表示集合 $\{\mathbf{v}_1, \ldots,
    \mathbf{v}_n\}$ 中 $\mathbf{u}$ 的 $n - f$ 个最近邻的指标集。则对于任意满足 $|S| = n - f$ 的 $S \subseteq
    [n]$，以下成立：


    $$

    \|\mathbf{z}_u - \overline{\mathbf{v}}_S\|^2 \le \frac{4f}{(n - f)^2} \sum_{i
    \in S} \|\mathbf{v}_i - \mathbf{u}\|^2,

    $$


    其中 $\mathbf{z}_u := \frac{1}{n-f} \sum_{i \in N_u} \mathbf{v}_i$ 且 $\overline{\mathbf{v}}_S
    := \frac{1}{n-f} \sum_{i \in S} \mathbf{v}_i$。


    **证明** 考虑任意 $S \subseteq [n]$ 使得 $|S| = n - f$。回忆 $N_u \subseteq [n]$ 是 $\{\mathbf{v}_1,
    \ldots, \mathbf{v}_n\}$ 中 $\mathbf{u}$ 的 $n - f$ 个最近邻的指标集。则根据 $\mathbf{z}_u$ 和
    $\overline{\mathbf{v}}_S$ 的定义，我们得到


    $$

    \|\mathbf{z}_u - \overline{\mathbf{v}}_S\|^2 = \left\| \frac{1}{n - f} \sum_{i
    \in N_u} \mathbf{v}_i - \frac{1}{n - f} \sum_{i \in S} \mathbf{v}_i \right\|^2
    = \frac{1}{(n - f)^2} \left\| \sum_{i \in N_u} \mathbf{v}_i - \sum_{i \in S} \mathbf{v}_i
    \right\|^2.

    $$


    进一步简化右边差值，我们得到


    $$

    \|\mathbf{z}_u - \overline{\mathbf{v}}_S\|^2 = \frac{1}{(n - f)^2} \left\| \sum_{i
    \in N_u \setminus S} \mathbf{v}_i - \sum_{i \in S \setminus N_u} \mathbf{v}_i
    \right\|^2.

    $$


    引理 5.1 中给出的界限意味着 NNM 的方差减小。具体而言，考虑任意大小为 $n-f$ 的 $S \subseteq [n]$ 和任意 $i \in S$。然后，将
    $\mathbf{u} = \mathbf{v}_i$ 代入引理 5.1 中，我们得到


    $$

    \|\mathbf{z}_i-\overline{\mathbf{v}}_S\|^2 \leq \frac{4f}{(n-f)^2}\sum_{j\in S}\|\mathbf{v}_j-\mathbf{v}_i\|^2,

    $$


    其中回顾 $\mathbf{z}_i$ 如第 5.1.1 节中所定义。如上所述对任意 $i \in S$ 成立，我们得到


    $$

    \sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{v}}_S\|^2 \leq \frac{4f}{(n-f)^2}\sum_{i\in
    S}\sum_{j\in S}\|\mathbf{v}_j-\mathbf{v}_i\|^2,

    $$


    其中回顾 $(\mathbf{z}_1,\ldots,\mathbf{z}_n) := \operatorname{NNM}(\mathbf{v}_1,\ldots,\mathbf{v}_n)$。注意，如备注
    4.5 中所述，$\sum_{i\in S}\sum_{j\in S}\|\mathbf{v}_j-\mathbf{v}_i\|^2 = 2|S|\sum_{i\in
    S}\|\mathbf{v}_i-\overline{\mathbf{v}}_S\|^2$。因此，由上式可得


    $$

    \frac{1}{|S|}\sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{v}}_S\|^2 \leq \frac{8f}{n-f}\cdot\frac{1}{|S|}\sum_{i\in
    S}\|\mathbf{v}_i-\overline{\mathbf{v}}_S\|^2. \tag{5.4}

    $$


    令 $\overline{\mathbf{z}}_S := \frac{1}{|S|}\sum_{i\in S}\mathbf{z}_i$。则我们得到


    $$

    \sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{v}}_S\|^2 = \sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{z}}_S-(\overline{\mathbf{v}}_S-\overline{\mathbf{z}}_S)\|^2
    = \sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{z}}_S\|^2 + |S|\|\overline{\mathbf{v}}_S-\overline{\mathbf{z}}_S\|^2.

    $$


    将上述式子代入 (5.4)，我们得到


    $$

    \frac{1}{|S|}\sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{z}}_S\|^2 + \|\overline{\mathbf{v}}_S-\overline{\mathbf{z}}_S\|^2
    \leq \frac{8f}{n-f}\cdot\frac{1}{|S|}\sum_{i\in S}\|\mathbf{v}_i-\overline{\mathbf{v}}_S\|^2.
    \tag{5.5}

    $$


    这意味着对应于诚实节点的 NNM 输出的向量的方差，即当 $S = H$ 时，小于原始方差，前提是敌对节点的比例 $\frac{f}{n}$ 足够小（使得
    $\frac{8f}{n-f} < 1$）。具体而言，由于 (5.5)，我们有


    $$

    \frac{1}{|H|}\sum_{i\in H}\|\mathbf{z}_i-\overline{\mathbf{z}}_H\|^2 \leq \frac{8f}{n-f}\cdot\frac{1}{|H|}\sum_{i\in
    H}\|\mathbf{v}_i-\overline{\mathbf{v}}_H\|^2.

    $$


    在下文中，我们使用上述分析，特别是 (5.5)，来推导 NNM 赋予鲁棒聚合规则的鲁棒性放大。


    ### 可证明更紧的鲁棒系数


    上述 NNM 的方差减小特性使我们能够展示该方案如何增强 $(f, \kappa)$-鲁棒平均的鲁棒系数。具体而言，以下结果成立。


    **定理 5.1** *考虑聚合规则 $F : \mathbb{R}^{d \times n} \rightarrow \mathbb{R}^d$。如果 $F$
    是 $(f, \kappa)$-鲁棒平均，则 $F \circ \operatorname{NNM}$ 是 $(f, \kappa'')$-鲁棒平均其中*


    $$

    \kappa'' \leq \frac{8f}{n - f}(\kappa + 1).

    $$


    *证明* 考虑 $n$ 个任意向量 $\mathbf{v}_1, \ldots, \mathbf{v}_n \in \mathbb{R}^d$，以及任意 $S
    \subseteq [n]$ 使得 $|S| = n - f$。记 $(\mathbf{z}_1, \ldots, \mathbf{z}_n) := \operatorname{NNM}(\mathbf{v}_1,
    \ldots, \mathbf{v}_n)$ 且 $\overline{\mathbf{z}}_S := \frac{1}{|S|} \sum_{i \in
    S} \mathbf{z}_i$。由于假设 $F$ 是 $(f, \kappa)$-鲁棒平均，以下成立：


    $$

    \begin{aligned}

    \|F \circ \operatorname{NNM}(\mathbf{v}_1, \ldots, \mathbf{v}_n) - \overline{\mathbf{z}}_S\|^2
    &= \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n) - \overline{\mathbf{z}}_S\|^2 \\

    &\leq \frac{\kappa}{|S|} \sum_{i \in S} \|\mathbf{z}_i - \overline{\mathbf{z}}_S\|^2.
    \tag{5.6}

    \end{aligned}

    $$


    注意对于任意实值 $a_1, a_2$ 和 $a_3 > 0$，根据 Young 不等式，我们有 $(a_1 + a_2)^2 \leq (1 + a_3)(a_1)^2
    + (1 + \frac{1}{a_3})(a_2)^2$。因此，利用三角不等式，我们得到


    $$

    \begin{aligned}

    \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n) - \overline{\mathbf{v}}_S\|^2 &= \|F(\mathbf{z}_1,
    \ldots, \mathbf{z}_n) - \overline{\mathbf{z}}_S + \overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2
    \\

    &\leq \left(1 + \frac{1}{\kappa}\right) \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n)
    - \overline{\mathbf{z}}_S\|^2 \\

    &\quad + (1 + \kappa) \|\overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2.

    \end{aligned}

    $$


    将 (5.6) 代入上述式子，我们得到


    $$

    \begin{aligned}

    \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n) - \overline{\mathbf{v}}_S\|^2 &\leq \left(1
    + \frac{1}{\kappa}\right) \frac{\kappa}{|S|} \sum_{i \in S} \|\mathbf{z}_i - \overline{\mathbf{z}}_S\|^2
    \\

    &\quad + (1 + \kappa) \|\overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2
    \\

    &= (1 + \kappa) \left( \frac{1}{|S|} \sum_{i \in S} \|\mathbf{z}_i - \overline{\mathbf{z}}_S\|^2
    + \|\overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2 \right). \tag{5.7}

    \end{aligned}

    $$

