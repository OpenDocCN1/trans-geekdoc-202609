    $$\mathbb{E}_t\left[\mathcal{L}_H(\theta_{t+1})\right] \le \mathcal{L}_H(\theta_t)
    - \gamma_t\left\langle\nabla \mathcal{L}_H(\theta_t), \mathbb{E}_t\left[\hat{\mathbf{g}}_t\right]\right\rangle
    + \frac{L}{2}\gamma_t^2 \mathbb{E}_t\left[\left\|\hat{\mathbf{g}}_t\right\|^2\right].
    \tag{4.20}$$


    回顾 (4.14)，有


    $$\hat{\mathbf{g}}_t = F\left(\mathbf{g}_t^{(1)}, \ldots, \mathbf{g}_t^{(n)}\right)
    = \mathbf{g}_t^H + \boldsymbol{\delta}_t. \tag{4.21}$$


    由于对每个诚实的节点 $i \in H$，有 $\mathbb{E}_t\left[\mathbf{g}_t^{(i)}\right] = \nabla \mathcal{L}_i(\boldsymbol{\theta}_t)$，因此
    $\mathbb{E}_t\left[\mathbf{g}_t^{H}\right] = \nabla \mathcal{L}_H(\boldsymbol{\theta}_t)$。于是，


    $$\mathbb{E}_t\left[\widehat{\mathbf{g}}_t\right] = \nabla \mathcal{L}_H(\boldsymbol{\theta}_t)
    + \mathbb{E}_t\left[\boldsymbol{\delta}_t\right]. \tag{4.22}$$


