    In 1956, John McCarthy and Marvin Minsky hosted a historical meeting: the Dartmouth
    Summer Research Project on Artificial Intelligence (DSRPAI). The goal was to bring
    together top researchers from various fields for an open-ended discussion on *Artificial
    Intelligence (AI)*; the term AI was coined by McCarthy at that very event. However,
    there has never been any agreed definition of the term AI, and the event did not
    produce any concrete results. Yet, this event somehow launched decades of activities
    in various kinds of research called AI. In particular, a year later, the first
    neural network, called the *perceptron*, was designed by Frank Rosenblatt.


    # **What Is AI, Anyway?**


    We define AI as *the ability of a machine to solve a problem that humans believed
    they were the only ones capable of solving*. In other words, we talk about AI
    whenever a machine surprises us by solving a specific task. However, after the
    surprise effect, we cease using this term (at least regarding the specific task).
    This is the case, for example, with the game of chess. When IBM’s Deep Blue beat
    Garry Kasparov, the then reigning world champion, we called that machine an AI.
    Today, even a smartphone is capable of beating all chess world champions, and
    we do not talk about AI anymore for chess. Then came the game of Go, arguably
    more challenging than chess due to the huge number of possible combinations. Again,
    a machine was eventually able to beat the world champion. We talked about AI again,
    but not for long.


    Similarly, a decade ago, no machine was comparable to a human in language or image
    recognition. Today (in 2023), machines arguably compete with humans in both these
    domains. Machines have also become much better at generating images and producing
    language. Currently, e-mails are completed, online texts are translated, videos
    are transcribed, reports are generated, and media outlets are published in an
    automatic manner. Furthermore, recommender systems determine the content we see
    on social media and even the products we buy from online shops. With their capacity
    to generate images and texts, machines are likely creating a large fraction of
    the media we consume.


    Although that which we call AI has evolved over the years, the pragmatic purpose
    remains unchanged: surpassing human capabilities in cognitive tasks such as vision,
    natural language processing, knowledge representation, and reasoning. The initial
    idealistic goal of replicating brain functions has been, however, largely supplanted
    by data-driven methodologies, the so-called *machine learning*.


    # ### *1.1.2 Machine Learning*


    The idea of a machine that learns is as old as computer science is. It dates back
    to the days of Alan Turing. Indeed, he conjectured that *learning* is the key
    to passing his *intelligence test*. In short, Turing explained that it is physically
    impossible for a machine to a priori store (in its memory) all possible cases
    that it might need to deal'
