    $$\min_{h \in \mathcal{H}} \frac{1}{m} \sum_{i=1}^m \ell \left( h(\mathbf{x}_i),
    y_i \right),$$


    where $\ell : \mathbb{R}^{|\mathcal{Y}|} \times \mathcal{Y} \rightarrow \mathbb{R}$
    is a *point-wise loss function*. The loss function $\ell$ measures how well a
    hypothesis $h$ does on predicting the output $y$ of an input $\mathbf{x}$. The
    smaller the value of $\ell(h(\mathbf{x}), y)$ the better $h$ performs on the sample
    $(\mathbf{x}, y)$. If this loss function is sufficiently well chosen, the average
    of this loss over $\mathcal{S}$ is an estimate of the *expected loss* that the
    hypothesis $h$ incurs over the true distribution $\mathcal{D}$. The following
    section presents some common choices for the hypothesis class and the point-wise
    loss function.


    **Remark 2.1** We intentionally ignore the connection between the ERM and the
    performance of $h^*$ on unseen samples drawn from $\mathcal{D}$. This connection
    (a.k.a. generalization) lies at the core of supervised learning and is highly
    related to the selection of the hypothesis class $\mathcal{H}$. This concept is,
    however, orthogonal to the topic presented in this book that focuses on the optimization
    part of the machine learning algorithm. For more discussion on why solving the
    ERM (or a regularized version of the ERM) is essential to finding a hypothesis
    with good generalization capabilities, we refer the interested reader to Sect.
    2.3 and references therein.


    # 2.1.2 Hypothesis Classes and Loss Functions


    In principle, we could choose the hypothesis class $\mathcal{H}$ to be any set
    of functions from $\mathcal{X}$ to $\mathbb{R}^{|\mathcal{Y}|}$. However, optimizing
    over a general function space is hard. Furthermore, controlling the size of such
    sets is also arguably challenging. To overcome this conundrum, in machine learning
    we typically use *parameterized hypotheses*. This largely simplifies the ERM problem,
    while the size of the hypothesis class can be adjusted by controlling the size
    of the *parameter space*. Below we present two special cases of the classification
    problem where we present possible hypothesis classes and associated loss functions.


