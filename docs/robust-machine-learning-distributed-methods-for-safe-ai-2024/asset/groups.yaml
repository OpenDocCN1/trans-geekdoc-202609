    $\mathbf{g}_t^{(i)} = \frac{1}{b} \sum_{(\mathbf{x},y) \in S_t^{(i)}} \nabla_\theta
    \ell \left( h_{\theta_t}(\mathbf{x}), y \right),$


    and where $S_t^{(i)}$ is a set of $b$ data points sampled randomly (without replacement)
