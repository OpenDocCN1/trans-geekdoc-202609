    $$\left(\frac{1}{2}-L\gamma_t\right)\mathbb{E}\left[\|\nabla \mathcal{L}_H(\theta_t)\|^2\right]\le
    \frac{\mathbb{E}[\mathcal{L}_H(\theta_t)]-\mathbb{E}[\mathcal{L}_H(\theta_{t+1})]}{\gamma_t}$$

    $$\qquad +\gamma_t\frac{L\sigma^2}{(n-f)b}+\left(\frac{1}{2}+L\gamma_t\right)\left(4\kappa\frac{\sigma^2}{b}+\kappa\zeta\right).$$

