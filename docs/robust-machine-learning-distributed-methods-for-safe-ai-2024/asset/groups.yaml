    # Chapter 2

    Basics of Machine Learning


    Abstract Machine learning consists in designing algorithms that exploit data (sometimes
    called observations) in order to acquire domain knowledge and perform an automated
    decision-making task. Contrary to most conventional computing tasks, learning
    algorithms are data-dependent in the sense that they build task-specific models
    and improve upon them using the data fed to them. Machine learning algorithms
    are mainly classified into four classes: supervised learning, unsupervised learning,
    semi-supervised learning, and reinforcement learning. Each of these classes has
    its own interest and peculiarities. In this book, we focus on supervised classification
    to illustrate and to formalize the main concepts of robust machine learning. Most
    of the robustness techniques we discuss however in the book can also be applied
    to other machine learning classes. In this chapter, we present the fundamentals
    of supervised learning, through the specifics of the supervised classification
    task, and we review some of the standard optimization algorithms used for solving
    this task.


    # 2.1 Supervised Classification


    In supervised learning, the data (or observations) consist of input–output pairs,
    and the algorithm uses these pairs to build a function, a.k.a., a predictor, that
    maps an input to an output by identifying a pattern in the observations. This
    predictor can then be used to provide labels for unseen inputs. For example, as
    illustrated in Fig. 2.1, the predictor can take a picture as an input and tell
    us whether this image represents an elephant, a chicken, a mouse, or a snake.¹
    When the outputs are categorical, the supervised-learning problem is also called
    supervised classification. We formalize this concept below and quickly go over
    the driving principles behind the selection of a good predictor.


    ¹ The animal icons we use in this figure are courtesy of the Freepick team. See
    the following links for the respective icons: Elephant, Chicken, Mouse and Snake.'
