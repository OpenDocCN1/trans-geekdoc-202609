    # 4.4 Resilience of Robust DMGD


    In this section, we analyze the resilience property for the Robust DMGD algorithm
    when the aggregation rule corresponds to one of the schemes introduced above.
    We start by analyzing the generic convergence of the Robust DMGD algorithm, with
    the aggregation rule $F$ satisfying the property of $(f, \kappa)$-robust averaging.
    We consider two cases, specifically, the average loss function for the honest
    nodes being either strongly convex or non-convex.


    # Assumptions


    For the convergence analysis, we make the same assumptions on the smoothness of
    the point-wise loss function and the covariance trace of the local gradient estimates,
    i.e., Assumptions 3.1 and 3.2, respectively. Moreover, we characterize the heterogeneity
    among the data held by the nodes through means of a bound on their *gradient dissimilarities*.
    In general, it is impossible to obtain any meaningful robustness guarantee when
    no such bound is assumed, as shown later in Sect. 5.3.2.


    **Assumption 4.1 ($\zeta$-Gradient Dissimilarity)** Let $H$ be a subset of $[n]$
    comprising $n-f$ honest nodes, i.e., $|H|=n-f$. Then, there exists a real value
    $\zeta$ such that for all $\theta\in\mathbb{R}^d$, the following holds true:


    $$\frac{1}{n-f}\sum_{i\in H}\|\nabla\mathcal{L}_i(\theta)-\nabla\mathcal{L}_H(\theta)\|^2\leq\zeta.$$


    Recall that $\mathcal{L}_H(\theta):=\frac{1}{n-f}\sum_{i\in H}\mathcal{L}_i(\theta)$.


    In the subsequent section, we study the deviation of the Robust DMGD algorithm
    from the classic DMGD algorithm (presented earlier) when the aggregation rule
