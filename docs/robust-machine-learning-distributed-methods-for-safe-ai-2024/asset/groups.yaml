    # Large Momentum Coefficient Increases Deviation


    For simplicity, suppose that we have a constant learning rate γ and a constant
    momentum coefficient β. Then, observe that the rate of growth of the deviation
    analyzed in Lemma 6.3 is effectively given by the factor (1 + γL)(1 + 4γL)β².
    For the deviation to be stable, i.e., to be bounded eventually by a finite value,
    this factor needs to be less than (or equal to) 1. Specifically, if β² is larger
    than (1 + γL), the honest nodes’ average momentum can deviate arbitrarily from
    the average of their local gradients, which could prevent the learning algorithm
    from converging to a stationary point. This observation is also valid in the case
    when there are no adversarial nodes. This rate of growth of the deviation ξₜ,
    with respect to β, is contrary to that of the aggregation error δₜ. Although controlling
    the former is important to the convergence of the algorithm, the latter is critical
    to the robustness against adversarial nodes. In the following section, we present
    a candidate for the momentum coefficient that favorably controls the opposing
    consequences of local momentum on deviation and aggregation error.


    # 6.2  Resilience of Robust Distributed Mini-Batch Heavy Ball


    In this section, we analyze the resilience (and stationary resilience) property
    of Robust DMHB, i.e., Algorithm 6. For the analysis, we make use of the above
    results pertaining to the aggregation error and the momentum deviation, i.e.,
    Lemmas 6.2 and 6.3, respectively. We begin by presenting an important sub-result
    that concerns the growth of the loss function 𝓛_H(θₜ) over the trajectory of the
    parameter vector θₜ in Algorithm 6. Although studying the loss function growth
    is essential to characterizing the final convergence of Robust DMHB, it is not
    sufficient on its own, unlike the case of Robust DMGD. We need to address an additional
    complication. Specifically, the presence of non-vanishing momentum deviation leads
    to a stochastic bias in the learning procedure that must be carefully controlled.'
