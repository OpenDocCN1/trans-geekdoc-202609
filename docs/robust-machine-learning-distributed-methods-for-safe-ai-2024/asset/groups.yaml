    ## 6.3 本章注释


    在本章中，我们引入了分布式动量方法，以降低 Robust DMGD 的梯度复杂度，从而在降低计算成本的同时获得阶最优鲁棒性。正如我们在第5章中所见，尽管鲁棒平均与
