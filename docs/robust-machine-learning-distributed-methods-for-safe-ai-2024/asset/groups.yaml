    we assume that a majority of the nodes in the system are honest. Below, we consider
    a given set of $n$ input vectors $\mathbf{v}_1, \dots, \mathbf{v}_n$ from $\mathbb{R}^d$
    and define our aggregation rule on this set. Recall that for a vector $\mathbf{v}$,
    $[\mathbf{v}]_k$ denotes its $k$-th element.


    **Coordinate-Wise Median (CWMed)**


    This aggregation rule is a straightforward vector implementation of the scalar
    median operator. Specifically, the coordinate-wise median CWMed $(\mathbf{v}_1,
    \dots, \mathbf{v}_n)$ is a vector in $\mathbb{R}^d$ whose $k$-th element, for
    all $k \in [d]$, is given by


    $$[\text{CWMed} (\mathbf{v}_1, \dots, \mathbf{v}_n)]_k = \text{median} \left([\mathbf{v}_1]_k,
    \dots, [\mathbf{v}_n]_k\right) . \tag{4.5}$$


    Clearly, in the scalar case, i.e., when $d = 1$, the coordinate-wise median reduces
    to the classic median that is more robust than the averaging (as we just discussed).
    Computing the coordinate-wise median is very time-efficient. Indeed, by using
    the *BFPRT algorithm* [8], a median for each coordinate can be computed in a linear
    amount of operations (with respect to $n$). Accordingly, CWMed has an overall
    time complexity $\mathcal{O}_n(nd)$, which matches the time complexity of computing
    the average of $d$-dimensional vectors.


    **Geometric Median (GeoMed)**


    This aggregation rule is a generalization of median to high-dimensional spaces.
    Specifically, the geometric median of a set of input vectors is defined to be
    a vector that minimizes the sum of the Euclidean distances to the input vectors,
    i.e.,


    $$\text{GeoMed} (\mathbf{v}_1, \dots, \mathbf{v}_n) \in \underset{\mathbf{v} \in
    \mathbb{R}^d}{\text{argmin}} \sum_{i=1}^n \| \mathbf{v} - \mathbf{v}_i \| . \tag{4.6}$$


    In the special case of scalar inputs, (i) when $n$ is odd, the traditional median
    is equivalent to the geometric median, and (ii) when $n$ is even, the geometric
    median need not be unique, but the traditional median is a valid geometric median.
    This means that, in the scalar case, the geometric median and the coordinate-wise
    median basically coincide. But, when $d > 1$, this equivalence need not hold anymore.
    In the general high-dimensional space of $\mathbb{R}^d$, the geometric median
    is the Euclidean *barycenter* of the input vectors. However, the coordinate-wise
    median does not enjoy this geometric property. Hence, we can expect geometric
    median to have better robustness (against input corruptions) than coordinate-wise
    median. More details on this comparison are presented later in Sect. 4.3.


    **Remark 4.2** Although the geometric median has a reasonable robustness property
    (against input corruptions), in general, there exists no closed-form solution
    for this operation. Existing methods compute an approximation of geometric median
    using iterative schemes, e.g., the *Weiszfeld''s method*. We refer the interested
    reader to [11] for more discussion on efficient approximation methods for geometric
    median.'
