    # Chapter 4


    # Fundamentals of Robust Machine Learning


    ![](img/86043981d34dd325adb0d4b75e402b8d_65_0.png)


    **Abstract** As explained in the previous chapter, distributing the learning procedure
    significantly simplifies the task of training complex models on a large amount
    of data. The workload for each node is divided essentially by the total size of
    the network, while the nodes retain the control over their local data. However,
    the perks of federated machine learning rest upon the unrealistic assumption that
    each node *correctly* executes the prescribed algorithm and all its data are trustworthy.
    This assumption need not hold true in practice. In this chapter, we revisit the
    problem of federated machine learning in the case when some of the participating
    nodes *deviate* from the set of instructions prescribed to them. As discussed
    in the introduction of this book, this deviation can be caused by bad data, software
    bugs, hardware failures, or even malicious attackers controlling some of the nodes.
    Under the presence of such *adversarial* nodes, traditional distributed-learning
    methods fail to guarantee good accuracy. We explain in this chapter how the traditional
    server-based gradient-descent methods can be rendered robust against a *minority*
    of adversarial nodes, and we analyze the *training error* of the resulting *robust
    gradient-descent* algorithm.


    # 4.1 Getting Started with Robustness


    Due to the presence of multiple nodes running independent operations, federated
    machine learning is prone to having misbehaving nodes. In the parlance of distributed
    computing, misbehaving (hereafter called *adversarial*) nodes that behave arbitrarily
    are commonly referred to as *Byzantine*. The distributed gradient-descent methods
    we presented until now are not robust to adversarial nodes. In fact, a single
    adversarial node can significantly compromise the efficacy of the learning procedure
    by sending erroneous local gradients (or updates) to the server.'
  - '[PAGE 66]


    # 4.1.1 Fragility of Distributed Gradient Descent


    The main point of vulnerability of distributed gradient-descent methods is the
    *averaging operation* at the server in the global phase (see Algorithm 4). Basically,
    if a node $i \in [n]$ is adversarial, then the estimate of the local gradient
    $\tilde{\mathbf{g}}_i^{(t)}$ sent by node $i$ to the server in the global phase
    of the algorithm need not be a good representation of its true local gradient.
    When $\tilde{\mathbf{g}}_i^{(t)}$ is not computed as per the algorithm originally
    prescribed, the learning procedure could be compromised. Indeed, in the worst-case
    scenario, a single adversarial node can arbitrarily manipulate the outcome of
    the averaging operation in the global phase, which could trivially prevent the
    server from reaching a good machine learning model, as illustrated in Fig. 4.1.
    Note that while in Fig. 4.1 we illustrate the fragility of distributed gradient
    descent considering a small system of only 3 nodes, in practice we could have
    hundreds (or even thousands) of nodes. Surprisingly, even in a system comprising
    a large number of nodes, it is sufficient for a single node to be adversarial
    to severely degrade the performance of conventional distributed gradient descent.


    The very fact that the learning procedure can be arbitrarily manipulated in the
    face of an attack from a malicious entity (as depicted in Fig. 4.1), which can
    either poison the data of a node or take complete control of the node, is quite
    worrisome.


    ![](img/86043981d34dd325adb0d4b75e402b8d_66_0.png)


