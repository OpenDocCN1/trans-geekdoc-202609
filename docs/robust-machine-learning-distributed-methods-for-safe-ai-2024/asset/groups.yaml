    $\mathbb{E}_t \left[ \left\| \mathbf{g}_t^{(i)} - \nabla \mathcal{L}_i(\theta_t)
    \right\|^2 \right] = \frac{m - b}{b(m - 1)} \left( \frac{1}{m} \sum_{(\mathbf{x},y)
    \in S_i} \left\| \nabla_\theta \ell \left( h_{\theta_t}(\mathbf{x}), y \right)
    - \nabla \mathcal{L}_i(\theta_t) \right\|^2 \right).$


    $^a$This equality is a standard sampling result, e.g., see [4, Chapter 7].

