    \le \frac{4\sigma^2}{b} + \mathbb{E}_t\left[\left\|\nabla\mathcal{L}_i(\boldsymbol{\theta}_t)
    - \nabla\mathcal{L}_H(\boldsymbol{\theta}_t)\right\|^2\right].$$


    上式对每个节点 $i \in H$ 均成立。因此，


    $$\frac{\sum_{i \in H} \mathbb{E}_t\left[\left\|\mathbf{g}_t^{(i)} - \mathbf{g}_t^H\right\|^2\right]}{n
    - f} \le \frac{4\sigma^2}{b} + \frac{\sum_{i \in H} \mathbb{E}_t\left[\left\|\nabla\mathcal{L}_i(\boldsymbol{\theta}_t)
