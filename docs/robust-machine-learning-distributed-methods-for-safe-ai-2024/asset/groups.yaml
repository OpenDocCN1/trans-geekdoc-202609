    ## 第5章


    ### 最优鲁棒性


    ![](img/86043981d34dd325adb0d4b75e402b8d_103_0.png)


    **摘要**


    在上一章中，我们提出了一种方法，使经典的分布式小批量梯度下降（DMGD）方法能够抵御（少数）对抗节点，从而实现鲁棒性。基本上，我们看到，将服务器上的简单平均操作替换为满足
    $(f, \kappa)$-鲁棒平均性质的聚合方案后，所得的*鲁棒DMGD*方法最多可以容忍 $f$ 个对抗节点。我们通过 $(f, \varepsilon)$-弹性（以及平稳弹性）的定义，形式化了针对对抗节点的鲁棒性概念。具体来说，在强凸情况下，使用
    $(f, \kappa)$-鲁棒平均规则对DMGD进行“鲁棒化”是 $(f, \varepsilon)$-弹性的，即，在执行足够大的迭代次数 $T$ 后，输出一个
    $\varepsilon$-次优模型，其中 $\varepsilon \in \mathcal{O}_{\star}\left(\kappa \sigma^{2}+\kappa
    \zeta\right)$（若存在常数 $c \in \mathbb{R}^{+}$ 使得对所有 $a \in \mathbb{R}^{+}$ 有 $\phi(a)
    \leq c \psi(a)$，则记 $\phi(a) \in \mathcal{O}_{\star}(\psi(a))$。类似地，若存在常数 $c \in
    \mathbb{R}^{+}$ 使得对所有 $a \in \mathbb{R}^{+}$ 有 $\phi(a) \geq c \psi(a)$，则记 $\phi(a)
    \in \Omega_{\star}(\psi(a))$。这些约定在本章中广泛使用）。类似的结果也在非凸情况下得到，但以近似平稳性表示。尽管我们提出了一些简单的
    $(f, \kappa)$-鲁棒平均规则，但对于其中许多方案（例如 Krum、几何中位数和逐坐标中位数），由此产生的训练误差并非最优。具体来说，它们的鲁棒系数
    $\kappa$ 相对于可容忍的对抗节点比例 $\frac{f}{n}$ 而言是次优的。这种宽松性在实际场景中显著削弱了学习算法的整体弹性。在本章中，我们将展示如何通过使用*预聚合*方案，特别是最近邻混合（NNM）和分桶，来实现阶最优鲁棒性。这些方案在聚合之前进行干预，从而产生两步聚合规则。


