    **Fig. 2.5** Illustration of the non-convex function $(z_1, z_2) \mapsto \sqrt{|z_1
    z_2|} \sin(z_1) \sin(z_2)$ mapping $(0, 10)^2$ to $\mathbb{R}$. On the left: 3D
    representation of the function, with a color bar indicating the values of the
    function. On the right: contour plot of the function with the same color bar


    minimum. Figure 2.5 presents an example of a non-convex function with input space
    $\mathbb{R}^2$ and output space $\mathbb{R}$.


    When the loss function is non-convex and smooth, we can guarantee a bound on the
    *stationarity gap*, measured by the (Euclidean) norm of the gradient at the model
    produced by the training scheme. Specifically, there exists a decreasing (positive)
    function $\phi : \mathbb{R} \rightarrow \mathbb{R}$ such that if the algorithm
    outputs $\hat{\boldsymbol{\theta}}$ at the completion of $T$ iterations, we have


    $$\mathbb{E}\left[\|\nabla \mathcal{L}\left(\hat{\boldsymbol{\theta}}\right)\|^2\right]
    \leq \phi(T), \tag{2.13}$$


    where the expectation $\mathbb{E}[\cdot]$ is taken over the (possible) randomness
    of the algorithm. Similar to the strongly convex case, $\phi$ measures the speed,
    on average, at which the method can provide a stationary point. In Table 2.2,
    we present this mapping $\phi$ for GD, SGD, and mini-batch GD. Detailed convergence
    analyses of these methods can be derived from the analyses presented in Sect.
    3.2.2 upon substituting $n = 1$.


    **Table 2.2** The order of $\phi$ in (2.13) for GD, SGD, and mini-batch GD (with
    fixed batch-size $b$). This holds for a class of learning problems where $\mathcal{L}$
    is smooth, assuming that the stochastic gradients have bounded covariance trace


    | | GD | SGD | Mini-batch GD |

    |---|---|---|---|

    | $\phi(T)$ | $\mathcal{O}_T\left(\frac{1}{T}\right)$ | $\mathcal{O}_T\left(\sqrt{\frac{1}{T}}\right)$
    | $\mathcal{O}_T\left(\sqrt{\frac{1}{bT}}\right)$ |


    ### 2.2.3 Training Error and Gradient Complexity


    We now have at our disposal algorithms, specifically GD, SGD, and mini-batch GD,
    for solving the ERM problem (2.8). Each method is iterative in nature: We start
    with an arbitrary estimate of a “good model” and proceed to improve this estimate
    using gradients of the point-wise loss function on the training sample. The objective
    is to minimize the overall training error, i.e., the suboptimality or stationarity
    gap at the output model, depending upon the class of the loss function at hand.
    But, at the same time, we would like to minimize the gradient complexity, i.e.,
    the computation power spent in computing the gradients during the training procedure.
    We primarily focus on gradient computations because they represent the most expensive
    computational operations in the implementation of gradient-descent methods. Expectedly,
    there exists a trade-off between the training error and gradient complexity, which
    is precisely characterized by the convergence function $\phi$ of the method, as
    we explain below using the example of mini-batch GD.


    Recall, from Algorithm 3, that in each iteration of mini-batch GD we compute $b$
    gradients. This means that if we run $T$ iterations of mini-batch GD, our gradient
    complexity is proportional to $bT$. Suppose that the loss function $\mathcal{L}$
    is strongly convex. In that case, recall that there exists a function $\phi(T)
    \in \mathcal{O}_T(1/(bT))$ such that for the last updated model $\boldsymbol{\theta}_{T+1}$,
    the suboptimality gap is bounded as follows:


    $\mathbb{E}[\mathcal{L}(\boldsymbol{\theta}_{T+1}) - \mathcal{L}^*] \leq \phi(T)$


    Therefore, in order to obtain a training error lower than or equal to $\epsilon$,
    i.e., $\phi(T) = \epsilon$, we need $T \in \mathcal{O}_{1/\epsilon}(1/(b\epsilon))$
    iterations. Hence, the gradient complexity is given by $\mathcal{O}_{1/\epsilon}(1/\epsilon)$.
    This relationship between gradient complexity and training error applies directly
    to SGD as well. For GD (i.e., Algorithm 1), where in each iteration we compute
    $|S|$ number of gradients ($S$ being the whole training sample), as $\phi(T) \in
    \mathcal{O}_T(e^{-T})$, the gradient complexity is given by $\mathcal{O}_{1/\epsilon}(|S|
    \log 1/\epsilon)$. It appears that the gradient complexity of GD is smaller than
    mini-batch GD or SGD for obtaining the same training error $\epsilon$. However,
    this is usually not true in practical scenarios where the size of the training
    sample, i.e., $|S|$, is quite large and dominates the dependence on the training
    error in gradient complexity. We can extend the above analysis on the trade-off
    between training error and gradient complexity to the non-convex case by replacing
    the suboptimality gap by the stationarity gap (i.e., the squared Euclidean norm
    of the loss function’s gradient) at the output model.


    ## 2.3 Chapter Notes


    We have presented in this chapter a brief overview of supervised classification
    to illustrate and formalize the main concepts of machine learning. After formalizing
    the problem, we have reviewed some of the standard optimization tools for solving
    this task. Specifically, we have presented some of the most prominent optimization
    schemes in modern machine learning, namely gradient-based methods.


    The aim of this chapter is primarily to introduce the general optimization problem
    induced by supervised learning, rather than an exhaustive presentation of the
    field. In particular, we have not discussed topics such as generalization, structural
    risk minimization, consistency, and loss function calibration. For more details
    on the topic of supervised learning, we refer the reader to introductory books
    on machine learning such as [3, 9, 11, 15]. Those books present a more comprehensive
    overview of the field. In particular, they provide sufficient information on the
    concepts of generalization and structural risk minimization to enable a proper
    understanding on why (and when) the ERM (or a regularized version of the ERM)
    yields a satisfactory model on unseen data. For this specific point, we refer
    the interested reader to [11, Chapter 4] and [3, Chapter 4]. For a more specific
    introduction to calibration and consistency of loss functions, we refer the interested
    reader to [4, 16, 17].


    For advanced optimization algorithms and further details on gradient-descent methods,
    we refer the reader to [5–7, 12, 13]. Lower bounds on the convergence rate for
    first-order gradient-descent methods, with respect to $T$, can be found in [2,
    13]. Although the upper bound(s) for the stochastic (and mini-batch) gradient-descent
    method we presented in this chapter are tight in general, they can be further
    improved in the non-convex case using momentum-based variance reduction, upon
    additionally assuming the loss function to be smooth with respect to the data
    points, as shown in [8]. We present further interesting properties of momentum-based
    optimization in the context of robust machine learning in Chap. 5. For more details,
    including a tighter analysis, on the convergence of stochastic (and mini-batch)
    gradient descent in the non-convex case, we refer the interested reader to paper
    [10].


