    "well-defined" 的含义，因为我们的主要关注点是如何在给定集合 $\mathcal{H}$ 上进行优化，即如何找到 $h^*$。然而，一般来说选择合适的假设类
    $\mathcal{H}$ 并非易事。更多细节请参见 Remark 2.1。


