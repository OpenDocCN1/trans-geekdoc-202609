    is also *sufficient* for optimality when the loss function is *convex*, i.e.,
    $\theta_{\mathrm{stat}}$ is a minimum of a convex loss function. In which case,
    the gradient-descent approach yields an optimal solution. This, however, is not
    true in general, i.e., a stationary point need not be optimal when the loss function
    is *non-convex*. Nevertheless, a stationary point yields satisfactory model performance
    in many practical machine learning settings.


    ## Gradient Computations


    The success of a gradient-descent method depends on the quality of gradient computations.
    Computing an accurate gradient of the loss function is however not an easy operation.
    Recall, from (2.8), that $\mathcal{L}(\theta) := \frac{1}{m}\sum_{i=1}^{m}\ell\big(h_{\theta}(\mathbf{x}_i),
    y_i\big)$. In order to compute $\nabla \mathcal{L}(\theta)$, we have to compute
    gradients (with respect to $\theta$) of the point-wise loss function $\ell\big(h_{\theta}(\mathbf{x}_i),
    y_i\big)$ at all the $m$ training data points $(\mathbf{x}_i, y_i) \in S$. Computing
    these gradients might reduce to mere substitution of the training samples in a
    closed-form formula when the hypothesis class $\mathcal{H}$ is simple, such as
    the linear class described in (2.4). However, computing gradients is a computationally
    expensive operation when dealing with more sophisticated models such as neural
    networks. In fact, in the particular case of neural networks, we need a specialized
    algorithm called *backpropagation* for computing gradients. To enhance the practicality
    of gradient descent, instead of computing the exact value of $\nabla \mathcal{L}(\theta)$
    on the whole training sample $S$, we only estimate the gradient value on a randomly
    chosen data point. The resulting algorithm is called *stochastic* gradient descent.
    We can also sample multiple data points, in which case the algorithm is called
    *mini-batch* gradient descent. We present and discuss the performance of these
    methods in the remainder of this section.


    **Remark 2.2** The above intuition of first-order Taylor polynomial approximation
    can be extended to obtain other higher-order update schemes. For example, a second-order
    Taylor polynomial approximation explains how to construct second-order optimization
    schemes, of which Newton’s method is a typical example. However, applying second-order
    schemes requires computing the Hessian of $\mathcal{L}$, which in general has
    computational complexity $O(d^2)$. This renders second-order methods impractical
    for training models that are commonly used these days, since they have a large
    number of trainable parameters.


    ![](img/86043981d34dd325adb0d4b75e402b8d_35_0.png)


    **Fig. 2.3** Schematic of an iteration of a gradient-descent method. At iteration
    $t$, the current model parameters are given by $\theta_t$. The algorithm queries
    the training sample $S$ to compute an estimate $g_t$ of the actual gradient of
    the loss function $\nabla \mathcal{L}(\theta_t)$. This gradient estimate is used
    to update the model parameters, specifically $\theta_{t+1} := \theta_t - \gamma_t
    g_t$. For more details on this procedure, see Algorithms 1, 2, and 3.


    ### 2.2.1 Gradient-Descent Methods


    We now list the three main algorithms we focus on: *gradient descent*, *stochastic
    gradient descent*, and *mini-batch gradient descent*. These are optimization methods
    where the model is updated iteratively using the gradient estimates computed using
    the training sample. Any iteration of a gradient-descent method can be summarized
    according to Fig. 2.3.


    **Gradient Descent**


    This is a prototypical optimization scheme that is seldom used in practical machine
    learning settings. The gradient-descent technique, detailed in Algorithm 1 below,
    is the direct application of the intuition presented above in (2.9).


    **Algorithm 1** Gradient descent (GD)


    Choose an initial model $\theta_1 \in \mathbb{R}^d$ for the model. The choice
    can be made at random or by using expert knowledge of the target model. In each
    iteration $t \ge 1$, given the current model $\theta_t$, update the vector to


    $$

    \theta_{t+1} := \theta_t - \gamma_t \nabla \mathcal{L}(\theta_t),

    $$


    where $\gamma_t$ is a positive real value referred to as the *learning rate* at
    iteration $t$.


    Although gradient descent is the method of choice for solving many optimization
    problems, it suffers from critical computational limitations and is not suitable
    for large-scale machine learning tasks. Indeed, recall that


    $$

    \nabla \mathcal{L}(\theta_t) := \frac{1}{m} \sum_{i=1}^{m} \nabla_{\theta} \ell\bigl(h_{\theta_t}(x_i),
    y_i\bigr).

    $$


    Computing the full gradient of $\mathcal{L}$, at each step $t$ of the algorithm,
    involves computing $m$ different gradients for the parameter $\boldsymbol{\theta}_t$.
    In modern machine learning, the training sample $\mathcal{S}$ is often very large
    and cannot be processed entirely at every step of the learning procedure. The
    most standard way to circumvent this limitation is through the celebrated stochastic
    gradient-descent (SGD) algorithm.


    **Stochastic Gradient Descent**


    The rationale of SGD is to reduce the cost of gradient computations by using only
    one element of the training sample at a time. As described in Algorithm 2, SGD
    minimizes the loss function $\mathcal{L}$ using *stochastic estimates* of the
    gradient $\nabla\mathcal{L}$.


    **Algorithm 2** Stochastic gradient descent (SGD)


    The initialization step is identical to GD. In each iteration $t \ge 1$, and given
    a current model $\boldsymbol{\theta}_t$, compute a stochastic estimate $\mathbf{g}_t$
    of the gradient $\nabla\mathcal{L}(\boldsymbol{\theta}_t)$. Specifically, $\mathbf{g}_t
    := \nabla_{\boldsymbol{\theta}} \ell\big(h_{\boldsymbol{\theta}_t}(\mathbf{x}),
    y\big)$, where $(\mathbf{x}, y)$ is drawn uniformly at random from the training
    sample $\mathcal{S}$. Upon computing $\mathbf{g}_t$, update the current model
    parameters $\boldsymbol{\theta}_t$ to $\boldsymbol{\theta}_{t+1} := \boldsymbol{\theta}_t
    - \gamma_t \mathbf{g}_t$, where $\gamma_t$ is the *learning rate* at iteration
    $t$.


    **Mini-batch Gradient Descent**


    Stochastic gradient estimation, while it enhances the practicality of the optimization
    algorithm, creates other issues due to concomitant *noise* in gradient computations.
    The algorithm can yield large numerical uncertainties when gradient noise is large,
    especially when the optimization problem being solved (i.e., the ERM problem in
    our case) is *ill-conditioned*. A natural way to reduce gradient noise is to sample
    multiple elements from $\mathcal{S}$ at a time, instead of just one. This is the
    driving principle behind the mini-batch gradient-descent (mini-batch GD) method,
    described in Algorithm 3.


    **Algorithm 3** Mini-batch gradient descent (mini-batch GD)


    The initialization step is identical to GD. In each iteration $t \ge 1$, given
    a current model $\boldsymbol{\theta}_t$, sample a batch of elements $S_t$ uniformly
    at random from $\mathcal{S}$ (without replacement), and compute an estimate $\mathbf{g}_t$
    of $\nabla\mathcal{L}(\boldsymbol{\theta}_t)$ as follows:


    $$

    \mathbf{g}_t := \frac{1}{|S_t|} \sum_{(\mathbf{x},y)\in S_t} \nabla_{\boldsymbol{\theta}}
    \ell\bigl(h_{\boldsymbol{\theta}_t}(\mathbf{x}), y\bigr). \tag{2.10}

    $$


    Then, update the model parameters similarly to SGD, i.e., obtain $\boldsymbol{\theta}_{t+1}
    := \boldsymbol{\theta}_t - \gamma_t \mathbf{g}_t$, where $\gamma_t$ is the *learning
    rate* at iteration $t$.


