    ## 鲁棒DMGD的进一步扩展


    与第3章一样，我们关注的是基于服务器的联邦算法，其中节点可以访问可信服务器。然而，在实践中，服务器（即使存在）也可能并不总是可信的，在这种情况下，节点必须实施（某些元素的）去中心化机器学习以确保鲁棒性。尽管如此，在基于服务器的框架中研究鲁棒性，是解决更复杂的对等网络框架中问题（节点没有可信服务器可用）的关键一步。一些工作，包括[14,
    15, 18, 35, 37, 38, 41]，考虑了对等架构中鲁棒DMGD的去中心化变体。尽管去中心化DMGD中鲁棒性的基本原理仍然是鲁棒聚合，但由于节点本地模型之间存在漂移，分析更加复杂，而当底层通信网络不完整时，这种漂移难以控制。


    最后，我们请感兴趣的读者参阅论文[12]，了解FederatedAveraging框架中的鲁棒性分析，在该框架中，服务器在每次迭代中仅采样部分节点参与更新过程，每个参与节点在执行多个本地更新步骤后才将其个体更新发送到服务器。然后，服务器通过对从节点接收到的本地更新进行鲁棒聚合来生成全局模型更新。


