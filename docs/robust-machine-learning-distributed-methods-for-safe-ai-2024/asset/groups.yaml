  mdcn: "\n\n机器学习：基础、方法与应用\n\nRachid Guerraoui  \nNirupam Gupta  \nRafael Pinot\n\n\
    ## 鲁棒机器学习\n\n面向安全AI的分布式方法\n\nSpringer\n\n## 机器学习：基础、方法与应用\n\n### 丛书编辑\n\n- 陈凯驰，香港理工大学计算系，中国香港\n\
    - 陶大成，悉尼科技大学，澳大利亚\n\n本丛书收录的著作聚焦于机器学习的理论基础、先进方法论及实际应用，最好能以严谨的数学方式处理机器学习中的当代课题，并在相关算法设计中给出具体示例、在真实应用中给出实践验证。目标读者包括计算机科学、计算机工程、电气工程、数据科学及相关领域的研究生和研究人员，他们需要一个方便的渠道来追踪机器学习在基础、方法与应用方面的进展。\n\
    \n涵盖的主题包括机器学习的所有领域，包括但不限于：\n\n- 决策树\n- 人工神经网络\n- 核学习\n- 贝叶斯学习\n- 集成方法\n- 降维与度量学习\n\
    - 强化学习\n- 元学习与学会学习\n- 模仿学习\n- 计算学习理论\n- 概率图模型\n- 迁移学习\n- 多视图与多任务学习\n- 图神经网络\n\
    - 生成对抗网络\n- 联邦学习\n\n本丛书包括专著、初级与高级教材以及最新成果集萃。此外，本丛书支持开放获取出版模式。\n\nRachid Guerraoui\
    \ • Nirupam Gupta • Rafael Pinot\n\n## 鲁棒机器学习\n\n面向安全AI的分布式方法\n\nRachid Guerraoui\
