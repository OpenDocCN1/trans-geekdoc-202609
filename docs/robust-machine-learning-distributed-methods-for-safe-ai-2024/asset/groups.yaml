    ## 大动量系数增加偏差


    为简化起见，假设我们有一个常数学习率 \(\gamma\) 和一个常数动量系数 \(\beta\)。那么，注意到引理 6.3 中分析的偏差的增长速率有效地由因子
    \((1+\gamma L)(1+4\gamma L)\beta^2\) 给出。为了使偏差稳定，即最终被有限值所界定，该因子需要小于或等于 1。具体而言，如果
    \(\beta^2\) 大于 \(\frac{1}{1+\gamma L}\)，则诚实节点的平均动量可以任意偏离其局部梯度的平均值，这可能会阻止学习算法收敛到平稳点。这一观察在没有对抗节点的情况下也成立。偏差
    \(\xi_t\) 相对于 \(\beta\) 的增长速率与聚合误差 \(\delta_t\) 的增长速率相反。虽然控制前者对算法的收敛很重要，但后者对对抗节点的鲁棒性至关重要。在下一节中，我们提出一个动量系数的候选值，该值有利于控制局部动量对偏差和聚合误差的相反影响。


