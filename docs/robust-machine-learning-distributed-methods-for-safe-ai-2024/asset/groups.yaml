    # Further Extensions of Robust DMGD


    Like in Chap. 3, we have focused on server-based federated algorithms wherein
    the nodes have access to a trusted server. In practice, however, the server (even
    if it exists) might not always be trustworthy, in which case the nodes must implement
    (some elements of) decentralized machine learning to ensure robustness. Nevertheless,
    studying robustness in the server-based framework constitutes a pivotal step toward
    addressing the problem in the more complex peer-to-peer framework wherein the
    nodes do not have at disposal a trusted server. A few works, including [14, 15,
    18, 35, 37, 38, 41], consider decentralized variants of Robust DMGD in peer-to-peer
    architecture. Although the underlying principle for robustness in decentralized
    DMGD is still robust aggregation, the analysis is more intricate due to the presence
    of drift between the nodes’ local models, which is difficult to control when the
    underlying communication network is non-complete.


    Lastly, we refer the interested reader to paper [12] for an analysis on robustness
    in the FederatedAveraging framework where in each iteration the server samples
    only some of the nodes to participate in the update procedure, and each participating
    node performs multiple local update steps before sending their individual updates
    to the server. The server then generates a global model update by taking a robust
    aggregation of the local updates received from the nodes.


