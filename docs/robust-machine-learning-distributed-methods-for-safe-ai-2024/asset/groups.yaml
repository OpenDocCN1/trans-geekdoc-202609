    with in order to perform a challenging task. A more reasonable alternative is
    to have a machine learn from its experience and to adapt. In fact, some form of
    learning was already at the heart of his universal machine, as we explain below.


    Before the universal Turing machine, invented in 1936, there were only specialized
    calculators wherein the algorithm was hardwired into the machine. For example,
    Pascal''s machine was specialized in performing additions, while Leibniz''s machine
    was specialized in multiplications. Although these machines could compute their
    respective operations faster than any human, their utility was limited to the
    operation they were hardwired for, i.e., addition or multiplication. There was
    no way for Pascal''s machine to learn multiplication, or for Leibniz''s machine
    to learn other operations. Whereas, although more slowly than Pascal''s and Leibniz''s
    machines, a human could learn the addition algorithm, then the multiplication
    algorithm (or any other one) eventually performs a wide range of operations. Humans
    in this sense are smarter than machines because of their ability to learn new
    algorithms.


    The very characteristic of a universal Turing machine that makes it smart is also
    its ability to learn new algorithms. Specifically, Turing hardwired into his machine
    a meta-algorithm that executes the inputs and outputs of algorithms provided to
    it as data. Data and algorithms essentially become the same thing. The addition
    and multiplication algorithms become inputs represented in the form of a table
    that can be executed by a Turing machine. It was conjectured that all the algorithms
    can be modeled in the form of a table that could be then executed by a Turing
    machine. Until now, no one has disproved this conjecture. Turing did not witness
    the impact of his universal machine, but many engineers continued his seminal
    work and perfected the development of his machine, until it became the modern
    computer.


    # **A Simple Yet Powerful Principle**


    Interestingly, Turing also anticipated automated forms of learning that goes beyond
    having humans write programs in the form of data (tables) that the machine could
    digest (learn) and then execute. In 1947, Turing gave a public lecture explicitly
    calling for "a machine that can learn from experience" with the "possibility of
    letting the machine alter its own instructions." In a report entitled "Intelligent
    Machinery," which he did not publish, Turing introduced many of the central concepts
    that today we call AI. Many of his ideas were later reinvented by others, such
    as the idea of training a network of artificial neurons to perform specific tasks.
    Essentially, Turing predicted that the learning process would not need human participation.
    Specifically, the data (representing an algorithm) would not be fed to a Turing
    machine by a human as a table (i.e., an executable program), rather the data could
    be absorbed by the machine through a learning program.


    The notion of a learning program is the driving principle behind modern-day machine
    learning. Essentially, machine learning schemes assume a generic model to solve
    the target task, typically based on a mathematical function, and it deduces patterns
    in the available data to make predictions on a priori unseen data. The initial
    model is said to be generic in the sense that it has unspecified parameters, e.g.,
    a function $a_1x + a_2$ where the parameters $a_1$ and $a_2$ are a priori unspecified.
