    ## 分桶的局限性


    回顾可知，NNM 能够提升聚合鲁棒性的关键在于它确定性地减小了到诚实平均值的平均距离，如（5.4）所示。然而，与 NNM 不同，分桶仅在期望意义上（关于随机置换）减小该距离，如定理
    5.2 所示。这意味着分桶可能提升聚合规则的鲁棒系数，但仅仅是随机意义上的。特别是，在学习过程中可能存在一些迭代，其中分桶并未减小到诚实平均值的距离。这些迭代为对抗节点破坏学习过程提供了机会。此外，由于分桶减少了输入到聚合函数的向量数量，它也降低了总体破缺点。实际上，在某些执行中，分桶可能将所有
    $f$ 个对抗输入分配到不同的桶中。在这种情况下，对抗节点可以任意控制 $f$ 个桶的平均值，即使得 $f$ 个桶的平均值具有对抗性，这实际上增大了输入到聚合函数的对抗向量比例。具体而言，由于桶的数量为
    $\lceil n/s\rceil$，在最坏情况下，分桶后对抗输入的比例为 $\frac{f}{\lceil n/s\rceil}$。这意味着，为确保 $\frac{f}{\lceil
