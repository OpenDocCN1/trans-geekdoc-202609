    \n学习过程在面对恶意实体的攻击时可以被任意操纵（如图4.1所示），这种事实非常令人担忧，因为恶意实体可以毒化节点的数据或完全控制该节点。\n\n![](img/86043981d34dd325adb0d4b75e402b8d_66_0.png)\n\
    \n**图4.1** 考虑一个由3个节点组成的基于服务器的系统架构。假设节点3是对抗的。如果服务器实现了第3章介绍的分布式小批量梯度下降（DMGD）算法，那么每次迭代它都会对收到的梯度进行平均来计算更新。在任意迭代\
