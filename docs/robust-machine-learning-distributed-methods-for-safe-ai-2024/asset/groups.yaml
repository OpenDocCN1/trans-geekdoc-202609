    10]和[1, 2]。还需要注意，出于教学原因，我们只介绍了简单的分布式梯度下降方法。然而，联邦机器学习是一种快速发展的通用新范式，可以提供许多其他解决方案，包括*局部更新*、*节点子采样*或*自适应方法*。我们建议感兴趣的读者参阅[5]以了解该领域的全面概述，包括开放问题和可能的未来进展。最后，我们选择不涵盖对等网络上的*去中心化梯度下降*方法的分析。虽然


