    为了演示和教学目的，我们在本章中做一些简化。因此，所提出的算法可能被认为是不切实际的。我们将在后续章节中重新审视这些简化。


    在第5章中，我们专注于在存在对抗性机器的情况下最小化训练误差。我们首先讨论了由于*梯度不相似性*而导致的鲁棒性的潜在局限，这是节点所持数据中*异质性*的一种产物。然后我们表明，许多鲁棒聚合规则，虽然能提供最优的崩溃点，但在梯度不相似性下会产生次优的训练误差。我们提出了*预聚合*技术，以规避这一缺点并实现最优性。


    在第6章中，我们关注鲁棒机器学习中的梯度复杂度。尽管鲁棒聚合规则与预聚合的组合能产生阶最优的训练误差，但由此产生的梯度复杂度可能比传统（非鲁棒）机器学习算法高出几个数量级。这可能会极大地阻碍这些鲁棒方案的使用。我们强调了*局部梯度动量*在调节梯度复杂度中的重要作用，从而使鲁棒机器学习更加实用。


    ## 1.4 章节注释


    在本章中，我们简要回顾了机器学习的演变：从人工智能的思想[16, 25, 26]到构建能够玩认知游戏的机器[2, 9, 12, 24]，再到在医疗保健中利用机器[6,
    10]。现代机器学习系统，如ChatGPT [3]，其能力来源于在海量数据上训练的大规模复杂模型。这些自动化系统正深刻地塑造着现代社会的进程，应用范围从医疗保健到军事[7,
    11, 15, 18, 20, 22]。不可否认，机器学习正在迅速改变信息技术领域，几乎触及我们生活的方方面面[14]。尽管这些变化总体上能显著提高生活质量，甚至可能帮助我们找到应对气候变化等新兴全球问题的方法[21]，但使用它们时必须非常谨慎。


    我们已经强调，经典的机器学习算法，尤其是那些为开发大规模模型而提出的算法，对现实世界场景中普遍存在的挑战不具备鲁棒性，特别是*数据污染*这一因素。研究表明，当训练数据被掺假或某些机器在训练过程中发生故障时，机器学习方案的有效性可能会受到严重损害[1,
    4, 5, 8, 13, 23, 27]。在面向公众的应用中使用此类*训练不佳*的模型可能会产生严重后果[17, 19]。保护机器学习系统免受数据污染和机器故障的影响，从而为*安全人工智能*铺平道路，是我们开发本书所介绍的*鲁棒机器学习*方法的主要动机。


