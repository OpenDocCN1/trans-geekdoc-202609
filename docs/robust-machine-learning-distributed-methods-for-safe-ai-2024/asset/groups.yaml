    ## 算法4 分布式小批量梯度下降（DMGD）


    服务器通过选择一个初始模型 $\mathbf{\theta}_1 \in \mathbb{R}^d$ 来启动整个流程。与小批量梯度下降方法类似，这个初始模型可以任意选取，也可以借助对所训练模型的某些专家知识来选定。在每一轮迭代
    $t \geq 1$ 中，服务器维护一个模型参数 $\mathbf{\theta}_t$，并将其广播到所有节点。该轮迭代的其余步骤如下：


    1. **本地阶段。** 每个节点 $i \in [n]$ 独立地从本地训练样本 $S_i$ 中随机（无放回地）抽取一组大小为 $b$ 的数据点，记为 $S_t^{(i)}$，并计算本地梯度估计


    $$\mathbf{g}_t^{(i)} := \frac{1}{b} \sum_{(\mathbf{x},y) \in S_t^{(i)}} \nabla_\theta
    \ell(h_{\theta_t}(\mathbf{x}), y).\tag{3.3}$$


    2. **全局阶段。** 每个节点 $i$ 将梯度估计 $\mathbf{g}_t^{(i)}$ 返回给服务器。服务器在收到所有节点的梯度后，计算它们的平均值


    $$\mathbf{g}_t := \frac{1}{n} \sum_{i=1}^n \mathbf{g}_t^{(i)},\tag{3.4}$$


    并按如下方式更新当前模型参数：


    $$\theta_{t+1} := \theta_t - \gamma_t \mathbf{g}_t,\tag{3.5}$$


    其中 $\gamma_t$ 是第 $t$ 轮迭代时的学习率。


    ## 分布式梯度下降与分布式随机梯度下降


    回顾第2章可知，GD和SGD是小批量梯度下降的两种特例，其梯度估计分别使用大小为 $m$ 和 $1$ 的数据批次计算。因此，在分布式环境中实现这些方法时，只需在算法4的本地阶段分别令
    $b = m$ 和 $b = 1$ 来修改梯度计算即可。在本书的其余部分，我们将给出 DMGD 的收敛性结果，并说明如何将这些结果推广到分布式梯度下降（DGD）和分布式随机梯度下降（DSGD）。这些结果都附有完整的证明。读者即使跳过证明也不会影响内容连贯性，但我们强烈建议阅读这些证明，以便深入理解相关主题。


    ## 3.2 分布式小批量梯度下降（DMGD）的收敛性


    本节中，我们给出分布式小批量梯度下降（DMGD）方法的收敛性分析。DMGD（以及相应的DGD和DSGD）的收敛速率汇总见表3.1（第3.3节）。我们首先对损失函数的平滑性以及梯度估计中的不确定性水平做出若干假设。这些假设在许多学习问题中已被证实成立。


    ### 3.2.1 假设与记号


    首先，如下所述，我们假设逐点损失函数 $\ell(h_{\pmb{\theta}}(\mathbf{x}),y)$ 对参数向量 $\pmb{\theta}$
    在任何数据点 $(\mathbf{x},y)$ 处都是 Lipschitz 光滑的。在下文中，$\nabla$ 默认表示关于 $\pmb{\theta}$
    的梯度。


    **假设 3.1（Lipschitz 光滑性）** 存在实数 $L > 0$，使得对于所有 $\pmb{\theta}, \pmb{\theta}'' \in
    \mathbb{R}^d$，下式成立：


    $$\left\| \nabla \ell(h_{\pmb{\theta}}(\mathbf{x}),y) - \nabla \ell(h_{\pmb{\theta}''}(\mathbf{x}),y)
    \right\| \leq L \left\| \pmb{\theta} - \pmb{\theta}'' \right\|.$$


    其次，如下所述，我们假设对于每个节点 $i$，逐点梯度（即 $\nabla \ell(h_{\pmb{\theta}}(\mathbf{x}),y)$，$(\mathbf{x},y)
    \in \mathcal{S}_i$）具有一致有界的协方差迹。回顾根据(3.1)中 $\mathcal{L}_i(\pmb{\theta})$ 的定义，对于所有
    $\pmb{\theta}$ 有 $\nabla \mathcal{L}_i(\pmb{\theta}) = \frac{1}{m} \sum_{(\mathbf{x},y)
    \in \mathcal{S}_i} \nabla \ell(h_{\pmb{\theta}}(\mathbf{x}),y)$。


    **假设 3.2（有界协方差迹）** 存在实数 $\sigma$，使得对于所有 $i \in [n]$ 和 $\pmb{\theta} \in \mathbb{R}^d$，下式成立：


    $$\frac{1}{m} \sum_{(\mathbf{x},y) \in \mathcal{S}_i} \left\| \nabla \ell(h_{\pmb{\theta}}(\mathbf{x}),y)
    - \nabla \mathcal{L}_i(\pmb{\theta}) \right\|^2 \leq \sigma^2.$$


    在这些假设下，我们考虑两类主要损失函数，并在下文中分析 DMGD 的收敛性：非凸损失函数（第3.2.2节）和强凸损失函数（第3.2.3节）。由于使用随机批次时更新过程的随机性，我们以期望的形式刻画
    DMGD 的收敛性。具体地，我们用 $\mathcal{P}_t$ 表示算法在执行到第 $t$ 轮迭代时的记录或历史。该历史定义如下：


    $$\mathcal{P}_t := \{\pmb{\theta}_1, \dots, \pmb{\theta}_t\}. \tag{3.6}$$


    我们用 $\mathbb{E}_t[\cdot]$ 表示条件期望 $\mathbb{E}[\cdot | \mathcal{P}_t]$。因此，当执行 $T$
    轮 DMGD 后，算法随机性上的期望（记为 $\mathbb{E}[\cdot]$）由各轮迭代上的嵌套条件期望定义，即 $\mathbb{E}[\cdot]
    = \mathbb{E}_1[\cdots \mathbb{E}_T[\cdot]]$。


    ### 3.2.2 非凸损失函数


    我们首先讨论损失函数可能非凸的情形，这在机器学习中可以说是相当常见的。如第2章所述，当全局平均损失函数 $\mathcal{L}(\pmb{\theta})$
