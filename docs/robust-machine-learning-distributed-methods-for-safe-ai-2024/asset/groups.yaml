    \n尽管最坏情况不一定是最常出现在软件或硬件错误中的情况，但在最坏情况下分析机器学习方案的正确性，突显了不幸事件可能对学习过程造成的灾难性影响。可以说，即使是梯度方向上的随机偏移也会对学习过程产生显著影响。已有文献记载，在某些情况下，即使是简单的*本地数据投毒*，例如随机翻转标签，也足以阻碍学习。有关迄今已考虑的各种对抗行为的列表，请参阅本章末尾的第4.5节中的注释。在本章中，我们提出了一般的鲁棒性方案，这些方案可证明地保护分布式梯度下降的有效性，抵御一小部分行为*任意恶劣*的对抗节点，包括数据投毒甚至模型投毒攻击。\n\
    \n提高分布式梯度下降方法鲁棒性的一个关键步骤是，用更复杂的聚合规则取代简单的平均规则，从而保护模型更新免受对抗节点可能发送的错误梯度的影响。在下一节中，我们提出分布式小批量梯度下降（DMGD）算法的一个自然扩展，它用所谓的*鲁棒聚合规则*取代全局阶段的平均操作。\n\
    \n**注4.1** 虽然本章（和第5章）随后介绍的鲁棒性技术是在*分布式*梯度下降的背景下分析的，但这些技术也与传统的*集中式*机器学习设置相关。特别是，我们可以用即将在第4.1.3节中介绍的鲁棒聚合取代经典的算术平均，来计算小批量梯度下降方法每次迭代中的梯度（见算法3）。这将防止机器学习算法因可能从不可靠来源收集的有毒训练样本而受到破坏。\n\
    \n### 4.1.2 使分布式梯度下降具有鲁棒性\n\n如上所述，为了赋予DMGD鲁棒性，很自然的方法是用一种*鲁棒聚合规则*取代全局阶段的平均操作，这种规则可以减少对抗节点可能发送的“错误梯度”的任何不利影响。然而，什么算作错误梯度是一个难以回答的问题，尤其是当*诚实*（即非对抗）的节点持有不同的训练样本时。关于对抗节点如何影响学习过程的分析推迟到第4.4节。\n\
    \nDMGD的鲁棒实现，即*鲁棒DMGD*，依赖于通过引入一个通用聚合函数 $F : (\\mathbb{R}^d)^n \\to \\mathbb{R}^d$\
    \ 来合并梯度，从而调整算法的全局阶段。注意，一般来说，我们聚合的向量数量不必固定为n；而是等于服务器在任意给定迭代中选择聚合的梯度数量。此外，由于索引可以任意分配给节点，聚合规则的输出通常不受输入向量\
