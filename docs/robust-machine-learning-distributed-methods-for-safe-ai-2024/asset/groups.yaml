    ## Appendix A


    ### General Lemmas


    This appendix presents some basic inequalities pertaining to Lipschitz smooth
    functions and functions that also satisfy the Polyak–Łojasiewicz (PL) inequality.
    These results are fairly standard in the optimization community and can be found
    in most optimization textbooks, e.g., see [2, 3].


    ### A.1 Lipschitz Smoothness Inequality


    **Lemma A.1** *Let $\mathcal{L} : \mathbb{R}^d \to \mathbb{R}$ be a loss function
    satisfying Assumption 3.1. For any $\boldsymbol{\theta}, \boldsymbol{\theta}''
    \in \mathbb{R}^d$, we have*


    $$

    \mathcal{L}(\boldsymbol{\theta}) \leq \mathcal{L}(\boldsymbol{\theta}'') + \langle
    \nabla \mathcal{L}(\boldsymbol{\theta}''), \boldsymbol{\theta} - \boldsymbol{\theta}''
    \rangle + \frac{L}{2} \|\boldsymbol{\theta} - \boldsymbol{\theta}''\|^2.

    $$


    **Proof** Let $\boldsymbol{\theta}, \boldsymbol{\theta}'' \in \mathbb{R}^d$. Recall
    that, by definition of the gradient $\nabla \mathcal{L}$,


    $$

    \mathcal{L}(\boldsymbol{\theta}) - \mathcal{L}(\boldsymbol{\theta}'') = \int_0^1
    \langle \nabla \mathcal{L}(\boldsymbol{\theta}'' + t(\boldsymbol{\theta} - \boldsymbol{\theta}'')),
    \boldsymbol{\theta} - \boldsymbol{\theta}'' \rangle \, dt .

    $$


    Using the above, we get


    $$

    \begin{aligned}

    &\mathcal{L}(\boldsymbol{\theta}) - \mathcal{L}(\boldsymbol{\theta}'') - \langle
    \nabla \mathcal{L}(\boldsymbol{\theta}''), \boldsymbol{\theta} - \boldsymbol{\theta}''
    \rangle \\

    &= \int_0^1 \langle \nabla \mathcal{L}(\boldsymbol{\theta}'' + t(\boldsymbol{\theta}
    - \boldsymbol{\theta}'')), \boldsymbol{\theta} - \boldsymbol{\theta}'' \rangle
    - \langle \nabla \mathcal{L}(\boldsymbol{\theta}''), \boldsymbol{\theta} - \boldsymbol{\theta}''
    \rangle \, dt \\

    &= \int_0^1 \langle \nabla \mathcal{L}(\boldsymbol{\theta}'' + t(\boldsymbol{\theta}
    - \boldsymbol{\theta}'')) - \nabla \mathcal{L}(\boldsymbol{\theta}''), \boldsymbol{\theta}
    - \boldsymbol{\theta}'' \rangle \, dt .

    \end{aligned}

    $$


    Dividing both sides by $(s + T)^2$, we obtain that


    $$

    U_{T+1} \leq \frac{(s + \frac{T}{2} - 1)^2}{(s + T)^2} U_{\frac{T}{2}} + \frac{2\alpha_2
    T}{\alpha_1^2 (s + T)^2} + \frac{\alpha_3}{\alpha_1} \left( \frac{T}{s + T} \right).

    $$


    Now substituting $s = s_o - \frac{T}{2}$, we get


    $$

    U_{T+1} \leq \frac{(s_o - 1)^2}{(s_o + \frac{T}{2})^2} U_{\frac{T}{2}} + \frac{2\alpha_2
    T}{\alpha_1^2 (s_o + \frac{T}{2})^2} + \frac{\alpha_3}{\alpha_1} \left( \frac{T}{s_o
    + \frac{T}{2}} \right).

    $$


    As $\frac{T}{2} \leq s_o + \frac{T}{2}$, from above we get


    $$

    U_{T+1} \leq \frac{4(s_o - 1)^2}{T^2} U_{\frac{T}{2}} + \frac{8\alpha_2}{\alpha_1^2
    T} + \frac{2\alpha_3}{\alpha_1}.

    $$


    Substituting $U_{\frac{T}{2}}$ in the above from (B.2), we obtain that


    $$

    U_{T+1} \leq 4(s_o - 1)^2 U_1 \frac{4 e^{-\alpha_1 \gamma_o \left( \frac{T}{2}
    - 2 \right)}}{T^2} + \frac{4(\alpha_2 \gamma_o + \alpha_3)(s_o - 1)^2}{\alpha_1
    T^2} + \frac{8\alpha_2}{\alpha_1^2 T} + \frac{2\alpha_3}{\alpha_1}.

    $$


    This concludes the proof.


    $$

    \square

    $$


    ## Appendix C


    ### Derivation of Robust Coefficients


    This appendix presents the derivations for the robustness coefficients of the
    robust aggregation rules presented in Chap. 4. But first, we present below a fundamental
    limitation on robustness of any aggregation rule with respect to the condition
    of $(q,\kappa)$-robust averaging expressed in Definition 4.3. These results are
    merely a rewriting of the constants computations that can be found in [1].


    ### C.1 Limitation on Robust Averaging


    Considering the scalar case, i.e., assuming $d = 1$, we obtain the following necessary
    condition (lower bound) for $(q,\kappa)$-robust averaging. This lower bound, denoted
    by $\kappa_o$, on the robustness coefficient in the lemma below is tight, i.e.,
    there exist aggregation rules (e.g., CWTM) that are indeed $(q,\kappa)$-robust
    for $\kappa \in O_\star(\kappa_o)$.


    **Lemma C.1** For any integer $q < n$, an aggregation rule $F : (\mathbb{R})^n
    \to \mathbb{R}$ is $(q,\kappa)$-robust averaging only if $q < \frac{n}{2}$ and
    $\kappa \geq \frac{q}{n-2q}$.


    **Proof** The necessity for $q < n/2$ is easy to show. Also, as $\kappa \geq 0$
    by definition of robust averaging, the assertion is trivially true when $q = 0$.
    Hereafter, we will assume that $q > 0$. We employ proof by contradiction. Let
    us assume that the following assertion holds true:


    **Assertion A:** For $0 < q < n$ and $\kappa < \frac{q}{n-2q}$, there exists an
    aggregation rule $F : (\mathbb{R})^n \to \mathbb{R}$ that is $(q,\kappa)$-robust
    averaging.


    ¹ We write $\phi(a) \in O_\star(\psi(a))$ if there exists a constant $c \in \mathbb{R}^{+}$
    such that $\phi(a) \leq c\psi(a)$ for all $a \in \mathbb{R}^{+}$.


    Consider $n$ real values $v_1,\ldots,v_n$ such that $v_1=\cdots=v_{n-q}=0$ and
    $v_{n-q+1}=\cdots=v_n=1$. Consider a set $S_0=\{1,\ldots,n-q\}$. Since $|S_0|=n-q$,
    by **Assertion A** and **Definition 4.3** of robust averaging, we have


    $$

    \left|F(v_1,\ldots,v_n)-\bar v_{S_0}\right|^2\leq \kappa\frac{1}{n-q}\sum_{i\in
    S_0}\left|v_i-\bar v_{S_0}\right|^2=0,

    $$


    where $\bar v_{S_0}:=\frac{1}{|S_0|}\sum_{i\in S_0}v_i=0$. Thus, $F(v_1,\ldots,v_n)=\bar
    v_{S_0}=0$. Next, we consider another set $S_1=\{q+1,\ldots,n\}$. As $\bar v_{S_1}=\frac{q}{n-q}$,
    we obtain that


    $$

    \left|F(v_1,\ldots,v_n)-\bar v_{S_1}\right|^2=\left|0-\bar v_{S_1}\right|^2=\left(\frac{q}{n-q}\right)^2.
    \tag{C.1}

    $$


    Recall that **Assertion A** implies that $F$ is $(q,\kappa)$-robust averaging
    with $\kappa<\frac{q}{n-2q}$. Thus, as $|S_1|=n-q$, by **Definition 4.3**, we
    have


    $$

    \left|F(v_1,\ldots,v_n)-\bar v_{S_1}\right|^2\leq \kappa\frac{1}{n-q}\sum_{i\in
    S_1}\left|v_i-\bar v_{S_1}\right|^2=\kappa\frac{q(n-2q)}{(n-q)^2}<\left(\frac{q}{n-q}\right)^2.

    $$


    As $q>0$, the above contradicts **(C.1)**. Hence, **Assertion A** is false, i.e.,
    we cannot have $\kappa<\frac{q}{n-2q}$ when $q>0$. This concludes the proof. $\square$


    In the following, we prove that the aggregation rules presented in Chap. 4 are
    robust averaging. In the process, we also derive upper bounds on their respective
    robustness coefficients.


    ### C.2 Coordinate-Wise Trimmed Mean


    We first observe that for a coordinate-wise aggregation rule $F$, if each coordinate
    of $F$ satisfies the criterion of robust averaging, then $F$ yields robust averaging.
    Specifically, we have the following lemma. Recall that for any vector $\mathbf{v}$
    we denote its $k$-th coordinate by $[\mathbf{v}]_k$.


    **Lemma C.2** Let $q<n/2$ and $\kappa\geq 0$. Suppose that aggregation $F:(\mathbb{R}^d)^n\to\mathbb{R}^d$
    is a coordinate-wise function, i.e., there exists $d$ real-valued functions $F_1,\ldots,F_d:\mathbb{R}^n\to\mathbb{R}$
    such that for all $\mathbf{v}_1,\ldots,\mathbf{v}_n\in\mathbb{R}^d$, $[F(\mathbf{v}_1,\ldots,\mathbf{v}_n)]_k=F_k([\mathbf{v}_1]_k,\ldots,[\mathbf{v}_n]_k)$.
    If for every $k\in[d]$, $F_k$ is $(q,\kappa)$-robust averaging, then $F$ is $(q,\kappa)$-robust
    averaging.

