    # Bayes Optimal Classifier


    Given a probability distribution $\mathcal{D}$, we can easily show that the optimal
    prediction function on $\mathcal{X} \times \mathcal{Y}$ is


    $C^{\text{opt}} : \mathbf{x} \mapsto \arg\max_{y \in \mathcal{Y}} \mathbb{P}_{(\mathbf{x},y)\sim\mathcal{D}}[y
    \mid \mathbf{x}] . \quad (2.2)$


    This function is called the *Bayes optimal classifier*. It is optimal in the sense
    that no other classifier $C : \mathcal{X} \to \mathcal{Y}$ has a smaller misclassification
    error on $\mathcal{D}$. While it is possible in theory to find an optimal classifier,
    a more realistic objective of a machine learning algorithm is to find an *approximately
    optimal classifier* with a misclassification error that is as close as possible
    to $C^{\text{opt}}$.


    A typical strategy to approximate the Bayes optimal classifier is as follows.
    First, we assign arbitrary indices to the label set $\mathcal{Y}$, i.e., fix an
    arbitrary bijection $\Lambda : \mathcal{Y} \to \{1,\dots,|\mathcal{Y}|\}$. This
    allows to have for each $y \in \mathcal{Y}$ a unique index $\Lambda(y) \in \{1,\dots,|\mathcal{Y}|\}$.
    Then, we define a set of functions $\mathcal{H} \subset \{h : \mathcal{X} \to
    \mathbb{R}^{|\mathcal{Y}|}\}$, where for each $h \in \mathcal{H}$ and $\mathbf{x}$,
    $h(\mathbf{x})$ is meant to approximate the probability measure $\mathbb{P}_{(\mathbf{x},y)\sim\mathcal{D}}[y
    \mid \mathbf{x}]$. This set is also known as the *hypothesis class*. In this context,
    the purpose of a machine learning algorithm is to find the hypothesis $h^* \in
    \mathcal{H}$ that best matches the conditional probability. Then, by analogy with
    (2.2), the end classifier is defined to be


    $C : \mathbf{x} \mapsto \Lambda^{-1}(z) , \quad \text{where} \quad z \in \arg\max_{k
    \in \{1,\dots,|\mathcal{Y}|\}} [h^*(\mathbf{x})]_k \quad (2.3)$


    and $[h^*(\mathbf{x})]_k$ is the $k$-th element of the vector $h^*(\mathbf{x})$


    If the hypothesis class $\mathcal{H}$ is sufficiently well-defined, then the classifier
    $C$ defined above will have a misclassification error close to that of the Bayes
    optimal classifier. We intentionally avoid explaining here what we mean by “well-defined,”
    as our main focus is on how to optimize over a given set $\mathcal{H}$, i.e.,
    how to find $h^*$. However, choosing the appropriate hypothesis class $\mathcal{H}$
    is non-trivial in general. See Remark 2.1 for more details.


    # Empirical Risk Minimization


    In practice, however, we do not know a priori the ground-truth distribution $\mathcal{D}$.
    We only have access to a training set $\mathcal{S}$ comprising a finite number,
    let us say $m$, of input–output pairs. Specifically, $\mathcal{S} := \{(\mathbf{x}_1,
    y_1), \dots, (\mathbf{x}_m, y_m)\}$, where for all $i \in [m]$, $(\mathbf{x}_i,
    y_i) \in \mathcal{X} \times \mathcal{Y}$. In the supervised-learning setting,
    it is assumed that these input–output pairs are drawn independently and identically
    according to the distribution $\mathcal{D}$. Then, given the hypothesis class
    $\mathcal{H}$, the learning algorithm produces a hypothesis $h^* \in \mathcal{H}$
    that minimizes the *empirical risk* measured on $\mathcal{S}$. This problem, a.k.a.
    *empirical risk minimization* (ERM), reduces to seeking a solution $h^*$ to the
    following optimization problem:'
