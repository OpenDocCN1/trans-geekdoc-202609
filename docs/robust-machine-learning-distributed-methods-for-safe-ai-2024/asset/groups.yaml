    ## 4.4 鲁棒DMGD的韧性


    在本节中，我们分析当聚合规则对应于上述方案之一时，鲁棒DMGD算法的韧性性质。我们首先分析鲁棒DMGD算法的一般收敛性，其中聚合规则 $F$ 满足 $(f,
    \kappa)$-鲁棒平均的性质。我们考虑两种情况，具体来说，即诚实节点的平均损失函数为强凸或非凸。


    ### 假设


    为了进行收敛性分析，我们对逐点损失函数的平滑性和局部梯度估计的协方差迹做出与假设3.1和假设3.2相同的假设。此外，我们通过节点所持数据的*梯度相异性*的界限来刻画数据之间的异质性。一般来说，如果不假设这样的界限，就不可能获得任何有意义的鲁棒性保证，如后文5.3.2节所示。


    **假设4.1（$\zeta$-梯度相异性）** 设 $H$ 是 $[n]$ 的一个子集，包含 $n-f$ 个诚实节点，即 $|H|=n-f$。那么，存在一个实数值
    $\zeta$，使得对于所有 $\theta\in\mathbb{R}^d$，以下成立：


    $$\frac{1}{n-f}\sum_{i\in H}\|\nabla\mathcal{L}_i(\theta)-\nabla\mathcal{L}_H(\theta)\|^2\leq\zeta.$$


    回顾 $\mathcal{L}_H(\theta):=\frac{1}{n-f}\sum_{i\in H}\mathcal{L}_i(\theta)$。


    在后续小节中，我们研究当聚合规则 $F$ 被假定为 $(f,\kappa)$-鲁棒时，鲁棒DMGD算法与经典DMGD算法（先前介绍过）之间的偏差。


    ### 注 4.6


    一般来说，假设4.1中给出的异质性条件相当严格。实际上，对于许多模型参数与数据点交叉耦合的机器学习问题（例如回归模型和神经网络），假设4.1不一定成立。然而，出于教学原因，我们在这种梯度相异性的概念下分析梯度下降方法的鲁棒性。它使我们能够获得关于学习算法在数据异质性下性能的有意义见解。


    ### 4.4.1 与传统DMGD的偏差


    在继续讨论强凸和非凸损失函数的具体情形之前，我们先对鲁棒DMGD算法与其原始版本（即算法4中给出的DMGD方法）之间的偏差做一个观察。回顾在鲁棒DMGD（即算法5）中，在每次迭代
    $t$ 时


    回顾对于任意诚实节点 $i \in H$，有 $\mathbb{E}_t\big[\mathbf{g}_t^{(i)}\big] = \nabla \mathcal{L}_i(\boldsymbol{\theta}_t)$。因此，由于
    $\boldsymbol{\theta}_t$ 是历史 $\mathcal{P}_t$ 的一部分，


    $$\mathbb{E}_t\Big[\big\langle \mathbf{g}_t^{(i)} - \nabla \mathcal{L}_i(\boldsymbol{\theta}_t),\;
    \nabla \mathcal{L}_i(\boldsymbol{\theta}_t) - \nabla \mathcal{L}_H(\boldsymbol{\theta}_t)
    \big\rangle\Big]$$


    $$= \Big\langle \mathbb{E}_t\big[ \mathbf{g}_t^{(i)} \big] - \nabla \mathcal{L}_i(\boldsymbol{\theta}_t),\;
    \nabla \mathcal{L}_i(\boldsymbol{\theta}_t) - \nabla \mathcal{L}_H(\boldsymbol{\theta}_t)
    \Big\rangle = 0.$$


    类似地，由于 $\mathbb{E}_t\big[ \mathbf{g}_t^{\mathrm{H}} \big] = \nabla \mathcal{L}_H(\boldsymbol{\theta}_t)$，我们有


    $$\mathbb{E}_t\Big[\big\langle \nabla \mathcal{L}_H(\boldsymbol{\theta}_t) - \mathbf{g}_t^{\mathrm{H}},\;
