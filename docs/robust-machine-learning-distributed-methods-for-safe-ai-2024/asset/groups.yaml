    $T$ 次迭代后获得的 $(f, \epsilon)$-驻点韧性性质，该性质对应于第 4.1.3 节中描述的特定聚合规则。回顾：对于非空集合 $S \subseteq
    [n]$，$\mathcal{L}_S$ 表示 $S$ 的平均损失函数，即


    $$\mathcal{L}_S(\theta) := \frac{1}{|S|} \sum_{i \in S} \mathcal{L}_i(\theta).$$


    我们令 $\mathcal{L}_S^* := \min_{\theta \in \mathbb{R}^d} \mathcal{L}_S(\theta)$。还要回顾，$\mathbb{E}[\cdot]$
    表示算法 5 在 $T$ 次迭代后对随机性的全期望，即 $\mathbb{E}[\cdot] = \mathbb{E}_1[\ldots\mathbb{E}_T[\cdot]]$。


