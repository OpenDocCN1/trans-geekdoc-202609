    # ### 2.1.1 Problem Statement


    Consider an input space $\mathcal{X}$ and a discrete (finite-sized) output space
    $\mathcal{Y}$ representing the set of possible labels for elements in $\mathcal{X}$.
    These spaces are assumed to be associated with a probability distribution $\mathcal{D}$
    defined over $\mathcal{X} \times \mathcal{Y}$. This means that an input–output
    pair $(x, y) \in \mathcal{X} \times \mathcal{Y}$ can be drawn as per distribution
    $\mathcal{D}$. A supervised classification problem consists in finding a function
    $C : \mathcal{X} \to \mathcal{Y}$, called a *classifier*, that reproduces $\mathcal{D}$
    as accurately as possible. Specifically, the goal of a supervised-learning algorithm
    is to produce a classifier $C : \mathcal{X} \to \mathcal{Y}$ that maps each input
    $x \in \mathcal{X}$ to its *most probable* output $y \in \mathcal{Y}$ as per the
    distribution $\mathcal{D}$. Figure 2.1 illustrates an example of such a classification
    problem in the context of images.


    To measure the quality of classifier $C$, we use the notion of *misclassification
    error*, defined to be the probability that $C$ does not predict the correct output
    for a random pair $(x, y) \sim \mathcal{D}$. Specifically, the misclassification
    error of $C$ is given by


    $$\mathbb{P}_{(x,y)\sim\mathcal{D}}[C(x) \ne y] = \mathbb{E}_{(x,y)\sim\mathcal{D}}[\mathbf{1}\{C(x)
    \ne y\}], \tag{2.1}$$


    where $\mathbf{1}\{\cdot\}$ is the indicator function. Consider the example in
    Fig. 2.1. In this example, suppose that a classifier $C$ labels all the images
    of elephants as chickens but labels the remainder of the images correctly. Then,
    assuming that an image is drawn uniformly at random from the four possible images,
    the misclassification error of $C$ equals 0.25. That is, $C$ would correctly classify
    an image in this case with an unconditional probability of 0.75.


    The consequences of a misclassification are interpreted differently according
    to the application we consider. On the one hand, a predictor that is correct with
    probability 95%, i.e., with misclassification error of 5%, can be considered as
    sufficiently accurate to classify animal images. On the other hand, the same misclassification
    error might be considered extremely unsafe in the context of a medical application,
    e.g., tumor identification from X-ray imaging, where even a single misclassification
    can have severe consequences.'
