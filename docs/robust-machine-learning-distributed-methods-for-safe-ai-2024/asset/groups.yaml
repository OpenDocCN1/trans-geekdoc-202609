    $$\mathbb{E}_t\left[\left\|\widehat{\mathbf{g}}_t\right\|^2\right] \le 2\mathbb{E}_t\left[\left\|\mathbf{g}_t^H\right\|^2\right]
    + 2\mathbb{E}_t\left[\left\|\boldsymbol{\delta}_t\right\|^2\right]. \tag{4.23}$$


    将 (4.22) 和 (4.23) 代入 (4.20)，我们得到


    $$\begin{aligned}\mathbb{E}_t\left[\mathcal{L}_H(\boldsymbol{\theta}_{t+1})\right]
    &\le \mathcal{L}_H(\boldsymbol{\theta}_t) - \gamma_t\left\|\nabla \mathcal{L}_H(\boldsymbol{\theta}_t)\right\|^2
    + L\gamma_t^2\mathbb{E}_t\left[\left\|\mathbf{g}_t^H\right\|^2\right] \\ &- \gamma_t\langle\nabla
    \mathcal{L}_H(\boldsymbol{\theta}_t), \mathbb{E}_t\left[\boldsymbol{\delta}_t\right]\rangle
    + L\gamma_t^2\mathbb{E}_t\left[\left\|\boldsymbol{\delta}_t\right\|^2\right].
    \end{aligned} \tag{4.24}$$


    **上界** $\mathbb{E}_t\left[\left\|\mathbf{g}_t^H\right\|^2\right]$。注意


    $$\mathbb{E}_t\left[\left\|\mathbf{g}_t^H\right\|^2\right] = \mathbb{E}_t\left[\left\|\mathbf{g}_t^H
    - \nabla \mathcal{L}_H(\boldsymbol{\theta}_t)\right\|^2\right] + \left\|\nabla
    \mathcal{L}_H(\boldsymbol{\theta}_t)\right\|^2.$$


    回顾上述引理 4.1 的证明，在假设 3.2 下，有 $\mathbb{E}_t\left[\left\|\mathbf{g}_t^H - \nabla \mathcal{L}_H(\boldsymbol{\theta}_t)\right\|^2\right]
    \le \frac{\sigma^2}{(n-f)b}$。因此，


    $$\mathbb{E}_t\left[\left\|\mathbf{g}_t^H\right\|^2\right] \le \frac{\sigma^2}{(n-f)b}
    + \left\|\nabla \mathcal{L}_H(\boldsymbol{\theta}_t)\right\|^2.$$


    将上式代入 (4.24)，我们得到


    $$\begin{aligned}\mathbb{E}_t\left[\mathcal{L}_H(\boldsymbol{\theta}_{t+1})\right]
    &\le \mathcal{L}_H(\boldsymbol{\theta}_t) - \gamma_t(1 - L\gamma_t)\left\|\nabla
    \mathcal{L}_H(\boldsymbol{\theta}_t)\right\|^2 + \gamma_t^2\frac{L\sigma^2}{(n-f)b}
    \\ &- \gamma_t\langle\nabla \mathcal{L}_H(\boldsymbol{\theta}_t), \mathbb{E}_t\left[\boldsymbol{\delta}_t\right]\rangle
    + L\gamma_t^2\mathbb{E}_t\left[\left\|\boldsymbol{\delta}_t\right\|^2\right].
    \end{aligned} \tag{4.25}$$


    **下界** $\langle\nabla \mathcal{L}_H(\boldsymbol{\theta}_t), \mathbb{E}_t\left[\boldsymbol{\delta}_t\right]\rangle$。根据柯西-施瓦茨不等式，以及对于实数
    $a_1, a_2$，有 $2a_1a_2 \le a_1^2 + a_2^2$，我们得到


    $$\langle \nabla \mathcal{L}_H(\theta_t),\mathbb{E}_t[\delta_t]\rangle \ge -\|\nabla
    \mathcal{L}_H(\theta_t)\|\,\|\mathbb{E}_t[\delta_t]\|$$

    $$\ge -\frac{\|\nabla \mathcal{L}_H(\theta_t)\|^2+\|\mathbb{E}_t[\delta_t]\|^2}{2}.$$


    将上式代入 (4.25)，我们得到


    $$\mathbb{E}_t[\mathcal{L}_H(\theta_{t+1})]\le \mathcal{L}_H(\theta_t)-\gamma_t\left(\frac{1}{2}-L\gamma_t\right)\|\nabla
    \mathcal{L}_H(\theta_t)\|^2+\gamma_t^2\frac{L\sigma^2}{(n-f)b}$$

    $$\qquad +\frac{\gamma_t}{2}\|\mathbb{E}_t[\delta_t]\|^2+L\gamma_t^2\mathbb{E}_t\left[\|\delta_t\|^2\right].$$


    注意，根据三角不等式，有 $\|\mathbb{E}_t[\delta_t]\|\le \mathbb{E}_t[\|\delta_t\|]$。将其与詹森不等式结合，我们得到
    $\|\mathbb{E}_t[\delta_t]\|^2\le \mathbb{E}_t[\|\delta_t\|^2]$。将之代入上式，我们得到


    $$\mathbb{E}_t[\mathcal{L}_H(\theta_{t+1})]\le \mathcal{L}_H(\theta_t)-\gamma_t\left(\frac{1}{2}-L\gamma_t\right)\|\nabla
    \mathcal{L}_H(\theta_t)\|^2+\gamma_t^2\frac{L\sigma^2}{(n-f)b}$$

    $$\qquad +\gamma_t\left(\frac{1}{2}+L\gamma_t\right)\mathbb{E}_t\left[\|\delta_t\|^2\right].
