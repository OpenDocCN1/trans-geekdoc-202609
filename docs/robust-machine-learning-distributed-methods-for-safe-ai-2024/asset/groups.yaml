    \n### 鲁棒机器学习基础\n\n![](img/86043981d34dd325adb0d4b75e402b8d_65_0.png)\n\n**摘要**\
    \ 如前一章所述，分布式学习过程显著简化了在大量数据上训练复杂模型的任务。每个节点的工作量基本上由网络的总规模划分，同时节点保留对其本地数据的控制。然而，联邦机器学习的好处依赖于一个不现实的假设：每个节点都*正确*执行规定的算法，并且其所有数据都是可信的。在实践中，这个假设不一定成立。在本章中，我们重新审视当某些参与节点*偏离*其规定指令集时的联邦机器学习问题。正如本书引言中所讨论的，这种偏离可能由不良数据、软件错误、硬件故障，甚至控制某些节点的恶意攻击者造成。在存在此类*对抗*节点的情况下，传统的分布式学习方法无法保证良好的准确性。我们将在本章解释如何使传统的基于服务器的梯度下降方法对*少数*对抗节点具有鲁棒性，并分析由此产生的*鲁棒梯度下降*算法的*训练误差*。\n\
    \n### 4.1 鲁棒性入门\n\n由于存在多个独立运行的节点，联邦机器学习容易出现行为异常的节点。用分布式计算的行话说，行为任意且异常的节点（以下称为*对抗*节点）通常被称为*拜占庭式*节点。我们目前介绍的分布式梯度下降方法对对抗节点不具有鲁棒性。事实上，单个对抗节点就可以通过向服务器发送错误的局部梯度（或更新）来显著损害学习过程的有效性。\n\
    \n### 4.1.1 分布式梯度下降的脆弱性\n\n分布式梯度下降方法的主要脆弱点在于全局阶段服务器的*平均操作*（见算法4）。基本上，如果节点 $i \\\
