    - \gamma \left(1 - \frac{L}{2}\gamma\right) \|\nabla \mathcal{L}(\boldsymbol{\theta}_t)\|^2.$$


    在假设3.3下，$\|\nabla \mathcal{L}(\boldsymbol{\theta}_t)\|^2 \geq 2\mu\left(\mathcal{L}(\boldsymbol{\theta}_t)
    - \mathcal{L}^*\right)$。将上述结果用于上式，并注意到 $1 - \frac{L}{2}\gamma \geq \frac{1}{2}$，得到


    $$\mathcal{L}(\boldsymbol{\theta}_{t+1}) \leq \mathcal{L}(\boldsymbol{\theta}_t)
    - \gamma \mu \left(\mathcal{L}(\boldsymbol{\theta}_t) - \mathcal{L}^*\right).$$


    在上述不等式两边同时减去 $\mathcal{L}^*$，我们得到


    $$\mathcal{L}(\boldsymbol{\theta}_{t+1}) - \mathcal{L}^* \leq (1 - \mu\gamma)
    \left(\mathcal{L}(\boldsymbol{\theta}_t) - \mathcal{L}^*\right).$$


    回顾一下，当假设3.1和3.3同时成立时，$\mu \leq L$。这意味着，由于 $\gamma \leq \frac{1}{L}$，有 $1 - \mu\gamma
    \geq 1 - \frac{\mu}{L} \geq 0$。因此，从 $t = T$ 到 $t = 1$ 递归应用上述不等式，我们得到


    $$\mathcal{L}(\boldsymbol{\theta}_{\mathbf{T}+1}) - \mathcal{L}^* \leq (1 - \mu\gamma)^T
    \left(\mathcal{L}(\boldsymbol{\theta}_1) - \mathcal{L}^*\right).$$


    由于 $(1 - \mu\gamma)^T \leq e^{-\mu\gamma T}$，上述结果意味着


    $$\mathcal{L}(\boldsymbol{\theta}_{\mathbf{T}+1}) - \mathcal{L}^* \leq e^{-\mu\gamma
    T} \left(\mathcal{L}(\boldsymbol{\theta}_1) - \mathcal{L}^*\right).$$


    上述内容完成了证明。


    ### 注释3.4

    对于给定的 $T$，为使上界因子 $e^{-\mu\gamma T}$ 达到可能的最小值，我们必须使 $\gamma$ 尽可能大，即 $\gamma = \frac{1}{L}$。由此得到的收敛速率由
    $\exp\left(-\frac{T}{\mathcal{K}_L}\right)$ 给出，其中回顾 $\mathcal{K}_L := \frac{L}{\mu}$
    是损失函数 $\mathcal{L}$ 的条件数。正如预期，我们观察到条件数越小，梯度下降法收敛到最小值越快，反之亦然。


    注意，与DSGD和DMGD不同，DGD的收敛速率与其集中式对应方法相同，即使用多个节点时我们没有加速。这是因为在DGD的每一步中，每个节点都计算其局部损失函数的全梯度并发送给服务器。因此，我们无法获得(3.13)中那样的“方差缩减”性质。然而，与集中式GD相比，DGD仍然减少了每个节点的计算负担。具体而言，每一步中，每个节点本地只需计算
    \(m\) 个逐点梯度，而不是 \(m n\)（如果数据点收集在单台机器上）。因此，每个节点的计算成本确实被除以了 \(n\)。


    ### 3.3 本章注释

    本章我们介绍了（基于服务器的）联邦机器学习框架，并引入了以联邦方式进行学习的主要方法，即分布式梯度下降方法。具体来说，我们通过详细分析非凸和强凸损失函数的情形，解释了小批量分布式梯度下降的基本原理。我们在两种情形下都推导了训练误差，并给出了为进一步分析梯度下降方法奠定基础的数学工具。本章给出的大多数证明都是标准的，本质上可以视为文献[13]中结果的简化版本。此外，我们在强凸性下使用计划学习率的收敛分析受到了文献[7,
    15]中结果的启发。我们在本章讨论的不同方法的训练误差总结在表3.1中。


