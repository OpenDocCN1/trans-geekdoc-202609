    # ### 2.2.1 Gradient-Descent Methods


    We now list the three main algorithms we focus on: *gradient descent*, *stochastic
    gradient descent*, and *mini-batch gradient descent*. These are optimization methods
    where the model is updated iteratively using the gradient estimates computed using
    the training sample. Any iteration of a gradient-descent method can be summarized
    according to Fig. 2.3.


    # **Gradient Descent**


    This is a prototypical optimization scheme that is seldom used in practical machine
    learning settings. The gradient-descent technique, detailed in Algorithm 1 below,
    is the direct application of the intuition presented above in (2.9).


    ```

    **Algorithm 1** Gradient descent (GD)


    Choose an initial model $\theta_1 \in \mathbb{R}^d$ for the model. The choice
    can be made at random or by using expert knowledge of the target model. In each
    iteration $t \ge 1$, given the current model $\theta_t$, update the vector to


    $$\theta_{t+1} := \theta_t - \gamma_t \nabla \mathcal{L}(\theta_t),$$


    where $\gamma_t$ is a positive real value referred to as the *learning rate* at
    iteration $t$.

    ```


    Although gradient descent is the method of choice for solving many optimization
    problems, it suffers from critical computational limitations and is not suitable
    for large-scale machine learning tasks. Indeed, recall that


    $$\nabla \mathcal{L}(\theta_t) := \frac{1}{m} \sum_{i=1}^{m} \nabla_{\theta} \ell\bigl(h_{\theta_t}(x_i),
