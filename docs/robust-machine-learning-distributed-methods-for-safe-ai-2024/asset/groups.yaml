    # 5.1.2 Robustness Amplification


    In this section, we analyze the robustness amplification property of NNM. We show
    that the composition of NNM with an $(f, \kappa)$-robust rule $F$ results in a
    new aggregation rule $F'' := F \circ \text{NNM}$ that has an improved robustness
    coefficient compared to $F$. The analysis proceeds in two steps. First, we obtain
    a generic result, in Lemma 5.1, that relates the empirical variance of the vectors
    NNM outputs to the variance of the input vectors. Then, we build upon this result,
    in Theorem 5.1, to precisely characterize the robustness amplification property
    of NNM.'
