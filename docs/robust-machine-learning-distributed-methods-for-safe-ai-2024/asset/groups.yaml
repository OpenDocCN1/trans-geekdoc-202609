    \leq \frac{4\left(\mathbb{E}\left[\mathcal{L}_H(\boldsymbol{\theta}_1) - \mathcal{L}_H(\boldsymbol{\theta}_{T+1})\right]\right)}{\gamma
    T} + \frac{4L\sigma^2}{(n-f)b}\gamma + 3\left(4\kappa\frac{\sigma^2}{b} + \kappa\zeta\right).$$


    As $\mathcal{L}_H(\boldsymbol{\theta}_1) - \mathcal{L}_H(\boldsymbol{\theta}_{T+1})
    \leq \mathcal{L}_H(\boldsymbol{\theta}_1) - \mathcal{L}_H^*$, $^b$ and the initial
    model $\boldsymbol{\theta}_1$ is given to us, we have $\mathbb{E}\left[\mathcal{L}_H(\boldsymbol{\theta}_1)
    - \mathcal{L}_H(\boldsymbol{\theta}_{T+1})\right] \leq \mathbb{E}\left[\mathcal{L}_H(\boldsymbol{\theta}_1)
    - \mathcal{L}_H^*\right] = \mathcal{L}_H(\boldsymbol{\theta}_1) - \mathcal{L}_H^*$.
    This concludes the proof.


    $\square$


    $^a$We can reason the same using the Jensen’s inequality on the square function
    $(\cdot)^2$.

    $^b$Refer to the proof of Theorem 3.1 for the reasoning.


    ## Stationary Resilience Property


    Upon selecting an appropriate value for the learning rate $\gamma$ in Theorem
    4.1, we obtain the following corollary, which consequently enables us to characterize
    the stationary resilience property of Robust DMGD.


    **Corollary 4.1** *Suppose Assumptions 3.1, 3.2 and 4.1. Consider T iterations
    of the Robust DMGD algorithm with batch-size $b \in [1, m)$ and an $(f, \kappa)$-robust
    averaging rule F. Let H be an arbitrary set of $n - f$ honest nodes and $\Delta_H$
    be a real value such that $\mathcal{L}_H(\boldsymbol{\theta}_1) - \mathcal{L}_H^*
    \leq \Delta_H$. If*


    $$\gamma_t = \gamma = \min\left\{\frac{1}{4L}, \sqrt{\frac{(n-f)b\Delta_H}{\sigma^2LT}}\right\},
    \forall t \in [T],$$


    then, provided that $T \ge \frac{16(n-f)bL\Delta_H}{\sigma^2}$, the following
    holds true:


    $$\frac{1}{T}\sum_{t=1}^{T}\mathbb{E}\left[\|\nabla \mathcal{L}_H(\theta_t)\|^2\right]
    \le 8\sqrt{\frac{L\sigma^2\Delta_H}{(n-f)bT}}+3\kappa\left(\frac{4\sigma^2}{b}+\zeta\right).$$


    **Proof** Note that all the conditions stated in Theorem 4.1 hold true. Therefore,
    from Theorem 4.1, we obtain that


    $$\frac{1}{T}\sum_{t=1}^{T}\mathbb{E}\left[\|\nabla \mathcal{L}_H(\theta_t)\|^2\right]
    \le \frac{4(\mathcal{L}_H(\theta_1)-\mathcal{L}_H^*)}{\gamma T}+\frac{4L\sigma^2}{(n-f)b}\gamma+3\kappa\left(\frac{4\sigma^2}{b}+\zeta\right).$$


    As $\mathcal{L}_H(\theta_1)-\mathcal{L}_H^*\le \Delta_H$ in the above, we have


    $$\frac{1}{T}\sum_{t=1}^{T}\mathbb{E}\left[\|\nabla \mathcal{L}_H(\theta_t)\|^2\right]
    \le \frac{4\Delta_H}{\gamma T}+\frac{4L\sigma^2}{(n-f)b}\gamma+3\kappa\left(\frac{4\sigma^2}{b}+\zeta\right).$$


    (4.29)


    As it is assumed that $T \ge \frac{16(n-f)bL\Delta_H}{\sigma^2}$, by the definition
    of $\gamma$ in (4.28), we have


    $$\gamma=\sqrt{\frac{(n-f)b\Delta_H}{\sigma^2LT}}.$$


    Substituting from the above in (4.29) concludes the proof. $\square$


    The corollary implies that if the server samples a model randomly from the set
    of all models generated during the execution of Robust DMGD, then (in expectation)
    the model approximates a stationary point of $\mathcal{L}_H$ with a bounded error,
    despite the presence of up to $f$ adversarial nodes. Specifically, under the conditions
    stated in Corollary 4.1 and upon executing $T$ iterations of the Robust DMGD algorithm,
    if the server outputs $\tilde{\theta}$ chosen uniformly from the set of intermediate
    models $\{\theta_1,\ldots,\theta_T\}$, then we achieve $(f,\epsilon)$-stationary
    resilience (as per Definition 4.2) where


    $$\varepsilon \lesssim 8\sqrt{\frac{L\sigma^2\Delta_H}{(n-f)bT}}+3\kappa\left(\frac{4\sigma^2}{b}+\zeta\right)\in
    O_T\left(\sqrt{\frac{\sigma^2}{(n-f)bT}+\kappa\frac{\sigma^2}{b}+\kappa\zeta}\right).
    \tag{4.30}$$


    The order of the training error shown in (4.30) is composed of three main terms.
    The first term, $O_T\left(\sqrt{\frac{\sigma^2}{(n-f)bT}}\right)$, is the vanishing
    error rate that corresponds to that of the original DMGD algorithm running on
    at least $n-f$ honest nodes (cf. Corollary 3.1). This particular term approaches
    zero, as we increase the total number of iterations $T$ of the algorithm; hence,
    it is not a dominant factor in the final training error of the algorithm. The
    second and third terms, $O_T\left(\kappa\frac{\sigma^2}{b}\right)$ and $O_T(\kappa\zeta)$,
    are non-vanishing errors introduced (in the worst case) by the presence of adversarial
    nodes. Note that, contrary to the original DMGD algorithm, in the presence of
    adversarial nodes, the local gradient noise (measured by $\sigma$) can lead to
    an incompressible error, apparently implying that the learning procedure might
    yield bad model accuracy (or incur a high training error). As shown later in Chap.
    6, this augmentation of the error due to local gradient estimation noise can be
    diminished by embedding *gradient momentum* in the model updates at nodes’ level.
    However, the error due to gradient dissimilarity (measured by $\zeta$) is something
    that cannot be eliminated in general. We defer the formal discussion on the limitations
    of robustness due to gradient dissimilarity to Sect. 5.3 in Chap. 5.


    We summarize, in Table 4.2, the stationary resilience property of the Robust DMGD
    algorithm when the aggregation rule $F$ is one of those described in Sect. 4.1.3.
    Recall that each of these aggregation rules is shown to be an $(f,\kappa)$-robust
    averaging in Sect. 4.3.2 when we set parameter $q=f$, where $f<\frac{n}{2}$. Thus,
    the breakdown point of the Robust DMGD method equipped with any of these aggregation
    rules can be tuned to be as high as $\frac{1}{2}$. The order of the training error
    $\varepsilon$, shown in Table 4.2, is obtained by recalling that $\kappa \in \mathcal{O}_n(1)$
    for CWMed, GeoMed and Multi-Krum$_{f,1}$, and $\kappa \in \mathcal{O}_n\left(\frac{f}{n}\right)$
    for CWTM$_f$. For CWTM$_f$, we set $\frac{f}{n} < \frac{1}{2}\left(\frac{c}{1+c}\right)$,
    where $c$ is a positive real-valued constant (see Sect. 4.3.2). We remark that
    though the non-vanishing error terms grow linearly in $\frac{f}{n}$ for CWTM$_f$,
    the same need not be true for the other three aggregation rules. This phenomenon
    can be explained by the fact that CWMed, GeoMed, and Multi-Krum$_{q_1,q_2}$ are
    *median-based* aggregation rules and hence do not benefit from the expected strength
    of the honest nodes in the system. Another property of median-based rules is that
    their breakdown point is always $\frac{1}{2}$, regardless of the robustness parameter
    $f$ (i.e., the maximum number of adversarial nodes the system is designed to tolerate),
    whereas CWTM involves an averaging operation that helps it improve the accuracy
    when the system is expected to have a larger number of honest nodes. Specifically,
    we can trade the breakdown point of the Robust DMGD algorithm, when using CWTM
    as the aggregation rule, for better training error. More on this discussed shortly
    below. A similar property can also be imparted to the median-based aggregation
    rules through the use of a pre-aggregation scheme, introduced and analyzed later
    in Chap. 5.


    **Table 4.2** The $(f,\varepsilon)$-stationary resilience property of Robust DMGD
    with the listed aggregation rules, obtained upon completion of $T$ iterations
    in the general non-convex case under the conditions stated in Corollary 4.1. For
    all aggregation rules, except CWTM$_f$, we assume that $\frac{f}{n}<\frac{1}{2}$.
    For CWTM$_f$, as per the discussion in Sect. 4.3.2, we assume that $\frac{f}{n}\leq\frac{c}{2(1+c)}$,
    where $c$ is a positive real-valued constant.


    | Aggregation rule | Breakdown point | Training error $\varepsilon$ |

    |---|---:|---|

    | CWMed | $\frac{1}{2}$ | $O_{n,T}\left(\sqrt{\frac{\sigma^2}{(n-f)bT}+\frac{\sigma^2}{b}+\zeta}\right)$
    |

    | GeoMed | $\frac{1}{2}$ | $O_{n,T}\left(\sqrt{\frac{\sigma^2}{(n-f)bT}+\frac{\sigma^2}{b}+\zeta}\right)$
    |

    | CWTM$_f$ | $\frac{f+1}{n}$ | $O_{n,T}\left(\sqrt{\frac{\sigma^2}{(n-f)bT}+\frac{f}{n}\frac{\sigma^2}{b}+\frac{f}{n}\zeta}\right)$
    |

    | Multi-Krum$_{f,1}$ | $\frac{f+1}{n}$ | $O_{n,T}\left(\sqrt{\frac{\sigma^2}{(n-f)bT}+\frac{\sigma^2}{b}+\zeta}\right)$
    |


    ## Applying the Analysis to Robust DSGD and Robust DGD


    The robustness analysis presented above applies immediately to robust DSGD (i.e.,
    Algorithm 5 with batch-size $b=1$) by simply substituting $b=1$ in Theorem 4.1
    and Corollary 4.1. In the case of robust DGD, i.e., DGD with robust aggregation
    in the global phase, we do not have gradient noise. Upon substituting $\sigma
    = 0$, and $\gamma$ to be any constant less than $\frac{1}{4L}$, in Theorem 4.1,
    we deduce that robust DGD is $(f, \varepsilon)$-stationary resilient with $\varepsilon
    \in \mathcal{O}_T\left(\frac{1}{T} + \kappa\zeta\right)$, where $\kappa \in \mathcal{O}_n(1)$
    when using CWMed, GeoMed, or Krum as the aggregation rule and $\kappa \in \mathcal{O}_n\left(\frac{f}{n}\right)$
    when using CWTM$_f$ as the aggregation rule. Expectedly, in contrast to Robust
    DMGD, when implementing robust DGD, the gradient computation noise does not contribute
    to the incompressible training error. However, the cost of computing an actual
    gradient on the whole training sample is quite prohibitive in practice. An efficient
    alternative to robust DGD, for diminishing the impact of noise on training error,
    is to incorporate gradient momentum in Robust DMGD. This scheme is presented later
    in Chap. 6.


