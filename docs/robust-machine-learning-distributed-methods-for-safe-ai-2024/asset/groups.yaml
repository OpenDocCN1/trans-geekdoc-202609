    ## C.5 Coordinate-Wise Median


    For input vectors $\mathbf{v}_1, \dots, \mathbf{v}_n$, their coordinate-wise median,
    denoted by CWMed, is defined to be a vector whose $k$-th coordinate, for all $k
    \in [d]$, is defined to be


    $[\text{CWMed}(\mathbf{v}_1, \dots, \mathbf{v}_n)]_k := \text{Median}([\mathbf{v}_1]_k,
    \dots [\mathbf{v}_n]_k). \quad (\text{C.12})$


    **Proposition C.4** Let $n \in \mathbb{N}^*$ and $q < \frac{n}{2}$. Coordinate-wise
    median is $(q, \kappa)$-robust with $\kappa = 4\left(1 + \frac{q}{n - 2q}\right)^2$.


    **Proof** Given that the geometric median coincides for one-dimensional inputs
    with their median, it follows from Proposition C.3 that, for one-dimensional inputs,
    median is $(q, \kappa)$-robust with $\kappa = 4\left(1 + \frac{q}{n - 2q}\right)^2$.
    Since CWMed applies the median operation independently for each coordinate, the
    proof concludes upon invoking Lemma C.2.


