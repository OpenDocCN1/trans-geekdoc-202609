    ### 非线性分类任务的一般情形


    现在我们回到更一般的情形，回到我们标准的多标签分类问题，其中 $|\mathcal{Y}| \geq 2$，$h$ 被定义为从 $\mathcal{X}$
    到 $\mathbb{R}^{|\mathcal{Y}|}$ 的映射。在这种特殊情况下，线性分类器通常过于简单，无法正确捕获真实分布 $\mathcal{D}$。一般来说，即使不涉及图像分类，我们可能也需要非线性假设类来正确地对一组点进行分类，如图
    2.2（右）所示。在当代机器学习中，最流行的假设类之一就是被称为*神经网络*的非线性模型类。典型的神经网络产生的假设是 $N$ 个非线性参数函数 $h_{\boldsymbol{\vartheta}_1}^{(1)},
