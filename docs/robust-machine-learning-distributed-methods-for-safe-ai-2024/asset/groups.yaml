    \n© 编辑（如适用）与作者，依据Springer Nature Singapore Pte Ltd.独家许可，2024年\n\n本作品受版权保护。所有权利均由出版方独家许可，无论涉及材料的全部或部分，具体包括翻译权、重印权、插图复用权、朗诵权、广播权、缩微胶片复制权或任何其他物理方式复制权，以及信息存储与检索、电子改编、计算机软件或目前已知或今后开发的类似或不类似方法的传输权。\n\
