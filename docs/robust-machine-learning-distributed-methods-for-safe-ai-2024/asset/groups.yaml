    # 3.2.1 Assumptions and Notation


    First, as stated below, we assume that the point-wise loss function $\ell(h_{\pmb{\theta}}(\mathbf{x}),y)$
    is Lipschitz smooth with respect to the vector $\pmb{\theta}$ at any data point
    $(\mathbf{x},y)$. In the following, $\nabla$ by default denotes the gradient with
    respect to $\pmb{\theta}$.


    **Assumption 3.1 (Lipschitz Smoothness)** There exists a real value $L > 0$ such
