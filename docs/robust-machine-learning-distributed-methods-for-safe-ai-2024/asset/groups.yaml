    \mathcal{X} \times \mathcal{Y}$ 可以根据分布 $\mathcal{D}$ 抽取。一个监督分类问题在于寻找一个函数 $C :
    \mathcal{X} \to \mathcal{Y}$，称为 *分类器*，尽可能准确地重现 $\mathcal{D}$。具体而言，监督学习算法的目标是产生一个分类器
    $C : \mathcal{X} \to \mathcal{Y}$，它将每个输入 $x \in \mathcal{X}$ 映射到根据分布 $\mathcal{D}$
    的 *最可能* 输出 $y \in \mathcal{Y}$。图 2.1 在图像的背景下举例说明了此类分类问题。


    为了衡量分类器 $C$ 的质量，我们使用 *误分类错误* 的概念，定义为 $C$ 对随机对 $(x, y) \sim \mathcal{D}$ 未能预测正确输出的概率。具体而言，$C$
    的误分类错误由下式给出


    $$\mathbb{P}_{(x,y)\sim\mathcal{D}}[C(x) \ne y] = \mathbb{E}_{(x,y)\sim\mathcal{D}}[\mathbf{1}\{C(x)
    \ne y\}], \tag{2.1}$$


    其中 $\mathbf{1}\{\cdot\}$ 是指示函数。考虑图 2.1 中的例子。在此例中，假设分类器 $C$ 将所有大象的图像标记为鸡，但其余图像标记正确。然后，假设图像是从四个可能的图像中均匀随机抽取的，$C$
    的误分类错误等于 0.25。也就是说，在这种情况下 $C$ 正确分类图像的无条件概率为 0.75。


    误分类的后果根据我们考虑的应用而有不同的解释。一方面，正确概率为 95% 的预测器，即误分类错误为 5%，可以被认为足以准确地对动物图像进行分类。另一方面，同样的误分类错误在医学应用的背景下可能被认为极不安全，例如从
    X 射线成像中识别肿瘤，其中即使一次误分类也可能产生严重后果。


    ### Bayes 最优分类器


    给定一个概率分布 $\mathcal{D}$，我们可以很容易地证明 $\mathcal{X} \times \mathcal{Y}$ 上的最优预测函数为


    $$C^{\text{opt}} : \mathbf{x} \mapsto \arg\max_{y \in \mathcal{Y}} \mathbb{P}_{(\mathbf{x},y)\sim\mathcal{D}}[y
    \mid \mathbf{x}] . \quad (2.2)$$


    该函数称为 *Bayes 最优分类器*。它在以下意义上是最优的：没有其他分类器 $C : \mathcal{X} \to \mathcal{Y}$ 在 $\mathcal{D}$
    上具有更小的误分类错误。虽然理论上可以找到最优分类器，但机器学习算法更现实的目标是找到一个 *近似最优分类器*，其误分类错误尽可能接近 $C^{\text{opt}}$。


    近似 Bayes 最优分类器的典型策略如下。首先，我们为标签集 $\mathcal{Y}$ 分配任意索引，即固定一个任意双射 $\Lambda : \mathcal{Y}
    \to \{1,\dots,|\mathcal{Y}|\}$。这使得每个 $y \in \mathcal{Y}$ 都有一个唯一的索引 $\Lambda(y)
    \in \{1,\dots,|\mathcal{Y}|\}$。然后，我们定义一组函数 $\mathcal{H} \subset \{h : \mathcal{X}
