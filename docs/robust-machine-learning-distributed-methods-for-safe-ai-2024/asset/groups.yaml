    In this analysis, we study the growth of a candidate (auxiliary) function, referred
    to as a Lyapunov or a potential function, over the trajectory of an iterative
    algorithm (in our case, it is the Robust DMHB algorithm). A candidate Lyapunov
    function is a real-valued positive function of \(\theta\) whose value reduces
    as \(\theta\) approaches a desirable state, e.g., a local minimum of the average
    loss function \(\mathcal{L}_H\). An example of a candidate Lyapunov function is
    the optimization error for the loss function, i.e., \(\mathcal{L}_H(\theta) -
    \mathcal{L}_H^*\). Recall that we studied this particular Lyapunov function in
    order to derive the convergence result of DMGD and Robust DMGD in Chaps. 3 and
    4, respectively. However, for analyzing the convergence of Robust DMHB, we need
    to incorporate momentum deviation into the Lyapunov function, as presented shortly
    in Sect. 6.2.2. Upon analyzing the chosen Lyapunov function, we simultaneously
    capture the opposing effects of distributed momentum on both the aggregation error
    and the bias in gradients’ estimates (i.e., the momentum deviation). This allows
    us to design a suitable constant momentum coefficient \(\beta\) that makes the
    Robust DMHB algorithm converge to an approximate stationary point with optimal
    asymptotic error, while offering a reasonable gradient complexity. Similar to
    the case of Robust DMGD, we begin with the non-convex case.


    ### 6.2.2 Case of Non-convex Loss Function


    In Theorem 6.1, presented below, we derive the convergence of Robust DMHB, i.e.,
    Algorithm 6, to (approximate) stationarity by assuming the aggregation rule \(F\)
    to be an \((f, \kappa)\)-robust averaging. Using the convergence result, we then
    derive the \((f, \varepsilon)\)-stationary resilience property that can be achieved
    using Robust DMHB, with the aggregation schemes described previously in Chaps.
    4 and 5. We consider a constant learning rate \(\gamma\), i.e., \(\gamma_t = \gamma\)
    for all \(t\), such that \(\gamma \le 1/c\), where \(c\) is a positive constant.
    To control the growth of momentum deviation, while diminishing the impact of noise
    on the aggregation error at the same time, we consider a constant momentum coefficient
    \(\beta\) such that


    \[

    \beta := \sqrt{1 - c\gamma}. \tag{6.24}

    \]


    We can quickly verify that, with the above value of the momentum coefficient \(\beta\),
    the dominating growth factor for the momentum deviation, given by \((1 + \gamma
    L)(1 + 4\gamma L)\beta^2\) in Lemma 6.3, can be made less than 1 by choosing \(c\)
    sufficiently large (e.g., \(c > 5L\)). This means that we can control the deviation
    between the momentum vectors and the instantaneous gradients. On the contrary,
    by choosing a learning rate that decreases with the total number of iterations
    \(T\) of the Robust DMHB algorithm, the above momentum coefficient also diminishes
    the effect of local gradient noise on the aggregation error analyzed in Lemma
    6.2. These observations suggest that perhaps the momentum coefficient defined
    in (6.24) could enable convergence of the algorithm, despite the opposing effects
    of \(\beta\) on the aggregation error and the deviation of momentum vectors from
    true gradients.


    To obtain a convergence result, we analyze the growth of a Lyapunov function \(V_t
    : \boldsymbol{\theta}_t \mapsto \mathbb{R}_+\), defined below, over the sequence
    of parameter vectors \(\boldsymbol{\theta}_t\) generated upon executing \(T\)
    iterations of Robust DMHB. Specifically,


    \[

    V_t := 2\left(\mathcal{L}_H(\boldsymbol{\theta}_t) - \mathcal{L}_H^*\right) +
    \frac{1}{8L}\|\boldsymbol{\xi}_t\|^2. \tag{6.25}

    \]


    Recall that \(\mathcal{L}_H^* := \min_{\boldsymbol{\theta}\in\mathbb{R}^d}\mathcal{L}_H(\boldsymbol{\theta})\),
    \(L\) denotes a Lipschitz smoothness coefficient of the point-wise loss function
    \(\ell(\cdot,\boldsymbol{\theta})\) (with respect to \(\boldsymbol{\theta}\))
    defined in Assumption 3.1, and \(\boldsymbol{\xi}_t := \mathbf{m}_t^H - \nabla\mathcal{L}_H(\boldsymbol{\theta}_t)\)
    is the momentum deviation. We see, in Lemma 6.5, that the growth of this particular
    Lyapunov function can be uniformly bounded from above, unlike that of the loss
    function \(\mathcal{L}_H(\boldsymbol{\theta}_t)\). The bound can be controlled
    by tuning the learning rate \(\gamma\), when the momentum coefficient \(\beta\)
    is defined by (6.24).


    **Lemma 6.5.** Suppose Assumptions 3.1, 3.2, and 4.1. Consider Algorithm 6 with
    an \((f,\kappa)\)-robust averaging rule \(F\), a batch size \(b \in [1,m)\), \(\gamma_t
    = \gamma \le \frac{1}{24L}\) for each iteration \(t\), and a constant momentum
    coefficient \(\hat\beta\) defined by (6.24) with \(c = 24L\). Then, for \(V_t\)
    defined in (6.25), we obtain that, for each iteration \(t > 1\),


    \[

    \mathbb{E}[V_t - V_{t-1}] \le -\frac{\gamma}{4}\mathbb{E}\left[\|\nabla\mathcal{L}_H(\boldsymbol{\theta}_{t-1})\|^2\right]
    + 3\gamma\mathbb{E}\left[\|\boldsymbol{\delta}_{t-1}\|^2\right] + \frac{(1-\beta)^2\sigma^2}{8Lb(n-f)}.

    \]


    **Proof.** Consider an arbitrary iteration \(t > 1\). Denoting \(z := \frac{1}{8L}\),
    we can write


    \[

    V_t = 2\left(\mathcal{L}_H(\boldsymbol{\theta}_t) - \mathcal{L}_H^*\right) + z\|\boldsymbol{\xi}_t\|^2.
    \tag{6.26}

    \]


    From Lemma 6.3, upon substituting \(\gamma_{t-1}=\gamma\), \(\beta_t=\beta\),
    and applying the total expectation \(\mathbb{E}[\cdot]\) on both sides of the
    inequality, we obtain that


    \[

    \mathbb{E}\left[\|\boldsymbol{\xi}_t\|^2\right] \le (1+\gamma L)(1+4\gamma L)\beta^2\mathbb{E}\left[\|\boldsymbol{\xi}_{t-1}\|^2\right]
    + 2L\gamma(1+\gamma L)\beta^2\mathbb{E}\left[\|\boldsymbol{\delta}_{t-1}\|^2\right]
    + 4L\gamma(1+\gamma L)\beta^2\mathbb{E}\left[\|\nabla\mathcal{L}_H(\boldsymbol{\theta}_{t-1})\|^2\right]
    + \frac{(1-\beta)^2\sigma^2}{b(n-f)}. \tag{6.27}

    \]


    Next, from Lemma 6.4, we obtain that


    \[

    \mathbb{E}\left[\mathcal{L}_H(\boldsymbol{\theta}_t)-\mathcal{L}_H(\boldsymbol{\theta}_{t-1})\right]
    \le -\gamma\left(\frac{1}{2}-2\gamma L\right)\mathbb{E}\left[\|\nabla\mathcal{L}_H(\boldsymbol{\theta}_{t-1})\|^2\right]
    + \gamma(1+2\gamma L)\mathbb{E}\left[\|\boldsymbol{\xi}_{t-1}\|^2\right] + \gamma(1+\gamma
    L)\mathbb{E}\left[\|\boldsymbol{\delta}_{t-1}\|^2\right]. \tag{6.28}

    \]


    Thus, substituting from (6.28) and (6.27) in (6.26), we obtain that


    \[

    \begin{aligned}

    \mathbb{E}[V_t - V_{t-1}] &= 2\mathbb{E}\left[\mathcal{L}_H(\boldsymbol{\theta}_t)-\mathcal{L}_H(\boldsymbol{\theta}_{t-1})\right]
    + z\mathbb{E}\left[\|\boldsymbol{\xi}_t\|^2 - \|\boldsymbol{\xi}_{t-1}\|^2\right]
    \\

    &\le \left(-2\gamma\left(\frac{1}{2}-2\gamma L\right)+4zL\gamma(1+\gamma L)\beta^2\right)\mathbb{E}\left[\|\nabla\mathcal{L}_H(\boldsymbol{\theta}_{t-1})\|^2\right]
    \\

    &\quad + \left(2\gamma(1+2\gamma L)+z(1+\gamma L)(1+4\gamma L)\beta^2 - z\right)\mathbb{E}\left[\|\boldsymbol{\xi}_{t-1}\|^2\right]
    \\

    &\quad + \left(2\gamma(1+\gamma L)+z2L\gamma(1+\gamma L)\beta^2\right)\mathbb{E}\left[\|\boldsymbol{\delta}_{t-1}\|^2\right]
    + z\frac{(1-\beta)^2\sigma^2}{b(n-f)}.

    \end{aligned}

    \]


    Let us denote


    \[

    A := 2\left(\frac{1}{2}-2\gamma L\right) - 4zL(1+\gamma L)\beta^2, \tag{6.29}

    \]


    \[

    B := 2\gamma(1+2\gamma L) + z(1+\gamma L)(1+4\gamma L)\beta^2 - z, \tag{6.30}

    \]


    \[

    C := 2\gamma(1+\gamma L) + z2L\gamma(1+\gamma L)\beta^2. \tag{6.31}

    \]


    Thus, we can rewrite the above inequality as


    \[

    \mathbb{E}[V_t - V_{t-1}] \le -\gamma A\,\mathbb{E}\left[\|\nabla\mathcal{L}_H(\boldsymbol{\theta}_{t-1})\|^2\right]
    + B\,\mathbb{E}\left[\|\boldsymbol{\xi}_{t-1}\|^2\right] + C\,\mathbb{E}\left[\|\boldsymbol{\delta}_{t-1}\|^2\right]
    + z(1-\beta)^2\frac{\sigma^2}{b(n-f)}. \tag{6.32}

    \]


    Next, we separately analyze \(A\), \(B\), and \(C\).


    **Term A.** Upon substituting \(z = \frac{1}{8L}\) in (6.29), and recalling that
    \(\gamma \le \frac{1}{24L}\) and \(\beta^2 < 1\), we obtain that


    \[

    A \ge 1 - 4\gamma L - \frac{4L}{8L}(1+\gamma L) \ge \frac{1}{2} - \frac{9\gamma
    L}{2} \ge \frac{1}{2} - \frac{3}{16} \ge \frac{1}{4}. \tag{6.33}

    \]


    **Term B.** From (6.30), we obtain that


    \[

    B = 2\gamma(1+2\gamma L) + z\beta^2(1 + 5\gamma L + 4\gamma^2 L^2) - z = -(1 -
    \beta^2)z + \gamma\left(2 + 4\gamma L + 5z\beta^2 L + 4z\beta^2\gamma L^2\right).

    \]


    Substituting \(z = \frac{1}{8L}\), and recalling that \(\beta^2 \le 1\) and \(\gamma
    \le \frac{1}{24L}\), we obtain that


    \[

    B \le -(1 - \beta^2)\frac{1}{8L} + \gamma\left(2 + \frac{4}{24} + \frac{5}{8}
    + \frac{4}{24 \times 8}\right) \le -(1 - \beta^2)\frac{1}{8L} + 3\gamma.

    \]


    Substituting from (6.24) with \(c = 24L\), \(1 - \beta^2 = 24\gamma L\), in the
    above, we obtain that


    \[

    B \le -24\gamma L \cdot \frac{1}{8L} + 3\gamma = 0. \tag{6.34}

    \]


    **Term C.** Substituting \(z = \frac{1}{8L}\) in (6.31), and recalling that \(\beta^2
    < 1\) and \(\gamma \le \frac{1}{24L}\), we obtain that


    \[

    C \le 2\gamma(1+\gamma L) + \frac{\gamma}{4}(1+\gamma L) = \frac{9\gamma}{4}(1+\gamma
    L) \le \frac{9\gamma}{4}\left(1+\frac{1}{24}\right) \le 3\gamma. \tag{6.35}

    \]


    Substituting from (6.33), (6.34), and (6.35) into (6.32), we obtain that


    \[

    \mathbb{E}[V_t - V_{t-1}] \le -\frac{\gamma}{4}\mathbb{E}\left[\|\nabla\mathcal{L}_H(\boldsymbol{\theta}_{t-1})\|^2\right]
    + 3\gamma\mathbb{E}\left[\|\boldsymbol{\delta}_{t-1}\|^2\right] + z\frac{(1 -
    \beta)^2\sigma^2}{b(n - f)}.

    \]


    Recall that \(z = \frac{1}{8L}\) in the above. This concludes the proof.


    In the above analysis, we obtain an upper bound on the growth of the considered
    Lyapunov function \(V_t\). Note that this upper bound is independent of the momentum
    deviation. Consequently, as the dependence on the aggregation error \(\mathbb{E}\left[\|\boldsymbol{\delta}_{t-1}\|^2\right]\)
    can be uniformly bounded under constant momentum, thanks to Lemma 6.2, we can
    now obtain an upper bound on the average of the squared gradient norm for the
    loss function over the trajectory of Robust DMHB (i.e., Algorithm 6). Specifically,
    we have the following convergence result.

