    ### 2.1.1 问题陈述


    考虑一个输入空间 $\mathcal{X}$ 和一个离散的（有限大小的）输出空间 $\mathcal{Y}$，它表示 $\mathcal{X}$ 中元素的可能标签集合。这些空间被假设与一个定义在
