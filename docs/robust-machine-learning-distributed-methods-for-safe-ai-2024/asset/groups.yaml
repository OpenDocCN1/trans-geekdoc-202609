    ## 4.5 章末注释


    在本章中，我们介绍了分布式机器学习（包括联邦学习）中鲁棒性概念的基础知识。我们首先指出了标准分布式梯度下降方法的脆弱性，并直观解释了为什么在服务器端对传入梯度进行平均不是一种鲁棒的聚合方法。鲁棒性要求在服务器端使用替代（鲁棒）聚合方法，我们为此提供了一组示例。为了形式化并衡量使用替代聚合方法（称为Robust
    DMGD）所得到的DMGD变体的鲁棒性质量，我们引入了$(f, \kappa)$-鲁棒平均和$(f, \epsilon)$-弹性的概念。最后，我们深入分析了Robust
    DMGD在强凸和非凸两种情况下的$(f, \epsilon)$-弹性性质。具体来说，我们推导了训练误差（T次训练步骤后的残差ε）及其对梯度复杂度和崩溃点（即可容忍的对抗节点比例）的依赖关系。本章中给出的证明基于我们最近在鲁棒机器学习方面的工作，见文献[3–5,
    16]。此外，我们在强凸性假设下使用调度学习率进行的收敛性分析，受到了文献[24, 31]中结果的启发。


    ## 鲁棒聚合简史


    Robust DMGD的主要构建块是服务器端对节点梯度的*鲁棒聚合*。尽管鲁棒聚合的思想至少在20世纪80年代就已在*鲁棒统计*中被广泛采用，例如见文献[21,
    29]，但据我们所知，鲁棒聚合（具体来说是截尾均值）直到2016年才在文献[32]中被引入到鲁棒分布式梯度下降中。然而，[32]只给出了标量情形，即假设*d
    = 1*。后来在2017年，几何中位数被分析为截尾均值的替代方案，用于*高维*分布式梯度下降中的鲁棒性[10]。同年，文献[7]提出了Krum来赋予分布式*随机*梯度下降鲁棒性，但该算法仅在同质环境中进行了分析。在随后的几年中，针对更一般的分布式机器学习设置，人们提出并研究了各种鲁棒聚合方法，例如见文献[20,
    22, 25, 37, 39]。然而，这些鲁棒聚合方案的优点是在不同的假设集下进行分析的。因此，无法严格比较它们的有效性。为了解决这个问题，2022年文献[16]提出了一个基于*(f,
    λ)-弹性平均*定义的统一框架。这使我们能够在标准机器学习环境中量化不同聚合方案提供的鲁棒性。虽然与*(f, λ)-弹性平均*类似的概念，即*(c, δ)-不可知鲁棒性*，早在2021年就被提出[22]，但后者无法涵盖许多聚合方案。2023年文献[3]将*(f,
    λ)-弹性平均*的定义进一步细化为*(f, κ)-鲁棒平均*，也就是本章所介绍的内容。后者相较于前者的主要优势在于，它有助于（在相同假设集下）进行*更紧*的弹性分析。虽然我们只介绍了几种可以用*(f,
    κ)-鲁棒平均*定义的聚合规则，但该定义足够通用，可以涵盖广泛的鲁棒聚合方案。


    最后，需要指出的是，在与我们所考虑设置不同的环境下，*(f, κ)-鲁棒平均*不一定能产生紧致的鲁棒性分析。具体来说，当假设局部梯度噪声的协方差具有*有界谱范数*而非*有界迹*（即假设3.2）时，*(f,
    κ)-鲁棒平均*会产生次优的鲁棒性。在这种特殊情况下，我们应使用*谱鲁棒平均原语*，例如文献[4, 40]中定义的那些。


