    # Limitations of Bucketing


    Recall that the property that enables NNM to boost the robustness of aggregations
    is that it deterministically reduces the average distance to the honest average,
    as shown in (5.4). But, unlike NNM, Bucketing only reduces this distance in expectation
    (over the random permutations), as shown in Theorem 5.2. This means that Bucketing
    can potentially improve the robustness coefficients of an aggregation rule, but
    only stochastically. In particular, there could exist iterations in the learning
    procedure where Bucketing does not reduce the distance to the honest average.
    These iterations provide an opportunity to the adversarial nodes to disrupt the
    learning procedure. Furthermore, as the creation of buckets reduces the number
    of vectors fed to the aggregation, it reduces the overall breakdown point. Indeed,
    in some executions, Bucketing could assign all the $f$ adversarial inputs to different
    buckets. In which case, the adversarial nodes can arbitrarily control the average
    of $f$ buckets, i.e., render the average of $f$ buckets adversarial, which effectively
    augments the fraction of adversarial vectors fed to the aggregation. Specifically,
    because the number of buckets are $\lceil n/s\rceil$, the fraction of adversarial
    inputs after Bucketing is $\frac{f}{\lceil n/s\rceil}$ in the'
