    $t > 1$. We can write


    $$A_t^{(i)} = \left\| \sum_{k=1}^{t-1} \beta^{t-k} \left(\mathbf{g}_k^{(i)} -
    \nabla \mathcal{L}_i(\theta_k)\right) + \left(\mathbf{g}_t^{(i)} - \nabla \mathcal{L}_i(\theta_t)\right)
    \right\|^2.$$


    Recall that for any vector $\mathbf{v} \in \mathbb{R}^d$, $\|\mathbf{v}\|^2 =
    \langle \mathbf{v}, \mathbf{v} \rangle$. Hence, by definition of the norm, we
    obtain that


    $$A_t^{(i)} = \left\| \sum_{k=1}^{t-1} \beta^{t-k} \left(\mathbf{g}_k^{(i)} -
    \nabla \mathcal{L}_i(\theta_k)\right) \right\|^2 + \left\|\mathbf{g}_t^{(i)} -
    \nabla \mathcal{L}_i(\theta_t)\right\|^2 + 2\left\langle \sum_{k=1}^{t-1} \beta^{t-k}
    \left(\mathbf{g}_k^{(i)} - \nabla \mathcal{L}_i(\theta_k)\right), \mathbf{g}_t^{(i)}
    - \nabla \mathcal{L}_i(\theta_t) \right\rangle.$$


    By definition of $A_t^{(i)}$ in (6.8), $\left\|\sum_{k=1}^{t-1} \beta^{t-k} \left(\mathbf{g}_k^{(i)}
    - \nabla \mathcal{L}_i(\theta_k)\right)\right\|^2 = \beta^2 A_{t-1}^{(i)}$. Using
    this in the above, we obtain that


    $$A_t^{(i)} = \beta^2 A_{t-1}^{(i)} + \left\|\mathbf{g}_t^{(i)} - \nabla \mathcal{L}_i(\theta_t)\right\|^2
    + 2\left\langle \sum_{k=1}^{t-1} \beta^{t-k} \left(\mathbf{g}_k^{(i)} - \nabla
    \mathcal{L}_i(\theta_k)\right), \mathbf{g}_t^{(i)} - \nabla \mathcal{L}_i(\theta_t)
