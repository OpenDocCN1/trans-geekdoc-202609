    $t \in [T]$，有 $\gamma_t = \gamma \le \frac{1}{4L}$。如果聚合 $F$ 是一个 $(f, \kappa)$-鲁棒平均，那么对于任意由
    $n - f$ 个诚实节点组成的集合 $H \subseteq [n]$，以下结论成立：


    $$\frac{1}{T}\sum_{t=1}^T \mathbb{E}\left[\left\|\nabla \mathcal{L}_H(\theta_t)\right\|^2\right]
    \le \frac{4\left(\mathcal{L}_H(\theta_1)-\mathcal{L}_H^*\right)}{\gamma T} + \frac{4L\sigma^2}{(n-f)b}\gamma
    + 3\kappa\left(\frac{4\sigma^2}{b}+\zeta\right).$$


