    ## 第 3 章

    联邦机器学习


    **摘要** 在上一章介绍机器学习基础知识时，我们假设可以访问一个训练样本 $\mathcal{S}$，其中包含（独立地）从真实分布 $\mathcal{D}$
    中抽取的数据点。然而，我们并未明确提及该数据集是如何收集或存储的。多年来，机器学习中的主流做法是在单台机器上收集和存储*用户生成的数据*，然后使用这些数据训练模型。虽然这种方法能够有效地训练出准确的模型，但它在用户数据的使用方面引发了严重的*隐私*问题。此外，由于现代机器学习任务中模型规模和所涉数据量不断增长，*集中式*地训练模型，即在一台机器上训练，正变得日益困难。为了克服这些限制，一种新范式应运而生：*联邦机器学习*。这种学习方案让多台机器协作训练一个模型，同时将其数据保留在本地。计算负载分布在多台机器上，用户可以保留对其本地数据的控制权。这种范式有时也被称为*协作式*学习，或简称为*分布式*学习。在本章中，我们在基于服务器的框架下形式化联邦机器学习问题，并介绍如何在这一背景下调整梯度下降方法。


    ## 3.1 作为分布式问题的机器学习


    在本节中，我们首先给出刻画联邦机器学习的典型数学框架，它本质上就是在分布式计算架构上进行机器学习。然后，我们展示如何调整标准梯度下降方法（如小批量梯度下降（mini-batch
    GD），更不必说梯度下降（GD）和随机梯度下降（SGD））来求解联邦机器学习问题。


    ### 3.1.1 问题陈述


    我们考虑一个由 n 台机器组成的系统，以下将这些机器称为节点，用集合 [n] := {1, …, n} 表示。这些节点要么通过中央机器（又称服务器）间接通信，要么以点对点方式在网络中直接通信。每个节点
    i 可以访问 m 个训练样本，这些样本由集合 S_i 表示，并且是独立地从定义在 X × Y 上的分布 D_i 中抽取的。每个节点 i 的局部损失函数记为
    L_i : R^d → R，其定义如下：


    ```

    $$\mathcal{L}_i(\theta) := \frac{1}{m} \sum_{(\mathbf{x},y)\in S_i} \ell\big(h_{\theta}(\mathbf{x}),
    y\big). \tag{3.1}$$

    ```


    联邦机器学习的目标是设计一种分布式算法，使每个节点都能计算出一个公共的最优模型 θ* ∈ R^d，该模型最小化所有节点的平均损失函数，即它是如下问题的解：


    ```

    $$\min_{\theta\in\mathbb{R}^d} \mathcal{L}(\theta), \text{ where } \mathcal{L}(\theta)
    := \frac{1}{n} \sum_{i=1}^{n} \mathcal{L}_i(\theta). \tag{3.2}$$

    ```


    ### 注 3.1


    为简单起见，我们假设所有节点拥有相同数量的数据点，即 m。一般而言，当节点拥有的训练样本数量不均匀时，我们不最小化其局部损失函数的平均值，而是最小化加权平均值，即
    Σ_{i=1}^n p_i L_i(θ)，其中 p_i 是正实数，且满足 Σ_{i=1}^n p_i = 1。通常，如果每个节点 i 有 m_i 个数据点，我们选择
    p_i = m_i / Σ_{i=1}^n m_i。虽然我们关注的是平均损失的最小化，但本书介绍的结果和技术很容易扩展到加权平均损失最小化，只需将每个局部损失函数
    L_i 改为 \tilde{\mathcal{L}}_i = n p_i \mathcal{L}_i 即可。


    ### 与集中式方法的比较


    上述优化问题可以通过简单地将节点各自持有的训练样本收集到一台机器上，然后在整体训练集上实现某种集中式机器学习算法（例如 2.2.1 节中介绍的梯度下降方法之一）来求解。然而，这种集中式方法会给单台机器带来不成比例的计算负载，并要求节点牺牲其数据所有权，这可能使许多节点不愿参与学习过程。稍后将在
    3.1.2 节介绍的分布式机器学习算法，可以在不要求节点直接共享其本地训练样本的情况下求解优化问题 (3.2)。相反，在联邦机器学习方法中，只要求节点 i
    共享其局部损失函数 L_i 在参数空间中有限个点上的取值信息。然而，联邦学习要求所有节点在整个学习过程中协调其局部动作。这与集中式方法不同，在集中式方法中，节点一旦导出其本地训练样本，就不需要亲自参与学习过程。


    ### 系统架构


    主要考虑了两种分布式系统架构：*基于服务器的* 和 *点对点* 架构。我们在图 3.1 中展示了这两种架构。在基于服务器的架构中，节点通过一个中央协调者（通常称为服务器，有时也称为*参数服务器*）进行协作。注意，服务器也可以被视为一个集群的抽象，该集群由若干台与节点通信的机器组成。在点对点架构中，节点在给定的网络拓扑上通过直接相互通信来协作。注意，当
    $n = 1$ 时，点对点架构和基于服务器的架构都可以轻松地归约为集中式情形。\footnote{对于基于服务器的架构，当 $n=1$ 时，要将问题归约为集中式设置，需要将服务器和节点合并为单台机器。}
    因此，我们在本章其余部分给出的所有结果都会立即推广到集中式设置。在下一节中，我们介绍在基于服务器的架构中最简单（也可能是最自然）的小批量 GD 分布式实现。这种实现也很容易扩展到分布式
    GD 和分布式 SGD。


    **注 3.2** 在本书其余部分，由于基于服务器的架构在实际系统中更广泛实用，我们将主要关注该架构。关于点对点架构的一些讨论和参考文献可以在第 3、4 和
    5 章的章末注释中找到。


    ![](img/86043981d34dd325adb0d4b75e402b8d_46_0.png)


    ### 3.1.2 分布式梯度下降方法


    在基于服务器的架构中，梯度下降方法的基本操作与集中式设置非常相似，不同之处在于前者的迭代分两个阶段进行：局部阶段和全局阶段。在每个迭代 t 中，服务器将当前模型
    θ_t 广播给所有节点，从而启动局部阶段。每个节点 i 计算其局部损失函数 L_i 在当前模型 θ_t 处的梯度估计值 g_t^(i)。节点将各自的梯度估计值返回给服务器，从而启动第二阶段。在全局阶段，服务器通过将
    θ_t 与节点发送的局部梯度估计值的平均值进行线性组合，将当前模型 θ_t 更新为 θ_{t+1}。图 3.2 展示了这种分布式梯度下降方法的实现。


    ### 分布式小批量梯度下降


    分布式梯度下降方法中局部阶段的实现取决于我们要实现的算法。在分布式小批量梯度下降（DMGD）算法的具体情形中，每个节点从其本地数据集中（随机）查询一批数据点，并计算局部损失函数在当前模型处的相应梯度估计值。因此，该梯度是其局部损失函数的一个随机估计。下面在算法
