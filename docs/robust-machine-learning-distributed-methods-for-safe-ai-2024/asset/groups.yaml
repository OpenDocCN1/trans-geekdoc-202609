    Although the worst-case scenario is not necessarily the one that occurs most often
    with software or hardware bugs, analyzing the correctness of a machine learning
    scheme in the worst case highlights the catastrophic impact that an unfortunate
    event could have on the learning procedure. Arguably, even a random shift in the
    direction of the gradient can have a significant impact on the learning procedure.
    It has been documented that in some cases even a simple *poisoning of local data*,
    e.g., random flipping of their labels, is sufficient to hinder learning. Refer
    the notes presented at the end of this chapter, in Sect. 4.5, for a list of various
    adversarial behaviors that have been considered so far. In this chapter, we present
    general robustness schemes that provably protect the efficacy of distributed gradient
    descent against a fraction of adversarial nodes that can behave *arbitrarily bad*,
    including data poisoning and even model poisoning attacks.


    An essential step in improving the robustness of a distributed gradient-descent
    method is to replace the simple averaging rule with a more sophisticated aggregation
    rule that would protect the model updates from incorrect gradients that could
    be sent by adversarial nodes. In the next section, we present a natural extension
    of the distributed mini-batch GD (DMGD) algorithm that replaces the averaging
    operation of the global phase with a so-called *robust aggregation rule*.


    **Remark 4.1** While the robustness techniques presented subsequently in this
    chapter (and Chap. 5) are analyzed in the context of *distributed* gradient descent,
    the techniques are also relevant in the conventional *centralized* machine learning
    setting. In particular, we could replace the classic arithmetic averaging by a
    robust aggregation, presented shortly in Sect. 4.1.3, to compute the gradients
    in each iteration of the mini-batch GD method (see Algorithm 3). This would prevent
    the machine learning algorithm from becoming corrupted due to poisonous training
    samples that might have been collected from unreliable sources.


