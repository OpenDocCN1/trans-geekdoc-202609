    ## 5.1.2 Robustness Amplification


    In this section, we analyze the robustness amplification property of NNM. We show
    that the composition of NNM with an $(f, \kappa)$-robust rule $F$ results in a
    new aggregation rule $F'' := F \circ \operatorname{NNM}$ that has an improved
    robustness coefficient compared to $F$. The analysis proceeds in two steps. First,
    we obtain a generic result, in Lemma 5.1, that relates the empirical variance
    of the vectors NNM outputs to the variance of the input vectors. Then, we build
    upon this result, in Theorem 5.1, to precisely characterize the robustness amplification
    property of NNM.


    ### Variance Reduction


    Lemma 5.1, presented below, allows us to demonstrate the variance-reduction property
    of NNM. Specifically, we consider arbitrarily a vector $\mathbf{u} \in \mathbb{R}^d$,
    a set of $n$ vectors $\{\mathbf{v}_1, \ldots, \mathbf{v}_n\}$ from $\mathbb{R}^d$,
    and a subset $S \subseteq [n]$ comprising $n - f$ elements. We then obtain an
    upper bound on the (Euclidean) distance between the average $\overline{\mathbf{v}}_S$
    of vectors $\mathbf{v}_i$, $i \in S$ and the average of $n - f$ vectors in $\{\mathbf{v}_1,
    \ldots, \mathbf{v}_n\}$ that are nearest neighbors of $\mathbf{u}$. The bound
    suggests that NNM leads to a reduction in the (empirical) variance, as we elaborate
    immediately after presenting Lemma 5.1 (and its proof).


    **Lemma 5.1** Consider an arbitrary vector $\mathbf{u} \in \mathbb{R}^d$ and an
    arbitrary collection of $n$ vectors $\mathbf{v}_1, \ldots, \mathbf{v}_n \in \mathbb{R}^d$.
    Let $N_u \subseteq [n]$ be a set of indices representing $n - f$ nearest neighbors
    of $\mathbf{u}$ in the set $\{\mathbf{v}_1, \ldots, \mathbf{v}_n\}$. Then, for
    any $S \subseteq [n]$ such that $|S| = n - f$, the following holds true:


    $$

    \|\mathbf{z}_u - \overline{\mathbf{v}}_S\|^2 \le \frac{4f}{(n - f)^2} \sum_{i
    \in S} \|\mathbf{v}_i - \mathbf{u}\|^2,

    $$


    where $\mathbf{z}_u := \frac{1}{n-f} \sum_{i \in N_u} \mathbf{v}_i$ and $\overline{\mathbf{v}}_S
    := \frac{1}{n-f} \sum_{i \in S} \mathbf{v}_i$.


    **Proof** Consider an arbitrary $S \subseteq [n]$ such that $|S| = n - f$. Recall
    that $N_u \subseteq [n]$ is a set of indices of $n - f$ nearest neighbors of $\mathbf{u}$
    in $\{\mathbf{v}_1, \ldots, \mathbf{v}_n\}$. Then, by definition of $\mathbf{z}_u$
    and $\overline{\mathbf{v}}_S$, we obtain that


    $$

    \|\mathbf{z}_u - \overline{\mathbf{v}}_S\|^2 = \left\| \frac{1}{n - f} \sum_{i
    \in N_u} \mathbf{v}_i - \frac{1}{n - f} \sum_{i \in S} \mathbf{v}_i \right\|^2
    = \frac{1}{(n - f)^2} \left\| \sum_{i \in N_u} \mathbf{v}_i - \sum_{i \in S} \mathbf{v}_i
    \right\|^2.

    $$


    Further simplifying the difference in the right-hand side, we get


    $$

    \|\mathbf{z}_u - \overline{\mathbf{v}}_S\|^2 = \frac{1}{(n - f)^2} \left\| \sum_{i
    \in N_u \setminus S} \mathbf{v}_i - \sum_{i \in S \setminus N_u} \mathbf{v}_i
    \right\|^2.

    $$


    The bound presented in Lemma 5.1 implies variance reduction by NNM. Specifically,
    consider an arbitrary $S \subseteq [n]$ of size $n-f$ and an arbitrary $i \in
    S$. Then, upon substituting $\mathbf{u} = \mathbf{v}_i$ in Lemma 5.1, we get


    $$

    \|\mathbf{z}_i-\overline{\mathbf{v}}_S\|^2 \leq \frac{4f}{(n-f)^2}\sum_{j\in S}\|\mathbf{v}_j-\mathbf{v}_i\|^2,

    $$


    where recall that $\mathbf{z}_i$ is as defined in Sect. 5.1.1. As the above holds
    true for any $i \in S$, we obtain that


    $$

    \sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{v}}_S\|^2 \leq \frac{4f}{(n-f)^2}\sum_{i\in
    S}\sum_{j\in S}\|\mathbf{v}_j-\mathbf{v}_i\|^2,

    $$


    where recall that $(\mathbf{z}_1,\ldots,\mathbf{z}_n) := \operatorname{NNM}(\mathbf{v}_1,\ldots,\mathbf{v}_n)$.
    Note, as explained earlier in Remark 4.5, that $\sum_{i\in S}\sum_{j\in S}\|\mathbf{v}_j-\mathbf{v}_i\|^2
    = 2|S|\sum_{i\in S}\|\mathbf{v}_i-\overline{\mathbf{v}}_S\|^2$. Therefore, from
    above we obtain that


    $$

    \frac{1}{|S|}\sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{v}}_S\|^2 \leq \frac{8f}{n-f}\cdot\frac{1}{|S|}\sum_{i\in
    S}\|\mathbf{v}_i-\overline{\mathbf{v}}_S\|^2. \tag{5.4}

    $$


    Let $\overline{\mathbf{z}}_S := \frac{1}{|S|}\sum_{i\in S}\mathbf{z}_i$. Then,
    we obtain that


    $$

    \sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{v}}_S\|^2 = \sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{z}}_S-(\overline{\mathbf{v}}_S-\overline{\mathbf{z}}_S)\|^2
    = \sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{z}}_S\|^2 + |S|\|\overline{\mathbf{v}}_S-\overline{\mathbf{z}}_S\|^2.

    $$


    Substituting from above in (5.4), we obtain that


    $$

    \frac{1}{|S|}\sum_{i\in S}\|\mathbf{z}_i-\overline{\mathbf{z}}_S\|^2 + \|\overline{\mathbf{v}}_S-\overline{\mathbf{z}}_S\|^2
    \leq \frac{8f}{n-f}\cdot\frac{1}{|S|}\sum_{i\in S}\|\mathbf{v}_i-\overline{\mathbf{v}}_S\|^2.
    \tag{5.5}

    $$


    This implies that the variance of the vectors that NNM outputs corresponding to
    the honest nodes, i.e., when $S = H$, is smaller than the original variance, provided
    that the fraction of adversarial nodes $\frac{f}{n}$ is sufficiently small (such
    that $\frac{8f}{n-f} < 1$). Specifically, due to (5.5), we have


    $$

    \frac{1}{|H|}\sum_{i\in H}\|\mathbf{z}_i-\overline{\mathbf{z}}_H\|^2 \leq \frac{8f}{n-f}\cdot\frac{1}{|H|}\sum_{i\in
    H}\|\mathbf{v}_i-\overline{\mathbf{v}}_H\|^2.

    $$


    In the following, we use the above analysis, specifically (5.5), to derive the
    amplification in the robustness of a robust aggregation rule imparted by NNM.


    ### Provably Tighter Robustness Coefficient


    The aforementioned variance-reduction property of NNM enables us to show how this
    scheme enhances the robustness coefficient of an $(f, \kappa)$-robust averaging.
    Specifically, the following result holds true.


    **Theorem 5.1** *Consider an aggregation rule $F : \mathbb{R}^{d \times n} \rightarrow
    \mathbb{R}^d$. If $F$ is an $(f, \kappa)$-robust averaging, then $F \circ \operatorname{NNM}$
    is an $(f, \kappa'')$-robust averaging where*


    $$

    \kappa'' \leq \frac{8f}{n - f}(\kappa + 1).

    $$


    *Proof* Consider $n$ arbitrary vectors $\mathbf{v}_1, \ldots, \mathbf{v}_n \in
    \mathbb{R}^d$, and an arbitrary $S \subseteq [n]$ such that $|S| = n - f$. Denote
    $(\mathbf{z}_1, \ldots, \mathbf{z}_n) := \operatorname{NNM}(\mathbf{v}_1, \ldots,
    \mathbf{v}_n)$ and $\overline{\mathbf{z}}_S := \frac{1}{|S|} \sum_{i \in S} \mathbf{z}_i$.
    Since $F$ is assumed to be an $(f, \kappa)$-robust averaging, the following holds
    true:


    $$

    \begin{aligned}

    \|F \circ \operatorname{NNM}(\mathbf{v}_1, \ldots, \mathbf{v}_n) - \overline{\mathbf{z}}_S\|^2
    &= \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n) - \overline{\mathbf{z}}_S\|^2 \\

    &\leq \frac{\kappa}{|S|} \sum_{i \in S} \|\mathbf{z}_i - \overline{\mathbf{z}}_S\|^2.
    \tag{5.6}

    \end{aligned}

    $$


    Note that for any real values $a_1, a_2$ and $a_3 > 0$, due to Young''s inequality,
    we have $(a_1 + a_2)^2 \leq (1 + a_3)(a_1)^2 + (1 + \frac{1}{a_3})(a_2)^2$. Therefore,
    using the triangle inequality, we obtain that


    $$

    \begin{aligned}

    \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n) - \overline{\mathbf{v}}_S\|^2 &= \|F(\mathbf{z}_1,
    \ldots, \mathbf{z}_n) - \overline{\mathbf{z}}_S + \overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2
    \\

    &\leq \left(1 + \frac{1}{\kappa}\right) \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n)
    - \overline{\mathbf{z}}_S\|^2 \\

    &\quad + (1 + \kappa) \|\overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2.

    \end{aligned}

    $$


    Substituting from (5.6) in the above, we get


    $$

    \begin{aligned}

    \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n) - \overline{\mathbf{v}}_S\|^2 &\leq \left(1
    + \frac{1}{\kappa}\right) \frac{\kappa}{|S|} \sum_{i \in S} \|\mathbf{z}_i - \overline{\mathbf{z}}_S\|^2
    \\

    &\quad + (1 + \kappa) \|\overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2
    \\

    &= (1 + \kappa) \left( \frac{1}{|S|} \sum_{i \in S} \|\mathbf{z}_i - \overline{\mathbf{z}}_S\|^2
    + \|\overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2 \right). \tag{5.7}

    \end{aligned}

    $$

