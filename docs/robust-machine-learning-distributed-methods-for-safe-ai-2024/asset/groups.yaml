    *动量*的鲁棒聚合来更新模型。这种方法在存在对抗节点的情况下产生阶最优训练误差，同时将（诚实节点的）梯度复杂度的开销降至最低。我们已经表明，局部梯度动量的加入减弱了梯度噪声对学习过程渐近收敛的影响。这对非凸和强凸损失函数均成立。为了证明这一结果，我们引入了一种分析优化算法收敛性的通用技术，即*李雅普诺夫分析*。关于该证明技术的更多细节可参见[5]。一般来说，李雅普诺夫分析被广泛用于刻画非线性动力系统的稳定性[12,
    14]。在鲁棒机器学习的特定背景下，这些证明的灵感来自我们最近的工作[3, 4, 8]。


    *无记忆*鲁棒聚合的根本局限性在于它们的*置换不变性*。也就是说，在 Robust DMGD 过程中，使用无记忆聚合时，模型参数向量的轨迹对于节点在迭代间的任意洗牌保持不变。使用过去梯度的*历史*打破了这种置换不变性，并已被证明对拜占庭鲁棒性有效，例如参见[1,
    2]。在[3, 8, 11]中，使用*Polyak动量*的相关改进在标准机器学习假设下被提出和分析。分布式动量的有效性也已通过实验得到证明[7, 13]。Polyak动量之所以能有效对抗对抗节点，其关键性质是具有*可控偏差*的方差缩减。其他方差缩减技术，特别是
    SAGA [6] 和 VR-MARINA [9]，也被证明是有效的[10, 15]。然而，与 Polyak 动量相比，这些方差缩减技术会导致更高的梯度复杂度。


