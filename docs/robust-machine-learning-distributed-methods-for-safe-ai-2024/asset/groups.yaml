    ## 算法6 鲁棒 DMHB

    **初始化：** **服务器**选择任意初始模型 $\theta_1 \in \mathbb{R}^d$（与算法4中给出的原始DMGD方法类似）。每个**诚实**节点
    $i$ 选择初始动量向量 $\mathbf{m}_0^{(i)} := \mathbf{0} \in \mathbb{R}^d$。在每一轮迭代 $t \in
    \{1, 2, \dots\}$ 中，服务器维护一个模型参数 $\theta_t$，并将其广播到所有节点。该轮迭代的其余步骤如下：


    1. **本地阶段。** 每个**诚实**节点 $i \in [n]$ 独立地从本地训练样本 $S_i$ 中无放回地随机采样一个由 $b$ 个数据点组成的集合
    $S_t^{(i)}$，并计算梯度


    $$

    \mathbf{g}_t^{(i)} := \frac{1}{b} \sum_{(\mathbf{x}, y) \in S_t^{(i)}} \nabla_\theta
    \ell(h_{\theta_t}(\mathbf{x}), y).

    $$


    然后，该节点将其先前的动量向量 $\mathbf{m}_{t-1}^{(i)}$ 更新为


    $$

    \mathbf{m}_t^{(i)} := \beta_t \mathbf{m}_{t-1}^{(i)} + (1 - \beta_t) \mathbf{g}_t^{(i)},
    \tag{6.1}

    $$


