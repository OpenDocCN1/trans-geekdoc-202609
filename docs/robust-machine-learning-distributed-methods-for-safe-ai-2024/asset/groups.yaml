    # ## 2.3 Chapter Notes


    We have presented in this chapter a brief overview of supervised classification
    to illustrate and formalize the main concepts of machine learning. After formalizing
    the problem, we have reviewed some of the standard optimization tools for solving
    this task. Specifically, we have presented some of the most prominent optimization
    schemes in modern machine learning, namely gradient-based methods.


    The aim of this chapter is primarily to introduce the general optimization problem
    induced by supervised learning, rather than an exhaustive presentation of the
    field. In particular, we have not discussed topics such as generalization, structural
    risk minimization, consistency, and loss function calibration. For more details
    on the topic of supervised learning, we refer the reader to introductory books
    on machine learning such as [3, 9, 11, 15]. Those books present a more comprehensive
    overview of the field. In particular, they provide sufficient information on the
    concepts of generalization and structural risk minimization to enable a proper
    understanding on why (and when) the ERM (or a regularized version of the ERM)
    yields a satisfactory model on unseen data. For this specific point, we refer
    the interested reader to [11, Chapter 4] and [3, Chapter 4]. For a more specific
    introduction to calibration and consistency of loss functions, we refer the interested
    reader to [4, 16, 17].


    For advanced optimization algorithms and further details on gradient-descent methods,
    we refer the reader to [5–7, 12, 13]. Lower bounds on the convergence rate for
    first-order gradient-descent methods, with respect to T, can be found in [2, 13].
    Although the upper bound(s) for the stochastic (and mini-batch) gradient-descent
    method we presented in this chapter are tight in general, they can be further
    improved in the non-convex case using momentum-based variance reduction, upon
    additionally assuming the loss function to be smooth with respect to the data
    points, as shown in [8]. We present further interesting properties of momentum-based
    optimization in the context of robust machine learning in Chap. 5. For more details,
    including a tighter analysis, on the convergence of stochastic (and mini-batch)
    gradient descent in the non-convex case, we refer the interested reader to paper
    [10].


