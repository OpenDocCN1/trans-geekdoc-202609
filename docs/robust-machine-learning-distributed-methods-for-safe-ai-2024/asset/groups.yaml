    回顾定理 3.1 的证明可知，在假设 3.2 下，有 $\mathbb{E}_t\left[\left\|\mathbf{g}_t^{(i)} - \nabla\mathcal{L}_i(\boldsymbol{\theta}_t)\right\|^2\right]
