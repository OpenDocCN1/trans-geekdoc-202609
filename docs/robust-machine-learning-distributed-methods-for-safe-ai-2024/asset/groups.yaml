    Under a minimal set of assumptions regarding the *smoothness* of the loss function,
    the gradient-descent method produces a *stationary point*, i.e., $\theta_{\mathrm{stat}}$
    such that $\nabla \mathcal{L}(\theta_{\mathrm{stat}}) = \mathbf{0} \in \mathbb{R}^d$.
    Note that a stationary point satisfies the first-order *necessary condition* of
    optimality. Specifically, $\theta^*$ is a minimum of $\mathcal{L}$ on $\mathbb{R}^d$
    *only if* $\nabla \mathcal{L}(\theta^*) = \mathbf{0}$. The stationarity of a point
    is also *sufficient* for optimality when the loss function is *convex*, i.e.,
    $\theta_{\mathrm{stat}}$ is a minimum of a convex loss function. In which case,
    the gradient-descent approach yields an optimal solution. This, however, is not
    true in general, i.e., a stationary point need not be optimal when the loss function
    is *non-convex*. Nevertheless, a stationary point yields satisfactory model performance
    in many practical machine learning settings.


    # Gradient Computations


    The success of a gradient-descent method depends on the quality of gradient computations.
    Computing an accurate gradient of the loss function is however not an easy operation.
    Recall, from (2.8), that $\mathcal{L}(\theta) := \frac{1}{m}\sum_{i=1}^{m}\ell\big(h_{\theta}(\mathbf{x}_i),
    y_i\big)$. In order to compute $\nabla \mathcal{L}(\theta)$, we have to compute
    gradients (with respect to $\theta$) of the point-wise loss function $\ell\big(h_{\theta}(\mathbf{x}_i),
    y_i\big)$ at all the $m$ training data points $(\mathbf{x}_i, y_i) \in S$. Computing
    these gradients might reduce to mere substitution of the training samples in a
    closed-form formula when the hypothesis class $\mathcal{H}$ is simple, such as
    the linear class described in (2.4). However, computing gradients is a computationally
    expensive operation when dealing with more sophisticated models such as neural
    networks. In fact, in the particular case of neural networks, we need a specialized
    algorithm called *backpropagation* for computing gradients. To enhance the practicality
    of gradient descent, instead of computing the exact value of $\nabla \mathcal{L}(\theta)$
    on the whole training sample $S$, we only estimate the gradient value on a randomly
    chosen data point. The resulting algorithm is called *stochastic* gradient descent.
    We can also sample multiple data points, in which case the algorithm is called
    *mini-batch* gradient descent. We present and discuss the performance of these
    methods in the remainder of this section.


    **Remark 2.2**  The above intuition of first-order Taylor polynomial approximation
    can be extended to obtain other higher-order update schemes. For example, a second-order
    Taylor polynomial approximation explains how to construct second-order optimization
    schemes, of which Newton’s method is a typical example. However, applying second-order
    schemes requires computing the Hessian of $\mathcal{L}$, which in general has
    computational complexity $O_d(d^2)$. This renders second-order methods impractical
    for training models that are commonly used these days, since they have a large
    number of trainable parameters.'
