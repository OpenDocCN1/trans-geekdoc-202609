    $$\mathrm{TM}_q(v_1,\ldots,v_n)=\frac{1}{n-2q}\sum_{i=q+1}^{n-q}v_{(i)}, \tag{4.4}$$


    where $v_{(1)},\ldots,v_{(n)}$ denote the order statistics of $v_1,\ldots,v_n$,
    i.e., the sorting of the values in non-decreasing order (with ties broken arbitrarily).
    In essence, $\mathrm{TM}_q$ computes the average of the $n-2q$ values that remain
