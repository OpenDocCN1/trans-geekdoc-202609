    The deterioration of convergence rate is due to the presence of gradient noise
    in the case of SGD and mini-batch GD. We observe an “acceleration” of a constant
    factor b (i.e., the batch-size) in mini-batch GD due to the reduction by a similar
    factor in the variance of gradient noise. Detailed convergence analyses of these
    methods can be derived from the analyses presented in Sect. 3.2.3, upon substituting
    n = 1.


    ### Non-convex Case


    Although reasoning on convex loss functions greatly helps us measure the quality
    of an optimization algorithm, in practice, however, the loss function ℒ need not
    be convex. For example, when training deep neural networks for image classification.
