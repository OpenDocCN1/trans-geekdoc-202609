    $$\sum_{i \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2 \leq \sum_{i \in S} \|\mathbf{v}_j
    - \mathbf{v}_i\|^2. \tag{C.7}$$


    令 $k^* \in [n]$ 为 $\mathrm{Krum}_q$ 选择的下标，即 $k^* \in \operatorname*{argmin}_{j
    \in [n]} \sum_{i \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2$。因此，由 (C.7)，有


    $$\sum_{i \in N_{k^*}} \|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2 = \min_{j \in [n]}
    \sum_{i \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2 \leq \min_{j \in S} \sum_{i
    \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2$$


    $$\leq \frac{1}{|S|} \sum_{j \in S} \sum_{i \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2
    \leq \frac{1}{|S|} \sum_{j \in S} \sum_{i \in S} \|\mathbf{v}_j - \mathbf{v}_i\|^2.
    \tag{C.8}$$


    注意


    $$\sum_{j \in S} \sum_{i \in S} \|\mathbf{v}_j - \mathbf{v}_i\|^2 = \sum_{i,j
    \in S} \|\mathbf{v}_j - \bar{\mathbf{v}}_S - (\mathbf{v}_i - \bar{\mathbf{v}}_S)\|^2$$


    $$= \sum_{i,j \in S} \left( \|\mathbf{v}_j - \bar{\mathbf{v}}_S\|^2 + \|\mathbf{v}_i
    - \bar{\mathbf{v}}_S\|^2 - 2 \langle \mathbf{v}_j - \bar{\mathbf{v}}_S, \mathbf{v}_i
    - \bar{\mathbf{v}}_S \rangle \right)$$


    $$= 2|S| \sum_{i \in S} \|\mathbf{v}_i - \bar{\mathbf{v}}_S\|^2 - 2 \sum_{i \in
    S} \left( \sum_{j \in S} \langle \mathbf{v}_j - \bar{\mathbf{v}}_S, \mathbf{v}_i
    - \bar{\mathbf{v}}_S \rangle \right).$$


    在上式中，对所有 $i \in S$，有 $\sum_{j \in S} \langle \mathbf{v}_j - \bar{\mathbf{v}}_S,
    \mathbf{v}_i - \bar{\mathbf{v}}_S \rangle = \langle \mathbf{0}, \mathbf{v}_i -
    \bar{\mathbf{v}}_S \rangle = 0$。因此，


    $$\sum_{j \in S} \sum_{i \in S} \|\mathbf{v}_j - \mathbf{v}_i\|^2 \leq 2|S| \sum_{i
    \in S} \|\mathbf{v}_i - \bar{\mathbf{v}}_S\|^2.$$


    ## C 鲁棒系数的推导


    将上式代入 (C.8)，可得


    $$\sum_{i \in N_{k^*}} \|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2 \leq 2 \sum_{i \in
    S} \|\mathbf{v}_i - \bar{\mathbf{v}}_S\|^2 \, . \tag{C.9}$$


    考虑任意 $i \in S$。由三角不等式和 Jensen 不等式，有


    $$\|\mathbf{v}_{k^*} - \bar{\mathbf{v}}_S\|^2 \leq (\|\mathbf{v}_{k^*} - \mathbf{v}_i\|
    + \|\mathbf{v}_i - \bar{\mathbf{v}}_S\|)^2 \leq 2\,\|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2
    + 2\,\|\mathbf{v}_i - \bar{\mathbf{v}}_S\|^2 \, .$$


    对上式重新整理各项，可得


    $$\|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2 \geq \frac{1}{2} \|\mathbf{v}_{k^*} -
    \bar{\mathbf{v}}_S\|^2 - \|\mathbf{v}_i - \bar{\mathbf{v}}_S\|^2 \, .$$


    上式结合 $|S \cap N_{k^*}| = |S| + |N_{k^*}| - |S \cup N_{k^*}| \geq (n-q) + (n-q)
    - n = n - 2q$ 这一事实，意味着


    $$\begin{aligned} \sum_{i \in S \cap N_{k^*}} \|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2
    &\geq \frac{|S \cap N_{k^*}|}{2} \|\mathbf{v}_{k^*} - \bar{\mathbf{v}}_S\|^2 -
    \sum_{i \in S \cap N_{k^*}} \|\mathbf{v}_i - \bar{\mathbf{v}}_S\|^2 \\ &\geq \frac{n-2q}{2}
    \|\mathbf{v}_{k^*} - \bar{\mathbf{v}}_S\|^2 - \sum_{i \in S \cap N_{k^*}} \|\mathbf{v}_i
    - \bar{\mathbf{v}}_S\|^2 \, . \end{aligned}$$


    由于 $\sum_{i \in N_{k^*}} \|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2 \geq \sum_{i \in
    S \cap N_{k^*}} \|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2$，由上式可得


    $$\sum_{i \in N_{k^*}} \|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2 \geq \frac{n-2q}{2}
    \|\mathbf{v}_{k^*} - \bar{\mathbf{v}}_S\|^2 - \sum_{i \in S \cap N_{k^*}} \|\mathbf{v}_i
    - \bar{\mathbf{v}}_S\|^2 \, .$$


    将上式代入 (C.9)，可得


    $$\frac{n-2q}{2} \|\mathbf{v}_{k^*} - \bar{\mathbf{v}}_S\|^2 - \sum_{i \in S \cap
    N_{k^*}} \|\mathbf{v}_i - \bar{\mathbf{v}}_S\|^2 \leq 2 \sum_{i \in S} \|\mathbf{v}_i
    - \bar{\mathbf{v}}_S\|^2 \, .$$


    在上式中使用 $\sum_{i \in S \cap N_{k^*}} \|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2 \leq
    \sum_{i \in S} \|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2$，可得


    $$\frac{n-2q}{2} \|\mathbf{v}_{k^*} - \bar{\mathbf{v}}_S\|^2 \leq 3 \sum_{i \in
    S} \|\mathbf{v}_i - \bar{\mathbf{v}}_S\|^2 \, .$$


    因此，回顾 $|S| = n-q$，由上式可得


    $$\|\mathbf{v}_{k^*} - \bar{\mathbf{v}}_S\|^2 \leq \frac{6(n-q)}{n-2q} \frac{1}{|S|}
    \sum_{i \in S} \|\mathbf{v}_i - \bar{\mathbf{v}}_S\|^2 \, .$$


    证明完毕。


    ### C.4 几何中位数


    向量 **v**₁, …, **v**ₙ ∈ ℝᵈ 的*几何中位数*，记为 GeoMed，定义为最小化这些向量的欧几里得距离之和的向量。具体地，


    GeoMed(**v**₁, …, **v**ₙ) ∈ argmin_{**y**∈ℝᵈ} ∑_{i=1}^n ‖**y** − **v**ᵢ‖.


    ### 命题 C.3

    *设 n ∈ ℕ 且 q < n/2。几何中位数是 (q, κ)-鲁棒的，其中 κ = 4 (1 + q/(n−2q))²。*


    *证明* 记 **v*** := GeoMed(**v**₁, …, **v**ₙ) 为输入向量的几何中位数。考虑任意大小为 |S| = n − q 的子集
    S ⊆ [n]。由三角不等式，对所有 i ∈ S，有


    ‖**v*** − **v**ᵢ‖ ≥ ‖**v*** − **\bar{v}**ₛ‖ − ‖**v**ᵢ − **\bar{v}**ₛ‖. (C.10)


    类似地，对任意 i ∈ [n] \ S，有


    ‖**v*** − **v**ᵢ‖ ≥ ‖**v**ᵢ − **\bar{v}**ₛ‖ − ‖**v*** − **\bar{v}**ₛ‖. (C.11)


    将所有输入向量对应的 (C.10) 和 (C.11) 相加，可得


    ∑_{i∈[n]} ‖**v*** − **v**ᵢ‖ ≥ (n − 2q) ‖**v*** − **\bar{v}**ₛ‖ + ∑_{i∈[n]\S} ‖**v**ᵢ
    − **\bar{v}**ₛ‖ − ∑_{i∈S} ‖**v**ᵢ − **\bar{v}**ₛ‖.


