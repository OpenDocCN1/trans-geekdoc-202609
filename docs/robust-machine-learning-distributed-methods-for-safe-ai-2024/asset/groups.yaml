    # 2.2.3 Training Error and Gradient Complexity


    We now have at our disposal algorithms, specifically GD, SGD, and mini-batch GD,
    for solving the ERM problem (2.8). Each method is iterative in nature: We start
    with an arbitrary estimate of a “good model” and proceed to improve this estimate
    using gradients of the point-wise loss function on the training sample. The objective
    is to minimize the overall training error, i.e., the suboptimality or stationarity
    gap at the output model, depending upon the class of the loss function at hand.
    But, at the same time, we would like to minimize the gradient complexity, i.e.,
    the computation power spent in computing the gradients during the training procedure.
    We primarily focus on gradient computations because they represent the most expensive
    computational operations in the implementation of gradient-descent methods. Expectedly,
    there exists a trade-off between the training error and gradient complexity, which
    is precisely characterized by the convergence function φ of the method, as we
    explain below using the example of mini-batch GD.


    Recall, from Algorithm 3, that in each iteration of mini-batch GD we compute b
    gradients. This means that if we run T iterations of mini-batch GD, our gradient
    complexity is proportional to bT. Suppose that the loss function L is strongly
    convex. In that case, recall that there exists a function φ(T) ∈ O_T(1/(bT)) such
    that for the last updated model θ_{T+1}, the suboptimality gap is bounded as follows:


    E[L(θ_{T+1}) − L*] ≤ φ(T)


    Therefore, in order to obtain a training error lower than or equal to ε, i.e.,
    φ(T) = ε, we need T ∈ O_{1/ε}(1/(bε)) iterations. Hence, the gradient complexity
    is given by O_{1/ε}(1/ε). This relationship between gradient complexity and training
    error applies directly to SGD as well. For GD (i.e., Algorithm 1), where in each
    iteration we compute |S| number of gradients (S being the whole training sample),
    as φ(T) ∈ O_T(e^{−T}), the gradient complexity is given by O_{1/ε}(|S| log 1/ε).
    It appears that the gradient complexity of GD is smaller than mini-batch GD or
    SGD for obtaining the same training error ε. However, this is usually not true
    in practical scenarios where the size of the training sample, i.e., |S|, is quite
    large and dominates the dependence on the training error in gradient complexity.
    We can extend the above analysis on the trade-off between training error and gradient
    complexity to the non-convex case by replacing the suboptimality gap by the stationarity
    gap (i.e., the squared Euclidean norm of the loss function’s gradient) at the
    output model.'
