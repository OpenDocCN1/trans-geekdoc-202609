    ## Algorithm 4 Distributed mini-batch GD (DMGD)


    The server initializes the procedure by choosing an initial model $\mathbf{\theta}_1
    \in \mathbb{R}^d$. Similar to the mini-batch GD method, this initial model can
    either be chosen arbitrarily or using some expert knowledge of the model being
    trained. In each iteration $t \geq 1$, the server maintains a model parameter
    $\mathbf{\theta}_t$ that is broadcast to all the nodes. The rest of the iteration
    is as follows:


    1. **Local Phase.** Each node $i \in [n]$ independently and randomly samples a
    set of $b$ data points, denoted by $S_t^{(i)}$, from the local training sample
    $S_i$ (without replacement), and computes the local gradient estimate


    $$\mathbf{g}_t^{(i)} := \frac{1}{b} \sum_{(\mathbf{x},y) \in S_t^{(i)}} \nabla_\theta
    \ell(h_{\theta_t}(\mathbf{x}), y).\tag{3.3}$$


    2. **Global Phase.** Each node $i$ returns to the server the gradient estimate
    $\mathbf{g}_t^{(i)}$. Upon receiving the gradients from all the nodes, the server
    computes their average


    $$\mathbf{g}_t := \frac{1}{n} \sum_{i=1}^n \mathbf{g}_t^{(i)},\tag{3.4}$$


    and updates the current model parameters as follows:


    $$\theta_{t+1} := \theta_t - \gamma_t \mathbf{g}_t,\tag{3.5}$$


    where $\gamma_t$ is the learning rate at iteration $t$.


    ## Distributed GD and SGD


    Recall from Chap. 2 that GD and SGD are two special instances of mini-batch GD
    where the gradient estimates are computed with data batches of sizes $m$ and 1,
    respectively. Therefore, the implementations of these methods in the considered
    distributed environment are obtained from Algorithm 4 upon modifying the gradient
    computations in the local phases with $b = m$ and $b = 1$. In the remainder of
    this book, we present our convergence results for DMGD and describe how to adapt
    these results to distributed GD (DGD) and distributed SGD (DSGD). The results
    are accompanied with self-contained proofs. Although the reader can skip the proofs
    without loss of continuity, it is highly recommended to read them for acquiring
    an in-depth understanding of the topic.


    ## 3.2 Convergence of Distributed Mini-batch Gradient Descent (DMGD)


    In this section, we present the convergence analysis for the distributed mini-batch
    GD (DMGD) method. A summary of the convergence rates of DMGD (consequently, DGD
    and DSGD) is presented in Table 3.1 (Sect. 3.3). We start by making some assumptions
    concerning the smoothness of the loss function and the level of uncertainty in
    the gradient estimates. These assumptions have been observed to hold true for
    many learning problems.


    ### 3.2.1 Assumptions and Notation


    First, as stated below, we assume that the point-wise loss function $\ell(h_{\pmb{\theta}}(\mathbf{x}),y)$
    is Lipschitz smooth with respect to the vector $\pmb{\theta}$ at any data point
    $(\mathbf{x},y)$. In the following, $\nabla$ by default denotes the gradient with
    respect to $\pmb{\theta}$.


    **Assumption 3.1 (Lipschitz Smoothness)** There exists a real value $L > 0$ such
    that for all $\pmb{\theta}, \pmb{\theta}'' \in \mathbb{R}^d$, the following holds
    true:


    $$\left\| \nabla \ell(h_{\pmb{\theta}}(\mathbf{x}),y) - \nabla \ell(h_{\pmb{\theta}''}(\mathbf{x}),y)
    \right\| \leq L \left\| \pmb{\theta} - \pmb{\theta}'' \right\|.$$


    Second, as stated below, we assume that for each node $i$, the point-wise gradients,
    i.e., $\nabla \ell(h_{\pmb{\theta}}(\mathbf{x}),y)$, $(\mathbf{x},y) \in \mathcal{S}_i$,
    have a uniformly bounded covariance trace. Recall that, by definition of $\mathcal{L}_i(\pmb{\theta})$
    in (3.1), $\nabla \mathcal{L}_i(\pmb{\theta}) = \frac{1}{m} \sum_{(\mathbf{x},y)
    \in \mathcal{S}_i} \nabla \ell(h_{\pmb{\theta}}(\mathbf{x}),y)$ for all $\pmb{\theta}$.


    **Assumption 3.2 (Bounded Covariance Trace)** There exists a real value $\sigma$
    such that for all $i \in [n]$ and $\pmb{\theta} \in \mathbb{R}^d$, the following
    holds true:


    $$\frac{1}{m} \sum_{(\mathbf{x},y) \in \mathcal{S}_i} \left\| \nabla \ell(h_{\pmb{\theta}}(\mathbf{x}),y)
    - \nabla \mathcal{L}_i(\pmb{\theta}) \right\|^2 \leq \sigma^2.$$


    When imposing these assumptions, we consider two main types of loss functions
    for which we analyze the convergence of DMGD below: non-convex (in Sect. 3.2.2)
    and strongly convex loss functions (in Sect. 3.2.3). Due to the stochastic nature
    of the update procedure when using random batches, we characterize the convergence
    of DMGD in expectation. Specifically, we denote by $\mathcal{P}_t$ the transcript
    or the history of the algorithm, until the $t$-th iteration. This history is defined
    as follows:


    $$\mathcal{P}_t := \{\pmb{\theta}_1, \dots, \pmb{\theta}_t\}. \tag{3.6}$$


    We denote by $\mathbb{E}_t[\cdot]$ the conditional expectation $\mathbb{E}[\cdot
    | \mathcal{P}_t]$. Thus, upon executing $T$ iterations of DMGD, the expectation
    over the randomness of the algorithm, denoted by $\mathbb{E}[\cdot]$, is defined
    by the nested conditional expectations over the iterations, i.e., $\mathbb{E}[\cdot]
    = \mathbb{E}_1[\cdots \mathbb{E}_T[\cdot]]$.


    ### 3.2.2 Non-convex Loss Functions


    We begin by presenting the case when the loss function might be non-convex, which
    is arguably quite often the case in machine learning. As mentioned in Chap. 2,
    when the global average loss function $\mathcal{L}(\pmb{\theta})$ is non-convex,
    the best outcome for the DMGD algorithm is a stationary point, i.e., $\theta^*$
    such that $\nabla \mathcal{L}(\theta^*) = \mathbf{0}$. The following theorem shows
    that, after executing $T''$ iterations of the DMGD method with a sufficiently
    small learning rate, if the server chooses to output a random model from the set
    $\{\theta_1, \ldots, \theta_{T''}\}$, then the algorithm approximates a stationary
    point of the loss function $\mathcal{L}$. Recall that $\mathcal{L}^* := \min_{\theta
    \in \mathbb{R}^d} \mathcal{L}(\theta)$.


    **Theorem 3.1** *Suppose Assumptions 3.1 and 3.2.* Consider $T''$ iterations of
    the DMGD algorithm with batch-size $b \in [1,m]$. If $\gamma_t = \gamma \in (0,
    \frac{1}{L}]$ for all $t \in [T]$, then the following holds true:


    $$\frac{1}{T}\sum_{t=1}^{T} \mathbb{E}\left[\|\nabla \mathcal{L}(\theta_t)\|^2\right]
    \leq \frac{2\left(\mathcal{L}(\theta_1)-\mathcal{L}^*\right)}{T\gamma}+\frac{L\sigma^2}{nb}\gamma.
    \tag{3.7}$$


    > **Proof.** By the definition of $\mathcal{L}(\theta)$ in (3.2), we note that
    the Lipschitz smoothness of $\ell(h_\theta(x), y)$ with respect to $\theta$, i.e.,
    Assumption 3.1, implies Lipschitz smoothness for the global loss function $\mathcal{L}(\theta)$,
    with the same Lipschitz constant $L$. Consider an arbitrary $t \in [T]$. From
    the Lipschitz smoothness inequality (shown in Lemma A.1, Appendix A.1), we have


    $$\mathcal{L}(\theta_{t+1}) \leq \mathcal{L}(\theta_t) + \langle \nabla \mathcal{L}(\theta_t),
    \theta_{t+1}-\theta_t\rangle + \frac{L}{2}\|\theta_{t+1}-\theta_t\|^2.$$


    > Substituting $\theta_{t+1}$ on the right-hand side from (3.5), then taking the
    expectation $\mathbb{E}_t[\cdot]$ on both sides, we obtain that


    $$\mathbb{E}_t[\mathcal{L}(\theta_{t+1})] \leq \mathcal{L}(\theta_t) - \gamma_t\langle
    \nabla \mathcal{L}(\theta_t), \mathbb{E}_t[\mathbf{g}_t]\rangle + \frac{L}{2}\gamma_t^2\mathbb{E}_t\left[\|\mathbf{g}_t\|^2\right].
    \tag{3.8}$$


    > For all $i \in [n]$, by definition of $\mathbf{g}_t^{(i)}$ in (3.3), $\mathbb{E}_t[\mathbf{g}_t^{(i)}]
    = \nabla \mathcal{L}_i(\theta_t)$. Therefore, by definition of $\mathbf{g}_t$
    in (3.4) and $\mathcal{L}(\theta)$ in (3.2), we have


    $$\mathbb{E}_t[\mathbf{g}_t] = \frac{1}{n}\sum_{i=1}^{n}\mathbb{E}_t\left[\mathbf{g}_t^{(i)}\right]
    = \frac{1}{n}\sum_{i=1}^{n}\nabla \mathcal{L}_i(\theta_t) = \nabla \mathcal{L}(\theta_t).
    \tag{3.9}$$


    > Substituting from (3.9) in (3.8), we have


    $$\mathbb{E}_t[\mathcal{L}(\theta_{t+1})] \leq \mathcal{L}(\theta_t) - \gamma_t\|\nabla
    \mathcal{L}(\theta_t)\|^2 + \frac{L}{2}\gamma_t^2\mathbb{E}_t\left[\|\mathbf{g}_t\|^2\right].
    \tag{3.10}$$


    We now obtain an upper bound for $\mathbb{E}_t \left[ \|\mathbf{g}_t\|^2 \right]$.
    Note that


    $\mathbb{E}_t \left[ \|\mathbf{g}_t - \nabla \mathcal{L}(\theta_t)\|^2 \right]
    = \mathbb{E}_t \left[ \left\| \frac{1}{n} \sum_{i=1}^{n} \left( \mathbf{g}_t^{(i)}
    - \nabla \mathcal{L}_i(\theta_t) \right) \right\|^2 \right]. \quad (3.11)$


    Furthermore, as each node samples its data points independently, for any pair
    of non-identical nodes $(i, j) \in [n] \times [n]$, we have


    $\mathbb{E}_t \left[ \langle \mathbf{g}_t^{(i)} - \nabla \mathcal{L}_i(\theta_t),
    \mathbf{g}_t^{(j)} - \nabla \mathcal{L}_j(\theta_t) \rangle \right] = \langle
    \mathbb{E}_t[\mathbf{g}_t^{(i)}] - \nabla \mathcal{L}_i(\theta_t), \mathbb{E}_t[\mathbf{g}_t^{(j)}]
    - \nabla \mathcal{L}_j(\theta_t) \rangle = 0.$


    Therefore, we have


    $\mathbb{E}_t \left[ \left\| \frac{1}{n} \sum_{i=1}^{n} \left( \mathbf{g}_t^{(i)}
    - \nabla \mathcal{L}_i(\theta_t) \right) \right\|^2 \right] = \frac{1}{n^2} \sum_{i=1}^{n}
    \mathbb{E}_t \left[ \left\| \mathbf{g}_t^{(i)} - \nabla \mathcal{L}_i(\theta_t)
