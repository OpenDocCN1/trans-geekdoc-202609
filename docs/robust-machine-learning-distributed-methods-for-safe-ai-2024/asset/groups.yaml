    属于集合 $\Theta_i \subseteq \mathbb{R}^{d_i}$。具体来说，假设的参数 $\boldsymbol{\theta}$ 由元组
    $(\boldsymbol{\vartheta}_1, \dots, \boldsymbol{\vartheta}_N)$ 给出，假设类由下式给出


    $$\mathcal{H} := \left\{ \mathbf{x} \mapsto h_{\boldsymbol{\theta}}(\mathbf{x})
    := h_{\boldsymbol{\vartheta}_N}^{(N)} \circ \dots \circ h_{\boldsymbol{\vartheta}_1}^{(1)}(\mathbf{x})
    \mid \boldsymbol{\vartheta}_i \in \Theta_i, \forall i \in [N] \right\} . \tag{2.6}$$


    该假设类的参数空间由 $\Theta := \Theta_1 \times \dots \times \Theta_N$ 给出。

    正如我们在线性模型的二分类情形中所解释的，我们可以通过求解 ERM 问题从这类神经网络中获得最优模型。与二分类情形类似，$0/1$ 损失不是 $\ell$
    的好候选；因此需要代理损失。在神经网络的背景下，一种常见的代理损失是交叉熵损失，定义如下：


    $$\ell_{\text{cross-entropy}}(h_{\boldsymbol{\theta}}(\mathbf{x}), y) := - \sum_{k=1}^{|\mathcal{Y}|}
    \mathbb{I}\{\Lambda(y) = k\} \log \left( \frac{\exp([h_{\boldsymbol{\theta}}(\mathbf{x})]_k)}{\sum_{j=1}^K
    \exp([h_{\boldsymbol{\theta}}(\mathbf{x})]_j)} \right). \tag{2.7}$$


    ### ERM 的简化


    当使用参数化假设类时，ERM 问题归结为找到求解以下优化问题的最优参数 $\boldsymbol{\theta}^*$：


    $$\min_{\boldsymbol{\theta} \in \Theta} \mathcal{L}(\boldsymbol{\theta}), \quad
    \text{where} \quad \mathcal{L}(\boldsymbol{\theta}) := \frac{1}{m} \sum_{i=1}^m
    \ell\left(h_{\boldsymbol{\theta}}(\mathbf{x}_i), y_i\right). \tag{2.8}$$


    在本书的其余部分，为简单起见，我们假设 $\Theta = \mathbb{R}^d$，其中 $d$ 被称为*模型规模*或*模型维度*。此外，由于我们主要关注机器学习算法的优化部分，我们提高
    ERM 问题的可解性，并假设 $\ell$ 是可微的*代理损失函数*。注意，我们刚刚介绍了其中两种，但一般来说选择不限于平方损失或交叉熵损失。在本书中，我们通常考虑一般性问题（不指定损失），只考虑映射
    $(\boldsymbol{\theta}, \mathbf{x}, y) \mapsto \ell(h_{\boldsymbol{\theta}}(\mathbf{x}),
    y)$ 关于参数 $\boldsymbol{\theta}$ 是可微的。此外，我们假设经验损失函数 $\mathcal{L}(\boldsymbol{\theta})$
    存在最小值，即存在 $\boldsymbol{\theta}^* \in \mathbb{R}^d$，使得对所有 $\boldsymbol{\theta}
    \in \mathbb{R}^d$ 都有 $\mathcal{L}(\boldsymbol{\theta}^*) \leq \mathcal{L}(\boldsymbol{\theta})$。在这些假设下，基于梯度的迭代优化算法可以为
    ERM 问题 (2.8) 产生足够好的近似解。近似的质量取决于我们可以对损失函数 $\mathcal{L}(\boldsymbol{\theta})$ 做出的额外假设。


    ## 2.2 标准优化算法


    现在我们将注意力转向用于求解 (2.8) 中定义的 ERM 问题的*梯度下降*数值技术。梯度下降方法及其变体是机器学习中使用最广泛的优化算法。这些方法是迭代算法，都依赖于相同的指导原则：在每次迭代中，根据经验损失函数的合适*下降方向*更新模型参数。其中一个下降方向由损失函数
    $\mathcal{L}$ 的*梯度*确定，我们将其记为 $\nabla \mathcal{L}$。具体来说，沿着与损失梯度方向相反的向量（例如 $-\nabla
    \mathcal{L}(\boldsymbol{\theta}) \in \mathbb{R}^d$）更新模型参数 $\boldsymbol{\theta}
    \in \mathbb{R}^d$，会使损失函数减小。


    ### 为什么是梯度？


    使用 $-\nabla \mathcal{L}(\boldsymbol{\theta})$ 作为下降方向的一个很好的理由由泰勒定理给出。根据该定理，如果函数自变量的变化足够小，那么可微函数值的变化与自变量变化成线性关系。此外，线性（或*一阶*）系数由函数的梯度给出。具体来说，假设当前模型参数为
    $\boldsymbol{\theta} \in \mathbb{R}^d$。我们希望将模型参数更新为损失更小的 $\boldsymbol{\theta}''$。通过函数
    $\mathcal{L}$ 的一阶泰勒多项式近似，我们有


    $\mathcal{L}(\boldsymbol{\theta}'') = \mathcal{L}(\boldsymbol{\theta}) + \langle
    \nabla \mathcal{L}(\boldsymbol{\theta}), \boldsymbol{\theta}'' - \boldsymbol{\theta}
    \rangle + \psi\left( \boldsymbol{\theta}'' - \boldsymbol{\theta} \right), \qquad
    (2.9)$


    其中 $\psi\left( \boldsymbol{\theta}'' - \boldsymbol{\theta} \right)$ 是 $\boldsymbol{\theta}''
    - \boldsymbol{\theta}$ 的函数，当 $\|\boldsymbol{\theta}'' - \boldsymbol{\theta}\|$
    很小时可以忽略不计。具体来说，当 $\|\boldsymbol{\theta}'' - \boldsymbol{\theta}\| \to 0$ 时，$\frac{\psi(\boldsymbol{\theta}''
    - \boldsymbol{\theta})}{\|\boldsymbol{\theta}'' - \boldsymbol{\theta}\|} \to 0$。然后，选择
    $\boldsymbol{\theta}'' = \boldsymbol{\theta} - \gamma \nabla \mathcal{L}(\boldsymbol{\theta})$，其中
    $\gamma$ 是正实数，由 (2.9) 我们有


    $\mathcal{L}(\boldsymbol{\theta}'') = \mathcal{L}(\boldsymbol{\theta}) - \gamma
    \|\nabla \mathcal{L}(\boldsymbol{\theta})\|^2 + \psi\left( \gamma \nabla \mathcal{L}(\boldsymbol{\theta})
    \right).$


    然后，由于当 $\gamma \|\nabla \mathcal{L}(\boldsymbol{\theta})\| \to 0$ 时 $\frac{\psi(\gamma
    \nabla \mathcal{L}(\boldsymbol{\theta}))}{\gamma \|\nabla \mathcal{L}(\boldsymbol{\theta})\|}
    \to 0$，对于足够小的 $\gamma$，我们有 $\mathcal{L}(\boldsymbol{\theta}'') \leq \mathcal{L}(\boldsymbol{\theta})$。当
    $\|\nabla \mathcal{L}(\boldsymbol{\theta})\| > 0$ 时，该不等式可以变为严格不等式。


