    # Robust DGD and DSGD


    In the remainder of this book, we consider Robust DMGD as the representative of
    all three gradient-descent methods presented in the previous chapter. Recall that
    the only difference between these methods is their local phase, which remains
    unchanged in the robust implementation. Therefore, to obtain a robust implementation
    of either DGD or DSGD, it suffices to replace their global phase with that of
    Algorithm 5. Essentially, the modification always consists in changing the averaging
    to another aggregation rule $F : (\mathbb{R}^d)^n \rightarrow \mathbb{R}^d$. Whenever
    suitable, we provide remarks on how to extend the results pertaining to DMGD to
    the other two methods. We present next in Sect. 4.1.3 some common robust aggregation
    rules.


    # 4.1.3 Robust Aggregation


    The idea behind a robust aggregation rule is to provide some insensitivity to
    changes in some input gradients. For example, consider the scalar case where we
    are given $n$ (scalar) gradient values $v_1, \dots, v_n \in \mathbb{R}$. Suppose
    that the aggregation rule, denoted $F$, is defined to be a linear combination
    of the input values, i.e.,


    $$F(v_1, \dots, v_n) = \sum_{i=1}^n a_i v_i, \text{ where } a_i > 0.$$


    Then, as we just saw in the example given in Fig. 4.1, the outcome of the aggregate
    can be changed arbitrarily by changing a single gradient value. In other words,
    by changing $v_i$ to $v''_i$ for any $i$, the output of $F(v_1, \dots, v_n)$ changes
    by $a_i(v_i - v''_i)$ that is independent of the other gradients, hence can be
    made arbitrarily large. Now, suppose that $F$ is defined to be the *median* of
    the input values, i.e.,


    $$F(v_1, \dots, v_n) = \text{median}(v_1, \dots, v_n).$$


    Then, even if we change $v_i$ to $v''_i$, the change in the output of $F$ is bounded
    by the maximum absolute difference between any two unchanged input values. This
    observation holds regardless of the magnitude of the change we make to $v_i$.
    In particular, this means that the median cannot be arbitrarily manipulated by
    a single input. It is thus more robust than a mere linear combination of the inputs.
    To seek *more robustness*, let us consider $F$ to be the *trimmed mean* of the
    input values.$^1$ The trimmed mean is a standard robust adaptation of averaging,
    based on outlier filtering. Given $n$ scalar values $v_1, \dots, v_n \in \mathbb{R}$,
    and a *trimming parameter* $q < \frac{n}{2}$,


    $^1$ The quality of robustness achieved by an aggregation rule, which gives substance
    to the notion of *more robustness* (or less robustness), is formalized later in
    Sect. 4.3.'
