    ### Resilience of Robust DSGD and Robust DGD


    We immediately obtain the resilience property for the robust DSGD method from
    (4.36) upon substituting the batch-size $b=1$. In the special case of robust DGD,
    i.e., when each honest node computes local gradients for the whole training sample
    ($b=m$), the resilience property is given by (4.35) once we substitute $\sigma=0$.
    Specifically, in the case of DGD, we have $\epsilon \in O_T \left(e^{-\frac{T}{\kappa
    K_{\mathcal{L}_H}}} + \kappa\zeta\right)$. We remark that, when $f=0$, the convergence
    guarantee reduces to that of the traditional (non-robust) DGD method, provided
    the aggregation rule is CWTM$_f$ (simply because $\kappa \in O_n\left(\frac{f}{n}\right)$
    for these rules). However, the same cannot be said for the other (median-based)
    aggregation rules, i.e., CWMed, GeoMed, and Krum (i.e., Multi-Krum$_{f,1}$). This
    shortcoming of median-based aggregates can be overcome through the use of pre-aggregation
    schemes, introduced shortly in Chap. 5.


    ## 4.5 Chapter Notes


    We have presented in this chapter a primer on the concept of robustness in distributed
    machine learning (including federated learning). We have first highlighted the
    fragility of standard distributed gradient-descent methods and have provided an
    intuition to why averaging is not a robust approach to aggregating the incoming
    gradients at the server. Robustness calls for surrogate (robust) aggregation methods
    at the server, for which we have provided a set of examples. To formalize and
    measure the quality of robustness enjoyed by the variant of DMGD resulting from
    the usage of a surrogate aggregation method (called Robust DMGD), we have introduced
    the concepts of $(f, \kappa)$-robust averaging, and of $(f, \epsilon)$-resilience.
    Lastly, we have presented an in-depth analysis for the $(f, \epsilon)$-resilience
    property of


    Robust DMGD in both cases: strongly convex and non-convex. Specifically, we have
    derived training error (residual error ε after T training steps), and its dependence
    on gradient complexity and breakdown point (i.e., tolerable fraction of adversarial
    nodes). The proofs that we have presented in this chapter are based upon our recent
    work on robust machine learning that appears in [3–5, 16]. Furthermore, the convergence
    analysis we have presented under strong convexity, using a scheduled learning
    rate, is inspired by the results presented in [24, 31].


    ## Brief History of Robust Aggregation


    The main building block of Robust DMGD is the *robust aggregation* of nodes’ gradients
    at the server. Although the idea of robust aggregation has been widely adopted
    in *robust statistics* at least since the 1980s, e.g., see [21, 29], as far as
    we know, robust aggregation (specifically, trimmed mean) was introduced to robust
    distributed gradient descent as recently as 2016 in [32]. However, [32] only presented
    the scalar case, i.e., it was assumed that *d = 1*. Later, in 2017, geometric
    median was analyzed as an alternative to trimmed mean for robustness in *high-dimensional*
    distributed gradient descent [10]. In the same year, Krum was proposed to impart
    robustness to distributed *stochastic* gradient descent in [7], but the algorithm
    was only analyzed in a homogeneous setting. In the following years, various robust
    aggregations were proposed and studied, e.g., see [20, 22, 25, 37, 39], for more
    general distributed machine learning settings. However, the benefits of these
    robust aggregation schemes were analyzed under varying sets of assumptions. For
    this reason, it was impossible to rigorously compare their effectiveness. To remedy
    this, a unifying framework, based upon the definition of *(f, λ)-resilient averaging*,
    was presented in 2022 [16]. This enabled us to quantify the robustness provided
    by different aggregation schemes in a standard machine learning setting. While
    a similar notion to *(f, λ)-resilient averaging*, specifically, *(c, δ)-agnostic
    robustness*, was proposed earlier in 2021 [22], the latter fails to encapsulate
    many aggregation schemes. In 2023 [3], the definition of *(f, λ)-resilient averaging*
    was later refined to *(f, κ)-robust averaging*, which is what we have presented
    in this chapter. The main advantage of the latter, over the former definition,
    is that it facilitates a *tighter* resilience analysis (under the same set of
    assumptions). Although we have only presented a few aggregation rules that can
    be characterized by the definition of *(f, κ)-robust averaging*, the definition
    is generic enough to incorporate a wide range of robust aggregation schemes.


    Lastly, it is important to notice that *(f, κ)-robust averaging* need not yield
    a tight robustness analysis in a setting that is different than the one we have
    considered. Specifically, in the case when the covariance of local gradients’
    noise is assumed to have *bounded spectral norm* instead of *bounded trace* (i.e.,
    Assumption 3.2), *(f, κ)-robust averaging* yields suboptimal robustness. In that
    particular case, we should use a *spectral robust averaging primitive*, such as
    the ones defined in [4, 40].


