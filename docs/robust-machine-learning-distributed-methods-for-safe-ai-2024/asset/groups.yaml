    ## Algorithm 6 Robust DMHB

    **Initialization:** The **server** chooses an arbitrary initial model $\theta_1
    \in \mathbb{R}^d$ (similar to the original DMGD method presented in Algorithm
    4). Each **honest** node $i$ chooses an initial momentum vector $\mathbf{m}_0^{(i)}
    := \mathbf{0} \in \mathbb{R}^d$. In each iteration $t \in \{1, 2, \dots\}$, the
    server maintains a model parameter $\theta_t$ that is broadcast to all the nodes.
    The rest of the iteration is as follows:


    1. **Local phase.** Each **honest** node $i \in [n]$ independently and randomly
    samples a set of $b$ data points $S_t^{(i)}$ from the local training sample $S_i$
    (without replacement) and computes the gradient


    $$

    \mathbf{g}_t^{(i)} := \frac{1}{b} \sum_{(\mathbf{x}, y) \in S_t^{(i)}} \nabla_\theta
    \ell(h_{\theta_t}(\mathbf{x}), y).

    $$


    Then, the node updates its previous momentum vector $\mathbf{m}_{t-1}^{(i)}$ to


    $$

    \mathbf{m}_t^{(i)} := \beta_t \mathbf{m}_{t-1}^{(i)} + (1 - \beta_t) \mathbf{g}_t^{(i)},
    \tag{6.1}

    $$


    where $\beta_t$ is the *momentum coefficient* for iteration $t$.


    2. **Global phase.** Each node $i \in [n]$ returns to the server the updated momentum
    vector $\mathbf{m}_t^{(i)}$. If node $i$ is **honest**, then $\mathbf{m}_t^{(i)}$
    is defined as per (6.1). Otherwise, $\mathbf{m}_t^{(i)}$ could be an arbitrary
    vector in $\mathbb{R}^d$. Upon receiving the momentum vectors from all the nodes,
    the server computes their aggregate


    $$

    \widehat{\mathbf{m}}_t := F\left(\mathbf{m}_t^{(1)}, \dots, \mathbf{m}_t^{(n)}\right).
    \tag{6.2}

    $$


    Using the aggregate momentum vector $\widehat{\mathbf{m}}_t$, the server updates
    the current model $\theta_t$ to


    $$

    \theta_{t+1} := \theta_t - \gamma_t \widehat{\mathbf{m}}_t, \tag{6.3}

    $$


    where $\gamma_t$ is the learning rate at iteration $t$.


    and (ii) the perturbation due to the (robust) aggregation error. Specifically
    denoting by $H$ a set of $n - f$ honest nodes for each iteration $t$, we can rewrite
    the update rule (6.3) as follows:


    $$

    \theta_{t+1} = \theta_t - \gamma_t \mathbf{m}_t^H - \gamma_t \delta_t. \tag{6.4}

    $$


    where $\mathbf{m}_t^H := \frac{1}{|H|} \sum_{i \in H} \mathbf{m}_t^{(i)}$, and


    $$

    \delta_t := \widehat{\mathbf{m}}_t - \mathbf{m}_t^H = F\left(\mathbf{m}_t^{(1)},
    \dots, \mathbf{m}_t^{(n)}\right) - \mathbf{m}_t^H. \tag{6.5}

    $$


    According to (6.4), we can treat Algorithm 6 as a perturbation of the DMHB method
    being executed by the set of honest nodes $H$. Below, in Sects. 6.1.1 and 6.1.2,
    we analyze, respectively, the effects of the momentum coefficient $\beta$ on the
    aggregation error over the momentum vectors, i.e., $\delta_t$, and the *deviation*
    of the average momentum from the true gradient of the (honest) average loss function,


