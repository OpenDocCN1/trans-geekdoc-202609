    然而，实际上我们事先并不知道真实分布 $\mathcal{D}$。我们只有访问一个训练集 $\mathcal{S}$，它包含有限数量，假设为 $m$ 个输入-输出对。具体来说，$\mathcal{S}
    := \{(\mathbf{x}_1, y_1), \dots, (\mathbf{x}_m, y_m)\}$，其中对于所有 $i \in [m]$，$(\mathbf{x}_i,
    y_i) \in \mathcal{X} \times \mathcal{Y}$。在监督学习设置中，假设这些输入-输出对是根据分布 $\mathcal{D}$
    独立同分布抽取的。然后，给定假设类 $\mathcal{H}$，学习算法产生一个假设 $h^* \in \mathcal{H}$，使其在 $\mathcal{S}$
