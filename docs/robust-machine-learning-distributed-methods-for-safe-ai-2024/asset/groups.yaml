    # Provably Tighter Robustness Coefficient


    The aforementioned variance-reduction property of NNM enables us to show how this
    scheme enhances the robustness coefficient of an $(f, \kappa)$-robust averaging.
    Specifically, the following result holds true.


    **Theorem 5.1** *Consider an aggregation rule $F : \mathbb{R}^{d \times n} \rightarrow
    \mathbb{R}^d$. If $F$ is an $(f, \kappa)$-robust averaging, then $F \circ \text{NNM}$
    is an $(f, \kappa'')$-robust averaging where*


    $$\kappa'' \leq \frac{8f}{n - f}(\kappa + 1).$$


    *Proof* Consider $n$ arbitrary vectors $\mathbf{v}_1, \ldots, \mathbf{v}_n \in
    \mathbb{R}^d$, and an arbitrary $S \subseteq [n]$ such that $|S| = n - f$. Denote
    $(\mathbf{z}_1, \ldots, \mathbf{z}_n) := \text{NNM}(\mathbf{v}_1, \ldots, \mathbf{v}_n)$
    and $\overline{\mathbf{z}}_S := \frac{1}{|S|} \sum_{i \in S} \mathbf{z}_i$. Since
    $F$ is assumed to be an $(f, \kappa)$-robust averaging, the following holds true:


    $$\begin{aligned}

    \|F \circ \text{NNM}(\mathbf{v}_1, \ldots, \mathbf{v}_n) - \overline{\mathbf{z}}_S\|^2
    &= \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n) - \overline{\mathbf{z}}_S\|^2 \\

    &\leq \frac{\kappa}{|S|} \sum_{i \in S} \|\mathbf{z}_i - \overline{\mathbf{z}}_S\|^2.
    \quad (5.6)

    \end{aligned}$$


    Note that for any real values $a_1, a_2$ and $a_3 > 0$, due to Young''s inequality,
    we have $(a_1 + a_2)^2 \leq (1 + a_3)(a_1)^2 + (1 + \frac{1}{a_3})(a_2)^2$. Therefore,
    using the triangle inequality, we obtain that


    $$\begin{aligned}

    \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n) - \overline{\mathbf{v}}_S\|^2 &= \|F(\mathbf{z}_1,
    \ldots, \mathbf{z}_n) - \overline{\mathbf{z}}_S + \overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2
    \\

    &\leq \left(1 + \frac{1}{\kappa}\right) \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n)
    - \overline{\mathbf{z}}_S\|^2 \\

    &\quad + (1 + \kappa) \|\overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2.

    \end{aligned}$$


    Substituting from (5.6) in the above, we get


    $$\begin{aligned}

    \|F(\mathbf{z}_1, \ldots, \mathbf{z}_n) - \overline{\mathbf{v}}_S\|^2 &\leq \left(1
    + \frac{1}{\kappa}\right) \frac{\kappa}{|S|} \sum_{i \in S} \|\mathbf{z}_i - \overline{\mathbf{z}}_S\|^2
    \\

    &\quad + (1 + \kappa) \|\overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2
    \\

    &= (1 + \kappa) \left( \frac{1}{|S|} \sum_{i \in S} \|\mathbf{z}_i - \overline{\mathbf{z}}_S\|^2
    + \|\overline{\mathbf{z}}_S - \overline{\mathbf{v}}_S\|^2 \right). \quad (5.7)

    \end{aligned}$$


