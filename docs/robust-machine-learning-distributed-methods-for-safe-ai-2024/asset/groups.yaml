    # Chapter 1

    Context and Motivation


    **Abstract** The history of *artificial intelligence* is deeply related to that
    of *computer science*, in general, and *machine learning*, in particular. In this
    chapter, we give a perspective of the salient points of this history, before discussing
    more precisely the very meaning of computers *learning* to become *intelligent*.
    We then highlight the fragility of current machine learning schemes and the dangerous
    implications of this fragility on many critical applications, before discussing
    the meaning of making such learning *robust*. We conclude the chapter by reviewing
    the content of the book and discussing the intended audience.


    # 1.1 Brief History of Artificial Intelligence


    # 1.1.1 Can Machines Think?


    Alan Turing asked this question in 1950, only a few years after inventing his
    universal machine (that is the model of our modern computer). Turing defined the
    very meaning of *thinking*, through his famous *intelligence test*. Roughly speaking,
    a machine passes the test if a human exchanging text messages with the machine
    cannot tell whether the responses obtained come from the machine or from another
    human. Interestingly, Turing predicted in those days that, at the end of the (twentieth)
    century, “one will be able to speak of machines thinking without expecting to
    be contradicted.” Clearly, Turing was too optimistic. But only about the timeline;
    he was off by only a few decades. In 2023, conversational agents often pass the
    Turing test.


    Around the period of Turing’s work, McCulloch, Pitts, and Wiener proposed the
    first *intelligent* cybernetic system, seeking to reproduce the functioning of
    human intelligence. Their goal was to build a description of human perceptions
    by using electrical circuits and to simulate brain mechanisms based on a formal
    model. Their model paved the way for the idea of a neural network. Concomitantly,
    Claude Shannon proposed a remote-controlled mouse that was able to find its way
    out of a labyrinth while *remembering* its course.


    ![](img/86043981d34dd325adb0d4b75e402b8d_14_0.png)'
