    \ #21-01/04 Gateway East, Singapore 189721, Singapore\n\n本产品所用纸张可回收。\n\n谨以此书献给Anne\
    \  \n献给Naniji（Vimal）  \n献给Karin和Philippe\n\n## 前言\n\n在过去二十年里，所谓的人工智能（AI）系统展现了令人印象深刻的能力。它们在各种游戏中击败了世界冠军（包括国际象棋、围棋和扑克），其中有些游戏历来被视为人类智慧的终极衡量标准。这些系统在多项重要应用中也展现了非凡的成绩，如科学发现、银行业和医疗保健。近来，对话式智能体将AI推向了新的高度，直接与数百万用户互动。在某种程度上，这些新技术往往能通过著名的图灵测试，因为许多用户忘记了他们正在与机器交互。总体而言，基于AI的技术拥有令人难以置信的强大能力，许多人期望这只是“AI时代”的开端。然而，在这些成就之外，一个根本性问题浮现出来：*我们能信任AI系统吗？*\
    \ 对我们来说，答案是不能，至少在当前形式下不能。\n\nAI系统会犯错。有时这些错误只是轶事性的，如游戏场景中，但某些错误可能对医疗保健和银行业等关键应用产生重大影响。尽管媒体向公众警示所谓“强人工智能”的危险，但它们更应该突出现有AI系统的弱点，以及这些系统发生故障时可能造成的严重危害。我们提出了一套构建新一代鲁棒AI系统的方法。在讨论本书的范围和我们的鲁棒性方法的本质之前，我们先讨论AI本身的含义以及现有基于AI的技术的主要脆弱性来源。\n\
    \n简而言之，我们将AI理解为计算机系统解决人类曾认为只有自己才能解决的问题的能力。例如，第一个在国际象棋中击败加里·卡斯帕罗夫的系统被称为“AI”。几十年后，我们不再称该系统为AI，而是把这个词保留给能够在围棋中击败李世石的那个系统。如今，我们的注意力集中在ChatGPT等对话式智能体上，许多人将其视为AI的终极形式。本质上，每当我们对机器的“智力技能”感到惊讶时，我们就称之为AI。当这种惊讶效应消退后，我们便不再这样称呼。显然，我们称为AI的技能随时间的推移发生了改变，而且或许并不令人意外的是，支撑这些技能的计算机系统也发生了变化。然而，最近的AI系统有一个共同点：它们基于\n\
    \n下一代机器学习技术，这些技术理当比当前一代更加鲁棒。最后，我们希望本书也能作为一个结果集，可以通过新的理论发现加以扩展和增强，从而推动安全AI领域的发展。本手稿的内容部分基于已在主要机器学习会议上经过同行评审的研究论文。我们从事这些方法的研究已有7年多，从2016年到2023年。其灵感来源于已探索30多年的分布式计算技术。自然，我们的一些工作受到了其他团队在相关领域发表的邻近研究的影响。每章末尾都提供了对其工作的适当引用。\n\
    \n## 致谢\n\n我们非常感谢EPFL分布式计算实验室的成员：研究生、博士后研究员和实验室行政人员。我们感谢EPFL实验室中过去和现在与我们共同研究本书主题的成员，即Youssef\
    \ Allouah、Peva Blanchard、El Mahdi El Mhamdi、Sadegh Farhadkhani、Arsany Guirguis、Lê\
