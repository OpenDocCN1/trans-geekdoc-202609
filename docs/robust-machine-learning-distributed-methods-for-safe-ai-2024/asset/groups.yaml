    \n### 算法5 鲁棒DMGD\n\n服务器通过选择初始模型 θ1 ∈ R^d 来启动过程，其方式与第3章描述的DMGD方法类似。在每次迭代 t ∈ {1,2,...}\
    \ 中，服务器维护一个模型参数 θt，并将其广播给所有节点。本次迭代的其余部分如下：\n\n- 1. 本地阶段。每个诚实节点 i ∈ H 独立且随机地从本地训练样本\
    \ S_t 中（无放回地）采样一组 b 个数据点，记为 S_t^(i)，并计算局部梯度估计\n- \n- g_t^(i) := 1/b Σ_(x,y)∈S_t^(i)\
    \ ∇_θ ℓ(h_θt(x), y). (4.2)\n- \n- 2. 全局阶段。每个节点 i 向服务器返回一个梯度 g_t^(i)。如果节点i是诚实的，则\
    \ g_t^(i) 按(4.2)计算。否则，g_t^(i) 可以是 R^d 中的任意向量。在收到所有节点的梯度后，服务器计算它们的聚合\n- \n- ĝ_t\
    \ := F(g_t^(1),..., g_t^(n)). (4.3)\n- \n- 使用聚合梯度 ĝ_t，服务器将当前模型 θ_t 更新为\n- \n-\
    \ θ_{t+1} := θ_t - γ_t ĝ_t,\n- \n- 其中 γ_t 是迭代 t 的学习率。\n\n"
