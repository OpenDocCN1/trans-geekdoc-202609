    systems are critically shaping the course of modern society, with applications
    ranging from healthcare to military [7, 11, 15, 18, 20, 22]. There is no denying
    that machine learning is rapidly transforming the realm of information technology,
    touching almost every aspect of our lives[14]. Although these changes could significantly
    improve the quality of life in general and might even help us find ways to fight
    against emerging global issues, such as climate change [21], they should be used
    with a great amount of caution.


    We have highlighted that the classic machine learning algorithms, especially those
    proposed for developing large-scale models, are not robust to the challenges prevalent
    in real-world scenarios, specifically the element of *corruption*. It has been
    shown that the effectiveness of machine learning schemes can become highly compromised,
    when either the training data are adulterated or when some machines malfunction
    during the training procedure [1, 4, 5, 8, 13, 23, 27]. Using such *poorly trained*
    models in public-oriented applications could have severe consequences [17, 19].
    Protecting machine learning systems against corrupted data and malfunctioning
    machines, thereby paving the path to *safe AI*, was our key motivation in developing
    the *robust machine learning* methods we present in this book.'
