    # Preface


    Over the last two decades, so-called Artificial Intelligence (AI) systems have
    been capable of impressive feats. They beat world champions in various games (including
    Chess, Go, and Poker), some of which have been considered, throughout history,
    as ultimate measures of human intelligence. These systems also exhibited impressive
    results in several important applications such as scientific discovery, banking,
    and healthcare. Recently, conversational agents have taken AI to the next level,
    directly interacting with millions of users. To some extent, these new technologies
    often pass the celebrated Turing test, as many forget that they are interacting
    with a machine. Overall, AI-based technologies are capable of incredible prowess,
    and many expect that this is just the beginning of the “AI era.” Nevertheless,
    beyond these achievements, a fundamental question arises: *Can we trust AI systems?*
    For us the answer is no, at least not in their current form.


    AI systems make mistakes. Sometimes they are anecdotal, as in the context of games,
    but some mistakes can have a consequential impact on critical applications such
    as healthcare and banking. Although the media alert the public about the dangers
    of a so-called “strong AI,” they should highlight the weaknesses of the existing
    AI systems and the serious damage that can result from these systems when they
    malfunction. We present a set of methods for building a new generation of robust
    AI systems. Before discussing the scope of our book and the nature of our robustness
    methods, we first discuss the very meaning of AI and the main sources of fragility
    in existing AI-based technologies.


    In short, we conceive AI as the ability of a computer system to solve a problem
    that humans thought that only they could solve. For example, the system that first
    beat Garry Kasparov in Chess was called “AI.” Several decades later, we stopped
    calling that system AI, but we then reserved this term for the one capable of
    beating Lee Sedol in Go. Today, our attention is focused on conversational agents
    such as ChatGPT that many consider as an ultimate form of AI. Essentially, whenever
    we are surprised by the “intellectual skills” of a machine, we call it AI. When
    the surprise effect passes, we stop calling it so. Clearly, the skills we call
    AI have changed over time and, maybe not surprisingly, the computer systems supporting
    them have also changed. However, recent AI systems have a common denominator:
    They make'
