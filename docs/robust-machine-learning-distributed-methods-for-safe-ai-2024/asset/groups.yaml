    next-generation machine learning techniques that should clearly be more robust
    than the current generation. Lastly, we want this book to also serve as a corpus
    of results that can be extended and enhanced with new theoretical findings, thus
    advancing the field of safe AI. The content of this manuscript is based in part
    on research papers that have been peer-reviewed in major machine learning conferences.
    We have been working on these methods for over 7 years, from 2016 to 2023. They
    are inspired by distributed computing techniques that have been explored for over
    30 years. Naturally, some of our work was influenced by adjoining research that
    was published by other groups in related fields. Proper citations of their work
    are provided at the end of each chapter.


    # Acknowledgments


    We are very grateful to the members of the Distributed Computing Laboratory at
    EPFL: graduate students, postdoctoral researchers, and lab administrators. We
    thank current and former members of our lab at EPFL who have been working with
    us on the topic of the book, namely, Youssef Allouah, Peva Blanchard, El Mahdi
    El Mhamdi, Sadegh Farhadkhani, Arsany Guirguis, Lê Nguyên Hoang, John Stephan,
    Geovani Rizk, Sébastien Rouault, and Julien Steiner. They contributed to many
    of the results we present in the manuscript. We would also like to thank other
    members of our lab who work in other related areas: Clement Burgel, Martina Camajoni,
    Abdellah El Mrini, Ahmed Jellouli, Jovan Komatovic, Anastasiia Kucherenko, Matteo
    Monti, Antoine Murat, Diana Petrescu, Pierre-Louis Roman, Manuel Vidigueira, Gauthier
    Voron, and Athanasios Xygkis. They provided insightful comments on earlier versions
    of the manuscript. We thank our colleagues Hagit Attiya, Francis Bach, Waheed
    U. Bajwa, Marco Canini, Thinh Doan, Anne-Marie Kermarrec, Andrei Kucharavy, Ji
    Liu, and Nitin H. Vaidya for providing constructive feedback on an initial draft
    of the manuscript. We are also grateful to Holly Cogliati-Bauereis, whose writing
    tips and corrections have significantly improved the general writing of the manuscript.
    Last but not least, we thank France Faille, whose expert administrative support
    has enabled us to uninterruptedly focus on the research work we present in this
    manuscript, and Fabien Salvi for providing critical system support.


    Lausanne, Switzerland

    Lausanne, Switzerland

