    φ(T+1)/φ(T). Note that, as φ is a positive decreasing function, R(φ) ∈ (0, 1].
    We commonly say that the algorithm converges linearly when R(φ) < 1, and sublinearly
    when R(φ) = 1. In Table 2.1, we present a simplified (order) version of the mapping
