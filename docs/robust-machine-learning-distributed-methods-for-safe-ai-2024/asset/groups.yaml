    hypothesis does not belong to a linear class


    Since $\Lambda(\mathbf{y})^2 = 1$ for all $\mathbf{y} \in \mathcal{Y}$, the right-hand
    side of the above can be rewritten as $(h_{\boldsymbol{\theta}}(\mathbf{x}) -
    \Lambda(\mathbf{y}))^2$. In the special case of linear models, where $h_{\boldsymbol{\theta}}(\mathbf{x})
    := \boldsymbol{\theta}^T\mathbf{x}$, the squared loss reduces to $(\boldsymbol{\theta}^T\mathbf{x}
    - \Lambda(\mathbf{y}))^2$.


    ### The General Case of Non-linear Classification Tasks


    We now come back to a more general case and return to our standard multi-label
    classification problem, where $|\mathcal{Y}| \geq 2$ and $h$ is defined to be
    a mapping from $\mathcal{X}$ to $\mathbb{R}^{|\mathcal{Y}|}$. In this particular
    case, linear classifiers are often too simple to correctly capture the ground-truth
    distribution $\mathcal{D}$. In general, and even without going as far as image
    classification, we may need non-linear hypothesis classes to correctly classify
    a set of points, as illustrated in Fig. 2.2 (right). In modern-day machine learning,
    one of the most popular hypothesis classes is the class of non-linear models known
    as *neural networks*. A typical neural network yields a hypothesis that is a composition
    of $N$ non-linear parametric functions $h_{\boldsymbol{\vartheta}_1}^{(1)}, \dots,
    h_{\boldsymbol{\vartheta}_N}^{(N)}$, where each sub-parameter $\boldsymbol{\vartheta}_i$
    belongs to a set $\Theta_i \subseteq \mathbb{R}^{d_i}$. Specifically, parameter
    $\boldsymbol{\theta}$ for a hypothesis is given by the tuple $(\boldsymbol{\vartheta}_1,
    \dots, \boldsymbol{\vartheta}_N)$, and the hypothesis class is given by


    $$\mathcal{H} := \left\{ \mathbf{x} \mapsto h_{\boldsymbol{\theta}}(\mathbf{x})
    := h_{\boldsymbol{\vartheta}_N}^{(N)} \circ \dots \circ h_{\boldsymbol{\vartheta}_1}^{(1)}(\mathbf{x})
    \mid \boldsymbol{\vartheta}_i \in \Theta_i, \forall i \in [N] \right\} . \tag{2.6}$$


    The parameter space of this hypothesis class is given by $\Theta := \Theta_1 \times
    \dots \times \Theta_N$.

    As we explained in the case of binary classification with linear models, we can
    obtain an optimal model from this class of neural networks by solving the ERM
    problem. Similar to the binary case, the $0/1$ loss is not a good candidate for
    $\ell$; hence the need for a surrogate loss. In the context of neural networks,
    a common surrogate loss is the cross-entropy loss defined as follows:


    $$\ell_{\text{cross-entropy}}(h_{\boldsymbol{\theta}}(\mathbf{x}), y) := - \sum_{k=1}^{|\mathcal{Y}|}
    \mathbb{I}\{\Lambda(y) = k\} \log \left( \frac{\exp([h_{\boldsymbol{\theta}}(\mathbf{x})]_k)}{\sum_{j=1}^K
    \exp([h_{\boldsymbol{\theta}}(\mathbf{x})]_j)} \right). \tag{2.7}$$


    ### Simplification of the ERM


    When using a parameterized hypothesis class, the ERM problem reduces to finding
    an optimal parameter $\boldsymbol{\theta}^*$ that solves the following optimization
    problem:


    $$\min_{\boldsymbol{\theta} \in \Theta} \mathcal{L}(\boldsymbol{\theta}), \quad
    \text{where} \quad \mathcal{L}(\boldsymbol{\theta}) := \frac{1}{m} \sum_{i=1}^m
    \ell\left(h_{\boldsymbol{\theta}}(\mathbf{x}_i), y_i\right). \tag{2.8}$$


    In the remainder of this book, for simplicity, we assume that $\Theta = \mathbb{R}^d$,
    where $d$ is called the *model size* or *model dimension*. Furthermore, because
    we mainly focus on the optimization part of machine learning algorithms, we promote
    solvability of the ERM problem and assume that $\ell$ is a differentiable *surrogate
    loss function*. Note that we just presented two of them, but in general the choice
    is not limited to either the square or the cross-entropy loss. In this book, we
    most often consider the generic problem (without specifying the loss) and only
    consider the mapping $(\boldsymbol{\theta}, \mathbf{x}, y) \mapsto \ell(h_{\boldsymbol{\theta}}(\mathbf{x}),
    y)$ to be differentiable, with respect to the parameters $\boldsymbol{\theta}$.
    Furthermore, we assume that empirical loss function $\mathcal{L}(\boldsymbol{\theta})$
    admits a minimum, i.e., there exists $\boldsymbol{\theta}^* \in \mathbb{R}^d$
    such that $\mathcal{L}(\boldsymbol{\theta}^*) \leq \mathcal{L}(\boldsymbol{\theta})$
    for all $\boldsymbol{\theta} \in \mathbb{R}^d$. Under these assumptions, the iterative
    gradient-based optimization algorithm can produce a good enough approximate solution
    to the ERM problem (2.8). The quality of approximation depends on additional assumptions
    we could make on the loss function $\mathcal{L}(\boldsymbol{\theta})$.


    ## 2.2 Standard Optimization Algorithms


    We now turn our attention to the numerical technique of *gradient descent* for
    solving the ERM problem defined in (2.8). The gradient-descent methods, and their
    derivatives, represent the most widely used optimization algorithms in machine
    learning. These methods are iterative algorithms that all rely on the same guiding
    principle: At each iteration, the model parameters are updated as per a suitable
    *descent direction* of the empirical loss function. One such descent direction
    is determined by the *gradient* of the loss function $\mathcal{L}$, which we denote
    by $\nabla \mathcal{L}$. Specifically, updating the model parameters $\boldsymbol{\theta}
    \in \mathbb{R}^d$ along a vector facing negatively to the loss gradient, e.g.,
    $-\nabla \mathcal{L}(\boldsymbol{\theta}) \in \mathbb{R}^d$, decrements the loss
    function.


    ### Why the Gradient?


    A good justification for using $-\nabla \mathcal{L}(\boldsymbol{\theta})$ as a
    descent direction is given by Taylor''s theorem. According to this theorem, the
    change in the value of a differentiable function is linear in the change of the
    function''s arguments, if the latter is sufficiently small. Moreover, the linear
    (or *first-order*) coefficient is given by the gradient of the function. Specifically,
    suppose that the current model parameters are given by $\boldsymbol{\theta} \in
    \mathbb{R}^d$. We would like to update the model parameters, say to $\boldsymbol{\theta}''$,
    with a smaller loss. By first-order Taylor polynomial approximation of function
    $\mathcal{L}$, we have


    $\mathcal{L}(\boldsymbol{\theta}'') = \mathcal{L}(\boldsymbol{\theta}) + \langle
    \nabla \mathcal{L}(\boldsymbol{\theta}), \boldsymbol{\theta}'' - \boldsymbol{\theta}
    \rangle + \psi\left( \boldsymbol{\theta}'' - \boldsymbol{\theta} \right), \qquad
    (2.9)$


    where $\psi\left( \boldsymbol{\theta}'' - \boldsymbol{\theta} \right)$ is a function
    of $\boldsymbol{\theta}'' - \boldsymbol{\theta}$ that is negligible when $\|\boldsymbol{\theta}''
    - \boldsymbol{\theta}\|$ is small. Specifically, $\frac{\psi(\boldsymbol{\theta}''
    - \boldsymbol{\theta})}{\|\boldsymbol{\theta}'' - \boldsymbol{\theta}\|} \to 0$
    as $\|\boldsymbol{\theta}'' - \boldsymbol{\theta}\| \to 0$. Then, choosing $\boldsymbol{\theta}''
    = \boldsymbol{\theta} - \gamma \nabla \mathcal{L}(\boldsymbol{\theta})$, where
    $\gamma$ is a positive real value, from (2.9), we have


    $\mathcal{L}(\boldsymbol{\theta}'') = \mathcal{L}(\boldsymbol{\theta}) - \gamma
    \|\nabla \mathcal{L}(\boldsymbol{\theta})\|^2 + \psi\left( \gamma \nabla \mathcal{L}(\boldsymbol{\theta})
    \right).$


    Then, due to the fact that $\frac{\psi(\gamma \nabla \mathcal{L}(\boldsymbol{\theta}))}{\gamma
    \|\nabla \mathcal{L}(\boldsymbol{\theta})\|} \to 0$ as $\gamma \|\nabla \mathcal{L}(\boldsymbol{\theta})\|
    \to 0$, for sufficiently small $\gamma$, we have $\mathcal{L}(\boldsymbol{\theta}'')
    \leq \mathcal{L}(\boldsymbol{\theta})$. The inequality can be made strict when
    $\|\nabla \mathcal{L}(\boldsymbol{\theta})\| > 0$.

