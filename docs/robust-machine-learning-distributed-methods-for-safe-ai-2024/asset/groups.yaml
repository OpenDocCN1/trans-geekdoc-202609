    $$\varepsilon \in \mathcal{O}_{n,T}\left(\sqrt{\frac{\sigma^2}{(n-f)bT}} + \frac{f}{n}\frac{\sigma^2}{b}
    + \frac{f}{n}\zeta\right).$$

