    # ### 3.3 Chapter Notes


    We have presented in this chapter the framework of (server-based) federated machine
    learning and have introduced the prominent methods for learning in a federated
    manner, i.e., distributed gradient-descent methods. Specifically, we have explained
    the underlying principle of mini-batch distributed gradient descent by analyzing
    in detail the cases of non-convex and strongly convex loss functions. We have
    derived training errors in both cases and have presented mathematical tools that
    lay the foundation for further analysis of gradient-descent methods. Most of the
    proofs that we have presented in this chapter are standard and can essentially
    be considered as simplified versions of the results one may find in [13]. Furthermore,
    the convergence analysis we have presented under strong convexity, using a scheduled
    learning rate, is inspired by the results presented in [7, 15]. The training errors
    for the different methods that we discussed in this chapter are summarized below
    in Table 3.1.


    Although the analysis that we have presented in this chapter is self-contained
    and sufficient to introduce the concepts useful for the subsequent chapters in
    this book, it does not constitute a complete introduction to the fields of distributed
    algorithms and distributed optimization. For a more comprehensive treatment of
    these topics, the interested reader can refer to [3, 10] and [1, 2], respectively.
    It is also important to notice that, for pedagogical reasons, we have presented
    only simple distributed gradient-descent methods. However, federated machine learning
    is a versatile new paradigm that is growing rapidly and can offer a number of
    other solutions, including *local updates*, *node sub-sampling*, or *adaptive
    methods*. We refer the interested reader to [5] for a good overview of the field,
    including open problems and possible future advances. Finally, we chose to not
    cover the analysis of *decentralized gradient-descent* methods on a peer-to-peer
    network. Although the


