  md: 'To obtain a convergence result, we analyze the growth of a Lyapunov function
    $V_t : \boldsymbol{\theta}_t \mapsto \mathbb{R}_+$, defined below, over the sequence
    of parameter vectors $\boldsymbol{\theta}_t$ generated upon executing $T$ iterations
    of Robust DMHB. Specifically,


    $V_t := 2\big(\mathcal{L}_H(\boldsymbol{\theta}_t) - \mathcal{L}_H^*\big) + \frac{1}{8L}\|\boldsymbol{\xi}_t\|^2.\tag{6.25}$


    Recall that $\mathcal{L}_H^* := \min_{\boldsymbol{\theta}\in\mathbb{R}^d}\mathcal{L}_H(\boldsymbol{\theta})$,
