    a set of points, as illustrated in Fig. 2.2 (right). In modern-day machine learning,
    one of the most popular hypothesis classes is the class of non-linear models known
    as *neural networks*. A typical neural network yields a hypothesis that is a composition
    of $N$ non-linear parametric functions $h_{\boldsymbol{\vartheta}_1}^{(1)}, \dots,
