    $\|\mathbf{z}_i - \mathbf{z}_j\| = \frac{1}{n - f} \left\| \sum_{k \in N_i \setminus
    N_j} \mathbf{v}_k - \sum_{k \in N_j \setminus N_i} \mathbf{v}_k \right\|$


    Note that $|N_i \setminus N_j| = |N_j \setminus N_i| \le f$. Therefore, we can
    write


    $\|\mathbf{z}_i - \mathbf{z}_j\| = \frac{1}{n - f} \times \left\| \sum_{k \in
