  md: '# 2.2 Standard Optimization Algorithms


    Mini-batch GD is a strict generalization of GD and SGD. Indeed, mini-batch SGD
    reduces to SGD when $|S_t| = 1$ for all $t$ and to GD when $|S_t| = m$ for all
    $t$. In general, when the data batch-sizes are not trivially set to 1 or $m$,
    mini-batch GD combines the best features of both SGD and GD. It provides an estimate
    $\mathbf{g}_t$ that is a better approximation of the true gradient of the loss
    function while still preserving the reasonable computational cost of the algorithm.
    In fact, when mini-batch GD is used with a fixed batch-size of $b$, i.e., $|S_t|
    = b$ for all $t$, the number of iterations needed for the algorithm to find a
    good model is divided by the $b$ (compared to SGD). This helps reduce the learning
    time of the algorithm, since the mini-batch gradient computations can be parallelized
    for up to a certain value of $b$. Mini-batch GD is nowadays the backbone of optimization
    methods for large-scale machine learning. Owing to its simplicity and adaptive
    efficiency, mini-batch GD is implemented as a default optimizer in several machine
    learning frameworks, such as PyTorch [14] and TensorFlow [1], especially when
    considering deep neural network applications. In the remainder of this book, we
    mainly focus on mini-batch GD as a representative of gradient-descent schemes.
    We, however, provide side notes to adapt the results presented to both GD and
    SGD.


    # 2.2.2 Convergence Rates


    The number of iterations it takes for a gradient-descent method to produce a good
    approximate solution to the empirical risk minimization problem in (2.8) depends
    upon the additional assumption we could make about the loss function $\mathcal{L}$,
    specifically regarding its convexity. In this book, we focus on non-convex and
    strongly convex loss functions. In the following, we present an overview of these
    classes and the respective convergence guarantees of the gradient-descent methods
    described above. While we do not present proofs of these convergence guarantees
    for now, these can be derived from the general analysis presented later in Sect.
    3.2. Specifically, the distributed methods presented in Sect. 3.1.2 reduce to
    the gradient-descent methods discussed above when $n = 1$.


    **Remark 2.3** The rationale for ignoring the class of convex functions, and instead
    of focusing on strongly convex functions, is the following. Similarly to [6],
    we argue that this choice better reflects the current practices in machine learning.
    In particular, in cases when the loss function is convex, e.g., training linear
    models, we add a strongly convex regularizer to the loss function to facilitate
    (or expedite) the optimization procedure. Moreover, results for convex (but not
    strongly convex) problems can be derived as extensions of the results presented
    in this book. This book aims to present the fundamentals of robust machine learning.
    Hence, the presented results constitute a starting point for building a more general
    theory encompassing other classes for the loss function.'
