  md: 'where \(\kappa'' \in O_n\left(\frac{f}{n}\right)\). It is important to note
    that this linear dependence of \(\kappa''\) on the fraction of adversarial workers
    \(\frac{f}{n}\) is order optimal and cannot be improved upon, in general. However,
    NNM is computationally taxing; specifically, it imposes an overhead that is quadratic
    in \(n\), the number of input vectors. A simpler alternative to NNM is *Bucketing*,
    proposed in [8] and then further analyzed in [6]. This method only imposes an
    overhead that is linear in \(n\). The shortcoming of bucketing is its stochastic
    nature, as it yields order-optimal robustness only in a probabilistic sense (in
    expectation over the randomness of the shuffling done for creating *buckets*).
    The proofs for NNM are borrowed from our work on robust machine learning [1].


    We have then demonstrated why optimizing \(\kappa\), specifically achieving \(\kappa
    \in O_n\left(\frac{f}{n}\right)\), is essential to obtain a tight training error
    in the presence of adversarial workers, when measuring data heterogeneity through
    the lens of \(\zeta\)-gradient dissimilarity (introduced in the previous chapter
    as Assumption 4.1). Although the general limitation on training error, in the
    case of robustness, under heterogeneity was first demonstrated in the context
    of distributed optimization [7, 12], the notion of \(\zeta\)-gradient dissimilarity
    was later introduced and studied concurrently in [5] and [8]. In fact, the main
    idea for the lower bound that we presented in Theorem 5.3 comes from a lower bound
    proof initially presented in [8].


    # Beyond \(\zeta\)-Gradient Dissimilarity


    While insightful, the heterogeneity model of \(\zeta\)-gradient dissimilarity
    is restrictive in practice. Indeed, many machine learning tasks fail to satisfy
    this notion of heterogeneity. The more general alternative is the model of \((G,
    B)\)-gradient dissimilarity, which has been widely studied in non-robust regime
    [9–11, 13, 14]. In the context of robust machine learning, recent results in papers
    [2, 6, 8] have used the definition of \((G, B)\)-gradient dissimilarity to demonstrate
    that heterogeneity can further deteriorate robustness in general. Specifically,
    it has been proven, in [2], that data heterogeneity brings down the breakdown
    point, i.e., federated machine learning systems are generally more vulnerable
    to an adversary that was previously believed due to heterogeneous local data-generating
    distributions. Nevertheless, for pedagogical reasons, we only provide robustness
    analysis under \(\zeta\)-gradient dissimilarity. Moreover, analyzing robustness
    in this rather simple heterogeneity condition provides key insights that help
    us improve the upper bounds (on training error) for robust machine learning algorithms
    in general. Indeed, the original motivation for the pre-aggregation schemes that
    we have presented in this chapter was through \(\zeta\)-gradient dissimilarity.'
