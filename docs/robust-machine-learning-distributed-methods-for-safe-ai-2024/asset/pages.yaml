    \mathbf{v}_i - \bar{\mathbf{v}}_S \rangle = 0$. Therefore,


    $$\sum_{j \in S} \sum_{i \in S} \|\mathbf{v}_j - \mathbf{v}_i\|^2 \leq 2|S| \sum_{i
