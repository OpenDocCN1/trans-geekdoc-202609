  md: 'analysis, we study the growth of a candidate (auxiliary) function, referred
    to as a Lyapunov or a potential function, over the trajectory of an iterative
    algorithm (in our case, it is the Robust DMHB algorithm). A candidate Lyapunov
    function is a real-valued positive function of θ whose value reduces as θ approaches
    a desirable state, e.g., a local minimum of the average loss function ℒ_H. An
    example of a candidate Lyapunov function is the optimization error for the loss
    function, i.e., ℒ_H(θ) − ℒ_H^*. Recall that we studied this particular Lyapunov
    function in order to derive the convergence result of DMGD and Robust DMGD in
    Chaps. 3 and 4, respectively. However, for analyzing the convergence of Robust
    DMHB, we need to incorporate momentum deviation into the Lyapunov function, as
    presented shortly in Sect. 6.2.2. Upon analyzing the chosen Lyapunov function,
    we simultaneously capture the opposing effects of distributed momentum on both
    the aggregation error and the bias in gradients’ estimates (i.e., the momentum
    deviation). This allows us to design a suitable constant momentum coefficient
    β that makes the Robust DMHB algorithm converge to an approximate stationary point
    with optimal asymptotic error, while offering a reasonable gradient complexity.
    Similar to the case of Robust DMGD, we begin with the non-convex case.


    # 6.2.2 Case of Non-convex Loss Function


    In Theorem 6.1, presented below, we derive the convergence of Robust DMHB, i.e.,
    Algorithm 6, to (approximate) stationarity by assuming the aggregation rule F
    to be an (f, κ)-robust averaging. Using the convergence result, we then derive
    the (f, ε)-stationary resilience property that can be achieved using Robust DMHB,
    with the aggregation schemes described previously in Chaps. 4 and 5. We consider
    a constant learning rate γ, i.e., γ_t = γ for all t, such that γ ≤ 1/c, where
    c is a positive constant. To control the growth of momentum deviation, while diminishing
    the impact of noise on the aggregation error at the same, we consider a constant
    momentum coefficient β such that


    β := √(1 − cγ) . (6.24)


    We can quickly verify that, with the above value of the momentum coefficient β,
    the dominating growth factor for the momentum deviation, given by (1 + γL)(1 +
    4γL)β² in Lemma 6.3, can be made less than 1 by choosing c sufficiently large
    (e.g., c > 5L). This means that we can control the deviation between the momentums
    and the instantaneous gradients. On the contrary, by choosing a learning rate
    that decreases with the total number of iterations T of the Robust DMHB algorithm,
    the above momentum coefficient also diminishes the effect of local gradient noise
    on the aggregation error analyzed in Lemma 6.2. These observations suggest that
    perhaps the momentum coefficient defined in (6.24) could enable convergence of
    the algorithm, despite the opposing effects of β on the aggregation error and
    the deviation of momentum vectors from true gradients.'
