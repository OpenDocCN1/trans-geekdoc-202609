    # 1.2 Robust Machine Learning


    # 1.2.1 Fragility of Machine Learning


    The quality of a machine learning scheme is directly proportional to the quality
    of its training. Modern machine learning schemes make use of a massive amount
    of (a) data and (b) computing resources. Consider, for instance, ChatGPT-3.5,
    one of the most popular *deep-learning* schemes for language processing. ChatGPT-3.5
    used *10,000 Nvidia graphics processing units (GPUs)* to train a neural network,
    in early 2022, with approximately *175 billion parameters* on a massive corpus
    of text data (approximately *570GB of data*), including web pages, books, and
    other sources. The volume of training data and the size of the models have been
    growing ever since. Training models of such unprecedented scale has been made
    possible due to *distributed computing* that involves a collective effort from
    multiple machines. The computations are distributed across several machines in
    the same data center and sometimes across remotely located machines connected
    through sophisticated communication protocols. Models can also be trained on a
    diffuse network of edge devices that perform local updates on their local data.
    In order to obtain *global model updates*, each machine performs *independent
    model updates* that are periodically averaged through means of a central server.
    While the distribution of the training procedure makes it feasible to develop
    complex models and promises high accuracy, it also makes these modern machine
    learning schemes *fragile*. In fact, because the data sources come from multiple
    origins, typically on the Web, they are prone to corruption. Dishonest players
    can, for instance, inject corrupted data that can be collected by data harvesting
    bots, or they can send corrupted data to an aggregator, such as a chatbot, a spam
    filter, or a database of user profiles. Poor-quality information produces subpar
    results, regardless of the sophistication level of the model architecture. History
    shows that it does not take much to do this. In fact, the fragility can come not
    only from bad data but also from malfunctioning machines. When involving a large
    number of machines for model training, the probability that some of them suffer
    software bugs or hardware errors is also very high. Their geographic distribution
    can make some of them the target of specific attacks.


    Many now classic machine learning schemes rely on *averaging information* from
    different data sources and machines. In this case, it suffices that one source
    is bad for the entire learning procedure to be corrupted. Dishonest players can
    easily have complete control over the training data seen by their device, in addition
    to control over the local model updates sent to a central server. Even if the
    entire training is done on a single machine, dishonest players can infiltrate
    the training database by'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'inserting incorrect or misleading information by hacking data sources. If the
    model is trained on corrupted data, it will draw unintended and even harmful conclusions.
    There are several examples of machine learning systems that caused dangerous errors.
    In 2019, when a deep network was trained on the “person” categories of the ImageNet
    dataset for classifying faces into different categories, as part of the ImageNet
    Roulette project, the model quickly started using racial and gender slurs to label
    people. In 2018, IBM’s Watson proposed dangerous treatments to cancer patients.
    In 2017, in Hong Kong, UK-based Tyndaris Investments provoked the loss of 20 million
    dollars per day. In short, ensuring the robustness of machine learning systems
    is paramount to protecting our own lives.¹


    A fundamental difference between ensuring the robustness of machine learning schemes
    and classic computer systems is interesting to highlight. When used in critical
    applications, traditional computer systems are isolated from the outside world
    by using firewalls, passwords, data encryption, and other access-control measures.
    But machine learning systems are data hungry, and their success lies in their
    being open: They need to harvest information from various data sources, sometimes
    including anonymous and unverified sources on the Web. Also, modern machine learning
    schemes need a large number of computing machines to perform independent computations,
    which increases the probability that some of them will malfunction.


    # 1.2.2 The Quest for Robust Machine Learning


    Robustness, in computer science, generally refers to the ability of a software-reliant
    system to continue working over a long period of time and to do so consistently
    with its specifications, despite the presence of internal and external failures
    (e.g., faulty inputs). Although different forms of robustness in the context of
    machine learning could be considered, in this book we consider the specific aspect
    of model training. In particular, by robustness of a machine learning system,
    we refer to the ability of training accurate models—despite bad data and malfunctioning
    machines. We focus specifically on the optimization procedure that training a
    machine learning model encompasses. We present a set of methods that make this
    optimization procedure reliable, despite unreliable data sources and computing
    machines.


    Here, a question is in order: How can we build a robust machine learning scheme
    if we cannot trust either the data or the machines? Clearly, if the entire data
    are bad and all the machines are corrupted, then no learning can be achieved.
    We assume that a fraction of the data is good and that a fraction of the machines
    function correctly. But, unlike most work in classic machine learning, we consider


    ¹ These anomalies are not due to malicious intent, but due to poor training. Nevertheless,
    they illustrate just how dangerous a mistake can be when we carelessly apply machine
    learning models to real-life situations.'
