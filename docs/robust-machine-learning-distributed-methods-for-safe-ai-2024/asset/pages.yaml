    in DMGD yields a training error $\epsilon \in O_T\left(\sqrt{\frac{\sigma^2}{b(n-f)T}}+\kappa\frac{\sigma^2}{b}+\kappa\zeta\right)$
    in the non-convex case, and $\epsilon \in O_T\left(\frac{\sigma^2}{(n-f)T}+\kappa\sigma^2+\kappa\zeta\right)$
