    $$\mathcal{H} := \left\{ \mathbf{x} \mapsto h_{\boldsymbol{\theta}}(\mathbf{x})
    := h_{\boldsymbol{\vartheta}_N}^{(N)} \circ \dots \circ h_{\boldsymbol{\vartheta}_1}^{(1)}(\mathbf{x})
    \mid \boldsymbol{\vartheta}_i \in \Theta_i, \forall i \in [N] \right\} . \tag{2.6}$$


    The parameter space of this hypothesis class is given by $\Theta := \Theta_1 \times
    \dots \times \Theta_N$.

    As we explained in the case of binary classification with linear models, we can
