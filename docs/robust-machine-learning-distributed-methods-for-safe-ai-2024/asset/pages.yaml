    # ## 5.3 Order-Optimal Training Error


    We presented above two meta schemes, specifically *nearest-neighbor mixing* and
    *bucketing*, to address suboptimal robustness of some of the aggregation rules
    presented in Chap. 4. In this section, we first highlight that (for large enough
    batch-size $b$ and the number of iterations $T$) incorporating these methods in
    robust DMGD yields a training error in $\epsilon \in O_\star\left(\frac{f}{n}\xi\right)$.
    Then, we show that this error is unavoidable under the set of assumptions we consider,
    especially the gradient dissimilarity assumption (i.e., Assumption 4.1), hence
    making the algorithm order optimal in terms of robustness against adversarial
    nodes.


    # ### 5.3.1 Upper Bound on the Training Error


