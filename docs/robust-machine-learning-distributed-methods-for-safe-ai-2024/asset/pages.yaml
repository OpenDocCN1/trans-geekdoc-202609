  md: '# 4.1.1 Fragility of Distributed Gradient Descent


    The main point of vulnerability of distributed gradient-descent methods is the
    *averaging operation* at the server in the global phase (see Algorithm 4). Basically,
    if a node $i \in [n]$ is adversarial, then the estimate of the local gradient
    $\tilde{\mathbf{g}}_i^{(t)}$ sent by node $i$ to the server in the global phase
    of the algorithm need not be a good representation of its true local gradient.
    When $\tilde{\mathbf{g}}_i^{(t)}$ is not computed as per the algorithm originally
    prescribed, the learning procedure could be compromised. Indeed, in the worst-case
    scenario, a single adversarial node can arbitrarily manipulate the outcome of
    the averaging operation in the global phase, which could trivially prevent the
    server from reaching a good machine learning model, as illustrated in Fig. 4.1.
    Note that while in Fig. 4.1 we illustrate the fragility of distributed gradient
    descent considering a small system of only 3 nodes, in practice we could have
    hundreds (or even thousands) of nodes. Surprisingly, even in a system comprising
    a large number of nodes, it is sufficient for a single node to be adversarial
    to severely degrade the performance of conventional distributed gradient descent.


    The very fact that the learning procedure can be arbitrarily manipulated in the
    face of an attack from a malicious entity (as depicted in Fig. 4.1), which can
    either poison the data of a node or take complete control of the node, is quite
    worrisome.


    ![](img/86043981d34dd325adb0d4b75e402b8d_66_0.png)


    **Fig. 4.1** Consider a server-based system architecture comprising 3 nodes. Suppose
    that node 3 is adversarial. If the server implements the distributed mini-batch
    GD (DMGD) algorithm presented in Chap. 3, then at each iteration it computes an
    update by averaging the gradients it receives. At any iteration $t$, if the adversarial
    node 3 sends $\tilde{\mathbf{g}}_3^{(t)} = -\left(\tilde{\mathbf{g}}_1^{(t)} +
    \tilde{\mathbf{g}}_2^{(t)}\right)$, instead of following the procedure defined
    in (3.3), then node 3 can entirely prevent the server from updating the model'
