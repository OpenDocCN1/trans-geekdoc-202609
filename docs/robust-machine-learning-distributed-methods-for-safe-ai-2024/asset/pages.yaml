  md: 'First, no matter how many iterations $T$ we choose to implement, the training
    error cannot be reduced to zero, unlike the original (non-robust) DMGD method.
    Specifically, even when $T \to \infty$, we have a training error of $\varepsilon_\infty
    \in \mathcal{O}_n\left(\frac{f}{n}\frac{\sigma^2}{b} + \frac{f}{n}\xi\right)$.
    The gradient complexity, i.e., computation spent by an honest node for computing
    gradients during the learning procedure, for obtaining an error of $\varepsilon
    + \varepsilon_\infty$ is equivalent to the gradient complexity of the DMGD method
    with $n - f$ nodes and training error $\varepsilon$, i.e., $\mathcal{O}_1\left(\frac{\sigma^2}{(n-f)\varepsilon^2}\right)$.
    Second, by choosing to have a smaller breakdown point, i.e., tolerating smaller
    fraction of adversarial nodes $\frac{f}{n}$, we can improve the asymptotic training
    error $\varepsilon_\infty$. Specifically, the order of the breakdown point is
    linear in training error. In other words, we cannot simultaneously have a higher
    breakdown point and a smaller training error.


    Although we can obtain a much smaller training error by increasing the batch-size
    $b$, e.g., when $b = m$ (i.e., the case of robust DGD), we have an asymptotic
    training error $\varepsilon_\infty \in \mathcal{O}_n\left(\frac{f}{n}\xi\right)$,
    increasing batch-size beyond a certain limit might be prohibitive in practice.
    Interestingly, we can obtain a similar effect without increasing the gradient
    complexity through the use of gradient momentum in the local phase (see Chap.
    6).


    # ### 4.4.3 Case of Strongly Convex Loss Function


    In this section, we analyze the resilience property of Robust DMGD in the case
    when the average loss function for honest nodes is known to be strongly convex.
    Recall, from Sect. 3.2.3, that every strongly convex function satisfies the PL
    condition, but not every function that satisfies the PL condition is strongly
    convex. As done in Sect. 3.2, we assume that the average loss function for the
    honest nodes satisfies the PL inequality. Specifically, we assume that for every
    set $H$ of $n - f$ honest nodes, their average loss function $\mathcal{L}_H$ satisfies
    the following:


    **Assumption 4.2** There exists a real value $\mu$ such that for every set $H$
    comprising $n - f$ honest nodes and for all $\theta \in \mathbb{R}^d$,


    $$\|\nabla \mathcal{L}_H(\theta)\|^2 \geq 2\mu \left(\mathcal{L}_H(\theta) - \mathcal{L}_H^*\right),$$


    where $\mathcal{L}_H^* := \min_{\theta \in \mathbb{R}^d} \mathcal{L}_H(\theta)$.


    Under the above strong convexity assumption, we are able to obtain guarantees
    of resilience for Robust DMGD, owing to the following convergence result. Recall
    that, for a non-empty set $S \subseteq [n]$, we denote by $\mathcal{L}_S$ the
    average loss function of the nodes in $S$, $\mathcal{L}_S^* := \min_{\theta \in
    \mathbb{R}^d} \mathcal{L}_S(\theta)$, and $\mathbb{E}[\cdot]$ denotes the total
    expectation over the randomness in Algorithm 5 over $T$ iterations, i.e., $\mathbb{E}[\cdot]
    = \mathbb{E}_1[\cdots \mathbb{E}_T[\cdot]]$.


    **Theorem 4.2** Suppose Assumptions 3.1, 3.2, 4.1, and 4.2. Consider an iteration
    $t$ of the Robust DMGD algorithm with batch-size $b \in [1, m)$ and learning rate
    $\gamma_t \leq \frac{1}{4T}$.'
