    than the current generation. Lastly, we want this book to also serve as a corpus
    of results that can be extended and enhanced with new theoretical findings, thus
    advancing the field of safe AI. The content of this manuscript is based in part
    on research papers that have been peer-reviewed in major machine learning conferences.
    We have been working on these methods for over 7 years, from 2016 to 2023. They
    are inspired by distributed computing techniques that have been explored for over
