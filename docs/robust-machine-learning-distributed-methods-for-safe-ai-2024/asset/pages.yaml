    L\boldsymbol{\theta} - L\left(\boldsymbol{\theta} - \frac{f}{n - f}\mathbf{z}\right)
    \right\|^2 \\ &\quad + f \left\| L(\boldsymbol{\theta} - \mathbf{z}) - L\left(\boldsymbol{\theta}
    - \frac{f}{n - f}\mathbf{z}\right) \right\|^2 \\ &= \frac{L^2 \|\mathbf{z}\|^2}{(n
    - f)^2} \left( (n - 2f)f^2 + f(n - 2f)^2 \right) = \frac{f(n - 2f)L^2}{(n - f)}
    \|\mathbf{z}\|^2. \end{aligned}$$


    Hence, we get


    $$\frac{1}{n - f} \sum_{i \in H_2} \left\| \nabla \mathcal{L}_i(\boldsymbol{\theta})
    - \nabla \mathcal{L}_{H_2}(\boldsymbol{\theta}) \right\|^2 = \frac{f(n - 2f)L^2}{(n
    - f)^2} \|\mathbf{z}\|^2 = \zeta.$$


    The above implies that Assumption 4.1 is also satisfied in the second scenario.
    Hence, we conclude that if there exists a distributed algorithm $\Pi$ that is
    guaranteed to be $(f, \varepsilon)$-stationary resilience under Assumptions 3.1
    and 3.2 and 4.1, then by Definition 4.2 the output of $\Pi$, denoted by $\hat{\boldsymbol{\theta}}$,
    should satisfy the condition (4.10) in both the scenarios. Specifically, for an
    $(f, \varepsilon)$-stationary resilient distributed algorithm $\Pi$ with output
    $\hat{\boldsymbol{\theta}}$, we have


    $$\max \left\{ \left\| \nabla \mathcal{L}_{H_1}\left(\hat{\boldsymbol{\theta}}\right)
    \right\|^2, \left\| \nabla \mathcal{L}_{H_2}\left(\hat{\boldsymbol{\theta}}\right)
    \right\|^2 \right\} \leq \varepsilon.$$


    Therefore,


    $$\varepsilon \geq \frac{1}{2} \left( \left\| \nabla \mathcal{L}_{H_1}\left(\hat{\boldsymbol{\theta}}\right)
    \right\|^2 + \left\| \nabla \mathcal{L}_{H_2}\left(\hat{\boldsymbol{\theta}}\right)
    \right\|^2 \right). \quad (5.11)$$


    Substituting the respective values of $\nabla \mathcal{L}_{H_1}(\boldsymbol{\theta})$
    and $\nabla \mathcal{L}_{H_2}(\boldsymbol{\theta})$ in the above, we obtain that


    $$\varepsilon \geq \frac{L^2}{2} \left( \left\| \hat{\boldsymbol{\theta}} \right\|^2
    + \left\| \hat{\boldsymbol{\theta}} - \frac{f}{n - f}\mathbf{z} \right\|^2 \right)
    \geq \frac{L^2}{4} \left\| \frac{f}{n - f}\mathbf{z} \right\|^2 = \frac{f}{4(n
