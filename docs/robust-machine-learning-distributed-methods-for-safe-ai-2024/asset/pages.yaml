    iteration $t \ge 1$, given the current model $\theta_t$, update the vector to


    $$\theta_{t+1} := \theta_t - \gamma_t \nabla \mathcal{L}(\theta_t),$$


    where $\gamma_t$ is a positive real value referred to as the *learning rate* at
    iteration $t$.

