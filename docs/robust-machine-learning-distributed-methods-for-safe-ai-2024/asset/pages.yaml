    # **Applying the Analysis to Robust DSGD and Robust DGD**


    The robustness analysis presented above applies immediately to robust DSGD (i.e.,
    Algorithm 5 with batch-size $b=1$) by simply substituting $b=1$ in Theorem 4.1
    and Corollary 4.1. In the case of robust DGD, i.e., DGD with robust aggregation
    in the global phase, we do not have gradient noise. Upon substituting $\sigma
    = 0$, and $\gamma$ to be any constant less than $\frac{1}{4L}$, in Theorem 4.1,
    we deduce that robust DGD is $(f, \varepsilon)$-stationary resilient with $\varepsilon
    \in \mathcal{O}_T\left(\frac{1}{T} + \kappa\zeta\right)$, where $\kappa \in \mathcal{O}_n(1)$
    when using CWMed, GeoMed, or Krum as the aggregation rule and $\kappa \in \mathcal{O}_n\left(\frac{f}{n}\right)$
    when using CWT$M_f$ as the aggregation rule. Expectedly, in contrast to Robust
    DMGD, when implementing robust DGD, the gradient computation noise does not contribute
    to the incompressible training error. However, the cost of computing an actual
    gradient on the whole training sample is quite prohibitive in practice. An efficient
    alternative to robust DGD, for diminishing the impact of noise on training error,
    is to incorporate gradient momentum in Robust DMGD. This scheme is presented later
    in Chap. 6.


