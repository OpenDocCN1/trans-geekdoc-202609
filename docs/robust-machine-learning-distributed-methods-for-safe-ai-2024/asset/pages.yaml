    $|S| = n - q$. In the following, for every $j \in [n]$, we denote by $N_j$ the
    set of indices of $n - q$ nearest neighbors of $\mathbf{v}_j$ in $\{\mathbf{v}_1,
    \dots, \mathbf{v}_n\}$, with ties arbitrarily broken. Observe that this implies,
    for all $j \in [n]$, that


    $$\sum_{i \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2 \leq \sum_{i \in S} \|\mathbf{v}_j
    - \mathbf{v}_i\|^2. \tag{C.7}$$


    Let $k^* \in [n]$ be the index chosen by $\mathrm{Krum}_q$, i.e., $k^* \in \operatorname*{argmin}_{j
    \in [n]} \sum_{i \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2$. Therefore, due to
    (C.7), we have


    $$\sum_{i \in N_{k^*}} \|\mathbf{v}_{k^*} - \mathbf{v}_i\|^2 = \min_{j \in [n]}
    \sum_{i \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2 \leq \min_{j \in S} \sum_{i
    \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2$$


    $$\leq \frac{1}{|S|} \sum_{j \in S} \sum_{i \in N_j} \|\mathbf{v}_j - \mathbf{v}_i\|^2
    \leq \frac{1}{|S|} \sum_{j \in S} \sum_{i \in S} \|\mathbf{v}_j - \mathbf{v}_i\|^2.
    \tag{C.8}$$


    Note that


    $$\sum_{j \in S} \sum_{i \in S} \|\mathbf{v}_j - \mathbf{v}_i\|^2 = \sum_{i,j
