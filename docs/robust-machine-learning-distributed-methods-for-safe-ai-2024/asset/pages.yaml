  md: 'of presentation and pedagogical purposes, we make some simplifications in this
    chapter. For this reason, the presented algorithm could be considered impractical.
    We revisit these simplifications in the following chapters.


    In Chap. 5, we focus on minimizing the training error in the presence of adversarial
    machines. We first discuss the potential limitation of robustness due to *gradient
    dissimilarity*, an artifact of *heterogeneity* in data held by the nodes. We then
    show that many robust aggregation rules, though they can provide the optimal breakdown
    point, yield a suboptimal training error under gradient dissimilarity. We present
    the technique of *pre-aggregation* that circumvents this shortcoming and achieves
    optimality.


    In Chap. 6, we focus on gradient complexity in robust machine learning. Although
    a composition of a robust aggregation rule with pre-aggregation yields order-optimal
    training errors, the resulting gradient complexity can be orders of magnitude
    higher than a traditional (non-robust) machine learning algorithm. This could
    greatly discourage the use of these robustness schemes. We highlight the important
    role of *gradient momentum at local level* in regulating the gradient complexity,
    thereby rendering robust machine learning more practical.


    # 1.4 Chapter Notes


    In this chapter, we have briefly recalled the evolution of machine learning: from
    the idea of artificial intelligence [16, 25, 26] to building machines that can
    play cognitive games [2, 9, 12, 24] to utilizing machines in healthcare [6, 10].
    Modern machine learning systems, such as ChatGPT [3], derive their power from
    large-scale complex models that are trained over vast amounts of data. These automated
    systems are critically shaping the course of modern society, with applications
    ranging from healthcare to military [7, 11, 15, 18, 20, 22]. There is no denying
    that machine learning is rapidly transforming the realm of information technology,
    touching almost every aspect of our lives[14]. Although these changes could significantly
    improve the quality of life in general and might even help us find ways to fight
    against emerging global issues, such as climate change [21], they should be used
    with a great amount of caution.


    We have highlighted that the classic machine learning algorithms, especially those
    proposed for developing large-scale models, are not robust to the challenges prevalent
    in real-world scenarios, specifically the element of *corruption*. It has been
    shown that the effectiveness of machine learning schemes can become highly compromised,
    when either the training data are adulterated or when some machines malfunction
    during the training procedure [1, 4, 5, 8, 13, 23, 27]. Using such *poorly trained*
    models in public-oriented applications could have severe consequences [17, 19].
    Protecting machine learning systems against corrupted data and malfunctioning
    machines, thereby paving the path to *safe AI*, was our key motivation in developing
    the *robust machine learning* methods we present in this book.'
