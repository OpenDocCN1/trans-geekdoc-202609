    gradient computations. In addition to these qualities, in robust machine learning
    we also want the algorithm to tolerate as many number of adversarial nodes as
    possible. We can formalize these three elements of robust machine learning, using
    the notion of resilience introduced above. For simplicity, in the following we
    assume that the loss function $\mathcal{L}_H$ is convex. The formalism extends
    immediately to the non-convex case,'
