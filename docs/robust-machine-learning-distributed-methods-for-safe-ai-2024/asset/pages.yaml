    (\mathbf{v}_k - \mathbf{v}_j) + |N_i \setminus N_j| (\mathbf{v}_i - \mathbf{v}_j)
    \right\|$


    Due to the triangle inequality, we obtain that


    $\|\mathbf{z}_i - \mathbf{z}_j\| \le \frac{1}{n - f} \left( \sum_{k \in N_i \setminus
    N_j} \|\mathbf{v}_k - \mathbf{v}_i\| - \sum_{k \in N_j \setminus N_i} \|\mathbf{v}_k
    - \mathbf{v}_j\| + f \|\mathbf{v}_i - \mathbf{v}_j\| \right)$


    As $N_i$ represents $n - f$ input vectors closest to $\mathbf{v}_i$ and $|H| =
    n - f$, for all $k \in N_i$, we have $\|\mathbf{v}_k - \mathbf{v}_i\| \le \max_{k
    \in H} \|\mathbf{v}_k'' - \mathbf{v}_i\| = \|\mathbf{v}_j - \mathbf{v}_i\|$. Similarly,
    for all $k \in N_j$, we have $\|\mathbf{v}_k - \mathbf{v}_i\| \le \|\mathbf{v}_j
    - \mathbf{v}_i\|$. Using this above, we get


    $\|\mathbf{z}_i - \mathbf{z}_j\| \le \frac{3f}{n - f} \|\mathbf{v}_i - \mathbf{v}_j\|$


    This suggests that when $f$ is small enough, specifically when $\frac{3f}{n -
    f} < 1$, the separation between the set of vectors $\{\mathbf{z}_i, i \in H\}$
    might be smaller than that of the original vectors $\{\mathbf{v}_i, i \in H\}$.
    The above intuition is further refined below, in Sect. 5.1.2, to prove that NNM
    reduces the robustness coefficient, hence amplifies the robustness, of a robust
    averaging.


    # 5.1.2 Robustness Amplification


    In this section, we analyze the robustness amplification property of NNM. We show
    that the composition of NNM with an $(f, \kappa)$-robust rule $F$ results in a
    new aggregation rule $F'' := F \circ \text{NNM}$ that has an improved robustness
    coefficient compared to $F$. The analysis proceeds in two steps. First, we obtain
    a generic result, in Lemma 5.1, that relates the empirical variance of the vectors
    NNM outputs to the variance of the input vectors. Then, we build upon this result,
    in Theorem 5.1, to precisely characterize the robustness amplification property
    of NNM.'
