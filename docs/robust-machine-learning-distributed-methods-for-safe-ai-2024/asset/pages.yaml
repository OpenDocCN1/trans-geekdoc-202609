  md: 'sub-sampling) in the training error when dealing with adversarial nodes. Lastly,
    we show that the use of *Polyak''s momentum* in the local computations at the
    nodes'' end diminishes the effect of gradient noise in the training error, thereby
    conferring more practicality to robust machine learning schemes. We highlight
    the interaction between the three essential elements of robust machine learning:
    *breakdown point*, *training error*, and *gradient complexity*. Note that, in
    addition to discussing robustness, in this book, we also present pedagogical analyses
    of the convergence of gradient-descent algorithms, which arguably form the backbone
    of machine learning, in both (strongly) convex and non-convex regimes. Beyond
    standard convergence techniques, in the latter part of the book, we also present
    the technique of Lyapunov analysis for studying convergence. All the proofs presented
    are self-contained and present a complete reasoning behind the results discussed
    throughout the book.


    **Remark 1.2** This book does not address the question of *privacy*: the way a
    server can learn an accurate model while ensuring that the data held by each node
    remain private. We also do not address notions of robustness that do not pertain
    to the optimization procedure of the training phase, such as *evasion attacks*
    (a.k.a. robustness to *adversarial examples*) or robustness to distribution shift.
    These problems, although primary in studying the safety of AI systems, are (in
    general) orthogonal to the problem that we consider.


    # 1.3.2 Organization


    In Chap. 2, we recall the basics of machine learning. We focus on presenting a
    clear problem statement. We introduce fundamental optimization tools that are
    needed to understand the robustness issue in the training phase. Notably, we recall
    relevant notions such as supervised machine learning, empirical risk minimization,
    surrogate loss functions (stochastic/mini-batch), gradient-descent methods, and
    gradient complexity.


    In Chap. 3, we explain our (server-based) machine learning framework and introduce
    a few distributed gradient-descent methods. Specifically, we explain the underlying
    principle of distributed (stochastic) gradient descent by analyzing in detail
    the cases of non-convex, as well as strongly convex training loss functions. We
    derive gradient complexities in both cases and present mathematical tools that
    lay the foundation for the subsequent chapters.


    Chapter 4 is a primer on our concept of robustness in machine learning. We first
    highlight the fragility of current machine learning schemes, before presenting
    the central notion of robust aggregation. In the chapter, we introduce a precise
    metric for robustness, through the complementary notions of *breakdown point*,
    *training error*, and *gradient complexity*. These notions are then illustrated
    through a robust variant of distributed mini-batch gradient descent that replaces
    the linear aggregation at the server (i.e., averaging) with a non-linear robust
    aggregation rule. For ease'
