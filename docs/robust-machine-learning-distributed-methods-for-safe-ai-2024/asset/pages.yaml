    $\mathrm{Krum}_q$ *is* $(q, \kappa)$*-robust with* $\kappa = 6 \left(1 + \frac{q}{n-2q}\right)$.


    ***Proof*** Let $n \in \mathbb{N}^*$, $q < \frac{n}{2}$, and $\mathbf{v}_1, \dots,
