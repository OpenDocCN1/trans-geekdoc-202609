- pgno: 21
  md: 'a scenario where a fraction of the data can be bad and a fraction of the machines
    can malfunction. We consider a general framework that encompasses many modern
    machine learning schemes: the so-called *server-based* architecture. Essentially,
    a single machine (i.e., the server) is given the responsibility of maintaining
    the model. The server updates the parameters of the model by using information
    provided by other machines known as nodes. These node machines host the data.
    Periodically, in order to provide new information for improving the model, the
    server broadcasts the current parameters of the model to all the nodes so that
    each node can test the model on its data. This methodology is sometimes referred
    to as (server-based) *federated learning*. We present, in this book, techniques
    for ensuring that the optimization procedure run by the server succeeds, even
    if some of the nodes do not function properly.


    # **How to Know If the Training Succeeded?**


    Another fundamental question is in order: *What is a successful training procedure
    if some of the nodes are corrupted, e.g., their data are incorrect?* Intuitively,
    an accurate model is one that is generated based on only the fraction of correct
    machines. Then, a robust training method will be considered as successful if it
    manages to ignore the incorrect machines and data. Of course, this task would
    be easy if we know which machines are incorrect in advance. The server would simply
    disregard the information they provide. The challenge is that, in practice, all
    the machines initially function correctly, until some unknown time beyond which
    some machines would begin deviating from their correct behavior. Furthermore,
    this deviation might not be easy to detect, as the server would not be able to
    distinguish the differences from the information provided by the node, which are
    due to heterogeneous data, from differences that are due to the misbehaving nodes.


    The above discussion brings us to the next question: *What does it really mean
    for a machine to malfunction?* To achieve genuine robustness, we consider that
    the notion of a malfunction can be very general. In short, we assume that some
    of the machines (nodes) can return arbitrarily bad information to the server.
    In the parlance of distributed computing, these machines can be called *Byzantine*.
    This way of modeling the misbehavior of some nodes is general, in the sense that
    it encompasses many cases: corrupted data at the node level, a software or hardware
    bug, and even the situation where the machine has been hacked by a malicious party.
    In fact, it is convenient to view the design of a robust machine learning technique
    as a *game* against an adversary that controls a fraction of the machines and
    their data. Machines controlled by the adversary are called *adversarial* nodes.
    This adversary is free to choose the best possible strategy, and a robust machine
    learning scheme should strive for an accurate model regardless of the adversary’s
    strategy.


    **Remark 1.1** Although the terminology and general adversarial (i.e., Byzantine)
    abstraction we consider are inspired by classic distributed computing, the settings
    are different. In classic distributed computing, it is typical to ensure the robustness
    of an application by *replicating its state* on several machines. The clients
    of the service then use some *consensus-based* communication primitive to update,
    in the same order, the state of the application on the correct replicas, and they
    return a'
