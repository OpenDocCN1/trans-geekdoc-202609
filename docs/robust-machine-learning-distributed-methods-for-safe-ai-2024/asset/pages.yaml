  md: '# Stationary Resilience by Implementing Algorithm 6


    Let $\Delta_H$ be a real value such that $\mathcal{L}_H(\boldsymbol{\theta}_1)
    - \mathcal{L}_H^* \leq \Delta_H$. Then, the upper bound obtained in Theorem 6.1
    reduces to the following:


    $$\frac{1}{T} \sum_{t=1}^{T} \mathbb{E} \left[ \|\nabla \mathcal{L}_H(\boldsymbol{\theta}_t)\|^2
    \right] \leq \frac{9\Delta_H}{\gamma T} + 576L \frac{\sigma^2}{b} \left( 3\kappa
    + \frac{1}{n-f} \right)\gamma + 36\kappa\zeta. \quad (6.43)$$


    We note that the above upper bound attains its minimum value for learning rate
    $\gamma$ that solves the following equation:


    $$\frac{9\Delta_H}{\gamma T} = 576L \frac{\sigma^2}{b} \left( 3\kappa + \frac{1}{n-f}
    \right)\gamma .$$


    That is to say, assuming $\sigma > 0$, an optimal choice for the learning rate
    is given by


    $$\gamma = \frac{1}{8}\sqrt{\left( \frac{n-f}{3\kappa(n-f)+1} \right) \frac{\Delta_H
    b}{\sigma^2 LT}} . \quad (6.44)$$


    In light of the above observation, we obtain the following corollary of Theorem
    6.1.


