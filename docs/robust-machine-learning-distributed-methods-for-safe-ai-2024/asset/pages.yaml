    # 2.2 Standard Optimization Algorithms


    We now turn our attention to the numerical technique of *gradient descent* for
    solving the ERM problem defined in (2.8). The gradient-descent methods, and their
    derivatives, represent the most widely used optimization algorithms in machine
    learning. These methods are iterative algorithms that all rely on the same guiding
    principle: At each iteration, the model parameters are updated as per a suitable
    *descent direction* of the empirical loss function. One such descent direction
    is determined by the *gradient* of the loss function $\mathcal{L}$, which we denote
    by $\nabla \mathcal{L}$. Specifically, updating the model parameters $\boldsymbol{\theta}
    \in \mathbb{R}^d$ along a vector facing negatively to the loss gradient, e.g.,
    $-\nabla \mathcal{L}(\boldsymbol{\theta}) \in \mathbb{R}^d$, decrements the loss
    function.


    # Why the Gradient?


    A good justification for using $-\nabla \mathcal{L}(\boldsymbol{\theta})$ as a
    descent direction is given by Taylor''s theorem. According to this theorem, the
    change in the value of a differentiable function is linear in the change of the
    function''s arguments, if the latter is sufficiently small. Moreover, the linear
    (or *first-order*) coefficient is given by the gradient of the function. Specifically,
    suppose that the current model parameters are given by $\boldsymbol{\theta} \in
    \mathbb{R}^d$. We would like to update the model parameters, say to $\boldsymbol{\theta}''$,
    with a smaller loss. By first-order Taylor polynomial approximation of function
    $\mathcal{L}$, we have


    $\mathcal{L}(\boldsymbol{\theta}'') = \mathcal{L}(\boldsymbol{\theta}) + \langle
    \nabla \mathcal{L}(\boldsymbol{\theta}), \boldsymbol{\theta}'' - \boldsymbol{\theta}
    \rangle + \psi\left( \boldsymbol{\theta}'' - \boldsymbol{\theta} \right), \qquad
    (2.9)$


    where $\psi\left( \boldsymbol{\theta}'' - \boldsymbol{\theta} \right)$ is a function
    of $\boldsymbol{\theta}'' - \boldsymbol{\theta}$ that is negligible when $\|\boldsymbol{\theta}''
    - \boldsymbol{\theta}\|$ is small. Specifically, $\frac{\psi(\boldsymbol{\theta}''
    - \boldsymbol{\theta})}{\|\boldsymbol{\theta}'' - \boldsymbol{\theta}\|} \to 0$
    as $\|\boldsymbol{\theta}'' - \boldsymbol{\theta}\| \to 0$. Then, choosing $\boldsymbol{\theta}''
    = \boldsymbol{\theta} - \gamma \nabla \mathcal{L}(\boldsymbol{\theta})$, where
    $\gamma$ is a positive real value, from (2.9), we have


    $\mathcal{L}(\boldsymbol{\theta}'') = \mathcal{L}(\boldsymbol{\theta}) - \gamma
    \|\nabla \mathcal{L}(\boldsymbol{\theta})\|^2 + \psi\left( \gamma \nabla \mathcal{L}(\boldsymbol{\theta})
    \right).$


    Then, due to the fact that $\frac{\psi(\gamma \nabla \mathcal{L}(\boldsymbol{\theta}))}{\gamma
    \|\nabla \mathcal{L}(\boldsymbol{\theta})\|} \to 0$ as $\gamma \|\nabla \mathcal{L}(\boldsymbol{\theta})\|
    \to 0$, for sufficient small $\gamma$, we have $\mathcal{L}(\boldsymbol{\theta}'')
    \leq \mathcal{L}(\boldsymbol{\theta})$. The inequality can be made strict when
    $\|\nabla \mathcal{L}(\boldsymbol{\theta})\| > 0$.'
