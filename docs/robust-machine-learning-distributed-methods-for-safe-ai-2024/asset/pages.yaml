    # System Architectures


    Two main types of distributed system architecture have been considered: *server-based*
    and *peer-to-peer*. We illustrate the two architectures in Fig. 3.1. In the server-based
    architecture, the nodes collaborate through the means of a central coordinator
    commonly referred to as the server, sometimes called the *parameter server*. Note
    that the server can also be considered as an abstraction of a cluster of several
    machines that communicate with the nodes. In the peer-to-peer architecture, the
    nodes collaborate by communicating directly with each other, on a given network
    topology. Note that, when $n = 1$, both the peer-to-peer and the server-based
    architectures can easily be reduced to the centralized case.\footnote{For the
    server-based architecture, reducing the problem to the centralized setting when
    $n=1$ requires merging the server and the node into a single machine.} Accordingly,
    all the results we present in the remainder of this chapter immediately extend
    to the centralized setting. In the subsequent section, we present the simplest,
    and perhaps the most natural, distributed implementation of mini-batch GD in the
    server-based architecture. This implementation also easily extends to that of
    distributed GD and of distributed SGD.


    **Remark 3.2** Throughout the rest of the book, we mainly focus on the server-based
    architecture, owing to its wider utility in practical systems. Some discussion
    and references pertaining to the peer-to-peer architecture can be found in the
    chapter notes of Chaps. 3, 4, and 5.


    ![](img/86043981d34dd325adb0d4b75e402b8d_46_0.png)'
