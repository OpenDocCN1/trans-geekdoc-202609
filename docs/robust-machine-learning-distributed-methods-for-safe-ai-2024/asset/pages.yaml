    $(0,0) \in \mathbb{R}^d \times \mathbb{R}^d$, i.e., the probability of sampling
    $(0,0)$ according to $\mathcal{D}_i$ is 1. Furthermore, suppose that $\mathcal{D}_i$
    for node $i \in \{n-f+1,\ldots,n-f\}$ is a Dirac delta distribution at $({\bf
    z}, {\bf z})$, where ${\bf z} \in \mathbb{R}^d$ is such that


    $$\|{\bf z}\|^2 = \frac{(n-f)^2}{f(n-2f)L^2}\zeta.$$


    By definition of the above distributions, it is also easy to check that Assumption
    3.2 also holds true, with the covariance trace $\sigma^2 = 0$. Next, we will consider
    two possible scenarios. In the first scenario, the set of honest nodes is $H_1
    = \{1,\ldots,n-f\}$. In the second scenario, the set of honest nodes is $H_2 =
    \{f+1,\ldots,n\}$. Observe that in the first scenario, as all the local loss functions
    are identical to $\mathcal{L}_{H_1}(\boldsymbol{\theta}) := \frac{L}{2}\|\boldsymbol{\theta}\|^2$,
    the gradient dissimilarity is zero, i.e., Assumption 4.1 is trivially satisfied.
    In the second scenario, observe that the local loss function $\mathcal{L}_i(\boldsymbol{\theta})
    = \frac{L}{2}\|\boldsymbol{\theta}\|^2$ for all $i \in \{f+1,\ldots,n-f\}$, and
    $\mathcal{L}_i(\boldsymbol{\theta}) = \frac{L}{2}\|\boldsymbol{\theta}-{\bf z}\|^2$
    for all $i \in \{n-f,\ldots,n\}$. Thus,


    $$\mathcal{L}_{H_2}(\boldsymbol{\theta}) := \frac{L}{2(n-f)}\left((n-2f)\|\boldsymbol{\theta}\|^2
    + f\|\boldsymbol{\theta}-{\bf z}\|^2\right).$$


    Therefore, for all $\boldsymbol{\theta}$, we have


    $$\nabla\mathcal{L}_{H_2}(\boldsymbol{\theta}) = L\left(\boldsymbol{\theta} -
    \frac{f}{n-f}{\bf z}\right).$$


