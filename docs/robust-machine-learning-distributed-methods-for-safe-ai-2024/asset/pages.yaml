  md: 'Computing the full gradient of $\mathcal{L}$, at each step $t$ of the algorithm,
    involves computing $m$ different gradients for the parameter $\boldsymbol{\theta}_t$.
    In modern machine learning, the training sample $\mathcal{S}$ is often very large
    and cannot be processed entirely at every step of the learning procedure. The
    most standard way to circumvent this limitation is through the celebrated stochastic
    gradient-descent (SGD) algorithm.


    # Stochastic Gradient Descent


    The rationale of SGD is to reduce the cost of gradient computations by using only
    one element of the training sample at a time. As described in Algorithm 2, SGD
    minimizes the loss function $\mathcal{L}$ using *stochastic estimates* of the
    gradient $\nabla\mathcal{L}$.


    # Algorithm 2 Stochastic gradient descent (SGD)


    The initialization step is identical to GD. In each iteration $t \ge 1$, and given
    a current model $\boldsymbol{\theta}_t$, compute a stochastic estimate $\mathbf{g}_t$
    of the gradient $\nabla\mathcal{L}(\boldsymbol{\theta}_t)$. Specifically, $\mathbf{g}_t
    := \nabla_{\boldsymbol{\theta}} \ell\big(h_{\boldsymbol{\theta}_t}(\mathbf{x}),
    y\big)$, where $(\mathbf{x}, y)$ is drawn uniformly at random from the training
    sample $\mathcal{S}$. Upon computing $\mathbf{g}_t$, update the current model
    parameters $\boldsymbol{\theta}_t$ to $\boldsymbol{\theta}_{t+1} := \boldsymbol{\theta}_t
    - \gamma_t \mathbf{g}_t$, where $\gamma_t$ is the *learning rate* at iteration
    $t$.


    # Mini-batch Gradient Descent


    Stochastic gradient estimation, while it enhances the practicality of the optimization
    algorithm, creates other issues due to concomitant *noise* in gradient computations.
    The algorithm can yield large numerical uncertainties when gradient noise is large,
    especially when the optimization problem being solved (i.e., the ERM problem in
    our case) is *ill-conditioned*. A natural way to reduce gradient noise is to sample
    multiple elements from $\mathcal{S}$ at a time, instead of just one. This is the
    driving principle behind the mini-batch gradient-descent (mini-batch GD) method,
    described in Algorithm 3.


    # Algorithm 3 Mini-batch gradient descent (mini-batch GD)


    The initialization step is identical to GD. In each iteration $t \ge 1$, given
    a current model $\boldsymbol{\theta}_t$, sample a batch of elements $S_t$ uniformly
    at random from $\mathcal{S}$ (without replacement), and compute an estimate $\mathbf{g}_t$
    of $\nabla\mathcal{L}(\boldsymbol{\theta}_t)$ as follows: $\mathbf{g}_t := \frac{1}{|S_t|}
    \sum_{(\mathbf{x},y)\in S_t} \nabla_{\boldsymbol{\theta}} \ell\big(h_{\boldsymbol{\theta}_t}(\mathbf{x}),
    y\big).$ (2.10) Then, update the model parameters similarly to SGD, i.e., obtain
    $\boldsymbol{\theta}_{t+1} := \boldsymbol{\theta}_t - \gamma_t \mathbf{g}_t$,
    where $\gamma_t$ is the *learning rate* at iteration $t$.'
