  md: 'to guarantee robust averaging, it is however necessary. The essential nature
    of this consistency is demonstrated below through means of an example.


    Consider a specific federated machine learning setting, where all the nodes a
    priori hold the same training samples; hence, the average loss function for the
    honest nodes is identical to each of their local loss functions. Suppose that
    the loss function has a unique critical point that can be found efficiently. In
    this particular setting, we can easily obtain the optimal point of the honest
    average loss function, i.e., L_H, as long as the adversarial nodes are in minority.
    The solution is as follows. At each step of the learning procedure, each honest
    node computes the (full-batch) gradient of its local loss function and sends it
    to the server. Then, because the honest nodes are in majority and all send the
    same gradient at each step, the server can use the gradient sent by the majority
    of the nodes to do the global update. This procedure essentially reduces to gradient
    descent, which will converge to the critical point of the loss function. Note,
    however, that we cannot replicate this solution if we use an aggregation rule
    F that does not comply with the majority rule. This is simply because, even when
    the current model θ_t maintained by the server in an iteration t is optimal, i.e.,
    the gradient g_t^(i) sent by each honest node i ∈ H is equal to the zero vector,
    the aggregate ĝ_t = F( g_t^(1), ..., g_t^(n) ) need not equal the zero vector
    and the server might move away from θ_t to a suboptimal point. Such a trivial
    divergence from the optimal point does not occur if the aggregation respects the
    majority rule.


    In short, implementing an aggregation rule that does not respect the majority
    rule enables the adversarial nodes to prevent the server from producing a critical
    (or an optimal) point of the honest average loss function.


