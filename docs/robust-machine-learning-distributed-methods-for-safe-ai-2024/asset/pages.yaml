  md: 'where the expectation in the above is also applied over the choice of $\hat{\theta}$,
    i.e., $\mathbb{E}[\cdot] = \mathbb{E}_{\hat{\theta}}[\mathbb{E}_{1}[\cdots\mathbb{E}_{T}[\cdot]]]$.
    This shows that the primary advantage of DMGD over its centralized counterpart
    is its increased computational efficiency. Indeed, to obtain the same convergence
    guarantees as its centralized counterpart, DMGD divides the gradient complexity,
    i.e., the computation cost for computing the total gradients, of each node by
    the total size of the system $n$. Specifically, for training error of $\varepsilon$,
    i.e., $\mathbb{E}\left[\left\|\nabla\mathcal{L}(\hat{\theta})\right\|^{2}\right]
    \leq \varepsilon$, DMGD uses $T \in O_{\frac{1}{\varepsilon}}\left(\frac{\sigma^{2}}{n
    b \varepsilon^{2}}\right)$ iterations in contrast to $O_{\frac{1}{\varepsilon}}\left(\frac{\sigma^{2}}{b
    \varepsilon^{2}}\right)$ iterations used by mini-batch GD. This makes sense intuitively
    because when every node computes $b$ point-wise gradients, the whole system effectively
    computes $n b$ point-wise gradients, which should expedite the learning procedure,
    i.e., reduce the total iterations needed to ensure the desired training error.
    In short, implementing DMGD in the server-based setting is equivalent to running
    mini-batch GD with batch-size $n b$ in a centralized environment, i.e., in a system
    with one node doing all the computations. By reducing the gradient computational
    workload for each node, DMGD makes training of large complex models efficient.


    # 3.2.3 Strongly Convex Loss Functions


    We now turn our attention to the strongly convex case, i.e., when the loss function
    $\mathcal{L}$ is a priori known to be strongly convex. As we previously observed
    in Chap. 2, although studying a non-convex function is more general and holds
    true for a larger set of learning problems, taking a look at strongly convex functions
    enables us to obtain faster convergence rates and provides guarantees directly
    on the suboptimality gap, i.e., the value of the loss function, instead of its
    gradient''s norm. To study the strongly convex case, in this book, we consider
    a class of functions that is slightly more general than that of strongly convex
    functions. Specifically, we study functions that satisfy the Polyak–Lojasiewicz
    (PL) inequality, stated below.


    **Assumption 3.3 (PL Inequality)** There exists a real value $\mu > 0$ such that
    for all $\boldsymbol{\theta} \in \mathbb{R}^{d}$,


    $$\|\nabla \mathcal{L}(\boldsymbol{\theta})\|^{2} \geq 2\mu \left(\mathcal{L}(\boldsymbol{\theta})
    - \mathcal{L}^{*}\right),$$


    where $\mathcal{L}^{*} := \min_{\boldsymbol{\theta} \in \mathbb{R}^{d}} \mathcal{L}(\boldsymbol{\theta})$.


    The PL inequality is satisfied by all strongly convex functions, i.e., functions
    satisfying condition (2.11). However, this inequality is more general and can
    also be satisfied by some non-convex functions, e.g., see [6]. The following theorem
    considers the case when the loss function $\mathcal{L}$ satisfies Assumption 3.3
    and characterizes the rate of change in the values of the loss function over the
    sequence of the models generated by the DMGD method.'
