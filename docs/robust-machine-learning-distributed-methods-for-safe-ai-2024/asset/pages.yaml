  md: 'Although the objective of $(f,\varepsilon)$-resilience can be achieved when
    the loss function is convex, the optimization guarantee (4.9) is difficult to
    obtain when the loss function $\mathcal{L}_H$ is non-convex (even if all the nodes
    are honest, as discussed in Chap. 3). In the context of gradient-descent methods,
    considering the non-convex case, we aim for a stationary point, i.e., we relax
    resilience to $(f,\varepsilon)$-stationary resilience.


    **Definition 4.2 ((f, ε)-Stationary Resilience)** A distributed algorithm $\Pi$,
    in a server-based architecture, is said to be $(f,\varepsilon)$-stationary resilient
    if, despite the presence of up to $f$ adversarial nodes, $\Pi$ enables the server
    to output $\hat{\theta}$ such that, for every set $H$ comprising $n-f$ nodes that
    correctly follow $\Pi$, the following holds true:


    $$\left\|\nabla \mathcal{L}_H(\hat{\theta})\right\|^2 \leq \varepsilon.$$  \tag{4.10}


    Similar to the non-adversarial setting, when studying randomized algorithms, such
    as DMGD, we relax the deterministic optimization guarantees (4.9) and (4.10) by
    their stochastic variants. Typically, we apply expectation over the randomness
    introduced in the algorithm, e.g., sampling of data points in DMGD by the nodes
    for computing local stochastic gradients.


    **Remark 4.4** It is natural to wonder whether we can obtain $(f,\varepsilon)$-resilience
    (or stationary resilience) for any pair $(f,\varepsilon)$. The answer is no. In
    general, we cannot tolerate a majority of adversarial nodes, i.e., if $f \geq
    \frac{n}{2}$, then we cannot ensure $\varepsilon < \infty$. Furthermore, even
    when $f < \frac{n}{2}$, the training error $\varepsilon$ (over honest nodes’ data)
    can be bounded away from zero. In other words, $\varepsilon$ cannot be arbitrarily
    small, and the lower bound is determined by the *heterogeneity* of the data held
    by the honest nodes. We only consider a particular class of heterogeneity, specifically,
    the *gradient dissimilarity*, introduced shortly in Sect. 4.4. The lower bound
    on $\varepsilon$ under the considered gradient dissimilarity condition is presented
    later in Sect. 5.3.2. We refer the interested reader to papers [20, 26, 32] for
    additional details on robustness limitations in the context of distributed convex
    optimization, which also generally apply to the federated machine learning problem
    we consider.


