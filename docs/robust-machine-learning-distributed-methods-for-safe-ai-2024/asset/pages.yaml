    $$\varepsilon \in \mathcal{O}_T \left( K_{\mathcal{L}_H}\frac{\sigma^2}{(n-f)b}\frac{1}{T}
    + \kappa\left(\frac{\sigma^2}{b} + \zeta\right) \right). \tag{4.36}$$


