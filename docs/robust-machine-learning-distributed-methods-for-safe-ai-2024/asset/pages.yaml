    in DMGD by a composition of a pre-aggregation such as NNM and an $(f,k)$-robust
    averaging, the server can obtain an $\epsilon$-approximate optimal (or stationary)
    model where $\epsilon \in O_{T,n}\left(\frac{f}{n}\left(\frac{\sigma^2}{b}+\zeta\right)\right)$.
