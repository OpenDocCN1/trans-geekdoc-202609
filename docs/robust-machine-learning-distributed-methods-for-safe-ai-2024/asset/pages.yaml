  md: 'comparison with chess is interesting to note. The legal number of chess positions
    is around 10^40, whereas it is over 10^170 in Go, which is much more than the
    10^80 atoms in the observable universe. In fact, if every known atom in the universe
    were itself a universe containing within it 10^80 atoms of its own, the number
    of total atoms would still fall short of the possible legal positions in Go. As
    pointed out earlier, Deep Blue followed human-programmed rules by assigning values
    to possible outcomes of different moves, ranking them based on the advantages
    they would bring to the machine. Go was too complex to explore different possibilities.
    It needed a completely different approach. AlphaGo deduced rules by heavily relying
    on a reinforcement learning policy applied to millions of games where the machine
    basically played against itself. Unlike Deep Blue or Watson, AlphaGo learned to
    get better by itself. This made it very difficult to interpret some of its moves,
    which were surprising to the game experts, but this was revealed to be very successful.


    A few years later, in 2019, poker and bridge also fell into the hands of machine
    learning. This also came as a surprise. Microsoft founder Bill Gates, a keen player,
    considered bridge to be well-protected from this trend. Unlike chess and Go, most
    of the information, especially the cards, is not open and available on the board,
    but hidden from view. A French company, NukkAI, could beat the best bridge players
    by using a neuro-symbolic approach that combines two very different paths to learning.
    The first path makes essentially random choices, following AlphaGo’s strategy.
    The second uses rules, as does Watson. A similar combination, involving random
    choices and searches, enabled Pluribus, a robot developed by Facebook and Carnegie
    Melon University, to beat several poker champions in Las Vegas. The robot not
    only learned to bluff but could also see through bluffs. Surprisingly, Pluribus
    has learned to deal with liars, and to lie itself, a skill attributed to humans
    alone, until now.


    # Applications in Daily Life


    The aforementioned intellectually challenging tasks, namely chess, Jeopardy, Go,
    bridge, and poker, made it possible to experiment with machine learning techniques
    and to illustrate their power. But they were only “games.” Other, more critical,
    challenges were also considered. Machine learning techniques have indeed been
    successful in various domains, such as traffic prediction (e.g., on Google Maps),
    text analysis (e.g., spam e-mail filters), banking/finance (e.g., credit decisions),
    social networking (e.g., recognizing pictures and content recommendations), and
    personal assistance (e.g., Siri and ChatGPT). Furthermore, machine learning is
    foreseen as being the motor of important advances in healthcare, e.g., for the
    identification and diagnosis, through computer vision, of diseases such as skin
    cancers that are difficult to detect during the initial stages. Personalized disease
    prevention and treatment using predictive analytics is also a significant possible
    application. In the same vein, the large amount of data collected from satellites,
    real-time social-media updates, website information, etc., could be used by sophisticated
    machine learning systems to predict epidemics around the world.


    Last but not least, many expect machine learning schemes to be a principled way
    for predicting natural disasters and for finding pragmatic approaches to deal
    with global warming. Virtually every domain of science and engineering can benefit'
