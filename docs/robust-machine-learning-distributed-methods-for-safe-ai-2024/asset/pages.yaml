- pgno: 44
  md: '# Chapter 3

    Federated Machine Learning


    **Abstract** While presenting the basics of machine learning in the previous chapter,
    we assumed that we had access to a training sample $\mathcal{S}$ comprising data
    points that are (independently) drawn from the ground-truth distribution $\mathcal{D}$.
    We did not, however, explicitly mention how this dataset was collected or stored.
    A dominant practice in machine learning for many years has been to collect and
    store *user-generated data* on a single machine, which then uses the data to train
    a model. Although this approach is effective in training accurate models, it raises
    serious *privacy* concerns about the utilization of user data. Furthermore, training
    the model *centrally*, i.e., on a single machine, is becoming increasingly challenging
    due to the growing size of the models and the amount of data involved in modern
    machine learning tasks. To circumvent these limitations, a new paradigm has emerged:
    *federated machine learning*. This learning scheme consists in having several
    machines train a model in collaboration while keeping their data local. The computational
    load is distributed over multiple machines, and users can retain control over
    their local data. This paradigm is also sometimes coined as *collaborative* or
    simply *distributed* learning. In this chapter, we formalize the problem of federated
    machine learning in a server-based framework and present how to adapt gradient-descent
    methods in this context.


    # 3.1 Machine Learning as a Distributed Problem


    In this section, we first present the typical mathematical framework that characterizes
    federated machine learning, which is essentially machine learning on a distributed
    computing architecture. Then, we show how standard gradient-descent methods (such
    as mini-batch GD and, a fortiori, GD, and SGD) can be adapted to solve the federated
    machine learning problem.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "# 3.1.1 Problem Statement\n\nWe consider a system with n machines, hereafter\
    \ referred as nodes, represented by the set [n] := {1, …, n}. These nodes communicate\
    \ either indirectly, through means of a central machine (a.k.a., server), or directly,\
    \ in a peer-to-peer manner, over a network. Each node i has access to m training\
    \ samples represented by set S_i drawn independently from a distribution D_i defined\
    \ over X × Y. The resulting local loss function for each node i, denoted by L_i\
    \ : R^d → R, is given by\n\n```\n$$\\mathcal{L}_i(\\theta) := \\frac{1}{m} \\\
    sum_{(\\mathbf{x},y)\\in S_i} \\ell\\big(h_{\\theta}(\\mathbf{x}), y\\big). \\\
    tag{3.1}$$\n```\n\nThe objective of federated machine learning is to design a\
    \ distributed algorithm that enables each node to compute a common optimal model\
    \ θ* ∈ R^d that minimizes the average loss function for all the nodes, i.e., is\
    \ a solution to\n\n```\n$$\\min_{\\theta\\in\\mathbb{R}^d} \\mathcal{L}(\\theta),\
    \ \\text{ where } \\mathcal{L}(\\theta) := \\frac{1}{n} \\sum_{i=1}^{n} \\mathcal{L}_i(\\\
    theta). \\tag{3.2}$$\n```\n\n# Remark 3.1\n\nFor simplicity, we assume that all\
    \ the nodes have the same number of data points, i.e., m. In general, when nodes\
    \ have a nonuniform number of training samples, instead of minimizing the average\
    \ of their local loss functions, we minimize a weighted average, i.e., Σ_{i=1}^n\
    \ p_i L_i(θ), where p_i's are positive real values such that Σ_{i=1}^n p_i = 1.\
    \ Usually, if each node i has m_i data points, we choose p_i = m_i / Σ_{i=1}^n\
    \ m_i. Although we focus on the minimization of the average loss, the results\
    \ and techniques presented in this book can be easily extended to weighted average\
    \ loss minimization by simply modifying each local loss function L_i to \tilde{L}_i\
    \ = n p_i L_i.\n\n# Comparison to the Centralized Methodology\n\nThe above optimization\
    \ problem can be solved by simply collecting the respective training samples held\
    \ by the nodes at a single machine and then implementing one of the centralized\
    \ machine learning algorithms on the collective training set, e.g., one of the\
    \ gradient-descent methods presented in Sect. 2.2.1. However, this centralized\
    \ approach imposes disproportionate computational workload on a single machine\
    \ and requires nodes to compromise the ownership of their data, which could discourage\
    \ many nodes from participating in the learning procedure. A distributed machine\
    \ learning algorithm, presented shortly in Sect. 3.1.2, can solve the optimization\
    \ problem (3.2) without having the nodes directly share their local training samples.\
    \ Instead, in a federated machine learning approach, a node i is required to share\
    \ only information about its local loss function L_i at a finite number of points\
    \ in the parameter space. Federated learning, however, requires all the nodes\
    \ to coordinate their local actions during the entire learning procedure. This\
    \ is unlike"
  merge: -1
