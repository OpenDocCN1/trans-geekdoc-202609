- pgno: 14
  md: '# Chapter 1

    Context and Motivation


    **Abstract** The history of *artificial intelligence* is deeply related to that
    of *computer science*, in general, and *machine learning*, in particular. In this
    chapter, we give a perspective of the salient points of this history, before discussing
    more precisely the very meaning of computers *learning* to become *intelligent*.
    We then highlight the fragility of current machine learning schemes and the dangerous
    implications of this fragility on many critical applications, before discussing
    the meaning of making such learning *robust*. We conclude the chapter by reviewing
    the content of the book and discussing the intended audience.


    # 1.1 Brief History of Artificial Intelligence


    # 1.1.1 Can Machines Think?


    Alan Turing asked this question in 1950, only a few years after inventing his
    universal machine (that is the model of our modern computer). Turing defined the
    very meaning of *thinking*, through his famous *intelligence test*. Roughly speaking,
    a machine passes the test if a human exchanging text messages with the machine
    cannot tell whether the responses obtained come from the machine or from another
    human. Interestingly, Turing predicted in those days that, at the end of the (twentieth)
    century, “one will be able to speak of machines thinking without expecting to
    be contradicted.” Clearly, Turing was too optimistic. But only about the timeline;
    he was off by only a few decades. In 2023, conversational agents often pass the
    Turing test.


    Around the period of Turing’s work, McCulloch, Pitts, and Wiener proposed the
    first *intelligent* cybernetic system, seeking to reproduce the functioning of
    human intelligence. Their goal was to build a description of human perceptions
    by using electrical circuits and to simulate brain mechanisms based on a formal
    model. Their model paved the way for the idea of a neural network. Concomitantly,
    Claude Shannon proposed a remote-controlled mouse that was able to find its way
    out of a labyrinth while *remembering* its course.


    ![](img/86043981d34dd325adb0d4b75e402b8d_14_0.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'In 1956, John McCarthy and Marvin Minsky hosted a historical meeting: the Dartmouth
    Summer Research Project on Artificial Intelligence (DSRPAI). The goal was to bring
    together top researchers from various fields for an open-ended discussion on *Artificial
    Intelligence (AI)*; the term AI was coined by McCarthy at that very event. However,
    there has never been any agreed definition of the term AI, and the event did not
    produce any concrete results. Yet, this event somehow launched decades of activities
    in various kinds of research called AI. In particular, a year later, the first
    neural network, called the *perceptron*, was designed by Frank Rosenblatt.


    # **What Is AI, Anyway?**


    We define AI as *the ability of a machine to solve a problem that humans believed
    they were the only ones capable of solving*. In other words, we talk about AI
    whenever a machine surprises us by solving a specific task. However, after the
    surprise effect, we cease using this term (at least regarding the specific task).
    This is the case, for example, with the game of chess. When IBM’s Deep Blue beat
    Garry Kasparov, the then reigning world champion, we called that machine an AI.
    Today, even a smartphone is capable of beating all chess world champions, and
    we do not talk about AI anymore for chess. Then came the game of Go, arguably
    more challenging than chess due to the huge number of possible combinations. Again,
    a machine was eventually able to beat the world champion. We talked about AI again,
    but not for long.


    Similarly, a decade ago, no machine was comparable to a human in language or image
    recognition. Today (in 2023), machines arguably compete with humans in both these
    domains. Machines have also become much better at generating images and producing
    language. Currently, e-mails are completed, online texts are translated, videos
    are transcribed, reports are generated, and media outlets are published in an
    automatic manner. Furthermore, recommender systems determine the content we see
    on social media and even the products we buy from online shops. With their capacity
    to generate images and texts, machines are likely creating a large fraction of
    the media we consume.


    Although that which we call AI has evolved over the years, the pragmatic purpose
    remains unchanged: surpassing human capabilities in cognitive tasks such as vision,
    natural language processing, knowledge representation, and reasoning. The initial
    idealistic goal of replicating brain functions has been, however, largely supplanted
    by data-driven methodologies, the so-called *machine learning*.


    # ### *1.1.2 Machine Learning*


    The idea of a machine that learns is as old as computer science is. It dates back
    to the days of Alan Turing. Indeed, he conjectured that *learning* is the key
    to passing his *intelligence test*. In short, Turing explained that it is physically
    impossible for a machine to a priori store (in its memory) all possible cases
    that it might need to deal'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'with in order to perform a challenging task. A more reasonable alternative
    is to have a machine learn from its experience and to adapt. In fact, some form
    of learning was already at the heart of his universal machine, as we explain below.


    Before the universal Turing machine, invented in 1936, there were only specialized
    calculators wherein the algorithm was hardwired into the machine. For example,
    Pascal''s machine was specialized in performing additions, while Leibniz''s machine
    was specialized in multiplications. Although these machines could compute their
    respective operations faster than any human, their utility was limited to the
    operation they were hardwired for, i.e., addition or multiplication. There was
    no way for Pascal''s machine to learn multiplication, or for Leibniz''s machine
    to learn other operations. Whereas, although more slowly than Pascal''s and Leibniz''s
    machines, a human could learn the addition algorithm, then the multiplication
    algorithm (or any other one) eventually performs a wide range of operations. Humans
    in this sense are smarter than machines because of their ability to learn new
    algorithms.


    The very characteristic of a universal Turing machine that makes it smart is also
    its ability to learn new algorithms. Specifically, Turing hardwired into his machine
    a meta-algorithm that executes the inputs and outputs of algorithms provided to
    it as data. Data and algorithms essentially become the same thing. The addition
    and multiplication algorithms become inputs represented in the form of a table
    that can be executed by a Turing machine. It was conjectured that all the algorithms
    can be modeled in the form of a table that could be then executed by a Turing
    machine. Until now, no one has disproved this conjecture. Turing did not witness
    the impact of his universal machine, but many engineers continued his seminal
    work and perfected the development of his machine, until it became the modern
    computer.


    # **A Simple Yet Powerful Principle**


    Interestingly, Turing also anticipated automated forms of learning that goes beyond
    having humans write programs in the form of data (tables) that the machine could
    digest (learn) and then execute. In 1947, Turing gave a public lecture explicitly
    calling for "a machine that can learn from experience" with the "possibility of
    letting the machine alter its own instructions." In a report entitled "Intelligent
    Machinery," which he did not publish, Turing introduced many of the central concepts
    that today we call AI. Many of his ideas were later reinvented by others, such
    as the idea of training a network of artificial neurons to perform specific tasks.
    Essentially, Turing predicted that the learning process would not need human participation.
    Specifically, the data (representing an algorithm) would not be fed to a Turing
    machine by a human as a table (i.e., an executable program), rather the data could
    be absorbed by the machine through a learning program.


    The notion of a learning program is the driving principle behind modern-day machine
    learning. Essentially, machine learning schemes assume a generic model to solve
    the target task, typically based on a mathematical function, and it deduces patterns
    in the available data to make predictions on a priori unseen data. The initial
    model is said to be generic in the sense that it has unspecified parameters, e.g.,
    a function $a_1x + a_2$ where the parameters $a_1$ and $a_2$ are a priori unspecified.
    Deducing patterns, which is commonly referred to as training, is a procedure'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'that consists in computing model *parameters* that optimize a pre-defined *loss
    function*, i.e., to minimize the number of mistakes when applying predictions
    on the data at hand. Model training is often achieved through means of an optimization
    algorithm, such as a *gradient-descent method* that searches efficiently through
    all the possible parameter values. In the case of natural language processing,
    machine learning models, by training on several sentences and combinations of
    words, parse previously unseen sentences or combinations of words to predict a
    new set of words or sentences. In the case of image recognition, machine learning
    models are trained to recognize objects, such as cars or dogs, by training on
    several images with and without the objects. The model can be viewed as the *hypothesis*
    and the parameters as the *tailoring of the hypothesis* to a specific task.


    # ### 1.1.3 Applications of Machine Learning


    Turing speculated that computers would one day play chess. He designed a program
    capable of playing an entire game against a human. The program assigns values
    to each game state and selects the move with the highest value. However, the program
    was too complex to be run by the early computers of Turing’s time. Turing executed
    his program manually against a colleague of his in 1952. Just over 50 years later,
    in 1997, Deep Blue, a chess computer designed at Carnegie Melon University and
    built by IBM, beat the then reigning world champion, Garry Kasparov. Deep Blue’s
    256 parallel processors enabled it to examine 200 million possible moves per second
    and to look ahead to as many as 14 turns of play.


    # **Learning Games**


    Fourteen years later, in 2011, another IBM computer called Watson, 100 times faster
    than Deep Blue, won the game Jeopardy, against the TV quiz show’s two greatest
    all-time champions. Watson had 2800 microprocessors and could calculate up to
    80 trillion operations per second. More than 100 parallel algorithms analyzed
    each of the questions asked to Watson and found different plausible answers, while
    another set of algorithms ranked the answers. The very fact that a machine could
    win at Jeopardy attracted much attention. For many observers, while chess was
    considered the iconic representation of *human intelligence*, Jeopardy was considered
    the iconic representation of *being human*. In addition to the architectural difference
    between DeepBlue and Watson, there was an important difference between the underlying
    programs, thus illustrating the evolution of the concept of *machine learning*.
    On the one hand, the engineers of the chess algorithm relied on the so-called
    *symbolic AI*: a set of rules designed by chess champions and executed by a specific
    program called an *expert system*. The engineers of the Jeopardy algorithm, on
    the other hand, relied on a massive amount of *unstructured data* (the equivalent
    of one million books) representing natural language patterns.


    Four years later, in 2015, another machine, AlphaGo, developed by DeepMind Technologies,
    was able to beat the strongest players in the board game Go. The'
