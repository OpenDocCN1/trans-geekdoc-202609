    4 Fundamentals of Robust Machine Learning


    # **Coordinate-Wise Trimmed Mean (CWTM)**


    This aggregation rule is a vector implementation of the trimmed mean rule, which
    we discussed earlier for scalars. Given a non-negative integer $q < \frac{n}{2}$
    (a.k.a. the trimming parameter), $\text{CWTM}_q(\mathbf{v}_1, \dots, \mathbf{v}_n)$
    is defined to be a vector whose $k$-th element, for all $k \in [d]$, is given
    by


    $$\left[\text{CWTM}_q(\mathbf{v}_1, \dots, \mathbf{v}_n)\right]_k = \text{TM}_q\left([\mathbf{v}_1]_k,
    \dots, [\mathbf{v}_n]_k\right), \quad (4.7)$$


    where the mapping $\text{TM}_q$ is as defined earlier in (4.4). Clearly, in the
    scalar case, the coordinate-wise trimmed mean reduces to the classic trimmed mean.
    When $q = \lceil n/2 \rceil - 1$, a coordinate-wise trimmed mean is equivalent
    to the coordinate-wise median operation. Similarly to the coordinate-wise median,
    this aggregation rule is quite efficient in terms of worst-case algorithmic complexity.
    The time complexity of sorting vectors in each dimension is in $\mathcal{O}_n(n
    \log n)$ (e.g., using the *mergesort* algorithm), and averaging the selected value
    in each dimension is in $\mathcal{O}_n((n - 2q)d)$. Overall, the time complexity
    of the CWTM aggregation rule is in $\mathcal{O}_n(dn \log n)$, which is only a
    $\log n$ factor more than that of the average.


    # **Multi-Krum**


    This particular aggregation rule induces two parameters, $q_1 \in [n - 2]$ and
    $q_2 \in [n - q_1]$. Multi-Krum consists in computing for each input vector a
    set of other input vectors that are the closest to the input vector. Specifically,
    for each $i \in [n]$ and $j \in [n - 1]$, we denote by $i_j \in [n] \setminus
    \{i\}$ the index of the $j$-th closest input vector from $\mathbf{v}_i$, i.e.,
    we have $\|\mathbf{v}_i - \mathbf{v}_{i_1}\| \le \dots \le \|\mathbf{v}_i - \mathbf{v}_{i_{n-1}}\|$,
    with ties broken arbitrarily. We also define $S_i(q_1) := \{i_1, \dots, i_{n-q_1-1}\}$.
    Using these notations, Multi-Krum can be defined in two steps. First, for each
    $i \in [n]$, compute the score


    $$\text{Score}(i) = \sum_{j \in S_i(q_1)} \|\mathbf{v}_i - \mathbf{v}_j\|^2.$$


    Then, the output of the aggregation is defined to be the average of $q_2$ input
    vectors with the smallest scores, i.e.,


    $$\text{Multi-Krum}_{q_1,q_2}(\mathbf{v}_1, \dots, \mathbf{v}_n) = \frac{1}{q_2}
    \sum_{i \in Z(q_2)} \mathbf{v}_i, \quad (4.8)$$


    where $Z(q_2) \subset [n]$ such that $|Z(q_2)| = q_2$ and for all $i \in Z(q_2)$
    and $j \in [n] \setminus Z(q_2)$, $\text{Score}(i) \le \text{Score}(j)$. Because
    Multi-Krum is not an exhaustive search, rather a greedy algorithm, it is not very
    expensive from a computational viewpoint. Indeed, the time complexity of computing
    all pair-wise distances between the vectors is in $\mathcal{O}_n(dn^2)$, and the
    complexity of computing the score of each input vector is in $\mathcal{O}_n(q_1
    n \log(n))$. Lastly, the time complexity for sorting of the vectors according
    to their scores and the computation of the average over the $q_2$ smallest-scored
    vectors is in $\mathcal{O}_n(n \log(n) + q_2 d)$. Overall, the time complexity
    of Multi-Krum is in $\mathcal{O}_n(n^2 d + q_1 n \log(n))$. Hence, although more
