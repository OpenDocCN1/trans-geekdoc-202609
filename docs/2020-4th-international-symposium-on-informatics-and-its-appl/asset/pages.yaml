    CenterNet [1] represents objects by one point as their bounding box. In this method,
    particulars such as size, angle, 3D extension, and orientation are regressed from
    image features at the center point. Objects are detected with learned keypoint
    estimation. Authors simply feed the image to a FCNN (Fully Convolutional Neural
    Network) that generates a heat map. Peaks in this heat map correspond to center
    objects. Image features predict the object bounding height and width. The model
    is trained using dense supervised supervision.


