    # C. Deep Learning, ConvNets and Keras


    The benefits of recent breakthroughs in artificial intelligence have travelled
    towards the everyday, improving life in numerous domains. Personalized digital
    assistants, e-commerce recommendations, financial fraud detection, web search
    and social network discovery as in genomics have even benefited, if not improved,
    by machine learning. Deep learning (DL) is a popular subset of Machine Learning
    utilizing Artificial Neural Networks (ANNs) inspired lightly by the structure
    of neurons in human brain. Formally, the deep refers to the number of layers in
    the neural network.


    CNNs (or ConvNet) are a kind of neural architectures, different types of layers
    (i.e., principal components) of CNNs are used for visual object classification
    tasks: ResNet (2018), ResNet (2017), Alex (2013), VGG (2014) and others. The layers
    are multiple.


    Keras (t. keras) is an important part of the core framework for machine learning
    and deep learning. It performs modular-building models by stacking layers and
    connecting computational graphs. Keras is useful for fast prototyping (i.e., ignoring
    the details of implementation and optimization processes) that supports convolution
    and recurrent layers and combination of both, it runs seamlessly on CPUs and GPUs
    with any architecture can be designed using this library [14]. In this paper we
    use a Python implementation of stacked hourglass framework by Keras [15].


    # IV. METHODOLOGY


    The methodology proposed in this paper uses a combination of a proposed algorithm
    for ''object filtering and counting'' with the CenterNet [1] detector proposed
    in framework and an hourglass-based localization to provide quality and accuracy
    for counting objects in videos.


    Algorithm 1 describes the main steps for object detection, line 1 reads the first
    frame of video frames, line 2 translates the frame from RGB mode (color image)
    to gray mode, line 3 resizes the frame to match value m (i.e., detection step),
    this allows us to compute optical flow, counting to different levels (i.e., steps),
    line 11 performs object detection within actual frame, actual frame position is
    defined:


    ```

    Position(actualframe) = (j × m); j ∈ [1, m]

