    **Abstract—** Counting objects in views is an important field of research that
    provides appropriate information about objects and their groups in video streams.
    An adequate technique to achieve this is using digital video processing methods
    with a detection method called CenterNet for deep learning. This paper presents
    an adequate technique based on a detection method and optical flow generated between
    video frames.


    Figure 1 shows the architecture of the proposed technique that consists of a combination
    of a set of concepts that are: Object detection, object counting, optical flow
    and slicing. Section II describes background information, section III related
    works, section IV proposed method, and section D describes technique implementation
    and analysis.


    **Keywords—** counting CenterNet, optical flow, video/image processing, deep learning.


    # ### I. INTRODUCTION


    # ### II. BACKGROUND INFORMATION


    Image-processing is the field of handling and analyzing images. There are several
    hidden information in an image that we unsuccessfully process. The goal of image
    processing is to use the different properties of an image/frame such as color,
    correlations between pixels, objects number, and their placements.


    OpenCV is a++ library with modules that cover many areas of computer vision (image
    and video processing). Besides C+(and C) there is great use for Python as a simple
    scripting language through Python on top of the C++ code [5]. This gives us two
    advantages: fast performance and ease of use (the actual C++ code working in background,
    and it is very easy to code in Python). This is OpenCV-Python works, it is a Python
    wrapper around original C++ implementation.


    Deep learning learns multiple levels of representation and abstraction, to help
    us understand the data. Convolutional Neural Networks (also called CNNs) is one
    of deep learning architectures that excels in feature recognition which is widely
    used in pattern recognition tasks.


    Optical flow (optical flow code) is the image motion of objects in the scene or
    camera movements between two consecutive frames. It is a 2D vector field of within-frame
    translation. It is a classic and well-studied field used in many successful applications
    for video compression, motion estimation, object tracking and image segmentation
    [5]


    The CenterNet detector [1], used in this paper for object detection by keypoint
    estimation with help of Hourglass [2] as its backbone, the original task of this
    last is help post estimation [3]. The Hourglass CenterNet [2] used in this paper
    is trained on MSCO datasets [4]


    Optical flow follows some equations:


    +   - The intensities of the object do not change between consecutive frames.

    - Neighboring pixels have similar motion.


    Consider a pixel $(x,y)$ in first frame (Check a new dimension, time is added
    to). It moves by $(dx,dy)$ in frame after time $dt$. Since the pixels are the
    same and do not change, we can use


    $I(x,y,t) = I(x+dx, y+dy, t+dt)$


    OpenCV contains several optical flow implementations, we use calc/OpticalFlowFarback
    method based on [7]. That is one of the best methods for obtaining dense flow
    fields [5].


