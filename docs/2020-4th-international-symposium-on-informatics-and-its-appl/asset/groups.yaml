    assistants, e-commerce recommendations, financial fraud detection, web search
    and social network discovery as in genomics have even benefited, if not improved,
    by machine learning. Deep learning (DL) is a popular subset of Machine Learning
    utilizing Artificial Neural Networks (ANNs) inspired lightly by the structure
    of neurons in human brain. Formally, the deep refers to the number of layers in
    the neural network.


    CNNs (or ConvNet) are a kind of neural architectures, different types of layers
    (i.e., principal components) of CNNs are used for visual object classification
    tasks: ResNet (2018), ResNet (2017), Alex (2013), VGG (2014) and others. The layers
    are multiple.


    Keras (t. keras) is an important part of the core framework for machine learning
    and deep learning. It performs modular-building models by stacking layers and
