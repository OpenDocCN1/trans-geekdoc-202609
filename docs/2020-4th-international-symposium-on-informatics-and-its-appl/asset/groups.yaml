    # 深度学习与图像处理中的视图对象计数


    Merouane Labene

    计算机科学系

    Mohamed Ben Yahia 大学

    吉杰尔，阿尔及利亚

    labmene@gmail.com


    Chaouki Bouferna

    计算机科学系

    阿尔及尔1大学

    阿尔及尔，阿尔及利亚

    bouferna@gmail.com


    Mokhtar Taffar

    计算机科学系

    Mohamed Sebaih Yahia 大学

    吉杰尔，阿尔及利亚

    bentaffar@yahoo.com


    **摘要—** 视图中的对象计数是一项重要的研究领域，它能为视频流中的对象及其群体提供关于对象和位置的适当信息。实现这一目标的合适技术是使用数字视频处理方法，结合一种名为
    CenterNet 的深度学习检测方法。本文提出了一种基于检测方法和视频帧之间光流的合适技术。


    图 1 显示了所提技术的架构，该架构由一组概念组合组成：对象检测、对象计数、光流和切片。第二节描述了背景信息，第三节相关工作，第四节为所提方法，第 D 节描述了技术的实现与分析。


    **关键词—** CenterNet 计数，光流，视频/图像处理，深度学习。


    ## I. 引言


    ## II. 背景信息


    图像处理是处理和分析图像的领域。图像中存在许多我们未能成功处理的隐藏信息。图像处理的目标是利用图像/帧的不同属性，如颜色、像素之间的相关性、对象数量及其放置位置。


    OpenCV 是一个 C++ 库，其模块涵盖了计算机视觉的许多领域（图像和视频处理）。除了 C++（和 C）之外，Python 作为一种简单的脚本语言，通过
    C++ 代码之上的 Python 也有很大的用途 [5]。这为我们提供了两个优势：高性能和易于使用（实际的 C++ 代码在后台运行，而在 Python 中编码非常容易）。这就是
    OpenCV-Python 的工作原理，它是对原始 C++ 实现的 Python 封装。


    深度学习学习多个层级的表示和抽象，帮助我们理解数据。卷积神经网络（也称为 CNNs）是深度学习架构之一，它在特征识别方面表现出色，广泛用于模式识别任务。


    光流（光流代码）是场景中对象的运动或两个连续帧之间的相机运动。它是帧内平移的 2D 向量场。它是一个经典且经过研究的领域，用于视频压缩、运动估计、对象跟踪和图像分割的许多成功应用
    [5]。


    CenterNet 检测器 [1] 用于本文中，通过借助 Hourglass [2] 作为其骨干网络通过关键点估计进行对象检测，后者的原始任务是帮助后验估计
    [3]。本文中使用的 Hourglass CenterNet [2] 在 MSCO 数据集 [4] 上经过了训练。


    光流遵循某些方程：


    - 连续帧之间对象的强度不改变。

    - 相邻像素具有相似的运动。


    考虑第一帧中的像素 $(x,y)$（检查一个新维度，增加了时间）。它在时间 $dt$ 之后的帧中通过 $(dx,dy)$ 移动。由于像素是相同的且不变，我们可以使用：


    $I(x,y,t) = I(x+dx, y+dy, t+dt)$


    OpenCV 包含多种光流实现，我们使用了基于 [7] 的 `calc/OpticalFlowFarback` 方法。这是获取稠密流场的最佳方法之一 [5]。


    ![](img/52e4806968c75eb1523bd3f1a80480e9_0_0.png)


    图1. 技术的架构。


    ## III. 背景处理与 CenterNet


    图像处理的核心是利用图像的属性（如颜色、不同像素之间的相关性、对象放置和其他细节）来提取有意义的信息，如边缘、对象和轮廓，这些正式称为图像特征。这些特征可以用于不同的应用，如机器视觉、安全、社交媒体事件和自动驾驶汽车
    [8]。


    CenterNet [1] 用一个点作为其边界框来表示对象。在这种方法中，尺寸、角度、3D 扩展和方向等特定细节是从中心点的图像特征中回归的。通过学习的关键点估计进行对象检测。作者简单地将图像输入到
    FCNN（全卷积神经网络），该网络生成热图。热图中的峰值对应于中心对象。图像特征预测对象的边界框的高度和宽度。该模型使用稠密监督进行训练。


    ## III. 相关工作


    这些年来，利用图像/视频处理和对象检测方法进行对象检测和计数引起了巨大的关注。使用这些方法已经实现了对象检测和计数 [16]：


    - 匹配，

    - 阈值化和生成，

    - 点和边缘检测，

    - 帧和检测流处理，

