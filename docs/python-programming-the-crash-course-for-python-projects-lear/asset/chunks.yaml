    \ in the dictionary concept. They are 'len' 'del' and 'pop' ![](rsrc1FM.jpg)\n\
    \n• Function The function of writing a program is very important. In Python, there\
    \ are two types of function. They are ... \n\n1. Predefine Function (len, del\
