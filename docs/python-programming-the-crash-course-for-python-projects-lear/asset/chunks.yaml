- raw: "Chapter 2:  Why is Python Language so popular? The top reason for Python's\
    \ language is to be world popular. This is an open source language. Everyone can\
    \ download it for free. No payments are required. There is a lot of community\
    \ support to develop the program.  Python has a large number of standard libraries.\
    \ Using this can create huge programs. The coding is easy to write. You can write\
    \ a program quickly with Python. Python can easily learn the language. There are\
    \ Frameworks like Django, Flask, NumPy, SciPy and more to simplify the program.\
    \ The Python language program can also be used in languages? Like C and Java. \
    \ Python learners get a higher paid job immediately. For many of these reasons,\
    \ the Python language is very popular. ![](rsrc4G.jpg)\n\nChapter 3:  Why the\
    \ name Python? In 1970, a “Monty Python's Flying Circus” program was broadcast\
    \ on one of a Britain TV. Guido van Rossum is from the Netherlands. He was a fan\
    \ of this TV show. He is an excellent software developer.  In 1991, he developed\
    \ a computer language. He was thinking of putting this name into the computer\
    \ language. Then he remembered that TV show. The TV program took the name of Python\
    \ and named him Python for his computer language. This is the reason for this\
    \ Python language. ![python interpreter.JPG](rsrc4U.jpg)\n\nChapter 4:  Why learn\
