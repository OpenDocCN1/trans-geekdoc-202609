  trans: "\n![python logo.jpg](img/rsrcJ.jpg)PYTHON 编程 入门 秘诀 机器学习、数据科学分析和人工智能 入门 深度学习\
    \ 入门 Sivakumar Munusami \n\n版权所有。未经出版商或作者事先书面同意，本书任何部分不得以任何形式、通过任何方式、电子、机械、影印、录音、扫描、通过互联网或其他方式分发本书，也不得擅自复制。请仅购买经授权的电子版或平装版，并不得参与或鼓励侵犯版权的电子盗版行为。\
    \ \n\n内容 Prologue 祝贺您下载了“Python Programming: The Crash Course for Python Projects\
    \ – Learn the Secrets of Machine Learning, Data Science Analysis and Artificial\
    \ Intelligence. Introduction to Deep Learning for Beginners”并为此表示感谢。您是否想立即在像 Google\
    \ 这样的大公司找工作？您是否想购买一辆昂贵的 Rolls Royce 汽车？您是否想在一生中过上奢华的生活？那么您需要学习 Python 语言。Python\
    \ 不仅仅是一个词，它是一个神奇的词，是上天赐予我们的礼物。今天世界正在谈论 Python 的光辉。90% 的软件专家使用 Python 语言编写程序。Python\
    \ 是高级语言，易于使用，开源语言。使用 Python 编写程序既简单又快捷，新手可以轻松学习。许多人失业，如果想立即获得工作，请学习 Python 语言。当您读完本书的最后一页，您将掌握完整的\
    \ Python 语言。 \n\n第 1 章：Python 语言是什么？Python 是一门世界知名的简单、强大且通用的计算机语言。它是开源语言，被称为高级语言、动态语言、图形用户界面语言、面向对象语言、解释器语言。Guido\
    \ van Rossum 在 1991 年开发了 Python 语言。他出生于荷兰，目前居住在加利福尼亚州 Belmont。他是最佳的软件开发人员。Python\
    \ 语言可以轻松创建复杂的程序，Python 命令非常简洁，编写 Python 程序很容易。它是免费的开源程序。像 Google 这样的大公司使用 Python\
    \ 语言。Python 程序在 Windows、Linux、UNIX 和 Mac 等操作系统上运行。大型项目是否必须使用 C、C++ 和 Java 等语言编写？在\
    \ Python 语言中，您只需少量代码即可编写出最佳程序。用不同的计算机语言编写的程序可以在 Python 中使用，反之亦然。这是 Python 语言的最大特点。Python\
    \ 拥有大量标准库，使用它们可以轻松创建程序。Python 可以用于网页应用、电子邮件解析、网络编程、桌面应用、Internet 协议、游戏、机器人程序、移动应用、GUI\
    \ 应用、科学应用等。Python 也广泛用于人工智能、Internet 脚本、嵌入式脚本、数据库编程、系统工具、机器学习、图像处理、数据科学分析、Web\
    \ 开发、机器人、自动化等领域。使用 Python 可以创建简单的聊天机器人，甚至可以创建一门编程语言。![python is.jpg](img/rsrc45.jpg)\n\
    \n"
