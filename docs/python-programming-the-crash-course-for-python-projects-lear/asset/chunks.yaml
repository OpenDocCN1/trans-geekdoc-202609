    # Why Python is different from other languages?


    Python is a lot of differences and other languages. Python is the best in comparison
    with other languages. Python has a lot of specialty in the language. If you want
    to write a program in C, C ++ and Java, you have to write more coding. That is,
    there is about coding in thousands of pages. But a small coding can be written
    in Python and a program can be created. You need to spend money on buying other
    computer languages. But Python can be downloaded for free. Learning other languages
    is very difficult. But, Python can easily learn. For those who have been learned
    with other languages, it is very difficult to get the job. For those who read
    Python, get the job immediately. The largest companies such as Google are using
    Python language.


    # How download Python Language?


    Step 1: Go to google.com and type the ‘python’ in the address bar. ![](img/rsrcEZ.jpg)


    Step 2: Then click on the first link. ![](img/rsrcF8.jpg)


    Step 3: Now, Python website open up. Then click the “Download” Button and select
    your operating system. ![](img/rsrcFH.jpg)![](img/rsrcFM.jpg)


    1.  Download for Windows: https://www.python.org/downloads/windows

    2.  Download for others: https://www.python.org/download/other

    3.  Download for Linux : https://www.python.org/downloads/source

    4.  Download for Mac: https://www.python.org/downloads/mac-osx


    Step 4: Then a window appears. If you use the Windows Operation System, Click
    the “Python 3.7.3 button.  If you use another operating system like Linux, click
    on the “other platforms” link on the left side. ![](img/rsrcFZ.jpg)


    Step 5: Once you click the link of the operation system you need, the Python Program
    is downloaded. This is saved in a folder called ‘Download’ in C Drive in your
    computer. ![](img/rsrcG8.jpg)


    # How Install Python Language?


    Step 1: Open the Download folder in your computer and the double click on the
    Python program file. ![](img/rsrcGK.jpg)


    Step 2: Then click ‘Run’ button on the window that appears. ![](img/rsrcGW.jpg)


    Step 3: Then click ‘Install Now’ link on the window that appears. ![](img/rsrcH5.jpg)


    Step 4: Now, the Python Program is installed on your computer within few minutes.
    ![](img/rsrcHE.jpg)


    Step 5: After that, the window “Setup was successful” will open. Now, Python program
    is successful installed your computer. ![](img/rsrcHR.jpg)


    Step 6: Now, Click start Menu and Click “All Programs” Tab ![](img/rsrcJ0.jpg)


    Step 7: Then a submenu appears. Click on the “Python 3.7 (32-bit)” tab in it.
    ![](img/rsrcJ9.jpg)


    Step 8: Currently, the Python program opens. Then you can write a program with
    Python. ![](img/rsrcJJ.jpg)


    Step 9: Python’s first program (Hello world program) ![](img/rsrcJV.jpg)


    # What is Python IDE?


    Python IDE is software.  It is designed to make the Python program easier to develop.
    Python program can be written in three ways. First one Write a program with Comment
    Prompt. The second one, you can also write a program using Python. In these two
    ways, the program is difficult to write. So the Python IDE was created to make
    a program easy and run. A program can easily be written through Python IDE.  Let''s
    run it. You can fix errors in the program. There are lots of Python IDEs. The
    most important of these is pycharm. There are lots of Python IDEs like pycharm.
    Let''s get to know them below. 1\. PyCharm 2\. Rodeo 3\. Thonny 4\. Spyder 5\.
    Pydev 6\. Wingware 7\. Eric Python and more…


