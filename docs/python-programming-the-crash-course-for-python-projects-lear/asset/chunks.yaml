    \ values in a list in ascending order) ![](rsrc1CJ.jpg)\n\n• Tuple The tuple is\
    \ like a list concept. There is only one difference between the two. That's immutable.\
    \ In the list, you can change the value in a variable. But the value in the tuple\
    \ concept cannot be changed. The list is mutable. A tuple is immutable. In the\
    \ Tuple Concept, when the Value gives a variable, Parentheses ( ) should be used.\n\
    \n• Set We'll be using Set's concept in calculations. We say that the same concept\
    \ is implemented through the program. Only curly braces { } can be given value\
    \ to a variable. It does not accept the duplicate value. There are 11 functions\
    \ in the set concept. Let's see what they are about. 1. add 2. clear 3. copy 4.\
    \ difference 5. union 6. intersection 7. isdisjoint 8. issubset 9. isupperset\
    \ 10. remove 11. symmetric_difference\n\n1. add (Adding a value to a set) ![](rsrc1DC.jpg)\n\
    \n2. clear (Deleting all values in a set) ![](rsrc1DJ.jpg)\n\n3. copy (Copying\
    \ one set and turning it into another set) ![copy of.JPG](rsrc1DR.jpg)\n\n4. difference\
    \ (The difference in values in the two sets) ![](rsrc1DW.jpg)\n\n5. union (Combining\
    \ the values in the two sets) ![](rsrc1E1.jpg)\n\n6. intersection (Finding common\
    \ values in two sets) ![](rsrc1E6.jpg)\n\n7. isdisjoint (True: if both sets have\
    \ no common value) (False: if both sets have common value) ![](rsrc1EB.jpg)\n\n\
    8. issubset (True: The value in one set, if it is in another set) (False: The\
    \ value in one set, if not in another set) ![](rsrc1EN.jpg)\n\n9. isupperset (True:\
    \ The value in a large set, if in a small set) (False: The value in a large set,\
    \ if not in a small set) ![](rsrc1EU.jpg)\n\n10. remove (To delete a value in\
    \ a set) ![](rsrc1F0.jpg)\n\n11. symmetric difference (Is a value that is not\
    \ common in both sets) ![symmetric difference.JPG](rsrc1FA.jpg)\n\n• Dictionary\
    \ Dictionary is a concept similar to List, Tuple, and Set. This is a special concept\
