    # CONCLUSION


    In this paper, three different learning models have been implemented: Boosting,
    AdaBoosting, and CatBoost for detecting-DDoS attacks using the CICDoS2019 dataset,
    as well as a multiclass classification of traffic data. For a binary and multiclass
    classification of traffic carried out, it was found that CatBoost is the best
    among others with an accuracy of 99.1%, F1-grade 99%, and Recall 99.3. We also
    found that CatBoost also performs better than other methods with Precision 96.7%,
    Recall - 96.8%, and in the case of classification on a reduced dataset. Note that
    the gradient boosting classifier also showed high results with Precision = 62.2%,
    Recall = 63%, and F1-score = 47.2%, and Recall = 52.5%. Also, during the most
    important features identified using the method of additional classifier trees,
    it was found that the classifiers the accuracy of the CatBoost and Gradient booster
    deteriorated over the classification in all aspects.


    It was found that the quality of classification is important for the method used.
    The results are follows: Precision = 62.2%, F1-score = 62.4% and Recall = 63%.
    However, the other classifiers CatBoost and Gradient Boosting showed results such
    as: Precision decreased by 0.1%, Recall by 0% and F1 by 1%, and Boosting decreased
    by 0.4%, Recall by 0.1% and F1-score by 4%. After CatBoost, reducing the set of
    features made it possible to reduce the resources needed during analysis by an
    average of 11.5% of the approach to identifying DDoS attacks on a full set of
    features. This performance is gained because the hashing algorithm performs the
    features of memory trace classification, for specific types of attacks. Thus,
    we can say that even though the proposed method somewhat we difference between
    us was no more than 1%, the performance analysis showed that the reduction in
    features made it possible to reduce the consumption of resources when analyzing
    data by 11.5% about identifying DDoS attacks on the basis of features. Thus, we
    can conclude that our presentation of data for classification, based on the use
    of the characteristics of network traffic and configuration files of the service
    is sufficiently accurate and reliable results with sufficiently high performance.
    Further work is aimed at developing algorithms by an ensemble of machine learning
    to achieve more accurate results of classification.


