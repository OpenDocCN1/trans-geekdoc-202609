    **摘要—** 本文探讨了网络安全问题。在识别DDoS攻击的类多问题中，提出了一种基于扩展特征集的类分类方法，该方法使用了针对网络设备配置文件的专用哈希算法。通过所提方法，我们比较了若干种机器学习方法，以确保IT网络的安全。事实证明，多分类方法在检测攻击方面是有效的，其中包括所提出的哈希算法。作为一项试点性研究，本文对这些方法进行了比较，并在首次分类中考虑了CatBoost，该模型在实验中的表现优于其他模型。


    **关键词—** DDoS，哈希，梯度提升，AdaBoost，多分类


    本文针对CICDoS2019数据集[2]，对不同类型的DDoS攻击网络流量进行了分类。


    ## I. 引言


    尽管物联网已经活跃应用了十多年，但其安全问题仍然存在。这是由于漏洞切入点数量的增加。网络安全领域的专家关注这些类型的攻击，因为它们可能会造成破坏和信息攻击。


    在最近的情况下，网络攻击的定义及其随后的后果变得日益重要。随着人工智能（AI）的使用，计算机工具更加智能，丰富了分析知识，并缩短了威胁响应时间。


    近年来，我们记录到针对物联网（IoT）的攻击稳步增长。2019年，根据当局的数据，针对IoT设备的网络攻击数量增加了300%。


    本文的其余部分结构如下：第二部分提供了该主题的现有文献综述。第三部分描述了数据集并制定了多分类方法。第四部分简要描述了解决该问题所使用的机器学习方法。第五部分描述了实验研究和结果。最后部分给出了结论。


    此外，Trustsoluk在2017年进行的物联网设备用户意识调查显示，超过一半的受访者没有对智能设备采取额外的安全措施，有35%的人在使用前没有更改密码。


    ## II. 相关工作


    本研究是在俄罗斯联邦基金（RFBR）的资助下，在项目编号25-07-53019、20-07-01065的科学框架内进行的，并获得了俄罗斯联邦支持2.250.2.2019计划开展的研究资助以及俄罗斯联邦对支持俄罗斯科学家的资助赠金。


    接下来，我们回顾了几篇重点关注使用CICDoS2019数据集进行入侵检测的科学论文。


    在[3]中，作者回顾了现有的入侵检测数据集，并提出了一种针对DDoS攻击的新方法。此外，本文作者创建了一个新的数据集CICDoS2019，该数据集包含了基于流特征特征的11种DDoS攻击。


    作者使用常用的机器学习算法（即ID3、随机森林（RF）、朴素贝叶斯和逻辑回归）对该数据集进行了研究。计算了指标：精确率（Precision）、召回率（Recall）和F值（F-score）。作者获得的结果如下：最佳分类算法实现的指标精确率为78%，召回率为65%，F值为69%。


    优化了中央SDN控制器所应用策略的丢弃率。对比分析表明，作者选择的方法与多层感知器（MLP）相比，取得了较低的分类结果。


    论文[24]的作者开发了一种基于能量的分类器（EFC），准确率为92.8%。


    ## III. 问题描述


    这项工作的相关性在于检测SDN中的DDoS攻击。在本文中，我们利用CICDoS2019数据集考虑流量分类问题。所研究攻击的特征如下所示：


    ![](img/5e09c21f63a2bf0de70affe69784dbc_1.png)

    1. 物联网中的DDoS攻击


