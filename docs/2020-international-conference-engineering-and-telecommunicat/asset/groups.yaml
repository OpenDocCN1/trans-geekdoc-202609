    # 结论


    在本文实现了三种不同的学习模型：Boosting、AdaBoosting 和 CatBoost，用于使用 CICDoS2019 数据集检测 DDoS 攻击，以及流量数据的多分类。对于所执行的流量二分类和多分类，发现
    CatBoost 在其他模型中是最好的，准确率为 99.1%，F1 等级为 99%，回回率为 99.3。我们还发现 CatBoost 的性能也优于其他方法，精确率为
    96.7%，回回率为 96.8%，并且在减少的数据集上进行分类时也是如此。注意梯度提升分类器也显示了高结果，精确率 = 62.2%，回回率 = 63%，F1
    分数 = 47.2%，回回率 = 52.5%。此外，在利用额外分类树方法识别的最重要特征期间，发现 CatBoost 和梯度提升分类器的准确率在分类的所有方面都恶化了。


    发现分类质量对于所使用的方法非常重要。结果如下：精确率 = 62.2%，F1 分数 = 62.4%，回回率 = 63%。然而，其他分类器 CatBoost
    和 Gradient Boosting 显示的结果为：精确率下降了 0.1%，回回率下降了 0%，F1 下降了 1%，而 Boosting 下降了 0.4%，回回率下降了
    0.1%，F1 分数下降了 4%。在 CatBoost 之后，减少特征集使得在识别全特征集 DDoS 攻击期间所需的资源平均减少了 11.5%。这种性能的获得是因为哈希算法针对特定攻击类型执行了内存轨迹分类特征。因此，我们可以说，尽管提出的方法与我们之间的差异不超过
    1%，但性能分析表明，减少特征使得在基于特征分析 DDoS 攻击时可以减少 11.5% 的资源消耗。因此，我们可以得出结论，我们基于网络流量特性和服务配置文件的分类数据展示提供了充分准确且可靠的结果，具有足够高的性能。进一步的工作旨在开发机器学习集成算法，以获得更准确的分类结果。


