    The idea of classification is as follows:


    +   1. Represent initial changes of the network devices as a hash value.

    2. In the case of change of configuration settings, it is necessary to replace
    the hash value.

    3. Track the changes of this configuration from the initial to the next one (taking
    a timestamp).

    4. To conclude on the direction of change: whether the change is malicious in
    nature, or legitimate.


