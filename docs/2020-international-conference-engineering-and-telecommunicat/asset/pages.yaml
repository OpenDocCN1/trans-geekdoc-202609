    # IV. MACHINE LEARNING METHODS


    High-quality data is a prerequisite for building forecasting models. Therefore,
    the dataset used to train the data were prepared and cleared; outliers and implicit
    duplicates were detected and deleted, and missing data was produced by interpolation
    method data. However, some outliers were excluded: ‘ID’, ‘Destination Port’, ‘SimHarp’,
    ‘Source Port’, ‘Destination Port’, ‘Timestamp’, ‘Source IP’, ‘Inbound’. Besides,
    data balancing was previously applied to the dataset (Sampling Method ADASYN [11]).
    The dataset is increased to 80% for training and validation and 20% for


    To detect abnormal traffic, we suggest using the following machine learning methods:


    +   1. Gradient Boosting is a machine learning method that creates a crucial prediction
    model in the form of an ensemble of weak predictions, using decision trees. It
    builds the model sequentially, adding new models to previous ones to correct errors
    made by previous predictors [12].


    +   2. Adaptive Boosting (AdaBoost) typically uses weak classifiers. After each
    call, the distribution of weights corresponding to the importance of each of the
    training set objects for classification. At each iteration, the weights of misclassified
    objects increase, so the performance of basic classifiers focuses on these objects
    [13].


    +   3. Chaos is a machine learning method based on boosting using decision trees.
    During training, a set of decision trees is built with less compared to the previous
    ones. The number of trees is controlled by the starting parameters. The peculiarity
    of this algorithm is it is well suited for working with heterogeneous data. Also,
    it can take into account categorical features [14].


    # V. EXPERIMENTS


