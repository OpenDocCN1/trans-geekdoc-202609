    The input data to the machine learning systems for Big Data comes from the network
    devices. This system includes the following:


    +   - The “Gateway for receiving traffic data to the data warehouse” allows us
    to interact with existing sensors and IoT devices and provides a bridge between
    the local communication network, cloud computing power, and visualization devices.

    - The “Data Warehouse” is a storage location for the raw data.

    - Raw data in structured and unstructured forms is sent for further preliminary
    statistical processing, which is performed using the appropriate method to prepare
    data for effective use in machine learning. At this stage, each record corresponds
    to the configuration of an individual network device.

    - “Highlighting significant features in the network traffic reduces the size of
    the original dataset to manage manageable groups (functions) for further processing,
    which helps solve performance problems on high-speed networks without significantly
    affecting the accuracy of identifying attacks.

    - Using the “Binary statistical traffic analyzer” module, incoming traffic is
    monitored to detect abnormal activity, binary classification of traffic into legitimate
    and abnormal.

    - The “Predictive statistical and machine learning” model defines a class of traffic
    using analysis methods that focus on predicting the future behavior of objects
    and subjects to make optimal decisions.

    - The “Accuracy check” evaluates the accuracy of traffic classification using
    various methods.


    To evaluate the effectiveness of the Gradient Boosting, AdaBoost, and CatBoost
    classifiers, a comparative analysis of the classification results was performed
    for this purpose, the following metrics were calculated: F1-score, Recall, and
    Precision:


    ```

    Recall = \frac{tp}{tp + fn}

    ```


    ```

    Precision = \frac{tp}{tp + fp}

    ```


    ```

    F1 = 2 \times \frac{(Precision \times Recall)}{(Precision + Recall)}

    ```


    where tp is the number of true positives, fp is the number of false positives
    and fn is the number of false negatives.

    All calculations were implemented using Python using Gradient Boosting, AdaBoost,
    and CatBoost. To do this, we re-encode the label of traffic instance classes to
    the “attack” / “non-attack” classes. The analysis of the results shows that CatBoost
    gets good performance. Table 1 shows the numerical value of the metrics obtained
    including the characteristics of these metrics that were obtained in the work
    [4], [5], and [8].


