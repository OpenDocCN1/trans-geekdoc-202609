    Although the Internet of Things has been used actively for more than a decade,
    the issue of security is still relevant. This is due to the increase in the number
    of vulnerable entry points. Experts in the field of cybersecurity focus on these
    types of attacks because they can cause damage and information attacks.


    In recent circumstances, the definition of cyberattacks and their subsequent consequences
    become relevant. With the use of Artificial Intelligence (AI) all you to make
    computer tools more intelligent, enriching the knowledge of analysis, and reducing
    the response time to threats.


    **Keywords—**DDoS, hashing, Gradient Boosting, AdaBoost, Multiclass classification


    This paper performs the classification of network traffic for various types of
    DDoS attacks on the CICDoS2019 dataset [2].


    # I. INTRODUCTION


    In recent years, we have recorded a steady increase in attacks on the Internet
    of Things (IoT). In 2019, along with Authorities representatives, the number of
    cyberattacks on IoT devices increased by 300%.


    The rest of the article is organized as follows. The second part provides a review
    of existing literature on the topic. In the third part, the dataset is described,
    and the method of multiclass classification is formulated. The fourth part contains
    a brief description of the machine learning methods used to solve the problem.
    The fifth part describes experimental studies and results. The last part gives
    a conclusion.


    Also, surveys conducted by Trustsoluk in 2017 the awareness of users of IoT devices
