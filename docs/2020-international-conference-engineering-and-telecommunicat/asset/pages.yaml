    **Abstract—** This article addresses the problem of network security. In the case
    of identifying DDoS attacks, a multiclass classification was proposed based on
    expanding the set of features using a specialized hashing algorithm for device
    configuration files in the network of devices. Using the proposed approach, we
    compared several machine learning methods to ensure security in the IT networks.
    The approaches to multiclass classification proved effective in detecting attacks,
    including the proposed hashing algorithm. As a pilot study, the article provides
    a comparison of methods, and in the first classification, the one considered is
    CatBoost, which performed better than the others in the experiments.


