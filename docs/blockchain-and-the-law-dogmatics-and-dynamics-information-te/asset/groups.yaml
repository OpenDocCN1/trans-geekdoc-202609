  mdcn: "\n\n# 区块链与法律：设定底\n\n法律——关于订单应具有的质量。正义——在一个非常功能且开放的层面可以定义为向每个人提供其应得的¹——是引导统治者选择的最终标准。正义是一个强概念，对其核心的讨论超出了本文范围；只需说，它通常代表了什么是“正确”（例如，正确的）。¹²\
    \ 设定并代表（或至少渴望代表）社会秩序中最理想的状态。\n\n以下考虑是最复杂的，因为它们涉及到法律作为公共产物的问题。当说一个权威机构颁布法律时，我的意思是（而且我怀疑读者立即就理解了这一点）法律是政治行动的一种形式¹³。也就是说，法律是由一个拥有统治社会权力的机构颁布的，这种权力不仅是真实的，而且是合法的，它在社会标准下是合理的——例如，因为它是由民主选举产生的机构所表达的。它也是负责维护法律的机构统治权力的一部分，通过使法律结果变得可行并对未能遵守法律的人实施制裁来实现。\n\
    \n关于法律还有一种更社会性的观点，这种观点与其关注行使自上而下的权威权力，不如关注从社区通过日常互动产生的法律集体表达。法律的社会表达被称为习俗，人们根据对法律强制性的集体认知采取行动，这可能与公法（例如，统治者制定的法律）相冲突¹⁴\
    \ 法律秩序及其统治者不仅承认此类法律源的存在，还承认通过私法模式在定义社会互动中的个人自主性。私法是（或可以通俗地描述为）处理政治（统治）权威之外个人之间关系的规则¹⁵。私法的自由前提是，在法律设定的范围内，人们可以随心所欲地做——即他们可以按照意愿设定其法律关系的条款。存在一个社区，其中社区并不规定特定的结果，也不规定偏好的行动方法。因此，在某些原则下，个人同意在私法领域被赋予了重要作用。这包括承认集体行动的形式（例如，协会、企业、公司）以及设定互动条款的合同自由，以及特定的诉讼解决形式（例如，仲裁）。\n\
    \n因此，我们可以说法律现象由政治共同体内的行为规则、其意义、应用和维护组成。某些规则是政治颁布的，且社区的统治当局保证了它们的效力。然而，其他规则可能通过与社区成员反复且定期的互动，从集体协议中产生。\n\
    \n¹ 亚里士德 2002, 第五。\n\n¹² 同上。\n\n¹³ Alexander 2019, p. 355, and Cerau 2009, pp.\
    \ 21–22.\n\n¹⁴ Mangabeira 1976, pp. 49–50 and 127.\n\n¹⁵ Kelsen 1967, p. 280.\n\
    \nM. Lucas Pires\n\n自由法律秩序将具有强制性统治，同时允许大量的私人排序空间。\n\n法律运作（法律的颁布、执行和审判）由每个社区在其领土内完成（社区也可以允许其他实体对其行使法律权力，例如，在某些条件下涉及有限政策领域的联邦、国际组织）。一系列基本法律问题和一般性答案在每个国家基本上是相同的：集体与政治权力之间的关系由宪法规定，宪法规定了被治者和政府的权利义务。相比之下，社区之间的关系遵循知情同意下的自由承诺逻辑，责任规则适用于质疑或违反人们与他人所建立承诺的行为。每个社区之间存在差异——例如在知情同意下什么构成自由承诺、在何种承诺下产生责任，以及证明错误所需的过错程度，等其他规则——因为每个社区在其特定的背景内都应有其关于正确与正义的版本。从现实主义和相当本质主义的角度来看，这些是关于法律履行其导向行为并实现有序生活的主要结构性点。\n\
    \n# 1.3 区块链“现象”\n\n区块链首先是一种技术：一种用于人类发展的“科学发现的实际、尤其是工业用途”¹⁶ 技术。它是一种基于计算机技术的数字技术，为通信信息和数据而创建：“一种多方系统，参与者在没有中央协调员的情况下，对一组共享数据及其有效性达成共识”。¹⁷\
    \ 区块链是一种在不同计算机之间的分布式系统中进行组织和采取行动的技术。\n\n最著名的区块链协议是比特币。比特币协议的技术和意识形态重要性不应被低估。大多数描述为区块链的内容、其原则、优点及其问题和风险指的比特币协议的特征。基本假设是众所周知的：比特币通过去中心化的点对点网络在人们之间建立了一个价值交换系统（在这种，价值参考指的是已知代币比特币的属性，它将作为全球数字货币）。通过去中心化，其理念是交易双方之间没有中间介：网络及其用户控制着整个过程。网络中具有加密身份的人们同意交换他们的代币并向网络\
    \ \n\n¹⁶ Cambridge Dictionary, ‘Technology’ https://dictionary.cambridge.org/us/english,\
    \ accessed 31 October 2022.\n\n¹⁷ Rauchs et al. 2018, p. 22.\n\n# 区块链与法律：设定底\n\
    \n通过他们的加密身份签署交易来向网络通信。网络接收所有交易，一旦另一个用户（称为矿工）解决了一个自动生成的谜题，网络中一个新区块就会形成，交易被插入、盖上戳并按时间顺序排列。一旦用户在链中确认了区块，交易就会被密封，任何人都可以检查但不能更改它¹⁸\
    \ 关于比特币运行的描述，请参见 Narayanan et al 2016, pp. 1–54。\n\n比特币的去中心化有第二层含义：缺乏统治权威，例如一个董事会。其创建者中本聪明（Satoshi\
    \ Nakamoto）的匿名性有助于隔离比特币并将将其管理权交给社区。这意味着协议治理是高度脆弱的，正如某些事件所示的，“区块大小大战”，⁹ 以及一种具有去中心化特征的分布式技术，在技术和治理方面都是如此。随后的绝大多数区块链协议的发展模式不同，即使它们使用了来自中本聪的技术和意识形态灵感。使用通用的术语框架来区分第一代协议（基本上是比特币）与第二代（以太坊）和第三代（例如，Cardano，Ororand）。²⁰\
    \ 第二代协议催生了“智能合约”时代，即可编程的数字合约，能够创建诸如程序、协议和代币的应用。这第三代带来了变化：一种共识机制，其共识不再依赖于计算能量（如比特币中的工作量共识机制），而是取决于网络参与者拥有的代币数量。还有其他协议，其访问不是公开的（任何人都可以下载并运行协议，只要有足够的计算能力），而是私有的（人们需要协议创建者的许可才能加入网络）。²¹\n\
    \n对于第二代和第三代协议，去中心化仅存在于第一种含义。在第二种含义上，其存在并不明显。尽管原则上没有中央权威，但协议创始人通常是“公众”人物，通常拥有良好的在线形象和重要的商业愿景。在某些情况下，协议由私人实体（基金会、公司）支持，这些实体拥有足够的资金和人力资本（开发者）来行动并影响协议的运行。例如，以太坊基金会支持硬叉以更改代码\
    \ Bug² 或孙晨收购 Ste 是这种影响的良好例子。³ 因此，尚不清楚它们作为从尊重产生的原则是去中心化的。\n\n¹⁹ Bier 2021.\n\n\
    ²⁰ 一般而言，见见 Ols 2021.\n\n²¹ EU Blockchain Observatory and Forum 2020b, 7–16.\n\n\
    ²² Meier and Schluppi 2019, 27–44.\n\n²³ Copeland 2020.\n\n"
