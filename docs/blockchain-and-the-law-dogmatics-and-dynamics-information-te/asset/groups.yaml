    \ 条或由成员国其他指定的机构——DLT 试点制度第 2(1) 条。这些机构在授予特定授权之前应向欧洲证券及市场管理局（ESMA）提供所有相关信息——DLT\
    \ 试点制度第 8(6)、9(6) 和 10(7) 条。这是因为在必要时，ESMA 可以向国家主管机构就请求的豁免或所用分布式账本技术类型的适当性提供非约束性意见，以促进豁免的一致性和比例性，或在必要时确保投资者保护、市场完整性和金融稳定——DLT\
    \ 试点制度第 8(7)、9(7) 和 10(8) 条。\n\n审查由 DLT 市场基础设施运营者提交申请的国家主管机构有拒绝授予特定授权的可能性，如果有理由相信\
    \ DLT 市场基础设施将无法遵守联盟建立的适用规定或不属于联盟法范围的国家法律规定，如果有理由相信 DLT 市场基础设施将对投资者保护、市场完整性或金融稳定构成风险，或者该申请构成了规避现有财务要求的尝试——DLT\
    \ 试点制度第 8(10)、9(10) 和 10(10) 条。\n\n在授予特定授权后，主管机构有权撤回授予 DLT 市场基础设施的特定授权或任何豁免，如果在底层技术或\
    \ DLT 市场基础设施运营者提供的服务及开展活动中检测到异常，且该异常未被相关服务和活动提供的收益抵消；DLT 市场基础设施运营者违反了主管机构授予的授权和豁免的任何义务；或者\
    \ DLT 市场基础设施运营者注册的金融工具超过了 DLT 金融工具的阈值或不符合 DLT 试点制度规定的此类工具的其他条件——DLT 试点制度第 8(12)、9(12)\
    \ 和 10(12) 条。\n\nESMA 必须在 2026 年 3 月 24 日前向欧盟委员会提交报告，其中应包含成本效益分析，以确定将 DLT 试点制度延长至最多三年的、将制度扩展到其他类型的金融工具、对其进行修改、转换为永久性制度或终止——DLT\
    \ 试点制度第 14 条。DLT 试点制度于 2022 年 6 月 22 日生效，大多数规则自 2023 年 3 月 23 日起适用——DLT 试点制度第\
    \ 19 条。\n\n在实施该制度时，重要的是提到，证券记录系统的规则在欧盟范围内尚未统一，因此 DLT 试点制度并不直接针对此类控制系统。在这种背景下，交易和结算功能集中在单一实体中（如上图所示），可能与记录系统的原生规则有重要联系。\n\
