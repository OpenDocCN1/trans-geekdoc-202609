    \ 任何诉讼费用担保除非法院另有规定或双方另有约定，否则应以登记员指定的格式、金额和方式给出。”\n\n> ⁴⁸ Erasmus: Superior Court\
    \ Practice, 2021, 648\n\n如果原告诉讼被成功驳回，则不需要担保也不需要提交支付——而是通过预先约定的智能合约执行在链上完成。如果原告诉讼前景渺茫，B方可能特别倾向同意这一点。\n\
    \n## 5.5 结论\n\n从本章的内容可以看出，南非传统的执行方法对获得胜诉判决的诉讼人吸引力很小。正如解释过的，该过程既耗时又昂贵。\n\n现状的替代方案可以是使用智能合约的链上执行。这对双方的好处是显而易见的——执行速度和支付确定性。这在双方都能受益的情况下尤其如此，例如在遇到反诉时。虽然该建议很新，但在南非背景下，随着加密货币和区块链技术在商业领域得到更广泛的应用并获得合法性，因此智能合约执行的使用也可以使整个诉讼过程受益。\n\
