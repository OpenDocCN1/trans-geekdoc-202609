    a political will to put these measures into practice, regain public trust, and
    promote accountability. Blockchain has the advantage of functioning on the procedural
    spectrum, providing enhanced transparency, and greater economy.


    Blockchain can also be helpful in other areas of government, such as in the

    fight against corruption,71 elections (via tamper-proof voting records and smart

    contracts)72 or land titles.73 Dealing with these issues, the immutability and

