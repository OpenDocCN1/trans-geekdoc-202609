    # 3 What Are the Limits of Blockchain? Considerations on the Use ...


    will, and resources. As a volatile environment, TJ cannot afford mistakes in its
    undertakings, since it could lead to the return, or worsening, of hostilities.


    However, as mentioned before, there is not one single approach to all TJ cases.
    Blockchain devices, which can adequately adapt to several situations and multiple
    purposes, are suitable for dealing with different demands in a faster, secure,
    and transparent way.


    Although new, blockchain technology has a lot to prove. The potential of blockchain
    technology to increase effectiveness indeed, and also underpin prominent technologies,
    such as the Internet of Things (IoT), or Artificial Intelligence (AI), makes it
    a very appealing option for several situations. Having a system that does not
    rely on the government itself, but also integrates the international community
    and the civic public, in a shared view of truth, it is an excellent idea.


    In a state-of-the-art blockchain concept, as analyzed in this chapter, the technology
    demonstrates that it would be extremely beneficial to enhancing efficiency in
    a comprehensive and holistic TJ approach, making reconciliation one more manageable
    process. Inclusion of different society sectors and the international community,
    with the use of an integrated umbrella blockchain system that encompasses all
    TJ pillars and other essential features can be a reality with blockchain technology.
    Faster and secure data transactions through permitted nodes, in a publicly available
    system, can enhance transparency of processes and improve their outreach. Each
    TJ pillar can have its own blockchain system incorporating its specific needs
    and characteristics. Since each piece of information is tokenized, the tokens
    can be freely transacted between the nodes and networks.


    Although blockchain is a technology that enhances the transaction and storage
    of auditable data, its use to empower individuals and participation in TJ processes
    and accord people their economic, social, and cultural rights—can change the socio-political
    and economic relationships in post-conflict societies.


    It is important, however, to consider the challenges that implementing blockchain
    systems face. There are technological hurdles to overcome in regions where there
    is a lack of proper internet connectivity and equipment, as well as the legal
    limitations in some countries. It is also worth noting that due to novelty and
    complexity, blockchain technology is still extremely expensive.


    In TJ, awareness of these issues is amplified by their complex environments, and
    it is well known that could cost the lives of innocent people. Issues of mistrust
    between international actors and States, lack of public participation, lack of
    political will, underfunding, and other problems add more complexity to processes.
    Therefore, one must take into consideration how positive blockchain can be and
    whether other technologies would be more suitable in any given situation. Questions
    of viability and value are crucial in determining whether blockchain technology
    will be the best choice in concrete situations.


    > 95 Lindman et al. 2020.'
