    过渡正义的所有元素必须整体运作才能妥善实施。从这个意义上说，区块链技术可以利用所有过渡正义方法，同时在每种方法中独立运行，被编程为每种情况采取行动，并为每种需求选择最佳理解方式。


    即使对过渡正义的支柱和方法有不同的理解和概念，学者也达成广泛共识，认为过渡正义有四个初步支柱，即诉讼、真相委员会、制度改革和赔偿。.³³ 对这种形式的过渡正义支柱存在批评意见，但这不属于本章的讨论范围。出于客观性考虑，选定的五个支柱是联合国陈述的，并增加了和解作为第五个支柱.³³⁴


    然而，过渡正义方法中的一个持续存在的批评是，它们通常以西方方法确保恢复性正义和惩罚性正义，即通过诉讼和真相委员会实现。这种方法削弱了过渡正义过程，将主体性从当地社会转移到了国际/西方社区，导致当地所有权的丧失。过渡正义方法还未能解决冲突的根源，例如社会经济结构和不平等.³⁶
    从这个意义上说，一个使用区块链技术的综合系统可以确保当地民众的主体性，将当地领导人整合到系统中，可能提供帮助。


