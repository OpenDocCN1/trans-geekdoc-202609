    - Compensation (of economically assessable damage suffered by the victim)

    - Rehabilitation (relating to any medical and psychological problems that the
    victim may have as a result of the harm caused)

    - Satisfaction (in the form of truth-seeking, memorialization, an official apology,
    or juridical administrative sanctions)

    - Guarantees of non-repetition


