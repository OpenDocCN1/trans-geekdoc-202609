    ## 7.7 萨尔瓦瓦案例


    本章总结时，尽管与当前主题并非完全相关，但我们介绍了萨尔瓦瓦的案例，该国在2021年采用比特币作为法定货币。这可能有用且具有启发性，因为萨尔瓦瓦的案例展示了一些与
    CBDC 实施相关的方面：中央银行和当局直接向公众提供法定货币（例如在支付政府津贴和福利时），民众对“官方”数字渠道（如政府赞助的钱包）的适应，以及授予非物理货币法定货币地位。


    ### 7.7.1 国家背景


    萨尔瓦瓦是一个位于中洲的小国²⁹，拥有650万人口³⁰，并以美国美元为其法定货币。中央银行从2001年1月起停止发行萨尔瓦瓦殖民币.¹¹萨尔瓦瓦严重依赖汇款，其人均汇款额位居地区首位，汇入几乎相当于该国所有的收入。根据世界银行数据³²，2020年收到的汇款占GDP的24.1%，在过去五年呈增长趋势，且大多数汇款资金来自居住在美国的萨尔瓦瓦人。因此，萨尔瓦瓦有大量的美元流入，通过传统的汇款通道进行传输。


    从美国汇款到萨尔瓦瓦的成本随着时间推移而降低。根据世界银行数据库，2021年第一季度向萨尔瓦瓦汇款的平均成本为2.91%，而2020年第四季度为3.53%³³全球汇款平均成本为6.38%³⁴另一方面，萨尔瓦瓦的金融包容性很低。根据最新的金融科技调查，2021年拥有金融账户的人口比例为31%，而2017年为29%，这远低于全球拥有金融账户的人口比例从66%上升到74%的数据。


