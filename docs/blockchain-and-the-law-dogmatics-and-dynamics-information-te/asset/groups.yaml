    加入并运营网络的参与者。唯一的局限性是用户的技术能力、设备能力和网络效率.¹¹¹³


    交易是以链的形式记录的加密信息片段（因此得名“区块链”）。随着交易的发展，会产生一个数学问题，导致产生加密数字，即区块的“指纹”。¹¹⁴ 这个数字被称为“哈希值”（hash），每个区块都包含一个数字签名。¹⁵
    这个过程可以通过多种方式完成，但最常见的是称为工作量证明¹¹⁶ (PoW)，在这种机制下，参与者通过竞争，使用他们的 CPU 功率先解决数学问题，然后创建区块。胜者将获得加密货币的财务补偿。交易的验证是通过共识机制实现的，但在区块创建时，所有其他节点都承认其存在。区块可能会被拒绝，其“创建者”将无法获得其努力的补偿。因此，大多数诚实的用户必须控制系统，并且他们必须信任其他用户也在做同样的事.¹⁷¹⁸


    一个重要方面是，区块的哈希值包含了其所属的所有之前区块的信息。因此，更改先前的区块将导致链上区块随之改变（重新计算），¹⁹ 这种更改的成本是巨大的计算和能量消耗，不足以补偿所付出的努力。区块越长，修改区块历史就越困难²⁰，使得技术在实践上是不可篡改的.¹²¹
    因此，发生的交易越多，系统就越可靠。网络不仅对发生了什么达成一致，而且对事件的顺序也达成一致。


    匿名性是确保用户安全的另一个特征。要访问区块链系统并与其他进行交易，用户必须有一对私钥，两个密钥都具有识别码并受加密保护。私钥允许用户访问系统（包含登录和密码等个人信息），并激活公钥，公钥充当用户的身份标识


