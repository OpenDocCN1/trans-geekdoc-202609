    3 What Are the Limits of Blockchain? Considerations on the Use ... 39


    #  3.3.2 Prosecution


    Prosecution of perpetrators, also known as retributive justice, is the most traditional

    way to bring those responsible for crime to account.⁵⁷ According to the UN Guid-

    ance Note.⁵⁸ prosecutions aim to ensure accountability for those responsible

    itting human rights and humanitarian violations, and their being tried

    according to international standards of human rights and humanitarian law. There

    is an extensive tradition of international tribunals that prosecute perpetrators

    of international criminal law. From the Nuremberg trial to the International Criminal

    Tribunal for the Former Yugoslavia (ICTY) and the International Criminal Tribunal

    for Rwanda (ICTR).⁵⁹ These ad hoc tribunals were created for persecutory

    reasons and serve as a foundation for the current international criminal law theory

    and jurisprudence, shaping current procedure.


    Nowadays, the State has the primary jurisdiction to conduct the prosecutions,

    with the assistance of TJ programs, enhancing and reinforcing judicial capabilities.⁶⁰

    In cases of unsettling or unable to prosecute perpetrators, defendants are

    charged by other means, such as hybrid tribunals⁶¹ by the International Criminal

    Court (ICC)⁶² which has subsidiary jurisdiction. In these mechanisms, there is
    an

    international component of accountability of perpetrators by international standards.

    However, the intent is the same; to fight impunity.⁶³


    The ICC has suffered criticisms, due to its undermining role as a human

    security agent for the local populations and its owns in loc personnel, and as

    complementary organism in retributive and distributive justice, intended to assist
    the

    other TJ mechanism and national courts with expertise and infrastructure.


    Still, there are procedural challenges that may arise in prosecuting processes,

    such as securing pieces of evidence, identification of perpetrators, the protection

    of victims and witnesses, international cooperation between States and the ICC,

    preservation of evidence and sharing of information.⁶⁴


    Blockchain technology can provide a data share network for specific markets,

    where all information can be accessed and transacted by all nodes. In a public\permissioned
    system, transactions have an additional degree of trust.


    In that sense issues of securing and sharing information are solved, and with

    only specific nodes being able to insert data, information exchanged is controlled

    by those entities involved in the prosecution process. Notwithstanding, all data


