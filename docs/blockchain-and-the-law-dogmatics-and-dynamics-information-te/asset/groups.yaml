    ## 8 智能合约与法律


    针对这一主张，其他学者认为有必要“提醒合同法的基本原则”，并承认智能合约“对合同或整个法律系统的潜在影响是有限的”^69 事实上，即使是 Lex Cryptograph、Wright
    和 De Filippi 也认为，区块链应用不太可能消除法律和政府，但可能会“转移”法律与架构之间的平衡，需要替代性的监管机制来成功管理合同.^70 区块链是一项变革性技术，能够重新配置既有的经济、法律、制度、货币以及更广泛的社会政治关系.^71
    基于区块链的智能合约旨在代表一种新的社会组织形式。智能合约监管属性的规范合法性正受到质疑，尽管（或者或许恰是因为）这一事实——“代码”可能会产生相同的监管效果.^72
    令人担忧的是，智能合约的治理权威源于技术而非法律。智能合约由于其基于区块链的自动执行和记录不可篡改性等独特特征，被视为一种强制形式。它们没有为合同法背景规则的筛选、修改和验证提供充分的程序，而这些规则的性质是不确定的。因此，管理智能合约的规则是通过缺失而产生的，未能考虑到并区分此类被“覆盖”的合同法基础的初级合同^73
    在布链网络治理结构中，智能合约参与者之间的财富与权力分配、利益与义务分配被认为在规范上是可疑的，因为智能合约委托了法律监管，它们应当推定“除非另有规定，否则具有规范确定性”^74


    智能合约还凸显了公共领域与私人领域之间的紧张关系以及边界转移的潜力。它们使个人之间的新形式经济交换成为可能，个人可能会挑战既有的交易形式，并测试既有的公私领域划分。Karlstrom
    指出，在区块链代码的约束下，这种不受限制的交易自由实际上可能产生相反的赋能效应，使商业关系变得“僵化、不可逆转且不可协商”。区块链等技术可能导致社会关系“日益僵化，代价是丧失活力以及对自由和责任感的丧失”^75
    基于区块链的智能合约除了提供实现点对点交易的协议规则功能外，与公共利益、共同利益没有任何联系。区块链治理模型的底层哲学与既有的社会和制度设计相矛盾，因为它“与无政府主义和自由意志主义的社会秩序理论高度对齐”，而自由意志主义的经典公式否定了国家干预个人自由的任何可能性⁷⁶


    > ^69 Mik 2019, p. 22.

    > ^70 Wright and De Filippi 2015, p. 51.

    > ^71 Reijers et al. 2016; Reijers and Coeckelbergh 2018.

    > ^72 Verstraete 2019, p. 794.

    > ^73 Ibid.

    > ^74 Verstraete 2019, p. 795.

    > ^75 Karlström 2014.


    ## 8.5 选定的智能合约立法


    ### 8.5.1 美国


    尽管对承认智能合约的兴趣日益增加，但只有少数国家对智能合约制定了监管应对措施。在美国，由美国各州发起的智能合约立法倡议相对狭窄，仅管理选定的问题，大多限于定义智能合约以及承认其电子形式和签名。直到
    2019 年 4 月，美国各州已考虑了 133 项与区块链技术相关的法律。然而，只有 7 项与智能合约有关，且其中极少数已成功通过⁷⁷


    亚利桑那州是美国智能合约立法的先驱⁷⁸ 2017 年，亚利桑那州通过了一的一项法律（法案 HB 2417）⁹，修订了《亚利桑那州电子交易法》，明确了在商业交易中使用区块链技术（包括智能合约）的。新法具有声明性特征，提供了区块链智能合约的定义，并在现有的法律框架内将其承认为另一种电子商业交易形式，承认了其地位。该法将智能合约定义为“运行在去中心化、共享和复制账本上的事件驱动程序，可以对资产进行托管和转移’”。田纳西州在
    2018 年 3 月通过了类似的立法（法案 SS 1662）⁸⁰ 为市场中的智能合约提供法律认可。田纳西州承认智能合约法律上是有效的且可执行的，‘可以存在于商业领域’。亚利桑那州和田纳西州做法遵循了阿肯色州
    2019 年的立法（法案 HB 1944）⁸¹ 以及北达科他州的法案（法案 1045），以促进智能合约的发展。


    少数州表现得更为进步，并以更全面的方式处理智能合约。例如，内华达州在 2017 年 6 月通过了一项法案（SB398）⁸，修订了《统一电子交易法》，允许在区块链上创建、存储或验证的智能合约具有执行力并可作为证据采纳。内华达州是第一个禁止地方政府对区块链征税的美国州。该州的法案与伊利诺伊州实施的《区块链技术法》（BTA）高度相似。与其他州的碎片化方法不同，BTA
    处理了智能合约的所有三个问题：执行力、可采性和当地监管。智能合约被简单定义为存储为电子记录的合同，可能仅仅因为使用了区块链而被拒绝法律效力或执行力或在程序中被排除。在某些公共情况下，如取消公用事业、违约或驱逐通知、取消医疗福利或召回产品，通知或收确认可能不能通过区块链发送。最后，BTA
    禁止地方政府对区块链和智能合约的使用实施任何限制或要求。最后，怀俄明州脱颖而出，通过通过立法提供了一个旨在促进创新和推动区块链行业的全面法律框架。它具有许多特点，并将智能合约定义为“自动交易或任何实质上类似的类似物，由代码、脚本或编程语言组成，用于执行协议条款，可执行部分包括根据特定条件的发生或未发生对资产进行托管和转移，或发布这些操作的可执行指令”。


