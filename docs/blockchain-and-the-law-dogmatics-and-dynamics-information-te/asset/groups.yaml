    While a fast pace in technological development can be a positive factor, this
    is not helping central banks in their decision-making process of designing CBDCs.
    Typically, central banks operate in a centralized ledger system, while DLT solutions,
    of which blockchain is arguably the best known, brought to fore a new technological
    choice. Since DLT is still in a developing phase, it brings a lot of uncertainties
    related to its capacity and suitability. That said, there is not a universal approach
