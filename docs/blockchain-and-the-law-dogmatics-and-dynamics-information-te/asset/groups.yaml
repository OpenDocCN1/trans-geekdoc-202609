    92


    G. Maia 和 J. Vieira Santos


    根据 65/EU 指令，已申请了 DLT 试点制度的豁免。这意味着这些实体是具有有限授权的法律人，因为它们只能根据 DLT 试点制度运营 DLT 市场基础设施。除非这些实体提交了根据
    (EU) No 909/2014 号条例成为证券结算机构（CSD）的完整申请，或根据 2014/65/EU 指令成为投资公司或市场运营者的申请，否则其授权在期后应撤回。


    DLT 试点制度针对 DLT 市场基础设施引入了这一新地位——DLT 试点制度第 2 条第 5 点。它包括 DLT MTF（市场交易场所）、DLT SS（结算系统）和
    DLT TSS（交易与结算系统）。对于这一新地位同样重要的是另一个概念的引入——DLT 金融工具，对应于通过分布式账本技术进行记录、传输和存储的金融工具——DLT
    试点制度第 2 条第 11 点。⁸


    因此，DLT MTF 是仅允许交易 DLT 金融工具的 MTF（DLT 试点制度第 2 条第 6 点）。另一方面，DLT SS 是对 DLT 金融工具进行交易结算的系统，无论这些结算系统是否已根据
    98/26/EC 指令被指定和通知（以免不受该指令中“系统”定义的限制），它们都允许对 DLT 金融工具进行初始确认或提供与其相关的托管服务——DLT 试点制度第
    2 条第 7 点。最后，DLT TSS 是结合了由 DLT MTF 和 DLT SS 提供服务的 DLT MTF 或 DLT SS——DLT 试点制度第 2
    条第 10 点。


    由于这是一个实验性制度，对于准入金融工具的类型和价值预见了以下限制——DLT 试点制度第3 条：


    - 发行的股份市值或临时市值小于 5 亿欧元；

    - 债券、其他形式的证券化债务或货币工具（衍生品或复杂产品除外）发行规模低于 10 亿欧元；

    - 资产管理市值小于 5 亿欧元的集体投资计划单位。


