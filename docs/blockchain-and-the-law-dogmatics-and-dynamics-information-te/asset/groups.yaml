    be stopped once the coin has been inserted. Szabo proposed one of the first definitions
    of smart contract: ‘a set of promises, specified in digital format, including
    protocols which the parties perform on these promises$^{12}$.


    Smart contracts pre-exist blockchain technology, but blockchain has enabled the
    progress of smart contracts from simple automated contracts to fully autonomous
    self-executing and performing contracts beyond decentralized platforms and supported
    by a blockchain ecosystem$^{13}$. Blockchain enables smart contracts with its
    unique characteristics that guarantee their integrity and security. Blockchain,
    as it is known, has brought to life by the 2008 Bitcoin manifesto by the mysterious
    Nakamoto, whose identity remains unknown$^{14}$. Explained simply, blockchain
    technology is a specific type of distributed database, where data is stored in
    an immutable chain of blocks chronologically linked with each other and secured
    against tampering by cryptography. Every time a new block is added to the chain,
    it is validated by nodes in accordance with pre-programmed consensus protocol.
    Conceptually, blockchain provides one set of agreed on, reliable, and verified
    records of data and eliminates the need for any third party, intermediary, or
    authority to verify or store the records. Bitcoin network is the first application
    of blockchain technology and cryptocurrencies constitute the most common use of
    blockchain. However, platforms such as Ethereum, which Turing complete programming,
    enabled wide use of blockchain technology and significantly increased its potential
    beyond cryptocurrencies, including building smart contracts (although building
