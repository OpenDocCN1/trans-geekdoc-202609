    # 4 加密资产的征税——葡萄牙视角


    约束性裁决的实际局限性：税务机关（TA）在发布具有约束力的裁决时，并没有义务遵守所有属于该准则范围的情况。相反，税务机关与裁决内容之间的联系是*当事人之间*（*inter
    partes*）的，因为税务机关仅就请求纳税人的特定案例¹¹，被禁止以与裁决不同的方向采取行动。


    简而言之，尽管现有的约束性裁决具有实际意义，但税务机关的约束力仅限于该请求所涵盖的事实（如果存在事实问题，纳税人可以根据《通用税务收纳法》（GTL）第 68(29)
    条对裁决提出上诉）。因此，在阅读和解释裁决时需要谨慎，尽管税务机关在行为上具有“可受责性”，但必须考虑到诚实、真实和公平等原则¹。


    最后，如果税务机关就面对面、电话或通过“电子柜台”（e-balcão）¹²就特定案例提供解释（因此不属于 GTL 第 68 条的范围），该答案不具有约束力，且同样建议保持谨慎。为了用实际案例说明这一点，网上可以找到关于“电子柜台”个人所得税（PIT）回复的新闻，结论认为比特币交易将增加为应税资本，因为它应被归类为非居民实体的利润分配¹³。正如所示，这种解释被一项约束性裁决所驳回。


    ## 4.3 根据公司所得税法对加密资产征税


    ### 4.3.1 公司所得税法：简要介绍¹⁴


    葡萄牙的所得税（CIT）征收于纳税人获得的所有收入（《公司所得税法》第 1 条）。《公司所得税法》第 2 条规定了以下若干实体为纳税人，例如：(i) 在葡萄牙领内设有总部或有效管理的商业公司或商业形式民事公司、合作社、公共公司以及受公法或私法管辖的其他法人；


    (ii) 在葡萄牙领内设有总部或有效管理但无法律人格的实体，其收入在自然人和法人的所有权下分别不征收个人所得税或公司所得税；¹⁵；以及 (iii) 在葡萄牙领内没有总部或有效管理且无法律人格的实体，其在该境内获得的收入不征收个人所得税。


    税基取决于主体的类型，根据《公司所得税法》第 3 条，但对于属于 (i) 类且主要从事商业、工业或农业活动的实体¹⁶，公司所得税对利润征收（利润由税期末和期初净资产之差，加上该法确立的修正额组成）。


    该法第 4 条规定，对于在葡萄牙领内设有总部或有效管理的法人和其他实体，公司所得税对其所有收入征税，包括在 във领土外获得的收入（全球收入原则）；而对于在葡萄牙领内没有总部或有效管理的实体，公司所得税仅对其在该境内获得的收入征税（来源地地原则）。普通公司所得税税率为
    21%，对于税基在 25,000 欧元以下的中小型企业适用 17% 的优惠税率（见《公司所得税法》第 87(1) 和 (2) 条）。


    ## 4.3.2 加密资产的利润与会计视角的重要性


    《公司所得税法》下的纳税人可以通过加密资产获得多种收入，这些收入可能构成其应纳税利润。例如，它可能从销售加密资产中获得收益，从销售涵盖加密行业或去中心化的产品或服务获得收入，或者对其进行挖掘。在所有这些情况下，根据《公司所得税法》的征税方式与纳税人通过生产销售椅子、提供形象咨询服务或其他任何业务活动获得收入的情况完全相同，因为这些活动属于具有商业性质的经济经营，并完全被《公司所得税法》（即其第
    3 条）所涵盖。


    > ¹¹ 税务机关提供的通用信息有一套不同的制度。

    > ¹² “电子柜台”（e-balcão）是一个工具。

    > ¹³ 2019年。

    > ¹十四 投资者.pt。

    > ¹⁵ 例如，无法律人格的协会和公司。

    > ¹⁶ 由《公司所得税法》第 3(4) 条定义，包括相关的经济经营。


    根据《公司所得税法》下的纳税人可以通过加密资产获得多种收入，这些收入可能构成其应纳税利润。例如，它可能从销售加密资产中获得收益，从销售涵盖加密行业或去中心化的产品或服务获得收入，或者对其进行挖掘。在所有这些情况下，根据《公司所得税法》的征税方式与纳税人通过生产销售椅子、提供形象咨询服务或其他任何业务活动获得收入的情况完全相同，因为这些活动属于具有商业性质的经济经营，并完全被《公司所得税法》（即其第
