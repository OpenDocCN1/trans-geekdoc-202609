    as some events have shown, a separation of the protocol in two, where one part
    runs with the same rules, and other remains unchanged. Blockchain can then signify
    a lead to hard forks, the SegWit update and the “blocksize wars,”^19 and a distributed
    technology with decentralization features, both technically and in terms of governance.


    The majority of blockchain protocols that followed developed differently, even
    if they used technical and ideological inspiration from Bitcoin and Nakamoto.
    A common framework of terms is used to distinguish between first-generation protocols
    (basically, Bitcoin) from second-generation (Ethereum) and third-generation (e.g.,
    Cardano, Algorand).^20 The second generation of protocols yielded the era of “smart
    contracts,” that is, programmable digital contracts that enable the creation of
    applications such as programs, protocols, and tokens. This third generation brought
    change: a consensus mechanism, whereas consensus does not depend on computational
    energy (as in Bitcoin, the proof of work consensus mechanism) but rather on the
    number of tokens that participants in the network have. There are also other protocols
    with access to which are not public (anyone can download the protocol and run
    it, as has sufficient computing power to do) but private (people need permission
    from the protocol’s creators to join the network).^21


    For second and third-generation protocols, decentralization exists only in the
    first meaning. In the second meaning, its existence is less obvious. Although
    there is, supposedly, no central authority over the protocols, the protocol founders
    are “public” figures, usually with a solid online presence and important commercial
    aspirations. In some cases, protocols are supported by private entities (foundations,
    companies) with sufficient funds and human capital (developers) to act and influence
    how the protocol is to be run. For example, as the Ethereum foundation supported
    a hard fork to change a bug in code^22 or the way Justin Sun acquired Ste are
    good examples of this influence.^23 Therefore, it is unclear that they are decentralized
    as a arising principle from respect.


    > ^18 For a description of the functioning of Bitcoin, see by Narayanan et al
    2016, pp. 1–54.


    > ^19 Bier 2021.


    > ^20 See, in general, Ols 2021.


    > ^21 EU Blockchain Observatory and Forum 2020b, 7–16.


    > ^22 Meier and Schluppi 2019, 27–44.


    > ^23 Copeland 2020.'
