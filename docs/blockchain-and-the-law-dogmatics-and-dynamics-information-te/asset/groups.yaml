    # 前言


    区块链和分布式账本技术（DLTs）是我们时代主要的科技发展之一。DLT 是一种计算机协议，旨在通过连接在点对点中心化数字结构中的不同参与者以分布式方式存储和管理数据。区块链是对一种
    DLT 的命名，其灵感源于比特币加密货币及其创始人中本聪（Satoshi Nakamoto）背后的协议。加密货币的价值和波动性首次引起了公众的注意力；从那时起，出现了改进和扩展“创世”协议容量的新技术，将区块链和加密货币演变成了一个被称为“区块链”的技术领域。


    目前，该领域存在巨大的潜力。随着改进和扩展“创世”协议容量的新技术不断出现，将区块链和加密货币演变成了一个被称为“区块链”的技术领域。目前，区块链项目数量众多。去中心化金融（DeFi）协议已成为主流。区块链技术的创新和颠覆潜力已得到广泛认可。然而，任何新技术都带来了必须解决的法律挑战。法律与区块链之间存在着复杂的关系：隐私、去中心化和自动化核心原则与传统的法律标准存在冲突。


    从2018年至2020年，我们三个人在诺瓦法学院组织了关于区块链法律层面的研究生课程。这些课程是葡萄牙大学开设的首此类课程，许多葡萄牙和国际学者、企业家、律师和监管机构参与了其中。本书浓缩了课程的“精华”，涉及区块链对法律标准和规则的复杂应用。


    本书遵循课程的内部结构，包含八个专门探讨区块链或 DLT 创新与法律之间议题的章节。


    本书由 Martinho Lucas Pires 的章节“区块链与法律：奠定基础”（第1章）开始。可以将其视为对区块链法律辩论现状的概述，并尝试总结区块链与其现有法律标准之间的真实挑战和过度炒作。


    Nelson M. Rosario 在第2章中探讨了基于区块链的投票结构的承诺与陷阱。第3章中，Renato Gomez Martinez 讨论了区块链在司法程序中的应用，探索了其在刑事起诉、信托委员会和恢复民主机构中的作用。第4章中，Marta
    Cosmo 查看了葡萄牙对加密资产税务处理的演变，解释并解构了葡萄牙税务当局导致该国家在某些媒体圈被称为“加密货币避税港的方法。


    在第5章中，George Daniel Rath 深入探讨了南非背景下区块链执行判决的问题。João Vieira dos Santos 和 Guilherme
    Maia 在第6章中考虑了欧盟建立 DLT 政策框架的立法计划及其对 DeFi 产品的可能影响。Anjeja Bajaj 和 Bernardo Corre
    Barradas 在第7章中研究了中央银行数字货币（CBDC）及其对匿名性的影响。最后，Agata Ferreira 在第8章中结束本书，讨论了智能合约与法律之间的特定关系，探讨了智能合约的优势并应对了围绕其执行和使用的学术争论。


