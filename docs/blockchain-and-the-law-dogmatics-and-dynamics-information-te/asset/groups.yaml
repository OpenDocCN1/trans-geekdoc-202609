    +   ¹⁶ 根据以太坊白皮书，工作量证明是该领域的一个突破，因为它提供了一种简单且适有效的共识算法，允许网络中的节点集体对比特币账本的一系列标准更新达成共识。它提供了一种允许自由进入共识的机制，同时防止了女巫攻击”。Buterin
    2021.

    +   ¹⁷ 它是上述描述的拜占庭将军问题的解决。对系统的盲目信任确保了正确决策且不会损害网络。

    +   ¹⁸ Werbach 2018, p. 501.

