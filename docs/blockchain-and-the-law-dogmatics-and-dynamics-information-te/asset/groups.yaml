    # 5 Blockchain Execution of Judgement—A Possibility in South Africa?


    no bank guarantee is required nor it be presented for payment if the claimant''s
    suit is successfully dismissed—rather, the dismissal will be acted on-blockchain
    and the costs to the defendant paid to by means of pre-agreed smart contract execution.
    Party B may particularly be inclined to agree to this where it believes the claimant''s
    suit has little prospect of success.


    # 5.5 Conclusion


    It is clear from what is set out in this chapter that conventional methods of
    execution in South Africa holds little appeal to a litigant with an order in his
    favour. The process is, as explained, time consuming and expensive.


    An alternative to the status quo could be on-blockchain execution using smart
    contracts. The benefits to the parties are evident—speed of execution and certainty
    of payment is a boon to any litigant.

    This is particularly where both parties stand to gain, such as where a claim and
    counterclaim is encountered, or either party stands to profit from costs put up
    in litigation.

    While the proposal is novel, certainly in a South African context, cryptocurrencies
    and blockchain technology become more widely used and gain legitimacy in commerce,
    so could the use of smart contract execution, to the benefit of the litigious
    process as a whole.


