    M. Lucas Pires


    So far, I have not touched on tokens and cryptocurrencies. The Bitcoin protocol
    generated, as an incentive, its token: a digital representation of value stored
    in a user''s wallet and registered in the protocol. The token''s purpose was to
    be used as a payment mechanism, and hence; all protocol tokens (stored through
    cryptographic means) were called cryptocurrencies. In the crypto world, the token
    serves two functions: an economic incentive for the decentralized consensus mechanism
    to work and a product—in other words, as the element that makes the protocol valuable.


    The value of Bitcoin comes from its role as a currency—payment mechanism, story
    of value or unit of account (the jury is still out for which is Bitcoin better
    equipped to handle). However, other tokens have different uses. For example, Ether
    is used for storage space and transaction fees in the Ethereum network; Filecoin
    enables users to store data in the Filecoin protocol; Tezos enables holders to
    vote on the protocol''s governance; Ada, when staked with a pool, generates dividends
    for its holders. Some tokens represent assets that are used as collateral or issued
    through public offerings. In short: tokens represent different value types, such
    as rights, agreements, property... To consider them as currencies is inadequate,
    the preferred being crypto assets, given the multiplicity of utilities they can
    have.


    Nevertheless, market practice has divided tokens in terms of function. This division
    has subsequently been adopted by public institutions, including EU regulators,
    in enacting the Market in Crypto Assets Regulation (MiCA).^24 The classic functional
    division is between tokens (resembling securities), recovery tokens (resembling
    securities), and utility tokens (basically the others). The classification is
    somewhat simplistic and too artificial, for there are tokens that can fit more
    than one category. For example, a token created to function as a currency, but
    providing dividends when staked, is (or should be considered) just a currency
    token. Is a utility token issued through a public offering just a utility token?
    These categories were illustration purposes when the market was beginning to appear
    in 2017; in 2021, with some protocols working in full force and more users using
    decentralized finance (DeFi) protocols and tokens, it seems complicated to sustain
    such classification.^25


    Tokens are, arguably, the most known fact of the blockchain phenomenon. They are
    the central pieces for the functioning of the protocols and have become an easy
    source of liquidity. Tokens can be exchanged in between, with people with minimum
    or no intervention from intermediaries, reducing transaction costs. Nevertheless,
    despite their functionality, they have a speculative tendency, generating a kind
    of (and less sophisticated) financial market that is still beginning to attract
    other more traditional institutional players such as banks and corporations. Another
    critical factor of the crypto market (and another ironic twist on the decentralization
    promise of DLT) is that several entities of the token economy are centrally managed
    (such as example, wallet providers, exchanges, and custodians).


    ^24 European Commission, Proposal for a Regulation of The European Parliament
    and of the Council on Markets in Crypto-assets, and amending Directive (EU) 2019/1937,
    COM/2020/593 final.


    ^25 See Chap. 6 by Vieira dos Santos and Maia in this book.


    # 1 Blockchain and the Law: Setting the Floor


    It is unclear to what extent the attention afforded to the economic value of tokens
    does not soak all the interest in protocol development and adoption.


    # 1.4 The Law in Blockchain


    Blockchain is a technology and an economic reality. As a communication technology,
    it is used to progress human interaction; as an economic reality, it is a production
    of value. In both ways, blockchain is a social phenomenon and, therefore, a legal
    one too.


    Where is the law in blockchain? Put: whenever there is an agreement between two
    or more people. People download the protocol and run it, accepting that action
    to participate in a joint enterprise. By participating in the enterprise, they
    subject themselves to the protocol of rules and functioning. If a malicious intent
    wrongs their legitimate expectations, they have the right to claim damages from
    those who wronged them. Suppose they were not wronged, and there were legitimate
    expectations that they were, downloading the protocol, participating in a risky
    activity. In that case, they are at their peril without solid protection.


    Users of the network transact with one another. Transactions are subject to legal
    rules and principles. They use a smart contract, but a smart contract is a way
    of executing the transaction and not a legal agreement subject to specific rules
    that are “alegal”. After all programmable code is a language written by people
    and can represent declarations and agreements.²⁶ Concerning interactions with
    people, download a wallet, open an account in an exchange, download a phone to
    the custody of their tokens: these are all legal agreements, subject to contract
    rules. As categories of value (e.g., securities, property titles, identity marks),
    must abide by the applicable regulatory standards. Apart from El Salvador and
    the Central African Republic, crypto-assets do not enjoy legal status in any jurisdiction.
    However, that do not make them, per se, forbidden payment methods (legally, they
    are just equivalent to barter; if people agree to pay and be in crypto, there
    is, general, no consequence).⁷


    The picture above is simple, I admit, and does not consider some complex situations.
    For example, regarding the rights and duties of participants in the network: if
    a miner fails to mine a block and insert a transaction for a user, can he/she
    damages the miner for loss? If the protocol’s code has a bug, and that bug enables
    the running of illegal transactions, which is to be responsible? The protocol’s
    creator, the foundation/company that created and takes care of the protocol’s
    maintenance? The freelance programmers and developers who dedicate their time
    (often subsidized by grants from the founding companies, foundations, or protocol
    investors)? What about voting and participation? Do I have a right to transparency
    by staking and voting in protocol governance? In the case of a hard fork that
    I did not agree with, can I claim damages against people that supported it? Moreover,
    what is the rules (contract rules, corporate rules) applicable to the situation?


    The question of applicable law and jurisdiction is a matter of international private
    law that holds an essential set of rules for deciding the applicable law to the
    relation and the forum for exercising its rights. An article by Andrew Dickinson
    elucidates showing that, despite the difficulties, it is possible to discern what
    are the rules applicable to a situation connected with a blockchain.^28 The legal
    questions surrounding the rights and duties of all actors in the protocol—miners,
    holders and members of decentralized autonomous organizations (DAOs)—must be in
    the light of the specific jurisdictional rules applicable to this scenario, regarding
    contractual private and legitimate expectations, and duties applicable to joint
    ventures and other forms of informal or irregular association.^29


    It is also essential to consider the differences between protocols when assessing
    the legal implications of the rights and duties of users. For example, in terms
    of expectations and agreements: the majority of the most-valuable protocols by
    market cap are either corporate-backed with marketing structures in place. Individual
    users rarely deal directly with the protocol; instead, they deal with thirdparty
    (or, if you do not want to avoid the irony of it: intermediaries) that are directly
    connected with the protocol. Most users will be legally protected (at least on
    paper) by the agreements signed with service providers. As users (e.g., companies,
    institutions, and States) that wish to participate in the protocol, they are also
    protected when they relate directly with the protocol''s backers: the foundations
    and companies that created the protocol and have an interest in it to succeed.
    Expectations are agreed upon and legally established ex-ante, with a clear identification
    of the parties and their corresponding contractual duties. Therefore, the risks
    of governance decentralization are somewhat mitigated.


    The bottom line is when fully considered in their meaning and understanding the
    extent of practical implications, the challenges of "decentralization" and automated
    processing (or smart contracts) are not complex as initially believed. Decentralization
    is not an antonym to law; it has existed for a long time, particularly in political
    systems such as federalism and feudalism. This means that power of deciding, commanding,
    or ruling is not (or entirely) in the hands of one central entity or group but
    distributed by many points.^30 It is a complicated system, for it involves two
    or more power centers relating and executing powers in a separate or coordinated
    manner. Nevertheless decentralization is never absolute; some degree of centralization
    exists for efficacy purposes. Federalism is, once again, a good way of explaining
    the balance established between the two centers of political authority (the center
    and the periphery—the federation and the federated States). What matters is the
