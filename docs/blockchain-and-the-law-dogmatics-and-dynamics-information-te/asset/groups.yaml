    # 3 What Are the Limits of Blockchain? Considerations on the Use ...


    The conclusion demonstrates that blockchain technology has enormous potential
    in different fields, including transitional justice. Its capability to operate
    in various areas, such as data sharing, digital identification, fundraising and
    distribution of money and goods, as well as the time-stamping of documents in
    a faster, secure, and public way, has significant value for transitional justice
    scenarios. However, one must bear in mind that blockchain has technological limitations
    and how it might affect transitional justice programs. In, the only way to properly
    analyze how blockchain can assist in a transitional justice project is by understanding
    each case individually, and by examining the characteristics of blockchain technology
    with its limitations in a specific scenario.


    # 3.2 What Is Blockchain?


    First, it is important to define what blockchain technology, especially its technological
    aspects, and then, move forward to deciding what its application would be possible.
    There are several potential applications in the context of Transitional Justice
    (TJ) processes, such as the identification of populations and digital registration
    of documents (i.e., land registries).


    The first time that blockchain technology was presented to the world was in Satoshi
    Nakamoto''s paper on Bitcoin. This paper became the core model for the development
    of blockchain into practical transactional situations; it was completely virtual,
    and could be trusted in a trustless (ie., decentralized) environment. Satoshi''s
    article is based on previous studies on the Byzantine Generals Problem and digital
    timestamping. The first study intended to understand how computer science can
    operate in adversarial environments, dealing with conflicting information, how
    the lack of trust in distributed systems can be overcome, and unanimity reached;
    when the second study on time-stamping deals primarily with the notion of a blockchain-like
    state where digital data could be efficiently time-stamped using cryptographic
    technology.


    In a nutshell, blockchain works as a “peer-to-peer” version of electronic transactions
    using a “block” system, removing all forms of intermediary or central authority
    from its financial transactions, and is, therefore, described as governance. The
    program works on an open-source system, allowing any


