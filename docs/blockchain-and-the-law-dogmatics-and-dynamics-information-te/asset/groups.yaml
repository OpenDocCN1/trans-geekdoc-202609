    \n## 4.2 葡萄牙税制相关特征概述\n\n### 4.2.1 税法合法原则及其在加密资产背景下的重要性\n\n加密资产是一个现实。法律体系应当具有灵活性以适应现状，但在税法情况下，这种灵活性应受合法原则的限制。事实上，“主权和权力原则要求法律必须经过议会讨论并批准。”因此，葡萄牙宪法第\
    \ 103 条确立了这一原则。\n\n合法原则不仅意味着税收规则应由议会批准，还意味着税收的要素要素（见葡萄牙宪法第 103(2) 条：“税种由法律制定，规定税率、优惠和保障”）。该原则的保障功能与应纳税额的可预测性（以及法律确定性）相关。根据这一逻辑，通用税法（“GTL”）第\
    \ 11(4) 条规定：“法律涵盖的税收漏洞不适用于类比整合；当税务机关面临案件时，如果事实符合法律规定，则产生税事件；如果事实不符合任何法律（即使通过解释也不符合），则不产生税事件（因此纳税人无需缴税）。”\n\
    \n因此，例如，如果出售了加密货币，只有在法律涵盖此类收入时，所得才会被征税。但如果法律没有涵盖某一现象，则没有税事件。总而言之，在加密资产背景下，*无法不不税*\
    \ 非常重要。\n\n¹ Dourado 2014,2。\n² 在葡萄牙的情况下，宪法第 165(1) 条规定议会拥有税种创建的立法权，除非政府授权。\n\
    ³ Fonseca and Otero 2008,85–86。通用税法第 8(1) 条建立了与葡萄牙宪法第 103(2) 条类似的选项。\n⁴ Dourado\
    \ 2007,79。\n⁵ 自由译。\n⁶ 尽管如此，应记住葡萄牙法律使用了不确定概念，授予了裁量权并允许签署财政合同（带有某些边界）——例如 Pires\
    \ and Calçada Pires 2012,114。\n\n### 4.2.2 法律确定性原则与约束性规则\n\n税务适用中的法律确定性原则（与合法原则相关）是法治的推论，它意味着拒绝任意性和维护税收透明度，允许个人预先知道其是否适用宪法第\
    \ 103(2) 条规定的诚实原则。\n\n鉴于加密资产底层新现实的规定，特别是考虑到决策者并不总是能很好理解这些经济事件，这一原则变得更加重要。因此，税务机关（TA）约束性规则的重要性脱颖而出，因为它们阐明了税法的解释。\n\
    \n通用税法第 68 条允许任何纳税人通过陈述相关事实（只要不涉及征税）对其特定的税务状况请求约束性裁决。相关裁决应在 150 天内发布。税务机关随后不能采取与约束性裁决不同的方向（请求范围内），除非符合司法裁决——参见通用税法第\
    \ 68(1)、(3) 和 (14) 条。所有约束性裁决应通过电子手段（即在税务机关官方网站）发布，并保护纳税人的个人数据——通用税法第 68(17) 条。根据该规则，税务机关对法律的解释是公开的，通过确保税务机关未来行为的可预测性为纳税人带来了更大的法律确定性。\n\
    \n⁷ Gomes 1993,145。上述通用税法第 11(4) 条是法律确定性原则的守护者。\n⁸ Pires and Calçada Pires 2012,123–124。这同样源于这一原则，即宪法第\
    \ 103(3) 条规定的对税法溯及既力的禁止。\n⁹ 这仅在请求紧急时是强制性的，此时裁决应在 75 天内发布，否则裁决将被视为默认认可。此外，需缴纳费用（金额随复杂性而异）。参见通用税法第\
    \ 68(2)、(7)、(8) 和 (10) 条。\n⁰ 约束性裁决仅以（葡萄牙语）发布在 https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/informacoes_vinculativas/Pages/default.aspx。\n\
    \n"
