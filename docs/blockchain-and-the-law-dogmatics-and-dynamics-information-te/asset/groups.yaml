    怀疑者认为，智能合约并不等同于法律意义上的合同，并且“如果没有法律形式的生存或承认，智能合约是一份没有约束力的合同碎片，声称具有证明的证明”，它们只有在带有“调节社会行为的规范手段，而这种手段与法律监管范围相竞争”时，才具有法律相关性。^47
    Meyer 将智能合约比作一种“技术辅助，可以说是一个‘App’”，因此它们在法律意义上不是合同，而是一个“计算机泡泡”——一种基于法律语言的计算机日本，它没有法律影响，因此不是合同。^48
    一些理论家（如 Saveljev）更进一步表示，“智能合约没有在双方之间建立纽带”，取而代之的是“技术纽带”，而且这种纽带比法律纽带稳固得多.^49 Werbach
