    # 4 Taxing Crypto-Assets—The Portuguese Perspective


    **Table 4.3** Mining VAT Treatment in Some EU Member States


    | State | Taxation |

    | France | Revenue received from cryptocurrency mining activities is subject to
    VAT as a supply of services. |

    | Germany | Revenue received from cryptocurrency mining activities is generally
    outside the scope of VAT. |

    | Spain | Revenue received from cryptocurrency mining activities is generally
    outside the scope of VAT. |

    | Sweden | Revenue received from crypto mining activities is generally outside
    the scope of VAT. |


    Source The Author<sup>42</sup>


    # 4.6 Conclusions


    In the crypto-assets context, one should note the importance of the principle
    of tax legality if the facts do not fulfil the predictability of statutory law,
    there is no taxable event (the taxpayer is not subject to tax). The principle
    of legal certainty is also relevant, especially in new and complex areas. Binding
    rulings by the Portuguese TA are an important instrument to any taxpayer who clarify
    the interpretation of tax law. They are publicly known, which brings legal certainty
    to taxpayers, through the unpredictability of the TA behavior. However, the TA
    is only bound on those facts and to the taxpayer who submitted the request.


    A taxpayer under the CIT Code may obtain several sorts of income with crypto-assets
    and all of them for its taxable profit since those activities are economic operations
    of a business nature and then perfectly covered by the CIT Code, namely its article
    3. Still, as the OCC noted, the accounting income should consider the accounting
    standards, namely the IFRIC updates.


    In the case of natural persons, income from crypto-assets is taxed by the PIT
    Code only if we fit it into one of the six schedules of income. The TA concluded
    that income resulting from the sale of cryptocurrencies is not capital gains because
    they not securities. Still, one may question whether some crypto-assets are atypical
    securities under article 1(g) of the Securities Code. TA''s interpretation gives
    more legal certainty because there is no need of caustic analysis. Still, in light
    of the CMVM communication and considering that the wording used by the TA is “at
    this time”, it is no indication that the TA changes its position. There is no
    indication that it is going to happen. Instead, the TA concluded that the sale
    of crypto-currency is not taxable by the Portuguese tax system unless its regularity
    constitutes a professional or business activity of the taxpayer, in case it will
    be treated as business or professional income. Additionally, considering that
    the income of any schedule can be paid in cash or in kind, if a PIT income is
    paid with crypto-assets, we should apply article 24 of the same Code, which provides
    successive rules for cash equivalence for income in kind.


    > 42 Based on June 2018.'
  - '[PAGE 80]


    Lastly, the Hedquist case, ECJ concluded the sale of bitcoins was a supply of
    services exempt by article 135(1)(e) of the VAT Directive, although they are not
    money since virtual and traditional currency should have the same treatment for
    the purposes of exemption. Following this case, the Portuguese TA considered that
    the sale of cryptocurrencies was also exempt under Article 9(27)(d) of the VAT
    Code. Finally, also in the same case, the Portuguese TA Committee that mining
    would benefit from the same exemption. However, as shown by the VAT Committee
    (and the position of Other Member States), from that it is possible to conclude
    that mining is out of VAT scope, exempt under article 135(1)(e) or even under
    article 135(1)(d). Therefore, in VAT there are some uncertainties on many activities
    related to crypto-assets.


    # 4.7 Afterword43


    Since the last revision of the chapter, several relevant developments occurred
    that we believe to be highlighted. The first is the significant impact that the
    Portuguese Budget State Law for 202344 had on the taxation of crypto-assets. The
    legislator, taking into consideration the principles of tax legality and legal
    certainty in the context of crypto-assets, decided to create specific tax rules
    for crypto-assets45


    In this line, the PIT Code now has a definition of crypto-assets: "any digital
    representation of value or rights that may be transferred or stored electronically
    using distributed ledger or similar technology." This concept does not include
    unique crypto-assets that are not fungible with other crypto-assets, i.e., Non-Fungible
    Tokens (NFT).46 The legislator also clarified that 24 of the PIT Code applies,
    i.e., the cash equivalence of crypto-assets follows the same rules already established
    for income in kind (v. Sect. 4.4 supra).


    Another relevant amendment to PIT Code article 10(1)(k) of PIT Code now the new
    regime in case of sale of cryptocurrencies and other crypto-assets qualifies the
    onerous transfer of crypto-assets (that are not securities)47 in schedule G (capital
    gains), provided that it occurs outside the scope of a business activity or professional
    (case which Schedule B applies). The capital gain is subject to a tax rate of
    28%, with the option for the general tax rates. However, gains and losses arising
    from the sale of crypto-assets (that are not securities) are held for at 365


    +   43 Written: 25 April 2023.


    +   44 Law no. 24-D/2022, December 30.


    +   45 The Proposal of the Budget of State Law for 2023, parliament.pt/statebudget2023,
    accessed 25 April 2023, pp. 74-75, stated the intention was to create a broad
    and adequate tax framework applicable to crypto-assets, in terms of income and
    property taxation, providing security and legal certainty by creating a specific
    regime that aims to promote the crypto-economy and the digital transition and
    expanding the economy.


    +   46 Article 10(17) and (18) of the PIT Code. This definition is also applicable
    for CIT and Stamp Tax purposes.


    +   47 Seeming to confirm my previous interpretation that crypto-assets would
    already be taxed—v. supra Sect. 4.4.'
