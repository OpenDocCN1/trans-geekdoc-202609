  mdcn: "\n\n# 7 央行数字货币：关注匿名性\n\n在 CBDC 的情况下，作者指出，交易对手匿名性似乎比第三方匿名性更具争议。后者不应被允许，因为它们可能助长犯罪活动，如逃税、恐怖主义融资或洗钱。考虑到从技术角度来看，这方面并没有局限性，这种方法似乎将取决于中央银行的政策决策。数百年来，中央银行或等效实体一直发行匿名现金，而客户并无法直接访问其账户。但正如\
