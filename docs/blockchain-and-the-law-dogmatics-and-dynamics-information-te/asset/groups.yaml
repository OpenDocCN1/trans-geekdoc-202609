    # 5.1 Introduction


    As any litigant will know who has obtained a court order or arbitration award
    that remains unsatisfied post litigation, an order without the means to success-fully
    execute it is largely meaningless.¹ Executing orders using blockchain technology—which
    carries the crucial benefits of irrevocability (and thus finality) and immutability—could
    provide a more efficient method of satisfying orders than presently available
    in South Africa under conventional methods of execution.


    This chapter will consider the possibility of using blockchain to execute court
    orders, from the vantage point of a litigant in South Africa, relying on South
    African law.


    In doing so, the chapter will first consider conventional execution methods available
    to a successful litigant under South African law (Sect. 5.2). It will then consider
    the concept and attributes of execution on the blockchain (Sect. 5.3). It will
    thereafter consider two possible use cases of blockchain execution applied in
    a South African context and potential impediments to their adoption (Sect. 5.4).


    # 5.2 Traditional Methods of Execution of Judgments Under South African Law


    Consider the following scenario: Party A institutes a commercial claim in South
    Africa against Party B. Both companies are domiciled in South Africa. The claim
    is brought either in the High Court, via conventional litigation, or in arbitration
    proceedings under an arbitration agreed between the parties. Party A, for reasons
    relevant to the suit, is entitled to furnish Party B with security for costs.¹
    Party A is successful in its claim, obtaining an order for monetary judgment against
    Party B.


    Party A, now holding a judgment against Party B, is entitled to execute on its
    judgment against the assets of Party B.³ As the execution takes place in South
    Africa and in terms of a South African High Court, the execution process is


    > ¹ Harms 2016, para 621 explains the position thus: “A procedure whereby a successful
    litigant (the judgment creditor) can enforce the judgement to the legal process.
    The idea that a court must be able to give an effective judgment is the foundation
    of jurisdiction. Effectiveness is inextricably linked with execution because,
    if the court through its officers has no control over either the defendant or
    the defendant’s property, a judgment granted in favour of a plaintiff could amount
    to little more than a declaration of a theoretical benefit.


    > ² The general rule under South African law is that negligent plaintiffs or applicants
    who are subject to the jurisdiction of the court are liable to provide security
    for the costs of litigation in which they are engaged. See Harms 2016, para 31.


    > ³ In this context, execution is meant in its technical legal sense of the process
    by which practical effect is given to the terms of a court order. See Harms 2016,
    para 621.'
