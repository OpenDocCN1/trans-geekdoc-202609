    Abstract


    This chapter analyzes the taxation of crypto-assets in Portugal and the approach
    taken by the local authorities on crypto-assets and selected topics. By summarizing
    some relevant features of the Portuguese tax system, the chapter discusses the
    taxation of profits arising from crypto-assets under the Corporate Income Tax,
    as well as the importance of the accounting perspective for such taxation. Subsequently,
    the chapter delves into the topics of Personal Income Tax, Finally, the last section
    focuses on Value Added Tax (“VAT”), encompassing as well brief introductions to
    the Portuguese VAT Code and to the well-known European Court of Justice (“ECJ”)
    Hedqvist decision and a review on the two TA binding rules on VAT (one on the
    sale of cryptocurrencies and a second on mining).


