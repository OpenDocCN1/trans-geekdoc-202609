    # 智能合约与法律


    在事后不确定性，或双方倾向于避免起草高度定制化协议的情况下，智能合约的使用可能不会产生效率收益。¹²²


    智能合约的设想通过专门使用智能合约来构思商业活动，“避免了起草成本、司法干预、投机行为以及语言固有的模糊性”；²²³ 与依赖耗时且昂贵的司法执行不同，智能合约的自动执行可能满足了制度化执行的需求，并提供了一种更廉价、更有效的替代方案。传统的事后司法执行可以被自动化自动执行的智能合约的事前执行所取代。有人认为，这消除了双方之间的争议，因为代码无法确保其正确代表了条款或双方之间的协议。³⁴
    通过自动执行代码来保证合同履行，可以为那些在传统交易中难以相互信任的双方创造合同关系的机会。将信任转移到本体论（ontology）不仅促进了互不认识双方之间的交易，也促进了彼此认识但在缺乏技术保障手段的情况下不愿信任对方的双方。在假设“用编程语言编写的智能合约并没有消除自然语言的模糊性”的前提下，²⁵
    使用非歧义的计算机代码可能消除传统合同中语言歧义引起的任何争议。Grimmmann 明确声称——它们掩盖了模糊性，因为“理论上完美的模糊性是不可能的，因为技术层建立在社会层之上”；⁶
    决定智能合约语义以及智能合约所依赖的社会制度，是“那些建立和构建区块链社区的机构”。最终，“区块链是由人构成的”，因此智能合约编程语言和底层区块链共识面临着一个困境：“什么重要：代码所说的，还是人们所想的？”²⁷
    DAO，即分布式自治组织，曾是一个以太坊为基础的在线风险投资基金，设计为通过智能合约进行管理。在一个未识别身份的以太坊用户能够探索并转移了价值 6 亿美元的太坊离开
    DAO 后，DAO 辩论这是一个黑客攻击，还是代码允许的合法行为。结果，大多数以太坊用户选择撤销转账并将资金退还给投资者。这导致了以太坊网络的硬叉，并分裂为两个具有不同且不兼容语义的区块链：以太坊（Ethereum）和以太坊经典（Ethereum
    Classic）。


    ² Sklaroff 2018, p. 291.

    ²³ Sklaroff 2018, p. 263.

    ³⁴ Mik 2019.

    ²⁵ Finck 2019, p. 27.

    ⁶ Grimmelmann 2019.

    ²⁷ Levine 2016.


    # 130


    # A. Ferreira


    考虑到其降低成本的潜力，智能合约在实施之初就是昂贵的，因为存在“确定所有突发情况的事前信息成本”²⁸ 以及切换到智能合约网络并说服交易对手参与该网络的成本。自动化和人类干预的最小化还可能导致与任何编码错误相关的附带成本、不可篡改性的影响，以及任何撤销非意愿交易的潜在需求。


    对于自由主义者来说，智能合约被认为是通过其自包含的规则和脱离国家干预的操作能力，对个人自决和自主的体现。²⁹ 国家无法停止智能自动化程序，也无法在去中心化系统中影响正在运行的智能合约脚本.³⁰
    在概念层面上，区块链技术使个人能够从“低效且易腐败的机构”中获得自主，并对私有所有权的优先性和理想性以及对法律和律师的沮丧进行了说明。³¹ Verstraete
    反对这种观点，并认为感知智能合约的幻象是“一种仅根据合同减少结果，并能更充分地维护双方自主性的政治系统”。³² 代码可能是自由主义者最大的承诺，但即使是 Lessig
    也认为它是最大的威胁，因为代码是决定性的，是是或否的二进制矩阵，没有中间地带，并且必须被构建用于保护某些价值，或为了反对反对者而被排除.³³


    Fairfield 注意到，智能合约的去介化将消费者保护从法院（法院有“长期拒绝执行消费者所提供的合同”的历史）转移到了自动化的消费者级购买代理人处。³⁴
    他将去介化称为“在线签约环境中对消费者权利的激进剥夺”³⁵ 智能合约的设计是为了测试当前大众市场消费者术语排除制度中那些构思不周的基础。³⁶ 另一种观点是，除非实施了允许消费者理解智能合约及其影响的措施，否则智能合约可能并不适用于消费者合同，例如将智能合约翻译成易读的对消费者友好的格式。在许多司法管辖区，消费者被赋予信息权、冷静期以及在特定时间内撤销合同的权利。自动化还可能将举证责任反转，使消费者处于不利地位。零售商将通过智能合约的自动执行收到付款，而消费者将承担证明不应支付此类款项的责任。这种风险的转移到


    ²⁸ Werbach and Cornell 2017, p. 360.

    ²⁹ Kaal and Calcatera 2017; Raskin 2017, p. 335.

    ³⁰ De Filippo and Hassan 2016.

    ³¹ Sklaroff 2018, p. 268.

    ³² Verstraete 2019, p. 789.

    ³³ Lessig 2006, p. 6.

    ³⁴ Fairfield 2014, p. 39.

    ³⁵ Ibid, p. 41.

    ³⁶ Ibid.


    # 8 智能合约与法律


    在为了保护消费者和个人日益数字化的商品服务的法律法规时代，这种风险的转移可能是不合适或不可接受的。例如，伊诺伊州实施了新的区块链法律，针对消费者违约、公用事业断供、医疗保险覆盖或产品召回.³⁷欧洲议会法律事务委员会在其报告中也强调，为了保护智能合约的弱势方，需要能够停止智能合约执行的机制.³⁸


    # 8.4 法律辩论


    这种在点对点基础上自动自主执行合同条款的软件想法仍然存在问题。法律辩论通常源于以下观点：代码可以被视为一种法律系统⁴⁰；技术将把正义的提供交给市场力量，并打破国家对当前系统的垄断⁴¹；智能合约不需要法律框架即可存在，“它们代表了整个法律系统的技术替代方案”。⁴²
    智能合约被认为是在传统合同之外提供新的合同形式，或完全取代合同法。⁴³ 智能合约的乐观者很快被那些指出其局限性和缺陷的人所反驳，后者认为智能合约角色的乐观版本是“虚幻的”。⁴


    # 8.4.1 智能合约是合同吗？


    法律界一直在纠结智能合约是否为法律意义上的合同。这种混乱很大程度上源于术语误用以及法律与技术的交叠，导致了激烈的学术辩论。其中一些观点产生了对智能合约既不是智能的不是合同的反驳。⁴⁵
