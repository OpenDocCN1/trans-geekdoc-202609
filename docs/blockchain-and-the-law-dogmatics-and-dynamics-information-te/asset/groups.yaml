    4 Taxing Crypto-Assets—The Portuguese Perspective 53


    # 4.2 Overview of Some Relevant Features of the Portuguese Tax System


    # 4.2.1 The Principle of Tax Legality and Its Importance in the Context of Crypto-assets


    Crypto-assets are a recent reality. Legal systems should be flexible enough to
    keep up with the current landscape but in the case of tax law such systems and
    flexibility should be circumscribed by the principle of legality. In fact, “[[t]he
    principles of people’s sovereignty and possession of powers themselves require
    that the law of tax is discussed and approved by parliments.”¹ For that reason,
    the Portuguese Constitution establishes such principle in article 103.


    The principle of legality not only means that tax rules should be approved by
    the Parliament² but also the essential elements of a tax in article 103(2) of
    the Portuguese Constitution (“Taxes shall be created by law, which shall lay down
    rate, tax benefits and the taxpayers guarantees”) should be covered by such approval.³
    The guarantee-based function of this principle (“...) is associated with the predictability
    of the amount of tax payable (and thus also with legal certainty)⁴ Following this
    rationale, article 11(4) of the Portuguese General Tax Law (“GTL”) establishes
    that “The gaps ruling from tax rules covered by the Portuguese Parliament’s law
    reserve are not susceptible of analogical integration”⁵, when the TA or a Court
    faces a case if the facts fulfils the provision of a statutory tax law, there
    is a taxable event; if the facts do not correspond to the provision of any statutory
    tax law (not even by broad interpretation), there is no taxable event (so the
    taxpayer should not be subject to tax).”⁶


    Thus, for instance, if one sells a crypto-currency, the resulting income will
    only be taxed if only when the tax law covers such type of income. But if the
    tax law does not cover one crypto-phenomenon, there is no taxable event. To sum
    up, *nullum tributum sine lege* is very important in the context of crypto-assets.


    +   ¹ Dourado 2014, p. 2.


    +   ² In the Portuguese case, article 165(1)(i) of the Constitution establishes
    that the Parliament has legislative exclusive competence over the creation of
    taxes and the financial system unless it authorizes the Government to do so.


    +   ³ Fonseca and Otero 2008, p. 865–866. Article 8(1) of the Portuguese General
    Tax Law establishes a similar option to article 103(2) of the Portuguese Constitution.


    +   ⁴ Dourado 2007, p. 79—free translation.


    +   ⁵ Free translation.


    +   ⁶ Still, one should recall that the Portuguese Statutory Tax Laws use undetermined
    concepts, grant discretionary powers, assign of free appreciation and allow the
    conclusion of fiscal contracts (with some boundaries)—e.g., Pires and Calçada
    Pires 2012, p. 114.'
