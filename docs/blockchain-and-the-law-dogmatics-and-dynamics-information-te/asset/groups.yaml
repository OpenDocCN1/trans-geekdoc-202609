    At the European Union level, an uncertainty concerning the legality of smart contracts
    and their enforceability in cross-border situations has also been recognized and
    the draft report of the Committee of Legal Affairs emphasizes that the upcoming
    Digital Services Act provides an opportunity to assess the requirements for smart
    contracts to be considered legally valid. The European Commission to assess the
    legality and enforcement of smart contracts in cross-border situations, and to
    make proposals for the appropriate legal framework. The report strongly recommends
    that smart contracts include mechanisms that can halt their execution to protect
    weaker parties and ensure that the rights of creditors in insolvency and restructuring
    are respected.³³


    # 8.5.3 United Kingdom


    The UKJT published a statement in December 2019 on the status of crypto-assets
    and smart contracts under the law of England and Wales.⁴ The statement concludes
    that smart contracts are capable of forming valid, binding, and enforceable contracts.
    It emphasizes the adaptability and flexibility of common law that is capable of
    catering to technological advancements such smart contracts. The UKJT explains
    that there is no reason that the three requirements for contract formation under
    the common law—offer, acceptance, and consideration-cannot be satisfied by a smart
    contract. Smart contracts can be implemented and interpreted under the existing
    established frameworks and contract law doctrines. Although the legal statement
    is formed on the basis of English law, other common legal systems share similarities,
    particularly in terms of their flexibility and the principles of contract formation.


    > ⁹¹ Moyle and Bacheyeva 2019.

    ² Rumi et al. 2020.

    ³³ European Parliament 2020.

    ⁴ UK Jurisdiction Taskforce 2019.'
