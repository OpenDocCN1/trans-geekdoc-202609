    is stored in the network, meaning that no central authority has absolute custody
    of what is transacted, thereby adding another layer of protection to the system.


    The use of blockchain to gather information on victims and witnesses could be
    of crucial since organizations with authorization to add blocks in the system
    could go directly to these people to take their statements, with anonymity granted
    by the network. In other words, such actions could introduce another layer of
    protection to victims, witnesses, and the local team responsible for collecting
    such statements.


    Blockchain technology could also help the ICC to assist local personnel and national
    courts with the exchange of information. Having the ICC as one node in a blockchain
    system would facilitate the international transfer of data between different national
    and international groups and promote faster responses to local locations. For
    example, the collection of a statement of a victim in locus would allow immediate
    access to this data by the ICC, permitting accuracy and agility in the decision-making
    processes of the ICC as well as those of the authorities and civil organizations
    to which the Court has access. A pre-established international blockchain network,
    with international organizations, such as the UN and the ICC, as nodes and other
    international actors, such as NGOs, could be a solution for faster response times.
    The network owner could allow the participation of other members for a specific
    situation, and then remove them on.


    In addition to the above, as a solution proposed by TCs, the ICC could initiate
    a crowdfunding project based on blockchain, allowing financial support from any
    sponsor, and establish the possibility for using cryptocurrencies as well. simplify
    the funding processes and make it cheaper. The ICC could use such support to promote
    its actions as a complementary organization, as discussed, and also financially
    support local organizations, such as hybrid courts, TC projects and reparations
    programs by the Trust Fund for Victims (TFV). Therefore, the ICC could enhance
    its complementary function as a body pursuing all types of justice and as a human
    security agent.


    As demonstrated, the use of blockchain technology for prosecution purposes a TI
    situation is similar to us TC situations, since it intends to improve the efficiency
    of operational aspects, such as the exchange of information between several actors.


    # 3.3.3 Restoring Democratic Institutions


    After periods of violence, usually caused by the State, there is distrust regarding
    the State and its institutions, especially as regards the preservation of rights.
    Inn such contexts, State institutions could symbolize the State regime and, therefore,
    should be dismantled or changed to regain public trust.65


    65 One example is the old DOI/CODI in Brazil, symbol of the Brazilian military
    dictatorship and torture practices during the regime, scrapped as part of the
    Brazilian democratization process.'
