    [Mareva injunction]）37；其次，中立的法院职能而非法官/仲裁员可能具备控制智能合约形成或执行所需的必要技术知识；第三，双方关于执行协议的安排将形成一份独立的协议，该协议将不是法官/仲裁员审理纠纷的标的，因此从负责人员的角度来看，它是主诉争议的从属事项。


    ## 5.4.2 区块链执行法院命令的实际障碍


    尽管在《统一规则》范围之外进行智能合约执行的建议在理论上听起来很简单，但存在若干实际困难。


    首先，该过程在本质上是技术性且新颖的。诉讼双方可能需要适应允许代码执行诉讼结果这一概念，并信任区块链过程能够恰当地赋予结果效力。他们可能会被从零开始编写所需智能合约的成本所排斥（无论这是由诉讼双方还是第三方完成）。有趣的是，似乎到
    2021 年 2 月，已经有了标准化该技术的进展，这些进展可能允许诉讼双方使用具有易于用户界面的标准程序来编写他们的智能


