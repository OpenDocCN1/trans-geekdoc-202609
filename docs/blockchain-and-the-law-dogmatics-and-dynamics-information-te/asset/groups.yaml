    ## 7.4 CBDC 实施的主要法律影响


    随着越来越多的央行推进其 CBDC 实施项目，涉及法律和监管影响的问题和疑问也之增加。这是由于 CBDC 不仅仅是一个技术项目，其成功实施并不完全取决于技术问题。除了可能出现且因管辖区而不同的政策和政治问题外，还应对立法法进行仔细评估。央行法、货币法以及商业银行法、税法、私法、支付系统和服务法、数据保护法、反洗钱/反恐怖主义法（AML/CFT）也可能需要评估并可能进行修订。²3
