    When dealing with specific situations, other features can be added to a blockchain
    platform. There are other attributes that be crucial when dealing with TJ, such
    as scenarios, and these have to be considered when designing the architecture
    of a blockchain system for this purpose.


    Smart contracts is a blockchain technology that allows all transactions to occur
    automatically, depending exclusively on the initiatives of both parties to the
    action.^22 It is a code that automatically executes what was done, without of
    codification.^23 Smart contracts are used in Ethereum and other blockchain systems
    to eliminate a counterparty risk. So, when one performs to buy or transfer goods
    from someone in the blockchain, it is unable to retract the order. It is a warranty
    for the fulfillment of the deal, ensuring more trust in the system''s transactions.^24
    In that, smart contracts can also be programmed under specific conditions, like
    ensuring an obligation from time, for example, and be triggered after a particular
    event.^25 To activate the smart contract application oracles with external information,
    outside of the blockchain, starting the actions of such contracts that were pre-shaped.
    Oracles can be either automated data source or a human.^26 In the TJ scenario,
    smart contracts could be used to deliver monthly payments to victims and victims''
    families, avoiding bureaucratic delay by the State associated with such cases.


    Usually, blockchains systems are publicly available and no permission to participate
    is needed. However, there are other types of blockchain systems that are a better
    for TJ requirements.


    When considering TJ, it is worth noting that blockchain technology systems can
    be divided into two groups: public and private networks. The public one is Bitcoin
    blockchains, as a publicly available network where anyone can see what is transacted.
    A private network, on the other hand, is not open to the public and is constituted
    by an owner who decides who can have access to the system.


    Also, the system can define how users interact with the platform. The division
    is between permissionless and permitted systems. Permissionless systems allow
    any user to be part of the transaction and consensus network, as in the case of
    the Bitcoin blockchain, where anyone with enough capabilities can integrate and
    operate within the system. A permitted network, by contrast, restricts participation
    in the system to only those with permission granted by the owner of the network
    to do so.^27 This means that in a permitted blockchain, only authorized users
    can


