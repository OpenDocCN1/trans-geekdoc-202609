    法律体系的合同法基础决定了创建一个有效且具有约束力的合同需要什么条件。普通法（如英国法）要求三个要素：要约、承诺和对价，以形成有效合同。英国司法管辖权工作组（UKJT）最近表示，“智能合约”能够像自然人或自然语言合同一样很好满足这些要求，并且智能合约能够具有合同力。^58
    在民法管辖区内，以德国法为例，当双方通过两个意向声明（要约和承诺）对基本条款达成一致时，合同成立。合同法的一般原则可以用于判断智能合约是否合法、具有约束力且可执行。在不同类型和模型的智能合约中，根据其相关性、背景或技术属性，某些智能合约没有法律影响，也不等同于具有约束力的合同。非法律智能合约是指执行编程任务但不涉及触发法律关系的软件。换句话之，“智能合约”并不是法律意义上的合同，尽管没有什么阻止它们产生法律效果。59


