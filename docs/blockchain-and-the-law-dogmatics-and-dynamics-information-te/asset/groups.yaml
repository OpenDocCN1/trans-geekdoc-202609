    ## 8.1 引言


    智能合约已被应用于多个领域，包括金融领域、公共部门、供应链管理以及汽车、房地产、保险和医疗保健行业.^1 全球智能合约市场规模正在快速增长，预计在2020年至2025年的预测期内实现17.4%的复合年市场增长率，并预计到2025年达到2083亿美元.^2
    智能合约引发了法律学者和动机支持者的激烈辩论。一些学者将智能合约称为“自印刷机发明以来，对法律实践和合同自由的首次批破坏性技术进步之一”。^3 另人称其为“空想”。^4
    立法者和监管机构也对此关注，首批针对智能合约的立法已出现。


    尽管合同是一个相当成熟的法律领域，并在大多数管辖区获得广泛认可，但智能合约引发了许多法律问题。定义智能合约是困难且“可能不可能的”^6，并没有“普遍接受的”^7
    定义。同样，智能合约也没有统一、结构化且系统性的分类.^8 正在进行的法律辩论涉及：具有约束力的法律合同的有效性^9；将区块链记录的不可篡改性与合同缺陷、法律适用和适用管辖权、消费者保护、反洗钱/反恐怖主义（AML/CFT）法规、自动化且不可停止执行的影响，以及部署在无边界去中心化区块链网络上的智能合约的隐私和保密性.^10
    本章概述了智能合约最常被提到的优势，并强调了围绕智能合约的学术辩论的观点。


    - 1 数字商会协会 2016。

    - 2 Marketsandearch.biz 2020.

    - 3 Wright and De Filippi 2015, p. 10.

    - 4 O''Hara 2017.

    - 5 参见 Verstraat 2019 对智能合约乐观主义的批判；参见 Mik 2019 关于智能合约的局限性及其对合同法和法律系统的潜在影响；参见 De
    Caria 2019 关于法律合同的一般法律维度；参见 Meyer 2018 关于智能合约可执行性、签名认证、责任分配、法律适用、欺诈风险和数据保护问题的讨论；参见
    Low and Mik 2019 对区块链技术颠覆法律系统潜力的流行说的批判性评估；参见 Jacobson 2017 对智能合约法律相关性的评估；参见 Meyer
    2020 对智能合约撤销和终止的法律分析。

    - 6 Rück 2020, p. 2.

    - 7 Meyer 2020.

    - 8 关于智能合约分类的依据，请参见 Tinnissen and Teuteberg 2018；关于强、弱智能合约的分类，请参见 Raskin 2017。

    - 9 Levi and Lipton 2018; Raskin 2017.

    - 10 De Caria 2019; Meyer 2020; Rühl 2020.


    ## 8 智能合约与法律


    本章还介绍了了迄为止为应对智能合约现象而采取的一系列立法计划。


    第一部分介绍了智能合约的起源及其随着区块链技术的出现而复兴。第二部分解释了智能合约最常被提到的收益并考察了其优点。第三部分概述了正在进行的法律学术辩论。第四部分分析了不同管辖区选定的智能合约立法计划。最后部分提供了结论性意见。


    ## 8.2 起源


    计算机科学家兼法律理论家尼克·萨扎博（Nick Szabo）在20世纪90年代首次创造了“智能合约”这一术语，并以自动售卖机作为一个“典型的现实生活案例”，我们认为这可能是智能合约的原始祖先$^{11}$。自动售卖机基于预先编写的
    `if-then` 逻辑运行，一旦投入硬币，就会触发不可停止的自动操作。萨扎博提出了智能合约的定义之一：“以数字格式指定的系列承诺，包括执行这些承诺的协议$^{12}$。”


    智能合约先于区块链技术，但区块链技术实现了智能合约从简单的自动化向完全自主执行合约的进步$^{13}$。众所周知，区块链是一种特殊的分布式数据库，数据存储在区块中，按时间顺序链接并由加密保护。每当链上添加新区块时，都会通过节点进行验证，以确保其完整性和安全性。以太坊等智能合约平台在有限范围内是可能的。在区块链上实现
    `if-then` 业务逻辑已可能变为自动执行的脚本，确切地说是智能合约。随着它们变得流行，它们引起了法律界的关注，人们开始质疑它们是否都是“合约”。


    - 11 Szabo 1996.

    - 12 同上（Ibid）。

    - 13 Lauslahti et al. 2017.

    - 14 Nakamoto 2008.


    ## 8.3 优势


    智能合约的支持者强调了自动化、标准化和透明度属性带来的效率效益.^15 基于区块链的智能合约可以实现保险理赔、高效供应链和公司治理。智能合约实现的点对点交易减少了运营和交易对手风险，也有助于提高效率.^16
    相对的观点认为，僵化且不灵活的代码施加了合同关系，实际上减少了灵活性，因为它过于局限，无法反映传统合同关系的灵活性——这种灵活性“由语义表达的丰富性和人类判断力驱动”。^17
    对于代表合同法隐含原则或模糊术语（如“合理的努力”、“尽力”、“诚实信用”）的合同条款，`if-then` 逻辑是一项挑战。法律规定的所有允许合同方在不承担责任的情况下免除履行合同的情况（如不可抗力、非法性或公共政策，取决于法律体系），通过代码捕获可能与智能合约对合同关系的预先监管不兼容.^18
    此外，过于复杂的代码可能会出现错误，技术维护、测试和修复漏洞的成本可能会超过任何效率收益.^19 智能合约平台可能使某些合同关系变得困难、效率更低，因为它需要某种程度的技术水平、技术资源和支持。智能合约更有可能在高自动化和高交易量的行业中提高效率，在依赖标准化合同条款和重复性交易的领域²⁰且
    `if-then` 逻辑可以容易且客观地确定，例如在衍生品市场¹¹


    - 15 Di Angelo et al. 2019, p. 392.

