    - From a European perspective the policy is in advanced stages of research and
    development. In 2020 the ECB issued a public consultation a Report on Digital
    Euro (hereafter "Report" or "Report on a digital euro"). The main concern for
    research is to ensure that consumers continue to have unrestricted access to central
    bank money in a way that meets their needs in the digital age. The main benefits
    of (issuing a digital euro) mentioned in the report are: (i) for the digitalization
    of the economy; (ii) in response to the decline in cash as a means of payment;
    (iii) to tackle concerns related to foreign digital means of payment in the euro
