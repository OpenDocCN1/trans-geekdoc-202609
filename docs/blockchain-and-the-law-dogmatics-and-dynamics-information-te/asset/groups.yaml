    exchange of information under the Directives on administrative cooperation in
    the field of taxation (DAC), to cover information on crypto-assets and e-money
    transactions, which should be reported on an annual basis. However, the scope
    of DAC8 is broader than the OECD CARF standards, since the DAC rules would only
    apply to non-EU crypto-asset operators operating within the EU. The reporting
    operators must transmit information regarding the type of asset, its transferor
    and its acquirer, and in some cases the reporting obligation will also cover digital
    tokens, more specifically, NFTs. The proposal is designed to be implemented in
    the EU Member States in 2026, which will be the first year to present the reports
    enshrined in the DAC8.


