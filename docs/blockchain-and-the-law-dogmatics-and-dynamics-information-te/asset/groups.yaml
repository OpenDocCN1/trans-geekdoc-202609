  - '[PAGE 50]


    Another problem caused by a lack of resources is the restricted outreach capacity
    of TCs that would otherwise enable public participation in truth processes. TCs
    have an important social role, and social involvement is essential to their work
    and legitimacy. 54 Public engagement is crucial for truth-seeking, gathering information
    from the population, ensuring that victims'' voices are heard by the community,
    promoting transparency and public participation and creating the notion of ownership
    of the TC. 55


    One other challenge faced by TCs is managing data issues, especially with regard
    to the gathering, analyzing and cataloging of each piece of information. It can
    present enormous problems, nowadays, when new technologies, such as smartphones
    with video or audio recording capabilities, and social media, can generate and
    disseminate a fantastic amount of data rapidly. 56


    For both, it is important to state that, in blockchain system, the transfer of
    information is extremely fast and, with the use of a smartphone in places with
    an internet connection, lots of different data points can be collected and audited
    and immediately accessed by users.


    In a public blockchain system, the information exchanged can be accessed by any
    one with an internet connection and a smartphone, which improves the system''s
    transparency and outreach. Also, the network can be permitted, meaning that users
    must ask for permission to trade and insert information into the platform. So,
    the system controller (that could be the TC itself or another controller) can
    allow only specific users to interact with the network. It can provide another
    layer of legitimacy, as well as better control of the information gathered.


    In that sense, as the information in the network is confirmed, the nodes (users)
    could stamp it as valid information. The logic here is similar to a supply chain
    process, but with data instead of products. So, as the data flows through the
    different validation processes, it becomes more legitimate, and since the entire
    process is publicly available, it is also transparent for civil society. Therefore,
    cases of misinformation and useless data are controlled and minimized.


    +   52 A collateral issue that may arise is the case of tokens being traded by
    TCs in secondary markets. On the one hand, this could promote the entrance of
    the TCs into a quasi-financial system (not unlike a stock market). On the other
    hand, the tokens could be programmed with an expiration date, and be automatically
    destroyed after a specific date or event.


    +   53 Salazar et al. 2015


    +   54 Bickford 2007, p. 1030.


    +   55 González and Varney 2013, p. 49.


    +   56 Gavshon and Gorur 2019, pp. 72–73.'
