    ## 3 区块链的局限性何？关于使用的考虑…… 33


    在处理特定情况时，可以在区块链平台中添加其他功能。在处理司法正义（TJ）时，还有其他关键的属性，例如场景，在为此目的设计区块链系统架构时必须考虑这些因素。


    智能合约是一种区块链技术，允许所有交易自动发生，完全取决于行动双方的发起。²² 它是一段自动执行已完成操作的代码，无需人工编码。²³ 智能合约被用于以太坊和其他区块链系统中以消除交易对手风险。因此，当有人在区块链上执行从某人处购买或转移货物时，无法撤回订单。它是对交易履行的保证，确保了对系统交易的更多信任。²⁴
    在此，智能合约还可以在特定条件下进行编程，例如确保某项时间义务，并在特定事件后触发。²⁵ 通过区块链外部的外部信息预言机（oracles）激活智能合约应用，从而启动此类预先设定的合约的行动。预言机可以是自动化数据源，也可以是人类。²⁶
    在司法正义场景下，智能合约可用于向受害者及其属发放月度，避免国家处理此类案件时相关的官僚延误。


    通常，区块链系统是公开的，不需要许可即可参与。然而，还有其他类型的区块链系统更符合司法正义的要求。


    在考虑司法正义时，值得注意的是区块链技术系统可以分为两类：公有网络和私有网络。公有的是比特币区块链，作为一个公开网络，任何人都可以看到交易内容。相反，私有网络不向公众开放，由所有者组成，决定谁可以访问系统。


    此外，系统可以定义用户如何与平台交互。这种划分位于无许可系统和许可系统之间。无许可系统允许任何用户成为交易和共识网络的一部分，例如比特币区块链，任何具有足够能力的人都可以在系统中集成和运行。相比之下，许可网络将系统的参与限制为仅获得网络所有者许可的人员。²⁷
    这意味着在许可区块链中，只有授权用户可以


    > ^22 欲更深入地理解司法世界中的智能合约：Herian 2018。

    > ^23 Fink 2018, p. 670.

    > ^24 关于什么是智能合约有多种定义，也有不同的应用和变体，智能合约还代表了“代码即法律”这一术语，这意味着一个人受代码约束以完成所规定的内容。

    > ^25 Fleuret and Lyons 2020, p. 15.

    > ^26 Werbach 2018, pp. 213–214.

    > ^27 Ølnes et al. 2017.


    添加区块。因此，它创建了一个透明度更高的问责系统，但仅限于经过认证的用户。


    简而言之，区块链系统可以是公有的或私有的，可以是无许可或许可的。例如，区块链是一个公有无许可系统，而控制私人公司供应链的区块链系统可能是私有许可的。根据其目的，区块链具有不同的特征。


    在司法正义系统中，存在不同的网络组合。私有许可区块链可用于数字识别事务，将敏感信息存储在实体数据库中。公有无许可区块链（如比特币）也可以用于支持司法正义支柱的资金捐赠平台。


    利用上述所有工具，区块链已经演进，并正处于新技术革命的前沿，创建了一个不需要中心控制的可信交易环境。


    尽管最初用于金融交易，但该技术可以记录任何类型的信息，并用于各种用途。正是这种特征使区块链成为通用技术。


    ## 3.3 司法正义与使用区块链的有效性


    司法正义在国际社区被广泛讨论。它也应用于全球多个地区，这些地区是大量文献和案例研究的主题。


    联合国秘书长于2004年首次发布了提交给安全理事会的报告，涉及冲突后局法治和司法正义方面。该报告讨论了联合国对司法正义的看法，以及其目标、机制和有效应对过渡情况的程序。


    联合国通过秘书长关于司法正义方法的指导意见³ 完善了对司法正义机制（或支柱）的理解。


    > ²⁸ 虽然系统所有者授予了访问权限，但共识、工作证明和加密等保护措施仍然有效。区别在于中心权威决定谁可以参与网络，谁不能参与。


    > ²⁰ 联合国秘书长 2004。


    > ³⁰ 联合国秘书长 2010.


