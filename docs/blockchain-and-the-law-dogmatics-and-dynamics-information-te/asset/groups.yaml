    The second is that a South African court or arbitral tribunal will not issue an
    order payable in cryptocurrency. Any judgment or award will ordinarily be in South
    African Rands.³39 The smart contract will therefore have to convert the judgment
    debt expressed in South African Rands, to the cryptocurrency in which payment
    will be made, on the day of payment. This difficulty is insurmountable but needs
    to be taken account of when coding the smart contract.


    The third is that any judgment handed down by a court or arbitral tribunal, will
    be submitted in written form, either by email or through the South African High
    Court''s case management system.³40 Whatever the order might be, will have to
    be made available to a human actor who will act as oracle, by submitting the result
    of the order to the blockchain for the smart contract to execute. The oracle will
    have to be an independent person or entity chosen by the parties beforehand. In
    course one might find companies acting as professionals or submitting outcomes
    of judgments/awards onto blockchains to give effect to smart contract execution—to
    escrow agents.


    On this point, Ortolani took view that: "The mechanism of oracle can be readily
    applied to arbitration; a smart contract can defer the decision to a first party
    adjudicator, such as an arbitral tribunal, and determine the final recipient of
    disputed aspects on the basis of a ruling made by that oracle. Or, the external
    information retrieved by the smart contract could be an arbitral award, and software
    code could be used to enforce the outcome of the procedure.³⁴¹


    Whilst this is no doubt possible in theory, the promise of seamless interaction
    between a software script and an arbitral tribunal to execute a smart contract
    is unlikely to be standard in South Africa for the foreseeable future, requiring
    the intermediation of a human actor acting as oracle.


