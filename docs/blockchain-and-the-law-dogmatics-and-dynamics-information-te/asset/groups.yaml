    ## 8 Smart Contracts and the Law


    In response to that proposition, other scholars find it necessary to ''remind
    the basic principles of contract law'' and to acknowledge smart contracts ''limited
    potential impact on contract or the legal system in general''^69 In fact, even
    Lex Cryptograph, Wright and De Filippi, argue that blockchain applications are
    unlikely to eliminate law and governments, but may ''shift'' the balance between
    law and architecture, requiring alternative regulatory mechanisms to successfully
    manage contracts.^70 Blockchain is a transformative technology, capable of re-configuring
    established economic, legal, institutional, monetary and broader socio-political
    relationships.^71 Blockchain-based smart contracts purport to represent a new
    form of social organization. Normative legitimacy of regulatory properties of
    smart contracts is being questioned, even though, or perhaps because of the fact,
    ''code'' may generate the same regulatory effects.^72 The concern is that the
    governing authority of smart contracts is derived from technology, not law. Smart
    contracts are perceived as a form of coercion through their distinct blockchain-based
    characteristics of automated performance and immutability of records. They do
    not provide adequate procedures for selection, modification, and validation of
    background rules of contract law, the nature of which is undetermined. As a result,
    the rules governing smart contracts are created by omission and fail to account
    for and distinguish between rudimentary contracts of such ''overridden'' contract
    law fundamentals^73 The distribution of wealth and power, the distribution of
    interests and obligations between smart contracts participants in a blockchain
    network governance structure are considered normatively suspect since smart contracts
    delegate legal regulation, they warrant the presumption of ''normative definitiveness
    unless otherwise''^74


    Smart contracts also highlight the tensions and the potential to shift the boundaries
    between public and private domain. They enable novel forms of economic exchange
    between individuals, who may challenge the established transacting forms and test
    the established divide between private and public domain. Karlstrom states that
    this unfettered freedom to transact when subjected to blockchain code may have
    in fact an opposite, empowering effect of commercial relations becoming ''rigid,
    irreversible and non-negotiable''. Technology like blockchain may render social
    relations ''increasingly rigid, at the cost of a loss of dynamism and consequence
    of sense of freedom and responsibility''^75 Blockchain-based smart contracts lacks
    any connection to common good, common interest beyond its functionality of enabling
    peer transactions to the protocol rules. The underlying philosophy of the blockchain
    model of governance contradicts established social and institutional design, by
    being ''strongly aligned to anarchist and libertarian theories of social order''
    and a classical formulation of libertarianism denies any possibility for the state
    to interfere with the freedom of individuals⁷⁶.


    > ^69 Mik 2019, p. 22.

    > ^70 Wright and De Filippi 2015, p. 51.

    > ^71 Reijers et al. 2016; Reijers and Coeckelbergh 2018.

    > ^72 Verstraete 2019, p. 794.

    > ^73 Ibid.

    > ^74 Verstraete 2019, p. 795.

    > ^75 Karlström 2014.


    ## 8.5 Selected Smart Contracts Legislation


    ### 8.5.1 The United States


    Despite an increasing interest in recognition of smart contracts, only a handful
    of countries have formulated a regulatory response to smart contracts. In the
    US, smart contracts legislative initiatives by US states are relatively narrow
    and govern only selected issues, mostly limited to defining smart contracts and
    recognition of their electronic form and signatures. Until April 2019, various
    US states have considered 133 blockchain technology related laws. However, only
    7 related to smart contracts and only a few of those have been passed successfully⁷⁷


    Arizona is the pioneer of smart contracts legislation in the United States⁷⁸ In
    2017, Arizona passed a law (Bill HB 2417)⁹ amending the Arizona Electronic Transactions
    Act that clarified the use of blockchain technology, including smart contracts,
    in commercial transactions. The new law has a declarative character, provides
    definitions of blockchain smart contracts and recognizes them within the existing
    legal framework as another electronic form of commercial transacting, acknowledging
    their legal status, validity, and enforceability. The act defines a smart contract
    as an ‘event driven program, that runs on a decentralized, shared and replicated
    ledger that can take custody and transfer of assets on that ledger’. Tennessee
    passed similar legislation in March 2018 (Bill SS 1662)⁸⁰ to provide legal recognition
    to smart contracts in the marketplace. Tennessee’s acknowledges that smart contracts
    are valid and enforceable under state law, ‘may exist in commerce’ and cannot
    be denied legal effect, validity. Both Arizona’s and Tennessee’s follow the lead
    of Arkansas legislation in 2019 (Bill HB 1944)⁸¹ and the North Dakota bill (Bill
    1045) to facilitate the development of smart contracts.


