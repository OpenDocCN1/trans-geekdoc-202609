    # Blockchain Execution of Judgement—A Possibility in South Africa?


    Assuming further that Party B owns assets beyond the jurisdiction of South African
    courts, Party A''s position is exacerbated. To attach such assets, Party A would
    be required to seek the recognition of its high court judgment or arbitral award
    in that jurisdiction. If the judgment or award is recognised, the traditional
    methods of execution in that jurisdiction would have to follow. Conversely, if
    the judgment or award is not recognised for whatever reason, there is no further
    recourse available to Party A in that jurisdiction.


    In summary therefore, traditional methods of execution provided for in the Uniform
    Rules do not lend themselves to swift execution of judgments, often rendering
    them so, could unattractive to litigants.


    If that is so, could-blockchain execution offer an alternative?


    # 5.3 Smart Contracts


    The answer is proposed, lies in the use of self-executing ''smart contracts''
    which operate on a blockchain protocol. Before exploring the proposal in practical
    terms, it is useful to consider how smart contracts function and what their capabilities
    are.


    The concept of smart contracts originated in 1994, by the publication of Nick
    Szabo’s ''Smart Contracts'' paper.¹²¹ Szabo regarded smart contracts as “a computerised
    transaction protocol that executes the terms of a contract”²²²


    While there is no unanimity as to the legal definition of smart contracts,²³ the
    Smart Contracts Alliance has proposed the following definition: “Computer code
    that, upon the occurrence of a specified condition or conditions, is capable of
    running automatically according to pre-specified functions. The code can be stored
    and processed on a distributed ledger and would write any resulting change into
    the distributed ledger”²⁴


    McKinney et al. identify three characteristics that smart contracts share.²⁵ First,
    the contract must be ‘smart’, in the sense that it is recognised and executed
    in computer code (i.e. automated software).²⁶ Second, a smart contract must inevitably
    give effect to a legally enforceable exchange of promises once the predefined
    conditions have met met.³⁷ Third, it must be self-executing, in the sense that
    the conditions for the operation of the contract are met, predefined—and indeed
    unaltered execution protocol will be given effect to, and cannot be delayed, halted
    or reversed.”²⁸


