    governed by Rules 45 and 46 of the Uniform Rules of Court (the Uniform Rules).
    The process is lengthy, arduous and expensive.


    As a starting point, Rule 45 requires the judgment creditor (Party A) to have
    issued with the registrar of the High Court a writ of execution for attachment
    of the assets of the judgment debtor (Party B).


    This having been done, the writ is provided to a sheriff of the court, who is
