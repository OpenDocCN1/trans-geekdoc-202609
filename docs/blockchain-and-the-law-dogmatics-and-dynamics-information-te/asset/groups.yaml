    view that when judgment is handed down, it will comply with the judgment in the
    ordinary course.


    There are two scenarios in which a defendant may well be inclined to agree to
    be bound upon on-blockchain execution. The first is where the defendant wishes
    to initiate a counterclaim against the claimant. The second is where the defendant
