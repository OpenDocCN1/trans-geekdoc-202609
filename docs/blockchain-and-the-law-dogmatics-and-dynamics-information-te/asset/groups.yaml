    25,000 (v. article 87(1) and (2) of the CIT Code).


    # 4.3.2 Profits with Crypto-assets and the Importance of the Accounting Perspective


    A taxable person under the CIT Code may obtain several sorts of income with crypto-assets
    that may contribute to its taxable profit. For instance, it may obtain gains from
    sales of crypto-assets, obtain income derived from the sale of products or services
    that cover the crypto-asset industry or de-ify or it may mine them. In all these
    cases, the taxation under the CIT Code is exactly the same that it would be if
    the taxable person obtained income with producing and selling chairs, render image
    consulting services or any other business activity since those activities are
    economic operations of a business nature and then perfectly covered by the CIT
    Code, namely its article 3.


