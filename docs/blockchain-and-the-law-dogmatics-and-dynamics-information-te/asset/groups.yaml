    萨尔瓦瓦总统在2021年6月宣布，他将向国会提交立法，将比特币作为法定货币。这一决定背后的部分原因包括促进正式经济和金融包容的机会，以及让萨尔瓦瓦人更容易、更便宜、更快地汇款的可能性³⁶
