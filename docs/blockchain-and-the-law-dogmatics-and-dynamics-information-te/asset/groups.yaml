    # # 7.6 Legal Tender


    Many banks around the world are the sole legally mandated authority to issue legal
    tender currency in their jurisdiction. Some of the applicable laws limit the issuance
    of currency to banknotes and coins some and others use a broader wording without
    limiting the issuance of currency to banknotes and coins²⁶ By giving legal tender
    to the currency they issue, central banks allow for the banknotes and coins anywhere
    in a certain jurisdiction and also as a means of payment where the payee is “obligied”
    to accept the legal tender currency provided by the payer in exchange for the
    goods or services received.


    What about issuing a digital form of legal tender currency? Technically speaking,
    that could be possible by amending central bank laws and clearly designating CBD
    as legal tender currency. But this is not just a matter of legality. A legal tender
    physical currency is widely accessible and usable by the entire population as
    a means of payment, which unfortunately could not be the case for a digital form.
    Hence, the designation as legal tender of digital currency could be considered
    as unfair to disadvantaged social groups such as older people, disabled people
    or people who are digitally or physically excluded²⁷ in particular when the adoption
    of the digital currency is widespread before it brings any advantage to its users
    or is necessary to execute certain transactions. The designation of a legal tender
    CBDC requires careful assessment of the population cash usage habits beforehand
    as well as the consumer protection mechanisms to allow the use of legal tender
    physical currency in specific situations when that is needed or required. It is
    important to specify though, that we are speaking about currency in circulation
    and not about central bank book money which usually does not have legal tender
    status. The same approach should be followed with account based CBDC, to avoid
    the policy implications mentioned above on disadvantaged people. On the other
    hand, token-based CBDC could be considered a central bank liability with the central
    bank as the issuer. This is particularly important to be found, avoiding repetition
    of nineteenth disruptions caused by commercial banks issuing banknotes and not
    honoring their obligations to convert those notes in reality²⁸ (a situation that,
    regrettably, saw a “remake” with the 2022 crypto crash).


    ²⁵ Such would require an ad hoc analysis, but some existing central bank laws
    may, due to the applicable definitions of money and currency, allow for the issuance
    of money in digital form.


    ²⁶ Bossu et al. 2020.


    ²⁷ For more on this see Riksbank 2019.


    ²⁸ Bossu et al. 2020.'
