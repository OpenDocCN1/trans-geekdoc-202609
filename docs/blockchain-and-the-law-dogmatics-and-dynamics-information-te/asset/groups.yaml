    \n- VI. 资产支持稳定币：旨在通过多种法币、一种或多种商品、其他加密资产或此类资产篮的抵押来维持稳定价值。¹⁰\n\n- VII. 算法稳定币：旨在通过内置的稳定功能根据需求变化增加或减少此类加密资产的供应来维持稳定价值。¹¹\n\
    \n去中心化稳定币（b., c.）旨在解决可能由法币支持稳定币（a）产生的信任问题。理想情况下，去中心化稳定币是以去中心化的方式通过超额抵押或算法方法创建的，完全在去中心化账本上运行，由去中心化自治组织治理，任何人都可以发布其储备金。因此，可以得出去中心化稳定币的核心组件如下：¹²\n\
    \n- 抵押品：这是稳定币的主要价值。抵押品可以是外生的（主要用于协议）、内生的（抵押品是为了作为协议内的抵押而创建的）或隐性的（设计缺乏显式的抵押存储）。\n\
    \n- **代理人**：抵押品提供者和用户。\n- **治理**：治理协议的功能和参数。\n- **发行**：控制稳定币发行的机制。\n- **预言机**：将外部数据（如价格喂）导入区块链的机制。\n\
    - **借贷市场**：这些协议允许任何抵押其加密资产并使用其获得贷款的人提供借贷服务。贷款者可以通过贡献贷款池并赚取此类资产利息来获得资产收益。³² 然而，这些市场与点对点贷款不可比，因为加密资产不是在个人代理人之间直接借贷，而是根据智能合约储备进行借贷：即聚合并池化的加密资金。由于\
    \ DeFi 和区块链的性质（借款人是伪匿名的），没有机制可以识别代理人、访问其信用评分和还款能力，或针对违约执行任何法律变更。为了防止借款人违反债务义务并给贷款人带来信用风险，借款人必须抵押其仓以涵盖债务价值。由于各种加密资产的历史波动性和低流动性，需要超额抵押。如果底层抵押品价格崩溃，将影响贷款资金。借款人必须确保抵押品始终高于预设阈值，且结算可以通过交付底层资产来完成。\n\
    \n- IX. 交易所（DEXs）：DEX 的诞生于解决中心化平台脆弱性的愿望。³⁴ 它们允许在没有中心中间的情况下交换加密资产。某些平台使用基于订单的系统。³⁵\n\
    \n- X. 订单簿：维护订单簿的计算开销很大，鉴于技术的去中心化本质，这是不可行的；然而，这将始终涉及程度上的信任。³⁶\n\n- XI. 自动做市者（AMM）：AMM\
    \ 是一种依赖数学公式为资产定价的去中心化协议。AMM 不需要订单簿。流动性提供者向流动池提供资金；随着池储备的变化，流动性提供者可能会收到与其最初存款不同的标记。这种风险被称为无常损失（imperman\
    \ loss）。³⁸\n\n- XII. 衍生品：衍生品是价值源自底层资产、事件或结果的合同。如果没有可以衍生价值的基础，衍生品本身是没用的。由于衍生品合约的发展有助于农民降低风险，衍生品的用途和类型显著增加。衍生品可用于管理与底层相关的风险，但它们也可能增加另一方的风险敞口。\n\
    \n- XIII. 典型衍生品：包括期货和期权在典型衍生品合约可以通过其底层规模和价格、到期日和结算机制来定义。\n\n- XIV. 永续合约：这些合约是期货合约和差价合约的混合体，没有到期日，且结算是连续的。此外，如果交易者的头寸资金不足，他们可能会通过提供资金交易来清空头寸。³⁹\n\
    \n- XV. 合成资产：抵押支持的代币，其价值根据底层资产参考指数进行波动，而不直接持有该资产的头寸。某些平台允许创建加密支持的合成资产，提供对商品、股票、指数或其他资产的链上价格暴露。³⁰\n\
    \n> ²⁵ https://www.cs.utah.edu/~germain/PPS/Topics/interfaces.html. 于2023年5月2日访问\n\
    > ²⁶ Lau et al. 2020, pp 13-16.\n> ²⁷ https://www.bis.org/cpmi/publ/d187.pdf.\
