    \n在两种情况下，被告很可能愿意接受链上执行的约束。第一是被告希望对原告提起反诉。第二是被告希望获得诉讼费用担保（下文将详细探讨）。\n\n南非法律中的反诉由《统一规则》第24条（Uniform\
    \ Rule 24）规定，该规则允许被告在答辩原告诉状的同时针对原告的反诉。⁴³ 反诉可以有条件地提起（即基于在原告诉讼失败时激活反诉的前提）。⁴⁴ 反诉也可以在诉讼和仲裁中提起，特别是在双方均因特定情况遭受损失的商业纠纷中，例如由于基础设施项目未完成，或外部事件导致一方宣布不可抗力。在这种情况下，双方都可能希望互相推卸责任，并就诉讼和反诉双方提交主张。\n\
    \n在B方可能希望对A方提起反诉的场景下，这对双方诉讼双方都是有意义的——双方都是纠纷中的原告，并能通过预先约定的智能合约执行获得即时救济。\n\n当使用南非仲裁基金会（AFSA）的《快速仲裁规则》⁴⁵\
    \ 仲裁争议的时间关键时，这一点尤为重要，该规则明确旨在确保争议得到快速解决。⁴⁶ 如果在快速仲裁中迅速出具裁决，双方之后再费力地按常规程序执行将几乎没有意义——一种与区块链执行密不可分的仲裁将确保整个过程在几周内完成，从而使主诉和反诉的原告均受益。\n\
    \n> ⁴³ 《统一规则》第24(1)条规定：“24(1) 提起反诉的被告应与其答辩状一起提交反诉，并根据第18和第19条列出其实质性事实，除非原告同意，或者如果原告拒绝，法院允许在后续阶段提交。反诉请求应列在单独的文件或答辩状中标题为‘反诉’的部分。无须重复诉讼中当事人的名称或描述。”\n\
    \n> ⁴⁴ 《统一规则》第24(4)条规定：“24(4) 被告可以就诉讼形式的请求或抗辩有条件地提起反诉。”\n\n> ⁴⁴ AFSA《快速仲裁规则》（2021年10月）。可用：https://arbitration.co.za/domestic-arbitration/expedited-rules/\
    \ 访问于2023年5月25日。第6(5)条规定了加速，以确保程序中提出的所有争议的公正、快捷且最终的裁定属于费用问题，且如有必要，他/她将拥有根据《AFSA管理仲裁规则》行事的仲裁员的所有权力。仲裁员行使的所有权力和职能应符合1965年《仲裁法》的规定。”\n\
    \n## 5.4.4 诉讼费用担保\n\n被告可能同意从此类链上执行中获利的第二个依据是，被告可以在诉讼费用担保方面受益。在上述详细场景中，A方被向B方提供诉讼费用担保。诉讼费用担保根据《统一规则》第47条提供，该规则允许诉讼人向诉讼另一方寻求在其诉讼中可能产生的费用担保⁴⁶\
    \ 第47(5)条规定，诉讼费用担保必须“…以[高级法院登记员]指定的格式、金额和方式给出”⁴⁴⁷\n\n虽然规则没有规定诉讼费用担保的具体形式，但既定惯例是其形式为银行担保⁸⁸\
    \ 这意味着诉讼人需要提供担保，在银行账户中存入设定的担保金额。然后银行对所持金额提供实物担保。该担保承诺向要求担保的诉讼人进行支付，即在特定事件发生时，向该诉讼人支付账户中的金额，除非提交了列明应付金额的结清费用单。当担保到期支付时，必须实物提交至银行网点进行支付。\n\
    \n显而易见，获得此类担保的过程（与传统执行一样）是一项艰巨且昂贵的任务。它需要向相关银行支付费用或佣金，以担保并维护持有资金的账户。此外，当资金在担保担保下由银行持有时，存款金额产生的利息是名义性的，导致所持金额随时间推移而贬值。\n\
    \n因此，对于被告（我们场景中的B方）来说，同意链上执行并将可能的判决金额作为智能合约的一部分是有吸引力的，前提是原告（我们场景中的A方）愿意对双方同意的任何诉讼费用担保采取同样做法。B方将在此享受到如下的慰藉：\n\
