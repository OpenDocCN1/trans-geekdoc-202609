    > ³⁵ Classification used by some scholars as Jeremy Sarkin.


    > ³⁶ In that sense, authors such as Wendy Lambourne for another perspective on
    Transitional Justice, namely “Transformative Justice”. For a deeper understanding,
    please see: Lambourne 2014b.'
