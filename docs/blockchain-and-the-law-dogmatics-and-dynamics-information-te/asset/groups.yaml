    ## 3 区块链的局限性？关于使用的考量……


    根据联合国对过渡正义（TJ）[^66]公共机构的指导，帮助延续违规行为的机构应当转化为维护和平、人权和法治的机构。这一支柱是确保不再重发生的保障，是防止未来人权侵犯[^67]的一种方法。不重发生机制通常关注人权侵犯（在技术和安全领域），通过使用工具或指导手段[68]
    引导产生更独立的机构[^69]，并通过对安全执法人员进行教育培训，以及对后代进行全面的教育改革，营造一种人权保护的文化。然而，这一支柱取决于政治意愿，当高层存在被指控侵犯人权的人员时，这种意愿可能会变得更加困难。尽管如此，应该收集有关犯罪人员的信息以备未来之用，特别是作为一种命名并羞辱的机制[^70]。尽管存在滥用风险，区块链技术仍然提高政府效率，以去中心化和开放的方式实现自动化流程，减少官僚主义并打击腐败计划。


    区块链技术在政府中的应用目前是一个广泛讨论的话题。在多个领域使用技术具有改进公共官僚机构的潜力，在行政决策中建立问责机制。


    区块链不仅可以用于提高国家决策的透明度，还可以帮助其他与恢复民主机构相关的过渡正义过程，包括审查程序和教育。


    所有审查程序和其他公共机构的结构性改革都可以向一个监管机构负责，且该机构的程序将在开源区块链系统中公开。此外，所有做出的决策都将以数字格式时间戳并验证，并存储在网络上。在任何方面，公共机构的决策都将由监管机构通过区块链进行公开审计。


    针对公员工及后代建立国际人权和人道主义法标准的教育计划，区块链技术可以通过监控教育时间表提供帮助。在这些情况下，可以开发基于国际标准、由区块链和智能合约驱动的人权教育系统。员工将使用其身份（或数字
    ID）与系统互动，课程将根据用户的频率或其参加的考试基于通过智能合约提供的模块，从而使当局对政府员工和教育系统内学生的教育计划有更好的控制。


    > 66 联合国秘书长 2010年，第9页。


    > 67 Villalla 2011年，第8页。


    > 68 审查和清洗（Vetting and lustration）是旨在从职位上撤除涉嫌侵犯人权的公职人员的程序，通常是前政权时期的一部分。参见 De Greiff
    2007年。


    > 69 Sarkin 2016年，第327页。


    > 70 同上。


    R. Gomide M. de Almeida


    上述措施具有深的政治色彩。换句话说，必须有政治意愿将这些措施付诸实践，重新赢得信任并促进问责。区块链的优势在于可以在程序层面上运行，提供增强的透明度和更高的经济性。


    区块链在政府的其他领域也很有帮助，例如在反腐败71, 选举（通过防篡改的投票记录和智能合约）72 或土地所有权73 中。在处理这些问题时，区块链的不可篡改性和加密性，结合开放访问平台，可以为政府提供透明的记录过程。这意味着政府还将更好地控制数字
    ID 记录、存储公共机构之间的文档和数据交易、金融资源及其可追溯性（特别是在基于本币的稳定币开发中）、刑事记录和护照数据。74 这类领域可以通过电子政府应用进行管理，这将要求政府使用更多的技术工具。


    ### 3.3.4 赔偿


    过渡正义中的另一个基本支柱是赔偿。它不仅出现在若干国家的准则中，而且是联合国大会第 60/14 号决议的一项国际原则。针对公职人员及后代建立国际人权和人道主义法标准的教育计划是另一个基本支柱。向受害者提供赔偿是过渡正义的核心原则之一。75
    区块技术可以帮助监控教育时间表。76 赔偿类型可以与其他支柱相关联。在任何情况下，赔偿都应与损害成比例。赔偿的不同类型包括：


    - 恢复（Restitution）：受害者的原有状况

    - 补偿（Compensation）：受害者的经济损失

    - 康复（Rehabilitation）：受害者的医疗和心理问题

    - 慰藉（Satisfaction）：寻求真相、官方道歉或司法制裁的形式

    - 保证（Guarantees of non-repetition）：确保不再发生


    + 71 了解更多关于反腐败中的区块链，请参见：Aggawal 2019。


    + 72 了解更多关于电子投票，请参见：Lyons et al. 2018。


    + 73 了解更多关于土地所有权的区块链，请参见：Eder 2019 以及 Khetri 2017。


    + 74 Olnes et al. 2017，第357页。


    + 75 联合国大会 2006年。


    + 76 Villalba 2011年，第6页。


    ## 3 区块链的局限性？关于使用的考量……


    （通过司法和安全部门）。77


    尽管国家有义务保护其充分性，赔偿计划面临着一些挑战。这些包括赔偿计划的“完整性”，78 法院判决公众参与（特别是受害者的参与），以及集体赔偿与个人赔偿之间的问题。79


    赔偿的范围通常更广，因为它不仅涉及个人补偿措施，还涵盖了个人、集体、公民以及政治、经济、社会和文化领域，并以创新的方式实现。


    违规问题将得到考虑，赔偿类型也将需要被纳入。然而，问题通常涉及政治偏见，并对监控过渡正义程序的外国行为者构成了挑战。


    在该领域，区块链技术应用也可以帮助建立全面的赔偿系统，协助向受害者提供援助并追踪其需求。


    由于区块链技术的透明性和可追溯性——特别是财务赔偿——可以进行追踪以确保将正确的金额支付给正确的受害者。尽管如此，这种能力还可用于监测针对特定社区和受害者的健康产品和其他货物，通过生产概念实现。80
    区块链的使用实现了对产品的近即时监控，由于供应链透明度的提高增强了从人权侵夺者处购买产品的企业的问责制（例如来自塞拉冈的血钻石）。


    关于土地恢复，区块链技术提供了注册土地的新方法。即使无法进行土地恢复，国家也可以提供政府证券或券证作为土地损失的补偿，这将产生此类证券的二级市场。81 如果这些证券代币化，这个证券市场可以受到监管，但同时也将获得补偿的受害者引入金融系统，使代币交易对他们成为具有吸引力的资产。


    + 77 联合国大会 2006年，第7–9页。


    + 78 联合国人权事务专处 2008b，第15页。


    + 79 Villalba 2011年，第6页。


    + 80 Khetri 2017。


    + 81 Roht-Arriza 2013年，第21页。


