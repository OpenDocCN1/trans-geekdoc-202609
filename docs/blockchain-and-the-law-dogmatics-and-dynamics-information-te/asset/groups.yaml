    虽然人们很大程度上接受并非所有智能合约具有法律相关性，但技术社区通常反对使用这一术语，因为技术概念被法律术语的使用所特征化55 “它混淆了水并并招了不必要的法律/监管审查”，并导致“（1）混乱、（2）不连贯、（3）不必要的复杂性、（4）监管反噬、（5）成本增加、（6）困惑以及（7）创新减少。”^56
