    与其他类型的收入一样，值得注意的是B类**经营和职业收入**的征收制度：在《个人所得税法》第4(1)(o)条中，并未明确将与加密资产相关的业务（包括挖矿和通过共识机制验证资产交易）界定为商业和工业活动。此外，在简易征税制度的范围内，50
    现在预计通过对交易适用0.15系数来计算应纳税收入，但加密资产挖矿除外，挖矿适用0.95的系数51（个人所得税法第31(1)(a)和(d)条）。


    还应注意到，《个人所得税法》第5(2)(u)条将任何由于加密资产相关交易产生的报酬形式界定为**资本收入（E类）**（税率为28%，可选择普通税率征税）。收入无论以何种形式支付均免于预扣——即以法币支付时；当以加密资产形式支付时，根据第5(11)条按G类（资本利得）征税，上述情况即属于此类规定。


