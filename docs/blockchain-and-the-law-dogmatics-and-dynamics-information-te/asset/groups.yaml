    ## 4.2 Overview of Some Relevant Features of the Portuguese Tax System


    ### 4.2.1 The Principle of Tax Legality and Its Importance in the Context of Crypto-assets


    Crypto-assets are a recent reality. Legal systems should be flexible to keep up
    with the current landscape but in the case of tax law such systems and flexibility
    should be circumscribed by the principle of legality. In fact, “the principles
    of people’ sovereignty and possession of powers require that the law of tax is
    discussed and approved by parliament.” For that reason the Portuguese Constitution
    establishes such principle in article 103.


    The principle of legality not only means that tax rules should be approved by
    Parliament but also the essential elements of a tax in article 103(2) of the Portuguese
    Constitution (“Taxes shall be created by law, which shall lay down rate, tax benefits
    and guarantees”). The guarantee-based function of this principle is associated
    with the predictability of the amount of tax payable (and thus also with legal
    certainty). Following this rationale, article 11(4) of the General Tax Law (“GTL”)
    establishes that “the gaps in tax rules covered by law are not susceptible of
    analogical integration; when the TA faces a case if the facts fulfils the provision
    of statutory law, there is a taxable event; if the facts do not correspond to
    any statutory law (not even by interpretation), there is no taxable event (so
    taxpayer should not be subject to tax).”


    Thus, for instance, if one sells a cryptocurrency, the resulting income will only
    be taxed if the tax law covers such type of income. But if the tax law does not
    cover one phenomenon, there is no taxable event. To sum up, *nullum tributum sine
    lege* is very important in the context of crypto-assets.


    ¹ Dourado 2014, p. 2.

    ² In the Portuguese case, article 165(1) of the Constitution establishes that
    the Parliament has legislative competence over the creation of taxes unless it
    authorizes the Government to do so.

    ³ Fonseca and Otero 2008, p. 85–86. Article 8(1) of the General Tax Law establishes
    a similar option to article 103(2) of the Portuguese Constitution.

    ⁴ Dourado 2007, p. 79.

    ⁵ Free translation.

    ⁶ Still, one should recall that the Portuguese Statutory Laws use undetermined
    concepts, grant discretionary powers, and allow the conclusion of fiscal contracts
    (with some boundaries)—e.g., Pires and Calçada Pires 2012, p. 114.


    ### 4.2.2 The Principle of Legal Certainty and the Binding Rulings


    The principle of legal certainty in tax application (connected with the principle
    of legality) is a corollary of the rule of law, and it implies the rejection of
    arbitrariness and the defense of tax transparency, allowing an individual to know
    in advance which he or she will be subject to the principle of good faith provided
    by article 103(2) of the Constitution.


    Given the dictates in qualifying the new realities underlying crypto-assets, especially
    if we consider that these economic events are not always well understood by decision-makers,
    this principle gains greater relevance. Consequently, the importance of binding
    rulings by the TA stands out since they clarify the interpretation of tax law.


    Article 68 of the GTL allows any taxpayer to request a binding ruling on his or
    her specific tax situation by stating the relevant facts (as long as they are
    not subject to a tax). The relevant ruling should be issued within 150 days. The
    TA cannot proceed subsequently in a different direction from the binding ruling
    (within the scope of the request), except in compliance with a judicial decision—see
    article 68(1), (3), and (14) of the GTL. All binding rulings should be published
    by electronic means (i.e. in TA''s official website) with safeguards of the taxpayer''s
    personal data—article 68(17) of the GTL. To this rule, the interpretation of the
    law by the TA is publicly known, which brings greater legal certainty to taxpayers
    by assuring predictability in TA''s future behavior.


