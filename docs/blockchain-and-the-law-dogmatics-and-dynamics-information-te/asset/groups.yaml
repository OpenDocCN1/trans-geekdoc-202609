    # 1 Blockchain and the Law: Setting the Floor


    It is unclear to what extent the attention afforded to the economic value of tokens
    does not soak all the interest in protocol development and adoption.


    # 1.4 The Law in Blockchain


    Blockchain is a technology and an economic reality. As a communication technology,
    it is used to progress human interaction; as an economic reality, it is a production
    of value. In both ways, blockchain is a social phenomenon and, therefore, a legal
    one too.


    Where is the law in blockchain? Put: whenever there is an agreement between two
    or more people. People download the protocol and run it, accepting that action
    to participate in a joint enterprise. By participating in the enterprise, they
    subject themselves to the protocol of rules and functioning. If a malicious intent
    wrongs their legitimate expectations, they have the right to claim damages from
    those who wronged them. Suppose they were not wronged, and there were legitimate
    expectations that they were, downloading the protocol, participating in a risky
    activity. In that case, they are at their peril without solid protection.


    Users of the network transact with one another. Transactions are subject to legal
    rules and principles. They use a smart contract, but a smart contract is a way
    of executing the transaction and not a legal agreement subject to specific rules
    that are “alegal”. After all programmable code is a language written by people
    and can represent declarations and agreements.²⁶ Concerning interactions with
    people, download a wallet, open an account in an exchange, download a phone to
    the custody of their tokens: these are all legal agreements, subject to contract
    rules. As categories of value (e.g., securities, property titles, identity marks),
    must abide by the applicable regulatory standards. Apart from El Salvador and
    the Central African Republic, crypto-assets do not enjoy legal status in any jurisdiction.
    However, that do not make them, per se, forbidden payment methods (legally, they
    are just equivalent to barter; if people agree to pay and be in crypto, there
    is, general, no consequence).⁷


    The picture above is simple, I admit, and does not consider some complex situations.
    For example, regarding the rights and duties of participants in the network: if
    a miner fails to mine a block and insert a transaction for a user, can he/she
    damages the miner for loss? If the protocol’s code has a bug, and that bug enables
    the running of illegal transactions, which is to be responsible? The protocol’s
    creator, the foundation/company that created and takes care of the protocol’s
    maintenance? The freelance programmers and developers who dedicate their time
    (often subsidized by grants from the founding companies, foundations, or protocol
    investors)? What about voting and participation? Do I have a right to


    ²⁶ See Chap. 8 by Ferreira in this book.


    ⁷ Unless, of course, crypto payments are forbidden in that specific jurisdiction.'
