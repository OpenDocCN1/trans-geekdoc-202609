    3 What Are the Limits of Blockchain? Considerations on the Use ... 45


    # 3.3.5 Reconciliation


    The UN Guidance Note has National Consultations as its fifth pillar,88 which states
    the importance of elaborating an action model tailored to the particularities
    of each country. This approach comes under academic criticism, since it might
    lead to the narrowing of the ambit of transitional justice.89 Reconciliation is
    regarded as a desired achievement or goal in TJ. With that in mind, reconciliation
    as a fifth pillar means that the TJ mechanisms should not only aim for reconciliation
    as a consequence of its approaches but actively utilize reconciliation tools for
    better results.


    Reconciliation is understood as a long-term process through which psychosocial
    healing takes place, but which needs the actors to play an active role in forming
    levels of peaceful coexistence.90 with every other TJ pillar manage.91 A transitional
    environment can effectively promote the context needed to pursue reconciliation.


    Issues of truth-seeking, justice and accountability, socioeconomic equality, forgiveness,
    and dialogue between antagonists are essential to foster reconciliation, as is
    the outreach of actions to encompass the entire population of the region concerned.92


    Despite all these, reconciliation is deeply dependent on contextual structure,
    which means that each case needs specific measures that will efficiently apply
    to the situation at hand.


    Reconciliation as TJ''s fifth pillar means that it should be at the center of
    TJ process. The movement of reconciliation is the movement of TJ, where the use
    of the other mechanisms must be connected to a common purpose. Reconciliation
    is not seen as a final objective but part of the TJ process. However, including
    reconciliation as the central pillar of TJ means reconciliation is not only a
    process but also an end in itself.


    The other pillars of TJ can, work separately without aiming specifically at a
    reconciliatory process, which is likely to lead to fragile and brief periods of
    peace.93 Reconciliation is of a complexity that needs different approaches to
    succeed.


    Blockchain technology can develop a reconciliatory umbrella network, where all
    TJ mechanisms can exchange data between themselves, in a faster and secure way,
    to understand how to achieve the common ground for reconciliation properly.


    Blockchain technology can also assist in reconciliation indirectly by acting on
    the other pillars. All the potential uses of blockchain listed above, will, help
    in the reconciliatory process, if their approaches aim at reconciliation.


    > 88 United Nations Secretary-General 2010, p. n.


    > 89 Nagor 2008 and Langbourne 2014a.


    > 90 Avruch 2010 and Aiken 2014.


    > 91 In that sense Neville Aiken proposes contact, dialogue, promotion of truth,
    justice, and the amelioration of socioeconomic inequalities. Aiken 2014, p. 57.


    > 92 Ibid.


    > 93 Skaar 2012.'
  - '[PAGE 58]


    Therefore, the objective of the blockchain network to assist in reconciliation
    relies on two aspects. The first is indirect, where blockchain acts in other TJ
    pillars, improving their effectiveness, but with the condition that these pillars
    have a built-in reconciliatory approach.


    The second aspect is the creation of a comprehensive system, based on a blockchain
    network, where the information of different sectors of TJ can be exchanged between
    the nodes. Building a completely changeable TJ data share for specific markets
    will foster reconciliation because it will reunite and redistribute information
    from various TJ fronts, allowing for the fast, secure, and decentralized exchange
    of data between the mechanisms.


    So, in a state-of-the-art situation, a broad network powered by a public permission
    blockchain system would allow every node (represented by the TJ pillars) to communicate
    and transact information between themselves. Only nodes with permission would
    be to input transactions into the network, but all information would be publicly
    available.


    # 3.4 Conclusion


    This chapter has analyzed how blockchain technology could be related to transitional
    justice processes, verifying each of the five TJ pillars in a state-of-the-art
    blockchain situation.


    Blockchain technology creates new paradigms for the transaction of information
    in a decentralized, instantaneous, and secure way. It has created new types of
    money and assets in borderless environments. It has also allowed a more thorough
    audit of goods in the production chain, ensuring better standards within the entire
    ecosystem. At the same time, several governments have been focusing on its potential
    to modernize the public sector and make it more efficient.


    The characteristics of blockchain technology: decentralized control, a shared
    view of the truth, cross-border collaboration, auditing of data, and the exchange
    of information/value through digital tokens, combined with its possible public
    or permitted and permissionless, permitted network designs could be of great assistance
    in more sensitive fields, such as transitional justice, especially when the government
    is viewed as not trustworthy.94 Using blockchain technology would mean that several
    processes could be implemented without the need of government machinery, thereby
    enhancing the transparency of its procedures.


    Yet, transitional justice is a field of international human rights and humanitarian
    law that deals with the past. It works in very complex conditions which, in many
    cases, lack proper funding for the proper project implementation. Also, there
    are issues of trust and belonging among nations and victims. The path towards
    achieving a reconciliation is a winding one and demands a lot of energy, planning,
    political


    > 94 Werbach 2018, p. 77.'
