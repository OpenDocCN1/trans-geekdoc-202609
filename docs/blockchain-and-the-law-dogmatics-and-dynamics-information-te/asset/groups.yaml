    对于区块链技术，立法上的分歧将引起困惑并增加合规成本。$^{87}$


    对智能合约引入多种定义并明确赋予其法律地位，也可能导致既有法律学说和现有法规的应用产生不确定性，例如《统一电子交易法》（Uniform Electronic
    Transactions Act），该法通常被认为对于电子签名和智能合约是充分的。$^{88}$ 美国数字商业协会表示，现有的美国法律“支持州法下智能合约的形成和可执行性”，且“起草不一致的额外州立法将混扰市场，并可能阻碍创新。”$^{89}$
    在美国法律下（在很大程度上源于普通法体系），即使在没有立法承认智能合约的情况下，司法机关也将适用普通法和成文法合同渊源来确定智能合约的可执行性。然而，一旦有了成法承认，法院和其他机构将不太可能拒绝智能合约的可执行性。


    两家美国监管和监督机构——美国商品期货交易委员会（CFTC）和美国证券交易委员会（SEC）也通过其调查和澄清指南涉及了智能合约。美国联邦贸易委员会（FTC）甚至引用了一份关于智能合约的入门指南，探讨了智能合约的优势、风险和法律问题。$^{90}$
    FTC 声称，取决于事实和情况，智能合约可能是一种具有约束力的合同，并解释说现有的法律框架适用，且智能合约根据其应用或产品特征受到多种法律的约束。该指南还强调，尽管智能合约有许多优势，但也存在若干必须解决的风险和法律考量，包括由治理协议产生的操作、技术、欺诈和网络安全风险。


    ## 5.5.2 欧洲


    世界上第一个通过智能合约法规的国家是白俄罗斯。2017年12月的一项总统令将智能合约定义为一种旨在在交易账本（区块链）或其他分布式信息系统中运行的程序代码，用于自动履行和执行交易，或履行其他具有法律意义的行动。该法令允许在名为“高新科技园区”（Park
    of High Technologies）的特区通过智能合约进行交易的履行和执行。俄罗斯立法者在2019年通过修订《民法典》，将数字资产引入俄罗斯民法体系，纳入数字权利和智能合约的概念。智能合约被视为合同履行的手段，而非特殊类型的合同，因此现在俄罗斯可以合法地将其应用于任何类型的交易中⁹¹¹


    意大利是第一个以通用方式监管分布式账本技术和智能合约的欧洲国家，未参考任何特定行业或应用。² 新法（第12/2019号）引入了对智能合约的合格认可，并将智能合约定义为“一种通过分布式账本技术运行的程序，其履行根据双方定义的效应自动约束两个或多个主体”。在智能合约被认可为一种书面签署的、自动化且可执行的协议之前，需要一种高级电子签名或合格电子签名系统来识别双方身份。


    在欧盟层面，关于智能合约合法性及其在跨境情况下的可执行性的不确定性也得到了认可，法律事务委员会的草案报告强调，即将出台《数字服务法案》为评估智能合约被视为法律有效的要求提供了机会。欧盟委员会将评估跨境情况下智能合约的合法性和执行力，并为适当的法律框架提出建议。报告强烈建议智能合约应包含可以停止执行的机制，以保护弱势方，并确保破产和重组期间债权人的权利得到尊重.³³


    ## 8.5.3 英国


    英国司法管权任务组（UKJT）于2019年12月发布了关于英格兰和威尔士法律下加密资产和智能合约状态的声明。声明得出得出，智能合约能够形成有效的、具有约束力且可执行的合同。它强调了普通法的适应性和灵活性，普通法能够适应智能合约等技术进步。UKJT解释说，没有理由认为普通法下合同形成的三个要求——要约、接受和对价（consideration）——不能通过智能合约满足。智能合约可以在现有的建立框架和合同法学说下实施和解释。尽管该法律声明是基于英国法形成的，但其他普通法法律体系也具有相似之处，特别是在其灵性和合同形成的原则方面。


    > ⁹¹ Moyle and Bacheyeva 2019.

    ² Rumi et al. 2020.

    ³³ European Parliament 2020.

    ⁴ UK Jurisdiction Taskforce 2019.


    ## 8.6 结论


    智能合约引起了巨大的兴趣，具有巨大的潜力，并提供了主要的利益。智能合约的潜力已得到行业、法律界的认可，最近也得到了一些监管机构和立法者的认可。UKJT确认，“从法律角度上说，加密资产和智能合约将重复未来。”⁹⁵
    尽管一些法律学者认为它们是“一个承诺中的区块链革命中一个潮湿的、令人遗憾的广泛分发的哑炮。”⁹⁶ 因此，理解和澄清这一创新的规范维度并制定其法律基础至关重要。


    智能合约并非大同小异。它们从简单、直观、标准化的支付工具，到自主执行复杂一系列动作的复杂工具不一。随着智能合约使用的增加，将需要更多的法律澄清、立法承认和监管指导。技术与法律的交叉带来了挑战，且^97适当的监管应对为行业、投资者和消费者提供市场信心和法律确定性至关重要。


    智能合约的几个方面对法律界构成了挑战，但不可能破坏现有法律体系，从原则上讲，对智能合约似乎没有主要障碍，在大多数法律体系下审查它们不需要剧烈的改革。到目前为止，立法者的反应有限，仅限于智能合约的基本定义、法律承认和证据可接受性。智能合约应坚定留在立法者的议程中，他们将充分考虑这一技术发展并密切监测，介入提供法律清晰度，支持创新并降低风险。


