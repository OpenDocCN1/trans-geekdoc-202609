    # Blockchain and the Law: Setting the Floor


    protocol—that establishes the basis and structure of power. As soon as this is
    identified, settled, connections for establishing rights, duties, and liability
    will flow.


    Blockchain is a private endeavor, a market created by power and managed by people,
    even if based digital platforms with automated mechanisms of interaction in place.
    People establish the rules through agreement and within the space of autonomy
    the law provides for. If there is a problem with the code, in terms of how something
    is impossible to achieve (for example, data privacy), it is necessary for the
    code to be amended, which can happen.


    The situation with Bitcoin is the most difficult from one perspective. The anonymity
    of Nakamoto, with the lack of a centralized structure between the protocol and
    the multiple actors that are, in one or another, invested in, makes it very challenging
    to find adequate legal protection for users and to understand the rights and duties
    of each actor within the network. There is some form of legal practice, call it
    a digital-community at play, in the way the members of the Bitcoin community establishes
    procedures for updating the network³¹ Still, the process is somewhat erratic and
    informal. Nevertheless, given the fact that in terms of market adoption, most
    people deal (and deal) with intermediaries and, therefore, not connect to the
    network directly, and give the liability between the user and the intermediary,
    I do not consider the situation very problematic, from a realistic standpoint.


    # 1.5 The Law for Blockchain


    Blockchain is this legal phenomenon because the law covers and regulates blockchain
    and its developments and interactions. Another question is if this "coverage"
    (or regulation) is adequate. I will try to provide some ideas in this section.


    The law receives social and technical phenomena under its terms. The operation
    of law, however, is complex, with a significant role afforded to hermeneutics
    and interpretation. The more open the meaning of rules is, the bigger the capacity
    of the law to adapt to new phenomena. One excellent example is the definition
    of what constitutes security under EU law, which is open to include any manifestation
    of value that works as an investment³².


    Is law "adaptive" enough to deal with blockchain and its developments? We have
    seen that private law rules can deal with several situations of blockchain technology.
    However, the space of autonomy of private law ends, and some things that with
    the greater adoption of blockchain are not permitted. For example, it is generally
    not legal to establish a negotiation system of financial instruments in a decentralized
    blockchain. It is also illegal (or at least devoid of legal effects) to represent
    a property title from a house, car, or corporate store as a cryptographic token;
    it is necessary to


    > ³¹ The book by Jonathan Bier shows this perfectly, See Bier 2021.


    > ³² See Ferrari 2020, 325–342.'
