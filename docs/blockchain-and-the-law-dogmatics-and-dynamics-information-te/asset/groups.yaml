    # Preface


    Blockchains and distributed ledger technologies (DLTs) are one of the major technological
    developments of our times. DLTs are computer protocols designed for storing and
    managing data in a distributed manner, through different participants connected
    in a peer-to-peer, decentralized digital structure. Blockchain is the name attributed
    to a type of DLT that were inspired by the protocol behind the Bitcoin cryptocurrency,
    Satoshi Nakamoto, its founder. The monetary value and volatility of the cryptocurrency
    were first "trustless-based" payment system in the world, as per the words of
    Satoshi cryptocurrency were first to capture the attention of public opinion;
    since then, new technologies improving and expanding the capacity of the “genesis”
    protocol have appeared, morphing blockchain and crypto into a technological sector
    called “blockchain”.


    Currently, there is an enormous offer (and continuously growing) of projects in
    the blockchain landscape. While new sectors have emerged with DeFi protocols and
    products fighting to establish a stable and profitable decentralized financial
    market, crypto exchanges have become regulated and incorporated in various jurisdictions.
    Crypto is being used as an alternative savings and investment product, while so-called
    traditional "legacy” institutions—e.g., banks, investment funds, and public administrations—are
    developing or adopting applications to the market and offer DLT-based services.
    Long gone are the days in which blockchain and crypto were looked as dangerous
    products, with the sole purpose of escaping law enforcement, and disguised as
    simplistic claims of libertarian desires and cyber-punk wonders. Crypto is now
    mainstream.


    Proponents of the technology argue that blockchain has the potential to substantially
    alter commercial relations, either those that are business-to-business or those
    that are business-to-consumer, by switching commercial trade from market agents
    and intermediaries to computer programs based on algorithmic truth rather than
    on protocols distributed by computers all over the world. Blockchain technology
    has brought about a paradigm shift in the way we think about and exchange value.
    Its potential for innovation and disruption has been widely recognized across
    various industries. However, any new technology brings legal and regulatory challenges
    that must be navigated.'
  - '[PAGE 6]


    vi


    Preface


    The law and blockchain have a difficult relationship: the core principles of privacy,
    decentralization, and automation of the technology conflict with classic juridical
    standards concerning stability and liability of legal relations, although new
    laws have been enacted during the past years to help.


    From 2018 to 2020, the three of us have organized at Nova Law School three post-graduate
    courses on the legal aspects of blockchain technology. These courses were the
    first of their kind to be offered in Portuguese universities, and a variety of
    Portuguese and international academics, entrepreneurs, lawyers, and regulators
    participated. This book condenses “best of” of sessions taught in three courses,
    dealing with issues regarding the convoluted application of legal standards and
    rules to blockchain technology.


    Staying true to the internal structure of the courses, the book contains eight
    chapters dedicated to general and more sessions between blockchain or DLT-based
    innovations and the law.


    The book starts with Martinho Lucas Pires'' chapter titled “Blockchain and the
    Law: Setting the Floor” (Chap. 1). Call it a general introduction to the state
    of the art in the blockchain and law debate and an attempt to summarize the real
    challenges and the not so real hypes concerning the relationship between blockchain
    and its innovations and current legal standards.


    Nelson M. Rosario in Chap. 2 adventures into the promises and pitfalls of blockchain-based
    structures for voting. In Chap. 3, Renato Gomez Martinez discusses the use of
    blockchain in transactional justice processes, exploring its application in criminal
    prosecutions, trust commissions, and restoring democratic institutions and reconciliation.
    In Chap. 4, Marta Cosmo looks at the evolution of the tax treatment of crypto
    assets in Portugal, explaining and deconstructing the approaches by the Portuguese
    tax authorities that lead to the country in certain media circles being named
    as a “crypto tax haven”.


    In Chap. 5, George Daniel Rath dives into the topic of blockchain in the execution
    of judgments in the context of South Africa. João Vieira dos Santos and Guilherme
    Maia in Chap. 6 consider the legislative initiative of the European Union in setting
    up a DLT Policy Regime and its possible impact on DeFi products. Anjeja Bajaj
    and Bernardo Corre Barradas in Chap. 7 look at the central bank digital currency,
    or CBDC, and its implications for anonymity. And, in Chap. 8, Agata Ferreira concludes
    the book by discussing the specific relationship between smart contracts and the
    law, looking at the advantages of smart contracts and addressing the scholarly
    debate surrounding their implementation and use.


    All in all, this book provides a comprehensive overview of the intersection between
    blockchain and the law. It delves into the legal implications of blockchain technology
    and how it is being treated under existing legal frameworks. It also explores
    the potential of blockchain to reshape the legal landscape and how the law will
    continue to evolve in response to the growing use of blockchain. The book offers
    valuable insights into the complex relationship between blockchain and the law.
    It provides a well-rounded understanding of the legal implications of blockchain
    and how it can be leveraged for the benefit of society.'
