    Constitution, arises.

    ⁹ This is only mandatory if the request is urgent, in which the ruling should
    be issued within 75 days under penalty of the ruling being tacitly sanctioned.
    Beside, a fee is due (the amount varies with the complexity). V. article 68(2),
    (7), (8) and to (10) of the GTL.

    ⁰ The binding rulings are published only (in Portuguese) at https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/informacoes_vinculativas/Pages/default.aspx.

