    ## Abstract


    This chapter discusses the opportunities and perils associated with blockchain
    technology in elections. It covers the history of blockchain, as well as some
    of the benefits and drawbacks. The chapter turns to the reasons for the growing
    interest in using blockchain for elections. In particular, the current state of
    the art regarding blockchain and elections


    ## 2.1 Introduction


    The provenance of our votes, and the assurance that comes with knowing your vote
    counted the way you intended is what builds trust in elections. In this environment,
    many people see blockchain technology as a solution. As one example, US Presidential
    candidate Andrew Yang famously suggested its 100% technically possible to have
    fraud-proof voting on mobile phones. This would revolutionize democracy and include
    all Americans—those without smartphones. Technical solutions do not exist in a
    vacuum and technology would be deployed to systems where there are none


    ## 2.2 Elections


    Blockchains are an effective solution for the “double-spend” problem, as applied
    to cryptocurrencies and other digital assets. They are not, however, on their,
    good solution for election voting let election space must take into consideration
    the political environment, the cultural environment, the legal environment, and
    the technological environment. Without additional changes to an electoral system
    technology as it is commonly employed adds little.


    ## 2.3 Blockchains


    According to IBM, a blockchain is a “shared, immutable ledger that facilitates
    the process of recording transactions and assets in a business network.” The IBM
    definition is useful in that it focuses on transactions and assets that exist
    in a business network. The very first blockchain of economic significance was
    the Bitcoin blockchain. As IBM claims, the benefits of blockchain are greater
    trust, security, and more efficiencies


