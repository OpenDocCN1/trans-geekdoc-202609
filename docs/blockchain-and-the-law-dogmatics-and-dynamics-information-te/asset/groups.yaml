    \n## 3.2 什么是区块链？\n\n首先，定义区块链技术（特别是其技术方面）很重要，然后考虑哪些应用是可能的。在过渡正义（TJ）背景下，有几种潜在的应用，例如人口识别和文档的数字注册（如土地登记）。\n\
    \n区块链技术首次向世界介绍是在 Satoshi Nakamoto 关于比特币的论文中。这篇论文成为区块链开发为实际情况的核心模型；它是完全虚拟的，并且可以在无信任（即去中心化）环境中被信任。Satoshi\
    \ 的文章基于之前对拜庭将军问题和数字时间标记的研究。第一项研究旨在理解计算机如何在对抗性环境中运行、处理冲突信息、如何克服分布式系统中缺乏信任的问题以及达成共识；\n\
    \n简而言之，区块链是使用“块”系统的电子交易的点对点版本，消除了金融交易中所有形式的中介或中央权威，因此被描述为治理。该程序在开源系统上运行，允许任何\n"
