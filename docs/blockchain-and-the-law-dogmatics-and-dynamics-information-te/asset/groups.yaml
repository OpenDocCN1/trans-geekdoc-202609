    到目前为止，我还没有涉及代币和加密货币。比特币协议作为激励机制产生了其代币：一种存储在用户钱包中并在协议中注册的价值的数字表示形式。该代币的目的是作为支付机制，因此；所有协议代币（通过加密手段存储）都被称为加密货币。在加密世界中，代币起着两个作用：其是去中心化共识机制运行的经济激励，另一个是产品——换句话说，是使协议产生价值的元素。


    比特币的价值在于其作为货币的角色——支付机制、价值载体或记账单位（对于比特币更擅长处理哪一种目前尚无定论）。然而，其他代币有不同的用途。例如，以太坊用于以太坊网络的存储空间和交易费用；Filecoin
    允许用户在 Filecoin 协议中存储数据；Tezos 允许持有者对协议治理进行投票；Ada 在池中质押时会为其持有者产生红利。某些代币代表用抵押品或通过公开发行的行的资产。简而言之：代币代表不同的价值类型，如权利、协议、财产等……考虑到它们具有多种效用，将它们视为货币是不够的，更准确的术语是“加密资产”。


    尽管如此，市场实践已根据功能对代币进行了划分。这种划分随后被公共机构（包括欧盟监管机构）采纳，并纳入《加密资产市场法规》（MiCA）。^24 经典的功能划分分为代币（类似于证券）、恢复性代币（类似于证券）和实用型代币（基本上是其他所有）。这种分类有些简单且人为化，因为某些代币可以符合多个类别。例如，一个旨在作为货币而创建、但在质押时提供红利的代币，它（或应该被视为）仅仅是货币代币。通过公开发行的行的实用型代币仅仅是实用型代币吗？这些类别在
    2017 年市场开始出现时仅用于说明；2021 年，随着一些协议全面运作以及更多用户使用去中心化金融（DeFi）协议和代币，维持这种分类似乎变得非常复杂.^25


    代币可以说是区块链现象最广为人知的事实。它们是协议运行的核心部分，并已成为流动性的易来源。代币可以在人之间进行交换，且无需或仅需极少的中间干预，从而降低了交易成本。尽管如此，尽管具有功能性，但它们具有投机倾向，产生了一种（并不成熟的）金融市场，这正开始吸引其他传统的机构参与者，如银行和公司。加密市场的另一个关键因素（也是对分布式账技术去中心化承诺的另一个讽刺反转）是，代币经济中的几个实体是中心化管理的（例如钱包提供商、交易所和托管机构）。


    ^24 欧盟委员会，《关于欧洲议会和理事会关于加密资产市场的条例建议并修订第 (EU) 2019/1937 号指令》，COM/2020/593 final。


