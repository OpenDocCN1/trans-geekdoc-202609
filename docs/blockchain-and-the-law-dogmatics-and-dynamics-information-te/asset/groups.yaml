    # 表 4.2 增值税委员会对采矿的结论


    | 活动 | 是否适用增值税？ |

    | --- | --- |

    | 采矿活动 | - **超出范畴**：比特币用户支付交易费用这一事实，并非成功发送比特币（因此是获得矿工提供的验证服务）的先决条件，这可能表明对价与服务之间不存在直接联系。此外，提供采矿服务并不会让矿工获得用以交换的对价，这可能意味着矿工与验证服务的服务的接收者（即矿工验证了其交易的用户）之间不存在法律上的逻辑推演关系。<br>-
    **应纳税**：矿工每当提供一次验证服务时，从比特币系统自动收到的新比特币可以被视为构成了应纳税服务的对价。<br>- 尽管理论上可以免费进行比特币交易，但在实践中，比特币用户支付费用（大多数数字钱包的默认设置）；似乎无法想象用户愿意在交易被核实之前等待几天或几周（如果不支付费用，可能会出现这种情况）。
    | - **免税**：根据《增值税指令》第 135(1)(e) 条，采矿活动可以被视为直接涉及货币的豁免货物。<br>- **免税**：根据《增值税指令》第
    135(1)(d) 条，采矿活动可以被视为免税，基于它们在特定效果上实现了免税供应的核心功能（比特币本身的转移）。 |


    来源：欧盟委员会增值税委员会——2016年


    所有采矿活动导致了加密货币的“生产”


    最后，应该指出，正因为欧洲司法法院（ECJ）的裁定并未涵盖采矿，且如下表 4.3 所示，欧盟内部仍然不存在增值税中立性：


    ⁴¹ 正如无法保证矿工将收到加密货币，因此对其负担性质提出了质疑一样，Gamito et al. 2015, p. 119。


    # 4 加密资产征税——葡萄牙视角


    **表 4.3** 某些欧盟成员国的采矿增值税处理


    | 国家 | 税收规定 |

    | --- | --- |

    | 法国 | 从加密货币采矿活动获得的收入作为服务供应适用增值税。 |

    | 德国 | 从加密货币采矿活动获得的收入通常不属于增值税范畴。 |

    | 西班牙 | 从加密货币采矿活动获得的收入通常不属于增值税范畴。 |

    | 瑞典 | 从加密货币采矿活动获得的收入通常不属于增值税范畴。 |


    来源：作者<sup>42</sup>


    # 4.6 结论


    在加密资产背景下，应当注意税务合法原则的重要性，如果事实不符合法定法律的可预测性，则不存在应纳税事件（纳税人无需缴税）。法律确定性原则也相关，特别是在新的且复杂的领域。葡萄牙税务局（TA）的具约束力裁决对于任何想要澄清税法解释的纳税人来说都是重要工具。这些裁决是公开的，通过消除税务局行为不可预测性，为纳税人带来了法律确定性。然而，税务局仅对提交请求的纳税人及其相关事实具有约束力。


    根据企业所得税法（CIT Code）的纳税人可以通过加密资产获得多种收入，且所有收入都可以计入其应纳税利润，因为这些活动属于商业性质的经济活动，完全被企业所得税法（即其第
    3 条）所涵盖。尽管如此，如会计委员会（OCC）所指，会计收入应考虑会计标准，即国际财务报告准则委员会（IFRIC）的更新。


    对于自然人，只有当符合个人所得税法（PIT Code）六类收入之一时，加密资产收入才征税。税务局得出，出售加密货币产生的收入不是资本利得，因为它们不是证券。尽管如此，人们可能会质疑某些加密资产是否属于《证券法》第
    1(g) 条下的非典型证券。税务局的解释提供了更多的法律确定性，因为不需要进行严苛的分析。尽管如此，考虑到证券市场委员会（CMVM）的公告并考虑到税务局使用的用词是“目前”，并没有迹象表明税务局将改变立场。也没有迹象表明这将发生。相反，税务局得出结论：加密货币的销售在葡萄牙税制下是不税的，除非其经常性构成了纳税人的职业或业务活动，在这种情况下，将其被视为业务或职业收入。此外，考虑到任何类别的收入都可以以现金或实物支付，如果个人所得是用加密资产支付的，我们应该适用该法典的第
    24 条，该条款为实物收入的现金等值提供了连续规则。


    > 42 基于2018年6月。


    最后，在 Hedquist 案中，欧洲司法法院裁定出售比特币是《增值税指令》第 135(1)(e) 条豁免的服务供应，尽管它们不是货币，因为虚拟和传统货币在豁免目的上应具有相同的待遇。此案之后，葡萄牙税务局认为出售加密货币也根据《增值税法》第
    9(27)(d) 条豁免。最后，在同一案件中，葡萄牙税务局委员会认为采矿将受益于同样的豁免。然而，正如增值税委员会（以及其他成员国的立场）所示，可以得出采矿属于增值税范畴，根据第
    135(1)(e) 条甚至根据第 135(1)(d) 条豁免。因此，在增值税方面，许多与加密资产相关的活动仍存在不确定性。


    # 4.7 后记43


    自本章上次修订以来，发生了几项我们认为值得关注的相关进展。首先是葡萄牙 2023 年国家预算法对加密资产征税的重大影响。立法者在考虑加密资产背景下税务合法和法律确定性原则的情况下，决定为加密资产制定特定的税收规则45


    沿着这一路线，个人所得税法（PIT Code）现在有了加密资产的定义：“任何价值或权利的数字表示，可以使用分布式账本或技术进行电子传输或存储。”这一概念不包括与其他加密资产不可互换的独特加密资产，即非同质化代币（NFT）。46
    立法者还澄清了个人所得税法第 24 条的适用，即加密资产的现金等值物遵循已针对实物收入建立的相同规则（见第 4.4 节）。


    个人所得税法第 10(1)(k) 条的另一项相关修订是：现在在出售加密货币和其他加密资产时的新制度，将加密资产（非证券）的负担性转移47 归类于 G 表（资本利得），前提是其发生在业务活动或职业范围之外（该情况下适用
    B 表）。该资本利得适用 28% 的税率，并可以选择普通税率。然而，出售加密资产（非证券）产生的收益和亏损持有至少 365

