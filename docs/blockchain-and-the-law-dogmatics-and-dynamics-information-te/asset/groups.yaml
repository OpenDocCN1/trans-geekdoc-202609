    law that would deal with automated contracts (whatever those were), autonomous
    organizations (idem), and the emergent token economy⁵


    Being part of the “movement” of blockchain and the law by researching, counseling,
    organizing courses, teaching courses, participating in conferences, and publishing
    on the topic, I must confess, almost four years since the start, the enthusiasm
