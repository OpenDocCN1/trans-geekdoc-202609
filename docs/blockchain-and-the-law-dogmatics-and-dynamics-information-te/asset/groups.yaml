    suit fails).⁴⁴ Counterclaims may also be initiated in both litigation and arbitration,
    particularly in commercial disputes where both parties have suffered a loss from
    a specific set of circumstances, for instance as of an infrastructure project
    not completed or an external event leading to a declaration of force majeure by
    one of the parties. In such an event, both parties may wish to lay the blame at
    each other''s doors and deliver both claims in convention and reunion.


    In such a scenario, where Party B might wish to initiate a counterclaim against
    Party A, it would make sense to both litigants—both parties are claimants in the
    dispute and benefit from receiving immediate redress by way of the pre-agreed
    smart contract execution.


    This is particularly when time is of the essence to arbitrate their dispute using
