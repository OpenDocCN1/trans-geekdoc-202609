    # 3 What Are the Limits of Blockchain? Considerations on the Use ... 41


    According to the UN Guidance Note to TJ[^66] public institutions that helped to
    perpetuate violations should be transformed into institutions that sustain peace,
    human rights, and the rule of law. This pillar is as a guarantee of non-repetition,
    a way to prevent future human rights violations[^67] Mechanisms for non-repetition
    usually focus on human rights violations (in the technology and security sectors),
    by using tools or by means of instruction,[68] to lead to more independent institutions[^69]
    as well as create a culture of human rights protection, by educational training
    of security agents and complete educational reform to future generations. However,
    this pillar depends on political will, which can be more difficult when there
    are present at high levels that are accused of committing human rights abuses.
    Nevertheless, such information on staff perpetrators should be gathered for future
    actions, especially as naming and shading device.[70] Withoutstanding the abuse,
    blockchain technology can improve government efficiency, making autonomous processes
    in a decentralized and open way, reducing bureaucracy and combating corruption
    schemes.


    The use of blockchain technology in Governments is a subject of broad debate nowadays.
    The use of technology in several fields has the potential to improve public bureaucracy,
    creating accountability in administrative decisions.


    Blockchain could be used not only to promote transparency in decisions made by
    States, but it could also help in other TJ processes associated with the restoration
    of democratic institutions, in vetting processes, and in education.


    All vetting processes and other structural reforms of public organs could be made
    accountable to an oversight body would have its procedures publicly available
    in an open-source blockchain system. Also, all the decisions made would be timestamped
    and validated, in digital format, and stored on the network. In all way, decisions
    of public organs would be publicly audited by blockchain by an oversight institution.


    Regarding the creation of educational programs focused on international human
    rights and humanitarian law standards for public employees as well as for future
    generations, blockchain technology can be helpful by monitoring an educational
    chronogram. A human rights educational system, based on international standards,
    and powered by blockchain and smart contracts, could be developed in these situations.
    Employees would work with the system with their identification (or digital ID),
    and lessons would be based on modules that are available via smart contracts,
    according to the user''s frequency or examination for which they are sitting,
    thereby giving the authorities better control over the educational programs of
    government employees and students within the education system.


    > 66 United Nations Secretary-General 2010, p. 9.


    > 67 Villalla 2011, p. 8.


    > 68 Vetting and lustration are processes that are designed to remove from office
    public servants who have been implicated in human rights abuses, normally as part
    of a previous regime. See De Greiff 2007.


    > 69 Sarkin 2016, p. 327.


    > 70 Ibid.'
