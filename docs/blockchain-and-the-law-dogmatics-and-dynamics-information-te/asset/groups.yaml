    according to a predetermined commission-fees¹⁵. The sheriff is entitled to a determined
    commission on the sale value of the assets sold in execution.¹⁶.


    To compound the judgment creditor''s difficulties, Rule 45A of the Uniform Rules
    permits a judgment debtor to apply for a stay of execution for such period as
    the court deems fit.¹⁷. As a general result the court will grant a stay of execution
    where an injustice would result as where the underlying basis of the judgment
    be disputed or no longer exists.¹⁸.


    In consequence, even post-judgment and leaving any possible appeals against the
    judgment handed, if the judgment debtor is able to raise a bona fide dispute to
    the judgment debt, it is possible to obtain a stay of execution of the order,
    the further prejudice of the judgment creditor.


    The position is no different should the parties have arbitrated their dispute.
    Awards issued in arbitration proceedings are not automatically executed. Rather,
    Sec. 31 of the Arbitration Act¹⁹ provides that an award may be applied by any
    party to be made an order of court, which may be enforced in the same manner as
    any judgment or order to the same effect²⁰.


    In our example, Party A would be entitled to institute a court application, which
    Party B would be entitled to oppose, seeking the award in its favour be made an
    order of court. Once this has been done, will Party A be able to execute upon
    the award (now encapsulated in a court order), relying on Uniform Rules 45 and
    46.


    + ¹⁵ See https://www.sheriffs.org.za/sheriff-fares-tariffs/ Accessed 23 May 2023
    for the sheriff’s tariffs.

    + ¹⁶ Ibid.

    + ¹⁷ Rule 45A of the Uniform Rules provides as follows: "The court may

    + ¹⁸ Erasmus: Superior Court RS 16, 2021, at p. DI–604.

    + ¹⁹ Arbitration Act of 42 of 1965.

    + ²⁰ Ibid at section 31, which reads as follows: "Award may be made an order of
    court (1) An award may, on the application to a competent of jurisdiction by the
    reference after due notice to the other party or parties, be made an order of
    court. (2) The court to which this application is so made, by before making the
    award an order of court, correct in any clerical mistake or any patent error arising
    from any accidental slip or omission. (3) An award which has been made an order
    of court may be enforced in the same manner as any judgment or order to the same
    effect."


    ## Blockchain Execution of Judgment—A Possibility in South Africa?


    Assuming further that Party B owns assets beyond the jurisdiction of South African
    courts, Party A''s position is exacerbated. To attach such assets, Party A would
    be required to seek the recognition of its high court judgment or arbitral award
    in that jurisdiction. If the judgment or award is recognised, the traditional
    methods of execution in that jurisdiction would have to follow. Conversely, if
    the judgment or award is not recognised for whatever reason, there is no further
    recourse available to Party A in that jurisdiction.


    In summary therefore, traditional methods of execution provided for in the Uniform
    Rules do not lend themselves to swift execution of judgments, often rendering
    them so, could unattractive to litigants.


    If that is so, could-blockchain execution offer an alternative?


    ### 5.3 Smart Contracts


    The answer is, lies in the use of self-executing ''smart contracts''.


    The concept of smart contracts originated in 1994, by Nick Szabo. Before exploring
    this in practical terms, it is useful to consider how smart contracts function
    and what their capabilities are.


    Szabo regarded smart contracts as self-executing,¹ which operate on a blockchain.¹²


    While there is no unanimity as to the definition, the Smart Alliance has proposed
    the following: "A smart contract is a digital agreement that executes upon the
    blockchain when conditions are met.³⁴


    McKinney et al. identify three characteristics that smart contracts share: First,
    the contract must be ''smart'', in the sense that it is automated and executed.⁵
    Second, it must be self-executing, which is of great importance.⁶ Third, it must
    be recorded on the blockchain, meaning it cannot be halted or reversed."⁷


    + ¹¹ Szabo 1994.

    + ¹² Ibid.

    + ³ Smart Alliance 2018.

    + ⁴ Ibid.

    + ⁵ McKinney et al. 2018.

    + ⁶ Ibid.

    + ⁷ Ibid.


    80 G. D. Raath


    A smart contract is therefore not a contract in the traditional sense, but rather
    a computer program that executes upon certain conditions. An example of this might
    be a purchase of shares in which one party sells at a defined price, another party
    wishes to purchase. The smart contract may be capable of matching the seller''s
    offer with the purchaser''s acceptance, and the moment the match takes place,
    the shares are transferred to the purchaser''s account.


    An important feature of smart contracts for purposes is that they are built on
    a blockchain protocol.³⁹ The advantage of this is that transactions recorded on
    the blockchain cannot be altered.³⁰³¹


    Smart contracts can be used for allocating digital currency between two parties
    upon the requirements of the contract being fulfilled.³²


    The smart contract, (i.e., its execution of code) can be triggered with reference
    to specified third-party ‘off-chain’ information, making use of blockchain ‘oracles’.³³
    Oracles are entities that connect blockchains to systems external to the blockchain.


    Kkou explains the concept of smart contracts by a way: in her example, two persons
    place a bet about the weather on a specific date. They agree that the winner of
    the bet will be decided by reference to official weather reports provided by a
    third party (i.e., the oracle). They create a smart contract and deploy it on,
    for example, the Ethereum blockchain. Both parties transfer money from their accounts
    to the smart contract and based on the third-party input (i.e., verification of
    the outcome), on the specific day, the smart contract executes and pays the pre-agreed
    sum to


    + ²⁹ Schlegel 2021, p 30.

    + ³⁰ Schlegel 2021, p 30. Schlegel writes: "Blockchain is immutable because it
    is both decentralized and distributed. The decentralization of blockchain determines
    who controls it, which is decentralized since no single user controls the information
    or data on the blockchain... Put simply, no single user retains the power to alter
    the information contained in other users'' copies. This applies to blockchain
    developers, courts and other forms of public intervention."

    + ³¹ Schlegel 2021, p 30. Schlegel writes: "With smart contracts, blockchain users
    ensure that a set of transactions will be automatically triggered if certain pre-defined
    conditions are met. These potential transactions are upon the blockchain, they
    cannot be modified or stopped—that is, unless a back door is implemented to allow
    designated users to intervene, and as long as the blockchain on which they are
    implemented is maintained."

    + ³² Koulou 2016, p 53.

    + ³³ Chainlink 2021.

    + ³⁴ Koulou 2016, pp 57–64. The example is wisely explained with reference to
    the source code to create the smart contract.

