    participant to join and operate in the network. The only limitations are the technical
    ability, equipment capability and internet efficiency of the user.¹¹³


    The transactions are pieces of cryptographic information recorded in the form
    of a chain (hence the name “blockchain”). As transactions develop, a mathematical
    problem arises leading to a cryptographic number, the “fingerprint” of the block.¹⁴
    This number is called a “hash”, and each block contains a digital sign.¹⁵ This
    process can be done in several ways, but the most common is called Proof-of-Work¹¹⁶
    (PoW), where participants compete, using their CPU power to solve the mathematical
    problems first, and then creating the block. The winner is financially compensated
    with cryptocurrencies. The validation of transactions is by a consensus mechanism,
    but when the block creation, all the others count as its existence. Blocks can
    be rejected, and their “creator” is not compensated for their effort. Therefore,
    most honest users must control the system and they must trust the other users
    are doing the same.¹⁷¹⁸


    One important aspect is that the hash of a block contains the information of the
    previous blocks to which it belongs. Therefore, changing a previous block will
    consequently change (recalculate), for blocks on the chain.¹⁹ the cost of this
    change is massive computational and power energy that would not compensate for
    the effort. As longer the block is, the more difficult it is to alter the history
    of the block²⁰ making technology practically immutable.¹²¹ Therefore, the more
    transactions occur, the more reliable the system becomes. The network agrees not
    only about what happened but also about the sequence of events.


    Anonymity is another characteristic that ensures security for the users. To access
    a blockchain system and transact with others, users must have a pair of private-keys,
    where both keys have identification numbers and are protected with encryption.
    The private-key gives the user access to the system (and contains personal information
    such as login and password), and activates the public-key, which functions as
    the user’s identification


