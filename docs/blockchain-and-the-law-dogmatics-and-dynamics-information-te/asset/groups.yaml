    2021年开展了多轮数字人民币红包试点，共发放了1.5亿个，超过75万人使用了它。中国人民银行（PBC）在推广数字人民币方面并非单打奋战，而是与传统金融机构、互联网公司和零售商户广泛合作，将其整合到使用、连接和交易系统中。2022年，中国人民银行扩大了其原型央行数字货币（CBDC），使其能够用于在线和离线支付。此外，中国人民银行还扩大了数字人民币在跨境支付中的应用。它是由国际清算银行（BIS）香港创新中心主导的“多边货币桥”（M-bridge）项目的四个中心之一。关于匿名性，根据中国人民银行货币研究所主任主任的说法，“可控匿名”是数字人民币设计的一项重要特征。此外，他补充说，如果数字人民币要防止洗钱、恐怖主义融资和逃税等犯罪行为，完全匿名是不现实的。中国人民银行正在使用他们所谓的混合模式，在有限区域使用分布式账本技术（DLT）以及其他技术。尽管如此，核心数字人民币系统是一个中心化账本。


    - 从欧洲的角度来看，该政策处于研发的先进阶段。2020年，欧洲中央银行（ECB）发布了一份《数字欧元的报告》（以下简称“报告”或“数字欧元报告”）。研究的主要关注点是确保消费者能够以符合数字时代需求的方式无限制地获得央行货币。报告中提到的（发行数字欧元）的主要益处包括：(i)
    有于经济数字化；(ii) 应对现金作为支付手段的下降；(iii) 解决欧元区对外国数字支付手段的担忧，或防止未来 CBDC 的冲击；(iv) 可作为货币政策传导渠道；(v)
    有助于缓解与提供支付服务相关的风险；(vi) 发行以促进欧元的国际地位；以及(vii) 支持欧元区和金融系统的改进。报告讨论了两种数字架构：1) 基于账户的数字欧元，即通过直接在欧元系统开设或通过分布式系统开设账户；2)
    被称为“基于代币”或“基于价值”的数字欧元——这需要中介机构的参与。账户和硬币是匿名的，但数字欧元不能如此，因为匿名性并非一项共识项目，且在2021年中，欧洲系统启动了数字欧元项目，预计将持续24个月，并在初步实验阶段已确定了障碍。从技术角度来看，报告描述了两种方案的影响，即针对中央银行、中介机构和终端用户的中心化技术与去中心化技术的对比。


    英国也在这一课题上推进。尽管英国当局尚未决定是否发行数字英镑，但英国银行于2021年4月宣布与英国皇家财政部（HM Treasury）共同成立了一个CBDC工作组，以协调对潜在英国CBDC的探索。这一公告是在英国银行于2020年3月发布一份讨论论文后一年发布的。该讨论指出，CBDC为英国银行实现其货币和金融稳定目标可能提供的机会。这包括支持具有韧性的支付系统、支持支付领域的竞争、效率和创新、应对对现金使用量下降的担忧等。由英国银行主持的CBDC参与小组从其可能使用的技术出发，对央行数字货币方法的所有方面进行了研究，并帮助英国银行理解设计、实施和操作的实际挑战。从技术角度来看，英国银行认可分布式账本技术（DLT）的优势，但不排除使用更具中心化的技术构建CBDC的可能性。英国银行表示，应关注CBDC的设计特征，特别是与数据隐私和保护相关的特征。尽管如此，它承认CBDC应遵守反洗钱（AML）规则，这排除了匿名性。


    - 美国联邦储备体系（FED）在CBDC方面处于先进的研究阶段。自2020年以来，它建立了一个多学科团队，由来自克利夫兰、达拉斯和纽约联邦储备银行的成员组成，支持联邦储备委员会政策团队，该团队正在研究数字货币对支付生态系统、货币政策、金融稳定、银行业务以及消费者保护的影响¹⁶⁰。此外，波士顿联邦储备银行正与马萨诸塞理工学院（MIT）合作研究CBDC可行性，并于2022年2月发布了一份白皮书。到目前为止，联邦储备的政策考虑与其他司法管辖区一致，例如提高支付效率；减少跨境摩擦；增强金融包容性；维护金融完整性¹¹联邦储备近期的一份讨论论文表明，潜在的美国CBDC将通过保护隐私、互操作性和监管来满足家庭需求。联邦储备正在探索几种方案，包括区块链技术或分布式账本技术（DLT）的使用¹²


    ## 7 中央数字货币：关注匿名性


    银行的资产负债表，CBDC将接受类似的对待。这些资金由中央银行以物理（现金）或数字格式（CBDC和商业银行账户）发行，因此属于央行货币的定义范围。另一方面，在商业银行存款的客户属于他们的私有货币，因此在商业银行的资产负债表中登记为负债。中央银行负债的创建与中央银行的法律授权密切相关。但中央银行也有向商业银行或政府提供数字形式的现金，到目前为止尚未向普通公众提供过此类货币。因此，目前的“流通现金”负债账户始终与流通中的物理现金有关，而非其数字格式，相关的中央银行法明确规定


