    摘要 本章讨论了欧盟颁发的 DLT（分布式账本技术）试点制度，考虑了其在 DeFi（去中心化金融）方面的用途和适用性。正如欧洲证券和市场管理局（ESMA）关于加密资产的报告中所提到的，监管机构正在阐释现有的法律要求，并讨论这些要求在加密资产和
    DLT 结构中的应用。DLT 试点制度旨在以类似于监管沙盒的方式运行，允许并规范处理加密资产作为金融工具进行交易的市场设施运营，而这些设施在其他情况下将不被允许运营，或将面临过度且沉重的要求。该制度旨在为目前定义的金融工具二级市场规则建立法律确定性，特别是当这些规则完全适用于
    DLT 和加密资产，同时又能确保对投资者的保护、市场完整性和金融稳定时。


    关键词 DLT · DLT 试点制度 · 区块链 · 资本市场联盟 · 加密


    G. Maia (✉)

    BCAS, Floor 1, Mompalo Buildings, Tower Street, Msida, MSD 1825, Msida, Malta

    e-mail: guhermeinvestimento@gmail.com


    J. Vieira Santos

