    of the writ, and failing satisfaction...demand that so movable and disposable
    property be pointed out as he deem sufficient to satisfy the writ, and failing
    pointing out...search for such property.


    Once a sheriff has prepared an inventory of the goods, they are sold at an execution
    sale, by public auction to the highest bidder, to satisfy the judgment in whole
    or in part.


    Rule 45 also makes provision for the attachment by sheriff of immovable assets
    (such as shares or claims) pursuant to a writ issued for attachment or the attachment
