    A. Beja 和 B. Correia Barradas


    由央行发行（央银行数字货币或 CBDCs）。然而需要注意的是，尽管所有活动可以使用区块链或基于分布式账本技术（DLT）的解决方案，但并不一定需要。这包括 CBDC，可以通过区块链类型的解决方案、传统方法或两者的结合进行发行和管理。在本章中，我们将讨论
    CBDC 这一主题、它的定义及其影响，并特别强调了匿名性——我们认为，当全球央行实施 CBDC 时，这一方面将至关重要，特别是当主要经济体和发展中国家的央行推进
    CBDC 解决方案时。


    **关键词** 区块链 · 央银行 · 数字货币 · CBDC · 加密货币


    ## 7.1 引言


    CBDC 是当下的热门话题。自 2018 年底以来，央行对 CBDC 的兴趣和公共干预变得更加积极，并在 2020 年下半年和 2021 年第一季度迅速增长。尽管新冠肺炎为全球央行和政府带来了许多挑战，但也发现了一些机会，例如现金支付的使用率下降，消费者从实体支付转向数字支付，从而为
    CBDC 的实施增加了新的动力和机会。


    广泛接受的定义是：*CBDC 是央行发行的以记账单位表示的数字货币，它是央行的负债。* CBDC 可以是“零售型”（即通用型），也可以是“批发型”（供金融机构受限访问）。CBDC
    与现金之间的主要区别在于形式。CBDC 以数字形式存在，而现金则以实体硬币和纸钞形式存在。


    根据国际结算银行（BIS）对央行数字货币的调查结果，央行考虑发行零售型 CBDC 有多种动机或政策目标。这些目标包括金融稳定、货币政策的实施和金融包容，以及支付效率和安全。并非所有司法管辖区对这些动机的重视程度都相同，这与它们的经济环境和市场特征有关。例如，发展中经济体优先考虑金融包容，并将实施
    CBDC 视为实现这一目标的可能解决方案。尽管如此，国内效率和支付安全仍然是先进和发展中经济体发行通用型 CBDC 动力的核心，维护金融稳定和支持货币政策。


    + 1 Auer 等人 2020.

    + 2 https://www.bis.org/publ/bppdf/bispap125.htm.

    + 3 例如，在具有现代且包容性支付系统的先进经济体中，对 CBDC 的需求已偏离金融包容目标。


    # 央行数字货币：关注匿名性


    并非首要动机，但与先进经济体的相反趋势相比，发展中经济体对这些动机的考虑更为广泛。根据同一项调查，关于 CBDC 的批发型发行，其动机倾向于与跨境支付的零售型
    CBDC 相似，而在跨境支付中批发型 CBDC 的动机更为突出。其他动机还包括资本市场的发展、增强网络韧性，以及证券交易和结算的改进。


    除了上述因素，BIS 调查还指出了使央行考虑 CBDC 的一些隐含动机，即维护一国货币货币主权。这包括两个方面：首先，本币 CBDC 可以增强本币的使用，相对于广泛使用和接受的外币（如美元化经济体中的美元或欧元区经济体中的欧元），因为公众对本国货币的数字形式可能比外币的实体形式更有吸引力；其次，CBDC
    可以解决由于私人加密货币或稳定币（如 Tether (USDT) 和 USD Coin (USDC) 使用增加而导致的当地担忧。


    上述动机或政策目标得到了国际货币基金组织（IMF）近期的一项研究的证实。该研究包含了六个在 CBDC 实施方面处于不同阶段的国家，包括已经开始发行 CBDC
    的央行、处于试点阶段的央行，以及决定暂时不发行 CBDC 的央行。


    尽管动机和潜在利益不同，但 CBDC 的实施涉及央行需要审慎考虑的若干影响。这包括 CBDC 实施法律影响（如采纳为法货币），以及网络风险、数据隐私、会计影响和金融稳定。另一方面，仍在出现的技术替代方案需要经过仔细评估，以适当应对并实现上述政策目标。


    另一个与 CBDC 设计特征相关的方面是机构之间仍在进行很大讨论的作为货币特征的匿名性以及技术的使用。但央行是否可能完全或至少部分匿名？公众会对此何反应？技术又是怎样的？央行更倾向于使用基于中心化账本的技术？还是更倾向于将去中心化账本技术（如区块链）作为更好的选择？


    + 4 Boer and Wehrli 2021.

    + 5 参见欧洲中央银行（2020）《数字欧元的报告》。https://www.ecb.europa.eu/paym/digital_euro/report/html.en.
    访问于 2023 年 5 月 23 日。

    + 6 《央行数字货币背后》，IMF, 2022.


    由于上述主题在涉及公众采纳和使用数字货币的意愿，以及涉及央行发行 CBDC 的限制时，可能成为重大问题，我们决定在本章中分别基于欧洲背景下的法律框架和一些央行对技术的决策来分析上述问题。


    ## 7.2 匿名性方案与作者调查结果


    2020 年 10 月，七家央行同 BIS 一起发布了一份确定公共可用 CBDC 必备关键原则的报告。尽管贡献该报告的央行尚未决定是否发行 CBDC，但他们参与此类项目的共同动机是将
    CBDC 作为一种支付手段。他们概述了发行 CBDC 时应考虑的一系列关键原则：


    - 在灵活且创新的支付系统中与现金及其他类型的货币共存；

    - 任何引入应支持更广泛的政策目标，且不对货币和金融稳定造成损害；

    - 特性应促进创新和效率。


    考虑到现金的主要特征是没有任何身份记录或交易本身的记录，从客户的角度来看，转向完全可追溯的支付手段将是不可能的（除了从技术角度可能通过 CBDC 实现的其他功能，如对某些类型支付的限制、可逆性以及负利率的应用）。尽管如此，在上述报告中，匿名性并不是一个可行的方案。尽管解决洗钱（AML/CFT）担忧未列在央行的主要动机中，但后者向公众发行
    CBDC 时必须遵守这些规则。


    根据 Bech 和 Garratt (2017) 发布的一篇论文，可能有两种匿名方案：(i) 对方匿名，即付款方无需向资金接收方和成员披露其真实身份；(ii)
    第三匿名，即付款方无需向社区其他成员披露其身份（例如支付服务提供商、比特币或其他加密货币社区或央行）。


    + 7 Bech and Garratt 2017.


