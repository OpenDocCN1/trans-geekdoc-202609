    \n摘要 \n区块链技术有改变人们生活、交流、获取产品、存储信息和交换数据的能力。这种能够在不同领域运行并被称为通用技术（如互联网）的技术——在过渡正义过程中是有用的。本章旨在分析区块链作为过渡正义过程中的新组件的使用（见\
    \ 3.3.2 节），理解在过渡正义情景下区块链如何表现（一般而言）。具体而言，本章分析了区块链如何整合到过渡正义的重要方面：刑事诉讼、真相委员会、赔偿、民主制度的恢复以及和解。\n\
    \n**关键词** 过渡正义 · 区块链 · 司法\n\n## 3.1 引言\n\n技术的使用曾被限于国家行为，这些过渡正义和人权情况的主要执行者，这导致了这些工具在执行者手中被垄断。然而，近年来这种垄断正在减少，雷达、数字媒体、应用程序、无人机和开源地图等新技术在非国家行为中变得常见。它允许民间更好地记录和传输违规行为，帮助对犯罪者和过渡正义维护者提供更实质性的保护，因为滥用信息现在可以被收集和分析¹。\n\
    \n过渡正义继续使用新技术来提高其在不同领域的效率。从识别和寻找失踪人员²到收集和分类用于真相寻求的信息³，将新程序和技术引入过渡正义有很多积极影响，旨在提高操作的质量和速度。\n\
    \n从意义上说，遵循区块链等通用技术（GPT）对于处理过渡正义问题可能是有效的。政府和其他者的者的支持可能会危害一直在寻找合适人员和资金的过渡正义项目。因此，将现有技术适应过渡正义现实是有用的，特别是当此类技术不是单一用途⁵，因为它是处理此类问题的更合理且成本效益高的解决方案。\n\
    \n本章旨在就使用区块链技术如何解决过渡正义程序当前的问题产生新观点。如果被理解为具有审计交易、数据存储能力和在不同领域工作能力的通用技术，区块链技术可能非常适合灵活的过渡需求。在区块链中，交易的是信息的数字表示（数字令牌），允许记录和交易任何数据。\n\
    \n本章分为两个部分。第一部分（3.2 节）旨在简要建立区块链的概念，而第二部分（3.3 节）将利用 Jeremy Sarkin 的过渡正义五支柱理论列出过渡正义的一些主要元素，并提出使用区块链作为这些支柱效率催化剂的新程序。\n\
