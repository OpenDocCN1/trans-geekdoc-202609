    # 10 M. Lucas Pires


    transparency by staking and voting in protocol governance? In the case of a hard
    fork that I did not agree with, can I claim damages against people that supported
    it? Moreover, what is the rules (contract rules, corporate rules) applicable to
    the situation?


    The question of applicable law and jurisdiction is a matter of international private
