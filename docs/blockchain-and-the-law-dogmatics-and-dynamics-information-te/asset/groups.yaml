    ## 6 The DLT Pilot Regime and DeFi


    ## 6.4 How Does the DLT Pilot Regime with DeFi?


    One of the purposes of the DLT Pilot Regime is to take advantage of the potential
    of DLT, a transformative technology in the financial sector, in reducing intermediaries
    and, subsequently, transaction costs. This purpose is related to multiple benefits,
    such as enhanced efficiency, transparency, and competition in relation to trading
    and settlement activities.


    In this context, many repetitive processes, namely the input of transaction data
    separately in each layer of the custody chain, together with costly reconciliation,
    can be eliminated.⁴⁵ The prominent example of the use of this potential of DLT
    is what is allowed to a DLT TSS, as presented in Fig. 6.2.


    The DLT Pilot Regime allows an investment firm or market operator under MiFID
    II to operate a DLT TSS and allows the exemptions as available to operators of
    DLT MTFs and DLT SSs, including the obligation of intermediation in the access
    of retail investors to the market infrastructure as a member or participant. Figure
    6.2 represents the traditional operation of trading and settlement services. What
    a DLT TSS can do to traditional operation under the DLT Pilot Regime eliminates
    the need for brokers and a CSD to access the market, custody and settlement (represented
    by the crosses in Fig. 6.2). With a DLT TSS, only one operator is needed in the
    value chain of a financial instruments market.


    However, it is important to consider that in DeFi applications, no natural or
    legal person performs or trading or settlement services.⁴6 Those applications
    are considered “decentralized”, but this term is used in several different senses
    across the DLT industry.


    First, the term is used in the Settlement Layer, where a network of nodes comprises
    a permissionless blockchain through peer-to-peer connections between unrelated
    and independent agents, rather than relying on a central server or a central organization.
    This axis of decentralization is referred to as the architectural distribution.⁷
    For the purpose of this chapter, we shall assume that the Settlement Layer in
    which the DeFi protocols are built is sufficiently distributed⁸


    Secondly, the term may refer to the decentralization of crypto-assets custody
    (non-custodial by an intermediary). In traditional finance, custody is a core
    financial service where the custodian holders safeguarding assets of the client.
    Usually, this service is endorsed by the custodian''s reputation and the legal
    and regulatory framework. The core reason for custodians is the security of not
    having assets lost or stolen. As a result, security and trustworthiness become
    symbiotic to the safeguarding of assets. With the technological furthering of
    DeFi applications, the solution for proving trustworthiness without endorsement
    from central authorities is a robust, resistant, and transparent implementation
    of a set of functions, in which the client/user has access to the assets deployed
    in a particular smart contract.⁹ In the Application Layer, a noncustodial protocol
    allows users to have complete control of their crypto-assets deposited in a smart
    contract address for a specific functionality of a protocol without relying on
    a centralized protocol. The interaction between the protocol and the user is autonomous
    and automatic, without any contract with the development team, thus, transferring
    the responsibility from the intermediaries to the users.


    Thirdly, the term is referred to the decentralization of management, organization,
    and ownership of a protocol. Even though this type of decentralization is fundamental
    across all Layers, there is a clear trend of “decentralized governance” across.
    Organizations that seek to emulate the operation of a corporate entity through
    code and integrate decentralized governance features within their protocols are
    usually known as Decentralized Autonomous Organizations (DAOs),¹⁰ where the holders
    hold voting rights tokens that determine an autonomous execution of the nexus
    of smart contracts when certain conditions are met. The tokens representing the
    possibility for token holders to be part of a DeFi protocol are known as governance
    tokens and may give the token holder control (voting rights)⁵¹ and ownership (cashflow
    rights) of the organization.


    DeFi is not composed of watertight compartments,⁵² the requirement for a central
    and liable party to be the operator of a DLT market infrastructure may be difficult
    to achieve. Therefore, some degree of centralization in DeFi applications may
    be needed and encouraged to respect the rule of law and prevent risks and efficiency.


    Intermediation is fundamental for finance operations, as commercial banks, investment
    banks, stockholders, mutual funds, insurance companies and stock exchanges form
    the basic of all frameworks of modern financial structure is inherent to the financial
    system, the financial regulatory frameworks are always based on an ex-ante intervention
    (authorization procedures) and the creation of rules for intermediaries.⁵³ As
    functionally not by Regulation for Economic Cooperation and Development (OECD)
    and the Financial Stability Board (FSB), DeFi projects often exist along a spectrum
    of decentralization, depending on the stage of development of the application,⁴⁴
    generally means having an identifiable intermediary that would be the liable entity
    within DLT Pilot Regime.


    Additionally, as stated in the latest recommendations of the Financial Action
    Task Force (FATF), DeFi “applications or platforms are often run on a distributed
    ledger but still use a central party with some measure of involvement, such as
    creating and launching an asset, setting parameters, holding an administrative
    “key” or collecting fees.”⁵⁵


    Lastly, DeFi applications are likely to evolve into increasingly centralized platforms
    with the market pressure, i.e., the emergence of new intermediary operators and
    potential incumbents in the DeFi space.¹⁶


    In conclusion, DLT Pilot Regime can cover some DeFi categories, such as DEXs and
    stablecoins. Naturally, it will be impossible to have “true decentralized” applications
    within the DLT Pilot Regime because this Regulation requires an operator of a
    DLT market infrastructure to be a liable party in the provision of the services.
    Even so, this Regulation will be an important step for some DeFi’ objectives,
    particularly disintegration and fostering non-custodial business models.


