    # 1 区块链与法律：设定底线


    尚不清楚对代币经济价值的关注在多大程度上吸收了协议开发和采用的所有兴趣。


    # 1.4 区块链中的法律


    区块链是一项技术也是一种经济现实。作为一种通信技术，它用于促进人类互动；作为一种经济现实，它是价值的产物。在这两个方面，区块链都是一种社会现象，因此也是一种法律现象。


    法律在区块链在哪里？答案是：每当两个或更多人之间存在协议。人们下载并运行协议，接受这种行动以参与一项共同事业。通过参与该事业，他们将自己置于协议规则和运行机制之下。如果恶意意图损害了他们的合法预期，他们有权向损害他们的人索要赔偿。假设他们没有受到损害，但他们有合法预期认为自己会受到损害（即在下载协议时参与了一项高风险活动）。在这种情况下，在没有坚实保护的情况下，他们自担风险。


    网络用户相互进行交易。交易受法律规则和原则的约束。他们使用智能合约，但智能合约是执行交易的一种方式，而不是一种受特定“法律范围外（alegal）”规则约束的法律协议。毕竟，可编程代码是人编写的语言，可以代表声明和协议。²6
    涉及与人的互动，下载钱包、在交易所开设账户、下载手机以对其代币进行托管：这些都是法律协议，受合同规则的约束。作为价值的类别（例如证券、所有权、身份标识），它们必须遵守适用的监管标准。除了萨尔瓦多和中非共和国外，加密资产在任何司法管辖区都没有法律地位。然而，这并不意味着它们本身是被禁止的支付方式（从法律上讲，它们仅等同于以物易物；如果人们同意用加密支付，通常没有后果）。⁷


