    The DLT Pilot Regime introduces this new status regarding the DLT market infrastructures—Article
    2, point 5, of the DLT Pilot Regime. It includes DLT MTFs, DLT SSs (settlement
    systems) and DLT TSSs (trading and settlement systems). Also important for this
    new status was the introduction of another concept, of DLT financial instruments,
    which correspond to financial instruments that are recorded, transferred, and
    stored through a distributed ledger technology—Article 2, point 11, of the DLT
    Pilot Regime.8


    Therefore, DLT MTFs are MTFs that only allow trading DLT financial instruments
    (Article 2, point 6 of the DLT Pilot Regime). On the other hand, DLT SSs are settlement
    systems that settle transactions on DLT financial instruments, irrespective of
    the fact that these settlement systems have been designated and notified under
    Directive 98/26/EC (as not to be limited to the definition of “system” of this
    Directive), and allow either the initial recognition of financial instruments
    or the provision of safekeeping services in relation to DLT financial instruments—Article
    2, point 7, of the DLT Pilot Regime. Finally, DLT TSSs are DLT MTFs or DLT SSs
    that combine the services provided by a DLT MTF and a DLT SS—Article 2, point
    10, of the DLT Pilot Regime.


    As is an experimental regime, the following limitations are foreseen as to the
    type and value of admitted financial instruments—Article(3) of the DLT Pilot Regime:


    +   * Shares issued have a market capitalization or provisional market capitalization
    of less than €500 million;

    * Bonds, other forms of securitized debt or money instruments (except derivatives
    or complex products) with an issue size below €1 billion;

    * Units in collective investment undertakings whose market value of assets management
    is less than €500 million.


    The aggregate value of all the DLT financial instruments admitted to trading or
    in a DLT market infrastructure may not exceed €6 billion, and if the admission
    to trading or the initial recognition of a new DLT financial instrument results
    in an aggregate market value reaching that the DLT market infrastructure does
    not admit that financial instrument to trading or registration—Article


    8 DLT financial instruments can also be said to be crypto-assets that qualify
    as financial instruments, as the MiCA defines a digital representation of value
    or rights that can be transferred and stored electronically using distributed
    ledger technology or similar technology. The DLT Pilot Regime also took the opportunity
    to clarify that financial instruments using distributed ledger technology fall
    within the definition of “financial instrument” in Directive 2014/65/EU by including
    an amendment to Article 4.'
