    ## 6 DLT 试点机制与 DeFi


    ## 6.4 DLT 试点机制如何开展 DeFi 应用？


    DLT 试点机制的目的之一是利用分布式账本技术（DLT）这一金融领域变革性技术的潜力，通过减少中介来后续降低交易成本。这一目的与多种利益相关，例如提高交易和结算活动相关的效率、透明度和竞争性。


    在此背景下，许多重复性过程（即在托管链的每一层中分别输入交易数据）以及昂贵的对账工作可以被消除。⁴⁵ 利用这种 DLT 潜力的显著示例是如图 6.2 所示的
    DLT TSS 所被允许的操作。


    DLT 试点机制允许 MiFID II 下的投资公司或市场运营者运营 DLT TSS，并允许其获得 DLT MTF 和 DLT SS 运营者可享的豁免，包括作为成员或参与者在零售投资者接入市场基础设施时的中介义务。图
    6.2 代表了交易和结算服务的传统运营模式。在 DLT 试点机制下，DLT TSS 对传统操作的改进消除了对经纪人和证券结算机构（CSD）访问市场、托管和结算的需求（由图
    6.2 中的交叉号表示）。有了 DLT TSS，金融工具市场价值链中只需要一个运营者。


    然而，需要考虑的是，在 DeFi 应用中，没有自然人或法律人执行交易或结算服务。⁴6 这些应用被认为是“去中心化的”，但该术语在 DLT 行业中有几种不同的含义。


    首先，该术语用于结算层（Settlement Layer），在该层中，一个节点网络通过不相关且独立的代理人之间的点对点连接构成一个无许可区块链，而不是依赖于中央服务器或中央组织。这种去中心化维度被称为“架构分布”。⁷对于本章而言，我们假设用于构建
    DeFi 协议的结算层具有足够的分布性⁸


    其次，该术语可能指加密资产托管的去中心化（非中介机构托管）。在传统金融中，托管是一项核心金融服务，由托管人持有并保护客户资产。通常，这项服务由托管人的声誉以及法律和监管框架提供。托管人的核心作用是确保资产不丢失或被盗。因此，安全性和信任度与资产保护是共生关系。随着
    DeFi 应用的技术进步，在没有中央机构背书的情况下证明信任的解决方案，是一组函数稳健、抗性且透明的实现，其中客户/用户可以访问部署在特定智能合约中的资产。⁹
    在应用层（Application Layer）中，非托管协议允许用户对存入特定协议功能智能合约地址的加密资产拥有完全控制权，而无需依赖中心化协议。协议与用户之间的交互是自主且自动的，无需与开发团队签订任何合同，因此将责任从中介转移给了用户。


    第三，该术语是指协议管理、组织和所有权上的去中心化。尽管这种去中心化在所有层级中都是基础性的，但整个范围内存在着明显的“去中心化治理”趋势。那些寻求通过代码模拟公司实体运营并在协议中集成去中心化治理特性的组织通常被称为去中心化自治组织（DAOs），¹⁰
    在其中，持有者持有投票代币，这些代币在满足特定条件时决定智能合约枢的自主执行。代表代币持有者参与 DeFi 协议可能的代币被称为治理代币，可能赋予持有者对组织的控制权（投票权）⁵¹和所有权（现金流权利）。


    DeFi 并非由水不漏的隔舱组成，⁵² 要求中心且负责的方作为 DLT 市场基础设施的运营者可能难以实现。因此，DeFi 应用可能需要并鼓励某种程度的中心化，以尊重法治并防止风险影响效率。


    中介化对于金融运营至关重要，因为商业银行、投资银行、股东、共同基金、保险公司和证券交易所形成了现代金融结构所有框架的基础；这是金融体系固有的特征，金融监管框架始终基于事前干预（授权程序）和为中介制定规则。⁵³
    根据经济合作与发展组织（OECD）和金融稳定委员会（FSB）的功能划分，DeFi 项目通常存在于去中心化的光谱上，取决于应用的开发阶段，⁴⁴通常意味着存在一个可识别的中介，该中介将成为
    DLT 试点机制内的责任实体。


    此外，正如金融行动特别工作组（FATF）最新建议所示，DeFi “应用或平台通常运行在分布式账本上，但仍有中心化方的参与，例如创建、设置参数、持有密钥或收取费用。”⁵⁵


    最后，DeFi 应用可能会向日益中心化的平台演进，受到市场压力。¹⁶


    总之，DLT 试点机制可以涵盖某些 DeFi 类别，例如 DEX 和稳定币。自然地，在试点机制内无法实现“真正的去中心化”应用，因为该法规要求 DLT 市场基础设施的运营者是一个责任方。尽管如此，该法规对于某些
    DeFi 目标将是重要一步，特别是对于促进非托管业务模式。


    '
