    的用户更倾向于持有现金而非比特币，因此88%的企业将其比特币兑换成美元⁴²。


    小企业主和个人人士列出了主要问题：虚拟货币的波动性导致人们遭受损失；由于全国范围内兑换现金的 ATM 机数量有限而导致的物流问题；以及 Chivo 客服团队未解决的技术问题⁴³。2022年，国际货币基金组织（IMF）敦促萨尔瓦瓦取消比特币的法定货币地位。


    尽管面临所有挑战和挫折，但萨尔瓦瓦预计不会保持孤立。2022年，中非共和国成为世界上第二个将比特币采纳为法定货币的国家⁴⁴。在巴拉圭，参议院于2022年8月通过了监管加密货币挖矿和交易的法案，但该法案在2022年12月在巴拉圭下议院未能通过⁵⁵。拿马已于2022年8月通过了一项法案，监管并允许将加密资产作为支付手段⁴⁶。在拉丁美洲国家中，马尔特是唯一的一个。马尔特人对欧元一直保留意见，而该国传统上欢迎区块链和加密资产的活动与投资⁴⁷。


    尽管如此，由于来自国际货币基金组织（IMF）和世界银行等国际机构的怀疑和担忧，以及许多国家在财务支持和援助方面对这些问题的依赖，再加上比特币和其他加密货币因波动性和缺乏控制而可能带来的风险，将比特币或加密货币作为法定货币的决定必须审慎权衡该国的优先级。加密市场的现状，特别是
    T Terra 的崩塌⁸ 和 FTX ⁹（随后相关加密货币价格全面下降），对考虑采纳比特币作为法定货币的管辖区产生了威慑；萨尔瓦瓦的经验以及 FTX 对巴哈马经济的影响⁵⁰正在进行的监管倡措⁵¹也将塑造这一领域。


