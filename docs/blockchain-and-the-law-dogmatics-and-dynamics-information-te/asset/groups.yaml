    # 4 Taxing Crypto-Assets—The Portuguese Perspective


    The TA has not issued any binding ruling, generic information or other interpretation
    crypto-assets and CIT. However, the Portuguese Chartered Accountants Association
    (“OCC”) published its Technical Opinion on PT22246, of 22-03-2019 on cryptocur¹⁷
    This Opinion, aside from explaining the binding on PIT and VAT discussed, has
    only one sentence on CIT: “On CIT, there is no published position on the part
    of the Tax Authority, but we are of the opinion that the accounting income recorded
    in accordance with accounting standards constitutes taxation at CIT”¹⁸


    Since CIT taxortes established with the corrections in its Code and the starting
    point is the accounting, it has a remarkable importance in this context, and one
    should ask (from an accounting perspective): are cryptocurrencies strictly sensu
    intangible assets or inventories? Are security tokens financial instruments? Are
    utility tokens intangible assets or contracts with clients?


    Regarding holdings of cryptocurrencies, the International Financial Reporting
    Interpretations Committee (“IFRIC”) released in June 2019 an update in which it
    discussed the nature of a cryptocurrency under the International Financial Reporting
    Standards (“IFRS”), concluding that it is an intangible asset under the International
    Accounting Standard (“IAS”) 38 “on the grounds that (a) it is capable of being
    separated from the holder and transferred independently; and (b) it does not give
    the holder to receive a fixed or defined number of units of currency”, excluding
    the qualification as a financial asset (Paragraph 11 of IAS 32) or as Cash (Paragraph
    AG 33 of IAS 32). Additionally, if an entity holds cryptocurrencies for sale in
    the ordinary course of business, that is Inventory (IAS 2).”¹⁹


    Furthermore, the Organization for Economic Cooperation and Development (OECD)
    stated although there is currently no formal accounting guidance available on
    crypto-assets, it is necessary to apply the existing general accounting principles,
    namely their economic purpose, the rights and liabilities associated with them,
    and the way the assets derive their inherent value. Consequently, a security token
    could be considered as a financial asset subject to IFRS 9, and utility tokens
    can be considered as a prepayment for goods and services, treated under IFRS 15²⁰


    To conclude, although there are some uncertainties under the accounting perspective
    (which have impact on the CIT taxation), if a taxable person obtains income from
    a crypto-asset, such income will contribute for the taxable basis under the CIT
    Code, provided that the subjective and objective requirements explained above
    are fulfilled.


    ¹⁷ Ordem dos Contistas Certificados [Portuguese Chartered Accountants Association]
    2019.


    ¹⁸ Free translation.


    ¹⁹ International Financial Reporting Interpretations Committee 2019.


    ²⁰ OECD 2020, p. 15.'
