    - 5.4.4 Security for Costs ..................... 86

    - 5.5 Conclusion ................................. 87

    - References .................................87


    **Abstract**

    Executing court orders via conventional methods in South Africa can be costly
    and timing. An alternative to the status quo could be blockchain execution using
    smart contracts. This would afford the parties the dual benefits of irrevocability
    and immutability—speed of execution and certainty of payment. This chapter considers
    conventional methods available to a successful litigant under African law (Sect.
    5.2). It then considers the concept and attributes of execution on the blockchain
    (Sect. 5.3), as well as two possible use cases of blockchain execution applied
    in South African context and impediments to their adoption (Sect. 5.4).


    **Keywords**

    Execution of judgments · Blockchain · Smart contracts · South African law


    ## 5.1 Introduction

    As any litigant will know who has obtained a court order or arbitration award
    that remains unsatisfied post litigation, an order without the means to execute
    it is largely meaningless. Executing orders using blockchain technology—which
    carries the crucial benefits of irrevocability (and thus finality) and immutability—could
    provide a more efficient method of satisfying orders than presently available
    in Africa under conventional methods.


    This chapter will consider the possibility of using blockchain to execute court
    orders, from the vantage point of a litigant in Africa, relying on African law.
    In doing so, the chapter will first consider conventional execution methods available
    to a successful litigant under African law (Sect. 5.2). It will then consider
    the concept and attributes of execution on the blockchain (Sect. 5.3). It will
    thereafter consider two possible use cases of blockchain execution applied in
    South African context and potential impediments to their adoption (Sect. 5.4).


    ## 5.2 Traditional Methods of Execution of Judgments Under South African Law

    Consider the following scenario: Party A institutes a commercial claim in Africa
    against Party B. Both companies are domiciled in Africa. The claim is brought
    either in the High Court, via conventional litigation, or in arbitration proceedings
    agreed between the parties. Party A, for reasons relevant to the suit, is entitled
    to furnish Party B with security for costs. Party A is successful in its claim,
    obtaining an order for monetary judgment against Party B. Party A, now holding
    a judgment against Party B, is entitled to execute on its judgment against the
    assets of Party B. As the execution takes place in Africa and in terms of the
    African High Court, the execution process is


