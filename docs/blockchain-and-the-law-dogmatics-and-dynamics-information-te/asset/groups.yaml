    ## 7.6 法定货币


    全球范围内许多银行是其管辖区内发行法定货币的唯一法律规定授权的机构。某些适用法律将货币的发行限制在纸币和硬币，而另一些法律则使用了更广泛的表述，未将货币发行限制在纸币和硬币²⁶
    通过赋予其发行的货币法定货币地位，中央银行允许纸币和硬币在特定管辖内的任何地方流通，并作为一种支付手段，即支付方“义务”接受支付方提供的法定货币，以换收到的商品或服务。


    那么发行数字形式的法定货币又是呢？从技术上讲，通过修订中央银行法并明确将央行数字货币（CBD）指定为法定货币是可能的。但这不仅仅是一个法律性问题。物理形式法定货币可以被全体人口广泛获取和使用作为支付手段，遗憾的是，数字形式可能无法做到这一点。因此，将数字货币指定为法定货币可能被认为对弱势社会群体是不公平的，例如老年人、残障人士或在数字或物理上被排除的人²⁷
    特别当数字货币被广泛采用但在为其用户带来任何优势或成为执行某些交易的必要条件之前。法定 CBDC 的指定需要事先对人口的现金使用习惯进行仔细评估，并建立消费者保护机制，允许在需要或要求的特定情况下使用物理法定货币。然而，重要的是要说明，我们谈论的是流通货币，而不是中央银行的账面货币（后者通常不具备法定地位）。基于账户的
    CBDC 也应遵循相同的方法，以避免上述对弱势者的政策影响。另一方面，基于代币的 CBDC 可以被视为中央银行的负债，由中央银行发行。这一点尤为重要，可以避免商业银行发行钞票但不履行其实际兑换这些钞票义务而导致的十九世纪动乱²⁸（遗憾的是，这种情况在2022年加密货币崩盘中“重演”）。


    ²⁵ 这将需要专门分析，但某些现有的中央银行法律根据对货币和流通货币定义，可能允许发行数字形式货币。


