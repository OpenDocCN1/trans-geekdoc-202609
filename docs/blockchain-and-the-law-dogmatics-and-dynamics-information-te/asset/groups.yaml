    7 Users can trust the system without having to trust in other users or a third
    party.

    8 Lamport et al. 1982.

    9 Harber and Stornetta 1991; Bayer et al. 1993.

    10 Rauchs et 2018, p. 15.

    11 The definition of Andreas Antonopoulos is: “A block is a container data structure
    that aggregates transactions for inclusion in the public ledger, the blockchain”.
    Antonopoulos 2017, p. 196.

    12 Rauchs et al. 2018, pp. 72–74.'
