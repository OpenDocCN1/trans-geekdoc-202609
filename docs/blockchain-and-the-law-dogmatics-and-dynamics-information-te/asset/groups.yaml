    # 5 Blockchain Execution of Judgments—A Possibility in South Africa?


    governed by Rules 45 and 46 of the Uniform Rules of Court (the Uniform Rules).⁴
    The process is lengthy, arduous and expensive.


    As a starting point, Rule 45 requires the judgment creditor (Party A) to have
    issued with the registrar of the High Court a writ of execution for attachment
    of the assets of the judgment debtor (Party B).⁵


    This having been done, the writ is provided to the sheriff of the court, who is
    required to attend at the judgment debtor''s place of business to "demand satisfaction
    of the writ, and failing satisfaction...demand that so movable and disposable
    property be pointed out as he deem sufficient to satisfy the writ, and failing
    pointing out...search for such property.\⁶


    Once the sheriff has prepared an inventory of the goods, they are sold at an execution
    sale, by public auction to the highest bidder, to satisfy the judgment in whole
    or in part.⁷


    Rule 45 also makes provision for the attachment by sheriff of immovable assets
    (such as shares or claims) pursuant to a writ issued for attachment or the attachment
    of income due to the judgment by a third party (i.e., a garnishee).⁸


    Immovable property may similarly be attached in terms of Rule 46, however the
    process to do so is more onerous. In Rule 46, before a writ is issued for the
    attachment of immovable property, a further order must be sought from the court
    declaring the property executable for the judgment debt.¹⁰ The sheriff is then
    obliged to attach the property through the physical service of notices of attachment
    on the owner of the property, upon the request of the execution creditor, sets
    a date for the sale of the property, which must be accompanied by a notice of
    sale of physically sold to the interested parties.¹¹² The sale is conducted by
    public auction and is sold to the highest bidder, with or without a court imposed
    reserve price.¹¹³ Once the sale is complete, a conveyancer is appointed to attend
    the transfer to the purchaser and permits the sheriff to draw up a distribution
    account for the sale and make payment of the proceeds to the judgment creditor.¹⁴


