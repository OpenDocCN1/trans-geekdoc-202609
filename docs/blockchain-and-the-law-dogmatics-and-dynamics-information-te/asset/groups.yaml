    # Blockchain and the Law: Setting the Floor


    protocol—that establishes the basis and structure of power. As soon as this is
    identified, settled, connections for establishing rights, duties, and liability
    will flow.


    Blockchain is a private endeavor, a market created by power and managed by people,
    even if based on digital platforms with automated mechanisms of interaction in
    place. People establish the rules through agreement and within the space of autonomy
    the law provides for. If there is a problem with the code, in terms of how something
    is impossible to achieve (for example, data privacy), it is necessary for the
    code to be amended, which can happen.


    The situation with Bitcoin is the most difficult from one perspective. The anonymity
    of Nakamoto, with the lack of a centralized structure between the protocol and
    the multiple actors that are, in one or another, invested in, makes it very challenging
    to find adequate legal protection for users and to understand the rights and duties
    of each actor within the network. There is some form of legal practice, call it
    a digital-community at play, in the way the members of the Bitcoin community establishes
    procedures for updating the network³¹ Still, the process is somewhat erratic and
    informal. Nevertheless, given the fact that in terms of market adoption, most
    people deal (and deal) with intermediaries and, therefore, not connect to the
    network directly, and give the liability between the user and the intermediary,
    I do not consider the situation very problematic, from a realistic standpoint.


    ## 1.5 The Law for Blockchain


    Blockchain is this legal phenomenon because the law covers and regulates blockchain
    and its developments and interactions. Another question is if this "coverage"
    (or regulation) is adequate. I will try to provide some ideas in this section.


    The law receives social and technical phenomena under its terms. The operation
    of law, however, is complex, with a significant role afforded to hermeneutics
    and interpretation. The more open the meaning of rules is, the bigger the capacity
    of the law to adapt to new phenomena. One excellent example is the definition
    of what constitutes security under EU law, which is open to include any manifestation
    of value that works as an investment³².


    Is law "adaptive" enough to deal with blockchain and its developments? We have
    seen that private law rules can deal with several situations of blockchain technology.
    However, the space of autonomy of private law ends, and some things that with
    the greater adoption of blockchain are not permitted. For example, it is generally
    not legal to establish a negotiation system of financial instruments in a decentralized
    blockchain. It is also illegal (or at least devoid of legal effects) to represent
    a property title from a house, car, or corporate store as a cryptographic token;
    it is necessary to execute the act through a prescribed form of legal act (like
    a public deed, regarding real estate acquisitions). Although some regulation establishes
    incorporation criteria for people exercising an economic activity with "virtual
    assets" to prevent money laundering, it is unclear whether credit instruments
    can add to their portfolio or not. ³³ The tripartite and artificial division of
    token classification also makes it difficult to understand how to treat gains
    from the sale of crypto assets from a tax law perspective. ³⁴ Furthermore, it
    is unclear whether blockchain can serve as a system for the valid identification
    of identities.³⁵


    > ³¹ The book by Jonathan Bier shows this perfectly, See Bier 2021.


    > ³² See Ferrari 2020, 325–342.


    > ³³ See Directive (EU) 2018/843 of the European Parliament and the Council of
    30 May 2018 amending Directive (EU) 2015/89 on the prevention of the use of the
    financial system for the purposes of money laundering or terrorist financing and
    Directives 2009/138/EC and 2013/36/EU, PE/72/2017/REV/1.


    > ³⁴ See Chap. 4 by Carmo in this book.


    > ³⁵ EU Blockchain Observatory and Forum 2020a.


    The most significant legal challenge of blockchain is notmatic but practical:
    DLTs are global protocols operated by several people, spread around the world,
    with transactions being done in a peer-to-peer way among different jurisdictions.
    Identities are cryptographically drawn, and pseudonyms are used, which makes it
    difficult sometimes to locate and enforce. Global cooperation and technical expertise
    of law enforcement and courts are necessary. Global recognition of crypto assets
    in a form of legal category could also help with financial and tax regulation.


    In sum, legal rules must enable digitalization for the blockchain revolution to
    succeed (and the digitalization of value to occur). There are already rules over
    automated decision-making and processing, but not much convincing digitalizing
    identities, certificates, public deeds, or other forms of authenticated data.
    Moreover, most of property certificates are issued by public institutions or accredited
    actors, such as notaries. To think of a "decentralized" State apparatus is fascinating
    from a technical side. Public administration is the centralized social institution
    per excellence, even if it be divided into departments or different administrations
    (e.g., regional, municipal, federal). In the end, it is the public sector (the
    State, in its multiple formations) that controls the protocol, even if having
    a blockchain can bring gains in efficiency and transparency.


    ## 1.6 Conclusions


    Four years after the hype, blockchain continues to deliver at its slow pace. The
    modern world—particularly the modern communication and media—expects immediate
    and impactful results to be pleased. Once these are over, attention moves to the
    next big thing. That is the cycle of modern life if we want to be realistic.


    Although there is already an extensive and profound bound of research, the fact
    that we are still at the beginning. One thing is to cover a project, a proof-of-concept,
    a promise, or something potential, and another is to cover an existing, active,
    and reliability. Blockchain adoption is growing, which brings new faces and features.
    However, on the other hand, it also brings new forms of complexity (e.g., decentralization,
    staking). There is much to consider, as legislate, it is not clear how blockchain
    will impact the real world of interaction, if we are all participating in these
    systems or if we allow others to do it. I suspect it will be the latter, given
    that general computational literacy is very low for the population to participate
    in. Moreover, digital revolutions have appeared and gone, people''s appetite for
    security may turn the creative side of the phenomenon; but the most significant
    change that has to be cultural, concerning computational literacy and understanding
    of how digital technologies develop. If there are notes I would like to suggest
    regarding a blockchain framework and the law, these are the ones.

