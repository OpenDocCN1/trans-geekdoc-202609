    add blocks to the chain and validate these nodes.⁸ Thus, it creates a system with
    greater accountability that keeps its operations transparent, but one that is
    restricted to certified users only.


    In brief, a blockchain system can be either public or private and permissionless
    or permitted. The Bitcoin blockchain, for example, is a public, permissionless
    blockchain system, while a blockchain system that controls the supply chain of
    a private company, may be a private and permitted one that restricts the nodes
    to the company''s members. In other words, a blockchain will have different characteristics,
    depending on its purpose.


    In a TJ system, different combinations of networks can exist. A private and permitted
    blockchain can be used for digital identification matters, with sensitive information
    in a database controlled by one entity. A public and permissionless blockchain,
    like Bitcoin''s, can also exist for a funding and donations platform to support
    the TJ pillars. There are several possibilities, which can be tailored to requirements
    and the local context.


    Using all the tools mentioned above, blockchain has evolved and is now at the
    leading edge of a new technological revolution, creating a trustless but trustworthy
    environment for transactions without the necessity for a central control party.


    Although initially used for financial transactions, the technology can record
    any type of information, and can be used for various purposes. It is this feature
    that makes blockchain a general-purpose technology.


    # 3.3 Transitional Justice and the Effectiveness of Using Blockchain


    Transitional justice is broadly discussed in the international community. It has
    also been applied in several situations around the globe, which are the subject
    of extensive literature and case studies.


    The United Nations Secretary-General first published a report in 2004 addressed
    to the Security Council regarding aspects of the rule of law and TJ in post-conflict
    situations. The report discusses the perceptions of the United Nations (regarding
    TJ), as well as its objectives, mechanisms, and procedures to address transitional
    situations effectively.


    The UN has refined its understanding of TJ mechanisms, or pillars, via the Guidance
    Note of the Secretary-General³ on its approaches to TJ.


    ²⁸ Although the owner of the system grants access, the protection measures such
    as consensus, PoW and encryption remain the. The only difference is that there
    is a central authority that chooses who can participate in the network and who
    cannot.


    ²⁰ United Nations Secretary-General 2004.


    ³⁰ United Nations Secretary-General 2010.'
