    **摘要**

    在南非通过传统方法执行法院命令可能是昂贵且耗时的。现状的替代方案可以是使用智能合约进行执行。这将为双方带来不可撤销和不可更改的双重利益——执行速度和支付确定性。本章考虑了南非法律下胜诉方可使用的传统方法（5.2节）。然后考虑了区块链执行的概念和属性（5.3节），并考虑了南非背景下区块链执行的两种可能场景及其障碍（5.4节）。


    **关键词**

    判决执行 · 区块链 · 智能合约 · 南非法律


    ## 5.1 引言

    任何获得诉讼后未执行的法院命令或仲裁裁决的当都知道，没有执行手段的命令基本上毫无意义。使用区块链技术执行命令——具有不可撤销（因此具有最终性）和不可更改等关键优势——可以提供一种比目前南非传统方法更有效的执行方法。


    本章将从南非诉讼人的视角，根据南非法律考虑使用区块链执行法院命令的可能性。这样做，本章首先考虑南非法律下胜诉方可使用的传统执行方法（5.2节）。然后考虑区块链执行的概念和属性（5.3节）。随后将考虑南非背景下区块链执行的两种可能场景及其潜在障碍（5.4节）。


    ## 5.2 南非法律下的判决执行的传统方法

    考虑以下场景：A 公司在南非对 B 公司提起商业诉讼。两家公司均在南非注册地。该诉讼要么在高等法院通过传统诉讼提起，要么在双方同意的仲裁程序中提起。A 公司出于诉讼相关原因有权为
    B 公司提供费用担保。A 公司在诉讼中胜，获得了针对 B 公司的货币判决令。现在持有对 B 公司判决的 A 公司有权对 B 公司的资产执行判决。由于执行发生在南非并根据南非高等法院的规定，执行过程是


    > ¹ Harms 2016, 第621节这样解释该立场：“一种使胜诉方（判决债权人）能够法律程序执行判决的程序。法院能够给出有效判决的想法是管辖权的基础。有效性与执行密不可分，因为如果法院通过其官员对被告或其财产没有控制权，那么授予原告的判决可能仅仅是于一个理论性利益的声明。”

