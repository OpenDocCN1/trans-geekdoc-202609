    F. Pereira Coutinho 等人（编），《区块链与法律》，信息技术与法律系列 37，https://doi.org/10.1007/978-94-6265-579-9_6


    89


    ## 6.1 DLT 试点制度的背景


    欧洲委员会于2020年9月24日采纳了一项关于“数字金融”的新方案包，其中包括数字金融和零售支付策略，以及关于加密资产和数字韧性的立法建议¹。关于加密资产的立法建议基于2019年12月至2020年3月之间的公众咨询²，以及
    ESMA（欧洲证券和市场管理局）³和 EBA（欧洲银行管理局）⁴关于加密资产的报告。在这些报告中，确定了两个需求。


    第一个关注点是在尚未监管的领域引入规则，涉及不符合欧盟金融立法其他工具定义的加密资产。第二个需求与调整某些适用于符合金融工具定义的加密资产的规则有关，以尊重技术中立原则，且不为创新制造障碍。


    对于第一种情况，欧洲委员会提交了一项关于《加密资产市场条例》草案，广为人知的 MiCA。对于第二种情况，提交了一项关于基于分布式账本技术的市场设施试点制度草案。


    这项草案旨在以类似于监管沙盒的方式运行，为目前定义的金融工具二级市场规则建立法律确定性，特别是当这些规则完全适用于 DLT 和加密资产，同时又能确保对投资者的保护、市场完整性和金融稳定。正如
    ESMA 关于加密资产的报告所出的，监管机构在阐释现有要求时面临困难，这些规则并不适用于分布式账本技术（下统称为 DLT），且二级市场已有多次作为金融工具的加密资产公开发行；但二级市场的经验仍然较少。


    在二级市场解决这些问题，通过分布式账本技术发行和交易的作为金融工具的加密资产可以促进一级市场。


    > ¹ 访问地址：https://ec.europa.eu/info/publications/202024-digital-finance-proposals.

    > ² 访问地址：https://ec.europa.eu/info/sites/default/files/business_economy/documents/2019-crypto-assets-consultation-document.pdf.

    > ³ 访问地址：https://www.esma.europa.eu/document/advice-initial-offerings-crypto-assets.

    > ④ 访问地址：https://www.eba.europa.eu/reports-on-crypto-assets.

    > ⁵ 关于这一点，见 Maia 和 Santos 2022。

    > ⑥ 相应的，Zetsche 和 Wohloth 2021。


    草案本身通过在其序言中明确解决这一问题：“如果没有一个能够提供流动性并让投资者买卖资产的二级市场，作为金融工具的加密资产一级市场将无法持续扩张”。


    该草案的谈判已经结束，2022年6月2日，欧洲议会和理事会通过了关于基于分布式账本技术的试点制度的条例 (EU) 2022/858（下统称为 DLT 试点制度），修订了条例
    (EU) No 600/2014 和 No 909/2014 以及指令 2014/65。


    ## 6.2 什么是 DLT 试点制度？


    DLT 试点制度允许使用分布式账本的市场设施临时豁免某些欧盟法律规定，否则这些规定可能会阻止它们开发加密金融工具的交易和结算解决方案。


    此外，它是一项选择性制度，并不阻止金融市场结构（如多边交易设施 MTF、组织化交易设施 OTF、中央证券托管机构 CSD 和中央对手方 CCP）执行符合欧盟法律定义的加密金融工具的交易和交易后活动。DLT
    试点制度还允许 ESMA 和监管机构获得分布式账本技术在交易和交易后服务方面的特定经验。


    DLT 试点制度的范围适用于基于 DLT 的市场设施运营条件、许可以及监管机构与 ESMA 之间的监管与协调。在主体方面，该条例适用于投资公司、市场运营者和
    CSD。


    只有此类实体可以运营 DLT 市场设施，但有一个重要的例外：准入者。确定 DLT 试点制度的准入不应限于现有者，因此未根据条例 (EU) No 909/2014
    授权的实体可以申请该条例或指令下的授权，同时申请 DLT 试点制度下的特定授权——DLT 试点制度第 8(2)、9(2) 和 10(2) 条。


    > 7 特定授权和豁免具有临时性质，自授予特定授权之日起最长为六年，且仅适用于 DLT 试点制度的持续期间——DLT 试点制度第 8(11) 和 9(11)
    条。


