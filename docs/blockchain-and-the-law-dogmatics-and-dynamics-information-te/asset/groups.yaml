    M. Lucas Pires


    execute the act through a prescribed form of legal act (like a public deed, regarding
    real estate acquisitions). Although some regulation establishes incorporation
    criteria for people exercising an economic activity with "virtual assets" to prevent
    money laundering, it is unclear whether credit instruments can add to their portfolio
    or not. ³³ The tripartite and artificial division of token classification also
    makes it difficult to understand how to treat gains from the sale of crypto assets
    from a tax law perspective. ³⁴ Furthermore, it is unclear whether blockchain can
    serve as a system for the valid identification of identities.³⁵


    The most significant legal challenge of blockchain is notmatic but practical:
    DLTs are global protocols operated by several people, spread around the world,
    with transactions being done in a peer-to-peer way among different jurisdictions.
    Identities are cryptographically drawn, and pseudonyms are used, which makes it
    difficult sometimes to locate and enforce. Global cooperation and technical expertise
    of law enforcement and courts are necessary. Global recognition of crypto assets
    in a form of legal category could also help with financial and tax regulation.


    In sum, legal rules must enable digitalization for the blockchain revolution to
    succeed (and the digitalization of value to occur). There are already rules over
    automated decision-making and processing, but not much convincing digitalizing
    identities, certificates, public deeds, or other forms of authenticated data.
    Moreover, most of property certificates are issued by public institutions or accredited
    actors, such as notaries. To think of a "decentralized" State apparatus is fascinating
    from a technical side. Public administration is the centralized social institution
    per excellence, even if it be divided into departments or different administrations
    (e.g., regional, municipal, federal). In the end, it is the public sector (the
    State, in its multiple formations) that controls the protocol, even if having
    a blockchain can bring gains in efficiency and transparency.


    # 1.6 Conclusions


    Four years after the hype, blockchain continues to deliver at its slow pace. The
    modern world—particularly the modern communication and media—expects immediate
    and impactful results to be pleased. Once these are over, attention moves to the
    next big thing. That is the cycle of modern life if we want to be realistic.


    Although there is already an extensive and profound bound of research, the fact
    that we are still at the beginning. One thing is to cover a project, a proof-of-concept,
    a promise, or something potential, and another is to cover an existing,


