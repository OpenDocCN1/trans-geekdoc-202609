    The provenance of our votes, and the assurance that comes with knowing that your
    vote counted the way that you intended is what builds trust in elections and their
    results. In this environment, many people see blockchain technology as a solution
    to build out a digital system of voting. As one example, US Presidential candidate
    Andrew Yang famously suggested voting in a mobile-based blockchain system.³³ His
    bold assertion “It is 100% technically possible to have fraud-proof voting on
    our mobile phones using blockchain. This would revolutionize democracy and increase
    participation to include all Americans—those without smartphones use the legacy
    system and lines would be very short.⁴ Technical solutions do not exist in a vacuum
    and technology would be deployed to systems in the election where there are none.


    Blockchains are an effective solution to the “double-spend” problem⁵ for cryptocurrencies
    and other digital assets. Blockchains are not, however, a good solution to electronic
    voting let alone voting in the election space must take into consideration the
    political environment, the cultural environment, the legal environment, and the
    technological environment.⁶ Without additional changes to an electoral system
    technology as it is commonly employed adds little to an electoral system.


    According to IBM, a blockchain is a “shared, immutable ledger that facilitates
    the process of recording transactions and assets in a business network.”⁷ The
    IBM definition is useful in that it focuses on transactions and assets that exist
    in a business network. The very first blockchain of economic significance was
    the Bitcoin blockchain. As IBM claims, the benefits of blockchain are greater
    trust, security, and more efficiencies.⁸


    Although blockchains may be an effective solution for the “double-spend” problem,
    as applied to cryptocurrencies and other digital assets, they are not, on their,
    good solution for election voting. The reality is that blockchain technology requires
    a lot of additional changes to an electoral system to add value.


