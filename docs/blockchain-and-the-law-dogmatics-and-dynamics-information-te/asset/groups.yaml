    # 3 What Are the Limits of Blockchain? Considerations on the Use ... 35


    Although there are several definitions of TJ, most authors follow a similar understanding
    to the one contained in UN reports. In this regard, transitional justice is


    the full range of processes and mechanisms associated with a society''s attempt
    to come to terms with a legacy of large-scale past abuses, in order to ensure
    accountability, serve justice and achieve reconciliation.³¹


    For the UN, transitional justice is, theoretical, applicable to past large-scale
    abuses by legal and psychological mechanisms to overcome such issues. The arrangements
    stated by the UN are prosecution initiatives, the right of truth, institutional
    reform, and national consultations. Furthermore, such processes must be driven
    by certain guiding principles, including compliance with international norms and
    standards, awareness of the local political context, minority- and victims-centered
    approaches, and the element of national law enforcement to ensure the rule of
    law.³ All elements of TJ must work holistically to be properly implemented. In
    that sense, blockchain technology can utilize all TJ approaches and, at the same
    time, operate individually in each one of them being programmed to act in each
    situation, and choosing the best understanding for each need.


    Even when there are different understandings and concepts regarding TJ, its pillars
    and approaches, a broad consensus of scholars understand that there are four preliminary
    pillars of TJ, namely prosecution, truth commissions, institutional reform, and
    reparations.³³ There are critics of this format of TJ pillars, which does not
    fall within the scope of this chapter. In name of objectivity, the five pillars
    chosen are those stated by the UN, with the addition of reconciliation as the
    fifth pillar.³⁵


    One constant critique in TJ approaches, however, is that they regularly ensure
    restorative and punitive justice, with prosecutions and truth commissions, in
    a Western approach. Such a method undermines the TJ processes, removing the protagonism
    of the local society to the international/Western community, resulting in local
    ownership being lost. TJ approaches also fail to address the roots of the conflict,
    such as socioeconomic structures and inequalities⁶ In that sense, a comprehensive
    system using blockchain technology ensures the protagonism of the local population,
    with local leaders integrated into the system, could help to enhance local participation.
    Also, the possibility of sending financial aid via blockchain to victims could
    improve local participation by empowering victims economically.


