    上述图景是简单的，我承认，没有考虑到一些复杂的情况。例如，关于网络参与者的权利和义务：如果矿工未能挖掘出一个区块并为用户插入交易，他/她是否可以就损失向矿工索要赔偿？如果协议代码有漏洞，且该漏洞允许非法交易的运行，由谁来负责？协议的创建者，还是创建并负责协议维护的基金会/公司？或者是投入时间（通常由创始公司、基金会或协议投资者的补贴）的自由职业程序员和开发者？投票和参与又是怎样的？我有权通过质押和对协议治理进行投票来获得透明度吗？在我不同意的硬分叉情况下，我是否可以就该分叉提起诉讼？在没有坚实保护的情况下，他们自担风险。


