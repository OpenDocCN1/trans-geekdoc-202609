    As demonstrated, the use of blockchain technology for prosecution purposes a TI
    situation is similar to us TC situations, since it intends to improve the efficiency
    of operational aspects, such as the exchange of information between several actors.


    # 3.3.3 Restoring Democratic Institutions


    After periods of violence, usually caused by the State, there is distrust regarding
    the State and its institutions, especially as regards the preservation of rights.
    Inn such contexts, State institutions could symbolize the State regime and, therefore,
    should be dismantled or changed to regain public trust.65


    65 One example is the old DOI/CODI in Brazil, symbol of the Brazilian military
    dictatorship and torture practices during the regime, scrapped as part of the
    Brazilian democratization process.'
