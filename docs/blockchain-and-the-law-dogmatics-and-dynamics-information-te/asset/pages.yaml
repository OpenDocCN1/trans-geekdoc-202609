    that are tamper-evident, tamper-resistant, public and auditable, and enable new
    forms of human cooperation. Voting is a kind of double-spend problem where you
    do not wish to allow people to vote more than once. The siren song of blockchain
    fixing elections is forbidden, but governments must take care. Quick fixes are
    rarely quick or fixes. The blockchain may be a good use of creating digital cash,
    but that does not mean it can obviate all the problems facing modern elections
