  md: '# 8.6 Conclusions


    Smart contracts generate significant interest, have substantial potential, and
    offer major benefits. The potential of smart contracts has been recognized by
    the industry, legal community and recently by some regulators and legislators
    as well. UKJT confirmed that ''in legal terms, crypto-assets and smart contracts
    እንደሚ repeat the future.^95 even though some legal scholars consider them ''a damp,
    and regret widely distributed, squib of a promised blockchain revolution.^96 It
    is therefore crucial to understand and clarify the normative dimension of this
    innovation and develop its legal underpinnings.


    Smart contracts are not widely. They vary from simple, straightforward, standardized
    payment instruments to sophisticated instruments of the autonomous performance
    of a complicated sequence of actions. With the increased use of smart contracts
    more legal clarification, legislative recognition and regulatory guidance will
    be needed. The intersection of technology and law presents challenges, and ^97
    adequate regulatory response is essential to provide market confidence and legal
    certainty to the industry, investors, and consumers.


    Several aspects of smart contracts challenge the legal community, but are unlikely
    to undermine established legal systems and in principle seem to be no major obstacles
    for smart contracts and no dramatic reforms necessary to examine them under most
    legal systems. The legislators’ response has been limited so far and to address
    basic definitions, legal recognition, and evidential admissibility of smart contracts.
    Smart contracts should remain firmly on the agenda of the legislators, who would
    thoroughly consider this technological development and monitor it closely, stepping
    in to provide legal clarity, support innovation and mitigate risks.


