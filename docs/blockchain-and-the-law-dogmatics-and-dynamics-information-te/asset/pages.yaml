  md: '# 6.1 Background of the DLT Pilot Regime


    The European Commission on 24 September 2020 adopted a new package on “Digital
    Finance”, which includes digital finance and retail payments strategies, as well
    as legislative proposals on crypto-assets and digital resilience.¹ The legislative
    proposals on crypto-assets were based on a public consultation between December
    2019 and March 2020² and the reports from ESMA (European Securities and Markets
    Authority)³ and EBA (European Banking Authority)⁴ about crypto-assets. In these
    reports, two needs were identified.


    The first concern introducing rules in an area that is not yet regulated, concerning
    crypto-assets that do not qualify as other instruments of the European Union’s
    financial legislation. The second need is related to adapting some rules applicable
    to crypto-assets that qualify as financial instruments to respect the principle
    of technological neutrality and not create obstacles to innovation.


    For the first case, the European Commission has presented a proposal for a European
    Regulation on Markets in Crypto-assets, better known as MiCA. For the second case,
    a proposal has been made by the European Commission for a pilot regime for market
    infrastructures based on distributed ledger technology.


    This last proposal intends to implement a more specific focus on trading in crypto-assets
    qualified as financial instruments on market infrastructures⁶ before the rules
    currently define for secondary markets in financial instruments, particularly
    if these rules are fully suited to distributed ledger technology and crypto-assets
    while ensuring the protection of investors and market integrity and financial
    stability.


    As set out in the ESMA Report on crypto-assets, the authorities encounter difficulties
    interpreting the existing requirements when they as financial instruments. Some
    rules are unsuitable for distributed ledger technologies (hereafter referred to
    as DLT) and are mainly related to the secondary market. This understands some
    correspondence in the market, where several public offerings of crypto-assets
    qualified as financial instruments have already been made; however, experiences
    in the secondary market are much scarcer.


    Addressing these concerns in the secondary market for crypto-assets qualified
    as financial instruments could boost the primary market by ensuring more liquidity
