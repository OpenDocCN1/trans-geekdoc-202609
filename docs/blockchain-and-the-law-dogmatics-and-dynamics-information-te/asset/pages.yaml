  md: '# 3 Are the Limits of Blockchain? Considerations on the Use ...


    (by means of institutional reform of the State apparatus, primarily in the justice
    and security sectors).77


    Despite the State''s obligation to protect their adequacy and effectiveness, reparations
    programs face some challenges. They include the outreach of the reparations program
    (“completeness”),78 compliance of the reparations program to court judgment would
    allow undue enrichment of victims, proper enforce of the reparations program,
    public participation (especially participation by the victims), and issues regarding
    collective reparations vis-à-vis individual reparations.79


    Reparations tend to be broader in scope, since they deal not only with individual-compensated
    measures but encompass several rights that materialize in the personal, collective,
    civic, as well as political, economic, social, and cultural spheres in psychological
    and creative ways.


    Issues regarding violations will be contemplated and the types of reparations
    will be needed to be taken into consideration. However, problems are generally
    discussed with political bias and also represent a challenge to foreign actors
    who monitor TJ processes.


    In this area, too, blockchain technology applications can help to create a comprehensive
    reparations system, one that can assist with delivering aid to victims and track
    their needs.


    Due to the transparency and traceability characteristic of blockchain technology,
    especially financial reparations—can be tracked to ensure that the correct amount
    is paid to the correct victim. Notwithstanding, such capabilities also be used
    to monitor health products and other goods destined for specific communities and
    victims, via a production concept.80 The use of blockchain enables an almost instantaneous
    monitoring of products with Pow and tamperproofing of the data transacted, thus
    ensuring the proper delivery of aid products to victims and avoiding losses. The
    increased transparency in production chains set up enhanced accountability for
    companies that purchase products and merchandise from human rights violators (e.g.,
    blood diamonds from Sierra Leone).


    Regarding land restitution, blockchain technology provide a new way to register
    land. Even when land restitution is not possible, States could provide government
    securities or vouchers as a compensation for the loss of the land, which would
    create a secondary market of such securities.81 If these securities tokenized,
    this secondary securities market could be regulated, but at the same time introduce
    compensated victims into the financial system and make the trade of tokens an
    attractive asset for them.


