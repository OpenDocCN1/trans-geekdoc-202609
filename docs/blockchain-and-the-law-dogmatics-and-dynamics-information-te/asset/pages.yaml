    Whilst the Rule does not prescribe what security for costs must take, it is established
    practice that it takes the form of a bank guarantee⁴⁸ This entails the litigant
    required to put up security, to deposit in a bank account the amount which security
    was set. The bank then provides a physical guarantee for the amount held by. The
    guarantee undertakes to make payment to the litigant requiring security that it
    will pay such litigant in the account held, upon the happening of certain events,
    unless the presentation of a finished bill of costs setting out the amount payable.
    When the guarantee becomes payable, it must be physically presented at a bank
    branch for payment.


    As clear, the process of obtaining such a guarantee is (like traditional execution)
    a laborious and expensive undertaking. It requires payment to the bank concerned
    of a fee or commission to guarantee and maintain the account in which the funds
    are held. Also, whilst the funds are held by the bank subject to the guarantee,
    the interest earned on the amount deposited is of a nominal nature, leading to
    a depreciation of the amount held over time.


