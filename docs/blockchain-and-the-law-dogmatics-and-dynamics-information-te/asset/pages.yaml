  md: '# 4.2.2 The Principle of Legal Certainty and the Binding Rulings


    The principle of legal certainty in tax application (connected with the principle
    of legality,) is a corollary of the rule of law, and it implies the rejection
    of arbitrariness and the defense of tax transparency, allowing an individual to
    know in advance which he or she will be subject also safeguarding the principle
    of good faith provided by article 266(2) of the Constitution.$^8$


    Given the dictates in qualifying the new realities underlying crypto-assets, especially
    if we consider that these economic events are not always well understood by decision-makers,
    this principle gains a greater relevance. Consequently, the importance of binding
    rulings by the TA stands out since they clarify the interpretation of tax law.


    Article 68 of the GTL allows any taxpayer to request a binding ruling on his her
    specific tax situation, by stating the relevant facts (as long as they are not
    subject to a tax)$^9$ The relevant ruling should be issued within 150 days. The
    TA cannot proceed subsequently in a different direction from the binding ruling
    (within the scope of the request), except in compliance with a judicial decision—see
    article 68(1), (3), and (14) of the GTL. All binding rulings should be published
    by electronic means (i.e. in TA''s official website).$^{10}$ with safeguards of
    the taxpayer''s personal data—article 68(17) of the GTL. To this rule, the interpretation
    of the law by the TA is publicly known, which brings greater legal certainty to
    taxpayers by assuring predictability in TA''s future behavior.


    As we see below, there are already some binding rulings by the TA regarding several
    situations related to cryptocurrencies, which allows economic actors to predict
    up to a certain degree the consequences of their acts (insofar as cases similar
    to those in the binding rulings)


    Additionally, the principle of good faith is safeguarded in article 104(1) of
    the GTL. This legal provision establishes that the TA can be sentenced to a financial
    penalty under the rules on litigation in bad faith if it acts against the content
    of binding information provided previously to the taxpayer or when his behavior
    in the process differs from that usually adopted in identical situations. However,
    there are


    > ^7 Gomes 1993, p. 145. The above-mentioned article 11(4) of the GTL is a guardian
    of the principle of legal certainty.


    > ^8 Pires and Calçada Pires 2012, pp. 123–124. This is also from this principle
    which the prohibition on retroactivity of the tax law, by Article 103(3) of the
