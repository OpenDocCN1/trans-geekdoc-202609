    # 7.2 Anonymity Options and Author’s Survey Results


    In October 2020, seven central banks together with the BIS published a report
    identifying the key principles necessary for any publicly available CBDCs. Although
    the central banks that contributed to this report have not yet decided whether
    or not to issue a CBDC, their common motivation to engage in such project was
    to use CBDC as a means of payment. They outlined the following set of key principles
    which should be considered when issuing CBDCs:


    +   - coexistence with cash and other types of money in a flexible and innovative
    payment system;

    - any introduction should support wider policy objectives and do no harm to monetary
    and financial stability;

    - features should promote innovation and efficiency.


    Considering that the main feature of cash is that there is no record of either
    identity or the transactions themselves, it won’t be easy from a customer’s point
    of view moving into a fully traceable means of payment (aside from other features
    that may, from a technical point of view, be implemented with CBDC such as limits
    or restrictions on certain types of payments, reversibility, and application of
    negative interest rates). Nevertheless, anonymity is not a plausible option in
    the aforementioned report. Although addressing AML/CFT concerns is not listed
    among the primary motivations from a central bank, the latter is to comply with
    these rules when issuing CBDC to the public.


    According to a paper issued by Bech and Garratt (2017) there could be two anonymity
    options: (i) counterparty anonymity where the payer does not need to reveal its
    true identity to the recipient of funds and members (ii) third-party anonymity
    where the payer does not reveal its identity to other members of the community
    (e.g., a payment service provider, bitcoin or other cryptocurrency community or
