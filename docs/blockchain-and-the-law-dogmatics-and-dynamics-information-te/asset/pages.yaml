  md: '# 4.46 Other Types of Income and Some Practical Considerations


    There are no other public understandings of the TA regarding PIT and crypto-assets.
    Nevertheless, here follow some additional thoughts, considering that article 1(2)
    of the PIT Code determines the taxation of income, whether paid in cash or in
    kind. In our opinion, crypto-assets may be qualified as payments in kind and if
    the parties under a contract agree with such a form of payment, there is no obstacle
    to a tax perspective. Therefore, if one receives crypto-assets as payment for
    goods sold or services rendered under schedule B, it will be taxed at the progressive
    tax rate. Or if a salary is paid with cryptocurrencies, it will be taxed under
    schedule A, also at the progressive tax rates. If a landlord accepts crypto-assets
    to settle the rent, it will be taxed under schedule F with an autonomous taxation
    of 28%.


    Still, one practical difficulty may arise: what is the exchange rate to Euros
    that one should apply? The PIT Code establishes in its article 23 the rules for
    values fixed in a currency without legal tender in Portugal (the equivalence to
    Euro should be determined by the official quotation of the respective currency,
    at the day resulting from those rules). However, this is not the appropriate solution
    since crypto-currencies are not technically currency. Instead, we should apply
    article 24 of the same Code, which provides successive rules for cash equivalence
    for income in kind:


    +   (a) At the officially established price;

    (b) By the official purchase quotation;

    (c) In the case of goods, by the purchase quotation on the Lisbon merchandise
    exchange, or by the average price of the respective year or the last one determined,
    and which are included in the city stowage;

    (d) For the prices of similar goods or services published by the National Statistics
    Institute;

    (e) At market value, under conditions of competition.


    Since there is no official price or quotations for crypto-assets, in our opinion,
    we should use market value (available in exchanges platforms). This was, for instance,
    the IRS solution on income resulting from an airdrop of crypto-currency in the
    sequence of a hard fork, determining that the taxable basis is measured by the
    respective market value.


    > 29 According to the TA, as we saw above, and also ECJ as we will see below.


    > 30 Internal Revenue Service 2019.'
