    content of the same is an *inter partes* connection since the TA is forbidden
    to proceed in a different direction from the ruling only in relation to the specific
    case of the requesting taxpayer¹¹


    In short, despite the practical relevance of the existing binding rulings, the
    TA is only bound beyond the facts covered by said request (if fact, a taxpayer
