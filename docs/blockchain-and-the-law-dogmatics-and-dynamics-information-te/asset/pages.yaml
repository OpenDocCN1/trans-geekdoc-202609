  md: '# 3.1 Introduction


    The use of technologies used to be restricted to State actors, which are commonly
    the principal offenders in transitional justice and human rights situations, which,
    in turn, leads to the monopolization of these instruments in hands of offenders.
    However, in recent years this monopolization has become less intense and new technologies,
    such as radars, digital media, apps, drones, and open-source mapping, have become
    much common among non-state actors. It allows the civil population to better record
    and transmit violations, helping to prepare more substantial and better protections
    against perpetrators and transitional justice defenders since such technologies
    that once exclusively in the hands of a few are now part of the civil society
    reality, enabling information about abuses to be gathered and analyzed.¹


    Transitional justice continues may use of new technologies to increase its efficiency
    in different fields. From identifying and recovering missing people² to gathering
    and categorizing information for the truth-seeking process.³ Several are the positive
    impacts in introducing new procedures and technologies into transitional justice,
    with the idea to improve the quality and time of operations


    In that sense, adherence to a general-purpose technology (GPT) such as blockchain
    may be effective to dealing with transitional justice issues. The lack of support
    from governments and other actors may jeopardize transitional justice projects
    that constantly struggle to find proper personnel and funding for their operations.
    Therefore, the adaptation of existing technologies to the transitional justice
    reality would be useful, especially when such technologies are not a single purpose⁵
    since it is a more reasonable and cost-effective solution to deal with such issues.


    The present chapter intends to create new perspectives regarding how using blockchain
    technology can solve current problems in transitional justice procedures. If understood
    as a general-purpose technology, with auditable transactions, data storage capacities
    and the ability to work in different fields, blockchain technology might be well
    suited to adaptable transitional needs. In blockchain, what is transacted is a
    digital representation of the information (a digital token), enabling the recording
    and transaction of any data.


    The chapter is divided into two segments. The first (Sect. 3.2) intends to briefly
    establish the concept of blockchain, while the second (Sect. 3.3) will set out
    some of the principal elements of transitional justice using Jeremy Sarkin''s
    theory of the five pillars of transitional justice and propose new procedures
