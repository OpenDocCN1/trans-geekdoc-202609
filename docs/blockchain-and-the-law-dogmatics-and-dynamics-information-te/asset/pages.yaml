    # 7.3 Technological Options


    While a fast pace in technological development can be a positive factor, this
    is not helping central banks in their decision-making process of designing CBDCs.
    Typically, central banks operate in a centralized ledger system, while DLT solutions,
    of which blockchain is arguably the best known, brought to fore a new technological
    choice. Since DLT is still in a developing phase, it brings a lot of uncertainties
    related to its capacity and suitability. That said, there is not a universal approach
    among central banks to embrace DLT as the main technology enabling the issuance
    of CBDC.


    Central banks are in advanced phases of CBDC testing or piloting are assessing
    DLT application versus centralized ledgers to identify constraints and limitations.
    The People’s Bank of China (PBC) has already tested DLT in its pilots, decided
    that it has limited capacity to process transactions, especially on days with
    high levels of transactions. For this reason, the PBC has committed to a “hybrid
    architecture”, meaning that the DLT will be used in limited areas, allowing for


