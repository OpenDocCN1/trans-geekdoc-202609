    # 6.4 How Does the DLT Pilot Regime with DeFi?


    One of the purposes of the DLT Pilot Regime is to take advantage of the potential
    of DLT, a transformative technology in the financial sector, in reducing intermediaries
    and, subsequently, transaction costs. This purpose is related to multiple benefits,
    such as enhanced efficiency, transparency, and competition in relation to trading
    and settlement activities.


    In this context, many repetitive processes, namely the input of transaction data
    separately in each layer of the custody chain, together with costly reconciliation,
    can be eliminated.⁴⁵ The prominent example of the use of this potential of DLT
    is what is allowed to a DLT TSS, as presented in Fig. 6.2.


    The DLT Pilot Regime allows an investment firm or market operator under MiFID
    II to operate a DLT TSS and allows the exemptions as available to operators of
    DLT MTFs and DLT SSs, including the obligation of intermediation in the access
    of retail investors to the market infrastructure as a member or participant. Figure
    6.2 represents the traditional operation of trading and settlement services. What
    a DLT TSS can do to traditional operation under the DLT Pilot Regime eliminates
    the need for brokers and a CSD to access the market, custody and settlement


