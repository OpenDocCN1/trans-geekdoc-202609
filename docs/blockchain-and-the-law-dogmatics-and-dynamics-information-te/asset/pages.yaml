  md: 'Taxing Crypto-Assets—The Portuguese Perspective


    # 4.5 Taxing Crypto-assets under the Value Added Tax Code


    # 4.5.1 The Value Added Tax Code: A Brief Introduction³³¹


    The transfers of goods and the provision of services (as defined, respectively,
    in articles 3 and 4 of the VAT Code carried out in Portugal, for consideration,
    by a taxable person acting as such, imports of goods (article 5 of the same Code)
    and intra-Community operations carried out in the national territory, are defined
    and regulated in the VAT Regime for Intra-Community Transactions are subject to
    VAT—v. article 1 of the VAT Code.


    Article 2 of the VAT Code establishes who are the taxable persons, among which
    we should highlight the natural or legal persons who, in an independent and habitual
    manner, carry out activities of production, trade or provision of services, including
    extractive, agricultural and free-trade activities, as well as those who independently
    carry out a single taxable transaction, provided that such transaction is connected
    to the exercise of the aforementioned activities, wherever this occurs, or, regardless
    of that connection, such transaction fulfils the real impact assumptions of the
    PIT or CIT (paragraph 1(a) of the same article).


    There are some exceptions, the ones related to the type of activity (article 9
    of the VAT Code) and those related to turnover (article 53 of the same Code).
    The VAT rates are defined in article 18 of the Code and in the attached tables,
    the general tax rate 23%, the intermediate tax rate 13% and the reduced tax rate
    6% (for mainland Portugal).


    # 4.5.2 The European Court of Justice Hedqvist Case³³²


    In this landmark case there was a request for a preliminary ruling on whether
    transactions to exchange a traditional currency for Bitcoin or versa (held by
    Mr. Hedqvist’s company) were subject to VAT. Article 2 of the VAT Directive³³
