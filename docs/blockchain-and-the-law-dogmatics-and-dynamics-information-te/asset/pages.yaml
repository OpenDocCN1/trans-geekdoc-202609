- pgno: 18
  md: '# Blockchain and the Law: Setting the Floor


    law—concerning the quality of the order ought to have. Justice— at a very functional
    and open level can be defined as the duty to provide to each of its due¹—is the
    orientation that guides the choices of rulers, the ultimate criteria. Justice
    is a strong concept, and a discussion of its core goes beyond this scope; suffice
    to say that it usually represents an idea of what is “right” (e.g., correct).¹²
    sets and represents (or, at least, aspires to represent) the rightest of social
    order.


    The following considerations are the most complicated, for they deal with the
    question of law being the product of a public. When stating that an authoritative
    institution enacts a law, what I mean (and what, I suspect, readers immediately)
    is that law is a form of political action.¹³ That is, law by an institution that
    has the power to rule over society, power that is not only genuine but legitimate,
    is justified in light of social criteria—for example, because of it is expressed
    by a democratically-elected body. It is also part of the ruling power of institutions
    responsible for upholding the law by making its results achievable and applying
    sanctions to those who fail to comply with it.


    There is a more social view of law that is not so much concerned with exercising
    the power of top-down authority but with the collective expression of law emerging
    from the community through routine interactions. The social expression of law
    is called custom, where people act according to a collective perception of what
    is legally mandatory, which can be at odds with public law (e.g., law made by
    the rulers),¹⁴ Legal orders, and their rulers, not only admit the existence of
    such legal sources but also acknowledge individual autonomy in the definition
    of social interactions by the mode of private law. Private law is (or can be generally
    described as) the rules dealing with relations between individuals outside of
    a relation of political (ruling) authority.¹⁵ The liberal premise of private law
    is that people can do whatever they want—i.e., they can set the terms of their
    legal relations as they wish—within limits set by the law There is a community
    where the community—does not prescribe a specific outcome nor a preferred action
    method. Hence a significant role is given to individual consent in the realm of
    private law under certain principles. This includes recognizing forms of collective
    action (e.g., associations, enterprises, corporations) and contractual freedom
    to set the terms of interaction, also specific forms of resolving litigation (arbitration,
    for example).


    Therefore, we can say that the legal phenomenon consists of rules of conduct,
