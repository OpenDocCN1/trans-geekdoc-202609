    Few states stand out as more progressive and address smart contracts in a more
    comprehensive way. For example, Nevada enacted a bill (Bill 398)⁸ in June 2017,
    which amends the Uniform Electronic Transactions Act and allows smart contracts,
    records, or signatures created, stored, or verified on a blockchain to be enforceable
    and admissible in evidence. Nevada is the first US state to ban local governments
    from imposing taxes on blockchain use. Nevada''s bill closely resembles Illinois''
    Blockchain Technology Act (BTA)** implemented on 1 January 2020. Unlike the fragmented
    approach of other states, the BTA addresses all three issues of smart contracts:
    enforceability, admissibility to evidence, and local regulations. Smart contracts
    are defined simply as contracts stored as electronic records, which may be denied
    legal effect or enforceability or excluded in proceedings solely because a blockchain
    was used to create, store, or verify them (similar law regarding the evidentiary
    effect of smart contracts have passed in Vermont). The BTA also includes limitations
    on the use of blockchain and smart contracts. In certain public circumstances,
    like cancelling a public utility, a notice of default or eviction, a cancellation
    of health benefits, or a recall of products, notice or confirmation of receipt
    may not be sent over blockchain.


    Finally, BTA prohibits local governments from imposing any limits or requirements
    on the use of blockchain and smart contracts, including taxes, fees, or requirements.
    The BTA provides a high degree of legality for the use of smart contracts and
    clarifies their legal status. Finally, Wyoming stands out with 13 blockchain enacted
    to provide a comprehensive legal framework designed to foster innovation and promote
    the blockchain industry. It has many features and defines a smart contract as
    an automated transaction or any substantially similar analogue, which is composed
