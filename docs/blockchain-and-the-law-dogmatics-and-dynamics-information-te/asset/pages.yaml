    # 7.7 El Salvador Case


    To conclude this chapter, and although not entirely related with the topic at
    hand, we present the case of El Salvador that, in 2021, adopted Bitcoin as legal
    tender. This may be useful and instructive as the Salvadoran case presents some
    aspects that could be relevant for CBDC implementation: the prevention of legal
    tender directly to the public by the central bank and authorities (such as in
    the payment of governmental allowances and benefits), the adjustment by the population
    to “official” digital channels (such as government sponsored wallets), and the
    granting of legal tender status to a non-physical currency.


    # 7.7.1 Country Context


    El Salvador is a small²⁹ located in Central America, with a population of 6.5
    million inhabitants³⁰ and the US Dollar as its legal currency. The central bank
    ceased the issuance of the Salvadoran Colon starting January 2001.¹¹ El Salvador
    is heavily reliant on remittances, and it leads the region in remittances per
    capita, with inflows equaling nearly all of the country''s income. According to
    World Bank data³² the remittances received 24.1% of the GDP in 2020 with an increasing
    trend in the last five years and the majority of the remittances'' funds coming
    from Salvadorans living in the United States. As such there is a vast USD inflow
    into El Salvador which is transferred via traditional remittance channels.


    The cost of transferring money from the US to El Salvador has been decreasing
    over time. According to the World Bank database, in the first quarter of 2021
    the average cost of sending $200.00 was 2.91% and 3.53% in the fourth quarter
    of 2020 and in the fourth quarter of 2019.³³ Globally, sending remittances cost
    an average of 6.38% of the amount sent.³⁴


    On the other hand, the financial inclusion in El Salvador is very low. According
    to the latest Global Fintech survey used in 2021, 31% of the population has an
    account in a financial institution compared to 29% in 2017, hence a slight increase
    in financial account ownership figures. This is much lower than the global data
    results, where the share of adults who have an account with a financial institution
    or through a mobile service rose from 66% to 74% worldwide.


