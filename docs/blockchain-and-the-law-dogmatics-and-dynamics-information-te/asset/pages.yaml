  md: '# 4.4 Taxing Crypto-assets under the Personal Income Tax Code


    # 4.4.1 The Personal Income Tax Code: A Brief Introduction²¹


    All natural persons resident in the Portuguese territory²² are subject to PIT
    on all their income, including that obtained outside Portuguese territory (worldwide
    income principle) while non-resident natural persons are only taxed on income
    obtained therein (territorial or source principle)—article 15 of the PIT Code.
    For these taxpayers, we must analyze the taxable basis, as defined by article
    1 of the PIT Code, which establishes the following:


    Article 1

    Taxable Basis


    +   1—The personal income tax is levied on the annual value of the income from
    the following schedules, when resulting from unlawful acts, after making the corresponding
    deductions and allowances:

    Schedule A—Employment income;

    Schedule B—Business and professional income;

    Schedule E—Capital Income;

    Schedule F—Property income;

    Schedule G—Capital gains;

    Schedule H—Pensions.


    +   2—the income, whether in money or in kin, is subject to taxation, wherever
    it is obtained, and in what currency it is earned.


    Only the income from those schedules is taxed and the taxable amount is subject
    to progressive taxation up to 48%, plus an additional solidarity tax with a rate
    of 2,5% applicable to taxable income exceeding € 80,000 to € 250,000 and 5% applicable
    to taxable income exceeding € 250,000. However, there are some types of income
    taxed with autonomous or final tax rates—both of 28%.²³


    Therefore, in the case of natural persons, income from crypto-assets is taxed
    under the PIT Code only if it falls into one of these six schedules of income.
    And in that case, as it results from article 1(2), the taxation will be levied
    regardless the payment is made or in kin (regardless of the currency used). This
    was the interpretative


