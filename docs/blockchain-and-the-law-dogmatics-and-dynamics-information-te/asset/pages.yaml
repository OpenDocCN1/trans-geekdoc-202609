    # 8.5 Selected Smart Contracts Legislation


    # 8.5.1 The United States


    Despite an increasing interest in recognition of smart contracts, only a handful
    of countries have formulated a regulatory response to smart contracts. In the
    US, smart contracts legislative initiatives by US states are relatively narrow
    and govern only selected issues, mostly limited to defining smart contracts and
    recognition of their electronic form and signatures. Until April 2019, various
    US states have considered 133 blockchain technology related laws. However, only
    7 related to smart contracts and only a few of those have been passed successfully⁷⁷


    Arizona is the pioneer of smart contracts legislation in the United States⁷⁸ In
    2017, Arizona passed a law (Bill HB 2417)⁹ amending the Arizona Electronic Transactions
    Act that clarified the use of blockchain technology, including smart contracts,
    in commercial transactions. The new law has a declarative character, provides
    definitions of blockchain smart and recognizes them within the existing legal
    framework as another electronic form of commercial transacting, acknowledging
    their legal status, validity, and enforceability. The act defines a smart contract
    as an ‘event driven program, that runs on a decentralized, shared and replicated
    ledger that can take custody and transfer of assets on that ledger’. Tennessee
    passed and similar legislation in March 2018 (Bill SS 1662)⁸⁰ to provide legal
    recognition to smart contracts in the marketplace. Tennessee’s acknowledges that
    smart contracts are valid and enforceable under state law, ‘may exist in commerce’
    and cannot be denied legal effect, validity, or enforceability. Both Arizona’s
    and Tennessee’s blockchain laws incorporate smart contracts into existing legal
    frameworks governing electronic signatures and contract law. Also, the Arkansas
    legislation of 2019 (Bill HB 1944)⁸¹ and the North Dakota new bill (Bill 1045)
    largely follows Arizona’s and Tennessee’s law, and several other states are considering
    similar bills to facilitate the development of blockchain technology and recognition
    of smart contracts.


