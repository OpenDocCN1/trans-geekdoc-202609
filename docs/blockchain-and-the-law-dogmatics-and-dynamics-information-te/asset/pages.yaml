  md: 'unlike specific type of funds, virtual currencies are not expressed in traditional
    accounting units (e.g. Euro), but in virtual accounting units (e.g. Bitcoin).
    Those virtual currencies are not also “tangible property” (under article 14 of
    the VAT Directive) because its only purpose is to be a mean of payment. Since
    the type of exchange in question consisted of an exchange of different means of
    payment, the ECJ decided that it cannot be qualified as a “supply of good” and
    consequently it is instead a “supply of services”.


    Additionally, the ECJ decided that there is a consideration³⁵ in this supply of
    services because was direct link between the services provided and the consideration
    received by the taxable person, being irrelevant that this remuneration did not
    take the form of payment of a commission or the payment for expenses incurred
    (quoting The Case First National Bank of Chicago).³⁶


    Subsequently, the ECJ concluded that article 135(1)(d) of the VAT Directive (which
    exempts “transactions, including negotiation, concerning deposit and current accounts,
    payments, transfers, deques, and other negotiable instruments, but excluding debt
    collection”) was not applicable Bitcoin is a contractual mean of payment. However,
    it considered that the exemption provided by article 135(1)(e) “transactions,
    including negotiation, concerning currency, bank notes and coins used as legal
