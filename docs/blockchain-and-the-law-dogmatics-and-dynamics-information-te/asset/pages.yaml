  md: 'Lastly, the Hedquist case, ECJ concluded the sale of bitcoins was a supply
    of services exempt by article 135(1)(e) of the VAT Directive, although they are
    not money since virtual and traditional currency should have the same treatment
    for the purposes of exemption. Following this case, the Portuguese TA considered
    that the sale of cryptocurrencies was also exempt under Article 9(27)(d) of the
    VAT Code. Finally, also in the same case, the Portuguese TA Committee that mining
    would benefit from the same exemption. However, as shown by the VAT Committee
    (and the position of Other Member States), from that it is possible to conclude
    that mining is out of VAT scope, exempt under article 135(1)(e) or even under
    article 135(1)(d). Therefore, in VAT there are some uncertainties on many activities
    related to crypto-assets.


    # 4.7 Afterword43


    Since the last revision of the chapter, several relevant developments occurred
    that we believe to be highlighted. The first is the significant impact that the
    Portuguese Budget State Law for 202344 had on the taxation of crypto-assets. The
    legislator, taking into consideration the principles of tax legality and legal
    certainty in the context of crypto-assets, decided to create specific tax rules
    for crypto-assets45


    In this line, the PIT Code now has a definition of crypto-assets: "any digital
    representation of value or rights that may be transferred or stored electronically
    using distributed ledger or similar technology." This concept does not include
    unique crypto-assets that are not fungible with other crypto-assets, i.e., Non-Fungible
    Tokens (NFT).46 The legislator also clarified that 24 of the PIT Code applies,
    i.e., the cash equivalence of crypto-assets follows the same rules already established
    for income in kind (v. Sect. 4.4 supra).


    Another relevant amendment to PIT Code article 10(1)(k) of PIT Code now the new
    regime in case of sale of cryptocurrencies and other crypto-assets qualifies the
    onerous transfer of crypto-assets (that are not securities)47 in schedule G (capital
    gains), provided that it occurs outside the scope of a business activity or professional
    (case which Schedule B applies). The capital gain is subject to a tax rate of
    28%, with the option for the general tax rates. However, gains and losses arising
    from the sale of crypto-assets (that are not securities) are held for at 365


