    # 6.2 What is the DLT Pilot Regime?


    The DLT Pilot Regime allows market infrastructures using distributed ledger technologies
    to be temporarily exempted from certain specific requirements under European Union
    financial legislation that might otherwise prevent them from developing solutions
    for the trading and settlement transactions in crypto-assets that qualify as financial
    instruments.


    Additionally, it is an optional regime, not preventing financial market structures,
    such as multilateral trading facilities (MTFs), organized trading facilities (OTFs),
    central securities depositories (CSDs) and central counterparties (CCPs), from
    carrying out trading and post-trading activities for crypto-assets that qualify
    as financial instruments under EU financial legislation. The DLT Pilot Regime
    also allows ESMA and competent authorities to gain experience on the specific
    opportunities and risks of distributed ledger technologies in the trading and
    post-trading services.


    The scope of the DLT Pilot Regime is limited to the conditions applicable to the
    operation of market infrastructures based on DLT, the authorizations for their
    use and the supervision and coordination of competent authorities and ESMA. In
    terms of a subjective matter, the Regulation applies to investment firms, market
    operators and CSDs.


    Only such entities may operate DLT market infrastructures, with one important
    exception: entrants. It was determined that access to the DLT Pilot Regime should
    not be limited to incumbents, so that an entity that is not authorized under Regulation
    (EU) No 909/2014 may apply for an authorization under that Regulation or Directive,
    respectively, and at the same time for a specific authorization under the DLT
    Pilot Regime—Articles 8(2), 9(2) and 10(2) of the DLT Pilot Regime.


    In such cases, the national competent authority should not assess whether that
    entity meets the requirements of Regulation (EU) No 909/2014 or Directive 2014/


    > 7 Specific authorizations and exemptions should be of a temporary nature, for
    a maximum period of six years from the date the specific authorization is granted
    and should only be for the duration of the DLT Pilot Regime—Articles 8(11) and
    9 (11) of the DLT Pilot Regime.'
