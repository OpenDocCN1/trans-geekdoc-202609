    process has the potential to mitigate these concerns, with solutions such as biometric
    identification, blockchain technology, and other security measures that can help
    ensure the accuracy and integrity of the votes. While the prevalence of ballot
    stuffing¹¹³ and impersonating voters¹⁵ must also be considered.


    Another major concern associated with the use of technology in elections is voter
    suppression. Efforts to systematically discourage certain groups of people from
    voting, often targeting marginalized populations, can undermine the legitimacy
    of election results and weaken the democratic process. While technology can be
    used to increase access to voting, such as mobile voting or online voting, it
    also raises concerns about security and potential manipulation, making it essential
    to strike a balance between accessibility and security.


    Finally, the use of technology in elections has also raised concerns about external
