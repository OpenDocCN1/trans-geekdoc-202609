    issued by central banks (Central Bank Digital Currencies or CBDCs). To be noted,
    however, is that all those activities, although they could use blockchain or DLT-based
    solutions, do not necessarily need to. This includes CBDC, which can be issued
    and managed through blockchain-type solutions, traditional methods, or a combination
    thereof. In this chapter we discuss the topic of CBDC, what it is and its implications
    with a particular emphasis on anonymity—an aspect that we believe will be of the
    utmost importance when in the implementation of CBDC by central banks around the
    world, in particular when, and if, central banks from major and developing economies
    move forward with CBDC solutions.


    **Keywords** Blockchain · Central Bank · Digital currency · CBDC · Crypto


    # # 7.1 Introduction


    CBDC is the topic of the day. Central banks’ interest and public interventions
    on CBDCs have turned more positive since late 2018, with a rapid increase starting
    in the second half of 2020 and the first quarter of 2021. Although Covid-19 brought
    many challenges for central banks and governments around the world, some opportunities
    were also identified, such as a decline in the use of cash for payments and consumers
    shifting from physical to digital payments, thus adding new motions and opportunities
    for CBDC implementation.


    The widely accepted definition is that *CBDC is central bank-issued digital money
    in the nominal unit of account, and it represents a liability of the central bank.*
    CBDC can be “retail” (i.e. for general purpose), or “wholesale”, for restricted
    access by financial institutions. The main prominent difference between CBDC and
    cash, is the form. CBDC comes in a digital form, unlike cash which comes in physical
    coins and banknotes.


    According to the results of the Third Bank for International Settlements (BIS)
    survey on central bank digital currency, there are several motivations or policy
    goals for central banks to consider issuing a retail CBDC. These include financial
    stability, monetary policy implementation and financial inclusion as well as payments
    efficiency and safety. Not all jurisdictions give the same weight to each of these
    motivations, which is related to their economic environment and characteristics
    of the market. For example, developing economies prioritize financial inclusion
    and consider the implementation of CBDC as a possible solution for this aim. Nevertheless,
    domestic efficiency and payments safety remain at the heart of both advanced and
    developing economies’ motions for issuing general purpose CBDC. preserving financial
    stability and supporting monetary policy, although


