    # 6.3.2 DeFi Categories


    This sub-chapter aims to describe the current major applications of DeFi. There
    are categories termed “stablecoins” and “derivatives”, which formally refer to
    the representation of a particular instrument; however, the scope of this sub-chapter
    is to determine the applications at a protocol level. As a result, those terms
    are merely used for technical ease of reference.²⁶


    Currently, DeFi has seven major classes:²⁷


    +   IV. Stablecoins: Stablecoins are crypto-assets that typically transact on
    a distributed ledger or rely on cryptographic validation techniques to maintain,
    to achieve stable value relative to crypto currencies. In principle, stablecoins
    allow users to protect the nominal value of their holdings.²⁸

    amentally, there are three types of stablecoins: fiat-backed stablecoins, asset-backed
    stablecoins, and algorithmic stablecoins.


    +   V. Fiat-backed stablecoins aim to maintain a stable value by being collateralized
    by the fiat currency that they represent.²⁹


    +   VI. Asset-backed stablecoins aim to maintain a stable value via collateralization
    of several fiat currencies, one or more commodities, other crypto-assets, or a
    basket of such assets.¹⁰


    +   VII. Algorithmic stablecoins aim to maintain a stable value via inbuilt stabilization
    functions that provide for the increase or decrease of the supply of such crypto-assets
    in response to changes in demand.¹¹¹


    Decentralized stablecoins (b., c.) aim to solve the trust issue that may arise
    from fiat-backed stablecoins (a). Ideally, decentralized stablecoins are created
    in a decentralized manner via over-collateralization or algorithmic method, operate
    fully on decentralized ledgers, are governed by decentralized autonomous organizations,
    and anyone can publish their reserves. Thus, one can conclude that the core components
    of a decentralized stablecoin are as follows:¹²


    +   Collateral: This is the primary value for a stablecoin. The collateral can
    be exogenous and primarily used in protocols; endogenous, where


