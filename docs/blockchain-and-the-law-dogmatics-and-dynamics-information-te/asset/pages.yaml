    to peer-to-peer lending since the crypto-assets are not directly lent between
    individual agents but are borrowed against smart contract reserves: crypto-funds
    aggregated and pooled together lending agents.


    Due to the nature of DeFi and blockchain, where borrowers are pseudo-anonymous,
    there are no mechanisms to identify the agent, access their credit score and ability
    to repay the loan, or enforce any legal changes against default. To prevent borrowers
    from defaulting on their debt obligation and creating a credit risk for the loaners,
    borrowers must collateralize their position to cover the debt value. Due to the
    historical volatility and illiquidity of various crypto-assets, overcollateralization
    is required. If the underlying collateral price crashes, it will affect the lending
    funds since sufficient collateral would cover the borrower''s debt value. The
    debt is usually issued above USD or stablecoins representing USD.


    The borrower must ensure that the collateral is always above a predetermined liquidation
    threshold set by the protocol, or the "liquidators" can purchase the locked collateral
    at a discount and close the borrower''s debt position.33


