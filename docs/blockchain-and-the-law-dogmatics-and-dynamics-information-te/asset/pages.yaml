    in governments.


    #  3.3.4 Reparations


    Another essential pillar in TJ is reparations. It is not only presented in sever-national
    norms but also is an international principle by the UN General

    Assembly by Resolution 60/147 of 2006.75 Awarding reparations to victims of gross

    violations is one of the core principles of TJ and international law should and
    uphold such a pillar,

    as well as the perpetrator''s responsibility to repair its victims.76 Therefore,
    States\and individuals should be responsible for their actions or omissions and
    the harm

    they have caused.


    Some types of reparations can be linked to the other pillars. In any case, repa-tions
    should always be proportional to the harm suffered. The different types of

    parations are: restitution (of the victim''s previous conditions), compensation
    (of

    e economically assessable damage suffered by the victim), rehabilitation (relating

    to any medical and psychological problems that the victim may have as a result
    of the

    harm caused), satisfaction (in the form of truth-seeking, memorialization, an
    official

    apology, or juridical administrative sanctions) and guarantees of non-repetition


