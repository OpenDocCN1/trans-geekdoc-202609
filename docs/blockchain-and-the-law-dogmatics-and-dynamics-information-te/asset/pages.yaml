    ²² Ibid.

    ²³ Madir 2018, p. 2.

    ²⁴ Smart Contracts Alliance 2018.

    ²⁵ McKinney et al. 2018.

    ²⁶ Ibid at 321.

    ²⁷ Ibid at 322.

    ²⁸ Ibid at 323.'
