- pgno: 15
  md: '# 1.1 Introduction


    In the first quarter of 2021, Bitcoin, Ethereum, and almost every other crypto
    posted new all-time prices in what was seen as the beginning of a new bull market.
    Enthusiasts lauded the rise and attributed it to the growing adoption of crypto
    and blockchain protocols by corporations and investors alike from the whole economic
    spectrum: corporations like Tesla and Micro Strategy, traditional legacy players
    such as banks, and even States as Ethiopia. Roughly four years after the last
    bull market and the end of the "hype cycle" of blockchain, 2021 seemed poised
    to be the year when the technology would to succeed. According to proponents,
    its success would herald a new era of digitalization of transfers¹


    Ironically, another crypto-related phenomenon peaked during those years of the
    bear market (roughly the beginning of 2018 and the end of 2020, if one is to draw
    the correct historical lines). The rise of the crypto-economy led to a lively
    and intense strand of publishing and research on all things crypto and blockchain.
    Legal academia was no exception. There were countless articles and books, thesis
    (master’s and Ph.D. level), reports and working papers published on the market
    Large and significantly participated blockchain conferences were organized, and
    research projects implemented, associations built, and courses opened at major
    universities. In just about three years, the topic of blockchain and the law surfed
    the wave of the phenomenon and had a significant boom, becoming an autonomous
    strand of legal tech and research.


    It is typical for lawyers and law researchers to hop in the wagon of technological
    developments whenever something seemed sufficiently innovative to bring profound
    changes to how people interact. However, no one could have predicted the quick
    and intense growth of the area of the studies of blockchain and the law. Legal
    scholars recognized blockchain enthusiasts, launching themselves in adopting and
    researching this new technology and new form of economy, organization, and community-building.
    Blockchain and distributed ledger technologies seemed to herald a new era of social
    disruption based on solid and provocative concepts such as decentralization, smart
    contracts, and digital money. Despite adoption being slow, the promise of blockchain
    to digitalize value and its allure was so appellative that two of the most prominent
    authors of the movement decided to coin a term to describe the new form of law
    that would deal with the developments of blockchain technology – developments
    that, according to said authors, "traditional" law could not answer. "Lex cryptographical"
    was to be the new, "revolutionary"


    +    2021; Spilka 2021.

    ² The main books would be De Filippi and Wright 2018; Fink 2018; Magnussen 2020;
    Hacker et al 2019 and Fox and Green 2019.

    ³ Stanford Journal of Blockchain Law and Policy, https://stanford-jblp.pubpub.org/,
    accessed 31 October 2022.\⁴ The EU Blockchain Observatory and Forum, https://www.eublockochainforum.eu/,
    accessed 31 October 2022.'
