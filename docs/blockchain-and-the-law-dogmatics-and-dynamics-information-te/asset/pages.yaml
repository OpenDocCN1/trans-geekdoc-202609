    under analysis was about gains obtained with the purchase and sale of virtual
    currency units or exchange at the exchange rate of cryptocurrency by fiat currency
    (whatever it may be). The generated by this activity could, in theory, be integrated
    into three different schedules of income: G (capital gains), E (capital income)
    or B (business or professional income).


    # 4.4.3 Capital Gains?


    The TA analyzed whether this income could be considered capital gains under article
    10 of the PIT Code (noting that it entails a closed typification), putting the
    following hypotheses:


    +   * The TA considered that this is not disposal of shares neither the cryptocurrencies
    confers right to any amount;

    * It is also not a derivative product, as its valuation is not based on any underlying
    asset;

    * Finally, it defended that cryptocurrencies are not securities since they cannot
    be subsumed at this time to article 1 of the Securities Code.25


    However, one may question if some crypto-assets could be qualified as atypical
