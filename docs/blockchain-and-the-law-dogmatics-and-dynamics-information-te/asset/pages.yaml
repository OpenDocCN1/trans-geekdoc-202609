    # ## 3.3.1 Truth Commissions


    A Truth Commissions (TC) or Truth and Reconciliation Commissions (TRC) deals with
    the pursuit of truth in a non-judicial way, which is one of the principal elements
    when dealing with past atrocities. According to “Truth Seeking,” a publication
    by the International Center for Transitional Justice (ICTJ),³⁷ the importance
    of truth rules on the healing process, restoring the dignity of victims and combating
    impunity and public denial. From this perspective, TCs play an essential role
    in psychological healing, investigative work and addressing issues that emerge
    from conflicts.


    TCs are usually constituted by an executive decree or by law and take consideration
    the specific characteristics of each country’s situation.³⁸ However, three objectives
    of truth are fundamental³⁹ to investigate and clarify the violent events that
    have occurred and those that are denied or disputed, insisting the socio-economic
    context that gives rise to the events; adopt a victim-centered approach, protecting
    and empowering victims to overcome the problems suffered, and the preparation
    of a final report detailing the causes of conflict and recommendations to avoid
    repetition. TCs do not have the power to prosecute perpetrators; its investigations
    can be used in criminal tribunals for that purpose by working alongside judicial
    organs.⁴⁰


    Such an essential de organism of TJ has specific characteristics and considerations
    that must be observed to be as effective as possible.⁴¹ Truth commissions must
    be transparent and legitimate in the eyes of civil society as well as ensure the
    participation of nations in their procedures. They also must be independent, especially
    from the State, in all forms (economically, personnel, management) to avoid interference
    from third parties and maintain their credibility.


    Truth Commissions can also be Truth and Reconciliation Commissions (TRC), which
    also pursue reconciliation. Some undoubtedly understand TRC as one that does not
    seek the truth of past abuses but understands the role of reconciliation in such
    contexts. Reconciliation works adds another layer of challenge, which is why only
    truth commissions have added the notion of reconciliation to their name and approach,
    the most well-known example being the South African TRC.⁴²


    Notwithstanding the above, it is also important to mention unofficial truth projects
    (UTPs). Such projects resemble TCs in that they promote the historical


