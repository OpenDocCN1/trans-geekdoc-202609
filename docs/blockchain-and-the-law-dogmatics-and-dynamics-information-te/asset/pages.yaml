    # 4.5.4 Mining


    The last ruling on these matters was on remuneration with cryptocurrency through
    mining.39 The TA noted that mining qualifies as a blockchain transaction organized
    with cryptocurrency, but the activity is not provided to anyone in particular.
    Based on the Hedqvist Case, the TA concluded that the exchange of cryptocurrency
    for “real” currency (i.e., fiat currency) is an onerous service, subject exempt
    from VAT (article 9(27)(d) of the VAT Code), and so it is the remuneration in
    cryptocurrency, given that it is a contractual means of payment. Further, regarding
    the location of operations, and since the question was made not only to individualize
