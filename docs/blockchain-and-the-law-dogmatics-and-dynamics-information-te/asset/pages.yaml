    Source The Author<sup>42</sup>


    # 4.6 Conclusions


    In the crypto-assets context, one should note the importance of the principle
    of tax legality if the facts do not fulfil the predictability of statutory law,
    there is no taxable event (the taxpayer is not subject to tax). The principle
    of legal certainty is also relevant, especially in new and complex areas. Binding
    rulings by the Portuguese TA are an important instrument to any taxpayer who clarify
    the interpretation of tax law. They are publicly known, which brings legal certainty
    to taxpayers, through the unpredictability of the TA behavior. However, the TA
    is only bound on those facts and to the taxpayer who submitted the request.


    A taxpayer under the CIT Code may obtain several sorts of income with crypto-assets
    and all of them for its taxable profit since those activities are economic operations
    of a business nature and then perfectly covered by the CIT Code, namely its article
    3. Still, as the OCC noted, the accounting income should consider the accounting
    standards, namely the IFRIC updates.


    In the case of natural persons, income from crypto-assets is taxed by the PIT
    Code only if we fit it into one of the six schedules of income. The TA concluded
    that income resulting from the sale of cryptocurrencies is not capital gains because
    they not securities. Still, one may question whether some crypto-assets are atypical
    securities under article 1(g) of the Securities Code. TA''s interpretation gives
    more legal certainty because there is no need of caustic analysis. Still, in light
    of the CMVM communication and considering that the wording used by the TA is “at
    this time”, it is no indication that the TA changes its position. There is no
    indication that it is going to happen. Instead, the TA concluded that the sale
    of crypto-currency is not taxable by the Portuguese tax system unless its regularity
    constitutes a professional or business activity of the taxpayer, in case it will
    be treated as business or professional income. Additionally, considering that
    the income of any schedule can be paid in cash or in kind, if a PIT income is
    paid with crypto-assets, we should apply article 24 of the same Code, which provides
    successive rules for cash equivalence for income in kind.


    > 42 Based on June 2018.'
