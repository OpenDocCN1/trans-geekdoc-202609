    So far, I have not touched on tokens and cryptocurrencies. The Bitcoin protocol
    generated, as an incentive, its token: a digital representation of value stored
    in a user''s wallet and registered in the protocol. The token''s purpose was to
    be used as a payment mechanism, and hence; all protocol tokens (stored through
    cryptographic means) were called cryptocurrencies. In the crypto world, the token
    serves two functions: an economic incentive for the decentralized consensus mechanism
    to work and a product—in other words, as the element that makes the protocol valuable.


    The value of Bitcoin comes from its as a currency—payment mechanism, story of
    value or unit of account (the jury is still out for which is Bitcoin better equipped
    to handle). However, other tokens have different uses. For example, Ether is used
    for storage space and transaction fees in the Ethereum network; Filecoin enables
    users to store data in the Filecoin protocol; Tezos enables holders to vote on
    the protocol''s governance; Ada, when staked with a pool, generates dividends
    for its holders. Some tokens represent assets that are used as collateral or issued
    through public offerings. In short: tokens represent different value types, such
    as rights, agreements, property... To consider them as currencies is inadequate,
    the preferred being crypto assets, given the multiplicity of utilities they can
    have.


    Nevertheless, market practice has divided tokens in terms of function. This division
    has subsequently been adopted by public institutions, including EU regulators,
    in enacting the Market in Crypto Assets Regulation (MiCA).^24 The classic functional
    division is between tokens (resembling securities), recovery tokens (resembling
    securities), and utility tokens (basically the). The classification is somewhat
    simplistic and too artificial, for there are tokens that can fit more than one
    category. For example, a token created to function as a currency, but providing
    dividends when staked, is (or should be considered) just a currency token. Is
    a utility token issued through a public offering just a utility token? These categories
    were illustration purposes when the market was beginning to appear in 2017; in
    2021, with some protocols working in full force and more users using decentralized
    finance (DeFi) protocols and tokens, it seems complicated to sustain such classification.^25


    Tokens are, arguably the most known fact of the blockchain phenomenon. They are
    the central pieces for the functioning of the protocols and have become an easy
    source of liquidity. Tokens can be exchanged in between, with people with minimum
    or no intervention from intermediaries, reducing transaction costs. Nevertheless,
    despite their functionality, they have a speculative tendency, generating a kind
    of (and less sophisticated) financial market that is still beginning to attract
    other more traditional institutional players such as banks and corporations. Another
    critical factor of the crypto market (and another ironic twist on the decentralization
    promise of DLT) is that several entities of the token economy are centrally managed
    (such as example, wallet providers, exchanges, and custodians).


