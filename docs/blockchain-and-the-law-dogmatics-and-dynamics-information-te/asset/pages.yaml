    # 7.4 Major Legal Implications of CBDC Implementation


    The more central banks advance with their CBDC implementation projects, the more
    questions and doubts arise related to legal and regulatory implications. This
    is due to the fact that CBDC is not just a technical project, whose successful
    implementation relies solely on technological issues. Beside the policy and political
    issues which may arise, and vary from jurisdiction, a careful assessment of legislative
    acts should be undertaken. Central banks laws and monetary laws as commercial
    banks laws, taxes, private laws, payment systems and services laws, data protection
    laws, AML/CFT laws also could be subject to evaluation and probably revision.^23
    Below in the following sections we provide a quick overview of two probable legal
    implications of CBDC implementation: the difference between central bank money
    and private money, and the legal tender characteristic of central bank money and
    how such would be applied to CBDC.


