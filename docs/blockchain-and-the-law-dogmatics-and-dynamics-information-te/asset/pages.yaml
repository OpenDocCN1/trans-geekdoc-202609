    The taxable basis depends on the type of person, under article 3 of the CIT Code,
    but for entities under (i) that are primarily engaged in a commercial, industrial
    or agricultural activity¹⁶ CIT is levied on profit (which consists of the difference
    between the net assets at the end and the beginning of the tax period, with the
    corrections established in that Code).


    Article 4 of the Code establishes that for legal persons and other entities with
    head office or effective management in Portuguese territory, the CIT is levied
    on the totality of their income, including that obtained outside that territory
    (worldwide income principle) while for those without head office effective management
    in Portuguese territory the CIT is only levied on income obtained therein (territorial
    source principle). The general CIT tax rate is 21% and there is a reduced tax
    rate of 17% to Small and Medium-Sized Enterprises for a taxable basis until €
    25,000 (v. article 87(1) and (2) of the CIT Code).


    # 4.3.2 Profits with Crypto-assets and the Importance of the Accounting Perspective


    A taxable person under the CIT Code may obtain several sorts of income with crypto-assets
    that may contribute to its taxable profit. For instance, it may obtain gains from
    sales of crypto-assets, obtain income derived from the sale of products or services
    that cover the crypto-asset industry or de-ify or it may mine them. In all these
    cases, the taxation under the CIT Code is exactly the same that it would be if
    the taxable person obtained income with producing and selling chairs, render image
    consulting services or any other business activity since those activities are
    economic operations of a business nature and then perfectly covered by the CIT
    Code, namely its article 3.


    > ¹⁵ E-g., estates, invalid legal persons, associations and civil companies without
    legal personality and commercial companies or civil companies in commercial form,
    prior to definitive registration.


    > ¹⁶ Defined by article 3(4) of the CIT Code as all activities consisting of carrying
    out business-related economic operations, including the provision of services.'
