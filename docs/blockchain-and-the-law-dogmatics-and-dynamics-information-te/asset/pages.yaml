  md: 'One of the principal characteristics of blockchain technology is to ensure
    economic inclusivity for unbanked people⁸² and victims of the financial economy,
    making it easy to effect payments for victims, refugees and displaced people⁸³
    Due to blockchain specificities, transactions have a smaller cost, which will
    enable the increase of national and international remittances, enabling victims
    or victims'' families to send and receive money from the programs, without extra
    cost hustles. Including victims in such a financial system would increase their
    sense of empowerment, within their own societies, since financial independence
    from other members of society can be achieved, especially among women, who are
    often financially dependent.


    Regarding identification and access to reparations programs, blockchain technology
    can store victims'' identifications via digital IDs, and use biometric identification
    systems (e.g., digital and iris scans)⁸⁴ in places where smartphones or internet
    access is scarce. With digital identification, victims can be easily identified,
    which gives them access to essential health and education services that usually
    require some form of identification. Also, it would help to improve government
    data in the transport delivery of public services and measure the development
    progress of a specific community accurately. One project is Building Blocks by
    the World Food Programme (WFP)⁸⁵ in association with the Syrian refugee camps
    in Jordan and Pakistan.


    A system like this could be integrated into a worldwide donation program based
    on cryptocurrency, which would make it possible for anyone to donate to reparations
    programs. Management of such an infrastructure can be done by the ICC, via the
    TFV (Trust Fund for Victims) and States. An international approach to deliver
    reparations could be a positive solution to help States afford measures.


    Reparations management is expensive for governments⁸⁷ due to the operating costs
    involved in reparations delivery. Blockchain technology could reduce costs by
    configuring a smart contract linked to each victim''s public key and triggered
    by oracles. In compensation reparations, for example, the amount can be satisfactorily
    transferred to each victim. Smart contracts can be programmed to transfer a specific
    amount at specified intervals for a specific duration to each victim. Smart contracts
    can be used as a tool of control and ensure that no corruption occurs, since the
    program works automatically without external intervention.


    ⁸² Maupin 2017.


    ⁸³ Rella 2019.


