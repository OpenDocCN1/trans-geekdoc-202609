    This chapter considers conventional methods available to a successful litigant
    under South African law (Sect. 5.2). It then considers the concept and attributes
    of execution on the blockchain (Sect. 5.3), as well as two possible use cases
    of blockchain execution applied in a South African context and possible impediments
