    the purchaser''s acceptance, and the moment the match takes place the transaction
    is self-executed by means of the shares being transferred to the purchaser''s
    brokerage account and the seller''s brokerage account being credited with the
    proceeds.


    An important feature of smart contracts for purposes of the present argument is
    that they are built on a blockchain protocol.³29 The advantage of this is that
    the transactions recorded on the blockchain for purposes of executing smart contracts,
    cannot be altered.³30 Further, once implemented, a smart transaction cannot be
    halted or reversed (i.e., it is immutable).31


    Smart contracts can be used for allocating digital currency between two parties
    upon the requirements of the contract being fulfilled.³32


    The smart contract, (i.e., the execution of its code) can be triggered with reference
    to specified and third party ‘off chain’ information, making use of blockchain
    ‘oracles’. Oracles are entities that connect blockchains to systems external to
    the blockchain, enabling smart contracts to execute based upon inputs from the
    real world.³33


