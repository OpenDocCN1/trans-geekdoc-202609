    Figure 6.1 Scattering model.


    Therefore, A and t(x) values are estimated first from which J(x) can be easily
    calculated [5].


    The transmission map for a homogenous haze is given by:


    t(x) = e^{-βd} (6.2)


    Here, d is the scene depth and β is the scattering coefficient. Scene radiance
    can be recovered by [6]:


    J(x) = (I(x) - A) / t(x) + A (6.3)


    # 6.3 Different Techniques of Single-Image Dehazing


    # 6.3.1 Contrast Enhancement


    A hazy scene has a lower contrast compared to haze-free images due to bad weather
    [7]. To increase the contrast of the scene histogram, equalization is applied
    [8]. However, this technique does not consider object depth proportional to haze
    thickness, which differs locally. To increase the contrast of the hazy scene,
    fast Fourier transform and dark channel prior (DCP) are applied to estimate the
    transmission value instead of the bilateral filter [9]. Wavelength compensation
    techniques are applied to underwater images,'
  merge: -1
