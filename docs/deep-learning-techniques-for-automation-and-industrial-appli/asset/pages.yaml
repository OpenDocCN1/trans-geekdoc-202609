  md: '# Fruit Leaf Classification Using Transfer Learning Techniques


    Taha Siddiqui*, Surbhit Chopra and Mamta Arora


    Department of Computer Science and Technology (CST), Manav Rachna University,
    Faridabad, India


    # Abstract


    Approximately 60% of India’s provincial families rely on horticulture for their
    living expenses, and India has a reputation of having the second-largest agricultural
    area in the world. Forty-two percent of the most important food crops are produced
    from crops that could be catastrophically or chronically damaged. Due to advancements
    in deep learning methods, we can minimize this rate to a great extent. In this
    research chapter, we have applied various deep learning and transfer learning
    methods to accurately predict the disease of damaged plants so that we can cure
    them at the initial stage. The models are trained on the image dataset, which
    contains various categories of plants like mango and pomegranate. The results
    show that ResNet outperformed Inception, VGG19, and CNN by giving an accuracy
    of 88% and 87.5% for pomegranate and mango, respectively.


    Keywords: Deep learning, transfer learning, leaf disease detection, image preprocessing


    # 3.1 Introduction


    Plant infections harm agricultural production and if they are not identified on
    time, meal insecurity may rise, especially the primary crops, such as mango and
    pomegranate, which are crucial as agricultural output becomes part of people’s
    food supply. Effective plant disease prevention


    *Corresponding author: studies.tahasiddiqui@gmail.com'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'and management start with early warning and forecasting. They are essential
    to how agricultural manufacturing is managed and how decisions are made. However,
    the essential methodology for plant disease detection in parts of underdeveloped
    countries remains a process still conducted through visual observations by trained
    manufacturers. This requires ongoing professional supervision, which may be prohibitively
    expensive in agricultural production. Additionally, in certain distant areas,
    farmers may have to move from place to place to reach experts, making discussions
    expensive and time-consuming. The goal of leaf detection is to recognize and extract
    data on the health, growth, and yield potential of plants and crops from photographs
    of plants and crops using computer vision and machine learning algorithms. Decisions
    about crop management practices, such as pest control, fertilization, and irrigation,
    can be made using this knowledge. Large databases of plant and crop photos can
    be analyzed to find patterns and signs of disease using machine learning and artificial
    intelligence techniques. This can help with early and accurate disease identification,
    which can result in quicker, more efficient care of the condition and more effective
    preventive measures.


    Plant and agricultural disease detection has a variety of applications in agriculture,
    including disease control, yield improvement, and sustainable farming. The need
    for effective and sustainable food production is driving growth in research and
    development in the field of disease detection. One of the most effective ways
    to forecast and classify crop diseases is by collecting photos of crop development
    and creating a detection model. This can increase the efficacy of disease management
    and decrease agricultural losses brought on by diseases, while also providing
    timely and effective early warning and intervention for agricultural output.


    However, this technology cannot be fully extended and can only be used in small
    spaces. Computerized plant disease detection is an important research area because
    it might be useful in monitoring vast fields of crops, and accordingly, automatically
    detecting disease symptoms as early as possible. One of the direct challenges
    to food security is plant disease. Up to USD 250 billion is lost each year due
    to diseases and insect pests in agriculture worldwide. By 2021, 400 million hectares
    of China would be afflicted by serious plant diseases and insect infestations.
    The candidate region-based detection approach has poor real-time performance and
    significant computational effort, although it has reasonably good accuracy. To
    ensure quick and effective identification, researchers have devised a single-stage
    target detection technique [1–3].'
