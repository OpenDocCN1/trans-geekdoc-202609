- pgno: 20
  md: '# Text Extraction from Images Using Tesseract


    Santosh Kumar*, Nilesh Kumar Sharma, Mridul Sharma and Nikita Agrawal


    Department of Computer Science, Global Institute of Technology, Jaipur, India


    # Abstract


    Images play a crucial role in describing, representing, and conveying information,
    which are essential in many businesses and organizations. Text extraction from
    images is the method used to convert text to plain text. Text extraction refers
    to the systematic procedure used for converting textual material into a simplified
    plain text format. The task at hand presents a significant difficulty as a result
    of the many changes in variables such as the size, orientation, and alignment
    of the text. Furthermore, the inclusion of low-resolution, pixelated pictures,
    coupled with the existence of noisy backgrounds, exacerbates the complexity associated
    with the process of text extraction. Using the Tesseract OCR engine, we aim to
    reduce these issues in this project.


    Tesseract is developed by Google and is an open-source optical character recognition
    (OCR) engine. OCR technology allows computers to recognize text in images, making
    it possible to convert images of text into machine-readable text. Tesseract has
    been trained in a wide variety of languages and scripts, including English, Chinese,
    and Arabic.


    Tesseract can process images that are rotated, tilted, or skewed and can recognize
    text written in different scripts, such as English and Arabic. It uses machine
    learning algorithms to improve its recognition accuracy over time, making it suitable
    for use in a wide range of applications, including document scanning, archiving,
    and indexing.


    Keywords: Text extraction, LSTM, image text, OCR, Tesseract


    # 1.1 Introduction


    Text extraction, also known as optical character recognition (OCR), is the process
    of automatically extracting text from an image or scanned'
  merge: -1
  img_proc: true
- pgno: 21
  md: "document and converting it into machine-readable text that can be used for\
    \ indexing, searching, editing, or storing the document.\n\nOCR software uses\
    \ advanced algorithms and machine learning techniques to identify and recognize\
    \ characters and words within the document. The process of text extraction typically\
    \ involves the following steps:\n\n+   (a) **Pre-processing:** In this step, the\
    \ image or scanned document is prepared for OCR by optimizing its quality. Techniques\
    \ such as noise reduction, image enhancement, and contrast adjustment are used\
    \ to improve image readability and reduce errors during OCR.\n+   \n+   (b) **Layout\
    \ analysis:** The OCR software analyzes the layout of the document to identify\
    \ the text areas, headings, and other features.\n+   \n+   (c) **Optical character\
    \ recognition:** In this step, the OCR software reads and recognizes the characters\
    \ in the document and translates them into machine-readable text.\n+   \n+   (d)\
    \ **Post-processing:** In this step, the recognized text is refined to correct\
    \ errors and improve its accuracy. Techniques such as spell-checking, grammar\
    \ correction, and formatting are used to improve the quality of the output [1,\
    \ 2].\n\nUtilizing OCR software, such as Google’s open-source OCR engine Tesseract,\
    \ the aforementioned steps are possible. Tesseract uses advanced machine learning\
    \ techniques to improve its recognition accuracy over time and can recognize text\
    \ in multiple languages and scripts.\n\nThe following are the steps involved in\
    \ text extraction using OCR software:\n\n+   (a) Scanning or importing the image\
    \ or document to be processed\n+   \n+   (b) Preprocessing the image or document\
    \ by adjusting its quality, orientation, and size\n+   \n+   (c) Performing layout\
    \ analysis to identify the text areas, headings, and other features\n+   \n+ \
    \  (d) Running OCR on the document to extract the text\n+   \n+   (e) Post-processing\
    \ the recognized text to correct errors and improve its accuracy and formatting\n\
    +   \n+   (f) Saving the extracted text in a machine-readable format such as plain\
    \ text or a searchable PDF."
  merge: -1
  img_proc: true
