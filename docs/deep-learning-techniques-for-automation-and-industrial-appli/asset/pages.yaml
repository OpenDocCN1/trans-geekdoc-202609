- pgno: 123
  md: '![](img/0c56ac060cc6089fd33efc0e4aeb71a8_123_0.png)


    Figure 7.2 Process of HOG feature extraction.


    # 7.3.2.1 HOG-Based Individual Counting


    HOG is an object-detection technique [12]. It is used for defining the shape of
    any object by edge directions. By using HOG, the algorithm divides the image into
    cells, then it will calculate the histogram of the cells, and normalize the orientation
    of cells. Horizontally and vertically in both directions here, filtering is used
    for finding the gradients in an image.


    # 7.3.2.2 Haar-Based Individual Counting


    Basic Haar highlights are typically quicker and more effective than raw pixel
    representations [13]. A straightforward arrangement of Haar highlights contains
    square shapes. In the shape of a square, straightforward elements of Haar-like
    features are characterized with the distinction of pixels available on that image,
    it can be anywhere at any position in scale at the first picture. This modified
    list of capabilities is referred to as the ''2-square shape feature.''


    # 7.3.2.3 Combination of HOG and Haar


    ![](img/0c56ac060cc6089fd33efc0e4aeb71a8_123_1.png)


    When we combine these feature extraction techniques, i.e., HOG with less detection
    accuracy but fast computation and Haar with more accuracy and less speed, the
    results will be in the form of faster speed and more accuracy in the case of individual
    counting.'
