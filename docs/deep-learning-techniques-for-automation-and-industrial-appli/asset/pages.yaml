  md: 'increased accuracy on the ImageNet dataset, this work uses the pretrained EfficientNet-B0
    model only, rather than using the other variants, to keep the computational resources
    manageable.


    # 8.3  Experimental Results and Analysis


    All experiments are done with the help of Keras and TensorFlow libraries with
    GPU provided by the Kaggle online platform. The experiments are carried out on
    6,000 pairs of training and 1,000 pairs of validation images. Further testing
    is done on 3,000 pairs of images. XuNet is not a pretrained model; thus, in this
    work, it is trained for a large number of epochs with a mini-batch size of 64
    images. The same setting is used as described by the authors [20] for the initialization
    of the XuNet network. The authors in ref. [32] have discussed that in the mini-batches
    of training, cover and their corresponding stego images known as pair constraint
    (PC), can prove to be detrimental for network training in the last stages but
    may work better in the initial stages for convergence of the network. In this
    work, 100 epochs are used with the PC and a learning rate of 0.001 for XuNet.
    After that, images are shuffled in subsequent epochs to create mini-batches, and
    a mini-batch of size 64 is picked. Five hundred epochs are used to train XuNet
    with an initial learning rate of 0.001. The next 500 epochs are used with a learning
    rate of 0.0001.


    For pretrained models, 50 epochs are also used with the PC and a learning rate
    of 0.001. After that, 100 epochs are trained with shuffled images and a learning
    rate of 0.0001, and the last 100 epochs with shuffled images and a learning rate
    of 0.00001. These learning rate values are used by trying a few in every set of
    epochs. A lesser number of epochs than Xu-Net are used as these are pretrained
    models. Table 8.1 shows the experimental setup of the proposed work. Table 8.2
    shows the setup of pretrained models, and hyperparameter values are decided by
    trying a few values, dropout = 0.2, 0.3, and 0.4, are tried and the best dropout
    rate of 0.3 is picked.


    Table 8.3 shows the validation and testing accuracies for all the models used
    in this work. The best validation accuracy in the last 100 epochs is taken as
    the model’s validation accuracy, and the corresponding model weights are picked
    as the final weights of the model for testing. As shown in Table 8.3, it is clear
    that XuNet performed best, as it is created specifically for steganalysis. However,
    with lesser training than XuNet on steganalysis, ResNet-50 and EfficientNet-B0
    also performed well with 74.61% and 81.45% testing accuracies, respectively. VGGNet-16
    is the lowest performer for steganalysis. As this is a base study only, hyperparameter'
