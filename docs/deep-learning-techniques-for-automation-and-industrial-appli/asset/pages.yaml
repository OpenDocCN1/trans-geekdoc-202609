    # 1.4 Existing System


    The automatic conversion of text in an image into letter codes that can be used
    in computer and text-processing applications is known as offline handwriting recognition.
    This process captures a static representation of handwriting. Due to variations
    in handwriting styles, offline handwriting recognition is a challenging task.
    Currently, OCR engines primarily focus on machine-printed text, and Intelligent
    Character Recognition (ICR) on hand-printed text (written in capital letters).
    Charles et al. have presented a comprehensive review of various techniques used
    for the design of OCR systems. The paper discusses slow techniques that provide
    accurate results and fast techniques that provide inefficient results. Ray Kurzweil
    invented the first OCR software in 1974, allowing recognition of any font. This
    software utilized an advanced matrix method (pattern matching) to compare bitmaps
    of the template character with the bitmaps of the read character and determine
    the closest match [18–20].'
