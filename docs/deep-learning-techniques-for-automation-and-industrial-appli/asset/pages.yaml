- pgno: 24
  md: 'review, we will explore the current state of research in text extraction using
    Tesseract OCR [7].


    Tesseract OCR is an open-source OCR engine developed by Google that has gained
    popularity due to its accuracy and robustness. Several studies have been conducted
    to explore the effectiveness of Tesseract OCR in text extraction. One such study
    by Bhargava et al. (2020) compared the performance of Tesseract OCR with other
    popular OCR engines, such as Adobe Acrobat, ABBYY, FineReader, and OmniPage [8].
    The study found that Tesseract OCR outperformed other OCR engines in terms of
    accuracy, speed, and ease of use.


    In another study by Kumar et al. (2017), the authors proposed a novel method for
    text extraction using Tesseract OCR [9, 10]. The proposed method involved preprocessing
    the input image by applying various filters to enhance the quality of the image.
    The preprocessed image was then fed to the Tesseract OCR engine for text extraction.
    The results of the study showed that the proposed method improved the accuracy
    of text extraction significantly.


    Moreover, several studies have focused on improving the accuracy of Tesseract
    OCR through machine learning techniques. For instance, in a study by M. Alzahrani
    et al. (2020), the authors proposed a machine learning-based approach to improve
    the accuracy of Tesseract OCR in recognizing handwritten text. The approach involved
    training a support vector machine (SVM) classifier using a dataset of handwritten
    characters. The trained SVM was then used to classify the characters extracted
    by the Tesseract OCR engine. The results showed that the proposed approach significantly
    improved the accuracy of Tesseract OCR in recognizing handwritten text.


    Furthermore, a recent study by Bhargava et al. (2022) proposed a deep learning-based
    approach for text extraction using Tesseract OCR [11, 12]. The proposed approach
    involved training a convolutional neural network (CNN) using a dataset of images
    and corresponding ground truth text. The trained CNN was then used to preprocess
    the input image before feeding it to the Tesseract OCR engine for text extraction.
    The results of the study showed that the proposed approach outperformed traditional
    OCR engines in terms of accuracy and speed [13].


    In addition to improving the accuracy of Tesseract OCR, several studies have explored
    its applications in various industries. For instance, in a study by S. J. Alzahrani
    et al. (2018), the authors proposed a method for extracting text from bank statements
    using Tesseract OCR. The proposed method involved preprocessing the input image
    by removing noise and enhancing the quality of the image. The preprocessed image
    was then fed'
