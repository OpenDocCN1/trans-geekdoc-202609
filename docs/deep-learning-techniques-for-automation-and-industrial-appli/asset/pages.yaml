- pgno: 65
  md: '# 4.1 Introduction


    Nowadays, satellite images provide us with an edge to explore the Earth’s surface
    in detail, and this is considerably important for earth observations. The number
    of satellites has increased in recent times, thereby enabling a drastic increase
    in the amount of available data. There are two types of satellites available:
    active and passive. Active satellites are those that modify the signal before
    transmitting it by using transponders and amplifiers [11]. Passive satellites
    are those that transmit the signal without any modification [12]. A satellite
    image has three types of resolution: spatial, spectral, and temporal. The increase
    in the availability of satellite data has attracted researchers to work in the
    satellite image domain. In recent years, the challenge of satellite picture categorization
    has increased quickly [2–4]. Numerous types of classification and other tasks
    are being carried out, such as forest-type classification and land use, land cover,
    and urban area development. Traditionally, classification was done using normal
    classifiers such as random forests and SVM with the help of machine learning algorithms.
    All these traditional approaches lack performance, and the results are not satisfactory.
    Hence, recently, deep learning-based approaches have been explored by various
    researchers to work on satellite images. The major advantage of using machine
    learning and deep learning is that they provide significant results with fewer
    data points and blurry images compared to the traditional approach [10]. The deep
    learning-based approach uses convolutional networks for feature extraction, which
    can be further used for classifying satellite images. A convolutional neural network
    (CNN) is a deep neural network that is suitable for image processing.


    In the paper, we focused on satellite image classification using deep learning
    models and provided an experimental comparison of various deep learning models
    for the classification of satellite images. The goal of satellite image classification
    is to categorize satellite images into different semantic classes by looking at
    their layout and structural patterns. Deep learning-based algorithms extract information
    from images automatically and classify satellite images into various classes.


    This paper focuses on the classification of satellite images into 21 different
    classes, namely agricultural, airplane, baseball diamond, overpass, parking lot,
    beach, dense residential, forest, motorway, golf course, harbor, intersection,
    buildings, chaparral, medium residential, mobile home park, river, runway, sparse
    residential, storagetanks and tenniscourt. The models used in the experimentation
    are VGG, ResNet, Inception, Exception, EfficientNet, MobileNet, and NasNet. The
    UC Merced dataset has been used for the evaluation of these algorithms [1–9].'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 4.2 Motivation and Contribution


    Satellite data are rich in information. A single image consists of many information,
    such as geographical location (latitude and longitude) and their respective pixels.
    The machine learning models are good, but they lag behind in feature extraction,
    thus, resulting in poor performance. They do not give desirable results since
    satellite images contain much more information than ordinary images. Deep learning
    is more powerful than machine learning, but very few studies explore this kind
    of work in the satellite data field. Several models are present in deep learning
    models that can be used for satellite image classification, but picking the right
    model for the task is still a challenging problem. Therefore, in this paper, we
    compared different deep learning models applied to satellite data to determine
    which model performs best. We conducted a comparison of various deep learning
    models using the UC Merced dataset. A total of 30 models were trained, and this
    paper provides a detailed analysis to identify the best-performing models.


    # 4.2.1 Related Work


    In recent years, satellite images have become an emerging topic, and numerous
    algorithms have been proposed for the task, including the use of machine learning
    (ML) and data-driven approaches for satellite image classification. In recent
    past, it has been demonstrated that satellite images can be used to identify various
    objects on Earth. Various studies have been conducted on satellite images. A few
    of these are discussed below.


    Mahmon et al. stated that classification depends on several factors, such as data,
    the number of classes, and the algorithm used [13, 14]. This article also examined
    several strategies for the categorization of satellite images with artificial
    neural networks (ANNs) based on the value of accuracy measurement. This study
    approached the best strategies to classify land use and land cover using several
    approaches to classification techniques, and the comparison of these techniques
    was also confirmed with the data. The final output, a land use/land cover (LU/LC)
    map of the research region, may be used for a number of fields, including deforestation,
    archaeology, weather forecasting, urban planning, development, and damage assessment.


    Xia et al. [5] proposed a satellite image-based dataset for the classification
    of various objects. The dataset contained 10,000 images of different aerial scenes
    belonging to various classes, including airports, baseball fields, forests, meadows,
    parking lots, and more.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Bhargava et al. [22] emphasized that machine learning was not sufficient for
    the classification of various objects; only by using machine learning, the results
    were not up to the benchmark to solve this problem, and they put forward the use
    of deep learning-based techniques for this purpose. They proposed effective methods
    of satellite image classification based on deep learning using CNN for feature
    extraction and tested them on UC Merced, SIRI-WHU, and Corel-1K datasets with
    transfer learning and fine-tuning on ResNet50. This technique was able to achieve
    94% accuracy. In this research, a single model, which is ResNet50, was used and
    was fine-tuned for performance. Various models can also be used for the same problem
    statement.


    Luus et al. [7] proposed a multi-view deep learning-based system for land-use
    classification that was able to achieve 93% accuracy on UC Merced data, compared
    to the scale-invariant feature transform (SIFT)-based method which was able to
    achieve 85.37% and 90.26% in unsupervised feature learning. Deep learning performed
    better when compared to the traditional approach.


    Szegedy et al. [24] provided thorough assessments of current advances in satellite
    image scene classification, including benchmark datasets and cutting-edge methodologies.
    The authors then suggested a large-scale, publicly available dataset to enable
    the community to design, and by analyzing the constraints of existing datasets,
    propose and evaluate novel data-driven algorithms. Finally, using the suggested
    dataset, they assessed a variety of representative state-of-the-art approaches,
    including deep learning-based methods, and provided the results as a helpful performance
    benchmark for future studies.


    Andrew et al. [23] proposed that the network based on pre-trained ImageNet weights
    performs an important role in remote sensing scene classification. The model trained
    from scratch and the fine-tuned model trained on ImageNet have been compared,
    and there was a small gap between them. The models that were trained from scratch
    outperformed the models that were trained on ImageNet as feature extractors, but
    in most of the experiments, the results were in favor of the pre-trained model
    for high-resolution remote sensing images.


    Kumar et al. [25] noted that deep learning is a huge improvement in computer vision
    and also provides the best performance in noisy and low-quality data. To improve
    the performance and effectiveness of CNN, they proposed the use of feedback and
    recurrent features to improve the existing feed-forward CNN on satellite images
    for solar power plant classification.'
