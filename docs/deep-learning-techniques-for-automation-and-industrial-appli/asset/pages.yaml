    # 12.3.5.3   Architectures for Multiple Tasks


    The proportion of model parameters that are shared throughout roles and the feasibility
    of building and integrating both task-specific and shared modules are among the
    common factors that must be taken into account while designing a shared architecture.
    When evaluating designs for a given issue area, other factors come into play,
    such as how convolutional filters for certain vision tasks are divided into general
    and task-specific classes. Many of the MTL designs that have been developed strike
    a compromise between how much information is shared across tasks: A negative transfer
    caused by too much sharing may make joint multi-task models perform worse for
    each task than solo models, but a lack of sharing prevents the model from effectively
    transferring information across tasks. The designs that share effectively are
    the most effective in MTL. The MTI architecture is divided into four categories
    by us [21]:


    +   - Task-domain architectural designs,

    +   - Architectural constructions with several modes,

    +   - Known architectural designs and

    +   - Conditional architecture.


    We take into account domains for computer vision, NLP, and enhancing learning
    for single-domain architectures. Multimodal architectures handle input tasks in
    more than one modality, such as responding to visual requests using linguistic
    and visual features. It is vital to remember that we only accept multimodal designs
    that support numerous tasks. Architectures are organized in such a way that the
    same computation may be performed with the same task input across architectural
    learning phases. In conditional architectures, the architecture chosen for a certain
    piece of data depends on the data itself.


