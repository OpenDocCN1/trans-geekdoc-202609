- pgno: 52
  md: 'Therefore, timely crop disease detection through the plant leaves is essential
    for agricultural production. Finding a quick, automated, more affordable, and
    precise strategy to recognize plant infections is in this way vital, according
    to a commonsense viewpoint.


    # 3.2  Literature Review


    The research paper “Using Deep Learning for Image-Based Plant Disease Detection”
    was written by Sharada P. Mohanty and published in 2016 [1]. This research uses
    CNN, and the results show that random guessing only achieves an accuracy of 2.63%
    on a dataset with 38 class labels. Each of our experimental configurations includes
    three visual representations of the picture data, and the accuracies we were able
    to obtain here on the Plant Village dataset varied from 85.53% to 89.54% [4].


    The research paper titled “Machine Learning in Cereal Crop Disease Detection”
    was written by F. G. Waldamichael, T. G. Debelee, and F. Schwenker and was published
    in 2022. This research used deep learning techniques. As a result, we received
    five distinct accuracy results from Agarwal, Siby, and Barman. The references
    in this paper are Hasan and Tian, and the limitations and future work are to better
    understand the most recent machine learning applications for cereal crop disease
    detection. There was also a detailed study of literature consisting of 45 research
    articles focused on the utilization of profound learning for the identification
    of major diseases that infect five distinct types of cereal grains, namely wheat,
    rice, maize, oats, and barley [5, 6].


    The research paper titled “Review of Imaging Technologies for Detecting Plant
    Diseases” was published in 2020, and was authored by N. Sharma and S. Singh. The
    techniques used in this paper were classification techniques such as CNN, Random
    Forest, and Decision Classifier. The paper’s main conclusions include a summary
    of alternative imaging techniques that are effective for early detection of plant
    diseases [7, 8].


    The research paper titled “A Comparative Study of Various Techniques for Crop
    Disease Detection and Segmentation” was written by A. Khakimov and was published
    in 2022. The main technique employed was the Content-Based Image Retrieval (CBIR)
    system, which mainly uses color, shape, and texture as its basic features [9].
    An image containing these basic features is set as the query image, and CNN SVM
    and K-means were also used. The paper presents future work on the use of the CBIR
    technique to retrieve diseased leaf images, which yields better results in image
    extraction. The comparative study and its results were presented in the form of
    a table that contains the accuracy of different algorithms.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The authors of this research suggest using the ResTS (Residual Teacher/Student)
    architecture as a visualization and classification method for identifying plant
    diseases. ResTS has developed from the similarity-based teacher/student architecture
    [10]. The convolutional neural network (CNN) architecture, on which ResTS is built,
    consists of a decoder, two classifiers (researcher and student), and a convolutional
    neural network. The shared representation between the researcher and the student
    is utilized as a proxy to visualize the relevant portions of the picture for classification
    in this architecture, which trains both classifiers as effectively as feasible.
    Testing has shown that the instructor/understudy design (F1 score: 0.972) was
    surpassed by the suggested structure of ResTS (F1 score: 0.991), which would produce
    more precise representations of the disease''s symptoms. To locate and identify
    diseases in citrus trees, researchers who performed this study using the current
    ResTS architecture proposed a hybrid technique. The two primary stages of the
    desired research are (a) finding citrus fruit and leaf lesions, and (b) categorizing
    citrus diseases. Citrus lesion spots are extracted using an upgraded input picture
    and a modified weighted segmentation algorithm. Then, by fusing geometrical components,
    color, and texture, a codebook is produced. To find the best features, a hybrid
    feature selection strategy is also applied. Principal component analysis (PCA)
    values, fluctuation, and standard deviation covariance vectors are fundamental
    parts of this methodology. Once the most suitable qualities have been selected,
    they are then input into the M-SVM model for analysis, focusing on a range of
    citrus diseases. This analysis includes testing the proposed technique using a
    combined dataset from Plant Town, Citrus Pictures Information Base of Plagued
    with Scale, the Citrus Disease Image Gallery Dataset, and image databases obtained
    from their respective owners. Anthracnose, black spot, canker, scab, greening,
    and melanosis are among the citrus diseases that have been detected and categorized
    using these databases [11, 12]. On the combined dataset, the local dataset, and
    the citrus disease image gallery dataset, the proposed technique outperformed
    the existing methods with a classification accuracy of 97%, 89%, and 90.4%, respectively.


    In this research, a machine learning-based real-time system to diagnose the type
    of crop disease based on leaf photos is proposed. A single-shot approach is employed
    to identify and locate the leaf, and a profound convolutional brain network engineering
