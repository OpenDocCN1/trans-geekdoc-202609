  md: "Haar feature extraction with the potential for achieving both improved accuracy\
    \ and faster computation.\n\n# 7.3.2 Algorithm of the Proposed System\n\nThe algorithm\
    \ for individual counting via face detection is provided below. This algorithm\
    \ was developed using a custom dataset, which consisted of a variety of images,\
    \ primarily featuring people but also including ‘non-faces’ such as hands or potted\
    \ plants. The objective of the algorithm is to detect and label people’s faces\
    \ with rectangles while also counting the number of people within the frame at\
    \ any given moment.\n\nThe new method to improve the surveillance framework and\
    \ to gain more information from them were discussed and implemented below. Feature\
    \ extraction techniques were used mainly for face detection.\n\nIndividual counting\
    \ frameworks incorporate mechanical control frameworks, e.g., rotating entryway\
    \ and infrared sensor recognition framework. In our present society, the video\
    \ capturing framework is progressively connected in numerous parts of our lives\
    \ shown in Figure 7.2.\n\nHere, I defines the number of the image in the dataset\
    \ and J defines the number of shift steps of the sub-window.\n\n```\n**Algorithm:**\
    \ Individual counting via Face Detection\n\n**Input:** Original Image\n**Output:**\
    \ Image with face indicator as a rectangle with people counting.\n\nbegin\n  For\
    \ I ← 1 to do\n    Preprocess the input image.\n    Calculate the gradient image.\n\
    \    Calculate histogram gradient in the 8x8 image\n    16X16 normalization\n\
    \    Calculate Hog feature vector\n  End for\n  For J ← 1 to num of shift steps\
    \ of sub window do\n    For k ←1 to num of steps in cascade classifier do\n  \
    \    For l ←1 to num of filters of stages k do\n        Apply adaboost classifier\n\
    \        Count number of people\n        Track the images with KLT tracker\n \
    \       Filter detection sub window\n      End for\n    End for\n    Accumulate\
    \ filter output\n  End for\nEnd\n```"
