  md: '# 12.2.8  **Definition of Voting Behavior**


    Another method of gauging polarization that depends less on subjective factors
    is voting patterns, as mentioned by Gentzkow (2016). There are at least two basic
    techniques for analyzing voting behavior to measure polarization. One looks at
    smaller units of geography, such as counties, and analyzes how voting patterns
    have shifted there. This is also sometimes called “geographic sorting” (see, for
    example, Fiorina & Abrams, 2008). These studies look for signs of polarization
    by calculating the share of very unbalanced regions. Some studies, for instance,
    track the growth or decline of “landslide counties” (counties in which the victorious
    candidate wins an overwhelming majority of the vote) through time (Bishop, 2009).
    There would be signs of polarization if there were more regions with disproportionate
    vote totals (so-called “landslide countries,” for example). Another method of
    measuring polarization through voting patterns looks at how people vote in different
    election types and levels (such as congressional vs. presidential elections).


    # 12.2.9  **Policy Positions (Definition)**


    Measuring attitudes on important policy issues like health care, immigration,
    and gun control may also reveal polarization. Under this method, as Gentzkow (2016)
    rightly points out, there are at least two ways to assess whether polarization
    has taken place. First, as Fiorina and Abrams (2008) contend, polarization may
    be evinced by a change in the shape of the overall, aggregated distribution of
    attitudes on policy issues from one that is unimodal to one that is more bimodal.
    This looks at the views of all partisans together. However, another way that one
    may assess polarization about policy issues is to first separate people into political
    camps (i.e., Republicans and Democrats) and assess whether the positions of members
    of these parties diverge over time.


    # 12.2.10  **Party Sorting**


    Polarization can also be identified through the presence of party sorting (also
    sometimes called “social sorting”), which looks at the alignment between policy
    positions (e.g., views on issues like taxation, abortion, and immigration) and
    one’s party identification (i.e., Republican or Democrat) or political ideology
    (i.e., conservative or liberal), as well as the general alignment between party
    identification and political ideology. Studies on party sorting examine things
    like the size of the correlation between policy'
