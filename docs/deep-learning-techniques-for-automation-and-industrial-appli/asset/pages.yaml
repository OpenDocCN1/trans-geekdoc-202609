- pgno: 121
  md: 'Through the analysis of the features, their ambiguities are reduced, and the
    location of the facial feature is extracted.


    The image-based approach [9–12] discussed in the previous section involves face
    detection through explicit modeling of facial features. This approach has faced
    challenges related to uncertainty in face detection and variations in environmental
    conditions. However, recent advancements in component-based projects have enhanced
    the capability to mitigate this uncertainty, with a focus primarily on head-and-shoulder
    and semi-frontal faces.


    The AdaBoost classifier [13–15] is a combination of weak or less accurate classifiers.
    These classifiers are combined, and their weights are assigned. Then, each of
    them is trained with the sample data in each iteration with the expectation that
    this iterative process will lead to higher accuracy ratings.


    # ### 7.3 Proposed Work


    We propose a surveillance framework for individual counting via face detection.


    +   1. HOG + Haar feature extraction

    +   2. Application of the AdaBoost classifier

    +   3. Application of the Kanade–Lucas–Tomasi (KLT) tracker

    +   4. Face detection by counting the number of faces in a frame


    # #### 7.3.1 Tools Used


    The important tools for the surveillance framework are as follows:


    +   1. Raspberry pi

    +   2. Piezo infrared (PIR) sensor

    +   3. Pi camera


    The Raspberry Pi is connected to the computer via a Universal Serial Bus (USB),
    and the Passive Infrared (PIR) sensor is linked to the breadboard through the
    Raspberry Pi using male-female wires. Additionally, the Pi camera is connected
    to the Raspberry Pi. To work with the Raspberry Pi, it is essential to establish
    an internet connection via a LAN cable [1].


    As we discussed in the literature survey, prior work has combined HOG with other
    feature extractions, such as local binary pattern (LBP) [5], but Haar feature
    extraction has not been explored yet. Given that Haar feature extraction offers
    more precise detection, this work combines HOG and'
