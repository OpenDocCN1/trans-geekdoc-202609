  md: '# 8.4 Conclusion and Discussion


    The comparative analysis of XuNet and pretrained models used in this work shows
    that XuNet performed better than the pretrained models. The reasons for this are
    as follows: (a) XuNet uses a preprocessing step of convolving the image with the
    K₅ filter of SRM for calculating noise residual from the image, which is affected
    by the weak stego signal; (b) the dataset size of 12,000 is enough to train a
    six-layered XuNet network; and (c) due to the small size of the network, it can
    be trained with a large number of epochs. However, XuNet, when used without the
    K₅ filter, did not converge. On the contrary, pretrained networks converge without
    the use of any preprocessing filter. Further in XuNet, researchers have already
    optimized the hyperparameters for steganalysis, while a lot of hyperparameters
    need to be optimized when using pretrained models for steganalysis. As this is
    a preliminary study of using pretrained networks for steganalysis, hyperparameter
    optimization has not been done properly with established methods like Grid Search,
    Random Search, and Bayesian Optimization. Again, a dataset size of 12,000 is not
    enough to train pretrained networks with a large number of layers.


    The analysis shows that pretrained networks for steganalysis tend to overfit when
    the dataset is small. Another reason for overfitting can be because of non- optimization
    of the various hyperparameters of the pretrained networks for steganalysis. The
    advantage of using pretrained networks over XuNet is their faster convergence
    without the use of any preprocessing filter. XuNet, without the preprocessing
    filter, does not seem to converge even after training it with a large number of
    epochs, as done in this work. Also, pretrained networks can be used for JPEG steganalysis
    directly, whereas XuNet, trained for spatial domain, cannot be directly used in
    JPEG domain.


    In the future, to make better use of pretrained networks for steganalysis, the
    dataset can be extended by including some of the other datasets available or by
    using image augmentation methods such as translation, flip, and rotation. Also,
    hyperparameter optimization will be done in a systematic way for the pretrained
    networks.


    This work has used HUGO at higher payload of 0.8 bpp rather than a common payload
    of 0.4 bpp used by most researchers. At lower payloads, the difference between
    cover and stego is quite low, so CNN networks are difficult to converge. As this
    is an initial study of applying deep networks for steganalysis, a higher payload
    is used to get reasonable results for comparison. In future work, a lower payload
    dataset shall also be used. For'
