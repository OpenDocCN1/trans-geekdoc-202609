  md: '# Making Invisible Bluewater Visible Using Machine and Deep Learning Techniques–A
    Review


    Dineshkumar Singh¹* and Vishnu Sharma²


    ¹Department of Computer Science and Engineering FCE, Poornima University, Jaipur,
    India


    ²Department of Computer Science and Application FCE, Poornima University, Jaipur,
    India


    # Abstract


    Two billion people across the globe are still far from a viable source of potable
    water and rely on rain and groundwater for daily living and farming. The supply
    of groundwater is limited. In India itself, groundwater abstraction beyond the
    safe limit is causing rapid groundwater table depletion at a rate of 1–2 m/year
    in many districts. Uncontained and unplanned usage may affect food production
    by 20%. Due to the significant impact of this imperceptible resource on various
    aspects of life—the economy, the environment, and society—there is a pressing
    need to enhance the scientific comprehension, estimation, and administration of
    groundwater management. A scientific framework for the demarcation of its potential
    storage and recharge zonal maps, i.e., groundwater potential storage zone (GWPSZ)
    and groundwater potential recharge zone (GWRZ), can be instrumental in this regard
    to help urban and rural water committees objectively manage the resources at the
    regional level.


    This article examines the endeavors of multiple researchers who have employed
    statistical modeling and GIS-remote sensing alongside the analytical hierarchy
    process, or multi-influencing factors techniques (MIF), to understand, prognosticate
    groundwater, and create zonal maps. Additionally, we scrutinized the GW research
    using different forms of machine learning (ML)-based algorithms like decision
    tree (DT), support vector machine (SVM), random forest, and the composition of
    hybrid multi-wavelet artificial neural network-based models for the prediction
    of the GW table or its variations over a given time duration. This review


    *Corresponding author: 2022phdodd dinesh12942@poornima.edu.in'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'suggests the decisive parameters to be considered for analyzing the groundwater
    potential and the appropriate ML algorithms and techniques to be used for the
    decision support system and the creation of hydrological thematic maps. This entire
    pipeline can help in the automatic generation of the zonal maps. This review also
    summarizes various groundwater domain research questions in data and method identification,
    application, and future direction.


    **Keywords:** Sustainable groundwater levels, GWP zones, storage and recharge,
    remote sensing, AIML, IoT, groundwater research questions


    # ## 9.1 Introduction


    In its Sustainable Development Goal (SDG) no. 6, the United Nations General Assembly
    (UNGA) has set a target “to achieve universal and equitable access to safe and
    affordable drinking water for all by 2030” [1]. While half of the world’s population
    struggles with water availability for at least a month every year, for 0.5 billion,
    it is an almost daily struggle for water throughout the year [2]. This is highly
    observed in areas with high population density or irrigated agriculture. Fresh
    surface water and groundwater are the major sources of this water demand. As per
    the UN World Water Development Report (2022), in 2017, an estimated 959 km³ of
    groundwater were extracted globally, out of which, 75% were withdrawn in Asia
    [3]. Water resources present in the Earth’s subsurface, in the rocks or rock fractures
    and soil pores, are known as groundwater. They could be in an unmatured or saturated
    zone [4]. They may be available in a large volume in underground rocks and sediments,
    geological formations, and a natural reservoir known as an aquifer [5]. Groundwater
    is not visible, but its impact on human life is quite evident. In India, 89% of
    the water abstracted from groundwater is used for irrigation. Subsidized or free
    electricity usage in agriculture prompts growers to increase crop areas under
    groundwater irrigation, especially in the semi-arid region. Groundwater data analysis
    from 370 Indian districts from 1995 to 2004 shows an 18% increase in groundwater
    extraction. The study also found that by reducing the electricity subsidy by 10%,
    groundwater utilization could come down by 6.6% [6]. Groundwater availability
    is a delicate balance between its use (in residential areas for daily activities,
    cultivation, and the goods and services sector) and the quantity supplied (through
    precipitation, lakes, ponds, or streams). When the annual water discharge (or
    extraction) is greater than the recharge, it leads to groundwater level depletion.
    India has a surplus of 20 million tubes, open wells, and borewells, which is an
    indication of the massive amount of groundwater being pumped every day. If left
    unmanaged, this pace will adversely affect future groundwater availability in
    the coming years [7].'
