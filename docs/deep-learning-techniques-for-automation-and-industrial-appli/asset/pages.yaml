- pgno: 23
  md: '# 1.1.3 Applications of OCR


    +   (a) Digitization of Printed Documents: OCR can be used to scan and digitize
    printed documents such as books, magazines, and newspapers. The resulting digital
    text can then be stored, searched, and edited on a computer.

    +   (b) Automatic data entry: OCR can be used to automatically extract data from
    forms, invoices, and receipts, saving time and reducing errors compared to manual
    data entry.

    +   (c) Handwriting recognition: OCR can be used to recognize handwritten text,
    enabling applications such as digital note-taking or handwriting-based input for
    mobile devices.

    +   (d) Text-to-speech: OCR can be used to convert printed text into speech, enabling
    visually impaired individuals to access written information.

    +   (e) Language translation: OCR can be used to recognize text in one language
    and automatically translate it into another.

    +   (f) Automatic license plate recognition: OCR can be used to recognize license
    plates on vehicles, enabling applications such as automatic toll collection or
    traffic monitoring.

    +   (g) Document classification: OCR can be used to recognize the type of document
    being scanned, enabling automatic sorting and routing of documents.

    +   (h) Image indexing: OCR can be used to index and search image collections,
    enabling users to search for images based on the text they contain.

    +   (i) Historical document analysis: OCR can be used to digitize and analyze
    historical documents, enabling researchers to study the content and context of
    these documents in new ways.

    +   (j) Passport and ID verification: OCR can be used to read and verify the text
    on passports and other identification documents, improving security and reducing
    the risk of fraud.


    # 1.2 Literature Review


    Text extraction using optical character recognition (OCR) has been a hot research
    topic for several years. The advancements in OCR technology have made it possible
    to extract text accurately and quickly from images, which has numerous applications
    in various industries. In this literature'
  merge: -1
