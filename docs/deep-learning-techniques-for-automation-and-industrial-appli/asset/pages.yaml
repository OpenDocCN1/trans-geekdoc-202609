  md: '+   - Soil should be of type gravel and sandy as they support high percolation.

    +   - Drainage density should be high.

    +   - Because of the gentle slope, the residence time of the surface water on
    the ground is reduced. Hence, water gets a longer time for ground absorption.
    If the slope surface area is smaller, surface runoff is reduced, improving seepage
    (or drainage).

    +   - Subsurface recharge is mainly determined by surface level flow of water
    speed and vertical percolation. This in turn depends on slope degree.

    +   - Groundwater is abundant at lower elevations.

    +   - Topographic wetness index (TWI) index is inversely proportional to groundwater
    yield.

    +   - Slope length value should be low.

    +   - Fractures, voids of consolidated rocks, and porosity of unconsolidated sediments
    are suitable storage options. Faults facilitate groundwater recharge in hard rocks
    due to fractures, joints, and lineaments. These act as small water carrying channels
    from the above surface to below surface groundwater.

    +   - Weathered rocks and unconsolidated or consolidated sediment rocks improve
    water retention.

    +   - Lithological properties such as grain size, color, and texture determine
    the electrical resistivity or conductivity, soil porosity, and flow in the aquifer.

    +   - Water movement is facilitated by the unconsolidated sediment rocks due to
    larger gaps.

    +   - High lineament density means high secondary porosity, enabling increased
    percolation, which expedites the faster aquifer recharging.


    This knowledge is valuable in developing a model framework to determine the groundwater
    storage and recharge potential. Figure 9.2 summarizes the list of the parameters,
    key contributing parameters and their potential sources.


