    # 10.1.2 Challenges of Building a Classification Model from Scratch


    Building a classification model from scratch can be a challenging task that requires
    careful planning, data preparation, and model training. Some of the main challenges
    associated with building a classification model from scratch are the following:


    +   1. Data availability and quality: The availability and quality of data are
    two of the major obstacles to creating a categorization model from the start.
