    # ## 11.9  Conclusion


    Green AI with a sustainable approach refers to new findings that factor in the
    cost of computing, which could lead to resource savings. Red AI is expensive,
    while Green AI is efficient and productive. If it is agreed that efficient research
    matters as much as it is accurate, then researchers can think about ways to make
    their work more efficient. This will help make their work more inclusive and better
    for the environment. Green AI means researching AI that creates new things while
    using less computing power and fewer resources. While Red AI increases the amount
    of energy required for computations, Green AI focuses on methods that are more
    efficient and environmentally friendly, as well as how accurate they are. The
    advantageous effects on the environment and inclusivity, as we can see from the
    examples above, are that dependent variables and independent variables have a
    strong association. Thus, we could draw the conclusion that the independent and
    dependent variables are correlated. Process also showed a strong association between
    CO₂ emission levels and energy productivity (70.2%) and renewable energy sources
    (71.4%), with renewable energy being the highest correlated independent variable.
    The impact of using renewable energy should be considered in the national plan
    to meet the targets for reducing CO₂ emissions.'
