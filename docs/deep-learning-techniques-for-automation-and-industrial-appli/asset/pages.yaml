  md: '# Chili Leaf Classification Using Deep Learning Techniques


    Chenchupalli Chathurya*, Diksha Sachdeva and Mamta Arora


    *Computer Science and Engineering, Manav Rachna University, Faridabad, India*


    # Abstract


    Agriculture is of paramount importance in everyone''s life. Crops and plants play
    a huge role in sustaining life, and taking care of crops and plants is both important
    and difficult. So, to detect diseases in plants, this research paper is formulated
    to determine whether the plant is healthy or not. The dataset consists of chili
    plant leaves collected from one of the fields located in Andhra Pradesh, India.
    Many image classification models as well as transfer learning models have been
    applied. Moreover, deep learning models like convolutional neural network (CNN)
    and transfer learning models like InceptionV3 and VGG16 have been applied with
    and without data augmentation. The most successful model was found to be CNN with
    data augmentation, which showed an accuracy of 90% and also predicted almost all
    the testing images correctly. The accuracy of the model can be improved by increasing
    the size of the dataset.


    *Keywords:* CNN models, transfer learning, machine learning, deep learning, AlexNet,
    InceptionV3, VGG16, leaves


    # 2.1 Introduction


    Humans are dependent on plants for necessities, from food to clothes. Thus, one
    needs to take care of plants. Although humans are aware of the distinctness of
    leaves, there should be a way to figure out a disease before a plant becomes susceptible
    to it. Detecting the disease in advance and taking proper care of the plant will
    help save the plant consequently, saving other resources or products that come
    from plants. Thus, a model has been prepared in which'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'by detecting patterns on a leaf, one would be able to tell whether the plant
    has any disease and the desired precaution can be taken. As a result, the study
    of automatic leaf disease detection in agriculture is an important area for research
    since it could offer benefits in the observation of wide fields of produce and
    help to spot disease symptoms as they appear on plant leaves. Using computer vision
    and machine learning techniques, the researchers proposed a prediction model for
    plant leaf disease detection and categorization. Preprocessing, segmentation,
    and extraction of attributes such as shape, color, texture, and veins are done
    on the raw image of a leaf. The leaf image is classified using a variety of machine-learning
    classifiers.


    # 2.2 Objectives


    The main objectives are the following:


    +   (a) To illustrate a model that can detect and predict a disease in a plant

    +   (b) To classify whether the leaves are healthy or unhealthy.


    # 2.3 Literature Survey


    As explored in prior studies [1], various types of convolutional neural network
    (CNN) models were made to detect plant diseases with the help of deep learning.
    The database used here is an open database comprising approximately 90,000 images
