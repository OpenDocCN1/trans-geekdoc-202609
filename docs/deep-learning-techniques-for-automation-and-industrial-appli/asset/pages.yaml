    chromatic loss, these techniques applied color transfer strategy to lower attenuation
    color bands [27]. Proposed color shifting awareness techniques calibrate and correct
    the color of input scene [28]. Finally, gamma correction is applied to remove
    haze. Varicolored techniques use two modules, i.e., haze color correction and
    visibility improvement, to restore the color balance of hazy scenes to give clear
    outputs [29].


    # 6.3.4 Fusion Techniques


    This technique takes two or more inputs from different adapted versions of dehazing
    techniques and yields better output [30]. The fusion of contrast enhancement and
    white balancing is implemented based on per-pixel fashion [31]. Lastly, to reduce
    artifacts, laplacian pyramid representation is applied. Optimized, fast, single
    dehazing method includes fusion of different techniques. To determine air light
    value, dark channel prior is performed followed by white balancing to retain the
    actual color. Finally, contrast stretching is performed to enhanced contrast of
    output [32]. The fusion technique proposed is based on encoder and decoder architecture.
    It involves fusion of contrast enhancement, white balancing and, lastly, gamma
    correction. The convolutional neural network involves fusion of two generative
    adversarial networks (GAN) [33]. The outdoor unpaired real dataset is trained
    by cycleGAN, while cGAN preserves the detail of the scene. These techniques work
    well for both real and synthetic datasets [34].'
