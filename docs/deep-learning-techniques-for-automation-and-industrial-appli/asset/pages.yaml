  md: '# 10.1.4 Overview of Popular Pre-Trained Models


    A number of well-known pre-trained models can be utilized for transfer learning,
    including the following:


    # 10.1.4.1 Visual Geometry Group


    Researchers at the University of Oxford created Visual Geometry Group (VGG), a
    deep convolutional neural network architecture. It was introduced in the 2014
    ImageNet competition, and achieved second place in the classification task with
    an error rate of 7.3%. VGG is known for its simplicity and effectiveness in image
    classification tasks, and has been widely used as a pre-trained model for transfer
    learning. The VGG architecture consists of several layers of convolutional and
    pooling layers, followed by fully connected layers.


    The network receives an RGB image with a 224x224 pixel input. After the convolutional
    layers, which employ 3x3 filters with stride 1 and padding 1, the max pooling
    layers, which employ 2x2 filters and stride 2, are used. The VGG-16 architecture
    has a total of 13 convolutional layers, while the VGG-19 architecture has 16 convolutional
    layers. The network employs three fully connected layers with 4096 units after
    the convolutional layers each, followed by a final softmax layer for classification.
    The VGG architecture has a total of 138 million parameters in the VGG-16 architecture
    and 143 million parameters in the VGG-19 architecture. One advantage of the VGG
    architecture is its simplicity and ease of implementation. It has a straightforward
    structure with small filters and maximum pooling layers, which makes it easy to
    train and fine-tune. It has also been shown to perform well on a variety of image
    classification tasks, including fruit leaf classification. However, one disadvantage
    of the VGG architecture is its high memory and computational requirements. The
    large number of parameters in the network can make it difficult to train on smaller
    datasets or on devices with limited resources. Additionally, the architecture
    does not take into account the spatial relationships between features, which can
    limit its performance on tasks that require more complex reasoning about object
    structures and relationships. Another disadvantage of VGG is that it is prone
    to overfitting on smaller datasets. This is due to the network’s numerous parameters,
    which make it easy for it to memorize the training set and produce poor generalizations
    on brand-new datasets. To address this issue, techniques'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'such as data augmentation, regularization, and transfer learning can be used
    to improve the performance of the model.


    # 10.1.4.2 Residual Network


    Researchers at Microsoft introduced Residual Network (ResNet), a deep convolutional
    neural network architecture, in 2015. It was made to deal with the issue of disappearing
    gradients in deep neural networks, which can make training extremely deep networks
    challenging. After achieving cutting-edge performance on the ImageNet dataset,
    the ResNet architecture has gained popularity as a transfer learning method for
    a range of computer vision tasks.


    The ResNet architecture consists of several residual blocks shown in Figure 10.3,
    which contain skip connections that allow information to bypass one or more layers.
    By allowing the gradients to continue, these skip connections help solve the vanishing
    gradient problem by allowing the gradients to flow directly to earlier layers,
    which can help prevent the gradients from becoming too small or too large.


    The basic building block of the ResNet architecture is the residual block, which
    contains two convolutional layers with batch normalization and ReLU activation
    functions. The first convolutional layer processes the input into the residual
    block, while the second convolutional layer processes the output. The second convolutional
    layer''s output is added by the residual connection, and the combined output is
    then subjected to batch normalization and ReLU activation algorithms.


    ![](img/0c56ac060cc6089fd33efc0e4aeb71a8_178_0.png)


    Figure 10.3 ResNet-50 architecture [12].'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'The ResNet architecture also uses a global average pooling layer after the
    convolutional layers, which averages the feature maps across the spatial dimensions
    and produces a single vector that can be used for classification. This helps reduce
    the number of parameters in the network and prevent overfitting [13].


    The ResNet architecture''s capacity to train extremely deep neural networks without
    experiencing the vanishing gradient problem is one benefit. This allows for the
    development of more powerful and expressive models that can capture more complex
    relationships between features. Additionally, the skip connections in the residual
    blocks help improve the flow of gradients and reduce the impact of vanishing gradients
    on the training process.


    Another advantage of the ResNet architecture is its performance on a wide range
    of computer vision tasks, including fruit leaf classification. The pre-trained
    ResNet models have been shown to achieve high accuracy on a variety of datasets
    and can be fine-tuned for specific tasks with relatively small amounts of training
    data.


    However, one disadvantage of the ResNet architecture is its computational and
    memory requirements, which can make it difficult to train on smaller datasets
    or on devices with limited resources. Additionally, the use of skip connections
    can introduce additional complexity into the network, which can make it more difficult
    to understand and interpret.


    Despite its limitations, the ResNet architecture is a powerful tool for transfer
    learning and has been widely used for fruit leaf classification and other computer
    vision tasks. Its ability to train very deep networks and achieve high performance
    makes it an attractive option for researchers and practitioners in the field.


    # 10.1.4.3 Inception


    Inception is a deep convolutional neural network architecture that Google researchers
    unveiled in 2014. It was created to deal with the issue of overfitting in deep
    neural networks and achieved remarkable performance on the ImageNet dataset.


    The Inception architecture uses a combination of different convolutional filters
    at each layer, including 1x1, 3x3, and 5x5 filters, as well as max pooling and
    average pooling operations shown in Figure 10.4. The idea behind this approach
    is to capture features at multiple scales and resolutions, which can improve the
    network''s ability to recognize objects of different sizes and shapes.'
