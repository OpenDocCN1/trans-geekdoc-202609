    # 12.3.5  **Multitask Learning (V)**


    A typical approach is used in the ML area of multi-task learning (MTL) to carry
    out many tasks simultaneously. These techniques provide advantages including improved
    data efficiency, less overfit by employing common representations, and quick learning
    using auxiliary data. However, learning many tasks simultaneously poses significant
    design and optimization issues, and selecting which activities to learn simultaneously
    is a difficult decision.


    # 12.3.5.1  *Learning-Related Problem*


    Challenges that do not arise in one task result from learning definitions for
    several tasks. Conflicting demands in particular, may arise in many jobs. It is
    known as negative transfer or destructive interference when improving a model’s
    performance in one task causes damage to another with different criteria [20].


    # 12.3.5.2  *Multi-Task Learning MTL*


    In the MTL learning paradigm, ML models are concurrently trained using data from
    several tasks to uncover commonalities across a number of related activities.
    These common representations enhance data quality, and may hasten learning for
    subsequent or related tasks, helping to overcome two well-known drawbacks of deep
    learning (DL): the need for vast'
