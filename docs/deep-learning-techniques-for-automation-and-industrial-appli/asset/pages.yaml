  md: 'The acquisition of valuable data through the investigation and processing of
    video images has become a significant research focus in the field of video analysis.
    Video-based people monitoring technology falls under the realm of intelligent
    video surveillance. Its analysis encompasses computer vision, image processing,
    face detection, and artificial intelligence.


    # 7.3.2.4 AdaBoost Learning Technique


    AdaBoost [10] or adaptive boosting is one group of boosting classifiers proposed
    by Yoav Freund and Robert Schapire in 1996. The AdaBoost classifier [10] is a
    combination of poorly performing or less accurate classifiers. They have been
    combined and their weights have been set. Then, all their sample data are trained
    every time with the expectation that by doing so, higher accuracy ratings can
    be gained.


    The fundamental concept behind AdaBoost is to establish numerous classifiers and
    iteratively refine the training data in each iteration to ensure accurate predictions
    of observations [10]. Artificial intelligence-based calculations are used as a
    basic and strong classifier if it accepts loads on the set of preparation.


    # 7.3.2.5 KLT Tracker


    In computer vision, the Kanade–Lucas–Tomasi (KLT) [11] highlight tracker is a
    way to deal with feature extraction. It is proposed primarily to manage the issue
    that conventional picture enlistment procedures are commonly expensive. KLT utilizes
    spatial power data to coordinate the scan for the position that yields the best
    match. It is quicker than customary systems for inspecting far fewer potential
    matches between pictures [12].


    # 7.4 Experiments and Results


    As with any surveillance framework or image whose objective is face detection
    and counting, the output is presented as an image with specific labels or indicators
    for faces, along with a tracker to count the number of faces or people. In our
    approach, we combined HOG and Haar feature extractions and incorporated an AdaBoost
    classifier and a KLT tracker for face tracking. The results indicate the number
    of people in front of the camera, determined using the face detection technique
    shown in Figure 7.3.'
