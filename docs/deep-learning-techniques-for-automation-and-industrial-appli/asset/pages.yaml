  md: "# A Comparative Analysis of Different CNN Models for Spatial Domain Steganalysis\n\
    \nAnkita Gupta*, Rita Chhikara and Prabha Sharma\n\nDepartment of Computer Science\
    \ and Engineering, The NorthCap University  \nGurugram, Haryana, India\n\n# Abstract\n\
    \nUniversal steganalysis detects whether an image is a cover image or a stego\
    \ image with some hidden information embedded through various steganographic methods.\
    \ Steganalysis started with simple machine learning techniques of feature extraction\
    \ and then classification. The focus on steganalysis has now shifted towards exploring\
    \ deep learning methods. The most popular and successful deep learning models\
    \ for image classification are based on convolutional neural networks (CNNs).\
    \ CNN networks also show a resemblance to traditional steganalysis of using filters\
    \ for feature extraction. Due to the use of content-adaptive steganographic methods,\
    \ the stego message is hidden more in the complex areas of the image, and thus\
    \ cannot be detected with a simple statistical analysis of the image. The stego\
    \ information in these steganographic methods basically affects the dependencies\
    \ between the pixels introduced through various kinds of noise present in the\
    \ image. Thus, the difference between the cover and stego image is identified\
    \ through the noise part rather than the image content. Different researchers\
    \ have used various preprocessing filters to calculate the noise residuals, passing\
    \ them to the CNN network instead of images directly. This work uses a content-adaptive\
    \ steganography method, highly undetectable steganography (HUGO), for creating\
    \ stego images. This work provides a comparative analysis of one of the variants\
    \ of CNN models specific to steganalysis and various pretrained models of computer\
    \ vision applied to steganalysis. An in-depth analysis of the pros and cons of\
    \ different deep learning models for steganalysis has been presented in this chapter.\n\
    \n**Keywords:** Steganalysis, steganography, deep learning, convolutional neural\
    \ networks, pretrained models, VGGNet-16, ResNet-50, EfficientNet-B0\n\n*Corresponding\
    \ author:* ank21gupta@gmail.com"
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 8.1 Introduction


    Steganalysis is a method to detect whether a particular image is pure or contains
    some hidden information that can be a possible malicious act. There are several
    methods available to hide information known as steganographic methods [1, 2].
    Though steganography can be used for good purposes like hiding consumer data in
    credit cards, its use has increased considerably for ill purposes. Forensic experts
    have to deal with millions of images daily and steganalysis helps in identifying
    adulterated images through steganography. These adulterated images are named as
    stego images while their original ones are cover images. Specific steganalysis
    [3] targets known steganographic methods, while universal steganalysis [4] deals
    with stego images created through any steganographic method.


    Universal steganalysis is a form of supervised machine learning technique in which
    classifiers are trained on features extracted from both cover and stego images.
    For a long time, extracting rich features, such as spatial rich model (SRM) [5],
    projection SRM (PSRM) [6], and max-SRM [7], followed by an ensemble classifier
    (EC) [8] were the successful methods for discovering stego images. Unfortunately,
    these features are very high in number, e.g., 34671 for SRM, so researchers used
    a lot of feature selection techniques to improve the classification results and
    decrease the classification time [9, 10]. With the successful application of deep
    learning methods in computer vision, researchers moved towards applying these
    methods also to steganalysis, and soon they found good results. A deep learning
    method combines feature extraction and classification by learning the features
    automatically from the images in a supervised manner after using output from the
    classifier.


    With the resemblance of filters used in convolutional neural networks (CNN) and
    SRM, researchers explored CNNs for steganalysis, and customized CNNs to suit steganalysis
    needs. The highly content-adaptive steganographic methods, such as HUGO [11],
    Wavelet Obtained Weights (WOW) [12], Spatial UNIversal WAvelet Relative Distortion
    (S-UNIWARD) [13] in the spatial domain, and JPEG UNIversal WAvelet Relative Distortion
    (J-UNIWARD) [13], Uniform Embedding Distortion for JPEG Compression (UED-JC) [14]
    in Joint Photographic Expert Group (JPEG) domain make the task of steganalysis
    difficult as hidden messages distort the noise part of an image. Thus, it was
    too challenging to apply deep learning to extract features from this noise part.
    Different researchers, therefore, came forward by first applying some of the fixed
    SRM filters to calculate noise residuals from the images before feeding them to
    the CNN network.


    In [15], the authors used a nine-layered CNN architecture with 40 trainable filters
    initialized with random values. But this random initialization'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'did not let the network converge, so authors multiplied these filters with
    the values of a square K₅ kernel of SRM [5] known as the KV filter. Also, they
    pretrained their network with autoencoders and found better results as compared
    to not using them. They were not able to surpass the SRM results, and this they
    believed was due to the lack of availability of GPU. Inspired by this prior work,
    researchers [16] came up with a CNN network with Gaussian Neuron (GN) activation
    function which was specific for solving steganalysis problems. The results were
    only slightly lower than SRM on BOSSbase 1.01 [17] dataset of 10,000 images and
    were comparable with SRM on ImageNet [18] dataset of millions of images. They
    also used a preprocessing layer in which the image was convolved with the KV high
    pass filter of SRM to calculate the residual of the image. The residual image
    was then fed to the remaining CNN network. In [19], researchers have used deep
    transfer learning, and their network has learned features of cover and stego images
    at higher payload, and they have then refined those features for lower payload.
    Soon after this, in [20], authors again customized CNN with a preprocessing layer
    containing the fixed KV filter, absolute layer to compute the absolute values
    of the noise residuals, batch normalization (BN) layer to prevent the network
    from falling into local minima and tanH activation function. They were able to
    perform with comparable accuracy to that of SRM + EC on the two steganographic
    algorithms of the spatial domain. In [21], researchers have further created an
    ensemble of CNNs to improve the results. With the availability of GPU, instead
    of using a single SRM filter, researchers have started using 30 SRM filters in
    their preprocessing layer to help their CNN network converge better. Some researchers
    [22] have kept these filters fixed while some have made them trainable [23, 24].


    In [25], the authors have made use of a deep residual network with skip connections
    and named it SRNet. They used minimum heuristics for training their network in
    the field of steganalysis for the first time. They did not make use of SRM filters,
    but instead used a deeper network with a wide front part for learning noise residuals
    automatically. They have shown that their network’s performance is better than
    various other networks for steganalysis in the spatial domain [7, 23] as well
    as in the JPEG domain [26] for different stego algorithms.


    All the above works were conducted on two popular datasets, BOSSbase 1.01 and
    BOWS2 [27] of grayscale spatial domain images. The ImageNet dataset of colored
    images in JPEG format was also used in some of the research on the spatial domain
    by decompressing and converting them to grayscale images. Cogranne et al. [28]
    published the ALASKA challenge to make steganalysis more realistic for forensic
    applications. Fifty thousand'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'realistic and diversified images were provided in the JPEG domain, which was
    embedded with different stego algorithms and embedding rates, making the steganalysis
    scenario closer to reality. Winners of this challenge, Yousfi et al. [29] trained
    multiple SRNets [25] for JPEG images. The ALASKA-II challenge [30] was published
    just after the ALASKA challenge which consisted of 3*25,000 images with three
    different JPEG quality factors. The authors of this challenge also published stego
    images embedded with different payload and stego algorithms. For this challenge,
    pretrained networks were highly used by top-runners and thus gave a different
    perspective on using pretrained networks in the field of steganalysis. Yousfi
    et al. [31] have used pretrained networks which were already trained on ImageNet
    dataset for classifying images into 1000 classes. The authors have demonstrated
    the performance of these networks better than networks trained from scratch. Similarly,
    Butora et al. [32] trained SRNet on ImageNet dataset for 1,000 class classification
    problems. This pretrained network was then used for JPEG domain steganalysis.
    The authors also used the pretrained networks trained on colored images in the
    JPEG domain to grayscale images in the spatial domain. Yousfi et al. [33] made
    use of EfficientNet family pretrained on ImageNet dataset. However, the authors
    proved that these pretrained networks need to be modified to deal with the difficult
    steganalysis scenario, and thus they themselves used EfficientNet after doing
    several modifications for ALASKA-II steganalysis. In this way, pretrained networks
    have been highly used for spatial as well as JPEG steganalysis.


    This chapter provides a comparative analysis of different pretrained models for
    steganalysis and XuNet [20] specifically created for it. With experimental results,
    it is shown that pretrained methods in their original forms are less effective
    as compared to the networks created for steganalysis, but there are a number of
    ways to modify these well-performed and pretrained networks of computer vision
    for steganalysis. Thus, in the future, several modifications would be done on
    pretrained networks to make them suitable for the specific needs of steganalysis
    and to exploit the advantage of their pretraining on millions of images for ImageNet
    dataset classification.


    This work uses XuNet as a baseline as it is the first model giving comparable
    results to that of SRM with less computational complexity. The images used in
    this work are grayscale images that are convolved with a high pass filter for
    XuNet. The developers of XuNet made use of the same high pass filter for the convergence
    of their network. This operation helps to suppress the content of the image and
    calculate the noise residuals where very weak stego signals are hidden. After
    this preprocessing'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'part, the convolved image is passed to the trainable part of the XuNet. Originally,
    XuNet was trained on 512 by 512 image size, but in this work, it is trained on
    256 by 256 image size to make it comparable with other pretrained models. The
    pretrained models used in this work are VGGNet-16 [34], ResNet-50 [35], and EfficientNet-B0
    [36], all initialized with ImageNet weights. The preprocessing layer of fixed
    SRM filters is not used with these networks as this has to be attached as the
    initial layer of the pretrained networks which may decrease the performance of
    these networks. Further, our work wants to observe the performance of pretrained
    networks without using any preprocessing filter. Fully connected layers of pretrained
    networks are discarded to finetune the network with a new set of fully connected
    layers. L2 regularization is used in fully connected layers except the last one.
    The dropout layer is also used before fully connected layers. Image size is taken
    as 256 by 256 for all the networks used in this work.


    The general architecture with pretrained models used in this work is provided
    in Figure 8.1.


    # 8.2 General Framework


    # 8.2.1 Dataset


    In this work, BOSSbase 1.01 dataset [17] of 10,000 grayscale images are used.
    These images act as cover images for steganalysis. The images are of size 512
    by 512. All images are resized to 256 by 256. These 10,000 images are then converted
    to stego images using HUGO [11] steganography algorithm at payload 0.8 bpp. A
    training set constitutes of 6,000 pairs of cover and stego images is used. A validation
    set of 1,000 pairs and a testing set of 3,000 pairs are used in this work.


    ![](img/0c56ac060cc6089fd33efc0e4aeb71a8_132_0.png)


    Figure 8.1 General architecture of pretrained models for steganalysis used in
    this work.'
