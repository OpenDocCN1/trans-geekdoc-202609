  md: '# Sarcastic and Phony Contents Detection in Social Media Hindi Tweets


    Surbhi Sharma¹,²* and Nisheeth Joshi¹


    ¹Banasthali Vidypith, Tonk, Rajasthan, India

    ²Manipal University Jaipur, Research Scholar, Banasthali Vidhyapeeth Niwai, Tonk,
    Rajasthan, India


    # Abstract


    Sarcasm is a sardonic or bitter remark intended to express disrespect or ridicule.
    Sarcasm is used in the Hindi language from decay, and many Hindi idioms and proverbs
    use indirect sarcasm, which intentionally commenting someone like “अन्धों में
    काना राजा” have the meaning “मूर्ख मण्डली में थोड़ा पढ़ा-लिखा भी वदिवान् और जवानी
    माना जाता है.” [Translation: “A king with partial vision in a kingdom of blind
    people”] Sentiment categorization is less difficult in comparison to sarcasm detection
    as we see in the above written idiom that it contains a negative sentiment, but
    the meaning of what the sentence represents is intended towards less educated
    people in this case, described that ‘in a group of foolish people, even the one
    with the meager amount of intelligence is considered the brainest’. In the present
    scenario, people on social media platforms like Twitter, Facebook, and WhatsApp
    succeed in recognizing sarcasm despite interacting with strangers across the world.
    Sarcasm detection is a challenging task in the natural language processing due
    to the richness of morphology. Sarcasm detection in the Hindi language tweet is
    a prime task for natural language processing to avoid misconstruing sarcastic
    statements as original literal statements. Twitter is one of the most widely used
    social networking platform used by people to express thoughts, reviews, comments,
    compliments, and discussions on current events and to convey information in the
    form of short texts. The relevant context of the tweets is often specified with
    the use of # (hashtags), in the context of this research #sarcasm, #sarcastic,
    #kataksh, #कटाक्ष, etc., will be used to access the sarcastic tweets and then
    analyze the tweets’ sentiments to detect sarcasm in text by using different machine
    learning algorithms.


    Keywords: Sarcasm, sentiment, NLP


    *Corresponding author: surbhi2690@gmail.com'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# 5.1 Introduction


    Analyzing written languages like Hindi, English is a fascinating subject that
    has been concentrated by many Natural Language Processing disciplines. These stages
    advance the utilization of non-literal language gadgets, for example, sarcasm
    and phony for informative purposes. At Social Networking Platform Sarcasm Detection
    is necessary part of Natural Language Processing (NLP) that is useful to find
    the origin of an opinion for any topic in a form of text [2]. The presence of
    sarcastic, phony or ‘kataksh’ [In Hindi: कटाक्ष] contents in the corpus makes
    opinion mining is a very challenging task and in generally most of the sentiment
    analysis system does not consider sarcastic or phony Sentiments for analysing
    sentiment. Because of this, a large portion of the current frameworks for sentiment
    analysis are not efficient in sarcasm detection. Sarcasm is a unique type of emotion
    that normally alters the direction of the opinion for a given text or social media
    tweets. Human beings regularly use strong apparent pressure and nonverbal cues,
    such as eye movement and hand motion, to convey sarcasm in spoken discussions.
    These apparent and gestural signs are clearly absent while communicating non-verbal
    sarcasm like social media tweets or post which is generally in textual form, that
    makes sarcasm detection a complicated job. Most of the time, humans feel trouble
    to comprehend sarcasm in text. In general, sarcastic sentences look like positive
    sentences, the overall significance becomes negative because of the presence of
    sarcasm.


    The Accessibility of free resources in the Hindi domain is very rare, as Hindi
    is the most popular communication language in the world after other communication
    languages like Mandarin, Spanish and English [13]. Across the world 500 million
    people used Hindi as a communication language and from them a huge population
    is Indian [14].


    In this research, we present the problem of detecting sarcasm in social media
    Hindi tweets.


    # 5.1.1 Sarcasm in Social Media Hindi Tweets


    These days in India, Hindi is getting greater prevalence due to the wider space
    of social networking platforms like Facebook, Twitter, and WhatsApp. People are
    posting messages and remarks as often as possible in the Hindi language because
    Hindi is our mother language, so it is easy to write reviews, remarks, tweets,
    and blogs in Hindi. With the expanded measure of data being discussed by means
    of territorial dialects like Hindi'
