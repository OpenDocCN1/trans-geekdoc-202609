  img_proc: true
- pgno: 180
  md: '![](img/0c56ac060cc6089fd33efc0e4aeb71a8_180_0.png)


    Figure 10.4 An inception module [14].


    In addition to the standard convolutional layers, the Inception architecture also
    includes a module called the “inception module”, which consists of several parallel
    convolutional paths with different filter sizes. The output of each path is concatenated
    and passed through a 1x1 convolutional layer, which reduces the number of output
    channels and helps reduce the computational cost of the network [15].


    The Inception architecture also includes auxiliary classifiers, which are inserted
    at intermediate layers of the network and are used to provide additional supervision
    during training. These classifiers help combat the issue of disappearing gradients
    and can improve the overall performance of the network.


    One advantage of the Inception architecture is its ability to capture features
    at multiple scales and resolutions, which can improve the network’s ability to
    recognize objects of different sizes and shapes. Additionally, the use of the
    inception module and auxiliary classifiers can improve the flow of gradients and
    reduce the impact of vanishing gradients on the training process.


    However, one disadvantage of the Inception architecture is its computational and
    memory requirements, which can make it difficult to train on smaller datasets
    or on devices with limited resources. Additionally, the complexity of the network
    can make it more difficult to understand and interpret. This can make it difficult
    for experts in the field to investigate and practice.'
