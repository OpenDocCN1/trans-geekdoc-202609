    # 5.3 Research Gap


    Works from times before the rise of social media, most of the qualitative studies
    on the construct of sarcasm focused on verbal form of it [31–34]. However, little
    is known how the ways of expressing sarcasm get changed for limited yet versatile
    ways of expressing oneself on social media. For example, the non-verbal cues as
    described in [35] are difficult to express on social media. Existing literature
    lacks insights about the ways how these non-verbal cues get transformed according
    to the expressive capability of the Social Networking platforms like Twitter.


    Again, we feel that the use of topics in text data as in [5, 9, 24] might limit
    the application of those approaches to a particular domain of text data generated
    over a certain period of time. Therefore, it is more important to know the “ways”
