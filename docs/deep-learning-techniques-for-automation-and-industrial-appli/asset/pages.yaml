    There seems to be an ongoing debate on whether the internet promotes public dialogue
    and thereby expands the public sphere or exacerbates a tendency to group like-minded
    people, thus creating echo chambers for optimistic and pessimistic arguments.
    The research design sources for the “public sphere or echo chamber” issue are
    social media, where ordinary people produce, share, and distribute their private
    content with political opinions and ideas.


    The signature phenomenon of our time is political polarization. Even so, in recent
    years, it has established considerable attention in research and journalism. A
    rising number of works state that theory as a relevant tool for communication
    contributes to this trend [14].


    What is being discussed in detail might get confusing as the issue of political
    polarization spreads. A white paper on political polarization by Stanford economist
    Matthew Gentzkow (2016) is the most helpful and extensive reference for sorting
    through that jumble. We mainly depend on Gentzkow’s description of the many metrics
    that have been used to quantify and research political polarization in this passage,
    and we also add a few other noteworthy measures.


    According to Gentzkow (2016), it makes sense to divide polarization research into
    the following categories: polarization as measured by party identification, political
    ideology, voting behavior, opinions on policy issues, alignment between policy
    positions and political identification (also known as “party sorting”), or attitudes
    towards those who support opposing viewpoints. We will now go into further details
    about them.


    # 12.2.1  Identification of the Parties


    Party identification is perhaps the easiest and most direct approach to evaluating
    political polarization, as Gentzkow (2016) notes. Researchers examined changes
    in how strongly individuals identify with the two major U.S. political parties—the
    Republican Party and the Democratic Party—in studies that concentrated on this
    metric (e.g., Miller, 1991). People are asked to categorize themselves into one
    of five categories, such as Republican, Lean Republican, Independent, Lean Democrat,
    and Democrat. This one-dimensional continuum is used to gauge party affiliation.
    A higher percentage of people moving to the extremes (or “poles”) of the scale
    would indicate a rise in polarization.'
