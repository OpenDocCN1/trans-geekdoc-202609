  md: '# Removal of Haze from Synthetic and Real Scenes Using Deep Learning and Other
    AI Techniques


    Pushpa Koranga¹*, Ravindra Singh Koranga², Sumitra Singar¹ and Sandeep Gupta³


    ¹Faculty of Computing Skills Education, Bhartiya Skill Development University,
    Jaipur, Rajasthan, India

    ²Department of Computer Science and Engineering Graphic Era Hill University, Bhimtal,
    Uttarakhand, India

    ³Department of Electronics and Communication Engineering, Sunstone (JECRC), Jaipur,
    Rajasthan, India


    # Abstract


    Images are the main source for all image-processing fields like surveillance,
    detection, recognition, and satellite. Good visibility of images captured by sensors
    becomes crucial for all computer vision tasks. Sometimes, the scene quality is
    degraded by bad weather conditions like haze, fog or smoke; therefore, making
    it difficult for the computer vision area to obtain actual information. Haze can
    be removed from a single input scene by using single image dehazing methods. Synthetic
    hazy images are created by a haze generator. Currently, most image dehazing techniques
    are applied for synthetic haze. Various single-image dehazing techniques are being
    developed and tested on real-world scenes captured in hazy environments using
    cameras. These techniques aim to be practical solutions for removing haze from
    images. This study focuses on dehazing methods for both synthetic and real datasets
    totaling 45 hazy scenes. The output qualities of different techniques are measured
    using different parameters, such as Ciede2000, Peak Signal to Noise Ratio (PSNR),
    and Structural Similarity Index Measure (SSIM).


    Keywords: Color attenuation prior, dark channel prior, convolutional neural network,
    deep learning


    *Corresponding author: PushpaKoranga14@gmail.com'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 6.1 Introduction


    The quality of any output optical image device is dependent on its surrounding
    conditions of weather like mist, haze, dust, and fog.


    Such weather conditions directly affect the color and contrast of the scene, resulting
    in degraded quality. It mainly occurs due to optical phenomena of light absorption
    and scattering reflected by the object surface. The reflected light from the surface
    of an object gets attenuated by aerosol particles present in the environment,
    and it decays by a factor called transmission. Further light is scattered by particles
    of surroundings, which is affected by the camera distance from the object [1].
    Overall, these effects result in a poor quality output, which make it difficult
    for use in the field of vision systems such as surveillance and satellite. Thus,
    single-image dehazing is highly recommended as a pre-processing task for any computer
    vision method to enhance performance in hazy conditions. Single-image dehazing
    techniques do not carry any external knowledge of the single-input scene. Haze
    is spatially variant as it is affected by scene depth, having impact on different
    parts of the scene. Therefore, scene depth is needed in a haze-formation model
    to produce haze-free output [2].


    # 6.2 Formation of a Haze Model


    The image captured by the sensor has two parts. The first part is the scene radiance,
    which consists of light reflected from the object. The second part is environmental
    illumination, which consists of light reflected from the ground, direct sunlight
    and diffused skylight [3]. Nayar and Narasimham developed a dichromatic atmospheric
    scattering model as mentioned in Figure 6.1. This model explained haze formation
    by the linear combination of air light and transmission value [4].


    As a mathematical equation, it can be expressed by:


    I(x) = J(x) t(x) + A (1 - t(x))    (6.1)


    where J (x) t (x) represents the attenuation model, A(1 – t (x)) represents the
    degradation model, J (x) is the clear scene, A represents global atmospheric light,
    t(x) represents transmission value, which denotes quantity of light not scattered
    and that reaches the sensor, and I (x) is the observed hazy scene. The main aim
    of dehazing is to restore the J(x) value from I(x).'
