  md: 'two transmission values, which are further refined to give a dehazed output
    [20]. Rayleigh scattering techniques, in which atmospheric value is estimated
    by computing the minimum, average, and maximum pixel value of each R, G, and B
    channel, have been proposed [21]. Initial transmission is estimated by the Rayleigh
    scattering model while refined transmission is obtained by a fast guided filter.
    For nighttime haze, Taylor series expansion is applied to calculate pointwise
    transmission value, while Retinex theory determines atmospheric value [22]. Bounded
    channel prior techniques give an accurate transmission map, and different transmission
    values of many small patches of input image are estimated accurately.


    Guided filter and weighted interpolation are further applied to rough transmission
    to refine details and edges [23].


    # 6.3.3 Color Attenuation Prior


    Color attenuation prior (CAP) assumes that the difference between brightness and
    saturation of an image affects the haze density. Also, haze density is directly
    proportional to scene depth, which can be explained by [24]:


    (x) ∝ d(x) ∝ v(x) − s(x) (6.5)


    (x) represents haze density, d(x) represents scene depth, v(x) represents brightness
    of scene, s(x) represents saturation. The linear relationship among scene depth,
    brightness, and saturation is given by:


    d(x) = θ₀ + θ₁ v(x) + θ₂ s(x) (6.6)


    where θ₀, θ₁, and θ₂ are unknown linear coefficients; the basic color attenuation
    prior step is as shown in Figure 6.2. For improved color attenuation techniques
    useful for both synthetic and real scenes, quad decomposition method is applied
    for air light estimation. The use of a low pass filter is a common technique to
    remove background noise from an image. In addition to using a low pass filter,
    adaptive linear weighting can also be used to further remove background noise
    from an image [25].


    Estimated air light using haze line, which assumes that in RGB space hazy pixel
    values can be modeled as lines, intersects at the air light [26]. Finally, constant
    scattering coefficient values are replaced by dynamic scattering coefficient values.
    Color channel transfer is a technique used in image dehazing to recover the colors
    and contrast of a hazy image. It is based on the assumption that at least one-color
    channel, usually green or blue, has a relatively low attenuation due to the haze.
    To compensate for'
