    # 5.4 Objective


    Recognizing sarcasm in Hindi text is an important task for Natural Language processing
    to avoid misinterpretation of sarcastic statements as literal statements. Accuracy
    and robustness of NLP models are often affected by untruthful sentiments that
    are often of sarcastic nature. Thus, it is important to filter out noisy data
    from the training data inputs for various NLP related tasks. For example, a sentence
    like “So thrilled to be on call for work the entire weekend!” could be naively
    classified as a sentence with a high positive sentiment. However, it is actually
    the negative sentiment that is cleverly implied through sarcasm.


    Our primary goal is to analyze weather a Hindi Language tweet is sarcastic or
    not.


    Computational detection of sarcasm has seen attention from the sentiment analysis
    community in the past few years. Sarcasm is an interesting problem for sentiment
    analysis because surface sentiment of words in a sarcastic text may be different
    from the implied sentiment. For example, ‘रिश्तों में दूरियां तो पहले ही आ चुकी
    थी... कोरोना ने आकर इल्जाम अपने सर ले लिया........!!” this sentence is sarcastic
    because it initially expresses a positive intent regarding the existing distance
    between relations. However, during the COVID-19 pandemic, we are now following
    social distancing and avoiding physical meetings, which introduces a negative
    sentiment into the latter part of the sentence.


