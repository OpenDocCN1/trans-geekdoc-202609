    science education for the University at Buffalo''s online Science and the Public
    EdM program. He has been a visiting fellow at the Institute for Philosophy and
    Public Policy at George Mason University in Virginia, and the Center for Neurotechnology
    Studies of the Potomac Institute for Public Policy in Virginia. At Georgetown
    University, he works with James Giordano of the Pellegrino Center for Clinical
    Bioethics. Shook''s research encompasses philosophy of science, pragmatism, philosophical
    psychology, neurophilosophy, social neuroscience,'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'moral psychology, neuroethics, and science-religion dialogue. He co-edited
    Neuroscience, Neurophilosophy, and Pragmatism (2014), and American Philosophy
    and the Brain: Pragmatist Neurophilosophy, Old and New (2014). His articles have
    appeared in Cortex, Neuroethics, AJOB-Neuroscience, Cambridge Quarterly of Health
    Care Ethics, Philosophy, Ethics, and Humanities in Medicine, and Journal of Cognition
    and Neuroethics.


    **Tibor Solymosi**, PhD, teaches philosophy at Westminster College in New Wilmington,
    Pennsylvania. He has previously taught at Allegheny College, Bowie State University,
    Mercyhurst University, and Case Western Reserve University. His research focuses
    on the consequences of the sciences of life and mind on our self-conception as
    conscious, free, and morally responsible selves. He is co-editor of Pragmatist
    Neurophilosophy (Bloomsbury), and Neuroscience, Neurophilosophy and Pragmatism
    (Palgrave Macmillan). He is currently working on the intersection of neuroscience
    and democratic culture, specifically regarding the effects of social media, digital
    devices, big data, and artificial intelligence.


    **Anita C. Street**, MS, is a Technical Advisor with the US Government. She has
    30 years experience working in the area of strategic foresight, environmental
    science, emerging technologies, and national security. She has edited and co-authored
    a number of publications on nanotechnology and clean water applications, Life
    Cycle Analysis of emerging technologies, peak phosphorus, and the influence of
    science fiction on research and development of converging technologies.'
