- pgno: 168
  md: 'internal moral guidance is in strong contrast with the model of external

    moral criticism.


    # Locating Moral Responsibility


    Ascertaining moral responsibility can be accomplished externally. External moral

    criticism assumes a standpoint outside a group to inspect its components,

    workings, and activities. Adding aAI to a group of (autonomous) human agents

    allows the question, “If the AI acts in a way that is morally wrong, where would

    moral responsibility rest?” Taking the components of that human–AI system

    separately, the question actually becomes: “Shall moral responsibility reside
    with

    the human side, or the AI side?”


    Emphasizing how any AI is merely an amoral tool is a short cut for placing the

    full burden of responsibility upon the human side. Claims that “AI in itself is

    neither good nor bad, but is only used rightly or wrongly by human users”

    establish that humans are fully responsible for aAI. Canning (2006) has argued

    that a constant construct across any spectrum of system autonomy should be the

    principle that machine systems must have either the involvement of a human

    operator or explicit human authorization to act against (i.e., neutralize) a human

    target. To paraphrase Canning (2006), machines can target other machines, while

    only humans may target humans. Yet full human responsibility is not a simple

    matter to confirm.


    Moral responsibility for an outcome in a situation implies having some degree

    of control in that situation. If moral responsibility for an outcome resides with
    the

    party having the most control over that situation, where does moral responsibility

    reside in a human–AI system? A human *in-the-loop* who is continuously moni-

    toring and orienting the AI system has significant control over its activities,
    and

    hence considerable moral responsibility for its activity, including any destructive

    or lethal actions. In contrast, while a human “on-the-loop” is periodically moni-

    toring how an aAI system is performing, its specific acts (including lethal

    acts) could be performed without explicit human direction.


    Let us suppose that an aAI system does something that no human authorizes,

    suggests, or even envisions. Clearly, there is no human oversight and control
    of

    that independent action. If absence of control implies lack of moral responsibility,

    no human supervisor is morally responsible for an aAI system’s independent

    action. The aAI controlled its action, not a human; so, we could infer the aAI

    must be held morally responsible here. Yet, we opine that the assignment of moral

    responsibility to an aAI may be premature. Even sophisticated AI systems may

    not really “know” or “care” about right and wrong, and chastisement and pun-

    ishment of AI seem pointless. Assigning moral blame could be more corrective

    than retributive, but fixing an AI system’s programming does not first require

    assigning *moral* responsibility.


    A paradox looms. We expect greater autonomy to be linked with greater

    responsibility. However, as Arkin (2010) and Bataoel (2011) have noted,'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'increasing system autonomy does not inherently provide or confer parameters
    for the development and/or execution of moral decisions and ethical actions.


    For example, while the aAI system is operating fairly independently to fulfill
    tactical goals, a human “on-the-loop” may bear little to no moral responsibility,
    and the AI system never has any moral responsibility. Conjoining human autonomy
    and AI autonomy in a human-AI system appears to only diminish or eliminate moral
    responsibility altogether. Ethics should be able to discern where moral responsibility
    resides and propose how to improve the capacity for moral responsibility. Where
    human-AI systems are concerned, ethics from an external standpoint would need
    to work harder at isolating and crediting full moral responsibility.


    Applying ethical theories to aAI system cannot proceed from a presumption that
    the system is already an individual agent bearing moral responsibility. Presumptive
    responsibility must be attached to human agents. The “ethics of AI” is typically
    conceived simply as the “ethics of using AI.” Consequentialist and deontological
    approaches offer accordingly distinctive analyses. Employing human-independent
    AI can be supported by consequentialist views, such as utilitarian arguments weighing
    the benefits of off-loading work that is too demanding for humans against the
    possible harms that could be (or are) incurred. However, the liberating humanity
    from labors could bring new forms of degradation or enslavement. Although sapient
    AI rebelling against its human masters is still the stuff of science fiction,
    deontological concerns can be raised about human dependency upon aAI’s dominion
    of safety and security. Whether victories are gained or lost, the prospect of
    perpetual and escalating AI-driven and AI-executed warfare will challenge thresholds
    and tolerances for military conflict, and precepts of human values, freedoms,
    and rights (Asaro, 2008; Howlader & Giordano, 2013).


    Parameters and boundaries for deploying aAI could be roughly determined by adjusting
    balances and compromises among utilitarian and deontological factors (Howlader
    & Giordano, 2013). But that is not the ethical issue pursued in this essay. Regardless
    of what idealized bounds are imaginable, actual AI will be constructed and deployed
    under real-world circumstances. If ethics proves unable to discern moral responsibility
    within in the human-AI system, where that abundance of autonomy appears to eliminate
    moral responsibility, there would be little point to conducting a moral inquiry
    and investigation into wrongful conduct on the part of any individual internal
    to the system. All the same, external ethical scrutiny can be applied to the system
    as a whole. How should AI be used by humans?


    If the key issue for deontological and/or consequentialist address is solely the
    ethics of using aAI, there would be an initial dichotomization dividing humanity
    (the responsible moral agents) from aAI (mechanisms barely envisionable as agents).
    By separating AI, the design of these systems’ programming becomes paramount,
    wherein “moral” prescriptions, proscriptions, and constraints could potentially
    be encoded (Franklin, 1995). Furthermore, so long as deontological and consequentialist
    approaches remain focused upon what the singular agent should and should not do,
    ethics is led toward developing some sort of'
  merge: -1
  img_proc: true
- pgno: 170
  md: '"algorithm" or "application" for morality, which could run in real-time to
    direct and restrain the actions of an aAI system (see here, Casebeer, 2003, 2017).
    Thus, if we take the "artificial" in "artificial intelligence" to infer that AI
    is imitating human intelligence, then perhaps individual moral intelligence could
    be modeled and installed.


    # Programming AI Morality


    The notion of programming an AI system to be good is almost as old as the idea
    of robotics itself. However, some serious obstacles block the road – or offer
    the proverbial dilemma of the “choice of the path taken” to designing moral programming.
    This is because deontological and consequentialist approaches to morality can
    point in differing directions. The means to utilitarian ends may fail to be right
    or just; and duty and righteousness for their own sake might not increase the
    overall good. Substituting other ethical theories cannot avoid this “ethical divergence”
    problem. Reliance on just one ethical theory can linearize moral thinking, but
    nonsubscribers to that theory need not agree that the thought process and answers
    it brings are right. It is impossible to say how AI could be as ethical as humans,
    so long as humans disagree about how to be ethical. This issue undergirds proposed
    aAI development in China, as the general idea is that the ambiguity of human moral
    and ethical decisional processes could (and should) be resolved through the integration
    of aAI system that conforms to centralized tenets of control, keeping the human
    element on-the-loop, but not necessarily in-the-loop. As Kania has noted (2018),
    the Chinese military is required to “remain a staunch force for upholding the
    Chinese Communist Party’s ruling position,” and would not tolerate any AI system
    that behaves in ways contrary to this tenet.


    Autonomous AI can surely be “programmed” for moral conduct – indeed, many such
    moral programs are imaginative and at minimum, feasible. Moral proliferation is
    the real obstacle, and competing ethical theories are part of that problem, not
    a resolution. There is no optimal design solution: any compromise among ethical
    approaches would be practically indistinguishable from immorality, from the standpoint
    of one ethical theory or several theories. Any and all morally programmed AI would
    likely be categorized as evil by one subset of humanity or another. This is a
    familiar human situation: one righteous group (by its own ethical definition)
    is perceived as malevolent by another (according to that group’s ethical standards).
    To this point, we are fond of paraphrasing MacIntyre’s (1988) query: what good,
    whose justice, which rationality? It is irrelevant whether moral relativism has
    (or lacks) the endorsement of philosophical ethics; the world where humanity lives
    is a scene of genuine moral and ethical disagreement that cannot be ignored.


    As long as humans disagree with each other, and with “moral” AI, about what is
    truly ethical conduct, there is no way to generally determine how any AI could
    be as ethical as humanity. The suboptimal alternative is to concede that any “moral
    AI” could only be as moral as the chosen ethical approach taken by a specific
    subgroup of humanity. That is, for a given human community with its'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'own ethos, there could be, in principle, locally optimal moral programming
    for a AI (vide supra).


    The implementation of local “morality programming” for AI is one thing; creating
    morally responsible AI is quite another. Even if high confidence could be bestowed
    upon a suitably complex programming for moral AI behavior, does that mean that
    this AI can now bear some moral responsibility for its actions? If we still feel
    uncomfortable crediting AI with any moral responsibility, we are forced to look
    elsewhere, specifically, to the human side of the human-AI system. Yet the humans
    on-the-loop seem even less responsible for whatever happens while the AI pursues
    its mission and makes its decisions with a high degree of independence. That tactical
    and moral independence lends the appearance of (perhaps even greater) autonomy
    to the AI side, yet moral responsibility remains as elusive as ever. No matter
    how we survey the human-AI system, the AI component appears only to have the status
    of an amoral tool.


    Perhaps then, the humans responsible for the moral programming should be held
    responsible for any immoral behavior enacted by the programmed AI system. However,
    those programmers are even more distant, in a causal and control sense, from the
    concrete actions that the AI takes in the field. As well, training and testing
    moral programming within hypothetical scenarios can rarely, if ever, duplicate
    the unanticipatable contingencies of real-world engagements (e.g., against inherently
    unpredictable other AI systems and human agents). When an AI system performs oddly,
    in what seems to be an erratic or almost chaotic manner, such unwanted behavior
    is considered to be “accidental”; yet occasional accidents are almost inevitable
    due to the high complexity of aAI systems’ structures and functions.


    Simply put, that AI accidents will happen is no accident. The dynamically recursive
    and looped networks and integrated systems of aAI platforms, so tightly coupled
    high speed computation and communication, will produce nonlinear, cascading, and
    concatenation decisions and acts occurring too fast for human comprehension or
    intercession. The growing adoption of “deep learning” and auto-reprogramming will
    only make AI more inscrutable. If AI were slow enough for humans “on-the-loop”
    to always understand what AI is doing and why AI is doing it, then that AI would
    be practically worthless as an asset for gaining tactical advantage in the field.
    That advantage is amplified by expecting AI systems to make ever-faster tactical
    decisions with incomplete and inconclusive data, further increasing the odds of
    unpredictable and erratic behaviors (Scharre, 2016). Such eccentricities are acceptable
    features under certain NSID conditions. Yet, in any case, there is no good reason
    to hold human programmers morally responsible for all aAI decisions and actions.


    To summarize matters so far, programming aAI systems for morality and moral responsibility
    confronts serious obstacles. Viewed externally, little moral responsibility can
    be discerned on either the human side or the AI side of a human-AI system, especially
    as AI functions more autonomously. Viewed internally, such obstacles are greatly
    reduced, but contextual dependence is increased. Morality programming for aAI
    can be designed for functioning within the context of a community’s ethos.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# # Ethics in Context and Community


    An ethics of and for a human-AI system, like any study of human-AI relationships,
    should apply network and systems principles (Liu, 2019). Making AI ethical cannot
    be simply about programming the AI for morality in imitation of human morality
    in a general sense. For human beings, morality is a complicated arena replete
    with tough dilemmas as well as simplistic platitudes. The amount of abstract rationality
    applied to moral to and with human activity (Wurzman & Giordano, 2009). This dynamic
    transaction is well coordinated by cybernetic functions of the nervous system:
    activity is coordinated and governed by feedback processes that modify feedforward
    anticipations of the human bodily system.


    The human body, of course, lives within a larger systems-of-systems that include
    other enbrained and encultured humans (and other organisms), which are embedded
    in a wider ecology of the natural environment (Flanagan, 1996,'
  merge: -1
  img_proc: true
- pgno: 173
  md: '2017; Giordano, Bendikter, & Kohls, 2012; Solymosi, 2014). Intelligence is
    extensionally and functionally relational, making use of and operating across
    all of these levels of systemic complexity. Locating responsible intelligence
    at solely one level or in a special node of the whole network is to commit a category
    mistake (viz. a form of erroneous mereological conceptualization; Bennett & Hacker,
    2003; Giordano, Rossi, & Bendikter, 2013). Intelligence of every kind is thoroughly
    social. Responsible moral intelligence, whether human or AI, is therefore social
    in nature and communal in its exercise (Giordano, Becker, & Shook, 2016). If moral
    performance is evaluated apart from mission performance, then the communal ethos
    is being ignored and overridden, degrading the responsibility of everyone involved.


    We began our inquiry of AI ethics by focusing on the question of to what extent
    AI systems for NSID service may meaningfully participate in the moral evaluation
    of their actions. We propose that the answer now becomes clear: For a given human
    community with its own ethos – such as any NSID organization – there could be,
    in principle, locally optimal moral programming for aAI. To the extent that AI
    systems are tactically cooperating in the responsibly intelligent conduct of their
    mission activities, they already meaningfully participate in the moral conduct
    of the human-AI team.


    # Toward Synthesis: An AI “Cooperating System” for Ethics


    Let us recall how a communal ethos (basically) functions within NSID/military
    organizations. Personnel: (1) adopt the required norms of proper behavior in uniform;
    (2) expect other service members to satisfy norms while conducting group activities;
    and (3) cooperate with community-focal evaluations of personnel conduct by those
    standards. This moral framework can be extended as a quasi-Gigerenzer (or other
    Bayesian) heuristic model to encompass aAI (co) operating within a human-AI team
    (Gigerenzer, 2000; Gigerenzer & Todd, 1999; for other heuristic models, see Brooks,
    2002; Gams, Bohanec, & Cestnik, 1994; Hall, 2007; Roscheisen, Hofmann, & Tresp,
    1994). Autonomous AI will exemplify these three capacities (1, 2, 3) in a manner
    appropriate for AI, under all these conditions:


    **Moral AI (1).** AI will conform to the required norms of cooperative behavior
    while in service. Programming for heuristics of collaborative teamwork will function
    at the level of a “cooperating system” that hierarchically rests on the core operating
    system, preventing any noncooperative decision to reach the mechanical stage of
    actual action. All other programming is designed for functioning within that “cooperating
    system,” and no other programming has the ability to engage any mechanical operation
    of the AI (e.g., no other programming by itself can engage an on-board weapon
    or use the AI system itself as a weapon).


    **Moral AI (2).** The AI Cooperating System (AICS) will ensure that all on-board
    programming satisfies the communal norms of appropriate tactical conduct,'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'inclusive of moral conduct. The AICS is empowered to temporarily halt or terminate
    any other programming functioning within its virtual environment, if persistently
    noncooperative (and possibly immoral) decisions are generated by it. Human approval
    for this AICS noncooperation override will not be required, although human notification
    should be promptly provided.


    **Moral AI (3).** The AICS, whether operating as onboard computing or cloud-based
    computing (NB: ideally both, in case of communication disruptions), will provide
    real-time tactical data relaying its (own) cooperative performance (including
    moral conduct) for continual or periodic human review. The AICS will be reprogrammable
    for improvement and retraining of its heuristics for evaluation of AI cooperativeness.
    Importantly, the AICS will not be self-reprogrammable, but can only be modified/upgraded
    by designated NSID personnel.


    Taken together, Moral AI (1–3) would serve as responsible entities designed for
    upholding the communal ethos of the NSID/military organization served. Because
    moral guidance will be embedded into human-AI teamwork, aAI and its AICS would
    exhibit and exemplify moral responsibility. The entirety of the human-AI system
    can achieve conformity with the NSID/military ethics of its communal ethos, since
    moral guidance is distributed throughout the human-AI system. Distributed intelligence,
    if it is responsible intelligence, will fulfill communal morality. In this context,
    AI ethics will be NSID/military ethics, conforming to the NSID/military ethos.
    An AI in NSID/military service will participate in its capacity to meet moral
    standards of conduct during NSID/ military engagements.


    # Conclusion


    In this chapter, we have investigated some minimal conditions and criteria for
    designing autonomous and responsible AI systems able to exemplify key NSID/ military
    virtues. Virtuous responsibility is compatible with autonomous activity. Autonomy
    is not simply freedom from responsibility. Individual autonomy need not be antithetical
    or contrary to group responsibility. This communal ethos model of virtuous responsibility
    is exemplified in teamwork under good leadership. NSID/military organizations
    are prominent examples of communal ethos, wherein aAI systems can perform commendable
    service.


    A core NSID/military virtue is loyalty, which requires trusting relationships.
    It is likely that humans will have understandable difficulty wholly trusting aAI,
    at least at first. But loyalty is a “two-way street,” which is a colloquial way
    of describing trust-in-loyalty as being about a group’s character, not just an
    individual characteristic. Thus, just as cooperative intelligence is distributed,
    responsible intelligence must also be extended and distributed. From the perspective
    of humans observing the conduct of AI, fulfilling that cooperative responsibility
    will allow AI to display key NSID/military virtues. In this way, we believe that
    NSID/military AI can be ethical AI. Of course, given ongoing'
