  md: 'But is it really true that soldiers have no control over jus ad bellum? Was
    there really such a person as the good Nazi concentration camp guard? (This type
    of argument is also known as the “Reductio ad Hitlerum”).


    After all, if one believes their country’s actions in war are unethical, then
    they can always vote or emigrate; or in serving in such a war, refuse to follow
    orders, or even surrender to the other side. Belief otherwise reinforces worries
    over collective responsibility problems and commits the fallacy known as the paradox
    of the heap – what if one person changing their mind changes the war not at all,
    but if many do... there is always some threshold at which additional individual
    acts will make a collective difference – the “straw that broke the camel’s back”.


    Taking seriously the “ought implies can” principle and notions of collective responsibility,
    it seems there should be a linkage between jus ad bellum and jus in bello.


    # Can LAWS Have Moral Responsibility?


    At a minimum, while the AI/LAWS fighting in space cannot (yet) have moral responsibility,
    the officers choosing to use LAWS (or not) do have moral responsibility – they
    can make a meaningful choice as to the means by which they fight, even if they
    cannot control whether or not their government decides to prosecute the war. So,
    is this support for independence thesis after all, then? Because space LAWS (which
    command assures are a military necessity) can as yet have no moral responsibility?


    To address this, we need more detail on the crucial issue: do LAWS in space or
    AI-enhanced astronaut warfighters undermine or reinforce the independence thesis?
    Dual-use issues in space exacerbate the conceptual problems. Dual-use concerns,
    of course, are built into almost all space-based technologies. For example, private
    corporations wish to build space hotels; but of course any large space base that
    hosted a hotel could do double duty as a launch platform for space-based missiles
    that could kill far faster than ground-based attacks, and may be undetectable
    until too late. Even the ISS only orbits at a height of 249 miles, a distance
    that on the ground would be nearly enough to seriously alarm an enemy – and that
    does not even count the fact that, unlike Earth-based missiles, gravity would
    be helping, not hurting, the weapon’s takeoff and impact velocity, and hence time
    to target. Indeed, even unarmed missiles from space could easily pack a wallop
    equivalent to a small nuclear weapon – the military calls them “Rods from God”
    (Shainin, 2006). Aggressive military planners have long termed space “the ultimate
    high ground” and dreamed of using it to launch devastating preemptive attacks.
    Indeed, serious military strategists propose that the US formalize space warfare
    into a separate branch of the military, like the Army or Navy, in claiming that
    “America Needs a US Space Corps” (Smith, 2017).


    To be clear, space-based attacks would not even have to use kinetic force; for
    example, a cyberattack on satellites could disrupt an enemy’s communications and
