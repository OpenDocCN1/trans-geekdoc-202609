  md: '“old fashioned” by John Haugeland (1985).⁴ Rather than finding correlations,
    GOFAI represents claims symbolically and manipulates those symbols to draw conclusions.
    This means that conclusions are transparent, and knowledge can be expressed in
    ways to be context-sensitive to avoid brittleness concerns. However, GOFAI faces
    challenges of its own. First, it is incredibly difficult to itemize the pieces
    of knowledge required to reason about the world. And second, even with those pieces
    of knowledge encoded into a system, it is no small task to reason efficiently
    over the huge body of knowledge that must be present. And even when both of these
    hurdles cleared, the AI is only as good as the knowledge that is coded into it.
    There is no emergent knowledge above and beyond the input and the ability to combine
    those building blocks. This does not mean that GOFAI does not reach new or surprising
    insights from a human user’s perspective: it just means that each of those insights
    can be traced back to inputs supplied by human programmers.


    All of the above notions of “AI” can work together: we can have automatic processes
    by which ML algorithms tag visual inputs and are thereafter reasoned about using
