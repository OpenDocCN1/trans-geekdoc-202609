  md: 'international efforts in AI research, development, and use, as before (Giordano,
    2013; Lanzilao, Shook, Benedikter, & Giordano, 2013; Tennison et al., 2017) we
    must once again – and perhaps consistently – ask: which military; what ethic?
    Such inquiry is important to define the possibilities and problems generated by
    uses of increasingly aAI, and establish process(es) to inform realistic and relevant
    perspectives, guidelines, and policies for direction and governance (Danielson,
    2011). And we opine that apace with developments in AI, this endeavor should be
    – and remain – an interdisciplinary, international work-in-progress.


