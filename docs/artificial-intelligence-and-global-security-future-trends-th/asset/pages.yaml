  md: '# “Something Old, Something New” – Reflections on AI and the Just War Tradition


    Timothy J. Demy


    # Abstract


    This chapter presents reflections and considerations regarding artificial intelligence
    (AI) and contemporary and future warfare. As “an evolving collection of computational
    techniques for solving problems,” AI holds great potential for national defense
    endeavors (Rubin, Stafford, Mertoguno, & Lukos, 2018). Though decades old, AI
    is becoming an integral instrument of war for contemporary warfighters. But there
    are also challenges and uncertainties. Johannsen, Solka, and Rigsby (2018), scientists
    who work with AI and national defense, ask, “are we moving too quickly with a
    technology we still don’t fully understand?” Their concern is not if AI should
    be used, but, if research and development of it and pursuit of its usage are following
    a course that will reap the rewards desired. Although they have long-term optimism,
    they ask: “Until theory can catch up with practice, is a system whose outputs
    we can neither predict nor explain really all that desirable?” Time (speed of
    development) is a factor, but so too are research and development priorities,
    guidelines, and strong accountability mechanisms.


    Keywords: Ethics; just war tradition; history; values; ideas; framework


    ¹See Johannsen et al. (2018, p. 17). Their concern echoes that of Rubin, Stafford,
    Mertoguno, and Lukos, cited above, who state: “Many AI researchers seem to have
    lost their way in recent years and should be investigating core problems such
    as how a person reasons” (2018, p. 13).


    ²These are widely acknowledged concerns. Cf. the work of the AI Now Institute
    and annual reports at ainowinstitute.org and other similar organizations. Regarding
    AI challenges and the role of philosophy, see Deutsch, D. (2012). Philosophy will
    be the key that unlocks artificial intelligence. The Guardian, October 3. Retrieved
    from https://www.theguardian.com/science/2012/oct/03/philosophy-artificial-intelligence.'
