  md: 'investigates these issues and introduces some basic guidelines as to how to
    think about the ethical issues involved.


    # What Is AI?


    What is AI? The most famous attempt to connect it to human intelligence was Alan
    Turing’s (1950) “imitation game”, better known as the Turing Test, which involves
    a machine demonstrating human-level linguistic performance that can deceive a
    judge into thinking they are conversing with another human.

    But of course, we use what we term “AI” for far more than deceptive chatbots.


    # Recent, Influential Definitions of AI and Its Goals


    So, AI is now variously defined; Marr (2018) lists six different definitions currently
    used by leading AI companies. For example, the Sony Corporation (2018) ethics
    guidelines offer the following definition: “AI means any functionality or its
    enabling technology that performs information processing for various purposes
    that people perceive as intelligent, and that is embodied by machine learning
    based on data, or by rules or knowledge extracted in some methods.”


    A common thread can be discerned through the various definitions, though: Vallor
    and Beky (2017) posit the real goal of most AI research is “systems that can emulate,
    augment, or compete with the performance of intelligent humans in well-defined
    tasks.” Russell and Norvig’s (2002) textbook *Artificial Intelligence: A Modern
    Approach* further disambiguates this approach of seeing AI as something that attempts
    to “emulate, augment, or compete with the performance of intelligent humans” by
    providing different ways of defining AI. These possibilities arise from defining
    AI in terms of its *telos* along two axes; is an AI trying to match or surpass
    human abilities in rational thinking, or in the sophistication of its behavior?
    Accordingly, should we assess AI according to how it thinks, or by what it does?


    # Artificial Versus Natural Intelligence?


    For our purposes in thinking about AI and space war, a useful distinction is between
    “natural” and AI. Per Russell and Norvig, the idea of intelligence seems to involve
    goal-oriented, problem-solving behavior that, even if not ideal, can at least
    match some human capabilities in thinking or acting. Presumably, natural intelligence
    evolved to solve the problems of evolution, most generally the need to survive
    and reproduce, by having (to paraphrase, *mutatis mutandis*, Popper on the scientific
    method) ideas about survival strategies die in our stead. Those general goals
    then resulted in various subgoals as various evolutionary mechanisms themselves
    evolved, until natural human intelligence became capable of being unconstrained
    from those original goals, free to seek new goals of its own, even ones antithetical
    to survival and reproduction. As we began to conceive ways of'
