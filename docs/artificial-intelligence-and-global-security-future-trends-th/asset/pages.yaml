    aspects. That will involve thinking about moral agency, and ultimately moral reasoning
    which produces moral agency.


    # Continuum Argument


    Before we tackle moral reasoning and agency, it is worth looking more deeply at
    the idea that AI is so very different from other technological advances in warfare
    that have preceded it. The claim that AI will revolutionize warfare hinges on
    AI being markedly different from “traditional” technological advancement. Paradigm
    types of traditional technology include swords, bows and arrows, rifles, and a
    myriad of nonsmart vehicles: helicopters, jeeps, etc. If we can establish that
    these tools of war are continuous with AI technologies in the ways that count,
    then this gives us good reason to think that the moral landscape of war will not
    be turned upside down by the integration of AI to the battlefields. Here is the
    argument from analogy:


    +   (1) Mundane technologies used in war are relevantly similar to AI technologies
    that will be used in war.7


    +   (2) Traditional technologies used in war are morally ordinary; they enable
    human actors to do good and bad things, but they do not shield human actors from
    moral responsibility.


    +   (3) So, AI technologies are morally ordinary.


    Premise (1) is the contentious one, so we will start with the less controversial
    second premise and then defend the first by looking at a variety of cases.'
