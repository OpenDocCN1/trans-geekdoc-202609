    # AI: Future Forecast of Global Security


    Although the current level of our national investment in this area lags behind
    that of China and Russia, the United States is striving to develop partnerships
    with the corporate world and other nations, especially the United Kingdom, to
    develop AI technologies that will help to achieve global security. The United
    States and the United Kingdom view China and Russia''s emphasis on AI as an implicit
    threat to global dominance. As such, a partnership between nations is essential
    if we are to become technologically superior. The United States must invest in
    the development of its youth''s scientific abilities and technical expertise to
    ensure that future generations will be secure. AI will continue to contribute
    to our understanding of the cyberspace environment. Cyberspace refers to those
    networks, from sea floor to space, that support and provide a global security
    network. We anticipate that the future battlespace will become more complex as
    the number of AI systems continues to develop. Nations, agencies, and NATO must
    make it a priority to prepare for a future that will be replete with AI networks
    (Masakowski, 2019d; Kasapoglu & Kirdemir, 2019; Jans, 2018; NATO Technology Trends
    Report, 2017). Their challenge is to develop universal standards for establishing
    the monitoring of these networks, a common ontology/language that allows information
    to be shared by nations, as well as a governance body to ensure ethical applications
    and use of these systems (European Commission, 2019; Masakowski, 2019c, 2019d,
    2019e).


    The command and control of the future will be a modular one where nations access
    an open service network that will enable interchangeability of systems vs striving
    to achieve interoperability. Numerous organizations and agencies are conducting
    research in AI technologies to develop tools that will support the warfighter
    (Lockheed Martin, DARPA, ONR, etc.). Scientists at MIT, Lincoln Labs, among others,
    are designing AI-enabled systems that will function independently of humans and
    work collaboratively with each other. The combination of AI and autonomous systems
    lends itself to the development of smart decision support systems that will support
    the future warfighter. Nations will be able to subscribe to an AI network to meet
    their needs within the context of each situation'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'or crisis they may face. Critical aspects in the design of future AI networks
    and cyber systems will include connectivity, communication, and context. Namely,
    AI systems that can optimize the distribution of information via enhanced connectivity
    will be essential for supporting neural networks in the future. However, AI ML
    neural networks must go beyond just connecting the dots of information. Rather,
    future AI systems will need to excel at sensemaking and achieve an understanding
    of context. In this way, such AI systems will empower individuals by providing
    context and a rationale for their recommendations. Intuitive AI systems will be
    developed in the future with advances in cognitive computing. One can envisage
    a future where AI systems will present options to humans that reflect cognitive
    processing, hypotheses testing, context evaluation, and ethical considerations
    that reflect human reasoning and decision-making processes (Kurzweil, 2006; Turing,
    1950). However, today humans still have the cognitive advantage for processing
    information within various contexts (Newell & Simon, 1972). At least for now,
    AI systems merely augment human decision-making by streamlining the data analysis
    problem and providing options for potential decisions that include probabilities
    of error.


    In contrast, human cognitive capacities enable humans to search their mental lexicon
    and select mental models based on their knowledge and expertise, to evaluate situations
    and make decisions. AI systems do not do this at this time. Rather, AI systems
    are excellent at reducing vast amounts of information but that is only useful
    if the system provides a means of sensemaking and prioritizing its recommendations
    and options based on situational context. We are far from doing this with AI at
    this time. AI systems in the future will need to be reliable, intuitive, and predictive
    and provide validation for recommendations made to the decision-maker. Sensemaking
    and validation will be required in future AI designs that will provide the decision-maker
    with actionable information.


    However, before we can build that future AI global network, there is work to be
    done. We need to develop intuitive, predictive, and anticipatory AI systems that
    can help humans identify emerging situations as a node/pulse of information that
    emerges from an integrated network of data points from across the neural network.
    AI must integrate information from an array of networks, from social media networks
    to distributed sensors. AI will need to integrate data into a recognition pattern
    that is predictive and evaluative to anticipate and predict events to prepare,
    if not prevent, situations evolving into a crisis. This type of anticipatory AI
    system design could assist in detecting adversarial intent and provide global
    alerts to agencies and militaries to harness the assets necessary to defend against
    adversarial actions before they occur.


    Designers would need to develop an AI network capable of being self-aware, self-defensive,
    and sensitive to potential intrusions and/or manipulation. Advanced AI networks
    will be resilient, reliable, agile and adaptive. Such designs will facilitate
    the ability to detect and deter intrusion and defend against potential adversarial
    attacks.


    Today, we merely wait for the crises to emerge and then respond. Often adversaries
    detect vulnerabilities within the network and exploit those to their advantage.
    We need to develop predictive and proactive AI systems in the future.'
