- pgno: 87
  md: 'From rocks to rockets and triremes to submarines, the development and usage
    of weapons has always sought to give advantage to the user and to minimize harm
    to the user. Whether the weapon is a stone, spear, longbow, bullet, artillery
    shell, aerial bomb, or cruise missile, the goal has always been to maximize the
    weapon''s effect on the enemy and simultaneously minimize vulnerability for the
    user. Technology changes, but the nature of warfare does not. Max Boot observes:


    > Technological advances will not change the essential nature of war. Fighting
    will never be an antiseptic engineering exercise. It will always be a bloody business
    subject to chance and uncertainty in which the will of one nation (or subnational
    group) will be pitted against another, and the winner will be the one that can
    inflict more punishment and absorb more punishment than the other side. But the
    way the punishment gets inflicted has been changing for centuries, and it will
    continue to change in strange and unpredictable ways. (2006, p. 471)


    The challenge in the present and in the future is to use AI technology ethically
    and in a manner that restrains war and human suffering rather than increasing
    them. New technology introduces micro and macro issues of scale in warfare, and
    the opportunities are many.


    As AI technology is being developed for national security purposes, what is needed
    is for there to be robust and thorough research and thought with respect to specific
    norms of application of the just war tradition and AI. A multidisciplinary approach
    of scientists, ethicists, philosophers, lawyers, policymakers, and others explicitly
    looking at AI and the tenets of the just war tradition would be extremely beneficial.
    That some are already doing this is commendable, but much more is needed. If this
    is done, perhaps all concerned will be able to avoid the pitfall of catching up
    that is so often prevalent with ethics, law, and technology. The use of any technology
    sets a course for disconnecting actions and ethics.


    However, in the same way that the military pioneered standards and safety in aviation,
    it may do so in the realm of AI. If so, it would be extremely valuable and commendable.
    If nothing else, this chapter is a call for engineers and ethicists, planners
    and philosophers, to actively engage with one another using the spectrum of humanities
    and the sciences to address the technological challenges of AI and future warfare.


    With respect to the history technology and the just war tradition, is AI different?
    Yes. Is it unique? No. Thus, the challenge is to understand how to combine the
    just war tradition and AI – something old, something new.


