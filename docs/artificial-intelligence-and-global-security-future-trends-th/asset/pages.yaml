    # Moral Reasoning


    If the above argument holds, it seems straightforward to say that AI is not a
    threat to human moral agency in war. However, to further buttress this argument
    we should consider the nature of moral agency in war, and what it would take for
    AI to reach that threshold. While we are skeptical that threshold is or will be
    crossed, it is important to know what and where that threshold is. How much like
    humans would AI have to be to be considered as moral agents?


    In order for AI to be moral agents, they must first be able to demonstrate moral
    reasoning. According to Henry S. Richardson moral reasoning is a type of reasoning
    directed at deciding what to do, and when successful issuing in an intention.x
    This is not the kind of abstract reasoning about what morality is or what morality
    requires of us, but rather a bunch of practical reasoning about what to do and
    how to do it. Intention is required for moral (and often legal) responsibility,
    which requires certain mental states, desires, and deliberation. What kind of
    moral reasoning is required for the kinds of moral autonomy and agency we ascribe
    with moral persons and the responsibility and accountability we ascribe to moral
    agents? It includes deliberation of different ends, effect, and reasons relative
    to a specific contexts and very often judging and responding to the intentions
    of other agents, but this is not just the deductive application of principles
    to a context; it involves moral judgement. Moral judgement (as a particular kind
    of moral reasoning) requires consideration of a wide range of moral considerations
    and elements that arise in a given case (as moral, as opposed to not morally relevant)
    and employing moral principles and ideas in a “sound” way. There are standards
    of good and bad moral judgement to be considered, not just the mechanical, logical
    application of rules and principles.


    In considering moral reasoning, different philosophers have differing conceptions
    that connect to their moral approaches and views of agency. We consider two, with
    the intention of seeing more what they have in common and what the basic outlines
    of moral reasoning might be. Aristotle, who is associated with a Virtue Ethics
    approach to moral questions, thinks about moral reasoning in terms of prudence
    or practical reasoning which is required to be deliberate and make choices relative
    to moral virtues. For him, both intellectual and moral virtues are required for
    the moral life, achieved through orientation of habit and proper desires. In addition,
    having the proper motivations and desires rooted in virtue will impact how effective
    one’s moral reasoning is. The virtuous person will just be better at prudence/moral
    reasoning because they are oriented toward the proper ends.xi'
