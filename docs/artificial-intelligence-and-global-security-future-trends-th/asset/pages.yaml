  md: '# Acknowledgments


    My long-standing interest in research and the topics of neuroscience, brain development,
    and cognitive psychology has afforded me the opportunity to work with a number
    of outstanding individuals across civilian and military communities. I believe
    that our thinking is a tapestry woven throughout the course of our lives shaped
    by our education, experience, knowledge, and insights gained through research
    and dialogue with others. I am indebted to those friends, colleagues, mentors,
    and students with whom I have engaged and learned from over the years. Indeed,
    they are far too numerous to mention here. However, I would like to share the
    following acknowledgments with you regarding those who contributed to making this
    book a reality.


    Please allow me to acknowledge the contributions of my contributing authors for
