- pgno: 131
  md: 'This information is critical, not only to companies hoping to avoid fines and
    other penalties, but to customers themselves. According to a recent report from
    RSA, data privacy concerns are sky high right now. The report found that 80% of
    respondents consider financial and banking information the top concern while 72%
    consider personal identity information a significant area of concern. More than
    half of millennials are concerned with personal information being used for blackmail.
    A Harris Poll last year sponsored by IBM backed this up, finding that three quarters
    of global consumers would not buy a product or service from a company if they
    didn’t trust that company to protect their data.


    # # Benefits and Drawbacks of AI


    The Association for the Advancement of Artificial Intelligence, researchers working
    to identify critical gaps in knowledge that could be addressed through improved
    research and development, describe the range of definitions for AI as broad but
    all bounded with the standard as being bound by a human reference (Lawless, Mittu,
    Sofge, & Russell, 2017). AI is a type of machine learning algorithms that identify,
    understand, and predict patterns in data. The program is an algorithm that essentially
    uses data as a relational map between a set of inputs to map to a corresponding
    unique set of outputs (Nevala, 2017). This relational map is then used to make
    predictions, likely outcomes, or identify anomalous or unexpected behaviors in
    these data based on applying known rules set by humans (Nevala, 2017). The concept
    underpinning machine learning is to give the algorithm a massive number of “experiences”
    (training data) and a generalized strategy for learning, then let it identify
    patterns, associations, and insights from the data. In short, these systems are
    trained rather than programmed (Henke et al., 2016). That said, these algorithms
    through the advances in computational power, massive amounts of data, and researchers
    dedicated to developing these technologies are pushing the frontiers of needing
    human rule sets.


    Machine learning algorithms – supervised, unsupervised, semi-supervised, and reinforced
    – are categorized by the way in which they are trained. Kimberly Nevala provides
    a primer covering the general uses, applications, and data requirements that speaks
    cogently to the categories of these methods and why commercial entities are interested
    in developing such technology (2017). Evidently, a great deal of knowledge and
    work goes into understanding these methods, the voluminous data needed to support
    the various methods, and the acquisition pipelines to get this data, i.e., “[The]
    governance policies and the data ecosystem must support exploratory environments
    (often referred to as sandboxes) as well as production environments” (2017, p.
    50). One of the most important aspects to understand about AI and its geopolitical
    and economic effects is how it can change the current global order. It facilitates
    the ability for authoritarian governments to monitor, understand, and control
    their citizens far more closely than ever before. Nicholas Wright in Foreign Affairs
    affirms because of this ability, “AI will offer authoritarian countries a plausible
    alternative to liberal democracy, the first since the end of the Cold War” (2018,
    p. 1).'
