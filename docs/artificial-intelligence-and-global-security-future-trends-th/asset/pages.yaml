- pgno: 82
  md: 'Presently, the primary document of the US Department of Defense (DoD) with
    respect to utilization of AI is the four-page US Department of Defense Directive
    Number 3000.09 “Autonomy in Weapons Systems” of November 21, 2017 (with Incorporating
    Change 1, May 8, 2017).5 This document states there must be a human being with
    veto power over any action an AWS might take in a combat situation. Given the
    course of technological development and use in warfare, the permanence of such
    veto power is questionable.


    The US military is investing significant amounts of money and want into AI research
    and implementation. In so doing, US and other militaries need and want to understand
    the opportunities as well as the limitations of AI. Those concerned must continually
    monitor both of these ends of the spectrum for rapidly developing AI technologies
    in general as well as for ongoing research, development, acquisition, and implementation
    of AI in the realm of military operations (cf. Cummings, 2017; McLemore & Lauzen,
    2018). However, at present, the US and competing militaries are moving forward
    despite uncertainties.


    In February 2019, the US Department of Defense released its AI strategy summary,
    titled “Summary of the 2018 Department of Defense Artificial Intelligence Strategy:
    Harnessing AI to Advance Our Security and Prosperity” (hereafter referred to as
    the 2018 AI Summary). This release followed an Executive Order that created the
    American Artificial Intelligence Strategy.6 Along with this came the establishment
    of the DoD Joint Artificial Intelligence Center (JAIC) whose purpose is to evolve
    and incorporate AI into national defense strategy.


    In part, the preface of the 2018 AI Summary states: “As stewards of the security
    and prosperity of the American public, we will leverage the creativity and agility
    of our nation to address the technical, ethical, and societal challenges posed
    by AI and leverage its opportunities in order to preserve the peace and provide
    security for future generations” (US Department of Defense, 2019). The document
    continues and entails two sections: strategic approach and strategic focus areas.
    In the latter, before the document’s conclusion, there is a one-and-a-half page
    section titled “Leading in military ethics and AI safety” (US Department of Defense,
    2019, pp. 15–16).


    On the whole, the document and the actions of the US Department of Defense provide
    the establishment of a baseline of policy to “harness AI to advance our [US] security
    and prosperity” as noted in the summary’s subtitle. This is a necessary and desirable
    response to a field of rapid and exponential growth. It is also ambitious and
    optimistic. Quite accurately, the 2018 AI Summary states: “AI is rapidly changing
    a wide range of businesses and industries. It is also poised to change the character
    of the future battlefield and pace of threats we must face”


    5See https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodd/300009p.pdf.


    6US Department of Defense. (2019, February 12). DoD unveils its Artificial Intelligence
    strategy. Retrieved from https://dod.defense.gov/News/Article/1755942/dod-unveils-its-artificial-intelligence-strategy/.
    Accessed on April 20, 2019. For the summary, see https://media.defense.gov/2019/Feb/12/2002088963/-1/-1/1/SUMMARY-OF-DOD-AI-STRATEGY.PDF.
    Accessed on April 20, 2019.'
