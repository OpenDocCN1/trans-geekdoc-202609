- pgno: 139
  md: 'The change to company standard practice would have to address disclosure and
    require being upfront with the user about the intent of the research. Moreover,
    the terms of service agreement would need to be more easily understood, i.e.,
    “Facebook can, in fact, improve their terms of service in such a way that the
    expected norms are included as part of the base standard, but that expectations
    that need to be waived are communicated effectively and consented to (either negatively
    or positively) by the user” (2016, p. 19). There is another complication that
    these services are global and accessible by users across the globe. Any lasting
    change would have to consider an international audience. Unfortunately there is
    much more at stake for the collective society, yet options are unclear.


    In the United States, it is largely up to the consumer to understand the consent
    that is given through privacy policies and terms of agreements since there exists
    a patchwork of regulation and entities responsible for regulating this space.
    However, there are other countries around the world that recognize the right to
    privacy and are leading the way in protecting the consumer that may ultimately
    change practices in the United States, but even the EU''s GDPR is not a panacea.
    Detecting violations and assigning penalties are proving to be quite challenging.


    Informed analysis of the ethical and legal issues requires an integrated approach
    that looks to include norms also embraced in international law (Giordano, 2015).
    Ralph Schroeder and Jamie Halsall in a summary article interviewed several business
    leaders and found,


    > [T]here is a shared sense that the existing regulatory environment [i.e., big
    data policies] fail to be transparent, clear, fair, and consistent. [...] One
    area of particular friction surrounds the issue of privacy and personal data.
    The law has lagged behind both the growth in personal data use and developments
    in technical and statistical anonymization techniques. There is also a lack of
    standardization of privacy practices across jurisdictional boundaries. These failings
    are reflected in a somewhat piecemeal response to the personal data issues in
    industry, and there is still no accepted standard for how such issues should be
    treated – or even what the appropriate definition of personal data should be.
    Voluntary standards or codes of conduct, according to interviewees, would be a
    good first step given the likely intractability of a truly global privacy regulation.
    (2016, p. 11)


    Mobile applications and the internet are individual resources that are used globally.
    Thus, data collected as a byproduct of these activities are also regulated according
    to the laws in each country. Lasting protections would need to consider and address
    these realities.


    One option to deal with difficult to detect, high volume offenses, that are incrementally
    damaging behaviors could be a corrective tax. Miriam Baer lays out a well-argued
    case for using a Pigouvian, or corrective tax, to deal with Fourth Amendment violations
    that stem from illegal search and seizure by police (Baer, 2017). In an imagined
    implementation scheme, local police departments'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'would be charged an annual fee based on the volume of search activities, the
    risk the activity conceals intentional misconduct, and the harm that comes from
    such misconduct. Putting the obvious argument aside that the goal of both is to
    maintain Fourth Amendment protections, there are many parallels described in the
    implementation that would likely hold for data collection and privacy.


    It would incentivize curbing data collection by tying violations to the volume
    of incidence, and in theory might improve reporting of violations since the penalties
    would be tied more to the probability of intentional violation rather than gross
    negligence. Its greatest strength would likely be to create awareness by way of
    the tighter regulations around the issue of data collection and privacy by understanding
    the social costs rather than individual damages that come from a more command
    and control regulatory regime (Baer, 2017). This scheme is preventative by nature
    and also has the benefit of avoiding lengthy and costly legal proceedings for
    violations that occur after the fact (Baer, 2017). There are even more drawbacks
    though as identified in the same scheme. Creating a regulatory body comes with
    mortgages that maintain such a bureaucracy and enforcement, politics, and underwriting
    fines because of a small number of bad actors that cause the greatest damage (Baer,
    2017). Unlike the scenario examined by Ms. Baer which examines the behavior of
    government provided services, the issue of data collection and breaches of privacy
    ability of entities deals with commercial business that can also pass on these
    costs to consumers.


    The tax is by no means an end all answer but does make the issue collectively
    become a social discussion. Interestingly enough, the same technology employed
    for the privacy corpus could be employed to address a range of the deficiencies
    discussed above.


    # Discussion


    It is difficult to imagine how something so seemingly trivial as terms of use
    or privacy agreements could enable paranoid outcomes such as threatening the US
    military or facilitating abductions. Even more alarming is the fact that abducting
    an individual''s online presence means it might take years to realize anything
    happened. But, "[T]he significance of privacy policies greatly exceeds the attention
    paid to them: these documents are binding legal agreements between website operators
    and their users, and their opacity is a challenge not only to Internet users but
    also to policymakers and regulators" (Wilson et al., 2016, p. 1338). These are
    policymakers that are influenced by the significant money discussed in the opening
    of this chapter no less. These agreements are ignored by users because, like mortgage
    documents, they tend to be long and difficult to understand (Wilson et al., 2016).
    It also does not help that the average citizen takes for granted that they live
    in a society with governance backed by the rule of law. How then can users be
    expected to agree and thus consent to accept technologies where the full understanding
    and outcomes of their use are unknown? More importantly, when individuals surrender
    their privacy, they also unwittingly surrender their individual freedom as they
    have allowed others to dictate their choices.'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'These questions are not purely legal, either. They present confluent ethical
    and policy issues. The interests of the public in advancing and sustaining national
    security must be weighed in comparison with the private interest in protecting
    individual rights (Giordano, 2015).


    The current paradigm is problematic in both how data are collected and because
    the sheer number of terms of service agreements and their complex verbiage leads
    many a user to scroll straight to checking the box without ever actually reading
    the text. The result is a collective norm of acceptance and a poor assumption
    that their privacy will be protected in the court of law. In reality anytime an
    individual shares data with a third party knowingly or not via agreeing to terms
    of use agreements, they waive their right to privacy because this technology is
    viewed as a public service through the eyes of the law. Recall, societal values
    are changing and are heavily influenced by the understanding of those examining
    the issue.


    How then can we be expected to make informed decisions about participating in
    social media platforms and email platforms when society uses these tools for routine
    functions? Every time one downloads an app or when a free service is provided
    on the internet, one is prompted to review a terms of service agreement. The current
    construct uses a checkbox to indicate an agreement for commercial entities to
    gain access, collect, and share data. What users often fail to consider is that
    these agreements grant permissions to a whole host of collectors and harvesters
    of their data in ways the user may not understand or in ways that take years or
    decades to fully understand. Similar to the complexity of bank mortgage documents,
    the language of these agreements is vague and filled with legal jargon often crafted
    to protect the interest of the bank or private industry, rather than to protect
    the rights of the user.


    Like a mortgage loan, this information must be fully disclosed before consent
    is given, but the risks are not clearly presented to the user or even known for
    that matter. Throughout the privacy discussion, particularly when discussing the
    three grand ethical traditions, there is a need to set and maintain a common frame
    of reference and ensure that an individual has the necessary information to make
    a sound choice, or in other words consent to an agreement. This means that the
    person involved should have the capacity to give legal consent; should be so situated
    as to be able to exercise free power of choice, without the invention of any element
    of force, fraud, deceit, duress, overreaching, or other ulterior form of constraint
    or coercion; and should have sufficient knowledge and comprehension of the elements
    of the subject matter involved, so as to enable him/her to make an understanding
    and enlightened decision (Giordano, 2015). The issue with using such technology
    is clearly complicated because users often do not understand the potential dangers
    of using such technology and have very little incentive to educate themselves
    because the choices to use such services are routine yet the impacts are incremental
    and mundane.


    Apps and the internet essentially create the ultimate marketplace where companies
    can sell the same item to different people at different prices based on the profile
    of each individual consumer (Wheelan, 2002). Commercial entities and the industry
    argue that collecting this information allows them to deliver better,'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'more tailored services for the user. Although that is a reasonable argument
    for this type of data collection, this approach does not reveal everything that
    they do with their data. Much less evident is the fact that the data collected
    from each user and their household and/or social network allows them to build
    a virtual and detailed personal profile of everyone who uses them and who might
    use their products in the future. The bottom line is that this technology has
    or will have the ability to create a virtual copy of an individual. Does this
    virtual copy need protections or does it have rights?


    This digital surrogate is a reflection of an individual but because of where this
    virtual exists will be owned by others. Whoever owns the algorithm and whoever
    owns the physical servers where these data are stored, is technically who will
    own the digital surrogate. Could this surrogate be interrogated and reveal attributes
    about the physical individual? It most certainly could reveal where and how to
    find them. It most certainly would reveal how one thinks, what they value, who
    they are connected to, and how they communicate with their network. There are
    certainly no protections for such a surrogate since most laws protect people by
    way of the physical boundaries that define citizenship and thus the prevailing
    laws that are in place for their protection. This issue is coming and may become
    even more important as people inevitably feel that personal privacy will eventually
    end.


    # Conclusion


    People simply need to know what data third parties would want to collect, why
    they want to collect it, who has access, how they have access, and how these data
    are used, before making informed choices about how sharing such data would enhance
    or detract from their welfare. Collectively different units of society would have
    varying views and acceptance about what to share, which would likely necessitate
    several canonical situational dependent vignettes for a broad understanding of
    said trade-offs, but it is choice in the end that matters. Ethics sheds some light
    on the troubles with circular logic and individual views on privacy, but falls
    short on how to extend the issue to social and global points of view. The technology
    and poor understanding of the potential dangers is also enabled by the same ignorance
    that makes it difficult to draw lines in the sand for regulations and privacy
    violations.


    In reality, there is something much larger, insidious, and potentially sinister
    at play. The engine of the surveillance economy feeds relentlessly off of the
    2.5 quintillion bytes of data generated each day. AI will only increase the capability
    to analyze, collect, and refine the data that will be used to target consumers
    who generate the data in the first place. Shoshana Zuboff (2016), a Harvard Professor
    and one of the most prolific writers on this topic, warns convincingly about the
    perils of what she calls “Surveillance Capitalism.” She argues that it’s not just
    our personal privacy at stake but fate of the liberal order as we know it.


    The lack of transparency is a consistent theme whether it applies to terms and
    agreements, development of algorithms and AI applications, or basic'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'understanding of how, for instance, Facebook advertising even works (Chin,
    2019; Hitlin & Rainie, 2019). In a recent WIRED magazine op-ed, Professors Olaf
    Groth, Mark Nitzberg, and Stuart Russell (2019) present an interesting alternative
    to the current Wild West approaches to algorithm development. The premise is based
    on the determination that algorithms can and do have lasting and permanent effects
    on society. They draw parallels to how the drug approval process works. These
    authors suggest that perhaps we consider developing a Federal Drug Administration
    type review process for algorithms before they are made publicly available. Such
    an endeavor could take too much time to orchestrate and implement for a situation
    of perceived urgency.


    This chapter collected the ideas from scholars and practitioners who study various
    aspects of privacy and puts forth several recommendations the individual can consider
    while the broader discussion on options for regulation are underway. There are
    no easy options, but education on the issue and collective discussion of the potential
    risks from these technologies is useful in highlighting the many loose ends that
    would need to consider in order for a lasting solution to be devised and accepted.
    Teeing up the idea that a digital surrogate needs protections or may have rights
    might be a hyperbolic but a useful example that sheds light on a nebulous and
    opaque discussion.


