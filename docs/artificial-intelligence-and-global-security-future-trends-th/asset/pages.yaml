    Before briefly discussing how we might build such an artificial conscience and
    what its content and architecture might look like, we should review arguments
    regarding the necessity of building one. Assuming an artificial conscience is
    possible, why build one?


    # Why Build an Artificial Conscience?


    While in general, I think the systems we build should encourage moral behavior
    and be morally praiseworthy, in this chapter I will focus on the defense context
    given the nature of this volume. The points I will make regarding an artificial
    conscience apply more generally, but are even more forceful in the context of
    military action and the use of force.


    Four important reasons to build an artificial conscience include: (1) that the
    use of autonomy in warfare is for evolutionary reasons a foregone conclusion so
    we need to get “ahead of the ball” by building in ethical reasoning into these
    systems from the beginning, (2) that US and Allied military doctrine requires
    it, (3) there will be national security-oriented competitive reasons to do so
    such that we prevent our adversaries from capitalizing on its absence, and (4)
    because morality demands it. Let’s discuss each of these in turn so that our exploration
    of an artificial conscience is appropriately motivated.


    First, there is ample evidence that deploying some combination of autonomous algorithms
    and platforms, semiautonomous machines, and human-machine teams and hybrid centaurs
    onto the battlefields of the future will provide a competitive advantage to the
    states and groups that do so. Human-machine teaming can serve as a force multiplier,
    allowing us to make more effective use of our most valuable resource – the creativity
    and ingenuity of our soldiers, sailors, airmen and women, and marines. Multiple
    laboratories and testbeds have demonstrated this already, and in several domains
    we already have mostly autonomous or semiautonomous platforms operating to great
    military effect (satellites, unmanned or remotely piloted aerial vehicles, missiles,
    etc.). There are no signs that this trend is slowing, and with appropriate technical
    development, militaries of the future that don’t leverage autonomy and human-machine
    teaming will be at a severe competitive disadvantage. Given these developments,
    it is incumbent upon us to develop the technologies that we know will be required
    to employ these platforms and teams in a morally permissible manner. This act
    will afford us the opportunity to prevent scenarios where we fail to build in
    the safeguards needed to forestall worst-case outcomes. Rather than pasting ethical
    governors and


