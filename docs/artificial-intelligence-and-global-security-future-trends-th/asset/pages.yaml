  md: '# Chapter 8


    # Ethical Constraints and Contexts of

    Artificial Intelligent Systems in National

    Security, Intelligence, and Defense/Military

    Operations


    John R. Shook, Tibor Solymosi and James Giordano


    # Abstract


    Weapons systems and platforms guided by Artificial Intelligence can be

    designed for greater autonomous decision-making with less real-time human

    control. Their performance will depend upon independent assessments about

    the relative benefits, burdens, threats, and risks involved with possible action

    or inaction. An ethical dimension to autonomous Artificial Intelligence (aAI)

    is therefore inescapable. The actual performance of aAI can be morally

    evaluated, and the guiding heuristics to aAI decision-making could incorporate

    adherence to ethical norms. Who shall be rightly held responsible for

    what happens if and when aAI commits immoral or illegal actions? Faulting

    aAI after misdeeds occur is not the same as holding it morally responsible,

    but that does not mean that a measure of moral responsibility cannot be

    programmed. We propose that aAI include a “Cooperating System” for

    participating in the communal ethos within NSID/military organizations.


    Keywords: Artificial intelligence; autonomous weapons; morality

    programming; ethical AI; communal ethos; ethics; military ethics


    # Introduction


    Decision technologies and artificially intelligent (AI) systems are being

    considered for their potential utility in national security, intelligence, and

    defense (NSID) operations (Giordano, Kulkarni, & Farwell, 2014; Giordano &

    Wurzman, 2016; Hallaq, Somer, Osula, Ngo, & Mitchener-Nissen, 2017).

    Given this trend, it becomes increasingly important to recognize the'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'capabilities, limitations, effects, and need for guidance and governance of
    different types of AI that can – and will – be employed in NSID settings. Perhaps
    one of the most provocative, if not contentious, issues is the development and
    use of autonomous AI (aAI) to direct targeting and engagement of weapons systems
    (Galliott, 2015). To be sure, accurate identification, selection, and engagement
    of targets involve acquisition, discrimination, and parsing of multifactorial
    information. Given that the end-goal of engagement is reduction or elimination
    of the targeted threat, it is critical to address and assess mechanisms and processes
    of signal discrimination and selection in terms of the technical effectiveness
    and the rectitude of action(s). If accurate target identification and threat-reduction
    are the defined ends (and regarded “goods”) of these systems’ operation, then
    discretionary accuracy (i.e., identification-discrimination-action; or more simply
    stated: “acquire-aim-fire”) represents an intrinsic aspect of any such functions
    (Arkin, 2010; Canning, 2006; Lin, Abney, & Jenkins, 2017). For an aAI system,
    the decision to engage or not engage axiomatically obtains and entails the necessity
    to independently parse information about relative benefit, burden, threat, and
    risk domains that are contingent upon potential action or inaction (Arkin, 2010;
    Lin, Abney, & Bekey, 2007). Thus, missional effectiveness can be seen as involving
    both technical and ethical dimension. By pondering if and how an aAI system could
    be ethical (Arkin, 2009; Asaro, 2006; Wallach, Allen, & Franklin, 2011), or asking
    why ethical aAI is needed (Canning, 2006; Danielson, 2011; Sharkey, 2011), the
    fundamental worry is about who shall be rightly held responsible for what happens
    if and when aAI errs and commits acts that are regarded as “wrong”.


    Posing these issues and asking such questions of ethics are essential to understand
    – and establish – standards of acceptable behavior in the contexts in which humans
    live. Ever more, such discussions must acknowledge the growing role(s) of technology.
    The hoped-for promise of AI lies in humanity’s recognition of these systems as
    extensions and enhancements of human capability and activity, but rarely, if ever,
    as a complete replacement for human beings and their involvement in decisions
    that establish vital contingencies. Yet, the trajectory toward specific forms
    of aAI delegates at least some of this decisional and actional responsibility.
    Therefore, we accordingly ask, to what extent may aAI systems meaningfully participate
    in the moral evaluation of their actions?


    Apropos the explicit point and purpose of ethics, any AI system cannot be properly
    evaluated beyond the contexts in which they are employed by humans – who uphold
    communal values and standards (i.e., morals and mores) of acceptable conduct.
    Therefore, the same holds true for the use of AI in NSID contexts. Senior NSID
    personnel are held responsible for the deployment of all instruments of intelligence
    and combat. Commanders want force to be applied intelligently, and AI will become
    an integral component of that paradigm, not a poor substitute for it.


    The use of AI in NSID will entail discrimination and execution of high-impact
    decisions and actions at faster-than-human speeds, but that does not mean that
    military or legal responsibility vanishes from sight. The computational'
