    of the issue by developing them early and in tandem with autonomy.


    Second, nation-states and groups concerned to use force in an ethically permissible
    manner already recognized this fact, and have science and technology need and
    requirement documents which discuss moral reasoning in autonomous systems. For
    example, the US Office of Naval Research has an active research program exploring
    moral reasoning in autonomous machines, and the US Army has a science and technology
    research requirement for exploring moral reasoning in ground autonomy. The Pentagon’s
    Joint Artificial Intelligence Command (JAIC)’s commanding general, LtGen Patrick
    Shanahan, has recognized the need for incorporating ethical concerns into the
    use of AI and is seeking a dedicated ethicist for the JAIC.⁴ Similarly, watchdog
    groups and nongovernmental organizations, such as the Federation of American Scientists
    and others, have called for autonomous systems to possess moral reasoning capability
    if they are to be deployed. The US and allied doctrine and science and technology
    requirements documents either explicitly, or implicitly through their emphasis
    on the laws of armed conflict and desire to use force justifiably, require us
    to develop and deploy something like an artificial conscience.


    Third, there are purely operational and strategic considerations in favor of developing
    and deploying an artificial conscience. In the past two decades, there was considerable
    discussion of the “strategic corporal” — the individual who despite not being
    high in the official chain of command is making decisions that have strategic
    upshot for whether wars are won or not. This is because seemingly small tactical
    decisions can have outsized strategic impact, especially in an environment where
    transparency and international press can quickly magnify the consequence of poor
    moral decision-making on the battlefield. For example, in the Iraq war, an entire
    platoon was rendered combat ineffective as an investigation was conducted regarding
    alleged killing of noncombatants. While the allegations proved to be false, the
    net effect was the same: US soldiers were off the battlefield rather than on it
    because of the effect of this misinformation.⁵ In a system where we fail to build
    in moral safeguards and ethical regulators into our semi-autonomous systems, it
    will be more difficult to police misinformation regarding the behavior of our
    human-machine teams. The concept of the strategic corporal applies to our algorithmic
    and semiautonomous “strategic corporals” as well.⁶


    Finally, whereas strategic and prudential considerations might require us to develop
    an artificial conscience, moral considerations require it as well. If an artificial
    conscience can help the soldiers of the future win wars more quickly and fight
    them more cleanly, minimizing collateral damage and giving moral bite to


