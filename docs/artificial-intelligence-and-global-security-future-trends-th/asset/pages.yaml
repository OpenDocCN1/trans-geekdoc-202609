  md: '# About the Contributors


    **Keith A. Abney**, MA, is senior lecturer in the Philosophy Department and Research
    Fellow of the Ethics & Emerging Sciences Group at California Polytechnic State
    University, San Luis Obispo. His areas of expertise include many aspects of emerging
    technology ethics and bioethics, especially issues in space ethics and bioethics,
    robotics, AI and cyberethics, autonomous vehicles, human enhancements, and military
    technologies. He is a co-editor of *Robot Ethics* (MIT Press) and *Robot Ethics
    2.0* (OUP) as well as author/contributor to numerous other books, journal articles,
    and funded reports.


    **James Canton**, PhD, is a global futurist, social scientist, serial entrepreneur,
    and advisor to corporations and governments. For over 30 years he has been forecasting
    global trends, risks, and game changing innovations.


    He is the CEO of the **Institute for Global Futures**, the Institute for Global
    Futures, a leading think tank that he founded in 1990. He has advised three White
    House Administrations and over 100 companies including the US Department of Defense
    (DoD), National Science Foundation and MIT''s Media Lab, Europe on future trends.


    Previously, he worked at Apple, and was a US policy advisor, investment banker,
    and founder of five tech companies. He is the author of *Future Smart*, *The Extreme
    Future*, and *Technofutures*.


