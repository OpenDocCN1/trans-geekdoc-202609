  img_proc: true
- pgno: 51
  md: 'We must anticipate the time when such systems will not respond in a directive
    manner to a human supervisor (Ilachinski, 2018; Sheridan, 1992).


    We must also consider how our adversaries will use these systems against us. We
    need to consider how to manage AI systems that will use reason and understanding
    in response to human directives. Leaders must acquire knowledge and experience
    in partnering with AI systems to lead with their help. AI systems will provide
    guidance, advice, options, and recommendations to leaders and accelerate the time
    for decision-making. This will be a challenge as we often don''t trust our GPS
    when driving in new areas. However, as AI systems become more reliable over time,
    we may well take their existence for granted and have a new set of expectations
    as to how we consider and use their input in our decision-making.


    Designing AI systems from a human biological perspective will help to develop
    systems that will be capable of functioning in a human-like manner. Autonomous
    systems will be transformed from being an extension of human decision-making in
    the battlespace to become an independent agent capable of sensing, targeting,
    and killing, independent of their human partner or supervisor. This will take
    time, but one can forecast the future in terms of what AI has afforded us to date.
    We already rely on it for advising us on a range of issues in our lives from medical
    to financial; we are using AI to inform our decision-making.


    Autonomous systems, embedded with AI, will be designed to be self-aware and learn
    to understand relationships in the environment, and use AI cognitive models to
    inform the characteristics of potential targets in their environment. Systems
    designed with self-awareness will transform and enhance a system’s capability
    as it gains perspective of self and can evaluate a variety of options and potential
    outcomes (Dobbyn & Stuart, 2003; Dutt & TaheriNejad, 2016). While these advances
    sound promising, they raise several ethical and moral reasoning issues regarding
    second- and third-order effects on the warfighter, the leader, as well as society.
    It is incumbent on leaders to evaluate advances in these technologies in terms
    of their value in military defense, as well as understanding their impact within
    the context of societal ethical values. Transparency of a leader’s decision-making
    processes and the evaluation of potential consequences are essential if we are
    to sustain trust between the military and civilian population. The potential for
    overriding the barriers of security and ignoring the ethical consequences of such
    actions should be taken as a warning sign (Giordano, Kulkarni, & Farewell, 2014).


    The ethics of technology, a recent discipline of study and scholarship, is a new
    topic for most leaders. Today, there is a gap between the development of AI technologies
    and its ethical application on the battlefield. Military leaders must make ethical
    decisions that are often challenging when using AI technologies. For the most
    part, leaders do not necessarily understand what AI technologies do and rely solely
    on their output. They fail to understand the system design but must consider all
    aspects of potential consequences of violating societal norms and/or potential
    collateral damage to the civilian population. Leaders must therefore achieve a
    level of understanding of AI as well as its benefits and risks associated with
    its use.


    Today’s commander must be adaptive and prepared to engage adversaries in conventional
    and asymmetrical warfare in the Third Offset Strategy landscape. Future warfare
    will become even more complex as advances in cyber-, neuro-,'
