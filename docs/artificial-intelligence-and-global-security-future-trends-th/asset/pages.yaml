- pgno: 114
  md: 'Note that in many cases these four capacities align and can be used non-problematically.
    Many times, unless we are involved in a deeply immoral enterprise, we do not walk
    around stricken by pangs of conscience, or if we do, it is about issues around
    which epistemic “brackets” need to be thrown for the present (think of a contemporary
    controversial issue about which many reasonable people disagree). Also in most
    cases, sensitivity, judgment, motivation, and skill align – I sense relevant facts,
    know what the right thing to do is, am motivated to do it, and follow through
    with a set of skilled actions to do it. When these things come apart, then we
    have qualms of conscience or work to do if, for example, I know what the right
    thing to do is but have problems doing it because of akrasia – the Greek term
    for weakness of the will.


    So whatever architecture our artificial conscience has, it likely needs to be
    able to possess moral sensitivity, moral motivation, moral judgment, and moral
    skill. What content will be an explicit part of or at least implicit in the operation
    of this architecture?


    For many, besides the question of whether it is even possible to build an artificial
    conscience, this will be the critical fabled “million-dollar question.” Whose
    justice and which morality should be built into an artificial conscience? A good
    place to begin is with classic moral and ethical theories that reflect the grand
    traditions in moral discussions taking place worldwide. These ethical theories
    serve as the backbone for most courses in professional military ethics. These
    are the three Cs discussed earlier: the virtue theory of Aristotle, Plato, and
    Confucius (Character); the deontology of Immanuel Kant (Consent); and the utilitarian
    theories of John Stuart Mill (Consequence). Do my actions and states of mind tend
    toward enabling the flourishing of myself and others and embody the virtues while
    avoiding the vices (Character)? Do my actions and states of mind respect the obligations
    and duties I have to other moral agents and bearers of rights like people (Consent)?
    Do my actions and states of mind produce consequences that are conducive to the
    greatest amount of happiness for sentient creatures like people and animals (Consequence)?
    This chapter is too short to do anything other than refer the interested reader
    to introductions to this literature, and to note two things about these three
    Cs.7 First, the three Cs are generally agnostic regarding metaphysics – that is,
    most people from most faith traditions and moral approaches can see the power
    of considering these questions. In fact, the natural law tradition contained in
    Christian and Islamic holy texts, for example, emphasizes the importance of using
    our God-given gift of reason to be able to discover truths and rationales about
    morality which speak to any person of reason (irrespective of their particular
    faith or metaphysical belief). This is important, as it allows us to know when
    “the little voice in our head” (telling us to do something we would all otherwise
    agree is irrational or evil) is one we should ignore or see a doctor about, rather
    than one reflecting deep-seated wisdom and truth about the universe. Second, the
    three Cs capture lots of the wisdom contained in other


    7Rhodes, B. (2009). An introduction to military ethics: A reference handbook,
    Praeger, or any number of introductory textbooks in normative ethics.'
