  md: '# # Space War and AI


    Keith A. Abney


    # ## Abstract


    New technologies, including artificial intelligence (AI), have helped us begin
    to take our first steps off Earth and into outer space. But conflicts inevitably
    will arise and, in the absence of settled governance, may be resolved by force,
    as is typical for new frontiers. But the terrestrial assumptions behind the ethics
    of war will need to be rethought when the context radically changes, and both
    the environment of space and the advent of robotic warfighters with superhuman
    capabilities will constitute such a radical change. This essay examines how new
    autonomous technologies, especially dual-use technologies, and the challenges
    to human existence in space will force us to rethink the ethics of war, both from
    space to Earth, and in space itself.


    Keywords: AI ethics; moral status; autonomous weapons; just war theory; moral
    luck; independence thesis; red line analysis; existential risk; dual-use; space
    war


    # ## Introduction


    The ongoing debate over lethal autonomous weapons systems (LAWS) has for now made
    distinctly terrestrial assumptions; the robots doing the fighting and killing,
    whether on land, under the sea, or in the air, have always been assumed to be
    part of terrestrial forces. But as military planners have long understood, space
    is “the ultimate high ground”; and despite the Outer Space Treaty, there is an
    increasing push towards weaponizing space. Inevitably, that push will involve
    LAWS (Lt Gen David Thompson, Vice Commander USAF Space Command, ISME Keynote,
    June 29, 2019), as all the reasons for adopting them in terrestrial contexts,
    including problems of latency and accuracy, as well as other ways in which human
    control is suboptimal, apply to an even greater degree in space. Such weapons
    systems could easily also have nonmilitary purposes in space, making the ethics
    of their dual-use deployment even more complicated. This essay'
  merge: -1
  img_proc: true
