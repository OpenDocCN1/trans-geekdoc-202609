  md: 'learning, etc. – the core principle of all ML is the same. You present a large
    training data set to the AI, the larger the better. You then label some of these
    items as successes and others as failures. And then you identify the variables
    you want the AI to take into account when determining which states of the variables
    are indicative of success. For example, you could show a visual ML AI a huge stack
    of pictures of animals and tag the ones that have sheep in them. The AI will then
    train on this stack and can be used on a new picture outside of the training set.
    If the training set was sufficiently broad, and the new picture is relevantly
    similar to the training set, we expect the algorithm to get the right verdict
    about whether there is a sheep or not. It turns out that such algorithms are often
    incredibly effective. For example, Lello et al. (2018) have designed an algorithm
    that can pinpoint one’s height from just their genome with an accuracy of within
    a few centimeters.²


    And while ML is amazing, it has some glaring flaws. Let us return to the sheep
    example. Janelle Shane (2018) highlights how brittle and unintelligent ML can
    look with even minor shifts between the content of the training set and the target.³
    Imagine in your mind the picture of a sheep. What do you see? A safe bet is that
    there are rolling green pastures with white puffy sheep dotting the landscape,
    perhaps a stacked-stone fence in some English countryside. This is exactly what
    the training data looks like, and it means that if you put a sheep in a different
    context, the ML algorithm gets very confused. If you put a sheep on a leash, the
    AI thinks it’s a dog. If someone spray paints the sheep orange to make them more
    visible and less attractive to thieves, the AI tags them as orange flowers. Or,
    if you have some white rocks on a lush green hillside, the AI is likely to “hallucinate”
    sheep. In short, the AI’s accuracy is incredibly brittle, lacking the common sense
    that sheep are not identical to the cluster of concepts that they are often associated
    with. Instead, you can shift one or the other of these concepts (paint a sheep
    orange, put them on a leash, set them in a tree) and a human will easily identify
    them still as sheep.


    This sheep example highlights two of the persistent problems for ML AI. First,
    ML is a black box: it takes whatever variables you give it and generates an association
    with those variables and the “successes” labelled in the training data. But this
    association is absolutely opaque to all human users. Not only does this mean the
    AI may be inaccurate, but it may base its reasoning on totally irrelevant factors
    without users even knowing. In extreme cases, this can lead to developing racially
    biased AI algorithms that actively perpetuate injustice. The second flaw with
    ML AI is its brittleness. This is acceptable when identifying sheep, in which
    case the failures are harmless and comical. But this is unacceptable when identifying,
    say, military targets.


    One might think the missing link for ML can be filled in by augmenting AI with
