  img_proc: true
- pgno: 96
  md: 'for the decision to go to war, and so the independence of the two consideration
    would remain a moral necessity.


    For humans in traditional warfare this understanding of moral luck appears to
    support, if not prove, the independence thesis. One does not choose what country
    one is born into, and so one’s birth nationality and initial citizenship cannot
    be other than a matter of luck. Nazi soldiers did not deserve to be born in Germany,
    any more than American soldiers deserved to be born in the US. They accordingly
    cannot be held responsible for their government’s decisions to participate in
    World War II, whether just or unjust. Their only moral responsibility was to obey
    the moral rules of jus in bello, with jus ad bellum playing no role; to insist
    otherwise seems to insist on moral luck.


    Generalizing, typical native-born soldiers in any country cannot be held responsible
    for their civilian government’s decisions to go to war, and hence considerations
    of jus ad bellum cannot pertain to their moral responsibilities in the conduct
    of their duties as warfighters, regardless of the (in)justice of their cause.


    But the reality is not so simple. First off, political leadership rarely if ever
    declares war ignorant of the likely strategies and tactics of its military. Secondly,
    in democratic countries, soldiers are typically also voters, and voters may share
    in the collective responsibility of going to war determined by their elected leaders.
    One may protest that they did not vote for the war, or even for the elected leader;
    but in a society in which one is free to emigrate, citizens have made the voluntary
    choice to remain a part of a society that wages this war.


    Result: in both jus ad bellum and jus in bello, the “ought implies can” principle,
    when taken seriously, does mean moral luck can play no role in correct attributions
    of moral responsibility. Accordingly, any version of act consequentialism appears
    doomed as a defensible principle – to hold either soldiers or political leaders
    or citizens, combatants, or noncombatants responsible for what happens due to
    luck is to engage in moral error.


    Accordingly, a better understanding of JWT must seek to minimize the role of moral
    luck in formulating its correct principles. That also implies that moral evaluation
    would ideally be agent-based, not act-based; moral evaluation is properly of the
    character of an agent, in terms of the rational opportunities actually available
    to one, rather than the act that they did or did not do, without sensitive consideration
    of what capabilities – what liberties – were actually open to them.


    And introducing LAWS will complicate this argument. First off, moral luck is not
    directly an issue for robots unless/until they attain Kantian autonomy. Decisions
    to go to war are always a function of perceived odds of success, as a military
    option versus continued negotiation/surrender. Hence military leadership may inform
    civilian leadership that using/not using LAWS affects odds of military success
    (if not, there’s no reason to use), and hence jus ad bellum considerations.


    This appears to support the independence thesis in JWT, then – soldiers cannot
    decide whether to start wars; they only have a real choice over their conduct
    within them. One has no control over the country in which one was born, or whether
    one was drafted to serve in that country’s armed forces.'
