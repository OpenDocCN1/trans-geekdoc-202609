  img_proc: true
- pgno: 196
  md: 'Returning to two of Abney’s adopted definitions, we examine “robot” and “LAWS”
    in the interest of narrowing toward global security concerns. For the first term,
    “robot,” Abney cites the definition, “a machine, situated in the world, that senses,
    thinks, and acts.” Additionally, Lethal Autonomous Weapons Systems, or, as commonly
    abbreviated, LAWS, are robots that are designed to kill humans. Our terms now
    defined to the narrower focus required; we next turn to AI technological capabilities
    before discussing the application of anticipatory ethics.


    # AI Technology: Are We There Yet?


    We may never “get there” in creating AI that passes the Turing test – an artificial
    mind capable of thought and moral decision-making wholly and completely independent
    from humans. However, we have already arrived at a near-Turing point in AI development
    where outcomes in specific, human-driven scenarios can approach and emulate Turing-AI
    outcomes. Therefore AI ethics must immediately address the concerns of automated,
    human-in-loop, and augmented-human weapons of warfare. In other words, the current
    state of AI technology necessitates near-Turing-test ethics.


    William D. Casebeer proposes in his chapter that we aggressively develop the “artificial
    conscience.” He argues that morally autonomous AI are not only possible but a
    requirement in modern warfare that possesses power but lacks a just war responsibility.
    Like Hart and Shanks Kaurin, he agrees that questions of both moral knowledge
    and the nature of morality are central to any practical application of AI. Furthermore,
    warfare and security AI demand consideration of Colonel (retired) Charles Meyers’
    “three Cs” of character, consent, and consequence. Casebeer argues that the current
    military development of automated weapons and machine-human killing teams requires
    that we get “ahead of the ball.” We must examine and apply moral coding into these
    systems even if AI does not yet have moral agency.


    Although not contending that AI is currently morally capable of moral sensitivity,
    judgment, and motivation, Casebeer argues that creators of human-in-the-loop and
    autonomous systems must, for now, metaphorically embody these artificial “thinking”
    processes. As such, an “artificial conscience” already exists – what is rapidly
    shifting is the level of sophistication possible in encoding that conscience.


    One example that we can use to exercise Meyers’ three Cs immediately comes to
    mind: area-denial sentry guns. In the past decade, North Korea posted Samsung-designed
    robot sentries to deny access to the demilitarized zone and fire rubber bullets
    – but the original design was a stationary LAWS with lethal ammunition. The design
    and use of these systems must address the situations under which moral character,
    consent, and consequence come into play. Does the system have the character of
    discriminating friend (civilian or military) from foe (enemy combatant)? Children
    from adults? Does the system involve a human in the consent loop, or is the fire
    mode automatic with no human involved? What are'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'the consequences of codifying or not codifying these metaphorical moral components?
    Area-denial machines currently exist. Although upgrading these to LAWS is illegal
    by current international law conventions, they could be assembled and employed
    in various conflict situations. Area-denial scenarios may not breach an agreed-upon
    definition of war, but their potential for dual-use exacerbates conflict and tensions.


    Although it is improbable AI will achieve sentience in the 10-year timeline, AI
    ethics must stay ahead of that development curve. Indeed, the automation of many
    processes – especially weapons-based killing – may not pass the litmus test for
    acting entirely independent of human decision-making. Yet, automated weapons systems
    are (potentially) capable of pulling a trigger, scanning an area and killing single
    and multiple targets, and – if fitted for them – launching city-destructive missiles,
    whether intentionally or unintentionally prompted by a human. Nation-states or
    nonstate actors could potentially employ LAWS in the field in many of these ways
    in the short term. Any attempts to fully automate these weapons warrant stringent
    AI ethical due diligence. But if AI technologies and systems are not sentient,
    can they be moral? And if not, how should ethics be operationalized?


    # Can LAWS Be Moral?


    Hart and Shanks Kaurin observe that even the most advanced AI-driven systems are
    tools – and not agents – of war. Laying out assumptions about war and moral agency,
    the two scholars first examine the existential nature of war. It is only after
    establishing this baseline definition of war, they reason, that we then can understand
    our relationships to war as moral agents.


    Hart and Shanks Kaurin put forth a twofold argument establishing AI systems as
    mundane tools: (1) existing AI systems are a long way off from achieving moral
    agency, and (2) AI systems are on a continuum from nonmoral tools (such as swords
    and tanks) to moral agents (humans). AI currently falls squarely on the nonmoral
    end of the spectrum. To date, futurists have explored the prospects of how an
    agental AI might change the face of warfare. Until AI moral agency is realized
    (if ever), Hart and Shanks Kaurin conclude that we might consider how AI might
    change conflict as a nonmoral, sophisticated component of weapons technology.


    Giordano concludes similarly to Hart and Shanks Kaurin regarding the issue of
    AI and moral agency, premising that moral responsibility does not involve AI as
    an agent but can only be about AI as a follower of rules. If AI systems are amoral,
    then humans must be responsible for amoral AI. He describes a group or collective
    moral responsibility where humans in war are morally accountable for AI deployed
    in the field. LAWS deployed in combat, therefore, could theoretically perform
    within standards of conduct in the field as part of a human-machine team where
    LAWS are intelligently autonomous, and humans provide ethical autonomy. Giordano
    et al., however, do not stop short at an “ethics of using ΔI.” They make a reasonable
    claim that since AI can imitate human intelligence, perhaps we can also program
    moral intelligence.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Moral programming, Giordano et al. contend, could encode the military ethos
    of a specific warfighting group with a moral point of view and ethical practice
    specific to their communal perspective. Thus, LAWS that are morally pro-grammed
    would be part of a human-machine military unit that collectively accomplishes
    warfare objectives that are (optimally) consistent with a communal ethos.


    Regarding moral responsibility, Abney also seems to agree with Hart and Shanks
    Kaurin that LAWS are amoral, and therefore humans must bear moral responsibility
    for their use. He applies his red line analysis to scenarios of narrow AI in the
    domain of space, necessitating his consideration of the dual-use paradox and just
    war ethics. Casebeer is also interested in “artificially intelligent ethics” and
    how to use AI to build ethics into systems. He takes a general approach that would
    apply this to LAWS, whether operating independently or as part of human-machine
    teams.


    Thus, collectively, the authors in this volume analyze using similar general approaches:
    establish definitions for AI, discuss aspects of AI morality and ethics, and,
    finally, apply ethical principles. Before comparing applications of AI ethics,
    it is valuable to identify another piece of the puzzle relevant to ethics and
    technology: the paradox of dual-use.


    # ## The Dual-use Paradox


    Generally speaking, we can ask the dual-use question of all AI technology sce-narios.
    Any AI developed for positive use also might be bent to detrimental use. Dual-use
    thinking must be used not just for technological innovation and pushing the boundaries
    of technologies, but for exploring ethical issues.


    Any surveillance AI technology, once developed, might be weaponized into LAWS.
    Surveillance and identification are critical components of any mission to search
    and destroy. Unmanned vehicles such as the General Atomics Predator series aerial
    drones, initially used exclusively for air monitoring, have been arms-capable
    with Hellfire missiles and laser-guided bombs for targeted killing for years.
    What would this mean if adversaries deployed surveillance drones or LAWS over
    US airspace rather than over Syria or Pakistan? Can citizens assert rights to
    safety, security, and freedom to live without surveillance or physical threat?
    Dual-use development dictates that once rulers gain power, they are unlikely to
    relinquish it and will exercise that power to remain in control. A controlled
    populace may have little choice but to comply. Thus, dual-use AI development necessitates
    dual-use ethics. Responsible design, therefore, should integrate both multiterm
    thinking and dual-use anticipation ethics for LAWS and other AI technologies.


    # ## Ethics and AI


    Technologists, engineers, and thought leaders have been warning for years that
    AI-automatic killing is the next significant threat to humanity. Leaders on the'
