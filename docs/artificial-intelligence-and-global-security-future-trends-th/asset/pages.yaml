    # The Ultimate Scenario – Existential Risk


    Suppose alien robots attack, clearly intending to wipe out humanity (as in many
    sci-fi stories and movies, such as *Independence Day* (1996)) – would there be
    any *jus in bello* restrictions when the survival of humanity is at stake? Michael
    Walzer’s version of traditional JWT seems to make exceptions to *jus in bello*
    constraints in cases of “Supreme Emergency” (Walzer, 2006).


    Many authors (e.g., Cook, 2007; Toner, 2005) think Walzer is wrong about this.
    But I believe Walzer is correct, at least in cases of existential risk, and hence
    the independence thesis must be false. A utilitarian argument for the conclusion
    may be obvious, but traditional JWT is deontological, not utilitarian. But I believe
    an absolute deontological principle also supports the conclusion. Here is the
    argument:


    Deontologists routinely distinguish between prima facie (sometimes termed *pro
    tanto* duties, which hold unless they are overridden by some other, competing
    duty; versus absolute duties, which hold no matter what. It can sometimes be ethical
    to violate a prima facie duty, if upholding it would violate some other, equally
    or even more important duty. But it is always unethical to violate an absolute
    duty; it takes precedence over every other obligation one could have.


    So, understanding an absolute duty is crucial to ethics – if any exist. Various
    moral theories claim they do, but differ as to what they are. The most plausible
    way of justifying that a duty is absolute is to argue that it is required for
    morality itself to exist (Abney, 2019). That is, any duty that conflicted with
    such an absolute duty could not be ethically required because it would do away
    with ethical requirements! What kind of duty could itself be morally required
    for morality itself to exist? Well, both I (e.g., Abney, 2017a, 2017b; Abney,
    2019) and Brian Green (2019), following the work of Hans Jonas, have argued that
    humanity’s continued existence is such an absolute duty.


    If so, we can formulate as a corollary a plausible absolute duty: the **Extinction
    Principle** (Abney, 2019): “one always has a moral obligation never to allow the
    extinction of all creatures capable of moral obligation.” It then is an absolute
    duty to keep things capable of obeying absolute duties in existence. Accordingly,'
