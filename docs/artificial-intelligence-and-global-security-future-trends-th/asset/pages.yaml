    # Conclusions


    For AI and space war, how can we update traditional Just War Theory (JWT) to meet
    the novel challenges?


    # New Principles


    For now, the principal challenges coming for using LAWS from JWT lie in the principle
    of distinction or discrimination, which seems largely beyond the technical abilities
    of AI-enabled autonomous weapons for now. To address such concerns, first, I advocate
    a new principle, given the military necessity (given latency issues) of LAWS in
    space, which I call the **Discrimination Command principle**: Identify the military
    official with control over LAWS (typically the CO who chooses to use LAWS in battle).


    Unless that military official making the decision to use LAWS (or someone of equivalent
    or higher rank) is willing to participate in a realistic simulation of LAWS as
    a noncombatant before deployment, then the actual deployment of LAWS in war is
    immoral. So, unless the officer in charge (up to and including generals!) is willing
    to assume the role of a civilian in a realistic simulation, then the military
    should not use LAWS.


    This principle seems amply justified from a Kantian perspective, based on the
    categorical imperative principle of universalization and not making oneself an
    exception to a rule that everyone should follow.


    Second, I also advocate the **Metaethical principle of moral luck**: any ethical
    theory that incorporates moral luck is wrong. The implications for space-based
    JWT are that the independence thesis is strictly false (though sometimes approximately
    true) – the question is the degree of (in)dependence of any factor on the others;
    and that may change, depending on the details of the warffighting scenario and
    upon one’s own (il)legitimate role in the conflict.'
