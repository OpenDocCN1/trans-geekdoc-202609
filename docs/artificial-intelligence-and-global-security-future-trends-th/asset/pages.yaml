    of ever larger data sets. This gives us reason to think that these algorithms
    will deliver faster and better results, but it does not fundamentally change the
    way that the AI functions with respect to motivation. On the GOFAI front, there
    is a wider appreciation that we should tackle building more and larger knowledge
    bases and provide ways to apply commonsense reasoning over this store of knowledge.
    But this does not change the fact that GOFAI systems only know what is encoded
    in them, and this knowledge is not capable of motivating an AI system to act.


    # What Role Does AI Play in War?


    We have spent most of the chapter discussing what AI is not. It is not a moral
    substitute or shield for combatants, nor can AI serve as a combatant itself. And
    the continuum argument shows that AI will not revolutionize the moral landscape
    of war. That said, it would be silly of us to deny that there is something special
    about AI. AI allows us to think at scales and distances that were previously impossible,
    leveraging computing power and access to data. This undoubtedly affects the landscape,
    even if it does not revolutionize it. In this section, we will discuss a few of
    the moral ramifications of our advancing technology in war.


    AI is far more complex than many of the mundane technologies. No one should be
    surprised at what happens when someone fires an arrow, or swings a sword, or even
    fires a bullet. But the behaviors exhibited by AI result from a complex series
    of algorithms such that it is not obvious to the layperson how the machine will
    respond. This complexity places a much higher burden on those who operate the
    technologies. For example, suppose someone uses a smart missile that uses visual
    recognition algorithms that are trained on data featuring desert encampments.
    It is very plausible that this missile would fare poorly in another sort of geographic
    location, say a jungle or near large bodies of water. If the user puts that missile
    in the wrong environment and this leads to bombing the wrong target, then the
    user is at fault for failing to have a proper understanding of the weapon. Thus,
    AI introduces greater epistemological constraints on military decision-makers.
    As weapons get more sophisticated, so must those who are morally responsible for
    using them. It is worth noting that this argument does not only apply to AI: any
    increase in complexity of a weapon will have a corresponding demand on users.


    However, AI technologies are often more than just complicated. Sometimes they
    are entirely opaque. As discussed earlier, many ML AI outputs are black boxes.
    Some neural net will be given access to a large swathe of data and'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'generate a mathematical relationship between some set of factors and placing
    a judgment on some new piece of data (e.g., whether a picture has a sheep in it).
    Users of this technology have two critical moral responsibilities, above and beyond
    the normal moral responsibilities regarding action in warfare. First, there is
    this epistemic requirement: they must know broadly how such neural nets operate.
    This means they need to know that the outcome is heavily influenced by the training
    data set, and that the reliability of the outcome will depend on which variables
    were under consideration as well as how closely the target piece of reasoning
    resembles the training data. Second, users of black box AI must come to grips
    with using outputs that are not explainable. To express this, let us consider
    a scenario:


    **Anonymous Texter:** A military decision-maker named John receives a text message
    from an untraceable, anonymous cell phone user. The message includes details about
    some potential military threat. A few days later, it becomes clear that this intelligence
    was correct. This process repeats many times. John receives hundreds of texts
    from this anonymous source, and the source is correct almost every time, with
    a 99% success rate. However, up to that point, John has never been able to act
    on any of that intelligence. Things changed on August 2, though, when the anonymous
    texter alerted John that a nearby suspected person of interest would commit a
    devastating bombing in the next 24 hours. John has one, and only one chance to
    take out this target. Should he do so on the basis of this text?


    This situation is a difficult one. John has a reliable method for forming beliefs
    based on an extensive track record with the texter. But these tips from the texter
    are entirely opaque. Suppose John responds to the tip, takes out the target, and
    it turns out the intelligence was wrong. How could one defend their actions based
    on an anonymous tip without any deeper justification?


    We will not pretend to resolve the problem of opaque AI. There are nuanced arguments
    in favor of using or refraining from using these sorts of technologies as decisive
    in our decision-making. However, a few things are clear. First, the increased
    access to these opaque AI technologies necessitates a clearheaded conversation
    about the extent to which we are comfortable relying on these sources. Second,
    if there are ways around this problem, we should find them. For example, DARPA
    is presently engaged in the Explainable AI (XAI) effort.¹⁰ AI that reveals the
    underlying reasons for its actions seems clearly morally preferable to black boxes.


    The last moral shift that AI brings to warfare is that it expands the number of
    agents who are morally responsible for actions that utilize technology. This issue
    is not entirely new. There is legal and ethical discussion of the liability of
    gun'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'manufacturers for gun deaths: while the manufacturers do not pull the trigger,

    they do provide sophisticated mechanisms by which an agent can use a gun in

    morally significant ways. The same argument is greatly expanded for AI systems.

    As previously discussed, AI can be thought of as reasoning, acting, and deciding,

    but each of these are really just exercising the thought processes coded into
    them

    by programmers. As such, it is not only the responsibility of the end user of
    the

    weapon to understand how it works, but it is also the responsibility of the builders

    of the weapon to program it ethically. There are boundaries on both sides. Surely

    the end user is not responsible for understanding every part of the code, and

    surely the programmer is not responsible for every possible way that a user may

    deploy the weapon.


    To review, while AI does not turn the moral landscape of war upside down, it

    certainly alters the moral landscape. AI is more epistemically demanding of its

    users. AI also means that we will have to place increased focus on how to use

    insights from black box AI systems, and we may need to seek to develop AI in

    ways that are more transparent. Lastly, the network of agents involved in an AI

    decision is expanded: programmers and users alike will bear the responsibility
    of

    aI-driven actions.


    # Conclusion


    Christopher Coker’s observation from his book _Warrior Geeks_ is apt for

    concluding our discussion:


    > This is where we stand today. Some wish to purge war of its

    > existential and metaphysical elements and render it wholly

    > instrumental...Others wish soldiers to remain in touch with

    > their ‘humanity’ and the spiritual dimension of ‘being’...The

    > pity of it all is that anyone should think it is an either/or.

    > (Coker, 2013, p. 291).


    In our view, AI at the present time and for the foreseeable future functions as

    another tool in war, which may help human agents but must still be subject to

    human moral reasoning, judgment, and agency. That said, AI will require more

    epistemic rigor and perhaps a deeper kind of moral reasoning, and ultimately

    moral agency, from humans as moral agents functioning in war. As Paul Scharre

    noted, a certain kind of moral reasoning and agency is necessary for the moral

    and professional judgement and discretion that we expect in the military pro-

    fession; AI may require more discussion and attention on exactly what this means

    relative to any technological partners that are part of war.


    # Disclaimer


    The views expressed in this presentation are those of the author and do not

    necessarily reflect the official policy or position of the US Naval War College,
    the

    US Navy, the US Department of Defense, or the US Government.'
