  md: 'War is also existential in the sense of the philosophical tradition of existentialism
    concerned with the meaning of human life. War is a meaning-making enterprise and
    reflects the values of those that wage it, as well as providing meaning and values
    for the society and the warfighters. Part of that meaning is the moral justification
    of war and moral parameters on the conduct of war as reflecting in Just War thinking.
    Just War thinking is concerned with the moral value of justice and peace understood
    as essential to human life and political communities. However, this is also broader
    than just rights violations of individuals and communities; we are trying to create
    moral coherence and meaning which requires certain practices, rituals rooted in
    shared understandings, and values in communities of practice.viii


    We not only wage war, but we memorialize and create meaning from war, and war
    gives societies and individuals some sense of meaning and identity aside from
    whatever specific political ends are involved.ix Given that war is not simply
    instrumental, part of our inquiry will be to what extent it is possible for AI
