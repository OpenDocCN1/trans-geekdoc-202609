    ⁵ See Watzman, R. (2017). The Weaponization of Information: The Need for Cognitive
    Security. Testimony before the Senate Armed Services Committee. Retrieved from
    https://www.rand.org/content/dam/rand/pubs/testimonies/CT400/CT473/RAND_CT473.pdf.

    ⁶ The concept of “strategic corporal” was introduced by General Charles Krulac
