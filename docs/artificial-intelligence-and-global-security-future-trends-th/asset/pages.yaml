  md: 'Department’s enduring mission to keep the peace and deter war” (Tucker, 2019).
    The transparency of the Board’s meetings and work is commendable.


    Like many aspects of political and social life, there is a continuum of principle
    → policy → practice that one may use when considering ethical, political, and
    policy questions. So too, is this the case with AI. To think about AI and war,
    one must understand the relationship between the two. In so doing, the challenge
    is neither to make too much of the relationship nor too little. We must not over-estimate
    it nor underestimate it. That relationship is one that is instrumental. AI is
    a weapon of war, a tool of war, an instrument of war. With respect to the continuum
    of principle → policy → practice, AI may be thought of as a tool used in the practice
    (application in warfare) of a principle (principles of just war tradition) that
    is governed by policy (DoD policy and international law).


    Where is it all going? AI speeds up some processes but also inhibits our ability
    to control them. AI augments individuals, systems, and states – it is a force
    multiplier in warfare. In that regard, the most prominent discussions involve
    where we are going with respect to governing lethal behavior in autonomous systems/robots.
    Thus far, the majority of roboticists, researchers, ethicists, and policymakers
    have said we want to keep the person in the decision-making loop, but that will
    inevitably change in the name of efficiency. Once it changes, how might we embed
    just war tradition principles in the design and in decision-making processes?
    Few people are dealing with these specifics, but one who is, is Ronald C. Arkin
    at Georgia Tech. He is a leading voice in autonomous systems and believes ethical
    lethal autonomous machines can and should be developed.


    Arkin argues that, though a long way from realization, autonomous lethal weapons
    and robots are desirable and their development and use can be within the just
    war tradition framework and international law (cf. Arkin, 2009, 2017). He acknowledges
    that ethical robot development is in its infancy but believes “it is important
    that the field move forward post-haste to ensure the safe and ethical deployment
    of intelligent autonomous robots, especially in the context of armed conflict”
    (Arkin, 2017, p. 44).


    As noted earlier, AI and AWSs, though not synonymous, do share ethical spheres
    of operation and principles.


    Lucas contends:


    In sum, and regardless of what specific avenues of research are finally pursued,
    machines equipped with lethal force needs to be designed to operate according
    to precise engineering specifications, including the specifications that their
    actions comply accurately and unerringly with relevant international law pertaining
    to distinction, proportionality, and the avoidance of needless suffering (the
    so-called “cardinal principles” of international humanitarian law), as well as
    to the operand constraints of “Standing” and specific rules of engagement (ROE).
    Such constraints are identical to those currently imposed upon human combatants
    in the field (often with less than perfect success). (2013, p. 225)'
