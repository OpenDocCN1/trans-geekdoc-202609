- pgno: 61
  md: '# Chapter 2


    # Artificially Intelligent Techniques for the Diffusion and Adoption of Innovation
    for Crisis Situations


    Thomas C. Choiński


    # Abstract


    The diffusion and adoption (D&A) of innovation propels today’s technological landscape.
    Crisis situations, real or perceived, motivate communities of people to take action
    to adopt and diffuse innovation. The D&A of innovation is an inherently human
    activity; yet, artificially intelligent techniques can assist humans in six different
    ways, especially when operating in fifth generation ecosystems that are emergent,
    complex, and adaptive in nature.


    Humans can use artificial intelligence (AI) to match solutions to problems, design
    for diffusion, identify key roles in social networks, reveal unintended consequences,
    recommend pathways for scaling that include the effects of policy, and identify
    trends for fast-follower strategies. The stability of the data that artificially
    intelligent systems rely upon will challenge performance; nevertheless, the research
    in this area has positioned several promising techniques where classically narrow
    AI systems can assist humans. As a result, human and machine interaction can accelerate
    the D&A of technological innovation to respond to crisis situations.


    Keywords: Crisis response; artificial intelligence; innovation; diffusion; adoption;
    innovation ecosystem; complexity; human–machine interaction


    # The Case for Artificial Intelligence


    The diffusion and adoption (D&A) of innovation propels today’s technological landscape.
    Crisis situations motivate communities of people to take action for the D&A innovation.
    These crises arise from natural disasters, technological failures, deliberate
    human malevolent action, or breakdowns in policy decisions. Sometimes the crisis
    strikes suddenly as in cybercrime, and other times the crisis evolves'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'over relatively long periods as exemplified by global warming. Humans leverage
    technological innovation to respond to crisis situations, and artificially intelligent
    techniques offer the potential to assist.


    Complexity, capacity, risk, resources, culture, ethics, and emerging situations
    affect the pace of D&A of technological innovation. Artificial Intelligence (AI)
    can search the solution space, detect trends, identify potential solutions, reduce
    risk, mitigate unintended consequences, address the value proposition, and recommend
    appropriate courses of action suitable for the social networks in relevant innovation
    ecosystems. Humans can set the goal to accelerate the D&A of technological innovation
    for crisis resolution by leveraging artificially intelligent techniques.


    We need an interdisciplinary understanding of technology, as well as human and
    machine interaction, to achieve this goal. The D&A is essentially a human process
    based on relationships in a social network. AI can assist humans in the D&A of
    innovation if we keep these tenets in mind.


    However, AI must be readily available and well diffused and adopted as a technology
    in its own regard before it can be leveraged. A recursive nature to this challenge
    exists before AI can assist humans in crisis response; humans must diffuse and
    adopt AI. The process is both recursive and cyclic.


    This chapter presents an approach to achieve this goal by discussing how the evolution
    of innovation ecosystems has created an opportunity for AI, distinguishing which
    type of AI is suitable, confirming that humans have made AI readily available
    through the D&A of AI techniques and then proposing ways that artificially intelligent
    techniques can assist in the D&A of innovation for crisis resolution. This framework
    in this chapter evolved from the author''s participation in a panel discussion
    at the Humanities and Technology Association Conference hosted by Salve Regina
    University in Newport, Rhode Island (Chojinski, 2018). The D&A of innovation centers
    on human interaction. Artificially intelligent techniques can assist humans in
    several different ways, especially when considering the emergence of fifth generation
    innovation ecosystems that are complex and adaptive in nature.


    # Relevance in Innovation Ecosystems


    From my vantage point, the uptake of technology represents the biggest challenge
    we face to improve innovation. People often confuse invention with innovation.
    Invention is a subset of innovation, and in some instances, a new invention is
    not required for innovation to occur, e.g., when technology is appropriated. Humans
    must interact as they navigate through innovation ecosystems to respond to crises
    in innovative ways. A closer look at the historical evolution of innovation processes
    and ecosystems since the end of World War II provides better insight into the
    challenges facing the uptake of innovation in our current global environment.


    The United States experienced a rapid rate of industrialization after World War
    II, which led to stage 1 type sequential innovation ecosystems that were driven
    by research and development (R&D), the so-called technology push approach. This
    industrial-based approach carried business forward during the 1950s and early
    1960s. As the rate of industrialization slowed down in the'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'mid-1960s and early 1970s, businesses responded with stage 2 market-driven
    approaches to technological development and innovation. For this reason, this
    period was also characterized by a shift from government-directed R&D to initiatives
    led by organizations in the commercial sector. R&D became more in tune with market-driven
    needs; innovation was not solely driven by science, engineering, and government
    requirements. This stage 2 approach evolved through the 1970s and into the early
    1980s to include feedback processes in stage 3 technological innovation ecosystems.
    Stage 1, 2, and 3 ecosystems are essentially built upon sequential processes (Rothwell,
    1994, pp. 7–9).


    Dr. Stephen Klein described the technological innovation process through the chain-linked
    model for innovation that reflects the stage 3 approach. The chain-linked model
    depicts the sequential stages for the four interdisciplinary dimensions of technological
    innovation: the artifact (science and engineering), the sociotechnical system
    of manufacture, technique (know-how or techne), and the sociotechnical system
    of use (Kline, 2003, pp. 210–212). His model identified feedback between each
    stage.


    Kline provides a useful lens to discuss the interdisciplinary challenges associated
    with technological innovation. Each dimension represents a separate and distinct
    community of people who shape technological innovation by embodying their unique
    behaviors, cultural norms, traditions, and objectives; hence, the need for feedback
    between stages. A purely R&D or sequentially driven market-based approach would
    not adapt to the norms and emergent needs of each of these communities. For example,
    manufacturing methods are better accommodated during the early engineering development
    stages of the technological development process. Therefore, innovation ecosystems
    must embody both externally and internally generated needs.


    For this reason, as well as increased global market competition, stage 4 type
    innovation ecosystems emerged in the mid-1980s and 1990s. Stage 3 innovation ecosystems
    incorporated feedback between stages to address interdisciplinary needs, but were
    essentially still sequential in nature. Stage 4 innovation ecosystems overlap
    processes in a parallel fashion. In addition, the statistical process control
    and total quality management techniques, first discussed by Edward Deming after
    World War II, began to take effect. Supply chain management changed with business
    techniques such as just-in-time inventory control. One of the most notable examples
    of the power of stage 4 type ecosystems was the rise of Japanese automobile manufacturers
    and their ability to take market share from the automobile industry in Detroit
    (Rothwell, 1994, pp. 11–13, 26–28). Stage 4 ecosystems increased efficiency by
    performing phases of the process in parallel, but essentially remained a sequential
    approach.


    The aforementioned variants of essentially sequentially driven processes served
    us well during the industrial age. However, today the four communities of technological
    innovation (the science/engineering, the sociotechnical system of manufacture,
    technique [know-how or techne], and the sociotechnical system of use) have been
    energized by the transactional and shared learning nature of the global, digital,
    and Internet-driven worlds. The invention and appropriation of technology is accelerating.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'As a result, humans risk losing control over technology as technology gains
    control over humans. Jacques Ellul and Neil Postman are two philosophers of technology
    who point to the fact that this phenomenon has come to life as technology has
    become a way of living. Neil Postman coined the term “technopoly” to describe
    technology’s threat to human existence (Postman, 1992).


    Stage 5 innovation ecosystems seek to adapt to this accelerated technological
    phenomena with agility. These types of ecosystems trade sequential process for
    new approaches based on complex and adaptive theories. The communities of people
    who represent the artifact (science and engineering), sociotechnical community
    of manufacture, technique, and sociotechnical community of use interact with the
    goal of adapting in an agile fashion to respond to the emerging needs and consequences
    of the global environment. Otherwise, our response to crisis situations will either
    be too slow or out of sync. For example, the four communities may interact incoherently
    to produce what can be characterized as *technological aliasing* (Choinski, 2017,
    pp. 11–12, 62–63). In essence, the ecosystem creates a man-made crisis while attempting
    to respond to the original one.


    Technological aliasing can be explained through the metaphor of wheels on a stagecoach
    in a western movie. As the stagecoach moves out, the wheel rotates as expected
    with the direction of motion. However, as the stagecoach increases its speed,
    the wagon wheels appear to stand still. Further increases in speed give the visual
    appearance of the wheels moving backwards, counter to the forward movement of
    the stagecoach. This is a visual aliasing phenomenon. Similarly, *technological
    aliasing* is encountered when one or more of the technological dimensions described
    by Kline are out of sync. For example, scientific and engineering development
    may occur before end user needs are fully understood. Products may be delivered
    from the sociotechnical system of manufacture before techniques can be matured
    regarding their use. Scientists and engineers may believe they are accelerating
    the generation of innovations when in fact they could be slowing down the process
    or, even worse, providing less effective solutions than those that already exist!


    The accelerated pace of technological development is not the only justification
    for stage 5 innovation ecosystems. The ambiguous nature of emerging post-Westphalian
    interstate interactions as discussed by Henry Kissinger in his book *World Order*,
    as well as the opposition to Western thought materializing from the global political
    awakening described by Zbigniew Brzezinski in *Strategic Vision*, compounds the
    compelling need for stage 5 innovation ecosystems. This political awakening changes
    the embodiment of cultural and ethical principles in technology. For example,
    the United States has emphasized a model for innovation driven by science and
    technology. In contrast, China’s model seeks to embody social and cultural objectives
    into technological innovation through their approach for appropriation, D&A (Jin,
    2005). Scientific discoveries lead the former model and social directives lead
    the latter. How can AI help address the challenges stemming from the rapid pace
    of technological development, globalization, and global political awakening?


    Humans can leverage artificially intelligent techniques to navigate through complex
    innovation ecosystems and improve the D&A of innovation. The array'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'of approaches incorporated within AI include: cybernetics (mimicry of circular
    biocontrol systems), symbolic manipulation, cognitive techniques that people use
    to solve problems, logic-based systems, knowledge-based expert systems, embodied
    intelligence (intelligence embodied in robots and other machines), statistical
    learning and neural networks that characterize soft learning. Artificially intelligent
    machines incorporate logic, automated reasoning, probabilistic methods (Bayesian
    networks, hidden Markov models, Kalman filters, particle filters, decision theory,
    and utility theory), and classifiers (pattern matching). AI systems learn from
    data sets. Robotic systems base decisions on sensory data. Expert systems exploit
    historical data. Nevertheless, before AI can help humans, humans must diffuse
    and adopt AI in its own regard.


    # Distinguishing Types of Artificial Intelligence for Diffusion and Adoption


    Not surprisingly, humans have already diffused and adopted certain types of artificially
    intelligent systems. Clarification of the types of artificially intelligent techniques
    that are available to humans helps to understand the extent of AI’s D&A. The technical
    community commonly speaks to two types of artificially intelligent systems:


    > Narrow AI [classic AI] is the ability of a computer to solve a specific problem
    or perform a specific task. The other kind of AI is referred to by three different
    names: general AI, strong AI, or artificial general intelligence (AGI). (Reese,
    2018, p. 61)


    Narrow AI focuses on solutions to specific problems with a priori knowledge and/or
    data. This type of AI leverages computer algorithms that have been in development
    for decades including: expert systems, machine learning, and deep learning. These
    types of AI systems also encompass pattern matching techniques such as those encapsulated
    in neural network learning architectures. For this reason, the term classic AI
    seems more suitable than narrow AI. The point is that these algorithms and techniques
    have been discussed for decades. The term “classically narrow AI” is used in this
    chapter to recognize the specific application of these algorithms, as well as
    the fact that the algorithms have existed in some form for decades.


    For example, during the late 1980s, while I was pursuing my MBA program of study,
    I completed a course focused on the use of an expert systems software package
    called Prolog. At the time, my wife was working as a real estate agent, which
    gave me the idea to develop a real estate appraisal expert system using the Prolog
    programming language. Prolog enabled me to develop a rule-based expert system
    that replicated the real estate appraisal process using three comparable properties
    that had sold within the last six months. The rule-based system incorporated information
    from existing real estate multiple listing services (MLS). Each property was categorized
    in terms of its attributes, e.g., location, square'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'footage, total number of rooms, number of bedrooms, number of bathrooms, garage
    space, age, etc. The real estate appraisal system worked fairly well at the time
    and was very similar to what we now know as Zillow. The primary difference is
    that Zillow leverages real estate information which can be accessed from publicly
    accessible online databases available through the Internet which did not exist
    back in the late 1980s. I had to manually enter and label data taken from hard
    copy printouts of real estate directories.


    On the other hand, artificial generally intelligent systems, or AGI, seek to capture
    all the expectations of Kurzweil’s singularity concept to actually replicate and/or
    exceed the capabilities of human cognition (Luber, 2011, pp. 207–210). Think of
    the machine personified in the movie *iRobot*. This type of so-called autonomous
    machine is capable of sensing data from the environment, assessing situational
    context, making decisions, and taking action – all in real time. The machine has
    some level of consciousness. Needless to say, AGI systems do not exist today;
    these systems are currently the work of science fiction and perhaps will only
    exist, if ever, in the distant future.


    Moreover, some philosophers, such as Karl Popper, argue that it is doubtful that
    these AGI systems will ever exist. Humans bring a distinctive level of contextual
    understanding from what Karl Popper calls the third world of human creation. The
    first world is the physical one. The second world is the conscious organic one,
    which responds to stimulation for worlds one and two. The third world is one that
    consists of products from human cognition where intuition and activities such
    as critical thinking, strategic thinking, envisioning, planning, and artistic
    thinking occur. Interaction occurs between worlds one and two, as well as from
    worlds two and three; however, interaction does not occur directly between worlds
    one and three in Popper’s theory.


    Artificially intelligent systems engage in behavioral reactions between and within
    worlds one and two at best. Fully autonomous AGI systems would be required to
    interact between worlds one, two, and three. It is currently unforeseeable for
    a machine to be designed to accommodate an infinite number of scenarios and evolving
    contexts as humans can respond to.


    Philosophically speaking, the ambiguities of reality are left to the realm of
    the human mind when statistics and stochastic processes cannot be supported with
    data. Karl Popper’s three world theory identifies the physical world, conscious
    world, and the world that consists of products of the human mind. Reaction to
    human creations requires an accompanying understanding of the context behind these
    creations. Popper argues that the three most important things that make us human
    are self-transcendence through rational criticism, compassion, and consciousness
    of our fallibility.


    AGI systems fall short of these philosophical human attributes and will never
    fully reflect human behavior in decision-making. Will we ever be able to build
    systems that can think? Popper is hesitant stating that “it does not seem to me
    at all likely that a machine can be conscious unless it needs consciousness” (Popper,
    1978). Popper argues that today only humans engage in the third world, and it
    is doubtful that machines will ever be able to exist in this world.'
