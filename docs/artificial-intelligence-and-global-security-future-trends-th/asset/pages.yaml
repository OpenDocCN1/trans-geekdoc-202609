    the exchange is happening, and for what reason the information is being exchanged,
    the study seeks to examine how business teams'' judgment about the appropriateness
    of what, why, how, and to whom information flows (Martin, 2012). It becomes clear
    from the study that privacy norms are complex and specific to specific attributes
    such as age and gender, and within organizational structure. Acquisti et al. (2016,
