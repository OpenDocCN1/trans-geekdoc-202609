    the data sets for accurate information. Neither can deliver effective solutions
    from ephemeral data sets because of the excessive variance and lack of accuracy.
    The same is true for heavily biased data sets.


    Existing data sets can be shaped and tuned to provide the type of information
    required by artificially intelligent systems. Nevertheless, the level of effort
    required to mature existing data sets can be significant. Even when accomplished,
    the data sets need to be continuously monitored for stability and suitability.
    New applications offer the opportunity to correctly characterize emerging information
    into suitable datasets from the onset, but new datasets will not capture the bandwidth
    that exists in historical data. These challenges do not appear to be insurmountable;
    yet, solutions require resources and a level of effort to implement.


    # Conclusion


    The D&A of innovation propels today''s technological landscape. Crisis situations
    motivate communities of people to take action to adopt and diffuse innovation.
    AI can help to resolve the challenges associated with the use of technological
    innovation in crisis response. Complexity, capacity, risk, resources, culture,
    ethics, and emerging situations affect the pace of D&A. AI can search the solution
    space, detect trends, identify potential solutions, reduce risk, mitigate unintended
    consequences, address the value proposition, and recommend appropriate courses
    of action suitable for relevant social networks in ecosystems.


    In doing so, AI can help humans accelerate the D&A of technological innovation
    for crisis resolution. We will need a better understanding of technology, as well
    as human and machine interaction, to achieve this goal. AI can assist humans in
    this process given the understanding that the D&A of innovation is essentially
    based on human interaction in an innovation ecosystem. AI can help humans resolve
    crisis situations with technological innovation. AI can search the solution space,
    identify solutions with reduced risk, and mitigate unintended consequences in
    order to recommend appropriate courses of action within specific social networks.
    Complexity, capacity, risk, resources, culture, ethics, and emerging situations
    affect the pace of the D&A process.


    This chapter discussed how the evolution of the complexity and ambiguity evolving
    from fifth generation innovation ecosystems has presented an opportunity for AI
    in the D&A process. While human interaction will remain at the core and is essential
    for the D&A of technological innovation, there are areas in the D&A of innovation
    in fifth generation innovation ecosystems where AI can be leveraged.


    The case for the application of AI in the D&A of innovation in fifth generation
    innovation ecosystems was built by distinguishing that classically narrow artificially
    intelligent systems are suitable for this role, confirming that AI has suitably
    been diffused/adopted in its own right and then proposing ways that AI can serve
    as a technique to assist in the D&A of innovation. The D&A of innovation is an
    inherently human activity; yet, artificially intelligent techniques can assist
    humans'
