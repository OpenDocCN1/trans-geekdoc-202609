- pgno: 80
  md: '# A Certain Trajectory but an Uncertain Future


    The future rarely unfolds as people think it will or should unfold. Instead, there
    are twists and turns that are not universally experienced and ones that are frequently
    unanticipated. Thus, the question of “how will” should be replaced with “how might?”
    Viewing the history of technology and war, historian Max Boot noted more than
    a decade ago:


    > There is no magic formula for coping with the complexities of changing warfare.
    The course of future developments can be glimpsed only fleetingly and indistinctly
    through the fog of contemporary confusion. As any reader of H. G. Wells, Jules
    Verne, or Isaac Asimov must know, few prognostications about the future have ever
    come true. The best way to figure out the path ahead is to examine how we arrived
    at this point. (2006, p. 16)


    If Boot’s understanding of the history of warfare and technology is accepted,
    it would seem that broader rather than narrower considerations should be used
    when contemplating and implementing new technologies and what philosopher and
    military ethicist George R. Lucas, Jr. (2013) has termed “the relentless drive
    toward autonomy.”


    The growing presence of artificial intelligence (AI) in contemporary society is
    widely noted, usually embraced, and proclaimed to be a necessary and inevitable
    advancement of and for human progress and civilization. To be sure, there are
    naysayers, but few deny AI’s growing prominence and presence.3 Its effects in
    and ramifications for the disciplines of ethics, philosophy, and even religion
    are enormous. So too, are its effects in corporate boardrooms, hospital emergency
    rooms, and military and political war rooms. It is the latter of these that this
    chapter seeks to engage.


    How is AI to be evaluated and utilized in military planning and military operations?
    This remains a challenge for the near future (cf. Galdorisi, 2019). The noted
    Prussian military thinker Carl von Clausewitz (1976) stated: “theory becomes infinitely
    more difficult as soon as it touches the realm of moral values.” Warfare inevitably
    deals with “moral values” – in wartime planning, operations, and post-hostility
    phases. Ethics and war are intricately and inextricably linked – whether acknowledged
    or not. So too are ethics, technology, and war. Armin Krishnan (2009) is certainly
    accurate in his observation on AI, war technology, and ethics when he writes:
    “Automated killing is a sensitive ethical issue.”


    AI now can and will affect all aspects of warfare – conventional and unconventional.
    This includes such things as autonomous systems, missile defense, cyber, analysis,
    propaganda, and intelligence. The speed and course at which this


    3Well worth reading are titles such as Smith, G. (2018). The AI delusion. New
    York, NY: Oxford University Press and Walsh, T. (2017). Android dreams: The past,
    present, and future of artificial intelligence. London: C. Hurst & Co.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'will occur will vary, but the certainties of implementation and integration
    of AI and warfare are not in doubt. Thus, Paul Scharre, director of the Future
    of War Initiative at the Center for a New American Security and one who worked
    intimately with DoD technology policy, writes:


    > The rise of artificial intelligence will transform warfare. In the early twentieth
    century, militaries harnessed the industrial revolution to bring tanks, aircraft,
    and machine guns to war, unleashing destruction on an unprecedented scale. Mechanization
    enabled the creation of machines that were physically stronger and faster than
    humans, at least for certain tasks. Similarly, the AI revolution is enabling the
    cognization of machines, creating machines that are smarter and faster than humans
    for narrow tasks. (2018, p. 5)


    Rapid analysis for military decision-making is one of the major projected tasks
    for AI and perhaps its most important task in the near future. A critical question
    yet to be answered is whether the military will eventually delegate AI systems
    to make decisions independently from humans. Many ethicists and robotics and AI
    experts have called for a ban on the development and implementation of offensive
    autonomous weapons.⁴ It is understood that AI and autonomous weapons systems (AWSs)
    are not necessarily synonymous – but as autonomy integrates aspects of AI they
    are on the same technological trajectory and have overlapping moral, legal, and
    ethical considerations.


    However, if and when AI-independent decision-making is utilized, what is the potential
    for failure? Scharre asks:


    > Automated stock trading has led to “flash crashes” on Wall Street. Could autonomous
    weapons lead to a “flash war”? New AI methods such as deep learning are powerful,
    but often lead to systems that are effectively a “black box” – even to their designers.
    What new challenges will advanced AI systems bring? (2018, p. 7)


    As with many technologies, AI can have positive or negative consequences:


    > The stakes are high: AI is emerging as a powerful technology. Used the right
    way, intelligent machines could save lives by making war more precise and humane.
    Used the wrong way, autonomous weapons could lead to more killing and even greater
    civilian casualties... Artificial intelligence is coming and it will be used in
    war. How it is used, however, is an open question. (Scharre, 2018, p. 8)'
