  md: 'In New York State, life insurance companies are determining premium rates on
    what they find in subscribers’ social media posts. It is incumbent on the companies
    to prove there is risk but cannot use posts in a way that would otherwise be discriminatory
    (basing rates on ethnicity or disability) (Elgan, 2019).


    # Options to Consider?


    Based on this paper’s findings an individual should likely consider budgeting
    time to read and understand the agreements they are agreeing to with a click if
    privacy is a value to them. While the statistics are daunting, one could likely
    prioritize the number by the services most used. In the meantime, individuals
    should also demand that privacy and terms of use agreements should be changed
    and follow the Aristotelian considerations: Is the story coherent? Is it simple
    enough to be processed? Can it be remembered? Is it easy to transmit? If believed,
    will it motivate appropriate action? (Giordano, 2015) “The ethical-legal issues,
    questions, and problems demand attention before these technologies become operational.
    That will enable a determination as to what legal standards may be viable – or
    should be developed – to govern (1) the informal or formal pressures placed on
    individuals to participate in using such technology, (2) the disclosures required
    for informed consent, (3) the level of care taken to protect individuals from
    harm, and (4) the liability that parties bear when individuals using such cutting-edge
    neurotechnologies are harmed” (Moreno, 2001 as quoted in Giordano, 2015, pp. 267-271).


    The very same machine learning algorithms are being looked to automatically make
    privacy easier to understand and automatically update as fast as the technology
    is developed. Fighting fire with fire, or in this case, algorithms with algorithms
    is an option that individuals can use to maintain their own sense of privacy regardless
    of the argument to maintain it socially. “One proposed alternative to the status
    quo is to automate or semi-automate the extraction of salient details from privacy
    policy text, using a combination of crowdsourcing, natural language processing,
    and machine learning” (Wilson et al., 2016). A team from Carnegie Mellon is currently
    building and scaling up a privacy corpus to help internet users understand online
    privacy practices. By using law students, the team analyzed 115 privacy policies
    and was able to demonstrate the feasibility of partly automating the annotation
    process with several machine learning toolkits. While it was only a demonstration,
    the results reveal the complexity of these documents (Wilson et al., 2016). A
    tool like this may one day allow the user to answer a few questions designed to
    understand how they value privacy and then automatically identify apps that are
    inconsistent with these preferences. At a minimum, these efforts would provide
    near-term solutions until the more conservative privacy paradigm of the EU is
    adopted elsewhere.


    There are several other options that could be pursued which would have a significant
    impact in taking charge of our own data. Recall the findings from the grand traditions:
    Virtue theorists would likely recommend treating terms of service and privacy
    agreements as contracts of trust; deontologists might recommend'
