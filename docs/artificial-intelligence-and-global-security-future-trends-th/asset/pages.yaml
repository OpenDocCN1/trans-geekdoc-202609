- pgno: 153
  md: 'Why think that swords, helicopters, and other mundane technologies are morally
    ordinary? Consider a very simple case: a person wants to kill another, and does
    so with their bare hands. On the other hand, suppose one does this with a simple
    weapon, like a sword. How should we view the bare-handed versus the sword killings?
    It is hard to see a moral difference that the mode of killing makes. The sword
    killing may be quicker and easier, which could have moral consequences: perhaps
    an unjustified killing with one’s bare hands is worse because the guilty party
    had more opportunity to change their mind and relent. Or, perhaps the lethality
    of a sword makes an accidental killing more likely, and one may be less blameworthy
    for an accidental unjustified killing than for an intentional one. But in both
    cases, it seems that a justified killing without a weapon is equally justified
    with a sword. And this line of reasoning generalizes to other mundane technologies:
    justified killing aided by a bow and arrow, or jeep, or helicopter will almost
    entirely coincide with the situations in which one is justified in killing without
    technology whatsoever.


    There is one realm of counterexamples to this principle worth discussing. Perhaps
    having technology presents some other courses of action that are previously inaccessible
    without them. For instance, I may be justified in using my bare hands for self-defense,
    but not running someone over with a jeep in self-defense for the reason that the
    jeep may afford me the ability to escape without any bloodshed whatsoever. To
    be more precise, then, this is the principle we advocate:


    > Killing with Technology (KT) Principle: For any situation in which an agent
    may choose to perform a killing without the aid of technology, a counterfactual
    situation in which they have the same set of choices except to perform the killing
    with the aid of mundane technology, the moral status of the choice to kill is
    the same.


    The only plausible counter-examples we can construct from this are either incredibly
    *ad hoc* (e.g., God asks one to kill another but forbids the use of technology)
    or focus on the “efficiency” of the killing. Perhaps it is marginally worse to
    kill someone slowly without technology based on how long it will take. Or maybe
    there is a callousness in killing quickly. But these considerations seem minor:
    they are reasons to think a given killing may be slightly worse or better, but
    they are not considerations that might “flip” a killing to be forbidden when it
    was otherwise obligatory.


    The next challenge is to defend premise (1). In other words, why should we think
    that KT applies to AI killings as well as to killings by mundane technology? The
    previous discussion made the first of many connections that we can draw on the
    way from nontechnology, to mundane technology, to “smart” AI technology:


    +   • Attacking someone with your bare hands/feet/etc. is not morally relevantly
    different from using a rock, sword, or some other simple handheld implement. The
    handheld tools may augment one’s strength, but one is still equally responsible
    for the consequences of any acts committed using these tools.'
