- pgno: 7
  md: '# # Table of Contents


    +   - About the Editor ... xv

    +   - About the Contributors ... xvii

    +   - List of Contributors ... xxi

    +   - Preface ... xxiii


    The book was written by researchers and authors across many disciplines and domains
    – Artificial Intelligence (AI), autonomous unmanned systems, undersea, space,
    as well as humanitarian crises, including the ethical, theological, and moral
    conflicts of war. These areas and topics encompass numerous moral and ethical
    issues. Among the questions these chapters will explore are: What are the implications
    of AI for the individual, for personal identity, privacy, and freedom, and for
    society? What are the consequences of AI advances related to national and global
    security? These chapters will examine the perspectives and consequences for the
    integration of AI in our daily lives, as well as its influence on society and
    war. Authors will present their perspectives on the potential for significant
    consequences related to the impact of AI on an individual’s identity that may
    place society at risk. What are the moral and ethical boundaries and responsibilities
    of each person’s life as AI blends with humans into the whole of society? Does
    humanity lose its identity in the process? Where are the lines drawn between AI
    systems and the human? These are but a few of the questions that will be examined
    in these chapters. Whatever the course of action, AI will continue to be part
    of our future world. As such, humans must chart a course of action to navigate
    the waters of the future that we design for ourselves.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Chapter 1 Artificial Intelligence and the Future Global Security Environment


    Yvonne R. Masakowski


    Advances in Artificial Intelligence (AI) technologies and Autonomous Unmanned
    Vehicles will shape our daily lives, society, and future warfare. This chapter
    will explore the evolutionary and revolutionary influence of AI on the individual,
    society, and warfare in the twenty-first-century security environment. As AI technologies
    evolve, there will be increased reliance on these systems due to their ability
    to analyze and manage vast amounts of data. There are numerous benefits in applying
    AI to system designs that will support smart, digital cities, as well as support
    the future warfighter. However, advances in AI-enabled systems do not come without
    some element of risk (Hawking, Musk, & Wozniak, 2015). For the military, AI will
    serve as a force multiplier and will have a direct impact on future global security.
    The military seeks to exploit advances in AI and autonomous systems as a means
    of achieving technological superiority over their adversaries. We will explore
    the advantages and potential risks associated with the emergence of AI systems
    in the future battlespace (Armstrong, Bostrom, & Shulman, 2016). This chapter
    will serve as the foundation for examining issues such as ethical decision-making,
    moral reasoning, etc., related to the integration of AI systems in our daily lives,
    as well as in the future battlespace. Consequences for integrating AI into all
    aspects of society and military operations will be explored, as well as the implications
    for future global security.


    # Chapter 2 Artificially Intelligent Techniques for the Diffusion and Adoption
    of Innovation for Crisis Situations


    Thomas C. Chouinski


    The diffusion and adoption of innovation propels today''s technological landscape.
    Crisis situations, real or perceived, motivate communities of people to take action
    to adopt and diffuse innovation. This chapter will discuss the ability of Artificial
    Intelligence to resolve the challenges confronting the diffusion and adoption
    of innovation. Capacity, risk, resources, culture, complexity, ethics, and emerging
    situations affect the pace of diffusion and adoption. Artificial Intelligence
    can search the solution space, identify potential solutions, reduce risk, and
    mitigate unintended consequences while addressing the value proposition in order
    to chart courses of action through social networks. In doing so, artificial intelligence
    can accelerate the diffusion and adoption of technological innovation and contribute
    to the resolution of immediate crisis situations, as well as chart courses of
    action through emerging landscapes. However, Artificial Intelligence can help
    humans, but not replace their role this process. Achieving this goal will require
    a better understanding of human and machine interaction.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Chapter 3 “Something Old, Something New” – Reflections on AI and the Just
    War Tradition

    Timothy J. Demy

    53


    This chapter will focus on the relationship between the centuries-old and prevailing
    tradition of warfare in the West and the innovations and challenges of AI with
    respect to the tradition and emerging norms of warfare. It will investigate whether
    the nature of warfare is changing or the weapons of warfare are changing and how
    such change affects the normative framework.


    # Chapter 4 Space War and AI

    Keith A. Abney

    63


    New technologies, including AI, have helped us begin to take our first steps off
    the Earth and into outer space. But conflicts inevitably will arise and, in the
    absence of settled governance, may be resolved by force, as is typical for new
    frontiers. But the terrestrial assumptions behind the ethics of war will need
    to be rethought when the context radically changes, and both the environment of
    space and the advent of robotic warfighters with superhuman capabilities will
    constitute such a radical change. This chapter examines how new autonomous technologies,
    especially dual-use technologies, and the challenges to human existence in space
    will force us to rethink the ethics of war, both from space to the Earth, and
    in space itself.


    # Chapter 5 Building an Artificial Conscience: Prospects for Morally Autonomous
    Artificial Intelligence

    William D. Casebeer

    81


    Discussions of ethics and Artificial Intelligence (AI) usually revolve around
    the ethical implications of the use of AI in multiple domains, ranging from whether
    machine learning trained algorithms may encode discriminatory standards for face
    recognition, to discussions of the implications of using artificial intelligence
    as a substitute for human intelligence in warfare. In this chapter, I will focus
    on one particular strand of ethics and AI that is often neglected: whether we
    can use the methods of AI to build or train a system which can reason about moral
    issues. Here, I discuss (1) what an “artificial conscience” consists of and what
    it would do, (2) why we collectively should build one soon given the increasing
    use of AI in multiple areas, (3) how we might build one in both architecture and
    content, and (4) concerns about building an artificial conscience and my rejoinders.
    Given the increasing importance of artificially intelligent semi- or fully autonomous
    systems and platforms for contemporary warfare, I conclude that building an artificial
    conscience is not only possible but also morally required if our autonomous teammates
    are to collaborate fully with human soldiers on the battlefield.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# # Chapter 6 Artificial Intelligence and Ethical Dilemmas Involving Privacy


    +   James Peltz and Anita C. Street 95


    This chapter explores how data-driven methods such as Artificial Intelligence
    pose real concerns for individual privacy. The current paradigm of collecting
    data from those using online applications and services is reinforced by significant
    potential profits that the private sector stands to realize by delivering a broad
    range of services to users faster and more conveniently. Terms of use and privacy
    agreements are a common source of confusion, and are written in a way that dulls
    their impact and dopes most into automatically accepting a certain level of risk
    in exchange for convenience and “free” access. Third parties, including the government,
    gain access to these data in numerous ways. If the erosion of individual protections
    of privacy and the potential dangers this poses to our autonomy and democratic
    ideals were not alarming enough, the digital surrogate product of “you” that is
    created from this paradigm might one day freely share thoughts, buying habits,
    and your pattern of life with whoever owns these data. We use an ethical framework
    to assess key factors in these issues and discuss some of the dilemmas posed by
    Artificial Intelligence methods, the current norm of sharing one’s data, and what
    can be done to remind individuals to value privacy. Will our digital surrogate
    one day need protections too?


    # # Chapter 7 Artificial Intelligence and Moral Reasoning: Shifting Moral Responsibility
    in War?


    +   Pauline Shanks Kaurin and Casey Thomas Hart 121


    How does AI shift the burden of moral responsibility in war? It is no longer merely
    far-fetched science fiction to think that robots will be the chief combatants,
    waging wars in place of humans. Or is it? While Artificial Intelligence (AI) has
    made remarkable strides, tempting us to personify the machines “making decisions”
    and “choosing targets,” a more careful analysis reveals that even the most sophisticated
    AI can only be an instrument rather than an agent of war. After establishing the
    layered existential nature of war, we lay out the prerequisites for being a (moral)
    agent of war. We then argue that present AI falls short of this bar, and we have
    strong reason to think this will not change soon. With that in mind, we put forth
    a second argument against robots as agents: there is a continuum with other clearly
    nonagental tools of war, like swords and chariots. Lastly, we unpack what this
    all means: if AI does not add another moral player to the battlefield, how (if
    at all) should AI change the way we think about war?'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Chapter 8 Ethical Constraints and Contexts of Artificial Intelligent Systems
    in National Security, Intelligence, and Defense/Military Operations


    John R. Shook, Tibor Solymosi and James Giordano


    Artificially intelligent (AI) systems are being considered for their potential
    utility and value in a variety of warfare, intelligence, and national security
    (WINS) settings. In light of this, it is becoming increasingly important to recognize
    the capabilities, limitations, effects, and need for guidance and governance of
    different types of AI systems and uses in WINS initiatives.


    Most generally, AI systems can be regarded as “soft” or “hard,” although, in reality,
    these are not wholly binary, but rather exist along a continuum of structural
    and functional complexity of design and operations. “Soft AI” retains and reveals
    the fingerprint of responsibility incurred by the human builder and operator.
    It is programmed and controlled, and at best only semi-autonomous. Here attribution
    can be placed upon human factors in the design and/or articulation-of-action/event(s)
    chain. “Hard AI” (e.g., autonomous systems), however, can break that chain, if
    and when the system moves beyond its initial human-programmed input-output features
    to evidence “developed/inherent” – and not simply directly derived – characteristics
    and traits.


    Law will likely infer that there is a builder’s bias and basis for any man-made
    system, and thus could argue that burden of responsibility would rest upon the
    human enterprise that evidenced the most probable custodianship/stewardship of
    the feature evoking the action in question.


    But this could fail to eventuate if and when a system becomes autonomous (e.g.,
    via hierarchical generative encoding). In such an instance, the system could develop
    novel characteristics as adaptive properties, in some cases in response to and
    as rejctive reaction to certain exogenous (i.e., human) attempts at constraint,
    imposition, and control.


    This result would prompt questions of responsibility, attribution, and considerations
    of developmental trajectories, possible effects, and regulation and possibilities,
    viability and definable constraints of use.


    This chapter will focus upon these possibilities, and address:


    +   1. Peer capability conferred by AI in asymmetrical engagements.

    +   2. Concepts and content of what constitutes *jus contra bellum*, *jus ad bellum*,
    and *jus in bello* parameters of AI use in political and military engagements.

    +   3. Effect of AI use on relative threshold(s) and tolerances for warfare.

    +   4. Proposed approaches to risk analysis, mitigation, and operational guidance
    of AI systems in WINS settings.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Chapter 9 An AI Enabled NATO Strategic Vision for Twenty-First-Century Complex
    Challenges


    Imre Porkoláb 153


    In the twenty-first century, the international defense community has largely struggled
    with how to organize, strategize, and act effectively in increasingly complex
    and emergent contexts where the previous distinctions between war and peace have
    blurred beyond comprehension. Popularly termed “black swan events” continue to
    shatter any illusion of stability or extension of normalcy in foreign affairs.


    Western armed forces as well as intergovernmental military alliances such as NATO
    appear increasingly unable to deal with these problems using traditional planning
    and organizing methodologies alone. What had worked well previously no longer
    appears to possess the same precision and control. The formal operational-level
    military planning process, initially developed to cope with Cold War Era large-scale
    military activities in “a conventional, industrialized state vs industrialized
    state setting” now is seemingly incapable of providing sufficient means of getting
    the organization unstuck.


    Within this new and increasingly complex context, coupled with the increasing
    tempo of the Fourth Industrial Revolution, NATO has to fulfill all three core
    tasks at the same time, and in a sense go through a complete digital transformation.
    It requires new and noble approaches from policymakers, and military personnel
    alike.


    Artificial Intelligence is playing a crucial role during this digital transformation.
    In this chapter the author will address Artificial Intelligence in future multinational
    military operations, introduce the most recent political discussions, as well
    as the research trends and the implications on future warfare for the Alliance.


    Specific topics that will be covered include:


    +   - Possibility to use AI in future foresight analysis – better foresight through
    machine learning.

    +   - Artificial Intelligence and the lessons learned process – how can we transform
    NATO into a learning organization?

    +   - Capability building – possibilities for using AI and big data analysis to
    assess capability gaps and improve the defence planning capability system.

    +   - Joint research – cooperation in AI research (Pentagon JAIC, CNAS AI center,
    and NATO AI research facilities).


    # Chapter 10 AI Ethics: Four Key Considerations for a Globally Secure Future


    Gina Granados Palmer 167


    Harnessing the power and potential of AI continues a centuries-old trajectory
    of the application of science and knowledge for the benefit of humanity. Such
    an endeavor has great promise, but also the possibility of creating conflict and'
