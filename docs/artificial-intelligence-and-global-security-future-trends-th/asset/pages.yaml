  md: '# Data Ecosystem


    Users who search, stream, and share pictures and videos via the internet or by
    the use of apps represent a market that can be bought and sold because although
    they are consumers of these products, but as such, they are also producers (Rincon
    & Carlos, 2012). Thus, “advertisements on the Internet are frequently personalized;
    this is made possible by surveilling, storing, and assessing user activities with
    the help of computers and databases. In the case of the Internet, the commodification
    of audience participation is easier to achieve than with any other mass media”
    (Rincon & Carlos, 2012, pp. 55–56). The direct apps and their developers are the
    first of many beneficiaries of such data. Imagine the potential of being able
    to use data-driven analyses to make predictions. That idea is what is driving
    Recorded Future, a private data Analytics Company started in 2009, which claims
    to make use of machine learning and natural language processing (NLP) to continuously
    analyze threat data from a massive range of sources thus predicting them before
    they happen.


    But having data does not necessarily mean they are useful or valuable. Value often
    depends on the structure and the context about how, when, and who generated them.
    Access to these data is another critical factor that in turn also affects value.
    In general, information that relates to location-based services, healthcare, and
    retail markets are valuable; these data are estimated to be worth hundreds of
    billions in the United States and roughly the same globally (Henke et al., 2016).
    While rapid advances continue, barriers exist to tapping into the value of these
    areas in the form of strict regulations evidenced by those which govern healthcare.
    It is not surprising then to see why opting out of sharing one’s data are the
    defaults, rather than finding the parameter settings for opting in.


    In terms of volume, a commercial data management company, Domo, updates a graphical
    depiction of the volume of data produced each minute of every day. Their sixth
    version of Data Never Sleeps graphic released in 2018 (http://www.domo.com/learn/data-never-sleeps-6)
    details the rate at which data is created and consumed via the internet. In the
    span of just seven years, the global internet community increased from 400 million
    in 2000, to 3.8 billion in 2017 (James, 2018). Over half of these data come from
    mobile devices and increased to 75% of this volume in 2018. This represents significant
    potential in terms of understanding the people generating these data, and companies
    such as Domo are collecting them in the hopes of using data to generate money
    in the form of sales and marketing and consumable products.


    As Domo advertises, “Data never sleeps, but Domo has compiled the latest statistics
    [so you or your business] can discover newer and faster ways to turn data into
    ah-hahs, to turn ah-hahs into to-dos, and to turn to-dos into cha-chings” (James,
    2018). The cha-chings in this context are the dollars and revenue that come from
    the data service provider making it easier for the consumer or data generator
    to get the most use out of their own data. This concept plays out in numerous
    variations where the data generated by consumers is used by data analyzers to
    make these data “work” better for the consumer. Companies such as McKinsey and
    Domo are quite representative of the third parties that seek'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'and harvest user data. However, what users may not appreciate is that the US
    Government is able to *bypass* the Fourth Amendment protections under the third-party
    and public disclosure doctrines which apply to websites and apps (Hoback, 2013).


    As the story suggests, apps on a phone are surprisingly adept at building an algorithm
    of the person using them. Most employ the use of location services, record contacts,
    collect and link who one communicates with, and what one consumes, e.g., products,
    services, and data. All of this information describes the individual, their likes,
    and their networks. Income, education level, and numerous other attributes can
    be gleaned from these data and exploited to sell one products such as in the case
    with Amazon, Apple, or Google or to be used by con artists and government agents
    for more nefarious purposes.


    With enough data about a system, or a specific target/person, predicting attributes
    or specific behaviors becomes possible. In the case of people, what items fill
    their needs leaves data for algorithms to be developed or data that algorithms
    can exploit. For example, algorithms can capture data about the average citizen''s
    use of alarms, sleep monitors, workout logs, bank accounts, bills, grocery lists,
    and games. In addition, networks collect and use data of the individual using
    them as well as collecting data from others in their social network. A user''s
    phone quickly becomes an accurate profiling agent. This is mainly because the
    user agrees to the collection and sharing of these data through those lengthy
    privacy agreements that are required to use the app in question.


    "You are what you app" as they say, and it is becoming fairly easy to categorize
    and profile any number of individuals from the apps they use (Mulvey, 2011). Social
    networking apps such as Snapchat, Instagram, and Twitter from Fig. 6.1 are quite
    significant data generators. They link people and employ algorithms that over
    time create a profile of the individuals who use them. Who individuals chat with
    the most, whose content they like or dislike, and the frequency with which they
    communicate are all characteristics of that user. With the advent of hashtags,
    conversation topics become linked and searchable to a larger population of users
    as well as become prime examples of how social data become bridges to the physical
    places, things, and ideas. The more one participates in discussions or generating
    data for others to consume, the more extensive and detailed the algorithms in
    these apps are able to generate a profile of the apps users.


    Add in geographic information such as Uber, Google maps, and services which track
    the weather and it becomes easy to see where one lives, where they work, what
    places they visit, and the frequency in which they do so. These services establish
    your social status by connecting the dots. It''s not illogical to be able to also
    get a sense of someone''s socioeconomic level and political leanings from these
    data as they convey zip codes and physical places that are visited as well. Apps
    such as Google, Amazon, etc. collect what consumers buy and use it as key data
    to improve the robustness of their profit margin and establish socioeconomic status
    as good indicators of education, age, and household size. Ingeniously, these services
    enable price discrimination on an unprecedented scale.'
