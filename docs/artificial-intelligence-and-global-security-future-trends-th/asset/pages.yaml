  md: 'discussion of privacy which we argue is personal. It is not difficult to imagine
    how data collected to develop AI technology could be argued with some collective
    benefit which warrants infringing on an individual''s privacy, so rather than
    dwell on examples on that concept, we present a more interesting twist. The example
    is interesting because the action of voyeurism is akin to third parties collecting
    data on unknowing individuals. This might explain some of the reasoning behind
    individuals with agnostic views about giving up their data or thinking third parties
    or the government has these data already. It is also interesting because the argument
    recommends such severe penalties for a breach of trust in this manner. Both are
    useful for the discussion here.


    Tony Doyle asserts that the basic definition of utilitarianism fails to consider
    where or how happiness is derived which means an act is supported as long as general
    happiness increases. Thus, how a perfect voyeur gains knowledge is irrelevant
    as long as the victim behaves the same as if they were not being watched (2009,
    p. 182). We are “watched” and recorded ubiquitously. Does being watched and tracked
    make us more accepting of surveillance in general? As the argument points out,
    if our behavior is the same as if it would be without being watched, do we care
    how or if someone is watching us? A key aspect of the arguments logic rests on
    increasing happiness which also relies on the condition of privacy. A voyeur looking
    to breach someone’s privacy out of self-interest, out of curiosity, profit, to
    discret, or blackmail will incur costs to achieve these goals so it’s in their
    best interest to actually have their privacy protected (Doyle, 2009). This might
    also explain why companies facing accusations are not necessarily quick to fess
    up to breaches in privacy. What else will the public learn if these entities are
    challenged to reveal the full extent of their activities?


    Doyle’s analysis goes on to describe why it is important to deal harshly with
    cases such as this because “...accomplished voyeurs potentially do more harm and
    are harder to detect than dabblers, would-be effective snoops need a stronger
    disincentive than dilettantes to pursue their ‘hobby’. This means more severe
    sentences the longer the convict is found to have been engaged in the crime and
    for the stealthier his methods” (2009, p. 187). The main issue raised by Doyle
    is how society deters activities that are difficult to detect yet gravely damaging.
    This theme will come up again later in the discussion when a corrective tax is
    discussed, but we will show why severely penalizing companies for infractions
    related to privacy may not be as useful and again any legal actions would require
    clear definitions and explicit evidence of damages which may not have much historical
    precedence.


    To this end, each grand tradition has advantages and shortcomings with respect
    to applying a universally accepted framework for how privacy should or for how
    privacy could be defined. The lessons they do yield are that terms of use agreements
    and privacy agreements are a good place to start if we are interested in changing
    social norms on expectations of privacy. Any viable solution needs to define the
    boundary between ownership, use, and control and balance individual privacy between
    an individual and the security of society, so establishing definitions and relatable
    examples for key concepts that encompass privacy or breaches in privacy is a useful
    first step (Rincon & Carlos, 2012).'
