  md: 'changing the current default option of most app accounts from opting out to
    choosing to *opt in*; and a utilitarian would likely accept the current paradigm
    as long as the punishment for violations were severe enough to maintain the happiness
    of society once an offender was caught. More importantly, these inconsistencies
    again highlight the need to understand the boundaries between privacy as examined
    through the individual, society, and the existing consequences so that future
    threats can be addressed with ethical solutions. Individuals should be provided
    with a clear and concise explanation of their privacy rights, as well as the potential
    risks associated with the use of systems and apps.


    Just as Monu Bedi argues, to understand the historical context and unique contours
    of each [disclosure and privacy] doctrine[s] so that, “For prudential reasons,
    we must strive for a logical and cautious application of these principles that
    is firmly grounded in prior precedent. Otherwise, courts as well as scholars risk
    muddying the waters and, in turn, making unnecessarily overly broad or erroneous
    conclusions on important privacy matters” (Bedi, 2017, p. 494). The same topology
    can be argued as a need to understand the contours around privacy to include privacy
    norms and terms of use agreements as well as societal ethics and collecting personal
    data. This project perhaps can contribute to that end but focuses more on a few
    near-term solutions aimed at the definition and social norms around privacy.


    Informed consent is an attractive concept to explore for this chapter because
    like the medical field, a high degree of asymmetry in knowledge exists between
    users and developers in much the same way as between patients and doctors. However,
    it becomes apparent that there are major differences between medical ethics and
    data collection such as the level of perceived risk and the Hippocratic oath that
    warrants a willingness of the individual to become informed and the doctor to
    protect the patient, respectively, that are largely absent in data collection
    and the erosion of privacy. A process of informed consent as applied to privacy
    and data collection is different because the market interactions are largely unaffected
    by an individual’s consent, specific aspects of the technology influence decisions
    around users’ privacy decisions, and ethics and social norms change with technology
    (Acquisti et al., 2016). In this way people must be compelled to be informed if
    the current social norms regarding privacy have any chance of changing. Those
    who have studied this concept cite these differences. This is what is behind Dr.
    Catherine Flick’s “waiver of normative expectations” (Flick, 2016).


    Facebook and its emotional manipulation study with Cornell University already
    set precedent for applying informed consent to data analytic research. “[R] esearchers
    at Facebook tweaked what hundreds of thousands of users saw in their news feeds,
    skewing content to be more positive or negative than normal in an attempt to manipulate
    their mood” (Sullivan, 2017, p. 1). Neither the terms of service agreements nor
    Cornell University had what Flick describes as, “[S]ufficient ethical oversight
    and neglected in particular to obtain necessary informed consent from the participants
    in the study” (2016, p. 14). She goes on to argue that, “[A] reasonable shift
    could be made from traditional medical ethics ‘effective consent’ to a ‘waiver
    of normative expectations’, although requires much-needed changes to the company’s
    standard practice” (2016, p. 19).'
