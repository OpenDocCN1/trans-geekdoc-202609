- pgno: 23
  md: "# Preface\n\n> *All Warfare is Based on Deception*\n> \n> -Sun Tzu.\n\nThe\
    \ arms race is on and Artificial Intelligence (AI) is the fast track for twenty-first\
    \ century global dominance. Nations view AI technologies as a force enabler and\
    \ the key to achieving global dominance. During the twenty-first century, AI technologies\
    \ will control information, people, commerce and future warfare. It is our responsibility\
    \ to be at the helm and shape our future as AI joins the fight.\n\n(Masakowski,\
    \ 2019)\n\nThis book had its origins in hours of discussion between the author\
    \ and her students, colleagues, fellow scientists, and engineers on the important\
    \ role of Artificial Intelligence (AI) in shaping the future of society and warfare.\
    \ The topic of Artificial Intelligence is one that lends itself to lively debate\
    \ as the technology itself has advanced exponentially, often times being overpromised\
    \ and under-delivered. Indeed, there is a wide array of perspectives on this topic\
    \ as some view AI as the great problem solver, while others as a threat to humanity\
    \ itself. I contend that there is a bit of truth in both perspectives. We are\
    \ facing an unknown entity in many ways. Foremost among these issues is whether\
    \ AI technologies will achieve total self-awareness and become a serious threat\
    \ to humanity. For the moment, we can rest assured that there will be a human-in-the-loop\
    \ and human-on-the-loop to ensure that AI systems do not present dangers to the\
    \ human (Porat, Oran-Gilad, Rottem-Hovev, & Silberger, 2016). However, there are\
    \ serious considerations regarding the ethical, theological, and moral challenges\
    \ these technologies present to us during times of war. War itself is debated\
    \ within the context of Just War theories. So, for this purpose, how will AI technologies\
    \ influence the rules of engagement and Just War practices of warfare in the future?\
    \ Should AI systems be designed with ethical rules and algorithms that will constrain\
    \ its actions and serve as its conscience in future conflicts?\n\nIn the course\
    \ of researching and writing this book, I’ve discussed these topics with my colleagues\
    \ and invited them to contribute their expertise and knowledge, as well as speculative\
    \ theories for future warfare in light of advances in AI technologies. We also\
    \ need to consider the impact of advanced AI systems"
  merge: -1
  img_proc: true
- pgno: 24
  md: 'fighting against AI systems in the future? How will AI technologies reset the
    rules

    of engagement for future warfare? What are the potential ethical and moral

    implications of such a future war?


    Futurizing warfare is a risky business as we can wargame future concepts

    however these are often limited by our unique personal experience and knowl-

    edge. We need to step out of our comfort zone and imagine a world without

    ethical and moral boundaries for that is what our adversaries will do. They will

    not be contained or constrained by such limitations.


    This book will address questions related to the influence and impact of Arti-

    ficial Intelligence technologies being applied across a wide array of crises and

    domains as well as address the ethical and moral conflicts of war. Among the

    questions these chapters will explore are: What are the implications of AI for
    the

    individual’s personal freedom, identity, and privacy rights? What are the conse-

    quences of AI advances related to national and global security? Is there a need
    to

    develop an AI conscience? What are the potential impacts of AI to AI system

    warfare? Each chapter will examine the perspectives and consequences for the

    integration of AI in our daily lives, as well as its influence on society and
    war.

    There are considerable consequences for underestimating the potential impacts
    of

    AI in warfare. Sun Tzu would have fully appreciated the potential benefits of
    AI

    as a tool of deception, as he stated, “The supreme Art of War is to subdue the

    enemy without fighting.”


    We anticipate that AI will continue to evolve and expand its reach on a global

    scale. Whatever its course, advances in AI will present challenges and risks for
    its

    implementation in daily life, as well as in times of war. It is left to the human
    to

    chart a course that will help mankind navigate unknown territory and shape the

    future world in which we want to live.'
