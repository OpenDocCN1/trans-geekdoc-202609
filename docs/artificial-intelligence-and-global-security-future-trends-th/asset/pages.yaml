- pgno: 207
  md: 'Critics of AI fail to appreciate that AI is in its infancy, though having been
    present in science and society for over 30 years, AI has only begun to prove up
    recently as a reliable and even an imaginative tool. This is especially accurate
    with the emergence of deep learning and machine intelligence innovations that
    are now pervasive worldwide. That AI will emerge as a strategic advantage, given
    the appreciation of the numerous global challenges facing the world, cannot be
    underestimated as we will need AI, or the more powerful AI in the near and far
    future, to help resolve issues impacting regional and global security.


    The investments by every power and corporation in AI are now in the billions of
    dollars. We are in the early stages of this AI emergence based on not just considerable
    investment in speculation but also in results. The impact of AI and the record
    of verifiable evidence of benefits in numerous industries, especially in intelligence
    and defense, from predictive analytics, big data discovery, and bad guy hunting
    is undeniable. The big data image recognition capability alone represents a major
    breakthrough in a world of cloud-based mobile security.


    It is likely that the very concept of AI will morph and evolve in a future of
    even five years to a decade forward. Even the near future of a technology, so
    bold as AI resists perfect definition. AI in the future will not be the AI of
    today. Enhanced synthetic cognition as a service, smart avatars, sentient swarms,
    virtual bots, neuromimicry of robots, artificial synapses, and intelligent clouds
    – from toasters to autos to entire defense systems – will be AI enhanced. Clearly,
    this is a future that few are ready to imagine or navigate but it is coming faster
    with every month not years.


    AI will be the increased embedding of synthetic cognition in every physical and
    virtual thing that guides decisions and takes actions. This AI will be both controlled
    by humans and those autonomously and self-controlled will bewilder us. AI will
    simply become how things work. Your car knows your route to work. The robo-doctor
    sees at the nanoscale where to operate, and the counter terror predictive analytics
    system operates with a stealthy hypersonic smart targeting capability. Predictive
    decision-making and engagement from AI are coming that will enhance human performance
    in all forms of life, work, and national security. The capacity to act with high
    situational velocity, a comprehensive depth of understanding, a larger holistic
    systems-view and the processing of immense big data is coming from AI in the near
    future. The evolution of AI will be exponentially faster by eons than that of
    humans. Expect AI to be faster, smarter, and more accurate than human doctors,
    teachers, intelligence officers, and warfighters.


    Every device, system, weapon, computer, network, and machine will be forever altered
    by AI. All scenarios will be probable. Thus, advances in AI will shape future
    military strategies and present potential risks related to over reliance on AI
    that may lead to distrust, betrayal, and amazing breakthroughs. The competitive
    advantage of nations, either in industrial or military, will demand an AI R&D
    Race – as is the case emerging today. No mystery here. AI wars are happening now,
    we know them as cyberwars. Their numbers will increase in the coming years. Rogues
    and nation-states will do AI battle ranging from cyber to kinetics, as AI roams
    the dark web, as well as air, land, sea and space. But eventually the speed and
    comprehension of AI as a different nonhuman entity, with a different trajectory
    of evolution will surpass our human understanding for certain'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'applications. The rise of AI, and its complete transformation of defense, will
    be the most existential challenge facing the future of global security.


    As every powerful new technology from nuclear energy to genetic engineering, there
    is a case for the good, the bad, and the disaster. This will no doubt be my forecast
    for AI especially as it relates to global security. Here are a few scenarios that
    address global security challenges:


    +   (1) AI develops its own hard operational agenda beyond its human handlers
    in presenting a highly effective operations engagement that goes beyond achieving
    mission objectives.

    +   (2) AI accelerates situational awareness to identify new opportunities beyond
    human identification capacities for predicting conflict.

    +   (3) AI produces a significant global security solution that humans cannot
    understand but support as diplomats confirm its viability to solve a critical
    problem.

    +   (4) Robot armies reprogram AI lethality ethics rules to defeat adversary in
    conflict.

    +   (5) AI speeds up by a factor of 10,000× the reaction time for predicting global
    security threats in advising analysts.

    +   (6) AI goes rogue, overreacts and precipitates in offensive security actions
    in conflict with ally.

    +   (7) A Tier One AI network develops an ecosystem of defense and intelligence
    suppliers, entrepreneurs, manufacturers, and logistics to support an Arctic plan.


    Just as the internet is fast embracing AI as an overarching layer of synthetic
    cognition, effecting every choice, decision, search, and transaction, so shall
    every other aspect of our culture. If we simply accept that AI can be defined
    as the exponential increase in intelligence that may mimic human cognition but
    will also be “alien” separate from human or biological intelligence, you can begin
    to grasp how powerful and strange the future of AI may be.


    The future of AI is complex, accelerating fast and requires completely new thinking.
    In fact, in the era of AI that is approaching in the near future, 10 minutes from
    now, global security strategists may need an entirely new way to think to get
    AI right. We are not there yet. Too many well-placed leaders reduce AI to a fancy
    new computer. This is a vast lack of imagination of a strategic tool that will
    enable global hegemony for some nations and cripple others. It would be dangerous
    to not realize the fast and new power that AI represents, given the recent developments
    in self-learning, autonomy, and problem-solving as evidenced by current AI.


    With so pervasive a technology as AI, we cannot fully fathom its full potential.
    However, we can assume that we need to think about military doctrine, strategy,
    and global security quite differently with AI in the wild. Now as we step into
    the future AI will be everywhere: in the cloud, in every device, every building,
    every weapon, and even, though hard to fathom, AI in every person.


    Having been both a CEO of an early AI company and watched the evolution of AI
    change over a scant 30 years, I can say that the AI of 1985 and the AI of'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'today is an order of power that is exponentially more powerful than what we
    could have imagined because of the new breakthrough recently in machine and deep
    learning. Next will be neuromorphic AI, new AI models based on nature and biology.
    There is no more powerful a processing model for knowledge discovery than human
    brain. If we can mimic the human brain in AI, we will see even faster breakthroughs
    in AI in this decade.


    AI will enhance superiority in the global security domain. AI is the game changer.
    Speed, cognition, complexity, lethality, target perfection, and predictive analytics
    are the deliverables of AI. Whether off world in space, under the seas, by land,
    or into virtual reality, AI is a pervasive new paradigm of global security and
    warfare that is growing exponentially in capability as the technology evolves.


    Also, we cannot consider the future of AI without linking it justly to the other
    chief exponential technologies that are driving AI. AI is making every machine
    that designs or harnesses bits, atoms, genes, neurons, and qubits smarter. Mapping
    the future of the genome to cure disease, material sciences for manufacturing,
    vastly smarter and faster quantum computers will be shaped by AI. The exponential
    technologies that will be enablers and accelerators of AI will be: Quantum computing,
    nanoscience, biotechnology, information technology, and cognitive technology.


    The future of global security cannot be conceptualized without envisioning how
    AI may evolve. And the very concept of what AI may become, given the fast developments
    in fundamental technologies, would suggest that we may enter an era where Singularity
    Machines that defy human understanding entirely will be the norm by 2040 or before.
    As a culture and as a civilization, we are not ready for this invention. Smarter
    than Human (STH) machines that we will use for defense and security will be used
    by adversaries and allies. Power in global security will no longer be just in
    might but intelligence. Vast AI will battle AI as they do today in the 24/7 global
    Cyberwar that engulfs our world. Though we shoot or bomb, digital weapons are
    fast replacing boots, planes, and ships. Digital wars may be the future of conflict.


    Autonomous AI will be the new warfighters as entire armies, navies, air forces,
    and space forces go the way of dominating automation in this century. The super
    speed of synthetic cognition replaces humans. The end game may be ethical AI that
    advises humans in the loop and maybe AI proliferation objective will deter conflict,
    making global security a more realistic and achievable objective for the future
    of humanity.'
