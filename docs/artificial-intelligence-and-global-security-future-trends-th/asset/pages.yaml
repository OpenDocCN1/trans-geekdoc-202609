- pgno: 109
  md: '# What Is an Artificial Conscience?


    As human beings, we regulate our conduct in some ways, choosing and being influenced
    in ways that determine what action we take or what kind of person we become. One
    definition (and hence *theory*) of what a “conscience” is takes it that it is
    the faculty that we use to help us make these decisions, and that motivates us
    to act on these decisions once we’ve made them. I might, for example, know that
    I generally shouldn’t lie but in a moment of weakness tell a lie so as to escape
    a punishment, and my conscience will tell me both what I ought to have done and
    make me feel guilty for not doing it. Conversely, when my conscience dictates
    that I speak the truth and I do so despite the threat of punishment for doing
    so, I might feel noble pride at having done what my conscience demanded.


    A larger theory of what a conscience is would note its connection to the entire
    web of cognitive states and actions that are woven through practical moral decision-making.
    In other words, a person “with a conscience” or “of conscience” demonstrates requisite:
    moral sensitivity, moral judgment, moral motivation, and moral skill. A person
    with a good conscience knows what facts are morally relevant, combines those facts
    with good principles to make moral judgments, is motivated to act on those judgments,
    and can carry those actions out in a way that respects them. She knows, for instance,
    that when pressured to lie for no good reason, the pressures are morally irrelevant,
    and that good judgment requires that she refuse to lie, she acts on that judgment
    despite the pressure, and she carries off the resistance to pressure in such a
    way that the principles behind the action inspire others to follow her in telling
    the truth. Sensitivity, judgment, motivation, and skill are all combined.²


    Regarding moral judgment, a reasonably well-put together human conscience considers
    the kinds of principles of good reasoning embedded in our great traditional moral
    and ethical theories from eastern and western traditions, reflecting the natural
    lawyer’s point that the findings of solid reasoning and the outcomes from many
    of our faith traditions ought to coincide.


    In much the same way, then an *artificial conscience* would serve as a decision-aid
    for human-in-the-loop autonomous systems, and would be a critical faculty that
    an entirely autonomous system would need to possess. It would use AI methods to
    allow a system to embody some combination of moral sensitivity, judgment, motivation,
    and skill, either metaphorically if our artificial cognitive systems don’t possess
    those things, or literally if they do. And some of the principles either explicitly
    contained in a reasoning system or “immanent” in


    ²This is a variation of a framework offered by the moral psychologist James Rest.
    I am in his debt. See, e.g., Rest, J. et al. (1986) in *Moral development: Advances
    in research and theory* (pp. 1–39). New York, NY; London: Prager.'
