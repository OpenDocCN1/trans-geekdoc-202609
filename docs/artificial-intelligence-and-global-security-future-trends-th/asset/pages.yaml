  md: '# # Artificial Intelligence and Moral Reasoning: Shifting Moral Responsibility
    in War?


    Pauline Shanks Kaurin and Casey Thomas Hart


    # ## Abstract


    It is no longer merely far-fetched science fiction to think that robots will be
    the chief combatants, waging wars in place of humans. Or is it? While artificial
    intelligence (AI) has made remarkable strides, tempting us to personify the machines
    “making decisions” and “choosing targets”, a more careful analysis reveals that
    even the most sophisticated AI can only be an instrument rather than an agent
    of war. After establishing the layered existential nature of war, we lay out the
    prerequisites for being a (moral) agent of war. We then argue that present AI
    falls short of this bar, and we have strong reason to think that this will not
    change soon. With this in mind, we put forth a second argument against robots
    as agents: there is a continuum with other clearly nonagental tools of war, like
    swords and chariots. Lastly, we unpack what this all means: if AI does not add
    another moral player to the battlefield, how (if at all) should AI change the
    way we think about war?


    _Keywords:_ Military ethics; artificial intelligence; smart weapons; moral responsibility;
    blame; praise; combatant


    # ## Introduction


    A common observation in academic, policy, and military circles is that artificial
    intelligence (AI) and its myriad uses in warfare is the next Revolution in Military
    Affairs. In his book _Army of None_, author Paul Scharre considers whether we
    will soon have weaponry, robots, and other technologies that can carry out the
    functions of warfare that currently we associate with human beings, even eventually
    making moral judgements in and killing in war without humans in the loop. The
    idea of the “Killer Robot” is pervasive in popular culture and art, but groups
    like _Campaign to Stop Killer Robots_ and others are calling for the banning of
    lethal autonomous technologies in war. They think these killer robots are more'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'realistic than a remote science fiction future. Should we be worried? Will
    AI change the basic character of warfare, or more seriously even change the very
    nature of war if it don’t?


    Spoiler: we don’t think so. Here is a road map for how we arrive at this position.
    First, we unpack the existential nature of war, as we must first understand the
    thing that AI is purported to revolutionize. Next, we offer an argument against
    AI being morally radical. If mundane weapons of war like swords are morally unremarkable,
    you should think that smart missiles and AI-piloted drones are too. Then, we dive
    deeper into the prerequisites for agency in general and moral agency in particular.
    We additionally show that AI does not meet these requirements. We conclude with
    the more positive case: even if AI is morally ordinary, how will this technology
    expand and shift the focus of human actions as it is deployed more widely? In
    short, it increases the epistemic burden on users of the technology, and it widens
    the scope of moral responsibility: programmers have an increased moral role on
