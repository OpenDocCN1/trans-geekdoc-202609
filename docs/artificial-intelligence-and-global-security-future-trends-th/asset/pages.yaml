  img_proc: true
- pgno: 181
  md: 'To prove the point, this chapter will first look into NATO adaptation and present
    contemporary AI approaches and provide a glimpse into the vision for NATO’s AI
    enabled organizational transformation of the Alliance, and finally, present a
    strategic vision for AI solutions to solve complex security problems.


    # NATO Adaptation: An Evolution of Change and Collaboration


    Today’s environment is inherently complex with an increase of key stakeholders
    as well as the exponential increase in the connections between these players.
    With the escalation in technology and information exchange, NATO’s operational
    areas are increasingly challenging and potentially chaotic. In some regions, NATO
    is facing a broad range of threats simultaneously. The Alliance has come to realize
    that what it was designed and optimized to do is no longer applicable to today’s
    VUCA battlefield. Complexity and uncertainty seem to be the norm (Boulding, 1956;
    Pondsy & Mirtoff, 1979), and for an international organization with much history,
    legacy, and past success like NATO, it is a very difficult moment, which requires
    organizational transformation and adaptation.


    Adaptation is certainly not new to the Alliance, which has a long history and
    has undergone several focus shifts before. In fact, the Warsaw Summit acknowledged
    the fourth phase in NATO history, where “there is an arc of insecurity and instability
    along NATO’s periphery and beyond...Today, faced with an increasingly diverse,
    unpredictable, and demanding security environment, we have taken further action
    to defend our territory and protect our populations” (North Atlantic Treaty Organization,
    2016). This modern context of uncertainty and emergent developments places NATO
    within a new world where many of the traditional “tools” in the Alliance toolkit
    no longer work or result in bizarre outcomes.


    The Alliance since its creation in 1949 has mainly focused on collective defense.
    However, following the fall of the Berlin Wall in 1991 an era of cooperation began,
    where expansion (especially from the former Warsaw Pact countries) and the development
    of partnerships (including Russia) became the primary focus. In 2001, NATO’s focus
    shifted again towards expeditionary operations and crisis management with a strong
    emphasis on Afghanistan following the terrorist attack on the US.


    Thus, adaptation is not new. Rather, NATO has been an adaptive organization throughout
    its existence (Stoltenberg, 2015). As the tempo and thrust of change have accelerated
    and altered the rules of the game, beginning in 2014, a new NATO strategic focus
    has emerged and come into view (Dunford, 2017). Marked by the past two NATO Summits
    as important milestones along the path for NATO’s future, the Alliance embarked
    on a journey of organizational transformation at an unprecedented pace. While
    NATO’s essential mission remains unchanged, goals in increased adaptation, ability
    to anticipate change, and increasing both efficiency and transparency were noted
    as new benchmarks in the Summit communiques.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Three years ago at the NATO Summit in Wales in 2014, NATO leaders were clear
    about the security challenges on the Alliance''s borders. In the East, Russia''s
    actions threatened Europe, on the Alliance''s south-eastern border, the ISIL terror
    campaign posed a threat. Across the Mediterranean, Libya was becoming increasingly
    unstable. The Alliance''s leadership took decisive steps to address these challenges
    and reaffirmed the central mission: the shared responsibility of collective defense.
    Continuing this adaptive trend, Allies agreed to an increase of NATO''s presence
    in Central and Eastern Europe with additional equipment, training, exercises,
    and troop rotations.


    Following the Wales Summit, at the NATO Summit in Warsaw in July 2016, the Alliance
    had even more emergent problems and challenges to grapple with. At this time,
    NATO was engaged in all areas of its core tasks simultaneously and often in overlapping
    and confusing ways. To counter these challenges, the US quadrupled its funding
    for the European Reassurance Initiative (ERI) and sent more troops to Europe,
    who were accompanied by other NATO Allies to serve as a deterent force along NATO''s
    eastern border.


    NATO is moving ahead at a rapid pace for a large multinational bureaucratic organization;
    however, adaptation and transformation is never an easy process. Preparing for
    the future, and building strategic foresight, is becoming increasingly difficult.
    There are no blueprints, rules, or best practices anymore, and frequently an organization''s
    successful tools from yesterday actually work against it in discovering tomorrow''s
    challenges. Today, when security challenges demand a different kind of force,
    agility is essential. Thus, speed is another problem that can be addressed through
    increasing operational agility and flexibles to emerging challenges in an age
    of constant disruptions (operating). Many large military organizations face the
    same challenge; a tension between an organizational mindset and adaptive experimentation.
    The reality is that NATO is quite capable of doing both approaches at the same
    time. Allied Command Transformation (ACT) has the potential to contribute to NATO''s
    overall adaptation, while Allied Command Operations (ACO) can focus on the more
    traditional end of the spectrum while also receiving facilitation and transformative
    abilities from ACT''s adaptive efforts. NATO''s command structure with the two
    strategic commands (and their different functions) enables the Alliance to operate
    and adapt at the same time, the question is how?'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'In order to thrive in a VUCA environment, when challenges are increasingly
    complex and interrelated, NATO needs to use novel technology, like AI and a radically
    different mindset on an everyday basis to engineer new solutions. A new strategic
    approach, based on this mindset, is needed when the organization “needs what does
    not yet exist” so that it can gain or maintain relevance, as well as gain a strategic
    and tactical advantage in emergent futures (Nelson & Stoltzman, 2014).


    # NATO Transformation and AI


    In recent years, NATO has been experiencing the most urgent organizational transformation
    of its history, and is looking for answers through a very thorough foresight process.
    There is no question that the strategic environment is changing rapidly, and there
    is an acknowledgement that the Alliance is facing simultaneous dangers both geographically
    (mainly from the East and from the South) on a much wider scope than ever before.
    Europe seems to be an importer of instability now, with an increased risk of traditional
    conflict, as well as emergent crises initiated by individual actors with ideological
    differences that will inspire irregular warfare. Thus, NATO must be prepared to
    address the spectrum of chaos and conflict on a global scale, regardless if it
    is nation-driven or inspired by rogue individuals with a cause.


    These challenges were discussed as part of the Washington Project, an Atlantic
    Council supported event initiated by ACT in 2016. The principal finding of this
    event was that the Alliance must be revitalized for the new world, and an over-arching
    strategy must rely on “NATO’s ability to provide a full spectrum deterrent and
    defense tools to provide collective defense for all its members, together with
    an ability to project stability and resilience beyond its borders using an array
    of tools for crisis management” (Binnendijk, Hamilton, & Barry, 2016). Building
    a “full spectrum” deterrence and defense toolkit was a topic at the Warsaw NATO
    Summit as well. Leaders at this meeting emphasized that there is a need to develop
    continuous strategic awareness and procedures for rapid decision-making. These
    capabilities in the digital age cannot be imagined without the active engagement
    of the innovation ecosystem and seeking AI solutions already out there on the
    market.


    Experts in NATO have realized that building a comprehensive and integrated strategic
    awareness can only be achieved through information fusion, Big Data analysis (making
    sense out of the huge data sets), and sharing. Moreover, this initiative must
    address partners (especially the EU and NGOs, and think tank communities) as well,
    and enable them to contribute to information fusion. This networked-based approach
    requires new technological solutions, as well as a new kind of thinking to forge
    a new mindset based on innovative, out-of-the box thinking.


    These ideas were also supported by other strategic documents, highlighting that
    “NATO must add resilience as a core task to its existing core tasks of collective
    defence, crisis management, and cooperative security” (Kramer, Binnendijk, & Hamilton,
    2015). The drive (need) for innovation and leadership was also'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'highlighted, emphasizing that innovation will be a pre-requisite for leadership
    across all elements of national power. In addition, there is also a need to expand
    synergies between and among the key elements of the innovation landscape to encourage
    diverse approaches for capability development (Kramer & Wrightson, 2016).


    Maintaining the strategic advantage via implementing technological advances will
    help NATO maintain the decision-making advantage essential for supporting global
    security. Keeping the edge has been a major driver for the largest member of the
    Alliance (US) as well. The US has been the world’s leading and technological powerhouse
    after World War II; however, given China’s and Russia’s commitment to advances
    in technology and specifically to AI, there has been a downward shift in this
    area. The US is faced with a significant challenge that it is attempting to address
    to catch up with, but in the twenty-first century advances in AI. The race between
    the US and its adversaries is on for achieving information superiority via advances
    in technological innovation (Engelke & Manning, 2017). Specifically, regarding
    AI, there is an increasing competition from China, which has declared an intent
    to become a world leader in AI technologies in the next 10 years and has put significant
    resources behind this effort as well.


    In an age where technological development is exponential, and the context is dynamic
    and rapidly changing, there is an operational imperative to address these challenges
    given that the environment is becoming more and more unpredictable. NATO must
    bolster its commitment and foresight for implementing technological advances in
    their operations, as well as address its organizational learning processes. The
    accelerated rate of change in technology demands a need to speed up organizational
    learning processes. It is not a surprise that the GLOBSEC NATO adaptation initiative
    has also highlighted the “One Alliance” concept. This policy emphasizes that “NATO
    needs a forward-looking strategy that sets out how the Alliance will meet the
    challenges of an unpredictable and fast-changing world” (GLOBSEC NATO Adaptation
    Initiative, 2017). This policy encourages NATO leaders to commission a strategy
    review, with a future war strategy that fully integrates the full spectrum (hybrid
    warfare, cyberwar, counterterrorism, and hyperwar).


    These changes cannot be initiated, of course, without a thorough review of the
    future context and the security environment. This is the job of NATO’s ACT, which
    has completed its Strategic Foresight Analysis (SFA) report in 2017. General Denis
    Mercier, Supreme Allied Commander Transformation (SACT) has emphasized in his
    foreword that “the rapidly changing complex security environment will continue
    to be the main driver for NATO’s adaptation efforts” (NATO Allied Command Transformation,
    2017). The document itself builds upon the SFA 2013 and 2015 update reports with
    the goal to identify trends that will shape the future strategic context and derive
    implications for NATO out to 2035 and beyond.


    This long-term military transformation effort is also supported by another hallmark
    document, the Framework for Future Alliance Operations (FFAO), which is designed
    to improve the Alliance’s long-term perspective and to inform the defense planning
    processes, both for NATO overall and its member countries alike.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'The SFA puts a special emphasis on technology and Chapter 4 of the document
    highlights that “the introduction of Artificial Intelligence (AI), autonomous
    systems, and other disruptive technologies are expected to enable humans to achieve
    a profound new state” (NATO Allied Command Transformation, 2017). The document
    forecasts a new age of collaboration between humans and machines, and recognizes
    that this may bring both advantages as well as risks for humanity.


    The accelerated rate of technological advances present significant interoperability
    challenges to NATO as well as increased debate regarding the moral values and
    ethical principles associated with its use. Advances in AI technologies and related
    autonomous system designs will also have a huge effect on acquisition and life-cycle
    management processes. The ubiquitous nature of technological advances such as
    AI, et al. will be afforded to everyone regardless if they are private individuals,
    corporations, nations, and/or nonstate actors. These technological advances will
    enable disruptive behaviors, and present challenges regarding existing frameworks.
    The current near-monopoly of states for high-tech weapons continues to decrease.
    Data are becoming a strategic resource, and the increasing number of sensors in
    a global network generates both operational opportunities and weaknesses. Because
    the commercial sector is leading the development in disruptive digital technologies,
    the Alliance must build systems to collaborate with the innovation ecosystem.
    Commercial off-the-shelf solutions are increasingly available at a lower cost
    and are rapidly developed, such that nation state and nonstate actors are actively
    searching for dual-use technologies to incorporate them into their own capability
    development processes.


    The Alliance seems to understand that reliance on disruptive digital solutions,
    such as AI, will create vulnerabilities as well, and overall resilience of the
    force is becoming a critical strategic issue. The interconnectedness with large
    multinational corporations also highlights the need of critical infrastructure
    protection because in a hybrid warfare scenario, every system that supports military
    operation (such as communications, power generation, transportation, water supply)
    can be and will be a potential target.


    At the operational level, the FFAO points out that there are certain military
    implications of the above-mentioned strategic trends. These factors intend to
    inform the transformation of forces within the Alliance, including political development,
    long-term requirements, and capability development.


    These military implications fall in the main stability areas of project, engage,
    consult, command and control, protect and inform. At the heart of the system is
    a mission-command approach, which needs to be updated for the modern digital era.
    AI will enable both a superior situational awareness, to make operational decisions
    better and faster, and also the decentralized execution of human–machine teams.
    This concept of Mission Command 2.0 (Porkoláb, 2019) has huge implications on
    how future forces will fight on the modern battlefield.


    The central idea of Alliance transformation is that in order “to keep the military
    edge and prevail in future operations, NATO forces must continually evolve, adapt,
    and innovate and be credible, networked, aware, agile, and resilient” (NATO Allied
    Command Transformation, 2018). AI solutions will play a crucial'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'role in these aspects of force modernization. Recognizing this pressing need
    to maintain a technological edge, NATO’s Science and Technology Board requested
    the NATO Science and Technology Organization (a network of nearly 5,000 scientists
    and engineers) to identify potential wild cards, and start engineering potential
    solutions. In 2016, 12 technology areas were identified with a game changing impact
    on future military operations. This report has identified AI and its potential
    impact to replace human decision-makers, autonomous robot or vehicle control,
    automated information fusion and anomaly detection (NATO Science and Technology
    Organization, 2018).


    There are also other technology trends recognizing the importance of AI with similar
    implications (Deputy Assistant Secretary of the Army (Research and Technology),
    2017) and the 2018 US DoD AI strategy specifically highlights that “AI is rapidly
    changing a wide range of businesses and industries. It is also poised to change
    the character of the future battlefield and the pace of threats we must face”
    (US Department of Defense, 2018). Another UK strategic document is focusing on
    opportunities for the future of decision-making and points out that “Artificial
    intelligence holds great potential for increasing productivity, most obviously
    by helping firms and people use resources more efficiently, and by streamlining
    the way we interact with large sets of data” (United Kingdom Government Office
    of Science, 2015). The European Union’s AI Ethics and Guidelines provides a framework
    and foundations for a trustworthy AI, and details the technical and nontechnical
    methods for development of such AI systems (European Commission, 2019).


    In light of the above strategic guidance, it is not a surprise that AI is at the
    core of ACT’s future technology development focus, and the NATO strategic command
    is currently looking at AI solutions to enhance the lessons learned process, strategic
    decision-making, and the NATO defense planning processes alike.


    In sum, NATO is no exception, and (just like all other bureaucratic organizations)
    the Alliance is heavily involved in keeping up with the current technological
    trends, AI being one of the most prevailing topics. In April 2018, SACT General
    Denis Mercier stated that “We must also internalize the urgent need for developing
    innovation in order to better understand the threats and opportunities in our
    strategic environment, and ensure that throughout NATO, all understand the challenges
    of interoperability, at the technical and political level. ACT must therefore
    be in a position to bring these issues to the attention of decision-makers in
    the Alliance, at the North Atlantic Council and Military Committee, and organize
    regular meetings at that level”. During one of these meetings, known as the “SACT
    conference” which was engaging the NAC (North Atlantic Council), they focused
    on AI and the many challenges NATO has to face related to disruptive technological
    changes. In front of all NATO leadership, SACT joined Sophia the robot on the
    stage to discuss security issues, in order to demonstrate the level of sophistication
    for AI enabled systems.


    Admiral Manfred Nielson also highlighted that “Human augmentation, underpinned
    by artificial intelligence, will be the extension of centuries of human endeavor
    in which people sought to become faster, stronger and smarter through the use
    of tools and machines” (Nielson, 2018). Deputy SACT emphasized that'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'NATO must employ humans and AI teaming efficiently and ethically. For that,
    NATO must achieve an effective convergence of technology, operating concepts,
    and adapt its organization and processes. NATO''s ACT is leading that charge.


    AI and autonomy will surely drive NATO to require new processes, new skills, and
    new policies, and these changes will require political willingness and changes
    in the legal frameworks in order to fully exploit the potential of the new technologies.
    NATO has to leave its comfort zones and increase its pace at all levels. ACT''s
    leadership understands that innovation at this level requires a sustained push
    from all levels in the hierarchy, and also requires buy-in from staff members
    within defense organizations. This strategic approach related to AI and autonomy
    serves as the basis for the work carried out by ACT, and is manifested in multiple
    projects ranging from using algorithms to make sense of the last 20 years of operational
    lessons learned, to enabling and enhancing the NATO defence planning process (NDPP).


    AI was one of the key topics at the 2018 COTC (Chiefs of Transformation Conference)
    as well. Following this event, there was a call-out request for information (RFI)
    for submitting their ideas about AI-based technologies. The chiefs of allied and
    partner nations discussed the AI topic in depth and their likely impact on future
    considerations at ACT''s annual Chiefs of Transformation Conference in Norfolk,
    Virginia.


    However, worth noting is the fact that AI is primarily not a technology problem
    in and of itself. As US Secretary Mattis said “success does not go to the country
    that develops a new technology first, but rather, to the one that better integrates
    it and more swiftly adapts its way of fighting” (Mattis, 2018). Rather, AI is
    an enabler that empowers individuals with information that they decide to integrate
    into their understanding of the operational environment and use it to inform their
    decision-making.


    It was also realized by ACT as well, since the organization has been supporting
    a battle cry for organizational transformation for a long time. NATO leadership
    understands that building a platform, which is the goal of multiple technological
    solutions a technological fix, is only one side of the coin. There is a need for
    an organizational one as well, which connects the different components together,
    hence the need for design application and education, which is aimed at speeding
    up organizational learning. The idea is not new, since multiple NATO partner nations
    are already implementing and running design programs at the national level, and
    NATO already has some design networking and collaboration abilities within the
    Alliance to leverage.


    NATO ACT has taken this a step further and started to establish a formal design
    education program, at the NATO School in Oberammergau (where the first course
    ran in 2019) as well as to support project design modules (Mobile Education Teams)
    to overseas and even remote locations.


    Combining AI tech solutions and design thinking, which is a mindset for exploring
    complex problems or finding opportunities in a world full of uncertainty, and
    exploring questions such as what is, and then imagining what could be with innovative
    and inventive future solutions, could be a very potent combination for lasting
    organizational change.'
