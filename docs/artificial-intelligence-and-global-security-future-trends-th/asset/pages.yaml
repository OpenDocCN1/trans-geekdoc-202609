- pgno: 165
  md: 'capabilities of AI in the field would be rendered useless by continual intervention
    by slow human thinking. In this light, AI systems of future battlescapes will
    necessarily be largely autonomous (Scharre, 2018). However, a caveat is warranted:
    using the term “autonomous” to connote “dangerously uncontrolled” or “dumbly robotic”
    is ignorant at best, and disingenuous at worst.


    # # Delineating Major Types of AI


    AI will have an expanding role in automating an increasing number of operations
    through efficient information-processing and decision-routinization capabilities.
    Asaro (2006, 2008) has described four levels of machine system agency, which proceed
    from systems “with moral significance” that can execute basic decisions that can
    be of moral importance; through systems with increasing moral intelligence in
    their use of extant ethical codes, to an apex system that obtains dynamic moral
    intelligence. This final, most advanced iteration would engage some type of Bayesian-like
    decisional processes to advance from an initially programmed set of ethical precepts,
    to one of its own formulation, as based upon its own interactions with situations
    and environments (Rao, 2011). Building upon the work of Asaro, we posit that five
    core types of AI systems can be distinguished, with a view toward NSID applications,
    with higher-functioning types building on the capabilities of lower-functioning
    types. These types of AI are:


    +   (1) Automation AI – those systems incorporated within stationed computing
    platforms for information management.


    +   (2) Animate AI – systems acting to assess, traverse, and modify their environs
    (by projection, motility, and/or mobility) under human operational control.


    +   (3) Autonomous AI – systems conducting assigned activities without the need
    for real-time human operation.


    +   (4) Agentic AI – systems selectively engaging their environment in autonomously
    flexible pursuit of assigned outcomes.


    +   (5) Autopoietic AI – systems that adapt decision heuristics for improved planning
    and execution of agential conduct.


    A “human-supervised AI system” (of any kind 1–5) allows human operators to inaugurate,
    periodically direct, and terminate engagements under all conditions, including
    system failure. Of note is that those systems that temporarily act with a degree
    of independence do not constitute an entirely independent system. To be sure,
    types 3, 4, and 5 are autonomous, in increasingly complex ways, and terminology
    differs somewhat across AI industries and national governments (UNIDIR, 2017;
    USDDoD, 2012). In the context of NSID use, we shall refer to an AI system that
    is able to decide upon and execute actions on its own – without direct and immediate
    operational control by a human – as an autonomous system. In contrast, an AI system
    that is only able to generate'
