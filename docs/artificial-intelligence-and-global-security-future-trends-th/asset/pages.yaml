  md: 'now a dream (or nightmare) of AI research. We could imagine such an AGI being
    better than humans at speed – it thinks and attains all cognitive goals as fast
    or faster than humans; or, a mere collective superintelligence would think like
    humans, but could in parallel have trillions of human-equivalent minds working
    simultaneously, with accompanying super performance. Or, there may be a “quality
    superintelligence” (Bostrom, 2014) that transcends mere human rationality and
    attains cognitive goals in ways we cannot yet imagine. Narrow AIs are commonly
    speed AIs, and with advances in parallel programming, are increasingly collective
    AIs. But narrow AIs are like idiot savants: brilliant in their specialization,
    but useless outside it. So, as humans anthropomorphize AIs and tend to (over)trust
    it once shown reliable in certain settings, they may well be oblivious to its
    limitations when asked to move outside its narrow specialization, leading at least
    to frustration, and perhaps disaster. But some would think an AI “oracle”, of
    which we merely ask questions, poses no threat on its own; only stupid or evil
    human actions that result are the problem. But embodied AIs will be able to act
    autonomously. Clarifying those issues are next.


    # Robots as Embodied AI and LAWS


    A classic definition of a robot (Bekey, 2012) is a machine, situated in the world,
    that senses, thinks, and acts. Like humans, robots have sensors that detect aspects
    of its environment and actuators that enable it to move and affect that environment.
    And like humans, a robot can think: that is, it has an AI.


    LAWS are robots designed for the purpose of being able to choose to target and
    kill humans. Humans can be “in the loop”, meaning a robot will never fire a weapon
    at a human on its own; a human must always make the ultimate firing decision.
    Or a LAWS can have a human “on the loop”, meaning that robot may target autonomously,
    but a human can override its decision to fire; or the robot may have humans entirely
    “out of the loop”, in which both targeting and firing are autonomous, and all
    a human could do is deactivate the robot after the fact.


    The problem of “latency” helps explain the push towards LAWS with humans out of
    the loop: there is a lag time between a robot targeting an enemy and the human
    authorizing the firing, and then the robot carrying out the order. This latency
    may cause the robot to miss, or even worse, hit an unintended target (collateral
    damage), or reduce its fighting efficiency and be more vulnerable itself. As the
    tempo and complexity of warfare increase, there will be increasing pressure to
    allow the AI to make the targeting and firing decisions itself. That will be particularly
    true in contexts in which the latency is great, or in which it is difficult or
    impossible for human controllers to participate. Space is perhaps the most obvious
    such arena for such considerations: the distances are vast, the needed electromechanical
    linkages between operator and robot are difficult to achieve and particularly
    fragile even when achieved; and it ranges from unrealistic to simply impossible
    for human operators to be in the battlespace or easily intercede during the warfighting.
    Accordingly, the pressure will be immense to deploy'
