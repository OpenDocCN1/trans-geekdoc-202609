    # Conclusions


    The evolution of AI technologies and AI-enabled autonomous unmanned systems will
    continue to shape our daily lives and future warfare (Tegmark, 2018; Russell,
    Dewey & Tegmark, 2015). This book is aimed at developing an understanding of the
    issues at stake related to AI technologies and their contribution toward ensuring
    future global security.


    We aim to promote an understanding of the benefits, costs, and risks related to
    the integration of AI systems in the future battlespace (Yudkowsky, 2007). We
    contend that there is an operational and strategic imperative for all citizens,
    military personnel, and especially those leaders who forge our national security
    strategy, to achieve an understanding of AI technologies.


    For society, we anticipate that advances in AI will continue to influence and
    shape our lives. We anticipate that AI will benefit humanity in the medical realm
    as we gain greater knowledge and understanding of the brain. We must remain vigilant
    regarding the ways that AI may be used to control us as individuals. We must guard
    against violations of our personal freedoms and independent thought for that is
    the very essence of humanity (Hawking, Musk & Wozniak, 2015; Kurzweil, 2006).
    Our ability to think, create, and be innovative stems from our individuality.
    Removing or reducing our individuality puts mankind at risk of entering a new
    Dark Age.


    For the military, nations will continue to exploit AI advances as they seek to
    achieve the competitive strategic advantage over their adversaries. AI systems
    and technologies will continue to enhance military readiness capabilities. We
    anticipate that advances in AI technologies will continue to present ethical challenges
    for leaders and soldiers alike. Government leaders will continue to be challenged
    with weighing the costs, benefits, and risks associated with developing advanced
    AI technologies.


    Future information superiority will rely on AI systems to anticipate and capture
    our adversaries’ intent well before any actions are taken. Future AI systems will
    use pattern recognition to sort through information generated by our adversaries
    to inform the military of potential dangers on a global scale. We recognize that
    the future will continue to be complex especially in the military operational
    environment. Therefore, we need to develop AI technologies that will reduce the
    uncertainty of the environment and help decision-makers to make decisions even
    when they can’t know everything. AI may reduce the timeline in decision-making
    but must also reduce uncertainty by filtering information for the decision-maker
    as there is just too much information to sort through. AI systems can process
    information and test numerous hypotheses at one time, thereby filtering potential
    consequences related to each potential outcome of decision-making. This would
    be extremely helpful for the future military decision-maker. Intuitive, adaptive
    AI technologies and system designs of the future will provide the decision advantage
    and accelerate the decision cycle. We must ensure that the data provided to the
    AI system is accurate at the outset. We must validate and verify information'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'throughout the processing cycle to ensure that leaders have the right information
    and valid recommendations from the AI system to inform their decision-making and
    minimize potential second- and third order consequences, such as unintended consequences
    and collateral damage.


    Anticipatory AI (AAI) networks, like precognition, will be developed and used
    to capture data related to intention (Giordano et al., 2014). There are ethical
    consequences for adversarial actions that may be detected and prevented by applying
    AI networks to examine adversarial intrusions and detect intention a priori. AI
    systems will conduct the analysis of social networks, identify potential adversaries,
    and predict potential adversarial actions, well before any plan has been executed.
    Passive, persistent surveillance using AI technologies, from sea floor to space,
    will afford the military a decision advantage. Regardless of the domain (i.e.,
    ground, air, undersea, sea, and in space), AI technologies will play a critical
    role in national and global security in the future. There will continue to be
    the persistent, pervasive surveillance of private citizens to ensure security
    and stability in society. There is a real risk of losing personal freedoms in
    the future. Our freedom to think independently will present risks for societal
    compliance. Innovation and discovery may also be challenged in this new world
    environment.


    We contend that there is a need to address these issues with a sense of urgency
    if we are to ensure intellectual freedom as well as ensure a peaceful future.
    Nations are competing to gain technological superiority in AI. We must fuel the
    fire and garner support if we are to gain the competitive advantage in this race
    for AI superiority. As a nation, it is incumbent upon our leaders to seek every
    opportunity to exploit the advances of AI-enabled technologies that will ensure
    future global security. Failure to address the ethical challenges related to the
    development of advanced AI technologies will result in the development of a vulnerability
    in the military defense system.


    We must acknowledge our commitment to society and the military''s professional
    responsibility to defend the trust between the military and fellow citizens. We
    must also prepare to defend ourselves against our adversaries, and perhaps, even
    prepare to defend against the AI-enabled autonomous systems in the future. Enabling
    the development of AI autonomous systems will enhance our military capabilities
    and ensure that we are competitive with our adversaries and capable of defending
    our national and global security.


    Like the sentry at their post, we must remain vigilant regarding the ways that
    adversaries may exploit future AI designs for their strategic advantage (Finney
    & Klug, 2016; Lin, Bekey & Abney, 2008). There is a clear and present danger that
    exists in conjunction with advances in AI technologies when one considers how
    adversaries can reconfigure it for malicious intent. Nations must be circumspect
    and vigilant in this regard and defend against deception, manipulation, and attacks
    that threaten future global security. Nations must work together, collaborate,
    and cooperate to preserve the security of our world. It is about global security
    not which nation will lead in AI.


    We must preserve our intellectual freedom, be innovative, and protect our rights
    to be private citizens in a world where privacy has been traded away for a false
    sense of security. It is incumbent upon us to create the future we want. We'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'owe it to future generations to be steadfast in our demand for ethical values
    to be maintained in a society where it is far easier to allow our values to erode.


    We offer this book as a tool for discussion. It is intended to address the challenges
    and concerns for preserving our freedoms and ensuring global security. This book
    is aimed at increasing an understanding of issues related to implementing AI technologies
    in daily life and warfare. Each chapter conveys critical aspects of integrating
    AI technologies into our lives and the future battlespace. AI technology’s impact
    and influence on our lives will challenge society, ethics, morals, values, freedoms,
    Just War theory, space warfare, conscience, privacy rights, as well as challenges
    related to NATO military operations and global security. We believe that the integration
    of AI in future warfare is a complex topic and have only addressed but a few of
    the trends, threats, and considerations. We aim to foster thought and inform those
    interested in Artificial Intelligence technologies of the challenges related to
    ensuring global security. We contend that the time has come for every nation to
    focus on Artificial Intelligence technologies and the role these technologies
    will play for securing our future.


