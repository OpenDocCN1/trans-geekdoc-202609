  md: 'the principles behind the laws of armed conflict, there is a sense in which
    the moral enterprise which causes us to come to the defense of the innocent and
    of liberty to begin with also requires us to develop and deploy an artificial
    conscience. We are “just warriors” when we use violence only as a last resort,
    against combatants and not innocents, and for the betterment of all, and while
    embodying the virtues implicit in the cardinal virtue of justice. These are all
    moral considerations. These same moral considerations don’t just permit but actually
    require us to develop an artificial conscience.


    An ethicist would say that “ought implies can.” That is: we can’t be required
    to do what we aren’t capable of doing. In the next section, I discuss both the
    potential functional architecture and content of an artificial conscience. We
    can and ought to develop it.


    # How Would We Build an Artificial Conscience?


    Two critical questions regarding an artificial conscience are: (1) what would
    its architecture be, and (2) what kind of content would it contain? The first
    question is one of how we ensure that the moving parts of an artificial conscience
    fit together so that it can enable the requisite capacities. The second question
    is likely the more controversial one: Where would the content for the conscience
    come from and how would we integrate it into the architecture?


    The best perspective to take here is broadly functional: What functions do I want
    the architecture of the network to embody? Recall our earlier discussion of four
    general capacities that enable us to be moral actors: moral sensitivity, judgment,
    motivation, and skill. Let’s discuss how each of these in turn can be embodied
    in an architecture.


    Moral sensitivity is what allows a good conscience to be sensitive to some facts
    and circumstances and not to others. Moral sensitivity is the capacity to sense
    and recognize morally relevant facts, and to know that moral principles or concerns
    are present in the current circumstance. For instance, a morally sensitive agent
    would recognize when others are suffering or when there is a likelihood that suffering
    will result from an action or others take. Depending on the content of the artificial
    conscience, morally relevant facts may include whether the agent or another’s
    actions are causing harm or suffering, whether other agents are involved in the
    unfolding action consensually (implicitly or explicitly) or if they are present
    unwillingly, and an understanding of how current circumstances represent functional
    or dysfunctional states for agents and tools (say, by knowing that in general
    not being able to control one’s appetites is not good for a person). Some notions
    of moral sensitivity also include in this capacity an ability to know what general
    rules, principles, or concerns are at risk or relevant in current circumstances.
    For instance, an unequal distribution of goods might indicate that an unjust procedure
    was used to allocate them and hence there might be issues of justice present if,
    through no fault of their own, one person is starving while another is living
    large. These rules of moral salience as Barbara Herman calls them may also be
    part of moral judgment (see, e.g., Herman, 1997).'
