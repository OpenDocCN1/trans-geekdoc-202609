    perform some task when certain conditions are met. A thermostat is like this:
    when the temperature is above or below some temperature setting, the A/C or the
    heat will kick on. But we struggle to see these processes as intelligent. In the
    thermostat case, the mechanism is often that some piece of metal bends to complete
    a circuit, or some quantity of wax under pressure melts to break a circuit. While
    these are clever engineering feats, they do not constitute intelligent agents
