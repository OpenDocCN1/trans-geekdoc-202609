- pgno: 200
  md: '# Conclusion: Four Key Considerations for a Globally Secure Future


    Literature about security, warfare, and technology is vast and increasing daily.
    However, as a follow-on to the chapter presented in this book, interested readers
    might refer to the works of writers such as Keith Abney, Ronald Arkin, Ian Barbour,
    George A. Bekey, Patrick Lin, and George Lucas, Jr.


    The contributors have provided various definitions of AI and other key terms.
    They have explored whether AI can be moral and the possibilities of programming
    and building an artificial conscience. The authors have applied well-known ethical
    frameworks to the puzzles of AI and LAWS in a global security context. Synthesizing
    the given definitions of AI, we assume that it may, indeed, be possible to program
    a continuum of operationalized, narrowly, and locally defined ethical rules into
    AI. Conjoining this assumption with established international normative tenets
    derived from just war ethics as a baseline for discussion – this brief analysis
    asserts four key considerations for a globally secure future:


    +   (1) AI technology currently necessitates near-Turing-test ethics.

    +   Automation and human-augmented actions are enough of a tipping point without
    definitively passing the Turing test. AI ethics researched and developed must
    address the concerns of human-machine team, augmented human, and automated weapons
    of warfare.


    +   (2) Complexity and uncertainty necessitate short-term, intermediate, and long-term
    strategies for ethical AI development and use.

    +   Given the VUCA (volatile, uncertain, complex, and ambiguous) aspects of the
    current global security environment, leaders must consider short-term, intermediate,
    and long-term tactics and strategies. Establishing a continuum of AI types and
    debating which technologies fit into which levels is a useful way of anticipating
    problems and determining how ethics must be applied. If we are to, as Casebeer
    exhorts, stay ahead of the ball, we must exercise ethical analysis and integration
    now and cyclically repeat for improvement as technologies develop.


    +   (3) Dual-use AI development necessitates dual-use ethics.

    +   Dual-use will continue to predominate AI research and development as a method
    of embracing innovation. Dual-use development strategies skirt (and creep up upon
    without necessarily activating) a public demand to address AI ethics. Responsible
    innovation, implementation, and law necessitate discourse on how to apply just
    war and other warfighting ethics to global security concerns. AI ethics are applicable
    now, in the current time frame, to a variety of contemporary and near-future AI
    and warfighting technologies. Any technology has a potential for dual-use; and
    creators, users, and the spectrum of concerned parties (from citizen watchdogs
    to leaders and lawmakers) must reasonably incorporate safeguards against alternative
    exploitation.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# (4) New AI technology structures require strong ethical foundations.


    Although the technological landscape of AI and global security are quickly shifting,
    foundational ethics remain the same. We must shift to a prerogative of constant
    and cyclical application of ethical principles as a part of all processes. Although
    grounded in the Western intellectual canon, the ethics of the just war tradition
    are a useful and globally applicable framework and foundational to existing international
    norms and law.


    Many might effectively argue that these considerations are evident. Yet, it is
    worth noting that, to date, there is still no international consensus on what
    constitutes a Lethal Autonomous Weapons System. According to an August 2019 policy
    think tank summary on the status of International Relations and LAWS, nation-state
    parties debating a preemptive LAWS ban have been unable to agree on a singular
    definition for LAWS. Although militaries already have operationalized automation
    functionality into weapons, no lethal weapons are currently recognized as fully
    autonomous. The study consolidates data on nation stances, which fall into a recognizable
    international relations pattern. States that have a high probability of either
    acquiring or developing LAWS capability oppose the ban, while those that lag in
    acquisition and development support the ban. Of more than 30 nations, those that
    oppose the ban include France, Israel, South Korea, Russia, the United Kingdom,
    and the United States as countries the analysts mark as most capable of developing
    LAWS – in addition to Australia, Belgium, Germany, Spain, Sweden, and Turkey.
    Given the current global security climate, it is natural that states racing toward
    LAWS superiority would reserve a right to pursue that technology. Likewise, it
    is prudent that nations that would be disadvantaged by lacking LAWS technology
    would support such a ban. In hindsight following a possible first automated mass
    destruction event, a ban might constitute a wiser choice. Given the current global
    technology landscape, a moratorium on the race to acquire LAWS is highly unlikely.


    With a silent post-Cold War race for automated mass-destructive advantage already
    in progress, just states pursuing LAWS have a moral imperative to integrate just
    war ethics. Whether from Western or other perspectives (and barring an enforceable
    international ban on LAWS), integration of and due diligence concerning AI ethics
    is the only way to keep conventional war tenets in practice and to avert the chaos
    of warfighting with questionable limits and no identifiable ethos.


    # Disclaimer


    The views expressed in this presentation are those of the author and do not necessarily
    reflect the official policy or position of the US Naval War College, the US Navy,
    the US Department of Defense, or the US Government.


