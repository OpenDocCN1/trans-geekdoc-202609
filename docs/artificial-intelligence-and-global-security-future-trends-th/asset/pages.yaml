    But privacy is a difficult issue as we will see in the next section.


    # Definitions


    A general discussion of privacy is evidently nebulous because of the circular
    logic that often prevails when attempting to define it and because people are
    a product of society. The same experiences that mold a person''s current view
    of the world also shape their views on privacy. Why be so concerned with a precise
    definition? Because, without a shared understanding of privacy, it is difficult
    to heed the dangers presented by its erosion. Without an understanding of the
    dangers presented by its erosion, it is difficult to fully understand the consequences
    of checking the box to accept third-party terms of service agreements presented
    to users in order to collect an individuals'' data. And without a shared understanding
    the technology behind it, it is difficult to avoid potential dangers until damages
    are incurred or when justice is sought after those damages occur. In order to
    make informed choices users must fully understand how the technology works, why
    it is being used, how their data will be managed, and who will have access. Most
    of all, who owns these data is a much bigger question.


    Privacy and data collection rely on basic agreements that relay how users'' information
    will be collected and used. Terms of use and privacy agreements are a point of
    contention because they are a source for both confusion and paradoxically are
    partially the normalization blind trust which contributes to eroding privacy and
    loss of autonomy. The confusion on the parts of users stems from the lengthy technical
    jargon, poor imprecise definitions, and a general lack of understanding of what
    these data create. Because they are confusing, lengthy, and must be accepted for
    the service to be used, few individuals actually read them. And because these
    services are ubiquitous in everyday life, their mass use means mass acceptance.
    The following definitions discuss why this construct leads to the current mindset
    here in the United States.


    In a quantitative study designed to understand the parameters of privacy, Kristin
    Martin compares a social contract approach to privacy with Helen Nissenbaum''s
    (2004, 2009) definition using contextual integrity using respondents associated
    with athletic teams. These members'' relationships are shown to be a decent proxy
