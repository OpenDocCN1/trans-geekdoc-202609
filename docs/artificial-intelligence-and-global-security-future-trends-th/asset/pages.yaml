    # Scenarios, Including Ultimate Scenario


    A primary goal of this chapter is to help us avoid the **First Generation** problem
    in space, a problem more generally for technology ethics (Abney, 2019). The problem:
    does a first generation of users of a new technology always need to suffer or
    even die in order to accrue objective evidence that the risk of its use is real
    and unacceptable? This problem is especially pronounced in space, in which many
    near-term scenarios will be occurring for the first time in the near future, and
    the perils are still underexplored. We clearly have a need to do what is called
    “anticipatory ethics”. The following scenarios are introduced as thought experiments
    in the beginnings of an attempt to do such anticipatory ethics for space war.


