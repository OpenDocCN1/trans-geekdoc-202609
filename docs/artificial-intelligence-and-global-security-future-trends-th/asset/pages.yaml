    # War as Existential, Not Just Instrumental


    In order to address the context in which the questions of moral reasoning, autonomy,
    and agency arise relative to AI, we need to first consider the character of warfare
    within which AI and humans operate. Carl von Clausewitz famously notes, “War is
    politics by other means”; in other words, war is an'
