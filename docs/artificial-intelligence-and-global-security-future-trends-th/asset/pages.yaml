    Moral sensitivity can be embodied in an artificial conscience with the right combination
    of sensors and algorithms. If the utilitarian domain is especially important for
    most decisions the algorithms will be making, we will need multi-spectral sensors
    capable of detecting the types of activities that usually are affiliated with
