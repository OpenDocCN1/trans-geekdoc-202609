  md: 'Toward this end, it will be highly likely that we will need to engineer a set
    of tasks which resemble those we believe our autonomous or semiautonomous systems
    will be accomplishing in the field so that we can stress test our artificial conscience
    appropriately. To explore edge cases and stress test hierarchies of heuristics
    and biases, we will need something like a “moral Olympics,” and in some cases
    we might be able to use the wisdom of crowds as a starting point for populating
    effective algorithms that can make it most of the way through our moral decathlon
    and be worthy of incorporation into the core suite of an artificial conscience.


    # Concerns and Rejoinders


    As important as this enterprise is, there are several concerns we should note
    and consider in the design of our artificial conscience research and development
    program. These include worries about whose justice we will consider, concerns
    that this is not possible either in principle or empirically, and concerns about
    rejection because of a lack of trust and transparency. Let’s discuss each of these
    in turn.


    First, when people discuss an artificial conscience, they often justifiably worry
    about “whose justice” and “which ethics” will be incorporated into it. This is
    a worthwhile and important concern. As discussed above, the three Cs and the traditional
    rules and laws of warfare are a good starting point where there is mutual overlap
    between reasonable positions. But the other important point to note is that these
    same concerns already apply to the training in ethics and the rules and laws of
    war: we already embark on programs designed to train soldiers about how to think
    about moral issues on and off the battlefield. We have courses in professional
    military ethics. We distinguish our military training institutions not just by
    the technical expertise they generate but by noting that they develop character
    and professional judgment needed for warriors. We already face and deal with this
    question with people; the same answers that work there are our beginning point
    for answering this concern. Our ethics and our justice, reflecting humanity’s
    shared experience, will be our starting point, just as it is for soldiers facing
    these issues on the battlefield today. Of note, in much the same way that we have
    a generally transparent democratic process that has helped us arrive at the rules
    and laws of war and which serves as critical input into the content of our military
    training and character development institutions, we will also likely need transparent
    and democratic involvement in this process.


    Second, some worry that building an artificial conscience is either a conceptual
    or an empirical impossibility. On the conceptual side, these critics may say that
    an artificial conscience is not a conscience at all; or that sets of algorithms
    and platforms and their human teammates can’t be “free” in the way that the individual
    human conscience is “free.” Of note, if this is true, then the critic has nothing
    to fear – just relabel this paper “Building an artificial system which advises
    us about things we ought to do or think morally speaking but which we aren’t going
    to call a conscience because of other things we believe.” No harm, no'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'foul, in that case; and if the research program turns out to be successful,
    so much the worse for that critical position. The next thing to note is that we
    are already building miniature versions of artificial consciences, both in terms
    of algorithms that do moral heavy-lifting for systems – such as automated target
    recognition systems or automated systems which take control of an aircraft when
    a pilot is task-saturated to prevent its destruction – and in terms of the children
    we raise day in and day out. My child’s sense of morality develops over time –
    the code, lessons, training and instruction we wire together that moral control
    system. We are already literally and figuratively building artificial and natural
    consciences every day. We should not let outdated assumptions about the nature
    of cognition or the analytic impossibility of an artificial conscience prevent
    us from digging in more deeply. The pace of technology development demands it.


    Third, even if building an artificial conscience were possible, some critics worry
    that a lack of transparency in it and trust in it might prevent its use or deployment.
    This is a salient worry, and one we face even when dealing with people. As we
    build an artificial conscience, we might also need to apply the fruits of programs
    exploring intelligible or interpretable AI, biasing our methods toward ones that
    have transparency built in from the start. Of note, proper, design, education
    and actual use – especially co-training between the artificial system and human
    teammates – can help address the former. We trust systems that we use successfully
    in repeated interactions. I have little insight into the code that helps my Global
    Positioning System device in my automobile function, but trust it despite its
    lack of transparency because I have a general idea of how it works, and I have
    used it to navigate successfully thousands of times now. The same can go for our
    artificial conscience.


    # Preparing for the Moral Future of Autonomy Today


    In our discussion of artificial intelligence ethics, I’ve made the case in this
    chapter that it is possible to build an artificial conscience. We covered the
    basics of what an artificial conscience would be, motivated building one by discussing
    the need for it, and talking some about the practicalities involved in architecture
    and content. The concerns we face as we build one are not insurmountable, either
    conceptually or technically. Building an artificial conscience is not only possible,
    but also morally required if our semi-autonomous and autonomous teammates are
    to collaborate fully with human soldiers on the battlefield. Prudence and morality
    both would recommend that we equip our human soldiers and warriors with the best
    technology that can be had so they can prevail in peace and war, and live with
    themselves while doing so.


    The logic of the deployment of military technology on the battlefield means that
    autonomy will become even more important in future battles, be those physical
    or cyber. Let’s ensure our machine teammates who come with us in that future are
    equipped with the basic machinery of moral sensitivity, judgment, motivation,
    and skill. Let’s give them an artificial conscience.'
