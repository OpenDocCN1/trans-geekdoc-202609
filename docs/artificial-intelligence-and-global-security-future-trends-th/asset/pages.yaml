  md: '# Chapter 11


    # Epilogue: The Future of Artificial Intelligence and Global Security


    James Canton


    One cannot speculate or about forecast the future of global security without considering
    the future of Artificial Intelligence (AI). The genie is out of the bottle though
    not all leaders see this coming. The weaponization of AI, either in virtual such
    as cyber or analytics or physical as synthetic brains for drones, ships, or robotics,
    is an undeniable game-changer for global security. Nations want AI as deterrence,
    reprisal, defense, and/or aggression. Whether it be the great power competition,
    gray wars, rogue engagements, or terrorist incursions, AI’s trajectory of increased
    utilitarian intelligence and eventual autonomous lethality are undeniable. This
    is coming sooner than predicted. Hold on.


    The future of AI will parallel the future transformation of national and global
    security. The AI race among state and nonstate actors, to swiftly with agility
    become a “have” rather than a “have not,” of AI are facing off presently in a
    decisive competition influencing intelligence, diplomacy, and defense. There are
    as many sinister scenarios that are logical for AI in the hands of actors that
    seek to elevate their game of chaos, threat, and aggression as the antithesis
    of peace. Cyber-AI makes fake news a truth machine. Elections become targets.
    AI wars make for common fare. Autonomous AI-as-a-Service becomes the game-changer,
    first between private actors and then expanded to state and state surrogates.
    AI will protect humans from AI, we hope.


    We should be wary of the immensity and underestimation of the exponential evolution
    of AI, whether in the hands of bad actors, state or nonstate. Of course, bad actors
    also will include AI; not just the popular sci-fi rogues but rather AI with their
    own agenda of logical efficiency, mission-adaptation, critical upskilling, extrapolative
    decision-making or sheer sustainability, and Darwinian survival. This will not
    be hard to predict as the rise of neuromorphic and neuromimetic AI models, modeled
    on human neuroscience, emerges as a dominant paradigm for AI development. Not
    surprisingly, the future of AI will be based on biological evolution. Computational
    biology of the future will program synthetic neural networks to enable higher
    functioning AI to embrace immensely complex tasks and problems that defy humans
    today or simply will take humans too long to'
