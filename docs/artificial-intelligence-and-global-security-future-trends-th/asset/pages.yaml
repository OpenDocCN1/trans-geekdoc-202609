- pgno: 83
  md: '(US Department of Defense, 2019, p. 4). With respect to AI and the ethics of
    war, how then should political and military leaders respond to and prepare for
    these changes?


    When considering ethical principles and guidelines with respect to war the question
    quickly arises of “by what standard” or “within what framework?” Only when that
    framework is developed and known can leaders consider the ethical dimensions of
    warfare. These ethical dimensions must be explicitly acknowledged in order to
    continue to guide decision-making and conduct for leaders, warriors, and stakeholders
    in all phases before, during, and after war.


    # If Not Just War, Then What?


    The subjects of war and AI are each enormous and multifaceted. When one brings
    these two wide-ranging topics together for consideration, what resources are available
    for considering the specifics of AI and war? This section contends that the just
    war tradition is a viable and valuable framework that answers the US 2018 AI Summary
    call for “creating a common foundation [italics original] of shared data, reusable
    tools, frameworks and standards [italics added]” (US Department of Defense, 2019,
    p. 7). The history of the just war tradition provides ample evidence of its ability
    to interact with new technologies of war and adapt to contemporary needs. Although
    it is a centuries-old framework, it is not a static framework.


    Although the framework continues to have strong supporters and detractors, refinement
    and application of just war principles are the subject of ongoing discussion and
    debate among both groups. Within the realm of robotics and AI, the work of writers
    such as George R. Lucas, Jr., Mary L. Cummings, Ronald C. Arkin, Jai Galliott,
    and Peter M. Asaro is important in that they interact in varying degrees with
    the just war tradition and are able to bridge the humanities/ science divide,
    albeit from different perspectives.7


    The development and use of any warfare technology should be considered and analyzed
    within the framework of the just war tradition. The tradition is a framework that
    is capable of dealing with anything that comes along with respect to warfare –
    if not, then it must be jettisoned and replaced with a comprehensive framework
    that can deal effectively with contemporary issues.


    If we are going to have a theory of war, then it must be comprehensive with respect
    to the spectrum of war (low to high intensity), participants in war (combatant,
    noncombatant, nonstate, state, contractor, mercenary, etc.), and tactics and weapons
    (swords, bows, crossbows, tanks, planes, NBC, drones, AI, etc.)


    7Especially helpful as an introduction to some of the concerns of robotics and
    the just war tradition is Peter M. Asaro (2009). Modeling the moral user. IEEE
    Technology and Society Magazine, Spring, pp. 20–24. See also his work How just
    could a robot war be? In P. Brey, A. Briggle, & K. Waelbers (Eds.), Current issues
    in computing and philosophy (pp. 50–64). Amsterdam: IOS, 2008.'
