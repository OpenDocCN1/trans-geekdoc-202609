- pgno: 193
  md: '# Chapter 10


    # AI Ethics: Four Key Considerations for a Globally Secure Future


    Gina Granados Palmer


    # Abstract


    Harnessing the power and potential of Artificial Intelligence (AI) continues a
    centuries-old trajectory of the application of science and knowledge for the benefit
    of humanity. Such an endeavor has great promise, but also the possibility of creating
    conflict and disorder. This chapter draws upon the strengths of the previous chapters
    to provide readers with a purposeful assessment of the current AI security landscape,
    concluding with four key considerations for a globally secure future.


    Keywords: AI; ethics; dual-use; key considerations; robot; neuroscience; LAW


    # Coming to Terms with AI


    There is no consensus on a final definition of Artificial Intelligence (AI), but
    AI must be defined in some manner as a baseline for discussing AI ethics. However,
    as evidenced in the previous chapters, many concepts overlap. These varied contributions
    map to a general framework for ethical discussion – a kind of Rosetta Stone of
    AI terms, concepts, and puzzles. This general framework can help leaders understand
    AI issues, associated ethical problems, and possible options for future exploration.


    Building a framework for ethical discourse, Casey Hart and Pauline Shanks Kaurin
    employ Heather Roff''s three distinctions of AI: AI can automatically perform
    tasks, incorporate a method of machine learning to improve performance, and make
    symbolic claims about data and draw conclusions by manipulating those symbols.
    While not nailing down a specific definition for AI, these iterations of AI, as
    described, are incapable of passing a Turing test (achieving independent thought
    indistinguishable from human thought).'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Hart and Shanks Kaurin contribute from a philosophy and military ethics perspective
    en route to establishing foundational AI ethics and exploring moral agency. In
    contrast, contributor Keith Abney takes a robot AI and corporate research and
    development view, citing six recent definitions for AI used by influential AI
    companies. Notably, a 2018 Sony Corporation definition marks any technology performing
    information processing for specific tasks as AI if people perceive it as intelligent.
    This model does not require AI to pass the Turing test; the AI need only reasonably
    imitate intelligence. Other definitions Abney cites employ similar perception-based
    language, stating that AI systems need only “emulate, augment, or compete with”
    human performance on specific tasks. He further defines AI along the two axes
    of thinking and behavior. This division also reinforces the idea that AI need
    only behave as humans do (and do not necessarily have to *think* like humans)
    to merit consideration as artificially intelligent. These prior definitions in
    hand, Abney proposes AI is “a goal-oriented, problem-solving thinking process,
    with at least some human-level (or better) capabilities, that arose artificially,
    not naturally.” He further extends his reasoning to include definitions for relevant
    subcategories that will be discussed later in this chapter. These include delineation
    of narrow and general AI and a definition for “robot,” eventually honing in on
    how these concepts apply to twenty-first-century warfare.


    Contributors in this volume refine definitions of AI with increased granularity:
    John Shook, Tibor Solymosi, and James Giordano specify “five core types of AI,”
    expanding upon the work of Peter Asaro:


    +   (1) Automation AI

    +   (2) Animate AI

    +   (3) Autonomous AI

    +   (4) Agentic AI

    +   (5) Autopoietic AI


    Of these five core types, Type 1 and Type 2 incorporate ways of processing information
    for a task. Type 1 is a stationary machine with no animated physical attributes,
    and Type 2 animated in the sense that it is mobile enough to navigate through
    an environment in some manner. Type 2 automates processes but is also constrained
    by a human in the decision-making loop. As such, humans are involved in all process
    stages to approve courses of action. Type 3 conducts assigned *activities*; but
    does not need a human in the loop, and is therefore autonomous; while Type 4 may
    autonomously pursue assigned *outcomes* in any manner it chooses. Finally, Type
    5 is “autopoietic,” in that it incorporates decision heuristics to learn, adjust,
    and execute agential conduct.


    Shook, Solymosi, and Giordano’s five core types provide a continuum of AI acquisition
    and, therefore, are useful for purposes of establishing a common framework. Mapping
    against Hart and Shanks Kaurin’s AI definitions: although Types 1–5 accomplish
    increased levels of behavioral agency as separate from human intervention, none
    of them necessarily achieve moral'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'agency. Indeed, Hart and Shanks Kaurin might argue that only Giordano et al.’s
    Type 5 systems might have a distant future possibility of acquiring moral agency,
    but only if machines manage to reach beyond rote, human-determined automation.


    # Narrow, Narrow, Narrow


    How does all of this apply to global security? To tighten the frame requires at
    least three more concepts as prescribed by Abney: (1) narrow versus general AI
    (AGI); (2) robot; and (3) Lethal Autonomous Weapons Systems (LAWS).


    Regarding narrow AI versus AGI, Abney provides further delineation of terms. Narrow
    AI “matches or exceeds human capabilities at attaining a specific cognitive goal,”
    while an AGI “has human-level or better capability generally and moves toward
    realization of general, non-human sentience.” These narrow, specific constraints
    allow short-term, targeted application of AI principles to systems that fall short
    of Turing-test sentence. Contrastingly, Hart and Shanks Kaurin analyze morality
    and ethics from an AGI perspective, while Abney tackles narrow AI with cognitive
    goals specific to the space warfighting domain.


    Before addressing the last two definitions as proposed by Abney, it makes sense
    to first acknowledge the need for a timeline component of our framework. Namely,
    different types of AI and different innovation timelines for narrow AI versus
    AGI evidence the need for short-term, intermediate, and long-term strategies and
    solutions. We may then harness the timeline to provide a flexible framework for
    discourse and policy. Short-term might, for example, denote realization within
    one to five years, intermediate within 5 to 10 years, and long-term in 10 or more
    years. Thus, the present chapter acknowledges that anticipatory ethics (as Abney
    prescribes) must simultaneously address all three of these timelines at once.


    Abney observes that the nature of conflict is radically shifting in the short-term
    and concludes we will soon be forced to rethink the ethics of war. He further
    asserts that two factors will dominate this radical shift: the warfighting domain
    of space and integration of AI automation. As previously noted, AI only needs
    to emulate human behavior and result in tangible consequences to warrant anticipatory
    ethics application. Indeed, if the history of atomic bomb development is any indication,
    we need only be close to acquiring AI-automated warfare to trigger a race. In
    such a race, gaining warfare advantage over the enemy is the strategic imperative
    before ethics and legality have a chance to stifle innovation. The emphasis will
    be to innovate and win at all costs. Abney contends we must acquire AI superiority
    first, before nation-states such as Russia and China, to avert tyranny in the
    interest of just peace and flourishing. Scholars and politicians have long debated
    about just peace. Suffice it to say, which nation-states are “just” is arguably
    relative – and a just and lasting peace is not necessarily easy to define, much
    less establish.'
