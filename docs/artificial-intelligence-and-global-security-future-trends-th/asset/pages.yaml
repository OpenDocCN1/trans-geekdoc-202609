- pgno: 113
  md: 'Moral judgment is the capacity to be able to reason from a given set of facts
    and morally salient principles to reach a conclusion regarding what ought to be
    thought or done. Professional ethicists and computer scientists currently working
    in AI ethics tend to focus on the complexities of good moral judgment. A conscience
    with good moral judgment would know, for example, that in general the taking of
    innocent life is not morally justifiable; if presented with a circumstance where
    the agent part of the taking of life is about to cause the death of an innocent
    person it would recommend against doing that. Most courses in professional ethics
    for members of the military focus on issues in moral judgment: When is it right
    for us to use violence to achieve a goal? What kinds of character traits should
    we try to develop in our warriors so that they are the best they can be? When
    can you justifiably deceive an adversary? Moral judgment consists in the capacity
    to move from considerations of facts and circumstance in conjunction with knowledge
    of what right action consists in more generally to help appropriately guide the
    actions of an agent or team.


    Moral motivation consists in being motivated to do that thing that moral judgment
    recommends. For biological creatures like you and I, that might consist of having
    the right set of desires or appetites that align nicely with the outputs of my
    faculty for moral judgment. “Tests of character” usually consist in noticing that
    the outputs of our judgment and our desires are misaligned; I know that I shouldn’t
    deceive my boss, but I nonetheless do so because I don’t want to be punished for
    missing the work deadline or I don’t want to look bad in front of my colleagues.
    Some of our most admired exemplars in moral action are people who take a stand
    for right action or appropriate principal, giving up their life in return – an
    ultimate test of character given that a primary motivation for biological organisms
    is to stay alive. Examples include war heroes (many Medal of Honor winners), Jesus
    Christ, Galileo, Buddha, Martin Luther King, or others who give up life and limb
    for the greater good or important principles, or who avoid taking the easy path
    of giving in to societal pressure – these figures are often celebrated in faith
    traditions around the world.


    Moral skill consists in being able to carry out the dictates of the conscience
    in a way that satisfies the demands that morality makes on us. For positive duties
    especially (where we are morally obligated to take action to make something happen,
    for example, by coming to the rescue of the innocent when their lives are threatened)
    the possession of the right kinds of skills is critical. If I have an obligation
    to prevent the suffering of innocent people, and am the kind of agent that can
    do so if I just exercise the skills I have, then I am obligated to develop and
    hone those skills. These skills are disparate – they depend on the context of
    action, but usually consist of things like the ability to reason instrumentally
    so as to know what particular set of actions to take to achieve an end or goal,
    and basic abilities like being able to extend a hand to help someone, or more
    complicated skillsets like being able to execute a set of social skills and actions
    that let you convince your teammate not to act rashly. Our artificial conscience
    should include the abilities to be able to reason about what skills need to be
    brought to bear and in what order so as to execute the dictates of moral judgment.'
