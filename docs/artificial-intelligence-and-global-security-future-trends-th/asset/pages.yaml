  md: '+   - Or, who''s doing the fighting? Humans, “human in the loop” robots, or
    LAWS?

    +   - And crucially, _location_: is war in space ethically bound by the same rules
    and reasoning as terrestrial war?


    # Relevance of LAWS to Issue


    LAWS affect and seemingly support a common interdependence argument: LAWS cause
    unjust wars because they so greatly decrease the cost of war – the “blood sacrifice”.
    But take cyberconflicts: do they reinforce such interdependence arguments? Was
    Stuxnet an act of war by the US and Israel against Iran?


    Should we allow a permanent autonomous cyberdefense – i.e., permanent cyberwar?
    Is this a slippery slope to mutually assured destruction (MAD)? Such considerations
    for space warfare and LAWS raise directly the Autonomy worry: for war (in space),
    should human commanders be in, on, or out of the loop? “Latency”, as mentioned,
    refers to the time lag between a commander giving an order (to fire) and that
    order being executed. With a human in or on the loop, latency is always a problem
    as compared to fully automated warfare; and the greater the distance (and fragility
    of telecommunication connections), the greater the problem. Because of latency
    issues, current Space Command assumes that commanders will be out of the loop;
    space battles may well already be over before human commanders on the ground are
    even aware they are happening. So, for any chance of success in a war in space,
    JWT may plausibly require ALL LAWS due to the doctrine of military necessity (Thompson,
    2019).


    # “Ought Implies Can” Issues and Moral Luck


    Latency considerations are used to justify LAWS in space because success in a
    just war would be impossible without them. This brings up a common principle in
    ethical theorizing, one that entails that ethics cannot demand what is irrational
    for agents to do or be. In particular, it cannot expect us to perform an action
    or evince a character that is practically impossible for us. This is termed the
    Ought implies can principle – which logically requires that the morally permissible
    action is not only one we are capable of doing, but the action is also one we
    can avoid; an agent must have an actual choice in order for moral responsibility
    to exist.


    Accordingly, moral responsibility demands full agency – the capacity for the rational
    exercise of free will. The result: a proper understanding of ethics has no role
    for what Thomas Nagel (1979) termed “moral luck”. Moral luck is defined as: when
    you are held morally responsible for things over which you had no rational control;
    i.e., when the “ought implies can” principle is violated in assigning moral responsibility.
    Hence, for a proper moral theory, there should be no moral luck.


    Does this constitute proof of the independence thesis? Inasmuch as political leadership
    makes the decision to go to war and the active military does not, the “ought implies
    can” principle would apparently imply that the active military, in determining
    how the war ought to be conducted, should not be held responsible'
