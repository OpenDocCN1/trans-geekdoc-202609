    fashion. Some of the skills that artificial agents will require will look just
    like those we humans possess. For instance, in order to possess social skill,
    it is likely our artificial agents and their consciences will need to implement
    a theory of mind module or set of algorithms. The skill we have to make inferences
    about each other’s mental states (“You look angry – what have I done?”) is very
    important for effective moral skill and the ability to move in functional ways
    in social systems. Our artificial agents will likely need these theory of mind
    skills as well (see, e.g., Casebeer, 2003, Chapters 4 and 5).


    In general, the architecture and content described thus far will come together
    in a fashion that generates morally praiseworthy action either: (1) in an emergent
    fashion where the interaction of modules or parts generates morally praiseworthy
    behavior, (2) using traditional symbolic approaches (the predicate calculus, fuzzy
    logic, modal or deontic logic, etc.), and (3) neural network and deep learning
    approaches (more biologically realistic approaches which resemble the way reasoning
    in natural systems usually occurs).


    To conclude this section, special note must be taken of the heuristics and biases
    research program in the study of human cognition. It is well known that humans
    reason using short-cuts which sometimes fail to follow the dictates of logic.
    In some cases, these quick and dirty methods lead us to generally good decisions
    or conclusions; in others, they don’t. The following diagram displays the full
    range of heuristics and biases that have been explored in people.⁸ In general,
    they can be grouped into considerations about (1) what I should remember, (2)
    how I deal with too much information, (3) how I deal with a lack of meaning in
    the stimulus, and (4) my need to act quickly. The presence of heuristics and biases
    in moral reasoning and moral action does not undercut the program to build an
    artificial conscience by demonstrating it can’t be done or will be too difficult;
    on the contrary, it highlights the need for us to think about morally useful heuristics
    and biases systematically, and to consider how we might embody or embed them in
    systems that will in all likelihood face these same sets of four problems. There
    is a rich research agenda in figuring out these interactions, and in building
    systems which will know when the heuristics and biases are ecologically valid
    and will lead to correct decisions given the task and environment, and which ones
    will not.'
