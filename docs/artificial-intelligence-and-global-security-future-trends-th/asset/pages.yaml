- pgno: 67
  md: 'Popper is not the only person to take this position regarding AGI. Norm Chomsky
    has been quoted as saying:


    > The work in AI has not really given any insight into the nature of thought....
    I don''t think that''s very surprising... Even to understand how the neuron of
    a giant squid distinguishes food from danger is a difficult problem. To try and
    capture the nature of human intelligence or human choice is a colossal problem
    way beyond the limits of contemporary science. (Reese, 2018, p. 162)


    Today AGI seems unobtainable, but even Karl Popper is not absolute in his position
    on its impossibility. We don''t know what complementary technologies and knowledge
    may emerge in the future that would work as an enabling force.


    Where AGI systems have yet to be developed, systems built upon classically narrow
    AI algorithms and techniques have demonstrated promising, and moreover, valuable
    utility in a multitude of applications. Nick Polson and James Scott present numerous
    examples of how classically narrow AI has emerged in their book entitled AIQ:
    How People and Machines are Smarter Together. They discuss current medical applications,
    such as Dr. Zoltan Takats'', that assess the cancerous nature of vaporized tissue
    using mass spectrometer measurements from an AI-based smart knife (Polson & Scott,
    2018, p. 198). In entertainment, the authors mention how Netflix transformed its
    business from one of content distributor to content producer by developing a classically
    narrow AI system from conditional probability algorithms, massive data sets, and
    subscriber latent features to predict and produce content that viewers like. Similarly,
    in sports, the authors discuss how Luke Bornn has used data analytics from video
    and player-tracking data to predict the results of specific defensive matchups
    (Polson & Scott, 2018, pp. 34, 174).


    Technology synergy and convergence has also assisted in the advancement and application
    of classically narrow AI. An example of the concept of technology synergy and
    convergence is the South African security industry. This industry produces 100,000
    events per day and over 100 GB of video and voice data from multiple sites. Classically
    narrow AI algorithms and techniques are being researched to compress video data
    and analyze video information to compensate for limited bandwidth and reduce the
    complexity of human decision-making. The goal is a closer integration of artificial
    and natural intelligence to inform human decision-making, for example, in terms
    of the level of incident response (Dhlamini, Kachianga, & Marwala, 2007, pp. 2-4).
    How did these classically narrow AI applications emerge? What motivated their
    development?


    # D&A of Classically Narrow AI


    Jacques Ellul points to five unique factors currently resident in human society
    that sustain invention, technological growth, and innovation:


    The joint occurrence of the five factors we have briefly analyzed explains the
    exceptional growth of technique. Never before had'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'these factors coincided. They are, to summarize: (1) a very long technical
    maturation or incubation without decisive checks before final flowering; (2) population
    growth; (3) a suitable economic milieu; (4) the almost complete plasticity of
    a society malleable and open to the propagation of technique; (5) a clear technical
    intention, which combines the other factors and directs them toward the pursuit
    of the technical objective. Some of these conditions had existed in other societies;
    for example, the necessary technical preparation and destruction of taboos in
    the Roman Empire in the third century. But the unique phenomenon was the simultaneous
    existence of all five – all of them necessary to bring about individual technical
    invention, the mainspring of everything else. (Ellul, 1964, pp. 59–60)


    For Ellul, the technical phenomenon has been a growing constant throughout history,
    and technique has accelerated to the point of taking control of human existence.
    Of particular note is Ellul’s first point about the reality of long maturation
    and incubation periods. Certainly, for classically narrow AI the incubation period
    has been in existence for some time, and that incubation period is not uncharacteristic
    of many technological innovations. In fact, many technological innovations take
    much longer to be diffused and adopted by society; yet, once that D&A process
    reaches a tipping point it is accelerated. Some insight regarding the speed of
    classically narrow AI’s uptake can be gained from looking at a historical example,
    sound navigation and ranging (sonar).


    Sonar technology has provided great contributions to undersea mapping, scientific
    measurement of oceanographic properties of the ocean, and medical devices such
    as ultrasound. These achievements did not emerge overnight; they were the result
    of thousands of years of human philosophical and scientific thought that was finally
    synergistically catalyzed by motivational events, i.e., crises.


    The earliest documented discussion of sound can be attributed to Greek philosophers.
    Two metaphors are notable about the nature of sound. In the first, Aristotle compared
    echoes to a bouncing ball when he said “the air struck by the impinging body and
    set in movement by it, rebounds from this mass of air like a ball from a wall”
    (Hunt, 1978, p. 23). Engineers commonly use the reference to sound bouncing off
    objects, particularly as the foundation for active sonar, as well as for indirect
    bottom bounce propagation effects in passive sonar. In the second metaphor, the
    biographer Diogenes Laertius (fl. first half of third century AD) referenced the
    following passage from the Stoic philosopher Chrysippus (ca 280–207 BC): “Hearing
    occurs when air between that which sounds and that which hears is struck, thus
    undulating spherically and falling upon the ears, as the water in a reservoir
    undulates in circles from a stone throne into it” (Hunt, 1978, pp. 23–24). The
    spherical sound wave discussion has been refined, analyzed, and quantified by
    modern scientists for use in modeling ocean acoustics (Cox, 1974, pp. 9–10).'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Observations continued in the fifteenth and sixteenth centuries with Leonardo
    da Vinci and Galileo. Leonardo da Vinci observed that the sounds of distant ships
    could be heard by listening to a tube placed in the ocean. Galileo articulated
    a ray theory of sound where a sounding body emits a stream of atoms; the speed
    of sound is related to this stream of atoms in motion (Raichel, 2006, p. 3).


    In 1621, Robert Southwell reported to the Royal Society the unusual echoes he
    observed in his travels, particularly in the whispering place at Gloucester (Gouk,
    1982, p. 160). In 1627, Sir Francis Bacon identified a series of sound experiments
    in Sylva Sylvarum while leading England''s Royal Society (Gouk, 1982, p. 158).
    One of the experiments from that era, conducted by a Franciscan monk named Marin
    Mersenne, provided the first description of a sound tone at 87 Hz that led to
    the conclusion that sound could be used to determine distances over land (Gouk,
    1982, pp. 160, 166). Sir Isaac Newton published the first mathematical theory
    of sound propagation in Philosophiae Naturalis Principia Mathematica in 1687 (Darrigol,
    2010, p. 242).


    In 1877, Lord Rayleigh refined acoustic theories in his two-volume publication
    Theory of Sound. But the biggest technological impact came from the discoveries
    of electricity and magnetism by Michael Faraday, James Clerk Maxwell, and Heinrich
    Rudolf Hertz (Raichel, 2006, pp. 5, 6). Their theories laid the foundation for
    Leon Scott to invent and build the phonautograph and Alexander Graham Bell to
    extend the concept to the telephone (Sterne, 2001, pp. 260, 261; Wilson, 1960,
    pp. 280–285). These devices laid the groundwork for the electronic devices that
    would listen and record sound from the ocean.


    Yet, more than 2,000 years of philosophical thought, scientific discovery, and
    engineering know-how alone failed to give birth to sonar technology. Sonar emerged
    from the human motivation to take action in response to two crises dealing with
    safe passage during the early part of the twentieth century. The first crisis
    emerged from a natural disaster. The sinking of the Titanic in 1912 presented
    the first crisis, taking the lives of 1,522 passengers. The second crisis was
    man-made. The emergence of unrestricted submarine warfare during World War I,
    as symbolized by the sinking of the Lusitania in 1915, presented the second crisis.
    Both crises elevated the human desire for safe passage at sea. These crises motivated
    humans to take action. Within a week of the Titanic tragedy, Reginald A. Fessenden,
    who worked for the Submarine Signal Company, submitted a patent for an echo ranger
    to detect icebergs. Similarly, the Anti-Submarine Detection Investigation Committee
    (ASDIC) developed a sonar technology for the detection and location of submarines
    engaged in unrestricted warfare that is referred to by the organization''s acronym,
    ASDIC (Bjorno, 2003, pp. 25, 26; Kahrl et al., 1999; pp. 2, 3; Urick, 1983, pp.
    3, 4).


    Similarly, Nick Polson and James Scott maintain that the mathematical foundations
    for these algorithms date back centuries even though algorithm development for
    classically narrow AI seemingly accelerated over several recent decades. For example,
    one of the foundational predictive mathematical algorithms used in classical AI
    dates back to the eighteenth century and an English clergyman named Thomas Bayes.
    Bayes rule has been an instrumental element in probability theory to predict the
    conditional occurrence of an event given the'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'knowledge that certain other events have already occurred. For example, you
    can determine the probability that you will have cancer given a positive test
    on a mammogram. Polson and Scott point to many applications of Bayes rule in present-day
    technology that include medical diagnostics, robotics, financial investing, and
    airplanes lost at sea (Polson & Scott, 2018, pp. 90–106).


    Polson and Scott also point to other prediction rules developed in the late nineteenth
    century such as Henrietta Leavitt''s algorithm to more accurately determine the
    distance of pulsating stars. Leavitt developed an algorithm to predict the true
    brightness of a pulsating star based on its measured brightness and its period
    of pulsation. The pattern matching approach that Leavitt developed has progressed
    to more sophisticated deep learning algorithms used in classically narrow AI.
    Google Translate and Google Inception are two cases for pattern matching. Google
    Translate uses a mathematical algorithm that maps phrases in one language to phrases
    in another. The translation is not perfect, but provides a good starting point.
    Language is strongly contextually driven. Words and phrases in one context can
    have very different meanings and connotations when used in a different context.
    Think of the simple word “pop.” The word “pop” in English could mean father, soda,
    or the sudden loud noise a balloon would make when poked with a pin. The meaning
    of the word “pop” depends on the contextual use in a sentence, as well any context
    due to a geographical colloquialism.


    Mathematical algorithms can help with the predictive contextual translation, but
    depending on the context this prediction may be easier or more difficult to do.
    Common everyday language may be easier, and professional journal articles more
    difficult. Like all statistical and probabilistic algorithms, the accuracy depends
    on the sources and quantity of data to draw from. Google’s Inception model reduced
    the world record for image pattern matching for a machine, based on the ImageNet
    Visual Recognition Challenge, down to a 6.7% error rate with a 22-layer deep neural
    network (Polson & Scott, 2018, pp. 55–58, 61, 72).


    Ellul’s second, third, and fourth stipulations for technological innovation that
    include population growth, a suitable economic milieu, and social plasticity are
    related to three enablers that Polson and Scott point to for classical AI’s assent.
    They identify Moore’s Law (increased speed of computers), the new Moore’s Law
    (the explosive growth in available data), and cloud computing as the three key
    enablers. Polson and Scott also add a fourth less tangible trend they refer to
    as good ideas (Polson & Scott, 2018, pp. 4–6). However, the growth in technical
    performance of computers, data, and forms of computing in and of themselves fall
    short of meeting Ellul’s stipulations. Rather it is the forces that these technological
    advancements set in motion that would be of particular interest to Ellul.


    On a side note, it is difficult to discuss increased computing speed, growth in
    available data, and cloud computing as separate individual driving forces because
    all three are related to what has been referred to as load balancing in the aggressive
    design of computer architectures. Load balancing addresses the relationship between
    the three essential attributes of any computer architecture that entail processing,
    memory, and I/O (input/output bandwidth). All three are interrelated. Moore’s
    Law may initiate advancements in computing, but it does'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'not drive advancement alone. Load balancing refers to the cycle of advancements
    in processing, memory, and I/O of data to/from a computer. As computer processing
    speeds accelerate, higher I/O bandwidths are required to sustain the data that
    feed the advanced algorithms. As I/O bandwidths accelerate, more memory is needed
    to store the growing amounts of data that needs to be stored in the computer.
    The load balancing cycle is a bit of a chicken and egg phenomenon because as I/O
    bandwidths increase, computers need to store more data; the increased amount of
    stored data enables the application of more advanced mathematical algorithms that
    in turn require higher processing speeds, and the cycle repeats itself. So Moore’s
    Law, the new Moore’s Law, and cloud computing are all interrelated.


    For the case of classically narrow AI, Ellul’s stipulations for population, economic
    milieu, and social plasticity are also interrelated; each is driven by the aforementioned
    advancements in computing. Advancements in computing have certainly not increased
    populations of people; nevertheless, advancements in computing have increased
    access to existing populations and therefore have contributed the same effect.
    The same case can be made for the economic milieu and social plasticity stipulations.
    Advancements in computing have not, in and of themselves, enhanced the economic
    milieu and social plasticity; yet, their contributions to accelerating the World
    Wide Web have facilitated the development of new economic environments and expanded
    social plasticity on a more global level.


    Lastly, Ellul’s stipulation on technique is correlated to Polson and Scott’s reference
    to good ideas. Techniques are methods and/or approaches humans use to engage and
    exist in the world. Philosophically, techne refers to the way humans achieve an
    objective. When Polson and Scott discuss their fourth enabler in terms of good
    ideas what they are really referring to, in terms of Ellul’s philosophy and Stephen
    Kline’s characterization of innovation, are the relevant and worthy techniques
    that classically narrow artificially intelligent algorithms can offer humans to
    engage the world. Classically narrow AI assists humans in reducing complexity
    and distilling meaningful information from ambiguous data. The good ideas are
    really good techniques.


    Consequently, we should not be surprised by classically narrow AI’s appearance
    in medical diagnostics, robotics, financial investing, marketing, and other tools
    for technique such a language translation. AI, in terms of classically narrow
    AI, is here and readily available. Classically narrow AI has been diffused and
    adopted and continues to assist humans as a source technique. On the other hand,
    can human’s leverage classically narrow AI’s level of maturity to develop artificially
    intelligent techniques for crisis response?


    # AI Techniques for Diffusion and Adoption in Crisis Response


    The D&A of innovation is a human motivated process. The human resides at the core
    (Dearing & Cox, 2018, pp. 183–186). “Diffusion is a social process, not a rational
    process. People are embedded in social relationships, so the diffusion is'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'shaped by the nature of those relationships” (Tai & Yang, 2016, p. 99). The
    nature of the relationships in stage 1, 2, and 3 innovation ecosystems tends to
    be more simplified because of the sequential arrangement of the human interaction.
    Humans have more direct control through planning. On the positive side, sequential
    arrangements tend to restrain or slow down the D&A process by incorporating controls
    and gating checkpoints that inhibit technological aliasing. On the negative side,
    the deceleration in the D&A process increases the chance for missed opportunities
    and reduces competitive advantage. So there are tradeoffs between sequential processes,
    control, and rapidity.


    The rapid acceleration of technological innovation repositions the human interaction
    from processes that are sequential in nature to those that are complex and adaptive
    as characterized by fifth generation innovation ecosystem models. The human no
    longer takes on a directing role in fifth generation innovation ecosystems. “The
    role of the orchestrator in the diffusion and adoption of innovation takes on
    a prominent role, especially in fifth generation innovation ecosystems. Orchestrator
    roles include the player-orchestrator, facilitator-ecosystem and sponsor-orchestrator”
    (Hurmelinna-Laukkanen & Natti, 2017, p. 67). The ambiguity and complexity emerging
    from fifth generation innovation ecosystems requires a focal organization, or
    person, to assume the initial risks and pull together the network in the ecosystem.
    Innovation network orchestration can be seen as the “set of deliberate, purposeful
    actions undertaken by a focal organization for initiating and managing innovation
    processes in order to exploit marketplace opportunities enabling the focal organization
    and network members to create value (expand the pie) and/or extract gain (gain
    a larger slice of the pie) from the network” (Hurmelinna-Laukkanen & Natti, 2017,
    p. 66).


    Furthermore, more formal organizations and institutions often need to weigh in
    during these nascent periods when the complexity and ambiguity are particularly
    high. “We may anticipate the role of the ecosystem leader to be assumed by actors
    such as universities or governments in the very early period of ecosystem genesis
    when much uncertainty and technological infancy can discourage investments by
    private entities. In time, commercialization prospects improve, ecosystem leadership
    can shift to another actor” (Dedehayir, Makinen, & Ott, 2016, p. 34). Essentially,
    the ecosystem leader sets target policy for the network. Although the individual
    policies of each agent in the ecosystem network may, and do in fact, differ, the
    agents can respond with their individual behaviors to a common hypothetical target
    policy (Macua, Chen, Zazo, & Sayed, 2015, p. 1260). At least in the initial stages
    the ecosystem leader plays a pivotal role in establishing the ecosystem’s target
    policy as a means to initiate the process of self-organization within the innovation
    ecosystem.


    For these reasons, artificially intelligent systems will have little chance to
    replace the human in the innovation ecosystem. Humans relationships and interactions
    are at the core to motivating action in the ecosystem; however, as humans transition
    to fifth generation innovation ecosystems, they will need tools that can assist
    in reducing the ambiguity, complexity, and risk. Classically narrow AI systems
    are in a position to offer techniques to address these challenges.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'AI can help humans respond to crisis situations with technological innovation
    in six ways. First, AI can identify potential solutions to emerging problems by
    mining databases to cull out solutions that mix and match existing technologies.
    Second, AI can prioritize potential solutions that, as Dr. James Dearing from
    Michigan State University cites, are “designed for diffusion” (Dearing & Kreuter,
    2010). Third, AI can assist in navigating through the social networks associated
    with the D&A of technological innovation by identifying appropriate communication
    channels, critical nodes, influencers, mavens, and change agents. Fourth, AI can
    reveal the incoherence between the four communities in order to mitigate any unintended
    consequences that surface when a rapid response to a crisis situation is pursued.
    Fifth, AI can assist in scaling up successful solutions rapidly. Scaling up requires
    the identification of appropriate partnerships. In addition, agent-based simulations
    can assess the behavioral implications of implementing different policy decisions.
    Sixth, AI can be used to adopt fast-follower strategies by detecting emerging
    trends.


    Innovation arises from the interaction of disparate communities of people. Michael
    McGrath talks about three basic strategies for innovation that entail technology-driven,
    prediction-driven, and opportunity-driven approaches. Prediction-driven approaches
    leverage emerging technologies, the declining cost of technology, and the intersection
    of multiple emerging technologies. Technology-driven approaches engage researchers
    to efficiently search for solutions to perceived problems, e.g., applied research
    or stumbling over a technology or scientific breakthrough via pure research. Opportunity
    driven approaches generalize a given solution to other specific problems and seek
    success by listening to specific customer needs (McGrath, 1986, p. 217). AI can
    sort through databases of patents, inventions, and journal publications to match
    characterizations of emerging problems with technology-, prediction-, and opportunity-driven
    solutions. AI would tailor the solution to the specific crisis situation.


    Dr. James Dearing points to the 11 attributes of innovation that can be used as
    a tool to gauge the solutions that maximize the potential for D&A. His 11 attributes
    are based on Everett Rogers’ work on the diffusion of innovation and encompass:
    relative advantage, effectiveness, observability, trialability, complexity, compatibility,
    reliability, divisibility, acceptability, communicuality, and radicalness (Dearing
    & Meyer, 1994, pp. 43–57). Dearing argues that technical performance, or effectiveness,
    must often be sacrificed at the expense of one or more of the other attributes.
    In fact, the study conducted by Kapoor, Dwivedi, Williams, and Lal indicated that
    the top five attributes are complexity, compatibility, reliability, relative advantage,
    and flexibility or applicability (Kapoor, Dwivedi, Williams, & Lal, 2011, p. 233).
    Dearing argues that these attributes can be used to “design for diffusion” and
    increase chances for successful innovative uptake. AI tools could evaluate proposed
    solutions in terms of their suitability for D&A based on these attributes. Classically
    narrow AI can assist in reducing complexity.


    AI can assist in navigating the social networks that enable the D&A of technological
    innovation by identifying appropriate communication channels, critical nodes,
    influencers, mavens, and change agents. For example, Diesner and Carley'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'identified groups of individuals who assume the theoretically grounded roles
    of change and preservation agents through sociolinguistics, social network analysis,
    and machine learning–based text mining (Disner & Carley, 2010, p. 687). Other
    studies have examined relationships to determine the roles of structural holes
    that foster intermediary relationships between people, diverse actors who rely
    on proximity relationships, community bridges who connect multiple communities,
    opinion leaders (Bamakan Nurgaliev, & Qu, 2019, pp. 200–222), community cores,
    and max influencers. Li, Lin, and Yeh showed that people acting as community bridges
    disseminate information across multiple communities while those serving as community
    cores spread information within communities effectively (Li, Lin & Yeh, 2015,
    pp. 293, 294, and 400). Valente attributed a similar role for integrated agents
    in the book edited by Dearing and Singhal. Integrated agents are more often critically
    referred to by other professionals during the diffusion process (Valente, 2006,
    p. 71). The significance of these roles depends on the type of network and network
    pathology that characterize the diffusion process. Classically narrow AI techniques
    can assess organizational structure by determining appropriate network pathologies.


    Once networks are characterized, AI enables the assessment of the interaction
    between the science/engineering communities, technical communities of manufacture,
    communities engaged in developing technique or know-how, and socio-technical communities
    of end use. The degree of interaction determines the potential for the unintended
    consequences stemming from their incoherent interaction (Tsujimoto, Kajikawa,
    Tomita & Matsumoto, 2018, pp. 55–57). For example, an end user could experience
    difficulty using an engineering solution proficiently if that solution is too
    complex.


    Self-organization and emergent behavior theories offer exciting implications for
    the incorporation of agent-based models (ABMs) in the analysis and assessment
    of the D&A of innovation. Zhang has used ABMs to determine effective pathologies
    for scaling up the D&A of technology. Intelligent agent simulations that embody
    the fundamental behavioral rules in the diffusion process indicate the extent
    and rapidity of D&A. The intelligent agent rule sets can exercise policy decisions
    to reveal behaviors that emerge from self-organization. These agent-based simulations
    capture the nature of the individual interactions that are not portrayed in deterministic
    models, such as the Bass marketing model (Zhang, 2015, pp. 2009–2010). The ABMs
    can compare behavioral asymmetries that emerge from alternative policy decisions.
    The emergent behaviors also alert to the potential for unintended consequences
    from technological aliasing, i.e., one form of a man-made crisis.


    Lastly, AI can track emerging trends from real-world databases to implement fast-follower
    D&A strategies (Lan, 2009, pp. 73–76). Once identified, these emerging trends
    can be assessed in terms of relevance and adaptability to resolve crisis situations.
    The assessment would address the adaptation to relevant social networks, potential
    for unintended consequences, and pathologies for scaling (Larson, Dearing & Backer,
    2017, pp. 1–82).


    One challenge to the use of AI techniques for crisis resolution involves the stochastic
    stability and unbiased nature of the databases used in classically narrow artificially
    intelligent programs. Expert systems rely on fixed and stable data'
