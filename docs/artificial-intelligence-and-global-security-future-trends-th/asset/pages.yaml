  md: 'LAWS in space war. Could that be ethically permissible? To answer that, we
    need to examine LAWS in the context of JWT.


    # What Is Traditional JWT?


    # Jus ad bellum, jus in bello: The Independence Thesis?


    JWT traditionally treats the relationship between the justice of declaring war,
    *jus ad bellum*, and the justice of how the war is actually fought, *jus in bello*,
    as one of complete *independence*: the justice of a (civilian) government’s decision
    to wage a war is one issue, and the questions of the moral boundaries of the ways
    in which the professional military of that nation wages war is an entirely separate
    issue. But recent developments in the use of autonomous weapons systems problematize
    such views, and their foreseeable use in space will exacerbate the issues.


    Indeed, some of the most common objections to the use of autonomous weapons systems
    by militaries (especially by the US) involve the claim that they will make war
    more alluring, so that decreasing the cost of war would make nations more likely
    to go to war unjustly. Such arguments effectively deny the independence assumption,
    as they use *jus ad bellum* worries to justify a *jus in bello* restriction or
    ban on LAWS.


    An alternative view (term it the “mutual dependence” or “interdependence” view)
    allows such a connection between *jus ad bellum* and *jus in bello* concerns,
    and instead reasons as follows: the more morally justifiable a war is, the fewer
    the restrictions on how it may ethically be fought; and vice versa, the less morally
    justifiable declaring a war is, the greater the restrictions should be on how
    it may be prosecuted. That is, the more morally justifiable waging and winning
    a war is, the more that can be morally justified to make sure the correct side
    wins it. And as the moral case for beginning or waging a war lessens, the greater
    the moral restrictions on how it may be waged. For instance, on this view, it
    might be permissible by the Allies (whose cause was clearly just) to drop nuclear
    weapons on Japan or Germany to stop the horror of World War II, despite such weapons
    clearly violating several traditional *jus in bello* principles; whereas it might
    be morally impermissible to use nuclear weapons to wage, say, a preventive war
    against Iran (in the mere expectation of a possible future nuclear capability).


    # What Matters for the Independence Versus Mutual Dependence (Interdependence)
    Thesis?


    So, in assessing the independence vs mutual dependence (interdependence) thesis,
    what matters? Is it:


    +   - The type of wars? Symmetric, asymmetric, large vs small?

    +   - Or types of combatants/wars? Large/small nation-states? Civil wars? Anti-terrorism
    campaigns? Peacekeeping?

    +   - Or perhaps the types of weapons? Lethal vs nonlethal? Ships vs planes? Ballistic
    missiles vs bullets? “Rods from God” vs nukes?'
  merge: -1
  img_proc: true
