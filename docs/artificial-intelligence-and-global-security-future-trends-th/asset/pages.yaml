    own dignity, we are under no general obligation to reveal all that is true about
    ourselves or about others. We are not even epistemologically well constituted
    to reveal ‘all that is true’ about ourselves or others since our access to anyone’s
    [including our own] deepest intentions are fundamentally indirect.” It would seem
    for argument’s sake that privacy is left to be defined by an individual as long
    as he or she was not asked questions that would force one to lie. The latter statement
    about not knowing anyone’s intentions directly is also useful in that, Kant would
    likely suggest deferring to definitions of privacy that would afford the greatest
    protections of privacy to ensure not violating the rights of an individual with
    strict views of privacy.


    This conceptually runs counter to the current paradigm of data collection in several
    ways. Potential users must agree to the totality of the terms of use and privacy
    agreements (assuming they fully understand in the first place) which doesn’t afford
    one to make choices about what they actually want or are willing to share. It
    is an all or nothing approach akin to being held hostage by third parties who
    demand we reveal everything they want, or decline to use the service. How then
    can we be expected to make informed decisions about services such as social media
    and email that most in society use as routine functions when the only other option
    is not to participate? The current construct streamlines the process for commercial
    entities to gain access, collect, and share data with the click of a checkbox
    by presenting an agreement with verbiage similar to the complexity of bank mortgage
    documents. The language of these agreements is vague and filled with legal jargon
    often crafted to protect the interest of the bank or private industry, rather
    than crafted to protect the rights of the user.


    Deontologists could also object to the opaque descriptions or lack thereof on
    who all will collect or use an individual’s data. What users often fail to consider
    before checking the box is that these agreements grant permissions to a whole
    host of collectors and harvesters of their data in ways the user may not understand
    or in ways that take years or decades to fully understand. This will be discussed
    more in subsequent sections. A related issue relates to the privacy restrictions
    that come preloaded as defaults with these services. These defaults are often
    set the least restrictive privacy settings and the most comprehensive in terms
    of collection. Google and Facebook are notorious for offering their services in
    this manner (Cranran, 2018). Yet, they could easily improve their image if they
    simply embraced a maxim of privacy. Approaching privacy in this manner would likely
    motivate these companies to make their privacy settings easily accessible with
    checkbox options for prompting the user on what they are willing to share rather
    than putting the onus on the user to dig through complicated menus and find them.
    The only one who benefits from operating in this manner is the commercial interests
    collecting data on the individual (Hoback, 2013).


    A utilitarian view is where the idea of privacy seems to be most challenged for
    a variety of reasons. Utilitarianism is concerned with choosing to act in ways
    that increase the greatest good for the greatest number which is counter to the'
