  md: 'Accordingly, moral luck is a necessary but not sufficient condition to guide
    moral assessments. The existence of AI/LAWS in space does complicate interdependence,
    as (for now) no moral agency/responsibility. To address this, we need a third
    principle: our concept of “military necessity” should be widened to assess the
    degree of moral necessity of the just side winning (for a lasting peace and a
    flourishing postwar society). Merely requiring the condition of a lasting peace
    allows scenarios that could result from a stable but horrible totalitarian result.
    As an example, take World War II or the Cold War: what was justified to ensure
    Nazi/Stalinist communist/other totalitarian regimes did not take over the world?


    So, with proper safeguards, a just state could use LAWS to enforce a lasting peace
    and a flourishing postwar society. The problem, of course, is that the military
    superiority of AI/LAWS means that an unjust state could use LAWS to enforce its
    tyranny without possibility of revolt. Citizens armed with guns cannot defeat,
    e.g., poisonous drone swarms or space-based weapons platforms.


    # Final Conclusion


    To stop indefinite tyranny with new tech by an unjust state, there should be no
    *jus in bello* restrictions on LAWS or any other technology to avoid this worst-case
    outcome.


    In near future, just states must be willing to do whatever it takes to ensure
    new tech does not allow a permanent tyranny to take root. A just state could use
    LAWS to enforce a lasting peace and a flourishing postwar society, re Kant’s dream
    of perpetual peace (Abney, 2012); an unjust state could use LAWS to enforce its
    tyranny without possibility of revolt – what good would shotguns and pistols be
    against an army of missile-firing drones, or swarms of tiny poisonous drones,
    etc.? There should be no *jus in bello* restrictions to avoid the latter outcome,
    including the possible necessity of AI-directed war in space. In the not so distant
    future, such technologies will be extant, indeed widespread; and just states must
    be willing to do whatever it takes to ensure such technologies do not allow a
    permanent tyranny to take root.


