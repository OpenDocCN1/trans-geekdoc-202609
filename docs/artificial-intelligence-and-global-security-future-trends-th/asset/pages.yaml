  md: '# # About the Editor


    ![](img/1f6fc32ae48f51935843b2e9d04dfd89_15_0.png)


    **Yvonne R. Masakowski, PhD, MPhil, MA,** has a distinguished career in Psychology
    and Human Factors spanning over 25 years. She was recently appointed as a Research
    Fellow by the US Naval War College following her retirement as an Associate Professor
    of Strategic Leadership and Leader Development in the College of Leadership and
    Ethics at the US Naval War College. At the Naval War College, Dr. Masakowski focused
    on the advancement of leader development for the US Navy and the impact of advanced
    AI technologies on military affairs. Dr. Masakowski currently serves as the US
    Chair of a NATO panel on _Leader Development for NATO Multinational Military Operations_
    (NATO HFM RTG 286). She also serves as a dissertation thesis mentor on Artificial
    Intelligence in the Ethics and Emerging Military Technology (EEMT) graduate certificate
    program at the US Naval War College. Prior appointments included serving as an
    Associate Director for Human Factors, Office of Naval Research Global office in
    London, UK, and as the CNO Science Advisor to the Strategic Studies Group (CNO
    SSG).


    **Dr. Masakowski** earned her Doctorate of Philosophy in Psychology and Master’s
    Degree in Philosophy at The City University of New York. She received a Master’s
    Degree in Psychology (Psycholinguistics) from the University of Connecticut and
    her Bachelor of Arts in Experimental Psychology from Rutgers University. She earned
    a diploma from the MIT Seminar XXI program in Foreign Policy and National Security.
    She has also attended Yale University'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'where she studied biomedical ethics. She has taught leadership, ethics, cross-cultural
    competence, and the humanities to graduate students. She has also provided executive
    leader development to US Navy Admirals and US Navy Attorneys. Her research interests
    include Artificial Intelligence, decision-making, autonomous systems, leader development,
    cross-cultural competence, and the Humanities. Dr. Masakowski is the author of
    numerous publications, articles, as well as book chapters. She has edited a book
    on Decision Making in Complex Environments, and has written the following book
    chapters: The Impact of Synthetic Virtual Environments on Combat System Design
    and Operator Performance in Computing with Instinct; Cultural Competence and Leadership
    in Multinational Military Operations in Military Psychology from an International
    Perspective; The Dynamics of NATO Multinational Military Operations Inclusive
    Leadership Practice in Global and Culturally Diverse Leaders and Leadership; and
    Leaders and Ethical Leadership in Military and Leadership Development.


    Dr. Masakowski''s leadership and results-oriented philosophy have been recognized
    nationally and internationally. She has recently been awarded the US Department
    of Defense Superior Civilian Service Award (2019) and the Lifetime Achievement
    Award by the Albert Nelson Marquis Lifetime Achievement Award from the Marquis
    Who''s Who Publications Board. Dr. Masakowski has also been recognized by the
    Czech Republic and awarded their nation''s highest military Medal of Honor, The
    Cross of Merit. She has also been the recipient of awards from France and Poland
    for her efforts in advancing Science and Technology for military applications.'
