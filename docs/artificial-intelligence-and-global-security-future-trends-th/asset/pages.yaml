- pgno: 205
  md: 'The future of narrow AI that performs simple at first but then expands to include
    even complex tasks such as robotic surgery or big data analysis of suspected threats
    will only increase in utility, accuracy, reliability, and performance efficiencies
    as AI learns and adapts over time. A decade of AI Time could be minutes, not human
    time but AI Time. This is a different model of time.


    General AI that has a broader skills platform, that includes autonomy, self-learning,
    and self-organizing, and that is viewed as vastly more powerful in knowledge discovery,
    intelligence, innovation, and insight generation is what is coming in future as
    well and sooner by 2030 or before. Glimpses of AI''s future today, such as Google''s
    Alpha Zero''s capacity to self-learn, not taught by humans or even other AI, is
    an early indication that the accelerating AI holy grail, that autonomous learning
    is upon us. In other words, we have failed to forecast how fast AI is evolving
    today and now has to course correct. We will need AI to develop an enhanced situational
    awareness of AI and advise humans how to understand this emergence if they can
    in the future.


    In even the near future of a decade or less from today, there will be no definitions
    as primitive as narrow or general AI. There will be various species of AIs that
    will have enhanced synthetic intelligences, various skills, and escalating cognitive
    capabilities. These future AIs will be extensions of human''s minds, organization''s
    workforces, and of course armies. AI will also self-organize into its own communities,
    networks, and ecosystems where it will spawn its own AI cultures different and
    yet at first similar to organic life, biological life forms, and societies. AI
    societies may well evolve beyond human understanding and this should be expected.
    This is predicated on the assumption that the key factor that will shape the future
    of AI is nonbiological evolution and the rise of synthetic cognition, not the
    familiar human biomimetic. AI societies will prosper. They will simultaneously
    antagonize and serve humanity. AI will not follow predictable paths even if programmed
    but become independent agents and decision-makers.


    AI in the near (one to three years) and certainly far future (20 year plus) will
    be a game-changer for global security because it will enable ways to predict,
    anticipate, shape, prevent, and direct conflict. AI will also be a game-changer
    in both predicting and deterring the potential conflict scenarios, in forecasting
    conflict, and certainly in warfare itself. I would argue that AI used for deterrence
    not unlike other massively powerful weapons such as nuclear demonstrate a likely
    path ahead in the future. This global security deterrence will of course come
    after a display of AI lethality is proven up, as nuclear bombs signaled in WWII.


    The future of AI and global security cannot be forecasted or even discussed without
    addressing lethality. Putting aside legal and ethical clear lines that mandate
    the use of lethal AI in defense, it would be shortsighted not to realize that
    AI in warfare at some point in time becomes both a deterrence to waging war and
    a dominant force in battle. We can and should debate the ethical implications,
    but nevertheless AI as a weapon of various forms and deliverables is inevitable.
    One can hope deterrence is paramount, but given the mass proliferation of AI in
    the future, it is prudent to assess the situational readiness of AI''s use in
    warfare.


    The collapse of Moore''s Law, the rise of exponentially powerful and cheap computing
    power at the core of every AI system, will level the playing field for super'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'powers and even nonpeer actors – states, terrorist, and rogues. UAV cost reduction
    and increased AI onboard give a glimpse of the near future. The era of a competition
    over AI-enhanced systems has begun. Therefore, the future AI competition will
    be who has the smarter, faster, and deeper capacity to interdict, prevent, disable,
    or morph as some future AI deliverables in a multidomain environment.


    The AI arms race has begun. This may mean within 10 years that it would be catastrophic
    to wage war given the AI-enhanced infrastructure and global AI proliferation that
    would ensue. There will be advantages as the AI arms race will lead to AI versus
    AI conflict, with human observers. It is certain that entire armies, navies, and
    air forces will be first tele-robotic, then semi-autonomous, and then fully autonomous
    within this decade. Many nations and leaders will not embrace this future forecast
    as a possibility or as an eventual future. These AI systems may be accurate for
    a period of time. However, as autonomous AI systems become ubiquitous and effective
    as a new global defense paradigm that is superior to human-centered force protection,
    (regardless of the size of human-centric armies, navies, or air forces) such change
    will lead to a shift in the nature of global security. One can envision how much
    more efficient, cost-effective and reliable such AI networks and systems will
    become. So much so, one can readily imagine that dependent actors will swiftly
    move to wage war when it is merely AI versus AI. Advances in AI will influence
    gamification and reshape warfare that will undoubtedly be broadcast live.


    In every factor where competition for power, influence, and dominance and competition
    from gray to ghost conflicts to direct engagement and cyber, AI will offer a new
    dimension to global security that cannot be underestimated. It may be possible
    to even develop a predictive capability, to forecast conflict prone events, and
    map out a time-stream of actions that will lead to conflict even war and how to
    avoid and prevent such conflict from ever happening by taking certain strategic
    actions now to redirect the time-stream of events. This sounds improbable given
    what we think of AI today but not in the future of 2035.


    There are some political, defense, and intelligence leaders that fail to appreciate
    or understand the AI as a game-changer paradigm. This is a risk factor that reduces
    strategic readiness and situational awareness, both in the commercial and defense
    establishment. The cost of this failure is the result of a lack of vision. This
    is a legacy idea that warfare and intelligence should be run by humans alone.
    The ethics of war and the clear need for human leadership in an era of autonomous
    AI is reasonable and by law today required. Not all actors agree with this doctrine.
    There will be state and nonstate actors that will not and do not today share that
    doctrine that humans have the final say – that autonomous AI cannot persist in
    the kill chain. This is a clear risk to global security that competitive doctrine
    around autonomous AI may produce a vulnerability for some actors. AI versus AI
    is coming.


    AI and human teaming may be the new paradigm for defense in the one- to five-year
    forecast from today. AI-enhanced teaming and collaboration with humans is the
    most strategic way forward because it enables actors who abide by ethics, values,
    and morals to direct AI. A strategy that fails to appreciate this historic moment
    would greatly reduce operational readiness in a world being reshaped by AI. At
    the same time, it would be folly to not prepare for fully autonomous AI in virtual
    or physical domains of which conflict is waged.'
