- pgno: 86
  md: 'In this call, Lucas is grounding his thought in international humanitarian
    law, that is derived in part from the just war tradition. So too does Jai Galliott
    in his 2015 work *Military Robots: Mapping the Moral Landscape*. Galliott interacts
    with detractors of the just war tradition for future warfare technology. He writes,
    “despite claims to the contrary, the classical just war framework remains the
    most suitable and robust tool we have for analyzing the moral problems associated
    with the use [of] unmanned systems” (Galliott, 2015, p. 86).


    Galliott (2015, p. 233) argues for a “broad but complete contractually grounded
    version of just war theory.” In so doing, Galliott does not deny the uncertainty
    of future warfare and the complexity of using the just war tradition. Yet, he
    contends, “interpreting and applying existing just war principles to unmanned
    warfare is bound to be fraught with complexity, but represents our best chance
    at tempering states’ responses to perceived threats” (Galliott, 2015, p. 233).
    In this, he is correct. New technology and warfare may appear to be a perpetual
    Rubik’s Cube of ethical issues but, just because we may not know the right answer,
    that does not mean we don’t know some of the wrong answers.


    The perpetual quest for “a better mousetrap” or perhaps, more so, “a silver bullet”
    is understandable even if the quest is usually futile (at least in the near term).
    Acknowledging “the thorny path ahead,” Mary “Missy” L. Cummings, the director
    of the Humans and Autonomy Laboratory at Duke University, writes:


    > Although it is not in doubt that AI is going to be part of the future of militaries
    around the world, the landscape is changing quickly and in potentially disruptive
    ways. AI is advancing, but given the current struggle to imbue computers with
    true knowledge and expert-based behaviours, as well as limitations in perception
    and sensors, it will be many years before AI will be able to approximate human
    intelligence in high-uncertainty settings – as epitomized by the fog of war. (2017,
    p. 12)


    AI is certainly a factor in the equation of war, and it will continue to grow
    in importance.


    # Concluding Thoughts


    This chapter has argued that the just war tradition remains a viable framework
    for considering future warfare. That argument is new.9 It is, however, ongoing.
    Therefore one must consider: If not just war tradition then, by what and by what
    standard? This is not to say that just war tradition is regrettably the best we
    can do. Rather, it is to state that the tradition is more than adequate for the
    challenge of twenty-first-century warfare. It is a framework that is exceptionally
    well-suited for present and future warfare.


    9See, for example, Oliver O''Donovan''s defense in his work *The Just War Revisited*.
    Cambridge: Cambridge University Press, 2003 and Nigel Biggar''s *In Defence of
    War*. New York, NY: Oxford University Press, 2013.'
