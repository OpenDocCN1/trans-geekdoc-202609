    gives the helpful example of understanding Romeo and Juliet.⁶ ML can quickly and
    efficiently pick out certain facts from the play: how many people wore masks,
    the sequence of the major plot points, the names and general moods of characters
    who utter certain lines of dialogue. But if you try to formulate ML algorithms
    to determine what Juliet thought Romeo would believe when he came across her body
    after drinking the potion, you are doomed to fail. On the other hand, GOFAI has
