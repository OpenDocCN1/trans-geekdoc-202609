  md: '# # Chapter 9


    # # An AI Enabled NATO Strategic Vision for Twenty-First-Century Complex Challenges


    Imre Porkoláb


    # ## Abstract


    Constant transformation plays a crucial role in the future success of the NATO
    Alliance. In the contemporary security environment, those who can get the latest
    technology to the war fighter faster will tend to enjoy a comparative advantage,
    unless that technology in turn blinds the organization to alternatives. Thus,
    the author lays out a strategic vision for AI enabled transformation for the Alliance
    detailing NATO’s ability to adapt throughout history, introducing contemporary
    efforts for AI enabled tech solutions for NATO, but also pointing out the necessity
    of organizational learning.


    His conclusion is that in an age where technological development is exponential,
    the Alliance appears increasingly unable to deal with the problems related to
    the exponential technology disruption. Complex contexts require a different mindset,
    and NATO has to look for new AI enabled tools to face the increasing number of
    wicked problems. Most importantly he points out that building a platform with
    AI enabled technological solutions is only one side of the coin. There is a need
    for an organizational one as well which connects the different components together,
    and creates interoperability within the Alliance. As NATO incorporates new AI
    solutions, there is a need for introducing radically new training and education
    solutions, and create a framework for what the author calls Mission Command 2.0.


    *Keywords:* Transformation; complexity; change; design thinking; mission command;
    NATO


    In the twenty-first century, NATO has largely struggled with how to organize,
    strategize, and act effectively in increasingly complex and emergent contexts
    where the previous distinctions between war and peace have blurred beyond comprehension
    (Bousquet, 2008).'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Governments and their militaries continue to experience radical and entirely
    unforeseen calamities that defy historical patterns and essentially rewrite the
    rulebooks. These popularly termed “black swan events” continue to shatter any
    illusion of stability or extension of normalcy in foreign affairs.


    The Alliance appears increasingly unable to deal with the problems related to
    the exponential technology disruption using traditional planning and organizing
    methodologies alone (Kupchan, 2017). What had worked well previously and made
    NATO the most prevailing defence alliance, no longer appears to possess the same
    precision and control.


    The formal planning process (NDPP), the foresight methodologies, and the organizational
    learning methods, initially developed to cope with Cold War Era large-scale military
    activities in “a conventional, industrialized state vs industrialized state setting”
    (Jackson, 2017) are seemingly incapable of providing sufficient means of getting
    the organization unstuck, and there is a constant search for tools to improve
    them.


    Within this new and increasingly chaotic context, NATO has to fulfill all three
    core tasks at the same time, which requires new and noble approaches from policymakers,
    and military personnel alike. The Alliance’s complex decision making processes
    are tested on a daily basis in multiple domains supported by expansive technology,
    social media, propaganda, and the malicious activity in the cyberspace. This canvas,
    upon which rivals can create never-before-seen complex problem-sets, defy previously
    accepted definitions for conflict and war.


    Complex contexts require a different mindset while still maintaining the consensus-based
    decision-making along with different awareness and appreciation (United Kingdom
    Ministry of Defence Development Concepts and Doctrine Centre, 2016). In simplistic
    settings, organizations see things they have previously experienced (Paparone
    & Topic, 2017), and for NATO, an organization with so much success in the past,
    these experiences can be an obstacle to change in today’s VUCA (volatile, uncertain,
    complex, ambiguous) world. Complex contexts often have only one repeating and
    predictable process: an organization will continue to experience things they have
    never seen before that marginalize or defeat all established practices and favored
    tools (Tsoukas, 2017).


    When an organization encounters things they have experienced previously in some
    format or context, they can reapply approved processes to address these problems,
    often in an analytic and optimization-fixated approach to reduce and increase
    stability (Ackoff, 1973). Yet the question remains, what does an organization
    do when they experience something they have never seen before?


    One aspect of the ongoing organizational mindset change in NATO is an increasing
    need to look for new tools. In our digital age, AI (artificial intelligence) seems
    to be the tool of preference for large bureaucratic organizations to tackle strategic
    challenges, therefore, in this chapter I suggest that as part of the response
    to the changes in a complex environment, NATO should introduce “AI enabled tools”
    to address the wicked problems in future foresight, organizational learning, and
    decision-making.'
