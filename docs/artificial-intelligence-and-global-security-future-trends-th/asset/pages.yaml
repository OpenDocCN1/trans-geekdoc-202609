  md: 'To provide some perspective on just how much data Google has the ability to
    collect on any one individual, Dylan Curran a data consultant in the United Kingdom
    decided to find out as described in a 2018 article in *The Guardian*. Curran downloaded
    his total history from the site (google.com/takeout) which amounted to a single
    5.5 GB file – the rough equivalent of 3 million Word documents. The contents of
    which include an unsettling amount and variety of data: bookmarks, Google Drive
    files, entire YouTube history, photographs, purchases made through Google, everything
    he’d ever searched, and much more (Curran, 2018).


    # Digital Authoritarianism and the Rise of the Surveillance Economy


    Apps and the internet – portals to the digital world – increasingly link people,
    make it easier to share ideas, and easier to make reliable predictions. Conversely,
    these technologies also make it easier for nefarious actors to use these technologies
    to foster and foment civil unrest. And of course, the Arab Spring was facilitated
    by social media apps and global connectivity (Hempel, 2016).


    There is, of course, a positive side that could be considered a tradeoff to data
    security. In the case of the Golden State Serial Killer – Joseph James DeAngelo
    – a man who terrorized California residents in the late 1970s, he was apprehended
    in 2018 through the exploitation of records in a commercial genealogy database
    (Arango, 2018). The investigators who used this genetic data to track and subsequently
    arrest DeAngelo were awarded the “DNA Hit of the Year award” – an international
    prize for the top DNA case (Stanton, 2019). Here is an example of how a public
    good (solving crime) could easily run afoul of safeguards for civil liberty protections.
    Ethicists are calling for more transparency from law enforcement with respect
    to how they use DNA searches (Saey, 2018). The police in the Golden State Killer
    case accessed data from GEDmatch which is a public database. In this instance,
    privacy protections that private companies are obliged to adhere to may not apply.
    This raises concerns for legal scholars because of the serious implications for
    relatives of suspects who themselves may be wrongly implicated. More importantly
    these scholars are considering whether these tactical operations are extralegal.


    The sheer volume of information allows sinister or state actors to hide in plain
    sight posing as a friend or casual associate. The same data that create convenience
    and serve user preferences could easily be misused by the state and their agents
    to target, control, and even eliminate a particular profile of users. Vitals,
    intelligence quotients, emotional states, professional, and private networks became
    extremely accurate indicators of people and continue to be refined over time.
    Location data capture networks of interactions with unwitting contacts – to include
    family members, children, home, places of business – all tracked and monitored
    often without consent.


    Another possibility is for this shadow profile to mimic the user’s presence even
    if that were not the case. People just don’t get together in person often enough
    or when they do make plans, they often change or cancel them because of the ease
    with which it can be done. A particular nefarious actor could target profiles
    with'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'specific IQs, special needs, those on government assistance, or those with
    activist tendencies. Adversaries could use these profiles to target families and
    their children or blackmail individuals with any number of demands. They could
    also use these data to help shape a society that will be easily controlled, constantly
    surveilled and monitored, and shaped according to the leader’s political and financial
    advantage.


    In a 2018 MIT Technology Review article, author Christina Larson asks the question:
    “Who needs democracy when you have data?” Martin Chorzempa who is quoted in the
    article points out that “no government has a more ambitious and far-reaching plan
    to harness the power of data to change the way it governs than the Chinese government”
    (2018, p. 1). The rise of populist movements across Europe – Brexit – and the
    election of Donald Trump are thought to have emboldened the Chinese political
    class by providing them with a justification to support anti-democratic sentiment
    in the form of voter suppression.


    Additionally, technology is already being used in China to monitor and control
    the Uighur population (a predominantly Muslim, Turkic speaking ethnic group) in
    Northwestern China. Scores of video surveillance cameras track individual movements
    and police checkpoints scan IDs and phones and even scan pupils. “This personal
    information, along with biometric data, resides in a database tied to a unique
    ID number. The system crunches all of this into a composite score that ranks you
    as ‘safe’, ‘normal’ or ‘unsafe’. Based on those categories, you may or may not
    be allowed to visit a museum, pass through certain neighborhoods, go to the mall,
    check into a hotel, rent an apartment, apply for a job, or buy a train ticket.
    Or you may be detained to undergo re-education, like many thousands of other people”
    (Millward, 2018).


    These surveillance techniques are coming into play as the protests in Hong Kong
    have grown increasingly violent. In addition to more common crowd control techniques
    such as tear gas, the police used water cannons laced with blue dye to make it
    easier to identify, and presumably punish, violent offenders captured on camera
    (Hu & Griffiths, 2019).


    China also intends to use the aforementioned surveillance machinery to rank its
    citizenry according to social credit much like a credit report does for credit
    worthiness. “The exact methodology is a secret – but examples of the behaviors
    that will be monitored are driving and purchasing habits, and the ability to follow
    the rules” (Ma, 2018, p. 1). The implications will dictate what services will
    be available to an individual and will even restrict them from some services all
    together.


    If Hitler or Stalin had these capabilities history might have turned out differently
    but as we see in China, “Tibetans know well this hard face of China. Hong Kongers
    must wonder: If Uighur culture is criminalized and Xinjiang’s supposed autonomy
    is a sham, what will happen to their own vibrant Cantonese culture and their city’s
    shaky ‘one country, two systems’ arrangement with Beijing? What might Taiwan’s
    reunification with a securitized mainland look like? Will the big-data police
    state engulf the rest of China? The rest of the world?” (Millward, 2018) This
    dystopian future has arrived and may be coming to democracy near you. A similar
    system is under development in the United States.'
