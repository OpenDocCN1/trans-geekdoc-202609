  img_proc: true
- pgno: 84
  md: 'One might consider the just war tradition akin to an accordion or spring: it
    can expand and change to meet new developments in circumstances and technology.


    Using the just war tradition as a framework, one must initially consider how does
    the new technology interact with our thinking about proportionality and discrimination
    (jus in bello)? These types of ethical principles and considerations must be embedded
    in the design and development of AI weapons of war. Of course, it may also be
    that AI can help in the jus ad bellum aspect and perhaps in the jus post bellum
    aspects, but the major area of concern will be “what does AI do for jus in bello?”


    # Clarification or Confusion?


    What is confusing and bewildering to some parties working in the realm of military
    ethics are the mixed signals being sent by the DoD with respect to ethical principles.
    In January 2019, there was a widely publicized announcement of DoD desire, via
    the Defense Innovation Board, to draft guidelines for shaping norms for military
    AI. The announcement called for engagement, in part, through public listening
    sessions with academics, ethicists, scientists, and other interested parties (see,
    e.g., Tucker, 2019).8 This call for guidelines likely arose from the 2018 AI Summary
    statement: “The Department will articulate its vision and guiding principles for
    using AI in a lawful and ethical manner to promote our values. We will consult
    with leaders from across academia, private industry, and the international community
    to advance AI ethics and safety in the military context” (US Department of Defense,
    2019, p. 8).


    Is DoD (and others considering the ethical implications of AI and war) desirous
    of a list of new ethical principles? Or is the department, rather, seeking to
    understand how AI technology does or does not apply to the already existing just
    war framework that has been embraced by the US and upon which much international
    law with respect to warfare is grounded? Are we seeking new principles, or seeking
    to understand how AI technology should be developed and used in accordance with
    standing principles – perhaps articulating AI specificity within those standing
    principles? Or, perhaps the public forums and subsequent articulation of principles
    are a mechanism for gaining cooperation and support from scientists, the public,
    and industry. This might be one aspect of events in light of the 2018 employee
    protests against Google’s partnership with DoD’s AI “Project Maven,” wherein the
    company declined to renew contracts with DoD for the project due to public protest
    against Google supporting military AI initiatives (Wakabayashi & Shane, 2018).


    Joshua Marcuse, the Executive Director of the Defense Innovation Board, noted,
    “It is critical that the forthcoming [Defense Innovation Board] recommendation
