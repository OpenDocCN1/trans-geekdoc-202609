  md: 'balancing side advocating unrestrained innovation contend that we are far from
    realizing an AI that could pass the Turing test, if ever. Examination of the ongoing
    debate has taken us on a path from mapping definitions and grappling with the
    continuum of technology capabilities to recognizing the need for AI Ethics.


    Timothy J. Demy is concerned with applications of just war tradition to AI military
    technology. His cited triangulated cycle of principle → policy → practice provides
    a comprehensive framework with which all stakeholders might grapple with the intersection
    of the two realms of military ethics and AI.


    Narrowing his lens to focus on US policy, he illuminates current documentation,
    specifically the “Summary of the 2018 Department of Defense Artificial Intelligence
    Strategy: Harnessing AI to Advance Our Security and Prosperity” – noting that
    technology continually changes, but the principles of just war tradition do not.
    He argues for the application of those principles in the fast-moving world of
    AI contending that just war tenets and ethics are readily applicable and well
    suited to AI and LAWS issues. Namely, the tenets of proportion, discrimination,
    and sovereignty are already established and currently in debate. Simply stated,
    new AI technology structures require strong ethical foundations.


    Ethical rules of engagement, just war questions of sovereignty, discrimination
    of civilians from non-combatants: these issues call for AI ethics – foundational
    specifics for moral decision-making (both on the field and off). Indeed, the five
    chapters discussed in this overview and comparison chapter examine AI concerns
    from this foundational ethics perspective:


    +   • Demy makes a case for the just war tradition as a legitimate sound framework
    for continued AI ethics analysis. Sovereignty, discrimination, and other just
    war components are well-established principles in international law.


    +   • Hart and Shanks Kaurin test foundational terms and philosophical approaches
    with a military ethics lens, preparing robust definitions for just war thinking
    and debate on AI ethics.


    +   • Casebeer sets out an AI technology and ethical approach for not only reaching
    for AI sentience in the long-term but integrating ethics into the AI conscience
    in the short-term time frame. He proposes that we should democratically explore
    cognitive biases and ethics approaches to identify the best models.


    +   • Abney tests just war tenets and theory in a narrow application that is currently
    changing where and how we fight. The shift of physics and the war domain of space
    transform how we should apply just war principles such as proportion and sovereignty.
    He contends there should be no jus in bello (justice in the conduct of war) legal
    restrictions on LAWS.


    +   • Finally, Shook, Solymosi, and Giordano clarify a continuum of AI thinking
    development, contending that morality and responsibility reside within a local,
    military community ethos. As such, AI may be programmed and attuned to deliver
    within that ethos in the field.'
