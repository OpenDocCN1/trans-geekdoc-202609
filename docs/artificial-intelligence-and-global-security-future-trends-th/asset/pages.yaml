  img_proc: true
- pgno: 91
  md: 'testing our ideas abstractly, without risk to our actual lives, the idea of
    an abstract intelligence running on something other than our human bodies began
    to make sense.


    Following this line of reasoning, we can then define an AI as a goal-oriented,
    problem-solving to certain selection pressures, and created in birds a process
    that involves muscles, light bones, and wings flapping. Humans have created artificial
    flying machines, but did not create them by simply copying nature; they achieved
    the same goal of flight without using bones, muscles, or even flapping wings.
    So, an AI is an artificially constructed attempt to achieve cognitive goals, but
    may do so through means that are entirely different from our understanding of
    natural human cognitive processes. For example, current AIs may use propositional
    symbolic logic, evolutionary algorithms, Bayesian inference, or other nonbiological
    approaches. Or, an AI can use an approach designed to mimic the human brain, such
    as a neural network approach. Typically, this uses artificial “neurons” that continuously
    compare their output calculations to a desired outcome, and then update the strength
    of the connections between “neurons” to “reinforce” those that seem useful. The
    goal of producing an artificial general intelligence by “whole brain emulation”
    would take such an approach to its logical extreme.


    # AI: Questions of Moral Status


    A crucial issue in space ethics is moral status: what kind of value should nonhuman
    life or technology have? Denying speciesism (Singer, 1974) does not solve the
    issue. Nonhuman alien persons, like the Star Trek characters Worf or Spock, would
    clearly deserve intrinsic moral consideration. But what of alien bacteria, or
    even fishlike creatures, in the oceans of Europa? Numerous options on the scope
    of intrinsic moral value have been defended (Lupisella, 2010) including all life
    (biocentrism), or, indeed, everything in the universe (cosmocentrism). Other common
    views include rationality/sapience as crucial (ratiocentrism), or sentience –
    the capacity for conscious experience, of pleasure and pain – termed “sentientism”.


    Two arguments for ratiocentrism over sentientism directly involve technology:
    first, the “Zombie/robot argument” (Abney, 2019): suppose philosophical zombies
    could exist (beings with human-level complexity of behavior, but no consciousness).
    They reason capably enough to demonstrate moral behavior and be deemed worthy
    of continued existence, passing one kind of moral Turing test (Sparrow, 2012),
    yet experience no pleasure/pain.


    Second, the Wireheading argument (Abney, 2019): suppose a superintelligent AI
    believes sentientism, and so refashions Earth into “hedonium”: all remaining material
    objects merely experience unending, unknowing pleasure, until they cease to exist.
    This eventuality constitutes a “malignant failure mode” for superintelligence
    (Bostrom, 2014). Why a failure? Because a world with only'
