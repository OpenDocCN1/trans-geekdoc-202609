    # Impact of AI Technologies on Leader Decision-making


    AI systems are flexible and adaptive such that they can provide numerous options
    for humans to coordinate their efforts. Leaders must learn to understand the output
    of the AI system and evaluate its recommendations based on their knowledge, skills,
    and abilities (Loten & Simons, 2017). This does not mean that leaders will need
    a doctoral degree to understand how the system works. Leaders will need to understand
    the output of such systems as they evaluate the set of recommendations presented
    to them. This will take education and experience for leaders to acquire an understanding
    of how best to use these AI systems to their decision advantage. War gaming, virtual
    training, and operational exercises will provide the experience necessary to achieve
    the knowledge for effectively using AI networks in the future.


    Leaders must learn to understand the capabilities of AI technologies if they are
    to achieve operational success. Designers must provide leaders with a means of
    validating information received from an AI system to ensure that the information
    is credible, accurate, reliable, and actionable to ensure the operational environment.
    This may require that designers develop an Enigma-like coding scheme for warriors
    and leaders at every level to verify the veracity of the information source. The
    future operational environment will continue to be volatile, uncertain, complex,
    and ambiguous (VUCA). However, we contend that AI technologies can level the playing
    field and clarify the battlespace. Military forces will need to be adaptive, innovative,
    and creative, if they are going to maintain SA and operational agility. Each nation''s
    ability to optimize the delivery and accuracy of information to the operator will
    enhance military operations. It is left to the military leader to evaluate the
    information within the context of the operational environment and make effective
    decisions.


    To date, we have not had to defend our nation''s autonomous systems from another
    nation''s AI system. This will change in the future as nations become more sophisticated
    and develop an AI network of their own. We contend that there will also be consequences
    for independent decision-making by AI systems that must be considered a priori.
    Namely, one can envision the day when an AI system can develop its own targeting
    strategy so we must design these systems to make decisions aligned with human
    values and ethics (Arkin, 2007, 1992).


    We anticipate that as the level of sophistication increases in the design of autonomous
    systems, there will be an increased level of AI capabilities. Advances in AI,
    increased memory capacity, novel energy sources, composite materials, and increased
    biological modeling capabilities will help to shape the design of future AI systems
    that will be more adaptive, agile, and independent (Shim & Arkin, 2012). Innovative
    AI designs that model human behavior and cognitive processes will facilitate the
    ability to make such systems capable of independent decision-making.'
