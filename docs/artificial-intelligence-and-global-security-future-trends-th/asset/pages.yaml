  md: 'figure out. The time premium of Faster Than Moore’s Law AI processing is difficult
    to predict the upper end of the scale of processing power or even agility especially
    as AI will be designing AI. But suffice to predict, AI by 2030 will be difficult
    for humans to fully comprehend, is my forecast.


    We are talking about the inevitable rise of smart technology both in the image
    of humans and that which may arise from a completely different nonhuman synthetic
    evolution. Of this development, we should carefully analyze and consider long-range
    implications on human evolution. It will be attractive to enhance humans with
    AI designed augmentation for extending lifespans, curing diseases and human performance
    enhancement such as cognitive enrichment. Future wars may be won, lost, or even
    avoided by the AI National Dividend. This is the increased value that societies
    will benefit from having AI embedded in the sciences, industry and national security.
    The phenomena of parallel evolution of different species that interact, co-evolve,
    interdepend on each other, compete, and cooperate on the planet has a long history.
    Interspecies interactions, plants to mammals to reptiles over millennia, both
    co-exist and compete. AI will no doubt engage as another new species toward what
    aims one can imagine will be of keen interest, especially when and if AI seeks
    competition with humans.


    The complex future of global security will be reshaped by the hegemonic and competitive
    advantages brought by AI to state and nonstate actors. Ideological differences
    about the role, ethics, values, and even the nature of AI will be in conflict
    between these actors. Even today, we see this with the rise of smart robotics
    and UAVs that are used differently around the world for various security missions
    based on ideology across the global multidomain environment. China is selling
    autonomous UAVs today. Buyers are rethinking their security plans based on the
    active threat of weaponized AI. This is not the future. This is now. The future
    is a world where weaponized AI proliferation is either controlled or not. With
    AI in everything and everywhere, it is difficult to consider banning AI while
    actors are using AI for hegemonic purposes. An AI arms race is brewing and will
    shape the future, even if the outcome is a ban.


    Keep an eye on the consumer market to see the creeping invasion of AI-driven robots
    into the home, AI in autos, AI decision support and business, telecom network
    management, equity market trading, and medicine and health care. The consumer
    market may not appear on par with the global security market but there is a long
    tradition of consumers as predictive of emerging technology adoption. There is
    no domain of human existence where AI will not be used for competition, efficiency,
    or speed enhancement in the near future. Many of the vexing global security issues
    that face humanity that we have not been able to fix, that we don’t fully understand
    such as global hunger, diseases, public health, economic productivity, the lack
    of universal education, rampant poverty, and even peace, may play a role in guiding
    humanity’s embrace of AI. AI for good could well be transformational for global
    security. Though the easy forecast is killer robots and AI run amuck, the reality
    of the global security futures may be more nuanced and even positive. Future global
    security scenarios will likely comprise both good, bad, and ugly scenarios as
    I have written about previously.'
