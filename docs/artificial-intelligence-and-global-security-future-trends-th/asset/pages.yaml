- pgno: 158
  md: 'We can see that these conditions are necessary for agency by imagining how
    the toy example would change if any were not satisfied. If Juliette had no understanding
    of the state of affairs, then she would have no basis on which to promise or to
    act. Or, if she had no desire to follow through on her promises (a trait children
    are known to suffer from on occasion), then it would be foolish to engage in a
    promise agreement with her, and her subsequent actions would be random rather
    than driven in the way that an agent''s actions are supposed to be guided. Finally,
    if Juliette were able to see the state of the world, judge that state to be misaligned
    with her desires, but unable to act on this tension, then she would not have her
    agency. Instead, such an agent would seem to be trapped in their body, merely
    watching the events unfold rather than orchestrating them.


    With this understanding of agency in hand, what can we say about AI? We can plausibly
    say that AI has representations of the world: ML-based systems can be seen loosely
    to judge that the world has certain features (like that some picture contains
    a sheep), and GOFAI systems have symbolically encoded knowledge that can be reasonably
    thought of as representations of the world.


    The second condition is much more dubious. In what sense can AI be said to have
    motivational states? We see no basis on which an ML algorithm is motivated. One
    might think that GOFAI would meet this standard, since one could symbolically
    encode anything you like into an AI system. For instance, one could program an
    AI with “Life is valuable and should be preserved when possible” into such a machine.
    Unfortunately, this is not sufficient for establishing a motivation for the AI.
    Motivational states have a mind-to-world direction of fit, and all knowledge encoded
    in a symbolic AI goes in the opposite direction. To a GOFAI system, “Chihuahua
    is a breed of dog” is just as motivational as “Life is valuable and should be
    preserved”, which is to say, not at all.


    Most importantly, every claim that we may loosely attribute as knowledge for an
    AI can be traced back to human inputs. For ML, these inputs are the training data
    sets and parameters the AI is allowed to consider relevant. For GOFAI, the knowledge
    added is straightforwardly attributable to the programmer who added it. The representations
    are not chosen or endorsed by the AI in any way, but they are rather just complicated
    ways in which an AI behaves deterministically. These are not agents with the capacity
    to act like human agents.


    It is worth noting that so far we have only discussed whether AI can be conceived
    of as agents. But the debate in this chapter places even stronger requirements
    for moral agency. Agency is necessary but not sufficient for moral agency. One
    might be an agent without being subject to anything morally binding. However,
    anything that is subject to morally binding demands must be an agent. Given our
    skepticism that AI meets the bar for agency, it is even more doubtful that AI
    meets the requirement for moral agency.


    Moral agency also requires ideas of responsibility and accountability to a community
    of practice with embedded values and shared meanings; this has to include the
    possibility of moral learning and revision of moral view in light of experience
