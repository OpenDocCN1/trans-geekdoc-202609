  md: 'instrument to achieve certain ends in itself and has no intrinsic value or
    meaning apart from that instrumental use.ⁱᵛ Just War theorist Michael Walzer sees
    war as an instrument of the protection and survival of the political community,
    while the Realist school in international relations sees war as an instrument
    of state interest and power.ᵛ For each of these views, war is a tool for certain
    human, especially political, ends. Accordingly, machines (including AI) can and
    already certainly do engage in destruction and killing on a large scale, sometimes
    without the direct supervision or agency of humans. Paul Scharre documents many
    of these technologies including platforms that can do targeting, that can adjust
    and seek out targets after launched, and that can even recommend targets or courses
    of action based upon data processing and analysis.ᵛⁱ


    The instrumental view tells us that violence, death, and destruction is necessary
    for war as a means to compel the adversary towards our political will. However,
    that is not sufficient. We do not go to war for every political end, so which
    things warrant a resort to war? If war is merely an instrument of politics, that
    is not sufficient to motivate and sustain humans in the experience of warfare,
    to engage in killing and destruction on a large scale with considerable risk to
    their own interests, values and projects, and future. This is the remarkable behavior
    that we see reflected in the art, literature, memoirs, and memorials that humans
    produce about their experiences in war. It requires values that are deeper and
    tied to both individual and collective identities.


    Consider a few examples. In World War II the value for the Allies involved the
    preservation of democracy against fascism, as well as addressing the violations
    of territorial sovereignty of nations invaded and occupied by the Axis powers
    and the survival of those political communities. In contrast, US involvement in
    Vietnam revolved around the value of checking the spread of Communism and self-determination
    for the South Vietnamese people. In the First Gulf War the values were the restoration
    of sovereignty of Kuwait and punishment and containment of Saddam Hussein’s regime.
    Meanwhile, the 2003 intervention in Iraq was oriented (initially at least) around
    the value of protecting the community from the threat of weapons of mass destruction,
    then regime change to address humanitarian abuses. In the case of World War II
    and the First Gulf War, there is a certain moral clarity, but with Vietnam and
    the 2003 Iraq War we see the moral conflicts and ambiguities, reflected in the
    political and social resistance to these conflicts by the society, even though
    there were political aims in these conflicts. These examples show that both political
    ends and values are a part of why and how societies and individuals wage war;
    war, therefore, has existential dimensions.


    War is existential in the sense of preserving political communities that make
    our physical and moral existence and flourishing as human beings possible. Michael
    Walzer, a contemporary Just War thinker notes, “The defense of rights is a reason
    for fighting. I want to now stress....that it is the only reason.”⁷ⁱᵛ War is a
    public action of the State to preserve political community against threats, especially
    existential ones.'
