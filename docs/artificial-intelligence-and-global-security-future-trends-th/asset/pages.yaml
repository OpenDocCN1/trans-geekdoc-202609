- pgno: 166
  md: 'action when directly operated in real time by a human-in-the-loop is not autonomous.


    Autonomous activity is certainly compatible with a degree of supervision. Humans
    are autonomous agents who receive guidance and direction, and are able to follow
    lawful commands.


    Full independence and emancipation from humanity could arise with higher forms
    of intelligence, such as sapient or sentient AI. A sapient AI system autopoetically
    controls how it accomplishes goals and interacts with other intelligences, including
    interpreting or ignoring humans. A sentient AI would sufficiently sapient to comprehend
    its capabilities and construct its goals without needing or consulting humans
    (Giordano, 2015). Entirely unguided and unsupervised actors, whether biological
    or mechanical, could become renegade, and as such, be of dubious value to a nation,
    organization, or NSID operation.


    Although critical works of technological foresight (Moravec, 1999; Wallach & Allen,
    2009), and a corpus of science fiction depicting sapient or sentient AI pose profound
    ethical questions generated by sentient AI¹, it is highly unlikely that any NSID
    operation will consider the use of such systems in the proximate future.


    Thus, acting with intelligent autonomy cannot – and arguably should not – be equated
    with behaving in an entirely independent way. Although the literal translation
    of the Greek auto-nomos is “self-rule,” an individual who controls his/her own
    decisions and actions can still follow the social norms that one endorses. For
    example, an autonomous AI vehicle will follow driving rules and traffic laws,
    just as a good human driver does. Neither machine nor human should establish the
    habit of obeying only rules that they themselves create. Social norms, and moral
    norms in particular, promote cooperative practices. Habitual conformity with social
    norms, especially norms for communal welfare, are compatible with exercising individual
    autonomy within a defined group (of either “moral friends” or “moral strangers”;
    Engelhardt, 1996). Renegade deviance is only a crude kind of liberty. The conforming
    guidance of moral norms should contribute to productively autonomous existence.


    # Moral Guidance for Autonomous AI


    Our practical question here is: To what extent could moral guidance be a component
    of ongoing supervision of an aAI (type 3–5) system, such as a ground robot, a
    flying drone, or a mechanical swarm? AI capable of degrading or destroying hostile
    forces shall be the primary subject in the following sections, unless otherwise
    specified. Raising the matter of moral guidance for AI is not just asking the
    question, “How should an ethics review of AI activity be imposed after military
    operations?” An external ethics review is usually too late to prevent or mitigate
    moral transgressions. Nor are we inquiring about preemptory ethical condemnations
    against aAI and their tactical performances'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'in the battlefield (see here, Maas, 2019). Neither preemptory nor post operational
    examinations may be sufficiently attuned to the particular ways that human-AI
    systems will harmoniously work to achieve tactical goals during NSID (and more
    specifically military) operations. Rather, if it is to be effective in practice,
    moral guidance be constituent to, and occur within human-AI relationships.


    Premising that moral guidance cannot essentially involve AI, but only be about
    AI, makes an assumption that renders an AI system functionally amoral. On this
    assumption, moral humans must be responsible for amoral AI. The pairing of an
    ethically autonomous human with an intelligently autonomous system at most ensures
    that the actions of the AI system can be compared against particular standards
    of right conduct. The system performs its AI actions in the field while understanding
    nothing about norms; the human judges the deeds of the AI system according to
    human norms while performing nothing in the field. That the AI system does not
    participate in its moral evaluation is akin to being convicted in a legal trial
    in absentia.


    This sort of external ethics review does not characterize the moral evaluation
    of NSID personnel by their commanding officers and high-ranking leadership. This
    is especially true in the military. All military personnel are instructed in,
    inculcated with, and instilled with respect for military moral virtues and rules
    (Lucas, 2016). Compliance may vary to some extent given the variance of human
    action in certain circumstances, but none could claim ignorance of duty, and everyone
    can understand how and why their conduct is evaluated according to military moral
    standards. Military ethics is primarily about internal (i.e., organizational)
    oversight, supervision, and compliance. All military personnel: (1) adopt the
    required norms of proper behavior in uniform; (2) expect other service members
    to satisfy norms while conducting group activities; and (3) cooperate with military
    evaluations of personnel conduct by those standards. These three conditions establish
    the foundation of the “military ethos.”


    In general, a community inculcates and sustains its internal moral ethos where
    all members: (1) prioritize meeting the behavioral norms of the group; (2) participate
    in activities so as to promote the fulfillment of those norms in the conduct of
    participants; and (3) provide cooperation to communal efforts to uphold those
    standards of conduct. A communal ethos will weaken and decay when some members
    prioritize their own selfish goals, allow others to degrade group achievement,
    and disregard attempts to maintain collective standards. A communal ethos is fortified
    when members exemplify conformity, expect cohesiveness, and enforce compliance.


    Internal moral guidance flourishes within the framework of a communal ethos. No
    single member of the organization takes the responsibility for morality, except
    in the inclusive sense that they all do. Morality infuses the whole; it does not
    reside in any part taken separately. Trying to ask, “Which particular component
    of the group takes the moral responsibility?” will fail to discern how moral responsibility
    is distributed throughout the relationships and practices of constituent members.
    This “collective ethics” model of'
