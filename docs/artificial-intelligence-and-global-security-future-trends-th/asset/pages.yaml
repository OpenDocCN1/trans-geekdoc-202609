    with the cluttered nature of this combat environment will combine to make it more
    likely that I will make a misjudgment, so I need to exercise more caution when
    making shoot or no-shoot decisions.


    Moral judgment can be embodied in an artificial conscience via traditional symbolic
    computational approaches or via new-wave neural network and deep learning approaches.
    On the symbolic side, there are already logics that deal with the complexities
    of optional and forbidden actions – these deontic logics are well suited for reasoning
    about dimensions of consent or understanding when conflicts might be generated
    between duties that will require a higher-order principle to resolve. On the nonsymbolic
    side with neural network or connectionist approaches, researchers have made a
    great deal of progress in replicating the interaction of principles and exceptions
    via deep learning architectures.


    Moral motivation presents an interesting case for an artificial conscience, as
    artificial agents are generally assumed to be put together in such a way that
    they follow the dictates of higher-order reasoning modules or units. Motivation
    might be a type of special reasoning which considers how things like requirements
    to preserve the “self” – the platform or the team – interact with the dictates
