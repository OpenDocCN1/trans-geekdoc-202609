- pgno: 188
  md: 'While most of AI debates in NATO often devolve into arguments over “killer
    robots”, AI technological changes supported by a new mindset will introduce new
    processes for information management that will have a profound impact on NATO’s
    organization, operations, and interoperability itself. Successful adoption of
    technology and the ability to reinvent the way we fight will help the Alliance
    maintain its competitive edge and deterrence capability.


    Thus, constant transformation plays a crucial role in the future success of the
    Alliance. There is a need to increase operational agility, the ability to sense,
    and to build a network, but this complex strategic approach must be supported
    by modern technology tools, like AI, and a new strategic mindset that can enable
    the whole organization to utilize this new technology. In the contemporary security
    environment, those who can get the latest technology to the war fighter faster
    will tend to enjoy a comparative advantage, unless that technology in turn blinds
    the organization to alternatives.


    # A Strategic Vision for NATO’s Organizational Transformation


    NATO has been adapting throughout its history, but the tempo and speed that are
    required to deal with potentially disruptive challenges, like AI, push the Alliance
    to the edge of its capabilities, and recently NATO has been experiencing one of
    the most urgent organizational transformations in its history.


    In an age where technological development is exponential, the Alliance appears
    increasingly unable to deal with the problems related to the exponential technology
    disruption. Complex contexts require a different mindset, and NATO, which has
    been very successful in the past, has to look for new tools to face the increasing
    number of wicked problems. AI enabled tools are one of the most important ones
    in the arsenal, but we have to put AI into a strategic context and also define
    the root cause of the problem, in order to successfully apply AI enabled solutions.


    In the contemporary context, organizational learning seems to be the main challenge,
    and it must be accelerated, together with the mindset and culture, which must
    be changed as a result of the adaptation process. Generating alternative options
    and enabling their rapid implementation throughout NATO seem to be the best way
    to maintain the competitive advantage in today’s complex context.


    Thus, building a platform with AI enabled technological solutions is only one
    side of the coin. There is a need for an organizational one as well which connects
    the different components together, and creates interoperability within the Alliance.
    As NATO incorporates new AI solutions, there is a need for introducing radically
    new training and education solutions, in order to speed up organizational learning.
    As AI is taking over the world and changing industries with unprecedented speed,
    militaries appear to be constrained by traditional and resistant-to-change centralized
    hierarchies. Thus, ACT has a leadership role to develop, shape, and nurture the
    defense applied design-thinking cadre for NATO.


    In order to challenge current organizational learning practices, designs to disruptive
    technologies. While NATO as an organization already has executed design'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'activities within various locations and for a variety of missions, those efforts
    were individually inspired and local with respect to the entire enterprise. As
    multiple nations now incorporate design thinking in formal military education
    within services, war colleges, as well as at universities, NATO should use this
    tool to enable people with the mindset to reimagine the way we learn and fight
    modern war.


    Today, analytic-based military planning alone is insufficient, and action without
    critical reflection and novel creation appear inadequate. There is an operational
    imperative for NATO to adopt a new approach to the way they think about warfare.
    Design thinking affords NATO to change its traditional view of planning for instability
    situations and adapt to the new world order that requires creativity, innovation,
    and sense-making strategies to think about command and control in warfare from
    a new perspective.


    A new generation of leaders will look at Mission Command differently as well.
    Right now, we are still using the original Mission Command concept with a goal
    to establish a decision-making cycle that works faster and more effectively than
    our potential adversaries. We must deliberately build command and control relationships
    that maximize operational efficiency, and create an operational tempo where decentralized
    units can thrive in uncertain situations. It fosters a leadership training approach,
    where a mission command culture often improves resilience by enabling forces to
    perform the correct actions that lead to mission accomplishment when a centralized
    command system is not optimal.


    We also have to anticipate that AI will change that in the near future. Mission
    Command 2.0 will enable leaders in large bureaucratic organizations to oversee
    increasingly complex operations and situations, and support an AI assisted emergent
    type of commander’s intent. At the same time, decentralized execution of small
    teams will be replaced by the decentralized execution of human–machine teams,
    autonomous swarms of machines, with a “human in the loop”.


    This leadership philosophy, which will be triggered and supported by AI technology,
    will transform decision-making into a collaborative and agile process, and empower
    leaders at the top of the bureaucratic institutions to delegate intent co-creation
    authorities to the lowest levels of the command chain. If leadership training
    in the Alliance prepares junior leaders to take ultimate responsibility, and look
    at their actions as experiments, then this new AI platform of a collaborative
    intent creation can eventually replace intent originating solely from top leaders.
    It is a radical departure from the traditional military mindset.


    To implement this new “AI friendly” mindset, and organizational methods, an AI
    focused strategic vision is required, with novel educational solutions, as well
    as methods to deliberately nurture people to adopt the new mindset within an organization.
    NATO has to gradually build up a larger population of AI educated professionals,
    and conduct multiple experiments during exercises that address NATO challenges
    based on the tools AI can support. The upfront costs of establishing a strategy-driven
    “NATO AI program” are minimal when compared to the costly programs involving new
    platforms. The return on investment though is huge. This mindset shift can enable
    the Alliance to facilitate human–machine co-evolution, which in turn will change
    the way we address instability situations.'
