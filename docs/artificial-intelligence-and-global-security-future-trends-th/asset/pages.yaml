- pgno: 92
  md: 'sentience is not a moral paradise, but instead a world in which morality has
    disappeared, as all beings capable of it have ended. This seems a *reductio ad
    absurdum* argument against sentientism (Abney, 2004).


    The belief in sentientism may stem from a common confusion between an entity having
    intrinsic value (which by definition requires no extrinsic, external relationship)
    and final value (valuable as an end in itself, not as a mere means to some further
    end) (cf. Korsgaard, 1983). Intrinsic value requires final value, but the converse
    is false. If the existence of morality requires moral responsibility (Abney, 2019),
    then only morally responsible agents have intrinsic value, but many other things
    could have final value. Hence, all other moral value depends on what agents should
    value – whether it is purely instrumental (like an asteroid valued for its mineral
    wealth) or a final value, like taking pleasure simply in the view of Saturn’s
    rings, regardless of whatever other use they may be.


    AIs, by definition, can certainly reason; they are defined as an attempt to achieve
    cognitive goals. Do they thus have intrinsic moral status? My answer: not yet,
    for they as yet lack the crucial requirement of agency and full autonomy (for
    more detail, see Abney, 2012; Verruggio & Abney, 2012). There is an immediate
    implication: AIs and their embodiment in robots (that lack agency) have a practical
    moral superiority over humans for almost all our near-term legitimate purposes
    in space. As long as AI and robots have no intrinsic moral status, there is no
    inherent wrong in using them as a means to explore, mine, and even help humans
    colonize alien locales; and of course, to fight any just wars in space. It may
    even be crucial that they have no sense of their own self-importance, no drive
    to preserve themselves at the expense of harm to others. For obeying the dictates
    of just war theory (JWT), it will help if AIs/robots are willing to sacrifice
    themselves to avoid harm to civilians. And further, suppose we encounter alien
    persons, or have as a final value unspoiled alien landscapes, flora, or fauna;
    it’s best if the first representatives of humanity to encounter them are creatures
    which are morally dispensable – our AI/robotic scouts and ambassadors and warriors,
    our proxies and advocates for human civilization. It may turn out to be very important
    indeed to make a good first impression, to be willing to sacrifice our creations
    for our would-be friends; as opposed to making them our enemies. In fact, this
    willingness could become a matter of existential importance; an argument to be
    continued in the final section.


    # *Narrow AI Versus AGI*


    Given that an AI is an artificially constructed attempt to achieve cognitive goals,
    another distinction is needed: between narrow AI and general AI (AGI). A narrow
    AI matches or exceeds human capabilities at attaining a specific cognitive goal;
    say, winning at chess, or calculating the product of two 17-digit primes. But
    while current AI chess programs can beat the human world champion, they are helpless
    at telling you where the closest gas station is. So, an AGI is an AI that has
    human-level or better capabilities generally – ideally, for all possible cognitive
    goals. Narrow AI, as seen, is already commonplace, whereas AGI remains for'
