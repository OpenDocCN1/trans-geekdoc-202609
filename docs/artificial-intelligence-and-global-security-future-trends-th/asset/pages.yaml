- pgno: 27
  md: '# # Artificial Intelligence and the Future Global Security Environment


    Yvonne R. Masakowski


    # ## Abstract


    Advances in Artificial Intelligence (AI) technologies and Autonomous Unmanned
    Vehicles are shaping our daily lives, society, and will continue to transform
    how we will fight future wars. Advances in AI technologies have fueled an explosion
    of interest in the military and political domain. As AI technologies evolve, there
    will be increased reliance on these systems to maintain global security. For the
    individual and society, AI presents challenges related to surveillance, personal
    freedom, and privacy. For the military, we will need to exploit advances in AI
    technologies to support the warfighter and ensure global security. The integration
    of AI technologies in the battlespace presents advantages, costs, and risks in
    the future battlespace. This chapter will examine the issues related to advances
    in AI technologies, as we examine the benefits, costs, and risks associated with
    integrating AI and autonomous systems in society and in the future battlespace.


    *Keywords:* Artificial intelligence; future; autonomous; unmanned; decision-making;
    modeling; deep learning; military; strategy; tactics


    > > The world is very different now. For man holds in his mortal hands the power
    to abolish all forms of human poverty and all forms of human life. --John Fitzgerald
    Kennedy.


    # ## Introduction


    The next world war will not be focused on who fired the first shot. Rather, future
    warfare will be focused on the control and dissemination of information across
    all domains, including information about everything and everyone! AI networks
    will'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'serve as the grid and blueprint of the new battlespace of the twenty-first
    century. Becoming the leader in Artificial Intelligence (AI) is the key to achieving
    global dominance. Nations will use AI technological superiority to shape the geopolitical,
    social, and economic environment to their nation''s strategic advantage. Nations
    will integrate AI technologies and networks across a wide spectrum of applications
    to expand and enhance their economic, geopolitical, and military agendas. Advances
    in AI will influence every phase of humanity and daily life, thereby impacting
    the individual, society, and shaping the battlespace of war.


    As nations strive to address each of these global challenges, they seek to identify
    tools and technologies that will support them in their decisions during times
    of crises across a range of domains. We see AI being used today during the Global
    Pandemic in the development of models and surveillance systems to monitor people''s
    movements and travel patterns on a local and global level. Nations require information
    management tools that help to sort through the elements of crisis management,
    such as logistics, personnel management, supply chains, the distribution of goods,
    and technologies for maintaining regional security (Hamel & Green, 2007). Each
    of these topics requires a means of managing vast amounts of data and indeed,
    AI technologies excel at Big Data management (ICO, 2017). Advances in AI technologies
    will support both government and nongovernment agencies such as the United Nations
    and the International Committee of the Red Cross, to prepare and manage crises
    as they emerge. The United States, NATO, and its allied partners have identified
    AI technologies as critical for ensuring technological superiority and achieving
    the military strategic advantage (US Department of Defense, 2019; Masakowski,
    2019d).


    AI affords the military and nongovernment agencies the means of managing and analyzing
    large data sets and supporting decision-making at all levels (Tegmark, 2018).
    Indeed, there is a great deal of enthusiasm for the development of AI-enabled
    technologies to improve daily life and enhance warfare. AI technologies serve
    as a force multiplier for the military as it can streamline the information pipeline,
    analyze data, and accelerate the decision cycle. However, we contend that it is
    essential to keep the human-in-the-loop as they alone have the ability to understand
    context and integrate the nuances of contextual information across a wide domain
    of contributing factors that the AI system has yet to master (e.g., culture, organizational
    hierarchy, etc.).


    AI technologies, to some extent, have been overpromised and underdelivered as
    people become excited about its capabilities and often misunderstand the complexities
    and limitations of AI systems. Simply stated, you can''t buy a pound of AI and
    insert it like plaster in a crack in the wall. You have to first understand the
    problem and related issues within the context of the situation itself. This requires
    knowledge and understanding of the situation in which you want to deploy AI as
    part of a network, part of the organization, or merely augment a human decision-maker''s
    thinking. One of the principal advantages for the military is to develop adaptive
    and agile AI networks that will facilitate information management during times
    of crises.


    Distributed sensors collecting information across all domains including air, land,
    sea, undersea, and in space will be analyzed and managed by integrated and'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'distributed AI networks. Satellites will be linked as information nodes within
    the grid of AI networks emanating across all domains and at all levels to capture
    data and attempt to make sense of it all. AI is the key to achieving global dominance
    for all nations seeking to control information across all domains to their strategic
    advantage! China and Russia have provided evidence for this objective in their
    national strategic strategies.


    China has put its stake in the ground stating that it aims to be the global leader
    of AI technologies by 2030 and is well on its way to make good with its claim
    (Allen, 2019; Chan & Lee, 2018; China State Council, 2017; Dai & Shen, 2018).
    China has invested heavily in AI technologies for numerous applications, from
    facial recognition for identity management, population control, resource management
    (i.e., water, minerals, materials, etc.) to manufacturing applications. China
    has provided further evidence of the potential impact of AI technologies on society
    and global security.


    Likewise, Russia has invested in AI to shape their global political and strategic
    objectives. Their nation is investing in AI to weaponize information to their
    political and strategic advantage. Regardless of our personal or political views,
    the fact is that AI technologies have facilitated new, advanced capabilities.
    The question is: What type of future do we want to create? How can democratic
    nations use AI technologies to ensure global security?


    Advances in AI technologies will provide a means of safeguarding a stable environment
    in which the national security strategy, productivity, and economic progress is
    ensured. Indeed, national strategies are designed to ensure economic and geopolitical
    stability. In the book, *Future Smart*, we are advised about game-changing trends
    that will shape the future of business and warfare. (Canton, 2015). Canton highlights
    the similarities between current advances in AI technologies with those innovations
    and inventions of the Industrial Revolution. He posits that AI will influence
    and accelerate the development of AI technologies across a wide range of domains
    including medicine, manufacturing, and warfighting (Canton, 2015). He further
    hypothesizes that the impact of AI will be further accelerated by the integration
    of quantum computing, as well as advances in batteries, and materials. One can
    extrapolate from this hypothesis that the integration of AI advances with new
    materials, batteries, and computing power will only expand and enhance its capabilities.
    Time to decide and act will grow shorter with each advance! Each advance in AI
    technology and computing power increases the level of risk in global security
    as advances will present new and unanticipated challenges to maintain global security.


    China is aware of these benefits and has already integrated AI technologies in
    the design of what they call, *Intelligentization* of design (Zhou, 2013). Shifting
    from innovation to intelligentization refers to the fact that new systems and
    technologies being designed will be integrated with a level of intelligence that
    will make them safer, more reliable, self-sustaining, and just plain smarter than
    previously thought. For example, the design of a locomotive that has been integrated
    with AI intelligence affords it increased capabilities of being self-aware, self-learning,
    self-maintaining, and ensures network connectivity and communication that makes
    the locomotive safer, more reliable, and cost-'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'effective. Like the Industrial Revolution, we anticipate that intelligentized
    systems will continue to expand and contribute to a network of self-sustaining,
    automated systems capable of manufacturing a host of products, technologies, systems,
    and tools of war.


    We recognize that AI is having an impact on society, politics, economics, and
    gains in manufacturing capabilities. Advances in AI are also having significant
    effects on the battlespace and twenty-first century warfare. AI networks have
    accelerated the decision cycle for the warfighter and for the adversary. AI networks
    and intelligent agents can quickly detect, collect and analyze data to inform
    decisions and make recommendations for the benefit of the decision maker. However,
    these same capabilities may also prove to be a weapon in the hands of the adversary.
    The real advantage democratic nations have is its people. From the American Revolution
    through the Space race, the human spirit has launched mankind into new territories.
    This time is no different. Humans have a pioneering spirit and adapt quickly to
    change. This is such a time that calls for adaptation and innovation.


    For the twenty-first century is a time rife with opportunity, complexity, and
    uncertainty. We must acknowledge that global security rests not on an individual
    nation but requires all nations to consider working together collaboratively to
    achieve a sense of collective security for all its members. There are challenges
    and concerns regarding trusting the source of data and determining whether the
    information received is trustworthy. It is essential that democratic nations work
    together to ensure that trust and truth are the essential ingredients of AI networks
    and systems to ensure global security. Indeed, nations must reckon with issues
    related to national sovereignty that, up until now, prohibited them from sharing
    historical database and information that is proprietary. However, if we are to
    ensure global security; then, nations must work collaboratively and cooperatively
    to achieve unity of effort to ensure the security of our world. There will be
    a trade space in which nations must contribute to the greater good of maintaining
    global situation awareness (GSA) if they are to ensure global security. “Those
    who would give up essential Liberty, to purchase a little temporary Safety deserve
    neither Liberty nor Safety” (Franklin, 1776).


    Advances in AI present a paradigm shift for nations to be assured of controlling
    their national security agenda. Nations must collectively defend against future
    adversaries as their collective security to safeguard their individual national
    security agendas will depend upon it. The responsibility for ensuring and safeguarding
    national agendas will necessarily be a collective venture between nations across
    the private and public sectors. This collective investment is due to the tremendous
    investment it will take to ensure that nations have AI systems in place that can
    detect behaviors, if not anticipate, adversarial intent before negative events
    occur! Anticipatory and predictive AI networks and agents must be developed if
    we are to be agile and adaptive in this new complex and uncertain global security
    environment.


    AI networks facilitate cyberwarfare and the weaponization and manipulation of
    information presenting cyber threats that raise serious challenges and concerns
    for ensuring global and national security. The question is: How will AI be used
    to'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'shape future governments and future generations? How will we defend our nation
    in the cyberspace of the future to secure global security? For now, we are at
    the intersection of innovation, intelligentization, and an evolution and revolution
    of AI networks and system designs that present opportunities and challenges, each
    of which may have grave consequences for mankind. It is apparent to some of us
    that corporate and government defense organizations must work together if we are
    to be successful in ensuring a secure future for all.


    Future AI networks and systems will be used to shape the global security landscape.
    Indeed, AI dominance will ensure a nation’s global geopolitical and economic dominance
    as they attain control of the information environment and its resources across
    all domains, air, land, sea, undersea, and most especially, space. China and Russia
    recognize the military gain in this regard. There is no time to waste for nations
    including NATO and its Allied partners to invest in AI technologies as a means
    of ensuring global security.


    If nations (NATO, Allied partners, etc.) are to remain adaptive and agile, we
    must develop AI systems that are anticipative and predictive. Future AI situational
    awareness (SA) systems will play a pivotal role in providing nations with the
    decision advantage. We no longer will have the luxury of time. It took approximately
    22 minutes to rally a military response to 911 attacks. Today, we have less time
    to respond and far less time to understand the complexities of the situation.
    AI technology and networks can reduce the time and accelerate the decision cycle
    to ensure global security.


    Investment in AI technologies will provide the military strategic advantage that
    is essential for global security. Intuitive AI systems, designed with adaptive
    neural networks and machine learning algorithms, will detect intent and forecast
    events in the future. Automated bots, adaptive computer algorithms, and smart
    systems will transform business and warfare. Disseminated sensors, embedded from
    sea floor to satellites in space, will facilitate global situational awareness
    (GSA) with predictive capabilities. AI technological superiority will support
    nations who collaborate and cooperate with AI with each other to ensure global
    security. This will take the political will of those leaders who wish to gain
    the strategic advantage and those who make decisions regarding sharing of national
    information to achieve a common understanding of a complex and uncertain environment.


    Today’s operational environment has become more complex as a result of advances
    in AI, and AI-enabled technologies such as robotics and Autonomous Unmanned Vehicles
    (AUVs) and systems. Indeed, the character of warfare has been transformed by the
    emergence and utilization of AI networks and unmanned autonomous systems including
    AUVs and Unmanned Underwater Vehicle (UUV) systems. These AI-enabled system designs
    have expanded our SA in the battlespace with extensive networks of sensors from
    sea floor to space satellites. The information garnered from these distributed
    sensor networks has been collated and analyzed by AI networks to facilitate more
    effective mission planning and execution (Finney & Klug, 2016). However, these
    systems have yet to be challenged strategically by adversaries equipped with similar
    capabilities. That day will come. Consideration has been given to the potential
    impact of AI'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'technologies in urban warfare and one can only hope that it doesn’t come to
    that to experience such a reality.


    Advanced AI technologies are considered critical components for gaining the military
    decision advantage by our global competitors such as China, Russia, and North
    Korea. Each of these nations has also developed strategic doctrine on AI technologies
    and how they intend to invest in their future development for maintaining global
    military dominance.


    Advances in AI and computing power will continue to increase system capabilities
    and contribute to the complexity of the operational environment. It is a propitious
    time to consider the effects of AI technology within the context of future global
    security. As nations compete to be the global leader in AI technologies, the security
    of the world is in play and at risk.


    AI networks of the future must be designed to ensure global security for adversarial
    nations seeking global dominance will exploit every vulnerability to their strategic
    and economic, geopolitical advantage. Nations must work collaboratively to develop
    the AI technologies necessary to ensure global security. Global security with
    AI networks and systems must be a strategic imperative!


    # Innovation and Advances in AI


    There have been significant advances in AI technologies as evidenced by the wide
    array of systems developed by the commercial marketplace. From smart phones to
    digital cities, we have only begun to see the potential for the integration of
    AI technologies in our lives (Masakowski, Smythe, & Creely, 2016). We anticipate
    that advances in AI technologies and tools will expand and infiltrate every aspect
    of life. Just as the telephone, radio, rail, and the airplane emerged and influenced
    society during the Industrial Revolution, so too, AI technologies will reshape
    twenty-first century society and warfare.


    Such technological changes will be both evolutionary and revolutionary. Evolutionary
    in that AI technologies will continue to modify our behaviors and the way that
    we live and conduct daily life. Whether we are booking a flight, traveling from
    one city to another, get stuck in traffic, or look for a restaurant in a new city,
    we check our AI-enabled smart phone to help guide our decision-making. The military
    uses AI technologies to collect and manage sensor data, gain SA, and conduct Intelligence
    Preparation of the Battlespace (IPB) which are essential elements for ensuring
    mission success.


    We are sitting at the precipice of great changes in society and in our lives.
    The arms race is on for global dominance (Masakowski, 2019a, 2019b). AI is the
    fast track to the future where nations will compete to be the leader in AI as
    a step toward controlling global commerce and warfare.


    As nations and society integrate AI advances to improve the quality of daily life,
    such changes will also become integrated in the future battlespace. As advances
    in AI technologies continue to evolve, we anticipate that the revolution in warfare
    has only just begun (Geissler, 2019). Specifically, advances in AI-enabled technology
    will shape the roles and responsibilities for individuals,'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'society, and the military (O''Lanagan, 2018). We must acknowledge that as AI
    technologies advance and become integrated in society, the military will seek
    to exploit such advances to their strategic advantage (Masakowski, 2019c). Once
    turned on, these capabilities will not be turned off.


    We anticipate that AI technologies will reshape the battlespace similar to what
    occurred as a result of the development of the long bow, tank, radar, airplane,
    and the aircraft carrier. Regardless of its era, each technological advance was
    a game-changer on the battlefield that revolutionized warfare for its time. However,
    unlike the long bow, whose use was confined to the battlefield, AI technologies
    will not be confined nor constrained. Advances in AI technologies will extend
    beyond the battlespace and reach into our homes and personal lives.


    Today, the commercial community is redesigning the environment with digital cities,
    energy grid management systems, AI networked air traffic control systems, and
    integrated networks that link individuals, cities, and governments. For the military,
    this constellation of AI networks presents opportunities for nations and adversaries
    to manage information and exploit the AI network to their tactical and strategic
    advantage.


    I would argue that the blueprint design of digital cities may be readily converted
    to the command and control grid for future warfare. The integrated network designed
    to manage a city’s infrastructure may also be seconded and repurposed for warfare
    by our adversaries. There are grave implications for global security when thinking
    about the ways in which such AI networks can be used in the future. Foremost among
    these is the issue of managing crises and conducting warfare in urban regions,
    a topic that has been and will continue to be explored (Geissler, 2019).


    The future operational environment extending from 2020 to 2050 and beyond will
    continue to be dynamic and challenging with increased complexity and uncertainty.
    We must take time to consider how these changes will affect future warfighting.
    Nations must develop doctrine, policies, and warfighting rules of engagement,
    as well as legal and ethical practices that will integrate AI systems into the
    network of mission plans as a critical step for ensuring their nation’s security.
    One of the principal questions my students raised in this regard has been: Will
    I be court martialed if I don’t listen to the AI system recommendations and follow
    them? As well as, Will I be court martialed if I listen to the AI system recommendations
    and they are wrong? There are serious ethical considerations for military leaders
    and warfighters that must be addressed by policymakers.


    Technology in and of itself is not the principal issue. Rather, there are considerable
    ethical and moral consequences related to the implementation and integration of
    advanced AI systems for society and warfare (Geissler, 2019; O’Flanagan, 2018;
    Peltz, 2017). We must remain vigilant and perspicacious regarding advances in
    AI technologies as these will provide capabilities to the military as well as
    to our adversaries. We must anticipate and war game worst-case scenarios and the
    potential for adversaries to use such technological advances as weapons against
    society (Ashrafian, 2015a; 2015b; Bostrom, 2014).'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Civilian and Military Applications: Shaping Expectations


    As a society, we have already become somewhat accustomed to advances in artificial
    intelligence technology. We have a set of expectations regarding the capabilities
    of such technologies at our fingertips. We Google our questions, searching for
    answers and trusting that the information provided to us is accurate. Regardless
    of our search engines, we anticipate that these tools will help us find the answer
    to our question. We implicitly trust that the information will be reliable. Our
    expectations have been shaped by our interactions with these AI networks.


    We have adapted to this new world environment where our perceptions are shaped
    by the news media. This sense of trust that we have acquired based on our interactions
    with AI systems have set the stage for shaping our societal and political perspectives
    as well. Recent revelations regarding the Russian intrusion into our last presidential
    election has shown that AI facilitates our adversaries’ ability to shape our nation’s
    politics. We have come to accept cameras and surveillance systems monitoring our
    decisions and movements. Alexa placed in our homes, provides a means of monitoring
    our thoughts, social interactions and political preferences.


    We have unwittingly invited personal surveillance into our homes as an accepted
    part of the twenty-first century norm. We have abdicated our personal privacy
    rights as part of this process. We anticipate that surveillance systems will continue
    to monitor and mold every facet of our lives, including national economic and
    political agendas. As AI systems become more integrated in each city’s infrastructure,
    we anticipate that events will be monitored continuously on a local and global
    level. Monitoring unwitting civilians has far-reaching ethical consequences for
    society as it violates individual privacy rights and intellectual freedoms (Geissler,
    2019; Masakowski et al., 2016; Peltz, 2017). Therefore, attention must be paid
    to the level of intrusiveness and control that AI technologies will be allowed
    to exert on the civilian population. We must align our system designs with the
    values and ethics of the society in which they will function.


    From an individual perspective, members of society will be presented with privacy
    challenges that will affect every aspect of their personal lives, their jobs,
    housing, education, associations, friendships, and political views. From a national
    perspective, nations will shape and control their citizens’ perceptions. Private
    citizens will be monitored in their home and workplace. Friends’ perceptions and
    associations will be scrutinized by AI systems that collect data to ensure that
    individuals are aligned with government policies as a means of ensuring stability
    within a region. It really is all about control of information, people, and warfare.
    However, there are consequences for this approach. According to Geissler (2019):


    > This Orwellian capability creates a one-sided Panopticon, leaving the targeted
    population paralyzed and without privacy. Being left with little choice to fight
    back, distrust and fear will disrupt the informal life and damage the social fabric.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'We must consider ways to protect and ensure that future AI systems will be
    integrated with ethical values consistent with the societal ethical values. This
    is critical in that there is a real danger that failing to do so will have grave
    consequences for society and nations (Geissl, 2019; O’Flanagan, 2018; Peltz, 2017).
    As AI systems evolve and become ubiquitous on a global scale, the complexity of
    this pervasive AI network will become more deeply integrated and not easily managed
    by humans.


    This presents challenges to designers and developers as they must consider the
    potential for negative consequences of developing advanced AI systems that may
    present risks to society. For the present, AI systems are intended to augment
    and support human decision-making. However, this may change as AI system designs
    progress in the future. Future AI designs may be the intrusive educator that identifies
    the unsuspecting and unwilling citizen who is not aligned with national perspectives.
    AI may become the sole source for reshaping human behavior and perspectives aligned
    with a national agenda.


    China serves as an example of how AI surveillance technology can be used to shape
    political perspectives using digital social scoring. The government uses AI surveillance
    systems to monitor social interactions and behaviors that do not align with the
    Communist Party''s political agenda. Individuals who have been deemed as behaving
    contrary to China''s national policies are removed from society to be re-educated
    into the national Communist political agenda. Do you think that this could never
    happen in the United States? Weren''t we all educated in schools that begin class
    with the pledge of allegiance? What does this mean for US citizens who have been
    known historically as independent thinkers? How will AI be used against each nation''s
    citizens?


    For the military, concerns are raised regarding the ways that adversaries will
    make malicious use of advances in AI technologies (Ilachinski, 2017). Adversaries,
    whose ethics fail to align with those of society at large, will not be reluctant
    to use AI advanced technologies to their advantage regardless of the gravity of
    the consequences for their fellow human beings. Their will be a strategic objective,
    unconstrained by a code of ethics, moral values, or ethos that prevents them from
    doing harm to others.


    # AI and Preparing for Future Warfare


    Future warfare will be focused on economic and geopolitical control. The control
    of information across the globe, control of people, places, resources, and economies
    will enable nations to achieve global dominance across all domains – air, sea,
    land, undersea, especially resources in space. Economic prosperity is essential
    to maintain a nation''s infrastructure, secure environment, as well as its flow
    of trade and commerce. From a national perspective, nations will have to secure
    control of their nation''s political and economic stability to maintain their
    place on the global stage and in the global economy. Nation-states that fail to
    maintain economic and political stability are at risk of war, whether on a civil
    or regional scale. Failed economies give rise to political upheaval and civil
    unrest. Regional'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'crises will emerge over critical resources such as food, land, and water, etc.
    AI will play a critical role in ensuring the security of a region as well as sustaining
    economic stability.


    Maintaining a secure economic environment is of paramount importance in major
    cities as they serve as the hub of economic progress. Ports of call in the United
    States, such as Boston, New York, and ports in California are critical to monitor
    to ensure that commercial transit continues unhindered by adversarial actions.
    The maritime commons will need to remain free for extending global commerce that
    is essential for supporting each nation. AI surveillance and monitoring technologies
    across each domain (land, air, sea, and space) will ensure that the transit of
    goods continues unimpeded and thereby support continued economic trade and growth.


    AI technologies offer great promise in support of global security. However, leaders
    must achieve an understanding of AI technology as there is a potential for cascading
    consequences that will flow from these advances to shape our future. For example,
    AI surveillance systems provide a means of collecting and analyzing vast amounts
    of data. These data may be used for planning and providing courses of action in
    complex operations. Regardless of which agency or military use these systems to
    conduct their operations, information is time critical. AI systems excel at information
    management and analysis. The question is: What are the objectives for gathering
    this information? How will this information be used and by whom?


    The military is a primary user of AI-enabled systems that manage Big Data. Their
    principal concern is whether the AI system is reliable and trustworthy. They must
    find ways of validating information, options, and recommendations provided by
    AI systems. From an individual soldier to the NATO leader, each person shares
    these concerns as nations recognize the inevitable integration of AI technologies
    in future warfare. Soldier-centric AI technologies will prove to be an asset on
    the future battlefield. However, soldiers need to have technologies designed that
    are tailored to their specific roles and responsibilities. Such systems must also
    have ethical rulesets embedded in their design to ensure that a mistake in targeting
    or mishap does not occur as a result of using AI technology that is not developed
    with ethical values integrated in its design. We know that AI networks will provide
    leaders with options and recommendations for developing mission plans. However,
    there is a need to consider the fact that such systems will need to support human
    ethical values as it carries out its mission. Namely, AI should be designed to
    be self-aware, self-defensive, optimize SA, minimize errors, and mitigate collateral
    damage, be predictive regarding adversarial actions, and ensure operational success
    in an ethical manner. This is not the current state of AI technology but rather
    a wish list of characteristics that will be essential for future AI systems.


    NATO is addressing the topic of AI-enabled systems integrated in the battlespace.
    They are seeking ways to exploit AI technologies to make NATO operationally agile
    and able to support a wide range of military operations. NATO is developing plans
    for educating its leaders and encouraging the design of AI systems that will support
    the leader and decision-maker. Further, NATO has published its set of guidelines
    for AI designs, highlighting the need to develop AI'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'systems that are ethical, lawful, robust, resilient, and trustworthy (NATO,
    2019). Although the template of the future has been presented, the reality of
    these designs will be challenged with the ethical application of AI.


    Each nation is concerned about the influence of AI and how it will affect future
    warfare. There are numerous questions as to how AI systems will be designed and
    how these AI systems will be used in the multinational military operation. Among
    the questions raised: How will they share information with their allied partners?
    How will they make systems interoperable and interchangeable? How will they come
    to an agreement as to who will lead the operation with AI systems in play? Regardless
    of the questions raised, each nation readily recognizes the value that AI information
    gathering and analysis tools bring to each military operation. Unity of effort
    is key to the success of future NATO operations as they seek to form an alliance
    of sharing AI networks and benefiting from its output and recommendations.


    NATO''s decentralized mission command is an integral plan for distributed teams
    to work collaboratively and with total shared SA that will enable their ability
    to make independent decisions. This approach moves the decision-making down at
    each level to empower and enable soldiers to have a shared understanding of commander''s
    intent, shared SA, and make informed and effective decisions. However, there are
    risks remaining related to trust and truth of the information provided (Singhvi
    & Russell, 2016; Russell, Dewey & Tegmark, 2015; Shim & Arkin, 2012; Sheridan,
    1992). How can soldiers and leaders verify the source, validity, and accuracy
    of the information received when this occurs so rapidly and enmeshed in an AI
    network?


    It is easy to say that we want AI systems that are robust, resilient, reliable,
    and trustworthy. However, it is another thing to design and develop such systems.
    At least for the moment, AI is being developed with these considerations in mind.
    As AI moves forward in design and capabilities, there will be an ever-increasing
    level of concern regarding its ability to operate independently of the human.


    There are no definitive answers to date as AI has yet to achieve the level of
    human general knowledge required for AI systems to formulate independent decisions.
    We would argue that such delays have given us the time to reflect and consider
    the capabilities society and the military require, as well as the costs and risks
    we are willing to incur.


    As we are preparing for the future, we must consider that there may be increased
    challenges and potential inherent threats from integrating AI systems into military
    systems on a global scale. There is also a risk regarding the design of AI systems
    themselves (Singhvi & Russell, 2016). Nations whose designers go rogue due to
    some ideologies may present potential threats as they integrate malicious content
    in the AI network that presents challenges and dangers to society and/or the military
    (Arkin, 2007; Tegmark, 2018). Indeed, we envision a future where all things are
    possible and prepare for worst-case events and scenarios based on the potentially
    negative applications of emerging AI technologies. Perhaps, such considerations
    should far outweigh those given to the benefits, costs, and risks associated with
    AI advanced technologies.


    Leaders such as Elon Musk, Stephen Hawking, and other notable scientists and leaders
    have argued that the risks associated with AI systems far outweigh the'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'benefits. Scientists have published an open letter warning the world of the
    dangers and risks associated with the development of AI systems (Hawking, Musk,
    & Wozniak, 2015; Mack, 2015; Russell, Dewey & Tegmark, 2015). Scientists and others
    forecast that AI systems ultimately will evolve to dominate humans and alter the
    world as we know it (Tegmark, 2018; Hawking, Musk, & Wozniak, 2015; Kurzweil,
    2006). Indeed, some have speculated that AI systems may well lead us into WWIII
    in error! Regardless of the disparity of viewpoints among scientists, the emergence
    and evolution of AI systems is inevitable. AI systems will continue to advance
    and evolve. Therefore, each nation must be prepared to deal with worst-case scenarios
    if we are to preserve our freedom and security.


    Within this context, we contend that it is prudent to take time to reflect and
    consider the potential societal and military impact of AI systems on the future
    global security environment. Whether AI will be used to maintain a city''s infrastructure,
    secure a nation''s economic and political stability, and/or ensure unrestricted
    commercial trade, there are consequences for integrating AI technologies into
    the fabric of society and the military. AI technologies have only just begun to
    become an integral part of our daily life. It is only a matter of time before
    such systems are integrated into every nation''s infrastructure, institution,
    and military organization. To ensure continued economic and political stability
    and security, nations must first consider the various perspectives and potential
    consequences of implementing and integrating AI technologies and systems in society
    and in warfare.


    # Cyberattacks and AI


    The increasing complexity of the environment has reconfigured the battlespace
    from one of well-defined geographic borders and readily identified adversaries
    to one without borders or boundaries and replete with invisible adversaries. Nations
    are no longer limited to traditional physical combat on the battlefield. Rather,
    individuals and nation-states may be equally effective taking advantage of AI
    systems and networks to launch a cyberattack that violates and destabilizes a
    neighboring nation''s economic and political stability, without firing a shot!
    The Russian intervention in the U S Presidential election serves as evidence for
    this type of political shaping. The weaponizing of information became a new tool
    for cyberwarfare. Nations readily recognize the value of shaping national and
    political perspectives by weaponizing information to their strategic advantage.
    The dangers of such information manipulation highlight the importance of developing
    AI systems and networks that can ensure validation of trusted agents as a source
    and a means of evaluating the truth of the information itself.


    Given the potential for exploiting advances in AI over the coming years, there
    is a need to address how such technologies might be used to defend a nation''s
    economy and political interests. This new ideological cyberwarfare sets the stage
    for a shift in the balance of power on a global scale. While China has led the
    way in its application of AI technologies to shape its national profile and social
    structure,'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'democratic nations such as the United States and its allies must forge their
    national strategies to ensure personal freedoms are preserved while maintaining
    national security. Democratic nations must lead the charge in developing AI systems
    that can verify, validate, and promote the means for developing trust in the information
    pipeline and for ensuring that we can trust the information provided to each nation.


    Nations must optimize their approach by taking steps to employ AI technologies
    to ensure that the balance of power remains favorable to human rights and freedom.
    Ethical guidelines must be integrated in future AI networks with checks and balances
    to ensure the security of information disseminated on a global scale. Nations
    must take a defensive posture against cyber deception and the manipulation of
    information by adversaries who use AI to exploit the cyberspace network to their
    strategic advantage (Demchak, 2019). All warfare is based on deception! (Sun Tzu)


    One can readily see the advantages, if not necessarily the benefits for governments
    to develop AI technologies that will provide GSA to ensure global security. China
    has demonstrated the utility of maintaining a network of surveillance systems
    to maintain social order among the civilian population by using facial recognition
    AI systems. As the population increases, there is a need to maintain the stability
    and security of the environment. This approach ensures stability within their
    nation, as well as developing a pervasive, integrated AI surveillance network
    that can easily be transformed into a command and control network for future warfare.
    AI technologies are dual purposed in China. Satellites and sensor networks used
    for communication serve both civilian and military objectives. AI technologies
    are designed and implemented to support economic, political and military objectives
    that will ensure their national strategic imperatives. This strategy serves them
    well as the AI surveillance systems can converted to a command and control network;
    therefore, they are also always prepared for war.


    Russia has used AI systems to weaponize information management and influence other
    government’s elections and economies (Behrmann, 2020; Konaev & Vreeman, 2019;
    Putin, 2019; Polyakova, 2018; Polyakova & Boyer, 2018). Therefore, military readiness
    mandates the need to develop AI technologies that will provide the competitive
    military advantage and ensure the security, safety, and stability of each nation’s
    citizens. However, the integration of AI-enabled systems does not come without
    risk. Rather, it raises the need for total GSA, and the need to develop a constellation
    of redundant satellites and systems, networks, and capabilities that will enable
    nations to be operationally agile as they seek to maintain peace and security.


    The future global security environment is challenged by the complexities of a
    battlespace replete with an integrated network of autonomous systems, distributed
    sensors, robotics, and AI-enabled systems that serve as the grid for managing
    today’s complex operational environment. The integration of advanced technologies
    such as AI-embedded systems and networks, including autonomous unmanned systems
    such as AUVs, and UUVs, has altered the way that the military and indeed, the
    individual soldier must function and fight in the twenty-first century battlespace.
    This is important because nations must address a wide range of operations that
    will require AI technologies to help nations anticipate where they will be needed,
    to verify whether these events will be catastrophic, and how'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'best to manage crises as they emerge (US Department of Defense, 2012; 2018a;
    2018b). Attention must also be given to developing agile AI networks that are
    capable of self-awareness, with implicit alert systems that inform the military
    of adversarial intrusions and AI systems that are capable of self-defense considering
    such events. The complexities of the global environment mandate an operational
    imperative to address these challenges using AI technologies to anticipate events
    and prepare to manage each crisis.


    # Autonomy and Artificial Intelligence


    Toward the end of the twentieth century, there was a great deal of focus on the
    revolution in military affairs that argued for netcentric warfare and advances
    in technology including AI and autonomous unmanned systems such as AUVs, and UUVs
    (Cummings, Clare, & Hart, 2010; Cummings & Guerlain, 2007; Goodrich and Cummings,
    2014). Netcentric warfare was the focus of the day as it described a network of
    integrated systems that could be managed by the human-in-the-loop. As AI technologies
    advanced in combination with machine learning (ML), deep learning (DL), and adaptive
    neural networks (ANNs), there was a conviction that AI would address every crisis.
    Some believed that it was only a matter of time before the human could step aside
    and let AI make all decisions (Tegmark, 2018; Turing, 1950). However, we know
    that we aren’t there quite yet. Today, research continues in the design of autonomous
    systems with AI-embedded systems.


    Advances in AI in ML and ANNs have facilitated the development of adaptive AI
    systems capable of learning the properties of the environment and forming innovative
    solutions (Alpaydin, 2016). Unlike previous AI systems that were deterministic,
    combinatorial algebraic equations, ML uses algorithms and rulesets that optimize
    learning by recombining layers of information in a hierarchical manner. Indeed,
    advances in AI, ML, and computational modeling have moved research in the direction
    of affective computational models and machine consciousness (Aberman, 2017; Arkin,
    1992; Chandra, 2017).


    DL models human thinking using a complex and integrated network of nodes with
    hidden layers that process data to make sense of information and to understand
    data in a holistic manner. Deep learning posits that algorithms learn the data’s
    structure and modifies its internal node network as it integrates layers of data
    to facilitate pattern recognition of properties such as those in visual recognition
    and speech patterns (i.e. prosody, pitch, temporal patterns, etc.) (Masa-kowski,
    2018d; Chandra, 2017). Namely, the AI system identifies specific features as it
    builds and integrates data as it learns and transfers primitive features from
    one layer to the next. Like a child learning a language, it learns specific properties
    and integrates features of speech (prosody, pitch, cadence, etc.) to learn a language.


    AI systems that use DL can capture multiple layers of information in their ANN
    to generate predictions based on their algorithms. This capability has relevance
    for the development and design of AI-enabled systems that can maintain SA that
    is essential for mission planning and execution. Recent field exercises such as
    *Sapient* (Andrew, 2018; Masakowski, 2019d; Ward & Evans, 2018) have'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'began to demonstrate the value of integrating such AI systems in the battlespace.
    MIT scientists have demonstrated that an autonomous unmanned underwater vehicle
    (AUV), enabled by AI, can form its own mission plans (Chu, 2015; Porat, Oron-Gilad,
    Rottem-Hovav, & Silbiger, 2016). Although there is still human oversight, this
    shift in capabilities from human-centric to AI system-centric decision-making
    will influence future warfighting.


    The transition from open combat on the battlefield to cyberspace has also transformed
    the battlespace (Finney & Klug, 2016). Today, open combat warfare is conducted
    within the context of cyberwarfare and irregular warfare. In the future, AI-embedded
    robotic soldiers will fight on the battlefield. Adversaries take advantage of
    every domain to gain their advantage in this new battlespace. Among the advantages,
    it is difficult for adversaries to reverse engineer AI networks. Adversaries will
    exploit vulnerabilities in the system network to gain the decision advantage.
    AI will provide a means of protecting our systems by serving as a network sentry
    on guard for persistent surveillance to defend our networks in the future. As
    AI systems become self-aware and capable of defending their networks, we will
    see the emergence of other AI systems that will search for flaws and vulnerabilities
    in these defense systems. AI networks must be designed to detect mimicry and deception,
    as well as defend itself against adversarial actions from nations who intend to
    intercept command and control of the AI system. Future system designers will develop
    AI systems that will be defensive and capable of countering the adversaries’ ability
    to take over the system and defend itself (Shim & Arkin, 2012). Pervasive, persistent,
    vigilant, and agile artificial networks will be critical for the defense of future
    global security.


    # Artificial Intelligence and Machine Learning: Advantages


    Artificial Intelligence (AI) systems and networks can deter and disrupt adversaries’
    attempts at violating a nation’s networks. AI systems have the ability, due to
    their complex computational capabilities, to discover, learn and recognize patterns,
    as well as detect intrusions and threats. In addition, deep learning has afforded
    AI systems the ability to learn from experience and adapt to changes in the environment,
    form and test hypotheses, draw conclusions, formulate plans, make decisions and
    act. AI can be a powerful asset for nations and adversaries alike who seek to
    gain the decision advantage in cyberwarfare (Ilachinski, 2018).


    Advances in AI technologies have shaped a new strategic path for each nation’s
    security strategy. Artificial Intelligence (AI), machine/deep learning, and autonomous
    unmanned systems will serve as a force multiplier in support of a nation’s strategic
    objectives, as well as a leader’s decision-making capabilities. It is incumbent
    upon society to consider the impact of these systems if we are to be prepared
    to defend against these systems being used against us in the twenty-first century
    battlespace. The future military force will be required to understand how to operationalize
    such technology vs the specifics of its design.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'As nations invest in advanced technologies, AI and autonomous unmanned systems
    will be used to reshape the global geopolitical landscape. AI technologies afford
    nations the ability to monitor its systems, shape their citizen''s perspectives,
    and control their behaviors in ways that were previously not possible. Given the
    potential power of future AI systems, there is a need to consider this capability
    as a new form of threat and one that must be defended against.


    AI capabilities have increased over time in terms of recognizing perceived patterns
    of speech and images. This ability to model human perception affords devices such
    as smart phones and tools such as “Alexa”, and/or robots like “Sophia” to collect
    data on individuals in the privacy of their homes without recrimination. As surveillance
    data is collected, there is no guarantee that these data will not be used to develop
    a profile of the individual for nefarious purposes (Peltz, 2017). In contrast,
    AI systems also can be exploited to reduce risks and loss of life in combat situations
    (Ramiccio, 2017). Although we are cognizant of AI technology’s positive outcomes,
    we must remain vigilant regarding the potential for malicious applications of
    this technology as it may be used for adverse purposes (Ilachinski, 2018; 2017a;
    2017b).


    Nations seek to gain the strategic and tactical advantage over potential adversaries
    by exploiting AI technologies. Although this is the principal driver for military
    applications, there are challenges and risks associated with achieving this objective.
    Among these issues, humans have difficulty with trusting AI systems and relying
    on their decisions. Soldiers will develop trust with AI systems as their algorithms
    are successfully executed. The ability to verify and validate information from
    an AI system remains the challenge as data is embedded within the deep layers
    of the neural network. Rather, the human will have to rely on algorithms that
    will formulate options to shape their decision-making. One of the issues related
    to this is the fact that these systems may not provide full data to the human
    to evaluate. Rather, depending on the AI’s capabilities, one may not receive full
    contextual data but rather proscribed data based on the algorithm’s selection
    of relevant information. That is, the AI NN system will develop options and decide
    which information is relevant for the warfighter.


    Advances in AI technology will accelerate the scale and speed of information processing
    as it excels at Big Data management. AI systems have demonstrated tremendous capacity
    for managing vast amounts of data that can enhance Situational Awareness (SA)
    and decision-making in the military operational environment. The integration of
    cognitive models and mission plans in the design of autonomous unmanned systems
    has propelled this technology forward as an independent platform. However, as
    these systems become more automated and capable of independent decision-making,
    one must consider the consequences of relinquishing the authority of decision-making
    in the combat operational environment. This is especially relevant given the focus
    on decentralized mission command and decision-making. Decision-making at every
    level must be supported by reliable, accurate, and valid information provided
    to the leader at all levels.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# International Perspectives on AI


    The twenty-first century security environment is one that presents numerous global
    security challenges such as mass migrations, regional conflicts, human trafficking,
    piracy, counter-terrorism, as well as humanitarian and natural disaster relief
    crises. Each of these crises presents challenges to the military, governments,
    and non-government agencies as they attempt to meet these demands. As crises emerge,
    there is a need for the military, governments, and agencies to manage the vast
    amounts of data related to each crisis. In addition, government and nongovernment
    agency leaders may be presented with conflicting information and need to make
    critical decisions that may have ethical and moral consequences.


    Unlike previous war eras, the United States is no longer the leader across all
    technological domains, specifically in the area of AI technologies. China has
    committed itself to become the leader in AI technologies and has invested in AI
    technologies to preserve its national strategic and political agenda. They have
    developed AI systems for satellites, surveillance, manufacturing, and facial recognition,
    among other applications related to the control and dissemination of information.


    It is worth noting that advances in AI technologies will play a pivotal role in
    achieving global supremacy (Allen, 2019).


    China and Russia have demonstrated the importance of AI in their role as global
    leaders. Indeed, China has committed to becoming the world leader in AI by 2030
    (Burrows, 2018; Kania, 2018; Ma et al., 2018). China has invested heavily in AI
    technologies for numerous applications including facial recognition, social scoring
    and population control, resource management (i.e. water, minerals, materials,
    etc.) and manufacturing applications. China has provided further evidence of the
    potential impact of AI technologies on society and global security. China is currently
    using AI facial recognition technologies to shape its economic and political landscape,
    as well as for social control and positive behaviors of its population (Campbell,
    2019; Chan & Lee, 2018; China State Council, 2017; Chutel, 2018; Dai & Shen, 2018).
    The level of commitment and investment in AI by China and Russia exemplify the
    importance of AI in their respective nation’s national security strategy (Behrmann,
    2020; Fedor & Fredheim, 2017; Heath, 2013; Hoffman, 2012; Konaev & Vreeman, 2019;
    Polyakova, 2018; Polyakova & Boyer, 2018). Nations must address the complexities
    of these challenges as they are advancing at a rapid rate and will affect both
    nations and adversaries. The application of AI technologies and networks to shape
    the political landscape on a global scale presents a clear and present danger
    if nations fail to address and defend against this.


    China’s strategic plan is to become the world leader in AI technologies and attain
    global dominance (Chan & Lee, 2018). Indeed, President Xi Jinping has stated that
    becoming the world leader in AI technologies is essential for global military
    and economic power (Allen, 2019; Burrows, 2018; Chan & Lee, 2018; Heath, 2013;
    Kania, 2018; Ma et al., 2018).'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'They have demonstrated their commitment by heavily investing in the development
    and design of AI technologies. They now dominate the amount of funding invested
    in AI start-ups globally and intend to become the leader of AI by 2030 (Robles,
    2018). China has invested in building digital smart cities with AI-embedded networks
    to manage the infrastructure. They have developed facial recognition and surveillance
    technologies to ensure social control and compliance of their nation’s people
    and secure China’s Community Party leadership’s agenda.


    China''s use of AI facial recognition systems is aimed at the control of information
    that influences their economic and political strategies. Today, China uses AI
    facial recognition for social control of their population. For some of its citizens,
    it appears to ensure security by providing a surveillance system that reduces
    crime. For others, social scoring and social credits may be earned doing good
    deeds for society such as donating blood. In return for good deeds, citizens may
    earn social credits and benefits such as improved health care, thereby shaping
    each citizen’s behavior for the benefit of society (Campbell, 2019). China assures
    its people that such technologies are in place to ensure their security; however,
    it appears that these systems are dual use in purpose and aimed more at constraining
    their people to ensure political stability aligned with their national agenda.
    It also affords China the opportunity to lay down a network of surveillance technologies
    that can be modified for dual use in warfare. Those same networks of surveillance
    systems, satellites, and AI networks will support China in its endeavor to maintain
    global situation awareness and control information on a global scale for its economic
    and political gain. China reshapes society and the political landscape by assigning
    digital social scores to individuals, based on their behaviors and associations,
    that is used to limit their access to jobs, education, and housing. China uses
    this approach to ensure its people’s compliance with their Communist party policies
    (Dai, 2018). This policy is aimed at ensuring that citizens upheld the Chinese
    Communist party leadership and agenda, as well as maintain social order (Heath,
    2013, 2019; Hoffman, 2012; NATO Technology Trends Report, 2017). China''s Artificial
    Intelligence and the Future Global Security Environment uses social scoring as
    a means of controlling and containing an individual’s personal freedoms, access
