  md: '# Data Privacy Versus Data Security: Don’t Get It Twisted


    Data privacy and data security are frequently conflated and often confused. There
    is more than a notional argument to be made for insisting on their distinction
    and why this distinction might be important. They should not be considered interchangeable
    as much as interdependent. A number of theoretical frameworks have been proposed
    by privacy advocates and scholars to better understand what is meant by privacy
    and how to mediate the controls to protect it (security). What is clear is that
    privacy is highly contextualized and value-laden which makes it difficult to ascribe
    any one singular definition. The priorities for data generators (users) and data
    collectors when it comes to privacy can be in violent disagreement.


    Broadly, data privacy can be defined as the rules or norms for how data is collected,
    shared, and ultimately used. Data security can be described as the means for protecting
    data from those with mal intent or from anyone who gains unwelcome or unapproved
    access to our personal information. Bambauer theorizes that privacy is a choice
    and can be seen as a “normative framework for deciding who should legitimately
    have the capability to access and alter information; while security defines which
    privacy choices can be implemented” (2013, p. 667).


    As stated earlier in this chapter the lack of clarity and uniformity in the United
    States and abroad has put data privacy concerns and compliance at the forefront
    for most companies. Laws like the Health Insurance Portability and Accountability
    Act (HIPAA) and the Children’s Online Privacy Protection Act (COPPA) give customers
    the right to see all data collected about them and allow them to request that
    the data be deleted. States, like California, have their own privacy laws (Schwartz,
    2019).


    The more recent General Data Protection Regulation (GDPR) from the European Union
    is even broader, defining a privacy violation as the illegal retrieval or disclosure
    of “any information relating to an identified or identifiable natural person.”
    That information can include posts on social media, email addresses, bank details,
    photos, and IP addresses. The law emphasizes consent, control, and demands clear
    explanations to users so they know how data is collected on them (Tiku, 2018).
    Currently, the law has some reported success related to notification of breaches
    to privacy; it has fared less well in punishing companies who mishandled personal
    data (Wolff, 2019). Reporting of fines for the first 9 months show that most companies
    are still not being penalized for not protecting individual’s data, and those
    that are being penalized mere fractions of the 4% of a company’s revenue ceiling
    (Wolff, 2019). Part of it likely has to be associated with detecting such breaches,
    the other likely stems from regulators understanding the impacts and costs associated
    with them once they happen.


    Each organization defines its own data privacy policies, which typically include
    what data will be collected, how that data will be collected and used, who will
    have access to it, whether, or how data can be shared with third parties, if data
    can be legally collected or stored, and how long data will be stored. They also
    detail which regulatory restrictions the organization must comply with.'
