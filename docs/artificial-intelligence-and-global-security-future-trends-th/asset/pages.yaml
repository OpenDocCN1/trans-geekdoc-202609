- pgno: 107
  md: '# Chapter 5


    # Building an Artificial Conscience: Prospects for Morally Autonomous Artificial
    Intelligence


    William D. Casebeer


    # Abstract


    Discussions of ethics and Artificial Intelligence (AI) usually revolve around
    the ethical implications of the use of AI in multiple domains, ranging from whether
    machine learning trained algorithms may encode discriminatory standards for face
    recognition, to discussions of the implications of using AI as a substitute for
    human intelligence in warfare. In this chapter, I will focus on one particular
    strand of ethics and AI that is often neglected; whether we can use the methods
    of AI to build or train a system which can reason about moral issues and act on
    them. Here, I discuss (1) what an “artificial conscience” consists of and what
    it would do, (2) why we collectively should build one soon given the increasing
    use of AI in multiple areas, (3) how we might build one in both architecture and
    content, and (4) concerns about building an artificial conscience and my rejoinders.
    Given the increasing importance of artificially intelligent semi- or fully autonomous
    systems and platforms for contemporary warfare, I conclude that building an artificial
    conscience is not only possible but also morally required if our autonomous teammates
    are to collaborate fully with human soldiers on the battlefield.


    *Keywords:* Ethics; artificial conscience; moral judgment; moral development;
    heuristics; autonomy; morality


    # Introduction: Ethics of Artificial Intelligence Versus Artificial Intelligence
    Ethics?


    Discussions of ethics and Artificial Intelligence (AI) range across a variety
    of issues important for both the general public and the national security professional.
    How do we ensure that our algorithms for determining who is a good risk when'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'extending a loan make fair and reasonable decisions? What should be a proper
    “training set” for teaching a learning algorithm how to identify a face so that
    we don’t build in race bias from the start? What rate of false positives and missed
    tumors should we tolerate in an algorithm that examines X-rays looking for cancer
    cells? Should targeting algorithms in semiautonomous missiles be tested until
    we can be one hundred confident they will never make an error? What parts if any
    of military decision-making – strategic, operational, and tactical – can we delegate
    to AI? And so on.


    These are all pressing, and in some cases difficult, questions. The bulk of them,
    however, are issues in applied ethics – “the ethics of AI,” if you will. That
    is, they deal with questions about ethical issues that surface when we apply AI
    to a particular area or domain; they deal with questions of consent, character,
    and consequence especially. Many of these questions have been discussed in detail
    in public fora and in scholarly journals. Answering them is an important exercise
    in applied ethics.


    In this chapter, however, rather than talking about the ethics of AI, I want to
    instead explore “artificially intelligent ethics” – that is, I want to talk about
    how we can use AI to build ethical systems, whether those systems be robots, human-machine
    teams, sets of algorithms, or semiautonomous weapons platforms. This chapter is
    primarily an exercise in “AI ethics,” not in the “ethics of AI.” This is an important
    distinction to make, as focusing only on the applied ethics issues can cause us
    to neglect very important questions about the epistemology and metaphysics of
    moral judgment and development – that is, questions about what moral knowledge
    is and how we come to have it, and questions about the nature of morality such
    that we think it is real and substantive, and not an illusion or chimera.¹ Our
    answers to these big picture questions in turn have important practical upshot
    – if I think, for example, that morality is “skilled performance” versus “abstract
    reasoning about principles,” I might have very different answers about some of
    the “ethics of AI” questions mentioned earlier.


    The primary AI ethics questions I will discuss here are: What is an artificial
    conscience? Why would we want to build one? How would we build it? And what are
    some of the practical and moral concerns we might have about doing so? I will
    briefly address each of these questions in turn. Building an artificial conscience
    is possible, can be done with variations on many already existing AI techniques,
    and is something that it is not only ethically permissible to do but something
    we are morally obligated to do given the very real power already wielded by semiautonomous
    and autonomous algorithms and platforms.'
