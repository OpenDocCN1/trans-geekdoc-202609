  \ 第 16 章：新闻摘要应用\n\n## 16.1 开发一个 AI 驱动的新闻文章摘要器\n\n新闻文章包含价值信息，但每日出版物的庞大数量让人难以跟上。AI\
  \ 驱动的新闻摘要提供了一种高效提取关键见解的方法，在节省时间的同时保留核心细节。\n\n在本章中，我们将：\n\n1. 理解文本摘要技术（抽取式 vs. 生成式）。\n\
  2. 使用 `OpenAI` 的 API 构建一个由 `GPT-4` 驱动的摘要器。\n3. 针对特定领域的新闻对摘要模型进行微调。\n4. 使用 Web API\
  \ 部署摘要工具。\n5. 针对真实应用场景优化性能。\n\n***\n\n##### 1. 理解 AI 驱动的新闻摘要\n\n文本摘要主要分为两类：\n\n\
  - **抽取式摘要 (Extractive Summarization)**：从原文中选择关键句子。\n- **生成式摘要 (Abstractive Summarization)**：用新的词汇生成简洁的摘要，同时保持核心含义。\n\
  \n`GPT-4` 非常适合生成式摘要，它通过理解上下文而非仅仅提取关键句子，来生成类人类的、连贯的摘要。\n\n##### 1.1 AI 摘要如何工作原理\n\
  \n1. **文本预处理** – 清理原始新闻文章（移除 HTML、特殊字符）。\n2. **句子分词** – 将文本拆分成句子或段落。\n3. **LLM 处理**\
  \ – `GPT-4` 分析并生成摘要。\n4. **后处理** – 格式化摘要以提高可读性。\n\n***\n\n##### 2. 使用 GPT-4 构建基础新闻摘要器\n\
  \n##### 2.1 前提条件\n\n安装所需的 Python 库：\n\n```python\npip install openai newspaper3k\
  \ python-dotenv\n```\n\n- `openai` – 用于与 `GPT-4` API 交互。\n- `newspaper3k` – 从 URL\
  \ 提取新闻文章。\n- `python-dotenv` – 安全加载 API 密钥。\n\n##### 2.2 设置 API Keys\n\n创建一个 `.env`\
  \ 文件并存储 `OpenAI` API 密钥：\n\n```ini\nOPENAI_API_KEY=your_api_key_here\n```\n\n在 Python\
  \ 中加载它：\n\n```python\nimport openai\nimport os\nfrom dotenv import load_dotenv\n\
  \nload_dotenv()\nopenai.api_key = os.getenv(\"OPENAI_API_KEY\")\n```\n\n##### 2.3\
  \ 获取并清洗新闻文章\n\n我们使用 `newspaper3k` 来爬取和预处理新闻文章。\n\n```python\nfrom newspaper import\
  \ Article\n\ndef fetch_news(url):\n    article = Article(url)\n    article.download()\n\
  \    article.parse()\n    return article.title, article.text\n\n##### 使用示例\nnews_url\
  \ = \"https://example.com/news-article\"\ntitle, content = fetch_news(news_url)\n\
  print(\"Title:\", title)\nprint(\"Content:\", content[:500]) # 显示前 500 个字符\n```\n\
  \n解释：\n- `fetch_news()` 函数从指定的 URL 提取标题和文本。\n- 下载、解析并清洗文章。\n\n***\n\n##### 3. 实现\
  \ GPT-4 摘要\n\n##### 3.1 基础摘要函数\n\n```python\ndef summarize_text(text, model=\"gpt-4\"\
  ):\n    response = openai.ChatCompletion.create(\n        model=model,\n       \
  \ messages=[\n            {\"role\": \"system\", \"content\": \"You are an AI that\
  \ summarizes news articles.\"},\n            {\"role\": \"user\", \"content\": f\"\
  Summarize this article:\\n{text}\"}\n        ],\n        max_tokens=200\n    )\n\
  \    return response[\"choices\"][0][\"message\"][\"content\"]\n\n##### 使用示例\nsummary\
  \ = summarize_text(content)\nprint(\"Summary:\", summary)\n```\n\n关键特性：\n- 系统提示（system\
  \ prompt）指示 `GPT-4` 对新闻文章进行摘要。\n- 用户输入提供文章全文。\n- `max_tokens=200` 确保摘要简洁。\n\n***\n\
  \n##### 4. 通过微调后的 GPT-4 增强摘要\n\n##### 4.1 为什么要微调？\n\n微调允许模型：\n- 生成针对特定行业（金融、政治、体育）定制的摘要。\n\
  - 减少幻觉并提高事实准确性。\n- 适应偏好的摘要风格（简洁 vs. 详细）。\n\n##### 4.2 准备摘要数据集\n\n`GPT-4` 微调需要 `JSONL`\
  \ 格式：\n\n```json\n{\"messages\": [{\"role\": \"system\", \"content\": \"You summarize\
  \ financial news.\"}, {\"role\": \"user\", \"content\": \"Summarize: Tesla stock\
  \ rises 10% due to earnings.\"}, {\"role\": \"assistant\", \"content\": \"Tesla\
  \ stock rose 10% following strong earnings.\"}]}\n{\"messages\": [{\"role\": \"\
  system\", \"content\": \"You summarize tech news.\"}, {\"role\": \"user\", \"content\"\
  : \"Summarize: Apple releases a new iPhone model.\"}, {\"role\": \"assistant\",\
  \ \"content\": \"Apple launched a new iPhone with upgraded features.\"}]}\n```\n\
  \n##### 4.3 为摘要微调 GPT-4\n\n1. 将数据格式化为 `dataset.jsonl`。上传数据集：\n```sh\nopenai tools\
  \ fine_tunes.prepare_data -f dataset.jsonl\n```\n2. 训练微调模型：\n```sh\nopenai api fine_tunes.create\
  \ -t \"dataset_prepared.jsonl\" -m gpt-4\n```\n3. 使用微调后的模型：\n```python\nmodel =\
  \ \"your_fine_tuned_model_id\"\nsummary = summarize_text(content, model)\nprint(summary)\n\
  ```\n\n***\n\n##### 5. 部署摘要 API\n\n##### 5.1 使用 FastAPI 创建 REST API\n\n我们可以使用 `FastAPI`\
  \ 部署摘要应用。\n\n```python\nfrom fastapi import FastAPI\nimport openai\n\napp = FastAPI()\n\
  \n@app.post(\"/summarize\")\nasync def summarize_article(url: str):\n    title,\
  \ content = fetch_news(url)\n    summary = summarize_text(content)\n    return {\"\
  title\": title, \"summary\": summary}\n```\n\n# 运行 API：`uvicorn filename:app --reload`\n\
  \n##### 5.2 优化性能\n\n1. 使用缓存避免重复调用 API（例如 `Redis`）。\n2. 设置文章长度限制以防止过度使用 token。\n\
  3. 批量处理多篇文章以提高效率。\n\n***\n\n##### 6. 实现高级摘要技术\n\n##### 6.1 使用检索增强生成 (RAG)\n\n为了提高准确性，整合外部知识源。\n\
  \n```python\ndef summarize_with_rag(text, extra_context):\n    response = openai.ChatCompletion.create(\n\
  \        model=\"gpt-4\",\n        messages=[\n            {\"role\": \"system\"\
  , \"content\": \"You are a news summarization AI with access to relevant facts.\"\
  },\n            {\"role\": \"user\", \"content\": f\"Summarize this article using\
  \ context:\\n{extra_context}\\n\\n{text}\"}\n        ]\n    )\n    return response[\"\
  choices\"][0][\"message\"][\"content\"]\n```\n\n优势：\n- 引入经证的来源以提高事实准确性。\n- 减少摘要过程中的幻觉。\n\
  \n\n\n\n\n# 5. 部署用于扩展的真实世界应用的情感分析 API。\n\n在本章结束时，读者将拥有一个功能齐全的情感分析流水线，能够实时分析社交媒体数据。\n\
  \n## 1. 情感分析基础\n\n### 1.1 什么是情感分析？\n情感分析（或观点挖掘）是一项 NLP 技术，用于确定文本的情感基调。它通常被用于将文本分类为：\n\
  \n- 积极（Positive）\n- 负面（Negative）\n- 中性（Neutral）\n\n### 1.2 情感分析的应用\n1. 品牌监控 – 跟踪用户对品牌的看法。\n\
  2. 政治分析 – 分析公众对政策的意见。\n3. 股票市场预测 – 利用情感进行财务预测。\n4. 客户支持 – 在反馈中检测客户的不满。\n\n## 2.\
  \ 理解用于情感分析的 Transformers\n\n### 2.1 为什么使用 Transformers？\n传统的 NLP 模型依赖于词袋（BoW）或 TF-IDF，这些模型缺乏上下文理解能力。由自注意力机制（self-attention）驱动的\
  \ Transformer 通过捕捉词与词之间的上下文关系优于以往的方法。\n\n主要优势：\n\n- 上下文感知 – 捕捉不同语境下的含义。\n- 在大型数据集上预训练\
  \ – 缩短训练时间并提高准确性。\n- 可扩展性 – 可以高效处理数百万条推文。\n\n### 2.2 预训练 Transformer 模型概述\n\n| 模型\
  \ |  |\n| --- | --- |\n| BERT (来自 Transformer 的双向编码表示) | 在双向文本上训练的上下文感知模型。 |\n|\
  \ RoBERTa (鲁棒优化的 BERT) | 使用更多训练数据优化的 BERT。 |\n| DistilBERT | BERT 的轻量级版本，更快但准确性略低。\
  \ |\n| Twitter-RoBERTa | 针对 Twitter 数据专门微调，用于社交媒体情感分析。 |\n\n对于社交媒体情感分析，`Twitter-RoBERTa`\
  \ 是最有效的，因为它在 1.6 亿条推文中进行过训练。\n\n## 3. 实现 Twitter 情感分析\n\n### 3.1 安装依赖项\n```bash\n\
  pip install transformers torch datasets tweepy fastapi uvicorn python-dotenv\n```\n\
  \n### 3.2 设置 Twitter API 访问\n创建一个 `.env` 文件来存储凭据：\n\n```ini\nTWITTER_BEARER_TOKEN=your_twitter_api_token\n\
  ```\n\n安全地加载令牌：\n\n```python\nimport os\nimport tweepy\nfrom dotenv import load_dotenv\n\
  \nload_dotenv()\nBEARER_TOKEN = os.getenv(\"TWITTER_BEARER_TOKEN\")\nclient = tweepy.Client(bearer_token=BEARER_TOKEN)\n\
  ```\n\n### 3.3 实时获取推文\n```python\ndef fetch_tweets(keyword, count=10):\n    \"\"\
  \"获取包含指定关键词的最新推文。”\n    response = client.search_recent_tweets(query=keyword, max_results=count,\
  \ tweet_fields=[\"text\"])\n    return [tweet.text for tweet in response.data]\n\
  \n##### 使用示例\ntweets = fetch_tweets(\"AI\", count=5)\nprint(tweets)\n```\n\n解释：\n\
  \n- 使用 `Tweepy` 的 `v2 API` 获取包含关键词的推文。\n- 返回一个用于分析的推文文本列表。\n\n## 4. 使用预训练的 Transformers\
  \ 进行情感分类\n\n### 4.1 使用 Twitter-RoBERTa 进行情感分析\n我们使用 Hugging Face 的 `transformers`\
  \ 库加载 `cardnlp/twitter-roberta-base-sentiment` 模型。\n\n```python\nfrom transformers\
  \ import AutoModelForSequenceClassification, AutoTokenizer\nimport torch\n\n# 加载模型和分词器\n\
  MODEL_NAME = \"cardnlp/twitter-roberta-base-sentiment\"\ntokenizer = AutoTokenizer.from_pretrained(MODEL_NAME)\n\
  model = AutoModelForSequenceClassification.from_pretrained(MODEL_NAME)\n\n# 情感标签\n\
  LABELS = [\"Negative\", \"Neutral\", \"Positive\"]\n\ndef analyze_sentiment(text):\n\
  \    \"\"\"使用 Twitter-RoBERTa 执行情感分类。”\n    inputs = tokenizer(text, return_tensors=\"\
  pt\", truncation=True, padding=True)\n    outputs = model(**inputs)\n    scores\
  \ = torch.nn.functional.softmax(outputs.logits, dim=-1)\n    prediction = torch.argmax(scores,\
  \ dim=-1).item()\n    return LABELS[prediction]\n\n##### 使用示例\ntext = \"I love new\
  \ technology!\"\nsentiment = analyze_sentiment(text)\nprint(f\"Sentiment: {sentiment}\"\
  )\n```\n\n## 5. 部署用于扩展的真实世界应用的情感分析 API\n\n### 5.1 使用 FastAPI 构建 API\n```python\n\
  from fastapi import FastAPI\n\napp = FastAPI()\n\n@app.post(\"/analyze\")\nasync\
  \ def analyze_tweet(tweet: str):\n    sentiment = analyze_sentiment(tweet)\n   \
  \ return {\"tweet\": tweet, \"sentiment\": sentiment}\n```\n\n运行 API：`uvicorn filename:app\
  \ --reload`\n\n### 5.2 优化\n- 批量处理 – 一次分析多条推文。\n- 使用 `Redis` 缓存 – 存储频繁查询。\n- 速率限制\
  \ – 防止滥用。\n\n## 7. 高级技术：情感趋势与多标签分类\n\n### 7.1 随情感趋势\n- 聚合情感得分以跟踪趋势。\n- 使用 `Matplotlib`\
  \ 或 `Dash` 可视化趋势。\n\n### 7.2 多标签情感分析\n不仅是积极/中性/负面，通过对多标签数据集进行微调预测愤怒、快乐、悲伤等。\n\n\
  ## 第 18 章：基于 RAG 的文档搜索\n\n### 18.1 使用 LLM 实现文档检索系统\n数字内容的爆炸式增长使得高效的文档检索成为必要。传统的搜索引擎依赖关键词方法，往往无法捕捉查询背后的真实意图。检索增强生成（RAG）利用大语言模型（LLMs）和向量搜索，在生成响应之前检索相关上下文来增强文档搜索。\n\
  \n在本章中，我们将：\n\n1. 理解 `RAG` 的基础及其如何改进传统搜索。\n2. 使用嵌入和向量数据库构建文档检索系统。\n3. 集成 `LLMs`\
  \ 以生成上下文响应。\n4. 通过索引技术和混合检索优化性能。\n5. 使用现代框架部署可扩展的 RAG 流水线。\n\n在本章结束时，你将拥有一个功能齐全的基于\
  \ RAG 的文档检索系统，能够从大型文本数据集中高效搜索并生成响应。\n\n## 1. 检索增强生成 (RAG) 的基础\n\n### 1.1 什么是 RAG？\n\
  检索增强生成 (`RAG`）是一种混合 NLP 技术，通过将检索到的相关文档纳入生成过程来改进 `LLM` 的响应。\n\n`RAG` 的关键组件：\n\n1.\
  \ 检索 – 根据查询从数据库中找到相关文档。\n2. 增强 – 从检索到的文档中提取有用上下文。\n3. 生成 – 使用 `LLM` 根据检索到的信息产生良好的响应。\n\
  \n### 1.2 为什么使用 RAG 进行文档搜索？\n\n\n\n\n\n传统的搜索方法如 `TF-IDF` 和 `BM25` 依赖于词法匹配，往往会忽略语义含义。`RAG`\
  \ 通过以下方式优于这些方法：\n\n- 理解上下文：使用 `embeddings` 进行语义检索。\n- 减少幻觉：`LLMs` 依赖于真实世界的信息而非生成猜测。\n\
  - 提高准确性：提供更相关性且有事实依据的答案。\n\n## 1.3 RAG 是如何工作的？\n\n1. 使用预训练模型（例如 `BERT`、`OpenAI`\
  \ 的 `text-embedding-ada-002`）将文档转换为`vector embeddings`（向量嵌入）。\n2. 将 `embeddings`\
  \ 存储在`vector database`中（例如 `FAISS`、`Pinecone`、`Chroma`）。\n3. 根据用户查询检索最相关的文档。\n4.\
  \ 将检索到的文档输入 `LLM` 生成响应。\n\n## 2. 构建基于 RAG 的检索系统\n\n### 2.1 安装依赖\n\n```bash\npip\
  \ install transformers torch sentence-transformers faiss-cpu langchain chromadb\
  \ fastapi uvicorn\n```\n\n### 2.2 加载预训练嵌入模型\n\n我们使用 `sentence-transformers` 为文档生成稠密\
  \ `vector embeddings`。\n\n```python\nfrom sentence_transformers import SentenceTransformer\n\
  \n# 加载嵌入模型\nembedding_model = SentenceTransformer(\"all-MiniLM-L6-v2\")\n\ndef get_embedding(text):\n\
  \    \"\"\"为给定文本生成向量嵌入\"\"\"\n    return embedding_model.encode(text, convert_to_tensor=True)\n\
  ```\n\n## 3. 在向量数据库中索引文档\n\n### 3.1 选择向量存储\n\n用于高效相似性搜索的流行向量数据库：\n\n- `FAISS` –\
  \ 本地使用快速且高效。\n- `ChromaDB` – 简单、轻量级且可扩展。\n- `Pinecone` – 云端可扩展的解决方案。\n\n我们将使用 `FAISS`\
  \ 进行本地开发。\n\n### 3.2 创建并索引文档存储\n\n```python\nimport faiss\nimport numpy as np\n\n\
  class DocumentStore:\n    def __init__(self, embedding_dim=384):\n        \"\"\"\
  初始化用于文档检索的 FAISS 索引\"\"\"\n        self.index = faiss.IndexFlatL2(embedding_dim)\n\
  \        self.documents = []\n\n    def add_documents(self, docs):\n        \"\"\
  \"通过将文档转换为向量嵌入来索引文档\"\"\"\n        embeddings = np.array([get_embedding(doc) for\
  \ doc in docs])\n        self.index.add(embeddings)\n        self.documents.extend(docs)\n\
  \n    def search(self, query, top_k=3):\n        \"\"\"为给定查询检索前 k 个相似文档\"\"\"\n\
  \        query_embedding = get_embedding(query).numpy().reshape(1, -1)\n       \
  \ distances, indices = self.index.search(query_embedding, top_k)\n        return\
  \ [self.documents[idx] for idx in indices[0]]\n\n##### 使用示例\ndocs = [\"AI is transforming\
  \ industries.\", \"Climate change is a global challenge.\", \"Python is a popular\
  \ programming language.\"]\ndoc_store = DocumentStore()\ndoc_store.add_documents(docs)\n\
  query = \"Tell me about AI\"\nresults = doc_store.search(query)\nprint(\"Retrieved\
  \ Documents:\", results)\n```\n\n**解释：**\n\n- 文档被转换为 `embeddings` 并存储在 `FAISS` 中。\n\
  - 查询被转换为 `embeddings` 并与存储的文档进行匹配。\n- `FAISS` 返回与给定查询最相似的文档。\n\n## 4. 集成 LLM 用于响应生成\n\
  \n### 4.1 使用 OpenAI 的 GPT-4 进行响应增强\n\n```python\nimport openai\nopenai.api_key =\
  \ \"your_openai_api_key\"\n\ndef generate_response(query):\n    \"\"\"使用 LLM 检索相关文档并生成响应\"\
  \"\"\n    retrieved_docs = doc_store.search(query)\n    context = \" \".join(retrieved_docs)\n\
  \    prompt = f\"Context: {context}\\n\\nQuestion: {query}\\n\\nAnswer:\"\n    response\
  \ = openai.ChatCompletion.create(\n        model=\"gpt-4\",\n        messages=[{\"\
  role\": \"system\", \"content\": \"You are an AI assistant.\"},\n              \
  \    {\"role\": \"user\", \"content\": prompt}]\n    )\n    return response[\"choices\"\
  ][0][\"message\"][\"content\"]\n\n##### 使用示例\nquery = \"How is AI impacting industries?\"\
  \nprint(\"Response:\", generate_response(query))\n```\n\n## 5. 优化 RAG 的可扩展性和性能\n\
