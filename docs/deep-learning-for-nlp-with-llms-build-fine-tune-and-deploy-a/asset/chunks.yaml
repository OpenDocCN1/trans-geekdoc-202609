    \n# 加载 API key\nload_dotenv()\nopenai.api_key = os.getenv(\"OPENAI_API_KEY\")\n\
    \napp = Flask(__name__)\n```\n\n***\n\n### 2.3 实现感知感知对话\n\n无状态聊天机器人不会保留之前的消息，因此我们实现了上下文管理：\n\
    \n```python\nconversation_history = {}\n\ndef generate_response(session_id, user_input):\n\
    \    # 为每个用户会话维护独立的历史\n    if session_id not in conversation_history:\n      \
