- raw: '●        Reshaping for multi-heads: Inputs are split into multiple heads.


    ●        Scaled dot-product attention: Attention scores are computed, scaled,
    and normalized.


    ●        Final projection: Outputs from all heads are concatenated and linearly
    transformed.


    * * *


    5.2.3 Positional Encoding: Preserving Word Order


    Why is Positional Encoding Needed?


    Unlike RNNs, which process words sequentially, Transformers analyze entire sequences
    in parallel. This means they lack inherent word-order awareness, requiring an
    explicit mechanism to inject position information.


    Mathematical Definition


    Positional encodings are computed using sine and cosine functions:


    PE(pos,2i)​=sin(pos /100002i/dmodel​ ​)


    PE(pos,2i+1)​=cos( pos /100002i/dmodel ​)


    where:


    ●        pos is the token position in the sequence.


    ●        d\_modeld​ is the embedding dimension.


    Why Sinusoidal Functions?


    ●        Fixed across different sequences (not learned parameters).


    ●        Encodes relative positioning, allowing the model to generalize to different
    sequence lengths.


    * * *


    5.2.4 Implementing Positional Encoding in PyTorch


    python


    import torch


    import torch.nn as nn


    import math


    class PositionalEncoding(nn.Module):


    def \_\_init\_\_(self, embed\_dim, max\_length=5000):


    super().\_\_init\_\_()


    position = torch.arange(max\_length).unsqueeze(1)


    div\_term = torch.exp(torch.arange(0, embed\_dim, 2) \* (-math.log(10000.0) /
    embed\_dim))


    pe = torch.zeros(max\_length, embed\_dim)


    pe\[:, 0::2\] = torch.sin(position \* div\_term)


    pe\[:, 1::2\] = torch.cos(position \* div\_term)


    self.pe = pe.unsqueeze(0)


    def forward(self, x):


    return x + self.pe\[:, :x.size(1), :\].to(x.device)


    \# Testing positional encoding


    embed\_dim = 512


    pos\_encoding = PositionalEncoding(embed\_dim)


    sample\_input = torch.rand(32, 10, embed\_dim)


    output = pos\_encoding(sample\_input)


    print(output.shape)  # Expected: (32, 10, 512)


    * * *


    ### 5.3 Why Transformers Outperformed RNNs and CNNs


    The Transformer architecture has revolutionized natural language processing (NLP),
    surpassing traditional recurrent neural networks (RNNs) and convolutional neural
    networks (CNNs) in both efficiency and performance. Unlike RNNs, which process
    sequences step by step, Transformers leverage self-attention mechanisms to process
    entire sequences in parallel. Unlike CNNs, which rely on fixed-size kernels for
    feature extraction, Transformers capture long-range dependencies dynamically.


    * * *


    5.3.1 The Limitations of RNNs in NLP


    Sequential Processing and Vanishing Gradients


    Recurrent Neural Networks (RNNs) process sequences one step at a time, maintaining
    hidden states that store past information. While effective for short sequences,
    RNNs struggle with:


    1.  Sequential bottlenecks: Processing tokens one by one prevents parallelism,
    making training slow.


    2.  Vanishing gradients: During backpropagation, gradients diminish exponentially,
    limiting long-term memory.


    3.  Exploding gradients: In deep RNNs, large gradients cause unstable weight updates,
    requiring gradient clipping.


    4.  Short-term memory bias: RNNs favor recent tokens over distant ones, losing
    long-range dependencies.


    Mathematically, the vanishing gradient problem arises from repeated multiplications
    of the Jacobian matrix:


    ∂W/∂L​=t\=T∏t=1 ​∂ht/​∂ht\-1​​


    where hth\_tht​ is the hidden state. If the gradient is consistently < 1, it shrinks
    exponentially.


    LSTMs and GRUs: Partial Solutions


    Long Short-Term Memory (LSTM) networks and Gated Recurrent Units (GRUs) mitigate
    vanishing gradients by introducing gating mechanisms:


    ●        Forget gate: Controls which information to retain/discard.


    ●        Input gate: Regulates updates to the memory cell.


    ●        Output gate: Controls how much of the memory cell contributes to the
    output.


    While LSTMs improve upon standard RNNs, they remain sequential, limiting scalability
    for large datasets.


    * * *


    5.3.2 Why CNNs Fall Short in NLP


    Fixed Receptive Fields


    CNNs apply convolutional filters to extract features from input sequences. While
    CNNs excel in tasks like image recognition, they have two major limitations in
    NLP:


    1.  Fixed receptive fields: Kernels capture local patterns but struggle with long-range
    dependencies.


    2.  Depth increases complexity: Stacking convolutional layers helps extend context,
    but this increases computational cost.


    Mathematical Formulation of Convolution in NLP


    A 1D convolution operation for text can be defined as:


    yi​= k∑ j=0​ wj​⋅xi+j​


    where:


    ●        x is the input sequence.


    ●        w is the kernel.


    ●        k is the kernel size.


    Although CNNs capture local n-gram patterns, they struggle with long-distance
    relationships unless deep layers are used, which increases computation.


    * * *


    5.3.3 Why Transformers Outperform RNNs and CNNs


    1\. Parallelization vs. Sequential Processing


    Unlike RNNs, which process text token by token, Transformers analyze entire sequences
    simultaneously using self-attention. This allows massive parallelism, reducing
    training time significantly.


    | Model || Parallelizable? || Memory Efficient? || Captures Long Dependencies?
    |


    | --- | --- | --- | --- |


    | RNN || No || No || Poor |


    | LSTM/GRU || No || Moderate || Improved |


    | CNN || Yes || Yes || Limited |


    | Transformer || Yes || Yes || Excellent |


    2\. Self-Attention for Long-Range Dependencies


    Self-attention allows every token to attend to all others, solving the long-distance
    dependency problem.


    Attention(Q,K,V)=![](image_rsrc7M4.jpg)


    This eliminates forgetting issues found in RNNs and CNNs.


    3\. Memory Efficiency and Training Stability


    ●        No recurrent connections: Unlike RNNs, Transformers do not propagate
    hidden states, avoiding gradient instability.


    ●        Lower memory footprint: CNNs require deep layers for context, while Transformers
    capture it in fewer layers.


    4\. Scalability to Large Datasets


    Pretraining on massive corpora (e.g., BERT, GPT) is feasible only because Transformers
    process sequences in parallel.


    * * *


    5.3.4 Benchmarking Performance: RNN vs. CNN vs. Transformer


    Empirical Performance Comparison


    Dataset: IMDB Sentiment Analysis


    To compare RNNs, CNNs, and Transformers, we train models on the IMDB movie review
    sentiment dataset.


    python


    import torch


    import torch.nn as nn


    from transformers import BertTokenizer, BertForSequenceClassification


    \# Load pre-trained BERT model


    tokenizer = BertTokenizer.from\_pretrained("bert-base-uncased")


    model = BertForSequenceClassification.from\_pretrained("bert-base-uncased")


    \# Sample text


    text = \["The movie was absolutely fantastic!"\]


    \# Tokenize and process


    inputs = tokenizer(text, return\_tensors="pt", padding=True, truncation=True,
    max\_length=512)


    outputs = model(\*\*inputs)


    print(outputs.logits)  # Sentiment classification output


    Observations


    ●        BERT (Transformer-based) achieves higher accuracy with fewer training
    steps than RNNs/CNNs.


    ●        Training speed: Transformers train significantly faster due to parallelism.


    ●        Memory usage: CNNs require deeper architectures to match Transformer
    accuracy.


    | Model || Training Time || Accuracy || Memory Usage |


    | --- | --- | --- | --- |


    | RNN || Slow || Low || High |


    | LSTM || Medium || Moderate || High |


    | CNN || Fast || Moderate || Moderate |


    | Transformer || Very Fast || High || Efficient |


    * * *


    5.3.5 Real-World Case Studies


    1\. BERT: Bidirectional Encoding for NLP


    ●        Uses bidirectional self-attention for deeper language understanding.


    ●        Outperforms RNNs and CNNs in tasks like sentiment analysis, text classification,
    and named entity recognition.


    2\. GPT: Large-Scale Language Generation


    ●        Trained on massive datasets due to efficient Transformer architecture.


    ●        Generates human-like text far beyond RNN capabilities.


    3\. T5: Unified NLP Model


    ●        Achieves state-of-the-art performance on translation, summarization,
    and question-answering tasks.


    * * *


