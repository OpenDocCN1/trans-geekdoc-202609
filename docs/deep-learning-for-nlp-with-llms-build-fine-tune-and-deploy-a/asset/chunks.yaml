    \ in RNNs and CNNs.\n\n3. Memory Efficiency and Training Stability\n\n- No recurrent\
    \ connections: Unlike RNNs, Transformers do not propagate hidden states, avoiding\
    \ gradient instability.\n- Lower memory footprint: CNNs require deep layers for\
    \ context, while Transformers capture it in fewer layers.\n\n4. Scalability to\
    \ Large Datasets\n\nPretraining on massive corpora (e.g., `BERT`, `GPT`) is feasible\
    \ only because Transformers process sequences in parallel.\n\n### 5.3.4 Benchmarking\
    \ Performance: RNN vs. CNN vs. Transformer\n\n##### Empirical Performance Comparison\n\
    \nDataset: IMDB Sentiment Analysis\n\nTo compare RNNs, CNNs, and Transformers,\
    \ we train models on the IMDB movie review sentiment dataset.\n\n```python\nimport\
    \ torch\nimport torch.nn as nn\nfrom transformers import BertTokenizer, BertForSequenceClassification\n\
    \n# Load pre-trained BERT model\ntokenizer = BertTokenizer.from_pretrained(\"\
    bert-base-uncased\")\nmodel = BertForSequenceClassification.from_pretrained(\"\
    bert-base-uncased\")\n\n# Sample text\ntext = [\"The movie was absolutely fantastic!\"\
    ]\n\n# Tokenize and process\ninputs = tokenizer(text, return_tensors=\"pt\", padding=True,\
    \ truncation=True, max_length=512)\noutputs = model(**inputs)\nprint(outputs.logits)\
    \  # Sentiment classification output\n```\n\n##### Observations\n\n- `BERT` (Transformer-based)\
    \ achieves higher accuracy with fewer training steps than RNNs/CNNs.\n- Training\
    \ speed: Transformers train significantly faster due to parallelism.\n- Memory\
    \ usage: CNNs require deeper architectures to match Transformer accuracy.\n\n\
    | Model | Training Time | Accuracy | Memory Usage |\n| :--- | :--- | :--- | :---\
    \ |\n| RNN | Slow | Low | High |\n| LSTM | Medium | Moderate | High |\n| CNN |\
    \ Fast | Moderate | Moderate |\n| Transformer | Very Fast | High | Efficient |\n\
    \n### 5.3.5 Real-World Case Studies\n\n1. BERT: Bidirectional Encoding for NLP\n\
    \n- Uses bidirectional self-attention for deeper language understanding.\n- Outperforms\
    \ RNNs and CNNs in tasks like sentiment analysis, text classification, and named\
    \ entity recognition.\n\n2. GPT: Large-Scale Language Generation\n\n- Trained\
    \ on massive datasets due to efficient Transformer architecture.\n- Generates\
    \ human-like text far beyond RNN capabilities.\n\n3. T5: Unified NLP Model\n\n\
    - Achieves state-of-the-art performance on translation, summarization, and question-answering\
    \ tasks.\n"
  trans: "\n\n-   多头重塑：将输入切分为多个“头”。\n-   缩放点积注意力：计算注意力分数，并对其进行缩放和归一化。\n-   最终投影：将所有头的输出拼接在一起，并进行线性变换。\n\
    \n### 5.2.3 位置编码：保留词序\n\n#### 为什么需要位置编码？\n\n与按顺序处理单词的 RNN 不同，Transformer 并行分析整个序列。这意味着它们缺乏与生俱的词序感知能力，因此需要一种显式机制来注入位置信息。\n\
    \n#### 数学定义\n\n位置编码使用正弦和余弦函数计算：\n\n`PE(pos,2i)=sin(pos /10000^(2i/dmodel_))`\n\
    `PE(pos,2i+1)=cos( pos /10000^(2i/dmodel_ )`\n\n其中：\n\n-   `pos` 是序列中 token 的位置。\n\
    -   `d_model` 是嵌入维度。\n\n#### 为什么选择正弦函数？\n\n-   在不同序列之间是固定的（不是可学习的参数）。\n-   编码相对位置，允许模型泛化到不同的序列长度。\n\
    \n### 5.2.4 在 PyTorch 中实现位置编码\n\n```python\nimport torch\nimport torch.nn as nn\n\
    import math\n\nclass PositionalEncoding(nn.Module):\n    def __init__(self, embed_dim,\
    \ max_length=5000):\n        super().__init__()()\n        position = torch.arange(max_length).unsqueeze(1)\n\
    \        div_term = torch.exp(torch.arange(0, embed_dim, 2) * (-math.log(10000.0)\
    \ / embed_dim))\n        pe = torch.zeros(max_length, embed_dim)\n        pe[:,\
    \ 0::2] = torch.sin(position * div_term)\n        pe[:, 1::2] = torch.cos(position\
    \ * div_term)\n        self.pe = pe.unsqueeze(0)\n\n    def forward(self, x):\n\
    \        return x + self.pe[:, :x.size(1), :].to(x.device)\n\n# 测试位置编码\nembed_dim\
    \ = 512\npos_encoding = PositionalEncoding(embed_dim)\nsample_input = torch.rand(32,\
    \ 10, embed_dim)\noutput = pos_encoding(sample_input)\nprint(output.shape)  #\
    \ Expected: (32, 10, 512)\n```\n\n### 5.3 为什么 Transformer 优于 RNN 和 CNN\n\nTransformer\
    \ 架构彻底改变了自然语言处理 (NLP)，在效率和性能上超越了传统的循环神经网络 (RNN) 和卷积神经网络 (CNN)。与逐步处理序列的 RNN 不同，Transformer\
    \ 利用自注意力机制并行处理整个序列。与依赖固定大小内核提取特征的 CNN 不同，Transformer 动态地捕捉长程依赖。\n\n#### 5.3.1\
    \ RNN 在 NLP 中的局限性\n\n##### 顺序化处理与梯度消失\n\n循环神经网络 (RNN) 一步处理序列，维护存储过去信息的隐藏状态。虽然对短序列有效，但\
    \ RNN 在以下方面表现不佳：\n\n1.  顺序化瓶颈：逐个处理 token 防止了并行化，导致训练速度缓慢。\n2.  梯度消失：在反向传播过程中，梯度呈指数级衰减，限制了长期记忆。\n\
    3.  梯度爆炸：在深层 RNN 中，巨大的梯度会导致更新不稳定，需要梯度裁剪。\n4.  短期记忆：RNN 偏向最近的 token 而非远处的 token，丢失了长程依赖。\n\
    \n从数学上看，梯度消失问题源于雅可比矩阵的重复相乘：\n`∂W/∂L=∏t=1ᵀ ∂ht/∂ht-1`\n其中 `h_t` 是隐藏状态。如果梯度持续小于\
    \ 1，它就会呈指数级收缩。\n\n##### LSTM 和 GRU：部分解决方案\n\n长短期记忆 (LSTM) 网络和门控循环单元 (GRU) 通过引入门机制缓解了梯度消失问题：\n\
    \n-   遗忘门：控制保留/丢弃哪些信息。\n-   输入门：调节内存单元的更新。\n-   输出门：控制内存单元有多少部分贡献于输出。虽然 LSTM 改进了\
    \ RNN，但它们仍然是顺序化的，限制了在大规模数据集上的可扩展性。\n\n#### 5.3.2 为什么 CNN 在 NLP 中表现不佳\n\n#####\
    \ 固定感受野\n\nCNN 应用卷积过滤器从输入序列中提取特征。虽然 CNN 在图像识别方面表现出色，但在 NLP 中有其主要局限性：\n\n1.  固定感受野：内核捕捉局部模式，但难以处理长程依赖。\n\
    2.  深度增加复杂度：堆叠卷积层有助于扩展上下文，但会增加计算量。\n\n##### NLP 中卷积的数学公式\n\n文本的 1D 卷积操作可以定义为：\n\
    `yi=∑j=0k wj⋅xi+j`\n其中：\n\n-   `x` 是输入序列。\n-   `w` 是内核。\n-   `k` 是内核大小。\n\n尽管\
    \ CNN 能捕捉局部的 n-gram 模式，但除非使用深层，否则它们难以处理远距离关系，这会增加计算量。\n\n#### 5.3.3 为什么 Transformer\
    \ 优于 RNN 和 CNN\n\n1.  并行化 vs 顺序处理\n\n与逐个 token 处理文本的 RNN 不同，Transformer 使用自注意力同时分析整个序列。这允许大规模的并行化，缩短了训练时间。\n\
    \n| 模型 | 可并行化？ | 内存高效？ | 能捕捉长程依赖？ |\n| :--- | :--- | :--- | :--- |\n| RNN | 否\
    \ | 否 | 差 |\n| LSTM/GRU | 否 | 中等 | 改进 |\n| CNN | 是 | 是 | 一般 |\n| Transformer |\
    \ 是 | 是 | 优秀 |\n\n2.  用于长程依赖的自注意力\n\n自注意力允许每个 token 关注所有其他 token，解决了长距离问题。\n`Attention(Q,K,V)`\n\
    消除了 RNN 中的遗忘问题。\n\n3.  内存效率与训练稳定性\n\n-   无循环连接：不像 RNN，Transformer 不传播隐藏状态。\n-\
    \   较低的内存占用：CNN 需要更多的层来增加上下文，而 Transformer 在较少层中即可。\n\n4.  大规模数据集的可扩展性\n\n在海量语料（如\
    \ `BERT`、`GPT`）上进行预训练之所以可行，是因为 Transformer 是并行的。\n\n"
