  fmt: "\nTraditional search methods like `TF-IDF` and `BM25` rely on lexical matching,\
    \ often missing semantic meaning. `RAG` outperforms these methods by:\n\n- Understanding\
    \ Context: Uses `embeddings` for semantic retrieval.\n- Reducing Hallucination:\
    \ `LLMs` rely on real-world information rather than generating guesses.\n- Enhancing\
    \ Accuracy: Provides more relevant and factually grounded answers.\n\n## 1.3 How\
    \ Does RAG Work?\n\n1. Convert documents into `vector embeddings` using a pre-trained\
    \ model (e.g., `BERT`, `OpenAI`’s text-embedding-ada-002`).\n2. Store `embeddings`\
    \ in a `vector database` (e.g., `FAISS`, `Pinecone`, `Chroma`).\n3. Retrieve the\
    \ most relevant documents based on user queries.\n4. Feed retrieved documents\
    \ into an `LLM` for response generation.\n\n## 2. Setting Up the RAG-Based Retrieval\
    \ System\n\n### 2.1 Installing Dependencies\n\n```bash\npip install transformers\
    \ torch sentence-transformers faiss-cpu langchain chromadb fastapi uvicorn\n```\n\
    \n### 2.2 Loading Pretrained Embedding Model\n\nWe use `sentence-transformers`\
    \ to generate dense `vector embeddings` for documents.\n\n```python\nfrom sentence_transformers\
    \ import SentenceTransformer\n\n# Load embedding model\nembedding_model = SentenceTransformer(\"\
    all-MiniLM-L6-v2\")\n\ndef get_embedding(text):\n    \"\"\"Generates vector embedding\
    \ for a given text.\"\"\"\n    return embedding_model.encode(text, convert_to_tensor=True)\n\
    ```\n\n## 3. Indexing Documents in a Vector Database\n\n### 3.1 Choosing a Vector\
    \ Store\n\nPopular vector databases for efficient similarity search:\n\n- `FAISS`\
    \ – Fast and efficient for local use.\n- `ChromaDB` – Simple, lightweight, and\
    \ scalable.\n- `Pinecone` – Cloud-based, scalable solution.\n\nWe will use `FAISS`\
    \ for local development.\n\n### 3.2 Creating and Indexing a Document Store\n\n\
    ```python\nimport faiss\nimport numpy as np\n\nclass DocumentStore:\n    def __init__(self,\
    \ embedding_dim=384):\n        \"\"\"Initializes a FAISS index for document retrieval.\"\
    \"\"\n        self.index = faiss.IndexFlatL2(embedding_dim)\n        self.documents\
    \ = []\n\n    def add_documents(self, docs):\n        \"\"\"Indexes documents\
    \ by converting them into vector embeddings.\"\"\"\n        embeddings = np.array([get_embedding(doc)\
    \ for doc in docs])\n        self.index.add(embeddings)\n        self.documents.extend(docs)\n\
    \n    def search(self, query, top_k=3):\n        \"\"\"Retrieves top-k similar\
    \ documents for a given query.\"\"\"\n        query_embedding = get_embedding(query).numpy().reshape(1,\
    \ -1)\n        distances, indices = self.index.search(query_embedding, top_k)\n\
    \        return [self.documents[idx] for idx in indices[0]]\n\n# Example usage\n\
    docs = [\"AI is transforming industries.\", \"Climate change is a global challenge.\"\
    , \"Python is a popular programming language.\"]\ndoc_store = DocumentStore()\n\
    doc_store.add_documents(docs)\nquery = \"Tell me about AI\"\nresults = doc_store.search(query)\n\
    print(\"Retrieved Documents:\", results)\n```\n\n**Explanation:**\n\n- Documents\
    \ are converted into `embeddings` and stored in `FAISS`.\n- Queries are transformed\
    \ into `embeddings` and matched against stored documents.\n- `FAISS` returns the\
    \ most similar documents for the given query.\n\n## 4. Integrating LLM for Response\
    \ Generation\n\n### 4.1 Using OpenAI’s GPT-4 for Response Augmentation\n\n```python\n\
    import openai\nopenai.api_key = \"your_openai_api_key\"\n\ndef generate_response(query):\n\
