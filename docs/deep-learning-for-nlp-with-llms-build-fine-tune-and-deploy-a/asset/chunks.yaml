    3. 根据用户查询检索最相关的文档。\n4. 将检索到的文档输入 `LLM` 生成响应。\n\n## 2. 构建基于 RAG 的检索系统\n\n### 2.1\
    \ 安装依赖\n\n```bash\npip install transformers torch sentence-transformers faiss-cpu\
    \ langchain chromadb fastapi uvicorn\n```\n\n### 2.2 加载预训练嵌入模型\n\n我们使用 `sentence-transformers`\
