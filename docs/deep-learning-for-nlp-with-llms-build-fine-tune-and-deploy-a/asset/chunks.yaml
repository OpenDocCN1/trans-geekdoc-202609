  trans: "\n\n## 8.2.5 将情感分析工具作为 API 部署\n\n一旦模型完成微调，将其部署为 REST API 以实现实时推理。\n\n###\
    \ 使用 FastAPI 的部署示例\n\n```python\nfrom fastapi import FastAPI\nfrom transformers\
    \ import pipeline\n\napp = FastAPI()\n\n# 加载微调后的模型\nsentiment_pipeline = pipeline(\"\
    text-classification\", model=\"bert_sentiment\")\n\n@app.post(\"/analyze/\")\n\
    def analyze_sentiment(text: str):\n    \"\"\"\n    分析输入文本的情感。\n    \"\"\"\n  \
    \  result = sentiment_pipeline(text)\n    return {\"sentiment\": result[0][\"\
    label\"], \"confidence\": result[0][\"score\"]}\n\n# 使用：uvicorn filename:app --reload\
    \  API\n```\n\n### 扩展性考虑因素\n\n- 使用 `GPU` 推理进行高吞吐量分类。\n- 通过云服务（`AWS Lambda`, `GCP`,\
    \ `Azure`）部署。\n\n***\n\n## 8.2.6 为你的用例选择合适的方法\n\n| 方法 | 所需数据 | 准确率 | 成本 | 用例 |\n\
    | --- | --- | --- | --- | --- |\n| 零样本 (Zero-Shot) | 无 | 中 | 高 | 快速原型 |\n| 少样本\
    \ (Few-Shot) | 少量示例 | 较高 | 中 | 提高泛化能力 |\n| 微调 (Fine-Tuning) | 标记数据 | 最高 | 低（训练后）\
    \ | 生产系统 |\n\n***\n\n## 第 9 章：用于机器人和对话 AI 的 LLM\n\n***\n\n### 9.1 提示工程与微调策略\n\n\
    大语言模型（LLMs）通过实现机器人、内容生成和自动推理等应用，彻底改变了自然语言处理（NLP）。然而，为了最大化利用它们的潜力，开发者必须掌握提示工程和微调策略。\n\
    \n提示工程通过精心设计输入来优化与 LLM 的交互，而微调则涉及在特定领域的数据上训练模型以提高其性能。这两种技术对于构建可靠、高效且感知上下文的对话式\
    \ AI 系统都至关重要。\n\n本章将深入探讨这些策略，涵盖核心概念、最佳实践、高级技术和实操实现。\n\n***\n\n### 1. 理解提示工程\n\n\
    #### 1.1 什么是提示工程？\n\n提示工程是一种设计面向 LLM 输入的实践，旨在优化模型的响应质量。由于 LLM 基于概率而非显式理解来生成文本，因此提示词的结构方式会显著影响输出。\n\
    \n良好的提示词可以：\n\n- 提高准确性和相关性。\n- 减少幻觉和偏见。\n- 优化响应长度和风格。\n\n在处理如 `OpenAI’s` GPT 模型等闭源\
    \ API 时，提示工程特别有用，因为此时微调可能不是一个选项。\n\n#### 1.2 设计良好的的提示词的组件\n\n一个好的提示词由几个关键元素组成：\n\
    \n1. 指令清晰：对任务要明确。\n2. 上下文提供：提供相关细节以引导响应。\n3. 示例与约束：包含示例输出或格式要求。\n4. 输出规范：定义长度、语气或风格限制。\n\
    \n##### 示例 1：糟糕 vs. 设计良好的的提示词\n\n```python\n# 糟糕的提示词\nprompt = \"解释气候变化。\"\n\n\
    # 结构良好的提示词\nprompt = \"\"\"\n用 12 岁小孩能听懂的简单语言解释气候变化。\n使用项目符号并保持在 100 字以内。\n\"\"\
    \"\n```\n\n关键改进点：\n\n- 定义了受众。\n- 指定了格式（项目符号）。\n- 限制了响应长度。\n\n***\n\n### 2. 高级提示工程技术\n\
    \n#### 2.1 提示工程中的零样本和少样本学习\n\nLLM 根据是否拥有先验示例以不同的方式处理提示词：\n\n- 零样本学习：模型在没有任何示例的情况下执行任务。\n\
    - 少样本学习：模型通过查看几个特定任务的示例来改进。\n\n示例：少样本提示\n\n```python\nprompt = \"\"\"\n将以下英语短语翻译成法语：\n\
    1. Hello → Bonjour\n2. How are you? → Comment ça va?\n3. See you later →\n\"\"\
    \"\n```\n\n模型根据给定的模式推断预期的翻译。\n\n#### 2.2 思维链 (CoT) 提示\n\n思维链（`CoT`）提示通过显式指令模型拆分其思考过程来增强推理。\n\
    \n示例：带有 CoT 提示的算术题\n\n```python\nprompt = \"\"\"\n解决：一个农民有 10 个苹果。他又买了 5 个，然后送掉了\
    \ 3 个。他现在几个苹果？\n在提供最终答案之前，请分步思考。\n\"\"\"\n```\n\nLLM 将通过结构化的拆解而非直接给出数字来响应。\n\n\
    ### 3. LLM 的微调策略\n\n#### 3.1 什么是微调？\n\n微调涉及在特定领域数据集上训练 LLM，以提高其对给定任务的准确性。与提示工程（在模型现有能力内工作）不同，微调通过更新模型参数来使其专业化。\n\
    \n在以下情况下，微调是有益的：\n\n- 需要特定领域的知识。\n- 在特定任务上需要极高的准确率。\n- 输出格式的一致性至关重要。\n\n#### 3.2\
    \ 微调 LLM 的步骤\n\n1. **数据集准备**：收集与任务相关的高质量数据。\n2. **预处理**：清洗并对数据进行标记。\n3. **在预训练模型上训练**：通过仅更新相关层使用迁移学习。\n\
    4. **评估与部署**：针对基准性能对微调模型进行测试。\n\n***\n\n### 4. 实操：使用 OpenAI API 微调 GPT 模型\n\n\
    为了演示微调，我们将在客户交互数据集上训练 OpenAI GPT 模型。\n\n#### 4.1 准备数据集\n\n微调 OpenAI 需要一个结构化的 JSON\
    \ 文件，每个条目包含：\n\n- `prompt`：输入消息。\n- `completion`：理想响应。\n\n示例数据集 (JSON)\n\n```json\n\
    [\n{\"prompt\": \"客户：我的网络很慢。\", \"completion\": \"代理：尝试重启您的路由器。\"},\n{\"prompt\"\
    : \"客户：我如何重置密码？\", \"completion\": \"代理：访问帐户设置并点击‘重置密码’。\"}\n]\n```\n\n#### 4.2\
    \ 上传并微调\n\n使用 OpenAI\n\n```python\nimport openai\n\n# 上传数据集\nresponse = openai.File.create(\n\
    \  file=open(\"customer_support.json\", \"rb\"),\n  purpose='fine-tune'\n)\n\n\
    # 微调模型\nfine_tune_response = openai.FineTune.create(\n  training_file=response[\"\
    id\"],\n  model=\"davinci\"\n)\n```\n\n#### 4.3 测试微调后的模型\n\n```python\nresponse\
    \ = openai.Completion.create(\n  model=\"davinci:ft-yourmodelid\",\n  prompt=\"\
    客户：我如何更新我的账单信息？\n  max_tokens=50\n)\n\nprint(response.choices[0].text.strip())\n\
    ```\n\n微调模型生成的客户支持响应比基础 GPT 模型更准确。\n\n***\n\n### 5. 提示工程与微调的对比\n\n| 特性 | 提示工程\
    \ | 微调 |\n| --- | --- | --- |\n| 定制化 | 中 | 高 |\n| 数据需求 | 无或极少 | 需要大型数据集 |\n| 灵活性\
    \ | 快速编辑 | 需要重新训练 |\n| 成本 | API 成本较低 | 计算成本较高 |\n\n对于大多数应用，结合提示工程和微调可以获得最佳结果。开发者在考虑微调之前，应该从优化提示开始，因为这样更有成本效益且所需的计算资源较少。\n\
    \n***\n\n"
