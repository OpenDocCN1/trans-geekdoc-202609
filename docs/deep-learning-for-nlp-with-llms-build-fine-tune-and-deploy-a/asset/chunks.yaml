  trans: "\n\n# 5. 部署用于扩展的真实世界应用的情感分析 API。\n\n在本章结束时，读者将拥有一个功能齐全的情感分析流水线，能够实时分析社交媒体数据。\n\
    \n## 1. 情感分析基础\n\n### 1.1 什么是情感分析？\n情感分析（或观点挖掘）是一项 NLP 技术，用于确定文本的情感基调。它通常被用于将文本分类为：\n\
    \n- 积极（Positive）\n- 负面（Negative）\n- 中性（Neutral）\n\n### 1.2 情感分析的应用\n1. 品牌监控 –\
    \ 跟踪用户对品牌的看法。\n2. 政治分析 – 分析公众对政策的意见。\n3. 股票市场预测 – 利用情感进行财务预测。\n4. 客户支持 – 在反馈中检测客户的不满。\n\
    \n## 2. 理解用于情感分析的 Transformers\n\n### 2.1 为什么使用 Transformers？\n传统的 NLP 模型依赖于词袋（BoW）或\
    \ TF-IDF，这些模型缺乏上下文理解能力。由自注意力机制（self-attention）驱动的 Transformer 通过捕捉词与词之间的上下文关系优于以往的方法。\n\
    \n主要优势：\n\n- 上下文感知 – 捕捉不同语境下的含义。\n- 在大型数据集上预训练 – 缩短训练时间并提高准确性。\n- 可扩展性 – 可以高效处理数百万条推文。\n\
    \n### 2.2 预训练 Transformer 模型概述\n\n| 模型 |  |\n| --- | --- |\n| BERT (来自 Transformer\
    \ 的双向编码表示) | 在双向文本上训练的上下文感知模型。 |\n| RoBERTa (鲁棒优化的 BERT) | 使用更多训练数据优化的 BERT。 |\n\
    | DistilBERT | BERT 的轻量级版本，更快但准确性略低。 |\n| Twitter-RoBERTa | 针对 Twitter 数据专门微调，用于社交媒体情感分析。\
    \ |\n\n对于社交媒体情感分析，`Twitter-RoBERTa` 是最有效的，因为它在 1.6 亿条推文中进行过训练。\n\n## 3. 实现 Twitter\
    \ 情感分析\n\n### 3.1 安装依赖项\n```bash\npip install transformers torch datasets tweepy\
    \ fastapi uvicorn python-dotenv\n```\n\n### 3.2 设置 Twitter API 访问\n创建一个 `.env`\
    \ 文件来存储凭据：\n\n```ini\nTWITTER_BEARER_TOKEN=your_twitter_api_token\n```\n\n安全地加载令牌：\n\
    \n```python\nimport os\nimport tweepy\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\
    BEARER_TOKEN = os.getenv(\"TWITTER_BEARER_TOKEN\")\nclient = tweepy.Client(bearer_token=BEARER_TOKEN)\n\
    ```\n\n### 3.3 实时获取推文\n```python\ndef fetch_tweets(keyword, count=10):\n    \"\
    \"\"获取包含指定关键词的最新推文。”\n    response = client.search_recent_tweets(query=keyword,\
    \ max_results=count, tweet_fields=[\"text\"])\n    return [tweet.text for tweet\
    \ in response.data]\n\n# 使用示例\ntweets = fetch_tweets(\"AI\", count=5)\nprint(tweets)\n\
    ```\n\n解释：\n\n- 使用 `Tweepy` 的 `v2 API` 获取包含关键词的推文。\n- 返回一个用于分析的推文文本列表。\n\n## 4.\
    \ 使用预训练的 Transformers 进行情感分类\n\n### 4.1 使用 Twitter-RoBERTa 进行情感分析\n我们使用 Hugging\
    \ Face 的 `transformers` 库加载 `cardnlp/twitter-roberta-base-sentiment` 模型。\n\n```python\n\
    from transformers import AutoModelForSequenceClassification, AutoTokenizer\nimport\
    \ torch\n\n# 加载模型和分词器\nMODEL_NAME = \"cardnlp/twitter-roberta-base-sentiment\"\
    \ntokenizer = AutoTokenizer.from_pretrained(MODEL_NAME)\nmodel = AutoModelForSequenceClassification.from_pretrained(MODEL_NAME)\n\
    \n# 情感标签\nLABELS = [\"Negative\", \"Neutral\", \"Positive\"]\n\ndef analyze_sentiment(text):\n\
