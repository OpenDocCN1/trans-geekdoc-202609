    \n#### 7.1.1 理解预训练\n\n什么是预训练？\n\n预训练是在模型专门化之前，从海量语料中学习通用模式的基础阶段。\n\n为什么预训练至关重要\n\
    \n* 减少对标记数据的依赖：传统的监督学习需要标签。\n* 增强泛化能力：由于预训练模型已经见过各种模式，它们的泛化效果更好。\n* 加速训练：与其从零开始训练模型，预训练能够快速适应。\n\
    \n常见的预训练目标\n\n不同的语言模型在预训练期间使用不同的目标。\n\n| 预训练目标 || 说明 | 模型 |\n| --- | --- | ---\
