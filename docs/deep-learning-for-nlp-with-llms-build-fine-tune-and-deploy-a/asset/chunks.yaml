    \ significantly improving scalability and performance.\n\n* * *\n\nExample: Named\
    \ Entity Recognition (NER) using Transformers\n\nModern NLP models use pretrained\
    \ transformers to automatically extract contextualized word representations, leading\
    \ to highly accurate NER systems.\n\n(Language: Python, using Hugging Face Transformers)\n\
    \npython\n\nfrom transformers import pipeline\n\n\\# Load a pre-trained Named\
    \ Entity Recognition (NER) model\n\nner\\_pipeline = pipeline(\"ner\", model=\"\
    dbmdz/bert-large-cased-finetuned-conll03-english\")\n\n\\# Input text\n\ntext\
    \ = \"John Doe visited New York and met with Alice Smith.\"\n\n\\# Perform NER\n\
    \nentities = ner\\_pipeline(text)\n\n\\# Display extracted named entities\n\n\
    for entity in entities:\n\nprint(f\"Entity: {entity\\['word'\\]}, Label: {entity\\\
    ['entity'\\]}, Score: {entity\\['score'\\]:.4f}\")\n\nAdvantages of Modern NLP\n\
    \nEliminates Manual Feature Engineering – Learns representations directly from\
    \ data.  \n\nHandles Contextual Information – Uses attention mechanisms for long-range\
    \ dependencies.  \n\nTransfer Learning – Leverages pretrained models, reducing\
    \ the need for large labeled datasets.\n\n* * *\n\n1.2.3 Comparing Classical and\
    \ Modern NLP\n\n| Aspect || Classical NLP || Modern NLP |\n\n| --- | --- | ---\
    \ |\n\n| Approach || Rule-based, statistical methods || Deep learning, transformers\
    \ |\n\n| Feature Engineering || Manually designed features || Automatic feature\
    \ learning |\n\n| Scalability || Limited to predefined rules || Learns from large-scale\
    \ data |\n\n| Generalization || Poor with unseen words/syntax || Handles new contexts\
    \ well |\n\n| Computational Cost || Low, runs on CPU || High, requires GPUs/TPUs\
    \ |\n\n| Interpretability || High (explicit rules) || Low (black-box nature) |\n\
    \n* * *\n\n1.2.4 Performance Considerations and Trade-Offs\n\nWhile modern NLP\
    \ significantly outperforms classical approaches, it comes with challenges such\
    \ as:\n\n1.  Compute and Data Requirements\n\n○        LLMs require expensive\
    \ GPUs and vast datasets.\n\n○        Classical NLP can run on low-resource devices.\n\
    \n2.  Interpretability\n\n○        Classical methods provide transparent decision-making.\n\
    \n○        Deep learning models are opaque and hard to debug.\n\n3.  Bias and\
    \ Ethical Concerns\n\n○        Classical NLP has explicit rule-based biases.\n\
    \n○        Modern LLMs inherit biases from training data, requiring careful mitigation.\n\
    \n* * *\n\n1.2.5 Real-World NLP Applications: Classical vs. Modern Approaches\n\
    \n| Task || Classical NLP Approach || Modern NLP Approach |\n\n| --- | --- | ---\
    \ |\n\n| Spell Checking || Rule-based dictionary lookup || Transformer-based BERT\
    \ spelling correction |\n\n| Machine Translation || Phrase-based statistical models\
    \ || Neural machine translation (NMT) with transformers |\n\n| Text Classification\
    \ || Naïve Bayes, SVM || Fine-tuned BERT or GPT models |\n\n| Chatbots || Pattern-matching\
    \ with rules || GPT-based conversational AI |\n\n| Named Entity Recognition (NER)\
    \ || Regex, HMMs, CRFs || Pretrained transformer models |\n\n* * *\n\n### 1.3\
    \ Role of LLMs in NLP\n\nLarge Language Models (LLMs) have fundamentally transformed\
