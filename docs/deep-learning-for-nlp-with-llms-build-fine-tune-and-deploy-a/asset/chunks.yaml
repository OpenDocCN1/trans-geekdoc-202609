    2. **位置编码（Positional Encoding）**：由于 `Transformers` 并行处理标记，因此需要显式添加位置信息。\n3. **自注意力机制**：计算词之间的上下文关系。\n\
    4. **前馈层**：进一步精炼表示。\n5. **解码器对编码器的注意力**：确保生成的输出与输入上下文对齐。\n\n| 组件 | 功能 |\n| ---\
