- raw: "●        Contextual limitations: Unable to understand sarcasm, double negatives,\
    \ or implied meanings.\n\n* * *\n\n1.1.2 Statistical NLP (1990s–2010s)\n\nWith\
    \ the rise of machine learning and statistical methods, NLP moved away from handcrafted\
    \ rules towards probabilistic models that learned from data. These approaches\
    \ improved scalability and adaptability.\n\nKey Techniques\n\n1.  N-gram Models\
    \ – Used for sequence modeling and text prediction.\n\n2.  Hidden Markov Models\
    \ (HMMs) – Applied in part-of-speech tagging and speech recognition.\n\n3.  Naïve\
    \ Bayes Classifier – Used for text classification tasks like spam detection.\n\
    \nExample: N-gram Language Modeling (Language: Python)\n\nA simple trigram language\
    \ model predicting the next word based on the previous two words:\n\npython\n\n\
    from collections import defaultdict\n\nimport random\n\n\\# Sample text corpus\n\
    \ncorpus = \\[\n\n\"the cat sat on the mat\",\n\n\"the dog sat on the couch\"\
