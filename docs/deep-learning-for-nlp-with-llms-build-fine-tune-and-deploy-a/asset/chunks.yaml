- raw: '○        The way models are integrated into applications can introduce bias,
    such as when content filtering disproportionately affects specific groups.


    Types of Bias


    Bias in LLMs manifests in several ways:


    | Type of Bias || Description || Example |


    | --- | --- | --- |


    | Societal Bias || Reinforces stereotypes about gender, race, or profession. ||
    Associating "nurse" with women and "engineer" with men. |


    | Selection Bias || Overrepresentation of certain perspectives. || More training
    data from Western sources leading to cultural bias. |


    | Confirmation Bias || Responses that favor dominant viewpoints over balanced
    perspectives. || AI model supporting commonly held beliefs instead of presenting
    neutral arguments. |


    | Political Bias || Skewed opinions based on ideological trends in training data.
    || AI responses favoring one political stance over another. |


    * * *


    Detecting Bias in LLMs


    Bias detection involves both qualitative analysis (manual review) and quantitative
    analysis (statistical methods).


    Qualitative Bias Testing


    A simple way to check for bias is by testing LLM responses to different demographic
    inputs.


    Example:


    Python


    python


    from transformers import pipeline


    classifier = pipeline("text-classification", model="facebook/bart-large-mnli")


    sentences = \[


    "The doctor is brilliant.",


    "The nurse is very kind.",


    "The engineer designed the system.",


    "The teacher nurtures young minds."


    \]


    results = classifier(sentences)


    for s, r in zip(sentences, results):


    print(f"Sentence: {s} \\n Prediction: {r} \\n")


    This method helps identify if certain professions are unfairly linked to specific
    demographics.


    Quantitative Bias Metrics


    1.  Word Embedding Association Test (WEAT)


    ○        Measures how closely words are associated with different attributes (e.g.,
    male vs. female names with career-related words).


    Python


    python


    from weat import WEAT


    from gensim.models import KeyedVectors


    \# Load pre-trained embeddings


    word\_vectors = KeyedVectors.load\_word2vec\_format("glove-wiki-gigaword-100.txt",
    binary=False)


    \# Define bias-sensitive word lists


    male\_terms = \["he", "him", "man", "male"\]


    female\_terms = \["she", "her", "woman", "female"\]


    \# Compute bias score


    bias\_score = WEAT.compute\_bias(word\_vectors, male\_terms, female\_terms)


    print(f"Bias Score: {bias\_score}")


    ●        A high bias score indicates stronger gender associations in embeddings.


    2.  Counterfactual Testing


    ○        Running identical prompts with different names, genders, or ethnic attributes
    to check for response discrepancies.


    * * *


    Mitigating Bias in LLMs


    Bias mitigation can be addressed at different stages of the AI pipeline:


    1\. Data Curation & Preprocessing


    ●        Diversify Training Data


    ○        Ensure balanced representation of gender, race, and viewpoints.


    ○        Use data augmentation techniques to create more diverse samples.


    ●        De-biasing Word Embeddings


    ○        Adjust word vectors to reduce gender or racial bias.


    Python


    python


    from gensim.models import KeyedVectors


    import numpy as np


    \# Load word embeddings


    word\_vectors = KeyedVectors.load\_word2vec\_format("glove-wiki-gigaword-100.txt",
    binary=False)


    \# Define bias direction (e.g., male-female bias)


    bias\_axis = np.mean(\[word\_vectors\["he"\] - word\_vectors\["she"\], word\_vectors\["man"\]
    - word\_vectors\["woman"\]\], axis=0)


    \# Neutralize biased words


    for word in \["doctor", "nurse", "engineer"\]:


    word\_vectors\[word\] -= np.dot(word\_vectors\[word\], bias\_axis) \* bias\_axis


    ●        This technique reduces the direct influence of biased word associations.


