    \ -> B-PER\nGoogle -> B-ORG\nMountain View -> B-LOC\n```\n\n### 为什么使用 Transformers\
    \ 进行 NER？\n- 上下文感知实体识别（例如，区分公司“Apple”与水果“苹果”）。\n- 比基于规则的系统更好地处理未见的实体。\n- 支持在自定义数据集上进行微调。\n\
    \n## 2.3.5 微调自定义模型\n\n微调 transformer 模型可以实现特定领域的 NER（例如，医疗、法律或金融）。\n\n### 微调 NER\
    \ 的步骤\n1. 以 CoNLL 格式准备标注的训练数据。\n2. 使用 Hugging Face 的 `Trainer` API 进行模型训练。\n3.\
    \ 在测试数据上评估微调后的模型。\n\n### 示例：使用 transformers 微调\n```python\nfrom transformers import\
    \ AutoModelForTokenClassification, TrainingArguments, Trainer\nfrom datasets import\
    \ load_dataset\n\n# 加载数据集\ndataset = load_dataset(\"conll2003\")\n\n# 加载预训练模型\n\
    model = AutoModelForTokenClassification.from_pretrained(\"bert-base-cased\", num_labels=9)\n\
    \n# 定义训练参数\ntraining_args = TrainingArguments(\n    output_dir=\"./ner_model\"\
    ,\n    per_device_train_batch_size=16,\n    per_device_eval_batch_size=16,\n \
    \   num_train_epochs=3,\n    evaluation_strategy=\"epoch\",\n)\n\n# 训练模型\ntrainer\
    \ = Trainer(\n    model=model,\n    args=training_args,\n    train_dataset=dataset[\"\
    train\"],\n    eval_dataset=dataset[\"validation\"],\n)\ntrainer.train()\n```\n\
    \n### 微调的主要优势\n- 在特定领域文本上具有更高的准确率。\n- 提高对新实体类型的实体识别。\n\n## 2.3.6 优化 NER\n\n###\
    \ 常见陷阱与修复\n| 问题 | 解决方案 |\n| --- | --- |\n| 模型误分类实体 | 使用更多训练数据进行微调 |\n| 召回率低（漏掉实体）\
    \ | 调整置信度阈值 |\n\n"
