    message\"\\]\\[\"content\"\\]\n\n\\# Example usage\n\nsummary = summarize\\_text(content)\n\
    \nprint(\"Summary:\", summary)\n\nKey Features:\n\n●        The system prompt\
    \ instructs GPT-4 to summarize news articles.\n\n●        The user input provides\
    \ the article’s full text.\n\n●        max\\_tokens=200 ensures a concise summary.\n\
    \n* * *\n\n4\\. Enhancing Summarization with Fine-Tuned GPT-4\n\n4.1 Why Fine-Tuning?\n\
    \nFine-tuning allows the model to:\n\n●        Generate summaries tailored for\
    \ specific industries (finance, politics, sports).\n\n●        Reduce hallucinations\
    \ and improve factual accuracy.\n\n●        Adapt to a preferred summarization\
    \ style (concise vs. detailed).\n\n4.2 Preparing a Summarization Dataset\n\nGPT-4\
    \ fine-tuning requires JSONL format:\n\njson\n\n{\"messages\": \\[{\"role\": \"\
    system\", \"content\": \"You summarize financial news.\"}, {\"role\": \"user\"\
    , \"content\": \"Summarize: Tesla stock rises 10% due to earnings.\"}, {\"role\"\
    : \"assistant\", \"content\": \"Tesla stock rose 10% following strong earnings.\"\
