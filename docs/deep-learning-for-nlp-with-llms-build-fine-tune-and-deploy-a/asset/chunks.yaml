  trans: "\n\n传统的搜索方法如 `TF-IDF` 和 `BM25` 依赖于词法匹配，往往会忽略语义含义。`RAG` 通过以下方式优于这些方法：\n\n\
    - 理解上下文：使用 `embeddings` 进行语义检索。\n- 减少幻觉：`LLMs` 依赖于真实世界的信息而非生成猜测。\n- 提高准确性：提供更相关性且有事实依据的答案。\n\
