    \n**Fine-Tuning BERT for Sentiment Analysis**\n\nStep 1: Load Pretrained BERT\
    \ Model\n\n```python\nfrom transformers import BertForSequenceClassification\n\
    \nmodel = BertForSequenceClassification.from_pretrained(\"bert-base-uncased\"\
    , num_labels=2)  # Binary classification\n```\n\nStep 2: Tokenize Input Data\n\
    \n```python\ntext = [\"BERT is a fantastic model for NLP!\"]\n\ntokens = tokenizer(text,\
    \ return_tensors=\"pt\", padding=True, truncation=True)\n```\n\nStep 3: Forward\
    \ Pass to Get Predictions\n\n```python\noutput = model(**tokens)\nlogits = output.logits\n\
    probs = torch.nn.functional.softmax(logits, dim=-1)\nprint(probs)\n```\n\nExplanation:\n\
    \n- `logits`: Raw prediction scores from `BERT`.\n- `softmax(logits, dim=-1)`\
    \ converts them into probabilities.\n\n### 6.1.5 Optimizing and Fine-Tuning BERT\n\
    \n**1. Handling Model Sizes**\n\n- `DistilBERT`: A smaller, faster variant of\
    \ `BERT` with 40% fewer parameters.\n- `ALBERT`: Optimizes parameter sharing to\
    \ reduce model size while maintaining accuracy.\n\n**2. Avoiding Catastrophic\
    \ Forgetting**\n\n- Use a low learning rate (e.g., `2e-5` to `5e-5`) for fine-tuning.\n\
    - Freeze lower layers initially to retain general language knowledge.\n\n```python\n\
    for param in model.bert.parameters():\n    param.requires_grad = False  # Freeze\
    \ BERT layers\n```\n\n**3. Batch Optimization with Mixed Precision Training**\n\
    \nUsing `FP16` training (via NVIDIA’s `AMP`) speeds up fine-tuning while reducing\
    \ memory usage.\n\n```python\nfrom torch.cuda.amp import autocast, GradScaler\n\
    \nscaler = GradScaler()\n\nwith autocast():\n    output = model(**tokens)\n  \
    \  loss = output.loss\n\nscaler.scale(loss).backward()\nscaler.step(optimizer)\n\
    scaler.update()\n```\n\n### 6.1.6 Real-World Applications of BERT\n\n| Application\
    \ | How BERT is Used |\n| --- | --- |\n| Search Engines | Improves Google’s search\
    \ ranking by understanding user intent. |\n| Chatbots | Enhances conversational\
    \ AI by grasping context. |\n| Text Summarization | Extracts key points from long\
    \ documents. |\n| Legal & Healthcare NLP | Helps analyze contracts, medical records,\
    \ and legal documents. |\n\n## 6.2 GPT Series: The Generative Approach\n\n###\
    \ 6.2.1 Introduction: From Contextual Understanding to Generative Models\n\nThe\
    \ Generative Pretrained Transformer (`GPT`) series represents a fundamental shift\
    \ in Natural Language Processing (NLP), moving from models that primarily understand\
    \ text (e.g., `BERT`) to models that generate human-like language. Unlike `BERT`,\
    \ which is bidirectional and focuses on understanding, `GPT` is autoregressive,\
    \ meaning it generates text one token at a time, predicting the next word based\
    \ on previous context.\n\n**Key Differences Between BERT and GPT**\n\n| Feature\
    \ | BERT | GPT |\n| --- | --- | --- |\n| Model Type | Bidirectional Transformer\
    \ | Autoregressive Transformer |\n"
  trans: "\n\n大语言模型（LLMs）重新定义了自然语言处理（NLP），使得在文本理解、生成、翻译和推理方面的高级应用成为可能。本章将对最具影响力的 LLM\
    \ 架构进行深入的技术探索：\n\n- BERT（基于 Transformer 的双向编码器表示）：一种为上下文嵌入和深层双向语言理解而设计的模型。\n-\
    \ `GPT` 系列（生成式预训练 Transformer）：一种 NLP 的生成式方法，推动了在文本生成和自回归建模中达到顶尖的性能。\n- `T5`、`LLaMA`\
    \ 以及其他尖端模型：探索各种架构，扩展了 LLM 在多任务学习、效率和部署方面的能力。\n\n每个章节都涵盖了架构原理、关键创新点、性能权衡以及现实世界的应用，并附带了使用\
    \ `PyTorch` 和 Hugging Face 的 `Transformers` 库的实际实现。\n\n## 6.1 BERT：用于 NLP 的上下文嵌入\n\
    \n### 6.1.1 引言：从静态词表示到上下文词表示的转变\n\n在引入基于 Transformer 的双向编码器表示 (`BERT`）之前，NLP 模型主要依赖于静态词嵌入，如\
    \ `Word2Vec`、`GloVe` 和 `FastText`。这些嵌入将词表示为固定向量，这意味着词的表示无论上下文如何保持不变。\n\n**静态词嵌入的局限性：**\n\
    \n- 缺乏上下文感知：同一个词在不同的句子中的表示完全相同。\n- 多义性问题：具有多个含义的词（例如，“bank” 在“河岸”与“银行”之间）被视为相同。\n\
    - 无双向上下文：传统模型按左到右或从右到左的方式处理文本，但不会同时在两个方向上进行。\n\n**BERT 如何克服这些挑战**\n\n`BERT` 引入了上下文嵌入，根据周围的词动态调整词表示。它双向处理文本，捕捉深层语义理解，显著提高了\
    \ NLP 的性能。\n\n### 6.1.2 理解 BERT 的 Transformer 架构\n\n#### BERT 的核心组件\n\n`BERT`\
    \ 构建在 Transformer 编码器之上，利用自注意力机制和前馈层来处理输入文本。\n\n**1. 分词：WordPiece 编码**\n\n在将文本输入\
    \ `BERT` 之前，使用 `WordPiece` 分词器进行分词，该分词器将词拆分为子词单元。\n\n示例：WordPiece 分词\n\n```python\n\
    from transformers import BertTokenizer\n\ntokenizer = BertTokenizer.from_pretrained(\"\
    bert-base-uncased\")\n\ntokens = tokenizer.tokenize(\"Unbelievably powerful NLP\
    \ model\")\n\nprint(tokens)  # 输出: ['un', '##believably', 'powerful', 'nlp', 'model']\n\
    ```\n\n解释：\n\n- `##believably` 标记表示它是 \"un\" 的延续（子词编码）。\n- 这有助于 `BERT` 通过将未登录词拆分为已知的子词来处理词汇外词。\n\
    \n**2. 输入表示：标记、段和位置嵌入**\n\n`BERT` 的输入由三种嵌入组成：\n\n| 嵌入类型 | 用途 |\n| --- | --- |\n\
    | 标记嵌入 (Token Embeddings) | 将每个词/子词表示为稠密向量 |\n| 段嵌入 (Segment Embeddings) | 在句子对任务中区分不同的句子\
    \ |\n| 位置嵌入 (Position Embeddings) | 保留词序信息 |\n\n示例：句子对任务的输入嵌入\n\n```python\ntokens\
    \ = tokenizer(\"BERT is amazing.\", \"It improves NLP tasks!\", return_tensors=\"\
    pt\")\nprint(tokens)\n```\n\n- 第一句：使用段嵌入 `0`\n- 第二句：使用段嵌入 `1`\n\n**3. BERT 中的自注意力机制**\n\
    \n自注意力机制允许 `BERT` 根据句子中词的相关性，为这些词分配不同的注意力权重。\n\n### 6.1.3 BERT 预训练：MLM 和 NSP 目标\n\
    \n`BERT` 在两个任务上进行了预训练：\n\n**1. 掩码语言模型 (MLM)**\n\n`BERT` 随机掩盖输入中 15% 的标记并预测它们。\n\
    \n示例：\n\n输入：“BERT is an [MASK] model.”\n预测：“BERT is an NLP model.”\n\n```python\n\
    from transformers import BertForMaskedLM\n\nmodel = BertForMaskedLM.from_pretrained(\"\
    bert-base-uncased\")\n\ntokens = tokenizer(\"BERT is an [MASK] model.\", return_tensors=\"\
    pt\")\noutput = model(**tokens)\n```\n\n- `MLM` 允许双向学习，与传统的从左到右模型不同。\n\n**2. 下一句预测\
    \ (NSP)**\n\n`BERT` 训练用于预测句子 B 是否在句子 A 之后。\n\n| 句子 A | 句子 B | NSP 标签 |\n| ---\
    \ | --- | --- |\n| \"The cat sat on the mat.\" | \"It was a sunny day.\" | 0 (否)\
    \ |\n| \"The cat sat on the mat.\" | \"It started purring.\" | 1 (是) |\n\n```python\n\
    from transformers import BertForNextSentencePrediction\n\nmodel = BertForNextSentencePrediction.from_pretrained(\"\
    bert-base-uncased\")\n\ntokens = tokenizer(\"The cat sat on the mat.\", \"It started\
    \ purring.\", return_tensors=\"pt\")\noutput = model(**tokens)\n```\n\n**为什么 NSP\
    \ 重要？**\n\n- 帮助 `BERT` 理解句子之间的关系，不同于传统的左到右模型（注：原文此处逻辑略有重复，已根据语境翻译）。\n\n### 6.1.4\
    \ 针对 NLP 任务微调 BERT（注：此处原文文本结构出现部分重复或错乱，翻译时已调整以保持逻辑连贯性）\n\n**针对情感分析微调 BERT**\n\n\
    `BERT` 的预训练模型可以针对特定的 NLP 任务进行微调。\n\n步骤 1：加载预训练 BERT 模型\n\n```python\nfrom transformers\
    \ import BertSequenceClassification\n\nmodel = BertSequenceClassification.from_pretrained(\"\
    bert-base-uncased\", num_labels=2) # 二 二分类\n```\n\n步骤 2：标记化输入数据\n\n```python\n\
    text = [\"BERT is a fantastic model\"]\n\ntokens = tokenizer(text, return_tensors=\"\
    pt\", padding=True, truncation=True)\n```\n\n步骤 3：前向传播获取预测\n\n```python\noutput\
    \ = model(**tokens)\nlogits = output.logits\nprobs = torch.nn.functional.softmax(logits,\
    \ dim=-1)\nprint(probs)\n```\n\n解释：\n\n- `logits`：来自 `BERT` 的原始得分。\n- `softmax(logits,\
    \ dim=-1)` 将其转换为概率。\n\n### 6.1.5 优化 BERT\n\n**1. 模型大小**\n\n- `DistilBERT`：BERT\
    \ 的更小更快版本，参数减少了 40%。\n- `ALBERT`：通过参数共享优化模型大小。\n\n**2. 避免灾难性遗忘**\n\n- 微调时使用低学习率（例如\
    \ `2e-5` 到 `5e-5`）。\n- 最初冻结底层以保留通用语言知识。\n\n```python\nfor param in model.bert.parameters():\n\
    \    param.requires_grad = False # 冻结 层\n```\n\n**3. 混合精度训练的批量优化**\n\n使用 `FP16`\
    \ 训练（通过 NVIDIA 的 `AMP`）可以加速微调并减少内存占用。\n\n```python\nfrom torch.cuda.amp import\
    \ autocast, GradScaler\n\nscaler = GradScaler()\n\nwith autocast():\n    output\
    \ = model(**tokens)\n    loss = output.loss\n\nscaler.scale(loss).backward()\n\
    scaler.step(optimizer)\nscaler.update()\n```\n\n### 6.1.6 BERT 的现实应用\n\n| 应用 |\
    \  |\n| --- | --- |\n| 搜索引擎 | 通过理解用户意图提升 Google 的搜索排名。 |\n| 机器人 | 通过感知上下文增强对话\
    \ AI。 |\n| 摘要 | 从长文档中提取关键点。 |\n| 法律与医疗 NLP | 用于分析合同、医疗记录和法律文件。 |\n\n"
