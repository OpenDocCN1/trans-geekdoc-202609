    \ | 容易过拟合 | 基于规则的文本分类 |\n\n***\n\n# 第 4 章：NLP 深度学习\n\n深度学习彻底改变了自然语言处理（NLP），使模型能够学习文本中复杂的模式、生成类人类响应并处理海量的非结构化数据。与传统的机器学习技术不同，基于深度学习的\
    \ NLP 模型能够捕捉上下文关系、长程依赖和复杂的语言结构。\n\n本章将探索：\n- 用于处理序列数据的循环神经网络（RNN）、长短期记忆网络（LSTM)和门控循环单元（GRUs）。\n\
    - 注意力机制及其在现代 NLP 模型中的作用。\n- 序列到序列（Seq2Seq）模型，这是机器翻译、聊天机器人和文本生成的基础。\n\n通过本章的学习，你将能够使用行业标准技术构建、优化和部署用于\
    \ NLP 应用的深度学习模型。\n\n***\n\n## 4.1 RNN、LSTM 和 GRU 简介\n\n深度学习显著推进了自然语言处理（NLP），使模型能够学习序列依赖、捕捉上下文并处理文本中的长程关系。传统的机器学习方法依赖于人工设计的特征，而深度学习模型则直接从数据中学习表示，消除了手动特征工程的需求。\n\
    \n循环神经网络（RNN）、长短期记忆网络（LSTM）和门控循环单元（GRU）构成了序列数据处理深度学习的基础。这些模型在处理文本、语音和时间序列数据方面表现出色，对于机器翻译、文本生成和语音识别等任务至关重要。\n\
    \n***\n\n### 4.1.1 序列数据处理的挑战\n\n传统的神经网络（如前馈网络）独立地处理输入，因此不适用于序列数据。例如，考虑一个预测句子中下一个单词的语言模型：\n\
    \n输入：\"The weather is…\"（天气是……）\n\n预期输出：\"sunny”（晴）\n\n前馈网络将每个单词视为一个独立的单元，忽略了序列的结构。然而，语言本质上是序列性的，这意味着下一个单词的预测依赖于之前的单词。\n\
    \n#### 主要挑战\n1. 缺乏记忆：前馈网络不保留过去的信息。\n2. 固定输入大小：它们需要固定长度的输入，对于变长序列缺乏灵活性。\n3. 上下文丢失：它们无法跨单词或时间步捕捉依赖关系。\n\
    \n这些局限性导致了循环架构 `RNNs`、`LSTMs` 和 `GRUs` 的发展，它们能够保持记忆。\n\n***\n\n### 4.1.2 循环神经网络\
    \ (RNNs)\n\n`RNNs` 引入了循环连接，允许它们跨序列维持记忆。`RNN` 不再独立地处理输入，而是维护一个带有来自之前时间步信息的隐藏状态。\n\
    \n#### 架构\n给定输入序列 `X = (x₁, x₂, ..., xₙ)`，`RNN` 更新其隐藏状态：\n`ht = f(Wh₋ + Wxt +\
    \ b)`\n其中：\n- `ht` 是时间 `t` 时的隐藏状态。\n- `xt` 是时间 `t` 的输入。\n- `Wh`, `Wx` 是权重矩阵，`b`\
    \ 是偏置。\n- `f` 是激活函数，通常为 `tanh` 或 `ReLU`。\n\n最终输出 `yt` 计算公式为：\n`yt = Wy + by`\n\
    \n#### Python 中的 RNN 实现\n```python\nimport torch\nimport torch.nn as nn\nclass\
    \ SimpleRNN(nn.Module):\n    def __init__(self, input_size, hidden_size, output_size):\n\
    \        super(SimpleRNN, self).__init__()\n        self.rnn = nn.RNN(input_size,\
    \ hidden_size, batch_first=True)\n        self.fc = nn.Linear(hidden_size, output_size)\n\
    \    def forward(self, x):\n        output, hidden = self.rnn(x)  # RNN output\
    \ and hidden state\n        return self.fc(hidden.squeeze(0))  # Fully connected\
    \ layer for output\n\n# 使用示例\nmodel = SimpleRNN(input_size=10, hidden_size=20,\
    \ output_size=1)\n```\n\n#### RNN 的局限性\n- 梯度消失问题：随着序列变长，梯度会减小，导致网络无法学习长期依赖。\n\
    - 难以处理长程依赖：`RNNs` 很难记住遥远时间步的信息。\n- 并行化效率低：由于 `RNNs` 是按顺序处理数据的，训练速度变得很慢。\n\n这些挑战导致了\
    \ `LSTMs` 和 `GRUs` 的发展，它们引入了门控机制。\n\n***\n\n### 4.1.3 长短期记忆网络 (LSTMs)\n\n`LSTMs`\
    \ 通过引入控制记忆保留和更新的门，扩展了 `RNNs`，允许网络记住长程依赖。\n\n#### LSTM 架构\n每个 `LSTM` 单元包含：\n- 遗忘门（Forget\
    \ Gate）：决定丢弃哪些信息。\n- 输入门（Input Gate）：决定存储哪些新信息。\n- 单元状态（Cell State）：维持长期记忆。\n\
    - 输出门（Output Gate）：调节记忆对输出的贡献。\n\n给定输入 `xt`、上一个隐藏状态 `ht₋` 和上一个单元状态 `CT₋`，`LSTM`\
    \ 更新如下：\n`ft = σ(Wf ⋅ [ht₋, xt] + bt)`\n`it = σ(Wi ⋅ [ht₋, xt] + bi)`\n`Ct = ft\
    \ ⊙ CT₋ + it ⊙ tanh(Wc ⋅ [ht₋, xt])`\n\n#### LSTM 实现\n```python\nclass SimpleLSTM(nn.Module):\n\
    \    def __init__(self, input_size, hidden_size, output_size):\n        super(SimpleLSTM,\
    \ self).__init__()\n        self.lstm = nn.LSTM(input_size, hidden_size, batch_first=True)\n\
    \        self.fc = nn.Linear(hidden_size, output_size)\n    def forward(self,\
    \ x):\n        output, (hidden, cell) = self.lstm(x)  # LSTM output, hidden state,\
    \ and cell state\n        return self.fc(hidden.squeeze(0))\n\nmodel = SimpleLSTM(input_size=10,\
    \ hidden_size=20, output_size=1)\n```\n\n#### LSTM 的优势\n- 有效处理长程依赖。\n- 通过门控机制缓解了梯度消失问题。\n\
    \n尽管有这些改进，由于每个时间步都有多次门控操作，LSTM 的计算成本仍然很大。\n\n***\n\n### 4.1.4 门控循环单元 (GRUs)\n\n\
    `GRUs` 通过将遗忘门和输入门合并为单一更新门来简化 `LSTMs`，在保持性能的同时减少了计算成本。\n\n#### GRU 架构\n每个 `GRU`\
    \ 单元包含：\n- 更新门（Update Gate）：控制保留多少信息。\n- 重置门（Reset Gate）：决定之前的状态对当前状态的贡献多少。\n\n\
    `ut = σ(Wu ⋅ [ht₋, xt] + bu)`\n`rt = σ(Wr ⋅ [ht₋, xt] + br)`\n`ht = (1 - ut) ⊙\
    \ ht₋ + ut ⊙ tanh(Wn ⋅ [rt ⊙ ht₋, xt] + bc)`\n\n#### GRU 实现\n```python\nclass\
    \ SimpleGRU(nn.Module):\n    def __init__(self, input_size, hidden_size, output_size):\n\
    \        super(SimpleGRU, self).__init__()\n        self.gru = nn.GRU(input_size,\
    \ hidden_size, batch_first=True)\n        self.fc = nn.Linear(hidden_size, output_size)\n\
    \    def forward(self, x):\n        output, hidden = self.gru(x)\n        return\
    \ self.fc(hidden.squeeze(0))\n\nmodel = SimpleGRU(input_size=10, hidden_size=20,\
    \ output_size=1)\n```\n\n"
