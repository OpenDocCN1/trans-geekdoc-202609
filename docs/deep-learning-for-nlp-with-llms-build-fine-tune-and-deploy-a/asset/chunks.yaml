    \n●        Apply dimensionality reduction (e.g., PCA, LSA) for efficiency.\n\n\
    ●        Use Sparse Matrices to optimize memory.\n\n* * *\n\n### 3.2 Word Embeddings:\
    \ Word2Vec, GloVe, FastText\n\nTraditional text representation methods like Bag-of-Words\
    \ (BoW) and Term Frequency-Inverse Document Frequency (TF-IDF) treat words as\
    \ independent entities, ignoring their meaning and relationships. These limitations\
    \ make it difficult to capture semantic similarity and contextual meaning in natural\
    \ language.\n\nWord embeddings address these shortcomings by representing words\
    \ as dense, continuous-valued vectors in a high-dimensional space, where similar\
    \ words have similar vector representations. This allows NLP models to generalize\
    \ better, improving tasks like text classification, sentiment analysis, and machine\
    \ translation.\n\n* * *\n\n3.2.1 Understanding Word Embeddings\n\nMotivation for\
    \ Word Embeddings\n\nBoW and TF-IDF represent words as sparse vectors where each\
    \ word is independent. However, they fail to capture word similarity and semantic\
    \ relationships.\n\nFor example, in a traditional BoW model, the words king and\
    \ queen are as different as king and apple, even though king and queen share a\
    \ strong semantic relationship. Word embeddings overcome this by learning vector\
    \ representations where similar words are close together in a high-dimensional\
    \ space.\n\nProperties of Word Embeddings\n\n●        Semantic similarity: Words\
    \ with similar meanings (e.g., cat, kitten) have closer vector representations.\n\
    \n●        Word analogy relationships: Mathematical operations on word vectors\
    \ can reveal linguistic relationships, such as:  \n\nking−man+woman≈queen\n\n\
    ●        Dimensionality reduction: Instead of sparse, high-dimensional vectors,\
    \ word embeddings use dense, lower-dimensional vectors (e.g., 100 to 300 dimensions).\n\
    \n●        Context-awareness: Words are embedded based on their co-occurrence\
    \ with other words in large text corpora.\n\n* * *\n\n3.2.2 Word2Vec: Learning\
    \ Word Embeddings from Context\n\nWord2Vec is a neural network-based method for\
    \ learning word embeddings, developed by Google. It comes in two variants:\n\n\
    1.  Continuous Bag of Words (CBOW): Predicts a target word given its surrounding\
    \ context words.\n\n2.  Skip-gram: Predicts surrounding context words given a\
    \ target word.\n\nCBOW vs. Skip-gram\n\n| Feature || CBOW || Skip-gram |\n\n|\
    \ --- | --- | --- |\n\n| Training speed || Faster || Slower |\n\n| Works well\
    \ for || Frequent words || Rare words |\n\n| Task || Predicts target word from\
    \ context || Predicts context from target word |\n\nTraining Process\n\n1.  Prepare\
    \ the text corpus: Tokenize and preprocess the data.\n\n2.  Define a sliding window:\
    \ Determines the context window size (e.g., 2 words before and after the target\
    \ word).\n\n3.  Train the neural network: Adjusts weights using stochastic gradient\
    \ descent to minimize prediction error.\n\n4.  Extract word vectors: Once trained,\
    \ each word is mapped to a fixed-size vector.\n\nImplementing Word2Vec with Gensim\n\
    \nPython's Gensim library provides an efficient Word2Vec implementation.\n\npython\n\
    \nfrom gensim.models import Word2Vec\n\nfrom nltk.tokenize import word\\_tokenize\n\
    \n\\# Sample corpus\n\nsentences = \\[\n\n\"Natural language processing is a fascinating\
    \ field\",\n\n\"Deep learning advances NLP techniques\",\n\n\"Word embeddings\
    \ capture semantic meaning\"\n\n\\]\n\n\\# Tokenization\n\ntokenized\\_sentences\
    \ = \\[word\\_tokenize(sentence.lower()) for sentence in sentences\\]\n\n\\# Train\
    \ Word2Vec model\n\nmodel = Word2Vec(sentences=tokenized\\_sentences, vector\\\
    _size=100, window=5, min\\_count=1, workers=4)\n\n\\# Retrieve word vector\n\n\
    print(\"Vector for 'language':\", model.wv\\['language'\\])\n\n\\# Find most similar\
    \ words\n\nprint(\"Words similar to 'learning':\", model.wv.most\\_similar('learning'))\n\
    \nKey Parameters\n\n●        vector\\_size=100: Embedding dimension size (e.g.,\
    \ 100, 300).\n\n●        window=5: Context window size.\n\n●        min\\_count=1:\
    \ Ignores words that appear less than once.\n\n●        workers=4: Number of CPU\
    \ cores for parallel processing.\n\n* * *\n\n3.2.3 GloVe: Global Vectors for Word\
    \ Representation\n\nHow GloVe Works\n\nUnlike Word2Vec, which learns embeddings\
    \ based on local word co-occurrences, GloVe constructs word vectors using global\
    \ co-occurrence statistics.\n\n1.  Build a word co-occurrence matrix: Counts how\
    \ often words appear together in a large corpus.\n\n2.  Factorize the matrix:\
    \ Uses matrix factorization techniques to generate dense word embeddings.\n\n\
    3.  Optimize the embeddings: Applies a weighted least squares objective function\
    \ to minimize errors.\n\nMathematical Model\n\nGloVe optimizes the following function:\n\
    \nJ= ​ ![](image_rsrc7KT.jpg)f(Xij​) (wiT​wj​ + bi​+bj​− logXij ​)2\n\nwhere:\n\
    \n●        Xij​ is the co-occurrence count of words iii and jjj.\n\n●        wi\
    \ ​wj​ are the word vectors.\n\n●        Bi​ an bj​ are bias terms.\n\n●        f(Xij​)\
    \ is a weighting function.\n\nImplementing GloVe with Pretrained Embeddings"
