- raw: '7.2.3 Prompt Engineering for Zero/Few-Shot Learning


    Prompt engineering involves designing structured input prompts to guide model
    responses without modifying weights. This method is particularly useful for zero-shot
    and few-shot learning, where labeled data is scarce.


    Example: Optimizing Prompts for GPT-Based Sentiment Analysis


    python


    from openai import OpenAI


    client = OpenAI(api\_key="your-api-key")


    prompt = """Classify the sentiment of the following review as ''positive'' or
    ''negative'':


    Review: "The movie was visually stunning but had a weak storyline."


    Sentiment:"""


    response = client.completions.create(


    model="gpt-4",


    prompt=prompt,


    max\_tokens=5


    )


    print(response.choices\[0\].text.strip())


    Optimization Strategies:


    ●        Explicit instructions improve response accuracy.


    ●        Few-shot learning includes multiple labeled examples in the prompt.


    ●        Chain-of-thought prompting guides complex reasoning tasks.


    While prompt engineering is computationally efficient, it lacks deep task adaptation
    compared to fine-tuning.


    * * *


    7.2.4 Parameter-Efficient Fine-Tuning (PEFT)


    Fine-tuning all model parameters can be costly. PEFT techniques modify only a
    small subset of parameters, significantly reducing training time and memory usage.


    LoRA (Low-Rank Adaptation)


    LoRA injects trainable low-rank matrices into transformer layers, updating only
    a fraction of the parameters.


    Python: Applying LoRA to a LLaMA Model


    python


    from peft import get\_peft\_model, LoraConfig


    from transformers import AutoModelForCausalLM


    \# Load model


    model\_name = "meta-llama/Llama-2-7b-hf"


    model = AutoModelForCausalLM.from\_pretrained(model\_name)


    \# Apply LoRA adapters


    config = LoraConfig(r=8, lora\_alpha=32, lora\_dropout=0.1, task\_type="CAUSAL\_LM")


    model = get\_peft\_model(model, config)


    Advantages:


    ●        Drastically reduces memory usage while maintaining performance.


    ●        Works well with low-data regimes by minimizing overfitting.


    ●        Easily switchable between tasks using different LoRA adapters.


    Other PEFT techniques include Prefix Tuning and Adapter Layers, which further
    optimize fine-tuning efficiency.


    * * *


    7.2.5 Retrieval-Augmented Generation (RAG)


    LLMs often generate outdated or hallucinated responses. RAG integrates external
    knowledge retrieval to enhance factual accuracy.


    Example: Implementing RAG with FAISS and LLaMA


    python


    from sentence\_transformers import SentenceTransformer


    import faiss


    import numpy as np


    \# Load embedding model


    embedder = SentenceTransformer("sentence-transformers/all-mpnet-base-v2")


    \# Sample documents


    documents = \[


    "The capital of France is Paris.",


    "Albert Einstein developed the theory of relativity.",


    "The mitochondrion is the powerhouse of the cell."


    \]


    \# Generate embeddings


    doc\_embeddings = embedder.encode(documents)


    index = faiss.IndexFlatL2(doc\_embeddings.shape\[1\])


    index.add(np.array(doc\_embeddings))


    \# Query embedding


    query = "Who discovered relativity?"


    query\_embedding = embedder.encode(\[query\])


    \# Retrieve closest document


    \_, retrieved\_doc\_id = index.search(np.array(query\_embedding), 1)


    print(f"Retrieved Document: {documents\[retrieved\_doc\_id\[0\]\[0\]\]}")


    Key Benefits:


    ●        Improves factual accuracy by grounding responses in external knowledge.


    ●        Reduces hallucinations common in LLMs.


    ●        Enhances performance on knowledge-intensive tasks like question answering.


    Combining RAG with fine-tuned LLMs creates robust AI assistants capable of retrieving
    and generating relevant knowledge.


    * * *


    ### 7.3 Hands-On: Fine-Tuning a Transformer Model


    Fine-tuning a pretrained Transformer model is one of the most effective ways to
    adapt it to a specific NLP task. This chapter provides a comprehensive, hands-on
    guide to fine-tuning a Transformer model for text classification. It covers data
    preprocessing, training, evaluation, optimization techniques, and deployment considerations.


    * * *


    7.3.1 Understanding Fine-Tuning


    Fine-tuning involves adapting a pretrained Transformer model to a specific task
    by training it on domain-specific data. This allows the model to retain general
    linguistic knowledge while learning task-specific patterns.


    Pretrained vs. Fine-Tuned Models


    ●        Pretrained Models: Trained on massive datasets (e.g., BERT, T5, GPT)
    to learn generic language patterns.


    ●        Fine-Tuned Models: Further trained on task-specific data (e.g., sentiment
    classification, named entity recognition).


    Full Fine-Tuning vs. Parameter-Efficient Methods


    | Method || Description || Pros || Cons |


    | --- | --- | --- | --- |


    | Full Fine-Tuning || All model weights are updated on a task-specific dataset.
    || Best performance || Requires large datasets and high compute |


    | LoRA (Low-Rank Adaptation) || Adds trainable low-rank matrices while freezing
    most weights. || Reduces memory usage || Minor performance loss |


    | Adapters || Small, trainable layers inserted between Transformer layers. ||
    Modular, efficient || May underperform full fine-tuning |


    | Prefix Tuning || Prepends trainable vectors to input embeddings. || Lightweight
    adaptation || May not generalize well |


    This chapter will demonstrate full fine-tuning first, followed by LoRA-based fine-tuning
    for efficiency.


    * * *


    7.3.2 Setting Up the Environment


    Installing Dependencies


    Ensure transformers, datasets, and torch are installed:


    bash


    pip install transformers datasets torch accelerate peft


    Choosing a Model


    For text classification, we use BERT (Bidirectional Encoder Representations from
    Transformers). The bert-base-uncased model is pretrained on general text and will
    be fine-tuned on a sentiment classification dataset.


    * * *


    7.3.3 Loading and Preprocessing Data


    We use the IMDB dataset (binary sentiment classification).


    Python: Loading the Dataset


    python


    from datasets import load\_dataset


    \# Load IMDB dataset


    dataset = load\_dataset("imdb")


    \# Split into train and validation sets


    train\_data = dataset\["train"\]


    valid\_data = dataset\["test"\]


    Tokenizing Text


    Transformer models require tokenized input. We use the BERT tokenizer:


    python


    from transformers import AutoTokenizer


    \# Load tokenizer


    tokenizer = AutoTokenizer.from\_pretrained("bert-base-uncased")


    \# Tokenize dataset


    def tokenize\_batch(batch):


    return tokenizer(batch\["text"\], padding="max\_length", truncation=True, max\_length=512)


    train\_data = train\_data.map(tokenize\_batch, batched=True)


    valid\_data = valid\_data.map(tokenize\_batch, batched=True)


    Converting Labels


    We convert labels (0=negative, 1=positive):


    python


    train\_data = train\_data.rename\_column("label", "labels")


    valid\_data = valid\_data.rename\_column("label", "labels")


    \# Remove raw text as it''s no longer needed


    train\_data = train\_data.remove\_columns(\["text"\])


    valid\_data = valid\_data.remove\_columns(\["text"\])


    * * *


    7.3.4 Fine-Tuning BERT


    Defining the Model


    python


    from transformers import AutoModelForSequenceClassification


    \# Load BERT model with classification head


    model = AutoModelForSequenceClassification.from\_pretrained("bert-base-uncased",
    num\_labels=2)


    Configuring Training Arguments


    python


    from transformers import TrainingArguments


    training\_args = TrainingArguments(


    output\_dir="./bert\_sentiment",


    evaluation\_strategy="epoch",


    save\_strategy="epoch",


    save\_total\_limit=2,


    per\_device\_train\_batch\_size=8,


    per\_device\_eval\_batch\_size=8,


    num\_train\_epochs=3,


    weight\_decay=0.01,


    logging\_dir="./logs",


    logging\_steps=50,


    )


    Training the Model


    python


    from transformers import Trainer


    trainer = Trainer(


    model=model,


    args=training\_args,


    train\_dataset=train\_data,


    eval\_dataset=valid\_data,


    )


    trainer.train()


    Key Considerations:


    ●        Batch size and learning rate tuning can significantly impact performance.


    ●        Checkpointing(save\_total\_limit) prevents excessive storage usage.


    * * *


    7.3.5 Evaluating Model Performance'
