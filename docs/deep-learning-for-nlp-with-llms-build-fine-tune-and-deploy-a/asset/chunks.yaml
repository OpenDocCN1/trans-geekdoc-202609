    4. 使用反向代理（Nginx）提供服务。\n\n***\n\n## 5. 性能与安全优化\n\n### 5.1 使用 Redis 缓存\n\n为了提高响应速度，在\
    \ Redis 中存储近期回复。\n\n```bash\npip install redis\n```\n\n修改 API 使用 Redis 缓存：\n\n\
    ```python\nimport redis\ncache = redis.Redis(host=\"localhost\", port=6379, db=0)\n\
