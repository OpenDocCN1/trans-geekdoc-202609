  trans: "\n\n## 1.3.4 大语言模型在 NLP 中的实际应用\n\n大语言模型（LLMs）被应用于各种现实场景中，每种应用都受益于其深层的上下文理解能力。\n\
    \n| 应用 | LLM 用途 |\n| --- | --- |\n| 聊天机器人与对话式 AI | LLMs 生成类人类的对话（例如 `ChatGPT`）。\
    \ |\n| 代码生成与辅助 | `Codex` 等 AI 模型驱动了 `GitHub Copilot` 等工具。 |\n| 搜索与信息检索 | LLMs\
    \ 改进了查询理解和排序（例如 `Google Search`）。 |\n| 机器翻译 | `Transformers` 实现了实时翻译（例如 `DeepL`,\
    \ `Google Translate`）。 |\n| 文本摘要 | LLMs 生成文档的简要摘要。 |\n| 问答 | LLMs 基于大规模语料库回答查询。\
    \ |\n\n## 1.3.5 针对效率和部署优化大语言模型\n\n大语言模型的计算开销很大，需要针对效率进行优化：\n\n1.  `Quantization`（量化）\
    \ – 在不显著降低准确率的情况下减小模型尺寸。\n2.  `Distillation`（蒸馏） – 训练较小的模型模拟大型模型（例如 `DistilBERT`）。\n\
    3.  `Retrieval-Augmented Generation (RAG)`（检索增强生成） – 通过外部知识源增强 LLMs。\n\n示例：使用量化运行优化后的\
    \ LLM\n\n（语言: Python, 使用 Hugging Face）\n\n```python\nfrom transformers import\
    \ AutoModelForCausalLM\nimport torch\n\n# 加载量化模型\nmodel = AutoModelForCausalLM.from_pretrained(\"\
    facebook/opt-1.3b\", torch_dtype=torch.float16)\n# 将模型移动到 GPU 以加速推理\nmodel.to(\"\
    cuda\")\n```\n\n为什么要使用量化？\n\n*   减少 GPU 内存占用。\n*   在保持可用性能的同时加速推理。\n\n## 第 2 章：文本预处理技术\n\
    \n### 2.1 分词、词干提取与还原\n\n文本预处理是自然语言处理（NLP）中的关键步骤，它通过消除不一致性、降低复杂性和标准化结构，为原始文本数据的进一步分析做准备。。文本预处理中的三个基本技术是分词（tokenization）、词干提取（stemming）和还原（lemmatization）。这些技术有助于将原始文本转换为结构化格式，从而在\
    \ NLP 任务（如机器学习模型、搜索引擎和大语言模型 LLMs）中实现更有效的下游处理。\n\n本节涵盖内容：\n\n*   `Tokenization`（分词）：将文本拆分为有意义的单元，如单词或句子。\n\
    *   `Stemming`（词干提取）：通过删除后缀将单词还原为基基或根形式。\n*   `Lemmatization`（还原）：将单词映射到基于字典的根形式。\n\
    \n每种技术都配有相应的 Python 代码，以说明其在现实场景中的应用。\n\n#### 2.1.1 分词 (Tokenization)\n\n分词是将文本分割为称为\
    \ token 的较小单元的过程。这些 token 可以是单词、句子甚至是字符，取决于所需的粒度。分词在 NLP 中至关重要，因为大多数算法是基于单个单词而不是整个句子运行。\n\
    \n分词的类型\n\n1.  `Word Tokenization`（词分词）：将文本分成单个单词。\n2.  `Sentence Tokenization`（句分词）：将文本分成句子。\n\
    3.  `Subword Tokenization`（子词分词）：将单词拆分成更小的有意义的单元（用于 LLMs）。\n\n在 Python 中实现分词\n\
    \n使用 `NLTK` 进行词分词和句分词\n\nPython 代码：\n\n```python\nimport nltk\nfrom nltk.tokenize\
    \ import word_tokenize, sent_tokenize\n\nnltk.download('punkt')\ntext = \"Natural\
    \ Language Processing is a fascinating field. Tokenization is a crucial step.\"\
    \n\n# 句分词\nsentences = sent_tokenize(text)\nprint(\"Sentence Tokenization:\",\
    \ sentences)\n\n# 词分词\nwords = word_tokenize(text)\nprint(\"Word Tokenization:\"\
    , words)\n```\n\n解释：\n\n*   `sent_tokenize(text)`：将文本拆分为句子。\n*   `word_tokenize(text)`：将文本拆分为单个单词。\n\
    \n子词分词 (BPE 和 WordPiece)\n\n在 `BERT` 和 `GPT` 等现代 NLP 模型中，使用了 `Byte Pair Encoding\
    \ (BPE)` 和 `WordPiece Tokenization` 来将单词拆分为更小的子词。\n\n使用 Hugging Face Tokenizers\
    \ 的 Python 代码：\n\n```python\nfrom transformers import AutoTokenizer\ntokenizer\
    \ = AutoTokenizer.from_pretrained(\"bert-base-uncased\")\ntokens = tokenizer.tokenize(\"\
    Tokenization is crucial for NLP models.\")\nprint(tokens)\n```\n\n为什么要使用子词分词？\n\
    \n*   有效处理词表外（OOV）单词。\n*   允许模型识别根词以及前缀/后缀。\n\n#### 2.1.2 词干提取 (Stemming)\n\n\
    词干提取是一种基于规则的过程，通过从单词中删除后缀将其还原为根形式。然而，它并不一定能产生真实的单词。\n\n常见的词干提取算法\n\n1.  `Porter\
    \ Stemmer`：最常用的词干提取算法之一。\n2.  `Lancaster Stemmer`：比 `Porter Stemmer` 更激进。\n\n\
    在 Python 中实现词干提取\n\n使用 `NLTK` 的 Porter 和 Lancaster 词干提取器的 Python 代码：\n\n```python\n\
    from nltk.stem import PorterStemmer, LancasterStemmer\n\nporter_stemmer = PorterStemmer()\n\
    lancaster_stemmer = LancasterStemmer()\nwords = [\"running\", \"flies\", \"happily\"\
    , \"better\", \"studies\"]\n\nprint(\"Porter Stemmer:\")\nfor word in words:\n\
    \    print(porter_stemmer.stem(word))\n\nprint(\"\\nLancaster Stemmer:\")\nfor\
    \ word in words:\n    print(lancaster_stemmer.stem(word))\n```\n\n#### 2.1.3 还原\
    \ (Lemmatization)\n\n还原是通过字典将单词映射到其根形式的过程。与词干提取不同，它能确保结果是真实的单词。\n\n在 Python 中实现还原\n\
    \n使用 `NLTK` 的 WordNetLemmatizer：\n\n```python\nfrom nltk.stem import WordNetLemmatizer\n\
    import nltk\nnltk.download('wordnet')\n\nlemmatizer = WordNetLemmatizer()\nwords\
    \ = [\"running\", \"flies\", \"rocks\", \"better\"]\n\nfor word in words:\n  \
    \  print(lemmatizer.lemmatize(word))\n```\n\n通过 POS 标签优化还原\n\n默认情况下，`WordNetLemmatizer`\
    \ 单词视为名词。指定正确的词性（POS）可以提高准确性。\n\n带有 POS 标签的 Python 代码：\n\n```python\nfrom nltk\
    \ import pos_tag\nfrom nltk.corpus import wordnet\nimport nltk\n\nnltk.download('averaged_perceptron_tagger')\n\
    nltk.download('wordnet')\n\ndef get_wordnet_pos(word):\n    \"\"\"将 POS 标签转换为\
    \ WordNetLemmatizer 识别的格式\"\"\"\n    tag = pos_tag([word])[0][1].upper()\n   \
    \ tag_dict = {\"J\": wordnet.ADJ, \"N\": wordnet.NOUN, \"V\": wordnet.VERB, \"\
    R\": wordnet.ADV}\n    return tag_dict.get(tag, wordnet.NOUN)\n\nlemmatizer =\
    \ WordNetLemmatizer()\nwords = [\"running\", \"flies\", \"rocks\", \"better\"\
    ]\n\nprint(\"带 POS 标签的还原:\")\nfor word in words:\n    print(lemmatizer.lemmatize(word,\
    \ get_wordnet_pos(word)))\n```\n\n[/### 2.2 停用词移除与归一化\n\n文本预处理是任何自然语言处理（NLP）流水线中的基础步骤。它确保文本数据经过清洗、结构化，并为文本分类、情感分析和语言模型等下游任务进行了优化。文本预处理中的一个至关重要的方面是停用词移除和归一化，这有助于减少噪声并提高计算效率。\n\
