    \n### 1.1 NLP 的演变\n\n自然语言处理 (`NLP`) 是人工智能 (`AI`) 的一个领域，旨在使机器能够理解、处理和生成人类语言。几十年来，`NLP`\
    \ 已从简单的基于规则的系统演变为强大的深度学习驱动大模型 (`LLMs`)，这些模型驱动着当今的 `AI` 应用。本章将探索 `NLP` 的里程碑，重点关注塑造现代\
    \ `NLP` 系统的技术进步、关键算法和架构。\n\n我们将系统地分解 `NLP` 演变的每个阶段，提供技术见解、实现细节和实际应用，确保清晰理解现代 `NLP`\
    \ 如何达到现状的。\n\n### 1.1.1 早期 NLP：基于规则的系统（1950-1980 年代）\n\n早期 `NLP` 方法依赖于基于规则的系统，语言专家手动定义模式、语法规则和转换规则。这些系统是确定性的，意味着它们遵循预定义的规则来分析或生成文本，导致在超出明确编程范围时缺乏泛化能力。\n\
    \n关键技术\n\n1. 有限状态机 (`FSA`) —— 用于建模语法规则。\n2. 正则表达式 (`Regex`) —— 定义模式匹配技术。\n3. 短语结构语法\
    \ —— 创建树状句法表示。\n\n#### 示例：基于规则的情感分析（语言：Python）\n\n一种简单的基于规则的系统，根据预定义的词表对句子进行分类：\n\
    \n```python\n# 用于情感分类的词表\npositive_words = {\"good\", \"great\", \"excellent\"\
    , \"fantastic\", \"amazing\", \"happy\"}\nnegative_words = {\"bad\", \"terrible\"\
    , \"awful\", \"sad\", \"horrible\", \"worst\"}\n\ndef rule_based_sentiment_analysis(text):\n\
    \    words = text.lower().split()\n    # 统计正面和负面词的出现次数\n    positive_count = sum(1\
    \ for word in words if word in positive_words)\n    negative_count = sum(1 for\
    \ word in words if word in negative_words)\n\n    if positive_count > negative_count:\n\
    \        return \"Positive Sentiment\"\n    elif negative_count > positive_count:\n\
    \        return \"Negative Sentiment\"\n    else:\n        return \"Neutral Sentiment\"\
    \n\n# 示例\ntext = \"This is a fantastic movie with excellent performances!\"\n\
    print(rule_based_sentiment_analysis(text))\n```\n\n#### 局限性\n\n- 泛化能力差：无法处理同义词或变化的句子结构。\n\
    - 维护成本高：必须为新词汇或模式手动更新规则。\n\n"
