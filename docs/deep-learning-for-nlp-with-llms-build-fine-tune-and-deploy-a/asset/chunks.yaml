    \nprint(summary[0]['summary_text'])\n```\n\n## 工作原理\n\n- `pipeline` 函数加载一个预训练的摘要模型。\n\
    - `max_length` 和 `min_length` 参数控制摘要的长度。\n- `do_sample=False` 确保输出是确定性的，而不是随机采样。\n\
    \n## 抽取式摘要的局限性\n\n- 不生成新句子，这可能导致摘要冗余。\n- 在重构内容方面缺乏灵活性。\n- 对于结构良好的文档效果最好，但在处理对话文本时表现不佳。\n\
    \n***\n\n## 生成式摘要\n\n生成式摘要通过理解内容的含义来生成新句子，而不是提取现有的文本。这种方法更接近人类的摘要方式，但需要复杂的深度学习模型。\n\
    \n### 关键特性\n\n- 重写文本而非复制句子。\n- 使用序列到序列（`Seq2Seq`）模型进行生成。\n- 与抽取式方法相比，更加灵活且自然。\n\
    \n### 常见方法\n\n1. **带有注意力机制的 LSTM**：早期方法使用循环神经网络（`RNNs`）生成摘要。\n2. **基于 Transformer\
    \ 的模型**：现代方法如 `BART`、`T5` 和 `GPT` 擅长生成式摘要。\n\n## 使用 T5 实现生成式摘要\n\n```python\n\
    from transformers import T5Tokenizer, T5ForConditionalGeneration\n\n# 加载模型和分词器\n\
    \nmodel = T5ForConditionalGeneration.from_pretrained(\"t5-small\")\ntokenizer\
    \ = T5Tokenizer.from_pretrained(\"t5-small\")\n\ndef generate_summary(text):\n\
    \    # 为摘要进行文本预处理\n    input_ids = tokenizer(\"summarize: \" + text, return_tensors=\"\
    pt\", padding=\"max_length\", truncation=True).input_ids\n    # 生成摘要\n    output\
    \ = model.generate(input_ids, max_length=50, min_length=20, length_penalty=2.0)\n\
    \    return tokenizer.decode(output[0], skip_special_tokens=True)\n\ntext = \"\
    \"\"人工智能正在快速演进，推动了自然语言处理、计算机视觉和机器人学的进步。\n研究人员继续开发更高效的算法，使 AI 模型能够以更高的准确性和更低的成本完成复杂任务。\"\
    \"\"\nprint(generate_summary(text))\n```\n\n### 工作原理\n\n- 模型在文本摘要任务上进行了微调，并理解了如何重述内容。\n\
    - `length_penalty=2.0` 鼓励生成更短但精炼的摘要。\n- `T5` 架构使用编码器-解码器 Transformer 来生成输出。\n\n\
    ### 生成式摘要的优势\n\n- 以新的表述生成类人类的摘要。\n- 在提取句子不足以满足要求的长内容中表现良好。\n- 可以重述复杂文本以便于理解。\n\
    \n### 挑战\n\n- 更容易产生幻觉（生成错误信息）。\n- 与抽取式方法相比，需要大量的计算资源。\n- 如果没有经过适当微调，可能会引入语法错误。\n\
    \n***\n\n## 比较抽取式摘要与生成式摘要\n\n| 特性 | 抽取式摘要 | 生成式摘要 |\n| --- | --- | --- |\n| 方法\
    \ | 选择关键句子 | 生成新句子 |\n| 流畅度 | 通常是断裂的 | 更自然连贯 |\n| 灵活性 | 受限于原始文本 | 具有更好的泛化能力 |\n\
    | 计算成本 | 较低 | 较高（需要深度学习） |\n| 准确性 | 更符合事实 | 可能会引入错误 |\n\n***\n\n## 高级技术与优化\n\n\
    ### 用于摘要的 Transformer 模型微调\n\n ** **数据集**：使用 `CNN/DailyMail`、`XSum` 或 `Reddit`\
    \ 微调摘要模型。\n- **超参数**：调整 `learning_rate`、`batch_size` 和 `max_length` 以获得更好的摘要。\n\
    - **评估指标**：`ROUGE`（面向召回的摘要评估研究）是摘要质量的标准指标。\n\n使用 Hugging Face 的 `Trainer` 的示例微调方法：\n\
    \n```python\nfrom transformers import Trainer, TrainingArguments\n\ntraining_args\
    \ = TrainingArguments(\n    output_dir=\"./results\",\n    evaluation_strategy=\"\
    epoch\",\n    per_device_train_batch_size=4,\n    per_device_eval_batch_size=4,\n\
    \    save_steps=10000,\n    save_total_limit=2,\n)\n\ntrainer = Trainer(\n   \
    \ model=model,\n    args=training_args,\n    train_dataset=train_dataset,\n  \
    \  eval_dataset=eval_dataset,\n)\n\ntrainer.train()\n```\n\n### 10.2 使用 Transformer\
    \ 进行机器翻译\n\n机器翻译（MT）是自然语言处理（NLP）最广泛的应用之一，实现了跨语言的自动翻译。随着深度学习的发展，基于 Transformer\
    \ 的架构显著提高了翻译质量，超过了传统的统计和规则方法。\n\n本节将探讨：\n\n1. 机器翻译从规则到方法的演变。\n2. 用于翻译的 Transformer\
    \ 模型架构。\n3. 使用 Hugging Face 的 `transformers` 库实现先进的翻译模型。\n4. 针对特定领域优化模型的高级微调技术。\n\
    \n在本结束后，读者将能够使用 `transformers` 构建、微调和部署神经机器翻译（NMT）系统。\n\n***\n\n## 机器翻译的演变\n\n\
    1. **规则机器翻译 (RBMT)**\n- 使用手工编写的语言规则和词典。\n- 需要大量的语言知识，难以扩展。\n- 生成的翻译生硬，在处理复杂句子结构时表现困难。\n\
    \n2. **统计机器翻译 (SMT)**\n- 从大规模双语语料库中学习翻译模式。\n- 使用概率模型，如 $n$-gram 和短语翻译。\n- 受限于上下文理解和词对齐问题。\n\
    \n3. **神经机器翻译 (NMT)**\n- 使用深度学习模型学习感知翻译。\n- 结合注意力机制的序列到序列（Seq2Seq）架构。\n- 需要大量的训练数据，但具有更高的流畅度和准确性。\n\
    \n4. **基于 Transformer 的翻译 (现代 NMT)**\n- 通过自注意力机制消除了递归。\n- 并行处理整个序列，提高了效率。\n- 驱动了如\
    \ `T5`、`BART` 和 `mBART` 等最先进模型。\n\n***\n\n"
