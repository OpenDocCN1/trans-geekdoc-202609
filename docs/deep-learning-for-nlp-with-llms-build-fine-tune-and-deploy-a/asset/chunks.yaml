    \n```php-template\n<lan>, <ang>, <ngu>, <gua>, <uag>, <age>\n```\n\n这使得能够处理稀有词，并对形态变化有更好的表示。\n\
    \n### 训练 FastText 模型\n\n```python\nfrom gensim.models import FastText\n\n# 训练\
    \ FastText 模型\nfasttext_model = FastText(sentences=tokenized_sentences, vector_size=100,\
    \ window=5, min_count=1, workers=4)\n\n# 获取词向量\nprint(\"Vector for 'language':\"\
    , fasttext_model.wv['language'])\n\n# 处理 OOV 单词\nprint(\"Vector for 'linguistics':\"\
    , fasttext_model.wv['linguistics'])\n```\n\nFastText 通过组合子词，比 `Word2Vec` 或 `GloVe`\
    \ 更好地处理新的、未见的单词。\n\n## 3.2.5 嵌入模型比较\n\n| 特性 | Word2Vec | GloVe | FastText |\n\
    | --- | --- | --- | --- |\n| 训练数据 | 局部上下文 | 全局共现 | 子词信息 |\n| 处理 OOV 单词 | 否 | 否\
    \ | 是 |\n| 内存效率 | 中 | 高 | 高 |\n| 最佳适用场景 | 大语料库 | 预训练嵌入 | 形态丰富的语言 |\n\n## 3.3 用于\
    \ NLP 的传统机器学习模型（朴素贝叶斯、SVM、决策树）\n\n深度学习模型如 `transformers` 主导了现代 NLP，但传统的机器学习（ML）技术在构建有效的\
    \ NLP 流水线方面仍然是基础，特别是在处理小数据集、低延迟应用或可解释性模型时。\n\n### 3.3.1 用于 NLP 的传统机器学习\n\n####\
    \ 为什么在 NLP 中使用传统机器学习？\n`BERT` 和 `GPT` 等深度学习模型非常强大，但它们需要大量的数据、大量的计算资源和复杂的微调。传统机器学习模型在以下场景仍然适用：\n\
    \n- **低资源场景**：当标注数据有限时。\n- **快速推理**：用于实时应用的轻量级模型。\n- **可解释性**：更容易调试和特征分析。\n- **基准模型**：在使用深度学习之前进行快速原型。\n\
    \n#### 传统机器学习的 NLP 流水线\n传统机器学习模型无法直接处理原始文本；它们需要结构化的数值表示。标准流水线包括：\n\n1. **文本预处理**：分词（`Tokenization`）、去除停用词、词干提取和词形还原。\n\
    2. **特征工程**：使用 `TF-IDF`、`Bag-of-Words` 或词嵌入将文本转换为数值特征。\n3. **模型训练**：拟合如 `Naïve\
    \ Bayes`、`SVM` 或 `Decision Tree` 等机器学习模型。\n4. **评估**：使用精确率（precision）、召回率（recall）、F1\
    \ 分数的准确率评估模型性能。\n\n### 3.3.2 NLP 中的朴素贝叶斯\n\n#### 朴素贝叶斯的工作原理\n朴素贝叶斯是基于贝叶斯定理的概率分类器：\n\
    \n`P(A|B)=P(B/A)P(A)/P(B)`\n\n在 NLP 中，`Naïve Bayes` 根据单词出现在文档中的概率，对对文档属于某一类别（例如垃圾邮件或非垃圾邮件）的概率。\n\
    \n由于它假设特征相互独立，因此被称为“朴素”（naïve）。尽管有此假设，它在文本分类任务中表现良好。\n\n#### 朴素贝叶斯的变体\n\n| 模型\
    \ | 描述 | 最佳适用场景 |\n| --- | --- | --- |\n| 多项式朴素贝叶斯 | 假设词频符合多项分布 | 文本分类 |\n| 伯努利朴素贝叶斯\
    \ | 使用单词的存在/否（0 或 1） | 短文本 |\n| 高斯朴素贝叶斯 | 假设特征符合高斯分布 | 非文本 |\n\n#### 用于情感分析的朴素贝叶斯实现\n\
    \n```python\nimport numpy as np\nimport pandas as pd\nfrom sklearn.feature_extraction.text\
    \ import TfidfVectorizer\nfrom sklearn.model_selection import train_test_split\n\
    from sklearn.naive_bayes import MultinomialNB\nfrom sklearn.metrics import classification_report,\
    \ accuracy_score\n\n# 示例数据集\ndata = pd.DataFrame({\n    \"text\": [\n        \"\
    I love this, it's fantastic!\",\n        \"Terrible film, I hated every second\"\
    ,\n        \"Great acting and story\",\n        \"Worst movie ever\",\n      \
    \  \"Absolutely loved it\",\n        \"The plot was so boring\"\n    ],\n    \"\
    label\": [1, 0, 1, 0, 1, 0]\n})\n\n# 文本预处理\nvectorizer = TfidfVectorizer(stop_words='english')\n\
    X = vectorizer.fit_transform(data[\"text\"])\ny = np.array(data[\"label\"])\n\n\
    # 分分为训练集和测试集\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3,\
    \ random_state=42)\n\n# 训练朴素贝叶斯\nnb_model = MultinomialNB()\nnb_model.fit(X_train,\
    \ y_train)\n\n# 预测\ny_pred = nb_model.predict(X_test)\n\n# 评估\nprint(accuracy_score(y_test,\
    \ y_pred))\nprint(classification_report(y_test, y_pred))\n\n### 3.3.3 NLP 中的支持向量机\
    \ (SVM)\n\n#### SVM 的工作原理\nSVM 是一种监督学习算法，在高维空间中寻找最优超平面来分离类别。它对于稀疏数据特别有效。\n\n####\
    \ 核技巧\nSVM 使用核函数将非线性可的数据转换到高维空间，在该空间可以找到线性分类器。\n\n- **线性核**：最适用于文本数据。\n- **多项核**：捕捉非线性关系。\n\
    - **径基函数 (RBF) 核**：最适用于复杂的决策边界。\n\n#### 用于分类的 SVM 实现\n\n```python\nfrom sklearn.svm\
    \ import SVC\n\n# 训练 SVM\nsvm_model = SVC(kernel='linear')\nsvm_model.fit(X_train,\
    \ y_train)\n\n# 预测\ny_pred_svm = svm_model.predict(X_test)\n\n# 评估\nprint(accuracy_score(y_test,\
    \ y_pred_svm))\nprint(classification_report(y_test, y_pred_svm))\n\n### 3.3.4\
    \ NLP 中的决策树\n\n#### 决策树的工作原理\n决策树根据特征条件划分数据，形成树状结构。它遵循：\n\n1. **特征选择**：使用 Gini\
    \ 纯度或熵等指标确定最佳划分特征。\n2. **递归划分**：继续划分数据直到满足停止条件。\n3. **预测**：根据学习到的决策规则进行分类。\n\n\
    #### 用于分类的决策树实现\n\n```python\nfrom sklearn.tree import DecisionTreeClassifier\n\
    \n# 训练决策树分类器\ndt_model = DecisionTreeClassifier(max_depth=5)\ndt_model.fit(X_train,\
    \ y_train)\n\n# 预测\ny_pred_dt = dt_model.predict(X_test)\n\n# 评估\nprint(accuracy_score(y_test,\
    \ y_pred_dt))\nprint(classification_report(y_test, y_pred_dt))\n```\n\n"
