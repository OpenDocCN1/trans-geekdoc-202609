    \ # Query\nK = torch.rand(32, 10, d_k) # Key\nV = torch.rand(32, 10, d_k) # Value\n\
    context, attn_weights = attention(Q, K, V)\n```\n\n## 4.2.5 Impact of Attention\
    \ on Modern NLP\n\nThe introduction of attention mechanisms transformed NLP:\n\
    * **Machine Translation**: Attention-based models outperform traditional `Seq2Seq`\
