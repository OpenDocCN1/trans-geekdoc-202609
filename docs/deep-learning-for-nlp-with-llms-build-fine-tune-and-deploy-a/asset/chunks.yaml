    \ 提升应用性能。\n\n# 第二部分：大语言模型 (LLMs)\n\n## 第 5 章：Transformer 简介\n\n`Transformers`\
    \ 彻底改变了自然语言处理（NLP），取代了传统的循环架构。它们自《Attention Is All Need》一文提出以来，被广泛应用于翻译、摘要和问答等任务。\n\
    \n本章将深入探讨：\n- `Transformers` 的架构及其工作原理。\n- 模型现状，包括 `GPT`、`BERT` 和 `T5`。\n- 使用\
    \ `PyTorch` 从零实现 `Transformer`。\n- 如何针对实际应用对模型进行优化。\n\n***\n\n### 5.1 Transformer\
    \ 模型概览\n\n为什么引入 Transformer？\n\n在 `Transformer` 出现之前，NLP 模型严重依赖 `RNNs`，它们是按顺序处理文本的。这种方法存在以下局限性：\n\
    - 由于顺序依赖，训练和推理速度缓慢。\n- 在捕捉长距离依赖方面存在困难。\n- 无法并行化，导致在大规模数据集上的训练效率低下。\n\n`Transformer`\
    \ 通过使用自注意力机制并行处理整个序列，解决了这些问题。\n\n***\n\n### 5.2 Transformer 架构\n\n`Transformer`\
    \ 由两个主要部分组成：\n1. **编码器（Encoder）**：处理输入文本并生成上下文。\n2. **解码器（Decoder）**：利用编码器的输出生成输出文本。\n\
