    ### 7.1 Pretraining vs. Fine-Tuning\n\n#### 7.1.1 Understanding Pretraining\n\n\
    What is Pretraining?\n\nPretraining is the foundational phase where a model learns\
    \ general patterns from vast corpora before being specialized for tasks.\n\nWhy\
    \ Pretraining is Crucial\n\n* Reduces labeled data dependency: Traditional supervised\
    \ learning requires labels, which are expensive.\n* Enhances generalization: Since\
    \ pretrained models have already seen diverse patterns, they generalize better.\n\
    * Accelerates training: Instead of training models from scratch, pretraining enables\
    \ faster adaptation.\n\nCommon Pretraining Objectives\n\nDifferent language models\
    \ use various objectives during pretraining.\n\n| Pretraining Objective || Description\
    \ | Example Models |\n| --- | --- | --- |\n| Masked Language Modeling (MLM) |\
    \ Predicts randomly masked tokens within an input sentence. | BERT, RoBERTa |\n\
    | Causal Language Modeling (CLM) | Predicts the next token based on previous tokens\
    \ (left-to-right prediction). | GPT, GPT-2, GPT-3 |\n| Span Corruption | Removes\
    \ spans of text and trains the model to reconstruct them. | T5, BART |\n| Contrastive\
    \ Learning | Learns representations by distinguishing between similar and dissimilar\
    \ samples. | SimCSE, CLIP |\n\n#### Example: Pretraining BERT with Masked Language\
    \ Modeling (MLM)\n\nBERT is pretrained using the MLM objective, where random words\
    \ in a sentence are masked, and the model predicts them based on context.\n\n\
    Python: MLM Pretraining\n\n```python\nfrom transformers import BertTokenizer,\
    \ BertForMaskedLM\nimport torch\n\n# Load BERT tokenizer and model\ntokenizer\
    \ = BertTokenizer.from_pretrained(\"bert-base-uncased\")\nmodel = BertForMaskedLM.from_pretrained(\"\
    bert-base-uncased\")\n\n# Example sentence with a masked token\nsentence = \"\
    The capital of France is [MASK].\"\ninputs = tokenizer(sentence, return_tensors=\"\
