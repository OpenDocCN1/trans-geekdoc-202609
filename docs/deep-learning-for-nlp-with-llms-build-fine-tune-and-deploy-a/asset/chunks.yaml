    \ can limit fine-tuning. Data augmentation techniques such as back-translation\
    \ enhance model robustness.\n\nExample using back-translation:\n\n```python\n\
    from transformers import MarianMT\n\n# Load translation models\nsrc_model = MarianMT.from_pretrained(\"\
    Helsinki-NLP/opus-mt-en\")\n\n# Translate English to French\ndef back_translate(text):\n\
