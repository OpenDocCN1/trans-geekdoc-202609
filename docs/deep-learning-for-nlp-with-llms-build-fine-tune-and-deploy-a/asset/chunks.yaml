    Comparison: API-Based vs. On-Device Deployment


    | Feature || API-Based Deployment || On-Device Deployment |


    | --- | --- | --- |


    | Latency || Higher (network overhead) || Low (local execution) |


    | Compute Power || High (cloud GPUs/TPUs) || Limited (mobile CPUs/NPUs) |


    | Scalability || High (supports multiple clients) || Low (device-specific constraints)
    |


    | Offline Support || No || Yes |


    | Security & Privacy || Moderate (data transmitted) || High (local inference)
    |


    | Cost || Higher (cloud hosting fees) || Lower (one-time device cost) |


    * * *


    Choosing the Right Deployment Strategy


    When to Use API-Based Deployment


    ●        Applications requiring scalability and remote access.


    ●        Continuous model updates without requiring users to update their apps.


    ●        Compute-intensive models that need GPU acceleration.


    When to Use On-Device Deployment


    ●        Real-time applications where low latency is critical (e.g., speech recognition).


    ●        Applications that must function offline (e.g., personal assistants).


    ●        Privacy-sensitive applications where data must remain local (e.g., medical
    AI).


    Hybrid Approach


    Some applications benefit from a hybrid strategy:


    ●        Perform lightweight inference on-device for responsiveness.


    ●        Offload complex tasks to an API when higher accuracy is needed.


    Example: A mobile assistant can classify speech on-device but use an API for full
    language modeling.


    * * *


    ## Chapter 14: Ethics, Bias, and Responsible AI


    As large language models (LLMs) become integral to applications across industries,
    concerns around ethics, bias, and responsible AI have gained prominence. While
    LLMs offer powerful capabilities, they also inherit biases from training data,
    pose challenges in transparency, and require careful governance to prevent unintended
    harm.


    This chapter explores key aspects of responsible AI, including:


    1.  Bias in LLMs and mitigation strategies


    2.  AI fairness, transparency, and explainability


    3.  The future of responsible AI in NLP


    By the end of this chapter, readers will gain both theoretical and practical knowledge
    on designing ethical AI systems that minimize bias, promote fairness, and enhance
    interpretability.


    * * *


    ### 14.1 Bias in LLMs and How to Mitigate It


    Large language models (LLMs) are trained on massive datasets and have demonstrated
    remarkable capabilities in natural language processing (NLP). However, these models
    can also exhibit biases—systematic errors that lead to unfair treatment of certain
    groups. Bias in LLMs arises from the data they are trained on, the algorithms
    used to process information, and even the ways in which they are fine-tuned.


    Addressing bias is critical to building ethical AI systems that promote fairness,
    reduce harm, and ensure trustworthiness. This chapter provides a deep dive into:


    1.  Understanding the sources and types of bias in LLMs


    2.  Techniques for detecting and evaluating bias


    3.  Methods for mitigating bias at different stages of the AI pipeline


    * * *


    Understanding Bias in LLMs


    Sources of Bias


    Bias in LLMs is not the result of a single factor but emerges from multiple sources:


    1.  Training Data Bias


    ○        LLMs learn from vast datasets collected from books, news articles, social
    media, and other sources. These datasets reflect real-world inequalities, stereotypes,
    and cultural biases.


    ○        Example: A dataset with more male than female CEOs may lead a model to
    associate leadership with men more than women.


    2.  Algorithmic Bias


    ○        The way models process and generate text can amplify biases. For example,
    neural networks may reinforce associations between certain words based on statistical
    correlations in data.


    3.  User Feedback & Reinforcement Learning Bias


    ○        When models are fine-tuned using reinforcement learning with human feedback
    (RLHF), they can inherit biases from annotators’ subjective judgments.


