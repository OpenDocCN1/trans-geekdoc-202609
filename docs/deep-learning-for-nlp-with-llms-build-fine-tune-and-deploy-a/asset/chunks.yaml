    \ 请求查询模型。\n\n#### GCP\n\nGoogle Cloud Platform (`GCP`) 提供了如下服务：\n* `Vertex AI`：全托管\
    \ AI 服务。\n* `Cloud Run`：无服务器模型托管。\n* `AI Platform Prediction`：可扩展的 ML 模型服务。\n\
    * `TPU-optimized inference`：使用 `TPUs` 加速部署。\n\n使用 Vertex AI 托管 NLP 模型\n\n`Vertex\
    \ AI` 简化了部署流程并与 `TensorFlow`、`PyTorch` 和 `ONNX` 良好集成。\n\n**步骤 1：转换并保存模型**\n将 `Hugging\
