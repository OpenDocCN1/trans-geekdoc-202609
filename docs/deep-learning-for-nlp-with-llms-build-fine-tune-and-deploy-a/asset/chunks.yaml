- raw: "Traditional search methods like TF-IDF and BM25 rely on lexical matching,\
    \ often missing semantic meaning. RAG outperforms these methods by:\n\n●        Understanding\
    \ Context: Uses embeddings for semantic retrieval.\n\n●        Reducing Hallucination:\
    \ LLMs rely on real-world information rather than generating guesses.\n\n●        Enhancing\
    \ Accuracy: Provides more relevant and factually grounded answers.\n\n1.3 How\
    \ Does RAG Work?\n\n1.  Convert documents into vector embeddings using a pre-trained\
    \ model (e.g., BERT, OpenAI’s text-embedding-ada-002).\n\n2.  Store embeddings\
    \ in a vector database (e.g., FAISS, Pinecone, Chroma).\n\n3.  Retrieve the most\
    \ relevant documents based on user queries.\n\n4.  Feed retrieved documents into\
    \ an LLM for response generation.\n\n* * *\n\n2\\. Setting Up the RAG-Based Retrieval\
    \ System\n\n2.1 Installing Dependencies\n\nbash\n\npip install transformers torch\
    \ sentence-transformers faiss-cpu langchain chromadb fastapi uvicorn\n\n2.2 Loading\
    \ Pretrained Embedding Model\n\nWe use sentence-transformers to generate dense\
    \ vector embeddings for documents.\n\npython\n\nfrom sentence\\_transformers import\
    \ SentenceTransformer\n\n\\# Load embedding model\n\nembedding\\_model = SentenceTransformer(\"\
    all-MiniLM-L6-v2\")\n\ndef get\\_embedding(text):\n\n\"\"\"Generates vector embedding\
    \ for a given text.\"\"\"\n\nreturn embedding\\_model.encode(text, convert\\_to\\\
    _tensor=True)\n\n* * *\n\n3\\. Indexing Documents in a Vector Database\n\n3.1\
    \ Choosing a Vector Store\n\nPopular vector databases for efficient similarity\
    \ search:\n\n●        FAISS – Fast and efficient for local use.\n\n●        ChromaDB\
    \ – Simple, lightweight, and scalable.\n\n●        Pinecone – Cloud-based, scalable\
    \ solution.\n\nWe will use FAISS for local development.\n\n3.2 Creating and Indexing\
    \ a Document Store\n\npython\n\nimport faiss\n\nimport numpy as np\n\nclass DocumentStore:\n\
    \ndef \\_\\_init\\_\\_(self, embedding\\_dim=384):\n\n\"\"\"Initializes a FAISS\
    \ index for document retrieval.\"\"\"\n\nself.index = faiss.IndexFlatL2(embedding\\\
    _dim)\n\nself.documents = \\[\\]\n\ndef add\\_documents(self, docs):\n\n\"\"\"\
    Indexes documents by converting them into vector embeddings.\"\"\"\n\nembeddings\
    \ = np.array(\\[get\\_embedding(doc) for doc in docs\\])\n\nself.index.add(embeddings)\n\
    \nself.documents.extend(docs)\n\ndef search(self, query, top\\_k=3):\n\n\"\"\"\
    Retrieves top-k similar documents for a given query.\"\"\"\n\nquery\\_embedding\
    \ = get\\_embedding(query).numpy().reshape(1, -1)\n\ndistances, indices = self.index.search(query\\\
    _embedding, top\\_k)\n\nreturn \\[self.documents\\[idx\\] for idx in indices\\\
    [0\\]\\]\n\n\\# Example usage\n\ndocs = \\[\"AI is transforming industries.\"\
    , \"Climate change is a global challenge.\", \"Python is a popular programming\
    \ language.\"\\]\n\ndoc\\_store = DocumentStore()\n\ndoc\\_store.add\\_documents(docs)\n\
    \nquery = \"Tell me about AI\"\n\nresults = doc\\_store.search(query)\n\nprint(\"\
    Retrieved Documents:\", results)\n\nExplanation:\n\n●        Documents are converted\
    \ into embeddings and stored in FAISS.\n\n●        Queries are transformed into\
    \ embeddings and matched against stored documents.\n\n●        FAISS returns the\
    \ most similar documents for the given query.\n\n* * *\n\n4\\. Integrating LLM\
    \ for Response Generation\n\n4.1 Using OpenAI’s GPT-4 for Response Augmentation\n\
    \npython\n\nimport openai\n\nopenai.api\\_key = \"your\\_openai\\_api\\_key\"\n\
    \ndef generate\\_response(query):\n\n\"\"\"Retrieves relevant documents and generates\
    \ a response using an LLM.\"\"\"\n\nretrieved\\_docs = doc\\_store.search(query)\n\
    \ncontext = \" \".join(retrieved\\_docs)\n\nprompt = f\"Context: {context}\\\\\
    n\\\\nQuestion: {query}\\\\n\\\\nAnswer:\"\n\nresponse = openai.ChatCompletion.create(\n\
    \nmodel=\"gpt-4\",\n\nmessages=\\[{\"role\": \"system\", \"content\": \"You are\
    \ an AI assistant.\"},\n\n{\"role\": \"user\", \"content\": prompt}\\]\n\n)\n\n\
    return response\\[\"choices\"\\]\\[0\\]\\[\"message\"\\]\\[\"content\"\\]\n\n\\\
    # Example usage\n\nquery = \"How is AI impacting industries?\"\n\nprint(\"Response:\"\
