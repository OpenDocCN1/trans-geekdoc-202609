    \ feature independence, it is called \"naïve\". Despite this assumption, it performs\
    \ well in text classification tasks.\n\nVariants of Naïve Bayes\n\n| Model ||\
    \ Description || Best for |\n\n| --- | --- | --- |\n\n| Multinomial Naïve Bayes\
    \ || Assumes word frequencies follow a multinomial distribution || Text classification,\
    \ spam filtering |\n\n| Bernoulli Naïve Bayes || Uses binary word presence/absence\
