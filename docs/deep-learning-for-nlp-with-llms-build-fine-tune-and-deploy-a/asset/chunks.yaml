- raw: '### 4.2 Attention Mechanisms and Their Impact on NLP


    Traditional sequential models such as recurrent neural networks (RNNs), long short-term
    memory networks (LSTMs), and gated recurrent units (GRUs) suffer from limitations
    when dealing with long-range dependencies. As sequence lengths increase, these
    models struggle to retain and process relevant context effectively.


    Attention mechanisms revolutionized NLP by allowing models to dynamically focus
    on the most relevant parts of an input sequence, enabling them to handle long-range
    dependencies more efficiently. This advancement laid the foundation for modern
    transformer-based architectures, which dominate state-of-the-art NLP tasks today.


    * * *


    4.2.1 Challenges with Traditional Sequential Models


    RNNs, LSTMs, and GRUs process text sequentially, meaning each token in a sequence
    is processed step-by-step. This leads to several challenges:


    1.  Long-range dependency issues: As sequences grow, early words in a sentence
    become harder to retain in memory.


    2.  Vanishing gradient problem: Gradients diminish as they propagate backward,
    limiting effective learning of distant dependencies.


    3.  Fixed-length context vector: In standard Seq2Seq models, the encoder compresses
    the entire sequence into a single vector, which may fail to capture all relevant
    information.


    These challenges made it necessary to introduce a mechanism that could dynamically
    focus on different parts of an input sequence. This is where attention mechanisms
    come in.


    * * *


    4.2.2 Understanding Attention Mechanisms


    Attention mechanisms allow the model to assign different importance (weights)
    to different parts of an input sequence while generating an output. Instead of
    encoding the entire sequence into a single vector, attention dynamically selects
    the most relevant information at each decoding step.


    Mathematical Formulation of Attention


    Given:


    ●        An input sequence X = (x₁, x₂, ..., xₙ)


    ●        A query vector q representing the current decoding step


    The attention score for each input token xₜ is computed as:


    ![](image_rsrc7KY.jpg)


    where f is a scoring function that determines the relevance of xₜ given q. The
    most common scoring functions include:


    1.  Dot-product attention:


    ![](image_rsrc7KZ.jpg)


    2.  Additive attention (Bahdanau Attention):


    ![](image_rsrc7M0.jpg)


    3.  Scaled dot-product attention (used in Transformers):


    ![](image_rsrc7M1.jpg)


    The scores are then normalized using the softmax function to obtain attention
    weights:


    αt​= exp(score(xt​,q))​


    ∑j=1n​exp(score(xj​,q))


    The final context vector is computed as the weighted sum of input tokens:


    ![](image_rsrc7M2.jpg)


    This context vector c is passed to the decoder, allowing it to focus on the most
    relevant parts of the sequence at each step.


    * * *


    4.2.3 Types of Attention


    1\. Bahdanau Attention (Additive Attention)


    Introduced in Neural Machine Translation by Jointly Learning to Align and Translate
    (Bahdanau et al., 2014), additive attention computes scores using a feedforward
    neural network.


    2\. Luong Attention (Multiplicative Attention)


    Introduced by Luong et al. (2015), multiplicative attention computes scores using
    a dot product between the query and input vectors. This is computationally more
    efficient than additive attention.


    3\. Self-Attention (Used in Transformers)


    Unlike Bahdanau and Luong attention, which operate in encoder-decoder architectures,
    self-attention allows each token in a sequence to attend to every other token.
    This is the foundation of modern transformer models.


    * * *


    4.2.4 Implementing Attention Mechanisms in PyTorch


    Implementing Bahdanau Attention


    python


    import torch


    import torch.nn as nn


    class BahdanauAttention(nn.Module):


    def \_\_init\_\_(self, hidden\_size):


    super(BahdanauAttention, self).\_\_init\_\_()


    self.W = nn.Linear(hidden\_size, hidden\_size, bias=False)


    self.U = nn.Linear(hidden\_size, hidden\_size, bias=False)


    self.v = nn.Linear(hidden\_size, 1, bias=False)


    def forward(self, hidden, encoder\_outputs):


    \# Expand hidden state to match encoder output size


    hidden = hidden.unsqueeze(1).repeat(1, encoder\_outputs.size(1), 1)


    \# Compute attention scores


    scores = self.v(torch.tanh(self.W(hidden) + self.U(encoder\_outputs)))


    \# Apply softmax to get attention weights


    attn\_weights = torch.softmax(scores, dim=1)


    \# Compute context vector


    context = torch.sum(attn\_weights \* encoder\_outputs, dim=1)


    return context, attn\_weights


    \# Example Usage


    hidden\_size = 256


    attention = BahdanauAttention(hidden\_size)


    encoder\_outputs = torch.rand(32, 10, hidden\_size)  # Batch of 32, sequence length
    10


    decoder\_hidden = torch.rand(32, hidden\_size)


    context, attn\_weights = attention(decoder\_hidden, encoder\_outputs)


    * * *


    Implementing Self-Attention (Scaled Dot-Product Attention)


    python


    class ScaledDotProductAttention(nn.Module):


    def \_\_init\_\_(self, d\_k):


    super(ScaledDotProductAttention, self).\_\_init\_\_()


    self.d\_k = d\_k


    def forward(self, Q, K, V, mask=None):


    scores = torch.matmul(Q, K.transpose(-2, -1)) / torch.sqrt(torch.tensor(self.d\_k,
    dtype=torch.float32))


    if mask is not None:


    scores = scores.masked\_fill(mask == 0, float(''-inf''))


    attn\_weights = torch.softmax(scores, dim=-1)


    return torch.matmul(attn\_weights, V), attn\_weights


    \# Example Usage


    d\_k = 64


    attention = ScaledDotProductAttention(d\_k)


    Q = torch.rand(32, 10, d\_k)  # Query


    K = torch.rand(32, 10, d\_k)  # Key


    V = torch.rand(32, 10, d\_k)  # Value


    context, attn\_weights = attention(Q, K, V)


    * * *


    4.2.5 Impact of Attention on Modern NLP


    The introduction of attention mechanisms transformed NLP:


    ●        Machine Translation: Attention-based models outperform traditional Seq2Seq
    approaches.


    ●        Text Summarization: Attention enables models to focus on the most important
    parts of a document.


    ●        Question Answering: Self-attention allows models to dynamically extract
    relevant context.


    ●        Transformers: The self-attention mechanism powers models like BERT and
    GPT.


    * * *


    ### 4.3 Sequence-to-Sequence Models


    Sequence-to-sequence (Seq2Seq) models form the foundation of various NLP tasks,
    including machine translation, text summarization, and conversational AI. These
    models process an input sequence and generate an output sequence, potentially
    of different lengths, making them a powerful framework for handling sequential
    data.


    * * *


    4.3.1 Understanding Sequence-to-Sequence Models


    A Seq2Seq model consists of two main components:


    1.  Encoder: Processes the input sequence and compresses it into a context vector.


    2.  Decoder: Uses the context vector to generate the output sequence.


    A common example is machine translation, where an English sentence (input) is
    converted into a French sentence (output).


    Limitations of Basic Seq2Seq Models


    Early Seq2Seq models relied on fixed-length context vectors, leading to:


    ●        Loss of important information for long sequences.


    ●        Poor handling of long-range dependencies.


    ●        Struggles with variable-length sequences.


    To address these limitations, attention mechanisms were introduced, enabling models
    to focus on different parts of the input dynamically.


    * * *


    4.3.2 Architecture of a Seq2Seq Model


    A typical Seq2Seq model consists of:


    1\. Encoder


    The encoder processes an input sequence (x₁, x₂, ..., xₙ) using an RNN, LSTM,
    or GRU and generates a hidden state at each step:


    ![](image_rsrc7M3.jpg)


    where:


    ●        ht\_tht​ is the hidden state at time step t.


    ●        xt\_txt​ is the input token at time t.


    ●        f is the recurrence function (RNN, LSTM, or GRU).


    The final hidden state is passed to the decoder as the context vector.


    2\. Decoder


    The decoder generates an output sequence (y₁, y₂, ..., yₘ) one step at a time.
    At each step, it takes:


    ●        The previous output token.


    ●        The previous hidden state.


    ●        The encoder’s context vector.


    It then predicts the next token:


    yt​=g(yt−1​,st−1​,c)


