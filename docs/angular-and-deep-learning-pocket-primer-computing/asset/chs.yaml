  \n本章向你展示了如何使用 HTML5 表单创建 Angular 应用，以及包含 Angular 控件和 `FormGroups` 的表单。你还学习了如何在本地存储中保存表单数据。接下来，你学习了\
  \ Angular 管道（Pipes），以及一个展示如何实现该功能的示例。\n\n你还学习了 Angular 服务（Services），并通过一个说明如何使用\
  \ `Services` 的示例。接下来，你看到了一个 `Http` 类中 `http()` 方法（返回一个 `Observable`）的示例，用于获取任何 GitHub\
  \ 用户的数据并在用户列表中显示这些数据的部分。最后，你学习了如何读取一个带有数值数据的 CSV 文件，并用它来生成和显示 SVG 折图。\n\n# 第 4 章\n\
  \n## 深度学习简介\n\n本章向你介绍了深度学习，它包含了 `MLPs`（多层感知器）和 `CNNs`（卷积神经网络）。第 5 章包含关于更复杂的深度学习架构的信息，例如\
  \ `RNNs`（循环神经网络）和 `LSTMs`（长短期记忆网络）。本章大部分内容是描述性的，并包含一些基于 Keras 代码示例，这些示例假设你已经阅读了之前章节中关于\
  \ Keras 的材料。本章旨在对一系列化的主题进行简要介绍，并提供指向额外信息的链接。\n\n如果你是深度学习的新手，本章中的许多主题可能需要你额外学习才能熟练掌握：可以将本章看作是通往深度学习大师的一小步。\n\
  \n本章的第一部分简要讨论了深度学习、它能够解决的问题以及未来的挑战。本章的第二部分简要介绍了感知器，它们本质上是神经网络的核心构建模块。`ANNs`、`MLPs`、`RNNs`、`LSTMs`\
  \ 和 `VAEs` 都是基于包含多个感知器的多层结构。\n\n本章的第三部分提供了 `CNNs` 的介绍，随后是一个使用 `MNIST` 数据集训练基于 Keras\
  \ 的 `CNN` 示例：如果你读过第 5 章中关于激活函数的章节，这段代码示例将更易理解。\n\n### Keras 与 XOR 函数\n\nXOR 函数（异或）是一个广为人知的函数，它在平面上不是线性可分的。`XOR`（“异或”）函数的真值表非常直观：给定两个二值输入，如果最多有一个输入为\
  \ 1，则输出为 1；否则输出为 0。如果我们把 `XOR` 视为具有两个二值输入的函数的名称，输出如下：\n\n```\nXOR(0,0) = 0\nXOR(1,0)\
  \ = 1\nXOR(0,1) = 1\nXOR(1,1) = 0\n```\n\n我们可以将输出值视为与输入值相关的标签。具体来说，点 (0,0) 和 (1,1)\
  \ 属于类 0，点 (1,0) 和 (0,1) 属于类 1。在平面上画出这些点，你会得到一个正方形的四个顶点，左下顶点为原点。此外，每对对角元素属于同一类，这使得\
  \ `XOR` 函数在平面上是非线性可分的。如果你对此怀疑，可以尝试在欧几里得平面上为 `XOR` 函数寻找一个线性分割器。\n\n列表 4.1 显示了 `tf2_keras_xor.py`\
  \ 的内容，展示了如何创建一个基于 Keras 的 `NN` 来训练 `XOR` 函数。\n\n列表 4.1：`tf2_keras_xor.py`\n\n```python\n\
  import tensorflow as tf\nimport numpy as np\n\n# 逻辑异或运算符和“真”值：\nx = np.array([[0.,\
  \ 0.], [0., 1.], [1., 0.], [1., 1.]])\ny = np.array([[0.], [1.], [1.], [0.]])\n\
  model = tf.keras.models.Sequential()\nmodel.add(tf.keras.layers.Dense(2, input_dim=2,\
  \ activation='relu'))\nmodel.add(tf.keras.layers.Dense(1))\nprint(\"compiling model...\"\
  )\nmodel.compile(loss='mean_squared_error', optimizer='adam')\nprint(\"fitting model...\"\
  )\nmodel.fit(x,y,verbose=0,epochs=1000)\npred = model.predict(x)\n\n# 测试最终预测\nprint(\"\
  Testing XOR operator\")\np1 = np.array([[0., 0.]])\np2 = np.array([[0., 1.]])\n\
  p3 = np.array([[1., 0.]])\np4 = np.array([[1., 1.]])\nprint(p1,\":\", model.predict(p1))\n\
  print(p2,\":\", model.predict(p2))\nprint(p3,\":\", model.predict(p3))\nprint(p4,\"\
  :\", model.predict(p4))\n```\n\n列表 4.1 初始化了 NumPy 数组 `x`，其包含 0 和 1 的四种组合数字对，随后是\
  \ NumPy 数组 `y`，它包含 `x` 中每对数字的逻辑异或结果。\n\n列表 4.1](#11_Ch04.xhtml#list-4-1) 的部分定义了一个具有两个\
  \ `Dense` 层的基于 Keras 的模型。接下来，对模型进行编译和训练，然后根据训练后的模型填充预测值变量 `pred`。\n\n下一个代码块初始化了点\
  \ `p1`、`p2`、`p3` 和 `p4`，然后显示这些点的预测值。运行列表 4.1 中代码的输出为：\n\n```\ncompiling model...\n\
  fitting model...\nTesting XOR operator\n[[0. 0.]: [0.00154321]\n[[0. 1.]: [0.99821456]\n\
  [[1. 0.]: [0.99812345]\n[[1. 1.]: [0.00165412]\n```\n\n列表 4.1 初始化了 NumPy 数组 `x`，包含\
  \ 0 和 1 的四种组合数字对，随后是 NumPy 数组 `y`，包含 `x` 中每对数字的逻辑异或。\n\n列表 4.1](#11_Ch04.xhtml#list-4-1)\
  \ 的部分定义了一个具有两个 `Dense` 层的基于 Keras 的模型。接下来，对模型进行编译和训练，然后根据训练后的模型填充预测值变量 `pred`。\n\
