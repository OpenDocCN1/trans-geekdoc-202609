  deleteMe(user)\">Delete</button>\n{{user}}\n</li\n</</ul>\n</div>`\n\n})\nexport\
  \ class AppComponent {\nusers = [\"Jane\", \"Dave\", \"Tom\"];\ndeleteMe(user) {\n\
  console.log(\"delete user = \"+user);\nvar index = this.users.indexOf(user);\nif(index\
