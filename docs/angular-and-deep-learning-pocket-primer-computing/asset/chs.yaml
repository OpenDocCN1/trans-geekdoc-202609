  \ 和 `y2` 创建一个 TF 2 数据集，结果数据集无法合并到 `ds1`。\n\n## TF 2 reduce() 运算符\n\nTF 2 `reduce()`\
  \ 运算符对其输入进行归约，直到产生单个值。例如，你可以使用 `reduce()` 运算符相加数组中的所有数字。列表 C.3.4 显示了 `tf2_reduce.py`\
  \ 的内容，演示了如何在 TF 2 中 `reduce()` API。\n\n### 列表 C.3.4：`tf2_reduce.py`\n\n```python\n\
  import tensorflow as tf\nimport numpy as np\n\nx1 = tf.data.Dataset.range(8).reduce(np.int64(0),lambda\
  \ x, _: x + 1)\nx2 = tf.data.Dataset.range(8).reduce(np.int64(0),lambda x, y: x\
  \ + y)\nprint(\"x1:\",x1)\nprint(\"x2:\",x2)\n```\n\n列表 C.3.4 将变量 `x1` 和 `x2` 定义为\
