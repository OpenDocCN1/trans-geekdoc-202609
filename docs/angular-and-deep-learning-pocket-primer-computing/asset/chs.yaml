- "# Angular 与深度学习入门指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n### 目标是什么？\n\n本书的目标向 Web 开发者介绍深度学习，并将这些知识整合到\
  \ Angular 10 应用中。本书旨在快速介绍深度学习的一些基本特性，并对几种流行的深度学习分类器和代码示例进行概述。\n\n本书还将节省你搜索所需的时间。\n\
  \n### 我能从书中学到什么？\n\n前三章涵盖了基础知识。第四章介绍了 `MLPs`。第五章讨论了 `RNNs`、`LSTMs`、`GRUs`、自动编码器\
  \ (`autoencoders`) 和 `GANs`。第六章介绍了 `TensorFlow.js`。\n\n### 本本书需要多少 Keras 知识？\n\n\
  答案取决于你计划深度参与深度学习。接触 `Keras` 有帮助。\n\n### 我需要学习书中的理论部分吗？\n\n同样取决于你计划成为专家程度。\n\n###\
  \ 代码示例是如何生成的？\n\n代码示例是在 `MacBook Pro` 上使用 `Python 3` 和 `Keras` 创建并测试的。\n\n### 启动代码示例：请阅读\n\
  \n由于完整的代码示例需要超过 10GB 的磁盘空间，所有的 `node_modules` 子目录已删除。因此，你需要在每个 Angular 应用根目录下运行以下命令：\n\
  \n```bash\nnpm install\n```\n\nAngular CLI 和 `NodeJS` 的版本号显示在第一章的“安装 Angular CLI”章节，为了方便起见，它们也显示在：\n\
  \n![images](img/Pg13.jpg)\n\nAngular CLI: 10.1.0-next.5\n\nNode: 12.0.0\n\nOS: darwin\
  \ x64\n\nAngular: \n\n... \n\nIvy Workspace: \n\n| 包 | 版本 |\n| --- | --- |\n| \\\
  ---------------------------------------------------- |\n| @angular-devkit/architect\
  \ | 0.1001.0-next.5 |\n| @angular-devkit/core | 10.1.0-next.5 |\n| @angular-devkit/schematics\
  \ | 10.1.0-next.5 |\n| @schematics/angular | 10.1.0-next.5 |\n| @schematics/update\
  \ | 0.1001.0-next.5 |\n| rxjs | 6.6.2 |\n\n\n\n\n\n你可能拥有不同版本的 Angular CLI 和 `Node`，如果它们与上方显示的版本号接近，它们可能也能正常工作。\n\
  \n另一个需要注意的点是：第 3 章中的几个代码示例是通过额外的手动调用 `npm` 创建的，这意味着这些目录中的 `package.json` 文件与默认的略有不同。因此，请勿将\
  \ `package.json` 从一个代码示例复制到另一个代码示例中。\n\n万一你用该文件的另一份副本覆盖了 `package.json`，那么那些涉及额外命令行调用的代码示例将在\
  \ `app.component.ts` 中包含以下注释，该注释已**加粗**显示以确保你注意到它：\n\n```\n// remember: npm install\
  \ jquery --save\n```\n\n如果 `app.component.ts` 文件中没有此类注释行，那么你只需要在命令行中运行一次 `npm install`\
  \ 即可。\n\n### 运行 npm 后遇到错误：我该怎么办？\n\n在代码示例中运行 `npm install` 时可能出现如下潜在错误：\n\n```\n\
  An unhandled exception occurred: Could not find module \"@angular-devkit/build-angular\"\
  \n```\n\n第一步涉及删除 `package-lock.json` 文件：\n\n```\nrm package-lock.json\n```\n\n第二步是将上述错误消息中列出的包（Angular\
  \ 6 中引入）作为依赖安装，这涉及以下命令：\n\n```\nnpm install --save-dev @angular-devkit/build-angular\n\
  ```\n\n第三步涉及标准的 `npm` 调用：\n\n```\nnpm install\n```\n\n还可能由于各种原因出现其他错误（例如 Angular\
  \ CLI 版本不同），在这些情况下，请进行网络搜索，很有可能其他人也遇到过相同的错误，并有相应的解决方案。\n\n### 本书的技术准备要求是什么？\n\n\
  对于本书的深度学习部分，熟悉基础的 `Python` 有帮助，此外了解如何从命令行启动 `Python` 代码（对于 Mac 用户，是在类 Unix 环境下）也是有用的。此外，对基础线性代数（向量和矩阵）、概率/统计学（平均值、中位数、标准差）以及微积分基础概念（如导数）的通用熟悉有时有助于理解书中的内容。\n\
  \n关于本书的 Angular 部分，你需要熟悉 `TypeScript` 以及 `RxJS` 和 `Observables`（流）。由于 `RxJS` 是 FRP（函数式响应式编程）的一种基于\
  \ JavaScript 的实现，对后者的某些知识将特别有用。\n\n另一个准备条件对于理解书后半部分的代码示例至关重要：对神经网络有一定的熟悉，这包括隐藏层和激活函数的概念（即使你并不完全理解它们）。\n\
  \n### 本书的非技术准备要求是什么？\n\n虽然这个问题的答案难以量化，但拥有学习深度学习的强烈渴望，以及阅读和理解代码示例的动力和自律是非常重要的。即使是简单的机器语言\
  \ API，在第一次遇到时理解它们也具有挑战，因此请准备好阅读几次代码示例。\n\n由于你可能是一个开发者，你也知道如何利用在线资源获取额外帮助，例如在理解特定细节时查阅文档，或者在代码中遇到错误时访问\
  \ `stackoverflow`。\n\n### 如何设置命令行终端？\n\n如果你是 Mac 用户，有三种方法。第一种方法是使用 Finder（访达）导航到\
  \ `Applications > Utilities`，然后双击 `Utilities` 应用程序。接下来，如果你已经有一个可用的终端，可以通过输入以下命令启动一个新的终端：\n\
  \n```\nopen /Applications/Utilities/Terminal.app\n```\n\nMac 用户的第二种方法是在已可见的终端中通过简单点击\
  \ `command+n` 在 MacBook 上打开一个新的终端，你的 Mac 将启动另一个终端。\n\n如果你是 PC 用户，可以安装 `Cygwin`（开源\
  \ `https://cygwin.com`）来模拟 `bash` 命令，或者使用其他工具包如 `MKS`（商业产品）。请阅读描述下载和安装过程的在线文档。注意，如果自定义别名定义主启动文件（如\
  \ `.bash_login`）之外的文件中，则不会被自动设置。\n\n### 辅助文件\n\n书中的所有代码示例和图表都可以通过邮件向出版社邮箱 `info@merclearning.com`\
  \ 获取。\n\n### 完成此书后的“后续步骤”是什么？\n\n这个问题的答案差异很大，主要因为答案很大程度上取决于你的目标。如果你主要对 Angular 感兴趣，你可以学习更多可以整合到新应用程序中的高级功能。如果你主要对深度学习感兴趣，有许多资源可用，你可以对这些资源进行网络搜索。深度学习的方面取决于你的身份：深度学习工程师、数据科学家、经理、学生或软件开发者。\n\
  \nO. Campesato 2020 年 10 月\n\n第 1 章：Angular 快速介绍\n\n本章提供了基于 Angular 应用程序的快速介绍。虽然许多代码示例非常直观，但请记住，你需要投入额外的时间和精力来更深入地理解\
  \ Angular。\n\n书中代码示例的目的是说明 Angular 的一些基本功能，稍后将学习深度学习概念，让你能够将深度学习整合到应用程序中。\n\n另一个重要因素是你的学习风格：在深入研究第一个代码示例之前，你可能倾向于阅读关于\
  \ Angular 应用程序“脚架”的细节。然而，快速浏览本章的介绍部分，直接进入 Angular 代码代码，之后回顾初始部分也是完全可以的。\n\n本章的第一部分讨论了\
  \ Angular 设计目标以及各种功能，如组件、模块和单向数据绑定。第二部分讨论了 Angular CLI，这是一个用于生成 Angular 应用程序的命令行工具。\n\
  \n注意：*书中的 Angular 应用程序基于 Angular 10，使用 `ng` 命令行工具创建 Angular 应用程序。*\n\n\n\n\n\nAngular\
  \ 中的两个重要技术是 `TypeScript` 和 `RxJS`。用通俗的话说，`TypeScript` 可能会让你想起将 `JavaScript` 与经典的面向对象方法结合起来。如果你已经熟悉\
  \ `Java`，你可能会觉得使用 `TypeScript` 比 `JavaScript` 更加自在。\n\n`RxJS` 是基于 JavaScript 的 FRP（函数响应式编程），它支持许多中间操作符，例如\
  \ `filter()`、`map()`、`take()` 以及许多其他有用操作符。接下来的子章节包含关于 `TypeScript` 和 `RxJS` 的更多细节。\n\
  \n# 学习 TypeScript\n\n强烈建议掌握 `TypeScript` 知识，同时需要具备 `NodeJS`（即 `npm` 工具）和 `ES6` 的基础能力。Angular\
  \ 应用程序是用 `node v6.14.7` 和 `npm 12.0.0` 创建的，但稍低的版本也可能正常工作。你可以在终端中使用以下命令来确定你机器上的版本：\n\
  \n```bash\nnode -v\nnpm -v\n```\n\n如有必要，请访问 `NodeJS` 主页下载较新版本的 `node` 可执行文件。如果你没有接触过\
  \ `Node`，可以找到许多在线教程解释如何使用基础的 `npm` 命令。\n\n代码示例还涉及 `ES6` 和 `TypeScript` 的基本概念，它们各自的主页包含大量帮助你入门的信息。特别是要学习\
  \ `classes` 和模板字符串（template strings）。正如你你在后续章节中看到的，Angular 应用程序高度依赖动态模板，这通常涉及到变量的插值（通过\
  \ `{{}}` 语法）。此外，以下网站提供了一个在线“游乐场”，以及关于 `TypeScript` 文档和代码示例的链接：\n\n*https://www.typescriptlang.org/play/*\n\
  \nAngular 利用了 `ES6` 特性（如 `components` 和 `classes`）以及属于 `TypeScript` 的特性（如注解和类型系统）。`TypeScript`\
  \ 优于 `ES6`，因为 `TypeScript` 支持 `ES6` 的所有特性，并且 `TypeScript` 提供了一个可选的类型推断系统，可以为你捕捉许多错误。\n\
  \n# 学习 RxJS 和 Observable（观察者）\n\n如果你用过 `ES6`，那么你可能已经熟悉 `filter()` 函数（对于 Angular\
  \ `Pipes` 非常有用）以及 `map()` 函数（在 Angular 的早期版本中经常与 `Observables` 和 `HTTP` 请求一起使用）。其他函数如\
  \ `merge()` 和 `flatten()` 也很有用，你可以根据需要学习这些以及其他函数。\n\n在 `RxJS` 中，这些函数被称为“中间操作符”，你经常会在\
  \ `RxJS Observables` 中遇到它们。用非常简单的话说，你可以定义一个包含一个或多个中间操作符的 `Observable`，然后通过所谓的“终端操作符”调用该\
  \ `Observable`。\n\n不同的语言支持不同的方法作为终端操作符，在 `RxJS` 中，`subscribe()` 方法就是一个终端操作符。`RxJS\
  \ Observables` 比 `Promises` 更强大，对后者的了解将简化你过渡到 `RxJS Observables` 的过程。在你学习了 RxJS\
  \ 的基本功能后，以下（更高级的）包含了关于 `RxJS unsubscribe()` 方法非常有价值的信息：\n\n*[`blog.bitsrc.io/6-ways-to-unsubscribe-from-observables-in-­angular-ab912819a78f`](https://blog.bitsrc.io/6-ways-to-unsubscribe-from-observables-in-­angular-ab912819a78f)*\n\
  \n## Promises 与 Observables\n\n第 2 和第 3 章包含了涉及 `Observables` 的 Angular 应用程序示例。虽然你可以使用\
  \ `Observables`，但也可以使用 `Promises`。\n\n# Angular 概视角\n\nAngular 设计为一个支持服务端渲染的平台。本书的重点是浏览器中的\
  \ Angular 应用程序。Angular 支持最新版本的 Chrome 和 Firefox，以及 Edge、iOS 和 Safari。Angular 框架支持的浏览器列表如下：\n\
  \n*https://angular.io/guide/browser-support*\n\n# 特性简介\n\nAngular 采用基于组件的架构，组件以树形结构组织。Angular\
  \ 还支持强大的技术，你将学习这些技术以精通编写应用程序。这里列了一些重要特性：\n\n*   单向数据绑定\n*   树摇 (tree shaking)\n\
  *   变更检测\n*   样式封装\n\n# Angular 中的单向数据绑定\n\nAngular 将声明式单向绑定作为默认行为（但如果你愿意，也可以切换到双向绑定）。单向绑定充当单向变化传播，可以提高性能并减少代码复杂度。Angular\
  \ 还支持有状态、响应式和不可变模型。\n\nAngular 应用程序涉及定义一个顶层（根）模块，该模块引用一个 `Component`，该组件又指定一个 HTML\
  \ 元素（通过强制性的 `selector` 属性），作为 `Component` 的“父”元素。`Component` 的定义涉及所谓的“装饰器”（decorator），它包含\
  \ `selector` 属性以及 `template` 属性（或 `templateUrl` 属性）。\n\n`template` 属性包含 HTML 和自定义标记的混合，你可以将其放在单独的文件中然后通过\
  \ `templateUrl` 属性引用该文件。此外，`Component` 之后紧跟着 TypeScript 类定义，它包含了“支撑代码”，这些代码与 `template`\
  \ 属性中出现的组件变量相关。\n\n注意：`templateUrl` 属性和 `styleUrls` 属性指的是文件，而 `template` 属性和 `styles`\
  \ 属性指的是内联代码。\n\n\n\n\n\n简而言之，Angular Material 现在提供了新的日期范围选择器，并对其他功能进行了相对微小的更改。`Ivy`\
  \ 渲染器在提高性能和缩小应用体积方面提供了改进。\n\n`Angular 10` 于 2020 年 6 月发布，支持 `TypeScript 3.9`。由于\
  \ `TypeScript 4.0` 已于 2020 年 8 月发布，`Angular 11` 可能会支持该版本（或更新的版本）。如果你感兴趣，可以在这里了解\
  \ `TypeScript 4.0`：\n\n*[`devblogs.microsoft.com/typescript/announcing-typescript-4-0/`](https://devblogs.microsoft.com/typescript/announcing-typescript-4-0/)*\n\
  \n## Angular 10 与严格模式\n\n### `--strict` 选项\n`Angular 10` 的另一个重要变化是支持 `ng` 命令行工具的\
  \ `--strict` 选项，它可以在你的自定义代码中执行更严格的类型检查。例如，以下代码在没有 `--strict` 选项的情况下编译编译：\n\n```\n\
  employees = [];\n```\n\n然而，如果你在创建 Angular 应用时使用了 `--strict` 选项，那么就需要下面的代码片段，因为之前的片段是无效的：\n\
  \n```\nemployees : any;\n```\n\n这些（以及其他）差异已在本章中使用 `--strict` 选项创建的 `Angular 10`\
  \ 应用中注明。请记住，其他章节中的 `Angular 10` 应用都是在没有 `--strict` 选项的情况下创建的。\n\n### Angular 10\
  \ 的 Node 和 npm 工具\n如果你的机器上没有 `node` 工具（它也包含 `npm` 工具），请从此链接下载发行版：\n\n*[`www.npmjs.com/get-npm`](https://www.npmjs.com/get-npm)*\n\
  \n**重要：** `Angular 10` 要求 `node` 可执行文件的版本号在以下范围内内（该范围在 `package.json` 中指定）：\n\n\
  ```\n\"node\": \">=10.9.0 <13.0.0\"\n```\n\n书中的所有 Angular 应用都是使用以下版本的 `npm` 和 `node`\
  \ 工具创建的（`ng` 的版本将在本章稍后显示）：\n\n```\n$ npm --version\n6.14.7\n\n$ node --version\n\
  v12.0.0\n```\n\n在本书出版后，更高版本的 `node` 和 `npm` 可能会兼容 `Angular 10` 应用：`node` 的版本范围可以在\
  \ `package.json` 文件中找到。\n\n## Angular 应用的高层视图\n\n`Angular` 应用由内置组件和自定义组件（后者由你编写）组成，每个组件通常定义在单独的\
  \ TypeScript 文件（扩展名为 `.ts`）中。每个组件使用一个或多个 `import` 语句来包含其依赖。\n\nAngular 提供了多种类型的依赖项，例如指令（directives）和管道（pipes）。`自定义指令`本质上是定义组件的\
  \ TypeScript 文件内容。因此，一个自定义指令由 `import` 语句、`Component` 装饰器和一个导出的 TypeScript 类组成。\n\
  \nAngular 提供了 `内置指令`。`内置指令`包括 `if`、`ngFor`、`switchCase`。管道包括 `asyncPipe`、`datePipe`、`currencyPipe`、`decimalPipe`、`jsonPipe`、`numberPipe`、`percentPipe`、`relativeTimePipe`、`slicePipe`、`lowercasePipe`、`uppercasePipe`、`titlecasePipe`、`timeAgoPipe`、`exponentPipe`、`multiplyPipe`、`dividePipe`、`minPipe`、`maxPipe`、`asyncPipe`、`datePipe`、`currencyPipe`、`decimalPipe`、`jsonPipe`、`numberPipe`、`percentPipe`、`relativeTimePipe`、`slicePipe`、`lowercasePipe`、`uppercasePipe`、`titlecasePipe`、`timeAgoPipe`、`exponentPipe`、`multiplyPipe`、`dividePipe`、`minPipe`、`maxPipe`。（等待，此处此处重复了，保留了核心逻辑）。\n\
  \n`自定义指令`本质上是定义组件的 TypeScript 文件内容。因此，一个自定义指令由 `import` 语句、`Component` 装饰器和一个导出的\
  \ TypeScript 类组成。\n\nAngular 提供了 `内置指令`。`内置指令`包括 `if`、`ngFor`、`switchCase`。管道包括\
  \ `asyncPipe`、`datePipe` 等等。\n\n## Angular CLI\n\n`Angular CLI` 是一个用于创建、构建和测试 Angular\
  \ 应用的命令行工具。\n\n### 安装 Angular CLI\n如果你的机器上没有 `ng` 工具，请从这里下载最新版本：\n\n*[`angular.io/cli`](https://angular.io/cli)*\n\
  \n如果你的机器上已经有了 `ng` 工具，可以通过以下方式升级到最新版本：\n\n```\nng update @angular/cli\n```\n\n如果你在创建\
  \ Angular 过程中遇到问题，可能还需要卸载旧版本的 CLI：\n\n```\nsudo npm uninstall -g angular-cli own\n\
  ```\n\n接下来，使用此命令安装新的 CLI：\n\n```bash\nsudo npm install -g @angular/cli\n```\n\n\
  `Angular CLI` 是一个用于创建、构建和测试 Angular 应用的命令行工具。\n\n### 验证安装\n要找到 `ng` 可执行文件的位置，请使用：\n\
  \n```\nwhich ng\n```\n\n如果 `which ng` 显示空行，说明包含 `ng` 可执行文件的目录未包含在 `PATH` 中。在这种情况下，输入以下命令：\n\
  \n```bash\nexport PATH=/Users/owner/.npm-global/bin:$PATH\n```\n\n现在通过调用命令显示 CLI\
  \ 各组件的版本：\n\n```\nng --version\n```\n\n在本书出版时，上述命令的输出与下面所示类似：\n\n![images/Pg25.jpg)\n\
  \n```\nAngular CLI: 10.1.0-next.5\nNode: 12.0.0\nOS: darwin x64\nAngular: \nWorkspace:\
  \ \n\n| Package | Version |\n| --- | --- |\n| --------------------------------------\
  \ |\n| @angular-devkit/architect | 0.1001.0-next.5 |\n| @angular-devkit/core | 10.1.0-next.5\
  \ |\n| @angular-devkit/schematics | 10.1.0-next.5 |\n| @schematics/angular | 10.1.0-next.5\
  \ |\n| @schematics/update | 0.1001.0-next.5 |\n| rxjs | 6.6.2 |\n```\n\n\n\n\n\n\
  * `deploy`: 为指定项目或工作区中的默认项目调用部署构建器\n* `config`: 在工作区的 `angular.json` 文件中检索或设置 Angular\
  \ 配置值\n* `doc (d)`: 在浏览器中打开 Angular 官方文档 (`angular.io`)，并搜索给定的关键词\n* `e2e (e)`:\
  \ 构建并运行一个 Angular 应用程序，然后使用 `Protractor` 运行端到端测试\n* `generate (g)`: 基于架构图（schematic）生成和或修改文件\n\
  * `help`: 列出可用命令及其简短描述\n* `lint (l)`: 对给定项目文件夹中的 Angular 应用代码运行代码检查工具\n* `new (n)`:\
  \ 创建一个新的工作区和初始 Angular 应用程序\n* `run`: 运行项目中定义的带有可选自定义构建配置的 `Architect` 目标\n* `serve\
  \ (s)`: 构建并运行你的应用，并在文件更改时重新构建\n* `test (t)`: 在项目运行运行单元测试\n* `update`: 更新你的应用程序及其依赖项\n\
  * `version(v)`: 输出 Angular CLI 版本\n* `i18n (i18n-extract)`: 从源代码中提取 i18n 消息\n\n\
  如需详细帮助，请输入 `ng [command name] --help`。\n\n`ng g` 选项等同于 `ng generate` 选项，允许你生成 Angular\
  \ `Component`、Angular `Pipe`（在第 5 章讨论）等。`ng i18n` 选项从源代码中提取 i18n 消息。下一节将展示在应用程序中生成\
  \ Angular `Component` 的示例以及自动生成的文件。\n\n默认前缀是 `app`（例如 `<app-root>`），但你可以通过此指定不同的前缀：\n\
  \n```\nng new app-root --prefix abc\n```\n\n注意：*通过 `ng` 创建的 Angular 应用包含 `src/app`\
  \ 目录。*\n\n关于升级 Angular CLI 信息请访问：[`github.com/angular/cli`](https://github.com/angular/cli)\n\
  \nAngular CLI 的文档请访问：[`cli.angular.io`](http://cli.angular.io)\n\n现在你已经了解了 `ng`\
  \ 工具的一些功能，让我们创建一个第一个 Angular 应用程序，这是本节的主题。\n\n# Hello World 应用程序\n\n正如你将发现的，可以使用少量的自定义代码创建许多基础\
  \ Angular 应用程序。当你准备创建中等规模的应用程序时，可以利用 Angular 基于组件的特性来增量地添加新组件（以及模块）。\n\n现在，通过进入合适的目录并调用以下命令创建一个名为\
  \ `HelloWorld` 的新项目：\n\n```\nng new HelloWorld\n```\n\n此外，在创建 Angular 应用时支持 `--strict`\
  \ 选项，示例如下：\n\n```\nng new --strict HelloWorld\n```\n\n上述命令会在 Angular 应用中产生更严格的类型检查，你将在本章稍后看到。如果你在指定命令行选项时遇到困难，可以回到创建创建\
  \ Angular 应用的方式。\n\n注意：*本章中通过 `ng` 工具创建的前三个 Angular 应用指定了 `--strict` 参数。*\n\n# Angular\
  \ 应用程序结构\n\nAngular CLI 提供了除了你的自定义代码之外的一切。其次，Angular CLI 允许你生成新的组件、路由器等，这在启动应用程序中是可以实现的。第三，Angular\
  \ CLI 纯基于 TypeScript，生成的应用程序包含了 `tsconfig.json`、`tslint.json`、`typedoc.json` 和 `typings.json`\
  \ JSON 文件。\n\n最相关的文件是 `package.json` 和 `angular.json`，而创建自定义代码最重要的目录是 `src` 目录（这些在前面的列表中已加粗）。通常，你不需要修改这两个文件中的任何一个。正如你在本章后面看到的，当你处理基于\
  \ D3 的图形时，需要从命令行执行额外步骤。\n\n以下是 HelloWorld Angular 应用程序根目录的文件和目录列表：\n\n* `node_modules`\n\
  * `package-lock.json`\n* `README.md`\n* `angular.json`\n* `e2e`\n* `karma.conf.js`\n\
  * `package.json`\n* `src`\n* `tsconfig.app.json`\n* `tsconfig.json`\n* `tsconfig.spec.json`\n\
  * `tslint.json`\n\n## src/app 子目录中的主要文件（概述）\n\n`src` 子目录包含目录和文件的组合，如下：\n\n* `app`\n\
  * `assets`\n\n\n\n\n\n`environments`\n\n`favicon.ico`\n\n`index.html`\n\n`main.ts`\n\
  \n`polyfills.ts`\n\n`styles.css`\n\n`test.ts`\n\n注意，上述列表包含了 TypeScript 文件 `main.ts`，它将在本章后面进行讨论。\n\
  \n接下来，`src/app` 子目录包含你的自定义代码，`src/assets` 子目录包含其他资源，例如 `JSON` 文件。稍后，你将看到一个 Angular\
  \ 的示例，它读取 `authors.json` 的内容，该文件位于 `src/assets` 子目录。\n\n以下列表显示了 `src/app` 子目录的内容：\n\
  \n`app.component.css`\n\n`app.component.html`\n\n`app.component.spec.ts`\n\n`app.component.ts`\n\
  \n`app.module.ts`\n\n`package.json`\n\n除非另有说明，否则你可以删除书中每个代码示例中 `app.component.html`\
  \ 的内容。`app.component.ts` 文件包含特定于你的 Angular 应用的 TypeScript 代码，而 `app.module.ts` 文件指定了\
  \ Angular 应用中的任何依赖项，这些依赖项可以包括 Angular 模块以及自定义模块（你将在第 3 章中看到示例）。\n\n三个 TypeScript\
  \ 文件 `main.ts`、`app.component.ts` 和 `app.module.ts` 分别是 Angular 应用的引导文件、主模块和主组件类。\n\
  \n以下是关于这三个文件用途的简化说明：Angular 使用 `main.ts` 作为初始“入口点”来引导 Angular 模块 `AppModule`（定义在\
  \ `app.module.ts` 中），该模块转引用主组件 `AppComponent`（定义在 `app.component.ts` 中）以及你导入到 `AppModule`\
  \ 中的任何其他自定义组件（和模块）。\n\n## 三个文件的内容\n\n上一节简要描述了 Angular 应用中处理文件的顺序。书中的代码示例涉及 TypeScript\
  \ 文件 `app.component.ts` 中的自定义代码，有时涉及更新 `app.module.ts` 文件的内容，但不需要修改 `main.ts` 文件。接下来的章节将显示这三个文件的内容，并对其内容进行简要描述。\n\
  \n### main.ts 引导文件\n\n`Listing 1.1` 显示了 `src` 子目录（而非 `src/app` 子目录）中的 `main.ts`\
  \ 内容，它导入并引导了顶层 Angular 模块 `AppModule`。Angular 应用具有基于组件的架构，这看起来可能比其他框架更复杂。然而，这种架构允许开发团队并行处理复杂应用程序的不同部分。\n\
  \nLISTING 1.1: main.ts\n\n```typescript\nimport { enableProdMode } from '@angular/core';\n\
  \nimport { platformBrowserDynamic } from '@angular/platform-browser-dynamic';\n\n\
  import { AppModule } from './app/app.module';\n\nimport { environment } from './environments/environment';\n\
  \nif (environment.production) {\n  enableProdMode();\n}\n\nplatformBrowserDynamic().bootstrapModule(AppModule)\n\
  \ .catch(err => console.error(err));\n```\n\n`Listing 1.1` 中的第一行代码是一个导入语句，它是代码列表后部分条件逻辑判断是必需的。第二个导入语句出现在许多\
  \ Angular 代码示例中，它对于在桌面电脑和笔记本电脑上启动 Angular 应用是必要的。\n\n第三个导入语句涉及 Angular 应用的顶层模块，该模块转而包含在此\
  \ Angular 模块中的所有自定义组件和服务。第四个导入语句包含了环境相关信息，用于下一个条件逻辑代码段：如果当前应用处于生产模式，则执行 `enableProdMode()`\
  \ 函数。\n\n最后一行代码是实际的引导过程，涉及在浏览器中渲染 `app.component.ts` 中的代码。\n\n### app.component.ts\
  \ 文件\n\n`Listing 1.2` 显示了 `app.component.ts` 的内容，它说明了 Angular 应用的典型属性。\n\nLISTING\
  \ 1.2: app.component.ts\n\n```typescript\nimport { Component } from '@angular/core';\n\
  \n@Component({\n  selector: 'app-root',\n  templateUrl: './app.component.html',\n\
  \  styleUrls: ['././app.component.css']\n})\n\nexport class AppComponent {\n  title\
  \ = 'HelloWorld';\n}\n```\n\n`Listing 1.2` 开始于对 Angular `@Component` 装饰器的导入语句，以便为\
  \ `AppComponent` 类定义元数据。至少，元数据涉及两个属性：`selector` 和 `template` 或 `templateUrl`。除了与路由相关的组件外，这两个属性在自定义组件都是必须的。在这个示例中，`selector`\
  \ 属性指定了 HTML 页面 `index.html` 中的自定义元素 `app-root`（你可以更改它）。\n\n`templateUrl` 属性指定了一个包含\
  \ HTML 标记的文件，这些标记被插入到自定义元素 `app-root` 中。另一种是 `template` 属性，它包含了插入自定义元素 `app-root`\
  \ 中的 HTML 标记。`Listing 1.2` 的最后一行代码是一个导出语句，使得 `AppComponent` 类可以被其他 TypeScript 文件导入，例如下一节\
  \ `Listing 1.3` 所示的 `app.module.ts`。\n\n尽管 `templateUrl` 属性指定了一个带有标记的 HTML 页面，但书中的\
  \ Angular 代码示例使用 `template` 属性来定义 Angular 应用的 HTML 布局（这就是为什么书中代码示例中的 HTML 页面 `app.component.html`\
  \ 是空的）。\n\n### app.module.ts 文件\n\n`Listing 1.3` 显示了 `app.module.ts` 的内容，显示了 Angular\
  \ 应用中各种模块的依赖项。\n\nLISTING 1.3: app.module.ts\n\n```typescript\nimport { BrowserModule\
  \ } from '@angular/platform-browser';\n\nimport { NgModule } from '@angular/core';\n\
  \nimport { AppComponent } from './app.component';\n\n@NgModule({\n  declarations:\
  \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule\n  ],\n  providers:\
  \ [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule { }\n```\n\n`Listing\
  \ 1.3` 包含了导入 `BrowserModule` 和 `NgModule` 的导入语句。第三个导入语句导入了上一节 `Listing 1.2` 所示的顶层组件类\
  \ `AppComponent`。\n\n注意：Angular 依赖始终包含“@符号”，而自定义依赖项指定相对路径。\n\n接下来，`@NgModule` 装饰器包含一个带有各种属性的对象（将在下一节讨论）。这些属性指定了\
  \ `Listing 1.3` 最后一行代码导出的 `AppModule` 类的元数据。`AppModule` 中的元数据涉及以下数组属性：`imports`、`providers`、`declarations`、`exports`\
  \ 和 `bootstrap`。\n\n在 `Listing 1.3` 中，数组属性 `declarations`、`imports` 和 `bootstrap`\
  \ 非空，而 `providers` 属性为空数组。这些元数据对于 Angular “引导” `AppComponent` 中的代码是必需的，该代码转而包含了渲染的内容（例如一个\
  \ `<h1>` 元素）和渲染的位置（例如 `index.html` 中的 `app-root` 元素）。\n\n现在来看 HTML 页面 `index.html`\
  \ 的内容，它包含了我们 Angular 应用的主页面。\n\n### index.html 页面\n\n`Listing 1.4` 显示了通过命令行 `ng`\
  \ 工具生成的全新 Angular 应用的 `index.html` 内容。\n\nLISTING 1.4: index.html\n\n```html\n<!doctype\
  \ html>\n<html lang=\"en\">\n<head>\n <meta charset=\"utf-8\">\n <title>HelloWorld</title>\n\
  \ <base href=\"/\">\n <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
  >\n <link rel=\"icon\" type=\"image/x-icon\" href=\"favicon.ico\">\n</head>\n<body>\n\
  \ <app-root></app-root>\n</body>\n</html>\n```\n\n\n\n\n\nListing 1.4 非常极简：只有自定义的\
  \ `<app-root>` 元素（在 `app.component.ts` 的 `selector` 属性中指定）能让你看出此网页是 Angular 应用程序的一部分。\n\
  \n注意 *Angular CLI 在项目“构建”期间会自动在 `index.html` 中插入 JavaScript 依赖项。*\n\n在我们深入研究 Angular\
  \ 应用程序中的 TypeScript 文件之前，让我们快速绕一下，了解 Angular 应用程序中 import 语句是如何工作的。如果你已经熟悉 Angular\
  \ 中的 import 和 export 语句，可以随时跳过下一节。\n\n### 导出和导入包与类（可选）\n\n在 TypeScript 文件中导入的每个\
  \ TypeScript 类都必须在定义该类的 TypeScript 文件中被导出。你将看到许多 import 和 export 语句的示例：事实上，书中的每一个\
  \ Angular 应用程序都是如此。\n\nimport 语句有两种常见类型：一种类型涉及从 Angular 模块导入包，另一种类型涉及导入自定义类（由你编写的类）。以下是这两种类型的语法：\n\
  \n```\nimport {some-package-name} from 'some-angular-module';\n\nimport {some-class\
  \ } from 'my-custom-class';\n```\n\n以下是两种类型 import 语句的示例：\n\n```\nimport { NgModule\
  \ } from '@angular/core';\n\nimport {EmpComponent} from './emp.component';\n```\n\
  \n在前面的代码段中，`NgModule` 包是从位于 `node_modules` 目录下的 `@angular/core` 模块导入的。`EmpComponent`\
  \ 类是在 TypeScript 文件 `emp.component.ts` 中定义并导出的自定义类。\n\n在第二个 import 语句中，当从 TypeScript\
  \ 文件导入自定义类时，需要 `./` 前缀：注意省略了 `.ts` 后缀。\n\n### 在 Angular 中使用组件\n\n正如你已经学到的，Angular\
  \ 应用程序是一个嵌套组件的树，其中顶级组件是应用程序。组件定义了 UI 元素、屏幕和路由。通常，通过将每个自定义组件放在一个 TypeScript 文件中组织\
  \ Angular 应用程序，然后在包含顶级组件的“主”文件（通常命名为 `app.component.ts`）中导入该 TypeScript 文件。\n\n\
  #### 组件中的元数据（MetaData）\n\nAngular 组件通常是 `@Component` 装饰器和类定义的组合，该类可以可选包含一个构造函数。一个\
  \ `@Component` 装饰器的简单示例在此：\n\n```\nimport { Component } from '@angular/core';\n\n\
  import {EmpComponent} from './emp/emp.component';\n\n@Component({ \n  selector:\
  \ 'app-container',\n  template: '<tasks>{{message}}</tasks>',\n  directives: [EmpComponent]\n\
  })\n```\n\n前面的 `@Component` 装饰器包含几个属性，其中一些是强制的，另一些可选的。让我们看看前面代码块中的两种类型。\n\n`selector`\
  \ 属性是强制的，它指定了作为 Angular 应用程序“根”的 HTML 元素（无论是现有元素还是自定义元素）。\n\n接下来 `template` 属性（或\
  \ `templateUrl` 属性）是强制的，它包含了标记、插值变量和 TypeScript 代码的混合。一个重要的细节：当 `template` 属性的定义跨越多行时，需要“反引号”。`directives`\
  \ 属性是一个可选属性，指定了一个被视为嵌套组件的组件数组。在这个示例中，`directives` 属性指定了组件 `EmpComponent`，它在代码块开头附近也通过\
  \ import 语句导入了。注意 import 语句不包含“@”符号，这意味着 `EmpComponent` 是定义在文件 `emp/emp.component.ts`\
  \ 中的自定义组件。\n\n#### Angular 中的有状态组件与无状态组件\n\n从高级术语来说，`stateful`（有状态）组件保留与同一个 Angular\
  \ 应用程序其他部分相关的信息。无状态组件不维护应用程序状态，也不请求或获取数据：它们是通过属性绑定从另一个组件（例如其父组件）传递的数据。\n\n书中的代码示例可以是有状态组件、无状态组件的组合，有时还包括“值对象”（value\
  \ objects），即自定义类的实例，用于“建模”不同的实体（如员工、客户、学生等）。\n\n第 2 章中有一个展示型组件的示例。这里深入研究有状态和无状态组件的优秀文章在这里：\n\
  \n[`toddmotto.com/stateful-stateless-components#stateful`](https://toddmotto.com/stateful-stateless-components#stateful)\n\
  \n### Angular 中的语法、属性和属性\n\nAngular 为属性和属性引入了方括号 `[]` 记法，以及用于处理事件函数的圆括号 `()` 记法。这种语法实际上是有效的\
  \ HTML5 语法。这里是一个指定属性和函数的代码段示例：\n\n```html\n<foo [bar]=\"x+1\" (baz)=\"doSomething()\"\
  >Hello World</foo>\n```\n\n一个指定属性和函数的示例在这里：\n\n```html\n<button [disabled]=\"!inputIsValid\"\
  \ (click)=\"authenticate()\">Login </button>\n```\n\n一个带有自定义元素的数据相关元素示例在这里：\n\n\
  ```html\n<my-chart [data]=\"myData\" (drag)=\"handleDrag()\"></my-chart>\n```\n\n\
  前面代码段中的新语法消除了对许多内置指令的需求。\n\n#### Angular 中的属性（Attributes）与属性（Properties）\n\n记住以下区别：属性（property）可以指定复杂模型，而属性（attribute）只能指定字符串。例如，在\
  \ Angular 1.x 中你可以写以下代码：\n\n```html\n<my-directive foo=\"{{something}}\"></my-directive>\n\
  ```\n\n对应的 Angular 代码（不需要插值）在这里\n\n```html\n<my-directive [foo]=\"something\"></my-directive>\n\
  ```\n\n在深入研究创建图形和动画效果的代码之前，让我们看看生命周期方法。\n\n### Angular 生命周期方法\n\nAngular 应用程序具有按照定义顺序执行的生命周期方法。因此，你可以在这些方法中放置自定义代码以处理各种事件（如应用程序启动、运行等）。“生命周期钩子”接口定义在\
  \ `@angular/core` 库中，列如下：\n\n- `OnInit`\n- `OnDestroy`\n- `DoCheck`\n- `OnChanges`\n\
  - `AfterContentInit`\n- `AfterContentChecked`\n- `AfterViewInit`\n- `AfterViewChecked`\n\
  \n每个接口都有一个方法，其名称在接口名称前加上 `ng`。例如，`OnInit` 接口有一个名为 `ngOnInit` 的方法。Angular 按以下顺序调用这些生命周期方法：\n\
  \n- `ngOnChanges`：当输入输出绑定值变化时调用\n- `ngOnInit`：在第一次 `ngOnChanges` 之后\n- `ngDoCheck`：开发者的自定义检测\n\
  - `ngAfterContentInit`：组件内容初始化后\n- `ngAfterContentChecked`：每次检查组件内容后\n- `ngAfterViewInit`：组件视图（s）初始化后\n\
  - `ngAfterViewChecked`：每次检查组件视图（s）后\n- `ngOnDestroy`：在指令被销毁之前\n\n由于 Angular 在创建组件时会调用组件的构造函数，因此构造函数是初始化组件状态的方便位置。但在访问定义在这些子组件中的任何属性或数据之前，必须初始化子组件。在这种情况下，将自定义代码放置在\
  \ `ngOnInit` 生命周期方法中以访问子组件的数据。\n\n完整的 Angular 生命周期事件集在这里：\n\n[`angular.io/docs/ts/latest/guide/lifecycle-hooks.html`](https://angular.io/docs/ts/latest/guide/lifecycle-hooks.html)\n\
  \n\n\n\n\n将辅助文件中的 `LifeCycle` 目录复制到方便的位置。列表 1.5 显示了 `app.component.ts` 的内容，它阐述了某些\
  \ Angular 生命周期周期方法被调用的顺序。\n\n### 列表 1.5: app.component.ts\n\n```typescript\nimport\
  \ {Component} from '@angular/core';\n\n@Component({\n  selector: 'app-root',\n \
  \ template: '<h2>Angular Lifecycle Methods</h2>',\n})\nexport class AppComponent{\n\
  \  ngOnInit() {\n    // 在子组件初始化后调用\n    console.log(\"ngOnInit\");\n  }\n\n  ngOnDestroy()\
  \ {\n    // 在组件销毁时调用\n    console.log(\"ngOnDestroy\");\n  }\n\n  ngDoCheck() {\n\
  \    // 自定义变更检测\n    console.log(\"ngDoCheck\");\n  }\n\n  // => 如果没有 --strict 选项：ngOnChanges(changes)\
  \ \n  ngOnChanges(changes:any) {\n    console.log(\"ngOnChanges\");\n    // 在绑定检查后调用\n\
  \    // 但仅当其中一个绑定发生变化时调用。\n    //\n    // changes 是一个格式如下的对象：\n    // {\n    //\
  \ 'prop': PropertyUpdate\n    // }\n  }\n\n  ngAfterContentInit() {\n    // 组件内容已初始化\n\
  \    console.log(\"ngAfterContentInit\");\n  }\n\n  ngAfterContentChecked() {\n\
  \    // 组件内容已完成检查\n    console.log(\"ngAfterContentChecked\");\n  }\n\n  ngAfterViewInit()\
  \ {\n    // 组件视图已初始化\n    console.log(\"ngAfterViewInit\");\n  }\n\n  ngAfterViewChecked()\
  \ {\n    // 组件视图已完成检查\n    console.log(\"ngAfterViewChecked\");\n  }\n}\n```\n\n\
  列表 1.5 包含了所有的 Angular 生命周期方法，每个方法都包含 `console.log()`，以便你可以看到方法执行的顺序。\n\n导航到 `LifeCycle`\
  \ 程序的 `src` 子目录，并执行以下命令启动应用程序：\n\n```bash\nng serve\n```\n\n在 Chrome 会话中导航到 `localhost:4200`\
  \ 并打开 Chrome 检查器，之后你将在 `Console` 标签页看到以下输出：\n\n```text\nngOnInit\nngDoCheck\nngAfterContentInit\n\
  ngAfterContentChecked\nngAfterViewInit\nngAfterViewChecked\nngDoCheck\nngAfterContentChecked\n\
  ngAfterViewChecked\n```\n\n如果你需要在特定方法中执行某些自定义代码，上述周期方法非常有用。下一节将向你如何在 Angular 应用中添加\
  \ CSS3 动画效果。\n\n## Angular 中的 CSS3 动画效果\n\n本节通过添加 CSS3 动画效果增强了之前节中的代码示例。如果你不熟悉 CSS3，有很多在线教程可以参考。如果你对带有自定义\
  \ CSS3 代码的 Angular 应用感兴趣，可以随时跳过本节。\n\n现在将辅助文件中的 `SimpleCSS3Anim` 目录复制到方便的位置。列表 1.6\
  \ 显示了 `app.component.ts` 的内容，它演示了每当用户鼠标悬停在每个列表项上时，如何更改列表项的颜色。\n\n### 列表 1.6: app.component.ts\n\
  \n```typescript\nimport {Component} from '@angular/core';\n\n@Component({\n  selector:\
  \ 'app-root',\n  template: '\n    <h2>Employee Information</h2>\n    <ul>\n    <li\
  \ *ngFor=\"let emp of employees\">\n      {{emp.fname}} {{emp.lname}} lives in {{emp.city}}\n\
  \    </li>\n    </ul>\n  ',\n  styles: ['\n    @keyframes hoveritem {\n      0%\
  \ {background-color: red;}\n      25% {background-color: #880;}\n      50% {background-color:\
  \ #ccf;}\n      100% {background-color: #f0f;}\n    }\n    li:hover {\n      width:\
  \ 50%;\n      animation-name: hoveritem;\n      animation-duration: 4s;\n    }\n\
  \  '] ] \n})\nexport class AppComponent {\n  // => 如果没有 --strict 选项：employees =\
  \ [];\n  employees : any;\n\n  constructor() {\n    this.employees = [\n      {\"\
  fname\":\"Jane\",\"lname\":\"Jones\",\"city\":\"San Francisco\"},\n      {\"fname\"\
  :\"John\",\"lname\":\"Smith\",\"city\":\"New York\"},\n      {\"fname\":\"Dave\"\
  ,\"lname\":\"Stone\",\"city\":\"Seattle\"},\n      {\"fname\":\"Sara\",\"lname\"\
  :\"Edson\",\"city\":\"Chicago\"}\n    ];\n  }\n}\n```\n\n列表 1.6 包含了 `styles` 属性，该属性包含一个创建颜色变化动画效果的\
  \ `@keyframes` 定义。`styles` 属性包含一个 `li:hover` 选择器，它引用了 `@keyframes` 定义并为动画效果指定了 4\
  \ 秒的持续时间。颜色是在 `@keyframes` 定义中指定的。如果你处理过 CSS3 动画效果，那么 `@keyframes` 对你来说可能非常熟悉。\n\
  \n启动 Angular 应用并在浏览器会话中导航到 `localhost:4200`。当显示名称列表时，将鼠标缓慢移动到每个名称上并观察它们如何改变颜色。文本显示如下，但你需要启动程序：\n\
  \nEmployee Information\n*   Jane Jones lives in San Francisco\n*   John Smith lives\
  \ in New York\n*   Dave Stone lives in Seattle\n*   Sara Edson lives in Chicago\n\
  \n通过使用 Angular 功能而不是 CSS3 功能，本节通过实现动画效果增强了之前的代码。\n\n通过“Angular 方式”动画效果\n\n与其使用 CSS3\
  \ 来实现动画效果，你也可以通过 Angular 功能来实现，本节演示了这一点。\n\n将辅助文件中的 `Animation` 目录复制到方便的位置。列表 1.7\
  \ 显示了 `app.component.ts` 的内容，它演示了当用户鼠标悬停在每个 `<li>` 元素上时，如何移动列表项的位置。\n\n### 列表 1.7:\
  \ app.component.ts\n\n```typescript\nimport {Component, Input} from '@angular/core';\n\
  import {trigger, state, transition, animate} from '@angular/animations';\n\n// part\
  \ #2: new class \nclass Emp {\n  constructor(public fname: string,\n  public lname:\
  \ string,\n  public city: string,\n  public state = 'inactive') {}\n\n  toggleState()\
  \ {\n    this.state = (this.state === 'active' ? 'inactive' : 'active');\n    console.log(this.fname+\"\
  \ new state: \"+this.state);\n  }\n}\n\n@Component({\n  selector: 'app-root',\n\
  \  // part #3: new animations property \n  animations: [\n    trigger('empState',\
  \ [\n      state('inactive', style({ backgroundColor: '#eee', transform: 'scale(1)'\
  \ })),\n      state('active', style({ backgroundColor: '#cfddc', transform: 'scale(1.1)'\
  \ })),\n      transition('inactive => active', animate('100ms ease-in')),\n    \
  \  transition('active => inactive', animate('100ms ease-out'))\n    ])\n  ],\n \
  \ template: '\n    <h2>Employee Information</h2>\n    <ul>\n    <li *ngFor=\"let\
  \ emp of employees\" [@empState]=\"emp.state\" (mousemove)=\"emp.toggleState()\"\
  >\n      {{emp.fname}} {{emp.lname}} lives in {{emp.city}}\n    </li>\n    </ul>\n\
  \  '\n})\nexport class AppComponent {\n  // => 如果没有 --strict 选项：employees = [];\n\
  \  employees : any;\n\n  constructor() {\n    // part #5: array of Emp objects\n\
  \    this.employees = [\n      new Emp(\"Jane\",\"Jones\",\"San Francisco\"),\n\
  \      new Emp(\"John\",\"Smith\",\"New York\"),\n      new Emp(\"Dave\",\"Stone\"\
  ,\"Seattle\"),\n      new Emp(\"Sara\",\"Edson\",\"Chicago\")\n    ];\n  }\n}\n\
  ```\n\n列表 1.7 包含了对 列表 1.6 代码的五处修改。具体而言，标记为 `part #1` 的部分是新的导入语句。标记为 `part #2` 的部分是新添加的\
  \ `Emp` 类。加粗部分（未标记，但是 `part #4`）在 `ngFor` 元素中实际上是将 `mousemove` 事件绑定到了 `Emp` 类的 `toggleState()`\
  \ 方法。最后，标记为 `part #5` 的部分是 `Emp` 对象的数组，它替换了原来的每个员工都用 JSON 字符串表示的数组。\n\n\n\n\n\n\
  Listing 1.8 显示了 `app.module.ts` 的内容，它包含了两个额外的代码片段（**加粗显示**），你必须将它们添加到该文件的默认内容中。\n\
