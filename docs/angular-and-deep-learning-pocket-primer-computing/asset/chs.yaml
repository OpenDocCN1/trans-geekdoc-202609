  \n# 总结\n本章向你展示了如何在 Angular 应用中使用 UI 控制（UI Controls）。你学习了如何渲染按钮、如何渲染名称列表，以及如何从这些列表中添加和删除名称。你还学习了条件逻辑以及如何创建子组件。\n\
  \n然后，你学习了父组件与子组件之间的通信，随后是了对展示型组件（presentational components）的讨论。此外，你还简要地介绍了 Angular\
  \ 管道（Angular Pipes）以及说明如何在 Angular 应用中使用它们的管道代码示例。最后，你学习了如何从 Angular 应用发送 HTTP GET\
  \ 请求，以获取 `src/assets` 子目录下的 `JSON` 文件内容以及 `CSV` 文件内容。\n\n# 第 3 章：表单与服务\n\n本章向你展示了如何创建使用\
  \ Angular 表单（Angular Forms）和服务（Services）的 Angular 应用。代码示例依赖于对上一章中讨论的功能理解，例如如何在 Angular\
  \ 中发送 HTTP 请求。\n\n本章的第一部分包含使用 Angular 控制（Angular Controls）和控制组（Control Groups）的\
  \ Angular 应用。该部分还提供了一个包含执行 HTTP GET 请求表单的 Angular 应用示例。\n\n本章的第二部分包含从外部端点获取数据的代码示例。具体而言，该部分向你展示了如何获取硬编码用户的\
  \ GitHub ，以及如何在文本字段中提供 GitHub 用户名，然后在 GitHub 上搜索关于该用户的更多详细信息。\n\n本书代码示例的重点是 Angular\
  \ 特有的功能，这意味着应用程序的 UI 部分采用的是“无修饰”的方法。因此，UI 部分是极简主义的，但你可以通过提供自己的自定义代码来增强 UI。\n\n##\
  \ Angular 表单概述\n\n`FormControl` 代表单个输入字段，`FormGroup` 由多个逻辑相关的字段组成，而 `NgForm` 组件代表\
  \ HTML 网页页中的 `<form>` 元素。用于提交表单的 `ngSubmit` 动作语法如下：\n\n```html\n(ngSubmit)=\"onSubmit(myForm.value)\"\
  \n```\n\n注意 `NgForm` 提供了 `ngSubmit` 事件，而你必须定义 `onSubmit()` 方法。此外，你还简要地介绍了 Angular\
  \ 管道（Angular Pipes）以及说明如何在 Angular 应用中使用它们的管道代码示例。最后，你学习了如何从 Angular 应用发送 HTTP GET\
  \ 请求，以获取 `src/assets` 子目录下的 `JSON` 文件内容以及 `CSV` 文件内容。\n\n### 响应式表单（Reactive Forms）\n\
  `FormControl` 代表单个输入字段，`FormGroup` 由多个逻辑相关的字段组成，而 `NgForm` 组件代表 HTML 网页中的 `<form>`\
  \ 元素。用于提交表单的 `ngSubmit` 动作语法如下：\n\n```html\n(ngSubmit)=\"onSubmit(myForm.value)\"\
  \n```\n\n注意 `NgForm` 提供了 `ngSubmit` 事件，而你必须定义 `onSubmit()` 方法。此外，你还简要地介绍了 Angular\
  \ 管道（Angular Pipes）以及说明如何在 Angular 应用中使用它们的管道代码示例。最后，你学习了如何从 Angular 应用发送 HTTP GET\
  \ 请求，以获取 `src/assets` 子目录下的 `JSON` 文件内容以及 `CSV` 文件内容。\n\n`FormControl` 代表单个输入字段，`FormGroup`\
  \ 由多个逻辑相关的字段组成，而 `NgForm` 组件代表 HTML 网页中的 `<form>` 元素。用于提交表单的 `ngSubmit` 动作语法如下：\n\
  \n```html\n(ngSubmit)=\"onSubmit(myForm.value)\"\n```\n\n注意 `NgForm` 提供了 `ngSubmit`\
  \ 事件，而你必须定义 `onSubmit()` 方法。\n\n### 模板驱动表单（Template-driven Forms）\n`FormsModule`\
  \ 为模板驱动表单提供了必要的功能。\n\n### Angular 表单示例\n本部分包含一个在 Angular 中创建表单的简单示例。\n\n```typescript\n\
  import { Component } from '@angular/core';\n\n@Component({\n  selector: 'app-root',\n\
  \  template: `\n<<div> \n<h2>一个示例表单</h2> \n<form #f=\"ngForm\"\n(ngSubmit)=\"onSubmit(f.value)\"\
  \nclass=\"ui form\">\n<div class=\"field\">\n<label for=\"fname\">fname</label>\n\
  <input type=\"text\"\nid=\"fname\"\nplaceholder=\"fname\"\nname=\"fname\" ngModel>\n\
  \n<label for=\"lname\">lname</label>\n<input type=\"text\"\nid=\"lname\"\nplaceholder=\"\
  lname\"\nname=\"lname\" ngModel>\n</div>\n<button type=\"submit\">提交</button> \n\
  </form>\n</div>\n` \n}) \nexport class AppComponent {\n  myForm: any;\n\n  onSubmit(form:\
  \ any): void {\n    console.log('你提交的值：', form);\n  }\n}\n```\n\n\n\n\n\n```typescript\n\
  @NgModule({ \n  imports: [BrowserModule, FormsModule],\n  declarations: [ AppComponent\
  \ ],\n  bootstrap: [ AppComponent ]\n}) \nexport class AppModule { }\n```\n\n代码列表\
  \ 3.2 非常直观：它包含了两行涉及 `FormsModule`，这是此代码示例所需的。\n\n启动应用程序并在浏览器会话中导航到 `localhost:4200`，你将看到一个简单的表单带有两个标签分别为\
  \ `fname` 和 `lname` 的输入字段。为这两个字段输入一对值——假设为 `tom` 和 `jones`。打开此浏览器会话的检查器以查看显示的以下信息：\n\
  \nyou submitted value: Object { fname: \"tom\", lname: \"jones\" } \n`you submitted\
  \ value: Object { fname: \"tom\", lname: \"jones\" }`\n\n## 数据绑定与 ngModel\n\nAngular\
  \ 支持表单中的三种绑定类型：无绑定、单向绑定和双向绑定。以下是一些示例：\n\n```html\n<!-- 无绑定 -->\n<input name=\"fname\"\
  \ ngModel>\n\n<!-- 单向绑定 -->\n<input name=\"fname\" [ngModel]=\"fname\">\n\n<!--\
  \ 双向绑定 -->\n<input name=\"fname\" [ngModel]=\"fname\" (ngModelChange)=\"fname=$event\"\
  >\n\n<!-- 双向绑定 -->\n<input name=\"fname\" [(ngModel)]=\"fname\">\n```\n\n`单向绑定`\
  \ 示例会在关联组件中查找 `fname` 属性，并用 `fname` 属性的值初始化 `<input>` 字段。\n\n`双向绑定` 在用户更改 `<input>`\
  \ 字段的值时触发 `ngModelChange` 事件，这会导致组件中 `fname` 属性的更新，从而确保输入值与其关联的组件值一致。你还可以将 `ngModelChange`\
  \ 的值替换为函数的输出（例如对用户在输入字段中输入的文本字符串进行大写处理）。\n\n第二个双向数据绑定示例使用了“盒子里的香蕉”（banana in a box）语法，这是实现第一个双向数据绑定示例相同结果的简便方法。然而，这种语法不支持长双向数据绑定语法可以使用函数。\n\
  \n本章的下一节将向你展示如何以“Angular 方式”处理表单。\n\n## 使用 FormBuilder 的 Angular 表单\n\n`FormBuilder`\
  \ 类和 `FormGroup` 类是用于创建表单的内置 Angular 类。`FormBuilder` 支持创建 `FormControl` 的 `control()`\
  \ 函数和用于创建 `FormGroup` 的 `group()` 函数。\n\n从配套文件中将 `FormBuilder` 目录复制到方便的位置。代码列表 3.3\
  \ 显示了 `app.component.ts` 的内容，它说明了如何在 Angular 应用中使用 Angular 表单。\n\n*代码列表* 3.3: app.component.ts\n\
  \n```typescript\nimport { Component } from '@angular/core';\nimport { FormBuilder\
  \ } from '@angular/forms';\nimport { FormGroup } from '@angular/forms';\n\n@Component({\n\
  \  selector: 'app-root',\n  template: `\n<div> \n  <h2>A FormBuilder Form</h2> \n\
  \  <form [formGroup]=\"myForm\" (ngSubmit)=\"onSubmit(myForm.value)\" class=\"ui\
  \ form\">\n    <div class=\"field\">\n      <label for=\"fname\">fname</label>\n\
  \      <input type=\"text\" id=\"fname\" placeholder=\"fname\" [formControl]=\"\
  myForm.controls['fname']\">\n    </div>\n    <div class=\"field\">\n      <label\
  \ for=\"lname\">lname</label>\n      <input type=\"text\" id=\"lname\" placeholder=\"\
  lname\" [formControl]=\"myForm.controls['lname']\">\n    </div>\n    <button type=\"\
  submit\">Submit</button> \n  </form>\n</</div>\n` \n}) \nexport class AppComponent\
  \ {\n  myForm: FormGroup;\n  constructor(fb: FormBuilder) {\n    this.myForm = fb.group({\n\
  \      'fname': ['John'],\n      'lname': ['Smith']\n    });\n  }\n  onSubmit(value:\
  \ string): void {\n    console.log('you submitted value:', value);\n  }\n}\n```\n\
  \n代码列表 3.3 包含一个 `<form>` 元素和两个 `<div>` 元素，每个元素包含一个 `<input>` 元素。第一个 `<input>` 元素用于新用户的名，第二个\
  \ `<input>` 元素用于新用户的姓。\n\n在 代码列表 3.3 中，`FormBuilder` 被注入到构造函数，它创建一个 `FormBuilder`\
  \ 实例并赋值给构造函数中的变量 `fb`。接下来，通过调用 `group()` 方法初始化 `myForm`，该方法接收一个键值对对象。在这种情况下，`fname`\
  \ 和 `lname` 是键，它们都会在模板属性中作为 `<input>` 元素出现。这些键的值是可选的初始值。\n\n启动应用程序并在浏览器会话中导航到 `localhost:4200`，你将看到一个简单的表单带有两个标签分别为\
  \ `fname` 和 `lname` 的输入字段，并预先填充了 `John` 和 `Smith` 值。打开此浏览器会话的检查器以查看以下信息：\n\nyou\
  \ submitted value: Object { fname: \"John\", lname: \"Smith\" }\n\n显然，你可以在 `group()`\
  \ 方法内部添加许多其他属性（例如地址相关的字段）。此外，你可以为每个新实体添加不同的表单。例如，你可以为 `Customer`（客户）、`PurchaseOrder`（订单）和\
  \ `LineItems`（行项目）创建单独的表单。\n\n## Angular 响应式表单\n\n本节涵盖了如何使用 `FormBuilder` 创建响应式表单。从配套文件中将\
  \ `FormBuilder` 目录复制到方便的位置。代码列表 3.4 显示了 `app.component.ts` 的内容，它说明了如何定义响应式的 Angular\
  \ 表单。\n\n*代码列表* 3.4: app.component.ts\n\n```typescript\nimport { Component } from\
  \ '@angular/core';\nimport { FormBuilder } from '@angular/forms';\nimport { FormGroup\
  \ } from '@angular/forms';\nimport { FormControl } from '@angular/forms';\n\n@Component({\n\
  \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.css']\n\
  })\nexport class AppComponent {\n  userForm: FormGroup;\n  disabled: boolean;\n\
  \  constructor(fb: FormBuilder) {\n    this.userForm = fb.group({\n      name: 'Jane',\n\
  \      email: 'jsmith@yahoo.com',\n      address: fb.group({\n        city: 'San\
  \ Francisco',\n        state: 'California'\n      })\n    });\n  }\n  onSubmitted(theForm:\
  \ FormGroup) {\n    console.log(\"name = \" + theForm.controls['name'].value);\n\
  \    console.log(\"email = \" + theForm.controls['email'].value);\n    console.log(\"\
  city = \" + theForm.get('address.city').value);\n    console.log(\"state = \" +\
  \ theForm.get('address.state').value);\n  }\n}\n```\n\n代码列表 3.4 包含了通常的导入语句，注意带有\
  \ `FormBuilder` 的变量 `userForm` 是如何在构造函数中初始化的。除了两个文本字段，`userForm` 还包含 `address` 元素，该元素也包含\
  \ `FormBuilder`。\n\n代码列表 3.5 显示了 `app.component.html` 的内容，其中包含一个 Angular 表单，其与 `userForm`\
  \ 变量对应的 `<input>` 元素。\n\n*代码列表* 3.5: app.component.html\n\n```html\n<form [formGroup]=\"\
  userForm\" (ngSubmit)=\"onSubmitted(userForm)\">\n  <label>\n    <span>Name</span>\n\
  \    <input type=\"text\" formControlName=\"name\" placeholder=\"Name\" required>\n\
  \  </label>\n  <div>\n    <label>\n      <span>Email</span>\n      <input type=\"\
  email\" formControlName=\"email\" placeholder=\"Email\" required>\n    </label>\n\
  \  </div>\n  <div formGroupName=\"address\">\n    <div>\n      <label>\n       \
  \ <span>City</span>\n        <input type=\"text\" formControlName=\"city\" placeholder=\"\
  City\" required>\n      </label>\n    </div>\n    <label>\n      <span>State</span>\n\
  \      <input type=\"text\" formControlName=\"state\" placeholder=\"State\" required>\n\
  \    </label>\n  </div>\n  <br />\n  <input type=\"submit\" [disabled]=\"userForm.invalid\"\
  >\n</form>\n```\n\n代码列表 3.6 显示了 `app.module.ts` 的更新内容（加粗显示），它仅涉及两个代码片段。\n\n```typescript\n\
  import { BrowserModule } from '@angular/platform-browser';\nimport { NgModule }\
  \ from '@angular/core';\nimport { FormsModule } from '@angular/forms';\nimport {\
  \ ReactiveFormsModule } from '@angular/forms';\n```\n\n\n\n\n\n```typescript\nimport\
  \ { AppComponent } from './app.component';\n\n@NgModule({\n  declarations: [\n \
  \   AppComponent\n  ],\n  imports: [\n    BrowserModule,\n    FormsModule,\n   \
  \ ReactiveFormsModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\n\
  export class AppModule { }\n```\n\n列表 3.6 包含一个用于 `ReactiveFormsModule` 的新导入语句（该语句可以与\
  \ `FormsModule` 的导入语句合并），该语句在 `imports` 属性中也被引用。\n\n启动此应用程序并在浏览器会话中导航到 `localhost:4200`，你将看到一个带有若干预填充输入字段的简单表单。点击提交按钮。当你打开此浏览器会话的检查器时，你看到显示以下信息：\n\
  \n`name = Jane`\n`email = jsmith@yahoo.com`\n`city = San Francisco`\n`state = California`\n\
  \n### FormGroup 与 FormArray\n\n`FormGroup` 将 `FormControl` 元素的值聚合到一个对象中，其中控件名称是键。Angular\
  \ 还支持 `FormArray`（`FormGroup` 的“变体”），它将 `FormControl` 元素的值聚合到一个数组。\n\n`FormGroup`\
  \ 数据被序列化为数组，而 `FormArray` 数据被序列化为对象。如果你不知道给定组中有多少控件，请考虑使用 `FormArray`（否则使用 `FormGroup`）。以下链接包含一个使用\
  \ `FormArray` 的示例：\n\n[`alligator.io/angular/reactive-forms-formarray-dynamic-fields/`](https://alligator.io/angular/reactive-forms-formarray-dynamic-fields/)\n\
  \n### Angular 中的其他表单功能\n\n前面的部分让你了解了 Angular 表单的模块化风格，本简短章节重点介绍了 Angular 中一些额外的表单相关功能，例如：\n\
  \n* 表单验证\n* 自定义验证器\n* 嵌套表单\n* 动态表单\n* 模板驱动表单\n\n`Validators` 允许你对表单字段进行验证，例如指定必填字段、字段的最小最大长度。你还可以指定字段必须匹配的正则表达式，这对于邮政编码、电子邮件地址等非常有用。或者，你也可以通过编程方式指定验证器。\n\
  \nAngular 表单提供了事件监听器，用于检测与表单状态相关的各种事件，如下代码段所示：\n\n```html\n{{myform.form.touched}}\n\
  {{myform.form.untouched}}\n{{myform.form.pristine}}\n{{myform.form.dirty}}\n{{myform.form.valid}}\n\
  {{myform.form.invalid}}\n```\n\n例如，如果一个或多个表单字段无效，则显示以下 `<span>` 元素：\n\n```html\n\
  <span *ngIf=\"!myform.form.valid\">表单无效</>\n```\n\n你还可以使用 `*ngIf` 指令显示特定字段的状态来显示错误消息，如下所示：\n\
  \n```html\n<label>\n  <span>firstName</span>\n  <input type=\"text\" formControlName=\"\
  fname\" placeholder=\"FirstName\">\n  <p *ngIf=\"userForm.controls.fname.errors\"\
  >\n    此值无效\n  </p>\n</label>\n```\n\n这里有一个动态 Angular 表单的示例：\n\n[`angular.io/docs/ts/latest/cookbook/dynamic-form.html`](https://angular.io/docs/ts/latest/cookbook/dynamic-form.html)\n\
  \n与其使用纯 CSS 为字段相关的错误消息设置样式效果，不如考虑使用 Bootstrap 之类的工具。\n\n### 什么是 Angular 服务？\n\n\
  本节包含 Angular 服务的简要描述，并列出了一些内置服务，并在随后的章节中提供了一个在 Angular 中定义自定义服务的示例。\n\n有时 Web 应用程序的前端需要数据。Angular\
  \ 服务是单例的，这意味着在应用程序的不同部分可以使用同一个实例。通过依赖注入机制，可以在组件中使用服务。\n\n这里是一个自定义 服务的示例：\n\n```typescript\n\
  @Injectable()\nclass UpperCaseService {\n  upper(message: string): string {\n  \
  \  return message.toUpperCase();\n  }\n}\n```\n\n`@Injectable` 装饰器是必需的，以便该类可以被注入。在所有情况下，你都需要这样标记你的服务。通过在构造函数中注入该服务：\n\
  \n```typescript\nimport {UpperCaseService} from \"./path/to/service\";\n\n@Component({\n\
  \  selector: \"convert\",\n  template: \"<button (click)='greet()'>Greet</button>\"\
  \n})\nexport class UpperComponent {\n  // 在构造函数中注入服务\n  constructor(private upperCaseService:\
  \ UpperCaseService) {\n  }\n\n  // 调用服务的方法\n  public greet(): void {\n    alert(this.upperCaseService.upper(\"\
  Hello world\"));\n  }\n}\n```\n\n### 内置服务\n\nAngular 支持由模块组织的内置服务。例如，`http` 模块（位于\
  \ `@angular/common/http`）包含对典型的 `GET`、POST`、PUT 和 `DELETE` 请求的支持。事实上，你在第 2 章中见过基于\
  \ HTTP 请求的示例。此外，`routing` 模块（位于 `@angular/router`）提供了路由支持，包括 HTML5 和哈希路由。`forms`\
  \ 模块（位于 `@angular/forms`）提供了表单服务。查看 Angular 文档以获取完整的内置服务列表。\n\n### 服务示例\n\n将配套文件\
  \ `ServiceExample` 目录复制到方便的位置。列表 3.7 显示了 `app.component.ts` 的内容，其中包含定义基础自定义服务的示例。\n\
  \n*列表* 3.7: app.component.ts\n\n```typescript\nimport {Component} from '@angular/core';\n\
  import {Injectable} from '@angular/core';\n\n@Injectable()\nclass Service {\n  somedata\
  \ = [\"one\", \"two\", \"three\"];\n\n  constructor() { }\n\n  getData() { return\
  \ this.somedata; }\n\n  toString() { return \"From toString\"; }\n}\n\n@Component({\n\
  \  selector: 'app-root',\n  providers: [ Service ],\n  template: `Here is the data:\
  \ {{ service.getData() }}`\n})\nexport class AppComponent {\n  constructor(public\
  \ service: Service) { }\n}\n```\n\n列表 3.7 包含一个 `Service` 类，其前面带有 `@Injectable` 装饰器，这允许我们在\
  \ `AppComponent` 类的构造函数中注入 `Service` 类的实例。\n\n\n\n\n\n本节包含一个使用 `EventEmitters` 在组件与其子组件之间通信的代码示例。现在，从辅助文件中将\
  \ `UserServiceEmitter` 目录拷贝到方便的位置。显示列表 3.8 显示了 `user.component.ts` 的内容，该文件为单个用户定义了一个自定义组件。\n\
  \n### 列表 3.8：user.component.ts\n\n```typescript\nimport {Component} from '@angular/core';\n\
  \nimport { Inject } from '@angular/core';\n\n@Component({\n  selector: 'user',\n\
  \  template: '<h2></h2>'\n})\nexport class User {\n  fname: string; \n  lname: string;\
  \ \n  imageUrl: string;\n\n  constructor(@Inject(String) fname: string, \n  @Inject(String)\
  \ lname: string,\n  @Inject(String) imageUrl: string) {\n    this.fname = fname;\
  \ \n    this.lname = lname; \n    this.imageUrl = imageUrl; \n  } \n}\n```\n\n显示列表\
  \ 3.8 非常直观：自定义的 `User` 类有一个包含三个参数的构造函数，这些参数代表单个用户的名、姓和图像 URL。\n\n显示列表 3.9 显示了 `user.service.ts`\
  \ 的内容，它创建了一个用户列表，其中每个用户都有名、姓以及关联的 PNG 文件。\n\n### 列表 3.9：user.service.ts\n\n```typescript\n\
  import {Component} from '@angular/core';\nimport {User} from './user.component';\n\
  \n@Component({ \n  selector: 'user-comp',\n  template: '<h2></h2>'\n})\nexport class\
  \ UserService {\n  userList:User[];\n\n  constructor() {\n    this.userList = [\n\
  \      new User('Jane','Smith','assets/sample1.png'),\n      new User('John','Stone','assets/sample2.png'),\n\
  \      new User('Dave','Jones','assets/sample3.png'),\n    ];\n  }\n  getUserList()\
  \ {\n    return this.userList;\n  }\n}\n```\n\n显示列表 3.9 导入了 `User` 自定义组件（见显示列表 3.11），然后定义了\
  \ `UserService` 自定义组件，该组件使用 `User` 元素的 `userList` 数组来跟踪用户。该数组在构造函数中初始化，包含了三个创建并填充了的新\
  \ `User` 实例。`getUserList()` 方法执行返回 `userList` 数组的“服务”。\n\n显示列表 3.10 显示了 `app.component.ts`\
  \ 的内容，它引用了之前的两个自定义组件，并在无序列表中渲染用户相关信息。\n\n### 列表 3.10：app.component.ts\n\n```typescript\n\
  import {Component} from '@angular/core';\nimport {EventEmitter} from '@angular/core';\n\
  import {UserService} from './user.service';\nimport {User} from './user.component';\n\
  \n@Component({ \n  selector: 'app-root',\n  providers: [User, UserService],\n  template:\
  \ `\n<div class=\"ui items\">\n<user-comp\n  *ngFor=\"let user of userList; let\
  \ i=index\"\n  [user]=\"user\"\n  (mouseover)='mouseEvent(user)'\n  [class.chosen]=\"\
  isSelected(user)\">\n  USER {{i+1}}: {{user.fname}}-{{user.lname}}\n  <img class=\"\
  user-image\" [src]=\"user.imageUrl\"\n  (mouseenter)=\"mouseEnter(user)\"\n  width=\"\
  50\"height=\"50\">\n</user-comp>\n</div \n`\n})\nexport class AppComponent {\n \
  \ user:User;\n  currentUser:User;\n  userList:User[];\n  onUserSelected: EventEmitter<User>;\n\
  \n  mouseEvent(user:User) {\n    console.log(\"current user: \"+user.fname+\" \"\
  +user.lname); \n    this.currentUser = user;\n    this.onUserSelected.emit(user);\n\
  \  }\n  mouseEnter(user:User) {\n    console.log(\"image name: \"+user.imageUrl);\n\
  \    alert(\"Image name: \"+user.imageUrl);\n  }\n  isSelected(user: User): boolean\
  \ {\n    if (!user || !this.currentUser) {\n      return false;\n    }\n    return\
  \ user.lname === this.currentUser.lname;\n  }\n  constructor(userService:UserService)\
  \ {\n    this.onUserSelected = new EventEmitter();\n    this.userList = userService.getUserList();\n\
  \  }\n}\n```\n\n显示列表 3.10 包含一个模板属性，用于显示当前用户列表（即通过执行显示列表 3.10 构造函数中的代码而初始化的三个用户）。注意在用户列表中显示每个用户信息的语法：\n\
  \nUSER {{i+1}}: {{user.fname}}-{{user.lname}}\n<img class=\"user-image\" [src]=\"\
  user.imageUrl\"\n\n当鼠标悬停在用户列表中的某个用户上时，`mouseEvent` 方法会被调用。它会设置 `currentUser` 并触发\
  \ `onUserSelected` 事件。当鼠标悬停在图像上时，`mouseEnter` 方法会被调用，并弹出图像名称的警告。显示列表 3.11 包含一个模板属性来显示当前用户列表。\n\
