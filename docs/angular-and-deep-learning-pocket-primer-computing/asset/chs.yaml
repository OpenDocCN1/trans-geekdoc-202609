  \ 的输出（为了显示目的经过了微调）如下：\n\n```\narr3: tf.Tensor(\n[[[1 2]\n [2 3]]]\n [[3 4]\n [5\
  \ 6]]], shape=(2, 2, 2), dtype=int32)\n\n[1]: tf.Tensor(\n[[3 4]\n [5 6]], shape=(2,\
  \ 2), dtype=int32)\n\n[1,1]: tf.Tensor([5 6], shape=(2,), dtype=int32)\n\n[1,1,0]:\
  \ tf.Tensor(5, shape=(), dtype=int32)\n```\n\n## 在 TF 中相乘两个二阶张量\n\nListing B.20\
  \ 展示了 `tf2_mult.py` 的内容，它说明了如何在 TF 2 中相乘二阶张量。\n\nLISTING B.20: `tf2_mult.py`\n\n\
  ```python\nimport tensorflow as tf\n\nm1 = tf.constant([[3., 3.]]) # 1x2\nm2 = tf.constant([[2.],[2.]])\
  \ # 2x1\np1 = tf.matmul(m1, m2) # 1x1\n\n@tf.function\ndef compute_values():\n \
  \   print('m1:',m1)\n    print('m2:',m2)\n    print('p1:',p1)\ncompute_values()\n\
  ```\n\nListing B.20 包含了两个 TF 常量 `m1` 和 `m2`，它们用值 `[[3., 3.]]` 和 `[[2.],[2.]]` 初始化。由于嵌套方括号，`m1`\
  \ 的形状为 1x2，而 `m2` 的形状为 2x1。因此，`m1` 和 `m2` 的乘积形状为 (1,1)。\n\n三个 `print()` 语句显示了 `m1`、`m2`\
  \ 和 `p1` 的值。Listing B.20 的输出如下：\n\n```\nm1: tf.Tensor([[3. 3.]], shape=(1, 2), dtype=float32)\n\
  m2: tf.Tensor(\n[[2.]\n [2.]], shape=(2, 1), dtype=float32)\np1: tf.Tensor([[12.]],\
  \ shape=(1, 1), dtype=float32)\n```\n\n## 将 Python 数组转换为 TF 张量\n\nListing B.21 展示了\
  \ `tf2_convert_tensors.py` 的内容，它说明了如何将 Python 数组转换为 TF 2 张量。\n\nLISTING B.21: `tf2_convert_tensors.py`\n\
  \n```python\nimport tensorflow as tf\nimport numpy as np \n\nx1 = np.array([[1.,2.],[3.,4.]])\n\
  x2 = tf.convert_to_tensor(value=x1, dtype=tf.float32)\nprint('x1:',x1)\nprint('x2:',x2)\n\
  ```\n\nListing B.21 非常直观，它从 TensorFlow 和 NumPy 的导入语句开始。接下来，`x_data` 变量是一个 NumPy\
  \ 数组，而 `x` 是将 `x_data` 转换为 TF 张量后得到的结果。Listing B.21 的输出如下：\n\n```\nx1: [[1. 2.]\
  \ [3. 4.]]\nx2: tf.Tensor([[1. 2.] [3. 4.]], shape=(2, 2), dtype=float32)\n```\n\
  \n## TF 中的类型冲突\n\nListing B.22 展示了 `tf2_conflict_types.py` 的内容，它说明了当你尝试在 TF 2 中组合不兼容的张量时会发生什么。\n\
  \nLISTING B.22: `tf2_conflict_types.py`\n\n```python\nimport tensorflow as tf\n\
  try:\n    tf.constant(1) + tf.constant(1.0)\nexcept tf.errors.InvalidArgumentError\
  \ as ex:\n    print(ex)\ntry:\n    tf.constant(1.0, dtype=tf.float64) + tf.constant(1.0)\n\
  except tf.errors.InvalidArgumentError as ex:\n    print(ex)\n```\n\nListing B.22\
  \ 包含了两个 `try/except` 块。第一个块相加两个常量 1 和 1.0，它们是兼容的。第二个块尝试加上声明为 `tf.float64` 的值 1.0，它们是不兼容的。Listing\
  \ B.22 的输出如下：\n\n```\ncannot compute Add as input #1(zero-based) was expected to\
  \ be int32 tensor but is a float tensor\ncannot compute Add as input #1(zero-based)\
  \ was expected to be double tensor but is a float tensor\n```\n\n## TF 2 中的微分和 GradientTape\n\
  \n自动微分（即计算导数）对于实现机器学习算法非常有用，例如用于训练各种神经网络（NN）的反向传播。在动态执行（eager execution）期间，TF 2\
  \ 上下文管理器 `GradientTape` 会跟踪计算梯度的操作。该上下文管理器提供了一个用于跟踪操作的机制。\n\n（注：由于提供的原文文本在部分部分存在重复或不完整，翻译已根据提供的逻辑结构进行了对齐处理。）\n\
  \n\n\n\nListing B.25 的第一部分包含一个嵌套循环，其中外层循环计算 `x` 等于 `4` 时项 `x*x*x` 的阶阶，内层循环计算二阶导。Listing\
  \ B.25 的第二部分包含另一个嵌套循环，通过略不同的语法产生相同的输出。\n\n如果你对导数有些生疏，下一个代码块展示了函数 `z`、它的一阶导 `z'`\
  \ 以及它的二阶导 `z''`：\n\n```python\nz = x*x*x\nz' = 3*x*x\nz'' = 6*x\n```\n\n当我们用值 `4.0`\
  \ 评估 `z`、`z'` 和 `z''` 时，结果分别为 `64.0`、`48.0` 和 `24.0`。运行 Listing B.25 中的代码查看以下输出：\n\
  \nFirst `dz_dx`: `tf.Tensor(48.0, shape=(), dtype=float32)`\n\nSecond `d2z_dx2`:\
  \ `tf.Tensor(24.0, shape=(), dtype=float32)`\n\nFirst `dz_dx`: `tf.Tensor(48.0,\
  \ shape=(), dtype=float32)`\n\nSecond `d2z_dx2`: `tf.Tensor(24.0, shape=(), dtype=float32)`\n\
  \n### 使用 `tf.GradientTape` 的其他张量\n\nListing B.26 显示了 `tf2_gradient_tape4.py` 的内容，它阐明了如何在\
  \ TF 2 中使用 `tf.GradientTape` 计算依赖于 2x2 张量的表达式的一阶导数。\n\n*LISTING* B.26: `tf2_gradient_tape4.py`\n\
  \n```python\nimport tensorflow as tf\n\nx = tf.ones((3, 3))\n\nwith tf.GradientTape()\
  \ as t:\n    t.watch(x)\n    y = tf.reduce_sum(x)\n    print(\"y:\",y)\n    z =\
  \ tf.multiply(y, y)\n    print(\"z:\",z)\n    z = tf.multiply(z, y)\n    print(\"\
  z:\",z)\n    # the derivative of z with respect to y\n    dz_dy = t.gradient(z,\
  \ y)\n    print(\"dz_dy:\",dz_dy)\n```\n\n在 Listing B.26 中，`y` 等于 3x3 张量 `x` 元素之和，即\
  \ `9`。\n\n接下来，`z` 被赋值为项 `y*y` 然后再次乘以 `y`，因此 `z` 的最终表达式（及其导数）如下：\n\n```python\nz\
  \ = y*y*y\nz' = 3*y*y\n```\n\n当用值 `9` 评估 `y` 的 `z'` 时，结果为 `3*9*9`，等于 `243`。运行 Listing\
  \ B.26 中的代码查看以下输出（为了可读性进行了略微格式调整）：\n\n```python\ny: tf.Tensor(9.0, shape=(), dtype=float32)\n\
  z: tf.Tensor(81.0, shape=(), dtype=float32)\nz: tf.Tensor(729.0,shape=(), dtype=float32)\n\
  dz_dy: tf.Tensor(243.0, shape=(), dtype=float32)\n```\n\n### 持久梯度带\n\nListing B.27\
  \ 显示了 `tf2_gradient_tape5.py` 的内容，它阐明了如何使用 `tf.GradientTape` 定义一个持久的梯度带，以计算 TF 2\
  \ 中张量的一阶导数。\n\n*LISTING* B.27: `tf2_gradient_tape5.py`\n\n```python\nimport tensorflow\
  \ as tf\n\nx = tf.ones((3, 3))\n\nwith tf.GradientTape(persistent=True) as t:\n\
  \    t.watch(x)\n    y = tf.reduce_sum(x)\n    print(\"y:\",y)\n    w = tf.multiply(y,\
  \ y)\n    print(\"w:\",w)\n    z = tf.multiply(y, y)\n    print(\"z:\",z)\n    z\
  \ = tf.multiply(z, y)\n    print(\"z:\",z)\n    # the derivative of z with respect\
  \ to y\n    dz_dy = t.gradient(z, y)\n    print(\"dz_dy:\",dz_dy)\n    dw_dy = t.gradient(w,\
  \ y)\n    print(\"dw_dy:\",dw_dy)\n```\n\nListing B.27 与 Listing B.26 几乎相同：新部分已加粗显示。注意\
  \ `w` 是项 `y*y`，因此其一阶导 `w'` 是 `2*y`。因此，当用值 `9.0` 评估 `w` 和 `w'` 时，它们的值分别为 `81` 和 `18`。运行\
  \ Listing B.27 中的代码查看以下输出（为了可读性进行了略微格式调整），其中新输出以加粗显示：\n\n```python\ny: tf.Tensor(9.0,shape=(),\
  \ dtype=float32)\nw: tf.Tensor(81.0,shape=(), dtype=float32)\nz: tf.Tensor(81.0,shape=(),\
  \ dtype=float32)\nz: tf.Tensor(729.0,shape=(), dtype=float32)\ndz_dy: tf.Tensor(243.0,\
  \ shape=(), dtype=float32)\ndw_dy: tf.Tensor(18.0,shape=(), dtype=float32)\n```\n\
