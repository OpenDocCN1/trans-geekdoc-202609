  \nListing 3.12 的后续部分定义了导出的类 `AppComponent`，它初始化了一些实例变量，随后是一个构造函数，该构造函数使用两个硬编码的用户初始化\
  \ `users` 数组。接下来，`currUser()` 方法“指向”用户鼠标悬停高亮的用户。此功能并非必需，但为了以防你需要跟踪当前高亮的用户时可以使用它。\n\
  \n`findGitHubUser()` 方法在 `<input>` 元素为空时会显示一个警报框（alert），这防止了冗余调用 `http()` 方法。如果\
