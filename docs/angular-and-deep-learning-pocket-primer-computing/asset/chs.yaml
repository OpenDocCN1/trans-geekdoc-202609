  \ Angular 服务，并且它是按照面向对象编程的方法论来定义它们的。\n\n## 多组件中的点击事件\n\n一个 Angular 应用可以包含多个组件，每个组件都可以声明同名的事件处理器。本节的\
  \ Angular 应用向你展示了如何向 Angular 应用中的不同元素添加点击事件。\n\n将配套文件中的 `ClickItems` 目录复制到方便的位置。Listing\
  \ 2.16 显示了 `app.component.ts` 的内容，它为项目列表中的每个项目声明了 `onClick()` 事件处理器。\n\n列表 2.16:\
  \ app.component.ts\n\n```typescript\nimport {Component} from '@angular/core';\n\n\
  import {ClickItem} from './clickitem';\n\n@Component({\nselector: 'app-root',\n\
  styles: [`li { display: inline; }`],\ntemplate: `\n<div> \n<ul> \n<li><img (click)=\"\
  onClick(100)\" \nwidth=\"100\" height=\"100\" src=\"src/sample1.png\"></li\n<li><img\
  \ (click)=\"onClick(200)\"\nwidth=\"100\" height=\"100\" src=\"src/sample2.png\"\
  ></li\n<li><img (click)=\"onClick(300)\"\nwidth=\"100\"height=\"100\" src=\"src/sample3.png\"\
  ></li>\n</ul>\n</div> \n`\n})\nexport class AppComponent {\nonClick(id) {\nconsole.log(\"\
  you clicked me: \"+id);\n}\n```\n\nListing 2.16 中的 `template` 属性显示了一个无序列表，其中每个项目都是一个可点击的图像。每用户点击其中一个图像时，就会调用\
  \ `onClick()` 方法，该方法仅通过 `console.log()` 显示消息。\n\nListing 2.17 显示了 `clickitem.ts`\
  \ 的内容，它为项目列表中的每个项目声明了 `onClick()` 事件处理器。\n\n列表 2.17: clickitem.ts\n\n```typescript\n\
  import {Component} from '@angular/core';\n\n@Component({\nselector: 'click',\nstyleUrl:\
  \ [` li: block }`],\ntemplate: `\n<div>\n<ul>\n<li><img (click)=\"onClick(100)\"\
  \nwidth=\"100\" height=\"100\" src=\"assets/sample1.png\"></li\n<li><img (click)=\"\
  onClick(200)\"\nwidth=\"100\" height=\"100\" src=\"assets/sample2.png\"></li\n<li><img\
  \ (click)=\"onClick(300)\"\nwidth=\"100\" height=\"100\" src=\"assets/sample3.png\"\
  ></li>\n</ul>\n</div>\n`\n})\nexport class ClickItem {\nonClick(id) {\nconsole.log(\"\
  app.component.ts: you clicked me: \"+id);\n}\n```\n\nListing 2.17 在功能上与 Listing\
  \ 2.16 非常相似，因此不再重复这些细节。此外，`app.module.ts` 文件包含了两个新生成的代码片段。第一个片段是引用 `clickitem.ts`\
  \ 的导入语句：\n\n```typescript\nimport { ClickItem } from './clickitem';\n```\n\n图 2.4\
  \ 在 Angular 应用中点击图像\n\n第二个代码片段在 `providers` 元素中指定了前面的类：\n\n```typescript\nproviders:\
  \ [ClickItem]\n```\n\n现在启动应用查看 Figure 2.4 中显示的三个图像。点击最左侧的、中间的，然后是最右侧的图像。打开当前浏览器会话的检查器，你将看到这些消息：\n\
  \nyou clicked me: 100\nyou clicked me: 200\nyou clicked me: 300\n\n## 使用 @Input,@Output\
  \ 和 EventEmitter\n\nAngular 支持 `@Input` 和 `@Output` 注解在组件之间传递值。`@Input` 注解用于接收来自父组件的值，而\
  \ `@Output` 注解在给定变量发生变化时从组件发送（或“发射”）数据到父组件。\n\n此代码示例的输出是反直觉的，因为有很多代码产生了在检查器中可见的以下输出：\n\
  \n`constructor parentValue = 77`\n\n然而，此代码示例的目的是引起你注意一些非直观的代码片段（特别是 `app.module.ts`\
  \ 中的）。此外，此代码示例在编译器版本 2.1.5 中正常工作，但未来版本可能对代码进行修改（记住此细节）。\n\n将配套文件中的 `ParentChildEmitters`\
  \ 目录复制到方便的位置。Listing 2.18 显示了 `app.component.ts` 的内容，它向你展示了如何从父组件更新子组件属性的值。\n\n\
  列表 2.18: app.component.ts\n\n```typescript\nimport {Component} from '@angular/core';\n\
  \nimport {EventEmitter} from '@angular/core';\nimport {ChildComponent} from './childcomponent';\n\
  \n@Component({\nselector: 'app-root',\nproviders: [ChildComponent],\ntemplate: `\n\
  <div>\n<child-comp [childValue]=\"parentValue\"\n(childValueChange)=\"reportValueChange($event)\"\
  >\n</child-comp>\n</div>\n`\n})\nexport class AppComponent {\npublic parentValue:number\
  \ = 77;\nconstructor() {\nconsole.log(\"constructor parentValue = \"+this.parentValue);\n\
  }\nreportValueChange(event) {\nconsole.log(event);\n}\n}\n```\n\nListing 2.18 中的\
  \ `template` 属性有一个顶层 `<div>` 元素，包含一个具有两个属性的 `<child-comp>` 元素，如下：\n\n```html\n<child-comp\
  \ [childValue]=\"parentValue\"\n(childValueChange)=\"reportValueChange($event)\"\
  >\n</child-comp>\n```\n\n`[childValue]` 属性将 `parentValue` 的值赋值给 `childValue` 的值。注意变量\
  \ `parentValue` 定义在 `AppComponent` 中，而变量 `childValue` 定义在 `ChildComponent` 中。这段代码展示了如何从父组件向子组件传递值。\n\
  \n接下，`childValueChange` 属性将从 `ChildComponent` 返回的值赋值给当前（“父”）组件。只有当子组件中 `childValue`\
  \ 的值修改时，`childValueChange` 属性才会更新。这段代码展示了如何从子组件向父组件传递值。\n\n请记住这一点：子组件必须定义一个 `EventEmitter`\
  \ 类型的变量（例如 `childValueChange`），以便从子组件“发射”修改后的值。\n\nListing 2.18 的后续部分是一个简单的构造函数，随后是包含\
  \ `console.log()` 语句的 `reportValueChange` 方法。\n\nListing 2.19 显示了 `childcomponent.ts`\
  \ 的内容，它向你展示了如何从父组件更新子组件属性的值。\n\n\n\n\n\n```typescript\nimport {Output} from '@angular/core';\n\
  import {EventEmitter} from '@angular/core';\n\n@Component({\n  selector: 'child-comp',\n\
  \  template: `\n  <button (click)=\"decrement();\">Subtract</button>\n  <input type=\"\
  text\" [value]=\"childValue\">\n  <button (click)=\"increment();\">Add</button>\n\
  \  `\n})\nexport class ChildComponent {\n  @Input() childValue:number = 3;\n  @Output()\
  \ childValueChange = new EventEmitter();\n\n  constructor() {\n    console.log(\"\
  constructor childValue = \" +this.childValue);\n  }\n\n  increment() {\n    this.childValue++;\n\
  \    this.childValueChange.emit({\n      value: this.childValue\n    });\n  }\n\n\
  \  decrement() {\n    this.childValue--;\n    this.childValueChange.emit({\n   \
  \   value: this.childValue\n    });\n  }\n}\n```\n\nListing 2.19 包含了一个模板属性，它指定了三个元素：一个“decrement”`<button>`\
  \ 元素、一个用户可以输入数字的`<input>` 字段，以及一个“increment”`<button>` 元素。第一个 `<button>` 元素增加 `<input>`\
  \ 字段的值，而第二个 `<button>` 元素则减少该值。\n\n导出的类 `ChildComponent` 包含一个数值变量 `childValue`，它通过\
  \ `@Input()` 进行装饰，其值由父组件设置。\n\n如你所见，`increment()` 和 `decrement()` 方法分别增加和减少 `childValue`\
  \ 的值。在两种情况下，都通过以下代码块将修改后的 `childValue` 值“发射”回给父组件：\n\n```typescript\nthis.childValueChange.emit({\n\
  \  value: this.childValue\n})\n```\n\n按照 Listing 2.20 所示更新 `app.module.ts` 的内容（这与本章之前示例中该文件的内容不同）。\n\
  \n*LISTING* 2.20: app.module.ts\n\n```typescript\nimport { NgModule } from '@angular/core';\n\
  import {CUSTOM_ELEMENTS_SCHEMA} from '@angular/core';\nimport { BrowserModule }\
  \ from '@angular/platform-browser';\nimport { AppComponent } from './app.component';\n\
  import { ChildComponent } from './childcomponent';\n\n@NgModule({\n  imports: [\
  \ BrowserModule ],\n  providers: [ ChildComponent ],\n  declarations: [ AppComponent\
  \ ],\n  bootstrap: [ AppComponent ],\n  schemas: [CUSTOM_ELEMENTS_SCHEMA]\n})\n\
  export class AppModule { }\n```\n\n当启动本节中的 Angular 应用时，`<input>` 元素中显示的值为 77，这是父组件中的值，而不是子组件中赋值的值（即\
  \ 3）。打开当前浏览器会话的检查器，你将看到以下输出：\n\n```\nconstructor parentValue = 77\n```\n\n请记住，如果你在\
  \ `declarations` 属性而不是 `providers` 属性中指定 `ChildComponent`，你可能会看到此错误消息：\n\n\"Can't\
  \ bind to <child-comp> since it isn't a known native property\"\n\nListing 2.20\
  \ 包含了加粗显示的三个代码片段，它们对于此代码都是必须的。\n\n### 使用管道 (Pipes) \n\nAngular 支持内置管道、异步管道和自定义管道。\n\
  \n#### 使用内置管道\n\nAngular 支持多种内置管道，例如 `DatePipe`、`UpperCasePipe`、`CurrencyPipe` 和\
  \ `PercentPipe`。这些命名直观的管道每个都提供了你预期的功能：`DatePipe` 支持日期值，`UpperCasePipe` 将字符串转换为大写，以此此类推。\n\
  \n举一个简单的例子，假设 `food` 的值为 `pizza`。那么接代码代码片段将显示字符串 PIZZA：\n\n```html\n<p> I eat too\
  \ much {{ food | uppercase }}</p>\n```\n\n你还可以对某些 Angular 管道进行参数化，这里的示例所示：\n\n```html\n\
  <p> My brother's birthday is {{ birthday | date:\"MM/dd/yy\" }}</p>\n```\n\n事实上，你甚至可以链式使用管道，如下所示：\n\
  \n```html\n<p>My brother's birthday is {{ birthday | date | uppercase }}</p>\n```\n\
  \n在前面的代码片段中，`birthday` 是一个自定义管道。另一个例子是，假设一个 Angular 应用包含包含 JSON 的 `employees` 数组。你可以通过此代码片段显示数组的内容：\n\
  \n```html\n<div>{{employees | json }}</div>\n```\n\n#### 异步管道 (AsyncPipe)\n\n`AsyncPipe`\
  \ 接受 `Promise` 或 `Observable` 作为输入并自动订阅它，最终返回发射的值。此外，`AsyncPipe` 是有状态的：该管道对输入保持订阅，并在值到达时持续传递来自该处的值。\n\
  \n以下代码块让你了解如何显示股票报价，在其中变量 `quotes$` 是一个 `Observable`：\n\n```typescript\n@Component({\n\
  \  selector: 'stock-quotes',\n  template: `\n  <h2>Your Stock Quotes</header>\n\
  \  <p>Message: {{ quotes$ | async }}</p>\n  `\n})\n```\n\n请记住 `AsyncPipe` 提供了两个优势。第一，`AsyncPipe`\
  \ 减少了样板代码。第二，不需要对 `Observable` 进行订阅或取消（后者功能有助于避免内存泄漏）。\n\n#### 展示型组件 (Presentational\
  \ Components)\n\n展示型组件接收数据并进行显示。下面的示例展示了 `StudentDetailsComponent`：\n\n```typescript\n\
  @Component({\n  selector: 'student-info',\n  template: `\n  <div class=\"container\"\
  >\n    <table class=\"table\">\n      <tr *ngFor=\"let student of students\">\n\
  \        <td>{{student.fname}}</td>\n        <td>{{student.lname}}</td>\n      </tr>\n\
  \    </table>\n  </div>`\n})\nexport class StudentDetails {\n  @Input() students;\n\
  }\n```\n\n\n\n\n\n```typescript\nimport { Component } from '@angular/core';\nimport\
  \ {User} from './user.component';\nimport {MyPipe} from './pipe.component';\n\n\
  @Component({\n  selector: 'app-root',\n  template: `\n  <div>\n    <h2>用户完整列表：</h2>\n\
  \    <ul>\n      <li\n        *ngFor=\"let user of userList\"\n        (mouseover)='mouseEvent(user)'\n\
  \        [class.chosen]=\"isSelected(user)\">\n        {{user.fname}}-{{user.lname}}<br/>\n\
  \      </li>\n    </ul>\n    <h2>过滤后的用户列表：</h2>\n    <ul>\n      <li\n        *ngFor=\"\
  let user of userList|MyPipe\"\n        (mouseover)='mouseEvent(user)'\n        [class.chosen]=\"\
  isSelected(user)\">\n        {{user.fname}}-{{user.lname}}<br/>\n      </li>\n \
  \   </ul>\n  </div>\n  `\n})\nexport class AppComponent {\n  user:User;\n  currentUser:User;\n\
  \  userList:User[];\n  mouseEvent(user:User) {\n    console.log(\"current user:\
  \ \"+user.fname+\" \"+user.lname);\n    this.currentUser = user;\n  }\n  isSelected(user:\
  \ User): boolean {\n    if (!user || !this.currentUser) {\n      return false;\n\
  \    }\n    return user.lname === this.currentUser.lname;\n  }\n  constructor()\
  \ {\n    this.userList = [\n      new User('Jane','Smith'),\n      new User('John','Stone'),\n\
  \      new User('Dave','Jones'),\n      new User('Rick','Heard'),\n    ];\n  }\n\
  }\n```\n\n`Listing 2.21` 导入了 `User` 自定义类和 `MyPipe` 自定义类，后者在 `pipes` 属性的值数组中被指定。\n\
  \n接下来，`template` 属性显示了两个用户名的无序列表。第一个列表显示完整列表，每当用户将鼠标悬停在第一个列表的某个用户上，就会通过 `mouseEvent()`\
  \ 方法（定义在 `AppComponent` 类中）的代码将当前用户设置为该用户。\n\n注意 `AppComponent` 类中的 `constructor`（显示在\
  \ `Listing 2.21` 底部）使用了一组用户初始化 `userList` 数组，每个用户都是 `User` 自定义组件的实例。\n\n第二个列表根据自定义管道\
  \ `MyPipe` 中的条件逻辑显示了过滤后的用户列表。`Listing 2.22` 显示了 `pipe.component.ts` 的内容，它定义了在 `Listing\
  \ 2.25` 中引用的自定义管道 `MyPipe`。\n\n#### LISTING 2.22: pipe.component.ts\n```typescript\n\
  import {Component} from '@angular/core';\nimport {Pipe} from '@angular/core';\n\n\
  @Pipe({\n  name: \"MyPipe\"\n})\nexport class MyPipe {\n  transform(item) {\n  \
  \  return item.filter((item) => item.fname.startsWith(\"J\"));\n  }\n}\n```\n\n\
  `Listing 2.22` 包含包含 `transform()` 方法的 `MyPipe` 类。定义管道行为有三个示例，其中第一个返回名字以字母 J 开头的用户（这有些刻意为之，但说明了管道相关的功能）。\n\
  \n`Listing 2.23` 显示了用于创建 `User` 实例的自定义组件 `user.component.ts` 的内容，它通过 `app.component.ts`\
  \ 中的导入语句也被引用。\n\n#### LISTING 2.23: user.component.ts\n```typescript\nimport {Component}\
  \ from '@angular/core';\nimport { Inject } from '@angular/core';\n\n@Component({\n\
  \  selector: 'user',\n  template: '<h1>'\n})\nexport class User {\n  fname: string;\n\
  \  lname: string;\n  constructor(fname: string, lname: string) {\n    this.fname\
  \ = fname;\n    this.lname = lname;\n  }\n}\n```\n\n`Listing 2.23` 包含了 `fname` 和\
  \ `lname` 字段，这在 Angular 应用中非常有用。当你需要显示数据（如列表或表格）时，这种功能非常有用。\n\n最后，我们需要更新 `app.module.ts`，如\
  \ `Listing 24` 所示：\n\n#### LISTING 2.24: app.module.ts\n```typescript\nimport {\
  \ NgModule } from '@angular/core';\nimport { BrowserModule } from '@angular/browser';\n\
  import { AppComponent } from './app.component';\nimport { MyPipe } from './pipe.component';\n\
  import { User } from './user.component';\n\n@NgModule({\n  imports: [BrowserModule],\n\
  \  declarations: [AppComponent, MyPipe, User],\n  bootstrap: [AppComponent]\n})\n\
  export class AppModule { }\n```\n\n`Listing 2.24` 包含了两个导入语句。导航到 `localhost:4200`，稍后将看到以下输出：\n\
  \n用户完整列表：\nJane-Smith\nJohn-Stone\nDave-Jones\nRick-Heard\n过滤后的用户列表：\nJane-Smith\n\
  John-Stone\n\n`Listing 2.23` 的内容在 Angular 中非常直观。关于 Angular 管道的更多信息请参阅：https://angular.io/docs/ts/latest/guide/pipes\n\
  \n这结束了关于 Angular 管道的章节。下一节将讨论 Angular 应用中的服务。\n\n### 通过 Observable 读取 JSON 数据\n\n\
  本节展示了如何从文件读取数据。将 `JSONFile` 拷贝到方便的位置。`Listing 2.25` 显示了 `app.component.ts` 的内容，它说明了如何发起\
  \ HTTP 请求（返回 `Observable`）来获取员工信息。\n\n#### LISTING 2.25: app.component.ts\n```typescript\n\
  import { Component } from '@angular/core';\nimport { Observable } from 'rxjs';\n\
  import { Inject } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
  import { HttpHeaders } from '@angular/common/http';\n\ndeclare var $: any;\n\n@Component({\n\
  \  selector: 'app-root',\n  template: `\n  <button (click)=\"httpRequest()\">获取信息</button>\n\
  \  <ul>\n    <li *ngFor=\"let emp of employees\">\n      {{emp.fname}} {{emp.lname}}\
  \ 住在 {{emp.city}}\n    </li>\n  </ul>\n  `\n})\nexport class AppComponent {\n  employees\
  \ : any;\n  constructor(@Inject(HttpClient) public http:HttpClient) {}\n  httpRequest()\
  \ {\n    this.http.get('assets/employees.json')\n      .subscribe(\n        // 成功时执行函数\n\
  \        data => this.employees = data,\n        // 错误时执行函数\n        err => console.log('error\
  \ reading data: '+err),\n        // 完成时执行函数\n        () => this.userInfo()\n   \
  \   );\n  }\n  userInfo() {\n}\n```\n\n\n\n\n\nListing 2.26 显示了 `employees.json`\
  \ 的内容，其中包含了员工相关信息。该文件位于 `src/assets` 子目录下。\n\n列表 2.26: `employees.json`\n\n```json\n\
  [\n  {\"fname\":\"Jane\",\"lname\":\"Jones\",\"city\":\"San Francisco\"},\n  {\"\
  fname\":\"John\",\"lname\":\"Smith\",\"city\":\"New York\"},\n  {\"fname\":\"Dave\"\
  ,\"lname\":\"Stone\",\"city\":\"Seattle\"},\n  {\"fname\":\"Sara\",\"lname\":\"\
  Edson\",\"city\":\"Chicago\"}\n]\n```\n\nListing 2.27 显示了 `app.module.ts` 的内容，它导入了\
  \ Angular 的 `HttpModule`。\n\n列表 2.27: `app.module.ts`\n\n```typescript\nimport {\
