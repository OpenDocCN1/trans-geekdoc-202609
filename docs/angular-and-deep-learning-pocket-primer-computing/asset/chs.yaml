  ];\n    var svg = d3.select(\"body\")\n      .append(\"svg\")\n      .attr(\"width\"\
  , width)\n      .attr(\"height\", height);\n\n    svg.on(\"mousemove\", function()\
  \ {\n      index = (++moveCount) % circleColors.length;\n      var circle = svg.append(\"\
  circle\")\n        .attr(\"cx\", (width-100)*Math.random())\n```\n\n\n\n\n```javascript\n\
  .attr(\"cy\", (height-100)*Math.random())\n.attr(\"r\", radius)\n.attr(\"fill\"\
