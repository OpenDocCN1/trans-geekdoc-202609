  \n# 总结\n\n本附录向你介绍了 TF 2 数据集（Datasets），它们非常适合处理正常大小数据集的内容，也适用于大到无法放入内存的数据集。你学习了如何定义一个\
  \ lambda 表达式并在 TF 2 数据集中使用该表达式。\n\n接下来，你学习了各种惰性操作符，包括 `batch()`、`filter()`、`flatmap()`、`map()`、`take()`\
  \ 和 `zip()`，以及如何使用它们来定义 TF 2 数据集的子集。你还学习了如何使用 TF 2 生成器来迭代 TF 2 数据集的元素。\n\n此后，你学习了如何从\
  \ CSV 文件创建 TF 2 数据集并显示其内容。然后，你简要介绍了 `tf.estimator` 命名空间，它包含了许多实现各种算法的类，例如增强树、DNN\
  \ 分类器、DNN 回归器、线性分类器和回归器。\n\n最后，你学习了 TF 2 的其他重要方面，例如 `tf.keras.layers` 命名空间，它包含了用于\
