  \n### 什么是 LSTM？\n\nLSTM 是一种特殊的 RNN，它们非常适用于许多用例，包括自然语言处理（NLP）、语音识别和手写识别。LSTM 非常擅长处理长期依赖，这指的是相关信息与所需信息位置之间的距离。当文档某部分的信息需要“链接”到文档更远位置的信息时，就会出现这种情况。\n\
  \nLSTM 开发于 1997 年，其准确性能超过了最先进的算法。LSTM 也非常擅长处理长期依赖，这指的是相关信息与所需信息位置之间的距离。\n\n\n\n\n\
  \n[长短期记忆网络](https://en.wikipedia.org/wiki/Long_short-term_memory#cite-note-lstm1997-1)\n\
  \n这些公式展示了在时间步 `t` 期间如何计算遗忘门 `f`、输入门 `i` 和输出门 `o` 的新权重。此外，前一个链接展示了如何计算新的内部状态和隐藏状态（均在时间步\
  \ `t` 处）。\n\n注意门 `f`、`i` 和 `o` 的计算模式：它们都计算了两个项之和，其中每一项都是涉及 `x(t)` 和 `h(t)` 的乘积，然后对该和应用\
  \ `sigmoid` 函数。具体来说，这里是时间 `t` 处遗忘门的公式：\n\n```\nf(t) = sigma(W(f)*x(t) + U(f)*h(t)\
  \ + b(f))\n```\n\n在前述的公式中，`W(f)`、`U(f)` 和 `b(f)` 分别是与 `x(t)` 相关的权重矩阵、与 `h(t)` 相关的权重矩阵以及遗忘门\
  \ `f` 的偏置向量。\n\n注意 `i(t)` 和 `o(t)` 的计算与 `f(t)` 的计算模式相同。区别在于 `i(t)` 拥有矩阵 `W(i)` 和\
  \ `U(i)`，而 `o(t)` 拥有矩阵 `W(o)` 和 `U(o)`。因此，`f(t)`、`i(t)` 和 `o(t)` 具有并行结构。\n\n`c(t)`、`i(t)`\
  \ 和 `h(t)` 的计算基于 `f(t)`、`i(t)` 和 `o(t)` 的值，如下：\n\n```\nc(t) = f(t) * c(t-1) + i(t)\
  \ * tanh(c'(t)) \nc'(t) = sigma(W(c) * x(t) + U(c) * h(t-1))\nh(t) = o(t) * tanh(c(t))\n\
  ```\n\nLSTM 的最终状态是一个一维向量，包含了 LSTM 中所有其他层的输出。如果你有一个包含多个 LSTM 的模型，则给定 LSTM 的最终状态向量将成为该模型中下一个\
  \ LSTM 的输入。\n\n### LSTM 超参数调优\n\nLSTM 同样容易发生过拟合，如果你正在手动优化 LSTM 的超参数，这里是一些考虑性因素：\n\
  \n*   过拟合（使用正则化，如 `L1` 或 `L2`）\n*   更大的网络越容易过拟合\n*   更多的数据倾向于减少过拟合\n*   在多个轮（epochs）上训练网络\n\
  *   学习率至关重要\n*   堆叠层可能有所帮助\n*   对于 LSTM，建议使用 `softsign` 代替 `softmax`\n*   `RMSprop`、`AdaGrad`\
  \ 或 `momentum`（动量）都是很好的选择\n*   `Xavier` 权重初始化\n\n进行在线搜索以获取有关上述列表中优化器的更多信息。\n\n###\
