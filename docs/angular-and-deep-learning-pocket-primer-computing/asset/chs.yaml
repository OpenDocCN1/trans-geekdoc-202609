  \ Firefox 75.0.1 版本中测试过）。\n\n# 带有 TensorFlow.js 的简单 HTML Web 页面\n\n[Listing 6.1]\
  \ 显示了 `tfjs-hello.html` 的内容，它说明了如何引用 `TensorFlow.js` 相关的 `JavaScript` 代码并显示简单的消息。\n\
  \nListing 6.1: tfjs-hello.html\n\n```html\n<html\n<head>\n<!-- 加载 TensorFlow.js\
