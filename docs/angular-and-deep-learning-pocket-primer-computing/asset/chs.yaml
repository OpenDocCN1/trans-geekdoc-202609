  \n## 其他与服务相关的用例\n\n正如你在上一节中看到的，服务对于获取外部数据非常有用。此外，在 Angular 应用中，还有其他涉及共享数据和服务的场景。特别是，一个\
  \ Angular 应用可能需要一个服务类的多个实例，而另一个 Angular 应用则可能需要强制执行服务类的单例。另一种情况涉及在 Angular 应用中不同组件之间共享数据。\n\
  \n这三个场景在接下来的小节中将要讨论，它们基于一个非常简单的 `UserService` 类，定义如下：\n\n```typescript\nexport class\
  \ UserService {\n  private users: string[];\n  adduser(user: string) {\n    this.users.push(user);\n\
  \  }\n  getUsers() {\n    return this.users;\n  }\n}\n```\n\n### 多个服务实例\n\n假设 `UserService`、`MyComponent1`\
  \ 和 `MyComponent2` 分别定义在 TypeScript 文件 `user.service.ts`、`component1.ts` 和 `component2.ts`\
  \ 中。如果你需要每个组件拥有不同的 `UserService` 类实例，请在它们的构造函数中注入该类，如下：\n\n```typescript\n// component1.ts\n\
  export class MyComponent1 {\n  constructor(private userService: UserService) {\n\
  \  }\n}\n\n// component2.ts\nexport class MyComponent2 {\n  constructor(private\
  \ userService: UserService) {\n  }\n}\n```\n\n在前面的代码块中，`MyComponent1` 中的 `UserService`\
  \ 类实例与 `MyComponent2` 中的 `UserService` 类实例是不同的。\n\n### 单例实例\n\n考虑两个 Angular 组件必须共享同一个\
  \ `UserService` 类实例的情况。为了简单起见，假设这两个组件是根组件的子组件。在这种情况下，执行以下步骤：\n\n1) 创建一个新的服务组件（`ng\
  \ g s service`）。\n2) 在 `app.module.ts` 的 `providers` 数组中包含 `UserService`。\n3) 在\
  \ `service.component.ts` 中导入 `MyComponent1` 和 `MyComponent2`。\n4) 从 `MyComponent1`\
  \ 的 `providers` 数组中移除 `UserService`。\n5) 从 `MyComponent2` 的 `providers` 数组中移除 `UserService`。\n\
  \n步骤 #2 确保 `UserService` 类对应用中的所有组件都可用，并且该服务类只有一个实例。\n\n### 服务与组件间通信\n\n从 `MyComponent1`\
  \ 向 `MyComponent2` 发送新用户需要三个步骤。\n\n步骤 #1：在 `UserService` 中定义一个 `EventEmitter` 实例变量\
  \ `sendUser` 和一个 `sendUser()` 方法：\n\n```typescript\nexport class UserService {\n\
  \  sendUser = new EventEmitter<string>();\n  ...\n  sendUser(user: string) {\n \
  \   this.sendUser.emit(user);\n  }\n}\n```\n\n步骤 #2：在 `MyComponent1` 中定义 `onSend()`\
  \ 方法以向 `MyComponent2` 发送新用户：\n\n```typescript\nonSend(user: string) {\n  this.userService.sendUser(user);\n\
  }\n```\n\n步骤 #3：在 `MyComponent2` 中定义一个 `Observable` 来“监听”从 `MyComponent1` 发出的数据：\n\
  \n```typescript\nngOnInit() {\n  this.userService.subscribe(...);\n}\n```\n\n这里展示了前面代码块逻辑流的另一种总结方式：\n\
  \n* 用户点击按钮添加新用户。\n* `UserService` 实例将数据发送给 `Component1`。\n* `Component1` 实例“发出”新用户。\n\
  * `Component2` 实例“监听”新用户。\n\n## 将服务注入到服务中\n\n你已经看到如何使用 DI 通过构造函数将服务注入到组件中。此外，你还可以将服务注入到其他服务中。为了实现这一点，请在“被注入的服务”中使用\
  \ `@Injectable` 装饰器：\n\n```typescript\n@Injectable\n@Component({\n})\nexport class\
  \ MyService(...)\n```\n\n注意：Angular 中的 DI 只适用于类定义中包含装饰器的类。\n\n## 使用 jQuery 和 Angular\
  \ 进行 Flickr 图片搜索\n\n本节的代码示例向你展示如何在 Angular 应用中使用 jQuery，这对于通过 jQuery 执行 HTTP GET\
  \ 请求的现有 HTML 网页非常有用。\n\n从配套文件中复制 `SearchFlickr` 目录到方便的位置。现在，“cd”进入此应用并按所示安装 jQuery：\n\
  \n```bash\nnpm install jquery --save\n```\n\nListing 3.14 显示了 `app.component.ts`\
  \ 的内容，它说明了如何发起 HTTP GET 请求以根据用户在搜索框中输入的文本字符串从 Flickr 获取图片。\n\n\n\n\n\n```typescript\n\
  import * as $ from \"jquery\";\n\n@Component({\n  selector: 'app-root',\n  template:\
  \ `\n    输入一个单词并搜索相关图片：\n    <br />\n    <input id=\"searchterm\" />\n    <button\
  \ (click)=\"httpRequest()\">搜索</button>\n    <div id=\"images\"></div>\n  `\n})\n\
  export class AppComponent {\n  imageCount = 4;\n  url = \"http://api.flickr.com/services/feeds/photos_public.gne?jsoncallback=?\"\
  ;\n  constructor() {}\n  httpRequest() {\n    $.getJSON(this.url, {\n      tags:\
  \ $(\"#searchterm\").val(),\n      tagmode: \"any\",\n      format: \"json\"\n \
  \   }, function(data) {\n      $.each(data.items, function(i, item) {\n        $(\"\
  <img/>\").attr(\"src\", item.media.m).prependTo(\"#images\");\n        //if ( i\
  \ == this.imageCount ) return false;\n      });\n    });\n  }\n}\n```\n\n列表 3.14\
  \ 包含一个标准的导入语句，随后是这段代码片段：\n\n```typescript\nimport * as $ from \"jquery\";\n```\n\
  \n前面的代码片段对于 TypeScript “找到” jQuery 是必须的，这在你通过 `npm` 命令安装了它之后是可能实现的。然而，请记住，如果你删除了前面的代码片段，你将会看到以下错误（或类似的错误）：\n\
  \n`ERROR ReferenceError: \"$ is not defined\"`\n\n注意 *本节中的代码适用于 Angular 6 及更高版本，而\
  \ Angular 4 的代码需要不同的语法。*\n\n列表 3.14 的下一部分是 `@Component` 装饰器，它的 `template` 属性包含 `<input>`、`<button>`\
  \ 和 `<div>` 元素，分别用于获取用户的搜索字符串、使用该字符串执行搜索以及显示搜索结果。\n\n列表 3.14 的下一部分是导出的类 `AppComponent`，它定义了\
  \ `url` 变量，并用硬编码的字符串值初始化，该值“指向” Flickr 网站。\n\n接下来，定义了一个空构造函数，随后是 `httpRequest()`\
  \ 方法，该方法在用户点击 `<button>` 元素时被调用。由于这段代码片段，该方法调用了 jQuery 的 `getJSON()` 方法，根据 `<input>`\
  \ 元素中输入的字符串执行 Flickr 图片搜索：\n\n`tags: $(\"#searchterm\").val()`\n\n当检索到匹配的图片时，可以通过\
  \ `data.items` 获取它们，jQuery 的 `each()` 方法遍历图片列表。每张图片都通过这段片段动态插入到 `<images>` 元素中：\n\
  \n`$(\"<img/>\").attr(\"src\", item.media.m).prependTo(\"#images\");`\n\n花一点时间感受\
  \ jQuery 以这种紧凑的方式实现所需的结果。\n\n图 3.2 显示了启动此 Angular 应用并使用关键词 pasta 搜索 Flickr 的输出结果。\n\
  \n![images](img/Pg142.jpg)\n\n*图 3.2* 带有 pasta 的部分图片列表\n\n## 使用简单服务器进行 HTTP GET\
  \ 请求\n\n本节将向你展示如何使用命令行工具 `json-server`，它可以提供基于 JSON 的数据。该程序实现了非常简单服务器的功能：客户端可以发送\
  \ GET 请求以从服务器检索 JSON 数据。此外，在启动 `json-server` 的控制台中执行一个简单的命令即可让你将内存中的数据保存到文件中。\n\n\
  尽管 `json-server` 没有实现包含 Express 和 MongoDB 的 Node 应用的功能，但 `json-server` 是一个方便的程序，可以帮助你学习\
  \ Angular 应用如何与文件服务器交互。\n\n在本节启动 Angular 应用 之前，你需要执行以下步骤：\n\n* 步骤 1：安装 `json-server`。\n\
  * 步骤 2：启动 `json-server`。\n* 步骤 3：启动 Angular 应用。\n\n通过以下命令安装 `json-server`：\n\n`sudo\
  \ npm install -g json-server`\n\n进入包含 JSON 文件 `posts.json` 的 `src/assets` 目录并执行此命令：\n\
  \n`json-server posts.json`\n\n前面的命令在端口 3000 启动一个文件服务器并将 `posts.json` 的内容读入内存，使该数据可供\
  \ HTTP GET 请求使用。\n\n现在从辅助文件中将目录 `JSONServerGET` 复制到方便的位置。列表 3.15 显示了 `app.component.ts`\
  \ 的内容，它说明了如何向文件服务器发送 HTTP GET 请求以检索数据。\n\n*列表* 3.15：app.component.ts\n\n```typescript\n\
  import {Component} from '@angular/core';\nimport {Inject} from '@angular/core';\n\
  import {HttpClient} from '@angular/common/http';\nimport {HTTP_BINDINGS} from '@angular/common/http';\n\
  \n@Component({\n  selector: 'app-root',\n  template: `\n    <button (click)=\"httpRequest()\"\
  >获取信息</button>\n    <div>\n      <li *ngFor=\"let post of postData\">\n        {{post.author}}\n\
  \        {{post.title}}\n      </li>\n    </div>\n  `\n})\nexport class AppComponent\
  \ {\n  postData = \"\";\n  constructor(@Inject(HttpClient) public http:HttpClient)\
  \ {\n  }\n  httpRequest() {\n    this.http.get('http://localhost:3000/posts')\n\
  \      .subscribe(\n        data => this.postData = JSON.stringify(data),\n    \
  \    err => console.log(err)\n      );\n  }\n  postInfo() {\n    //----------------------------------------------\n\
  \    var myObject = eval('(' + this.postData + ')');\n    this.postData = myObject;\n\
  \  }\n}\n```\n\n列表 3.15 包含了与早期示例相似的代码。第一个区别涉及 `template` 属性。第二个区别是端点 `http://localhost:3000/posts`。\n\
