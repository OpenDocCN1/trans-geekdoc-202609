  \n# 附录 B：TF 2 简介\n\n欢迎来到 TensorFlow 2！本章将介绍 TensorFlow 2（简称 TF 2）的各种功能，以及 TF 2 体系下的某些\
  \ TF 2 工具和项目。本附录包含了 TF 2 代码示例，展示了新的 TF 2 特性（例如 `tf.GradientTape` 和 `@tf.function`\
  \ 装饰器），以及展示如何以“TF 2 方式”编写代码的示例。\n\n尽管本章中的许多主题非常简单，但它们为你学习 TF 2 提供了基础。你可以将本附录视为学习\
  \ TF 2 的起点，并将其与讨论 Keras 的附录结合使用。\n\n请记住，TensorFlow 1.x 版本在 TF 2 正式发布后被视为遗留代码。Google\
  \ 将仅为 TF 1.x 提供安全相关的更新（即不再开发新代码），并在 TF 2 初始正式发布后至少支持 TensorFlow 1.x 一年。为了方便起见，TensorFlow\
  \ 提了一个转换脚本，以便在许多情况下方便将 TensorFlow 1.x 代码自动转换为 TF 2 代码（详细将在在本章稍后的部分提供）。\n\n本附录包含几个关于\
  \ TF 1.x 的章节，所有内容都放置在附录的末尾。如果你没有 TF 1.x 代码，这些章节是可选的（并已标记为可选）。\n\n附录的第一部分简要讨论了某些\
  \ TF 2 特性以及包含在 TF 2 体系下的某些工具。附录的第二部分向你展示如何编写涉及 TF 常量和 TF 变量的 TF 2 代码。\n\n第三部分稍作离题：你将学习新的\
  \ TF 2 Python 函数装饰器 `@tf.function`，它用于本附录中的许多代码示例。虽然这个装饰器并非总是必须的，但熟悉这一功能是非常重要的，本节还讨论了在使用它时一些不符合直觉的注意事项。\n\
  \n附录的第四部分向你展示如何在 TF 2 中执行典型的算术运算、如何使用某些内置的 TF 2 函数，以及如何计算三角值。如果你需要进行科学计算，请参阅有关 TF\
  \ 2 中浮点数可实现类型的代码示例。本节还展示了你如何使用 for 循环以及如何计算指数值。\n\n第五部分包含涉及数组的 TF 2 代码示例，例如创建单位矩阵、常量矩阵、随机均匀矩阵和截断正态矩阵，并解释了截断矩阵与随机矩阵之间的区别。本节还展示了你如何在\
  \ TF 2 中相乘二阶张量，以及如何将 Python 数组转换为 TF 2 中的二阶张量。第六部分包含了说明如何使用 TF 2 某些新功能（如 `tf.GradientTape`）的代码示例。\n\
  \n尽管书中的 TF 2 代码示例使用 Python 3.x，但也可以修改这些示例以在 Python 2.7 下运行。此外请注意书中的以下约定（仅限本书）：TF\
  \ 1.x 文件具有“tf”前缀，TF 2 文件具有“tf2”前缀。\n\n在考虑以上之后，下一节将讨论 TF 2 的细节、其架构及其某些功能。\n\n## 什么是\
  \ TF 2？\n\nTF 2 是 Google 的一个开源框架，是 TensorFlow 的最新版本。TF 2 框架是一个现代框架，非常适合机器学习（ML）和深度学习（DL），并通过\
  \ Apache 许可证提供。有趣的是，TensorFlow 在艺术、音乐和医学等领域的创意和海量用例让许多人惊讶，甚至让 TF 团队的成员感到惊讶。由于多种原因，TensorFlow\
  \ 团队创建了 TF 2，目标是整合 TF API、消除 API 重复、实现快速原型设计并让调试变得更加容易。\n\n如果你是 Keras 的粉丝，那么有一个好消息：TF\
  \ 2 的改进部分归功于将 Keras 采用 TF 2 核心功能的一部分。事实上，TF 2 扩展并优化了 Keras，使其能够利用 TF 2 中的所有高级功能。\n\
  \n如果你主要处理深度学习模型（CNN、RNN、LSTM 等），你可能会使用 `tf.keras` 命名空间中的某些类，该空间是 Keras 在 TF 2 中的实现。正如你之后将看到的，有几种定义\
  \ Keras 模型的方法：通过 `tf.keras.Sequential` 类、函数式定义以及通过子类化技术。或者，你仍然可以使用低级操作和自动微分。\n\n\
  此外，TF 2 消除了重复的功能，在整个 TF 2 生态系统中提供了更直观的语法，并提供了一个名为 `tf.compat.v1` 的后兼容模块（不包含 `tf.contrib`），以及帮助用户从\
  \ TF 1.x 迁移到 TF 2 的转换脚本 `tf_upgrade_v2`\n\n另一个重大变化是将动态执行作为默认模式（而不是延迟执行），并带有如 `@tf.function`\
  \ 装饰器的新特性。以下是 TF 2 特性及相关技术的简列表：\n\n*   支持 `tf.keras`：用于机器学习和深度学习的高级规范\n*   `tensorflow.js`\
  \ v1.0：现代浏览器中的 TF\n*   `TensorFlow Federated`：用于机器学习和去中心化数据的开源框架\n*   `Ragged Tensors`：嵌套变长（“不规则”）列表\n\
  *   `TensorFlow Probability`：概率模型结合深度学习\n*   `Tensor2Tensor`：模型和数据集库\n\nTF 2 还支持多种编程语言和硬件平台，包括\n\
  \n*   支持 Python、Java、C++\n*   桌面、服务器、移动设备（TF Lite）\n*   CPU/GPU/TPU 支持\n*   Linux\
  \ 和 Mac OS X 支持\n*   Windows 虚拟机\n\n访问 TF 2 首页，你可以在那里找到许多 TF 2 资源：https://www.tensorflow.org\n\
  \n## TF 2 用例\n\nTF 2 设计用于解决各种用例中出现的任务，其中一些列在此：\n\n*   图像识别\n*   计算机视觉\n*   语音/声音识别\n\
  *   时间序列分析\n*   语言检测\n*   语言翻译\n*   文本处理\n*   手写识别\n\n上述用例可以在 TF 1.x 也可以 TF 2 中解决，而在后者的情况下，代码比其\
  \ TF 1.x 对应部分通常更简单简洁。\n\n## TF 2 架构：简述\n\nTF 2 使用 C++ 编写，并支持涉及原始值和张量的操作（后文讨论）。TF\
  \ 1.x 的默认执行模式是*延迟执行*，而 TF 2 使用*即时执行*（即“立即模式”）。尽管 TF 1.4 引入了即时执行，但你在网上找到的大多数 TF 1.x\
  \ 代码示例都使用延迟执行。\n\n\n\n\nTF 2 支持对张量（即增强型多维数组）进行算术运算，以及条件逻辑、for 循环和 while 循环。虽然在 TF\
  \ 2 中可以在执行模式（eager execution mode）和延迟模式（deferred mode）之间切换，但本书中的所有代码示例均使用执行模式。\n\
  \n数据可视化通过 `TensorBoard`（在第 2 节中讨论）处理，它是 TF 2 的一部分。正如你在本书的代码示例看到的，TF 2 API 在 Python\
  \ 中可用，因此可以嵌入到 Python 脚本中。\n\n让我们学习如何安装 TF 2，这是下一节的主题。\n\n# TF 2 安装\n\n通过命令行执行以下命令来安装\
  \ TensorFlow：\n\n```bash\npip install tensorflow==2.0.0-beta1\n```\n\n当 TF 2 的正式版本发布时，你可以从命令行执行以下命令（这将是\
  \ TF 2 的最新版本）：\n\n```bash\npip install --upgrade tensorflow\n```\n\n如果你想安装特定版本的\
  \ TensorFlow（例如 1.13.1 版本），请输入以下命令：\n\n```bash\npip install --upgrade tensorflow==1.13.1\n\
  ```\n\n你也可以降低已安装的 TensorFlow 版本。例如，如果你安装了 1.13.1 版本并想安装 1.10 版本，请在前面的代码段中指定值 `1.10`。TensorFlow\
  \ 将卸载你的当前版本并安装你指定的版本（即 `1.10`）。\n\n作为健全检查，创建一个包含以下三行代码的 Python 脚本，以确定机器上安装的 TF 版本号：\n\
  \n```python\nimport tensorflow as tf\nprint(\"TF Version:\",tf.__version__)\nprint(\"\
  eager execution:\",tf.executing_eagerly())\n```\n\n运行上述代码，将看到类似下面的输出：\n\n```\nTF\
  \ version: 2.3.0\neager execution: True\n```\n\n作为一个 TF 2 代码的简单示例，请将此代码段放在文本文件中：\n\
  \n```python\nimport tensorflow as tf\nprint(\"1 + 2 + 3 + 4 =\", tf.reduce_sum([1,\
  \ 2, 3, 4]))\n```\n\n从命令行运行上述代码，看到看到输出：\n\n```\n1 + 2 + 3 + 4 = tf.Tensor(10, shape=(),\
  \ dtype=int32)\n```\n\n# TF 2 和 Python REPL\n\n如果你还不熟悉 Python REPL（读取-求值-打印循环），可以通过打开命令行窗口并输入以下命令来访问：\n\
  \n```bash\npython\n```\n\n作为一个简单的说明，通过以下方式导入 TF 2 库，在 REPL 中访问 TF 2 相关功能：\n\n```python\n\
  >>> import tensorflow as tf\n```\n\n现在使用此命令检查机器上安装的 TF 2 版本：\n\n```python\n>>> print('TF\
  \ version:',tf.__version__)\n```\n\n上述代码段的输出所示（你看到的数字取决于你安装的 TF 2 版本）：\n\n```\n\
  TF version: 2.0.0-beta1\n```\n\n虽然 REPL 适用于短代码块，但本书中的 TF 2 代码示例是 Python 脚本，你可以用\
  \ Python 可执行器启动它们。\n\n# 其他基于 TF 2 的工具包\n\n除了提供对多设备上基于 TF 2 代码的支持外，TF 2 还提供了以下工具包：\n\
  \n*   用于可视化的 `TensorBoard`（作为 TensorFlow 的一部分）\n*   `TensorFlow Serving`（托管在服务器上）\n\
  *   `TensorFlow Hub`\n*   `TensorFlow Lite`（用于移动应用）\n*   `Tensorflow.js`（用于网页和 NodeJS）\n\
  \n`TensorBoard` 是一个在浏览器中运行的图形可视化工具。如下从命令行启动 `TensorBoard`：打开命令行窗口并输入以下命令以访问 `/tmp/abc`\
  \ 子目录（或你选择的目录）中保存的 TF 图：\n\n```bash\ntensorboard --logdir /tmp/abc\n```\n\n注意，上述命令中\
  \ `logdir` 参数前面有两个连续的连字符（----）。现在启动浏览器并导航到此 URL：`localhost:6006`\n\n片刻之后，你将看到在代码中创建并保存到\
  \ `/tmp/abc` 目录的 TF 2 图的可视化。\n\n`TensorFlow Serving` 是一个为生产环境设计的云端灵活、高性能机器学习模型部署系统。TensorFlow\
  \ Serving 可以轻松部署新算法和实验，同时保持相同的服务器架构和 API。更多信息请访问：`https://www.TF2.org/serving/`\n\
  \n`TensorFlow Lite` 专门为移动开发（包括 Android 和 iOS）创建。请记住，`TensorFlow Lite` 代替了 TF 2 Mobile，后者是早期开发移动应用的\
  \ SDK。`TensorFlow Lite` 支持设备端推理、低延迟和小体积。更多关于 `TensorFlow Lite` 的信息请访问：`https://www.tensorflow.org/`\n\
  \n最近添加的是 `tensorflow.js`，它提供了 JavaScript API。`tensorflow.js` 支持 Web 页面。关于 `tensorflow.js`\
  \ 的信息请访问：`https://www.tensorflow.org`\n\n# TF 2 执行模式\n\n与 TF 1.x 代码相比，执行模式使得编写代码变得更加容易。你可能会发现\
  \ TF 1.4 引入了执行模式，但该功能未被充分利用。在 TF 1.x 代码中，TensorFlow 创建会话而不是图。执行模式简化了调试。\n\n# TF\
  \ 2 张量、数据类型和基本类型\n\n简单来说，TF 2 张量类似于 NumPy `ndarray` 的多维数组。TF 2 张量由其维度定义，如下：\n\n\
  *   标量：0 阶\n*   向量：一阶张量\n*   矩阵：二阶张量\n*   三维数组：三阶张量\n\n下一节将讨论可用的一些数据类型，随后是关于基本类型的节。\n\
  \n## TF 2 数据类型\n\nTF 2 支持以下数据类型（类似于 1.x 中支持的数据类型）：\n\n*   `tf.float32`\n*   `tf.float64`\n\
  *   `tf.int8`\n*   `tf.int16`\n*   `tf.int32`\n*   `tf.int64`\n*   `tf.uint8`\n\
  *   `tf.string`\n*   `tf.bool`\n\n列表中的数据类型一言易懂：两个浮点类型、四个整数类型、一个无符号整数类型、一个字符串类型和一个布尔类型。你可以看到\
  \ 32 位和 64 位浮点类型，整数类型从 8 位到 64 位。\n\n## TF 2 基本类型\n\nTF 2 支持 `tf.constant()` 和 `tf.Variable()`\
  \ 作为基本类型。注意 `tf.Variable()` 中的大写“V”：这表示 TF 2 类（对于小写字母开头的情况，如 `tf.constant()`）。\n\
  \nTF 2 `constant` 是不可变值，一个简单的示例所示：\n\n```python\naconst = tf.constant(3.0)\n```\n\
  \nTF 2 `variable` 是 TF 2 图中的可训练值。例如，对于由欧几平面上的点组成的数据集，拟合线的斜率 `m` 和截距 `b` 是可训练值的两个例子。一些\
  \ TF 变量的示例所示：\n\n```python\nb = tf.Variable(3, name=\"b\")\nx = tf.Variable(2, name=\"\
  x\")\nz = tf.Variable(5*x, name=\"z\")\nW = tf.Variable(20)\nlm = tf.Variable(W*x\
  \ + b, name=\"lm\")\n```\n\n\n\n\n注意 `b`、`x` 和 `z` 被定义为 TF 变量。此外，`b` 和 `x` 使用数值初始化，而变量\
  \ `z` 的值是一个依赖于 `x` 的值（该值等于 2）的表达式。\n\n# TF 2 中的常量\n\n以下是关于 TF 2 常量某些属性的简短列表：\n\n\
  - 在定义期间初始化\n- 无法更改其值（“不可变”）\n- 可以指定其名称（可选）\n- 必须指定类型（例如：`tf.float32`）\n- 在训练期间不会被修改\n\
  \n列表 B.1 显示了 `tf2_constants1.py` 的内容，说明了如何分配并打印某些 TF 2 常量的值。\n\n*列表* B.1：`tf2_constants1.py`\n\
  \n```python\nimport tensorflow as tf \n\nscalar = tf.constant(10)\n\nvector = tf.constant([1,2,3,4,5])\n\
  \nmatrix = tf.constant([[1,2,3],[4,5,6]])\n\ncube = tf.constant([[[1],[2],[3]],[[4],[5],[6]],[[7],[8],[9]]])\n\
  \nprint(scalar.get_shape())\n\nprint(vector.get_shape())\n\nprint(matrix.get_shape())\n\
  \nprint(cube.get_shape())\n```\n\n列表 B.1 包含四个 `tf.constant()` 语句，分别定义了维度为 0、1、2\
  \ 和 3 的 TF 2 张量。列表 B.1 的第二部分包含四个 `print()` 语句，显示了列表 B.1 第一部分定义的四个 TF 2 常量的形状。列表\
  \ B.1 的输出如下：\n\n```\n()\n(5,)\n(2, 3)\n(3, 3, 1)\n```\n\n列表 B.2 显示了 `tf2_constants2.py`\
  \ 的内容，说明了如何给 TF 2 常量赋值并然后打印这些值。\n\n*列表* B.2：`tf2_constants2.py`\n\n```python\nimport\
  \ tensorflow as tf \n\nx = tf.constant(5,name=\"x\")\n\ny = tf.constant(8,name=\"\
  y\")\n\n@tf.function\ndef calc_prod(x, y):\n    z = 2*x + 3*y\n    return z\n\n\
  result = calc_prod(x, y)\n\nprint('result =',result)\n```\n\n列表 B.2 定义了一个带装饰器的 Python\
  \ 函数 `calc_prod()`，其 TF 2 代码在其他情况下会被包含在 TF 1.x 的 `tf.Session()` 代码块中。具体来说，`z` 将包含在\
  \ `sess.run()` 语句中，以及提供 `x` 和 `y` 值的 `feed_dict`。幸运的是，TF 2 中带装饰器的 Python 函数看起来就像普通的\
  \ Python 代码。\n\n# TF 2 中的变量\n\nTF 2.0 删除了全局集合及其相关的 API，例如 `tf.get_variable`、`tf.variable_scope`\
  \ 和 `tf.initializers.global_variables`。每当你在 TF 2 中需要 `tf.Variable` 时，直接构造并初始化它，如下：\n\
  \n```python\ntf.Variable(tf.random.normal([2, 4]))\n```\n\n列表 B.3 显示了 `tf2_variables.py`\
  \ 的内容，说明了如何在 `with` 代码块中计算涉及 TF 常量和变量的值。\n\n*列表* B.3：`tf2_variables.py`\n\n```python\n\
  import tensorflow as tf\n\nv = tf.Variable([[1., 2., 3.], [4., 5., 6.]] )\n\nprint(\"\
  v.value():\", v.value())\n\nprint(\"\")\n\nprint(\"v.numpy():\", v.numpy())\n\n\
  print(\"\")\n\nv.assign(2 * v)\n\nv[0, 1].assign(42)\n\nv[1].assign([7., 8., 9.])\n\
  \nprint(\"v:\",v)\n\nprint(\"\")\n\ntry:\n    v[1] = [7., 8., 9.]\nexcept TypeError\
  \ as ex:\n    print(ex)\n```\n\n列表 B.3 定义了一个 TF 2 变量 `v` 并打印它的值。列表 B.3 的下部分更新了 `v`\
  \ 的值并打印了新值。列表 B.3 的最后部分包含一个 `try/except` 块，尝试更新 `v[1]` 的值。列表 B.3 的输出如下：\n\n```\n\
  v.value(): tf.Tensor([[1., 2., 3.], [4., 5., 6.]], shape=(2, 3), dtype=float32)\n\
  v.numpy(): [[1., 2., 3.], [4., 5., 6.]]\nv: <tf.Variable 'Variable:0' shape=(2,\
  \ 3), dtype=float32, numpy=array([[2., 42.], [7., 8., 9.]])>\n'ResourceVariable'\
  \ object does not support assignment\n```\n\n这就是包含各种常量和变量组合的 TF 2 代码快速概览。接下来的几节将深入探讨你在前面章节中看到的类型。\n\
  \n## tf.rank() API\n\nTF 2 张量的 `rank` 是张量的维度，而张量的 `shape` 是每个维度中的元素数量。列表 B.4 显示了\
  \ `tf2_rank.py` 的内容，说明了如何查找 TF 2 张量的秩。\n\n*列表* B.4：`tf2_rank.py`\n\n```python\n\
  import tensorflow as tf\n\na = tf.constant(10)\nb = tf.constant([1, 2, 3, 4, 5])\n\
  c = tf.constant([[1, 2, 3], [4, 5, 6]])\nd = tf.constant([[[1], [2], [3]], [[4],\
  \ [5], [6]], [[7], [8], [9]]])\n\nprint(tf.rank(a))\nprint(tf.rank(b))\nprint(tf.rank(c))\n\
  print(tf.rank(d))\n```\n\n列表 B.4 包含了四个常量，分别定义了维度为 0、1、2 和 3 的 TF 2 张量。接下来的代码打印了这四个张量的秩。列表\
  \ B.4 的输出如下：\n\n```\n0\n1\n2\n3\n```\n\na = tf.constant([1, 2, 3, 4, 5])\nb = tf.constant([[1,\
  \ 2, 3], [4, 5, 6]])\nc = tf.constant([[[1], [2], [3]], [[4], [5], [6]], [[7], [8],\
  \ [9]]])\n\ndef show_rank(x):\n    print(tf.rank(x))\n\nshow_rank(a)\nshow_rank(b)\n\
  show_rank(c)\nshow_rank(d)\n\n列表 B.4 展示了如何通过 `show_rank` 函数查看不同维度张量的秩。输出如下：\n\n\
  ```\n0\n1\n2\n3\n```\n\n## tf.rank()\n\n```python\nimport tensorflow as tf\n\na\
  \ = tf.constant([1, 2, 3, 4, 5])\nb = tf.constant([[1, 2, 3], [4, 5, 6]])\nc = tf.constant([[[1],\
