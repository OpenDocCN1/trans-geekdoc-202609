  , v.numpy())\n\nprint(\"\")\n\nv.assign(2 * v)\n\nv[0, 1].assign(42)\n\nv[1].assign([7.,\
  \ 8., 9.])\n\nprint(\"v:\",v)\n\nprint(\"\")\n\ntry:\n    v[1] = [7., 8., 9.]\n\
  except TypeError as ex:\n    print(ex)\n```\n\n列表 B.3 定义了一个 TF 2 变量 `v` 并打印它的值。列表\
  \ B.3 的下部分更新了 `v` 的值并打印了新值。列表 B.3 的最后部分包含一个 `try/except` 块，尝试更新 `v[1]` 的值。列表 B.3\
  \ 的输出如下：\n\n```\nv.value(): tf.Tensor([[1., 2., 3.], [4., 5., 6.]], shape=(2, 3),\
  \ dtype=float32)\nv.numpy(): [[1., 2., 3.], [4., 5., 6.]]\nv: <tf.Variable 'Variable:0'\
  \ shape=(2, 3), dtype=float32, numpy=array([[2., 42.], [7., 8., 9.]])>\n'ResourceVariable'\
  \ object does not support assignment\n```\n\n\n\n\n\n- 一种可以通过操作更新的张量\n- 存在于 `session.run`\
  \ 上下文之外\n- 类似于“普通”变量\n- 存储训练好的模型参数\n- 变量可以是共享的（或不可训练的）\n- 用于存储/维护状态\n- 内部存储一个持久化张量\n\
  - 你可以读取/修改张量的值\n- 多个工作线程可以看到 `tf.Variables` 的相同值\n- 表示你的程序所操作的共享、持久化状态的最佳方式\n\n\
  TF 2 还提供了 `tf.assign()` 方法来修改 TF 2 变量的值；请务必阅读本章后文中相关的代码示例，以便学习如何正确使用此 API。\n\n##\
  \ TF 2 变量 (Variables) 对比 张量 (Tensors)\n\n请记住 TF 变量与 TF 张量之间的以下区别：TF `variables`\
  \ 代表模型的可训练参数（例如：神经网络的权重和偏置），而 TF `tensors` 代表输入到模型中的数据以及这些数据在通过模型过程中的中间表示。\n\n在下一节中，你将学习用于\
  \ Python 函数的 `@tf.function` “装饰器”以及它如何提高性能。\n\n## TF 2 中的 @tf.function 是什么？\n\n\
  TF 2 为 Python 函数引入了 `@tf.function` “装饰器”，用于定义图并执行会话执行：它是 TF 1.x 中 `tf.Session()`\
  \ 的某种继任。由于图仍然有用，`@tf.function` 会透明地将 Python 函数转换为由图支持的函数。该装饰器还将依赖张量的 Python 控制流转换为\
  \ TF 控制流，并添加控制依赖以排序 TF 2 状态的读写操作。请记住，`@tf.function` 与 TF 2 操作配合最好，而非 NumPy 操作或 Python\
  \ 原生类型。\n\n通常情况下，你不需要装饰所有函数；使用它装饰高层计算，例如训练的一个步骤或模型的向前传播。\n\n尽管 TF 2 的动态执行模式提供了更直观的用户界面，但这种易用性可能会以性能为代价。幸运的是，`@tf.function`\
  \ 装饰器是一种在 TF 2 代码中生成图的技术，其执行速度比动态执行模式更快。\n\n性能收益取决于所执行的操作类型：矩阵乘法无法从使用 `@tf.function`\
  \ 中获益，而优化深度神经网络可以从 `@tf.function` 中受益。\n\n## @tf.function 是如何工作的？\n\n当你用 `@tf.function`\
  \ 装饰一个 Python 函数时，TF 2 会自动以图模式构建该函数。如果一个被 `@tf.function` 装饰的 Python 函数调用了其他未装饰的\
  \ Python 函数，那么这些“未装饰” Python 函数中的代码也将包含在生成的图中。\n\n另一个需要注意的点是，动态执行模式下的 `tf.Variable`\
  \ 实际上是一个“普通的” Python 对象：该对象在超出作用范围时会被销毁。如果函数通过 `@tf.function` 进行了装饰，则 `tf.Variable`\
  \ 对象将定义一个持久化对象。在这种情况下，动态执行被禁用，`tf.Variable` 对象定义了持久化 TF 2 图中的一个节点。因此，在没有注解的情况下可以在动态模式下运行的函数，在装饰上\
  \ `@tf.function` 后可能会失败。\n\n## TF 2 中 @tf.function 的注意事项\n\n\n\n\n\n```python\n\
  a = tf.constant([[10,10],[11.,1.]])\nb = tf.constant([[1.,0.],[0.,1.]])\nc = tf.matmul(a,\
  \ b)\nreturn c\nprint(func().numpy())\n```\n\n列表 B.8 定义了一个被装饰的 Python 函数：其余代码与列表\
  \ B.7 相同。然而，由于使用了 `@tf.function` 注解，Python 函数 `func()` 被封装在了一个 `tensorflow.python.eager.def_function.Function`\
  \ 对象中。该 Python 函数被赋值给该对象的 `.python_function` 属性。\n\n当调用 `func()` 时，图的构建开始。此时只有 Python\
  \ 代码被执行，并且函数的行为会被追踪，以便 TF 2 能够收集构建图所需的数据。输出结果所示：\n\n```text\n[[20. 30.]\n [22. 3.]]\n\
  ```\n\n## 使用 @tf.function 重载函数\n\n如果你用过 `Java` 和 `C++` 等编程语言，那么你已经熟悉函数重载（overloading）的概念。如果你对这个术语很陌生，那么它的概念很简单：一个`重载函数`是指可以用不同数据类型调用的函数。例如，你可以定义一个重载的“add”函数，它既可以相加两个数字，也可以“add”两个字符串（即拼接两个字符串）。\n\
  \n如果你感兴趣，各种编程语言中的重载函数是通过“名称修饰”（`name mangling`）实现的，这意味着函数的签名（函数的参数及其数据类型）会被附加到函数名称后面，以生成唯一的函数名称。（这在“底层”完成，意味着你不需要担心这些实现细节。）\n\
  \n列表 B.9 显示了 `tf2_overload.py` 的内容，它阐明了如何定义一个可以用不同数据类型调用的被装饰 Python 函数。\n\n*列表*\
  \ B.9：`tf2_overload.py`\n\n```python\nimport tensorflow as tf\n\n@tf.function\n\
  def add(a):\n    return a + a \n\nprint(\"Add 1:\", add(1))\nprint(\"Add 2.3:\"\
  , add(2.3))\nprint(\"Add string tensor:\", add(tf.constant(\"abc\")))\n\nc = add.get_concrete_function(tf.TensorSpec(shape=None,\
  \ dtype=tf.string))\nc(a=tf.constant(\"a\"))\n```\n\n列表 B.9 定义了一个被装饰的 Python 函数\
  \ `add()`，其前面有一个 `@tf.function` 装饰器。该函数可以通过传递整数、小数值或 TF 2 张量来调用，并计算出正确的的结果。运行代码查看以下输出：\n\
  \n```text\nAdd 1: tf.Tensor(2, shape=(), dtype=int32)\nAdd 2.3: tf.Tensor(4.6, shape=(),\
  \ dtype=float32)\nAdd string tensor: tf.Tensor(b'abcabc', shape=(), dtype=string)\n\
  c: <tensorflow.python.eager.function.ConcreteFunction object at 0x1209576a0>\n```\n\
  \n## 什么是 TF 2 中的 AutoGraph？\n\nAutoGraph 指从 Python 代码到其图表示的转换，这是 TF 2 中的一项重大新功能。AutoGraph\
  \ 会自动应用于被 `@tf.function` 装饰的函数；该装饰器会从 Python 函数创建可用的图。\n\nAutoGraph 将 Python 语法的子集转换为可移植、高性能且与语言无关的图表示，从而弥补了\
  \ TF 1.x 和 TF 2.0 之间的差距。事实上，你可以使用此代码片段来检查其自动生成的代码。例如，如果你定义了一个名为 `my_product()` 的\
  \ Python 函数，可以使用此片段检查其自动生成的代码：\n\n```python\nprint(tf.autograph.to_code(my_product))\n\
  ```\n\n特别地，Python 的 `for/while` 结构通过 `tf.while_loop` 在 TF 2 实现（支持 `break` 和 `continue`）。Python\
  \ 的 `if` 结构通过 `tf.cond` 在 TF 2 实现。`for in dataset` 通过 `dataset.reduce` 在 TF 2 实现。\n\
  \nAutoGraph 还有关于转换循环的规则。如果循环中的迭代对象是 `Tensor`，则 `for` 循环会被转换；如果 `while` 条件依赖于 `Tensor`，则\
  \ `while` 循环会被转换。如果循环被转换，它会通过 `tf.while_loop` 动态展开，对于 `for in data.Dataset` 的特殊情况（后者转换为\
  \ `data.reduce`）。如果循环未被转换，则会被静态展开。\n\nAutoGraph 支持任意深度的控制流，因此你可以实现许多类型的程序。\n\n##\
  \ TF 2 中的算术运算\n\n列表 B.10 显示了 `tf2_arithmetic.py` 的内容，它说明了如何在 TF 2 中执行算术运算。\n\n*列表*\
  \ B.10：`tf2_arithmetic.py`\n\n```python\nimport tensorflow as tf\n\n@tf.function\
  \ # 用 tf.print() 替换 print()\ndef compute_values():\n    a = tf.add(4, 2)\n    b\
  \ = tf.subtract(8, 6)\n    c = tf.multiply(a, 3)\n    d = tf.math.divide(a, 6)\n\
  \    print(a) # 6\n    print(b) # 2\n    print(c) # 18\n    print(d) # 1\n\ncompute_values()\n\
  ```\n\n列表 B.10 定义了被装饰的 Python 函数 `compute_values()`，分别通过 `tf.add()`、`tf.subtract()`、`tf.multiply()`\
  \ 和 `tf.math.divide()` API 计算两个数字的和、差、积和商。四个 `print()` 语句显示了 `a`、`b`、`c` 和 `d` 的值。列表\
  \ B.10 的输出如下：\n\n```text\ntf.Tensor(6, shape=(), dtype=int32)\ntf.Tensor(2, shape=(),\
  \ dtype=int32)\ntf.Tensor(18, shape=(), dtype=int32)\ntf.Tensor(1.0, shape=(), dtype=float64)\n\
  ```\n\n## TF 2 算术运算的注意事项\n\n你也可以执行涉及 TF 2 常量的变量算术运算。列表 B.11 显示了 `tf2_const_var.py`\
  \ 的内容，说明了如何执行涉及 TF 2 常量变量的算术运算。\n\n列表 B.11：`tf2_const_var.py`\n\n```python\nimport\
  \ tensorflow as tf\n\nv1 = tf.Variable([4.0, 4.0])\nc1 = tf.constant([1.0, 2.0])\n\
  diff = tf.subtract(v1,c1)\nprint(\"diff:\",diff)\n```\n\n列表 B.11 计算 `v1` 和 `c1`\
  \ 的差，输出所示：\n\n```text\ndiff: tf.Tensor([3., 3.], shape=(2,), dtype=float32)\n```\n\
  \n你也可以执行涉及 TF 2 常量的变量算术运算。（此处提供的文本存在一些重叠/混淆，保持核心逻辑）。\n\n如果你更新了 `v1` 的值，输出将不会改变。列表\
  \ B.12 显示了 `tf2_const_var.py` 的内容，说明了如何执行涉及 TF 2 常量变量的算术运算。\n\n列表 B.12：`tf2_const_var.py`\n\
  \n```python\nimport tensorflow as tf\n\nv1 = tf.Variable([4.0, 4.0])\nc1 = tf.constant([1.0,\
  \ 2.0])\ndiff = tf.subtract(v1,c1)\nprint(\"diff:\",diff)\n```\n\n列表 B.12 定义了一个被装饰的\
  \ Python 函数 `add()`，其前面有一个 `@tf.function` 装饰器。该函数可以通过传递整数、小数值或 TF 2 张量来调用，并计算出正确的的结果。运行代码查看以下输出：\n\
  \n```text\nAdd 1: tf.Tensor(2, shape=(), dtype=int32)\nAdd 2.3: tf.Tensor(4.6, shape=(),\
  \ dtype=float32)\nAdd string tensor: tf.Tensor(b'abcabc', shape=(), dtype=string)\n\
  c: <tensorflow.python.eager.function.ConcreteFunction object at 0x1209576a0>\n```\n\
  \n## TF 2 和内置函数\n\n列表 B.13 显示了 `tf2_math_ops.py` 的内容，它说明了如何在 TF 2 中执行算术运算。\n\n*列表*\
  \ B.13：`tf2_math_ops.py`\n\n```python\nimport tensorflow as tf\n\nPI = 3.141592\n\
  \n@tf.function # 用 tf.print() 替换 print()\ndef math_values():\n    print(tf.math.divide(12,8))\n\
  \    print(tf.math.floordiv(20.0,8.0))\n    print(tf.sin(PI))\n    print(tf.cos(PI))\n\
  \    print(tf.math.divide(tf.sin(PI/4.), tf.cos(PI/4)))\n\nmath_values()\n```\n\n\
  列表 B.13 包含一个硬编码的 `PI` 近似，随后是被装饰的 Python 函数 `math_values()`，带有五个 `print()` 语句用于显示各种算术结果。特别注意第三个输出值是一个非常小的数字（正确值为零）。列表\
  \ B.13 的输出为：\n\n```text\n1.5\ntf.Tensor(2.0,shape=(), dtype=float32)\ntf.Tensor(6.2783295e-07,shape=(),\
  \ dtype=float32)\ntf.Tensor(-1.0,shape=(), dtype=float32)\ntf.Tensor(0.99999964,shape=(),\
  \ dtype=float32)\n```\n\n\n\n\nListing B.14 与 Listing B.13 中的代码几乎相同：唯一的区别在于 Listing\
  \ B.14 为 `PI` 指定了硬编码值，而 Listing B.14 将 `m.pi` 的值赋值给 `PI`。因此，近似值在零的正确值上更更近了一位小数。Listing\
  \ B.14 的输出在此。注意由于 Python `print()` 函数的影响，输出格式与 Listing B.13 有不同：\n\n```\n1.5\ntf.Tensor(2.0,shape=(),\
  \ dtype=float32)\ntf.Tensor(-8.742278e-08,shape=(), dtype=float32)\ntf.Tensor(-1.0,\
  \  shape=(), dtype=float32)\ntf.Tensor(1.0,  shape=(), dtype=float32)\n```\n\n#\
  \ 在 TF 2 中计算三角值\n\nListing B.15 显示了 `tf2_trig_values.py` 的内容，它说明了如何在 TF 2 中计算涉及三角函数的值。\n\
  \n*列表* B.15: `tf2_trig_values.py`\n\n```\nimport tensorflow as tf\nimport math as\
  \ m\n\nPI = tf.constant(m.pi)\n\na = tf.cos(PI/3.)\nb = tf.sin(PI/3.)\nc = 1.0/a\
  \ # sec(60)\nd = 1.0/tf.tan(PI/3.) # cot(60)\n\n@tf.function # 这个装饰器是可以的\ndef math_values():\n\
  \    print(\"a:\",a)\n    print(\"b:\",b)\n    print(\"c:\",c)\n    print(\"d:\"\
  ,d)\n\nmath_values()\n```\n\nListing B.14 非常简单浅懂：它包含了你在 Listing B.13 中看到的几个相同的 TF\
  \ 2 API。此外，Listing B.14 包含了 `tf.tan()` API，用于计算一个数字（弧度）的正切值。Listing B.14 的输出在此：\n\
  \n```\na: tf.Tensor(0.49999997, shape=(), dtype=float32)\nb: tf.Tensor(0.86602545,\
  \ shape=(), dtype=float32)\nc: tf.Tensor(2.0000002, shape=(), dtype=float32)\nd:\
  \ tf.Tensor(0.57735026, shape=(), dtype=float32)\n```\n\n# 在 TF 2 中计算指数值\n\nListing\
  \ B.15 显示了 `tf2_exp_values.py` 的内容，它说明了如何在 TF 2 中计算涉及额外三角函数的值。\n\n*列表* B.15: `tf2_exp_values.py`\n\
  \n```\nimport tensorflow as tf\na = tf.exp(1.0)\nb = tf.exp(-2.0)\ns1 = tf.sigmoid(2.0)\n\
  s2 = 1.0/(1.0 + b)\nt2 = tf.tanh(2.0)\n\n@tf.function # 这个装饰器是可以的\ndef math_values():\n\
  \    print('a: ', a)\n    print('b: ', b)\n    print('s1:', s1)\n    print('s2:',\
  \ s2)\n    print('t2:', t2)\n\nmath_values()\n```\n\nListing B.15 以 TF 2 API `tf.exp()`、`tf.sigmoid()`\
  \ 和 `tf.tanh()` 开头，它们分别计算一个数字的指数值、一个数字的 sigmoid 值以及一个数字的双曲正切值。Listing B.15 的输出在此：\n\
  \n```\na: tf.Tensor(2.7182817, shape=(), dtype=float32)\nb: tf.Tensor(0.13533528,\
  \ shape=(), dtype=float32)\ns1: tf.Tensor(0.880797, shape=(), dtype=float32)\ns2:\
  \ tf.Tensor(0.880797, shape=(), dtype=float32)\nt2: tf.Tensor(0.9640276, shape=(),\
  \ dtype=float32)\n```\n\n# 在 TF 2 中处理字符串\n\nListing B.16 显示了 `tf2_strings.py` 的内容，它说明了如何在\
  \ TF 2 中处理字符串。\n\nListing B.16: `tf2_strings.py`\n\n```\nimport tensorflow as tf\n\
  x1 = tf.constant(\"café\")\nprint(\"x1:\",x1)\ntf.strings.length(x1)\n\nlen1 = tf.strings.length(x1,\
  \ unit=\"UTF8\")\nlen2 = tf.strings.unicode_decode(x1, \"UTF8\")\nprint(\"len1:\"\
  ,len1.numpy())\nprint(\"len2:\",len2.numpy())\n\n# 字符串数组\nx2 = tf.constant([\"Café\"\
  , \"Coffee\", \"affé\",])\nprint(\"x2:\",x2)\nlen3 = tf.strings.length(x2, unit=\"\
  UTF8\")\nprint(\"len2:\",len3.numpy())\n\nr = tf.strings.unicode_decode(x2, \"UTF8\"\
  )\nprint(\"r:\",r)\n```\n\nListing B.16 将 TF 2 常量 `x1` 定义为包含重音符号的字符串。第一个 `print()`\
  \ 语句显示 `x1` 的前三个字符，随后是一对代表带重音的“e”的十六进制值。第二个和第三个 `print()` 语句显示 `x1` 中的字符数量，然后是字符串\
  \ `x1` 的 UTF8 序列。B.16 的下一部分将 `x2` 定义为包含四个字符串的一阶 TF 2 张量。下一个 `print()` 语句显示 `x2`\
  \ 的内容，并对包含重音的字符使用 UTF8 值。B.16 的最后部分将 `r` 定义为 `x2` 中字符的 Unicode 值。Listing B.14 的输出为：\n\
  \n```\nx1: tf.Tensor(b'café', shape=(), dtype=string)\nlen1: 4\nlen2: [99 97 102]\n\
  x2: tf.Tensor([b'Café' b'Coffee' b'affé'], shape=(4,), dtype=string)\nlen2: [4 6\
  \ 5]\nr: <RaggedTensor [[67, 97, 102, 233], [67, 111, 102, 102, 101, 101], [97,\
  \ 102, 102, 233]]\n```\n*(注：由于原文输出中 r 部分似乎有截断或异常，此处根据上下文逻辑对齐)*\n\n# 在 TF 2 中处理张量和操作\n\
  \nListing B.17 显示了 `tf2_tensors.py` 的内容，它说明了如何在 TF 2 中对张量进行操作。Listing B.17: `tf2_tensors.py`\n\
  \n```python\nimport tensorflow as tf\nx = tf.constant([[1, 2], [3, 4], [5, 6], [7,\
  \ 8]])\nprint(\"x:\", x)\nprint(\"shape:\", x.shape)\nprint(\"dtype:\", x.dtype)\n\
  \ny = x + 1\nprint(\"x+1:\", y)\n\nz = x * 2\nprint(\"x*2:\", z)\n```\n\n\n\n\n\
  Listing B.19 包含了 TF 常量 `arr3`，其用值 `[[[1,2],[2,3]],[[3,4],[5,6]]]` 初始化。四个 `print()`\
