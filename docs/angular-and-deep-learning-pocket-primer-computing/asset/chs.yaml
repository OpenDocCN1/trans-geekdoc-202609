  \ `x` 和 `y` 值的 `feed_dict`。 幸运的是，TF 2 中带装饰器的 Python 函数看起来就像普通的 Python 代码。\n\n# TF\
  \ 2 中的变量\n\nTF 2.0 删除了全局集合及其相关的 API，例如 `tf.get_variable`、`tf.variable_scope` 和 `tf.initializers.global_variables`。每当你在\
  \ TF 2 中需要 `tf.Variable` 时，直接构造并初始化它，如下：\n\n```python\ntf.Variable(tf.random.normal([2,\
  \ 4]))\n```\n\n列表 B.3 显示了 `tf2_variables.py` 的内容，说明了如何在 `with` 代码块中计算涉及 TF 常量和变量的值。\n\
  \n```python\nimport tensorflow as tf\n\nv = tf.Variable([[1., 2., 3.], [4., 5.,\
