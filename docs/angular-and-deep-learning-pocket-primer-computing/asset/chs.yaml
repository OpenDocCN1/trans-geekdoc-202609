  \ user = \"+user);\nthis.users.push(user);\n/*\n// prevent empty user or duplicates\n\
  if(user is non-null) {\nif(user is duplicate) {\n// display alert message\n} else\
  \ {\n// display alert message\n}\n} else {\n// display alert message\n}\n*/\n}\n\
  }\n```\n\nListing 2.5 包含一个 `ngFor` 指令，用于显示项“对”列表，每个“对”由一个 `<button>` 元素和一个 `users`\
