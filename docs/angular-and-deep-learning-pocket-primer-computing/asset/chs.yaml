  ```\n\n\n\n\n\nAE 也可以用于特征提取，因为它们产生的结果比 `PCA` 更好。请记住，AE 是针对特定数据的，这意味着它们只适用于相似的数据。然而，它们与图像压缩有所不同（且在数据压缩方面表现平平）。例如，一个在人脸上训练的自动编码器在处理树木图片时效果很差。总之，`AE`\
  \ 涉及以下内容：\n\n* 将输入“压缩”到更小的层\n* 为一组数据学习表示表示\n* 通常用于降维 (`PCA`)\n* 只保留中间的压缩层\n\n作为一个高层面的示例，考虑一张\
  \ 10x10 的图像（100 个像素），以及一个拥有 100 个神经元（10x10 像素）、一个具有 50 个神经元的隐藏层以及一个具有 100 个神经元的输出层的\
  \ `AE`。因此，该 `AE` 将 100 个神经元压缩到 50 个神经元。\n\n正如你之前看到的，基础 `AE` 有许多变体，其中一些列在下所示：\n\n\
  * LSTM 自动编码器\n* 去噪自动编码器\n* 收缩自动编码器\n* 稀疏自动编码器\n* 堆叠自动编码器\n* 深度自动编码器\n* 线性自动编码器\n\
  \n以下网站包含了各种自动编码器，包括在本节中提到的：\n\n*[`www.google.com/search?sa=X&q=Autoencoder&tbm=isch&source=univ&ved=2ahUKEwjo-8zRrIniAhUGup4KHVgvC10QiR56BAgMEBY&biw=967&bih=672`](https://www.google.com/search?sa=X&q=Autoencoder&tbm=isch&source=univ&ved=2ahUKEwjo-8zRrIniAhUGup4KHVgvC10QiR56BAgMEBY&biw=967&bih=672)*\n\
  \n在线搜索关于 `AE` 及其相关用例的代码样本和更多细节。\n\n### 自动编码器与 PCA\n\n如果自动编码器涉及线性激活或仅有一个 sigmoid\
  \ 隐藏层，那么自动编码器的最优解与主成分分析 (`PCA`) 密切相关。\n\n一个具有大小为 `p` 的单隐藏层（其中 `p` 小于输入大小）的自动编码器，其权重跨越与前\
  \ `p` 个主成分跨越相同的向量子空间。\n\n自动编码器的输出是对该子空间的正交投影。自动编码器的权重并不等于主成分，且通常不是正交的，但可以使用奇异值分解从它们中恢复出主成分。\n\
  \n### 什么是变分自动编码器？\n\n简单来说，`variational autoencoder`（变分自动编码器）是一种增强型的“正则”自动编码器，其中“左侧”充当编码器，“右侧”充当解码器。双方都与与编码和解码过程相关的概率分布。\n\
  \n此外，编码器和解码器实际上都是神经网络。编码器的输入是数值型向量 `x`，其输出是带有权重和偏置的隐藏表示 `z`。解码器的输入是 `a`（即编码器的输出），其输出是数据概率分布的参数，这些也带有权重和偏置。注意，编码器和解码器实际上都是神经网络。\n\
  \n![variational autoencoder](img/2.jpg)\n\n以下网站包含了各种自动编码器，包括在本节中提到的：\n\n`variational\
  \ autoencoder`\n\n\n\n\n\nGAN 包含两个主要部分：`generator`（生成器）和 `discriminator`（判别器）。生成器可以采用类似于\
  \ `CNN` 的架构用于生成图像，而判别器可以采用类似于 `CNN` 的架构来检测（生成器提供的）图像是真实的还是伪造的。类比来说，生成器类比制造伪币的人，而判别器类比于试图区分有效货币和伪币的执法人员。\n\
  \n`generator`（此前已初始化）会将伪造图像发送给 `discriminator`（已训练但不再可更新）进行分析。如果判别器在检测真伪图像方面非常准确，则需要修改生成器以提高所生成伪造图像的质量。对\
  \ `generator` 的修改是通过反向误差传播完成的。如果判别器表现不佳，说明生成器正在生成高质量的伪造图像，因此生成器不需要大幅修改。\n\n列表 5.5\
  \ 显示了 `keras_create_gan.py` 的内容，它定义了一个用于创建 GAN 的 Python 函数。\n\n列表 5.4：`keras_create_gan.py`\n\
  \n```python\nimport tensorflow as tf\n\ndef build_generator(img_shape, z_dim):\n\
  \    model = tf.keras.models.Sequential()\n    # 全连接层\n    model.add(tf.keras.layers.Dense(128,\
  \ input_dim=z_dim))\n    # Leaky ReLU 激活\n    model.add(tf.keras.layers.LeakyReLU(alpha=0.01))\n\
  \    # 使用 tanh 激活的输出层\n    model.add(tf.keras.layers.Dense(28 * 28 * 1, activation='tanh'))\n\
  \    # 将生成器的输出重塑为图像维度\n    model.add(tf.keras.layers.Reshape(img_shape))\n    return\
  \ model\n\ndef build_discriminator(img_shape):\n    model = tf.keras.models.Sequential()\n\
  \    # 展平输入图像\n    model.add(tf.keras.layers.Flatten(input_shape=img_shape))\n \
  \   # 全连接层\n    model.add(tf.keras.layers.Dense(128))\n    # Leaky ReLU 激活\n   \
  \ model.add(tf.keras.layers.LeakyReLU(alpha=0.01))\n    # 使用 sigmoid 激活的输出层\n  \
  \  model.add(tf.keras.layers.Dense(1, activation='sigmoid'))\n    return model\n\
  \ndef build_gan(generator, discriminator):\n    # 确保判别器是不可训练的\n    discriminator.trainable\
  \ = False\n    # GAN 连接生成器和判别器\n    gan = tf.keras.models.Sequential()\n    # 从生成器开始：\n\
  \    gan.add(generator)\n    # 然后添加判别器：\n    gan.add(discriminator)\n    # 编译 gan\n\
  \    opt = tf.keras.optimizers.Adam(lr=0.0002, beta_1=0.5)\n    gan.compile(loss='binary_crossentropy',\
  \ optimizer=opt) \n    return gan\n\ngen = build_generator(...)\ndis = build_discriminator(...)\n\
  gan = build_gan(gen, dis)\n```\n\n列表 5.5 中的 Python 函数包含了三个 Python 方法，分别用于 `build_generator()`、`build_discriminator()`\
  \ 和 `build_gan()`，用于创建生成器、判别器和 GAN。\n\nGAN 使用生成器和判别器进行初始化，这两者都是该函数的参数。注意 `build_gan()`\
  \ 方法中的判别器是不可训练的，这通过此代码段得以：\n\n`discriminator.trainable = False`\n\n另一个需要注意的点是前面的\
  \ Python 函数并没有创建类似于 `CNN` 的架构。创建判别器的另一种方法在如下代码块所示（省略细节）：\n\n```python\ndis = build_discriminator(...)\n\
  \ngen_model = tf.keras.models.Sequential()\ngen_model.add(tf.keras.layers.Dense(...))\n\
  gen_model.add(tf.keras.layers.LeakyReLU(alpha=0.2))\ngen_model.add(tf.keras.layers.Reshape(...))\n\
  # 上采样的代码\ngen_model.add(tf.keras.layers.Conv2DTranspose(...))\ngen_model.add(tf.keras.layers.LeakyReLU(...))\n\
  ...\ngen_model.add(tf.keras.layers.Reshape(...))\ngen_model.add(tf.keras.layers.LeakyReLU(...))\n\
  # 输出层\ngen_model.add(tf.keras.layers.Conv2D(...))\n```\n\n前面的代码块涉及 `Conv2D()` 类和\
  \ `LeakyReLU()` 类（类似于 `ReLU`），但请注意其中有最大池化（max pooling）代码。请查看在线文档以获取上采样的解释以及 TensorFlow/Keras\
  \ 类 `LeakyReLU()` 和 `Conv2DTranspose()` 的用途。\n\n## GAN 的高层视角\n\n通常，创建 GAN 涉及以下高层步骤序列：\n\
  \n1. 选择数据集（例如：MNIST 或 cifar10）。\n2. 定义并训练判别器模型。\n3. 定义并使用生成器模型。\n4. 训练生成器模型。\n5.\
  \ 评估 GAN 模型的性能。\n6. 使用最终的生成器模型。\n\n有许多类型的 GAN，例如 DCGAN（深度卷积 GAN）。另一个需要记住的细节是 GAN\
  \ 与 CNN 不同。首先，卷积通常的步长（stride）为 `(2, 2)`，这意味着卷积滤波器每次移动两列，然后向下移动两行。它们不包含 `ReLU` 激活函数，也不执行最大池化。关于\
  \ GAN 的另一个细节是使用了上采样（upscaling），这在某种意义上是下采样（downscaling，即最大池化）的反面。\n\n## VAE-GAN\
  \ 模型\n\n另一个有趣的模型是 VAE-GAN，它是 VAE 和 GAN 的混合体，关于该模型的细节在此：[`towardsdatascience.com/gans-vs-autoencoders-comparison-of-985cf93ea`](https://towardsdatascience.com/gans-vs-autoencoders-comparison-of-985cf93ea)\n\
  \nGAN 优于 VAE，但它们也难以处理，并且需要大量的数据和调优。同一作者编写的 GAN 教程可以在这里：[`github.com/mrdragonbear/GAN-Tutorial`](https://github.com/mrdragonbear/GAN-Tutorial)\n\
  \n# 总结\n\n在本章中，你学习了 RNN 的架构，看到了一些由于其架构可以解决的任务，并处理了基于 Keras 的代码示例。接下来你看到了 LSTM 的架构以及一个基础代码示例。\n\
  \n此外，你看到了一个可以显示内部计算路径的 TensorFlow 代码示例。此外，你还学习了变分自编码器（VAE）及其应用场景。最后，你对 GAN 有了初步了解，了解了它们的高层描述以及它们是如何训练的。\n\
  \n# 第 6 章：Angular 与 TensorFlow.js\n\n本章提供了对 TensorFlow.js 的快速介绍。它包含了使用 TensorFlow.js\
  \ 和 tfjs-vis 进行数据可视化的各种示例，以及一个在 Angular 应用程序中使用 TensorFlow.js 执行线性回归的代码示例。在学习了在\
  \ TensorFlow.js 中创建模型的基本步骤后，你可以在地方学习更多。\n\n本章的第一部分提供了 TensorFlow.js 的快速介绍，以及它的一些功能。你将学习在\
  \ TensorFlow.js 中创建、编译和训练机器学习模型所需的 TensorFlow.js API，以及用于预测的 API。你将看到使用 TensorFlow.js\
  \ 在 HTML 页面上执行线性回归的示例。\n\n\n\n\n在阅读本章之前，请记住几点细节。首先，你需要对 `HTML` 和 `JavaScript` 有基础的了解。你还需要熟悉代码示例中使用的\
  \ `async` 和 `await` 关键字。本章没有为这些主题提供任何类似教程的内容，但你可以轻松地在网上找到许多解释 `HTML` 和 `JavaScript`\
  \ 的在线教程。\n\n其次，我们假设你已经阅读了前面章节中关于线性回归的内容，以及附录中与 Keras 相关的材料。具体来说，你至少对激活函数、优化器、`MSE`、`SGD`、损失函数和指标有基本的了解，这些内容在第\
  \ 4 章中都有讨论。\n\n第三，本章中的代码示例并非生产就绪的代码：你需要遵循 `TensorFlow.js` 的最佳实践。每个代码示例的描述都是简略的，本章讨论了最少的一组\
  \ `TensorFlow.js` API。如果你想深入研究 `TensorFlow.js`，请访问包含 `TensorFlow.js` API 的官方网站：\n\
  \nhttps://js.tensorflow.org/api/latest/\n\n## 什么是 TensorFlow.js？\n\n`TensorFlow.js`\
  \ 是适用于现代浏览器（包括 `Chrome` 和 `Firefox`）的 TensorFlow，TensorFlow 的大部分功能在 `TensorFlow.js`\
  \ 中均可用。本章将展示如何在独立的 `HTML` Web 页面中使用 `TensorFlow.js` 示例，以及如何将 `TensorFlow.js` 作为\
  \ `Angular` 应用程序的一部分使用。\n\n在深入了解 `TensorFlow.js` 的更多细节之前，请记住在本书书出版时，Google 正在发布\
  \ `TensorFlow.js` 2.x 版本。此外，Google 正在开发 `TensorFlow.js` 3.x，但到目前为止尚未宣布发布日期。Google\
  \ 将发布带有完整细节的发行说明，以执行升级过程。\n\n某些修改是直观的。具体来说，当前版本的 `TensorFlow.js` 使用此类类型的代码：\n\n\
  ```\nimport * as tf from @tensorflow/tfjs\n```\n\n`TensorFlow.js` 2.x 使用以下代码：\n\n\
  ```javascript\nimport {max, div, mul, depthToSpace} from @tensorflow/tjfs\n```\n\
  \n`TensorFlow.js` 利用 `WebGL` 的力量在浏览器会话中训练模型。某些方法返回 `Promise`，而某些方法是同步的。\n\n此外，还有两个重要的\
  \ API：`tf.tidy()` 方法和 `tf.dispose()` 方法。`tf.tidy()` 方法本质上充当垃圾回收器，这在 `WebGL` 中是不可用的。`tf.dispose()`\
  \ 方法对包含张的对象执行类似的功能。\n\n顺便提，`TensorFlow.js` API 的一个方便之处是，包名与 TensorFlow 中对应的 API\
  \ 是并行的。例如，TensorFlow 包 `tf.keras.layers` 对应 `TensorFlow.js` 包 `tf.layers`。因此，`TensorFlow.js`\
  \ API `tf.layers.dense` 对应 TensorFlow 中的 API `tf.keras.layers.Dense`。\n\n虽然现在没有必要，但值得花时间仔细浏览此\
  \ URL 中的 `TensorFlow.js` API 详细列表：\n\nhttps://js.tensorflow.org/api/latest/\n\n\
  # TensorFlow.js 中的 ML 模型\n\n`TensorFlow.js` 为你提供了在浏览器中处理 TensorFlow 模型的几种选择：\n\n\
