  \ 表达式？\n\n简而言之，`lambda expression` 是一个匿名函数。使用 `lambda expressions` 来定义可以作为参数传递或返回的函数。非正式地说，`lambda\
  \ expression` 接收一个输入并执行某些操作。`:` 左侧的项是输入，右侧的项是结果。\n\n## 在 TF 2 中使用生成器\n\n列表 C.3.2\
  \ 显示了 `tf2_plusone.py` 的内容。\n\n列表 C.3.2: tf2_plusone.py\n\n```python\nimport tensorflow\
  \ as tf\nimport numpy as np\n\nx = np.arange(0, 10)\n\ndef gener():\n    for i in\
  \ x:\n        yield i + 1\n\nds = tf.data.Dataset.from_generator(gener, output_signature=tf.int32)\n\
  \nfor value in ds.take(2):\n    print(value)\n```\n\n\n\n\n1value: tf.Tensor(9,shape=(),\
