  \ 与早停 (1)\n\n在从数据集中指定训练集和测试集后，你还需要确定训练轮次 epoch 的数量。数值太大会导致过拟合，而数值过小则会导致欠拟合。此外，模型的改进可能会减少，随后的训练迭代将变得冗余。\n\
  \n早停是一种允许你指定较大的轮次值，但如果模型性能的改进低于某个阈值，训练就会停止。\n\n你有多种方法可以指定早停，这些方法涉及回调函数（callback）的概念。列表\
  \ A.7 显示了 `tf2_keras_callback.py` 的内容，它通过回调机制执行早停。\n\n列表 A.7: `tf2_keras_callback.py`\n\
  \n```python\nimport tensorflow as tf\nimport numpy as np\nmodel = tf.keras.Sequential()\n\
  model.add(tf.keras.layers.Dense(64, activation='relu'))\nmodel.add(tf.keras.layers.Dense(64,\
  \ activation='relu'))\nmodel.add(tf.keras.layers.Dense(10, activation='softmax'))\n\
  model.compile(optimizer=tf.keras.optimizers.Adam(0.01),\nloss='mse', #均方误差\nmetrics=['mae'])\
  \ # 平均绝对误差\n\ndata = np.random.random((1000, 32))\nlabels = np.random.random((1000,\
  \ 10))\nval_data = np.random.random((100, 32))\nval_labels = np.random.random((100,\
  \ 10))\ncallbacks = [\n    # 如果 \"val_loss\" 超过 2 个轮次不再改进，则停止训练\n    tf.keras.callbacks.EarlyStopping(patience=2,\
  \ monitor='val_loss'),\n    # 将 TensorBoard 日志写入 ./logs 目录\n    tf.keras.callbacks.TensorBoard(log_dir='./logs')\n\
  ]\nmodel.fit(data, labels, batch_size=32, epochs=50, callbacks=callbacks,\nvalidation_data=(val_data,\
  \ val_labels))\n```\n\n上一节包含关于在 `Keras` 中使用回调函数代码示例。然而，你也可以定义一个自定义类，使用回调机制提供更细粒度的功能。注意，尽管指定了\
  \ 50 个轮次，但代码在四个轮次后就停止了。\n\n\n\nListing A.8 中的新代码与 Listing A.7 不同。它仅限于显示为**粗体**的代码块。这段新代码定义了一个带有多个方法的自定义\
  \ Python 类，每个方法都会在 Keras 生命周期执行过程中的相应点被调用。这六个方法由三对方法组成，分别对应训练、轮次（epochs）和批次（batches）的开始和结束事件，列表如下：\n\
