  ds = tf.data.Dataset.from_generator(gener, output_signature=(tf.int64, tf.int64,\
  \ tf.int64))\nthird = ds.batch(3)\nfor value in ds:\n    print(\"value:\",value)\n\
  ```\n\n列表 C.3.9 将变量 `x` 初始化为从 0 到 11 的 NumPy 数组。接下来的代码片段通过 `from_generator()` API\
