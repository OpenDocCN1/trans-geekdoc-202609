  , function() {\n  return \"scale(0.5, 0.5)\";\n  //return \"rotate(-20)\";\n})\n\
  });\n}\n```\n\n列表 1.21 从两个导入语句开始，随后是一个注释块，总结了在 Angular 应用中使用 `D3.js` 的要点。`template`\
  \ 属性包含一个 `<div>` 元素，该元素可以在 `ngAfterContentInit` 方法可用，该方法反过来简单调用 `createSVG()` 方法，用\
  \ `<svg>` 元素填充四个 2D 形状：圆形、椭圆、矩形和线段。\n\n注意 `@ViewChild` 装饰器，它定义了类型为 `ElementRef`\
  \ 的变量 `mysvg`。该变量将 `template` 属性中的 `<div>` 元素与 `createSVG()` 方法中定义的变量 `svgElement`\
  \ “链接”起来：\n\n```javascript\nlet svgElement = this.mysvg.nativeElement;\n```\n\n\
  注意各种 SVG 元素是如何动态创建的，以及它们的强制性属性（取决于涉及的 SVG 元素）如何通过 `attr()` 方法赋值，如下所示（以及之前的代码块）：\n\
