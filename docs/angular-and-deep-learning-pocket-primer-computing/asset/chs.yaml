  \ {\n    for(let i=0; i<this.barCount; i++) { \n      this.barHeights[i] = \"\"\
  +Math.random()*this.maxBarHeight;\n    }\n  }\n\n  drawCharts(event) {\n    this.generateBarHeights();\n\
  \    this.drawBarChart();\n    this.drawScatterPlot();\n    this.drawLineGraph();\n\
  \    this.clickCount += 1;\n  }\n\n  private drawBarChart() {\n    var svg = document.getElementById(\"\
  svg\");\n    var gElem = document.createElementNS(this.svgns, \"g\");\n    svg.appendChild(gElem);\n\
  \    for(let i=0; i<this.barCount; i++) {\n      var rect = document.createElementNS(this.svgns,\
  \ \"rect\");\n      rect.setAttribute(\"x\", \"\"+i*this.barWidth);\n      rect.setAttribute(\"\
  y\", \"\"+(200-this.barHeights[i]));\n      rect.setAttribute(\"width\", \"\"+this.barWidth);\n\
  \      rect.setAttribute(\"height\", \"\"+this.barHeights[i]);\n      rect.setAttribute(\"\
  fill\", this.colors[i%this.colors.length]);\n      gElem.appendChild(rect);\n  \
  \  }\n    svg.appendChild(gElem);\n  }\n\n  private drawLineGraph() {\n    var svg\
  \ = document.getElementById(\"svg\");\n    var gElem = document.createElementNS(this.svgns,\
  \ \"g\");\n    svg.appendChild(gElem);\n    // construct a line graph\n    for (\
  \ let i = 0; i < this.barCount; i++) {\n      this.polyPts += (i*this.barWidth).toString()\
  \ + \",\" +\n      (600-this.barHeights[i]) + \" \";\n    }\n    var polyline =\
  \ document.createElementNS(this.svgns, \"polyline\");\n    polyline.setAttribute(\"\
  points\", \"\"+this.polyPts);\n    polyline.setAttribute(\"style\", \"fill:none;stroke:blue;stroke-width:3\"\
  );\n    gElem.appendChild(polyline);\n    svg.appendChild(gElem);\n  }\n\n  private\
  \ drawScatterPlot() {\n    var svg = document.getElementById(\"svg\");\n    var\
  \ gElem = document.createElementNS(this.svgns, \"g\");\n    svg.appendChild(gElem);\n\
  \    // construct circles\n    for(let i=0; i<this.scatterCount; i++) { \n     \
  \ var circle = document.createElementNS(this.svgns, \"circle\");\n      this.offsetX\
  \ = this.scatterWidth*Math.random();\n      this.offsetY = 200*Math.random();\n\
  \      circle.setAttribute(\"cx\", \"\"+this.offsetX);\n      circle.setAttribute(\"\
  cy\", \"\"+(200+this.offsetY));\n      circle.setAttribute(\"r\", \"\"+this.radius);\n\
  \      circle.setAttribute(\"fill\", this.colors[i%this.colors.length]);\n     \
  \ gElem.appendChild(circle);\n    } \n    svg.appendChild(gElem);\n  }\n}\n```\n\
  \n列表 1.20 从常规导入语句开始，随后是一个模板属性，该属性指定了一个 SVG `<svg>` 元素，其元素的宽度和高度属性均为 600 像素（如果你有需要，也可以指定不同的值）。注意\
  \ SVG `<svg>` 元素还指定了 Angular 的 `(click)` 属性，如下：\n\n```html\ntemplate: `<svg id=\"\
  svg\" width=\"600\" height=\"600\" (click)=\"drawCharts($event)\"></svg>`\n```\n\
  \n当用户点击 SVG `<svg>` 元素内部的任何位置时，将执行 `drawCharts(event)` 方法，其内容如下：\n\n```javascript\n\
  drawCharts(event) {\n  this.generateBarHeights();\n  this.drawBarChart();\n  this.drawScatterPlot();\n\
  \  this.drawLineGraph();\n  this.clickCount += 1;\n}\n```\n\n注意 `drawCharts()` 方法还接收一个事件参数，该参数实际上是一个包含鼠标事件位置信息的对象。此方法调用了五个其他方法，首先从\
  \ `generateBarHeights()` 方法开始，该方法用一组随机数填充 `barHeights` 数组，这些随机数代表柱状图中每个条形元素的高度。\n\
  \n接下来，`drawCharts()` 方法调用 `drawBarChart()`，该方法通过获取现有 `<svg>` 元素的引用（在模板中），创建一个名为\
  \ `gElem` 的 SVG `<g>` 元素，然后将新创建的 `<g>` 元素添加到 `<svg>` 元素中所示：\n\n```javascript\nvar\
  \ svg = document.getElementById(\"svg\");\nvar gElem = document.createElementNS(this.svgns,\
  \ \"g\");\n```\n\n并不是绝对必要的，但将柱状图放在 `<g>` 元素内部是一个好主意。下一个代码块包含一个循环，创建一个 SVG `<rect>`\
  \ 元素，填充其属性，然后将其添加到现有的 `<svg>` 元素中，如下所示：\n\n```javascript\nfor(let i=0; i<this.barCount;\
  \ i++) { \n  var rect = document.createElementNS(this.svgns, \"rect\");\n  rect.setAttribute(\"\
  x\", \"\"+i*this.barWidth);\n  rect.setAttribute(\"y\", \"\"+(200-this.barHeights[i]));\n\
  \  rect.setAttribute(\"width\", \"\"+this.barWidth);\n  rect.setAttribute(\"height\"\
  , \"\"+this.barHeights[i]);\n  rect.setAttribute(\"fill\", this.colors[i%this.colors.length]);\n\
  \  gElem.appendChild(rect);\n}\n```\n\n接下来，`drawCharts()` 方法调用 `drawScatterPlot()`，该方法从与\
  \ `barChart()` 相同的代码块开始。此方法包含一个循环创建 `<circle>` 元素，填充其属性，然后将其添加到 `<g>` 元素中。\n\n最后，`drawCharts()`\
  \ 方法调用 `drawLineGraph()`，该方法同样从 `barChart()` 代码块开始。此方法包含一个循环，用 `polyPts` 字符串更新每个条形元素顶点的横坐标和纵坐标，如下：\n\
  \n```javascript\nfor ( let i = 0; i < this.barCount; i++) {\n  this.polyPts += (i*this.barWidth).toString()\
  \ + \",\" +\n  (600-this.barHeights[i]) + \" \";\n}\n```\n\n![图片 60](img/Pg60)\n\
  *图 1.4* Angular 应用中的 SVG 柱状图、散点图和折线图。\n\n---\n\n## D3 动画\n\n之前的章节提供了使用 SVG 的示例，本节将展示如何使用\
