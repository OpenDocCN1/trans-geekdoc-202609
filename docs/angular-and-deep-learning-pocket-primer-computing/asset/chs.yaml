  \ 2, 3, 4, 5])\nb = tf.constant([[1, 2, 3], [4, 5, 6]])\nc = tf.constant([[[1],\
  \ [2], [3]], [[4], [5], [6]], [[7], [8], [9]]])\n\ndef show_rank(x):\n    print(tf.rank(x))\n\
  \nshow_rank(a)\nshow_rank(b)\nshow_rank(c)\nshow_rank(d)\n```\n\n列表 B.4 展示了如何通过\
  \ `show_rank` 函数查看不同维度张量的秩。输出如下：\n\n```\n0\n1\n2\n3\n```\n\na = tf. tf.1, . =\n\
  a = tf.constant(5)\nb = tf.constant(1, 2, 3, 4,  tensorflow as tf\na = tf.constant(1)\n\
