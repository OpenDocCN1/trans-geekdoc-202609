  ```\n\n下一节将结合 SVG 图表与鼠标移动，以渲染一组“跟随鼠标”的 SVG 椭圆。\n\n## Angular 与 SVG 中的鼠标跟随\n\n本节中的代码示例依赖于鼠标相关的事件来创建动态图形效果。请从配套文件中将目录\
  \ `SVGFollowMe` 复制到方便的位置。\n\n代码列表 1.15 显示了 `app.component.ts` 的内容，它说明了如何引用自定义 Angular\
  \ 组件，该组件会在当前鼠标位置渲染一个 SVG `<ellipse>` 元素。\n\n*列表* 1.15: app.component.ts\n\n```typescript\n\
  import {Component} from '@angular/core';\n\n@Component({\n  selector: 'app-root',\n\
  \  template: '<div><mouse-move></mouse-move></div>'\n})\nexport class AppComponent\
  \ {}\n```\n\n你可以看到，代码列表 1.15 中的 `template` 属性指定了一个包含自定义 `<mouse-move>` 元素的 `<div>`\
  \ 元素。\n\n代码列表 1.16 显示了 `MouseMove.ts` 的内容（此处原文为 ts），它说明了如何引用自定义 Angular 组件，该组件会在当前鼠标位置渲染一个\
  \ SVG `<ellipse>` 元素。\n\n*列表* 1.16: MouseMove.ts\n\n```typescript\nimport {Component}\
  \ from '@angular/core';\n\n@Component({\n  selector: 'mouse-move',\n  template:\
  \ `<svg id=\"svg\" width=\"600\" height=\"400\"\n  (mousemove)=\"mouseMove($event)\"\
  >\n</svg>`\n})\nexport class MouseMove {\n  radiusX = \"25\";\n  radiusY = \"50\"\
  ;\n  // mouseMove(event:any) {\n  var svgns = \"http://www.w3.org/2000/svg\";\n\
  \  var svg = document.getElementById(\"svg\");\n  var colors = [\"#ff0000\", \"\
  #88ff00\", \"#3333ff\"];\n  var sum = Math.floor(event.clientX+event.clientY); \n\
  \  var ellipse = document.createElementNS(svgns, \"ellipse\");\n  ellipse.setAttribute(\"\
  cx\", event.clientX);\n  ellipse.setAttribute(\"cy\", event.clientY);\n  ellipse.setAttribute(\"\
  rx\", this.radiusX);\n  ellipse.setAttribute(\"ry\", this.radiusY);\n  ellipse.setAttribute(\"\
  fill\", colors[sum % colors.length]);\n  svg.appendChild(ellipse);\n } \n}\n```\n\
  \n代码列表 1.16 包含一个定义了 SVG `<svg>` 元素的 `template` 属性。每当用户移动鼠标时，`(mousemove)` 事件处理程序就会执行一次，从而执行自定义方法\
  \ `mouseMove()`。\n\n注意，`mouseMove` 方法接受一个 `event` 参数，该对象提供了每个 `mousemove` 事件发生位置的坐标。当前点的坐标由\
  \ `event.clientX` 和 `event.clientY` 指定，它们 分别是当前鼠标位置的 x 坐标和 y 坐标。\n\n`mouseMove`\
  \ 方法中的下一个代码块动态创建一个 SVG `<ellipse>` 元素，设置五个必需属性的值（详情请参见上一节），然后将新创建的 SVG `<ellipse>`\
  \ 元素附加到 DOM 中。当你启动本节中的 Angular 应用代码时，此功能会创建“跟随鼠标”的效果。\n\n注意，`mouseMove` 方法的最后一行代码将\
