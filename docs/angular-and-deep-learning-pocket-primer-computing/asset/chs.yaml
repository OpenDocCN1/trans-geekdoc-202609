  \n本节包含一个代码示例，说明如何在构造函数中初始化变量，然后通过 `template` 属性中的插值引用该变量的值。现在，将配套文件中的 `StateComponent`\
  \ 目录复制到方便的地方。Listing 2.9 显示了 `app.component.ts` 的内容，它显示了“员工”的各种属性。\n\n列表 2.9：app.component.ts\n\
  \n```typescript\nimport {Component} from '@angular/core';\n\n@Component({\nselector:\
  \ 'app-root', \ntemplate: '<h3>My name is {{emp.fname}} {{emp.lname}}</h3>'\n})\n\
  export class AppComponent {\npublic emp = {fname:'John',lname:'Smith',city:'San\
  \ Francisco'};\npublic name = 'John Smith'\n\nconstructor() {\nthis.name = 'Jane\
  \ Edwards'\nthis.emp = {fname:'Sarah',lname:'Smith',city:'San Francisco'};\n}\n\
  }\n```\n\nListing 2.9 包含一个 `constructor()` 方法，用于初始化变量 `name` 以及字面量对象 `emp`。`emp`\
  \ 变量在 `template` 属性中加粗显示，在 `AppComponent` 类内部的两个地方也是如此。\n\n***问题：*** 启动应用程序时将显示哪个名称？\n\
  \n***答案：*** 在构造函数中赋值给 `emp` 变量的值。这种行为与 Java 等面向对象的语言是相同的。\n\n启动此应用程序，在 Web 浏览器中看到以下输出：\n\
  \nMy name is Sarah Smith\n\n敏锐的读者会注意到我们如何在 `emp` 和 `name` 变量的声明中“滑入” TypeScript\
  \ 关键字 `public`。其他可能的关键字包括 `private` 和 `protected`；这三个关键字的语义与在 Java 中相同。如果你不熟悉这些关键字，可以找到在线\
  \ TypeScript 教程来解释它们的用途。下一节将讨论另一种实用的 TypeScript 变量语法。\n\n\n\n\n\n# 构造函数中的私有参数：快捷方式\n\
  \nTypeScript 提供了一种通过构造函数初始化私有变量的快捷写法。考虑以下 TypeScript 代码块：\n\n```typescript\nclass\
  \ MyStuff {\n  private firstName: string;\n\n  constructor(firstName: string) {\n\
  \    this.firstName = firstName;\n  }\n}\n```\n\n这是一个更且等效的 TypeScript 代码块：\n\n```typescript\n\
  class MyStuff {\n  constructor(private firstName: string) {\n  }\n}\n```\n\nTypeScript\
  \ 对构造函数中 `private` 关键字的支持是一个方便的功能，它减少了一些样板代码，并消除了潜在的错误源（例如变量名拼写错误）。\n\n另一个例子是，代码段中的\
  \ `constructor()` 方法使用从 `EmpService` 组件中检索的数据来填充员工对象（该组件定义在其他地方，此处并不重要）：\n\n```typescript\n\
  constructor(private empService: EmpService) {\n  this.employees = this.empService.getEmployees();\n\
  }\n```\n\n下一节将向你展示如何在 Angular 应用中使用 `*ngIf` 指令进行条件逻辑。\n\n## Angular 中的条件逻辑\n\n虽然之前的示例包含带有单行文本的模板属性，但\
  \ Angular 允许你指定多行文本。如果你在一对匹配的“反引号”内放置插值变量，Angular 将这些变量替换（插值）为它们的值。\n\n现在，将配套文件中的\
  \ `IfLogic` 目录复制到方便的位置。列表 2.10 显示了 `app.component.ts` 的内容，它说明了如何使用 `*ngIf` 指令。\n\
  \n### 列表 2.10: app.component.ts\n\n```typescript\nimport {Component} from '@angular/core';\n\
  \n@Component({\n  selector: 'app-root', \n  template: `\n  <h3>Hello everyone!</h3>\n\
  \  <h3>My name is {{emp.fname}} {{emp.lname}}</h3>\n  <button (click)=\"moreInfo()\"\
  >More Details</button>\n  <div *ngIf=\"showMore === true\">\n    <h3>I live in {{emp.city}}</h3>\n\
  \  </div>\n  <div (click)=\"showDiv = !showDiv\">Toggle Me</div>\n  <div *ngIf=\"\
  showDiv\"\n    style=\"color:white;background-color:blue; width:25%\">Content1</div>\n\
  \  <div *ngIf=\"showDiv\"\n    style=\"background-color:red; width:25%;\">Content2</div>\n\
  \  `\n})\n\nexport class AppComponent {\n  public emp = {fname:'John',lname:'Smith',city:'San\
  \ Francisco'};\n  public showMore = false;\n  public showDiv = false;\n  moreInfo()\
  \ {\n    this.showMore = true;\n  }\n}\n```\n\n列表 2.10 包含了模板属性中的一些新代码：一个 `<button>`\
  \ 元素，每当用户点击按钮时就会调用 `moreInfo()` 方法。点击事件后，将渲染一个在 `h3` 元素内部包含城市信息的 `<div>` 元素。注意，这个\
  \ `<div>` 元素仅在 `showMore` 为 true 时才会被渲染，这是通过一个检查 `showMore` 值的 `ngIf` 指令来控制的。`showMore`\
  \ 的初始值为 false，在用户点击 `<button>` 元素后后，其值被设置为 true，之后 `<div>` 元素就会显示出来。\n\n`AppComponent`\
  \ 中的新代码涉及一个布尔变量 `showMore`（其初始值为 false）以及将 `showMore` 初始化为 true 的 `moreInfo()` 方法。\n\
  \n`app.module.ts` 文件包含不需要任何修改的自动生成代码，因此我们在本节中省略其内容。\n\n## 处理用户输入\n\n本节的代码示例向你展示了如何处理用户输入，并介绍了\
