  \ `ds` 的元素。现在运行列表 C.3.8 中的代码以查看完整输出，如下：\n\n```\ntf.Tensor([0 1 2], shape=(3,), dtype=int64)\n\
  tf.Tensor([3 4 5], shape=(3,), dtype=int64)\ntf.Tensor([6 7 8], shape=(3,), dtype=int64)\n\
