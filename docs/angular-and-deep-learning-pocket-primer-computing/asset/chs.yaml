  \n# Angular 中检测鼠标位置\n\n本节向你展示如何指定一个包含 SVG 代码以用于渲染 SVG 元素的自定义组件。此示例将作为下一节 SVG 代码的基础，下一节涉及动态创建并将\
  \ SVG 元素添加到 DOM 中。\n\n从配套文件中将 `SVGEllipse` 目录复制到方便的位置。Listing 1.12 显示了 `app.component.ts`\
  \ 的内容，它引用了一个 Angular 自定义组件来渲染 SVG 椭圆。\n\n列表 1.12：app.component.ts\n\n```typescript\n\
  import {Component} from '@angular/core';\n\n@Component({\n  selector: 'app-root',\n\
  \  template: `<svg id=\"svg\" width=\"600\" height=\"400\">`\n})\nclass AppComponent\
  \ {}\n```\n\nListing 1.12 包含了 `template` 属性，该属性由一个 `<div>` 元素组成，其中嵌套了一个 `<mouse-move>`\
  \ 元素，后者是定义在 TypeScript 文件 `mousemove.ts` 中的自定义组件的 `selector` 属性值。\n\nListing 1.13\
  \ 显示了 `mousemove.ts` 的内容，它展示了如何检测 `mousemove` 事件并显示当前鼠标位置的坐标。\n\n列表 1.13：mousemove.ts\n\
  \n```typescript\nimport {Component} from '@angular/core';\n\n@Component({\n  selector:\
  \ 'mouse-move',\n  template: `<svg id=\"svg\" width=\"600px\" height=\"400px\"\n\
  \  (mousemove)=\"mouseMove($event)\">\n  </svg>`\n})\nexport class MouseMove{\n\
  \  // => 未开启 --strict 选项时：mouseMove(event)\n  mouseMove(event:any) {\n    console.log(\"\
  Position x: \"+event.clientX+\" y: \"+event.clientY);\n  }\n}\n```\n\nListing 1.13\
  \ 包含了 `mouseMove()` 方法，其唯一参数 `event` 是一个包含鼠标事件信息（如位置）的对象。`mouseMove()` 方法包含一个 `console.log()`\
  \ 语句，用于显示鼠标点击位置的 x 坐标和 y 坐标。\n\n确保你更新了 `app.module.ts` 内容以包含 `MouseMove` 类，如 Listing\
  \ 1.14 所示。\n\n\n\n\n\n```typescript\nimport { MouseMove } from './mousemove';\n\n\
  @NgModule({\n  imports: [BrowserModule],\n  declarations: [AppComponent, MouseMove],\n\
  \  bootstrap: [AppComponent]\n})\nexport class AppModule { }\n```\n\n代码列表 1.14 导入了\
  \ `MouseMove` 类并将该类添加到 `declarations` 属性中（这两者均已加粗显示）。\n\n现在启动此 Angular 应用。在新的浏览器会话中，导航到\
  \ `View` -> `Developer` -> `JavaScript Console`（针对 Chrome 浏览器）以显示控制台。当你在屏幕上移动鼠标时，你将看到控制台中显示如下类型的输出：\n\
  \n```\nPosition x: 506 y: 254 mousemove.ts:12:13\nPosition x: 505 y: 255 mousemove.ts:12:13\n\
