  \ Keras、CNN 与 cifar10\n\n本节包含一个使用 `cifar10` 数据集训练神经网络的简单示例。该代码示例与在 MNIST 数据集上训练神经网络相似，只需要微小的更改。请记住\
  \ MNIST 中的图像维度为 28x28，而 `cifar10` 中的图像维度为 32x32。始终确保数据集中的图像维度相同，否则结果可能不可预测。确保你的数据集中的图像维度相同。列表\
  \ A.5 显示了 `keras_cnn_cifar10.py` 的内容，它使用 `cifar10` 数据集训练 CNN。\n\n### 列表 A.5: keras_cnn_cifar10.py\n\
  \n```python\nimport tensorflow as tf\nbatch_size = 32\nnum_classes = 10\nepochs\
  \ = 100\nnum_predictions = 20\ncifar10 = tf.keras.datasets.cifar10\n\n# 数据划分为训练集和测试集:\n\
  (x_train, y_train), (x_test, y_test) = cifar10.load_data()\nprint('x_train shape:',\
  \ x_train.shape)\nprint(x_train.shape[0], 'train samples')\nprint(x_test.shape[0],\
  \ 'test samples')\n\n# 将类别向量转换为二分类矩阵\ny_train = tf.keras.utils.to_categorical(y_train,\
  \ num_classes)\ny_test = tf.keras.utils.to_categorical(y_test, num_classes)\nmodel\
  \ = tf.keras.models.Sequential()\nmodel.add(tf.keras.layers.Conv2D(32, (3, 3), padding='same',\
  \ input_shape=x_train.shape[1]))\nmodel.add(tf.keras.layers.Activation('relu'))\n\
  model.add(tf.keras.layers.Conv2D(32, (3, 3)))\nmodel.add(tf.keras.layers.Activation('relu'))\n\
  model.add(tf.keras.layers.MaxPooling2D(pool_size=(2, 2)))\nmodel.add(tf.keras.layers.Dropout(0.25))\n\
  \n# 你也可以在此处重复之前的块\nmodel.add(tf.keras.layers.Flatten())\nmodel.add(tf.keras.layers.Dense(512))\n\
  model.add(tf.keras.layers.Activation('relu'))\nmodel.add(tf.keras.layers.Dropout(0.5))\n\
  model.add(tf.keras.layers.Dense(num_classes))\nmodel.add(tf.keras.layers.Activation('softmax'))\n\
  \n# 使用 RMSprop 优化器训练模型\nmodel.compile(loss='categorical_crossentropy', optimizer=opt,\
  \ metrics=['accuracy'])\nx_train = x_train.astype('float32')\nx_test = x_test.astype('float32')\n\
  x_train /= 255\nx_test /= 255\nmodel.fit(x_train, y_train, batch_size=batch_size,\
  \ epochs=epochs, validation_data=(x_test, y_test), shuffle=True)\n\n# 评估并显示测试数据的结果\n\
  scores = model.evaluate(x_test, y_test, verbose=1)\nprint('Test loss:', scores[0])\n\
  print('Test accuracy:', scores[1])\n```\n\n\n\n请注意，“原生”CNN 包含一个卷积层（即前一个代码段的作用），随后是\
  \ `ReLU` 激活函数和最大池化层，这两者都显示在列表 A.5 中。此外，`Keras` 模型的最后一层是 `softmax` 激活函数，它将“全连接”层中的\
  \ 10 个数值转换为一组 0 到 1 之间的 10 个非负数，其总和等于 1（这为我们提供了一个概率分布）。\n\n该模型经过编译和训练，然后在测试数据集上进行评估。列表\
