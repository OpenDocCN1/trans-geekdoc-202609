  \ 2.11）。\n\n*(注：原文中多处引用 Listing 2.10 似乎是指 Listing 2.11，此处翻译保持原文链接，但根据逻辑理解)*\n\n\n\
  \n\n\nListing 2.14 包含一个 `todos` 数组，当用户点击根组件中的 `<button>` 元素时，该数组会更新新的待办事项。\n\n最后，更新\
  \ `app.module.ts` 的内容，以包含 Listing 2.15 中**加粗**显示的类。\n\n列表 2.15: app.module.ts\n\n\
