  \ 数据集和 TF 2 中的 TFDS\n\n列表 C.3.24 显示了 `tfds-cifar10.py` 的内容，它说明了如何对 CIFAR10 数据集进行某些处理，并使用\
  \ lambda 表达式和 `map()` 操作符来训练数据集。\n\n### 列表 C.3.24：tfds-cifar10.py\n\n```python\n\
  import tensorflow as tf\nimport tensorflow_datasets as tfds\n\nloader = tfds.load(\"\
  cifar10\", as_supervised=True)\n\ntrain, test = loader[\"train\"], loader[\"test\"\
  ]\n\ntrain = train.map(\n    lambda image, label: (tf.image.convert_image_dtype(image,\
  \ tf.float32), label)\n).cache().map(\n    lambda image, label: (tf.image.random_flip_left_right(image),\
  \ label)\n).map(\n    lambda image, label: (tf.image.random_contrast(image, lower=0.0,\
  \ upper=1.0), label)\n).shuffle(100).batch(64).repeat()\n```\n\n本节中的代码来自以下 stackoverflow\
