  \ 应用时看到空白屏幕，可能是你没有将 JSON 文件放在正确的子目录中。\n\n## 在 Angular 中读取 CSV 文件\n\n本节代码示例展示了如何读取\
  \ CSV 文件的内容并显示该文件的内容。此 Angular 应用对于涉及读取 CSV 文件内容的机器学习任务非常有用。将目录复制到方便的位置。Listing\
  \ 2.33 展示了 `app.component.ts` 的内容，它说明了如何读取 `assets/wine.csv` 的内容并以表格形式显示数据。\n\n\
