  \ 20], shape=(3,), dtype=int64)\ntf.Tensor([21 22 23], shape=(3,), dtype=int64)\n\
  tf.Tensor([24 25 26], shape=(3,), dtype=int64)\ntf.Tensor([27 28 29], shape=(3,),\
  \ dtype=int64)\ntf.Tensor([30 31 32], shape=(3,), dtype=int64)\ntf.Tensor([33],\
  \ shape=(1,), dtype=int64)\n```\n\n## TF 2 batch() 运算符 (2)\n\n列表 C.3.9 显示了 `tf2_generator.py`\
