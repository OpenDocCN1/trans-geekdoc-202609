  \ dtype=int64)\nvalue: tf.Tensor(8,shape=(), dtype=int64)\nvalue: tf.Tensor(10,\
  \ shape=(), dtype=int64)\n```\n\n## TF 2 filter() 运算符 (2)\n\n列表 C.3.7 显示了 `tf2_filter2.py`\
  \ 的内容，说明了 TF 2 中 `filter()` 运算符另一个示例。\n\n*LISTING* C.3.7: tf2_filter2.py\n\n```python\n\
  import tensorflow as tf\nimport numpy as np\n\nds = tf.data.Dataset.from_tensor_slices([1,2,3,4,5])\n\
  ds = ds.filter(lambda x: x < 4) # [1,2,3]\n\nprint(\"First iteration:\")\nfor value\
  \ in ds:\n    print(\"value:\",value)\n\n# \"tf.math.equal(x, y)\" 用于等等性比较\ndef\
  \ filter_fn(x):\n    return tf.math.equal(x, 1)\n\nds = ds.filter(filter_fn)\nprint(\"\
  Second iteration:\")\nfor value in ds:\n    print(\"value:\",value)\n```\n\n列表 C.3.7\
  \ 定义变量 `ds` 为一个从数组 `[1,2,3,4,5]` 创建的 TF 2 Dataset。接下来的代码片段调用了 `filter()` 运算符，其内部的\
  \ lambda 表达式返回小于 4 的数字。for 循环打印了 `ds` 变量中的数字，该变量由过滤后的数字 1、2 和 3 列表组成。\n\n列表 C.3.7\
  \ 的后续部分是装饰过的 Python 函数 `filter_fn()`，它被作为 `ds` 新定义的一部分指定，如下所示：\n\n`ds = ds.filter(filter_fn)`\n\
  \n前述代码片段在列表 C.3.7 的第二个 for 循环中执行了装饰过的 Python 函数 `filter_fn()`。运行列表 C.3.7 中代码的输出如下：\n\
  \n```\nFirst iteration:\nvalue: tf.Tensor(1, shape=(), dtype=int32)\nvalue: tf.Tensor(2,\
  \ shape=(), dtype=int32)\nvalue: tf.Tensor(3, shape=(), dtype=int32)\nSecond iteration:\n\
  value: tf.Tensor(1, shape=(), dtype=int32)\n```\n\n## TF 2 batch() 运算符 (1)\n\n`batch(n)`\
  \ 运算符在每次迭代期间处理包含 `n` 个元素的批。列表 C.3.8 显示了 `tf2_batch1.py` 的内容，说明了如何在 TF 2 中使用 `batch()`\
