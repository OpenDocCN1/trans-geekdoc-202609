  \n## 什么是 Keras？\n\n如果你已经熟悉 `Keras`，可以快速略读此节以了解新的命名空间及其内容，然后进入包含创建基于 Keras 模型细节的下一节。\n\
  \n如果你是 `Keras` 的新手，可能可能会奇怪为什么附录中包含这一节。首先，`Keras` 已经很好地集成到 TF 2 中，并且位于 `tf.keras`\
  \ 命名空间中。其次，`Keras` 非常适合定义模型来解决许多任务，例如线性回归和逻辑回归，以及附录中讨论的涉及 `CNNs`、`RNNs` 和 `LSTMs`\
  \ 的深度学习任务。\n\n后续子章节包含各种 Keras 相关命名空间的列表，如果你工作过 TF 1.x，你会对这些内容感到非常熟悉。如果你是 TF 2 的新手，你将在后续代码示例中看到某些类的示例。\n\
  \n## 在 TF 2 中使用 Keras 命名空间\n\nTF 2 提供了 `tf.keras` 命名空间，包含以下内容：\n\n* `tf.keras.layers`\n\
  * `tf.keras.models`\n* `tf.keras.optimizers`\n* `tf.keras.utils`\n* `tf.keras.regularizers`\n\
  \n目前，有三种创建基于 Keras 模型的方法：\n\n* `Sequential`\n* `Functional`\n* `Subclassing`\n\n\
  `Sequential` API 对初学者来说是最直接的。`Functional` API 为复杂架构提供了更大的灵活性，而 `Subclassing` API\
  \ 则允许最大的控制力。\n\n## 使用 tf.keras.layers\n\n`tf.keras.layers` 命名空间包含各种层，其中列出了：\n\n\
  * `tf.keras.layers.Conv2D()`\n* `tf.keras.layers.MaxPooling2D()`\n* `tf.keras.layers.Flatten()`\n\
  * `tf.keras.layers.Dense()`\n* `tf.keras.layers.Dropout()`\n* `tf.keras.layers.BatchNormalization()`\n\
  * `tf.keras.layers.embedding()`\n* `tf.keras.layers.RNN()`\n* `tf.keras.layers.LSTM()`\n\
  * `tf.keras.layers.Bidirectional()`\n\n`Conv2D()` 和 `MaxPooling2D()` 类用于 CNN，而 `RNN()`\
  \ 和 `LSTM()` 类用于基于序列的数据。\n\n## 使用 tf.keras.activations\n\n机器学习和深度学习模型需要激活函数。对于基于\
  \ Keras 模型，激活函数位于 `tf.keras.activations` 命名空间中，其中列出了：\n\n* `tf.keras.activations.relu`\n\
  * `tf.keras.activations.selu`\n* `tf.keras.activations.linear`\n* `tf.keras.activations.elu`\n\
  * `tf.keras.activations.sigmoid`\n* `tf.keras.activations.softmax`\n* `tf.keras.activations.softplus`\n\
  * `tf.keras.activations.tanh`\n\n`ReLU`、`SELU` 和 `ELU` 函数密切相关，它们通常出现在 ANNs 和 CNN\
  \ 中。在 `ReLU()` 函数流行之前，`sigmoid()` 和 `tanh()` 函数被用于 ANNs 和 CNN。然而，它们仍然重要，并被用于 `GRUs`\
  \ 和 `LSTMs` 中的各种门控。`softmax()` 函数通常用于由最右侧隐藏层和输出层组成的对。\n\n## 使用 tf.keras.datasets\n\
  \n为了方便起见，TF 2 在 `tf.keras.datasets` 命名空间中提供了一组内置数据集，其中列出了：\n\n* `tf.keras.datasets.boston_housing`\n\
  * `tf.keras.datasets.cifar10`\n* `tf.keras.datasets.cifar100`\n* `tf.keras.datasets.fashion_mnist`\n\
  * `tf.keras.datasets.imdb`\n* `tf.keras.datasets.mnist`\n* `tf.keras.datasets.reuters`\n\
  \n上述数据集常用于使用小数据集训练模型。`mnist` 和 `fashion_mnist` 数据集在训练 CNN 时都很流行，而 `boston_housing`\
  \ 数据集则流行于线性回归。\n\n\n\n\n\n* `tf.keras.experimental.CosineDecayRestarts`\n* `tf.keras.experimental.LinearCosineDecay`\n\
  * `tf.keras.experimental.NoisyLinearCosineDecay`\n* `tf.keras.experimental.PeepholeLSTMCell`\n\
  \n如果你是一个初学者，可能不会使用上述列表中的任何类。尽管 `PeepholeLSTMCell` 类是 `LSTM` 类的一个变体，但该类的使用场景有限。\n\
  \n## 使用其他 `tf.keras` 命名空间\n\nTF 2 提供了许多其他包含有用类的命名空间，其中一些列在此处：\n\n* `tf.keras.callbacks`（早停法）\n\
  * `tf.keras.optimizers`（`Adam` 等）\n* `tf.keras.regularizers`（`L1` 和 `L2`）\n* `tf.keras.utils`（`to_categorical()`\n\
  \n`tf.keras.callbacks` 命名空间包含一个你可以用于**早停法**的类，也就是说，如果代价函数在连续两次迭代中的减少不足，则可以终止训练过程。\n\
  \n`tf.keras.optimizers` 命名空间包含了可与代价函数协同工作的各种优化器，包括流行的 `Adam` 优化器。\n\n`tf.keras.regularizers`\
  \ 命名空间包含两个流行的正则化器：`L1` 正则化（在机器学习中也称为 `LASSO`）和 `L2` 正则化（在机器学习中也称为 `Ridge` 正则化）。`L1`\
  \ 用于 `MAE`（平均绝对误差），`L2` 用于 `MSE`（均方误差）。这两种正则化器都作为惩罚项添加到所选的代价函数中，以减少机器学习模型中特征的影响。请注意，`LASSO`\
  \ 可以将值驱动为零，导致特征实际上从模型中消除，因此它与机器学习中的特征选择有关。\n\n`tf.keras.utils` 命名空间包含了一系列函数，包括用于将类向量转换为二分类的\
  \ `to_categorical()` 函数。\n\n尽管 TF 2 中还有其他命名空间，但如果你是 TF 2 和机器学习的初学者，之前所有小节中列出的类可能足够应对你大多数的任务。\n\
  \n## TF 2 Keras 对比“独立版” Keras\n\n原始的 Keras 实际上是一个规范，具有各种后端框架，如 `TensorFlow`、`Theano`\
  \ 和 `CNTK`。目前，独立 Keras 不支持 TF 2，而 `tf.keras` 中的 Keras 实现已经针对性能进行了优化。\n\n独立 Keras\
  \ 永久存在于 `keras.io` 包中，Keras 网站对此详细讨论：`keras.io`。\n\n现在你对 Keras 的 TF 2 命名空间及其包含的类有了整体了解，让我们来看看如何创建一个基于\
  \ Keras 的模型，这是下一节的主题。\n\n## 创建基于 Keras 的模型\n\n以下步骤描述了创建、训练和测试 Keras 模型涉及的高级序列：\n\
  \n* 步骤 1：确定模型架构（隐藏层层数、各种激活函数等）。\n* 步骤 2：调用 `compile()` 方法\n* 步骤 3：调用 `fit()` 方法训练模型\n\
  * 步骤 4：调用 `evaluate()` 方法评估已训练的模型\n* 步骤 5：调用 `predict()` 方法进行预测\n\n步骤 1 涉及确定以下值：\n\
  * 隐藏层层数\n* 各种激活函数\n* 等\n\n步骤 2 到步骤 4 涉及训练，而步骤 5 涉及预测。\n\n让我们考虑一下操作序列：\n1. 定义架构。\n\
  2. 调用 `compile()`。\n3. 调用 `fit()`。\n4. 调用 `evaluate()`。\n5. 调用 `predict()`。\n\n\n\
  \n\n```python\noptimizer=tf.keras.optimizers.Adam(0.1))\n```\n\n## 训练模型\n\n```python\n\
  history = model.fit(weight, price, epochs=100, verbose=False)\n```\n\n# 绘制 epoch\
  \ 数与损失值的图\n\n```python\nplt.xlabel('Number of Epochs')\nplt.ylabel(\"Loss Values\"\
  )\nplt.plot(history.history['loss'])\nplt.show()\n\nprint(\"Cost for 11kg:\",model.predict([11.0]))\n\
  print(\"Cost for 45kg:\",model.predict([45.0]))\n```\n\n列表 A.3 使用 CSV 文件 `pasta.csv`\
