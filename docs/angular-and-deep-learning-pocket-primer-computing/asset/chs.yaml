  \ 格式，然后在 Web 浏览器中使用该模型。模型转换详情在此：\n\nhttps://www.tensorflow.org/js/guide/conversion\n\
  \n另一种可能性利用迁移学习：你从一个之前训练过的模型开始，然后使用自己的数据进行一些（希望是极少的）额外训练。\n\n注意：本章中的代码示例涉及在浏览器中开发的模型（并在\
