  \ Keras 的模型只指定准确率（accuracy）作为评估训练模型的指标，如下所示：\n\n```\nmodel.compile(optimizer='adam',\
  \ loss='sparse_categorical_crossentropy', metrics=['accuracy'])\n```\n\n然而，还有许多其他内置指标可用，每个指标都封装在\
  \ `tf.keras.metrics` 命名空间的 Keras 类中。其中一些指标如下：\n\n* `Accuracy`：预测值与标签匹配的频率\n* `BinaryAccuracy`：预测值与标签匹配的频率\n\
  * `CategoricalAccuracy`：预测值与标签匹配的频率\n* `FalseNegatives`：假阴性的数量\n* `FalsePositives`：假阳性的数量\n\
  * `Mean`：给定值的（加权）平均\n* `Precision`：预测值相对于标签的精确率\n* `Recall`：预测值相对于标签的召回率\n* `TrueNegatives`：真阴性的数量\n\
  * `TruePositives`：真正性的数量\n\n在本章之前，你学习了混淆矩阵，它为 `TP`、`TN`、`FP` 提供了数值，且这些每个值都有对应的 Keras\
  \ 类，分别为：`TruePositive`、`TrueNegative`、`FalsePositive` 和 `FalseNegative`。请在网上搜索使用上述列表列表中指标的代码示例。\n\
