  .attr(\"r\", radius1)\n.attr(\"fill\", colors[0]);\n```\n\n# 总结\n\n本章从 Angular 的概述开始。接下来，你学习了\
  \ `app.component.ts` 和 `app.module.ts`。最后，你学习了如何创建 Angular 应用。\n\n# 第 2 章：UI 控制、用户输入和管道\n\
  \n### Angular 中的 ngFor 指令\n\n本节的代码示例通过 `ngFor` 指令显示了一个硬编码的字符串列表。这个简单的代码示例是一个起点，你可以从这里创建更复杂的应用程序。\n\
  \n列表 2.1 显示了 `app.component.ts` 的内容，它说明了如何使用 `ngFor` 指令显示项目列表。\n\n```typescript\n\
  import {Component} from '@angular/core';\n\n@Component({\n  selector: 'app-root',\n\
  \  template: `<div *ngFor=\"let item of items\">\n    {{item}}\n  </div>`\n})\n\
  export class AppComponent {\n  items : any;\n\n  constructor() {\n    this.items\
  \ = ['one','two','three','four'];\n  }\n}\n```\n\n启动本节中的应用程序，你将在浏览器会话中看到以下输出：\n\n\
  one\ntwo\nthree\nfour\n\n\n\n\n下一节包含一个涉及 `<button>` 元素的代码示例，这可能是 HTML 页面中最常见的 UI\
  \ 控件之一。`app.component.ts` 文件包含了所需的自定义代码，而 `app.component.ts` 文件包含了不需要任何修改的自动生成代码。\n\
  \n## 在 Angular 中显示按钮\n\n将伴随文件中的 `ButtonClick` 目录复制到方便的位置。本节中的 `app.component.ts`\
  \ 文件包含了该 Angular 应用程序的所有自定义代码。列表 2.2 显示了 `app.component.ts` 的内容，它说明了如何渲染 `<button>`\
  \ 元素，并通过显示用户在当前会话中点击 `<button>` 元素的次数来响应点击事件。\n\n**列表 2.2：app.component.ts**\n\n\
  ```typescript\nimport { Component } from '@angular/core';\n\n@Component({\n  selector:\
  \ 'app-root',\n  template: `<<div>\n<button (click)=\"clickMe()\">ClickMe</button>\n\
  <p>Click count is now {{clickCount}}</p>\n</</div>>`,\n  styles: [` button {\n \
  \ color: red;\n}`] \n})\nexport class AppComponent {\n  clickCount = 0;\n  clickMe()\
  \ {\n    ++this.clickCount;\n    console.log(\"click count: \"+this.clickCount);\n\
  \  }\n}\n```\n\n列表 2.2 以一个导入语句开头，随后是所需的 `selector` 属性。接下来，`template` 属性包含一个响应点击事件的\
  \ `<button>` 元素和一个 `<p>` 元素，每当用户点击 `<button>` 元素时，其内容就会更新。(click) 项的值是 `clickMe()`\
  \ 函数（定义在 `AppComponent` 类中），该函数增加并显示 `clickCount` 变量的值。\n\n此外，`styles` 属性为 `<button>`\
  \ 元素指定了 `red` 的值。`styles` 属性是组件样式的示例，这意味着样式仅应用于给定组件的模板。实际上， Angular 通过生成唯一的属性来局部应用\
  \ CSS 而不是全局应用，这些属性在点击 Chrome 器的“元素”选项卡时是可见的。\n\n关于 Angular 中组件样式的更多详细信息请参此处：\n\n\
  [`angular.io/docs/ts/latest/guide/component-styles.html`](https://angular.io/docs/ts/latest/guide/component-styles.html)\n\
  \n![images](img/Pg70.jpg)\n\n**图 2.1** 响应点击事件的 `<button>` 元素\n\n列表 2.2 的下部分是 `AppComponent`\
  \ 类的定义，它包含了在 `clickMe()` 函数中增加的 `clickCount` 变量。现在启动 Angular 应用程序，其输出将显示在图 2.1 中（在点击三次后）。\n\
  \n由于 `app.module.ts` 文件包含了不需要任何修改的自动生成代码，因此没有显示其内容，因为它们已经在第 1 章中讨论过了。\n\n## 元素与属性\n\
  \n在列表 2.2 中，`selector` 属性匹配 HTML 页面 `index.html` 中的元素 `<app-root></app-root>`：\n\
  \n`selector: 'app-root'`\n\n然而，你也可以指定属性而不是元素。例如，假设 `index.html` 包含以下元素：\n\n`<div\
  \ app-root>Loading. . .</</div>`\n\n在这种情况下，你还需要如下所示修改 `selector` 属性（注意方括号）：\n\n\
  `selector: '[app-root]'`\n\n下一节包含一个 Angular 应用程序，它用于跟踪用户点击的单选按钮。之后，我们将看到如何使用 `<button>`\
  \ 元素向用户列表添加新的用户名。\n\n再次，`app.module.ts` 文件包含了不需要任何修改的自动生成代码，因此没有显示其内容，因为它们已经在第 1\
  \ 章中讨论过了。\n\n## Angular 和单选按钮\n\n将伴随文件中的 `RadioButtons` 目录复制到方便的位置。列表 2.3 显示了 `app.component.ts`\
  \ 的内容，它说明了如何渲染一组单选按钮，并跟踪用户点击的那个。\n\n**列表 2.3：app.component.ts**\n\n```typescript\n\
  import {Component} from '@angular/core';\n\n@Component({\n  selector: 'app-root',\n\
  \  template: `\n<h2>{{radioTitle}}</h2>\n<label *ngFor=\"let item of radioItems\"\
  >\n<input type=\"radio\" name=\"options\"\n(click)=\"model.options = item\"\n[checked]=\"\
  item === model.options\">\n{{item}}\n</label>\n<p><button (click)=\"model.options='option1'\"\
  >Set Option #1</button>\n`\n})\nexport class AppComponent {\n  radioTitle = \"Radio\
  \ Buttons in Angular\";\n  radioItems = ['option1','option2','option3','option4'];\n\
  \  model = { options: 'option3' };\n}\n```\n\n列表 2.3 定义了 `AppComponent` 类，它包含了在\
  \ `clickMe()` 函数中增加的 `clickCount` 变量（注：此处原文应为 radioItems 相关逻辑，按原文翻译）。`AppComponent`\
  \ 组件的模板包含一个 `<label>` 元素，`*ngFor` 指令通过遍历 `radioItems` 数组显示一组单选按钮。\n\n![images](img/Pg72.jpg)\n\
