  - 截断 `BPTT`（简单 `RNNs`）\n\n### RNN 的结构\n\n考虑图 5.1 中的 RNN。假设输入序列为 `x1, x2, x3, ...,\
  \ x(t)`，且隐藏状态序列为 `h1, h2, h3, ..., h(t-1), h(t)`。\n\n在时间段 `t` 时，输入是 `h(t-1)` 和 `x(t)`\
  \ 的组合，之后应用激活函数。\n\n` `` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` `。\n\n首先，`ANNs` 和\
  \ `CNNs` 都是“无状态的”，而 `RNNs` 是“有状态的”，因为它们具有内部状态。\n\n### 什么是 BPTT？\n\n`BPTT`（随时间反向传播）在\
  \ `RNNs` 中是 `CNNs` 反向传播的对应物。`RNNs` 的权重矩阵在训练神经网络期间进行更新。\n\n然而，`RNNs` 中可能会发生名为梯度爆炸的问题，也就是说梯度变得任意大（与梯度消失情况下的梯度变得任意小相反）。处理梯度爆炸问题的一种方法是使用*截断\
  \ BPTT*，这意味着 `BPTT` 针对少数步数进行计算，而不是所有的时间步。\n\n好消息是，还有另一种克服梯度爆炸和梯度消失问题的方法，这涉及本章稍后讨论的\
  \ `LSTMs`。\n\n\n\n\n\n# 使用 RNN 和 Keras\n\nListing 5.1 显示了 `keras_rnn_model.py` 的内容，它展示了如何创建一个基于\
  \ Keras 的简单 RNN 模型。\n\n*Listing* 5.1：`keras_rnn_model.py`\n\n```python\nimport tensorflow\
  \ as tf\n\ntimesteps = 30\n\ninput_dim = 12\n\n# number of units in RNN cell\nunits\
  \ = 512\n\n# number of classes to be identified\nn_classes = 5\n\n## Keras Sequential\
  \ model with RNN and Dense layer\nmodel = tf.keras.models.Sequential()\nmodel.add(tf.keras.layers.SimpleRNN(units=units,\n\
  dropout=0.2,\ninput_shape=(timesteps, input_dim)))\nmodel.add(tf.keras.layers.Dense(n_classes,\
  \ activation='softmax'))\n\n# model loss function and optimizer\nmodel.compile(loss='categorical_crossentropy',\n\
  optimizer=tf.keras.optimizers.Adam(),\nmetrics=['accuracy'])\nmodel.summary()\n\
  ```\n\nListing 5.1 首先初始化变量 `timesteps`（时间步数）、`input_dim`（每个输入数值向量的元素数量）、`units`（RNN\
  \ 神经元中的隐藏单元数量）以及 `n_classes`（数据集中的类别数量）。\n\nListing 5.1 的后续部分创建了一个基于 Keras 的模型，该模型与之前的\
  \ Keras 模型相似，区别在于 RNN 层的代码片段，如下所示：\n\n```python\nmodel.add(tf.keras.layers.SimpleRNN(units=units,\n\
  dropout=0.2,\ninput_shape=(timesteps, input_dim)))\n```\n\n前面的代码片段添加了 `SimpleRNN`\
  \ 类的实例以及在之前代码块中定义的变量。\n\n代码的最后部分调用了 `compile()` 方法，随后调用 `summary()` 方法来显示模型的结构。\n\
  \n运行 Listing 5.1 中的代码以查看输出输出：\n\n| Model: \"sequential\" |\n| --- |\n| Layer (type)\
  \ || Output Shape || Param # |\n| simple_rnn (SimpleRNN) || (None, 512) || 268800\
  \ |\n| dense (Dense) || (None, 5) || 2565 |\n\nTotal params: 271,365\nTrainable\
  \ params: 271,365\nNon-trainable params: 0\n\n现在你已经看到在 Keras 中创建一个基于 RNN 的模型是多么简单，让我们来看一个\
  \ Keras RNN 模型示例，该模型将在 MNIST 数据集上进行训练，这是下一节的主题。\n\n## 使用 Keras、RNN 和 MNIST\n\nListing\
  \ 5.2 显示了 `keras_rnn_mnist.py` 的内容，展示了如何创建一个在 MNIST 数据集上训练的基于 Keras 的简单 RNN 模型。\n\
  \n*Listing* 5.2：`keras_rnn_mnist.py`\n\n```python\n## this code works with TensorFlow\
  \ 2.1 and Python 3.6\nimport tensorflow as tf\nimport numpy as np\n\n# get an instance\
  \ of the TF 2 built-in mnist dataset:\nmnist = tf.keras.datasets.mnist\n\n# load\
  \ the mnist dataset and split into training and test:\n(x_train, y_train), (x_test,\
  \ y_test) = mnist.load_data()\n\n# compute the number of training labels:\nnum_labels\
  \ = len(np.unique(y_train))\n\n# make sure that all labels are one-hot encoded:\n\
  y_train = tf.keras.utils.to_categorical(y_train)\ny_test = tf.keras.utils.to_categorical(y_test)\n\
  \n# resize the training and test data x_train and x-test\n# and divide pixel values\
  \ by 255 (normalization)\nimage_size = x_train.shape[1]\nx_train = np.reshape(x_train,[-1,\
  \ image_size, image_size])\nx_test = np.reshape(x_test,[-1, image_size, image_size])\n\
  x_train = x_train.astype('float32') / 255\nx_test = x_test.astype('float32') / 255\n\
  \n# initialize some standard parameters:\ninput_shape = (image_size, image_size)\n\
  batch_size = 128\nunits = 256\ndropout = 0.2\n\n# create a Keras RNN model with:\n\
  # 256 units \n# input is 28-dimensional vector \n# having 28 timesteps\n# with a\
  \ few simple layers\nmodel = tf.keras.models.Sequential()\nmodel.add(tf.keras.layers.SimpleRNN(units=units,\n\
  dropout=dropout,\ninput_shape=input_shape))\nmodel.add(tf.keras.layers.Dense(num_labels))\n\
  model.add(tf.keras.layers.Activation('softmax'))\nmodel.summary()\ntf.keras.utils.plot_model(model,\
  \ to_file='my-rnn-mnist.png', show_shapes=True)\n\n## loss function and optimizer\n\
  model.compile(loss='categorical_crossentropy',\noptimizer='sgd',\nmetrics=['accuracy'])\n\
  \n# train the network:\nmodel.fit(x_train, y_train, epochs=5, batch_size=batch_size)\n\
  \n# evaluate the model\nloss, acc = model.evaluate(x_test, y_test)\nprint(\"\\nTest\
  \ accuracy: %.1f%%\" % (acc*100))\n```\n\n\n\n\n\n```python\nn_inputs = 3 # 每个时间单元的输入数量\n\
  n_neurons = 5 # 隐藏单元数量\n\nX_batch = np.array([\n    # t = 0 t = 1\n    [[0, 1, 2],\
  \ [9, 8, 7]], # 实例 0\n    [[3, 4, 5], [0, 0, 0]], # 实例 1\n    [[6, 7, 8], [6, 5,\
  \ 4]], # 实例 2\n    [[9, 0, 1], [3, 2, 1]], # 实例 3\n])\n\n# sequence_length <= 每个\
