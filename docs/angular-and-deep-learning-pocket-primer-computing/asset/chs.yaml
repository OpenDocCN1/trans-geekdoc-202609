  \ 和 `tfjs-vis` 执行线性回归的代码示例。\n\n# TensorFlow.js, tfjs-vis 和线性回归\n\nListing 6.14 显示了\
  \ `tfjsvis-linreg.html` 的内容，它说明了如何生成一组随机值，然后使用机器学习和线性回归来确定最佳拟合线。\n\n列表 6.14: tfjs-vis-linreg.html\n\
  \n```html\n<html>\n<head>\n<script src=\"https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest\"\
  > </script>\n<script src=\"https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis@latest\"\
