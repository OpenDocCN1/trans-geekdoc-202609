  \ 装饰器内部 `imports` 属性元素列表中。\n\n启动 Angular 应用，你将看到一个可以点击的按钮（此处未显示），点击后将看到以下文本：\n\n\
  * Jane Jones lives in San Francisco\n* John Smith lives in New York\n* Dave Stone\
  \ lives in Seattle\n* Sara Edson lives in Chicago\n\nAngular 8 之前的 Angular 应用需要两个额外的代码片段，其中第一个是\
  \ `map()` 操作符的导入语句，所示：\n\n```typescript\nimport { map } from 'rxjs/operators';\n\
  ```\n\n第二个代码片段涉及在调用 `get()` 方法后立即调用 `map()` 操作符，所示：\n\n```typescript\nthis.http.get('assets/employees.json')\n\
  //.map(res => res.json()) redundant in Angular 8 and 9 and 10\n```\n\n然而， `map()`\
  \ 操作符会自动为我们调用，因此不再需要它；此外，如果你包含了这段代码片段，将会看到错误信息。\n\n### 升级来自早期 Angular 版本的代码\n\n\
  尽管 Angular 10 在很大程度上与之前的 Angular 版本向后兼容，但有时需要修改代码，特别是涉及 HTTP 请求的代码。\n\n特别是，上一节向你展示了在\
  \ Angular 9 或 Angular 10 中不再需要调用 `map()` 操作符。另一个变化涉及一个冗余的导入语句以及对另一个导入语句的修改。\n\n\
  具体来说，假设你在编译 Angular 应用时看到以下错误信息：\n\n* `Error: Can't resolve 'rxjs/Rx'`\n* `Module\
  \ not found Error: Can't resolve '@angular/http'`\n* `Error: Unexpected value 'HttpClient'\
  \ imported by the module 'AppModule'. Please add a @NgModule annotation.`\n\n你需要更新\
  \ `app.component.ts` 以及 `app.module.ts` 中的代码，使用适用于 Angular 10 的适当代码，所示 `app.component.ts`：\n\
  \n```typescript\n// import { Observable } from 'rxjs/Observable'; // old\nimport\
  \ { Observable } from 'rxjs'; // new\n\n// import { Http } from '@angular/http';\
  \ // old\nimport { Http } from '@angular/common/http'; // new\nimport { HttpClient\
  \ } from '@angular/common/http'; // new\nimport { HttpHeaders } from '@angular/common/http';\
  \ // new\n\n// import 'rxjs/Rx'; // old\n```\n\n以下是 `app.module.ts` 的更改：\n\n```typescript\n\
  //import {HttpModule} from '@angular/http'; // old\nimport {HttpClientModule} from\
  \ '@angular/common/http'; // new\n\nimports: [\n  BrowserModule,\n  HttpClientModule,\
  \ // new\n],\n\ndeclarations: [\n  AppComponent,\n  HttpClientModule // new\n],\n\
  ```\n\n对 `app.component.ts` 和 `app.module.ts` 的上述更改正是为了将 Angular 应用 `ReadJSONFile`（在上一节中讨论过）升级为\
  \ Angular 10 应用而做的更改。在理想情况下，这些更改也适用于你的应用程序，从而节省一些调试工作。但是，请记住，你可能需要对你的 Angular 应用代码中进行其他修改，关于“Reading\
  \ Files with JSON - 本节将向你如何处理多个基于 JSON 数据的文件”。\n\n```typescript\nimport { Component\
