  \  }\n}\n```\n\n列表 2.4 包含了与列表 2.3 类似的代码，后者显示了字符串列表。此外，列表 2.4 中的 `template` 属性包含一个\
  \ `<input>` 元素，以便用户输入文本。当用户点击 `<button>` 元素时，会调用 `clickMe()` 函数并将 `fname.value`\
  \ 作为参数，它是 `<input>` 元素文本引用。\n\n注意使用 `#fname` 语法作为元素的标识符，在本例中这是一个 `<input>` 元素。因此，用户在\
  \ `<input>` 元素中输入的文本通过 `fname.value` 进行引用。以下代码片段提供了此功能：\n\n```html\n<input #fname>\n\
  \n<button (click)=\"clickMe(fname.value)\">ClickMe</button>\n```\n\n\n\n\n`AppComponent`\
  \ 组件中的 `clickMe()` 方法包含一个 `console.log()` 语句，用于显示用户输入的文本（可选的），然后将新文本追加到 `user` 数组中。Listing\
  \ 2.4 中的最后部分由一个被注释掉的伪代码块组成，用于防止用户输入空字符串或重复字符串。此代码块涉及“纯”JavaScript，实际代码留给你进行练习。\n\
  \n![images](img/Pg74.jpg)\n\n图 2.3 向列表添加文本字符串\n\n现在，启动 Angular 应用程序，当你输入字符串“Sara”并点击按钮元素时，你将看到图\
  \ 2.3 中显示的输出。\n\n此外，`app.module.ts` 文件包含不需要任何修改的自动生成代码。\n\n## 在 Angular 中删除列表中的项\n\
  \n本节通过在每个列表项旁边添加新的 `<button>` 元素来增强上一节的代码。现在，将配套文件中的 `DelListButton` 目录复制到方便的地方。Listing\
