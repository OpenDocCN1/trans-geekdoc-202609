  \ vs. Tensors Comparison\n\nThe TF 2 `tf.data.Datasets` 包含数据行（通常在平文件中），列被称为*特征（features）*，行代表数据集的*实例（instance）*。相比之下，TF\
  \ 2 Dataset 指的是 `tf.data.Dataset` 命名空间中的一个类，它像是一个包含数据行的“普通”数据集的封装器。\n\n（注：此处原文存在大量重复，已按要求翻译翻译）\n\
  \n\n\n\n\n在前面的代码块中，`TF 2` 的 `from_tensors()` API 创建了一个形状为 (2,2,3) 的 3D 张量，而 `TF\
  \ 2` 的 `from_tensor_slices()` API 则合并输入张量并产生一个形状为 (2,3) 的张量。\n\n为了进一步说明这两个 API，请考虑以下代码块：\n\
  \n```python\nimport tensorflow as tf\n\nds1 = tf.data.Dataset.from_tensor_slices(\n\
  \  (tf.random.uniform([3, 2]), tf.random.uniform([3])))\n\nds2 = tf.data.Dataset.from_tensors(\n\
  \  (tf.random.uniform([3, 2]), tf.random.uniform([3])))\n\nprint('-----------------------------')\n\
  for i, item in enumerate(ds1):\n    print('elem1: ' + str(i + 1), item[0], item[1])\n\
  \    print('-----------------------------')\nfor i, item in enumerate(ds2):\n  \
  \  print('elem2: ' + str(i + 1), item[0], item[1])\n    print('-----------------------------')\n\
  ```\n\n运行上述代码以查看以下输出：\n\n```\n-----------------------------\nelem1: 1 tf.Tensor([0.965013\
  \ 0.8327141], shape=(2,), dtype=float32) tf.Tensor(0.03369963, shape=(), dtype=float32)\n\
  elem1: 2 tf.Tensor([0.2875235 0.11409616], shape=(2,), dtype=float32) tf.Tensor(0.05131495,\
  \ shape=(), dtype=float32)\nelem1: 3 tf.Tensor([0.08330548 0.13498652], shape=(2,),\
  \ dtype=float32) tf.Tensor(0.3145547, shape=(), dtype=float32)\n-----------------------------\n\
  elem2: 1 tf.Tensor([[0.9139079 0.13430142] [0.9585271 0.58751714] [0.4501326 0.8380357]],\
  \ shape=(3, 2), dtype=float32) tf.Tensor([0.00776255 0.2655964 0.61935973], shape=(3,),\
  \ dtype=float32)\n-----------------------------\n```\n\n## TF 2 Dataset 的基本步骤\n\n\
  执行以下三个步骤来创建和处理 `TF 2 Dataset` 的内容：\n\n1. 创建或导入数据。\n2. 定义生成器（Python 函数）。\n3. 消费数据。\n\
  \n有许多方法从多个源填充 `TF 2 Dataset`。为了简单起见，本附录第一部分的代码示例执行了以下步骤：首先，使用初始化的 `NumPy` 数组创建一个\
  \ `TF 2 Dataset` 实例；其次，定义一个 Python 函数来遍历 `TF 2 Dataset`；第三，访问数据集的元素（在某些情况下，将这些元素提供给\
  \ `TF 2 model`）。\n\n备注：请记住 `TF 1.x` 将 `Datasets` 与 `iterators` 结合，而 `TF 2` 使用 `generators`\
  \ 配合 `Datasets`。`TF 2` 使用 `generators` 是因为急模式执行（`TF 2` 的默认执行模式）不支持迭代器。\n\n## 一个简单的\
  \ TF 2 tf.data.Dataset\n\n列表 C.3.1 显示了 `tf2_numpy_dataset.py` 的内容，它展示了如何从数字 `NumPy`\
  \ 数组创建一个基础的 `TF 2 tf.data.Dataset`。尽管此代码示例非常简单，但它是本附录其他代码示例中出现的初始代码块。\n\n列表 C.3.1:\
  \ tf2_numpy_dataset.py\n\n```python\nimport tensorflow as tf\nimport numpy as np\n\
  \nx = np.arange(0, 10)\n# make a dataset from a numpy array\nds = tf.data.Dataset.from_tensor_slices(x)\n\
