  \ 中 `<input>` 元素的 `(click)` 属性设置了 `model.options`。这比使用 JavaScript 更紧凑。现在启动 Angular\
  \ 应用程序以查看图 2.2 中的输出。\n\n## 在 Angular 列表中添加项\n\n本节的代码示例显示了当用户点击按钮时更新字符串列表。将伴随文件中的\
