  - 2.4 模型差异识别和定位不同模型版本之间的更改。随着模型的演进，跟踪这些变化对于维护是重要的。现有的模型差异方法和工具基于相似性的准则来引导搜索过程。在我们的工作中，使用
    IBM Rhapsody Diff 工具来查找 Rhapsody 图之间的差异。该工具属于同一祖先的 Rhapsody 项目（即都源自基模型）。注意到，该工具依赖于内部配给模型元素的唯一符来匹配模型中的元素。
