  \n![](img/fm1.png)\n\n# 第 6 章：管道和 Kubeflow 简介\n\n## 简介\n\n在前几章中，我们使用 Vertex AI 的\
  \ Workbench 通过 Vizer 训练了包含超参数调优的自定义模型。在本章中，我们将开始使用 Vertex AI 的管道。我们将了解什么是管道、什么是\
  \ Kubeflow、管道的组成部分，以及如何使用 Kubeflow 配置和运行 Vertex AI 管道。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\
  \n*   什么是机器学习管道\n*   机器学习管道的优势\n*   Kubeflow 简介\n*   Kubeflow 的组件\n*   Kubeflow\
  \ 的任务\n*   模型训练数据\n*   API 启用和额外权限\n*   管道代码演练\n*   Vertex AI 管道\n*   资源删除\n\n##\
  \ 目标\n\n在本章结束时，您将对机器学习 (ML) 管道、Kubeflow 及其组件有很好的理解。读者还将学习如何在 Vertex AI 上使用 Kubeflow\
  \ 构建管道。\n\n## 什么是机器学习管道\n\n机器学习管道是一个用于管理 ML 模型（或多个模型集合）输入和输出的综合框架。它包含原始数据、特征和输出作为输入，以及机器学习模型及其参数和预测作为输出。\n\
  \n理解 ML 管道的另一种方式是：将大型机器学习操作分解为较小的、可重用的模块，这些模块可用于管道中以生成模型，这也是一种 ML 管道。通过消除不必要的步骤，ML\
  \ 管道加快并简化了模型构建过程。\n\n## Vertex AI 管道\n\nVertex AI 管道通过以无服务器方式编排 ML 工作流，并将该过程的工件存储在\
  \ Vertex ML Metadata 中，使自动化、监控和管理 ML 系统变得更加容易。通过在 Vertex ML Metadata 中跟踪 ML 工作流的输出，用户可以追溯制作每个工件（如\
  \ ML 模型的训练数据、超参数和代码）所经历的步骤。\n\n管道用于应用 MLOps 方法来简化并跟踪您最常执行的任务。通过尝试超参数、训练步骤、迭代等的各种配置，试验您的机器学习过程。重用管道组件或整个管道来训练新模型。使用\
  \ Kubeflow SDK 或 TensorFlow Extended 构建的管道可以使用 Vertex AI 管道执行。\n\n## 机器学习管道的优势\n\
  \n机器学习管道有多种优势：\n\n### 执行\n\n\n\n\n该管道赋予用户以可靠且无人值守的方式并行编程多个阶段的能力。这意味着用户可以在数据建模和准备过程进行的同时，专注于其他事务。由于\
  \ ML 管道流程的每个阶段都作为独立组件运行，程序可以运行得更快，并提供高效且高质量的结果。\n\n## 模型版本控制与追踪\n\n我们可以利用管道来清晰地标识和版本化数据源、输入和输出，而无需手动跟踪每次迭代的数据和输出。\n\
  \n## 故障排查\n\n管道方法将每个作业拆分为各个组件（例如数据预处理和模型训练的不同组件）。因此，调试整段代码并定位某个特定组件内的问题变得容易得多。\n\
  \n## 资源利用\n\n现在可以使用多个管道，它们在物理上分离但配置相似的计算机系统和存储设施间成功协调。它通过根据每个步骤的计算复杂度，将管道阶段分发到多台机器（`CPUs`、`GPUs`、`Data\
  \ Science VMs` 等）上，从而实现硬件的有效利用。\n\n## Kubeflow 简介\n\n`Kubeflow` 项目的目标是简化 ML 工作流在\
  \ `Kubernetes` 上的部署，同时使其具有可移植性和可扩展性。`Kubeflow` 旨在简化将开源 ML 系统部署到各种基础设施的过程。任何运行 `Kubernetes`\
  \ 的环境也应支持 `Kubeflow` 的使用。`Kubeflow Pipelines SDK` 为用户提供了一组 Python 包，可用于定义和执行 ML\
  \ 工作流。\n\n## Kubeflow 组件\n\n在 `Kubeflow Pipelines (KFP)` 中，任何处理机制最基本的构建块称为组件。组件是一个命名模板，它通过使用镜像、命令和若干参数来指定如何操作容器。由于组件也可以包含输入和输出，因此可以将其视为计算模板，就像函数一样。动态数据（称为组件输入）用于容器指令或参数中。组件的输出可能是可序列化的\
  \ ML 制品。\n\n有三种不同的方式来编写具有这三个特征的组件：\n\n*   **轻量级基于 Python 函数的组件**：轻量级基于 Python 函数的组件最易于编写（也称为轻量级组件）。轻量级组件创建的组件在执行期间会在容器中运行单个\
  \ Python 函数。\n\n*   **容器化 Python 组件**：容器化 Python 组件允许用户将基于 Python 函数的组件打包在容器中。容器化\
  \ Python 组件允许作者利用组件 Python 函数描述之外的额外源代码，包括多个文件。这是发布需要比单个函数所能容纳的更多源代码的 Python 组件，或在多个组件中重用源代码的理想方式。\n\
  \n*   **自定义容器组件**：您可以通过使用自定义容器组件提供一个容器作为您的组件来执行。使用镜像、命令和参数，您可以使用 `KFP` 的 `ContainerSpec`\
  \ 对象来指定容器。\n\n## Kubeflow 任务\n\n由输入驱动的作业执行一个组件，称为任务。它是组件模板的实例化。管道由可能共享数据也可能不共享数据的作业组成。一个管道组件可以实例化多个作业。使用循环、条件和退出处理程序，可以动态地生成和运行任务。因为任务代表组件的运行时执行，您可以配置环境变量、硬件资源需求和其他任务级参数。\n\
  \n有三种类型的任务依赖关系：\n\n*   **独立任务**：视情况而定，任务之间可能相互依赖，也可能不相互依赖。如果某作业不依赖于另一作业的结果，反之亦然，则我们说这两个任务完全解耦。在管道运行时，如果两个作业是独立的，它们可以同时运行。\n\
  \n*   **隐式依赖任务**：当一个作业的结果作为另一个作业的输入时，就会在任务之间创建隐式依赖关系。在这种情况下，上游作业将先于下游作业运行，后者将获得前者的结果。\n\
  \n*   **显式依赖任务**：在不共享数据的情况下控制两个活动的运行顺序可能很有用。如果是这种情况，可以通过调用后续作业来执行。（需要提及 `.after()`\
  \ 以在任务之间创建执行序列）。\n\n## 模型训练数据\n\n对于本练习，数据从 Kaggle 下载（链接如下），该数据集列在 CC0：公共领域许可证下（与我们用于图像数据\
