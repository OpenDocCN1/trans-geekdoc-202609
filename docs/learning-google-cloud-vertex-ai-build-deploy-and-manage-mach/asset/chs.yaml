  \n## 资源删除\n\n我们使用了云存储来存储数据，请手动从云存储中删除文件。为图像数据和表格数据创建了数据集，请手动删除它们。图像和表格的分类模型已部署到端点以获取预测和解释，请确保从端点取消部署模型并删除端点（参阅\
  \ 第 2 章，Vertex AI 和 AutoML 表格简介 以及 第 3 章，AutoML 图像、文本和预构建模型）。预测是通过工作台获得的，请确保删除工作台实例。\n\
  \n## 可解释 AI 的局限性\n\n以下是 Vertex AI 中可解释 AI 的一些局限性：\n\n* 每个归因仅显示该属性对该案例预测的影响程度。单个归因可能无法代表模型行为。首选对数据集进行聚合归因，以了解大致的模型行为。\n\
  * 模型和数据决定归因。它们只能显示模型的数据模式，而不能显示任何潜在联系。目标与特征的关联不取决于其强归因。归因表明模型是否使用该特征进行预测。\n* 仅凭归因无法确定模型质量；建议考虑训练数据的评估和模型的评估指标。\n\
  * 集成梯度法适用于可微模型（TensorFlow 图中所有操作的导数均可计算）。Shapley 方法用于不可微模型（TensorFlow 网络中的不可微操作，如舍入操作和解码）。\n\
  \n## 结论\n\n在本书中，我们首先了解了云平台、云的几个重要组件以及云平台的优势。我们开始通过 Vertex AI AutoML 针对表格、文本和图像数据开发机器学习模型，并将训练好的模型部署到端点以进行在线预测。甚至在进入自定义模型构建的复杂性之前，我们就致力于了解如何利用平台的预构建模型来获取预测。对于自定义模型，我们利用工作台进行代码开发以训练模型，并利用\
  \ Docker 镜像提交训练作业，还使用 Vizier 进行超参数调优以进一步提升模型性能。我们研究了平台的流水线组件来训练、评估模型，并使用 Kubeflow\
  \ 和 TFX 将模型部署用于在线预测。我们利用 Vertex AI 的特征存储创建了一个用于特征的中心化存储库。这是本书的最后一章，我们在其中了解了可解释 AI\
  \ 及其必要性。我们为图像和表格数据训练了 AutoML 分类模型以获取解释，并使用 Python 代码获得了解释。GCP 正在添加大量新组件和功能以增强其能力，请定期查看平台（平台文档）以保持更新。\n\
