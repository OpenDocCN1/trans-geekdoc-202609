  \ AutoML 模型获取预测时用于身份验证的同一行代码。\n\n注意：\n\n*   用户需为自然语言模型安装 `google-cloud-language`，为视觉模型安装\
  \ `google-cloud-vision`。\n*   预训练模型使用通用数据训练，可能无法针对特定业务问题给出准确预测。\n*   预训练模型中显示的图表也包含\
  \ AutoML 部分，这是因为在 Vertex AI 推出前，AutoML 是 GCP 中的一个单独部分。\n\n## AutoML 的优势\n\nAutoML\
  \ 的优势如下：\n\n*   **效率提升**：大幅提高的生产力是支持使用 AutoML 工具的最有力论据之一。你利用机器学习时间的效率越高，节省的资金就越多。\n\
  *   **大规模 ML**：你无需将所有时间花在重复性的建模活动上，而是可以使用 AutoML 专注于扩展机器学习应用。这使你能够迅速有效地解决整个公司面临的问题。\n\
  *   **弥补技能差距**：这给了你填补组织技能空白的机会。考虑到这一点，外包 AI 解决方案并一次性投资 AutoML 工具，在财务和逻辑上往往比维持一个内部数据科学家团队更合理。\n\
  *   **推广 AI**：AutoML 解决方案帮助业务分析师和主题专家构建有护栏保障的安全模型。这些角色不再需要构建模型的数据科学家。AutoML 可让数据科学更易上手，并有助于普及\
  \ AI。\n*   **缩短上市时间**：自动化特定的模型开发流程可提高效率并缩短上市时间。AutoML 模型不如手动定制的模型优秀，但不比基础 ML 模型差。在面临激烈竞争时，迅速果断地站稳脚跟也至关重要。\n\
  \n## AutoML 的局限性\n\nAutoML 存在一些局限性：\n\n*   **灵活性**：AutoML 框架能处理大多数数据集，但这种泛化可能会遗漏非典型数据集。自动化机器学习在大多数情况下效果良好，但对于其他挑战，其准确性和持久性可能不如人工方法。\n\
  *   **业务挑战**：当前 AutoML 系统优化的目标是固定的。现实挑战往往包含多重目标，例如在成本与决策之间做出细微权衡的需求。在结果出来前，人们几乎没有机会充分评估这种多目标研究。\n\
  *   **处理能力**：AutoML 在选择最佳方法前会测试几乎每一种模型。此过程消耗大量计算资源。在手动模式下，数据科学家会先排除不正确的算法。\n\n##\
  \ 结论\n\n本章详细介绍了 GCP 针对图像和文本数据的 AutoML 部分。我们还讨论了 AutoML 的优势和局限性。在下一章中，我们将开始处理自定义模型。\n\
