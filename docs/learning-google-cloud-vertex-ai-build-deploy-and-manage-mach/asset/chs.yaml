  \n## 创建 Workbench\n\n在之前的所有章节中，我们都在 Workbench 上工作。《Vertex AI Workbench》和《自定义模型训练》指导了使用\
  \ GUI 方法创建 Workbench。请按照以下步骤从 Cloud Shell 创建 Vertex AI Workbench：\n\n### 步骤 1：激活\
  \ Cloud Shell\n\n按照 图 7.6 中所示的步骤激活 Cloud Shell 并输入以下命令：\n\n![图 7.6：激活 Cloud Shell](img/Figure_7.6.png)\n\
