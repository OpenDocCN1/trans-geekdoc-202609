  \n### 步骤 5：可解释性\n\n在处理 AutoML 图像时，可解释性需要在两个地方设置：模型训练阶段和部署模型时。请按照以下步骤配置模型训练阶段的可解释性。\n\
  \n以下步骤展示的是 Integrated gradients 解释方法，如以下屏幕截图所示：\n\n![](img/Figure_10.7.png)\n\n\
  **图 10.7：图像分类模型的可解释性**\n\n1.  启用 `Generate explainable bitmaps`。\n2.  `Visualization\
