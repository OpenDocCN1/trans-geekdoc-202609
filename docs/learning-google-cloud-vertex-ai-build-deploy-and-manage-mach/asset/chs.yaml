  \ ID。（一个端点可以部署多个模型）。相同的 ID 用于在线预测。\n3.  即使在用户获得在线预测之前，用户也可以通过填充列值并点击屏幕底部的**预测**，在平台上测试模型输出。\n\
  4.  输出预测将填充概率得分。\n\n## 服务账号创建\n\n已部署的模型已准备好为预测请求提供服务。在发送数据和模型详细信息进行预测时，用户也应经过身份验证。在这些场景中，不能使用用户\
  \ GCP 账号详细信息进行身份验证；需要服务账号。请按照以下步骤创建服务账号。打开 **IAM 和管理** 并按照图 2.30 所示步骤操作：\n\n###\
