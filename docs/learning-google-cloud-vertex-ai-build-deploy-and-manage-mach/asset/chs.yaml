  \n1.  所有添加的参数将被列出。\n2.  在代码中我们优化的是准确率指标（最大化），输入 **accuracy**（准确率）。\n3.  目标是最大化准确率。\n\
  4.  最大试验次数保持为低至 2 次，因为模型非常简单。\n5.  最大并行试验次数保持为 1，原因相同。\n6.  在 Algorithm（算法）下，选择\
  \ **Default**（默认）（也可以选择 random search 或 grid search）。不同算法的解释如下：\n    *   **Random\
  \ search**（随机搜索）：对可实现区域进行直接的随机搜索。\n    *   **Unspecified algorithm**（未指定算法）：不指定算法。Vertex\
  \ AI 会在高斯过程带状搜索、线性组合搜索或其变体之间进行选择。\n    *   **Grid search**（网格搜索）：一种可行的网格搜索。如果用户希望指定的试验次数多于可行点，这一点很重要。如果未指定网格搜索，Vertex\
  \ AI 可能会创建重复选项。\n7.  点击 **CONTINUE**（继续）。\n\n> **注意**：GCP 限制了免费账号的训练 CPU。请尽量将最大试验次数和并行试验次数保持较低。如果遇到配额指标超限等错误，请尝试降低这两个参数的值。\n\
