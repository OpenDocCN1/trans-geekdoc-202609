  \ 所示页面：\n\n![](img/Figure_3.51.png)\n\n图 3.51：自然语言着陆页\n\n1.  自然语言预训练模型：\n    1.\
  \  可用于情感分析、实体分析、实体情感分析、内容分类和语法分析等各种任务。\n2.  医疗保健自然语言 API 可用于从医疗文本中获取洞见。\n\n点击“视觉”将导航至\
