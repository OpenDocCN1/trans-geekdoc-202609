  \ Python 代码以获取预测和解释。\n\n## 图像分类的解释\n\n模型成功部署后，从创建的 Workbench 打开 JupyterLab，并输入以下步骤中的\
  \ Python 代码：\n\n### Step 1: 安装所需包\n\n输入以下 Python 代码安装所需包：\n\n```\n!pip install tensorflow\n\
  !pip install google-cloud-aiplatform==1.12.1\n```\n\n### Step 2: 内核重启\n\n在下一个单元格中输入以下命令以重启内核（用户也可以通过\
  \ GUI 重启内核）：\n\n```\nimport os\nimport IPython\n\nif not os.getenv(\"\"):\n    IPython.Application.instance().kernel.do_shutdown(True)\n\
  ```\n\n### Step 3: 导入所需包\n\n内核重启后，运行以下代码导入包：\n\n```\nimport base64\nimport tensorflow\
  \ as tf\nimport google.cloud.aiplatform as gcai\nimport explainable_ai_sdk\nimport\
  \ io\nimport matplotlib.image as mpimg\nimport matplotlib.pyplot as plt\n```\n\n\
  ### Step 4: 预测和解释的输入\n\n从训练集中选择任意图像（存储在 Cloud Storage 中用于预测），并在以下代码中提供所选图像的完整路径。运行单元格以读取图像并将其转换为所需格式：\n\
  \n```\nimg_input = tf.io.read_file(\"gs://AutoML_image_data_exai/Kayak/adventure-clear-water-exercise-1836601.jpg\"\
  )\nb64str = base64.b64encode(img_input.numpy()).decode(\"utf-8\")\ninstances_image\
  \ = [{\"content\": b64str}]\n```\n\n### Step 5: 端点选择\n\n运行以下代码选择模型部署所在的端点。此处使用端点的显示名称（而非端点\
  \ ID）。`Image_ex` 是部署模型的端点名称。输出中将显示端点的完整路径（包含端点 ID）：\n\n```\nendpoint = gcai.Endpoint(gcai.Endpoint.list(\n\
  \    filter=f'display_name={\"image_ex\"}',\n    order_by='update_time')[-1].gca_resource.name)\n\
  print(endpoint)\n```\n\n### Step 6: 图像预测\n\n运行以下代码从已部署模型获取预测：\n\n```\nprediction\
  \ = endpoint.predict(instances=instances_image)\nprint(prediction)\n```\n\n预测结果将显示类别的显示名称及其概率，如下图所示：\n\
  \n![](img/Figure_10.15.png)\n\n**图 10.15：图像分类预测结果**\n\n> **注意：** 由于我们使用 Vertex AI\
  \ Workbench 运行此代码，因此未使用服务账户进行身份验证。\n\n### Step 7: 解释\n\n运行以下代码获取输入图像的解释：\n\n```\n\
  response = endpoint.explain(instances=instances_image)\nfor explanation in response.explanations:\n\
  \    attributions = dict(explanation.attributions[0].feature_attributions)\n   \
  \ image_ex = io.BytesIO(base64.b64decode(attributions[\"image\"][\"b64_jpeg\"]))\n\
  \    plt.imshow(mpimg.imread(image_ex, format=\"JPG\"), interpolation=\"nearest\"\
  )\n    plt.show()\n```\n\n解释输出如图所示。绿色高亮区域表示对图像预测起重要作用的区域/像素：\n\n![](img/Figure_10.16.png)\n\
