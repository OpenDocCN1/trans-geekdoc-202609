  \ 组件可以从各种来源和数据类型（如 CSV 文件、TFRecord 记录和 BigQuery）读取数据。运行完成后，将显示一个展示 ExampleGen 结果的交互式控件，如图\
  \ 8.6 所示。ExampleGen 通常生成两种类型的工件，称为训练样本和评估样本。默认情况下，ExampleGen 会将数据分为三分之二用于训练集，三分之一用于评估集。这些工件的存储位置也可以查看，如下所示：\n\
  \n![](img/Figure_8.6.png)\n\n图 8.6：`example_gen` 组件的输出\n\n#### StatisticsGen\n\n\
  在新单元格中运行以下代码：\n\n```\ngen_statistics = tfx.components.StatisticsGen(examples=example_gen_csv.outputs['examples'])\n\
  context_in.run(gen_statistics)\ncontext_in.show(gen_statistics.outputs['statistics'])\n\
  ```\n\nStatisticsGen 组件用于计算数据集的统计信息。这些统计信息可快速概览您的数据，包括形状、特征和值分布等详细信息。您将使用 ExampleGen\
  \ 的输出作为输入来计算关于数据的统计信息。运行完成后，将显示一个分别展示训练集和评估集统计信息的交互式控件，如图 8.7 所示：\n\n![](img/Figure_8.7.png)\n\
  \n图 8.7：`statistics_gen` 组件的输出\n\n#### SchemaGen\n\n在新单元格中运行以下代码：\n\n```\ngen_schema\
  \ = tfx.components.SchemaGen(statistics=gen_statistics.outputs['statistics'])\n\
  context_in.run(gen_schema)\ncontext_in.show(gen_schema.outputs['schema'])\n```\n\
  \n根据统计信息，SchemaGen 组件将为您的数据生成模式。模式就是数据定义。它定义了数据特征的类型、预期属性、边界等。SchemaGen 的输出如图 8.8\
  \ 所示：\n\n![](img/Figure_8.8.png)\n\n图 8.8：`schema_gen` 组件的输出\n\n#### ExampleValidator\n\
  \n在新单元格中运行以下代码：\n\n```\nstats_validate = tfx.components.ExampleValidator(statistics=gen_statistics.outputs['statistics'],\
  \ schema=gen_schema.outputs['schema'])\ncontext_in.run(stats_validate)\ncontext_in.show(stats_validate.outputs['anomalies'])\n\
  ```\n\n基于定义的模式，该组件验证您的数据并检测异常。在生产环境中，这可用于验证进入流水线的任何新数据。它可以检测新数据中的漂移、变化和偏差、意外的类型、模式中不存在的新列。ExampleValidator\
  \ 的输出如图 8.9 所示：\n\n![](img/Figure_8.9.png)\n\n图 8.9：示例验证器组件的输出\n\n#### Transform\n\
  \n我们将创建 `file_transform.py`，其中将包含关于数据标签和特征工程步骤的信息：\n\n1.  在新单元格中运行以下代码以声明包含文件名的变量：\n\
  \    ```\n    TRANSFORM_MODULE_PATH = 'file_transform.py'\n    ```\n\n2.  在新单元格中运行以下代码以创建\
  \ `file_transform.py` 文件。预处理函数（`preprocessing_fn`）是实际改变数据集的地方。它接收并返回一个张量字典，其中张量指的是\
  \ `Tensor` 或 `SparseTensor`。在我们的示例中，我们不应用任何转换，代码只是映射到输出字典。（`%%writefile` 命令将创建包含以下代码的\
  \ `.py` 文件。）：\n    ```\n    %%writefile {TRANSFORM_MODULE_PATH}\n    import tensorflow\
  \ as tf\n    import tensorflow_transform as tft\n\n    NAMES = ['AF3','F7','F3','FC5','T7','P7','O1','O2','P8','T8','FC6','F4','F8','AF4']\n\
  \    LABEL = 'eyeDetection'\n\n    def preprocessing_fn(raw_inputs):\n        processed_data\
  \ = dict()\n        for items in NAMES:\n            processed_data[items] = raw_inputs[items]\n\
  \        processed_data[LABEL] = raw_inputs[LABEL]\n        return processed_data\n\
  \    ```\n\n3.  文件需要复制到 GCS 存储桶中，运行以下代码行进行复制：\n    ```\n    !gsutil cp file_transform.py\
  \ {MODULE_FOLDER}/\n    ```\n\n4.  在新单元格中运行以下代码行以配置 Transform 组件。Transform 组件从 `example_gen`\
  \ 和 `schema_gen` 获取输入：\n    ```\n    transform_data = tfx.components.Transform(\n\
  \        examples=example_gen_csv.outputs['examples'],\n        schema=gen_schema.outputs['schema'],\n\
  \        module_file=os.path.join(MODULE_FOLDER, TRANSFORM_MODULE_PATH))\n    context_in.run(transform_data,\
  \ enable_cache=False)\n    ```\n\nTransform 组件的输出如图 8.10 所示。Transform 图是 Transform\
  \ 组件生成的工件之一，将用于 Trainer 模块。\n\n![](img/Figure_8.10.png)\n\n图 8.10：Transform 组件的输出\n\
  \n运行以下代码以检查转换后数据的几条记录（构建流水线时不需要此代码）：\n\n```\ntrain_sam = os.path.join(transform_data.outputs['transformed_examples'].get()[0].uri,\
  \ 'Split-train')\nfilenames_tfr = [os.path.join(train_sam, name) for name in os.listdir(train_sam)]\n\
  dataset = tf.data.TFRecordDataset(filenames_tfr, compression_type='GZIP')\n\nfor\
  \ record in dataset.take(1):\n    sample = tf.train.Example()\n    sample.ParseFromString(record.numpy())\n\
  \    print(sample)\n```\n\n1 条记录的输出将如图 8.11 所示：\n\n![](img/Figure_8.11.png)\n\n\
  图 8.11：转换后的数据示例\n\n#### Trainer\n\nTrainer 组件负责准备输入数据和训练模型。它需要 ExampleGen 样本、Transform\
  \ 组件和训练代码。训练代码中可以使用 TensorFlow Estimators、Keras 模型或自定义训练循环。与其他组件相比，Trainer 需要对代码进行更多修改：\n\
  \n1.  在新单元格中运行以下代码，它将生成 `trainer.py` 文件（完整代码可在代码库中获取）。`trainer.py`（训练代码）文件将作为 Trainer\
  \ 模块的输入。Trainer 组件生成两个工件：model（训练好的模型本身）和 modelrun（可用于存储日志），这可以在图 8.12 中看到。`trainer.py`\
  \ 文件包含四个函数；这些函数的高层描述如下：\n    *   `run_fn` 将作为执行训练过程的入口点\n    *   `_input_fn` 生成用于训练的特征和标签\n\
  \    *   `_get_serve_tf_examples_fn` 返回一个解析序列化 tf.example 的函数\n    *   `_make_keras_model`\
  \ 创建并返回用于分类的模型\n\n    ```\n    %%writefile trainer.py\n    from typing import List\n\
  \    from absl import logging\n    import tensorflow as tf\n    import tensorflow_transform\
  \ as tft\n    from tensorflow import keras\n    from tensorflow_transform.tf_metadata\
  \ import schema_utils\n    from tfx import v1 as tfx\n    from tfx_bsl.public import\
  \ tfxio\n    from tensorflow_metadata.proto.v0 import schema_pb2\n\n    COL_NAMES\
  \ = ['AF3','F7','F3','FC5','T7','P7','O1','O2','P8','T8','FC6','F4','F8','AF4']\n\
  \    LABEL = \"eyeDetection\"\n    BATCH_SIZE_TRAIN = 40\n    BATCH_SIZE_EVAL =\
  \ 20\n\n    def _input_fn(files, accessor, transform_output, size) -> tf.data.Dataset:\n\
  \        # Creates datasets and apply transformations on them and return. Refer\
  \ the repository for code block of the function\n        return dataset.map(apply_transform_fn).repeat()\n\
  \n    def _get_serve_tf_examples_fn(model, transform_output):\n        # To parse\
  \ the serialized examples and return. Refer the repository for code block of the\
  \ function\n        return serve_tf_examples_fn\n\n    def _make_keras_model() ->\
  \ tf.keras.Model:\n        # Create model with layers, loss functions to be used\
  \ and return. Refer the repository for code block of the function\n        return\
  \ model_classification\n\n    def run_fn(fn_args: tfx.components.FnArgs):\n    ```\n\
  \n\n\n\n\n```python\ntf_transform = tft.TFTransformOutput(fn_args.transform_output)\n\
  \ntrain_samples = _input_fn(_args.train_files, _args.data_accessor, tf_transform,\
  \ BATCH_SIZE_TRAIN)\n\neval_samples = _input_fn(_args.eval_files, _args.data_accessor,\
  \ tf_transform, BATCH_SIZE_EVAL)\n\nmodel_classification = _make_keras_model()\n\
  \nmodel_classification.fit(\n    train_samples,\n    steps_per_epoch=fn_args.train_steps,\n\
  \    validation_data=eval_samples,\n    validation_steps=fn_args.eval_steps\n)\n\
  \nsign = {\n    \"serving_default\": _get_serve_tf_examples_fn(model_classification,\
  \ tf_transform),\n}\n\nmodel_classification.save(fn_args.serving_model_dir, save_format='tf',\
  \ signatures=sign)\n```\n\n1. 运行以下代码将 `trainer.py` 复制到 GCS 存储中：\n   ```bash\n  \
  \ !gsutil cp trainer.py {MODULE_FOLDER}/\n   ```\n\n2. 运行以下代码启动训练器组件。`trainer_file=\"\
  trainer.py\"`：\n   ```python\n   trainer_file_path = os.path.join(MODULE_FOLDER,\
  \ trainer_file)\n\n   model_trainer = tfx.components.Trainer(\n       examples=example_gen_csv.outputs[\"\
  examples\"],\n       transform_graph=transform_data.outputs[\"transform_graph\"\
  ],\n       train_args=tfx.proto.TrainArgs(num_steps=200),\n       eval_args=tfx.proto.EvalArgs(num_steps=10),\n\
  \       module_file=trainer_file_path,\n   )\n\n   context_in.run(model_trainer,\
  \ enable_cache=False)\n   ```\n\n训练器组件的输出如下图所示：\n\n![](img/Figure_8.12.png)\n\n\
  **图 8.12：训练器组件的输出**\n\n### 步骤 6：创建管道\n\n到目前为止，我们已经理解并执行了 TFX 管道的某些组件（并非所有组件都用于管道构建）。让我们开始使用\
  \ `example_gen`、`statistics_gen`、`schema_gen`、`transform`、`trainer` 和 `pusher` 组件构建管道（Pusher\
  \ 组件用于将训练好的模型推送到某个位置，在本例中，训练好的模型将被推送到云存储）：\n\n* 定义一个函数（`_create_pipeline`），包含管道中需要包含的所有步骤/组件，并返回\
  \ TFX 管道。在新单元格中运行下面的代码以定义管道函数：\n\n```python\ndef _create_pipeline(pl_name, pipeline_root_folder,\
  \ data_root,\n                     module_file_transform, module_file_train, model_dir_save,\n\
  \                     ) -> tfx.dsl.Pipeline:\n\n    example_gen_csv = tfx.components.CsvExampleGen(input_base=data_root)\n\
  \    gen_statistics = tfx.components.StatisticsGen(examples=example_gen_csv.outputs['examples'])\n\
  \    gen_schema = tfx.components.SchemaGen(statistics=gen_statistics.outputs['statistics'])\n\
  \    transform_data = tfx.components.Transform(\n        examples=example_gen_csv.outputs['examples'],\n\
  \        schema=gen_schema.outputs['schema'],\n        module_file=os.path.join(MODULE_FOLDER,\
  \ TRANSFORM_MODULE_PATH)\n    )\n    model_trainer = tfx.components.Trainer(\n \
  \       module_file=module_file_train,\n        examples=example_gen_csv.outputs['examples'],\n\
  \        transform_graph=transform_data.outputs['transform_graph'],\n        schema=gen_schema.outputs['schema'],\n\
  \        train_args=tfx.proto.TrainArgs(num_steps=200),\n        eval_args=tfx.proto.EvalArgs(num_steps=10)\n\
  \    )\n    pusher = tfx.components.Pusher(\n        model=model_trainer.outputs['model'],\n\
  \        push_destination=tfx.proto.PushDestination(\n            filesystem=tfx.proto.PushDestination.Filesystem(\n\
  \                base_directory=model_dir_save\n            )\n        )\n    )\n\
  \    return tfx.dsl.Pipeline(\n        pipeline_name=pl_name,\n        pipeline_root=pipeline_root_folder,\n\
  \        components=[example_gen_csv, gen_statistics, gen_schema, transform_data,\
  \ model_trainer, pusher]\n    )\n```\n\n### 步骤 8：定义运行器\n\n正如理论部分所述，TFX 可跨环境和编排框架移植。TFX\
  \ 支持 Airflow、Beam 和 Kubeflow。它还为开发者提供了灵活性以添加他们自己的编排器。编排器必须继承 `TfxRunner`。TFX 编排器基于\
  \ DAG 依赖关系，使用包含管道参数、组件和 DAG 的逻辑管道对象来调度管道组件。在本例中，我们将结合使用 Vertex Pipelines 和 Kubeflow\
  \ V2 dag 运行器。在代码中，我们使用 Kubeflow V2 dag 创建运行器，并通过传递所有管道参数来运行它。\n\n运行以下代码以定义运行器：\n\
  \n```python\ntrainer_file = \"trainer.py\"\nfile_transform = os.path.join(MODULE_FOLDER,\
  \ TRANSFORM_MODULE_PATH)\nfile_train = os.path.join(MODULE_FOLDER, trainer_file)\n\
  pl_def_file = NAME_PIPELINE + '.json'\n\npl_runner = tfx.orchestration.experimental.KubeflowV2DagRunner(\n\
  \    config=tfx.orchestration.experimental.KubeflowV2DagRunnerConfig(),\n    output_filename=pl_def_file\n\
  )\n\n_ = pl_runner.run(\n    _create_pipeline(\n        pl_name=NAME_PIPELINE,\n\
  \        pipeline_root_folder=ROOT_PIPELINE,\n        data_root=INPUT_DATA_DIR,\n\
  \        module_file_transform=file_transform,\n        module_file_train=file_train,\n\
  \        model_dir_save=OUTPUT_MODEL_DIR\n    )\n)\n```\n\n### 步骤 9：管道执行\n\n作为最后一步，我们需要执行管道。在新单元格中运行以下代码以启动管道执行：\n\
  \n```python\nimport google.cloud\n\ngoogle.cloud.aiplatform.init(project=PROJECT_ID,\
  \ location=\"us-central1\")\n\njob = google.cloud.aiplatform.pipeline_jobs.PipelineJob(\n\
  \    template_path=pl_def_file,\n    display_name=NAME_PIPELINE\n)\n\njob.run(sync=False)\n\
  ```\n\n管道启动后，将为用户提供链接以查看状态，如 图 8.13 所示：\n\n![](img/Figure_8.13.png)\n\n**图 8.13：管道链接**\n\
