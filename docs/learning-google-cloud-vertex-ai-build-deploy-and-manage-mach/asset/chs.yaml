  \ AI Feature Store 的最佳实践\n\n以下列出了使用 Vertex AI Feature Store 的一些最佳实践：\n\n1.  **将特征建模到多个实体**：某些特征可能被多个实体使用（如用户层面的每个产品的点击量）。在这类场景中，最好创建一个单独的实体来对共享特征进行分组。\n\
  \n2.  **多团队的访问控制**：数据科学家、机器学习研究人员、DevOps 等多个团队可能需要访问同一个 Feature Store，但需要不同级别的权限。可以使用资源级\
  \ IAM 策略来限制对 Feature Store 或特定实体类型的访问。\n\n3.  **摄入历史数据（回填）**：建议在摄入历史数据时停止在线服务，以防止对在线存储进行任何更改。\n\
  \n4.  **成本优化**：\n\n    *   **自动扩缩**：自动扩缩允许 Vertex AI Feature Store 分析流量模式，并根据 CPU\
  \ 消耗自动增加或减少节点数量，而无需维持高节点数量，这也更有利于成本优化。\n\n    *   建议在 `batchReadFeatureValues` 或\
  \ `exportFeatureValues` 请求中提供 `startTime`，以在批量服务和批量导出期间优化离线存储成本。\n\n## 总结\n\n在本章中，我们了解了\
  \ Vertex AI 的 Feature Store，并通过 Web 控制台和 Python 实践了 Feature Store、实体类型的创建、添加特征以及摄入特征值。\n\
