  ### 步骤 4：混淆矩阵和特征重要性\n\n向下滚动将显示有关其他指标的信息，如图 2.20 所示：\n\n![](img/Figure_2.20.png)\n\
  \n**图 2.20：训练模型评估**\n\n1.  混淆矩阵，点击项目计数以获取实际计数的矩阵。\n2.  变量重要性信息（变量重要性使用采样 Shapley\
  \ 方法计算）。\n\n### 步骤 5：模型版本详情\n\n将显示有关模型的更多详情，如图 2.21 所示：\n\n![](img/Figure_2.21.png)\n\
  \n**图 2.21：训练模型详情**\n\n*   列出模型的各种详情。\n*   模型和试验中的详细日志消息可用。\n\n## 批量预测\n\n批量预测请求是异步的。旨在单个任务中管理大量实例并执行更复杂的模型。每个请求可处理一个或多个实例。预测结果将写入您在\
  \ Cloud Storage 中选择位置的输出文件中。请按以下步骤进行批量预测：\n\n### 步骤 1：创建批量预测\n\n创建批量预测时，用户需输入所有详情，如图\
  \ 2.22 所示：\n\n![](img/Figure_2.22.png)\n\n**图 2.22：模型的批量预测**\n\n1.  点击“创建批量预测”。\n\
  2.  为预测提供名称。\n3.  选择用于预测的模型。\n4.  用于预测的数据可从 Cloud Storage 存储桶或 BigQuery 获取。\n\n\n\
  \n\n## 5. 批量预测\n\n由于我们选择了云存储，请从存储桶中选择文件。\n\n## 6. 输出格式\n\n选择输出格式。输出可以直接转储到 BigQuery\
  \ 表中，或以 `csv`/`jsonl`/`TFrecord` 格式存储在云存储中。\n\n## 7. 输出位置\n\n提供输出位置。\n\n## 8. 创建\n\
  \n点击**创建**。\n\n批量预测可能需要几分钟到几小时，具体取决于记录数量。重要的是，用户无需部署模型即可进行批量预测。\n\n### 步骤 2：批量预测的输出\n\
  \n批量预测完成后，输出将存储到云存储中，如图 2.23 所示：\n\n![](img/Figure_2.23.png)\n\n**图 2.23：批量预测输出**\n\
  \n每条记录将创建一个 CSV 文件（`prediction_results.csv`）。`Prediction.csv` 包含输入记录的信息以及不同类别的概率得分。如果预测过程中遇到任何错误，`Error_stats.csv`\
  \ 将为用户提供相关信息。\n\n## 在线预测的模型部署\n\n我们将打包成 Docker 镜像进行部署的模型包，包含执行模型所需的所有部分，包括运行环境、ML\
  \ 框架、存储的模型文件和支持的后端微服务。另一方面，端点是计算资源所在的位置，您的模型在那里真正处理预测查询。对于自动扩缩，用户可以选择机器类型和其他因素。\n\
  \n模型必须部署在端点上，才能接受基于它的预测。请按照以下步骤部署模型。\n\n### 步骤 1：模型部署\n\n可以在**部署和测试**下发起模型部署，如图\
