  \n*   使用 `@kfp.dsl.pipeline` 装饰器将此函数定义为 Pipeline。\n*   组件的输入为训练好的模型（及其 Artifacts），将从\
  \ `Input[Artifacts]` 收集。\n\n\n\n\n\n### 函数 `fetch_eval_info`\n\n函数 `fetch_eval_info`\
  \ 将从训练好的模型工件中获取评估数据，这些数据将被传递给 `metrics_log_check` 函数，以检查模型性能是否高于阈值，并返回值为 `true`（如果模型性能优于阈值）或\
  \ `false`（否则）。\n\n```python\nDISPLAY_NAME = 'image_boat_classification'\n\n@kfp.dsl.pipeline(name=\"\
  image-classification\", pipeline_root=pipeline_folder)\ndef pipeline(\n    gcs_source:\
  \ str = \"gs://pipeline_automl/class_labels.csv\",\n    display_name: str = DISPLAY_NAME,\n\
  \    project: str = PROJECT_ID,\n    gcp_region: str = \"us-central1\",\n    api_endpoint:\
  \ str = \"us-central1-aiplatform.googleapis.com\",\n    thresholds_dict_str: str\
  \ = '{\"auPrc\": 0.60}',\n):\n    # 第一个组件\n    dataset_create_op = gcc_aip.ImageDatasetCreateOp(\n\
  \        project=project,\n        display_name=display_name,\n        gcs_source=gcs_source,\n\
  \        import_schema_uri=aiplatform.schema.dataset.ioformat.image.single_label_classification\n\
  \    )\n\n    # 第二个组件\n    training_op = gcc_aip.AutoMLImageTrainingJobRunOp(\n\
  \        project=project,\n        display_name=display_name,\n        prediction_type=\"\
  classification\",\n        budget_milli_node_hours=8000,\n        dataset=dataset_create_op.outputs[\"\
  dataset\"],\n    )\n\n    # 第三个组件\n    model_eval_task = image_classification_model_eval_metrics(\n\
  \        project,\n        gcp_region,\n        api_endpoint,\n        thresholds_dict_str,\n\
  \        training_op.outputs[\"model\"],\n    )\n\n    with dsl.Condition(\n   \
  \     model_eval_task.outputs[\"dep_decision\"] == \"true\",\n        name=\"deploy_decision\"\
  ,\n    ):\n        # 仅当满足条件时执行第四个组件：创建端点\n        endpoint_op = gcc_aip.EndpointCreateOp(\n\
  \            project=project,\n            location=gcp_region,\n            display_name=\"\
  train-automl-vision\",\n        )\n\n        # 管道的第五个组件：将模型部署到创建的端点上。\n        gcc_aip.ModelDeployOp(\n\
  \            model=training_op.outputs[\"model\"],\n            endpoint=endpoint_op.outputs[\"\
  endpoint\"],\n            automatic_resources_min_replica_count=1,\n           \
  \ automatic_resources_max_replica_count=1\n        )\n```\n\n### 步骤 7：使用 Kubeflow\
  \ 编译\n\n运行以下代码以编译管道代码。Kubeflow Pipelines SDK v2 编译器会验证管道中正确的数据类型用法，以及避免将来自参数的输入用作来自工件的输出，反之亦然：\n\
  \n```python\ncompiler.Compiler().compile(pipeline_func=pipeline, package_path=\"\
  image_classif_pipeline.json\")\n```\n\n代码执行后，将创建一个名为 `image_classif_pipeline` 的\
  \ JSON 文件，如 图 6.10 所示：\n\n![](img/Figure_6.10.png)\n\n**图 6.10：** 为自定义模型评估组件创建的\
  \ JSON 文件\n\n1.  打开 JSON 文件：\n\n    ![](img/Figure_6.11.png)\n\n    **图 6.11：**\
  \ JSON 文件内容\n\n该 JSON 将包含有关管道组件、每个组件的参数、运行时配置、参数等的所有详细信息。\n\n除模型评估组件外，所有其他组件都将在\
  \ ML-pipeline 组件上执行。只有模型评估组件将在深度学习包上执行（这在代码中已提及）。\n\n### 步骤 8：创建管道\n\n运行以下代码以创建管道：\n\
  \n```python\nml_pipeline_job = aiplatform.PipelineJob(\n    display_name=\"automl-image-training\"\
  ,\n    template_path=\"image_classif_pipeline.json\",\n    pipeline_root=pipeline_folder,\n\
  \    parameter_values={\"project\": PROJECT_ID, \"display_name\": DISPLAY_NAME},\n\
  \    enable_caching=True\n)\n```\n\n### 步骤 9：提交管道作业\n\n运行以下代码以提交管道作业。代码执行后将提供管道链接，如\
