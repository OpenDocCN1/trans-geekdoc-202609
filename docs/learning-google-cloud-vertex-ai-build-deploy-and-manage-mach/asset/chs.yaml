  \ AI 简介”、“AutoML Tabular”以及“AutoML Image、文本和预建模型”章节）。\n\n`AutoML_image_data_exai`\
  \ 存储桶在 `us-centra1`（单区域）下创建。\n\n上传了三个包含图像数据的文件夹（`Cise_ships`、`Ferry_boat` 和 `Kayak`），并创建了\
