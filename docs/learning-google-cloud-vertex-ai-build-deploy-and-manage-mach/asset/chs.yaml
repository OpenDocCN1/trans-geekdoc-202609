  \n## 提供在线预测\n\n\n\n\n\n模型已部署到 GCP 端点。用户可以在本地机器上使用 Python 从已部署的模型获取预测结果。\n\n通过以下命令安装\
  \ `google-cloud-aiplatform` Python 包：\n\n```\npip install google-cloud-aiplatform\n\
  ```\n\n更多关于该包的信息可从以下链接获取：\n\n<https://pypi.org/project/google-cloud-aiplatform/>\n\
  \n### 用于预测的 Python 代码\n\n```\n### 安装 google-cloud-aiplatform\n\nfrom google.cloud\
  \ import aiplatform\n\nfrom google.protobuf import json_format\n\nfrom google.protobuf.struct_pb2\
  \ import Value\n\nimport os\n\ndef online_pred_tabular(project, model_id, instance_dict,\
  \ location, api_endpoint):\n\n    client_options = {\"api_endpoint\": api_endpoint}\n\
  \n    client = aiplatform.gapic.PredictionServiceClient(client_options=client_options)\n\
  \n    instance = json_format.ParseDict(instance_dict, Value())\n\n    instances\
  \ = [instance]\n\n    parameters_dict = {}\n\n    parameters = json_format.ParseDict(parameters_dict,\
  \ Value())\n\n    endpoint = client.endpoint_path(project=project, location=location,\
  \ endpoint_id=model_id)\n\n    response = client.predict(endpoint=endpoint, instances=instances,\
  \ parameters=parameters)\n\n    predictions = response.predictions\n\n    for prediction\
  \ in predictions:\n        print(\" prediction:\", dict(prediction))\n\n### 用于 GCP\
  \ 认证。提供 json 文件的完整路径\n\nos.environ['GOOGLE_APPLICATION_CREDENTIALS'] = \"\"\n\n\
  project_id = \"vertex-ai-gcp\"  # project_ID 可从 GCP 仪表板获取（参考图 2.35）\n\nmodel_id\
  \ = \"2047967950081622016\"  # Model_ID 参考图 2.29\n\nlocation = \"us-central1\" \
  \ # Location 参考图 2.25\n\napi_endpoint = \"us-central1-aiplatform.googleapis.com\"\
  \n\n### 采用 Json 格式的输入\n\ninputs = {\"BMI\": \"16.6\", \"Smoking\": \"Yes\", \"AlcoholDrinking\"\
  : \"No\", \"Stroke\": \"No\", \"PhysicalHealth\": \"3\", \"MentalHealth\": \"30\"\
  , \"DiffWalking\": \"No\", \"Sex\": \"Female\", \"AgeCategory\": \"55-59\", \"Race\"\
  : \"White\", \"Diabetic\": \"Yes\", \"PhysicalActivity\": \"Yes\", \"GenHealth\"\
  : \"Very good\", \"SleepTime\": \"5\", \"Asthma\": \"Yes\", \"KidneyDisease\": \"\
  No\", \"SkinCancer\": \"Yes\"}\n\n### 调用函数\n\nonline_pred_tabular(project_id, model_id,\
  \ inputs, location, api_endpoint)\n```\n\n### Python 代码的输出\n\nPython 代码的输出可见于图 2.36：\n\
  \n![](img/Figure_2.36.png)\n\n图 2.36：Python 代码输出\n\n输出包含每个类别的概率得分。\n\n注意：存在多种认证方式，代码中使用的是最简单的一种。\n\
  \n`Project_ID` 可从 GCP 仪表板（平台着陆页）获取，如下截图所示：\n\n![](img/Figure_2.37.png)\n\n图 2.37：仪表板中的\
  \ Project_ID\n\n## 模型取消部署与删除端点\n\n在所有模型都从部署中移除之前，无法删除端点。\n\n### 步骤 1：选择端点\n\n已部署的模型将列在端点下，如图\
