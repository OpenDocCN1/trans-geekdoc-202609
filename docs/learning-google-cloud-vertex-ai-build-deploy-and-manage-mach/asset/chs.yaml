  \n# 第 4 章：Vertex AI Workbench 与自定义模型训练\n\n## 简介\n\n在前两章中，我们针对表格、图像和文本数据使用了 AutoML。在本章中，我们将开始处理自定义模型训练。与\
  \ AutoML 不同，自定义模型为数据科学家在训练模型时提供了更大的灵活性。本章从在 Vertex AI 上创建 Workbench 开始，随后提供分步说明来处理自定义模型。\n\
  \n## 结构\n\n本章将讨论以下主题：\n\n*   Vertex AI Workbench\n*   Vertex AI Workbench 的创建与使用\n\
  *   构建自定义模型的数据\n*   `Dockerfile` 的创建\n*   模型构建\n*   镜像创建\n*   将镜像推送到容器注册表\n*   提交自定义模型训练作业\n\
  *   自定义模型训练作业完成\n*   资源删除\n\n## 目标\n\n读完本章后，你将能够创建 Workbench、编写自定义模型训练的 Python 代码、创建\
  \ `Dockerfile`、将镜像推送到容器注册表并启动自定义训练作业。\n\n### Vertex AI Workbench\n\n\n\n\n\n###\
  \ Vertex AI Workbench\n\n借助 Vertex AI Workbench，用户可以在单一开发环境中完成完整的数据科学流程。用户可以利用 Vertex\
  \ AI Workbench 提供的基于笔记本的环境来执行诸如查询和探索数据、开发和训练模型，以及将代码作为流水线的一部分运行等任务。Vertex AI Workbench\
  \ 提供托管笔记本和用户管理的笔记本。\n\n在 Vertex AI Workbench 的托管笔记本选项的帮助下，用户可以构建一个端到端的基于笔记本的生产环境，该选项为了方便用户内置了多种集成。对于需要完全掌控其工作环境的用户，Vertex\
  \ AI Workbench 中提供了用户管理的笔记本选项。\n\n这两种可用的笔记本替代方案均预配置了 `JupyterLab`，并拥有一整套深度学习软件包，包括对\
  \ `TensorFlow` 和 `PyTorch` 框架的支持。用户可以选择使用配备 CPU 或 GPU 的实例。Vertex AI Workbench 提供的笔记本实例现已与\
  \ `GitHub` 交互，允许用户将笔记本与托管在 `GitHub` 上的代码库同步。\n\n如果用户想要使用笔记本进行数据探索、分析或建模，或者想要将笔记本作为端到端数据科学流程的一部分，托管笔记本通常是一个值得考虑的绝佳选项。用户可以使用托管笔记本实例执行面向工作流的操作，而无需离开\
  \ `JupyterLab` 界面。此外，它们还提供了各种连接器和工具，用于实现数据科学流程的自动化。\n\n当用户创建用户管理的笔记本实例时，系统会提示用户对将要使用的虚拟机\
  \ (VM) 进行一些选择。例如，当用户创建用户管理的笔记本实例时，系统会提示用户选择机器类型和将要使用的框架。用户可以在实例创建后更改其机器类型；但这样做需要重启实例。用户可以在正在使用的用户管理的笔记本实例上进行手动更改，例如更改软件和软件包版本。更改实例上使用的框架是一个需要额外工作量的过程。\n\
