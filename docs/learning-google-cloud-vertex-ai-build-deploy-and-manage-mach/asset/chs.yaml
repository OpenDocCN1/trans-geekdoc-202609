  \ 文件）的选项。\n14. 创建 Python 文件（`.py` 文件）的选项。\n15. 显示上下文帮助的选项。\n\n## 构建自定义模型的数据\n\n\
  对于本练习，数据是从 Kaggle 下载的（链接如下），该数据集列在 CC0：公共领域许可下。数据包含数据中心的电力价格及可能影响价格的因素。\n\n[`www.kaggle.com/datasets/salilchoubey/electrity-prices`](https://www.kaggle.com/datasets/salilchoubey/electrity-prices)\n\
  \n`custom_model_ele_prices` 存储桶在 `us-centra1`（单一区域）下创建，并将 `.csv` 文件上传到该存储桶，如 图 4.7\
  \ 所示：\n\n![](img/Figure_4.7.png)\n\n**图 4.7：** CSV 数据上传到 Cloud Storage\n\n自定义模型构建活动分多个步骤完成：\n\
  \n1. 创建 `Dockerfile`。\n2. 构建用于 ML 模型构建的 Python 代码。\n3. 使用 `Dockerfile` 创建 docker\
  \ 并将 Python 代码推送到 docker 中。\n4. 在 Workbench 环境中测试 docker。\n5. 将 docker 推送到注册表。\n\
  6. 使用创建的 docker 提交训练作业。\n\n## 容器和 Docker 简介\n\n容器虚拟化主机操作系统（或内核），并将应用程序的需求与其他容器隔离开来。在容器出现之前，在同一虚拟机上运行许多应用程序有时会产生异常行为，因此“每个虚拟机运行一个应用程序”曾很常见。每个虚拟机运行一个应用程序解决了依赖冲突隔离问题，但会浪费资源（CPU\
  \ 和内存）。虚拟机运行您的程序和一个完整的操作系统，导致您的应用程序可用资源减少。\n\n容器通过使用容器引擎和容器镜像（即应用程序的依赖项）来解决此问题。容器引擎通过在容器中执行应用程序来隔离它们。这消除了为每个应用程序运行单独操作系统的需求，提高了资源利用率并降低了成本。\n\
  \nDocker 于 2013 年发布，通过允许用户快速构建程序的容器镜像，彻底改变了容器技术。Docker 是一款开源虚拟化软件，旨在帮助开发人员。它是一款\
  \ PaaS 软件，可隔离虚拟环境，以部署、创建和测试与当前操作系统不兼容的应用程序。\n\n### Docker 的组件\n\n* **Dockerfile：**\
  \ `Dockerfile` 是每个容器的起点。此文本文件包含构建 Docker 镜像的说明，包括操作系统、语言、环境变量、文件位置、网络端口和其他组件。\n\n\
  \n\n\n*   **Dock image**：Docker 镜像是一种可移植的、只读的可执行文件，提供了构建容器的说明以及将执行哪些软件组件。\n*   **Docker\
  \ run**：Docker 中的 run 运行一个容器。同一镜像的多个实例可以在容器中运行。\n*   **DockerHub**：Docker Hub 是容器镜像的存储库。它是\
  \ Docker 面向容器的 GitHub。\n\n## Dockerfile 的创建\n\nDockerfile 是一个文本文件，由 Docker 从上到下读取。它包含一系列指令，指示\
  \ Docker 如何构建 Docker 镜像。Dockerfile 是创建 Docker 镜像的配方，执行单独的构建命令即可根据该配方生成 Docker 镜像。\n\
  \n在构建 Docker 镜像之前，我们需要启用容器注册表和 Artifact Registry 的 API。请按照以下步骤启用它们。\n\n### 步骤 1：API\
  \ 和服务\n\n平台的所有 API 都可以通过“API 和服务”启用或停用。可以通过导航菜单打开“API 和服务”，如图 4.8 所示：\n\n![](img/Figure_4.8.png)\n\
  \n**图 4.8**：打开平台的 API 和服务\n\n1.  打开导航菜单并选择 **API 和服务**。\n    1.  或者，用户可以在搜索框中搜索\
  \ **API 和服务**。\n2.  点击 **已启用的 API 和服务**。\n\n### 步骤 2：API 和服务的登录页面\n\nAPI 和服务的登录页面如图\
  \ 4.9 所示：\n\n![](img/Figure_4.9.png)\n\n**图 4.9**：GCP 的 API 和服务\n\n1.  在搜索框中搜索 **container\
  \ registry**（容器注册表）。\n\n### 步骤 3：容器注册表搜索结果\n\n容器注册表的搜索结果如图 4.10 所示：\n\n![](img/Figure_4.10.png)\n\
  \n**图 4.10**：API 的搜索结果\n\n1.  右键点击以启用 **Google Container Registry API**。\n2.  右键点击以启用\
  \ **Artifact Registry API**。\n\n### 步骤 4：容器注册表 API 启用\n\n容器注册表是一个中心化位置，团队可在其中维护\
  \ Docker 镜像、执行漏洞分析并实施细粒度的访问控制。按照图 4.11 中的步骤启用容器注册表 API：\n\n![](img/Figure_4.11.png)\n\
  \n**图 4.11**：容器注册表 API\n\n1.  点击 **启用**。\n\n### 步骤 5：Artifact Registry API 启用\n\n\
  Artifact Registry 支持容器镜像和非容器制品。Artifact Registry 增强并扩展了容器注册表的功能，例如客户管理的加密密钥、VPC-SC\
  \ 支持、Pub/Sub 通知，提供了重要的安全性、可扩展性和控制方面的进步等。\n\n按照图 4.12 所示操作以启用 Artifact Registry API：\n\
  \n![](img/Figure_4.12.png)\n\n**图 4.12**：Artifact Registry API\n\n1.  为 Artifact\
  \ Registry API 点击 **启用**。\n\n启用这两个 API 后，返回工作台并启动终端（参考下图，双击 **Terminal**）。\n\n###\
  \ 步骤 6：目录创建\n\n启动终端（参考图 4.6，第 11 点），并按照图 4.13 中描述的步骤在工作台中创建目录：\n\n![](img/Figure_4.13.png)\n\
  \n**图 4.13**：终端中的目录创建\n\n1.  在终端窗口中依次输入以下命令。\n\n    我们创建一个名为 `price_pred` 的新目录，并在\
  \ `price_pred` 目录内创建一个 `Dockerfile`：\n\n    ```\n    mkdir price_pred\n    cd price_pred\n\
  \    touch Dockerfile\n    ```\n\n2.  `Dockerfile` 将在 `price_pred` 文件夹内创建（文件将没有内容；双击文件以打开它）。\n\
  \n### 步骤 7：编辑 Dockerfile\n\n在 `Dockerfile` 中输入命令，如图 4.14 所示：\n\n![](img/Figure_4.14.png)\n\
  \n**图 4.14**：编辑 Dockerfile\n\n1.  输入以下命令：\n\n    ```\n    FROM gcr.io/deeplearning-platform-release/tf2-cpu.2-6\n\
  \    WORKDIR /\n    COPY trainer /trainer\n    ENTRYPOINT [\"python\",\"-m\",\"\
  trainer.train\"]\n    ```\n\n命令说明如下：\n\n*   Docker 镜像将使用 `gcr.io` 中可用的容器镜像构建（详情请参阅图示）。\n\
  *   设置工作目录。\n*   它将把 `trainer` 文件夹复制到工作目录（`trainer` 文件夹尚未在 JupyterLab 中创建；`trainer`\
  \ 文件夹包含用于模型训练的 `train.py` 文件）。\n*   `ENTRYPOINT` 指向容器启动时执行的可执行文件。\n\n保存 `Dockerfile`（`Ctrl`\
  \ + `S`）并关闭文件。\n\nGCP 的容器注册表提供深度学习容器的存储库。深度学习容器是提供数据科学框架、库和工具的 Docker 容器。这些经过性能优化的容器使用户能够快速进行实验和部署流程。它们托管在不同的数据中心。\n\
  \n*   `gcr.io` 在美国数据中心托管镜像；不过，位置可能会有所不同。\n*   `us.gcr.io` 在欧盟地区托管容器镜像。\n*   `eu.gcr.io`\
  \ 在美国地区托管容器镜像。\n*   `asia.gcr.io` 在亚洲地区托管容器镜像。\n\n图 4.15 显示了 `gcr.io` 的存储库：\n\n\
  ![](img/Figure_4.15.png)\n\n**图 4.15**：gcr.io 的容器注册表\n\n## 模型构建\n\n创建 `Dockerfile`\
  \ 后，我们需要着手编写用于模型构建的 Python 代码。任务是构建一个回归模型来预测电价。Python 代码将被复制到容器中并提交为训练作业。\n\n让我们回到工作台的终端，并按照以下步骤创建用于模型构建的\
  \ Python 代码：\n\n### 步骤 1：创建 trainer 文件夹\n\n在终端中输入命令，如图 4.16 所示：\n\n![](img/Figure_4.16.png)\n\
  \n**图 4.16**：终端中的 trainer 文件夹创建\n\n```\nPROJECT_ID=vertex-ai-gcp\nmkdir trainer\n\
  ```\n\n在第一条命令中，一个名为 `PROJECT_ID` 的变量被设置为项目 ID（使用项目 ID，而非项目名称）；我们将在创建 Docker 镜像时使用此命令。在第二行命令中，我们将创建一个名为\
  \ `trainer` 的新文件夹。打开 `trainer` 文件夹。\n\n### 步骤 2：创建 Python 文件\n\n按照图 4.17 中提到的步骤创建\
  \ Python 文件：\n\n![](img/Figure_4.17.png)\n\n**图 4.17**：工作台上的 Python 文件创建\n\n1. \
  \ 点击 **新建启动器**。\n2.  双击 **Python 文件**。\n\n### 步骤 3：Python 代码\n\n一个 Python 文件将在 `trainer`\
  \ 文件夹内创建。在 `.py` 文件中编写如下 Python 代码，如图 4.18 所示：\n\n```python\nimport numpy as np\n\
  import pandas as pd\nimport pathlib\nimport tensorflow as tf\n\n#### Importing tensorflow\
  \ 2.6\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\n\ndef\
  \ main():\n    # Reading data from the gcs bucket\n    dataset = pd.read_csv(r\"\
  gs://custom_model_ele_prices/electricity_prices.csv\", low_memory=False)\n    dataset.tail()\n\
  \    BUCKET = 'gs://custom_model_ele_prices'\n    dataset.isna().sum()\n    dataset\
  \ = dataset.dropna()\n    dataset.drop(['DateTime', 'Holiday'], axis=1, inplace=True)\n\
  \    cols = list(dataset.columns[dataset.dtypes.eq('object')])\n    dataset[cols]\
  \ = dataset[cols].apply(pd.to_numeric, errors='coerce', axis=1)\n    train_dataset\
  \ = dataset.sample(frac=0.8, random_state=0)\n    test_dataset = dataset.drop(train_dataset.index)\n\
  \    train_stats = train_dataset.describe()\n    train_stats.pop(\"SMPEP2\")\n \
  \   train_stats = train_stats.transpose()\n    train_labels = train_dataset.pop('SMPEP2')\n\
  \    test_labels = test_dataset.pop('SMPEP2')\n    normed_train_data = (train_dataset\
  \ - train_dataset.mean()) / train_dataset.std()\n    normed_test_data = (test_dataset\
  \ - train_dataset.mean()) / train_dataset.std()\n\n    def tf_build_model_reg():\n\
  \        # model building function\n        model = keras.Sequential([\n       \
  \     layers.Dense(64, activation='relu', input_shape=[len(train_dataset.keys())]),\n\
  \            layers.Dense(64, activation='relu'),\n            layers.Dense(128,\
  \ activation='relu'),\n            layers.Dense(32, activation='relu'),\n      \
  \  ])\n```\n\n\n\n\n#### 模型训练代码\n\n```python\nlayers.Dense(1)])\n\noptimizer = tf.keras.optimizers.Adagrad(0.001)\n\
  \nmodel.compile(loss='mse', optimizer=optimizer, metrics=['mae', 'mse'])\n\nreturn\
  \ model\n\nmodel = tf_build_model_reg()\n\nepochs = 10\n\nearly_stop = keras.callbacks.EarlyStopping(monitor='val_loss',\
  \ patience=5)\n\nearly_history = model.fit(normed_train_data, train_labels, epochs=epochs,\
  \ validation_split=0.2, callbacks=[early_stop])\n\nmodel.save(BUCKET + '/model')\n\
  \nif __name__ == \"__main__\":\n    main()\n```\n\n![](img/Figure_4.18.png)\n\n\
  Figure 4.18: 模型训练的 Python 代码\n\n1.  输入 Python 代码。\n2.  右键单击并将 Python 文件名重命名为 `train.py`。\n\
  3.  保存 Python 文件 (`Ctrl + S`) 并关闭文件。\n\nPython 代码包含导入所需包的代码。主函数从云存储存储桶读取 `.csv`\
  \ 文件，应用一些数据转换，并拆分数据用于训练和测试。`tf_build_model_reg` 函数包含 TensorFlow 模型的框架（模型将使用 TensorFlow\
  \ 2.6 构建）。最后，训练好的模型将被推送到云存储存储桶。\n\n> **注意：** 我们将 Epochs 设置为 10。请根据您的需求进行增加。\n\n\
  本练习使用的代码并不十分详细，因为它仅用于说明目的。用户可以使用更复杂的代码进行模型训练。\n\n## 镜像创建\n\n现在我们已经完成了用于模型构建的 Dockerfile\
