  2.  选择**部署到端点**。\n\n### 步骤 2：端点定义\n\n端点定义涉及的步骤可见于图 2.25：\n\n![](img/Figure_2.25.png)\n\
  \n**图 2.25：端点创建**\n\n1.  选择**创建新端点**。如果模型需要部署到现有端点，将提供**添加到现有端点**选项。\n2.  为端点提供名称。\n\
  3.  除非用于私有访问，否则访问权限可以是标准的。\n4.  点击**继续**。\n\n### 步骤 3：模型设置\n\n可以选择用于预测的流量分配和硬件，如图\
  \ 2.26 所示：\n\n![](img/Figure_2.26.png)\n\n**图 2.26：部署的模型设置**\n\n1.  如果模型部署在多个端点中，可以在它们之间进行流量分配。如果模型仅部署在一个端点中，则必须设置为\
