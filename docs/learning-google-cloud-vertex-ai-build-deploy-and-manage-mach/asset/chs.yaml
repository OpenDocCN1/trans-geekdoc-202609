  import os\nfrom typing import List\n```\n\n### 步骤 7：从代码理解一些 TFX 组件\n\n在跳入流水线创建和执行之前，让我们尝试了解如何单独使用一些\
  \ TFX 组件并分析这些组件的输出。让我们从数据 `ExampleGen` 组件开始。\n\n#### ExampleGen\n在新单元格中运行以下代码：\n\
  \n```python\ncontext_in = InteractiveContext()\nexample_gen_csv = tfx.components.CsvExampleGen(input_base=INPUT_DATA_DIR)\n\
