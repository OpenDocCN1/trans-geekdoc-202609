  \ 2 章“Vertex AI 和 AutoML 结构简介”中所述删除模型和数据集。\n\n## 用于文本数据的 Vertex AI AutoML\n\n文本\
  \ AutoML 可处理单标签、多标签分类、文本实体提取和文本情感分析任务。对于实际示例，我们使用情感分析数据，可从以下链接下载：\n\n[`www.kaggle.com/datasets/revanthrex/stanford-imdb-sentiment-analysis`](https://www.kaggle.com/datasets/revanthrex/stanford-imdb-sentiment-analysis)\n\
  \n该数据集遵循 CC0：公共领域许可，包含约 25K 条电影评论。评论分为正面和负面评论。\n\n在 `us-centra1`（单一区域）下创建了 `AutoML_text_sentiment_analysis`\
  \ 存储桶，并上传了两个分别包含 50 条正面和负面评论的文件夹。在存储桶中创建了一个名为 `Batch_prediction` 的额外文件夹，其中包含随机选取的文本评论。云存储的快照如\
  \ 图 3.28 所示：\n\n![](img/Figure_3.28.png)\n\n图 3.28：上传至云存储的文本数据\n\n与图像数据集创建非常相似，即使对于情感分析数据集，我们也需要创建一个\
  \ CSV 文件，其中包含有关文本属于训练/验证/测试集的信息、文本的完整路径以及其所属的类别：\n\n```bash\nfor f in $(gsutil ls\
  \ gs://AutoML_text_sentiment_analysis/Positive/); do echo UNASSIGNED,$f,1,1;done>>text_sentiment_label.csv\n\
  \nfor f in $(gsutil ls gs://AutoML_text_sentiment_analysis/Negative/); do echo UNASSIGNED,$f,0,1;done>>text_sentiment_label.csv\n\
  ```\n\n这些命令将创建一个包含三列的 CSV 文件：\n\n*   设置文本文件用于训练/验证/测试。在本例中，我们使用了“UNASSIGNED”，由平台选择用于训练、验证和测试的图像。\n\
  *   文本文件的完整路径。\n*   其所属的类别。\n\n使用以下命令将 CSV 文件推送到云存储存储桶。\n\n```bash\ngsutil cp text_sentiment_label.csv\
  \ gs://AutoML_text_sentiment_analysis/text_sentiment_label.csv\n```\n\n打开命令 Shell\
  \ 并输入 图 3.29 中所示的命令：\n\n![](img/Figure_3.29.png)\n\n图 3.29：CSV 创建的 gs 命令（文本数据）\n\
  \n1.  点击图标以打开 Cloud Shell。\n2.  输入命令（输入一条命令并按 Enter 键）。\n3.  新的 CSV 文件已创建并可在云存储中使用。\n\
  \n创建的 CSV 文件快照如 图 3.30 所示：\n\n![](img/Figure_3.30.png)\n\n图 3.30：创建的 CSV 快照（用于文本数据）\n\
  \nC 列包含值 0 或 1。1 表示正面情感，0 表示负面情感。在 AutoML 的情感分析中，C 列可以是 0 到 10 之间的整数值（最大情感值由用户选择，在本例中\
  \ 1 为最大值）。如果用户想要捕捉更细粒度的情感，例如 10 个层级，用户可以将文档标记为从 0（最负面）到 9（最正面）。\n\n## 文本数据集创建\n\n\
