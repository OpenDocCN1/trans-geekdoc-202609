  \n# 第 2 章：Vertex AI 和 AutoML Tabular 简介\n\n## 简介\n\n在上一章中，我们了解了 Google Cloud Platform。本章介绍\
  \ GCP 的 Vertex AI 组件。Vertex AI 的主要特性以及 Vertex AI 预测的新功能。Vertex AI 的 AutoML 部分及其类型。随后是\
  \ AutoML 表格数据的分步说明。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   Vertex AI 简介\n*   关键特性\n\
  *   Vertex AI 预测服务\n*   使用 Vertex AI\n*   Vertex AI AutoML\n*   表格数据集创建\n*   模型训练\n\
  *   模型评估\n*   批量预测\n*   模型部署以进行在线预测\n*   服务账号创建\n*   提供在线预测服务\n*   模型取消部署和端点删除\n\
  *   模型删除\n*   数据集删除\n\n## 目标\n\n在本章结束时，你将能够为表格数据创建 AutoML 数据集，启动训练，评估模型，并将训练好的模型推向部署，从已部署模型获取预测结果，以及从部署中移除模型。\n\
  \n\n\n\n## Vertex AI 简介\n\nGoogle 于 2021 年中旬宣布推出 Vertex AI。Vertex AI 是一个用于人工智能的集成平台，将\
  \ Google 所有的云服务汇聚在同一个平台之下。利用 Vertex AI 提供的预训练模型和自定义模型构建工具，客户能够构建机器学习模型，或仅部署和扩展此类模型。在\
  \ Vertex AI 上创建机器学习解决方案的用户，可以利用 AutoML 和其他复杂的机器学习组件，显著提升其生产力和可扩展性。此外，Google 非常重视让\
  \ Vertex AI 平台对新手友好、对资深专业人士高效。因此，训练模型变得简单，且所需代码行数比其他方法减少了 80%。Vertex AI 将演变为与 GCP\
  \ 相关的所有 AI 事务的一站式商店。\n\n鉴于所有这些因素，实施 MLOps 现在变得更加简单，也更容易被机器学习团队所采用。这意味着用户无需死记 GCP\
  \ 的架构，即可找到分散在 GCP Console 中的所有 MLOps 工具。\n\n尽管许多 GCP 服务构建于开源框架之上，但它们均由平台全托管；例如，`Vertex\
  \ Pipelines` 构建于 `Kubeflow Pipelines` 和 `TensorFlow Extended` 之上，而 `Vertex Metadata`\
  \ 构建于 `ML Metadata` 之上。Vertex 各组件之间存在高度的交叉通信，这正是其对数据科学团队如此有价值的原因。\n\n## 核心功能\n\n\
  Vertex AI 通过提供视频、视觉等预训练 API，使视频、翻译和自然语言处理与现有应用的集成变得简单。工程师现在能够以最小的工作量和知识要求，训练符合其公司特定需求的定制模型。\n\
  \nVertex AI 提供了全流程的 AI 与数据集成，通过 `Vertex AI Workbench` 原生集成了 `Dataproc`、`Dataflow`\
  \ 和 `BigQuery`。您既可以在 `BigQuery` 中开发和运行机器学习模型，也可以将数据从 `BigQuery` 导出到 `Vertex AI Workbench`\
  \ 并在那里运行 ML 模型。这两种选项均可用。\n\nVertex AI 为所有与 AI 相关的 Google Cloud 服务提供了一个统一的用户界面和 API，将整个机器学习流程汇聚在同一个平台之下。例如，您可以在\
  \ Vertex AI 中利用 `AutoML` 来训练和比较模型，然后将它们全部保存在一个集中式的模型存储库中。\n\nVertex AI 集成了广泛使用的开源框架，如\
  \ `PyTorch` 和 `TensorFlow`。此外，它还通过自定义容器支持替代工具，并与所有开源框架集成。\n\n其他新功能如下：\n\n### 训练缩减服务器\n\
  \n**AI 训练缩减服务器**是 Vertex 的一项新功能。据 Google 称，该程序可提升在 Nvidia GPU 上的多系统分布式训练效率。“分布式训练”是指跨多台计算机、GPU、CPU\
  \ 或专用芯片训练系统的做法，以节省时间和资源。\n\n这缩短了 BERT 等大语言工作负载的训练时间，并使不同方法在成本上达到平价。缩短训练周期后，数据科学家可在部署时间范围内提升模型的预测性能。这对关键任务操作非常有帮助。数据科学家无需具备基础设施工程或运维工程方面的专业知识。\n\
  \n### 表格工作流\n\n**表格工作流**包含一个透明盒和一个受管的 AutoML 流水线，允许用户观察和理解模型的生成与部署。数据科学家现在可以在不损失准确性的情况下，在\
  \ 1 TB 数据集上训练模型。用户可选择将哪些流程环节自动化，哪些进行手动工程化。\n\n表格工作流可集成到 `Vertex AI Pipelines` 中。Google\
  \ 引入了额外的管理算法 `TabNet`、模型特征选择和模型蒸馏，用于高级研究模型。\n\n### 无服务器 Spark\n\n除了与 `Neo4j` 和 `Labelbox`\
  \ 合作外，Google 还推出了**无服务器 Spark**工具，以加快机器学习模型投入生产的部署，并更好地将数据建模能力直接集成到数据科学环境中。这些合作将帮助\
  \ ML 模型开发者处理非结构化、结构化和图数据。这将帮助 Google 加快机器学习模型投入生产的部署。数据科学家将能够在其笔记本上启动无服务器 Spark\
  \ 会话，并使用 Google 无服务器 Spark 以交互方式编写结构化数据代码。\n\n## Vertex AI 预测服务\n\n当用户准备好开始响应来自机器学习模型的请求时，模型即被投入使用。为确保安全性和可扩展性，建立完全无缝的体验至关重要。Vertex\
  \ AI 作为一项全托管服务，具有较低的总拥有成本。由于平滑的自动扩缩容，避免了硬件的过度预配。\n\n开发者可借助 `Prediction Service`（预测服务）以及多种虚拟机和\
  \ GPU 类型，为给定模型选择最具性价比的硬件。与开源方案不同，它还拥有多项专有后端升级，可进一步降低成本。`Stackdriver` 开箱即用的日志记录功能包含用于\
  \ `BigQuery` 中请求-响应日志记录的预构建组件，支持从流水线常规部署模型。\n\n**内置合规性与安全性**：用户可利用自己的安全边界部署模型。您的端点可通过\
  \ GCP 的 `PCSA`（闭包前安全分析）集成控制工具访问，您的数据始终安全。\n\n## 使用 Vertex AI\n\n在对 Vertex AI 及其核心功能有了良好的理论理解后，现在让我们看看\
  \ Vertex AI 在平台上的样子，并进行 AutoML 实操。\n\n请按照以下步骤在平台上打开 Vertex AI：\n\n### 步骤 1\n\n1.\
  \  Vertex AI 位于**人工智能**下。导航至 `Vertex AI` → `Dashboard`（仪表盘）。\n2.  或者，用户可以像图 2.1\
  \ 所示，在搜索框中输入 `Vertex AI`：\n\n    ![](img/Figure_2.1.png)\n\n    **图 2.1**：打开 Vertex\
  \ AI\n\n### 步骤 2：Vertex AI 登陆页\n\nVertex AI 登陆页上的组件可见于图 2.2：\n\n![](img/Figure_2.2.png)\n\
  \n**图 2.2**：Vertex AI 登陆页\n\nVertex AI 登陆页上各组件的简要说明如下：\n\n1.  **Vertex AI 仪表盘**：Vertex\
  \ AI 的登陆页。\n2.  **数据集**：数据集可以是有组织的（结构化），也可以是无组织的（非结构化）。它具有受管元数据，如标注（目前仅支持 `Cloud\
  \ Storage` 和 `BigQuery`）。\n3.  **特征存储**：特征存储将提供一个用于组织、存储和提供 ML 特征的中央存储库。这解决了特征重复开发和高质量特征利用不足的问题。中央存储库明确了谁负责创建、存储和调用特征。特征存储提供高吞吐量的批量请求和低延迟的在线请求。\n\
  4.  **标签**：标记数据将是机器学习开发生命周期的第一阶段。人工标注员将协助完成此标注任务。\n5.  **Workbench**：`Vertex AI\
  \ Workbench` 是整个数据科学流程的单一开发平台。`Vertex AI Workbench` 提供托管笔记本（Google 托管环境，便于运维）和用户托管笔记本（供需要完全控制其环境的用户使用）。\n\
  \n\n\n\n\n# 6. 流水线\n\nVertex AI 流水线通过以无服务器方式协调您的机器学习流程，并利用 Vertex ML Metadata 保留工作流的工件，使您能够自动化、监控和管理您的\
  \ ML 系统。\n\n# 7. 训练\n\nVertex AI 的主要模型训练方法由训练流水线组成。\n\n# 8. 实验\n\n在为某个问题创建模型时，确定哪个模型适合该特定用例至关重要。Vertex\
  \ AI Experiments 赋予您跨多种 ML 框架和训练设置（包括 TensorFlow、PyTorch 和 scikit-learn）监控、分析、比较和搜索的能力。\n\
  \n# 9. 模型\n\nML 模型包含直接加载或通过训练流水线创建的信息。被称为模型的机器学习解决方案充当版本（即模型的实际实现）的容器。\n\n# 10.\
  \ 端点\n\n通过将训练好的模型部署到端点来提供预测服务。根据请求进行消歧，端点可能包含一个或多个模型及其变体。\n\n# 11. 批量预测\n\n对于数据量过大、使用在线预测方法处理时间过长的情况，Vertex\
  \ AI 批量预测提供了一种替代方案。它为异步响应提供了一种高效、无服务器且可扩展的解决方案。用户无需将模型部署到端点，即可从模型资源获取批量预测。\n\n#\
  \ 12. 元数据\n\n您可以查询元数据，以帮助评估、调试和审核机器学习系统的性能及其生成的工件。元数据还允许您记录 ML 系统创建的元数据和工件。\n\n\
  # 13. 匹配引擎\n\nMatching Engine 提供市场上最先进的向量相似度匹配（也称为近似最近邻）服务，以及用于训练语义嵌入以用于相似度匹配用例的市场领先技术。\n\
  \n# 1. 启用 Vertex AI API 以继续工作\n\n本书通过实际示例涵盖了 Vertex AI 的各种实体。我们将从 Vertex AI 的 AutoML\
  \ 开始。\n\n## Vertex AI AutoML\n\n作为一组机器学习解决方案，AutoML 使机器学习经验较少的软件开发者能够训练专门针对其公司需求定制的高质量模型。Google\
  \ 开发的迁移学习和神经架构搜索技术对于该系统的运行至关重要。\n\n此环境是完全托管的，这意味着所有操作程序、基础设施和模型管理都由系统负责。用户可以使用简单的图形用户界面，快速训练、测试和部署机器学习模型，以解决涉及表格数据、视觉、翻译和自然语言的问题。这些任务最快可在几分钟内完成。Vertex\
  \ AI 无疑是目前市场上最全面的自动化机器学习解决方案。\n\n数据集是机器学习生命周期的第一步，要开始您需要数据。Vertex AI 目前支持四种数据类型的托管数据集——表格、图像、文本和视频。下面列出了\
  \ AutoML 针对每种数据类型支持的任务：\n\n*   **表格数据：**\n    *   分类\n    *   回归\n    *   预测\n*\
  \   **图像数据：**\n    *   分类（单标签和多标签）\n    *   图像分割\n    *   图像目标检测\n*   **文本数据：**\n\
  \    *   分类（单标签和多标签）\n    *   文本实体提取\n    *   文本情感分析\n*   **视频数据：**\n    *   动作识别\n\
  \    *   分类\n    *   目标跟踪\n\n### 数据集的优势\n\n*   在中心位置管理您的数据集。\n*   轻松创建标签和其他注释集。\n\
  *   维护迭代开发和治理框架的历史记录。\n*   通过利用相同的数据集训练 AutoML 和自定义模型，让用户能够比较模型性能。\n*   创建数据可视化和统计信息。\n\
  *   自动将数据划分为训练集、测试集和验证集。\n\n让我们从表格数据开始。\n\n## 表格数据集的创建\n\n使用来自 Kaggle 的个人心脏病关键指标数据，这是一个分类任务。数据可从以下链接下载。\n\
  \n[`www.kaggle.com/datasets/kamilpytlak/personal-key-indicators-of-heart-disease`](https://www.kaggle.com/datasets/kamilpytlak/personal-key-indicators-of-heart-disease)\n\
