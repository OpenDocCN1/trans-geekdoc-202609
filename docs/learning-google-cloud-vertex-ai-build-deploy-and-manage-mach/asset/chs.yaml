  \n图 5.31：已部署模型的预测\n\n## 使用 Python SDK 提交训练作业\n\n在前几章涵盖的所有练习中，我们主要在平台的图形用户界面上工作。现在让我们看看如何使用\
  \ Python 代码提交训练作业。\n\n### 步骤 1：在 Jupyter Lab 上创建新的 Python 笔记本\n\n按照以下步骤创建一个新的 Python\
  \ 笔记本文件，如下图所示：\n\n![](img/Figure_5.32.png)\n\n图 5.32：Python 笔记本的创建\n\n遵循对应的要点：\n\
  \n1.  点击新启动器，即 `+` 号。\n2.  点击 Python 笔记本以创建一个。\n\n### 步骤 2：用于启动训练作业的 Python 代码\n\
  \n#### 单元格 1\n\n```bash\n!pip3 install google-cloud-aiplatform --upgrade --user\n\
  ```\n\n```python\nfrom google.cloud import aiplatform\nfrom google.cloud.aiplatform\
  \ import hyperparameter_tuning as hpt\n```\n\n#### 单元格 2\n\n```python\nworker_pool_details\
  \ = [{\n    \"machine_spec\": {\n        \"machine_type\": \"n1-standard-4\"\n \
  \   },\n    \"replica_count\": 1,\n    \"container_spec\": {\n        \"image_url\"\
  : \"gcr.io/vertex-ai-gcp-1/eye:v1\"\n    }\n}]\n\nmetric_spec = {'accuracy': 'maximize'}\
  \  # 待优化的指标\n\n#### 需要优化的超参数\nparameter_spec_list = {\n    \"n_estimators\": hpt.DiscreteParameterSpec(values=[100,\
  \ 125], scale=None),\n    \"max_depth\": hpt.DiscreteParameterSpec(values=[5, 10,\
  \ 15, 20], scale=None),\n    \"min_samples_split\": hpt.DiscreteParameterSpec(values=[5,\
  \ 10], scale=None),\n    \"min_samples_leaf\": hpt.DiscreteParameterSpec(values=[5,\
  \ 10], scale=None),\n    \"max_features\": hpt.CategoricalParameterSpec(values=[\"\
  auto\", \"sqrt\"])\n}\n```\n\n#### 单元格 3\n\n```python\nmy_custom_job = aiplatform.CustomJob(\n\
  \    display_name='eye_classification-sdk-job',\n    worker_pool_specs=worker_pool_details,\n\
