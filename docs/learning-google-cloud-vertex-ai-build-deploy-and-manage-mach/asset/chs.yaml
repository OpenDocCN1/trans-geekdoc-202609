  \n![](img/fm1.png)\n\n# 第 3 章 AutoML 图像、文本和预构建模型\n\n## 简介\n\n在上一章中，我们开始使用 AutoML\
  \ 处理表格数据。本章继续介绍 AutoML 处理图像和文本数据的部分，并提供针对图像和文本数据的分步说明。GCP 还提供预构建模型，本章将简要介绍它们。本章还将简要讨论\
  \ AutoML 的优势和局限性。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   Vertex AI AutoML 处理图像数据\n*\
  \   图像数据集创建\n*   图像模型训练\n*   图像模型评估\n*   图像批量预测\n*   图像在线预测的模型部署\n*   图像在线预测服务\n\
  *   Vertex AI AutoML 处理文本数据\n*   文本数据集创建\n*   文本模型训练\n*   文本模型评估\n*   文本批量预测\n*\
  \   文本在线预测的模型部署\n*   文本在线预测服务\n*   GCP 中的预构建模型\n*   AutoML 的优势\n*   AutoML 的局限性\n\
  \n## 目标\n\n在本章结束时，您将能够为图像和文本数据创建数据集、训练 AutoML 模型、获取批量预测，并部署模型用于在线预测。此外，您还将了解 GCP\
  \ 的预构建模型。\n\n## Vertex AI AutoML 处理图像数据\n\nAutoML 处理图像可执行单标签分类、多标签分类、目标检测和图像分割任务。对于\
  \ AutoML 图像单标签分类的实操练习，我们使用船只分类图像数据，可从以下链接下载：\n\n<https://www.kaggle.com/datasets/imsparsh/dockship-boat-type-classification>\n\
  \n该数据集采用 CC0：公共领域许可，包含属于九个类别的图像。对于我们的练习，我们考虑属于游轮、渡轮和皮划艇的图像（从每个类别中随机选择 50 张图像）。\n\
  \n在 `us-centra1`（单一区域）下创建了 `AutoML_image_data` 存储桶，并上传了包含属于三个类别图像的三个文件夹。在存储桶中创建了一个名为\
  \ `Data_for_batch_pred` 的额外文件夹，其中包含一张随机选择的用于批量预测的图像。云存储的快照如图 3.1 所示：\n\n![](img/Figure_3.1.png)\n\
  \n图 3.1：上传至云存储的图像数据\n\n\n\n\n## AutoML 图像数据工作流\n\n处理 AutoML 图像数据的步骤与 AutoML 表格数据类似，但在创建数据集和模型训练时略有不同。对于表格数据，我们可以直接使用上传到云存储的\
  \ `.csv` 文件创建数据集；但对于图像数据，用户需要创建一个 CSV 文件，其中包含图像所属的训练/验证/测试集信息、图像的完整路径以及其所属的类别。\n\
  \n虽然我们这里只处理属于三个类别的 150 张图像，手动创建包含所需信息的 CSV 很容易。但如果处理大量图像，手动创建 CSV 就不是可行的方案了。不过，在\
  \ Cloud Shell 中运行几行命令就能轻松搞定。\n\n```\nfor f in $(gsutil ls gs://AutoML_image_data/Cruise_ships/);\
  \ do echo UNASSIGNED,$f,Cruise_ships;done>>class_labels.csv\n```\n\n```\nfor f in\
  \ $(gsutil ls gs://AutoML_image_data/Ferry_boat/); do echo UNASSIGNED,$f,Ferry_boat;done>>class_labels.csv\n\
  ```\n\n```\nfor f in $(gsutil ls gs://AutoML_image_data/Kayak/); do echo UNASSIGNED,$f,Kayak;done>>class_labels.csv\n\
  ```\n\n这些命令将创建一个包含三列的 CSV 文件：\n\n*   设置图像用于训练/验证/测试。在本例中我们使用了 `UNASSIGNED`；平台将自动选择用于训练、验证和测试的图像。\n\
  *   图像的完整路径。\n*   图像所属的类别。\n\n使用以下命令将 CSV 文件推送到云存储桶：\n\n```\ngsutil cp class_labels.csv\
  \ gs://AutoML_image_data/class_labels.csv\n```\n\n打开命令 Shell 并输入如图 3.2 所示的命令：\n\n\
  ![](img/Figure_3.2.png)\n\n**图 3.2：** 用于 CSV 创建的 gs 命令（图像数据）\n\n1.  点击图标打开 Cloud\
  \ Shell。\n2.  输入命令（输入一条命令后按回车键）。\n3.  新的 CSV 文件已创建并可在云存储中使用。\n\n创建的 CSV 文件快照如图 3.3\
  \ 所示：\n\n![](img/Figure_3.3.png)\n\n**图 3.3：** 创建的 CSV 快照（图像数据）\n\n## 图像数据集创建\n\n\
  只有创建数据集后，才能启动 AutoML 模型训练。请按照以下步骤创建用于图像分类的图像数据集：\n\n### 步骤 1：创建数据集\n\n导航至 Vertex\
  \ AI 的数据集模块，如图 3.4 所示：\n\n![](img/Figure_3.4.png)\n\n**图 3.4：** 数据集着陆页\n\n1.  点击**创建**。\n\
  \n### 步骤 2：选择目标\n\n数据集创建标签页将出现，如图 3.5 所示：\n\n![](img/Figure_3.5.png)\n\n**图 3.5：**\
  \ 图像数据集选择\n\n1.  选择**图像**标签页。\n2.  选择**图像分类（单标签）**。\n3.  为数据集提供名称。\n4.  点击**创建**。\n\
