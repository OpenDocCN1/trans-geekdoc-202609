  \n# 第 10 章：可解释 AI\n\n## 简介\n\n本书的最后一章涵盖了可解释 AI。我们将首先了解什么是可解释 AI、它的必要性、可解释 AI 在 Vertex\
  \ AI 上如何工作（针对图像和表格数据），以及如何从已部署的模型获取解释。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   什么是可解释\
  \ AI\n*   可解释 AI 的必要性\n*   Vertex AI 上的 XAI\n*   可解释 AI 练习的数据\n*   图像数据的模型训练\n*\
  \   图像分类模型部署\n*   图像分类的解释\n*   表格分类模型部署\n*   表格数据的解释\n*   资源删除\n*   可解释 AI 的局限性\n\
  \n## 目标\n\n读完本章后，您将对可解释 AI 有很好的了解，并知道如何在 Vertex AI 中从已部署的模型获取解释。\n\n## 什么是可解释 AI\n\
  \n可解释 AI (XAI) 是人工智能 (AI) 的一个子领域，专注于开发方法和策略，以一种让 AI 解决方案的结果对人类专家可理解的方式来使用 AI。XAI\
  \ 的使命是确保 AI 系统不仅对其执行的功能，而且对其服务的目的保持公开和诚实。可解释性是 AI 下更广泛的统称，其中包含可解释 AI 作为其子类别之一。得益于模型的可解释性，用户可以掌握模型正在学习什么、它必须提供哪些额外信息，以及关于我们试图解决的现实世界中存在的问题的判断背后的推理。\n\
  \n可解释 AI 是定义对 AI 系统信任的核心理念之一（与问责制、可复现性、无机器偏见和弹性并列）。数据科学家和机器学习技术人员共同的目标和雄心是开发可解释的\
  \ AI。\n\n## 可解释 AI 的必要性\n\n人工智能具有自动化判断的能力，此类决策的结果可能对企业产生积极和消极的双重影响。了解 AI 如何得出结论至关重要，正如了解招聘决策如何为企业做出一样重要。许多公司有兴趣使用\
  \ AI，但由于尚不信任模型，因此不愿将决策权移交给模型或 AI。在这方面，可解释性很有帮助，因为它提供了对模型决策过程的洞察。可解释 AI 是将伦理应用于商业\
  \ AI 使用过程中的关键组成部分。可解释 AI 基于这样一个概念：基于 AI 的应用程序和技术不应是普通人无法理解的不透明“黑箱”模型。图 10.1 展示了\
  \ AI 和可解释 AI 之间的区别：\n\n![Figure 10.1: Explainable AI](img/Figure_10.1.png)\n\n在大多数场景中，开发复杂模型比说服利益相关者相信模型能够产生优于人类的决策要容易得多。做出更好的判断并不等同于拥有更高的准确率分数或更低的\
  \ RMSE。通过提供准确的数据作为输入，可以得出正确的结论。在许多情况下，做决定的人需要理解这个决定。为了让他们放心地将决策权移交给模型，他们需要了解模型是如何得出结论的。\n\
  \n可解释 AI 对于负责任 AI 的开发至关重要，因为它为复杂 AI 系统做出的选择提供了足够的透明度和问责制。当人工智能系统对人们的生活产生重大影响时，这一点至关重要。\n\
  \n### Vertex AI 上的 XAI\n\nVertex AI 的可解释 AI 提供基于特征或基于示例的解释，以便更好地理解模型如何做决策。任何构建或使用机器学习的人，如果了解模型的行为方式及其受训练数据集的影响，都将获得新的能力。这些新能力将使用户能够改进模型、增加对预测的信心，并了解事物何时以及为何起作用。\n\
  \n### 基于示例的解释\n\n在基于示例的解释中，Vertex AI 使用最近邻搜索来生成一个与输入最相似的实例列表（通常取自训练集）。这些示例允许用户调查和阐明模型的行为，因为用户可以合理地预期相似的输入会产生相似的预测。\n\
  \n考虑以下场景：用户有一个分析照片以判断其描绘的是鸟类还是飞机的模型；然而，该模型错误地将某些鸟类识别为飞机。为了弄清楚发生了什么，我们可以从训练集中提取其他与我们正在查看的照片相似的照片，并利用基于示例的解释来说明正在发生的事情。当我们查看那些实例时，我们发现许多被错误识别的鸟类以及与它们相似的训练示例都是深色剪影，并且训练集中发现的大多数深色剪影飞机都是飞机。这表明用户可以通过在训练集中加入更多深色剪影鸟类来潜在地提高模型质量。\n\
  \n\n\n\n基于示例的解释也可能有助于识别令人困惑的输入，这些输入可能通过人工标注得到改进。支持为输入变量提供嵌入或潜在表示的模型。对于输入不提供嵌入的基于树的模型，不支持基于示例的解释。\n\
  \n### 基于特征的解释\n\n基于特征的解释是基于特征解释模型输出的另一种方式。特征归因显示了模型中每个特征对特定实例预测的贡献程度。当用户发出预测请求时，他们将获得适合所用模型的预期值。当用户请求解释时，将提供特征归因信息。\n\
  \n特征归因适用于图像和表格数据。它们支持 AutoML 和自定义训练模型（图像数据仅限分类模型，表格数据支持分类/回归模型）。\n\n### 特征归因方法\n\
  \n每种特征归因方法都基于 Shapley 值，这是一种源自合作博弈论的算法，它将给定结果的功劳分配给游戏中的每个参与者。将此概念应用于机器学习模型时，意味着将每个模型特征视为游戏中的“玩家”。Vertex\
  \ Explainable AI 根据每个特征在整体预测中的权重，给予每个单独特征一定的信用：\n\n*   **Sampled Shapley 方法**：Sampled\
  \ Shapley 技术通过采样提供实际 Shapley 值的估计。使用 AutoML 创建的表格模型使用 Sampled Shapley 方法来确定特征相关性。对于这些作为树和神经网络结构的元集成的模型，Sampled\
  \ Shapley 方法表现得相当好。\n\n*   **Integrated gradients 方法**：Integrated gradients 方法沿积分路径计算预测输出关于输入特征的梯度，以获得准确结果。梯度计算在缩放参数的不同时间间隔进行。利用高斯求积规则可以计算每个间隔的大小（处理图像数据时，可将此缩放选项视为将图像所有像素设置为黑色值的“滑块”）。梯度的积分按如下方式完成：\n\
  \    *   可通过加权平均找到积分的近似值。\n    *   计算原始输入与平均梯度的逐元素乘积。\n\n*   **XRAI 方法**：XRAI 方法结合\
  \ Integrated gradients 方法和一些额外阶段，以发现对特定类别预测贡献最大的图片部分。\n    *   **像素级归因**：XRAI 可对输入图片进行像素级归因。在此阶段，XRAI\
  \ 将 Integrated gradients 方法同时应用于黑色和白色基线。\n    *   **过度分割**：XRAI 通过过度分割在图片上生成微小补丁，这独立于像素级归因。为了构建图片片段，XRAI\
  \ 利用 Felzenswalb 基于图的技术。\n    *   **区域选择**：XRAI 汇总每个片段内包含的像素级归因，以计算该片段的归因密度。XRAI\
  \ 根据这些值对每个片段进行排名，并将片段从最正面到最不正面排列。这确定了图片中哪些部分对特定类别预测贡献最强，以及图像中哪些部分最显著。\n\n所有类型的模型都支持基于特征的解释。AutoML\
  \ 图像支持分类模型，AutoML 表格模型支持分类和回归模型。\n\n## Explainable AI 练习数据\n\n在本练习中，我们将尝试理解如何使用\
