  \ 3** 笔记本文件以创建一个。\n\n### 步骤 2：安装软件包\n\n运行以下命令安装 Google Cloud AI Platform 软件包。（安装软件包需要几分钟）：\n\
  \n```bash\nUSER=\"--user\"\n!pip install {USER} google-cloud-aiplatform\n```\n\n\
  ### 步骤 3：重启内核\n\n在下一个单元格中输入以下命令以重启内核（用户也可以通过 GUI 重启内核）：\n\n```python\nimport os\n\
  import IPython\n\nif not os.getenv(\"\"):\n    IPython.Application.instance().kernel.do_shutdown(True)\n\
  ```\n\n### 步骤 4：导入已安装的软件包\n\n在新单元格中运行以下代码以导入所需软件包：\n\n```python\nimport google.cloud.aiplatform_v1\n\
  from google.cloud.aiplatform_v1.types import featurestore_service as fs_s\nfrom\
  \ google.cloud.aiplatform_v1.types import featurestore as fs\nfrom google.cloud.aiplatform_v1.types\
  \ import feature\nfrom google.cloud.aiplatform_v1.types import entity_type\nfrom\
  \ google.cloud.aiplatform_v1.types import io\nfrom google.protobuf.timestamp_pb2\
  \ import Timestamp\nfrom google.cloud.aiplatform_v1.types.featurestore_service import\
  \ ImportFeatureValuesRequest\nfrom google.cloud.aiplatform_v1.types import FeatureSelector,\
  \ IdMatcher\nfrom google.cloud.aiplatform_v1.types import featurestore_online_service\n\
  import datetime\n```\n\n### 步骤 5：设置项目和其他变量\n\n在新单元格中运行以下代码行以将项目设置为当前项目，并定义变量以存储用于多种用途的路径：\n\
  \n```python\nProject_id = \"vertex-ai-gcp-1\"\nfeaturestore_name = \"employee_fs_pysdk\"\
  \nEntity_name = \"emp_entity_pysdk\"\nlocation = \"us-central1\"\nendpoint = \"\
  us-central1-aiplatform.googleapis.com\"\n```\n\n### 步骤 6：连接到特征存储\n\n连接到特征存储是操作特征存储的第一步。我们通过服务客户端创建到特征存储的连接，以使用\
  \ `FeaturestoreServiceClient` 创建并导入值。\n\n`FeaturestoreOnlineServingServiceClient`\
  \ 用于从特征存储获取特征值。运行以下代码行以完成连接：\n\n```python\nclient_admin = google.cloud.aiplatform_v1.FeaturestoreServiceClient(client_options={\"\
  api_endpoint\": endpoint})\nclient_data = google.cloud.aiplatform_v1.FeaturestoreOnlineServingServiceClient(client_options={\"\
  api_endpoint\": endpoint})\nfs_resource_path = client_admin.common_location_path(Project_id,\
  \ location)\n```\n\n### 步骤 7：创建特征存储\n\n\n\n\n## 特征存储的创建与管理\n\n我们将创建一个新的特征存储，而不是使用通过\
  \ GUI 方法创建的特征存储。特征存储的名称、位置和项目信息已在步骤 5（设置项目和其他变量）中定义。运行以下代码以创建特征存储。特征存储的状态将显示在结果中，如\
  \ 图 9.18 所示。特征存储的创建过程是一项长时间运行的操作；它们是异步作业。除 PI 调用（如更新或删除特征存储）遵循相同的过程外。\n\n```python\n\
  create_fs = client_admin.create_featurestore(\n    fs_s.CreateFeaturestoreRequest(\n\
  \        parent=fs_resource_path,\n        featurestore_id=featurestore_name,\n\
  \        featurestore=fs.Featurestore(\n            online_serving_config=fs.Featurestore.OnlineServingConfig(\n\
  \                fixed_node_count=1\n            ),\n        ),\n    )\n)\n\nprint(create_fs.result())\n\
  \nclient_admin.get_featurestore(name=client_admin.featurestore_path(Project_id,\
  \ location, featurestore_name))\n```\n\n![](img/Figure_9.18.png)\n\n**图 9.18：**\
  \ 使用 Python 创建特征存储\n\n### 步骤 8：实体类型的创建\n\n实体类型将在新创建的特征存储下使用 `create_entity_type`\
  \ 方法创建。在新单元格中运行以下代码以创建实体类型。代码最后一行的输出提供了所创建实体类型的路径。查看特征存储登录页面；新创建的特征存储和实体类型将显示出来：\n\
  \n```python\nentity_creation = client_admin.create_entity_type(\n    fs_s.CreateEntityTypeRequest(\n\
  \        parent=client_admin.featurestore_path(Project_id, location, featurestore_name),\n\
