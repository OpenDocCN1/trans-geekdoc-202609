  \n# 第 5 章：Vertex AI 自定义模型超参数与部署\n\n## 简介\n\n在上一章中，我们开始使用 Vertex AI 组件在 Google Cloud\
  \ Platform (GCP) 上进行自定义模型构建。在本章中，我们将了解如何创建带有超参数调优的自定义作业，以及如何使用 Python 代码启动训练作业。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   机器学习中的超参数\n*   超参数调优的工作原理\n*   Vertex AI Vizier\n\
  *   用于构建自定义模型的数据\n*   Workbench 的创建\n*   `Dockerfile` 的创建\n*   模型构建代码\n*   镜像创建\n\
  *   提交自定义模型训练作业\n*   自定义模型训练作业的完成\n*   模型导入\n*   模型部署与预测\n*   使用 Python SDK 提交训练作业\n\
  *   资源的删除\n\n## 目标\n\n在本章结束时，用户将能够使用图形用户界面 (GUI) 和 Python SDK 创建带有超参数调优的自定义作业。\n\
  \n## 机器学习中的超参数\n\n超参数的值控制学习过程，同时也决定了学习算法最终学到的模型参数的值。学习过程及其产生的模型参数均受超参数（即高层参数）控制。\n\
  \n在机器学习模型训练甚至开始之前，数据科学家必须首先选择并配置学习算法将使用的超参数值。这是作为机器学习模型训练过程一部分完成的。在此背景下，超参数被认为存在于模型之外，因为模型的值在学习或训练过程中无法被改变。\n\
  \n学习算法在学习过程中使用超参数，但它们不包含在作为学习结果产生的模型中。在学习过程结束时，我们将拥有训练好的模型参数，从实际意义上讲，这就是我们谈论模型时所指的内容。模型不包含整个训练过程中调整的超参数。我们只知道学到的模型参数；例如，我们无法仅根据模型本身确定训练该模型所使用的超参数值。\n\
  \n超参数的示例包括 `learning rate`（学习率）、神经网络中的 `number of hidden layers`（隐藏层数量），以及树基算法的\
  \ `n_estimators`、`max depth` 和 `max features`。\n\n另一方面，参数是特定于模型的。当算法尝试将输入特征映射到标签或目标时，它们仅从训练数据中学习或推断得出。\n\
  \n模型训练从初始化参数开始（随机值或设为零）。在训练/学习期间，优化算法更新初始值（例如 `gradient descent`，梯度下降）。随着学习的进行，学习算法更新参数值，但不更新超参数。\n\
  \n参数的示例包括神经网络的 `weights`（权重）和 `biases`（偏置），以及聚类中的 `cluster centroids`（聚类中心）。\n\n\
  ## 超参数调优的工作原理\n\n超参数调优的工作方式是：在您定义的范围内，使用不同的超参数值多次运行您的训练应用。Vertex AI 会记住之前试验的结果，并利用这些信息来提高新试验的性能。任务完成后，用户将获得所有试验的摘要以及基于您设定的标准得出的最佳值配置。\n\
  \n要调优超参数，Vertex AI 必须与训练程序直接联系。训练应用指定模型所需的所有信息。用户需要提供优化过程中需考虑的所有超参数，以及希望优化的结果指标，如\
  \ `accuracy`（准确率）、`r2score` 等。\n\n名为 `cloudml-hypertune` 的 Python 包有助于将指标传递给 Vertex\
  \ AI。有关 `cloudml-hypertune` 包的更多信息，请访问以下链接：\n\n[`pypi.org/project/cloudml-hypertune/`](https://pypi.org/project/cloudml-hypertune/)\n\
  \n### Vertex AI Vizier\n\n您可以借助 Vertex AI Vizier（一种黑盒优化工具）来微调复杂机器学习模型中的超参数。当 ML\
  \ 模型包含多个不同的超参数时，手动调整它们可能既具挑战性又耗时。Vertex AI Vizier 通过调整超参数来最大化模型的输出。\n\n用户需要为 Vizier\
  \ 提供研究配置，以优化机器学习模型。研究配置包括需要优化的指标（如 `accuracy`、`r2 score` 等）和将影响指标的 AI 超参数。\n\n\n\
  \n\n\n### 学习配置与试验\n\n学习配置实现后即称为学习。试验采用学习的目标（指标）和输入值（超参数或参数）。试验是一组输入的集合，可产生称为测量值的可量化输出。学习将持续到达到特定数量的试验或被停止。重要的是，Vertex\
  \ AI Vizier 提出试验输入，但不运行它们。\n\n[自定义训练的超参数调优](https://cloud.google.com/vertex-ai/docs/training/hyperparameter-tuning-overview)是一项内置功能，它使用\
  \ Vertex AI Vizier 进行训练作业。\n\n## 构建自定义模型的数据\n\n在本练习中，数据从 Kaggle 下载（链接在下文提供），数据集列在\
  \ CC0：公共领域许可证下。数据包含来自 EEG 的各种测量值，眼睛状态通过摄像头捕获。`1` 表示闭眼，`0` 表示睁眼。\n\n[`www.kaggle.com/datasets/robikscube/eye-state-classification-eeg-dataset`](https://www.kaggle.com/datasets/robikscube/eye-state-classification-eeg-dataset)\n\
  \n`hpo_vertex-ai` 存储桶在 `us-central1`（单一区域）下创建，`.CSV` 文件上传到存储桶中，如图 5.1 所示：\n\n![](img/Figure_5.1.png)\n\
  \n图 5.1：数据上传至云存储\n\n带有超参数调优活动的自定义模型构建分多个步骤完成（与上一章的练习非常相似，只是增加了几个额外步骤）。我们将使用 Sklearn\
  \ 包开发随机森林分类器。\n\n## Workbench 的创建\n\n按照上一章中 Workbench 创建的步骤操作，但在创建时不选择 TensorFlow\
  \ Enterprise 机器，而是选择 Python3 机器。\n\n### 步骤 1：Workbench 的登录页面\n\nWorkbench 的登录页面如图\
  \ 5.2 所示：\n\n![](img/Figure_5.2.png)\n\n图 5.2：Workbench 的创建\n\n现在遵循以下要点：\n\n1. 点击\
  \ **New Notebook**（新建笔记本）。\n2. 选择 **Python 3**。\n3. 在下一个弹出窗口中，为 Workbench 提供名称，选择区域为\
  \ `us-central1`，然后点击 **Create**（创建）。\n\n### 步骤 2：笔记本创建完成\n\n完成笔记本和 JupyterLab 实例的创建需要几分钟。加载完成后，我们将看到图\
  \ 5.3 所示的屏幕。\n\n1. 点击 **OPEN JUPYTERLAB**：\n\n    ![](img/Figure_5.3.png)\n\n  \
  \  图 5.3：Workbench 成功创建\n\n## Dockerfile 的创建\n\n启动终端（参阅上一章图 4.6，第 11 点）。\n\n###\
  \ 步骤 1：目录创建\n\n图 5.4 展示了在 Workbench 中创建目录：\n\n![](img/Figure_5.4.png)\n\n图 5.4：终端中的目录创建\n\
  \n遵循以下要点：\n\n1. 在终端窗口中依次输入以下命令。我们创建一个名为 `eye` 的新目录，并在 `eye` 目录内创建 `Dockerfile`：\n\
  \n```\nmkdir eye\ncd eye\ntouch Dockerfile\n```\n\n2. `Dockerfile` 将在 `eye` 文件夹内创建。该文件将没有内容；双击文件以打开它。\n\
  \n### 步骤 2：编辑 Dockerfile\n\n要编辑 `Dockerfile`，请遵循以下步骤：\n\n1. 在 `Dockerfile` 中输入以下命令，如图\
  \ 5.5 所示：\n\n```\nFROM gcr.io/deeplearning-platform-release/sklearn-cpu\nWORKDIR\
  \ /\nRUN pip install cloudml-hypertune\nCOPY trainer /trainer\nENTRYPOINT [\"python\"\
  ,\"-m\",\"trainer.task\"]\n```\n\n![](img/Figure_5.5.png)\n\n图 5.5：编辑 Dockerfile\n\
  \n2. `cloudml-hypertune` 包不可用，因此在创建 Docker 镜像时需要安装它；前面代码的第 3 行在创建时安装该包。\n3. 保存 `Dockerfile`\
  \ 并关闭文件。\n\n## 模型构建代码\n\n创建 `Dockerfile` 后，我们需要编写用于模型构建的 Python 代码。任务是构建一个分类模型。Python\
  \ 代码将被复制到容器中并提交为训练作业。\n\n让我们回到 Workbench 的终端，按照给定步骤创建用于模型构建的 Python 代码。\n\n### 步骤\
  \ 1：创建 Trainer 文件夹\n\n1. 在终端中输入命令，如图 5.6 所示：\n\n    ![](img/Figure_5.6.png)\n\n\
  \    图 5.6：终端中的 Trainer 文件夹创建\n\n2. 然后在终端中输入以下命令以创建目录：\n\n```\nmkdir trainer\n```\n\
  \n该命令将创建一个名为 `Trainer` 的新文件夹。打开此文件夹。\n\n### 步骤 2：创建 Python 文件\n\n遵循给定步骤并参考图 5.7\
  \ 创建 Python 文件（在 `trainer` 文件夹内创建 Python 文件）：\n\n1. 点击 **New launcher**（新建启动器），即\
  \ `+` 按钮。\n2. 双击 **Python file**（Python 文件）。\n\n    ![](img/Figure_5.7.png)\n\n\
  \    图 5.7：Workbench 上为模型构建创建 Python 文件\n\n### 步骤 3：Python 代码\n\n一个 Python 文件将在\
  \ `trainer` 文件夹内创建。在 py 文件中编写以下给定的 Python 代码：\n\n```python\nimport pandas as pd\n\
  import numpy as np\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.metrics import accuracy_score\nimport pathlib\n\
  import pickle\nimport argparse\nimport hypertune\nimport sklearn\nfrom google.cloud\
  \ import storage\nimport datetime\n\ndef get_args():\n    # Parses args function,\
  \ include hyperparameters which needs to be tuned.\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument('--n_estimators', required=True, type=int, help='n_estimators')\n\
  \    parser.add_argument('--max_depth', required=True, type=int, help='max_depth')\n\
  \    parser.add_argument('--min_samples_split', required=True, type=int, help='min_samples_split')\n\
  \    parser.add_argument('--min_samples_leaf', required=True, type=int, help='min_samples_leaf')\n\
  \    parser.add_argument('--max_features', required=True, type=str, help='max_features')\n\
  \    args = parser.parse_args()\n    return args\n\ndef preprocess_data():\n   \
  \ # To read the csv from the cloud storage, and standardize\n    data = pd.read_csv(\"\
  gs://hpo_vertex-ai/EEG_Eye_State_Classification.csv\")\n    X = data.drop(['eyeDetection'],\
  \ axis=1)\n    y = data['eyeDetection']\n    for column in X.columns:\n        X[column]\
  \ = X[column] / X[column].abs().max()\n    training, testing, training_labels, testing_labels\
  \ = train_test_split(X, y, test_size=.25, random_state=42)\n    return training,\
  \ testing, training_labels, testing_labels\n\ndef main():\n    args = get_args()\n\
  \    training, testing, training_labels, testing_labels = preprocess_data()\n  \
  \  model_classifier = RandomForestClassifier(\n        n_estimators=args.n_estimators,\n\
  \        max_depth=args.max_depth,\n        min_samples_split=args.min_samples_split,\n\
  \        min_samples_leaf=args.min_samples_leaf,\n        max_features=args.max_features\n\
  \    )\n    model_classifier.fit(training, training_labels)\n    y_pred = model_classifier.predict(testing)\n\
  \    acc = accuracy_score(testing_labels, y_pred)\n    hpt = hypertune.HyperTune()\n\
  \    hpt.report_hyperparameter_tuning_metric(\n        hyperparameter_metric_tag='accuracy',\n\
  \        metric_value=acc\n    )\n    artifact_filename = \"model.pkl\"\n    pickle.dump(model_classifier,\
  \ open(artifact_filename, \"wb\"))\n    BUCKET = 'hpo_vertex-ai'\n    gcs = storage.Client(project=\"\
  Vertex-ai\")\n    buck = gcs.bucket(BUCKET)\n    blob = buck.blob(artifact_filename)\n\
  \    blob.upload_from_filename(artifact_filename)\n\nif __name__ == \"__main__\"\
  :\n    main()\n```\n\n参考以下图 5.8：\n\n![](img/Figure_5.8.png)\n\n图 5.8：模型构建的 Python\
  \ 代码\n\n遵循以下要点：\n\n1. 输入 Python 代码。\n2. 右键点击并将 Python 文件名重命名为 `task.py`。\n3. 保存\
  \ Python 文件并关闭文件。\n\n\n\n\n\nPython 代码由导入所需包的代码组成。函数 `get_args` 包含需要调优的超参数，超参数将作为参数传递。在本练习中，我们考虑五个用于调优的超参数；它们是：\n\
  \n*   `n_estimator`\n*   `max_depth`\n*   `min_samples_split`\n*   `min_samples_leaf`\n\
  *   `max_features`\n\n`max_features` 接受字符串值作为输入，而所有其他超参数接受整数值。\n\n函数 `preprocess_data`\
  \ 读取文件，应用基本转换，并返回拆分后的数据。主函数构建模型，启动模型的超参数调优，并将模型保存到云存储。\n\n镜像创建\n\n现在我们已经完成了用于模型构建的\
  \ Dockerfile 和 Python 代码的创建，可以继续进行镜像创建。请按照给定的步骤操作。\n\n### 步骤 1：使用 docker build 创建镜像\n\
