  \ 3.26 所示：\n\n![](img/Figure_3.26.png)\n\n**Figure 3.26: Testing online prediction\
  \ for image classification model**\n\nServing online predictions image\n\n模型已部署到\
  \ GCP 端点。用户可以使用 Python 本地机器从已部署的模型获取预测。使用上一章中创建的相同服务账号和密钥。\n\n通过以下命令安装 `google-cloud-aiplatform`\
  \ Python 包：\n\n```\npip install google-cloud-aiplatform\n```\n\n更多关于该包的信息可从以下链接获取：\n\
  \n<https://pypi.org/project/google-cloud-aiplatform/>\n\n### 用于预测的 Python 代码\n\n\
  ```python\n### Install google-cloud-aiplatform\nimport base64\nfrom google.cloud\
  \ import aiplatform\nfrom google.cloud.aiplatform.gapic.schema import predict\n\
  import os\n\nos.environ['GOOGLE_APPLICATION_CREDENTIALS'] = r\"E:\\service_account_json\\\
  vertex-ai-gcp-0a71505b3eae.json\"\n\nproject_ID = \"vertex-ai-gcp\"\nmodel_ID =\
  \ \"4810468924636266496\"\nfilename = r\"E:\\Publication\\CHAPTERS\\CHAPTER 3\\\
  DATA\\Batch Pred\\FB.jpg\"\nlocation = \"us-central1\"\napi_endpoint = \"us-central1-aiplatform.googleapis.com\"\
  \n\ndef predict_image_classification(\n    project_ID=project_ID,\n    model_ID=model_ID,\n\
  \    filename=filename,\n    location=location,\n    api_endpoint=api_endpoint):\n\
  \n    client_options = {\"api_endpoint\": api_endpoint}\n    client = aiplatform.gapic.PredictionServiceClient(client_options=client_options)\n\
  \n    with open(filename, \"rb\") as f:\n        file_content = f.read()\n\n   \
  \ content_encoded = base64.b64encode(file_content).decode(\"utf-8\")\n    instance\
  \ = predict.instance.ImageClassificationPredictionInstance(content=content_encoded).to_value()\n\
  \    instances = [instance]\n    params = predict.params.ImageClassificationPredictionParams(confidence_threshold=0.5,\
  \ max_predictions=1).to_value()\n    endpoint = client.endpoint_path(project=project_ID,\
  \ location=location, endpoint=model_ID)\n```\n\n\n\n\n\n```python\nresponse = client.predict(endpoint=endpoint,\
  \ instances=instances, parameters=params)\n\npredictions = response.predictions\n\
  \nfor prediction in predictions:\n    print(\"prediction:\", dict(prediction))\n\
  ```\n\n### 调用函数\n\n```python\npredict_image_classification(project_ID, model_ID,\
  \ filename, location, api_endpoint)\n```\n\nPython 代码的输出：\n\n输出可在 图 3.27 中查看：\n\n\
