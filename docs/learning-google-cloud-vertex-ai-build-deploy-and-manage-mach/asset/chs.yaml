  \n## 前言\n\n在当今世界，数据爱好者需要具备一项或多项云平台的专业知识。在云端通过数据解决业务问题，不仅需要全面理解算法，还需要全面了解云平台及其组件。\n\
  \n本书旨在通过实际案例帮助您理解 `Google Cloud Platform (GCP)` 的 `Vertex AI` 组件。在深入探讨 `Vertex AI`\
  \ 之前，本书将让您对 Google Cloud Platform 及其组件有一定了解，以及 `Vertex AI` 的定位。本书所有示例的模型训练数据均上传至\
  \ `google cloud storage (GCS)` 或 `big query`，因此我们将从 `GCS`、`big query` 以及 `Identity\
  \ access and management (IAM)`（身份与访问管理）开始介绍。`Vertex AI` 拥有众多组件，涵盖数据集、`Workbench`、`Pipelines`、训练、实验、模型、端点和特征等。本书的主要目标是通过实际用例学习这些\
