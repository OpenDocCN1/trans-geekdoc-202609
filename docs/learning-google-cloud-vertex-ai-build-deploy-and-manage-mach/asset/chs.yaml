  \n我们衡量模型预测质量的方法称为模型评估。为此，AutoML 会在数据集的测试拆分上评估训练模型的性能，10% 的训练数据将用于评估（参考图 2.13）。\n\
  \n### 步骤 1：检查模型训练\n\n训练状态可在图 2.17 中查看：\n\n![](img/Figure_2.17.png)\n\n**图 2.17：训练完成**\n\
  \n1.  模型训练完成后，将以绿色勾号高亮显示。\n2.  模型训练也将列在 Vertex AI 的训练部分中（点击它）。\n\n### 步骤 2：模型训练结果\n\
