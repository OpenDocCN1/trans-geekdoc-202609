  \n## 提供在线预测服务\n\n模型已部署到 GCP 端点。用户可以使用本地机器上的 Python 从已部署的模型获取预测。使用上一章中创建的相同服务账号和密钥。\n\
  \n通过以下命令安装 `google-cloud-aiplatform` Python 包：\n\n```\npip install google-cloud-aiplatform\n\
  ```\n\n更多关于该包的信息可从以下链接获取：\n\n[`pypi.org/project/google-cloud-aiplatform/`](https://pypi.org/project/google-cloud-aiplatform/)\n\
  \n### 用于预测的 Python 代码\n\n```\nimport base64\nfrom google.cloud import aiplatform\n\
  from google.cloud.aiplatform.gapic.schema import predict\nfrom google.protobuf import\
  \ json_format\nfrom google.protobuf.struct_pb2 import Value\nimport os\n\nos.environ['GOOGLE_APPLICATION_CREDENTIALS']\
  \ = r\"\"  # Full path of the service account key (Json file)\nproject_ID = \"vertex-ai-gcp\"\
  \nendpoint_id = \"5207489379286646784\"\ncontent_path = r\"E:\\Publication\\CHAPTERS\\\
  CHAPTER 3\\DATA\\Sentiment analysis\\Test\"\nlocation = \"us-central1\"\napi_endpoint\
  \ = \"us-central1-aiplatform.googleapis.com\"\n\ndef predict_text_sentiment_analysis_sample(\n\
  \    project_ID: str,\n    endpoint_id: str,\n    content_path: str,\n    location:\
  \ str = \"us-central1\",\n    api_endpoint: str = \"us-central1-aiplatform.googleapis.com\"\
  \n):\n    client_options = {\"api_endpoint\": api_endpoint}\n    client = aiplatform.gapic.PredictionServiceClient(client_options=client_options)\n\
  \    for path in os.listdir(content_path):\n        with open(os.path.join(content_path,\
  \ path)) as f:\n            content1 = f.readlines()\n        instance = predict.instance.TextSentimentPredictionInstance(content=str(content1[0])).to_value()\n\
  \        instances = [instance]\n        parameters_dict = {}\n        parameters\
  \ = json_format.ParseDict(parameters_dict, Value())\n```\n\n\n\n\n\n```python\n\
  endpoint = client.endpoint_path(project=project_ID, location=location, endpoint=endpoint_id)\n\
  \nresponse = client.predict(endpoint=endpoint, instances=instances, parameters=parameters)\n\
  \npredictions = response.predictions\n\nfor prediction in predictions:\n    print(\"\
  \ prediction:\", dict(prediction))\n```\n\n### 调用函数进行情感预测\n\n```python\npredict_text_sentiment_analysis_sample(project_ID,\
  \ endpoint_id, content_path)\n```\n\n### Python 代码的输出\n\n输出可在 图 3.49 中查看：\n\n![](img/Figure_3.49.png)\n\
  \n图 3.49：情感分析模型 Python 代码输出\n\n输出包含文本文件所属的情感类别。\n\n注意：项目 ID 和其他详细信息可按 第 2 章 所述从平台获取。\n\
  \n部署模型会产生费用，请确保从部署中删除模型。\n\n用户可按 第 2 章 所述删除模型和数据集。\n\n## GCP 中的预构建模型\n\n除了云平台的 AutoML\
