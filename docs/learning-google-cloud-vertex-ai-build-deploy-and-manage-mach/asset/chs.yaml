  \n![](img/fm1.png)\n\n# 第 1 章 Google Cloud Platform 基础\n\n## 简介\n\n本章将介绍 Google\
  \ Cloud Platform、其优势及其在当今数字化革命中的作用。内容涵盖云计算基础知识，包括云服务模型、GCP 账号创建、覆盖范围、服务范围和 GCP 层级结构。本章还将介绍几项关键的\
  \ GCP 服务，包括存储、计算、Google BigQuery 和身份与访问管理。\n\n## 结构\n\n本章将涵盖以下主题：\n\n*   云平台简介和基础知识\n\
  *   云的优势\n*   云对数据科学家的重要性\n*   云的类型\n*   Google Cloud Platform 简介\n*   Google Cloud\
  \ 的覆盖范围\n*   云服务模型\n*   GCP 服务\n*   GCP 层级结构\n*   与 GCP 服务交互\n*   GCP 中的存储\n*  \
  \ GCP 中的计算\n*   BigQuery\n*   身份与访问管理\n\n## 目标\n\n在深入了解 Google Cloud Platform 的\
  \ Vertex AI 之前，掌握云平台的几个重要原则和关键服务至关重要。读完本章后，用户将对 GCP 组件和服务有扎实的理解。书中包含使用 GCP 存储、计算和\
  \ BigQuery 服务的详细说明。\n\n## 云简介\n\n**云** 一词描述的是运行在可通过互联网访问的服务器上的应用程序和数据库。全球各地的数据中心托管着云服务器。组织可以通过使用云计算，避免管理物理服务器或在自己的计算机上运行软件。因为计算和存储发生在数据中心的服务器上，而不是用户设备本地，所以云使用户能够从几乎任何设备访问相同的文件和应用程序。\n\
  \n对于企业而言，转向云计算可以消除一些 IT 成本和开销：例如，它们不再需要更新和维护自己的服务器，因为所使用的云供应商会负责这些工作。\n\n## 云的优势\n\
  \n云的各种优势如 图 1.1 所示，具体如下：\n\n![](img/Figure_1.1.png)\n\n图 1.1：云平台的优势\n\n*   **成本效益**：在\
  \ IT 基础设施管理方面，云计算无疑是最具成本效益的选择。得益于各种即用即付和其他可扩展选项，各种规模的组织从本地硬件迁移到云都非常经济实惠。使用云资源代替购买昂贵的服务器设备和\
  \ PC，后者需要大量时间进行设置和维护（如漫长的设置和维护工时）。云还有助于减少在计算、存储、网络、运营和升级方面的支出。\n\n*   **可扩展性和弹性**：总体而言，云托管比本地机器托管更灵活。如果您需要更多带宽，无需对\
  \ IT 基础设施进行昂贵（且耗时）的升级。这种更高的自由度和适应性可能对生产力产生重大影响。\n\n    弹性仅在短时间内用于应对工作负载的快速变化。这是一种用于满足需求高峰的短期策略，无论这些高峰是意外的还是季节性的。静态工作负载的增加通过可扩展性来满足。为了应对预期的需求增长，会采用长期的可扩展性策略。\n\
  \n\n\n\n\n### 云计算的优势\n\n*   **安全性**：云平台提供多种尖端安全措施，确保数据的安全存储和管理。使用联合角色的细粒度权限和访问控制是有助于将敏感数据的访问权限仅限于真正需要的工作人员的两个功能示例。这有助于减少敌对行为者可利用的攻击面。身份验证、访问控制和加密是云存储提供商为保护其平台及其上处理的数据而实施的一些基本防护措施。在此基础上，用户可以实施自己的额外安全措施，以进一步加强云数据保护并限制对云中存储的敏感信息的访问。\n\
  \n*   **可用性**：绝大多数云服务提供商在服务提供方面非常可靠；事实上，绝大多数都保持 99.9% 的正常运行时间。迁移到云旨在实现高可用性。目标是让公司的产品、服务和工具随时随地通过任何可连接互联网的设备为客户和员工所用。\n\
  \n*   **减少停机时间**：基于云的解决方案提供直接从云端操作关键系统和数据或将其恢复到任意位置的能力。在涉及信息技术的灾难性事件期间，它们使您更容易让这些系统重新上线，减少了传统恢复技术所需的手动工作量。\n\
  \n*   **增强协作**：开发人员、QA、运维、安全和产品架构师在云环境中都暴露于相同的基础设施，并可同时工作而不会互相干扰。为最大限度减少争议和误解，云角色和权限提供了对谁在何时做了什么的更多可见性和监控。出于专门目的，可创建不同的云环境，如暂存、QA、演示和预生产。云使透明协作更简单并推广了它。\n\
  \n*   **洞察**：云平台提供的集成云分析还提供了数据的鸟瞰视角。当数据保存在云中时，实施监控系统并创建个性化报告以在整个组织范围内进行信息分析要容易得多。您将能够根据这些洞察提高效率并制定行动计划，从而使组织实现其目标。\n\
  \n*   **数据控制**：云为您提供对数据的完全可见性和控制权。您可以完全控制授予哪些用户访问哪些级别的指定数据。这不仅赋予您控制权，还通过确保员工了解分配给他们的任务来帮助简化工作。此外，它将使协作变得更加简单。因为多个用户可以同时编辑同一份文档副本，所以无需分发多份文档副本。\n\
  \n*   **自动软件更新**：没有什么比被迫等待系统升级安装更繁琐的了，尤其是对于已经有很多事情要做的人来说。托管在云中的应用程序会即时刷新和更新自己，无需\
  \ IT 人员为整个组织执行手动更新。这节省了本应花费在外部咨询上的关键时间和金钱。\n\n*   **易于管理**：通过 SLA 支持的协议、集中式资源管理和托管基础设施，云的使用可以简化并改进\
  \ IT 维护和管理能力。用户可以利用简单的用户界面，而无需担心安装任何东西。此外，还为用户提供 IT 服务的管理、维护和交付。\n\n### 云对数据科学家的重要性\n\
  \n自上个十年初以来，数据的扩展遵循指数级模式，预计这一趋势将持续。数据的安全存储应成为每家公司的首要任务之一。鉴于上述所有优势，云通常是存储和处理海量数据的首选。因此，当今的数据科学家除了统计学、机器学习算法等领域的专业知识外，还需要具备云计算经验。\n\
  \n然而，由于其 CPU 处理能力低，他们无法及时履行这些职责，假设他们甚至根本无法做到。此外，机器的内存通常因大小原因无法存储海量数据集。这决定了任务执行的速度和整体完成质量。得益于云，数据科学家现在能够在不受本地工作站能力限制的情况下探索更广泛的数据集。利用云可能会降低基础设施成本，因为它消除了对物理服务器的需求。此外，依赖云进行数据存储可以降低基础设施成本。除了提供数据存储服务外，包括\
  \ `Google Cloud Platform` 在内的许多云平台还提供面向数据摄取、数据处理、分析、AI 和数据可视化的其他服务。\n\n## 云的类型\n\
  \n根据不同能力，云分为三种类型：\n\n*   公有云\n*   私有云\n*   混合云\n\n### 公有云\n\n公有云是海量的现成计算资源集合，包括网络、内存、处理单元和存储。用户可以租用这些资源（它们驻留在公有云供应商全球分布的全托管数据中心中）来创建您的\
  \ IT 架构。使用 Web 浏览器，用户可以访问这种形式云中的资源。`Google Cloud Platform` 是公有云的一个例子。\n\n公有云的一个主要优势是底层硬件和逻辑由各供应商托管、拥有和维护。客户无需购买或维护构成其公有云\
  \ IT 解决方案的物理组件。此外，服务级别协议（`SLA`）将每个提供商绑定到符合法规的月度正常运行时间百分比和安全保证。\n\n### 私有云\n\n与公有云不同，私有云仅由单个组织拥有和运营。它们通常驻留在公司的数据中心，并在组织自己的设备上运行。然而，组织可以使用第三方供应商在其设备上托管私有云。即使资源驻留在远程托管的数据中心，这种情况下私有云也与公有云具有某些特征。它们可能提供某些管理服务，但无法提供全范围的公有云服务。\n\
  \n如果私有云驻留在您自己的数据中心，组织将对整个系统拥有完全控制权。自托管私有云有助于遵守某些更严格的安全和合规法规。\n\n\n\n\n\n### 混合云\n\
  \n正如这种云计算形式的名称所示，这种云计算是公有云和私有云的混合与集成。通过这种方式，它能够为您提供与多种云类型相关的优势，就云计算而言。它在数据传输方面提供了更大程度的灵活性，并扩展了企业可用的采用选择。这在确保高度控制和轻松过渡的同时，以更具经济性的费率提供一切。\n\
  \n## Google Cloud Platform 简介\n\nGoogle Cloud Platform 是行业内的超大规模基础设施提供商之一。它是 Google\
  \ 提供的一系列云计算服务的集合。这些服务运行在 Google 为其最终用户产品（包括 YouTube、Gmail 和许多其他产品）所采用的同一基础设施之上。Google\
  \ Cloud Platform 提供广泛的服务，例如计算、存储和网络等。\n\nGoogle Cloud Platform 于 2008 年首次推出，截至目前，它是使用最广泛的第三大云平台。此外，对托管在云端的平台的需求也在不断增长。\n\
  \nGoogle Cloud 不仅为部署提供标准平台和数据分析（无论其物理位置在哪里），还为我们提供了所有环境的以服务为中心的视角。利用 Google Cloud\
  \ 提供的高级分析和机器学习功能，我们可以从数据中提取最有用的见解。在 Google 无服务器数据分析和机器学习平台的支持下，用户将能够自动化流程、生成预测，并简化管理和运营。Google\
  \ Cloud 提供的服务会对静态数据、传输中数据和使用中数据进行加密。先进的安全机制保护数据隐私。\n\n## Google Cloud Platform 账号创建\n\
