  \n# 第 9 章：Vertex AI Feature Store\n\n\n\n\n\n## 简介\n\n了解了平台的流水线之后，我们将转向 GCP 的特征存储。在本章中，我们将从理解特征存储及其优势开始，随后进行特征存储的实操练习。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   了解 Vertex AI 特征存储\n*   特征存储的层级结构\n*   特征存储的优势\n\
  *   特征存储的劣势\n*   使用 GUI 操作特征存储\n*   使用 Python 操作特征存储\n*   删除资源\n*   特征存储的最佳实践\n\n\
  ## 目标\n\n读完本章后，读者将对特征存储有很好的理解，知道何时使用它，以及如何通过 GCP 的 Web 控制台和 Python 来使用它。\n\n## 了解\
  \ Vertex AI 特征存储\n\nVertex AI 特征存储是一个用于管理和提供机器学习特征的中央化存储库。为了加快创建和交付高质量 ML 应用的过程，许多组织正转向中央化特征存储，以便大规模地促进\
  \ ML 特征的共享、发现和复用。\n\n存储和处理能力以及后端基础设施的其他组件均由 Vertex AI 特征存储负责处理，这使其成为一个全托管解决方案。因此，数据科学家可以忽略将特征投入生产相关的困难，转而专注于特征计算逻辑。\n\
  \nVertex AI 中的特征存储是整个系统不可或缺的一部分。您可以单独使用 Vertex AI 特征存储，也可以将其纳入现有的 Vertex AI 工作流中。例如，可以查询\
  \ Vertex AI 特征存储以获取用于训练自定义模型或 AutoML 模型的信息。\n\n## 特征存储的层级结构\n\n某一实体时间点的实体集合存储在特征存储中。每种实体类型都定义了实体\
  \ ID、时间戳以及一系列属性（如特征 1、特征 2 等）等字段。特征存储的层级结构如图 9.1 所示：\n\n![](img/Figure_9.1.png)\n\
  \n图 9.1：特征存储的层级结构\n\n*   **特征存储**：实体类型、特征及其值的顶层容器。\n*   **实体类型**：语义相关特征（真实或虚拟）的集合。\n\
  *   **实体**：实体类型的一个实例。\n*   **特征**：实体类型的可度量属性或特性。\n*   **特征值**：包含特定时间点特征的值。\n\n##\
  \ 特征存储的优势\n\n特征存储的优势如下：\n\n*   **全公司范围扩展特征**：特征存储让您能轻松共享特征以用于训练或服务。不同的项目和用例无需重复进行特征工程。从中央存储库管理和提供特征，以保持整个业务的一致性并防止重复劳动，这对于高价值特征尤为重要。\n\
  \n    Vertex AI 特征存储允许人们通过搜索和过滤来查找和复用特征。查看特征元数据以评估质量和使用情况。例如，您可以检查特征覆盖率和特征值分布。\n\
  \n*   **大规模服务**：在线预测需要低延迟的特征服务，Vertex AI 特征存储可对其进行管理。Vertex AI 特征存储会自动构建和扩展低延迟数据服务基础设施。您创建特征，但将提供特征的工作外包出去。通过这种管理，数据科学家可以创建新特征，而无需担心部署问题。\n\
  \n*   **减少训练-服务偏差**：当生产环境中的特征数据分布与训练模型时使用的分布不同时，就会发生训练-服务偏差。这种偏差会导致模型在训练和生产环境中的性能差异。Vertex\
  \ AI 特征存储可通过以下示例处理训练-服务偏差：\n\n    *   Vertex AI 特征存储保证特征值仅被摄取一次，并同时复用于训练和服务。如果没有特征存储，训练和服务特征可能会使用不同的代码路径。训练和服务的特征值可能会有所不同。\n\
  \n    *   Vertex AI 特征存储为训练提供历史数据回溯。通过收集预测前的特征值，这些回溯可减少数据泄露。\n\n*   **识别漂移**：Vertex\
  \ AI 特征存储可检测特征数据分布中的漂移。Vertex AI 特征存储监控特征值分散情况。随着特征漂移的增加，使用受影响特征重新训练模型。\n\n*   **保留**：Vertex\
  \ AI 特征存储会在分配的时间量内保留特征值。此上限由特征值的时间戳决定，而非值导入的日期和时间。Vertex AI 特征存储会安排删除时间戳超出限制的值。\n\
  \n## 特征存储的劣势\n\n特征存储存在开销，这可能会使数据科学变得更加复杂，尤其是对于较小的项目。如果企业拥有众多小型数据集，特征存储可能会使事情复杂化。当数据极其多样以至于没有标准建模方法能提供帮助时，特征存储将失效。在单独的数据源和元数据上创建的特征难以复用。此外，当特征不依赖时间，或仅需要批量预测特征时，特征存储可能不是理想选择。\n\
