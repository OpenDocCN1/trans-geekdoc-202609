  \n# 第 7 章：使用 Kubeflow 针对自定义模型的流水线\n\n## 简介\n\n在上一章中，我们使用 Kubeflow 处理了 GCP 的流水线。我们使用平台的\
  \ AutoML 构建了第一个用于模型训练的流水线。在本章中，我们将了解如何为自定义模型构建流水线并比较不同流水线的结果。我们还将了解 Vertex AI 流水线和\
  \ Kubeflow 流水线之间的一些差异。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   模型训练数据\n*   额外权限\n*  \
  \ 使用 Cloud Shell 创建 Workbench\n*   流水线代码演练\n*   流水线\n*   流水线比较\n*   资源删除\n\n## 目标\n\
  \n在本章结束时，用户将能够使用 Kubeflow 为自定义模型构建流水线并比较不同流水线的结果。\n\n## 模型训练数据\n\n对于本练习，数据从 Kaggle\
  \ 下载（链接如下），该数据集列在 CC0：公共领域许可下。在前几章中，我们使用 Cloud Storage 上传数据以训练模型；在本章中，数据被上传到 GCP\
  \ 的 BigQuery，机器学习模型在其上进行训练。\n\n[`www.kaggle.com/datasets/arashnic/hr-ana`](https://www.kaggle.com/datasets/arashnic/hr-ana)\n\
  \n请参阅第 1 章 *Google Cloud Platform 基础* 中的 BigQuery 部分以上传数据。图 1.43 至 1.47 将帮助您将数据上传到\
  \ BigQuery。请参阅 图 1.48 运行一个小查询以检查数据上传是否成功。\n\n要将数据上传到 BigQuery，请创建一个名为 `employee_data`\
