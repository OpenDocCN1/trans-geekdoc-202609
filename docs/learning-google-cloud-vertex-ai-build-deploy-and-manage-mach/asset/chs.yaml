  \n### 步骤 7：数据集删除\n\n按照 图 1.49 中描述的步骤删除数据集：\n\n![](img/Figure_1.49.png)\n\n**图 1.49：BigQuery\
  \ 数据集删除**\n\n1.  点击三个点并选择 **Delete**。弹出窗口将要求确认。\n\n## 身份和访问管理\n\n\n\n\n想象一下，你刚加入一个组织。他们为你提供了一张工牌和一张门禁卡。凭借这张门禁卡，你将被允许进入一定数量的地点，包括你的工作场所、停车场和食堂等。如果你想查看实验室或存放机密信息的文档区等区域的信息，你需要寻求特别授权才能进入。以类似\
  \ Google Cloud Platform (GCP) 的方式，我们有一个叫做身份与访问管理的概念，简称 IAM。\n\n### 身份与访问管理\n\n身份与访问管理\
  \ (IAM) 是在 Google Cloud Platform (GCP) 等云计算环境中确保数据安全所能采取的最至关重要的预防措施之一。执行的每一个操作，例如资源的添加或删除，或平台不同服务之间的通信，都是通过\
  \ API 进行的。因此，必须密切关注那些允许访问资源的权限，并确保仅提供执行业务流程所绝对必需的最少权限。IAM 基于最小权限原则开发，即默认情况下用户将被拒绝访问。必须为用户显式开放访问权限。\n\
  \n为了分配权限，GCP 使用一种称为基于角色的访问控制 (RBAC) 的系统。RBAC 表示根据与身份相关联的任务或职责来分配权限的做法。\n\n#### 角色\n\
  \n`ROLE`（角色）是一组指定的权限，用于确定个人是否有权在资源上执行特定活动。在 IAM 中，我们无法直接向用户授予权限。我们不是给他们权限，而是给他们角色，角色是一项或多项权限的集合。`service.resource.verb`（服务.资源.动词）格式用于表示权限。一个例子是\
  \ `compute.instances.list` 权限。资源上可执行的活动种类由其权限确定。当角色授予成员时，该成员将获得与该职位关联的所有权限。\n\n\
  Google Cloud IAM 中有三种类型的角色：\n\n*   **基本角色**\n    *   包含 Owner（所有者）、Editor（编辑者）和\
  \ Viewer（查看者）角色\n    *   提供广泛级别的权限，**不推荐**使用\n*   **预定义角色**\n    *   Google 根据需要创建和更新角色，例如当\
  \ Google Cloud 推出新功能或服务时。\n    *   示例：`roles/notebooks.admin`；`roles/ml.modelUser`\n\
  *   **自定义角色**\n    *   根据用户定义的权限列表提供细粒度访问权限\n    *   我们可以创建一个包含一项或多项权限的自定义 IAM 角色，然后将该自定义角色授予用户或群组。\n\
  \    *   当新权限、功能或服务引入平台时，GCP **不会**更新自定义角色\n\n#### 成员（身份）\n\n在 GCP 中，成员或用户也被称为 `IDENTITY`（身份）。身份可以是以下形式：\n\
  \n*   **用户账号**：拥有 GCP 访问权限的用户将被视为用户账号，有时也称为 Google 账号。\n*   **服务账号**：它不与特定用户关联，而是用于\
  \ GCP 资源之间的通信。我们可以创建服务账号，但不能直接从服务账号访问资源。服务账号分为两类。\n    *   **默认服务账号**：当你激活或使用某些\
  \ Google Cloud 服务时，这些服务允许服务启动任务以访问其他 Google Cloud 资源，Google Cloud 会建立用户管理的服务账号。\n\
  \    *   **用户管理的服务账号**：使用 IAM API、Cloud Console 或 `gcloud` 命令行工具来建立用户管理的服务账号。创建者负责管理和保护账号。我们将在下一章创建一个。\n\
  *   **Google 群组**：群组有助于大规模管理用户。这是将角色附加给具有相同工作职能的用户的简单方法。Google 群组的每个成员都会继承授予该群组的\
  \ IAM 角色。一个用户可以属于多个群组。\n*   **G Suite 网域**：它是整个组织的用户账号。\n*   **Cloud Identity 网域**：如果组织未使用\
  \ G Suite 网域，但想使用 Google Cloud IAM，则使用 Cloud Identity 网域。不过，Cloud Identity 网域用户无法访问属于\
  \ Google Workspace 的应用程序和功能。\n*   **别名**：也称为特殊标识符。下面列出了两个特殊标识符。\n    *   `allauthenticatedUsers`：是一个特殊标识符，代表所有服务账号以及所有在互联网上通过\
  \ Google 账号进行身份验证的用户。\n    *   `allusers`：是一个特殊标识符，代表互联网上的任何人，包括已认证和未认证的用户。\n\n\
  #### 策略\n\n*   **策略**针对角色和成员强制执行。此策略与资源相关，并指定和控制哪些成员被赋予特定职责。资源的策略概述了谁（成员）拥有什么样的访问权限（角色）。\n\
  *   IAM 策略可以在资源层级的任何级别进行配置，包括组织、文件夹、项目和资源级别。由于 IAM 策略继承具有传递性，资源会继承其所有父资源的策略。当经过身份验证的成员尝试访问资源时，IAM\
  \ 会根据资源的策略判断该活动是否被授权。图 1.50 展示了 IAM 中角色、成员、资源和策略的关系。\n\n![图 1.50：身份与访问管理](img/Figure_1.50.png)\n\
  \n## 结论\n\n在本章中，我们了解了什么是云、使用云的好处、为什么当今的数据科学家需要了解云平台，以及云平台遵循的多种服务模型类型。我们还发现了其遵循的层级结构（组织、文件夹和项目）。除此之外，我们还重点关注了存储、计算和\
  \ BigQuery 等更多实操层面的内容，以及为什么平台需要身份与访问管理。\n\n在下一章中，我们将开始使用 Vertex AI。\n\n## 问题\n\n\
