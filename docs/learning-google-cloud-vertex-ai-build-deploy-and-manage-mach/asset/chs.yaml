  \n**图 6.12：** 笔记本文件中的管道链接\n\n1.  提交管道作业后，将提供一个链接以检查管道的状态。点击它。\n\n### 管道执行\n\n提交作业执行后，管道将显示在\
  \ Vertex AI 的管道部分下。将显示每个组件的状态（尚未开始、成功、失败）。请按照以下步骤检查已提交管道的状态。\n\n#### 步骤 1：图像分类管道\n\
