  \ 10K 条。`Train_data.csv` 用于训练，`test_data.csv` 将用于批量预测（包含 5 条排除目标列的随机记录）。\n\n让我们从高层了解数据。数据包含约\
  \ 18 列。`HeartDisease` 列是目标列（二分类），包含 Yes 和 No 值。\n\n**分类列：** `Smoking`、`alcoholdrinking`、`stroke`、`diffwalking`、`sex`、`agecategory`、`race`、`diabetic`、`physicalactivity`、`genhealth`、`asthma`、`kidneydisease`、`skincancer`\n\
