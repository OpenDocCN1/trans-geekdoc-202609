  \n创建免费账号的步骤如下：\n\n1. 打开 <https://cloud.google.com/free>。\n2. 点击 **Get started for\
  \ free**（免费开始使用）。\n\n    打开的屏幕如 图 1.2 所示：\n\n    ![](img/Figure_1.2.png)\n\n   \
  \ 图 1.2：GCP 账号创建\n\n3. 使用您的 Gmail 凭据登录，如果没有则创建一个。这可以在 图 1.3 中看到：\n\n    ![](img/Figure_1.3.png)\n\
  \n    图 1.3：GCP 账号创建 输入有效邮箱地址\n\n4. 选择国家/地区和需求：\n\n    ![](img/Figure_1.4.png)\n\
  \n    图 1.4：GCP 账号创建 国家/地区选择\n\n5. 选择国家/地区和项目。勾选服务条款并点击 **CONTINUE**（继续）。\n6. 提供电话号码进行身份验证，如\
  \ 图 1.5 所示：\n\n    ![](img/Figure_1.5.png)\n\n    图 1.5：GCP 账号创建 输入电话号码\n\n7. 免费账号需要信用卡。验证费用为\
  \ 2 卢比。必须提供地址。在此页面点击 **START MY FREE TRIAL**（开始我的免费试用）：\n\n    ![](img/Figure_1.6.png)\n\
  \n    图 1.6：GCP 账号创建 输入有效信用卡详情\n\n8. 免费试用开始后，用户将进入此页面。欢迎页面见 图 1.7：\n\n    ![](img/Figure_1.7.png)\n\
  \n    图 1.7：GCP 登录页\n\n## Google Cloud Platform 的覆盖范围\n\n独立的地理区域称为**区域**，而**可用区**构成了区域。可用区和区域是对分布在世界各地一个或多个数据中心中物理资源的逻辑抽象。在一个区域内，Google\
  \ Cloud 资源被部署到称为可用区的特定位置。重要的是要将可用区视为区域内的单一故障域。图 1.8 展示了 GCP 的覆盖范围：\n\n![](img/Figure_1.8.png)\n\
  \n图 1.8：GCP 覆盖范围\n\n本书撰写时，共有约 34 个区域、103 个可用区和 147 个网络边缘节点，分布在 200 多个国家和地区。GCP 正在不断扩大其全球覆盖范围，请查看下面提到的链接以获取最新数据。\n\
  \n图片来源：<https://cloud.google.com/about/locations>\n\nGoogle Cloud 提供的服务和资源可以在可用区级别或区域级别进行管理，也可以由\
  \ Google 跨多个区域集中管理：\n\n* **可用区资源**：可用区中的资源仅在该可用区内工作。当一个可用区宕机时，该可用区中的部分或全部资源可能会受到影响。\n\
  * **区域资源**：它们分布在一个区域内的多个可用区中，以确保始终可用。\n* **多区域资源**：Google 管理许多 Google Cloud 服务，使其具有冗余性并分布在区域内部和区域之间。这些服务提高了资源效率、性能和可用性。\n\
  * **全球资源**：同一项目中的任何资源都可以从任何可用区访问全球资源。创建全球资源时无需指定范围。\n\n网络边缘节点有利于托管深受托管服务用户群喜爱的静态内容。内容会暂时缓存在这些边缘节点上，使用户能够从离他们近得多的位置获取信息。这将使用户获得更积极的体验。\n\
  \nGCP 的区域和可用区有几个优势。在确保高可用性、高冗余性和高可靠性方面，区域和可用区的概念很有帮助。遵守政府制定的法律法规。数据法规在不同国家之间可能差异巨大。\n\
  \n## 云服务模型\n\n云平台提供多种服务，所有这些服务大致可归入三个不同的类别：\n\n* **基础设施即服务 (IAAS)**\n* **平台即服务 (PAAS)**\n\
  * **软件即服务 (SAAS)**\n\n云服务模型之间的区别如 图 1.9 所示\n\n![](img/Figure_1.9.png)\n\n图 1.9：云服务模型\n\
  \n让我们设想一下，我们正在开发一个应用程序，同时将其托管在我们本地的服务器上。在这种情况下，我们有责任拥有并维护相应的基础设施、相应的平台，当然还有我们的应用程序。\n\
  \n* **基础设施即服务**：在 IAAS 模式下，提供必要的基础设施（可能包括虚拟机、网络和存储设备）将成为云的责任。我们仍然负责确保拥有用于开发和部署的适当平台。我们除了使用它之外，无法控制底层基础设施。Google\
  \ 提供的 Compute Engine 和 Kubernetes Engine 就是基础设施即服务的一个例子。\n* **平台即服务**：在 PAAS 模式下，云服务提供商有责任提供用于开发和部署的适当平台，例如操作系统和编程语言环境所用的工具，这除了提供基础设施的责任之外还存在。Google\
  \ App Engine 就是一个 PAAS 平台的例子。\n\n\n\n\n\n## 服务模式\n\n### Software as a Service (SaaS)\n\
  \n在 SaaS 模式下，云服务提供商将其运行在自有基础设施上的应用程序出租给客户。除了平台和底层基础设施外，软件应用程序的维护也由云服务提供商负责。我们可以通过\
  \ Web 浏览器、应用浏览器等方式，在任意设备上访问这些软件程序。电子邮件（Gmail）和云存储（Google Drive）是 SaaS 的两个典型例子。\n\
  \n### Data as a Service (DaaS)\n\n与已流行十余年的上述三种服务模式不同，DaaS 是一种刚开始广泛应用的服务。这部分原因是通用云计算服务最初并非为管理海量数据工作负载而构建；它们主要面向应用托管和基础数据存储需求（而非数据集成、分析和处理）。\n\
  \nSaaS 消除了在本地计算机上安装和管理软件的必要性。同样，Data-as-a-Service 方法论的核心是利用应用程序编程接口（API）按需从多个来源交付数据。其旨在简化数据访问，并提供可供以多种形式使用的精选数据集或数据流。这些格式通常通过数据虚拟化进行统一。事实上，DaaS\
  \ 架构可能包含多种数据管理技术，如数据虚拟化、数据服务、自助式分析。\n\n从最基本的形式来看，DaaS 使组织能够访问其可用的、日益增长的数据源数量和复杂度，从而为消费者提供最相关的洞察。数据民主化是每家想要从数据中获取实际价值的公司的绝对必要条件。它通过采用更以数据为中心的运营和程序方法，为将组织数据货币化并获得竞争优势提供了巨大潜力。\n\
  \n## GCP 提供的服务\n\n用户可以使用 Google Cloud Platform 提供的全面服务选择。每一项服务都可归入 图 1.10 所示的类别之一：\n\
  \n![](img/Figure_1.10.png)\n\n**图 1.10：GCP 的服务**\n\n*   **存储**：Google 提供用于存储非结构化项目的\
  \ `Cloud Storage`、用于以传统方式共享文件的 `Filestore`，以及用于虚拟机的 `persistent disk`。\n*   **计算**：`Compute\
  \ Engine`、`App Engine`、`Cloud Run`、`Kubernetes Engine` 和 `Cloud Functions` 是 GCP\
  \ 提供的核心计算服务。\n*   **关系型数据库**：`Cloud SQL` 支持 `MySQL`、`PostgreSQL` 和 `Microsoft SQL\
  \ Server`；`Cloud Spanner` 是一个能够在全球范围内运行的大规模可扩展数据库。\n*   **NoSQL 数据库**：`Bigtable`、`Firestore`、`Memorystore`\
  \ 和 `Firebase Realtime Database` 是 Google 提供的不同 NoSQL 服务。\n    *   处理海量分析工作时，`Bigtable`\
  \ 是最高效的解决方案。\n    *   `Firestore` 非常适合用于构建客户端 Web 和移动应用。\n    *   `Firebase Realtime\
  \ Database` 适合用户间的实时数据同步，如协作式应用开发所需。\n    *   `Memorystore` 是一种完全在内存中运行的数据存储，通常用于缓存频繁访问的数据以加速应用性能。\n\
  *   **数据仓库**：`BigQuery` 是 Google 提供的数据仓库服务。\n*   **网络**：虚拟私有云（`VPC`）是 GCP 上的本地网络。通过\
  \ `VPC Network Peering`，虚拟私有云可相互连接。用户可利用基于互联网的 `Cloud VPN` 在 VPC 和本地网络之间建立受保护连接；或者通过\
  \ `Cloud Interconnect` 或 `Peering` 建立专用私有连接。为便于将应用和数据集迁移到其平台，GCP 提供了多样化的选项。`Anthos`\
  \ 作为混合云部署的替代方案。\n*   **数据分析**：Google 在数据分析领域表现卓越。\n    *   `Pub/Sub` 用作缓冲，服务于无法应对数据激增的服务。\n\
  \    *   `Dataproc` 是由 Dataproc 托管的 `Hadoop` 和 `Spark` 实现。\n    *   `Dataflow` 是基于\
  \ `Apache Beam` 的托管实现。\n    *   `Dataprep` 允许不懂代码的用户进行数据处理，其底层利用 `Dataflow`。\n \
  \   *   用户可使用 `google looker studio` 通过图表、图形等可视化数据。\n*   **AI 与 ML**：平台为不同客户群提供\
  \ AI 和 ML 服务。`Vertex AI` 为新手提供 `AUTOML` 选项；为经验丰富的用户提供通过 API 进行预测的训练模型；为高级 AI 从业者提供各种选项。\n\
  *   **CI/CD 与开发工具**：\n    *   `Cloud Build` 支持开发持续集成/持续部署（CI/CD）流水线。\n    *   托管在\
  \ GCP 上的私有 Git 仓库称为 `Cloud Source Repositories`。\n    *   `Artifact Registry` 扩展了\
  \ `Container Registry` 的功能，是 Google Cloud 推荐的容器注册表。它为存储和管理语言包及 Docker 容器镜像提供了单一位置。\n\
  *   **安全与身份管理**：\n    *   `IAM`（Identity and Access Management，身份和访问管理）允许为用户和应用分配角色。\n\
  \    *   存储在 GCP 中的所有内容默认均已加密。`Cloud Key Management` 让公司能够控制其加密密钥。\n    *   `Secret\
  \ Manager` 可安全存储 API 密钥、密码、证书及其他敏感信息。\n*   **运维套件**：`Cloud Operations` 套件包含 Monitoring、Logging、Error\
  \ Reporting、Trace、Debugger 和 Profiler 功能。\n*   **安全命令中心**：`Security Command Center`\
  \ 向您展示活跃的安全威胁和漏洞，以及合规性违规情况。\n*   **基础设施即代码**：`Cloud Deployment Manager` 可帮助自动化 Google\
  \ Cloud Platform 资源的创建和管理。\n\n## GCP 的层级结构\n\n**资源** 是指在 Google Cloud Platform 上投入使用的任何事物。Google\
  \ Cloud 中的所有内容都具有清晰的层级结构，类似于父子关系。GCP 遵循的层级结构如 图 1.11 所示：\n\n![](img/Figure_1.11.png)\n\
  \n**图 1.11：GCP 的层级结构**\n\n`Organization` 节点是 GCP 层级的起点，可代表一个组织或公司。组织是文件夹和项目及其各自资源的祖先。应用于组织的访问控制策略适用于其所有关联的项目和资源。\n\
  \n但是，如果像上一节那样使用个人邮箱 ID 创建账号，将无法看到组织。相反，如果使用 Google Workspace 账号登录并创建项目，组织将自动提供。此外，没有组织的情况下，仅有少量的资源管理器功能可用。\n\
  \n\n\n\n\n## 组织下的文件夹\n\n借助文件夹，我们可以使用一种额外的分组机制，并可将其概念化为包含在大型组织内部的子组织层级结构。文件夹中可以包含额外的子文件夹。您可以根据具体的文件夹，选择完全或部分地授予访问项目及其所有资源的权限。\n\
  \n### 项目\n\n项目是存在于最基本层级的实体。可以在组织和文件夹中嵌套多个项目。为了使用 GCP 资源，项目是绝对必要的，它是使用云服务、管理 API\
  \ 和启用结算功能的基础。一个项目有两个不同的 ID 与之关联。第一个是项目 ID，它是项目的唯一标识。第二个是项目编号，它在创建项目时自动生成，我们无法以任何方式对其进行修改。\n\
  \n### 资源\n\n资源一词指构成 Google Cloud Platform 的组件。资源包括云存储、数据库、虚拟机等。每当我们创建一个云存储桶或部署一台虚拟机时，都会将这些资源关联到相应的项目。\n\
  \n### 创建新项目\n\nGoogle Cloud 项目是创建、启用和使用所有 Google Cloud 服务的基础，例如管理 API、启用结算、添加和删除协作者以及管理\
  \ Google Cloud 资源的权限。\n\n可以通过在 Web 控制台中执行以下步骤来创建项目：\n\n1.  从 IAM 和管理 | 管理资源 导航。顺序可见\
  \ 图 1.12：\n\n    ![](img/Figure_1.12.png)\n\n    图 1.12：项目创建\n\n2.  点击创建项目。\n\n\
  \    项目创建过程可见下图：\n\n    ![](img/Figure_1.13.png)\n\n    图 1.13：项目创建\n\n3.  用户为项目提供名称，按\
  \ 图 1.14 所示步骤操作：\n\n    ![](img/Figure_1.14.png)\n\n    图 1.14：项目创建\n\n    1.  提供项目名称。\n\
  \    2.  项目 ID 将自动填充，用户可在创建项目时对其进行编辑。如果用户需要通过 SDK 或 API 访问项目下的资源，则需要项目 ID。项目创建后，用户无法更改项目\
  \ ID。\n    3.  如果用户在组织下创建项目，请选择该组织。使用免费账号的用户无法创建组织或文件夹。所有项目将在“无组织”下创建。\n\n注意：使用免费账号访问的用户将获得有限的项目创建额度。\n\
  \n### 删除项目\n\n要删除处于活动状态的项目：\n\n1.  选择需要删除的项目。\n2.  点击删除，系统将提示用户确认。\n\n    此过程如 图\
  \ 1.15 所示：\n\n    ![](img/Figure_1.15.png)\n\n    图 1.15：项目删除\n\n一旦用户确认删除项目，该项目将被标记为待删除状态，并保持该状态\
  \ 30 天。用户可在 30 天内恢复项目，超过该期限后，该项目及其关联的资源将被永久删除，无法恢复。此外，标记为待删除的项目不可用。\n\n## 与 GCP\
  \ 服务交互\n\n提到资源时，让我们讨论如何使用它们。GCP 提供了三种与服务和资源交互的基本方式：\n\n### Google Cloud Platform\
  \ 控制台\n\n在使用 Google Cloud 时，控制台或 Web 用户界面是最常用的交互方式。同时，它为刚开始使用 GCP 的用户提供了丰富的功能和易用的界面。\n\
  \n可通过链接 [`console.cloud.google.com`](https://console.cloud.google.com) 访问 Cloud\
  \ 控制台。\n\nGoogle Cloud 控制台的登录页面如 图 1.16 所示：\n\n![](img/Figure_1.16.png)\n\n图 1.16：GCP\
  \ 控制台\n\n### 命令行界面\n\n如果您是开发者，可以使用 Google Cloud SDK 提供的 `gcloud` 命令行工具来控制开发流程和 GCP\
  \ 资源。要获得对 Google Cloud 计算资源的命令行访问权限，可以使用 Cloud Shell。Cloud Shell 拥有 5 GB 的主目录，是一个基于\
  \ Debian 的虚拟机，您可以从中轻松管理 GCP 项目和资源。Cloud Shell 预装了 `gcloud` 命令行工具和其他必要工具，让您能快速上手。要使用\
  \ Cloud Shell，请按以下步骤操作：\n\n按 图 1.17 所示激活 Cloud Shell：\n\n![](img/Figure_1.17.png)\n\
  \n图 1.17：GCP CLI\n\n点击激活 Cloud Shell。打开 Cloud Shell 命令窗口需要几分钟时间。\n\nCloud Shell\
  \ 激活后，屏幕底部会出现用于输入命令的黑色区域，如 图 1.18 所示：\n\n![](img/Figure_1.18.png)\n\n图 1.18：GCP\
  \ CLI\n\n1.  输入命令：\n\n    ```\n    gcloud projects create project_id – 用于创建项目\n\
  \    gcloud projects delete project_id – 用于删除项目\n    ```\n\n### API\n\n应用程序通常通过软件开发工具包\
  \ (SDK) 与 Google Cloud 通信。Google Cloud SDK 支持多种编程语言，包括 Go、Python 和 node.js 等。\n\n\
  注意：在从已部署的模型获取预测时，我们将使用此方法。\n\n## 存储\n\n存储与计算、网络一起，被视为基本构建组件之一。应用程序受益于存储服务提供的更高级别的持久性和耐用性。这些服务位于平台深处，是\
  \ Google Cloud 大多数服务以及您在其之上构建的系统的基础。它们是平台的核心支柱。\n\nGoogle Cloud 提供三种存储选项：\n\n* \
  \  永久磁盘\n*   Filestore\n*   Cloud Storage (GCS)\n\n具体说明如下：\n\n*   **永久磁盘**：Google\
  \ Cloud 永久磁盘提供块存储，供 Google Cloud 上托管的虚拟机（Google Cloud Compute Engine）使用。将这些永久磁盘想象成简单的\
  \ USB 记忆棒，这将比任何其他方法都更有助于您理解它们。它们可以连接到虚拟机，也可以从虚拟机分离。无论虚拟机是启动、暂停还是终止，它们都允许您为服务构建数据持久性。这些永久磁盘不仅用于为\
  \ Google Cloud Compute Engine 上托管的虚拟机提供动力，还用于 Google Kubernetes Engine 服务。\n\n \
  \   Google Cloud 永久磁盘的运作方式类似于本地 PC 上的虚拟磁盘。永久磁盘可以是 HDD 或 SSD，后者提供卓越的 I/O 性能。此外，还可以选择其放置位置以及所需的可用性类型，可以是区域级、区域级或本地级。\n\
  \n    Google Cloud 永久磁盘还有其他鲜为人知但非常有用的功能，包括自动加密、在使用过程中调整磁盘大小的能力，以及可用于数据备份和创建虚拟机镜像的快照功能。可以为多个虚拟机配置读写访问权限。一个虚拟机可以拥有写入权限，而所有其他虚拟机对同一永久磁盘拥有只读权限。\n\
  \n\n\n\n\n### Filestore\n\nFilestore 是 Google Cloud 提供的一种网络文件存储服务。网络文件存储的概念已经存在相当长一段时间了，与块存储类似，它也可以在大多数企业使用的本地数据中心中找到。如果你习惯于处理\
  \ NAS（即网络附属存储），你应该对这个概念很熟悉。为了回应兼容网络附属存储 (NAS) 的服务短缺这一问题，Google 扩展了其产品线，推出了云文件存储服务。\n\
  \n顾名思义，Persistent Disk 与网络文件存储的主要区别在于，网络文件存储通过网络提供磁盘存储。这使得创建包含许多并行服务的系统成为可能，这些服务能够从通过网络挂载的同一磁盘存储中读取和写入文件。借助此功能，可以开发此类系统。\n\
  \n以下是 Filestore 的一些用例示例：\n\n*   大多数本地应用程序需要文件系统接口，Filestore 使得将此类企业应用程序迁移到云端变得容易\n\
  *   它用于媒体渲染，以减少延迟。\n\n### Cloud Storage\n\nGoogle Cloud 提供的对象存储服务称为 Google Cloud\
  \ Storage。它提供许多预装的极具吸引力的功能，例如对象版本控制和细粒度权限（按对象或存储桶），这两者都有可能简化开发流程并减少运维开销。Google Cloud\
  \ Storage 平台被用作各种不同服务的基础。\n\n在普通的本地系统中，拥有这种存储并不常见，后者通常具有受限的容量，以及快速且独占的连接。另一方面，对象存储在其工作方式方面拥有非常用户友好的接口。用通俗的话说，其价值主张在于：你可以使用\
  \ REST API 获取和上传任何你想要的文件；此外，这可以无限扩展，每个对象最高可扩展到 TB 级别；最后，其价值主张还在于可以存储任意数量的数据。存储桶是\
  \ Cloud Storage 中用于组织所存储众多对象的命名空间。虽然一个存储桶可以容纳多个对象，但每个单独的对象只能属于一个存储桶。\n\n这种存储类型低廉的成本（每\
  \ GB 几美分），加上其无服务器模式和易用性，促使其在云原生系统架构中得到广泛采用。随后，云服务提供商负责处理数据复制、可用性、完整性检查、容量规划等繁重任务。API\
  \ 使应用程序能够保存和检索对象。\n\n基于成本、可用性和访问频率等因素，云存储有四种不同的存储类别。它们分别是标准存储、近线存储、冷线存储和归档存储，如 图\
  \ 1.19 所示：\n\n![](img/Figure_1.19.png)\n\n**图 1.19：GCP 存储**\n\n#### 标准存储类别\n\n此存储类别允许高频访问，是软件开发人员最常使用的存储类型。\n\
  \n#### 近线存储类别\n\n此类别用于不经常访问的数据，通常指一个月内访问不超过一次的数据。一般来说，近线存储用于存放数据。\n\n#### 冷线存储类别\n\
  \n此类别用于通常每三个月访问不超过一次的记录。\n\n#### 归档存储类别\n\n此类别用于访问频率最低的数据，常用于数据的长期保存。\n\n## 使用 Google\
  \ Cloud Storage\n\n本书涵盖的大多数练习都从云存储输入数据，因此让我们看看如何创建云存储桶并将文件上传到存储桶中。\n\n### 步骤 1：打开云存储\n\
  \n按照 图 1.20 中描述的步骤打开云存储：\n\n![](img/Figure_1.20.png)\n\n**图 1.20：云存储创建**\n\n1. \
  \ 用户可以在搜索框中输入 cloud storage。\n2.  或者，用户可以在 STORAGE 下导航至 Cloud Storage | Browser。\n\
  \n### 步骤 2：创建存储桶\n\n用户在创建存储桶后，可以将文件或文件夹上传到云存储。按照 图 1.21 所示启动存储桶创建流程：\n\n![](img/Figure_1.21.png)\n\
  \n**图 1.21：新建存储桶**\n\n1.  点击 CREATE BUCKET（创建存储桶）。\n\n### 步骤 3：为存储桶提供名称\n\n按照 图\
  \ 1.22 所示步骤为存储桶添加名称、标签：\n\n![](img/Figure_1.22.png)\n\n**图 1.22：存储桶名称**\n\n1.  用户需要为存储桶提供全局唯一的名称。\n\
  2.  标签是可选的，它提供键值对以将存储桶（甚至服务）归类在一起。\n3.  点击 Continue（继续）。\n\n### 步骤 4：选择存储桶的位置\n\n\
  按照 图 1.23 中的步骤选择存储桶的位置：\n\n![](img/Figure_1.23.png)\n\n**图 1.23：存储桶的位置**\n\n1. \
  \ 用户可以选择位置类型。多区域提供选择美洲、欧洲或亚洲多个区域的选项。双区域提供选择属于同一大陆（美洲、欧洲和亚太地区）的两个区域的选项。区域提供下拉列表供选择单个区域。对于本书涵盖的大多数练习，我们将数据上传到属于单个区域的存储桶中。\n\
  2.  点击 Continue（继续）。\n\n### 步骤 5：选择存储类别\n\n按照 图 1.24 所示步骤选择存储类别：\n\n![](img/Figure_1.24.png)\n\
  \n**图 1.24：存储桶的存储类别**\n\n1.  选择 Standard（标准存储）（本书涵盖的练习将创建标准存储桶）。\n2.  点击 Continue（继续）。\n\
  \n> **注意：** 尝试为位置和存储类别提供不同的选项，并观察价格预估的变化。\n\n### 步骤 6：存储桶的访问控制\n\n按照 图 1.25 中描述的步骤配置存储桶的访问控制：\n\
  \n![](img/Figure_1.25.png)\n\n**图 1.25：存储桶的访问控制**\n\n1.  勾选该框可防止来自互联网的公共访问，如果选择此选项，将无法通过\
  \ IAM 政策提供公共访问权限。\n2.  统一访问控制对属于该存储桶的所有文件夹和文件应用相同的 IAM 政策（选择 Uniform/统一）\n3.  与统一访问控制相反，细粒度访问控制为单个文件和文件夹指定政策。\n\
  4.  点击 Continue（继续）。\n\n### 步骤 7：存储桶中的数据保护\n\n按照 图 1.26 中描述的步骤进行数据保护：\n\n![](img/Figure_1.26.png)\n\
  \n**图 1.26：存储桶的数据保护**\n\n1.  GCP 为数据保护提供了额外选项，对象版本控制帮助用户进行数据恢复，保留政策有助于合规性（数据上传后在最短时间内无法删除）。\n\
  2.  上传到 GCP 的所有数据都将由 Google 管理的加密密钥加密，如果用户需要更多控制权，可以选择客户管理的加密密钥 (CMEK)。\n3.  点击\
  \ Create（创建）。\n\n### 步骤 8：将文件上传到存储桶\n\n按照 图 1.27 中描述的步骤将文件上传到云存储：\n\n![](img/Figure_1.27.png)\n\
  \n**图 1.27：文件上传到存储桶**\n\n1.  OBJECTS（对象）为用户提供上传数据的选项。\n2.  在存储桶内 CREATE FOLDER（创建文件夹）。\n\
  3.  直接从本地系统 UPLOAD FOLDER（上传文件夹）。\n4.  上传文件。\n5.  用户在存储桶创建过程中选择的所有选项将列在 Configuration（配置）下。\n\
  \n\n\n\n\n## 6. 权限\n\n`PERMISSIONS` 提供选项以启用防止公共访问，或更改统一访问/细粒度访问。此外，它还提供添加用户以访问存储桶的选项。\n\
  \n## 7. 保护\n\n`PROTECTION` 选项卡提供启用或禁用对象版本控制和保留策略的选项。\n\n## 8. 生命周期\n\n当满足特定条件时，`LIFECYCLE`\
  \ 规则允许您对存储桶中的项目执行操作。\n\n### 存储桶的删除\n\n按照 图 1.28 中描述的步骤删除存储桶：\n\n![](img/Figure_1.28.png)\n\
  \n**图 1.28：存储桶删除**\n\n1.  选择需要删除的存储桶。\n2.  点击 `DELETE`，将弹出一个提示框，要求用户输入 `delete`。\n\
  \n## 计算\n\n计算服务的提供是任何云服务产品的基本组成部分。Google 为希望在云端托管其应用程序的公司提供的最重要的产品之一称为 Google Compute\
  \ Services。“计算”这一统称涵盖了各种专业服务、配置选择和产品，所有这些均可供您使用。\n\n用户可以访问 Google Cloud 提供的计算和托管设施，并可从以下可用选项中进行选择：\n\
  \n### Compute Engine\n\n用户可通过使用 Google Compute Engine（一种 IaaS 平台）在云中构建和使用虚拟机作为服务器资源。用户无需采购或管理物理服务器硬件。虚拟机是托管在云中的服务器，将在\
  \ Google 的数据中心运行。它们为中央处理器 (CPU) 和图形处理器 (GPU)、内存和存储提供可配置选项，此外还提供多种操作系统选项。访问虚拟机时，既可使用命令行界面\
  \ (CLI)，也可使用 Web 控制台。当计算引擎被退役时，所有数据将被擦除。因此，可通过使用传统硬盘驱动器或固态硬盘来确保数据持久性。\n\n`Hypervisor`\
  \ 是运行虚拟机的组件。Hypervisor 是安装在宿主操作系统上的一种软件，负责创建和运行多个虚拟机。宿主计算机上的 Hypervisor 通过允许虚拟机共享宿主资源，使得运行多个虚拟机成为可能。图\
  \ 1.29 展示了虚拟机、Hypervisor 和物理基础设施之间的关系。\n\n![](img/Figure_1.29.png)\n\n**图 1.29：Compute\
  \ Engine**\n\n在定价、稳定性、备份、可扩展性和安全性方面，使用 Google Compute Engine 是一个不错的选择。它是一种具有成本效益的解决方案，因为用户只需为其使用资源的时长付费。它支持将虚拟机从一台宿主机实时迁移到另一台，这有助于保证系统的可靠性。此外，它还拥有可靠、内置且冗余的备份机制。它通过预留资源，帮助并保证应用程序在扩展时拥有所需的容量。计算引擎将为运行在其上的应用程序提供额外的安全性。\n\
  \nCompute Engine 适用于迁移成熟系统，或对操作系统及其他运维特性进行细粒度管理。\n\n### Kubernetes Engine\n\nGoogle\
  \ Kubernetes Engine（简称 GKE）是 GCP 的容器即服务产品。在部署容器化应用时，通过开源的 Kubernetes 集群管理系统来管理集群。Kubernetes\
  \ 为用户提供与容器集群交互所需的功能。Kubernetes 系统包含控制平面和工作节点两个组件。工作节点作为计算引擎提供算力。\n\n![](img/Figure_1.30.png)\n\
  \n**图 1.30：Kubernetes Engine**\n\n虚拟机运行在客户操作系统和 Hypervisor 上；而使用 Kubernetes Engine\
  \ 时，计算资源被隔离在容器中，由容器管理器和宿主操作系统共同管理。\n\n独特功能包括自动升级、节点自动维护和自动扩缩容（当应用程序承受压力时，Kubernetes\
  \ Engine 将分配额外资源）。\n\n*   用户将获得高级集群管理功能作为额外福利，例如负载均衡、节点池、日志记录和监控。\n*   Compute Engine\
  \ 实例提供负载均衡和分发。\n*   在集群内，节点池用于标识节点子集，以提供更大的灵活性。\n*   结合 Cloud Monitoring 的日志记录和监控功能，使您能够洞察集群内部情况。\n\
  \n### Google App Engine\n\nGCP 为开发和部署可扩展应用提供的平台即服务称为 Google App Engine。它是一种无服务器计算形式，使用户能够在无需设置虚拟机或\
  \ Kubernetes 集群的计算环境中运行代码。\n\n它兼容多种编程语言，包括 Java、Python、Node.js 和 Go。用户可选择任意受支持的语言开发应用。Google\
  \ App Engine 配备多种 API 和服务，使开发者能够创建功能强大且特性丰富的应用程序。这些特性包括：\n\n*   访问应用日志\n*   Blobstore，用于服务大型数据对象\n\
  \n其他重要特性包括按量付费策略，即仅为所用资源付费。当使用应用的用户数量激增时，App Engine 会立即增加可用资源，反之亦然。\n\n高效的诊断服务包括\
  \ Cloud Monitoring 和 Cloud Logging，协助运行应用扫描以定位应用故障。应用报告文档帮助开发者立即修复发现的任何故障。\n\n作为\
  \ A/B 测试的一个组成部分，流量拆分功能允许 App Engine 自动将不同版本的传入流量导向不同的应用迭代版本。用户可根据哪个软件版本运行最有效，规划后续的迭代增量。\n\
  \nApp Engine 分为两种不同类型：\n\n*   **Standard App Engine**：应用完全独立于服务器的操作系统以及可能同时在该服务器上运行的任何其他应用。除了应用代码外，无需安装任何操作系统软件包或其他预构建软件。\n\
  *   **Flexible App Engine**：用户在 App Engine 环境中运行 Docker 容器。此外，为运行应用代码，还需安装库或其他第三方软件。\n\
  \n### Google Cloud Functions\n\nGoogle Cloud Function 是一种用于事件驱动处理的轻量级无服务器计算解决方案。它是\
  \ GCP 的函数即服务 (FaaS) 产品。通过使用 Cloud Functions，可消除维护服务器、设置软件、升级框架和修补操作系统等耗时任务。\n\n\n\
  \n\n## Cloud Functions\n\n用户必须为 Cloud Functions 提供代码，以便在事件发生时开始运行，因为 GCP 完全管理软件和基础设施。云事件是指在云计算环境中发生的事件，例如数据库中存储的数据发生变化、存储系统中添加了新文件，甚至新虚拟机的创建都是此类操作的实例。触发器是指您对某个特定事件或一组事件感兴趣的声明。将函数绑定到触发器可让用户捕获事件并对其采取行动。事件数据是在事件触发器导致函数执行时传递给\
  \ Cloud Function 的数据：\n\n![](img/Figure_1.31.png)\n\n**图 1.31：Cloud Function**\n\
  \n## GCP 计算服务摘要\n\nGCP 计算服务的摘要可见于 图 1.32：\n\n![](img/Figure_1.32.png)\n\n**图 1.32：计算服务摘要**\n\
  \n## Compute Engine 创建（VM 实例）\n\nCompute Engine 实例可运行 Google 的公共 Linux 和 Windows\
  \ Server 镜像以及私有自定义镜像。Docker 容器也可部署在 Container-Optimized OS 公共镜像实例上。用户在创建时需要指定区域、操作系统和机器配置类型（虚拟\
  \ CPU 数量和 RAM）。每个 Compute Engine 实例都有一个包含操作系统的小型持久启动磁盘，且可添加更多存储空间。VM 实例默认时间为协调世界时\
  \ (UTC)。请按以下步骤创建虚拟机实例：\n\n### 步骤 1：打开 Compute Engine\n\n按 图 1.33 所述步骤打开平台的 Compute\
  \ Engine：\n\n![](img/Figure_1.33.png)\n\n**图 1.33：VM 创建**\n\n1. 用户可在搜索框中输入 `Compute\
  \ Engine`。\n2. 或者，用户可在 `Compute` -> `Compute Engine` | `VM instances` 下导航。\n\n###\
  \ 步骤 2：启用 Compute Engine API\n\n当首次访问资源时，系统会提示用户启用 API，如 图 1.34 所示：\n\n![](img/Figure_1.34.png)\n\
  \n**图 1.34：VM 创建 API 启用**\n\n1. 如果提示启用 API，请启用该 API。\n\n### 步骤 3：VM 实例选择\n\n按 图\
  \ 1.35 所述步骤选择 VM：\n\n![](img/Figure_1.35.png)\n\n**图 1.35：VM 创建**\n\n1. 选择 `VM instances`。\n\
  2. 点击 `CREATE INSTANCE` 开始创建过程。\n3. GCP 提供 `IMPORT VM` 选项用于 Compute Engine 迁移。\n\
  \n### 步骤 4：VM 实例创建\n\n按 图 1.36 所述步骤为 VM 实例选择位置和机器类型：\n\n![](img/Figure_1.36.png)\n\
  \n**图 1.36：VM 实例的位置和机器选择**\n\n1. GCP 提供多种 VM 创建选项，第一种是从头创建 VM。我们将创建一个 `New VM instance`。\n\
  2. VM 可从模板创建。用户可创建模板以供将来使用。\n3. VM 可从机器镜像创建，机器镜像是存储配置、元数据及其他创建 VM 所需信息的资源。\n4. GCP\
  \ 还提供将现成解决方案部署到 VM 实例的选项。\n5. 实例名称由用户指定。\n6. 标签为可选项，它们提供键值对以将 VM 分组。\n7. 选择区域和可用区。\n\
  8. GCP 在机器配置方面提供广泛选项，从 `GENERAL-PURPOSE`、`COMPUTE-OPTIMIZED`、`MEMORY-OPTIMIZED`\
  \ 到基于 `GPU` 的机型。\n9. 在每个机器系列配置下，GCP 提供几个系列机型和机器类型（用于在 CPU 和内存之间选择）。\n10. 用户可选择 CPU\
  \ 平台和 GPU，如果想选择 vCPU 与核心比率及可见核心数。\n\n> **注意：** 尝试选择不同的机器配置并观察预估价格的变化。\n\n### 步骤\
  \ 5：VM 实例磁盘和容器选择\n\n按 图 1.37 所述步骤为实例选择启动磁盘：\n\n![](img/Figure_1.37.png)\n\n**图 1.37：VM\
  \ 实例的启动磁盘选择**\n\n1. 启用显示工具，启用屏幕录制工具的使用。\n2. 通过保持此 VM 内存加密来保护使用中的数据。\n3. `Deploy\
  \ Container` 选项在需要使用容器优化的 OS 镜像将容器部署到 VM 实例时非常有用。\n4. 用户可通过点击 `change` 更改操作系统、硬盘大小和类型\
  \ (HDD/SSD)。\n\n### 步骤 6：VM 实例创建访问设置\n\n按 图 1.38 所述步骤配置访问权限：\n\n![](img/Figure_1.38.png)\n\
  \n**图 1.38：VM 实例的访问控制**\n\n1. 选择设置与 VM 实例关联的默认服务账号，或用户可创建服务账号并将其用于 Compute Engine。\n\
  2. 用户需选择 VM 的访问方式，可选择 `allow default access`，或 `allow all the APIs` 或仅允许特定 API 访问\
  \ VM。\n3. 默认情况下，所有互联网流量均被阻断，我们需要启用它们。\n4. `networking`、`disks`、`security` 和 `management`\
  \ 下提供了磁盘保护、预留、网络标签、更改主机名、实例删除时删除或保留启动磁盘等附加选项。\n5. 点击 `Create`。\n\n## 访问 VM 实例\n\n\
  虚拟机创建后，将列在 `VM instances` 下，如 图 1.39 所示：\n\n![](img/Figure_1.39.png)\n\n**图 1.39：VM\
  \ 实例已创建并列在 VM 实例下**\n\n1. 点击实例类型查看 VM 详情（包括 VM 的区域、可用区、机器配置、CPU 利用率、内存利用率的负载监控等）。\n\
  2. `Internal IP address` 为子网 IP 地址。\n3. `External IP address` 用于与外部设备通信。\n4. `SSH`\
  \ 用于连接到 VM。\n\n### 步骤 1：访问 VM\n\n按 图 1.40 和 图 1.41 所述步骤访问创建的 VM 实例：\n\n![](img/Figure_1.40.png)\n\
  \n**图 1.40：访问 VM**\n\n1. 点击 `SSH` 选项并选择 `open in browser window`。\n\n新窗口将打开，SSH\
  \ 密钥将被传输并建立连接，如 图 1.41 所示：\n\n![](img/Figure_1.41.png)\n\n**图 1.41：访问 VM**\n\n在窗口中尝试以下命令：\n\
  \na. `Hostname`（获取 VM 实例名称）\nb. `Lsblk`（获取磁盘信息）\nc. `Sudo su –`（检查 root 权限）\nd.\
  \ `Logout`（退出 root 权限）\ne. `Cat /etc/os\\-release`（查看操作系统详情）\nf. `Logout`（关闭连接）\n\
  \n## 删除 VM 实例\n\n按 图 1.42 所述步骤删除 VM 实例：\n\n![](img/Figure_1.42.png)\n\n**图 1.42：VM\
  \ 的删除**\n\n1. 点击三个点并选择 `Delete`。\n2. 弹出窗口将请求确认。\n\n> **注意：** 所有计算资源在任何平台上都很昂贵，使用后请务必释放它们。\n\
  \n## BigQuery\n\n任何人都可以使用 BigQuery 在几秒钟内分析 TB 级数据，BigQuery 是 Google Cloud Platform\
  \ 提供的全托管无服务器数据仓库解决方案。它通过机器学习、地理空间分析和商业智能等内置功能，简化了数据的管理和分析。BigQuery 的无服务器架构利用 SQL\
  \ 查询为组织提供最紧迫问题的答案，且无需管理底层基础设施。\n\n\n\n\n## Google BigQuery 架构\n\nGoogle BigQuery\
  \ 架构建立在 **Dremel** 之上，Dremel 是 Google 设计的一种分布式系统，用于查询海量数据库。在 Dremel 中，查询的执行被分解为\
  \ **槽位**，即使众多用户并发搜索数据库，也能保证公平性。在底层，Dremel 使用 **Jupiter**（Google 的内部数据中心网络）来访问分布式文件系统（昵称为\
  \ **Colossus**）上的数据存储。Jupiter 也是 Google Cloud Storage 的骨干网络。数据复制、数据恢复和数据分发管理均由 Colossus\
  \ 处理。BigQuery 对其数据采用 **列式存储结构**，从而实现了高压缩比和高扫描吞吐量。另一方面，您也可以将 BigQuery 与存储在其他 Google\
  \ Cloud 服务中的数据配合使用，例如 **Bigtable**、**Cloud Storage**、**Cloud SQL** 和 **Google Drive**。\n\
  \n得益于专为处理海量数据而设计的架构，当 BigQuery 获取数 PB 信息进行评估时，性能达到峰值。BigQuery 最适合人们需要对只读数据集进行交互式临时查询的用例。在大多数情况下，针对关系数据库的复杂分析查询需要运行数秒。这正是使用\
  \ BigQuery 的理想场景，这也是为什么它常被用在大数据 ETL 流水线的末端、处理过的数据之上。由于自带缓存，BigQuery 在数据不发生频繁变更的情况下表现非常出色。\n\
  \n由于它是一项完全托管的服务，无需安装、设置或维护任何底层基础设施即可正常运行。客户仅为其存储的数据量和对数据库运行的查询次数付费。\n\n## 使用 BigQuery\n\
  \n### 步骤 1：打开 BigQuery\n\n按照 图 1.43 中描述的步骤打开 BigQuery：\n\n![](img/Figure_1.43.png)\n\
