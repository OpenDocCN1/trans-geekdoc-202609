  \n1.  新创建的 Workbench。\n2.  点击 **打开 JUPYTERLAB**。\n\n## 流水线代码演练\n\n我们将使用 Python 3\
  \ 笔记本文件来输入命令、创建流水线、编译和运行它。请按照以下步骤创建 Python 文件并输入本节给出的 Python 代码。\n\n### 步骤 1：创建\
  \ Python 笔记本文件\n\nWorkbench 创建完成后，打开 JupyterLab 并按照 图 7.8 中提到的步骤创建 Python 笔记本文件：\n\
  \n![图 7.8：新启动器窗口](img/Figure_7.8.png)\n\n1.  点击 **新启动器**。\n2.  双击 **Python 3** 笔记本文件以创建一个。\n\
  \n从步骤 2 开始，在单独的单元格中运行给定的代码。\n\n### 步骤 2：软件包安装\n\n运行以下命令以安装 Kubeflow、Google Cloud\
  \ Pipeline 和 Google Cloud AI Platform 软件包。（安装软件包需要几分钟）：\n\n```\nUSER_FLAG = \"--user\"\
  \n\n!pip3 install {USER_FLAG} google-cloud-aiplatform==1.3.0 --upgrade\n!pip3 install\
  \ {USER_FLAG} kfp --upgrade\n!pip install google_cloud_pipeline_components\n```\n\
  \n### 步骤 3：内核重启\n\n在下一个单元格中输入以下命令以重启内核。（用户也可以从 GUI 重启内核）：\n\n```\nimport os\n\n\
  if not os.getenv(\"IS_TESTING\"):\n    import IPython\n    app = IPython.Application.instance()\n\
  \    app.kernel.do_shutdown(True)\n```\n\n### 步骤 4：启用 API\n\n运行以下代码行以启用 API。我们过去常从\
  \ Cloud Shell 启用 API。这是从 Python 笔记本启用 API 的另一种方式（除 Cloud Resource Manager 外，所有其他\
  \ API 在前几章中已启用）：\n\n```\n!gcloud services enable compute.googleapis.com \\\n  containerregistry.googleapis.com\
  \ \\\n  aiplatform.googleapis.com \\\n  cloudbuild.googleapis.com \\\n  cloudfunctions.googleapis.com\
  \ \\\n  cloudresourcemanager.googleapis.com\n```\n\n如果所有 API 都成功启用，将打印成功消息，如 图 7.9\
  \ 所示：\n\n![图 7.9：API 成功启用](img/Figure_7.9.png)\n\n\n\n\n\n### 图 7.9：API 成功启用\n\n\
  ### 步骤 5：导入包\n\n在新单元格中运行以下代码行以导入所需的包：\n\n```\nfrom typing import NamedTuple\n\n\
  from kfp.v2 import dsl\n\nfrom kfp.v2.dsl import (Artifact, Dataset, Input, Model,\
  \ Output, Metrics, ClassificationMetrics, component, OutputPath, InputPath)\n\n\
  from kfp.v2 import compiler\n\nfrom google.cloud import BigQuery\n\nfrom google.cloud\
  \ import aiplatform\n\nfrom google.cloud.aiplatform import pipeline_jobs\n\nfrom\
  \ datetime import datetime\n```\n\n使用 Vertex AI 流水线，我们将从 BigQuery 中可用的数据创建数据集，应用最少的数据转换，并拆分数据用于训练和测试目的。然后我们使用训练数据集训练模型，并在测试数据集上评估模型性能。我们在流水线的每个阶段将工件（或中间输出）保存到\
  \ Cloud Storage。\n\n### 步骤 6：用于存储流水线工件的存储桶\n\n运行以下代码行以设置存储工件的位置。存储桶将在流水线运行期间创建：\n\
  \n```\nUSER_FLAG = \"--user\"\n\nREGION = \"us-central1\"\n\n### 设置环境路径\nPATH =\
  \ %env PATH\n\n%env PATH={PATH}:/home/jupyter/.local/bin\n\n### 获取项目名称\nshell_output\
  \ = !gcloud config get-value project 2> /dev/null\n\nPROJECT_ID = shell_output[0]\n\
  \n### 设置存储桶名称以存储工件\nBUCKET_NAME = \"gs://\" + PROJECT_ID + \"-bucket-employee\"\n\
  \nPIPELINE_ROOT = f\"{BUCKET_NAME}/pipeline_root_employee/\"\n\nPIPELINE_ROOT\n\
  ```\n\n### 步骤 7：流水线的第一个组件（从 BigQuery 获取数据）\n\n运行下述代码以定义将包含在流水线中的模型评估和阈值比较的自定义组件。关于代码的重要要点：\n\
  \n*   `@component` 装饰器用于将此函数定义为流水线的一个组件。\n*   组件的输入将是需要从中获取数据的 BigQuery 表的位置：\n\n\
  ```\n#### 流水线中的第一个组件，用于从 big query 获取数据。\n\n@component(\n    packages_to_install=[\"\
  google-cloud-bigquery==2.34.1\", \"pandas\", \"pyarrow\", \"db-dtypes\", \"scikit-learn\"\
  ],\n    base_image=\"python:3.7\",\n    output_component_file=\"data_fetch_bigquery.yaml\"\
  \n)\ndef get_data(bq_table: str, output_data_path: Output[Dataset]):\n    from google.cloud\
  \ import bigquery\n    import pandas as pd\n\n    bqclient = bigquery.Client()\n\
  \    table = bigquery.TableReference.from_string(bq_table)\n    rows = bqclient.list_rows(table)\n\
  \    dataframe = rows.to_dataframe(create_bqstorage_client=True)\n    dataframe.to_csv(output_data_path.path\
  \ + \".csv\", index=False, encoding='utf-8-sig')\n```\n\n### 步骤 8：流水线的第二个组件（数据转换）\n\
  \n运行以下代码以定义流水线的第二个组件。它将应用数据转换并将数据拆分为训练样本和测试样本。此组件的输入将是来自前一个组件的数据集，输出将是两个单独的数据集。\n\
  \n```\n#### 流水线中的第二个组件，用于应用数据转换和拆分数据\n\n@component(\n    packages_to_install=[\"\
  scikit-learn\", \"pandas\"],\n    base_image=\"python:3.7\",\n    output_component_file=\"\
  data_transformation.yaml\",\n)\ndef data_transformation(\n    dataset: Input[Dataset],\n\
  \    dataset_train: Output[Dataset],\n    dataset_test: Output[Dataset]\n):\n  \
  \  from sklearn.metrics import roc_curve\n    from sklearn.model_selection import\
  \ train_test_split\n    from joblib import dump\n    from sklearn.metrics import\
  \ confusion_matrix\n    from sklearn.tree import DecisionTreeClassifier\n    from\
  \ sklearn.ensemble import RandomForestClassifier\n    import pandas as pd\n\n  \
  \  data = pd.read_csv(dataset.path + \".csv\")\n    data = data.copy()\n    data\
  \ = data.drop(['region', 'employee_id'], axis=1)\n    data = data.dropna(axis=0)\n\
  \    data['gender'] = data['gender'].replace({'f': 0, 'm': 1})\n    dummies = pd.get_dummies(data['department'])\n\
  \    data = pd.concat([data, dummies], axis=1)\n    data = data.drop('department',\
  \ axis=1)\n\n    edu_ranking = {\"Master's & above\": 1, \"Bachelor's\": 2, \"Below\
  \ Secondary\": 3}\n    recruit_ranking = {'sourcing': 1, 'other': 2, 'referred':\
  \ 3}\n\n    data['education'] = data['education'].map(edu_ranking)\n    data['recruitment_channel']\
  \ = data['recruitment_channel'].map(recruit_ranking)\n\n    train, test = train_test_split(data,\
  \ test_size=0.3)\n\n    train.to_csv(dataset_train.path + \".csv\", index=False,\
  \ encoding='utf-8-sig')\n    test.to_csv(dataset_test.path + \".csv\", index=False,\
  \ encoding='utf-8-sig')\n```\n\n### 步骤 9：流水线的第三个组件（模型训练）\n\n运行以下代码以定义流水线的第三个组件。它将在训练数据集上训练模型（随机森林分类器）。此组件的输入将是来自第二个组件的训练数据集，输出将是训练好的模型：\n\
  \n```\n#### 第三个组件 模型训练\n\n@component(\n    packages_to_install=[\n        \"pandas\"\
  ,\n        \"scikit-learn\",\n    ],\n    base_image=\"python:3.9\",\n)\ndef emp_promotion_training(\n\
  \    dataset: Input[Dataset],\n    model: Output[Model],\n):\n    from sklearn.ensemble\
  \ import RandomForestClassifier\n    import pandas as pd\n    import pickle\n\n\
  \    data = pd.read_csv(dataset.path + \".csv\")\n    model_rf = RandomForestClassifier(n_estimators=10)\n\
  \    model_rf.fit(\n        data.drop(columns=[\"is_promoted\"]),\n        data.is_promoted,\n\
  \    )\n    model.metadata[\"framework\"] = \"random forest\"\n    file_name = model.path\
  \ + \".pkl\"\n    with open(file_name, 'wb') as file:\n        pickle.dump(model_rf,\
  \ file)\n```\n\n### 步骤 10：流水线的第四个组件（模型评估）\n\n运行以下代码以定义流水线的第四个组件。它将从第三个组件导入训练好的模型，并从第二个组件导入测试数据集。它在测试数据集上检查模型性能并记录模型指标：\n\
  \n```\n#### 第四个组件 模型评估\n\n@component(\n    packages_to_install=[\n        \"pandas\"\
  ,\n        \"scikit-learn\"\n    ],\n    base_image=\"python:3.9\",\n)\ndef model_evaluation(\n\
  \    test_set: Input[Dataset],\n    trained_model: Input[Model],\n    metrics: Output[ClassificationMetrics],\n\
  \    kpi: Output[Metrics]\n):\n    from sklearn.ensemble import RandomForestClassifier\n\
  \    import pandas as pd\n    import logging\n    import pickle\n    from sklearn.metrics\
  \ import roc_curve, confusion_matrix, accuracy_score, recall_score, precision_score\n\
  \    import json\n    import typing\n\n    data = pd.read_csv(test_set.path + \"\
  .csv\")\n    model = RandomForestClassifier()\n    file_name = trained_model.path\
  \ + \".pkl\"\n    with open(file_name, 'rb') as file:\n        model = pickle.load(file)\n\
  \n    y_test = data.drop(columns=[\"is_promoted\"])\n    y_target = data.is_promoted\n\
  \    y_pred = model.predict(y_test)\n    y_scores = model.predict_proba(data.drop(columns=[\"\
  is_promoted\"]))[:, 1]\n\n    fpr, tpr, thresholds = roc_curve(\n        y_true=data.is_promoted.to_numpy(),\
  \ y_score=y_scores, pos_label=True\n    )\n\n    metrics.log_roc_curve(fpr.tolist(),\
  \ tpr.tolist(), thresholds.tolist())\n\n    metrics.log_confusion_matrix(\n    \
  \    [\"False\", \"True\"],\n        confusion_matrix(\n            data.is_promoted,\
  \ y_pred\n        ).tolist(),\n    )\n\n    accuracy = accuracy_score(data.is_promoted,\
  \ y_pred.round())\n    recall = recall_score(data.is_promoted, y_pred.round(), pos_label=1)\n\
  \    precision = precision_score(data.is_promoted, y_pred.round(), pos_label=1)\n\
  \n    trained_model.metadata[\"accuracy\"] = float(accuracy)\n    trained_model.metadata[\"\
  recall\"] = float(recall)\n    trained_model.metadata[\"precision\"] = float(precision)\n\
  \n    kpi.log_metric(\"accuracy\", float(accuracy))\n    kpi.log_metric(\"recall\"\
  , float(recall))\n    kpi.log_metric(\"precision\", float(precision))\n```\n\n###\
  \ 步骤 11：流水线构建\n\n运行以下代码以使用自定义组件定义流水线：\n\n*   `@kfp.dsl.pipeline` 装饰器用于将此函数定义为流水线。\n\
  *   组件的输入将是训练好的模型（和工件），这些将从 `Input[Artifacts]` 收集。\n\n\n\n\n\n### 函数 `fetch_eval_info`\n\
  \n函数 `fetch_eval_info` 将从训练好的模型工件中获取评估数据，这些数据将被传递给 `metrics_log_check` 函数，以检查模型性能是否高于阈值，并返回值为\
  \ `true`（如果模型性能优于阈值）或 `false`（否则）。\n\n```python\n@dsl.pipeline(\n    # 默认流水线根目录。提交流水线时可覆盖它。\n\
  \    pipeline_root=PIPELINE_ROOT,\n    # 流水线的名称。用于确定流水线上下文。\n    name=\"employee-pipeline-rf\"\
  ,\n)\ndef pipeline(\n    bq_table: str = \"vertex-ai-gcp-1.employee_data.employee_promotion_data\"\
  ,\n    project: str = PROJECT_ID,\n    region: str = REGION,\n    display_name:\
  \ str = 'pipeline-employeepromotion-rf-job{}'.format(datetime.now().strftime(\"\
