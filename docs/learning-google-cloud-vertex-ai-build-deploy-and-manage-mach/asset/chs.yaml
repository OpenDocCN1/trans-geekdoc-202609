  \n---\n\n# 第 8 章：使用 TensorFlow Extended 的流水线\n\n## 简介\n\n在上一章中，我们使用 Kubeflow 处理了\
  \ GCP 的流水线，并为自定义模型训练构建了第一条流水线。在本章中，我们将开始了解 TFX 及其组件，以及如何使用这些组件进行自定义模型训练。\n\n## 结构\n\
  \n在本章中，我们将讨论以下主题：\n\n*   什么是 TensorFlow Extended (TFX)\n*   TFX 流水线\n*   TFX 的组件\n\
  *   用于构建流水线的数据\n*   流水线代码演示\n*   资源的删除\n\n## 目标\n\n在本章结束时，用户将能够使用标准组件构建 TFX 流水线，并使用\
  \ Kubeflow 执行流水线。\n\n## 什么是 TensorFlow Extended\n\n毫无疑问，将机器学习和深度学习模型投入生产极具挑战性。即使它为企业创造了额外价值，但相比建模本身，它更加耗时且容易失败。模型部署后必须进行维护。我们必须评估其功能、新生成数据的质量以及支持基础设施的适用性。必须根据需要对模型进行重新训练。为了长期可行，整个过程必须尽可能减少人工干预并实现自动化。此外，我们必须确保所使用的模型是可靠的、一致的、安全的，并且可能具备可扩展性。Google\
  \ 于 2019 年初正式推出了其内部平台 TensorFlow Extended，以帮助企业实施工业级的端到端生产系统。\n\nTFX 旨在成为一个强大且通用的端到端机器学习平台。它构建在\
  \ TensorFlow (TF) 包之上，这些包允许 Python 程序员创建自定义函数。TFX 封装了整个 TensorFlow 生态系统（从 Keras\
  \ 到数据验证再到服务），使用户能够构建和运行可扩展且高效的机器学习流水线，而不仅仅是允许他们以高性能方式服务模型。它被构建为一系列可调整的组件，要求用户编写更少的代码。\n\
  \n## TFX 流水线\n\nTFX 流水线是机器学习过程的一种实现，具有可移植性，可以在各种编排器上运行，例如 `Kubeflow Pipelines`、`Apache\
  \ Beam` 和 `Apache Airflow`。流水线的构建块称为组件和输入参数。\n\n组件实例的输出是工件，而组件实例的输入通常由上游组件实例生成的工件组成。有向无环图\
  \ (DAG) 是使用工件创建的，它决定了流水线的执行顺序。\n\n## TFX 的组件\n\n流水线将机器学习工作流分解为一系列组件，每个组件负责机器学习过程中的某个特定阶段。TFX\
  \ 将标准组件和自定义组件作为单独的类别提供。用户也可以仅使用少数标准组件来构建流水线。\n\n借助自定义组件，机器学习过程可以得到扩展。构建组件是根据用户需求定制的，例如从闭源系统吸收数据、应用数据增强、采样、将用\
  \ Python 以外语言开发的工具集成到您的机器学习过程中（如使用 R 进行数据分析）等。\n\nTFX 中的组件由组件规范和执行器类组成，两者都包含在组件接口类中。组件的规范定义了组件的输入和输出契约。该契约概述了组件的输入和输出工件，以及执行组件过程中应用的参数。组件的执行器类负责实现组件负责执行的任务。规范和执行器被组合到一个接口类中，以便在\
  \ TFX 流水线中使用该组件。\n\n组件的执行分三个步骤进行：\n\n1.  **驱动程序**：根据元数据决定需要做什么，并协调作业执行\n2.  **执行器**：执行完成用户贡献的当前项目作业代码的实际工作\n\
  3.  **发布器**：负责收集执行器的结果并更新元数据库。\n\n如果只需要标准功能，则无需更改构成驱动程序或发布器的代码。我们只需扩展执行器，即可在保持相同输入、输出和执行属性的前提下修改执行器。也可以编写一个完全定制的执行器，以实现完全不同的一组功能。\n\
  \n## 自定义组件的类型\n\n有三种自定义组件：基于 Python 函数、基于容器，以及完全自定义的组件：\n\n*   **Python 函数**：构建基于函数的\
  \ Python 组件比构建基于容器的组件或从头构建的组件更容易。类型注解显示参数是输入工件、输出工件还是参数。这些注解位于 Python 函数的参数中。\n\
  *   **基于容器**：基于容器的组件允许您将用任何语言编写的代码添加到流水线中，只要该代码可以在 Docker 容器中运行。\n*   **完全自定义**：您可以通过定义组件规范、组件执行器和组件接口的类来构建完全自定义的组件。\n\
  \nTFX 中有库和流水线组件。下图展示了 TFX 库和流水线组件之间的关系：\n\n![](img/Figure_8.1.png)\n\n图 8.1：TFX\
  \ 的库和组件 1\n\n1 图片来源：[`www.tensorflow.org/tfx/guide`](https://www.tensorflow.org/tfx/guide)\n\
  \n## 自定义组件的功能\n\n让我们了解这些组件的功能。\n\n*   **ExampleGen**：TFX 流水线组件 `ExampleGen` 作为入口点并摄取数据。当作为输入使用时，`ExampleGen`\
  \ 会自动扫描并使用外部数据源，包括 CSV、TF Records、Avro 和 Parquet。`ExampleGen` 生成 TF 示例（也称为 TF 序列示例）作为输出。这些示例在执行数据集表示方面特别有效，并且可以被后续组件可靠地读取。\n\
  *   **StatisticsGen**：其他流水线组件可以使用 `StatisticsGen` TFX 流水线组件生成的统计信息。这些统计信息可以针对训练数据和服务数据生成。\n\
  \n\n\n\n\n## TFX 组件概述\n\n#### SchemaGen\nSchemaGen 使用数据描述（称为 Schema，即 `schema.proto`\
  \ 类的实例）来供 TFX 组件使用。它可以指定特征值的数据类型、可接受值的范围、特征是否必须存在于所有样本中以及其他特性。此外，SchemaGen 流水线组件会通过从训练数据推断类型、类别和范围来自动构建\
  \ Schema。\n\n#### ExampleValidator\nExampleValidator 是流水线组件，用于查找用于训练和服务的数据中的异常。它可以识别数据中的几类异常。此外，它还可以：\n\
  \n- 通过将数据统计信息与详述用户期望的 Schema 进行比较，执行有效性检查。\n- 对比训练数据和服务数据，以查找两者之间的任何差异。\n- 检查数据系列，以识别任何数据漂移实例。\n\
  \n#### Transform\n`ExampleGen` 组件负责输出数据工件，而 `Transform` TFX 流水线组件负责对这些工件执行特征工程。`Transform`\
  \ 组件从外部来源导入数据 Schema 工件，或使用由 `SchemaGen` 生成的数据 Schema 工件。\n\n#### Trainer\n`Trainer`\
  \ TFX 是流水线组件，负责训练 TensorFlow 模型。`Trainer` 组件为推理生成至少一个模型，并以兼容 TensorFlow SavedModel\
  \ 的格式存储。一个可信的模型将包含完整的 TensorFlow 程序，包括所有权重和计算。\n\n### Tuner\n`Tuner` 组件负责微调模型的超参数。`Tuner`\
  \ 是 TFX 组件家族中最新加入的成员，严重依赖 Python Keras Tuner API 来调整超参数。转换后的数据以 Transform 图工件的形式提供，供\
  \ `Tuner` 组件作为输入，`Tuner` 组件输出超参数工件。\n\n### Evaluator\n由 `Trainer` 开发的模型将被 `Evaluator`\
  \ 组件使用，该组件将使用原始输入数据工件。此外，它将利用 TensorFlow Model Analysis 库进行综合分析。\n\n### InfraValidator\n\
  在将模型发送到生产环境之前，作为 TFX 组件的 `InfraValidator` 作为早期预警层，用于捕获任何潜在问题。模型验证发生在实际为模型提供服务的基础设施中，因此得名\
  \ `InfraValidator`。如果 `Evaluator` 保证模型将按预期执行，则 `InfraValidator` 也将保证模型不会有任何机械问题。\n\
  \n### Pusher\n在模型训练或重新训练过程中，`Pusher` 组件用于将已验证的模型发送到部署目标。\n\n## 流水线构建数据\n\n对于此练习，数据从\
  \ Kaggle 下载（链接如下），数据集列在 CC0：公共领域许可证下。数据包含来自 EEG 的各种测量值，眼睛状态通过摄像头捕获。1 表示闭眼，0 表示睁眼。\n\
  \n[`www.kaggle.com/datasets/robikscube/eye-state-classification-eeg-dataset`](https://www.kaggle.com/datasets/robikscube/eye-state-classification-eeg-dataset)\n\
  \n在 us-centra1（单区域）下创建了 `tfx_pipeline_input_data` 存储桶，并将 csv 文件上传到该存储桶，如图 8.2 所示：\n\
