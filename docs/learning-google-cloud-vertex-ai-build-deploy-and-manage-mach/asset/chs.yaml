  \n### 步骤 4：模型监控\n\n按照图 2.27 所示步骤，在生产环境中启用模型监控：\n\n![](img/Figure_2.27.png)\n\n**图\
  \ 2.27：模型监控**\n\n1.  用户可以为已部署的模型启用模型监控（模型也可以在不启用监控的情况下部署）。\n2.  为监控作业提供名称。\n3. \
  \ 监控将由多个作业完成。需要提供作业的时间长度。如果预期负载较高，则建议设置较低的数值，反之亦然。\n4.  用于接收警报的邮箱地址。\n5.  可在监控窗口内选择请求的百分比进行采样。\n\
  \n输入架构对于 AutoML 模型是可选的，可以忽略。向下滚动并点击**继续**。\n\n### 步骤 5：监控目标\n\n模型性能会随时间下降。按照图 2.28\
  \ 所示步骤选择模型监控目标：\n\n![](img/Figure_2.28.png)\n\n**图 2.28：监控目标**\n\n1.  预测请求记录在同一项目的\
  \ BigQuery 表中。然后分析记录请求中包含的输入特征值，以检测偏差或漂移（这需要训练数据进行比较）。\n2.  模型监控跟踪特征对模型预测贡献随时间的变化（不需要训练数据）。\n\
  3.  由于我们选择了偏差检测，用户需要提供训练数据选项。\n4.  选择用于训练 AutoML 模型的数据集。\n5.  提供目标列名称。\n6.  点击**部署**。\n\
  \n将模型部署到端点需要几分钟时间。\n\n### 步骤 6：测试已部署的模型\n\n按照图 2.29 所示步骤，在进行在线预测之前，在平台上测试已部署的模型：\n\
