  - AI 对全球实践的影响
- - '###'
  - 创新与技术中的 AI：随着人工智能的采用，世界变得更智能、具创新。使用 Google Maps 进行路线规划、Uber 和 Lyft定价、过滤垃圾邮件、在线购物与推荐以及疾病检测，都是简化我们生活的人工智能技术。人工智能在全球范围内进入每个领域的速度不可议，迫使组织采用人工智能，这也使企业、政策制定者、创新者和研究人员适应开发新的业务价值（Soni
    et al., 2019）。
