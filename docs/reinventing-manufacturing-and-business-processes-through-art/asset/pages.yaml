    # 1.3 ROLE OF AI IN ADOPTING GHRM PRACTICES


    Organizations—whether in developing or developed economies—have already adopted
    modern technologies to improve their operations and processes. For instance, using
    Big Data analytics to analyze the trends and patterns of recruitment, sales and
    production has now become common for organizations, but implementing AI for adopting
    GHRM practices is still in its nascent stage. With its smart and solution oriented
    technologies, AI has become the key to attain sustainable competitive advantage;
    however, it is still limited to few companies. One reason for this reluctance
    is the inability of talent to manage such applications and another the fear of
    losing jobs as machines replace human effort. On contrary, AI improves work efficiency
    and reduces human effort which can be used for attaining green practices. Recently,
    an application has been developed by an Indian IT company named “AskDester” which
    manages 22,000 employees by handling HR functions like solving employees'' queries
    about leave and company policies (Garg et al., 2018). This also provides information
    about upcoming job opportunities and openings. AI is helpful to perform various
    HR functions. Figure 1.3 explains the role of AI in GHRM practices.


