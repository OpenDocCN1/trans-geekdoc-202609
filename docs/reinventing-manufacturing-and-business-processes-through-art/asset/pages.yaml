  md: '# 2


    # Reinventing Processes Through AI


    # 1.2 REVIEW OF LITERATURE


    # 1.2.1 ARTIFICIAL INTELLIGENCE


    AI is not a new concept for developing or developed economies. AI is the science
    and engineering of making intelligent machines, especially intelligent computer
    programs (McCarthy, 1989). AI is an innovative tool used for transforming the
    role of management and organizational practices (Kshetri, 2021; Sharma & Rana,
    2021). It is a subpart of computer science, which is concerned with making computers
    so sophisticated that they can act smartly (Nilson, 1980). It includes various
    intelligent tasks performed by computers on behalf of human beings such as recognition,
    reasoning and learning (Hilker, 1986). AI has changed the pattern of work and
    decision-making abilities for many organizations with its smart logical approach
    such as genetic algorithms, neural networks, data mining, text analysis and interactive
    voice recognition applications (Lauterbach, 2019; Stromeier & Piazza, 2015). It
    improves the decision-making and cost-effectiveness of making decisions on real-time
    data (Kahraman et al., 2011; Rana & Sharma, 2017; Lawler & Elliot, 2009). However,
    the question arises: What is artificial intelligence? Is it a tool, an application,
    software, a methodology or a thought? AI cannot be defined in terms of a written
    definition, but researchers defined artificial intelligence in technical and sociological
    terms.


    A review study tries to explain artificial intelligence through the lens of social
    sciences and technology (Lauterbach, 2019). As per social sciences, AI has been
    described as artificial narrow intelligence, artificial general intelligence and
    artificial super intelligence. Artificial narrow intelligence (ANI) focuses on
    specializing one task or function of the organization, which might be scheduling
    a meeting, recognizing voices, or human touch. Machine learning in games (Go Jeopardy!),
    self-driving cars, automated assistants (Apple Siri, Amazon Alexa, Google Now
    and Microsoft Cortana) are examples of AI (Bundy, 2017). Artificial general intelligence
    (AGI) is interdisciplinary in nature and provides multiple solutions for single
    problems which the decision-makers to select the appropriate solution out of the
    available ones (Voss, 2007). A applications use sensory data (visual or auditory)
    and deal with attributes to present data for researchers and analysts. Artificial
    super intelligence (ASI) is defined as, “an intellect that is much smaller than
    the best human brains in practically every field, including scientific creativity,
    general wisdom and social skills” (Bstrom, 2014, pp. 109–114).


    On the other hand, AI has also been explained through technological background.
    Technological AI is further disseminated in machine learning technologies and
    perception technologies. Machine learning technologies (ML) focuses on copying
    the human skills and thinking to presume in order to provide better analytical
    results. It helps in improving the efficiency and performance automatically for
    a given task by observing the relevant data. It is mostly used for research and
    development projects, speech recognition, lie detection, image recognition and
    several other tasks which depend on human intelligence and decision-making skills.
    Perception technologies include computer vision and natural language processing.
