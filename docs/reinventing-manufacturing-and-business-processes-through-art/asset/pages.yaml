    # 5.5 CONCLUSION


    Accurate prediction on the customer behavior for suggesting a shopping list or
    fore-casting the next basket of the customer is very critical to provide efficient,
    customized service to the customer. The prudent way to maximize is to improve
    customer satisfaction. This survey discusses various approaches such as machine
    learning, data mining and neural network employed by the data analyst to analyze
    customer behavior. A comparison of the machine learning algorithms is made using
    performance evaluation measures, and the logistic regression is selected as the
    best predictive model which accurately predicts the interests of consumers.


