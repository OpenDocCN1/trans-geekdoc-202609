    # 3.3.4 Haar Cascade and Its Classifiers


    Haar cascade is an object detection algorithm used in machine learning (Padilla
    et al., 2012). It also helps in identification of objects whether the object is
    a non-living thing, a human being or something else.


    According to Singh et al (2013), Haar cascade generally contains four steps in
    its algorithm:


    +   - Selection of features in object

    - Data gathering (making datasets)

    - Training of the model

    - Give output (identifying object on the basis of datasets)


    In the first step, we select particular features of an object by which we can
    identify that particular object. For example, In human face that features are
    eyes, nose, smile, whole front-face or side-face.


    In the second step, with the help of computer vision (mostly via a camera), we
    take many images of the feature that we focused on in the previous step, keeping
    in mind that more images equals accuracy during identification.


    In the third step, we train the system depending upon the number of images that
    we take as input gathering.


    In the fourth step, we define output as perfect if the system identifies an object
    on which it has been trained.


    For this work, we use output of different classifiers of Haar cascade to compare
    their accuracy of identifying a particular face. These classifiers use features
    of the human face: eye, nose, smile, front-face and side-face. To check accuracy
    at a particular time, we take particular number of images for one test then change
    numbers of images for another test (Le, 2011; Yang and Wang, 2016).'
