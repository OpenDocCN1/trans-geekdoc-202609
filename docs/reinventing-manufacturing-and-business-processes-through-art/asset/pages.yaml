    comments, ethical lapses and acquiescence risk, so they can intervene before creating
    big problems in department.


    # 8.6.6 INTEGRATION—ARTIFICIAL INTELLIGENCE HR INTEGRATION


    Digital technology is also playing important role in HR integration. The transparency
    and customized operation in the workplace through AI interventions improves employees''
    loyalty. The performance of employees can be easily evaluated without bias; they
    are given chances for career advancement inside the company. It also helps in
    appraisal and detects candidates for promotions and other rewards. Employee morale
    and performance is improved. The employees'' external mobility will be reduced,
    and employee advocacy will increase. The company needs not waste spending on hiring
    and training new employees, because current ones will not leave the company. AI
    technology acts as assistant, performer and consultant, and can be used to solve
    many HR problems like stereotypes, employee management, (Jia et al., 2018). AI
    gives companies tangible intangible benefits.


    # 8.6.7 Emerging Issue—ARTIFICIAL INTELLIGENCE HR SYSTEMS


    AI makes the HR manager''s task easier and less consuming, reducing their workload.
    AI-enabled systems automatically respond to employees'' queries and manage the
    work. Automating low-cost, repeatable tasks gives HR managers time to help with
    the most important administrative work. The use of a "virtual assistant system"
    in composing emails, organizing meetings, coordinating participants and managing
    calendars; through this, it will gradually collect particulars and expand services
    by gripping the experience of employees and their continuaries (Jia et al., 2018).
    AI-based software plays an important role in HR strategy; it helps in employee
    management, human resource accounting, HRIS, managing payrolls, revising company
    policies and practices, investigating company compliance, creating strategies,
    etc. (Jacobs, 2019).


