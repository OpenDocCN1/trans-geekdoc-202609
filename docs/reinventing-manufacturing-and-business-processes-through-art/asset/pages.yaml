  md: '# Reinventing Processes Through AI


    # 2.3 BLOCKCHAIN TECHNOLOGY OVERVIEW


    Blockchain technology was launched in 2008 and was created by the hidden persons
    behind the online cash currency Bitcoin, by the pseudonym of Satoshi Nakamoto
    (Wikimedia Foundation, Inc., 2010), a well-known Japanese name.


    Today, as predicted by a scientist, blockchain is not only a digital currency,
    but also has the potential to grow be a data hub of the global record-keeping
    systems for corporations and governments.


    The concept of blockchain is a decentralized and distributed ledger technology
    (DLT) that is used for recording transactions and monitoring digital assets. The
    official definition of a blockchain is the two important components of a distributed
    ledger with smart contracts.


    +   - A ledger is used to record transactions that capture all changes to a set
    of business objects. In a distributed ledger system, organizations collaborate
    with each other to maintain a consistent copy of a replicated ledger in a process
    that is called consensus or agreed-correct transaction.

    - A smart contract is defined by the rules and conditions to query a ledger and
    generate new transactions that are recorded in or. Smart contracts describe the
    lifecycle of one or many business objects that are stored on the ledger with the
    time and author of creation, updates, and query activities.


    In system architecture, blockchain is a specific type of database. In order to
    be able to understand blockchain, it is necessary to first understand what a database
    actually is.


    # 2.3.1 THE GENERATIONS OF BLOCKCHAIN


    If you are researching, reading, and following news of banking, financing, investing
    and cryptocurrency during recent years, you would have heard the term of the blockchain,
    a technology for using the record-keeping technology behind the digital currency
    networks.


    Blockchain technology is still an important development, but we can divide the
    history of blockchain into at least four important generations, as shown in Table
    2.1.


    # TABLE 2.1


    # The Generations of Blockchain


    | Generation | Year | Description | Use Cases |

    |---|---|---|-|

    | 1st generation | 1991–2008 | Store and transfer of value based on coins with
    proof of work | Bitcoin |

    | 2nd generation | 2008–2014 | Blockchain 2.0 based on coins with tokens | Ripple
    |

