    # 5.1 INTRODUCTION


    The primary objective is to analyze the forecast of personalized customer behavior
    based on the individual level or segment level modeling approaches. The data collected
    in e-commerce sites are available resources to predict customer behavior, which
    acts as a vital task to adopt a technique to predict the sales. These analyses
    are helpful for organizations to determine what the customers want and strategies
    can be adopted to match the customers with the organization. The customer behavior
    analysis at an individual level or segment-based strategies are developed to satisfy
    the customer and make them come back for more.


    Predicting the next basket balances the demand-driven supply chain of an organization.
    This forecast plays a vital role in some of the planning and decision-making of
    an enterprise. The market growth of an organization is highly dependent on predicting
    customer behavior accurately. Accurate prediction of customer behavior leads to
    effective revenue generation for the company. Analysis of customer behavior ensures
    the satisfaction of the customer and also increases the loyalty of the customers
    towards the enterprise. There have been more than 17,800 papers referred to customer
    behavior analysis since 2016, of which the 21 most related papers were referred
    for this survey. This survey analyzes customer behavior using various approaches
    such as machine learning, data mining and neural networks using a predictive model
    approach to recommend the next basket shopping list. It gives an evaluation method
    for validating and comparison of the result obtained by various techniques.


    The predictive analysis methodologies are discussed in Section 5.2. Section 5.3
    summarizes the techniques employed to forecast customer behavior. Evaluation of
    the performance and results derived from it is discussed in Section 5.4. Section
    5.5 concludes that predictive modeling performance may differ with the employed
    machine learning algorithm and exhibits logistic regression as the best model
    in comparison.


    # 5.2 METHODOLOGIES


    The predictive analysis methodologies of data as shown in Figure 5.1 are collection
    and preprocessing, data analysis, outlier detection, training and prediction.
    The machine learning algorithms such as random forest, support vector machine,
    decision tree, logistic regression, naive Bayes and K-means clustering techniques,
    using data mining, hybrid model, neural network and individual-and segment-level
    approaches, are employed to forecast customer behavior. Performance and results
    are computed along with the comparison were made between F-measure and mRHR value
    of individual-and and segment-level approaches where logistic regression exhibits
    the best model results.'
