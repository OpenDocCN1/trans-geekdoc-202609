    FIGURE 8.1 Conventional model of functions of human resource management.


    **Planning:** Planning is the first important step of any successful enterprise.

    This function deals with the plans, programs, strategies, procedures and policies
    to achieve the desired results. It includes upcoming course of action to reach
    adequate results.


    **Organizing:** After planning for the future, the next step is to allocate tasks
    and responsibilities among employees. This includes identifying employee activities,
    assigning duties, delegating authority and coordinating activities of individuals
    and groups.


    **Directing:** Directing involves getting employees together, commanding and motivating
    them to do work effectively to achieve organizational goals.'
