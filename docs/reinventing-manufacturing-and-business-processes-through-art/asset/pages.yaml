    media footprint of a person, AI algorithms may have identified them as having
    certain tendencies or possessing traits. Further suggested reading and advertising
    might be so specifically aimed at the person that they soon start interacting
    only with sites that have similar biases and traits. This robs the person of the
    chance to change their opinions through serendipitously on a site that may have
    promoted them to question their heretofore held beliefs. Low-skilled, labor-intensive
    jobs will be lost,


    With increasing use of AI, the nature of jobs will change. While high-skilled
    jobs will be created. Unfortunately, as education is still not universally accessible
    to all, many people will be rendered without the means to earn a life, further
    expanding economic inequality. Even for those with access to education, they will
    have to learn how to interpret AI outputs and design solutions on the basis of
    data-driven insights. With increased automation, the owners of businesses will
    benefit more than the employees of the business.


    With respect to the environment, AI has the potential to study climate change
    patterns, analyze its causes and even recommend correct action. By practicing
    precision agriculture, we could reduce farming inputs without compromising the
    output quality or quality. However, there is one major disadvantage of AI that
    does not find a mention in literature. This is the large carbon footprint in running.
    For every system that has to be developed and used by consumers, there are energy
    requirements, which when multiplied by the proposed number of users in the future,
    would become substantial. With the current rate of energy production from renewable
    energy sources, and the likely demand placed on the energy systems by AI-driven
    information and communication technology systems, it is possible that AI will
    be largely by non-renewable energy sources, which will nullify many of the environmentally
    sustainable achievements in the different sectors in this chapter.


    # 9.7 CONCLUSION


    AI has its share of believers and skeptics. However, it is a fact that it is already
    a part of our lives and only play a bigger role in the future. Like electricity,
    the internet and many of the big innovations that turned out to be infection points
    in the history of humankind, AI is also bringing about a paradigm shift in the
    ways things are being done and perceived, impacting all aspects of life on earth.
    Given that it has the capability to surpass humans, even in cognitive functions
    like decision-making, AI has to be carefully promoted to make life comfortable,
    better and thereby more sustainable for people.


