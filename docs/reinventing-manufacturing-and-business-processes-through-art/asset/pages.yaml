    performance appraisal system, green safety and health provision, green employee
    and labor relations (Ahmad, 2015; Chaudhary, 2019; Gholami et al., 2016; Guerci
    et al., 2016; Jabbour, 2013; Jabbour et al., 2010; Jackson et al., 2021; O’Donohue
    & Turga, 2016; Renwick et al., 2018; Rana & Sharma, 2019; Srivastava et al., 2020;
