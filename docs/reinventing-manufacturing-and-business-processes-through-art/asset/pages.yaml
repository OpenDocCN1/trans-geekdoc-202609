    # 7.7.3.3 Predictive Maintenance


    In predictive maintenance, the prediction of the equipment''s failure is carried
    out by examining the current condition of the equipment. For example, in the automobile,
    the period of changing the engine is predicted from the engine''s appearance.
    Due to the development of sensors and artificial intelligence, the reliability
    of predictive maintenance is increased. The prediction of bearing failure can
    be made by sensor data like vibration, sound, current speed and temperature (Cakir
    et al., 2021)


    # 7.7.3.4 Autonomous Maintenance


    The equipment carries out autonomous maintenance daily before starting the equipment.
    This consists of checking lubricant level, noise level, pressure, etc. The maintenance
    departments provide a set of instructions to carry out the autonomous maintenance.
    Augmented reality can be a very efficient tool for training the operator for autonomous
    maintenance (Jia et al., 2021).


    # 7.7.3.5 Breakdown Maintenance


    The previously mentioned types of maintenance do not stop the machine from working,
    but in case of breakdown, maintenance equipment cannot perform the task, so immediate
    maintenance is required. Even if a machine is in operating condition despite the
    breakdown, it is not recommended to operate due to safety issues. For example,
    in the case of an automobile, the vehicle cannot be operated if there is a puncture
    in the wheel. If the brake fails, the vehicle can be operated but this is not
    recommended due to safety issues. Breakdown maintenance causes delays in manufacturing,
    so it is essential to avoid equipment breakdown. By using the previously mentioned
    maintenance techniques, reduction in breakdown is possible. The digital twin can
    be used to reduce the repair time during the equipment''s breakdown (Aivalialotis
    et al., 2019).


