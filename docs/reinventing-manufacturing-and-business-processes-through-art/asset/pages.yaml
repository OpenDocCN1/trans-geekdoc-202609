- pgno: 80
  md: '# Reinventing Processes Through AI


    play a crucial role in the future not only of manufacturing, but in other fields
    as well. Although the concept of artificial intelligence was discussed as early
    as in the 1940s by Alan Turing, its growth has been exponential in the last decade.
    Researchers who focused on AI as Lin et al. (2017) mentioned that AI is used properly
    and effectively, there is no need for fear about the adverse effects of AI. Smart
    and intelligent AI systems improve the quality of life of humans in many aspects.


    Artificial intelligence is the ability of a system to understand and analyze data,
    to learn and become familiar with it and to use the knowledge to perform assigned
    tasks and reached goals with possibilities to adapt to situations presented. AI
    can help reducing human error and also shift focus to productive areas. Smart
    manufacturing is notably projected among many businesses in recent years. The
    advancement is growing into a new area of “intelligent manufacturing” which clearly
    reflects the impact of AI smart technologies on the manufacturing sector. It is
    estimated that the “intelligent manufacturing” market will be over $200 billion
    in the year 2021 and is expected to increase to over $320 billion by 2022, showing
    annual growth rate of 12.5% (Duke et al., 2020). Major companies like GE, Bosch
    and Microsoft started their investments in artificial intelligence long ago, the
    significant goal use of machine learning–based programs to improve all aspects
    of manufacturing. The major reasons for using AI in manufacturing are to cut costs,
    decrease product defects, reduce unplanned downtimes and also to increase productivity
    (Wang, 2019). While it might be possible for huge corporations to look into the
    possibility of using AI technology development strategy in manufacturing, this
    may not be for smaller manufacturers as of. Despite AI being a manufacturing sector
    revolution, it comes with its disadvantages high cost of implementation. AI is
    also generally thought of as lacking adaptivity and creativity. High growth in
    artificial intelligence is considered a reason for global unemployment risk, but
    companies claim that it is a widespread misconception that AI will reduce human
    employment. Even though AI development is projected to beat a high pace, like
    many technologically disruptive innovations before, adoption of AI is slowed by
    concerns about costs, scalability and security.


    This chapter aims to provide a bird’s eye view of the future changes in the field
    of manufacturing due to the impact of the use of AI. The opportunities, threats
    and changes that one can expect are also touched upon.


    # 4.1.1 LITERATURE Review


    # 4.1.1.1 Overview of AI—Technology


    This section gives an overview about AI technology and the various aspects of
    AI in manufacturing sector.


    The progress of AI is said to be one of the most significant events in recent
    past. AI refers to “any computer system able to perform tasks that generally require
    human intelligence,” according to the dictionary (Pillai et al., 2021). The ability
    of AI can be comprehended from three major sources:


    +   First, availability of a huge volume of data fueled by the “Internet of Things.”'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Artificial Intelligence in Manufacturing


    +   - Second, the ability to perceive things; that is, the ability of the system
    to identify and recognize voice and images.

    - Third, problem-solving ability; that is, the ability to continuously learn and
    improve.


    AI is a pervasive technology, the use and impact of which expand across all sectors
    of the economy, ranging from manufacturing and healthcare to media. Adoption of
    AI can play an important role in forwarding sustainable development (Haenlein
    & Kaplan, 2019).


    # 4.1.1.2 Need for AI in the Manufacturing Domain


    AI is more relevant in the area of manufacturing because of the following reasons:

    Shortage of expertise: One concern cited by manufacturing companies is the shortage
    of required expertise (Chien et al., 2020). This is due to the fact that workers
    retire or resign, they take away their experience and knowledge with them. The
    concern for organizations is not only to capture tacit experience and knowledge,
    but also to ensure that the knowledge is shared across different verticals within
    the organization (Li et al., 2017). Certain areas in which this problem could
    occur production planning and process planning, detection or diagnosing issues
    in machinery.


    Highly complex situations: A major issue in manufacturing is the complexity involved
    in the decision-making process (Dubey et al., 2020); Rana et al., 2017). A firm
    will have lots of choices and opportunities to make decisions. The choices can
    be in designing of a product, production scheduling or inventory management. The
    constant changes in the needs of customers with very high expectations only adds
    to many complex challenges involved.


    High amount of information required: Due to the high awareness among customers,
    shortening lead time and varying requirements, a high amount of information needs
    to be shared among various supply chain partners (Kumar, 2017). The requirement
    to process this high level of information requires high capabilities on the computing
    front (Cioffi et al., 2020).


    # 4.1.1.3 AI in the Manufacturing Sector


    AI in the manufacturing domain is expected to automate repetitive and boring human
    tasks, while factory workers spend their time on more complex, creative and innovative
    tasks. Automation will not only substitute for labor, but also complement labor
    and increase productivity in many ways (Rana et al., 2019). AI collects virtual
    data as support for product development (Nti et al., 2021). AI virtual data can
    be used to monitor and improve shop performance. The manufacturing sector can
    use AI to identify unplanned downtime and accidents, and can also plan for machinery
    maintenance or repairs beforehand (Kusiak, 2017). Unstable price of raw materials
    is one of the challenges for manufacturers, and to combat this, AI algorithms
    can be used to predict material prices helping the firm to cope with unstable
    materials prices to remain competitive in the market (Lee et al., 2019). AI robots
    can be used as manufacturing robots for automating repetitive'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 66


    # Reinventing Processes Through AI


    and reducing human error. An AI robot can monitor its accuracy and performance,
    and can correct itself (Abd Aziz et al., 2021).


    # 4.1.1.4 Advantages of Implementing AI in Manufacturing


    Implementing AI in manufacturing will help organizations with defect detection
    as AI and self-learning capabilities can save many hours in quality control (Nikolic
    et al., 2017). Similarly, AI can be adopted for quality assurance as using image
    processing algorithms to spontaneously check whether an item has been perfectly
    manufactured (Kim et al., 2018). AI helps in assembly line integration by creating
    an interconnected application that extracts data from IoT connected equipment
    to ensure correct operation. Additionally, implementation of AI helps an generate
    designs for its products. The algorithm then checks all possible outcomes of a
    solution and suggests design alternatives (Hayhoe et al., 2019).


    # Implementation of AI in Manufacturing Will Enable


    +   - Mass customization (Wu et al., 2017).

    - Implementation of robots (Sharp et al., 2018).

    - Predictive maintenance that would help a firm to minimize its operation and
    maintenance costs (Nica et al., 2021).

    - Software as a Service (SaaS): AI-based supply chain management solutions (Tao
    et al., 2018).

    - Improve human–robot collaboration (Zhou et al., 2018).


    AI and machine learning tools can create a unified ecosystem enabling continuous
    exchange of information. This makes the system self-sustaining, and also improves
    the process in every facet of supply chain management (Alonso, 2020).


    # 4.1.1.5 AI as a Catalyst to Smart Manufacturing


    AI can monitor thousands of data sources relating to manufacturing, with analysis
    of any news, event or incident that could affect production (Mao et al., 2019).
    It would help organizations to deepen their customer insight and understanding
    (Alexopoulos et al., 2020). Through AI, organizations can customize and create
    easy-to-understand dashboards that capture customers real-time alerts when any
    incident occurs during production (Ghabakhloo & Ching, 2019). It reduces the time
    taken to identify potential issues in production activity, enabling rapid response
    to address such issues before they escalate. AI quantifies and lowers the risk
    of incidents across the supply chain and during production (Gahramani et al.,
    2020) It enables more informed decisions regarding the overall manufacturing process.
    Finally, AI helps to improve customer loyalty and the bottom line.


    # 4.2 OBJECTIVES


    +   - To understand the advantages of AI for manufacturing companies.

    - To understand the disadvantages of adopting AI with respect to manufacturing
    companies.'
