    # 1.2.2 Green Human Resource Management


    With the constantly increasing pressure of environmentalists to maintain and preserve
    a pollution-free environment, organizations cannot avoid the implementation of
    HRM practices (Jabbour, 2013; Pham et al., 2019). Another reason for the same
    is increasing customer awareness and concern of job seekers about organizational
    policies towards maintaining a sustainable and green environment (Teveira et al.,
    2012). Organizations cannot attain sustainable competitive advantage without leveraging
    the talent of their employees, and talented employees can only be retained with
    effective HRM policies. Furthermore, HRM has attracted the interest of various
    scholars, researchers, policymakers and academics after the research initiated
    by a small group of researchers (Jabbour & Santos, 2008; Thom & Rana, 2020; Jackson
    et al., 2011; Pham et al., 2019; Renwick et al., 2016; Yang et al., 2019a, 2019b).
    Implementation of HRM practices also helped organizations to minimize carbon emissions,
    for paperless approaches and wasted production in manufacturing units (Ahmad,
    2015; Yong et al., 2019a). GHRM has been considered as a sustainable change for
    the organizations (Sawang & Kivits, 2014).


    GHRM can be defined as HRM-related aspects of environmental management (EM) and
    the role of HRM in preventing environmental pollution using organizational procedures
    (Renwick et al., 2008; Renwick et al., 2013). HRM practices have been a combination
    of original HRM practices and strategic HRM measures of organizations to preserve
    and sustain green environment (Gholami et al., 2016). GHRM practices depend on
    three components: developing green ability, motivating green employees and facilitating
    green opportunity to the employees (Renwick et al., 2013). These practices and
    measures resolve around the main HRM functions which are disseminated into recruitment
    and selection, training and development, performance management, compensation
    and reward management, and finally talent retention. HRM functions support organizations
    in implementing environmental measures by formulating environmental goals (Cohen,
    2012). HRM also serves as a partner to formulate environment-based values and
    strategies to attain sustainability. HRM functions are further divided by the
    basis of antecedents practices. Table 1.1 divides the HRM functions as


