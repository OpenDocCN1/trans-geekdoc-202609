    stored in the database, and finds the closest (facial metrics). Facial recognition
    has numerous practical applications such as security, access control and surveillance
    systems; that is why in the last decade, a number of algorithms have been published
    and show improvement in terms of identification. A formal method of classifying
    faces was first proposed by Francis Galton (1888). Galton proposed a method for
    collecting facial profiles as curves and finding their norm, and based on the
    deviations from the norm, classifies faces with other profiles. This type of classification
    is multi-model classification; it provides results in independent measures of
    vectors and these vectors could be compared with others in the stored database.
    Continuous progress in the algorithm and advancing technology has explored real-world
    application and implementation for facial recognition systems. Facial recognition
    in early stage works on detection of face patterns in clustered scenes; those
