    customer segments are formed using clustering)(Peker et al., 2018; Zhuang et al.,
    2019; Zhao et al., 2019). The classification and clustering of the sales dataset
    are done using ML algorithms. This survey conducts a review on neural techniques
    and a few other machine learning algorithms which are used to forecast, random
    forest, support vector machine (SVM), decision tree, and logistic regression.


    # 5.2.5.1 Random Forest


    The collected dataset is preprocessed, then analyzed and important customer attributes
    are extracted from the large dataset. To construct a forest of trees determining
    customer behavior, random forest is to be applied to the extracted features. Bagging
    and feature randomness is used to build individual tree, which then classified
    into targeted customer behaviors. The prediction is made using the voting technique.


    # 5.2.5.2 Support Vector Machine


    SVM can be employed to perform regression and classification. A multidimensional
    hyperplane is used to build SVM. The SVM algorithm identifies the hyperplane in
    An—number of features—and classifies the customer behavior distinctly based on
    the regularity of the customer visits to the e-commerce sites (Maheshwari & Packia
    Amutha Priya, 2017).


    # 5.2.5.3 Decision Tree


    The decision tree classifies customer behavior by recursive partitioning. It can
    be employed to analyze multiple variables. It is used to assign a label to customer
    behavior based on the highest score.


    # 5.2.5.4 Logistic Regression


    Logistic Regression (LR) is a predictive analysis algorithm that is used for classification
    problems. LR is used to predict the probabilistic value of the categorical dependent
    value between 0 and 1. It is used to determine the most influential variable that
    can be in classification. The relationship between the customer behavior and willingness
    to buy a product can also be derived using LR methodology, which can be used to
    classify the customer behavior into segments to predict the next basket list (Peker
    et al., 2018).


    # 5.2.5.5 Naive Bayes


    Naive Bayes is a classification algorithm used to solve classification problems.
    It makes use of probability to make predictions. It is a probabilistic classifier
    that learns the pattern and compares the contents with the list of words to classify
    the most probable class label for each object. When multiple features are described
    in the dataset, naive Bayes algorithm is broadly used. It can be used to forecast
    whether a customer will purchase the product or not. Naive Bayes is to derive
    accurate'
