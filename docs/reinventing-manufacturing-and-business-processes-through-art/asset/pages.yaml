    # 9.1 INTRODUCTION


    The Fourth Industrial Revolution is promising to change the way we do things on
    a scale and at a speed that we have not heretofore witnessed. Neither industry
    nor the academic world is clear on what the transformation will result in, nor
    will all be impacted and at what levels. However, disruptions are being seen in
    several sectors, and the breadth and depth of these transformations is mind-boggling!
    In all this uncertainty, the one demonstrable trend is the thinning of the boundaries
    between what was clearly thought of being physical, digital or biological.


    With substantial increases in computing power, storage capacity and easy access
    to information, the last few years have seen the rise of terms such as “artificial'
  merge: -1
  img_proc: true
