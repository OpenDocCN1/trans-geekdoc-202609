    # 2.3.3 TYPES OF BLOCKCHAIN


    Categorizing blockchain technology into two types of public blockchain or private
    blockchain is necessary for identifying the scope of use, type of users and the
    characteristics of blockchain applications. Currently, there are mainly the following
    types of blockchain applications.


    # 2.3.3.1 Public Blockchain


    Public blockchain is known as permissionless or so-called non-permission blockchain.
    It is fully distributed, with no restrictions on participation, and encourages
    more participants to join the network. Therefore, nobody will have complete control
    over the blockchain network.


    In the other words, a public blockchain is decentralized and does not have a single
    entity that controls the blockchain system. So, the data of a public blockchain
    are secure, as it is not possible to modify or update data once they have been
    validated on the blockchain network, as illustrated in the process diagram in
    Figure 2.8.


