    # 7.3 CHALLENGES OF IMPLEMENTING IOT IN METAL CUTTING


    The IoT objectives in metal cutting are to improve productivity, quality, capability,
    overall equipment efficiency (OEE), remote monitoring and control of the machine
    tool. The harsh environment due to high vibration and dust is the biggest challenge
    in implementing IoT in metal cutting industries. Volume, velocity, and variety
    are three majoranges generating the data collection in Industry 4.0. The problem
    of a variety of data can be solved by (Zhang et al., 2016). Also, there are many
    types of critical parameters—like cutting speed, depth of cut, temperature, and
    many—need to be stored to improve the machine tool''s efficiency in the metal
    cutting operation. The highly dynamic nature of the metal cutting process generates
    data at a very high rate. So the velocity of data in metal cutting is also a big
    challenge. The volume of data generated by multiple tools is too large.


    # 7.4 STAGES OF IOT IN METAL CUTTING


    It is not easy to convert existing traditional industries into IoT-enabled industries.
    It becomes more complex in the job production industries, where the product design
    and demand are not fixed. The following road map (Figure 7.1) can be used to implement
    IoT in metal cutting industries.


    +   1. Problem definition

    2. Data collection

    3. Data preprocessing

    4. Modeling

    5. Decision-making

    6. Implementation

    7. Monitoring and feedback


