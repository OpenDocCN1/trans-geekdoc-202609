    # 6.1.1 EVOLUTION AND HISTORY OF INDUSTRIAL REVOLUTIONS


    The industrial revolution is primarily known as an era in which work started to
    be accomplished more and by machines in industrial units rather than in homes.
    More advancement in science and automation have constantly encouraged world and
    industrial progress in international business, facilitating us to provide more
    definite as well clear means of the term in recent years (Belvedere et al., 2013).
    It is a concept and development that has changed our economy and society. The
    world development may give the impression to point out certain changes in this
    perspective of revolution, which truly indicates rapid and fundamental changes—undoubtedly,
    that key changes have happened within a relatively short period. Industrial development
    led to the replacement of small-scale factories, workshops and craft studios.
    The beginning of industries was first determined with textile and pottery factories,
    and entered into the new infrastructure of canals and railway lines, which enabled
    the efficient distribution. This was the actual conversion of undoubtedly to industrial,
    and their start of boom for both started (Van et al., 2014).


    The industrial revolution has always in the past linked with the advancement-of
    technological competencies. Persuasion of improved proficiency and yield makes
    the industrial sector one of the major players for the period of technical and
    industrial transformation and conception. Today, advancement and transformation
    is meant by the Fourth Industrial Revolution to facilitate an upgrading in technologies
    that could help us fulfill additional requirements which are potentially assembled
    in dispersed cyber-physical systems (CPS) in ingenious industrial units (Saturno
    et al., 2017).


    There is no universal agreement on what constitutes an industrial revolution (Maynard,
    2015), but according to the National Academy of Science and Engineering (2013),
    the general categorization of stages that have been defined from the perspective
    of industrial revolutions are as shown in Figure 6.1.


    The First Industrial Revolution is considered as the most significant in terms
    of civilization which begins with using water and steam-powered motorized engineering
    facilities at the end of the eighteenth century. The twentieth century started
    with the Second Revolution, the utilization of electricity powered mass production
    machinery with the use of division of labor. Later promoting automated manufacturing,
    the Third Revolution started in the mid-1970s by disseminate electronics and information
    technology (IT) in manufacturing units. The Fourth Industrial Revolution began
    with the use of artificial intelligence machine learning, the Internet of Things
    (IoT), and much more, as the IoT and cyber-physical systems have attracted and
    caught the attention of researchers (Atzori et al., 2010).'
