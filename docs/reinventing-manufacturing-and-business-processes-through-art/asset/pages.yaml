    to complete the project on time. To find the root cause of delay in machine shop,
    an IoT-based system is implemented to monitor value-added and non-value-added
    time.


    # 7.6 MEASURING THE VALUE-ADDED TIME


    In the machining process, when the actual manual cutting takes place is considered
    as value-added time. All other activities are considered as non-value-added time.
    It is challenging to measure real metal cutting tool manually in machining processes,
    so an automated measuring system is developed to measure the actual cutting time
    using the magnetic sensor. On the back side of the chuck of the machine tool,
    a magnet is attached, and on the headstock, a magnetic sensor is attached. Whenever
    the magnet passes near the magnetic sensor, a voltage change occurs in the sensor.
    If the chuck is rotating, there will continue to be changes in the voltage of
    the sensor. Thus, using the magnetic hall sensor data, we can find out if the
    chuck is rotating or steady. We can also find out the RPMs of the chuck using
    the frequency of change in voltage.


    # 7.7 MEASURING THE NON-VALUE-ADDED TIME


    Stoppages are classified into the following categories.


    +   1. Setup time

    2. Inevitable stoppages

    3. Maintenance

    4. Obligatory stoppages


    # 7.7.1 SETUP TIME


    Setup time is a period to prepare the machine tool for the machining. In project-based
    industries where frequent product changes occur, the monitoring of the setup time
    is essential. To calculate total setup time, we need to consider all the non-productive
    stoppages waiting for cranes, waiting for setup accessories and waiting for decisions,
    others.


    There is always the scope of reduction in the setup time in a project-based company.
    By controlling the setup time, we can increase the machine tool capacity.

    To collect all these non-value-added times, the HMI (human-machine interface)
    is installed near the machine. On the HMI keypad is mounted an LCD screen.'
