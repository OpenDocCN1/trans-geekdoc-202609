    # 2.1 INTRODUCTION


    Artificial Intelligence (AI) is not new; it is a branch of the computer science
    field of more than five decades that encompasses other related fields such as
    machine learning (ML) and deep learning (DL). Since the term AI became popular
    in human life in the mid-1950s (Anyoha, 2017), humans have started to live in
    the age of many concepts related to technologies such as Big Data, data transformation,
    Internet of Things (IoT), cryptocurrency, blockchain, etc.—an age when we have
    the capacity to develop machines and tools to help people handle daily activities.


    Today, AI''s potential and application for an immensity of sectors in human life
    is increasing constantly, even though it is in a hybrid pattern as an emerging
    or mid-stage technology. Through techniques such as machine learning and neural
    networks, global tech companies are investing in developing machines to think
    and behave like humans.


    AI application has already successfully in many industries such as manufacturing,
    technology, healthcare, logistics, banking, marketing, entertainment and education.
    We can continue to use the functions of AI-based systems to replicate or simulate
    human intelligence that can perform tasks requiring human intelligence such as
    planning, learning, reasoning, problem-solving and decision-making.


    Currently, numerous AI-based solutions and applications have been developed by
    researchers and corporations. However, the wide adoption of these solutions is
    an issue in resource-constrained AI and IoT ecosystems.


    In this chapter, integration of the available AI-based solutions into blockchain
    solutions is discussed, and the limitations and challenges of AI implementation
    in different blockchain sectors are presented.


    # 2.2 ARTIFICIAL INTELLIGENCE


    # 2.2.1 AI-BASED SYSTEMS IN THEORY CLASSIFICATION


    AI-based systems are classified into four types of machines: reactive AI machines,
    limited memory AI machines, theory of mind AI machines and self-aware AI machines.


    # 2.2.1.1 Reactive AI Machines


    Reactive AI machines are the oldest form of AI systems, and have extremely limited
    ability to form memories or use past experiences to inform current decisions.
    A reactive AI machine does not have memory-based functionality.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# The Role of AI in Blockchain Applications


    # 2.2.1.2 Limited Memory AI Machines


    Limited memory AI machines are machines that can look into historical data to
    make decisions. Today, most chatbots and virtual assistants for self-driving vehicles
    have been developed and driven by limited memory AI.


    # 2.2.1.3 Theory of Mind AI Machines


    Theory of mind AI machines are machines that—like people and other living things
    in the real world—can have thoughts and emotions that directly affect their behavior.
    The key features of these AI-based systems are the ability to understand these
    components by interacting needs, thoughts, emotions, beliefs and feelings.


    # 2.2.1.4 Self-Aware AI Machines


    The next generation of AI development is a self-aware AI machine with human-like
    systems that will not only be able to evolve and understand the behaviors as they
    interact, but also has desires and their own needs, beliefs and expectations.


    # 2.2.2 Types of Artificial Intelligence


    Today, the most popular classification in the AI science industry is the classification
    of technology into artificial narrow intelligence (ANI), artificial general intelligence
    (AGI) and artificial super intelligence (ASI), as shown in Figure 2.1.


    Based on the theoretical background and science research, Figure 2.1 presents
    the types of artificial intelligence.


    However, in special industries, a new AI model is a combination of AGI, ANI, and
    ASI into an AI-based system called hybrid artificial intelligence (HAI).


    # 2.2.2.1 Artificial Narrow Intelligence


    ANI, the so-called weak AI or narrow AI, is the only type of AI-based systems
    that humans have applied successfully today. It is oriented and designed to perform
    singular autonomous tasks using human-like capabilities.


    ![](img/b43ebe8eccbdc43447aca82fb7658570_37_0.png)


    FIGURE 2.1 Three types of AI.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Basically, ANI can do nothing more than what they are programmed to do, and
    thus have a very limited or narrow range of competencies such as the functionality
    of searching on the internet, facial recognition, speech recognition, voice assistants,
    advertisement recognition or self-driving car, as in the following list.


    # Virtual Assistants


    +   * Google search by Google

    * Siri by Apple

    * Alexa by Amazon

    * Cortana by Microsoft


    # Software and Robots


    +   * Image recognition software

    * Facial recognition software

    * Disease mapping software

    * Prediction software

    * Manufacturing robots

    * Drones

    * Industrial robots

    * Self-driving cars


    In other words, ANI has been impacting workforce performance and our expected
    outcome of using ANI is a human-like machine.*


    # 2.2.2.2 Artificial General Intelligence


    AGI is referred to as "strong AI" or "deep AI"; it is an AI-based system of a
    machine that can think, understand, distinguish, mimic, behave and act in a way
    that can solve any problem like a human in any situation.


    AGI is based on the theory of mind as mentioned previously, which refers to the
    ability to discern feelings, emotions, beliefs, needs, thoughts and desires of
    intelligent entities. Today, it is easy to find AGI frameworks in training machines
    to understand human thinking and speculation.


    AGI has been impacting human behavior, and our expected outcome of using AGI is
    an individual human-like brain.


    # 2.2.2.3 Artificial Super Intelligence


    ASI has marked the pinnacle of AI development, which has become by far the most
    intelligent on earth, and AI technology is not only already started to apply in
    many industries, but has also reshaped many models of services and productions
    up to now and will be changing business in the next decade.


    ASI has been impacting human behavior, and our expected outcome of using ASI is
    a social human-like brain.


    # 2.2.2.4 Hybrid Artificial Intelligence


    HAI is designed and programmed to complete multiple tasks with one or many kinds
    of virtual assistant systems from Siri assistants to self-driving cars and autonomous
    weapons.'
