    The sensor is the bridge between physical information and digital information.
    The use of sensor networks has been implemented in sectors like health, supply
    chain, defense, etc. (Atzoria et al., 2013). Wireless sensor networks (WSNs) work
    in low bandwidth and delay tolerant applications ranging from construction and
    defense to environmental and healthcare monitoring. WSN nodes consist of a low-power
    sensing device, embedded processor, communication channel and power module. The
    embedded system collects and processes the input signal. Change in'
