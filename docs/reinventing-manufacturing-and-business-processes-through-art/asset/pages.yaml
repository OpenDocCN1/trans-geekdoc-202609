- pgno: 83
  md: '# Artificial Intelligence in Manufacturing


    +   - To identify the risks associated with the implementation of AI in manufacturing
    companies.

    - To develop a model to understand the capabilities of AI toward process development
    and other organizational benefits.


    # 4.2.1 ADVANTAGES OF ARTIFICIAL INTELLIGENCE


    **Direct automation:** The Internet of Things (IoT) connects all IoT-enabled gadgets
    organization-wide, be it the shop floor or the administrative office, leading
    to a pathway for effective automation linking various manufacturing processes
    (Acharya et al., 2021). AI-enabled “programmable logic controllers” linked with
    deep learning can make decisions based on generated data and alter processes without
    any human intervention. These AI capabilities can greatly increase efficiency
    and effectiveness of a manufacturing company, and pave the way for manufacturing
    processes (Senthil et al., 2019).


    **Uninterrupted production:** Because of their needs and in certain cases due
    to legal requirements, humans are forced to take frequent breaks and can put up
    with only few hours of work a day (Yadav & Jayswal, 2018). To improve efficiency,
    a manufacturing firm has to run around the clock, which is a challenge as companies
    not have required number of resources or expertise. By going in advanced robotics
    coupled with decision-making capability, AI can work on the assembly line 24 hours
    a day, seven days a week (24/7) (Dai et al., 2020). This makes it possible to
    increase production capabilities to a very great extent.


    **Improve efficiency:** Adoption of AI allows a system to process massive volumes
    of data, machinery running, customer behavior, etc. (Dubey et al., 2020). Trends
    of the production process, better forecasts and clear business dynamics can all
    be estimated by adopting an efficient AI system over time. AI has the ability
    to forecast details, optimize processes, and monitor and control any kind of anomalies
    across the supply chain from supplier to end customer (Cioffi et al., 2020).


    **Improve safety:** Humans are frail and prone to making errors resulting in injuries
    on the factory floor and in the organizational environment, resulting in misery
    and financial claims. This is an issue that AI—in conjunction with robotics—can
    eliminate to a great extent (Ni et al., 2021). Working this way necessitates a
    reduction in human resources, especially when the nature of the work is hazardous
    or requires extraordinary effort. Also, AI can replace normal working practices,
    thereby reducing the number of industrial accidents and significantly increasing
    the safety of the organization and its resources (Pillai et al., 2021). Furthermore,
    the amalgamation of specific sensors with IoT devices will make the workplace
    safer and more efficient (Ni et al., 2021).


    **Less operational cost:** Many businesses are cautious about incorporating artificial
    intelligence (AI) into the manufacturing process, as it necessitates a major financial
    investment (Morris et al., 2017), but studies indicate that the return on investment
    (ROI) is substantial and investing in AI is a great decision in the long run (Massaro
    et al., 2019). Businesses will benefit from dramatically decreased running costs
    and predictive maintenance.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Quality control: AI systems can be implemented across organizations to perform
    preventive maintenance on equipment and machinery (Aggour et al., 2019). AI systems
    will assist in anticipating malfunctions of equipment and failures of machines
    using machine learning, monitoring the performance of machines and varying operating
    conditions, and can also take steps thereby preventing defects before they happen.
    Effective AI systems can lead to faster and efficient inspections, which in turn
    can reduce unplanned downtime (Patel et al., 2021).


    # 4.2.2 DISADVANTAGES OF ARTIFICIAL INTELLIGENCE


    AI may be a new technology, but it cannot outperform humans because it cannot
    bring in inventions and can only do the work that it is programmed to do (Syam
    & Sharma, 2018). AI utilizes past information to read a general model or a pattern,
    which can be used to predict future occurrences. AI cannot think beyond a certain
    limit like humans, and it has been identified that AI works best with human collaboration
    (Lee et al., 2019).


    # 4.2.1 Shortcomings of AI


    Cannot create: Even though AI can write full movie scripts, articles, reply to
    or compose emails, and can only adopt a formula and continue with the formula,
    learning on the go. As of now, it lacks the imagination of a human and cannot
    formulate new ideas. AI cannot do something different beyond a pattern. An AI
    system cannot create an output of what it has not already seen or learned (Nasiri
    et al., 2017).


    Cannot feel: AI systems are target-oriented and do not consider the emotions of
    people, unlike humans, they are generally focused on one target (Sun & Medaglia,
    2019). Even though AI in many fields has a significantly reasonable rate of accuracy,
    it cannot feel the emotions of the humans it is chatting with by the way they
    are texting (Jha et al., 2019).


    # Irreplaceable Skills


    Six skills will not be replaced by artificial intelligence.


    +   - Ability to judge

    - Empathy

    - Creativity

    - Ability to plan considering varying factors

    - Physical skills


    Security concerns and employee misgivings: Adoption of AI is often connected with
    the high potential risk it poses with respect to security measures. In some cases,
    even engineers who have developed the AI systems do not endorse the products for
    lack of complete understanding of the AI systems (Eren et al., 2021). Scientists
    who have been working on the AI front for decades have often been quoted that
    they have understood only the tip of what the AI system is capable of, and hence,
    it should not be meddled with.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Implementation cost is high: The complexity of constructing AI-based systems
    often results in exorbitant costs. This is also due to the fact that AI technology
    is still in the emerging stages of development. As the machine becomes smarter
    the AI-based computer software needs regular updates to keep up with the demands
    of the changing world (Asima et al., 2021). In the event that the program fails
    entirely, the procedure of retrieving missing data and the codes, and reinstalling
    the device, can be a nightmare for organizations.


    Cannot replace humans entirely: Machines, coupled with AI, definitely and without
    any question are capable of working much more effectively when compared to humans.
    Even it might be tempting to replace all the work done by humans with AI, existing
    technology is not adequate. No matter how intelligent or smart an AI system is,
    it will never be able to replace a human. We may be frightened by the prospect
    of being replaced by robots, but it is still a long off (Baryannis et al., 2019).
    Machines are logical, but they lack feelings and moral principles. They lack the
    ability to form relationships with other people, which is a required skill for
    leading a group of people, although they can store high volumes of data, extracting
    the necessary information from them is a time-consuming process that pales in
    comparison to human intelligence (Baje et al., 2018).


    With fast and dynamic changes in the field of AI, one when AI systems will be
    in a position to replace humans (Tao et al., 2018). AI is likely to perform a
    majority of routine and monotonous tasks that are repetitive and do not involve
    decision-making. According to a McKinsey Global report, smart AI systems and robots
    will replace close to 30% of the world''s existing human labor by the year 2030.
    It stated that “between 400 and 800 million workers will be displaced by automation
    by 2030, causing as many as 375 million people to switch work categories entirely
