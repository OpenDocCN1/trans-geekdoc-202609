    # 8.1 Introduction


    Over the past few years, artificial intelligence (AI) has become an integral part
    of our daily lives and management. It was such an extraordinary move that gathered
    the attention of the people from all the corners of the world. The companies are
    moving from gigantic data to machine learning and further to artificial intelligence
    (AI) (Tambe et al., 2018; Rana & Sharma, 2019). Artificial intelligence can be
    defined as a programmed algorithm that has a learning capacity and aims to be
    like human but surpasses humans in ability. In other words, it is an advanced
    technology that allows a computer to perform all those errands that generally
    require human


