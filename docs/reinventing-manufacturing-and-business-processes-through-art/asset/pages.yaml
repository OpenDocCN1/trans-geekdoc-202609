    not (Vinuesa et al., 2020). While the wealthy nations in the world are investing
    in AI heavily and will reap the benefits, the poorer nations will be struggling,
    and the gap between the two groups will only widen further.


    There will be groups with vested interests who will use AI to further their owns
    aims. It is possible to study, analyze their weaknesses and influence or exploit
    them for the benefit of entities like governments and business organizations.
    People may not be aware that their movements and activities are being monitored,
    or that they are being influenced to make choices, raising the ethical dilemma
    of how intrusive AI can be. Further, machine learning algorithms will try to learn
    from existing data to come up with patterns and trends that it can apply to future
    data. The presence of biases and prejudices—which will appear in past data—could
    well be projected on future data, while the opinions of users may have changed
    in the meantime. For AI algorithms to understand the principles of diversity,
    social inclusion, affirmative action, gender equity, wage parity and socially
    important factors will be a challenge. For example, analyzing the social'
