    # 7.7.3 MAINTENANCE


    Machine tools are frequently stopped for various maintenance activities. There
    are five different types of maintenance performed on a machine tool, as follow:


    +   1. Preventive maintenance

    2. Planned maintenance

    3. Predictive maintenance

    4. Autonomous maintenance

    5. Breakdown maintenance


    # 7.7.3.1 Preventive Maintenance


    Preventive maintenance is periodic maintenance to avoid sudden breakdown of equipment.
    The changing of the engine oil periodically in an automobile is a real-life example
    of preventive maintenance. A machine learning algorithm can predict the maintenance
    period (Li et al., 2021).


    # 7.7.3.2 Planned Maintenance


    Sometimes anomaly is detected in the equipment, and it is not required to stop
    the operation, but the operating cost is increased due to lower performance. Instead
    of doing immediate maintenance, maintenance is planned; such maintenance is called
    planned maintenance. For example, sometimes in an automobile, an anomaly in the
    engine fuel consumption leads to higher operating costs, but it does not stop


