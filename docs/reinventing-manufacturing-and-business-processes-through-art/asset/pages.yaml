  md: '# 154 Reinventing Processes Through AI


    intelligence,” “quantum computing,” “smart computing,” “Internet of Things,” and
    many more. Such breakthrough technologies are the vehicles that are moving us
    toward realizations that we would have normally relegated to the worlds of fiction
    and fantasy. These changes have accelerated the growth and profitability of sectors
    like banking, healthcare, retail, entertainment, telecom and travel, name a few.
    It has now become easier to engage with customers and employees anywhere at any
    time of the day, to set up supply chains that are quick to respond to, redesign
    business workflows that are efficient and effective, and to build agile businesses
    that adapt based on business intelligence and insights. The focus has shifted
    to empowering employees with an integrated outlook that can help them decide how
    to lower expenses without compromising on the quality and quantity of output.


    The fundamental aspect of the Fourth Industrial Revolution is that bringing about
    automation and large-scale changes is centered around data—its creation, documentation
    and transformation. The infrastructural developments in the last few centuries
    have laid a slow but reliable foundation, that hand in hand with the advances
    in scientific knowledge, have led to an inflection point in the technological
    evolution of the planet. The real impact is, not just in the manner in which businesses
    operate or profit—it goes beyond commercial interests to touch the quality of
    life of people, many of whom do not even know the myriad ways in which they are
    being impacted. But technology—specifically, AI—has the ability to make the lives
    of people all over the world more comfortable, particularly with its ability to
    analyze and predict change, thereby reducing uncertainty and fear.


    Forecasts are suggesting that the increased use of connected devices, more customized
    use of IoT and internet access costs are driving the Fourth Industrial Revolution
    forward, with some places estimating the 4.0 market size at around $267 million
    in 2026 (Mordor Intelligence, 2020). The COVID-19 pandemic has accelerated the
    pace at which automation and technological development have been accepted by industries
    as they strive to become more agile and resilient to environmental/social disturbances
    and market shocks.


    # 9.2 REVIEW OF LITERATURE


    # 9.2.1 ARTIFICIAL INTELLIGENCE


    The Fourth Industrial Revolution is slated to disrupt industry trends with heavy
    reliance on newer advances in artificial intelligence (especially machine learning
    and deep learning); IoT (especially artificial IoT or IIOT); cloud computing and
    storage; virtual, augmented and mixed reality; cognitive computing; simulations;
    autonomous robots; Big Data; cyber-security; and system integration (i-scope,
    2021).


    Broadly speaking, artificial intelligence is the ability of a computer or a machine
    to simulate human functioning—the machines are constantly learning from their
    experiences, comprehending and responding to varied inputs, and making decisions
    the way a human being would be expected to (TechGig, 2020). It is a set of algorithms
    that helps machines perform human tasks such as solving problems, even'
