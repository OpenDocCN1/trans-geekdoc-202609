    # 1.4 CONCLUSION


    In this dynamic scenario, when companies are shifting their priorities on attaining
    competitive advantage rather than achieving profits, it also becomes their obligation
    to preserve the nature and environment. It will also make organizations the preferable
    employer brands for the job seekers, and they will be able to attract and retain
    talent. Thus, organizations take measures for implementing green HRM policies.
    Along with attracting and retaining talent, companies also have to take care of
    their existing workforce, because any random change can create resistance among
    the employees (Gupta & Haque, 2015; Gupta & Lenka, 2018). There comes the role
    of AI, which helps organizations to adopt GHRM services by offering various applications
    and smart technologies which simplify the work and increase productivity of employees.
    AI is also important to be undertaken by organizations because of diverse workforce
    which includes Baby Boomers (born 1946–1960), Generation X (born 1961–1980), Generation
    Y (born 1981–2000) and Generation Z (born 1995–2012) (Naim & Lenka, 2017; Singh,
    2014), Gen Y is'
