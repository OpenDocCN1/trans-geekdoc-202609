    et al., 2018). To prevent the flank in the drilling process, sensors like dynamometers,
    current sensors and accelerometers can be used (Patra et al., 2013). Vibration
    during the machining causes chatter which leads to poor surface. Khalifa and colleagues
    discussed the monitoring of chatter through image processing (Khalifa et al.,
    2006). A complementary metal oxide semiconductors (CMOS) can acquire frames, but
    the sensitivity is lower than when using a charge-coupled device (CCD) (Dutta
    et al., 2013).


    # 7.4.2.5 Gateway and Protocols


    Gateway is the filtering device between devices and the cloud. It also does primary
    preprocessing at the local level to optimize the data before sending it to the
    server. Another application of gateway is a security check to make sure that only
    genuine data goes to or comes from the server. Digital data is collected from
    various sensors. Iot demands ubiquitous connectivity to integrate multiple heterogeneous
    networks, such as Zigbee ad hoc networks, wireless LAN, cable networks, etc. Sectors
    like automotive, healthcare, transportation, environmental monitoring, etc. needs
    smart gateways to facilitate high data rates, end-to-end connectivity and higher
    bandwidth of multi-hop networks among heterogeneous networks when the devices
    require communicating with each other and server (Guojiang et al., 2013). For
    data exchange, the device must be the set of rule which is known as communication
    protocols.


    The following are some examples of protocols: 1 802.3-Ethernet, 2 802.11-WiFi,
    3 internet protocol version 4(IPv4), 4 internet protocol version 6(IPv6), 5 transmission
    control control protocol (TCP), and 6 hypertext transfer protocol (HTTP).


