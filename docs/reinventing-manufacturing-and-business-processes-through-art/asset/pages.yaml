    # 8.3 OBJECTIVES


    The integral part of any organization is its human resources. One can come across
    HR practices that can improve performance. Among the numerous HR innovative practices,
    one is artificial intelligence. Nowadays, it is necessary skillset for employees
    to involve AI in human resources departments. The first thing that HR managers
    should do is involve AI in HR functions because it will influence employee performance.
    The reviewed literature reveals that there is a lack of overall AIHR framework
    which includes all the specific HRM dimensions. The objective of the study is
    to study the conceptual HRM model and propose the conceptual AI human resource
    management model which provides theoretical and conceptual guidelines for future
    researchers.


    # 8.4 RESEARCH METHODOLOGY


    To achieve the purpose of the study, we have used descriptive research design
    and reviewed diverse types of literature reviews. The study is about HRM and its
    functions to propose the conceptual model, secondary data is used. We utilized
    electronic databases for literature searches. The secondary data has been collected
    from HR journals, blogs, textbooks, research papers, survey reports, online human
    resource websites and other related publications, both online and offline.


    # 8.5 CONVENTIONAL HUMAN RESOURCE MANAGEMENT


    In this section, we will discuss conventional human resource management and its
    functioning discussed by Rao (2013). All kind of organization whether small and
    big are focusing on HRM. The HRM process begins with two dimensions: managerial
    functions and operative functions.


    +   1. Managerial functions: Management is basically personnel administration.
    It is the development of people working in an organization. The basic managerial
    functions comprise PODC (i.e. planning, organizing, directing and controlling).'
