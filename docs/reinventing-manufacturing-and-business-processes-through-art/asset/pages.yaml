    reputation. A report by management consulting firm McKinsey (McKinsey & Company,
    2021) suggested that the motivations for business sustainability were not limited
    to having a good reputation in the marketplace, also in order to generate new
    opportunities and gain operational efficiencies.


    Artificial intelligence has a big role to play in the achievement of business
    sustainability. It has the potential to help in the supply of clean water, and
    high-quality health services to people in different parts of the world. It can
    aid in the planning of smart cities that can conserve energy and also circular
    economies. The United Nations’ Sustainable Development Goals—such as quality education,
    affordable and clean energy, economic growth, innovation and infrastructure (Gorski
    & Keong Tan, 2020)—become easier to attain by harnessing the power of AI. Specifically,
    in business, AI can be used to design low-carbon emission systems in different
    aspects of production, distribution and consumption.


    # 9.3 OBJECTIVES


    While several businesses have incorporated the triple bottom line approach in
    their work, there are many which have yet to do so. Given that sustainability-oriented
    businesses can lead to more satisfied customers and employees, and also to higher
    financial returns, this chapter is going to delve into the contribution of AI
    in different economic sectors and industries to understand the reach and scope
    of AI in sustainability. Specifically, the objectives of this chapter are the
    following.


    To understand the current challenges that are acting as impediments to sustainability
    in different economic sectors. To analyze the role of AI in helping businesses
    become more sustainable.


    # 9.4 ACHIEVING SUSTAINABILITY


    The three-pillar model of sustainability suggests that if the social, economic
    and environmental pillars are represented as three intersecting circles, the area
    of interest of all three is where we find sustainability. However, modern businesses
    often find that they fall all under one of the contexts shown in Figure 9.1. Sometimes
    the emphasis is often on one of the three pillars to the exclusion of the other
    two, or vice versa.


    Organizations have understood that sustainability is now a business imperative
    and that achieving it can reap many advantages as higher efficiencies, retention
    and attracting talent, greater branding and better stakeholder relations (Rana
    et al., 2021). All businesses are now faced with environmental challenges such
