    in the production-system is the biggest challenge in the industry (Zhang et al.,
    2011).


    # 7.4.2.4 Sensors for Metal Cutting


    Lee and colleagues discuss the sensor''s use in the machining process encoder
    force meters, laser interferometers, accelerators and acoustic emissions in metal
    cutting (Lee and Dornfeld, 1998). A study of critical elements of equipment and
    its parameter was carried out by Urbikain and Lacalle (2020) which identifies
