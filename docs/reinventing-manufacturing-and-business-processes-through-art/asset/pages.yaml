    # 5.2.5.6 K-Means Clustering


    K-means algorithm is the most popular clustering algorithm that is used to partition
    the given data into distinctive non-overlapping subgroups iteratively until constant
    centroids are obtained. The iteration continues until we get distinct subgroups
    with constant centroids. Kmeans clustering is used to arrive at meaningful insights
    and recommendations to generate customer segments based on customer behavior (Vive,
    2018).


    # 5.3 TECHNIQUES EMPLOYED


    After the successive collection of sales data, preprocessing is done to extract
    its accurate information for further detection. Also supervised machine learning
    classification algorithms namely logistic regression, random forest, naive Bayes’s,
    SVM and decision tree are employed. The data mining technique is used for the
    identification of patterns in the collected data. Traditional ML algorithms, hybrid
    model approach and neural network approach are deployed. Finally, for the comparison
    between different ML algorithms that were used in our work, individual- and segment-level
    approach have been used.


    # 5.3.1 MACHINE LEARNING APPROACHES


    Machine learning is considered to be part of AI. It serves as an automated tool
    to find the hidden patterns in voluminous data. ML techniques can be broadly classified
    into four: naive supervised, unsupervised, semi-supervised and reinforcement learning.


    The collection of e-commerce datasets from the internet is the first and foremost
    activity in sales and customer behavior. The preprocessing of data and outlier
    detection is done to determine the general information from the dataset and correlation
    between the attributes. To train the classifier, a training dataset is built using
    supervised machine learning classification algorithms, namely logistic regression,
    random forest, naive Bayes, SVM and decision tree. The classification model can
    also be built using the unsupervised algorithm such as K-means clustering, K-nearest
    neighbors whenever the initially labeled dataset is not obtained. Performance
    evaluation is done using the test data to determine the correctness of the classification.


    To improve the prediction of sales, comprehensive predictive models of machine
    learning are used which also deal with Big Data. An analysis can be conducted
    to come up with the best-suited machine learning algorithm based on the evaluation
    of performance (Cheriyan et al., 2018; Piyush Anil et al., 2019). Machine learning
    is widely used to classify customers based on their purchasing behavior as regular,
    occasional, festival, or window shoppers based on their visits to the e-commerce
    sites. Then the frequency in which the product is purchased and which age group'
