    time frame including 1960 studies focused on knowledge representation and natural
    language, genetic algorithms in 1980 and the 1990 neural network implementation
    on complex problems.


    Artificial intelligence is a superset under which machine learning and neural
    network techniques works. Machine learning is a subfield of artificial intelligence
