    Controlling: Controlling includes checking, verifying and regulating whether everything
    done according to plan. Controlling function of management reviews personnel policies,
    programs, job evaluation, measuring the employee''s performance, training and
    employee development.


    +   2. Operative functions: The pervasive functions include key areas like process,
    development, motivation, compensation, maintenance, integration and emerging issues.


    Procurement function: It is the first important function of human resource management.
    It includes procuring people who possess required skills, knowledge and aptitude.
    It includes manpower, recruiting and selecting candidates, job analysis (job description
    and specification), placement and internal mobility (transfers, layoffs, discharge,
    separation).


    Development: This function considers developing skills, knowledge, attitudes and
    creative ability, and improving employees'' performance with training. It is the
    process of drafting and directing training for all employees based on employee
    potential and performance.


    Motivation and compensation : This includes adequate and equitable remuneration
    to all working in an organization. The remuneration motivates employees to give
    their best to the organization. They are facilitated with both intrinsic and extrinsic
    rewards.


    Maintenance: It deals with sustaining the psychological and physical health of
    employees. It aims at caring and preserving the people working in organization
    through a variety of welfare programs.


    Integration function: Managerial activities that human resource and organization
    through various employee-oriented programs are integrated. It includes activities
    like grievance redress, discipline, teamwork, collective bargaining, employee
    participation and industrial relations.


    Emerging Issues: Effective human resource management depends on refining human
    resource practices to changing conditions. Some important issues affecting HR
    nowadays are personnel records, human resource audits, human resource information
    systems, human resource research, human resource accounting and international
    HRM. All these functions keep employee motivated to provide their best in a dynamic
    and ever-changing human resource practice.


