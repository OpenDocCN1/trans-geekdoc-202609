    # 7.1 INTRODUCTION


    Since the First Industrial Revolution, machining has been the most critical manufacturing
    process. Metal cutting is needed in almost every sector, like household items,
    medical, automotive, defense, aerospace . Primary processes like casting and forming
    fail give higher dimensional accuracy and surface finish. The main requirement
    to cut out machining operations is to achieve accuracy and surface finish. It
    is also used to achieve the final shape of the components. Humans used a cutting
    tool of stone and bone to cut the various materials. Egyptian civilization used
    the machining operation to drill holes in the rock of pyramids. The use of machining
    processes is also found in Indian civilization; lathe machines were used for carving
    the temple pillars. In South India, entire parts of the temple are made by machining
    a single stone. Before the First Industrial Revolution, most tools for machining
    were running by flowing water, or animal energy (Frader, 2005). Due to the limitation
    of the power, it was not possible to cut hard materials like carbon steel and
    cast iron. The invention of the steam engine boosted the machining industries
    by the availability of high power. The First Industrial Revolution took place
    due to the invention of the steam engine. Steam engines required ample space,
    and they also needed a boiler. Starting time of the steam engine is also significant.
    To overcome these limitations, an internal'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Road Map for IoT in Metal Cutting


    combustion engine that is portable and easy to start was used in place of a steam
    engine in the First Industrial Revolution; due to the use of the manual machine
    in the first industrial revolution the lower production rate and lower quality
    were the biggest challenges. To overcome the production rate and poor quality
    of machined components, cam and follower-based hard automation like capstans and
    turret lathes introduced in the Second Industrial Revolution. Due to the more
    compact and efficient electric motor in the nineteenth century, the electric motor
    started as the prime mover of the machine tool. However, due to the machine tool''s
    hard automation, it was challenging to adapt product design changes. Soft automation,
    which can be achieved by computer numerical control (CNC) machine tools and programmable
    logic control (PLC) systems, was introduced to reduce the changeover time from
    one to another product in the Third Industrial Revolution, which began after the
    invention of the computer in 1960 (Cooper and Kaplinsky, 2005). The remote control
    and monitoring of CNC machine tools were not possible; the set of instructions
    in the form of code need to be given by an operator for various operations.


    In 2012, internet technology was introduced by Germany to control and monitor
    a sensor, and that data can be stored in a central server. This stored data can
    be used for decision-making and improving the efficiency of processes. The implementation
    of internet technology in manufacturing is known as the Fourth Industrial Revolution
    or Industry 4.0. Industry 4.0 is about using internet for remote control, monitoring
    and automated decision-making using the collected data. In the mass production
    industries, activities are fixed in job production system the activities are not
    fixed (Alptekinoglu and Corbett, 2008). It is also a challenge to carry out the
    time study in the project-based industry due to different sets of activities (Vinod
    and Sridharan, 2008). India, an emerging economy, is proving to be a vast opportunity
    market for the world''s big manufacturing giants (Trivedi, 2015). Limited research
    has been done on the time study of metal cutting using the Internet of Things
    (IoT). In this study, the integration of humans and IoT is discussed to monitor
    the time of various activities on the metal cutting. The stages of integrating
    the IoT with its necessities and challenges in metal cutting are discussed. An
    overview of IoT technologies from the aspect of data acquisition, data preprocessing
    and data analytics is also discussed. IoT is all about connecting the devices
    and servers to store the data. The IoT device must have the following characteristics.


    +   1. Dynamic and self-adapting

    2. Self-configuring

    3. Interoperable communication protocols

    4. Unique identity

    5. Integrated into the information network


    # 7.1.1 Dynamic and Self-Adapting


    The IoT device must be capable of adapting to the change in condition. Mobile
    devices light changes according to the amount of light in the room are the best
    example of dynamic and self-adapting conditions.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 7.1.2 SELF-CONFIGURING


    In the IoT system, there are large numbers of sensors and actuators. To provide
    specific functionality, sensors are interconnected, and the IoT devices must have
    self-configuring capabilities.


    # 7.1.3 INTEROPERABLE COMMUNICATION PROTOCOLS


    It may be possible that in the IoT system, all devices are not operating on the
    same communication protocols. IoT devices must be designed in such a way that
    they can work in multiple communications protocol environments.


    # 7.1.4 UNIQUE IDENTITY


    To send the data to an exact device must have a unique identity. It is nothing
    but the residential addresses of the individual.


    # 7.1.5 INTEGRATED INTO THE INFORMATION NETWORK


    All sensors and radio frequency identification (RFID) data must be integrated
    into the information network that allow them to communicate and exchange the data
    with each other and systems

    The use of internet technology in domestic products brings many years ago, like
    watches, air conditioning, refrigerators, etc. According to the U.S. National
    Intelligence Council, by 2025 everything in our life will be connected via the
    internet. The use of IoT in manufacturing can improve the efficiency of the industry.
    There are many challenges to implement IoT in manufacturing. Dai and colleagues
    studied the challenges with harsh environment, high data rate, delay-sensitivity,
    and many more (Dai et al., 2020).


    # 7.2 LITERATURE REVIEW


    Big Data analytics is an essential tool for the Fourth Industrial Revolution.
    Big Data analytics has three stages: data acquisition, preprocessing and storage,
    and data analytics (Dai et al., 2020; Sharma et al., 2021a). Data analytics has
    four applications: descriptive analytics, diagnostic analytics, predictive analytics
    and prescriptive analytics. Descriptive analytics gives us the status of the system.
    Diagnostic analytics is used to find out the root cause of the problem, like the
    machine tool''s failure. To predict the runtime of the machine tool, we can use
    predictive analytics. To achieve the target production, we can use analytics.
    Competitive advantage in smart manufacturing can be taken over a traditional manufacturing
    system by the planned investment. The ten performance dimensions like cost, quality,
    flexibility, time, integration optimized productivity, real-time diagnosis and
    prognosis, computing, social and ecological sustainability are considered to develop
    a smart manufacturing performance measurement system to'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Road Map for IoT in Metal Cutting


    evaluate the smart manufacturing system (Kamble et al., 2020). Alvian and colleagues
    introduce the concept of a programmable manufacturing advisor (PMA) to automate
    the decision-making in smart manufacturing. PMA consists of three units: information
    units, analytical unit, and optimization units. Information units continuously
    update the parameter (Alvian et al., 2020). It is challenging to decide the priority
    of maintenance activity in large-scale industries.


    Direct and indirect sensing techniques are mainly used in metal cutting operations.
    Vision-based sensing is an example of a direct sensing technique, and acoustic
    emission is an indirect technique (Liang et al., 2004). An IoT-based industrial
    data management system (IDMS) consists of five layers: physical, network, middleware,
    database and application layer—can effectively collect and analyze the raw data
    and urgent events (Salain et al., 2019). Digitalization of manufacturing industries
    can reduce the cost and flexibility of the production system by integrating data
    and value chain in product design, production processes and results (Perzlo et
    al., 2020). Using real-time sensor data and simulation, a digital twin can be
    developed to make a digital replica of physical devices for monitoring purposes.


    Due to globalization, manufacturing companies cannot increase the cost of their
    products. Efficiency can be increased by minimizing the waste (Sharma et al.,
    2021b). In lean manufacturing, there are many tools and techniques available to
    reduce waste in industries—one of the ways to identify waste in the system is
    value streaming mapping (VSM). It gives us a bird''s-eye view of the system, with
    which we can easily differentiate between the value-added and non-value-added
    activities (Venkataraman et al., 2014). VSM is a graphical representation of all
    the activities of the system. Generally, various activities are recorded manually,
    and then data is used to make the VSM. In metal cutting, measuring the time of
    active activities is challenging. In the metal cutting operation, the time during
    which occurring is considered value-added, and all other activities are considered
    non-value-added activities.


    Next-generation intelligent controllers are capable of real-time monitoring, diagnostics,
    self-learning and adaptive optimization (Hertz et al., 2013). Smart manufacturing
    utilizes a machine learning algorithm that can be trained using the manufacturing
    data to improve the product quality, increase productivity and monitor the system''s
