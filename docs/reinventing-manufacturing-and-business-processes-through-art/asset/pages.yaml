    # 2.2.3 AI-Based SYSTEMS IN INDUSTRIES


    In most cases in industries, AI primarily processes business transactions and
    AI algorithms over IoT devices to each node, or cloud, from where the data can
    be accessed remotely. Most industrial applications popular for AI are as follows:


    +   - Manufacturing industry

    - Smart city industry

    - Smart agriculture industry

    - Healthcare industry

    - Weapons industry

    - Telecommunications industry

    - Education industry

    - Oil and gas industry

    - Power industry

    - Retail industry

    - Supply chain industry


    The mobility and density of IoT, eIoT (energy IoT), ioT (industrial IoT) and AIoT
    (of Things) devices in large systems such as smart city systems may lead to an
    increase in network complexity and a decrease in its performance.


    However, despite the complexity of implementation and operation, AI-based technologies
    have gained tremendous popularity in operations of heavy industries, smart cities,
    telecommunications and military networks.'
