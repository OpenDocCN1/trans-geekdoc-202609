  md: '# The Role of AI in Blockchain Applications


    +   - Blockchain block is a slight difference of nonce (mentioned in the definition
    of blocks sections) between owners.

    - Miner is a node; support the network by creating new blocks or forwarding information
    and maintaining a copy of the block in the blockchain network.


    # 2.3.2.1. Consensus


    +   - A consensus model is a fault-tolerant mechanism that is applied in blockchain
    systems to achieve the necessary agreement on a unique state of the network among
    multi-agent systems or distributed processes for keeping other things.

    - Consensus is the methodology that solves the agreement of maximum nodes on the
    network having the same blocks in a validated blockchain package. In other words,
    it could be interpreted as a series of policies or conventions that each block
    will be harmony self-enforced in self-control mode.

    - With a non-stop increase of the miners and nodes in the blockchain network,
    once the node has been created, it would link to an overall consensus mechanism
    updating with newer nodes. Currently, there are four types of consensus algorithms
    used for public and private blockchain applications, working on different principles
    in cryptocurrency and blockchain technologies.


    +   - PoW (proof of work) is a basic consensus algorithm by the most popular cryptocurrency
    networks like Dogecoin, Litecoin and Bitcoin. PoW requires a node of participants
    to prove that the work completed and submitted by them qualifies them to receive
    the right to add new transactions to the cryptocurrency network.

    - PoS (proof of stake) is a popular consensus algorithm that evolved as an optimization
    alternative to the PoW algorithm. It involves the allocation of responsibility
    in maintaining the public ledger to a node of a participant proportion to the
    number of cryptocurrency tokens held.

    - PoC (proof of capacity) allows sharing of memory or space for contributing to
    the nodes in the blockchain network. One node that has much memory or disk space
    would have granted more rights to maintain the public ledger.

    - BFT (Byzantine fault tolerance) is the property of a system that is able to
    resist the class of failures derived from the general problems in BFT systems,
    and this means that a BFT system is able to continue operating if some of the
    nodes act maliciously.


