    #  7.10 CONCLUSION


    This study presents an in-depth discussion on the implementation of IoT in metal
    cutting; it first presents the stages of IoT in metal cutting and discusses IoT''s
    challenges and challenges in metal cutting. The enabling technologies of IoT in
    metal cutting are summarized according to critical activities of manufacturing:
    production, planning, quality management and maintenance. The study shows that
    the production department can identify the problem on the shop floor using real-time
    information. We can effectively measure the non-value-added and value-added activity
    in metal cutting processes discussed in detail. The planning department can compare
    the planned hours and actual hours, doing accurate planning for the next cycle.
    Also, identifying bottlenecks and feeding of machines helps the production department
    aware of which machine focus is required so that there will be on-time completion
    of components. The quality department can use IoT to decide the optimum parameters
    to improve the quality of the products. Maintenance departments can improve the
    OEE by real-time conditioning monitoring. Also, the collected data can be used
    for predictive maintenance using the various artificial intelligence algorithms.


    #  7.11 LIMITATIONS OF THE STUDY


    Cyber-security is the biggest challenge for Industry 4.0, which is not covered
    in this study. The industry''s data management can crash due to unauthorized data
    changes, unauthorized deletion of data, and unauthorized access. Integration of
    design, marketing and supply chain is also not included in this study.'
