    # 2.3.2 BLOCKCHAIN ARCHITECTURE AND LAYERS


    # 2.3.2.1 Blockchain Architecture


    The blockchain architecture consists of five elements: nodes, blocks, transactions,
    mining and consensus.


    # 2.3.2.1 Nodes


    In simple terms, every computer or smart device in a blockchain network is a node
    and there exist several types of blockchain nodes.

    As a definition, blockchain is a decentralized network and there is no central
    authority, so there is great value for blockchain nodes; each of them requires
    specific software and hardware configurations to get hosted or connected to others
    as shown in the blockchain nodes diagram in Figure 2.3.

    Figure 2.3 presents a decentralized blockchain network based on blockchain nodes
    with different different configurations.

    Fundamentally, there are two types of nodes. The first type is called full nodes
    and the second type is called lightweight nodes; these types include a constellation
    of a variety of nodes that are grouped to a cluster.


    +   * A full node is a node that can keep and maintain a copy of the blockchain.

    * A lightweight node does not keep a copy of the blockchain.

    * The relationship between a full node and a lightweight node is the light-weight
    node must connect to a full node before it can interact with the blockchain-system
    to send a transaction from the source node to the target node.


    ![](img/b43ebe8eccbdc43447aca82fb7658570_41_0.png)


