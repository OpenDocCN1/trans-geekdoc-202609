    # 1.2.3 DETERMINANTS OF GHRM ADOPTION


    With the increasing pressures of customers, stakeholders and orientation towards
    the environment, organizations have to look forward towards reducing production
    waste and promoting environmental sustainability by green initiatives through
    HRM practices (Guerci et al., 2016; Mohd-Yussof, 2016). Employees'' intellectual
    capital also significantly affects HRM practices (Kong & Thompson, 2009). An empirical
    study was conducted on 112 Malaysian manufacturing firms on the basis of intellectual-based
    value theory which revealed that green human capital and relational capital significantly
    influence the organization''s incentive to implement green HRM practices (Yong
    et al., 2019). Green human capital of employees'' knowledge, skills, capabilities,
    experience, attitudes, wisdom, creativity and commitment to green environment
    or green innovation (Chen, 2008; Li & Chang, 2010; Chahal & Bakshi, 2014). Organizations
    with such human capital find it easy to implement green HRM practices. Similarly,
    green relational capital is a combination of an organization''s interactive relationship
    with customers, suppliers, network members and partners about corporate environmental
    management'
  merge: -1
  img_proc: true
