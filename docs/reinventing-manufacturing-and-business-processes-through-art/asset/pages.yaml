    One of the advantages of private blockchain is that it is more centralized than
    public blockchain technology; it can be governed and regulated by the association
    of financiers, banks or companies who can make sure that controllers are guiding
    participants.


    In addition, a private blockchain can have a token—or may not have one, based
    on the policies or rules of the blockchain owner.


    # 2.3.3.3 Consortium Blockchain


    As with public blockchain, consortium blockchain is considered to be in the hands
    of a fully decentralized system, with control over the blockchain not being in
    of any single individual or entity. While private blockchain systems have the
    advantage of security, they are also slower and more costly because of the need
    for only certain individuals to perform any activity.


    A consortium blockchain is a so-called federated blockchain or hybrid blockchain;
    it is considered partially decentralized, and it combines the beneficial attributes
    of both public and private blockchain. Consortium blockchain has the advantages
    of a public ledger and it is operated under the leadership of a group instead
    of a single entity, which is its key characteristic of private blockchain.


    # 2.3.3.4 Blockchain Summary


    Experts say that private blockchain is the easiest platform to control and modify
    outweighs the public blockchain that the organization can revert transactions,
    modify balances, change operation rules, etc. Therefore, the private blockchain
    model is suitable for any organization that is not ready to relinquish control
    such as financial companies, governments, etc.


