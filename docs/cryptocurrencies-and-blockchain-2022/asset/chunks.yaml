    Almost all new cryptocurrencies are forks of previously existing coins, which
    is not surprising. Consequently, it turns out that it is actually impossible to
    build a well-diversified investment portfolio, that is, to spread risks over a
    number of different currencies by holding a variety of assets.


    Now, at long last, we''ll take a look at some of the most promising cryptocurrencies
    available today.


    Litecoin is the first cryptocurrency on which I wish to concentrate my efforts.
    It is, in my opinion, one of the most secure currencies available, second only
    to Bitcoin. It was founded in 2011 and is considered a Bitcoin fork, which means
    that the code for this coin is based on the Bitcoin source code. Every 2.5 minutes,
    a new Litecoin block is generated. Approximately 84 million Litecoins are currently
    in circulation, which is four times the number of Bitcoins in circulation. As
    an additional benefit to users, Litecoin already supports SegWit, which was only
    recently activated on the Bitcoin network on August 1, 2017.

    '
  trans: '

    正如您可能猜到的，销售点（PoS）是一种存储大量货币的中央银行类型。因此，以太坊将在不久的将来部分从去中心化的以太币过渡到寡头垄断地位。将会出现主要的“持有者”，他们积累了大量的以太币，从而获得了进行加密货币交易的能力。他们的盈利方式将通过这一点实现。完全切换到
    PoS 计划于 2018 年初进行。由于网络算力将立即下降，区块奖励将减少，我预计加密货币社区的一些成员将因此迁移到另一种货币，或者可能完全退出市场。从长远来看，我预计只有最强大的以太坊矿工将留在以太坊区块链上。


    # 第七章 排名前十的最佳加密货币及其价格追踪渠道


    请看一下当今影响加密货币价格的一些最重要因素。


    首先要考虑的因素当然是使用某种货币的实际效益。第二个因素是对该加密货币生态系统发展的信心。第三个方面是对比特币生态系统整体增长的信心，即大多数公司未来将希望使用加密货币系统的信念。定价中的最后变量是赤字和未来利润的额外费用，以及风险折扣，这些是定价的最终因素。


    此外，各种投机和对某种货币的需求导致币价超出其内在价值的情况相当频繁。在这种情况下，最关键的是弄清肥皂泡与极高效事物之间的百分比比率。由于没有准确的算法，无法精确计算该比率。因此，每个人仅凭自己的观点来完成这项任务。


    我举个例子。如果您想知道麦当劳的总价值，只需在谷歌搜索引擎中输入问题，任何资源都会给您相同的答案。然而，对于加密货币则行不通。加密货币交易所都是本地化的，加密货币交易与外汇市场交易非常相似。换句话说，这是一个场外交易市场。在没有中央市场的情况下，无法追踪特定货币的价值。按照惯例，加密货币社区成员查看不同地域的独立网站上的价格，价格差异有时可达百分之十到二十。


    由于加密货币也是开源的，任何人都可以在 GitHub 网站上查看它们的工作原理，这是汇集所有开源开发者的最著名资源。


    我建议您使用 cryptocompare.com 来帮助选择加密货币。它是一个加密货币价格聚合器，显示来自多个加密货币交易所的加密货币价格。您可以通过访问该页面了解每种货币的更多信息，并查看它与其他货币（包括美元）的对比情况。


    Coinmarketcap.com 是另一个值得访问的有用网站。它有助于掌握排名前十的最佳加密货币的最新信息。但请记住，这个前十名单一直在变化。


    第一列包含货币名称，可在其下方看到（Name）。第二列（Market Cap）代表货币的市值。计算公式是什么？非常简单。当前市场上流通的货币数量（流通供应量）乘以该货币的价格（price）。


    例如，如果您点击比特币，将能看到该货币的图表（Charts）。


    ## 最佳加密货币


    如果您想投资加密货币，我建议您选择前十名，或者至少选择目前最好的二十种加密货币。其余的不可靠，表现可能大起大落。这些排名较低的货币波动性更高，给投资者和交易者带来相当大的危险。


    波动性对经验丰富的交易者有利，因为它允许他们更好地控制风险，价格离散给他们提供了更多获利机会。另一方面，波动性对新手或投资不利。因此，大多数对冲基金寻求仅投资于最有价值的前十种加密货币。是的，刚进入市场但已吸引大量资金的新加密货币有时会进入此列表。然而，它们不会在精英行列中停留太久。


    IOTA 就是此类技术的典型加密货币。自它首次出现在交易市场以来，其市值已经几乎翻了一倍。


    我也想对那些特别对比特币感兴趣的人说几句。由于市场上有如此多不同的加密货币，只盯着其中一种是极不明智的。确实，比特币是最可靠的加密货币，其价值以惊人的速度增长。然而，如今除了比特币之外，还有许多其他有趣的加密货币。每一种都有其自身的优势。


    如果您不确定该买哪种加密货币，可以安排代码审计来决定购买什么。


    毕竟，正如我之前所述，所有加密货币都是开源的，意味着它们使用开源代码且结构彼此相同。实际上，任何人都可以获取比特币等加密货币的源代码，根据需要修改，从而创建一种新的加密货币。直白地说，这就是分叉的样子。


    分叉是将一个软件项目的代码库作为基础来创建另一个项目。这些项目中的每一个都可以独立于主项目发展，并利用主项目不具备的机会。分叉是用来描述创建新币过程的术语。


    凭借其本质，比特币在加密货币领域充当基础，因此所有其他币种被称为比特币分叉。


    几乎所有新加密货币都是先前现有币种的分叉，这并不奇怪。因此，实际上不可能建立一个充分分散的投资组合，即通过持有多种资产将风险分散到多种不同货币上。


    现在，终于，我们来看看目前一些最有前景的加密货币。


    莱特币是我想重点关注的第一种加密货币。在我看来，它是仅次于比特币的最安全货币之一。它成立于 2011 年，被视为比特币分叉，意味着该币种的代码基于比特币源代码。每
    2.5 分钟生成一个新的莱特币区块。目前约有 8400 万枚莱特币在流通，是比特币流通量的四倍。作为对用户的额外福利，莱特币已经支持隔离见证，而隔离见证直到
    2017 年 8 月 1 日才在比特币网络上激活。

    '
