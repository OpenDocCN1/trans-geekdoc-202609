    # ICOS (Initial Coin Offerings)


    ICOS is an acronym that stands for International Cooperation on Science and Technology
    (INITIAL COIN OFFERING).


    To date, a large number of people have taken part in so-called initial coin offerings
    (ICOs) (Initial Coin Offering). Essentially, this is another interpretation of
    the crowdfunding paradigm, one that is similar to an initial public offering (IPO).
    Participants contribute to the creation of a project in exchange for future advantages,
    but there are no assurances that the initiative will be successful. In the cryptocurrency
    world, an initial coin offering (ICO) refers to the issuing of coupons or tokens
    by a specific project that will be used to pay for site services in the future
    using cryptocurrency.


    In many ways, an initial coin offering (ICO) is like a venture fund, which is
    an investment fund that focuses on working with creative firms and ideas (startups).
    A venture fund is a type of investment fund that makes investments in securities
    or shares of businesses that are high-risk or very high-risk with the expectation
    of making extraordinarily large gains. In general, 70–80% of such projects fail
    to generate a return on investment. However, the profit from the remaining 20%–30%
    more than compensates for all previous losses.


    If you believe you have the courage to fund a project that offers no certainty,
    ask yourself:


    *   Am I prepared to take on more risks in this endeavor?

    *   Is there a capital cushion that I can use for diversification?


    You make money with an initial coin offering (ICO) by taking huge risks in the
    hope of making huge gains.


