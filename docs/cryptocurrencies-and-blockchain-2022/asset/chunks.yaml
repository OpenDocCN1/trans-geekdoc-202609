    as well as the first Bitcoin units. Bitcoin emerged as a new sort of digital currency
    that was fundamentally different from all of its predecessors. The fact that it
    is decentralized is the most significant difference between it and other systems.
    As a result, no participant has any control over the outcome.


    The following question is posed to you. There are a large number of people on
    the network, and because they do not know one another, it is understandable that
    they do not trust one another. So, how can people be certain that payments will
    be made and that their money will not be taken from them?


    Everything, on the other hand, was planned out in advance by Satoshi Nakamoto
    and meticulously documented by me in my book, *Mastering Bitcoin for Beginners*.
    It is sufficient to say that Nakamoto''s idea of a decentralized currency came
    true, and that it solved a slew of problems.


    By the way, the identity of Satoshi Nakamoto remains a mystery to this day. Due
    to some people''s belief that Satoshi Nakamoto is actually a group of people rather
    than one individual, several attempts have been made to reveal his identity. However,
    none of these endeavors has proven to be a complete success.


    # Chapter 3: Bitcoin and Mining


    To fully comprehend the essence of Bitcoin, we need to delve a little deeper into
    the issue of mining. I''ll tell you more about mining as an investing strategy
    later on, but for the time being, let''s just think about mining in terms of the
    emergence of the Bitcoin currency.

    '
  trans: '

    # 法定货币及其挑战


    一种由政府规则或法律指定为货币的货币，尽管它缺乏内在价值（美元、欧元等）。


    一般来说，一国货币应至少由其领土上产生的商品、产品和服务（GDP）作为支撑，使该国每位公民都能将其个人货币兑换为商品和服务。此外，该国所有银行都承诺使用同一种货币，中央银行也承诺维持其稳定性和可靠性。理论上这是可行的，但在实践中，没人能保证货币的长期稳定性。


    在为公众采购产品和服务方面，一国政府是最大的消费者，也是该国最大的雇主之一。它还是中国道路、住宅、医院和学校等建设最重要的客户。这占据了每个国家国内生产总值（GDP）的最大份额。因此，政府通过支付养老金和社会保险缴费等方式来照顾人民的福利。一切都源于中央银行，它负责发行货币和为政府支出提供资金。


    量化宽松计划最初在美国实施，后来扩展到欧洲、日本等其他国家。结果，世界货币总量大幅增加，而美元购买力在过去一个世纪下降了 95%。这是一个持续的趋势。货币量越大，其价值越低。


    考虑到每种货币都面临通货膨胀，这意味着货币在数年或数十年的过程中贬值。换句话说，通货膨胀被定义为货币流通的速度。随着人们贷款并随后偿还，国家经济经历着自己的周期。


    我不得不提及这些债务的问题。在美国，贷款的平均利率为每年 1%。过去，它们曾长期维持在零水平。中央银行印钞购买金融资产，结果穷人依然贫穷，而拥有金融资产、股票或房地产的人继续获利。结果，每次危机都让穷人更穷，特权阶层更富。这些活动导致了人口的显著分层。不幸的是，经济就是这样运行的，正如许多金融专家预测的那样，我们正濒临一种死境。所有这些都表明，中央银行无力履行其职责。


    结果，人们开始探索保存货币价值的替代方法。如果不是为了增值，至少是为了避免贬值。结果，许多人选择投资黄金、固定收益工具、股票和其他类似资产。同时，随着互联网的引入，经济开始快速发展，人们意识到他们不再需要实物货币就能正常运作。于是，电子货币的概念应运而生。


    比特币等数字货币并非新概念；事实上，它已经存在很长时间了。尽管比特币与其他形式的数字货币有所不同，但存在一个关键区别。如果你使用 PayPal、Western
    Union 或 Skrill 等电子货币服务，你的财务信息将由处理你付款的同一机构持有。在这种情况下，我们面对的是中心化的资金管理，这意味着你的钱的命运掌握在这些公司特定个人的手中。你无法影响所做出的决定。


    ## 加密货币的优势


    另一方面，加密货币则截然不同。这种去中心化货币独立于单一交易处理中心，这正是它与其他货币的区别所在。追踪比特币交易极其困难，一旦发生几乎无法撤销。利用这种货币，两个人可以直接在互联网上进行买卖交易，而无需通过金融交易中心。


    然而，请允许我们更详细地探讨加密货币相对于法定货币的优势。这些优势显而易见！


    **发行和流通标准：** 加密货币的要求一次性设定且不可侵犯，而法定货币的标准则随中央银行的意愿而改变。


    **在实践中，** 比特币从网络流向参与者，而法定货币从中央银行流向银行，从银行流向企业，最后才从企业流向网络参与者。


    **资金流向：** 加密货币直接流动，而法定货币则通过银行、支付系统和现金间接流动。


    **参与者数量：** 比特币约 500 万，法定货币约 70 亿。


    **交易速度：** 加密货币快，法定货币慢。


    **匿名性：** 加密货币始终可实现匿名；法定货币仅在使用现金时偶尔能实现匿名。


    就比特币而言，**通货膨胀不可能发生**；就法定货币而言，通货膨胀是每天的现实。


    **汇率波动：** 加密货币极高，法定货币极低。


    ## 我们时代的蝙蝠侠：比特币发明者


    比特币加密货币是由一位化名中本聪的人在 2008 年全球金融危机期间发明并创造的。这正处于金融危机的高潮期。是他发布了最初的比特币软件，启动了网络，并产出了第一批比特币单位。比特币作为一种全新的数字货币出现，从根本上区别于所有前身。它去中心化的事实是它与其他系统最显著的区别。因此，没有任何参与者能控制结果。


    向你提出以下问题。网络上有大量的人，因为他们互不相识，所以互不信任是可以理解的。那么，人们如何确信付款会被支付，他们的钱不会被拿走呢？


    另一方面，一切都由中本聪提前规划好，并由我在我的著作《精通比特币入门》中详细记录。足以说明中本聪的去中心化货币想法成真了，并解决了一堆问题。


    顺便说一句，中本聪的身份至今仍是个谜。由于一些人认为中本聪实际上是一个团体而非个人，曾多次尝试揭露其身份。然而，这些尝试无一完全成功。


    # 第 3 章：比特币与挖矿


    要充分理解比特币的本质，我们需要更深入地探讨挖矿问题。我稍后会详细讲述作为投资策略的挖矿，但目前，让我们仅从比特币货币出现的角度来思考挖矿。

    '
