    # Margin Trading and Leverage


    Alternatively, consider the following scenario: you maintain your margin position
    in Ether when a flash crash occurs. As a result, the exchange will automatically
    close your position because the value of Ether has dropped by more than 25% at
    the time of your trade. In the event that your loss exceeds $10,000, the stock
    exchange will immediately close your $40,000 investment. That is to say, $10,000
    serves as a form of collateral for your trading activities.


    In any other market, margin or leverage is an excellent instrument for increasing
    your profit margins. Leverage is used by almost all skilled traders. Nevertheless,
    as we previously stated, the Bitcoin market is extremely volatile, and so the
    use of leverage might literally kill you. What causes it to happen? Let''s compare
    it to the stock market for a moment.


    What if something happens, such as a 20 percent drop in Apple stock? What could
    be the cause? I don''t believe anything of the sort will occur. As a result, it
    is relatively risk-free to trade Apple stock using leverage because the stock
    cannot abruptly fall by more than 10%. Meanwhile, you may always close your position
    in the stock market because trading is carefully regulated here, and you can keep
    track of all the events that are taking place in the market.


    On the contrary, the cryptocurrency market is open 24 hours a day, seven days
    a week. Any development is feasible in this situation, including the most illogical
    and nonsensical, because the price can rise or fall by any percentage point. As
    a result, if you want to trade on margin in the Bitcoin market, you must use a
    leverage of 1:2. Trading with a larger degree of leverage will feel more like
    a game of Russian roulette. The majority of the time, if you trade with leverage
    of 1:14, your position will be completely annihilated.


    Always proceed with caution: if you come across an exchange with a questionable
    interface or are offered 1:20 leverage, it is likely that this exchange is looking
    for marginal traders. It is on the lookout for traders who are greedy, crafty,
    and, as experience has shown, foolish, and who wish to raise their profits twenty-fold
    instantaneously. For this reason, I will tell you once more that if you decide
    to trade professionally, you should submit yourself for verification at the most
    reputable exchanges in the world. At the very least, you should open accounts
    with two of them.


    When you are trading on margin, you should have two accounts: one for your money
    and another for the margin. Transferring money from your first account to a margin
    account and then trading from there is the best way to get started with leveraged
    trading.


    In addition, you should be familiar with the following aspects of margin trading:
    Do you believe you will be compensated with money in exchange for nothing more
    than a "thank you"? Without a doubt, this is not the case. You will only be awarded
    money if you earn interest on it. You will pay more interest if, for example,
    you employ a leverage of 1:4 and trade not for the $10,000 you have but for $40,000,
    which means you will pay more in interest. It has the potential to grow at a rate
    of 1% to 2% per day. The interest accrues for a total of $30,000 in the situation
    under consideration. I''d like to remind you that you only have $10,000 in your
    account.


    ## Tips for Beginners


    When trading on the stock market, look for assets whose value has dropped significantly.
    This is the primary technique I am using right now: purchasing undervalued assets
    or assets whose value has declined.


    To close a trade, you should only place an order if you have managed to make a
    profit of more than 50% on your investment. You should close your position as
    soon as you have gained your 50% profit, because waiting for higher profits is
    extremely dangerous. I also do not propose accepting profits that are less than
    10% of the whole investment. In my opinion, a minimum of 20 percent should be
    the minimum you strive for.


    If you trade intraday, you can place sell orders with a profit margin of 30% or
    higher.


    Don''t forget that the exchange charges a commission fee for each transaction.
    The costs increase proportionally to the amount of trading you do. Furthermore,
    the greater your turnover, the lower your commission costs will be.


    # Day Trading and Long-Term Position Trading


    Focus on your job schedule on the cryptocurrency exchange for the time being,
    shall we?


    Before you begin trading, you must make a decision on an extremely crucial topic,
    namely how much time you are willing to devote to the activity of trading. Of
    course, the most efficient method is to sit at a computer for 5–6 hours every
    day, continuously closing positions and keeping an eye on the overall situation.
    However, due to a shortage of time, the majority of people today opt for a different
    option. They swap one item a week with each other. On a particular day, such traders
    review all of the news for the week as well as any charts available, and then
    determine which positions to open or cancel based on their findings.


    This is an option that many people choose, so here are some suggestions:


    - Choose one certain day of the week that you will commit exclusively to trading
    and stick to it.

    - On this day, go through your portfolio and see which currencies have gained
    in value and which have lost value.

    - Keep an eye on the news.

    - Determine your course of action based on current events and the composition
    of your portfolio. If the value of a particular asset has not increased, or has
    even decreased, then the position should be closed. If you see something that
    seems promising or that is becoming more affordable, get it. You should carry
    out these activities on each of the trade days that you have selected for the
    week in question. By the way, I propose that you use `Blockfolio` to make tracking
    your positions easier and less time-consuming.


    To summarize, I recommend that you choose between two forms of trading: daily
    monitoring with limit sell orders or weekly monitoring with limit buy orders.


    Meanwhile, certain cryptocurrency exchanges, such as `Bitfinex`, provide over-the-counter
    (OTC) trading services. Over The Counter (OTC) is an abbreviation that refers
    to a transaction that takes place over the counter. This is a decentralized market
    that does not have a central physical location where market participants exchange
    assets through the dealers'' network of brokers and dealers.


    For example, if you don''t have time to keep up with the market and are totally
    committed to trading by placing orders, you can make use of the services provided
    by this market. Your collaboration will be conducted through the use of a mobile
    phone or an e-mail address. As a result, you tell a dealer that you, for example,
    want to purchase $250 worth of Bitcoin. After looking through the market, the
    dealer responds with an estimate of how much you should spend on this quantity
    of Bitcoins. This service will be provided at a cost by the dealer.


