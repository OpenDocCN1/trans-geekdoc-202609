    其价值在首次登上世界舞台后立即飙升至 4000 美元以上。用一个不太准确的说法，一天的挖矿回本率达到了 100%。然而，过了一段时间后，该货币价值大幅暴跌。


    ## 投资警示


    我想引起你对一件至关重要事情的注意。人们常因炒作而被诱导购买加密货币。换句话说，他们仅基于大量他人的行为购买某种币种，而未意识到这可能纯粹是投机目的，而非该币种具有真实价值。结果，你可能会长期处于亏损状态。这就是为什么我建议你不要陷入新型加密货币的炒作漩涡，而是将币种存放在钱包中，以便获得更多收益。


    ## Ethereum Classic（以太经典）


    让我们看看以太经典加密货币在现实中的表现。


    2016 年 6 月底，可以说是加密货币历史上最重大的网络攻击发生了。一个极具前景且广受支持的项目。由于编码错误，DAO（去中心化自治组织）损失了 6000
    多万美元。但首先，让我们退一步看看全貌。


    DAO 是互联网历史上最大的众筹项目。它是建立在以太坊上的首个去中心化自治组织，也是一种投资者主导的风险投资基金。当你购买该组织的代币时，你获得了特定公司的成员资格，可通过投票远程治理。换句话说，它是一个完整的公司，人们可以达成协议、选择投资工具，并从组织获得分红。


    然而，有一天，某人发现了 DAO 算法的漏洞，窃取了价值约 6000 万美元的代币。他后来声称自己未做任何违法之事，因为他未破解加密，但这被证明是错误的。他甚至表示愿在法庭上为其立场辩护。


    此人的行为引发广泛恐慌，许多人因此损失资金。此外，DAO 危机对以太坊平台本身也有重大影响。以太币价格几乎瞬间腰斩。因此，以太坊创始人维塔利克·布特林被迫做出中心化决策以挽救局面。他决定设计一个分叉。


    为了区分两种分叉类型，应使用软分叉和硬分叉。「软分叉」是软件协议的变更，仅使之前有效的区块和交易无效。软分叉与旧系统向后兼容，因为新区块会被旧节点视为真实。它是允许之前无效的区块和交易变为有效（或反之）的重大协议变更。硬分叉是与先前区块链版本的永久性分歧，运行旧版本区块链的节点将不再被最新版本接受。


    维塔利克·布特林提议创建软分叉，允许网络上所有交易回滚至盗窃发生时刻。最初所有 DAO 成员同意，但随后其他人站出声称未准备好接受这种中心化举动。结果发生了硬分叉。以太币分裂为两种货币。以太经典是其中第一且最基础的一种。


    顺便提一下，有预测认为如果以太坊如上所述从工作量证明转向权益证明（仅部分代币被挖出，节点担保剩余部分），许多矿工从以太币获得的收益可能减少。他们很可能会迁移到以太经典。我认为这种情况有潜力推动该货币扩张。


    ## Dash（达世币）


    让我们看看达世币加密货币。这种货币用于日内交易，以日元计价。在图表分析方面，这种币种极其技术化。它运行在部分去中心化的工作量证明和权益证明混合系统上。


    同时，它是日常消费的绝佳货币。此外，达世币提供主节点工具，计划仅在以太坊区块链上发布。


    如果该货币能率先提供快速便捷的资金转移和购物支付能力，它将拥有光明未来。例如，名为「达世币进化」的项目正处于开发阶段。它是常规网上银行，已被许多人誉为贝宝的最佳替代品。预计将在
    2017 年底完成。我预测，该计划将受到不支持比特币无政府主义或严格去中心化、只想利用加密货币进行交易和保值的用户的赞誉。


    该货币的另一重要特性是匿名性。每次新转账都会将币混合在一起，使钱包中的特定交易难以追踪。比特币有单独的混币服务，而达世币则自动完成此过程。


    ## Waves（波币）


    由俄罗斯程序员亚历山大·伊万诺夫开发的波币加密货币是下一个讨论话题。在波币平台上，只需点击几下即可创建自己的代币并立即出售！可以在去中心化的波币市场出售代币，购买你代币的任何人都能立即尝试在交易所出售。设计自己的代币不超过
    5-10 分钟。相较于以太坊代币，波币代币更简单，因为它们无需大量编程即可正常运行。


    ## Dogecoin（狗狗币）


    狗狗币是一种既有趣又实用的加密货币。它是一种作为玩笑创建并在网络上流传的模因货币。没人预料到它会广为人知。无论如何，这种币种内在价值极低，极少被遇到。


    狗狗币的价格偶尔会被人为操纵，人们乐于参与这种游戏。最后以最高价买入该币种的人将遭受损失。

    '
