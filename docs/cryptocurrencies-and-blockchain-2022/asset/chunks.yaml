- raw: 'The Lighting Network has also recently been launched in the Litecoin cryptocurrency.
    Known as the Lighting Network, it is an off-chain micropayment system with extremely
    minimal transaction fees. In case you are under the impression that it is insignificant,
    believe me when I say that it is in fact significant.


    In a nutshell, Litecoin is a currency that is both modern and fast-paced. In my
    opinion, both Bitcoin and Litecoin should be included in your cryptocurrency investing
    portfolio. Bitcoin is regarded as a highly reliable form of money, and Litecoin
    is utilized for the purpose of conducting experiments that can be applied to Bitcoin
    in the future.


    Zcash is yet another cryptocurrency that deserves to be taken into consideration.
    It is the most anonymous cryptocurrency currently accessible. It makes use of
    zero-knowledge proofs, which are a fundamental building element for increased
    financial and data privacy in cryptocurrencies, among other things. Only developers
    with extensive experience understand how it works. Despite this, the protocol
    of this coin is now being used on a large number of blockchains.


    Its worth soared to more than $4,000 right away after it first emerged on the
    world stage. For want of a better expression, the mining recoupment rate for one
    day was 100 percent. However, after a period of time, the value of this currency
    plummeted dramatically.


    I''d like to draw your attention to something really vital right now. People are
    frequently enticed to purchase cryptocurrencies because they believe the hype.
    In other words, they purchase a certain coin solely on the basis of the actions
    of a large number of other people, not comprehending that this can be done solely
    for speculative purposes and not because the coin has any real value. As a result,
    you may find yourself in the red for an extended period of time. This is why I
    propose that you not get caught up in the hoopla around a new type of cryptocurrency
    and instead store your coins in your wallet so that you can make significantly
    more.


    Let us now move on to the Ethereum Classic cryptocurrency. Let''s have a look
    at how it seemed in real life.


    At the end of June 2016, what is arguably the most significant cyberattack in
    the history of cryptocurrencies occurred. An extremely promising and widely supported
    initiative. A coding error caused the DAO to lose more than $60 million as a result
    of the error. But first, let''s take a step back and look at the big picture.


    The DAO is the largest crowd-funding endeavor in the history of the internet.
    It was the world''s first decentralized autonomous organization built on Ethereum,
    as well as a kind of investor-directed venture capital fund. When you purchased
    tokens in this organization, you were granted membership in a specific firm, which
    you could remotely govern by voting. To put it another way, it was an entire corporation
    where people could come to agreements, choose investment instruments, and then
    receive dividends from the organization.


    However, one day, a certain individual discovered a flaw in the DAO algorithm
    and was able to steal tokens valued at approximately $60 million. He later asserted
    that he had done nothing illegal because he had not cracked the encryption, which
    was later proven to be incorrect. He went so far as to say that he was prepared
    to defend his position in court.


    The actions of this individual sparked widespread alarm, with many individuals
    losing their money as a result of the incident. Additionally, the crisis with
    The DAO had a significant impact on the Ethereum platform itself. The price of
    ether plummeted by half almost instantly. As a result, Vitalik Buterin, the founder
    of Ethereum, was compelled to make a centralized decision in order to salvage
    the situation. He made the decision to design a fork.


    To distinguish between the two types of forks, a soft fork and a hard one should
    be used. A "soft fork" is a change to the software protocol in which only blocks
    and transactions that were previously valid are rendered invalid. A soft fork
    is backwards-compatible with the previous system because the new blocks will be
    recognized as genuine by the old nodes. It is a significant alteration to the
    protocol that allows blocks and transactions that were previously invalid to become
    valid (or vice-versa). A hard fork is a permanent divergence from the prior version
    of the blockchain, and nodes running earlier versions of the blockchain will no
    longer be accepted by the newest version.


    Vitalik Buterin proposed the creation of a soft fork that would allow all transactions
    on the network to be rolled back until the time of the heist. When he first proposed
    it, all of the DAO members agreed, but then other people came out and claimed
    they were not ready for such a centralized move. The hard fork occurred as a result
    of the efforts of those individuals. Ether has been divided into two currencies.
    Ethereum Classic is the first and most fundamental of these.


    As a side note, there are some predictions that if Ethereum converts from Proof
    of Work to Proof of Stake, as we discussed above (and only a portion of the coins
    will be mined while the nodes would guarantee the remaining portion of the coins),
    many miners may receive less money from Ether. It seems likely that they will
    migrate to Ethereum Classic. This situation, I believe, has the potential to drive
    the expansion of this currency.


    Let''s take a look at the Dash cryptocurrency. This currency is used for intraday
    trading and is denominated in yen. When it comes to charting, this coin is extremely
    technical. It operates on a proof-of-work and proof-of-stake system that is partially
    decentralized.


    At the same time, it is a fantastic currency for spending money on a daily basis.
    In addition, Dash provides a masternode tool, which is scheduled to be released
    only on the Ethereum blockchain.


    This currency has a bright future if it can be the first to offer the ability
    to move money quickly and easily as well as pay for purchases. For example, a
    project called Dash Evolution is now in the development stage. It is routine online
    banking, which has already been dubbed as the best alternative to PayPal by many.
    We expect to be finished by the end of the calendar year 2017. The initiative,
    I predict, will be lauded by users who do not support bitcoin anarchists or rigorous
    decentralization but who just want to take advantage of cryptocurrencies for the
    purposes of performing transactions and retaining their money.


    A further significant feature of this currency is its anonymity. Every new transfer
    of this currency results in the coins being jumbled together, making it difficult
    to track down a specific transaction in your wallet. When it comes to Bitcoin,
    there is a separate service for mixing currencies, but when it comes to Dash,
    this happens automatically.


    The Waves cryptocurrency, developed by Russian programmer Alexander Ivanov, is
    the next topic of debate. Create your own tokens with a few clicks on the Waves
    platform and sell them right now! It is possible to sell tokens on the decentralised
    Waves market, and anyone who purchases tokens from you will be able to instantly
    try to sell them on the exchange. It will take you no more than 5–10 minutes to
    design your own. Waves tokens are simpler than Ethereum tokens when compared to
    each other because they do not require significant programming to function properly.


    Dogecoin is a cryptocurrency that is both interesting and useful. It is a form
    of meme currency that was created in jest and circulated on the internet. No one
    anticipated that it would become widely known. In any case, this coin has little
    intrinsic value and is almost seldom encountered.


    Dogecoin''s price is purposefully manipulated every now and then, and people take
    pleasure in participating in this fun. The individual who is the last to purchase
    the coin at the greatest price is the one who suffers a loss.'
  fmt: '

    # 加密货币概览


    ## Litecoin（莱特币）


    Lightning Network 最近也在 Litecoin 加密货币中推出。作为一种链下微支付系统，Lightning Network 拥有极低的交易费用。如果你认为它微不足道，请相信我，它实际上非常重要。


    简而言之，Litecoin 是一种既现代又快节奏的货币。在我看来，比特币和 Litecoin 都应该纳入你的加密货币投资组合。比特币被视为一种高度可靠的货币形式，而
    Litecoin 则被用于进行未来可应用于比特币的实验。


    ## Zcash（大零币）


    Zcash 是另一种值得考虑的加密货币。它是目前最匿名的加密货币。它使用零知识证明，这是加密货币中增强金融和数据隐私的基本构建模块。只有经验丰富的开发者才理解其工作原理。尽管如此，该币种的协议现在已被大量区块链采用。


    其价值在首次登上世界舞台后立即飙升至 4000 美元以上。用一个不太准确的说法，一天的挖矿回本率达到了 100%。然而，过了一段时间后，该货币价值大幅暴跌。


    ## 投资警示


    我想引起你对一件至关重要事情的注意。人们常因炒作而被诱导购买加密货币。换句话说，他们仅基于大量他人的行为购买某种币种，而未意识到这可能纯粹是投机目的，而非该币种具有真实价值。结果，你可能会长期处于亏损状态。这就是为什么我建议你不要陷入新型加密货币的炒作漩涡，而是将币种存放在钱包中，以便获得更多收益。


    ## Ethereum Classic（以太经典）


    让我们看看 Ethereum Classic 加密货币在现实中的表现。


    2016 年 6 月底，可以说是加密货币历史上最重大的网络攻击发生了。一个极具前景且广受支持的项目。由于编码错误，DAO 损失了 6000 多万美元。但首先，让我们退一步看看全貌。


    DAO 是互联网历史上最大的众筹项目。它是建立在以太坊上的首个去中心化自治组织，也是一种投资者主导的风险投资基金。当你购买该组织的代币时，你获得了特定公司的成员资格，可通过投票远程治理。换句话说，它是一个完整的公司，人们可以达成协议、选择投资工具，并从组织获得分红。


    然而，有一天，某人发现了 DAO 算法的漏洞，窃取了价值约 6000 万美元的代币。他后来声称自己未做任何违法之事，因为他未破解加密，但这被证明是错误的。他甚至表示愿在法庭上为其立场辩护。


    此人的行为引发广泛恐慌，许多人因此损失资金。此外，DAO 危机对以太坊平台本身也有重大影响。以太币价格几乎瞬间腰斩。因此，以太坊创始人 Vitalik Buterin
    被迫做出中心化决策以挽救局面。他决定设计一个分叉。


    为了区分两种分叉类型，应使用软分叉和硬分叉。"软分叉"是软件协议的变更，仅使之前有效的区块和交易无效。软分叉与旧系统向后兼容，因为新区块会被旧节点视为真实。它是允许之前无效的区块和交易变为有效（或反之）的重大协议变更。硬分叉是与先前区块链版本的永久性分歧，运行旧版本区块链的节点将不再被最新版本接受。


    Vitalik Buterin 提议创建软分叉，允许网络上所有交易回滚至盗窃发生时刻。最初所有 DAO 成员同意，但随后其他人站出声称未准备好接受这种中心化举动。结果发生了硬分叉。以太币分裂为两种货币。Ethereum
    Classic 是其中第一且最基础的一种。


    顺便提一下，有预测认为如果以太坊如上所述从工作量证明转向权益证明（仅部分代币被挖出，节点担保剩余部分），许多矿工从 Ether 获得的收益可能减少。他们很可能会迁移到
    Ethereum Classic。我认为这种情况有潜力推动该货币扩张。


    ## Dash（达世币）


    让我们看看 Dash 加密货币。这种货币用于日内交易，以日元计价。在图表分析方面，这种币种极其技术化。它运行在部分去中心化的工作量证明和权益证明混合系统上。


    同时，它是日常消费的绝佳货币。此外，Dash 提供主节点工具，计划仅在以太坊区块链上发布。


    如果该货币能率先提供快速便捷的资金转移和购物支付能力，它将拥有光明未来。例如，名为 Dash Evolution 的项目正处于开发阶段。它是常规网上银行，已被许多人誉为
    PayPal 的最佳替代品。预计将在 2017 年底完成。我预测，该计划将受到不支持比特币无政府主义或严格去中心化、只想利用加密货币进行交易和保值的用户的赞誉。


    该货币的另一重要特性是匿名性。每次新转账都会将币混合在一起，使钱包中的特定交易难以追踪。比特币有单独的混币服务，而 Dash 则自动完成此过程。


    ## Waves（波场币）


    由俄罗斯程序员 Alexander Ivanov 开发的 Waves 加密货币是下一个讨论话题。在 Waves 平台上，只需点击几下即可创建自己的代币并立即出售！可以在去中心化的
    Waves 市场出售代币，购买你代币的任何人都能立即尝试在交易所出售。设计自己的代币不超过 5-10 分钟。相较于以太坊代币，Waves 代币更简单，因为它们无需大量编程即可正常运行。


    ## Dogecoin（狗狗币）


    Dogecoin 是一种既有趣又实用的加密货币。它是一种作为玩笑创建并在网络上流传的模因货币。没人预料到它会广为人知。无论如何，这种币种内在价值极低，极少被遇到。


    Dogecoin 的价格偶尔会被人为操纵，人们乐于参与这种游戏。最后以最高价买入该币种的人将遭受损失。

    '
  trans: '

