    # 了解 ICO 诈骗与投资风险


    ## 简介


    毫无疑问，您已经看到，首次代币发行（ICO）领域存在大量骗子。让我们花点时间谈谈 ICO 诈骗。只需搜索“scam + history”（诈骗 + 历史），就会列出一长串以各种方式决定利用他人信任或粗心大意的服务，以及大量诈骗项目本身。所涉及的领域极其多样，范围涵盖从能源到金融部门等。尽管首次代币发行（ICO）自
    2013 年才出现，但该领域已经经历了大量诈骗。


    ### ICO 诈骗的危险信号


    如何判断一个首次代币发行（ICO）是否为诈骗？以下是您应留意的事项：


    - 首次代币发行（ICO）的概念仅产生数字货币，该货币被定位为一种通用的国际支付手段，却未说明其任何特殊优势。

    - 尽管没有提出明确的利润分享模式，但支持者却将该计划描绘成规模异常庞大。

    - ICO 项目的开发者将所有精力都投入到营销中，却对代码绝口不提，代码甚至可能完全闭源（非开源）。

    - 骗子通常会创建一个平台，却不展示任何实质性的劳动成果。

    - 主要开发者可能在专业圈子里很有名，或者他/她可能已经涉足犯罪活动。


    ## 成功的 ICO 案例


    值得注意的是，存在大量成功的首次代币发行案例。首次代币发行（ICO）的成功基于多个变量因素。筹集资金的数量传统上被用作筹款成功与否的衡量标准。在加密货币筹款方面，Bancor
    项目目前是领跑者（截至本书撰写时），它在 2017 年 6 月不到三小时内筹集了 396,720 ETH。另一个成功的快速众筹案例是革命性的 Brave 浏览器活动，该项目在存在的最初几分钟内就筹集了
    3600 万美元。此外，2017 年 5 月，Storj 项目（不到一周筹集 3000 万美元）和 Aragon 项目（ICO 开始仅 15 分钟就筹集了所需的
    275,000 ETH，约合 2500 万美元）跻身成功的加密货币众筹行列。


    其他项目包括 MobileGo（5300 万美元）、Gnosis（10 分钟筹集 1250 万美元）、Blockchain Capital（2 小时筹集 1050
    万美元）、Aeternity（最初几小时筹集 200 万美元），以及最著名的 Status（9000 万美元），后者导致以太坊网络瘫痪数小时。我们也不能忘记著名的
    DAO 项目，它在 2016 年夏天破产，并催生了以太坊经典（Ethereum Classic）。


    ### 成功因素


    首次代币发行（ICO）的成功主要不仅取决于概念，还取决于执行得当的公关工作。


    ## 投资者资金保护


    您可能会问：在这类项目中，投资者的资金是如何得到保障的？我的回答很简单：资金没有得到保障。在大多数情况下，唯一的安全保障基于项目的声誉，即那些不认识你的人的声誉。


    ## 尽管有风险为何仍投资


    考虑到所有这些因素，为什么人们还继续投资这些项目？以下是人们愿意承担参与 ICO 风险的一些原因：


    - 渴望从流行趋势中获利

    - 想采取商业合作伙伴的立场，以满足其他投资者的预期

    - 相信初创公司的潜力


    由于没有规则监管 ICO 的行为并保护您免受骗子侵害，因此在做决定前仔细评估要投资的 ICO 至关重要。在首次代币发行（ICO）以及众筹中，项目从未达到产品执行阶段的情况并不少见。


    ## 投资前的关键考量


    如果您仍对某个首次代币发行（ICO）感兴趣并准备投资，请密切关注以下重要考量因素：


    - 项目的白皮书和路线图

    - 产品的本质（可行性、需求，以及项目是否解决了真实存在的问题）

    - 项目与区块链的结合（是否必要或牵强附会）

    - 项目管理团队（经验、履历）

    - 项目主要负责人（他们的经验、履历）

    - 项目预期成果的演示（资金用途）


    ### 需要提出的额外问题


    此外，您应寻找以下问题的答案：


    - 这些代币和加密货币的需求驱动力是什么？是什么会导致流通币数量显著增加，用它们可以兑换什么？

    - 一旦收到，是否可以用它们兑换物品或出售？

    - 同时，作为投资者评估 ICO 时，您应考虑该项目是否有能力自行解决其创建初衷所要解决的问题或执行任务。


    ### 投资建议


    此外，请记住以下建议：


    - 选择一个您至少对其基本概念有所了解的项目。

    - 理性投资，不要过度纠结，并避免将所有资金投入单一项目。

    - 始终保持谨慎。即使您在某次首次代币发行（ICO）中走运，也不能保证未来不亏损。


    ## ICO 研究资源


    您可以通过访问 `icorating.com` 了解更多发行首次代币发行（ICO）的公司信息。Icorating 是一个公正的机构，维护着一个包含各种首次代币发行（ICO）的数据库，包括已结束和即将到来的。那里还有一份被认为是彻头彻尾诈骗的首次代币发行（ICO）名单。`icorating.com`
    的专家评估以下 ICO 特征：


    - 公司模式（其相关性、优点和缺点）

    - 寻找市场利基（所选商业利基的发展前景和动态）

    - 团队组成（在传统市场细分领域、区块链行业拥有商业经验，以及区块链开发经验的人员）

    - 竞争（来自传统市场细分领域和区块链经济中具有相似商业模式公司的竞争压力水平）

    - 技术领域的背景知识（原型或源代码的可用性和质量）

    - 正在分析社区反馈


    在查阅了该机构对首次代币发行（ICO）的初步评估后，您将更有准备地分析您正在考虑的项目，以做出是否投资的最终决定。


    `Icotracker.net` 是另一个提供首次代币发行信息的网站。在这里您可以找到即将到来的首次代币发行（ICO）列表。我还建议 `icobazaar.com`、`icocountdown.com`
    和 `cyber.fund/radar` 作为投资者的额外资源。


    ## 市场对比


    ICO 市场正变得与 1990 年代（1995-2001）的互联网泡沫惊人地相似。如今人们回忆起 Apple、Amazon 和 Google 等公司的首次公开募股（IPO），并想知道如果他们在该公司
    IPO 时投资，本可以获得何等财富。

    '
