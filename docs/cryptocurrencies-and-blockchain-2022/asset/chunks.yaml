    # 加密货币的必然性与特斯拉类比


    ## 第四：极低的监管风险


    第四，目前市场上几乎没有风险。五年前，大多数人还在期待加密货币被法律禁止的那一天到来。世界上许多国家已经承认比特币作为合法金融资产的重要性。加密货币已获得如此势头，以至于没有人能简单地倒转时钟。你难道不认为这个现实证明了你可以投资资金，而无需担心遭受各种禁令和限制吗？


    ## 最后：通过特斯拉投射比特币的未来


    最后，在继续讨论加密货币市场的游戏规则之前，通过特斯拉公司的视角来思考比特币的未来可能是什么样子是值得的。据专家预测，特斯拉目前的价格预期如此之高，以至于购买后至少
    300 年内无法收回成本。特斯拉有什么地方让聪明的专家认为它们如此伟大？让我们看看能否弄清楚。


    如今，电动汽车外观精美、时尚，但也昂贵，作为一种交通工具并不太实用。另一方面，专家们并不担心今天。他们想象一个可能在 20 或 30 年内成为现实的未来。他们持乐观态度。现在很难想象未来我们每天在街上看到的普通汽车会是什么样子。你可能设想未来是你心爱的旧车，但我个人设想的是某种配备太阳能电池板的半飞行载具，甚至比那更先进的东西。因此，电动汽车将拥有漫长而繁荣的未来，特斯拉有望在行业中占据主导地位。


    结果表明，在很大程度上，没有人能预测特斯拉是否能在未来 20-30 年内保持其在市场上的主导地位。另一方面，许多人坚信它能做到，这种信念促使他们投资该公司。


    基于我自己的亲身经历，我因此可以轻易地认为特斯拉将在 20 年内垄断整个汽车制造业。


    这个例子与加密货币的未来有什么关系？一些人认为加密货币（以及电动汽车）毫无意义，而另一些人则将其视为一种时尚、有趣且技术上引人入胜的时髦事物。尽管如此，存在一种趋势。然而，这小小的一滴水现在有潜力在未来扩展成一个巨大而强大的大海。


    # 设定目标并确定市场的主要规则


    真正的专业人士学习游戏规则并为自己设定目标，在其领域开拓新天地之前明确他们想要达到什么样的结果。既然我们是专业人士，我们将从处理这项任务开始。


    ## 加密货币交易目标


    以下几点无疑应在你为自己设定的加密货币交易目标中占据显著位置：


    1. 明确你每月将在比特币投资领域投入的具体金额或收入比例；

    2. 确定你准备承担风险的程度；

    3. 制定清晰的短期和长期目标清单。


    ## 成功入市的要求


    在确立目标之后，理解成功快速进入比特币市场所需的条件至关重要。你可能会惊讶地发现，理论是这门学科中最不重要的方面。许多人声称他们缺乏在该行业运作所需的信息和知识。然而，我将与你讨论的大多数策略并不需要对比特币商业世界有广泛的了解即可生效。你只需熟悉加密货币经济的基本原则即可。


    那么，问题到底出在哪里？你需要投入一些时间。无论是书籍（甚至不是我的书）还是任何其他信息来源，都无法帮助你学会在哪里买、在哪里卖、使用什么类型的存储，或如何转移加密货币。


    你还将需要以下内容：


    - 几套可用于入市的现成低风险战术。

    - 筛选你周围环境中内容和信息的能力。

    - 鼓励与加密货币市场上更有经验的交易者交流，以及“窥探”他们的行为。

    - 预防和降低风险。

    - 由拥有多年经验的资深导师进行评估。


    ## 个人责任与风险意识


    现在我们切入正题：在加密货币市场进行任何类型的投资都充满危险，你必须时刻铭记这一点。如果你没有准备好接受这一点，请不要尝试。关于某种货币发展前景的任何观点或预测、首次代币发行（ICO）的可靠性（稍后将探讨）或任何其他话题，都只是带有偏见的视角。地球上没有任何一个人能给你
    100%的保证，确保事情会继续朝着正确的方向发展。没有完美正确的选择，生活中也没有 100%的保证。我或任何其他人能提供给你的只有建议；我们无法提供保证。


    你是唯一对你在生活中做出的每一个决定负责的人。你不应因潜在的财务损失而责怪你阅读过的关于某种加密货币前景的网站、推荐可靠 ICO 的朋友，甚至是我。作为本书作者，我想与你分享我关于可靠加密货币的观点。然而，这仅仅是我的主观观点，且仅在当下有效。因此，如果你倾向于为自己的潜在失误责怪他人而非自己，你应该立即毫不犹豫地合上这本书。


    比特币行业生机勃勃，且时刻在发展。因此，在从事加密货币交易时，必须学会为决策承担个人责任，并永远记住不冒险就无法获得收益。是的，存在风险较小的方法，但在所有情况下风险依然存在。只投入你愿意承担损失且不会因此感到内疚的金额。


    ## 新手必备安全预防措施


    暂时放下书，记下以下两条你绝不能违反的准则：


    1. 不要把所有钱都投进去，直到身无分文。

    2. 手头保留现金储备，以防机会出现。


    最后，新手在交易所交易时应注意一些重要的安全预防措施：


    - 使用双因素认证保护你的账户，并保密你的账号代号，不要告诉他人。

    - 你的密码长度应至少为 26 位；专用密码生成器可以帮你生成强密码。

    - 避免将所有资金存放在单一交易所或钱包中。

    - 仅在运营时间长的交易所进行交易。

    - 如果你想在加密货币市场交易，请避免使用公共网络接入点。


    # 第 2 章 加密货币基本原理与我们时代的蝙蝠侠


    让我们采取迂回的方式切入这个话题，从银行业作为切入点开始。


    ## 银行系统对货币的垄断


    无论在哪个国家运营，我们当今的整个金融系统的设置方式都是让我们不拥有资金的所有权。在每个国家，中央银行都拥有由立法授予的发行垄断权，这给该司法管辖区内加密货币的合法性构成了重大障碍。


    ## 法币定义


    法币是加密货币社区用来指代传统纸币和硬币的术语。

