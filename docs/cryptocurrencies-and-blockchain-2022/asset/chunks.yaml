  trans: '

    ## ICO 评估标准


    3. 竞争对手在市场上正在获利。


    4. 有影响力的社区成员的背书是一项


    5. 参加加密货币相关活动并进行演示。


    6. 专家和评级机构提供有利的评估。


    7. 首次代币发行（ICO）期后的资金分配


    8. 在 GitHub 上公开源代码。


    以下网站和社交媒体平台提供关于 Bitcointalk 的更多信息：Bitcointalk、Reddit、Slack、Twitter、Telegram 和
    YouTube。


    当你选择了一个首次代币发行（ICO）并决定投资时，你需要密切关注该公司定期发布的信息。这可以通过参与他们的讨论并在 Twitter 上关注项目来实现。浏览他们的
    Twitter 归档。那里有大量信息。记住，是你把钱给了他们，所以不要被这项工作或所涉及的时间投入吓倒。


    像 smithandcrown.com、icoalert.com 和 icotracker.net 这样的网站可以让你追踪首次代币发行。


    现在我将给你一些关于如何在投资首次代币发行（ICO）时做出明智决策的建议。


    我建议你在破产前购买首次代币发行（ICO）并持有它们，以防其中一个腾飞。说实话，我有一份单独的清单，列出了所有正在下跌的 ICO，并且我每天都在跟踪它们。我愿意用一小笔钱购买它们以便处理掉。例如，可以出价要价的百分之十。既然如此，我将乐意进行购买，例如花费
    1000 美元，这样我的风险将保持在 1000 美元的水平。


    第二条建议是，许多人认为如果价格开始下跌，就是资不抵债的信号，你应该立即逃离。如果价格上涨，你会被迫购买。实际上，一切都朝相反方向运作。发现强弱币种和代币的最佳时机是市场下跌时。留意当币值下跌时，该币的交易量是否增加。交易量增加是积极的信号。如果币价下跌而交易量没有增长，表明这些币没有需求，卖家被迫持续降价。


    此外，请记住，目前 99% 的首次代币发行（ICO）都是骗局。然而，你也可以选择参与这些 ICO。是的，你没看错。你这样做可能是为了从贪婪且无知的人身上赚钱。ICO
    是合法的庞氏骗局这一事实，以及你的目的是尽快进场和出场，在一定程度上进一步证明了这一点。


    ## 如何参与 ICO


    假设你发现了一个有前景的首次代币发行。要参与其中，你必须首先访问该组织的网站。要获取 EOS，请导航到“代币”页面并选择“获取 EOS”。


    之后，请务必勾选声明你理解并同意项目条款的复选框。如果你深究条款，你就是同意可能损失本金的可能性。选择“继续”后，你将被引导至一个描述项目如何为其完成筹集资金的页面。


    依我之见，所有数字，特别是与市值相关的数字，都应仔细审查。如果 ICO 的总市值低于 5 亿美元，那是可以接受的。


    然而，如果你将代币价值乘以预先确定的代币总数，得出的市值达到 50 亿美元，这应该让你停下来考虑一下。


    如果你有之前的 ICO 数据，也可以将你感兴趣的 ICO 的市值与之前 ICO 的市值进行比较。在比较代币价值时，请记住，整个公司的市值比单个代币的价值更重要。


    请密切关注“日程”部分，以了解 ICO 将持续多长时间。


    你购买的 ICO 代币将在很短的时间内出现在 hitbtc.com 交易所。你也可能在该部分找到通过首次代币发行（ICO）提供的代币。


    即使你无法确定如何参与 ICO，任何 ICO 的网站都会始终提供详尽的说明（有时甚至包括视频）。那里也有关于如何进行资金转账以参与首次代币发行（ICO）的说明。但请记住，这笔钱只能从你的钱包发送，不能从交易所本身发送。


    这就是首次代币发行（ICO）的运作方式，也是我建议你购买它们的方式。无论你做什么，请记住这一点：不要在一个 ICO 中停留过长时间。一旦你能获得微薄的利润，就应该卖出。


    # 第 12 章 交易


    作为本课程的一部分，你将学习在股市下单，以及不同类型的交易和如何评估图表形态。


    ## 在交易所下单


    交易所订单用于在市场交易时在交易所开仓和平仓。订单有两种类型：市价单和挂单，它们的执行方式不同。另一方面，挂单可以是限价单、止损单或止损限价单。


    任何资产都可以使用多种类型的订单进行买卖。


    我建议你仅使用限价单，但我们稍后在文章中会更深入地探讨这一点。


    请看下面在 Kraken 交易所下单的示例：虽然订单的外观在不同证券交易所可能有所不同，但订单的核心保持不变。


    在证券交易所下市价单是买卖最快、最方便的方式。如果该单有对应的反向限价单，它将在下单后立即以当前市场价格执行。否则，它将不执行。如果你想执行市价买单，例如，你需要先下一个限价卖单。为了执行市价卖单，必须先执行一个限价买单。


    为了执行市价单，会从所有可用的限价单中选择最优的限价单。因此，市价买单在卖价成交，而市价卖单在买价成交。


    处理此类订单时，你无需指定价格；相反，你只需指定数量，即你想买多少。然而，你可能会遇到一个重大困难——滑点。那到底是什么？它是预期成交价格与实际成交价格之间的差额。在波动加剧时期，使用市价单时可能会发生滑点；此外，当订单很大时，在预期价格可能没有足够的对手盘，从而导致滑点。


    维持预期交易价格稳定所需的水平。正是因为这个原因，我不鼓励在任何情况下使用市价单。


    暂时让我们回顾一下买价、卖价和点差这些术语，它们在本节前面已详细讨论过。买价是加密货币买家愿意为加密货币支付的价格。卖家愿意接受的价格称为“卖价”。这两个价格之间的差额称为点差。

    '
