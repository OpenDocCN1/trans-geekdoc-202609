  trans: '

    最后，谈谈 Namecoin 的一些想法。它是 Bitcoin 的一个分叉，允许你购买 `a.bit` 网站，这是一种去中心化托管服务。


    让我再提几个不太靠谱的货币。Ripple（瑞波币）就是这样一种浮现在脑海中的加密货币（尽管许多人已经从中赚了很多钱）。


    Ripple 是一种由中央权威控制的数字货币。公司的控制权掌握在一群银行手中，其中最大的一家总部设在日本。随着日本将 Bitcoin 合法化，这种币的价值开始上涨。


    这种货币的一个显著缺点是，当你向另一种货币（如美元或欧元）的持有者转账时，你会损失一定数量的 ripple。因此，问题在于这如何影响汇率与交易数量的关系。


    同时，官方网站上没有该币的钱包可用。创建钱包将要求你在 `gatehub.net` 上寻找，你可以在这里找到它。


    让我们总结一下目前所说的内容。在撰写本书时，共有 804 种加密货币存在。然而，我不建议你研究所有这些货币；只关注前 10 名即可。只有当你开始看到盈利时，才可以将投资范围扩大到这前十名之外。


    允许我给你一些实用建议。为了做出最佳投资决策，我建议你考虑你的投资组合构成（我指的是被动组合投资）。如果你想在投资组合中包含市值前三的加密货币，请考虑这些加密货币的价格在不久的将来可能会如何波动。你还应该仔细研究该货币交易的市场，以及日线图，以估算过去
    24 小时内你的货币成交金额。


    最后，我要再次提醒你，比特币市场没有任何保证。如果你读到了或多或少可靠的关于币种的信息，这并不一定意味着该信息是正确的。这仅仅是我对该事项的个人看法。


    因此，是否购买特定币种完全取决于你自己。


    # 第 8 章. 最流行的加密货币交易所


    既然我们已经掌握了几种币的特点，接下来我们可以了解一下最常见的加密货币交易所。


    如果你想用美元、欧元或其他传统货币购买或出售加密货币，或者你想将一种加密货币兑换成另一种，你必须使用加密货币交易所。


    我强烈建议你只与最知名的交易所合作。你可以对他们的可靠性更有信心，这意味着你将能保住更多的钱。


    Poloniex 是第一个值得关注的交易所。


    Poloniex 是美国主要的比特币交易所之一，拥有超过一百万用户。


    根据聚合网站 `coinmarketcap.com` 的数据，在全球交易比特币的所有加密货币交易所中，它的交易周转额排名第二。尽管如此，就我所见，Poloniex
    是经常无法正常运行的交易所之一。一些人认为它将在不久的将来破产。


    现在让我们把注意力转向一些关于股市投资的实用建议。


    无法在 Poloniex 交易所存入传统货币，如美元、欧元等。相反，必须使用加密货币。在 `tether.to` 上，你可以购买可兑换现金的代币。这些代币几乎不受篡改或替代的影响。由于这种稳定性，我认为在发生信任危机时，人们会倾向于将他们的比特币资产准确地保管在这些代币中。它将作为一种避风港。


    无论如何，比特币存款是在这个交易所开始交易最快、最方便的方式。一旦你在交易所注册，你将只能使用非常有限的功能集，主要包括你可以存入和提取的金额。


    顺便说一句，你将接受验证程序。为了防止贩毒者、军火商和洗钱者利用交易所，需要进行验证。因此，那些希望进行大额交易的人被邀请接受验证流程。它看起来如下。


    为了保持所需的匿名级别，验证过程分为多个步骤。例如，四级验证将允许你每月提取约 40 万美元（如果你有四级验证）。然而，有一个缺点。由于交易所用户数量庞大，你的申请可能需要几周才能被审核。之后，还需要几周时间才能完成资金验证和存入。此外，不保证你的申请会被接受。


    在我看来，这种对话有点过于独裁。如果交易所所有者怀疑比特币在其平台上造成问题，他们只需冻结提款。当涉及到用其他加密货币出售和提取这笔现金时，持有者必须费尽周折。


    以下是迄今为止其他一些最流行的交易所。


    就交易量而言，Kraken 是一个拥有庞大客户群的重要欧洲加密货币交易所。在我看来，Kraken 是目前最快、最用户友好的平台。


    Bitfinex 是一家总部位于香港的知名加密货币交易所。它比其他交易所拥有更多工具，设计也比其他交易所更复杂。


    Bittrex 的不同之处在于它是一个被称为山寨币交易所的加密货币交易所。几乎所有新的加密货币或代币都可以在这里购买。你甚至可以交易市值较小的币种。它们的价格通常会被“拉升”，这意味着它们会飙升然后暴跌。如果你是交易者，这对你有利。在我看来，这个交易所是最安全的之一。


    ## 如何加入加密货币交易所


    由于目前有大量的加密货币交易所可供选择，每个人都有平等的机会挑选最适合其需求的交易所。考虑到这一点，我想解决一些人们对在比特币交易所注册的担忧。


    为了成功注册加密货币交易所，我强烈建议启用双因素认证（识别）。即使你已经注册了，我强烈建议你利用这一功能。


    我建议你在至少两个不同的交易所开设账户，这样如果其中一个出现问题，你将能够在另一个交易所平仓。如果你打算交易山寨币，请务必使用 Bittrex 作为你的首选平台。你必须自己选择另一个。

