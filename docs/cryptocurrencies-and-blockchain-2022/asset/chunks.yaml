- raw: 'The bare minimum in terms of cash on hand should always be 30% of your total
    account balance. It is never a good idea to hold only fiat money or only cryptocurrencies.
    Even if the value of your currency drops, you should still have some cryptocurrency
    holdings. According to the rule of thumb, when the market grows, you should hold
    fewer assets in Bitcoin and more assets in Ether and other altcoins. The greater
    the capitalisation of an asset, the less volatile the asset is expected to be.
    As a result, if you want to experience less volatility in the fall, consider keeping
    some of your money in Bitcoin. Even if it is only 10–20 percent of your total
    assets, you should not keep all of your funds in cash.If you already have Bitcoin,
    you can exchange it for altcoins, which are frequently traded in the same way
    as Bitcoin. At the same time, you should have at least 30% of your assets in cash,
    even if the market is experiencing explosive growth. You might require funds for
    a new and fascinating initial coin offering (ICO), a new movement involving some
    form of altcoin, or something similar.


    The cause for entering and exiting should be the same as one another. Every trader
    should be aware of when he or she will be exiting the deal. You should always
    have a plan B in case something goes wrong. All of your ideas should be clearly
    laid out on paper, and you should not be tempted to change your mind about them.


    Diversification of markets and assets is essential. It''s recommended that you
    trade on at least two of the most prominent exchanges. Do not take risks, even
    if a newly opened exchange entices you with low costs or offers you a reward for
    your participation.


    Avoid making a lot of deals and gambling.You must be aware of how frequently you
    access the terminal and check the quotes in this situation. I recommend that you
    look at cryptocurrency movements no more than once a day, at most.Choose a time
    of day when you are most comfortable completing this task. Let''s say that after
    a long day at work, you return home and settle down to watch the latest developments
    in the bitcoin market with a glass of red wine (or a cup of tea). You are not
    required to track the market every 10 minutes in a frantic manner. Such jittery
    conduct is not beneficial to either your health or your bank account in the long
    run.


    Have your own point of view and don''t be influenced by the mob. There isn''t
    a single individual on the face of the planet who can predict with certainty how
    much Bitcoin will cost tomorrow or make any other correct predictions. If you
    hear highly high-profile forecasts in favor of a certain coin, it is likely that
    this individual has a vested interest in the coin in some way.


    I''d like to remind you once more that there is no such thing as a 100% guarantee.
    I recommend that you maintain a healthy level of skepticism at all times. It is
    impossible to predict what will take place in the future.


    Keep this in mind, and you''ll be able to see right through the trick. If someone
    manages to persuade you of something, ask yourself why this man is so adamant
    about proving his case. Others'' opinions are worth listening to, but you should
    not make financial decisions based on their recommendations.


    Keep the halts in mind at all times. As previously stated, using stop orders in
    the bitcoin market makes no sense because they may not work or may perform in
    a suboptimal manner.


    As a result, always keep your halt (your exit point) in mind, or write it down
    in a notebook, wherever possible. For example, I purchased Ether for $250, and
    I intend to terminate the trade at a price of $200.


    Risks. After reading this book, I am confident that you have grasped the fact
    that the bitcoin market is extremely dangerous and that you understand why. However,
    you will not be able to generate such large gains anywhere else. You will not
    be able to double or triple a sum of money anywhere else in a day.


    In conclusion, I would like to point out once again that there are no assurances
    in the bitcoin market. If someone promises you something and then doesn''t follow
    through, this person is a liar. This is something to be prepared for, as such
    circumstances are rather regular in this industry. In the cryptocurrency market,
    the most cunning and bright-headed individuals (creators of initial coin offerings,
    experienced traders, and so on) compete against one another, each pursuing their
    own objectives.


    # CHAPTER 15. INVESTOR MINDSET AND USEFUL TIPS


    You''re probably aware that the psychological thinking that underpins any pursuit
    in which you wish to be successful is critical to success. Some people have had
    the correct mindset since they were children, while others must continue to struggle
    to develop it during their lifetime.


    In any case, I''d like to point out a few crucial factors that you may use to
    make a profit in the cryptocurrency market, or at the very least avoid suffering
    significant losses.


    Don''t be a glutton for punishment. Do not hold your breath waiting for the price
    to rise much further in order to make even more money. If you are overly greedy,
    you may end up not only missing out on rewards but also incurring a financial
    loss.


    Please be patient. In the event that you purchase a currency at a specific price
    and do not see any significant up or down movements, do not panic and sell it
    quickly. I''m aware of numerous instances in which the apparently consistent price
    of a cryptocurrency suddenly soared tenfold in a matter of days. You might wonder
    how to avoid incurring a loss when the stock market plummets. My recommendation
    is to refrain from exchanging all of your cryptocurrency for money! This is a
    mistake that many people make and subsequently come to regret. Be sure to keep
    an eye on topical forums and user reviews about this currency before you sell
    everything you own.


    Always keep the depth of the market in consideration. Purchasing some assets at
    a seemingly reasonable price when there are many sellers and few buyers is possible
    when there are many sellers and few buyers. However, you will not be able to sell
    everything you have purchased.


    Keep track of the trade volume and market capitalization of cryptocurrencies.
    You should perform this in order to determine whether or not there will be spikes.
    You can then develop your own trading strategy and trading plan based on your
    analysis of bitcoin price fluctuations and the discovery of certain regularities.
    In real-world situations, you can begin refining your strategy by starting with
    tiny sums that are permitted on practically all exchanges. It is possible that
    your method will be effective, and you will be able to progressively expand your
    investments.


    Finally, I''ll go over my quick and effective suggestions one more time. I hope
    they will be of use to you in your endeavors to become a successful bitcoin investor.


    Don''t change your tactics at every opportunity.


    Profits are yours to keep. Don''t lose sight of your original objectives. Don''t
    make this mistake.


    Decisions are made on the spur of the moment.


    Save time and money by automating as many processes as possible.


    # CONCLUSION


    I stated at the outset of this book that many people do not take cryptocurrencies
    seriously because of the numerous fallacies that surround the industry. I stand
    by that statement. Let''s take a look at these myths and refute them once and
    for all.


    First and foremost, a large number of people believe that the most essential and
    attractive feature of the cryptocurrency market is the potential for large earnings,
    and they enter the market solely because of this belief. Profit, on the other
    hand, is, in my opinion, a completely secondary consideration that may be achieved
    in any firm. Which begs the question, how much danger are you willing to take?
    As a result, risk is the most significant topic in cryptocurrencies.'
