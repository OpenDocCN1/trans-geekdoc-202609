- raw: 'It is important to remember that hashing takes any input, no matter how large
    or tiny, and converts it into a string of characters. If you make even the smallest
    adjustment to the input, the entire output is affected. It is possible to include
    the contents of the previous block in the new block by taking the hash of the
    entire previous block and adding it to the beginning of the following block. Essentially,
    this means that we''ve effectively linked the old block to the new block, and
    if anything changes in the older block, even the tiniest modification, the hash
    of the entire block will change as a result.


    Now, once a block has been completed, it is much more difficult to make changes
    to it. Making an edit to an older block would necessitate a re-hash of the entire
    block in order to make the edit. Once you''ve re-hash the entirety of block 1,
    you''ll need to crack open block 2, delete block 1''s old hash, enter block 1''s
    new hash, and then re-hash the entirety of block 2. However, because new blocks
    are being created all the time, in order to amend an older transaction, you''d
    have to edit every block that has been created since the transaction was made
    in the first place. The longer time passes, the more difficult it becomes to hack
    into a network and successfully change the outcome of a transaction. This is why
    hashing is essential to the security of the blockchain. Because of the encryption,
    it is difficult to make changes to the transaction ledger, allowing the ledger
    to be both public and secure at the same time.


    On the other hand, the hashing itself is not particularly complex. Most computers
    are capable of re-hashing a blockchain in a matter of seconds. We must therefore
    increase the complexity of creating new blocks in order to ensure that the hashing
    security executes its job properly and effectively. In an ideal world, it would
    be something that slows an attacker''s progress and increases the likelihood that
    honest members of the network will prevail. This additional difficulty is referred
    to as "proof of work" in the Bitcoin Blockchain (as well as most other current
    blockchains).


    I won''t go into great detail on proof of work here; however, a basic explanation
    of proof of work is given in chapter 3 of this book, and you can learn more about
    the technology in my book "Blockchain Technology Explained" (available on Amazon).


    # CHAPTER 5. WALLETS OR HOW TO SECURELY STORE BITCOIN


    When dealing with cryptocurrencies, people utilize a wallet as a safe depository
    as well as a payment instrument for both incoming and outgoing payments, respectively.
    Let''s take a look at the different sorts of wallets that are available and choose
    which one is most appropriate for your computer''s resources and tasks.


    There are two types of wallets: hot and cold. Warm wallets are available as well,
    but they are used considerably less frequently. When it comes to storing money,
    cold wallets are employed, but hot wallets are used for sending and receiving
    currency swiftly.


    A wallet typically contains two keys: a private key and a public key. Because
    the private key is only available to you, you should never share it with anyone
    else. It is essential that you keep this in mind when signing all transactions
    with this key. Meanwhile, someone may use your public keys to move money into
    your account, for example to purchase a new Ferrari car for you.


    ..If this is the case, you should provide this individual with your public key.
    This key may even be made public through social media platforms. There is nothing
    to be concerned about in this situation.


    Wallets will be considered in order of preference, with Bitcoin Core being the
    first to be considered. It is the first Bitcoin wallet created by the famed Bitcoin
    developer, Satoshi Nakamoto, and it is available for download. In addition to
    being the only officially supported wallet, it is also the only wallet that is
    constantly updated by the professional Bitcoin community and maintains the whole
    Bitcoin database on your computer, allowing you to automatically support the network.
    Bitcoin ore is a cryptocurrency that is both very safe and user-friendly. However,
    I do not recommend that you download and install this wallet on your PC. Because
    the initial synchronization takes a very lengthy time, and the size of a completely
    synchronized wallet can exceed 100 GB, this is a huge disadvantage.


    In my opinion, the best wallet for users is the Blockchain, particularly for those
    who are lazy. It does not necessitate the installation of any third-party software
    on the PC in question. It enables you to build a Bitcoin wallet in seconds and
    start using it right away. Using this wallet, you can be certain of a high level
    of security for your bitcoin. It also has an exceptional reputation and provides
    24/7 assistance. Even for complete beginners, the interface is straightforward
    and easy. The sole conceivable disadvantage is that your Bitcoin wallet is located
    on a third-party site rather than on your computer. This is a minor inconvenience.


    MyEtherWallet is another excellent cryptocurrency wallet. It is the most widely
    used wallet for participation in initial coin offerings (ICOs) (Initial Coin Offering).
    We''ll go over initial coin offerings (ICOs) later in the book, but for now, it''s
    crucial to note that they''re quite similar to initial public offerings (IPOs).


    In practice, it is straightforward: we select the address of the person to whom
    we wish to send money, enter the amount to be transferred, and complete the transfer.
    This wallet is referred to as "warm" because it contains a file that must be downloaded
    to your computer before you can log into it.


    We have just looked at a few different types of wallets for Bitcoin and Ethereum,
    but there are a plethora of options available for other cryptocurrencies as well.


    I''d like to point out that you can use multiple wallets at the same time for
    different purposes, such as holding money, performing transactions, or using them
    only once.


    For example, the MyEtherWallet wallet allows you to store Ethereum as well as
    any ICO tokens associated with it. When working with Ethereum, I also advocate
    using the Mist wallet. However, it takes a long time to download to a computer
    because of the large file size. There are also multi-currency wallets, such as
    Metamask and Jaxx, that support a number of different cryptocurrencies.


    ## COLD STORAGE AND BITCOIN DEBIT CARDS


    Taking the assumption that you are interested in learning how to properly store
    cryptocurrency, I will go into greater detail on the topic of cold storage.


    Cold storage is a term that refers to private keys that are often generated and
    stored in a safe, isolated environment to prevent unauthorized access. This means
    that your funds will not be held on any particular website. This wallet has the
    appearance of a USB flash drive, which allows you to connect it to a computer
    and complete a transaction quickly.


    Trezor, KeepKey, and Ledger are the cold storage wallets that are most widely
    used.


    If you need to store a large quantity of money in cryptocurrencies, this is a
    fairly popular way. Transactions are rarely carried out, and security is one of
    the most important considerations. As a result, if you intend to keep your cash
    for an extended period of time, cold storage is the ideal option for you.'
