    When you have selected an initial coin offering (ICO) and decided to invest in
    it, you need to closely watch the information that the firm releases on a regular
    basis. This can be accomplished by participating in their discussion and following
    the project on Twitter. Look through their Twitter archive. They have a lot of
    information. Remember that you provided them with your money, so do not be intimidated
    by the job or the time commitments involved.


    Sites such as smithandcrown.com, icoalert.com, and icotracker.net let you keep
    track of initial coin offerings.


    Now I''ll give you some pointers on how to make informed decisions when it comes
    to investing in initial coin offerings (ICOs).


    I urge that you purchase initial coin offerings (ICOs) prior to bankruptcy and
    hold onto them in case one of them takes off. To be completely honest, I have
    a separate list of all the ICOs that are dropping, and I keep track of each of
    them on a daily basis. I am willing to purchase them for a small sum of money
    in order to dispose of them. For example, ten percent of the asking price could
    be offered. This being the case, I will gladly make a purchase, for example, for
    $1,000, and so my risk will remain at the same $1,000 level.


    The second piece of advice is that many people believe that if the price begins
    to decline, it is a sign of insolvency, and that you should flee immediately.
    If the price rises, you will be compelled to purchase.In reality, everything operates
    in the opposite direction. The best time to detect strong and weak coins and tokens
    is when the market is falling. Keep track of whether the volume of the coin increases
    when the value of the coin lowers. Increasing it is a positive development. If
    the price of a coin lowers while the amount of transactions does not grow, it
    indicates that there is no demand for these coins, and a seller is forced to lower
    the price on a consistent basis.


    Furthermore, keep in mind that 99 percent of all initial coin offerings (ICOs)
    are currently scams.You may, however, choose to engage in these ICOs as well.
    Yes, you read that correctly. It''s possible that you''re doing it to make money
    off of greedy and uninformed people. The fact that ICO is a legal pyramid scheme,
    and your purpose is to enter and exit it as quickly as possible, serves to further
    demonstrate this point in some ways.


    ## HOW TO PARTICIPATE IN ICO


    Assume you''ve discovered a promising initial coin offering. To take part in it,
    you must first go to the organization''s website. To obtain EOS, navigate to the
    Tokens page and select "Get EOS."


    After that, make sure to check the box that states that you understand and agree
    with the project''s terms. If you read between the lines, you agree to the possibility
    of losing your capital. Following your selection of "Continue," you will be sent
    to a page that describes how the project will generate funds for its completion.


    All of the figures, particularly the ones pertaining to capitalization, should
    be carefully reviewed, in my opinion. If the ICO''s total capitalization is less
    than $500 million, that is OK.


    However, if you multiply the value of a token by the total number of tokens that
    have been identified in advance and get a capitalization of $5 billion, this should
    cause you to pause for consideration.


    You can also compare the capitalization of the ICO you''re interested in with
    the capitalization of a previous ICO if you have one. When comparing token values,
    keep in mind that the capitalization of the entire firm is more important than
    the value of a single token.


    Pay close attention to the Schedule section to find out how long the ICO will
    run for.


    The ICO tokens you purchased will appear on the hitbtc.com exchange in a very
    short period of time. You may also find tokens provided via initial coin offerings
    (ICOs) in this section.


    Even in the event that you are unable to determine how to participate in the ICO,
    the websites of any ICO will always provide thorough instructions (sometimes even
    a video). There is also instructions on how to make a money transfer in order
    to participate in the Initial Coin Offering (ICO). However, keep in mind that
    this money can only be sent from your wallet, not from the exchange itself.


    So that''s how initial coin offerings (ICOs) work, and that''s how I recommend
    you buy them. Whatever you do, keep this in mind: don''t stay in one ICO for an
    extended period of time. As soon as you are able to make a tiny profit, you should
    sell it.


    # CHAPTER 12. TRADING


    As part of this course, you will learn about placing orders on the stock market,
    as well as about different types of trading and how to evaluate chart patterns.


    ## PLACING ORDERS ON THE EXCHANGE


    Exchange orders are used to open and close positions on the exchange when trading
    on the market. There are two types of orders: market and pending, which differ
    in how they are executed. Pending orders, on the other hand, can be limit orders,
    stop orders, or stop limit orders with a stop limit order.


    Any asset can be purchased or sold using any of the many types of orders.


    I recommend that you exclusively use limit orders, but we''ll get into that in
    more depth later in the article.


    Consider the following example of an order placed on the Kraken exchange: While
    the appearance of an order may differ on different stock exchanges, the core of
    the order stays the same.


    Placing a market order on the stock exchange is the quickest and most convenient
    way to buy or sell something. If there is a reverse limit order for this order,
    it is executed at the current market price immediately after it is placed on the
    exchange. Otherwise, it is not executed. If you want to execute a market purchase
    order, you''ll need to place a sell limit order first, for example. In order to
    execute a market sell order, a purchase limit order must first be executed.


    In order to execute a market order, the best limit order from among all of the
    available limit orders is selected. The market purchase order is therefore executed
    at the ask price, whilst the market sell order is filled at the bid price, as
    a result.


    When dealing with this type of order, you do not need to mention the price; instead,
    you only need to specify the volume, which is how much you want to purchase. However,
    there is a significant difficulty that you may encounter — slippage. What exactly
    is it? It is the difference between the price at which a trade is expected to
    be done and the price at which the trade is actually completed. In periods of
    heightened volatility, slippage may occur when market orders are employed; also,
    when there are big orders, there may not be enough interest at the intended price,
    resulting in slippage.


    level necessary to keep the projected price of trade stable. It is for this reason
    that I do not encourage the use of market orders in any situation.


    For the time being, let us review the terms bid, ask, and spread, which were previously
    discussed in more detail in this section. A bid is the price that a cryptocurrency
    buyer is willing to pay for the cryptocurrency. The price a seller is willing
    to take is referred to as the "ask." The difference between these two prices is
    referred to as the spread.'
