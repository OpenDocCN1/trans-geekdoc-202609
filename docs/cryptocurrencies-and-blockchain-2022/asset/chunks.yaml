- raw: 'The difficulty of a block is modified every 2016 blocks and is determined
    by the number of zeros that appear at the beginning of a given hash. While it
    is not difficult to obtain the hash itself, finding a successful hash that contains
    a specific number of zeros might be time-consuming. With the hash of a prior block
    in hand and the timestamp and transaction data of the previous block, it appears
    that it is fairly simple to generate a new hash from this and process this block.
    You must, however, discover a nonce whose value is set in such a way that the
    hash of the block has a sequence of leading zeros before you can proceed. That
    will take a significant amount of time. Whenever a successful hash is discovered
    by miners, they add a new block to the blockchain. In other words, they have already
    confirmed all transactions after putting in considerable time and effort. As a
    result, there is no purpose in fooling someone because such work is extremely
    tough to complete.


    Afterwards, all of the information is dispersed throughout the nodes. First, a
    miner transmits one node to the network. A check can be done to see if, for example,
    those who sent money from point A to point B actually had that money in their
    possession and if all of the transactions were legitimate. The nodes then begin
    to trade this information with one another, and the block is generated as a result
    of this exchange.


    In principle, it is possible for two miners to create an identical block of data
    at the same time. What criteria will the blockchain use to determine which block
    is the best? The first and most important premise is that of speed. The "success"
    of a hash is the second principle to consider. As a result, the "success" of a
    hash is precisely the amount of effort that the miners should put forth under
    the Proof of Work protocol.


    Another reason for selecting a "successful" hash is that it allows you to vary
    the difficulty of the network connection. The greater the number of miners on
    the network, the greater the increase in network difficulty, which means that
    transactions may be processed more quickly. The difficulty decreases if the miners
    take longer to find the blocks and so slow down their progress.


    Add a few additional sentences explaining how to deal with the issue when several
    miners create similar blocks on the network to round out this section. The essence
    of the blockchain consensus is that the chain of blocks with the longest length
    is deemed to be the most fair. The first time that the blocks begin to be built
    in a direction that is different from yours, your first block will be added to
    the list of unconfirmed transactions once more. When the network gets overcrowded,
    this is a common occurrence. So, in order to ensure that the next blocks are placed
    exactly under your block and that you receive the reward, you should wait until
    several more blocks have been built after yours. If you are able to form more
    than five blocks, you will undoubtedly win the money.


    We reviewed the advantages of Bitcoin at the conclusion of the previous subsection;
    now it''s time to explore the disadvantages of blockchain, specifically the 51
    percent attack, or double-spending problem. I''ll explain further.


    The combined efforts of any mining pool can increase the likelihood of the next
    block being created by 51%.Once upon a time, the cryptocurrency community experienced
    a circumstance in which the members of a Chinese mining pool artificially prohibited
    new members from joining their system and managed to generate around six blocks
    in a succession. As a result of this occurrence, the public became aware that
    you must wait for the confirmation of a transaction for one hour rather than ten
    minutes. To put it another way, if you build five blocks, and each of them is
    produced for 10 minutes, you increase the total time by five and get fifty minutes.


    We''ve covered everything there is to know about mining in this book, but if mining
    is something that really interests you (and you want to learn how to get started),
    be sure to get this unique extra book, Cryptocurrency Mining.


    # CHAPTER 4. BLOCKCHAIN


    Before we go into the technical intricacies of Blockchain technology, it''s vital
    to understand the problems that Blockchain technology seeks to answer and the
    problems that Blockchain does not. So, why do we need Blockchain technology, and
    what does it accomplish that our current technology cannot?


    When Bitcoin and Blockchain technology were first introduced, the early adopters
    saw what they believed to be a fundamental problem in the way we now think about
    transactions, trust, and social organizations. In the United States, the early
    versions of Blockchain were developed at the same time as the 2007 financial crisis,
    during which many individuals lost faith in the institutions of society that were
    supposed to look out for the interests of ordinary people. People were, without
    a doubt, disillusioned with the banking system in the aftermath of the crisis,
    but they also lost confidence in the government''s ability to control financial
    markets and in the media''s ability to probe future catastrophes.


    It is generally agreed that our institutions have weaknesses and are not ideal
    solutions in every situation. They do, however, provide solutions to trust issues,
    and they have been doing so for hundreds of years. In fact, we are most likely
    living in the most tranquil and comfortable period of human history at this time.
    Any alternative to our current institutions must have distinct benefits and advantages
    over them.


    The concept behind blockchain is to replace institutions operated by fallible
    human beings with technology that is both more efficient and more empowering for
    individuals to execute their jobs better. Creating a system that allows strangers
    to trust one another without the need for a bank or a government as an intermediary
    would help to alleviate one of society''s most intractable stumbling blocks. You''d
    need a powerful method for reaching consensus between strangers in order to do
    so, and the Blockchain''s developers think that power lies in decentralization
    rather than in centralized systems.


    Almost all applications of blockchain (and other cryptographic technologies) are
    built around the concept of decentralization, which is fundamental to the technology.
    Instead of a strict, slow central authority making decisions and controlling interactions,
    Blockchain attempts to devolve regulatory power back to the individuals who are
    affected by those decisions and ties. Instead of placing faith in a major entity,
    the blockchain fosters confidence among participants through agreement.


    ## HOW DOES THE BLOCKCHAIN WORK?


    A public ledger and encryption are used together to establish trust between parties
    while also safeguarding their anonymity, which is the most basic definition of
    blockchain. Getting our heads around the technicalities of how this works is a
    little more difficult, but we''ll need to do so in order to truly appreciate the
    brilliance that lies at the heart of Blockchain technology.


    While Blockchain technology can encompass a wide range of features, the principles
    of the technology are encapsulated in the name of the technology: Blockchain.


    The block: A block is a collection of transactions that occurred during a specific
    period of time. It comprises all of the information that has been processed across
    the network in the last several minutes. At any given time, the network can only
    construct one block.


    The chain is comprised of individual blocks that are linked to one another using
    cryptographic techniques. Despite the fact that these algorithms are challenging
    for computers to calculate, they frequently take several minutes to solve, even
    on the fastest computers on the planet. Once the problem is solved, the cryptographic
    chain secures the block in place, making it difficult to modify. More on this
    in a moment, but for now, let''s just take a quick look at it.'
