    # ICOS (首次代币发行)


    ICOS 是一个首字母缩略词，代表 International Cooperation on Science and Technology (INITIAL
    COIN OFFERING)。


    迄今为止，大量人参与了所谓的首次代币发行（ICOs）（Initial Coin Offering）。从本质上讲，这是众筹范式的另一种诠释，类似于首次公开募股（IPO）。参与者为项目的创建做出贡献，以换取未来的优势，但无法保证该计划会成功。在加密货币世界中，首次代币发行（ICO）指特定项目发行优惠券或代币，未来将用于使用加密货币支付网站服务。


    在许多方面，首次代币发行（ICO）类似于风险基金，后者是专注于与创意公司和想法（初创企业）合作的投资基金。风险基金是一种投资基金，它投资于高风险或极高风险企业的证券或股份，期望获得巨额收益。一般来说，70%–80%
    的此类项目无法产生投资回报。然而，剩余 20%–30% 项目的利润足以弥补所有之前的损失。


    如果你认为自己有勇气资助一个不提供任何确定性的项目，请问自己：

    *   我是否准备好在这个项目中承担更多风险？

    *   我是否有可用于分散投资的资金垫？


    你通过首次代币发行（ICO）承担巨大风险，以期获得巨大收益来赚钱。


    # 加密货币转售


    加密货币市场的转售与交易世界有着惊人的相似之处。在这里你也可以通过货币变动赚钱，但与交易不同，这更多的是关于批发价和零售价之间的博弈，而不是市场价或交易所价格。


    如果你对这种盈利方法感兴趣，你应该：

    *   避免冒险。

    *   只处理少量资金。

    *   认识到你的收入与你的周转额成正比。


    此时，我们对比特币市场赚钱基本方法的了解还相当有限。现在，让我们更仔细地看看每种策略。


    # 进行长期投资：更深入的探讨


    你可能记得沃伦·巴菲特的第一条原则：他从不亏钱。这在长期投资中尤为真实，最重要的是保住钱，而不是冒失去它的风险。


    首先，让我们回顾一下长期投资的基本概念：

    *   不要让你的钱白白浪费；降低你的风险。不要大惊小怪。

    *   从未来的努力中获益。

    *   为了对加密货币进行长期投资，你的加密货币投资组合应该如下所示。


    蓝色用于表示性质更温和、更稳定的仓位，但回报可能较低。绿色背景的仓位风险更大，但也更有前景。蓝色币种是目前较稳定的货币。


    ## 蓝色标记的意义


    这种货币上的蓝色标记有什么意义？我们这样做是因为这种货币的价值极有可能会上涨。比特币占据该类别的首位，因为它仍被广泛视为最可靠的货币。此外，其价值在未来只会上涨。是什么让我有如此强烈的确定感？答案如下：

    *   比特币目前是整个加密货币市场中唯一用于交易的加密货币。

    *   这种货币在全世界广受认可。

    *   项目和整个系统将快速发展。


    此外，美元被标记为蓝色，以强调在投资组合中拥有“快钱”的重要性，这让你能在必要时快速操作并兑换加密货币。


    ## 投资组合中的绿色币种


    让我们看看目前投资组合中的绿色币种。如果之前的货币可以被认为几乎是坚不可摧的稳定，那么绿色币种的情况则可以被认为是不断变化的。在撰写本书时，绿名单上的货币似乎是高风险投资。但请记住，在你读完这篇文章的第二天，一切都可能改变。


    ## 影响投资组合构建的因素


    在我看来，投资组合的构建取决于个人的年龄。这是奇怪的现象吗？毫不奇怪！你越年轻，你的投资组合可能越激进。年轻时，我们不介意在薄冰上滑冰（冒险）。然而，随着年龄增长，我们变得不愿冒险。


    除了年龄，还有什么会影响你的投资组合？你银行账户里的钱数。当你有大量资源可投资时，冷静地冒一小笔钱的风险很简单。然而，你的财务资源越雄厚，你的计划就应该越稳健。


    你的财务垫款金额是影响投资组合创建的最后一个方面。如果金额很小，最好将风险降到最低。


    ## 投资格言与移动平均线


    为了保持正确的视角，我想提醒你另一条经典的投资格言：低买高卖。这可能听起来老生常谈，但它是真理。当币值下跌时，往往是投资的绝佳时机。然而，就在这一刻，我们开始贪婪，认为币价可能会跌得更低。


    “移动平均”方法用于解决这个特定问题。它可以是简单的，也可以是指数型的。


    ### 简单移动平均线的图解


    请看下面基本移动平均线的图解：

    例如，你可能对一种价值 100 美元的币种非常感兴趣。你决定在一个喝咖啡的早晨买入 14 枚这种币。结果，你花费了 1,400 美元。在接下来的几周里，该币种的价值将接近每枚
    105 美元。你以 105 美元卖出这 14 枚币，收回 1,470 美元。到目前为止，你赚了 70 美元。


    但如果你决定分期购买这 14 枚币，每周买 1 枚，而不是一次性买完呢？图表看起来似乎保持不变。例如，在一种情况下，平均币价是 100 美元，而在另一种情况下，平均币价是
    91 美元，依此类推。结果，在第二种情况下，你花费 1,274 美元买入 14 枚币，每枚以与前图相同的价格卖出。你的利润是 196 美元。是什么导致了这种情况？一切都一样，只是我们采取了不同的方法。


    当你使用基本移动平均技术时，你不必担心总是寻找最佳入场时机，也不必担心汇率可能进一步下跌。每个月，你只需购买预定数量的币。无论市场下跌还是上涨，你都继续购买。实际上，这种方法相当老套，但对长期投资极其有效。


    简单移动平均策略之所以有利，是因为它们降低了平均买入价，让你用相同的钱买到更多份额，减少下跌时的损失，并让你在上涨时更快收复损失。


    ### 指数移动平均线


    现在，我建议你考虑指数移动平均线方法。使用指数移动平均线方法，你可以看到收益的提升。一切按此方式运作：当价格保持不变或上涨时，你按惯例买入；当汇率下跌时，你追加买入。

