    In every state, the central bank has an emission monopoly, which is granted through
    legislation, posing a significant obstacle to the legality of cryptocurrencies
    in that particular jurisdiction.


    ## Fiat Money Definition


    Fiat money is a word used by the cryptocurrency community to refer to traditional
    banknotes and coins.

