- raw: 'The initial coin offering (ICO) market provides you with yet another opportunity
    to become a part of these new cyber success stories. Some initial coin offerings
    (ICOs) have the potential to grow rapidly over time and to more than return their
    original investors. Nevertheless, some analysts believe that the majority of initiatives
    in 2017 will turn out to be frauds. It makes sense since, as a result of the virtual
    economy, it is now easier to make investments. People are willing to put their
    money into any firm that has a more or less respectable presentation and do it
    almost sight unseen. A careless approach like this plays right into the hands
    of con artists.


    # CHAPTER 11. ICOS


    We''ll go through the fundamentals of ICOs (Initial Coin Offerings), how they
    differ from initial public offerings (IPOs), how to tell the difference between
    a legitimate ICO and a scam, and how to participate in an ICO.


    ## ICOS VS. IPOS


    All stock investors are aware of the abbreviation IPO (Initial Public Offering),
    which refers to the first time a company''s stock is made available to the public.
    The purchasers of stocks become co-owners of the corporation, and the corporation
    itself receives money from sales, which is typically greater than its annual return.
    ICO, or Initial Coin Offering, is a new abbreviation that has just appeared in
    the cryptocurrency industry that is similar to the previous one:


    An initial public offering (IPO) is a valid (from a legal standpoint) activity.
    An initial public offering (IPO) is the process by which a company with an established
    and maturing corporate structure seeks to raise capital. The simplest and most
    cost-effective method of raising funds is through the sale of stock. At the same
    time, the process of launching an initial public offering (IPO) is extremely expensive.
    In order for a firm to be admitted to the exchange, it must meet a number of standards,
    including meeting the required capitalization level and passing an audit. In addition,
    the corporation should seek out underwriters who will be responsible for selling
    the company''s stock. Once the word has gotten out, money and investors will be
    attracted, and the company will begin trading its stock on the stock exchange.
    It will be a long road ahead. As a result, it is a time-consuming and expensive
    process.


    Aside from that, a deficit is purposefully established within the scope of an
    IPO, and only a limited number of the company''s shares are offered for sale on
    the stock exchange.


    The developers of ICO campaigns also state that the quantity of coins available
    is limited, and as a result, many people panic, believing that if they do not
    purchase these coins now, they will be forced to purchase this currency later
    at a higher price.


    Both initial public offerings (IPOs) and initial coin offerings (ICOs) are riskier
    ways to generate money, but they may also be extremely successful. People join
    in initial coin offerings (ICOs) in the hopes of making quick cash. And as soon
    as these individuals receive their money back, they promptly withdraw it from
    their accounts.


    As a result, when people begin to sell their coins, the price of the coins rises
    dramatically at first, before falling rapidly. Speculators employ a variety of
    strategies, one of which is this.


    In contrast to initial coin offerings (ICOs), such speculations are relatively
    infrequent in initial public offerings (IPOs) due to the so-called "lock-up period."
    People who purchased shares prior to the initial public offering (IPO) will not
    be able to sell them until three months after the IPO. With initial coin offerings,
    you can purchase coins even at the pre-ICO stage.


    Let us list the reasons why so many individuals are willing to bear the risk of
    investing in initial coin offerings (ICOs). While some individuals spend money
    on these ventures just to show their support, other people will buy and sell them
    rapidly. A third group of people invests money in these projects because they
    have heard about them somewhere or, even worse, because they want to replicate
    the success of their friends.


    ## HOW TO DISTINGUISH BETWEEN PROMISING ICOS AND PYRAMID SCHEMES


    All of the companies that have launched initial coin offerings (ICOs) are startups
    that do not even have a so-called Minimum Viable Product (MVP). They simply have
    a vague notion. In fact, the majority of these businesses are rapidly resembling
    pyramid scams in that you are guaranteed that if you put money at the first level,
    your investments will be doubled at the second stage and will rise fourfold at
    the third level. In other words, investors are offered a game-like experience
    in order to give them the notion that they will be able to get rich soon.


    Let''s have a look at how an initial coin offering is carried out.


    Prior to launching their official crowdsale or initial coin offering campaign,
    the companies hold a pre-ICO, which is a token sale event. This event is often
    performed to gather funds for marketing purposes, namely to pay for a public relations
    campaign during the initial coin offering (ICO). It sounds something like this:
    "We raise money for advertising in order to prepare an even stronger campaign
    later on and collect money again."


    In addition, certain initial coin offerings (ICOs) will no longer proclaim that
    a specific number (or greater number) of funds is required for the actual project
    implementation, allowing the market to gather the largest feasible quantity. This
    is how some people manage to establish a firm with a market capitalization in
    the billions of dollars.


    The IOTA cryptocurrency is a shining example. It is a highly scalable currency
    that can handle a large number of transactions. IOTA is currently worth about
    $2 billion, according to market estimates. There is, however, one snag. The organization
    makes no guarantees and holds no assets (except for the site, of course). That
    is to say, the design of the company''s website is valued at about $2 billion
    by the general public. Isn''t it clear that this is a bad investment?


    Using the IOTA currency chart as an example, you can see how all of the most recent
    initial coin offerings (ICOs) have looked thus far.


    I admit that some initial coin offerings (ICOs) see significant increases in real
    value, and individuals who are able to participate in them can make a significant
    profit. However, all such initial coin offerings (ICOs) suffer the same fate,
    which might be compared to an elevator that cannot go higher when it is completely
    packed. Because of this, there is a tremendous amount of speculative money in
    such initial coin offerings; every price increase causes these investors to sell
    everything, close their positions, and therefore impose pressure on the stock
    market.


    Having said all of this, I do not aim to lead you to assume that all initial coin
    offering (ICO) projects are fraudulent. In fact, I simply want to demonstrate
    to you that the majority of these startups are vastly overestimated, with barely
    2 percent to 3 percent of them surviving to maturity.


    To make money from initial coin offerings (ICOs), you must first and foremost
    understand why you are investing in them. As a result, the reason for your transaction
    entry should be the same as the reason for your transaction exit. If you invest
    in an ICO just because you believe in the potential of a future product, you are
    most likely not making the best choice. First and foremost, allow the company
    to access the market and begin trading. If you still believe in the company''s
    product, you can always purchase it at a later date, perhaps even at a discount.


    ## HOW TO IDENTIFY GOOD ICOS


    The following are the hallmarks of a successful initial coin offering:


    1\. Chief executives and developers are well-known public individuals who have
    maintained a high level of activity on their social media accounts for an extended
    length of time.


    2.A clear knowledge of the duties and objectives of the project'
