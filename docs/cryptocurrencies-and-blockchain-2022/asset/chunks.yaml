    # 加密货币挖矿


    ## 交易确认与网络保护


    需要对交易进行确认。防止误导性信息（虚假交易和区块）引入网络，以及保护网络免受各种不同形式的攻击至关重要。维护网络的去中心化至关重要。


    因此，网络中挖矿设备的数量越多，网络抵御攻击的能力就越强。同时，关闭网络的一部分算力不会导致系统中交易停止。只要至少有一个矿工在积极挖矿，网络就会继续运行。


    ## 挖矿设备：ASIC 对比 GPU


    在挖矿行业中，有许多不同种类的矿场。其中一种选择是建立家庭矿场。


    目前挖矿使用专用的 ASIC（专用集成电路）或 GPU（图形处理单元）芯片。ASIC 代表专用集成电路。它是一个被编程用于提取加密货币的“无灵魂机器人”。关于
    GPU 挖矿，典型的矿场由同品牌的众多显卡、强劲的电源、带有多个 PCI-Express 插槽的主板以及配备散热系统的处理器组成。币种基于各自特定的算法运行。在选择显卡时应考虑这些算法。


    ### ASIC 挖矿


    ASIC 易于维护和安装，价格也相对便宜。然而，它仅设计用于挖掘特定的一组币种，您无法在它们之间切换。如果您选择支付电费，您需要挖矿收益足以覆盖电子设备的成本。


    ### GPU 挖矿


    就 GPU 挖矿而言，与 ASIC 挖矿不同，如果您决定在某个时候停止挖矿，您将能够快速且有利地出售您的显卡。


    ### 建议


    就我个人而言，挖矿需要同时使用 ASIC 和 GPU。如果其中一台设备发生故障，您可以依靠另一台。


    ## 云挖矿


    对于那些不想亲自动手建造“印钞机”的人来说，还有另一种选择。您可以通过利用共享算力，从世界任何地方进行挖矿。这被称为云挖矿。然而，云挖矿伴随着许多风险。首先，回本周期具有欺骗性地短。其次，您无法控制您的支出或利润。更重要的是，没有任何设备属于您自己的财产。


    在决定是否将挖矿外包给他人时，请记住以下几点：不应被提供不切实际的利润预测，且应提供联系技术支持的选项。为了解这些公司，我建议您阅读评价并关注挖矿论坛。我还建议您在投入大笔资金之前，先投入少量资金进行测试。


    ## 安全原则


    在挖矿中，就像在交易中一样，有必要遵守特定的安全规定。所谓“挖矿俱乐部”的第一条规则是，您绝不能向任何人透露您矿场的位置。这是一条小道消息？您可能会这么认为。请记住，只有您才会被允许进入存放您挖矿设备的矿场设施。


    以下是更多安全原则：


    *   在现场安装监控指标（温度、湿度等）的系统，以及视频监控和灭火系统，以确保每个人的安全。

    *   检查电气、供电和接地系统。

    *   监控建筑物内的温度和湿度水平。不要在耗材上吝啬，因为这样做可能会导致令人失望的后果。

    *   挖矿并不适合所有人，主要是因为它需要与设备供应商谈判、自行采购和配置设备，然后维护并确保设备安全的能力。


    ## 延伸阅读


    事实上，挖矿的话题相当复杂，如果您愿意，我可以更详细地介绍。例如提供关于电源、主板和散热系统的信息；建议如何选择操作系统；推荐哪些显卡值得购买；建议如何与供应商谈判；甚至揭示回本的秘诀。所有这些问题的答案都可以在一本名为《加密货币挖矿》的免费赠书中找到，可立即下载。


    # ICO（首次代币发行）


    ## 概述


    ICO（首次代币发行）是代币在区块链上首次公开销售。它是一种特定的众筹模式。首次代币发行（ICO）的参与者为项目的发展做出贡献，以换取未来的利益。首次代币发行（ICO）常被比作首次公开募股（IPO）。然而，与首次公开募股（IPO）不同，首次代币发行（ICO）的参与者通常不会获得公司的股份，也无法影响内部管理决策。


    ## 历史与著名案例


    据认为 Mastercoin 于 2013 年 6 月举办了首次首次代币发行（ICO）。Bitcointalk 论坛在其网站上宣布了该项目众筹活动的开始。结果，Mastercoin
    ICO 在其首次代币发行期间筹集了超过 5,000 枚比特币。


    然而，2014 年举行的以太坊首次代币发行（ICO）可能是最强大的 ICO 之一。当时代币以每枚 0.30 美元的价格拍卖。在两年内，其在交易所的价值上涨至
    12-13 美元，到 2017 年 6 月已价值 390 美元。


    ## 风险与诈骗


    如今有大量的首次代币发行（ICO）可供选择。似乎每天都有新项目宣布，每个项目都前景看好并寻找投资者。此类项目开发得越多，它们中任何一个成功的可能性就越低。大量首次代币发行（ICO）的创建仅仅是为了欺骗投资者。随着越来越多的人对通过首次代币发行（ICO）快速赚钱感兴趣，此类企业的数量只会增加。


    ## 赏金计划


    这些公司的开发者甚至发现了一种方法，来获得那些没有经济能力投资首次代币发行（ICO）的人的支持。是他们激发了赏金计划的创建。这是一个无需投入自己的资金即可获得一部分项目代币的机会。所需的只是让项目更广为人知。


    如果您做以下任何一项，可能有资格获得赏金：


    *   推广项目（通过社交媒体、电子邮件数据库和 Bitcointalk 论坛上的活动），以便潜在投资者了解其存在。

    *   将有关 ICO 的信息翻译成不同语言。寻找项目设计中的缺陷。

    *   创建徽标、宣传册和其他信息材料（有时以竞赛为基础）。

    *   为智能手机和其他移动设备创建移动应用程序、钱包和其他软件插件。

    *   如果您具备执行上述列表中至少一项任务的必要能力，您就有很好的机会获得赏金。


    '
