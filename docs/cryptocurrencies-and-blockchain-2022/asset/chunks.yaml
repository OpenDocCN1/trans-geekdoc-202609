- raw: 'Many people regarded mining, the process of creating cryptocurrency or Bitcoins,
    as a kind of recreational activity a couple of years ago. Many people participated
    in that game until the infamous pizza incident occurred. To many in the Bitcoin
    world, the day is referred to as "Pizza Day." On May 22, 2010, a developer made
    a payment of 10,000 bitcoins to a fellow Bitcoin forum user in exchange for two
    pizzas. At the time, Bitcoin was virtually completely useless. The cost of these
    two pizzas was around $25 for the user. At the time of writing (October 2017),
    one Bitcoin was worth more than $5,000. It''s not difficult to figure out that
    just two pizzas cost that guy a million dollars or more.


    When Bitcoin''s value began to skyrocket, it was the first time that it was mined
    on a large scale. First and foremost, computational power was utilized in the
    Bitcoin mining process. Later on, miners began to employ graphics cards to form
    the blocks, which became increasingly popular. They now make use of specialized
    equipment known as ASIC. China is currently home to the world''s largest such
    operations.


    ## HOW THE MINING PROCESS WORKS


    Cryptocurrency or bitcoin mining is the process of creating new cryptocurrency
    or bitcoins. Let us figure out how the mining process works. Whenever you do a
    transaction, such as sending money from your wallet to another person''s wallet,
    your transactions are placed in the "mempool." Known as the Bitcoin mempool, it
    is a collection of all transactions that are awaiting confirmation from the network.
    Miners, motivated by their own set of standards, collect transactions in specified
    blocks and then attempt to incorporate them into the blockchain.


    Every ten minutes, a new block is generated on the blockchain, and so on.


    A miner receives a reward after successfully mining a block. At the time of writing,
    the reward is 12 bitcoins. That is, if you successfully introduce a well-formed
    block into the system, you will be rewarded in this manner. Aside from that, Satoshi
    Nakamoto is credited with creating the very first block (Genesis). Anyone may
    come across it and sell it for 50 bitcoins to the right person. As of today, the
    prize for a properly created block begins to be awarded to the recipient. By the
    year 2140, it is predicted to have fallen to an infinitesimal value.


    Miners came to the realization that mining on a standalone basis was no longer
    profitable one day. The likelihood that you will discover such a block is determined
    by the "hash rate," or the computing capacity of your Bitcoin miner''s machine.
    If your hash rate accounts for 10% of the entire hash rate, for example, you will
    be able to find such blocks with a 10% chance of finding them and receiving your
    reward under certain conditions. As a result, if you only mine on your laptop
    at home, you will never discover a new block. As a result, in order to obtain
    a more steady payout, the miners band together to form what are known as "mining
    pools." They make use of their combined hash rate in order to generate a more
    consistent income.


    Many miners are now asking themselves, "Why should I mine when I can buy Bitcoin?"
    It is also a fantastic concept because the value of Bitcoin is established solely
    by the belief of individuals who use it, whereas the cost of Bitcoin is set solely
    by the demand for bitcoin. If no one purchases your Bitcoin from you, there will
    be no cost to you. Because of this, the value of Bitcoin will continue to rise
    for as long as people perceive this technology as a means of making anonymous
    payments, making huge payments, and so on.


    I will not go into greater detail about Bitcoin itself because I previously wrote
    a book on the subject, Mastering Bitcoin for Beginners, which was dedicated to
    this topic. For the time being, I''ll focus on the advantages of Bitcoin, which
    continues to generate some questions.


    The primary advantage is the low cost of transactions. However, it is important
    to remember that Bitcoin is not suitable for micropayments. If you transfer $1
    million to someone, it will not cost you a single penny. If you choose to pay
    for a cup of coffee, the cost will be substantial in comparison to the cost of
    the coffee.


    The second advantage is the ability to process transactions at rapid speeds. There
    are also some drawbacks to consider. According to the blockchain.org website,
    every block in the blockchain is generated once every ten minutes.


    For example, the quickest transaction possible takes ten minutes. When compared
    to a SWIFT transfer through a bank, which can take 2-4 days, this appears to be
    a relatively speedy process. Visa and MasterCard, on the other hand, are significantly
    speedier. They have the capability of processing tens of thousands of times more
    transactions per unit of time than Bitcoin. There are several other types of cryptocurrency
    that have been developed to be faster than Bitcoin, and it is worth noting that
    they are presently available.


    The third advantage is the pseudo-anonymity with which people can identify themselves.
    We have already discovered that anyone can follow all transactions on the network,
    which we have already investigated. If you know who owns a wallet and where it
    is located, you can follow absolutely all transactions that take place in it.
    As a result, it is impossible to claim that Bitcoin is completely anonymous. A
    person''s anonymity is destroyed as soon as they are able to connect their address
    with their personality. However, if you adhere to so-called "internet hygiene,"
    which means that you do not disclose your wallet to anyone, then your transactions
    are virtually impossible to track down. Though I should point out that there are
    other cryptocurrencies that are more anonymous than Bitcoin, I will not go into
    detail about them.


    It should be noted that if you wish to remain anonymous when transacting on the
    Bitcoin network, this is currently available. There are a plethora of options
    available for washing your bitcoins. They are referred to as "mixing services,"
    and they are used to mix one''s money with those of other people''s bitcoins in
    order to obscure the trail leading back to the funds'' original origin. As you
    can see, new technologies have emerged in order to increase the anonymity of cryptocurrencies
    even further.


    Finally, more than 16 million bitcoins are currently in circulation around the
    world, with a total of 21 million bitcoins expected to be mined. The algorithm
    of the network itself is responsible for programming such figures. Because of
    the restricted supply of Bitcoin, it is impossible for this currency to become
    increasingly valuable. Because only a limited number of units will be produced,
    the value of this currency will not diminish over time. Bitcoin even has a deflationary
    paradigm, as many users lose their coins as a result of forgetting their wallet
    password or sending money to the incorrect recipient address. As a result, the
    total number of bitcoins will eventually diminish.


    ## PROOF OF WORK ABD WHY IT’S IMPORTANT


    The following were the most pressing issues facing the Bitcoin network: how to
    ensure that transactions were truly true; how to ensure that a miner did not fool
    anyone; and what should be done in order to select the appropriate block and actually
    build the blockchain. All of these difficulties are resolved by the use of the
    consensus procedure.


    It is confirmed by the Proof of Work protocol that a miner has put in a significant
    amount of effort in order to find a proper nonce and generate a successful hash.
    You''ll have to put in a lot of effort to find the right one. I''ll go into greater
    detail later.'
