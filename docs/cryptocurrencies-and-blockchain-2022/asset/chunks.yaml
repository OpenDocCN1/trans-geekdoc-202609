    # Understanding ICO Scams and Investment Risks


    ## Introduction


    As you''ve undoubtedly already seen, there are a lot of scammers in the world
    of initial coin offerings. Let''s talk about ICO scams for a moment. Simply searching
    for "scam + history" will yield a long list of numerous services that, in one
    way or another, have decided to prey on the trust or carelessness of others, as
    well as a large number of scams themselves. The fields covered are the most diversified,
    ranging from energy to the financial sector, among others. Despite the fact that
    initial coin offerings (ICOs) have only been around since 2013, this area has
    experienced a significant number of scams.


    ### Red Flags for ICO Scams


    How can you know if an initial coin offering (ICO) is a scam? Here''s what you
    should be on the lookout for:


    - The initial coin offering (ICO) concept generates just digital currency, which
    is positioned as a universal means of international payments without specifying
    any of its special benefits. Even though there is no explicit model of profit
    sharing presented, the initiative is portrayed as being on an exceptionally vast
    scale by its proponents.

    - The ICO project''s developers are putting all of their efforts into marketing
    it while saying absolutely little about the code, which may potentially be closed
    off completely (not open-source).

    - Fraudsters typically create a platform without displaying any tangible fruits
    of their labors. It is possible that the main developer is well-known in professional
    circles or that he or she has already been involved in a criminal enterprise.


    ## Successful ICO Examples


    It is important to note that there are numerous examples of successful initial
    coin offerings. The success of an initial coin offering (ICO) is based on a number
    of variable factors. The amount of money raised is traditionally used as a measure
    of success in fundraising. When it comes to cryptocurrency fundraising, the Bancor
    project is now the leader (at the time of writing this book), having raised 396,720
    ETH in less than three hours in June 2017. Another successful rapid crowdsale
    effort is the revolutionary Brave browser campaign, which collected $36 million
    in the first few minutes of the project''s existence. Aside from that, in May
    2017, the projects Storj ($30 million in less than a week) and Aragon (which raised
    the requisite 275,000 ETH, or roughly $25 million, in just 15 minutes from when
    the ICO began) entered the ranks of successful cryptocurrency crowdsales.


    Other projects include MobileGo ($53 million), Gnosis ($12.5 million in 10 minutes),
    Blockchain Capital ($10.5 million in 2 hours), Aeternity ($2 million in the first
    few hours), and, most notably, Status ($90 million), which caused the Ethereum
    network to go down for several hours. And we mustn''t forget about the renowned
    DAO project, which went bust in the summer of 2016 and gave birth to Ethereum
    Classic in its place.


    ### Success Factors


    The success of an initial coin offering (ICO) is primarily dependent not just
    on the concept, but also on a well-executed public relations effort.


    ## Investor Fund Protection


    The question that you may have is: how are the funds of the investors safeguarded
    in such projects? My response is fairly straightforward: the money is not safeguarded.
    For the most part, the only safety guarantees are based on the reputation of the
    project, that is, the reputation of people who are not familiar with you.


    ## Why People Invest Despite Risks


    Why do people continue to invest in these initiatives in light of all of these
    considerations? Here are some of the reasons why people are willing to take the
    risk of participating in an ICO:


    - Desire to profit from a popular trend

    - Want to adopt the position of a business partner to keep up with other investors''
    expectations

    - Belief in the potential of a startup


    Because there are no rules overseeing the behavior of ICOs and protecting you
    from scammers, it is extremely important to carefully evaluate an ICO to invest
    in before making a decision. It is not uncommon in initial coin offerings (ICOs),
    as well as in crowdfunding, for a project to never reach the point of product
    execution.


    ## Key Considerations Before Investing


    If you are still interested in a certain initial coin offering (ICO) and are prepared
    to invest in it, pay close attention to the following important considerations:


    - The whitepaper and road map for the project

    - The essence of the product (feasibility, demand, and whether or not there is
    a genuine problem that the project solves)

    - The integration of the project with the Blockchain (whether it is needed or
    far-fetched)

    - The project''s management team (experience, their history)

    - The primary individuals responsible for the project (their experience, their
    history)

    - Demonstration of the project''s intended outcome (what money is needed for)


    ### Additional Questions to Ask


    In addition, you should look for answers to the questions listed below:


    - What will be the driving force behind the demand for these tokens and cryptocurrencies?
    What will cause a significant increase in the number of coins in circulation,
    and what can be obtained in exchange for them?

    - Is it possible to exchange them for items or to sell them once they have been
    received?

    - At the same time, when evaluating an ICO as an investor, you should consider
    whether the project is capable of solving the problem or performing the task for
    which it was created on its own.


    ### Investment Suggestions


    Additionally, bear the following suggestions in mind:


    - Select a project in which you have at least a basic understanding of the concepts.

    - Invest logically, without agonizing over it, and avoid putting all of your money
    into a single endeavor.

    - Always exercise caution. Even if you get lucky with one initial coin offering
    (ICO), you are not guaranteed against loss in the future.


    ## Resources for ICO Research


    You may learn more about the companies that are launching initial coin offerings
    (ICOs) by visiting `icorating.com`. Icorating is an impartial agency that maintains
    a database of different initial coin offerings (ICOs), both closed and upcoming.
    There is also a list of initial coin offerings (ICOs) that are believed to be
    outright scams. The specialists at `icorating.com` assess the following ICO characteristics:


    - The company''s model (its relevance, merits, and flaws)

    - Finding a market niche (prospects and dynamics of the development of the chosen
    niche for doing business)

    - Assemblage of persons (with business experience in the traditional market segment,
    the Blockchain industry, and experience in Blockchain development)

    - Competition (level of competitive pressure in relation to companies with similar
    business models from the traditional market segment and the Blockchain economy)

    - Background knowledge in the technical field (availability and quality of a prototype
    or source code)

    - Feedback from the community is being analyzed


    Following your examination of this agency''s preliminary assessment of initial
    coin offerings (ICOs), you will be better prepared to analyze the project you
    are contemplating in order to make a final decision on whether or not to invest
    in it.


    `Icotracker.net` is another website that provides information on initial coin
    offerings. Here you will find a list of upcoming initial coin offerings (ICOs).
    I also propose `icobazaar.com`, `icocountdown.com`, and `cyber.fund/radar` as
    additional resources for investors.


    ## Market Comparison


    The ICO market is becoming eerily similar to the dotcom bubble of the 1990s (1995–2001).
    People today recall the IPOs of firms such as Apple, Amazon, and Google, and they
    wonder what type of riches they could have made if they had invested in those
    companies at the time of their IPOs.

    '
