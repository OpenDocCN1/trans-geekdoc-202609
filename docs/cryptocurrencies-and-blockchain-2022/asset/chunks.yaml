    # 区块链基础


    ## 不断增长的链


    随着时间推移，链的长度不断增加。一旦形成新区块，网络上的所有参与计算机就会协作验证区块中包含的交易，并保护该区块在链中的位置。


    ## 账本：核心组件


    账本是 `blockchain` 最基础的组件。网络上账户的信息在此安全保存。`blockchain` 中包含的账本取代了银行或其他金融机构中的账本。在 `cryptocurrency`（加密货币）的情况下，该账本通常由账号、交易和余额组成。每当你向
    `blockchain` 提交一笔交易，你就在向账本添加关于资金来源和去向的信息。


    `blockchain` 账本是一种分布在整个网络中的数字记录。网络上的每个人都维护自己的账本副本，每当有新交易发送到网络时，账本就会更新。`Blockchain`
    承诺通过使用“共享账本”来取代银行和其他金融机构。不再由银行维护单一的官方账本副本，而是每个人维护自己的账本副本，然后我们通过就最终版本达成共识来验证交易。


    每个 `blockchain` 系统都有自己的账本，不同账本的运作方式各异（稍后我们将看到）。然而，要在作为首个 `blockchain` 账本的 `Bitcoin`
    账本上记录一笔交易，需要三条信息：


    ## 交易在 Bitcoin 账本上如何运作


    ### 所需信息


    1. **交易输入**：如果 John 想给 David 转账一个比特币，他必须首先告知网络他是如何以及在哪里获得该特定比特币的。由于账本条目的初始部分表明
    John 是昨天从 Sarah 那里收到的比特币，所以 John 可能是在昨天收到的比特币。

    2. **金额**：一个美元金额：这是 John 想要转给 David 的金额。

    3. **交易输出**：一个结果：这是 David 的比特币地址，也是比特币应存放的位置。

    4. **找零输出**（隐含）：返回给发送者的剩余部分。


    ## Bitcoin 的本质


    下一个概念很难理解：现实世界中不存在 `Bitcoin` 这种东西。当然，找不到实体的比特币。这可能是你早已知晓的。然而，计算机硬盘或其他任何地方都没有存储比特币。你无法指着某个实物、数字文件或代码片段说“这就是比特币的样子”来识别比特币。相反，整个
    `Bitcoin` 网络只不过是一系列交易记录的集合。Bitcoin 历史上的每一笔交易都记录在 `Bitcoin Blockchain` 上，它作为所有交易的分布式账本。如果你想证明你有
    20 个比特币，唯一的方法就是提供你获得这 20 个比特币的那些交易的链接。


    这是几乎所有 `blockchain` 技术共有的特征。货币由交易历史代表。两者没有区别。为了在交易中实现更好的匿名性和隐私性，一些新的加密货币正在修改其账本的维护方式。在发送和接收交易时，它们使用身份掩码技术来隐藏发送方和接收方，同时仍保持分布式账本的功能。


    ## 区块结构


    ### 账本、区块头和区块尾


    区块的账本是其核心组件。然而，它不是新生成区块的唯一组件。每个区块都必须有一个区块头和一个区块尾，两者都必不可少。此外，区块中包含的交易在被纳入区块前，会经历压缩、编码和标准化过程。当验证者创建新区块时，其基于的账本看起来与它所基于的账本截然不同。然而，底层账本保持完整，如果新交易需要关于先前已完成数据区块的知识，可以在未来访问它。


    ## 添加交易


    ### 交易验证过程


    要开始构建一个区块，第一步是收集所有现有交易并将它们录入区块的账本。每当用户发起一笔新交易，该交易就会广播到整个网络。然后，连接到验证者的计算机会审查该交易，以确保其真实有效。


    由于 `blockchain` 货币只不过是一系列交易，验证交易的第一步是查看发送者声称他们最初是在哪里收到钱的。然后验证者会回溯 `blockchain`
    的历史，以定位发送者收到钱的那个区块和交易。只要输入交易在 `blockchain` 上得到确认，该交易就是有效的，之后他们只需确认接收方的地址即可。如果输入交易未被确认，则当前交易被视为非法，不会被记入账本，并会被丢弃。


    ### 账本创建与哈希


    一旦区块中的所有交易都经过验证和批准，账本就创建完成了。这是一个简单的示例，其中交易按时间顺序依次列出：


    之后，验证者会对每笔交易应用一种称为 `hashing`（哈希）的加密技术。从最基本的定义来看，`hashing` 是接收一个字符串并生成另一个字符串的过程。因此，当你将输入、金额和输出地址提供给哈希算法时，算法会将交易转换为该交易独有的字符串，如下所示：


    ```

    a1075db55d416d3ca199f55b6084e2115b9345e16c5cf302fc80e9d5fbf5d48d

    ```


    * 此处显示的哈希是来自 `Bitcoin Blockchain` 的真实交易哈希。


    因此，`hashing` 用于标准化数据，同时确保数据未以任何方式被篡改。如果有人试图修改 `blockchain` 中的交易，他们必须重新哈希该交易，这会导致交易看起来完全不同。如果被以某种方式篡改过，这将显而易见。


    ### 默克尔树


    大多数区块链会对交易进行多次哈希，以使篡改 `blockchain` 更加困难，并降低保存交易账本所需的内存量。他们将一笔交易的哈希与另一笔交易的哈希结合，然后将结果重新哈希成一个新的、更小的哈希。当交易以这种方式组合时，结果称为“`merkle
    tree`”（默克尔树），所有交易的根哈希包含在每个交易区块的开头。解释为什么需要默克尔树超出了本书的范围，但从最基本的层面来看，`merkle tree`
    确认了区块中的所有交易都是有效的，同时从长远来看消耗更少的内存。


    ## 区块标识


    ### 时间戳和区块 ID


    区块的时间戳和区块 ID 是最后添加的元素。这使得未来查找之前的区块变得轻而易举。为了防止双重支付，未来的交易可以引用此区块 ID 作为包含输入交易的区块（也称为“`coinbase`”/币基交易）。


    ## 将区块链接在一起


    生成区块的最后一步是将其与链中之前的区块连接起来。可以使用多种方法来实现这一点，但几乎所有方法都涉及以某种方式对前一个区块的内容进行哈希，以使其成为当前区块的一部分。

