- raw: 'The following is the most important aspect of the ICO strategy, which I refer
    to as "startups." When it comes to funding initiatives, the cryptocurrency economy
    has created a very simple method for those who have unique and fascinating ideas
    to do so quickly and easily. They no longer have to pound the pavement, begging
    and persuading large corporations that investing in their idea is a profitable
    investment decision. These innovators and developers no longer have to do anything
    more than post a proposal on their website. Interested in their proposal? You
    can share the address of your wallet so that you can receive tokens if the idea
    proves to be a success. The risk is that you will have to put money aside right
    away in order to reap a potential benefit later on.


    In the past, the rules of the game for initial coin offerings (ICOs) were rather
    straightforward. I give you one dollar, and you give me two tokens. Some initial
    coin offerings (ICOs) go to extreme lengths to attract investors.


    Generally speaking, if you invest in an initial coin offering (ICO), it is possible
    that you will only be able to trade their tokens on Friday at midnight during
    the full moon, and only if you are a mermaid with a blue tail. Obviously, my story
    is a bit exaggerated, but it clearly illustrates the ambiguity of the rules that
    govern the majority of beginning businesses (ICOs).


    It was not difficult to locate a grain of truth amid the diversity of ICOs when
    they first started half a year ago (since just a few of them appeared in a week
    and could be readily evaluated), but now new ICOs appear virtually every hour,
    and you don''t have time to check them all.


    What would I say to a newcomer who is tempted to try his luck with initial coin
    offerings (ICOs)?


    First and foremost, you must have a firm grasp of the business area in which you
    intend to make a financial investment. If you are knowledgeable in the field,
    you can assess it and determine whether or not it has a chance of success. In
    addition, I recommend that you pay attention to what experienced investors and
    specialists have to say rather than what is posted on the ICO''s official website.
    To the point that I would recommend that you avoid investing in any initial coin
    offering (ICO) that has not been featured in at least three professional analytical
    studies from acknowledged experts.


    ## PENNY STOCKS


    When it comes to the stock market, the concept of penny stocks should be familiar
    to anyone who has even a passing interest in it. Generally speaking, these are
    shares of the corporation that no one wants or needs anymore. These shares, on
    the other hand, have one distinguishing feature: they are so inexpensive that
    nothing can prevent their value from skyrocketing tenfold. Such a spectacular
    leap can occur as a result of positive news, a small amount of market manipulation,
    or for any other reason.


    So, what are the best ways to make use of this strategy? You purchase the most
    unusual and obscure coins available and then sit back and wait to see how the
    situation unfolds. During the course of the year, the value of some of your coins
    could rise. This is a situation in which you should sell your currency quickly.
    Suppose you invested in fifty coins. A rise in the price of even one super-cheap
    coin will be enough to make up for the loss of your whole investment portfolio.


    This type of plan does not allow you to go deeply into the fundamentals of operating
    in the bitcoin industry. All that is required is that you purchase "trash" and
    sell it before the deadline. This method, on the other hand, is not within my
    purview because it resembles a casino. You don''t need any special abilities or
    knowledge; all you need is luck. You have no control over what happens or how
    risks are managed because everything is dependent on good fortune.


    ## TRUST IN ME


    This method is appropriate for you if you have no prior expertise in the bitcoin
    industry but have a substantial amount of money to invest. You must, however,
    be willing to take chances and give your money to people you do not know. Because
    the bitcoin business is not governed by any regulations, no one can ensure that
    a corporation or someone who has claimed to earn money for you would not take
    your money and flee to some exotic location.


    There are a large number of businesses on the market that promise profit in exchange
    for confidence. Some companies, for example, provide mining contracts to those
    who wish to mine but do not have the financial resources to invest in all of the
    necessary equipment and space to do so. This is referred to as "cloud mining."
    Cryptocurrency funds are another sort of business entity. These businesses do
    not know how to mine, but they are skilled at predicting the value of promising
    coins.


    The third type of mutual fund is an initial coin offering (ICO). These gentlemen
    spend their time researching and evaluating the various businesses on the market,
    in which they will subsequently invest your money. Finally, there is the option
    of trading your stock. When you delegate control of your money to someone else,
    they will perform the trading for you.


    I want you to understand that now that we''ve gone over these seven investment
    techniques, please understand that I believe all of them to be flawed.


    Before you hurl this book across the room, allow me to share two perfect investment
    strategies with you.


    I believe that there are two ideal strategies to choose from.


    The first one is based on your honest belief in the future of cryptocurrencies
    as a whole. If this describes you, you should take on a few methods that interest
    you, mix them up, and start making money in this manner: by diversifying both
    your possibilities of making a profit and your risks of losing money.


    You should pay attention to the second excellent investment strategy if you don''t
    fully believe in the future of the bitcoin industry at the core of your being.
    This method involves earning money from people who do believe in the future of
    cryptocurrency.


    Selling Shovels is the name I have given to this method. Some people will require
    mining equipment and facilities, some will require dollars, and still others will
    require knowledge, so you can earn money by meeting their requirements.


    # CHAPTER 14. RISK AND MONEY MANAGEMENT


    Money management is, without a doubt, one of the most significant topics in the
    world of investments. If you do not have a professional way of calculating the
    lot size, your account will be a non-starter no matter what trading strategy you
    choose. I am hopeful that we will be able to figure out how to quantify your risks
    by working together.


    So, please take the time to carefully understand the basic guidelines of money
    management that I have established for the bitcoin market.


    Ten percent of the risk is taken on in a single trade. That is, if you enter a
    single transaction, you should not take on more than 10% of the risk. If you make
    five transactions a day, you should divide your risk by five, which equals 10
    percent of your total risk. Avoid making frequent transactions in an attempt to
    acquire more money. Paying commission fees to the exchange will cause you to lose
    a significant amount of money.'
