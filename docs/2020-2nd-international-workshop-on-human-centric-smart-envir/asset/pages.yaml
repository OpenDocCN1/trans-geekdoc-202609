    # V. RESULTS AND DISCUSSION


    We used four performance metrics derived from the confusion matrix to evaluate
    the models : Accuracy; the rate of correct predictions to the total number of
    predictions,


    ```

    Acc = \frac{TP + TN}{TP + TN + FN}

    ```


    Precision or positive predictive value is the ratio of good positives to the total
    detected:


    ```

    Pr = \frac{TP}{TP + FP}

    ```


    Recall or sensitivity corresponds to the probability of correctly classifying
    a sample in the case,


    ```

    R = \frac{TP}{TP + FN}

    ```


    F-score is a measure that combines both precision and recall as determined in
    the:


    ```

    F_{score} = \frac{2 \times Pr \times R}{Pr + R}

    ```


