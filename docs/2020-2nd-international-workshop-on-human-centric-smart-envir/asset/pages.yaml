    # B. Architecture:


    In order to properly achieve our study, we selected the best performing deep learning
    models in the image recognition domain. We evaluated the performance of the networks
    that have been trained on the ImageNet [5], VGG16 (1), VGG19 (2), Inception v3
    (3), NasNet (4), ResNet50 (5), Xception (6), MobileNet (7) and VGG9 (8). Each
    deep neural network is used to analyze the X-ray image in order to classify the
    sample as Normal, COVID-19, or Viral Pneumonia. All images are resized to 400-400
    pixels. We applied different data augmentation techniques to the training data
    models, such as rotation, flipping, shearing transformations and zooming. As preprocessing,
    we used contrast adaptive histogram equalization technique to improve contrast
    in chest X-ray images. According to the Pareto principle, 80% of the data were
    used for training and validation of the eight models. We trained each model for
    100 epochs. Fig. 4 illustrates an example of the training performances of VGG19.


    Models trained on imbalance dataset will show bias in minority class, and may
    ignore the majority class altogether, in extreme case [14]. In our study, we considered
    only balanced data, containing the same number of samples. We will consider the
    three classes of chest X-ray images: Normal healthy cases without any pulmonary
    traces, COVID-19 corresponding to patients detected by COVID and Viral Pneumonia
    for patients suffering from non-COVID-19 pneumonia. Since the COVID-19 our class
    of interest, contains the minimum number of samples, we apply under-sampling (RUS)
    to discard samples from native classes to balance the sample number among categories;
    resulting in 518 samples for each class. 363 images were randomly selected from
    the 518 for training.'
