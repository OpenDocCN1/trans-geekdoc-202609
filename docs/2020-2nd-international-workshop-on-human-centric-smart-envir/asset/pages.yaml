    In all cases, the application of deep learning to distinguish and identify novel
    COVID-19 in x-ray data is still challenging because of the scarcity of publicly
    available data, ready and adequate for training algorithms. Also, besides its
    tediousness, the preparation of the training data sets, under current global health
    conditions, remains of lower priority. Therefore, in this paper we extend the
    contributions of the different deep neural architectures in recognizing COVID-19
    in x-ray images.


    # III. PNEUMONIA CHEST X-RAY DATABASES AND DEEP LEARNING IMAGE CLASSIFIERS


    In this section, we discuss the used chest x-ray datasets in the literature for
    medical image analysis. Then, we describe some of the state-of-the-art deep image
    classifiers.


    # A. Chest X-ray datasets


    The creation of a large annotated ... image dataset is tedious and prone to error,
    for reasons which researchers rely on the publicly available data. Several studies
    have tried to create COVID-19 datasets in order to ensure works on the automatic
    screening of the pathology. Among the well-known datasets for viral (COVID as
    well as other viruses) pneumonia detection and classification methods:


    +   - **COVID-19 Radiography Database [6]:** A team of researchers in collaboration
    with medical doctors has created a dataset of chest x-ray images with Normal and
    Viral pneumonia images. In their current release, there are 219 COVID-19 cases,
    1341 normal, and 1345 viral pneumonia images.

    - **COVID Chest X-Ray Dataset [7]:** This is a database of confirmed or suspicious
    COVID-19 cases of viral or bacterial pneumonia (MERS, SARS, ARDS). The project
    is approved by the University of Montreal''s Ethics Committee.

    - **Mendley Chest X-ray Images [8]:** it consists of 2856 X-ray images (in JPEG
    format) organized into two categories (Pneumonia/Normal), it contains 1 to 5 years
    old patients. The particularity of this dataset is that the pneumonia type (viral
    or bacterial) is revealed.


