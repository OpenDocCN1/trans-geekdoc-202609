    # VI. CONCLUSION


    In this study, we trained several deep convolutional networks for classifying
    X-ray images in three classes: Normal, Viral Pneumonia, and COVID-19, on four
    datasets. The multitude of data sources contributes to better generalize the trained
    networks. Unfortunately, the data of COVID-19 is still uncertain in terms of quality,
    which presents a huge challenge for the development of the automatic classification
    systems. Our data contain more than 500 X-ray images to identify COVID-positive
    cases, which presents a significant number compared with previous work in this
    field. This research mainly involves comparing the performance of several networks
    on COVID-19 classification task. The presence of the viral pneumonia class plays
