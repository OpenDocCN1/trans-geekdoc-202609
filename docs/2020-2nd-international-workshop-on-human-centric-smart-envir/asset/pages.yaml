    # B. Deep Image classification models


    In this section, we review some of the state-of-the-art deep image classifiers
    that have proven performance:


    +   - **VGG:** Group Network was introduced in [9], Deep Convolutional Networks
    for Large Image Recognition. To improve image extraction functionality, the VGGNet
    used only 3x3 convolutional layers stacked on top of each other in increasing
    depth. There are two versions of this network: VGG16 and VGG19. (“16” and “19”
    stand for the number of layers in


    +   - **Inception:** network or GoogleNet architecture was introduced in [10].
    This network is based on a multi-level feature extractor by almost 1x1, 3x3 and
    5x5 convolutions within the same module. Later layers are referred to as Inception
    V where N is the number.

    - **ResNet:** This architecture [11] relies on residual modules, or elementary
    building blocks of the network. Although ResNet is much deeper than VGG16 and
    VGG19, the module size is smaller than the usage of a global pooling rather than
    fully-connected layers

    - **Xception:** Proposed in [12], which is an extension of the Inception architecture,
    the standard Inception modules were replaced with separable convolutions

    - **Mobile:** This network [13] was designed to maximize accuracy while minimizing
    the computational burden of most deep neural networks. This network has the plasticity
    of longterm.


    # IV. METHODOLOGY


    In this section, we present the strategy we tested on the above-mentioned datasets
    and the performance of each network in chest x-ray images with COVID-19. Our primary
    focus is to discover the most adequate models, for COVID-19 screening, by different
    techniques.


