    X 光图像中识别 COVID-19 的贡献。


    # III. 肺炎胸部 X 光数据库与深度学习图像分类器


    在本节中，我们讨论了文献中用于医学图像分析的胸部 X 光数据集。然后我们描述了一些最先进的深度图像分类器。


    ### A. 胸部 X 光数据集


    创建一个大型标注图像数据集既枯燥又容易出错，由于这些原因，研究人员依赖公开数据。多项研究已尝试创建 COVID-19 数据集，以确保病理自动筛选工作。在著名的病毒性（COVID
    及其他病毒）肺炎检测和分类方法集中的：


    - **COVID-19 Radiography Database [6]:** 一组研究人员与医生合作创建了一个包含正常和病毒性肺炎图像的胸部 X 光数据集。在目前的发布中，有
    219 例 COVID-19 病例、1341 例正常和 1345 例病毒性肺炎。

    - **COVID Chest X-Ray Dataset [7]:** 这是一个确认或疑似感染 COVID-19 的病毒性或细菌性肺炎（MERS、SARS、ARDS）数据库。该项目已获得蒙特利尔大学伦理委员会的批准。

    - **Medley Chest X-ray Images [8]:** 由 2856 张 X 光图像（JPEG 格式）组成，分为两类（肺炎/正常），包含
    1 到 5 岁的患者。该数据集的特殊之处在于揭示了肺炎类型（病毒或细菌）。


