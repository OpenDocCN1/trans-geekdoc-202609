    chest X-Ray images


    Sabrina Nefoussi, Ednadir Ammar, Idriss Amir Amouche

    Ecole Polytechnique

    Bordj El-Bahri BP 17, Algeria


    **Abstract—**The COVID-19 pandemic is devastatingly affecting the health and the
    well-being of the world population. As one of the latest advances in the battle
    against it is effective screening of patients using radiation such as X-rays.
    With this challenge, various Artificial Intelligence (AI) frameworks, mostly based
    on deep learning, have been proposed and results to recognize positive cases is
    constantly refined. By previous work on automated X-ray screening, we trained
    different models to classify pathologies into normal, pneumonia, and COVID-19.
    We used three open-source datasets for the validation of our methods to address
    the challenge of highly hindering COVID-19 recognition. In our case, we evaluated
    several different architectures.


    **Index Terms—**COVID-19, Pneumonia, Chest X-ray, Deep learning, Convolutional
    Networks, Transfer Learning


    convolutional neural networks for COVID-19 chest X-ray classification. In Section
    III, we lay out the theoretical background of the tools used in our study. We
    later explain our methodology in Section IV, where we shed light on the utilized
    data and the methods. Experimental results and comparative performance deep learning
    classifiers are provided in Section V. The final paper summarizes our findings
    and give some future directions.


    # I. INTRODUCTION


    Coronavirus has a medical threat all around the globe. The number of infected
    people and deaths are growing per the updated reports of the World Health Organization.
    It has reported that this infection has taken 1.26 million lives until the date
    of this writing. Since the start of the pandemic, numerous Artificial Intelligence
    specialists have proposed methods and strategies for detecting the infection evolution
    or recognition. One of the potential methods for deciding whether a patient is
    contaminated with COVID-19 is achieved through the analysis of the chest X-ray
    images. As there is a large number of patients in hospitals, it would be tedious
    and hard to manually process a large number of X-ray images, therefore needs an
    automated system.


    The performance of automated detection systems depends on the training phase.
    The latter requires good quality and sufficient quantity of data to reach its
    full potential. Developing automated detection of COVID-19 in chest X-ray images
    remains however, due to the insufficient amount of available COVID-19 data. In
    our case, we compared the performance of different architectures that prove their
    performance on the natural recognition task.


    The remainder of the paper is structured as follows. In Section II, we provide
    a review of the state-of-the-art deep


    # II. RELATED WORK


    As highlighted by the World Health Organization, the COVID-19 pandemic is extremely
    challenging the health systems, under enormous pressure. The identification of
    this infection will help in alleviating the burden of hospitals. Chest X-ray data
    have been a playing role in the detection of pneumonia. As pneumonia is a type
    of COVID-19, it is crucial to recognize it through chest X-ray screening. With
    rapid development in the area of Machine Learning (ML) and Deep learning, several
    methods have been proposed for pneumonia and normal cases.


    Several works have been contributed to COVID-19 detection. The authors of [1]
    proposed a neural classifier for classifying images into three classes: normal,
    pneumonia, and COVID-19. They used X-ray images. They also proposed a conception
    of CNN and ResNet50 to improve their accuracy. In [2], the authors proposed a
    neural learning-based classification of COVID-19 chest X-ray images. Only 6 COVID-19
    X-ray images were used. [3] proposed a convolutional neural network for the detection
    of COVID-19 cases in chest X-ray images. Other authors [4] proposed COVID-19,
    a deep learning framework that can be used by radiologists to automatically diagnose
    COVID-19 in X-ray images. Only 60 COVID-19 images were used. [5] proposed seven
    different architectures that were modified with VGG19 and the second version of
    MobileNet. The authors in [5] demonstrated how to detect the COVID-19 infection
    with chest X-rays using iteratively pruned deep learning ensembles. To improve
    the performance of their approach, they used transfer learning and fine-tuning
    approaches.


