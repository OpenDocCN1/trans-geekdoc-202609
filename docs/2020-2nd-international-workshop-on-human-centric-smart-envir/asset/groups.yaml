    Sabrina Nefoussi, Ednadir Ammar, Idris Amir Amouche

    Ecole Polytechnique

    Bordj El-Bahri BP 17, Algeria


    **摘要—**COVID-19 疫情对全球人口的健康和福祉造成了毁灭性的影响。抗击这一疫情的最新进展之一是使用 X 射线等辐射对患者进行有效筛选。针对这一挑战，研究人员提出了多种基于深度学习的人工智能（AI）框架，并不断优化识别阳性病例的
    result。根据之前在自动 X 光筛选方面的工作，我们训练了不同的模型来将病理情况分类为正常、肺炎和 COVID-19。我们使用了三个开源数据集来验证我们的方法，以应对严重阻碍
    COVID-19 识别的挑战。在本文中，我们评估了几种不同的架构。


    **索引词—**COVID-19、肺炎、胸部 X 光、深度学习、卷积神经网络、迁移学习


    用于 COVID-19 胸部 X 光分类的卷积神经网络。在第 III节中，我们阐述了研究用工具的理论背景。随后我们在第 IV节中解释了我们的方法论，重点介绍了所使用的数据和方法。第
    V节提供了实验结果和深度学习分类器的对比性能。论文最后总结了我们的发现，并给出了一些未来方向。


    # I. 引言


    冠状病毒在全球范围内都构成了医学威胁。根据世界卫生组织的最新报告，感染人数和死亡人数不断增加。报告显示，截至本文写作日期，该感染已夺了 126 万人的生命。自疫情开始以来，许多人工智能专家提出了各种方法和策略，用于检测感染的演变或识别。判断患者是否感染了
    COVID-19 的潜在方法之一是通过分析胸部 X 光图像实现的。由于医院中有大量患者，手动处理大量的 X 光图像将既枯燥又困难，因此需要一个自动化系统。


    自动检测系统的性能取决于训练阶段。后者需要高质量且足够数量的数据才能充分发挥潜力。然而，由于可用的 COVID-19 数据不足，开发胸部 X 光图像的 COVID-19
    自动检测仍然是一项挑战。在本文中，我们比较了不同架构的性能，它们在自然识别任务中证明了自身的性能。


    论文的其余部分结构如下：在第 II节中，我们提供了对最先进深度的综述


    # II. 相关工作


    正如世界卫生组织所强调的，COVID-19 疫情正使医疗系统面临严峻挑战，压力巨大。识别这种感染将有助于减轻医院负担。胸部 X 光数据在肺炎检测中发挥了作用。由于肺炎是
    COVID-19 的一种类型，通过胸部 X 光筛选识别它至关重要。随着机器学习（ML）和深度学习领域的快速发展，研究人员已针对肺炎和正常病例提出了多种方法。


    已有若干工作对 COVID-19 检测做出了贡献。[1] 的作者提出了一种神经分类器，将图像分为三类：正常、肺炎和 COVID-19。他们使用了 X 光图像。他们还引入了
    CNN 和 ResNet50 的概念来提高其准确性。在 [2] 中，作者提出了一种基于神经学习的 COVID-19 胸部 X 光图像分类。仅使用了 6 张
    COVID-19 X 光图像。[3] 提出了一种用于检测胸部 X 光图像中 COVID-19 病例的卷积神经网络。其他作者 [4] 提出了 COVID-19
    这种深度学习框架，放射科医生可用其自动诊断 X 光图像中的 COVID-19。仅使用了 60 张 COVID-19 图像。[5] 提出了七种通过 VGG19
    和第二版 MobileNet 修改的不同架构。[5] 的作者展示了如何使用迭代剪枝的深度学习集成模型通过胸部 X 光检测 COVID-19 感染。为了提高他们方法的性能，他们使用了迁移学习和微调方法。


