    # COVID-19数据集上的训练损失与准确率


    ![](img/5f15cd42eb8e067054e93b4cf3a9ca3c_2_1.png)


    ![](img/5f15cd42eb8e067054e93b4cf3a9ca3c_2_2.png)


    图 3. 正常胸部X光图像示例


    图 4. VGG9在COVID-19数据集上的训练与验证性能


    包含总计261个COVID-19样本的图像。第二个COVID-19放射学数据库[6]包含219张COVID-19阳性图像、1341张正常图像和1345张病毒性肺炎图像。第三个数据集是Mendeley
    X-Ray ImageDataset[8]，它将X光图像分为两类：肺炎（非COVID-19）和正常。后者在提高相对于COVID-19和普通肺炎之间选择性所收集的分类质量方面具有重要作用。最后一个是由我们研究收集的，仅包含胸部X光图像。数据集的详情如表1所示。


    占所考虑图像总数的70%。剩余数据被分为10%用于验证（共51张图像），以及204张用于测试。值得注意的是，所有的训练、验证和测试数据都是随机选择的。


    # B. 架构：


    为了充分实现我们的研究，我们选择了图像识别领域中性能最好的深度学习模型。我们评估了在ImageNet [5]、VGG16 (1)、VGG19 (2)、Inception
    v3 (3)、NasNet (4)、ResNet50 (5)、Xception (6)、MobileNet (7) 和VGG9 (8)上训练的网络的性能。每个深度神经网络都被用于分析X光图像，以将样本分类为正常、COVID-19或病毒性肺炎。所有图像均被缩放为`400-400`像素。我们在训练数据模型上应用了不同的数据增强技术，如旋转、翻转、剪切变换和缩放。作为预处理，我们使用了对比度自适应直方图均衡化技术来提高胸部X光图像的对比度。根据帕累托法则，80%的数据用于这八个模型的训练和验证。我们将每个模型训练了100个epoch。图4展示了VGG19训练性能的一个示例。


    在不平衡数据集上训练的模型将在少数类上表现出偏差，在极端情况下，可能会完全忽略多数类[14]。在我们的研究中，我们只考虑了包含相同样本数量的平衡数据。我们考虑了三类胸部X光图像：无肺部迹象的正常病例、患有COVID-19的患者和肺炎。由于我们感兴趣的COVID-19类样本数量最少，我们采用欠采样（RUS）丢弃原始类别中的样本以平衡样本数量；每类保留518个样本。我们随机选择了363张图像在20%的数据上进行测试，这应该是三个类别中的每一个样本。然后，我们计算评估指标以衡量各自的性能。


    # V. 结果与讨论


    我们使用了从混淆矩阵得到的四种性能指标来评估模型：准确率（Accuracy）；正确预测数占总预测数的比例，

    ```

    Acc = \frac{TP + TN}{TP + TN + FP + FN}

    ```

    精确率（Precision）；检测到的良好阳性占总阳性的比例：

    ```

    Pr = \frac{TP}{TP + FP}

    ```

    召回率（Recall）；正确分类样本的概率：

    ```

    R = \frac{TP}{TP + FN}

    ```

    F-score是一个结合了精确率和召回率的指标：

    ```

    F_{score} = \frac{2 \times Pr \times R}{Pr + R}

    ```

    表二显示了不同模型在平衡数据集上实验的准确率结果。我们使用了518个样本进行测试，VGG16、Inception和MobileNet的准确率为0.99，VGG9达到0.91，准确率最低的模型是ResNet50，为0.85。表III说明了每个深度学习分类器在感兴趣的类别（COVID-19）上的精确率。最精确的网络是Inception、Xception和MobileNet，ResNet50在正常类上获得0.83，nasnet层为0.79。对于病毒性肺炎类，表四显示了不同模型跨四个类别的准确率，可以看到Xception在COVID-19上取得了最佳结果，为0.93，而ResNet50为0.82，nasnet层为0.74。


