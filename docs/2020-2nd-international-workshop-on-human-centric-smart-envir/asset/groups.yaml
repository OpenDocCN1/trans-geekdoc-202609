    最后考虑的指标是F分数，它总结了不同模型的结果。Xception模型在COVID-19上取得了最佳结果，VGG19在正常类上为0.94，在病毒性肺炎上为0.92；ResNet50在正常类上为0.93，在病毒性肺炎上为0.81，这些是它们测试集上得的F分数。


    # VI. 结论


    在这项研究中，我们在四个数据集上训练了多种深度卷积网络，对X光图像进行三类分类：正常、病毒性肺炎和COVID-19。数据的多样性有助于提高训练网络的泛化能力。遗憾的是，COVID-19的数据在质量上仍不确定，这为自动系统的开发带来了巨大挑战。我们的数据包含500多张X光图像用于识别COVID阳性病例，与该领域以前的工作相比具有显著数量。本研究主要涉及比较多个网络在COVID-19分类任务上的性能。病毒性肺炎类的存在对于识别模型的重要性具有重要意义。作为展望，我们将继续检测受病毒影响的肺部区域，以推动放射科医生在感兴趣区域的作用，通过标签标记识别胸部X光中的异常。此外，在处理医学图像时，我们将考虑交叉验证方法。


