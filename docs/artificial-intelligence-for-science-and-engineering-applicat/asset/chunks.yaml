    ![图 7.27 东南亚某海上成熟油田的实际测量数据，该数据被用于人工智能储层模拟和建模（自上而下建模 – TDM）。](img/Fig07_27.jpg)


    `FIGURE 7.27` 东南亚某海上成熟油田的现场测量数据，该数据被用于人工智能储层模拟和建模（自上而下建模 – TDM）。


    ### 石油工程中 XAI 的历史


    自 2001 年以来，已发表了七篇石油工程师协会（SPE）论文，其中包含了如今被称为 XAI（可解释人工智能）的内容。这七篇 SPE 论文总共包含 38 张图表，它们利用人工智能预测分析模型来解释这些模型如何完全基于实际现场测量数据而非数学方程，来解释所建模的物理现象。为了展示
    XAI 在石油工程中的历史应用，本章本节展示了这七篇 SPE 技术论文中的大部分图表。


    第一篇包含如今被称为 XAI 的早期版本的技术论文是 2001 年发表的一篇 SPE 论文（`SPE 72385`）[26]。该论文关于人工智能和机器学习在水力裂缝建模中的应用。`Figure
    7.28` 显示了该 SPE 论文中的几张与 XAI 相关的图。在本文中，使用人工神经网络开发（训练、校准和验证）的人工智能模型用于解释三个水力裂缝相关参数的影响。


    ![图 7.28 SPE 72385 论文的图 7。单井“Carlson, Thomas #075”分析 – 对注水量的敏感性](img/Fig07_28.jpg)


    `FIGURE 7.28` SPE 72385 论文的图 7。单井“Carlson, Thomas #075”分析 – 对注水量的敏感性。


    这些水力裂缝相关参数是射孔数、注水速率和总注水量。文中的 XAI 解释了这些参数对井产量（5 年累计产气量）的影响。此类关于参数对井产量影响的解释被用于确定作为射孔数、注水速率和总注水量函数的井产量优化。`Figure
    7.28` 显示了该论文的图 7，解释了井产量（5 年累计产气量）达到最大值的条件。对于这口井（`Carlson, Thomas #075`），只要射孔数和注水速率保持在最小值（注水速率为
    `25 bbl./min`，`8 perforations`），5 年累计产气量即可达到 `57,050 MSCF` 的最大值；而只要射孔数和注水速率保持在最大值（注水速率为
    `60 bbl./min`，`26 perforations`），即可达到 `63,400 MSCF` 的最大值。


    如 `Figure 7.28` 所示，当这些参数（射孔数和注水速率）保持在最小值时，最高的 5 年累计产气量（`57,050 MSCF`）在 `680 barrels
    of water` 时达到。相反，当这些值保持在最大值时，最高的 5 年累计产气量（`63,400 MSCF`）在约 `725 barrels of water
    injected` 时达到。结论可能是，对于这口井，理想的注水量约为 `700 barrels`。这篇 SPE 论文还包含了另外两张类似的图，展示了同一油田内另外两口井的解释（`Figure
    7.29`）。


    ![图 7.29 SPE 77597 论文的图 8。修复后测量值的敏感性](img/Fig07_29.jpg)


    `FIGURE 7.29` SPE 77597 论文的图 8。修复后测量值的敏感性。


    第二篇技术论文（`SPE 77597`）采用了类似的方法，将人工智能和机器学习应用于现场数据。


