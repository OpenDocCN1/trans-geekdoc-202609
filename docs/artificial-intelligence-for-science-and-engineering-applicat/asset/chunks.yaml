    how Artificial Intelligence is going to impact our world in the next few decades
    has to do with the governments of several countries. Governments in some countries
    are using this technology based on their own objectives that are a function of
    their views, beliefs, and understanding or hatred of democracy, as well as their
    intention of becoming the world leader based on how Artificial Intelligence can
    serve them. The Ethics of Artificial Intelligence (AI-Ethics) has lately become
    an important topic that must be well understood by individuals that already are,
    or are currently becoming, interested in Artificial Intelligence and machine learning
    algorithms. Unfortunately, a large number of scientists and engineers are not
    paying any attention to AI-Ethics since they believe that solving science and
    engineering related problem would not be impacted by AI-Ethics, which is not true
    at all, and this is the main reason for this chapter.


    Since the mid-2000s, when AI-based image recognition, voice recognition, facial
    recognition, object recognition, and autonomous vehicles were exposed to most
    people around the world, interest in Artificial Intelligence has increased significantly.
    As a new science and technology, Artificial Intelligence will change a lot of
    things in the 21st century. Artificial Intelligence has become one of the most
    interesting technologies that people, companies, and academia are getting involved
    with on a regular basis.


    For example, in the past decade, several banks have started using Artificial Intelligence-related
    models (developed by some of the best-known AI modeling companies) as the first
    step in making decisions about providing loans to applicants. Since usually hundreds
    or thousands of individuals apply for loans in different banks, and since each
    of the banks has only a certain number of employees and their job is to study
    and analyze the characteristics of loan applicants, it is quite tough to go through
    the details of hundreds or thousands of individuals that have been applying for
    loans. In that context, it did make sense for several banks to purchase models
    developed through Artificial Intelligence to identify the top few loan applicants,
    for example, 20–50 individuals. Then the bank employees would be able to cover
    all the details of these top applicants to provide them with bank loans.


    The same thing has been true about hiring employees by several companies. This
    is due to the fact that many companies have a number of human resources department
    that would be able to analyze and make reasonable decisions about hiring only
    a few employees each day, week, or month. When some of these companies generate
    advertisements to hire 10 or 20 new employees, sometimes a very large number of
    people may apply for such employment. This was the reason that some companies
    purchased models developed through Artificial Intelligence to identify the top
    few employee applicants so that the company’s human resources employees could
    analyze and make reasonable decisions about hiring the individuals who had applied
    for the jobs that had been advertised.


    Several companies in the past decade have developed Artificial Intelligence models
    that could have helped banks decide and make decisions about whom to provide the
    loans and companies decide and make decisions about who to hire. Banks use AI
    models to minimize the number of loan applicants, so bank employees must evaluate
    their characteristics in much more detail. Also, companies use AI-based models
    to evaluate the large number of applicants that have applied for employment based
    on the company’s job advertisement and then significantly reduce the number of
    applicants that the actual human resources professionals must concentrate on.
    Originally, in the past decade, the way Artificial Intelligence has been used
    by banks and companies to provide loans or hire individuals has made AI-Ethics
    an incredibly important topic to understood. These are only two examples of many
    similar things that happened during the last decade.


    AI-Ethics is also incredibly important to scientists and engineers who have become
    enthusiasts of using this technology for solving science- and engineering-related
    problems. In the past several years, AI-Ethics has become an important topic in
    the application of Artificial Intelligence in many non-scientific- and non-engineering-related
    items. This chapter will cover and explain the importance of AI-Ethics in the
    science and engineering applications of this technology. To clarify the science-
    and engineering-related AI-Ethics, some examples will also be presented in this
    chapter.


    When there is a lack of understanding of AI-Ethics by scientists and engineers
    that their effort is to solve physics-based problems using Artificial Intelligence,
    certain types of problems are created (intentionally or un-intentionally). The
    main reason for creating such problems has to do with not paying attention to
    their understanding of AI-Ethics. Without giving full attention to AI-Ethics,
    many problems are created through the application of Artificial Intelligence to
    solve science- and engineering-related problems. The impacts of AI-Ethics in such
    situations usually have to do with


    1.  lack of scientific understanding of Artificial Intelligence,


    2.  lack of success in realistic problem solving of physics-based issues through
    science and engineering application of Artificial Intelligence, or


    3.  incorporation of traditional engineering biases (assumptions, interpretations,
    simplifications, and preconceived notions) into the AI-based models of physical
    phenomena.


    Currently, some individuals and companies that claim they use engineering applications
    of Artificial Intelligence are including a large amount of human bias in problem
    solving so that they can solve problems using machine learning algorithms after
    they fail to build an AI-based model that is based on facts, reality, and actual
    data and does not include human biases. Human biases in engineering have much
    to do with how mathematical equations are built to solve physics-based problems.


    ## Data is the Foundation of AI-based Modeling


    Artificial Intelligence uses machine learning algorithms to develop tools and
    models to accomplish its objectives. The development of Artificial Intelligence
    models has a lot to do with “Data”. The quality and quantity of the data have
    a major impact on how the AI-based model will behave. As mentioned in the last
    section of this chapter, banks have started using Artificial Intelligence models
    to make the first step in the decision-making about giving loans to applicants.
    The AI models are usually developed using historical data provided by the loan
    applicants along with previous results of loan payments. The amount of positive
    and negative loan payments as well as the input data from the loan applicants,
    such as gender, ethnicity, credit, living location, income, etc., will determine
    the quality of the AI-based model that is developed for the bank loan. Such models
    can also include certain characteristics determined by the bank’s management.'
