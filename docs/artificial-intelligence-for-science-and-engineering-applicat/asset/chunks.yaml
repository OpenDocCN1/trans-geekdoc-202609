    通用人工智能技术已用于人脸、物体和语音识别，以及自动驾驶车辆、人类对话和大语言模型（`LLM`）。显而易见，“人类大脑”不需要任何基于物理的领域专业知识（通过上学校和大学学习）就能解决非物理类的问题。在街道上识别人脸、声音或不同的目标（如汽车、公交车、卡车、自行车、行人等），或者学会如何开车和进行语言对话，除了人类大脑中的通用智能之外，不需要任何其他东西。虽然已经明确并提到，目前开发的许多出的
    AI 技术是基于通用智能的，但同样非常重要的一点是，本书并未声称这些通用人工智能技术是简单且易于开发的。


    需要特别注意的是，开发通用人工智能技术并不容易或简单，因为它们正在模拟“人类通用智能”，而这种智能并不需要科学和工程专业知识。事实是，绝大多数通用人工智能技术在开发过程中非常复杂，它们的扩展需要
    `Artificial Intelligence` 领域极其惊人的专业知识。然而，另一个事实是，当这些基于 AI 的专家在创建通用人工智能技术时，这些技术并不能为特定的物理现象生成模型，而在过去的几个世纪里，这些现象是通过数学方程完成的。这些物理现象的数学方程随后根据建模这些物理现象的数学方程的复杂性，通过解析解或数值解来求解。显而易见，智人身上发生的许多重要问题只需要“人类通用智能”。因此，成为“人工智能”专家以能够开发“通用人工智能”模型是至关重要的。


    近期的技术如“ChatGPT”、“GPT-4”、“Google Bard”……等都是“通用人工智能”的一部分，注意“人工智能”的重要性至关重要。然而，这并不意味着这些“通用人工智能”技术能够通过对物理现象建模来解决与科学和工程相关的问题。


    ## 物理领域专业知识如何用于基于 AI 的物理建模


    本章将包含的主要问题之一是必须如何物理领域专业知识来开发基于物理的人工智能模型。首先，必须提到：(A) 基于物理的人工智能模型与工程师和科学家对物理现象的传统建模大不相同；(B)
    与工程师和科学家的传统物理建模相比，基于物理的人工智能模型开发速度更快，运行速度更快；(C) 基于物理的人工智能模型将比工程师和科学家的传统物理建模提供更好、更真实的的结果。首先，将在上述提到的三项内容的背景下讨论物理领域专业知识。一旦涵盖了传统物理建模与基于
    AI 的物理建模之间的区别，将涵盖如何使用领域专业知识利用人工智能开发科学和工程相关的模型。


    ### 基于物理的 AI 模型与传统物理建模的区别


    众所周知，传统的基于物理的模型是使用数学方程完成的。已经提到，科学家和工程师会识别涉及物理现象的变量和参数，然后将它们放入数学方程中进行建模。当使用人工智能来开发基于物理的模型时，一切都是基于实际数据的。这就是它也被称为数据驱动、数据科学和数据分析的主要原因。然而，这项内容最重要的一点是，目前许多科学家和工程师尚未正确使用它。使用人工智能开发基于物理模型的最重要的一点是：**仅**使用“实际数据测量”进行基于
    AI 的模型开发，而不是包含使用数学方程生成的数据。关于此项的更多细节将在本书的第 6 章中介绍。


    目前大量科学家和工程师正在解决的主要问题之一，是将通过数学方程生成的数据与部分“实际数据测量”相结合，以便人工智能开发基于物理的模型。问题可能是：“为什么大量的科学家和工程师将数学生成的数据添加到实际数据测量中以构建物理现象的
    AI 模型？”


    询问他们为什么这样做会很有趣。在我看来，必须首先提出的有趣问题是：“你们是否仅使用实际数据测量成功构建了物理现象的 AI 模型？”如果他们的答案是“是”，那么他们为什么要添加从数学方程生成的数据来构建模型呢？事实是，他们之所以使用从数学方程生成的数据并结合实际数据测量来构建物理现象的
    AI 模型，是因为他们从未通过人工智能利用实际测量数据开发出合理的模型和解决方案。“混合建模”的定义是指无法利用人工智能的真实特征开发物理现象的模型和解决方案，或者完全不理解“人工智能”的含义。


    ### 与传统物理建模相比，基于物理的 AI 模型开发更快


    这是一个非常已知的问题，物理现象的复杂性会导致建模它们的数学方程也变得复杂。此外，另一个众所周知的事实是，高度复杂的数学方程无法通过解析解简单快速求解。这就是约翰·冯·诺曼和斯坦尼斯斯拉夫·乌拉姆在
    1946 年创建数值模拟的原因。在很大程度上，数值模拟略微修改（简化）了物理现象的特征，以便生成数学方程的解。


    这一过程是通过将物理现象的特征划分为许多空间（数百万个单元格）和许多时间步来完成的。鉴于生成数值模拟的解需要大量的单元格和时间步，并且在完成完成后，为了生成关于需要做什么来增强物理现象行为的完整理解，即使使用大量计算机进行求解，总是需要很长时间。


