- fmt: 'Since I am a petroleum engineering scientist, I provide examples related to
    petroleum engineering as well and try to explain them in the best fashion to make
    sense to all scientists and engineers. In the past decade, the overwhelming majority
    of hydrocarbon (oil and gas) production in the United States of America has been
    produced from shale reservoirs. Shale is known as an unconventional reservoir
    since it is very different from conventional reservoirs such as sandstone and
    carbonate reservoirs. All the reservoir technologies were originally developed
    for conventional reservoirs, but now the conventional technologies are being used
    for unconventional reservoirs such as Shale. This provides far more assumptions,
    simplifications, and interpretations for dealing with Shale reservoirs when compared
    with conventional reservoirs. This is an important example of including biases
    when some people, vendors, and service companies claim that they are using Artificial
    Intelligence to solve shale-related problems when they use even conventional mathematical
    equations to generate data that they use to generate models using machine learning
    algorithms.


    It is important to note that some part of the reservoir rock is usually brought
    to the surface, and it is tested and analyzed in the laboratory to help scientists
    and engineers develop an understanding of the complexity of the physics of fluid
    flow in the porous media deep underground. However, realistic facts about such
    analyses must not be overlooked. While hydrocarbon reservoirs have approximate
    volumes of hundreds of millions to tens of billions of cubic feet, the part of
    the rock that is brought to the laboratory for observation and testing is usually
    less than a few cubic feet. This provides information about what percent of the
    reservoir will be viewed and tested. Furthermore, it is a well-known fact that
    hydrocarbon reservoirs are highly heterogeneous, which means what is analyzed
    in the laboratory over a few square inches of rock is not realistically representing
    what happens throughout the entire reservoir rock.


    Therefore, while laboratory core analysis is an important and useful process for
    understanding the fluid flow in the hydrocarbon reservoir, it cannot realistically
    represent all the details and the heterogeneity that happen throughout the tens
    of billions of cubic feet of the hydrocarbon reservoir, which is hundreds or thousands
    of feet under the ground. This clarifies the existence of assumptions, interpretations,
    and simplifications in the mathematical equations that are used to model the fluid
    flow in porous media. Furthermore, when the hydrocarbon reservoir is unconventional,
    such as shale plays, which are currently the main source of hydrocarbon production
    in the United States, the problem mentioned above becomes orders of magnitude
    more complex and even more important.


    The number of assumptions, interpretations, simplifications, preconceived notions,
    and biases in modeling the physics of completion, hydraulic fracturing, and fluid
    flow in shale plays is so extensive that the mathematical modeling for completion
    and production optimization from shale wells is completely unrealistic, useless,
    and full of bias. This is due to the fact that historical details for understanding
    the physics of fluid flow in hydrocarbon reservoirs are mainly applicable to conventional
    plays. This technology that has been developed for conventional reservoirs has
    been extrapolated to unconventional reservoirs starting a decade ago.


    It is a clear fact that the mathematical equations that are used to model the
    physics of hydrocarbon production from shale wells are overwhelmed by assumptions
    and hardly have anything to do with facts and realities since the main essence
    of this technology is mainly applicable to the conventional reservoir and not
    to the unconventional reservoir. It is hard to find any real scientists and professional
    engineers (including those that have developed and are using these techniques)
    to claim that the current version of mathematical modeling of hydraulic fracturing
    of shale wells has anything to do with reality.


    These facts prove that using Artificial Intelligence for the development of so-called
    “hybrid models” is full of assumptions, interpretations, and biases and has nothing
    to do with the reality of science and engineering applications of Artificial Intelligence.
    When such mathematical equations are used to generate data and then combine such
    data with actual field developments to build so-called “hybrid models”, such models
    can be forced to generate the type of outputs and results that are pre-determined
    by those that develop them. It removes the actual and real characteristics of
    Artificial Intelligence that are capable of modeling physics based on reality
    rather than based on guesswork and biases. This is a good example of how AI-Ethics
    must be addressed in the science and engineering applications of this technology.


    It is a well-known fact that when hydraulic fracturing is performed on unconventional
    reservoirs that are naturally fractured (such as shale), the results are quite
    different from what happens when hydraulic fracturing is performed on conventional
    reservoirs (sandstones). In shale, due to the existence of complex natural fractures,
    hydraulic fracture creates a “network of fractures” (as shown in [Figures 6.11](#C_009_c6.xhtml#f6_11)
    and [6.12](#C_009_c6.xhtml#f6_12)), not an elliptical hydraulic fracture (as shown
    in [Figure 6.2](#C_009_c6.xhtml#f6_2) for conventional reservoirs).


    ![FIGURE 6.11 Hydraulic fracturing of naturally fractured reservoirs cannot be
    modeled based on real measurements since there is no way to identify the distribution
    of natural fractures thousands of feet under the ground.](images/Fig06_11.jpg)


    [FIGURE 6.11](#C_009_c6.xhtml#f6_11b) Hydraulic fracturing of naturally fractured
    reservoirs cannot be modeled based on real measurements since there is no way
    to identify the distribution of natural fractures thousands of feet under the
    ground.


    ![FIGURE 6.12 Hydraulic fracture network in a naturally fractured reservoir.](images/Fig06_12.jpg)


    [FIGURE 6.12](#C_009_c6.xhtml#f6_12b) Hydraulic fracture network in a naturally
    fractured reservoir.


    As shown in [Figures 6.11](#C_009_c6.xhtml#f6_11) and [6.12](#C_009_c6.xhtml#f6_12),
    when liquid (water) is injected in an unconventional reservoir for hydraulic fracturing
    purposes, prior to the injection of the proppant, it starts to fracture the formation.
    As the formation starts fracturing, the continuation of the fracture will go through
    the least resistant pathways in the rock. In a naturally fractured reservoir,
    the least resistant pathway is the network of the natural fractures, while the
    actual fabric of the rock (that has not been naturally fractured millions of years
    ago) has more resistance. Therefore, hydraulic fracturing of unconventional resources
    such as shale that are naturally fractured reservoirs creates highly complex networks
    of natural fractures that cannot be modeled in detail. This is due to the fact
    that the shape, characteristics, and details of the natural fracture of the rock
    (shale) cannot be observed or measured throughout the reservoir. The highly complex
    shape of the hydraulic fracture network in the unconventional reservoir is a function
    of heterogeneity and the natural fracture network.'
