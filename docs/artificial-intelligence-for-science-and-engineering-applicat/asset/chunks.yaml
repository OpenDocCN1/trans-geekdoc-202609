    [**FIGURE 3.15**](#C_006_c3.xhtml#f3_15b) Later, engineering domain experts were
    trying to model and solve Artificial Engineering Intelligence problems without
    having expertise in Artificial Intelligence and the results are still not good
    at all.


    ![FIGURE 3.16 Pendulum swing of engineering application of Artificial Intelligence.](images/Fig03_16.jpg)


    [**FIGURE 3.16**](#C_006_c3.xhtml#f3_16b) Pendulum swing of engineering application
    of Artificial Intelligence.


    Expertise in science and engineering does not refer to the inclusion of the mathematical
    equations that have been developed for the specific physical phenomenon that is
    being solved using Artificial Intelligence. Rather, the most important expertise
    in science and engineering is the understanding of the acts and performances of
    a specific physical phenomenon. The expertise will include intelligence about
    the worst things that are negative about this specific physical phenomenon and
    the best things that are possibly positive about this specific physical phenomenon.
    The actual experience of interacting with such specific physical phenomena is
    the most important part of the expertise mentioned here.


    Such expertise will be used to identify the best actual (measured) data that must
    be used as input to the machine learning algorithms and to “Generate” new “Features”
    from the actual data that has been measured and provided to solve this specific
    physical phenomenon. This is the way that science and engineering expertise are
    used to *Teach* the reality to machine *Learning* algorithms through *Data*. In
    Machine Learning, teaching cannot be done through speaking, typing, assuming that
    the algorithm knows math and physics, etc. The only way to be able to *Teach*
    the Machines so that they can *Learn* is by using the actual measured *Data* that
    is provided to solve the physical phenomenon using Artificial Intelligence.


    Please note that when it is mentioned “Feature Generation”, it does not mean that
    any mathematical equations should be used to generate new data. This specific
    type of “Feature Generation” is used to “Teach” the Machine Learning Algorithm
    about the specific physical phenomenon that is being addressed using the existing
    actual (measured) data. This means that the actual measured data that is provided
    for this specific physical phenomenon should be used to generate new series of
    data based on our science and engineering applications.


    What is incredibly important about the science and engineering expertise is the
    strong knowledge about the problem that is being addressed while having an open
    mind about the innovative approaches for generating the solutions. Unfortunately,
    I have experienced some experts in certain science and engineering topics who
    do not believe it is possible to do anything else other than what they have been
    doing for decades to solve a specific type of problem. Such individuals seem to
    have a religious mind about the technology that they have already learned and
    worked with for several years and do not believe that anything else could possibly
    be provided to enhance the solutions to the same problems that they have been
    dealing with.


    ## Expertise in Artificial Intelligence


    The traditional approach to modeling physical phenomena using science and engineering
    that has been done in the past few centuries is through mathematical equations.
    This causes a lot of scientists and engineers to think that all they need to become
    experts in Artificial Intelligence is to know the details of the mathematical
    equations about machine learning algorithms that are used to generate Artificial
    Intelligence. The fact is that having good and detailed information about the
    mathematical equations of machine learning algorithms does not mean that it makes
    scientists and engineers experts in Artificial intelligence.


    It is a well-known fact that a good amount of time (several years) has been required
    for you to become an expert in science or engineering. Then, why would you think
    that the same amount of time, studying, researching, and experience is not required
    for you to become an expert in Artificial Intelligence? I am sure that what has
    been shown in [Figure 3.17](#C_006_c3.xhtml#f3_17) makes absolutely no sense.
    Actually, the fact is that no one and no company has ever done the type of marketing
    that I have done, as shown in [Figure 3.17](#C_006_c3.xhtml#f3_17). The reason
    I have made this figure ([Figure 3.17](#C_006_c3.xhtml#f3_17)) is to demonstrate
    how unrealistic such marketing can possibly be. And, as I have already mentioned,
    no one has ever done such marketing. However, the reason [Figure 3.17](#C_006_c3.xhtml#f3_17)
    was made up was to have the same understanding and lack of belief as what is shown
    in [Figure 3.18](#C_006_c3.xhtml#f3_18).'
