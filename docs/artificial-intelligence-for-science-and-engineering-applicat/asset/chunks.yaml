    In another interesting article, it is mentioned that “Collecting the data; There
    are two main ways that bias shows up in training data: either the data you collect
    is unrepresentative of reality, or it reflects existing prejudices. The first
    case might occur, for example, if a deep-learning algorithm is fed more photos
    of light-skinned faces than dark-skinned faces. The resulting face recognition
    system would inevitably be worse at recognizing darker-skinned faces. The second
    case is precisely what happened when Amazon discovered that its internal recruiting
    tool was dismissing female candidates. Because it was trained on historical hiring
    decisions that favored men over women, it learned to do the same” [[22](#Z_011_references.xhtml#r22)].
    What has been mentioned in this article are the results of research that was done
    to learn how bias can be included in the model. This is so true and very important
    for both engineering and non-engineering applications of AI and machine learning.
    In this chapter, it will be shown how similar activities take place in the engineering
    application of AI, and it will be explained in the next section what bias is when
    AI is used to model physical phenomena.


    By doing some serious research on the fundamentals of Artificial Intelligence
    and machine learning algorithms, it becomes quite clear that this technology has
    an incredibly strong power to discover patterns in the data that is used to train
    and develop models, make predictions, and help with decision-making. Since what
    Artificial Intelligence and machine learning algorithms do is all about data,
    it also becomes clear that as long as the data that is provided to them is generated
    based on biases, interpretations, and assumptions, the models and workflows that
    this technology develops become representative of such biases, interpretations,
    and assumptions.


    ## Application of AI-Ethics in Science and Engineering


    Given the experience of how Artificial Intelligence was used in many situations
    that created racism and sexism, it is quite clear that it is quite possible to
    control the behavior of the Artificial Intelligence-related models and systems.
    Since this has been proven in general intelligence-related situations, many scientists
    and engineers think it has nothing to do with modeling physical phenomena. Actually,
    an overwhelming number of scientists and engineers that have become interested
    in Artificial Intelligence never pay any attention to AI-Ethics because they believe
    that such issues are not applicable to science and engineering. This is not true.
    When any scientist or engineer comes to such a conclusion, it means that they
    have very little understanding of Artificial Intelligence. While racism and sexism
    are not applicable to science and engineering (the application is not working
    in the industries), they are the results of “Bias” that are included in the data
    that is used to build the models and systems using Artificial Intelligence. In
    such cases, AI-Ethics is completely applicable to science and engineering for
    creating certain types of biases to control Artificial Intelligence-based models
    and systems.


    AI-Ethics is important to engineers and scientists who have become enthusiasts
    of using this technology for solving engineering-related problems. While in the
    past several years AI-Ethics has become an important topic in the non-engineering
    application of Artificial Intelligence and machine learning, now it is just as
    important in the science and engineering application of this technology. Examples
    of AI-Ethics in the engineering application of AI and machine learning are presented
    in this chapter, showing how guesswork, assumptions, interpretations, and simplifications
    can help traditional engineers use AI and machine learning algorithms to generate
    an unrealistic and highly biased predictive model.


    This usually happens when they are not successful in using the actual field measurements
    for building AI-based models of physical phenomena. What they do not realize is
    their lack of understanding and realistic knowledge of Artificial Intelligence.
    Therefore, to make their claim of building AI-based modeling work (usually they
    call it “Hybrid Models”, or “Physics-Based AI Model”) they start combining data
    generated from mathematical equations with actual field measurements. What they
    do not realize (or do realize but do not mention it to those they make the model
    for) is that the data generated from mathematical equations already includes correlations
    and patterns between all the variables and parameters that have been used in the
    mathematical equations. Since the major characteristics of the machine learning
    algorithms for Artificial Intelligence try to perform pattern recognition, the
    patterns on the data that are generated by the mathematical equations tell the
    machine learning algorithm what to do.


    It seems that the reasons behind the inclusion of such biases in the engineering
    application of Artificial Intelligence have much to do with the lack of scientific
    understanding of how Artificial Intelligence must be used to model physical phenomena.
    Details of how to model physical phenomena using Artificial Intelligence are covered
    in [Chapter 4](#C_007_c4.xhtml) of this book. Currently, a large number of individuals
    and companies that claim they are using Artificial Intelligence to solve science-
    and engineering-related problems are including a large amount of human bias in
    their technology to be able to generate solutions. The main reason for such an
    approach is the fact that they fail to use actual measurements (real data) to
    build AI-based models of physical phenomena that do not include human biases.
    Human biases in engineering have much to do with how mathematical equations are
    built to solve physics-based problems.


    The major contribution of Artificial Intelligence and machine learning to science
    and engineering is problem solving and modeling physical phenomena based on actual
    measured data, which would be the main core behind the avoidance of biases, assumptions,
    interpretations, and preconceived notions about physics. Since traditional techniques
    for modeling physical phenomena are through mathematical equations, they usually
    include assumptions and sometimes provide the opportunity to include biases. This
    is very true when the physical phenomena that are being modeled cannot be seen,
    looked at, or even touched, such as petroleum engineering, which is a good example
    of such a situation since the produced hydrocarbon is a deeply underground fluid.
    The same is true about any other engineering discipline when mathematical equations
    that include assumptions, interpretations, and simplification are used to model
    the physical phenomena.


    Reservoir engineering, reservoir modeling, and reservoir management overwhelmingly
    contribute to most of the income of the operating and service companies in the
    oil and gas industry. This shows why reservoir modeling is a very important technology
    in the petroleum industry. Currently, the same is true about climate change when
    CO[2] is stored in geological formations. It is a fact that modeling fluid flow
    in hydrocarbon reservoirs includes serious amounts of assumptions, interpretations,
    and simplifications since they are hundreds or thousands of feet below the surface.
    This means that it has been impossible to observe, touch, or realistically test
    anything that takes place in a hydrocarbon reservoir. In this section, let’s see
    how AI-Ethics is being significantly navigated in petroleum engineering by those
    that claim to be using Artificial Intelligence.

