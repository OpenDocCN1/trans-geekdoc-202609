    be able to read it completely and then notice that it was not written correctly.](images/Fig04_05.jpg)


    ### [FIGURE 4.5](#C_007_c4.xhtml#f4_5b) Please read this paragraph. As you can
    see, this paragraph includes a total of 67 words. Out of the 67 words, 4 are single
    letter, 16 are two letters, 13 are three letters, and 34 are more than three letters.
    Most likely, you will be able to read it completely and then notice that it was
    not written correctly.


    I am sure that you have already seen the paragraph that is shown in [Figure 4.5](#C_007_c4.xhtml#f4_5).
    I am also sure that you were able to read that paragraph and fully understand
    what the topic was about. Most probably somewhere in the middle of reading this
    paragraph, you have noted that something is quite wrong with it, and you then
    noted that a large number of words that you were reading and understanding were
    not written correctly. The correct version of the same paragraph is shown in [Figure
    4.6](#C_007_c4.xhtml#f4_6). All the red-colored words in [Figure 4.6](#C_007_c4.xhtml#f4_6)
    were the words that were incorrectly written in the paragraph in [Figure 4.5](#C_007_c4.xhtml#f4_5).
    Nevertheless, the human brain, which could have read these words, had very little
    trouble understanding the entire paragraph.


    ![FIGURE 4.6 This is the same paragraph that was shown in Figure 4.5. This is
    a correctly typed paragraph. You can note that 97% of the words that are more
    than three letters have been incorrectly typed, but you (most probably) had very
    few issues correctly reading and understanding this paragraph.](images/Fig04_06.jpg)


    ### [FIGURE 4.6](#C_007_c4.xhtml#f4_6b) This is the same paragraph that was shown
    in [Figure 4.5](#C_007_c4.xhtml#f4_5). This is a correctly typed paragraph. You
    can note that 97% of the words that are more than three letters have been incorrectly
    typed, but you (most probably) had very few issues correctly reading and understanding
    this paragraph.


    When engineers mention items such as “Actual measured data are never 100% accurate
    …” I usually provide them with the paragraph that is shown in [Figure 4.5](#C_007_c4.xhtml#f4_5),
    and then I ask them if they understand what the paragraph is mentioning. The fact
    is that usually 99.999% of all people are able to read the paragraph shown in
    [Figure 4.5](#C_007_c4.xhtml#f4_5) and also identify that a large number of words
    in this paragraph are not correctly printed. This means that the human brain is
    able to understand and deal correctly with “actual data that are never 100% accurate
    …” and since Artificial Intelligence simulates natural intelligence through mimicking
    the human brain, it is also able to handle some of the inaccuracies associated
    with actual data.


    When Artificial Intelligence is used to model and/or solve physical phenomena,
    its actual data should be presented to the machine learning algorithm in a fashion
    that represents physics. Those individuals and/or companies that have come to
    the following three conclusions can be trusted to be able to enhance their objectives
    using Artificial Intelligence:


    1. Domain expertise is a requirement for the engineering application of Artificial
    Intelligence and Machine Learning,

    2. The development of comprehensive AI-based models for engineering-related problems
    requires `ONLY` actual data (actual measured data), and

    3. There is no need to include any mathematical formulation of physics in this
    process or add data that is generated through mathematical equations.


    Those individuals and/or companies that are including the following items in the
    work that they call “Data-Driven”, or, “Machine Learning”, or even “Artificial
    Intelligence” (lots of them usually do not directly call it Artificial Intelligence),
    cannot be trusted to be able to enhance their objectives using Artificial Intelligence:


    1. They do not understand or have not come to the conclusion that the engineering
    application of Artificial Intelligence is different from the non-engineering (general)
    application of this technology.

    2. They have failed to develop comprehensive and explainable “AI-based Models”
    for engineering-related problems using `ONLY` actual data (actual measured data)
    unless additional data is generated through mathematical equations.


    Data should be presented to the Machine Learning algorithm in a fashion that represents
    the physical phenomena that are supposed to be modeled through Artificial Intelligence.


    # 5 Artificial Intelligence versus Traditional Statistics


    DOI: [10.1201/9781003369356-6](https://doi.org/10.1201/9781003369356-6)


    Since both Artificial Intelligence and Traditional Statistics use data to generate
    their solutions, it does not mean that they are doing the same thing. The fact
    is that what they both do is quite different from each other. The current version
    of Artificial Intelligence, which was developed less than 30 years ago, has generated
    the types of solutions that have made it the most interesting technology. However,
    Traditional Statistics, which has been using data to develop models and generate
    solutions, was developed more than 350 years ago. Therefore, using Traditional
    Statistics approaches as “Machine Learning” to perform what is called Artificial
    Intelligence has nothing to do with reality, as will be explained in this chapter.
    Nevertheless, many current scientists and engineers that have worked with Traditional
    Statistics in the past several years and now have a good experience with it continue
    to use, and instead of calling it Traditional Statistics, they now call it Artificial
    Intelligence and Machine Learning since they are using data.


    Some people may wonder why this book includes a chapter about the differences
    between Artificial Intelligence and Traditional Statistics. The reason has to
    do with the fact that there are many engineers in academia and industry who believe
    these technologies are very much the same because both deal with “Data”. When
    they refer to “Data Analytics”, they mostly refer to linear, non-linear, or multivariate
    regression and try to treat them as a new technology. Many times, people who either
    intentionally or unintentionally make such mistakes also try to refer to these
    traditional and old technologies as something that is quite new in their industry.


    What they seem to forget is that the use of Traditional Statistical approaches
    in engineering-related industries dates back to the early 1960s. A good example
    is the use of Traditional Statistical in petroleum industry. Arp’s Decline Curve
    Analysis in petroleum engineering is a good example of statistical regression.
    Capacitance-Resistance Modeling (CRM) is another example of using traditional
    statistical analysis in petroleum engineering to analyze production data. Similar
    techniques have also been developed in many other engineering technologies. The
    initial use of geo-statistics in the mining industry, which was later incorporated
    into numerical reservoir (geological) modeling, dates back to the early 1950s.
    Therefore, as far as the application of Traditional Statistics in the science
    and engineering industries is concerned, there is nothing new about this technology.

