    attacks. Such a correlation has absolutely nothing to do with causation.](images/Fig07_02.jpg)


    [**FIGURE 7.2**](#C_010_c7.xhtml#f7_2b) In the recent 12 months, ice cream sales
    correlate with shark attacks. Such a correlation has absolutely nothing to do
    with causation.


    ## Explaining Traditional Engineering Models


    It is a well-known fact that models of physical phenomena that are generated through
    mathematical equations can be explained. This is one of the main reasons behind
    the expectation of engineers and scientists that any potential model of the physical
    phenomena should be explainable. The explainability of the traditional models
    of physical phenomena is achieved through the solutions of the mathematical equations
    that are used to develop the models. Explanation of such models is achieved through
    analytical solutions for reasonably simple mathematical equations or numerical
    solutions for complex mathematical equations. Solutions to the mathematical equations
    provide opportunities to get answers to almost any questions that might be asked
    from the model of the physical phenomena.


    Solutions to the mathematical equations are used to explain why and how certain
    results are generated by the model. It allows examination and explanation of the
    influence and impact of all the involved parameters (variables) on each other
    and on the model’s results (output parameters). In general, this is the definition
    of the engineering approach to problem-solving. Therefore, the results of physical
    phenomena that are based on mathematical equations (no matter how simple or complex)
    can be explained in detail.


    [Figure 7.3](#C_010_c7.xhtml#f7_3) shows the Fetkovich “Type Curve”. Including
    early time (driving from transient flow equations) and late time curves (boundary-dominated
    flow, Arp’s Decline Curves). The equations that have been used for this series
    of “Type Curves” are also provided in Equations 7.1 and 7.2, right after [Figure
    7.3](#C_010_c7.xhtml#f7_3).


    ![FIGURE 7.3 Fetkovich Type Curves.](images/Fig07_03.jpg)


    [**FIGURE 7.3**](#C_010_c7.xhtml#f7_3b) Fetkovich Type Curves.


    $q\_{Dd} = q\_{D}\\left\\lbrack \\ln{\\left( \\frac{r\_{e}}{r\_{wa}} \\right)
    - \\frac{1}{2}} \\right\\rbrack$ (7.1)


    $t\_{Dd} = \\frac{t\_{D}}{\\frac{1}{2}\\left\\lbrack \\left( \\frac{r\_{e}}{r\_{wa}}
    \\right)^{2} - 1 \\right\\rbrack\\left\\lbrack \\ln\\left( \\frac{r\_{e}}{r\_{wa}}
    \\right) - \\frac{1}{2} \\right\\rbrack}$ (7.2)


    Dimensionless rate (q[D]) and time (t[D]) are used in *Equations 7.1* and *7.2*
    and are defined as shown below (*Equations 7.3* and *7.4*) in the context of the
    well-testing domain:


    $q\_{D} = \\frac{141.2\\ q\\mu B}{kh\\left( p\_{i} - p\_{wf} \\right)}$ (7.3)


    $t\_{D} = \\frac{0.00633\\ k\\ t}{\\varnothing\\ \\mu C\_{t}\\ r\_{w}^{2}}$ (7.4)


    It can be clearly seen that the curves in [Figure 7.3](#C_010_c7.xhtml#f7_3) are
    very “well-behaved” (continuous, non-linear, certain shape that changes in a similar
    fashion from curve to curve). The reason behind the “well-behaved” characteristics
    of these curves is the mathematical equations that were used to generate them.
    All “Type Curves” that have been historically generated in the petroleum industry
    are very “well-behaved” because they are all developed using the solutions of
    the mathematical equations. [Figure 7.4](#C_010_c7.xhtml#f7_4) demonstrates two
    more examples of such “well-behaved” “Type Curves”.


    ![FIGURE 7.4 Examples of Type Curves.](images/Fig07_04.jpg)


    [**FIGURE 7.4**](#C_010_c7.xhtml#f7_4b) Examples of Type Curves.


    This means that traditional physical phenomenon models that have been developed
    using mathematical equations are “explainable”. Physical phenomena that are developed
    using mathematical equations are “explainable” through several types of analyses
    of the mathematical equations. Here are four ways of explaining physical phenomenon
    models that are developed and solved using mathematical equations:


    1.  Identification of the influence of each parameter (variable) in the mathematical
    equation, also known as Key Performance Indicators (KPIs),


    2.  Single-Parameter Sensitivity Analysis,


    3.  Multiple-Parameter Sensitivity Analysis, and


    4.  “Type Curve” Generation.


    The performance of such analyses can provide the required explanation of any question
    that might be asked regarding why and how certain outcomes are generated, or certain
    forecasts and predictions are made based on the solutions of the mathematical
    equations that have been used to model the physical phenomena. [Figures 7.3](#C_010_c7.xhtml#f7_3)
    and [7.4](#C_010_c7.xhtml#f7_4) demonstrate examples of “Type Curves” that are
    generated through the solutions of certain mathematical equations.


    ## Explaining Models of Physics Developed by Artificial Intelligence (XAI)


    In a recent article that was published at Forbes \[[23](#Z_011_references.xhtml#r23)\],
    it was mentioned:


    “Many of the algorithms used for machine learning are not able to be examined
    after the fact to understand specifically how and why a decision has been made.
    This is especially true of the most popular algorithms currently in use – specifically,
    deep learning neural network approaches. XAI is an emerging field in machine learning
    that aims to address how black-box decisions of AI systems are made. So far, there
    is only early, nascent research and work in the area of making deep learning approaches
    to machine learning explainable”.


    This article was written on July 23, 2019. It demonstrates that systems and models
    mimicking human-level intelligence (non-engineering-related problems) that have
    been developed using Artificial Intelligence and Machine Learning have major issues
    with explaining how this technology predicts, forecasts, or makes decisions. The
    types of applications of Artificial Intelligence and Machine Learning that are
    referenced in this article, as well as many other recent articles about XAI, are
    mainly related to the application of this technology to non-engineering-related
    problems. When it comes to the engineering application of Artificial Intelligence
    and Machine Learning, “how and why a decision has been made” becomes far more
    important than when this technology is used for non-engineering-related problems.
    Therefore, what today is being called XAI has been a major issue since this technology
    started to be used in engineering in the early 1990s.


    It is interesting to note that explainable predictive models developed using Artificial
    Intelligence and Machine Learning were developed by a technical company named
    “Intelligent Solutions, Inc.”.


    The main reason behind calling the predictive models that are generated using
    Artificial Intelligence and Machine Learning algorithms “Black Box”, has to do
    with the fact that these algorithms do not model physical phenomena using mathematical
    equations. When it comes to the engineering application of Artificial Intelligence
    and Machine Learning, the “Black Box” characteristics of such models will cause
    serious problems for scientists and engineers. Many traditional engineers who
    have a negative view of this new technology usually use the term “Black Box” to
    deny the contribution of this technology to the future of engineering problem-solving.'
