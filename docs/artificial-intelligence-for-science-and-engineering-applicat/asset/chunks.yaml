    # Historical Context


    Developed in the Middle Ages, Aristotelian logic is a classical two-valued logic
    (either True or False, Yes or No, 0 or 1, …). After the removal of data-driven
    model development from the original “Artificial Intelligence” for several decades,
    rule-based “Expert Systems” became the sole focus of research and development
    in the field of original “Artificial intelligence”. Being only based on rule-based
    “Expert Systems”, original “Artificial intelligence” ended up being quite limited
    in solution development, and no major issues or problems were solved in such a
    fashion that a large number of people would be exposed to it and find it interesting
    to work with this technology.


    In this context, the original version of Artificial Intelligence that was purely
    based on rule-based “Expert Systems” ended up not being a new technical revolution,
    being highly used, and having the capability to solve many problems that could
    not have been solved in any other way. From this point of view, the original version
    of Artificial Intelligence was not a great and interesting topic. This was the
    main reason behind the fact that when in 1986 the new Artificial Neural Network,
    such as Machine Learning algorithms, were developed and became able to solve both
    linear and non-linear related problems, the enhancement of this original technology
    was no longer called “Artificial Intelligence”.


    These new series of Machine Learning algorithms that were enhancing the original
    “Artificial Intelligence” and making it a data-driven technology ended up having
    multiple different names, such as “Computational Intelligence”, “Virtual Intelligence”,
    “Soft Computing”, “Intelligent Systems”, … The key was that because the term “Artificial
    Intelligence” was not generating and developing any positive and enhanced technologies
    and interesting problem-solving due to the use of rule-based “Expert Systems”,
    it would no longer be used as the term for data-driven model development and major
    solutions.


    ## The Evolution of Neural Networks


    In 1986, the original version of the Artificial Neural Networks that was proven
    not to be able to solve “non-linear” problems was changed through an algorithm
    called “Back Propagation”. This new algorithm changed all the characteristics
    of the original version of the Artificial Neural Networks (Perceptron). First
    and foremost, the new version of Artificial Neural Networks would not only have
    two layers, such as “Input” and “Output”. As presented in [Figure 2.6](#C_005_c2.xhtml#f2_6),
    this new version of Artificial Neural Networks would include at least one or even
    more layers of neurons between the two “Input” and “Output” layers. This new layer
    (Layers) was called the “Hidden Layer” since it would not require any data from
    the “Input” or “Output” layers. This new “Hidden Layer” that was included in the
    new version of the Artificial Neural Networks would include several hidden neurons
    that were usually larger than the number of input characteristics. These large
    numbers of hidden neurons inside the “Hidden Layer” would be connected to all
    the data and characteristics in both the “Input” and “Output” layers.


    ![FIGURE 2.6 New version of the artificial neural network that includes multiple
    layers of neurons between input and output and backpropagation to change the weights
    between neurons.](images/Fig02_06.jpg)


    **FIGURE 2.6**](#C_005_c2.xhtml#f2_6b) New version of the artificial neural network
    that includes multiple layers of neurons between input and output and backpropagation
    to change the weights between neurons.


    Furthermore, instead of being only a “Feed Forward” process, the new version of
    the Artificial Neural Networks will also include a “Feed Backward” process through
    “Back Propagation” algorithms in order to modify and enhance the connections between
    all the neurons in the multiple layers. In addition to the new version of the
    Artificial Neural Networks that are currently called machine Learning Algorithms
    for Artificial Intelligence, other machine learning algorithms are also part of
    Artificial Intelligence, such as Fuzzy Set Theory and Evolutionary Computing.
    As shown in [Figure 2.7](#C_005_c2.xhtml#f2_7), the current version of Artificial
    Intelligence no longer includes rule-based “Expert Systems”.


    ![FIGURE 2.7 Rule-based system was removed from the new version of Artificial
    Intelligence starting in the mid-1980s.](images/Fig02_07.jpg)


    **FIGURE 2.7**](#C_005_c2.xhtml#f2_7b) Rule-based system was removed from the
    new version of Artificial Intelligence starting in the mid-1980s.


    ## Future Directions and Multi-valued Logic


    However, it is quite possible that in the near future, the current revolutionary
    technology that is called Artificial Intelligence will use “rule-based” technologies
    in addition to and in combination with data-driven technologies in its model developments.
    However, given the fact that the new revolutionary Artificial Intelligence technology
    simulates natural intelligence and mimics the human brain, it needs to follow
    the way the human brain uses logic. As it is a well-known fact, the human brain
    does not use a two-valued logic in its process. When we are asked, “How Are You?”
    we never only use either the words “good” or “bad” but rather we respond such
    as “I am doing fine”, “I am doing OK”, or “I am not so well now”, … Instead of
    using only two-valued logic, the human brain uses multi-valued logic.


    Therefore, instead of using two-valued logic, if “rule-based” modeling, decision-making,
    and problem-solving would use Fuzzy Set Theory to use multi-valued logic, then
    the revolutionary Artificial Intelligence technology can use rule-based algorithms
    in combination with other machine learning algorithms in order to advance the
    analysis, modeling, decision-making, and problem-solving of science and engineering.
    As it is shown in [Figure 2.8](#C_005_c2.xhtml#f2_8), it is possible (not necessarily
    for sure) that Artificial Intelligence can go back to its previous shape of using
    both data-based modeling and rule-based modeling to model and solve problems,
    with the difference of using multi-valued logic rather than simplified “two-valued”
    logic.


    ![FIGURE 2.8 The future version of Artificial Intelligence most probably would
    also include rule-based systems, but instead of two-valued logic, it most probably
    would use multiple-valued logic (Fuzzy Set Theory) like the human brain.](images/Fig02_08.jpg)


    **FIGURE 2.8**](#C_005_c2.xhtml#f2_8b) The future version of Artificial Intelligence
    most probably would also include rule-based systems, but instead of two-valued
    logic, it most probably would use multiple-valued logic (Fuzzy Set Theory) like
    the human brain.


    ## Using the Term “Artificial Intelligence”


    As was mentioned, starting in 1986, the backpropagation algorithm started to be
    used in Artificial Neural Networks. This created a large amount of interest in
    using this machine learning algorithm to solve problems. The overwhelming majority
    of such applications were done at the Institute of Electrical and Electronic Engineering
    (IEEE). However, since Artificial Intelligence had become purely a rule-based
    technology and its characteristics had not created a serious amount of problem-solving
    interest in scientists, no one used the term “Artificial Intelligence” when this
    new version of Artificial Neural Networks was being used to solve problems.

