    1. A [chatbot](#C_004_c1.xhtml#n1_1b) is a computer program that simulates human
    conversation through text or voice. There are two main types of chatbots: rule-based
    chatbots and machine learning chatbots. Rule-based chatbots are programmed with
    a set of rules that dictate how they should respond to certain prompts or questions.
    Machine learning chatbots, on the other hand, can learn and adapt their responses
    based on the conversations they have with users.


    # 2 Brief History of Artificial Intelligence


    DOI: [10.1201/9781003369356-3](https://doi.org/10.1201/9781003369356-3)


    The general ideas about what is today called Artificial Intelligence started in
    the early 1950s by an English mathematician, computer scientist, logician, cryptanalyst,
    philosopher, and theoretical biologist named Alan Turing. His picture is shown
    in [Figure 2.1](#C_005_c2.xhtml#f2_1). He is known as the father of modern computing
    since he developed the ideas of modern computing and Artificial Intelligence.
    In one of his original publications \[[2](#Z_011_references.xhtml#r2)], he has
    mentioned, “I propose to consider the question: can machines think?” Alan Turing
    created a test that has proved a lasting stimulus to later thinkers and contributed
    to the research of the philosophy and practice of Artificial Intelligence: “Turing
    Test is a method of inquiry in Artificial Intelligence for determining whether
    or not a computer is capable of thinking like a human being” \[[2](#Z_011_references.xhtml#r2)\].


    ![FIGURE 2.1 Alan Turing, the English mathematician, computer scientist, logician,
    cryptanalyst, philosopher, and theoretical biologist.](images/Fig02_01.jpg)


    [FIGURE 2.1](#C_005_c2.xhtml#f2_1b) Alan Turing, the English mathematician, computer
    scientist, logician, cryptanalyst, philosopher, and theoretical biologist.


    Pictures of only three of the important technical scientists that played an important
    role in the development of the Artificial Intelligence in the past several decades
    (John McCarthy, Walter Pitts, and Marcian Hoff) are shown in [Figure 2.2](#C_005_c2.xhtml#f2_2).
    Since I was not able to provide the actual pictures of many other technical scientists
    that played an important role in the development of the Artificial Intelligence
    in the past several decades, in this book, I can only provide their names: Warren
    McCulloch, Frank Rosenblatt, Bernard Widrow, John von Neumann, Claude Shannon,
    Allen Newell, Herbert A. Simon, Geoffrey Hinton, Yann LeCun, and Yoshua Bengio.


    ![FIGURE 2.2 Picture of some of the important technologists who played an important
    role in the development of Artificial Intelligence.](images/Fig02_02.jpg)


    [FIGURE 2.2](#C_005_c2.xhtml#f2_2b) Picture of some of the important technologists
    who played an important role in the development of Artificial Intelligence.


    It is a good idea to use Google Bard and ChatGPT to learn some details about these
    individuals’ contribution to the Artificial Intelligence and several other scientists
    that have not been mentioned in this book (because of the “Brief History”). What
    is planned to be covered in this chapter, again briefly, is to simply describe
    what has happened that the term “Artificial Intelligence” has not been used since
    1986, and why, most recently (since the middle of 2005), the term “Artificial
    Intelligence” started to be used.


    ## Original Artificial Intelligence Using Data and Rules


    It all goes back to the essence of the history of this revolutionary technology
    (Artificial Intelligence). In the 1950s and 1960s, as the initial version of Artificial
    Intelligence was generated, both data and rules were used for the development
    of the Artificial Intelligence models, as shown in [Figure 2.3](#C_005_c2.xhtml#f2_3).
    The data-related models in this original version of Artificial Intelligence were
    using the initial version of Artificial Neural Networks, which only included two
    layers of data as “input” and “output”.


    ![FIGURE 2.3 The initial version of Artificial Intelligence (in the 1950s and
    1960s) was developing models based on data and/or rules.](images/Fig02_03.jpg)


    [FIGURE 2.3](#C_005_c2.xhtml#f2_3b) The initial version of Artificial Intelligence
    (in the 1950s and 1960s) was developing models based on data and/or rules.


    This original version of the Artificial Neural Networks (called `Perceptron`)
    did not include what are today called hidden layers and hidden neurons. Furthermore,
    the original version of the Artificial Neural Networks would only make its calculations
    through “Feed Forward” of the neurons, with no technique to move the calculations
    backward for modification and enhancement of the connections between the input
    data and the output data. Therefore, the major characteristics of the Artificial
    Neural Networks (`Perceptron`) through using data for the model and problem-solving
    development included “No Hidden Layers”, and only “Feed Forward” calculations.


    As shown in [Figure 2.4](#C_005_c2.xhtml#f2_4), in 1969, a book named *Perceptrons:
    An Introduction to Computational Geometry* was written by two university professors
    from Massachusetts Institute of Technology (MIT), Marvin Minsky and Seymour Papert
    \[[1](#Z_011_references.xhtml#r1)]. In this book, the authors cover the `Perceptron`
    algorithm (an original version of Artificial Neural Networks) that was generated
    by an American psychologist named Frank Rosenblatt in 1957. The major contribution
    of this book to Artificial Intelligence was about the original version of Artificial
    Neural Networks (`Perceptron`), explaining that this original version of Artificial
    Neural Networks can only solve “Linear”-related problems and is not capable of
    solving any “Non-linear”-related problems.


    ![FIGURE 2.4 Marvin Minsky and Seymour Papert wrote an important book Perceptrons:
    An Introduction to Computational Geometry in 1969 that provided a situation to
    enhance the characteristics of the original artificial neural networks (perceptron).](images/Fig02_04.jpg)


    [FIGURE 2.4](#C_005_c2.xhtml#f2_4b) Marvin Minsky and Seymour Papert wrote an
    important book *Perceptrons: An Introduction to Computational Geometry* in 1969
    that provided a situation to enhance the characteristics of the original artificial
    neural networks (perceptron).


    The main result of this book is that it literally removes the data-driven version
    of modeling and problem-solving from the original “Artificial Intelligence”. As
    shown in [Figure 2.5](#C_005_c2.xhtml#f2_5), once this book was written and read
    by a large number of scientists, all existing research and development processes
    in the existing “Artificial Intelligence” technology started working only through
    rule-base modeling and avoiding the use of any data-driven technology.


    ![FIGURE 2.5 Data-driven modeling was removed from the original version of artificial
    intelligence.](images/Fig02_05.jpg)


    [FIGURE 2.5](#C_005_c2.xhtml#f2_5b) Data-driven modeling was removed from the
    original version of artificial intelligence.


    The rule-base modeling type of modeling included a series of rules that must have
    been followed to solve a specific problem. Such rules would be developed by domain
    experts about the topic that would be modeled to help humans make decisions. This
    part of the original version of Artificial Intelligence was called “Expert Systems”
    and would try to solve complex problems through “If – Then –” rules. One of the
    major issues associated with this technology was the fact that all the rules that
    would be generated for “Expert Systems” would be using two-valued, Aristotelian
    logic.

