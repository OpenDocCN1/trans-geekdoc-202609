    正如你目前所看到并测试的通用人工智能模型（例如图像识别或 ChatGPT）的特性一样，你知道基于 AI 的模型生成的结果比人类完成的快得多。人工智能在科学和工程应用中也是如此。对于人工智能生成的基于物理的模型，即使是对于传统方法需要数十小时才能完成的极其复杂的物理现象，人工智能也仅需几秒钟或几分钟即可解决。


    ## 基于物理的 AI 模型比传统的物理建模提供好得多的结果


    正如前文提到的，使用人工智能对物理现象进行建模需要使用实际的实测数据，而不是任何数学方程。事实上的情况是，当使用数学方程对物理现象进行建模时，假设和解释会成为解决方案的一部分。此外，物理现象中观察到的每一个变量或参数并不一定会成为数学方程的一部分。另一方面，当使用人工智能来开发物理现象模型时，所生成的每一个实际测量值都将包含在基于
    AI 的模型中。由于只使用了实际测量值而没有使用数学方程，因此没有任何假设、解释或简化会成为物理现象的基于 AI 模型的一部分。


    这一事实总是为物理现象带来更好、更真实的模型和解决方案。当将基于 AI 的物理现象模型用于匹配物理现象的历史并随后对其进行优化时，它提供的结果比模型中包含的任何想法都要真实得多。鉴于一切都基于事实和现实，并避免了任何假设和解释，其结果始终远优于传统的基于数学的模型（而且要快得多）。


    ## 为什么在人工智能中必须使用基于物理的领域知识


    需要注意的是，使用人工智能对科学和工程物理现象进行建模只需要数据。人工智能将通过提供给机器学习算法的数据来学习物理现象的所有细节。必须注意的最重要问题是使用物理现象的**实际**数据，而不是任何任何人（甚至是领域专家）都可以生成的数据。由于物理现象的传统建模是通过数学方程完成的，因此新的物理现象人工智能建模将不再使用（也不能）使用数学方程对其进行建模。


    使用物理领域专业知识来生成物理现象的人工智能模型有几个重要要求：(A) 避免包含数学方程的传统基于物理建模，(B) 将物理现象的主要信息教授并传达给用于生成人工智能的机器学习算法。使用物理领域专业知识生成物理现象的人工智能模型时，生成的每一个实际测量值都将包含在基于
    AI 的模型中。虽然只使用了实际测量值而没有使用数学方程，因此没有任何假设、解释或简化会成为物理现象的基于 AI 模型的一部分。


    这一事实总是为物理现象带来更好、更真实的模型和解决方案。当基于 AI 的物理现象模型被用于匹配物理现象的历史并随后对其进行优化时，它提供的结果比模型中包含的任何想法都要真实得多。鉴于一切都基于事实和现实，并避免了任何假设和解释，其结果始终远优于传统的基于数学的模型（而且要快得多）。


