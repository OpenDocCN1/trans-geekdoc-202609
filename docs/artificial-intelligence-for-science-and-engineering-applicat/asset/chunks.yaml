    \ has an impact on the second factor of cold weather’s impact on production. In\
    \ the same chart, an “up to an 80% reduction impact” was stated during periods\
    \ of extreme cold weather months. This is in fact wrong by a significant factor.\
    \ The decrease in production is closer to 9%–15% from peak production to lowest\
    \ production in recent years, as this new chart shows here” and also “How does\
    \ weather impact oil production in the Bakken?” “I will need some weather data,\
    \ specifically historical weather data for the region”. The oil production data\
    \ for the region goes back to 1960, so there is a lot of weather history to work\
    \ with. Using the National Oceanic and Atmospheric Administration – NOAA website\
    \ (`http://noaa.gov`), I was able to obtain historical weather data from the Bakken\
    \ region, using a latitude and longitude polygon, since 1960, the first oil production\
    \ entry in my oil production dataset”. \n\nAround the mid-2000, when Image Recognition\
    \ was developed by Artificial Intelligence and Machine Learning and demonstrated\
    \ its strong value and characteristics through data, the management of one of\
    \ the most well-known petroleum companies in the United States drew a series of\
    \ Artificial Intelligence experts (without any petroleum engineering expertise)\
    \ and asked them to use their company’s incredible amount of data to provide them\
