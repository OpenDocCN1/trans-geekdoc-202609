    Artificial General Intelligence technologies have been used for face, object,
    and voice recognition, as well as autonomous vehicles, human conversation, and
    large language model (`LLM`). It is quite obvious that the “Human Brain” does
    not need any physics-based domain expertise (through going to school and university
    for learning) to be able to solve non-physics-based problems. Identifying faces
    and voices or different objectives, such as cars, buses, trucks, bikes, pedestrians,
    … in the streets or being able to learn how to drive a car and have language conversation,
    does not require anything other than General Intelligence in the human brain.
    While it is identified and mentioned that many of the current fantastic AI-based
    technologies that have been developed are based on General Intelligence, it is
    also very important to note that in this book it is not claimed that these Artificial
    General Intelligence technologies are simple and easy to develop.


    It is quite important to note that developing Artificial General Intelligence
    technologies is not easy or simple since they are simulating “Human General Intelligence”,
    which does not require science and engineering expertise. The fact is that the
    overwhelming majority of these Artificial General Intelligence technologies were
    quite complex during their development, and their expansion requires incredible
    expertise in `Artificial Intelligence`. Nevertheless, another fact is that while
    these AI-based experts are creating Artificial General Intelligence technologies,
    they are not technologies that would be able to generate models for specific physical
    phenomena that, in the past centuries, have been done through mathematical equations.
    These mathematical equations of the physical phenomena are then solved through
    analytical solutions, or numerical solutions, based on the complexities of the
    mathematical equations that have modeled these physical phenomena. It is obvious
    that a lot of important issues that have taken place in Homo sapiens only needs
    “Human General Intelligence”. Therefore, it is very important to be an expert
    in “Artificial Intelligence” to be able to develop “Artificial General Intelligence”
    models.


    Recent technologies such as “ChatGPT”, “GPT-4”, “Google Bard”, … are part of “Artificial
    General Intelligence” and it is extremely important to note the importance of
    “Artificial Intelligence”. However, it does not mean that these “Artificial General
    Intelligence” technologies are able to solve science- and engineering-related
    problems through modeling physical phenomena.


    ## How Physical Domain Expertise Must Be Used for AI-Based Modeling of Physics


    One of the major issues that will be included in this chapter is the way physical
    domain expertise must be used to develop physics-based Artificial Intelligence
    models. First and foremost, it must be mentioned that (A) physics-based Artificial
    Intelligence models will be quite different from traditional modeling of physical
    phenomena by engineers and scientists, (B) physics-based Artificial Intelligence
    models can be developed much quicker during development and then far faster to
    be run compared to the traditional modeling of physical phenomena by engineers
    and scientists, and (C) physics-based Artificial Intelligence models will be providing
    much better and far more realistic results than traditional modeling of physical
    phenomena by engineers and scientists. First, physical domain expertise will be
    discussed in the context of these three items that have been mentioned. Once the
    difference between traditional physical modeling and AI-based modeling of physical
    phenomena is covered, the way domain expertise must be used to develop science-
    and engineering-related models using Artificial Intelligence will be covered.


    ### Difference of Physics-Based AI Models with Traditional Physics-Based Modeling


    It is a well-known fact that traditional physics-based models are done using mathematical
    equations. It has already been mentioned that scientists and engineers identify
    the variables and parameters that are involved in a physical phenomenon and then
    use them inside a mathematical equation to model it. When Artificial Intelligence
    is used to develop a physics-based model, it is all based on the actual data.
    This is the main reason that it has also been called data-driven, data-science,
    and data-analytics. However, what is most important about this item is that currently
    it has not been correctly used by many scientists and engineers. The most important
    item in using Artificial Intelligence to develop physics-based models is ONLY
    using “Actual Data Measurements” for AI-based model development rather than the
    inclusion of data that has been generated using mathematical equations. More details
    on this item will be covered in [Chapter 6](#C_009_c6.xhtml) of this book.


    One of the major problems that is currently being addressed by a large number
    of scientists and engineers is the combination of data that has been generated
    through mathematical equations with some of the “Actual Data Measurements” in
    order to develop a physics-based model using Artificial Intelligence. The question
    may be, “Why large number of scientists and engineers add mathematically generated
    data to the Actual Data Measurements in order to build AI-based models of physical
    phenomena?”


    It would be interesting to ask them why they do that. In my opinion, the interesting
    question that must be first asked: “Were you successful in building an AI-based
    model of physical phenomena only using Actual Data Measurements?”, if their answer
    is “yes”, then why would they add the data that is generated from mathematical
    equations to build the AI-based model? The fact is that the reason they use the
    data that is generated from mathematical equations and combine it with the Actual
    Data Measurements for building the AI-based model of the physical phenomena is
    because they have never been able to develop reasonable models and solutions for
    the physical phenomena using Artificial Intelligence through Actual Measured Data.
    The definition of “Hybrid Modeling” is the lack of success in using the real characteristics
    of Artificial Intelligence to develop models and solutions to physical phenomena
    or a complete lack of understanding of what “Artificial Intelligence” really means.


    ### Quick Development of Physics-Based AI Models Compared to Traditional Physics-Based
    Modeling


    It is a quite well-known issue that the complexity of the physical phenomena will
    result in the complexity of mathematical equations that will be used to model
    them. Furthermore, it is also a well-known fact that highly complex mathematical
    equations cannot be solved simply and quickly using analytical solutions. This
    is the reason why numerical simulation was created in 1946 by John von Neumann
    and Stanislaw Ulam. To a very large extent, numerical simulation slightly modifies
    (simplifies) the characteristics of the physical phenomena in order to be able
    to generate the solution of the mathematical equation.


    This process is done by dividing the characteristics of the physical phenomena
    into many spaces (millions of cells) and into many time steps. Given the fact
    that a very large number of cells and time steps must be used to generate the
    solution of a numerical simulation, and then after the completion of the solution
    to be used to generate a full understanding of what needs to be done to enhance
    the physical phenomenon’s behavior, it always takes a long amount of time, even
    when a large number of computers are used to perform the solutions.

