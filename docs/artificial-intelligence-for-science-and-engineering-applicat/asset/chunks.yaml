    the generated data is only shown for these two specific parameters (variables).
    Once the generation of such data from mathematical equations is completed and
    used in the machine learning algorithm, the model shown in [Figure 6.6](#C_009_c6.xhtml#f6_6)
    can be developed. This would still be called AI-based by such companies as “Hybrid
    Model” that have not followed AI-Ethics.


    ![FIGURE 6.5 Example of data generated by using the mathematical equation for
    several variables. This shows plots of two variables.](images/Fig06_05.jpg)


    [FIGURE 6.5](#C_009_c6.xhtml#f6_5b) Example of data generated by using the mathematical
