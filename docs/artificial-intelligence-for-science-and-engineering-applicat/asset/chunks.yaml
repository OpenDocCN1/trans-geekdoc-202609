    在过去的三十里，Intelligent Solutions, Inc. 和西弗吉尼亚大学开发的 PDA，其主要贡献之一是为预测性分析中所谓的“黑箱”创建了透明度。由于
    PDA 是一项纯基于物理的技术，它避免了任何数学方程，并生成纯基于人工智能的预测模型，因此它能够开发出可解释的预测模型。


    本章的目标是演示如何为使用人工智能开发的工程相关模型提供“可解释的人工智能”（XAI）。由于本书作者是一名石油工程师，本章中显示的 XAI 示例都将与石油工程有关。然而，同样的方法也适用于适用于所有其他使用人工智能建模的工程和科学技术。这种演示将通过关键性能指标（KPIs）、敏感性分析和类型曲线（Type
    Curves）进行解释。


    ## XAI 第一部分：关键性能指标 (KPIs)


    在 PDA 背景下开发的基于人工智能的工程模型可以提供龙风图，以展示并排名用于开发（训练、校准和验证）预测模型的所有输入参数的贡献。本章接下来的 19 张图（图
    7.11、7.13、7.14、7.15、7.16、7.17、7.18、7.19、7.20、7.21、7.22、7.23、7.24、7.25 和 7.27 以及
    7.28、7.30、7.31、7.32 中用于生成工程模型 XAI 的模型是由一个名为“IMprove”并由“Intelligent Solutions,
    Inc.”开发的工程软件完成的。


    图 7.5 显示了根据名为《Shale Analytics》 [24 ]的书中详细解释的技术，针对宾夕法尼亚州西南部的马勒斯页岩（Marcellus Shale）气田开发的人工智能工程相关模型所生成的龙风图。为该储层和完井工程相关问题开发的人工智能预测模型包含了
    24 种现场测量值。该基于人工智能的预测模型的输出是该现场每口井的“30 天累计产气量”。


    ![图 7.5 针对宾夕法尼亚州西南部马勒斯页岩的数据驱动预测模型，在 Shale Analytics 中生成的关键性能指标龙风图（石油数据分析在非常规储层中的应用）。](img/Fig07_05.jpg)


    图 7.5 针对宾夕法尼亚州西南部马勒斯页岩的数据驱动预测模型，在 Shale Analytics 中生成的关键性能指标龙风图（石油数据分析在非常规储层中的应用）。


    针对宾夕法尼亚州西南部马勒斯页岩的数据驱动预测模型，在 Shale Analytics 中生成的关键性能指标龙风图（石油数据分析在非常规储层中的应用）显示，平均而言，完井设计、井裂实施和地层特性最为重要。在图
    7.5 中，图中部的每个属性都有背景颜色，而在图底部，背景颜色定义了重要性水平。


    ## XAI 第二部分：敏感性分析


    用于解释模型行为的主要技术之一是敏感性分析。以下三个步骤中对这些基于人工智能模型的敏感性分析涉及约 250 口井。然而，接下来的三个步骤中提供的 XAI 可以适用于每口井。还应该注意的是，相同类型的
    XAI 可以应用于几口井和/或所有井。本章后续部分演示的敏感性分析可以应用于储层的特定区域，或整个气田的所有井。


    ### 步骤 1：单参数敏感性分析


    来自马勒斯页岩 308 口井的总现场测量数据被用于本章介绍的开发、验证和人工智能解释。来自马勒斯页岩约 250 口井的数据被用于开发这个“基于人工智能的页岩分析”模型，其余的
    58 口井在基于人工智能的模型开发期间未使用。一旦完成使用 250 口井的基于人工智能的模型开发，为了理解模型行为的解释，将模型输出（6 个月产气量）作为修改每个单独参数的函数进行分析，以查看此类分析的结果是否符合工程（物理）逻辑。换句话说，其核心思想是能够“解释”人工智能模型。


    如图 7.7 所示，在通过 250 口井通过训练、校准和验证完成基于人工智能的页岩分析模型后，在模型开发期间未使用的 58 口井被用作盲测（Blind Validation），以识别基于人工智能的页岩分析模型预测新井
    6 个月产气量的准确性。如图所示，这 58 口盲测井的 R² 为 0.82。这将是该基于人工智能的模型预测马勒斯页岩所有新井 6 个月产气量的质量。本章这部分显示的内容是通过
    Intelligent Solutions, Inc. 的“IMprove”软件应用程序开发的。


