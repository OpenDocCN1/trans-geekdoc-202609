    因此，绝对重要的一点是：在使用“人工智能”对物理现象进行建模和/或解决时，使用人工智能的人员不仅必须具备“人工智能”方面的专业知识，还必须具备对所处理特定类型物理现象的专业知识。如图
    4.1 所示，“人类智能”和“人工智能”都需要“通用智能”来解决和建模“通用现象”，并需要“领域专业知识”来解决和建模“物理现象”。


    ![FIGURE 4.1 人类智能和人工智能对通用智能和领域专业知识的要求。](img/Fig04_01.jpg)


    FIGURE 4.1 人类智能和人工智能对通用智能和领域专业知识的要求。


    本章必须涵盖两个重要主题，以解释如何使用“人工智能”对物理现象进行建模和/或解决。这两个主题是：


    1. 物理现象的传统建模与基于人工智能的物理现象建模之间的差异，以及

    2. 如何通过人工智能利用特定物理现象的领域专业知识来对这些物理现象进行建模和/或解决。


    如上所述，第一个主题是人工智能与过去几个世纪用于建模和/或解决物理现象的技术之间的独特性和差异；第二个主题则指明了如何实现。


    ## 人工智能与物理学中的传统建模


    我们在学校和大学学习的建模和/或解决物理现象的知识被称为“物理现象的传统建模与求解”。这种“传统技术”使用数学方程对物理现象进行建模。传统技术与人工智能（全新技术）在建模和/或解决物理现象方面的主要区别在于在建模物理现象时使用或/或避免数学方程。虽然数学方程通过传统的科学和工程技术成为物理现象的模型，但人工智能并不通过数学方程对物理现象进行建模。人工智能不使用数学方程建模和/或解决物理现象的主要原因是避免了任何假设、解释和简化。人工智能建模和/或解决的物理现象完全基于现实、事实和实际测量。


    总而言，过去几个世纪使用的“物理现象的传统建模与求解”包括识别对特定物理现象起作用的变量和参数。然后，识别出的变量和参数被用于开发数学方程。当这些数学方程不复杂时，可以通过解析解生成精确解。然而，当某些物理现象通过高度复杂的数学方程建模时，就无法使用解析解。在这种情况下，已经开发了数值解来求解复杂的数学方程。


    正如前几节提到的，人工智能被定义为“人类智能”的模拟，由于“人类智能”是通过“人类大脑”产生的，因此模拟“人类大脑”活动将是人工智能最重要的部分。根据物理现象传统建模的简单定义（即使用数学方程对物理进行建模），可以提出问题：“人类大脑”使用数学方程来解决或与任何物理现象交互吗？这个问题的答案完全简单易见。为了给这个问题提供一个例子，让我们看图
    4.2 所示。


    ![FIGURE 4.2 通过物理和数学识别火箭轨迹的最终掉落点。](img/Fig04_02.jpg)


    FIGURE 4.2 通过物理和数学识别火箭轨迹的最终掉落点。


    这张图展示了一个使用数学方程建模的物理现象（火箭轨迹）。火箭轨迹的目标是到达一个需要击中并摧毁的特定位置。为了识别投出的火箭将落在何处，使用了通过数学方程建立的物理模型，如图
    4.2 所示。到达火箭将落的位置是重力（`g`）、初始速度（`V[0]`）和发射火箭的初始角度（`θ`）的函数。然而，观察图 4.3


    FIGURE 4.3 通过人类大脑识别球轨迹的最终掉落点。


    一个人向另一个人投掷物品。在橄榄球比赛中，四卫会传出球让接球手接到。问题是：必须接住物品（橄榄球）的人类大脑（接球手）也会生成一个数学方程来识别物品（橄榄球）将落在何处吗？如果是这样，人类大脑在生成数学方程后，必须求解它。根据人类大脑实现的数学方程的解，接球手的脑是否应该引导他的脚和手臂去动作并接到橄榄球？


    这个问题的答案似乎是显而易见的。事实是，人类大脑并没有开发数学方程来解决物理现象。既然情况如此（不开发和求解数学方程），那么人类大脑如何解决这个物理现象呢？美国橄榄球队上的接球手如何识别橄榄球掉落在哪里，以便他使用脚和手臂接到橄榄球？


    人类眼睛观察橄榄球，甚至观察四卫传给他的方式，然后利用这些 `Data` 来识别向哪个方向移动以及跑多远才能接到橄榄球。换句话说，在很多情况下，通过“人类大脑”的“自然智能”试图解决物理现象问题。人类大脑的“自然智能”利用其观察到的实际数据来解决物理问题。人类大脑的“自然智能”并不是开发一个数学方程然后尝试求解它。如果人类大脑通过这种方式的自然智能活动是合理的，那么人工智能不应该以这种方式激活来解决类似的问题吗？答案是：当然可以。人工智能必须模拟人类大脑的自然智能，通过实际数据对物理问题进行建模和求解。此类情况（解决物理现象）的另一个示例见图
    4.4。


    ![FIGURE 4.4 通过物理和数学平衡棍子与人类大脑对比](img/Fig04_04.jpg)


    FIGURE 4.4 通过物理和数学平衡棍子与人类大脑对比。

