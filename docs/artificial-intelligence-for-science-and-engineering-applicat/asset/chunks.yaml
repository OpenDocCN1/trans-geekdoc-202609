  raw: 'One of the major contributions of PDA that has been developed during the past
    three decades at Intelligent Solutions, Inc. and West Virginia University is the
    creation of transparency for the so-called “Black Box” of Predictive Analytics.
    Since PDA is a purely physics-based technology that avoids any mathematical equations
    and generates purely Artificial Intelligence based predictive models, it develops
    explainable predictive models. The objective of this chapter is to demonstrate
    how “Explainable the Artificial Intelligence” (XAI) can be provided for engineering-related
    models that have been developed using Artificial Intelligence. Since the author
    of this book is a petroleum engineer, the XAI examples that are shown in this
    chapter would all be related to petroleum engineering. However, in the same way,
    this can be done for all other engineering and scientific technologies that are
    modeled using Artificial Intelligence. This demonstration will be explained through
    KPIs, Sensitivity Analysis, and Type Curves.


    ### Part 1 of XAI: Key Performance Indicators (KPIs)


    AI-based engineering models that have been developed in the context of PDA can
    provide a tornado chart to demonstrate and rank the contribution of all the input
    parameters that were used to develop (train, calibrate, and validate) the predictive
    model. What is shown in the next 19 figures in this chapter ([Figures 7.11](#C_010_c7.xhtml#f7_11),
    [7.13](#C_010_c7.xhtml#f7_13), [7.14](#C_010_c7.xhtml#f7_14), [7.15](#C_010_c7.xhtml#f7_15),
    [7.16](#C_010_c7.xhtml#f7_16), [7.17](#C_010_c7.xhtml#f7_17), [7.18](#C_010_c7.xhtml#f7_18),
    [7.19](#C_010_c7.xhtml#f7_19), [7.20](#C_010_c7.xhtml#f7_20), [7.21](#C_010_c7.xhtml#f7_21),
    [7.22](#C_010_c7.xhtml#f7_22), [7.23](#C_010_c7.xhtml#f7_23), [7.24](#C_010_c7.xhtml#f7_24),
    [7.25](#C_010_c7.xhtml#f7_25), [7.27](#C_010_c7.xhtml#f7_27) and [7.28](#C_010_c7.xhtml#f7_28),
    and [7.30](#C_010_c7.xhtml#f7_30), [7.31](#C_010_c7.xhtml#f7_31), [7.32](#C_010_c7.xhtml#f7_32))
    that have been developed to generate the XAI in engineering models were performed
    by an engineering software application that is called “IMprove” and has been developed
    by “Intelligent Solutions, Inc.”.


    [Figure 7.5](#C_010_c7.xhtml#f7_5) shows a tornado chart generated from the Artificial
    Intelligence engineering-related model developed using the technology that has
    been explained in detail in a book called “*Shale Analytics*” \[[24](#Z_011_references.xhtml#r24)\]
    for a Marcellus Shale field in southwestern Pennsylvania. The Artificial Intelligence
    predictive model that was developed for this reservoir and completion engineering-related
    problem included 24 different field measurements. The output of this AI-based
    predictive model was “30 days of cumulative gas production” from each well in
    this field.


    ![FIGURE 7.5 Tornado chart of key performance indicators generated in Shale Analytics
    (application of petroleum data analytics in unconventional reservoirs) for a data-driven
    predictive model for a Marcellus Shale field in southwest Pennsylvania.](images/Fig07_05.jpg)


    [**FIGURE 7.5**](#C_010_c7.xhtml#f7_5b) Tornado chart of key performance indicators
    generated in Shale Analytics (application of petroleum data analytics in unconventional
    reservoirs) for a data-driven predictive model for a Marcellus Shale field in
    southwest Pennsylvania.


    The KPI tornado chart of this Artificial Intelligence predictive model shows that,
    on average, the operational condition in this field plays the most important role
    in controlling the first 30 days of gas production. Then it is followed by attributes
    associated with Completion Design, Well Characteristics, Hydraulic Fracture Implementation,
    and finally the Formation Characteristics. In [Figure 7.5](#C_010_c7.xhtml#f7_5),
    there are background colors for each of the attributes (input parameters) on the
    top part of the figure, and in the bottom of the figure, the background color
    defines the category of input parameters and also shows the level of importance
    of the categories of input parameters that are shown at the top of the figure.


    ### Part 2 of XAI: Sensitivity Analysis


    One of the major techniques that can be used to explain the behavior of a model
    is sensitivity analysis. The engineering application of Artificial Intelligence
    (predictive analytic) models that are provided in this chapter is in the context
    of PDA. These AI models include several input parameters that are used to build
    an Artificial Intelligence physics-based model purely based on actual field measurement
    data to generate the required output. In the context of reservoir engineering,
    let’s consider building an AI-based predictive Shale Analytics model that uses
    reservoir characteristics as well as completion design and implementation (as
    part of other input parameters) to model all the well productivity index.


    The sensitivity analysis of these AI-based predictive Shale Analytics models that
    will be explained in the following three steps includes about 250 wells. However,
    the XAI that will be provided in the next three steps can be applied to every
    single well that has been used to build the model using Artificial Intelligence.
    It should also be noted that the same types of XAI can also be applied to several
    wells and/or all the wells that have been used to develop this model. The sensitivity
    analyses that are demonstrated in the following parts of this chapter can also
    be applied to specific sectors of the reservoir (in the case of shale assets,
    they can be applied to each pad that includes a series of shale wells) that would
    include a certain number of wells and can be applied to all the wells in the entire
    field.


    #### Step 1: Single Parameter Sensitivity Analysis


    Total field measurements from 308 wells in Marcellus Shale were used for the development,
    validation, and AI explanation that are presented in this chapter. Data from about
    250 wells in Marcellus Shale was used to develop this “AI-based Shale Predictive
    Analytics” model, and the remaining 58 wells were not used during the AI-based
    model development. Once the AI-based model development was completed using the
    250 wells, in order to understand the explanation of the model behavior, the output
    of the model (6 Month Gas Production) was analyzed as a function of modifying
    every single input parameter to see if the results of such analyses made engineering
    (physics) sense. In other words, the idea is to be able to “EXPLAIN” the Artificial
    Intelligence model.


    As it is shown in [Figure 7.7](#C_010_c7.xhtml#f7_7), after the AI-based Shale
    Analytics model was completed through Training, Calibrations, and Validation using
    the 250 wells, the 58 wells that had not been used during the model development
    were used as Blind Validation to identify how accurately the AI-based Shale Analytics
    model can forecast the 6 Month Gas Production of the new wells. As shown in this
    figure, the R² of the 58 blind validation wells is 0.82. This would be the quality
    of this AI-based model to forecast the 6 Month Gas Production of all the new wells
    in Marcellus Shale. What is shown in this part of the chapter was developed using
    the “IMprove” software application from Intelligent Solutions, Inc.'
