    ## 解释传统工程模型


    众所周知，通过数学方程生成的物理现象模型是可以被解释的。这是工程师和科学家期望任何物理现象的潜在模型都应该具有可解释性的主要原因之一。传统物理现象模型的可解释性是通过用于开发模型的数学方程的解来实现的。对这类模型的解释是通过对合理简单的数学方程进行解析解（或对复杂数学方程进行数值解）来实现的。数学方程的解为回答从物理现象模型中提出的几乎任何问题提供了可能。


    数学方程的解被用于解释模型为何以及如何产生某些结果。它允许检查并解释所有涉及的参数（变量）对彼此以及对模型结果（输出参数）的影响和作用。通常情况下，这就是工程解决问题方法的定义。因此，基于数学方程的物理现象结果（无论其简单还是复杂）都可以被详细地解释。


    图 7.3 显示了 Fetkovich “型曲线”。它包含了早期曲线（由瞬态流方程驱动）和后期曲线（边界主导流、Arp 递减曲线）。用于这一系列“型曲线”的方程也在方程
    7.1 和 7.2 中给出，紧随图 7.3 之后。


    ![图 7.3 Fetkovich 型曲线。](img/Fig07_03.jpg)


    图 7.3 Fetkovich 型曲线。


    $q_{Dd} = q_{D}\left[\ln\left( \frac{r_{e}}{r_{wa}} \right) - \frac{1}{2} \right]$
    (7.1)


    $t_{Dd} = \frac{t_{D}}{\frac{1}{2}\left[\left( \frac{r_{e}}{r_{wa}} \right)^{2}
    - 1 \right]\left[\ln\left( \frac{r_{e}}{r_{wa}} \right) - \frac{1}{2} \right]}$
    (7.2)


    无量纲率(`q[D]`)和时间(`t[D]`)用于`方程 7.1` 和 `7.2`，并在测井领域背景下如下所示（`方程 7.3` 和 `7.4`）定义：


    $q_{D} = \frac{141.2\ q\mu B}{kh\left( p_{i} - p_{wf} \right)}$ (7.3)


    $t_{D} = \frac{0.001327 k}{\phi \mu r_{w}^{2}}$ (7.4)


    可以清楚地看到，图 7.3 和 7.4 证明了物理现象是以类似的方式从曲线到曲线开发的。这种“型曲线”背后的原因是数学方程的解。使用数学方程开发的物理现象的性能是可以解释其产生机理的。当涉及到人工智能和机器学习的工程应用时，图
    7.4 展示了“型曲线”的示例。


    ![图 7.4 型曲线示例。](img/Fig07_04.jpg)


    图 7.4 型曲线示例。


    ## 解释由人工智能开发的模型 (XAI)


    在最近发表于《福布斯》的一篇文章中（`[23]`）提到：


    “许多用于机器学习的算法在事后无法通过检查来具体理解是如何以及为何做出某项决策的。这对于目前最流行的算法——特别是深度学习神经网络方法尤其如此。XAI 是机器学习中的一个新兴领域，旨在解决
    AI 系统的黑箱决策是如何产生的。到目前为止，在使深度学习方法具有可解释性方面只有处于早期、萌阶段的研究和工作。”


    这篇文章写于 2019 年 7 月 23 日。它表明，使用人工智能和机器学习开发的模拟人类智能（非工程相关问题）的系统和模型，在解释该技术如何预测、预报或做出决策方面存在重大问题。这篇文章中提到的人工智能和机器学习的应用类型，以及许多其他关于
    XAI 的最新文章，主要与非相关问题的应用有关。当涉及到人工智能和机器学习的工程应用时，“是如何以及为何做出某项决策”变得比该技术用于非工程相关问题时重要得多。因此，今天被称为
    XAI 的问题自这项技术 20 世纪 90 年代开始用于工程领域以来就是一个重大问题。


    有趣的是，利用人工智能和机器学习开发的可解释预测模型是由一家名为 `Intelligent Solutions, Inc.` 的技术公司开发的。


