    ![图 4.6 这是与图 4.5 所示相同的段落。这是一个拼写正确的段落。你可以注意到，97% 的三个字母以上的单词都被拼写错了，但你（很可能）在正确阅读和理解这段文字时几乎没有什么问题](img/Fig04_06.jpg)


    ### 图 4.6 这是与图 4.5 所示相同的段落。这是一个拼写正确的段落。你可以注意到，97% 的三个字母以上的单词都被拼写错了，但你（很可能）在正确阅读和理解这段文字时几乎没有什么问题。


    当工程师提到诸如“实际测量数据从不是 100% 准确……”这类项目时，我通常会给他们提供图 4.5 所示的段落，然后问他们是否理解该段落所提到的内容。事实是，通常
    99.999% 的人都能阅读图 4.5 所示的段落，并识别出该段落中有大量单词没有正确正确。这意味着人类大脑能够理解并正确处理“从不是 100% 准确的实际数据……”，由于人工智能通过模仿人类大脑来模拟自然智能，它也能处理与实际数据相关的一些不准确性。


    当人工智能用于建模和/或解决物理现象时，其实际数据应该以代表物理学的方式呈现给机器学习算法。那些得出以下三个结论的个人和/或公司可以被认为能够利用人工智能来增强他们的目标：


    1. 领域知识是人工智能和机器学习工程应用的要求，

    2. 人工智能的工程应用需要领域知识，

    3. 无需通过数学方程生成数据。


    那些将以下内容称为“数据驱动”、“机器学习”甚至是“人工智能”（尽管他们通常不直接称为人工智能）的个人和/或公司无法被认为能够利用人工智能来增强他们的目标：


    1. 他们不理解人工智能与通用（普通）技术应用是不同的。

    2. 他们未能开发出使用`仅`实际数据（测量数据）解决相关问题的全面且可解释的“AI 模型”。


    数据应该以代表物理现象的方式呈现给机器学习算法。


    # 5 人工智能对比传统统计


    DOI: [10.1201/9781003369356-](https://doi.org/10.1201/9781003369356)


    人工智能和传统统计都使用数据来生成解决方案，这并不意味着它们在做相同的事情。事实是，它们所做的完全不同。目前的人工智能版本是于 30 年前开发的，它产生了最有趣的类型解决方案。然而，使用数据开发模型并生成解决方案的传统统计学是在
    350 年前开发的。因此，将传统统计方法作为“机器学习”来执行所谓人工智能与事实无关，正如本章将解释的那样。尽管如此，许多过去几年工作过传统统计并现在对其有良好经验的科学家和工程师继续使用它，他们现在不再将其称为传统统计，而是称为人工智能和机器学习。


    一些人可能会好奇，为什么这本书包含一个关于人工智能和传统统计之间差异的章节。原因在于，学术界和工业界的许多工程师认为这些技术非常相似，因为它们都处理“数据”。当他们提到“数据分析”时，他们大多指的是线性、非线性或多元回归，并试图将其视为一种新技术。许多故意或无意犯此类错误的人也试图将这些传统的旧技术称为他们行业中相当新的东西。


