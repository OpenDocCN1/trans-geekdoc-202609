  trans: '

    嗯，这是有道理的，因为由数学方程生成的数据基于现有的相关性，因此它保证了这些数据中的模式可以被机器学习算法识别。同样，这具有一种“学术”价值，可以让你学习人工智能和机器学习算法是如何运作的，但它并不具有“现实”价值，因为它没有遵循“**为什么必须使用机器学习算法**”这一核心原因。


    让我们明确一点：尝试多种方法来获得合理的解决方案是正确的做法。然而，能够正确判断所用方法的本质至关重要，而且关注“**为什么必须使用机器学习算法**”的科学推理也是极其重要的。遗憾的是，在很多情况下，这种判断是基于营销和商业成功，而不是科学上的正确性。在这种情况下，在解决工程相关问题时，使用人工智能和机器学习缺乏现实意义和科学上的成功，这一点变得显而易见了。


    似乎那些最终采取了上述操作并被称为“混合模型”的工程领域专家们，对人工智能和机器学习的理解是肤浅且有限的。总而言之，与工程领域专家相关的这一特定问题可以分为两类：


    1. 那些在尝试使用人工智能和机器学习解决工程相关问题时，试图将数学方程生成的数据与实际测量值相结合的人。这被称为“混合模型”。

    2. 那些试图使用为解决非工程相关问题开发的特定机器学习算法来解决工程相关问题的人。这里有两个例子：(a) 他们使用了开发用于解决“图像识别”等非工程相关问题的卷积神经网络（`CNN`）；(b)
    他们使用了开发用于解决图像“字幕生成”等非工程相关问题的长短期记忆网络（`LSTM`）。


    ## 科学与工程领域人工智能的要求


    正如前面提到的，科学与工程领域人工智能的主要要求是两个领域的专业知识：(1) 对人工智能所应用的特定科学和工程主题的专业知识，以及 (2) 对人工智能和机器学习的专业知识。如果有人缺少上述两个要求的专业领域中的任何一个，或者不是真正的专家，那么他们就无法现实且正确地使用人工智能来增强科学和工程相关问题的解决方案。遗憾的是，这种（在科学和工程中不现实且错误的人工智能应用）在过去十年在全球范围内一直在发生。


    到为止和目前许多作为建模和解决科学与工程相关问题的人工智能和/或机器学习的应用，包括对传统统计的使用，或通过某些机器学习算法使用相同的传统科学和工程方法。此类方法总是被称为“基于
    AI 的”，这完全是错误的。这种方法不正确的原因是，这些个人和公司对人工智能的了解很少，主要从营销的角度使用这个术语。然而，考虑到 AI 革命对我们世界的重要性，人工智能在科学和工程领域的应用将得到加强，希望很快如此。


    在过去的十年里，当科学家和工程师由于人工智能在我们生活各个方面的重要性而对其感兴趣时，他们开始与人工智能交互并使用它来解决科学和工程问题。过去十年科学家和工程师使用人工智能和机器学习方面存在五个主要问题：(1)
    过度关注机器学习算法的数学方程；(2) 在基于 AI 的建模中包含科学与工程相关问题的数学方程；(3) 使用开发并用于解决通用人工智能相关问题的机器学习算法；(4)
    使用传统的统计方法，因为它们也是数据驱动的；以及 (5) 继续使用传统的工程方法解决问题，但使用了机器学习算法。以下是对上述这五项每项的简短解释：


    ### 问题 1：过度关注机器学习算法的数学方程


    根据解决科学和工程问题的传统方法，科学家和工程师得出的结论是只要他们理解并学习了将要使用的机器学习算法的数学方程，就能让他们成为人工智能的专家。他们的结论是，他们将能够使用人工智能正确解决科学和工程相关问题（基于
    AI 的），因为他们确切知道机器学习算法的数学方程是如何使用的。这种理解的主要原因在于，在传统工程中，理解和学习已经为任何物理现象开发的数学方程是一项绝对要求。


    遗憾的是，这是对人工智能的误解。必须理解，使用机器学习算法解决科学和工程相关问题并创建基于 AI 的解决方案，与传统的物理现象建模方法非常不同。使用人工智能来分析、建模、解决和优化科学与工程相关问题，与我们通过生成数学方程的传统方法非常不同。鉴于机器学习算法相关的数学方程非常简单（相对于许多为物理现象开发的数学方程而言），绝大多数科学家和工程师认为自己可以在很短的时间内成为
    AI 专家，因为他们完全理解并可以使用机器学习算法。他们对成为适用人工智能专家的理解中，错误的一点是，他们没有意识到自己必须充分理解与人工智能和机器学习算法相关的**进化论、神经科学和哲学**。关于这一主题的更多细节将在[`C_007_c4.xhtml`]中介绍。


    ### 问题 2：在基于 AI 的建模中包含科学与工程相关问题的数学方程


    目前，试图使用人工智能对特定科学和工程主题建模的绝大多数科学家和工程师都包含了为这些特定科学和工程主题开发的数学方程。由于机器学习算法是数据驱动的，他们对“基于物理的数学方程”的包含是通过使用过去开发和用于解决此类问题的数学方程生成数据来实现的。他们从这些数学方程生成数据，并将其与为基于
    AI 的建模收集的实际真实数据相结合。这种在许多科学和工程方法中相当的方法通常被称为“基于物理的”和/或“混合模型”。


