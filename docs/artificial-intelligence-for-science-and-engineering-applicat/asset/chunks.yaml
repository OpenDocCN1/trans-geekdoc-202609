    [**FIGURE 1.8**](#C_004_c1.xhtml#f1_8b) Artificial neural network machine learning
    algorithm.


    Furthermore, it must be noted that another characteristic of the human brain that
    should also be included in some Machine Learning algorithms has to do with the
    “Logic” that the human brain uses. It must be noted that in the human brain, logic
    is also involved in problem-solving and decision-making. One of the main questions
    that needs to be discussed is: “What kind (type) of logic is used by the human
    brain?” In the traditional approach to solving science- and engineering-related
    problems, the logic that is used is mainly “Aristotelian Logic”.


    Aristotelian Logic that is also used in the current version of computers are two-
    valued logics. The Two-Valued Aristotelian Logic only includes “0” or “1”, “Yes”
    or “No”, “Black” or “White”, etc. It is easy to know that the human brain does
    not use two-valued logic. Instead of only “0” or “1” the human brain includes
    and deals with infinite numbers between “0” and “1”. This is a very well-known
    fact. This means that Artificial Intelligence and Machine Learning algorithms
    must use multi-valued logic instead of two-valued logic.


    Therefore, the best way to use Artificial Intelligence to model, solve problems,
    and make decisions would be to reasonably understand how the human brain processes
    information (data) and what type of logic it uses. This would help the scientists
    learn what would be the best possible style to mimic the human brain to successfully
    build and use Artificial Intelligence.


    Comparing the speed of actions taken by the human brain versus the chip in your
    smart phone (or computer), which one is faster? One of the major issues associated
    with Artificial Intelligence has to do with the minimum amount of time that it
    takes to solve any problem. Recently, several AI technologies such as ChatGPT,
    Microsoft Bing, and Google Bard have been developed and provided to everyone through
    the Internet that are able to answer questions, provide explanations, create writings,
    language translations, code writing, productivity assistance, text generation,
    brainstorming ideas, writing different kinds of documents, etc… ChatGPT (Generative
    Pre-trained Transformer) has been trained through a large dataset of text from
    the internet that include a wide range of sources, such as websites, books, articles,
    and other publicly available written material. When this specific question about
    how it was trained is asked from the ChatGPT itself, one of the items that is
    mentioned by ChatGPT is: “It is important to note that ChatGPT’s responses are
    generated based on patterns and associations learned from the training data. While
    the model can provide useful and coherent information, it may also generate incorrect
    or nonsensical answers at times. It is always advisable to verify information
    from reliable sources and use critical thinking when interpreting the model’s
    responses”.


    Google Bard is a Large Language Model (LLM) chatbot


    Another important characteristic of ChatGPT, Microsoft Bing, and Google Bard is
    the speed at which they perform what has been mentioned. This is also true for
    all other AI-based models and technologies. The main reason for such a characteristic
    of Artificial Intelligence has to do with the speed of chips in computers (as
    well as smart phones, tablets, …). The human brain is 10 million times slower
    than the computer chips in your smart phone. The speed of neurons firing in the
    human brain is between 1 and 200 Hz, while the speed of the smart phone CPU is
    about 2 GHz. Short for gigahertz, GHz is a unit of measurement for alternating
    current (AC) or electromagnetic (EM) wave frequencies equal to 1 billion Hz. When
    referring to a computer processor or CPU, GHz is a clock frequency, also known
    as a clock rate or clock speed, representing a cycle of time. Yet, the human brain
    has the capability to learn and implement complex activities that is very hard
    for computers to mimic. This has to do with how the human brain processes information.


    Machine Learning includes a series of algorithms that are used to generate Artificial
    Intelligence. Given the definition of Artificial Intelligence that was mentioned
    in the previous paragraphs, Machine Learning algorithms are used to process data
    and use the correct logic. The previous way of using computers (machines) to solve
    problems was all about explicitly programming the computer and telling it exactly
    what to do in complete detail. Overwhelming engineers have been using numerical
    simulation. Developing numerical simulations to solve engineering-related problems
    that have been modeled using highly complex mathematical equations requires the
    generation of numerical simulations. All engineers know that during the development
    of numerical simulation models, they must provide complete, explicit programs
    so that the computer can perform the numerical simulation. It is important to
    note that Machine Learning algorithms do not use explicit programming.


    The same thing is also true of traditional statistics, which is also a data-driven
    technology. In traditional statistics and any other traditional type of modeling
    using computers (machines), we would always tell the computer what to do in exact
    details without asking the computer to do anything that we had not specifically
    told it to do.


    Before Machine Learning algorithms, we would never expect the computers (machines)
    to do certain things that we had not told them to do (through coding). This is
    the main difference between Machine Learning algorithm and what has been done
    with computers (machines) in the past several decades. Machine Learning algorithms
    are Open Computer Algorithms. The main issue with Machine Learning algorithms
    is to let the Open Computer Algorithms learn from the data without using any pre-defined
    mathematical equations that are solved numerically or using a series of mathematical
    equations to check and see which one of the equations matches the data that is
    being used. Several general types of Machine Learning algorithms include Supervised
    Learning, Unsupervised Learning, Semi-supervised Learning, and Reinforcement Learning.


    Since the open Machine Learning algorithms will be learning from the data, it
    would be important to pay attention to the data that will be provided to the Machine
    Learning algorithms that they are going to learn from. This means that the quality
    and quantity of the data that is provided to the Machine Learning algorithms are
    very important. This has two main characteristics that must be paid a lot of attention
    to:


    ***First***, it means that if you intend to include a certain type of “bias” into
    the Artificial Intelligence modeling using Machine Learning algorithms, then you
    can do that through the type and amount of data that you would provide to the
    Machine Learning algorithms.


    ***Second***, it means that if you are not a domain expert in a scientific or
    engineering technology, you will not know what and how to deal with the actual
    real data that has been collected to provide it to the Machine Learning algorithms
    so they can learn from the data in a real fashion.


    Since “Machine Learning” is a learning process and since the human brain “Learns”
    the best way on important issues when it is taught in a good and correct manner,
    “Machine Learning” requires “Teaching”. Since we have to provide the correct version
    of quality and quantity of the data to the machine learning algorithm, we must
    spend enough time putting together the correct version of data that machine learning
    will learn from, and depending on the topic that is being modeled, domain expertise
    plays a critical role in being able to provide the best and correct quality and
    quantity of the data to the machine learning algorithm.


