    approach to the truth. Artificial Intelligence uses the patterns in the data to
    build a model. It discovers patterns in the data inductively.


    ![FIGURE 5.6 Differences between deductive reasoning and inductive reasoning.](images/Fig05_06.jpg)


    ## [FIGURE 5.6](#C_008_c5.xhtml#f5_6b) Differences between deductive reasoning
