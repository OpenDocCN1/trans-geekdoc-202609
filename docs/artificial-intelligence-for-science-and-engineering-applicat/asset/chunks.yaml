    ![FIGURE 3.6 Homo sapiens new revolution: Artificial Intelligence and Bio-Tech.](images/Fig03_06.jpg)


    [**FIGURE 3.6**](#C_006_c3.xhtml#f3_6b) Homo sapiens new revolution: Artificial
    Intelligence and Bio-Tech.


    Artificial Intelligence has already started to change so many things. Science
    and engineering domain experts that become highly skilled Artificial Intelligence
    practitioners are the ones that will control the future of science and engineering
    disciplines. Becoming a science- and engineering-related “Artificial Intelligence
    expert practitioner” requires extensive experience using Artificial Intelligence
