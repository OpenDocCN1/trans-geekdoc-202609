    [**FIGURE 3.17**](#C_006_c3.xhtml#f3_17b) Does it make sense to anyone that it
    is possible for you to become a master (an expert) in a major science and engineering
    (physics, mechanical engineer, petroleum engineer, geologist, chemical engineer,
    reservoir, engineer, etc.…) in only 1 month?


    ![FIGURE 3.18 Does it make sense that becoming a “Data Scientist” can only be
    done in 1 month?](images/Fig03_18.jpg)


    [**FIGURE 3.18**](#C_006_c3.xhtml#f3_18b) Does it make sense that becoming a “Data
    Scientist” can only be done in 1 month?


    What is shown in [Figure 3.18](#C_006_c3.xhtml#f3_18) is not made-up. It is absolutely
    not correct, but actually, it is a fact. This has been done by a company (UDEMY)
    that makes a lot of people think that they need very little time and effort in
    order to become experts in Artificial Intelligence, which is now is also being
    mentioned as “Data Science”.


    Expertise in Artificial Intelligence requires a large amount of research and development
    of problem-solving skills using this new modern technology. The research and development
    of problem-solving using Artificial Intelligence will incredibly interest scientists
    and engineers in evolution, philosophy, neuroscience, and biology, as shown in
    [Figure 3.19](#C_006_c3.xhtml#f3_19).


    ![FIGURE 3.19 Fundamental knowledge and understanding of Artificial Intelligence
    and Machine Learning require interest and expertise in philosophy, neuroscience,
    mathematics, computer science, statistics, and biology.](images/Fig03_19.jpg)


    [**FIGURE 3.19**](#C_006_c3.xhtml#f3_19b) Fundamental knowledge and understanding
    of Artificial Intelligence and Machine Learning require interest and expertise
    in philosophy, neuroscience, mathematics, computer science, statistics, and biology.


    1.  *Evolution* provides information about the enhancement and improvement of
    the brain of Home sapiens. Beside the comparison of the brains of all the animals
    that were developed before us, it even lets us compare the strength of our brains
    with the brains of other human species’ such as Neanderthals and *Homo erectus*.
    Neanderthals and *Homo erectus* evolved hundreds of thousands of years before
    us but never left the hunter-gatherer characteristics. Homo sapiens left eastern
    Africa almost 70,000 years ago, changed their hunter-gatherer characteristics
    through agricultural revolutions about 12,000 years ago, and started the creation
    of science and industry about 350 years ago. Without an interest in evolution,
    it would be very hard and unrealistic to learn about the fantastic characteristics
    of the human brain.


    2.  *Philosophy* provides incredible information and understanding about the fundamental
    nature of knowledge, fact, reality, and experience. As with the traditional approach
    to science and engineering, Aristotelian philosophy must not be the only approach
    used in Artificial Intelligence.


    3.  *Neuroscience* as a fantastic technology focuses on the human brains’ activities
    and behaviors through neurons.


    4.  *Biology*, which is the combination of two Greek words, “bios”, which means
    “life”, and “logos”, which means “study”, is the science of life and living organisms.


    Given the definition of Artificial Intelligence, which is the replication of human
    intelligence through mimicking the “Human Brain”, its expertise will make scientists
    and engineers to become incredibly interested in Evolution, Philosophy, Neuroscience,
    and Biology. It is highly important to note that once you become capable of using
    machine learning algorithms (which are quite simple to do for scientists and engineers),
    it does not mean in any shape or form that you have become an Artificial Intelligence
    expert. Unfortunately, this is currently one of the main problems for scientists
    and engineers: when they start using machine learning algorithms, it makes them
    feel there is no need to learn more about Artificial Intelligence.


