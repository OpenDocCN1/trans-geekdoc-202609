  raw: 'It is important to note that what is mentioned about these differences does
    not mean that the machines must also go to high school and university and get
    at least a bachelor’s degree in order to be able to solve science- and engineering-related
    problems, since such an issue is impossible. Therefore, if that is not the case,
    then how Artificial Science and Engineering Intelligence can be developed to produce
    correct, interesting, and important results? First and foremost, it must be noted
    that for a long time (even now in many cases), many industries have Artificial
    Intelligence experts with no domain expertise in any specific science and engineering
    to perform Artificial Intelligence which means solving science- and engineering-related
    problems. This has happened many times in many industries (and in some universities)
    and the results have proven that it is not a good idea at all.


    Here is an example that happened in the petroleum industry \[[9](#Z_011_references.xhtml#r9)\].
    On March 31, 2014, Hitachi provided an online News Releases


    The start of this online News Releases mentioned:


    “Hitachi America, Ltd and the Energy & Environmental Research Center (EERC)” today
    announced that the two companies are partnering to develop technology-driven products,
    services, and solutions for enhancing the production of oil reserves from the
    Bakken formation. Covering parts of North Dakota, Montana, Saskatchewan, and Manitoba,
    the Bakken formation is estimated to hold hundreds of billions of barrels of oil”.


    “With nearly 6,000 unconventional Bakken petroleum system wells and nearly 200
    drilling rigs in North Dakota alone, the sheer volume of data collected to date
    is staggering. Using powerful analytical tools to compile and evaluate Bakken
    data, oilfield operators and state officials can better understand the relationships
    between the productivity of an oil well and a variety of factors, such as how
    the well was drilled and the geology of the area in which it was drilled. These
    tools can also be used to identify previously unrecognized relationships in the
    data. In turn, this improved understanding will enable industry to improve the
    productivity of current and future Bakken wells”.


    Once EERC provided Hitachi all the data, apparently Hitachi did not have or did
    not use a petroleum engineering domain expert who is also an AI expert to perform
    this project for EERC. The result that Hitachi concluded from the data that was
    provided to them was that oil production from Bakken (North Dakota, Montana, Saskatchewan,
    and Manitoba) was a function of weather rather than anything about petroleum engineering.
    Coming up with such solutions using “Data Science” without any expertise or understanding
    of petroleum engineering makes perfect sense. The engineers and scientists in
    the EERC were shocked by such results from Artificial Intelligence and communicated
    with Hitachi about how incorrect such results can be.


    The response of Hitachi to EERC’s engineers and scientists was also published
    on Friday, April 24, 2015, with the topic “UPDATE! Data Blending, Spurious Correlations
    and Rainy Day”. In this article, it was mentioned:


    “It has come to my attention that the result from this analysis presented in this
    blog is overstated in its conclusions. The folks at the EERC have pointed out
    two areas of discrepancies that I would like to address here, the volume of production
    shown in the charts below is overstated (the y-axis) and the amount of cold weather
    production decline is overstated (the x-axis). After examining these details with
    Matthew O’Keefe, it turns out they are right. You’ve got to love experts!”


    “First, the volume of production shown on the y-axis is wrong. Operationally,
    the data used for this calculation boils down to an operational error on my part
    – the database was loaded more than once with the same data resulting up to three
    copies of the same data existing in this table. This greatly inflated any results
    in the analysis”.


    “This has an impact on the second factor of cold weather’s impact on production.
    In the same chart, an “up to an 80% reduction impact” was stated during periods
    of extreme cold weather months. This is in fact wrong by a significant factor.
    The decrease in production is closer to 9%–15% from peak production to lowest
    production in recent years, as this new chart shows here” and also “How does weather
    impact oil production in the Bakken?” “I will need some weather data, specifically
    historical weather data for the region”. The oil production data for the region
    goes back to 1960, so there is a lot of weather history to work with. Using the
    National Oceanic and Atmospheric Administration – NOAA website ([http://noaa.gov](http://noaa.gov)),
    I was able to obtain historical weather data from the Bakken region, using a latitude
    and longitude polygon, since 1960, the first oil production entry in my oil production
    dataset”. Around the mid-2000, when Image Recognition was developed by Artificial
    Intelligence and Machine Learning and demonstrated its strong value and characteristics
    through data, the management of one of the most well-known petroleum companies
    in the United States drew a series of Artificial Intelligence experts (without
    any petroleum engineering expertise) and asked them to use their company’s incredible
    amount of data to provide them with the opportunity to enhance oil and gas production.


    When the Artificial Intelligence experts performed their analysis using the data
    that was provided to them, they mentioned the following to the petroleum companies’
    management: “In order to enhance your oil and gas production, you need more porosity
    in the reservoirs that you work on”. Since this information is taught to the petroleum
    engineering students in their first reservoir engineering courses, and therefore
    it is a well-known fact for people that start learning about petroleum engineering,
    the petroleum companies’ management was shocked that such a simple petroleum engineering
    technology was the result of the Artificial Intelligence experts. Such issues
    were the reason that many industries (during the early stages of the application
    of Artificial Intelligence in their companies) concluded that Artificial Intelligence
    does not work or is a waste of time and money. What they did not realize was that
    such problematic issues and results are not the problem of Artificial Intelligence;
    it is about not using it correctly.


    ## Problems Associated with the Science and Engineering Application of Artificial
    Intelligence


    Currently, the main issues associated with the science and engineering application
    of Artificial Intelligence and Machine Learning in academia and industry have
    to do with three major problems: (1) When Artificial Intelligence or statistics
    experts that have a minimal understanding of engineering are identified as the
    main leaders and scientists to address and solve engineering-related problems
    using data; (2) The involvement of traditional engineers that do not believe Artificial
    Intelligence is science and technology and claim that Artificial Intelligence
    is a hoax (same as Covid-19) and should not be used to solve engineering-related
    problems; and (3) The engineers who have a minimal and superficial understanding
    of Artificial Intelligence and are mostly interested in it from a business and
    marketing point of view rather than science and technology.


    Here are simple explanations of each of the three problems that have been mentioned:


    ***First Problem:*** **When Artificial Intelligence or statistics experts with
    minimal understanding of engineering are identified as the main leaders and scientists
    to address and solve engineering-related problems using data.**'
