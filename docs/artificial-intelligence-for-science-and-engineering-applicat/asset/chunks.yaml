    When the model development of hydraulic fracturing was performed more than 50
    years ago, the shape of the hydraulic fracture in the conventional reservoir was
    modeled using an elliptical shape, as shown in [Figure 6.13](#C_009_c6.xhtml#f6_13).
    This traditional hydraulic fracture model includes four specific characteristics
    that allow it to be modeled using mathematical equations. These four specific
    characteristics are (a) fracture half-length, (b) fracture height, (c) fracture
    width, and (d) fracture conductivity. Comparing the shapes of the hydraulic fractures
    that are demonstrated in [Figures 6.11](#C_009_c6.xhtml#f6_11) and [6.12](#C_009_c6.xhtml#f6_12)
    versus the shapes of the hydraulic fracture that are shown in [Figure 6.13](#C_009_c6.xhtml#f6_13)
    makes it quite clear how different the actual shape of hydraulic fracture is between
    unconventional versus conventional reservoirs.


    ![FIGURE 6.13 Hydraulic fracture in a conventional reservoir.](images/Fig06_13.jpg)


    [FIGURE 6.13](#C_009_c6.xhtml#f6_13b) Hydraulic fracture in a conventional reservoir.


    When the actual hydraulic fractures look like what is shown in [Figures 6.11](#C_009_c6.xhtml#f6_11)
    and [6.12](#C_009_c6.xhtml#f6_12), does it make any sense, or does it have anything
    to do with reality, to model it using the shape that is shown in [Figure 6.13](#C_009_c6.xhtml#f6_13)?
    The answer to this question must be quite clear. This is a good example of how
    assumptions, interpretations, preconceived notions, simplifications, and biases
    that are included in the mathematical equations (that are used to model the physics
    of fluid flow in porous media) are included in “hybrid models” that combine them
    with real field measurements.


    AI-Ethics have proven to be an important issue when AI-based models are used in
    decision-making. AI-Ethics can expose biases that may have been included in the
    Artificial Intelligence applications of science and engineering as well as general
    intelligence problem-solving. Several studies, some of which were referenced in
    this chapter, have shown how biases such as racism and sexism have been included
    in the AI-based models that have been exposed through AI-Ethics. This chapter
    demonstrated how assumptions, interpretations, and biases developed by traditional
    engineers can be included in the engineering application of Artificial Intelligence,
    which is referred to as AI-Ethics in Engineering.


    # 7 Explainable Artificial Intelligence (XAI)


    DOI: [10.1201/9781003369356-8](https://doi.org/10.1201/9781003369356-8)


    Explainable Artificial Intelligence (XAI) is one of the main characteristic of
    Science and Engineering Application of Artificial Intelligence. As it was mentioned
    in the previous chapters, Science and Engineering Application of Artificial Intelligence
    models physical phenomena purely based on facts and reality (actual measurement
    data). The main objective of this new technology, which is quite different from
    traditional engineering applications, is the complete avoidance of assumptions,
    interpretations, simplifications, preconceived notions, and biases. One of the
    major characteristics of Artificial Intelligence for Science and Engineering Application
    that is different from Artificial General Intelligence is its incorporation of
    XAI. While using actual data measurements as the main building blocks of modeling
    physical phenomena, Science and Engineering Application of Artificial Intelligence
    incorporates several types of Machine Learning Algorithms, including artificial
    neural networks, fuzzy set theory, and evolutionary computing. Predictive models
    of Science and Engineering Application of Artificial Intelligence are not represented
    by the unexplainable “Black Box”. Predictive models of Science and Engineering
    Application of Artificial Intelligence are reasonably explainable.


    In the early 1990s, when some engineers started using Artificial Intelligence
    and Machine Learning to solve engineering-related problems, generate related articles,
    and present their new technology at conferences, many other engineers and scientists
    that were being exposed to such models and solutions started asking “how this
    technology (Artificial Intelligence and Machine Learning) achieves its predictive
    objectives”. What is being addressed recently as XAI for the non-engineering application
    of Artificial Intelligence, is not new in the context of engineering applications
    of this technology. The main reason behind the fact that Science and Engineering
    Application of Artificial Intelligence to a large extent is quite understandable
    has to do with the historical problems of the application of traditional statistics
    that were used to solve engineering-related problems.


    While traditional statistics’ main solutions are about the identification of “correlations”
    in the data, engineers and scientists were always interested in “causations” that
    could explain the existing “correlations”. This has always been one of the main
    problems associated with the use of traditional statistics to solve problems.
    There are still many AI-based solutions that are referred to as “Black Box”. It
    is important to note that Science and Engineering Application of Artificial Intelligence
    does not generate “Black Box” solutions.


    As mentioned before, in the early 1990s, questions by many engineers and scientists
    about the type of engineering solutions using Artificial Intelligence and Machine
    Learning gave rise to research and development efforts in early 2000 and resulted
    in what is today called XAI. In this chapter, the history of what today is called
    XAI is shown through seven technical papers in the oil and gas industry that were
    published between 2001 and 2010, while “Explainable Artificial Intelligence” was
    brought up as a new item by the U.S. Department of Defense in 2016. Historically,
    prior to the development of Artificial Intelligence, traditional statistics were
    used to analyze data. The major role of traditional statistics is to specify hypotheses
    that fit the collected data. Therefore, the key behind traditional statistics
    is “correlation” while engineers and scientists have always been interested in
    “causation”. It is a well-established fact that “correlations” do not necessarily
    determine and/or represent “causations”. Causation means that changes in variables
    interact with one another. Modifications in one variable cause specific types
    of modifications in another variable.


    [Figures 7.1](#C_010_c7.xhtml#f7_1) and [7.2](#C_010_c7.xhtml#f7_2) are good examples
    of how “correlation” does not have anything to do with “causation”. These figures
    demonstrate how data collected for different variables can be correlated to each
    other while having absolutely nothing to do with one another. [Figure 7.1](#C_010_c7.xhtml#f7_1)
    shows over 95% correlation between “U.S. Crude Oil Import from Norway” and “Drives
    Killed in Collision with Railway Trains”. While 9 years of data from these two
    items are highly correlated with each other, it is quite obvious that they do
    not have anything to do with each other. [Figure 7.2](#C_010_c7.xhtml#f7_2) shows
    over 98% correlation between “Ice Cream Sales” and “Shark Attacks” for an entire
    year. This data also has absolutely nothing to do with each other, while they
    are highly correlated with each other. These actual data clearly show that correlation
    does not necessarily explain any causation.


    ![FIGURE 7.1 In 9 years, from 2000 to 2009, U.S. crude oil imports from Norway
    highly correlates with drivers killed in collisions with railway trains. It is
    quite clear that such a correlation has absolutely nothing to do with causation.](images/Fig07_01.jpg)


    [FIGURE 7.1](#C_010_c7.xhtml#f7_1b) In 9 years, from 2000 to 2009, U.S. crude
    oil imports from Norway highly correlates with drivers killed in collisions with
    railway trains. It is quite clear that such a correlation has absolutely nothing
    to do with causation.

