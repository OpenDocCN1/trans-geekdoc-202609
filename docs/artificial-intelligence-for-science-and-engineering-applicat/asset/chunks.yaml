    # 作者简介


    **Shahab D. Mohaghegh** 是人工智能（AI）和机器学习在油探与生产行业应用的先驱，担任西弗吉尼亚大学（WVU）石油与天然气工程教授，并兼任
    Intelligent Solutions, Inc. (ISI) 的总裁兼首席执行官。他是 `WVU-LEADS`（`L`aboratory for `E`ngineering
    `A`pplication of `D`ata `S`cience）实验室的主任。


    在石油工程应用 AI 和机器学习领域拥有 30 多年的研发经验外，他还写了四本书（《页岩分析》、《数据驱动的储层建模》、《数据驱动分析在 CO[2] 地质封存中的应用》、《智能代理建模》），并发表了
    230 多篇技术论文，为独立公司、国家石油公司（NOC）和国际石油公司（IOC）开展了 60 多个项目。他是石油工程师协会（SPE）卓越讲师（2007 年和
    2020 年），并曾四次在 SPE 的《石油技术杂志》（JPT 2000 年和 2005 年）中作为卓越作者介绍 AI 议题。他是 SPE 技术分部的创始人，致力于人工智能和机器学习（石油数据驱动分析，2011
    年）。他因在墨西哥湾“深水地平线”（马康多，Macondo）事故发生后（2011 年）基于 AI 的技术贡献受到美国能源部长的表彰，并在两届政府中担任美国能源部非常规资源技术顾问委员会成员（2008–2014
    年）。他他还代表美国参加了国际标准组织（ISO）碳捕获与封存技术委员会（2014–2016 年）。


    # 引言


    DOI: [10.1201/9781003369356-1](https://doi.org/10.1201/9781003369356-1)


    人工智能改变世界的速度将比我们预想的要早得多。现在，你可能已经意识到人工智能的重要性，它被应用并融入到你经常处理的许多主题和项目中。显而易见，世界各地的人对了解和学习人工智能的细节，以及理解如何利用人工智能创造出每个人都能看到的有趣特征感兴趣。本书关于“科学与工程应用中的人工智能”，这与“通用应用中的人工智能”不同。在过去的几年里，互联网上简要提到了这两种人工智能应用之间的区别。它们被应用为人工工程智能（AEI）和通用人工智能（AGI）。在过去几年的互联网上，曾提到这两种人工智能是不相同的。过去几年的互联网上提到，AEI
    是“设计用于执行工程任务”，而 AGI 是“设计用于学习并执行任何任务”。还提到 AEI “能够以特定方式推理和解决问题”，而 AGI “能够以通用方式推理和解决问题”，且
    AEI “仍在发展中”，而 AGI “仍是一个理论概念”。


    这些是互联网上提到的一些有趣话题；然而，互联网上还提到的另一点是不正确的，书中将进行详细介绍。互联网上看起来错误的一点是，提到 AEI 是“基于工程原理的数学和计算模型”，而
    AGI 是“基于任何领域的知识”。这种定义现在是人工智能用于解决问题方面的一个主要问题之一，特别是关于物理现象。本书关于 AEI 正确定义和应用的重要性，以用于建模和解决物理现象，这将比过去一个世纪物理现象建模和解决的方法要好得多。这就是为什么目前人工智能被用于解决许多不同类型的科学和工程问题，但没有提供正确的结果，并且没有表征人工智能如何被全面地增强建模和解决物理现象。注意的是，使用人工智能解决不同类型的问题需要不同的技术。


    第一个原因是，人工智能专家试图模拟、建模和解决物理现象的科学和工程相关问题，但对这些特定的物理现象（石油、化学、机械、土木及任何其他工程）没有专业知识。


    第二个原因是，特定物理现象的科学工程专家（石油、化学、机械、土木及任何其他工程）缺乏人工智能的专业知识。当这些物理现象的科学工程专家试图使用人工智能来模拟、建模和解决物理现象的科学和工程相关问题时，他们的结果最终也与人工智能无关。他们最终只是用过去一个世纪完全相同的方法解决此类问题，但现在他们称之为
    AI 或机器学习的结果。


