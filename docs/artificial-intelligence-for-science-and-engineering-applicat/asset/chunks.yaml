    既然“过去十年中科学家和工程师在应用人工智能和机器学习方面所产生的问题已经提到”，接下来的事项是明确人工智能在科学和工程应用中的实际需求。正如本章开头提到的以及图
    3.13 所示，人工智能对科学和工程应用的需求是：(1) 精通人工智能所应用的特定科学和工程主题的专业知识，以及 (2) 精通人工智能和机器学习的专业知识。


    ![图 3.13 人工智能工程应用的特征。](img/Fig03_13.jpg)


    图 3.13 人工智能工程应用的特征。


    如图 3.14 所示，在过去的十年里，所有工程行业都开始使用不具备任何特定工程专业知识的人工智能专家来解决他们的问题。随后，当 AI 建模和问题解决的结果非常糟糕时，工程领域专业知识在利用人工智能解决问题中的重要性变得变得如此重要。然而，在过去的几年里（甚至现在以及可能在未来几年内），开始使用人工智能的大多数工程领域专家的结果和方法与以前一样糟糕。此类问题的主要原因如图
    3.15 所示，归于他们对人工智能和机器学习的浅层理解。作为工程师，他们认为使用人工智能解决工程相关问题完全在于了解生成人工智能的机器学习算法的数学特性。这就是为什么绝大多数人将他们的方法称为“机器学习”而不是“人工智能”。图
    3.14 和 3.15 中左右两侧所示的这两种情况都需要被避免。利用人工智能解决科学和工程问题的最佳方式如图 3.16 的中间所示。希望摆钟能够左右摆动，并最终停在中间。


    ![图 3.14 最初，人工智能专家试图对人工工程智能问题进行建模和解决，结果完全不好。](img/Fig03_14.jpg)


    图 3.14 最初，人工智能专家试图对人工工程智能问题进行建模和解决，结果完全不好。


    ![图 3.15 后来，工程领域专家试图在没有人工智能专业知识的情况下，对人工工程智能问题进行建模和解决，结果仍然完全不好。](img/Fig03_15.jpg)


    图 3.15 后来，工程领域专家试图在没有人工智能专业知识的情况下，对人工工程智能问题进行建模和解决，结果仍然完全不好。


    ![图 3.16 人工智能工程应用的特征。](img/Fig03_16.jpg)


    图 3.16 人工智能工程应用的特征。


    科学和工程的专业知识并不是指包含数学方程。相反，科学和工程最重要的是对物理现象的理解。


    ## 人工智能专业知识


    过去几个世纪利用科学和工程对物理现象进行建模的传统方法是通过数学方程。这导致许多科学家和工程师认为，要成为人工智能专家，只需要了解用于生成人工智能的机器学习算法的数学方程细节即可。


