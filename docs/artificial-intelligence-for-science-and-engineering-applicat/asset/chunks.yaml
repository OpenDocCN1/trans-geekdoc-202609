    # 历史背景


    亚里士多德逻辑发展于中世纪，是一种经典的二值逻辑（要么为真或假，是或否，0 或 1，……）。在数据驱动的模型开发从最初的“人工智能”中被剔除几十年后，基于规则的“专家系统”成为了原始“人工智能”领域研究与开发的唯一关注点。由于仅基于于基于规则的“专家系统”，原始的“人工智能”在解决方案开发上显得相当局限，没有以一种能够让大量人员接触并发现研究这项技术有趣的方式来解决任何重大问题或困难。


    在这种背景下，纯粹基于规则“专家系统”的人工智能原始版本最终并没有成为一场新的技术革命，没有被广泛使用，也无法解决许多其他方式无法解决的问题。从这个角度来看，原始的人工智能并不是一个伟大且有趣的话题。这导致了一个事实：即当
    1986 年新型人工神经网络（如机器学习算法）被开发出来并能够解决线性和非线性相关问题时，这种原始技术的增强不再被称为“人工智能”。


    这一系列增强了原始“人工智能”并使其成为数据驱动技术的新型机器学习算法有了多个不同的名称，例如“计算智能”、“虚拟智能”、“软计算”、“智能系统”等等。关键在于，由于“人工智能”这一术语在使用基于规则的“专家系统”并没有产生任何积极、增强的技术以及有趣的问题解决方案，它不再被用作数据驱动模型开发和主要解决方案的术语。


    ## 神经网络的演变


    1986 年，被证明无法解决“非线性”问题的原始版本人工神经网络通过一种名为“反向传播”（Back Propagation）的算法发生了改变。这种新算法改变了原始版本人工神经网络（感知器）的所有特征。首先，新版本的人工神经网络不仅有“输入”和“输出”两层。如图
    2.6 所示，这种新版本的人工神经网络在“输入”层和“输出”层之间包含至少一层甚至更多层的神经元。这种新层（层）被称为“隐藏层”，因为它不需要来自“输入”层或“输出”层的任何数据。包含在新版本人工神经网络中的这个新“隐藏层”包含几个隐藏神经元，其数量通常大于输入特征的数量。“隐藏层”内部这些大量的隐藏神经元将与“输入”层和“输出”层中的所有数据和特征连接。


    ![图 2.6 新版本的人工神经网络，在输入和输出之间包含多层神经元，并通过反向传播改变神经元之间的权重。](img/Fig02_06.jpg)


    **图 2.6** 新版本的人工神经网络，在输入和输出之间包含多层神经元，并通过反向传播改变神经元之间的权重。


    此外，新版本的人工神经网络不仅是一个“前向传播”过程，还通过“反向传播”算法包含“反向反馈”过程，以修改和增强多层之间所有神经元之间的连接。除了目前被称为人工智能机器学习算法的人工神经网络新版本，其他机器学习算法也是人工智能的一部分，例如模糊集理论和进化计算。如图
    2.7 所示，当前版本的人工智能不再包含基于规则的“专家系统”。


    ![图 2.7 基于规则的系统在 20 世纪 80 年代从新版本的人工智能中移除。](img/Fig02_07.jpg)


    **图 2.7** 基于规则的系统在 20 世纪 80 年代从新版本的人工智能中移除。


    ## 未来方向与多值逻辑


    然而，很有可能在不久的将来，被称为人工智能的当前革命性技术将使用基于规则的技术，并结合数据驱动技术进行模型开发。鉴于这种革命性的人工智能模拟了自然智能并模仿人脑，它需要遵循人脑使用逻辑。众所周知，人脑在处理过程中并不使用二值逻辑。当我们被问及“你好吗？”时，从不只用“好”或“坏”，而是回答“我很好”、“还可以”或“我不太好”，……与其使用二值逻辑，人脑使用的是多值逻辑。


    因此，与其使用二值逻辑，如果基于规则的建模、决策和问题解决可以使用模糊集理论使用多值逻辑，那么革命性的人工智能就可以将规则算法与其他机器学习算法相结合，以推进科学工程的分析、建模、决策和问题解决。如图
    2.8 所示，人工智能（不一定确定）可以回到以前结合基于数据建模和基于规则建模的形式来建模和解决问题，区别在于使用了多值逻辑而非简化的“二值”逻辑。


    ![图 2.8 未来版本的人工智能可能还会包含基于规则的系统，但比起二值逻辑，它可能使用多值逻辑（模糊集理论），像人脑一样。](img/Fig02_08.jpg)


    **图 2.8** 未来版本的人工智能可能还会包含基于规则的系统，但比起二值逻辑，它可能使用多值逻辑（模糊集理论），像人脑一样。


    ## 使用“人工智能”术语


    如前，从 1986 年开始，反向传播算法开始用于人工神经网络。这使得人们对使用这种机器学习算法解决问题产生了巨大的兴趣。绝大多数此类应用都是电气电子工程师学会（IEEE）完成的。然而，由于人工智能已成为纯粹的基于规则的技术，且其特征并未在科学家中产生严肃的问题解决兴趣，因此当这种新版本的人工神经网络被解决问题时，没有人使用“人工智能”这一术语。


