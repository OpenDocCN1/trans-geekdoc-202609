    In this chapter, in [Figure 3.2](#C_006_c3.xhtml#f3_2), it was shown that the
    non-linear separation of two colors of black and yellow circles can be done by
    General Intelligence even by young children who may not have been to school or
    have not yet learned any mathematics. However, if the same young children (individuals)
    are asked to perform a “Linear Separation” of the two colors of black and yellow
    circles instead of a circle (non-linear separation), they will not be able to
    do it since they are not familiar with mathematical equations that can make the
    black and yellow circles be able to be separated by a linear line, as shown in
    [Figure 3.7](#C_006_c3.xhtml#f3_7).


    ![FIGURE 3.7 Linear separation of black and yellow circles using a mathematical
    equation.](images/Fig03_07.jpg)


    [FIGURE 3.7](#C_006_c3.xhtml#f3_7b) Linear separation of black and yellow circles
    using a mathematical equation.


    Today, Artificial Intelligence is a technology that almost everyone is interested
    in. This technology has proven to accomplish so much while being incorporated
    in so many areas, such as social media, online search, the stock market, the interaction
    of companies with their individual clients, such as Netflix, banks, insurance
    companies, travel agencies, and even security. Therefore, it makes sense when
    engineers express interest in incorporating this technology into their everyday
    work. Given the fact that science and engineering applications of Artificial Intelligence
    are not exactly the same as the application of this technology to non-engineering-related
    problems, there have been some issues associated with how some scientists and
    engineers in academia and industry have been using this technology to solve engineering-related
    problems. The next item that must be noted is answering the following questions.
    The answers that are given to these three simple questions should be quite easy
    and very honest.


    ### Question 1

    Is there a difference between General Intelligence and Science and Engineering
    Intelligence?


    ### Answer 1

    Yes, Indeed.


    ### Question 2

    What is the reason for answering “Yes” to the above question?


    ### Answer 2

    Because General Intelligence is included in every Homo sapiens, those who like
    to have Science and Engineering Intelligence must go through important learning.


    ### Question 3

    How would Science and Engineering Intelligence learning happen in Homo sapiens?


    ### Answer 3

    To generate the Science and Engineering Intelligence Homo sapiens must go to high
    school and university and must at least receive a bachelor’s degree.


    These questions and answers should be very simple and clear. No one can become
    a scientist or an engineer without going to university and receiving a bachelor’s,
    master’s, or PhD. After completing the university, they will go to industries
    and academia and work on these topics for years. These are the items that make
    them scientists and engineers and increase their intelligence from General Intelligence
    to Science and Engineering Intelligence, which already includes the General Intelligence
    as well.


    In order to explain what needs to be done and what needs to be avoided when Artificial
    Intelligence and Machine Learning are used to solve science- and engineering-related
    problems, let us start with the names of these technologies: “Artificial Intelligence”
    and “Machine Learning”. “Artificial Intelligence” has to do with “Intelligence”
    that is not “Natural” but rather “Artificial”, and “Machine Learning” has to do
    with “Learning” that is applied to “Machines” and computers, not to “Humans”.
    Therefore, the two words to be defined and discussed are “Intelligence” and “Learning”.


    “Intelligence” is defined as the ability to acquire, retain, and apply knowledge;
    learn from experience; adapt to new situations; and solve problems and “Learning”
    is defined as the process of acquiring new understanding, knowledge, and skills.
    After defining these two items, let’s start by asking two simple questions about
    engineering problem-solving:


    1. Can human-level General “Intelligence” be used to solve science- and engineering-related
    problems?

    2. Do humans need to “Learn” anything specific to be able to solve science- and
    engineering-related problems?


    The answers to the above two questions are quite obvious. To become a scientist
    or engineer, humans need to go to university after they get their high school
    diploma. Then, after 4 years of “Learning” at the university, they become scientists
    or engineers with bachelor’s degree. Furthermore, “Learning” at the university
    goes beyond just providing information to the students through books, videos,
    and articles. Science and engineering students go through an extensive learning
    process in 4 years for bachelors, 6 years for bachelors and masters, and 10 years
    for bachelors, masters, and Ph.D.s, before becoming scientists or engineers. It
    is also important to note that “Learning” at the university includes “Teaching”.
    These simple answers to the questions regarding “Intelligence” and “Learning”
    mean that the application of Artificial Intelligence in science- and engineering-related
    problem-solving (*a*) requires science and engineering knowledge and domain expertise,
    and (*b*) requires “Teaching” through detailed understanding and communication
    of the data to the machine learning algorithms.


    This goes way beyond just throwing the available data to the Artificial Intelligence
    and Machine Learning algorithms to solve problems, as is mostly done when people
    use traditional statistics for data analysis. Normally, when traditional statistics
    is used to solve problems, all that matters is “Correlations”, and it usually
    has nothing to do with “Causation” (cause and effect relationships when modifications
    in one of the variables produce modifications in another variable). On the other
    hand, all scientists and engineers are incredibly interested in understanding
    “Causation”, above and beyond just “Correlations”. This is what is being called
    “Explainable AI – XAI”. The science and engineering application of Artificial
    Intelligence and Machine Learning requires “Explainable AI – XAI” in order to
    be able to generate details about how and why certain predictions are made, beyond
    just “Correlations”. This topic “Explainable Artificial Intelligence” is covered
    in [Chapter 7](#C_010_c7.xhtml) of this book.


    When the Science and Engineering natural Intelligence of humans requires a significant
    amount of learning above natural General Intelligence, does it make sense that
    the same thing would be applicable to Artificial Intelligence? It means that there
    are differences between *Artificial* Science and Engineering Intelligence and
    *Artificial* General Intelligence in the same fashion that there are differences
    between *Natural* Science and Engineering Intelligence and *Natural* General Intelligence.
    This must be obvious. However, unfortunately a lot of people that are interested
    in Artificial Intelligence do not realize the importance of such differences.
    Such differences between *Artificial* Science and Engineering Intelligence and
    *Artificial* General Intelligence provide characteristics on how they should be
    generated and used to solve science- and engineering-related problems versus non-science-
    and non-engineering-related problems using *Artificial* Intelligence.

