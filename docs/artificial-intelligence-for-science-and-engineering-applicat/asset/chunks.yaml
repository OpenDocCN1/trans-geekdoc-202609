    injection rate, and total amount of water that is injected. The XAI in this paper
    explains the impact of these parameters on the well productivity (5-Year Cumulative
    Gas Production). Such explanations of the influence of these parameters on well
    productivity are used to identify well productivity optimization as a function
    of the number of perforations, injection rate, and total amount of water that
    is injected. [Figure 7.28](#C_010_c7.xhtml#f7_28), which shows Figure 7 of this
    paper, explains the conditions under which the well productivity (5-Year Cumulative
    Gas Production) can reach its maximum value. For this particular well (Carlson,
    Thomas #075), the 5-Year Cumulative Gas Production can reach its maximum value
    of 57,050 MSCF as long as the number of perforations and the rate of injection
    are kept at their minimum values (injection rate at 25 bbl./min and 8 perforations)
    and can reach its maximum value of 63,400 MSCF as long as the number of perforations
    and the rate of injection are kept at their maximum values (60 bbl./min for injection
    rate and 26 perforations).


    As shown in [Figure 7.28](#C_010_c7.xhtml#f7_28), while these parameters (the
    number of perforations and the rate of injection) are kept at their minimum value,
    the highest 5-Year Cumulative Gas Production (57,050 MSCF) is achieved at 680
    barrels of water. On the other hand, when these values are kept at their maximum,
    the highest 5-Year Cumulative Gas Production (63,400 MSCF) is achieved at about
    725 barrels of water injected. The conclusion may be that for this well, the ideal
    water injection volume is about 700 barrels. This SPE paper includes two more
    similar figures showing an explanation for two more wells in the same field ([Figure
    7.29](#C_010_c7.xhtml#f7_29)).


    ![FIGURE 7.29 SPE 77597 paper’s Figure 8. Sensitivity of the post-restimulation
    actual peak (after an average restimulation job) to different values of three
    parameters being studied, namely, amount of sand, amount of fluid, and number
    of perforations for the well Bohlender 8-5.](images/Fig07_29.jpg)


    [**FIGURE 7.29**](#C_010_c7.xhtml#f7_29b) SPE 77597 paper’s Figure 8. Sensitivity
    of the post-restimulation actual peak (after an average restimulation job) to
    different values of three parameters being studied, namely, amount of sand, amount
    of fluid, and number of perforations for the well Bohlender 8-5.


    Similar to the paper that was published in 2001, the second technical paper that
    included XAI was an SPE paper (SPE 77597) that was presented at ATCE and was published
    in 2002 \[[27](#Z_011_references.xhtml#r27)\]. This paper is also about the application
    of AI and Machine Learning in modeling re-fracturing (re-stimulation) in DJ-Basin,
    Colorado. [Figure 7.29](#C_010_c7.xhtml#f7_29) is an explanation of the modification
    of the well productivity as a function of parameters such as the amount of injected
    proppant (sand) and fluid as well as the number of perforations. In this figure,
    the monthly barrel of oil equivalent as well as productivity are shown for Bohlender
    8-5 wells during the re-fracturing process.


    The third technical paper that included XAI was an SPE paper (SPE 77659) that
    was also published in 2002 \[[28](#Z_011_references.xhtml#r28)\]. This paper covers
    purely data-driven modeling of BP’s Prudhoe Bay (Alaska, USA) surface facility
    using Artificial Intelligence and Machine Learning. This paper includes figures
    that generate XAI covering separator pressure, temperature, hydrocarbon rates,
    and compressor inlet suction pressure of eight different three-phase separator
    facilities. [Figures 7.30](#C_010_c7.xhtml#f7_30) and [7.31](#C_010_c7.xhtml#f7_31)
    show two such figures from this SPE paper.


    ![FIGURE 7.30 SPE 77659 paper’s Figure 13. Rate vs. pressure curves for FS1 (three-phase
    separator facility) at 50 degrees of temperature and different compressor inlet
    suction pressures.](images/Fig07_30.jpg)


    [**FIGURE 7.30**](#C_010_c7.xhtml#f7_30b) SPE 77659 paper’s Figure 13. Rate vs.
    pressure curves for FS1 (three-phase separator facility) at 50 degrees of temperature
    and different compressor inlet suction pressures.


    ![FIGURE 7.31 SPE 77659 paper’s Figure 15. Rate vs. pressure curves for FS3 (three-phase
    separator facility) at 50 degrees of temperature and different compressor.](images/Fig07_31.jpg)


    [**FIGURE 7.31**](#C_010_c7.xhtml#f7_31b) SPE 77659 paper’s Figure 15. Rate vs.
    pressure curves for FS3 (three-phase separator facility) at 50 degrees of temperature
    and different compressor.


    The fourth technical paper that included XAI was an SPE paper (SPE 89033) that
    was published in 2004 \[[29](#Z_011_references.xhtml#r29)\] and included more
    examples of XAI from Prudhoe Bay’s surface facility’s purely data-driven model.
    This paper includes seven figures that cover XAI of Prudhoe Bay’s surface facility.
    [Figures 7.32](#C_010_c7.xhtml#f7_32) and [7.33](#C_010_c7.xhtml#f7_33) show two
    such figures from this SPE paper.


    ![FIGURE 7.32 SPE 89033 paper’s Figure 12. FS2 (3-phase separator facility) rate
    behavior as a function of pressure @ FS2 and FS1A rates.](images/Fig07_32.jpg)


    [**FIGURE 7.32**](#C_010_c7.xhtml#f7_32b) SPE 89033 paper’s Figure 12. FS2 (3-phase
    separator facility) rate behavior as a function of pressure @ FS2 and FS1A rates.


    ![FIGURE 7.33 SPE 89033 paper’s Figure 19. GC3 (3-phase separator facility) rate
    behavior as a function of pressure @ GC3 and CCP rates.](images/Fig07_33.jpg)


    [**FIGURE 7.33**](#C_010_c7.xhtml#f7_33b) SPE 89033 paper’s Figure 19. GC3 (3-phase
    separator facility) rate behavior as a function of pressure @ GC3 and CCP rates.'
