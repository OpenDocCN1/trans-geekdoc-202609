- fmt: '

    In the IEEE, instead of Artificial Intelligence this technology was named “Computational
    Intelligence”, and in many other cases, several other names were used instead
    of “Artificial Intelligence”. For example, in the monthly journal of the *Society
    of Petroleum Engineering* (SPE), the *Journal of Petroleum Technology* (JPT),
    three articles was written in the year 2000 about Artificial Neural Networks `[[3](#Z_011_references.xhtml#r3)]`,
    Evolutionary Computing `[[4](#Z_011_references.xhtml#r4)]`, and Fuzzy Logic `[[5](#Z_011_references.xhtml#r5)]`.
    In all these three articles, we referred to “Virtual Intelligence”. Other names
    that were referred to instead of “Artificial Intelligence” included “Soft Computing”.


    Finally, in the mid-2000s, when Deep Learning and Convolutional Neural Networks
    were used for image recognition in a fashion that was exposed to general people
    throughout the world by Google, the term “Artificial Intelligence” started to
    be used instead of “Computational Intelligence”, “Virtual Intelligence”, “Soft
    Computing”, etc.


    Familiarity with the physics-based and non-physics-based history of Artificial
    Intelligence and Machine Learning provides some important perspective for those
    who are interested in the application of this technology in science- and engineering-related
    disciplines. For example, it is interesting to know that from the late 1980s until
    the end of the 1990s, many of the scientists and innovators who had initiated
    the application of this technology in many science- and engineering-related areas
    intentionally avoided using the term “Artificial Intelligence” to describe their
    research and development efforts.


    During the 1990s, applications of Machine Learning algorithms such as Artificial
    Neural Networks, Fuzzy Set Theory, and Evolutionary Computations in science and
    engineering were referred to as “Computational Intelligence”, “Virtual Intelligence”,
    “Soft Computing”, and a few other names. In the mid-2000s, when image recognition
    technology was generated using a combination of traditional statistics and multi-layer
    Artificial Neural Networks, the name “Artificial Intelligence” started to be used
    far more often. At this point in time, the term “Artificial Intelligence” is the
    main name of the technology that is mentioned when Machine Learning algorithms
    are used to model or solve problems. It would be interesting to know why the use
    of the name “Artificial Intelligence” was being avoided for about two decades,
    from the mid-1980s to the mid-2000s.


    There were enough reasons for such avoidance that they even influenced IEEE decision-making
    in this area. IEEE is the original homeland of the overwhelming set of technologies
    that were developed and are now contributing to Artificial Intelligence and Machine
    Learning. When IEEE decided to form a scientific section (council/society) for
    this technology, it modified the “IEEE Neural Network Council” that was formed
    in 1989 and later in 2001 was changed to “IEEE Neural Network Society” and started
    calling it “IEEE Computational Intelligence Society” in 2003, not “IEEE Artificial
    Intelligence Society” (`[Figure 2.9](#C_005_c2.xhtml#f2_9)`).


    ![FIGURE 2.9 IEEE’s computational intelligence website.](images/Fig02_09.jpg)


    [**FIGURE 2.9**](#C_005_c2.xhtml#f2_9b) IEEE’s computational intelligence website.


    ## Main reason the term “Artificial Intelligence” was avoided


    The main reason the term “Artificial Intelligence” was avoided was that the term
    “Artificial Intelligence” was used instead of “Computational Intelligence”, “Virtual
    Intelligence”, “Soft Computing”, etc., when Deep Learning and Convolutional Neural
    Networks were used for image recognition by Google.


    It is interesting to know that from the late 1980s until the end of the 1990s,
    many of the scientists and innovators intentionally avoided using the term “Artificial
    Intelligence” to describe their research and development efforts.


    During the 1990s, applications of Machine Learning algorithms such as Artificial
    Neural Networks, Fuzzy Set Theory, and Evolutionary Computations in science and
    engineering were referred to as “Computational Intelligence”, “Virtual Intelligence”,
    “Soft Computing”, and a few other names. In the mid-2000s, when image recognition
    technology was generated using a combination of traditional statistics and multi-layer
    Artificial Neural Networks, the name “Artificial Intelligence” started to be used
    far more often.


    There were enough reasons for such avoidance that they even influenced IEEE decision-making
    in this area. IEEE is the original homeland of the overwhelming set of technologies
    that were developed and are now contributing to Artificial Intelligence and Machine
    Learning. When IEEE decided to form a scientific section (council/society) for
    this technology, it modified the “IEEE Neural Network Council” that was formed
    in 1989 and later in 2001 was changed to “IEEE Neural Network Society” and started
    calling it “IEEE Computational Intelligence Society” in 2003, not “IEEE Artificial
    Intelligence Society” (`[Figure 2.9](#C_005_c2.xhtml#f2_9)`).


    ## Note


    [**Note](#C_005_c2.xhtml#f2_9b) IEEE’s computational intelligence website.


