    [Figures 6.2](#C_009_c6.xhtml#f6_2) and [6.3](#C_009_c6.xhtml#f6_3) show examples
    of actual measured data from conventional and unconventional resources that are
    being used to produce oil and gas. These plots clearly show that the actual field
    measurements that are collected hardly show any correlations with the oil and
    gas productions that are the main characteristics of the petroleum companies throughout
    the world. When the complexities of the actual measured data are used to model
    such physical phenomena using Artificial Intelligence and machine learning, the
    overwhelming majority of the vendors and service companies in the oil industry
    end up not being able to develop AI-systems and AI-models for such complex physical
    processes.


    ![FIGURE 6.2 Actual measured data from a field in Southeast Asia. All three plots
    show oil production versus gas lift (on the left), completion (in the middle),
    and porosity (on the right).](images/Fig06_02.jpg)


    [FIGURE 6.2](#C_009_c6.xhtml#f6_2b) Actual measured data from a field in Southeast
    Asia. All three plots show oil production versus gas lift (on the left), completion
    (in the middle), and porosity (on the right).


    ![FIGURE 6.3 Actual measured data from a Marcellus Shale field in Southwest Pennsylvania.
    All three plots show gas production versus stimulated lateral length (on the left),
    total number of stages (in the middle), and total amount of proppants (on the
    right).](images/Fig06_03.jpg)


    [FIGURE 6.3](#C_009_c6.xhtml#f6_3b) Actual measured data from a Marcellus Shale
    field in Southwest Pennsylvania. All three plots show gas production versus stimulated
    lateral length (on the left), total number of stages (in the middle), and total
    amount of proppants (on the right).


    Since such marketing companies are unable to achieve their AI-based solutions
    using complex, actual measured data, they have come to the conclusion of generating
    what they currently call “Hybrid Models”. The definition of “Hybrid Models” is
    the combination of “Actual Field Measurements” with “Data Generated through Mathematical
    Equations”. It is a well-known fact that all data generated through mathematical
    equations include certain types of correlations between all the parameters (variables)
    that are included in the mathematical equation. When the large amount of data
    already includes well-known correlations, then such correlations are going to
    generate the pattern recognitions that are the main characteristics of the machine
    learning algorithms from the provided data. Since the overwhelming majority of
    mathematical equations already include assumptions, interpretations, and simplifications,
    their data generations that become included in the “Hybrid Models” will determine
    what and and type of pattern recognitions must be generated by the machine learning
    algorithms. This means that using “Hybrid Models” we are already telling Artificial
    Intelligence what kinds of solutions must be generated, rather than providing
    only actual measured data and asking Artificial Intelligence to generate the type
    of pattern from the actual data to find the reality of the physical phenomena
    that are being solved. The type of mathematical equations that are used to generate
    the data that is hybridized with the actual field measurements tells the machine
    learning algorithm what to do. This is the “Bias” that is the main issue in AI-Ethics.


    Here’s an example of what was mentioned in the above paragraph. [Figure 6.4](#C_009_c6.xhtml#f6_4)
    provides an example of a series of actual field measurements from two (out of
    several) of the variables in a field that vendors and service companies are trying
    to use to develop an AI-based model. Let’s assume that they try hard for model
    development, and their limited understanding of the science and engineering application
    of Artificial Intelligence makes them unable to develop a reasonable AI-based
    model. Once they are unable to do that, then they will start working with “Hybrid
    Models”. One of the companies uses a specific mathematical equation that can generate
    data for several variables.


