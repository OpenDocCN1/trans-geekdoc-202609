    # 4 Modeling Physics Using Artificial Intelligence


    DOI: [10.1201/9781003369356-5](https://doi.org/10.1201/9781003369356-5)


    Modeling physics using Artificial Intelligence involves facts, reality, and actual
    measurements while avoiding assumptions, interpretations, and simplifications.
    In this chapter, we start with a short repetition of the last chapter and then
    concentrate on the topic of this chapter. It is quite interesting to note and
    discuss the topic of differences between developing models of “Physical Phenomena”
    and developing models of “General Phenomena” through Artificial Intelligence.
    Furthermore, it is important to note: “If there are differences between solving
    physics-based problems and general problems using Artificial Intelligence”? To
    be able to correctly answer these questions, it would be interesting to first
    respond to another very simple question. The response to this very simple question
    would be quite easy and would be helpful to answer the first two questions (mentioned
    above in this paragraph) about Artificial Intelligence.


    Here is a simple question that anyone can answer quickly.


    ## Question 1


    Using “Human Intelligence”, are there any differences between modeling and/or
    solving “Physical Phenomena” versus modeling and solving “General Phenomena”?
    A reasonable example of this question would be: using “Human Intelligence”, are
    there any differences between “Modeling CO2 Injection into Saline Aquifer for
    the positive impact of Climate Change” versus “Identification of Images such as
    the difference between a Cat and a Dog”?


    ## Answer 1


    Yes, indeed. There are differences between modeling and/or solving physical phenomena
    and general phenomena using “Human Intelligence”. To model or solve physical phenomena,
    humans need to go to school and university for several years and become experts
    in the specific type of physical phenomena that they need to solve. “Human General
    Intelligence” is good enough to solve “General Phenomena”.


    The above answer about “Human Intelligence” is very straight and quite simple
    to agree with. Since “Artificial Intelligence” is a process to use machine learning
    algorithms to simulate “Human Intelligence”, it must go through the same process
    as “Human Intelligence” to model and/or solve physical phenomena. When this is
    mentioned, many individuals will then ask:


    ## Question 2


    How can we make machines (computers – machine learning algorithms) to go to school
    and university for several years and become experts in the specific type of physical
    phenomena that is needed to be solved through “Artificial Intelligence”?


    That is a good and correct question. Here is the answer to this question:


    ## Answer 2


    First and foremost, machines (computers – machine learning algorithms) do not
    need (and of course it’s impossible) to go to school and university to be experts
    in physical phenomena. But there are other ways to “Teaching” Machine “Learning”
    algorithms. Since “Learning” of physical phenomena requires “Teaching”, the teacher
    of physical phenomena to machine learning algorithm must be an expert in the specific
    physical phenomena topic. The next important item would be about the techniques
    that the physical phenomenon expert must use to “Teaching” Machine “Learning”
    algorithms. It is important to note that this “Teaching” to the Machine “Learning”
    algorithms would be all about dealing with the available facts, reality, and actual
    measured data.'
