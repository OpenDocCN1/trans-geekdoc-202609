- fmt: '

    Since all the variables and parameters that are included in the mathematical equations
    are correlated to each other, generating data using mathematical equations for
    such variables and parameters to be included in the data-driven modeling is asking
    Machine Learning Algorithm to follow (and actually use) the mathematical equations
    that has generated the data to solve the problem. The same approaches have been
    happening through the traditional approach of solving science- and engineering-related
    problems. This approach clearly proves the lack of understanding of the science
    and engineering applications of Artificial Intelligence.


    Solving science- and engineering-related problems through Artificial Intelligence
    is only based on actual and real data that does not include any assumptions, interpretations,
    or simplifications. This means that the correct application of Artificial Intelligence
    to solve science- and engineering-related problems must not include any data that
    is generated through mathematical equations. Expertise in specific science and
    engineering topics is required to fully understand and use the actual (measured)
    and real data to `teach` the Machine Learning Algorithms about physical phenomena.


    An AI-based approach is used to produce science and engineering solutions through
    learning from the actual (measured) and real data and performing pattern recognition
    by parallel, distributed information processing of the actual (measured) and real
    data. The mistakes that have been quite commonly used by scientists and engineers
    in the past decade include data generation using mathematical equations to be
    combined with actual data that has been collected and measured. More details on
    this topic will be discussed in [Chapter 6](#C_009_c6.xhtml).


    ### Problem #3: Using the Machine Learning Algorithms that have been Developed
    and Used to Solve Artificial General Intelligence-Related Problems


    To a large extent, currently and in the past decade, the overwhelming majority
    of scientists and engineers end up using the machine learning algorithms that
    have been developed to solve General Intelligence problems using Artificial Intelligence
    such as `CNNs`, `LSTM`, etc.… The fact is that such algorithms that have been
    developed and used to solve Artificial General Intelligence such as image recognition,
    voice recognition, language translations, caption generation, face recognition,
    object recognition, autonomous vehicles, etc. should not be used exactly in the
    same fashion to solve engineering-related problems.


    `CNNs` that work for image recognition go through two major processes. The first
    part is convolution of the image metrics, and the second part is using the Artificial
    Neural Network to train the convolved image metrics, as shown in [Figure 3.8](#C_006_c3.xhtml#f3_8).
    Convolution is the merging of information through the combination (convolving)
    of mathematical functions to create a new function. As shown in [Figure 3.9](#C_006_c3.xhtml#f3_9),
    [Figure 3.10](#C_006_c3.xhtml#f3_10), [Figure 3.11](#C_006_c3.xhtml#f3_11), [Figure
    3.12](#C_006_c3.xhtml#f3_12), the convolutional process includes several types
    of filtering processes, such as `Kernel`, `Pooling`, and `Flattening` of the initial
    metrics of the images that are being used for the training Neural Network.


    ![FIGURE 3.8 The process of convolutional neural networks (CNN) that is used for
    image recognition. CNN is a combination of modifications to the image (convolution
    using Kernel, Pooling, and Flattening) and neural network.](images/Fig03_08.jpg)


    [FIGURE 3.8](#C_006_c3.xhtml#f3_8b) The process of convolutional neural networks
    (CNN) that is used for image recognition. CNN is a combination of modifications
    to the image (convolution using `Kernel`, `Pooling`, and `Flattening`) and neural
    network.


    The objective of convolution is to extract useful features from the images that
    are being used for the training of the image recognition process. [Figure 3.8](#C_006_c3.xhtml#f3_8)
    shows 10 × 10 pixels of the image being used, and [Figures 3.9](#C_006_c3.xhtml#f3_9)
    and [3.10](#C_006_c3.xhtml#f3_10) show 5 × 5 pixels of the images (in 0 and 1)
    that are being used for the image recognition training.


    ![FIGURE 3.9 Convolution layer using Kernel.](images/Fig03_09.jpg)


    [FIGURE 3.9](#C_006_c3.xhtml#f3_9b) Convolution layer using `Kernel`.


    ![FIGURE 3.10 Convolution is performed on the input image through filtering/Kernel.](images/Fig03_10.jpg)


    [FIGURE 3.10](#C_006_c3.xhtml#f3_10b) Convolution is performed on the input image
    through filtering/`Kernel`.


    The example of the `Kernel` process is shown in [Figure 3.9](#C_006_c3.xhtml#f3_9)
    in a step-by-step process and in [Figure 3.10](#C_006_c3.xhtml#f3_10) when the
    entire process shown in [Figure 3.9](#C_006_c3.xhtml#f3_9) has been completed.
    [Figure 3.11](#C_006_c3.xhtml#f3_11) shows the example of `Pooling Layers` where
    the maximum value of each series of the `Kernel` is used, and finally, [Figure
    3.12](#C_006_c3.xhtml#f3_12) shows that the `Flattening` process takes the final
    calculated matrix into a single input series.


    ![FIGURE 3.11 Pooling layer after the convolution layer on the matrix of the images.](images/Fig03_11.jpg)


    [FIGURE 3.11](#C_006_c3.xhtml#f3_11b) Pooling layer after the convolution layer
    on the matrix of the images.


    ![FIGURE 3.12 Flattening is the pooling layer on the matrix of the images.](images/Fig03_12.jpg)


    [FIGURE 3.12](#C_006_c3.xhtml#f3_12b) Flattening is the pooling layer on the matrix
    of the images.


    ### Problem #4: Using Traditional Statistical Approaches since They Are Also Data-Driven


    Since the Artificial Intelligence approach is currently called data-driven, a
    large number of scientists and engineers (specifically in academia) think that
    Artificial Intelligence approach is the same as Traditional Statistics since it
    only uses data to solve problems. Unfortunately, they do not realize that Artificial
    Intelligence does not use the same techniques of problem-solving that have been
    used by Traditional Statistics in the past 150 years. They do not realize and
    may not even be interested in learning the technical and philosophical differences
    between Traditional Statistics and Artificial Intelligence. More details on this
    item are discussed in [Chapter 6](#C_009_c6.xhtml).


    ### Problem #5: Continuing the Traditional Engineering Approach to Problem-Solving
    Using Machine Learning Algorithms


    While science and engineering domain expertise is an absolute requirement to solve
    problems using Artificial Intelligence, a realistic and correct understanding
    and expertise of Artificial Intelligence are also required. It must be understood
    that Artificial Intelligence solves engineering-related problems in a quite different
    fashion than we have been solving science- and engineering-related problems in
    the past few centuries. It must be learned that when Artificial Intelligence is
    used to solve science- and engineering-related problems, its objective is to avoid
    (as much as possible) assumptions, interpretations, and simplifications. This
    is the fact that Artificial Intelligence separates and enhances the traditional
    problem-solving of science and engineering. The domain expertise in science and
    engineering will help to `teach` these important intelligent items to the machine
    `learning` algorithms.

    '
