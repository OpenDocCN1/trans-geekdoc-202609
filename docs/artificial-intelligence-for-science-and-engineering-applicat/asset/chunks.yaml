    另一个例子如图 3.2 所示。即使在孩子 7 岁上学之前，如果你向他们展示一系列黑色和黄色的圆圈，并问他们是否能用一条线将它们隔离开，孩子能够做到的可能性非常高。几乎
    99.99% 的孩子都能画出图 3.2 中所示的红线。图 3.1 和图 3.2 的示例说明，人类的通用智能即使在短暂的生命中，也能让我们解决许多问题。目前，我们正在使用人工智能以极快的速度解决相同类型的问题。在当前的人工智能版本之前，解决图
    3.1 所示的问题无法由计算机轻松快速地完成，而像今天这样使用名为`卷积神经网络`（`CNN`）的机器学习算法通过人工智能就能完成了。


    ![FIGURE 3.2 黑色和黄色的圆圈可以用非线性线分开。](img/Fig03_02.jpg)


    `FIGURE 3.2` 黑色和黄色的圆圈可以用非线性线分开。


    同样重要的是，当最近询问 ChatGPT 和 Google Bard 关于通用的人工智能应用以及工程相关的问题建模和解决时，它们提到：“通用智能旨在跨多个领域复制人类的智能，而工程智能则侧重于为特定任务或应用构建专门的人工智能系统。通用智能代表了一个更全面、更广泛的目标，而工程智能则处理人工智能在特定领域的实用和针对性的实现。需要注意的是，这些仅仅是人工智能的两种不同方法。还有许多其他定义和分类人工智能的方法。然而，通用智能和工程智能是最常用的两种方法”。


    通用智能最终涵盖了人的整个生命，并具有特别重要且复杂的特征。我强烈建议通过阅读尤瓦尔·诺亚·哈拉里撰写的书籍《人类简史》（*Sapiens: A Brief
    History of Humankind*）\[6\]来了解智人的重要历史。在科学和工程智能在我们历史上大约 300 年前开始之前，人类的通用智能已经涵盖了我们近
    10 万年的历史。在智人之前，其他人类物种如尼安德特人、直人（*Homo erectus*）以及……拥有一定程度的通用智能（与智人具有的数量和类型不同），这些智能从未改变或增强为科学工程智能。然而，这确实发生在智人身上，并改变了我们历史的一切。


    为了涵盖智人的通用智能，涵盖并理解人类历史发生的事情很重要。根据查尔斯·达尔文的书\[7\]，可能“非洲是人类的摇篮，因为我们两个最近的现代亲属（黑猩猩和大猩猩）居住在那里”（图
    3.3）。虽然直人大约在一百万年前离开了东非，尼安德特人大约在 40 万年前离开了东非，但他们从未从采集狩猎者转变为其他。图 3.4 显示了直人、尼安德特人（Homo
    Neanderthalensis）和智人从东非到世界其他地区的移动。


    ![FIGURE 3.3 人类从黑猩猩和大猩猩的演化。](img/Fig03_03.jpg)


    `FIGURE 3.3` 人类从黑猩猩和大猩猩的演化。


    ![FIGURE 3.4 直人、尼安德特人（Homo Neanderthalensis）和智人（Homo sapiens）从东非到世界其他地区的移动。](img/Fig03_04.jpg)


    `FIGURE 3.4` 直人、尼安德特人（Homo Neanderthalensis）和智人（Homo sapiens）从东非到世界其他地区的移动。


    *智人*从非洲进入今天所谓的“中东”和“欧洲”大约在 7 万年前。他们作为“采集狩猎者”生活了大约 5 万年。“农业革命”发生在 1 万年前。这是智人相对于尼安德特人和直人生活方式的重大变化。这展示了人类智能的增强。


    下一次我们（智人）的革命发生在 18 世纪，“工业革命”使得执行许多操作变得比以前更快、更简单、更快捷。这一定与智人及其通用智能有关。


    ![FIGURE 3.5 智人 300 年以前的工业革命。](img/Fig03_05.jpg)


    `FIGURE 3.5` 智人 300 年以前的工业革命。

