    非常重要的一点是，开发这种“基于 AI 的页岩分析模型”并没有使用任何特定的数学方程（或通过基于方程的数据预设相关性）。图 7.10 对井（`ISWN#056MSWPADU`）的“受控侧向长度”进行了单参数敏感性分析，图
    7.11 对井（`ISWN#032MSWPACW-3`）进行了同样的分析，而图 7.12 对井（`ISWN#036MSWPACC-1`）也进行了分析。同样的单参数敏感性分析还针对“每层支撑剂量”进行了重复，分别在图
    7.13 井（`ISWN#089MSWPAK-1`）、图 7.14 井（`ISWN#056MSWPADU-1`）以及最后的图 7.15 井（`ISWN#076MSWPAHJ-2`）中进行。所有这些井和参数的模型行为从物理学角度来看都是完全合理的。这是页岩分析中
    XAI（可解释人工智能）的一个良好示例。


    #### 步骤 2：双参数敏感性分析


    同时分析两个参数的敏感性而非单个参数，将得到一个三维图。如图 7.16 所示，某口识别井的“6 个月产气”（图中的 `Z` 轴）的修改被解释为两个储层特征“孔隙度”和“初始水饱和度”修改的函数。虽然人工智能模型生成了该特定井的产量，但它解释了在保持所有其他输入参数不变的情况下，井产量如何随着这两个储层特征的变化而改变。


    ![FIGURE 7.16 此图显示了给定页岩井的烃类产量随两个变量（孔隙度和初始水饱和度）变化的敏感性，同时所有其他变量保持不变。](img/Fig07_16.jpg)


    FIGURE 7.16 此图显示了给定页岩井的烃类产量随两个变量（孔隙度和初始水饱和度）变化的敏感性，同时所有其他变量保持不变。


    值得注意的是，这种“基于 AI 的页岩分析”模型的解释完全符合物理逻辑，因为它解释了：随着储层孔隙度的增加和初始水饱和度的降低，井产量将会增加。再次，重要的是：(a)
    该区域的每口井都存在相同的总体趋势（井产量随孔隙度增加和初始水饱和度降低而增加），以及 (b) 没有使用任何数学方程来为这个“基于 AI 的页岩分析”模型的训练、校准和验证生成任何数据。


    #### 步骤 3：多参数敏感性分析


    当输入参数数量的敏感性分析增加到两个以上时，将无法再提供多维图表。执行多个输入参数（两个以上）敏感性分析的最常用方法是蒙特卡洛模拟（MCS）。在 MCS 中，对于使用多少输入参数进行多参数敏感性分析没有限制。


    “基于 AI 的页岩分析”模型被用作 MCS 的目标函数。一旦确定了敏感性分析的参数数量，就可以开始该过程。在本章这一部分的图 7.17 示例中，已确定了四个参数用于敏感性分析。如图
    7.17 所示，所确定的四个参数为：孔隙度 `[%`、初始水饱和度 `[%`、受控侧向长度 `[ft.]` 以及每层支撑剂量 `[lbs.]`。一旦确定了敏感性分析的参数数量，执行
    MCS 需要以下三个步骤：


    ![FIGURE 7.17 使用 MCS 进行多参数敏感性分析。预测模型被部署了数千次，以识别烃类产量随储层特征（孔隙度和初始水饱和度）和完层设计（受控侧向长度和每层支撑剂量）变化的潜在分布。](img/Fig07_17.jpg)


    FIGURE 7.17 使用 MCS 进行多参数敏感性分析。预测模型被部署了数千次，以识别烃类产量随储层特征（孔隙度和初始水饱和度）和完层设计（受控侧向长度和每层支撑剂量）变化的潜在分布。


    1. 确定每个参数的分布类型 `[均匀分布、三角形分布、高斯分布……分布]`，


    2. 生成结果必须执行 MCS 目标函数（在本例中“基于 AI 的页岩分析”模型）的次数（模型输出——此处：井产量），最后，


    3. 确定分箱（bins）的数量，以展示井产量随所有参数修改而变化的分布。


    上述三个步骤包含在图 7.17 中。该区域三口井的多参数敏感性分析结果显示在图 7.17（`ISWN#002MSWAD-1`）、图 7.18（`ISWN#018MSWPABE-2`）和图
    7.19（`ISWN#018MSWPABE-2`）中。在这些分析中，使用了四个参数（孔隙度、初始水饱和度、受控侧向长度和每层支撑剂量）来展示井产量对其修改的敏感性，同时保持每井的其他输入参数不变。蓝色柱状图显示了井产量随这些参数变化的分布，而红色曲线显示了分布的累和。


    ![FIGURE 7.18 AI 模型针对井 ISWN#018MSWPABE-2 部署了数千次，以识别烃类产量随储层特征和完层设计变化的潜在分布。](img/Fig07_18.jpg)


    FIGURE 7.18 AI 模型针对井 `ISWN#018MSWPABE-2` 部署了数千次，以识别烃类产量随储层特征和完层设计变化的潜在分布。


    ![FIGURE 7.19 AI 模型针对井 ISWN#018MSWPABE-2 部署了数千次，以识别烃类产量随储层特征和完层设计变化的潜在分布。](img/Fig07_19.jpg)


    FIGURE 7.19 AI 模型针对井 `ISWN#018MSWPABE-2` 部署了数千次，以识别烃类产量随储层特征和完层设计变化的潜在分布。


    通过这些图中的红色曲线，可以根据敏感性分析参数的修改，确定每口特定井的 P10（产量产量）、P50（产量平均产量）和 P90（产量最低产量）。“蓝色柱状图”和“红色曲线”的特征详细地解释了该区域内每口井的“基于
    AI 的页岩分析”模型的物理原理。


