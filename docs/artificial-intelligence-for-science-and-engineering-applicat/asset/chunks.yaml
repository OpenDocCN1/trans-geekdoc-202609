    ## Note


    1. [Evolution](#C_006_c3.xhtml#f3_17b) provides information about the enhancement
    and improvement of the brain of Home sapiens.

    2. [Philosophy](#C_006_c3.xhtml#f3_18b) provides incredible information and understanding
    about the fundamental nature of knowledge, fact, reality, and experience.

    3. [Neuroscience](#C_006_c3.xhtml#f3_19b) focuses on human brains and behaviors.

    4. [Biology](#C_006_c3.xhtml#f3_19b) is the combination of “life” and “study”,
    the science of living organisms.


    ## Modeling Physics Using Artificial Intelligence


    DOI: [10.1201/97810336935](https://doi.org/10.1201/97810336935)


    Modeling physics using Artificial Intelligence involves facts, reality, and actual
    measurements. It is important to note that when you use learning algorithms, it
    does not need for scientists and engineers.


    Here is a simple question that anyone can answer.


    ## Question 1


    Using “Human Intelligence”, are there any differences between modeling and solving
    “Physical Phenomena” versus “General Phenomena”? A reasonable example of this
    question would be: using “Human Intelligence”, are there any differences between
    “Modeling CO2 Injection into Saline Aquifer for the positive impact of Climate
    Change” versus “Identification of Images such as the difference between a Cat
    and a Dog”?


    ## Answer 1


    Yes, indeed. There are differences between modeling and solving physical phenomena
    and general phenomena using “Human Intelligence”. To model or solve physical phenomena,
    humans need to go to school and university for several years and become experts
    in the specific type of physical phenomena they need to solve. “Human General
    Intelligence” is good enough to solve “General Phenomena”.


    ## Question 2


    How can we make machines (computers – machine learning algorithms) to go to school
    and university for several years and become experts in the specific type of physical
    phenomena that is needed to be solved through “Artificial Intelligence”?


    ## Answer 2


    First and foremost, machines (computers – machine learning algorithms) do not
    need (and of course it’s impossible) to go to school and university to be experts
    in physical phenomena. But there are other ways to “Teaching” Machine “Learning”
    algorithms. Since “Learning” of physical phenomena requires “Teaching”, the teacher
    of physical phenomena to machine learning algorithm must be an expert in the specific
    physical phenomena topic.

