    在 IEEE 中，这项技术被命名为“计算智能”（Computational Intelligence），而非人工智能；在许多其他情况下，也使用了其他名称来代替“人工智能”。例如，在《石油工程师协会》（Society
    of Petroleum Engineering, SPE）月刊和《石油技术期刊》（Journal of Petroleum Technology, JPT）上，2000
    年发表了关于人工神经网络`[3]`、演化计算`[4]`和模糊逻辑`[5]`的三篇文章。在这三篇文章中，我们使用了“虚拟智能”（Virtual Intelligence）。其他替代“人工智能”的名称还包括“软计算”（Soft
    Computing）。


    最后，在 21 世纪 00 年代中期，当深度学习和卷积神经网络被用于图像识别，并由 Google 向全球公众展示这种方式时，“人工智能”一词开始取代“计算智能”、“虚拟智能”、“软计算”等术语。


    熟悉人工智能和机器学习基于物理和非基于物理的历史，为那些对这项技术在科学和工程相关领域应用的人士提供了一些重要的视角。例如，有趣的是，从 20 世纪 80
    年代后期到 90 年代末，许多在众多科学和工程相关领域发起该技术应用的科学家和创新者，刻意避免使用“人工智能”这一术语来描述他们的研发工作。


    在 20 世纪 90 年代，机器学习算法（如人工神经网络、模糊集合理论和演化计算）在科学和工程中的应用被称为“计算智能”、“虚拟智能”、“软计算”以及其他几个名称。21
    世纪 00 年代中期，当利用传统统计学和多层人工神经网络结合生成图像识别技术时，“人工智能”这一名称的使用频率开始大幅增加。在这一时期，当使用机器学习算法进行建模或解决问题时，“人工智能”是该技术的主要名称。如果知道为什么从
    20 世纪 80 年代中期到 21 世纪 00 年代中期的大约二十年里一直避免使用“人工智能”这一名称，将是非常有意思的。


    这种避开的原因非常充分，甚至推影响了 IEEE 在该领域的决策。IEEE 是开发并正对人工智能和机器学习做出贡献的绝大多数技术的源地。当 IEEE 决定为这项技术成立一个科学部门（委员会/协会）时，它修改了
    1989 年成立的“IEEE 神经网络委员会”，该委员会随后在 2001 年改为“IEEE 神经网络协会”，并在 2003 年开始称其“IEEE 计算智能协会”，而不是“IEEE
    人工智能协会”（图 2.9`）。


    ![图 2.9 IEEE 的计算智能网站。](img/Fig02_09.jpg)


    **图 2.9** IEEE 的计算智能网站。


