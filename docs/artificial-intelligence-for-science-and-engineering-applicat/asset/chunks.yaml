    is the fact that Artificial Intelligence separates and enhances the traditional
    problem-solving of science and engineering. The domain expertise in science and
    engineering will help to *Teach* these important intelligent items to the machine
    *Learning* algorithms.


    ## Expertise in Science and Engineering'
