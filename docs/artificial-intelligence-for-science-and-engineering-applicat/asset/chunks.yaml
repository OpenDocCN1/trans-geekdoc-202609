- fmt: '

    As was mentioned, Traditional Statistics have been around for more than three
    centuries. The term “statistic” was originated and invented in Germany in 1749.
    If the connection of data with probability theory (randomness) is considered,
    then its history may even go as far back as the 16th century. Nevertheless, the
    point is that, unlike Artificial Intelligence, Traditional Statistics are not
    a new technology. In order to develop a better understanding of the fundamental
    differences between these two technologies, one should start with the seminal
    paper written by Leo Breiman, a well-known Statistics Professor from the University
    of Berkeley [[12](#Z_011_references.xhtml#r12)], followed by the book written
    by Nisbet, Elder, and Miner (*Handbook of Statistical Analysis & Data Mining Applications*)
    [[13](#Z_011_references.xhtml#r13)]].


    As mentioned by the Statistic Professor of the University of Berkeley (Dr. Leo
    Breiman) in his article [[12](#Z_011_references.xhtml#r12)], “The focus in the
    statistical community on data models has led to irrelevant theory and questionable
    scientific conclusions … a predefined pattern (i.e. the parametric model) uses
    a model to characterize a pattern in the data calls data model”. “This enterprise
    (*Traditional Statistics*) has at its heart the belief that a statistician, by
    imagination and by looking at the data, can invent a reasonably good parametric
    class of models for a complex mechanism devised by nature, … truisms have often
    been ignored in the enthusiasm for fitting data models”. “When a model is fit
    to data to draw quantitative conclusions, the conclusions are about the model’s
    mechanism and not about nature’s mechanism”. “The belief in the infallibility
    of the data models was almost religious”.


    Traditional Statistics has an Aristotelian approach (two-valued logic) to problem
    solving and a deductive approach to the truth, while the philosophy behind Artificial
    Intelligence includes multi-valued logic and an inductive approach to the truth.
    While Traditional Statistics tests hypotheses through parametric models and compares
    them to the standard metrics of the models, Artificial Intelligence builds models
    using the data instead of starting with an existing model and testing the data
    to see if it fits the predetermined models. Artificial Intelligence is defined
    as mimicking nature, life, and the human brain to solve complex and dynamic problems.
    Artificial neural networks mimic neurons in the human brain; fuzzy set theory
    mimics multi-valued human logic and reasoning; and genetic algorithms mimic the
    Darwinian evolution theory. Machine learning is defined as a set of open computer
    algorithms to learn from data instead of explicitly programming the computer and
    telling it exactly what to do (as engineers do in numerical simulation). The human
    brain does not use Aristotelian two-valued logic (e.g., yes/no, black/white, true/false,
    0/1) to solve problems and make decisions. Probability theory addresses uncertainties
    that are associated with randomness, not uncertainties associated with a lack
    of information.


    Traditional Statistical approach starts with a series of predetermined equations
    (sets of hypotheses) such as single or multivariable linear regression or nonlinear
    regression that is well defined (e.g., logarithmic, exponential, quadratic). Then,
    it tries to find the most appropriate, predetermined equation that would fit the
    collected data. While the Traditional Statistical approach tries to find correlations
    between the involved variables, it does not address, consider, or even try to
    identify causations from the data. Everyone knows that correlation does not necessarily
    address causation. [Figures 5.1](#C_008_c5.xhtml#f5_1) and [5.2](#C_008_c5.xhtml#f5_2)
    are good examples of such an issue. In these two figures, while the data look
    incredibly correlated (more than 99% correlation) between two topics (“U.S. Spending
    on science, space, and technology” versus “Suicide by hanging, strangulation,
    and suffocation” in [Figure 5.1](#C_008_c5.xhtml#f5_1) and “Divorce rate in the
    state of Maine” versus “Per capita consumption of Margarine” in [Figure 5.2](#C_008_c5.xhtml#f5_2)),
    it is quite clear that these two topics have absolutely nothing to do with one
    another. This means that correlations do not necessarily mean causation.


    ![FIGURE 5.1 The correlation between the amount of U.S. spending on science, space,
    and technology and the number of suicides by hanging, strangulation, and suffocation
    clearly does not imply causation.](images/Fig05_01.jpg)


    [`FIGURE 5.1](#C_008_c5.xhtml#f5_1) The correlation between the amount of U.S.
    spending on science, space, and technology and the number of suicides by hanging,
    strangulation, and suffocation clearly does not imply causation.


    ![FIGURE 5.2 The correlation between the divorce rate in the state of Maine versus
    Per capita consumption of Margarine.](images/Fig05_02.jpg)


    [`FIGURE 5.2`](C_008_c5.xhtml#f5_2) The divorce rate in the state of Maine versus
    Per capita consumption of Margarine.


    Artificial Intelligence does not start with any predetermined equations. They
    do not start with any assumptions regarding the type of behavior variables may
    have to correlate them to the target output. The strength of open Artificial Intelligence
    using Machine Learning has to do with their amazing capabilities to discover complex
    patterns within large amounts of variables. The final outcome of the models that
    are developed by Artificial Intelligence usually cannot be summarized by one or
    few equations. That is why many engineers like to use the term black box for the
    Machine Algorithms.


    Apparently, traditional engineers cannot make sense of models unless they include
    one or more mathematical equations they have grown up with since they started
    college. Most probably, that is the reason behind calling the Artificial Intelligence-related
    models black box. What the traditional engineers who do not respect new technologies
    seem not to realize is that, from a mathematical point of view, the models that
    are developed using Artificial Intelligence include a series of matrices that
    generate the models’ outcomes. Therefore, nothing is opaque (black) about these
    models (boxes). The fact is that, when you ask a question from an AI-based model
    (as long as it has been developed correctly), it can respond in a very solid manner.
    This part of the topic of Artificial Intelligence is covered in [Chapter 7](#C_010_c7.xhtml)
    of this book.


    [Figure 5.3](#C_008_c5.xhtml#f5_3) summarizes one of the major differences between
    Traditional Statistical approach to problem solving and the approach that is used
    by Artificial Intelligence. When data is used in the context of Traditional Statistical
    approaches, a series of predetermined equations are used in order to find out
    how would possibly fit the data. In other words, the form and shape of the equation
    that will fit the dataset, and sometimes even the form of the data distributions,
    are all predetermined. In such cases, if the actual data is too complex to fit
    any predetermined equations or distributions, then either the approach to solving
    the problem comes to a standstill or a large number of assumptions, simplifications,
    and biases are incorporated into the data (or the problem) to come to some sort
    of solution.


    ![FIGURE 5.3 Differences between Traditional Statistics and Artificial Intelligence
    & Machine Learning \[14\].](images/Fig05_03.jpg)

