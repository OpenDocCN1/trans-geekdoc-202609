    `图 3.18` 认为成为“数据科学家”只需要 1 个月，这合理吗？


    图 3.18 显示的内容并非虚构。它绝对是不正确的，但实际上，这是一个事实。这是由一家公司（UDEMY）做的，它让许多人认为他们只需要很少的时间和精力就能成为人工智能专家，而人工智能现在也被称为“数据科学”。


    人工智能的专业知识需要利用这种新型现代技术进行大量的研究和解决问题的技能开发。利用人工智能解决问题的研发将对进化论、哲学、神经科学和生物学领域的科学家和工程师产生极大兴趣，正如图
    3.19 所示。


    ![图 3.19 人工智能和机器学习的基础知识和理解需要对哲学、神经科学、数学、计算机科学、统计学和生物学的兴趣和专业。](img/Fig03_19.jpg)


    `图 3.19` 人工智能和机器学习的基础知识和理解需要对哲学、神经科学、数学、计算机科学、统计学和生物学的兴趣和专业。


    1. *进化论*提供了关于智人（Homo sapiens）大脑增强和改进的信息。除了与我们之前发展的所有动物的大脑进行比较外，它甚至让我们可以将我们的强度与其他人类物种（如尼安德特人和*直人*/Homo
    erectus）的大脑进行比较。尼安德特人和直人在我们之前进化了数十万年，但从未离开过狩猎采集者的特征。智人几乎在 7 万年前离开了了东非，在约 1.2 万年前通过农业革命改变了他们的狩猎采集者特征，并在约
    350 年前开始了科学和工业的创造。如果对进化论感兴趣，学习人类大脑的奇妙特性将非常困难且不切实际。


    2. *哲学*提供了关于知识、事实、现实和经验之本质的令人难以信的信息和理解。与传统的科学和工程方法一样，亚里士多德哲学绝不能如此。


    3. *神经科学*关注人类大脑和行为。


    4. *生物学*是“生命”与“学习”的结合，是生物体的科学。


    鉴于人工智能的专业知识，这让我们对进化论、哲学、神经科学和生物学产生了兴趣。需要注意的是，当你使用学习算法时，科学家和工程师并不需要（这些知识）。然而，如果你不相信这是真的，你可以发送电子邮件。注意物理建模和通用问题建模之间的区别很重要。


    ## 注意


    1. 进化论提供了关于智人大脑增强和改进的信息。

    2. 哲学提供了关于知识、事实、现实和经验之本质的令人难以信的信息和理解。

    3. 神经科学关注人类大脑和行为。

    4. 生物学是“生命”与“学习”的结合，是生物体的科学。


    ## 使用人工智能进行物理建模


    DOI: [10.1201/97810336935](https://doi.org/10.1201/97810336935)


    使用人工智能进行物理建模涉及事实、现实和实际测量。需要注意的是，当你使用学习算法时，科学家和工程师并不需要（这些知识）。


    这是一个任何人都可以回答简单问题。


    ## 问题 1


    使用“人类智慧”，在建模和解决“物理现象”与“通用现象”之间是否存在差异？这个问题一个合理的例子是：使用“人类智慧”，在“为了向盐水层注入二氧化碳以产生对气候变化的积极影响而进行建模”与“识别图像（如猫和狗之间的区别）”之间是否存在差异？


    ## 回答 1


    是的，确实有。使用“人类智慧”在建模和解决物理现象与通用现象之间存在差异。为了建模或解决物理现象，人类需要在学校和大学学习几年，成为他们需要解决的特定类型物理现象的专家。“人类通用智能”对于解决“通用现象”足够。


    ## 问题 2


    我们如何让机器（计算机——机器学习算法）进入学校和大学学习几年，并通过“人工智能”成为需要解决的特定类型物理现象的专家？


    ## 回答 2


    首先，机器（计算机——机器学习算法）不需要（而且这是不可能的）去学校和大学成为物理现象专家。但还有其他方法来“教导”机器“学习”算法。由于物理现象的“学习”需要“教导”，物理现象对机器学习算法的教师必须是特定物理现象主题的专家。


