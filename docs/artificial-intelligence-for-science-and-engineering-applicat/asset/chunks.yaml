    of the shale asset, or for the entire shale asset. In [Figure 7.21](#C_010_c7.xhtml#f7_21),
    the XAI shows that the 6 Month Cumulative Gas Production of Well #015 can increase
    from 850,000 MSCF to 1.3 million MSCF as the “Stimulated Lateral Length (ft.)”
    of this well increases from 3,500 to 10,000 ft. This increase in Gas Production
    as a function of Stimulated Lateral Length is non-linear and can change the way
    it is shown in this figure when the completion design of hydraulic fracturing
    changes from 15 to 40 stages as long as all other variables that have been used
    to build this model remain the same for this specific well. If the completion
    design includes 15 stages, then the Gas Production can increase from 850,000 MSCF
    to 1.05 million MSCF as the Stimulated Lateral Length increases from 3,500 to
    10,000 ft.


    If the completion design includes twice as many stages (30 stages), then the Gas
    Production can increase from 900,000 MSCF to 1.25 million MSCF as the Stimulated
    Lateral Length increases from 3,500 to 10,000 ft.


    For Well #112 (the middle graph in [Figure 7.21](#C_010_c7.xhtml#f7_21)), the
