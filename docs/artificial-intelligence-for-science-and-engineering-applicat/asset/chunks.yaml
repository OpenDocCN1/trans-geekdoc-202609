    在 50 多年前对水力裂缝进行模型开发时，常规储层中的水力裂缝形状是使用椭圆形进行建模的，如图 6.13 所示。这种传统的水力裂缝模型包含了四个特定特征，使其可以使用数学方程进行建模。这四个特定特征是：(a)
    裂缝半长度、(b) 裂缝高度、(c) 裂缝宽度以及(d) 裂缝渗透系数。对比图 6.11 和图 6.12 中展示的水力裂缝形状与图 6.13 中所示的水力裂缝形状，可以清楚地看出，非常规储层与常规储层之间水力裂缝的实际形状有多大不同。


    ![图 6.13 常规储层中的水力裂缝。](img/Fig06_13.jpg)


    图 6.13 常规储层中的水力裂缝。


    当实际的水力裂缝看起来像图 6.11 和图 6.12 所示时，使用图 6.13 所示的形状来对其进行建模是否有任何意义，或者是否与现实有任何关系？这个问题的答案必须非常清楚。这是一个很好的例子，说明了数学方程（用于模拟多孔介质中流体流物理物理）中所包含假设、解释、简化、先入为主的概念和偏见，是如何包含在将其与真实现场测量数据相结合的“混合模型”中的。


    当基于 AI 的模型被用于决策时，AI 伦理已被证明是一个重要问题。AI 伦理可以揭示在科学和工程的人工智能应用以及通用智能问题解决中可能包含的偏见。几项研究（其中一些在本章中被引用）已经表明，种族主义和性别歧视等偏见是如何通过
    AI 伦理被暴露在基于 AI 的模型中的。本章证明了由传统工程师建立的假设、解释和偏见是如何包含在人工智能的工程应用中的，这被称为工程 AI 伦理。


    # 7 可解释的人智能 (XAI)


    DOI: [10.1201/9781003369356-8](https://doi.org/10.1201/9781003369356-8)


    可解释人工智能（XAI）是科学与工程人工智能应用的主要特征之一。正如前面的章节提到的，科学与工程人工智能模型纯粹基于事实和现实（实际测量数据）对物理现象进行建模。这项新技术与传统的工程应用非常不同，其主要目标是完全避免假设、解释、简化、先入为主的概念和偏见。科学与工程应用人工智能与通用人工智能不同的一个主要特征是它结合了
    XAI。在利用实际数据测量值作为物理现象建模的主要构建块时，科学与工程人工智能结合了多种类型的机器学习算法，包括人工神经网络、模糊集合理论和进化计算。科学与工程人工智能的预测模型并不是由不可解释的“黑箱”表示的。科学与工程人工智能的预测模型具有合理的可解释性。


