    1. 聊天机器人 是一种通过文本或语音模拟人类对话的计算机程序。聊天机器人主要有两种类型：基于规则的聊天基于基于机器学习的聊天机器人。基于规则的聊天机器人根据一组规则进行编程，规定了它们如何响应某些提示或问题。另一方面，机器学习聊天机器人可以根据与用户的对话学习并适应其回答。


    # 2 人工智能的简史


    DOI: [10.1201/9781003369356-3](https://doi.org/10.1201/9781003369356-3)


    关于今天所谓的人工智能的通用概念始于 20 世纪 50 年代初，由一位英国数学家、计算机科学家、逻辑学家、密码分析学家、哲学家和理论生物学家艾兰·图灵（Alan
    Turing）提出的。他的照片可以在图 2.1 看到。他被称为现代计算之父，因为他开发了现代计算和人工智能的理念。在他的一篇原始论文 \[2]中，他提到：“我提议考虑一个问题：机器能思考吗？”艾兰·图灵创建了一个测试，这个测试对后来的思想者产生了持久的刺激，并对人工智能哲学和实践的研究做出了贡献：“图灵测试是人工智能的一种查询方法，用于确定计算机是否能够像人类一样思考”
    \[2]。


    ![图 2.1 艾兰图灵，英国数学家、计算机科学家、逻辑学家、密码分析学家、哲学家和理论生物学家。](img/Fig02_01.jpg)


    图 2.1 艾兰·图灵，英国数学家、计算机科学家、逻辑学家、密码分析学家、哲学家和理论生物学家。


    图 2.2 展示了过去几十年中对人工智能发展起过重要作用的仅三位技术科学家（约翰·麦卡锡、沃尔特·皮茨斯和马克西恩·霍夫）的照片。由于我无法提供过去几十年中对人工智能发展起过重要作用的许多其他技术科学家的真实照片，在书中我只能提供他们的名字：沃伦·马库洛、弗兰克·罗森布拉特、伯纳德·维德罗、约翰·冯·诺依曼、克劳德·香农、艾伦·纽厄尔、赫伯特·A·西蒙、杰弗里·辛顿、杨恩·勒昆和约舒亚·本基奥。


    ![图 2.2 对人工智能发展起过重要作用的一些重要技术专家的照片。](img/Fig02_02.jpg)


    图 2.2 对人工智能发展起过重要作用的一些重要技术专家的照片。


    使用 Google Bard 和 ChatGPT 来学习关于这些个人对人工智能贡献的某些细节，以及书中未提到的其他几位科学家（因为这只是“简史”），是一个好主意。本章计划涵盖的内容，再次简要地说是，简单地描述自
    1986 年以来为什么没有使用“人工智能”这一术语，以及为什么最近（自 2005 年中以来）“人工智能”一词开始被使用。


    ## 使用数据和规则的原始人工智能


    这一切都可以追溯到这项革命性技术（人工智能）的历史本质。在 20 世纪 50 年代和 60 年代，随着人工智能初始版本的产生，数据和规则均被用于开发人工智能模型，如图
    2.3 所示。这一原始版本人工智能中的数据相关模型使用的是初始版本的人工神经网络，它只包含两层数据作为“输入”和“输出”。


    ![图 2.3 人工智能的初始版本（20 世纪 50 年代和 60 年代）正在基于数据和/或规则开发模型。](img/Fig02_03.jpg)


    图 2.3 人工智能的初始版本（20 世纪 50 年代和 60 年代）正在基于数据和/或规则开发模型。


    这种原始版本的人工神经网络（称为`Perceptron`）不包括今天所谓的隐藏层和隐藏神经元。此外，原始版本的人工神经网络仅通过神经元的“前向传播”（Feed
    Forward）进行计算，没有技术向后移动计算以修改和增强输入数据与输出数据之间的连接。因此，通过使用数据进行模型和问题解决的人工神经网络（`Perceptron`）的主要特征包括“无隐藏层”和仅“前向传播”计算。


    如图 2.4 所示，1969 年，两位来自马萨诸塞理工学院（MIT）的大学教授马文·明斯基（Marvin Minsky）和西摩尔·帕珀特（Seymour Papert）写了一本名为《感知机：计算几何导论》（*Perceptrons:
    An Introduction to Computational Geometry*）的书 \[1]。在这本书中，作者涵盖了`Perceptron`算法（1957
    年由美国心理学家弗兰克·罗森布拉特（Frank Rosenblatt）生成的原始版本的人工神经网络）。这本书对人工智能的主要贡献是关于原始版本的人工神经网络（感知机），解释了这种原始神经网络只能解决“线性”相关问题，无法解决任何“非线性”相关问题。


    ![图 2.4 马文·明斯基和西摩尔·帕珀特在 1969 年写了一本重要的书籍《感知机：计算几何导论》，提供了一种增强原始人工神经网络特征的情境。](img/Fig02_04.jpg)


    图 2.4 马文·明斯基和西摩尔·帕珀特在 1969 年写了一本重要的书籍*感知机：计算几何导论*，提供了一种增强原始人工神经网络特征的情境。


    这本书的主要结果是，它从字面上从原始的“人工智能”中删除了数据驱动的模型和问题解决版本。如图 2.5 所示，一旦这本书被写并被大量科学家阅读，现有的“人工智能”技术中的所有现有研究和开发过程开始仅通过基于规则的模型进行工作，并避免使用任何数据驱动技术。


    ![图 2.5 数据驱动模型从原始人工智能中被删除。](img/Fig02_05.jpg)


    图 2.5 数据驱动模型从原始的人智能中被删除。


    基于规则的建模类型包含了一系列解决特定问题必须遵循的规则。此类规则由领域专家针对要建模的主题开发，以帮助人类做出决策。人工智能原始版本中的这部分被称为“专家系统”，并尝试通过“如果……那么……”规则来解决复杂问题。


