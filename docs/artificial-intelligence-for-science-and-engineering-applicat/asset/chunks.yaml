    ![FIGURE 7.14 The same behavior in ISWN#056MSWPADU-1 well (increase in proppant
    per stage resulting in an increase in hydrocarbon production from wells) takes
    place for other wells in the same field.](images/Fig07_14.jpg)


    [**FIGURE 7.14**](#C_010_c7.xhtml#f7_14b) The same behavior in ISWN#056MSWPADU-1
    well (increase in proppant per stage resulting in an increase in hydrocarbon production
    from wells) takes place for other wells in the same field.


    ![FIGURE 7.15 The same behavior in ISWN#076MSWPAHJ-2 well (increase in proppant
    per stage resulting in increase in hydrocarbon production from wells) takes place
    for other wells in the same field.](images/Fig07_15.jpg)


    [**FIGURE 7.15**](#C_010_c7.xhtml#f7_15b) The same behavior in ISWN#076MSWPAHJ-2
    well (increase in proppant per stage resulting in increase in hydrocarbon production
    from wells) takes place for other wells in the same field.


    Obviously, this particular well (as well as all other wells in this model) has
    a specific porosity value that has been measured and then used as part of the
    entire data set to build the AI-based predictive Shale Analytics model. The purely
    actual field measurement data model that has been developed for this field in
    Marcellus Shale has proven to provide good output (6 Month Gas Production) based
    on this specific value of porosity. The question is: what would happen to model
    output (6 Month Gas Production) as the value of the porosity for this specific
    well is modified? Keeping all other input parameters constant, the value of the
    porosity is changed (mentioned “Sweep” in this software) from minimum to maximum
    in 100 pieces. What would be the 6 Month Gas Production of the well for each new
    value of the porosity while all other parameters remain constant? ([Figure 7.6](#C_010_c7.xhtml#f7_6)).


    [Figure 7.7](#C_010_c7.xhtml#f7_7) shows the behavior of this AI-based Shale Analytics
    model of a specific well (ISWN#032MSWPACW-3). This “Predictive Shale Analytics”
    model explains that the hydrocarbon production of this particular well would have
    been higher if the porosity of the formation in this well was higher than what
    was actually measured. From a petroleum engineering point of view, this makes
    perfect sense. This process can be repeated for every single well in this field.
    Examples of two more wells in this field are shown in [Figure 7.10](#C_010_c7.xhtml#f7_10)
    (ISWN#002MSWPAAD-1) and [Figure 7.9](#C_010_c7.xhtml#f7_9) (ISWN#012MSWPAB-1).
    It is important to note that while the production increases in each of these figures
    as a function of the enhancement of porosity, the behavior of the production in
    each of the wells is different from each other. It must be noted that all other
    field measurements for each of these wells are different from each other, and
    that is the reason for the production values for each porosity value. Both enhancements
    of production as a function of porosity and their amount and shape of difference
    that are not the same would have to do with other measured values. This would
    be an explanation for the AI-based Shale Analytics model. From a physics point
    of view, this also makes perfect sense.'
