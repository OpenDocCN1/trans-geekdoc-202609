  raw: 'In the IEEE, instead of Artificial Intelligence this technology was named
    “Computational Intelligence”, and in many other cases, several other names were
    used instead of “Artificial Intelligence”. For example, in the monthly journal
    of the *Society of Petroleum Engineering* (SPE), the *Journal of Petroleum Technology*
    (JPT), three articles was written in the year 2000 about Artificial Neural Networks
    \[[3](#Z_011_references.xhtml#r3)\], Evolutionary Computing \[[4](#Z_011_references.xhtml#r4)\],
    and Fuzzy Logic \[[5](#Z_011_references.xhtml#r5)\]. In all these three articles,
    we referred to “Virtual Intelligence”. Other names that were referred to instead
    of “Artificial Intelligence” included “Soft Computing”.


    Finally, in the mid-2000s, when Deep Learning and Convolutional Neural Networks
    were used for image recognition in a fashion that was exposed to general people
    throughout the world by Google, the term “Artificial Intelligence” started to
    be used instead of “Computational Intelligence”, “Virtual Intelligence”, “Soft
    Computing”, etc.


    Familiarity with the physics-based and non-physics-based history of Artificial
    Intelligence and Machine Learning provides some important perspective for those
    who are interested in the application of this technology in science- and engineering-related
    disciplines. For example, it is interesting to know that from the late 1980s until
    the end of the 1990s, many of the scientists and innovators who had initiated
    the application of this technology in many science- and engineering-related areas
    intentionally avoided using the term “Artificial Intelligence” to describe their
    research and development efforts


    During the 1990s, applications of Machine Learning algorithms such as Artificial
    Neural Networks, Fuzzy Set Theory, and Evolutionary Computations in science and
    engineering were referred to as “Computational Intelligence”, “Virtual Intelligence”,
    “Soft Computing”, and a few other names. In the mid-2000s, when image recognition
    technology was generated using a combination of traditional statistics and multi-layer
    Artificial Neural Networks, the name “Artificial Intelligence” started to be used
    far more often. At this point in time, the term “Artificial Intelligence” is the
    main name of the technology that is mentioned when Machine Learning algorithms
    are used to model or solve problems. It would be interesting to know why the use
    of the name “Artificial Intelligence” was being avoided for about two decades,
    from the mid-1980s to the mid-2000s.


    There were enough reasons for such avoidance that they even influenced IEEE decision-making
    in this area. IEEE is the original homeland of the overwhelming set of technologies
    that were developed and are now contributing to Artificial Intelligence and Machine
    Learning. When IEEE decided to form a scientific section (council/society) for
    this technology, it modified the “IEEE Neural Network Council” that was formed
    in 1989 and later in 2001 was changed to “IEEE Neural Network Society” and started
    calling it “IEEE Computational Intelligence Society” in 2003, not “IEEE Artificial
    Intelligence Society” ([Figure 2.9](#C_005_c2.xhtml#f2_9)).


    ![FIGURE 2.9 IEEE’s computational intelligence website.](images/Fig02_09.jpg)


    [**FIGURE 2.9**](#C_005_c2.xhtml#f2_9b) IEEE’s computational intelligence website.


    The main reason the term “Artificial Intelligence” was being avoided by the scientific
    community at the time had to do with multiple factors. However, the most important
    fact was the approach to problem-solving at the start of this technology in the
    1960s. At the time, “Artificial Intelligence” was completely based on Aristotelian
    logic rules instead of data-driven approaches. This “rule-based” version of “Artificial
    Intelligence” that was also used to be called “Expert Systems” failed to achieve
    any of the large promises that were made, resulting in the waste of extensive
    amounts of investment that were made in this technology. The final outcome was
    the failure and collapse of this version of “Artificial Intelligence” (Expert
    System).


    ## Note


    1.  [My first](#C_005_c2.xhtml#n2_1b) paper on this topic was published in August
    1994 (SPE 28237). Just like other (non-petroleum engineering) colleagues in this
    community, I avoided using the term Artificial Intelligence in my first 29 related
    publications on this topic prior to the year 2004. The first time I used the term
    “Artificial Intelligence” was in my 30th paper on this topic, which was published
    in the JPT (Journal of Petroleum Technology) in May 2004.


    # 3 Science and Engineering Application of Artificial Intelligence


    DOI: [10.1201/9781003369356-4](https://doi.org/10.1201/9781003369356-4)


    Since “Artificial Intelligence” is the simulation of “Human Intelligence” through
    “Mimicking Human Brain”, to explain the science and engineering application of
    Artificial Intelligence, it makes sense to first characterize how science and
    engineering are applied to Human Intelligence. Once the application and characteristics
    of science and engineering in Human Intelligence are well understood, it would
    make sense to identify how science and engineering in Artificial Intelligence
    should be correctly applied since they should be simulating science and engineering
    on Human Intelligence. As some companies, faculties, and individuals (including
    scientists and engineers) come to the conclusion that science and engineering
    applications in Artificial Intelligence have nothing to do with science and engineering
    applications in Human Intelligence, it becomes quite clear that their understanding
    of Artificial Intelligence would be very minimal and may even be incorrect.


    In this chapter, General Intelligence and Science and Engineering Intelligence
    of *Homo sapiens* will be covered, followed by an explanation of how the same
    types of intelligence (general as well as science and engineering) should be simulated
    using Artificial Intelligence. It seems quite understandable that there are significant
    differences between General Intelligence and Science and Engineering Intelligence
    for *Homo sapiens*. Of course, it is obvious that without General Intelligence,
    it is impossible to create and generate science and engineering intelligence in
    human species. Since the history of evolution clarifies the importance and uniqueness
    of *Homo sapiens*’ General Intelligence, it completely makes sense that Science
    and Engineering Intelligence can become part of *Homo sapiens* Intelligence.


    ## *Homo sapiens*’ General Intelligence


    General Intelligence in humans starts from the day that we are born. General Intelligence
    in humans is continuously enhanced. Items such as Image Recognition, Sound Recognition,
    Listening, Speaking, Language Translation, … are achieved through humans’ General
    Intelligence in a reasonably short period of time. Humans’ General Intelligence
    makes even quite young kids able to solve certain types of problems. For example,
    as shown in [Figure 3.1](#C_006_c3.xhtml#f3_1), even a 5-year-old child can tell
    which one of these images is showing the picture of a cat and which one is showing
    the picture of a dog. General Intelligence of humans can solve such problems through
    regular learning and understanding, even during our early lives. A little child
    can soon learn which one is “Mom” and which one is “Dad”. At an incredibly early
    stage of her/his life, the child can tell if “Mom” is saying something or “Dad”
    is talking. In other words, Image Recognition and Sound Recognition are part of
    our General Intelligence, which happened to us at an incredibly early time in
    our lives since our General Intelligence was used.


    ![FIGURE 3.1 Image recognition. Difference between cat and dog images.](images/Fig03_01.jpg)


    [**FIGURE 3.1**](#C_006_c3.xhtml#f3_1b) Image recognition. Difference between
    cat and dog images.'
