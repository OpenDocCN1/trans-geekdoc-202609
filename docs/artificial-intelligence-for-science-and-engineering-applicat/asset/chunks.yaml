- fmt: '

    One of the major problems that many companies in several industries started with,
    and some still are doing it, is hiring AI experts and/or statisticians to apply
    Artificial Intelligence and Machine Learning to their industry. In 2018, in a
    Petro-Talk `[[10](#Z_011_references.xhtml#r10)`, I explained the main problems
    with this approach in the petroleum industry. Those who do not have engineering
    domain expertise usually use the data that is provided to them and try to find
    “Correlations” between the parameters that are shared with them. They do not pay
    much attention to finding out whether the data that is provided to them includes
    all that is required to accomplish the objective that is being addressed. Or deal
    with the provided data in a fashion that would teach the machine learning algorithm
    about the characteristics of the physical technology that is being modeled.


    Lack of domain expertise does not allow them to identify what data is needed in
    order to solve the problem that they are dealing with. Is it possible for a professor
    who has no knowledge about a specific engineering technology to teach that specific
    engineering technology-related course to the students? In other words, can a political
    science professor teach thermodynamics? Or vice versa? As far as natural “Intelligence”
    is concerned, dealing with engineering-related problems requires engineering domain
    expertise. Therefore, the same would be true when it comes to artificial “Intelligence”.
    A domain expert engineer who becomes an expert practitioner of Artificial Intelligence
    will be able to generate the required features that can be used to “Teach” the
    Artificial Intelligence and Machine Learning algorithms how to solve specific
    engineering-related problems.


    Becoming an expert practitioner of Artificial Intelligence requires a detailed
    understanding of how Artificial Intelligence and Machine Learning algorithms work
    beyond just the mathematics of these algorithms. The mathematics of Machine Learning
    algorithms are not extraordinarily complex. Solving engineering-related problems
    using Artificial Intelligence and Machine Learning goes way beyond only mathematics
    and statistics. It requires an understanding of neurobiology. It requires knowledge
    of the philosophy of this technology and its differences with our traditional
    approaches to engineering problem-solving.


    As mentioned in an article from Stanford University `[[11](#Z_011_references.xhtml#r11)]`;
    “Artificial Intelligence (AI) is the field devoted to building artificial animals
    ... and, for many, artificial persons ... Such goals immediately ensure that AI
    is a discipline of considerable interest to many philosophers, and this has been
    confirmed (e.g.) by the energetic attempt, on the part of numerous philosophers,
    to show that these goals are in fact un/attainable. On the constructive side,
    many of the core formalisms and techniques used in AI come out of, and are indeed
    still much used and refined in, philosophy”.


    To cut the story short, using Artificial Intelligence experts and/or statisticians
    that have minimal understanding of engineering domain expertise to solve engineering-related
    problems usually generates very poor results and, at best, sometime will create
    highly mediocre outcomes. This has caused many managements of industrial companies
    to blame the Artificial Intelligence and Machine Learning technology rather than
    realizing that it was the incorrect decision of using the wrong individuals to
    guide their company in this area or using the wrong service companies and vendors
    to solve their problems when they do an incredible amount of marketing of their
    knowledge and characteristics.


    The petroleum industry is one of the top industries that has been making these
    mistakes for years. Management of the petroleum industry must be correctly guided
    on how to use Artificial Intelligence and Machine Learning as a positive and fantastic
    technology for problem-solving and decision-making in their company.


    ### Second Problem: The involvement of traditional engineers who do not believe
    Artificial Intelligence is a science and technology and claim that Artificial
    Intelligence is a hoax (same as Covid-19) and should not be used to solve engineering-related
    problems.


    Traditionalist engineers refer to those who believe the only way to solve an engineering-related
    problem is through the development of mathematical formulations that can describe
    the specific physical phenomenon they are trying to solve. They believe that what
    they have learned, experienced, and been dealing with for a long time is the only
    way to solve engineering-related problems. To many of them, this specific, traditional
    approach to engineering problem-solving is more of a religion than science. They
    keep saying that “Artificial Intelligence and Machine Learning is a hoax”, or
    “I tried it, but it never works”. What is mentioned here is not just an idea,
    it is an experience. It is about many traditional scientists and engineers (most
    of them faculty members) who have mentioned such things to me in many years.


    Until about a decade ago, these types of engineers faced the toughest problems
    with the application of Artificial Intelligence and Machine Learning in engineering-related
    problem-solving. Some of them still exist and do all they can to annoy those engineers
    and scientists who are interested in learning and working with this technology.
    Fortunately, given the positive behavior of the new generation of engineers and
    scientists, the current traditionalist engineers are no longer a problem. Many
    of them still try to use as much politics as they can to make sure that the application
    of Artificial Intelligence and Machine Learning in engineering-related problem-solving
    can be avoided. As time goes on, the number and the problems associated with these
    types of individuals keep going down.


    ### Third Problem: The engineers who have a minimal and superficial understanding
    of Artificial Intelligence are mostly interested in it from a business and marketing
    view rather than science and technology.


    Today, the most important problem related to the application of Artificial Intelligence
    and Machine Learning in engineering-related problem-solving has to do with some
    engineering domain experts. One of the main problems associated with the application
    of Artificial Intelligence and Machine Learning by some engineers is when they
    try to achieve solutions without following the main characteristics of Artificial
    Intelligence and Machine Learning. From their point of view, if some mathematics
    that incorporates machine learning algorithms is used to achieve their solution,
    then they feel comfortable to call it an AI-based approach. What they miss is
    correctly answering this question: “Why would you want to use Machine Learning
    Algorithm to achieve a solution?”


    One answer is: “Because people (management of my company or my client) are interested
    in Artificial Intelligence and Machine Learning, therefore, I can even use Machine
    Learning algorithm to perform `Linear Regression`”. Well, this is true. It allows
    you to exercise Machine Learning algorithm to better learn how to use it. However,
    this approach has only an “academic” value that allows you to learn, but it does
    not have a “realistic” value because it does not follow the main reason “WHY Machine
    Learning algorithm must be used”.


    Another answer is: “I tried to use actual data (actual measurements), but it did
    not work. Maybe I did not have enough data, or maybe the actual data was too uncertain
    and had too much noise, and maybe it was too complex to achieve a solution. Therefore,
    I decided to generate data from the equations and combine it with the real data,
    which significantly increased the possibility of success for pattern recognition”.

