    由于数学方程中包含的所有变量和参数之间都是相互相关的，因此，使用数学方程生成此类变量和参数并将其纳入数据驱动建模中，实际上是要求机器学习算法去遵循（并实际使用）生成这些数据的数学方程来解决问题。这种方法在解决科学和工程问题的传统方法中也一直在发生。这种方法清楚地证明了人们对人工智能在科学工程领域的应用缺乏理解。


    通过人工智能解决科学和工程问题仅基于实际且真实的数据，这些数据不包含任何假设、解释或简化。这意味着，正确应用人工智能解决科学和工程问题时，绝不能包含任何通过数学方程生成的数据。这需要特定科学工程领域的专业知识，以充分理解并使用实际（测量的）和真实数据来`教`机器学习算法物理现象。


    一种基于人工智能的方法通过学习实际（测量的）和真实数据，并对实际（测量的）真实数据进行并行分布式信息处理来进行模式识别，从而产生科学工程解决方案。过去十年中，科学家和工程师常用的错误包括将使用数学方程生成的数据与收集和测量的实际数据相结合。关于这一主题的更多细节将在第
    6 章中讨论。


    ### 问题 #3：使用已开发并用于解决通用人工智能相关问题的机器学习算法


    在很大程度上，目前和过去十年中，绝大多数科学家和工程师最终使用了开发用于解决通用人工智能问题的机器学习算法，如`CNNs`、`LSTM`等……事实是，这些被开发和用于解决通用人工智能（如图像识别、语音识别、语言翻译、字幕生成、人脸识别、物体识别、自动驾驶车辆等）的算法，不应该以完全相同的方式来解决工程相关问题。


    用于图像识别的`CNNs`经过两个主要过程。第一部分是图像指标的卷积，第二部分是使用人工神经网络训练卷积后的图像指标，如图图 3.8 所示。卷积是通过数学函数的组合（卷积）来合并信息以创建一个新函数的过程。如图图
    3.9、图 3.10、图 3.11、图 3.12 所示，卷积过程包括几种类型的过滤过程，例如用于训练神经网络的图像初始指标的`Kernel`（卷积）、`Pooling`（池化）和`Flattening`（展平）。


    ![FIGURE 3.8 用于图像识别的卷积神经网络(CNN)过程。CNN 是图像修改（使用 Kernel 进行卷积、Pooling 和 Flattening）与神经网络的结合。](img/Fig03_08.jpg)


    FIGURE 3.8 用于图像识别的卷积神经网络(CNN)过程。CNN 是图像修改（使用`Kernel`、`Pooling`和`Flattening`进行卷积）与神经网络的结合。


    卷积的目标是从用于训练图像识别过程的图像中提取有用特征。图 3.8 显示了所使用的 10 × 10 像素的图像，而图 3.9 和图 3.10 显示了用于图像识别训练的
    5 × 5 像素图像（0 和 1 组成）。


    ![FIGURE 3.9 使用 Kernel 的卷积层。](img/Fig03_09.jpg)


    FIGURE 3.9 使用`Kernel`的卷积层。


    ![FIGURE 3.10 通过过滤/Kernel 对输入图像执行卷积。](img/Fig03_10.jpg)


    FIGURE 3.10 通过过滤/`Kernel`对输入图像执行卷积。


    `Kernel`过程的示例在图 3.9 中分分步骤所示，并在图 3.10 中显示了当图 3.9 中所示的整个过程完成后。图 3.11 显示了`Pooling
    Layers`（池化层）的示例，其中使用了每系列`Kernel`的最大值，最后，图 3.12 显示了`Flattening`过程将最终计算的矩阵转换为单个输入序列。


    ![FIGURE 3.11 图像矩阵卷积层后的池化层。](img/Fig03_11.jpg)


    FIGURE 3.11 图像矩阵卷积层后的池化层。


    ![FIGURE 3.12 展平是图像矩阵的池化层。](img/Fig03_12.jpg)


    FIGURE 3.12 展平是图像矩阵的池化层。


    ### 问题 #4：使用传统统计方法因为它们也是数据驱动


    由于人工智能方法目前也被称为数据驱动，许多科学家和工程师（特别是在学术界）认为人工智能方法与传统统计学一样，因为它只使用数据解决问题。遗憾的是，他们没有意识到人工智能并没有使用传统统计学在过去
    150 年使用的解决问题技术。他们没有意识到，可能也没有兴趣学习传统统计学与人工智能之间的技术和哲学差异。关于这一项目的更多细节将在第 6 章中讨论。


    ### 问题 #5：使用机器学习算法继续传统的工程问题解决方法


    虽然使用人工智能解决问题绝对需要科学工程领域的专业知识，但对人工智能现实且正确的理解和专业知识也是必要的。必须理解，人工智能解决工程问题的方式与我们过去几个世纪解决科学和工程问题的方式完全不同。必须学会，当使用人工智能解决科学和工程问题时，其目标是尽可能地避免假设、解释和简化。这就是人工智能分离并增强传统科学工程问题解决事实的事实。科学工程领域的知识将帮助向机器学习算法`教`它们这些重要的智能项目。


