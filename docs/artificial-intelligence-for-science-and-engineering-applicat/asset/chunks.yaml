- fmt: '

    The main issue in this book is the requirements of expertise in both “specific
    science- and engineering-related problems” as well as realistic expertise in “Artificial
    Intelligence” in order to be able to simulate, model, and solve science- and engineering-related
    problems of physical phenomena using Artificial Intelligence.


    Since mid-2000 (2005–2007), Artificial Intelligence has become interesting and
    important and has been exposed to general people through the provision of technologies
    such as image and sound recognition through computers by several companies such
    as `Google`, `Amazon`, `IBM`, `Microsoft`, and … many science and engineering
    industries that have communicated with Artificial Intelligence experts. The management
    of these industries wanted to test Artificial Intelligence to enhance the results
    of their solutions. These industries pursued experts in Artificial Intelligence
    to use the data from their industry’s history. Artificial Intelligence experts
    who were involved in such interactions with the science and engineering industries
    were experts in the development of `AI`-based models and systems that are part
    of General Intelligence such as image recognition, sound recognition, and translation.
    The results of such interactions between Artificial Intelligence experts (with
    no specific domain expertise in a specific science and engineering topic) and
    the science and engineering industries ended up being incredibly different from
    what the industries expected.


    The results of such efforts in the science and engineering industries led their
    management to conclude that Artificial Intelligence should not be used in the
    science and engineering industries because it cannot provide any expected reasonable
    results. In many cases, the management of such industries came to the conclusion
    that Artificial Intelligence is not a truly good and positive technology. The
    reality is that the correct application of Artificial Intelligence in modeling
    and solving science- and engineering-related problems is incredibly better than
    what industrial management even originally expected and will be covered in this
    book.


    What is today called Artificial Intelligence started as concepts and ideas in
    the early 1950s. The rule-based “Expert Systems” ended up being referred to as
    Artificial Intelligence, while the original version of “Perceptron” (data-driven
    pattern recognition) was moved out of this technology due to a book written by
    Marvin Minsky and Seymour Papert in 1969 `[[1](#Z_011_references.xhtml#r1)]`.
    Some research continued to be done on data-driven pattern recognition, and finally,
    this technology addressed the issues that were identified by Minsky and Papert
    in their book and started to be what it is today, in 1986.


    During the first 15 years of the 2000s, Artificial Intelligence was extensively
    used in some games (Chess, Go, …), Internet (`Google`, Image Recognition, …),
    Smart Phones, and Tablet computers. In the past couple of decades, the overwhelming
    majority of the applications of Artificial Intelligence and machine learning that
    society has been exposed to have been used to address non-engineering (General
    Intelligence)-related problems. The engineering application of Artificial Intelligence
    and Machine Learning is quite different from how this technology is used to solve
    and address non-engineering-related problems that are also known as human-level
    intelligence, or `AGI`. Science and engineering domain expertise is an absolute
    requirement in the science and engineering applications of Artificial Intelligence
    and Machine Learning.


    Unfortunately, recently it has been learned that domain expertise can have both
    a positive and negative impact on the engineering application of Artificial Intelligence.
    This will also be discussed in this book. Domain expertise impacts the engineering
    application of Artificial Intelligence positively when engineers develop a solid
    understanding of the philosophy, major characteristics, and realistic approach
    of Artificial Intelligence. On the other hand, domain expertise has been negatively
    impacting this technology, when the engineers come to the conclusion that only
    traditional statistical knowledge and understanding of the mathematics are all
    that is needed to become experts in Artificial Intelligence.


    I have spent a long time talking, presenting, and communicating with industry
    management about this issue. My main communication with them in the past decade
    was to mention to them that while expertise in Artificial Intelligence is a requirement,
    it also requires domain expertise in the specific topics that are being addressed.
    One example of such presentations was at the Society of Petroleum Engineers `[[2](#Z_011_references.xhtml#r2)]`.
    A lot of people in many industries have finally come to the same conclusions.
    However, unfortunately, while this was (and still is) a fact, agreements with
    this issue have caused another problem for the Artificial Intelligence.


    After going through a lot of interaction with a large number of science and engineering
    domain expertise that try to use Artificial Intelligence, including even a very
    large number of articles that have been published by scientists and engineers
    that use Artificial Intelligence to solve physics-based problems, the conclusion
    has been that an incredible number of science and engineering domain expertise
    that call themselves “Data Scientists” have a very minimal understanding of Artificial
    Intelligence. The way they use Artificial Intelligence to solve science- and engineering-related
    problems clearly improves this fact. This is one of the main reasons that this
    book has been written.


    Currently, the overwhelming majority of engineers use the term “Machine Learning”
    instead of “Artificial Intelligence” in the topic of their work and research.
    In my involvement with their work and research, I always wondered why they did
    not use the term “Artificial Intelligence”. Originally, I was perfectly fine with
    that, until I recently learned why they do that. Getting involved with their work
    and research, I learned that they do research to find out what kinds of Machine
    Learning algorithms currently exist that they can use to solve their engineering-related
    problem, which is the topic of their work or research.

    '
  raw: 'The main issue in this book is the requirements of expertise in both “specific
    science- and engineering-related problems” as well as realistic expertise in “Artificial
    Intelligence” in order to be able to simulate, model, and solve science- and engineering-related
    problems of physical phenomena using Artificial Intelligence.


    Since mid-2000 (2005–2007), Artificial Intelligence has become interesting and
    important and has been exposed to general people through the provision of technologies
    such as image and sound recognition through computers by several companies such
    as Google, Amazon, IBM, Microsoft, and … many science and engineering industries
    that have communicated with Artificial Intelligence experts. The management of
    these industries wanted to test Artificial Intelligence to enhance the results
    of their solutions. These industries pursued experts in Artificial Intelligence
    to use the data from their industry’s history. Artificial Intelligence experts
    who were involved in such interactions with the science and engineering industries
    were experts in the development of AI-based models and systems that are part of
    General Intelligence such as image recognition, sound recognition, and translation.
    The results of such interactions between Artificial Intelligence experts (with
    no specific domain expertise in a specific science and engineering topic) and
    the science and engineering industries ended up being incredibly different from
    what the industries expected.


    The results of such efforts in the science and engineering industries led their
    management to conclude that Artificial Intelligence should not be used in the
    science and engineering industries because it cannot provide any expected reasonable
    results. In many cases, the management of such industries came to the conclusion
    that Artificial Intelligence is not a truly good and positive technology. The
    reality is that the correct application of Artificial Intelligence in modeling
    and solving science- and engineering-related problems is incredibly better than
    what industrial management even originally expected and will be covered in this
    book.


    What is today called Artificial Intelligence started as concepts and ideas in
    the early 1950s. The rule-based “Expert Systems” ended up being referred to as
    Artificial Intelligence, while the original version of “Perceptron” (data-driven
    pattern recognition) was moved out of this technology due to a book written by
    Marvin Minsky and Seymour Papert in 1969 \[[1](#Z_011_references.xhtml#r1)\].
    Some research continued to be done on data-driven pattern recognition, and finally,
    this technology addressed the issues that were identified by Minsky and Papert
    in their book and started to be what it is today, in 1986.


    During the first 15 years of the 2000s, Artificial Intelligence was extensively
    used in some games (Chess, Go, …), Internet (Google, Image Recognition, …), Smart
    Phones, and Tablet computers. In the past couple of decades, the overwhelming
    majority of the applications of Artificial Intelligence and machine learning that
    society has been exposed to have been used to address non-engineering (General
    Intelligence)-related problems. The engineering application of Artificial Intelligence
    and Machine Learning is quite different from how this technology is used to solve
    and address non-engineering-related problems that are also known as human-level
    intelligence, or AGI. Science and engineering domain expertise is an absolute
    requirement in the science and engineering applications of Artificial Intelligence
    and Machine Learning.


    Unfortunately, recently it has been learned that domain expertise can have both
    a positive and negative impact on the engineering application of Artificial Intelligence.
    This will also be discussed in this book. Domain expertise impacts the engineering
    application of Artificial Intelligence positively when engineers develop a solid
    understanding of the philosophy, major characteristics, and realistic approach
    of Artificial Intelligence. On the other hand, domain expertise has been negatively
    impacting this technology, when the engineers come to the conclusion that only
    traditional statistical knowledge and understanding of the mathematics behind
    the Machine Learning algorithms are all that is needed to make them experts in
    Artificial Intelligence and Machine Learning. Furthermore, many traditional engineers
    refer to Artificial Intelligence and Machine Learning as a new tool that needs
    a bit of skill, and they believe that AI is a tool like what Excel used to be
    and that it’s easy for everyone to learn how to use it.


    I have spent a long time talking, presenting, and communicating with industry
    management about this issue. My main communication with them in the past decade
    was to mention to them that while expertise in Artificial Intelligence is a requirement,
    it also requires domain expertise in the specific science and engineering topics
    that are being addressed using Artificial Intelligence. One example of such presentations
    was at Petro Talk in the Society of Petroleum Engineers \[[2](#Z_011_references.xhtml#r2)\].
    A lot of people in many industries have finally come to the same conclusions.
    However, unfortunately, while this was (and still is) a fact, agreements with
    this issue have caused another problem for the Artificial Intelligence application
    in science and engineering.


    After going through a lot of interaction with a large number of science and engineering
    domain expertise that try to use Artificial Intelligence, including even a very
    large number of articles that have been published by scientists and engineers
    that use Artificial Intelligence to solve physics-based problems, the conclusion
    has been that an incredible number of science and engineering domain expertise
    that call themselves “Data Scientists” have a very minimal understanding of Artificial
    Intelligence. The way they use Artificial Intelligence to solve science- and engineering-related
    problems clearly improves this fact. This is one of the main reasons that this
    book has been written. Solving physics-based science- and engineering-related
    problems using Artificial Intelligence requires domain expertise both in science
    and engineering as well as Artificial Intelligence. It is important to note that
    becoming an expert in Artificial Intelligence requires as much time, work, and
    research as has been provided in science and engineering.


    Currently, the overwhelming majority of engineers use the term “Machine Learning”
    instead of “Artificial Intelligence” in the topic of their work and research.
    In my involvement with their work and research, I always wondered why they did
    not use the term “Artificial Intelligence”. Originally, I was perfectly fine with
    that, until I recently learned why they do that now. Getting involved with their
    work and research, I learned that they do research to find out what kinds of Machine
    Learning algorithms currently exist that they can use to solve their engineering-related
    problem, which is the topic of their work or research. They search on the Internet
    and find different versions of Machine Learning Algorithms and use them to solve
    their problems. They use the data that they have collected in the same fashion
    that they have solved traditional technologies or the way it has been used in
    traditional statistics. What they do not pay attention to, is that overwhelming
    majority of the Machine Learning Algorithms that they try to find on the Internet
    have been developed to solve AGI items and not engineering-related problems.'
