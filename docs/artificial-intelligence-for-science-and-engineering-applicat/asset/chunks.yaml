  trans: '

    需要注意的是，关于这些差异的描述并不意味着机器也必须上过高中和大学并至少获得学士学位才能解决与科学和工程相关的问题，因为这种问题是不可能的。因此，如果事实并非如此，那么“人工智能科学与工程智能”（Artificial
    Science and Engineering Intelligence）如何发展以产生正确、有趣且重要的结果呢？


    首先，必须指出，在很长一段时间内（现在许多情况下也是如此），许多行业的人工智能专家在任何特定科学或工程领域都没有领域知识，却在执行人工智能工作，即解决与科学和工程相关的问题。这在许多行业（以及一些大学）中发生过多次，结果证明证明这根本不是一个好主意。


    这里是石油行业发生的一个案例 [9]。2014 年 3 月 31 日，日立（Hitachi）发布了一份在线新闻稿。


    该在线新闻稿的开头提到：


    > “日立美国有限公司（Hitachi America, Ltd）与能源与环境研究中心（EERC）今日宣布，两家公司将合作开发技术驱动的产品、服务和解决方案，以增强从巴肯地层（Bakken
    formation）提取石油的产量。巴肯地层涵盖了北达科他州、蒙塔拿州、萨斯喀彻省和曼尼托巴省的部分地区，估计拥有数百亿桶石油”。


    > “仅在北达科他州就有近 6000 口非常规巴肯石油系统井和近 200 个钻井平台，目前收集的数据量大得惊人。通过使用强大的分析工具来汇总和评估巴肯数据，油田运营人员和州官员可以更好地理解油井产量与各种因素之间的关系，例如油井是如何钻探的以及钻井地区的地质。这些工具还可以用于识别数据中以前未被发现的关系。反过来，这种认知的将使行业能够提高当前和未来巴肯井的生产率”。


    一旦 EERC 向日立提供了所有数据，日立显然没有或没有使用既是人工智能专家又是石油工程领域专家的人来为 EERC 执行该项目。日立从提供给他们的数据得出的结论是：巴肯（北达科他州、蒙塔拿州、萨斯喀彻省和曼尼托巴省）的石油产量是天气引起的结果，而不是任何关于石油工程的问题。在没有任何任何石油工程专业知识或理解的情况下，使用“数据科学”得出这样的解决方案是完全合逻辑的。EERC
    的工程师和科学家对人工智能给出的这种结果感到震惊，并与日立沟通，说明这些结果有多么不正确。


    日立对 EERC 工程师和科学家的回复也于 2015 年 4 月 24 日（周五）发布，主题为“更新！数据融合、虚假相关性与雨天”。在文中，提到：


    > “我注意到，本博客中展示的此项分析结果在结论上被夸大了。EERC 的人士指出了两个不符之处，我想在这里解决这些问题：下方图表显示的产量规模被夸大了（y
    轴），而且寒天气导致产量下降的幅度也被夸大了（x 轴）。在与 Matthew O’Keefe 核实了这些细节后，事实证明他们是正确的。你真得爱这些专家！”


    > “首先，y 轴上显示的产量规模是错误的。在操作上，用于此项计算的数据归结为我方面的一个操作失误——数据库被加载了多次相同的数据，导致该表中存在多达三份相同的数据。这极大地放大了分析中的任何结果”。


    > “这对天气影响产量的第二个因素产生了影响。在同一张图表中，在极端寒冷月份期间提到有‘高达 80%的减少影响’。这实际上在很大程度上是错误的。从近年的峰值产量到最低产量，产量的减少接近
    9%–15%，正如图表所示，以及天气如何影响产量？我需要一些天气数据，特别是历史天气数据。通过美国国家海洋和大气管理局（NOAA）网站 `http://noaa.gov`，我能够获得该地区的历史天气数据，利用纬度多边形，自
    1960 年以来的石油产量数据中的第一个条目”。


    2000 年左右，当图像识别通过人工智能和机器学习开发出来并展示了其强大的价值和特征时，美国最著名的石油公司之一的管理层聘请了一系列人工智能专家（没有任何石油工程专业知识），要求他们利用公司的海量数据来提供支持。


    当人工智能专家利用提供给他们的数据进行分析时，他们对公司管理层提到：“为了提高你们的油气产量，你们需要储层具有更高的孔隙率”。由于这些信息在石油工程专业的入门课程中就会教给石油工程学生，因此对于开始学习石油工程的人来说，这是一个常识，石油公司管理层对人工智能专家给出如此简单的石油工程技术结果感到震惊。这些问题导致许多行业（在人工智能应用的早期）得出结论，认为人工智能无效，或者是在浪费金钱。

