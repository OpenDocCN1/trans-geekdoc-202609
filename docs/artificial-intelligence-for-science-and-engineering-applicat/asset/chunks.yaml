    认为成为科学工程领域的专家对“人工智能”的细节了解极少是错误的，因为这些人本身已经是科学家，只需要花几周或几个月来研究“人工智能”，这与他们为了成为自身科学工程领域专家而所做的努力不同。相反的观点同样错误，即当“人工智能”专家认为他们可以使用这种新技术解决任何类型的问题时，因为他们是“人工智能”专家，对他们试图解决的任何科学工程问题几乎不需要多少理解。图
