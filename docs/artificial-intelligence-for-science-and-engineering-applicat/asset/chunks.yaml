    核武器没有最终毁灭我们的地球（至少到目前），主要原因与全球范围内关于处理核弹的条约和协议有关。全球政治家们最终能够在人工智能方面达成一套类似的全球性条约和协议，这是至关重要的。许多个人担心人工智能在未来几十年内如何影响我们的世界，主要原因之一与几个国家的政府有关。某些国家的政府正根据自己的目标使用这项技术，而这些目标取决于他们对民主的观点、信仰、理解或仇恨，以及他们根据人工智能如何为其服务来成为世界领导者的意图。人工智能伦理（`AI-Ethics`）在近期已成为一个重要课题，对于那些已经或正在对人工智能和机器学习算法感兴趣的人来说，必须对其充分理解。遗憾的是，大量的科学家和工程师并没有关注
    `AI-Ethics`，因为他们认为解决科学和工程相关问题不受 `AI-Ethics` 的影响，但这完全并非如此，这也是本章的主要原因。


    自 21 世纪 00 年代中期以来，随着基于人工智能的图像识别、语音识别、人脸识别、物体识别和自动驾驶车辆向世界上大多数人开放，人们对人工智能的兴趣显著增加。作为一项新的科学技术，人工智能将改变
    21 世纪许多事情。人工智能已成为人们、公司和学术界经常参与的最有趣的技术之一。


    例如，在过去的十年里，几家银行开始使用与人工智能相关的模型（由一些最知名的人工智能建模公司开发）作为向申请人提供贷款决策的第一步。由于通常有成百上千的人在不同的银行申请贷款，而且每家银行只有固定数量的员工，且他们的工作是研究和分析贷款申请人的特征，因此要审查成百上千名申请贷款者的细节是非常困难的。在这种情况下，几家银行购买通过人工智能开发的模型，以识别出顶尖的几位贷款申请人（例如
    20 至 50 人），是有意义的。然后银行员工就可以涵盖这些顶尖申请人的所有细节，为他们提供银行贷款。


    在公司招聘员工方面情况也是如此。这是由于许多公司拥有的人资源部门能够每天、每周或每月月分析并对招聘少数员工做出合理的决策。当这些公司中的某些公司生成招聘 10
    或 20 名新员工的广告时，有时会有大量人员申请此类工作。这就是为什么一些公司购买通过人工智能开发的模型来识别顶尖的几位员工申请人，以便公司的人力资源员工能够分析并对申请招聘职位的人员做出合理的决策。


    在过去的十年里，几家公司开发了人工智能模型，这些模型可以帮助银行决定向谁提供贷款，帮助公司决定招聘谁。银行使用 AI 模型来最大限度地减少贷款申请人的数量，因此银行员工必须更详细地评估他们的特征。此外，公司使用基于人工智能的模型来评估根据公司职位广告申请工作的大量申请人，然后显著减少了实际人力资源专业人士必须关注的申请人数量。最初，在过去的十年里，银行和公司使用人工智能提供贷款或招聘个人的方式已使
    `AI-Ethics` 成为一个极其重要且需要理解的课题。这些只是过去十年中发生的许多类似情况中的两个例子。


    `AI-Ethics` 对于那些热衷于使用这项技术解决科学和工程相关问题的科学家和工程师来说也极其重要。在过去的几年里，`AI-Ethics` 已成为人工智能在许多非科学和非工程相关领域应用中的重要课题。本章将涵盖并解释
    `AI-Ethics` 在该技术的科学和工程应用中的重要性。为了阐明科学和工程相关的 `AI-Ethics`，本章还将给出一些示例。


    当科学家和工程师对 `AI-Ethics` 缺乏理解，而他们的努力是使用人工智能解决基于物理的问题时，就会产生某些类型的问题（有意或无意）。产生此类问题的主要原因与不关注对
    `AI-Ethics` 的理解有关。如果不充分关注 `AI-Ethics`，通过应用人工智能来解决科学和工程相关问题会产生许多问题。`AI-Ethics`
    在此类情况下的影响通常涉及：


    1. 缺乏对人工智能的科学理解；

    2. 通过科学和工程应用人工智能解决基于物理的现实问题方面缺乏成功；或

    3. 将传统的工程偏见（假设、解释、简化和先入为主的概念）整合到物理现象的 AI 模型中。


    目前，一些声称使用人工智能工程应用的个人和公司在解决问题时包含了大量的人类偏见，以便他们在未能构建出基于事实、现实和实际数据且不包含人类偏见的 AI 模型后，可以使用机器学习算法来解决问题。工程中的人类偏见与用于解决物理问题的数学方程构建有关。


    ## 数据是 AI 建模的基础


    人工智能使用机器学习算法开发工具和模型以实现其目标。人工智能模型的开发与“数据”密切相关。数据的质量和数量对 AI 模型的行为有重大影响。正如本章上一节提到的，银行已开始使用人工智能模型作为向申请人提供贷款决策的第一步。AI
    模型通常使用申请人提供的历史数据以及之前的还款结果进行开发。贷款还款的正负面结果数量，以及贷款申请人的输入数据（如性别、种族、信用、居住地、收入等），将决定为银行贷款开发的
    AI 模型的质量。此类模型包含银行管理层决定的某些特征。

