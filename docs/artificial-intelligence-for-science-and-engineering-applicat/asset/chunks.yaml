    # 6 Ethics of Artificial Intelligence (AI-Ethics) in Science and Engineering


    DOI: [10.1201/9781003369567](https://doi.org/10.1201/9781003369567)


    It is a well-known fact that predictive modeling and solutions developed by Artificial
    Intelligence and machine learning are based on “Data”. Since it is known how data
    is used to build models using Artificial Intelligence, the main characteristics
    of AI-Ethics are about addressing how AI models become biased or being told (and
    characterized) how to generate results based on the quality and quantity of the
    data that is used during AI-based model development.


    When it comes to the non-engineering application of Artificial Intelligence and
    machine learning, it has been proven that human biases such as racism and sexism
    can be included in the AI models through the inclusion of biased data during the
    training of the machine learning algorithms. Since science and engineering applications
    of Artificial Intelligence and machine learning are used to model physical phenomena,
    AI-Ethics can determine and clarify how human biases, or their concepts and ideas
    (meaning they want the type of results that should be generated by the AI-based
    model), can be used in the science and engineering applications of Artificial
    Intelligence.


    ## Introduction of AI-Ethics

