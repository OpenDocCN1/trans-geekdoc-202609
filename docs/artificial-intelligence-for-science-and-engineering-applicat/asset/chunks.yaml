    *   `Comment One`: 一些科学家（人工智能的原始开发者）启动了这项新的科学技术（AI），是因为`他们对分析数据感兴趣`。这就是他们开发出这种用于数据分析技术的由来。

    *   `Comment Two`: 一些科学家（人工智能的原始开发者）对`在人类物种大脑之外创造智能`感兴趣，然后他们学习并得出`通过处理数据是实现这一点的最好方式`。


    即使第一个注释（`Comment One`）让你觉得并不没错，人工智能的真实情况恰恰描述在第二个注释（`Comment Two`）中。阅读人工智能简史（位于此本书的第
    2 章）将决定你为什么第二个注释完全是事实。让我们从定义`Artificial Intelligence`和`Machine Learning`开始。


    必须指出的是，人脑是宇宙中最强大的模式识别引擎。人脑包含约 100 亿个神经元（也称为神经细胞）。如图 1.2 所示。显而易见，人脑的人工版本与从神经科学家那里学到的东西非常相似，如图
    1.2 所示。


    ![FIGURE 1.2 人脑中的神经元。](img/Fig01_02.jpg)


    FIGURE 1.2 人脑中的神经元。


    ![FIGURE 1.3 机器学习中使用的人脑神经元的人工版本。](img/Fig01_03.jpg)


    FIGURE 1.3 机器学习中使用的人脑神经元的人工版本。


    在图 1.2 中显示为`Dendrite`（树突）的部分在图 1.3 中显示为`Input`（输入）。在图 1.2 中显示为`Axon`（轴突）的部分在图
    1.3 中显示为`output`（输出）。在实际神经元中（如图 1.2 所示），细胞体产生从多个`Dendrites`进入细胞体的新类型电化学信号，这种由细胞体产生的新电化学信号进入`Axon`以与其他神经元连接。在图
    1.3 中，`Artificial Neuron`（人工神经元）合并所有的`Inputs`（输入值与与每个输入相关的权重之和，权重代表了每个输入的质量和重要性），并通过`Activation
    Function`（激活函数）发送以生成一个新值传递到`Output`（输出）。虽然人脑神经元细胞体内的活动是生物化学活动，但在机器学习算法中使用的人脑人工版本（人工神经网络）中，它是数学计算。


    比较图 1.2 和 1.3 中所示的内容可以清楚，生成人工神经网络（图 1.3 仅显示了一个人工神经元）的科学家们从神经科学中学习了人脑的特征，以开发人工智能的通用概念。因此，显而易见，人工智能模仿人脑的类似活动来学习智能并解决问题。


    人脑中的神经元通过其轴突末端与其他许多神经元连接，这些末端连接到许多其他神经元的树突上。这种连接的示例如图 1.4 所示。人脑神经元之间的连接被称为`Synaptic
    Connection`（突触连接），如图 1.4 所示。图 1.5 展示了人脑神经元通信的更真实的表示。人脑神经元的实际数量为 100 亿。然而，人脑神经元相互之间的连接发展了超过
    1000 万亿的连接。人脑神经元之间的这种相互作用是产生智能的主要特征之一。本书这一章中的所有图都代表了最重要的机器学习算法之一（人工神经网络）的发展，该算法广泛用于（以许多不同的方式）生成人工智能，以建模并解决许多不同类型的问题。


    ![FIGURE 1.4 人脑中的神经元通过轴突末端相互连接。](img/Fig01_04.jpg)


    FIGURE 1.4 人脑中的神经元通过轴突末端相互连接。


    ![FIGURE 1.5 人脑神经元如何相互连接的示例。](img/Fig01_05.jpg)


    FIGURE 1.5 人脑神经元如何相互连接的示例。


    神经元之间的相互作用通过`Synaptic Connections`（突触连接）完成，这主要关于一个神经元的轴突末端与许多其他神经元的树突之间的距离。需要注意的是，人脑中的`Synaptic
    Connections` 并不是共享神经递质分子的实际物理连接，如图 1.6 所示。多种神经递质从许多其他神经元进入，通过其树突的电化学信号进入细胞体。


    ![FIGURE 1.6 人脑神经元之间的突触连接。](img/Fig01_06.jpg)


    FIGURE 1.6 人脑神经元之间的突触连接。


    细胞体产生一组新的神经递质，并通过其轴突与其他神经元通信。人脑神经元之间通信的最常见神经递质分子是氨基酸（谷氨酸、γ-氨基丁酸 `GABA` 和甘氨酸）、肽（阿片类：内啡肽、……）、单胺类（血清素、组胺、多巴胺、……）和其他（乙酰胆碱、……）（图
    1.6）。


    由于人类智能是通过人脑产生的，由于人脑特征涉及神经元（包括它们的连接和相互作用），人工智能相关的主要问题之一是模拟人脑神经元的连接和相互作用。在尝试模拟人脑的机器学习算法中，存在人工突触连接，如图
    1.7 所示。如图，在这些机器学习算法中，一个人工神经元的输出通过其输入连接到其他几个人工神经元。换言之，一个人工神经元的输出充当其他几个人工神经元的输入。图
    1.8 提供了称为人工神经网络机器学习算法中的多个人工神经元，它包含了大量的人工神经元。


    ![FIGURE 1.7 机器学习算法中的人工神经元也通过一个人工神经元的输出和其他神经元的输入相互连接。](img/Fig01_07.jpg)


    FIGURE 1.7 机器学习算法中的人工神经元也通过一个人工神经元的输出和其他神经元的输入相互连接。


