    companies to loan or hire individuals has made AI-Ethics an incredibly important
    topic to understand. The same is true about the science and engineering applications
    of Artificial Intelligence and machine learning. As long as realistic and non-traditional
    statistics and machine learning algorithms are incorporated, the quality of the
    AI-based models is purely based on the quality and quantity of the data that has
    been used to build the model. Therefore, the data that is used to develop the
    AI-based model completely controls the essence of the model that is developed
    and used for decision-making.


    As Artificial Intelligence moved forward and started solving more problems, scientists
    became interested in learning more details about how Artificial Intelligence works.
    It becomes quite clear that the main characteristic of Artificial Intelligence
    is its use of data to come up with the required solutions and to make decisions.
    Since data is the main source of AI-based model development, it became important
    to learn:


    1.  where the data is coming from and what the main source of it is, and


    2.  to what extent the data includes all the required information (even not explicitly)
    that Artificial Intelligence can extract patterns, trends, and information from.


    For example, a company was developed in 1975 and in its first 25 years (from 1975
    to 2000), its management hired all its employees based on their intellectual and
    quality rather than considering any racism and/or sexism. However, the company
    went through a management modification in the year 2000. The new management that
    was took over the same company starting in 2000 was just as important about employees
    intellectual and quality, but it was also very important to them the type of employees
    that would be hired ([Figure 6.1](#C_009_c6.xhtml#f6_1)). This had to do with
    the company’s management’s racism and/or sexism. Let’s assume that this is a fact
    and will create a specific type of data about hiring employees in the past several
    years.


    ![FIGURE 6.1 In the past 25 years, this company has had two series of managements.
    The first company management in the first 25 years was not sexist and racist,
    but in the last 15 years, the company included sexist and racist management.](images/Fig06_01.jpg)


    [**FIGURE 6.1**](#C_009_c6.xhtml#f6_1b) In the past 25 years, this company has
    had two series of managements. The first company management in the first 25 years
    was not sexist and racist, but in the last 15 years, the company included sexist
    and racist management.


    When it comes to another new management for this same company in 2015, they use
    an AI company to build them an AI-based system (AI-based model) that would help
    them hire new employees. The AI company will ask the management to provide them
    with data from their past several years of employment hiring. Depending on to
    what degree the previous several years of employee hiring data is provided to
    the AI company, they will be using it to train an AI-based system (AI-based model)
    to help them hire new employees. If only the data from the last 15–20 years is
    provided to the AI company, then the AI-based system (AI-based model) for hiring
    new employees would be a racist and sexist AI model because the data that was
    used to develop the model has learned from the biases that were included in the
    data used to train and develop it.


    It took almost a decade of research and study until it became quite clear through
    examining the actual application of this technology that AI and machine learning
    have the potential to be political \[[15](#Z_011_references.xhtml#r15),[16](#Z_011_references.xhtml#r16)\],
    racist \[[17](#Z_011_references.xhtml#r17),[18](#Z_011_references.xhtml#r18)\],
    and sexist \[[18](#Z_011_references.xhtml#r18),[19](#Z_011_references.xhtml#r19)\].
    This has to do with the type of data that is used to build the AI and machine
    learning models. In other words, it is quite possible to create a biased AI and
    machine learning model that can do what you want it to do. It completely has to
    do with the data that is used to train and build the model. This is how AI-Ethics
    addresses the engineering application of AI when traditional engineers intentionally
    (or unintentionally) modify the quality of the AI-based models so that they generate
    what they believe is the right thing rather than modeling the physical phenomena
    based on reality, fact, and actual measurements.


    MIT’s AI-Ethics has published articles regarding the biases that can take place
    when using AI and machine learning. In some of these articles, it is clearly mentioned
    that “Three new studies propose ways to make algorithms better at identifying
    people in different demographic groups. But without regulation, that won’t curb
    the technology’s potential for abuse” \[[20](#Z_011_references.xhtml#r20)\], and
    “this is how AI bias really happens—and why it’s so hard to fix. Bias can creep
    in at many stages of the deep-learning process, and the standard practices in
    computer science aren’t designed to detect it” \[[21](#Z_011_references.xhtml#r21)\].'
