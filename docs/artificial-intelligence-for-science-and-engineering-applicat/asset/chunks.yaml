    The application of Artificial Intelligence is a complete paradigm shift in how
    science- and engineering-related problems are addressed. Becoming a “Data Science”
    expert practitioner requires a comprehensive understanding of how to modify the
    traditional science and engineering problem-solving approach. Understanding the
    mathematics behind the Machine Learning algorithms that represent Artificial Intelligence
    contributes less than 15% to becoming a true “Data Scientist”, specifically when
    it comes to science- and engineering-related problem-solving. This is the reason
    why it is a waste of time to purely concentrate on the mathematics behind Machine
    Learning algorithms that represent Artificial Intelligence during the short courses
    that are taught on this topic.


    # 1 Definition of Artificial Intelligence and Machine Learning


    DOI: [10.1201/9781003369356-2](https://doi.org/10.1201/9781003369356-2)


    In this chapter, the actual definitions of the Artificial Intelligence and Machine
    Learning will be covered. Unfortunately, many engineers have generated their own
    definition of Artificial Intelligence and Machine Learning and have not paid attention
    to the fact that the actual definition of this technology has been defined by
    the scientists who have originally developed it. It is important to make sure
    that the personal definitions of such technologies are not used instead of the
    actual definitions of this technology, which are defined by actual developers
    and actual experts of this technology. Some engineers generate their own definitions
    of Artificial Intelligence and Machine Learning so that their unrealistic application
    of this technology would make sense based on their definitions.


    First and foremost, before the definitions, let’s go through the real meaning
    of these four words: “Artificial”, “Intelligence”, “Machine”, and “Learning”.
    Once the actual meaning of these words that are used for this revolutionary technology
    is described, the actual definition of this revolutionary technology will make
    much more sense.


    ## What Are “Artificial” and “Intelligence”?


    First, let’s identify the definitions of the two words “Artificial” and “Intelligence”.
    Then putting these definitions together would provide some details about what
    “Artificial Intelligence” is and why it was used as a term to define this new
    technology. The word “Artificial” means replicated and is the copy and mimic of
    something that is “Natural”. “Artificial” is made, created, or produced by humans
    (*Homo sapiens*) rather than occurring naturally. The word “Intelligence” refers
    to the ability to acquire and apply knowledge and skills. “Intelligence” is the
    capacity for logic, understanding, self-awareness, learning, emotional knowledge,
    reasoning, planning, creativity, critical thinking, and problem-solving. Before
    the term “Artificial Intelligence” anytime the word “Intelligence” was used, it
    would refer to the Natural “Intelligence” and Human “Intelligence”.


    Therefore, the term “Artificial Intelligence” should not change the definition
    of “Intelligence” as what is Natural “Intelligence” and Human “Intelligence”.
    The term “Intelligence” should mean that “*Homo sapiens*” are making and producing
    what is known as Natural “Intelligence” and Human “Intelligence”. In other words,
    “Artificial Intelligence” is the simulation of Natural “Intelligence” and Human
    “Intelligence” using machines (computers). Since Natural and Human “Intelligence”
    is performed through the human brain, “Artificial Intelligence” mimics the human
    brain. Therefore, the definition of “Artificial Intelligence” would be the simulation
    of Natural and Human “Intelligence” through mimicking the human brain using machines
    (computers).


    Now that this definition of “Artificial Intelligence” has been done, it would
    be interesting to discuss how Natural and Human “Intelligence” works, so that
    it can be used in the same fashion for the Artificial version of “Intelligence”.
    First and foremost, the major Natural and Human “Intelligence” is “General”. The
    General Intelligence is incorporated into all *Homo sapiens*. The General Intelligence
    includes thinking, reasoning, remembering, imagining, learning words, using language,
    and a large amount of knowledge and problem-solving. The key to the definition
    of General Intelligence is to define Science and Engineering Intelligence. In
    Human Species, General Intelligence is common, while Science and Engineering Intelligence
    is not common and requires many studies and learning that goes above and beyond
    General Intelligence.


    Here is a question: Would it be possible for many humans to become expert scientists
    and engineers without attending high schools and then universities in order to
    earn their bachelor’s degree (B.S.), master’s degree (M.S.), or doctoral degree
    (Ph.D.), and then spend years of working to solve actual physics-based problems
    and gain experiences? If the answer to this question for human beings is “No”,
    “It is not required”, or “It is not possible”, would it make sense? Obviously,
    it would not make any sense since it is an absolute requirement for humans to
    go through such details in order to become science and engineering experts. Since
    such issues are quite actual and real about Natural and Human “Intelligence”,
    would it make sense for it not to be similar (actual and real) to “Artificial
    Intelligence”? In other words, if someone does not have any science or engineering
    expertise, does it make sense for her/him to be able to use Artificial Intelligence
    to solve science- and engineering-related problems?


    Science and Engineering “Domain Expertise” is an absolute requirement to use “Artificial
    Intelligence” for solving science- and engineering-related problems. Based on
    such definitions, it would be obvious that using “Artificial Intelligence” to
    solve different types of problems requires different types of approaches and solutions,
    which furthermore require different types of experiences and knowledge since the
    same is true of Natural and Human “Intelligence”. However, given the fact that
    “Domain Expertise” is an absolute requirement for solving science- and engineering-
    related problems using “Artificial Intelligence”, the same is true about having
    “Artificial Intelligence” expertise for such solutions. This characterizes the
    importance of science and engineering domain experts studying “Artificial Intelligence”
    to be able to solve physics-based problems using “Artificial Intelligence”. The
    important issue that needs to be mentioned here, from a Natural and Human “Intelligence”
    point of view, is the fact that the same amount of experience, learning, and research
    for expertise in “Artificial Intelligence” must be done because they have already
    become domain experts in science and engineering.

