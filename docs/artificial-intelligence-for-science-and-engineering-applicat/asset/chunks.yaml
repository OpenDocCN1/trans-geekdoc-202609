    As you can currently see and test the characteristics of the Artificial General
    Intelligence models (examples such as Image Recognition, or ChatGPT) you know
    that the results generated by the AI-based model are incredibly faster than what
    is done by humans. The same is true about the Science and Engineering Applications
    of Artificial Intelligence. Physics-based models generated by Artificial Intelligence
    even for highly complex physical phenomena that would take tens of hours to be
    done traditionally, will only take a few seconds or a couple of minutes to be
    solved by Artificial Intelligence.


    ## Physics-Based AI Models Provide Much Better Results than Traditional Physics-Based
    Modeling


    As it was mentioned before, using Artificial Intelligence to model physical phenomena
    requires using actual measured data and not any mathematical equations. It is
    a fact that when mathematical equations are used to model physical phenomena,
    assumptions and interpretations become part of the solutions. Furthermore, not
    every single variable or parameter that is observed in physical phenomena would
    definitely become part of the mathematical equation. On the other hand, when Artificial
    intelligence is used to develop a model for physical phenomena, every single actual
    measurement that has been generated will be included in the AI-based model. While
    only actual measurements are being used and no mathematical equations are being
    used, no assumptions, interpretations, or simplifications will become part of
    the AI-based model of physical phenomena.


    This fact always results in a much better and more realistic model and solution
    for physical phenomena. When the AI-based model of the physical phenomena is used
    to match the history of the physical phenomena and then used to optimize them,
    it provides a lot more realistic results than any ideas that have been included
    in the models. Given that everything is about fact and reality and avoids any
    assumptions and interpretations, the results are always far better (as well as
    much, much faster) than traditional mathematical-based models.


    ## Why Physics-Based Domain Expertise Must Be Used for Artificial Intelligence


    It is important to note that using Artificial Intelligence to model scientific
    and engineering physical phenomena only requires data. Artificial Intelligence
    will learn all the details of physical phenomena through the data that is provided
    to the machine learning algorithm. The most important issue that must be noted
    is the use of ACTUAL data on physical phenomena, not any data that can be generated
    by anyone, even domain experts. Since traditional modeling of physical phenomena
    has been performed through mathematical equations, the new Artificial Intelligence
    modeling of physical phenomena will not (must not) use mathematical equations
    to model them.


    Using physical domain expertise to generate Artificial Intelligence models of
    physical phenomena has several important requirements: (A) avoiding the traditional
    physics-based modeling that includes mathematical equations, (B) teaching and
    communicating the major information of the physical phenomena to the machine learning
    algorithm that is being used to generate Artificial Intelligence model through
    actual data. Using the physical domain expertise, the scientists and engineers
    must provide explanations of the important parts and realistic characteristics
    of the physical phenomena to the machine learning algorithms through the actual
    measured data that is used for the physics-based Artificial Intelligence modeling.


    Domain experts of any specific engineering topic must realize that “Learning”
    by the machine about the specific engineering topic requires “Teaching”. First,
    “Teaching” can only be provided by specific domain experts, and second “Teaching”
    must be performed only through actual measured data, not through any data that
    is generated using any mathematical equations. Since the “First” item (“Teaching”
    by the specific domain experts) makes sense, the “Second” item (“Teaching” by
    actual measured data) usually presents some issues to the domain experts. What
    they need to do is interact with the actual measured data to provide potential
    information to the machine learning algorithms. Since we have addressed this issue
    in developing Reservoir Simulation and Modeling in Petroleum Engineering, it makes
    sense to provide such example from this engineering technology.


    Using Artificial Intelligence to perform Reservoir Simulation and Modeling in
    Petroleum Engineering, only actual field measurements are used. In petroleum engineering,
    for the production of oil and gas from reservoirs that are tens of thousands of
    feet under the ground, a large number of wells (almost a hundred) are drilled
    from the surface to the reservoir. The actual field measurement data that is used
    in AI-based Reservoir Modeling includes “operational conditions of each well on
    the surface”, “detail characteristics of how each well has been drilled and perforated”,
    “all the actual measurements of reservoir characteristics through well logs, cores,
    and seismic data”, and “all oil, gas, and water productions”.


    Such actual field measurement data is generated and used for every single well
    in a field. Traditionally, reservoir simulation and modeling in petroleum engineering
    were developed using complex mathematical equations almost 6–7 decades ago and
    have been solved through numerical simulation. Since we are using Artificial Intelligence
    instead of traditional modeling or traditional statistics, it will not be successful
    to only provide such data (actual measurements) for all the wells to the machine
    learning algorithm. Since reservoir engineering experts know that each well in
    the field (reservoir) is interacting with several offset wells (around it called
    offset wells), the domain expert must “Teach” this important issue by using the
    actual field measurements (not through any data generated from mathematical equations)
    with machine learning algorithms that are used for AI-based Reservoir Simulation
    and Modeling. Without doing this “Teaching” (using actual field measurement data),
    you will not be teaching the machine learning algorithm that the production from
    each well is not only a function of all the measured data that has been generated
    for each well, but some actual measured data from each offset well must also be
    included in every single well so that its production can be generated by Artificial
    Intelligence in a correct fashion. This is an explanation of how engineering and
    scientific domain expertise must be used to help Artificial Intelligence.


    In the many times, that I have explained the use of “Actual Measured Data” in
    Artificial Intelligence for modeling physical phenomena, many top scientists and
    engineers have asked very interesting and correct questions. Their question has
    been: “Do you realize that all the actual measured data are never 100% accurate?
    Do you realize that the overwhelming majority of the actual measured data usually
    have some issues such as uncertainty or noise?” I always reply to them, “Yes,
    indeed”. “You are absolutely correct”. In order to answer that question and explain
    to them that while the “actual measured data are never 100% accurate”, they are
    still the most important information that must be provided to Artificial Intelligence
    and show them how such an issue does not mean that Artificial Intelligence is
    unable to use it in a fashion to solve physics problems correctly. To show and
    explain this issue, I provide them with a paragraph that has been shown in [Figure
    4.5](#C_007_c4.xhtml#f4_5) and is located in the next page in this chapter.

    '
