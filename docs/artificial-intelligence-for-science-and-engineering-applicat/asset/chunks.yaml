    The fifth technical paper that included XAI was an `SPE` paper (`SPE 95942`) that
    was published in 2005. This paper covers XAI of hydraulic fracturing in the Golden
    Trend of Oklahoma. This paper includes two figures that show XAI results for the
    hydraulic fracturing of multiple individual wells in this field. `Figure 7.34`
    explains how shot per foot (x-axis) and injection rates (`BPM/ft`) (y-axis) influence
    30-Year EUR productivity for three individual wells. These wells show different
    types of responses as the number of perforations and average rate of injection
    per foot of thickness change. The production response is different for each of
    these wells as the number of perforations and the average injection rates start
    to increase.


    ```

    FIGURE 7.34 SPE 95942 paper’s Figure 13. Sensitivity analysis for "Shot/ft" and
    "Rate" for three wells in the database.

    ```


    The sixth technical paper that included XAI was an `SPE` paper (`SPE 10174`) that
    was published in 2006. This paper covers XAI of Smart Proxy Modeling of traditional
    numerical models. `Figure 7.35` provides Type Curves of the model that demonstrate
    the impact of a specific reservoir on oil production, while `Figure 7.36` provides
    Type Curves of the model demonstrating the impact of another specific reservoir
    on water cut.


    The seventh technical paper that included XAI was an `SPE` paper (`SPE 13902`)
    that was published in 2010. This paper covers completion design characteristics
    of hydraulic fracturing in Bakken Shale. The XAI model that is shown in this paper
    was developed using `Imagine` software to develop `TDM`.


    ```

    FIGURE 7.35 SPE 10174 paper’s Figure 10. Behavior of 5-Year Cumulative Production
    as a function of time for different values of "A" of top layer. This can be considered
    a type curve for this reservoir.

    FIGURE 7.36 SPE 10174 paper’s Figure 11. Behavior of instantaneous water cut as
    a function of time for different values of "B" of top layer. This can be considered
    a type curve for this reservoir.

    ```


    `Figure 7.37` demonstrates the use of XAI to explain the production characteristics
    as a function of `Lateral Length` and `Injected Fracturing Fluid` (graph on the
    left) and the oil production characteristics as a function of `Pay Thickness`
    and `Lateral Length` (graph on the right).


    ```

    FIGURE 7.37 SPE 13902 paper’s Figures 27 and 28 – effect of volume of injected
    fluid and lateral length on production rate (Middle Bakken model) – effect of
    pay thickness and lateral length on production rate (Middle Bakken model).

    ```


