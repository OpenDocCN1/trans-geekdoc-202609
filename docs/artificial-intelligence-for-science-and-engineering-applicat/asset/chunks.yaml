    #### XAI Model for Conventional Reservoirs – Top-Down Modeling


    Type Curves shown in [Figure 7.24](#C_010_c7.xhtml#f7_24), [Figure 7.25](#C_010_c7.xhtml#f7_25),
    [Figure 7.26](#C_010_c7.xhtml#f7_26) were developed for a mature offshore field
    in northern Africa using Artificial Intelligence Reservoir Simulation and Modeling
    (Top-Down Modeling – TDM), which is a purely Data-Driven Reservoir Modeling technology
    \[[25](#Z_011_references.xhtml#r25)\]. These figures explain how and to what degree
    parameters such as Gas-Lift ([Figure 7.24](#C_010_c7.xhtml#f7_24)), Completion
    ([Figure 7.25](#C_010_c7.xhtml#f7_25)), and Porosity ([Figure 7.26](#C_010_c7.xhtml#f7_26))
    can historically influence oil production for the entire field.


    ![FIGURE 7.24 Gas-lift Type Curves of the well productivity for the entire field
    as a function of time (date).](images/Fig07_24.jpg)


    [**FIGURE 7.24**](#C_010_c7.xhtml#f7_24b) Gas-lift Type Curves of the well productivity
    for the entire field as a function of time (date).


    ![FIGURE 7.25 Completion Type Curves of the well productivity for the entire field
    as a function of time (date).](images/Fig07_25.jpg)


    [**FIGURE 7.25**](#C_010_c7.xhtml#f7_25b) Completion Type Curves of the well productivity
    for the entire field as a function of time (date).


    ![FIGURE 7.26 Porosity Type Curves of the well productivity for the entire field
    as a function of formation pay thickness.](images/Fig07_26.jpg)


    [**FIGURE 7.26**](#C_010_c7.xhtml#f7_26b) Porosity Type Curves of the well productivity
    for the entire field as a function of formation pay thickness.


    The well-behaved characteristics of these Type Curves that were developed using
    actual field measurements rather than mathematical equations clearly show how
    “XAI” has been used for the development of Artificial Intelligence Reservoir Simulation
    and Modeling (TDM). As was mentioned before, Artificial Intelligence Reservoir
    Simulation and Modeling (TDM) does not use any mathematical equations to generate
    dates or to perform any kind of calculations to generate the Type Curves that
    are shown in [Figure 7.24](#C_010_c7.xhtml#f7_24), [Figure 7.25](#C_010_c7.xhtml#f7_25),
