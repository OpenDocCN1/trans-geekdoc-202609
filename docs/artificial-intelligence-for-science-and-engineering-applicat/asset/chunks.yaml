- fmt: '

    It is incorrect to think that being a science and engineering domain expert requires
    very little detail about “Artificial Intelligence”, since such individuals already
    are scientists and need only to study “Artificial Intelligence” for a few weeks
    or months, different from what they have already done to become experts in their
    own science and engineering topic. The opposite side of this is just as wrong,
    when “Artificial Intelligence” experts think that they can solve any kind of problem
    using this new technology because they are “Artificial Intelligence” experts and
    need little understanding of any science and engineering problem that they are
    trying to solve. [Figure 1.1](#C_004_c1.xhtml#f1_1) shows (a) the requirement
    of expertise in Artificial Intelligence as well as expertise in science and engineering
    to be able to use Artificial Intelligence to solve engineering-related problems
    (Artificial Engineering Intelligence). It also shows that (b) experts in Artificial
    Intelligence can solve Artificial General Intelligence but not Artificial Engineering
    Intelligence (c), and science and engineering experts who are not experts in Artificial
    Intelligence cannot be able to solve Artificial Engineering Intelligence (d).


    ![FIGURE 1.1 (a) Expertise in artificial intelligence as well as science and engineering
    is required for solving engineering-related problems using artificial intelligence,
    (b) expertise in artificial intelligence is required for artificial general intelligence,
    (c) only expertise in artificial intelligence is not enough for artificial engineering
    intelligence, and (d) science and engineering experts that are not experts in
    artificial intelligence cannot be able to solve artificial engineering intelligence.](images/Fig01_01.jpg)


    [FIGURE 1.1](#C_004_c1.xhtml#f1_1b) (a) Expertise in artificial intelligence as
    well as science and engineering is required for solving engineering-related problems
    using artificial intelligence, (b) expertise in artificial intelligence is required
    for artificial general intelligence, (c) only expertise in artificial intelligence
    is not enough for artificial engineering intelligence, and (d) science and engineering
    experts that are not experts in artificial intelligence cannot be able to solve
    artificial engineering intelligence.


    ## What Are “Machine” and “Learning”?


    “Machine Learning” is a series of algorithms that are used to generate “Artificial
    Intelligence”. It is a fact that no data-driven problem-solving approaches were
    referred to as “Machine Learning” prior to the generation and use of “Artificial
    Intelligence”. Since certain types of “Intelligence”, such as science and engineering,
    require “Learning” and since computers (machines) are the tool for “Artificial”
    development of “Intelligence” then, the development of “Artificial Intelligence”
    requires the use of “Machine Learning”.


    While the details of “Machine Learning” will be discussed, first let’s identify
    the definitions of the two words “Machine” and “Learning”. After that, putting
    these definitions together would provide some details about what “Machine Learning”
    is and why it was used as a term to define this new technology. The word “Machine”
    in the context of performing algorithms refers to “Computers”. The word “Learning”
    means the process of acquiring new understanding, knowledge, behaviors, skills,
    values, attitudes, and preferences. Since “Machine Learning” algorithms are used
    to develop and generate “Artificial Intelligence”, the definition of “Artificial
    Intelligence” that was mentioned in the previous section makes “Machine Learning”
    follow the way Natural and Human “Intelligence” go through the learning process.
    In other words, machines should be exposed to learning the way humans are exposed
    to learning. However, given the fact that machines (computers) are not the same
    as humans, while “Learning” has the same types of requirements, it obviously cannot
    be done in the same fashion.


    The idea is to cover how humans learn and then see how computers can learn. In
    this specific application of “Artificial Intelligence” in Science and Engineering,
    the human learning of science and engineering should be paid attention to, and
    then try to find out how machines (computers) can learn the same types of items.
    In that context, let’s first identify: how do humans learn science and engineering?
    It is quite obvious that for humans to learn science and engineering, they are
    required to go to high school and university for several years. When humans go
    to the university to learn about science and engineering, what do they get exposed
    to too? It is entirely clear that professors at universities “Teach” topics to
    the students so that they can “Learn” the topics that they are attending in courses.
    It is obvious that in universities “Teaching” is the best way to “Learning”.


    In General Intelligence, learning can be done through exposure and experience;
    nevertheless, teaching can also be helpful, although it may not necessarily be
    an absolute requirement since “General Intelligence” is part of the brain of the
    Human Species. However, when it comes to science and engineering, “Learning” absolutely
    requires “Teaching”. Since this is the case in Natural and Human “Intelligence”,
    it must be used for “Artificial Intelligence” through “Machine Learning”. As it
    was mentioned in the previous paragraphs that “Professors at the universities
    Teach” topics to the students so that the students can “Learn” the topics that
    they are attending in courses, then it is important to answer the following questions:
    Is it possible for a professor at a university to “Teach” a topic that she/he
    is not an expert in? The answer is clear: NO.


    In order to teach a topic, you must be an expert in that topic and know it very
    well so that you can find the best way to communicate and teach the essence and
    details of the topic to the students that have taken the course so that they can
    “Learn” it. The same is true about “Machine Learning” in the science and engineering
    application of “Artificial Intelligence”. Domain expertise is an absolute requirement
    of “Artificial Intelligence” and “Machine Learning” to be used to analyze, model,
    and solve science- and engineering-related problems. Details of this issue will
    be covered in more detail in this book.


    ## Artificial Intelligence and Machine Learning


    Artificial Intelligence and Machine Learning are a complete paradigm shift when
    compared with traditional approaches to analysis, modeling, problem-solving, and
    decision-making in science and engineering. Artificial Intelligence and Machine
    Learning for Science and Engineering Applications is a “Paradigm Shift”. Examples
    of Paradigm Shifts in science and engineering are Copernican Paradigms in the
    16th century, Newtonian Paradigms in the 19th century, and Einsteinian Paradigms
    in the 20th century.


    The new Paradigm is analysis, modeling, problem-solving, and decision-making in
    science and engineering through Artificial Intelligence and Machine Learning in
    the 21st century. The advancements and breakthroughs in the way the industry is
    approaching and solving challenging engineering and scientific problems are the
    paradigm shift in the main issues of Artificial Intelligence and Machine Learning.
    Artificial Intelligence and Machine Learning, together with the availability of
    large volumes of data and significant computational capabilities, have rapidly
    changed the landscape for every aspect of science and engineering.


