    What is very important to note is the fact that no specific mathematical equation
    (or pre-determined correlation through equation-based data) was used to develop
    this “AI-based Shale Analytics model”. [Figure 7.10](#C_010_c7.xhtml#f7_10) has
    performed Single Parameter Sensitivity Analysis on “Stimulated Lateral Length”
    on the well (`ISWN#056MSWPADU-1`), [Figure 7.11](#C_010_c7.xhtml#f7_11) has done
    the same for the well (`ISWN#032MSWPACW-3`) and [Figure 7.12](#C_010_c7.xhtml#f7_12)
    has done it for the well (`ISWN#036MSWPACC-1`). This same Single Parameter Sensitivity
    Analysis has been repeated for “Proppant per Stage” on [Figure 7.13](#C_010_c7.xhtml#f7_13)
    for the well (`ISWN#089MSWPAK-1`), on [Figure 7.14](#C_010_c7.xhtml#f7_14) for
    the well (`ISWN#056MSWPADU-1`), and finally on [Figure 7.15](#C_010_c7.xhtml#f7_15)
    for the well (`ISWN#076MSWPAHJ-2`). The model behavior for all these wells and
    parameters makes perfect sense from a physics point of view. This is a good example
    of XAI in shale analytics.


    #### Step 2: Double Parameter Sensitivity Analysis


    Analyzing the sensitivity of two parameters simultaneously, instead of a single
    parameter, will result in a three-dimensional figure. As shown in [Figure 7.16](#C_010_c7.xhtml#f7_16),
    the modification of the “6 Month Gas productivity” (`Z` access in the plot) of
    an identified well is explained as a function of modifying of the two reservoir
    characteristics, “Porosity” and “Initial Water Saturation”. While the Artificial
    Intelligence model has generated the productivity of this specific well, it is
    explaining how the well productivity may change as a function of modifications
    to these two reservoir characteristics while keeping all other input parameters
    constant.


    ![FIGURE 7.16 This figure shows the sensitivity of the hydrocarbon production
    from a given shale well as a function of two variables (porosity and initial water
    saturation) while all other variables are kept constant.](images/Fig07_16.jpg)


    [FIGURE 7.16](#C_010_c7.xhtml#f7_16b) This figure shows the sensitivity of the
    hydrocarbon production from a given shale well as a function of two variables
    (porosity and initial water saturation) while all other variables are kept constant.


    It is interesting to note that the explanation of this “AI-based Shale Analytics”
    model makes perfect physics sense, since it is explaining that the well productivity
    will increase as the porosity of the reservoir increases while the initial water
    saturation decreases. Again, it is important to note that (a) the same type of
    general trend (increase of well productivity as porosity increases and initial
    water saturation decreases) takes place for every single well in this field, and
    (b) no mathematical equations were used to generate any data for the training,
    calibration, and validation of this “AI-based Shale Analytics” model.


    #### Step 3: Multiple Parameter Sensitivity Analysis


    As the sensitivity analysis of the number of input parameters increases to more
    than two parameters, providing figures with multiple dimensions will no longer
    be possible. The most common way of performing sensitivity analysis for multiple
    input parameters (more than two) is Monte Carlo Simulation (MCS). In MCS, there
    are no limitations on how many input parameters can be used in order to perform
    multiple-parameter sensitivity analysis.


    The “AI-based Shale Analytics” model is used as the MCS’s objective function.
    Once the number of parameters for the sensitivity analysis is identified, the
    process can be started. In the example shown in this part of the chapter in [Figure
    7.17](#C_010_c7.xhtml#f7_17), four parameters have been identified for sensitivity
    analysis. The four parameters that have been identified as shown in [Figure 7.17](#C_010_c7.xhtml#f7_17)
    are porosity `[%`, initial water saturation `[%`, stimulated lateral length `[ft.]`,
    and proppant per stage `[lbs.]`. Once the number of parameters for the sensitivity
    analyses has been identified, performing MSC requires the following three steps:


    ![FIGURE 7.17 Sensitivity analysis of multiple parameters using MCS. The predictive
    model is deployed thousands of times in order to identify the potential distribution
    of hydrocarbon production as a function of changes in both reservoir characteristics
    (porosity and initial water saturation) and completion design (stimulated lateral
    length and proppant per stage).](images/Fig07_17.jpg)


    [FIGURE 7.17](#C_010_c7.xhtml#f7_17b) Sensitivity analysis of multiple parameters
    using MCS. The predictive model is deployed thousands of times in order to identify
    the potential distribution of hydrocarbon production as a function of changes
    in both reservoir characteristics (porosity and initial water saturation) and
    completion design (stimulated lateral length and proppant per stage).


    1. Identification of the type of distribution for each parameter `[uniform, triangular,
    Gaussian, … distribution]`,


    2. Number of times that the MCS’s objective function must be executed (the “AI-based
    Shale Analytics” model in this case) to generate the results (model output – here:
    well productivity), and finally,


    3. Identification of the number of bins to demonstrate the distribution of the
    well productivity as a function modification of all the identified input parameters.


    The above-mentioned three steps are identified in [Figure 7.17](#C_010_c7.xhtml#f7_17).
    Results of the multiple parameter sensitivity analysis for three of the wells
    in this field are shown in [Figure 7.17](#C_010_c7.xhtml#f7_17) (`ISWN#002MSWPAAD-1`),
    [Figure 7.18](#C_010_c7.xhtml#f7_18) (`ISWN#018MSWPABE-2`), and [Figure 7.19](#C_010_c7.xhtml#f7_19)
    (`ISWN#018MSWPABE-2`). In these analyses, four parameters (Porosity, Initial Water
    Saturation, Stimulated Lateral Length, and Proppant per Stage) were used to demonstrate
    the sensitivity of each well’s productivity to their modifications, while all
    other input parameters for each well were kept constant. While the blue bar chart
    shows the distribution of the well productivity as a function of modification
    of these parameters, the red curve shows the summation of the distribution.


    ![FIGURE 7.18 The AI model is deployed thousands of times for well ISWN#018MSWPABE-2
    to identify the potential distribution of hydrocarbon production as a function
    of changes in both reservoir characteristics and completion design.](images/Fig07_18.jpg)


    [FIGURE 7.18](#C_010_c7.xhtml#f7_18b) The AI model is deployed thousands of times
    for well `ISWN#018MSWPABE-2` to identify the potential distribution of hydrocarbon
    production as a function of changes in both reservoir characteristics and completion
    design.


    ![FIGURE 7.19 The AI model is deployed thousands of times for well ISWN#018MSWPABE-2
    to identify the potential distribution of hydrocarbon production as a function
    of changes in both reservoir characteristics and completion design.](images/Fig07_19.jpg)


    [FIGURE 7.19](#C_010_c7.xhtml#f7_19b) The AI model is deployed thousands of times
    for well `ISWN#018MSWPABE-2` to identify the potential distribution of hydrocarbon
    production as a function of changes in both reservoir characteristics and completion
    design.


    Using the red curve in these figures, P10 (almost the highest productivity of
    the well), P50 (almost the average productivity of the well), and P90 (almost
    the lowest productivity of the well) can be identified for each particular well
    as a function of modification of the parameters that are used for the sensitivity
    analysis. The characteristics of the “blue bar chart” and the “red curve” explain
    the physics of the “AI-based Shale Analytics” model in many details for every
    single well in this field.


    ### Part 3 of XAI: Type Curves

