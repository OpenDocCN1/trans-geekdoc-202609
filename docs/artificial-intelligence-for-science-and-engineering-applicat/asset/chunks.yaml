    *   `Comment One`: Some scientists (original developers of Artificial Intelligence)
    started this new science and technology (AI) because `they were interested in
    analyzing data`. This is how they came up with this technology for data analytics.

    *   `Comment Two`: Some scientists (original developers of Artificial Intelligence)
    were interested in the `creation of intelligence outside of the brain of the Human
    Species` and then they learned and concluded that `this can be done in the best
    way through dealing with data`.


    Even if the first comment (`Comment One`) does not make you feel too wrong, the
    actuality of Artificial Intelligence exactly is described in the second comment
    (`Comment Two`). Reading the brief history of Artificial Intelligence (in [Chapter
    2](#C_005_c2.xhtml) of this book) will determine why the second comment is all
    about actuality. Let’s start by defining `Artificial Intelligence` and `Machine
    Learning`.


    It must be noted that the human brain is the most powerful pattern-recognition
    engine in the universe. The human brain includes about 100 billion neurons (also
    called nerve cells). A neuron, as shown in [Figure 1.2](#C_004_c1.xhtml#f1_2),
    includes several dendrites, a cell body (soma), and an axon that includes several
    axon terminals. Making an artificial version of the human brain that can be used
    to generate Artificial Intelligence through Machine Learning algorithms is shown
    in [Figure 1.3](#C_004_c1.xhtml#f1_3). It should be clear that the artificial
    version of the human brain is quite similar to what was learned from the neuroscientists,
    as shown in [Figure 1.2](#C_004_c1.xhtml#f1_2).


    ![FIGURE 1.2 The neuron in the human brain.](images/Fig01_02.jpg)


    [FIGURE 1.2](#C_004_c1.xhtml#f1_2b) The neuron in the human brain.


    ![FIGURE 1.3 The artificial version of the neurons of the human brain used in
    machine learning.](images/Fig01_03.jpg)


    [FIGURE 1.3](#C_004_c1.xhtml#f1_3b) The artificial version of the neurons of the
    human brain used in machine learning.


    What is shown as `Dendrite` in [Figure 1.2](#C_004_c1.xhtml#f1_2) is shown as
    `Input` in [Figure 1.3](#C_004_c1.xhtml#f1_3). What is shown as `Axon` in [Figure
    1.2](#C_004_c1.xhtml#f1_2) is shown as `output` in [Figure 1.3](#C_004_c1.xhtml#f1_3).
    In the actual neurons (shown in [Figure 1.2](#C_004_c1.xhtml#f1_2)), the cell
    body generates a new type of electrochemical that has been entered into the cell
    body from the multiple `Dendrites`, and this new electrochemical generated by
    the cell body moves into the `Axon` to be connected to other neurons. In [Figure
    1.3](#C_004_c1.xhtml#f1_3), the `Artificial Neuron` combines all the `Inputs`
    (summation of the input values and the weights associated with each input that
    will represent the quality and importance of each input) and sends it through
    an `Activation Function` to generate a new value to go to the `Output`. While
    the activities in the cell body of human brain neurons’ are bio-chemical activity,
    in the artificial version of the human brain that is used in machine learning
    algorithms (Artificial Neural Network) it is a mathematical calculation.


    Comparing what is shown in [Figures 1.2](#C_004_c1.xhtml#f1_2) and [1.3](#C_004_c1.xhtml#f1_3)
    clarifies that the scientists that have generated the Artificial Neural Network
    ([Figure 1.3](#C_004_c1.xhtml#f1_3) shows only one artificial neuron) have learned
    the human brain’s characteristics from neuroscience in order to develop the general
    idea of Artificial Intelligence. Therefore, it is clear that Artificial Intelligence
    mimics the similar activities of the human brain to learn intelligence and solve
    problems.


    Neurons in the human brain are connected to a large number of other neurons using
    their axon terminals that are connected to dendrites of many other neurons, Example
    of such connections are shown in [Figure 1.4](#C_004_c1.xhtml#f1_4). The connections
    between neurons in the human brain are called the `Synaptic Connection`, as shown
    in [Figure 1.4](#C_004_c1.xhtml#f1_4). [Figure 1.5](#C_004_c1.xhtml#f1_5) shows
    a more realistic representation of the communication of the neurons in the human
    brain. The actual number of human brain’s neurons is 100 billion. However, the
    connections of the human brain’s neurons to each other develop more than 100 trillion
    connections between each other. This interaction between neurons in human brain
    is one of the major characteristics of generating Natural and Intelligence. All
    the figures in this chapter of the book represent the development of one of the
    most important Machine Learning Algorithms (Artificial Neural Network) that is
    commonly used (in so many different ways) to generate Artificial Intelligence
    to model and solve so many different types of problems.


    ![FIGURE 1.4 Neurons in the human brain connect to each other through the axon
    terminal.](images/Fig01_04.jpg)


    [FIGURE 1.4](#C_004_c1.xhtml#f1_4b) Neurons in the human brain connect to each
    other through the axon terminal.


    ![FIGURE 1.5 Example of how neurons in the human brain are connected to each other.](images/Fig01_05.jpg)


    [FIGURE 1.5](#C_004_c1.xhtml#f1_5b) Example of how neurons in the human brain
    are connected to each other.


    The interaction between neurons is done through `Synaptic Connections`, which
    are mostly about the closeness of the axon terminals of one neuron and the dendrites
    of many other neurons. It is important to note that `Synaptic Connections` in
    the human brain are not actual physical connections to share neurotransmitter
    molecules, as shown in [Figure 1.6](#C_004_c1.xhtml#f1_6). Several neurotransmitters
    enter from quite a lot of other neurons through their Dendrite’s electrochemical
    enter the cell body.


    ![FIGURE 1.6 Synaptic connections between neurons in the human brain.](images/Fig01_06.jpg)


    [FIGURE 1.6](#C_004_c1.xhtml#f1_6b) Synaptic connections between neurons in the
    human brain.


    The cell body creates a new set of neurotransmitters and communicates them with
    other neurons through its axon. The most common neurotransmitter molecules that
    communicate between neurons in the human brain are Amino Acids (Glutamate, Gama-Aminobutyric
    Acid `GABA`, and Glycine), Peptides (Opioids: Endorphin, …), Monoamines (Serotonin,
    Histamine, Dopamine, …), and others (Acetylcholine, …) ([Figure 1.6](#C_004_c1.xhtml#f1_6)).


    Since Human Intelligence is created through the human brain, and since human brain
    characteristics involve neurons, including their connections and interactions,
    one of the major issues associated with Artificial Intelligence is mimicking the
    connections and interactions of the neurons in the human brain. In machine learning
    algorithms that try to mimic human brains, there are artificial synaptic connections,
    as shown in [Figure 1.7](#C_004_c1.xhtml#f1_7). As shown in this figure, in such
    Machine Learning algorithms, the outputs of one of the artificial neurons connect
    to several other artificial neurons through their inputs. In other words, the
    output of one of the artificial neurons acts as the input of several other artificial
    neurons. [Figure 1.8](#C_004_c1.xhtml#f1_8) provides several numbers of artificial
    neurons in a Machine Learning Algorithm known as Artificial Neural Network that
    includes a large number of Artificial Neurons.


    ![FIGURE 1.7 Artificial neurons in machine learning algorithms are also connected
    to each other through the output of one of the artificial neurons and the input
    of other neurons.](images/Fig01_07.jpg)


    [FIGURE 1.7](#C_004_c1.xhtml#f1_7b) Artificial neurons in machine learning algorithms
    are also connected to each other through the output of one of the artificial neurons
    and the input of other neurons.

