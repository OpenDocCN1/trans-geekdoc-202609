- fmt: '

    Well, it makes sense because data that is generated by mathematical equations
    is based on existing correlations, and therefore it guarantees that patterns from
    this data can be recognized by Machine Learning algorithms. Again, this has an
    “academic” value that allows you to learn how Artificial Intelligence and Machine
    Learning algorithms work, but it does not have a “realistic” value because it
    does not follow the main reason “WHY Machine Learning algorithm must be used”.


    Let us be clear: trying multiple approaches to achieve reasonable solutions is
    the right thing to do. However, it is important to be able to correctly judge
    the essence of the approach that is being used, and it is extremely important
    to pay attention to the scientific reasoning of “WHY Machine Learning algorithm
    must be used”. Unfortunately, in many cases, the judgment is based on marketing
    and business success rather than scientific correctness. Under such circumstances,
    the lack of realistic and scientific success in using Artificial Intelligence
    and Machine Learning in engineering-related problem-solving is clarified.


    It seems that those engineering domain experts who end up doing what was explained
    above and are also being called “Hybrid Models” have a superficial and limited
    understanding of Artificial Intelligence and Machine Learning. In general, this
    specific problem associated with engineering domain experts can be divided into
    two categories:


    1. Those who try to combine data generated by mathematical equations with actual
    measurements when trying to solve engineering-related problems using Artificial
    Intelligence and Machine Learning. This is called “Hybrid Model”.

    2. Those who try to use specific machine learning algorithms that have been developed
    to solve non-engineering-related problems to solve engineering-related problem.
    Here are two examples: (a) they use Convolutional Neural Network (`CNN`) that
    was developed to solve non-engineering-related problems such as “image recognition”,
    and (b) they use Long-Short-Term Memory (`LSTM`) that was developed to solve non-engineering-related
    problems such as “caption generation” for images.


    ## Requirements of Artificial Intelligence for Science and Engineering


    As it has already been mentioned, the major requirements of Artificial Intelligence
    of science and engineering are two areas of expertise: (1) Expertise in the specific
    science and engineering topic that Artificial Intelligence is being applied to
    and (2) Expertise in Artificial Intelligence and Machine Learning. If anyone is
    missing or is not truly an expert on one of the above two required areas of expertise,
    then they will not be able to realistically and correctly use Artificial Intelligence
    to enhance the solutions to science- and engineering-related problems. Unfortunately,
    this (unrealistic and incorrect application of Artificial Intelligence in science
    and engineering) has been happening in science and engineering for the past decade
    throughout the world.


    Many things that so far and currently are being mentioned as Artificial Intelligence
    and/or Machine Learning application in modeling and solving science- and engineering-related
    problems have included the use of traditional statistics or the same traditional
    science and engineering approaches through the use of some Machine Learning algorithms.
    Such approaches are always called “AI-based”, which is completely incorrect. The
    reason that such approaches are not correct is because such individuals and companies
    have very little understanding of Artificial Intelligence but use this term mainly
    from a marketing perspective. However, given the importance of the AI revolution
    in our world, science and engineering applications of Artificial Intelligence
    will enhance, hopefully soon.


    In the past decade, when scientists and engineers have become interested in Artificial
    Intelligence due to its importance in every aspect of our lives, they started
    to interact with Artificial Intelligence and use it to solve science and engineering
    problems. There are five major problems associated with how scientists and engineers
    in the past decade have been using Artificial Intelligence and Machine Learning:
    (1) Major Concentration on Mathematical Equations of the Machine Learning Algorithms,
    (2) Inclusion of Mathematical Equation of the Science- and Engineering-Related
    Problem in the AI-based Modeling, (3) Using the Machine Learning Algorithms that
    have been developed and used to solve Artificial General Intelligence-related
    problems, (4) Using Traditional Statistical approaches since they are also data-driven,
    and (5) Continuing the Traditional Engineering approaches to problem-solving but
    using Machine Learning algorithms. Following are short explanations of each of
    these five items that have been mentioned:


    ### Problem #1: Major Concentration on the Mathematical Equations of Machine Learning
    Algorithms


    Based on the traditional approach of science and engineering problem-solving,
    scientists and engineers have been concluding that as long as they understand
    and learn the mathematical equations of the machine learning algorithms that they
    will be using, then that makes them experts in Artificial Intelligence. Their
    conclusion is that they will be able to use Artificial Intelligence to correctly
    solve science- and engineering-related problems (AI-based), since they know exactly
    how the mathematical equations of the Machine Learning Algorithms are being used.
    The main reason for such an understanding is that in traditional engineering,
    it is an absolute requirement to be able to understand and learn the mathematical
    equations that have already been developed for any physical phenomena.


    Unfortunately, this is a misunderstanding of Artificial Intelligence. It must
    be understood that using Machine Learning Algorithms to solve science- and engineering-related
    problems and create AI-based solutions is quite different from the traditional
    approach to modeling physical phenomena. Using Artificial Intelligence to analyze,
    model, solve, and optimize science- and engineering-related problems is quite
    different from our traditional approach to doing this, which is through generating
    mathematical equations. Given the fact that the mathematical equations associated
    with the activities of the Machine Learning Algorithms are quite simple (relative
    to many of the mathematical equations that have developed for physical phenomena),
    overwhelming scientists and engineers think of becoming AI experts in a very short
    amount of time since they fully understand and can use the Machine Learning Algorithm.
    What is incorrect in their understanding of becoming experts applicable to Artificial
    Intelligence is their lack of realization that they must get a full understanding
    of Evolution, Neuroscience, and Philosophy that are associated with Artificial
    Intelligence and Machine Learning Algorithms. More details on this topic will
    be covered in [`C_007_c4.xhtml`].


    ### Problem #2: Inclusion of Mathematical Equations of the Science- and Engineering-Related
    Problem in AI-based Modeling


    Currently, the overwhelming majority of scientists and engineers that are trying
    to model specific science and engineering topics using Artificial Intelligence
    include the mathematical equations that have been developed for those specific
    science and engineering topics. Since the Machine Learning Algorithms are data-driven,
    their inclusion of “Physics-based Mathematical Equations” is done through the
    generation of data using the mathematical equations that have been developed and
    used to solve such problems in the past. They generate data from those mathematical
    equations and combine them with the actual and real data that has been collected
