    the next few decades ([Figure 3.6](#C_006_c3.xhtml#f3_6)). Of course, this new
    revolution in our world is a combination of Artificial Intelligence and Bio-Tech.
    The Bio-Tech mentioned here refers to `CRISPR` (`Clustered Interspaced Short Palindromic
    Repeats`) that was developed in 1987 and `CRISPER Cas9` (`CRISPR-associated protein
    9`) that had to do with human genes that were generated in 2002 \[[8](#Z_011_references.xhtml#r8)\].


    ![FIGURE 3.6 Homo sapiens new revolution: Artificial Intelligence and Bio-Tech.](images/Fig03_06.jpg)


    [`FIGURE 3.6`](C_006_c3.xhtml#f3_6b) Homo sapiens new revolution: Artificial Intelligence
    and Bio-Tech.


    Artificial Intelligence has already started to change so many things. Science
    and engineering domain experts that become highly skilled Artificial Intelligence
    practitioners are the ones that will control the future of science and engineering
    disciplines. Becoming a science- and engineering-related “Artificial Intelligence
    expert practitioner” requires extensive experience using Artificial Intelligence
    to solve science- and engineering-related problems.


    It is important to note that becoming a scientist or engineer with expertise in
    Artificial Intelligence will not happen in an abbreviated period of time. It requires
    a reasonable amount of time to practice Artificial Intelligence in a realistic
    fashion, rather than using it as a marketing tool.


    ## *Homo sapiens’* Science and Engineering Intelligence

