    ## 人工智能的科学与工程应用


    DOI：[`10.1201/978103396534`](https://doi.org/10.1201/978103396534)


    由于人工智能是一项技术，因此首先刻画科学和工程是合理的。一旦充分理解了科学和工程的应用，科学和工程成为人工智能的一部分也是合理的。


    ## 人类的通用智能


    人类的通用智能从我们出生那天就开始了。人类的通用智能不断增强。图像识别、声音识别、听力、说话、语言翻译等项目通过人类的通用智能在合理的时间内实现。人类的通用智能使得很小的孩子也能解决特定类型的问题。例如，如图
    3.1 所示，即使是 5 岁的孩子也能看出这些图像中哪一张是猫，哪一张是狗。

