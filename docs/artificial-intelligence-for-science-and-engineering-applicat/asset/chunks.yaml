  raw: 'Another example is shown in [Figure 3.2](#C_006_c3.xhtml#f3_2). Even before
    a child goes to school at the age of 7, if you show them a series of black and
    yellow circles and ask them if they can use a line to separate them from one another,
    the possibility of the child being able to do it is very high. Almost 99.99% of
    the children will be able to draw the red line that is shown in [Figure 3.2](#C_006_c3.xhtml#f3_2).
    Examples of [Figures 3.1](#C_006_c3.xhtml#f3_1) and [3.2](#C_006_c3.xhtml#f3_2)
    show the fact that human General Intelligence, even in a short time of life, allows
    us to solve a lot of problems. Currently, we are using Artificial Intelligence
    to solve these same types of problems incredibly quickly. Prior to the current
    version of Artificial Intelligence, solving a problem as shown in [Figure 3.1](#C_006_c3.xhtml#f3_1)
    could not have been done easily and fast by computers, as it is done today using
    Artificial Intelligence using Machine Learning algorithm called the Convolutional
    Neural Network (CNN).


    ![FIGURE 3.2 Black and yellow-colored circles can be separated by a non-linear
    line.](images/Fig03_02.jpg)


    [**FIGURE 3.2**](#C_006_c3.xhtml#f3_2b) Black and yellow-colored circles can be
    separated by a non-linear line.


    It is also important to note that when recently asking ChatGPT and Google Bard
    about Artificial Intelligence applications in general and engineering-related
    problem modeling and solving, they mentioned: “General Intelligence aims to replicate
    human-like intelligence across various domains, while engineering intelligence
    focuses on building specialized Artificial Intelligence Systems for specific tasks
    or applications. General Intelligence represents a more comprehensive and broader
    goal, whereas Engineering Intelligence deals with practical and targeted implementations
    of Artificial intelligence in specific areas. It is important to note that these
    are just two different approaches to Artificial Intelligence. There are many other
    ways to define and categorize Artificial Intelligence. However, general and engineering
    intelligence are two of the most common approaches”.


    General Intelligence eventually covers a human’s entire life and has particularly
    important and complex characteristics. I strongly recommend covering the important
    history of Homo sapiens by reading the book *Sapiens: A Brief History of Humankind*,
    written by Yuval Noah Harari \[[6](#Z_011_references.xhtml#r6)\]. Human’s General
    Intelligence covered our history for almost 100,000 years before Science and Engineering
    Intelligence got started in our history almost 300 years ago. Prior to Homo sapiens,
    other human species such as Neanderthals, *Homo erectus*, and … had certain amounts
    of General Intelligence (not the same amount and type that Homo sapiens had) that
    never changed or were enhanced to Science and Engineering Intelligence. However,
    it did happen to Homo sapiens and changed everything in our history.


    To cover Homo sapiens’ General Intelligence, it is important to cover and understand
    what happened in human history. Based on a book written by Charles Darwin \[[7](#Z_011_references.xhtml#r7)\],
    it is probable that “Africa was the cradle of humans because our two closest living
    relatives (Chimpanzees and Gorillas) live there” ([Figure 3.3](#C_006_c3.xhtml#f3_3)).
    While *Homo erectus* left East Africa almost a million years ago and Neanderthals
    left East Africa almost 400,000 years ago, they never changed from being hunter-gatherers.
    [Figure 3.4](#C_006_c3.xhtml#f3_4) shows the historical movements of *Homo erectus*,
    Homo Neanderthalensis (Neandertals), and Homo sapiens from East Africa to the
    rest of the world.


    ![FIGURE 3.3 Human evolution from chimpanzees and gorillas.](images/Fig03_03.jpg)


    [**FIGURE 3.3**](#C_006_c3.xhtml#f3_3b) Human evolution from chimpanzees and gorillas.


    ![FIGURE 3.4 Historical movement of Homo erectus, Homo neanderthalensis (Neandertals)
    and Homo sapiens from East Africa to the rest of the world.](images/Fig03_04.jpg)


    [**FIGURE 3.4**](#C_006_c3.xhtml#f3_4b) Historical movement of Homo erectus, Homo
    neanderthalensis (Neandertals) and Homo sapiens from East Africa to the rest of
    the world.


    *Homo sapiens* entered from Eastern Africa into what is today called the “Middle
    East” and “Europe” about 70,000 years ago. They lived for about 58,000 years as
    “Hunter-Gatherers”. The “Agricultural Revolution” took place about 12,000 years
    ago. It was a major change in Homo sapiens’ ways of living when compared to Neandertals
    and *Homo erectus* who had never changed their “Hunter-Gatherer” processes for
    more than hundreds of thousands of years. This demonstrates the enhancement of
    human General Intelligence.


    The next revolution for us (Homo sapiens) took place more than 11,000 years after
    the “Agricultural Revolution”. “Industrial Revolution” that happened in the 18th
    century changed much more issues in people lives ([Figure 3.5](#C_006_c3.xhtml#f3_5)).
    It created industrialization, manufacturing, economic transformation, the use
    of iron, steel, coal, electricity, etc. The objective was to make it possible
    to perform many actions much faster, easier, and quicker than they could have
    possibly been done by humans prior to this revolution. This must have had to do
    with the Homo sapiens’ brain and its General Intelligence.


    ![FIGURE 3.5 Industrial revolution of Homo sapiens 300 years ago.](images/Fig03_05.jpg)


    [**FIGURE 3.5**](#C_006_c3.xhtml#f3_5b) Industrial revolution of *Homo sapiens*
    300 years ago.


    It took the industrial revolution about two centuries to completely control and
    change the evolution of societies. Such revolutions are the major determinations
    of the difference between the intelligence of Homo sapiens and the intelligence
    of Neandertals and *Homo erectus*. It is completely clarified that Homo sapiens’
    General Intelligence is quite strong and is one of the main reasons why Homo sapiens
    became able to look so different not only from animals but also from all other
    human species. The main characteristic of such intelligence is the human brain.
    While the “Industrial Revolution” simulated human muscles, the current advancement
    in our world is known as the “biotech and Artificial Intelligence” revolution,
    which would simulate the human brain. This revolution does not require centuries,
    but only decades, to change our societies.


    Artificial Intelligence that simulates human intelligence and mimics the human
