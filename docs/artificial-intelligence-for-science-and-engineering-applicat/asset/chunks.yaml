    Shale Analytics is the Science and Engineering Application of Artificial Intelligence
    in unconventional reservoirs. The Artificial Intelligence Predictive Analytics
    of Shale that are developed for completion and production optimization are purely
    based on actual field measurements. In Shale Analytics use and incorporation of
    any types of mathematical equations are avoided due to a lack of realistic understanding
    of the physics of fluid flow in shale plays and the shape and characteristics
    of the fractures that are created as a function of the implementation of hydraulic
    fracturing in natural fracture plays.


    Once Artificial Intelligence Predictive Analytics of Shale is completed, through
    the generation of Type Curves, XAI is used in order to explain the physics of
    the completion and production of shale wells. Such explanations that are based
    on actual field measurements and completely avoid any kind of assumptions, interpretations,
    simplifications, and biases cannot be done through traditional approaches that
    have been used in the petroleum industry during the past decade. Traditional modeling
    approaches to hydrocarbon production from shale wells using Rate Transient Analysis
    (RTA) and Numerical Reservoir Simulation (NRS) include minimum amounts of actual
    field measurements and are fully controlled by soft (assumed) data. Soft (assumed)
    data that fully controls RTA and NRS include Fracture Half-Length, Fracture Height,
    Fracture Width, Fracture Conductivity, and even Stimulated Reservoir Volume (SRV),
    none of which is actually measured. Using these soft (assumed) data that can be
    generated by us and can have any values that we like them to have, instead of
    actual field measurements that are the main foundation of Shale Analytics, allows
    us to make any conclusions that we like to come up with even if they are 100%
    different from one another. In other words, such techniques can generate any kind
    of solution that we like to come up with and have absolutely nothing to do with
    facts or reality. It has to do with our objectives and has nothing to do with
    the realities associated with hydrocarbon production from shale wells.


    [Figures 7.21](#C_010_c7.xhtml#f7_21) and [7.22](#C_010_c7.xhtml#f7_22) show how
    XAI can provide information for every single well in a Marcellus Shale asset.
