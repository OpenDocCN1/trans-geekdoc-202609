    第五篇包含 XAI 的技术论文是 2005 年发表的一篇 `SPE` 论文（`SPE 95942`）。该论文涵盖了俄克拉荷马州黄金趋势（Golden Trend）水力压裂的
    XAI 研究。文中包含了两幅图表，展示了该地区多个单井水力压裂的 XAI 结果。`Figure 7.34` 解释了每英射孔（x 轴）和注入速率（`BPM/ft`）（y
    轴）如何影响三口单井的 30 年最终剩余产量（EUR）生产能力。随着射孔数量和每英尺厚平均注入速率的变化，这些井表现出不同类型的响应。随着射孔数量和平均注入速率的增加，每口井的产量响应均不同。


    ```

    FIGURE 7.34 SPE 95942 paper’s Figure 13. Sensitivity analysis for "Shot/ft" and
    "Rate" for three wells in the database.

    ```


    第六篇包含 XAI 的技术论文是 2006 年发表的一篇 `SPE` 论文（`SPE 10174`）。该论文涵盖了传统数值模型智能代理建模的 XAI 研究。`Figure
    7.35` 提供了模型的类型曲线，证明了特定储层对产油量的影响，而 `Figure 7.36` 提供的模型类型曲线则证明了另一个特定储层对含水的影响。


    第七篇包含 XAI 的技术论文是 2010 年发表的一篇 `SPE` 论文（`SPE 13902`）。该论文涵盖了巴肯页岩（Bakken Shale）水力压裂的完井设计特征。文中所示
    XAI 模型是使用 `Imagine` 软件开发 `TDM` 的。


    ```

    FIGURE 7.35 SPE 10174 paper’s Figure 10. Behavior of 5-Year Cumulative Production
    as a function of time for different values of "A" of top layer. This can be considered
    a type curve for this reservoir.

    FIGURE 7.36 SPE 10174 paper’s Figure 11. Behavior of instantaneous water cut as
    a function of time for different values of "B" of top layer. This can be considered
    a type curve for this reservoir.

    ```


