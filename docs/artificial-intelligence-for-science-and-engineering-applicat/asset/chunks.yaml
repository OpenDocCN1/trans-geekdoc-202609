    \ (the y-axis) and the amount of cold weather production decline is overstated\
    \ (the x-axis). After examining these details with Matthew O’Keefe, it turns out\
    \ they are right. You’ve got to love experts!”\n\n> “First, the volume of production\
    \ shown on the y-axis is wrong. Operationally, the data used for this calculation\
    \ boils down to an operational error on my part – the database was loaded more\
    \ than once with the same data resulting up to three copies of the same data existing\
