    # 人工神经网络机器学习算法


    `FIGURE 1.8` Artificial neural network machine learning algorithm. 人工神经网络机器学习算法。


    此外，必须注意到，人脑的另一个特征是`Machine Learning`算法所涉及的逻辑。人脑在问题解决和决策过程中也涉及逻辑。一个主要问题是：`What
    kind of logic is used by human brain?` 在传统方法中，解决科学和工程相关问题时使用的逻辑主要是`Aristotelian
    Logic`。


    ## 逻辑类型对比


    在当前的计算机版本中，`Aristotelian Logic` 仅包含 `0` 或 `1`，`Yes` 或 `No`，`Black` 或 `White`。显而易见，人脑并不使用这种
    `0` 或 `1` 的逻辑，而是处理 `0` 和 `1` 之间的无限数字。这意味着`Artificial Intelligence` 和 `Machine
    Learning` 必须使用多值逻辑（`multi-valued logic`）。


    因此，使用 `Artificial Intelligence` 进行建模、解决问题和决策的最佳方法是理解人脑如何处理信息（数据）以及它使用的逻辑类型。


    ## 速度与硬件差异


    比较人脑动作与智能手机（或计算机）的速度，哪一个更快？`Artificial Intelligence` 的一个主要问题是解决任何问题所需的时间。人脑的速度比智能手机芯片慢
    1000 万倍。人脑神经元放电的速度在 `1` 到 `200 Hz` 之间，而智能手机的 `CPU` 速度约为 `2 GHz`。`GHz` 是 `gigahertz`
    的缩写，它是交流（`AC`）或电磁（`EM`）波频率的单位。对于计算机处理器或 `CPU`而言，`GHz` 是时钟频率，也称为 `clock rate` 或
    `clock speed`，代表一个时间周期。


    然而，人脑具有学习和实施复杂活动的能力，这是计算机很难模拟的。这涉及到人脑处理信息的方式。


    ## 机器学习的原理


    `Machine Learning` 包括一系列用于生成 `Artificial Intelligence` 的算法。根据前文提到的 `Artificial
    Intelligence` 定义，`Machine Learning` 算法用于处理数据并使用正确的逻辑。


    过去使用计算机解决问题的方法完全依赖显式编程（`explicitly programming`），即精确地告诉计算机做什么。工程师一直在使用数值仿真（`numerical
    simulation`）。为了解决使用复杂数学方程建模的工程相关问题，需要生成数值仿真。所有工程师都清楚，在开发数值仿真模型时，必须提供完整的显式程序以便计算机执行仿真。


    值得注意的是，`Machine Learning` 算法不使用显式编程。同样适用于传统统计学（`traditional statistics`），它也是一种数据驱动的技术。在传统统计和任何其他传统的计算机建模中，我们总是详细地告诉计算机做什么，而不会要求它执行我们没有明确指示的事情。


    ## 算法分类


    在 `Machine Learning` 算法出现之前，我们永远不会期望计算机执行我们没有告诉过它们（通过 `coding`）的事情。这是机器学习算法与过去几十年计算机操作的主要区别。`Machine
    Learning` 算法是 `Open Computer Algorithms`（开放计算算法）。其核心问题是让算法在不使用预定义的数值求解数学方程，或不使用一系列数学方程来检查匹配数据的情况下，从数据中学习。


    常见的 `Machine Learning` 算法类型包括：

    - `Supervised Learning`（监督学习）

    - `Unsupervised Learning`（无监督学习）

    - `Semi-supervised Learning`（半监督学习）

    - `Reinforcement Learning`（强化学习）


    ## 数据的重要性


    由于开放的 `Machine Learning` 算法从数据中学习，因此提供给算法的数据非常重要。这意味着提供给 `Machine Learning` 算法的数据质量和数量关键。这里有两个必须关注的特征：


    1. **第一**：这意味着如果你意图在 `Artificial Intelligence` 建模中引入特定类型的偏见（`bias`），你可以通过提供的数据的类型和数量来实现。

    2. **第二**：这意味着如果你不是科学或工程技术的领域专家，你将不知道如何处理和应对收集到的真实原始数据。


    `Google Bard` 是一个大语言模型（`LLM`）聊天机器人。


    `ChatGPT`、`Microsoft Bing` 和 `Google Bard` 的另一个重要特征是它们执行任务的速度。这适用于所有基于 AI 的模型和技术。`ChatGPT`（即
    `Generative Pre-trained Transformer`）通过互联网海量数据集进行训练，包括网站、书籍和其他公开材料，能够回答问题、提供解释、语言翻译、代码编写、生产力辅助、头脑风暴以及编写各种文档。


    关于 `ChatGPT` 的响应，它们是基于训练数据中学到的模式和关联生成的。虽然模型可以提供有用信息，但有时也会生成错误或无意义的答案。始终建议从可靠来源验证信息，并使用批判性思维来解释模型的响应。

