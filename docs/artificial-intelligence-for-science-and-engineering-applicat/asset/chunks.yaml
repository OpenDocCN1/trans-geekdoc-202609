  trans: '


    图 6.2 和 图 6.3 显示了用于生产油气的常规和非常规来源的实际实测数据示例。这些图表清楚地表明，采集的实际现场测量数据与全球石油公司的主要特征——油气产量之间几乎没有显示出任何相关性。当使用人工智能和机器学习利用实际实测数据的复杂性来对此类物理现象进行建模时，石油行业绝大多数供应商和服务服务公司最终无法为这些复杂的物理过程开发出
    AI 系统和 AI 模型。


    ![图 6.2 东南亚某气田的实际实测数据。三幅图都显示了产油与气注（左侧）、完井（中间）以及孔隙率（右侧）的关系。](img/Fig06_02.jpg)


    图 6.2 东南亚某气田的实际实测数据。三幅图都显示了产油与气注（左侧）、完井（中间）以及孔隙率（右侧）的关系。


    ![图 6.3 宾夕法尼亚州西部马塞勒斯页岩气田的实际实测数据。三幅图都显示了产气量与受刺激侧向长度（左侧）、总分段数（中间）以及支撑剂总量（右侧）的关系。](img/Fig06_03.jpg)


    图 6.3 宾夕法尼亚州西部马塞勒斯页岩气田的实际实测数据。三幅图都显示了产气量与受刺激侧向长度（左侧）、总分段数（中间）以及支撑剂总量（右侧）的关系。


    由于此类营销公司无法利用复杂的实际实测数据来实现其基于 AI 的解决方案，它们得出结论，生成它们目前所谓的“混合模型”（Hybrid Models）。“混合模型”的定义是“实际现场测量”与“通过数学方程生成的数据”的结合。众所周知，通过数学方程生成的所有数据都包含数学方程中所有参数（变量）之间的某些类型的相关性。当大量数据已经包含了已知的相关性时，那么这些相关性就会从提供的数据中产生作为机器学习算法主要特征的模式识别。由于绝大多数数学方程已经包含了假设、解释和简化，它们被包含在“混合模型”中的数据生成将决定机器学习算法必须生成什么以及什么种类型的模式识别。这意味着，通过使用“混合模型”，我们已经在告诉人工智能必须生成哪种解决方案，而不是仅仅提供实际实测数据，并要求人工智能从实际数据中生成该种的模式，以发现正在解决的物理现象的真实情况。用于生成与实际现场测量数据混合的数学方程类型告诉了机器学习算法该怎么做。这就是
    AI 伦理中的主要问题“偏见”（Bias）。


    这里是上述段落提到的一个例子。图 6.4 提供了来自供应商和服务公司尝试用于开发基于 AI 模型的字段中两个（多个变量中的两个）变量的实际现场测量数据示例。假设他们在模型开发上付出了努力，但由于对人工智能在科学和工程应用方面的理解有限，他们无法开发出合理的基于
    AI 模型。一旦他们无法做到这一点，他们就会开始使用“混合模型”。其中一家公司使用特定的数学方程，可以为几个变量生成数据。


    ![图 6.4 示例气田的实际实测数据示例](img/Fig06_04.jpg)


    图 6.4 示例气田的实际实测数据示例。


    第一家公司使用的特定数学方程生成的数据如图 6.5 所示。正如在图 6.4 所示，生成的数据仅显示了这两个特定参数（变量）。一旦完成从数学方程生成此类数据并用于机器学习算法，就可以开发出图
    6.6 所示的模型。这些没有遵循 AI 伦理的公司仍会将此类模型称为基于 AI 的“混合模型”。


    ![图 6.5 使用针对多个变量的数学方程生成的数据示例。这显示了两个变量的图表。](img/Fig06_05.jpg)


    图 6.5 使用针对多个变量的数学方程生成的数据示例。这显示了两个变量的图表。


    ![图 6.6 使用“混合模型”可以生成的模型，通过数学方程生成的数据识别模型特征。](img/Fig06_06.jpg)


    图 6.6 使用“混合模型”可以生成的模型，通过数学方程生成的数据识别模型特征。


    图 6.7 和 图 6.8 显示了由另一家公司使用的另一个数学方程生成数据的类似方法，而图 6.4 中的原始数据数据也被该公司使用。由于该数学方程与图 6.5
    中使用使用的和显示的不同，因此该“混合模型”生成的基于 AI 模型将与图 6.6 中所示的不同。第二家公司从相同的实际测量数据（图 6.8）开发的“混合模型”与第一家公司使用相同的实际测量数据（图
    6.6）开发的“混合模型”不同。


    ![图 6.7 使用另一个针对多个变量的数学方程生成的数据示例。这显示了两个变量的图表。](img/Fig06_07.jpg)


    图 6.7 使用另一个针对多个变量的数学方程生成的数据示例。这显示了两个变量的图表。


    ![图 6.8 使用“混合模型”可以生成的模型，通过数学方程生成的数据识别模型特征。](img/Fig06_08.jpg)


    图 6.8 使用“混合模型”可以生成的模型，通过数学方程生成的数据识别模型特征。


    图 6.9 和 图 6.10 显示了当科学家和工程师不了解 AI 伦理时，如何开发出带有偏见的“混合模型”。


    ![图 6.9 实际实测数据（左侧）与两个不同数学方程生成的数据结合。](img/Fig06_09.jpg)


    图 6.9 实际实测数据（左侧）与两个不同数学方程生成的数据结合。


    ![图 6.10 通过 AI 伦理识别出的偏见，实际实测数据（左侧）被用于通过“混合模型”方法开发两种不同的基于 AI 模型。](img/Fig06_10.jpg)


    图 6.10 通过 AI 伦理识别出的偏见，实际实测数据（左侧）被用于通过“混合模型”方法开发两种不同的基于 AI 模型。


