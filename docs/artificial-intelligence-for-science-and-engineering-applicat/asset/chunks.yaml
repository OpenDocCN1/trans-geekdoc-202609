    # Introduction


    The same general approach is also applicable to the AI models for the human resources
    of large companies to make the decision about who to hire. Such models are also
    developed using existing data from multiple companies about employee applicants
    as well as the quality of the employees that have been hired in the past. Other
    applications of AI that make AI-Ethics highly important include `Face Recognition`,
    `Face Detection`, `Face Clustering`, `Face Capture`, `Face Match`, etc. Such technologies
    are used by mobile phones, security, police, airports, etc.


    In the science and engineering application of Artificial Intelligence, the characteristics
    of the data (including its quality and quantity) that is used for model development
    impact the quality of the AI-based models. Science and engineering application
    of Artificial Intelligence is the use of actual measurements and actual physics-based
    data to model physics rather than using mathematical equations to build models
    for physical phenomena. Traditionally, in the past few centuries, modeling physics
    at any given time had to do with engineers’ and scientists’ understanding of the
    physical phenomena that were being modeled. As scientists’ understanding of any
    physical phenomenon enhances, so do the characteristics of the mathematical equations
    that are used to model that physical phenomenon.


    Data that are used by non-scientific and non-engineering-related problems, such
    as the examples that were mentioned in the previous sections of this chapter (`Loans
    from Banks` and `Employee Hiring by Companies`), are usually generated by humans.
    The data generated by humans (their activities that are saved as data to be used)
    is not based on the facts and realities that are measured. Such data has much
    to do with the behavior of the humans that generate it. Such data has to do with
    decision-making by humans that may have certain types of behavior, understanding,
    intelligence, or even political issues.


    ## AI-Ethics Addresses the Bias in AI-based Modeling


    The characteristics of the quality and quantity of the data that is used to build
    the AI-based model determine whether any biases have been incorporated in the
    model developed by Artificial Intelligence. AI-Ethics’ objective is to identify
    the quality and quantity of the data that is used to build the AI-based model
    and to identify if any bias has been (intentionally or unintentionally) incorporated
    in the model through the data that has been used to build the model.


    The way Artificial Intelligence and machine learning have been used by banks and
    companies to loan or hire individuals has made AI-Ethics an incredibly important
    topic to understand. The same is true about the science and engineering applications
    of Artificial Intelligence and machine learning. As long as realistic and non-traditional
    statistics and machine learning algorithms are incorporated, the quality of the
    AI-based models is purely based on the quality and quantity of the data that has
    been used to build the model. Therefore, the data that is used to develop the
    AI-based model completely controls the essence of the model that is developed
    and used for decision-making.


    As Artificial Intelligence moved forward and started solving more problems, scientists
    became interested in learning more details about how Artificial Intelligence works.
    It becomes quite clear that the main characteristic of Artificial Intelligence
    is its use of data to come up with the required solutions and to make decisions.
    Since data is the main source of AI-based model development, it became important
    to learn:


    1. where the data is coming from and what the main source of it is, and

    2. to what extent the data includes all the required information (even not explicitly)
    that Artificial Intelligence can extract patterns, trends, and information from.


