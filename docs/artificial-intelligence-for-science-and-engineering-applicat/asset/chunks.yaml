    # 图 5.3 传统统计学与人工智能及机器学习之间的差异 [14].


    当利用人工智能从数据对工程相关问题的物理特性进行建模时，不会使用一组预先定义的方程来拟合数据。这种分离的主要原因是在使用人工智能对工程相关问题的物理特性进行建模并寻找解决方案时，避免偏见、先入为主的概念、粗略假设以及对问题的简化。当人工智能用于物理现象的工程建模时，其模型和解决方案完全围绕实际数据展开。在工业中，数据在大多数情况下都是实际的（现场）测量值，它们必须引导解决方案的形成，而不是根据我们今天对使用数学方程建模的物理学的理解。事实是，实际（现场）测量值代表了所建模问题的物理特性。因此，通过使用代表物理性的数据，这种方法变成了一种基于物理的问题解决方法。数据代表了正在建模的物理特性。


    图 5.4 显示了传统统计方法中使用的某些算法与人工智能中使用的某些机器学习算法的对比。虽然在某些书中，人工智能专家已经证明了机器学习算法能够执行传统算法（例如：线性回归、非线性回归……），但一些工程师开始将这些传统算法称为机器学习。


    ![图 5.4 传统统计学与人工智能及机器学习使用的不同算法。](img/Fig05_04.jpg)


    ## 图 5.4 传统统计学与人工智能及机器学习使用的不同算法。


    传统统计学与人工智能之间的另一个区别在于传统统计学对演绎推理的引入，以及人工智能对归纳推理的引入。演绎推理是根据通常被认为是真实的前提来得出结论的过程，而归纳推理是从特定的观察移动到更广泛的概括和理论。演绎推理通过遵循从一般到具体的直觉路径进行学习（即“关注细节的人”），而归纳推理则通过遵循从特定到一般的直觉路径进行学习（即“关注大局的人”）。


    虽然传统统计学和人工智能都基于所提供数据的模式进行运行，但传统统计学使用预定义的模式（即参数模型），并将观测值的某些衡量标准与模型的标准指标进行比较（`假设检验`），而人工智能通过数据构建模型，它不是从现有模型开始的。传统统计学使用现有模型来表征数据中的模式。它通过演绎的方式将现有模型的预定义模式与数据相匹配，遵循亚里士多德式的真理方法。人工智能则利用数据中的模式来构建模型。它通过归纳的方式发现数据中的模式。如图
    5.5 所示，传统统计学使用从一般原理到特殊情况的演绎推理，而人工智能则使用从特殊情况到一般原理的归纳推理。


    ![图 5.5 传统统计学使用演绎推理，而人工智能使用归纳推理。](img/Fig05_04.jpg) （注：此处图片路径与原文一致）


    ## 图 5.5 传统统计学使用演绎推理，而人工智能使用归纳推理。


    图 5.5 传统统计学使用演绎推理，而人工智能使用归纳推理。


    如图 5.6 和 5.7 所示，传统统计学和人工智能都基于所提供数据的模式进行运行。传统统计学使用预定义的模式（即参数模型），并将观测值的某些衡量标准与模型的标准指标进行比较（`假设检验`），而人工智能通过数据构建模型，它不是从现有模型开始的。传统统计学使用现有模型来表征数据中的模式。它通过演绎的方式将现有模型的预定义模式与数据相匹配，遵循亚里士多德式的真理方法。人工智能则利用数据中的模式来构建模型。它通过归纳的方式发现数据中的模式。


    ![图 5.6 演绎推理与归纳推理之间的差异。](img/Fig05_06.jpg)


    ## 图 5.6 演绎推理与归纳推理之间的差异。


