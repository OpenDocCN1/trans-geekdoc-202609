    ![FIGURE 7.27 Actual field measurements from an off-shore mature field in Southeast
    Asia that was used during the artificial intelligence reservoir simulation and
    modeling (top-down modeling – TDM).](images/Fig07_27.jpg)


    `FIGURE 7.27` Actual field measurements from an off-shore mature field in Southeast
    Asia that was used during the artificial intelligence reservoir simulation and
    modeling (top-down modeling – TDM).


    ### History of XAI in Petroleum Engineering


    Since 2001, seven Society of Petroleum Engineering (SPE) papers have been published
    that include what is today called XAI. These seven SPE papers include a total
    of 38 figures that use the Artificial Intelligence Predictive Analytics models
    in order to explain how these models can explain the physical phenomena that were
    modeled using Artificial Intelligence purely based on actual field measurements
    rather than mathematical equations. To show the historical application of XAI
    in petroleum engineering, this section of the chapter shows most of the figures
    from these seven SPE technical papers.


    The first technical paper that included the first version of what is today called
    XAI was an SPE paper (`SPE 72385`) that was published in 2001 `[[26](#Z_011_references.xhtml#r26)``.
    This paper is about the application of Artificial Intelligence and Machine Learning
    to modeling hydraulic fractures. `Figure 7.28` shows a couple of XAI-related figures
    from this SPE paper. In this paper, the Artificial Intelligence model that was
    developed (trained, calibrated, and validated) using an artificial neural network
    was used to explain the impact of three hydraulic fracturing-related parameters.


    ![FIGURE 7.28 SPE 72385 paper’s Figure 7. Single well “Carlson, Thomas #075” analysis
    – Sensitivity to the amount of water injected.](images/Fig07_28.jpg)


    `FIGURE 7.28` SPE 72385 paper’s Figure 7. Single well “Carlson, Thomas #075” analysis
    – Sensitivity to the amount of water injected.


    These hydraulic fracturing-related parameters are the number of perforations,
    injection rate, and total amount of water that is injected. The XAI in this paper
    explains the impact of these parameters on the well productivity (5-Year Cumulative
    Gas Production). Such explanations of the influence of these parameters on well
    productivity are used to identify well productivity optimization as a function
    of the number of perforations, injection rate, and total amount of water that
    is injected. `Figure 7.28`, which shows Figure 7 of this paper, explains the conditions
    under which the well productivity (5-Year Cumulative Gas Production) can reach
    its maximum value. For this particular well (`Carlson, Thomas #075`), the 5-Year
    Cumulative Gas Production can reach its maximum value of `57,050 MSCF` as long
    as the number of perforations and the rate of injection are kept at their minimum
    values (injection rate at `25 bbl./min` and `8 perforations`) and can reach its
    maximum value of `63,400 MSCF` as long as the number of perforations and the rate
    of injection are kept at their maximum values (`60 bbl./min` for injection rate
    and `26 perforations`).


    As shown in `Figure 7.28`, while these parameters (the number of perforations
    and the rate of injection) are kept at their minimum value, the highest 5-Year
    Cumulative Gas Production (`57,050 MSCF`) is achieved at `680 barrels of water`.
    On the other hand, when these values are kept at their maximum, the highest 5-Year
    Cumulative Gas Production (`63,400 MSCF`) is achieved at about `725 barrels of
    water injected`. The conclusion may be that for this well, the ideal water injection
    volume is about `700 barrels`. This SPE paper includes two more similar figures
    showing an explanation for two more wells in the same field (`Figure 7.29`).


    ![FIGURE 7.29 SPE 77597 paper’s Figure 8. Sensitivity of the post-restoration
    measurements.](images/Fig07_29.jpg)


    `FIGURE 7.29` SPE 77597 paper’s Figure 8. Sensitivity of the post-restoration
    measurements.


    The second technical paper (`SPE 77597`) followed similar methodologies, applying
    Artificial Intelligence and Machine Learning to field data.

    '
