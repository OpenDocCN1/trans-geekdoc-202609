    # Author Bio


    **Shahab D. Mohaghegh**, a pioneer in the application of Artificial Intelligence
    (AI) and machine learning in the Exploration and Production industry, is a professor
    of Petroleum and Natural Gas Engineering at West Virginia University (WVU) and
    the president and CEO of Intelligent Solutions, Inc. (ISI). He is the director
    of `WVU-LEADS` (`L`aboratory for `E`ngineering `A`pplication of `D`ata `S`cience).


    In addition to more than 30 years of research and development in the petroleum
    engineering application of AI and machine learning, he has authored four books
    (*Shale Analytics*, *Data-Driven Reservoir Modeling*, *Application of Data-Driven
    Analytics for the Geological Storage of CO[2]*, *Smart Proxy Modeling*) and more
    than 230 technical papers and carried out more than 60 projects for independents,
    NOCs (National Oil Company), and IOCs (International Oil Company). He is an SPE
    (Society of Petroleum Engineering) distinguished lecturer (2007 and 2020) and
    has been featured four times as a distinguished author in SPE’s *Journal of Petroleum
    Technology* (JPT 2000 and 2005) about AI. He is the founder of SPE’s Technical
    Section, dedicated to AI and machine learning (Petroleum Data-Driven Analytics,
    2011). He has been honored by the U.S. Secretary of Energy for his AI-based technical
    contribution in the aftermath of the Deepwater Horizon (Macondo) incident in the
    Gulf of Mexico (2011) and was a member of the U.S. Secretary of Energy’s Technical
    Advisory Committee on Unconventional Resources in two administrations (2008–2014).
    He also represented the United States in the International Standard Organization
    (ISO) on Carbon Capture and Storage technical committee (2014–2016).


    # Introduction


    DOI: [10.1201/9781003369356-1](https://doi.org/10.1201/9781003369356-1)


    Artificial Intelligence will be changing our world even earlier than we used to
    think. By now, you probably have realized the importance of Artificial Intelligence,
    which is used and incorporated into many topics and items that you commonly deal
    with. It is obvious that many people throughout the world are interested in knowing
    and learning the details of Artificial Intelligence and understanding how AI is
    used to create interesting characteristics that are exposed to everyone. This
    book is about Artificial Intelligence for Science and Engineering Applications,
    which is different from Artificial Intelligence for General Applications. The
    differences between these two applications of Artificial Intelligence have been
    briefly mentioned throughout the Internet in the last several years. They are
    applied as Artificial Engineering Intelligence (AEI) and Artificial General Intelligence
    (AGI). On the Internet in the past several years, it has been mentioned that these
    two types of Artificial Intelligence are not the same. It is mentioned that AEI
    is `Designed to perform engineering tasks` while AGI is `Designed to learn and
    perform any task`. It is also mentioned that AEI `Can reason and solve problems
    in a specific way` while AGI `Can reason and solve problems in a general way`,
    and AEI is `Still under development` while AGI is `Still a theoretical concept`.


    These are interesting topics that are mentioned on the Internet; however, there
    is another item that has been mentioned on the Internet that is not correct and
    will be mentioned in more detail in this book. What seems to be incorrect on the
    Internet is when it is mentioned that AEI is `Based on mathematical and computational
    models of engineering principles` while AGI is `Based on knowledge from any field`.
    This definition is now one of the main problems in the way Artificial Intelligence
    is used for engineering problem-solving, specifically about physical phenomena.
    This book is about the importance of the correct definition and application of
    AEI to be used to model and solve physical phenomena, which would be far improved
    than how modeling and solving physical phenomena was performed in the past century.
    These are the two reasons why Artificial Intelligence is currently being used
    to solve multiple different types of science- and engineering-related problems
    that do not provide the correct results and do not characterize how Artificial
    Intelligence must be used to comprehensively enhance modeling and solve physical
    phenomena. It is important to note that solving different types of problems using
    Artificial Intelligence requires different techniques and approaches.


    The first reason has to do with the experts in Artificial Intelligence who tried
    to simulate, model, and solve science- and engineering-related problems of physical
    phenomena while having no specific expertise on those specific physical phenomena
    (Petroleum, Chemical, Mechanical, Civil, and any other engineering). The result
    of such applications of Artificial Intelligence ended up being quite poor and
    surprised the industrial management that reached out to original Artificial Intelligence
    experts to solve their problems.


    The second reason has to do with the experts in science and engineering of specific
    physical phenomena (Petroleum, Chemical, Mechanical, Civil, and any other engineering)
    who do not have specific expertise in Artificial Intelligence. When such science
    and engineering experts of physical phenomena try simulation, modeling, and solving
    science- and engineering-related problems of physical phenomena using Artificial
    Intelligence, their results also end up having nothing to do with AI. They end
    up solving such problems in exactly the same way that it was done in the past
    century, but they now call it AI or Machine Learning results.

