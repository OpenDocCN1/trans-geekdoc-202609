    我确定你已经见过图 4.5 中所示的那段文字了。我也确定你能够阅读那段文字并完全理解它的的话题是什么。很可能在阅读这段文字的中间，你已经注意到它有些非常不对，然后你注意到你正在阅读和理解的大量单词都没有写对。相同段落的正确版本在图
