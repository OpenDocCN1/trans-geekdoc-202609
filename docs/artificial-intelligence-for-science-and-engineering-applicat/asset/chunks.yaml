    Therefore, it is absolutely important to note that when modeling and/or solving
    physical phenomena using “Artificial Intelligence”, not only expertise in “Artificial
    Intelligence” must be included, but also expertise in the specific type of physical
    phenomena that is being addressed must be included by those individuals that are
    going to use “Artificial Intelligence”. As shown in [Figure 4.1](#C_007_c4.xhtml#f4_1),
    both “Human Intelligence” and “Artificial Intelligence” require having “General
    Intelligence” to solve and model “General Phenomena” and “Domain Expertise” to
    solve and model “Physical Phenomena”.


    ![FIGURE 4.1 Requirements of general intelligence and domain expertise in both
    human intelligence and artificial intelligence.](images/Fig04_01.jpg)


    [FIGURE 4.1](#C_007_c4.xhtml#f4_1b) Requirements of general intelligence and domain
    expertise in both human intelligence and artificial intelligence.


    There are two important topics that must be covered in this chapter to explain
    how “Artificial Intelligence” must be used to model and/or solve physical phenomena.
    These two topics are:


    1. The differences between traditional modeling of physical phenomena and AI-based
    modeling of physical phenomena, and

    2. How domain expertise in specific physical phenomena must be used through Artificial
    Intelligence to model and/or solve those physical phenomena.


    As mentioned above, the first topic is the uniqueness and differences between
    Artificial Intelligence and the techniques that have been used in the past few
    centuries to model and/or solve physical phenomena, and the second topic identifies
    how it must be done.


    ## Artificial Intelligence versus Traditional Modeling in Physics


    What we have been learning in schools and universities to model and/or solve physical
    phenomena can be called “Traditional Modeling and Solving Physical Phenomena”.
    This “Traditional Technology” uses mathematical equations to model physical phenomena.
    The major differences between Traditional Technology and Artificial Intelligence
    (brand new technology) for modeling and/or solving physical phenomena have to
    do with using and/or avoiding mathematical equations for modeling the physical
    phenomena. While mathematical equations become the model of physical phenomena
    through traditional science and engineering technology, Artificial Intelligence
    does not model physical phenomena through mathematical equations. The main reason
    that Artificial Intelligence does not use mathematical equations to model and/or
    solve physical phenomena is the avoidance of any assumptions, interpretations,
    and simplifications. Artificial Intelligence models and/or solves physical phenomena
    that are always purely based on reality, facts, and actual measurements.


    In general, the “Traditional Modeling and Solving Physical Phenomena” that has
    been used in the past several centuries includes the identification of variables
    and parameters that play a role in the specific physical phenomenon. Then the
    identified variables and parameters are used for the development of a mathematical
    equation. When such mathematical equations are not too complex, then exact solutions
    can be generated through analytical solutions. However, when certain physical
    phenomena are modeled through highly complex mathematical equations, analytical
    solutions cannot be used. In such cases, numerical solutions have been developed
    to solve the complex mathematical equations.


    As it was covered in the previous chapters, Artificial Intelligence is defined
    as the simulation of “Human Intelligence” and since “Human Intelligence” is generated
    through the “Human Brain”, mimicking “Human Brain” activities would be the most
    important part of Artificial Intelligence. Based on the simple definition of traditional
    modeling of physical phenomena, which is the use of mathematical equations for
    modeling physics, the question that can be asked: Does “Human Brain” use mathematical
    equations to solve or interact with any physical phenomena? The answer to this
    question is completely easy and obvious. To cover an example for this question,
    let’s use what is shown in [Figure 4.2](#C_007_c4.xhtml#f4_2).


    ![FIGURE 4.2 Identifying the final dropping location of the rocket trajectory
    by physics and mathematics.](images/Fig04_02.jpg)


    [FIGURE 4.2](#C_007_c4.xhtml#f4_2b) Identifying the final dropping location of
    the rocket trajectory by physics and mathematics.


    This figure shows a physical phenomenon (rocket trajectory) that has been modeled
    using mathematical equations. The objective of the rocket trajectory is to reach
    a specific location that needs to be hit and destroyed. To identify where the
    rocket that is being thrown will be coming down, a physical model through mathematical
    equations is used, as shown in [Figure 4.2](#C_007_c4.xhtml#f4_2). To reach the
    location where the rocket will be coming down, it is a function of gravity (`g`),
    initial velocity (`V[0]`), and the initial angle (`θ`) for shooting the rocket.
    However, looking at [Figure 4.3](#C_007_c4.xhtml#f4_3), the same action is taking
    place between humans.


    ![FIGURE 4.3 Identifying the final dropping location of the ball trajectory by
    the human brain.](images/Fig04_03.jpg)


    [FIGURE 4.3](#C_007_c4.xhtml#f4_3b) Identifying the final dropping location of
    the ball trajectory by the human brain.


    One human throws an item at another human. In a football game, the quarterback
    will throw the ball to be caught by the receiver. The question is: Does the brain
    of a human (the receiver) that must catch the item (football) also generate a
    mathematical equation to identify where the item (football) will come down? If
    that is the case, then the human brain after generating the mathematical equation,
    must solve it. Based on the solution to the mathematical equation that the human
    brain achieves, should the brain of the receiver guide his feet and arms to act
    and catch the football?


    It seems that the answer to this question should be obvious. The fact is that
    the human brain does not develop mathematical equations to solve a physical phenomenon.
    Since that is the case (not developing and solving mathematical equations), then
    what does the human brain do to solve this physical phenomenon? How will the receiver
    on the U.S. football team be able to identify where the football comes down so
    that he can use his feet and arms to catch the football?


    Human eyes look at the football and even the way the Quarterback activated to
    throw it to him, and then using such `Data` identifies which direction to go and
    how far to be able to catch the football. In other words, in many cases, “Natural
    Intelligence” through the “Human Brain” tries to solve a problem that is a physical
    phenomenon. “Natural Intelligence” of the “Human Brain” uses the actual data that
    it observes in order to solve the physical problem. “Natural Intelligence” of
    the “Human Brain” does not develop a mathematical equation and then try to solve
    it. If the activity of the “Human Brain” through “Natural Intelligence” in this
    fashion makes sense, then shouldn’t “Artificial Intelligence” activate in the
    same fashion to solve similar problems? The answer is: ABSELY YES. Artificial
    Intelligence must simulate Natural Intelligence of the human brain to model and
    solve physical problems through actual data. Another example of such a situation
    (solving a physical phenomenon) is shown in [Figure 4.4](#C_007_c4.xhtml#f4_4).


    ![FIGURE 4.4 Balancing a stick by physics and mathematics versus the human brain.](images/Fig04_04.jpg)


    [FIGURE 4.4](#C_007_c4.xhtml#f4_4b) Balancing a stick by physics and mathematics
    versus the human brain.

