    in [Figure 7.27](#C_010_c7.xhtml#f7_27) were the source of the Artificial Intelligence
    Reservoir Simulation and Modeling (TDM) that generates the Type Curves demonstrated
    in [Figure 7.24](#C_010_c7.xhtml#f7_24), [Figure 7.25](#C_010_c7.xhtml#f7_25),
    [Figure 7.26](#C_010_c7.xhtml#f7_26). The complexity of the data shown in [Figure
    7.24](#C_010_c7.xhtml#f7_24), [Figure 7.25](#C_010_c7.xhtml#f7_25), [Figure 7.26](#C_010_c7.xhtml#f7_26)
    clarifies the quality of the XAI that is used in petroleum engineering.'
