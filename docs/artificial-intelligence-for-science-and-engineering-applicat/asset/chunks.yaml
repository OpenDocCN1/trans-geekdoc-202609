    They usually end up using several existing Machine Learning algorithms and deciding
    which one is best for them. Again, the key is that the overwhelming majority of
    such engineers and scientists who are not experts in Artificial Intelligence just
    end up using one (or more) existing “Machine Learning” algorithms to deal with
    the specific engineering-related topic in their work or research. Given the fact
    that almost all the “Machine Learning” algorithms that they find and end up using
    have been developed by AI experts, their objective was to solve general intelligence
    (non-engineering) problems and not engineering-related problems. These engineers
    end up using “Machine Learning” algorithms for non-engineering-related topics
    to solve engineering-related problems. This is one of the main problems that currently
    exist in Science and Engineering Application of Artificial Intelligence.


    Again, based on my recent involvement with engineering research projects that
    include several universities, a large number of national laboratories, and several
    companies, there is another problem that they are all performing. Beyond using
    the existing “Machine Learning” algorithms, the next serious problem associated
    with this type of approach (using existing “Machine Learning” algorithms of General
    Intelligence to solve engineering problems) is how they use “Data” in their “Machine
    Learning”-related work and research.


    Depending on the type of engineering-related problem that they are dealing with,
    they usually deal with the data that is usually used to solve that engineering-related
    problem through our traditional engineering approach, which includes mathematical
    equations. It should be noted that only using this type of data is quite like
    traditional statistical approaches. Traditional Statistical approach also uses
    the data that is usually included in solving engineering-related problems through
    mathematical equations. Therefore, beyond using general intelligence-related “Machine
    Learning” algorithms, using similar amounts and types of data that are used in
    traditional solutions to engineering-related problems seems to be the main reason
    that they use the term “Machine Learning” rather than “Artificial Intelligence”
    as the topic of their work and research. This is one of the main reasons that
    this book is being written: to help all scientists and engineers correctly use
    Artificial Intelligence and its “Machine Learning” algorithms, as well as the
    correct way of using “Data” to solve science- and engineering-related problems.


    These current approaches provide the conclusion that such scientists and engineers
    have the idea that Machine Learning algorithms are the new algorithms that must
    be used in traditional engineering problem-solving as well as traditional statistics.
    The fact is that this type of approach has absolutely nothing to do with the realistic
    application of “Artificial Intelligence” in science and engineering. It seems
    that their main conclusion about this new “Data-Driven” approach only has to do
    with solving previous problems faster and quicker instead of solving science-
    and engineering-related problems in a better and more realistic way to come to
    much better results.


    As it is covered in this book, in the next several chapters, it will be understood
    that the engineering problem solutions using this new “Data-Driven” technology
    that has been generated through “Artificial Intelligence” are quite different
    from traditional engineering problem-solving that has been developed more than
    four centuries ago and Traditional Statistics that has been developed more than
    one and a half centuries ago. These new approaches have to do with the actual
    and realistic definition of “Artificial Intelligence” and, based on such a definition,
    how it must be used to solve science- and engineering-related problems using actual
    data.


    Application of Artificial Intelligence in science- and engineering-related problems
    is not about using traditional statistics and mathematical equations. To maximize
    efficiency and spur practical innovations, engineering domain experts must be
    seriously taught and trained to become experts in Artificial intelligence. The
    objectives of Science and Engineering Application of Artificial Intelligence include:


    *   Modeling phenomena using facts, reality, and measurements to avoid any assumptions,
    interpretations, preconceived notions, and biases.

    *   Advancing the art and science of engineering problem-solving, design, and
    uncertainty with extensive incorporation of Machine Learning algorithms that represent
    Artificial Intelligence.

    *   Training the next generation of engineers and scientists with practical knowledge
    and expertise in Artificial Intelligence.


    In this book, solving science- and engineering-related problems using Artificial
    Intelligence is explained, followed by identifying the key requirements of this
    technology. Furthermore, the reasons behind the lack of success will be explained.
    The following items are absolute requirements and realistic expectations:


    1. Science and Engineering domain expertise is an absolute requirement for the
    application of Artificial Intelligence,

    2. Artificial Intelligence domain expertise is an absolute requirement for the
    application of Artificial Intelligence,

    3. The development of comprehensive Artificial Intelligence for science- and engineering-related
    problems requires ONLY actual data, and

    4. There is no need to include mathematical formulations of physics in this process.


    It is very important to note that the main reasons for writing this book and the
    lack of AI-related success in the past several years in many companies are the
    following:


    1. Inclusion of the term “Physics-based” in their AI-related approach when referring
    to inclusion of mathematical equations of physics,

    2. They do not understand or have not concluded that the science and engineering
    applications of Artificial Intelligence are different from the non-engineering
    application of Artificial Intelligence,

    3. They do not know what AI-Ethics is, and even if they do, they do not believe
    AI-Ethics is applicable to engineering problem-solving,

    4. They have failed to develop comprehensive and explainable Artificial Intelligence
    for science- and engineering-related problems using ONLY actual data without the
    inclusion of mathematical equations of physics.


    Unfortunately, recently, many engineers started calling themselves “Data Scientists”
    right after reading a book or a few papers, watching a few YouTube YouTube videos,
    or listening to a few lectures. It seems that the reason behind such simplifications
    is based on two facts:


    1. Scientists and engineers are currently thinking that to handle the physical
    phenomenon, they need to understand the mathematics behind the modeling of physics,
    and

    2. The mathematics behind many Machine Learning algorithms that represent Artificial
    Intelligence are reasonably simple.


    Therefore, the reason many scientists and engineers start calling themselves “Data
    Scientists” so quickly seems to be that once they learn the mathematics behind
    the Machine Learning algorithms that represent Artificial Intelligence, they come
    to the conclusion that they know all that needs to be known about the application
    of Artificial Intelligence in science and engineering. This is the wrong assumption.
    Such misunderstandings of Artificial Intelligence seem to be the main reason behind
    the recent development of so-called “Hybrid Models”.

    '
