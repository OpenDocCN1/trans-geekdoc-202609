    正如前面提到的，传统统计学已经存在了三个多个世纪。“统计”（statistic）一词于 1749 年在德国起源并被发明。如果考虑到数据与概率论（随机性）之间的联系，那么它的历史甚至可以追溯到
    16 世纪。尽管如此，关键点在于，与人工智能不同，传统统计学并不是一项新技术。为了为了地理解这两种技术之间的根本区别，应该从伯克利大学著名统计学教授利奥·布雷曼（Leo
    Breiman）写的开创性论文开始[12]，然后是 Nisbet、Elder 和 Miner 编写的书（《统计分析与数据挖掘应用手册》，*Handbook
    of Statistical Analysis & Data Mining Applications*）[13]]。


    伯克利大学统计学教授（利奥·布雷曼博士）在其文章[12]中所述：“统计界对数据模型的关注导致了无关的理论和可疑的科学结论……一个预定义的模式（即参数模型）使用模型来刻画数据中的模式，这被称为数据模型”。“这项事业（*传统统计学*）的核心信念是，统计学家通过想象和观察数据，可以为大自然设计的复杂机制发明一种相当好的参数模型类……在拟合数据模型的热忱中，不言而喻的理往往被忽视了”。当对数据拟合模型以得出定量结论时，这些结论是关于模型的机制的，而不是关于自然机制的”。“对数据模型无错越性的信念几乎是宗教性的”。


    传统统计学在解决问题上采用亚里士多德方法（二值逻辑）和对真理的演绎法，而人工智能背后的哲学包含了多值逻辑和对真理的归纳法。传统统计学通过参数模型对假设进行检验并将其与模型的标准指标进行比较，而人工智能是使用数据来构建模型，而不是从现有模型开始测试数据以查看其是否符合预定义的模型。人工智能被定义为模拟自然、生命和人脑以解决复杂和动态的问题。人工神经网络模拟人脑中的神经元；模糊集理论模拟人类的多值逻辑和推理；遗传算法则模拟达尔文的进化论。机器学习被定义为一组开放的计算机算法，通过数据进行学习，而不是显式地编写计算机并告诉它具体做什么（正如工程师在数值模拟中所做的那样）。人脑并不使用亚里士多德二值逻辑（例如是/否、黑/白、真/假、0/1）来解决问题和做出决策。概率论解决与随机性相关的不确定性，而不是与缺乏信息的不确定性。


    传统统计方法从一系列预定义的方程（假设集）开始，例如单变量或多元线性回归或定义良好的非线性回归（例如对数、指数、二次）。然后，它试图找到最适合所收集数据的预定义方程。虽然传统统计方法试图寻找所涉及变量之间的相关性，但它并没有处理、考虑、甚至尝试从数据中识别因果关系。每个人都知道相关性并不一定意味着因果关系。图
    5.1 和 5.2 是此类问题的很好的例子。在这两个图中，虽然两个主题之间的数据看起来极度相关（相关性超过 99%）——图 5.1 中的“美国在科学、太空和技术领域的支出”对比“悬吊、绞杀和窒息自杀人数”，以及图
    5.2 中的“缅因州的离婚率”对比“人均人油消费量”——但很清楚，这两个主题之间完全没有任何关系。这意味着相关性并不一定意味着因果关系。


    ![图 5.1 美国在科学、太空和技术领域的支出与悬吊、绞杀和窒息自杀人数之间的相关性显然并不意味着因果关系。](img/Fig05_01.jpg)


    `图 5.1` 美国在科学、太空和技术领域的支出与悬吊、绞杀和窒息自杀人数之间的相关性显然并不意味着因果关系。


    ![图 5.2 缅因州的离婚率与人均人油消耗量的相关性。](img/Fig05_02.jpg)


    `图 5.2` 缅因州的离婚率与人均人油消耗量的相关性。


    人工智能不是从任何预定义的方程开始的。它们没有关于行为变量可能具有何种类型以使其与目标输出相关的任何假设。使用机器学习的开放人工智能的力量在于它们在大量变量中发现复杂模式的惊人能力。人工智能开发的模型最终结果通常无法用一个或几个方程来总结。这就是为什么许多工程师喜欢用“黑盒”一词称为机器学习算法。


    显然，除非模型中包含他们从大学开始就一直熟悉的一个或多个数学方程，否则传统工程师无法理解这些模型。这可能就是将人工智能相关模型称为“黑盒”的原因。那些不尊重新技术的传统工程师似乎没有意识到，从数学角度来看，使用人工智能开发的模型包含了一系列生成模型结果的矩阵。因此，这些模型（盒子）没有任何是不透明（黑）的。事实是，当你向基于人工智能的模型提问时（只要它是开发得当的），它可以以非常可靠的方式做出回答。人工智能这一主题的这部分可见本书的第
    7 章](#C_010_c7.xhtml)。


    图 5.3 总结了传统统计解决问题的方法与人工智能使用方法之间的主要区别之一。当在传统统计背景下使用数据时，会使用一系列预定义的方程来寻找如何拟合数据。换句话说，拟合数据集的方程的形式和形状，甚至是数据分布的形式，都是预定义的。在这种情况下，如果实际数据太复杂，无法拟合任何预定义的方程或分布，那么解决问题的方法要么停滞，要么在数据（或问题）中引入大量的假设、简化和偏见，以得出某种解决方案。


