    正如本章早期提到的，使用数学方程生成的类型曲线（Type Curves）是非常“良的”（连续的、非线性的、具有在不同曲线之间以相似方式变化的特定形状）。图
    7.20 展示了储层工程中生成的几个更多类型曲线示例。问题是，“能够生成一系列良好类型曲线的模型，其主要特征是什么？”对于这个问题，一个直接且简单的答案是：“能够生成一系列良好类型曲线的模型，是由一个或多个数学方程开发的基于物理的模型。清晰解释该基于物理模型行为的良好类型曲线，是通过数学方程的解生成的”。


    ![FIGURE 7.20 储层工程的类型曲线示例。](img/Fig07_20.jpg)


    FIGURE 7.20 储层工程的类型曲线示例。


    接下来的问题将是：“如果证明（并证实）生成良好类型曲线的模型并不是使用任何数学方程开发的，该如何？如果这个模型完全基于人工智能呢？”那么合理的答案将是：


    1. 这些良好类型曲线的生成证明了用于构建纯数据驱动模型的人工智能合理地代表了所建模的物理现象，

    2. 人工智能预测模型可以清晰地解释，且

    3. 开发此类模型的技术必须是坚实的科学与工程技术。


    ## 非常非常规储层的 XAI 模型 – 页岩分析


    良好类型曲线的主要特征是生成这些曲线的模型的可解释性。图 7.21 和 7.22 是“解释”开发这些曲线模型的极佳示例。图 7.21 包含了三组图表/类型曲线。这些类型曲线以“受控压裂缝侧向长度（英尺）”为
    x 轴，“6 个月累计产产量（Mscf）”为 y 轴。在图 7.21 中，图中每条曲线代表完井期间使用的水压压裂段数。每个图中都有六条曲线。每张图解释了宾夕法尼亚州南部一个特定的马塞勒斯页岩（Marcellus
    Shale）井的行为。每个图中的六条曲线显示了每个井的产量如何随着图 7.21 中段数（从 15 段到 40 段）以及图 7.22 中“受控压裂缝侧向长度（英尺）”的变化而变化。图
    7.21 和 7.22 中显示的三口井隶属于该特定马塞勒斯页岩资产中三个不同位置的三口井。


    ![FIGURE 7.21 井产量随受控压裂缝侧向长度和段数变化的类型曲线。](img/Fig07_21.jpg)


    FIGURE 7.21 井产量随受控压裂缝侧向长度和段数变化的类型曲线。


    ![FIGURE 7.22 井产量随受控压裂缝侧向长度和每段支撑剂量的类型曲线。](img/Fig07_22.jpg)


    FIGURE 7.22 井产量随受控压裂缝侧向长度和每段支撑剂量的变化的类型曲线。


    页岩分析（Shale Analytics）是人工智能在非常规储层中的科学与工程应用。为了完井和生产优化而开发的页岩人工智能预测分析完全基于实际现场测量。在页岩分析中，由于对页岩层中流体流动物理学以及实施水压压裂产生的裂缝形状和特征缺乏真实的理解，因此避免了任何类型的数学方程。


    一旦完成页岩人工智能预测分析，通过生成类型曲线，使用 `XAI` 来解释页岩井完井和生产的物理机制。此类基于实际现场测量的解释完全避免了过去十年中石油行业一直使用的传统方法无法完成的任何假设、简化和偏差。使用
    `RTA` 和 `NRS` 对页岩碳烃产量的传统建模包含的实际现场测量极少。`RTA` 和 `NRS` 包含了 `裂缝半长`、`裂缝高度`、`裂缝宽度`，甚至`受控储层体积
    (SRV)`，这些实际上都不是实际测量的。


    页岩分析的基础使我们即使在结论彼此 100% 不同也能得出结论。换句话说，此类技术可以生成任何形式的解决方案，且与事实或现实完全无关。它与我们的目标有关，而与页岩井碳烃生产相关的现实无关。


    图 7.21 和 7.22 显示了 `XAI` 如何为马塞勒斯页岩资产中的每个井提供信息。类似的类型曲线可以为每个井场、页岩资产的每个特定部分或整个页岩资产生成。在图
    7.21 中，`XAI` 显示 015 号井的 6 个月累计产产量从 850,000 MSCF 增加到 130 万 MSCF，其“受控压裂缝侧向长度（英尺）”从
