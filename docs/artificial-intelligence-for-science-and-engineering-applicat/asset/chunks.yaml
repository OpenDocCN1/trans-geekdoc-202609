    # [FIGURE 5.3](#C_008_c5.xhtml#f5_3b) Differences between Traditional Statistics
    and Artificial Intelligence & Machine Learning [[14](#Z_011_references.xhtml#r14)].


    When it comes to modeling the physics of engineering-related problems from data
    using Artificial Intelligence, no pre-determined set of equations is used to fit
    the data. The main reason for this separation is the avoidance of biases, pre-conceived
    notions, gross assumptions, and problem simplifications when Artificial Intelligence
    is used in order to model and find solutions for the physics of engineering-related
    problems. When Artificial Intelligence is used for engineering modeling of physical
    phenomena, its model and solution are all about the actual data. Data, which in
    the industry is, in most cases, all about actual (field) measurements, must guide
    the solutions that are reached, not our today’s understanding of the physics that
    is modeled using mathematical equations. The fact is that the actual (field) measurements
    represent the physics of the problem that is being modeled. Therefore, by using
    the data that represents physics, this approach becomes a physics-based problem-solving.
    The data represents the physics that is being modeled.


    [Figure 5.4](#C_008_c5.xhtml#f5_4) shows a summary of some of the algorithms that
    are used in Traditional Statistical approaches versus some of the Machine Learning
    Algorithms that are used in Artificial Intelligence. While in some books the experts
    of Artificial Intelligence have shown that Machine Learning Algorithms are able
    to perform traditional algorithms (example: Linear Regression, Non-Linear Regression,
    …), some engineers start calling those traditional algorithms, Machine Learning.


    ![FIGURE 5.4 Different algorithms used by Traditional Statistics versus Artificial
    Intelligence & Machine Learning.](images/Fig05_04.jpg)


    ## [FIGURE 5.4](#C_008_c5.xhtml#f5_4b) Different algorithms used by Traditional
    Statistics versus Artificial Intelligence & Machine Learning.


    Another difference between Traditional Statistics and Artificial Intelligence
    has to do with the incorporation of deductive reasoning by Traditional Statistics
    and the incorporation of inductive reasoning by Artificial Intelligence. Deductive
    reasoning is the process of drawing conclusions based on premises that are generally
    assumed to be true, while inductive reasoning moves from specific observation
    to broader generalizations and theories. Deductive reasoning learns by following
    an intuitive pathway from general to specific (the “detail` people), while inductive
    reasoning learns by following an intuitive pathway from specific to general (the
    “big picture` people).


    While both Traditional Statistics and Artificial Intelligence operate on patterns
    of the provided data, Traditional Statistics uses predefined patterns (i.e., Parametric
    Models) and compares some measure of the observations to the standard metric of
    the models (`testing hypotheses`), while Artificial Intelligence builds a model
    with the data and does not start with an existing model. Traditional Statistics
    uses an existing model to characterize a pattern in the data. It matches the pre-determined
    patterns of existing models to the data deductively, following an Aristotelian
    approach to the truth. Artificial Intelligence uses the patterns in the data to
    build a model. It discovers patterns in the data inductively. As shown in [Figure
    5.5](#C_008_c5.xhtml#f5_5), Traditional Statistics uses deductive reasoning moving
    from general principles to special cases, while Artificial Intelligence uses inductive
    reasoning, moving from special cases to general principles.


    ![FIGURE 5.5 Traditional statistics uses deductive reasoning while Artificial
    Intelligence uses inductive reasoning.](images/Fig05_04.jpg)


    ## [FIGURE 5.5](#C_008_c5.xhtml#f5_5) Traditional statistics uses deductive reasoning
    while Artificial Intelligence uses inductive reasoning.


    [FIGURE 5.5](#C_008_c5.xhtml#f5_5b) Traditional statistics uses deductive reasoning
    while Artificial Intelligence uses inductive reasoning.


