    Deep reinforcement learning [17] is employed to optimize the anti-jamming strategies
    via supervised learning. The algorithm does not need to model the jammer patterns
    and has the ability to explore the environment. Convolutional networks, such as
    U-Net [19], can be utilized to mitigate radio frequency interference through mitigations
