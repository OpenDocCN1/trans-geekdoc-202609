    ## II. TERMINOLOGY AND CONCEPTS


    ### A. Deep Neural Networks


    Deep neural networks map the input vector $x$ to an output vector $y$, where $y=\sigma^{(L)}(B^{(L)}(...B^{(1)}(x))$,
    where $L$ is the number of layers. $B^{(i)}$ are linear or affine functions, and
    $\sigma^{(i)}$ are nonlinear functions. The linear functions are given by $B^{(i)}=W^{(i)}x+b^{(i)}$
    for all $k$, where $W^{(i)}$ and $b^{(i)}$ represent the network weights and biases.
    The nonlinear functions are some differentiable functions, such as the logistic
    or sigmoid function. Fig. 1 shows some deep neural networks


    ![](img/30c596526eeed5a6092f7c437ca4aa00_0_0.png)


    (a) Weighted sum for each output layer


    ![](img/30c596526eeed5a6092f7c437ca4aa00_0_1.png)


    (b) Feedforward and recurrent connections


    ### A. Symbol Detection


    Feature extraction: Convolutional neural networks ordinarily serve as a convolutional
    feature extractor [5][6][7][8] acting on the input signals. As is known to all,
    when utilized to image feature extraction, the layer of neural networks is, the
    more the features represented by convolution kernels are. Similarly, as in Fig.
    2, in communication signal processing the convolution kernels of the shallow layer
    play the role of edge gradient detectors. The convolution kernels of the deeper
    layer can extract more complicated features serving as Gabor-like [6], as shown
    in Fig. 3.


    ![](img/30c596526eeed5a6092f7c437ca4aa00_1_0.png)


    ### B. Encoding and Decoding


    The communication process basically depends on encoding and decoding. Decoding
    means the encoding from one system to another in the form of code. Can be symbol,
    letters to represent the secret message. Decoding that the decoder interprets
    the message received by its own source and experience.


    ![](img/30c596526eeed5a6092f7c437ca4aa00_1_1.png)


    ### C. Modulation and Demodulation


    To involve data or speech information, one wave has to be imposed as input above
    the carrier wave. Modulation modifies the shape of a carrier wave to encode data
    that is needed to be transmitted. There are three types of modulation: frequency
    modulation, amplitude modulation and phase modulation. Demodulation is defined
    as extracting the original data or speech information from a modulated carrier
    wave. Demodulator is an electronic circuit that is used to recover the information
    from the modulated wave.


    ![](img/30c596526eeed5a6092f7c437ca4aa00_1_2.png)


    ### D. Channel State Information


    Channel state information (CSI) is information representing the state of communication
    link from the transmit source to the receiver. CSI is fine-grained physical how
    the signal is perceived in the channel and is one of the most fundamental problems,
    that represent the propagation characteristics of communication link.


    ## III. METHODOLOGY


    With conventional algorithms, deep learning introduces novel problem-solving mechanism
    has achieved performance improvement. The main application of deep learning can
    be categorized as symbol detection, interference and channel effects modeling.


    Classification. These are promising aspects about deep learning serving as classifiers.
    Deep convolutional networks hidden layers serve as classifiers in modulation recognition.
    In Ref. [10] ACK collects channel statistics to build a deep learning classifier
    that reliably predicts the modulation effectiveness.


    End-to-end solutions. Deep neural networks-based approaches provide end-to-end
    solutions to many significant challenges in the domain of communication [11],
    such as digital backtracking [12]. An end-to-end wireless communication system
    using deep neural networks is developed. In Ref. [21] deep learning technology
    is used to develop a novel channel state information sensing and recovery mechanism,
    which learns a transformation from CSI to a near-optimal compression (or inverse
    transformation) from codes. CSI recovers with significantly improved reconstruction
    quality using compressive sensing (CS) methods. A learning framework with a combination
    of CNN and RNN (LSTM) [22] is designed to perform deep CSI for 5G wireless communications
    [23]. Generative adversarial nets (GAN) are also employed to model the channel
    effects. A conditional GAN is employed to model the channel effects in a data-driven
    way.


    ![](img/30c596526eeed5a6092f7c437ca4aa00_2_0.png)


    Figure 4. End-to-end communication system by auto-encoder and auto-decoder, where
    n is added and GAN is employed to model the channel effects [13].


    ### B. Anti-interference


    Deep learning-based anti-interference methods depend on accurate estimates of
    interference. Research shows that well trained and RNN architectures can decode
    sequential keys such as the convolutional codes, and have good stability [15].
    Performance of interference cancellation for the non-orthogonal signal using DNN
    is presented in [16]. The multiple processing layers of deep networks can simplify
    signal processing models efficiently with deterministic problems. DNN can also
    be integrated into the conventional algorithms and achieve robustness to uncertainty
