    # 2020 IEEE 第五届信号与图像处理国际会议


    # 通信信号处理中深度学习应用简述


    刘岩, 李永琦, 朱勇刚, 牛颖涛


    彭杰*（通讯作者）

    北京机电工程学院

    中国，北京

    e-mail: jiapeng1018@163.com


    ¹国防科技大学

    中国，南京

    e-mail: 948805160@qq.com


    通信信号处理中深度学习应用的简述。

    摘要——本文综述了深度学习在通信信号处理中的应用。作为人工智能技术的重要分支，深度学习方案独立于底层模型，能够从观测数据中提取有意义的特征。应用于通信信号处理时，深度学习算法提供了以下主要功能：符号检测、特征提取和信息转换。然而，文中也讨论了深度学习在通信信号处理应用中面临的若干挑战。


    通信信号处理中深度学习应用的简述。第二节介绍了相关的术语和概念。第三节提出了深度学习算法在通信信号处理应用中执行的主要功能。不可避免的是，深度学习技术的应用也面临着若干挑战，这些挑战将在第四节中给出，并提供了未来的研究方向。


    关键词——符号检测；抗干扰；端到端；信道状态信息


    ## I. 引言


    作为人工智能技术的重要分支，深度学习引起了日益关注，并成功应用于计算机视觉、语音识别、自然语言处理等领域。存在多种类型的深度学习算法，具有不同的架构和特点。深度神经网络（DNN）通过多个隐藏层运行，可以对输入输出之间复杂的非线性函数建模。卷积神经网络（CNN）利用卷积核连接上下层，这与生物神经网络非常相似。CNN架构对平移、缩放等具有不变性。然而，DNN或CNN都无法对序列数据建模。循环神经网络（RNN）是神经网络的一种，其中一步的输出是序列分类中当前步骤的输入。


    深度学习方案有两个主要属性 [4]。首先，它们独立于底层模型，适用于模型未知或模型参数无法准确估计的场景。其次，如果模型极其复杂，深度学习算法能够从观测数据中提取有意义的特征，这使用传统的基于模型的方法非常难以实现。


    因此，深度学习已广泛应用于通信信号处理，并取得了显著的性能。本文介绍了一种……


    ## II. 术语与概念


    ### A. 深度神经网络


    深度神经网络将输入向量 $x$ 映射到输出向量 $y$，其中 $y=\sigma^{(L)}(B^{(L)}(...B^{(1)}(x))$，其中 $L$
    是层数。$B^{(i)}$ 是线性或仿函数，$\sigma^{(i)}$ 是非线性函数。线性函数给出为 $B^{(i)}=W^{(i)}x+b^{(i)}$，对于所有
    $k$，其中 $W^{(i)}$ 和 $b^{(i)}$ 代表网络权重和偏置。非线性函数是某些可微函数，例如logistic函数或sigmoid函数。图1显示了一些深度神经网络


    ![](img/30c596526eeed5a6092f7c437ca4aa00_0_0.png)


    (a) 每个输出层的加权求和


    ![](img/30c596526eeed5a6092f7c437ca4aa00_0_1.png)


    (b) 前馈与循环连接


    ### B. 符号检测


    特征提取：卷积神经网络通常作为作用于输入信号的卷积特征提取器 [5][6][7][8]。众所周知，当用于图像特征提取时，神经网络层越深，卷积核所代表的特征越丰富。同样，如图2所示，在通信信号处理中，浅层的卷积核充当边缘梯度检测器的角色。深层的卷积核可以提取更复杂的特征，作为类似于Gabor的滤波器
    [6]，如图3所示。![](img/30c596526eeed5a6092f7c437ca4aa00_1_0.png)


    ### C. 编码与解码


    通信过程基本上依赖于编码和解码。解码意味着以代码的形式从一个系统编码到另一个系统。可以使用符号、字母来表示秘密消息。解码是指解码器根据自身的源和经验解释接收到的消息。


    ![](img/30c596526eeed5a6092f7c437ca4aa00_1_1.png)


    ### D. 调制与解调


    为了引入数据或语音信息，必须将一个波作为输入叠加在载波上。调制改变载波的形状以编码需要传输的数据。调制有三种：调频、调幅和调相。解调定义为从载波中提取信息。![](img/30c596526eeed5a6092f7c437ca4aa00_1_2.png)


    ### E. 信道状态信息


    信道状态信息（CSI）是用于感知通信链路状态的表示。


    ## III. 方法论


    通过卷积神经网络，深度学习框架实现了性能的提升。深度学习的主要应用可以分类为：符号检测、分类。


    分类：深度学习能够可靠预测调制。在文献[10]中，深度神经网络作为分类器。


    端到端解决方案：基于深度学习的方法为许多问题提供了端到端解决方案。使用深度神经网络的端到端系统 [21] 已开发。通过压缩感知（CS）方法显著提升了重建质量。生成对抗网络（GAN）也被用于建模信道效应。无线通信
    [23]中通过数据驱动的方法建模信道效应。![](img/30c596526eeed5a6092f7c437ca4aa00_2_0.png)


    图4. 基于自动编码器的端到端系统。


    ### B. 抗干扰


    基于深度学习的抗干扰方法取决于干扰的准确估计。研究表明，训练良好的RNN架构可以解码序列码，并具有良好的稳定性 [15]。使用DNN的干扰消除性能在[16]中给出。


    强化学习 [17] 用于优化抗干扰策略。算法不需要对干扰模式建模，并且具有探索环境的能力。卷积网络如U-Net [19]，可用于缓解射频干扰 [20]。


    深度学习被用于学习作为分类器的 [01]。一种有效的抗干扰策略是在频谱接入中采取少量动作，并防止干扰器构建可靠的分类器。深度学习或深度强化学习需要大量数据来训练深度神经网络。显然，在污染训练的情况下，深度学习估计器可以在没有任何信道和统计特性知识的情况下动态地跟踪状态
    [25]。基于深度学习的方案通过完美的信道估计方法有助于构建成本低复杂的信道估计器。


    ## IV. 讨论与结论


    深度学习方案独立于底层模型，能够从观测数据中提取有意义的特征。在面对少样本场景时，存在有效的方法来解决这个问题。GAN用于用合成样本增强训练数据集 [10]。元学习方法可以在小样本上良好泛化
    [27]。


    本文综述了深度学习在通信信号处理中的应用。介绍了深度学习相关的术语和概念。讨论了主要方法。然而，深度学习技术在通信场景的应用仍面临若干挑战，这些可以作为未来的研究方向。


    高效神经网络模型。在设备上运行高质量模型的需求日益增加。小型高效的神经网络 [28][29] 在并发或低功耗通信场景中是必要的。深度学习研究人员正在如何在损失模型能力的情况下缩小模型
    [31]。构建小型高效神经网络的方法有：模型剪枝和量化、模型压缩和分解、知识迁移和蒸馏 [32]。新一代专用芯片能够集成更多


