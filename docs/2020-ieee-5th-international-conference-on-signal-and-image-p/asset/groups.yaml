    将计算能力压缩到更小的空间内，以便 AI 可以在更低的能量下训练和运行。


    研究发现，安全的神经网络对设计良好的输入样本敏感，这些样本被称为对抗样本 [33]。对对抗样本的脆弱性是将深度学习应用于安全关键型通信环境面临主要风险之一。在威胁模型下，对抗攻击可分为白盒攻击或黑盒攻击。代表性的防御方法包括对抗训练、基于随机化的方法，然而很难平衡防御的效率和复杂性。因此，未来对攻击和深度学习值得进行更深入的研究。


    可解释性是对其黑盒进行学习。目前已采取多种方法提高深度学习的可解释性。深度神经网络通过信息瓶颈 [35] 进行研究。此外，在许多应用中，端到端的解决方案并非最佳。优化的方案应该由数据处理过程组成，即：数据处理、特征提取和分类。


