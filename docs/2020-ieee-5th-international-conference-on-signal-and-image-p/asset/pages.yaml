    Safe neural networks have been found vulnerable to well-designed input samples
    which are called adversarial examples [33]. The vulnerability to adversarial examples
    is one of the major risks for applying deep learning in safety-critical communication
    environment. Under the threat model, adversarial attacks can be categorized into
    white or black box. Representative defense methods include adversarial training,
    randomization-based methoding, however, it is difficult to balance efficiency
    and complexity of the defenses. Therefore, attacks and deep learning deserve deeper
    investigation in future.


    Interpretability is learning for its black box. Various approaches have been made
    to improve interpretability of deep learning. Deep neural networks are investigated
    via the information bottleneck [35]. Furthermore, in many applications end-to-end
    solutions may not be the best. The optimized solution should be composed of data
    processing processes instead, data processing, feature extraction, classification.


