    # B. Encoding and Decoding


    The communication process basically depends on encoding and decoding. Decoding
    means the encoding from one system to another in the form of code. Can be symbol,
    sign or letters to represent the secret message. Decoding that the decoder interprets
    the message received by the source to its own mentality and experience.


    ![](img/30c596526eeed5a6092f7c437ca4aa00_1_1.png)


    # C. Modulation and Demodulation


    To involve data or speech information, one wave has to be imposed as input above
    the carrier wave. This process of imposing an input signal on a carrier wave is
    known as modulation. Modulation modifies the shape of a carrier wave to encode
    data that is needed to be transmitted. There are three types of modulation, frequency
    modulation, amplitude modulation and phase modulation. Demodulation is defined
    as extracting the original data or speech information from a modulated carrier
    wave. Demodulator is an electronic circuit that is used to recover the information
    from the modulated carrier wave.


    ![](img/30c596526eeed5a6092f7c437ca4aa00_1_2.png)


    # D. Channel State Information


    Channel state information (CSI) is information representing the state of a communication
    link from the transmit source to the receiver. CSI is fine-grained physical and
    channel data how the signal is perceived in the channel. In wireless communication
    systems CSI is one of the most fundamental problems, that represent the propagation
    characteristics of communication link.


