    # C. Channel Effects Modeling


    In Ref. [21] deep learning technology is used to develop CisNet, a novel channel
    state information sensing and recovery mechanism, which learns a transformation
    from CSI to a near-optimal compression (or inverse transformation) from codes.
    CisNet recovers CSI with significantly improved reconstruction quality using compressive
    sensing (CS) methods. A learning framework with a combination of CNN and RNN (LSTM)
    [22] is designed to perform deep CSI for 5G wireless communications [23]. Generative
    adversarial nets (GAN) are also employed to model the channel effects. A conditional
    GAN is employed to model the channel effects in a data-driven way.


