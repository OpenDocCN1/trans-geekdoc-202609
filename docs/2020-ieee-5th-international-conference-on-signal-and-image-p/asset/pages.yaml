    brief review on deep learning in application of communication signal processing.

    Abstract—This paper presents a review of deep learning in application of communication
    signal processing. As an important branch of artificial intelligence technology,
    deep learning schemes are independent of the underlying model and can extract
    meaningful features from the observed data. When applied to communication signal
    processing, deep learning algorithms provide the following main functions: symbol
    detection, feature extraction and information transformation. However, several
    challenges confronted by application of deep learning in communication signal
    processing are discussed as well.


    brief review on deep learning in application of communication signal processing.
    Section II provides the relevant terminology and concepts. Section III proposes
    the main functions performed by deep learning algorithms in application of communication
    signal processing. Unavoidably, several challenges are confronted by application
    of deep learning technology, which are provided in section IV together with the
    future research directions.


    Keywords—symbol detection; anti-interference; end-to-end; channel state information


    # ## I. INTRODUCTION


    As an important branch of artificial intelligence technology, deep learning attracts
    increasing interest and has been successfully applied to computer vision, speech
    recognition, natural language processing, etc. There are various types of deep
    learning algorithms with different architectures and characteristics. Deep neural
    networks (DNN) operate with multiple hidden layers, which can model complex nonlinear
    functions between the inputs and outputs. Convolutional neural networks (CNN)
    utilize a kernel to connect the upper and lower layers, which is much similar
    to biological neural networks. The CNN architectures are invariant to translation,
    scale, etc. However, either DNN or CNN cannot model sequence data. Recurrent neural
    networks (RNN) are a type of neural network where the output of one step is the
    input to the current step in sequence classification.


    Deep learning schemes have two major properties [4]. Firstly they are independent
    of the underlying model and suitable for scenarios where the model is unknown
    or the model parameters cannot be accurately estimated. Secondly, if the model
    is extremely complex, deep learning algorithms are able to extract meaningful
    features from the observed data, which is very difficult to carry out using traditional
    model-based approaches.


    Therefore, deep learning has been widely applied to communication signal processing
    and achieved noticeable performance. This paper presents a


