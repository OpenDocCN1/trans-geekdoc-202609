    # B. Anti-interference


    Deep learning-based anti-interference methods deepend rely on accurate estimates
    of interference. Research shows that well trained and RNN architectures can decode
    sequential keys such as the convolutional codes, and have good generation stability
    [15]. Performance of interference cancellation for the non-orthogonal signal using
    DNN is presented in [16]. The multiple processing layers of deep networks can
    simplify signal processing models efficiently with deterministic problems. DNN
    can also be integrated into the conventional algorithms and achieve robustness
    to uncertainty [24].


    Deep reinforcement learning [17] is employed to optimize the anti-jamming strategies
    via self-supervised learning. The algorithm does not need to model the jammer
    patterns and has the ability to explore the environment. Convolutional networks,
    such as U-Net [19], can be utilized to mitigate radio frequency interference throughing
    mitigations [20].


    Deep learning is used to learn jamming as a classifier [01]. One efficient anti-jamming
    strategy is that takes a small number of actions in spectrum access and prevents
    the jammer from building a reliable classifier. Either deep learning or deep reinforcement
    learning requires large amounts of data to train the deep neural networks. Obviously
    polluting the training


    The deep-learning-estimator can dynamically track the status without any prior
    knowledge about the channel and statistical characteristics [25]. Deep learning-based
    schemes help constructing the cost and low complex channel estimator through the
    perfect channel estimation method.


    # IV. DISCUSSION AND CONCLUSION


    Deep learning schemes are independent of the underlying model and able to extract
    meaningful features from the observed data. When the facing-shot scenario, there
    are efficient methods to solve this problem. GAN is employed to augment the training
    dataset with synthetic samples [10]. The meta-learning-based approach can generalize
    well with small samples [27].


    This paper presents a review of deep learning in application of communication
    signal processing. The relative terminology and concepts of deep learning are
    presented. Main methods discussed. However, there are several challenges faced
    by application of deep learning technology in communication scenario, which could
    be considered as the future research.


    Efficient neural network models. The needs of running high quality models on devices
    are increasing. Small and efficient neural networks [28][29] are necessary in
    the communication scenario of high concurrency or low energy. Deep learning researchers
    are working to shrink deep learning models without losing the models'' capabilities
    [31]. There are different approaches to build small and efficient neural networks,
    model pruning and quantization, model compression and decomposition, knowledge
    transfer and distillation [32]. An emerging generation of specialized chips is
    capable of packing more'
