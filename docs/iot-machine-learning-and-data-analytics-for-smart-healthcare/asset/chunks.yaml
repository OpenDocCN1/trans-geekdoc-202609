    ## 肺部 PET/CT 诊断

    数据集中包含肺癌患者的 CT 和 PET/CT 图像（DICOM 格式），以及指定肿瘤位置的文件（XML 标注）。这些图像获取自怀疑患有肺癌的患者，这些患者随后接受了肺部活检和
    PET/CT 扫描。带有字母“A”的患者被诊断为腺癌（ADC），“B”为小细胞肺癌（SCLC），“E”为大细胞肺癌（LCC），“G”为鳞鳞细胞肺癌（SCC），并附有他们的姓名/ID。（Wiki）


    ## 肺癌数据集

    可以获取用于识别肺癌的诊断信息，包括基因特征、基因表达模式和唾液基因中的生物标志物指示，以及非小细胞肺癌（NSLC）和小细胞肺癌（SCLC）之间的区别。（BioGPS）


    ## 肺部病理图像

    该数据集包含 25,000 张病理图像，分为五类不同的类别，即：肺 ADC 良性组织、肺 SCC、肺 ADC、结肠 ADC、结肠良性组织（Kaggle）


    ## LIDC-IDRI

    它包含低剂量 CT（LDCT）肺癌筛查。（LIDC）


    ## NLST

    它提供肺癌的 LDCT 筛查。（NLST）


    ## TCIA

    它提供各种肺癌数据集，包括 CT 扫描、PET 扫描和病理图像。（癌症影像存档）


    ## LIDC/IDRI

    它提供肺结节的 CT 扫描以及放射学家提供的相关标注。（LUNA 16 大挑战赛）


    ## 3.3 方法论


    尽可能检测肺癌的传统机器学习（ML）和深度学习（DL）系统包括数据获取、预处理、分割、特征提取和构建分类模型等步骤，如图图 3.1


    图 3.1 基于机器学习的肺癌检测系统。


    ### 3.3.1 预处理

    数据预处理是机器学习工作流中的关键步骤。执行了各种数据预处理步骤，如数据归一化、数据清洗、调整大小和肺图像分割，以提取感兴趣区域（ROI）（Bandyopadhyay
    2019）。高斯滤波和 Gabor 滤波、自适应高斯滤波、Wiener 滤波和 CLAHE 等各种后处理技术广泛用于图像数据分析。文本数据集的预处理将包含缺失值、不一致值和重复值的原始数据转换为清洗数据集。数据清洗技术列在图
    3.2


    图 3.2 数据清洗技术。


    在运行分类算法之前有效利用预处理技术可以提高分类模型的精度。为了实现这一改进，使用预处理方法创建了 9 个数据集，并应用了种机器学习分类方法。根据结果，在精度方面，K-近邻（`KNN`）方法优于
    `RF`（随机森林）、`NB`（朴素贝叶）、逻辑回归、`DT`（决策树）和 `SVM`（支持向量机）。使用与肺癌相关的数据评估了预处理方法的性能。最佳预处理方法是：归一化方法使用
    `Z-score` 准确率为 83%，降维方法使用主成分分析准确率为 87%，特征选择方法使用信息增益准确率为 71%（Gültepe 2021）。


    ### 3.3.2 不平衡数据

    不平衡分类数据是指类别大小倾斜的数据。占据数据大部分的类别是多数类，而占人口比例较小的类别是少数类。在医学决策中，经常观察到数据不平衡问题。如果在不平衡数据集上训练模型效果良好，那么工作就完成了。如果没有，则为了处理不平衡数据，会使用下采样或上采样技术。


    用于解决不平衡数据问题使用了增强型 `SVM`。该技术将使用多个分类器的优点与针对非均匀数据的代价敏感 `SVM` 结合起来。此外，为了获得决策规则，从增强型
    `SVM` 中描述了一种基于 Oracle 的方法。然后通过将其性能与其他处理不平衡数据的算法进行比较，评估该方法的质量。最后，增强型 `SVM` 用于医学领域，以估计肺癌患者术后的预期寿命（Zięba
    et al. 2014）。


    为了提高机器学习模型的预测性能，作者建议了一种用于处理不平衡数据的工程化上采样策略（`ENUS`）。实验结果证明，当少数类与多数类的比例小于 20% 时，使用
    `ENUS` 训练模型可以提高准确率、敏感度和 F1 分。研究还发现使用 `ENUS` 的 `XGBoost Tree`（XGBTree）性能最佳（Tran
    et al. 2022）。


    由于患者隐私、疾病稀有性和手动收集数据等原因，构建医学图像数据集是一项辛苦且困难的任务。通过增强解决了数据不足和数据不平衡的问题。它通过数据扭曲或过采样人为增加数据集的大小。在保留标签的同时转换图像。这包括图像混合、特征空间增强和神经风格迁移。生成对抗网络（`GANs`）（Shorten
    & Khoshgoaar 2019）。


    ### 3.3.3 分割是图像处理中最重要的部分。将完整图像分为许多部分使其更具相关性且更容易理解。当这些不同部分连接时，它们将覆盖整个图像。图像的许多属性也可能对分割产生影响，可能是颜色或纹理。在去噪之前进行分割以恢复原始图像。分割的主要目标是减少信息以便分析。通常，它分为基于区域、基于边缘、阈值、基于特征聚类和基于模型的分割（Yogamangalam
    & Karthikeyan 2013）。


    '
