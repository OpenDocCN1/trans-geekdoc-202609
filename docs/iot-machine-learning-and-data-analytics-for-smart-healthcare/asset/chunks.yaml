- raw: 'Blockchain is experiencing challenges related to **interoperability**, in
    other words, it is difficult to enable various blockchain-based applications designed
    with different operators or service providers to communicate with each other in
    a transparent and appropriate way. Hence, this challenge affects data exchange
    capability.


    Blockchain technology is still evolving and therefore faces **social challenges**,
    including cultural challenges, in addition to the technical challenges mentioned
    above. Indeed, a technology that is totally distinct from old ways of working
    can never be easily accepted and adopted. Even if the medical sector is gradually
    moving towards digitization, there is still a long way to go before it can fully
    adopt this technology, especially when it comes to a technology like blockchain,
    on which clinical criteria are not yet valid.


    ![Figure 1.2Blockchain healthcare applications challenges.](html/images/9781032551074_C001_002.jpg)


    Figure 1.2Blockchain healthcare applications challenges.


    ## 1.6 Conclusion and Future Work


    Nowadays, the healthcare domain knows a great evolution. In fact, it takes advantage
    of recently developed technologies like IoT, Machine Learning, blockchain and
    so on. Hence, the medical services offer doctors and medical service providers
    the ability to follow easily patients remotely and in real time. The deployment
    of such technologies generates high and various patient data that must be stored
    and shared securely. Subsequently, the [present chapter](#ch07.xhtml#c1) highlights
    different applications of blockchain in the healthcare field as it presents some
    advantages and challenges of this technology.


