    ## Lung-PET/CT-Dx

    The CT and PET/CT images of lung cancer subjects (DICOM format) are present in
    the dataset, along with files (XML annotation) that specify location of tumor.
    These images were obtained from patients suspected of having lung cancer, who
    subsequently underwent lung biopsies and PET/CT scans. Patients including the
    letter ‘A’ were diagnosed with ADC, ‘B’ with SCLC, ‘E’ with LCC, and ‘G’ with
    SCC along with their names/ID’s. (Wiki)


    ## Lung cancer datasets

    A diverse range of diagnostic information is accessible for identifying lung cancer,
    including factors like gene signatures, gene expression patterns, and biomarker
    indications found in gene saliva, as well as distinctions between NSLC and SCLC.
    (BioGPS)


    ## Lung histopathological images

    The dataset comprises 25,000 histopathological images, divided into five distinct
    classes, namely: Benign tissue from the lung ADC of the lung SCC of the lung ADC
    of the colon Benign tissue from the colon (Kaggle)


    ## LIDC-IDRI

    It consists of low-dose CT (LDCT) lung cancer screening. (LIDC)


    ## NLST

    It provides LDCT screening for lung cancer. (NLST)


    ## TCIA

    It provides various lung cancer datasets, including CT scans, PET scans, and pathology
    images. (The Cancer Imaging Archive)


    ## LIDC/IDRI

    It provides CT scans of lung nodules and associated annotations provided by radiologists.
    (LUNA 16 Grand Challenge)


