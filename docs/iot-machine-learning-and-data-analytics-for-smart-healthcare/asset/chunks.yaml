  trans: '

    纯素主义是一种放弃使用动物制品的生活方式，在学术界和大众辩论中都受到了广泛关注（Dagnelie, 2003）。这篇关于纯素主义文献综述旨在审查与其伦理基础、环境影响、健康影响以及影响其普及的社会因素相关的重大主题和发现（Ruby,
    2012）。伦理论证强调了动物福利的道德重要性、无伤害行为以及反对物种歧视。Pimentel & Pimentel (2003)ch12.xhtml#r359)
    探索了感知、道德关怀和非动物权利的观点，以评估纯素主义的哲学和道德论证。动物畜牧业大幅增加了温室气体排放、森林砍伐和水污染（Mottet, 2017）。


    比较基于动物的饮食和基于植物的饮食可以发现，转变为纯素生活方式可能会大大减少个人的生态影响。许多研究考察了纯素饮食在健康影响方面与非纯素饮食的对比，这为与植物性饮食模式相关的潜在健康效益提供了宝价值的见解（[Tilman
    & Clark, 2014; Tuso et al., 2013）。


    根据 Giaginis et al. (2023)ch12.xhtml#r339)的研究，计划良好的纯素饮食可以提供适当的营养，包括蛋白质、维生素、矿物质和必需脂肪酸。近年来，对研究纯素主义健康效益的兴趣日益增加。许多研究了纯素饮食者的营养状况以及他们的饮食如何影响其健康。该综述研究了纯素饮食的潜在优缺点，以及宏量营养素、维生素、矿物质的摄入和可能的营养缺乏风险。它还研究了纯素如何影响包括癌症、糖尿病和心脏病在内的慢性疾病的发展（[Dixon
    et al., 2023）。


    ### 6.2.1 作为可持续饮食策略的纯素主义


    纯素主义通常将纯素主义视为一种基于否认动物商品地位的政治哲学（Pedersen & Staescu, 2014），或一种环境可持续理念的组成部分（Buttny
    & Kinefuchi, 2020; Hudepohl, 2021）。尽管许多人认为吃纯素是激进的，但它不仅在西方社会，在世界其他文化中也变得越来越流行（Forgrieve,
    2018; Jones, 2020）。然而，纯素主义的政治、集体和社会运动侧面很少受到学术界的关注。为了理解和实践一种环境可持续的生活方式，在意识形态和社会层面广泛掌握纯素主义至关重要。


    纯素主义因为其具有有利的环境、伦理和健康影响的潜力，经常被视为一种可持续饮食计划。纯素主义通过减少养殖业对抗生素的需求，有助于对抗抗生素耐药性（这是一个全球性健康问题）。消除动物畜牧业可以促进植物性食品行业的发展并推动可持续经济增长（Leach
    et al., 2020）。


    ### 6.2.2 纯素作为可持续选择的主要原因


    *   **减少温室气体排放：** 尤其是甲烷和氧化二氮是与畜牧业相关的主要的温室气体排放。纯素者的碳足迹通常比非纯素者低，这有助于缓解气候变化（Judge
    et al., 2022）。

    *   **减少森林砍伐：** 畜牧业的发展经常导致砍伐，阻碍了地球吸收二氧化碳的能力并加剧了栖息地的丧失。纯素主义鼓励保护森林（Tajfel &Turner,
    1979）。

    *   **保护生物多样性：** 密集动物生产经常导致生物多样性下降。纯素者通过放弃动物制品可以保护濒危动物并维持生态系统（Dhont et al., 2014）。

    *   **健康益处：** 均衡时，纯素饮食可以改善健康并减轻医疗系统的负担。通过降低医疗费用，这间接贡献了长期可持续性（Cramer et al., 2017）。

    *   **创新和替代蛋白源：** 纯素主义引发了对实验室培养和植物肉替代品的研究，这些产品未来可能通过减少传统肉类生产的环境影响来提供可持续的解决方案（Cruwys
    et al., 2020）。

    *   **对文化和世界的影响：** 纯素主义的普及鼓励更多的人在全球范围内采取可持续的饮食习惯，并改变他们的食物选择和行为（Buttny and Kinefuchi,
    2020）。


    虽然吃纯素是一种可持续的饮食计划，但可持续水平可能会根据个人饮食偏好和食物来源而异。并非所有纯素产品都是一样的，可持续性仍然可能受到运输、包装和耕作方法等不同方面的影响。归根结底，转变为纯素饮食只是人们为减少对环境的影响和伦理问题可以采取的许多替代方案之一。选择可持续饮食并在农业和食品系统中做出更广泛的努力，对于解决与全球可持续性相关的问题都非常有帮助（Drury
    et al., 2012）。纯素主义通过支持植物性饮食，促进了更多多样化和可持续食品系统的增长，这些系统优先考虑植物营养来源。


    ### 6.2.3 纯素产品的挑战与局限性


    然而，对潜在的负面影响也存在担忧，例如特定生命阶段的潜在营养缺、特定环境下的食物选择有限以及营养挑战。虽然计划良好的纯素饮食可以满足营养需求，但计划不当或对健康饮食习惯的无知会导致营养缺乏，特别是维生素
    B12、铁、钙和欧米 3 脂肪酸（Craig, 2009）。为了确保在特定生命阶段（如怀孕、哺乳、婴儿期或老年人）获得最佳营养摄入，可能需要额外的考虑（Marsh
    et al., 2020ch12.xhtml#r352) 指出，采用纯素生活方式可能会带来社会挑战，包括应对社交场合、外出用餐以及在旅行时寻找合适的选择。某些个人可能面临批评、社会污名或来自朋友、家人或社区的支持。Nobari
    (2023)ch12.xhtml#r357) 调查发现，纯素主义并不是一种一成不变的方法，个人有不同的饮食偏好、口味和文化背景。对某些个人来说，坚持严格的纯素饮食可能是挑战性的，他们可能会选择遵循更灵活的“弹性素食”（flexitarian）方法。针对纯素饮食的有限营养教育和指导，对于寻求可靠信息以满足营养需求并在遵循纯素生活方式的同时维持整体健康的人来说，可能是一个挑战（[Kothe
    et al., 2020; Melina et al., 2016）。


