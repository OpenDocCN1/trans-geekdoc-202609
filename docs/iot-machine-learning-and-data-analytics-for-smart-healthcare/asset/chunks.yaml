    ## 6.5 Conclusion


    Veganism has become a global phenomenon. Although there aren’t crowds of people
    waiting in line to become vegans, it has become more and more popular over the
    past ten years. Statistics from 2023 indicated that there are about 88 million
    vegans worldwide. Though it is a minute percentage of the population, a rising
    percentage declaring veganism is evoking a global trend supported by the world
    map analysis of Twitter data. India is a vast country with an almost 13 per cent
    vegan population followed by China and the United States with a three-quarters
    of women vegan population ([Jen, 2023](#ch12.xhtml#r344)). This study emphasised
    the consumer insights of veganism by using NVivo software as a tool to visualise
    the consumer insights towards veganism. The Ncapture software study identified
    17216 vegan-related tweets and recognised “vegan” as the ninth most trending topic
    worldwide, which illustrated the accepting phenomenon of veganism in the world.
    This study also considered 1686 exclusive Scopus research papers on veganism for
    qualitative analysis which can itself be considered as a huge slice of pie in
    consumer research of social sciences. This chapter conflated the analysis of sentimental,
    thematic analysis of Twitter social media; the Scopus database concluded the raising
    awareness of veganism. These results underlined the importance of vegan producers
    exploring new markets for consumer products in contrast to meat consumption.


