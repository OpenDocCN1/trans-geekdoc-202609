    # CHAPTER 6Analysing the Ascendant Trend of Veganism: A Comprehensive Study on
    the Shift towards Sustainable Dietary Choices


    Shikha Bhagat, Shilpa Sarvani Ravi and Rashmi Rai


    DOI: [10.1201/9781003430735-6](http://doi.org/10.1201/9781003430735-6)


    ## 6.1 Introduction


    A vegan is someone who generally avoids using animal products and does not consume
    any food made from animals, often for ethical, spiritual, or health-related reasons.
    A vegan doesn’t really even use anything produced from leather, feathers, fur,
    etc. Vegans are people who don’t eat meat and aren’t allowed to consume anything
    that has been subjected to animal testing ([Smith, 2020](#ch12.xhtml#r366); [Brown
    & Jones, 2021](#ch12.xhtml#r323)). It has emerged as a prominent social and dietary
    movement that has gained significant traction in recent years. With its roots
    deeply embedded in ethical considerations, environmental concerns, and personal
    health, veganism represents a lifestyle choice that aims to exclude the consumption
    and use of animal products in all aspects of life ([Kwiatkowska et al., 2022](#ch12.xhtml#r349)).


    Furthermore, personal health has become a key motivating factor for individuals
    embracing veganism. A well-planned vegan diet can provide an array of essential
    nutrients, including fibre, vitamins, minerals, and antioxidants. A balanced vegan
    diet, when properly planned, has been found to have many health advantages, including
    lowering the chance of developing chronic conditions including heart disease,
    diabetes, and some types of cancer ([Fox & Ward, 2008](#ch12.xhtml#r337)). In
    order to create a final product that resembles actual meat and may be used as
    a meat substitute, vegan products are typically manufactured with soy protein,
    mushrooms, rice, lentils, and wheat gluten ([Miller, 2022](#ch12.xhtml#r354)).


    There are various reasons why someone can decide to become vegan:


    *   To cease funding the meat business while they continue to horrendously butcher
    our farm animals.


    *   For the sake of health (eating meat can lead to heart disease, diabetes, and
    high cholesterol).


    *   To protect the environment (factory farming is one of the main causes of global
    warming).


    *   Concerns regarding the composition of meat owing to additions and chemicals
    (most of us have no idea what is in it).


    Additionally, there are always people who act in a certain way because it is the
    norm.'
