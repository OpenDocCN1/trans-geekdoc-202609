    在过去的二十十年里，人工智能（AI）和机器学习（ML）算法已变得日益重要，能够帮助人们并提高他们分析不稳定数据以及对其做出稳定判断的能力。使用这些最新技术，可以在肺癌早期阶段发现它。大多数针对非小细胞肺癌（NSCLC，Wu
    & Zhao 2017）的研究论文发明了一种新型基于神经网络的算法——熵退化法（`EDM`）来检测小细胞肺癌（SCLC）。输入的 CT 图像由国家癌症研究所提供。该算法实现的准确率为
    77.6%。通过大量的训练数据和更深的网络结合 `CNN`，可以改进所提出的方法。


    肺癌诊断涉及临床专家使用的三种不同方法：成像技术、生物标志物分析以及细胞病学或组织病理学分析。


    ### 成像诊断方法


    利用多种成像诊断方法来识别肺癌。这些技术包括胸部射线（`CXR`）、计算机断层扫描（`CT`）、磁共振成像（`MRI`）和正电子发射层扫描（`PET`）。传统的
    `CXR` 成像对于检测肺部异常（如肿瘤或结节）有效。`CT` 扫描提供详细的肺部横断面图像，能够识别和表征肺肿瘤。`MRI` 扫描利用强大的磁铁和无线电波产生详细的肺部图像，有助于评估肺癌及其扩散。`PET`
    扫描使用放射性示踪剂来突出代谢活动异常的区域，辅助肺癌的检测和分期（McLoud 2002）。


    ### 生物标志物分析


    生物标志物衡量疾病的进展或存在。生物标志物分析在检测和诊断癌症（包括肺癌）中起着重要作用。它涉及两种生物标志物：遗传生物标志物和血液生物标志物。可以使用聚合酶链反应（`PCR`）或二代测序（`NGS`）等技术分析
    `EGFR` 或 `ALK` 突变等遗传突变，以检测肺癌并指导治疗决策。此外，还可以分析血液中的生物标志物（如循环肿瘤细胞和循环肿瘤 DNA），以检测肺癌并监测治疗反应（Issaq
    et al. 2011）。


    ### 细胞病学和组织病理学分析


    可以通过细胞病学或组织病理学图像进行肺癌诊断。细胞病学诊断可以通过细胞病学或组织病理学图像完成。


    深度卷积网络（`DCNN`）使用了`convolution layers`、`pooling layers` 和全连接层。`DCNN` 用于分类各种癌症。`DCNN`
    用于识别`benign`和`malignant`特征。`DCNN` 用于`image augmentation`。`DCNN` 用于分类各种癌症。`DCNN`
    用于识别 `SCC` 和 `SCLC`。


    对抗网络（`GAN`）用于创建合成图像。渐进增长 GAN（`PGGAN`）用于高分辨率图像。`GAN` 用于分类。


    卷积神经网络（`CNN`）和 `Swin transformers` 用于肺癌。`mask R-CNN` 用于识别肺细胞。`Swin transformers`
    模型用于分类。


    组织病理学涵盖多种技术，包括组织活检和分子……样本用于……`Resnet50` 用于分类。


    免疫组化学（`IHC`）染色用于检测特定蛋白。`... 荧光原位杂交（`FISH`）或多基因面板可识别遗传变异（Coudray et al. 2018）。


    组织病理学分析在检测和诊断癌症中起着重要作用。然而，它也面临一些影响结果准确性和可靠性的挑战。为了应对这些挑战，引入 `AI` 和 `DL` 可能有助于病理学家做出更精确、更一致的诊断（Lindquist
    et al. 2022）。

