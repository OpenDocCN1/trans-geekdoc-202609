- raw: "The research paper provides a piece of information on the use of CNN to classify\
    \ the 3 most common lung cancer types. For classification, various CNN architectures\
    \ such as VGG16, InceptionV3, and InceptionResNetV2 were trained and optimized.\
    \ InceptionV3 gives better classification accuracy from various architectures\
    \ on the training set, so it is used on the test set. The result in the paper\
    \ highlights the limitations of CNN Image classification models ([Kriegsmann et\
    \ al. 2020](#ch09.xhtml#r153)).\n\nA novel CADe system for the early detection\
    \ of lung cancer pulmonary nodules is presented. The methodology includes preprocessing\
    \ of raw data, feature extraction, optimization of extracted features, and finally\
    \ classification based on the optimized feature vector. For relevant feature selection,\
    \ it uses the transfer learning technique. The novel CADe system accuracy has\
    \ been tested, and it shows promising results in early lung cancer detection ([Hekal\
    \ et al. 2021](#ch09.xhtml#r147)).\n\nMetabolomics research was done to identify\
    \ metabolite biomarkers for the diagnosis of lung cancer. The fast correlation-based\
    \ filter (FCBF) technique is used to determine the importance of a metabolic biomarker\
    \ feature. Six different ML algorithms were applied to biomarker features for\
    \ the early detection of lung cancer. NB showed greater accuracy out of six different\
    \ ML algorithms ([Xie et al. 2021](#ch09.xhtml#r172)).\n\n### 3.3.7 Hybrid Models\n\
    \nhybrid models, or fusion models, are combinations of various models to get better\
    \ outcomes, whereas in ensemble models, various methods are combined. Hybrid ML\
    \ and DL models are usable as tools that can support clinical decision-making.\
    \ The hybrid models can integrate imaging and non-imaging data and apply DL and\
    \ ML models, respectively.\n\nThe research was performed to create a new feature\
    \ analysis of CT images quantitatively. Then its role was examined in predicting\
    \ cancer recurrence risk in stage I NSCLC patients post-surgery, along with two\
    \ genomic biomarkers, namely protein expression of the excision repair cross-complementing\
    \ 1 gene and a Regulatory Subunit of Ribonucleotide Reductase (RRM1). A computer-aided\
    \ detection (CAD) technique was used to separate lung tumors. Tumor-related image\
    \ attributes computed on chest CT images, a Naive Bayesian network-based classifier\
    \ using image features and an MLP classifier utilizing genetic biomarkers underwent\
    \ training to forecast cancer re-occurrence after surgery. The fusion of prediction\
    \ scores provided by the two classifiers boosted prediction performance much more\
    \ ([Emaminejad et al. 2015](#ch09.xhtml#r143)).\n\nThe combination of CT images\
    \ with clinical data into a multimodal data fusion model gives the best performance\
    \ for the classification of lung cancer. A multimodal data fusion model created\
    \ using residual learning architecture and two MLP was developed to combine CT\
    \ images with patient general data and serum tumor markers ([Huang et al. 2022](#ch09.xhtml#r148)).\n\
    \nA DNN model and data collection using a cloud system for dividing pulmonary\
    \ sickness phases provided for classifying several stages of lung tumor advancement.\
    \ As a fusion approach for PET/CT images, the suggested system makes use of a\
    \ lung tumor detector and stage classifier hosted in the cloud (Cloud-LTDSC).\
    \ The suggested Cloud-LTDSC used an active contour model for lung tumor segmentation,\
    \ and a multilayer convolutional neural network (M-CNN) for identifying different\
    \ stages of lung cancer was designed and verified using standard benchmark images\
    \ ([Kasinathan & Jayakumar 2022](#ch09.xhtml#r152)).\n\nIn this study, four DCNN\
    \ models: AlexNet, GoogLeNet (Inception V3), VGG16 and ResNet50 were used to classify\
    \ cytological images into ADC, SCC, and SCLC. The proper subtype classification\
    \ is useful for correct treatment. For more appropriate ML classification models\
    \ like NB, SVM, RF, and neural network (NN) were applied. The classification accuracies\
    \ of the four DCNN models were 74.0%, 66.8%, 76.8% and 74.0%, respectively. The\
    \ four ML classifiers improved overall accuracies to 75.1%, 77.5%, 78.2%, and\
    \ 78.9%, respectively. The result shows improvement in classification accuracy\
    \ using additional ML models with DCNN models [Tsukamoto et al. (2022](#ch09.xhtml#r168)).\n\
    \n### 3.3.8 Evaluation Metrics\n\nTo evaluate the ML and DL models’ performance,\
    \ accuracy, precision, recall, F-measure, and AUC metrics were considered ([Dritsas\
    \ & Trigka 2022](#ch09.xhtml#r141)).\n\nThe performance metrics were evaluated\
    \ based on the confusion matrix. It contains values which are true positive (TP),\
    \ true negative (TN), false positive (FP), and false negative (FN).\n\nPrecision=\
    \ (TP)/(TP+FP) Recall (sensitivity)=(TP)/(TP+FN) Specificity=(TN)/(TN+FP) F-measure=(2\\\
    *precision\\*recall) / (precision + recall) Accuracy=(TN+TP)/(TN+TP+FN+FP) \n\n\
    Accuracy serves as an evaluation metric for classification tasks and measures\
    \ the proportion of correctly predicted instances among all data instances.\n\n\
    Recall, also known as the true positive rate or model sensitivity, measures the\
    \ model’s ability to correctly identify participants who genuinely had lung cancer\
    \ among all those who actually had the condition. Precision is a metric that gauges\
    \ quality, whereas recall assesses quantity.\n\nPrecision is the number of participants\
    \ who had lung cancer out of all the samples predicted to be positive by the model.\n\
    \nThe F-measure is the harmonic mean of precision and recall, offering a combined\
    \ score that accounts for both precision and recall in models, especially valuable\
    \ when dealing with imbalanced data.\n\nThe AUC contains values between zero and\
    \ one. It is a measure of classification and works to identify the ML model that\
    \ performs well in differentiating lung cancer and normal cases. When the AUC\
    \ value becomes 1, the models have a correct ability to differentiate between\
    \ two classes. The larger values of precision, recall, specificity, F- measure,\
    \ and AUC mean better performance of the model.\n\n[Table 3.2](#ch09.xhtml#t3)\
    \ summarizes the methodologies, datasets, performance measures, results and the\
