  trans: '


    *   行政任务：预约调度、账单处理和保险理赔处理只是 AI 可以自动化的行政事务中的少数几项。这些任务可能耗时较长且容易出错，从而增加成本并降低效率。医疗机构通过自动化行政活动，可以降低成本、提高生产力，并释放人员以专注于患者护理[43]–[45]。


    *   药物发现：AI 可以分析海量数据集以发现潜在的候选药物，并加速药物发现过程。AI 系统可以分析基因组和蛋白质组学数据以寻找新的药物靶点。AI 还可以预测新候选药物的疗效和毒性，减少临床前测试所需的时间和资金[46]–[48]。


    *   患者监控：AI 可以通过穿戴技术远程监控患者的生命体征、活动水平和药物依从性。通过使用 AI 算法识别患者数据中的趋势和异常，医疗专业人员可以在问题严重化之前收到警报。远程患者监控的使用通过最大限度地减少住院和急诊室访问，可以降低医疗费用[49]–[52]。


    ### 表 2.1 AI 的某些医疗应用


    | 应用 | 描述 | 参考文献 |

    | --- | --- | --- |

    | 医学影像 | AI 算法可以分析 X 光、MRI 和 CT 扫描等医学图像，以协助诊断疾病、发现异常，甚至预判疾病的进展。 | [36]–[39] |

    | 电子健康记录 (EHRs) | AI 有潜力在患者数据录入、分类和组织等领域提高 EHR 的准确性和效率。它还可以帮助决策支持、预测临床结果和制定个性化治疗计划。
    | [53]–[55] |

    | 药物发现与开发 | AI 通过分析海量数据来寻找潜在的治疗靶点、预测药物疗效并创建新化合物，有助于加速药物发现过程。 | [46]–[48] |

    | 远程患者监控 | AI 可以通过穿戴设备和其他传感器远程监控患者，告知医疗人员患者状况的任何变化并协助早期诊断和干预。 | [49]–[52] |

    | 临床决策 | AI 可以协助医疗提供者做出临床决策，包括诊断、治疗计划制定和结果预测。这有助于改善患者预后并减少错误。 | [32]–[35] |


    人工智能 (AI) 正在彻底改变医疗部门的运作方式，通过帮助增强和改进与医疗相关的一切方面，包括例行任务、数据分析和药物开发。由于医疗领域不断发展，它总是在寻找改进机会。因此，医疗提供者和企业都采用机器学习和
    AI 并不意外。AI 在医疗领域应用的一些优势包括：


    *   改善患者预后：AI 可以协助医疗专业人员在诊断和治疗方面做出更科学的决策，改善患者预后[49]。

    *   降低医疗成本：通过提高效率、减少错误和消除不必要的治疗，AI 可以降低医疗开支。

    *   个性化医疗：AI 可以分析患者数据，根据个人特征创建个性化治疗计划，从而实现更有针对性和更成功的治疗。

    *   更快的药物发现：AI 可以通过识别潜在治疗靶点、预测药物疗效和毒性来协助药物发现过程。


    虽然 AI 在医疗管理中潜力巨大，但必须克服各种障碍，包括：


    *   数据隐私与安全：AI 需要访问大量患者数据，这引发了隐私和安全问题[56]。

    *   伦理考量：AI 的应用可能会引发与医疗管理应用相关的伦理问题[57]。

    *   缺乏标准化：AI 算法可能会产生偏见，引发与医疗管理应用相关的伦理问题[58]。

    *   实施挑战：AI 在医疗管理中的应用可以带来患者预后改善、成本节省和效率提高等主要利益，但在实施方面存在各种困难[59]。


    ## 2.3 医疗人工智能中的伦理考量


    AI 具有改变医疗管理的潜力，但其实施带来了基础性的伦理问题。数据隐私与安全、偏见与公平、开放与可解释性、问责与责任、知情同意以及监管都是医疗管理中重要的伦理考量[60]。医疗机构和
    AI 开发者必须考虑到这些因素，以确保患者的安全、隐私和公平。这包括实施稳健的数据隐私和安全措施、监控并处理 AI 算法中的偏见、确保 AI 的透明度、对结果负责、获得患者知情同意并建立的监管框架和治理结构。解决医疗管理中的这些伦理问题对于发挥
    AI 潜力同时最大限度减少对患者的风险至关重要[61]。


    除了上述伦理考量外，在医疗管理中使用 AI 还存在几个几个更严重的问题。其中一个问题是由于 AI 系统自动化了传统人类的工作，可能会导致职业流失。这引发了关于医疗机构重新培训或帮助员工责任的问题。另一个问题是
    AI 可能会放大目前医疗获取和结果方面的差距[62]。例如，如果 AI 系统的训练数据主要反映了某些人口群体的经验，那么它们对其他群体可能就无效。这强调了在数据收集和
    AI 开发中确保多样性和包容性的重要性。


    ## 2.4 医疗管理中人工智能的未来


    人工智能 (AI) 在医疗管理方面前景光明，许多可能的应用可能会改善患者预后并提高效率。预计 AI 将产生影响的主要领域包括：


    *   诊断与治疗：人工智能系统可以通过训练海量医疗数据来识别趋势并提供可靠的诊断。根据患者数据，AI 可能被用于建议药物并预测结果[63]。

    *   患者监控：AI 驱动的技术可以实时监控患者的健康状况，在问题变得之前向医疗提供者警报。


