- raw: 'Over the previous two decades, artificial intelligence (AI) and ML algorithms
    have acquired relevance to help people and to improve their capacity to analyze
    unstable data and produce stable judgments about them. Using these newest technologies,
    it is possible to find lung cancer in its early stages. Most research papers focused
    on NSCLC ([Wu & Zhao 2017](#ch09.xhtml#r171)) invented a novel neural-network-based
    algorithm, entropy degradation method (EDM) to detect SCLC. The CT images input
    are provided by the National Cancer Institute. The accuracy achieved by the algorithm
    was 77.6%. Improvement in the proposed method can be made with large training
    data and a deeper network, combined with CNN.


    Lung cancer diagnosis involves three distinct methods employed by clinical experts:
    imaging techniques, biomarker analysis, and cytopathological or histopathological
    analysis.


    Several imaging diagnostic methods are utilized to identify lung cancer. These
    techniques comprise chest radiography (CXR), computed tomography (CT), magnetic
    resonance imaging (MRI), and positron emission tomography (PET) scans. Traditional
    CXR imaging is effective in detecting lung abnormalities such as tumors or nodules.
    CT scans provide detailed cross-sectional lung images, enabling the identification
    and characterization of lung tumors. MRI scans utilize powerful magnets and radio
    waves to produce detailed lung images, helping in the assessment and evaluation
    of lung cancer and its spreading. PET scans use a radioactive tracer to highlight
    areas of abnormal metabolic activity, assisting in the detection and staging of
    lung cancer ([McLoud 2002](#ch09.xhtml#r156)).


    Biomarkers measure the progress or presence of disease. Biomarker analysis plays
    an important role in detecting and diagnosing cancer, including lung cancer. It
    involves two types of biomarkers: genetic biomarkers and blood-based biomarkers.
    Genetic mutations or alterations like EGFR or ALK mutations can be analyzed using
    techniques like polymerase chain reaction (PCR) or next-generation sequencing
    (NGS) to detect lung cancer and direct treatment decisions. Additionally, biomarkers
    present in the blood, like circulating tumor cells and circulating tumor DNA,
    can be analyzed to detect lung cancer and monitor treatment response ([Issaq et
    al. 2011](#ch09.xhtml#r150)).


    Lung cancer diagnosis can be done with cytopathological or histopathological images.
    Cytopathological diagnoses are safer, economical and provide quick results.


    The deep convolutional neural network (DCNN) was used to classify cytological
    images with malignant or benign features automatically for three types of cancers.
    DCNN contains 3 convolutional layers, 3 pooling layers, and 2 fully connected
    layers. Data augmentation was performed to avoid overfitting. The original image
    was rotated, inverted, and filtered in the process of augmentation. In the results
    obtained almost 71% of the images were classified correctly. The classification
    accuracies for three types of cancers, ADC, SCC, and SCLC, were 89.0%, 60.0%,
    and 70.3%, respectively. DCNN is used for the first time by the author ([Teramoto
    et al. 2017](#ch09.xhtml#r163)).


    A fine-tuned VGG-16 model is used to improve the accuracy of previously used DCNN.
    The image patches were obtained by cropping microscopic images and then data augmentation
    was performed. After improvement, 81.0% accuracy is achieved by the DCNN model
    ([Teramoto et al. 2019](#ch09.xhtml#r164)).


    To improve DCNN’s classification accuracy even more, generative adversarial network
    (GAN) is used to create synthesized cytological images with actual image patches.
    Authors introduced progressive growing of GANs (PGGAN) for high resolution of
    images. The DCNN model pre-trained using GAN gave a classification accuracy of
    85.3%. Approximately 4.3% improvement was found as compared to the previous study
    ([Teramoto et al. 2020](#ch09.xhtml#r165)).


    Convolutional neural networks (CNN) and Swin transformers are used for the automatic
    detection of lung cancer cells. Cell nucleus segmentation using a mask R-CNN was
    applied to microscopic images. On the segmented images target cells were focused,
    ignoring background by Gaussian blurr, then a Swin transformer classification
    model is applied. The accuracy of the classification model using a Swin transformer
    is 96.16% which is nearly 2% better than a normal Resnet50 CNN model (Chen et
    al. 2022).


    Histopathology encompasses various techniques, including tissue biopsy, immunohistochemistry,
    and molecular profiling. A sample of lung tissue is obtained through a biopsy
    procedure and checked by a pathologist to verify the presence of lung cancer cells
    and their features. ImmunoHistoChemistry (IHC) staining is used to detect specific
    proteins or biomarkers in tissue samples, which helps classify lung cancer subtypes
    and inform treatment decisions. techniques like fluorescent in situ hybridization
    (FISH) or multiplex gene panels can be employed to identify genetic alterations
    or gene expression patterns in lung cancer tissue. Assistance can be provided
    to pathologists in the detection of cancer by DL Models applied on histopathology
    slides ([Coudray et al. 2018](#ch09.xhtml#r139)).


    Histopathological analysis plays an important role in the detection and diagnosis
    of lung cancer. However, it also comes with several challenges that can affect
    the accuracy and reliability of the results ([Lindquist et al. 2022](#ch09.xhtml#r154)).
    Some of the key challenges include tissue sample quality, tissue heterogeneity,
    small biopsy samples, division between benign and malignant nodules, subtyping
    and staging, interobserver variability, lack of specificity, integration with
    molecular testing, handling rare variants, frozen section analysis, and identifying
    emerging therapies. To address these challenges, incorporating AI and DL algorithms
    may assist pathologists and oncologists in making more precise and consistent
    diagnoses.


    DL has shown great promise in enhancing histopathological analysis for the diagnosis
    of lung cancer. Processing histology slides and supporting pathologists in their
    diagnostic work are two applications that benefit from its capacity to automatically
    learn and extract detailed patterns from large-scale image databases ([Deepapriya
    et al. 2023](#ch09.xhtml#r140)). Here are some ways DL is helpful in this context:
    image analysis and segmentation, feature extraction, improved accuracy and reproducibility,
    subtype classification, prognostic prediction, integration of image data with
    molecular data, integration of image data with bio-markers, speeding up diagnosis,
    rare variant detection, and personalized treatment.


    ## 3.2 Dataset


    The basic categorization begins by utilizing a dataset that includes factors such
    as air pollution, alcohol drinking, and smoking as contributors to the likelihood
    of acquiring lung cancer. The complex dataset comprises images, gene expression
    data, or other biomarkers, as shown in [Table 3.1](#ch09.xhtml#t2).


    [Table 3.1](#ch09.xhtml#t2b) Lung Cancer Dataset


    | **No** || **Dataset** || **Description** || **Source** |


