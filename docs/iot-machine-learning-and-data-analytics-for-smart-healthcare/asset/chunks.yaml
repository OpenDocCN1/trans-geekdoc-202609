  fmt: '

    The research paper provides a piece of information on the use of `CNN` to classify
    the 3 most common lung cancer types. For classification, various `CNN` architectures
    such as `VGG16`, `InceptionV3`, and `InceptionResNetV2` were trained and optimized.
    `InceptionV3` gives better classification accuracy from various architectures
    on the training set, so it is used on the test set. The result in the paper highlights
    the limitations of `CNN` Image classification models ([Kriegsmann et al. 2020](#ch09.xhtml#r153)).


    A novel `CADe` system for the early detection of lung cancer pulmonary nodules
    is presented. The methodology includes preprocessing of raw data, feature extraction,
    optimization of extracted features, and finally classification based on the optimized
    feature vector. For relevant feature selection, it uses the transfer learning
    technique. The novel `CADe` system accuracy has been tested, and it shows promising
    results in early lung cancer detection ([Hekal et al. 2021](#ch09.xhtml#r147)).


    Metabolomics research was done to identify metabolite biomarkers for the diagnosis
    of lung cancer. The fast correlation-based filter (`FCBF`) technique is used to
    determine the importance of a metabolic biomarker feature. Six different `ML`
    algorithms were applied to biomarker features for the early detection of lung
    cancer. `NB` showed greater accuracy out of six different `ML` algorithms ([Xie
    et al. 2021](#ch09.xhtml#r172)).


    ### 3.3.7 Hybrid Models


    Hybrid models, or fusion models, are combinations of various models to get better
    outcomes, whereas in ensemble models, various methods are combined. Hybrid `ML`
    and `DL` models are usable as tools that can support clinical decision-making.
    The hybrid models can integrate imaging and non-imaging data and apply `DL` and
    `ML` models, respectively.


    The research was performed to create a new feature analysis of CT images quantitatively.
    Then its role was examined in predicting cancer recurrence risk in stage I NSCLC
    patients post-surgery, along with two genomic biomarkers, namely protein expression
    of the excision repair cross-complementing 1 gene and a Regulatory Subunit of
    Ribonucleotide Reductase (`RRM1`). A computer-aided detection (`CAD`) technique
    was used to separate lung tumors. Tumor-related image attributes computed on chest
    CT images, a Naive Bayesian network-based classifier using image features and
    an `MLP` classifier utilizing genetic biomarkers underwent training to forecast
    cancer re-occurrence after surgery. The fusion of prediction scores provided by
    the two classifiers boosted prediction performance much more ([Emaminejad et al.
    2015](#ch09.xhtml#r143)).


    The combination of CT images with clinical data into a multimodal data fusion
    model gives the best performance for the classification of lung cancer. A multimodal
    data fusion model created using residual learning architecture and two `MLP` was
    developed to combine CT images with patient general data and serum tumor markers
    ([Huang et al. 2022](#ch09.xhtml#r148)).


    A `DNN` model and data collection using a cloud system for dividing pulmonary
    sickness phases provided for classifying several stages of lung tumor advancement.
    As a fusion approach for PET/CT images, the suggested system makes use of a lung
    tumor detector and stage classifier hosted in the cloud (`Cloud-LTDSC`). The suggested
    `Cloud-LTDSC` used an active contour model for lung tumor segmentation, and a
    multilayer convolutional neural network (`M-CNN`) for identifying different stages
    of lung cancer was designed and verified using standard benchmark images ([Kasinathan
    & Jayakumar 2022](#ch09.xhtml#r152)).


    In this study, `DCNN` models like `AlexNet`, `GoogLeNet`, `VGG16`, and `ResNet50`
    were used to classify `ADC`, `SCLC`, and `SCC`. The `ML` models like `SVM`, `RF`,
    and `NN` were applied. The accuracies of `DCNN` models were 74.0%, 66.8%, and
    74.0%, respectively. The `DCNN` models improved accuracies to 75.1%, 77.5%, 78.2%,
    and 78.9% ([Tsukamoto et al. 2022](#ch09.xhtml#r68)).


    ### 3.3.8 Evaluation Metrics


    To evaluate `ML` and `DL` models, `accuracy`, `precision`, `recall`, `F-measure`,
    and `AUC` were considered ([Dritsas & Trigka 2022](#ch09.xhtml#r41)). Confusion
    matrix. It contains values for `true positive` (`TP`), `true negative` (`TN`),
    `false positive` (`FP`), and `false negative` (`FN`).


    `accuracy` = `(TP + TN) / (TP + TN + FP + FN)`

    `precision` = `TP / (TP + FP)`

    `recall` = `TP / (TP + FN)`

    `specificity` = `TN / (TN + FP)`

    `F-measure` = `2 * (precision * recall) / (precision + recall)`

    `AUC` = value between zero and one.


    `accuracy` serves as an evaluation metric and measures the proportion of correctly
    predicted instances. `recall`, also known as the true positive rate, measures
    the model’s ability to correctly identify participants. `precision` is a metric
    that gauges quality, whereas recall assesses the number of correctly predicted
    samples. `F-measure` is the harmonic mean of `precision` and `recall`. `AUC` measures
    the performance of the model in differentiating between classes.


    [Table 3.2] summarizes the methodologies, datasets, performance measures, and
    the future scope of research papers published in years 2022 and 2023.


    [Table 3.2] Comparison of Research Papers Published in the Year 2022, 2023


    | Author | Dataset | Models | Performance Measure | Future Scope | Result |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `Dritsas & Trigka (2022)` | Total 15 attributes used from 309 participants |
    Supervised `ML` Models (like `NB`, `BayesNet`, `SGD`, `SVM`, `LR`, `ANN`, `KNN`,
    `RotF`, `AdaBoostM`) | `RotF` gives better accuracy, `precision`, `recall` and
    `F-measure` = 97.1% and an `AUC` of 99.3% | Use of `LSTM` and `CNN` model in research
    work | Binary classification |

    | `Xu et al. (2022)` | Dataset from Affiliated Hospital of Hebei University and
    the public set (90 patients with 619 CT images) | `ISANET` used channel attention
    and spatial attention mechanisms based on `InceptionV3` | For two datasets `ISANET`
    accuracy is 95.24% and 98.14% respectively, better than other `CNN` models | Use
    of unlabelled data for classification | classification as `SCC` and `ADC` |

    | `Dwivedi et al. (2023)` | The `tcga_dataset` is used | explainable AI (`XAI`)-based
    `DL` framework (`IntegratedGradients`, `GradientsSHAP and `DeepLIFT`), an autoencoder,
    a feed-forward neural network and a biomarker discovery module | Accuracy 95.75%
    | Needs to do analysis of multi omics data | A set of 52 NSCLC biomarkers discovered
    |

    | `Nageswaran et al. (2022)` | A dataset of 83 CT images from 70 patients | Image
    processing and `ML` techniques: `ANN`, `KNN` and `RF` used for classification
    | `ANN` gives better classification performance | Classification to be done on
    more patients | Binary classification- Normal or Malignant |

