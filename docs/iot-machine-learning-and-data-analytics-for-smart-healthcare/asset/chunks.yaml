    # CHAPTER 1Applications of Blockchain in Healthcare: Review Study


    Souhayla Dargaoui, Mourade Azrour, Ahmad El Allaoui, Azidine Guezzaz, Said Benkirane,
    Abdulatif Alabdulatif and Fatima Amounas


    DOI: [10.1201/9781003430735-1](http://doi.org/10.1201/9781003430735-1)


    ## 1.1 Introduction


    The healthcare field constitutes one of the fundamental areas of activity that
    has a major impact on the international community as a whole and is intimately
    associated with each country’s level of development. In addition, this sector
    makes a major contribution to maintaining and consolidating national economic
    stability. As a result, healthcare services are at the heart of government policies
    worldwide, especially after the spread of the coronavirus in 2019.


    The efficient and safe management and gathering of the enormous volumes of patient
    health data produced by routine operations and service activities represents a
    significant challenge for medical professionals\[[1](#ch07.xhtml#r001)\]. In addition,
    medical monitoring systems based on Internet of Things (IoT)\[[2](#ch07.xhtml#r002)\]–\[[6](#ch07.xhtml#r006)\],
    including handheld equipment, are generating considerable volumes of private health
    data\[[7](#ch07.xhtml#r007)\]–\[[10](#ch07.xhtml#r010)\]. Such data are usually
    not accessible, are not standardized, and are not easy to comprehend, deploy and
    share. Furthermore, these data are sourced from numerous different sources and
    stored in centralized systems, which makes their management and exchange extremely
    difficult.


    Blockchain is a particularly attractive research topic, and various disciplines
    have been exploiting its advantages in the last few years\[[11](#ch07.xhtml#r011)\]–\[[13](#ch07.xhtml#r013)\].
    Thus, academics, designers and professionals have conceived an increasingly strong
    and powerful enthusiasm. Accordingly, new structures, new systems and multiple
    projects have emerged. The Bitcoin, the Ethereum and Hyperledger are at the forefront
    of those developments, which have all contributed to a variety of issues relating
    to the deployment of blockchain. In healthcare, adopting blockchain technology
    could offer a wide range of advantages, including improved security\[[3](#ch07.xhtml#r003)\],
    \[[5](#ch07.xhtml#r005)\], \[[14](#ch07.xhtml#r014)\]–\[[17](#ch07.xhtml#r017)\],
    stronger respect for privacy, more confidentiality and more decentralization solutions.


    The studies published to date\[[18](#ch07.xhtml#r018)\]–\[[27](#ch07.xhtml#r027)\]
    present brief overviews of the most recent developments in blockchain-based healthcare,
    and highlight both the advantages and disadvantages of the various solutions proposed
    by researchers. The aim of this research is to conduct an in-depth study of the
    available literature and identify the opportunities offered by blockchain applications
    in various healthcare services. It also examines research directions, challenges
    and future research directions in the field of blockchain-based healthcare systems.'
