    \ transfer learning. In transfer learning using little training data, an efficient\
    \ `ML` model is created by a pre-trained model, as it is very difficult to obtain\
    \ large training data. [Figure 3.3](#ch09.xhtml#f6) illustrates the generic flow\
    \ with the transfer learning model.\n\n![Figure 3.3Generic flow with the transfer\
