- raw: 'This research used NVivo 12 qualitative software to analyse secondary data.
    This chapter is split into three main sections; the first section entails the
    gathering of information (data, research papers, and other factors) in order to
    assess the effects of veganism on consumer health as well as to assess the various
    difficulties and restrictions for users. The analysis of veganism and vegan products’
    adoption, user perceptions, and insights are the main topics of the second phase.
    17216 tweets were extracted and analysed using the NVivo software tool as part
    of the data collection for this phase, which was conducted on Twitter using the
    hashtag #vegan and #veganism up until May 1, 2023. The third phase extracted a
    CSV file with keywords as “vegan and veganism” from 1686 Scopus-published studies
    and examined the data to access the global public health opinion on veganism.


    ## 6.4 Data Analysis


    The NVivo 12 qualitative software tool was used to evaluate the data that had
    been extracted. The investigation found that the users considered both the potential
    advantages and disadvantages of vegan products identifying a number of criteria.


    ### 6.4.1 Themes Identified through Twitter Analysis


    Automated topic modeling and theme recognition from text-based datasets were made
    possible by the NVivo 12 software application. The primary topics that were extracted
    from the topic of veganism by the study using NVivo have included factors (displayed
    in [Table 6.1](#ch12.xhtml#t4)) like social dynamics and family preferences, replicating
    the taste and texture of traditional chocolate, transition challenges for farmers,
    nutritional considerations, cultural- traditional significance as fur holds symbolic
    or historical value, and the use of fur may be deeply ingrained in their cultural
    practices.


    [Table 6.1](#ch12.xhtml#t4b) Various Themes Identified under Veganism


    | **S.no** || **Themes Identified** || 1: Files\\\\#Veganism –Twitter Search ~
    Twitter |


    | --- | --- | --- |


    | **1** || A: action || 93 |


    | --- | --- | --- |


    | **2** || B: animal || 71 |


    | **3** || C: chocolate || 57 |


    | **4** || D: family || 185 |


    | **5** || E: farm || 251 |


    | **6** || F: food || 77 |


    | **7** || G: fur || 52 |


    | **8** || **H: humane towards animals** || **256** |


    This interpretation of thematic analysis explained that Twitter users focused
    on veganism especially in the context of “humane towards animals” followed by
    farms love and family concerns. The top eight themes are explained in [Table 6.1](#ch12.xhtml#t4).
    The consciousness towards the animal is inclining towards the changing choices
    towards the sustainable environment.


    ### 6.4.2 Sentimental Analysis in the Twitter Platform


    In recent years, there has been a lot of research in the area of sentiment analysis
    on Twitter. At first, it concentrated on categorising opinions as either positive
    or negative on a binary scale. The extraction of up to four attitudes from text-based
    datasets is nevertheless possible with NVivo 12. Both written text and tweets
    can have their sentiment extracted using automated methods. Through the automated
    examination of vast volumes of data and the extraction of views, sentiment analysis
    can assist businesses and customers in achieving their objectives.


    [Table 6.2](#ch12.xhtml#t5b) Sentiment Analysis through Twitter


    |  || 1: Files\\\\#vegan – Twitter Search ~ Twitter |


    | --- | --- |


    | A: Very negative || 800 |


    | --- | --- |


    | B: Moderately negative || 720 |


    | C: Moderately positive || 646 |


    | D: Very positive || 212 |


    The sentiment analysis of individuals based on tweets is shown in [Table 6.2](#ch12.xhtml#t5).
    An increase has been observed in the positive and very positive perceptions of
    people towards veganism, which has gained importance in the recent past. By analysing
    the sentiment of user responses to veganism or vegan products tweets, the major
    insights into the overall perception are shown; veganism has grown up to a total
    approximation of 36.1% as per [Table 6.2](#ch12.xhtml#t5), through Twitter analysis.


    ### 6.4.3 Word Cloud and World Map for Twitter Analysis


    A technique called a word cloud creates a visual depiction of how frequently words
    and phrases were used. It is helpful for pinpointing important points to address
    when analysing data. In this study, tweets relating to veganism were examined
    using a word cloud. According to [Figure 6.1](#ch12.xhtml#f8), the word “Vegan”
    was in the word cloud’s centre, surrounded by terms for organic foods and animal
    rights. This demonstrated that the main focus of the tweets was on animal welfare,
    cruelty-free practices and the rejection of specialism. The word map analysis
    of NVivo elicits that it has a wide range of users and applications and has been
    embraced by people and organisations across the world. This illustrated that vegan
    dietary choices are highly inclined towards animals and sustainable living culture.
    The majority of the opinions drawn on Twitter about veganism belong to the United
    States, Europe, the Middle East and South Asian countries, as per [Figure 6.2](#ch12.xhtml#f9),
    which clearly demonstrated that this is a worldwide phenomenon.


    ![Figure 6.1Word cloud for Twitter analysis.](html/images/9781032551074_C006_001.jpg)


    [Figure 6.1](#ch12.xhtml#f8b)Word cloud for Twitter analysis.


    ![Figure 6.2Word map in Twitter analysis.](html/images/9781032551074_C006_002.jpg)


    [Figure 6.2](#ch12.xhtml#f9b)Word map in Twitter analysis.


    ### 6.4.4 Thematic Analysis Using Scopus Data File


    The third phase of this research paper focused on the Scopus-published study analysis.
    A CSV file is extracted from the Scopus database and exploratory research of thematic,
    sentimental and word cloud study has been conducted. [Table 6.3](#ch12.xhtml#t6)
    illustrates the twelve major areas of study in Scopus which highlighted “Vegan
    and Veganism” as keywords. The study considered food, study, diet and meat as
    focus themes of the keywords identified. This demonstrated that the research papers
    conducted in the past on veganism are highly inclined to nutrition in diet, animal
    love and food as displayed in [Table 6.3](#ch12.xhtml#t6).


    [Table 6.3](#ch12.xhtml#t6b) Thematic Analysis


    | **Themes** **identified** || Files\\\\#VeganismScopus data search |


    | --- | --- |


    | Food || 1851 |


    | --- | --- |


    | Study || 1637 |


    | Diet || 1436 |


    | Meat || 1334 |


    | Vegan || 1325 |


    | Eating || 1224 |


    | Dietary || 1022 |


    | Health || 922 |


    | Consumption || 920 |


    | Nutritional || 919 |


    | Animal || 918 |


    | Sustainable || 915 |


    ### 6.4.5 Word Cloud for Scopus Database


    The word cloud analysis interpretation identified that the focus on veganism has
    increased majorly since 2018 and is inclined towards sustainable goals, nutritious
    food and responsibility towards animals. The [Figure 6.3](#ch12.xhtml#f10) word
    cloud has picked the most related words to be animal welfare, meat, health, environment
    and vegetarianism.


    ![Figure 6.3Word cloud for Scopus database study.](html/images/9781032551074_C006_003.jpg)


    [Figure 6.3](#ch12.xhtml#f10b)Word cloud for Scopus database study.


    ### 6.4.6 Sentiment Analysis for Scopus Database


    The sentimental analysis in this exploratory study using NVivo of the Scopus database
    echoed the vegaphobic sentiments of the general public. Vegaphobia refers to the
    discrimination against vegans and vegetarians. The so-called meat dilemma can
    be used as one justification for vegaphobia. Many meat eaters dislike torturing
    animals. Maintaining bias against vegans can help meat eaters overcome this cognitive
    dissonance since vegans serve as a reminder of it. It’s possible that vegans are
    not always vilified for ideological reasons. An upright interpretation of [Figure
    6.4](#ch12.xhtml#f11) regards that approximately 36.3 per cent of the public is
    more conscious of holding a positive attitude towards veganism and health concerns
    and exhibiting their responsibility towards environmental concerns as per [Figure
    6.4](#ch12.xhtml#f11).'
