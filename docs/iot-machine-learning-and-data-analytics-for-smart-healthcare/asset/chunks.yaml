    Wearable biometric sensors that provide information on a person’s condition and
    pain have developed into crucial instruments for ongoing medical treatment. Smartwatches,
    fitness trackers, and health trackers are some of the gadgets that enable users
    to keep an eye on things like heart rate, sleep, exercise, and even blood oxygen
    levels. By combining cutting-edge sensors and analytical data, biometric devices
    can provide a more comprehensive understanding of a person’s health, empowering
    users to make decisions about their health, wellbeing, and lifestyle. For the
    early detection of changes in health, the continuous monitoring offered by wearable
    biometric equipment is particularly helpful. The technology alerts consumers and
    service providers to possible problems so they can react quickly and take preventive
    measures. These wearable gadgets’ data may be used to treat chronic illnesses,
    track health, and encourage general behavioral improvements[[7](#ch11.xhtml#r315)1].


    ## 5.9 Justice and Legitimacy


    ### 5.9.1 Consent Convention on the Collection and Use of Biometric Data

    Consent plays an important role in the collection and use of biometric data in
    healthcare. Patients sign a consent form to confirm that they are aware of how
    their biometric data will be gathered, kept, utilized, and shared. The goal of
    data gathering, any possible advantages, and any dangers or privacy issues should
    all be understood by patients[[7](#ch11.xhtml#r316)2]. Patients should be informed
    in a simple and straightforward manner about the biometrics being used, the precise
    data being gathered, the individuals having access to the data, and the privacy
    safeguards. The procedure for withdrawing consent should be explained to patients,
    along with their right to do so.


    ### 5.9.2 Evaluating the Benefits of Biometrics and Patient Autonomy

    An essential part of healthcare is assessing the advantages of biometrics and
    patient autonomy. The gathering and utilization of physical or behavioral data
    is a component of biometric solutions, which enhance clinical procedures, patient
    identity, data security, and clinical workflow. By weighing the advantages of
    biometrics against the patient’s right to control their data, it is possible to
    respect patient privacy. The challenge is to ensure that the use of biometric
    technology does not violate patient rights and privacy[[7](#ch11.xhtml#r317)3].
    Physicians should clearly explain to patients the purpose, potential, and impact
    of collecting and using biometric data so that patients can make an informed decision
    about participation.


