- raw: 'In recent years, the technology sector has undergone a real evolution. Moreover,
    it has become an indispensable tool in our daily life. Among these recent technologies,
    IoT has been continuously improved and has attracted more and more people. This
    growth has had a positive impact on many sectors, including home security, smart
    grids, etc. \[[10](#ch13.xhtml#r382)\]–\[[15](#ch13.xhtml#r387)\]. As a result,
    the number of connected devices is increasing day by day. As a type of wireless
    sensor network using technology for water quality monitoring and management, the
    use of wireless sensors on IoT network installations improves on current centralized
    systems and traditional manual methods, allowing the distributed intelligent water
    quality system to adapt to urban dynamics and heterogeneous water distribution
    infrastructures\[[16](#ch13.xhtml#r388)\]–\[[20](#ch13.xhtml#r392)\]. IoT refers
    to a new wide area network that allows any object to be connected to the internet
    in order to exchange data and be controlled remotely. This communication technology
    is used to transfer data from a physical entity to a device with intelligent analysis
    tools through a wireless channel\[[21](#ch13.xhtml#r393)\], which is designed
    to improve the protection and quality of wastewater treatment. IoT relies on connecting
    the physical environment to the internet for the purpose of monitoring and managing
    wastewater. IoT technologies are implemented with sensors to monitor water in
    connected environments. Water monitoring using IoT can overcome key barriers to
    effective water management\[[22](#ch13.xhtml#r394)\]–\[[24](#ch13.xhtml#r396)\].
    Traditional monitoring techniques can satisfy water use, efficiency, quantitative
    detection, and treatment. Therefore, storage and circumstance indicators can be
    established in sewage and wastewater treatment plants. In addition, it effectively
    controls wireless connectivity and remote monitoring of water strains, contaminants,
    water data, land use, resources, and drains. IoT water management has a huge capacity
    to provide massive processing options; environmental, structural, and ecological
    attributes of various forms of media\[[25](#ch13.xhtml#r397)\], \[[26](#ch13.xhtml#r398)\].
    Thus, it has a catalytic effect on creativity to incorporate the main decision
    of sensing technologies, including sensors, remote sensing, and others, and would
    have the advantage of controlling the commentary on the performance of water by
    developing new technologies to protect the human input.


    To better understand the architecture of the IoT ([Figure 7.1](#ch13.xhtml#f12)),
    one of its essential requirements is that the objects in the network must be connected
    to each other. That guarantees IoT system architecture operation, which connects
    the physical and virtual worlds. When designing the IoT architecture, scalability,
    extensibility, and operability of devices should be considered.


    ![Figure 7.1Architectural layers of IoT.](html/images/9781032551074_C007_001.jpg)


    [Figure 7.1](#ch13.xhtml#f12b)Architectural layers of IoT.


    The existing IoT architecture can be used for wastewater management but is better
    suited for consumer applications, where the risk impact factor is low. The IoT
    can facilitate the accurate evolution of many transactions, lead to better industrial
    waste management, and help track the waste stream without the risk of data tampering
    ([Figure 7.2](#ch13.xhtml#f13)).


    ![Figure 7.2Industry 4.0 for industrial wastewater management.](html/images/9781032551074_C007_002.jpg)


    [Figure 7.2](#ch13.xhtml#f13b)Industry 4.0 for industrial wastewater management.


    ## 7.3 The Effects of Toxic Chemicals


    The development of our societies has led to increased production of potentially
    toxic chemical molecules, spilled accidentally or not into the environment. As
    early as the 1930s, a link between air pollution and respiratory pathologies was
    established, but it was not until the early 1950s that the first scientific reports
    on the chemical contamination of food appeared. The contamination of food revealed
    by frequent health scandals awakens an increased vigilance of populations and
    health authorities. The toxicity of many food contaminants on human cells and
    organs is now better documented\[[27](#ch13.xhtml#r399)\]–\[[29](#ch13.xhtml#r401)\].
    The toxic effects of chemical contaminants on marine organisms depend on bioavailability
    and persistence, the ability of organisms to accumulate and metabolize contaminants,
    and the interference of contaminants with ecological, metabolic or specific processes.
    A wide range of toxicity tests has been developed in recent years to allow rapid
    and accurate screening for the toxic effects of chemicals ([Figure 7.3](#ch13.xhtml#f14)).
    Toxicity is also found in plastics that are rarely biodegradable. They are usually
    fragmented into huge quantities of macro, micro, and nanoparticles by different
    processes and in natural conditions, which makes them ubiquitous and dangerous
    pollutants for the environment worldwide\[[30](#ch13.xhtml#r402)\].


    ![Figure 7.3Chemical sensor array.](html/images/9781032551074_C007_003.jpg)


    [Figure 7.3](#ch13.xhtml#f14b)Chemical sensor array.


    ## 7.4 The Evolution of Water Biosensing Techniques


    L. Campanella et al.**\[**[31](#ch13.xhtml#r403)\] proposed an algal biosensor
    for the evolution of toxicity in estuarine waters. The sensor was obtained by
    coupling an adapted algal bioreceptor (the cyanobacterium spirulina subsalsa)
    to an amperometric electrode with a gas diffusion. The analysis that was done
    allowed us to follow the evolution of photosynthetic O[2] and the detection of
    alterations due to toxic effects caused by environmental pollutants present in
    the environment. Four chemical species representatives of three main classes of
    pollutants (heavy metals, triazine herbicides, carbamate insecticides) were tested
    at different concentrations using standardized natural water as an experimental
    medium. In all cases, a toxic response was detected; that is, a dose-related inhibition
    of photosynthetic activity was recorded with good reproducibility. The automated
    system developed in this study monitored the photosynthetic activity of an appropriate
    bioreceptor in the absence and pre of toxic agents, recording the oxygen produced
    with a lifetime of at least two days. In the presence of toxic agents, reproducible
    dose-dependent responses were detected. The proposed biosensor was highly sensitive
    to atrazine and showed intermediate sensitization to carbaryl, while toxicity
    detection in the case of heavy metals was slow. This could be due to biological
    factors related to the adsorption characteristics of the cell walls as well as
    the specific sequestration, metabolization, and release pathways of the algal
    species used.'
