- raw: 'The online water quality management system (OWQMS), as proposed by Shumei
    Wang et al.\[[32](#ch13.xhtml#r404)\] is one of the main components of the environmental
    Internet of Things (IoT), including an online water quality monitoring subsystem,
    by implementing a digital data transmission subsystem and data processing elements,
    to manage an urban tourist river. Including the input of reclaimed domestic wastewater
    and fresh surface water from the Xinglin channel to maintain the water level of
    the river, and the water cycle of the landscape to stabilize the water quality
    that was examined. Then they showed that no water deterioration was detected throughout
    the period, and it was proved that the OWQMS system was effective in managing
    the scenic river and maintaining the water quality of the landscape stable over
    the past four years. The treatment performance showed results that suggest that
    the campus wastewater treatment plant was effective in degrading organic carbon,
    and for ammonia nitrogen, due to mixing with the laboratory wastewater, the influent
    was kept relatively low with the wastewater and a relatively low concentration
    in the range of 1.27–12.33 mg L^(\-1). This allows the authors to find that the
    OWQMS system was effective in managing the scenic river and maintaining stable
    water quality. Strong self-purification in the water body on pollutants, especially
    nitrogen and phosphate degradation, was observed, while water deterioration was
    not detected throughout the period. The reclaimed wastewater should be treated
    in the wetland before being observed in the campus river. The results are shown
    after treatment in the wetland. Various water quality parameters reached the standard
    demand, which suggests that the recycling of river water is an effective way to
    stabilize the quality of the river in the future.


    Due to the population growth, urbanization of rural areas, and excessive use of
    marine resources for salt extraction, the depletion of water resources becomes
    critical, prompting Varcha Lakchmikantha et al.\[[33](#ch13.xhtml#r405)\] to propose
    an intelligent system to monitor water quality. This system is composed of sensors
    that allow measuring the values in real-time, accompanied by an Arduino ATMEGA
    328 software that can convert the analog values to digital values with an LCD
    screen that displays the outputs of the sensors. The connection was ensured by
    the Wi-Fi module between the hardware and the software. They showed that after
    testing the three water samples and depending on their results, they were able
    to classify the water as potable or not, hence they recommended the use of these
    sensors in order to detect various quality parameters, use wireless communication
    standards for better communication and IoT to create a better monitoring system
    in the reason of making safe by an immediate response.


    Marielle Thomas presented in her research thesis a new biological detection process.
    Its principle is based on the automatic characterization of electrical signals
    by a tropical fish. This work dealt with the influence of several physicochemical
    parameters (temperature, pH, conductivity, and dissolved oxygen) on the characteristics
    of the studied material concerning six polluting substances. The implementation
    of this new process allowed the detection in less than 35 minutes\[[34](#ch13.xhtml#r406)\].


    ## 7.5 Conclusion


    The current research is based on water pollution, which is treated as a high threat
    to the world, as it affects health and the economy and spoils biodiversity. So,
    in this work, the causes and effects of water pollution are all discussed based
    on a literature review of works that have adopted different water monitoring techniques,
    and which are IoT-based methods for water quality have been addressed. Although
    there have been many excellent smart water quality monitoring systems, the research
    area is still challenging. This work presents examples of recent work done by
    researchers to make water quality monitoring systems intelligent and also that
    can be more effective for detecting water toxicity. These systems are characterized
    by low power, so monitoring is continuous, and alerts/notifications are sent to
    the concerned authorities for further processing. These systems have shown high
    efficiency for water detection.


