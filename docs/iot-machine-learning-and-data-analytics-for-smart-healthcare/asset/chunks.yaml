    to its decentralized, distributed and secure characteristics. Indeed, as the system
    is decentralized, it does not require a central administration to govern it. Data
    storage is based on a process of mutual agreement between the various nodes, using
    a consensus algorithm. Blockchain provides an answer to the problems posed by
    different solutions for centrally securing the rescue and sharing of data in cloud
    computing.


    ## 1.3 Related Work


    Blockchain is a crucial invention that has a significant purpose in today’s commerce
    world. It refers to a digital record of repetitious transactions diffused throughout
    a network. It may be used as a storage and sharing data system that is difficult
    to be altered or hacked. Recently, blockchain technology has been widely used
    in several domains; one of the most attractive fields to use this technology is
    healthcare. Regarding the application situations there are three types of blockchain
    use cases in smart healthcare systems. The recording and security of data are
    the first type. The second one is the combination of `IoMT` with blockchain. The
    third option is to use blockchain instead of the central institution of federal
    learning. In the last few years, so many review studies of blockchain applications
    in healthcare have been published. In [[23](#ch07.xhtml#r023)] Pranto Kumar Ghosh
    et al. provided a review of the current papers that consider the applications
    of blockchain technology in the healthcare industry. The review summarizes 144
    research papers that illustrate the significance and highlight the limitations
    of this technology in this field. At first, the authors present an exhaustive
    background of blockchain and its characteristics. Then they focus on affording
    the literature survey of the nominated papers that highlight the present themes
    in blockchain-enabled smart healthcare. Additionally, they present the solutions
    offered by the blockchain in several application zones. Finally, the authors present
    the issues and future research directions.


    Similarly, Sadia Ramzan [[32](#ch07.xhtml#r032)] et al. presented an overview
    of blockchain-based healthcare. Firstly, an extensive introduction, history, background,
    and blockchain kinds were presented. Then, this technology’s motivations and healthcare
    services completed using it have been covered. The paper demonstrates the potency
    of blockchain, identifies its challenges and highlights future research directions.
    To examine recent research in this domain Valeria Merlo et al. also provided a
    review that focuses on blockchain utilizations in real situations[[33](#ch07.xhtml#r033)].
    They prove that the open research issues are data security and the realization
    of electronic health records and diagnosis systems.


    Suruchi Singh et al. afford a review[[34](#ch07.xhtml#r034)] that explains how
    blockchain technology may boost medical record administrations and maintain the
    integrity and privacy of patient’s data. They presented a wide range of applications
    using this technology, highlighting its implementation benefits, especially in
    healthcare data management. Then they discuss various remarkable challenges which
    tardy this techno approbation in such domains. Eventually, they suggested numerous
    other points for examination. In [[35](#ch07.xhtml#r035)] Mohammad Salar Arbabi
    et al. give an in-depth overview of the state of blockchain-enabled healthcare
    solutions using a framework for systems classification and analysis. The authors
    examine over 40 provided solutions and categorize each one based on functional
    components, advantages, and issues. There is so much research that reviews the
    recent development of blockchain-based healthcare solutions[[36](#ch07.xhtml#r036)]–[[40](#ch07.xhtml#r040)].


    ## 1.4 Research Methodology


    In this section, we outline the steps ([Figure 1.1](#ch07.xhtml#f1)) followed
    to collect the literature required in the present survey.


    ```

    ![Figure 1.1The steps followed for literature review.](html/images/9781032551074_C001_001.jpg)

    ```


    [Figure 1.1](#ch07.xhtml#f1b)The steps followed for literature review.


    As the first process in the review study, we determined three questions to be
    resolved in this study, in line with the goal to be achieved, which is to determine
    the state of research on blockchain technology applications in healthcare services.
    Accordingly, the questions employed to identify articles appropriate to the aims
    of this study are as follows:


    *   What are the latest published works that deal with the application of blockchain
    on the healthcare subject?

    *   What are the different purposes of blockchain applications in healthcare management?

    *   What are the challenges and issues of blockchain applications in healthcare
    management?


    With a view to producing ideal search queries, a number of measures have been
    suggested in [[41](#ch07.xhtml#r041)]–[[43](#ch07.xhtml#r043)] to subdivide search
    queries, namely by distinguishing certain criteria, including search groupings,
    abbreviations and variant spellings, which are combined by means of Boolean operators.


    The various steps involved in achieving the final result of the process line are
    outlined in the following sections:


    *   Select the abstract and related words within the paper.

    *   Building search queries based on logic operators such as `OR`, `AND`, or `NOT`.

    *   Find keywords, terms, abbreviations and synonyms.

    '
