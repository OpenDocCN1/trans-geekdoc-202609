    # 第 3 章 使用深度学习技术探索肺癌病理


    Swapnali Patil 和 D. Lakshmi


    DOI: 10.1201/978103430735-3


    ## 3.1 引言


    在全球，主要的公共健康问题是癌症。历史上，癌症是一种致命性疾病。即使在今天技术进步的时代，如果不能早发现，癌症仍然是毁灭性的。如果及早发现，可以挽救许多生命。癌症有许多不同类型，但肺癌是死亡率最高的癌症（癌症统计）。](#ch09.xhtml#r136）早期发现肺癌对提高生存率很有帮助。它还能节省生命、时间和资金。85%的肺癌病例是由长期使用烟草引起的。每五分之一到十分之一的病例包括从不吸烟的人（WHO
    世界卫生组织数据库，2023).


    肺癌主要分为小细胞肺癌（SCLC）和非小细胞肺癌（NSCLC）。NSCLC 占肺癌病例的 85%。NSCLC 还可进一步主要分为腺癌（ADC）、鳞状细胞癌（SCC）和大细胞癌（LCC），分别约占
    40%、30%和 15%（肺癌类型）。


