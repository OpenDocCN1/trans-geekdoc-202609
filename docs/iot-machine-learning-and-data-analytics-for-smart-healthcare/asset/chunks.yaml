    # 第 2 章 用于医疗管理的深度学习


    Ankush Verma, Amit Pratap Singh Chouhan, Vandana Singh, Sanjana Koranga 和 Mourade
    Azrour


    DOI: [10.1201/9781003430735-2](http://doi.org/10.1201/9781003430735-2)


    ## 2.1 引言


    人工智能（AI）是指模拟人类行为或思维的机器智能，这些机器可以通过专门编程和训练来解决某些挑战[[1]–[[4]]。AI 是机器学习和深度学习技术的强大结合。AI
    模型基于海量数据集构建，能够生成智能决策。多年来，人工智能已应用于各个领域，如医疗[[5]–[[8]],能量[[9]–[[12]],农业[[13]–[[15]],安全[[16]–[[20]],营销[[21]],交通[[22]],水资源管理[[23]–[[27]]等。


    在医疗领域，AI 正在通过对大量数据进行感知、处理和分析来迅速改变该行业，以改善患者效果、降低成本并加速流程。AI 已被应用于医疗管理的多个领域，从临床决策到行政任务。AI
    正在被利用在该领域实施高性能、可靠的创新，这将有助于妥善管理为患有慢性疾病（特别是糖尿病、癌症、进食障碍或心脏病）的患者提供的护理。事实上，在分析和做出某些临床决策方面，AI
    与传统方法相比具有许多优势。得益于 AI 算法，随着训练数据的吸收，设备变得更加准确，帮助人类更好地理解治疗、护理过程、诊断以及临床结果的多样性。


    AI 正在快速应用于医疗管理，在改善患者护理的同时降低费用。AI 系统可以分析海量数据、发现趋势并生成预测，协助医疗提供人员做出智能决策。电子健康记录（EHR）是最应用之一。EHR
    可用于患者进展、预测结果并提供个性化治疗方案。通过分析 EHR 数据，医疗提供人员可以识别风险患者并进行早期干预。此外，AI 驱动的 EHR 系统可以自动化调度和账单等行政任务，减轻医疗人员的负担。这使得人员能够更加关注患者护理，提高医疗服务的整体质量。


    人工智能与医疗管理的整合具有改变医疗交付方式的。随着技术的不断演进，AI 的作用可能会不断扩大，从而带来更高效、有效的医疗系统。本章将探讨 AI 在医疗管理中的各种应用，以及面临的挑战与机遇。


