    ## 3.4 讨论


    癌症是身体少数细胞发生破坏性增殖并扩散到其他器官的疾病。细胞通常通过细胞分裂生长和延伸，产生新细胞以修复旧的和受损的细胞。然而，这种机制会被破坏，导致异常细胞不受控地生长，形成可能是恶性的肿瘤。肺癌是一个大问题，因为其存活率低，而且通常在后期才发现。尽管技术取得了许多进步，使用机器学习
    (ML) 和深度学习 (DL) 早期检测肺癌仍然是一个活跃的研究领域。在本文中，我们回顾了用于肺癌早期检测 ML 和 DL 模型。DL 算法在分析大量数据具有巨大潜力。DL
    和 ML 模型的融合显示出更高的准确性。


    DL 模型协助病理学家和医生通过缩短将肿瘤分类为恶性或良性的时间，并为扩展性提供更好的支持来提高效率。**我们需要考虑的问题是：** 模型性能取决于数据的可用性和质量。这些肺癌的自动预测系统容易产生假阴性结果，这在医学领域是一个大问题。在医学诊断中使用
    DL 带来了关于患者隐私和数据安全的伦理关注。技术的更好选择取决于几个因素：收集收集的数据类型、数据样本的数量以及时间限制。根据许多研究人员的发现，总结是：多维异构数据的整合，结合特征选择和分类的不同方法，为肺癌疾病的推断提供了宝贵的工具。


    ## 3.5 结论


    DL 在探索肺癌诊断和早期预测方面发挥着重要作用。数据被接受了……


