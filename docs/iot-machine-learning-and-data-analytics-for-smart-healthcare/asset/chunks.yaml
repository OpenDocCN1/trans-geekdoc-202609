    素食饮食对全性植物食物的强调也促进了纤维摄入的增加并降低了饱和脂肪的摄入，有助于提高整体健康（Fresán & Sabaté, 2019）。定量研究解释了人们以何种频率或何种方式进行行为。定性研究则不可替代，因为它拓宽或深化了研究对于社会世界中事物如何变成如今的理解。


    Twitter（现称为 X）是一个广为人知的社交网络平台，可以通过发送名为“推文”的简短信息与其粉丝互动。对于企业、个人和组织而言，它是与其受众互动以及参与重要话题讨论的很有用的工具。它全球每月有超过
    3.3 亿活跃用户。由于 Twitter 具有标签和转推等独特功能，用户可以快速发现并加入各种话题的对话。因此，该平台上现在有了活跃的社区，用户可以在那里与志趣相投的人互动并交流想法。对于试图开发品牌并与目标受众互动的公司和组织来说，Twitter
    是一个强大的工具（Twitter, 2021）。企业可以通过发布相关材料、回答客户问题以及参与相关对话，在平台上培养忠实的粉丝，并推销自己为所在领域的思想领袖。因此，Twitter
    可被视为一个极具影响力的平台，并为每个用户提供了表达想法的机会。以此作为 Twitter 的核心优势，可以使用主题分析、情感分析和词云分析进行探索性研究。通过
    `NVivo` 可以准确地识别、获取和衡量这些用户的潜在观点。`NVivo` 由 QSR International 开发，用于定性数据分析，以检查内容和叙述分析（QSR
    International, 2021）。


    Scopus 是全球最大的摘要索引数据库。需要注意的是，该数据库以约 8% 的复合年增长率（CAGR）持续增长（Elsevier, 2021）。目前，该数据库包含超过
    810 万条记录。调查 Scopus 数据文件可以研究研究趋势和发表论文的结果，并作为探索性定性研究。


    ### 6.1.1 素食主义的演变


    素食主义的演变是一个迷人的课题，展示了素食运动随时间的发展和转型。以下是素食主义演变的关键阶段和里程碑的概述：


    - **起源与早期影响：** 素食主义的根源可以追溯到古代文明，某些宗教和哲学传统提倡素食或植物性饮食。1945 年，“vegan”（素食）一词首次由 Donald
    Watson 和一组在英国成立素食协会的素食者使用。他们采用了一种禁止使用任何动物产品（如乳制品和蛋）的生活方式，以与素食者区分开来。

    - **伦理基础与动物权利：** 动物权利意识和伦理问题长期以来一直是素食主义的核心。Singer (1975) 的著作《动物解放》和 Adams (1990)
    的著作《肉类的性政治》等具有影响力的出版物激发了人们对素食主义作为一种改善动物福利策略的更广泛意识和行动，这进一步推进了反对剥削动物的伦理论证。

    - **环境关切：** 由于公众对气候变化和资源枯竭等环境挑战的意识日益增加，素食主义的环境优势近年来获得了更多关注（Scarborough et al.,
    2014; Aleksandrowicz et al., 2016）。素食主义在减少温室气体排放、森林砍伐和水污染方面的贡献在畜牧业环境影响的研究中得到了关注，特别是联合国《畜牧业的阴影》（2008）报告。

    - **健康与福祉：** 与计划良好的素食饮食相关的健康益处对素食主义的演变也发挥了重要作用（Dinu et al., 2017; Tuso et al.,
    2013）。根据科学研究，均衡的素食饮食可以提供所有必需营养，同时降低患心脏病、肥胖和二型糖尿病等慢性病的概率（Bhagat and Ravi, 2018）。由于这些证据，植物性饮食在想要增强健康的人中变得越来越流行（Craig
    & Mangels, 2009; Huang et al., 2016）。

    - **主流认可与行业反应：** 主流文化对素食主义变得有了更多的意识和接纳。由于消费者需求的增长和市场趋势，素食选择和商品现在在杂货店、餐厅和快餐连锁店变得更加容易获得（Harrison
    et al., 2018; Mintel, 2021）。社交媒体和在线网络的发展也通过允许人们交流信息、支持和食谱，帮助了素食主义的传播（Bryant &
    Barnett, 2019; Ruby et al., 2018）。

    - **交叉性与社会正义：** 鉴于多种压迫的交叉性，素食主义近期与更大的社会正义运动交织在一起。通过强调动物权利、人权和环境正义之间的联系，活动人士推动了一种更具包容性和公平性的素食主义，考虑了结构性问题（Adams,
    2010; Harper, 2018）。

    - **技术进步：** 技术发展也促进了素食主义的发展。Beyond Meat 和 Impossible Foods 等植物肉类的引入了关注，并增加了转向素食饮食的人的选择。由于这些进步，传统的动物产品与其植物替代品之间的区别变得更加模糊（Saxena,
    2020; Sze et al., 2020）。创新是素食产品增长的重要因素。公司不断寻找新方法来开发传统动物源产品的植物替代品，以模仿其味道、口感和营养特性。这包括新成分的创造、复杂的工艺以及科学发现与烹饪知识的结合。创新的植物性零食、会流血的植物肉堡以及具有丰富味道和奶油口感的无奶替代品，只是该领域取得的一些创新进步的例子（Krzywonos
    & Piwowar, 2022）。


