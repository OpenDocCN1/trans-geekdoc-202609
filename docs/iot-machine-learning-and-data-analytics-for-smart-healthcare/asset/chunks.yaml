    | Remote Patient Monitoring || AI can remotely monitor patients via wearable devices
    and other sensors, informing healthcare personnel to any changes in the patient’s
    condition and assisting with early diagnosis and intervention. || \[[49](#ch08.xhtml#r108)\]–\[[52](#ch08.xhtml#r111)\]
    |


    | Clinical Decision Making || AI can assist healthcare providers in making clinical
