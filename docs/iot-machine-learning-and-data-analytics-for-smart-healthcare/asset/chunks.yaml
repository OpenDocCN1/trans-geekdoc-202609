    该研究论文提供了关于使用 `CNN` 对三种最常见的肺癌类型进行分类的信息。为了分类，训练并优化了多种 `CNN` 架构，如 `VGG16`、`InceptionV3`
    和 `InceptionResNetV2`。在各种架构中，`InceptionV3` 在训练集上给出了更优分类准确率，因此它被用于测试集。论文中的结果强调了
    `CNN` 图像分类模型的局限性（Kriegsmann et al. 2020）。


    提出了一种用于早期检测肺癌肺结节的新型 `CADe` 系统。该方法包括原始数据的预处理、特征提取、提取特征的优化，以及最后基于优化后的特征向量进行分类。对于相关的特征选择，它使用了迁移学习技术。该新型
    `CADe` 系统的准确性已通过测试，结果在肺癌早期检测中显示出良好的前景（Hekal et al. 2021）。


    进行了代谢组学研究以识别用于肺癌诊断的代谢物生物标志物。使用快速相关滤波（`FCBF`）技术确定代谢生物标志物特征的重要性。将六种不同的 `ML` 算法应用于生物标志物特征以早期检测肺癌。在六种不同的
    `ML` 算法中，`NB` 显示出更高的准确率（Xie et al. 2021）。


    ### 3.3.7 混合模型


    混合模型或融合模型是多种组合以改进结果，而集成模型是多种方法的结合。混合 `ML` 和 `DL` 模型可以作为支持临床决策的工具。混合模型可以整合成像和非成像数据，并分别应用
    `DL` 和 `ML` 模型。


    研究目的是对 CT 图像进行新的定量特征分析。然后研究了其在预测术后 I 期非小细胞肺癌（NSCLC）患者复发风险中的作用，结合两个基因生物标志物，即切除交叉互补
    1 基因的蛋白表达和核糖磷酸还原酶亚基（`RRM1`）。使用计算机辅助检测（`CAD`）技术分离肺肿瘤。在胸部 CT 图像上计算的肿瘤相关图像属性、基于图像特征的朴素贝叶斯网络分类器以及利用基因生物标志物的
    `MLP` 分类器经过训练，以预测术后癌症复发。两个分类器提供的预测分融合极大提升了预测性能（Emaminejad et al. 2015）。


    提供了一个 `DNN` 模型和使用云系统收集的数据用于划分肺病阶段，以分类肺肿瘤进展的不同阶段。作为 PET/CT 图像的融合方法，建议系统使用了托管在云端的肺肿瘤检测器和阶段分类器（`Cloud-LTDSC`）。建议的
    `Cloud-LTDSC` 使用主动轮廓模型进行肺肿瘤分割，并设计且验证了多层卷积神经网络（`M-CNN`）用于识别不同肺癌阶段，使用了标准基准图像（Kasinathan
    & Jayakumar 2022）。


    在该研究中，使用了 `DCNN` 模型如 `AlexNet`、`GoogLeNet`、`VGG16` 和 `ResNet50` 来分类 `ADC`、`SCLC`
    和 `SCC`。应用了 `SVM`、`RF` 和 `NN` 等 `ML` 模型。`DCNN` 模型的准确率分别为 74.0%、66.8% 和 74.0%。`DCNN`
    模型将准确率提高到 75.1%、77.5%、78.2% 和 78.9%（Tsukamoto et al. 2022）。


    ### 3.3.8 评估指标


    为了评估 `ML` 和 `DL` 模型，考虑了 `accuracy`（准确率）、`precision`（精确率）、`recall`（召回率）、`F-measure`（F
    值）和 `AUC`（Dritsas & Trigka 2022）。混淆矩阵。它包含真阳性（`TP`）、真阴性（`TN`）、假阳性（`FP`）和假阴性（`FN`）的值。


    `accuracy` = `(TP + TN) / (TP + TN + FP + FN)`

    `precision` = `TP / (TP + FP)`

    `recall` = `TP / (TP + FN)`

    `specificity` = `TN / (TN + FP)`

    `F-measure` = `2 * (precision * recall) / (precision + recall)`

    `AUC` = 0 到 1 之间的值。


    `accuracy` 作为一种评估指标，衡量了正确预测实例的比例。`recall` 也称为真阳性率，衡量模型识别样本的能力。`precision` 是衡量质量的指标，而
    `recall` 评估了正确预测样本的数量。`F-measure` 是 `precision` 和 `recall` 的调和平均数。`AUC` 衡量模型区分类别的性能。


    表 3.2 总结了 2022 年和 2023 年发表论文的方法论、数据集、性能指标和未来范围。


    表 3.2 2022 年、2023 年发表论文的比较


    | 作者 | 数据集 | 模型 | 性能指标 | 未来范围 | 结果 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `Dritsas & Trigka (2022)` | 309 名参与者的共 15 个属性 | 监督 `ML` 模型（如 `NB`、`BayesNet`、`SGD`、`SVM`、`LR`、`ANN`、`KNN`、`RotF`、`AdaBoostM`）
    | `RotF` 提供了更好的准确率、精确率、召回率和 F 值 97.1%，`AUC` 为 99.3% | 研究中使用 `LSTM` 和 `CNN` 模型
    | 二分类分类 |

    | `Xu et al. (2022)` | 河北大学附属医院和公共数据集（90 名患者，619 张 CT 图像） | `ISANET` 使用了基于 `InceptionV3`
    的通道注意空间注意力机制 | 对于两个数据集，`ISANET` 的准确率分别为 95.24% 和 98.14%，优于其他 `CNN` 模型 | 分类为 `SCC`
    和 `ADC` |

    | `Dwivedi et al. (2023)` | 使用 `tcga_dataset` | 可解释人工智能 (`XAI`) 基的 `DL` 框架（`IntegratedGradients`、`GradientsSHAP`
    和 `DeepLIFT`）、自动编码器、前馈神经网络和生物标志物发现模块 | 准确率 95.75% | 需要分析多组学数据 | 发现了 52 个 NSCLC
    生物标志物 |

    | `Nageswaran et al. (2022)` | 70 名患者 83 张 CT 图像 | 图像处理和 `ML` 技术：用于分类的 `ANN`、`KNN`
    和 `RF` | `ANN` 提供了更好的分类性能 | 在更多患者身上进行分类 | 二分类 - 正常或恶性 |

