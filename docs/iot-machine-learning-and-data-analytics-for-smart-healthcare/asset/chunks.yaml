    users can interact and exchange ideas with people who have similar interests.
    For companies and organisations trying to develop their brand and interact with
    their target audience, Twitter is a potent tool ([Twitter, 2021](#ch12.xhtml#r371)).
    Businesses may develop a devoted following on the platform and promote themselves
    as thought leaders in their field by publishing pertinent material, answering
    customer questions, and taking part in pertinent conversations. Hence Twitter
    can be considered a most influential platform and gives an opportunity to every
    user to shout out their thoughts. With this as a key advantage in Twitter, exploratory
    research can be conducted using thematic, sentimental and word cloud analysis.
    These potential perspectives of the users can be identified, accessed and measured
    accurately by using NVivo. NVivo was developed by QSR International for qualitative
    data analysis to examine the content and narrative analysis ([QSR International,
    2021](#ch12.xhtml#r360)).


    Scopus is the largest Abstract and Indexing database worldwide. It is important
