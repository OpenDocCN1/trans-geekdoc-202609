- raw: 'Thanks to the elaborate search sequence, significant research articles were
    examined. To achieve this goal, we only consulted the main databases containing
    scientific publications, such as IEEE XPLORE, Science Direct, Springer, Taylor
    & Francis and MDPI. Taking these different sources as our starting point, we selected
    15 research documents in particular.


    ## 1.5 Results and Discussions


    *   What are the latest published works that deal with the application of blockchain
    on the healthcare subject?


    *   What are the different purposes of blockchain applications in healthcare management?


    In this sub-section, we discuss the reasons that encourage blockchain usage for
    data management in the healthcare field; as well, we present various purposes
    of blockchain applications in this domain.


    Nowadays, many aspects support the use of blockchain technology in data management.
    First of all, thanks to IoT, and in particular Internet of Medical Things (IoMT),
    equipment essentially collects information via sensors\[[44](#ch07.xhtml#r044)\].
    So, there has been an exponential increase in the number of sensors, opening the
    way to the creation of global sensor networks requiring a new, high-performance
    data management system\[[45](#ch07.xhtml#r045)\]. What’s more, this infrastructure
    instantaneously produces highly heterogeneous datasets, leading to the development
    of what is known as Big Data. Nevertheless, conventional data processing approaches
    are insufficiently adaptable to handle the huge volumes of data, requiring the
    development of a more rigorous data processing system. Finally, legacy data management
    tools based on client/server exchanges, which are now employed in the healthcare
    and IoT sectors, are vulnerable to occasional failures. In addition, the architectures,
    protocols and procedures of distributed networks are unable to cope with new constraints
    and meet constantly changing service expectations. Furthermore, information stored
    on different servers is frequently unencrypted, posing a real security risk, whereas
    blockchain-based systems employ data storage mechanisms using multiple encryption
    modes. Finally, in the case of IoT-enabled systems, both online and offline transactions
    are carried out, which traditional data management methods find difficult to address\[[46](#ch07.xhtml#r046)\].
    Consequently, it was necessary to design a new data management model capable of
    guaranteeing data communication in small packets, which does not require high
    bandwidth.


    ### 1.5.1 Patient Data Storage


    Patient data refers to the content of a given patient’s medical records. Such
    data may include information relating to past and present health or illness, treatment
    history, lifestyle habits and genetic characteristics\[[47](#ch07.xhtml#r047)\].
    It may also include biometric data, i.e. any physical characteristic that can
    be measured by a machine or computer. Therefore, the volume of privately generated
    data increases day after day, making their storage in a secure manner a new issue.
    Hence, healthcare providers resort to the usage of blockchain. In addition, blockchain
    is capable of building a reliable and secure storage infrastructure. Medical archive
    records management is simply the basic process of adding, deleting, modifying
    and querying. Nevertheless, with blockchain, the two core archival information
    processing operations of deleting and modifying are no longer necessary, reducing
    the amount of information that needs to be processed. The technical design of
    the blockchain provides assurances of irreparability and data security. Furthermore,
    within blockchain, each information block registers the creation time and the
    previous block’s hash value\[[48](#ch07.xhtml#r048)\].


    ### 1.5.2 Medical Image Sharing


    Sharing medical images involves the electronic exchange of medical images between
    hospitals, doctors’ practices and patient groups. Contrary to traditional media,
    notably CDs or DVDs, that patients either carry around with them or receive by
    post, the new technology currently facilitates the exchange of these images via
    cloud computing\[[49](#ch07.xhtml#r049)\].


    Sharing images thanks to the blockchain is possible either through public sharing
    or through private sharing. In a public blockchain, the transaction details of
    a patient are added to the blockchain, allowing other healthcare systems to visualize
    that patient’s medical images\[[50](#ch07.xhtml#r050)\]. However, in a private
    blockchain, individual members as well as organized groups can be authorized to
    consult a patient’s medical images. With blockchain, transactions between providers
    are carried out independently of any third party. Allowing healthcare providers
    and patients respectively to transfer and upload their data using the blockchain
    network, every member has access to a universally accessible, secure, real-time
    dataset. The blockchain delivers a collaborative disease diagnosis solution, with
    full access to all medical imaging data available for a patient\[[51](#ch07.xhtml#r051)\]–\[[53](#ch07.xhtml#r053)\].
    This can definitely allow more accurate detection and improved treatment of diseases\[[54](#ch07.xhtml#r054)\].


    ### 1.5.3 Patient Monitoring


    Blockchain technology gives medical service managers access to equipment tailored
    to their needs\[[55](#ch07.xhtml#r055)\]–\[[57](#ch07.xhtml#r057)\]. At the same
    time, doctors are likely to spend more time monitoring patient progress and intervening
    remotely when any health-related issues arise. Blockchain technology and the healthcare
    system offer the possibility of monitoring temperature conditions at any time
    of the day, as well as checking bed utilization and the correct availability of
    medication. Blockchain maintains a healthcare service network that aims to implement
    consistent digital identification for healthcare organizations and healthcare
    service providers. The combination of blockchain and IoT technologies improves
    the speed of response and transparency of the supply chain, enabling healthcare
    logistics to run more smoothly and ensure effective patient monitoring\[[58](#ch07.xhtml#r058)\],
    \[[59](#ch07.xhtml#r059)\].


    *   What are the challenges and issues of blockchain applications in healthcare
    management?


    Blockchain technology is being integrated into the healthcare sector, for which
    particular difficulties would have to be taken into account. The main obstacle
    to the implementation of this advanced technology by medical structures lies in
    the lack of **expertise**. Indeed, the development of blockchain applications
    is still very recent and researching and implementing new technologies requires
    considerable effort. However, this system is applicable to medical organizations
    as well as to the requirements of supervisory authorities. Therefore, medicine
    and healthcare is likely to be faced with **standardization** problems. International
    standards authorities would certainly need to provide a certain set of well-authenticated
    and certified standards. The time has come for the healthcare sector to make improvements.
    It is highly likely that the use of blockchain will become widespread in the healthcare
    world in the future. This technological innovation will contribute to the growth
    of healthcare applications, not least by making it easier to explain the effects
    and progress of treatment protocol. Indeed, blockchain technology is essential
    for confirming **transactions and information transfers**.


    Managing **storage** capacity is one of the challenges facing the use of blockchain.
    Indeed, blockchain was initially specified for storing and exploiting transaction
    data, which is restricted in scope, so that its storage does not require a large
    amount of data. However, as it expanded into healthcare services, storage issues
    obviously appeared.'
