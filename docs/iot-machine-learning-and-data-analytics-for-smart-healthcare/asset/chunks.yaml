    # CHAPTER 6 Analysing the Ascendant Trend of Veganism: A Comprehensive Study on
    Sustainable Choices


    Shikha Bhagat, Shilpa Sarvani, Ravi Rai


    DOI: [10.1186/s40537-021-00553-4](https://doi.org/10.1186/s40537-021-00553-4)


    ## 6.1 Introduction


    A vegan is someone who generally avoids animal products and does not consume any
    food made from animals, often for ethical, spiritual, or health-related reasons.
    Vegans are people who don’t even use anything from leather, feathers, etc. It
    has emerged as a prominent social and movement that has gained traction in recent
    years. With its roots deeply embedded in ethical considerations, environmental
    concerns, and personal health, veganism represents a lifestyle choice that aims
    to exclude the consumption and use of animal products in all aspects.


    There are various reasons why someone can decide to become vegan:


    *   To cease funding the meat business while they continue to horrendously butcher
    our farm animals.

    *   For the sake of health (eating meat can lead to heart disease, diabetes, and
    high cholesterol).

    *   To protect the environment (factory farming is one of the main causes of global
    warming).


    Additionally, there are always people who act in a certain way because it is the
    norm.

