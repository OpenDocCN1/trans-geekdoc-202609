    本章其余部分的结构如下：在第二节中，我们提供了关于传统医疗系统和区块链的背景信息。在第三节中，介绍了已发表的相关。在第四节中，我们描述了本章采用的研究方法。第五节用于展示获得的结果及其讨论。最后一节对本章进行总结。


    ## 1.2 背景


    ### 1.2.1 传统医疗系统


    健康数据处理是保护和处理患者登记的基本要素，旨在提供更有效的护理、高效追踪病理及其起源、为研究提供足够的医疗数据、开发新型且更有效的药物，并最终建立完善的预防体系。医院和医疗机构目前使用基于客户端/服务器架构的本地管理应用程序来管理患者医疗数据。然而，这些应用程序之间不共享数据，导致当专业人士和患者需要获取连贯的病史时，难以建立准确诊断。为了解决这个问题，研究人员和工业界设计了云端应用程序。虽然这些应用程序允许患者在云数据库中存储重要的医疗记录，但也带来了安全、数据丢失和隐私问题[28]–[31]。


    ### 1.2.2 区块链


    区块链概念最早由比特币（第一种加密货币）的创造者 Satoshi Nakamoto 提出[19]。区块链是一种同时存储和传输交易的技术。它允许将一组数据块存储在交易账中。每个区块都与其前身关联，以形成一系列区块。在这种背景下，点对点网络保证了信息的通信。因此，区块链技术指的是分布式账本，它是安全且去中心化的共享。在过去的几年里，区块链在金融和银领域经历了异常增长。它现在正进入保证、能源、工业和医疗等其他领域。因此，区块链可用于各种应用，如在线投票系统、电子商务、社交网络、电子游戏、消息传递和在线学习。由于其去中心化、分布式和安全的特性，区块链在几乎每个领域都变得流行。事实上，由于系统是去中心化的，它不需要中央管理机构来治理。数据存储基于各个节点之间通过共识算法达成共同协议的过程。区块链为云计算中集中安全数据救援和共享的不同解决方案所带来的问题提供了答案。


    ## 1.3 相关工作


    区块链是一项关键发明，在当今商业世界具有重要意义。它指的是在网络中扩散的重复交易数字记录。它可以作为一种难以被更改或黑客攻击的数据存储共享系统。最近，区块链技术已广泛应用于多个领域；使用该技术最具吸引力的领域之一是医疗保健。关于应用场景，智能医疗系统中存在三种区块链用例。第一种是数据记录和安全。第二种是
    `IoMT` 与区块链的结合。第三种方案是使用区块链代替联邦学习的中央机构。在过去的几年，发表了许多关于区块链在医疗领域应用的综述研究。在 [23] 中，Pranto
    Kumar Ghosh 等对考虑区块链技术在医疗行业应用的论文进行了综述。该综述总结了 144 篇研究论文，说明了该技术在该领域的重要性，并强调了其局限性。首先，作者介绍了区块链及其特性的详尽背景。然后，他们专注于对指定的论文进行文献综述，这些论文突出了区块链支持的智能医疗中的当前主题。此外，他们介绍了区块链在几个应用领域提供的解决方案。最后，作者提出了问题和未来的研究方向。


    同样，Sadia Ramzan [32] 等人介绍了基于区块链的医疗服务的概述。首先，介绍了广泛的介绍、历史、背景和区块链类型。然后，涵盖了该技术的动机以及使用它完成的医疗服务。该论文展示了区块链的潜力，识别了其挑战并强调了未来的研究方向。为了检查该领域的最新研究，Valeria
    Merlo 等人也提供了一份侧重于区块链在实际中应用的综述[33]。他们证明开放的研究问题是数据安全以及电子健康记录和诊断系统的实现。


    Suruchi Singh 等提供了一份综述[34]，解释了区块链技术如何促进医疗记录管理并维护患者数据的完整性和隐私性。他们展示了使用这种技术的广泛应用，强调了其实施益处，特别是在医疗数据管理方面。然后，他们讨论了延迟这种技术在这些领域应用的各种重大挑战。最后，他们建议了许多其他待研究点。在
    [35] 中，Mohammad Salar Arbabi 等利用系统分类和分析框架，对区块链支持的医疗解决方案的现状进行了深入概述。作者检查了 40 多个提供的解决方案，并根据功能组件、优势和问题对每个方案进行了分类。有许多研究综述了基于区块链的医疗解决方案的最新进展[36]–[40]。


    ## 1.4 研究方法


    在本节中，我们概述了收集本次调查所需文献所遵循的步骤（图 1.1）。


    ```

    ![图 1.1 文献综述遵循的步骤。](img/9781032551074_C001_001.jpg)

    ```


    图 1.1 文献综述遵循的步骤。


    作为综述研究的第一步，根据要实现的目标，我们确定了要解决的三个问题，即确定区块链技术在医疗服务应用的研究现状。相应的，用于识别符合本研究目标的问题如下：


    *   关于区块链在医疗主题应用的最新发表作品有哪些？

    *   区块链应用在医疗管理中的不同目的是什么？

    *   区块链应用在医疗管理中的挑战和问题有哪些？


    为了产生理想的搜索查询，[41]–[43] 建议了一些措施来细分搜索查询，即通过区分某些标准（包括搜索分组、缩写和变体拼写），并通过布尔运算符进行组合。实现流程最终结果的各个步骤在以下章节中概述：


    *   选择论文中的摘要和相关词。

    *   基于逻辑运算符 `OR`、`AND` 或 `NOT` 构建搜索查询。

    *   查找关键词、术语、缩写和同义词。


    '
