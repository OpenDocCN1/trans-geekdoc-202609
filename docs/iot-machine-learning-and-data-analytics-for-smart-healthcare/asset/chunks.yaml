    # CHAPTER 7Monitoring of Water Toxicity Through the Internet of Things to Protect
    the Health of the Population


    Khadija El-Moustaqim, Jamal Mabrouki and Mourade Azrour


    DOI: [10.1201/9781003430735-7](http://doi.org/10.1201/9781003430735-7)


    ## 7.1 Introduction


    Water is much more than a simple human need. It represents an essential and irreplaceable
    element to ensure the continuity of life\[[1](#ch13.xhtml#r373)\]. However, it
    can also be a source of disease. According to the literature, millions of infants
    and children die each year from diseases caused by contaminated food or drinking
    water. Drinking water is a key factor in the prevention of water-related diseases
    and should be given special attention. Indeed, water intended for human consumption
    must not contain dangerous chemical substances, or pathogenic germs harmful to
    health\[[2](#ch13.xhtml#r374)\]. This is why all the actors in the water sector
    must constantly monitor the quality of the groundwater resource, which conditions
    the safety and reliability of the drinking water supply for the population, and
    continue to recover the quality of surface water in each agglomeration\[[3](#ch13.xhtml#r375)\]–\[[8](#ch13.xhtml#r380)\].
    Also, the use of water from public open wells and unprotected individual wells,
    combined with the inadequacy of sanitation facilities and ignorance of basic hygiene
    rules, promotes the spread of diseases Oro-fecal transmission and can cause serious
    diseases such as gastroenteritis, hepatitis, and typhoid. The rapid increase in
    the population produces a large amount of wastewater, contaminating rivers, ponds,
    and reservoirs and making freshwater a limited and valuable resource. As well
    as climate change, depletion of ecosystems, inappropriate use of renewable capital,
    and also ecological stresses are inseparably linked to the reduction of rivers
    due to low groundwater flow\[[3](#ch13.xhtml#r375)\], \[[9](#ch13.xhtml#r381)\].
    In addition, this deteriorates the reservoirs, which has a negative effect on
    the supply and availability of water.


    In this paper, we present a general study on the use of the Internet of Things
    (IoT) in monitoring systems for the detection of several particles in wastewater.
    In the second part of this paper, we will approach a study in the form of a literature
    review on the evolution of different techniques used in IoT-based monitoring systems
    to detect various materials. All we discuss are their main properties and their
    potential.


    ## 7.2 IoT and Wastewater'
