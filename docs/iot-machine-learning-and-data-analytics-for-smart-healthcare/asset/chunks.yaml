    # CHAPTER 3Exploring Lung Cancer Pathologies Using Metaphoric Interventions of
    Deep Learning Techniques


    Swapnali Patil and D. Lakshmi


    DOI: [10.1201/9781003430735-3](http://doi.org/10.1201/9781003430735-3)


    ## 3.1 Introduction


    Around the world, the major public health issue is cancer. Historically, cancer
    has been a fatal disease. Cancer can be devasting even in this day and age of
    technological improvements, if not found early. Millions of lives could be saved
    if cancerous cells were detected as soon as possible. There are many distinct
    cancer types, but lung cancer is the most frequently detected worldwide. Additionally,
    it contributes to the highest mortality rates worldwide and is the number one
    cause of death ([Cancer Statistics).](#ch09.xhtml#r136) Lung cancer early detection
    is useful to improve survival rates. It will also help to save lives, time, and
    money. Lung cancer is caused in 85% of cases by long-term tobacco use. One in
    five to ten percent of cases includes people who have never smoked ([WHO Database,
    2023](#ch09.xhtml#r170)).


    Lung cancer is primarily divided into small cell lung carcinoma (SCLC) and non-small
    cell lung carcinoma (NSCLC). NSCLC accounts for 85% of lung cancer cases, while
    the residual 15% exists as SCLC. NSCLC is further mainly divided into adenocarcinoma
    (ADC), squamous cell carcinoma (SCC), and large cell carcinoma (LCC) with approximately
    40%, 30% and 15% of cases respectively (Types of Lung Cancer).'
