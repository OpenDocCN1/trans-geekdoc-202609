    | 1 || IQ-OTHNCCD lung cancer dataset || The dataset comprises approximately 1200
    CT scan images from 110 different subjects. These are divided into three separate
    classes: normal, benign, and malignant. Within these groups, there are 55 normal
    cases, 15 cases diagnosed as benign, remaining 40 as malignant cases. DICOM format
    was initially used for maintaining CT scan data. || Mendeley |


