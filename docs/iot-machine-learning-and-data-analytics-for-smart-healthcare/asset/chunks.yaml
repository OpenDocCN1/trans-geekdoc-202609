    ## 3.4 Discussion


    Cancer is a condition in which a few cells from the body multiply destructively
    and spread to other organs. Cells typically grow and extend through cell division
    to produce new cells that can be used to repair old and damaged ones. This mechanism,
    however, gets disrupted, leading to the uncontrollable growth of aberrant cells
    that create tumors that can be malignant. Lung cancer is a big issue because the
    survival rate is low and usually it is detected at later stages. Detection of
    lung cancer early using ML and DL is an active area of research and development,
    even after a lot of technological advancement. In this paper, we reviewed ML and
    DL models for the early detection of lung cancer. DL algorithms have great potential
    to analyze large volumes of data. The fusion of DL and ML models shows greater
    accuracy.


    DL models assist pathologists and doctors to increase efficiency by reducing the
    time to classify tumors as malignant or benign and also providing better support
    for scalability. **The problems that we need to consider are:** The model’s performance
    depends on the availability and quality of data. These automated prediction systems
    for lung cancer are prone to false negative results, which is a big issue in the
    medical field. The use of DL in medical diagnosis poses ethical concerns about
    patient privacy and data security. The better choice of the technique depends
    on several factors, the type of data collected, the number of data samples, and
    the time constraints. Based on many researchers’ findings, the summary is that
    the integration of multidimensional heterogeneous data, in concurrence with the
    use of different methodologies for feature selection and classification, gives
    valuable tools for drawing inferences in lung cancer disease.


    ## 3.5 Conclusion


    DL plays an important role in exploring lung cancer diagnosis and early prediction.
    Data was accepted in a variety of forms and from varied sources. Histopathological
    images can be used for diagnosis and classification as they contain rich information
    and morphological structure. From the review, we obtained data that shows CT scans
    are the most commonly used imaging diagnostic technique. To handle the problem
    of data availability, transfer learning models are used for better prediction.
    ML algorithms SVM and DL algorithms CNN are frequently used by researchers as
    they provide better accuracy. DL models are great at extracting features, and
    their properties can help in cancer prognosis and prediction. Data augmentation
    is critical for cancer diagnostic and prediction jobs to increase system performance.
    These methods will be critical in developing cancer diagnostic and prediction
    methods. However, for clinical applications, larger datasets require additional
    testing and validation. More study on data augmentation approaches, learning in
    new domains such as the frequency domain, and deploying novel architectures such
    as graph convolutional networks would almost certainly increase their performance.
    The use of ML and DL models for lung cancer is a hot research topic but these
    models are not yet completely implemented in practice for many reasons like security
    issues and tests on small datasets. By overcoming these issues, personalized AI
    assistants can be provided to doctors to help them with diagnosis and classification.


