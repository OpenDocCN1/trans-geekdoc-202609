  trans: '

    通过特殊技术，特征可以从信号或图像中自动提取。算法或深度网络（`DN`）的使用消除了人工交互自动特征提取的需求。当你需要快速从收集原始数据过渡到开发`ML`算法时，这种方法非常有用。


    随着 `DL` 的兴起，`DN` 的前层很大程度上承担了特征提取的角色，尽管主要用于图像数据。


    图像分析技术被用于肺癌的特征提取和肺癌肿瘤检测。为了提取特征，使用了图像处理技术。所采用的方法包括获取 CT 肺图像，然后对 CT 肺图像进行预处理（重缩、图像增强、背景去除、中值滤波）。图像分割使用边缘检测技术完成。特征提取使用了灰度级共共生矩阵（`GLCM`）。分析了基于纹理的特征。提取的特征支持肺部组织异常的诊断（Alayue
    et al. 2022）。


    作者推荐了一种主要分五个步骤进行的方法。


    *   **步骤 1**：从肺癌数据库中收集图像。

    *   **步骤 2**：在第二步中使用中值滤波技术进行预处理。中值滤波保留了边缘，即保留了锐利特征。

    *   **步骤 3**：使用模糊 C 均值对目标进行分割，因为它比 `K-means` 聚类性能更好。

    *   **步骤 4**：使用 `GLCM` 提取特征。`GLCM` 具有高判别准确率，但计算速度慢（自相关、对比度、相关性、簇显著性、簇阴影、差异、能量、熵和同质性）。

    *   **步骤 5**：将提取的特征交给 `SVM` 分类器进行肺癌分类。`SVM` 分类器在检测肺癌类型方面达到了 96.7% 的准确率（Ankita
    et al. 2019）。


    研究针对 CT 图像进行了早期肺癌检测。使用了一种新型的加速封装二进制人工蜜蜂算法（`AWB-ABC`）结合特征提取和改进的 `NB` 分类器。最初，使用
    `MMSE` 技术消除背景噪声，以获得改进的肺结节视觉图像。使用 `AWB-ABC` 算法对肺癌结节进行特征选择，随后使用改进的 `NB` 分类器进行有效分类（Karthiga
    & Rekha 2020）。


    大多数专家认为 DNA 甲基化是哺乳动物基因组癌症发育过程中最重要的表观遗传标志物。由于 DNA 甲基化数据存在大量噪声，预测准确性受到影响。通过利用依赖属性选择和提取技术的混合方法得到了解决方案。它利用过滤属性选择方法（`F-score`）并引入了提取模型。该模型采用平均甲基化密度峰、快速傅里叶变换算法以及样本甲基化密度对称性作为特征提取方法。使用多种
    `ML` 算法（如 `NB`、`RF` 和 `SVM`）在混合和不混合的情况下进行分类。所提方法提高了分类准确率（Raweh et al. 2018）。


    ### 3.3.5 迁移学习


    在没有足够的训练数据时，使用迁移学习方法可以提高模型效率并缩短训练时间。由于模型已经过预训练，使用迁移学习可以用较少的训练数据生成良好的 `ML` 模型。在使用少量训练数据的迁移学习中，由于很难获得大量的训练数据，因此通过预训练模型创建高效的
    `ML` 模型。图 3.3 展示了带有迁移学习模型的通用流程。


    ![图 3.3 带有迁移学习模型的通用流程。](img/9781032551074_C003_003.jpg)


    图 3.3 带有迁移学习模型的通用流程。


    `GoogleNet` —— 视觉图像分析中最先进的 `CNNs` 之一 —— 经过精确调整并应用于肿瘤恶性分类领域。之前的研究训练了简单的特定任务的 `CNNs`
    或过时的预训练网络，而该系统增加了收敛率和其性能指标。换句话说，更短的训练时间产生了更好的预测结果。此外，应用 `MIPs` 将 3D CT 扫描的多视图信息组合成
    RGB 图像，这与微调后的 `GoogleNet` 相似。`MIPs` 使系统能够完整学习恶性特征的特征（Fang 2018）。


    为了加速处理，研究人员建议使用带有丢弃层的深度神经网络（`DNN`）。通过比较预训练架构 `AlexNet`、`GoogleNet` 和 `ResNet50`，`ResNet50`
    产生了最好的准确率（Sajja et al. 2019）。


    ### 3.3.6 使用 ML 和 DL 技术进行肺癌分类


    `ML` 技术如 `NB` 分类器、`DT` 分类器、逻辑回归、`RF` 和 `SVM` 用于肺癌的分类。`DL` 技术如多层感知器（`MLP`）、人工神经网络（`ANN`）、`CNN`、反向传播神经网络、概率神经网络、`SVM`
    和循环神经网络（`RNN`）用于识别和分类。`ML` 和 `DL` 技术的使用可以克服病学家短缺的局限性，具有高准确率并节省了时间。从肺癌数据集使用 `ML`
    预测侧重于为消费者提供早期预警，使他们节省金钱和时间。从肺癌数据集优化检测过程的 `SVM` 算法被高效使用（Anil Kumar et al. 2022）。


    多种方法被用于诊断早期的癌症。`ML` 算法在这项工作中检测肺癌结节时进行了比较。为了发现异常，作者使用了主成分分析、K-近邻（`KNN`）、`SVM`、`NB`、`DT`
    和 `ANN` 等 `ML` 方法。所有方法都在预处理前后进行了比较。测试结果显示，`ANN` 在图像处理后表现最好，准确率为 82.43%，`DT` 在不预处理的情况下表现最好，准确率为
    93.24%（Günaydin et al. 2019）。

    '
