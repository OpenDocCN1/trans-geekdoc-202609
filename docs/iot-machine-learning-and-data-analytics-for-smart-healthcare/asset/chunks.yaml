    ### 6.1.1 Evolution of Veganism


    The evolution of veganism is a fascinating subject that showcases the development
    and transformation of the vegan movement over time. Here is an overview of the
    key stages and milestones in the evolution of veganism:


    *   **Origins and early influences:** The roots of veganism can be traced back
    to ancient civilisations, where certain religious and philosophical traditions
    advocated for vegetarian or plant-based diets. In 1945, the word “vegan” was first
    used by Donald Watson and a group of vegetarians who formed the Vegan Society
    in the United Kingdom. They adopted a lifestyle that forbade any usage of animal
    products, such as dairy and eggs, in an effort to set themselves apart from vegetarians.


    *   **Ethical foundations and animal rights:** Animal rights awareness and ethical
    issues have long been at the core of veganism. A wider awareness of and activism
    for veganism as a strategy to enhance animal welfare was sparked by influential
    publications like “Animal Liberation” by [Singer (1975)](#ch12.xhtml#r365) and
    “The Sexual Politics of Meat” by [Adams (1990)](#ch12.xhtml#r319), which furthered
    the ethical arguments against animal exploitation.


    *   **Environmental concerns:** The environmental advantages of veganism have
    received more attention in recent years due to growing public awareness of environmental
    challenges including climate change and resource depletion ([Scarborough et al.,
    2014](#ch12.xhtml#r364); [Aleksandrowicz et al., 2016](#ch12.xhtml#r321)). Veganism’s
    contribution to lowering greenhouse gas emissions, deforestation, and water pollution
    has been noted in research on the environmental effects of animal agriculture,
    notably the United Nations Livestock’s Long Shadow (2008) report.


    *   **Health and wellness:** The health benefits associated with a well-planned
    vegan diet have also played a significant role in the evolution of veganism ([Dinu
    et al., 2017](#ch12.xhtml#r332); [Tuso et al., 2013](#ch12.xhtml#r370)). According
    to scientific studies, a balanced vegan diet can offer all the essential nutrients
    while lowering the chance of developing certain chronic conditions like heart
    disease, obesity, and type 2 diabetes ([Bhagat and Ravi, 2018](#ch12.xhtml#r322)).
    Due to this evidence, plant-based diets are becoming more and more popular among
    people who want to enhance their health ([Craig & Mangels, 2009](#ch12.xhtml#r327);
    [Huang et al., 2016](#ch12.xhtml#r342)).


    *   **Mainstream acceptance and industry response:** The mainstream culture has
    become more aware of and accepting of veganism. Due to rising consumer demand
    and market trends, vegan options and goods are now substantially more readily
    available in grocery stores, eateries, and fast-food chains ([Harrison et al.,
    2018](#ch12.xhtml#r341); [Mintel, 2021](#ch12.xhtml#r355)). The growth of social
    media and online networks has also aided in the spread of veganism by allowing
    people to exchange information, support, and recipes ([Bryant & Barnett, 2019](#ch12.xhtml#r324);
    [Ruby et al., 2018](#ch12.xhtml#r362)).


    *   **Intersectionality and social justice:** Given the intersectionality of many
    oppressions, veganism has recently gotten entwined with larger social justice
    movements. By highlighting the links between animal rights, human rights, and
    environmental justice, activists have pushed for a more inclusive and egalitarian
    veganism that takes structural problems into account ([Adams, 2010](#ch12.xhtml#r320);
    [Harper, 2018](#ch12.xhtml#r340)).


    *   **Technological advancements:** Technological development has contributed
    to the development of veganism as well. The introduction of plant-based meat replacements
    like Beyond Meat and Impossible Foods has garnered interest and increased the
    alternatives available to people switching to a vegan diet. The distinction between
    conventional animal-based goods and their plant-based substitutes has become more
    hazy as a result of these advancements ([Saxena, 2020](#ch12.xhtml#r363); [Sze
    et al., 2020](#ch12.xhtml#r367)). An important factor in the growth of vegan products
    is innovation. Companies are constantly looking for novel approaches to develop
    plant-based substitutes for traditional animal-derived goods that imitate their
    flavour, texture, and nutritional attributes. This includes the creation of new
    ingredients, sophisticated processing methods, and the blending of scientific
    discoveries and culinary knowledge. Inventive plant-based snacks, “bleeding” plant-based
    burgers, and dairy-free substitutes with rich flavours and creamy textures are
    just a few examples of the innovative advances being made in this field ([Krzywonos
    & Piwowar, 2022](#ch12.xhtml#r348)).


