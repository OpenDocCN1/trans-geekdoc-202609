- raw: 'By using special technology, features are automatically extracted from signals
    or images. The use of algorithms or deep networks (DN) eliminates the need for
    human interaction through automatic feature extraction. This approach can be quite
    useful when you need to quickly transition from gathering raw data to developing
    ML algorithms.


    The first layers of DN have largely taken on the role of feature extraction with
    the rise of DL, albeit mostly for image data.


    Image analysis technique is used for feature extraction of lung cancer and to
    detect tumors in lung cancer. To extract features, image processing techniques
    were used. The methodology followed includes the acquisition of CT lung images
    and then the preprocessing of CT lung images (rescaling, image enhancement, background
    removal, median filter). Image segmentation is done using the technique of edge
    detection. Feature extraction uses the gray level co-occurrence matrix (GLCM).
    Texture-based features were analyzed. The extracted features support the diagnosis
    of abnormalities in lung tissues ([Alayue et al. 2022](#ch09.xhtml#r130)).


    The author recommended a methodology which is mostly carried out in five steps.


    Step 1: Images were collected from the lung cancer database. Step 2: Preprocessing
    was done by using the median filter technique in step two. The median filter preserves
    the edges i.e., sharp features are preserved. Step 3: segmentation of the target
    image was done using fuzzy C-means as it gives better performance than K-means
    Clustering. Step 4: the features were extracted using the GLCM. GLCM has high
    discrimination accuracy but less computational speed (autocorrelation, contrast,
    correlation, cluster prominence, cluster shade, dissimilarity, energy, entropy
    and homogeneity). Step 5: extracted features were given to the SVM classifier
    for the classification of lung cancer. The SVM classifier achieved an accuracy
    of 96.7% in detecting the type of lung cancer ([Ankita et al. 2019](#ch09.xhtml#r133)).


    The study was performed on CT images for earlier lung cancer detection. A novel
    method, accelerated wrapper-based binary-artificial bee colony algorithm (AWB-ABC),
    is used with feature extraction and an improved NB classifier. Initially, preprocessing
    is done using the MMSE technique for background noise elimination to acquire an
    improved visual image of the lung node. The AWB-ABC algorithm is used for feature
    selection of lung cancer nodules followed by an improved NB classifier for effectual
    classification ([Karthiga & Rekha 2020](#ch09.xhtml#r151)).


    Most experts agree that DNA methylation is the most important epigenetic biomarker
    in the mammalian genome during cancer development. Because of the large amount
    of noise in DNA methylation data, the prediction accuracy suffers. A solution
    was obtained through the utilization of a hybrid approach that relied on both
    attribute selection and extraction techniques. It utilizes a filter attribute
    selection method (F-score) and introduces an extraction model. This employs the
    peaks of the mean methylation density, the fast Fourier transform algorithm, and
    the symmetry between the methylation density of a sample as feature extraction
    methods. The cancer classification is done using various ML algorithms like NB,
    RF, and SVM with and without hybridization. The classification accuracy improves
    with the proposed approach ([Raweh et al. 2018](#ch09.xhtml#r159)).


    ### 3.3.5 Transfer Learning


    The transfer learning approach is used to boost the efficiency of the model and
    minimize training time when adequate data for training is not available. Because
    the model has already been pre-trained, a good ML model can be generated with
    reasonably little training data using transfer learning. In transfer learning
    using little training data, an efficient ML model is created by a pre-trained
    model, as it is very difficult to obtain large training data. [Figure 3.3](#ch09.xhtml#f6)
    illustrates the generic flow with the transfer learning model.


    ![Figure 3.3Generic flow with the transfer learning model.](html/images/9781032551074_C003_003.jpg)


    [Figure 3.3](#ch09.xhtml#f6b)Generic flow with the transfer learning model.


    GoogleNet – one of the most advanced CNNs in visual imagery analysis – was adjusted
    precisely and applied to the field of classifying malignancy in tumors. Previous
    studies trained simple task-specific CNNs or outdated pre-trained networks, this
    system increased the convergence rate and its performance metrics. To put it in
    another way, less training time produced better prediction results. In addition,
    MIPs were applied to combine multi-view information of 3D CT scans into RGB images
    that are similar with the fine-tuned GoogleNet. MIPs enabled the system to integrally
    learn features of malignant and benign lung nodules during the training, and obtain
    high accuracy when tested on the validation sets ([Fang 2018](#ch09.xhtml#r144)).


    In order to speed up processing, the researchers suggest a deep neural network
    (DNN) built onto GoogleNet that has a large dropout ratio. By utilizing the dropout
    layer, this network lessens overfitting during the learning process. 60% of the
    neurons in the suggested technique are fully linked, a lower percentage than the
    current GoogleNet. On the LIDC preprocess dataset, experiments were carried out
    utilizing the three pre-trained CNN architectures, AlexNet, GoogleNet, and ResNet50.
    ResNet50 produced the best accuracy of the three pre-trained architectures. Comparing
    the proposed network to pre-trained designs and cutting-edge techniques, it attained
    the best accuracy ([Sajja et al. 2019](#ch09.xhtml#r161)).


    A multi-round transfer learning and enhanced generative adversarial network algorithm
    is proposed with a prioritization algorithm and modified loss functions in features
    perspectives. It overcomes the research limitations of existing lung cancer detection
    models in multi-round transfer learning, negative transfer, and a lack of bridge
    between source and target domains ([Chui et al. 2023](#ch09.xhtml#r138)).


    ### 3.3.6 Lung Cancer Classification Using ML and DL Techniques


    ML techniques like the NB classifier, DT classifier, logistic regression, RF,
    and SVM are used for the classification of lung cancer. DL Techniques like multilayer
    perceptrons (MLP), artificial neural networks (ANN), CNN, back-propagation neural
    networks, probabilistic neural networks, SVM, and recurrent neural networks (RNN)
    were utilized for the identification and classification of the classifier. The
    use of ML and DL techniques can overcome the limitation of a shortage of pathologists
    with high accuracy and less time.


    Lung cancer prediction from text datasets using ML focuses on providing consumers
    with an early warning for lung cancer, allowing them to save both money and time.
    From the lung cancer dataset to optimize the process of detection SVM algorithm
    is used efficiently ([Anil Kumar et al. 2022](#ch09.xhtml#r132)).


    Multiple methods have been used to diagnose cancer in its early stages. ML algorithms
    were compared in this work while detecting lung cancer nodules. To discover anomalies,
    authors used ML approaches such as principal component analysis, K-nearest neighbours
    (KNN), SVM, NB, DT, and ANN. All approaches were compared both with and without
    preprocessing. The testing results suggest that ANN performs best with 82.43%
    accuracy after image processing, and DT performs best without image processing
    with 93.24% accuracy ([Günaydin et al. 2019](#ch09.xhtml#r146)).


    The CNN is one of the DL models, is used frequently because of its application
    in the computer vision domain. The general block diagram of the DL model using
    CNN is shown in [Figure 3.4](#ch09.xhtml#f7).


    ![Figure 3.4General block diagram of deep learning model using CNN.](html/images/9781032551074_C003_004.jpg)


    [Figure 3.4](#ch09.xhtml#f7b)General block diagram of deep learning model using
    CNN.'
  fmt: "\nBy using special technology, features are automatically extracted from signals\
    \ or images. The use of algorithms or deep networks (`DN`) eliminates the need\
    \ for human interaction through automatic feature extraction. This approach can\
    \ be quite useful when you need to quickly transition from gathering raw data\
    \ to developing `ML` algorithms.\n\nThe first layers of `DN` have largely taken\
    \ on the role of feature extraction with the rise of `DL`, albeit mostly for image\
    \ data.\n\nImage analysis technique is used for feature extraction of lung cancer\
    \ and to detect tumors in lung cancer. To extract features, image processing techniques\
    \ were used. The methodology followed includes the acquisition of CT lung images\
    \ and then the preprocessing of CT lung images (rescaling, image enhancement,\
    \ background removal, median filter). Image segmentation is done using the technique\
    \ of edge detection. Feature extraction uses the gray level co-occurrence matrix\
    \ (`GLCM`). Texture-based features were analyzed. The extracted features support\
    \ the diagnosis of abnormalities in lung tissues ([Alayue et al. 2022](#ch09.xhtml#r130)).\n\
    \nThe author recommended a methodology which is mostly carried out in five steps.\n\
    \n*   **Step 1**: Images were collected from the lung cancer database.\n*   **Step\
    \ 2**: Preprocessing was done by using the median filter technique in step two.\
    \ The median filter preserves the edges i.e. sharp features are preserved.\n*\
    \   **Step 3**: segmentation of the target image was done using fuzzy C-means\
    \ as it gives better performance than `K-means` Clustering.\n*   **Step 4**: the\
    \ features were extracted using the `GLCM`. `GLCM` has high discrimination accuracy\
    \ but less computational speed (autocorrelation, contrast, correlation, cluster\
    \ prominence, cluster shade, dissimilarity, energy, entropy and homogeneity).\n\
    *   **Step 5**: extracted features were given to the `SVM` classifier for the\
    \ classification of lung cancer. The `SVM` classifier achieved an accuracy of\
    \ 96.7% in detecting the type of lung cancer ([Ankita et al. 2019](#ch09.xhtml#r133)).\n\
    \nThe study was performed on CT images for earlier lung cancer detection. A novel\
    \ method, accelerated wrapper-based binary-artificial bee colony algorithm (`AWB-ABC`),\
    \ is used with feature extraction and an improved `NB` classifier. Initially,\
    \ preprocessing is done using the `MMSE` technique for background noise elimination\
    \ to acquire an improved visual image of the lung node. The `AWB-ABC` algorithm\
    \ is used for feature selection of lung cancer nodules followed by an improved\
    \ `NB` classifier for effectual classification ([Karthiga & Rekha 2020](#ch09.xhtml#r151)).\n\
    \nMost experts agree that DNA methylation is the most important epigenetic biomarker\
    \ in the mammalian genome during cancer development. Because of the large amount\
    \ of noise in DNA methylation data, the prediction accuracy suffers. A solution\
    \ was obtained through the utilization of a hybrid approach that relied on both\
    \ attribute selection and extraction techniques. It utilizes a filter attribute\
    \ selection method (`F-score`) and introduces an extraction model. This employs\
    \ the peaks of the mean methylation density, the fast Fourier transform algorithm,\
    \ and the symmetry between the methylation density of a sample as feature extraction\
    \ methods. The cancer classification is done using various `ML` algorithms like\
    \ `NB`, `RF`, and `SVM` with and without hybridization. The classification accuracy\
    \ improves with the proposed approach ([Raweh et al. 2018](#ch09.xhtml#r159)).\n\
