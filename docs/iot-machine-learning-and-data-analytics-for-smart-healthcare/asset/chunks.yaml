  trans: '


    本研究使用 `NVivo 12` 定性软件对次级数据进行分析。本章分为三个部分：第一部分涉及收集信息（数据、研究论文和其他因素），以评估素食主义对消费者健康的影响，并评估用户面临的各种困难和限制。第二阶段的主要主题是素食主义和素食产品的采纳、用户感知和见解。作为该阶段数据收集的一部分，使用
    `NVivo` 工具提取并分析了 17216 条推文，这些数据是在 Twitter 上通过 `#vegan` 和 `#veganism` 标签收集的，直到
    2023 年 5 月 1 日。第三阶段从 1686 篇在 Scopus 发表的研究中提取了关键词为“vegan and veganism”的 `CSV` 文件，并对数据进行检查以评估全球公众对素食主义的观点。


    # 6.4 数据分析


    使用 `NVivo 12` 定性软件工具对提取的数据进行了评估。调查发现，用户通过多项标准，同时考虑了素食产品的潜在优势和劣。


    ### 6.4.1 通过 Twitter 分析识别出的主题


    `NVivo 12` 软件应用程序使得基于文本的数据集进行自动主题建模和主题识别成为可能。研究利用 `NVivo` 从素食主义主题中提取出的主要主题包括（如
    表 6.1 所示）因素：社会动态和家庭偏好、对传统巧克力味道和口感的复制、农民的转型挑战、营养考量、由于皮草具有象征或历史价值的文化传统意义，以及皮草的使用可能深植于他们的文化实践中。


    Table 6.1 在素食主义下识别出的各种主题


    | 序号 | 识别的主题 | 1: Files\#Veganism –Twitter Search ~ Twitter |

    | --- | --- | --- |

    | 1 | A: action | 93 |

    | 2 | B: animal | 71 |

    | 3 | C: chocolate | 57 |

    | 4 | D: family | 185 |

    | 5 | E: farm | 251 |

    | 6 | F: food | 77 |

    | 7 | G: fur | 52 |

    | 8 | H: humane towards animals | 256 |


    这种主题分析的解释说明，Twitter 用户关注素食主义，特别是在“人道对待动物”的背景下，其次是农场的热爱和家庭关注。前八大主题在 Table 6.1 中进行了解释。对动物的意识正倾向于向可持续环境的选择转变。


    ### 6.4.2 Twitter 平台上的情感分析


    近年来，Twitter 情感分析领域已有大量研究。起初，它集中在在二元尺度上将意见分类为积极或负面。然而，通过 `NVivo 12` 可以从基于文本的数据集中提取最多四种态度。可以使用自动方法提取文本和推文的情感。通过对海量数据进行自动检查并提取观点，情感分析可以帮助企业和客户实现其目标。


    Table 6.2 通过 Twitter 进行情感分析


    | | 1: Files\#vegan – Twitter Search ~ Twitter |

    | --- | --- |

    | A: Very negative | 800 |

    | B: Moderately negative | 720 |

    | C: Moderately positive | 646 |

    | D: Very positive | 212 |


    基于推文的个人情感分析如 Table 6.2 所示。观察到人们对素食主义的积极和非常积极的有所增加，这在近期变得越来越重要。通过分析用户对素食主义或素食产品推文的回应情感，显示了对整体感知的主要见解；根据
    Table 6.2，通过 Twitter 分析，素食主义已增长到总计约 36.1%。


    ### 6.4.3 用于 Twitter 分析的词云和世界地图


    一种称为词云的技术创建了词汇和短语使用频率的视觉描述。这在分析数据时确定需要解决的重点非常有帮助。在这项研究中，使用词云检查了与素食主义相关的推文。根据 Figure
    6.1，“Vegan”一词位于词云中心，周围环绕着有机食品和动物权利的术语。这表明推文的主要焦点是动物福利、无残忍实践和对特殊主义的拒绝。`NVivo` 的词地图分析显示，它具有广泛的用户和应用，并被全球的人和组织所接受。这说明素食饮食选择高度倾向于动物和可持续生活文化。根据
    Figure 6.2，在 Twitter 上关于素食主义的大多数意见来自美国、欧洲、中东和南亚国家，这清楚地表明这是一个全球性现象。


    ![Figure 6.1 Twitter 分析的词云。](img/9781032551074_C006_001.jpg)


    Figure 6.1Twitter 分析的词云。


    ![Figure 6.2 Twitter 分析中的词地图。](img/9781032551074_C006_002.jpg)


    Figure 6.2Twitter 分析中的词地图。


    ### 6.4.4 使用 Scopus 数据文件的主题分析


    该研究论文的第三部分重点关注 Scopus 发表的研究分析。从 Scopus 数据库中提取了一个 `CSV` 文件，并开展了主题、情感和词云研究的探索性工作。Table
    6.3 展示了 Scopus 中十二个主要研究领域，这些领域以“Vegan and Veganism”为关键词。该研究将食物、研究、饮食和肉类视为识别关键词的核心主题。这表明，过去关于素食主义的研究论文高度倾向于饮食中的营养、爱爱和食物，如
    Table 6.3 所示。


    Table 6.3 主题分析


    | 识别的主题 | Files\#VeganismScopus search |

    | --- | --- |

    | Food | 1851 |

    | Study | 1637 |

    | Diet | 1436 |

    | Meat | 1334 |

    | Vegan | 1325 |

    | Eating | 1224 |

    | Dietary | 1022 |

    | Health | 922 |

    | Consumption | 920 |

    | Nutritional | 919 |

    | Animal | 918 |

    | Sustainable | 915 |


    ### 6.4.5 Scopus 数据库的词云


    词云分析解释表明，对素食主义的关注自 2018 年以来大幅增加，并倾向于可持续目标、营养食品和对动物的责任。Figure 6.3 词云选出的最相关词是动物福利、肉类、健康、环境和素食主义。


    ![Figure 6.3 Scopus 数据库研究的词云。](img/9781032551074_C006_003.jpg)


    Figure 6.3Scopus 数据库研究的词云。


    ### 6.4.6 Scopus 数据库的情感分析


    利用 `NVivo` 对 Scopus 数据库进行的探索性情感分析反映了公众的素食恐惧情绪。素食恐惧是指对素食主义者和素食者的歧视。所谓的肉类困境可以作为素食恐惧的理由之一。许多肉食者不喜欢虐待动物。对素食者维持偏见有助于肉食者克服这种认知失调，因为素食者提醒了他们这一点。素食者可能并不由于意识形态原因而被攻击。根据
    Figure 6.4 的正确解释，约有 36.3%的公众更有意识地对素食主义和健康问题持有积极态度，并表现出他们对环境问题的责任感。


