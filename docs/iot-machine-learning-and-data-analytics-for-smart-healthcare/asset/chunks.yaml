    ## 6.5 结论


    素食主义已成为一种全球性现象。虽然还没有成群的人排队等待成为素食主义者，但在过去的十年里，它已经变得越来越流行。2023 年的统计数据显示，全球约有 8800
    万素食主义者。尽管这在人口总数中占比很小，但声明实行素食的人口比例正在上升，这引发了受 Twitter 数据世界地图分析支持的全球趋势。印度是一个庞大的国家，素食者人口几乎占
    13%，其次是美国和美国，其中美国有四分之一的女性是素食主义者（Jen, 2023）。本研究通过使用 `NVivo` 软件作为工具，将对素食主义的消费者洞察可视化，强调了素食主义的消费者洞察。`Ncapture`
    软件研究识别了 17216 条与素食相关的推文，并将“素食”识别为全球第九热门的话题，这说明了世界上对素食主义的接受现象。本研究还考虑了 1686 篇关于素食主义的专属
    `Scopus` 研究论文进行定性分析，这本身可以被视为社会科学消费者研究中巨大的一部分。本章融合了对 Twitter 社交媒体的情感分析、主题分析；`Scopus`
    数据库得出了人们对素食主义的意识正在提高。这些结果强调了素食生产者在与肉类消费相比时，探索消费者产品新市场的重要性。


