    ## 3.3 Methodologies


    Conventional ML and DL systems for the detection of lung cancer as early as possible
    include steps like data acquisition, preprocessing, segmentation, feature extraction,
    and building classification models, as shown in [Figure 3.1](#ch09.xhtml#f4).


    ![Figure 3.1ML-based system for lung cancer detection.](html/images/9781032551074_C003_001.jpg)


    [Figure 3.1](#ch09.xhtml#f4b)ML-based system for lung cancer detection.


    ### 3.3.1 Preprocessing


    The preprocessing of data is a crucial step in the ML workflow. Various data preprocessing
    steps such as normalization of data, cleaning of data, resizing, and segmentation
    of lung images were performed to extract regions of interest (ROIs) ([Bandyopadhyay
    2019](#ch09.xhtml#r134)). Various post-processing techniques like Gaussian and
    Gabor filtering, adaptive Gaussian filtering, Wiener filtering, and CLAHE are
    used widely for the analysis of Image data. Preprocessing text datasets converts
    raw data, which contains missing values, inconsistent values, and duplicate values,
    to a clean data set. Data cleaning techniques are listed in [Figure 3.2](#ch09.xhtml#f5).


    ![Figure 3.2Data cleaning techniques.](html/images/9781032551074_C003_002.jpg)


    [Figure 3.2](#ch09.xhtml#f5b)Data cleaning techniques.


    The efficient use of preprocessing techniques before the use of classification
    algorithms improves the classification model’s precision. To achieve this improvement,
    9 datasets were created using pre-processing approaches, and 6 ML classification
    methods were applied. According to the findings, the K-nearest neighbors (KNN)
    approach outperforms RF (Random Forest), NB (Naive Bayes), logistic regression,
    DT (Decision Tree), and SVM (Support Vector Machines) regarding precision. Using
    the dataset related to lung cancer, the performance of pre-processing methods
    was assessed. The best preprocessing methods were Z-score with 83% accuracy for
    normalization methods, principal component analysis with 87% accuracy for dimensionality
    reduction methods, and information gain with 71% accuracy for feature selection
    methods ([Gültepe 2021](#ch09.xhtml#r145)).


    ### 3.3.2 Imbalanced Data


    An imbalanced classification data is one with skewed class sizes. The classes
    that make up a high share of the data are majority classes, whereas classes that
    make up a smaller share of the population are minority classes. Mostly in medical
    decision-making, the problem of imbalanced data is observed. If training a model
    on an imbalanced dataset works well, then your work is done. If not, then to handle
    imbalanced data, downsampling or upsampling techniques are used.


    Boosted SVM used for solving unbalanced data problems. This technique unites the
    benefits of employing several classifiers with cost-sensitive SVM for non-uniform
    data. In addition, for obtaining decision rules described an oracle-based method
    from the boosted SVM. The method’s quality is then assessed by comparing its performance
    to that of other algorithms that work with imbalanced data. Finally, boosted SVM
    is utilized in medicine to estimate life expectancy following surgical operation
    in patients with lung cancer ([Zięba et al. 2014](#ch09.xhtml#r175)).


    To enhance the prediction performance of ML models, the authors suggested an engineering
    upsampling strategy (ENUS) for handling imbalanced data. The results of experiments
    proved that when the minority-to-majority class ratio is less than 20%, training
    models using ENUS enhance balanced accuracy, sensitivity, and F1 score. The research
    also revealed that XGBoost Tree (XGBTree) using ENUS performed the best in the
    validation dataset ([Tran et al. 2022](#ch09.xhtml#r166)).


    It is a tiresome and difficult task to build a medical image dataset due to various
    reasons like patient privacy, disease rarity, and manual efforts to collect and
    label data. Lack of sufficient data and imbalanced data problems are solved by
    using data augmentations. It artificially increases the dataset size by either
    data warping or oversampling. original images are transformed while preserving
    the labels using data-warping augmentations. This includes augmentations such
    as geometric and color transformations, random erasing, adversarial training,
    and neural style transfer. Synthetic instances are produced by oversampling augmentations
    and added to the training set. This includes mixing images, feature space augmentations,
    and generative adversarial networks (GANs) ([Shorten & Khoshgoftaar 2019](#ch09.xhtml#r162)).


    ### 3.3.3 Segmentation


    The most significant component of image processing is segmentation. A complete
    image is divided into many segments to make it more relevant and easier to understand.
    When these different portions are linked together, they will cover the full image.
    The numerous properties of the image may also have an impact on segmentation.
    It could be color or texture. An image is segmented before denoising to restore
    the original image. The primary goal of segmentation is to minimize the information
    for easier analysis. Generally, it is divided into region-based, edge-based, threshold,
    feature-based clustering, and model-based segmentation ([Yogamangalam & Karthikeyan
    2013](#ch09.xhtml#r174)).


    The authors studied segmentation techniques for lung cancer detection like thresholding,
    edge detection, marker-controlled watershed segmentation, and partial differential
    equation (PDE) based segmentation and their comparative analysis. Marker controlled
    watershed segmentation provides more accurate results as compared to other segmentation
    techniques ([Tripathi et al. 2019](#ch09.xhtml#r167)).


    ### 3.3.4 Feature Extraction


    The process of converting raw data into digital features is very important. In
    feature extraction, while processing the original file information is kept intact.
    It gives better results than applying ML to the raw data, and features can be
    extracted manually or automatically to acquire beneficial and vital classification
    results.


    Identification and justification of the features related to a particular situation
    are essential for manual extraction, as is the execution of a method to extract
    those features. solid understanding of the domain helps in making decisions about
    which characteristics might be useful. Through years of research, engineers and
    scientists have developed techniques for feature extraction from images, signals,
    and text.'
