  \ 表中添加一个新列 `repo_url`：\n\n```sql\nCREATE TABLE packages(\n  -- TODO 其他列\n  repo_url\
  \ VARCHAR(300) DEFAULT NULL,\n)\n```\n\n此列可能包含包的源代码仓库地址。如果你尝试将该列的 `NULL` 值扫描到字符串类型，将会失败。因此，`database/sql`\
  \ 包定义了特殊类型来处理 `NULL` 值。在这里正确使用 `sql.NullString`：\n\n```go\ntype pkgRow struct {\n\
  \    // 其他字段\n    RepoURL       sql.NullString\n}\n```\n\n`sql.NullString` 定义了一个布尔字段\
  \ `Valid`，当 `repo_url` 列存储非空值时，该字段为 `true`。如果 `Valid` 为 `true`，`String` 字段包含字符串本身。向数据库添加字符串的方法也略有不同。首先，我们如下所示创建\
  \ `pkgRow` 对象：\n\n```go\npkgRow{\n    // 其他字段\n    RepoURL: sql.NullString{\n  \
  \      String: \"http://github.com/practicalgo/code\",\n        Valid:  true,\n\
  \    },\n}\n```\n\n然后我们如下所示更新并执行 `updateDb()` 函数：\n\n\n\n\n\n```\nfunc updateDb(config\
  \ appConfig, row pkgRow) error {\n    // TODO: 获取 соединение с БД\n    columnNames\
  \ := []string{\n        \"owner_id\", \"name\", \"version\", \"object_store_id\"\
  ,\n    }\n    valuesPlaceholder := []string{\"?\", \"?\", \"?\", \"?\"}\n    args\
  \ := []interface{}{\n        row.OwnerId, row.Name, row.Version, row.ObjectStoreId,\n\
  \    }\n\n    if row.RepoURL.Valid {\n        columnNames = append(columnNames,\
  \ \"repo_url\")\n        valuesPlaceholder = append(valuesPlaceholder, \"?\")\n\
  \        args = append(args, row.RepoURL.String)\n    }\n    query := fmt.Sprintf(\n\
  \        \"INSERT INTO packages (%s) VALUES (%s);\",\n        strings.Join(columnNames,\
  \ \",\"),\n        strings.Join(valuesPlaceholder, \",\"),\n    )\n\n    result,\
  \ err := conn.ExecContext(\n        ctx, query, args...,\n    )\n    // TODO результаты\
  \ обработки\n}\n```\n\n由于 `repo_url` 列不是强制性的，我们检查 `pkgRow` 对象中是否存在有效的 `RepoURL`\
  \ 字段，如果是，我们就更新 SQL 语句以将其包含内。\n\n除了 `sql.NullString` 类型外，`database/sql` 包还定义了相应的类型，用于处理\
  \ `time.Time`、`float64`、`int32`、`int64` 以及其他 Go 类型的 NULL 值。在书籍源码仓库的 `chap11/mysql-demo`\
  \ 目录下，你可以找到带有测试的代码列表，你可以对其进行实验以更好地理解前面的概念。\n\n在本章的最后部分，你将学习如何在应用程序中使用数据库事务。\n\n\
  ### 使用数据库事务\n\n要启动事务，我们将调用在 `*sql.Conn` 对象定义的 `BeginTx()` 方法。它返回两个值：第一个值的类型为 `*sql.Tx`，第二个是错误值。如果我们成功获取了\
  \ `*sql.Tx` 值，我们将使用该对象定义的 `ExecContext()` 方法执行 SQL 查询。以下是包服务器修改后的 `updateDb()` 函数示例：\n\
  \n```\nfunc updateDb(ctx context.Context, config appConfig, row pkgRow) error {\n\
  \    conn, err := config.db.Conn(ctx)\n    if err != nil {\n        return err\n\
  \    }\n    defer conn.Close()\n\n    tx, err := conn.BeginTx(ctx, nil)\n    if\
  \ err != nil {\n        return err\n    }\n\n    result, err := tx.ExecContext(\n\
  \        ctx,\n        `INSERT INTO packages \n(owner_id, name, version, object_store_id)\
  \ VALUES (?,?,?,?);`,\n        row.OwnerId, row.Name, row.Version, row.ObjectStoreId,\n\
  \    )\n    if err != nil {\n        rollbackErr := tx.Rollback()\n        log.Printf(\"\
  Txn Rollback Error:%v\\n\", rollbackErr)\n        return err\n    }\n    return\
  \ tx.Commit()\n}\n```\n\n`BeginTx()` 方法接受两个参数：第一个是 `context.Context` 类型的对象，第二个是\
  \ `database/sql` 包定义的 `sql.TxOptions` 类型的对象：\n\n```\ntype TxOptions struct {\n \
  \   Isolation IsolationLevel\n    ReadOnly  bool\n}\n```\n\n`Isolation` 字段指定事务的隔离级别。如果没有指定，默认将使用\
  \ MySQL 驱动的默认隔离级别。我们使用的 MySQL 驱动器使用 MySQL 存储引擎的默认隔离级别。\n\n如果在执行查询时遇到错误，我们将调用 `Rollback()`\
  \ 方法回滚事务。如果在回滚事务时遇到错误，我们将记录它并返回原始错误。如果查询执行成功，如果有需要我们将执行任何其他查询。如果所有查询都执行成功，我们将调用\
  \ `tx.Commit()` 方法提交事务。`Commit()` 方法返回错误值，我们也返回该值。\n\n在应用程序级别，在事务内部执行查询的一个很大优势是，如果创建事务时指定的上下文被取消，查询会自动回滚。这允许我们在服务器上实现这种行为：如果客户端取消了请求或由于其他原因取消，事务也将自动回滚。例如，我们可以这样更新包处理函数：\n\
  \n```\nfunc packageRegHandler(\n    w http.ResponseWriter,\n    r *http.Request,\n\
  \    config appConfig,\n) {\n    // TODO 加载包到对象存储\n    err = updateDb(\n       \
  \ r.Context(),\n        config,\n        pkgRow{\n            OwnerId:       packageOwner,\n\
  \            Name:          packageName,\n            Version:       packageVersion,\n\
  \            ObjectStoreId: d.ID,\n        },\n    )\n    // TODO: 其他代码\n}\n```\n\
  \n类似的策略也可以在 gRPC 应用中实现以响应客户端的断开。你可以在书籍源码仓库的 `chap11/pkg-server-2-transactions` 目录下找到使用事务的包服务器的更新代码实现。\n\
  \n## 总结\n\n在本章中，你学习了如何持久化存储来自应用程序的数据。我们从研究如何在对象存储中存储非结构化大对象开始。我们使用了 `gocloud.dev/blob`\
  \ 包来与存储服务交互。通过该包，切换对象存储服务只需要极少的更改。\n\n\n\n\n到目前为止，在本书书中，我们一直使用标准库 `log` 包中定义的函数（如\
  \ `Printf()` 和 `Fatal()`）来记录应用程序的消息。这种记录方法实现简单，并且比完全不记录日志要。你可以使用日志中的文本在你的日志系统中进行搜索，但当你想要在日志*内部*搜索特定数据时，这就会变得不那么有用。一种非常常见的操作是搜索具有特定请求上下文或元数据的日志，例如针对特定命令、特定\
  \ HTTP 路径或 gRPC 方法的所有日志。使用我们到目前为止使用的记录方法，此类搜索既昂贵又低效。因此，你必须找到一种从应用程序生成日志的方法，使得每行日志都符合特定的结构——即单独标记的字段，其中包含日志数据，以及以元数据形式存在的上下文信息。实现这种日志机制有多种方法，它们通常都被称为*结构化日志*（structured\
  \ logging）。日志行不再是任意形式的文本，而是每行日志都由数据*字段*组成，通常以键值对的形式或 JSON 格式的字符串形式。\n\n在第 6 章“高级\
  \ HTTP 服务器应用程序”中的示例 6.2 中，我们定义了日志中间件 (`loggingMiddleware()`) 来创建如下日志行：\n\n```\n\
  config.Logger.Printf(\n    \"protocol=%s path=%s method=%s duration=%f status=%d\"\
  ,\n    r.Proto, r.URL.Path, r.Method,\n    time.Now().Sub(startTime).Seconds(),\n\
  \    customRw.code,\n)\n```\n\n该应用程序创建的日志行由空格分隔的键值对组成，例如 `protocol=HTTP path=/api\
  \ duration=0.05 status=200`。与简单的记录字符串（如 `HTTP request for /api/search received.\
  \ Response 200. Duration: 0.1 second`）相比，这是一个改进。大多数日志系统都对这种格式的日志行具有内置的*分析*和*索引支持，，每一个键值对都可以单独进行搜索。这种格式在社区中被称为\
  \ `logfmt`，是因为在 Stripe 博客上发布了名为“Canonical Log Lines”的文章（[`stripe.com/blog/canonical-log-lines`](https://stripe.com/blog/canonical-log-lines)）。使用\
  \ `Printf()` 或 `log` 包中的任何函数来构建上述日志行都是繁琐的。因此，你可以使用第三方包 [`github.com/go-logfmt/logfmt`](https://github.com/go-logfmt/logfmt)\
  \ 来创建键值对格式的日志行。该包仅实现了编码器和解码器，因此你仍然会使用标准库的日志函数来记录格式化的日志行。另一个第三方包是 [`github.com/apex/log`](https://github.com/apex/log)。\n\
  \n### 结构化日志\n\n另一个第三方包，[`github.com/apex/log`](https://github.com/apex/log)。\n\n\
