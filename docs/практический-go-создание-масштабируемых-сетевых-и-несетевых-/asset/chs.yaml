  \ err    error\n}{\n    // 检查未指定应用程序参数\n    // 时的行为\n    {\n        args:   []string{},\n\
  \        err:    errInvalidSubCommand,\n        output: \"Invalid sub-command specified\\\
  n\" + usageMessage,\n    },\n    // 检查在应用程序参数中指定 \"-h\" \n    // 时的行为\n    {\n \
  \       args:   []string{\"-h\"},\n        err:    nil,\n        output: usageMessage,\n\
  \    },\n    // 检查输入未识别的应用程序子命令\n    // 时的行为\n    {\n        args:   []string{\"\
  foo\"},\n        err:    errInvalidSubCommand,\n        output: \"Invalid sub-command\
  \ specified\\n\" + usageMessage,\n    },\n}\n```\n\n完整的测试在列表 2.6 中显示。\n\n\n\n\n\
  可靠应用程序的一个显著特征是，在运行期间对其行为应用了特定程度的控制。例如，当你的程序发出 HTTP 请求时，你可能希望它在用户指定的秒数内完成，否则就带错误消息退出。当应用了此类措施时，程序的行为对用户来说变得更具可预测性。标准库中的\
  \ `context` 包允许应用程序应用这种控制。它定义了 `Context` 结构体类型以及三个函数——`withDeadline()`、`withCancel()`\
  \ 和 `withTimeout()`——用于确保在执行你的代码时提供特定的运行时间保证。你会发现许多标准库包都要求将上下文对象作为第一个参数传递。示例包括 `net`、`net/http`\
  \ 和 `os/exec` 包中的函数。虽然上下文（contexts）在与外部资源通信时最常见，但它们同样适用于任何可能存在不可预测行为概率的其他功能。\n\n\
  ### 带有截止期限的用户输入\n\n让我们考虑这样一个示例：你的程序请求用户输入，用户必须在 5 秒内输入内容并按 Enter 键，否则程序将使用默认名称继续运行。虽然这是一个假设的例子，但它说明了你如何为应用程序中的任何用户代码设置超时。\n\
  \n让我们先看 `main()` 函数：\n\n```\npackage main\n\nfunc main() {\n    allowedDuration\
  \ := totalDuration * time.Second\n\n    ctx, cancel := context.WithTimeout(context.Background(),\
  \ allowedDuration)\n    defer cancel()\n\n    name, err := getNameContext(ctx)\n\
  \n    if err != nil && !errors.Is(err, context.DeadlineExceeded) {\n        fmt.Fprintf(os.Stdout,\
  \ \"%v\\n\", err)\n        os.Exit(1)\n    }\n    fmt.Fprintln(os.Stdout, name)\n\
  }\n```\n\n该函数使用 `context.WithTimeout()` 函数创建一个新的上下文。`context.WithTimeout()` 函数接受两个参数：第一个是父级\
  \ `Context` 对象，第二个是 `time.Duration` 对象，指定了时间（以毫秒、秒或分钟为单位），在此时间之后上下文将过期。在这里，我们将等待时间设置为\
  \ 5 秒：\n\n```\nallowedDuration := totalDuration * time.Second\n```\n\n接下来，我们创建一个\
  \ `Context` 对象：\n\n```\nctx, cancel := context.WithTimeout(context.Background(),\
  \ allowedDuration)\ndefer cancel()\n```\n\n由于我们没有其他可以充当父上下文的角色，我们使用 `context.Background()`\
  \ 创建一个新的空上下文。`WithTimeout()` 返回两个值：创建的上下文 `ctx` 和取消函数 `cancel`。有必要在 `defer` 语句中调用取消函数，以确保它在函数返回之前总是被调用。然后我们以如下方式调用\
  \ `getNameContext()`：\n\n```\nname, err := getNameContext(ctx)\n```\n\n如果返回的错误是预期的\
  \ `context.DeadlineExceeded`，我们不向用户显示它，而是直接显示名称；否则，我们显示错误并以非零状态码退出：\n\n```\nf err\
  \ != nil && !errors.Is(err, context.DeadlineExceeded) {\n        fmt.Fprintf(os.Stdout,\
  \ \"%v\\n\", err)\n        os.Exit(1)\n}\nfmt.Fprintln(os.Stdout, name)\n```\n\n\
  现在来看 `getNameContext()` 函数：\n\n```\nfunc getNameContext(ctx context.Context) (string,\
  \ error) {\n    var err error\n    name := \"Default Name\"\n    c := make(chan\
  \ error, 1)\n\n    go func() {\n        name, err = getName(os.Stdin, os.Stdout)\n\
  \        c <- err\n    }()\n\n    select {\n    case <-ctx.Done():\n        return\
  \ name, ctx.Err()\n    case err := <-c:\n        return name, err\n    }\n}\n```\n\
  \n该函数的实现思路如下：\n\n1.  在 goroutine 中执行 `getName()` 函数。\n2.  一旦函数返回，将错误值写入通道。\n3. \
  \ 创建一个 `select..case` 块，用于等待两个通道上的读取操作：\n    1.  `ctx.Done()` 写入信号的通道。\n    2. \
  \ 当 `getName()` 函数返回值时写入信号的通道。\n4.  根据上述步骤 a 或 b 哪一个先完成，要么返回默认名称和上下文超时错误，要么返回 `getName()`\
  \ 函数产生的值。\n\n完整代码显示在 Listing 2.7 中。\n\n创建一个新目录 `chap2/user-input`：\n\n```\nmkdir\
  \ -p chap2/user-input\ncd chap2/user-input\n```\n\n初始化模块：\n\n```bash\ngo mod init\
  \ user-input\n```\n\n创建 `main.go` 文件（将上面的代码粘贴进去）。编译：\n\n```bash\ngo build -o application\n\
  ```\n\n运行程序：\n\n```bash\n./application\n```\n\n如果你不输入名称，你会看到：\n\n再次运行：\n\n```bash\n\
  ./application\n```\n\n如果你输入了名称，你会看到：\n\n```\nDefault Name\n```\n\n这样，你就学会了使用 `WithTimeout()`\
  \ 创建上下文。另一方面，`WithDeadline()` 函数适用于你想相对于当前时间设置截止期限。\n\n### 处理用户信号\n\n用户信号是用户中断程序正常运行的一种。Linux\
  \ 和 MacOS 中两种常用的用户信号：按下 Ctrl+C 组合键时的 `SIGINT` 以及执行 `kill` 命令时的 `SIGTERM`。我们希望用户能够在任何时候取消。\n\
  \n我们之前提到过某些标准库函数接受上下文。让我们看看 `os/exec` 包中的 `CommandContext()` 是如何工作的。其中一种非常有用的情况是，你想设置一个最大时间。同样，可以使用通过\
  \ `WithTimeout()` 创建的上下文来实现：\n\n```go\npackage main\n\nimport (\n    \"context\"\
  \n    \"fmt\"\n    \"os\"\n    \"os/exec\"\n    \"time\"\n)\n\nfunc main() {\n \
  \   ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)\n \
  \   defer cancel()\n    if err := exec.CommandContext(ctx, \"sleep\", \"20\").Run();\
  \ err != nil {\n        fmt.Fprintln(os.Stdout, err)\n    }\n}\n```\n\n在 Linux/MacOS\
  \ 上运行上述代码会导致以下错误：\n\n```\nsignal: killed\n```\n\n\n\n2. Настройте обработчик сигналов,\
  \ который создаст обработчик сигналов `SIGINT` и `SIGTERM`. Когда один из сигналов\
  \ получен, код обработки сигнала вручную вызовет функцию отмены, возвращенную на\
  \ шаге 1.\n\n3. Выполните внешнюю программу с помощью функции `CommandContext()`,\
  \ используя контекст, созданный на шаге 1.\n\n#### Шаг 1 реализован в функции `createContextWithTimeout()`:\n\
  \n```go\nfunc createContextWithTimeout(d time.Duration) (context.Context, context.CancelFunc)\
  \ {\n    ctx, cancel := context.WithTimeout(context.Background(), d)\n    return\
  \ ctx, cancel\n}\n```\n\nФункция `WithTimeout()` из пакета контекста вызывается\
  \ для создания контекста, который отменяется, когда истекает указанная единица времени\
  \ `d`. Первый параметр — это пустой ненулевой контекст, созданный вызовом функции\
  \ `context.Background()`. Возвращаются контекст, `ctx`, и функция отмены, `cancel`.\
  \ Мы не вызываем здесь функцию отмены, так как нам нужен контекст на протяжении\
  \ всего жизненного цикла программы.\n\n#### Шаг 2 реализован в функции `setupSignalHandler()`:\n\
  \n```go\nfunc setupSignalHandler(w io.Writer, cancelFunc context.CancelFunc) {\n\
  \    c := make(chan os.Signal, 1)\n    signal.Notify(c, syscall.SIGINT, syscall.SIGTERM)\n\
  \    go func() {\n        s := <-c\n        fmt.Fprintf(w, \"Got signal:%v\\n\"\
  , s)\n        cancelFunc()\n    }()\n}\n```\n\nЭта функция создает способ обработки\
  \ сигналов `SIGINT` и `SIGTERM`. Канал емкостью 1 создается с типом `Signal` (определен\
  \ в пакете `os`). Затем мы вызываем функцию `Notify()` из пакета сигналов, чтобы\
  \ настроить канал прослушивания для сигналов `syscall.SIGINT` и `syscall.SIGTERM`.\
  \ Мы настроили горутину для ожидания этого сигнала. Когда мы его получаем, мы вызываем\
  \ функцию `cancelFunc()`, которая является функцией отмены контекста, соответствующей\
  \ созданному выше `ctx`. Когда мы вызываем эту функцию, реализация `os.execCommandContext()`\
  \ распознает это и в конечном итоге принудительно уничтожает команду. Конечно, если\
  \ сигнал `SIGINT` или `SIGTERM` не получен, команда может выполняться нормально\
  \ в соответствии с определенным контекстом, `ctx`.\n\n#### Шаг 3 реализуется следующей\
  \ функцией:\n\n```go\nfunc executeCommand(ctx context.Context, command string, arg\
  \ string) error {\n    return exec.CommandContext(ctx, command, arg).Run()\n}\n\
  ```\n\nПолная программа показана в Листинге 2.8.\n\nФункция `main()` начинает с\
  \ проверки того, указано ли ожидаемое количество аргументов. Здесь мы реализуем\
  \ базовый пользовательский интерфейс и ожидаем, что приложение будет выполняться\
  \ как `./application sleep 60`, где `sleep` — это выполняемая команда, а `60` —\
  \ аргумент команды. Затем мы сохраняем команду, которую нужно выполнить, и аргумент\
  \ к ней в двух строковых переменных: `command` и `arg`. Затем вызывается функция\
  \ `createContextWithTimeout()` с объектом длительности, указывающим 30-секундный\
  \ таймаут. Функция возвращает контекст, `ctx`, и функцию отмены контекста, `cancel`.\
  \ В следующем операторе мы вызываем функцию в отложенном вызове.\n\nЗатем мы вызываем\
  \ функцию `setupSignalHandler()`, передавая ей два параметра: `os.Stdout` и функцию\
  \ отмены контекста, `cancel`.\n\nНаконец, мы вызываем функцию `executeCommand()`\
  \ с созданным объектом контекста, `ctx`; команда для выполнения, `command`; и аргумент\
  \ команды, `arg`. Если возвращается ошибка, она печатается.\n\nСоздайте новый каталог,\
  \ `chap2/user-signal`, и инициализируйте в нем модуль:\n\n```bash\n$ mkdir -p chap2/user-signal\n\
  $ cd chap2/user-signal\n$ go mod init github.com/username/user-signal\n```\n\nЗатем\
  \ сохраните Листинг 2.8 как новый файл `main.go` и соберите его:\n\n```bash\n$ go\
  \ build -o application\n```\n\nУчитывая, что таймаут установлен на 30 секунд, давайте\
  \ попробуем выполнить команду `sleep` со значением времени сна:\n\n```bash\n% ./application\
  \ sleep 60\n^CGot signal:interrupt\nsignal: interrupt\n```\n\nМы просим команду\
  \ `sleep` заснуть на 60 секунд, но вручную прерываем ее, нажав Ctrl+C. Сообщение\
  \ об ошибке сообщает нам, как команда была прервана.\n\nДалее спим 10 секунд:\n\n\
  ```bash\n% ./application sleep 10\n```\n\nПоскольку 10 секунд меньше, чем время\
  \ ожидания контекста в 30 секунд, он завершается без ошибок. Наконец, давайте выполним\
  \ команду `sleep` на 31 секунду:\n\n```bash\n% ./listing7 sleep 31\nsignal: killed\n\
  ```\n\nТеперь мы видим, что контекст таймаута срабатывает и убивает процесс.\n\n\
  ## Резюме\n\nВ этой главе вы узнали о шаблонах для реализации масштабируемых приложений\
  \ командной строки. Вы узнали, как реализовать интерфейс на основе подкоманд для\
  \ вашего приложения, и вы использовали его для разработки масштабируемых приложений.\n\
  \n中文译文：\n\n[content]\n2. 配置一个信号处理器，以创建 `SIGINT` 和 `SIGTERM` 信号处理器。当接收到其中一个信号时，信号处理代码将手动调用第\
  \ 1 步返回的取消函数。\n\n3. 使用 `CommandContext()` 函数执行外部程序，使用第 1 步中创建的上下文。\n\n#### 步骤 1\
  \ 在函数 `createContextWithTimeout()` 中实现：\n\n```go\nfunc createContextWithTimeout(d\
  \ time.Duration) (context.Context, context.CancelFunc) {\n    ctx, cancel := context.WithTimeout(context.Background(),\
  \ d)\n    return ctx, cancel\n}\n```\n\n调用 context 包中的 `WithTimeout()` 函数用于创建一个上下文，该上下文在指定的时间单位\
  \ `d` 到期时被取消。第一个参数是通过调用函数 `context.Background()` 创建的非空上下文。返回的是上下文 `ctx` 和取消函数 `cancel`。我们在此处不调用该取消函数，因为我们需要在整个程序的生命周期内都使用该上下文。\n\
  \n#### 步骤 2 在函数 `setupSignalHandler()` 中实现：\n\n```go\nfunc setupSignalHandler(w\
  \ io.Writer, cancelFunc context.CancelFunc) {\n    c := make(chan os.Signal, 1)\n\
  \    signal.Notify(c, syscall.SIGINT, syscall.SIGTERM)\n    go func() {\n      \
  \  s := <-c\n        fmt.Fprintf(w, \"Got signal:%v\\n\", s)\n        cancelFunc()\n\
  \    }()\n}\n```\n\n该函数创建处理 `SIGINT` 和 `SIGTERM` 信号的方法。创建一个容量为 1 类型为 `Signal`（定义在\
  \ `os` 包中）的通道。然后调用 signal 包中的 `Notify()` 函数，为 `syscall.SIGINT` 和 `syscall.SIGTERM`\
  \ 信号配置监听通道。我们启动了一个 goroutine 来等待这些信号。当我们接收到信号时，调用 `cancelFunc()`，它是对应上面创建的 `ctx`\
  \ 的上下文取消函数。当我们调用此函数时，`os.execCommandContext()` 的实现会识别这一点并最终强制杀死命令。当然，如果没有接收到 `SIGINT`\
  \ 或 `SIGTERM` 信号，命令将根据定义的上下文 `ctx` 正常运行。\n\n#### 步骤 3 由以下函数实现：\n\n```go\nfunc executeCommand(ctx\
  \ context.Context, command string, arg string) error {\n    return exec.CommandContext(ctx,\
  \ command, arg).Run()\n}\n```\n\n完整程序显示在 列表 2.8 中。\n\n`main()` 函数从检查是否指定了预期参数数量开始。在这里我们实现了基础的用户界面，并预期应用程序以\
  \ `./application sleep 60` 运行，其中 `sleep` 是要执行的命令，而 `60` 是命令参数。然后我们将需要执行的命令及其参数保存在两个字符串变量中：`command`\
  \ 和 `arg`。接着调用 `createContextWithTimeout()` 函数，传入指定 30 秒超时的持续对象。该函数返回上下文 `ctx` 和上下文取消函数\
  \ `cancel`。在后续的语句中，我们在延迟调用中执行该函数。\n\n然后我们调用 `setupSignalHandler()` 函数，传递两个参数：`os.Stdout`\
  \ 和上下文取消函数 `cancel`。\n\n最后，我们调用 `executeCommand()` 函数，传入创建的上下文对象 `ctx`；要执行的命令 `command`\
  \ 以及命令参数 `arg`。如果返回错误，则将其打印。\n\n创建一个新目录 `chap2/user-signal` 其中初始化模块：\n\n```bash\n\
  $ mkdir -p chap2/user-signal\n$ cd chap2/user-signal\n$ go mod init github.com/username/user-signal\n\
  ```\n\n然后将 列表 2.8 保存为新文件 `main.go` 并编译它：\n\n```bash\n$ go build -o application\n\
  ```\n\n考虑到超时被设置为 30 秒，让我们尝试执行带有睡眠时间参数的 `sleep` 命令：\n\n```bash\n% ./application sleep\
  \ 60\n^CGot signal:interrupt\nsignal: interrupt\n```\n\n我们要求 `sleep` 命令睡眠 60 秒，但通过按下\
  \ Ctrl+C 手动中断了它。错误信息告诉我们命令是如何被中断的。\n\n接下来睡眠 10 秒：\n\n```bash\n% ./application sleep\
  \ 10\n```\n\n由于 10 秒小于上下文 30 秒的等待时间，它将无错误地退出。最后，让我们运行 31 秒的 `sleep` 命令：\n\n```bash\n\
  % ./listing7 sleep 31\nsignal: killed\n```\n\n现在我们看到超时上下文触发并杀死了进程。\n\n## 总结\n\n\
  在本章中，你学习了实现可扩展命令行应用程序的模式。你学习了如何为你的应用程序实现基于子命令的接口，并用它开发了可扩展的应用程序。\n\n\n\n关于数据下载应用程序，测试必须检查\
  \ `fetchRemoteResource()` 函数是否能成功返回指定 URL 的可用数据。如果 URL 无效或不可用，它应该返回错误值。我们该如何配置一个用于提供测试内容的测试\
  \ HTTP 服务器呢？`net/http/httptest` 包中的 `NewServer()` 函数将为我们帮助。以下代码片段定义了 `startTestHTTPServer()`\
  \ 函数，该函数启动一个 HTTP 服务器，对任何请求都返回 \"Hello World\" 响应：\n\n```\nfunc startTestHTTPServer()\
  \ *httptest.Server {\n    ts := httptest.NewServer(\n        http.HandlerFunc(\n\
  \            func(w http.ResponseWriter, r *http.Request) {\n                fmt.Fprint(w,\
  \ \"Hello World\")\n            }))\n    return ts\n}\n```\n\n`httptest.NewServer()`\
  \ 函数返回一个包含多个字段的 `httptest.Server` 对象，这些字段表示创建的服务器。该函数的唯一参数是类型为 `http.Handler` 的对象（你将在第\
  \ 6 章“高级 HTTP 服务器”中了解到更多信息）。这个处理程序对象允许我们为测试服务器配置所需的处理程序。在这种情况下，我们创建了一个通用处理程序，它会对任何\
  \ HTTP 请求返回字符串 \"Hello World\" 字符串，而不仅仅是 GET 请求。隐式地，对该服务器的所有请求都将获得 HTTP 200 成功状态。\n\
  \n使用上面的函数，现在我们可以编写测试函数了，如列表 3.2 所示。\n\n测试函数从调用 `startTestHTTPServer()` 创建测试服务器开始。返回的对象\
  \ `ts` 包含了与运行的测试服务器相关的数据。在 `defer` 语句中调用 `Close()` 方法可确保服务器在测试完成时停止。返回对象 `ts` 中的\
  \ `URL` 字段包含表示服务器 IP 地址和端口组合的字符串值。它作为参数传递给函数 `fetchRemoteResource()`。然后测试的其余部分检查返回的数据是否符合预期的字符串\
  \ \"Hello World\"。将列表 3.2 保存到新文件 `fetch_remote_resource:test.go` 中，该文件与列表 3.1 位于同一目录下。使用\
  \ `go test` 运行测试：\n\n```\n$ go test -v\n=== RUN   TestFetchRemoteResource\n--- PASS:\
  \ TestFetchRemoteResource (0.00s)\nPASS\nok          github.com/practicalgo/code/chap3/data-downloader\
  \        0.872s\n```\n\n太棒了。你通过 HTTP 实现了一个基础的数据下载器，并且通过从远程 URL 下载数据以及为其编写测试，确保了它的正常工作。\n\
  \n在本章的第一个练习中，练习 3.1 中，你将通过添加此功能来扩展命令行应用程序 `mync`。\n\n## 获取数据的反序列化\n\n我们编写的 `fetchRemoteResource()`\
  \ 函数仅仅是将下载的数据显示在终端中。这对于应用程序用户来说可能没有任何意义，并且对于某些数据类型（例如，图像和非文本文件）只会显示为乱码。在大多数情况下，你可能希望对数据进行某些处理。这种处理通常被称为数据的*反序列化*（unmarshalling\
  \ 或 deserialization），它涉及将字节数据转换为应用程序可以理解的数据结构。然后，你就可以在应用程序中对该数据结构执行任何操作，而无需请求或分析原始字节。反向操作是*序列化*（marshalling\
  \ 或 serialization），这是将数据结构转换为可以存储或通过网络传输的格式的有效方法。在本节中重点讨论反序列化。\n\n\n\n\n创建一个新目录\
  \ `chap3/pkgquery` 并在其中初始化模块：\n\n```bash\n$ mkdir -p chap3/pkgquery\n$ cd chap3/pkgquery\n\
  $ go mod init github.com/username/pkgquery\n```\n\n将 Listing 3.3 保存为文件 `pkgquery.go`。\n\
  \n### 如何检查 `pkgquery` 包的功能性？\n\n我们可以实现 `main` 包并请求一个虚构包服务器的实现。作为替代方案，我们可以实现一个测试用的\
  \ HTTP 服务器，它以 JSON 格式返回数据，如之前所示。函数 `startTestPackageServer()` 实现了这样一个服务器：\n\n```go\n\
  func startTestPackageServer() *httptest.Server {\n    pkgData := `[\n{\"name\":\
  \ \"package1\", \"version\": \"1.1\"},\n{\"name\": \"package2\", \"version\": \"\
  1.0\"}\n]`\n    ts := httptest.NewServer(\n        http.HandlerFunc(\n         \
  \   func(w http.ResponseWriter, r *http.Request) {\n                w.Header().Set(\"\
  Content-Type\", \"application/json\")\n                fmt.Fprint(w, pkgData)\n\
  \            }))\n    return ts\n}\n```\n\n在实现测试服务器后，Listing 3.4 显示了完整的测试函数。\n\n\
  我们通过调用函数 `startTestPackageServer()` 启动测试 HTTP 服务器。然后，通过调用函数 `createHTTPClientWithTimeout()`\
  \ 创建 HTTP 客户端对象。接着，我们调用函数 `fetchPackageData()` 将 HTTP 客户端对象 `client` 和请求的 URL 作为参数。\n\
  \n最后，我们向服务器发送 GET 请求，服务器返回 JSON 格式的包数据。我们断言返回的错误为零，并获取一个包含两个元素的切片，对应于两个 `pkgData`\
  \ 对象。\n\n将 Listing 3.4 保存到与 `pkgquery.go` 同目录的新文件 `pkgquery_test.go` 中。运行测试：\n\n\
  ```bash\n$ go test -v\n=== RUN   TestFetchPackageData\n--- PASS: TestFetchPackageData\
  \ (0.00s)\nPASS\nok          github.com/practicalgo/code/chap3/pkgquery/       \
  \ 0.511s\n```\n\n正如预期，测试通过了。在更实际的场景中，你可以编写一个 HTTP 客户端来使用来自第三方服务器的数据。为此，你需要执行以下关键步骤：\n\
  \n1. 找到第三方服务器的 JSON API 模式。\n2. 创建用于反序列化响应数据的结构体。\n3. 使用步骤 1 实现测试服务器，以便实现完全可测试的\
  \ HTTP 客户端。\n\n你已经看到如何使用 `Content-Type` 头部来决定是应该反序列化数据还是忽略它们。你也可以使用它来判断数据是否可以在终端中读取，或者是否需要使用特殊软件（如图像查看器或\
  \ PDF 阅读器）进行读取。在 Exercise 3.2 中，你将实现 `http` 子命令的支持，用户能够将上传的数据写入文件。\n\n## 发送数据\n\n\
  让我们再次查看包服务器。我们已经知道可以通过 HTTP GET 请求查看现有的包数据。现在假设我们要向服务器上添加新的包数据。在服务器上创建或注册新包包括发送包本身（`.tar.gz`\
  \ 文件）以及一些元数据（名称和版本）。为了简单起见，假设包服务器没有任何状态管理，只要它包含正确格式的预期数据，就会成功响应所有请求。\n\n遵循 `REST`\
  \ 规范的 HTTP 协议允许使用 `POST`、`PUT` 或 `PATCH` 请求向服务器发送数据。`POST` 方法通常用于创建新资源。要使用 `POST`\
  \ 方法注册新包，我们需要执行以下操作：\n\n1. 使用 `net/http` 包中定义的 `Post` 函数发送 HTTP POST 请求：`http.Post(url,\
  \ contentType, packagePayload)`。其中 `url` 是发送 POST 请求的 URL 地址，`contentType` 是一个定义请求\
  \ `Content-Type` 头部值的字符串，最后 `packagePayload` 是一个包含要发送的请求体的 `io.Reader` 类型对象。\n2.\
  \ 这里的关键步骤是在一个请求体中同时发送二进制包数据和元数据。此时 HTTP `Content-Type` 头部 `multipart/form-data`\
  \ 将非常有用。\n\n首先，让我们看看如何发送一个仅包含元数据的 JSON 格式主体的 POST 请求。然后我们对其进行改进，以便在 `multipart/form-data`\
  \ 请求中发送包数据以及元数据。\n\n回想我们为描述包设计的 JSON 格式：\n\n```json\n// 示例格式\n```\n\n使用 `encoding/json`\
  \ 包中的 `Marshal` 函数将 `pkgData` 序列化为字节切片。如果发生错误，返回空的 `pkgRegisterResult` 和错误。\n\n\
  ```go\nb, err := json.Marshal(data)\nif err != nil {\n    return p, err\n}\n```\n\
  \n使用 `json.Unmarshal` 来反序列化响应：\n\n```go\ntype pkgRegisterResult struct {\n    ID\
  \      string `json:\"id\"`\n}\n```\n\n在 `registerPackageData` 函数中：\n\n```go\nfunc\
  \ registerPackageData(url string, data pkgData) (pkgRegisterResult, error) {\n \
  \   p := pkgRegisterResult{}\n    b, err := json.Marshal(data)\n    if err != nil\
  \ {\n        return p, err\n    }\n    reader := bytes.NewReader(b)\n    r, err\
  \ := http.Post(url, \"application/json\", reader)\n    if err != nil {\n       \
  \ return p, err\n    }\n    defer r.Body.Close()\n    // 处理响应逻辑...\n}\n```\n\n如果收到了成功响应，我们读取响应体并将其反反序列化为\
  \ `pkgRegisterResult`：\n\n```go\n    respData, err := io.ReadAll(r.Body)\n    if\
  \ err != nil {\n        return p, err\n    }\n    if r.StatusCode != http.StatusOK\
  \ {\n        return p, errors.New(string(respData))\n    }\n    err = json.Unmarshal(respData,\
  \ &p)\n    return p, err\n}\n```\n\n\n\n\n将代码列表 3.5 保存为新文件 `pkgregister.go`。如何检查这一切是否正常工作？我们将采用与上一个节类似的方法，实现一个行为类似于我们真实包服务器的测试服务器：\n\
  \n1. 实现一个处理 `POST` 请求的 HTTP 处理函数。\n2. 执行反序列化（unmarshalling）操作，将传入的 JSON 体转换为 `pkgData`\
  \ 对象。\n3. 如果反序列化过程中出错，或 `pkgData` 对象的 `Name` 或 `Version` 为空，则向客户端返回 HTTP 400 错误。\n\
  4. 通过 `-` 连接 `Name` 和 `Version` 来创建一个人工的包标识符 (`ID`)。\n5. 创建 `pkgRegisterResult`\
  \ 对象，并指定上一步创建的 `ID`。\n6. 序列化对象，将 `Content-Type` 头部设置为 `application/json`，并将序列化后的结果作为字符串响应返回。\n\
  \n接下来，你可以像下面所示以独立的处理函数形式看到上述步骤的实现。（你将在第 5 章中了解到更多关于处理函数的知识。）\n\n```go\nfunc packageRegHandler(w\
  \ http.ResponseWriter, r *http.Request) {\n    if r.Method == \"POST\" {\n     \
  \   // 入站包数据\n        p := pkgData{}\n\n        // 包注册响应\n        d := pkgRegisterResult{}\n\
  \        defer r.Body.Close()\n        data, err := io.ReadAll(r.Body)\n       \
  \ if err != nil {\n            http.Error(w, err.Error(), http.StatusInternalServerError)\n\
  \            return\n        }\n        err = json.Unmarshal(data, &p)\n       \
  \ if err != nil || len(p.Name) == 0 || len(p.Version) == 0 {\n            http.Error(w,\
  \ \"Bad Request\", http.StatusBadRequest)\n            return\n        }\n     \
  \   d.ID = p.Name + \"-\" + p.Version\n        jsonData, err := json.Marshal(d)\n\
  \        if err != nil {\n            http.Error(w, err.Error(), http.StatusInternalServerError)\n\
  \            return\n        }\n        w.Header().Set(\"Content-Type\", \"application/json\"\
  )\n        fmt.Fprint(w, string(jsonData))\n    } else {\n        http.Error(w,\
  \ \"Invalid HTTP method specified\", http.StatusMethodNotAllowed)\n        return\n\
  \    }\n}\n```\n\n你可以在代码列表 3.6 中找到测试函数的实现。我们有两个测试：一个用于检查“快乐路径”（happy path），即向包服务器发送预期的包注册数据；另一个用于发送空的\
  \ JSON 体。\n\n将代码列表 3.6 保存到同一目录下的新文件 `pkgregister_test.go` 中，该目录包含代码列表 3.5\n=== RUN\
  \   TestRegisterEmptyPackageData\n--- PASS: TestRegisterEmptyPackageData (0.00s)\n\
  PASS\nok          github.com/practicalgo/code/chap3/pkgregister        0.540s\n\
  ```\n\n在本节中，你学习了如何使用序列化和反序列化方法发送和接收 JSON 数据。现在，你将将其用于 `mync http` 子命令对 POST 请求的支持（练习\
  \ 3.3）。\n\n在本节中学的 JSON 数据处理方法也适用于另一种流行的格式 XML，它由 `encoding/xml` 包支持。回到包注册，我们看到了如何以\
  \ JSON 格式体发送包名称和版本。然而，我们还没有看到如何将包数据一起发送。让我们看看如何使用 `multipart/form-data` 类型。\n\n\
  ## 二进制数据处理\n\n`multipart/form-data` MIME 类型允许发送一个包含键值对（如 `name=package1` 和 `version=1.1`）以及其他数据（如文件内容）的\
  \ HTTP 请求体。如你所知，在将其发送到服务器之前，创建这个体需要大量工作。\n\n在我们学习如何创建 `multipart/form-data` 消息之前，让我们看看这样的消息看起来什么样：\n\
  \n```\n--91f7de347fb9749c83cea1d596e52849fb0a95f6698459e2baab1e6c1e22\nContent-Disposition:\
  \ form-data; name=\"name\"\n \nmypackage\n--91f7de347fb9749c83cea1d596e52849fb0a95f6698459e2baab1e6c1e22\n\
  ```\n\n\n\n接着, давайте рассмотрим функцию `registerPackageData()`, которая вызывает\
  \ функцию `createMultiPartMessage()` для создания полезной нагрузки типа `multipart/form-data`:\n\
  \n```go\ntype pkgRegisterResult struct {\n    Id       string `json:\"id\"`\n  \
  \  Filename string `json:\"filename\"`\n    Size int64 `json:\"size\"`\n}\n\nfunc\
  \ registerPackageData(\n    client *http.Client, url string, data pkgData,\n) (pkgRegisterResult,\
  \ error) {\n\n    p := pkgRegisterResult{}\n    payload, contentType, err := createMultiPartMessage(data)\n\
  \    if err != nil {\n        return p, err\n    }\n    reader := bytes.NewReader(payload)\n\
  \    r, err := http.Post(url, contentType, reader)\n    if err != nil {\n      \
  \  return p, err\n    }\n    defer r.Body.Close()\n    respData, err := io.ReadAll(r.Body)\n\
  \    if err != nil {\n        return p, err\n    }\n    err = json.Unmarshal(respData,\
  \ &p)\n    return p, err\n}\n```\n\nМы вызываем функцию `createMultiPartMessage()`,\
  \ которая возвращает нам данные `payload` и тип контента `contentType`. Затем мы\
  \ создаем объект `io.Reader` для чтения `payload` и отправляем HTTP POST запрос,\
  \ вызывая функцию `http.Post()`. После этого мы читаем ответ и десериализуем его\
  \ в объект `pkgRegisterResult, p`. Обратите внимание, мы добавили в структуру `pkgRegisterResult`\
  \ два новых поля для указания имени файла пакета и размера отправленного файла.\
  \ Это позволит нам убедиться, что сервер успешно прочитал данные.\n\nВ Listing 3.8\
  \ показана полная реализация пакета `pkgregister`, в которой используется функция\
  \ `createMultiPartMessage()`.\n\nСохраните Listing 3.8 в качестве нового файла `pkgregister.go`\
  \ в том же каталоге, что и Listing 3.7. Чтобы протестировать этот пакет, мы реализуем\
  \ тестовый сервер, который принимает регистрационные данные пакета, отправленные\
  \ в сообщении `multipart/form-data`, и отправляет ответ в формате JSON. Ключевая\
  \ функциональность этого тестового сервера будет реализована в методе `ParseMultipartForm()`,\
  \ определенном для объекта `http.Request`. Этот метод анализирует тело запроса,\
  \ закодированное как сообщение `multipart/form-data`, и автоматически предоставляет\
  \ доступ к встроенным данным через объект типа `multipart.Form`, определенный в\
  \ пакете `mime/multipart`. Этот тип определен следующим образом:\n\n```go\ntype\
  \ Form struct {\n    Value map[string][]string\n    File  map[string][]*FileHeader\n\
  }\n```\n\nПоле `Value` — это карта, содержащая имена полей формы в качестве ключей\
  \ и их значения в виде slice строк. Форма может иметь несколько значений для одного\
  \ имени поля. Поле `File` представляет собой карту, ключом которой является имя\
  \ поля (например, `filedata`), а срез объектов представляет данные о каждом файле\
  \ в виде объекта `FileHeader`. Тип `FileHeader` определен следующим образом:\n\n\
  ```go\ntype FileHeader struct {\n    Filename string\n    Header   textproto.MIME\n\
  \    Size     int64\n}\n```\n\nИмена полей говорят сами за себя. Таким образом,\
  \ пример объекта типа будет выглядеть так:\n\n```json\n{\"Filename\": \"package1.tar.gz\"\
  , \"Header\": map[string]string{\"Content-Type\":\"application/octet-stream\"},\
  \ \"Size\": \"200\"}\n```\n\nКак мы получим данные? Объект `FileHeader` определяет\
  \ метод `Open()`, который возвращает объект `File`. Затем его можно использовать\
  \ для чтения данных, хранящихся в файле. Давайте рассмотрим функцию-обработчик:\n\
  \n```go\nfunc packageRegHandler(w http.ResponseWriter, r *http.Request) {\n    if\
  \ r.Method == \"POST\" {\n        d := pkgRegisterResult{}\n        err := r.ParseMultipartForm(5000)\n\
  \        if err != nil {\n            http.Error(w, err.Error(), http.StatusBadRequest)\n\
  \            return\n        }\n        mForm := r.MultipartForm\n        f := mForm.File[\"\
  filedata\"][0]\n        d.ID = fmt.Sprintf(\"%s-%s\", mForm.Value[\"name\"][0],\
  \ mForm.Value[\"version\"][0])\n        d.Filename = f.Filename\n        d.Size\
  \ = f.Size\n        jsonData, err := json.Marshal(d)\n        if err != nil {\n\
  \            http.Error(w, err.Error(), http.StatusInternalServerError)\n      \
  \      return\n        }\n        w.Header().Set(\"Content-Type\", \"application/json\"\
  )\n        fmt.Fprint(w, string(jsonData))\n    } else {\n        http.Error(w,\
  \ \"Invalid HTTP method\", http.StatusMethodNotAllowed)\n        return\n    }\n\
  }\n```\n\nС самого начала мы видим вызов ключевой функции: `err := r.ParseMultipartForm(5000)`,\
  \ где `5000` — это максимальное количество байт, которые будут буферизированы в\
  \ памяти. Если мы получаем ненулевую ошибку, мы возвращаем ошибку 400 Bad Request.\
  \ Если ошибки нет, мы получаем доступ к `MultipartForm`, извлекаем первый файл из\
  \ `filedata`, формируем `ID` на основе `name` и `version`, а также устанавливаем\
  \ `Filename` и `Size`. Затем мы сериализуем `d` в JSON, устанавливаем заголовок\
  \ `Content-Type: application/json` и отправляем данные в ответе. Если метод не POST,\
  \ мы возвращаем ошибку 405 Method Not Allowed.\n\n\n\n创建一个新目录 `chap4/data-downloader`。从\
  \ `chap3/data-downloader` 复制所有文件。按照如下方式更新 `go.mod` 文件：\n\n```\nmodule github.com/username/chap4/data-downloader\n\
  \ \ngo 1.16\n```\n\n然后，将 列表 4.1 保存到新文件 `fetch_remote_resource:bad_server_test.go`\
  \ 并运行测试：\n\n```\n$ go test -v\n=== RUN   TestFetchBadRemoteResource\n--- PASS: TestFetchBadRemoteResource\
  \ (60.00s)\n=== RUN   TestFetchRemoteResource\n--- PASS: TestFetchRemoteResource\
  \ (0.00s)\nPASS\nok          github.com/practicalgo/code/chap4/data-downloader \
  \   60.142s\n```\n\n如你所见，`TestFetchBadRemoteResource` 测试现在耗时 60 秒。实际上，如果故障服务器在发送响应之前睡眠了\
  \ 600 秒，那么我们在 `fetchRemoteResource()` 中的客户端代码（列表 3.1）也将等待同样的时间。你可以想象，这会导致非常糟糕的用户体验。\n\
  \n我们在 第 2 章 中讨论过确保应用程序健壮性的主题。现在，让我们看看如何优化数据下载函数，使其在服务器响应时间超过指定时长时不再无限期等待。\n\n要让我们的数据下载器只等待指定的最长时间，解决办法是使用自定义的\
  \ HTTP 客户端。当我们使用 `http.Get()` 函数时，我们隐式地使用了 `net/http` 包中定义的默认 HTTP 客户端。默认客户端通过变量\
  \ `DefaultClient` 访问，其定义方式为 `var DefaultClient = &Client{}`。`Client` 结构体定义在 `net/http`\
  \ 包中，我们可以在它的字段中配置 HTTP 客户端的各种属性。现在我们查看 `Timeout` 字段，稍后我们将考虑另一个字段——`Transport`。\n\
  \n`Timeout` 的值为 `time.Duration` 对象，它本质上指定了客户端允许连接服务器、发送请求和读取响应的最大持续时间。如果不指定，则不限制最大时长，因此客户端将一直等待服务器响应或连接被断开。例如，要创建一个具有\
  \ 100 毫秒超时时间的 HTTP 客户端，你可以使用以下语句：\n\n```\nclient := http.Client{Timeout: 100 * time.Millisecond}\n\
  ```\n\n该语句将允许通过客户端执行的 HTTP 请求最多耗时 100 毫秒。使用自定义客户端后，`fetchRemoteResource()` 函数现在看起来如下：\n\
  \n```\nfunc fetchRemoteResource(\n    client *http.Client, url string,\n) ([]byte,\
  \ error) {\n    r, err := client.Get(url)\n    if err != nil {\n        return nil,\
  \ err\n    }\n    defer r.Body.Close()\n    return io.ReadAll(r.Body)\n}\n```\n\n\
  请注意，我们不再直接调用 `http.Get()` 函数，而是调用了传递给 `fetchRemoteResource()` 的 `http.Client` 对象的\
  \ `Get()` 方法。列表 4.2 显示了完整的应用程序代码。我们定义了新函数 `createHTTPClientTimeout()` 来创建一个带有指定\
  \ `time.Duration` 超时时间的自定义 HTTP 客户端。在 `main()` 函数中，我们创建了一个配置了 15 秒等待时间的自定义客户端，然后将客户端和指定的\
  \ URL 传递给 `fetchRemoteResource()`。将 Listing 4.2 保存为新目录 `chap4/data-downloader` 中的新文件\
  \ `main.go`，并在其中初始化模块：\n\n```\n$ mkdir -p chap4/data-downloader\n$ go mod init github.com/username/data-downloader\n\
  ```\n\n与其尝试构思一个糟糕的 HTTP 服务器来测试超时，不如通过编写测试用例来实现。\n\n### 测试超时行为\n\n我们可以更新 列表 4.1 中的测试，使其看起来像\
  \ 列表 4.3 所示。`startBadTestHTTPServer()`（在 列表 4.1 和 列表 4.3 中）已重命名为 `startBadTestHTTPServerV1()`。其他关键变化如下：\n\
  \n1. 我们通过调用 `createHTTPClientTimeout()` 函数创建一个 `http.Client` 对象。然后将该对象传递给 `fetchRemoteResource()`\
  \ 函数。\n2. 我们断言错误信息包含特定的子字符串，指示客户端关闭了与服务器的连接。\n\n我们将 列表 4.3 保存为新文件。\n\n\n\n测试执行仅需\
  \ 0.2 秒（或 200 毫秒），这与我们为测试客户端设置的超时时间一致。现在发生了什么？在测试函数完成之前，首先会调用一个匿名函数，该函数向 `shutdownServer`\
  \ 通道写入结构体的空值。这会释放测试服务器的处理程序。因此，当调用 `Close()` 方法时，它会关闭测试服务器并成功退出。此时，测试函数的执行完成。\n\n\
  为你的 HTTP 客户端设置超时是配置 HTTP 客户端的一种方法。接下来，你将学习另一个可能也想要配置的方面——当服务器响应重定向时会发生什么？\n\n###\
  \ 配置重定向行为（处理重定向）\n\n#### 配置重定向行为\n\n当服务器发出 HTTP 重定向时，HTTP 客户端默认会自动且静默地`执行`重定向，最多\
  \ 10 次，然后停止工作。如果你想更改这一点，例如完全不跟随重定向，或者至少让你知道它正在跟随重定向，该怎么办？这可以通过设置 `http.Client` 对象中的另一个字段\
  \ `CheckRedirect` 来实现。如果设置了符合特定签名的函数，则在决定是否重定向时会调用该对象。然后，你可以在那里实现自己的自定义逻辑。让我们来看这种函数是如何实现的示例：\n\
  \n```\nfunc redirectPolicyFunc(req *http.Request, via []*http.Request) error {\n\
  \    if len(via) >= 1 {\n        return errors.New(\"stopped after 1 redirect\"\
  )\n    }\n    return nil\n}\n```\n\n实现重定向策略的自定义函数必须满足以下签名：\n\n```\nfunc (req *http.Request,\
  \ via []*http.Request) error\n```\n\n第一个参数 `req` 是从服务器收到的执行重定向的请求；切片 `via` 包含到目前为止发送的请求，其中最旧的请求（你的原始请求）是该切片的第一个元素。通过以下步骤可以更好地说明这一点：\n\
  \n1. HTTP 客户端向原始 URL `url` 发送请求。\n2. 服务器响应重定向，例如重定向到 `url1`。\n3. `redirectPolicyFunc`\
  \ 现在带有 `(url1, []{url})` 被调用。\n4. 如果函数返回空错误，它将跟随重定向并向 `url1` 发送新请求。\n5. 如果存在指向 `url2`\
  \ 的另一个重定向，`redirectPolicyFunc` 带有 `(url2, []{url, url1})` 被调用。\n6. 重复步骤 3、4 和 5，直到\
  \ `redirectPolicyFunc` 返回非空错误为止。\n\n因此，如果你使用 `redirectPolicyFunc()` 作为自定义重定向策略函数，它将完全不会解析重定向。你如何将其连接到自定义的\
  \ HTTP 客户端？你可以按照以下方式操作：\n\n```\nfunc createHTTPClientWithTimeout(d time.Duration)\
  \ {\n    client := &http.Client{\n        Timeout: d,\n        CheckRedirect: redirectPolicyFunc,\n\
  \    }\n}\n```\n\n#### 创建带有超时时间的 HTTP 客户端的示例\n\n```go\nfunc createHTTPClientWithTimeout(d\
  \ time.Duration) *http.Client {\n    client := &http.Client{\n        Timeout: d,\n\
  \        CheckRedirect: redirectPolicyFunc,\n    }\n    return client\n}\n```\n\n\
  #### 使用重定向策略函数\n\n```go\nfunc redirectPolicyFunc(req *http.Request, via []*http.Request)\
  \ error {\n    if len(via) >= 1 {\n        return errors.New(\"stopped after 1 redirect\"\
  )\n    }\n    return nil\n}\n```\n\n#### 配置带有上下文和请求头的请求\n\n```go\nfunc createGetRequest(ctx\
  \ context.Context, url string, headers map[string]string) (*http.Request, error)\
  \ {\n    req, err := http.NewRequestWithContext(ctx, \"GET\", url, nil)\n    if\
  \ err != nil {\n        return nil, err\n    }\n    for k, v := range headers {\n\
  \        req.Header.Add(k, v)\n    }\n    return req, err\n}\n```\n\n#### 执行请求的示例\n\
  \n```go\nclient := createHTTPClientWithTimeout(20 * time.Millisecond)\nctx, cancel\
  \ := context.WithTimeout(context.Background(), 15*time.Millisecond)\ndefer cancel()\n\
  \nheaders := map[string]string{\"X-AUTH-HASH\": \"authhash\"}\nreq, err := createGetRequest(ctx,\
  \ \"https://example.com/api/packages\", headers)\nif err != nil {\n    log.Fatal(err)\n\
  }\nresp, err := client.Do(req)\n```\n\n#### 向请求中添加请求头\n\n```go\nreq.Header.Add(\"\
  X-AUTH-HASH\", \"authhash\")\n```\n\n\n\n在接下来的章节中，你将看到如何通过配置客户端对象来实现自定义中间件。首先，让我们查看\
  \ `Client` 结构体中的特定字段 `Transport`。\n\n### 理解 RoundTripper 接口\n\n`http.Client` 结构体如下定义\
  \ `Transport` 字段：\n\n```\ntype Client struct {\n    Transport RoundTripper\n \n\
  \    // 其他字段\n}\n```\n\n在 `net/http` 包中 `RoundTripper` 接口定义了一个类型，该类型将 HTTP 请求发送到远程服务器并将响应返回给客户端。该类型需要实现的唯一方法是\
  \ `RoundTrip()`：\n\n```\ntype RoundTripper interface {\n    RoundTrip(*Request)\
  \ (*Response, error)\n}\n```\n\n如果在创建客户端时没有指定 `Transport` 对象，将使用预定义的类型 `Transport`\
  \ 的默认对象 `DefaultTransport`。它的定义如下（省略了字段）：\n\n```go\nvar DefaultTransport RoundTripper\
  \ = &Transport{\n    // 字段已省略\n}\n```\n\n在 `net/http` 包中定义的 `Transport` 类型实现了 `RoundTripper`\
  \ 接口要求的 `RoundTrip()` 方法。它负责创建和管理基础传输控制协议（TCP）连接，HTTP 请求-响应事务通过这些连接进行传输：\n\n1. 你创建一个\
  \ `Client` 对象。\n2. 你创建一个 HTTP 请求 `Request`。\n3. 随后，HTTP 请求将通过 `RoundTripper` 的实现（例如通过\
  \ TCP 连接）“传输”到服务器，响应被传回。\n4. 如果你使用同一个客户端发送多个请求，步骤 2 和 3 将重复执行。\n\n为了实现客户端中间件，我们将编写一个自定义类型，封装\
  \ `RoundTripper` `DefaultTransport` 的实现。让我们来看看如何操作。\n\n### 日志记录中间件\n\n你编写的第一个中间件将在发送请求之前记录消息。它将在收到响应时记录另一条消息。首先，我们定义一个带有\
  \ `*log.Logger` 字段的 `LoggingClient` 结构体：\n\n```\ntype LoggingClient struct {\n \
  \   log *log.Logger\n}\n```\n\n为了满足 `RoundTripper` 接口，我们实现了 `RoundTrip()` 方法：\n\n\
  ```go\nfunc (c LoggingClient) RoundTrip(\n    r *http.Request,\n) (*http.Response,\
  \ error) {\n    c.log.Printf(\n        \"Sending a %s request to %s over %s\\n\"\
  ,\n        r.Method, r.URL, r.Proto,\n    )\n    resp, err := http.DefaultTransport.RoundTrip(r)\n\
  \    c.log.Printf(\"Got back a response over %s\\n\", resp.Proto)\n\n    return\
  \ resp, err\n}\n```\n\n当调用我们 `RoundTripper` 实现的 `RoundTrip()` 方法时，我们执行以下操作：\n\n\
  1. 记录传出的请求 `r`。\n2. 调用 `DefaultTransport` 类的 `RoundTrip()` 方法，并传入出的请求 `r`。\n3. 记录\
  \ `RoundTrip()` 返回的响应和错误。\n4. 返回响应和错误。\n\n太棒了。你定义了自己的 `RoundTripper`。现在，你如何使用它呢？创建一个\
  \ `Client` 对象并在 `Transport` 字段中设置 `LoggingClient` 对象：\n\n```go\nmyTransport := LoggingClient{}\n\
  client := http.Client{\n    Timeout:   10 * time.Second,\n    Transport: &myTransport,\n\
  }\n```\n\n列表 4.6 展示了用于使用此自定义 `RoundTripper` 实现的数据加载程序（列表 4.2）的修改版本。\n\n主要的修改已高亮显示。首先，我们创建一个新的\
  \ `LoggingClient` 对象。然后，我们通过调用 `log.New()` 函数创建一个新的 `log.Logger` 对象。函数的第一个参数是 `io.Writer`\
  \ 对象，日志将写入其中。在这里我们使用 `os.Stdout`。函数的第二个参数是添加到每条日志语句中的前缀字符串——这里指定了一个空字符串。函数的最后一个参数是标志——每行日志前缀的文本。在这里我们使用\
  \ `log.LstdFlags`，它将显示日期和时间。然后，我们将 `log.Logger` 对象赋值给 `myTransport` 对象的字段 `l`。最后，我们将\
  \ `client.Transport` 设置为 `&myTransport`。\n\n创建一个新的子目录 `chap4/logging-middleware`并将\
  \ 列表 4.6 保存到新文件 `main.go` 中。编译并运行它，将 HTTP 服务器的 URL 作为命令行参数传递：\n\n```\n$ go build\
  \ -o application\n$ ./application https://www.google.com\n2020/11/25 22:03:40 Sending\
  \ a GET request to https://www.google.com over HTTP/1.1\n2020/11/25 22:03:40 Got\
  \ back a response over HTTP/2.0\nBytes in response: 13583\n```\n\n正如预期的，首先出现记录语句，然后打印响应。你可以使用类似的自定义\
  \ `RoundTripper` 实现来创建指标，例如请求延迟或非 200 错误。你还可以用自定义的 `RoundTripper` 做什么？你可以编写一个 `RoundTripper`\
  \ 实现来自动缓存查找请求，例如完全不执行调用。\n\n在实现自定义 `RoundTripper` 时，有两点你需要注意：\n\n1. `RoundTripper`\
  \ 必须考虑到在任何时候可能运行多个实例。\n2. `RoundTripper` 不应修改请求或响应。\n\n### 为所有请求添加标头\n\n让我们考虑一个向每个请求添加一个或多个标头的中间件实现示例。你可能在不同的场景中需要这种功能。\n\
  \n首先，我们为中间件定义一个新类型：\n\n```go\ntype AddHeaders struct {\n    headers map[string]string\n\
  }\n```\n\n标头字段是一个包含我们想要添加到 `RoundTripper` 实现中的标头的映射：\n\n```go\nfunc (h AddHeaders)\
  \ RoundTrip(r *http.Request) (*http.Response, error) {\n    reqCopy := r.Clone(r.Context())\n\
  \    for k, v := range h.headers {\n        reqCopy.Header.Add(k, v)\n    }\n  \
  \  return http.DefaultTransport.RoundTrip(reqCopy)\n}\n```\n\n此中间件将通过添加标头来修改原始请求。而不是在原地修改它，我们使用\
  \ `Clone()` 方法克隆请求并对其添加标头。然后我们使用新请求调用 `DefaultTransport` `RoundTrip()`。\n\n列表 4.7\
  \ 展示了使用该中间件的 HTTP 客户端实现。为了验证指定的标头是否被添加到输出请求中，我们将一个测试服务器，它会将请求的标头作为响应的标头：\n\n```go\n\
  func startHTTPServer() *httptest.Server {\n    ts := httptest.NewServer(http.HandlerFunc(func(w\
  \ http.ResponseWriter, r *http.Request) {\n        for k, v := range r.Header {\n\
  \            w.Header().Set(k, v[0])\n        }\n        fmt.Fprint(w, \"I am the\
  \ Request Header echoing program\")\n    }))\n    return ts\n}\n```\n\n列表 4.8 展示了使用上述测试服务器的测试函数。我们创建一个\
  \ `testHeaders` 映射，以指定想要添加到输出请求的标头。然后调用 `createClient()` 函数，并将映射作为参数传递。\n\n\n\n\n\
  将 Listing 4.8 保存到 новый файл `header_middleware_test.go` в том же каталоге, что\
  \ и Listing 4.7，并 запустите тест：\n\n```go\n% go test -v\n=== RUN   TestAddHeaderMiddleware\n\
  --- PASS: TestAddHeaderMiddleware (0.00s)\nPASS\nok          github.com/practicalgo/code/chap4/header-middleware\
  \        0.472s\n```\n\nПри написании этого промежуточного ПО вы видели пример того,\
  \ как создать клиентское промежуточное ПО, которое изменяет входящий запрос, создавая\
  \ копию, изменяя ее и затем передавая ее `DefaultTransport`。练习 4.3 даст вам возможность\
  \ реализовать промежуточное программное обеспечение для регистрации задержек запросов.\n\
  \n## Пул соединений\n\nВ предыдущем разделе вы узнали, что реализация интерфейса\
  \ `RoundTripper` по умолчанию передает HTTP-запрос на удаленный сервер, а затем\
  \ возвращает ответ.\n\nОдин из базовых шагов заключается в том, что для вашего запроса\
  \ устанавливается новое TCP-соединение. Этот процесс установления соединения является\
  \ дорогостоящим. Вы не заметите этого, когда делаете один запрос. Однако когда вы\
  \ отправляете HTTP-запросы как часть сервис-ориентированной архитектуры, например,\
  \ вы обычно делаете несколько запросов в течение короткого промежутка времени —\
  \ либо в пакетном режиме, либо непрерывно. В таком случае выполнять настройку TCP-соединения\
  \ для каждого запроса дорого. Следовательно, библиотека `net/http` поддерживает\
  \ *пул соединений*, где она автоматически пытается повторно использовать существующее\
  \ TCP-соединение для отправки ваших HTTP-запросов.\n\nДавайте сначала разберемся,\
  \ как работает пул соединений, а затем узнаем, как мы можем настроить сам пул. Пакет\
  \ `net/http/httptrace` поможет нам разобраться во внутреннем устройстве пула соединений.\
  \ С помощью этого пакета можно увидеть, используется ли соединение повторно или\
  \ было установлено новое для выполнения HTTP-запроса. На самом деле он делает немного\
  \ больше, но мы будем использовать его только для демонстрации повторного использования\
  \ соединения.\n\nРассмотрим следующее определение функции `createHTTPGetRequestWithTrace()`:\n\
  \n```go\nfunc createHTTPGetRequestWithTrace(ctx context.Context, url string) (*http.Request,\
  \ error) {\n    req, err := http.NewRequestWithContext(ctx, \"GET\", url, nil)\n\
  \    if err != nil {\n        return nil, err\n    }\n    trace := &httptrace.ClientTrace{\n\
  \        DNSDone: func(dnsInfo httptrace.DNSDoneInfo) {\n            fmt.Printf(\"\
  DNS Info: %+v\\n\", dnsInfo)\n        },\n        GotConn: func(connInfo httptrace.GotConnInfo)\
  \ {\n            fmt.Printf(\"Got Conn: %+v\\n\", connInfo)\n        },\n    }\n\
  \    ctxTrace := httptrace.WithClientTrace(req.Context(), trace)\n    req = req.WithContext(ctxTrace)\n\
  \    return req, err\n}\n```\n\nТип структуры `httptrace.ClientTrace` определяет\
  \ функции, которые будут вызываться при возникновении определенных событий в жизненном\
  \ цикле запроса. Здесь нас интересуют два события:\n\n*   Событие `DNSDone` происходит,\
  \ когда поиск имени узла в DNS завершен.\n*   Событие `GotConn` происходит, когда\
  \ установлено соединение для отправки запроса.\n\nЧтобы определить функцию, которая\
  \ будет вызываться при возникновении события `DNSDone`, мы указываем функцию как\
  \ значение поля при создании объекта структуры. Эта функция должна принимать объект\
  \ типа `httptrace.DNSDoneInfo` в качестве параметра и не возвращать никаких значений.\
  \ Точно так же мы определяем функцию, которая будет вызываться при возникновении\
  \ события `GotConn`. Эта функция должна принимать объект типа `httptrace.GotConnInfo`\
  \ в качестве параметра и не возвращать никаких значений. В обеих функциях мы печатаем\
  \ объект на стандартный вывод.\n\nПосле создания объекта `ClientTrace`, `trace`,\
  \ вы создаете новый контекст, вызывая функцию `httptrace.WithClientTrace()`, передавая\
  \ ей исходный контекст запроса и объект `trace`.\n\n\n\n\n\n*   `MaxIdleConnsPerHost`:\
  \ 这是每个主机允许的最大空闲连接数。默认值为 `DefaultMaxIdleConnsPerHost`，在 Go `1.16` 中该值为 `2`。\n\n在练习\
  \ 4.4 中，你将被要求在 `mync` 命令的 `http` 子命令实现连接池行为配置的支持。\n\n## 总结\n\n在本章，我们从学习如何在 HTTP\
  \ 客户端中实现超时行为开始。超时行为结合请求上下文，允许你设置客户端等待请求完成的最长时间。这让你能够在你的应用程序中实现可靠性。然后，你学习了客户端中间件的实现，它允许你在应用程序中开发各种功能，例如日志记录、指标导出和缓存。最后，你学习了连接池以及如何配置它。\n\
  \n在下一章中，你将继续编写 HTTP 应用程序的之旅，在其中你将学习编写可扩展且可靠的 HTTP 服务器应用程序。\n\n# 第 5 章：创建 HTTP 服务器\n\
  \n在本章中，你将深入编写 HTTP 服务器的基础知识。你将了解处理程序函数的工作原理，更多关于请求处理的知识，并学会读写流数据。在上一章中你已经接触了这些主题。现在是时候深入了。\n\
  \n## 你的第一个 HTTP 服务器\n\n`net/http` 包为我们编写 HTTP 服务器提供了构建块。运行在你的计算机上并通过 `http://localhost:8080`\
  \ 访问的服务器将如下所示处理请求（参见图 5.1）：\n\n1. 服务器接收特定路径的客户端请求，例如 `/api`。\n2. 服务器检查是否可以处理该请求。\n\
  3. 如果是，服务器调用处理程序函数来处理请求并返回响应。如果不是，它将返回 HTTP 错误作为响应给客户端。\n\n![图 5.1：HTTP 服务器处理请求](img/0501.png)\n\
  \n**图 5.1:HTTP 服务器处理请求\n\n代码清单 5.1 中展示了你可以编写的最简单的 Web 服务器。\n\n`net/http` 包中的 `ListenAndServe()`\
  \ 函数根据指定的网络地址启动 HTTP 服务器。建议将此地址设置为可配置的。这样，在 `main()` 函数中，以下几行代码检查是否指定了环境变量 `LISTEN_ADDR`，如果没有，则默认值为\
  \ `\":8080\"`：\n\n```\nlistenAddr := os.Getenv(\"LISTEN_ADDR\")\nif len(listenAddr)\
  \ == 0 {\n    listenAddr = \":8080\"\n}\n```\n\n定义在 `os` 包中的 `Getenv()` 函数用于查找环境变量的值。如果找到了环境变量\
  \ `LISTEN_ADDR`，则其值将以字符串的形式返回。如果不存在该环境变量，则返回空字符串。因此，可以使用 `len()` 函数来检查是否指定了环境变量\
  \ `LISTEN_ADDR`。默认值 `\":8080\"` 意味着服务器将监听端口 8080 上的所有网络接口。如果你希望服务器仅在运行应用程序的计算机上可用，你必须将环境变量\
  \ `LISTEN_ADDR` 设置为 `\"127.0.0.1:8080\"`，然后启动应用程序。\n\n然后我们调用 `ListenAndServe()`\
  \ 函数，并指定监听的地址 (`listenAddr`) 和服务器的处理程序。我们将 `nil` 作为处理程序的值，因此我们的 `ListenAndServe`\
  \ 函数调用看起来如下：\n\n```\nlog.Fatal(http.ListenAndServe(listenAddr, nil))\n```\n\n如果在启动服务器时发生错误，`ListenAndServe()`\
  \ 会立即返回一个错误值。如果服务器启动成功，该函数只有在服务器停止运行后才会返回。在任何情况下，如果存在错误值，`log.Fatal()` 将将其记录。\n\n\
  创建一个新目录 `chap5/basic-http-server` 并在其中初始化模块：\n\n```\n$ mkdir -p chap5/basic-http-server\n\
  $ cd chap5/basic-http-server\n$ go mod init github.com/username/basic-http-server\n\
  ```\n\n然后将`代码清单 5.1` 保存为新文件 `server.go`。编译并运行它：\n\n```\n$ go build -o server\n$\
  \ ./server\n```\n\n太棒了，你的第一个 HTTP 服务器启动了！\n\n你是如何向它发送请求的？你可以使用浏览器，但我们将使用命令行 HTTP\
  \ 客户端 `curl`。启动一个新的终端会话并执行以下操作：\n\n```\n$ curl -X GET localhost:8080/api\n404 page\
  \ found\n```\n\n## 配置处理程序\n\n当你将 `nil` 作为 `ListenAndServe` 的第二个参数时，你使用的是默认处理程序 `DefaultMux`。然而，为了更灵活的配置，最好创建一个\
  \ `ServeMux`：\n\n```go\nmux := http.NewMux()\n```\n\n`ServeMux` 对象除了其他字段外，还包含一个映射服务器应该处理的路径和对应处理函数的结构。要注册路径，使用\
  \ `HandleFunc`：\n\n```go\nmux.HandleFunc(\"/api\", func(w http.ResponseWriter, r\
  \ *http.Request) {\n    fmt.Fprintf(w, \"Hello World\")\n})\n```\n\n之后将 `mux` 传递给\
  \ `ListenAndServe`：\n\n```go\nlog.Fatal(http.ListenAndServe(\":8080\", mux))\n```\n\
  \n### 处理函数\n\n处理程序函数的类型必须为 `func(http.ResponseWriter, *http.Request)`，其中 `http.ResponseWriter`\
  \ 和 `http.Request` 是 `net/http` 中定义的两个类型。`http.Request` 类型表示传入的 HTTP 请求，而 `http.ResponseWriter`\
  \ 用于向执行请求的客户端写回响应。\n\n\n\n\n在你编写完处理函数后，下一步是将其注册到你之前创建的 `ServeMux` 对象中：\n\n```\n\
  mux.HandleFunc(\"/api\", apiHandler)\n```\n\n这在多路复用器对象中创建了一个映射，因此任何对 `/api` 路径的请求现在都将由\
  \ `apiHandler()` 函数处理。最后，我们调用 `ListenAndServe()` 函数并指定该 `ServeMux` 对象：\n\n```\n\
  err := http.ListenAndServe(listenAddr, mux)\n```\n\n代码列表 5.2 展示了更新后的 HTTP 服务器代码。它为两个路径：`/api`\
  \ 和 `/healthz` 注册了处理函数（handler functions）。\n\n我们通过调用 `NewServeMux()` 函数创建一个新的 `ServeMux`\
  \ 对象（即一个多路复用器），然后调用 `setupHandlers()` 函数并将多路复用器作为参数传递进去。在 `setupHandlers()` 函数中，我们调用\
  \ `HandleFunc()` 函数来注册这两个路径以及对应的处理函数。然后，我们调用 `ListenAndServe()` 函数，并将多路复用器（`mux`）作为要使用的处理器传入。\n\
  \n创建一个新目录 `chap5/http-serve-mux`，并在其中初始化一个新的模块：\n\n```\n$ mkdir -p chap5/http-serve-mux\n\
  $ cd chap5/http-serve-mux\n$ go mod init github.com/username/http-serve-mux\n```\n\
  \n然后，将代码列表 5.2 保存为新文件 `server.go`。编译并运行服务器：\n\n```\n$ go build -o server\n$ ./server\n\
  ```\n\n从另一个终端窗口，使用 `curl` 向服务器发送 HTTP 请求。对于 `/api` 和 `/healthz` 路径，你将分别看到 `Hello,\
  \ world!` 和 `ok` 响应。\n\n```\n$ curl localhost:8080/api\nHello, world!\n\n$ curl\
  \ localhost:8080/healthz\nok\n```\n\n然而，如果你对任何其他路径发送请求（例如 `/healtz/` 或根路径 `/`），你你将收到“404\
  \ page not found”：\n\n```\n$ curl localhost:8080/healtz/\n404 page not found\n\n\
  $ curl localhost:8080/\n404 page not found\n```\n\n当请求到达且有可用的处理函数时，该处理函数会在独立的 goroutine（协程）中执行。处理完成后，goroutine\
  \ 就会结束（参见图 5.3）。\n\n![图 5.3: 每个传入的请求都由新的 goroutine 处理。](img/0503.png)\n\n图 5.3:\
  \ 每个传入的请求都由新的 goroutine 处理。\n这确保了服务器可以同时处理多个请求。作为一个良好的副作用，这意味着如果处理某个请求时发生异常，不会影响其他正在处理的请求。\n\
  \n## 测试你的服务器\n\n通过 `curl` 调用请求来手动测试服务器适用于初步测试和检查服务器，但它不具备扩展性。因此，你需要为服务器构建一个自动化的测试程序，以便于运行测试。标准库中的\
  \ `httptest` 包（通过 `net/http/httptest` 导入）为我们提供了各种函数，允许为 HTTP 服务器编写测试。通常来说，你最终将测试应用程序的行为分为两类：\n\
  \n* 服务器的行为\n* 应用程序的行为\n\n\n\n这是一个指向 `url.URL` 类型（定义在 `net/url` 包中）的指针，表示请求路径。通过示例来理解它是最好的。假设我们使用\
  \ URL 地址 `http://example.com/api/?name=jane&age=25#page1` 向我们的 HTTP 服务器发送请求。当句处理函数处理此请求时，URL\
  \ 对象的字段将如下设置：\n\n* `Path`: `/api/`\n* `RawQuery`: `name=jane&age=25`\n* `Fragment`:\
  \ `page1`\n\n要访问特定的单个查询参数及其值，您可以使用使用 `Query()` 方法。该方法返回一个类型为 `Values` 的对象，其被定义为\
  \ `map[string][]string`。对于上述 URL 地址，调用 `Query()` 方法将返回以下内容：\n\n```\nurl.Values{\"\
  age\":[]string{\"25\"}, \"name\":[]string{\"jane\"}}\n```\n\n如果查询参数出现多次，例如 `http://example.com/api/?name=jane&age=25&name=john#page1`，则\
  \ `Query()` 的返回值为：\n\n```\nurl.Values{\"age\":[]string{\"25\"}, \"name\":[]string{\"\
  jane\", \"john\"}}\n```\n\n如果您的服务器接受 HTTP 基本身份验证，请求 URL 的格式为 `http://user:pass@example.com/api/?name=jane&age=25&name=john`。在这种情况下，`User`\
  \ 字段包含请求中指定的用户名和密码信息。要获取用户名，请调用 `User()` 方法。要获取密码，请调用 `Password()` 方法。\n\n### Proto,\
  \ ProtoMajor 和 ProtoMinor\n\n这些字段定义了客户端和服务器交换数据的 HTTP 协议。`Proto` 是标识协议和版本的字符串（例如\
  \ `\"HTTP /1.1\"`）。`ProtoMajor` 和 `ProtoMinor` 是整数，分别定义协议的主版本和次版本。对于 HTTP/1.1，协议的主版本和次版本均为\
  \ 1。\n\n### Header\n\n这是一个类型为 `map[string][]string` 的映射，包含传入的请求头。\n\n### Host\n\n\
  这是一个字符串，包含了主机名和端口的组合（`example.com:8080`）或 IP 地址和端口的组合（`127.0.0.1:8080`），客户端客户端向服务器发送请求时使用了这些信息。\n\
  \n### Body\n\n这是一个类型为 `io.ReadCloser` 的值，引用请求体。可以使用任何理解 `io.Reader` 接口的函数来读取主体。例如，您可以使用\
  \ `io.ReadAll()` 方法来读取整个请求体。该函数返回一个包含整个请求体的字节切片，然后您可以根据处理器的功能需求对该字节切片进行处理。在下一节中，您将看到如何在不将整个请求体读入内存的情况下处理请求体。\n\
  \n关联字段是 `ContentLength`，它表示从请求体中读取的最大字节数。\n\n### Form, PostForm\n\n如果您的函数接受 HTTP\
  \ 基本身份验证，请求 URL 的格式为 `http://user:pass@example.com/api/?name=jane&age=25&name=john`。在这种情况下，`User`\
  \ 字段包含请求中指定的用户名和密码信息。要获取用户名，请调用 `User()` 方法。要获取密码，请调用 `Password()` 方法。\n\n\n\n\n\
  ```go\nfunc apiHandler(w http.ResponseWriter, r *http.Request) {\n    requestID\
  \ := \"request-123-abc\"\n    r = addRequestID(r, requestID)\n    processRequest(w,\
  \ r)\n}\n```\n\n我们将定义第二个辅助函数，用于获取和注册 `requestID`：\n\n```go\nfunc logRequest(r *http.Request)\
  \ {\n        ctx := r.Context()\n        v := ctx.Value(requestContextKey{})\n \n\
  \        if m, ok := v.(requestContextValue); ok {\n                log.Printf(\"\
  Processing request: %s\", m.requestID)\n        }\n}\n```\n\n我们通过调用带有相应键的 `ctx.Value()`\
  \ 方法来获取请求上下文的值。请记住，我们在添加值时使用了空对象 `requestContextKey` 作为键。该方法返回类型为 `interface{}`\
  \ 的对象。因此，我们对获取到的值进行类型断言，以确保它的类型是 `requestContextValue`。如果类型断言成功，我们就会注册 `requestID`。\n\
  \n然后，`processRequest()` 函数调用 `logRequest()` 函数来注册 `requestID`：\n\n```go\nfunc processRequest(w\
  \ http.ResponseWriter, r *http.Request) {\n    logRequest(r)\n    fmt.Fprintf(w,\
  \ \"Request processed\")\n}\n```\n\n列表 5.4 展示了一个运行中的服务器应用程序，它为每个请求附加了请求 ID，并在处理之前将其写入日志中。\n\
  \n然后，将列表 5.4 保存为新文件 `server.go`。编译并启动服务器：\n\n```\n$ go build -o server\n$ ./server\n\
  ```\n\n在另一个终端中向服务器发送请求：`curl localhost:8080/api`。\n\n在运行服务器的终端上，你将看到以下内容：\n\n```\n\
  2021/01/14 18:26:54 Processing request: request-123-abc\n```\n\n建议在进一步处理传入请求之前，将元数据（如请求\
  \ ID）附加到请求中。然而，假设你从所有的处理函数中都调用 `addRequestID()` 函数。你将在第 6 章“高级 HTTP 服务器应用程序”中，通过在你的服务器应用程序中引入中间件，将了解将元数据附加到请求对象的最佳方法。\n\
  \n## 流式请求处理\n\n在第 3 章中，你首次在编写包测试服务器时学习了如何反序列化 JSON 数据。除了 `Unmarshal()` 函数外，`encoding/json`\
  \ 包还为我们提供了另一种更灵活的方法来解码 JSON 数据。让我们来看一个充当日志收集器的 HTTP 服务器示例。它只做两件事：\n\n*   它通过 HTTP\
  \ POST 请求接收日志。请求体包含被编码为一个或多个 JSON 对象的日志。这通常被称为 *JSON 流流*，因为客户端会不断地作为同一个请求的一部分发送日志。\n\
  *   它在成功解码这些日志后将其打印出来。\n\n服务器可能接收到的请求体示例如下：\n\n```\n {\"user_ip\": \"172.121.19.21\"\
  , \"event\": \"click_on_add_cart\"}{\"user_ip\": \"172.121.19.21\", \"event\": \"\
  click_on_checkout\"}\n```\n\n\n\n\n\n此输出告诉我们，第一个 JSON 对象已成功解码。这主要与 `Decode()` 的工作方式有关——它会持续读取输入流，直到发现错误为止。\n\
  \n现在让我们来看第二种错误。执行以下请求（注意第二个 JSON 对象中 `event` 的数据类型是错误的）：\n\n```bash\n$ curl -X POST\
  \ http://localhost:8080/decode \\\n-d '\n{\"user_ip\": \"172.121.19.21\",\"event\"\
  : \"click_on_add_cart\"}\n{\"user_ip\": \"172.121.19.21\", \"event\": 1}\n'\n```\n\
  \n你将收到的响应如下：\n\n```\njson: cannot unmarshal number into Go struct field\nlogLine.event\
  \ of type string\n```\n\n如果你想提高处理处理函数的可靠性，即通过忽略反序列化错误并继续处理 JSON 流，你可以通过对 `decodeHandler()`\
  \ 函数进行微调（如高亮所示）来实现：\n\n```go\nfunc decodeHandler(w http.ResponseWriter, r *http.Request)\
  \ {\n    dec := json.NewDecoder(r.Body)\n\n    var e *json.UnmarshalTypeError\n\n\
  \    for {\n        var l logLine\n\n        err := dec.Decode(&l)\n        if err\
  \ == io.EOF {\n            break\n        }\n        if errors.As(err, &e) {\n \
  \           log.Println(err)\n\n            continue\n        }\n        if err\
  \ != nil {\n            http.Error(w, err.Error(), http.StatusBadRequest)\n    \
  \        return\n        }\n        fmt.Println(l.UserIP, l.Event)\n    }\n    fmt.Fprintf(w,\
  \ \"OK\")\n}\n```\n\n在反序列化阶段发生错误时，会返回特定类型的错误 `UnmarshalTypeError`（定义在 `encoding/json`\
  \ 包中）。因此，通过检查 `Decode()` 函数返回的错误是否属于该类型，我们可以忽略反序列化错误并继续处理流的其他部分。通过上述更改，服务器将记录反序列化错误并继续处理流的部分。\n\
  \n为了看到它的运行效果，请执行以下请求：\n\n```bash\n$ curl -X POST http://localhost:8080/decode \\\
  \n-d '\n{\"user_ip\": \"172.121.19.21\",\"event\": \"click_on_add_cart\"}\n{\"user_ip\"\
  : \"172.121.19.21\", \"event\": 1}\n{\"user_ip\": \"172.121.21.22\", \"event\":\
  \ \"click_on_checkout\"}'\nOK%\n```\n\n在带有上述更改的服务器上，你将看到：\n\n```\n172.121.19.21\
  \ click_on_add_cart\n2020/12/30 16:42:30 json: cannot unmarshal number into Go struct\
  \ field logLine.event of type string\n172.121.21.22 click_on_checkout\n```\n\n`json.NewDecoder()`\
  \ 函数结合 `Decode()` 方法提供了一种分析 JSON 数据的灵活方法。正如我们在这里在这里看到的，这在分析 JSON 数据流时最为有用。当然，你必须记住，灵活性意味着应用开发者需要对错误处理承担更大的责任。在下一个练习中，你将在你的应用程序中实现更可靠的\
  \ JSON 解码，以拒绝带有任何未知字段的数据。\n\n## 作为响应的流式数据\n\n你已经看到了如何使用 `fmt.Fprintf()` 等函数向服务器发送响应。你还看到了如何使用\
  \ `http.ResponseWriter` 对象 `w` 的 `w.Headers().Add()` 设置自定义响应头。在本节中，你将了解到当没有所有数据可作为响应发送，但你希望在数据产生时就发送，这通常被称为响应的*流式传输*（streaming）。这种情况可能发生的场景示例是当一个耗时任务作为客户端任务的一部分启动时。\n\
  \n\n\n\n我们设置了两个响应头。我们为 `Content-Type` 头部设置了 `text/plain` 值，以告知客户端我们将以明文形式发送数据。我们还为\
  \ `X-Content-Type-Options` 头部设置了 `nosniff` 值，以指示浏览器在向用户显示任何数据之前不要在其本地进行任何缓冲。\n\n\
  然后，我们启动了一个无限的 `for` 循环来从 `io.PipeReader` 对象中读取数据。如果我们收到 `io.EOF` 错误，表示写入模块已完成对通道的写入，我们将退出循环。如果没有，我们将调用\
  \ `Write()` 方法来发送刚刚读取的数据。如果 `flushSupported` 的值为 `true`，我们将调用 `http.Flusher` 对象\
  \ `f` 的 `Flush()` 方法。\n\n在循环结束后，我们向 `done` 通道写入一个空结构体对象 `struct{}{}`。\n\n在代码列表 5.6\
  \ 显示了一个 HTTP 服务器，它注册了唯一的路径 `/job` 并将 `longRunningProcessHandler` 注册为处理函数。\n\n创建一个新目录\
  \ `chap5/streaming-response` 并在其中初始化模块：\n\n```\n$ mkdir -p chap5/streaming-response\n\
  $ cd chap5/streaming-response\n$ go mod init github.com/username/chap5/streaming-response\n\
  ```\n\n然后，将代码列表 5.6 保存为新文件 `server.go`。编译并运行服务器：\n\n```\n$ go build -o server\n\
  $ ./server\n```\n\n打开一个新的终端会话并使用 `curl` 发起请求。你会看到每秒返回一次的响应：\n\n```\n$ curl localhost:8080/job\n\
  \n\n{\"id\": 0, \"user_ip\": \"172.121.19.21\", \"event\": \"click_on_add_cart\"\
  \ }\n{\"id\": 1, \"user_ip\": \"172.121.19.21\", \"event\": \"click_on_add_cart\"\
  \ }\n{\"id\": 2, \"user_ip\": \"172.121.19.21\", \"event\": \"click_on_add_cart\"\
  \ }\n{\"id\": 3, \"user_ip\": \"172.121.19.21\", \"event\": \"click_on_add_cart\"\
  \ }\n{\"id\": 4, \"user_ip\": \"172.121.19.21\", \"event\": \"click_on_add_cart\"\
  \ }\n...\n{\"id\": 20, \"user_ip\": \"172.121.19.21\", \"event\": \"click_on_add_cart\"\
  \ }\n```\n\n然后，执行 `curl` 并添加 `--verbose` 标志，你会看到以下响应头：\n\n```\nContent-Type: text/plain\n\
  X-Content-Type-Options: nosniff\nDate: Thu, 14 Jan 2021 06:02:13 GMT\nTransfer-Encoding:\
  \ chunked\n```\n\n当然，我们在写入响应时设置了 `Content-Type` 和 `X-Content-Type-Options` 头部。在调用\
  \ `Flush()` 方法时，会自动设置 `Transfer-Encoding: chunked` 头部。这告知客户端数据是按流式模式从服务器传输的，应该在连接关闭之前继续读取。\n\
  \n上述使用 `io.Pipe()` 的方法提供了数据生产与消费的清晰分离。需要注意的是，你不需要为了发送流式响应而创建 `PipeReader` 和 `PipeWriter`\
  \ 对象。如果你对数据生成过程有控制权，可以直接通过将数据写入 `ResponseWriter` 来传递数据。然后，你可以周期地调用 `ResponseWriter`\
  \ 对象的 `Flush()` 方法。例如，如果你想发送大文件作为响应，可以定期读取固定数量的字节并发送给客户端，然后重复此过程直到读取完整个文件。在这种情况下，你甚至不需要调用\
  \ `Flush()` 方法，因为部分文件对用户来说是没用的。幸运的是，你不需要手动完成所有操作。`io.Copy()` 函数允许在不编写特殊代码的情况下实现这一目标。首先打开文件进行读取：\n\
  \n```\nf, err := os.Open(fileName)\ndefer f.Close()\n```\n\n要通过 `ResponseWriter`\
  \ 对象 `w` 将数据作为响应传递：\n\n```\nio.Copy(w, f)\n```\n\n这将分块（每块 32 KB）读取数据并直接写入 `ResponseWriter`。在本章的最后一个练习（#c05.xhtml#feaf-0004）中，你将使用这种技术来实现文件上传服务器。\n\
  \n## 总结\n\n你在第 3 章为客户端编写服务器时就已经开始编写 HTTP 服务器了。在本章中，你深入了这一点。你学习了服务器如何处理传入的请求、为什么使用\
  \ `DefaultServeMux` 是一个坏主意以及你可以如何使用自定义 `ServeMux` 对象。你编写了用于处理请求的处理函数。\n\n\n\n在上一一节中，你已经了解到可以使用请求上下文在整个请求的生命周期内存储数据。这对于存储请求作用范围的数据非常有用，例如请求\
  \ ID、身份验证后的用户 ID 等。在典型的服务器应用程序中，还有另一类数据需要存储，例如初始化的日志记录器对象或打开的数据库的连接对象。这些对象在服务器启动后初始化，然后对所有\
  \ HTTP 处理器函数都可用。\n\n让我们定义一个结构体类型 `appConfig`，它将包含服务器应用程序的配置数据：\n\n```go\ntype appConfig\
  \ struct {\n    logger *log.Logger\n}\n```\n\n该结构体类型包含一个类型为 `*log.Logger` 的字段 `logger`。定义另一个结构体类型\
  \ `app` 作为自定义 `http.Handler`：\n\n```go\ntype app struct {\n    config  appConfig\n\
  \    handler func(\n        w http.ResponseWriter, r *http.Request, config appConfig,\n\
  \    )\n}\n```\n\n`app` 对象将包含一个 `appConfig` 类型的对象和一个签名名为 `func(http.ResponseWriter,\
  \ *http.Request, config appConfig)` 的函数。该函数是一个标准的 HTTP 处理器函数，但它接收一个额外的参数——类型为 `appConfig`\
  \ 的值。这就是我们如何引入配置引入处理器函数。由于应用程序类型实现了 `http.Handler` 接口，我们如下所示定义 `ServeHTTP()` 方法：\n\
  \n```go\nfunc (a app) ServeHTTP(w http.ResponseWriter, r *http.Request) {\n    a.handler(w,\
  \ r, a.config)\n}\n```\n\n我们实现了一个自定义的 `http.Handler` 类型，并为处理器函数之间的数据共享奠定了基础。让我们来看处理器函数的示例：\n\
  \n```go\nfunc healthCheckHandler(w http.ResponseWriter, r *http.Request,\n    config\
  \ appConfig) {\n    if r.Method != http.MethodGet {\n        http.Error(w, \"Method\
  \ not allowed\", http.StatusMethodNotAllowed)\n        return\n    }\n    config.logger.Println(\"\
  Handling healthcheck request\")\n    fmt.Fprintf(w, \"ok\")\n}\n```\n\n在处理器函数内部，我们处理请求。如果请求方法不是\
  \ GET，我们发送错误响应。否则，我们使用 `config` 对象中可用的配置日志记录器来记录消息并发送响应。\n\n为了注册此处理器函数，我们将使用以下模板：\n\
  \n```go\nconfig := appConfig{\n    logger: log.New(\n        os.Stdout, \"\", log.Ldate|log.Ltime|log.Lshortfile,\n\
  \    ),\n}\nmux := http.NewServeMux()\nsetupHandlers(mux, config)\n```\n\n我们创建了一个\
  \ `appConfig` 类型的值。在这里我们配置了向 `stdout` 输出日志的日志记录器，并将其配置为记录日期、时间、文件名和行号。然后我们通过调用 `http.NewServeMux()`\
  \ 创建一个新的 `http.ServeMux` 对象。接下来，我们使用创建的 `ServeMux` 对象和 `appConfig` 对象调用函数 `setupHandlers()`。`setupHandlers()`\
  \ 定义如下：\n\n```go\nfunc setupHandlers(mux *http.ServeMux, config appConfig) {\n \
  \   mux.Handle(\"/healthz\", &app{config: config, handler: healthCheckHandler})\n\
  \    mux.Handle(\"/api\", &app{config: config, handler: apiHandler})\n}\n```\n\n\
  我们调用了 `http.ServeMux` 对象 `mux` 的 `Handle()` 方法，带有两个参数。第一个参数是用于处理的请求路径，第二个参数是类型为\
  \ `app` 的对象——我们的自定义 `http.Handler` 类型。因此，每个路径函数和处理器的注册都包含一个新的应用程序对象。`Handle()` 方法类似于你为止用于注册请求处理器的\
  \ `HandleFunc()` 方法，区别在于第二个参数。`HandleFunc()` 方法接受任何签名名为 `func(http.ResponseWriter,\
  \ *http.Request)` 的函数作为参数，而 `Handle()` 方法要求第二个参数必须实现 `http.Handler` 接口的对象。\n\n图\
  \ 6.1 显示了 `http.ServeMux` 对象和自定义处理器类型如何协同处理请求。\n\n总结来说，对于传入请求，`http.ServeMux` 对象的\
  \ `ServeHTTP()` 方法会检查该路径是否注册了允许的处理器对象。如果找到了，将调用处理器对象的相应 `ServeHTTP()` 方法，该方法随后会调用注册的处理器函数。处理器函数处理请求并发送响应，然后控制权返回到处理器对象的\
  \ `ServeHTTP()` 方法。代码段 6.1 显示了使用自定义类型的 HTTP 服务器完整应用。\n\n![图 6.1：使用自定义处理器类型时 HTTP\
  \ 服务器处理 HTTP 请求](img/0601.png)\n\n图 6.1: HTTP 服务器处理 HTTP 请求\n\n\n\n\n```go\nfunc\
  \ (a *app) ServeHTTP(w http.ResponseWriter, r *http.Request) {\n    startTime :=\
  \ time.Now()\n    a.handler(w, r, a.config)\n    a.config.logger.Printf(\n     \
  \   \"path=%s method=%s duration=%f\", r.URL.Path, r.Method,\n        time.Now().Sub(startTime).Seconds(),\n\
  \    )\n}\n```\n\nКогда вы замените в Listing 6.1 метод `ServeHTTP()` приведенным\
  \ выше кодом и выполните запрос к пути `/api` или `/healthz`, вы увидите следующие\
  \ логи (все в одну строку):\n\n```\n2021/03/09 08:47:27 server.go:23: path=/healthz\
  \ method=GET \nduration=0.000327\n```\n\nОднако, если вы выполните запрос к незарегистрированному\
  \ пути, вы не увидите никаких логов. Напомним, что метод `ServeHTTP()` типа `app`\
  \ вызывается только тогда, когда для пути зарегистрирован обработчик. Чтобы исправить\
  \ это, мы вместо этого создадим промежуточное ПО (middleware), которое будет оборачивать\
  \ объект `ServeMux`.\n\n### HandlerFunc 技巧\n\n`http.HandlerFunc` — это тип, определенный\
  \ в стандартной библиотеке следующим образом:\n\n```go\ntype HandlerFunc func(ResponseWriter,\
  \ *Request)\n```\n\nЭтот также реализует метод `ServeHTTP()` и, таким образом, реализует\
  \ интерфейс `http.Handler`. Как и для любого другого типа, мы можем преобразовать\
  \ любую функцию с сигнатурой `func(w http.ResponseWriter, r *http.Request)` в значение,\
  \ удовлетворяющее интерфейсу `http.Handler`, используя выражение `HandlerFunc(func(w\
  \ http.ResponseWriter, r *http.Request))`. На Figure 6.2 показано, как запрос обрабатывается\
  \ функцией, преобразованной в тип `http.HandlerFunc`.\n\n![Figure 6.2: HTTP-сервер\
  \ обрабатывает запросы при использовании типа http.HandlerFunc](img/0602.png)\n\n\
  Figure 6.2: HTTP-сервер обрабатывает запросы при использовании типа `http.HandlerFunc`\n\
  \nЗачем вообще нужен такой тип? Он позволяет нам писать функцию, которая оборачивает\
  \ любое другое значение `http.Handler`, `h`, и возвращает другой `http.Handler`.\
  \ Допустим, мы хотим реализовать middleware для ведения журналов, используя эту\
  \ технику. Вот как мы его напишем:\n\n```go\nfunc loggingMiddleware(h http.Handler)\
  \ http.Handler {\n    return http.HandlerFunc(\n        func(w http.ResponseWriter,\
  \ r *http.Request) {\n            startTime := time.Now()\n            h.ServeHTTP(w,\
  \ r)\n            log.Printf(\n                \"path=%s method=%s duration=%f\"\
  ,\n                r.URL.Path, r.Method, time.Now().Sub(startTime).Seconds(),\n\
  \            )\n        })\n}\n```\n\nЗатем мы создадим объект `ServeMux` и будем\
  \ использовать его с функцией `ListenAndServe()` следующим образом:\n\n```go\nmux\
  \ := http.NewServeMux()\nsetupHandlers(mux, config)\nm := loggingMiddleware(mux)\n\
  http.ListenAndServe(listenAddr, m)\n```\n\nМы создаем объект `ServeMux` и регистрируем\
  \ обработчики запросов. Затем мы вызываем функцию `loggingMiddleware()`, передавая\
  \ объект `ServeMux` в качестве параметра. Вот как мы оборачиваем объект `ServeMux`\
  \ внутри функции `loggingMiddleware`. Поскольку возвращаемое функцией `loggingMiddleware()`\
  \ реализует интерфейс `http.Handler`, мы указываем его в качестве обработчика при\
  \ вызове функции `ListenAndServe()`.\n\nНа Figure 6.3 показано, как обрабатывается\
  \ запрос, когда мы оборачиваем объект `http.ServeMux` внешним типом `http.Handler`,\
  \ `loggingMiddleware`. Мы будем называть объект `http.ServeMux` как обернутый обработчик.\n\
  \nКогда приходит запрос, он сначала обрабатывается методом `ServeHTTP()`, реализованным\
  \ в `http.HandlerFunc`. В рамках обработки этот метод вызывает функцию, возвращамую\
  \ функцией `loggingMiddleware()`. Внутри тела этой функции запускается таймер, а\
  \ затем вызывается метод `ServeHTTP()` обернутого обработчика, который затем вызывает\
  \ обработчики запросов. После того как обработчики запросов завершат обработку запроса,\
  \ выполнение возвращается к функции, возвращаемой функцией `loggingMiddleware()`,\
  \ где регируются сведения о запросе.\n\nПоскольку тип `http.HandlerFunc` позволяет\
  \ нам писать функцию, которая оборачивает любое другое значение `http.Handler`,\
  \ `h`, и возвращает другой `http.Handler`, мы можем настроить цепочку middleware,\
  \ как вы узнаете далее.\n\n![Figure 6.3: HTTP-сервер обрабатывает запросы при использовании\
  \ обернутого ServeMux](img/0603.png)\n\nFigure 6.3: HTTP-сервер обрабатывает запросы\
  \ при использовании обернутого ServeMux\n\n### Связывание middleware\n\nПромежуточное\
