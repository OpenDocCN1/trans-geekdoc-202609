  \   },\n    )\n    if err != nil {\n        t.Fatal(err)\n    }\n\n    resp, err\
  \ := client.Recv()\n    if err != nil {\n        t.Fatalf(\"Error in Watch: %#v\\\
  n\", err)\n    }\n    if resp.Status != healthsvc.HealthCheckResponse_SERVING {\n\
  \        t.Errorf(\n            \"Expected SERVING, Got: %#v\",\n            resp.Status.String(),\n\
  \        )\n    }\n\n    updateServiceHealth(\n        h,\n        \"Users\",\n\
  \        healthsvc.HealthCheckResponse_NOT_SERVING,\n    )\n\n    resp, err = client.Recv()\n\
  \    if err != nil {\n        t.Fatalf(\"Error in Watch: %#v\\n\", err)\n    }\n\
  \    if resp.Status != healthsvc.HealthCheckResponse_NOT_SERVING {\n        t.Errorf(\n\
  \            \"Expected NOT_SERVING, Got: %#v\",\n            resp.Status.String(),\n\
  \        )\n    }\n}\n```\n\n我们调用了 `Watch()` 方法，然后调用了 `Recv()` 方法——一次。我们检查健康状态是否为\
  \ `SERVING`。然后，我们调用了 `updateServiceHealth()` 将服务的健康状态更改为 `NOT_SERVING`。我们再次调用了 `Recv()`\
  \ 方法。这一次我们检查响应的状态字段值是否为 `NOT_SERVING`。因此，虽然客户端必须定期调用 `Check()` 方法以获取服务器健康状态的任何更改，但\
  \ `Watch()` 方法相反会通知客户端，客户端随后可以据此做出响应。\n\n你可以在书籍代码库中 `chap10/server-healthcheck/server`\
  \ 目录下的 `health_test.go` 文件中找到所有测试函数的源代码。\n\n在下一个节节中，你将学习如何实现一个拦截器来设置恢复机制，以防止服务器在发生运行时错误时停止运行。然而在此之前，你将在本章的第一个练习中实现\
  \ `Health` 服务的客户端，即练习 10.1。\n\n### 运行时错误处理\n\n当客户端应用程序向 gRPC 服务器发送请求时，该请求会在单独的 goroutine\
  \ 中进行处理——就像你在 HTTP 服务器中学到的那样。然而，与 HTTP 服务器不同，如果在处理请求期间发生了未处理的运行时错误（例如，由调用 `panic()`\
  \ 函数引起），它将终止整个服务器进程，这也会停止正在处理的其他请求。这是否符合意愿很大程度上取决于你具体的应用程序行为。假设我们认为这不符合意愿，并且希望在服务器应用程序中实现一种机制，即使在处理另一个请求时发生未处理的错误，现有请求以及新请求继续处理。实现这种机制的常用方法是在服务器端定义拦截器。在这个拦截器中，我们将设置另一个函数的延迟调用（defer），在其中调用\
  \ `recover()` 函数，并在存在错误时记录该错误。当发生运行时错误时，将调用该延迟函数，而不是终止应用程序。\n\n首先，让我们来看单一拦截器：\n\n\
  ```go\nfunc panicUnaryInterceptor(\n    ctx context.Context,\n    req interface{},\n\
  \    info *grpc.UnaryServerInfo,\n    handler grpc.UnaryHandler,\n) (resp interface{},\
  \ err error) {\n    defer func() {\n        if r := recover(); r != nil {\n    \
  \        log.Printf(\"Panic recovered: %v\", r)\n            err = status.Error(\n\
  \                codes.Internal,\n                \"Unexpected error happened\"\
  ,\n            )\n        }\n    }()\n    resp, err = handler(ctx, req)\n    return\n\
  }\n```\n\n我们定义了命名的返回值：`resp` 和 `err`。这允许在发生运行时错误时 `recover()` 返回一个非空值。我们记录该值，并将\
  \ `err` 赋值为使用 `status.Error` 创建的新错误值。我们将状态码设置为 `codes.Internal` 并设置了自定义错误消息。因此，我们在服务器端记录了实际错误，但向客户端发送了简短的消息。\n\
  \n流式拦截器的配置也类似。流式拦截器的一个有趣之处在于，无论运行时错误是在初始化流期间还是在随后的消息交换期间发生的，它都能正常工作。\n\n书籍代码库中的\
  \ `chap10/svc-panic-handling` 目录包含了第 9 章中 gRPC 应用的修改版本。服务器已更新，将恐慌处理拦截器注册为单一和流方法调用的最内部拦截器：\n\
  \n```go\ns := grpc.NewServer(\n    grpc.ChainUnaryInterceptor(\n        metricUnaryInterceptor,\n\
  \        loggingUnaryInterceptor,\n        panicUnaryInterceptor,\n    ),\n    grpc.ChainStreamInterceptor(\n\
  \        metricStreamInterceptor,\n        loggingStreamInterceptor,\n        panicStreamInterceptor,\n\
  \    ),\n)\n```\n\n\n\n\n\n```\n2021/07/05 21:02:25 接收到 Email 为 panic@example.com\
  \ 的用户请求\nId:\n2021/07/05 21:02:25 Panic 恢复: I was asked to panic\n2021/07/05 21:02:25\
  \ Method:/Users/GetUser, Error:rpc error:\ncode = Internal desc = Unexpected error\
  \ happened, \nRequest-Id:[request-123]\n2021/07/05 21:02:25 Method:/Users/GetUser,\
  \ Duration:160.291μs\n```\n\n然后调用 `GetHelp()` 方法：\n\n```\n$ ./client localhost:50051\
  \ GetHelp\nRequest: panic\n2021/07/05 21:07:37 发送消息调用: *users.UserHelpRequest\n\
  2021/07/05 21:07:37 接收消息调用: *users.UserHelpReply\n2021/07/05 21:07:37 rpc error:\
  \ code = Internal desc = Unexpected \nerror happened\n```\n\n在服务器端，你将看到以下日志：\n\n\
  ```\nRequest received: panic\n2021/07/05 21:07:37 Panic 恢复: I was asked to panic\n\
  2021/07/05 21:07:37 Method:/Users/GetHelp, Error:rpc error: code = \nInternal desc\
  \ = Unexpected error happened, Request-Id:[request-123]\n2021/07/05 21:07:37 Method:/Users/GetHelp,\
  \ Duration:1.302932917s\n```\n\n编写一个错误恢复拦截器可以支持你的服务器在处理其他请求的同时运行。这还允许你记录错误原因、发布指标以便跟踪错误，或者运行任何自定义的清理和回滚程序。\n\
  \n接下来，你将了解当操作耗时超过设置的时间间隔或客户端断开连接时，中断请求处理的方法。\n\n### 中断请求处理\n\n假设你想为 RPC 方法设置一个执行时间上限。根据你服务的历史行为，你知道对于某些恶意用户请求，RPC\
  \ 方法消耗的时间可能比例如 300 毫秒更长。在这种情况下，你只想中断该请求。通过服务器端拦截器，你可以在所有服务处理中实现这种逻辑。\n\n下面的函数实现了一个\
  \ RPC 超时单元拦截器：\n\n```\nfunc timeoutUnaryInterceptor(\n    ctx context.Context,\n\
  \    req interface{},\n    info *grpc.UnaryServerInfo,\n    handler grpc.UnaryHandler,\n\
  ) (interface{}, error) {\n    var resp interface{}\n    var err error\n\n    ctxWithTimeout,\
  \ cancel := context.WithTimeout(\n        ctx,\n        300*time.Millisecond,\n\
  \    )\n    defer cancel()\n\n    ch := make(chan error)\n\n    go func() {\n  \
  \      resp, err = handler(ctxWithTimeout, req)\n        ch <- err\n    }()\n\n\
  \    select {\n    case <-ctxWithTimeout.Done():\n        cancel()\n        err\
  \ = status.Error(\n            codes.DeadlineExceeded,\n            fmt.Sprintf(\n\
  \                \"%s: Deadline exceeded\",\n                info.FullMethod,\n\
  \            ),\n        )\n        return resp, err\n    case <-ch:\n        return\
  \ resp, err\n}\n```\n\n上面的拦截器使用 `context.WithTimeout()` 函数调用创建了一个新的 `context.Context`\
  \ 对象 `ctxWithTimeout`，并使用传入的上下文 `ctx` 作为父上下文。超时设置为 300 毫秒，即我们设置的最大持续时间，处理程序在此时间内完成执行。我们使用\
  \ `select` 运算符来等待 `err` 通道上的值或调用 `ctxWithTimeout.Done()` 函数。当处理方法完成时，`err` 的值将变为可读。另一方面，当\
  \ 300 毫秒过去后，`ctxWithTimeout.Done()` 将返回。如果发生这种情况，我们取消上下文，创建一个错误码设置为 `code.DeadlineExceeded`\
  \ 的新错误值，并连同 `resp` 的零值一起返回。\n\n使用上述拦截器配置服务器的结果是：耗超过 300 毫秒的 RPC 方法将被中断。如果我们以此方式编写服务方法，使得拦截器的上下文取消用于取消当前处理，资源也将被及时释放以供其他请求使用。我们不会通过启动\
  \ gRPC 来检查拦截器的工作情况，而是通过编写一个测试函数来实现。\n\n我们将按照所示，使用预期的参数直接调用 `timeoutUnaryInterceptor()`：\n\
  \n```\nfunc TestUnaryTimeInterceptor(t *testing.T) {\n    req := svc.UserGetRequest{}\n\
  \    unaryInfo := &grpc.UnaryServerInfo{\n        FullMethod: \"Users.GetUser\"\
  ,\n    }\n    testUnaryHandler := func(ctx context.Context, req interface{}) (interface{},\
  \ error) {\n        time.Sleep(500 * time.Millisecond)\n        return UserReply{},\
  \ nil\n    }\n\n    _, err := timeoutUnaryInterceptor(context.Background(), req,\
  \ unaryInfo, testUnaryHandler)\n    if err == nil {\n        t.Fatal(\"expected\
  \ timeout error\")\n    }\n    expectedErr := status.Errorf(\n        codes.DeadlineExceeded,\n\
  \        \"Users.GetUser: Deadline exceeded\",\n    )\n    if !errors.Is(err, expectedErr)\
  \ {\n        t.Errorf(\n            \"Expected error: %v\\ Got: %v\\n\",\n     \
  \       expectedErr,\n            err,\n        )\n    }\n}\n```\n\n\n\n\n我们定义了\
  \ `wrappedServerStream` 结构，包含两个字段：类型为 `time.Duration` 的 `RecvMsgTimeout` 以及嵌入的 `grpc.ServerStream`\
  \ 对象。我们实现的 `SendMsg()` 方法会调用嵌入式流的 `SendMsg()` 方法。在 `RecvMsg()` 方法内部，我们创建了一个 `time.Timer`\
  \ 对象，并将 `RecvMsgTimeout` 值作为参数传递给函数 `time.NewTimer()`。返回的对象 `t` 包含字段 `C`，这是一个类型为\
  \ `chan Time` 的通道。然后，我们在 goroutine 中调用基础流的 `RecvMsg()` 方法。\n\n使用 `select` 运算符，我们等待从两个通道中的任一个接收到值：`t.C`\
  \ 和 `ch`。第一个通道在 `RecvMsgTimeout` 指定的时间到期后接收值。第二个通道在基础流的 `RecvMsg()` 调用返回时接收值。根据\
  \ `select` 的行为，如果第一个通道先接收到值，我们将返回错误参数，错误码为 `codes.DeadlineExceeded`。当服务处理程序接收到错误时，它可以中断\
  \ RPC 方法的执行。\n\n现在我们已经在 `RecvMsg()` 方法中定义了超时逻辑，我们将按照如下方式定义拦截器：\n\n```go\nfunc timeoutStreamInterceptor(\n\
  \    srv interface{},\n    stream grpc.ServerStream,\n    info *grpc.StreamServerInfo,\n\
  \    handler grpc.StreamHandler,\n) error {\n    serverStream := wrappedServerStream{\n\
  \        RecvMsgTimeout: 500 * time.Millisecond,\n        ServerStream:   stream,\n\
  \    }\n    err := handler(srv, serverStream)\n    return err\n}\n```\n\n拦截器将 500\
  \ 毫秒定义为 `RecvMsgTimeout`。然后，我们将通过编写单元测试来检查拦截器的工作。`timeoutStreamingInterceptor()`\
  \ 函数应该带有以下参数被调用：\n\n*   `srv:` 它的类型为 `interface{}`，因此可以是任何类型的对象。在这里，我们将使用字符串 `\"\
  test\"`。\n*   `stream:` 这是一个实现了 `grpc.ServerStream` 接口类型对象。在我们的测试中，我们定义了一个新类型 `testStream`\
  \ 来实现该接口。在 `RecvMsg()` 方法中，我们将通过睡眠 700 毫秒来模拟我们无响应客户端的行为，这超过了拦截器设置的等待时间。\n*   `info:`\
  \ 这是一个类型为 `*grpc.ServerInfo` 的对象，我们如下所示创建它：\n\n    ```go\n    streamInfo := &grpc.StreamServerInfo{\n\
  \        FullMethod:     \"Users.GetUser\",\n        IsClientStream: true,\n   \
  \     IsServerStream: true,\n    }\n    ```\n*   `handler:` 这是一个双向（或服务器）流 RPC 方法处理器。在我们的测试中，我们实现了以下测试处理器函数：\n\
  \n    ```go\n    testHandler := func(\n        srv interface{},\n        stream\
  \ grpc.ServerStream,\n    ) (err error) {\n        for {\n            m := svc.UserHelpRequest{}\n\
  \            err := stream.RecvMsg(&m)\n            if err == io.EOF {\n       \
  \         break\n            }\n            if err != nil {\n                return\
  \ err\n            }\n            r := svc.UserHelpReply{}\n            err = stream.SendMsg(&r)\n\
  \            if err == io.EOF {\n                break\n            }\n        \
  \    if err != nil {\n                return err\n            }\n        }\n   \
  \     return nil\n    }\n    ```\n\n创建了所有不同的对象后，我们可以定义测试函数：\n\n```go\ntype testStream\
  \ struct {\n    grpc.ServerStream\n}\n\nfunc (s testStream) SendMsg(m interface{})\
  \ error {\n    log.Println(\"Test Stream - SendMsg\")\n    return nil\n}\n\nfunc\
  \ (s testStream) RecvMsg(m interface{}) error {\n    log.Println(\"Test Stream -\
  \ RecvMsg\")\n    time.Sleep(700 * time.Millisecond)\n    return nil\n}\n\nfunc\
  \ TestTimeoutInterceptor(t *testing.T) {\n\n    streamInfo := &grpc.StreamServerInfo{\n\
  \        FullMethod:     \"Users.GetUser\",\n        IsClientStream: true,\n   \
  \     IsServerStream: true,\n    }\n\n    testStream := testStream{}\n\n    // 定义\
  \ testHandler\n\n    err := timeoutStreamInterceptor(\"test\", testStream, streamInfo,\
  \ testHandler)\n    expectedErr := status.Error(codes.DeadlineExceeded)\n\n    if\
  \ !errors.Is(err, expectedErr) {\n        t.Errorf(\"Expected error: %v Got: %v\\\
  n\", expectedErr, err)\n    }\n}\n```\n\n你可以在源代码中找到超时示例在 `chap10/svc-timeout` 目录。\n\
  \n我们在服务器应用程序中的另一种可能性是响应由客户端发起的结束事件，例如上下文取消或网络故障。在这种情况下，服务器也应该尽快中断处理。对于单元方法的拦截器实现与超时拦截器非常相似：\n\
  \n```go\nfunc clientUnaryInterceptor(\n    ctx context.Context,\n    req interface{},\n\
  \    info *grpc.UnaryServerInfo,\n    handler grpc.UnaryHandler,\n) (interface{},\
  \ error) {\n    var resp interface{}\n    var err error\n\n    ch := make(chan error)\n\
  \n    go func() {\n        resp, err = handler(ctx, req)\n        ch <- err\n  \
  \  }()\n\n    select {\n    case <-ctx.Done():\n        err = status.Error(\n  \
  \          codes.Canceled,\n            fmt.Sprintf(\n                \"%s: Request\
  \ canceled\",\n                info.FullMethod,\n            ),\n        )\n   \
  \     return resp, err\n    case <-ch:\n\n    }\n    return resp, err\n}\n```\n\n\
  流拦截器的实现与超时拦截器非常相似：\n\n```go\nfunc clientDisconnectStreamInterceptor(\n    srv interface{},\n\
  \    stream grpc.ServerStream,\n    info *grpc.StreamServerInfo,\n    handler grpc.StreamHandler,\n\
  ) (err error) {\n\n    ch := make(chan error)\n\n    go func() {\n        err =\
  \ handler(srv, stream)\n        ch <- err\n    }()\n\n    select {\n    case <-stream.Context().Done():\n\
  \        err = status.Error(\n            codes.Canceled,\n            fmt.Sprintf(\n\
  \                \"%s: Request canceled\",\n                info.FullMethod,\n \
  \           ),\n        )\n        return err\n    case <-ch:\n\n    }\n    return\
  \ err\n}\n```\n\n\n\n\n### 改进连接设置\n\n在客户端中，我们能够调用任何 RPC 方法之前，执行的第一步是与服务器建立一个通道（channel）。为了唤起你的记忆，我们使用了以下代码来创建通道：\n\
  \n```go\nfunc setupGrpcConn(addr string) (*grpc.ClientConn, error) {\n    return\
  \ grpc.DialContext(\n        context.Background(),\n        addr,\n        grpc.WithBlock(),\n\
  \    )\n    // 注意：此处代码逻辑不可达\n}\n```\n\n`grpc.WithBlock()` 会导致上述 `DialContext()`\
  \ 函数调用在成功建立连接之前不会返回。实际上，如果你没有指定此选项，建立连接的过程不会立即启动。它将在未来的某个时刻发生，可能是在你调用第一次 RPC 方法之前，或者在调用期间或之后。\n\
  \n使用 `grpc.WithBlock()` 参数可以帮助我们处理具有瞬时故障的场景，例如服务器需要几百毫秒来准备，或者瞬时网络故障导致超时。然而，这也可能导致客户端持续尝试连接而不会崩溃退出，即使存在需要检查的持续性故障。此类故障的示例包括指定格式错误的服务器地址或不存在的主机名。\n\
  \n为了利用 `grpc.WithBlock()` 选项的优势，同时又不尝试“永久”建立连接，我们将指定另一个 `DialOption`，它是通过调用函数 `grpc.FailOnNonTempDialError(true)`\
  \ 创建的。参数 `true` 表示如果发生非瞬时错误，将不再尝试恢复连接。`DialContext()` 函数将返回关于发现的错误的消息。\n\n此外，即使对于瞬时错误，设置尝试建立连接的时间上限也是有意义的。`grpc.DialContext()`\
  \ 函数接收一个 `context.Context` 对象作为第一个参数。因此，我们创建一个带有超时值的上下文，并使用该上下文调用函数。\n\n更新后的 `setupGrpcConn()`\
  \ 如下：\n\n```go\nfunc setupGrpcConn(\n    addr string,\n) (*grpc.ClientConn, context.CancelFunc,\
  \ error) {\n    log.Printf(\"Connecting to server on %s\\n\", addr)\n    ctx, cancel\
  \ := context.WithTimeout(\n        context.Background(),\n        10*time.Second,\n\
  \    )\n    conn, err := grpc.DialContext(\n        ctx,\n        addr,\n      \
  \  grpc.WithBlock(),\n        grpc.FailOnNonTempDialError(true),\n        grpc.WithReturnConnectionError(),\n\
  \    )\n    return conn, cancel, err\n}\n```\n\n请注意，我们添加了第三个 `DialOption`：`grpc.WithReturnConnectionError()`。使用此选项，当发生瞬时错误且在\
  \ `DialContext()` 函数成功执行之前上下文超时时，返回的错误也将包含阻止连接建立的原始错误。\n\n值得注意的是，指定 `grpc.WithReturnConnectionError()`\
  \ `DialOption` 也会隐式地设置 `grpc.WithBlock()` 选项。通过上述更改，`DialContext()` 函数现在将表现出以下行为：\n\
  \n* 当发现非瞬时错误时，它将立即返回。返回的错误值将包含发生错误的信息。\n* 如果存在非瞬时错误，它将仅 10 秒内尝试建立连接。函数将返回包含非瞬时错误信息的返回值。\n\
  \n在 `chap10/client-resilency` 目录下编译客户端应用程序并按如下方式运行（不启动本地服务器）：\n\n```bash\n$ cd chap10/client-resilency\n\
  $ go build -o client\n$ ./client\nConnecting to server on localhost:50051\nrpc:\
  \ dial tcp [::]:50051: connection refused\n```\n\n现在，在另一个终端启动服务器：\n\n```bash\n$\
  \ cd chap10/server\n$ go build -o server\n$ ./server\nListening on :50051\n```\n\
  \n回到客户端终端再次运行：\n\n```bash\n$ cd ../client-resilency\n$ ./client\nConnecting to server\
  \ on localhost:50051\nRequest: 1\nUser: john.com\nRequest: 2\nUser: john.com\nRequest:\
  \ 3\nUser: john.com\nRequest: 4\nUser: john.com\nRequest: 5\nUser: john.com\n```\n\
  \n现在，在运行客户端期间，按下 `Ctrl+C` 停止服务器，然后再次运行客户端：\n\n```bash\n$ cd ../server\n$ killall\
  \ server\n$ cd ../client-resilency\n$ ./client\nConnecting to server on localhost:50051\n\
  rpc: dial tcp [::]:50051: connection refused\n```\n\n在等待 10 秒后重新启动服务器：\n\n```bash\n\
  $ cd ../server\n$ ./server\nListening on :50051\n```\n\n客户端将立即成功连接：\n\n```bash\n\
  $ cd ../client-resilency\n$ ./client\nConnecting to server on localhost:50051\n\
  Request: 1\nUser: john.com\n...\n```\n\n\n\n\n接下来，我们定义函数 `setupChat()` 用于与创建的流进行交互、发送请求并从服务器获取响应。在函数内部，我们将创建一个类型为\
  \ `svc.Users_GetHelpClient` 的无缓冲通道，该类型是由调用 `GetHelp()` 方法创建的流类型。我们将在特殊的 goroutine\
  \ 中调用 `Recv()` 方法。如果该方法返回了非 `io.EOF` 的错误，它将重新创建流。然后，流会被写入 `clientConn` 通道。\n\n接下来的代码段显示了客户端的一部分，它负责从流中读取数据并实现了重连逻辑：\n\
  \n```\nfunc setupChat(\n    r io.Reader,\n    w io.Writer,\n    c svc.UsersClient,\n\
  ) (err error) {\n\n    var clientConn = make(chan svc.Users_GetHelpClient)\n   \
  \ var done = make(chan bool)\n\n    stream, err := createHelpStream(c)\n    defer\
  \ stream.CloseSend()\n    if err != nil {\n        return err\n    }\n\n    go func()\
  \ {\n        for {\n            clientConn <- stream\n            resp, err := stream.Recv()\n\
  \            if err == io.EOF {\n                done <- true\n            }\n \
  \           if err != nil {\n                log.Printf(\"Recreating stream.\")\n\
  \                stream, err = createHelpStream(c)\n                if err != nil\
  \ {\n                    close(clientConn)\n                    done <- true\n \
  \               }\n            } else {\n                fmt.Printf(\n         \
  \           \"Response: %s\\n\", resp.Response,\n                )\n           \
  \     if resp.Response == \"hello-10\" {\n                    done <- true\n   \
  \             }\n            }\n        }\n    }()\n\n    // TODO – 向服务器发送请求\n\n\
  \    <-done\n    return stream.CloseSend()\n}\n```\n\n在读取流的 goroutine 内部，我们有一个无条件循环\
  \ `for`。在循环的最开始时，我们将当前的流对象写入 `clientConn` 通道。这将释放客户端中向服务器发送消息的 set（稍后会进行解释）。然后，我们调用\
  \ `Recv()` 方法。如果收到 `io.EOF` 错误，我们向 `done` 通道写入 `true`，这将关闭流并从函数返回。\n\n如果收到任何其他错误，我们将调用\
  \ `createHelpStream()` 函数来重新创建流。如果我们无法创建流，将关闭 `clientConn` 通道，从而释放发送代码。我们同样会向 `done`\
  \ 通道写入 `true`，这将导致函数返回。\n\n如果没有收到错误，则打印从服务器收到的响应。如果响应为 `hello-10`，我们向 `done` 通道写入\
  \ `true`。这一行对应于客户端发送的最后一个请求。因此，当我们收到此消息时，我们就知道该函数没有其他需要要做的。\n\n接下来的代码段显示了 `setupChat()`\
  \ 函数的发送部分：\n\n```\nfunc setupChat(\n    r io.Reader,\n    w io.Writer,\n    c svc.UsersClient,\n\
  ) (err error) {\n    var clientConn = make(chan svc.Users_GetHelpClient)\n    var\
  \ done = make(chan bool)\n\n    stream, err := createHelpStream(c)\n    defer stream.CloseSend()\n\
  \    if err != nil {\n        return err\n    }\n\n    go func() {\n        for\
  \ {\n            clientConn <- stream\n            resp, err := stream.Recv()\n\
  \            if err == io.EOF {\n                done <- true\n            }\n \
  \           if err != nil {\n                log.Printf(\"Recreating stream.\")\n\
  \                stream, err = createHelpStream(c)\n                if err != nil\
  \ {\n                    close(clientConn)\n                    done <- true\n \
  \               }\n            } else {\n                fmt.Printf(\n         \
  \           \"Response: %s\\n\", resp.Response,\n                )\n           \
  \     if resp.Response == \"hello-10\" {\n                    done <- true\n   \
  \             }\n            }\n        }\n    }()\n\n    // TODO – 向服务器发送请求\n\n\
  \    <-done\n    return stream.CloseSend()\n}\n```\n（注：原文中提供的第二个代码块与第一个重复且内容不完整，此处已完成排版，并根据逻辑保留了核心结构）\n\
  \n### 为调用设置超时\n\n好了，现在你已经配置好了客户端应用程序，以确保在基础连接出现问题时它不会崩溃并报错退出。我们该如何防止它无限尝试恢复基础连接？此外，我们如何能确保方法调用设置了处理时间的上限？我们可以通过使用\
  \ `context.WithTimeout()` 创建 `context.Context` 对象来实现这两点。例如：\n\n```\nctx, cancel\
  \ := context.WithTimeout(\n    context.Background(),\n    10*time.Second,\n)\ndefer\
  \ cancel()\nresp, err := client.GetUser(\n    ctx,\n    u,\n    grpc.WaitForReady(true),\n\
  )\n```\n\n当我们创建一个设置了 10 秒后取消的上下文时，该超时时间适用于执行 RPC 调用所需的所有操作。也就是说，如果客户端必须与服务器连接以执行\
  \ RPC 调用，连接尝试将在 10 秒后中断。同样，如果 RPC 调用是执行执行，该调用也必须在 10 秒内完成。\n\n对于流式 RPC 调用，是否强制对\
  \ RPC 调用设置超时超时，显然取决于你的应用程序。在大多数情况下，这可能是不可行的。为了让流式 RPC 调用实现带超时的 `WaitForReady`，解决方案之一是实现以下模板：\n\
  \n\n\n\n\n```\n    ctxWithTimeout, cancel := context.WithTimeout(\n        ctx,\
  \ 10*time.Second,\n    )\n    defer cancel()\n \n    ch := make(chan error)\n \n\
  \    go func() {\n        stream, err = createRPCStream(..)\n        ch <- err\n\
  \    }()\n \n    select {\n    case <-ctxWithTimeout.Done():\n        cancel()\n\
  \        err = status.Error(\n            codes.DeadlineExceeded,\n            fmt.Sprintf(\n\
  \                \"%s: Deadline exceeded\", \n                info.FullMethod,\n\
  \            ),\n        )\n        return resp, err\n    case <-ch:\n \n    }\n\
  ```\n\n在上面的代码段中，`createRPCStream()` 函数负责创建流，我们在 goroutine 中调用它。我们创建了一个具有 10 秒超时的上下文，然后使用\
  \ `select` 语句，如果在上下文在 `createRPCStream()` 函数返回之前过期，则返回错误。\n\n我们将结束本章的回顾，概述 gRPC\
  \ 客户端与服务器之间的连接管理。\n\n## 连接管理\n\n*连接*（即通过调用 `DialContext()` 在客户端和服务器之间创建通道）被建模为一个具有五个状态的有限状态机。连接可以处于五种状态之一：\n\
  \n*   `CONNECTING`\n*   `READY`\n*   `TRANSIENT_FAILURE`\n*   `IDLE`\n*   `SHUTDOWN`\n\
  \n图 10.1 显示了五个状态以及它们可能的转换。\n\n![图 10.1: 基于 RPC 的服务架构运行](img/1001.png)\n\n**图 10.1**:\
  \ 基于 RPC 的服务架构运行\n\n连接从 `CONNECTING` 状态开始其*生命*。在此状态下，会发生三件件事：\n\n*   主机名解析\n*  \
  \ 建立 TCP 连接\n*   用于安全连接的 TLS 握手\n\n如果所有步骤都成功完成，连接将进入 `READY` 状态。如果其中一个步骤失败，连接将进入\
  \ `TRANSIENT_FAILURE` 状态。如果客户端应用程序退出，连接将进入 `SHUTDOWN` 状态。\n\n处于 `READY` 状态的连接如果遇到底层网络故障（例如服务器进程关闭），将将转到\
  \ `TRANSIENT_FAILURE` 状态。在此连接状态下，如果我们没有在 `CallOption` 中指定 `grpc.WaitForReady(true)`，则\
  \ RPC 方法调用将立即返回错误。\n\n如果在指定的时间范围内没有进行 RPC 请求交换（包括流消息），处于 `READY` 状态的连接将进入 `IDLE`\
  \ 状态。从 [google.golang.org/grpc](http://google.golang.org/grpc) 1.37 版本开始，该功能尚未在\
  \ Go gRPC 客户端中实现。\n\n处于 `TRANSIENT_FAILURE` 状态的连接将转到 `CONNECTING` 以尝试恢复与服务器的连接。如果失败，它将在再次尝试之前再次返回\
  \ `TRANSIENT_FAILURE` 状态。[google.golang.org/grpc](http://google.golang.org/grpc)\
  \ 库实现的连接延迟协议调节了连续尝试之间的间隔。\n\n要查看状态转换的过程，请在配置 [google.golang.org/grpc](http://google.golang.org/grpc)\
  \ 包以生成日志后运行客户端应用程序，使用两个环境变量：`GRPC_GO_LOG_SEVERITY_LEVEL=info` 和 `GRPC_GO_LOG_VERBOSITY_LEVEL=99`：\n\
  \n```\n$ GRPC_GO_LOG_SEVERITY_LEVEL=info GRPC_GO_LOG_VERBOSITY_LEVEL=1  \\\n  ./client\
  \ localhost:50051 GetUser jane@joe.com\n2021/07/24 09:00:00 Connecting to localhost:50051\n\
  2021/07/24 09:00:00 dial tcp localhost:50051: connection refused\n```\n\n\n\n\n\n\
  # 与数据存储的操作\n\n在本章中，你将学习如何让应用程序与数据存储进行交互。根据对不同类型应用程序的通用性，我选择了两种类型的数据存储。首先，你将学习如何与对象存储服务交互，这些服务允许存储非结构化的大型二进制数据对象。然后，你将学习如何与关系型数据库交互。我们将使用一个\
  \ HTTP 服务器作为应用示例，在其中我们将实现与数据存储交互相关的各种功能。我们将实现一个用于存储软件包的服务器，该服务器在第 3 章“编写 HTTP 客户端”中首次介绍。它将为客户端提供以下功能：\n\
  \n* 客户端可以上传一个或多个包。我们不会过度纠结于精确的文件格式，而是允许上传`任何`文件。\n* 每个包都应该有一个关联的名称和版本。客户端可以上传同一个包的多个版本。\n\
  * 客户端必须能够下载特定版本的包。\n\n图 11.1 展示了我们将实现的场景架构。我们将两个数据存储集成到软件包服务器中。上传的包将存储在对象存储中。我们将使用兼容\
  \ Amazon Web Services Simple Storage Service (S3) 的开源软件 MinIO 作为本地开发的对象存储器。对于存储与包相关的元数据，我们将使用关系型数据库——MySQL。\n\
  \n![图 11.1: 示例场景架构](img/1101.png)\n\n**图 11.1**: 示例场景架构\n\n在应用程序中添加存储数据的功能是一项必要需求，同时也增加了开发和测试的复杂性。在整个章节中，你将学习如何使用自动测试和手动测试来`本地`测试功能。你需要将安装额外的软件来完成本章的剩余部分；即\
  \ Docker Desktop。本书书开头的“快速上手”章节包含了其安装说明，所以如果你还没有这样做，现在是时候安装它了。你还需要具备从镜像仓库上传镜像到 Docker\
  \ Hub 的能力。让我们开始吧！\n\n## 与对象存储的操作\n\n对象存储服务，如 Amazon Web Services (AWS) S3、Google\
  \ Cloud Storage (GCS) 以及如 MinIO ([`min.io`](https://min.io)) 等开源软件，通常用于应用程序的任何非结构化数据，即你完整地读取或写入对象——典型的例子包括图像、视频和二进制文件。考虑我们将扩展的软件包服务器。当用户上传一个包时，我们将其存储在对象存储中。然后，当用户想要下载包时，我们的应用程序将允许其从软件包存储中下载。对象存储的选择取决于你组织的策略或个人偏好。如果你的应用程序部署在公共云提供商处，你最终可能会使用云提供商的对象存储服务，如\
  \ AWS S3 或 Google Cloud Storage。另一方面，如果你的组织有自己的对象存储服务（如 MinIO），你将使用它。\n\n在选择数据存储后，我们与存储服务交互的方式将取决于存储服务本身——通常通过特定供应商的库：例如，用于\
  \ S3 的 [`docs.aws.amazon.com/sdk-for-go/api/service/s3/`](https://docs.aws.amazon.com/sdk-for-go/api/service/s3/)、用于\
  \ Google 云存储的 [`cloud.google.com/go/storage`](https://cloud.google.com/go/storage)\
  \ 以及用于 MinIO 的 [`github.com/minio/minio-go`](https://github.com/minio/minio-go)。我们将使用另一种方法。\n\
  \n我们将使用一个名为 Go Cloud Development Kit (Go CDK) 的项目，[`gocloud.dev`](https://gocloud.dev)，它提供了与云服务和非云服务的无关的通用\
  \ API。对象存储是支持的服务之一。其他的包括关系型数据库、文档存储和发布-订阅系统。我们使用这个项目有两个原因。首先，它允许使用更高层次的抽象来实现与对象存储服务交互时的关键操作。其次，\
  \ Go CDK 通过提供与本地文件系统存储服务交互的函数，允许我们编写可测试的代码。这一个理想的副作用是，我们的应用程序在某种程度上变得对云供应商中立了。\n\
  \n### 与软件包服务器的集成\n\n首先，我们将快速熟悉 HTTP 处理器函数，该函数将处理传入的包上传请求。我们将实现将传入的包数据上传到对象存储的功能。\n\
  \n正如你所记得的，在第 3 章中，我们编写了上传包到软件包服务器的客户端。为了测试它，我们编写了一个测试软件包服务器（参见清单 3.9），在其中我们实现了能够处理包上传请求的\
  \ HTTP 服务器。在本章中，我们将通过借用第 6 章“高级 HTTP 服务器”中描述的自定义 `Handler` 类型来编写服务器。我们要编写的第一个处理器函数将处理包上传请求。下面的代码片段显示了处理包注册请求的函数方案，以及上传数据的函数：\n\
  \n```go\nfunc uploadData(config appConfig, f *multipart.FileHeader) error {\n  \
  \  config.logger.Printf(\"Package uploaded: %s\\n\", f.Filename)\n    return nil\n\
  }\n\nfunc packageRegHandler(\n    w http.ResponseWriter,\n    r *http.Request,\n\
  \    config appConfig,\n) {\n    d := pkgRegisterResponse{}\n    err := r.ParseMultipartForm(5000)\n\
  \    // TODO 处理错误\n    mForm := r.MultipartForm\n    // TODO 从复合表单 mForm 中读取数据\n\
  \    d.ID = fmt.Sprintf(\n        \"%s-%s-%s\",\n        packageName,\n        packageVersion,\n\
  \        fHeader.Filename,\n    )\n    err = uploadData(config, d.ID, fHeader)\n\
  \    // TODO 处理响应错误\n}\n```\n\n\n\n\n```go\nfunc uploadData(\n    config appConfig,\
  \ objectId string, f *multipart.FileHeader,\n) (int64, error) {\n    ctx := context.Background()\n\
  \n    fData, err := f.Open()\n    if err != nil {\n        return 0, err\n    }\n\
  \    defer fData.Close()\n\n    w, err := config.packageBucket.NewWriter(ctx, objectId,\
  \ nil)\n    if err != nil {\n        return 0, err\n    }\n\n    nBytes, err :=\
  \ io.Copy(w, fData)\n    if err != nil {\n        return 0, err\n    }\n    err\
  \ = w.Close()\n    if err != nil {\n        return nBytes, err\n    }\n    return\
  \ nBytes, nil\n}\n```\n\n首先，我们调用了 `*multipart.FileHeader` 对象的 `Open()` 方法。该调用返回两个值。第一个\
  \ `fData` 是 `multipart.File` 类型的值，它定义在 `mime/multipart` 包中；第二个 `err` 是一个错误值。`multipart.File`\
  \ 类型是一个接口，允许我们访问请求中的基础文件数据。它集成了 `io` 包中的 `io.Reader`、`io.Closer` 等其他接口。\n\n使用 Go\
  \ CDK 与对象存储服务交互的第一步是打开现有的存储桶（bucket）——对象的容器。对象在没有存储桶的情况下无法存储。当我们成功打开存储桶时，将获得一个类型为\
  \ `*blob.Bucket` 的对象。`uploadData()` 函数的配置对象通过 `config.packageBucket` 字段访问该对象。然后，我们调用定义在\
  \ `config.packageBucket` 对象上的 `NewWriter()` 方法，并传入三个参数：\n\n*   第一个参数是 `context.Context`\
  \ 值。\n*   第二个参数是字符串，包含用于标识数据的对象标识符或名称。\n*   第三个参数目前为 nil，它代表一个 `blob.WriterOptions`\
  \ 类型的对象（定义在 `gocloud.dev/blob` 包中），并允许我们配置与写入操作相关的各种参数。你可以设置缓存控制头、在写入操作期间配置消息完整性检查，或设置内容位置头（ContentDisposition）。\n\
  \n`NewWriter()` 方法返回两个值：类型为 `*blob.Writer` 的 `w` 和一个 `error` 值。`*blob.Writer` 类型实现了\
  \ `io.WriteCloser` 接口。接着，我们调用 `io.Copy()` 函数将数据从读取器 `fData` 复制到写入器 `w`。该函数返回两个值：包含拷贝字节数的\
  \ `int64` 值 `nBytes` 和一个 `error` 值。我们返回拷贝字节数，因为我们需要将其注册到包上传处理函数中。如果错误值为零，我们通过调用\
  \ `Close()` 方法关闭 `*blob.Writer`。\n\n为了使用 `gocloud.dev/blob` 包在 AWS S3 中打开存储桶，我们将跳过对\
  \ `gocloud.dev/blob/s3blob` 包的导入。这是一个实现与 AWS S3 服务连接连接的驱动程序包。当我们导入它时，它会注册到 `gocloud.dev/blob`\
  \ 包中，作为一个提供与 AWS S3 服务交互支持的包。Google Cloud Storage 和 Azure Blob Storage 也有类似的包。\n\
  \n接下来的代码片段打开了位于 AWS `ap-southeast-2` 区域名为 `my-bucket` 的 AWS S3 存储桶：\n\n```go\nimport\
  \ (\n    \"gocloud.dev/blob\"\n    _ \"gocloud.dev/blob/s3blob\"\n)\n\nbucket, err\
  \ := blob.OpenBucket(\n    ctx, \"s3://my-bucket?region=ap-southeast-2\",\n)\n..\n\
  ```\n\n我们对 `gocloud.dev/blob/s3blob` 包使用空导入，因为我们只与 `gocloud.dev/blob` 包进行交互。这样做是为了明确确保我们的应用程序不会无意中使用某些特定驱动器的功能。`OpenBucket()`\
  \ 函数接收两个参数：`context.Context` 对象和一个包含存储桶 URL 的字符串。为了指定要打开的 S3 存储桶，我们提供 S3 URL，其格式为：`s3://bucket-name?<customisations>`。相反，对于本地开发，我们将使用兼容\
  \ S3 的开源存储服务 MinIO ([`min.io`](https://min.io))，我们可以在本地运行。为了与本地运行的 MinIO 建立，我们为\
  \ `OpenBucket()` 提供的 URL 将是 `s3://bucket-name?endpoint=http://127.0.0.1:9000&disableSSL=true&s3ForcePathStyle=true`。查询参数\
  \ `disableSSL=true` 指明我们希望与存储服务器通过 HTTP（而非 HTTPS）交换数据。如果你通过网络与 MinIO 通信，即在你的本地系统之外，你应该使用\
  \ HTTPS 而不是 HTTPS。\n\n\n\n\n\n在我们启动应用程序之前，需要先使用 `Docker Desktop` 应用程序启动 `MinIO`\
  \ 服务的本地副本。打开一个新的终端会话，然后在安装了 `Docker` 且可以与互联网通信的计算机上执行以下命令：\n\n```\n$ docker run\
  \ \\\n    -p 9000:9000 \\\n    -p 9001:9001 \\\n    -e MINIO_ROOT_USER=admin \\\n\
  \    -e MINIO_ROOT_PASSWORD=admin123 \\\n    -ti minio/minio:RELEASE.2021-07-08T01-15-01Z\
  \ \\\n    server \"/data\" \\\n    --console-address \":9001\"\n```\n\n`MinIO` 通过两个独立的网络端口提供其功能。通过端口\
  \ `9000` 的的请求是应用程序对对象存储服务的 API 调用。这是我们为包服务器（package server）指定的。第二个端口 `9001` 配置为控制台地址，用于使用自定义\
  \ Web 界面与 `MinIO` 进行通信。你可以从主机计算机使用 `127.0.0.1:9000` 和 `127.0.0.1:9001` 地址与这些服务交互。我们将用户名设置为\
  \ `admin`，密码设置为 `admin123`。我们使用 `RELEASE.2021-07-08T01-15-01Z` 版本来启动本地服务。一旦你运行了上面的命令，它应该下载镜像并启动容器，日志看起来大致如下：\n\
  \n```\nAPI: http://172.17.0.2:9000  http://127.0.0.1:9000\nRootUser: admin\nRootPass:\
  \ admin123\n \nConsole: http://172.17.0.2:9001 http://127.0.0.1:9001\nRootUser:\
  \ admin\nRootPass: admin123\n \nCommand-line: https://docs.min.io/docs/minio-client-quickstart-guide\n\
  \   $ mc alias set myminio http://172.17.0.2:9000 admin admin123\n \nDocumentation:\
  \ https://docs.min.io\n```\n\n保持服务器运行。在浏览器中访问 `http://127.0.0.1:9001` 进入 Web 界面，并使用用户名\
  \ `admin` 和密码 `admin123` 登录。然后访问 [`127.0.0.1:9001/buckets`](http://127.0.0.1:9001/buckets)\
  \ 并点击 `Create Bucket`。指定桶名称为 `test-bucket` 并点击 `Save` (图 11.2)。\n\n![图 11.2:在 MinIO\
  \ 中创建桶](img/1102.png)\n\n### 在 MinIO 中创建桶\n\n创建桶后，回到构建包服务器的终端，按如下方式启动它：\n\n```\n\
  $ cd chap11/pkg-server\n$ S3_ADDR=http://127.0.0.1:9000 BUCKET_NAME=test-bucket\
  \ AWS_ACCESS_KEY_ID=admin AWS_SECRET_ACCESS_KEY=admin123\n```\n\n我们指定环境变量 `S3_ADDR`\
  \ 包含 `MinIO` 可用的地址。我们使用 `BUCKET_NAME` 指定我们要使用的桶。环境变量 `AWS_ACCESS_KEY_ID` 和 `AWS_SECRET_ACCESS_KEY`\
  \ 用于通过 API 进行身份验证的凭据。在这里我们指定了用户名和生成的密码。现在服务器已运行，让我们对服务器发起下载请求。你可以使用任何文件进行下载。在新的终端会话中，使用\
  \ `curl` 执行以下命令：\n\n```\n$ curl -F name=server -F version=0.1 -F file=@server.go\
  \ http://127.0.0.1:8080/packages\n```\n\n### 获取响应\n\n我们收到了由 `packageName` 构建的包响应。在运行服务器的终端上，你会看到如下日志：\n\
  \n```\n2021/08/14 08:06 handlers.go:46: Package uploaded: server-0.1.go Bytes written:\
  \ 183\n```\n\n如果你现在从浏览器使用地址 `http://127.0.0.1:9001/browser/test-bucket` 访问 `MinIO`\
  \ 界面，你会看到 `test-bucket` 内部有一个标识为 `server-0.1.go` 的对象。很好——我们成功配置了包服务器来下载指定的文件。支持\
  \ `MinIO`。\n\n### 处理获取请求\n\n接下来我们将编写一个处理函数，允许用户从对象存储下载包：\n\n```go\nfunc packageGetHandler(\n\
  \    w http.ResponseWriter,\n    r *http.Request,\n    config appConfig,\n) {\n\
  \    queryParams := r.URL.Query()\n    packageID := queryParams.Get(\"id\")\n\n\
  \    exists, err := config.packageBucket.Exists(\n        r.Context(), packageID,\n\
  \    )\n    if err != nil || !exists {\n        http.Error(w, \"invalid package\
  \ ID\", http.StatusNotFound)\n        return\n    }\n\n    url, err := config.packageBucket.SignedURL(\n\
  \        r.Context(),\n        packageID,\n        nil,\n    )\n    if err != nil\
  \ {\n        http.Error(\n            w,\n            err.Error(),\n           \
  \ http.StatusInternalServerError,\n        )\n        return\n    }\n\n    http.Redirect(w,\
  \ r, url, http.TemporaryRedirect)\n}\n```\n\n该函数期望作为查询参数传递的包 ID。然后它将查询对象存储服务以检查对象是否存在，调用\
  \ `*blob.Bucket` 的 `Exists()` 方法。我们使用请求上下文和包 ID 调用此方法。它返回两个值：类型为 `bool` 的 `exists`\
  \ 和错误 `err`。如果对象存在中，`exists` 为 `true`，否则为 `false`。非零错误值表示检查对象时出现意外问题。如果 `exists`\
  \ 为 `false` 或错误不为零，我们向客户端返回 HTTP 404 错误。我们显式进行此检查，因为在创建对象的签名 URL 时不会检查对象是否存在。如果对象存在中，我们为对象创建签名\
  \ URL 并发起重定向。在这里使用临时重定向，因为签名 URL 在下次请求文件时会发生。\n\n### 签名 URL\n\n签名 URL 允许你的应用程序授权请求者在限制时间内访问分段对象。我们调用为\
  \ `packageBucket` 对象定义的 `SignedURL()` 方法，带有三个参数：请求上下文、创建签名 URL 的对象 ID 以及第三个参数的 `nil`。预期第三个参数如果为\
  \ `nil`，则将是 `blob.SignedURLOptions` 类型的对象，这允许我们设置 URL 失效的时长。例如，你可以将 URL 的有效期设置为\
  \ 15 分钟，而不是默认的 60 分钟。生成签名 URL 也有助于其他操作——在桶中创建对象或删除。对于这些操作，你需要通过 `blob.SignedURLOptions`\
  \ 对象指定 `Method` 字段设置为 `PUT` 或 `DELETE`，而不是 `GET` 方法。下面是带有自定义有效期和 `PUT` 方法的 `blob.SignedURLOptions`\
  \ 创建示例：\n\n```go\nsOpts := blob.SignedURLOptions{\n    Expiry: 15 * time.Minute,\n\
  \    Method: http.MethodPut,\n}\nurl, err := config.packageBucket.SignedURL(\n \
  \   r.Context(),\n    packageName,\n    &sOpts,\n)\n```\n\n现在让我们来看看请求的行为。你已经启动了包服务器。我们返回了之前下载的包\
  \ ID，现在让我们重新请求它：\n\n```\n$ curl \"http://127.0.0.1:8080/api/packages?id=server-0.1.go\"\
  \n<a href=\"http://127.0.0.1:9000/test-bucket/server-0.1.go?\nX-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=admin%2F20210814%\n\
  2Fap-southeast-2%2Fs3%2Faws4_request&X-Amz-Date=20210814T003039Z&\namp;X-Amz-Expires=3600&X-Amz-SignedHeaders=host&\n\
  X-Amz-Signature=3b627ab2ae31e69fba1f8c224c76aae6e24f87982640e\nc3373aa8ea\n7f94962a2\"\
  >Temporary Redirect</a>.\n```\n\n\n\n\n我们返回一个指向所请求对象的签名 URL 的重定向。该 URL 指向本地运行的 MinIO\
  \ 服务器。因此，一旦用户获得了签名 URL，数据将直接从 MinIO 加载。如果我们通过在原始 `curl` 命令中添加 `--location` 来跟随重定向，或者在浏览器中打开\
  \ URL，你将看到文件内容。\n\n```\n$ curl --location \\\n  \"http://127.0.0.1:8080/api/packages?id=server-0.1-server.go\"\
  \n# file contents\n```\n\n指向对象的签名 URL 重定向是向客户端返回数据的方法之一。另一种方法是在应用程序中使用 `ReadAll()`\
  \ 方法从存储桶读取数据，或者通过 `NewReader()` 方法获取 `io.Reader` 并将数据作为响应发送给客户端。练习 11.1 将让你能够实现这一功能。\n\
  \n在完成基于 MinIO 的本地开发后，为了让包服务器指向 AWS S3 存储桶，你只需要指定桶名称、正确的访问凭据和区域即可：\n\n```\n1$ AWS_DEFAULT_REGION=ap-southeast-2\
  \ BUCKET_NAME=<your bucker name> \\\n< AWS_ACCESS_KEY_ID=<aws access key id>\\\n\
  AWS_SECRET_ACCESS_KEY=<aws-secret-key> ./pkg-server-1\n```\n\n接下来，让我们看看如何为我们的处理函数编写自动化测试。\n\
  \n### 测试包上传\n\n为了测试包上传功能，我们将使用在 `go.dev/blob/fileblob` 驱动包中实现的基于文件系统的存储桶。首先，我们将编写一个函数来返回指向文件系统存储桶的\
  \ `blob.Bucket` 对象：\n\n```\nfunc getTestBucket(tmpDir string) (*blob.Bucket, error)\
  \ {\n    myDir, err := os.MkdirTemp(tmpDir, \"test-bucket\")\n    if err != nil\
  \ {\n        return nil, err\n    }\n    u, err := url.Parse(fmt.Sprintf(\"file:///%s\"\
  , myDir))\n    if err != nil {\n        return nil, err\n    }\n    opts := fileblob.Options{\n\
  \        URLSigner: fileblob.NewURLSignerHMAC(\n            u,\n            []byte(\"\
  super secret\"),\n        ),\n    }\n    return fileblob.OpenBucket(myDir, &opts)\n\
  }\n```\n\n我们使用 `fileblob` 包目录打开基于文件系统的存储桶。这样做是为了能够添加创建签名 URL 的功能。我们创建一个 `fileblob.Options`\
  \ 对象，配置带有以 `file:///` 开头的基础 URL 的 `URLSigner` 函数、指向我们创建的临时目录的 URL 方案以及伪造的密钥 `super\
  \ secret`。\n\n然后，在测试函数内部，我们将调用 `getTestBucket()` 函数并如下所示创建 `appConfig` 对象：\n\n```\n\
  func TestPackageRegHandler(t *testing.T) {\n    packageBucket, err := getTestBucket(t.TempDir())\n\
  \    if err != nil {\n        t.Fatal(err)\n    }\n    defer packageBucket.Close()\n\
  \n    config := appConfig{\n        logger: log.New(os.Stdout, \"\", log.Ldate|log.Ltime|log.Lfile),\n\
  \        packageBucket: packageBucket,\n    }\n    mux := http.NewServeMux()\n \
  \   setupHandlers(mux, config)\n\n    ts := httptest.NewServer(mux)\n    defer ts.Close()\n\
  \n    p := pkgData{\n        Name:     \"mypackage\",\n        Version:  \"0.1\"\
  ,\n        Filename: \"mypackage-0.1.tar.gz\",\n        Bytes:    strings.NewReader(\"\
  data\"),\n    }\n    // 测试的其他部分\n```\n\n你可以在源代码仓库 `chap11/pkg-server-1` 下的 `package_reg_handler_test.go`\
  \ 文件中找到测试包处理函数的函数。包上传测试将检查重定向行为。如果我们能够生成作为响应的重定向，我们就知道它完成了工作。以下是我们通过新的测试函数 `TestPackageGetHandler()`\
  \ 检查这一点，仅显示运算符：\n\n```\nfunc TestPackageGetHandler(t *testing.T) {\n    // TODO\
  \ 获取测试桶\n    err = packageBucket.WriteAll(\n        context.Background(),\n    \
  \    \"test-object-id\",\n        []byte(\"test-data\"),\n        nil,\n    )\n\
  \    // TODO 处理错误、配置并设置服务器\n    var redirectUrl string\n    client := http.Client{\n\
  \        CheckRedirect: func(\n            req *http.Request, via []*http.Request,\n\
  \        ) error {\n            redirectUrl = req.URL.String()\n            return\
  \ errors.New(\"no redirect\")\n        },\n    }\n\n    _, err = client.Get(ts.URL\
  \ + \"/api/packages?id=test-object-id\")\n    if err == nil {\n        t.Fatal(\"\
  Expected error: no redirect, Got nil\")\n    }\n    if !strings.HasPrefix(redirectUrl,\
  \ \"file://\") {\n        t.Fatalf(\"Expected redirect url to start with file:///,\
  \ got: %v\", redirectUrl)\n    }\n```\n\n我们在测试桶中直接创建一个指定对象标识的对象。然后，正如你在第 4 章中所记得，我们必须使用自定义函数\
  \ `CheckRedirect` 创建 HTTP 客户端，以确保它不会跟随重定向。接下来，使用该客户端对获取 `test-object-id` 的测试服务器发送\
  \ HTTP GET 请求。我们检查 `redirectUrl` 中的字符串值是否指向我们配置的文件系统存储桶（以 `file:///`）。完整的测试函数可以在源代码仓库\
  \ `chap11/pkg-server-1` 的 `package_handler_test.go` 文件中找到。运行 `go test` 以确保测试通过。\n\
  \n### 访问底层类型\n\n到目前为止，你已经看到如何使用 `gocloud.dev/blob` 包提供的各种高层接口来与兼容 S3 的存储服务交互。此外，你还学会了如何使用\
  \ `gocloud.dev/blob/fileblob` 包作为测试的文件系统存储服务。如果你在将来想更改存储服务，你现在只需要更改打开存储桶或创建 `*blob.Bucket`\
  \ 对象的方式。应用程序的其他部分不需要修改。这就是 `gocloud.dev/blob` 包提供的优势。\n\n然而，有时你可能需要访问 `gocloud.dev/blob`\
  \ 未提供的特定供应商底层功能。为了支持这种用例，`gocloud.dev/blob` 包提供了将 `gocloud.dev/blob` 定义的类型转换为特定供应商底层类型的功能。成功转换后，你可以直接访问底层驱动的功能。如果你指的是\
  \ AWS S3 的存储桶，你将能够直接访问 Go AWS SDK 提供的功能，其他支持的存储服务也是如此。\n\n让我们来看一个例子。如果打开的存储桶不存在，`blob.OpenBucket()`\
  \ 不返回错误。实际上，`gocloud.dev/blob` 包不允许我们检查这一点。然而，AWS SDK 的底层类型允许我们检查。考虑以下代码片段：\n\n\
  ```go\npackage main\n\nfunc main() {\n    bucketName := \"practicalgo-echorand\"\
  \n    testBucket, err := blob.OpenBucket(\n        context.Background(),\n     \
  \   fmt.Sprintf(\"s3://%s\", bucketName),\n    )\n    if err != nil {\n        log.Fatal(err)\n\
  \    }\n    defer testBucket.Close()\n\n    var s3Svc *s3.S3\n    if !testBucket.As(&s3Svc)\
  \ {\n        log.Fatal(\n            \"Couldn't convert type to underlying S3 bucket\
  \ type\",\n        )\n    }\n    _, err = s3Svc.HeadBucket(\n        &s3.HeadBucketInput{\n\
  \            Bucket: &bucketName,\n        },\n    )\n    if err != nil {\n    \
  \    log.Fatalf(\n            \"Bucket doesn't exist, or insufficient permissions:\
  \ %v\\n\",\n            err,\n        )\n    }\n}\n```\n\n\n\nВозвращаемый функцией\
  \ `OpenBucket()` объект `*blob.Bucket` можно преобразовать в тип `*s3.S3`, определенный\
  \ в пакете `github.com/aws/aws-sdk-go/s3`. Соответственно, мы объявляем переменную\
  \ `s3Svc` типа `*s3.S3` и вызываем метод `As()`, определенный для объекта `testBucket`.\
  \ Метод `As()` возвращает `true`, если преобразование прошло успешно, иначе возвращает\
  \ `false`. В случае успеха мы можем использовать объект `s3Svc` для вызова метода\
  \ `HeadBucket()`, определенного в объекте `s3.S3`, чтобы выполнить запрос `HTTP\
  \ HEAD` и проверить, существует ли бакет. Значение ошибки, отличное от нуля, указывает\
  \ на то, что бакет не существует или текущие учетные данные не имеют необходимых\
  \ прав. Вы можете найти список исполняемых программ в каталоге `chap11/object-store-demo/vendor-as-demo`.\
  \ Чтобы узнать, какие базовые типы предоставляет `gocloud.dev/blob`, просмосмотрите\
  \ документацию пакетов для конкретных драйверов.\n\nЗавершите работу сервера MinIO,\
  \ так и процессов сервера пакетов. В следующем разделе мы обновим сервер пакетов,\
  \ добавив возможность хранения метаданных — имени, версии и владельца, связанных\
  \ с каждым пакетом — с использованием реляционной базы данных. Это позволит позволит\
  \ запрашивать пакеты с сервера пакетов по их именам или версиям. Другими словами,\
  \ мы добавляем возможность поиска на наш сервер пакетов с помощью реляционной базы\
  \ данных.\n\n## Работа с реляционными базами данных\n\nПопулярными примерами систем\
  \ управления реляционными базами данных являются MySQL, PostgreSQL и SQLite. Для\
  \ нашего сервера пакетов мы будем использовать MySQL в качестве реляционной базы\
  \ данных. Эти системы хранения данных построены на концепции хранения таблиц и отношений\
  \ между ними. Мы создадим базу данных `package_server` с двумя таблицами: `packages`\
  \ и `users`. Строка в таблице `packages` будет содержать имя пакета, версию, метку\
  \ создания в формате UTC, владельца и идентификатор, уникальный для каждой загруженной\
  \ версии пакета. Строка в таблице `users` будет содержать столбец имени пользователя,\
  \ используемый для аутентификации в системе, и идентификатор, однозначно идентифицирующий\
  \ пользователя в системе. Мы не будем реализовывать аутентификацию или авторизацию\
  \ в нашем приложении, чтобы все было просто. Мы позволим пользователю загружать\
  \ несколько версий пакета и хотим, чтобы пользователи нашего сервера могли загружать\
  \ любую версию пакета. Существующая версия пакета не может быть загружена повторно.\
  \ На Рисунке 11.3 показана модель отношений «сущность-связь» базы данных `package_server`.\n\
  \n![Рисунок 11.3: Диаграмма отношений сущностей для базы данных сервера пакетов](img/1103.png)\n\
  \nРисунок 11.3: Диаграмма отношений сущностей для базы данных сервера пакетов\n\n\
  Сначала мы запустим локальную копию сервера базы данных MySQL с помощью Docker и\
  \ запустим сервер, создав ожидаемые таблицы и предварительно заполнив некоторые\
  \ данные. Каталог `chap11/pkg-server-2/mysql-init` содержит необходимые SQL-скрипты\
  \ для выполнения начальной загрузки. Во-первых, мы создадим две таблицы, `users`\
  \ и `packages`, используя SQL-операторы в файле `01-create-table.sql`:\n\n```sql\n\
  use package_server;\n\nCREATE TABLE users (\n    id INT PRIMARY KEY AUTO_INCREMENT,\n\
  \    username VARCHAR(30) NOT NULL\n);\n\nCREATE TABLE packages (\n    id INT PRIMARY\
  \ KEY AUTO_INCREMENT,\n    name VARCHAR(255) NOT NULL,\n    version VARCHAR(50)\
  \ NOT NULL,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    owner_id INT,\n\
  \    UNIQUE(name, version),\n    FOREIGN KEY (owner_id) REFERENCES users(id)\n);\n\
  ```\n\nЗатем мы добавим начальные данные, используя скрипт `02-insert-data.sql`:\n\
  \n```sql\nINSERT INTO users (username) VALUES ('admin'), ('alice');\nINSERT INTO\
  \ packages (name, version, owner_id) VALUES ('my-package', '1.0.0', 1), ('my-package',\
  \ '1.1.0', 1);\n```\n\nПосле этого мы перейдем к обновлению кода сервера пакетов\
  \ для работы с базой данных.\n\n## Интеграция с базой данных MySQL\n\nПопулярными\
  \ примерами систем управления реляционными базами данных являются MySQL, PostgreSQL\
  \ и SQLite. Для нашего сервера пакетов мы будем использовать MySQL в качестве реляционной\
  \ базы данных. Эти системы хранения данных построены на концепции хранения таблиц\
  \ и отношений между ними. Мы создадим базу данных `package_server` с двумя таблицами:\
  \ `packages` и `users`. Строка в таблице `packages` будет содержать имя пакета,\
  \ версию, метку создания в формате UTC, владельца и идентификатор, уникальный для\
  \ каждой загруженной версии пакета. Строка в таблице `users` будет содержать столбец\
  \ имени пользователя, используемый для аутентификации в системе, и идентификатор,\
  \ однозначно идентифицирующий пользователя в системе. Мы не будем реализовывать\
  \ аутентификацию или авторизацию в нашем приложении, чтобы все было просто. Мы позволим\
  \ пользователю загружать несколько версий пакета и хотим, чтобы пользователи нашего\
  \ сервера могли загружать любую версию пакета. Существующая версия пакета не может\
  \ быть загружена повторно.\n\nДля работы с MySQL мы будем использовать стандартный\
  \ пакет `database/sql`. Сначала нам нужно импортировать этот пакет и драйвер MySQL:\n\
  \n```go\nimport (\n    \"database/sql\"\n    \"fmt\"\n    _ \"github.com/go-sql-driver/mysql\"\
  \n)\n```\n\nТеперь создадим функцию для получения соединения с базой данных:\n\n\
  ```go\nfunc getDatabaseConn(\n    dbAddr, dbName, dbUser, dbPassword string,\n)\
  \ (*sql.DB, error) {\n    dsn := fmt.Sprintf(\"%s:%s@tcp(%s)/%s\",\n        dbUser,\
  \ dbPassword, dbAddr, dbName,\n    )\n    db, err := sql.Open(\"mysql\", dsn)\n\
  \    if err != nil {\n        return nil, err\n    }\n    if err = db.Ping(); err\
  \ != nil {\n        return nil, err\n    }\n    return db, nil\n}\n```\n\nИспользуя\
  \ эту функцию, мы можем инициализировать соединение в основной файле нашего сервера:\n\
  \n```go\nfunc main() {\n    db, err := getDatabaseConn(\"localhost:3306\", \"package_server\"\
  , \"root\", \"password\")\n    if err != nil {\n        log.Fatalf(\"error connecting\
  \ to database: %v\", err)\n    }\n    defer db.Close()\n    // ... остальной код\n\
  }\n```\n\n\n\n`*sql.Db` 对象将在服务器应用程序启动时创建，并在整个服务器生命周期内保持激活状态。因此，`sql.Open()` 函数在服务器进程的生存周期内仅会被调用一次。来自修改后的包服务器\
  \ `main()` 函数 get 代码片段展示了如何实现：\n\n```go\npackage main\n\nfunc main() {\n    // TODO\
  \ 读取对象存储相关信息\n    dbAddr := os.Getenv(\"DB_ADDR\")\n    dbName := os.Getenv(\"DB_NAME\"\
  )\n    dbUser := os.Getenv(\"DB_USER\")\n    dbPassword := os.Getenv(\"DB_PASSWORD\"\
  )\n\n    if len(dbAddr) == 0 || len(dbName) == 0 || len(dbUser) == 0 || len(dbPassword)\
  \ == 0 {\n        log.Fatal(\n            \"Must specify DB details - DB_ADDR, DB_NAME,\
  \ DB_USER, DB_PASSWORD\",\n        )\n    }\n\n    db, err := getDatabaseConn(\n\
  \        dbAddr, dbName,\n        dbUser, dbPassword,\n    )\n    config := appConfig{\n\
  \        logger: log.New(\n            os.Stdout, \"\",\n            log.Ldate|log.Ltime|log.Lshortfile,\n\
  \        ),\n        packageBucket: packageBucket,\n        db:            db,\n\
  \    }\n    // 启动服务器的代码\n}\n```\n\n获取 `*sql.DB` 对象后，为了在服务器上执行查询，我们将调用 `Conn()` 方法来获取\
  \ `*sql.Conn` 对象：\n\n```go\nctx := context.Background()\nconn, err := config.db.Conn(ctx)\n\
  ```\n\n\n\n```go\nfunc packageGetHandler(\n    w http.ResponseWriter, r *http.Request,\
  \ config appConfig,\n) {\n    queryParams := r.URL.Query()\n    owner := queryParams.Get(\"\
  owner_id\")\n    name := queryParams.Get(\"name\")\n    version := queryParams.Get(\"\
  version\")\n    // TODO Вернуть HTTP 400 Bad Request 错误,\n    // если любой из вышеперечисленного\
  \ отсутствует\n\n    ownerId, err := strconv.Atoi(owner)\n\n    // TODO Вернуть\
  \ HTTP 400 错误,\n    // если преобразование не удалось\n\n    q := pkgQueryParams{\n\
  \        ownerId: ownerId,\n        version: version,\n        name: name,\n   \
  \ }\n    pkgResults, err := queryDb(\n        config, q,\n    )\n    // TODO обработка\
  \ ошибок\n\n    if len(pkgResults) == 0 {\n        http.Error(w, \"No package found\"\
  , http.StatusNotFound)\n        return\n    }\n\n    url, err := config.packageBucket.SignedURL(\n\
  \        r.Context(),\n        pkgResults[0].ObjectStoreId,\n        nil,\n    )\n\
  \    if err != nil {\n        http.Error(\n            w, err.Error(), http.StatusInternalServerError,\n\
  \        )\n        return\n    }\n    http.Redirect(w, r, url, http.StatusTemporaryRedirect)\n\
  }\n```\n\n在处理函数中，我们在传入请求的 URL 地址中查找三个查询参数：`owner_id`、`name` 和 `version`。如果任何参数未指定或\
  \ `owner_id` 的值无法成功转换为整数，我们将返回 HTTP 400 错误请求错误。\n\n然后，我们创建一个类型为 `pkgQueryParams`\
  \ 的新对象，包含这些查询参数的值，并调用 `queryDb()` 函数。`queryDb()` 返回两个值：第一个是 `pkgRow` 对象的切片，第二个是错误值。如果我们得到空切片，我们将发送\
  \ HTTP 404 状态作为响应。否则，我们提取切片中的第一个元素，调用在 `config.packageObject` 中定义的 `SignedURL()`\
  \ 方法来创建签名 URL，然后重定向到该地址。接下来让我们来看 `queryDb()` 函数的定义。\n\n该函数首先创建一个发送到数据库的请求，其格式为 `SELECT\
  \ * FROM packages WHERE owner_id=1 AND name=test-package AND version=0.1`。尽管在这种场景下我们应该指定所有条件，但我们编写函数的方式使得满足任何一个条件就足够获取包。（在执行练习\
  \ 11.2 时你会发现这很有用。）因此，我们能够构建诸像 `SELECT * FROM packages WHERE owner_id=1 AND name=test-package`\
  \ 或 `SELECT * FROM packages WHERE owner_id=1` 这样的查询。\n\n在下一个代码片段中部分显示了 `queryDb()`\
  \ 函数，我们在其中构建了查询：\n\n```go\nfunc queryDb(\n    config appConfig, params pkgQueryParams,\n\
  ) ([]pkgRow, error) {\n\n    args := []interface{}{}\n    conditions := []string{}\n\
  \    if params.ownerId != 0 {\n        conditions = append(conditions, \"owner_id=?\"\
  )\n        args = append(args, params.ownerId)\n    }\n    if len(params.name) !=\
  \ 0 {\n        conditions = append(conditions, \"name=?\")\n        args = append(args,\
  \ params.name)\n    }\n    if len(params.version) != 0 {\n        conditions = append(conditions,\
  \ \"version=?\")\n        args = append(args, params.version)\n    }\n\n    if len(conditions)\
  \ == 0 {\n        return nil, fmt.Errorf(\"no query conditions found\")\n    }\n\
  \n    query := fmt.Sprintf(\n        \"SELECT * FROM packages WHERE %s\",\n    \
  \    strings.Join(conditions, \" AND \"),\n    )\n    // TODO 执行查询\n}\n```\n\n我们创建了两个切片，并将根据\
  \ `params` 对象中的字段逐步填充。`args` 是一个类型为 `interface{}` 的空切片，我们在这个切片中存储 `owner_id`、`name`\
  \ 或 `version` 的值。我们需要将其类型设置为 `[]interface{}{}` 而不是 `[]string`，因为 `QueryContext()`\
  \ 期望占位符的值以这种格式提供。在第二个类型为 `[]string{}` 的切片 `conditions` 中，我们将添加查询的一部分。我们检查哪些字段被指定，然后将相应的条件和相应的占位符值分别添加到\
  \ `conditions` 和 `args` 切片中。如果没有任何条件被指定，则返回错误。\n\n最后，我们使用 `strings.Join()` 函数结合\
  \ `conditions` 切片的内容，使用 `AND`（带有前后空格）连接元素。通过调用函数 `fmt.Sprintf()` 得到的字符串现在准备好执行了：\n\
  \n```go\nfunc queryDb(\n    config appConfig, params pkgQueryParams,\n) ([]pkgRow,\
  \ error) {\n    ctx := context.Background()\n    conn, err := config.db.Conn(ctx)\n\
  \    if err != nil {\n        log.Fatal(err)\n    }\n    defer conn.Close()\n\n\
  \    rows, err := conn.QueryContext(ctx, query, args...)\n    if err != nil {\n\
  \        return nil, err\n    }\n    defer rows.Close()\n\n    var pkgResults []pkgRow\n\
  \    for rows.Next() {\n        var pkg pkgRow\n        if err := rows.Scan(\n \
  \           &pkg.OwnerId, &pkg.Name, &pkg.Version,\n            &pkg.ObjectStoreId,\
  \ &pkg.Created,\n        ); err != nil {\n            return nil, err\n        }\n\
  \        pkgResults = append(pkgResults, pkg)\n    }\n\n    if err := rows.Err();\
  \ err != nil {\n        return nil, err\n    }\n    return pkgResults, nil\n}\n\
  ```\n\n`rows.Next()` 方法初始化读取操作。当没有可读行或读取过程中发生错误时返回 `false`。\n\n随后我们使用 `rows.Scan()`\
  \ 方法，向其传递我们想要读取的列的变量引用。如果 `Scan()` 成功，我们将 `pkg` 添加到 `pkgResults` 中。\n\n一旦我们完成了所有行的读取或读取过程中发生了错误（即我们离开了\
  \ `for` 循环），我们调用 `Err()` 来检查是否有错误。如果是这样，我们返回它；否则，我们返回 `pkgResults` 切片和 `nil`。\n\n\
  你可以在源码仓库的 `chap11/pkg-server-2` 目录下找到带有对象存储服务和数据库集成的新版本服务器。`db_store.go` 文件包含了与数据库交互的函数。现在让我们尝试我们添加的功能。\n\
  \n\n\n\n```\n$ curl \"http://127.0.0.1:8080/api/packages?name=test-package&version=0.1&owner_id=1\"\
  \nNo package found\n```\n\n太棒了，现在我们添加一个包：\n\n```\n$ curl -F name=test-package -F\
  \ version=0.1 \\\n-F filedata=@image.tgz http://127.0.0.1:8080/api/packages\n{\"\
  id\":\"2/test-package-0.1-image.tgz\"}\n```\n\n你会在 `chap11/pkg-server-2` 目录下找到 `image.tgz`\
  \ 文件。当然，你可以尝试使用任何其他文件。请注意，响应还包含所有者用户 ID `2`，由于我们是随机分配所有者的，这个 ID 对你来说可能不同。现在，让我们尝试上传包，确保你使用的元数据与之前对应的值对应：\n\
  \n```bash\n$ curl --location \"http://127.0.0.1:8080/api/packages?name=test-package&version=0.1&owner_id=2\"\
  \nWarning: Binary output can mess up your terminal. Use \"--output -\" \nto tell\n\
  Warning: curl to output it to your terminal anyway, or consider \n\"--output\nWarning:\
  \ <FILE>\" to save to a file.\n```\n\n`curl` 默认不显示输出，因为响应不是文本文件。如果你使用浏览器，你上传的文件将被下载，或者其内容将作为嵌入内容显示。太棒了！现在我们已经确认对象存储服务和数据库都已集成到包服务器中。你可以将应用程序指向运行在其他地方的\
  \ MySQL 数据库（例如通过 AWS RDS），并为其提供相应的连接数据，一切运行起来将和本地完全一样。\n\n接下来，你有一个练习来尝试巩固你的理解，练习\
  \ 11.2。\n\n### 数据存储测试\n\n在涉及与数据库交互的测试时，可以使用几种方法。使用 Mock 对象（模拟对象）、使用内存中的 SQL 数据库以及运行本地数据库副本——这些只是其中一些。我们将采用第三种方法。这允许我们以类似于生产环境配置的方式来测试应用程序（生产环境是配置为使用真实数据库服务器的）。我们将使用\
  \ Docker 容器运行本地 MySQL 副本，其加载方式与前一节完全相同，并运行指向该数据库服务器副本的应用程序。测试完成后，MySQL 容器将自动停止。为了组织这些测试容器的创建和销，我们将使用第三方包：[`github.com/testcontainers/testcontainers-go/`](https://github.com/testcontainers/testcontainers-go/)。使用该包，我们将编写一个函数\
  \ `getTestDb()`，它将返回一个配置好的 `*sql.DB` 对象以连接到运行的测试数据库服务器：\n\n```go\nfunc getTestDb()\
  \ (testcontainers.Container, *sql.DB, error) {\n    bootStrapSqlDir, err := os.Stat(\"\
  mysql-init\")\n    if err != nil {\n        return nil, nil, err\n    }\n\n    cwd,\
  \ err := os.Getwd()\n    if err != nil {\n        return nil, nil, err\n    }\n\
  \    bindMountPath := filepath.Join(cwd, bootStrapSqlDir.Name())\n\n    // TODO\
  \ – 创建并启动容器\n}\n```\n\n你还记得在创建本地 MySQL Docker 容器时，我们挂载了来自 `chap11/pkg-server-2`\
  \ 的 `mysql-init` 目录，以便创建表并向用户表中插入记录。我们在创建测试容器时将执行相同的操作。首先，我们使用 `os` 包中的 `os.Stat()`\
  \ 函数确保目录存在，然后创建目录的绝对路径并将其存储在 `bindMountPath` 中。\n\n然后，我们如下创建容器请求：\n\n```go\nfunc\
  \ getTestDb() (testcontainers.Container, *sql.DB, error) {\n    // TODO 插入之前显示的代码\n\
  \    waitForSql := wait.ForSQL(\"3306/tcp\", \"mysql\",\n        func(p nat.Port)\
  \ string {\n            return \"root:rootpw@tcp(\" +\n                \"127.0.0.1:\"\
  \ + p.Port() +\n                \")/package_server\"\n        })\n    waitForSql.WithPollInterval(5\
  \ * time.Second)\n\n    req := testcontainers.ContainerRequest{\n        Image:\
  \        \"mysql:8.0.26\",\n        ExposedPorts: []string{\"3306/tcp\"},\n    \
