  \ ii\n398. iii\n399. v\n400. vii\n401. ix\n402. 387\n\n# 引言\n\nGoogle 在 2009 年向公众发布了\
  \ Go 编程语言，并于 2012 年发布了 1.0 版本。自从向社区宣布并承诺在 1.0 版本中保持兼容性以来，Go 语言已一直用于编写可扩展且高效的程序，从从命令行应用程序、重要的基础设施工具到大规模分布式系统的各个领域。Go\
  \ 语言对现代软件一系列成功案例的发展做出了巨大贡献。在过去的几年里，我对 Go 的个人兴趣主要源于它（如果找不到更好的词汇来形容）就是它那种“无聊”的性格——这正是我喜欢它的原因。我觉得它结合了我学习的第二种编程语言\
  \ C 的强大，以及我另一个喜欢的语言 Python 的“自带电池”（batteries-included）方法。随着我用 Go 语言编写越来越多的程序，我学会了欣赏对提供编写生产级软件所需的所有工具和功能的关注。我经常发现自己自己在想：“我能在这个应用程序中实现这个错误处理模式吗？”然后，我查阅标准库包的文档，答案总是会响亮地给出：“可以！”只要你掌握了\
  \ Go 的基础知识，作为软件开发人员几乎不需要费力就能获得一个高性能的就绪应用程序。\n\n我在书中的目标是通过开发不同类别的应用程序，展示 Go 语言和标准库（以及一些由社区支持的包）的各种功能。在你复习或学习语言基础之后，这本书将帮助你迈出下一步。我采用了这种写作风格：重点关注如何使用语言及其库的不同功能来解决你关心的特定问题。\n\
  \n你不会在书中找到对语言功能或特定包中每个函数的详细描述。你将学到足够创建命令行工具、Web 应用程序或 gRPC 应用程序的知识。我将专注于此类应用程序经过严格筛选的基础构建块子集，以提供精简且实用的指南。因此，你可能会发现这本书涵盖了你可能想了解的高高级用例。这是刻意为之，因为实现这些高级用例通常取决于特定领域的软件软件包，因此，没有任何一书可以在推荐一个同时遗漏另一个。我也尝试尽可能地使用标准包来编写书中描述的应用程序。然而，我希望你从书中学到的基础模块将为你使用更高级的库创建你的应用程序提供坚实的基础。\n\
  \n## 本书涵盖内容\n\n本书向你介绍了概念，并演示了使用 Go 编程语言创建不同类别的应用程序的模式。我们专注于命令行应用程序、HTTP 应用程序和 gRPC\
  \ 应用程序。\n\n“入门”章节将帮助你配置开发环境，并为书的其余部分制定一些约定。\n\n在`第 1 章` (`c01`) 和 `第 2 章` (`c02.`)\
  \ 中讨论了创建命令行应用程序。你将学会使用标准包来开发可扩展且可测试的命令行程序。\n\n在`第 3 章` (`c03.`) 和 `第 4 章` (`c04`)\
  \ 中讨论了如何创建生成的 HTTP 客户端。你将学会设置超时、理解连接池行为、嵌入中间件组件等。\n\n从`第 5 章` (`c05`) 到 `第 7 章`\
  \ (`c07`) 讨论了创建 HTTP 服务器应用程序。你将学会添加流式传输支持、在数据之间交换数据。\n\n在`第 8 章` (`c08`) 到 `第 10\
  \ 章` (`c10`) 中讨论了创建 gRPC 应用程序。你将学习如何使用缓冲区并实现拦截器。\n\n在`第 11 章` (`c11`) 中，讨论了与关系型数据库交互的方法。\n\
  \n\n\n\n\n```\n$ go version\ngo version go1.16.4 darwin/arm64\n```\n\nЕсли вы видите\
  \ вывод выше, вы готовы переходить к следующим шагам.\n\n## Выбор редактора\n\n\
  Если у вас еще нет любимого редактора для Go или среды разработки (IDE), я рекомендую\
  \ Visual Studio Code ([`code.visualstudio.com/download`](https://code.visualstudio.com/download)).\
  \ Если вы используете Vim, я рекомендую расширение `vim-go` ([`github.com/fatih/vim-go`](https://github.com/fatih/vim-go)).\n\
  \n## Установка Protocol Buffer Toolchain\n\nДля чтения некоторых глав книги вам\
  \ потребуются установленные Protocol Buffers (protobuf) и инструменты gRPC для Go.\
  \ Вы установите три отдельные программы: компилятор protobuf, `protoc`, а также\
  \ модули Go protobuf и gRPC — `protoc-gen-go` и `protoc-gen-go-grpc` соответственно.\n\
  \n### Linux и macOS\n\nЧтобы установить компилятор, выполните следующие шаги для\
  \ Linux или macOS:\n\n1. Скачайте файл последней версии (3.16.0 на момент написания\
  \ книги) с [`github.com/protocolbuffers/protobuf/releases`](https://github.com/protocolbuffers/protobuf/releases),\
  \ соответствующий вашей операционной системе и архитектуре. Найдите файлы в разделе\
  \ «Assets». Например, для Linux в системе x86_64 скачайте файл с именем `protoc-3.16.0-linux-x86_64.zip`.\
  \ Для macOS скачайте файл `protoc-3.16.3-osx-x86_64.zip`.\n\n2. Затем распакуйте\
  \ содержимое файла и скопируйте его в каталог `$HOME/.local` с помощью команды `unzip`:\
  \ `$ unzip protoc-3.16.3-linux-x86_64.zip -d $HOME/.local`.\n\n3. Наконец, добавьте\
  \ каталог `$HOME/.local/bin` в переменную окружения `$PATH`: `$ export PATH=\"$PATH:$HOME/.local/bin\"\
  ` в файл инициализации вашей оболочки, например `$HOME/.bashrc` для Bash или `.zshrc`\
  \ для Zsh.\n\nВыполнив предыдущие шаги, откройте новое окно терминала и выполните\
  \ команду `protoc --version` :\n\n```\n$ protoc --version\nlibprotoc 3.16.0\n```\n\
  \nЕсли вы видите вывод, подобный выше, вы готовы переходить к следующему шагу.\n\
  \nЧтобы установить модуль protobuf для Go, `protoc-gen-go` (версия v1.26), выполните\
  \ следующую команду в терминале:\n\n```\n$ go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.26\n\
  ```\n\nЧтобы установить модуль gRPC для Go, инструмент `protoc-gen-go-grpc` (версия\
  \ v1.1), выполните следующую команду:\n\n```\n$ go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1\n\
  ```\n\nЗатем добавьте следующее в файл инициализации вашей оболочки (`$HOME/.bashrc`\
  \ или `$HOME/.zshrc`):\n\n```\n$ export PATH=\"$PATH:$(go env GOPATH)/bin\"\n```\n\
  \nОткройте новое окно терминала и выполните следующие команды:\n\n```\n$ protoc-gen-go\
  \ --version\nprotoc-gen-go v1.26\n$ protoc-gen-go-grpc --version\nprotoc-gen-go-grpc\
  \ v1.1\n```\n\nЕсли вы видите вывод, как показано выше, инструменты установлены\
  \ успешно.\n\n### Windows\n\nЧтобы установить компилятор Protocol Buffers, выполните\
  \ следующие шаги:\n\n1. Скачайте файл последней версии (3.16.0 на момент написания\
  \ книги) с [`github.com/protocolbuffers/protobuf/releases`](https://github.com/protocolbuffers/protobuf/releases),\
  \ соответствующий вашей операционной системе и архитектуре. Найдите файлы в разделе\
  \ «Assets». Например, для Windows x86_64 скачайте файл с именем `protoc-3.16.0-windows-x86_64.zip`.\n\
  \n2. Затем создайте каталог, в котором будете хранить компилятор: `PS mkdir 'C:\\\
  protoc'`.\n\n3. Распакуйте загруженный архив в этот каталог: `PS Expand-Archive\
  \ protoc-3.16.0-windows-x86_64.zip -DestinationPath 'C:\\protoc'`.\n\n4. Наконец,\
  \ добавьте указанный путь в переменную PATH: `PS [Environment]::SetEnvironmentVariable(\"\
  Path\", $env:Path + \";C:\\protoc\\bin\", \"Machine\")`.\n\nОткройте новое окно\
  \ PowerShell и выполните команду `protoc --version`:\n\n```\n$ protoc --version\n\
  libprotoc 3.16.0\n```\n\nЕсли вы видите вывод, подобный выше, вы готовы.\n\n\n\n\
  \nЕсли вы не планируете делиться этими приложениями, вы можете использовать данные\
  \ пути к модулям. Однако, рекомендуется использовать собственный путь к модулю,\
  \ указывающий на ваш репозиторий (вероятно, Git, размещенный на [`bitbucket.org`](https://bitbucket.org),\
  \ [`github.com`](https://github.com) или [`gitlab.com`](https://gitlab.com)). Просто\
  \ замените имя пользователя на свое. Также стоит отметить, что репозиторий с кодом\
  \ книги [`github.com/practicalgo/code`](https://github.com/practicalgo/code) содержит\
  \ путь модуля `github.com/practicalgo/code/<chap1>/<application-name>` (http://github.com/practicalgo/code/%3cchap1%3e/%3capplication-name%3e)\
  \ — иными словами, реальный существующий путь, а не заглушку.\n\n### Командная строка\
  \ и терминалы\n\nНа протяжении всей книги вам потребуется выполнять консольные команды.\
  \ Для Linux и macOS достаточно стандартного терминала, использующего вашу оболочку\
  \ по умолчанию. Я предполагаю, что в Windows вы будете использовать терминал `Windows\
  \ PowerShell` вместо стандартной командной строки. Большинство команд показаны как\
  \ выполняемые в терминале Linux/macOS, что обозначается символом `$`. Однако вы\
  \ также должны иметь возможность запускать те же команды в Windows. Везде, где я\
  \ просил вас создать каталог или скопировать файл, я указывал команды как для Linux/macOS,\
  \ так и для Windows там, где они различаются (примечание: символ `$` здесь не является\
  \ переменной, а оставлен для контекста пояснения строки).\n\n### Термины\n\nНа протяжении\
  \ всей книги я использовал некоторые термины, которые лучше пояснить здесь, чтобы\
  \ избежать двусмысленности и сформировать правильные ожидания.\n\n#### Надежность\
  \ и отказоустойчивость\n\nОба терна, `надежность` (reliability) и `отказоустойчивость`\
  \ (fault tolerance), выражают способность приложения справляться с неожиданными\
  \ сценариями. Однако ожидаемое поведение этих терминов в данных обстоятельствах\
  \ отличается от их нормального состояния. Система является `надежной`, если она\
  \ может противостоять непредвиденным ситуациям и продолжать функционировать в определенной\
  \ степени. Скорее всего, это будет неоптимальное поведение по сравнению с нормой.\
  \ С другой стороны, система является `устойчивой`, если она продолжает демонстрировать\
  \ свое нормальное поведение и потенциально может продержаться некоторое время, прежде\
  \ чем перестанет это делать. Я привел следующие примеры из книги, чтобы проилстрировать\
  \ разницу.\n\nВ Главе 2 вы научитесь устанавливать таймауты для функций консольных\
  \ приложений, выполняющих указанные пользователем программы. Внедряя таймауты, мы\
  \ избегаем, когда приложение зависает бесконечно из-за неверного ввода пользователем.\
  \ Поскольку мы устанавливаем верхнюю границу времени, на которое мы готовы разрешить\
  \ выполнение команды, мы выдадим ошибку, если этот срок истечет до того, как команда\
  \ завершится. Это не нормальное поведение приложения — мы должны ждать завершения\
  \ — но такое неоптимальное поведение необходимо, чтобы позволить приложению восстаться\
  \ после непредвиденной ситуации (например, когда команда занимает больше времени,\
  \ чем ожидалось). Подобные примеры вы встретите повсюду, особенно при отправке или\
  \ получении сетевых запросов в Главах 4, 7, 10 и 11. Мы будем называть эти методы\
  \ введением надежности в наши приложения.\n\nВ Главе 10 вы научитесь обрабатывать\
  \ временные сбои в gRPC-клиентах. Вы будете писать приложения так, чтобы они могли\
  \ выдерживать временные сбои, которые, скорее всего, будут устранены в ближайшее\
  \ время. Мы называем это внедрением устойчивого поведения. Однако мы также вводим\
  \ лимит времени, позволяющий устранить потенциально временный сбой. Если срок превышен,\
  \ мы считаем, что операция не может быть завершена. Таким образом, мы также вводим\
  \ надежность.\n\nПодводя итог, отказоустойчивость и надежность направлены на обработку\
  \ непредвиденных ситуаций в наших приложениях, и в этой книге используются данные\
  \ термины.\n\n#### Готовность к эксплуатации\n\nВ книге я использую термин `готовность\
  \ к эксплуатации` (production-ready) для обозначения всех шагов, которые необходимо\
  \ учитывать при разработке приложения. Если производственная среда означает, что\
  \ ваше приложение будет выполнять важные функции для пользователей, то методы, изложенные\
  \ в этой книге, должны быть абсолютной базой и отправной точкой. Готовность к работе\
  \ состоит из огромного количества специфичных для области методов.\n\n\n\n我们将使用由标准库和第三方包定义的类型，也将定义我们自己的类型。除了定义结构类型对象外，我们还将处理嵌入其他类型的类型——即其他结构类型和接口。《Effective\
  \ Go》指南中的“嵌入（Embedding）”章节（[`golang.org/doc/effective_go#embedding`](https://golang.org/doc/effective_go#embedding)）描述了这一概念。在编写测试时，我们还会使用匿名结构类型。这在\
  \ Andrew Gerrand 的演讲《关于你（可能）不知道 Go 的 10 件事》中有所描述：[`talks.golang.org/2012/10things.slide#1`](https://talks.golang.org/2012/10things.slide#1)。\n\
  \n### interface 类型\n\n为了使用不同的库级函数并编写可测试的应用程序，我们将广泛使用接口类型。例如，我们将广泛使用满足 `io.Reader`\
  \ 和 `io.Writer` 接口要求的替代类型，来为与标准输入输出交互的应用程序编写测试。\n\n学习定义满足另一个接口的自定义类型，是编写 Go 应用程序的关键步骤，通过这种方式，我们将我们的功能与语言的其他部分连接。例如，为了确保\
  \ HTTP 处理函数之间的数据共享，我们将定义自己的自己的实现 `http.Handler` 接口的自定义类型。\n\n《A Tour of Go》中关于接口的章节\
  \ [`tour.golang.org/methods/9`](https://tour.golang.org/methods/9)有助于复习这个主题。\n\n\
  ### Goroutine 和通道\n\n我们将使用 goroutine 和通道来在我们的应用程序中实现并行执行。我建议阅读一下《A Tour of Go》中的\
  \ `Concurrency` 章节：[`tour.golang.org/concurrency/1`](https://tour.golang.org/concurrency/1)。请特别注意使用\
  \ `select` 运算符等待多通道通信操作示例。\n\n## 测试\n\n我们将专门使用标准库的测试包来编写所有测试，并使用 Go 测试来执行所有测试。我们还使用了诸如\
  \ `net/http/httptest` 等库提供的优秀支持来测试 HTTP 客户端和服务器。gRPC 库也提供了类似的支持。在最后一章，我们将使用第三方包\
  \ [`github.com/testcontainers/testcontainers-go`](https://github.com/testcontainers/testcontainers-go)，通过\
  \ Docker Desktop 创建本地测试环境。\n\n在某些测试中，特别是编写命令行应用程序时，我们在编写测试时使用了“表驱动测试（Table Driven\
  \ Tests）”风格，如页面 [`github.com/golang/go/wiki/TableDrivenTests`](https://github.com/golang/go/wiki/TableDrivenTests)\
  \ 中描述的那样。\n\n## 总结\n\n在本书的引言中，你已经安装了创建各种应用程序所需的软件，这些应用程序将在书的其余部分使用。然后我介绍了书中其余部分所的一些约定和假设。最后，我描述了你必须熟悉的语言关键特性，以便最好地利用本书的内容。\n\
  \n太棒了！现在你准备好从第 1 章开始你的之旅了，在那里你将学习如何创建可测试的命令行应用程序。\n\n# 第 1 章\n\n编写命令行应用程序\n\n在本章中，你将了解编写命令行应用程序的构建模块。你将使用标准库包创建命令行界面，接收用户输入，并学习应用程序的测试方法。让我们开始吧！\n\
  \n## 你的第一个应用程序\n\n所有的命令行应用程序主要执行以下步骤：\n\n* 接收用户输入\n* 执行某些检查\n* 使用输入执行某些自定义任务\n*\
  \ 向用户展示结果；即成功或失败\n\n在命令行应用程序中，用户可以通过多种方式指定输入。两种常用方法是：作为执行程序时的参数，以及通过交互模式进行输入。首先，你将实现一个名为*greeting（欢迎）*的命令行应用程序，它将要求用户指定姓名和他们想要欢迎的次数。姓名将在提示由用户输入，次数将作为执行应用程序时的参数指定。然后程序将显示指定次数的用户消息。在编写完整应用程序后，执行示例如下：\n\
  \n```\n$ ./application 6\nYour name please? Press the Enter key when done.\nJoe\
  \ Cool\nNice to meet you Cool\nNice to meet you Cool\nNice to meet you Cool\nNice\
  \ to meet you Cool\n```\n\n首先，让我们看看请求用户输入姓名的函数：\n\n```\nfunc getName(r io.Reader,\
  \ w io.Writer) (string, error) {\n    msg := \"Your name please? Press the Enter\
  \ key when done.\\n\"\n    fmt.Fprintf(w, msg)\n\n    scanner := bufio.NewScanner(r)\n\
  \    scanner.Scan()\n    if err := scanner.Err(); err != nil {\n        return \"\
  \", err\n    }\n    name := scanner.Text()\n    if len(name) == 0 {\n        return\
  \ \"\", errors.New(\"You didn't enter your name\")\n    }\n    return name, nil\n\
  }\n```\n\n`getName()` 函数接受两个参数。第一个参数 `r` 是一个满足 `io` 包定义的 Reader 接口的变量。该变量的示例是 `os`\
  \ 包中定义的 `Stdin`。它代表标准输入——通常是运行程序的终端会。\n\n第二个参数 `w` 是一个满足 `io` 包定义的 Writer 接口的变量。该变量的示例是\
  \ `os` 包中定义的 `Stdout`。它代表应用程序的标准输出——通常是运行程序的终端会。\n\n\n\n\n该函数首先使用 `fmt` 包中的 `Fprintf()`\
  \ 函数向指定的写入器 `w` 写入提示信息。随后，通过调用带有读取器 `r` 的 `NewScanner()` 函数，创建一个类型为 `Scanner` 的变量（如\
  \ `bufio` 包中定义）。这允许你使用 `Scan()` 函数扫描读取器以获取任何输入数据。默认情况下，`Scan()` 函数在读取到换行符后返回值。随后，`Text()`\
  \ 函数将读取到的数据以字符串的形式返回。为了确保用户没有输入空行作为输入，使用了 `len()` 函数，如果用户确实输入了空行，则返回错误。\n\n`getName()`\
  \ 函数返回两个值：一个 `string` 类型，另一个是 `error` 类型。如果成功读取了用户输入的名称，则返回名称和零值错误（nil）。然而，如果发生错误，则返回空字符串和错误。\n\
  \n下一个关键函数是 `parseArgs()`。它接收一个字符串切片并返回两个值：一个是 `config` 类型，第二个是 `error` 类型：\n\n```\n\
  type config struct {\n    numTimes   int\n    printUsage bool\n}\n\nfunc parseArgs(args\
  \ []string) (config, error) {\n    var numTimes int\n    var err error\n    c :=\
  \ config{}\n    if len(args) != 1 {\n        return c, errors.New(\"Invalid number\
  \ of arguments\")\n    }\n\n    if args[0] == \"-h\" || args[0] == \"--help\" {\n\
  \        c.printUsage = true\n        return c, nil\n    }\n\n    numTimes, err\
  \ = strconv.Atoi(args[0])\n    if err != nil {\n        return c, err\n    }\n \
  \   c.numTimes = numTimes\n\n    return c, nil\n}\n```\n\n`parseArgs()` 函数创建一个类型为\
  \ `config` 的对象 `c` 来存储这些数据。配置结构体用于在内存中表示应用程序在运行时将依赖的数据。它有两个字段：整数字段 `numTimes`，包含要打印问候语的次数；以及布尔字段\
  \ `printUsage`，指示用户是否指示打印帮助信息信息。\n\n传递给程序的命令行参数通过 `os` 包中定义的 `Args` 切片可用。切片的第一个元素是程序本身的名字，而\
  \ `os.Args[1:]` 切片包含了你的程序可能需要的参数。这是一个传递给 `parseArgs()` 的字符串切片。函数首先检查命令行参数的数量是否不等于\
  \ 1，如果是，则使用下面的代码片段返回空配置对象和错误：\n\n```\nif len(args) != 1 {\n    return c, errors.New(\"\
  Invalid number of arguments\")\n}\n```\n\n如果只指定了一个参数，且参数为 `-h` 或 `-help`，则 `printUsage`\
  \ 字段被赋值为 `true`，并使用下面的片段返回对象 `c` 和 `nil` 错误：\n\n```\nif args[0] == \"-h\" || args[0]\
  \ == \"-help\" {\n    c.printUsage = true\n    return c, nil\n}\n```\n\n最后，假设指定的参数是打印问候语的次数，并使用\
  \ `strconv` 包中的 `Atoi()` 函数将参数（字符串）转换为对应的整数值：\n\n```\nnumTimes, err = strconv.Atoi(args[0])\n\
  if err != nil {\n    return c, err\n}\n```\n\n如果 `Atoi()` 函数返回非零值，则返回该值；否则，`numTimes`\
  \ 设置为转换后的数字：\n\n```\nc.numTimes = numTimes\n```\n\n到为止，我们已经看到了如何读取用户输入和命令行参数。下一步是确保输入在逻辑上是正确的；换句话说，对于应用程序是否有意义。例如，如果用户为打印次数指定了\
  \ `0`，这在逻辑上是一个错误的值。`validateArgs()` 函数执行此检查：\n\n```go\nfunc validateArgs(c config)\
  \ error {\n    if !(c.numTimes > 0) {\n        return errors.New(\"specify a number\
  \ greater than 0\")\n    }\n    return nil\n}\n```\n\n如果字段 `numTimes` 的值大于 `0`，`validateArgs()`\
  \ 函数返回 true。在处理并检查命令行参数后，应用程序调用 `runCmd()` 函数根据 `config` 对象中的值执行相应的操作：\n\n```go\n\
  func runCmd(r io.Reader, w io.Writer, c config) error {\n    if c.printUsage {\n\
  \        printUsage(w)\n        return nil\n    }\n\n    name, err := getName(r,\
  \ w)\n    if err != nil {\n        return err\n    }\n    greetUser(c, name, w)\n\
  \    return nil\n}\n```\n\n如果字段 `printUsage` 的值设置为 `true`（用户指定的 `-help` 或 `-h`），则调用\
  \ `printUsage()` 函数并返回零值错误。否则，调用 `getName()` 函数，要求用户输入其名称。如果 `getName()` 返回非零错误，则返回该错误。否则，调用\
  \ `greetUser()` 函数。`greetUser()` 函数根据提供的配置向用户显示问候语：\n\n```go\nfunc greetUser(c config,\
  \ name string, w io.Writer) {\n    msg := fmt.Sprintf(\"Nice to meet you %s\\n\"\
  , name)\n    for i := 0; i < c.numTimes; i++ {\n        fmt.Fprintf(w, msg)\n  \
  \  }\n}\n```\n\n完整的问候应用程序如列表 1.1 所示。`main()` 函数首先从第二个参数开始使用命令行切片调用 `parseArgs()`。我们从函数获取两个值：`c`（`config`\
  \ 对象）和 `err`（错误值）。如果返回了非零错误，将执行以下步骤：\n\n1.  打印错误。\n2.  通过 `printUsage()` 函数并传递 `os.Stdout`\
  \ 作为写入器来打印使用信息。\n3.  通过 `os` 包中的 `Exit()` 函数以退出码 `1` 退出程序。\n\n如果参数解析正确，则使用 `parseArgs()`\
  \ 返回的 `config` 对象 `c` 调用 `validateArgs()` 函数。\n\n最后，如果 `validateArgs()` 返回零值错误，则调用\
  \ `runCmd()` 函数，传递读取器 `os.Stdin`、写入器 `os.Stdout` 以及 `config` 对象 `c`。\n\n创建一个新目录\
  \ `chap1/manual-parse/` 其中初始化模块：\n\n```\n$ mkdir -p chap1/manual-parse\n$ cd chap1/manual-parse\n\
  $ go init github.com/username/manual-parse\n```\n\n然后将列表 1.1 保存为名为 `main.go` 的文件并编译：\n\
  \n```\n$ go build -o application\n```\n\n在不指定任何参数的情况下运行命令。你会看到错误以及下面的使用信息：\n\n```\n\
  $ ./application\nInvalid number of arguments\nUsage: ./application <integer> [-h|--help]\n\
  \nA greeter application which prints the name you entered <integer> number of times.\n\
  ```\n\n此外，你还会看到程序的退出码为 `1`。\n\n```\n$ echo $?\n1\n```\n\n如果你在 Windows 上使用 PowerShell，可以使用命令\
  \ `echo $LastExitCode` 来查看退出码。这是命令行应用程序另一个值得注意的行为。任何执行失败的情况都应在使用 `os` 包定义的 `Exit()`\
  \ 函数终止后导致非零退出码。\n\n如果指定 `-h` 或 `-help`，将打印使用信息：\n\n```\n$ ./application -help\n\
  Usage: ./application <integer> [-h|-help]\n\nA greeter application which prints\
  \ the name you entered <integer> number of times.\n```\n\n最后，让我们看看成功执行程序时的样子：\n\n\
  ```\n$ ./application 5\nYour name please? Press the Enter key when done.\nJoe Cool\n\
  Nice to meet you Joe Cool\nNice to meet you Joe Cool\nNice to meet you Joe Cool\n\
  Nice to meet you Joe Cool\nNice to meet you Joe Cool\n```\n\n\n\n2. `-h` 或 `-help`\
  \ 作为命令行参数指定。\n\n3. 问候语将向用户显示指定的次数。\n\n然而，手动测试容易出错且非常繁琐。接下来，你将学习如何为你的应用程序编写自动化测试。\n\
  \n## 编写单元测试\n\n标准库中的 `testing` 包包含了编写测试以检查你的应用程序行为所需的所有内容。\n\n首先，我们来看 `parseArgs()`\
  \ 函数。它的定义如下：\n\n```\nfunc parseArgs(args []string) (config, error)       {}\n```\n\
  \n它有一个输入：一个字符串切片，代表程序在调用时指定的命令行参数。返回值表示一个 `config` 类型的值和一个 `error` 类型的值。\n\n`testConfig`\
  \ 结构体将用于封装特定的测试用例：代表输入命令行参数的字符串切片（位于 `args` 字段）、返回到 `err` 字段的预期错误值，以及嵌入 `config`\
  \ 结构体中返回的预期 `config` 值：\n\n```go\ntype testConfig struct {\n    args []string\n\
  \    err  error\n    config\n}\n```\n\n### 测试用例示例\n\n```go\n{\n    args:   []string{\"\
  -h\"},\n    err:    nil,\n    config: config{printUsage: true, numTimes: 0},\n},\n\
  ```\n\n这个测试用例检查了执行应用程序时将 `-h` 作为命令行参数指定的行为。\n\n我们又添加了几个测试用例，并如下方式初始化测试用例切片：\n\n\
  ```go\ntests := []testConfig{\n    {\n        args:   []string{\"-h\"},\n      \
  \  err:    nil,\n        config: config{printUsage: true, numTimes: 0},\n    },\n\
  \    {\n        args:   []string{\"10\"},\n        err:    nil,\n        config:\
  \ config{printUsage: false, numTimes: 10},\n    },\n    {\n        args:   []string{\"\
  abc\"},\n        err:    errors.New(\"strconv.Atoi: parsing \\\"abc\\\": invalid\
  \ syntax\"),\n        config: config{printUsage: false, numTimes: 0},\n    },\n\
  \    {\n        args:   []string{\"1\", \"foo\"},\n        err:    errors.New(\"\
  Invalid number of arguments\"),\n        config: config{printUsage: false, numTimes:\
  \ 0},\n    },\n}\n```\n\n一旦我们定义了上面的测试配置切片，我们将遍历它们，使用 `args` 中的值调用 `parseArgs()`\
  \ 函数，并检查返回值 `c` 和 `err` 是否分别符合预期的 `config` 类型和 `error` 类型的值。完整的测试将如 列表 1.2 所示。\n\
  \n在与你保存 列表 1.1 相同的目录中，将 列表 1.2 保存为名为 `parse_flags_test.go` 的文件。现在，使用 `go test` 运行测试：\n\
  \n```\n$ go test -v\n=== RUN   TestParseArgs\n--- PASS: TestParseArgs (0.00s)\n\
  PASS\nok          github.com/practicalgo/code/chap1/manual-parse        0.093\n\
  ```\n\n在运行 `go test` 时传递 `-v` 标志还会显示正在执行的测试函数及其结果。\n\n接下来，我们查看定义为 `func validateArgs(c\
  \ config) error` 的 `validateArgs()` 函数。根据函数的规范，我们再次定义测试用例切片。然而，我们不再使用命名类型，而是如下使用`匿名`类型：\n\
  \n```go\ntests := []struct {\n    c   config\n    err error\n}{\n    {\n       \
  \ c:   config{},\n        err: errors.New(\"Must specify a number greater than 0\"\
  ),\n    },\n    {\n        c:   config{numTimes: -1},\n        err: errors.New(\"\
  Must specify a number greater than 0\"),\n    },\n    {\n        c:   config{numTimes:\
  \ 10},\n        err: nil,\n    },\n}\n```\n\n每个测试用例包含两个字段：输入对象 `c` 类型和预期的 `err`\
  \ 值。测试函数在 列表 1.3 所示。\n\n在与 列表 1.2 相同的目录中，将 列表 1.3 保存为 `validate_args_test.go` 文件。\n\
  \n\n\n用户界面由以下组件组成：\n\n* `-h` — 逻辑选项，通常用于输出帮助文本。\n* `-n <value>` 期望用户指定参数 `n` 的值。应用程序逻辑决定了该值预期的数据类型。\n\
  * `-silent` — 另一个逻辑参数。指定它将该值设置为 `true`。\n* `arg1` 和 `arg2` 被称为位置参数。位置参数的数据类型和解释完全由应用程序定义。\n\
  \n`flag` 包实现了内置的类型和方法，用于编写具有上述标准行为的命令行应用程序。当您在运行应用程序时指定 `-h` 参数时，所有其他参数（如果已指定）都将被忽略，并将打印帮助信息。\n\
  \n应用程序将包含*必选*和*可选*参数的组合。\n\n这里还需要注意的是，任何位置参数都必须在指定了所有*必要*参数*之后*才能指定。`flag` 包一旦遇到位置参数、`-`\
  \ 或 `--`，就会停止对参数解析。\n\n表 1.1 总结了该包在解析命令行参数示例时的行为。\n\n表 1.1：通过 `flag` 解析命令行参数\n\n\
  | 命令行参数 | `FLAG` 解析行为 |\n| --- | --- |\n| * `-h` | 显示帮助信息。 |\n| * `-n 1 hello -h`\
  \ | 显示帮助信息。 |\n| * `-n 1 Hello` | 标志 `n` 的值被设置为 `1`，`Hello` 作为位置参数可用。 |\n| * `-n\
  \ 1 Hello` | 标志 `n` 的值被设置为 `1`，其余部分忽略。 |\n| * `Hello -n 1` | `-n 1` 被忽略。 |\n\n让我们来看一个例子，通过重写问候应用程序，使得次数由参数\
  \ `-n` 指定。界面如下：\n\n```\n$ ./application -n 2\nYour name please? Press the Enter\
  \ key when done.\nJoe Cool\nNice to meet you Joe Cool\n```\n\n与代码 1.1 相比，关键在于 `parseArgs()`\
  \ 函数的编写方式：\n\n```go\nfunc parseArgs(w io.Writer, args []string) (config, error)\
  \ {\n        c := config{}\n        fs := flag.NewFlagSet(\"greeter\", flag.ContinueOnError)\n\
  \        fs.SetOutput(w)\n        fs.IntVar(&c.numTimes, \"n\", 0, \"Number of times\
  \ to greet\")\n        err := fs.Parse(args)\n        if err != nil {\n        \
  \        return c, err\n        }\n        if fs.NArg() != 0 {\n               \
  \ return c, errors.New(\"Positional arguments specified\")\n        }\n        return\
  \ c, nil}\n```\n\n该函数接受两个参数：满足 `io.Writer` 接口的变量 `w` 和表示解析参数的字符串数组。它返回 `config`\
  \ 对象和 `error`。为了解析，创建一个 `FlagSet` 对象：\n\n```go\nfs := flag.NewFlagSet(\"greeter\"\
  , flag.ContinueOnError)\n```\n\n`flag` 包定义的 `NewFlagSet()` 函数用于创建 `FlagSet` 对象。将其视为用于处理命令行接收参数的抽象。`NewFlagSet()`\
  \ 的第一个参数是将在帮助信息中显示的命令名称。第二个参数设置了在解析命令行发生错误时发生的情况；即调用 `fs.Parse()` 函数时。如果指定了 `ContinueOnError`\
  \ 选项，即使 `Parse()` 返回非空错误，程序也将继续。这在您希望在错误情况下执行自定义处理时有用。其他可能的值是 `ExitOnError`（停止程序）和\
  \ `PanicOnError`（调用 `panic()`）。`ExitOnError` 和 `PanicOnError` 的区别在于，在后者的情况下可以使用\
  \ `recover()` 函数在程序之前执行任何清理操作。\n\n`SetOutput()` 方法指定了初始化 `FlagSet` 对象将用于写入任何诊断或输出消息。默认设置为\
  \ `os.Stderr`。将其设置为指定的写入器 `w` 允许我们编写单元测试来检查行为。\n\n接下来定义第一个变体：\n\n```go\nfs.IntVar(&c.numTimes,\
  \ \"n\", 0, \"Number of times to greet\")\n```\n\n`IntVar()` 方法用于创建一个预期类型为 `int`\
  \ 的参数。方法的第一个参数是存储整数的变量地址。第二个参数是选项本身 `n`。第三个参数是默认值，最后一个参数是描述参数用途的字符串。它会自动显示在程序的帮助文本中。对于其他数据类型——`float`、`string`\
  \ 和 `bool` 也定义了类似的方法。您也可以为自定义类型定义标志参数。\n\n接下来我们传递切片 `args[]` 调用 `Parse()` 函数：\n\n\
  ```go\nerr := fs.Parse(args)\nif err != nil {\n        return c, err\n}\n```\n\n\
  这是一个读取切片元素并检查它们是否符合定义的标志的函数。在检查期间，它尝试填充指定变量中的值，并根据 `NewFlagSet()` 函数指定的第二个参数返回给调用者的错误或停止执行。如果返回非空错误，`parseArgs()`\
  \ 返回对象和错误：\n\n```go\nif fs.NArg() != 0 {\n        return c, errors.New(\"Positional\
  \ arguments specified\")\n}\n```\n\n如果返回空错误，我们检查是否指定了位置参数。`NArg()` 返回解析后位置参数的数量。\n\
  \n完整程序见代码 1.5。\n\n`config` 结构体类型已修改，使其不再包含 `printUsage` 字段，因为 `parseArgs()` 现在处理\
  \ `-h` 参数。创建一个新目录 `chap1/flag-parse/` 并在其中初始化模块：\n\n```\n$ mkdir -p chap1/flag-parse\n\
  $ cd chap1/flag-parse\n$ go mod init github.com/username/flag-parse\n```\n\n然后将代码\
  \ 1.5 保存为名为 `main.go` 的文件并编译：\n\n```bash\n$ go build -o application\n```\n\n\n\n\
  \n```\n$ ./application -n abc\ninvalid value \"abc\" for flag -n: parse error\n\
  Usage of greeter:\n  -n int\n            Number of times to greet\ninvalid value\
  \ \"abc\" for flag -n: parse error\n```\n\n注意我们是如何自动获取类型检查错误的，因为我们正尝试指定一个非整数值。此外，请注意我们在这里再次收到了两次错误。我们将在本章稍后修复它。\n\
  \n最后，让我们带有允许的参数 `-n` 程序：\n\n```\n$ ./application -n 4\nYour name please? Press the\
  \ Enter key when done.\nJohn Doe\nNice to meet you John Doe\nNice to meet you John\
  \ Doe\nNice to meet you John Doe\nNice to meet you John Doe\n```\n\n### 测试解析逻辑\n\
  \n与第一个版本相比，我们问候程序中的主要变化在于我们如何使用 `flag` 包来分析命令行参数。你会发现，你已经写好了一个问候程序，特别是 `parseArgs()`\
  \ 函数，并且它的形式非常便于模块化测试：\n\n1. 在函数中创建了一个新的 `FlagSet` 对象。\n2. 使用 `FlagSet` 对象的 `Output()`\
  \ 方法，你确保了来自 `FlagSet` 方法的任何消息都会写入指定的 `io.Writer` 对象 `w` 中。\n3. 用于解析的参数通过参数 `args`\
  \ 传递。\n\n该函数封装得良好，并且没有使用任何全局状态。函数的测试显示在 列表 1.6 中。\n\n将 列表 1.6 保存到你保存 列表 1.5 的目录中。将文件命名为\
  \ `parse_args_test.go`。\n\n`runCmd()` 函数的模块化测试与 列表 1.4 相同，但缺少了第一个测试，该测试用于检查当参数 `printUsage`\
  \ 值被设置为 `true` 时 `runCmd()` 的行为。我们想要测试的测试用例如下：\n\n```\ntests := []struct {\n   \
  \ c      config\n    input  string\n    output string\n    err    error\n}{\n  \
  \  {\n        c:      config{numTimes: 5},\n        input:  \"\",\n        output:\
  \ strings.Repeat(\"Your name please? Press the Enter key when done.\\n\", 1),\n\
  \        err:    errors.New(\"You didn't enter your name\"),\n    },\n    {\n  \
  \      c:      config{numTimes: 5},\n        input:  \"Bill Bryson\",\n        output:\
  \ \"Your name please? Press the Enter key when done.\\n\" + strings.Repeat(\"Nice\
  \ to meet you Bill Bryson\\n\", 5),\n    },\n}\n```\n\n你可以在 `flag-parse` 子目录下的 `run_cmd_test.go`\
  \ 文件中找到完整的测试。\n\n`validateArgs()` 函数的测试与 列表 1.3 相同。你可以在 `flag-parse` 子目录下的 `validate_args_test.go`\
  \ 文件中找到它。现在运行所有测试：\n\n```\n$ go test -v\n=== RUN   TestSetupFlagSet\n--- PASS: TestSetupFlagSet\
  \ (0s)\n=== RUN   TestRunCmd\n--- PASS: TestRunCmd (0s)\n=== RUN   TestValidateArgs\n\
  --- PASS: TestValidateArgs (0s)\nPASS\nok      github.com/practical-go/chap1/flag-parse\
  \    0.01s\n```\n\n太棒了。现在你重写了问候程序的解析逻辑以使用 `flag` 包，然后更新了模块测试以检查新的行为。接下来，你将通过几种方式改进用户界面。在这样做之前，让我们先完成\
  \ 练习 1.2。\n\n## 改进用户界面\n\n在接下来的章节中，你将通过以下三种方式改进用户界面：\n\n* 删除重复的错误信息\n* 配置用法帮助信息\n\
  * 允许用户通过位置参数输入名称\n\n在实现这些改进时，你将学习如何创建自定义错误、配置 `FlagSet` 对象以打印自定义的用法信息以及访问位置参数。\n\
  \n### 删除重复的错误信息\n\n你可能注意到错误显示了两次。这是由于 `main()` 函数中的一段代码引起的：\n\n```\nc, err := parseArgs(os.Stderr,\
  \ os.Args[1:])\nif err != nil {\n    fmt.Println(err)\n    os.Exit(1)\n}\n```\n\n\
  当 `Parse()` 函数遇到错误时，它会将该错误输出到 `fs.SetOutput()` 调用设置的输出实例。随后，返回的错误也会通过上述代码段在 `main()`\
  \ 中打印。在 `main()` 中不打印错误似乎是一个简单的解决方案。但这意味着任何在指定位置参数时返回的错误将不会显示。然而，为了不在 `main()` 中打印错误，我们可以通过以下方式创建自定义错误值：\n\
  \n```go\nvar errArgSpecified = errors.New(\"positional arguments specified\")\n\
  ```\n\n然后在 `parseArgs()` 函数中返回它：\n\n```go\nif fs.NArg() > 1 {\n    return c, errArgSpecified\n\
  }\n```\n\n然后在 `main()` 中更新代码：\n\n```go\nc, err := parseArgs(os.Stderr, os.Args[1:])\n\
  if err != nil {\n    if errors.Is(err, errArgSpecified) {\n        fmt.Fprintln(os.Stderr,\
  \ err)\n    }\n    os.Exit(1)\n}\n```\n\n### 配置用法信息\n\n如果你将 列表 1.5 与 列表 1.1 进行比较，你会发现用法信息没有指定。这是因为\
  \ `flag` 包根据 `FlagSet` 的名称和参数自动创建了它。然而，如果你自定义它，可以通过为 `FlagSet` 对象的 `Usage` 属性设置函数来实现：\n\
  \n```go\nfs.Usage = func() {\n    var usageString = `\nA greeter application which\
  \ prints the name you entered a specified number of times.\n \nUsage of %s: <options>\
  \ [name]`\n\n    fmt.Fprintf(w, usageString, fs.Name())\n    fmt.Fprintln(w)\n \
  \   fs.PrintDefaults()\n}\n```\n\n\n\n\n接下来，你将进行最后的改进。欢迎程序现在还允许通过位置参数指定名称。如果未指定名称，你将在交互式模式下提示输入名称。\n\
  \n### 通过位置参数接收名称\n\n首先，更新 `config` 结构体，添加一个字符串类型的 `name` 字段，如下所示：\n\n```go\ntype\
  \ config struct {\n    numTimes int\n    name     string\n}\n```\n\n然后将 `greetUser()`\
  \ 函数更新为如下内容：\n\n```go\nfunc greetUser(c config, w io.Writer) {\n    msg := fmt.Sprintf(\"\
  Nice to meet you %s\\n\", c.name)\n    for i := 0; i < c.numTimes; i++ {\n     \
  \   fmt.Fprintf(w, msg)\n    }\n}\n```\n\n接着，我们如下所示更新自定义错误值：\n\n```go\nvar errInvalidPosArgSpecified\
  \ = errors.New(\"More than one positional argument specified\")\n```\n\n现在我们如下所示更新\
  \ `parseArgs` 函数以处理位置参数，如果找到，则设置 `config` 对象的属性：\n\n```go\nif len(args) > 1 {\n\
  \    return c, errInvalidPosArgSpecified\n}\nif len(args) == 1 {\n    c.name = args[0]\n\
  }\n```\n\n`runCmd()` 函数被更新为如下内容，如果未指定它将在交互式模式下请求用户输入名称，如果为空：\n\n```go\nfunc runCmd(rd\
  \ io.Reader, w io.Writer) (config, error) {\n    var c config\n    var err error\n\
  \    c, err = parseArgs(os.Args[1:])\n    if err != nil {\n        return c, err\n\
  \    }\n    if c.name == \"\" {\n        c.name, err = getName(rd)\n        if err\
  \ != nil {\n            return c, err\n        }\n    }\n    greetUser(c, w)\n \
  \   return c, nil\n}\n```\n\n所有更改后的完整程序在示例 1.7 中所示。如下所示构建它：\n\n```bash\n$ go build\
  \ -o application\n```\n\n运行构建好的程序并使用 `-help`，你会看到使用信息：\n\n```bash\n$ ./application\
  \ -help\nA greeter application which prints the name you entered a specified of\
  \ times.\n \nUsage of greeter: <options> [name]\n \nOptions:\n  -n int\n       \
  \     Number of times to greet\n```\n\n现在通过位置参数指定名称：\n\n```bash\n$ ./application\
  \ 1 \"Jane Doe\"\nNice to meet you Jane Doe\n```\n\n接下来指定错误输入——字符串作为选项 `-n` 的值：\n\
  \n```bash\n$ ./application -n a \"Jane Doe\"\ninvalid value \"a\" for flag -n: parse\
  \ error\n \nA greeter application which prints the name you entered a specified\
  \ number of times.\n \nUsage of greeter: <options> [name]\n \nOptions:\n  -n\n```\n\
  \n这里需要注意两点：\n\n* 现在错误只显示一次，而不是两次。\n* 我们的自定义使用信息取代了默认值。\n\n## 更新单元测试\n\n我们将通过更新已修改函数的单元测试来结束本章。首先考虑\
  \ `parseArgs` 函数。我们定义了一个用于测试用匿名匿名结构：\n\n```go\ntests := []struct {\n    args   []string\n\
  \    config config\n    output string\n    err    error\n}{\n}\n```\n\n字段如下：\n\n\
  * `args`: 包含用于分析的命令行参数切片。\n* `config`: 代表 `config` 对象的预期值的内置字段。\n* `output`: 将存储预期标准输出的字符串。\n\
  * `err`: 将存储预期错误的值。\n\n然后，我们定义了测试用例切片，代表不同的测试用例。第一个如下所示：\n\n```go\n{\n    args:\
  \ []string{\"-h\"},\n    output: `\nA greeter application which prints the name\
  \ you entered a specified number of times.\n \nUsage of greeter: <options> [name]\n\
  \ \nOptions: \n  -n int\n            Number of times to greet\n`,\n    err:    errors.New(\"\
  flag: help requested\"),\n    config: config{numTimes: 0},\n},\n```\n\n\n\n在本章的开始，我们通过直接解析命令行参数实现了一个基础的命令行界面。随后，你学习了如何使用\
  \ `flag` 包来定义标准的命令行界面。你不再需要手写实现语法解析和参数检查，而是学会了使用该包的内置支持来处理自定义参数和数据类型检查。在整个章节中，你编写了封装良好的函数，以简化单元测试。\n\
  \n在接下来的一章中，你将继续深入学习 `flag` 包，学习如何实现带有子命令的命令行应用程序，提高应用程序的可靠性以及许多其他内容。\n\n# 第 2 章：高级命令行应用程序\n\
  \n在本章中，你将学习如何使用 `flag` 包来实现带有子命令的命令行应用程序。接下，你将看到如何通过使用上下文（contexts）来确保命令行应用程序行为的可预测性。最后，你将学习如何在你的应用程序中组合上下文并处理操作系统信号。让我们开始吧。\n\
  \n## 实现子命令\n\n`子命令`（Subcommands）是将你的命令行应用程序的功能划分为逻辑上独立的命令的方法，每个命令都有自己的参数和操作数。你有一个顶层命令——即你的应用程序——然后你有一组子命令，每个子命令都有自己的参数和操作数。例如，Go\
  \ 工具链作为一个单一应用程序 `go` 存在，它就是一个顶层命令。作为 Go 开发人员，你将通过特定的子命令如 `build`、`fmt` 和 `test`\
  \ 与它的不同功能进行交互。\n\n你记得在第 1 章 中，为了创建一个命令行应用程序，你首先创建一个 `FlagSet` 对象。为了创建一个带有子命令的应用程序，你将为每个子命令创建一个\
  \ `FlagSet` 对象。然后，根据指定的子命令，使用相应的 `FlagSet` 对象来解析剩余的命令行参数（参见 图 2.1）。\n\n![图 2.1：主应用程序查看命令行参数，并在可能的情况下调用相应的子命令处理器。](img/0201.png)\n\
  \n`图 2.1`:主应用程序查看命令行参数，并在可能的情况下调用相应的子命令处理器。\n\n让我们考虑具有两个子命令 `cmd-a` 和 `cmd-b` 的应用程序的\
  \ `main()` 函数：\n\n```go\npackage main\n\nfunc main() {\n    var err error\n    if\
  \ len(os.Args) < 2 {\n        printUsage(os.Stdout)\n        os.Exit(1)\n    }\n\
  \    switch os.Args[1] {\n    case \"cmd-a\":\n        err = handleCmdA(os.Stdout,\
  \ os.Args[2:])\n    case \"cmd-b\":\n        err = handleCmdB(os.Stdout, os.Args[2:])\n\
  \    default:\n        printUsage(os.Stdout)\n    }\n\n    if err != nil {\n   \
  \     fmt.Println(err)\n    }\n    os.Exit(1)\n}\n```\n\n`os.Args` 切片包含传递给应用程序的命令行参数。我们将处理三种输入情况：\n\
  \n1. 如果第二个参数是 `cmd-a`，则调用函数 `handleCmdA()`。\n2. 如果第二个参数是 `cmd-b`，则调用函数 `handleCmdB()`。\n\
  3. 如果调用应用程序时没有提供任何子命令，或者不满足上述情况 1 或 2 中的任一情况，则调用 `printUsage()` 函数打印帮助信息并退出。\n\n\
  `handleCmdA()` 函数实现如下：\n\n```go\nfunc handleCmdA(w io.Writer, args []string) error\
  \ {\n    var v string\n    fs := flag.NewFlagSet(\"cmd-a\", flag.ContinueOnError)\n\
  \    fs.SetOutput(w)\n    fs.StringVar(&v, \"verb\", \"argument-value\", \"Argument\
  \ 1\")\n    err := fs.Parse(args)\n    if err != nil {\n        return err\n   \
  \ }\n    fmt.Fprintf(w, \"Executing command A\")\n    return nil\n}\n```\n\n上述函数与你之前在第\
  \ 1 章中作为问候应用程序的一部分实现的 `parseArgs()` 函数非常相似。它创建一个新的 `FlagSet` 对象，配置各种参数并解析一个特定的操作数切片。`handleCmdB()`\
  \ 函数将执行子命令 cmd-b 自己的配置。\n\n`printUsage()` 函数定义如下：\n\n```go\nfunc printUsage(w io.Writer)\
  \ {\n    fmt.Fprintf(w, \"Usage: %s [cmd-a|cmd-b] -h\\n\", os.Args[0])\n    handleCmdA(w,\
  \ []string{\"-h\"})\n    handleCmdB(w, []string{\"-h\"})\n}\n```\n\n首先，我们使用 `fmt.Fprintf()`\
  \ 函数打印应用程序的使用信息字符串，然后调用各个子命令处理器函数，并将 `-h` 作为参数集中的唯一元素。\n\n### 子命令驱动应用程序的架构\n\n在开发子命令驱动的应用程序时，良好的做法是保持主包的紧凑并为子命令创建一个独立的包。你的主包将解析命令行参数并调用相应的处理器函数。如果提供的参数无法识别，则显示包含所有可识别内容的帮助信息（参见\
  \ 图 2.2）。\n\n随后你将为通用网络客户端奠基础，你将在后续章节中使用它。我们将该程序命名为 `mync`（`my network client` 的缩写）。目前你可以忽略子命令的实现，并在后续章节填充实现时再返回这里。\n\
  \n让我们先查看 `main` 包的实现。这里只有一个用于启动的 `main.go` 文件（参见 代码列表 2.2）。\n\n在顶部，我们导入 `cmd` 包，它代表包含子命令实现的子包。由于我们将初始化应用程序模块，因此指定了\
  \ `cmd` 包的绝对导入路径。`main()` 函数调用 `handleCommand()` 函数并传递所有从第二个参数开始的参数：\n\n```go\n\
  err := handleCommand(os.Args[1:])\n```\n\n如果 `handleCommand()` 函数发现收到的切片为空（意味着未指定命令行参数），它将返回一个自定义错误值：\n\
  \n\n\n\n\n```go\nif len(args) < 1 {\n    err = errInvalidSubCommand\n}\n```\n\n\
  如果指定了命令行参数，将定义 `switch..case` 结构，根据切片 `args` 的第一个元素来调用相应的命令处理函数：\n\n1. 如果该元素是 `http`\
  \ 或 `grpc`，则调用相应的处理函数。\n2. 如果第一个元素是 `-h` 或 `-help`，则调用 `printUsage()` 函数。\n3. 如果它不符合上述任何条件，则调用\
  \ `printUsage()` 函数并返回自定义的错误值。\n\n`printUsage()` 函数首先使用 `fmt.Fprintf(w, \"Usage:\
  \ mync [http|grpc] -h\\n\")` 打印消息，然后调用带有仅包含 `\"-h\"` 的切片的子命令实现。\n\n创建一个新目录 `chap2/sub-cmd-arch`\
  \ 并在其中初始化模块：\n\n```bash\n$ mkdir -p chap2/sub-cmd-arch\n$ cd chap2/sub-cmd-arch\n\
  $ go mod init github.com/username/chap2/sub-cmd-arch/\n```\n\n将列表 2.2 保存为上述目录中的\
  \ `main.go`。\n\n现在让我们来看 `HandleHttp()` 函数，它负责处理 `http` 子命令（参见列表 2.3）。\n\n`HandleHttp()`\
  \ 函数创建一个 `FlagSet` 对象并使用参数、自定义用法以及其他错误处理对其进行配置。\n\n在之前创建的目录内创建一个子目录 `cmd`，并将列表 2.3\
  \ 保存为 `httpCmd.go`。\n\n`HandleGrpc()` 函数也以类似的方式实现（参见列表 2.4）。\n\n将列表 2.4 保存为 `cmd`\
  \ 子目录下的 `grpcCmd.go`。\n\n自定义错误值 `ErrNoServerSpecified` 在 `cmd` 包中的一个独立文件中创建，如列表\
  \ 2.5 所示。\n\n在 `cmd` 子目录中将列表 2.5 保存为 `errors.go`。最终你将得到如下的源码树结构：\n\n```\n.\n|____cmd\n\
  | |____grpcCmd.go\n| |____httpCmd.go\n| |____errors.go\n|____go.mod\n|____main.go\n\
  ```\n\n在模块根目录下编译应用程序：\n\n```bash\n$ go build -o application\n```\n\n尝试使用其他参数运行生成的\
  \ `application`，从 `-help` 或 `-h` 开始：\n\n```bash\n$ ./application --help\nUsage:\
  \ mync [http|grpc] -h\n \nhttp: A HTTP client.\n \nhttp: <options> server\n \nOptions:\n\
  \  -verb string\n            HTTP method (default \"GET\")\n \ngrpc: A gRPC client.\n\
  \ \ngrpc: <options> server\n \nOptions:\n  -body string\n            Body of request\n\
  \  -method string\n            Method to call\n```\n\n在继续之前，让我们确保已经为 `main` 和 `cmd`\
  \ 包实现的功能编写单元测试。\n\n### 测试 main 包\n\n首先，让我们为主包编写一个单元测试。`handleCommand()` 是一个关键函数，它也会调用包中的其他函数。它的定义如下：\n\
  \n```go\nerr := handleCommand(w io.Writer, args []string)\n```\n\n在测试中，我们将传入程序可以调用的参数字符串切片调用该函数，并检查预期的行为。来看测试配置：\n\
