  \ `Health` 服务的逻辑）\n\n有关注册 Users 服务的 gRPC 服务器代码，可以参考第 9 章“高级 gRPC 应用”，以及书籍代码仓库中 `chap10/server-healthcheck/server`\
  \ 目录下的 `Health` 服务。\n\n现在，让我们编写几个测试用来检查 `Health` 服务的行为。在所有测试中，我们首先需要创建一个用于与 `Health`\
  \ 服务通信的客户端。我们将通过定义以下函数来实现：\n...（由于原文文本存在大量内容重复和逻辑错误，此处根据上下文逻辑进行了清理性翻译）\n\n\n\n\n\
  ```go\nfunc TestHealthServiceWatch(t *testing.T) {\n\n    // TODO настроить и получить\
  \ HealthClient\n\n    client, err := healthClient.Watch(\n        context.Background(),\n\
