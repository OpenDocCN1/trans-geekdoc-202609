  ,\n            \"MYSQL_USER\":          \"packages_rw\",\n            \"MYSQL_PASSWORD\"\
  :      \"password\",\n            \"MYSQL_ROOT_PASSWORD\": \"rootpw\",\n       \
  \ },\n        BindMounts: map[string]string{\n            bindMountPath: \"/docker-entrypoint-initdb.d\"\
  ,\n        },\n        Cmd: []string{\"--default-authentication-plugin=mysql_native_password\"\
  },\n        WaitingFor: waitForSql,\n    }\n}\n```\n\n\n\n\n`testcontainers.GenericContainer()`\
  \ 函数接受两个参数。第一个是 `context.Context` 类型的值，你可以用它来控制容器就绪所需的时间。第二个参数是 `testcontainers.GenericContainerRequest`\
  \ 类型的对象，在其中我们指定了两个字段：`ContainerRequest`，其值是我们之前创建的容器请求对象 `req`；以及 `Started` 设置为\
  \ `true`，因为我们要启动容器。该函数返回两个值：第一个是 `testcontainers.Container` 类型的对象，第二个是错误值。如果函数返回的错误值为零，我们调用\
  \ `PortEndpoint()` 方法来获取可以从主机连接到容器的地址。然后我们调用 `getDatabaseConn()` 方法来获取 `*sql.DB`\
