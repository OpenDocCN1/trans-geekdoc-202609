  \ RPC 方法 `GetUser()`。服务的实现位于主包中的 `usersServiceHandler.go` 文件中。\n\n\n\n\n```go\n\
  type serverCfg struct {\n    AuthToken string `yaml:\"auth_token\"`\n}\n\ntype telemetryCfg\
  \ struct {\n    LogLevel   int    `yaml:\"log_level\"`\n    StatsdAddr string `yaml:\"\
  statsd_addr\"`\n    JaegerAddr string `yaml:\"jaeger_addr\"`\n}\n\ntype pkgCliInput\
  \ struct {\n    Server    serverCfg\n    Telemetry telemetryCfg\n}\n```\n\n第一个结构体类型\
  \ `serverCfg` 对应 YAML 配置中的服务器对象。第二个结构体类型 `telemetryCfg` 对应 YAML 配置中的遥测对象，第三个结构体类型\
  \ `pkgCliInput` 则对应整个 YAML 配置。结构体标签 `yaml:\"auth_token\"`（以及其他）用于指定在 YAML 文件中显示的相应键名。\n\
  \n接下来，我们将使用 [go.uber.org/config](http://go.uber.org/config) 包来读取包含 YAML 格式数据的配置文件：\n\
  \n```go\nimport uberconfig \"go.uber.org/config\"\n \nprovider, err := uberconfig.NewYAML(\n\
  \    uberconfig.File(configFilePath),\n    uberconfig.Expand(os.LookupEnv),\n)\n\
  ```\n\n`NewYAML()` 函数接收一个或多个数据源。在这里我们指定了两个源：第一个是通过变量 `configFilePath` 指定路径的文件；第二个是函数\
  \ `Expand()`，它接收一个签名如下的函数作为参数：`func(string) (string, bool)`。在这里，我们将标准库中的 `os.LookupEnv`\
  \ 函数作为参数传递给 `Expand()`。结果，我们合并了环境变量和配置文件，以创建一个合并的应用配置。值得注意的是，解析 `${X_AUTH_TOKEN}`\
  \ 和 `${LOG_LEVEL:1}` 等对象值的功能是由 [go.uber.org/config](http://go.uber.org/config) 包中的\
  \ `Expand()` 函数实现的。\n\n如果 `NewYAML()` 函数返回零错误，现在我们就可以读取数据了。接下来的代码段将读取数据并尝试将其反序列化为\
  \ `pkgCliInput` 类型的对象：\n\n```go\nc := pkgCliInput{}\nif err := provider.Get(uberconfig.Root).Populate(&c);\
  \ err != nil {\n    return nil, err\n}\n```\n\n如果之前的操作成功，我们可以对读取的数据进行任何数据值检查，例如：\n\
  \n```go\nif c.Telemetry.LogLevel < -1 || c.Telemetry.LogLevel > 5 {\n    return\
  \ nil, errors.New(\"invalid log level\")\n}\n```\n\n你可以在书籍源码仓库的 `appendix-b/command-line-app`\
  \ 目录下找到使用上述逻辑读取应用配置的修改版 `pkgcli`。具体来说，在 `main.go` 文件内部你将找到实现上述逻辑的 `readConfig()`\
  \ 函数以及 `config.yml` 示例文件。\n\n如果你想使用其他文件格式以及其他读取配置数据的方法，值得研究 [github.com/spf13/viper](http://github.com/spf13/viper)\
  \ 包。\n\n## 部署\n\n（根据优化逻辑跳过重复块）\n\n\n\n\n您可以看到我们如何使用 `docker run` 命令的 `-e` 标记指定环境变量。我们使用\
  \ `-v` 标记来指定卷挂载；即我们将宿主机系统中的目录挂载到容器内部。在这里，我们挂载了包含我们要加载的包的目录。您可以在书籍源码仓库的 `appendix-b/command-line-app`\
  \ 目录中找到包含 `Dockerfile` 和应用程序的完整示例。通常，您会使用 Docker 镜像来发布服务器应用程序，但如果您的命令行应用程序想要分发默认配置文件，Docker\
  \ 镜像是一个实现此点的方便方式。\n\n## 部署服务器应用程序\n\n在公共互联网或内部网络中为其他用户部署 HTTP 或 gRPC 服务器时，应该运行多个应用程序实例。您可以直接在虚拟机机上运行服务器，也可以将其作为容器运行，并可能使用您自建的解决方案或如\
  \ `Nomad` 或 `Kubernetes` 等编排系统。\n\n然后，您必须配置一个负载均衡器，由它接收请求并将它们重定向到您的应用程序。因此，深入理解负载均衡器与应用程序之间的交互至关重要。\n\
  \n负载均衡器如何知道您的应用程序实例已准备好接收新请求？*健康检查*是负载均衡器检查应用程序实例可用性的常用方法。因此，通常会在您的应用程序中定义一个特定的\
  \ HTTP 端点或 gRPC 方法，负载均衡器可以定期向其发送请求以获取应用程序的健康状态。其他现代软件，如*服务网格*（service mesh），也执行与传统负载均衡器相同的作用，它们也会检查您的应用程序健康状况，并在决定是否将流量重定向到应用程序实例时考虑它。如果实例的健康检查失败，它将停止接收新请求，并且可能可以使用各种基础设施功能自动删除它并创建一个新的。健康检查通常分为分类：存活检查（liveness）和*深度检查*（deep\
  \ check）。第一个检查的成功响应仅确认应用程序本身能够响应检查。第二类检查更为复杂，因为它确保了应用程序依赖（如其他服务或数据库）的可用性，从而排除了网络故障或凭据错误等问题。深度检查应该频繁运行，可能仅在启动时运行，因为它针对的情况很可能在初期就被发现。\n\
  \n此外，还需要充分关注我们在书中不同章节详细讨论过的超时配置。应特别关注云提供商负载均衡器或其他类似软件的超时设置，因为它们决定了在断开连接之前会等待多久的响应。当您使用长连接时（例如在\
  \ gRPC 流通信期间），这一点也应该引起关注。\n\n在第 7 章和第 10 章中，我们讨论了如何使用证书为 HTTP 和 gRPC 应用程序加密客户端与服务器之间的通信。当负载均衡器后运行应用程序实例时，客户端的\
  \ TLS 连接通常会在负载器处中断，因此负载均衡器与您的应用程序之间的通信是不加密的。这种情况很常见，因为它简单，并且会产生虚假的安全感，因为大多数情况下这些流量处于私有网络中。但需要强调的是，这是推荐的，您应该努力加密所有的网络。\n\
  \n## 总结\n\n在应用程序中，我们讨论了与部署相关的三个关键问题：配置、流量和安全。您将采取的步骤将取决于基础设施，希望这些策略为您提供良好的指导。\n\n\
