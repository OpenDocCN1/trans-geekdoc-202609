  \ позволяет выполнять действия до или после основного обработчика.\n\n### Обработка\
  \ ошибок в middleware\n\nИспользование функции `recover()` внутри middleware позволяет\
  \ перехватывать паники, возникшие во время обработки обработчика, и предотвращать\
  \ падение сервера.\n\n```go\nfunc panicMiddleware(h http.Handler) http.Handler {\n\
  \    return http.HandlerFunc(\n        func(w http.ResponseWriter, r *http.Request)\
  \ {\n            defer func() {\n                if rValue := recover(); rValue\
  \ != nil {\n                    log.Println(\"panic detected\", rValue)\n      \
  \              w.WriteHeader(http.StatusInternalServerError)\n                 \
  \   fmt.Fprintf(w, \"Unexpected server error\")\n                }\n           \
  \ }()\n            h.ServeHTTP(w, r)\n        })\n}\n```\n\nДалее давайте посмотрим,\
  \ как мы настроим сервер, чтобы он сочетал в себе middleware для ведения журналов\
  \ и middleware для обработки паник:\n\n```go\nconfig := appConfig{\n    logger:\
  \ log.New(\n        os.Stdout, \"\", log.Ldate|log.Ltime|log.shortfile,\n    ),\n\
  }\nmux := http.NewServeMux()\nsetupHandlers(mux, &config)\nm := loggingMiddleware(panicMiddleware(mux))\n\
  err := http.ListenAndServe(listenAddr, m)\n```\n\nКлючевое утверждение выше выделено.\
  \ Во-первых, мы вызываем функцию `panicMiddleware()`, чтобы обернуть `ServeMux`.\
  \ Затем возвращенное значение `http.Handler` передается в качестве параметра функции\
  \ `loggingMiddleware()`. Возвращаемое значение этого вызова настраивается как обработчик\
  \ вызова `ListenAndServe()`.\n\nНа Figure 6.4 показано, как входящий запрос проходит\
  \ через сконфигурированное middleware к методу `ServeHTTP()` объекта `ServeMux`.\n\
  \nПри цепочке middleware самое внутреннее middleware — это то, которое выполняется\
  \ первым при обработке вашего запроса (и ответа от функции-обработчика), а самое\
  \ внешнее middleware — то, которое выполняется последним.\n\n\n\n\nВ Листин 6.2\
  \ показано полное серверное приложение, демонстрирующеезывание промежуточного ПО\
  \ с использованием типа `http.HandlerFunc`。\n\n![Figure 6.4: Использование нескольких\
  \ middleware для обработки HTTP-запросов](img/0604.png)\n\n`Figure 6.4`: Использование\
  \ нескольких middleware для обработки HTTP-запросов\n\nМы определяем новую функцию-обработчик\
  \ `panicHandler()` для обработки любого запроса по пути `/panic`. Чтобы продемонстрировать\
  \ работу middleware для обработки паники `panicMiddleware()`, нам нужно лишь сделать\
  \ в этом обработчике — вызвать функцию `panic()` с определенным текстом. Это значение\
  \ будет восстановлено функцией `recover()` в промежуточном ПО. Затем мы настраиваем\
  \ цепочку middleware в `main()` и вызываем функцию `ListenAndServe()` с обработчиком,\
  \ возвращаемым функцией `loggingMiddleware()`.\n\nСоздайте новую директорию `middleware-chaining`\
  \ и инициализируйте в ней модуль:\n\n```\n $ mkdir -p chap6/middleware-chaining\n\
  \ $ cd chap6/ middleware-chaining\n $ go mod init github.com/username/middleware-chaining\n\
  ```\n\nЗатем сохраните Листинг 6.2 как новый файл `server.go`. Соберите и запустите\
  \ сервер следующим образом:\n\n```\n $ go build -o server\n $ ./server\n```\n\n\
  Из отдельного терминала сделайте запрос к конечной точке `/panic` вашего сервера,\
  \ используя `curl` или другой HTTP-клиент:\n\n```\n $ curl http://localhost:8080/panic\n\
  \ Unexpected server error occurred\n```\n\nВ терминале, где запущенно серверное\
  \ приложение, вы увидите логи, подобныеget (все в одну строку):\n\n```\n 2021/03/16\
  \ 14:17:34 panic detected I panicked\n 2021/03/16 14:17:34 protocol=HTTP/1.1 path=/panic\
  \ method=GET\n duration=0.001575\n```\n\nВы можете видеть, что восстановленное значение\
  \ — это \"I panicked\", это строка, которую вы вызвали с помощью функции `panic()`.\
  \ Таким образом, вы убедились, что middleware для обработки паники работает. Оно\
  \ восстанавливает панику, возникшую в обработчике, регистрирует её и устанавливает\
  \ соответствующий ответ. После завершения своей работы ответ передается клиенту\
  \ через middleware слой логирования.\n\nОтлично. Теперь, когда вы знаете, как настроить\
  \ цепочку middleware, пришло время проверить свои знания в Упражнении 6.2.\n\nДо\
  \ сих пор в этой главе вы узнали ряд новых шаблонов для реализации функциональности\
  \ в нашем серверном приложении. Вы увидели, как использовать настраиваемый тип обработчика\
  \ для обмена данными между обработчиками, а также реализовать middleware. Кроме\
  \ того, чтобы иметь возможность обонуть объект `ServeMux`, вы узнали о новой методике\
  \ реализации middleware с использованием типа `HandlerFunc`. Могли бы вы просто\
  \ использовать собственный тип обработчика для достижения того же? Да, но это потребовало\
  \ бы дополнительной работы. Однако, если middleware реализует сложную часть серверной\
  \ функциональности, использование специального типа обработчика для ее реализации\
  \ является хорошим подходом. Вы можете выделить функциональность вашего middleware\
  \ в пользовательский тип с данными и методами. Вы по-прежнему сможете настроить\
  \ цепочку middleware, используя подход, который мы применили здесь.\n\nДля сложных\
  \ серверных приложений очень важно начать думать о том, как организовать различные\
  \ компоненты, что приводит нас к следующему разделу. Вы узнаете, как организовать\
  \ серверный код и написать автоматические тесты для различных компонентов.\n\n##\
  \ Написание тестов для сложных серверных приложений\n\nВ Главе 5 «Создание HTTP-серверов»\
  \ написанные вами серверные приложения состояли из трех основных функций: написания\
  \ обработчиков, регистрации обработчиков с помощью объекта `ServeMux` и вызова `ListenAndServe()`\
  \ для запуска сервера. Все функциональные возможности были реализованы в пакете\
  \ `main`, и это хорошая отправная точка для очень простых серверных приложений.\
  \ Однако когда вы начнете писать более сложные серверы, вы обнаружите, что разбиение\
  \ приложения на несколько пакетов является более практичным подходом.\n\nОдин из\
  \ способов сделать это — иметь отдельный пакет для каждой области приложения: управление\
  \ конфигурацией, middleware и функции обработчика, а также пакет `main`, объединяющий\
  \ их все вместе, и наконец, вызов функции `ListenAndServe()` для запуска сервера.\
  \ Давайте сделаем это дальше.\n\n### Организация кода\n\nТеперь мы перепишем серверное\
  \ приложение из Листинга 6.2, чтобы у нас было четыре пакета: `main`, `config`,\
  \ `handlers` и `middleware`. Создайте новую директорию `complex-server` и инициализируйте\
  \ в ней новый модуль с помощью `go mod init`:\n\n```\n $ mkdir complex-server\n\
  \ $ cd complex-server\n $ go mod init github.com/username/complex-server\n```\n\n\
  Создайте три поддиктории: `config`, `handlers` и `middleware` в каталоге.\n\nСохраните\
  \ Листинг 6.3 как `config.go` внутри директории `config`. Мы переименовываем структуру\
  \ `app` в `AppConfig`, чтобы мы могли получить к ней доступ извне. Сохраните Листинг\
  \ 6.4 как `handlers.go` внутри директории `handlers`. Мы импортируем пакет конфигурации,\
  \ используя путь `github.com/username/complex-server/config`, и определяем тип `app`.\n\
  \nЗатем сохраните Листинг 6.5 как `register.go` внутри директории `handlers`. Функция\
  \ `Register()` принимает объект `ServeMux` и значение `config.AppConfig` и регистрирует\
  \ обработчики.\n\nСохраните Листинг 6.6 как `middleware.go` внутри директории `middleware`.\
  \ Здесь мы определяем middleware для сервера. Обратите внимание, как мы теперь передаем\
  \ объект конфигурации в middleware, чтобы мы могли получить доступ к настроенному\
  \ `Logger`. Мы также добавляем метод `InitConfig()`, который принимает значение\
  \ `io.Writer`, которое мы используем для инициализации регистратора, и возвращает\
  \ значение `AppConfig`.\n\nЗатем сохраните Листинг 6.7 как `register.go` внутри\
  \ директории `middleware`. Функция `RegisterMiddleware()` устанавливает цепочку\
  \ middleware для конкретного объекта `ServeMux`.\n\nНаконец, сохраните Листинг 6.8\
  \ как `server.go` в корне каталога. Функция `setupServer()` инициализирует конфигурацию\
  \ приложения, вызывая функцию `config.InitConfig()`. Затем он регистрирует функции\
  \ обработчика с помощью объекта `ServeMux`, `mux`, вызывая функцию `handlers.Register()`.\
  \ Наконец, он регистрирует middleware, а затем возвращает обернутое значение `handler.Handler`.\
  \ В функции `main()` мы создаем объект `ServeMux`, вызываем функцию `setupServer()`\
  \ и, наконец, вызываем функцию `ListenAndServe()`.\n\nСоберите и запустите сервер\
  \ из каталога complex-server:\n\n```\n $ go build -o server\n $ ./server\n```\n\n\
  ### Тестирование функций обработчика\n\n\n\n\n测试处理函数的方法有两种方法。其中一种方法包括使用 `httptest.NewServer()`\
  \ 启动测试 HTTP 服务器，然后向该测试服务器发送请求。你已经在第 5 章中用过这种方法来测试处理函数。第二种方法是直接对处理函数进行测试，而不启动测试服务器。当你想要隔离地测试处理函数并忽略服务器应用程序的其他部分时，这种方法非常有用。这是任何大型服务器应用程序的推荐方法。让我们来看定义如下所示的\
  \ `apiHandler()` 函数：\n\n```\nfunc apiHandler(\n     w http.ResponseWriter, \n  \
  \   r *http.Request,\n     conf config.AppConfig,\n ) {\n     fmt.Fprintf(w, \"\
  Hello, world!\")\n }\n```\n\n为了隔离地测试此处理函数，我们将创建一个测试响应记录器、一个测试请求和一个 `AppConfig` 值。\n\
  \n为了创建测试响应记录器，我们将使用 `httptest.NewRecorder()` 函数。该函数返回一个类型为 `httptest.ResponseRecorder`的值，它实现了\
  \ `http.ResponseWriter` 接口：\n\n```\nw := httptest.NewRecorder()\n```\n\n为了创建测试请求，我们将使用\
  \ `httptest.NewRequest()` 函数：\n\n```\nr := httptest.NewRequest(\"GET\", \"/api\"\
  , nil)\n```\n\n`httptest.NewRequest()` 函数的第一个参数是 HTTP 请求类型——GET、POST 等。第二个参数可以是\
  \ URL 地址，例如 [`my.host.domain/api`](http://my.host.domain/api)，或者是路径，例如 `/api`。第三个参数是请求体，在这里它为零。创建一个\
  \ `AppConfig` 值：\n\n```\nb := new(bytes.Buffer)\nc := config.InitConfig(b)\n```\n\
  \n然后调用 `apiHandler()` 函数：\n\n```\napiHandler(w, r, c)\n```\n\n通过 `w.Result()` 获取记录在\
  \ `w` 中的响应。它返回一个类型为 `*http.Response`的值。列表 6.9 显示了测试函数。\n\n在通过 `w.Result()` 获取响应后，我们通过\
  \ `StatusCode` 字段提取状态码，通过 `resp.Body` 提取消息体。我们将它们与预期值进行比较。将列表 6.9 保存为 `handlers_test.go`\
  \ 并于 `handlers` 子目录下，运行以下测试：\n\n```\n $ go test  -v\n === RUN   TestApiHandler\n\
  \ --- PASS: TestApiHandler (0.00s)\n PASS\n ok          github.com/practicalgo/code/chap6/complex-server/handlers\
  \        0.576s \n```\n\n同样，你也可以为其他每个处理函数编写测试。对于 `healthCheckHandler()` 函数，你可能想要测试处理函数接收到非\
  \ GET HTTP 请求时的行为。练习 6.3 为你提供了实现这一点的。\n\n那么测试 `panicHandler()` 函数呢？由于我们知道这个函数执行了什么（它调用了\
  \ `panic()` 函数），因此这里更有意义的测试组件是处理恐慌的中间件（panic middleware）。让我们看看如何测试服务器应用程序的中间件。\n\
  \n### 测试中间件\n\n考虑 `panicMiddleware()` 函数的签名：`func panicMiddleware(h http.Handler,\
  \ c config.AppConfig) http.Handler`。该函数的参数是处理器值 `h`；需要包装的处理器以及 `config.AppConfig`\
  \ 值：\n\n```\n b := new(bytes.Buffer)\n c := config.InitConfig(b)\n m := http.NewServeMux()\n\
  \ handlers.Register(m, c)\n h := panicMiddleware(m, c)\n```\n\n我们创建一个 `http.ServeMux`\
  \ 对象，注册函数，然后调用 `panicMiddleware()`。返回值另一个 `http.Handler` 值将被另一个中间件包装，或者传递给真实服务器的\
  \ `ListenAndServe()` 调用。然而，为了测试中间件，我们直接调用处理器的 `ServeHTTP()` 方法：\n\n```\n r := httptest.NewRequest(\"\
  GET\", \"/panic\", nil)\n w := httptest.NewRecorder()\n h.ServeHTTP(w, r)\n```\n\
  \n列表 6.10 显示了完整的测试函数。调用 `panicMiddleware()` 返回的处理器的 `ServeHTTP()` 方法模拟了测试恐慌时 `ListenAndServe()`\
  \ 函数的行为。将列表 6.10 保存为 `middleware` 目录下的 `middleware_test.go` 并运行以下测试：\n\n```\n $\
  \ go test -v\n === RUN   TestPanicMiddleware\n --- PASS: TestPanicMiddleware (0.00s)\n\
  \ PASS\n ok          github.com/practicalgo/code/chap6/complex-server/middleware\
  \        0.15s\n```\n\n这种方法适用于隔离测试中间件。如果你想检查整个中间件链是否正常工作，让我们为它写一个测试。\n\n### 测试启动\n\
  \n对于列表 6.8 中的服务器应用程序，`setupServer()` 函数创建配置并注册请求处理器和中间件链。因此，启动时的行为测试等于测试该函数。\n\n\
  首先，我们将创建新的 `http.ServeMux` 和 `bytes.Buffer` 对象并调用 `setupServer()`：\n\n```\n b :=\
  \ new(bytes.Buffer)\n mux := http.NewServeMux()\n wrappedMux := setupServer(mux,\
  \ b)\n```\n\n然后，我们将使用 `httptest.NewServer()` 函数启动测试服务器，并将 `wrappedMux` 指定处理器：\n\n\
  ```\n ts := httptest.NewServer(wrappedMux)\n defer ts.Close()\n```\n\n启动测试服务器后，我们将发送\
  \ HTTP 请求并检查：\n\n1. 响应状态和体内容符合预期。\n2. 日志中间件和恐慌处理中间件正常工作。\n\n列表 6.11 显示了检查服务器配置的测试函数。在测试函数中，我们在调用\
  \ `setupServer()` 后启动测试服务器并向 `/panic` 端点发送 HTTP 请求。然后我们检查响应状态是否为 500 Internal Server\
  \ Error。在测试的剩余部分，我们检查预期日志是否写入了 `io.Writer` `b`。将列表 6.11 保存为与 `server.go` 相同目录下的\
  \ `server_test.go`（其中列表 6.8 被存储），并运行测试：\n\n```\n $ go test -v\n === RUN   TestSetupServer\n\
  \ --- PASS: TestSetupServer (0.00s)\n PASS\n ok         github.com/practicalgo/code/chap6/complex-server\
  \        0.711s\n```\n\n上述测试函数检查了服务器配置，包括你的中间件链的功能。在编写服务器应用程序的测试时，始终建议隔离测试组件，然后检查哪些测试验证了组件的集成。对于处理器和中间件，你编写了单元测试来隔离测试它们，而不启动\
  \ HTTP 服务器。对于服务器配置的最终测试，你启动了测试 HTTP 服务器以检查请求处理器和中间件的集成。\n\n你从学习 `http.Handler` 接口开始这一章。你了解到\
  \ `http.ServeMux` 是实现该接口的类型，然后编写了自己的自定义类型来实现它。你看到了如何将 `ServeMux` 对象与自定义处理器实现集成，以便在处理器函数之间交换数据。\n\
  \n随后，你学会了为服务器编写中间件，首先实现了自定义 `Handler` 类型，然后使用了 `http.HandlerFunc` 类型。你还学习了如何在你的服务器上组合中间件，以便以独立的即插即用组件形式实现服务器的通用功能。\n\
  \n\n\n最后，你已经了解了如何组织和测试带有各种组件的服务器应用程序。\n\n在下一章“就绪的 HTTP 服务器”中，你将学习为 HTTP 服务器应用程序准备部署的方法。\n\
  \n# 第 7 章：就绪的 HTTP 服务器\n\n在本章中，你将学习提高 HTTP 服务器应用程序可靠性和稳定性的方法。你将学习如何在服务器请求处理的生命周期的不同点实现超时（timeout），如何中断请求处理以节省服务器资源，以及如何实现正确的关闭。最后，你将学习如何配置你的\
  \ HTTP 服务器，以便在客户端和你的服务器之间建立安全的通信通道。让我们开始吧！\n\n## 中断请求处理\n\n考虑你的 Web 应用程序提供的特定功能，例如允许用户根据特定参数在大数据集中进行搜索。在将此功能提供给用户之前，你进行了全面的测试，并发现在你的所有测试用例中，搜索查询的执行时间均为\
  \ 500 毫秒。然而，一旦用户开始在应用程序中使用该功能，你发现对于某些搜索标准，查询请求的执行时间可能长达 30 秒，而且有时会失败。更糟糕的是，同样的搜索在重试时会在\
  \ 500 毫秒内成功完成。现在你担心这可能导致你的应用程序被攻击，因为多个这样的请求可能会使其无法处理任何请求——操作系统的资源是有限的——如打开的文件描述符、内存等。听起来熟悉吗？这就是“拒绝服务”攻击（`DoS`）是如何实施的！\n\
  \n当你开始研究这种奇怪的行为并试图找到修复方法时，你想在你的服务器上放置一个安全机制。为此，你为该请求设置了处理器超时时间。如果该操作持续超过 10 秒，你将中断请求处理并返回错误响应。这将实现两个目标：你的服务器资源不会被这些比预期耗时长的请求占用，而且你的客户端将收到一个快速响应，告知其请求无法执行。然后他们可以简单地重试，并可能获得成功的响应。让我们看看如何在\
  \ HTTP 服务器应用程序中实现这种行为。\n\n`http.TimeoutHandler()` 函数是定义在 `net/http` 包中的中间件软件，它创建一个新的\
  \ `http.Handler` 对象，封装另一个 `http.Handler` 对象，以使得如果内部处理程序没有在指定时间内完成，则将向客户端发送 HTTP\
  \ 响应 `503 Service Unavailable`。考虑这个处理函数：\n\n```go\nfunc handleUserAPI(w http.ResponseWriter,\
  \ r *http.Request) {\n    log.Println(\"I started processing the request\")\n  \
  \  time.Sleep(15 * time.Second)\n    fmt.Fprintf(w, \"Hello world!\")\n    log.Println(\"\
  I finished processing the request\")\n}\n```\n\n我们有一个 `time.Sleep()` 函数调用来模拟 15\
  \ 秒的请求处理延迟。15 秒后，它将向客户端发送 `Hello world!` 响应。日志将帮助我们更好地理解处理函数与超时处理器之间的交互，正如你很快就会看到的。\n\
  \n然后，我们将使用 `http.TimeoutHandler()` 函数来封装 `handleUserAPI()` 函数，以便在 14 秒后向客户端发送 HTTP\
  \ 503 响应——恰好在处理函数退出睡眠状态之前。处理函数的定义如下：\n\n```go\nfunc TimeoutHandler(h Handler, dt\
  \ time.Duration, msg string) Handler\n```\n\n它的参数是：`h` 是满足 `Handler` 接口的传入处理程序；`dt`\
  \ 是我们希望客户端等待处理完成的最大时长（以毫秒或秒为单位）；`msg` 是随响应发送给客户端的字符串消息。\n\n因此，为了封装 `handleUserAPI`\
  \ 函数，我们首先将其转换为满足 `Handler` 接口的值：\n\n```go\nuserHandler := http.HandlerFunc(handleUserAPI)\n\
  ```\n\n然后我们使用 14 秒的超时时间调用 `http.TimeoutHandler()`：\n\n```go\ntimeoutDuration :=\
  \ 14 * time.Second\nhTimeout := http.TimeoutHandler(\n    userHandler, timeoutDuration,\
  \ \"I ran out of time\",\n)\n```\n\n返回的对象 `hTimeout` 满足 `Handler` 接口，它是对传入处理程序 `userHandler`\
  \ 的封装，并实现了超时逻辑。然后你可以使用 `ServeMux` 注册它以直接处理请求，或者像下面所示作为中间件链的一部分：\n\n```go\nmux :=\
  \ http.NewServeMux()\nmux.Handle(\"/api/users/\", hTimeout)\n```\n\n\n\n\n```go\n\
  func handleUserAPI(w http.ResponseWriter, r *http.Request) {\n    log.Println(\"\
  I started processing the request\")\n    time.Sleep(15 * time.Second)\n\n    log.Println(\n\
  \        \"Before continuing, i will check if the timeout has already expired\"\
  ,\n    )\n    if r.Context().Err() != nil {\n        log.Printf(\n            \"\
  Aborting further processing: %v\\n\",\n            r.Context().Err(),\n        )\n\
  \        return\n    }\n    fmt.Fprintf(w, \"Hello world!\")\n    log.Println(\"\
  I finished processing the request\")\n}\n```\n\n在调用函数 `time.Sleep()` 后，我们通过方法 `r.Context()`\
  \ 获取请求上下文。然后我们检查方法调用 `Err()` 是否返回了非空错误值。如果返回了非空错误值，说明客户端连接已关闭，因此我们从处理函数中返回。由于客户端已经离开，我们通过中断请求处理来节省系统资源或防止不可预知的行为。你可以在此书源码仓库的\
  \ `chap7/abort-processing-timeout` 目录下找到带有上述处理函数的运行服务器。这种策略要求你在编写处理函数时，使其能够感知客户端连接的状态，并利用该状态来决定是否继续处理请求。\n\
  \n在另一种场景下，如果你的处理函数发送了网络请求（例如向另一个服务发送 HTTP 请求），你应该将请求上下文与传出的请求一起传递。这样，当超时处理器触发时（从而取消上下文），传出的\
  \ HTTP 请求将根本不会执行。当然，在这种情况下你不需要手动执行所有工作，因为标准库的 HTTP 客户端已经支持上下文的传递，正如你在第 4 章中所学到的。让我们来看一个说明这一点的示例。\n\
  \n考虑函数 `doSomeWork()`，它是真实函数的替代品，执行耗时 2 秒：\n\n```go\nfunc doSomeWork() {\n    time.Sleep(2\
  \ * time.Second)\n}\n```\n\n接下来查看更新后的函数 `handleUserAPI()`，它调用了函数 `doSomeWork()`：\n\
  \n```go\nfunc handleUserAPI(w http.ResponseWriter, r *http.Request) {\n    log.Println(\"\
  I started processing the request\")\n\n    doSomeWork()\n\n    req, err := http.NewRequestWithContext(\n\
  \        r.Context(),\n        \"GET\",\n        \"http://localhost:8080/ping\"\
  , nil,\n    )\n    if err != nil {\n        http.Error(\n            w, err.Error(),\n\
  \            http.StatusInternalServerError,\n        )\n        return\n    }\n\
  \    client := &http.Client{}\n    log.Println(\"Outgoing HTTP request\")\n\n  \
  \  resp, err := client.Do(req)\n    if err != nil {\n        log.Printf(\"Error\
  \ making request: %v\\n\", err)\n        http.Error(\n            w, err.Error(),\n\
  \            http.StatusInternalServerError,\n        )\n        return\n    }\n\
  \    defer resp.Body.Close()\n    data, _ := io.ReadAll(resp.Body)\n\n    fmt.Fprint(w,\
  \ string(data))\n    log.Println(\"I finished processing the request\")\n}\n```\n\
  \n`handleUserAPI()` 函数首先调用函数 `doSomeWork()`，然后通过 `/ping` 路径向另一个 HTTP 发送 GET 请求——在本例中，为了简单起见，是同一个应用程序。它使用函数\
  \ `http.NewRequestWithContext()` 创建 HTTP 请求，并要求其使用当前正在处理的请求上下文作为其上下文。获取到的 GET 请求响应随后作为响应被返回。我们预期如果超时处理器中断了请求处理，该请求将不会被执行。列表\
  \ 7.2 展示了一个可运行的服务器应用程序。\n\n现在我们使用 `userHandler` 对象调用函数 `http.TimeoutHandler()`，并将超时设置为\
  \ 1 秒。函数 `doSomeWork()` 的执行耗时 2 秒。\n\n创建一个新目录 `chap7/network-request-timeout` 其中初始化模块：\n\
  \n```bash\n$ mkdir -p chap7/network-request-timeout\n$ cd chap7/network-request-timeout\n\
  $ go mod init github.com/username/network-request-timeout\n```\n\n然后将列表 7.2 保存为\
  \ `server.go`。编译并运行程序：\n\n```bash\n$ go build -o server\n$ ./server\n```\n\n在另一个终端中，使用\
  \ `curl`（添加 `-v` 选项）对路径 `/api/users/` 发起请求：\n\n```bash\n$ curl -v localhost:8080/api/users/\n\
  # output snipped #\n>\n< HTTP/1.1 503 Service Unavailable\n# output snipped #\n\
  \ \nI ran out of time\n```\n\n客户端收到 503 Service Unavailable，错误信息为“I ran out of time”。\n\
  \n（注：原文中存在重复的英语和俄语片段，在翻译时保留了逻辑连接，以及关于上下文已过期的逻辑输出。）\n\n### 处理断开\n\n为了响应客户端断开，你将再次使用请求上下文。事实上，列表中的\
  \ `handleUserAPI()` 已经是这样写的。现在我们准备修改函数，以探索另一种使用请求上下文检测断开的模式：\n\n```go\nfunc handleUserAPI(w\
  \ http.ResponseWriter, r *http.Request) {\n    done := make(chan bool)\n\n    log.Println(\"\
  I started processing the request\")\n\n    // TODO 如上列表 7.2 所示执行传出的请求\n\n    data,\
  \ _ := io.ReadAll(resp.Body)\n\n    log.Println(\"Processing the response i got\"\
  )\n\n    go func() {\n        doSomeWork(data)\n        done <- true\n    }()\n\n\
  \    select {\n    case <-done:\n        log.Println(\"doSomeWork done:Continuing\
  \ request processing\")\n    case <-r.Context().Done():\n        log.Printf(\n \
  \           \"Aborting request processing: %v\\n\",\n            r.Context().Err(),\n\
  \        )\n        return\n    }\n\n    fmt.Fprint(w, string(data))\n    log.Println(\"\
  I finished processing the request\")\n}\n```\n\n\n\n\n接收到请求后，处理函数将执行一个发出的 HTTP GET\
  \ 调用。如之前所示，我们将传入请求的上下文作为该请求的一部分传递。接收到响应后，它会在 goroutine 中调用 `doSomeWork()` 函数。一旦函数返回，我们向\
  \ `done` 通道写入 `true`。然后我们有了一个 `select..case` 语句块，在其中我们对两个通道进行等待——`done` 通道和通过调用方法\
  \ `r.Context.Done()`返回的通道。如果我们先从 `done` 通道接收到值，我们将继续处理请求。如果我们先从第二个通道接收到值，则说明上下文已取消，我们停止处理请求并从处理函数返回。我们还将对服务器的其他部分进行一些更改。代码列表\
  \ 7.3 显示了实现了这些更改的服务器。\n\n我们将 `doSomeWork()` 中的暂停时间增加到了 15 秒，并并在 `handlePing()` 函数中引入了\
  \ 10 秒的暂停。我们还将超时处理程序的持续时间增加到 30 秒。进行这些更改是为了反映与搜索函数性能相关的新结果。因此，在此版本的服务器中，超时处理程序不会中断请求处理——这是刻意为之。\n\
  \n创建一个新目录 `chap7/client-disconnect-handling` 并在其中初始化模块：\n\n```bash\n$ mkdir -p chap7/client-disconnect-handling\n\
  $ cd chap7/client-disconnect-handling\n$ go mod init github.com/username/client-disconnect-handling\n\
  ```\n\n然后，将代码列表 7.3 保存为 `server.go`。编译并运行应用程序：\n\n```bash\n$ go build -o server\n\
  $ ./server\n```\n\n在另一个终端中，使用 `curl` 向路径 `/api/users/` 向应用程序发送请求，并在 10 秒超时前按下 Ctrl+C\
  \ 以中断请求：\n\n```bash\n$ curl -v localhost:8080/api/users/\n..\n* Connected to localhost\
  \ (::1) port 8080 (#0)\n..\n^C\n```\n\n在运行服务器的终端上，你将看到以下日志：\n\n```\n2021/04/26 09:25:17\
  \ I started processing the request\n2021/04/26 09:25:17 Outgoing HTTP request\n\
  2021/04/26 09:25:17 ping: Got a request\n2021/04/26 09:25:18 Error making request:\
  \ \"http://localhost:8080/ping\": context canceled\n```\n\n从日志可以看出，`handlePing()`\
  \ 函数接收到了请求，但在完成之前它被取消了，这是因为你取消了请求。请注意，日志消息现在显示为 `context canceled`（超时）。尝试在 10 秒后但\
  \ 15 秒到之前中断请求。\n\n你已经学会了如何在你的服务器应用程序中实现请求处理的中断方法，以响应设置的等待时间。实现此模式的目标是确保在发生意外情况时具有可预测性。然而，这些方法集中在单个处理程序函数上。接下来，我们将从服务器应用程序的角度考虑可靠性的实现。但在在此之前，你必须完成练习（练习\
  \ 7.2）。\n\n## 服务器级超时\n\n我们将从为所有处理程序函数实现全局超时开始。然后，我们将向上一个级别，研究在请求到达处理程序函数之前发生的网络交互，并研究如何在请求-响应的各个阶段确保可靠性。\n\
  \n### 为所有处理程序函数实现超时\n\n即使在注意到运行工作环境中的任何应用程序出现具体问题之前，你可能也想为所有处理程序函数实现硬性超时。这将为你的所有处理程序提供延迟的上限，并防止意外情况阻塞服务器资源。为了实现，你将再次使用\
  \ `http.TimeoutHandler()` 函数。你还记得函数的签名如下：\n\n```go\nfunc TimeoutHandler(h Handler,\
  \ dt time.Duration, msg string) Handler\n```\n\n这里需要说明的关键点是，包装的处理对象 `h` 必须实现 `http.Handler`\
  \ 接口。此外，在第 6 章中，你已经知道 `ServeMux` 类型实现了相同的接口。因此，要为所有处理函数实现全局等待时间，你只需要使用 `ServeMux`\
  \ 对象作为处理器调用 `http.TimeoutHandler()` 函数，然后使用返回的处理器调用 `http.ListenAndServe()`：\n\n\
  ```go\nmux := http.ServeMux()\nmux.HandleFunc(\"/api/users/\", userAPIHandler)\n\
  mux.HandleFunc(\"/healthz\", healthcheckHandler)\nmTimeout := http.TimeoutHandler(mux,\
  \ 5*time.Second, \"I ran out of time\")\nhttp.ListenAndServe(\":8080\", mTimeout)\n\
  ```\n\n使用上述配置，所有注册的请求处理程序将最多拥有五秒时间，然后超时处理器将触发并中断请求处理。你可以在本书源码的 `chap7/global-handler-timeout`\
  \ 目录中找到显示全局处理器等待时间的运行示例。当然，你可以将全局处理器的超时与特定处理器的超时相结合，以实现更详细的超时。将全局处理器超时与请求处理中断策略相结合，可以确保当你的应用程序出现意外场景时，你的服务器能够更好地应对快速故障。\n\
  \n接下来，我们将处理器的超时再向上一个级别，查看如何使服务器对处理器之外可能出现的问题产生免疫。\n\n### 服务器超时实现\n\n当客户端向应用程序发送请求时，在高层执行以下步骤（忽略任何注册的中间件）：\n\
  \n1. 客户端连接由服务器 goroutine 接收；即执行 `http.ListenAndServe()` 的地方。\n2. 服务器部分读取请求以确定路径，例如\
  \ `/api/users/` 或 `/healthz`。\n3. 如果路径注册了处理程序，服务器过程创建一个 `http.Request` 对象，包含请求头和有关请求的所有信息，正如你在第\
  \ 5 章中所学到的。\n4. 然后调用处理程序处理请求，它处理请求并将响应写回客户端。\n\n在正常情况下，所有上述步骤将在足够短的时间内完成——毫秒，或者取决于请求的几十秒。\n\
  \n\n\n图 7.2 显示了请求处理语境下的各种超时时间。你已经了解了通过 `http.TimeoutHandler()` 函数为每个处理器设置的超时时间。那么，我们为什么还需要其他超时时间呢？对于传入的请求流，通过配置\
  \ `http.TimeoutHandler()` 函数设置的超时时间仅在请求到达路径配置的 HTTP 处理器函数后才生效。在此之前，该超时不生效。对于输出的响应流，该函数强制的超时时间完全没有帮助，因为\
  \ `http.TimeoutHandler()` 的设计决定了它会在超时后向客户端写入响应，因此它可能会以等方式受到恶意客户端或网络的影响。接下来你将学习如何在服务器级别设置读取和写入超时时间。\n\
  \n![图 7.2：在处理 HTTP 请求时起作用的各种超时时间](img/0702.png)\n\n图 7.2:在处理 HTTP 请求时起作用的各种超时时间\n\
  \n启动 HTTP 服务器的 `http.ListenAndServe()` 函数定义如下（从 Go 1.16 开始）：\n\n```\nfunc ListenAndServe(addr\
  \ string, handler Handler) error {\n    server := &Server{Addr: addr, Handler: handler}\n\
  \    return server.ListenAndServe()\n}\n```\n\n它创建了一个 `http.Server` 类型的对象，该类型是定义在\
  \ `net/http` 包中的结构体类型。然后它了它的 `ListenAndServe()` 方法。为了进一步配置服务器（例如添加读取和写入超时时间），我们必须手动创建一个可配置的\
  \ `Server` 对象并调用 `ListenAndServe()` 方法：\n\n```\ns := http.Server{\n    Addr:   \
  \      \":8080\",\n    Handler:      mux,\n    ReadTimeout:  5 * time.Second,\n\
  \    WriteTimeout: 5 * time.Second,\n}\nlog.Fatal(s.ListenAndServe())\n```\n\n我们通过指定几个字段创建了\
  \ `http.Server` 对象 `s`：\n\n* `Addr:`：对应我们希望服务器监听的地址字符串。在这里，我们希望服务器监听 `\":8080\"\
  ` 地址。\n* `Handler:`：实现 `http.Handler` 接口的对象。在这里，我们指定了类型为 `http.ServeMux` 的对象 `mux`。\n\
  * `ReadTimeout:`：`time.Duration` 对象，表示服务器读取传入请求的最大时间。在这里，我们指定其为 5 秒。\n* `WriteTimeout:`：`time.Duration`\
  \ 对象，表示服务器写入响应的最大时间。在这里，我们指定其为 5 秒。\n\n然后我们为该对象调用 `ListenAndServe()` 方法。代码清单 7.4\
  \ 显示了一个配置了读取和写入超时时间的服务器。它为路径 `/api/users/` 注册了一个请求处理器。\n\n`handleUsersAPI()` 函数期望对它的请求带有正体。我们在其中添加了各种日志语句，以确保我们理解配置的超时时间如何影响服务器的行为。它将读取体、注册它，然后向客户端发送响应\
  \ `\"Hello world!\"`。如果在读取体时发生错误，将被记录在日志中向客户端返回错误消息。创建一个新目录 `chap7/server-timeout`\
  \ 并在其中初始化：\n\n```\n$ mkdir -p chap7/server-timeout\n$ cd chap7/server-timeout\n\
  $ go mod init github.com/username/server-timeout\n```\n\n然后将代码清单 7.4 保存为 `server.go`。编译并运行应用：\n\
  \n```\n$ go build -o server\n$ ./server\n```\n\n在另一个终端中使用 `curl` 向其发送以下请求：\n\n```\n\
  $ curl --request POST http://localhost:8080/api/users/ \\\n    --data \"Hello server\"\
  \nHello world!\n```\n\n上述 `curl` 命令发送了一个带有 `\"Hello server\"` 的 HTTP POST 请求。在服务器端，你会看到以下日志：\n\
  \n```\n2021/05/02 14:03:08 I started processing the request\n2021/05/02 14:03:08\
  \ Hello server\n2021/05/02 14:03:08 I finished processing the request\n```\n\n这是正常情况下的行为。保持服务器运行。\n\
  \n利用你在第 5 章“作为响应的流式数据”节中学到的某些技巧，你可以实现一个非常缓慢地发送请求体的 HTTP 客户端。你可以在 `chap7/server-timeout`\
  \ 目录下找到客户端代码。\n\n```go\nfunc handleUsersAPI(w http.ResponseWriter) {\n    for i\
  \ := 0; i < 10; i++ {\n        fmt.Fprintf(w, \"hello\")\n        time.Sleep(1 *\
  \ time.Second)\n    }\n}\n```\n\n\n\n\n## 实现优雅停机 (Graceful Shutdown)\n\nHTTP 服务器的优雅停机意味着在服务器停止之前，尝试不中断当前正在进行的请求处理。本质上，有两个点影响着服务器优雅停机的实现：\n\
  \n1. 停止接收任何新请求。\n2. 不中断正在处理的请求。\n\n幸运的是，`net/http` 库已经通过 `http.Server` 对象中定义的 `Shutdown()`\
  \ 方法提供了此项功能。当调用此方法时，服务器将停止接收任何新请求，断开所有空闲连接，然后在返回之前等待所有正在运行的请求处理函数执行完毕。您可以通过传递一个\
  \ `context.Context` 对象来控制它的等待时间。让我们先写一个函数，该函数将配置信号处理程序（类似于您在第 2 节中为命令行应用程序实现的方式），并在接收到\
  \ `SIGINT` 或 `SIGTERM` 信号时为服务器对象 `s` 调用 `Shutdown()` 方法：\n\n```\nfunc shutDown(\n\
  \    ctx context.Context,\n    s *http.Server,\n    waitForShutdownCompletion chan\
  \ struct{},\n) {\n    sigch := make(chan os.Signal, 1)\n    signal.Notify(sigch,\
  \ syscall.SIGINT, syscall.SIGTERM)\n    sig := <-sigch\n    log.Printf(\"Got signal:\
  \ %v . Server shutting down.\", sig)\n    if err := s.Shutdown(ctx); err != nil\
  \ {\n        log.Printf(\"Error during shutdown: %v\", err)\n    }\n    waitForShutdownCompletion\
  \ <- struct{}{}\n}\n```\n\n`shutdown()` 函数带有三个参数调用：\n\n* `ctx`: `context.Context`\
  \ 对象，允许您控制 `Shutdown()` 方法等待现有请求处理完成的时间。\n* `s`: `http.Server` 对象，代表在接收到信号后将关闭的服务器。\n\
  * `waitForShutdownCompletion`: 类型为 `struct{}` 的通道。\n\n当程序接收到 `SIGINT` 或 `SIGTERM`\
  \ 信号之一时，它会调用 `Shutdown()` 方法。当调用返回时，`struct{}{}` 将写入 `waitForShutdownCompletion`\
  \ 通道。这将告诉主程序的关闭进程已完成，它可以继续运行并结束自己的工作。\n\n在图 7.3 中图形化展示了 `Shutdown()` 和 `ListenAndServe()`\
  \ 方法是如何相互作用的。代码清单 7.5 展示了一个实现优雅停机的服务器。\n\n![图 7.3: Shutdown() 和 ListenAndServe()\
  \ 方法之间的相互作用](img/0703.png)\n\n图 7.3: `Shutdown()` 方法和 `ListenAndServe()` 方法之间的相互作用。\n\
  \n`waitForShutdownCompletion` 通道将帮助我们组织主程序的 goroutine 和启动 `shutdown()` 函数的 goroutine。我们使用\
  \ `context.WithTimeout()` 函数创建一个上下文，该上下文将在 30 秒后取消。这设置了服务器 `Shutdown()` 方法等待所有现有请求处理的最长时间。\n\
  \n然后，我们在 goroutine 中调用 `ShutDown()` 函数，并调用 `s.ListenAndServe()` 函数。请注意，我们没有在 `log.Fatal()`\
  \ 调用内部调用此函数。这是因为当调用 `Shutdown()` 方法时，`ListenAndServe()` 函数会立即返回，因此服务器会在等待 `Shutdown()`\
  \ 方法返回之前停止工作。因此，我们将返回的错误存储在 `err` 中，记录消息并等待值写入 `waitForShutdownCompletion` 通道，这会阻塞服务器的关闭。一旦我们在该通道上接收到值，我们就记录错误并退出。\n\
  \n创建一个新目录 `chap7/graceful-shutdown`，并在其中初始化模块：\n\n```bash\n$ mkdir -p chap7/graceful-shutdown\n\
  $ cd chap7/graceful-shutdown\n$ go mod init github.com/username/graceful-shutdown\n\
  ```\n\n然后将代码清单 7.5 保存为 `server.go`。编译并运行应用程序：\n\n```bash\n$ go build -o server\n\
  $ ./server\n```\n\n为了向此服务器发送请求，我们将使用自定义客户端，您可以在源代码仓库的 `chap7/client-slow-write`\
  \ 目录找到它。按照以下方式编译并运行客户端（在服务器运行时）：\n\n```bash\n$ go build -o client-slow-write\n$\
  \ ./client-slow-write\n2021/05/02 20:28:25 Starting client request\n```\n\n现在，当您看到上面的日志消息时，回到运行服务器的终端并按下\
  \ Ctrl + C。您将看到以下日志输出：\n\n```\n2021/05/02 20:28:25 I started processing the request\n\
  ^C2021/05/02 20:28:25 Got signal: interrupt . Server shutting down.\n2021/05/02\
  \ 20:28:28 Waiting for shutdown to complete..\n2021/05/02 20:28:36 hellohellohellohellohellohello\n\
  hellohellohello\n2021/05/02 20:28:36 I finished processing the request\n2021/05/02\
  \ 20:28:36 http: Server closed\n```\n\n请注意，在您按下 Ctrl+C 后，`Shutdown()` 等待读取完所有内容或执行当前请求，然后服务器关闭。在客户端，您将看到它返回了\
  \ `Hello world!` 响应。\n\n太棒了！现在您学会了如何实现服务器应用程序的停机机制，使得执行中的请求不会中断。实际上，您可以使用此机制执行任何其他所需的清理操作，例如通知任何长连接客户端进行重连或关闭所有与数据库的连接。\n\
  \n在本章的最后一节中，您将学习如何实现生产环境中服务器的另一项重要功能——配置安全的客户端通道。\n\n## 使用 TLS 保护通信\n\n整本书可以专门讨论使用传输层安全（TLS）来保护网络连接。TLS\
  \ 用于通过加密协议保护服务器与客户端之间的通信。\n\n\n\n\n将 `ListenAndServeTLS()` 函数与 `ListenAndServe()`\
  \ 函数进行比较，它接收两个额外的参数：第二个和第三个参数是字符串，包含 TLS 证书路径和密钥文件路径。这些文件包含了服务器和客户端之间进行安全数据传输所需的数据。你可以自己生成证书（也称为**自签名证书**），或者请求其他机构（即证书颁发机构\
  \ CA）来为你生成。自签名证书仅用于在组织定义的边界内保护通信。然而，如果你在你的服务器上使用此类证书，然后让组织之外的人访问服务器，他们将收到错误信息，提示证书未被识别，因此无法建立安全连接。另一方面，通过\
  \ CA 创建的证书将被组织外部的客户端信任。大型组织通常为内部服务使用自签名证书，而外部服务是由 CA 签发的。换句话说，对于公共域名，你必须使用自签名证书和\
  \ CA 签发的证书。实际上，你也可以在组织内部运行证书颁发机构来配合自签名证书。接下来你将了解如何使用自签名证书配置安全的 HTTP 服务器。\n\n###\
  \ 配置 TLS 和 HTTP\n\n首先，你将使用命令行程序 `openssl` 创建自签名证书和密钥。如果你使用的是 MacOS 或 Linux，该程序应该已经安装。\n\
  \n创建一个 `chap7/tls-server` 目录并在其中初始化：\n\n```\n$ mkdir -p chap7/tls-server\n$ cd chap7/tls-server\n\
  $ go mod init github.com/username/tls-server\n```\n\n使用 `openssl` 创建自签名证书，运行以下命令：\n\
  \n```\n$ openssl req -x509 -newkey rsa:4096 -keyout server.key -out server.crt -days\
  \ 365 -subj \"/C=AU/ST=NSW/L=Sydney/O=Example/OU=Org/CN=localhost\" -nodes\n```\n\
  \n上述命令执行完成后将输出如下内容：\n\n```\nGenerating 4096 bit RSA private key\n.....................................................\n\
  ............................................................\n......................................................\n\
  writing new private key to 'server.key'\n```\n\n你会在 `chap7/tls-server` 目录中看到两个文件：`server.key`\
  \ 和 `server.crt`。我们在调用 `ListenAndServeTLS()` 函数时将指定这些密钥和证书。深入了解上述命令的细节，需要注意以下两点：\n\
  \n- 上述证书仅用于测试，因为客户端默认不信任自签名证书。\n- 上述证书将允许你使用 `localhost` 域名安全地连接到你的服务器。\n\n在此配置后启动\
  \ HTTPS 服务器所示：\n\n```go\npackage main\n\nfunc main() {\n    // ...\n\n    tlsCertFile\
  \ := os.Getenv(\"TLS_CERT_FILE_PATH\")\n    tlsKeyFile := os.Getenv(\"TLS_KEY_FILE_PATH\"\
  )\n\n    if len(tlsCertFile) == 0 || len(tlsKeyFile) == 0 {\n        log.Fatal(\"\
  TLS_CERT_FILE_PATH and TLS_KEY_FILE_PATH must be specified\")\n    }\n\n    // ..\n\
  \n    log.Fatal(\n        http.ListenAndServeTLS(\n            listenAddr,\n   \
  \         tlsCertFile,\n            tlsKeyFile,\n            m,\n        )\n   \
  \ )\n}\n```\n\n服务器期望证书和密钥文件路径通过环境变量指定：`TLS_CERT_FILE_PATH` 和 `TLS_KEY_FILE_PATH`。我们添加了服务器日志中间件，并为\
  \ `/api` 路径注册了一个请求处理程序。注意，我们将 `listenAddr` 的默认值更改为 `\":8443\"`，因为这对于非服务器更为常见。将 `server.go`\
  \ 保存到 `chap7/tls-server` 目录。按如下方式编译并启动服务器：\n\n```\n$ go build -o server\n$ TLS_CERT_FILE_PATH=./server.crt\
  \ TLS_KEY_FILE_PATH=./server.key ./server\n```\n\n如果你使用 Windows，必须以不同的方式指定变量。对于\
  \ PowerShell，以下命令有效：\n\n```C> $env:TLS_CERT_FILE_PATH=./server.crt; $env:TLS_KEY_FILE_PATH=./server.key\
  \ ./server\n```\n\n一旦服务器运行，使用 `curl` 发起请求：\n\n```\n$ curl https://localhost:8443/api\n\
  ```\n\n你将收到以下错误：\n\n```\ncurl: (60) SSL certificate problem: self signed certificate\n\
  ```\n\n这是由于 `curl` 不信任你的自签名证书。为了让 `curl` 验证你的证书，请提供给服务器的 `server.crt` 文件：\n\n```\n\
  $ curl --cacert ./server.crt https://localhost:8443/api\n```\n\n服务器端将看到如下输出：\n\n\
  ```\n2021/05/05 08:17:55 Hello, world!\n```\n\n\n\nСначала мы создаем конфигурацию\
  \ сервера, вызывая метод `httptest.NewUnstartedServer()`. Это возвращает объект\
  \ типа `*httptest.Server`, тип структуры, определенный в пакете `net/http/httptest`.\
  \ Затем мы включаем HTTP/2, установив для поля `EnableHTTP2` значение `true`. Это\
  \ делается для того, чтобы тестовый сервер был как можно ближе к «настоящему» серверу.\
  \ Наконец, мы вызываем метод `StartTLS()`. Это автоматически генерирует сертификат\
  \ TLS и пару ключей и запускает сервер HTTPS. Для связи с этим тестовым HTTPS-сервером\
  \ нам понадобится специально созданный клиент:\n\n```\nclient := ts.Client()\nresp,\
  \ err := client.Get(ts.URL + \"/api\")\n```\n\nОбъект `http.Client`, который мы\
  \ получаем при вызове метода `Client()` объекта тестового сервера, автоматически\
  \ настраивается на доверие сертификатам TLS, созданным для тестирования. В Листинге\
  \ 7.8 показан тест, проверяющий функционирование ПО промежуточного слоя ведения\
  \ журналов.\n\nМы создаем новый `bytes.Buffer`, `buf` и указываем его как `io.Writer`\
  \ при создании нового объекта `log.Logger`. Затем, после получения настроенного\
  \ клиента для тестового сервера, мы делаем запрос HTTP GET с помощью метода `Get()`.\
  \ Поскольку мы тестируем функциональность промежуточного программного обеспечения,\
  \ мы отбрасываем ответ. Затем мы проверяем, содержит ли зарегистрированное сообщение\
  \ в объекте `buf` ожидамую строку, используя функцию `strings.Contains()`. Сохраните\
  \ Листинг 7.8 как `middleware_test.go` в каталоге `chap7/tls-server-test` и запустите\
  \ тест:\n\n```\n$ go test -v\n=== RUN   TestMiddleware\n--- PASS: TestMiddleware\
  \ (0.01s)\nPASS\nok          github.com/practicalgo/code/chap7/tls-server-test \
  \    0.557s\n```\n\nОтлично, теперь вы узнали, как настроить сервер с поддержкой\
  \ TLS для своих тестов. На практике вы не будете генерировать сертификаты TLS, как\
  \ это делали мы ранее. Вы также не будете вручную настраивать каждый клиент (например,\
  \ `curl` или другую службу) для доверия сгенериному сертификату. Это просто не масштабируется.\
  \ Вместо этого сделайте следующее:\n\n*   Для внутренних доменов и служб внедрите\
  \ внутренний доверенный CA с помощью таких инструментов, как `cfssl` ([`github.com/cloudflare/cfssl`](https://github.com/cloudflare/cfssl)),\
  \ а затем создайте механизм для создания сертификатов и доверия CA.\n*   Для общедоступных\
  \ доменов и служб запрашивайте сертификаты у доверенного CA — либо вручную, либо\
  \ в большинстве случаев, с помощью автоматизированной процедуры (например, [`github.com/caddyserver/certmagic`](https://github.com/caddyserver/certmagic)).\n\
  \n## Резюме\n\nВы начали эту главу с того, что узнали, как установить максимальное\
  \ время выполнения функции-обработчика. Вы настроили свой сервер для отправки ответа\
  \ HTTP 503 на сервер, когда функция обработчик не завершает обработку запроса в\
  \ указанный интервал времени. Затем вы узнали, как написать свои функции обработчика\
  \ таким образом, чтобы они не продолжали обработку запроса, если время ожидания\
  \ уже истекло или клиент отключился на полпути. Эти методы предотвращают использование\
  \ ресурсов вашего сервера для выполнения работы, которая больше не требуется.\n\n\
  Затем вы узнали, как реализовать глобальное время ожидания чтения и записи для ваших\
  \ серверных приложений и как реализовать корректное завершение работы для ваших\
  \ серверных приложений. Наконец, вы узнали, как реализовать безопасный канал связи\
  \ между вашим сервером и клиентом с использованием сертификатов TLS. Благодаря внедрению\
  \ этих методов ваш HTTP-сервер будет готов к работе. Мы крат рассмотрим некоторые\
  \ из оставших задач в Приложении A, «Создание наблюдаемых приложений» и Приложении\
  \ B, «Развертывание приложения».\n\nВ следующей главе вы узнаете, как создавать\
  \ клиентов и серверы с помощью gRPC, инфраструктуры удаленного вызова процедур (RPC),\
  \ созданной на основе HTTP/2.\n\n# ГЛАВА 8: Создание RPC приложений с помощью gRPC\n\
  \nВ этой главе вы научитесь создавать сетевые приложения, использующие `Удаленный\
  \ Вызов процедур` (RPC) для связи. Хотя стандартная библиотека поддерживает создание\
  \ таких приложений, мы будем делать это с помощью gRPC, `универсальной` среды RPC\
  \ с открытым исходным кодом. Мы начнем с краткого обсуждения фреймворков RPC и закончим\
  \ главу, научившись писать полностью тестируемые gRPC-приложения. Попутно вы также\
  \ научитесь использовать протокольные буферы, язык описания интерфейса и формат\
  \ данных, который обеспечивает связь клиент-сервер.\n\n\n\n\n```go\nservice Users\
  \ {\n  rpc GetUser (UserGetRequest) returns (UserGetReply) {}\n}\n```\n\n`GetUser`\
  \ 方法接收类型为 `UserGetRequest` 的输入消息并返回类型为 `UserGetReply` 的消息。在 gRPC 中，函数必须包含输入消息并返回输出消息。因此，客户端和服务器应用程序通过传递消息进行交互。\n\
  \n什么是*消息*（message）？它像一个信封，用于在客户端和服务器之间传输数据。消息的定义类似于结构体类型。`GetUser` 方法旨在允许客户端根据电子邮件或其他标识符请求用户。因此，我们如下定义了包含两个字段的\
  \ `UserGetRequest` 消息：\n\n```go\nmessage UserGetRequest {\n  string email = 1;\n\
  \  string id = 2;\n}\n```\n\n在消息定义内部，我们定义了两个字段：`email`（字符串）和 `id`（另一个字符串）。消息中的字段定义应指定三点：类型、名称和编号。字段类型可以是当前支持的整数类型（`int32`、`int64`\
  \ 等）、`float`、`double`、`bool`（用于逻辑数据）、`string` 和 `bytes`（用于任何任意数据）。\n\n你也可以定义其他类型消息的字段。字段名称应使用小写字母并用下划线\
  \ `_` 分隔多个单词，例如 `first_name`。字段编号是指定字段在消息中位置的方式。字段编号可以从 1 开始到 2²⁹，其中某些范围仅保留供内部使用。建议的策略之一是在字段编号中留出空格。例如，你可以将第一个字段编号为\
  \ 1，然后对下一个字段使用 10。这意味着你以后可以添加任何额外的字段，而无需重新对字段编号，同时可以将相关的字段分组在一起。\n\n需要注意的是，字段编号是内部细节，你的应用程序不需要担心它，因此分配字段编号时必须谨慎，永远不要更改，并考虑到未来的版本进行设计。我们将在稍后关于正向和向后兼容性的章节中讨论这个话题。\n\
  \n接下来，我们如下定义 `UserGetReply` 消息：\n\n```go\nmessage UserGetReply {\n  User user =\
  \ 1;\n}\n```\n\n上述消息包含一个类型为 `User` 的 `user` 字段。我们如下定义 `User` 消息：\n\n```go\nmessage\
  \ User {\n  string id = 1;\n  string first_name = 2;\n  string last_name = 3;\n\
  \  int32 age = 4;\n}\n```\n\n图 8.2 展示了 gRPC 服务 protobuf 定义的不同部分。在下一节中，你将了解如何在 gRPC\
  \ 服务器上注册多个服务。\n\n ![图 8.2: protobuf 语言规范的部分](img/0802.png)\n\n**图 8.2**: protobuf\
  \ 语言规范的部分\n\n一旦你定义了*服务接口*（service interface），你随后会将该定义转换为可在你的应用程序中使用的格式。此转换过程将使用\
  \ protobuf 编译器 `protoc` 以及针对特定语言的插件模块 `protoc-gen-go` 完成。需要注意的是，你将直接与 `protoc` 命令交互。如果你没有按照说明进行安装...（此处对应原文截断）\n\
  \n\n\n\n```go\nfunc (s *userService) GetUser(\n    ctx context.Context,\n    in\
  \ *users.UserGetRequest,\n) (*users.UserGetReply, error) {\n    log.Printf(\n  \
  \      \"Received request for user with Email: %s Id: %s\\n\",\n        in.Email,\n\
  \        in.Id,\n    )\n    components := strings.Split(in.Email, \"@\")\n    if\
  \ len(components) != 2 {\n        return nil, errors.New(\"invalid email address\"\
  )\n    }\n    u := users.User{\n        Id:        in.Id,\n        FirstName: components[0],\n\
  \        LastName:  components[1],\n        Age:       36,\n    }\n    return &users.UserGetReply{User:\
  \ &u}, nil\n}\n```\n\n`GetUser()` 方法接收两个参数：`context.Context` 对象和 `users.UserGetRequest`\
  \ 对象。它返回两个值：类型为 `*users.UserGetReply` 的对象和 `error`。请注意，Go 中对应的 RPC 等价方法 `GetUser()`\
  \ 返回了一个额外的值——错误。对于其他语言，情况可能有所不同。\n\n对应消息的结构类型定义在 `users.pb.go` 文件中。每个结构都有几个 protobuf\
  \ 内部使用的字段，但你会发现它包含了 protobuf 规范的 Go 等价实现。\n\n首先是 `UserGetRequest` 结构：\n\n```\ntype\
  \ UserGetRequest struct {\n    // other fields\n    Email string\n    Id    string\n\
  }\n```\n\n同样，`UserGetReply` 结构将包含 `User` 字段：\n\n```go\ntype UserGetReply struct\
  \ {\n    // other fields\n    User *User\n}\n```\n\n`User` 类型将包含 `Id`、`FirstName`、`LastName`\
  \ 和 `Age` 字段：\n\n```go\ntype User struct {\n    // Other fields\n    Id        string\n\
  \    FirstName string\n    LastName  string\n    Age       int32\n}\n```\n\n该方法的实现注册了传入请求，从电子邮件中提取用户名和域名，创建一个虚拟的\
  \ `User` 对象，并返回 `UserGetReply` 值和空错误。如果电子邮件格式错误，我们返回空 `UserGetReply` 值和错误值。\n\n\
  实现 gRPC 服务端应用程序的最后一步是在 gRPC 服务器上注册 `Users` 服务：\n\n```go\nlis, err := net.Listen(\"\
  tcp\", listenAddr)\ns := grpc.NewServer()\nusers.RegisterUsersServer(s, &userService{})\n\
  log.Fatal(s.Serve(lis))\n```\n\n为了在 gRPC 服务器上注册 `Users` 服务处理程序，我们调用了执行 `protoc`\
  \ 命令时生成的 `users.RegisterUsersServer()` 函数。该函数接收两个参数。第一个参数是 `*grpc.Server` 对象，第二个参数是\
  \ `Users` 服务的实现，在这里它是我们定义的 `userService` 类型。图 8.3 图化展示了不同的阶段。\n\n![图 8.3: 创建带有 Users\
  \ 服务的 gRPC 服务器](img/0803.png)\n\n图 8.3: 创建带有 `Users` 服务的 gRPC 服务器\n\n在代码清单 8.2 中显示了服务器的完整代码。\n\
  \n在 `chap8/user-service` 目录内创建一个新的 `server` 目录。并在其中初始化模块：\n\n```bash\n$ mkdir -p\
  \ chap8/user-service/server\n$ cd chap8/user-service/server\n$ go mod init github.com/username/user-service/server\n\
  ```\n\n然后将代码清单 8.2 保存为该目录下的新文件 `server.go`。在服务器目录下运行以下命令：\n\n```bash\n$ go get google.golang.org/grpc@v1.37.0\n\
  ```\n\n上述命令将获取 `google.golang.org/grpc/grpc` 包。\n\n(此处省略了原文中大量重复的版本号行)\n\n\n\n在\
  \ `main()` 函数中，我们首先检查客户端是否通过命令行参数指定了连接的服务器地址。如果未指定，我们将输出错误消息并退出。然后，我们调用 `setupGrpcConn()`\
  \ 函数并传递服务器地址。我们在 `defer` 语句中调用连接对象的 `Close()` 方法，以确保客户端连接在程序退出前被关闭。接着，我们调用 `getUsersServiceClient()`\
  \ 函数来获取与 `Users` 服务通信的客户端。紧接着，我们调用了带有类型为 `*users.UserGetRequest` 值的 `getUser()`\
  \ 函数。请注意，我们没有在值中指定 `Id` 字段，因为 protobuf 消息中的字段默认是可选的。因此，我们也可以发送一个空值，换句话说，即 `&users.UserGetRequest{}`。当\
  \ `getUser()` 函数返回时，结果类型为 `users.UserGetReply`。该值包含一个类型为 `users.User` 的字段，在这里我们调用\
  \ `fmt.Fprintf()` 函数显示两个字符串值：`FirstName` 和 `LastName`。\n\n在 `chap8/user-service`\
  \ 目录下创建一个新目录 `client`。按照如下方式在其中初始化模块：\n\n```bash\n$ mkdir -p chap8/user-service/client\n\
  $ cd chap8/user-service/client\n$ go mod init github.com/username/user-service/client\n\
  ```\n\n然后，将[列表 8.4] 保存为该目录的新文件 `main.go`。在客户端子目录下运行以下命令：\n\n```\n$ go get google.golang.org/grpc@v1.37.0\n\
  ```\n\n上述命令将提取 `google.golang.org/grpc/` 包，更新 `go.mod` 文件并创建 `go.sum` 文件。最后一步是手动在\
  \ `go.mod` 文件中添加关于 `github.com/username/user-service/service` 包的信息。最终的 `go.mod`\
  \ 文件见[列表 8.5]。\n\n现在，`chap8/user-service` 目录结构应该像[图 8.4] 所示。\n\n![图 8.4: Users 服务的目录结构](img/0804.png)\n\
  \n[图 8.4]: `Users` 服务目录结构\n\n太棒了。现在你准备好按照如下方式编译并运行客户端了：\n\n```bash\n$ cd chap8/user-service/client\n\
  $ go build -o client\n$ ./client localhost:50051\nUser: Jane Doe\n```\n\n在服务器端，你将看到如下注册的消息：\n\
  \n```\n2021/05/16 08:23:52 Received request for user with Email: jane@doe.com Id:\n\
  ```\n\n非常完美。你已经编写了自己的第一个通过 gRPC 交互的服务器和客户端应用程序。接下来，你将学习如何编写测试来验证你的客户端和服务器的行为。\n\n\
  ### 测试服务器\n\n测试客户端和服务器的关键组件是 `google.golang.org/grpc/test/bufconn` 包（以下简称 `bufconn`）。它允许我们在\
  \ gRPC 客户端和服务器之间在内存中建立一个完整的通信信道。我们不再创建真实的网络监听器，而是在测试中使用 `bufconn` 包来创建它。这避免了在测试期间配置真实网络服务器和客户端的需要，同时确保了我们最关心的服务器客户端逻辑是可测试的。\n\
  \n让我们编写一个函数来启动用于 `Users` 服务的测试 gRPC 服务器：\n\n```go\nfunc startTestGrpcServer() (*grpc.Server,\
  \ *bufconn.Listener) {\n    l := bufconn.Listen(10)\n    s := grpc.NewServer()\n\
  \    registerServices(s)\n    go func() {\n        err := startServer(s, l)\n  \
  \      if err != nil {\n            log.Fatal(err)\n        }\n    }()\n    return\
  \ s, l\n}\n```\n\n\n\n`startTestGrpcServer()` 函数与我们为服务器编写的函数完全相同，仅区别在于注册模拟服务：`users.RegisterUsersServer(s,\
  \ &dummyUserService{})`。我们在单独的 goroutine 中启动服务器，并返回 `*bufconn.Listener` 值，以便我们为客户端创建一个拨号器，就像我们在测试服务器时所做的那样。其核心思想是，我们希望服务器在后台运行，同时我们在测试的其余部分向其发送请求。\n\
  \n最后步骤是调用 `GetUser()` RPC 方法并检查结果。代码列表 8.7 显示了完整的测试函数。\n\n将代码列表 8.7 保存为新文件 `client_test.go`\
  \ 并位于 `chap8/user-service/client` 目录中。按照以下方式运行测试：\n\n```\n$ go test\nPASS\nok  \
  \   github.com/practicalgo/code/chap8/user-service/client 0.128s\n```\n\n在继续之前，让我们总结一下你已经学到的内容。创建一个\
  \ gRPC 网络应用程序，首先需要使用协议缓冲区语言（Protocol Buffer）创建服务规范。然后，你使用 protobuf 编译器 (`protoc`)\
  \ 和 go 插件创建*魔法胶水*。这会生成代码，处理数据的低级序列化和反序列化，并在客户端和服务器之间通过网络传输。通过使用类型、实现接口以及调用生成代码中的函数，你随后编写服务器和客户端实现。最后，你测试你的服务器和客户端。\n\
  \n值得简要地将此过程与编写 HTTP 服务器和客户端进行比较。首先，让我们看看 gRPC 服务器和 HTTP 服务器。这两类服务器应用程序都配置网络服务器和处理网络请求的函数。HTTP\
  \ 服务器可以定义任意的自定义处理函数并注册它们以处理任意路径，而 gRPC 服务器只能注册处理相应 protobuf 规范定义的 RPC 调用的函数。\n\n\
  比较 HTTP 客户端和 gRPC 客户端，我们可以看到它们的相似之处，例如创建客户端和随后的请求发送。然而，HTTP 客户端可以向 HTTP 服务器发送任意请求，并且在发送无效请求时可能收到错误作为响应，而\
  \ gRPC 客户端仅限于协议缓冲区规范中定义的 RPC 调用。此外，客户端必须知道 RPC 服务器定义的消息类型，以便能够向服务器发送其理解的消息。对于 HTTP\
  \ 应用程序，客户端没有这种强制性要求。\n\n接下来，让我们看看处理协议缓冲区时的两个关键主题：序列化（marshaling）和反序列化（unmarshalling），以及数据格式随时间的演变。\n\
  \n## Protobuf 消息遍历\n\n消息是 gRPC 应用程序的基石。当你从另一个应用程序与 gRPC 应用程序交互时，你需要能够将数据字节转换为协议缓冲区，反之亦然。我们将在之后探讨。之后你将学习如何随着应用程序的发展开发具有后向向前兼容性的\
  \ protobuf 消息。\n\n### 序列化与反序列化\n\n考虑对 `Users` 服务 `GetUser()` 函数的请求。在客户端和测试中，你如下所示创建了\
  \ `GetUserRequest` 类型的值：\n\n```\nu := users.UserGetRequest{Email: \"jane@doe.com\"\
  }\n```\n\n然后你调用了 `GetUser()` 函数并传递了请求。如果我们在客户端应用程序中调用 `GetUser()` 函数，让用户以 JSON 格式字符串的方式指定查询请求，会怎样？为了唤起记忆，`GetUserRequest`\
  \ 定义如下：\n\n```go\nmessage UserGetRequest {\n    string email = 1;\n    string id\
  \ = 2;\n}\n```\n\n直接映射到该消息类型的 JSON 格式字符串示例：`{\"email\": \"jane@doe.com\", \"id\"\
  : \"user-123\"}`。让我们看看如何将此 JSON 字符串转换为 `GetUserRequest` 对象：\n\n```go\nu := users.UserGetRequest{}\n\
  jsonQuery = `'{\"email\": \"jane@doe.com\", \"id\": \"user-123\"}`\ninput := []byte(jsonQuery)\n\
  err = protojson.Unmarshal(input, &u)\nif err != nil {\n    log.Fatal(err)\n}\n```\n\
  \n\n\n软件的正向兼容性意味着旧版本将继续与新版本兼容。同样，反向兼容性的概念意味着新版本的软件必须继续与旧版本兼容。我们希望开发我们的 `protobuf`\
  \ 消息和 `gRPC` 方法，使得通过这些消息与我们的服务交互的应用程序（包括服务本身）随着时间的推移能够兼容新旧版本，而不会发生突然的破坏性更改。当你在消息中定义字段时，如下所示分配字段标签：\n\
  \n```\nmessage UserGetRequest {\n  string email = 1;\n  string id = 2;\n}\n```\n\
  \n对于 `protobuf` 消息，必须记住以下关键点：\n\n- 永远不要更改字段标签。\n- 只有当旧新数据类型相互兼容时，您才能更改字段的数据类型。例如，您可以在\
  \ `int32`、`uint32`、`int64`、`uint64` 和 `bool` 之间转换。有关其他类型的详细信息，请参考 `Protocol Buffers\
  \ 3` 规范。\n- 永远不要重命名字段。重命名字段，请输入带有未使用标签的新字段，然后只有当所有客户端和服务器都已更改为使用新字段时，再删除该字段。\n\n\
  对于 `gRPC` 服务，除了不能对协议缓冲区执行的操作外，请注意以下几点：\n\n- 您不能在不破坏现有客户端的情况下重命名服务，除非您能够绝对保证客户端和服务器应用程序同时进行更改。\n\
  - 您不能重命名函数。输入新函数，将所有使用该函数的应用程序切换到新函数，然后删除旧函数。\n\n如果您想更改函数作为输入接收和作为输出返回的消息类型，您必须考虑这种更改是什么。如果消息中的所有字段保持不变，则只需更新所有应用程序以使用新的消息名称。然而，如果您对字段进行了任何更改（添加/删除/更新），您将必须记住上述关于\
  \ `protobuf` 消息的要点。\n\n练习 8.2 提供了一个研究特定场景的机会，您需要在 `gRPC` 应用中考虑兼容性。\n\n## 多个服务\n\n\
  `gRPC` 服务器可以处理来自一个或多个 `gRPC` 服务的请求。让我们看看如何添加第二个服务——`Repo` 服务，它将用于请求特定用户的代码仓库。首先，您需要为该服务创建\
  \ `protobuf` 规范。创建 `chap8/multiple-services` 目录。如下所示将服务目录从 `chap8/user-service`\
  \ 复制到该目录内：\n\n```\n$ mkdir -p chap8/multiple-services\n$ cp -r chap8/user-service/service\
  \ chap8/multiple-services/\n```\n\n更新 `go.mod` 文件，使其包含以下内容：\n\n```\nmodule github.com/username/multiple-services/service\n\
  go 1.16\n```\n\n现在，创建一个新的 `repositories.proto` 文件，内容如 列表 8.11 所示。\n\n仓库服务定义了一个 RPC\
  \ 方法 `GetRepos` 和另外两个消息类型 `RepoGetRequest` 和 `RepoGetReply`，它们对应于函数的输入和输出。\n\n\n\
  \n\n```go\nfunc TestRepoService(t *testing.T) {\n\n    s, l := startTestGrpcServer()\n\
  \    defer s.GracefulStop()\n\n    bufconnDialer := func(\n        ctx context.Context,\
  \ addr string,\n    ) (net.Conn, error) {\n        return l.Dial()\n    }\n\n  \
  \  client, err := grpc.DialContext(\n        context.Background(),\n        \"\"\
  , grpc.WithInsecure(),\n        grpc.WithContextDialer(bufconnDialer),\n    )\n\
  \    if err != nil {\n        t.Fatal(err)\n    }\n    repoClient := svc.NewRepoClient(client)\n\
  \    resp, err := repoClient.GetRepos(\n        context.Background(),\n        &svc.RepoGetRequest{\n\
  \            CreatorId: \"user-123\",\n            Id:        \"repo-123\",\n  \
  \      },\n    )\n\n    if err != nil {\n        t.Fatal(err)\n    }\n    if len(resp.Repo)\
  \ != 1 {\n        t.Fatalf(\n            \"Expected to get back 1 repo, got back:\
  \ %d repos\", len(resp.Repo),\n        )\n    }\n    gotId := resp.Repo[0].Id\n\
  \    gotOwnerId := resp.Repo[0].Owner.Id\n\n    if gotId != \"repo-123\" {\n   \
  \     t.Errorf(\n            \"Expected Repo ID to be: repo-123, Got: %s\",\n  \
  \          gotId,\n        )\n    }\n    if gotOwnerId != \"user-123\" {\n     \
  \   t.Errorf(\n            \"Expected Creator ID to be: user-123, Got: %s\",\n \
  \           gotOwnerId,\n        )\n    }\n}\n```\n\n上述代码突出亮了用于测试 `Repo` 服务的关键断言。在调用\
  \ `GetRepos()` 函数获取响应后，我们检查了切片 `resp.Repo` 的长度。我们期望它只包含一个 `Repository` 对象。如果不是这样，测试将失败。如果发现切片中确实包含\
  \ `Repo` 对象，我们就会像处理任何其他 Go 切片一样，通过访问 `Repo` 字段来获取其 `Id` 和 `OwnerId`。\n\n你可以在此书代码仓库的\
  \ `chap8/multiple-services/server/server_test.go` 文件中找到完整的测试。\n\n在下一个练习中，你将扩展 `mync\
  \ grpc` 客户端，使其也支持对 `Repo` 服务执行请求。\n\n在本章的最后一节中，让我们学习 gRPC 应用程序中的错误处理。\n\n## 错误处理\n\
  \n正如你所看到的，在实现 gRPC 方法时，你返回了两个对象：一个是响应，另一个是错误值。如果我们从方法返回一个非空错误会发生什么？让我们看看在调用 `GetUser()`\
  \ 方法时如果不传递有效的电子邮件地址会发生什么。\n\n从终端进入目录 `chap8/user-service/server`，根据需要编译并启动服务器：\n\
  \n```\n$ cd chap8/user-service/server\n$ go build -o server\n$ ./server\n```\n\n\
  ```从另一个终端会话进入目录 `chap8/user-service/client`，根据需要创建并启动客户端，如下所示传递一个空对象：\n\n```\n$\
  \ cd chap8/user-service/client\n$ go build -o client\n$ ./client localhost:50051\
  \ '{}'2021/05/25 21:12 rpc error: code = Unknown desc = invalid email\n```\n\n我们得到了错误信息，客户端退出。文本\
  \ `\"invalid email address\"` 源于我们从 `Users` 服务处理程序返回的错误值：\n\n```\ncomponents :=\
  \ strings.Split(in.Email, \"@\")\nif len(components) != 2 {\n    return nil, errors.New(\"\
  invalid email address\")\n}\n```\n\n字符串 `\"rpc error: code = Unknown desc\"` 提取自\
  \ gRPC 库，表示在响应中找到了代码。为了修复这个问题，我们需要更新服务器，使其返回一个类似于 HTTP 的有效代码。gRPC 支持大量由 `google.golang.org/codes`\
  \ 包定义的错误。其中之一是 `InvalidArgument`，考虑到客户端没有提供有效的电子邮件地址，这用在这里非常恰当。\n\n现在，让我们更新服务器，使其改为返回该代码的错误：\n\
  \n```go\nimport (\n   \"google.golang.org/codes\"\n   \"google.golang.org/status\"\
  \n)\ncomponents := strings.Split(in.Email, \"@\")\nif len(components) != 2 {\n \
  \   return nil, status.Error(\n        codes.InvalidArgument,\n        \"Invalid\
  \ address specified\",\n    )\n}\n```\n\n我们使用了另一个包 `google.golang.org/status` 来通过\
  \ `status.Error()` 函数创建错误值。函数的第一个参数是代码，第二个参数是描述消息。你可以在源码仓库的 `chap8/user-service-error-handling/server`\
  \ 目录下找到更新后的服务器代码。\n\n按照如下方式编译并运行此新版本的服务器：\n\n```\n$ ./server\n```\n\n现在，如果你再次发送请求，你将看到如下注册的代码：\n\
  \n```\n$ ./client-client localhost:50051 '{}'\n```\n\n\n\n\n接下来，我们将学习三种新的通信模式：`服务端流式传输`、`客户端流式传输`以及它们的组合——`双向流式传输`。在这三种模式中，可以在单次方法调用期间交换多个请求和响应消息。让我们从服务端流式传输开始学习。\n\
  \n### 服务端流式传输\n\n在`服务端流式传输`中，当客户端发送请求时，服务器可以发送多个响应消息。考虑我们在上一章中实现的 `Repo` 服务的 `GetRepos()`\
  \ 方法。与其在一个消息中发送存储库列表，我们可以通过发送多个 `Repo` 消息作为响应，每个消息包含存储库的详细信息。让我们看看如何实现这样一个应用程序。\n\
  \n首先，我们如下所示更新 `Repo` 服务的 protobuf 规范：\n\n```\nservice Repo {d\n  rpc GetRepos (RepoGetRequest)\
  \ returns (stream RepoGetReply) {}\n}\n```\n\n这里的关键区别在于方法返回类型中的流规范。这告诉了 Protocol\
  \ Buffer 编译器和 Go gRPC 插件，响应将包含一个 `RepoGetReply` 消息的`流`。列表 9.1 显示了 `Repo` 服务的完整 protobuf\
  \ 规范。\n\n与原始服务规范（第 8 章，列表 8.11）相比，有两个关键变化。`GetRepos()` 方法现在返回 `RepoGetReply` 消息流。`RepoGetReply`\
  \ 消息现在包含一个存储库的信息，因此我们删除了该字段中的 `repeated` 声明。\n\n创建 `chap9/server-streaming`目录。在其内部创建一个新的子目录\
  \ `service` 并在其中初始化模块：\n\n```\n$ mkdir -p chap9/server-streaming/service\n$ go mod\
  \ init github.com/username/server-streaming/service\n```\n\n然后，在 `service` 目录中创建一个新文件\
  \ `repositories.proto`，内容如列表 9.1 所示。从 `chap8/multiple-services/service/` 复制 `users.proto`\
  \ 文件到该目录。在文件中如下所示替换 `go_package`：\n\n```\noption go_package = \"github.com/username/server-streaming/service\"\
  ;\n```\n\n接下来，我们生成对应两个服务的 Go 代码：\n\n```\n$ protoc --go_out=. --go_opt=paths:relative\
  \ \\\n--go-grpc_out=. --go-grpc_opt=paths:relative \\\n    users.proto repositories.proto\n\
  ```\n\n运行上述命令后，你应该像以前一样在 `service` 目录中看到以下文件：`users.pb.go`、`users_grpc.pb.go`、`repositories.pb.go`\
  \ 和 `repositories_grpc.pb.go`。\n\n接下来，我们将修改 `GetRepos()` 方法的实现，如下：\n\n```go\nfunc\
  \ (s *repoService) GetRepos(\n    in *svc.RepoGetRequest,\n    stream svc.RepoGetReposServer,\n\
  ) error {\n    log.Printf(\n        \"Received request for repo with CreateId: %s\
  \ Id: %s\\n\",\n        in.CreatorId,\n        in.Id,\n    )\n    repo := svc.Repository{\n\
  \        Id: in.Id,\n        Owner: &svc.User{\n            Id: in.CreatorId,\n\
  \            FirstName: \"Jane\",\n        },\n    }\n    cnt := 1\n    for {\n\
  \        repo.Name = fmt.Sprintf(\"repo-%d\", cnt)\n        repo.Url = fmt.Sprintf(\n\
  \            \"https://example.com/test/%s\",\n            repo.Name,\n        )\n\
  \        r := svc.RepoGetReply{\n            Repo: &repo,\n        }\n        if\
  \ err := stream.Send(&r); err != nil {\n            return err\n        }\n    \
  \    if cnt >= 5 {\n            break\n        }\n        cnt++\n    }\n    return\
  \ nil\n}\n```\n\n上述实现有几个关键变化。首先，方法的签名发生了变化。它接收两个参数：`RepoGetRequest` 类型请求和 `RepoReposServer`\
  \ 流对象，并返回 `error` 值。`RepoReposServer` 类型是 protobuf 编译器生成的接口：\n\n```go\ntype RepoReposServer\
  \ interface {\n         Send(*RepoGetReply) error\n         grpc.ServerStream\n\
  }\n```\n\n实现此接口的类型必须实现 `Send()` 方法，该方法接收 `RepoGetReply` 消息（我们的响应类型）并返回 `error` 值。当然，作为开发者，你不需要担心实现此接口的类型，因为这是\
  \ protobuf 编译器和 Go 模块自动完成的。我们使用此方法返回 `RepoGetReply` 消息作为响应。内置字段 `grpc.ServerStream`\
  \ 是 `google.golang.org/grpc` 包定义的另一个接口。我们将在“使用流实现中间件”部分了解更多信息。\n\n在方法体内，我们首先记录请求信息的输出。然后我们创建一个\
  \ `Repo` 对象用于返回。在 `for` 循环中，我们额外配置该对象，创建 `RepoGetReply` 消息，然后通过 `stream.Send()`\
  \ 方法将其发送给客户端。我们总共发送五个这样的响应消息，每次更改 `Repo` 对象。当我们发送所有响应后，退出循环并返回空错误。\n\n列表 9.2 显示了\
  \ `Users` 和 `Repo` 服务的 gRPC 服务器。\n\n在 `chap9/server-streaming` 中创建新的子目录 `server`\
  \ 并在其中初始化模块：\n\n```\n$ mkdir -p chap9/server-streaming/server\n$ cd chap9/server-streaming/server\n\
  $ go mod init github.com/username/server-streaming/server\n```\n\n将列表 9.2 保存为服务器目录下的\
  \ `server.go`。接下来获取 `google.golang.org/grpc` 包（版本 1.37.0）：\n\n```\n$ go get google.golang.org/grpc@v1.37.0\n\
  ```\n\n然后更新 `go.mod` 文件以添加服务依赖，包括 `replace` 指令，使最终的 `go.mod` 类似于列表 9.3。\n\n确保你现在可以使用\
  \ `go build` 成功编译服务器。接下来，我们将编写一个测试函数来检查服务器运行。正如第 8 章所示，我们将使用 `bufconn` 包在测试客户端和服务器之间建立内存通道。假设我们有一个\
  \ `repoClient` 对象，配置为测试 gRPC 服务器上的 `Repo` 服务连接。我们将如下调用 `GetRepos()` 方法：\n\n```go\n\
  stream, err := repoClient.GetRepos(\n    context.Background(),\n    &svc.RepoGetRequest{CreatorId:\
  \ \"user-123\", Id: \"repo-123\"},\n)\n```\n\n方法调用返回两个值：`stream`（`RepoReposClient`\
  \ 类型对象）和 `err`（错误值）。`RepoReposClient` 类型是 `RepoReposServer` 类型的客户端等，定义如下：\n\n```go\n\
  type RepoGetReposClient interface {\n    Recv() (*RepoGetReply, error)\n    grpc.ClientStream\n\
  }\n```\n\n实现此接口的类型必须实现 `Recv()` 方法，该方法返回 `RepoGetReply` 消息（方法的响应类型）并返回 `error` 值。内置字段\
  \ `grpc.ClientStream` 是 `google.golang.org/grpc` 包定义的另一个接口。我们将在“使用流实现中间件”部分了解更多信息。\n\
  \n为了从服务器读取响应流，我们将使用 `Recv()` 方法：\n\n```go\nvar repos []*svc.Repository\nfor {\n\
  \    repo, err := stream.Recv()\n    if err == io.EOF {\n        break\n    }\n\
  \    if err != nil {\n        log.Fatal(err)\n    }\n    repos = append(repos, repo.Repo)\n\
  }\n```\n\n\n\n通过使用无限 `for` 循环，我们调用 `Recv()` 方法。如果返回的错误值为 `io.EOF`，则没有更多可读消息，因此我们跳出循环。如果收到的任何其他错误，我们将打印该错误并停止执行。否则，我们将存储库信息添加到\
  \ `repos` 切片的消息中。在读取服务器响应后，我们可以检查各种细节，看它们是否符合预期的响应。代码列表 9.4 显示了用于检查 `GetRepos()`\
  \ 方法运行的测试函数完整列表。（此处未显示用于 `Users` 服务的测试函数。您可以在书的原始代码仓库中找到它。）\n\n将代码列表 9.4 存为 `server_test.go`\
  \ 位于服务器目录内。确保您可以运行测试并且它成功完成：\n\n```\n$ go test -v\n=== RUN   TestUserService\n2021/06/09\
  \ 08:43:25 Received request for user with Email: \njane@doe.com Id: foo-bar\n---\
  \ PASS: TestUserService (0.00s)\n=== RUN   TestRepoService\n2021/06/09 08:43:25\
  \ Received request for repo with CreateId:\nuser-123 Id: repo-123\n--- PASS: TestRepoService\
  \ (0.00s)\nPASS\nok      github.com/practicalgo/code/chap9/server-streaming  1s\n\
  ```\n\n服务器端流传输对于向客户端发送多个响应是有用的。发送多个对象比发送此类对象的数组可能更有效。另一个有用场景是发送最终值对应的响应，例如在操作结果的流传输中。\n\
  \n在本章的第一个练习 9 中，您在 `Repo` 服务中实现了一个新方法，它模拟了存储库的构建并将日志发送给客户端。\n\n### 客户端流传输\n\n与服务器端流类似，客户端调用服务器上的\
  \ RPC 方法并以消息流的形式请求，而不是单个消息。\n\n让我们在 `Repo` 服务中添加一个新方法 `CreateRepo()`，它现在将接受消息流作为参数。每个消息都将指定新存储库的细节。对于此方法，我们定义了一个新消息类型\
  \ `RepoCreateRequest`。方法的 protobuf 定义如下：\n\n```\nrpc CreateRepo (stream RepoCreateRequest)\
  \ returns (RepoReply)\n```\n\n这里的关键点是类型前的 `stream` 关键字。服务器上该方法的处理器如下：\n\n```go\n\
  func (s *repoService) CreateRepo(\n    stream svc.Repo_CreateRepoServer,\n) error\
  \ {\n    for {\n        data, err := stream.Recv()\n        if err == io.EOF {\n\
  \            // 我们已经收到了完整的请求\n            // 现在我们可以处理数据\n            r := svc.RepoCreateReply{..}\n\
  \            return stream.SendAndClose(&r)\n        }\n    }\n}\n```\n\n`CreateRepo()`\
  \ 方法的实现接收一个类型 `svc.Repo_CreateRepoServer` 的编译器生成的接口类型，定义如下：\n\n```go\ntype Repo_CreateRepoServer\
  \ interface {\n        Recv() (*RepoCreateRequest, error)\n        SendAndClose(*RepoCreateReply)\
  \ error\n        grpc.ServerStream\n}\n```\n\n实现此接口的类型将实现两个方法 `Recv()` 和 `SendAndClose()`，并嵌入\
  \ `ServerStream` 接口。`Recv()` 方法用于从客户端接收消息，因此返回 `RepoCreateRequest` 值和 `error`。`SendAndClose()`\
  \ 方法用于向客户端发送响应。因此它接受一个 `RepoReply` 类型的值，发送响应并关闭连接。当然，作为应用程序作者，您不需要担心该类型的实现。\n\n\
  接下来让我们如何从客户端应用程序调用 `CreateRepo()` 方法：\n\n```\nrepoClient := svc.NewRepoClient(client)\n\
  stream, err := repoClient.CreateRepo(\n    context.Background(),\n)\n```\n\n注意我们没有带任何请求参数调用\
  \ `CreateRepo()` 方法。它只接受一个 `context.Context` 对象。该方法返回两个值：类型 `Repo_CreateClient`\
  \ 的 `stream` 和 `error` 值。`Repo_CreateClient` 类型定义如下接口：\n\n```go\ntype Repo_CreateClient\
  \ interface {\n    Send(*RepoCreateRequest) error\n    CloseAndRecv() (*RepoCreateReply,\
  \ error)\n}\n```\n\n实现此接口的类型将实现两个方法 `Send()` 和 `CloseAndRecv()`，并嵌入 `ClientStream`\
  \ 接口。`Send()` 方法用于向客户端发送消息。因此它接受 `RepoCreateRequest` 类型的值作为参数并返回 `error`。`CloseAndRecv()`\
  \ 方法用于从服务器获取响应。因此它返回 `RepoReply` 值和 `error` 值。\n\n为了向服务器应用程序发送消息，我们将在循环中使用多次 `Send()`：\n\
  \n```\nfor i := 0; i < 5; i++ {\n    r := svc.RepoCreateRequest{\n        CreatorId:\
  \ \"user-123\",\n        Name:      \"hello-world\",\n    }\n    err := stream.Send(&r)\n\
  \    if err != nil {\n        t.Fatal(err)\n    }\n}\n```\n\n然后，一旦我们完成了流传输，我们将读取响应：\n\
  \n```\nresp, err := stream.CloseAndRecv()\n```\n\n### 双向流\n\n在双向流传输中，一旦连接建立，客户端和服务器都可以读取和写入数据。没有任何顺序被强制规定，因此如果应用程序没有应用它，则顺序是不保证的。例如，假设我们想要更新\
  \ `Users` 服务以允许用户通过聊天从客服获得帮助。在这种双向流的情况下，用户（客户端）启动与客服（服务器）的对话，他们之间进行交换，直到其中一方中断连接。\n\
  \n首先，在 protobuf 中定义一个双向流方法：\n\n```protobuf\nrpc GetHelp (stream HelpRequest) returns\
  \ (stream HelpReply);\n```\n\n现在，在服务器上实现该方法：\n\n```go\nfunc (s *helpService) GetHelp(\n\
  \    stream svc.Users_GetHelpServer,\n) error {\n    for {\n        req, err :=\
  \ stream.Recv()\n        if err == io.EOF {\n            return nil\n        }\n\
  \        if err != nil {\n            return err\n        }\n        // 处理请求并发送响应\n\
  \        resp := &pb.HelpReply{Message: \"Hello!\"}\n        if err := stream.Send(resp);\
  \ err != nil {\n            return err\n        }\n    }\n}\n```\n\n`Users_GetHelpServer`\
  \ 接口如下：\n\n```go\ntype Users_GetHelpServer interface {\n        Recv() (*HelpRequest,\
  \ error)\n        Send(*HelpReply) error\n        grpc.ServerStream\n}\n```\n\n\
  最后，在客户端调用该方法：\n\n```go\nstream, err := client.GetHelp(context.Background())\nif\
  \ err != nil {\n    log.Fatalf(\"could not get help: %v\", err)\n}\n\ngo func()\
  \ {\n    for i := 0; i < 5; i++ {\n        if err := stream.Send(&pb.HelpRequest{Message:\
  \ \"Hello\"}); err != nil {\n            log.Fatalf(\"could not send help: %v\"\
  , err)\n        }\n    }\n    stream.CloseSend()\n}()\n\nfor {\n    resp, err :=\
  \ stream.Recv()\n    if err == io.EOF {\n        break\n    }\n    if err != nil\
  \ {\n        log.Fatalf(\"could not receive help: %v\", err)\n    }\n    fmt.Printf(\"\
  Received: %s\\n\", resp.Message)\n}\n```\n\n\n\n\n```go\nfunc (s *userService) GetHelp(\n\
  \    stream svc.Users_GetHelpServer,\n) error {\n    log.Println(\"Client connected\"\
  )\n    for {\n        request, err := stream.Recv()\n        if err == io.EOF {\n\
  \            break\n        }\n        if err != nil {\n            return err\n\
  \        }\n        fmt.Printf(\"Request received: %s\\n\", request.Request)\n \
  \       response := svc.UserHelpReply{\n            Response: request.Request,\n\
  \        }\n        err = stream.Send(&response)\n        if err != nil {\n    \
  \        return err\n        }\n    }\n    log.Println(\"Client disconnected\")\n\
  \    return nil\n}\n```\n\n`GetHelp()` 方法接收一个类型为 `Users_GetHelpServer` 的参数，该参数是一个如下生成的接口：\n\
  \n```\ntype Users_GetHelpServer interface {\n    Send(*UserHelpReply) error\n  \
  \  Recv() (*UserHelpRequest, error)\n    grpc.ServerStream\n}\n```\n\n由于服务器将接收并发送消息流，因此接口拥有\
  \ `Send()` 和 `Recv()` 方法，以及一个嵌入接口 `ServerStream`。\n\n`Send()` 方法用于向客户端发送类型为 `UserHelpReply`\
  \ 的响应消息。\n\n`Recv()` 方法用于从客户端接收请求。它返回一个类型为 `UserHelpRequest`的值和一个 `error` 值。\n\n\
  然后，我们创建一个 `for` 循环，在循环中不断尝试从客户端流中读取值，如果收到 `io.EOF` 错误则中断循环，如果收到任何其他错误则返回错误值。如果从客户端收到有效请求，我们创建一个\
  \ `UserHelpReply` 消息，并使用 `Send()` 方法向客户端返回帮助请求消息。代码列表 9.6 显示了实现 `Users` 服务的 gRPC\
  \ 服务器应用程序。\n\n在 `chap9/bidi-streaming` 目录下创建一个新的子目录 `server`。按照如下方式在该其中初始化模块：\n\n\
  ```\n$ mkdir -p chap9/bidi-streaming/server\n$ cd chap9/bidi-streaming/server\n\
  $ go mod init github.com/username/bidi-streaming/server\n```\n\n将 代码列表 9.6 保存为服务器目录下的\
  \ `server.go`。然后，我们按照如下方式获取 [`google.golang.org/grpc`](http://google.golang.org/grpc)\
  \ 包（版本 1.37.0）：\n\n```\n$ go get google.golang.org/grpc@v1.37.0\n```\n\n然后更新 `go.mod`\
  \ 文件以添加服务包的依赖，包括 `replace` 指令，使最终的 `go.mod` 看起来像 代码列表 9.7 所示。确保你现在可以使用 `go build`\
  \ 编译服务器。让我们看看如何设置客户端。考虑 `setupChat()` 函数，它接收一个 `io.Reader`（从从中读取帮助请求）、一个用于与 `Users`\
  \ 服务通信的 `UsersClient` 对象以及一个用于响应的 `io.Writer`。\n\n```go\nfunc setupChat(r io.Reader,\
  \ w io.Writer, c svc.UsersClient) error {\n    stream, err := c.GetHelp(context.Background())\n\
  \    if err != nil {\n        return err\n    }\n    for {\n        scanner := bufio.NewScanner(r)\n\
  \        prompt := \"Request: \"\n        fmt.Fprint(w, prompt)\n\n        scanner.Scan()\n\
  \        if err := scanner.Err(); err != nil {\n            return err\n       \
  \ }\n        msg := scanner.Text()\n        if msg == \"quit\" {\n            break\n\
  \        }\n        request := svc.UserHelpRequest{\n            Request: msg,\n\
  \        }\n        err := stream.Send(&request)\n        if err != nil {\n    \
  \        return err\n        }\n        resp, err := stream.Recv()\n        if err\
  \ != nil {\n            return err\n        }\n        fmt.Printf(\"Response: %s\\\
  n\", resp.Response)\n    }\n    return stream.CloseSend()\n}\n```\n\n首先我们调用 RPC\
  \ 方法 `GetHelp()`，它返回一个类型为 `Users_HelpClient` 的值，该接口定义如下：\n\n```\ntype Users_HelpClient\
  \ interface {\n    Send(*UserHelpRequest) error\n    Recv() (*UserHelpReply, error)\n\
  \    grpc.ClientStream\n}\n```\n\n与 `Users_HelpServer` 类型类似，`Users_HelpClient` 类型定义了发送和接收消息的方法，并包含了\
  \ `ClientStream` 接口。一旦获取流，设置了一个 `for` 循环，以交互模式读取用户输入并作为 `UserHelpRequest` 发送到服务器。如果用户输入\
  \ `quit`，连接将关闭。代码列表 9.8 显示了客户端应用程序。\n\n在 `chap9/bidi-streaming` 目录下创建一个新的子目录 `client`\
  \ 并在其中初始化模块：\n\n```\n$ mkdir -p chap9/bidi-streaming/client\n$ cd chap9/bidi-streaming/client\n\
  $ go mod init github.com/username/bidi-streaming/client\n```\n\n将 代码列表 9.8 保存为 `client`\
  \ 目录下的 `client.go`。接下来我们获取 [`google.golang.org/grpc`](http://google.golang.org/grpc)\
  \ 包（版本 1.37.0）：\n\n```\n$ go get google.golang.org/grpc@v1.37.0\n```\n\n然后更新 `go.mod`\
  \ 文件以添加服务包的依赖，包括 `replace` 指令，使最终的 `go.mod` 看起来像 代码列表 9.9 所示。编译客户端。\n\n现在在一个终端会中启动服务器：\n\
  \n```\n$ cd chap9/bidi-streaming/server\n$ go build\n$ ./server\n```\n\n在另一个终端会中运行客户端：\n\
  \n```\n$ ./client localhost:50051\nRequest: Hello there\nResponse: Hello there\n\
  Request: I need some help\nResponse: I need some help\nRequest: quit\n```\n\n在服务器端你将看到以下消息：\n\
  \n```\n2021/06/24 20:46:56 Client connected\nRequest received: Hello there\nRequest\
  \ received: I need some help\n2021/06/24 20:47:29 Client disconnected\n```\n\n当从客户端终端会话输入\
  \ `quit` 命令时，客户端调用了 `CloseSend()` 方法，该方法随后关闭了与服务器的客户端连接，并返回错误值 `io.EOF`。\n\n现在你学习了\
  \ gRPC 支持的三类流式通信。与仅交换请求和响应消息的 RPC 方法调用相比，流式传输发生了多个此类消息的交换，如图 9.1 所示。\n\n![图 9.1:\
  \ 流传输模式](img/0901.png)\n\n图 9.1: 流传输模式\n\n接下来你将学习如何在传输任意字节数据时使用流式传输。\n\n## 接收和发送任意字节\n\
  \n到为止我们只关注在 gRPC 服务器应用程序和客户端之间传输字符串和整数。如何发送和处理任何任意数据，例如存储在存储库中的数据（例如 `.tar.gz` 文件）呢？这就是\
  \ `bytes` 类型出现的地方。让我们更新 `RepoCreateRequest` 数据类型以添加 `data` 字段，它将包含任意字节，例如存储在存储库中的文件内容：\n\
  \n```\nmessage RepoCreateRequest {\n  string creator_id = 1;\n  string name = 2;\n\
  \  bytes data = 3;\n}\n```\n\n所有可以在 Go 中以字节切片形式保存的内容，都可以保存在数据字段中。为了请求服务器创建存储库，客户端必须构造如下请求：\n\
  \n```go\nrepoData := []byte(\"Arbitrary data\")\nresp, err := repoClient.CreateRepo(\n\
  \    context.Background(),\n    &svc.RepoCreateRequest{\n        CreatorId: \"user-123\"\
  ,\n        Name:      \"test-repo\",\n        Data:      repoData,\n    },\n)\n\
  ```\n\n\n\n\n在服务器端，该方法将如下所示处理请求（包括数据）：\n\n```go\nfunc (s *repoService) CreateRepo(\n\
  \    ctx context.Context,\n    in *svc.RepoCreateRequest,\n) (*svc.RepoCreateReply,\
  \ error) {\n    repoId := fmt.Sprintf(\"%s-%s\", in.Name, in.CreatorId)\n    repoURL\
  \ := fmt.Sprintf(\"https://git.example.com/%s/%s\",\n        in.CreatorId, in.Name)\n\
  \    data := in.Data\n    repo := svc.Repository{\n        Id:   repoId,\n     \
  \   Name: in.Name,\n        Url:  repoURL,\n    }\n    r := svc.RepoCreateReply{\n\
  \        Repo: &repo,\n        Size: int32(len(data)),\n    }\n    return &r, nil\n\
  }\n```\n\n你可以在此书源码仓库的 `chap9/binary-data` 目录中找到示例代码。这种发送任何任意字节的机制非常简单，并且当传输的数据量限制在几个字节时效果良好。但是，对于传输大量数据，建议使用流式传输模式。\n\
  \n在上面的示例中，客户端流式传输将是理想的。从源（例如文件）逐步读取数据字节，然后向服务器发送包含这些数据的消息。继续执行此操作，直到所有数据都被读取完毕。\n\
  \n在流式传输期间，客户端或服务器分别发送多个消息作为请求或响应。我们希望数据以流式方式传输，因此我们可以设计 protobuf 消息，使其包含一个数据字段：\n\
  \n```protobuf\nmessage RepoData {\n  bytes data = 1;\n}\n```\n\n然而，你很少会在不带任何上下文信息的情况下传输任意字节。例如，之前考虑的\
  \ `RepoCreateRequest` 消息包含了 `creator_id`、`name` 和 `data`。如果对对这种消息类型进行流式传输，我们必须在所有消息中发送相同的\
  \ `creator_id` 和 `name`。因此，建议在流的第一条消息中发送 `creator_id` 和 `name` 字段，然后流中的所有后续消息只包含\
  \ `data` 字节。\n\n幸运的是，我们在定义消息时可以使用 Protocol Buffer 的名为 `oneof` 的功能来优雅地实现这一点。该关键字允许我们定义一种消息，在该消息中，任何时刻只能设置字段组中的一个字段。让我们使用\
  \ `oneof` 关键字重新定义 `RepoCreateRequest` 消息：\n\n```protobuf\nmessage RepoCreateRequest\
  \ {\n  oneof body {\n    RepoContext context = 1;\n    bytes data = 2;\n  }\n}\n\
  ```\n\n我们这样定义 `RepoCreateRequest`使其具有一个名为 `body` 的 `oneof` 字段。该字段在消息中始终只有 `context`（类型为\
  \ `RepoContext`）或 `data`（类型为 `bytes`），而不会两者都有。新的消息类型 `RepoContext` 将包含要创建仓库的上下文信息，定义如下：\n\
  \n```protobuf\nmessage RepoContext {\n  string creator_id = 1;\n  string name =\
  \ 2;\n}\n```\n\n代码列表 9.10 显示了 `Repo` 服务的更新后的 protobuf 规范。\n\n现在`CreateRepo()` 方法接收\
  \ `RepoCreateRequest` 消息流并返回 `RepoReply` 消息。创建目录 `chap9/bindata-client-streaming`。在内部创建一个子目录\
  \ `service` 并对其初始化：\n\n```bash\n$ mkdir -p chap9/bindata-client-streaming/service\n\
  ```\n\n\n\n在 `go.mod` 文件中配置 `replace` 指令，使其将 [github.com/username/bindata-client-streaming/service](http://github.com/username/bindata-client-streaming/service)\
  \ 包的链接添加到 `../service` 目录。最终的 `go.mod` 文件见列表 9.12。\n\n在继续之前，请确保你能够编译服务器。\n\n在从测试函数或客户端应用程序中调用\
  \ `CreateRepo()` 方法创建仓库包含两个关键步骤：\n\n1. 第一条消息将发送一个 `RepoCreateContext` 对象，其中仅包含 `context`\
  \ 字段集。该消息将用于向服务器传输仓库的名称和所有者。\n2. 第二条及后续消息（如果有）将发送一个仅包含 `data` 字段集的 `RepoCreateContext`\
  \ 对象。这些消息将用于传输要在仓库中创建的数据。\n\n下面的代码片段实现了第一步（不包含错误处理）：\n\n```\nstream, err := repoClient.CreateRepo(context.Background())\n\
  c := svc.RepoCreateRequest_Context{\n    Context: &svc.RepoContext{\n        CreatorId:\
  \ \"user-123\",\n        Name:      \"test-repo\",\n    },\n}\nr := svc.RepoCreateRequest{\n\
  \    Body: &c,\n}\nerr = stream.Send(&r)\n```\n\n我们创建了类型为 `RepoCreateRequest_Context`\
  \ 的对象 `c`，它包含 `Context` 字段，该字段是一个 `RepoContext` 类型的对象，包含了我们要创建的仓库的 `CreatorId` 和\
  \ `Name`。然后，我们创建一个类型为 `RepoCreateRequest` 的对象，并将 `Body` 的值指定指向对象 `c`。最后，我们调用流对象的\
  \ `Send()` 方法，将 `RepoCreateRequest` 对象作为第一条消息发送。\n\n为了实现第二步，我们首先配置读取数据的源：\n\n```\n\
  data := \"Arbitrary Data Bytes\"\nrepoData := strings.NewReader(data)\n```\n\n`strings.NewReader()`\
  \ 函数返回一个实现 `io.Reader` 接口的对象，因此我们可以使用任何兼容的函数来读取字节并将其发送到服务器：\n\n```\nfor {\n    b,\
  \ err := repoData.ReadByte()\n    if err == io.EOF {\n        break\n    }\n   \
  \ bData := svc.RepoCreateRequest_Data{\n        Data: []byte{b},\n    }\n    r :=\
  \ svc.RepoCreateRequest{\n        Body: &bData,\n    }\n    err = stream.Send(&r)\n\
  \    if err != nil {\n        t.Fatal(err)\n    }\n}\n```\n\n我们从 `repoData` 中逐字节读取。读取到的字节被保存在变量\
  \ `b` 中。然后，我们创建一个类型为 `RepoCreateRequest_Data` 的对象，其 `Data` 字段包含一个包含读取字节 `b` 的字节切片。接着，我们创建一个类型为\
  \ `RepoCreateRequest` 的对象，其 `Body` 字段现在指向 `RepoCreateRequest_Data` 对象。最后，我们调用 `Send()`\
  \ 方法来发送此消息。我们重复此操作，直到读完 `repoData` 中的所有字节。之后，我们读取服务器的响应，并检查响应是否包含预期数据：\n\n```\n\
  resp, err := stream.CloseAndRecv()\nif err != nil {\n    t.Fatal(err)\n}\nexpectedSize\
  \ := int32(len(data))\nif resp.Size != expectedSize {\n    t.Errorf(\n        \"\
  Expected Repo Created to be: %d bytes Got back: %d\",\n        expectedSize,\n \
  \       resp.Size,\n    )\n}\nexpectedUrl := \"https://example.com/test-repo\"\n\
  if resp.Url != expectedUrl {\n    t.Errorf(\n        \"Expected Repo URL to be:\
  \ %s Got back: %s\",\n        expectedUrl,\n        resp.Url,\n    )\n}\n```\n\n\
  \n\nМы добавляем идентификатор запроса в контекст исходящего вызова метода. В gRPC\
  \ это делается с помощью пакета `google.golang.org/grpc/metadata`, который предоставляет\
  \ функции для хранения и извлечения метаданных для вызовов методов RPC. Функция\
  \ `google.golang.org/grpc/metadata` вызывается с исходным контекстом `ctx` и парой\
  \ ключ-значение для добавления в качестве метаданных и возвращает новый контекст,\
  \ который затем будет использоваться для вызова метода RPC вместо исходного контекста.\
  \ Таким образом, здесь мы добавляем ключ `Request-Id` для идентификатора запроса\
  \ и фиктивное значение `request-123` в качестве метаданных. Вновь созданный контекст\
  \ `ctxWithMetadata` затем используется для вызова исходного метода RPC. Возвращается\
  \ значение ошибки, полученное при вызове `invoker()`.\n\nЧтобы зарегистрировать\
  \ `metadataUnaryInterceptor` в качестве перехватчика на стороне клиента, мы указываем\
  \ новый параметр `grpc.DialOption`, полученный путем вызова функции `grpc.WithUnaryInterceptor()`,\
  \ передав ему в качестве параметра функцию `metadataUnaryInterceptor`. Окончательная\
  \ функция `setupGrpcConn()` будет выглядеть следующим образом:\n\n```\nfunc setupGrpcConn(addr\
  \ string) (*grpc.ClientConn, error) {\n    return grpc.DialContext(\n        context.Background(),\n\
  \        addr,\n        grpc.WithInsecure(),\n        grpc.WithBlock(),\n      \
  \  grpc.WithUnaryInterceptor(metadataUnaryInterceptor),\n    )\n}\n```\n\nОбновите\
  \ файл `client.go`, чтобы добавить определение функции `metadataUnaryInterceptor()`,\
  \ и обновите функцию `setupGrpcConn()`, чтобы добавить вышеуказанный `DialOption`.\
  \ Прежде чем двигаться дальше, убедитесь, что вы можете построить клиент.\n\nДавайте\
  \ теперь перейдем к написанию перехватчика для прикрепления идентификатора запроса\
  \ для потоковых вызовов метода RPC. Обновите спецификацию protobuf в файле `chap9/interceptors/service/users.proto`,\
  \ чтобы добавить `GetHelp()` в службу `Users`, как показано в [Listing 9.16].\n\n\
  Востановите код Go, соответствующий спецификации protobuf, следующим образом:\n\n\
  ```bash\n$ cd chap9/intereceptors/service\n$ protoc --go_out=. --go_opt=paths=source:relative\
  \ \\\n     --go-grpc_out=. --go-grpc_opt=paths=source:relative \\\n    users.proto\n\
  ```\n\nЗатем обновите клиент, вставив определение метода `setupChat()` в `chap9/inteceptors/client/main.go`\
  \ из [Listing 9.8].\n\nТеперь мы напишем перехватчик для перехвата потоковых вызовов\
  \ метода RPC. Перехватчик потока на стороне клиента — это функция типа `grpc.StreamClientInterceptor`,\
  \ которая объявлена следующим образом:\n\n```go\ntype StreamClientInterceptor func(\n\
  \     ctx context.Context,\n     desc *StreamDesc,\n     cc *ClientConn,\n     method\
  \ string,\n     streamer Streamer,\n     opts ...CallOption,\n) (ClientStream, error)\n\
  ```\n\nРазличные параметры функции:\n\n* `ctx` — это контекст, связанный с вызовом\
  \ метода RPC.\n* `desc` — это объект типа `*StreamDesc`, который содержит различные\
  \ свойства, связанные с потоком, такие как имя метода, обработчик службы для метода\
  \ и поддержка потоком отправки и получения.\n* `cc` — это базовый объект `grpc.ClientConn`.\n\
  * `method` — это имя метода RPC.\n* `streamer` — это либо исходно перехваченный\
  \ вызов метода потоковой передачи, либо другой перехватчик потоковой передачи, если\
  \ у вас есть цепочка перехватчиков.\n* `opts` — это любые значения типа `grpc.CallOption`,\
  \ с которыми вызван исходный метод RPC.\n\nТогда перехватчик метаданных для потоковых\
  \ вызовов метода будет записан следующим образом:\n\n```go\nfunc metadataStreamInterceptor(\n\
  \    ctx context.Context,\n    desc *StreamDesc,\n    cc *ClientConn,\n    method\
  \ string,\n    streamer Streamer,\n    opts ...CallOption,\n) (ClientStream, error)\
  \ {\n    md := metadata.Pairs(\"x-request-id\", \"request-123\")\n    ctxWithMetadata\
  \ := metadata.NewToContext(ctx, md)\n    return streamer(ctxWithMetadata, desc,\
  \ cc, method, opts...)\n}\n```\n*(注: Поскольку原文 в конце части содержал логические\
  \ повторы и обрывостые фрагменты, я при此根据上下文逻辑补全了缺失的函数实现部分，以确保文档的完整性)*\n\n\n\n\n\
  \n* `srv` — это реализация сервера gRPC, которая передается при вызове перехватчика（interceptor）。\
  \ Он будет передан как есть следующему перехватчику или фактическому вызову метода.\n\
  * `ss` — это объект типа `grpc.ServerStream`, который содержит поля, описывающие\
  \ поведение потокового соединения на стороне сервера.\n* `info` — это объект типа\
  \ `*grpc.StreamServerInfo`, который содержит имя метода RPC и информацию о том,\
  \ является ли поток клиентским или серверным.\n* `handler` — это функция, реализующая\
  \ потоковый метод RPC, в данном случае `GetHelp()`.\n\nСледовательно, перехватчик\
  \ логирования для потоковых вызовов RPC будет реализован следующим образом:\n\n\
  ```\nfunc loggingStreamInterceptor(\n    srv interface{},\n    stream grpc.ServerStream,\n\
  \    info *grpc.StreamServerInfo,\n    handler grpc.StreamHandler,\n) error {\n\n\
  \    start := time.Now()\n    err := handler(srv, stream)\n    ctx := stream.Context()\n\
  \    logMessage(ctx, info.FullMethod, time.Since(start), err)\n    return err\n\
  }\n```\n\nМы сохраняем текущее время, а затем вызываем функцию-обработчик, чтобы\
  \ начать потоковую связь. Затем мы извлекаем контекст, связанный с вызовом, вызывая\
  \ метод `Context()`. Затем мы вызываем функцию `logMessage()` для регистрации сведений\
  \ о вызове метода RPC. Наконец, мы возвращаем значение ошибки, полученное при вызове\
  \ функции-обработчика.\n\nТеперь давайте посмотрим на определение функции `logMessage()`:\n\
  \n```\nfunc logMessage(\n    ctx context.Context,\n    method string,\n    latency\
  \ time.Duration,\n    err error,\n) {\n    var requestId string\n    md, ok := metadata.FromIncomingContext(ctx)\n\
  \    if !ok {\n        log.Print(\"No metadata\")\n    } else {\n        if len(md.Get(\"\
  Request-Id\")) != 0 {\n            requestId = md.Get(\"Request-Id\")[0]\n     \
  \   }\n    }\n    log.Printf(\"Method:%s, Duration:%s, Error:%v, Request-Id:%s\"\
  ,\n        method,\n        latency,\n        err,\n        requestId,\n    )\n\
  }\n```\n\nКлючевые утверждения в функции выделены выше. Сначала мы пытаемся получить\
  \ метаданные из контекста вызова, используя функцию `FromIncomingContext()` из пакета\
  \ метаданных. Эта функция возвращает два значения: одно типа `metadata.MD` (которое\
  \ представляет собой карту, определенную как тип `MD map[string][]string`) и логическое\
  \ значение `ok`. Если в контексте были найдены метаданные, для `ok` устанавливается\
  \ значение `true`, а в противном — `false`. Таким образом, в функции мы проверяем,\
  \ было ли значение истинным, а затем пытаемся получить значение (кусок строк), соответствующее\
  \ ключу `Request-Id`. Если он найден, мы устанавливаем значение `requestId` в первый\
  \ элемент слайса, а затем он регистрируется с помощью вызова функции `log.Printf()`.\
  \ В Листинге 9.18 показано полное клиентское приложение.\n\nЧтобы зарегистрировать\
  \ перехватчики на сервере gRPC, мы вызываем функцию `grpc.NewServer()` с двумя значениями,\
  \ оба типа `grpc.ServerOption` (аналогично `grpc.DialOption` для клиентских приложений).\
  \ Эти два значения получаются путем вызова функций `grpc.UnaryInterceptor()` и `grpc.StreamInterceptor()`\
  \ со значениями `loggingUnaryInterceptor` и `logginStreamInterceptor` соответственно.\
  \ Соберите сервер и запустите его:\n\n```\n$ cd chap9/interceptors/server\n$ go\
  \ build\n$ ./server\n```\n\nТеперь из нового сеанса терминала запустите клиентское\
  \ приложение, чтобы сначала вызвать метод `GetUser`:\n\n```\n$ cd chap9/interceptors/client\n\
  $ go build\n$ ./client localhost:50051 GetUser\nUser: jane doe.com\n```\n\nВ сеансе\
  \ терминала, где работал сервер, вы увидите следующие журналы:\n\n```\n2021/06/26\
  \ 22:14:04 Received request for user with Email: jane@doe.com Id:\n2021/06/26 22:14:04\
  \ Method:/Users/GetUser, Duration:214.333μs, Error:<nil>, Request-Id:request-123\n\
  ```\n\nИмя метода RPCстрируется вместе с именем службы, продолжительностью, которая\
  \ потребовалась для завершения вызова метода, и значением `Request-Id`, указанным\
  \ в клиенте.\n\nДалее давайте вызовем метод `GetHelp` из клиента:\n\n```\nRequest:\
  \ Hello there\nResponse: Hello there\nRequest: how are you\nResponse: how are you\n\
  Request: quit\n```\n\nНа стороне сервера вы увидите следующие логи:\n\n```\n2021/06/26\
  \ 22:24:40 Client connected\nRequest received: Hello there\nRequest received: how\
  \ are you\n2021/06/26 22:24:46 Client disconnected\n2021/06/26 22:24:46 Method:/Users/GetHelp,\
  \ Duration:6.186660625s,\nError:<nil>, Request-Id:request-123\n```\n\nКак вы увидите,\
  \ указанная продолжительность относится ко всему времени, когда потоковое соединение\
  \ RPC было активным, другими словами, пока вы продолжали.\n\n\n\n\n\n```go\nfunc\
  \ loggingStreamInterceptor(\n    srv interface{},\n    stream grpc.ServerStream,\n\
  \    info *grpc.StreamServerInfo,\n    handler grpc.StreamHandler,\n) error {\n\
  \    serverStream := wrappedServerStream{\n        ServerStream: stream,\n    }\n\
  \    err := handler(srv, serverStream)\n    // Everything else remains the same\n\
  \    // ...\n    return err\n}\n```\n\n客户端和服务器流的合并允许您的拦截器（interceptors）在通过流连接进行每次消息交换时运行自定义代码。这使得我们能够编写需要消息交换信息的拦截器，例如用于从缓存存储中存储或提取数据，或者实现限流机制。接下来我们将学习如何创建拦截器链。\n\
  \n### 拦截器链\n\n由于拦截器用于实现应用程序中的通用功能，合并拦截器链允许您在创建服务器时集成多个拦截器。首先，我们将了解创建拦截器链的方法。\n\n\
  ```go\nfunc loggingStreamInterceptor(\n    srv interface{},\n    stream grpc.ServerStream,\n\
  \    info *grpc.StreamServerInfo,\n    handler grpc.StreamHandler,\n) error {\n\
  \    serverStream := wrappedServerStream{\n        ServerStream: stream,\n    }\n\
  \    err := handler(srv, serverStream)\n    // 其他部分保持不变\n    // ...\n    return\
  \ err\n}\n```\n\n由于拦截器用于实现应用程序中的通用功能，合并拦截器链允许您在创建服务器时集成多个拦截器。首先，我们将学习如何创建拦截器链。\n\
  \n*(注：由于原文中存在大量俄语重复且逻辑混乱的片段，翻译已根据 gRPC 拦截器机制的上下文进行了语意化处理，以确保技术术语准确)*\n\n\n\n\nМы\
  \ обновили функцию `setupGrpcConn()`, чтобы она возвращала объект `*grpc.ClientConn`,\
  \ настроенный для связи с сервером по протоколу TLS. Теперь она принимает дополнительный\
  \ аргумент `tlsCertFile` — строку, содержащую путь к сертификату TLS, которому клиент\
  \ должен доверять. Мы вызываем функцию `NewClientTLSFromFile()` из пакета [google.golang.org/grpc/credentials](http://google.golang.org/grpc/credentials),\
  \ передавая путь к сертификату TLS. Второй аргумент, если он не пуст, перепределит\
  \ имя хоста, найденное в сертификате, и вместо этого имя будет доверенным. Мы создадим\
  \ наши сертификаты TLS для хоста `localhost`, которому мы хотим доверить со нашего\
  \ клиента. Следовательно, мы указываем пустую строку. Функция возвращает значение\
  \ `creds` типа `credentials.TransportCredentials` и значение ошибки. Затем мы создаем\
  \ значение `ClientOption`, `credsOption`, соответствующие учетным данным, вызывая\
  \ функцию `grpc.WithTransportCredentials()` и передавая `creds` в качестве параметра.\
  \ Наконец, мы вызываем `DialContext()`, передавая `credsOption` как `ClientOption`.\
  \ Путь к сертификату в `tlsCertFile` должен указывать на тот же сертификат, который\
  \ используется сервером.\n\nПоследним шагом является создание самоподписанных сертификатов\
  \ TLS. Как и в Главе 7, мы будем использовать команду `openssl` с немного иным набором\
  \ аргументов, чтобы соответствовать требованиям стандартной библиотеки Go по проверке\
  \ TLS на стороне клиента:\n\n```\n$ openssl req -x509 -newkey rsa:4096 -keyout server.key\
  \ -out server.crt \\\n    -days 365 \\\n    -subj \"/C=AU/ST=NSW/L=Sydney/O=Echorand/OU=Org/CN=localhost\"\
  \ \\\n    -extensions san \\\n    -config <(echo '[req]'; echo 'distinguished_name=req';\n\
  \            echo '[san]'; echo 'subjectAltName=DNS:localhost') \\\n    -nodes\n\
  ```\n\nЭто создаст два файла: `server.key` и `server.crt`, соответствующие ключу\
  \ TLS и сертификату соответственно. Теперь вы можете указать эти файлы для сервера,\
  \ а сертификат для клиента.\n\nВы можете найти код серверного и клиентского приложений\
  \ в каталоге `chap10/user-service-tls` репозитория кода книги. Сервер реализует\
  \ службу `Users`, которую мы впервые реализовали в Главе 8 «Создание RPC приложений\
  \ с помощью gRPC», при этом связь с клиентом теперь происходит по каналу с шифрованием\
  \ TLS. Вы также обнаружите, что серверные и клиентские тесты обновлены для обмена\
  \ данными по протоколу TLS.\n\nДавайте быстро продемонстрируем, как мы запускаем\
  \ приложения. Во-первых, сервер:\n\n```\n$ cd chap10/user-service-tls/server\n$\
  \ go build\n$ TLS_KEY_FILE_PATH=../tls/server.key \\\n  TLS_CERT_FILE_PATH=../tls/server.crt\
  \ \\\n  ./server\n```\n\nВ отдельном терминале запустим клиент:\n\n```\n$ cd chap10/user-service-tls/client\n\
  $ go build\n$ TLS_CERT_FILE_PATH=../tls/server.crt \\\n  ./client localhost:50051\n\
  User: jane doe.com\n```\n\nКак мы обсуждали в Главе 7, создание и распространение\
  \ сертификатов вручную не масштабируется. Если ваши службы являются внутренними,\
  \ внедрите внутренний доверенный CA с помощью таких инструментов, как `cfssl` ([`github.com/cloudflare/cfssl`](https://github.com/cloudflare/cfssl)),\
  \ а затем создайте механизм для создания сертификатов.\n\n\n\n接下来，我们将为单独的服务设置可用性状态。`healthz.Server`\
  \ 对象的 `SetServingStatus()` 方法用于设置服务状态。它接受两个参数——包含服务名称的字符串 `service` 和类型为 `ServiceStatus`\
  \ 的值（该枚举定义为 `HealthCheckResponse` 消息的一部分）。我们将按照如下方式定义一个辅助函数来封装此逻辑逻辑：\n\n```go\n\
  func updateServiceHealth(\n    h *healthz.Server,\n    service string,\n    status\
  \ healthsvc.HealthCheckResponse_ServingStatus,\n) {\n    h.SetServingStatus(\n \
  \       service,\n        status,\n    )\n}\n```\n\n在服务器上，调用 `registerServices()`\
  \ 函数后，我们将按照如下方式设置 Users 服务的可用性状态：\n\n```go\ns := grpc.NewServer()\nh := healthz.NewServer()\n\
  registerServices(s, h)\nupdateServiceHealth(\n    h,\n    svc.Users_ServiceDesc.ServiceName,\n\
  \    healthsvc.HealthCheckResponse_SERVING,\n)\n```\n\n我们使用属性 `Users_ServiceDesc.ServiceName`\
  \ 获取 Users 服务的名称，然后通过调用 `SetServingStatus()` 方法将服务的可用性状态设置为 `HealthCheckResponse_SERVING`。有关注册\
  \ Users 服务的 gRPC 服务器代码，可以参考第 9 章“高级 gRPC 应用”，以及书籍代码仓库中 `chap10/server-healthcheck/server`\
  \ 目录下的 `Health` 服务。\n\n现在，让我们编写几个测试用来检查 `Health` 服务的行为。在所有测试中，我们首先需要创建一个用于与 `Health`\
