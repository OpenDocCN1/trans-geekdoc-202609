  \n\n\n`追踪（Traces）` 是跟踪系统中事务的遥测数据。当请求到达时，通常会发生多个作为该请求处理部分的动作。`追踪生命周期`与你应用程序中事务的生命周期相同。在事务处理期间发生的每个操作或事件都会触发一个间隔。因此，一次追踪由一个或多个间隔组成，这些间隔可能跨越系统边界——例如，多个服务和数据库。所有与事务相关的间隔都具有相同的追踪\
  \ ID，因此通过追踪系统，你可以直化地分析在事务范围内执行的各种操作的延迟以及成功/失败状态。指标会告诉你事务执行很慢，而追踪则提供了关于为什么执行很慢的更详细信息。\n\
  \n例如，让我们考虑我们在第 11 章](#c11.xhtml)“处理数据存储”中实现的包服务器。包的加载是一个由两个独立操作组成的事务：将包加载到对象存储服务中，以及在关系型数据库中更新包的元数据。这些操作中的每一个都会创建一个包含操作详细信息和操作耗用时间的追踪。由于这两个追踪具有相同的事务\
  \ ID，你可以看到事务的总体延迟，以及每个组成操作的延迟。这在服务导型架构中最为有用，因为在这种架构中，一次事务会发生多次服务调用。存储和分析追踪数据需要专门的系统，历史上向这些系统发送追踪数据通常需要使用特定供应商的库。然而，OpenTelemetry\
  \ 项目的 Go 库允许实现独立于供应商的追踪。在本文编写时，项目 ([`github.com/open-telemetry/opentelemetry-go`](https://github.com/open-telemetry/opentelemetry-go))\
  \ 发布了 1.0.0-RC 版本。我们将使用该版本并仅使用与追踪导出相关的函数。在下一节中，你将了解一些用于修改我们在书中编写的应用程序的模式，以便这些程序能够输出遥测数据。\n\
  \n## 输出遥测数据\n\n我创建了一个自定义命令行客户端 `pkgcli` 来与第 1 章](#c1.xhtml)中实现的服务器进行交互。我还修改了包服务器以便与\
  \ gRPC 服务器通信以检查加载信息。你可以在 `appendix-a` 目录下找到所有相关的代码和说明。存储日志、指标和追踪需要专门的系统，存在许多开源解决方案。在接下来的示例中，将仅演示从应用程序传输数据，而不是这些数据的可视化和分析。你可以在\
  \ `appendix-a/README.md` 文件中找到运行命令行程序的完整说明。\n\n### 命令行应用程序\n\n对于命令行应用程序，我们将通过初始化用于导出指标和追踪的网络客户端来设置日志。然后，我们将这些初始化的配置对应用程序的其他部分开放，以便在命令执行期间注册任何消息、发布指标或导出追踪。`pkgcli`\
  \ 应用程序的示例代码位于 `appendix-a/command-line-app` 目录。它使用了 `flag` 包并应用了第 2 章](#c2.xhtml)“高级命令行应用程序”描述的子命令架构，创建一个包含两个命令——`register`\
  \ 和 `query` 的应用程序。第一个命令允许用户将包上传到服务器，第二个命令用于查询服务器信息。我们创建了 `config` 包，并在内部定义了 `PkgCli`\
  \ 结构体来封装初始化的日志、指标和追踪客户端：\n\n```\ntype PkgCli struct {\n    Logger  zerolog.Logger\n\
  \    Metrics MetricReporter\n    Tracer  TraceReporter\n}\n```\n\n我们创建了 `telemetry`\
  \ 包，包含三个函数：`InitLogging()`、`InitMetrics()` 和 `InitTracing()`，它们返回初始化的 `zerolog.Logger`、`telemetry.MetricReporter`\
  \ 和 `telemetry.TraceReporter` 对象。后两个类型用于封装发布指标和导出追踪的客户端。`telemetry` 包中的 `logging.go`\
  \ 文件如下所示定义 `InitLogging()` 函数：\n\n```go\npackage telemetry\n\nimport (\n    \"io\"\
  \n\n    \"github.com/rs/zerolog\"\n)\n\nfunc InitLogging(\n    w io.Writer,\n  \
  \  version string,\n    logLevel int,\n) zerolog.Logger {\n\n    rLogger := zerolog.New(w)\n\
  \    versionedL := rLogger.With().Str(\"version\", version)\n    timestampedL :=\
  \ versionedL.Timestamp().Logger()\n    levelledL := timestampedL.Level(zerolog.Level(logLevel))\n\
  \n    return levelledL\n}\n```\n\n我们调用 [github.com/rs/zerolog](http://github.com/rs/zerolog)\
  \ 包中的 `zerolog.New()` 函数来创建一个根记录器，这是一个输出参数设置为 `w` 的 `zerolog.Logger` 对象。然后，我们通过调用\
  \ `With()` 方法向根记录器添加日志上下文。这通过使用 `Str()` 方法添加上下文，从根记录器 `rLogger` 创建了一个子记录器，该方法为所有日志消息添加一个名为\
  \ `version` 的键，其值为设置为指定的字符串 `version`。这将导致应用程序的所有日志都包含该字段中的应用程序版本。\n\n然后，我们添加另一个日志上下文，以便在日志中添加时间戳并创建另一个子记录器\
  \ `timestampedL`。最后，我们通过调用 `Level()` 方法添加日志级别逻辑，并返回创建的 `zerolog.Logger` 对象。配置后的记录器仅在消息级别等于或高于通过\
  \ `logLevel` 值指定的配置级别时才会记录该消息。`logLevel` 的值应该是从 -1 到 5 之间的整数（包含两端）。将级别设置为 -1 将记录所有消息，将级别设置为\
  \ 5 将仅记录恐慌（panic）消息。\n\n`telemetry` 包中的 `metrics.go` 文件如下所示定义 `InitMetrics()` 函数：\n\
  \n```go\npackage telemetry\n\nimport (\n    \"fmt\"\n\n    \"github.com/DataDog/datadog-go/statsd\"\
  \n)\n\ntype MetricReporter struct {\n    statsd *statsd.Client\n}\n\nfunc InitMetrics(statsdAddr\
  \ string) (MetricReporter, error) {\n    var m MetricReporter\n    var err error\n\
  \    m.statsd, err = statsd.New(statsdAddr)\n    if err != nil {\n        return\
  \ m, err\n    }\n    return m, nil\n}\n```\n\n我们选择了 [github.com/DataDog/datadog-go/statsd](http://github.com/DataDog/datadog-go/statsd)\
  \ 包，因为它得到了良好的支持。我们通过调用 `statsd.New()` 函数创建客户端，传递 statsd 服务器地址并将创建的客户端分配给 `MetricReporter`\
  \ 对象的 `statsd` 字段。\n\n\n\n然后，我们定义 `ReportDuration()` 方法，它将传递一个包含命令执行持续时间的直方图指标。持续时间以秒为单位。指标将将添加两个标签（tag），以便对指标进行分组和聚合。我们将根据\
  \ `Cmd` 字段添加已执行的命令作为第一个标签，并独立地根据命令是否执行成功（如 `Success` 字段所示）添加第二个标签。该方法的定义如下：\n\n\
  ```go\nfunc (m MetricReporter) ReportDuration(metric DurationMetric) {\n    metricName\
  \ := \"cmd.duration\"\n    m.statsd.Histogram(\n        metricName,\n        metric.DurationMs,\n\
  \        []string{\n            fmt.Sprintf(\"cmd:%s\", metric.Cmd),\n         \
  \   fmt.Sprintf(\"success:%v\", metric.Success),\n        },\n        1, //采样率 (0-无,\
  \ 1 -全部)\n    )\n}\n```\n\n对于其他的情况，可以定义类似的方法来传递其他类型的指标。\n\n`InitTracing()` 方法定义在\
  \ `telemetry` 包的 `trace.go` 文件中。在其中，我们如下所示配置 `telemetry` 包中整个应用程序的链路追踪：\n\n```go\n\
  package telemetry\n\nimport (\n    \"context\"\n\n    \"go.opentelemetry.io/otel\"\
  \n    \"go.opentelemetry.io/otel/exporters/jaeger\"\n    \"go.opentelemetry.io/otel/trace\"\
  \n    // TODO 导入其他 otel 的包\n)\n\ntype TraceReporter struct {\n    Client trace.Tracer\n\
  \    Ctx    context.Context\n}\n\nfunc InitTracing(\n    jaegerAddr string,\n) (TraceReporter,\
  \ *sdktrace.TracerProvider, error) {\n\n    // 1. 配置链路导出器\n\n    // 2. 配置范围处理器 (Span\
  \ Processor)\n\n    // 3. 配置 TracerProvider (TracerProvider)\n\n    // 4. 创建传播器\
  \ (Propagator)\n\n    // 5. 创建并配置 Tracer\n\n    // 6. 返回 TraceReporter 类型的值\n\n\
  }\n```\n\n接下来将解释六个关键步骤。我们需要一个可以导出链路的终点，以便我们可以进行查看和查询。我们将使用 `Jaeger` ([www.jaegertracing.io](http://www.jaegertracing.io))，这是一个开源的分布式追踪系统，因此我们使用了在\
  \ `go.opentelemetry.io/otel/exporters/jaeger` 包中实现的 Jaeger 导出器。\n\n下面的代码段创建了链路导出器：\n\
  \n```go\ntraceExporter, err := jaeger.New(\n    jaeger.WithCollectorEndpoint(\n\
  \        jaeger.WithEndpoint(jaegerAddr),\n    ),\n)\n```\n\n请注意，此处我们也可以使用 `go.opentelemetry.io/otel/exporters/otlp`\
  \ 包实现的 OpenTelemetry 收集器导出器，使我们的应用程序完全相对于所使用的分布式追踪系统中立。然而，为了简单起见，我直接使用了 Jaeger 导出器。\n\
  \n然后，我们配置了范围处理器，通过使用之前创建的链路导出器来配置它，以观测应用程序输出的 `span` 数据处理：\n\n```go\nbsp := sdktrace.NewSimpleSpanProcessor(traceExporter)\n\
  ```\n\n对于生产应用，建议配置另一种范围处理器，即如下所示创建的批范围处理器（Batch Span Processor）：\n\n```go\nbsp :=\
  \ sdktrace.NewBatchSpanProcessor(traceExporter)\n```\n\n下一步是创建 `TracerProvider`，如下：\n\
  \n```go\ntp := sdktrace.NewTracerProvider(\n    sdktrace.WithSpanProcessor(bsp),\n\
  \    sdktrace.WithResource(resource),\n)\notel.SetTracerProvider(tp)\n```\n\n现在，我们就可以在代码中开始创建和结束\
  \ span：\n\n```go\nctx, span := otel.Tracer(\"my-tracer\").Start(ctx, \"operation-name\"\
  )\ndefer span.End()\n```\n\n\n\n\n```go\nc.Logger = c.Logger.With().Str(\"command\"\
  , \"register\").Logger()\ntStart := time.Now()\ndefer func() {\n    duration :=\
  \ time.Since(startTime).Seconds()\n    c.Metrics.ReportDuration(\n        telemetry.DurationMetric{\n\
  \            Cmd:        \"pkgcli.register\",\n            DurationMs: duration,\n\
  \            Success:    err == nil,\n        },\n    )\n}()\nerr = cmd.HandleRegister(&c,\
  \ w, args[1:])\n```\n\n在调用特定子命令的处理函数之前，我们更新了记录器以创建一个新的上下文，以便所有日志都包含一个额外的 `command`\
  \ 字段，其值设置为 `register`，这用于标识日志消息与 `register` 子程序相关。\n\n我们还启动了计时器，然后在延迟函数中使用 `ReportDuration()`\
  \ 方法来报告命令的执行时长。\n\n在 `cmd` 包中定义的 `HandleRegister()` 函数中，我们在向包服务器发送 HTTP 请求之前，如下所示创建了范围（span）：\n\
  \n```\nctx, span := cliConfig.Tracer.Client.Start(\n    cliConfig.Tracer.Ctx,\n\
  \    \"pkgquery.register\",\n)\ndefer span.End()\n```\n\n接下来，让我们来看看经过仪器化的包服务器版本。\n\
  \n### HTTP 应用\n\n对于 HTTP 服务器应用，我们将配置日志记录，在服务器启动时初始化用于导出指标和追踪的网络客户端。然后，我们将使这些初始化的配置对应用程序的其他部分可用，以便在执行任何命令期间允许注册任何消息、发布指标或导出追踪。\n\
  \n修改后的包服务器代码位于 `appendix-a/http-app` 目录。它是基于我们在 第 11 章 中实现的包服务器版本创建的。\n\n我们在配置包中定义了\
  \ `AppConfig` 结构，以封装应用程序配置，包括遥测配置：\n\n```go\ntype AppConfig struct {\n    PackageBucket\
  \ *blob.Bucket\n    Db            *sql.DB\n    UsersSvc      users.UsersClient\n\
  \n    // 遥测\n    Logger   zerolog.Logger\n    Metrics  telemetry.MetricReporter\n\
  \    Trace    trace.Tracer\n    TraceCtx context.Context\n    Span     trace.Span\n\
  \    SpanCtx  context.Context\n}\n```\n\n`telemetry` 包在 `logging.go`、`metrics.go`\
  \ 和 `trace.go` 文件中定义了初始化整个遥测配置的方法。`InitLogging()` 和 `InitMetrics()` 方法将与之前为命令行应用程序定义的相同。\n\
  \n`middleware` 包包含了用于传递遥测数据的中间件定义。日志记录中间件定义如下：\n\n```go\nfunc LoggingMiddleware(\n\
  \    c *config.AppConfig, h http.Handler,\n) http.Handler {\n    return http.HandlerFunc(func(\n\
  \        w http.ResponseWriter, r *http.Request,\n    ) {\n        c.Logger.Printf(\"\
  Got request - headers:%#v\\n\", r.Header)\n        startTime := time.Now()\n   \
  \     h.ServeHTTP(w, r)\n        c.Logger.Info().Str(\n            \"protocol\"\
  ,\n            r.Proto,\n        ).Str(\n            \"path\",\n            r.URL.Path,\n\
  \        ).Str(\n            \"method\",\n            r.Method,\n        ).Float64(\n\
  \            \"duration\",\n            time.Since(startTime).Seconds(),\n     \
  \   ).Send()\n    })\n}\n```\n\n你可以在上一个代码段中看到结构化日志记录的示例。我们创建一个日志行（内部值 `Zerolog.Event`），逐步添加我们想要添加到日志中的键值对字段，并调用\
  \ `Send()` 方法来触发日志的创建。如上定义的 `LoggingMiddleware()` 函数创建的请求日志将如下：\n\n```\n{\"level\"\
  :\"info\",\"version\":\"0.1\",\"protocol\":\"HTTP/1.1\",\n\"path\":\"/api/packages\"\
  ,\"method\":\"POST\",\"duration\":0.038707083,\n\"time\":\"2021-09-12T08:39:05+10:00\"\
  }\n```\n\n我们又定义了另一个中间件来增加请求处理的延迟：\n\n```go\nfunc MetricMiddleware(c *config.AppConfig,\
  \ h http.Handler) http.Handler {\n    return http.HandlerFunc(func(\n        w http.ResponseWriter,\
  \ r *http.Request,\n    ) {\n        startTime := time.Now()\n        h.ServeHTTP(w,\
  \ r)\n        duration := time.Since(startTime).Seconds()\n        c.Metrics.ReportLatency(\n\
  \            telemetry.DurationMetric{\n                DurationMs: duration,\n\
  \                Path:       r.URL.Path,\n                Method:     r.Method,\n\
  \            },\n        )\n\n    })\n}\n```\n\n`InitTracing()` 方法看起来稍有不同：\n\n```go\n\
  func InitTracing(jaegerAddr string) error {\n    traceExporter, err := jaeger.New(\n\
  \        jaeger.WithCollectorEndpoint(\n            jaeger.WithEndpoint(jaegerAddr\
  \ + \"/api/traces\"),\n        ),\n    )\n    if err != nil {\n        return err\n\
  \    }\n    bsp := sdktrace.NewSimpleProcessor(traceExporter)\n\n    tp := sdktrace.NewTracerProvider(\n\
  \        sdktrace.WithSpanProcessor(bsp),\n        sdktrace.WithResource(\n    \
  \        resource.NewAttributes(\n                semconv.ServiceName(\"server\"\
  ),\n            ),\n        ),\n    )\n    otel.SetTracerProvider(tp)\n    propagator\
  \ := propagation.TraceContext{}\n    otel.SetTextMapPropagator(propagator)\n   \
  \ return nil\n}\n```\n\n我们设置了全局追踪提供者，但没有创建中间件。因此，我们创建了自己的中间件。`TracingMiddleware()`\
  \ 如下：\n\n```go\nfunc TracingMiddleware(\n    c *config.AppConfig, h http.Handler,\n\
  ) http.Handler {\n    return http.HandlerFunc(func(\n        w http.ResponseWriter,\
  \ r *http.Request,\n    ) {\n        c.Trace = otel.Tracer(\"\")\n        tc :=\
  \ propagation.TraceContext{}\n        incomingCtx := tc.Extract(\n            r.Context(),\n\
  \            propagation.HeaderCarrier(r.Header),\n        )\n        c.SpanCtx\
  \ = incomingCtx\n\n        ctx, span := c.Trace.Start(\n            c.SpanCtx,\n\
  \            r.URL.Path,\n        )\n        c.Span = span\n        c.SpanCtx =\
  \ ctx\n        defer span.End()\n\n        h.ServeHTTP(w, r)\n    })\n}\n```\n\n\
  值得注意的是，尽管 `go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp` 定义了用于追踪\
  \ HTTP 服务器的中间件，在这里我们定义了中间中间件。例如，在 `storage` 包的 `UpdateDb()` 函数中，我们在开始数据库事务之前创建一个范围（span），并在事务提交或回滚后结束它：\n\
  \n```go\nfunc UpdateDb(\n    ctx context.Context,\n    config *config.AppConfig,\n\
  \    row types.PkgRow,\n) error {\n    conn, err := config.Db.Conn(ctx)\n    if\
  \ err != nil {\n        return err\n    }\n    defer func() {\n        err = conn.Close()\n\
  \        if err != nil {\n            config.Logger.Debug().Msg(err.Error())\n \
  \       }\n    }()\n\n    _, spanTx := config.Trace.Start(\n        config.SpanCtx,\
  \ \"sql:transaction\",\n    )\n    defer spanTx.End()\n\n    tx, err := conn.BeginTx(ctx,\
  \ nil)\n    if err != nil {\n        return err\n    }\n    // 其他部分代码\n}\n```\n\n\
  未来，可能会出现带有自动工具的 `database/sql` 包版本，那时我们就不需要为数据库操作编写属于自己的手动追踪代码了。\n\n\n\n\n在创建用于用户服务的\
  \ gRPC 客户端时，我们利用自动管理库的优势。在 `server.go` 中，你会找到以下函数：\n\n```go\nfunc setupGrpcConn(addr\
  \ string) (*grpc.ClientConn, error) {\n    return grpc.DialContext(\n        context.Background(),\n\
  \        addr,\n        grpc.WithInsecure(),\n        grpc.WithUnaryInterceptor(\n\
  \            otelgrpc.UnaryClientInterceptor(),\n        ),\n        grpc.WithStreamInterceptor(\n\
  \            otelgrpc.StreamClientInterceptor(),\n        ),\n    )\n}\n```\n\n\
  `go.opentelemetry.io/contrib/instrumentation/` 包定义了客户端和服务器端的拦截器，用于将 gRPC 应用程序与 OpenTelemetry\
  \ 集成。\n\n接下来，让我们查看 gRPC 服务器的插化版本。\n\n## gRPC 应用程序\n\n与 HTTP 服务器应用程序一样，我们将在服务器启动时通过初始化网络客户端来导出指标和追踪，从而配置日志记录。插化的\
  \ gRPC 服务器代码位于 `appendix-a/grpc-server` 目录。这是我们在 第 8 章 “使用 gRPC 创建 RPC 应用”中创建的 `Users`\
  \ 服务版本，它定义了一个唯一的单元 RPC 方法 `GetUser()`。服务的实现位于主包中的 `usersServiceHandler.go` 文件中。你也可以通过向\
  \ `userService` 结构体（它是 `Users`服务的实现）添加额外字段，查看服务处理程序之间数据交换的示例：\n\n```go\ntype userService\
  \ struct {\n    users.UnimplementedUsersServer\n    config config.AppConfig\n}\n\
  \nfunc (s *userService) GetUser(\n    ctx context.Context,\n    in *users.UserGetRequest,\n\
  ) (*users.UserGetReply, error) {\n    s.config.Logger.Printf(\n        \"Received\
  \ request for user verification: %s\\n\",\n        in.Auth,\n    )\n    u := users.User{\n\
  \        Id: rand.Int31n(4) + 1,\n    }\n    return &users.UserGetReply{User: &u},\
  \ nil\n}\n```\n\n`grpc.Server` 对象在 `main()` 函数中如下创建：\n\n```go\ns := grpc.NewServer(\n\
  \    grpc.ChainUnaryInterceptor(\n        interceptors.MetricUnaryInterceptor(&config),\n\
  \        interceptors.LoggingUnaryInterceptor(&config),\n        otelgrpc.UnaryServerInterceptor(),\n\
  \    ),\n    grpc.ChainStreamInterceptor(\n        interceptors.MetricStreamInterceptor(&config),\n\
  \        interceptors.LoggingStreamInterceptor(&config),\n        otelgrpc.StreamServerInterceptor(),\n\
  \    ),\n)\n```\n\n我们在拦截器包中定义了指标和日志拦截器。我们还注册了由 `go.opentelemetry.io/contrib/instrumentation/`\
  \ 包定义的拦截器，它为我们提供了 gRPC 服务处理程序调用的自动插化处理。`telemetry` 包初始化了日志记录、指标和追踪的配置。你会发现其初始化代码与上一节中的\
  \ HTTP 服务器相同。\n\n在拥有上述 gRPC 工具链的情况下，我们在创建用于用户服务的 gRPC 客户端时利用了自动管理库的优势。在 `server.go`\
  \ 中，你会找到以下函数。`go.opentelemetry.io/contrib/instrumentation/` 包定义了客户端和服务器端的拦截器，用于将\
