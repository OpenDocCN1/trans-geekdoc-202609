  \ nil\n}\n```\n\n`getHealthSvcClient()` 方法带有类型为 `bufconn.Listener` 的对象 `l` 被调用，并返回类型为\
  \ `healthsvc.HealthClient` 的值和错误。在函数内部，我们创建了一个拨器 `bufconnDialer`，随后用于创建 `*grpc.ClientConn`\
  \ 对象 `client`。然后我们调用定义在 `grpc_health_v1` 包中的 `NewHealthClient()` 来创建 `healthsvc.HealthClient`\
  \ 对象。\n\n我们将编写第一个测试函数将使用一个空 `HealthCheckRequest` 对象调用 `Health` 服务的 `Check()` 方法：\n\
  \n```go\nfunc TestHealthService(t *testing.T) {\n\n    l := startTestGrpcServer()\n\
