  \n### 数据类型转换\n\n当我们调用 `*sql.Rows` 对象的 `Scan()` 方法时，驱动程序包会执行自动类型转换，将数据库中表示的列原始数据类型转换为我们在应用程序中指定的变量类型。反向过程发生在执行\
  \ `INSERT` 操作符时。\n\n当我们调用 `*sql.Rows` 对象的 `Scan()` 方法时，驱动程序包会执行自动类型转换，将数据库中表示的列原始数据类型转换为我们在应用程序中指定的变量类型。反向过程发生在执行\
