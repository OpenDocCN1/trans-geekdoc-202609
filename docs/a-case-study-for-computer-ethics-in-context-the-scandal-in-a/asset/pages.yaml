  md: '# CHAPTER 2


    # Using the Case Study


    This case study covers many important topics relating to computing and professional
    ethics. It can be used as is, with no reference to the commentary and within a
    classroom structure of bespoke design. Here though we present an overview as to
    how we have used it ourselves within classroom settings. We present a thematic
    overview along with suggestions for teaching exercises. This chapter has two main
    aims which we need to address before plunging you headfirst into the case study
    itself. The first of these aims is to highlight some of the important topics which
    we encounter, in context, throughout the case study. The second aim is to give
    examples of how the case study can be explored and debated during class sessions.


    However, importantly here we advise you as an educator to allow the conversation
    to go wherever it goes. What we outline here is not the ‘correct answer’ to how
    people should interpret the study, but rather one set of common insights and perspectives
    that emerged as a result of our own interests and teaching experiences. Different
    people will identify different topics of note and will assign a different strength
    of moral judgement to the activities documented. The case study is intended as
    a prompt for discussion, but the book is not a list of directions as to finding
    topics worthy of that discussion.


    This is a case study that is about computer ethics. Many of the issues we discuss
    are within an academic frame – this is both tractable to students and sufficiently
    transferable that it can be related to almost any knowledge-based scenario. Primarily
    though this book concerns itself with how technology impacts on our lives and
    the lives of anyone in a professional workplace. However, a work of this nature
    is less about the computers, and'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'more about the people that use computers. Ethical and moral responsibility
    for technology, how we talk about it and how we use it, is always to be found
    in the human component of the equation. While much of what we discuss is specifically
    within the professional framing of a university, the issues are intended to be
    largely universal. As part of the discussions to follow in the classroom, students
    – and teachers – should look for commonalities between their life experiences
    and those of the participants in the study. Relatively few people have published
    an academic paper, but they’ll certainly have written an essay for an assignment
    or uploaded a YouTube video. The specifics as they exist in the case study are
    only examples of the general case. While most will not have experience of a domineering
    academic supervisor, many of us can think about a micromanaging boss and extrapolate.


    With that in mind, we present this as a formal platform of study for the Scandal
    in Academia.


    # TOPICS AND ISSUES RAISED IN THE CASE STUDY


    We reiterate that list of topics is not exhaustive. We have though divided the
    case study into four major themes to show a way in which the topics discussed
    can be effectively contextualised.


