- pgno: 200
  md: '# A Case Study for Computer Ethics in Context


    video in which he hired people on the crowd-labour site Fiverr to display a message
    saying ''DEATH TO ALL JEWS''. The list of incidents like this is vast and growing
    – success through engineering virality at the cost of authenticity is a common
    technique for those hoping to turn attention into a career. If you need more evidence,
    we might point to ImJyaStation who faked his girlfriend’s death to get more subscribers
    – blatantly and intentionally using his conspicuous artificial grief to garner
    a new audience on the grounds ‘it’s what she would have wanted’. YouTuber ReSet
    received a 15-month custodial sentence for giving a homeless man an Oreo cookie
    filled with toothpaste and recording the result. Sam Pepper faked a kid-napping.
    DaddyOfFive and MommyOfFive lost custody of their children after abusing them
    online in exchange for YouTube views. Honestly, the list goes on and on.


    For every significant case of outraged notoriety, there are many more that simply
    went unnoticed because the uploader was not famous enough to garner real attention.
    The Internet is full of pranks being performed on innocent bystanders, or sexual
    harassment of women passed off as comedy. No one knows the formula for success
    as an influencer, but recency is undoubtedly a major factor. It’s hard to become
    a star when you take your time to have a slow, measured, and thoughtful response
    to an incident that happened in the past. It’s much easier to throw out ‘spicy
    hot takes’ and ‘spill the tea’ – two terms that refer, respectively, to speaking
    your mind without allowing opinions time to evolve, and to reveal gossip with
    the intent of titillating a receptive party.


    It’s obviously unfair to judge all journalists and all influencers by the actions
    of the worst of them, in the same way we can’t judge all academics by the standards
    set by the frauds we have discussed in earlier chapters. There are people out
    there doing wonderful, uplifting work. There are video essays with all the density
    and robustness of the best academic papers. However, that’s not the way you want
    to bet it in the early days of an emerging scandal. Influencers inevitably benefit
    from the parasocial relationship their viewers have with them – that is to say,
    a one-sided arrangement where one person looms large in the mind of the other,
    and the other has no idea the first exists. The personalities shown by influencers
    online are crafted through curation and editing in the same way that data sets
    are improved through pruning ‘outliers’. Everyone is putting forward their best
    face, in the best way. Authenticity is difficult to judge at a distance. Every
    interaction with an unknown journalist or unknown influencer puts someone in the
    shoes of the imprisoned within the Prisoner’s Dilemma.'
