- pgno: 44
  md: 'These are powerful forces – an important paper on the subject by Mahaffy (1996)
    discusses the power of the effect to change the way lesbian Christians dealt with
    the perceived dissonance between their religious belief and sexual orientation.
    Coping strategies to deal with the issue included recasting core beliefs or abandoning
    their religion entirely. Studies around homosexual evangelicals (Thumma, 1991)
    likewise show the power that dissonance has to internally deconstruct and reconstruct
    our sense of identity. Every day, as our views are being formed by comparison
    with those around us, we must resolve many incongruities until we arrive at our
    sense of what is right. That’s our sense of morality.


    The societal structures that impact on us can be small – at the level of a local
    community, or huge – the level of governments and religions. We have to navigate
    ourselves through a maze of these, picking up our sense of right and wrong as
    we do. This has the consequence that everyone’s morality is different – we may
    have large degrees of commonality as a result of shared experience, but we’ve
    all led different lives and had different moral messages imprinted upon us – each
    with a different emphasis. The concept of moral relativism comes into play here.
    This is an often misunderstood principle that simply argues that there is no way
    to objectively agree on what is good and what is evil because these are subjective
    judgments and not drawn from any objective criteria.


    One may filter down the universe to the smallest atoms and yet never encounter
    anything that deals with morality. Lacking a universal ‘yardstick’ against which
    we can measure a moral code, all we can do is judge other moral codes from the
    relative position of our own. There is no ‘universal truth’ that runs through
    our moral codes – they are a combination of that which was socially useful and
    advantageous from an evolutionary perspective. Those who subscribe to a belief
    in an all-powerful creator may be able to argue that their sense of morality is
    truly objective, but unless all parties can agree as to which creator and what
    their rules are, it remains a subjective, relative judgment.


    That’s all fine and dandy, but it doesn’t make for a very good basis upon which
    to build a society.


    That’s where the role of ethics comes in. We, in this book, define ethics as simply
    a defined code of conduct – a formal set of rules to which all individuals within
    a particular community agree to adhere. In the biggest case, we might call them
    ‘laws’. We may not agree with particular laws, and some may be against our own
    personal sense of morality, but we live in a society where we’ve all agreed that
    if we break the law there will be'
