  md: '# 252 ■ A Case Study for Computer Ethics in Context


    of Mutually Assured Destruction. It’s perhaps the perfect mass-damage interpretation
    of the Streisand effect. On the Internet, a sense of control – especially of information
    – is often little more than a delusion.


