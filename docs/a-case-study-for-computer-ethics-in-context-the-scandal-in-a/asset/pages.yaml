- pgno: 210
  md: 'inevitable conclusion of efforts to balance genders within the university system
    is that gender becomes a powerful ‘tie breaker’ characteristic in recruitment.


    But even with gender diversity programmes codified into most universities’ working
    practices, the situation is still hugely uneven. Four countries in the OECD have
    a greater than 40% proportion of women researchers, and the highest of these is
    46% (Abramo et al., 2016). In the UK, women represent 38.3% of researchers, and
    in Germany it is fewer than a quarter. Even in the Nordic countries, with an enviable
    reputation for gender equality, it’s still the case that men outnumber women two
    to one. In Australia, women make up a smaller proportion of senior faculty than
    men, despite making up a greater proportion of junior faculty (Bailey et al.,
    2016). In Canada, half of all assistant professors are women but only 28% of the
    professors²². In the UK, women earn on average 15.1% less than men in the same
    position for academic work²³. In the US, women hold almost half of the tenure-track
    positions but less than 40% of the tenured posts²⁴.


    What we see from these statistics is something concerning. The problems that exist
    in recruitment are not sufficient in many cases to keep women from entering academia.
    That’s encouraging. Systemic issues in the university system prevent women entering
    the higher ranks of university faculties at the rates we should expect. That’s
    alarming. The statistics become even more concerning if we take even the lightest
    look at intersectionalism where issues of ethnicity, disability, and sexuality
    dramatically impact on progression (Catalyst Quick Take, 2017). We don’t even
    see a person of colour (PoC) on the short-list for the positions in our case study.
    Or at least, we can assume we don’t given the equality comments in the email chain
    we can be fairly sure that skin colour would have been brought up in the rundown.


    The university faculty system values grantsmanship and research output over teaching,
    pastoral care, and service (Harvie, 2000; McKenzie et al., 2018). The former are
    fields that are primarily dominated by male academics. We saw the effect of this
    early on in Coronavirus lockdown, where women academics were expected to shift
    over to family care while balancing their professional duties – something we have
    already addressed. Men simply aren’t expected to participate in this kind of work
    to the same degree and have thus been free to widen the gap of accomplishment
    (Minello, 2020).


    It is likely attitudes like those of McManus have a powerful impact on this. Equality
    in many fields is a pipeline problem (Makarova et al., 2016)'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'but not exclusively. It’s also an issue where systemic misogyny, racism, and
    homophobia are embedded into the processes and incentives in a way that results
    in an almost invisible web of complicating factors. Even this is a charitable
    interpretation and leaves aside the fact that overt displays of discrimination
    are still a major problem in the academic system (Brunsma et al., 2017; Howe-Walsh
    & Turnbull, 2016; Madera et al., 2019; Mellifont et al., 2019; Pyke, 2018). The
    problems don’t exist only in the faculty. We’ve already discussed how students
    are regularly more critical of women in evaluations and more willing to tolerate
    eccentricities in male academics (Mengel et al., 2019).


    Even if Sharon does come out of this situation with a PhD and her reputation intact,
    which is unlikely as we have discussed in previous analyses, academia is an institution
    where the soft impact of implied sexism is considerable. Unfortunately, other
    industries don’t fare much better – in a 2016 analysis it was found that women
    made up 47% of all employed adults in the US, but held only 25% of computing roles
    (Ashcraft et al., 2016). Of those women, Asian women made up 5% of the number
    and black women made up 3%.


    For James, the situation is grimmer still. In 2019, only 19.3% of people with
    disabilities (PwD) were employed in the US compared to 66.3% of those without.
    As with the gender pay gap, there’s also a disability pay gap. It’s approximately
    15.5% in the UK according to the TUC. PwDs are more likely to lose their jobs
    and be denied promotions than abled people. Again, we see in McManus a taste of
    at least one reason – accessibility compensation is costly and the university
    system only occasionally has the funding to line up internal development with
    disability inclusion (Heron et al., 2013). Tools, processes, and buildings all
    have to be modified to ensure accessibility for PwDs. While this is often legally
    required in many cases, it’s an issue of don’t ask, don’t tell. If nobody with
    disabilities needs to use your home-brew software setup, you never need to ask
    yourself hard questions about the usability of the tools upon which you rely.
    Bespoke tools are common for analysing results, gathering data points, and running
    research servers. We don’t even know how inaccessible they are in general because
    it’s a question we simply have not asked ourselves in the literature.


    What we do know from the case study though is that the tools James was required
    to use were not accessible as a rule and required a number of compromises and
    workarounds before he could access the data he required. And that in turn creates
    a difficult question for James to answer: ‘Should I rock the boat?’.'
