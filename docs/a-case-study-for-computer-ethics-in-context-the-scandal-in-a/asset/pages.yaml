- pgno: 7
  md: '# About This Case Study


    Ethical instruction in computing science courses is an important part of organisational
    credibility and professional body accreditation. It serves an important role in
    anchoring student skillsets within the context of societal norms, while also helping
    future professionals understand the implications of what they do. The British
    Computer Society (BCS) emphasises that students must be exposed to professional
    and ethical outlooks before BCS accreditation can be awarded. The joint Association
    of Computer Machinery (ACM) and IEEE curriculum guidelines for undergraduate degree
    programmes likewise stress the importance of ethical and professional understanding.
    A framework for incorporating this kind of content into courses is important,
    and while these guidelines offer support for the importance of the topic, there
    remains a need for a coherent set of instructional material that helps contextualise
    the issues and relate them to each other. Much of the difficulty associated with
    meaningful ethical instruction is complicated by the emotional distance that students
    can put between themselves and the topic (Heron & Belford, 2015) and the lack
    of cohesive examples drawn from real life only exacerbates the difficulty of establishing
    relevance.


    Back in the nineties, a book was published under the name *The Case of the Killer
    Robot: Stories about the Professional, Ethical and Societal Dimensions of Computing*.
    The book was an extension of papers published in the ACM Computers and Society
    (SIGCAS) newsletters (Epstein, 1994a, 1994b). *The Case of the Killer Robot* was
    a genuinely innovative, original, and entertaining fictionalised account of a
    software development company beset with institutional problems and faced with
    a growing legal and reputational crisis. The story begins with the death of a
    factory'
  merge: -1
  img_proc: true
