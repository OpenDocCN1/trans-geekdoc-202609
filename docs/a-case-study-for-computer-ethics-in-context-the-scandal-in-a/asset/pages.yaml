  md: '# THE LAWS AND ETHICS OF COMPUTER HACKING


    We discussed in Chapter 3 about a kind of scaffolding that takes us from ‘morality’
    through ‘ethics’ into ‘laws’. Specifically, laws can be viewed as a framework
    of externally enforced ethical codes. Whereas betraying our professional codes
    of ethics might only carry the sting of being ostracised, that’s not the same
    when it comes to the law. The state, in whatever form its enforcement takes, chooses
    the extent to which we are to be punished for infractions. With the activities
    of Nemesis, we enter a different kind of consideration than we have discussed
    so far. That is to say the extent to which his activities were compatible with
    law. And, unfortunately, it’s not looking good for him. But also, again, it’s
    not as simple as ‘he broke the law’ or ‘he didn’t break the law’.


    One thing that defines the legal framework around computer crime is that it is
    usually outdated. The time-frame in which legislation, case law, and precedent
    operate is sedate and stately. It can take years for a complex case to work its
    way through the various magisterial stages of the legal process. The European
    Court of Human Justice outlines in Article 6 of its convention that ‘everyone
    is entitled to a fair and public hearing within a reasonable time’ (Mahoney, 2004).
    The International Covenant on Civil and Political Rights states as part of Article
    9 ‘Anyone arrested or detained on a criminal charge shall be brought promptly
    before a judge or other officer authorized by law to exercise judicial power and
    shall be entitled to trial within a reasonable time’ (Macken, 2005). However,
    that word ‘reasonable’ is carrying a lot of weight on its shoulders in both of
    these statements.


    The way that legal systems are constructed is often in two parts. One is what
    we might think of as ‘setting laws’, and in modern democracies there is usually
    an intentional lag built into this process so as to ensure that complex issues
    receive due consideration and contemplation. At least, in theory. In the United
    Kingdom for example, a bill goes through several parliamentary stages including
    a first reading, second reading and debate, analysis by committee, a report stage,
    a third reading, and then it is voted on by both the House of Commons and then
    the House of Lords before receiving Royal Assent. Many of these stages also include
    room for amendment, rejection, and re-evaluation. There are numerous other ways
    in which proposed legislation can be delayed and adjusted within the process of
    refinement. Or, of course, new laws can be rejected entirely, forcing a rethink
    that may require the expenditure of additional time or political capital. Most
    modern democracies have processes like this that ensure a single dominant party,
    or individual, can’t change the law in a kneejerk'
