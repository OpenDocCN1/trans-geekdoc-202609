  md: 'We should be critical here – is he reporting all sides of the story equally?
    Is he quoting people out of context? Is he choosing the topic to cover based on
    what contributed to the public right to know, or that which is most likely to
    sell papers? To be fair, it’s possible for him to be serving his career while
    still being largely in alignment with a broader ethical code… but the fact is
    that this is the only lens we have on what has happened, and we don’t know what
    impurities that lens may possess. Jack McKracken, previously the custodian of
    the story, is now going to find himself just one voice amongst many – perhaps
    the one with the greatest authority by virtue of having made the largest contribution
    to the story being uncovered. Like everyone else involved though, he better hope
    his history withstands scrutiny.


    More than this, the social media response itself is going to become a story –
    it will generate other stories in other outlets purely because of the attention
    they gain. It’s not that the story has become more newsworthy in and of itself,
    but rather the media is complicit in feeding the fires of social media outcry.
    What we’ll see coming from this is a range of ‘meta-commentaries’. We’ll see articles
    that capture what people are saying online. We’ll see academics writing papers
    about it. We’ll see television news try to turn flowing screens of text into video
    content by layering tools like sentiment analysis onto the discussion. We’ve just
    seen that in our newest article.


    That in turn is only going to skew perspectives, since the specific flavour of
    sentiment analysis used will dramatically change how comments are coded (Shen
    et al., 2018). Use one sentiment analysis algorithm and perhaps 60% of messages
    are supportive of Blackbriar. Another may report only 30%. Results can vary by
    language, depth of subtext, specific cultural jargon, and other complex factors.
    The choice of algorithm used in such circumstances is rarely transparently presented
    to a viewer or a reader. Despite this opaqueness, these commentary pieces will
    shape the public response even as the public response shapes these commentary
    pieces. Proverbs 27:17 says, ‘As iron sharpens iron, so a person sharpens another’.
    That’s what’s going on here. As Lenin once said, ‘everything is connected to everything
    else’ and nowhere is that more true in how people engage in discourse online.


    The problem with the kind of analysis that uses algorithms to produce an illusion
    of objectivity is the same issue we discussed in the previous chapter with regard
    to metrics. Analysis can never reflect the true depth of nuance to be found in
    any issue while still counting as analysis. By its nature, it must attempt to
    identify themes and meaning so as to convert'
