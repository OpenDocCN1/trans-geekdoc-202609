  md: '# Multimillion-Pound Consequences for Research Fiddle




    An exclusive report by Jack McKracken for the Dunglen Chronicle


    The North Sea Algorithmic Exploration (NSAE) project was today the centre of a
    media storm as the scandal at the University of Dunglen rages outside the boundaries
    of academia. The multimillion-pound project is supported by a consortium of funding
    partners including the Scottish Government, the European Union, and 12 of the
    oil companies involved in drilling for the natural resources within the seas surrounding
    Scotland. Several universities have been funded to perform research for this project,
    and Professor John Blackbriar is a significant partner in the work. Senior stakeholders
    in the project have gone to the press demanding a full public inquiry into how
    the project has used the Blackbriar data sets and the Blackbriar Algorithms. Initial
    results from the NSAE had been extremely encouraging, pointing to the potential
    of additional billions of extractable crude within the region. Lately however,
    those results have been far less reliable.


    Chuma Hassan, spokesperson for the European Funding Council, released a statement
