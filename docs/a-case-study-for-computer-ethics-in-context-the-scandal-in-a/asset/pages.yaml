- pgno: 282
  md: '# A Case Study for Computer Ethics in Context


    The grounds under which a FOIA request in the UK can be rejected are comprehensive.
    You can simply reject a request in its entirety on the ground that it would be
    too costly in time and money to process (27% of withheld requests), or that the
    request is vexatious or a repeat from the same person (4%). Of course, an external
    party critiquing a response on the first ground would find it difficult to prove
    either way, and vexatiousness depends on subjective criteria such as ‘proportionality’
    or ‘justification’, or ‘tone’.² It is the information holder, absent a legal challenge,
    who rules on these criteria.


    And if this wasn’t enough, provisions in the GDPR can also blanket-protect information
    holders from making certain revelations in specific categories. There some specific
    exemptions that can be employed, and these account for a staggering 69% of withheld
    FOIA requests. Some of these are information intended for future publication (practically
    anything in a university; research information (ditto); information relating to
    security bodies and national security; information related to investigations and
    prejudicial to law enforcement; public policy and the effective conduct of public
    affairs; communication with the royal family; personal information; confidentiality;
    trade secrets; and more.


    Note that all of these exemptions come with guidance as to when they can fairly
    be employed, and some of them are because revelations are subject to other legislation
    (such as data access requests or environmental impact requests). But it’s safe
    to say that a party looking to obscure information from a FOIA request has plenty
    of avenues to explore. These exemptions vary on a country-to-country basis, but
    legislation has a difficult job to do in balancing the public right to know and
    the organisation’s right to effective internal governance. The wrong piece of
    data, absent any of its surrounding context, can do tremendous damage. While not
    obtained under the Freedom of Information Act, we can harken back to the Climategate
    controversy (Leiserowitz et al., 2013) in which the leaked emails and files from
    the Climatic Research Unit at the University of East Anglia were skewed and misrepresented
    to support a climate change denier agenda (Garud et al., 2014). An off-handed
    joke, a careless use of a name, might be all it takes to stoke the fires of a
    conspiracy.


    When there is an embarrassing revelation like this, the first thought of many
    bureaucrats is to stem the tide by closing off access to all currently accessible
    records. An audit will likely need to be performed to see just how bad it’s going
    to get, and that’s not helped by having a ticking time-bomb of public revelation
    as thousands of interested parties start poring'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'through all the original records. Public bodies have a duty of transparency
    in many cases, and it is never obvious except in hindsight what transparency is
    going to be problematic in a scandal. Maybe in one case it’s the date of a meeting.
    Maybe in another it’s the list of members who give their apologies. In another
    it may be that a particular issue was discussed and never followed up on. The
    problem with information security is that data turns into information in unexpected
    ways and in unanticipated constellations. We’ve already discussed this in relation
    to, for example, how content-free metadata can provide the content it is missing
    by evaluating it in conjunction with other metadata. If someone phoned a doctor,
    then their partner, then an abortion clinic, we don’t need the conversation log
    to know the topic of those conversations.


    The bureaucrats at the EFC here have done what seems to be the initially obvious
    act of self-preservation – closing off access to public documents until the extent
    of the damage can be assessed. This doesn’t necessarily imply a cover-up, but
    rather that it’s best for a public response to be based on having more information
    about the emerging scandal than the public itself. It gives some distance from
    the immediate damage of revelation so that a cooler, calmer response can be constructed.
    It permits for the reputation of an organisation to be protected, which as we
    have already discussed is one of the primary tasks of an organisation. Prohibiting
    access to the files – in the short term – is the administrative equivalent of
    bandaging an open wound.


    Remember ‘The Internet interprets censorship as damage’, as John Gilmore once
    said. Its systems for dealing with it are not robust or reliable, but they are
    situationally very embarrassing. Thus, the sensible Twitter user makes use of
    auto-delete features that expunge tweets older than a certain age. Nobody knows
    what the social media mavens of the future will consider to be a hellworthy trespass,
    and nobody knows when they will unexpectedly swim into prominence in online discourse.
    A full Reddit post history is a liability. Open access to your Facebook feed a
    disaster. And so it is here – a prominent public body would certainly find its
    content backed up on the Internet Archive, and it’s the first place a certain
    type of internet denizen will check. In the attempt to bandage their own data
    wounds, the EFC in this scenario has just directed laser focus to the most vulnerable
    parts of their injury. The Streisand Effect once more comes to bear to excoriate
    anyone who wants to revise the past in line with the present’s emergencies.


    Again, it’s important to stress here that the act of (presumably temporarily)
    closing off access to compromised files is not in itself evidence of malfeasance
    or a cover-up. It can be a sensible and necessary first step'
