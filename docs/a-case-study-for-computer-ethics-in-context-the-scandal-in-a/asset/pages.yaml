- pgno: 199
  md: 'under any circumstance is a matter for debate – and in many cases, litigation.
    However, these activities were not confined to celebrities or figures associated
    with the public’s ill-defined ‘right to know’. Investigations carried out as a
    result of police inquiries revealed that journalists had been using these techniques
    to access the voicemails of people associated with the murdered schoolgirl Milly
    Dowler. Also of the missing Madeleine McCann, and the family of the Sohan Children.
    There is also evidence of the same being applied to relatives of deceased British
    Soldiers as well as victims of terrorist incidents including 9/11 and the London
    bombings. Members of Parliament (including Tony Blair, David Blunkett, Boris Johnson,
    and Gordon Brown) and their relatives (Cherie Blair, David Mills, and Gaynor Regan)
    have been targeted. Members of the legal profession were considered fair game
    (Kirsty Brimelow, David Cook, Lord Imbert, and Michael Mansfield) as were witnesses
    in legal proceedings (Anne Colvin and unnamed witnesses to the murder of Jill
    Dando). Christopher Jeffries, wrongly accused of the murder of Joanna Yates, had
    his messages accessed while he was being defamed by the newspapers doing the defaming.
    The list of victims of this invasive technique is… extensive⁵.


    If this is what professional journalists will do in pursuit of a story, imagine
    what restrictions a budding influencer may place upon themselves in the war for
    attention on the Internet. The average age of an employed journalist is around
    40 years old, with the associated expectation of life experience and maturity…
    despite the evidence outlined above. The average age of a ‘successful’ influencer
    is 27 years old. The average age of a budding influencer of the kind most desperate
    to stand out from the crowd is much lower, with some estimates suggesting a median
    age of around 19 years. What expectations should we have on a teenager arriving
    on site in the middle of a complex situation? Especially when their entire motivation
    is to build a public profile for themselves that will allow them to rise above
    competition? What price will someone be willing to pay for virality?


    Well, we have some benchmarks. In December of 2017, successful influencer Logan
    Paul entered the Aokigahara Forest, famed for being a home to ghosts and the site
    of many suicides since the 1960s. There he filmed, and then published, a video
    in which he recorded a dead body and his reaction to the same. He was 23 years
    old at the time. Nicole Arbour in 2015 posted a video widely considered to be
    ‘fat shaming’, which went viral to great controversy. She later revealed the whole
    thing – the controversy and her later climbdown – was a marketing scheme worth
    tens of thousands of dollars. PewDiePie, at one point the largest star on YouTube,
    released a'
