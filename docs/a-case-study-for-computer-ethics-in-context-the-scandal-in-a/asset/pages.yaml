    It’s not critical to our case study to know what the professor’s work likely did,
    but it’s illustrative of understanding how something as straightforward as fudging
    the data may have gone undetected. Feel free to skip the next section if you’re
    happy to accept the proposition ‘some research is too complicated for lay people
