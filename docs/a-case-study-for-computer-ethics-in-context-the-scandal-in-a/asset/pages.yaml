- pgno: 197
  md: 'This is relevant here because social media is a primary tool by which journalists
    can get access to critical information when investigating an institution of any
    kind (Abdenour, 2017; Gearing, 2014). The often porous nature of the staff/student
    interface in a university makes this a particularly effective technique. This
    is an environment full of academics with expertise in non-technical disciplines
    but limited awareness or experience with online disclosure (Masur, 2019), especially
    in the face of the ‘privacy dark patterns’ employed to keep data flowing (Bösch
    et al., 2016). This combines with a general apathy about disclosure online amongst
    younger users (Hargittai & Marwick, 2016). These and other factors mean that journalists
    can often get access to greater insights than they might otherwise in a locked
    down information ecosystem. It’s difficult for a journalist to just walk onto
    a Google campus, for example.


    However, the older tools of investigative journalism are just as effective when
    applied to a university as they are elsewhere – asking questions, making phone
    calls, and simply hanging around listening to what others say. Permitted presence
    on campus is technically regulated by an ID card of some kind, but enforcement
    is often lax except under special circumstances. In most of the institutions where
    the authors have worked, staff cards have generally remained in wallets and the
    number of times this has resulted in a challenge during the course of regular
    duties is in single digits over two decades. On one memorable occasion, one of
    the authors of this book – dressed in jeans and a t-shirt – needed access to a
    locked room full of expensive specialist equipment. It was an unfamiliar building
    in an unfamiliar part of the campus, but simply going up to the front desk and
    asking for the key was enough to get access. Act like you belong, and people often
    won’t stop to ask if you do. Such is the core of social engineering.


    Security practices may vary from institution to institution, and even from year
    to year. Post-pandemic, the university where the authors currently work has been
    described, by Michael, as ‘like working in a CIA blacksite’. The number of card-swipes
    required to get into the building, into an office, and then into a classroom is
    genuinely bizarre. Much of this is a pantomime of security – access to the bridge
    between buildings for example requires a card swipe, but the two different buildings
    can be accessed without a card by simply by going outside and entering via the
    main door.


    Sometimes external events influence the theatre of security – when a member of
    the royal family was visiting a different institution, staff were denied access
    to the building and surrounding complex if they could not'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'produce appropriate evidence. They were queried even if they did as to their
    purpose – at a building where they were employed. This inconsistency of enforcement
    in itself is a tool that journalists can leverage should they be so inclined.
    Sometimes they don’t even need to leverage anything – all of this is leaving aside
    the occasional incidents where leaks are used as a tool in winning internal struggles
    within a university². The press is a proxy battleground where arguments of all
    kinds can be fought and occasionally won.


    In times of scandal, such as we see here, organisations will often take the opportunity
    to ‘remind’ people of convenient policies that were never effectively communicated
    in the first place. Temporary prohibitions may apply, and special instruction
    may be given. For example, during a particularly problematic incident involving
    the alleged misconduct of a vice chancellor³, staff at the affected university
    were given explicit instructions about how to identify journalists and how to
    refer them to the university’s PR department in line with a policy that had hitherto
    been under-emphasised. Policies for social media for staff are inevitably stricter
    than those for students, but the same general principles apply.


    However, the simple presence of people with cameras on campus may be enough by
    itself to create a chilling atmosphere for those that are simply looking to go
    about their studies. Professional journalists can be expected to conform – at
    least in principle – to certain norms of conduct. Even with that, breaches of
    privacy by journalists are often shocking in their brazenness. We’ve already briefly
    mentioned Marcus Hutchins, the cybersecurity specialist who stopped the Wannacry
    virus by identifying its weak spot and creating what was effectively a kill switch
    (Zimba & Mulenga, 2018). This he did under the pseudonym of MalwareTech. Speaking
    to the Guardian, he indicated that he wished to remain anonymous⁴:


    > > It just doesn’t make sense to give out my personal information, obviously
    we’re working against bad guys and they’re not going to be happy about this.


    His right to privacy was not respected. Within days, The Sun, The Daily Telegraph,
    The Daily Mail, and the Mirror had worked to find out his name. They published
    photographs, camped out on his lawn, and hunted down colleagues for insights into
    the reclusive young hero. In other incidents, journalists associated with News
    International have ‘hacked’ into voicemails to get access to information for stories.
    Whether this is acceptable'
