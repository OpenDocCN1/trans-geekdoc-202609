- pgno: 76
  md: '# 70 ■ A Case Study for Computer Ethics in Context


    The most prestigious universities have a regular and ongoing production of intellectual
    property. The University of California received 597 patents in 2020. MIT received
    383, and Stanford 229. The sector as a whole in the United Kingdom applies for
    over 2000 patents a year, of which over 700 are granted. The evidence on the efficacy
    of this mixed. In 2001, Charles and Conway (2001) showed that few universities
    make money from their library of patents, and that the costs usually exceed the
    revenues. That picture does not change when we look at recent years. Not all intellectual
    property produced by universities is suitable for exploitation (Andersen & Rossi,
    2011). It’s difficult, given the incompatibilities in how various institutes manage
    and report on their patent and licencing, to evaluate for sure the value of these
    revenue streams (Bonaccorsi & Daraio, 2007; Meyer & Tang, 2007). The competency
    of the sector in exploiting these intellectual property rights is increasing,
    but it remains a fraught business.


    That doesn’t change the sheer number of patents and the sheer amount of money
    being spent and produced in aggregate. Within the US alone, annual patent applications
    have risen from 15,953 in 2015 to 17,738 in 2020. Granted patents have gone from
    6,680 to 8,706 in the same period. Research expenditure has risen from around
    6.5 billion dollars to around 8.3 billion. Over a thousand staff are employed
    in managing these various licences. For all of this, the gross licencing income
    show spectacularly poor results. The best performing universities have an annual
    median licensing income of 14 million. The worst performing have an annual median
    income of a mere 15,000 (Allard et al., 2021). These are the 2020 figures.


    When universities do manage to acquire a patent with genuine commercial implications,
    then it can be a significant boon to the institution – one that must be protected
    and wisely shepherded. The income from a profitable patent is unlikely to make
    a difference to the fortunes of an institution as large as a university. It can
    though have a hugely disproportionate impact on individual departments and the
    academics that benefit from the profit streams. The University of California for
    example earns almost half of its 48m USD patent-related income from five patents,
    including a Hepatitis B vaccine and a bovine growth hormone. Given that the university
    holds 6,441 active patents as of 2020, it is clear there’s a very long tail regarding
    where the profit is to be had. The university’s annual budget for 2009–2010 came
    in at 20.1 billion USD – that 48m USD of research income accounts for around 0.2%
    of that budget. In 2022, the annual budget was 46.9bn USD with 109m of commercialisation
    income. Or, again, around 0.2% of the budget.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Even a breakout hit of a patent won’t make that much of a difference to the
    overall financial health of a university. Even the most successfully entrepreneurial
    universities do not cover their entire research spend with patent-related income
    – most struggle to attain a 10% return on that investment. That’s not to say that
    the income is insignificant or unimportant. The inventor behind a university patent
    might share in as much as 50% of the research income. The usual figure though
    is much lower, and the percentage tends to decrease as the revenues pass various
    thresholds. The department in which the academic is housed can expect to receive
    a bounty from the funds that go to the university. Even a small revenue stream
    can be the difference between working alone and having a few postgraduates to
    help out. The more researchers you have working for you, the more papers that
    will be produced, and the more reputation you build. A commercially exploitable
    patent makes life in a university much more productive for the generator of such
    revenue.


    # REPUTATIONAL IMPACT


    Our students are in a tough position – likely caught in the shadowy hinterlands
    where they have committed a breach of research ethics, but without active knowledge
    of it. Their association with a respected academic in the field has likely gone
    from a dream opportunity to a nightmare with no real escape. That’s the risk in
    a world where your reputation means everything – when it’s gone the ramifications
    are much more significant. Our postgraduates are likely at the start of their
    academic careers – before they even get a chance to establish themselves, they’ve
    been caught up in the wake of a scandal. They’ll find it very difficult to recover
    from this regardless of what the investigation by the university finds. Their
    association with a very visible case of academic fraud will be a stain on their
    curriculum vitae for the rest of their lives.


    In the Stapel case discussed in the previous chapter, 19 PhD theses were prepared
    with data obtained from Stapel. Seven of these were eventually cleared of wrongdoing,
    and 12 remain under some degree of suspicion. The parallels with Professor Blackbriar
    are considerable – Stapel maintained a tight control over the raw data and made
    excuses whenever students asked to see it. The report into Stapel’s misconduct
    outlined the damage done (Levelt Committee et al., 2011).


    > The Committee finds that great harm has been done to coauthors and PhD students
    in particular, as a consequence of the fraud committed by Mr. Stapel. The Committee
    has become aware'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'in the course of the interviews that the consequences for those involved can
    be both formal and informal in nature. In a formal sense, the people affected
    are hampered in their careers, such as when extending temporary contracts and
    applying for grants. On an individual level some victims have been demoralized.
    In an informal sense, there is an element of stigmatization that may persist long
    into their further career.


    It goes on to add:


    It is not only individual people that are affected, but confidence in science,
    and in social psychology in particular, has been badly dented by Mr. Stapel’s
    actions. Other victims are the universities of Tilburg, Groningen and Amsterdam,
    whose reputations have been damaged, academic publishers, which have been obliged
    to withdraw published articles, providers of research funds, whose grants have
    been used fraudulently, and fellow researchers, who may have been denied the grants
    and direct funding that were awarded instead to Mr. Stapel.


    It’s not just direct financial consequences that are impacted by fraud, as the
    report indicates. It’s also the loss of possible opportunities for those who may
    have been competing honestly for grant money. In addition to the direct monetary
    costs of grants awarded, many research careers may simply not have been given
    the opportunity to begin.


    We live in a world now where our indiscretions and mistakes are recorded for the
    world to view. A simple Google search of our name may bring up many pieces of
    information that we’d prefer the world at large did not see. Around 70% of US
    employers in 2010 had rejected applicants over what they have found by Googling
    their names and examining what they have left public on their social networks
    (Cross-Tab, 2010) – a practice sometimes known as cyber-vetting. A survey by CareerBuilder
    in 2018 suggested the problem was getting slightly worse, although the prevalence
    varies a lot by sector. UK employers also engage in this practice, but to a lesser
    degree (a mere 41% of recruiters have rejected candidates based on online information).


    It’s important to note too that the information found may not even be accurate
    – 90% of US recruiters say they are concerned about information accuracy and claim
    to attempt to corroborate its correctness. In the UK,'
  merge: -1
  img_proc: true
- pgno: 79
  md: '80% say they’re concerned about accuracy but only 68% claim to make an attempt
    to corroborate. The prominence and visibility afforded to online information has
    an impact on what people find about us. A front-page story of a popular newspaper
    accusing us of something dreadful is likely to be one of the first hits on a search
    of our name. The much smaller and less prominent retraction by the same newspaper
    the next day might never be seen.


    The Internet does not forget, and the more public our mistakes the more significant
    the consequences. In the best-case scenario, our post-graduate students might
    hope to be exonerated, reinstated, and permitted to finish their studies in peace
    and then move on to promising careers. Unfortunately, the odds are stacked against
    them. Even if they are found fully innocent by the university, it’s entirely possible
    that future recruiters may never find that out because a disciplinary report on
    an internal intranet won’t have the same visibility as the reporting of Mr. Jack
    McCracken.


    Reputational management is not a matter purely for academics – academia is just
    an unusual case in that reputation is usually the primary currency in which people
    deal. Managing one’s online footprint is becoming increasingly important. The
    value of an employer searching for your name and finding your own immaculately
    designed webpage as the first hit is increasing on a year-by-year basis. It’s
    something that extends outside of our professional lives too – increasingly friends,
    potential romantic partners (Smith & Duggan, 2013), and those with a financial
    stake in our future are turning to Google to find out things about us.


    When well-managed, our digital footprints may be as much an asset as a liability.
    A good social media presence with many followers or friends can translate into
    the impression of access to considerable social capital. Those with large amounts
    of influence are occasionally courted by organisations looking to wield that influence
    to mould the perception of their brands on the wider Internet – those that can
    sell a brand while still appearing authentic demonstrate an increasingly valuable
    skill (Van Driel & Dumitrica, 2021). A high degree of clout may translate into
    upgraded flights, access to premium services, or complimentary gifts in the hope
    that someone will use their social network connections to put in a good word.
    Increasingly, this status is seen as being so valuable that there has grown a
    community of people who endorse brands without having deals, in the hope that
    it inspires other brands to actually pay for endorsement (Lorenz, 2018). Once
    upon a time, selling out was considered worthy of'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'the greatest social censure. Increasingly though, selling out is seen as an
    aspirational life goal.


    What we''re dealing with here though is a more unilateral digital footprint –
    one that our postgraduate students have little opportunity to manage or edit.
    It''s one likely to dwarf their own attempts to shape a Google search in their
    interests. As such, it is one that will have genuine consequences for their future
    employment regardless of the conclusion of the eventual inquiry into their actions.


    # REMOTE WORKING


    One final thing that is worth addressing here is the offhand comment made that
    the fractious relationship between Blackbriar and his students worsened considerably
    during the Coronavirus pandemic. This was when working at home became the default
    model for those in the knowledge-based professions. All of us have our stories
    about how Coronavirus affected us, and it will likely be a decade or more before
    the full economic, social, and professional impacts can be assessed. It''s already
    clear that the impact was felt asymmetrically. Some of us – with home offices,
    perpetual insomnia, and deep-seated introvert tendencies – found it largely compatible
    with how we''d like work to be arranged as a matter of course. Others – the extroverts
    (Evans et al., 2022) and those with tiny apartments – found it intolerable. There''s
    no ‘one size fits all’ conclusion to whether enforced remote working was a boon
    or a curse. What we can realistically say though is that having had a taste of
    an alternative, many workers are unwilling to commit to a full-time return to
    the office (Gibson et al., 2023; Gifford, 2022). Finding a happy balance between
    work presence and personal convenience is one of the dominant challenges of the
    post-pandemic economy.


    However, the research does suggest that remote working is best when people are
    already predisposed to work well together. Otherwise, there is a laundry list
    of problems. People have reported growing isolated (Van Zoonen & Sivunen, 2022)
    while struggling to deal with a lack of structure (Becker et al., 2022). Some
    have experienced a sense of career instability (Felstead, 2022), and a difficulty
    in setting boundaries between home and work (Bellmann & Hubler, 2021). One of
    the benefits of working in a university is the opportunity for deep, meaningful
    conversation with thoughtful, intelligent people (Berg & Seeber, 2016). It is
    much harder to have an impromptu cup of coffee with a colleague when'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'you’re all in back-to-back Zoom meetings. Presence of the distractions of home
    can both inhibit productivity and also exacerbate burnout as it becomes harder
    to tell where one part of your life ends and another begins.


    It is likely some of these factors were at play in the decay of the relationship
    between Blackbriar and his students. Proximity allows for a lower friction of
    interaction – scheduling a Zoom call is a more intensive prospect than sticking
    your head in someone’s office and asking a question. Emails can be missed, and
    tone can be hard to communicate. When everyone assumes good faith from everyone
    else, these can be minor annoyances and people will work to deal with them. When
    a relationship is already a problem, the ease with which someone can be avoided
    can just compound existing problematic dynamics.


    However, there is another side to the coin which is that remote working has as
    many, if not more, upsides – although one must be mindful of the socioeconomic
    privilege often implied by having convenient, quiet places to work in a home environment.
    For those with the space to dedicate to their career, home working can be the
    optimal way to perform meaningful knowledge work. It eliminates the need for commuting
    (Beno, 2021); enhances autonomy (Aczel et al., 2021); and permits opportunities
    for a better work-life balance (although that does not manifest equally along
    gender lines) (Ipsen et al., 2021) while ensuring the optimal blend of working
    environment to responsibilities. For those employed by a university, working at
    home is often a core part of how the job is structured. Universities have long
    understood the value of letting people work closest to their personal optimum
    when expecting them to be self-directed and in service to their own large self-appointed
    goals (Jackman et al., 2022).


    We cannot then simply point to remote working as the cause, or solution, to any
    social problems within an institution. It is as much about the remote **workers**
    as it is about anything else. The roots of the problem in our case study are found
    in the period predating Coronavirus, but it is likely the enforced shift to remote
    working was a contributory factor in the further breakdown of the collaboration.


    # REFERENCES


    Aczel, B., Kovacs, M., Van Der Lippe, T., & Szaszi, B. (2021). Researchers working
    from home: Benefits and challenges. PLoS One, 16(3), e0249127.'
