    platform to controversial speakers. However, it is also another sign that universities
    are fiercely protective of their brands – social media pressure is the primary
    vector by which these protests are organised.


    This speaks to a somewhat concerning trend in the academy for those that are inspired
    by F. Scott Fitzgerald’s assertion that ‘First-rate intelligence is the ability
    to hold two opposed ideas in mind and still retain the ability to function’ (Fitzgerald,
    1945). Deplatforming essentially removes the opposition from education. It is
    though inaccurate to say that this represents an assault on freedom since the
    conflict here is in two fundamentally incompatible conceptions of freedom. One
    is the freedom to express viewpoints, the other is freedom from the ‘harm’ of
    being exposed to those viewpoints. In some cases listed above, the speakers might
    genuinely be considered extremists under PREVENT and associated programmes. In
    others, particularly those voices that have been deemed “Trans Exclusory Radical
