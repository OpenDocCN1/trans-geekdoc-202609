  md: '# Clean-Out at Scandal-Linked Journals


    # NEWSPAPER ARTICLE


    *An exclusive report by Jack McKracken for the Dunglen Chronicle*


    Several journals which had published work from Professor Blackbriar of the University
    of Dunglen have been quietly cleaning house in recent weeks. Many members of their
    editorial boards have been suspended and several peer reviewers struck off internal
    registers and blacklisted. This according to Dr. Paula McCrane. Dr. McCrane was
    previously a deputy editor for the Journal of Deep Sea Oil Exploration (JoDSO)
    and is currently editor-in-chief of a new open access academic outlet called the
    International Journal of Extreme Extraction (IJEE).


    ‘I received an email from the owners of JoDSO a few weeks ago that said, in essence,
    “this happened under your watch, and so we won’t be requiring your services any
    more”. I’m not the only one who got an email like that’.


    ‘The process of academic publishing is misunderstood by many’, she added. ‘My
    position as deputy editor was unremunerated – I did it just because it’s part
    of what it means to be an academic. I handled correspondence with contributing
    authors, chased up calls for papers, and allocated peer reviewers to submitted
    papers. I also did the “desk reject” if necessary – that’s when we say we won’t
    publish a paper and don’t even send it out to reviewers. My role in the publication
    of the Blackbriar papers was really just logistical, but that doesn’t matter it
    seems’.


    The Journal of Deep Sea Oil Exploration has come under intense criticism by academics
    since the'
