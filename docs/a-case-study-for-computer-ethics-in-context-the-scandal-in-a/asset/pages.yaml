  img_proc: true
- pgno: 256
  md: 'this respect. And it may be inevitable, in those circumstances, that they attempt
    to minimise the risk where they have means of control. And one of those means
    of control is in contract compliance.


    An anonymous student in our scandal points out that if she didn’t sign the Social
    Media Usage Policy for the university she wouldn’t have been allowed to register.
    If she couldn’t register, she couldn’t get a degree. In such circumstances, there’s
    no real option at all. It’s coerced agreement where the power differentials are
    too great to overcome. It’s not as simple as ‘Well, just go somewhere else’. That’s
    fine if you’re choosing between washing machines or mobile phone contracts. You
    have many alternatives.


    The choice to go to a university is bound up in hundreds of considerations and
    it has life-long implications. People may choose to go to a university because
    of its location – either close to family obligations or blissfully far away. They
    may choose it on the basis of its standing in the career path they wish to follow.
    They may choose a university because it’s the one their friends are going to,
    or because family members have a particular connection. And it may be only one
    of a few options they have thanks to the seat limit on particular programmes of
    study. And, inevitably, they’re all going to have policies like this in place.
    In such circumstances, it may be an illusion of a choice to say ‘Well, you don’t
    have to study here’.


    We’ve already discussed somewhat about how social media policies have become a
    common tool of controlling opinion online. Staff are almost always bound by policies
    of this nature in one form or another. They place limits – sometimes perfectly
    fair and appropriate – on what individuals may say on their private social media
    profiles. For some platforms, such as Facebook, that can be difficult due to the
    nature of private versus public profiles and posts. For other platforms, such
    as Twitter, it’s trivial. One way to stop people complaining is to put penalties
    in place for when they do.


    It doesn’t always work, of course.


    The Streisand effect is an internet phenomenon that describes how attempts to
    divert attention away from a topic will instead intensify the attention that topic
    receives. The name stems from an incident in which the Oscar winning actress attempted
    to have some photographs of her coastal residence expunged from a research project
    aimed at exploring issues of erosion. Instead of protecting her privacy, the incident
    instead ensured her residence became part of the background culture of internet
    discourse. Any time someone is caught trying to deflect attention away from something,
    we all think once more of Barbra Streisand and her luxury mansion.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'So when the Union Street Guest House in New York put in place a policy charging
    guests $500 for leaving a negative review, it doesn’t take a genius to guess what
    happened next. Once *Reddit*, the *New York Post*, and *Time Magazine* brought
    attention to the policy, it resulted in over 3,000 blisteringly negative reviews.
    The owners claimed the policy was a joke and eventually removed it from their
    policy page. The extent to which that joke policy had been enforced, as they claimed
    it hadn’t been, is debated (Cordato, 2014).


    Corporations must then walk a tricky path between protecting themselves from negative
    publicity while also navigating the complexities of internet culture. And like
    anything, some have seized on the opportunity presented by this as an effective
    route to publication. Weaponising the effect is now part of marketing handbooks
    the world over. Do you want everyone on the internet to talk about your product
    for a while? Then get it censored and the Streisand Effect will do the rest. Just
    one news story about how PETA’s latest shockvertisement has been banned can lead
    to tens of millions of views on the corresponding YouTube video.


    The internet is resistant to censorship. As was once remarked in the early days
    of the technology, ‘The Internet views censorship as damage, and routes around
    it’. At the click of a mouse, almost anything can be locally preserved. Tweets
    and social media updates can be removed, but screenshots last forever. On one
    hand, this is a wonderful fact – the past cannot be rewritten or excised. On the
    other, the internet is also particularly poor at encoding **context** in its artefacts.
    Those that wield the past as a weapon have come to cynically rely on the effectiveness
    of a choice tweet, screen-capped out of context, and revisited at a time of maximum
    impact.


    This decentralisation though is a powerful tool, and one that has been wielded
    effectively by organisations we have already discussed. As part of its self-preservation
    strategy, WikiLeaks will release heavily encrypted ‘torrents’ of leaked data.
    A torrent is a file that is downloaded from dozens, hundreds, or even thousands
    of computers at a time. The more people that have a file, the more computers it
    can be downloaded from, and the faster the download becomes. Everyone shares a
    bit of the responsibility of distributing it. Since the file is stored effectively
    everywhere, it’s the same as it not being stored anywhere – it becomes impossible
    to prevent its transmission. Part of the WikiLeaks strategy is that if anything
    happens to their central infrastructure they only need to transmit a decryption
    code and the entire world has access to the raw, unedited, and maximally damaging
    original data. One might think of it as the data security equivalent'
  merge: -1
  img_proc: true
