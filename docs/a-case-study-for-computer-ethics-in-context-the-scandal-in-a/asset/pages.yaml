    With that in mind, it is perhaps not surprising that a measure of cold reality
    seeps in when someone has made a mess of a situation via social media interaction.
    Occasionally this can genuinely be attributed to hacking, but often the perceived
    anonymity of hackers serves merely as a convenient shield behind which wrong-doers
    can hide.


    After his account posted a photo showing ‘a real lamping’ of 100 foxes, Vinnie
    Jones claimed ‘this is a hack ive never seen this pic in my life and did NOT tweet
    it is a hack! !!’. Nadia Gustavo was a South African Zumba trainer whose account
    posted ‘Friday 20, 2016, three black kaffas were finally found guilty of armed
    robbery in Queenstown regional court...’. On losing her job, she said, ‘I have
    just lost my job at Virgin Active for something I did not do’. Amanda Bynes claimed
    she was hacked in a 2013 Twitter spat with rapper Kid Cudi. Anthony Weiner in
    2011 initially blamed a mistakenly posted photograph of his penis on hackers,
    although he later recanted and apologised. C-SPAN host Steve Scully, who was lined
    up to moderate a 2020 presidential debate, made a public tweet that called into
    question his objectivity, and rather than accept responsibility he claimed that
    it was the result of hackers – something he had also done in 2013.


    Sometimes it’s not hackers who are claimed to be at work, but unnamed and unidentified
    assistants or staffers. Ted Cruz ‘liked’ a pornographic video on Twitter and claimed
    that it was the result of a staffing issue. This kind of response sometimes comes
    not even as a result of aggression, misconduct, embarrassment, or unpleasantness
    online. Alicia Keyes claimed she had been hacked after an innocuous tweet was
    posted from her iPhone – not a problem except she had just been made Creative
    Director for Blackberry. Sometimes the issue is merely that you’ve inadvertently
    outed yourself as being a supporter of an inconvenient brand.


    We cannot be sure of the truth of such claims without a full investigation being
    conducted and the results being made available. It is though simultaneously plausible
    and implausible. Supposition and gut feeling must substitute for genuine insight
    into the real state of affairs. That is, of course, absent sufficient attention
