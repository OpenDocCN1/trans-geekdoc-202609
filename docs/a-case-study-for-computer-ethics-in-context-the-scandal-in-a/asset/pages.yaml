  md: 'of professional misconduct at the NSAE project. We cannot comment at this time
    but we are fully invested in ensuring the success of this venture. The NSAE project
    is key to understanding the ways in which difficult to access oil resources can
    be economically exploited in way that minimises environmental cost. This is a
