- pgno: 292
  md: 'Those work similarly but put constraints around the specific named parties
    to which the covenant belongs – as in, ‘you can’t work for ScotOil for five years’.
    While controversial, they are legally enforceable provided an employer can demonstrate
    that such clauses are necessary to protect themselves from reasonable risk. Whether
    it’s legally enforceable in the Blackbriar’s case is simultaneously a matter for
    courts to decide, and almost entirely irrelevant. It’s hard to imagine what university
    will be keen to employ a disgraced professor within the time-frame between his
    termination and his retirement, and it seems likely that he has disgruntled his
    industrial partners sufficiently that he will find few friends there.


    The non-disparagement clause on the other hand will make Blackbriar’s settlement
    conditional on his refusing to say anything negative about the University of Dunglen,
    and likely also any significant person or personages associated with the institution.
    In other words, he can’t release a tell-all autobiography if he still wants to
    be in compliance with his settlement package. We’re once again not privy to the
    exact wording employed, but it is likely under the circumstances to be broad –
    applying to oral and written forms, as well as social media, video, and anything
    else that comes to mind. It may be time limited, but more commonly a non-disparagement
    clause extends in perpetuity. Anything Blackbriar has to say in his defence in
    the future will have to be filtered through this contractual limitation on his
    freedom of speech. We have to hope, for his sake, that his settlement package
    was worth the gag – academics tend to chafe against restrictions of this sort.


    Why is the university doing so much to stifle possible dissent in the future given
    that the damage has presumably already been done? Perhaps because Blackbriar may
    know where the bodies are buried – acting as he did at the highest levels in the
    university, with regular contact with senior decision makers, he undoubtedly has
    plenty of gossip as to the inner workings of the institution. Some of that may
    show the university in an unfavourable light if revealed by an uncharitable mind.
    Blackbriar has little reason to think well of the university, one must assume.


    However, we also need to take into account the suggestive tone of later reporting
    that talks about the algorithm that gradually became less of a focus as the newspaper
    dug deeper into the people around it. It turns out that the system does work –
    perhaps not reliably enough for what is needed, but there are implications that
    given further testing the tool might still deliver on what was promised. That
    is, after all, what Blackbriar seemed'
