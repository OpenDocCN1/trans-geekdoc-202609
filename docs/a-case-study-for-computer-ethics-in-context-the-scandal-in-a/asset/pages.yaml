  md: 'The comments made by the university tell us quite a bit about what may have
    happened – a research code of ethics is usually designed to ensure several things:


    +   1. Accuracy in reporting of results.

    +   2. Probity in the conducting of trials, especially those involving other people.

    +   3. Respect for the confidentiality of research data and intellectual property.


    Professor McManus has explicitly indicated that this is a potential violation
    of the research code of ethics, although whatever is being alleged is likely to
    impact on the professional bodies to which the professor belongs. We can begin
    to untangle this situation by looking at each of the three criteria in turn.


    # Accuracy in Reporting


    This is a key element when communicating research results, and a bedrock of the
    scientific process. The nature of peer review and academic publication is such
    that verification of research data can take years, if it’s ever done at all. There
    are all kinds of ways in which this principle could be violated – for example
    faking data, cherry-picking results, or incompetence in analysis.


    The first of these is comparatively rare because of the extremely high cost to
    those who might be tempted. It’s not unknown, however – take for instance the
    case of the once rising Netherlands star of Diederik Stapel (Bhattacharjee, 2013;
    Levelt et al., 2012) who confessed to faking portions of his research output in
    at least 55 papers. In at least ten student dissertations that his postgraduate
    students submitted for their doctorates, there was evidence of his fabricated
    data being used. His work had been highly influential and caught the attention
    of media outlets for its significance. His papers showed that train stations that
    are not well tended bring out racist tendencies in people. He showed that eating
    meat made people selfish, and that meat-eaters were generally less social than
    vegetarians. Unfortunately, when suspicions began to grow about the way in which
    his results were reported, it turns out his data was less than robust.


    For several papers, the data he had obtained turned out not to show the results
    he wanted. When faced with the choice of abandoning his'
