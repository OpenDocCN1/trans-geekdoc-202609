  md: 'be a compelling reason as to why ‘experts’ should be ignored if one is pushing
    an advocacy agenda. Evidence denial (Lewandowsky et al., 2013) is a major reason
    behind the growth of pseudoscientific views in modern discourse. Having access
    to the data permits those that know enough to misinterpret it (knowingly or otherwise)
    to conveniently ‘contextualise’ it for a non-specialist audience. Most of us must
    rely on the analysis of experts in complex fields. We rely on doctors to interpret
    medical research. We rely on lawyers to interpret case law. We rely on teachers
    to interpret pedagogic theory. Even experts in one field cannot be relied upon
    to understand the context of another – those that work in health research cannot
    extrapolate the conventions that are germane to pedagogic research, and vice versa.
    It goes even further – we wouldn’t expect an expert on human-computer interaction
    (HCI) to have much to contribute in terms of insight regarding the philosophy
    of dependence injection within software development… even if both topics fall
    underneath the general rubric of ‘computing’.


    We live in an age of decreasing trust of expertise and with this comes a growth
    in a mindset that believes facts are subject to interpretation. It is sometimes
    said we now live in a post-truth era. Claims such as these are part of the problem,
    simultaneously attempting to elevate one viewpoint as unquestionable truth and
    the other as ‘post-truth’ wish-fulfilment. When applied to raw, unquestioned data,
    this can be a fair comment – one is one, and that’s not up for debate. When this
    kind of absolutism applied to complex, multivariate scenarios, this is something
    more likely to alienate people than convince them.


    As scientific advocacy becomes increasingly politicised, we must accept the possibility
    that there are multiple interpretations for data and that an expert presents us
    with the one they find most credible. Ideally this is the one most compatible
    with the evidence, but it would be foolish to believe that sometimes it’s the
    interpretation that is most compatible with an expert’s politics or moral framework.
    It is sentiments such as these, and the occasional obvious example of experts
    or pundits pushing a biased agenda, that underlie claims such as that of Michael
    Gove when he said in 2016, during the national debate over Brexit, that ‘Britain
    has had enough of experts’. This is a dangerous position for society to be in
    – when those most able to offer a clear and realistic lens onto data are held
    in the least esteem by those responsible for acting upon their advice.


