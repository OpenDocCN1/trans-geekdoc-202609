  md: 'what their funding partners might desire. In such cases, the code of ethics
    will normally outline what is to be done with regard to publication of results.
    Finally, there is an issue regarding academic authorship – whose name goes on
    the paper. This is a specialised kind of ‘respect for intellectual property’ and
    one that is of keen interest to researchers. Different fields have their own conventions
    on how it works, but the location and prominence a name receives on a paper is
    significant. ‘First Author Status’ is important in many fields – it indicates
    that the first author named on a paper is the one to whom most of the authorial
    credit should be allocated. It matters too in tangible ways – being the main author
    on a paper is valuable for promotion, for credibility in funding applications,
    and in demonstrating ‘research independence’.


    The further down the ‘pecking order’ you are on the authorship list, the less
    of the ‘credit’ belongs to you. When your work is cited in other papers, many
    referencing styles serve to give prominence to the first named author. For example,
    using some intext citation systems, the first mention of a paper gets the full
    list of authors, such as (to use one of Dr. Heron’s papers as an otherwise irrelevant
    example) in Heron, Hanson & Ricketts. (2013). In subsequent citations, this becomes
    Heron et al. (2013). The result is that the first author receives considerably
    more notice in cases of multiple citation than subsequent authors. First author
    status then is important in getting a researcher’s name out there. Most research
    codes will have something about how authorship should be allocated, and there
    is a convention known as the Vancouver Recommendations that are generally appropriate.
    Journals to which papers are submitted will likely have further guidance.


    We are left with a situation then where our professor has fallen foul of one or
    more of these issues. Being as how his work is about algorithmic extraction of
    crude oil, it’s probably not an issue regarding human participation in his trials.
    This is ‘computer science’ and abstracted away from the level of flesh and blood.
    As a well-established professor, we might assume that he is unlikely to have fallen
    foul of any simple methodological issues with the work he has done – we know he’s
    published 250 papers and first-authored 80 of them. By now he’s almost certainly
    gotten the ‘easy mistakes’ out of his system. Almost certainly – as we saw above,
    stature is not necessarily a defence against this kind of methodological error.


    Likewise incompetency in analysis – while such issues are rife, our professor
