- pgno: 69
  md: 'Obviously, none of those are real references – the Blackbriar Algorithm doesn’t
    exist outside of our case study. These fictional papers though are so confidently
    formatted and delivered that an uncritical reader will be forgiven for taking
    them at face value. In fact, that happens already. In the middle of an argument
    with a friend about Michael’s competence to comment on a particular topic, Michael
    asked GPT to list his five most significant papers showing he was an acknowledged
    expert in the area. The algorithm happily supplied a whole bunch of credible looking
    references. At this point Michael’s friend responded by insisting that the Michael
    Heron listed as an author on these papers was a different Michael Heron. He didn’t
    consider the possibility, initially, that the papers didn’t even exist. The way
    in which generative AI presents its results often bypasses human readable analyses
    of the AI decisions being taken… that doesn’t mean those analyses are accurate
    or even in the ballpark for correctness.


    We’ve also got in our description the buzzwordy term ‘Blockchain’ thrown into
    the mix. You may have already had experience in real life trying to work out its
    significance in a whole pile of fancy sounding technological solutions to problems
    that probably don’t exist. At its core, the idea is pretty simple – imagine that
    instead of shifting a piece of data around by itself, you moved it around along
    with a full accounting of its history. Every time it was touched or changed, a
    little cryptographically secured hash would be computed to encode it – this is
    known as a record. Each record contains a hash of its previous records, creating
    an irreversible and theoretically secure chain of interactions. You can’t alter
    a lot of a record without altering all the others that follow. Most of these use
    a peer-to-peer network to act as a kind of public record – known as a distributed
    ledger. Working together, this network authenticates and validates new transactions.
    The technology is highly secure and is at the core of the growing family of cryptocurrencies.
    Given that each record contains the chain of all previous records, the storage
    requirements tend to grow exponentially. In 2014, it was estimated the ledger
    of all Bitcoin transactions was around 20 gigabytes, but as of the end of 2022
    it had risen to 435 GB.


    We don’t know exactly how blockchain is working within the Blackbriar model, but
    the use of the phrase ‘Proof-of-Work’ tells us a lot. One of the things that underpins
    some cryptocurrencies – Bitcoin being one of them – is in how the accuracy of
    new transactions on the blockchain is verified. One of the issues with a peer-to-peer
    system is that there is no central authority, and so there needs to be a way for
    all the different parts of the'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'system to agree on a cryptographic proof. In technical terms, they need to
    arrive at **consensus**. Essentially, new chains are only considered valid insofar
    as they are verifiable products of computing processing. When you hear people
    talking about Bitcoin ‘mining’, this is what they’re talking about – computers
    doing unnecessary calculations in order to assuage the paranoia of a consensus-based
    system. As a result there is huge environmental impact as around a million people
    draw electricity to power racks of CPUs and GPUs in the hope that they do enough
    work to gain a newly minted Bitcoin. The cost is considerable – while it is not
    wholly straightforward to estimate electrical consumption of the Bitcoin economy,
    estimates usually put it in terms of comparable outputs on a national scale (Badea
    & Mungiu-Pupzan, 2021). Greece and Ireland are a common basis for comparison.


    This isn’t true of all cryptocurrencies – other systems, such as Ethereum, employ
    alternatives such as ‘proof of stake’, in which superfluous calculation is abandoned
    in favour of having systems offer a ‘stake’ of coins as collateral for validation.
    Actual validation is then done by a random system – weighted by stake – where
    a consensus as to validity is decided upon by a subset of hosts. The environmental
    impact of this, in comparison to proof-of-work, is almost negligible. In 2022,
    Ethereum moved to a specifically environmentally conscious approach to consensus
    building, instantly dropping global electricity draw from 2,600 MW/h a year to
    23 MW/h. Bitcoin, by comparison, consumes about 127 Terawatt hours per year.


    This may seem like an odd aside to take, but consider too that there is another
    part of this system – that the Blackbriar Algorithm also employs deep sea drones
    to ‘take samples’ of some subset of identified points of interest. The article
    is non-specific about how many points of interest and has nothing to say about
    the likely environmental impact of this sampling. In a world that is rapidly heating
    beyond even our pessimistic projections, there are surely questions to be answered
    here about how we pay for the technologies we choose to use.


    Bringing that all together, we have to acknowledge the circumstance that replicating
    these results is very tricky. You need access to the algorithm (which may or may
    not have been published in full), access to the raw data (which we are told in
    no uncertain terms is proprietary and spread across many stakeholders). In this
    case, we’d also need access to the random number seeds that were used to generate
    the probabilistic results. It’s clear from what we know that these are results
    we couldn’t replicate by hand, even if we had access to the data. If we had access
    to the data and the'
