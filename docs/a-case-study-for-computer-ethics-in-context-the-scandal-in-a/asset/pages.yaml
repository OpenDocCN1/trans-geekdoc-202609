  md: 'in auditing what has happened. News and social media are driven by novelty
    and by the virality of content. Mature, sensible reflection doesn’t get retweets.
    Knee-jerk ‘hot takes’ is how you get yourself noticed and retweeted. And in that,
    it works best if you play to your factional interests and link up with fashionable
    grudges. Superficiality of insight is not an anchor on the speed of retweets –
    in fact, it might well be an accelerator as it inspires quote-tweets in defence
    or in dismissal. Such an environment is not conducive to a social media manager
    who is looking to provide robust, meaningful responses to a social media storm.
    It especially doesn’t help cool, considered decision-making to have to constantly
    engage with the fringes of the discourse. It makes perfect sense to throw some
    cool water over speculation – to remove the kindling before it catches fire. The
    problem is though that social media fires burn hot enough to break cool water
    down into hydrogen and oxygen, and it turns out that instead of removing kindling
    you just replaced it with fuel of a more efficient nature.


