- pgno: 230
  md: 'impact are concerning (Reimers, 2022). However, the authors of this book would
    argue that this pales in comparison to the changes to come with the sudden emergence
    of AI in its post-2022 form. AI is actually performing well in a number of areas
    now, and it seems like that’s going to be an existential problem for us as a species.


    The long-standing joke in computer science as a discipline has been that artificial
    intelligence is ‘ten years away’ from living up to its promise, and it’s been
    ‘ten years away’ since the 1950s. It’s never been true – while AI has excelled
    at certain specialist, narrow tasks such as playing chess and producing mathematical
    proofs, there was always a huge gap between the promises of the technology and
    the reality. After decades of effective AI being ten years away, it turns out
    the people saying it ten years ago were finally correct. AI is now good at a lot
    of things, and some of those things are fundamental to what we consider the baseline
    skills of an educated populace. AIs are now good at writing, for example. They’re
    good at expressing ideas and building coherent arguments. The output from ChatGPT
    and the many alternative systems write convincingly and with clarity, even if
    as we’ve seen already they don’t necessary have the ability, yet, to write **accurately**.
    Of course, it’s wrong to suggest that this is a purely technological accomplishment
    – in the background is an underpaid and exploited army of people responsible for
    cleaning data and feeding it into the algorithms (Williams et al., 2022).


    AI is now good at writing code and even fixing broken code that is submitted to
    it. It can even do it in incredibly obscure contexts. For years, the first author
    of this book was the primary developer on a Multiuser Dungeon (MUD) called Epitaph.
    This ran on a driver (FluffOS) upon which sat a Mudlib (Epiphany). The driver
    provided a language called LPC, which is poorly documented, and the specifics
    of it vary from mudlib to mudlib. As part of the training material associated
    with the Epitaph and the MUD from which that itself was derived (Discworld MUD),
    Michael wrote a full textbook on LPC within the Epiphany mudlib (Heron, 2010).
    While the generated code wasn’t **quite** correct – it was correct **enough**
    to be a massive aid to productivity. Generated code may need some cleaning up,
    some syntax shifts, some changes to the inherits, and so on but an area in a MUD
    may comprise hundreds of rooms, and now GPT can output those in a matter of seconds.
    Detailed area work, with rooms crafted by human developers, means new areas in
    a game can take months, or years, to develop. With AI, it could be done in a few
    days. Especially if you could,'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'for example, tell the AI to ‘Add a command that lets someone write on the blackboard’
    and it would alter the code to allow it to do exactly that.


    With a combination of prompt engineering, human editing, and mudlib design, it’s
    entirely possible for a MUD – again, a massively obscure and niche form of gaming
    – to be constructed at speed and at scale using nothing more specialised than
    the baseline GPT available to the general public. If someone wanted to develop
    their own LLM trained entirely on MUD area code, one has to assume something much
    more effective and less human intensive could be generated.


    How do you examine a student’s ability to write, or to code, or to create user
    interfaces? How do you assess them in any number of previously human responsibilities
    when an AI can do it quicker, more cleanly, with no errors, and with no obvious
    sign of AI intervention? And if that’s impossible, do we even really need to be
    teaching this stuff at all? Generative AI is likely to require a fundamental reassessment
    of how we **do** assessment. It may be some time before we quiet the reverberations
    of this sudden explosion of AI competence – if we even can.


    The University of Dunglen is not alone in perhaps overreacting to the worry –
    governments throughout the world are scrambling to work out legislation to govern
    AI, and sometimes even to work out with whom the jurisdiction for such legislation
    belongs. We cannot comment too deeply on this – at the time of writing, most of
    this legislation is still in early draft form – but suffice to say there is much
    that needs to be addressed. Some of these concerns are old. Some are desperately
    new. LLMs are trained on huge data sets, and those data sets often include copyrighted
    material. It is possible, for example, that my own written material on LPC is
    the basis for some (or even perhaps a lot) of GPT’s fluency with the language.
    I say it is possible, because the general public are not permitted access to this
    training data to see if it is non-infringing, and that’s a problem that needs
    to be addressed. As soon as something is fixed into a tangible form, copyright
    protections apply. A Large Language Model using your website for its training
    is already violating your intellectual property. Perhaps you have an open licence,
    such as a Creative Commons derivative. Good luck getting an attribution to your
    work in the output of an infringing generative AI.


    We have seen this debate reach perhaps its sharpest tone in relation to those
    AI systems that generate imagery, as it is not simply a case of reproducing images
    but also **styles**. Styles and techniques cannot be copyrighted, but social prohibitions
    against this form of ‘moral plagiarism’ are'
