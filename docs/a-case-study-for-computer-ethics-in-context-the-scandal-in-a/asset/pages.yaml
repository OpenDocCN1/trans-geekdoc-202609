- pgno: 168
  md: 'The impact that these kinds of disclosures has can be seen in the articles
    we’ve been referencing through this chapter. It is often not the case that what
    we have put online is sensitive information in and of itself, but rather information
    that has a certain expectation as to the context of its audience. Within a technical
    publication, we might reference jargon, common tools, and techniques and make
    reference to technology and concepts that could not be expected of a ‘lay’ reader.
    That’s entirely appropriate because academic papers are intended to be read by
    a specialist audience, in the same way that procedural motions in a court are
    intended for a legally literate audience rather than the populace as a whole.
    We would not use such specific terminology when describing the work to friends
    and relatives with whom we cannot assume common ground in understanding. There
    is a context of audience that we all implicitly function within. Or rather, there
    are multiple complex contexts that overlap in ways predicted by technical experience
    and demographic makeup. Clashes of these contexts can yield misunderstandings
    and misattribution of intention.


    Even in more informal communications, there is a form of social context that textures
    and informs the way in which we discuss topics. This context is rarely explicitly
    referenced when leaked emails and such are published for the unguarded and salacious
    gossip they contain. Communication is not simply statements delivered in order
    – it’s a collaborative exercise in building understanding. Both the source and
    recipient of information are engaged in a collective task of interpreting meaning
    (McCulloch, 2020), and the literal definition of words and terms by themselves
    may not fully illuminate that intended meaning.


    Consider for example the simplest of these contexts – familiarity. In-jokes and
    shared experiences can radically change what words mean and how they should be
    interpreted. A shared bond between people can ensure that jokes are understood
    as such, and sarcasm is picked up for what it is. In taking a random email from
    a random inbox, we are ignorant of such nuance and it’s impossible to codify it
    in a form that genuinely captures the often heavy weight of contextual subtlety.
    An email that states ‘you could always fake the data’ might be intended as a joke
    when sent to the designated recipient. The recipient might understand that instantly
    because of social cues not encoded into the missive. No serious intent or suggestion
    of fraud is intended. However, when read uncharitably by an otherwise dispassionate
    independent observer, it looks an awful lot like an exhortation to misconduct.
    More than this, attempts to explain the'
  merge: -1
  img_proc: true
- pgno: 169
