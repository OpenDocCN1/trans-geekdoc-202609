    The stakes are high, especially in the English and Welsh universities where a
    student may be paying as much as £9250 a year for tuition. They become astronomical
    when we consider American universities where annual costs can range from $12,000
    in a public two-year college to $50,000 for a private university education. The
    potential rewards for cheating are directly informed by the perceived value of
    the qualification weighed against the perceived difficulty of achieving a good
    grade. Cases of academic misconduct are increasingly common across all institutes,
    and as pressure is brought to bear on internal procedures it becomes increasingly
    unlikely that all will be conducted with the rigour necessary to prevent legal
    challenge (Heron & Belford, 2016).


    Complaints against universities have become commonplace – 2022 was a record year
    for complaints within the UK, with a total of 2,850 being received by the Office
