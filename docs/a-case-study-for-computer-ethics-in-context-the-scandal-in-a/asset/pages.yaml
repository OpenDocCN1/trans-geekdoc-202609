- pgno: 271
  md: 'You don’t really need to go to this length to get a paper published these days
    though. Some disciplines have given themselves over to pre-prints as the primary
    mechanism of distributing early and potentially ground-breaking work. These are
    academic papers, put online prior to formal peer review, which then later might
    be submitted to a formal journal. They serve as a way of putting a stamp of ownership
    on an idea and allowing the community as a whole to collaborate on late-breaking
    work – this obviates the need for the many-month publication cycle of even snappy
    journals. If the promotion structures of these disciplines align with the perceived
    value of pre-prints, it can be a way to focus more on the science than the process.
    For those only interested in the illusion of participating with the rejection
    economy, there are plenty of predatory journals out there that will publish anything
    you want provided you don’t mind contributing a ‘small processing fee’.


    Coupled to all of this, we also have to harken back to an earlier article in which
    Sharon McAlpine was noted to have produced some of the text of a paper with the
    help of generative AI. Journals are increasingly taking a hard line in this, with
    many stating openly that co-authorship of a paper with ChatGPT and other tools
    is considered a violation of their academic standards. It is likely that, given
    the scrutiny this scandal will have brought to all the papers in Blackbriar’s
    bibliography, that at least one of the publications with which she was involved
    may require a messy and embarrassing retraction.


