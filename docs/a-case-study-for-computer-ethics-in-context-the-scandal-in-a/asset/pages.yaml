    \n# STIFLING DISSENT\n\nAnd so we arrive at the finale. It likely could not have\
    \ unfolded in any other way.\n\nWe’re probably unlikely to hear anything directly\
    \ from Blackbriar at this point – aside from his (alleged) social media outburst\
    \ he hasn’t really offered his own perspective anywhere with regard to what has\
    \ happened. An insider, speaking to the Dunglen Chronicle, says that he’s been\
    \ given a generous payoff but also that he has agreed to refrain from pursuing\
    \ future legal claims against the university. He’s also seemingly signed on to\
    \ strict non-compete and non-disparagement clauses.\n\nLet’s begin with the first\
    \ of these. A non-compete clause is one which prohibits an employee from working\
    \ with a competitor for a specific duration after termination of employment. Non-compete\
    \ clauses are comparatively rare in academia. Movement between institutions is\
    \ generally seen as a good thing, allowing for a cross-pollination of perspectives\
    \ and for best practice to be promulgated between different universities. The\
    \ allegiance of an academic is often only somewhat to their employer – many will\
    \ assert a deeper loyalty to their discipline than to their university. Fullwood\
    \ et al. (2013) report when talking of UK academics:\n\n> They have a relatively\
    \ low level of affiliation to their university, perceptions of a high level of\
    \ autonomy, coupled with a high level of affiliation to their discipline."
