- pgno: 111
  md: 'not convince an organisation dealing with the ongoing triage implied by competition
    within complex and unpredictable economic restrictions. In balance of this, most
    countries have laws that mandate core materials and systems should be accessible,
    but enforcing compliance is difficult.


    Thus, we see situations like this where people ‘find a way’ around the issue,
    often by following a tortuous chain of importing and exporting until the right
    data can be presented in the right way with the right level of accessibility.
    Such compensations are invariably fragile – if any part of the compensatory chain
    is altered, the entire thing may fall apart. Software changes on a regular basis
    if it has active developers, and these changes can often be substantial. They
    may include things such as changing entirely the default interaction metaphor;
    dropping support for whole families of tools; or removing the ability to import
    or export particular formats. Sometimes the impact is almost dystopian, such as
    when Adobe required users to pay an additional subscription to use a certain family
    of colours. Each time a compensatory process is broken, it takes time to repair.
    It is rare there is no route to accessibility through these kinds of improvised
    solution spaces, but that too occasionally occurs. Here, we must ask ourselves
    to what extent Duncan can be held responsible for not accessing data hidden behind
    layers of accessibility obstacles.


    # THE UNEQUAL DISTRIBUTION OF DOMESTIC LABOUR


    Sharon McAlpine raises an important point here in this article. It’s an aside,
    but it carries a lot of weight. Everyone was impacted by the pandemic. Global
    disruption was on a scale unprecedented in modern memory. That disruption though
    didn’t fall equally across all demographic categories. Some suffered more than
    others. And in that, sometimes all that is needed for one group to get ahead is
    for another to fall behind.


    Research conducted around workplace patterns during Covid-19 have revealed several
    alarming trends. Demographic sectors reporting the largest challenges to a shift
    in working patterns included working mothers; women in senior management; and
    Black women. When women had younger children – under ten in most cases – the attrition
    rate associated with ‘downshifting’ their career was ten percentage points higher
    than for equivalent men (Bluedorn et al., 2021). More women than men lost their
    jobs (Brodeur et al., 2021) and more women than men were in the kind of ‘essential
    jobs’ that were public facing and thus most at risk'
