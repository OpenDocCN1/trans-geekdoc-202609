    +   \n+   2. Academic staff are not sufficiently trained in issues of counter-terrorism\
    \ to be able to effectively and correctly identify inciting incidents.\n+   \n\
    +   3. Implicit biases derived from political sentiment and media coverage mean\
    \ that PREVENT-based interventions are disproportionately based on profiling.\n\
    \nThe consequences to an individual academic can be significant. The guidance\
