    This is in part what the block funding settlements of the various research funding
    councils aim to do – to offer a certain proportion of funding aimed at supporting
    basic, or blue sky, research without the need to explicitly tie it to concrete
    goals and deliverables. However, as we can see above with our discussion on the
    REF, high-impact research leads to high-impact publications, which leads to high
    REF scores, which leads to greater funding. The constant seduction is to spend
    the money where the results will be most obvious so as to generate greater funds
    for the next research exercise. Research into softer disciplines with less opportunity
    to make headlines or inform popular cultural discourse offers less chance for
    sustainable long-term academic returns, even if the need in the community may
    be greater and the ability of the university to influence society in a modest
    way is more significant. It becomes a balancing act between allowing for exploration
    of issues in the public interest and enhancing the future sustainability of the
    institute in an increasingly uncertain and competitive funding climate. Corporations
    are accountable to their shareholders, but it remains uncertain to whom universities
    should ultimately report.


    # DATA, INFORMATION, KNOWLEDGE, AND WISDOM


    We’ve already spoken about publication pressure, where at high-performing institutions
    an academic may be expected to produce between two and four papers – of suitable
    prestige – every year. Sometimes this gets done by micro-slicing research down
    into its minimum viable publication form – work that would have once been reported
    in a single paper becomes two, three, or four smaller publications. Big ideas
    get watered down to fit the expected tempo of an academic career. Peter Higgs,
    recipient of the Nobel Prize for Science in 2013, has said that he wouldn’t make
    the cut for modern academia. After his first major contribution to the literature
    on physics in 1964, he published fewer than ten subsequent papers. Speaking in
    the Guardian, he said that had he not been nominated for a Nobel prize in 1980,
    he almost certainly would have been sacked from'
