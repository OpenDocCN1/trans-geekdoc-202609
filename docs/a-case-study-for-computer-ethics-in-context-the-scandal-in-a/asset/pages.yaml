    experiences of ordinary people’. Its focus is on education at all levels of the
    system, from primary schools to PhDs. Its two hosts are Shannon Matthews, a former
    senior lecturer in industrial relations at the University of Alba; and Bill Menzies,
    who is headmaster at a private school in the Perthshire region. It has a modest
    following of around 5,000 monthly listeners. For the past few months, they have
    been running a series on people who shifted out of academic jobs and into other
    career paths. This week they are talking to Sharon McAlpine about her experiences
    at the University of Dunglen.


