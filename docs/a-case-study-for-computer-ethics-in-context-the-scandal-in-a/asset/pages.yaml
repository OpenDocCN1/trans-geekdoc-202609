    This is a common story (Altman, 2002; Harris et al., 2009, 2011; Hopewell et al.,
    2010; Smith, 2014) – confined to one particular field, but one that has resonance
    elsewhere. The inclusion of bio-statisticians in peer review has improved the
    situation somewhat (Teixeira-Pinto, 2021), but most fields don’t routinely employ
    this kind of approach.


    Even at the level of examining the extent of fraud and error in cases as significant
    as retraction, there is little agreement. Nath et al. (2006) examined 395 retracted
    articles between 1982 and 2002. Of these, over 61% were retracted because of unintentional
