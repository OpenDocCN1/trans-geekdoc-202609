    In related and unexpected news, ScotOil today announced that an oil-rig scheduled
    for being dismantled next year will be given a reprieve. The Blackbriar Algorithm
    had identified that region of the North Sea as being prime for sustainable exploitation
    of deep, previously inaccessible reserves. ‘We had given up hope, honestly’, said
    a ScotOil insider. ‘And then boom – turned out that the algorithm was right all
    along, we just weren’t picking up the soundings we needed. We adjusted our equipment,
    changed our methodology, and there it was. There’s still half a dozen sites though
    where we’re running speculative rig life extensions that haven’t turned up what
    we were promised. Maybe they’ll end up showing the same results, but I doubt it.
    I guess the system works, but not reliably enough for us to base future plans
    on’.


    The NSAE project has announced it will retire the use of the Blackbriar Algorithm
    until it can be tested further. While their press statement remains hopeful about
    the future, academics affiliated with the project are more downbeat. ‘The whole
    thing only worked, theoretically at least, because of Blackbriar’s research. Now
    we’ve got one end of the process working, the other end of the process


    working, and nothing to link them together. We’ve got phase one and phase three,
    but phase two remains nothing more than a question mark. I can’t see the project
    lasting more than a few months on that basis, and then all the funding will be
    pulled. After all, the only person who really knew how it all fit together was
    Blackbriar. Even if the underlying system is salvageable, I hear Blackbriar can’t
    work on it even if he wanted’.


    These high-profile casualties of the BrokenBriar Affair are only part of the whole
    picture. Many members of staff no longer wish to be associated with a university
    with such prominent and negative international attention. Many have quietly handed
    in their notices and indicated their intent to obtain employment in other institutions.


    ‘We’ve basically been asset stripped’, said our Dunglen insider. ‘Anyone who had
    a reputation worth protecting has done the only thing they really could – they’ve
    moved on to other universities. That way they get a little stain on their CVs
    but nothing that’ll stick forever. If asked about it they can even say they took
    a moral stand – refused to continue an association with a university like ours.
    All we’re left with now are the dross that couldn’t get out. We haven’t lost everyone
    of course – some people are tied to the area as a result of mortgages and such.
    The fire has gone out of them though – a lot now are just counting the days until
    retirement’.'
