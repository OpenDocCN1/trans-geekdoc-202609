  md: 'But what of the real victims in all of this? We are predisposed to find villains
    and heroes in a story because humans are natural story tellers (Kent, 2015), in
    part because stories are unparalleled ways to make sense of a complex world (Bietti
    et al., 2019). What gets missed in such personality-driven narratives though is
    the larger social context in which these characters (real or imagined) function.
    Harold Zinn’s revolutionary ‘People’s History of the United States’ (Zinn, 2015)
    addressed this by centring its view of American history within the structure of
    the working class. It focused on people within the labour movement as they shaped
    our conception of the country’s conception of itself. But even in this, sociological
    studies tend to favour those people who the data most effectively records. Mostly,
    this is the men who record the data (Perez, 2019). The real victims of our scandal
    are likely to be similarly invisible.


    A final summation of impact then has to focus on the staff and students who are
    now going to bear the largest impact of the scandal – those that in future years
    may think of their involvement with the university as a kind of ‘resume stain’
    that they cannot excise from their professional record. They may have had nothing
    to do with the scandal. They may not even know any of the people involved. And
    yet they will bear the brunt of the long-term impact because after the facts are
    lost to time, people will remember ‘Dunglen – there was a big scandal there wasn’t
    there?’. Every job application from this point onwards is likely to include, at
    the very least, some meaningfully raised eyebrows that need to be lowered during
    the interview. The Scandal in Academia is individual malfeasance with collective
    punishment.


    And so the real cost – an almost instantaneous brain drain of the best and brightest.
    They’ll want to leave as soon as they can, even if only to forge the narrative
    that they left for moral reasons. They’re the lucky ones. Talented academics who
    aren’t talented enough for their reputation to outshine their association with
    a tainted university – all trapped in a declining institution. These include parents
    who have to take into account their children’s schools and friends, their mortgages,
    and their familial obligations. They may want to move. They may even have the
    prestige to go somewhere else. They may though not be able to rip their families
    out of an established comfort. And for those that don’t have options – academia
    is an intensely competitive employment context – it’s hard to imagine their morale
    is going to be very high for a long time. The university has been largely beheaded,
    and that carries with it an expectation of administrative turmoil. And then there’s
    the impact on recruitment – Stan Templemore,'
