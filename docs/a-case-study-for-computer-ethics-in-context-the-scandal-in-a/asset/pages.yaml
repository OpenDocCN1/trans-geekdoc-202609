    # PUBLISH AND PERISH


    The fish rots from the head down, as someone probably said. Our newest article
    on the senior university members at Dunglen shows the root of some of the systemic
    issues we have been exploring.


    The phrase ‘publish or perish’ codifies the expectations placed upon academic
    scholars as effectively as anything for which we might hope. Most within academia
    have encountered the phrase, and more still in research-intensive institutions
    have felt its impact. It expresses the common expectation that institutions have
    of their researchers – publish work, often. It is not enough though to simply
    publish, it is necessary to publish work in venues that will lead to citation,
    to name recognition, and to the often ephemerally defined impact (Donovan, 2011)
    The pressures associated with this have increased in modern years. Nothing happens
    in a vacuum. Competition over academic jobs has become ever more fraught because
    universities continue to produce more qualified academics than the system can
    consume (Powell, 2015). This means that the expectations on those seeking permanent
    faculty employment end up being continually revised upwards. Uncertainty and instability
    in employment creates a perversely effective incentive system on those scholars
    least able to challenge it (Shen, 2015) and this in turn creates a powerful ‘free
    market effect’ in the academy. If the academy wants high-performing academics,
    it can select for that through evolutionary pressures.


    On the surface, leaving aside the human impact of often unreasonable expectations,
    this might even seem like a good thing. The result after all is a perpetual raising
    of the bar of scholarship so that the next generation'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'is notably better than the last. Evidence suggests though that this has not
    quite worked in the way that might be hoped. When quantity is incentivised, then
    other things will suffer as a result. When a research infrastructure emphasises
    citation, it will produce a culture of citation that is independent of the merit
    of the work. Previous chapters have discussed some of the ways in which citation
    can be manipulated to create the external appearance of impact without any of
    the concomitant benefit for society. Instead of publishing one truly landmark
    paper, young academics will often aim for the ‘Minimally Publishable Unit’ (Budd
    & Stewart, 2015) – the smallest measurable amount of information that would pass
    the criteria for publication in an appropriate conference or journal. Four smaller
    papers can often appear more valuable on an academic resume than one large paper
    and almost always serve to skew a citation count upwards as a simple consequence
    of cross-referencing. The Scandal in Academia itself is an example of that. It
    is collected here as a unified monograph of over a hundred thousand words, but
    it was initially presented as a series of papers each generating its own ecosystem
    of citation. We have already discussed how easily this can be abused, and then
    went on to abuse it in exactly that way.


    Work may be ‘salami sliced’ so as to appear several times in different publication
    venues – perhaps with a change in emphasis or a change in advertised relevance.
    It’s hard to quantify the extent to which this happens though because the nature
    of different academic fields prevents meaningful analysis. The number of papers
    considered ‘enough’ varies wildly from field to field and university to university.
    While this all may seem harmless, it has an impact on the replicability and reliability
    of scientific results; statistical significance can be skewed if one single study
    contributes multiple data points via several articles.


    However, the pressure to publish has a more corrosive impact on the quality of
    the work. Results are often over-inflated or over-stressed. Statistical analyses
    can be ‘massaged’ to give a value for significance that is appropriate for publication
    – sometimes known as p-hacking (Head et al., 2015). This can also occur when it
    comes to submitting articles of peripheral relevance to a publication. The text
    can be manipulated, or ‘contextualized’, to make the work appear more directly
    suited to the scope of the venue that it can legitimately claim. Negative results
    may be recast as positive findings. None of this is academic fraud of the kind
    discussed previously – merely a small case of ‘refining’ what was discovered until
    someone will pay attention.'
