    # ACTORS ON TRIAL: WORKING THROUGH THE CASE STUDY


    One of the benefits of this case study is that it introduces many topics for discussion
    with a fixed, understandable context. Rather than trying to frame ethics within
    philosophical schools or through abstract thought exercises, we present this as
    a more holistic, embedded approach to the topic of computer ethics.


    The case study can be used as the basis for an active exercise. We have had considerable
    success by emulating a courtroom where each of the actors within the story are
    placed on trial for their role in the affair. This is to ascertain to individual
    satisfaction their perceived level of culpability. This can be carried out over
    a period of several classes. The suggested timescale below assumes that each session
    is of at least two-hour duration. For shorter tutorial sessions, this could be
    broken down into 14 sessions – one per article. Articles which are not core to
    the themes and concepts that one may wish to discuss can be summarised or assigned
    as extra reading.


    # A SESSION-BY-SESSION ANALYSIS


    # Session One – Introduction


    An approach with which the authors have had success is to release the newspaper
    articles on an incremental basis, at different points during the course. Each
    hour of classroom instruction can be broken up into a separate, self-contained
    structure. We recommend at least two hours per session to give room for students
    to fully immerse themselves into the discussion – that would give a session that
    covers two articles in the requisite depth.


    The process for each hour can include the following set elements:


    +   1. Hand out a newspaper article and give students time to read and make notes.

    +   2. Discuss relevant ethical topics which have been introduced via the newspaper
    articles.

    +   3. Get students to research, in groups, some of these topics.'
