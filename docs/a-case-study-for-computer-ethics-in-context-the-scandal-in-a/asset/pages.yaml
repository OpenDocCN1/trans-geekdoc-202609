    in stark isolation from its intended usage – will almost always seem defensive.
    Consider for example Professor Barry Spurr (Davis et al., 2014) who resigned from
    his position as a professor at the University of Sydney after a leak of racist
    and sexist emails. His defence that the emails were a ‘whimsical word game with
    colleagues and friends’ convinced few.


    Whether that is the case with the Blackbriar emails, we will never know. Is the
    hectoring tone of publication pressure a jovial reference to their shared contempt
    for the philosophy of publish or perish? Perhaps ScotOil is something of a joke
    between the participants in the conversation. In that case, ‘I don’t need to remind
    you just how important this collaboration is for the university’ might be a caustically
    arch statement that carries the opposite meaning of what the words say. The use
    of the phrase ‘representative historical data samples’ is in quotation marks.
    Is that an in-joke? Does it refer to a draft institutional policy? We don’t know
    and can’t know, and as such we should be wary of reading too much intent into
    such emails. It’s common for the misquoted to claim ‘out of context’ for statements
    they are forced to defend in the public sphere – that’s not true in this case,
    because the full surrounding context of the remarks is available. Or at least,
    it is potentially available if someone wants to download the torrents referenced.
    However, context can incorporate more than the words that precede and follow the
    indicated statements.


    With our mysterious hacker too, we must appreciate that there may be a hidden
    agenda at work. The nature of an informational leak is that it is asymmetric –
    we cannot know how much information has been leaked, or what impact the order
    in which it is released is intended to have. The very nature of revealing hidden
    information is shrouded in secrecy because we do not know what remains hidden
    at the end of the process. We do not know if this is the full set of information,
    or whether later emails would contradict or perhaps further contextualise the
