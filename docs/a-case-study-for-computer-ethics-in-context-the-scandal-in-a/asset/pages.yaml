- pgno: 119
  md: '# Leaked Minute Lays Bare University Culture




    An exclusive report by Jack McKracken for the Dunglen Chronicle


    A confidential minute has been leaked to the Dunglen Chronicle, revealing the
    culture of research that was being enforced by the Vice-Chancellor, Professor
    Sir David Tumblewood. The minute is from a closed meeting with the ''Professoriate''
    – the group of professors within the university, and is from a meeting that he
    chaired shortly after being instated as principal of the university ten years
    ago. The minute documents the principal''s feelings on research, the importance
    of offering ''value for money'' for funding partners, and how important it is
    that the university finds ways to propel itself up the league table and return
    better results to the Research Output Evaluation Framework Committee (ROEFC).


    League tables have become increasingly important in higher education as an easy
    way to understand way for those outside academia to identify which is the ''best''
    institution. The ROEFC is a government-mandated assessment exercise that evaluates
    the value and impact of research done within each university. League tables are
    a hugely important recruitment tool for universities. A good result in the ROEFC
    can ensure access to larger research grants.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Ten years ago, the University of Dunglen was languishing at the tail end of
    the league tables – as a new university, one established in 1992 as part of the
    expansion of the sector; it struggled to achieve much progress in either metric.
    Placement in the league tables is partially dependent on the quality of research
    output, and when Professor Sir David Tumblewood was appointed, he made it clear
    to the Professoriate what he expected. Quoting from the minute:


    > The principal reminds all present that research is one of the most effective
    levers to build academic credibility. Academic credibility in turn builds research
    capability as new funding streams and partnerships become available. There is
    a positive feedback loop here we must exploit. As the university becomes known
    for the quality of its research, this will increase our standing in the league
    tables which will ensure the best students come to us.


    Since we currently lack the ability to gain significant amounts of new research
    funding, we must ensure that the funding that we do have is fully utilised. Research
    resources such as lab equipment, research students, and postdoctoral fellows are
    valuable and currently underused. We must seek to increase the amount of useful
    value we get


    out of these resources, as that is the easiest way for us to increase the quality
    and quantity of our research outputs in the short term.


    The principal also reminded everyone present that their individual research appointments
    were provided on the basis of sustainability, and that sustainability required
    the procurement of external funds. Those that could not source such funds would
    be at risk of their professorial appointments being downsized.


    The principal put the expected income of a research professor at ‘enough to fund
    all postdocs and postgraduates at full economic costing, plus 30% overhead for
    the university’. The Chronicle contacted Emeritus Professor Joanne Clement, a
    recently retired employee of the university. She spoke on the record about the
    culture of research that the new principal had created.


    > ‘I was a professor in the anthropology of volunteering. I spent my time studying
    the reasons why people volunteered, how they did it, and what they got out of
    it. This had previously been a topic the university valued quite highly as part
    of our civic engagement duties. The previous principal, Professor Elizabeth Burke,
    believed that we had a responsibility to the community embedded in our university
    charter. The more financially successful departments in the university sort of
    subsidised mine – that’s what the overhead is supposed to do, after all. Some
    research is important, but not “sexy” enough that it’ll get enough funding. My
    area was that.’'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'I was told point blank by Tumblewood that if I couldn’t secure enough research
    funding for my small team of four postgrads and two postdocs, that my position
    would be eliminated and I’d either have to accept a demotion to senior lecturer
    or retire. The demotion would have basically removed any of my ability to do research
    as I would go from teaching six hours a week to teaching almost sixteen. Since
    I was only a few years off retirement anyway, I chose the latter. They let me
    keep my professor title, since it didn’t actually cost them anything. That is
    why I am an “Emeritus” professor, but even that’s at the gift of the university
    and subject to the same politics as anything else. There were those in the university,
    Blackbriar amongst them, who said that my research had never really been of the
    necessary standard for the title, and that allowing me to keep it would reduce
    the perceived value of their own titles’.


    The Chronicle understands that 12 research groups within the university have been
    shut over the past ten years as a result of professors being unable to secure
    reliable streams of funding. These include the Centre for Childhood Studies, the
    Institute of Professional Ethics, the Centre for Equality, the Truth in Journalism
    Institute, and the Refugee Study Group. ‘This is all part of a larger push towards
    embedding “business thinking” in academia,’ Clement says. ‘Sometimes a university
    has to do the things that aren’t financially viable because nobody


    else will do them. Work can be important without being valued by those who have
    the money to fund it. The Truth in Journalism Institute is an excellent example
    of that – we’d all like more truth in journalism, no offence, but the only people
    with the money to pay for it have a vested interest in the press being easy to
    control’.


    Clement, in follow-up emails, talked about what she saw as the decay of modern
    academia. ‘Once upon a time our job was to inspire wisdom. Now it’s to produce
    information. We’ve lost sight of what universities are supposed to be – places
    where we actually think about things. Most of the research that universities produce
    is about bibliometrics – publish often, in as high an impact venue as possible,
    to make the numbers go up. In the process, the entire sector has become a “write
    only” industry. People rarely reflect upon the wider context of what’s happening,
    because the only way to survive in academia is to package up information into
    consumable McNuggets. University professors used to have a big idea and spend
    their careers pursuing its implications. Now they load up a shotgun with gimmicky
    papers and fire it at a conference in the hope some get through. We’ve stopped
    being thoughtful, and that’s reflected in what happened at Dunglen’.


    It wasn’t just research centres that closed, Clement explains. Any professor who
    had no formal research centre but wasn’t bringing in the grant money to support
    their'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'own position was made redundant. Similarly with those who had the position
    of Reader, an academic title broadly half-way between senior lecturer and professor
    – if their funding couldn’t be externally supported, their position was eliminated.


    However, Professor Derek Taylor who currently heads the Dunglen Business School
    offers a counter argument. ‘Like it or not, the days of the university ivory tower
    are gone. If you aren’t producing value sufficiently obvious for someone, somewhere
    to pay for it then it can no longer be subsidised. Universities are more accountable
    to the public now than they ever have been. Besides, look at the results that
    have been achieved over the past ten years – what further validation of Sir David’s
    philosophy do you need? Universities are a business. Research is a business. Anyone
    who believes otherwise these days is living in the past’.


    The University of Dunglen has indeed enjoyed something of a golden age in the
    past decade. From an average position of 76 out of 117 universities ten years
    ago, the last league table positions put Dunglen at 32. In 2014, Dunglen had a
    ROEFC profile of 1.3, suggesting only national importance in terms of research
    outputs. For the last exercise, this had increased to 3.1, suggesting the majority
    of output was considered ‘internationally excellent’ with the occasional instance
    of


    ‘world leading’. The consequence of this is that a much larger degree of research
    funding is available to the university, and success rates in competitive bids
    have increased exponentially. This comes both directly from governmental grants
    and from commercial partners attracted to a growing reputation for research quality.
    Researchers from all over the world look to come to the University of Dunglen
    to develop or enhance their research profiles.


    ‘Ten years ago our research was very weak’, says Taylor. ‘Now it’s regarded amongst
    the best in the world. We’ve not only increased the quality of the research we
    do, but we’ve also increased the quantity by an order of magnitude. It may have
    been a painful process to get to here from there, but the university is much stronger,
    much healthier and much more respected internationally as a result. Our students
    benefit from this immensely – student employability is directly linked to institution
    prestige. Everyone wins’.


    Clement again has a contrary opinion. ‘We value what we measure’, she said in
    an email. ‘We do not measure what we value. Any time a quality metric becomes
    a target, it ceases to capture quality. Academia is a game, and while I don’t
    see a way that younger colleagues can stop playing I think the rest should be
    doing what they can to help the sector rediscover its public-facing mission’.'
