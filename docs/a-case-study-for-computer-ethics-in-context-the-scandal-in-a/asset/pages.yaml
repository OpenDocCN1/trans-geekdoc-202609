    of the Case of the Killer Robot that served as the model for this work. He is
    responsible for sparking a lifelong fascination with ethics and professional conduct.
    Adding to this, Michael also offers his thanks to Dr Ishbel Duncan. She undoubtedly
    doesn’t remember him as an unbearably cocky student at Abertay University in the
    late 1990s, but he remembers her and the class in which she introduced this case
    study to him. This work literally would not exist without either of them.


    Michael offers his specific thanks to Mafalda Samuelsson-Gamboa, a wonderful colleague
    and friend. Her enthusiasm is infectious. Her encouragement unceasing. She is
