    the best experience for students and tend to emphasise the rights of an institution
    to control its own reputation online (McNeill, 2012). Social media is increasingly
    seen as a branch of marketing for a university (Constantinides & Zinck Stagno,
    2011; Luo et al., 2013; Rutter et al., 2016) and its staff (Donelan, 2016) and
    thus reputation protection and brand management is often the primary driver for
    these policies. Indeed, when social media activity is deleterious to the brand,
    more established principles such as freedom of academic expression will inevitably
    suffer. As Ringmar (2007) says, ‘The limits to freedom of speech are set by the
    market’. Derek Morrison, of the UK’s Higher Education Authority (HEA), quoted
    in McNeill (2012) says bluntly:


    > The simple rule for everyone should be don’t affect the share price, no matter
    what technology you are using.'
