  img_proc: true
- pgno: 203
  md: 'authority – even one as incidental as is bestowed by a lanyard – it can become
    an issue of over-application. Consider the obvious levels of stress and concern
    expressed throughout the university at the emerging scandal. To fully understand
    the atmosphere, we need to decide to what extent students feel empowered to defend
    the rights they have been given. Especially given those rights are enshrined in
    a matrix of legal protections, policy specifics, and informal conventions around
    the academy. Can we simply assume that students in general even know the broad
    outline of their academic rights?


    Important though here in the case study is that these are anonymous comments and
    thus we have no way as readers to ascertain the validity of the source or the
    extent to which their comments represent outlier or mainstream perspectives within
    the institution. We don’t even know if these comments were provided first hand,
    second hand, or via an observation of social media discussion. Much of the information
    we receive throughout our case study must be assessed in this light. We simply
    have no way of calibrating the extent to which these views represent a consensus
    of the student population. We can say though that there are believable real-world
    parallels for why students may be seeking shelter in anonymity at this time.


    # SYSTEMIC MONITORING OF STUDENTS AND STAFF


    We should return to the issue of student monitoring because in some countries
    it is now a formal part of a university’s legal functioning. In the UK, universities
    are legally designated as ‘specified authorities’ under the Counter-Terrorism
    and Security Act (CTSA) – officially known as PREVENT. They thus must, ‘in the
    exercise of their functions, have due regard to the need to prevent terrorism’⁶.


    What this amounts to is that staff must be furnished with formal training designed
    to help them identify signs of ‘radicalisation’ on the campus. Staff have a duty
    to then report incidences that could be interpreted as leading students down a
    path that would endorse terrorism or other acts of violence. This is now a contractual
    requirement of every academic in the UK, with consequent impact on employment
    if these duties are not carried out. This has, understandably, created an energetic
    debate about the role universities have in policing acts of speech and the extent
    to which universities as an institution can ethically designate topics as being
    off limits for expression. C.f. (Bryan, 2017; Gilmore, 2017; Greer & Bell, 2018;
    Spiller et al., 2018).


    That particular debate is unlikely to reach a conclusion any time soon, and the
    authors of this book will refrain from commenting one'
