- pgno: 171
  md: 'is – at least at this point. The agenda that they harbour is something we need
    to know before we can assess the reliability of the information in its fullest
    light.


    Data security is especially important within professional spheres because we are
    often operating under formal requirements for data management. We may be beholden
    to funding partners to protect commercial interests. We may be obligated by a
    research policy to make available full data sets in their unedited and uncurated
    form. We may have an ethical duty of care to ensure the anonymity of research
    subjects and participants, and we may have a similar ethical duty to ensure the
    protection of their contributions. We will also almost certainly be under a legal
    responsibility to handle data in line with existing legislation – the General
    Data Protection Regulation (GDPR) Data Protection Act and the Freedom of Information
    Act in the UK being obvious examples.


    And yet, we are often pulled in multiple directions – we need to lock down information
    for protection while opening it up for collaboration. Organisational network architectures
    are often insufficient for dealing with the flexibility and variety of data needs
    and professions often resort to the use of external tools – drop boxes, torrents,
    servers outside of institutional firewalls, GitHub repositories, and more. This
    is often as much for necessity as it is for convenience, but every service that
    we use adds another point of weakness for those looking to gain access to information
    over which we would prefer to have control. Often the disclosure of the data would
    present no serious or significant problems – it’s often hard enough to get people
    to pay attention to our work even when we’re screaming about it to everyone we
    can at every opportunity. As the joke goes, ‘You don’t need to worry about anyone
    stealing your ideas. If they’re any good, you’ll need to force them down peoples’
    throats’.


    Occasionally though, even the most innocuous of data points can be compromising
    if wielded by someone intending on doing damage and unconcerned if the damage
    may only be temporary. The initial attack may end up as front-page news, after
    all. The retraction is most likely to be a small notice buried in the back pages
    of a later edition. As such, what we see here in the Scandal in Academia is **perhaps**
    indicative of an ethical lapse from all participants in the management structure.
    It might just as easily be an out of context attack from an aggrieved party with
    their own axe to grind. Whistleblowing is a double-edged sword for everyone involved.'
