- pgno: 107
  md: 'Principal investigators too are under enormous institutional pressures, and
    one shouldn’t underplay how valuable those ‘free’ hours can be to a project. Similarly,
    when it comes to providing full recognition of contribution, the dynamic can lead
    to a kind of Matthew effect (Merton, 1968). Those with the most power and professional
    reputation tend to accumulate even more power and reputation because of their
    ability to shut out or override the concerns of transient researchers. It is not
    uncommon, for example, for the principal investigators on research projects to
    insist that they are afforded first author status on all papers generated as a
    result of their project. This may be required even if their actual contribution
    was minimal. Most journals and academic outlets have strict rules on how authorship
    is to be decided but such policies and procedures must always work on the honour
    system.


    This set of interrelated issues make seeking employment in academia a high-stress
    game of obtaining research funding, rolled into the dominant paradigm of ‘publish
    or perish’, within an environment where demand is vastly oversupplied and long-term
    career stability may be as limited as ‘the next three years’. Even that is a stability
    that may be luxurious for some – the university of the authors often employs adjunct
    faculty on a ‘1+1’ basis, which is to say a single year with the **possibility**
    of a year’s extension.


    Internationally all of this has created an environment where academia is often
    no longer considered a viable and attractive career destination, with a resultant
    brain-drain to the private sector. Some in America for example argue persuasively
    that the position of university professor is no longer considered to be a middle-class
    profession. The American academic system in particular is full of examples of
    adjunct professors living on food stamps and picking up a few classes per semester
    to scratch out a subsistence wage. While it is true that many of these adjuncts
    are working in fields where employment prospects across the board are weaker,
    it doesn’t change the fact that those considered expert enough to teach and research
    are not always considered worthy enough to offer legitimate career stability.
    The effect is to create an ongoing, inexorable attrition where your willingness
    to play your hand against a stacked deck is as important as your ability to do
    the job itself. There is little economic incentive for a principal investigator,
    or even an institution, to address this head-on. The cost associated with exacerbating
    a condition of long-term burn-out won’t be felt within the limited constraints
    of a single research contract. By the time the worst of the mental toll will be
    felt, it’s highly likely it’ll be someone else’s problem entirely.'
