- pgno: 92
  md: '# MENTAL BIASES


    In our case study though we are not talking about how corporate sponsorship may
    violate the principles of research, but instead about how research may undermine
    the work of industry. Here we have an experimental algorithm which has been incorporated
    into a large-scale industrial project, and it’s not giving the results people
    are hoping for. A lot is riding on the success of the project, and that success
    is highly tied up in the question of whether or not the Blackbriar Algorithm works
    at all.


    It’s easy for an external party to look at some situations that occur and think
    ‘well, the real solution is to not get into that situation in the first place’.
    This is superficially compelling, but ignores the vast array of factors that result
    in bad decisions being made.


    In teaching computer ethics, the first task we have as educators is to disabuse
    students of the idea that it’s all ‘just common sense’ (Heron & Belford, 2015).
    We must counter the idea that we as individuals are immune to the psychological
    and social factors that influence others. In fact, the belief that we are somehow
    calmer and more rational than others is in itself a demonstration of the cognitive
    biases under which our minds labour. This particular bias is called illusory superiority
    (Hoorens, 1995). Most of us believe, regardless of the illogicality of the statistical
    implication – that we are above average. Most of us tend to believe that what
    impacts on others will not impact on us quite so intensely.


    The human mind is a remarkable tool, honed by evolution to a fine point. However,
    it is also a product of our historical context, and as such it contains not only
    the cognitive architecture that we need for human society as it is now, but as
    it was hundreds of thousands of years ago. The human subconscious is also a tremendous
    filter, protecting our conscious mind from the vast amount of information our
    senses pull in on a second-by-second basis. As part of that apparatus, there is
    a need for our mind to protect against cognitive overload. Often, this is done
    through cognitive shortcuts that allow us to quickly arrive at a judgement that
    is ‘good enough’ for most purposes. These lead to cognitive biases which systematically
    influence the way in which we think about the world. The collection of these identified
    biases is considerable and many of them are relevant to the issue of why people
    make bad decisions.


    Perhaps most germane to this specific example is the Sunk Cost effect, or what
    is often known as the Concorde Fallacy (Arkes & Blumer, 1985).'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'When Concorde was being built, the British and French governments continued
    development long beyond the point where there was a reasonable expectation of
    economic return on the project (Arkes & Ayton, 1999). So much time, effort, and
    political capital had been invested in the project that it was inconceivable to
    simply stop the work. However, economic theory argues that when deciding on a
    future investment, sunk costs should be entirely discounted. They have been spent
    regardless of the success or failure of the project and thus should not feature
    into future decision-making. This is a difficult lesson to internalise for most
    people, and this difficulty leads to what is colloquially known as ‘throwing good
    money after bad’. After investing so much money into Blackbriar and his work,
    it may have been the case that his funding partners simply decided they had invested
    too much already to abandon the project.


    This though is predicated on an assumed understanding on the part of the research
    partners – it presumes that they understood the algorithm as it was presented
    was a bad investment. However, we have other biases that stop us being able to
    make that kind of rational assessment when it comes to complex sets of information.
    Consider for example the confirmation bias – the cognitive shortcut that leads
    us to preferentially seek out (or consciously notice) information that supports
    our existing beliefs (Keates & Clarkson, 2003). If we believe that the algorithm
    works, we’re more likely to ‘weight’ evidence that it works in our mind – even
    if that evidence is not as strong or as common as evidence that it doesn’t. Likewise,
    the hindsight bias (Arkes et al., 1981) is relevant. This leads us to a kind of
    mental revisionism in which we believe we had assumed an event was going to happen
    the way it did all along even if we had no way of predicting. The hindsight bias
    can lead to memory distortions in which we not only believed we were right but
    remembered actively predicting that the result would occur.


    There are a lot of funding partners in the NSAE, so we also have to consider socially
    contextual cognitive biases. Consider the bandwagon effect – that the more we
    encounter people who believe a thing, the more likely we are to believe that thing
    ourselves regardless of the underlying evidence. That in turn leads to a sampling
    bias where we are mistakenly led to believe that those around us are representative
    of a group at large, even though they may be an unusually skewed cluster. This
    then can lead to groupthink (Janis, 2008), in which presumed consensus acts as
    a barrier to exploration of risks, pitfalls, and counter arguments. Or consider
    the Status Quo bias (Kahneman et al., 1991), where we are more likely to accept
    a situation as it is presented rather than attempt to change it.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The latter bias has been manipulated to startling effect in ‘opt-out’ versus
    ‘opt-in’ initiatives. If participants are asked to opt in to an organ donor register,
    donor rates hover about 15%. If people are asked to opt out, donor rates rise
    to around 80% (Davidai et al., 2012; Johnson & Goldstein, 2003). Most people simply
    will not tick the ‘opt-out’ box, choosing instead to accept the default with which
    they were presented. The power of this effect has been noticed; you may have seen
    yourself many websites requiring that you opt out of receiving their email notifications
    upon registration, as opposed to opting in.


    Even leaving aside these cognitive biases, we can’t discount the simple placement
    or emphasis of information and the role it plays in prompting a decision. Consider
    for example the two related concepts of anchoring (Tversky & Kahneman, 1992) and
    framing (Tversky & Kahneman, 1981). Anchoring refers to the technique of setting
    early expectations in a comparison, and framing refers to the selective placement
    or information as it is presented. Presenting relatively large default sums anchors
    our value judgement – when we decide to pay a lesser sum, it is a larger lesser
    sum than it would have been if there were no anchoring offered at all. In this
    way, we are skewed towards paying more than we otherwise may have.


    Framing works by offering multiple options at once, with one being contextually
    much better than the others. Ariely (2008) discusses one such example of this
    in relation to the subscription options for the Economist:


    > > I read these offers one at a time. The first offer – the Internet subscription
    for $59 seemed reasonable. The second option – the $125 print subscription seemed
    a bit expensive, but still reasonable.

    > >

    > > But then I read the third option: a print **and** Internet subscription for
    $125. I read it twice before my eye ran back to the previous options. Who would
    want to buy the print option alone, I wondered, when both the Internet and the
    print subscriptions were offered for the same price? Now, the print-only option
    may have been a typographical error, but I suspect that the clever people at the
    Economist’s London offices (and they are clever-and quite mischievous in a British
    sort of way) were actually manipulating me. I am pretty certain that they wanted
    me to skip the Internet-only option (which they assumed would be my choice, since
    I was reading the advertisement on the Web) and jump to the more expensive option:
    Internet and print.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'In this case, the option is framed in such a way as to skew the choices people
    make – they’re more likely to go for digital + print even if they just want a
    digital copy purely because that deal seems like it’s so much better than the
    print option alone. With the print+digital option, it appears as if digital access
    is a free bonus of having purchased print access. Such techniques are used often
    in retail to skew people towards a ‘mid-range’ option in circumstances where they
    may have otherwise purchased a cheap option. Often, this kind of ‘nudging’ is
    entirely incidental, but it can be used to subtly, and powerfully, change the
    way in which our minds analyse the information in front of us. It is easy to conceive
    of a meeting in which an academic pitches four projects – one extremely expensive,
    one very expensive, one cheap, and one that is a more middling cost. If each was
    presented individually, the cost may have been prohibitive for all but the cheapest
    option. If presented collectively, or framed, the moderate option becomes more
    attractive because it is seen in comparison to two expensive options, rather than
    assessed on its own merits.


    There are many more of these biases that are relevant to the issue of sensible
    decision-making – there’s the Gambler’s Fallacy (Tversky & Kahneman, 1971) or
    the IKEA effect (Norton et al., 2012) or the Optimism Bias (Stossel & Stell, 2011)
    or the Experimenter’s Bias (Sackett, 1979) and many more than we can hope to even
    touch on in this short section. However, the key point here is not that any of
    these biases were in play, but that they could very easily have been in play.
    Any one of them would have impacted on cool, rational decision-making – often
    without the people involved having any idea that there was anything wrong with
    their thought processes. We often assume that our decisions are the result of
    the calm, sober application of rational analysis. To assume such is to ignore
    the gaping holes in our minds through which conscious or unconscious manipulation
    can enter our thinking. It is easy to judge based on hindsight but in order to
    understand what may happen in the future, we need to be mindful of the limitations
    of our mental architecture. We need to be aware that, if placed in a situation
    directly, we are likely to be subject to the same powerful cognitive forces as
    others.




    One thing that is mentioned by the anonymous informant in this article is the
    supply-chain implications associated with global events. At the time of writing,
    in 2023, we are still reeling as a world economy. We’re seeing record levels of
    inflation across the board but especially in regard to'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'electricity and food prices. It was even worse in 2022, with July of that year
    representing the highest US inflation since 1981 – a 40-year high. The situation
    was similar in the European Union, the UK, and in Russia. Double-digit inflation
    increases – within robust economies which typically viewed 2% inflation as the
    acceptable target – created an immediate and intense cost of living crisis. Countries
    lacking a robust and diversified economy that could absorb shocks suffered even
    worse. The causes were multivariate – our informant in the article refers to the
    pandemic and the war in Ukraine as contributory factors, but there are many others.
    The United Nations in 2022 published an analysis of the data, suggesting that
    the real-world impact was to push over 50 million additional people into ‘extreme
    poverty’ which is defined as having $1.90 a day or less on which to live. Over
    20 million more found themselves with $3.20 or less to cover their needs. However,
    these macroeconomic consequences seem to be at the wrong level to concern those
    working with the Blackbriar Algorithm, surely?


    It is certainly true that nobody here is at risk of ending up in extreme poverty,
    but we need to take others into account. One of the biggest impact factors on
    global electricity prices has been volatility in the oil market. In 2019, Taghizadeh-Hesary
    et al. argued that around 64% of variance in food prices over the period 2000
    to 2016 could be explained by a change in oil prices. Sanctions between the West
    and Moscow in 2022 have created the perfect conditions for oil price volatility
    (Appiah-Otoo, 2023), and given the scale of the expectations we’re dealing with
    in our case study (billions of dollars) it seems likely that this uncertainty
    would only be exacerbated by our scandal as it continues to grow in the attention
    it receives. It may seem a tenuous link, but we can see a clear path of rhetoric
    that takes us from ‘questionable data used in a Scottish university research project’
    to ‘people dying of starvation’. The common adage ‘Think globally, act locally’
    is a double-edged sword. Sometimes the consequences of decisions are far beyond
    our reasonable expectations.


    Realistically, we’d also be likely to see the effect of our scandal manifest in
    complications with the Just-In-Time (JIT) economy that crashed so spectacularly
    during the Coronavirus pandemic. A moderate rise in oil prices might be enough
    to put a trucking firm out of business, or for the contributory effect on global
    inflation to require an agri-farm to shed employees and slash production forecasts.
    Modern technological logistics tools – many of them based on software and predictive
    artificial intelligence – have revolutionised supply chains across the world.
    No longer does'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'a factory need to maintain an expensive warehouse full of stockpiled parts.
    Local inventory needs can be minimised by holding only what is immediately required
    for short-term production. The expectation within these systems is that other
    parts of the supply chain can ensure reliable, regular, and predictable delivery
    when that local stock is depleted. By building long-term contracts with trustworthy
    suppliers – those with a history of delivering on-time and on-budget – efficiencies
    in the supply chain can boost profitability. When it works well, it can be revolutionary.


    However, it is a fragile and risky proposition because the longer the JIT chain
    is, the more vulnerable it is to shock. You may have a store selling tables, which
    relies on a factory that assembles those tables, which in turn relies on a workshop
    that creates the parts of the table, who themselves rely on a shipping company
    to transport raw wood, who relies on a logistics firm in another country to get
    the wood to a port, who in turn relies on a logging camp. That logging camp itself
    may be relying on a JIT chain for tools and people. All it takes is a few unexpected
    accidents with a chainsaw for you, the person who just spent thousands of pounds
    on a prestige table of Norwegian spruce, to be told the item you ordered won’t
    be with you for a couple of additional months. Brexit has been convincingly linked
    to many of the inflationary pressures within the UK, as additional complications
    in the supply chain have knock-on effects. That’s fair, but realistically all
    it takes is a snap of cold weather in a foreign country for your local supermarket
    to find it difficult to source the fresh fruit and vegetables you may be expecting.
    And even for those items available the price can shoot up as supply and demand
    issues start to take hold. Supermarkets can only ever hold a small amount of fresh
    produce at any time, and when supermarket shelves run bare human nature starts
    to take over. Despite repeated calls for consumer calm from supermarkets, panic
    over the availability of common items resulted in global stockpiling in the early
    days of the pandemic (Micalizzi et al., 2021). Largely this was unnecessary –
    nobody needed to buy six-month worth of toilet paper regardless of how much supply-chain
    volatility might have impacted on their diet. Supermarkets can usually source
    around 60-day worth of non-perishable items even in the face of supply-chain problems.
    A quote often attributed to Vladimir Lenin is that ‘Any society is only three
    meals away from chaos’, and the **perception** of scarcity can have bigger societal
    impact than the scarcity itself. It can create a self-fulfilling prophecy – we
    believe these goods are scarce. We will buy them in unanticipated bulk. The supply
    chains did not anticipate this surge in demand and failed to resupply in time
    or in bulk.'
