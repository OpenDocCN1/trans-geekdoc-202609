    the university talk about him. His work is also obviously of considerable financial
    value if the anonymous insider at the ScotOil company is to be believed.


    Within the Scottish education system, as with the system in other parts of the
    world, the fact that John Blackbriar is a professor is significant. As a title,
    it carries more weight than it does elsewhere because it represents the highest
    academic rank that one can achieve. It generally goes from Lecturer, to Senior
    Lecturer, to Reader, to Professor. Only the latter are permitted as a general
    rule to use the Professor honorific. Several UK universities though are now moving
    to the American model of assistant professor, associate professor, and full professor.
    While growing in popularity, these remain comparatively rare at the time of writing
    and so we can generally work on the assumption that this is the traditional Scottish
    titling system. John Blackbriar is a professor, which implies he has a high standing
