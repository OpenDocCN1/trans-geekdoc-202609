- pgno: 293
  md: 'to be claiming in his discussions with senior management. The spanner in that
    process though is Blackbriar himself.


    In 1999, the Mars Climate Observer smashed into the surface of Mars. It had cost
    $125M to build and send it, and it took ten months for its trajectory to bring
    into abrupt contact with the red planet. The failure of the project triggered
    an internal inquiry. It turned out the problem was pretty simple – not a matter
    of the complexities of orbital dynamics, but rather of non-discussed assumption.
    Different parts of the intricate system that controlled the spacecraft were developed
    by different teams. Those at the Jet Propulsion Lab were using the metric system
    for calculations. Those at Lockheed Martin worked in imperial units (Lamb, 2022).
    Each part of the system worked perfectly as a self-contained unit. Both teams
    did robust work on ensuring that was the case. In software engineering we refer
    to that as ‘unit testing’ – checking the systems expected outputs against inputs
    to make sure that actual results match what we want to see. Checking to see if
    independent units work together is known as ‘integration testing’, and if that
    had been done properly the mismatch would have been identified before it resulted
    in an embarrassing PR disaster for NASA. That though would have robbed decades
    worth of educators of a truly wonderful example in the importance of robust quality
    assurance regimes.


    The point of that digression is this – Blackbriar is identified as the only one
    who could realistically handle integration of the systems sitting at each end
    of the larger process driving the NSAE Project. That’s what his algorithm was
    actually for – acting as middleware that used soundings from sensors to direct
    drones to areas of interest. The drones likely work correctly. The soundings –
    with appropriate sanitisation – likely work correctly. Without a correctly working
    algorithm from Blackbriar, there’s no way for one to influence the other. Blackbriar
    leaving Dunglen under a non-compete clause means that he won’t be able to go to
    ScotOil or any of the other partners. There’s no cushy consultancy gig awaiting
    him – the algorithm needs Blackbriar’s understanding of the big picture, and Blackbriar
    is legally prevented from applying his wisdom to the situation.


    The university, having done everything it can to distance itself from Blackbriar,
    has one lingering big threat on the horizon. What if they’re **wrong**?


    What if, in the end, Blackbriar actually got the system to work correctly and
    senior managers ended up cutting the University of Dunglen out of a share of billions
    in revenue? There is a certain kind of managerial'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'mindset that thinks ‘if we can’t have it, nobody can have it’. The risk of
    reputational damage – of being seen as someone that cannot be trusted to make
    sound judgements – is of great importance to the senior managers at Dunglen as
    they navigate their exit from this already compromising situation.


    We can say here that the whole project’s management has to be called into question
    because of the centrality of Blackbriar to the success of the endeavour. Many
    of the issues we have seen are down to him occupying a critical role that no one
    else could fill. In formal management theory, this is sometimes called the ‘key
    person risk’, but software developers have a different term for it – bus (or truck)
    factor (Ferreira et al., 2016).


    Specifically, ‘how many people need to be hit by a bus before the project cannot
    be advanced’. For a long time, the bus factor associated with the Linux operating
    system was one – if Linus Torvalds was hit by a bus, the project couldn’t continue.
    When identifying a low bus factor, it is incumbent on managers to raise it to
    an acceptable value. That value differs from project to project based on logistical
    and economic considerations. Essentially though no one in a well-managed project
    should be irreplaceable. Nobody should be so core that they become ‘the standard
    you walk past’. The bus factor associated with Blackbriar, and the financial implications
    associated with any bus that careened towards him, argues that this situation
    should never have arisen in the first place. Someone should have noticed that
    he was irreplaceable and set in place measures for contingency planning. Blackbriar
    likely wouldn’t have been happy, but is that a high enough cost when a whole industry
    is compromised as a result of placating his ego?


    # THE GOLDEN PARACHUTE


    So, we reach the final stage of the scandal – the laying of blame. One thing we
    hope that these extended commentaries have done is show that blame is a difficult
    thing to fairly apportion. Everyone has a responsibility for what happened to
    a greater or lesser extent. Even in what seem like clear-cut ethical violations
    (Lazenby voting on research proposals that benefit his institution as an example
    of that) are unlikely to be so simple when considered at the time. And in those
    circumstances where the ethical path is followed, it doesn’t mean malfeasance
    can’t sneak in. A word from the right person in the right ear can distort proceedings
    whether you recuse yourself or not. We can never peer into the heads of our protagonists
    to assess their intention.'
