- pgno: 205
  md: 'One might note that these criteria apply to a vast majority of undergraduate
    students at one point or another. Universities were once lauded as one of the
    places where students do become radicalised to positive change – the genesis or
    popularisation of a lot of popular protest movements is historically within the
    university campus or through affiliated youth groups (Heineman, 1992; Milkman,
    2017). If we are not educating students to change their viewpoints in the face
    of evidence, we are failing in our basic duty as educators. The broad and unspecific
    nature of this training just as easily covers being a radical proponent for free
    tuition as it does someone courting with the principles of domestic terrorism.
    It was explained later that this framing was to ensure that the guidance didn’t
    racially profile or religiously discriminate. The cost of that vagueness is that
    every student is a potential radical and university academics are thus required
    to report on their behaviour where it is deemed to transgress some invisible and
    ill-defined threshold of extremity. Training experienced by the authors of this
    book was anecdotal and purposefully vague, which made it especially chilling in
    its implication. Students that feel overly monitored may be justified in their
    disquiet at this kind of legislation and how it has worked its way into the academy.


    At the same time, academics do have a duty of care and were similar guidance to
    be issued on identifying issues of social isolation, risks of suicide, or harassment
    it would be unconvincing to argue that this presents a risk to freedom of expression.
    It is a difficult argument to make that universities alone should be exempt from
    counter-terrorism policy by virtue of their largely self-proclaimed status as
    havens of free inquiry. However, legitimate arguments exist about where the balance
    lies between coherently addressing issues of violent radicalisation and permitting
    the ‘expression of ideas without risk of official interference or professional
    disadvantage’.


    It would lack nuance for this book to argue that authority and constraints on
    freedom of expression come only from top to bottom. While PREVENT and related
    legislation does apply to staff and the monitoring of student opinions, there
    is a growing trend of ‘no-platforming’ taking hold in academic discourse. Staff
    inviting external speakers on a topic may have no PREVENT concerns. Student advocacy
    though has grown increasingly strident in recent years regarding the practice
    of denying controversial voices the right to speak. The idea was expressed by
    the National Union of Students (NUS) thusly:


    > > The policy prevents individuals or groups known to hold racist or fascist
    views from speaking at NUS events. It also ensures that'
