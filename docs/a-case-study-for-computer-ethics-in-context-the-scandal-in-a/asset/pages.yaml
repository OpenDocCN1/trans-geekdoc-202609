  md: 'punishment. The rules and prohibitions embedded in religions – at least in
    modern society – are examples of ethical codes. We may not necessarily agree with
    them going by our gut feeling on what is right or wrong, but we all agree to taking
    on a common position so that we have a way of deciding on the ‘right’ course of
    action. Here again the example of those suffering dissonance as a result of incompatible
    actions and religious codes comes into relevance. Sometimes the codes to which
    we agree to adhere overlap with our personal opinions, and that’s great. Sometimes
    they come into conflict, and how we resolve them is an important part of what
    defines us as people. Sometimes there are real consequences to violating a code
    of ethics. Sometimes there aren’t. In all cases, we weigh up the right and wrong,
    balance it on our sense of morality, and decide what has to be done.


    In our case study, we’re mostly not talking about morality, laws, or religions.
    What we’re talking about are smaller codes of professional ethics. These are codes
    to which we agree to obey upon accepting a particular role in society. Many professions
    have some kind of collegiate body, and this collegiate body will put together
    a code of conduct for all members who choose to join. Sometimes membership of
    this body is a prerequisite to practising in the field. The Law Society of Scotland
    for example regulates solicitors in Scotland, and this professional body sets
    exams that must be passed for membership to be obtained. Passing the exams and
    obeying the ethical code of the society are both mandatory. If a solicitor is
    ‘struck off’ the register of this society, they cannot formally practise, and
    often may not describe themselves as solicitors any more. Section 25A of the Solicitors
    (Scotland) Act 1980 enshrines this in law. While this is a very specific example,
    you’ll find parallels all over the world applied to all kinds of professions.
    Violations of the ethical codes of professional, regulatory bodies like these
    can thus have serious consequences.


    In comparison, there is no requirement that ‘computer professionals’ be regulated
    by any of the professional societies for the industry. There is no requirement
    for accreditation by the British Computing Society (BCS) or the Association of
    Computer Machinery (ACM) or the Institute of Electrical and Electronics Engineers
    (IEEE) before someone can write code, admin a system, or put up a website. Membership
    of bodies such as this is still dependent on adhering to the codes and bylaws
    of the organisation, but practising as a professional in the area is not predicated
    on membership. These organisations, lacking the legal authority to regulate, instead
    offer additional services to their members – access to specialised resources,
    career opportunities, or the ability to describe themselves as'
