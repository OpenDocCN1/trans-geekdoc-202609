  md: 'much explanation about its context that it has lost all its power as an aid
    to understanding. Computer legislation suffers a similar context drift with regard
    to computer crime.


    Before we get too deep into this, it is perhaps appropriate at this point to outline
    some important disclaimers.


    First of all, this isn’t a text on law or legal interpretation. As such, an analysis
    of applicable legal texts to this case study is outside the scope of the work
    and the domain of author expertise. Secondly, the case study is explicitly set
    in the UK and as such it is UK legislation that is pertinent – while many countries
    have comparable laws, they all differ in important respects. And thirdly, nobody
    should take such analysis as we provide as anything approximating ‘legal advice’.
    To paraphrase the vernacular of the internet, WANAL (We Am Not A Lawyer).


    We all though face the complications of legality in what we do, and so we still
    need to ground ourselves in at least some interpretation.


    The Computer Misuse Act of 1990 outlines three offences with regard to computer
    access. The first is that it restricts ‘unauthorized access to computer material’.
    The second is that it specifically outlines ‘unauthorized access with intent to
    commit or facilitate commission of further offences’. It has a third part which
    looks at unauthorised access with the intention of doing criminal damage to a
    computer system itself.


    The act has been amended, most recently in 2015, to include two additional offences.
    These cover ‘unauthorized acts causing, of creating risk of, serious damage’ and
    ‘making, supplying or obtaining articles for use in offences under all four sections
    above’.


    What then did James Duncan do within our case study that could be considered a
    violation of the act?


    The first thing hinges on ‘unauthorized access’, and here things become murky.
    Most Acceptable Usage Policies (AUP) tend to include clauses on not giving people
    your password, but as we discussed previously it’s hard to consider the way an
    AUP is worded to be an exemplar in eliciting ‘informed consent’. ‘I knew a lot
    of the passwords and passkeys through the system’, James said. His colleagues
    would come to him when they needed help. The extent to which he was authorised
    to use their accounts, and to what extent they were authorised to permit him access,
    is an important factor here. In many cases, he didn’t hack their passwords. He
    used passwords he had been given. That means that he is perhaps safe under section
    5 of the act – no keyloggers, rootkits, or brute-force password crackers seem
    to'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'have been employed. And the extent to which he caused ‘serious damage’ in the
    sense we’d understand it is questionable.


    It is clear though that this isn’t the full story – he notes that humans are always
    the weakest part of any security system, and our human fallibility makes gaining
    genuinely unauthorised access easier. There’s a whole fascinating discipline known
    as ‘social engineering’ which is what you might get if you crossbred hacking and
    con-artistry. James seems at least conversant with some of its basic principles.
    The important part of the act here is that it makes no distinction about how unauthorised
    access was obtained. Section one of the act certainly seems to apply, by James’
    own admission.


    Section two of the act is again, murky. What are the offences that James was committing?
    To address this, we need to take a little diversion into the World of Wikileaks
    and what it was James actually did.


    We might be charitable here and ascribe to James a noble motive – he was seeking
    to draw attention to the real-world complexity behind the public reporting of
    John Blackbriar. In other words, we might see him as a kind of whistleblower –
    someone who provides information on people or organisations that are regarded
    as engaging in immoral or illegal activity. There are legal protections available
    to someone who does this, although they vary in strength, applicability, and intensity.
    Within the United Kingdom – the legal jurisdiction in which we are most interested
    here – there exists the Public Interest Disclosure Act 1998 which grants professional
    protection to those that break confidentiality clauses to inform on dubious behaviour
    of which they are aware. A whistleblower is, at least in theory, protected from
    being treated unfairly or losing their job because of their activities.


    However, whistleblowing legislation rarely includes explicit protections from
    punishment if other laws are broken in the process of obtaining or disclosing
    information. The expectation is very much that people should work within the systems
    framework that the legal system has constructed, even if that framework prevents
    gaining access to the information needed to properly disclose important facts.
    In short, James may have done the right thing (or at least, some could argue that
    he did) but in the eyes of the law that doesn’t justify or exonerate his activities.


    It’s in this capacity that we can understand the situation related to other high-profile
    whistleblowers. Edward Snowden was an intelligence consultant who, in 2013, leaked
    information from the United States’ National Security Agency (NSA). This information
    was highly classified, identifying American involvement in a wide range of questionable
    activities. These included membership in the Five Eyes Intelligence Alliance'
  merge: -1
  img_proc: true
- pgno: 248
  md: '(Walsh & Miller, 2016); an email scanning system called PRISM (Berghel, 2013);
    the indexing of massive amounts of metadata as part of the Boundless Informant
    programme (Masco, 2017); hacking of China (Landau, 2013); and much more. Snowden
    also revealed highly embarrassing information regarding the role of the UK’s Government
    Communication Headquarters (GCHQ) in surveilling the diplomats of ‘friendly’ governments.
    The leaks also provided information as to the extent to which GCHQ had hacked
    into international internet infrastructure. It is safe to say that this leak was
    profoundly embarrassing to a number of intelligence organisations across the world.
    However, in the gathering and releasing of this information Snowden broke the
    law – classified material is not the same thing as confidential material. The
    charge levied against him was breaking the Espionage Act (Scheuerman, 2014), and
    in response he fled first to Hong Kong and then to Russia where, as of the time
    of writing, he remains as a full citizen.


    There is little doubt that Snowden revealed many illegal and unconstitutional
    activities, but in breaking the law he lost any whistleblower protection that
    may have applied. Should he return home to the United States, he would undoubtedly
    have to face prosecution for his crimes. The ends, the legal system would suggest,
    do not justify the means. That said, some have argued that the Espionage Act needs
    amending to enshrine protections for people like Snowden (Barnes, 2014; Zeman,
    2015). This is a common thread as we have seen – that legislation cannot keep
    pace with how technology changes. To quote ourselves for a moment (Heron, 2016):


    > Twenty years ago, Manning would have had to remove confidential State department
    memos with a convoy of wheelbarrows. Now, gigabytes of data can be transferred
    using a thumb drive no bigger than a finger.


    Thus, we see here the tensions for whistleblowers who may see themselves to be
    doing good while operating within systems designed to make revelation extremely
    dangerous. The site Wikileaks, for example, is a prominent repository of classified
    and confidential information. Its public profile is often contradictory. It sometimes
    positions itself as merely an interface between journalists and open-access data.
    Other times it presents itself as a ‘public intelligence agency’. Nonetheless,
    it has had a prominent role in serving as a shield for those that wish to release
    classified information in relative safety. Data leaks it has been involved with
    include media footage showing the murder of civilians in Baghdad airstrikes (Allan
    &'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Anden-Papadopoulos, 2010); the Afghanistan War Logs (O’Loughlin et al., 2010);
    and millions of classified diplomatic cables (Lynch, 2013). During the 2016 presidential
    campaign, they also revealed leaked documents from the Hilary Clinton campaign
    – the latter incident being notable for how tightly woven it is into the allegations
    of collusion between Donald Trump and the Russian state intelligence apparatus
    (Ioffe, 2017). Chelsea Manning was a source of important documents for WikiLeaks
    in 2010 and was imprisoned for seven years (after a presidential commutation of
    the earlier 35-year imprisonment) in Fort Leavenworth. Snowden escaped the US
    legal system. Manning fell foul of it. Julian Assange, the controversial founder
    of WikiLeaks, spent seven years under the diplomatic protection of the Ecuadorian
    embassy in London before his asylum was withdrawn in 2019. Since then, and as
    of the time of writing, he has been confined in HM Prison Belmarsh, a maximum
    security prison in London, awaiting extradition to the United States.


    That these disclosures served the public good is debated – WikiLeaks in particular
    has long been criticised for improper disclosure (Benkler, 2011; Hindman & Thomas,
    2014) and endangerment (Brevini, 2017). The inevitable political context in which
    the releases must exist is also an ever-present talking point, with approval for
    these acts of whistleblowing often breaking along ideological lines. What is clear
    though is that illegally releasing information ‘in the public interest’ is no
    protection for whistleblowers, and whatever motives we might ascribe to James
    Duncan he’s going to find them scant protection against the ire of the judiciary.
    Under section 2 of the Computer Misuse Act, he’s probably got a lot to worry about.


    As to the third section of the act – doing criminal damage – well, in trying to
    cover his tracks he might just have made things worse. Removing mentions to himself
    in routine system logs certainly would count as an ‘unauthorized modification’
    and realistically may fall into the category of enabling the committing of other
    offences. Covering ones trail, it could reasonably be argued, is a necessary prelude
    to further intrusion.


    In other words, James probably needs to engage the services of a lawyer who knows
    their way around this legislation. And he probably needs to do it soon.


    Critics of the Computer Misuse Act argue that it is too broad and doesn’t properly
    differentiate between those that hack for noble reasons (known as White Hat hackers
    in the parlance of information security) and those that hack for malicious reasons
    (the Black Hat hackers). The very framing here as ‘unauthorized access’ was put
    in place to make an attempt to future-proof'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'the legislation. Unfortunately, its vagueness has meant that there have been
    few individuals that have been successfully prosecuted or jailed under the law
    (Montasari et al., 2016). A generation of children have grown up knowing that
    leaving their phones unattended while they are logged into social media is a recipe
    for having their accounts vandalised by their friends. If only those friends realised
    that they were engaging in an activity that, under law, can carry with it a 12-month
    custodial sentence under section 1 of the act. This from a piece of legislation
    that can’t even address many modern cyber morbidities within its framing (Worthy
    & Fanning, 2007). For some, this legislation is most distinctive for how little
    it does to create a prosecutorial framework for the most important technologies
    that govern our lives.


    # INFORMED USER CONSENT


    What is notable here is perhaps not so much the crime itself, but the investigation
    around the crime. James fell victim to his own hubris perhaps, believing his computer
    skills rendered him largely invulnerable to capture. However, we often underestimate
    how much data we are each producing on a day-by-day basis… and how little knowledge
    we have about what we generate. Current estimates suggest that human society creates
    around 120 zettabytes of data a day. That number is made up from a lot of different
    sources. That’s 500 hours of new YouTube footage **every minute**. It’s 183,000
    blog posts per hour. Ten billion Facebook status updates in a day. In 2023, that’s
    1.7 megabytes of data, per person, **per second**. To go along with all our intentional
    and considered contributions, most of what we produce is what we call ‘metadata’
    – or data that helps us make sense of other data.


    Let’s look at a pertinent example of that. When we take a digital photograph,
    our phones and cameras try to be helpful. They encode a lot of additional data
    about the image to help software packages make sense of it. Image metadata includes
    information on aperture. It contains info on dots per inch. It contains shutter
    speeds and focal depth. It contains data format information and sizing. That’s
    all important and necessary for when you start working with your photos in Lightroom.
    The metadata though contains other things, such as the GPS co-ordinates of where
    you were when you took the photo. The set of data captured is documented by a
    standard known as EXIF (Exchangeable Image File Format), and it can be comprehensive.
    If you post a photo without clearing out your EXIF data, there’s a good chance
    other people can access that metadata too. Like James, you may find you’re revealing
    more than you hoped. Or, in the cases where EXIF data is modified… less than others
    may hope.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'After all, this is how the fugitive John McAfee’s location was leaked to the
    world (Madhisettey et al., 2019). A picture taken by a Vice journalist revealed
    that the people in the photo were in Guatemala. McAfee later claimed that he had
    spoofed the EXIF data, but that’s a claim that doesn’t much hold up to scrutiny.


    Many of us don’t think a lot about the information we’re leaking out simply by
    being a living person in an age of computers. Metadata is everywhere. Sometimes
    it seems innocuous, such as a list of authors in a word processing document. Sometimes
    that document will contain metadata regarding tracked changes, which … well, you
    may not want just anyone being able to read your in-progress draft notes. Sometimes
    it’s genuinely harmless, like the list of fonts installed on your computer or
    how much memory is in your device. Sometimes though when that information is cross-linked
    with other information it can do frightening things … like uniquely identifying
    your computer from nothing more than the metadata provided when you access a website
    (Eckersley, 2010). This unique identifier is something known as a digital fingerprint.
    If you can fingerprint someone, you can track them. Did you stay off of Facebook
    because you didn’t want it knowing everything about you? Bad news… they worked
    it out anyway. You’ve got a ‘shadow account’ and there’s not a thing you can do
    about it (Sarigol et al., 2014; Tufekci, 2018). The Facebook pixel is one of the
    tools used to do this – a 1x1 invisible image that site operators can include
    on a site to hook users into the vast machines that do behavioural analysis across
    social media.


    Facebook’s shadow accounts are an especially problematic example of how much data
    we leak. In 2018, Mark Zuckerberg testified to a congressional hearing that Facebook
    routinely builds accounts on people who do not use the service. They do this with
    cross-referencing the data they can get elsewhere. When your friends upload their
    contact list, they get names. They can construct your social circle. They can
    guess at friends who aren’t on Facebook, and then they can start building up information
    about those invisible people based on what gets tracked across sites that hook
    into Facebook’s digital toolkit.


    It’s not just Facebook either – your digital fingerprint is smeared all over big
    tech and there’s no way of even knowing what it contains. Thus, the 2012 incident
    where Target mailed pregnancy vouchers to a teenage girl who hadn’t yet worked
    up the courage to tell her father about her situation (Hill, 2012). If someone
    is tracking you with cookies, they can use your digital fingerprint to associate
    your browser with your behaviour.'
