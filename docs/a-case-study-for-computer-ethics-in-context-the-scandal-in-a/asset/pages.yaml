  md: '# Resignations All Around at the University of Dunglen


    # NEWSPAPER ARTICLE


    *An exclusive report by Jack McKracken for the Dunglen Chronicle*


    The University of Dunglen, unable to contain the criticism regarding Dr. Blackbriar
    and the university''s senior management team, today released a series of press
    statements announcing four staff losses. The first of these was the principal
    of the university, Professor Sir David Tumblewood, who announced that he was resigning
    to take on the vice-chancellorship of the National University of Kumrani in the
    Middle East. His statement made no mention of the scandal, but university insiders
    say that ''he jumped before he was pushed, and so they gave him a golden parachute.
    It''s a big one too – he''ll be crushed underneath it''.


    Dr. Blackbriar has taken early retirement, effective immediately. All internal
    investigations against him have been dropped, although civic proceedings initiated
    by ScotOil and other NSAE funding partners will still proceed. He will not be
    permitted to retain his professorial honorific, and so he reverts to the Dr. to
    which his postgraduate qualifications entitle him. Dr. Blackbriar''s lawyers issued
    a statement that said, ''Dr. Blackbriar continues to assert his innocence in this
    matter, but recognises regardless of'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'the outcome that his career in academia is over’.


    Our insider tells us ‘The early retirement deal he signed was very generous, but
    it contains within it a clause that prohibits him from instituting legal action
    against the university. The problem for the university is that he knows where
    all kinds of skeletons are buried, and so it was worth it for them to pay him
    off’. Rumours suggest that the package given to Blackbriar also contains strict
    non-compete and non-disparagement clauses, although as is typical the man himself
    is tight-lipped on the topic.


    Sir Gideon Lazenby has tendered his resignation and has been selected by his local
    parliamentary group to stand as MP for the Conservative and Unionist party in
    the next general election. ‘He knows as well as anyone else that a Tory in Scotland
    has more chance of being hit by lightning than elected’, said a close friend of
    the former university treasurer, ‘But he’s got a different trajectory planned
    – governmental advisor and strategy planner, and this candidacy is his way to
    get his foot in the door. Let’s face it, even with these allegations hanging over
    him he’s still more trustworthy than the majority of parliament’.


    Finally, Professor Ian McManus has tendered his resignation to take on a full-time
    role at the European Funding Council as Director of Ethical Research. ‘Seems ironic’,
    said our Dunglen insider, ‘But the EFC figure that his already considerable


    expertise is only enhanced by this incident. He always acted more like a bureaucrat
    than an academic anyway, so maybe this is for the best’. This move is seen as
    surprising by many in the sector, who cite the bitter aftertaste of Britain’s
    contentious exit from the European Union. ‘At one point having the UK in a research
    funding consortium was like lacing someone’s coffee with cyanide’, said one academic.
    ‘I guess now we’re just swallowing everything’.


    Sharon McAlpine and James Duncan, the two PhD students who were suspended as a
    result of the investigation, have not been reinstated. The new acting principal
    of the University, Professor Helen Hackett, issued a stern rebuttal to Karan Chandra,
    saying in a letter ‘The standard of research ethics to which we hold all parties
    at the university has been compromised significantly of late. Your clients are
    guilty of negligence or wilful blindness in the pursuit of their doctoral studies.
    As such, they will not be reinstated by this university and we will aggressively
    protect ourselves against legal challenges to that decision. They were half way
    through their studies, so the remaining funding will be used to take on a new
    PhD student’.


    Professor Hackett spoke to the Dunglen Chronicle earlier today. ‘We are hopeful
    that the recent announcements regarding university staffing are sufficient to
    draw a line under this sorry incident. The university’s reputation,'
  merge: -1
