  md: '# THE LONG MEMORY OF THE INTERNET


    Our primary lens on this scandal is through the newspaper articles to which we
    are given access. This is an intentional design of the case study, to encourage
    a sense of critical scepticism about what we read. Or, perhaps more accurately,
    what we don’t read. In the section above for example, we talk about Lazenby and
    McManus as if they hadn’t disclosed their interests. Maybe they did and that fact
    has simply been omitted from the reporting in order to make it juicier. It used
    to be said that people turned to the news to find out if what they were reading
    on social media was true. Increasingly, people (including journalists themselves)
    turn to social media to find out if what they see on the news is true (Brandtzaeg
    et al., 2016; Zubiaga & Ji, 2014) albeit with poor results. Problematising this
    shift in behaviour though is that news and social media have become increasingly
    polarised (Barbera, 2020; Levy, 2021; Osmundsen et al., 2021). That newspapers
    pander to their audience is something that has been recognised for decades (Beam,
    2003; Mullainathan & Shleifer, 2005), as is riffed upon within the sublime (if
    somewhat dated) sketch from Yes Minister (Kamm, 2016):


    > **Hacker:** Don’t tell me about the press. I know exactly who reads the papers.
    The Daily Mirror is read by people who think they run the country; The Guardian
    is read by people who think they ought to run the country; The Times is read by
    the people who actually do run the country; the Daily Mail is read by the wives
    of the people who run the country; the Financial Times is read by people who own
    the country; the Morning Star is read by people who think the country ought to
    be run by another country, and the Daily Telegraph is read by people who think
    it is.


    In our latest article we see two effects at play. One is that citizen journalism
    – or student journalism in this case – has done important investigative work that
    would more traditionally be considered the role of newspapers or television news
    outlets. But also, the outlets that have now ceded responsibility for this kind
    of work have no compunction in then using it as the basis of their own coverage.
    There exists now a whole ecological niche of journalism where the job of the reporter
    is to find ‘news stories’ on Twitter, Facebook, or Reddit and then monetise them
    by directing attention to their own coverage (Hurcombe et al., 2021; Johnston,
    2020). Sometimes with disastrous impact, such as the association of Sunil Tripathi
    with the Boston marathon bombing (Starbird et al., 2014). Indeed, whole outlets'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'have this kind of content looting as the thing that drives the majority of
    their traffic – collated and ‘curated’ lists of Reddit posts and collections of
    tweets with a light smattering of original commentary to tie it all together (Tandoc,
    2018). Often, these come along with a predisposition for audacity to hide the
    lack of originality – many of the original clickbait headlines evolved from a
    need to drive eyeballs to content those eyes had already seen elsewhere. Much
    of it amounts to little more than an ongoing creativity burglary. As Stehling
    et al. (2018) put it:


    > We argue that processes of co-option constantly oscillate between the empowerment
    and exploitation of audiences.


    Note for example how the Dunglen Chronicle refers to ‘the Facebook poster revealing
    the information’. They do at least name the Facebook group (Professor not Patsy).
    Despite this revelation being worthy of a newspaper article, the poster is not
    worthy of accreditation. However, there is another edge to that particular sword
    – media attention can light the touchpaper under the firework that is social media.
    We can even see from the name of the group that this isn’t a calm, reasonable
    place for people to discuss the situation. It’s factionalised in its very framing,
    and undoubtedly at war with another Facebook group somewhere called ‘Blackbriar
    is a Fraud’.


    Where this kind of relationship between social media and the news can work well
    though is a kind of news version of Linus’ Law (Raymond, 1999). ‘Given enough
    eyeballs, all bugs are shallow’ can also be recast as ‘Given enough eyeballs,
    all information is accessible’. It’s just not feasible for a small journalistic
    outlet to pore over the many thousands of terabytes of content that might be dimly
    relevant to a complex emerging news story (Cervi, 2019; Stehling et al., 2018).
    Citizen journalism often reflects a kind of crowd-sourcing of the kind of work
    a researcher might perform at a larger outlet. In this case, the unattributed
    original poster serves as the spark that sends the newspaper to the Freedom of
    Information Act (FOIA). We can tell this is a fictionalised case study by how
    the act enables them to get actual information back. Most FOIA requests end in
    a full or partial dismissal of the request¹ under any number of its commercial
    or sensitivity exemptions. In 2021, of over 51,000 FOIA requests only 40% were
    granted in full, and 38% were withheld in full. It’s been argued that the FOIA
    in some cases has resulted in public bodies taking sensitive data entirely off-grid
    (McConville, 2021).'
