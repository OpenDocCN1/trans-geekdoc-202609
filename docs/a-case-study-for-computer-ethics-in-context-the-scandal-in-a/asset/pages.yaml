  md: '# WORKPLACE RELATIONS


    Within the ''Students Speak Out article'', we see the first stirrings of the workplace
    issues that will become important themes. Our postgraduate students, Sharon and
    James, have been suspended for their presumed roles in the alleged academic misconduct.
    They have told their story to the newspaper in an attempt to get their views heard.
    What they tell is a tale of academic serfdom and the hope of future preferment
    because of their relationship with Blackbriar. What they also do is open our eyes
    to the way in which modern academia sometimes utilises transient resources such
    as postgraduate and postdoctoral researchers. There are parallels here too to
    the way other industries treat young professionals – burn them out and then change
    them like lightbulbs.


    There is a growing body of what has become known as ‘quit-lit’ emerging in the
    semipopular educational press. This term broadly encompasses a range of revelatory
    blog posts, education periodical editorials, and social media updates. As a general
    theme, these revelations cover postgraduate students, postdoctoral researchers,
    and even full-time faculty members. Those who have been driven to publicly quit
    their positions as a result of administrative pressures, job insecurity, or career
    ennui. The stories are not just from those who have failed to find success within
    modern academic institutional structures, but also those who have found such success
    and discarded it regardless. Full quantitative figures on the trend are hard to
    uncover, as unpicking these incidents out of larger employment trends is a complex
    task. It is hard to say whether the trend to publish ''I''m leaving academia''
    literature reflects an increase in dissatisfaction or simply a decrease in discretion.
    However, within the body of quit-lit we see many views of a dehumanising system
    of employment and promotion, and a research process which prizes funding and quantification
    over longer term scholarship. Obtaining a permanent position as an academic is
    difficult. There are some 30 or 40 PhD graduates being produced for every single
    academic vacancy, with positions at high-profile institutions sometimes receiving
    hundreds of applications per job. Under such circumstances, it is only natural
    that those with transient working contracts will look for whatever advantage they
    can find in their collaborations. Getting noticed as a new researcher too is challenging
    – with little track record of individual accomplishment, grant funding is difficult
    to obtain. Temporary research contracts usually relegate a researcher to second
    or third authorship. Attaching one’s name to a prominent researcher in the field
    can be a useful way to gain some notice. A certain amount of professional'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'discomfiture might be expected and accepted as the cost of doing business.
    A kind of ‘competent-by-association’ impression can be generated by your name
    being attached, via co-authorship, to the prominent publications of an academic
    luminary.


    The growing trend of quantification of research exacerbates this issue – assessment
    exercises such as the UK’s Research Excellence Framework such as algorithmic analyses
    of research output, such as citation counts and H-Indicies (Martin, 2011). Automated
    tools such as Google Scholar index scholarly publications across much of the internet
    and produce crawled citation lists. These are an easily checked resource for both
    researchers and those looking to employ them. Other databases exist too, with
    varying degrees of prestige. For some disciplines, all that matters is how many
    publications you have in Scopus, for others it’s the Web of Science. We’ve spoken
    before about fractures at the interface of disciplines, and this is one of the
    ways in which it manifests in academia. Not all databases capture all publications
    – they’re all skewed towards one discipline or practice or another.


    Anything quantifiable can almost always also be gamed, and the H-Index is no exception.
    If you haven’t encountered this term before, it is described as ‘The value N,
    such as N publications from a researcher have achieved N citations’. As in, if
    you have five papers with five citations, you have an H-Index of five. Six papers
    with five citations, still five. Six papers with six citations, you go up to an
    H-Index of six.


    Those looking to inflate their H-Index can easily do so if they are able to publish
    regularly – self-citations are often excluded in more comprehensive analyses,
    but not in most of the automatically generated values. However, that kind of engineered
    ‘citation inflation’ requires a regular stream of published papers, and that in
    turn requires a regular stream of insight generated via new work. Access to a
    colleague with research funding can facilitate this, but usually only for short-term
    contracts of two or so years. It’s exceedingly difficult to plan a life around
    institutional and structural career instability. The emotional toll of this system
    is often not discussed, but includes systemic depression, mental health issues,
    and increased rates of illness due to stress. Researchers report difficulties
    in balancing work and family life, the gradual erosion of vacation time, and long,
    unsustainable working hours.


    Talking about these issues is difficult for many – the system as it currently
    stands is not geared up to seriously consider the emotional toll of short-termism
    in research planning. A full solution to the problem'
