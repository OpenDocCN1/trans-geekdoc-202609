  md: 'for the creation, transmission, or receiving of:


    +   1. Obscene or offensive images, data, or other material.

    +   2. Material with the intent to harass, upset, or offend a third party.

    +   3. Material which promotes discrimination on the grounds of race, sex, religion,
    belief, disability, age, sexual orientation, or political affiliation.

    +   4. Material which advocates or supports the performing of illegal or unlawful
    acts or activities.

    +   5. Material which is libellous or in some other way defamatory.

    +   6. Material which infringes the intellectual property rights of the university
    or third-party intellectual property owners.

    +   7. Material which consumes undue amounts of shared university resources.

    +   8. Material which violates the university''s security protocols or provides
    advice on how this can be done.

    +   9. Material which is digitally manipulated to convey a false impression.


    Clauses seven, eight, and nine of the AUP were newly instituted in the last week
