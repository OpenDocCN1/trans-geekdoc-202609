  img_proc: true
- pgno: 245
  md: 'fashion. It’s not always the case that the slow consideration of cause and
    effect is given time to mature, of course, but that’s the intent of the system.
    In most cases, legislation, unless it is forced through, requires time.


    But the thing about computer science is – it doesn’t require time in the same
    way. The pace of advancement in technological fields is rapid – far beyond the
    ability of governments to regulate it. Tech often moves too fast for humans to
    keep up with it in daily life. Alvin Toffler coined the phrase ‘future shock’
    to describe the phenomenon of ‘too much change in too short a period of time’
    (Toffler, 1970). In 2012, David Karpf introduced the concept of ‘Internet Time’,
    which is the rate at which online connectivity is reshaping society (Karpf, 2012).
    The pace of change identified by these individuals is only increasing (Butler,
    2016; Leadbeater, 2020). Moore’s Law is often trotted out in these kinds of discussions,
    referring to the idea that available computer power doubles every 18 months or
    so. The statement can be interpreted in a number of ways, but the traditional
    metric is ‘number of transistors that can be packed into a given area’. There
    are other ways in which the law manifests, and perhaps a more robust way of thinking
    about it is ‘What does £100 buy you in terms of processing power?’. Much is made
    of the fact that Moore’s Law is slowing down (Eeckhout, 2017; Flamm, 2018) and
    losing its predictive power. Much less is made of the fact that the doubling of
    computer power can take many different forms whether through efficiencies in manufacturing,
    design, or energy consumption. Processors may be getting faster at a slower rate,
    but computing power at scale has never been so achievable – or so affordable.


    Our legislative frameworks do not advance nearly so quickly, and so we are left
    with situations where existing laws – such as the Computer Misuse Act (Macewan
    et al., 2008) – are sadly out of date and no longer reflect the contemporary digital
    landscape (Montasari et al., 2022). The Computer Misuse Act is over 30 years old
    and may be forgiven for the creaks and cracks it carries in its bones. However,
    even the relatively spritely General Data Protection Regulation (GDPR), introduced
    in 2018, is already struggling to keep apace with technological development (Kutylowski
    et al., 2020). The introduction of generative AI into the equation has further
    complicated things. In many ways, LLMs and the implications thereof have acted
    like a sniper’s bullet aimed at the heart of computing legislation.


    Crimes such as those of James Duncan must be viewed in light of laws that were
    written for scenarios that are no longer fully operable. In this, we might harken
    back to the justification for this book itself, way back in the first chapter…
    The Case of the Killer Robot (Epstein, 1994) requires so'
