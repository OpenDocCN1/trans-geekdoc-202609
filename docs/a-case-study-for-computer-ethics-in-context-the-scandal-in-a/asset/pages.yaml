  md: 'constructing. As we talked about in the previous chapter, it’s hugely important
    that raw data is correct and accurate otherwise the entire basis of future analysis
    is unsound. There is a useful mantra in computing science ‘Garbage In, Garbage
    Out’ – if what goes into your calculations is bad data, what comes out are bad
    conclusions.


    We’re introduced to Professor Callum Sunderland in this article – he’ll be a guide
    of sorts through the coming articles, but don’t treat him any differently to anyone
    else in the study. He’s unconnected to the incident, and a known (fictional) expert
    in the area of research ethics. We still don’t know to what extent his views are
    being fully represented by the reporter, or what his own motivations for commenting
    at all may be. After all, he is employed at another university and while there
    is a good degree of collaboration across institutes there is also rivalry. How
    much does a representative of the University of Alba stand to gain by commenting
    on the misfortunes of a competing university?


    The details of the allegation are that incorrect, or misleading, data has been
    inserted into the raw data sets used by the professor, and that he has been trimming
    ‘outliers’ from the set so as to skew the results towards a particular desired
    conclusion. This is a serious breach of research ethics, and it seems bizarre
    to think that something this serious could go unnoticed. We don’t know how long
    he has (allegedly) been at this, but surely something like this couldn’t escape
    expert scrutiny?


    Well, perhaps and perhaps not. It all hinges on how much we might expect his colleagues
    and collaborators to understand what he’s even been doing. What we see here is
    a popularised description of a complex research algorithm – that’s just a fancy
    way of saying ‘a discrete set of unambiguous steps followed (usually) by a computer’.
    It’s intentional that this be a little baffling. We’re not supposed to know for
    sure how the research worked because we’re seeing it reported through the filter
    of an unreliable narrator for a non-specialist audience. At the cutting edge of
    research, only a small number of people are likely to fully grasp the implications
    of experiments and studies, and there’s a limit to how far it can be simplified
    without losing important nuance. The problem is beautifully illustrated in a sketch
    from British comedy duo Armstrong and Miller in which a daytime television interviewer
    attempts to do a short interview with a physics professor:


