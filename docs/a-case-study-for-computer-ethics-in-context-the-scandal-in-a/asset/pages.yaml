  md: 'These are largely internal pressures that come from the publish or perish mindset
    – an urge to find the publishable units in the work you do because otherwise you’re
    not going to keep up with a tempo of publication set by those competing for the
    jobs you want. There are external pressures too, often set at an institutional
    level. Many academics work within fixed expectations of publishing – either formal
    parts of their contract of employment or an informal expression of their local
    culture. ‘Two papers per year in high impact journals’ is a common benchmark in
    research-focused UK universities, even if it’s rarely formally expressed. As it
    is with many norms in a highly mobile workforce like academia, it’s sometimes
    more a diffusing of hearsay than a formal contractual obligation. We carry the
    expectations of our former workplaces into every new one we enter.


    On top of this we can layer formal expectations that influence expectations of
    publication – papers are what get you academic credibility, and credibility is
    what finds you collaborators. Collaborators are what you can use to get grant
    funding, and grant funding is, eventually, how you pay for your salary. Research
    active academics cannot simply focus on papers, but those papers have a role to
    play in a funding landscape that is intensely competitive. It is cynical to say
    that universities are only interested in research funding, but it’s hard to deny
    that’s how they often behave. More publications equal more credibility which equals
    more funding. The value of the scholarship often seems to have diminished value
    in comparison to the mere fact of its publication.


    Consider for example the subtle, and not-so-subtle, hints that Professor Blackbriar
    receives in the hacked correspondence. ‘I don’t need to remind you just how important
    this collaboration is for the university, and for your own research agenda’, ‘The
    consultancy fees that ScotOil are offering are enough to fund your department
    for five years’, ‘Don’t spook the horses’. It’s not the case that anything as
    simple as managerial pressure is being brought to bear here – it comes in a more
    insidious, more plausibly deniable form. It comes as well-meaning guidance that
    is looking out for Blackbriar’s best interests if he could just shake off his
    understandable uncertainty about the results. ‘As long as you indicate in all
    publications and correspondence that you’re working with processed rather than
    raw data, I don’t see an issue with what David is suggesting’, says the chair
    of the research ethics board. He’s right too – there’s no academic fraud if you’re
    honest about everything you’re doing. However, there’s a cynical degree of ‘knowing’
    in advice'
