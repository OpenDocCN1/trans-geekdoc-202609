- pgno: 110
  md: 'have been told. Ensuring the utmost veracity of already trusted data may have
    been a luxury that simply could not be afforded in the context of the working
    environment.


    There is much that can be done to ensure accessible software but it requires both
    the will to invest the effort and the skillsets to make structural changes to
    the underlying programming code. In many research environments, we cannot assume
    either – software in these circumstances is not being written as a production-ready
    product. It is instead intended to serve as a stop-gap solutions that meet an
    immediate, but likely nonpersistent need. Sometimes, temporary software solutions
    evolve into a core element of an organisational workflow, but there are inertial
    pressures that come into play when the need comes for changes. Sometimes software
    is so tightly bound up in its original assumptions that making an adjustment requires
    a complete rewrite of the code. Sometimes the source-code was only ever stored
    in the personal directory of a postdoctoral researcher who left the institution
    ten years ago. Sometimes the institution is no longer subscribed to the development
    tools that were used to create a software solution. Sometimes the operating context
    moves on, and updating to the newest software libraries breaks compatibility.


    When making improvements for accessibility purposes, there is a relatively specialised
    skillset required to make sure that changes don’t have an overall negative effect
    (Milne et al., 2005). There is always a reason why something shouldn’t be done,
    and with the maintenance of software the reason may be ‘nobody can actually do
    it’. The fewer people impacted by a problem with the software, the less likely
    it is that the need for change will gather sufficient urgency or develop the critical
    mass to turn ‘this should be done’ into ‘this is being done’.


    With larger software suites which are purchased from commercial outlets, we may
    also be restricted to what can be done within the context of an established extra-institutional
    user-base. There may be thousands, or tens of thousands, of users who all have
    their own views on how the software should be improved. A larger user-pool would
    mean that accessibility issues were experienced by a larger number of people,
    but they are likely still only a subset of the installed user-base. Economic self-preservation
    will always come into play. A company looking to profit from its users must see
    to the needs of the many before it can justify seeing to the needs of the few.
    It’s possible to marshal any number of moral and ethical arguments as to why software
    should be made accessible as a first priority, but such arguments may'
