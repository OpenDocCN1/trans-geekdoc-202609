- pgno: 229
  md: 'Assuming the software and server are secure – does the data comply with the
    requirements of applicable legislation? What of data gathered in China and processed
    in the UK? What of data gathered in Sweden and processed in China? Is it all compliant
    with EU directives? Is it ideologically compliant with Chinese requirements?


    How is the data being sent, and what are the ethical and legal complications there?
    Is it being sent directly between servers? How is it being sent, and are those
    servers employing encryption? Could the data be intercepted? How commercially
    sensitive is it and how compromising would it be for participating research subjects?
    If it’s being transferred by Dropbox or Google Drive or an equivalent – is that
    even legal in the circumstances?


    Given these kinds of escalating complexities, and the inability of any one individual
    to keep on top of them, organisations are increasingly moving to a lockdown model
    of security. Even Google, in 2023, announced a pilot scheme to create an airgap
    between employees and the wider internet.⁶ Companies sometimes institute proxies
    that all traffic must go through. They require whitelisting of connections to
    non-standard ports or enable then only on networks disconnected from the main
    one. They create or commission their own offerings of tools such as Doodle, Dropbox,
    Media Wiki, and more and then attempt to force staff into using them. The power
    users that cannot function with the tools provided are assured that their issues
    are being looked into. Difficulties in collaborating between incompatible software
    ecosystems will be marked as ‘being addressed’. The extent to which free functioning
    of knowledge work can function hand in hand with the legal responsibilities of
    a corporation is a constant source of friction. Sometimes it is the end-users
    that bear the heaviest burden as the debate is worked out. In the case of our
    Scandal, what we are seeing is a form of collective punishment expressed through
    legalese as the university tries to regain control of a situation that has long
    ago left it scrabbling for an effective response.


    # UPDATED EXPECTATIONS


    The changes we can see in the AUP and the new policies introduced by the university
    reflect a response to an educational environment that has become almost unrecognisable
    of late. We have already discussed many of the changes that the Coronavirus brought
    about – some of them temporary, such as an abrupt and often unruly shift to online
    teaching (Chhetri, 2020) – but also in terms of shifting attitudes to our work
    and life balance. That shift was intensely disruptive, and the early signs of
    its'
