  md: '+   3. Fear that a secret gossip circle exists in professional emails

    +   4. Fear that free inquiry is being suppressed


    These are not unfounded. The value of a degree is adjusted by the perception of
    worth that others ascribe to it (Donald et al., 2019; Miller et al., 2015) particularly
    when it comes to job-seeking and career-building. A degree from a high-ranking
    university is often a prerequisite to be taken seriously as a candidate for some
    jobs (Grugulis & Stoyanova, 2012). The disproportionate hold that elite universities
    and private schools have over some professions (Davies, 2018; Friedman et al.,
    2019; Wai & Perina, 2018) is a powerful indicator of the social cachet they confer.
    In more mundane circumstances, we see pressures on students during evaluation
    exercises such as the National Student Survey to suppress negativity to ensure
    that the university doesn’t drop down league tables, something we have addressed
    in previous chapters.


    A degree is a mark of social proofing and if that proof is seen to have come from
    a tainted source it will not have the same value as it would otherwise. Keeping
    quiet is a self-preservation tactic in the short term even if it carries with
    it considerable long-term disadvantages for individuals and the institution itself
    (Fanghanel & John, 2015). Given the way our scandal is unfolding, it is reasonable
    that students would not want to contribute to a situation where every future job
    interview contains the question ‘You went to Dunglen – I heard there was a big
    problem there during your studies, what can you tell me about that?’. Given the
    circumstances and the amount of scrutiny the university is under, it is unlikely
    that there are any formal or official pressures on students to avoid being candid.
    Self-interest is enough to encourage discretion.


    Given the suspected presence of influencers and journalists at the university,
    it is likely that a degree of ingroup versus outgroup thinking has begun to take
    hold (Abrams et al., 1990). Policies regarding involvement with the press are
    inconsistent between institutions and even where they are well formed and unambiguous
    there is often a question mark on how rigidly they can apply to students as opposed
    to staff. For most members of an academic community, this is a small consideration
    – few become prominent enough to attract the attention of journalists. More commonly,
    universities and other institutions make use of social media monitoring to track
    individual commentary, and there are often policies that cover the acceptable
    use of social media (Pasquinelli & Evangelopoulos, 2017; Pomerantz et al., 2015).
    While institutions lack the ability to censor or control all social'
