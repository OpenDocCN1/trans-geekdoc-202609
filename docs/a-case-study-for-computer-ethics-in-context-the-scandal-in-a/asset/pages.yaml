  img_proc: true
- pgno: 201
  md: 'Dilemma – if you both trust each other, you will both benefit. However, the
    temptation to screw over the other is hard to resist (Rapoport, 1989) because
    the rewards can be so much greater. Students may be wary of middle-aged journalists,
    identifying their ‘Hello fellow kids’ rhetoric as inherently inauthentic. It’ll
    be harder to spot the nefarious influencers given how close they’ll be in age
    group.


    University staff may find themselves targeted specifically. They have more access
    to information on what’s going on, and that information tends to be at a level
    of greater proximity to that of the decision makers in a university. University
    staff as a whole though tend to have more experience in dealing with difficult
    questions and allowing themselves time to consider before responding. The risks
    to them are also correspondingly greater – most will have contractual obligations
    to avoid inflicting reputational damage on their employers. As a result, caution
    is to be expected on their part. Even those that have never talked to a journalist
    can often rely on the reflexive skills that come with a career of giving lectures,
    discussing complex issues in tutorials, and publishing academic papers. Journalists
    and influencers want quick, easy soundbites they can edit into viewer-friendly
    packages. They tend not to be so keen on the rambling ‘on the one hand this, on
    the other hand that’ approach taken by your average scholar.


    Nonetheless, one cannot discount the power of social pressure. Intention can be
    secondary to simply responding to a lifetime of conditioning. The shock of being
    ambushed and put on the spot can result in people – especially those without media
    training – disclosing damaging information without ever intending to (Keller,
    2019). Even simply being subject to ambush interviewing can make people look guilty,
    and viewers will interpret this accordingly (O’Neill, 1983). The risks go even
    deeper than that – direct participation is not required to reveal compromising
    facts. Simply being overheard in an unguarded moment may result in damaging information
    suddenly entering the public discourse.


    Staff and students at the university undoubtedly have reason to be concerned about
    the sudden influx of strangers wielding selfie-sticks and cameras. They’re right
    to be concerned that people may be listening to what they say. Combined with the
    potential market damage to the ‘share price’ of their degree, a culture of paranoia
    is not a surprising outcome. This paranoia is fed too by the suggestion in the
    leaked emails from Nemesis that members of staff are gossiping about people in
    a way that doesn’t exactly meet the general standards for ‘professional discourse’.
    People being people, it’s inevitable that this should be true.'
