  md: '# NEWSPAPER ARTICLE


    An exclusive report by Jack McKracken for the Dunglen Chronicle


    The two doctoral students at the centre of what is becoming known as the BrokenBriarb
    Affair have spoken exclusively to the Dunglen Chronicle today in an effort to
    make clear their side of the story. The students were suspended several weeks
    ago as a consequence of their work being associated with the increasingly questionable
    data sets that were curated by Professor John Blackbriarb. Mrs Sharon McAlpine
