    # Respect for the Confidentiality of Research


    # Data and Intellectual Property


    Data, especially that coming from human beings, can be sensitive. Research participants
    provide their input into studies on the understanding that the data they generate
    will be treated with the appropriate level of confidentiality. For medical and
    psychological data, this is especially important. A research code of ethics will
    document how data is to be treated, stored, and transmitted. It is normal that
    researchers directly involved in a study will have access, where appropriate,
    to the raw data but that all other individuals receive only anonymised extracts.
    When the research data does not involve other people, there may be other requirements.
    There may be issues of commercial confidentiality or intellectual property ownership.
    Data generated via studies has its own particular value, and the source of the
    funding for studies will impact heavily on how the data may be used.


    Commercial interests in research are common, and a researcher may find that their
    hands are tied with regard to reporting results. This may be especially true in
