- pgno: 133
  md: 'trying to say that universities should be immune from oversight or monitoring.
    However, it is important that we place quantification into its appropriate context.
    It is a flawed process prone to gamification and flattening of nuance, and inherently
    unsuited to measuring that which cannot reasonably be measured. Assessing quantified
    data must be done with that in mind.


    Within the Scandal in Academia case study itself, we see the end-point to which
    this chase for research and ranking can lead. We don’t see how the system works
    and how the demands from the university that may seem reasonable to an outsider
    are impossible to guarantee given the structural inequalities of the system. It’s
    not enough to submit a grant for a million pounds – it’s necessary to write many
    grants for a million pounds, with the hope that one of them will be funded for
    long enough to meet income demands. Few people would find much solace in a job
    requirement that included the deliverable ‘regularly win the lottery’. And yet,
    that is what our current culture of fraught and unreliable research funding requires.
    Given that, perhaps we might see Blackbriar’s actions in a different light. Or
    indeed, perhaps not.


    # CIVIC ENGAGEMENT, CULTURAL IMPACT, AND THE UNIVERSITY


    Communicating the specifics of what a university is actually for is surprisingly
    difficult (Collini, 2012). One of the common things that tends to be generally
    assumed of the modern institution is some degree of civic engagement. Universities
    are expected to be able to provide at least some insight and illumination on matters
    important to society even when the investigation of this may not be economically
    feasible. Public outreach is considered to be part of this, communicating what
    is state of the art in research or scholarship to those outside of the lecture
    halls of the institution. As an example of the form this might take, the authors
    of this book have been communicating accessibility research in tabletop gaming
    to the public via the Meeple Like Us blog ⁴. This takes issues that would otherwise
    be confined to an academic journal paper (Heron et al., 2018a, 2018b) and casts
    them in a way that is tractable to the general public.


    In modern Higher Education PLC, this kind of activity might be considered a form
    of being a good corporate citizen or more formally a part of the mandate of the
    institution’s charter. For some, it may be a self-conscious attempt to counter
    accusations that academics live in an ivory tower.'
