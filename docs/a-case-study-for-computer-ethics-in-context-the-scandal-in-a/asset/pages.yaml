  img_proc: true
- pgno: 132
  md: 'correspondence about his presidency, ‘Why is it only sons of bitches know how
    to lick a stamp?’.


    Encouraging full participation means that those hypothetical sons of bitches have
    their views moderated by the more reasonable viewpoints of those that did not
    feel inherently compelled to participate in the process. At the other end, we
    find blatant exhortations for positive results, such as lecturers at an unnamed
    university that were recorded as saying the following³:


    > If (university redacted) comes down the bottom, the bottom line is that nobody
    is going to want to employ you because they’ll think your degree is shit.


    Guidance issued by HEFCE (partly responsible for administering the study) is strict
    about what institutions may say to students regarding guidance on completion.
    That does not stop certain persistent myths being promulgated. Some institutions
    tell students that ‘Neutrality is analysed as disagreement in the stats, so if
    you’re going to be neutral just be positive’ – this is both incorrect and so prevalent
    that HEFCE has issued specific feedback regarding that particular claim. It is
    important to note here that HEFCE and the universities themselves deny there is
    any endemic problem with manipulation of the system. That is in part an expression
    of the core problem. Many of the ways in which the system can be gamed are invisible
    to any analysis. Universities have been known to time high-profile positive announcements
    so that they coincide with key NSS dates, ply students completing the test with
    free drinks and pizza, and hold back bad grades until after the NSS surveys are
    completed. None of this need be especially obviously a case of manipulating the
    system, but it’s all likely to have a significant impact. After all, if the severity
    of custodial sentences modulates with a judge’s proximity to lunchtime (Danziger
    et al., 2011) it’s not possible to discount the powerful effect that a temporary
    attitude has on quantifying that which is inherently subjective.


    None of this is to say that quantification, in and of itself, is a bad thing –
    it is only right and proper that publicly funded institutions such as universities
    give an account of what they do for the public that funds them. Private organisations
    live within a far more fraught culture of quantification than university academics,
    and customer satisfaction surveys are a common measure in industry. The authors
    of this book are in no way'
