  md: 'is good, but you don’t know in advance what makes a good combination’. Simulated
    Annealing is a really neat technique, and one worth spending a bit of time reading
    about. While you’re there, have a look at the concept of a genetic algorithm.
    Just for fun.


    The next bit of the algorithm is that it’s ‘bi-modal’, which means that at some
    point when it finds something reasonably interesting it switches to another kind
    of search that allows for a more ‘fine-grained’ look at the area. We’re never
    given details as to what the second mode of this actually means, but that’s typical
    in popular news reporting of complex science. We can’t hope to get all the information.
    Finally, after having found some good candidate solutions from this technique,
    a data-mining effort takes off which looks to extensively investigate connections
    between all the different bits of the data. This kind of approach is increasingly
    important in real life.


    All you really need to take away from this little explanation of what this research
    project does is ‘it’s got an awful lot of calculation in it, across an awful lot
    of possible input values’. These kinds of algorithms may take hours to fully crunch
    through a set of input data, and because they are probabilistic they don’t necessarily
    come up with the same answer every time – each involves a degree of generated
    randomness to decide which possibilities are best to explore. Sometimes they’ll
    investigate one possibility and sometimes they’ll investigate another. The sheer
    vastness of the number of all possible combinations (known technically as the
    solution space) means that they can only ever hope to explore a fraction of all
    the options. The job of the algorithm is to identify what fraction that should
    optimally be.


    Solution space is another term that we need to define to understand this research
    – imagine you have a simulation of a real-world phenomenon. It takes in 20 pieces
    of input data. Maybe it’s dealing with weather, and it needs the temperature,
    the wind speed, the humidity, the wind direction, and so on. You know that certain
    combinations of those values will result in rain and some will result in sunshine.
    If you want to know what creates a sunny day, you need to continually iterate
    over all the combinations of all those individual ‘traits’. Some of them may have
    only a few possible values. Some may have millions. Just look for example at the
    combination of wind speed and temperature. Wind speeds can typically vary from
    0mph to 80mph or higher, with all points in-between. We don’t know if there’s
    a difference for weather between 50mph and 50.1mph, and so we need to look at
    a few decimal points between the natural numbers. Let’s say that'
