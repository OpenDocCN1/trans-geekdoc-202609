  md: 'We must bear in mind here too that our view of this emerging incident is highly
    skewed – we’re reading newspaper reports, by a reporter called Jack McKracken,
    about a number of things that are outside the regular lay-person’s ability to
    immediately understand. The ins and outs of academic misconduct are complex, and
    the ways in which it can be perpetrated are subtle and often highly statistical.
    The motivations of those involved are far from clear-cut. Newspapers are notorious
    for simplifying complexities, removing nuance, and taking a particular editorial
    stance. We cannot assume that our source of information on this is entirely accurate
    – the concept of the unreliable narrator is useful here. Our intrepid reporter
    may fall into one (or more) of several possible motivations:


    +   1. Honestly reporting on facts he understands, making sure to include all
    the necessary nuance without skewing the reporting.

    +   2. Dishonestly reporting on facts he understands, looking to create a particular
    impression of wrong-doing at the university.

    +   3. Honestly reporting on facts he doesn’t understand, resulting in errors
    of inference and implication.

    +   4. Dishonestly reporting on facts he doesn’t understand, resulting in a chaotic
    mess of contradictory information.


    We may build an impression of our reporter as we go through the case study and
    come up with a view as to his bias and reliability. We can also skip to the post-script
    in this book and read an interview with the man himself, although we would recommend
    that is only done when the scandal has played out in full. Our sole point of comparison
    otherwise is the other articles that he has written – this makes it difficult
    for us to calibrate the accuracy of the information coming our way. We can’t do
    anything about that, but we can be mindful of it and not take what we are told
    as gospel. We can pick up on inconsistency in what has been written, but without
    access to the ‘raw data’ we can’t assess whether what has been written was true.
    When quotes are provided, we don’t know if they are the full quotes respectful
    of context. We don’t know if they’re abridged quotes that ignore context. We don’t
    know if they are somewhere in-between. We must be careful in how we approach our
    assessment of the evidence.


    We’re at the start of a long discussion here – it’s important we build what is
    to come on strong – and critical – foundations.'
