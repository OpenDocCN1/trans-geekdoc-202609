  md: 'giving students opportunities to ground themselves in the topic. You better
    believe though that making the content easier makes a ‘better’ course for the
    metrics.


    That is, of course, unless you’re a woman. If you are, you’ll find you also need
    to navigate a hostile evaluation regime that punishes you for behaviour regarded
    as laudatory in men, and for any mistakes you make to be punished much more harshly
    in review (Kreitzer & Sweet-Cushman, 2022). A man can come into a lecture, hungover,
    and ramble on for a few hours from a vague memory of what the slides (that he
    forgot to bring) were supposed to be. ‘Lol, what a legend!’, ‘Hilarious!’, ‘Eccentric
    and fun’, ‘really knows his stuff’. The same performance from a woman is more
    likely to be regarded as ‘unprepared’, ‘slovenly’, and demonstrate ‘lack of structure
    in the presentation’ (Mitchell & Martin, 2018).


    Perhaps then we should look at all of this from another perspective – you could
    assess how many of your teachers have formal teaching qualifications, and try
    to raise that number. After all, if they have formal training in teaching, then
    they must be effective teachers? This is a thing for which students often express
    a desire, but the evidence shows little correlation between having a qualification
    and teaching well. Of course, we’ve already discussed the difficulties in determining
    what good teaching is so maybe we shouldn’t put too much faith in any of this.


    Really, the simplest way to improve reviews of teaching is to give out higher
    grades (Berezvai et al., 2021; Krautmann & Sander, 1999; Stroebe, 2020). After
    all, the things we’ve just talked about in terms of metrics apply to that ultimate
    summative form of evaluation of work. Teachers tend to stress to students that
    the feedback around a grade is what matters, but that’s not the thing that gets
    reflected in transcripts, in degree evaluations, and in entry to other courses
    in a system. A grade is the ultimate flattening of nuance, and it results in students
    working to the assignment rather than the topic to the detriment of the wider
    knowledge they are supposed to be seeking. A grade, in other words, is the perfect
    example of valuing what we can measure.


    That’s why when a measure of quality becomes a target, it ceases to measure quality.
    It begins to inspire people to game it – we lose the link between what we were
    hoping to capture and instead focus on improving the numbers that are its vague
    proxy. The result is often to the detriment of the organisation. As always, this
    isn’t a problem linked purely to academia. We’ve seen plenty examples of bug bounties
    that drove developers to conspire with testers to introduce more bugs'
