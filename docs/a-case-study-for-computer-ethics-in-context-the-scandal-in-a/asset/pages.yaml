- pgno: 235
  md: 'versa. Bias comes in many places, in many forms, and controlling for it requires
    deep engagement with data and why we need to record it and why we need to use
    it.


    LLMs are trained on vast data sets, and the composition of those data sets is
    often inaccessible to end-users. That''s a problem. It''s also a problem when
    algorithms responsible for large-scale decisions about humans lack transparency.
    We''ve seen many examples of jurisdictions in the United States using algorithms
    for supporting decision-making associated with when prisoners should be granted
    parole and how convicted criminals should be sentenced (Bonnefon et al., 2020;
    Villasenor & Foggo, 2020). When one wishes to appeal these decisions, there''s
    no way to object to the way in which an algorithm arrived at its conclusions because
    the data sets and the processes are proprietary. It is a black box that a desire
    for human mercy cannot unlock.


    We are also increasingly seeing a world in which AI is so complex it cannot even
    be understood by the people that develop the systems. Instead, we have AIs responsible
    for designing other AIs. The link between what goes in and what comes out is often
    baffling, and many systems offer no way to break down the decision-making into
    a human-readable format. We expect humans to be able to explain the logic of their
    decisions, and if we expect less of machines, we''ll find ourselves in a world
    governed by unknowable systems of implacable severity.


    The power of AI, and the speed at which it can work, creates its own classification
    of issues for privacy. It''s now possible for surveillance technology to assess
    facial composition in real time, cross-reference it with other databases, and
    form a sophisticated picture of the activities of millions of people. While these
    systems are not perfect, that is perhaps a point **against** the emergence of
    a digital panopticon. Consider China''s social credit system (Liang et al., 2018)
    and the impact a classification error may have on the life of an otherwise exemplary
    citizen.


    Finally, if we are to have any hope that humanity will continue to produce works
    of art and science and culture, AI needs to be respectful of intellectual property
    and of the general philosophy of collaborative culture sharing. Otherwise we will
    see our world descend into a hauntology as described by Mark Fisher (2014) – where
    we lose the ability to meaningfully invent the future because artificial intelligence
    anchors us permanently in the past. With nobody creating anything new, generative
    AI becomes the only source of new culture. That in itself can only ever be a remix
    of what has come before.'
