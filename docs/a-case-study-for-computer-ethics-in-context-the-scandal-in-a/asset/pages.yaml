- pgno: 106
  md: 'would be expensive, and require root-and-branch reform of academic promotion
    structures; redesign of the supply and demand of postgraduate researchers; and
    reevaluation of the way in which research funding is competitively allocated.
    It is easier in many cases to simply ignore the problem and hope that the professional
    consequences of disclosure temper revelatory desires. That is not to say the problem
    is entirely unacknowledged – welcome steps are now being taken to openly discuss
    these issues. For those already suffering the emotional toll, it is often too
    little and too late.


    Discussing these issues from a position of career instability is risky and requires
    a considerable degree of personal bravery – not only to admit that you need help
    but also to ‘speak truth to power’. Power differentials are a common feature of
    the workplace environment, and those in positions of authority may, or may not,
    be aware of the suppression effect those differentials may have on those around
    them. It is clear from our case study that Blackbriar is not reticent in wielding
    the differential in his favour. For many employers, they may simply be so distant
    from the day-to-day impact of the issue that they are unaware that it is choking
    off dissenting voices. Career stability and professional security can be moderators
    of this problem, but neither of those traits can accurately be ascribed to those
    on a succession of research contracts. This is especially true when every extension
    to the contract is dependent on the will and desire for colleagues to seek additional
    funding for later projects. As with many things, some progress has been made in
    this area to improve, at least legally, the tenuous position of those who are
    on successive fixed-term contracts. However, institutions have been as quick to
    respond through the use of punctuated contracts or zero-hour contracts to ensure
    that their legal obligation does not stifle their organisational flexibility.
    As a consequence, postgrads and postdocs can come to seem like interchangeable
    resources.


    The desire to distinguish oneself can lead both to working long beyond what could
    be considered reasonable hours but also for the willingness to work those unreasonable
    hours to be seen as a pre-requisite deliverable of scholarly dedication. After
    all, if I can choose between two otherwise equal research staff members where
    the difference is their willingness to work weekends, why wouldn’t I pick the
    one that goes the extra mile? With that in mind, how willing might a transient
    researcher be to rock the boat by kicking up a fuss about the quality of the analysis
    being performed on data sets?'
