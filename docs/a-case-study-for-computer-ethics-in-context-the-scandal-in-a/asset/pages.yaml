  md: 'we only use one significant digit for this – that gives us 800 possible values
    for wind speed. Now for temperature – that can vary from −27.2°C to 38.5°C within
    the United Kingdom. That’s 65.7°C full, with again a significant digit on the
    right of the decimal for each. That’s a grand a total of 657 possible values.
    We could exhaustively search any one of those by itself, but taken together there
    are 525,600 possible combinations and we don’t know which of those combinations
    give us the results we want. Lacking any further insights, we’d need to search
    over all of them.


    That’s just for two traits in the input model. Throw in a third – humidity. That
    gets measured in percentages, so that’s another 100 values, and again at a single
    significant digit, a total of 1000. Now we’ve got 525,600,000 possible combinations
    to check and we’ve only dealt with three of our 20 bits of input data. The whole
    set of those possible combinations is the solution space, and it’s already too
    big for us to exhaustively explore. So the Blackbriar Algorithm will search, at
    best, a very small portion of a solution space based on random probabilistic numbers
    generated to determine which possibilities get explored in a particular run.


    We also know that the system makes use of neural networks to help the algorithm
    optimise itself. Convolutional Neural Networks (CNNs) are a popular form of learning
    algorithm, used in everything from facial recognition, audio processing, image
    generation, to climate analysis. The trick in how they work is in the name – convolution.
    This is the process of putting an image through a range of different filters,
    each designed to capture certain regions or features. Based on which features
    are activated by particular filters, the algorithm can ascribe weights and biases
    to these combinations allowing them to be differentiated from each other. These
    systems process visual information in a wildly different way from human perception,
    but they have been shown to be extremely effective when properly trained on the
    right data and with the right parameters.


    The cost of this is in that ‘wildly different’ element – the more decision-making
    we pass off onto artificial intelligence, the less confident we can be in how
    results are obtained and how decision-making is structured. Inevitably we lose
    transparency of the link between input and output. This is important in this particular
    case study, because much of it hinges on ‘outlier’ data and the meaning of that
    may not be at all clear in a system that makes significant use of machine learning.
    In fact, some systems rely on carefully curating the data sets to avoid the problem
    of what is known as overfitting – when a system is optimal when working with training
    data but fails to demonstrate results when real data is introduced. Balancing'
