- pgno: 227
  md: 'FlixWatch (our fictional equivalent of Netflix), playing games, and streaming
    music. One might argue that these are not necessary activities in an educational
    establishment, but increasingly universities are tied into the hospitality industry.
    Dorms, refectories, night-clubs, and more are all part of the student provision.
    Here, students in university dorms – linked into the university network are now
    being denied recreation at home on the basis of what’s happening in their universities.
    Coronavirus has shown how much universities depend on the income from these sectors
    and the battle over refunds is likely to be bruising.¹˒²˒³ Students in these circumstances
    have no alternatives – they cannot simply shift internet access to another provider.
    The auxiliary fees levied by universities can be considerable – they are hard-baked
    into the budgetary assumptions under which institutions function. Residential
    services are usually the largest slice of these auxiliary funding streams, and
    the fact that they also permit managed control over resources is a valuable benefit.
    On top of this, universities offer campus bookstores, event hosting, on-campus
    hotel services, parking, and vending machines – all of these tie into the operating
    budget of the institution.


    At Harvard in 2019, board and lodging fees counted for almost 4% of revenue. Amherst
    College makes up 9% of its operating budget from housing-related income. In 2018,
    Smith College in America collected over 40 million dollars in residential and
    dining fees, and that corresponds to approximately 16.5% of the total revenue
    for the institution. These are substantive revenue streams – the University of
    Massachusetts was expecting to lose around 70m USD to refunds as a result of Covid-19-related
    issues.⁴


    In our case study Holmes acknowledges some ‘power users’ will be disproportionately
    impacted by the policy and that services will be resumed gradually. This is phrased
    as a kind of hardening of the network to protect it against intrusion. Under emphasised
    in the reporting is that Holmes himself said there had been no illegal access
    of university services which raises the question of the necessity of the restrictions
    at all.


    And again, this is not uncommon in real universities. University networks, already
    populated by mischievous students and staff, are common targets for external hackers
    and internal pranks. A university represents an incredibly complex information
    ecosystem and much of it is likely to be legally protected or commercially sensitive.
    Student records, research data, emails, and staff personal directories are difficult
    to fully protect given the openness of the academic system. Interfaces between
    public and private services are often points of trouble, and academics must collaborate
    both'
