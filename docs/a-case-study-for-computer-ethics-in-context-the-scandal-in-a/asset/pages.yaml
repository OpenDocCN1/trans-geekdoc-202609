- pgno: 291
  md: 'What would a non-compete clause even mean in a sector like this? It is, after
    all, virtually impossible for an institution to lay an ownership claim to the
    contents of someone’s head. Many contracts will stipulate that teaching materials
    (and sometimes ancillary materials related to teaching) belong under the category
    of work-for-hire. That is to say, they are owned by the institution that employed
    the person creating them. The knowledge that was the source of the material in
    itself is transferable. Sometimes you might have to leave your lecture slides
    behind, but you can always recreate their contents. Generally though universities
    like to keep ex-faculty on good terms – after all, today’s departing colleague
    is tomorrow’s collaborator in a multi-institution research consortium. The collegiate
    nature of academia is such that most within it feel that collaboration is the
    key to meaningful success. Academics serve as external examiners for other institutions.
    They work cross-departmentally and internationally on PhD supervisions. Most see
    themselves as being part of a broader and noble tradition of knowledge sharing.
    The idea of a non-compete clause is almost incoherent in that frame.


    Non-compete clauses are much more common in industries where companies are in
    zero-sum competition over the best talent – which is to say, the gain of an employee
    by one company results in the equivalent loss for another. That’s not true in
    academia – network effects are powerful and all benefit from a broad range of
    connections. Talent in technical fields, experienced managers, and executives
    – all of these often serve as custodians of commercially sensitive information
    that could result in direct benefit for a competitor. Companies don’t want a CEO
    moving to their main rival and taking all knowledge of future plans and products
    with them. As such, a non-complete clause is designed to offer protection against
    that kind of dangerous trading in commercially sensitive awareness. Non-compete
    clauses are usually time limited, often limited in terms of employment area, and
    of varying enforceability depending on where in the world you live. It’s a matter
    of course for employment contracts in the United States to include these – taking
    a job means agreeing in advance to the non-compete provisions. Around 18% of workers
    in America are under some form of non-compete constraints.¹


    Blackbriar’s case is slightly different, since he has signed on to non-compete
    not within his employment contract but as a separate settlement with the university
    related to the termination of his position. In the UK, these provisions fall under
    the general category of ‘restrictive covenants’ and are often applied in the same
    frame as ‘non-dealing’ clauses.'
