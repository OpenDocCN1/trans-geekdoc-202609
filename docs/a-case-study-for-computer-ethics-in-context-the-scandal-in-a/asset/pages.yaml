- pgno: 295
  md: 'However, the Dunglen Chronicle is not required to take a fully measured and
    thoughtful approach to the narrative it has constructed over these articles. It
    just needs to bring the story to a close, and nothing is more effective at drawing
    a line under a scandal than a string of resignations. The toll here is significant:


    +   1. Sir David Tumblewood, the principal, resigned and took up a vice-chancellorship
    at a university in the Middle East, comfortably away from the fallout surrounding
    Dunglen.

    +   2. Dr John Blackbriar has taken early retirement. You''ll see that he no longer
    has the Professor honorific. We''ll come back to that.

    +   3. Sir Gideon Lazenby tendered his resignation, and looks like he''ll be standing
    for Parliament. Success is not expected, so one has to assume this is part of
    a longer process of rehabilitation.

    +   4. Professor Ian McManus has given up his role at the university to take on
    a promoted post in the European Funding Council.


    Those are the hunting trophies collected by the media, but they''re not the only
    casualties. Sharon McAlpine and James Duncan, the PhD students, have been suspended.
    They don''t have a track record of accomplishments to shield themselves from the
    consequences of what happened. Their hopes of attaining PhDs are crushed – their
    funding has been revoked and it is unlikely they can take the work they have done
    to another university. Who''d want this tainted research, or would take a chance
    on these tainted researchers? At best they''ll need to start again somewhere else.
    More likely, they have been permanently shut out of academia.


    But note here what''s happened – those at the top of the university simply ‘moved
    on’, and everyone else was moved out. And the level of punishment received is
    arguably disproportionate to the level of moral culpability. How can that possibly
    be fair?


    One of the key moral lessons we all learn at some point is ‘Life isn''t fair’.
    The parents of the authors of this book drilled this into us like a mantra from
    a young age. When we encounter injustice, it is our natural human instinct to
    be angry on behalf of the victims (Batson et al., 2007; Pillutla & Murnighan,
    1996). We live in a world though where the underdog rarely wins. The rich prosper
    over the poor. Hard-work doesn''t guarantee recognition or reward. And, perhaps
    most infuriating, it''s much easier to'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'prosper unethically than it is ethically. An old video game called Alter Ego
    gave the first author a moral epiphany when he was very young (Heron & Belford,
    2020). It presents you with a scenario where you are hungry and you can eat your
    sibling’s ice-cream sandwich from the fridge, or choose restraint. When you choose
    restraint, the game asks you how you feel about the fact that you’ll never be
    rewarded for the restraint? It asks the question, ‘How do you feel when doing
    the right thing is simply expected, and not rewarded?’.


    Thus the central difficulty when it comes to ethical decision-making. There is
    no moral desert where people get what they deserve (Kagan, 2017). Good deeds don’t
    necessarily get rewarded and bad deeds don’t necessarily go punished (Hsieh, 2000).
    And when rewards and punishments are apportioned, we still find ‘life isn’t fair’.


    Professor Blackbriar is now Dr. Blackbriar. Professor isn’t necessarily a ‘for
    life’ title. It doesn’t stem from the achievement of a specific academic qualification
    (such as a doctorate). It is a position that implies a particular staff grading,
    and that grading is dependant on entitlement within a university system. When
    one moves on from a university, so too does their Professor title – although as
    with many things, this is honoured more in the breach than in the observance.
    When one retires from a university, it is common for the university to confer
    ‘Emeritus’ status – that the title is retained as an honourary endowment. Blackbriar
    has retired – he is no longer ‘allowed’ to use the title Professor. He will not
    be getting an emeritus professorship, given the circumstances. However, the strength
    of this kind of prohibitions varies from country to country. Professor is a legally
    protected title in Canada, but not in Sweden, the US, or the UK. As such, the
    only cost that comes from Blackbriar continuing to refer to himself as Professor
    is that the university will deny it if asked.


    The payment for this is that he received a ‘generous settlement’. He’s now retired,
    free to take on whatever responsibilities he wants (within the confines of his
    non-compete agreement), presumably with few financial difficulties. His punishment
    is in reputation alone, although perhaps the ominous cloud of legal action will
    hang over him for some time. For some people, that’s likely to be bad enough.
    It’s hard to imagine though anyone really remembering this incident in future
    years, and for those that do remember to recall its specifics.


    The principal, undoubtedly cashing in on the positive exchange rate of UK academic
    prestige, has moved far away from the University of Dunglen'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'to a country where he may find himself in far more financially agreeable circumstances.
    It’s not clear where he’s gone, but many middle-eastern countries recruit UK academics
    under contracts that are astonishingly generous in comparison to what they’d get
    at home. Tax-free salaries; paid trips to their country of origin; subsidised
    housing; bonuses for publications; generous discretionary research budgets. He
    may find it a little warm in comparison to the misty cool rain of Scotland, but
    he probably won’t worry too much about that in his airconditioned office. Some
    may see it as academic exile, but it’s likely an exile that leaves him many thousands
    of pounds a month better off. Elba, it is not.


    Ian McManus steps up to a promoted post in the EFC – no longer having to worry
    about receiving funding, he now has a pivotal role in awarding it. One might expect
    the EFC to be reluctant to take him on in a more involved post, but one feature
    of senior management is that exposure to failure can be seen as ‘excellent experience’.
    If you drop a piece of industrial equipment and cost your employer 100k, you’re
    unlikely to be promoted on the grounds of ‘Well, they’re not going to drop one
    again’. On the other hand, those in the C-Suite can convert – through a kind of
    reputational alchemy – failure into promotion. The Peter Principle (Peter & Hull,
    1969) argues that people in an organisation rise to their level of incompetence.
    In some scenarios though, incompetence is just evidence of incomparable training.


    Finally, Sir Gideon Lazenby is standing as an MP in a constituency where he is
    doomed to failure. An odd end to a glittering career perhaps, but in many cases
    such activities are the stepping stone to greater things. Serving a couple of
    years in a ‘service’ position is the key that unlocks many future doors in policy
    think-tanks and advisory positions. Having ‘failed MP’ on your resume is not as
    much of a sore point as it might seem. Consider Britain’s Nigel Farage, who failed
    seven times to be elected and yet still managed to be an influential figure driving
    the UK towards the cliff-edge of Brexit. Again, it is a sign of experience – an
    invaluable and necessary learning experience on the way to greater public or civic
    influence. Being a candidate for one of the larger parties in the UK is a subsidised
    way of raising your profile, of shaping the narrative of your rehabilitation campaign,
    and of getting your face on the television. It is risky for a compromised candidate
    to stand, but one of the benefits of university ‘court politics’ is that to the
    outsider the stakes seem impossibly low and the intricacies impossibly arcane.
    It’s difficult to craft an attack ad around anything less stark than direct embezzlement.'
