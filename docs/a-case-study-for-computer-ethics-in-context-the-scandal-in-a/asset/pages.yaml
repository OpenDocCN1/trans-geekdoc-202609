  md: 'have perilously little scope to exercise employment rights without risk. We
    focus on the academy within this paper only because that is where the scandal
    is set. We can see broad parallels to all of this everywhere we look.


    # THE QUANTIFICATION OF ACADEMIA


    Professor Taylor, within the Scandal, notes that universities must demonstrate
    their value and impact. He notes that it’s necessary to embed business thinking
    into the wider civic role of the academy in modern life. This is an argument often
    made by critics of universities: that they exist in an ivory tower, disconnected
    from reality. However, such a hard-nosed economical approach disproportionately
    threatens much of the good work that is done for its own sake, or for the furthering
    of human knowledge or culture (Collini, 2012). We need to consider the issue in
    slightly less emotive and sensationalist terms – the question becomes ‘is this
    work that the public should be subsidising?’.


    There are compelling voices on both sides of the debate, and those arguing for
    prudence in research allocations are also those arguing that it’s important to
    quantify exactly what we get out of research at all. This process has gone by
    various names over the years – ‘citation counting’ in the 60s and 70s (Scales,
    1976), ‘bibliometry’ in the 80, 90s, and 00s (Giske, 2008), and ‘impact factor’
    in the early 21st century (Garfield, 2006). In reality, these are just different
    branding exercises for the same basic process – quantifying the outputs of researchers
    with the intention of being able to rank them simply against each other. However,
    at the core of these processes is an uncomfortable truth. We value these metrics
    because they can be measured, but they do not necessarily measure that which is
    valuable. The effect is to distort the landscape – we favour metric-based measurement
    in an environment where academic critical judgement is far more important (Collini,
    2012). It’s easy to assess whether a corporation is doing well, in the short term
    at least, since their outputs can be ranked in terms of production, contribution
    to GDP, or simple profitability. In knowledge economies, such as academia, the
    true value of work is far harder to ascertain in the long term and almost impossible
    to effectively assess in the short term. So we are forced to consider inferior
    proxies such as journal impact factor (Seglen, 1997) or a scholar’s H-Index (Bornmann
    & Daniel, 2005). There exist other variations and ways of ranking output, but
    they all suffer from the same basic issue. They are valued because of their convenience
    and susceptibility to algorithmic analysis rather than because what they'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'represent has true value. They may, in most cases, serve as a proxy for assessing
    quality but that proxy is usually remote from its destination indeed.


    This quantification in higher education does not stop at the gates of a perceived
    ivory tower. It now extends, at least within the United Kingdom, to the satisfaction
    of students as expressed on the National Student Survey (NSS). This exerts its
    pressure primarily by its inclusion as a ranking measure in the university league
    tables produced annually by several newspapers. Despite long-standing questions
    over the value of such tables in real terms (Bowden, 2000; Eccles, 2002; Soh,
    2011; Turner, 2005), the annual publication of these has become increasingly important
    events in the academic calendar. As a consequence, they are increasingly influential
    on decision-making in higher education. Vice chancellors scan the tables with
    satisfaction or concern, seeking to find the positive news in every bad result
    and the marketing potential of every success. League tables are informed by university’s
    own measures, but also increasingly by the results from the NSS and REF. Each
    table weights various factors differently and may include factors omitted by others.
    This results in a byzantine labyrinth of incompatible ranking measures in which
    a university may rise dramatically one month in one table and drop dramatically
    the next month in another. It also gives rise to the preposterous posturing of
    institutions mining the data for positive nuggets to put on promotional literature.
    ‘Best university in Scotland’, ‘Best new university in Scotland’, ‘Best university
    for staff–student ratio in the north of England’, ‘First for infrastructure spend’.
    The outcome of league tables is largely a branding exercise, looking to turn lead
    into gold through the alchemy of propaganda.


    Given the importance of these quantification processes, we should not be surprised
    that gaming of these systems is endemic throughout the sector. To inflate the
    impact factor of their publications, journal editors sometimes require new papers
    to have citations to previous articles within that journal. For those looking
    to be a little more circumvent in their gaming, they may strike up reciprocal
    arrangements with other journal editors (Peters & Marsh, 2009; Teodorescu & Andrei,
    2014) – you cite my back and I’ll cite yours. Sometimes this arrangement extends
    to circles of journals inflating the impact factor of each other, or more complex
    webs of obligation and reciprocation. With sufficient diligence, a conspiracy
    of citation may be extremely difficult to detect.


    Individual academics looking to boost both their citation counts and H-indexes
    may adopt the same techniques on a smaller scale. Academics'
