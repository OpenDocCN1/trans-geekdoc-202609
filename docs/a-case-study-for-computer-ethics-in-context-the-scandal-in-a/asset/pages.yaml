  img_proc: true
- pgno: 212
  md: 'Much as with their self-reported adherence to academic freedom, an implicit
    rule in academia is that it’s a safe-space from which to tell truth to power.
    Those without a disability have the privilege of not worrying about accessibility,
    at least until the point they do. That places the burden of advocacy on James
    who is already in a situation where his personal success in the future, difficult
    under ideal circumstances, is in the hands of the people to whom he would have
    to complain. He lacks the career stability and professional security that eases
    the burden of truth-telling. He can choose to make a big thing about the inaccessibility
    of the tools he has to use. He risks alienating Blackbriar and the colleagues
    that would need to spend time redeveloping tools for which the source-code may
    have long been lost (Heron et al., 2013). Or he can tough it out in the hope that
    he’s perceived as someone ‘willing to go the extra mile’. If he doesn’t keep quiet
    perhaps when it comes to picking postdoctoral candidates, Blackbriar will go with
    the one that **didn’t** delay the project for weeks or months while the software
    underwent an accessibility retrofit.


    It’s here that we see how these systems create circles of sustaining inequality.
    Inaccessibilities in the system disincentivise PWDs from taking on research jobs.
    Because few PWDs are in research jobs, software is written by abled people. Abled
    people, by virtue of not having to worry about it, often don’t consider accessibility
    as a first-tier design goal. And because they develop inaccessible software, it
    makes it harder for PWDs to do the jobs for which they apply. Systems of discrimination
    don’t need to be intentionally so to be powerfully impactful.


    # THE AI EMPLOYMENT BOOM


    We can actually dig a bit deeper still into the content of these emails. McManus
    refers offhandedly to an ‘AI sift’ that took a pool of 236 applicants down to
    a mere 28 to be considered by human minds. The process of evaluating a CV for
    a position can take a long time – if it’s done comprehensively. Some informal
    sources suggest that a recruiter might spend as little as six seconds looking
    at a résumé before deciding if someone is suitable for a vacancy; however, these
    sources almost uniformly refer to unsubstantiated ‘studies’ without providing
    supporting evidence. Formal studies tend to put the time-frame somewhere closer
    to about five minutes, but that is likely a consequence of tools like AI that
    can immediately reject candidates based on identified incompatibilities.


    For example, if a job requires a master’s degree, an AI sift can simply remove
    everyone who only has a bachelor level education. If the prestige'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'of an awarding body is important, the sift can reject anyone who doesn’t have
    a degree from a world-ranked institution. If you need someone with Object-Oriented
    Programming experience, then if your skills don’t list Java, C++, C#, or another
    appropriate development language then your resume will go into the trash. What
    you’re left with at the end of this process is the set of resumes that are worth
    spending a little time considering. In this case, perhaps this has saved the recruitment
    panel anything between twenty and a thousand minutes of work to arrive at the
    short list. Depending on how many must agree on a CV for it to progress to the
    next phase, manual consideration might be an institutional cost of several **days**
    of effort. Or perhaps you can press a button and do it instantly. By Grabthar’s
    hammer… what a savings.


    But of course, algorithms encode assumptions and that’s as true in an AI sift
    as it is in anything else. Algorithms reflect the biases of their training sets,
    and often in nonintuitive ways. Amazon in 2018 scrapped an AI-based machine learning
    recruitment bot when it discovered the tool had been training on data sets reflecting
    mostly male resumes. This resulted in the algorithm assuming by default that men
    were inherently more qualified than women²⁷. Companies selling AI hiring tools
    often note that AI can remove bias from recruiting by eliminating human judgement
    that could be swayed by race, gender, sociocultural status, and more. Such claims
    rarely hold up to more than idle scrutiny because in reality simply identifying
    these traits and controlling for them is an act of biased judgement. It is also
    tremendously difficult to decouple observable traits of gender and ethnicity without
    biasing the result (Drage & Mackereth, 2022). We should always be wary when AI
    seems to be offering broad solutions to broad problems.


    Shane in her remarkably fun book *You Look Like a Thing and I Love You* (Shane,
    2019) outlines the ‘four signs of AI doom’, which are the conditions under which
    AI will dramatically under-perform at a set goal or indeed will turn out to make
    things worse.


    +   1. The problem is too hard.

    +   2. The problem is not what we thought it was.

    +   3. There are sneaky shortcuts an AI could exploit.

    +   4. The AI is learning from flawed data.


    And indeed, all four of these come into play when it comes to doing an AI sift
    on resumes. Unless training data is well scrubbed, balanced,'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'impervious to gaming, and can capture the softer implication of meaning contained
    in the deeper connections on a resume… well, the sift just isn’t going to be very
    good. An acquaintance of the authors has worked at a high level in a complex field
    for two decades, and still found herself being rejected from jobs below her skill
    level because they mandated an ‘upper second’ bachelor degree and she had a lower
    second. The years of skill development and professional expertise didn’t matter.
    She fell below that threshold, and thus was sifted out.


    Let’s assume though that **this** AI sift – the one employed in our case study
    – has beaten the odds and is actually doing exactly what it’s supposed to. It
    is identifying the best candidates, from good training data, in a well-understood
    domain. Then we see our old friend coming in – ‘gaming the system’. CVs are amenable
    to keyword stuffing – just make sure you put the right words in the right places.
    Unless very clever, algorithms find it difficult to separate human readable text
    from the actual binary bits of the data. Including the job advert itself in an
    invisible white font as part of the background of your resume **might** be enough
    to get you past the filter. Leaving aside these dubiously ethical practices, it
    still means that recruitment is more about how you optimise your keywords as opposed
    to how well you would do the job. Smart candidates will be employing the same
    process to their resume as someone might modify a website to better match a search
    engine’s expectations. There are even AI tools out there that are used to build
    resumes, and these are optimised for the requirements and preferences of AI sifts.
    In such circumstances, recruitment becomes computers talking to computers, rather
    than people trying to ascertain how each would fit into the professional lives
    of the other.


    We have some obvious candidates listed here for the job at the University of Dunglen,
    and they demonstrate a clear match for the job. Who **didn’t** make the cut though,
    and what reasons are there for their exclusion? Would these software decisions
    stand up to scrutiny in the event someone makes a formal complaint? The lack of
    transparency in AI that we have already discussed comes into play here – companies
    rarely give transparent access to their data sets and can rarely communicate the
    decision points in any decision. Treleaven et al. (2019) note that:


    > Resume-sifting algorithms exhibit unethical, discriminatory, and illegal behaviour;
    crime-sentencing algorithms are unable to justify their decisions; and autonomous
    vehicles’ predictive analytics software will make life and death decisions.'
