  md: 'vigorous discussion and disagreement. To paraphrase Groucho Marx, we have our
    views, and if you don’t like them – well, we have others.


    We should also start off with a working definition of some terms. We’re not going
    to spend a lot of time on the philosophy of morality or the way in which ethical
    codes are constructed. It’s not relevant to the way we approach the topic. Even
    if it were it’s unlikely to be very interesting to those who just want to have
    a discussion about the implications of the actions of those in the case study.
    We do though have very particular ways in which we use the words ethics and morality.


    These terms are often used interchangeably, but in this book they are two different
    things. We define morality as an emergent property that is the natural consequence
    of a thousand small experiences. For most people, the construction of our moral
    codes begins with the family – our parents instil certain values in us as a natural
    consequence of osmosis. When they tut at the television, point to a newspaper
    article, or adopt a particular tone when discussing an issue, it all rubs off
    on us. Children naturally want to please their parents, and so early on we learn
    the ‘right’ way to talk about particular kinds of issues.


    As we grow a little, we enter into a bigger world where our parents aren’t the
    be all and end all of our moral instruction. We meet other people who come from
    other families, and we find out that they don’t think quite the same way as we
    do. We encounter social structures that encapsulate certain moral messages, and
    we find ourselves sometimes in alignment and sometimes in disagreement. Cognitive
    dissonance, the process by which two competing elements vie for dominance in our
    minds, comes into play and something has to give to bring our thoughts and actions
    into alignment. This is a reasonably well-supported psychological principle –
    as a rule, our minds will exert pressures on us to bring harmony between our thoughts
    and our actions. When this harmony is not achieved, we enter an unpleasant mental
    state known as dissonance (Festinger, 1957). The state also applies when we must
    decide between two contradictory beliefs. When dissonance is encountered, we have
    three options:


    +   1. Reduce the importance attached to particular beliefs, so that the dissonant
    beliefs can be rejected as situational or irrelevant in context.

    +   2. Add more consistent beliefs that outweigh the dissonant beliefs, so that
    the dissonant beliefs can be discarded as an unusual exception.

    +   3. Change or reject the dissonant beliefs.'
