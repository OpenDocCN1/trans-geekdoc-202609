    for hundreds of discrete locations within each region. The Blackbriar Algorithm
    then makes use of convolutional neural networks (CNNs) to optimise the identification
    of points of interest. Large Language Models (LLMs) are employed to provide narrative
    explanations suitable for the end-user. To minimise the need for human intervention,
    the system also makes use of a series of proprietary deep sea drones which are
    deployed to shortlisted points of interest to take samples and soundings.


    This complex innovative technique was the subject of several patents which were
    jointly held by a consortium of Scottish oil companies, the University of Dunglen,
    and Professor Blackbriar himself. Before the question marks that have grown over
    the process, these were thought likely to yield billions in oil revenue and millions
    in patent licencing fees for Blackbriar and the University. The situation now
    is much less clear.


    ‘Removing outliers from data sets and simulations is common practice’, we were
    informed by research ethics expert Professor Callum Sunderland from the University
    of Alba, ‘Outliers are by their very nature outside the normal course of investigation
    and


