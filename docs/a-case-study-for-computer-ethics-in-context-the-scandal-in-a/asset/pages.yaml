  md: 'their own epistemology. The ‘plea to authority’ is often considered a logical
    fallacy, but to dismiss expertise as irrelevant in interpretation is to succumb
    to the same fallacy in reverse. Sir David Tumblewood too has years of experience
    as an oil man working with data in these kinds of extreme contexts. It would be
    unwise in the extreme to discount his invaluable opinions wholesale. On the other
    hand, as noted philosopher Space Ghost once said, ‘I believe every word that man
    just said, because it’s exactly what I wanted to hear.’¹


    # BLOWING THE WHISTLE, AND WHY


    One thing that we haven’t yet discussed in this book is the expectation of disclosure
    implied in that cited email chain. We now live in a world of largely frictionless
    data transfer – the increasing capacity and speed of modern computers has been
    more than a difference in scale, it’s a difference in kind. Fifty years ago, it
    would not be possible for Edward Snowden or Chelsea Manning to download gigabytes
    of sensitive information and make those collections easily available to journalists
    and activists (Heron, 2016) – the act of removing that amount of data from a secured
    facility would have involved physical media and a supply of wheelbarrows. Now,
    it’s a matter of a few minutes to transmit vast amounts of information across
    the globe. This has had a remarkable impact on public discourse and the expectations
    we have of transparency for our governments. ‘Information wants to be free’ is
    a common slogan of free speech and free information advocates, and when information
    becomes free, it is very difficult to chain it. Consider for example the encrypted
    torrent file Wikileaks distributes as insurance against censorship (Cammaerts,
    2013) – in the event anything happens to their central repositories, all they
    need to do is release a password and everything contained within those distributed
    archives will become public knowledge.


    Along with the difficulty in containing information once it is revealed comes
    increased difficulties of preventing its revelation in the first place. Academics
    and public figures are often the targets of malicious, or merely inquisitive,
    attempts to access their private data. Especially that which is primarily stored
    on cloud services or on remotely accessible servers. Unintended disclosure is
    not a new problem – journalists of the less reputable outlets have been known
    to trawl through the garbage of celebrities in the hope of finding reportable
    information. The whole business of espionage is conducted in an ongoing exercise
    of escalating revelation – using easily accessed information to lever open access
    to other more restricted'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'pieces of information. However, the ease at which this can now be done remotely,
    and the quantity of data that can be obtained, has changed the texture of privacy
    online.


    Consider for example the consequences of a badly chosen and easily guessed password.
    If used too liberally between multiple services, a malign agent might use it to
    unlock access to years of email, social media accounts, chat logs, photo repositories,
    and more. Many of the things that might be revealed could be incriminatory or
    open further access to external parties involved in discussions.


    We all use many digital services on a daily basis, and few of us know for sure
    how diligently these services are guarding our data. The best services are resistant
    to hacks and leaks, storing sensitive content in an encrypted format and ensuring
    it does not yield itself to brute-force password attacks. With the growth of encryption
    came a corresponding increase in the sophistication of hacking. As an example,
    to counteract the time taken to compute password hashes pre-computed rainbow tables
    became a common tool of those looking to force access where they were not invited.
    That in turn led to the practice of ‘salting’ a database so that rainbow tables
    became much less effective. The war between those that want access to data and
    those that wish to prevent that access is an escalating one, with new fronts opening
    on a daily basis.


    However, institutions and services cannot necessarily afford to be in the vanguard
    of the war – it is costly, requires expertise, and is often highly contextual
    and situational. As a result, we are all more vulnerable to unwanted disclosure
    than we might like. A hack at AdultFriendFinder in 2014 revealed the sexual proclivities
    of over 400m users. In 2013 and 2014, Yahoo was responsible for leaks that impacted
    one and a half billion users in total. In 2015, hackers stole gigabytes of user
    data from the site Ashley Madison, which sold itself as a venue for married adults
    to have a discreet affair. Equifax was responsible in 2017 for a massive leak
    of incredibly sensitive financial data – around 150m records. In 2021, hackers
    managed to gain access to Microsoft’s Exchange servers and reveal commercial and
    governmental emails. Also in 2021, Facebook experienced a data breach that resulted
    in exposing the names, phone numbers, accounts, and passwords for over half a
    billion users. In 2023, classified war plans relating to the US, NATO, and Ukraine
    were revealed on social media. The true impact and severity of these leaks varies
    from case to case, but it’s clear that we cannot entirely trust other parties
    to look after our data for us.'
