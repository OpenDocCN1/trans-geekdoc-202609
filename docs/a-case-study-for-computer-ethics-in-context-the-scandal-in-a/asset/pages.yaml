  md: 'That may seem thoroughly abuseable, and all we are doing is providing evidence
    for the prosecution as to our own professional impiety. That belief though lacks
    full context.


    For that, we would like to remind the reader that this book is an expanded and
    revised version of the Scandal in Academia as was serialised in the ACM’s SIGCAS
    Computers and Society journal. It is based in part on papers already published
    and already in the academic record. The above paragraph has now inflated the citation
    count of these papers twice. One should be wary of bibliometrics – as the management
    adage goes, once a quality measure becomes a target, it ceases to measure quality.


    Academics, as individuals, are all aware of these issues. Yet we still cleave
    to the value of bibliometry within a broad community of practice. H-Indexes, impact
    factors, and citation counts are all commonly used to differentiate ourselves
    from colleagues, and for promotion committees to justify preferment. We value
    that which can be measured, even if what we measure has no value. It’s a cyclical
    structure – the various calculations for impact factor are used to generate the
    value of papers for REF analysis, which then encourages academics to publish in
    those journals to enhance their own REF rankings. Those in turn are used to inform
    the perceived value of journals to publishing academics. It is not fair to say
    that the REF does not identify high-quality, high-impact research – gaming these
    statistics can work for middling ranks, but not for those at the highest thresholds.
    However, by definition most work assessed by processes like these will lie closer
    to the median than to the maximum.


    Similarly with the quantifying of student satisfaction, we find here an inherently
    gameable system. It is not to say those that do especially well in the exercise
    are not objectively better than those that do poorly (Sabri, 2013). However, within
    bands of the results what we tend to see is the institute that was best at gaming
    the result attains the highest results. Satisfaction in all measures within the
    NSS tends to band in the 80%–100% region, and thus every tiny element of extra
    approval can have a disproportionate impact on rankings (Frost, 2021). Thus, we
    encounter a broad spectrum of attempts to game the system – some largely well
    meaning, some more dubious (Cheng & Marsh, 2010).


    At the more ethically pure end of the spectrum, we find institutions trying to
    encourage a certain minimum participation in the exercise, full in the knowledge
    that the greater the participation rate (to a limit) the more likely that negative
    feedback will be smoothed over. As Harry S Truman famously remarked upon receiving
    yet another mean-spirited piece of'
