    # OBITUARY: JOHN BLACKBRIAR


    # **John Blackbriar, Esteemed Scottish Academic and Disgraced Researcher, Dies
    at 63.**


    # **Obituary printed in the Dunglen Chronicle**


    Dr. John Blackbriar OBE, a Scottish academic known for his significant contributions
    to the field of oil exploration and artificial intelligence, passed away on the
    27th of June at the age of 58. For the past two years, he had been battling an
    especially aggressive form of pancreatic cancer. He died at home, surrounded by
    his family.


    Born and raised in Perth, Blackbriar devoted his life to the study of petrochemistry.
    After being awarded his doctorate, his work began to explore the economic viability
    of extracting under-valued resources from the North Sea. His ground-breaking research
    methods drew accolades and admiration from his peers and the industry alike and
    generated significant revenue for the Scottish oil industry. It was Blackbriar’s
    pioneering work in the use of artificial intelligence within complex environments
    that created a mini-Renaissance in the field. His work helped identify dozens
    of significant untapped and economically viable oil reserves in previously discounted
    regions of the sea bed. Several oil companies identify Blackbriar’s involvement
    as the thing that kept them from bankruptcy during several of the oil-price crashes
    in the 90s. One Scotoil colleague once said, ‘John’s genius was in finding ways
    to improve return on investment. Any idiot can sink an oil-rig into a huge oil
    field, but John’s work was a multiplier on the profit margin of the whole industry.
    His work resurrected dying rigs and kept thousands of people employed at times
    when other parts of the world were laying them off’. This work led to him being
    awarded an OBE in 2008.


    However, in the years leading up to his death Blackbriar’s career took an unfortunate
    turn. Allegations of scientific misconduct emerged, tarnishing'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'his once-unblemished reputation. Despite his previous successes, he faced controversy
    and eventually chose to resign from his prestigious position at the University
    of Dunglen. He left behind him a legacy overshadowed by scandal. Blackbriar himself,
    described by friends as ‘a reserved and taciturn man’, never commented publicly
    on the incident which was first reported in this very newspaper.


    Blackbriar’s former colleague, Sir David Tumblewood, described him as ‘An immense
    talent. An overpowering intellect. And a good friend’. Tumblewood was the principal
    at the University of Dunglen during the scandal. ‘We had our differences, definitely,
    but today I have lost a good friend and the world has lost a great scholar’.


    During his tenure at the university, Blackbriar’s work showcased his intellect,
    passion, and dedication to the pursuit of knowledge. His numerous publications
    and research findings laid the groundwork for future advancements in the field.
    His extensive research funding was pivotal in transforming the University from
    a low-ranked teaching institution to a widely respected research hub. That is,
    until the reverberations of the BrokenBriar scandal resulted in a brain drain
    that sent Dunglen back to the tail end of the league tables.


    Outside of academia, Blackbriar was known for his love of Scottish culture and
    tradition. He was an avid bagpiper and enjoyed sharing the melodic sound of his
    instrument with others. After leaving his professorship, he described himself
    as enjoying an ‘extremely early and unilateral retirement’. He spent most of his
    time working in his garden and serving as chairman of the local chapter of the
    Scottish National Party. Colleagues in the party have said that academia’s loss
    was certainly politics’ gain.


    John Blackbriar leaves behind him a complicated legacy marred by controversy.
    His contributions to the scientific community and his wider accomplishments will
    be remembered. They have though become overshadowed by the public disgrace that
    marked his later years. A complex man, Blackbriar leaves the world considerably
    less colourful for his passing.


    He is survived by his wife, Kate (55), their two daughters – Emily (32) and Lisa
    (28), and five grandchildren. Funeral arrangements will be private, with a memorial
    service to be held at a later date. Mourners are asked not to send flowers, but
    to instead make donations to Macmillan Cancer Support.'
