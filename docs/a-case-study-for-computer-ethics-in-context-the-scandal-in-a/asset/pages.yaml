- pgno: 51
  md: '# Probity in the Conducting of Trials


    The conducting of trials, especially those involving human participants, is a
    constant issue of ethical reflection in science. Medical research particularly
    involves much analysis and oversight to minimise the likely negative impacts for
    participants and is perhaps the most highly developed area of research ethics.
    It wasn’t always so – infamous examples such as the Tuskegee Syphilis Experiments
    (Brandt, 1978) of the early 1930s show that concern for research participants
    wasn’t always enshrined in trials. Similarly, psychology experiments such as the
    Milgram Experiment (Milgram, 1965) and the Stanford Prison Experiment (Zimbardo,
    2011; Zimbardo et al., 1972) show a disregard for honesty and consequence for
    participants that is shocking to modern sensibilities.


    Deceit about to what people were agreeing when they signed up for a research project
    was once commonplace. Many of the landmark experiments of social psychology would
    be unlikely to receive assent under the research ethics regimes of most universities
    now. A standard protocol is to require that all participants are fully briefed
    as to the study’s intention at its beginning, and fully debriefed at its conclusion
    as to what their participation meant. Likewise, standard operating protocol for
    most human research these days requires the researcher to explicitly outline that
    participation is voluntary and consent may be withdrawn by the participant at
    any time during the trial with no negative consequence.


    However, there are other aspects here beyond simply being honest and upfront with
    those volunteering – a reliable methodology for conducting a trial is mandatory,
    especially if it’s involving multiple researchers, participants, and partners.
    There needs to be a consistent way that data is gathered and logged, and sometimes
    that can be difficult to do when there’s any element of subjective assessment.
    Consider for example the standard ‘pain chart’ used by clinicians to determine
    just how much pain an individual may be in. It consists of a series of faces,
    each demonstrating a degree of pain, and invites the patient to show where on
    the chart they think the face most closely matches their own experience.


    Assume a simple study where the intention is to place a particular condition somewhere
    on this chart by noting the average response of people suffering from it. Over
    a large enough group of people, it can be hoped that the answers given ‘smooth
    out’. If there’s an average of 7, which is gained by asking over 1000 people,
    then by and large that can be trusted to have roughly the same number of people
    over-estimating as there are under-estimating. The more data there is, the less
    outliers impact upon it.'
