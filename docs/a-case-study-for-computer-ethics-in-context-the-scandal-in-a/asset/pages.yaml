    blithe directive to ‘increase the amount of useful value we get out of these resources’.
    Regardless of how many hours more than is healthy they may have been putting into
    their budding careers, they were brushed off as being ‘underutilised’.


    Abstract distance from people makes it easy to treat individuals as mere entries
    on a spreadsheet. Postdocs spoke of being ‘betrayed’, knowing now that they were
    being overworked to protect the professors, rather than out of an inherent desire
    to ensure their careers were being forged in the right way. For many, this may
    have been their first real lesson in the often callous calculus at the heart of
    modern industrial relations – you have little inherent value to the organisation
    other than that which is produced by your labour.


    Part of the problem here is that ultimately it’s true – the culture of research
    is such that those individuals that find themselves adrift between permanent contracts
    often are seen, at least subconsciously, as resources to be worked for maximum
