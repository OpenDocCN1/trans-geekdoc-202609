  img_proc: true
- pgno: 267
  md: 'Really that’s the currency of academia, and the real reason why the consequences
    are so high for those implicated in the scandal. Academia is a reputation-based
    economy. Every time your paper is cited, that’s a boost to your reputation. As
    you cite other papers, you give them a little bit of your own reputation by establishing
    them as important in the construction of your own work. Reputation leads to opportunities.
    These include promotions; employment in more prestigious institutions; and more
    credibility when bidding for substantial amounts of research funding. That’s the
    funding which is used to do more research and thus build more reputation.


    That all sounds nice and fluffy and represents an idealised view of academia –
    that of socially minded scholars seeking only to improve the world in which they
    live. However, realistically, we see here the issue of coercion. The simple fact
    is, you work within this system because nobody has yet proposed a realistic way
    of dismantling it. Contentious objection is only possible for those that have
    already benefited from the system – tenured professors, permanent academic staff,
    and those that have made management their core function. Everyone else has to
    simply work within the lines laid out if they want to succeed.


    This coercion starts early, right at the doctoral studies stage. If you want to
    smoothly progress through a PhD and its associated defence, then you better have
    a few good papers to back up your case. Published papers in well-regarded journals
    and conferences show that you have uncontroversially met the ‘unique contribution
    to human knowledge’ expectation of a PhD degree and thus you are in little danger
    of failing. And also, for your own career progression, you’re going to need them
    for the next step – getting a job in academia.


    Nowadays the path to a permanent academic position – certainly in the UK and the
    US – tends to go through multiple postdoctoral positions. In these positions you
    are employed on short-term contracts within fixed-duration research projects.
    Each of those projects will (hopefully) generate papers, and those papers will
    be needed to parlay your way up the chain into a lectureship position. The number
    of papers is important, but so too is the number of citations, as is the perceived
    importance of the venues in which you publish. Your gifts alone won’t carry you
    forward, those gifts need to have been appreciated by those who live within the
    culture you wish to join.


    Your first lectureship may be term limited, and achieving permanence is another
    barrier which is – you guessed it – determined by your papers and citations. A
    permanent academic position is often described as one'
