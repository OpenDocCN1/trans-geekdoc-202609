- pgno: 226
  md: '# THE UNIVERSITY-HOSPITALITY COMPLEX


    What Coronavirus has revealed to many people, in many cases for the first time,
    is the extent simple student presence on a campus has on the financial health
    of the university system. The abrupt shift to remote teaching (Bozkurt & Sharma,
    2020) was a complex story of mixed successes and failures (Hodges et al., 2020).
    It has also had numerous universities, particularly in the United States, calling
    out for financial assistance as their hospitality offerings ceased to generate
    sustainable revenue. Battles over the refunding of tuition fees are likely to
    begin in earnest in the years following the crisis. The cracks in the residential
    offerings – which include critical infrastructure resources such as library and
    internet access – are perhaps more easily exploitable. None of this is settled,
    and it’s likely we will see a number of changes in the relationship between universities,
    their students, and the economic systems within which both work. It’s an age in
    which we are suddenly hyper-aware of the possibility of global pandemic and some
    have argued that nothing will be the same again.


    With this in mind, the issue we’re going to address in this chapter is the way
    in which the university has approached its information breach problems through
    policy setting. One anonymous student (again, always anonymous) has referred to
    a ‘drum-head trial’ of anyone found violating an AUP that has been recently modified
    to prohibit a range of activities that had previously been tacitly approved.


    In fairness, the AUP of the University of Dunglen is not out of line with those
    of real-world institutions. Many of us have signed policies of equivalent wording
    when undertaking employment or buying an internet package. However, the issue
    here is one of interpretation. ‘Material which consumes undue amounts of shared
    university resources’ is one that carries with it a lot of leeway. What is an
    ‘undue amount’? Who decides? And what recourse do students have in the event that
    they are found in violation of this policy? One must bear in mind that at most
    institutions students are paying fees which include access to computers, network
    resources, and storage – to what extent can the university deny them and to what
    extent is it appropriate that everyone be impacted by the actions of a single
    individual? Given the student tuition fees are paid as a single bundle without
    bolt-ons or equivalent, is it fair that a university denies access to one part
    of a service when opting out was never part of the equation?


    The new policy seems to be in response to the leaked emails from Nemesis, which
    Terry Holmes has claimed are completely invented. However, the service shutdown
    has impacted on students watching'
