- pgno: 270
  md: 'John Kennedy Toole was considered unpublishable by the author. It was eventually
    published to great acclaim 11 years after he died. *Harry Potter and the Chamber
    of Secrets* was rejected by 12 publishers until Bloomsbury realised its promise.
    Perseverance in the face of rejection is one of the critical skills that must
    be developed by anyone working in a rejection economy.


    That said, perhaps the situation is sadder for academics given the discussion
    above regarding the economics of academia. Being rejected for something you’re
    trying to give away for free, to the profit of a publishing company, feels somewhat
    sharper than someone hoping their album is going to be a hit big enough to leave
    them drowning in fans and money and fame. Joanne Clement may sound bitter. In
    that she’s perhaps just channelling the frustrations of an entire sector.


    With all this in mind, perhaps we can see slightly better why sometimes things
    fall through the cracks. For many years, there have been experiments in submitting
    ridiculous papers to conferences and journals. The intent is to see if reviewers
    can genuinely tell the difference between literal nonsense and the academic doublespeak
    required to convince a reader of ‘scholarly merit’. These stings have varied motivations
    (Teixeira da Silva, 2021) and are rarely received positively by those who are
    most committed to a perception of academic rigour in publishing (Al-Khatib & Teixeira
    da Silva, 2016; Grech, 2019). That’s fair. Those with an identity most invested
    in the rejection economy are the ones least likely to throw suspicion upon its
    foundations. Careers can be built upon successful mastery of the game of academic
    publishing, and few are willing to argue that the game might be rigged, with systemically
    broken rules.


    That said, critics of these stings are quite correct in that much academic publishing
    works on a trust model... but that seems at odds with the perception often associated
    with the corrective values of peer review. Peer review, we are told, highlights
    methodological problems, faulty logic, and spurious conclusions. Sometimes though
    it seems to do nothing of the sort. Hoax articles – whether written by humans
    or by AI – are rarely submitted in a systematic way that would support evidence
    of widespread lax standards in academia (Lagerspetz, 2021). They tend instead
    to be laser-targeted on those outlets most likely to support an ideological argument.
    That is not to say they don’t reveal uncomfortable truths of what happens at the
    periphery of our disciplines, or disciplines critical to the construction of public
    narratives around social issues.² It’s just that such truths are difficult to
    convincingly extrapolate to the entire sector.'
