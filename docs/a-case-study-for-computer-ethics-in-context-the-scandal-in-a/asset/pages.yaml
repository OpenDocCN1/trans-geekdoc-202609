  md: 'the guy who missed out on the PhD early on in the scandal, is now the occupant
    of the PhD studentship carved out from remaining funds. It is the PhD students
    that are the beating heart of any vibrant academic community – they are the largely
    unappreciated bedrock of university research in any high-ranking institution.
    Having world leaders in their discipline available as supervisors is a draw for
    the brightest talent, and a generator of the research funding that pays for PhD
    studentships in the first place. That is going to be lacking. In the battle for
    the scant few jobs that academia needs to be filled from its gross overproduction
    of doctoral candidates, Sam Templemore and his contemporaries may already be among
    the casualties.


    Professor Hackett, the acting principal of the university, takes a more positive
    tone but it’s hard to believe this is anything other than Pollyannaish wishful
    thinking. The battle for league places in the UK is furious – we’ve already talked
    about that earlier in the book. It takes a lot of work and goodwill to meaningfully
    shift an institution up the rankings in a way that is anything other than luck
    or happenstance. The University of Dunglen will have precious little of that to
    call on in the future.


    That brings us then to the conclusion of our section on blame and punishment.
    Everyone is to blame, because ethical failures are almost always bound to a social
    context. Nobody is to blame, because no one person created the circumstances or
    could have prevented the circumstances. Everyone has to deal with the fallout,
    because an organisation is about its people more than its policies and its structures.
    The baddies win. The goodies lose. The rich get richer. The wheel keeps turning.


    It’s not a very cheerful conclusion, but nowhere did we promise you a happy ending.


