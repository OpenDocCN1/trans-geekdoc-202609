- pgno: 152
  md: 'The extent to which an employee contributes to this ‘softer’ sense of what
    an organisation wants to be is something that is often difficult to articulate,
    and especially difficult to quantify. In the absence of being able to truly measure
    the things we think are important, what tends to happen is the opposite. The things
    we can measure take on a sense of importance simply as a result of being amenable
    to metrification. That means a lot of us are assigned a lot of numbers and ‘observation
    notes’ about things that are only a distant proxy for the actual trait to which
    an organisation may ascribe value.


    Productivity seems like it would be the easy one to capture, because surely it’s
    straightforward to say how much of something a person has done, and how well they
    did it? Well, let’s look back to the idea of metrics and how that would be applied
    to the common activities in a university – teaching and research.


    How does one measure the quality of teaching? Let’s simplify the problem by thinking
    of this as teaching in the traditional sense – a student takes a course, within
    a wider programme of study. That course has several weeks of instruction. At the
    end, the student is assigned a grade (we’ll come back to that). A survey may be
    sent out to those taking the course, asking them to rate it according to several
    pedagogical principles, and then an evaluation committee may be convened to discuss
    those results along with student representatives from the course.


    Seems robust, right? That, of course, is the illusion. We can measure all of this,
    so we value all of this. Or at least, we’re supposed to.


    Let’s begin with the survey part – the specific questions that form part of this
    are reflective of the biases of those that construct the instrument of evaluation.
    Is it the job of a university lecturer to motivate students, or should a university
    be able to assume students are motivated by their own desire to learn? Does the
    survey ask if the lecturer motivated the class? How do we define motivation?


    Normally what happens is that the desire to track something seen as valuable is
    condensed into a Likert scale, to which students assign a number. The ambiguities
    around what is meant are flattened down. Four out of five – that’s how motivational
    the class was.


    The same process holds true for all parts of the evaluation. Should a lecturer
    be part entertainer? Did they use humour to illustrate their arguments? Did they
    include memes? Did they conduct assessments by social media? How ‘with it’ are
    they? How many points do you deduct from ‘social relevance’ for a lecturer who
    uses the term ‘with it’?'
