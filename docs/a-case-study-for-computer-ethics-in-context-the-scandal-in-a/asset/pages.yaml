  md: 'navigate **without** a partner who believes that professional work and additional
    home work can be combined without undue stress.


    Blackbriar also seems not to have helped, expecting his own workaholism (Golden,
    2012) to be reflected in the relationship his students have with their own professional
    practice. The perception of overwork in the academy (Jacobs & Winslow, 2004) is
    one that is often reflected in the joke, ‘Academia is very flexible – work whatever
    eighty hours you like’. Much of this is due to norms that are difficult to shift,
    but also due to a shared delusion as to how much benefit comes from additional
    hours of work despite the evidence being quite the opposite (Pencavel, 2015).
    Changed life circumstances, such as pregnancy, can break the chain between the
    illusion and the reality (Lupu, 2021). Larger, more systemic change seems harder
    to achieve. Again, the impact of excessive expectations on working hours differs
    by gender – women who don’t want to work 80-hour workweeks tend to seek accommodation
    at the cost of their professional reputation. Men will seek ways to covertly turn
    an excessive work week into a more manageable one to retain the benefit of being
    thought of as reliable ‘superstars’ (Reid, 2015).


    How much do you need to work to have a successful academic career? Opinions, like
    in every field, vary. Suffice to say though that the evidence suggests that those
    working 80-hour weeks are less common than they claim, and those that do are producing
    less with those additional hours than they might like.


    # THE NATURE OF FEEDBACK


    What then of the claim that Blackbriar had largely given up responsibility for
    writing his supervisory notes and had turned to generative AI? Or that Sharon
    McAlpine had used an AI chatbot to help with the writing of a paper? At the time
    of writing, these are exceptionally hot-button issues in computer ethics. It will
    be some time before the field approaches anything that could be described as a
    consensus. However, just because it’s complicated doesn’t mean we should avoid
    it – we’re always going to be working in uncharted waters in this area. The field
    moves too fast for us to always have comfortable answers.


    Let’s pull back a little from the specifics here and focus on the intention –
    is anything lost in either of these cases when it comes to the use of AI-supported
    writing? The answer is… maybe! We don’t know enough to say, but we do know what
    people would be hoping to get out of the text that came from the machines.'
