  md: 'Emails that are devoid of their full, unambiguous situation within a conversational
    record. They certainly seem suggestive, but that does not constitute evidence
    in its proper sense. Consider for example the Climategate (Leiserowitz et al.,
    2013) emails. These had been obtained through the hacking of a server at the Climatic
    Research Unit at the University of East Anglia. They were heavily publicised in
    the climate change denialist press as evidence of a sustained conspiracy with
    regard to the integrity of climate change research.


    And to be fair certain emails could be interpreted in such a way as to suggest
    conflation of conjecture and conclusion, manipulation of results, and scientific
    trickery of the kind outlined in the Blackbriar case we have been discussing.
    Eight independent local and national committees investigated the emails and found
    no evidence of fraud or scientific misconduct. The informality of communication
    and the coining of internally consistent jargon permitted sceptics to read more
    into the communication than a fairer, more realistic reading would permit. The
    Guardian, reporting on the scandal, noted that there was much to suggest that
    the emails released had been filtered to give undue prominence to a handful of
    emails that could be most easily interpreted in an unfavourable light. Terms such
    as ‘Mike’s Nature trick’ were used to describe methodological techniques that
    could meaningfully connect together two different kinds of data sets (Skrydstrup,
    2013). Within the expected audience of the emails, the term was understood to
    refer to a broadly understood and accepted analytical practice. Outside of that
    context, it took on a much more sinister tone.


    This shines a light on why whistleblowing is not necessarily an ethically pure
    phenomenon, especially when it is being done by an anonymous party. There are
    many reasons why disclosure of identity would not be desirable when reporting
    on wrongdoing. It would be churlish to assume all those that maintain their distance
    from disclosure are doing so for dishonest reasons. However, the fact that the
    action is reasonable does not inoculate it from its troublesome aspects. An anonymous
    party may have no agenda, or they may have a very pointed agenda. They may have
    revealed all the information, some of the information, or some highly targeted
    subset of the information. They may have released the information unedited and
    uncurated, or they may have edited key elements of the data to further their own
    agenda. They may have unfairly focused attention on one participant in a conversation
    while shielding others. Within the Scandal in Academia, we do not know who Nemesis'
