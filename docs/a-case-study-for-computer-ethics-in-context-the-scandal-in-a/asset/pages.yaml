- pgno: 90
  md: 'and requires familiarity with the linguistic conventions not just of the discipline,
    but the editorial policies of the journal or conference and the wider sector beyond.


    Consent for participation in such internal research by companies such as Facebook
    and Google is usually permitted as part of a blanket acceptance of terms and conditions
    on the part of the users. In the case of the Facebook study, there is some evidence
    to suggest that consent for research was added to the user agreement after the
    research had been conducted but in most cases a blanket exemption is in place
    that covers the service provider for a wide range of activities. This in itself
    is a shallow defence, given how few people read the terms and conditions and how
    explicitly impenetrable they are often made to be (Luger et al., 2013). Core to
    the objection that many have had to the research is that while it may have received
    consent in its simplest, most shallow form, it doesn’t meet the criteria for informed
    consent which has gradually become the academic consensus since the Second World
    War (Vollmann & Winau, 1996). Industrial bodies, such as Facebook, are rarely
    bound by formal codes of conduct or even institutional review boards (IRBs) that
    sanction studies. Even for those involving human participants. Universities, on
    the other hand, tend to have a more institutionally rigorous infrastructure for
    reviewing the ethical implications of research. That said, the standards for this
    do vary considerably from country to country.


    However, the tensions of corporate influence in academia extend beyond simple
    differences in expectations of ethical consent. One of the primary ways in which
    industry can partner with academia is through the route of funding or sponsorship.
    We discussed the impact of commercial interests in our last chapter, but we also
    have to consider the powerful influences that corporate money can have on academic
    freedom. While there are real-world limits on just how far academic freedom stretches,
    it is in general considered to be a principle worth defending. Support for the
    principle though is tempered. There exist tensions – for example, advocates of
    Intelligent Design as a scientific principle have sometimes claimed to find it
    difficult to obtain advancement in their institutions. It is hard though to unpick
    in such cases the ratio of academic suppression as compared to the self-correcting
    nature of the scientific process. Within the United Kingdom, the Education Reform
    Act of 1988 codified academic freedom as a guiding principle for higher education
    institutes. Even though academics are under legal protection that does not prevent
    industrial partners from leveraging the power differential implied by funding
    to suppress results or'
