    Much of it rings true for anyone who has experience with the research postgraduate
    programmes in numerous universities. Research students are often insulated from
    the day-to-day politics of an institute, but subject to the consequences of diktats
    from on high. The high-pressure environment in which our students were working
    may have been shaped in part by the professional priorities of John Blackbriar.
    Those priorities were shaped in turn by the principal. They talk of being offended
