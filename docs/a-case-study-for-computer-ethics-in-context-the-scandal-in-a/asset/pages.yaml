    only 21.3% were attributable to error, with 43.4% being linked to fraud, suspected,
    or otherwise. The problem seems to be getting worse – Rapani et al. (2020) suggest
    that retractions in dental literature increased by almost 50% during the period
    of 2014–2018. Campos-Varela and Ruano-Ravina (2019) suggest a baseline retraction
    rate of one per 4000 papers, with over 1082 being retracted from PubMed within
