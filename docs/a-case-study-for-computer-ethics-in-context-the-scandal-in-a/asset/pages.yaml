    on the part of an amateur – indeed the word ‘Zebra’ is a kind of medical slang
    in itself. ‘When you hear hoofbeats, think horses and not zebras’. As in – when
    you observe a set of symptoms, assume the most common underlying disease. Sometimes
    invoking the possibility of a zebra though is more conscious and intentionally
