    self-correcting mechanics of science, and the reputational incentives of the academics
    involved often do not seamlessly align’.


    Emeritus Professor Joanne Clement, who took early retirement from the University
    of Dunglen, makes a different argument. ‘Academia isn’t a gift economy. It’s a
    rejection economy. Ninety percent of what you are told is “no”. No, we won’t publish
    that paper. No, we won’t fund this grant. No, you can’t have that job. If a gift
    economy is marked by the value of what you give away, academia is marked by the
    value of what people choose to accept from what you offer. Journals, conferences
    and funding bodies set great store by their rejection rate – getting a paper accepted
    where only ten percent make the cut is much more prestigious than one where fifty
    percent are accepted, right? That paper, by definition,


    must be of higher quality, yes? Of course, it’s not – the role of journals in
    ensuring quality is overblown. They have a vested interest in ensuring lots of
    submissions, which leads to more punitive acceptance rates. Peer review is ninety
    percent gatekeeping and ten percent standards-keeping. Many disciplines have chosen
    to completely bypass the whole system and work primarily through preprints now.
    That way you can focus on the scholarship, and not the brinksmanship. It’s the
    perceived value of rejection that creates the perceived value of published research’.


    Two senior engineers at ScotOil have hit out at the cost of access to research.
    ‘Our company paid for Blackbriar’s research, and while we get access to the raw
    results of his studies we don’t get to see the actual published papers. We just
    see pre-prints and early drafts, unless we pay money for the research outputs
    we funded. Some of us may have had queries about the results if we’d been able
    to see the same papers that everyone else was reading. We know the North Sea better
    than anyone, but we’re priced out of participation in the review of scientific
    studies based in the area. We outsource a lot of our research and development
    to academia. We can buy the odd paper here and there, but we can’t afford to spend
    hundreds of thousands a year on getting access to all the journals in this area
    on the off-chance there’s something published that’s relevant to us’.


    Professor Blackbriar was unavailable for comment.'
