- pgno: 136
  md: 'Edinburgh University. His subsequent security at the institution was a kind
    of long-term gamble on him eventually receiving the award ⁵.


    > Higgs said he became “an embarrassment to the department when they did research
    assessment exercises”. A message would go around the department saying: “Please
    give a list of your recent publications.” Higgs said:” I would send back a statement:
    ‘None.’


    Few of us in academia are likely to receive a Nobel prize, or an award of equivalent
    stature. Higgs added:


    > It’s difficult to imagine how I would ever have enough peace and quiet in the
    present sort of climate to do what I did in 1964.


    In this, we can see an echo of what Clement reported to the Dunglen Chronicle.
    Once upon a time, the job of an academic was to have big ideas and spend a lifetime
    pursuing the implications. It was a job that was profoundly based upon the building
    – and inculcating in the student body – of **knowledge**.


    There is a somewhat loose hierarchy that we can apply here. At the lowest tier
    of understanding is **data**, which is a raw collection of numbers and letters
    brought together into a format for easy conversion, processing, or transportation.
    A list of numbers, or a series of alphanumeric characters. Measurements or observations
    fall into this bracket. We hope that data is made up of facts, but by now we know
    better.


    Data can then be processed into **information**, which is data that conveys context.
    A list of alphanumeric characters is data. It becomes information when it is contextualised
    as a list of postcodes. A set of real numbers is data until we find out it reflects
    measures of atmospheric pressure. Data lacks organisation, because the act of
    organising requires understanding of context. Information on the other hand is
    organised and amenable to analysis. We refine, through the application of context,
    data into information.


    Knowledge is the higher form of information, in which it is given meaning and
    depth. Knowledge allows for the comparison of information against other kinds
    of information, and for the creation of **new** information that derives from
    the old. Knowledge is the shape we give to information in order for us to make
    judgements and deduce impact. Knowledge tells us that a tomato is a fruit, or
    a tomato is a vegetable, depending on its context – whether we are looking at
    it in a botanical frame or a culinary one.'
