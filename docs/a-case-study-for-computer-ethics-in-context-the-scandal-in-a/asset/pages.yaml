- pgno: 112
  md: '(Brugiavini et al., 2022). Women experienced greater rates of work disruption
    due to increases in the need for childcare and other domestic responsibilities
    (Wenham et al., 2020). It wasn’t all doom and gloom. The pandemic did also result
    in men contributing more to the largely unpaid and unrecognised ‘care economy’
    (DeRock, 2021) that is overwhelmingly enabled through the efforts of women. When
    such a shift happens though, additional household responsibility tends to accrue
    disproportionately in the activities considered to be more enjoyable and with
    greater social approval such as childcare (Dinh et al., 2017). Less visible, less
    enjoyable domestic work rarely records equivalent change. It has long been argued
    by scholars of gender issues that there is a need for Gross Domestic Product (GDP)
    to reflect the value of care work and domestic labour – the lack of easy (even
    if misleading) quantification hides much of the disproportionate burden taken
    on by women during the pandemic (Power, 2020). A full accounting of this topic
    is outside the scope of this chapter, but we do recommend you check out the masterful
    and scholarly book *Invisible Women* (Perez, 2019) for a much fuller – and much
    more convincing – accounting.


    For McAlpine, working within a university system, she may have been interested
    in the social media trend that rose up during the early days of the pandemic –
    recognition of the growing #CoronaPublicationGap. As the responsibilities upon
    women increased, the productivity of male colleagues rose in comparison. This
    only served to exacerbate existing disparities – Oleschuk (2020) provides a compelling
    list of these, including presence of women in faculty positions; publication rates;
    citations; recognition; and salary. The same paper notes that these are not reflective
    of differences in capability, but rather a result of systemic injustices. In other
    words, the Coronavirus created a situation where the rich got richer, at the expense
    of the poorer. Women professionals in other fields experienced a wide range of
    negative pressures – mental health was seriously impacted, physical pain increased,
    eye-strain was exacerbated, and the combined effect of this was an increase in
    emotional deregulation (Sharma & Vaish, 2020). Others have self-reported significant
    negative impact on social activities, with increased loneliness as a reliable
    result (Giles & Oncescu, 2021).


    Sharon’s comment then is not simply a throwaway complaint but reflective of a
    trend that was experienced widely throughout the shift to remote working. Academic
    systems already give great advantage to those that can devote larger amounts of
    time to their vocation, and men as a'
