- pgno: 88
  md: 'and faculties. Expectation of authorship on papers may not be shared by all
    and the level of assumed contribution before co-authorship is conceded may create
    tensions. Within academia itself, collaboration can be politically vexatious.
    When industrial collaborations are incorporated into this, the problems magnify
    because not only do large industrial partners suffer from the same issues, they
    also approach the matter from an often completely different perspective. Thus,
    in addition to internecine conflict within organisations, there is an external
    conflict at the interfaces between groups. No matter the will to collaborate or
    the mutual respect that may be found on both sides, a lack of common ground can
    create difficulties, and these in turn can lead to violations of cultural and
    professional norms when the work is to be published. Issues of commercial sensitivity,
    for example, are anathema to principles of free academic disclosure.


    Within academia, the differentiation between ‘research’ and ‘teaching’ is usually
    well observed – as a matter of course, academic research is not conducted directly
    on students unless it is educational in nature and students explicitly opt in
    with no coercion. Research projects are clearly demarked, at least in theory,
    and have formal start and termination points. The funding for academic research
    is most often provided by external bodies and this places an emphasis on clearly
    delimiting activities for the purposes of economic auditing and accountability.
    Most university governing bodies demand strict adherence to ethical codes of conduct,
    and research which involves working with real people at any time will usually
    be scrutinised for its conformance with overall university codes of practices.
    It is usually possible then, within a university, to point at a body of work and
    say, ‘This forms part of this distinct research project, which was led by this
    individual, and funded by this external body in this particular way’.


    Within industry, these distinctions can become blurred – there is a fine line
    between ‘improving a process’ and ‘testing a hypothesis’. Consider for example
    the widely publicised case of Facebook’s ‘experiments’ over the emotional impact
    of manipulating the news feeds of their users (Kramer et al., 2014). Much heat
    was generated as a result of Facebook, in collaboration with university academics,
    publishing some conclusions they had drawn from what was essentially a large-scale
    experiment on human subjects through modification of the Facebook news feed. Commentators
    variously described the research as unethical, noble, deceptive or as a violation
    of privacy (Hallinan et al., 2020; Kramer et al., 2014). Leaving aside the efficacy
    or value of the research itself – which is disputed – what is'
