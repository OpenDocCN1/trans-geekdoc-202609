  md: 'Therefore, the goods become scarce. Therefore, our belief was correct. Therefore,
    buy all the toilet paper you can.


    It’s unlikely that the question marks over the Blackbriar Algorithm’s accuracy
    will destabilise economies. However, it’s important to appreciate just how interconnected
    the modern world is – there is a direct line to be drawn from factory shutdowns
    in China to the inflated cost of cars in the UK. Modern software systems have
    allowed for unprecedented levels of integration, but all software encodes human
    assumptions and sometimes those assumptions don’t take things like pandemics and
    wars into account.


