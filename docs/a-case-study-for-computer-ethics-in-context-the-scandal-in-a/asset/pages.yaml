    \ considerable degree of responsibility on you to assess the risks of any event\
    \ that you organise. In the over-whelming majority of cases, the risk will be\
    \ negligible and so no further action will need to be taken. However, it is essential\
    \ that you take this seriously and a failure to comply with your duties will be\
    \ treated as such. If you aren’t sure, you should consult with your Line Manager.\n\
    \nNote here the guideline that ‘the risk will be negligible in the overwhelming\
    \ majority of cases’ combined with the note that there are disciplinary issues\
    \ associated when it comes to interpreting often conflicting guidance. PREVENT\
    \ training is sometimes notable for how unspecific it is. When given criteria\
    \ by which staff might judge whether someone was likely to be demonstrating cause\
    \ for concern, guidance included suggestions to look for:\n\n+   1. A change in\
    \ friend groups\n+   \n+   2. Support for causes likely to bring around significant\
    \ political changes\n+   \n+   3. Changes in attitudes or viewpoints"
