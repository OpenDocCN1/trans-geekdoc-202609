- pgno: 262
  md: 'scandal broke. Many have bemoaned the decision by the journal to accept papers
    that did not clearly outline the methodology used to select data for analysis.
    Others have pointed out that the institution subscription fee of £6,000 a year
    means that the research is often hidden behind paywalls and that this discourages
    other academics and experts from applying the requisite amount of scrutiny.


    ''Peer review is often lauded by outsiders as the gold standard of academic research'',
    says Professor Callum Sutherland at the University of Alba, ''But people often
    don''t know what it involves. It doesn''t mean that the paper''s experiments are
    reproduced. It just means that people who know about the field have read the paper,
    feel that the conclusions are justified by the written analysis, and that there
    is suitable originality to warrant publication. Peer review relies very heavily
    on trust – if there are actual falsehoods in a paper, they''ll only be found if
    they fail a "smell test". That is, if they contradict other papers, or report
    on results that are wildly out of expectation. Bear in mind in the Blackbriar
    case that the professor had been reporting incremental gains in his research for
    decades. There was no sudden leap from modest to mind-blowing in terms of the
    scale of his results''.


    The increased scrutiny applied to the journals as a result of the scandal has
    shone a light on several other malpractices. These are likely to result in retractions
    across the whole academic catalogue of the


    affected publishers. AI analysis of text revealed several incidents of plagiarism,
    along with many examples of misquoted references. Also problematically, there
    is evidence of an exponential increase, year on year, of papers that include substantive
    portions of computer-generated text. Close examination of those papers revealed
    a number of fake references employed in the support of spurious argumentation.
    The value of a journal lies in the robustness of its contents, and it seems that
    this robustness is now seriously in question.


    Universities across the sector are having to cut back on journal provision for
    their academics as the price for subscriptions continues to increase. ''We spend
    around £4m every year on journal subscriptions'', says University of Dunglen librarian
    Bill Rising. ''And that cost keeps going up. Some of the most significant and
    important journals cost £10–20k each for a year. If we buy individual articles
    rather than subscriptions, it can easily cost between £30 and £100 for each. As
    such, we can''t just subscribe to everything – we need to maximise the effect
    of our spending, and some journals just aren''t as useful to us as others. Other
    universities are faced with the same challenges, and that means that academics
    often don''t have access to scholarly literature. That limits their ability to
    fully participate in the academic process''.


    Dr. McCrane explains her solution to this problem. ''The issue is that the whole
    process, start to finish, for many journals is entirely voluntary.'
