- pgno: 268
  md: 'with ‘tenure’. Once upon a time, a good research record would have been enough,
    but what you also need to do now is prove a track-record of ‘grantsmanship’. As
    in – bidding for research money **and** having it awarded. The latter is outside
    your control, of course… as we have seen, only a minority of bids are funded and
    the quality of a proposal is only somewhat causatively linked to its success (Bol
    et al., 2018; Tamblyn et al., 2018). The best way to get a good amount of research
    funding is to bid for **a lot** of research funding, and to bid for it often.
    And all the way along the line you are producing profit for the academic publishers
    that have a vested interest in you continuing to operate their profit wheel.


    How do you break out of this system? You don’t, until you’ve reached a point of
    sufficient safety and seniority where you can say ‘No more’. By then, you’ve likely
    already internalised the message of ‘publish or perish’. Those most in a position
    to break the chains are the ones most likely to be willingly struggling beneath
    them.


    We see here that Dr. Paula McCrane and a roster of peer reviewers are being suspended
    and struck off journal teams for malpractice. What we **should** see is massively
    profitable corporations punishing those that have freely provided the services
    that fuel their massive profits. The journal owners, in scandals such as these,
    escape unscathed. Not only do they draw in all the profits, they manage to side-step
    all the criticisms… such as with regard to the role they play in enabling a system
    where academics feel compelled to engage in fraudulent practices. And when all
    you get from working within this system is reputation, it stings all the worse
    to have that reputation ruined.


    Perhaps to cast it in somewhat Marxist terms – academics often feel alienated
    from the products of their labour. Few academics support this system, at least
    in theory. Few academics believe paywalls are ethically or morally appropriate.
    There’s just no obvious way to jump off of the profit wheel while so many other
    hamsters are scurrying away.


    # THE REJECTION ECONOMY


    Clement, in our article, makes a slightly different claim – that academia is not
    a gift economy. Rather, it is a rejection economy. Those on the inside will know
    just how true that is. We’ve spoken about the low funding rates for grants. Ninety
    percent of the time you’ll be told no, even after months of intensive labour building
    a consortium and developing a programme of research. We’ve spoken about rejection
    rates for papers. Again, for a ‘high-impact’ journal or conference you might be
    looking at a lot more'
