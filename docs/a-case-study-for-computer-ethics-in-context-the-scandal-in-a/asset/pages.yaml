- pgno: 55
  md: 'amounts of research grant money – raising that kind of money requires serious
    credibility. Grant money like that in turn provides an accelerator for building
    reputation – grant money funds research students and research fellows, and they
    in turn generate papers, citations, and results for the grant owner. That in turn
    builds reputation, which then generates more grant funding. It is thus very tempting
    for some academics to attempt to fast-track the building of this reputation by
    taking advantage of the ease by which data can be fabricated and the difficulty
    of reproducing results. Publishing in a niche area with a relatively low amount
    of scrutiny can allow for misconduct to be perpetrated for a surprisingly long
    time. High-profile areas with lots of attention are correspondingly more difficult
    to survive within as a ‘fake’, but it’s still possible. Conducting a research
    trial can be expensive, and the more complex it is the more moving parts need
    to be accounted for. In cases where the research cannot be replicated, academics
    also have recourse to explaining irregularities away under the guise of an artefact
    of the significance testing.


    Many of the statistical models used regularly to assess the validity or notability
    of research data produce what is known as a P-value. This is a probability that
    indicates the chance that a test ‘rejects the null hypothesis’. That’s a fancy
    way of saying that you’re rejecting the possibility that the results you found
    came about by pure chance. P values are usually measured on a scale of 0–1, where
    a 0.05 P value suggests that there’s only a 5% chance that the results are an
    artefact of chance. The lower the P value, the more likely it is that you’ve found
    a meaningful (but not necessarily important) link between the variables you’re
    examining. A P-value of 0.05 is considered ‘statistically significant’ for most
    studies, but that still means there’s a 5% chance that you’re reporting on something
    that was pure chance. It is in here that there is much room for an academic to
    defend fake results by saying ‘Well, I guess my paper was the one in twenty that
    was just a chance occurrence’. P values by themselves tell only part of a story,
    but one that can hide a lot of deceit.


    With our Professor Blackbriar, we now have a reasonable guess as to of what he’s
    being accused, but we have no idea of the extent of the problem or indeed how
    far back it goes. Perhaps we’re talking about one fudged result in one minor paper.
    Perhaps someone has uncovered a pattern of fraud stretching the length of his
    entire career. Perhaps he’s actually completely innocent and the investigation
    will indeed exonerate him. We have to be careful at this point of assuming too
    much based on the limited information that we have.'
