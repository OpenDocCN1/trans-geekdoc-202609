  md: '# THE ECONOMICS OF THE ACADEMIC GIFT CULTURE


    We have focused heavily within this scandal on the reputational damage to individuals.
    John Blackbriar, Sharon Macalpine, James Duncan, and many more will carry this
    incident with them long after its relevance fades. But a scandal like this has
    impact beyond that of individual people, and it strikes at the heart of the academic
    system itself. It’s easy for those outside of academia to be confused about how
    it all works, because it can be mystifying to outside observers. As we’ve already
    pointed out, when one of us remarks to a parent ‘I had a paper published this
    week’, that parent will almost always ask, ‘And how much do you get paid for that?’.


    It would be even more baffling if we explained that often we need to pay for a
    paper to be published – at least, if we want it to be open access. And if you
    break the academic publication system down, it does indeed seem like a system
    designed by aliens.


    +   1. Taxpayer money is used to fund academic time – either as part of a general
    ‘research’ allocation or through specific research grants.

    +   2. That time is used to conduct research, run studies, and analyse the results.

    +   3. The most interesting (ideally) parts of that work are then encoded into
    a paper, which is written, edited, and often typeset by the academics that conducted
    the research work.

    +   4. The paper is submitted to a conference or a journal, where it is peer-reviewed
    by other academics on an unfunded basis.

    +   5. The paper is (hopefully) accepted for publication, at which point the taxpayers
    that paid for it are charged to access it when it is placed on a secured site.
    This is known as a paywall. Universities will usually pay to subscribe to a large
    number of journals, allowing their academics to read the paper for ‘free’. The
    general public? No, pay up.

    +   6. By paying an average Article Processing Charge (APC) of around $2000, the
    article can sometimes be made free for everyone to view.


    In some cases subscription charges to libraries are going up at exactly the same
    time that conventional publishers are shifting to open access. In effect, we’re
    seeing not only public money funding private profits but a double-dipping in terms
    of APCs and institutional subscriptions.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'The academics, peer reviewers, and (usually) editors are not paid anything
    for participating in this process. Whenever someone pays for access to one of
    our articles, nobody who did the work gets a penny and certainly none of it goes
    back to the taxpayer that funded it. Indeed, the taxpayer is double charged in
    most cases – once for the work to be done and then again for the privilege to
    read the results. That’s even true of the academics that wrote the paper – if
    their university doesn’t subscribe to the journal, even they may have to pay to
    access their own past work.


    Where does all this money go? Well, it goes into the coffers of the multinational
    publishing houses that own the journals. And business is booming. Companies like
    Elsevier, Black and Wiley, Taylor and Francis, Springer Nature, and SAGE control
    over half of the academic publishing market (Larivière et al., 2015). That was
    worth almost $20 billion in 2022. A traditional newspaper – paying a payroll of
    journalists, editors, artists, and other expenses – may have a profit margin of
    around 10%. Journal publishers, presiding over a transfer of wealth from the public
    to private owners, may have a profit margin closer to 40% once all the accounting
    tricks are factored in (Van Noorden et al., 2013). This waterfall of money is
    not surprising given how much of their content is simply given to them by academics.
    As one conservative commentator put it, Academic? You’re just a cash-hamster spinning
    a publisher’s profit wheel.¹ It’s hard to argue, especially when estimations suggest
    that peer-reviewing by itself represents an annual ‘billion-dollar donation’ (Aczel
    et al., 2021) within the US alone. When you add in the Chinese and UK markets,
    the total comes to an estimated 2.5bn dollars per year.


    As to why this is the case though, we need to look at academic publishing in a
    different light – that of the ‘gift culture’.


    In traditional economic structures, worth is partially determined by how much
    you have, or perhaps the worth of what you create. Your outputs have a financial
    benefit associated with them, and you are as valuable as the sum of your assets
    plus your productivity. Conspicuous consumption is a consequence of this model,
    where the signal of ‘I have more wealth than you’ is a proxy for ‘And thus I am
    a more valuable person than you’.


    Gift cultures work differently. Your value is determined at least in part by the
    value of what you give away. The amount which you have freely contributed to society
    as a whole serves as the basis of your reputation. As such, to freely provide
    (or provide at your own cost) a ‘contribution to knowledge’ is your gift to the
    world. You do not profit from it, but you pass it on in the intention others will.'
