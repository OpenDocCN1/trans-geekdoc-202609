  md: 'These projects may only last a few years, at which point the ‘resource’ will
    either need to apply elsewhere for likely another temporary placement or seek
    funding to sustain their career at their current location. More and more important
    and skilled colleagues simply abandon their pursuit of an academic career entirely
    (Shelton et al., 2001) and move into the private sector (Fritsch & Krabel, 2012).
    Progression from temporary contracts on to permanent contracts is vanishingly
    rare – remember that it’s estimated that there is only one opening for every ten
    applicants. The effect is endemic and disheartening – a culture of treating valuable,
    dedicated, and highly qualified professionals as disposable assets. For women,
    the situation is especially troublesome given societal expectations regarding
    motherhood and the incompatibilities these often have with career progression.
    We cannot discount these intersectional issues.


    The growing casualisation of higher education has a corrosive effect to both individual
    careers and the long-term conduct of research. This is a consequence of the way
    in which we have quantified the academic experience. Research funds that are transient,
    unreliable, and increasingly tied to ‘impact’ are simply not sustainable enough
    to allow universities to hire researchers on a more permanent basis. This coupled
    to an overproduction of postdoctoral applicants for research positions that drives
    down the need to treat any one individual as valuable. That’s not to say everyone
    is mistreated and maligned during their early academic career, or even that it’s
    true for the majority. However, the pressures increase in line with the prestige
    of the department in which a researcher may find themselves (Niles et al., 2020).
    The competition, for one thing, is notably fiercer.


    The often misguided expectation from research fellows is that accumulated research
    prestige can eventually be parlayed into a permanent academic position. In such
    environments, a model of ‘obsessive workaholism’ seems to dominate discourse,
    with academics reporting that they regularly spend more than 60 hours a week working,
    with the concomitant impact on stress and health levels. We may have genuine cause
    to question the accuracy of these self-reported measures and how productive those
    60 hours could be. However, it’s certainly the case that researchers often feel
    the need to be seen to be working. As regressive as it is, persistent long hours
    in academia is still perceived as a symbol of dedication rather than inefficiency
    or a symptom of an unhealthy work-life balance. Again, this is not unique to academia
    – software engineering as a discipline is particularly plagued by the culture
