    we put out a public statement saying that the hacking hadn’t occurred and that
    the data being released was fraudulent. The hacker then posted a picture to a
    social media account that we monitor, showing their computer screen as they accessed
    our systems’.


    The indicated statement was released yesterday by the university and said the
    following: ‘After extensive investigation of our network access logs, we find
    no evidence that anyone has fraudulently gained access to our servers. As such,
    we must conclude that the emails leaked by the individual calling themselves Nemesis
    are entirely invented’.


    ‘The hacker couldn’t let that stand’, said Holmes, ‘And just had to prove us wrong.


    Unfortunately, he forgot to strip the meta-data from the image he posted to Facebook,
    so we got his GPS co-ordinates from that. We passed them on to the police, and
    the police picked him up late last night’.


    James Duncan has been embroiled in the growing catastrophe of crisis at the University
    of Dunglen, having been suspended for his role in a supposed case of academic
    fraud. His identification as the hacker Nemesis comes as a surprise to his colleague,
    Mrs. Sharon McAlpine.


    ‘James was the most technically adept of us’, she said, ‘But I had no idea he
    knew how to do stuff like that!’


    James Duncan spoke to us this morning after being released on bail


    and explained how he had gained access to the system. ‘It wasn’t complicated really
    – for people working with a lot of computer science, most of the people in our
    department don’t know a lot about computers. They’re engineers and mathematicians
    and chemists, not programmers or sysadmins. So they’d come to me when they needed
    something done. I knew a lot of the passwords and passkeys through the system,
    and I also knew when people had left their systems open for exploitation. Humans
    are always the weakest chain in any security regime. Some of them I didn’t even
    need to know in advance – people use the same passwords for everything, and they’re
    not very careful in choosing them. Ask someone where they grew up, the name of
    their childhood pet, and their mother’s maiden name – now you’ve got access to
    their security answers’.


    Police seized all of Duncan’s computer equipment and personal files as part of
    the arrest, and he is currently looking at prosecution under Sections 1, 2, and
    3 of the Computer Misuse Act 1990, as amended by the Serious Crime Act in 2015.
    As part of his invasion into the Dunglen computer network, he made modifications
    to systems and logs to hide his tracks, which counts as ‘unauthorised modification’
    under the legislation. Many of his activities may also fall under the general
    category of identity theft.


    We asked Detective Inspector Cameron, of Police Caledonia, who spoke to us today
    regarding the incident. ‘Not only was Mr. Duncan'
