- pgno: 277
  md: 'The implications here are significant. The NSAE project at the heart of the
    scandal had the potential to impact everything from annual earnings to stock prices
    for the ScotOil corporation. Public perception that it was successful was important
    in managing the latter of these, whereas the actual success of the algorithm is
    more important for the former. The thing is, while it is obvious that ScotOil
    benefits in the long term from wise investment and governance, it is not always
    true that such investment is the optimal path in the short term. We must consider
    here for example the business model that underlines several major industries where
    the profit comes from the philosophy ‘grow big and then work out how to make money’.
    Stock price in the short term is often seen as a larger generator of individual
    wealth than slow, steady but reliable profits (Dallas, 2011; Terry et al., 2015)
    As such, we see Lazenby here not just as a voice of counsel in the ear of Blackbriar,
    but someone who may very well now be guilty of insider trading (Jaffe, 1974).


    It is not necessarily illegal, or even unethical, for Lazenby to be on the board
    of a company working with the university – on a broader, societal level it may
    even be beneficial in some cases (Cho et al., 2017). Directors are often closely
    associated with external partners, given they represent major stakeholders in
    ongoing activities. However, here we see a clear conflict of interest (Felo, 2001).
    Dealing with these is at the core of ethical decision-making.


    There is a conflict of interest when the incentives for our desired outcome are
    misaligned with the incentives of a desired outcome of another involved party
    and they happen all the time. Conflicts of interest are unavoidable in certain
    circumstances, such as the one Lazenby finds himself in which he has a financial
    stake (through ScotOil) in the success of his colleague’s work (Blackbriar). Lazenby
    also though has a stake in authenticity in research (part of his general code
    of ethical responsibilities as a university academic), and in the financial sustainability
    of the university (through his role as university treasurer).


    The common solution here is for stakeholders to ‘disclose their interests’, as
    this is the first step in resolving a conflict of interests – transparency as
    to where those interests lie. The next step is to remove oneself from all conflicts
    where that is an issue… typically to ‘recuse’ themselves from any decision-making
    and refrain from commenting or providing advice. It is a transparent ‘interest’
    for example for someone to want a friend to get a job in the same company. It
    is a **conflict** of interest when that person also has decision-making responsibility
    in that employment, at which point a recusal is appropriate (Mecca et al., 2015).'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Professor McManus in turn has a slightly different conflict of interest here,
    in that he perhaps does not stand to benefit personally (as best we can tell)
    but is in the position of ruling preferentially on decisions that will greatly
    advantage his workplace and burnish his own reputation as a result. He also has
    an interest in ensuring public perception regarding his previous decisions (heading
    the research ethics board) does not sour.


    Dealing with these conflicts is not necessarily difficult – we have ethical systems
    in place to permit this kind of thing to be done cleanly. It seems likely though
    that Lazenby has not transparently declared his interests (otherwise it wouldn’t
    be a surprise to anyone) and did not recuse himself from any decisions involving
    his university when on the ScotOil board. McManus in turn should likely have recused
    himself from consideration of any potential EFC grant application that came from
    his university (Lemmens & Freedman, 2000).


    As usual, it’s not quite that simple. Chuma Hasan points out that Lazenby has
    an impeccable reputation for scrutiny. Recusal though isn’t a tool for removing
    people because they’re biased – people can mentally control to an extent for biases
    they know exist (Moore et al., 2010; Wilson & Brekke, 1994) although with notoriously
    unreliable results. Recusal is for making sure that the biases we **don’t know**
    we have don’t sneak in. It is likely that Lazenby believed his vote was purely
    objective and evidence-based. It’s entirely possible that it was – those with
    a reputation for fair-mindedness may value it to the point of being **more** critical
    of things in which they have a vested interest. It may be that the absence of
    Lazenby would have left the committee with a knowledge gap that would have resulted
    in a worse outcome. Recusal may in the end be a luxury in some circumstances,
    since it requires someone else step up in the place of the person recusing themselves.
    Maybe there was no one available. All of these things are perfectly possible,
    and perhaps even probable. However, when things go bad, they are justifications
    that ring singularly hollow.


    When such conflicts cannot be dealt with, because they involve no clear path through
    which all interests can be satisfied, then such conflicts of interest should be
    disclosed to all stakeholders. It’s then possible to decide upon the primary stakeholders
    and make sure all other stakeholders know where they stand in comparison.


    Consider the work of a game reviewer – do you stand with the publishers as a cheerleader
    for games, or with your readers/viewers as an authentic voice of criticism? It’s
    fine to be on the side of the game makers, provided'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'you’re not trying to convince your audience that they’re the ones you’re serving.
    As a software developer, are you interested in deploying robust feature-sets for
    your users or for ensuring the financial sustainability of your employer? What
    gets sacrificed when you pursue one over the other?


    Resolving a conflict of interest requires deeply engaging with these questions.


    Lazenby and McManus don’t really have the luxury of saying that their external
    responsibilities are the ones with they are most dominantly aligned – their operational
    professional activities mean that they cannot recuse themselves from the day job.
    As such, their only real option was recusal and they did not exercise that option.
    Or at least, so this article would have us believe.


    But under all of this, we see another ethical issue – a kind of debunking of the
    myth that research funding – and professional success in general – is a meritocracy.
    In truth, the quality and originality of a research proposal is only somewhat
    correlated with its eventual success (Cicchetti, 1991; Lane et al., 2022; Pier
    et al., 2018). The collaboration to which researchers are invited is largely a
    function of ‘culture fit’. Those that are prohibited from alcohol by religious
    or personal convictions can find themselves locked out of social activities, which
    may leave them largely forgotten when it comes to promotions and preferment. On
    the other hand, a regularly shared cigarette break with a superior can have positive
    career implications simply by virtue of time spent together.


    We can detect here in our case study the scent of cronyism where colleagues help
    each other navigate the treacherous and difficult terrain of research accomplishment.
    Funding rates of under 10% are not uncommon in the modern research economy – as
    in, for every ten grants submitted only one will be funded. That stark statistic
    hides the real truth though, which is that 10% gets a lot higher if you know the
    game and have a second player to help you along – something known in the literature
    as organisational proximity (Mom et al., 2021; Sandstrom & Hallsten, 2008; Travis
    & Collins, 1991). ‘Networking’ in many cases is a synonym for a systematised and
    ongoing conflict of interest that excludes many – particularly women (Schiffbaenker
    et al., 2022), people with disabilities (Swenor et al., 2020), and minorities
    (Nikaj et al., 2018) – from getting a fair hearing in supposedly ‘objective’ processes.
    John Blackbriar got his funding – who were the people that didn’t get funded because
    McManus helped convince a funding panel that his university was the optimal destination
    for the money?'
