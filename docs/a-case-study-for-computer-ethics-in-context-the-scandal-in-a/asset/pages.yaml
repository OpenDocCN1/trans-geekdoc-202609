- pgno: 228
  md: '# 222 ■ A Case Study for Computer Ethics in Context


    nationally and internationally on projects that may involve a baffling array of
    legal complication and technical compromises.


    Consider a scenario where a UK academic is using a piece of research software
    they have written for a Linux server they run. It cross-references student attainment
    versus social media activity – all ethically above board – and then compiles the
    analysis of these data points into an inter-rogable source that can be used for
    academic publication. And now imagine that they are collaborating with three other
    academic partners – one in China, one in Sweden, and one in the USA. And then
    imagine they all need to share equivalent data with each other and have it examined
    both individually and then in aggregate to explore the link between social media
    presence and grades across national boundaries.


    It’s not an uncommon structure for a project, but it’s one sufficient to make
    any security professional, IP lawyer, or compliance specialist weep at their desk.


    For one thing, given that it’s an academic writing the software – how secure did
    they make it? Does it leave ports open, intentionally or otherwise? Does it expose
    an API? Is it properly sanitising input? Is it using the latest versions of all
    its libraries given that most exploits are rooted in pre-existing software packages?
    What software stack does it use and how does it make the connections between the
    various layers? What tool-chain is used for development and what provision is
    made for cleaning the outputs?


    What of the server? Is this appropriately protected and running a secure OS? Who
    else is using it and what permissions do they have? Have all the software package
    they have used been secured? How reliable is the architecture? Consider how much
    of the internet fell apart when popular software package Log4j failed.


    These are not idle concerns. One of the authors of this book almost lost a private
    server to hackers because he had set up a default WordPress install for the use
    of someone else. They had temporarily set the username and password to the same
    thing, expecting that to then be changed by the new admin – not secure, but still
    normal practice. The other user neglected to change the password for several months.
    The result was that malicious actors used that username and password combination
    to gain access to the admin menu of the second WordPress install, which gave access
    to the server, which gave access to every piece of software running on that system.
    There was no legally compromising data on the server, but it did have implications
    for the research project that the server was supporting (Heron et al., 2018a,
    2018b).'
