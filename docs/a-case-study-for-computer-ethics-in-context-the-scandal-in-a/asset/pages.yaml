    > > When I tell friends outside medicine that many papers published in medical
    journals are misleading because of methodological weaknesses they are rightly
    shocked. Huge sums of money are spent annually on research that is seriously flawed
    through the use of inappropriate designs, unrepresentative samples, small samples,
