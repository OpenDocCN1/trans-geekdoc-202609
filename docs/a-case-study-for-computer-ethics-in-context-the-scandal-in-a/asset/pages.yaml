- pgno: 202
  md: '# 196 ■ A Case Study for Computer Ethics in Context


    On one level, it’s good practice for staff to cross-talk amongst themselves about
    individual students – it permits the identification of problems (Graham et al.,
    2016), facilitates interventions at the earliest opportunities, and generally
    permits important information to permeate through a faculty. Knowing a student
    has had a bereavement, even if it is through gossip and back-channels, can be
    the thing that encourages a lecturer to be additionally and mindfully supportive
    during an interaction. That in turn can be exactly what a fragile student needs
    at the time. The authors can say that most of the ‘gossip’ we have seen as academics
    is positive or supportive – making sure student accomplishments are made known
    within a department or ensuring the circumstances are known for enhanced pastoral
    consideration.


    It certainly can’t be argued that all gossip is noble though. Its role as a facilitator
    of abuse and harassment is well studied (Branch et al., 2013). Academics are as
    predisposed to vent as anyone else. Frustrating interactions with students may
    result in fiery email chains or energetic discussion in the staff room. Occasionally
    these emails make their way into student hands, such as by a lecturer with a particular
    student on their mind emailing that student directly instead of the colleague
    that was intended. That may sound unlikely, but as the kids say these days ‘We
    have seen the receipts’. The impact such accidental indiscretion has on the relationship
    economy upon which education is built is considerable.


    Perhaps the most worrying of the concerns students have is that their ability
    to freely investigate issues is being suppressed by members of the university
    staff. Valid, and perhaps entirely innocent, investigation of staff members prominent
    in the university is alleged to have been shut down. The implication there is
    that academic freedom is being suppressed through monitoring and surveillance
    of student activities. This is likely something counter to the university’s own
    policies regarding acceptable use of university resources as well as the university’s
    legal requirement to support an environment in which academic freedom is protected.
    However, the latter of these is something that has always, in practice, been secondary
    to the reflexive instinct of a university to protect itself and its brand (Christensen
    et al., 2019; Giroux, 2006; Lieberwitz, 2002; McLelland, 2019; Wilson, 2015).


    Citing the existence of a policy by itself is often enough to convince people
    they are in violation given how such policies are often baroquely worded, ambiguously
    applicable, and implicative of dubiously justifiable penalties and dire costs
    for violation. Social pressures though are powerful, and when instructions to
    refrain from an activity come from someone in a position of'
