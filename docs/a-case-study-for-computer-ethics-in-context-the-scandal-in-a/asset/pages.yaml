- pgno: 215
  md: 'Sachoulidou (2023) has argued that big data has cut away at the presumption
    of innocence that is the basis of justice in most of the developed world. It may
    very well be that, encoding biases as they do, algorithms in sensitive areas like
    recruitment, sentencing, and medicine might actually be in clear violation of
    long-standing equality legislation. Modern discourse centres on the role of generative
    AI in accelerating an existential crisis for human relevance. The crisis began
    long ago – we’re only really just catching up to how much of our lives are automated
    in unknowable ways.


