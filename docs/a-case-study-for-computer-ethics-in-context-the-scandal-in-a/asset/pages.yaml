  md: 'members in good standing. Most employers put forward formal ethical requirements
    within a contract, and that contract will usually contain clauses that require
    you to adhere to any other official policies put forward by the employer. Often,
    this will include an additional code of conduct. Failing to adhere to these codes
    can result in termination of employment.


    There are layers and layers of these codes to which we must adhere, and they don’t
    always fall into perfect alignment with each other, or with what we may ourselves
    see as ‘moral behaviour’. A lawyer who believes his or her client to be guilty
    of a heinous crime may feel morally justified in ‘throwing the case’. Ethically
    and professionally, they are bound by a code of conduct that requires them to
    give as effective legal representation as they can. If we all always agreed on
    what is the ‘right’ thing to do, we wouldn’t spend so much time arguing about
    it.


    That’s an important point to take away from this case study – argumentation is
    important, because it allows us all to explore the differences in our assumptions,
    our mindsets, and our understanding of how best to resolve ethical incompatibility
