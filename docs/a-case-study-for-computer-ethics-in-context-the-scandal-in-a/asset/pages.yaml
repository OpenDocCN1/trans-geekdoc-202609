- pgno: 9
  md: 'educator must spend a lot of time talking around the historical quirks of the
    study if it is to be used to illustrate issues of modern ethics. In effect, the
    footnotes overwhelm the content.


    And thus, we introduce the Scandal in Academia.


    This book owes an enormous intellectual debt to Richard Epstein’s original case
    study. The Scandal in Academia is presented not as a replacement to the Case of
    the Killer Robot, but as a complement. It provides a fully integrated ethical
    case study in the same style but chooses a different scenario and introduces different
    issues, many of which were not part of the Killer Robot scenario. In 1994, few
    people would have dreamed of how social networks would change the way in which
    journalism worked, or how controlling access to information online would be a
    Sisyphean task with little hope of success. Accessibility of information and discrimination
    in the workplace were issues that didn’t have the prominence they do now. These
    elements and more are incorporated into the Scandal in Academia as major issues
    for consideration and debate.


    It’s not our intent within this text to paint a cartoonish picture of ‘right’
    versus ‘wrong’.


    We will not attempt to proselytise a particular ethical position. This case study
    is used as a jumping off point for discussion of the surrounding issues. An illustrative
    discussion of how we might draw in the complexity of the real world is provided
    after each of the case study articles. No claim is made that this discussion is
    definitive or even necessarily comprehensive. It’s just an example of where the
    discussion could go. We expect, and encourage, users and students to disagree
    and to come up with counter-examples. This is, indeed, why a case study of this
    nature is such a useful pedagogical tool.


    The case study may be used in many ways, and the authors of this chapter have
    profitably employed both this study and the Killer Robot study which inspired
    it. However, key to the study is the layering of revelation – each article needs
    some time to ‘sink in’, and each requires discussion and consideration of how
    the perceived responsibility of each player manifests over time. First, readers
    must identify the ethical issues that are raised, and then how these may have
    contributed to the emerging story at the heart of the scenario. These issues,
    once identified, become discussion points for individual or group consideration.
    We provide a full outline of how to employ this study in Chapter 2. In such classes,
    what is most valuable is the discussion – in the best cases, classroom engagement
    will reveal moral and ethical points that are perfectly valid and yet things that
    we as authors'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'had never considered. Importantly though, this book is not intended to put
    forward our view, but instead to give common ground for issues to be discussed
    and then gradually nuanced.


    A significant disclaimer is needed here before the articles are presented. Almost
    all of the issues discussed in this case study have been inspired by real life.
    Some of them we read about, some of them we directly experienced, and some were
    experience by others we know. The incident outlined herein is an entirely fictionalised
    composite of these elements, and those elements have been reshaped and restructured
    to support our case study. This case study does not reflect any organisation with
    which we may have been associated. The characters involved may occasionally share
    personal traits with individuals with whom we are acquainted, but they are not
    stand-ins or composites of anyone in particular. As the old disclaimer goes, ‘any
    resemblance to persons living or dead is entirely coincidental’.


    # MAP OF THE SCANDAL


    The Scandal in Academia is large, with the core text consisting of 14 separate
    articles which should be read sequentially. There are also several additional
    articles which provide additional perspectives that are not core to the narrative.
    Each of these core articles introduces a new set of ethical issues or reinforces
    issues previously introduced. Each layers further complexity onto the core story
    and introduces new pressures and incentives for the behaviours of everyone involved.
    It is expected that reader perceptions of all participants will change as new
    information is made available. One of the core aspects of this case study though
    is that our entire view of the scenario comes through one source – the local newspaper
    for the city. As such, even the information we are presented is not necessarily
    completely accurate, complete, or unbiased. A common thread throughout the study
    is verifying and evaluating the information we are presented, and readers should
    be encouraged throughout to question the motivations of those who are presenting
    us with the information. That includes us, as the authors.


    # Article One – A Scandal in Academia


    In this chapter we learn about Professor Blackbriar and his suspension from the
    fictional University of Dunglen. He is alleged to have participated in scientific
    misconduct, and the initial newspaper article includes comments from the principal
    and others about the role of ethics in professional life. This serves as the introduction
    to the case study, and an opportunity for educators to discuss whatever ethical
    codes and moral foundations they'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'feel are appropriate within the context of their courses. Concentrating on
    a fixed code such as the BCS Code of Conduct or the ACM Code of Ethics would be
    a useful way of anchoring the discussions to follow, but the material can also
    be productively used in an agnostic fashion.


    # Article Two – Student Suspensions at Scandal-Ridden University


    In this chapter we find out that two of the professor’s postgraduate students
    have been suspended, and we learn a little more about the commercial interests
    that may have exacerbated the situation in which the scientific misconduct may
    have occurred. Ethical issues introduced here include corporate interests in academia;
    reputational damage; transparency of artificial intelligence; the environmental
    impact of blockchain technologies; and the issue of reproducibility in science.


    # Article Three – Multimillion-Pound Consequences for Research Fiddle


    In this chapter we get to know some of the context of the professor’s work, and
    the likely financial consequences if the allegations are true. We find out that
    his research has been used in several important projects, and that there are many
    millions of pounds on the line if his research does not produce the promised results.
    Here we introduce the issues of corporate influence in academia and the impact
    of academia on industry; speculative investment on the basis of uncorroborated
    research; how Coronavirus and other international incidents can impact on just-in-time
    economies; and the mental biases that impact on good decision-making.


    # Article Four – Students Speak Out


    In this chapter we get to hear the story from the suspended students. They tell
    a tale of academic serfdom and the power of social contexts. They discuss the
    difficulties in keeping an important colleague happy, and the impact that might
    have on their eventual future success or failure. Ethical issues introduced here
    include workplace relations; power differentials; the role of the postgraduate
    student in modern academia; closed data sets and the publication imperative; sexism
    in the workplace; large language models and AI authoring; workplace bullying;
    and issues of accessibility of information resources.


    # Article Five – Leaked Minute Lays Bear University Culture


    In this chapter we find out about a minute leaked from the principal’s office
    in which he tells all staff members that if they cannot acquire funding for'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'their projects then they and their dependent staff would be dismissed. We also
    find out the impact that research assessment exercises have had on the university’s
    past and present league table standings. Issues introduced here include the ethics
    of whistleblowing; the impact of quantification in academia; ranking systems and
    the gaming thereof; the pressure to generate grant money; civic engagement in
    large organisations; and ivory tower academia.


    # Article Six – BrokenBriar Affair Heating Up – Lawyers Involved


    In this chapter we find out that the suspended students have hired a lawyer to
    fight their case. Lacking access to the professor’s proprietary data sets, they
    argue they had no culpability for any research fraud. We also discuss the culture
    of doctoral studies in universities, and how these are often a poisoned pill for
    those seeking a career in academia. Ethical issues introduced here include fraud
    in data gathering and presentation; legal issues in workplace dynamics; ‘sacrificial
    lambs’; career potential and how it can be damaged; career stability; performance
    metrics; the differential between jobs available and graduates produced; and the
    plague of short-term contracts in higher education and beyond.


    # Article Seven – Senior University Members Implicated in Growing Scandal


    In this chapter we find out that an anonymous hacker is accessing university systems
    and leaking the information contained within to the press. Included in these leaks
    are emails from senior members of the university who encouraged Professor Blackbriar
    to fudge his data results to secure research grant funding. Ethical issues introduced
    here include the extent to which data can be sanitised without compromising its
    integrity; fixed thresholds for ‘significance’; the categorisation of outlier
    data and the mental biases that influence the same; disclaimers; the security
    of data online; pilot studies and pilot data; dissemination of confidential information
    online; and file sharing generally.


    # Article Eight – Drunken Professor Lashes Out in Twitter Storm


    In this chapter we find Professor Blackbriar’s Blether account filling up with
    allegations against co-workers, superiors, and his postgraduate students. He later
    claims the account was hacked. Further emails leaked by the university hacker
    reveal more pressure to publish from the principal.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Ethical issues introduced here include social media use; ‘being hacked’ to
    avoid the consequences of misconduct; pressure from above; the factionalism of
    social medial; algorithmic assessment of online opinion; fear as a motivation
    tool; publication ethics for co-authors; and the cherry-picking of publication
    data.


    # Article Nine – Culture of Fear and Nepotism at the University


    Additional leaked emails reveal the culture of fear at the university and the
    personal profiles sent around about the applicants for Blackbriar’s research programmes.
    We find the chair of the research ethics committee engaging in casual misogyny
    and warning of the financial implications of hiring someone with visual impairments.
    Ethical issues introduced here include freedom of speech through anonymity; social
    proofing; artificial intelligence and the ‘resume sift’; the impact of influencers;
    social media trolling; Deep Fakes; censorship; the impact of league tables on
    graduate prospects; discrimination in recruitment; the culture of fear in organisations;
    nepotism; conflicts of interest; and demographic equality.


    # Article Ten – Witch-Hunts at the University – IT

    Crackdown Causes Criticisms


    In this chapter we learn of how the university is attempting to silence dissent
    and plug leaks by restricting access to outside computer services. Students are
    suspended as they work around the restrictions, but the university remains unrepentant.
    Ethical issues introduced here include codes of conduct; access to information;
    proportionality in punishment; name and shame; plagiarism in the age of artificial
    intelligence; ethical AI policies; shared resources and the tragedy of the commons;
    retroactive changes in terms and agreements; and bypassing corporate restrictions.


    # Article Eleven – Hacker Is Postgraduate Student


    The hacker is revealed to be one of the postgrad students implicated in the growing
    scandal. The use of social network surveillance and the extraction of metadata
    is discussed to explain how the hacker was caught. Issues of computer security
    are likewise discussed. Ethical issues introduced here include disclosure for
    ‘the public good’; the extraction of metadata online; the illusion of anonymity;
    social engineering; system security; computer misuse legislation; verifiability
    of whistleblower information; monitoring of computing resources; EULAs and agreement;
    and informed consent.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 8 ■ A Case Study for Computer Ethics in Context


    # Article Twelve – Clean-Out at Scandal-Linked Journals


    The journals where Blackbriar and his students published their results have a
    clean-out, firing peer reviewers and deputy editors. Conflicts of interest in
    the peer review process are cited as justification, and the role of academic paywalls
    in the publication process is discussed with reference to both commercial and
    open access outlets. Ethical issues introduced here include the role of peer review;
    editorial assent; the cost of journal subscriptions and access to information;
    open access; pools of expertise; generative AI in journal output; gift cultures;
    the rejection economy; and the value of reputation.


    # Article Thirteen – Student Journalism Outs Senior Academics


    Serious conflicts of interest within the industry collaborations of Professor
    Blackbriar are revealed. Student journalists on Facebook explore the Internet
    Archive and find committee membership lists and minutes that show a link between
    university academics and the companies that provided funds. Ethical issues introduced
    here include board membership for senior academics; freedom of information legislation;
    generalising pilot data; conflicts of interest; corporate funding of academic
    research; hiding information online; the deep internet; internet archival; and
    the persistence of resources.


    # Article Fourteen – Resignations All Around at the University of Dunglen


    Many senior members of the university resign and move on to other posts. The consequences
    of the scandal at the university for remaining staff and students are discussed.
    The ethical issues here include use of honorifics; golden parachutes; hand-tying
    clauses such as no-compete and non-disparagement; PhD funding transferability;
    the idea of the ‘bus factor’; fragility of data processing chains; recruitment
    and institutional reputation; staff churn and attrition; and lost institutional
    knowledge.


    # POSTSCRIPTS


    Completely new to this book are several postscript articles that are set approximately
    five years after the scandal came to public attention. They do not come with any
    additional commentary from the authors and are provided purely for wider context.
    Primarily they are intended to surface some perspectives that may not have ‘served
    the narrative’ of the reporting. They do not change anything in the core story
    but still offer insights that the participants felt worth sharing, all those years
    later.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Postscript One – Sharon McAlpine Interview


    This interview is a supporting document that gives the deeper perspective of one
    of the characters within the study. This is Sharon McAlpine, talking about her
    experience as a young mother in academia, and how the systems she worked within
    contributed both to her role in the scandal and her general feelings about working
    in research.


    # Postscript Two – Stan Templemore Interview


    Stan Templemore was a background character within the study – talked about, but
    rarely talked to. This interview serves to give his perspective on the scandal.
    It gives the reader some insight into what bystanders had to contend with and
    the way in which the fortunes of the principal players overshadowed the damage
    to everyone else.


    # Postscript Three – Jack McKracken Interview


    Jack McKracken was the author of each of the newspaper articles, and after he
    broke the story of the scandal, he found himself riding a significant upward career
    trajectory. His perspective was largely un-examined within the core case study
    – after all, why would he critique his own work when it was doing so much good
    for the paper. This interview is his chance to reflect on his own coverage with
    the benefit of a little distance.


    # Postscript Four – Professor Blackbriar Obituary


    Professor Blackbriar did not live to see his obituary – few people, after all,
    do. He was, throughout the study, remarkably tight-lipped on the whole. Here we
    may reflect on his epitaph and what others may say of us when our own time comes.
    Would Blackbriar’s obituary have been happier, or more laudatory, had he behaved
    differently in his work life? What might we all have time to change in our own
    professional practice, and is that change worth enacting?


    # CAST OF CHARACTERS


    The following is the cast of characters for the case study. These are introduced
    throughout the course of the articles, but the full list is presented for reference.
    Some minor spoilers are present in the descriptions for certain characters, and
    as such it is not advised to present this list in its entirety when the case study
    is being discussed for the first time.


    +   1. Jack McKracken – Reporter and presented author of each of these articles.'
  merge: -1
  img_proc: true
