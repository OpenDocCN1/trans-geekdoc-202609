- pgno: 252
  md: 'Isn’t it funny how you get an urge to visit a foreign country and the next
    thing you know all your ads are for travel agents? It’s not a co-incidence. Your
    every click is under scrutiny.


    In some respect though, this is a good thing. Few could argue at the value to
    be found if EXIF data helps police arrest a child pornographer – as happened to
    Donald Post in 2013 (Ramirez et al., 2015). Or if careless photographs of criminals
    reveal patterns about their activities. Sicilian police in 2014 for example used
    phone metadata to map out gang activities that were otherwise opaque (Fielding,
    2017). The availability of metadata is not, in itself, a negative state. And neither
    is the increasing role that technology plays in our lives, although as always
    there is a dangerous game being played out between our rights, our responsibilities,
    and our expectations of privacy.


    That said, this all does have profound implications for that privacy especially
    as smart devices become more and more integrated into the home environment. The
    Internet of Things (IoT) has turned every part of our existence into something
    more quantifiable – and analysable – than any dystopian prophet could have predicted
    even as recently as 20 years ago. The extent to which modern society has given
    up its privacy for its convenience is remarkable, and it’s starting to show problems.
    Not just in the metadata, but in the extent to which we are giving up control
    of our own environments.


    In 2019, Ashley LeMay released a harrowing video of a Ring security camera that
    had been placed in her eight-year-old daughter’s bedroom. The video shows a hacker
    talking to the little girl. ‘Who is that?’, the girl asks. The hacker replies,
    ‘I’m your best friend. Santa Claus’ (Ramaley & Brooks, 2020). The same year, a
    Ring camera located in the Brown household in Cape Coral was hacked so as to permit
    racial slurs to be thrown at the family in their own home.


    Despite Amazon assurances to the contrary, the smart device Alexa has been shown
    to record private conversation and even transmit those conversations to other
    people (Ford & Palmer, 2019). Samsung televisions are acknowledged to record the
    conversation in your living room (Gray, 2016), and the small print also says that
    conversation can be sold on to third parties (Ghiglieri et al., 2017). In many
    respects this mirrors the common help-line refrain, ‘your call may be recorded
    for training purposes’. And why not? The evidence suggests after all that most
    consumers are willing to take a privacy hit in exchange for the conveniences of
    an internet-enabled television (Ghiglieri et al., 2017).


    Again it is not as simple as saying ‘this is bad’ because of the fact these technologies
    are tremendous enablers of life improvements. Smart devices have created accessibility
    where none was previously available. They have'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'streamlined life’s difficulties. And when used properly, they can combat climate
    change by ensuring efficiency and optimisation of energy usage within a home.
    Clearly this comes at a cost – particularly when we consider the increasing burden
    of technological knowledge each person is expected to master – but for many that
    cost has been shown to be more than worth it for the benefits.


    We also have to ask ourselves the question – what is the alternative? Given the
    interconnectedness of our lives, what can we even do to ensure that people are
    aware of the implications of their data hygiene? Imagine a world where everyone
    had to agree, every time, to share data with the devices they use on a regular
    basis. What would such a world look like?


    You don’t really have to think all that far before you come to a common example,
    cookies in your browser. We hear about these all the time, but it’s often unclear
    what they are. In their simplest terms, they are little packets of data stored
    on your computer when you visit a website. They may contain things like your user
    ID, your interaction history with the site, or realistically anything else. The
    protocols that drive the web are known as ‘stateless protocols’, which means that
    every time you visit a website it’s as if it was for the first time. The solution
    to this has been to employ cookies. Our browser is an unfamiliar face at a party,
    and the cookie is a ‘the story so far’ document we provide to the host to remind
    them of all their previous interactions.


    Cookies have, for a long time, been at the vanguard of public concerns about privacy
    on the internet because of the ways in which they have been used. Websites themselves
    are often made up of resources from multiple different parts of the internet.
    In order to track user stats, for example, many websites will use an analytical
    package that gets called in every time a page is loaded. They may draw in images
    from other locations or build pages in real time from code that is working invisibly
    in the background. And in some cases, those resources might be things like the
    Facebook pixel we discussed above. The cookies on your computer, in other words,
    don’t always come from the site you are visiting. So-called ‘third-party cookies’
    have a providence of which you, as a user, may not be aware. Advertisements that
    follow you around the internet, for example, are almost always a consequence of
    third-party cookies working in conjunction with the digital fingerprints we leave
    behind (Eckersley, 2010).


    Understanding user concerns about this, the EU included provisions regarding cookies
    in the GDPR. Specifically, websites must provide users the opportunity to accept
    or reject cookies when they visit a site. Explicit consent is now required, even
    if that is difficult to regulate in a way that lends the legislation any teeth
    (Nguyen et al., 2021).'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'It seems like an ideal solution, empowering users to decide for themselves
    what they trust, and do not trust, online. However, in real terms what it has
    done is create a web environment where the once-derided ‘advertising popup’ has
    been resurrected. And in a form that is almost unavoidable unless you delve into
    the world of plug-ins or the depths of your browser settings. That in turn requires
    a degree of computer literacy that many users, particularly older users, simply
    do not possess (Heron et al., 2013) and a willingness on content producers to
    refrain from the dark patterns that obfuscate understanding (Soe et al., 2020).
    That the popup is ostensibly for our protection has not reduced the irritation
    it has created (Giese & Stabauer, 2022; Kulyk et al., 2020).


    We find ourselves then in an unfortunate situation. We are swamped with so much
    information we fall into a kind of choice fatigue (Bauer et al., 2021) that results
    in us tuning out and simply choosing the path of least resistance with predictable
    consequences. However, if we are not given the opportunity to consent on a case-by-case
    basis, we have other issues in terms of being uninformed about where our data
    is created, used, and sold. And make no mistake – our data is valuable. Facebook
    alone collected $82 for each of its American users in 2017. This was a sum that
    it raised largely through selling their data on to advertisers through powerful
    targeting tools that let campaigns reach individuals that match very precise segmenting
    needs. Do you need a campaign that reaches women in their 30s with an interest
    in technology and gaming and with demonstrated interest in left-wing causes? No
    problem. Here’s your bill.


    The secondary cost of this is in terms of how much we can trust those that hold
    our data. Data breaches are common, as we have already discussed in this book.
    Malicious abuse too is rife – we saw in the 2010s that vast amounts of user data
    were harvested by firms such as Cambridge Analytica (Isaak & Hanna, 2018). They
    then built this data into powerful analytical and targeting tools that were sold
    on to political actors and perhaps even the agents of unfriendly states.


    In the scheme of things, perhaps the odd EXIF mishap isn’t really where we should
    be directing our anxieties.


    # SOCIAL MEDIA POLICIES


    There’s another topic too that is connected to all of this, and it ties back into
    what we discussed in a previous chapter with regard to brand management. Universities
    have a responsibility to police their reputation and often employ specialists
    and analytical tools in service of that goal. One might'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'even think of this as a social good that is for the benefit of all students
    – after all, the value of a degree derives at least partially from the prestige
    of the institute that awards it. Simply having a degree from Cambridge, Oxford,
    Harvard, or MIT is often more valuable in terms of social capital than any knowledge
    the studies themselves imparted. As such, if a university allows its name to be
    degraded it will have a tangible knock-on effect for all staff and alumni.


    Organisations all over the world now regularly patrol social media for mentions
    of specific keywords. After ten frustrated and fruitless emails to a corporation
    asking them to honour their contractual obligations to a consumer, it’s often
    galling to see a single angry public tweet do better than ‘working within the
    system’ ever could. ‘I’m sorry to hear that, please send a direct message so that
    we can resolve this issue’ will be the almost instant response that the visibility
    of social media can bring your way.


    That’s not to say that the customer support via social media is better – just
    that it is more public and thus companies are incentivised to make sure they **appear**
    to be responsive. The request to ‘take it to DMs’ is not for efficiency of communication,
    not entirely. It’s to move your public complaints once again into a private domain.
    Corporate social media accounts are railway junctions, shunting oncoming train-wrecks
    into quiet sidings that have few, if any, witnesses.


    You don’t even need to tag in the company in a lot of cases. Social media tools
    allow for companies to track mentions of their brand across the entirety of the
    open internet even if you made no attempt to directly include them in the tweet
    or post. Just mentioning them by name can be enough to turn the corporate eye
    of Sauron your way.


    If you could have any superpower, what would it be? We don’t know about you, but
    the one we most **wouldn’t** want would be telepathy. We don’t want to know what
    people are thinking about us. We only barely want to be aware of what they are
    **saying** about us. For the authors, and many others, ‘googling’ ourselves is
    a risky proposition. Maybe you’ll learn lots of lovely things about yourself.
    For some though, it’s like turning up to a party in your honour held by people
    that hate you. It’s best in many cases to avoid such self-destructive online activities.


    Organisations don’t have that luxury – they need to massage the public perception
    of their brands and to make sure they are seen as responsive to public pressure.
    And on a punitive level they need to ensure that libelous claims or confidentiality
    breaches are effectively policed. There are considerable consequences for a company
    that does not protect itself in'
