  img_proc: true
- pgno: 232
  md: 'quite strong in the world of art. Dall-E, MidJourney, and other platforms on
    the other hand will quite happily create images in almost any style with no complaints
    or hesitation. And, importantly, with no acknowledgement of source or of the intellectual
    debts incurred. Artists have cause to be worried – a piece of Midjourney-generated
    art won a fine arts competition last year, and that outcome resulted in an outpouring
    of artistic anger in response.⁷,


    However, in this we have to accept that it is simply not possible to put the genie
    back into the bottle. The word ‘disruptive’ is overused in modern technological
    discourse, but it is exceptionally apt when it comes to the future of this specific
    technology. Just as society is now divided into two eras – post- and pre-pandemic
    – we are now divided into post- and pre-AI.


    Bostrom (2019) put forward an interesting way of thinking about technological
    development. Imagine every time a new technology is invented, it’s pulled in ball
    form out of an urn filled with invisible and infinite possibilities. Some of the
    balls come out white – they are unquestionably beneficial to society. Medicines
    and vaccines, agricultural innovations that solve famine, that sort of thing.
    Most of the balls are grey, which is to say they have mixed blessings. They have
    some good features, and some bad features, but the extremes of both can be absorbed
    by society without existential threat. However, lurking in that urn are also black
    balls – technologies that will inevitably destroy humanity as a direct and causative
    consequence of their invention. We have been exceptionally fortunate as a society
    that all the world-ending technologies that have been invented are costly, complicated,
    and governable. Imagine where we would be if the ingredients for a nuclear bomb
    could be sourced from the average home garage. The difficulty and detectability
    of refining weaponised chemical compounds though is the preventative measure that
    ensures that a home-grown nihilist can’t destroy a city, and a network of such
    nihilists cannot destroy a world.


    Generative AI though is a massively disruptive technology, arriving in a society
    that is not yet adapted to its presence. It is also, comparatively, exceptionally
    cheap and easy to replicate. Everyday citizens probably don’t have enough in their
    bank account to train something of the scale of GPT3, but the cost is in the very
    low millions as opposed to the billions. Some estimates suggest that GPT3 cost
    around $25m to train the first time. It’s not peanuts, but it’s not equivalent
    to the estimated $25bn (adjusted for inflation) associated with the Manhattan
    project. As computer resources'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'continue to get cheaper, that cost will go down. As the cost goes down, more
    private citizens will have access to the resources needed to build their own specialist
    systems. People will find new ways to use these techniques to disrupt ever greater
    portions of the human experience – the AI aggregator ‘There’s an AI for that’
    already has thousands of entries for specialist AI tools. We’ve focused on text
    and images in this book, but there are hundreds of problem domains in which AI
    techniques are starting to dominate.


    Some downplay the risk of AI, pointing out that even at its best AI will fail
    to match the skill and creativity of a talented human. The authors of this book
    believe that to be true. However, we also believe that’s less reassuring than
    people think. The threshold at which AI obsoletes a human is not that it exceeds
    our competence, but rather that it passes the threshold of being ‘good enough’.
    At that point, the value comparison becomes ‘Excellent for lots of money’ or ‘Good
    enough for nothing’. In most cases, the people in control of the purse strings
    will likely opt for the latter option.


    Our most pressing priority now, as a species, is in finding a way to coexist with
    artificial intelligence. In that frame, the University of Dunglen is perhaps gripping
    too hard on the past. Banning AI outright is like trying to extinguish the stars
    in the sky. It won’t work and you’ll just look foolish trying. As Stan Templemore
    points out, in order to understand something you need to study it. Banning all
    use of generative output is not going to solve the problem. It’s just going to
    kick a can a very short way down a very long road.


    # AN ETHICAL AI POLICY


    Related to this, we see here that the university has also implemented an ethical
    AI policy although we are not permitted to see it. As such, we can use it as a
    kind of ‘theorycrafting’ exercise to discuss what such a policy might mean, and
    what it ought to target. For that, we can start to bring together many of the
    themes we have discussed already. An ethical AI policy should try to ensure several
    things:


    +   1. An absence of bias in training materials

    +   2. Transparency of data sets and algorithms

    +   3. Explain-ability and auditability of decisions and outputs

    +   4. Respect for privacy'
