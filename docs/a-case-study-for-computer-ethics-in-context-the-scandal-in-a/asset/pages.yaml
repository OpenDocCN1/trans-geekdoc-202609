  md: '# FUNDING AND PROFESSIONAL SECURITY

    IN HIGHER EDUCATION


    The leaked minute has stirred things up further, but we need to spend a little
    time contextualising what we''re actually being told. Understanding context is
    the first step to appreciating nuance. Funding structures, particularly within
    the United Kingdom, can be complex to unpick. Although we often talk of the UK
    Higher Education (HE) sector, this is somewhat misleading. The UK is made up of
    four component countries: Scotland, England, Wales, and Northern Ireland. Scotland,
    as a consequence of the Act of Union (Arnott & Menter, 2007; Mooney & Poole, 2004),
    retains control over certain elements of its national public provision – Education,
    Law, and Religion are chief amongst these. In addition to this, via the devolved
    Parliament in Holyrood, Edinburgh exerts control over numerous other aspects of
    Scottish governance. The money to fund this work is derived from what is known
    as the Block Grant – an allocation of funds to the devolved parliament for it
    to budget according to local priorities. This funding comes from Westminster but
    is allocated according to Scottish revenues and tax receipts as a proportion of
    public spend in England. Within England and Wales, as a consequence of the 2014
    Browne Report (Browne, 2010), university teaching is funded primarily through
    student fees. Certain courses deemed to be within the public interest, such as
    Medicine, are also subsidised by Westminster.


    Within Scotland, Scottish students do not pay fees for their higher education
    as the provision of such is, at least at the time of writing, deemed to be a public
    good for the benefit of society as a whole. Funding for universities in Scotland,
    where the fictional University of Dunglen is situated, is allocated by Holyrood
    according to national and political priorities.


    This creates a complex funding context when reporting on higher education in the
    United Kingdom. Popular discussion is often flavoured by a lack of appreciation
    of the significant differences in student expectations and provision. There is
    a considerable difference in assumption between students in a system driven by
    marketisation (England, America) versus one where access to HE is still considered
    to be a public good (Scotland, Sweden). We would have much to discuss that is
    different were Dunglen situated in England simply as a consequence of student
    attitudes. As alluded to above, none of this nuance is present in the popular
    accounts of the scandal as reported in the newspaper. This may be a matter of
    necessary'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'concision; or a consequence of the assumption of knowledge upon the reader;
    or it may be a deliberate attempt to influence the presentation of the story.
    We simply cannot know and as such we must again come back to our grounding principle
    – be wary of placing too much emphasis on a single point of narration.


    The situation is complicated further by the perceived bifurcation of university
    interests into ‘teaching’ and ‘research’. Funding for the latter is even more
    complicated, coming as it does from multiple sources. One category of sources
    is the ‘Higher Education Funding Councils’, including HEFCE in England and the
    Scottish Funding Council (SFC) in Scotland. These allocations are provided as
    blocks to individual institutions, but these are not awarded equitably – instead,
    the amount particular institutions receive is directly influenced by their performance
    in the Research Excellence Framework (Martin, 2011). This is an assessment exercise
    into the impact of the research in UK universities and is conducted roughly every
    five years under one name or another. Those universities that have done well in
    research within their funding period are likely to receive the lion’s share of
    this block funding, with the others receiving comparatively little. Of an approximately
    £294.30m Scottish dispensation in 2022,¹ Robert Gordon University received an
    indicative settlement of £2.1m. Aberdeen, in the same city, received £23.9m. Dundee
    University received £21.3m. Abertay University, also in Dundee, received £1.3m.
    Edinburgh university received £91.1m. The obvious impact of this dispersal of
    funds is to create a kind of funding Matthew Effect (Merton, 1968), ensuring again
    that as a general rule ‘the rich get richer’.


    We’re seeing that principle a lot play out in this case study.


    With this in mind, many universities look to supplement these often miserly research
    allocations by seeking competitive funding from various research councils. It
    is in relation to this area that we see the principal of Dungen threatening his
    professors. Research-active academics tend to engage in continual grant writing
    to secure these funds, putting together proposals for programmes of research.
    They then use the funds that are hopefully generated to do the work that will
    put the academic, and his or her institution, in a more favourable light for future
    research fund generation. As in many things, success breeds success. Within the
    UK, funding may be at a national level through one of the bodies such as the Engineering
    and Physical Sciences Research Council (EPSRC) or the Arts and Humanities Research
    Council (AHRC). A certain degree of industry funding from larger organisations
    with dedicated research departments is also available. Some minor funding too
    can come as a result of individual'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'ad hoc collaborations. Professor Blackbriar’s funding would fall largely into
    this latter bracket.


    The funding situation has become even more complex in the UK with regard to Britain’s
    exit from the European Union. Technically speaking UK researchers can still apply
    for European funding. Horizon Europe is a huge initiative, responsible for dispersing
    around 95 billion euros of funding, and runs until 2027. The UK holds an associate
    third country status within this programme, paying access fees to secure funding
    opportunities on an equal basis to EU members. There is anecdotal evidence to
    suggest that even while the UK is a third country member with access to this funding,
    there is always a political element when UK universities are part of the consortiums
    seeking money.


    Considerable sums may potentially be available from these funding bodies. In 2022,
    Horizon Europe gave out a total of 1.3bn euros over 665 projects. Hidden in that
    success story is the failure cost – only 12% of submitted applications received
    funding. Someone applying for a starting grant from the European Research Council
    in 2022 could expect to see only a 16% chance of success. This lack of return
    on invested effort is perhaps responsible for the fall in applications – the 2,932
    applications received in 2022 is a fall of 28% from 2021, and a fall of 10% from
    2020. National funding bodies exist to supplement this European funding, allowing
    for local priorities to be addressed with more agility. The funding rates here
    are sometimes better, but often worse. One bid submitted by the authors of this
    book went to a call that had a 6% funding rate. Even for those academics that
    are successful in obtaining grants, the funds they are awarded are not the funds
    they have available for research. Universities claw back a significant proportion
    of these to fund other activities and provide support for shared research spaces
    and organisational infrastructure.


    It is in this context that we must consider the minute from the Principal’s Office.
    Those attaining the rank of professor often do so after a sustained history of
    successful grant generation – this is sometimes formally acknowledged, and other
    times tied to a nebulous definition of ‘excellent research performance’. The London
    School of Economics includes research grants as evidence of the latter. Kings
    College London has explicit expectations of funding generation including for lecturers.
    Lecturers are expected to annually generate £40,000–£50,000 of funding, whereas
    professors are expected to bring in £150k–£200k. Within the Scandal in Academia,
    we are told that professors are expected to cover the ‘Full Economic Costing’
    (FEC) of their entire cohort of postdocs and postgraduates, as well as provide
    on top of'
  merge: -1
  img_proc: true
- pgno: 126
  md: "that an additional 30% for the university. This is not an uncommon situation,\
    \ and the pressures that this exerts upon individuals struggling to meet these\
    \ criteria can have tragic consequences. Imperial College in 2014 placed Stefan\
    \ Grimm, professor of toxicology, under considerable stress because of his perceived\
    \ poor grantsmanship. Some of the tenor of this is indicated by the following\
    \ email that was sent to him by his head of department:²\n\n> I am of the opinion\
    \ that you are struggling to fulfil the metrics of a Professorial post at Imperial\
    \ College which include maintaining established funding in a programme of research\
    \ with an attributable share of research spend of £200k p.a and must now start\
    \ to give serious consideration as to whether you are performing at the expected\
    \ level of a Professor at Imperial College.\n> \n> Please be aware that this constitutes\
    \ the start of informal action in relation to your performance, however should\
    \ you fail to meet the objective outlined, I will need to consider your performance\
    \ in accordance with the formal College procedure for managing issues of poor\
    \ performance (Ordinance D8) which can be found at the following link…\n\nGrimm\
    \ continues with his own observations:\n\nOn May 30th ‘13 my boss, Prof Martin\
    \ Wilkins, came into my office together with his PA and ask me what grants I had.\
    \ After I enumerated them I was told that this was not enough and that I had to\
    \ leave the College within one year – “max” as he said. He made it clear that\
    \ he was acting on behalf of Prof Gavin Screaton, the then head of the Department\
    \ of Medicine, and told me that I would have a meeting with him soon to be sacked.\
    \ Without any further comment he left my office. It was only then that I realized\
    \ that he did not even have the courtesy to close the door of my office when he\
    \ delivered this message. When I turned around the corner I saw a student who\
    \ seems to have overheard the conversation looking at me in utter horror.\n\n\
    We see here echoes of the treatment of the fictional Joanne Clement, the Emeritus\
    \ Professor in the Anthropology of Volunteering. Joanne Clements was merely bitter.\
    \ Stefan Grimm committed suicide. An inquest"
  merge: -1
  img_proc: true
- pgno: 127
  md: 'in June of 2014 found that he had taken his own life by asphyxiation. We do
    not, in this book, profess to have any deep understanding of the complex interplay
    of pressures and personalities involved in this sad situation. Undoubtedly, the
    truth of the matter is more nuanced than public accounts permit us to appreciate.
    The basic shape of the incident though is simple enough.


    It’s a tragic story, and one which is thankfully not often repeated. There are
    other cases with less dire outcomes, such as professors being dismissed because
    of a lack of grant generation (Joyner, 2014). Even for those that do not have
    any direct professional consequence for missing expectations, the effect of the
    ongoing stress can be corrosive to well-being and mental health. However, the
    other side of this is a not unreasonable expectation of high performance from
    those that have been appointed as professors. Universities have a responsibility
    to get the most out of the money that they spend on their staff, and the idea
    of meeting targets for income generation is baked into the bones of many professions
    out in the ‘real world’. As with many things in our discussion, there is not a
    clear path through what is ‘right’ and what is ‘wrong’. Stefan Grimm’s case is
    especially poignant given the outcome, but that can only truly be appreciated
    with the benefit of 20/20 hindsight. It is safe to say though that the current
    system, as it stands, is one of potentially extreme personal cost where individual
    effort is only somewhat correlated with successful bids.


    Phenomenal pressures are often put upon research academics by their institutions.
    The circumstances under which substantial grants may be awarded is often too capricious
    for any genuinely reliable income to be generated. For those trying to keep a
    research centre running, the pressure also includes that of securing the jobs
    of other people, or at least ensuring that there is some degree of progression
    for those that may be stuck on a succession of fixed-term research contracts.
    This is not a situation unique to academia – we now live in a world of ‘flexible’
    employment where the conception of a job for life seems almost archaic. A plague
    of zero-hour contracts is in the process of robbing a significant proportion of
    an entire generation. Meaningful job security is being pickpocketed wholesale.
    Universities are a significant offender in this area but they are far from alone
    in exploiting the situation for their own ends. Those lucky enough to have permanent
    contracts have security only as long as it is within the interests of the organisations
    to which they are attached. We pay lip service as a culture to the importance
    of work-life balance. We live though in a reality where many must work several
    jobs just to make ends meet and'
