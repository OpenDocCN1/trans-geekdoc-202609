  md: '# NEWSPAPER ARTICLE


    *An exclusive report by Jack McKracken for the Dunglen Chronicle*


    The mysterious hacker known as ‘Nemesis’ was today revealed as postgraduate student
    James Duncan, who has been illegally accessing university systems for the duration
    of his suspension. Duncan was identified as a result of the university’s internal
    and external surveillance of staff and students. The university itself released
    a statement:


    > > The University of Dunglen, like most universities, employs a sophisticated
    network of monitoring to ensure that all system accesses are compliant with our
    IT usage policy. We also maintain an ongoing monitoring presence of staff and
    students with regard to social media. We


    > > look to ensure that all mentions of the institution are compliant with the
    Social Media Policy to which all users agree upon registering their affiliation.


    Terry Holmes, head of Information Technology at the university, explained how
    Duncan was identified: ‘Every time someone accesses one of our systems, they leave
    a trace. When they access remotely, they leave the details of which computer they
    used to make the connection. Our hacker used a “remote proxy” which means that
    they routed their connection through another computer elsewhere in the world,
    and so we couldn’t identify their exact location even with the'
