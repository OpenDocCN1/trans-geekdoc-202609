  md: '# SOCIOLOGICAL AND PHYSICAL ACCESSIBILITY


    Another issue raised in this article is that of accessibility – the degree to
    which technology, facilities, and information can be used by people with extraordinary
    requirements. Generally, this can be further broken down into two categories of
    accessibility – sociological accessibility, and physical accessibility. These
    terms apply equally to all kinds of modern resources, from government services
    to computer programmes to vehicles. Within this section, we will primarily refer
    to the accessibility of computer programmes and research data sets, as it is that
    aspect of the concept that is more relevant to our purposes.


    Whether due to cultural constraints, perceived stigma, or general disinterest,
    it is often the case that certain technological and societal trends are not accorded
    equal value within different groupings. The degree to which factors internal to
    these technologies and trends permit generally equal participation defines its
    sociological accessibility. The way in which certain things are presented or contextualised
    however can greatly impact on how an individual chooses to perceive their worth.
    Technology is rarely truly apolitical and often demonstrates the underlying cultural
    assumptions of its creators (Czaja & Lee, 2002; Keates & Clarkson, 2003). Consider
    for example the issues of male versus female wish fulfilment represented by many
    video games (Heron et al., 2014), and consider how the way in which explicitly
    gendered protagonists may appeal, or otherwise, to groups of men and women. Consider
    the cultural connotations of colour choice in children’s toys. Traditionally,
    this is blue for boys and pink for girls. Consider how that impacts on the choice
    of early play for both children and their parents, and the stigma that may be
    experienced by obviating cultural norms.


    More pertinent to this particular case study is the issue of physical accessibility.
    When someone has overcome whatever sociological barriers may have been in the
    way, and actively wishes to engage with technology, then the extent to which that
    technology is usable is pertinent. While things have gotten much better in recent
    years, it is still the case that software is often inaccessible to people with
    physical and mental disabilities. Blind users often find screen-reader technology
    works well for the most part. However, such technology has occasional missteps
    as a result of software not being designed to work with standard tools such as
    JAWS, and with internet conventions such as subverting alt-text or communicating
    via emojis. Users who are colour blind may find that they are unable to distinguish
    visual cues when the only differentiating factor is the colour (for'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'example, a green cursor that turns red, or red warning text). Where sound is
    used to deliver important interface information, deaf users are often disadvantaged,
    especially when viewing videos without subtitles. Users with mobility impairments
    may find that software requires too much fine-grained movement, or too many simultaneous
    key-presses, or simply tiring to use with non-standard interaction devices such
    as head-wands or mouth-sticks. The more intensely interactive a piece of software
    is, the more these issues become important and the more difficult it becomes to
    truly compensate for all interaction regimes. For most desktop software packages,
    interaction is not intense and does not come in short bursts. For these packages,
    inaccessibility tends to be an oversight or as a consequence of a lack of awareness
    of the issues. However, for some highly interactive software packages, such as
    video games, the problem may be more difficult to fully address (Heron, 2012).
    It is a problem not confined to software though – physical products too manifest
    many inaccessibilities (Heron et al., 2018a, 2018b).


    Large corporations can afford to have dedicated developers whose sole job is to
    work on software accessibility. Small projects, open-source or otherwise, tend
    to be mostly autheured-driven products. Research software in particular, especially
    that written for a particular project or research team, can rarely muster development
    time beyond the lifespan of the funding (Heron et al., 2013a). Some systems are
    primarily written to test a concept or fulfil an immediate need. Such software
    is only incidentally accessible unless explicitly written for the purposes of
    accessibility research (c.f., Heron et al., 2013b, 2013c).


    In our case study, our postgraduate student has encountered an inaccessible piece
    of research software. The additional logistical overhead this creates has put
    restrictions on his operating flexibility. He could only access the research data
    that other people could provide for him. We already know from earlier articles
    in the study that the set of people who had any access to the data as highly restricted.
    Such constraints make full, effective oversight of data and its analysis extremely
