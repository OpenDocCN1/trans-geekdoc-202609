- pgno: 234
  md: '+   5. Respect for intellectual property

    +   6. Respect for societal norms


    One of the first attempts to codify rules of behaviour for machines is to be found
    in Isaac Asimov’s ‘Three Laws of Robotics’. It’s striking to see the difference
    between these predictive clauses and the priorities facing policy makers in the
    next few years:


    +   1. A robot may not injure a human being or, through inaction, allow a human
    being to come to harm.

    +   2. A robot must obey orders given to it by human beings except where such
    orders would conflict with the First Law.

    +   3. A robot must protect its own existence as long as such protection does
    not conflict with the First or Second Law.


    We have not reached the point at which we need to worry so much about autonomy
    in machines – AI is a fragmented field of incompatible techniques that do not
    cohere into a general replica of human intelligence. When algorithms make decisions,
    they do not reason about them the same way a human does. The concept of harm and
    injury is something that is not governed by intention, but by gaps in training
    data or overconfidence in the application of rudimentary algorithms to complex
    use-cases. That doesn’t diminish the associated harm but rather re-centres the
    responsibility for it onto those that build and use AI systems.


    An absence of bias would ensure that algorithms reflected society’s priorities
    rather than hidden quirks in a data set. Pursuing this as a goal would also force
    us to confront those biases that are hidden and those that are encoded second-hand
    in other information.


    Consider an algorithm designed to assess whether someone should be given a business
    loan. It is trained on a data set made up of people who repaid previous loans
    and those that defaulted. It doesn’t capture any data about names, or ethnicities,
    or gender. What it does capture is addresses, professions, educational levels,
    work experience, and so on. It seems to lack a racial bias, but only if we neglect
    to consider that there is often ethnic clustering around particular geographical
    areas. It seems to be gender neutral, but a look at the underlying sex-disaggregated
    data would reveal some professions are dominated by women rather than men and
    vice'
