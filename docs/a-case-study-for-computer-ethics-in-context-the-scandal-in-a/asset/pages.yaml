- pgno: 134
  md: 'More positively it can be viewed as an important part of meeting the promise
    of education as a public good and as a fulfilment of implied societal obligations
    (Ecklund et al., 2012). For others, it may be an attempt to build their own academic
    profiles, short-circuit traditional publishing loops, and guide cultural discussions.


    Acting in the public good was certainly the role that Professor Joanne Clements
    within the Scandal believed she was filling. She believed that the hard-nosed
    economic success of other departments should subsidise her own less profitable
    but culturally important role. Again, this is an issue where reasonable people
    may disagree. It can be hard to see the public good in academic discourse which
    is often seemingly explicitly engineered to prohibit real-world impact. We can
    see this in the often insular critical discussions around obscure texts that dominate
    certain literature departments.


    Much of this scholarly discourse is explicitly inaccessible, employing a jargon
    and a presumptive body of knowledge that prohibits any outsider meaningfully engaging
    with the work. The perception for many is that these fields are cliquish and ultimately
    ancillary. Their academic publications are perceived to be aimed at only a handful
    of others interested in the esoteric intricacies of a topic which the rest of
    the world is not invited to enjoy.


    Public grumbles of those that feel as if they should feel some benefit from their
    taxes are joined by the grumbles of those that feel they are subsidising the self-indulgent
    hobbies of others. However, it is rarely the case that these academic discourses
    are truly isolated from the real world, and will often come to inform future scholarship
    when rarefied deliberation of isolated academics filters down into the more accessible
    critical literature. From there, it eventually makes its way down closer to Earth
    in the curricula of university and high school English departments where it may,
    optimistically, go on to inspire or energise the wider public as part of a formal
    education programme. Part of the benefit of a university is that it can devote
    some of its focus to long-term impact in a softer, subtler way. As Collini (2012)
    notes in his Diary of a Don:


    > ++++ Home to lick wounds. Console self that the real thing, as all scholars
    know, is not the immediate reception of one’s work, but whether it goes on to
    play its part in stirring the thinking of its readers, some of whom may use it
    to help make their own book a little bit better. When that happens, then we really
    do have a'
