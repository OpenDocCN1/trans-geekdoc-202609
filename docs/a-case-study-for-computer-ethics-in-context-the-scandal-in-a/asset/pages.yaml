  md: 'developing that kind of wisdom. That is especially true given how many papers
    are never read, and how many more are never cited. It has become a Sisyphean task
    for an academic to keep up with the output even within relatively narrow fields
    of specialism. There is, as Altbach and De Wit (2019) argue – too much research
    being published:


    > > There is too much pressure on top journals, there are too many books and articles
    of marginal quality, predatory journals are on the rise, and there is tremendous
    pressure on academics worldwide to publish.


    Still, in an increasingly quantified world, where universities live and die by
    their bibliometrics, it is hard to know what the alternative should be, particularly
    given that universities do not decide their priorities in a vacuum. Quantification
    of unquantifiable research value is increasingly demanded by funding bodies and
    the governments that supply them with their money. It is not unreasonable that
    they should see some returns on that investment of public money and that requires
    reporting on results. Clement believes the university – as a public institution
    – has lost its way. Taylor believes that it is a dangerous delusion to cling to
    the ivory tower of the past.


    For the part of the authors of this book, we believe part of the problem is in
    how academic work is contextualised. The word ‘research’ implies a process that
    establishes new facts (generates data) and reaches new conclusions (outputs knowledge).
    Thus, when we think of universities as research institutions, we bring those assumptions
    with us when we grade them on their outputs. Perhaps a subtle rebranding is in
    order to show that there is still room for a more gentle form of academic output
    that comes from engaging with the act of scholarship. Instead of academics thinking
    of themselves as researchers, we should perhaps be more prepared to think of ourselves
    as scholars – that our end goal is of somewhat grander ambition than to simply
    say something new in a form that contributes cleanly to our career path. As soon
    as someone works out how to square that with the demands of governmental oversight,
    that is.


    But still, it’s hard to say that this would inherently preferable over the current
    system, in which the speed at which knowledge is produced is perhaps one of the
    great achievements of the university sector. The question is what we believe is
    most valuable to society, and that’s something about which everyone may have differing
    opinions.'
