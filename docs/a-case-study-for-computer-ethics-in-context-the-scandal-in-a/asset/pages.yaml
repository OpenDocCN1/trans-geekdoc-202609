- pgno: 153
  md: 'Every single question in a survey flattens nuance, encodes biases, and renders
    complex judgements down into a single number. Perhaps those numbers are then averaged
    out, perhaps the ‘top line summary’ of a survey is based on a simplified ‘Did
    you enjoy the course’ question. In the end, all these averaged approximations
    from all these students are collated into a sense of how good the course was as
    judged by the metrics we could gather. Do they capture value? No. Do we value
    them anyway? Yes.


    We are not arguing here that student evaluation of courses is useless, because
    it isn’t. This is information – in the sense we have discussed earlier in this
    book – that we can refine into knowledge, and over time into wisdom. However,
    that only works when the figures are treated as such and not when they become
    part of formal performance management. At the university the authors are currently
    employed, a course that falls below a three (out of five) on the overall satisfaction
    grade becomes subject to a formal process of re-evaluation and re-design. What
    if the response rate was 20% and the 80% that didn’t answer loved the course?
    Doesn’t matter. The metric is what drives the policy.


    You probably see where we’re going with this …


    So, what is a professional incentivised to do here when these numbers measure
    only abstractions of quality, and the summation of those numbers activates formal
    performance measurement? Juice the numbers, of course. Okay, 75% of respondents
    said that the workload was too high. You can argue why the workload is appropriate
    and commensurate with what students will face in the real world (as in, you can
    stick to your guns that there is a pedagogic benefit to be had from the workload)
    … or you can soften the requirements of the course. Your number goes up (objectively,
    the course gets ‘better’) but the teaching value – the real, genuine, honest-to-god
    impact of the teaching – is worsened. Sixty percent of students say that they
    didn’t have enough prior knowledge to follow the course ‘advanced teaching of
    a thing’. You could raise entrance standards which students must achieve before
    they can take the course (and thus lower the number of students, which may result
