- pgno: 49
  md: 'Outright fraud might be in the minority. Cherry-picking data, unfortunately,
    is far more widespread. Partially this is a result of the publication bias against
    negative results – many journals won’t publish these at all, and papers that report
    on negative results rarely achieve the same kind of interest or prominence as
    the rest. This creates a natural incentive for people to simply not publish when
    the results are disappointing. This in turn creates a sense of false agreement
    in a field and slows down future research as investigative dead-ends are continually
    retried and re-explored. As such, researchers are sometimes tempted to search
    for significance even in insignificant data.


    Cherry picking is insidious and revolves around selecting only the desirable data
    and discarding the awkward ‘outliers’ before an analysis is performed. By far,
    more positive results are published than negative results. Sterling (1959) found
    out that 97% of the studies in four major psychology journals had shown positive
    results at a statistically significant level – only 3% of the studies reported
    on negative results. Sterling later repeated the study and found that on the whole
    nothing had changed. Fanelli (2012) has shown that the problem is getting worse.
    Recognising significant differences between countries and disciplines, on average
    the frequency of the publication of positive results increased 22% in the period
    between 1990 and 2007. There is no evidence that the situation has improved over
    the intervening years, although calls for more acceptance of negativity have been
    growing (Echevarria et al., 2021). The positive publication bias isn’t a result
    of people getting better at doing science, but instead a consequence of scientific
    publishing exhibiting its institutional biases.


    Malpractice is difficult to detect unless other researchers have access to both
    the raw data and the criteria by which data was included for analysis. Even if
    all of this is available, there is an additional bias in the scientific process
    that judges replicating of previous results to be less ‘valuable’ than new and
    unique contributions to the literature. Unless a result is especially striking
    or surprising, it’s often the case that it’s never replicated at all. Some fields
    are better at reproducing than others but as a whole reproducibility is something
    more honoured in the breach than in the observance.


    Incompetence in analysis too is a widespread problem – statistics are notoriously
    open to interpretation, and many researchers have little formal training in applying
    them to the analysis of data. This results in many papers being published where
    the statistical analysis is incorrect. It also means that the peer reviewers involved
    often lack the critical skills to identify the methodological issues before publication.
    The result is a confusing'
